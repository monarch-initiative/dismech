  details: |
    Addresses the ai4c-reviewer round on PR #11457. Evidence grew from 23 to 34 verified snippets.

    Corrected a factual error of mine. The PR body claimed no overlap-specific prevalence figures were available in the cached sources. That was wrong: PMID:42256626, committed in this same PR, gives 2-3% of SSc patients having overlapping PBC, a weighted 3.0%, and ~8% of PBC patients having SSc. Two Prevalence records now carry those, scoped to the SSc and PBC populations respectively rather than to the general population.

    reference_title backfilled onto all evidence items via scripts/backfill_reference_titles.py rather than hand-written, so the titles match cache frontmatter exactly.

    Interstitial lung disease added as a phenotype (HP:0006530) with HRCT-confirmed and cohort-frequency evidence. This also fixed a dangling treatment: Cyclophosphamide previously had no target_mechanisms and connected to nothing; it now targets the ILD node.

    The systematic review was under-consumed and is now the basis for several claims rather than one repeated snippet: the distinct-entity conclusion (on the canonical hypothesis group), shared HLA and IRF5/STAT4 susceptibility, shared TGF-beta/IL-6 signature, CENP-C epitope reactivity distinguishing the overlap from isolated SSc, and compartment-specific fibrosis in a new histopathology section.

    The shared_upstream_mechanism_unknown rationale previously asserted that no shared effector, antigen or locus had been shown. That contradicted a source cited in the same file. Reworded to the accurate claim: candidates exist (HLA, IRF5/STAT4, TGF-beta/IL-6, CENP-C) and none is established as explaining the co-occurrence, with the review's own caveat that the HLA alleles are not exclusive to either disease.

    The description previously said MONDO places this term under 'hereditary disease'. MONDO in fact dual-parents it under hereditary disease AND autoimmune disease. Corrected, which strengthens rather than weakens the entry's autoimmune reading.

    Trimmed a compound-direction REFUTE snippet on LBR so it carries only the refuting clause (the 27-patient SSc cohort), since the 400-control clause is graded SUPPORT elsewhere.

    Added a diagnosis section for AMA screening in a CREST patient with cholestasis, moving that claim out of treatments evidence where it did not belong.

    Not done: no deep-research artifact. Deep-research providers are unreachable from this environment (no credentials; api endpoints return no route) and the claude_code provider path needs WebSearch, also unavailable. A run record was not fabricated. Literature was gathered by direct PubMed E-utilities search, which is reachable, and every resulting snippet is exact-quote verified.

    Validation: linkml-validate clean, term validation passed, 34/34 snippets verified, reference validator clean, all offline gates pass.

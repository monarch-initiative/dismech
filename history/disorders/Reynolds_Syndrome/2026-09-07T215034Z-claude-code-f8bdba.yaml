  summary: 'Create: Reynolds Syndrome (PBC + limited cutaneous SSc overlap)'
  details: |
    Curated MONDO:0013276 as a Disease entry. The entry_type decision was the first piece of work: a 2026 systematic review of case-control studies (PMID:42256626) concludes SSc-PBC overlap 'represents a distinct clinical and immunological entity', with higher ACA and AMA positivity than either isolated disease and a predominance of the limited cutaneous subset, which is what justifies a disease entry over a kb/comorbidities record.

    The pathograph is modelled as two parallel autoimmune arms (PDC-E2 -> bile duct destruction -> cholestasis -> biliary cirrhosis; CENP-B -> microvascular injury and dermal fibroblast activation -> CREST features) rather than one chain, because no shared downstream effector has been demonstrated. That missing shared node is recorded as an explicit KNOWLEDGE_GAP discussion instead of being filled with a speculative node.

    Identity caveat handled deliberately: MONDO places this term under 'hereditary disease' and OMIM (MIM#613471) attributes a causal LBR gene, but that rests on one patient with one heterozygous missense variant (PMID:20522425), whose authors concluded only that 'LBR mutations might thus be associated with Reynolds syndrome'. A commentary the same year (PMID:20800400) asked whether the syndrome is a genetic laminopathy and stated the pathogenicity claim remained to be demonstrated. The entry follows the autoimmune reading, types LBR as SUSCEPTIBILITY rather than causal, carries a REFUTE evidence item against a general causal role, and records the question as a KNOWLEDGE_GAP with an EMERGING mechanistic_hypotheses group.

    Two bindings were deliberately not made. GO:0045254 (pyruvate dehydrogenase complex) was removed after term validation rejected it for MolecularFunctionTerm; it is a cellular component, and asserting PDH enzyme activity was not the claim anyway (the complex is an autoantigen here). A Dysphagia edge initially hung off the dermal fibroblast node was moved to the CENP-B subset node with INDIRECT_UNKNOWN_INTERMEDIATES, because dermal fibroblast activation does not cause oesophageal dysmotility.

    Validation: linkml-validate clean, term validation passed, 23/23 snippets verified against cached references, check-entity-refs and check-causal-targets clean.

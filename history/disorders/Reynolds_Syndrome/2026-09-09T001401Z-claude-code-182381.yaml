  summary: 'Review round 2: correct the ILD framing and curate the milder systemic
    phenotype'
  details: |
    Addresses the single blocking finding of the round-2 review on PR #11457. Evidence 34 -> 37 verified snippets.

    The defect was a framing error rather than a false statement. The ILD phenotype described it as 'a common and serious complication of the sclerodermatous arm' and quoted a 33% figure, which reads as 'ILD is prominent in Reynolds syndrome'. The best comparative evidence in a source this entry already cites ten times (PMID:42256626) says the opposite direction relative to isolated SSc: overlap patients have lower ILD, reflux and musculoskeletal involvement. Nothing asserted was untrue - the 33% is correctly attributed to the whole-SSc AMA-screening cohort - but the emphasis pointed the wrong way.

    The ILD description now states the direction on both sides: lower than SSc alone, higher than PBC alone, so intermediate rather than high. It also warns explicitly against reading the 33% whole-SSc figure as this syndrome's rate, because that number and the 33.3% overlap-subgroup figure in the same literature are easy to conflate.

    Three comparative evidence items added to the ILD phenotype from PMID:42256626: the review's own two-sided summary, the reciprocal PBC comparison, and the Lepri multinational cohort as an independent report of the same direction. The second original item (the case report's 'one of the most common and serious complications' line) was removed: it describes SSc generally rather than the overlap, and its explanation had generalised it into a claim about this syndrome.

    Graded SUPPORT rather than REFUTE. The reviewer offered either. Once the description states the intermediate direction, the comparative quotes support the corrected claim; a REFUTE item would have to argue against a claim the entry no longer makes.

    Added a Constitutional phenotype for the milder systemic involvement profile, which was the reviewer's wider point: the entry justified its existence on the review's distinct-entity conclusion while curating only the serological half of it. Deliberately not bound to an HP term - this is an organ-involvement profile, not a finding, and no HP term names it. The record is explicit that milder involvement is not a better prognosis, since some cohorts report higher SSc-related mortality and more oesophageal varices.

    The disease description now carries the same clinical half of the distinctness argument.

    Not done: still no deep-research artifact. The round-2 review referred that to a maintainer rather than treating it as blocking, and it remains impossible in this environment without fabricating a run record.

    Correction to the previous round's commit message: it said the case-report share of evidence fell to 36%; the reviewer measured 41%. 41% is right - my figure counted the top-level references block along with evidence items.

    Validation: linkml-validate clean, term validation passed, 37/37 snippets verified, reference validator clean, entity refs, causal targets, duplicate keys, enum values and qualifier terms all clean. The cyclophosphamide target_mechanisms link to the ILD node is intact.

  summary: Source the osteoclast acidification-versus-degradation distinction
  details: |
    Acts on finding 9 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    The entry asserted in both its top-level description and the 'Impaired Organic Bone Matrix Degradation' node that osteoclasts in pycnodysostosis can acidify the resorption lacuna normally but cannot degrade the demineralized organic matrix. This is the defining distinction from osteopetrosis, yet the node's only evidence was that cathepsin K is a major protease in bone resorption, and no cited reference mentioned acidification or demineralization at all.

    Fetched and attached two sources that state it directly. PMID:15070910 provides the human evidence from transiliac biopsies in two affected individuals: osteoclasts apposed to areas of demineralized matrix with undigested collagen left over, and osteoclastic parameters close to normal range despite deficient cathepsin K activity, which is precisely the acidification-intact / degradation-failed pattern. PMID:9811821 adds the cathepsin K knockout mouse, whose resorptive surface shows a broad demineralized matrix fringe containing undigested fine collagen fibrils, tagged MODEL_ORGANISM.

    Reference cache files for both were created with linkml-reference-validator, not by hand.

    Validated: schema, reference and term validation all pass.

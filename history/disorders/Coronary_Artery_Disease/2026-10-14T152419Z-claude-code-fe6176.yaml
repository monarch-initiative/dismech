  details: |
    Review round on PR 13918. Linked the treatment to Plaque Rupture and Thrombosis (INHIBITS) with directness INDIRECT, because the pilot trial measured platelet reactivity rather than thrombotic outcomes. Added the preprint's Conclusions sentence, which distinguishes the aspirin-free arm, as the primary evidence and kept the pooled-arm PRU sentence with an explanation saying it pools both ticagrelor arms. Corrected the description: aspirin was stopped at day 2, and the only MACE and clinically relevant bleed (1/17 each) were in the monotherapy arm. Added therapeutic_modality SMALL_MOLECULE and a clinical_trials row for NCT07622056 (phase 4, completed, per the ClinicalTrials.gov API), citing the cached registry record.

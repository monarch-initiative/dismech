  summary: Cite 4 evidence-free environmental exposures and correct three overstated
    notes, issue 8296 tranche 5
  details: |
    All four environmental exposures cited, and three notes turned out to claim more
    than any source supports.

    Smoking: PMID:15364185 (INTERHEART, 52 countries) for the effect size and population
    attributable risk, plus PMID:16920470 for the dose-response relationship, which the
    odds ratio alone does not establish. The prior note also asserted that smoking
    promotes endothelial damage; neither epidemiologic source carries that mechanism, so
    it was removed from the note and a review_notes entry points at pathophysiology as
    where it belongs with its own citation.

    High-Fat Diet: the note read "elevates LDL cholesterol". The Cochrane review
    PMID:32428300 reports only SMALL reductions in LDL when saturated fat is reduced,
    while the robust finding is a reduction in combined cardiovascular events. The note
    was rewritten to lead with the cardiovascular-event effect and to state that the LDL
    effect specifically is small. This citation qualifies the original claim rather than
    confirming it.

    Sedentary Lifestyle: the note read "contributes to metabolic syndrome". PMID:27997601
    separates low physical activity from sedentary behaviour and finds only the former
    significantly associated with metabolic syndrome -- screen-time sedentary behaviour
    was not significant overall. Cited as PARTIAL, explicitly as a caveat rather than
    support. The myocardial-infarction risk itself is evidenced separately by INTERHEART.
    The caveat source is an adolescent population, which is recorded: it is enough to
    show the claim needs qualifying, not enough to refute it in adults.

    Obesity: cited via INTERHEART, with two caveats in review_notes. The measure is
    abdominal obesity by waist/hip ratio rather than BMI, a more specific claim than the
    entry name suggests. And obesity is a disease entity with its own MONDO identity
    rather than an environmental exposure, so this entry models a host state in the
    environmental block -- the pattern tracked by issue 8551. It is cited rather than
    left bare so the evidence travels with the entry if it is later re-homed.

    Validation: just validate, just count-verified-snippets, the batched
    just validate-disorders sweep, just check-title-snippets.

  summary: 'Cite the weak diet associations at node level: Coronary_Artery_Disease'
  details: |
    Added link-level evidence to the existing High-Fat Diet edge, which asserted a claim with no evidence of its own; the entry-level Cochrane citation supports a cardiovascular-event reduction, not the subendothelial-retention node. Added PMID:40885400, a meta-analysis of 24 randomised complete-feeding trials (n=1011) reporting LDL cholesterol 15.72 mg/dL lower on higher polyunsaturated-to-saturated ratio diets when the diets differ in saturated fat, and no significant difference when they are saturated-fat-matched. Graded directness INDIRECT because the design removes saturated fat and the forward claim is inferred from that. This also supersedes the description's own qualifier that the LDL effect is small: that qualifier came from free-living trials, and controlled feeding shows a substantially larger effect, so the sentence was removed rather than left contradicting the new citation.

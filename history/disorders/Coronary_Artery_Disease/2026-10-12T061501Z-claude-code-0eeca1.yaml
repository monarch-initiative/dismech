  details: |
    Added Half-Dose Ticagrelor Monotherapy as an investigational treatment, supported only by a single 61-patient East-Asian randomized pilot preprint (PPR:PPR1272471, PRU-based pharmacodynamic primary endpoint). Ticagrelor bound to CHEBI:68558 (looked up with runoak sqlite:obo:chebi). Snippet verified against the cached preprint; ancestry effect deliberately not recorded as effect_modifiers because the preprint did not test a treatment-by-ancestry interaction. Issue #6388.

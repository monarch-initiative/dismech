  summary: 'Curate: Icosapent ethyl mechanism gap'
  details: |
    Added a population-bounded icosapent ethyl treatment record, one emerging coronary plaque-remodeling hypothesis, and an open mechanism/comparator knowledge gap. REDUCE-IT is modeled as a randomized event contrast rather than proof of a mediator; EVAPORATE plaque change remains a surrogate without clinical mediation; and the REDUCE-IT biomarker substudy is used to prevent mineral-oil-arm worsening from being mislabeled as direct anti-inflammatory action. Proposed an inert-comparator temporal mediation trial with prespecified lipid, remnant, inflammatory, endothelial, platelet, plaque, clinical-event, and safety readouts. No new causal pathophysiology edge or triglyceride-independent mechanism was promoted. Work addresses GitHub issue 5967.

  summary: 'Curate: Icosapent ethyl mechanism gap'
  details: |
    Added a population-bounded icosapent ethyl treatment record, one emerging coronary plaque-remodeling hypothesis, and an open mechanism/comparator knowledge gap. REDUCE-IT is modeled as a randomized event contrast rather than proof of a mediator; the small EVAPORATE imaging trial remains a surrogate without clinical mediation; and the REDUCE-IT biomarker substudy prevents mineral-oil-arm worsening from being mislabeled as direct anti-inflammatory action. The focused seed explicitly compares plaque remodeling with remnant/apoB, platelet, inflammatory-resolution, endothelial, membrane/oxidation, achieved-EPA/postrandomization, and comparator explanations. Proposed an inert-comparator temporal mediation trial with prespecified molecular, plaque, clinical-event, and safety readouts. Corrected the entry identity from broad ASCVD to coronary atherosclerosis and repaired the arterial-wall lipid-storage and decreased nitric-oxide-process annotations. No new causal pathophysiology edge or triglyceride-independent mechanism was promoted.

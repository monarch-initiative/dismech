  summary: 'Review response: record that the High-Fat Diet exposure term is broader
    than its evidence, issue 8296 tranche 5'
  details: |
    Review on PR 8563 observed that the bound exposure term is total dietary lipid
    while the citation concerns saturated fat specifically. That distinction matters,
    because trials reducing total fat do not show the same cardiovascular event
    reduction that saturated-fat reduction trials do, so the term is genuinely broader
    than the evidence supporting it.

    Searched ECTO for a saturated-fat-specific exposure class. There is none -- the
    matches are CHEBI and CDNO chemical classes, which are not exposure classes and
    would not validate against the exposure-term enum. The term therefore stays as it
    is, and a review_notes entry records the mismatch and the search so the next curator
    does not repeat it.

    The note already said saturated fat explicitly, so the claim itself was correctly
    scoped; what was missing was the record that the term is not.

    Revalidated: just validate, just count-verified-snippets.

  summary: 'Integrate assessed OpenScientist findings: ANCHOR apoB/remnant lowering'
  details: |
    Reviewed the OpenScientist report for hypothesis icosapent_ethyl_coronary_plaque_remodeling_model against the existing assessment sidecar openscientist-assessment-by-codex.yaml (verdict PARTIALLY_SUPPORTED). No second assessment was written. Working from that assessment's RETAINED and QUALIFIED claims only, four of the five were already fully curated in this entry: imaging-phenotype (EVAPORATE PMID:32860032, CHERRY PMID:28863874, OCT PMID:32805184 all already carry quoted evidence on the plaque-remodeling hypothesis), missing-event-mediation (covered by the hypothesis description and by discussion gap_icosapent_ethyl_event_reduction_mechanism), mineral-oil-confounding (PMID:35762321 and PMID:38873793 already quoted in that discussion with the same sensitivity-not-established framing), and cherry-replication (the existing PMID:28863874 explanation already states the open-label EPA 1.8 g/day post-PCI design differences that block a direct IPE 4 g replication label). The NEEDS_VERIFICATION claim about the unretrievable PMID:40397711 was out of scope for integration. Only the QUALIFIED apob-full-explanation claim carried an uncited citation, PMID:31277790 (post hoc ANCHOR hsCRP analysis), which was fetched and integrated as two evidence items on the existing icosapent_ethyl_atherogenic_particle_lowering_model hypothesis: one quoting the randomized 12-week remnant lipoprotein cholesterol and apolipoprotein B reductions without an LDL-C rise, and one quoting the post hoc 246-of-702 hsCRP-selected design so the subgroup limitation travels with the numbers. Both explanations state that no coronary plaque and no clinical events were measured, preserving the assessment's judgment that neither the plaque route nor the event route is demonstrated by mediation. The hypothesis description was pluralized from 'A short-duration ANCHOR analysis' to 'Short-duration ANCHOR analyses' now that two ANCHOR analyses are cited. Deliberately not changed: status stayed EMERGING per the report's own curation lead; no new pathophysiology node or causal edge was added, because the report's proposed IPE to apoB to arterial retention to plaque chain is explicitly INFERRED and its plaque-to-event step is the unresolved gap already recorded in discussions; no new knowledge-gap discussion was added, because gaps G1, G2, G3 and G7 are already covered by gap_icosapent_ethyl_event_reduction_mechanism and its multi-comparator temporal mediation experiment; no ontology terms were bound, since none of the report's candidate terms (low-attenuation coronary plaque, fibrous-cap thickness, remnant cholesterol) are present in this repo's caches.

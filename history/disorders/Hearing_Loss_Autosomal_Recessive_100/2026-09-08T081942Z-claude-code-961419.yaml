  summary: 'Create: hearing loss, autosomal recessive 100 (DFNB100)'
  details: |
    De novo curation of DFNB100 (MONDO:0032740, OMIM:618422, hgnc:29035 PPIP5K2) from the single existing publication, PMID:29590114 (Yousaf et al., PLoS Genet 2018). PubMed searched 2026-09-08: PPIP5K2 AND (hearing OR deafness) returns one record; DFNB100 returns the same one. OMIM 618422 verified three ways independently of the prompt - MONDO xref, NCBI MedGen concept 1682525, and NCBI mim2gene_medgen, which also gives 611648 as the gene-level MIM for NCBI Gene 23262.

    Mechanism curated as a five-node chain from PPIP5K2 p.Arg837His catalytic imbalance (21 percent lower IP8 phosphatase activity, 60 percent higher IP8 accumulation in the kinase assay) through increased 5-InsP7 to InsP8 flux, disrupted PP-IP homeostasis in the cochlear sensory epithelium, outer hair cell dysfunction and degeneration, to loss of cochlear amplification. Evidence graded by cited study design: IN_VITRO for the enzymology, MODEL_ORGANISM for the mouse, HUMAN_CLINICAL for the audiometry and otoacoustic emissions. All evidence snippets were extracted programmatically from references_cache/PMID_29590114.md rather than retyped; all 33 verify.

    Module conformance deliberately partial. One node conforms to sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult. The other four module nodes were declined with reasons recorded in notes: the ionic-homeostasis/oxidative-stress node because neither half was assayed and the stria was histologically normal; the mechanotransduction/death central effector because it bundles untested mechanotransduction failure with an apoptotic process the authors offer only as a hypothesis; the amplification/spiral-ganglion node because spiral ganglion degeneration was specifically looked for and not found; and the progressive-hearing-loss node because the human phenotype is prelingual and non-progressive, progression being a property of the mouse only.

    Two discussions recorded: a HUMAN_MODEL_MISMATCH for the mouse-human severity and onset discrepancy (confounded by allele, since the mouse carries a phosphatase-domain truncation with a 23-fold kinase gain rather than the missense allele), and a KNOWLEDGE_GAP for the unmeasured step from raised InsP8 to selective outer hair cell death.

    Dropped for lack of quotable support: a 'normal middle ear function on tympanometry' phenotype row. Its only substantive source sentence embeds a bracketed subject list that the reference validator strips before matching, and every bracket-free fragment attributes the normal result to the unaffected relative alone. The finding is carried in the hearing-loss phenotype description and the tympanometry diagnosis row instead. Penetrance and expressivity left UNKNOWN rather than COMPLETE/CONSISTENT: two families and one allele will not support a quantitative statement.

    Deep research: claude_code provider, preflight-dr PASS, reference_validation 2/2 verified with confabulation_rate 0.0, term_validation 16 terms with 1 mislabelled. Used as leads only. Three of its outputs were rejected against the sources - CL:0002095 offered for the outer hair cell is hilus cell of ovary (entry uses CL:0000601); HP:0000998 offered with a hearing-loss label is Hypertrichosis, caught by the run's own term validation (entry uses HP:0000399); and its statement that a founder effect was not established is contradicted by the paper, which reports the flanking haplotype as consistent with one.

    Validation run to completion: just validate (32/32 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-qualifier-terms-online, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-source-defect-claims (entry not flagged), check-environmental-evidence, and validate-disorders.

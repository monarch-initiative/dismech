  summary: 'Second review round: prevalence band and stale notes paragraph'
  details: |
    Second review round on PR #9206. Both new findings from the re-review were correct and are fixed.

    The prevalence_class was BELOW_1_IN_1000000 against a rate_per_100000 of 0.26. The schema defines BELOW_1_IN_1000000 as less than 0.1 per 100,000 and BAND_1_9_PER_1000000 as 0.1 to 0.9 per 100,000, so 2.6 per million belongs in the latter; the record contradicted its own numeric fields and understated the rarity tier by a decade. Corrected to BAND_1_9_PER_1000000. Nothing in the repository gates on band/rate agreement, which is why it needed catching by eye.

    The notes paragraph claiming no frequency bands are assigned to phenotypes was true of the first commit and stale after the second, which added FREQUENT to dry mouth and erectile dysfunction. Rewritten to state what is actually true: two phenotypes carry evidence-backed bands from directly measured percentages in PMID:9443463, and the remainder are deliberately unbanded because the cited review describes the triad qualitatively - with the distinction between a phenotype frequency and the review's test-characteristic and comorbidity numbers preserved.

    Because the band error is a class of mistake rather than a typo, every prevalence record in this session's three neurological entries was re-checked programmatically against scripts/migrate_prevalence.py's own bucketing function. That found a second instance the reviewer had not flagged, in the Osmotic Demyelination Syndrome entry on PR #9207: rate_per_100000 of 230.0 carrying BAND_1_5_PER_10000 where 230 per 100,000 is ABOVE_1_IN_1000. It is fixed on that branch in a separate commit. All six prevalence records across the three entries now agree with their own rates.

    Validation: just validate clean; just validate-terms clean; 43/43 evidence snippets verified against the local reference cache; check-duplicate-keys and check-folded-hyphens clean.

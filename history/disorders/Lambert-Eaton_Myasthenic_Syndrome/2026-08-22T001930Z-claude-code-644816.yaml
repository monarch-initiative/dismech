  summary: 'Create: Lambert-Eaton Myasthenic Syndrome'
  details: |
    New entry for Lambert-Eaton myasthenic syndrome (MONDO:0018556), an autoimmune presynaptic disorder of neuromuscular transmission.

    Curated around the contrast with myasthenia gravis, because the contrast is what makes the mechanism legible: MG attacks the postsynaptic acetylcholine receptor, LEMS the presynaptic calcium channel. That single difference in locus predicts the whole clinical inversion - reflexes lost rather than preserved, weakness briefly improving with exertion rather than worsening, autonomic involvement rather than none, and a drug acting by prolonging the nerve terminal action potential rather than by inhibiting acetylcholinesterase.

    Three deliberate curation decisions worth recording:

    There is NO genetic section. CACNA1A encodes the channel the antibodies attack, so the gene is easy to reach for, but LEMS is not a channelopathy: the gene is not mutated and an autoantibody removes a normal channel from a normal terminal. A first draft included a genetic entry with relationship_type OTHER; schema validation rejected it because OTHER is not in the enum, and the rejection was right for a better reason than it gave - every available value (CAUSATIVE, RISK_FACTOR, SUSCEPTIBILITY, MODIFIER, BIOMARKER, DISPUTED, UNKNOWN) asserts a genetic relationship that does not hold. The channel's identity is curated on the antibody-target node, where it is true.

    PMID:41945880 was found and deliberately not used. It is a randomised trial of amifampridine in MYASTHENIA GRAVIS, not LEMS - the same drug in the neighbouring disease. Citing it would have been a subtle substitution: drug name and trial design both look correct.

    MONDO has an obsolete term for this concept (MONDO:0000287) alongside the live MONDO:0018556. A synonym-aware t~ search returns both; a label-only search or taking the first hit would risk the obsolete one. This is the third distinct ontology-search failure mode encountered in this session's batches, and the t~ habit caught it.

    The DELTA-P tumour-prediction score is curated as a definitions entry with derivation_basis ESTABLISHED_CRITERIA and validation_status VALIDATED_AGAINST_GOLD_STANDARD (derived in 107 Dutch patients, validated in 112 British). All seven predictors are quoted in full so the score is reproducible from the entry.

    The 3,4-diaminopyridine evidence is a randomised WITHDRAWAL trial, not a conventional placebo start - the drug had been in use thirty years without conclusive evidence, so patients stable on it were tapered to placebo or continued. 0 of 14 continued deteriorated versus 72% of 18 tapered. The design context is curated as a PARTIAL evidence item because it is what makes the result interpretable.

    GeneReviews: checked and absent ('Lambert-Eaton GeneReviews[All Fields]' returns zero).

    Deep research: claude_code provider; the report was generated without a reference_validation frontmatter block, so one was retro-fitted with just validate-research-reference. Nothing from the report is cited - the reference set was assembled independently by direct PubMed search and every cited paper read.

    Validation: just validate passed with 13/13 snippets verified, just validate-terms passed, all six offline gates clean, pathograph 3 nodes / 2 edges / 1 component with all foreign keys resolving.

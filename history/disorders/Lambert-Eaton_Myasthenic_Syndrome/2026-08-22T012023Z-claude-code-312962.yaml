  summary: 'Review round: DELTA-P correction, paraneoplastic trigger, treatment split,
    phenotypes'
  details: |
    Review round on PR #9206, addressing all four IMPORTANT findings from the automated reviewer plus three of its non-blocking suggestions. Every finding was verified against the cached source before acting; all four were correct.

    Finding 1, the DELTA-P score, was a real error and is corrected. PMID:21245427 names seven independent predictors of SCLC and then, in the next sentence, allocates one point to each of six scored items - SOX1 serology is deliberately excluded, which is what the paper means by "the simple clinical DELTA-P score" and why the maximum score is 6. The entry described the seven predictors as if they were the scored items. The definitions entry now states both lists and why they differ, and two further snippets were added: the scoring rule itself and the calibration table, which independently confirms the maximum is 6. The error had propagated into the seronegativity knowledge gap as a doubly wrong claim - that tumour screening is driven by a score including SOX1 status, and by implication that SOX1 is the antibody the seronegativity refers to. That rationale is rewritten: DELTA-P contains no serology at all, so a VGCC-seronegative patient enters the screening pathway with nothing missing, and SOX1 is a nuclear SCLC tumour antigen rather than the presynaptic channel.

    Finding 2, the missing paraneoplastic trigger, is now a pathophysiology node upstream of antibody production, curated with INDIRECT_UNKNOWN_INTERMEDIATES because the cached evidence establishes the tumour antigen, the antibody response and the association but not the steps by which tolerance breaks. PMID:18032743 supplies the specific mechanism (SOX1 identified as a highly immunogenic SCLC tumour antigen; antibodies in 64% of LEMS with SCLC and 0% of idiopathic LEMS), and PMID:31831596 supplies the counterpart the node would be misleading without: the same anti-tumour response confers a survival advantage, 17 versus 7.0 months against non-LEMS SCLC.

    Finding 3, bundled treatments, is split. "Tumour Treatment and Immunosuppression" becomes two entries with distinct target_mechanisms - tumour treatment INHIBITS the paraneoplastic trigger node, immunosuppression INHIBITS the antibody node - so the antibody node now has a treatment edge where it previously had none, and the three treatments sit at three different levels of the chain. Immunosuppression is deliberately curated without a named agent: corticosteroids, azathioprine, IVIG and plasma exchange are standard practice, but the cached sources establish the arm without stating a regimen, and naming agents whose evidence is not in the cache would be an unsupported assertion. This is recorded in notes as work needing a reference fetched first.

    Finding 4, phenotype coverage, adds five phenotypes the entry's own prose and snippets already referred to: xerostomia (HP:0000217), autonomic erectile dysfunction (HP:0008652, the autonomic-specific term rather than the generic one, which is what the mechanism supports), dysphagia (HP:0002015) for bulbar involvement, ptosis (HP:0000508) and diplopia (HP:0000651).

    Non-blocking suggestions also taken: the antigenic-modulation intermediate node is added between antibody production and reduced release, carrying the cross-linking experiment from PMID:2853605 with its internal negative control (divalent IgG and F(ab')2 deplete active zone particles, monovalent Fab does not) - this makes the entry say why the antibody removes the channel rather than only that it does; prevalence is added from PMID:27997683 (2.6 and 3.3 per million); and category moves from Complex to Autoimmune, matching the sibling Adult-Onset Myasthenia Gravis entry. A passive-transfer mouse model is added under animal_models with modeled_mechanisms and a readout, since it is what establishes that the antibody alone is sufficient.

    A separate self-caught error is corrected in the same round. The previous notes claimed a Reference Validation section had been retro-fitted onto the deep-research report with just validate-research-reference. It had not - the recipe fails in this environment on TLS certificate verification at api.crossref.org, and the report carries neither a frontmatter block nor the section. The intent had been recorded as the outcome. The note now states the failure plainly and states what is actually true about provenance: the first curation round cited nothing from the report, and this review round drew five PMID leads from it (2853605, 18032743, 27997683, 29125190, 31831596), each fetched, read in full, and snippet-verified against the cache.

    Two further cached-but-uncited references were reconciled in the same pass rather than pruned, because both bear directly on claims the entry already made. PMID:9443463 gives quantitative autonomic testing in 30 patients: dry mouth 77%, impotence 45% of men - which supplies the FREQUENT frequency bands for the two autonomic phenotypes added above, so each band now carries its own quantitative evidence rather than being asserted. The same study reports an abnormal composite autonomic score in 93%, corroborating that dysautonomia is near-universal as the shared-antigen account predicts, and 93% P/Q-type seropositivity, independently corroborating the ~90% figure from a cohort two decades earlier. It also carries a caveat now curated on the antibody node as PARTIAL rather than left out: no autoantibody correlated with autonomic dysfunction severity, so the shared antigen explains why autonomic involvement occurs without explaining how severe it will be. PMID:8583238 is added to the seronegativity knowledge gap, which previously listed antibodies against a different presynaptic target as an unexamined possibility; that study found synaptotagmin antibodies in 6 of 20 LEMS sera, 3 of them with no VGCC cross-reactivity at all, so the possibility is partly investigated rather than speculative. Both items are marked PARTIAL where the study cannot quantify the seronegative remainder.

    Four other fetched references (10683522, 21243240, 38497229, 7891097) were read and pruned as not supporting any claim the entry makes.

    Pathograph after this round: 5 nodes, 4 edges, one connected component, no dangling references. Cited references reconcile exactly with the references block in both directions.

    Validation: just validate clean; just validate-terms clean; 43/43 evidence snippets verified against the local reference cache; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-cache-order all clean.

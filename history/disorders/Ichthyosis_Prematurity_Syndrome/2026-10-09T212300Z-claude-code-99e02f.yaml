  summary: 'Create: Ichthyosis_Prematurity_Syndrome'
  details: |
    New entry for ichthyosis prematurity syndrome (MONDO:0012089; SLC27A4/FATP4, hgnc:10998), curated from a Perplexity deep-research report (research/Ichthyosis_Prematurity_Syndrome-deep-research-perplexity.md) plus primary papers found through PubMed. The report's 25 references all resolved; its one off-topic reference (PMC:PMC8613581, a renal agenesis GO-enrichment study) was not used. The report's pointer to a GeneReviews recommendation for SLC27A4 testing was not used, because PubMed returns no GeneReviews chapter for this disease and the only ichthyosis chapter is the ARCI one. PMID:39189679 (Finnish congenital ichthyosis testing study) was read and dropped because its abstract does not mention IPS. Case reports without a PubMed abstract (PMID:26341232 KID-like presentation, PMID:40664333 and PMID:42598826 hyper-IgE-like presentation, PMID:27224495, PMID:41805040) could not be quoted and were not cited, so those two differentials are not recorded. ORPHA:88621 could not be fetched by the reference fetcher, so the Orphanet prevalence class was not recorded. The pathograph runs FATP4 acyl-CoA synthetase deficiency -> reduced omega-O-acylceramide -> epidermal barrier failure, branching to hyperkeratosis (scale), corneocyte shedding into amniotic fluid (polyhydramnios, membrane separation, aspiration -> respiratory distress/asphyxia, and an UNKNOWN edge to premature birth) and to type 2 sensitization (eosinophilia, IgE, allergy, pruritus), conforming to epidermal_cornification_failure and epithelial_barrier_dysfunction. preflight-dr exited 2 for lack of a local mondo.db; the report was checked by hand and is about SLC27A4 throughout. Validation: just validate clean, validate-terms clean, 112/112 snippets verified, entity refs, causal targets, duplicate keys, qualifier terms and coarse phenotypes clean; check-genereviews NO_CHAPTER; 15/17 phenotypes causally connected (alopecia and hypohidrosis left unconnected, mechanism unknown). just validate-disorders passed (schema, terms, 112 snippets, 0 issues); whole-KB snippet-length, title-snippet, snippet-grading, folded-hyphen, retired-prose and reference-title ratchets reported nothing new.

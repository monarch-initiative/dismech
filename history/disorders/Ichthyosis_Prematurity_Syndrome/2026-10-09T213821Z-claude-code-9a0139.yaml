    Review round 1 on PR 13817. The Fatp4 targeted knockout mouse link to Reduced Epidermal omega-O-Acylceramide Synthesis was recorded at model_scale MOLECULAR against a CELLULAR node with no limitations, which failed check_upward_extrapolating_links_are_caveated. The model's acylceramide readout is lipidomics of whole epidermis from the intact animal, so model_scale is now TISSUE, and a limitations statement records that the measurement comes from a neonatally lethal null mouse, does not localise the step within keratinocytes, and has no counterpart measurement in patient epidermis. model_scale_audit now reports 3 aligned, 3 model-above-target and 1 undetermined link, with no upward extrapolation. Suggestions not taken: polyhydramnios stays FREQUENT because the source's own figure is 27 of 59 (45.8%) and the description already names the 2 recorded absences and 30 unreported cases; no carrier, prenatal or PGT sentence was added to genetic counselling because no cached source states it; the FATP4-knockdown keratinocyte model stays experimental_model_type OTHER because the PMID:31974308 abstract says only 'human keratinocytes' and does not say whether they were primary cells or a line. Validation: pytest test_data -k Ichthyosis_Prematurity 2 passed; validate, validate-terms, 112/112 snippets, entity refs, causal targets and validate-disorders all clean.

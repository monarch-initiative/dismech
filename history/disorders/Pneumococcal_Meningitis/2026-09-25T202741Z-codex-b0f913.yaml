  summary: 'Create: Pneumococcal Meningitis'
  details: |
    New entry for pneumococcal meningitis (MONDO:0006913), caused by Streptococcus pneumoniae. Duplicate preflight checked the current knowledgebase, all PR states, and all issue states for MONDO:0006913 and the pneumococcal meningitis label; the only existing curation was the parent Bacterial_meningitis entry and related pneumococcal references, not a dedicated disorder file.

    Deep research: one OpenScientist run completed for Pneumococcal_Meningitis and is committed as research/Pneumococcal_Meningitis-deep-research-openscientist.md with its citations and artifacts. The report's references resolved, and just preflight-dr skipped only because MONDO records no causal human gene for this acquired infection. The MONDO record was checked manually to confirm the label, synonyms, pneumococcal infection parentage, and NCBITaxon:1313 equivalence. The report's term_validation needs_review was heeded: no HPO/UBERON labels were copied without an OAK read-back, the report's table-cell labels for HP:0000407, HP:0002181, HP:0100543, UBERON:0002361 and UBERON:0001844 were not used as ontology labels. Host modifier genes such as C5, MBL2, CFH and C2 were kept for a future susceptibility pass rather than modeled as causal etiology in this agent-defined acquired-infection entry.

    The pathophysiology chain is S. pneumoniae nasopharyngeal colonization -> invasive pneumococcal bacteremia -> blood-brain-barrier crossing -> CSF pneumococcal replication -> C5-linked subarachnoid inflammation -> MMP- and ROS-mediated brain injury, with a parallel CSF-replication branch to pneumolysin-associated neuronal and cochlear injury. Downstream pathograph edges connect the inflammatory and toxin-mediated mechanisms to fever, altered mental status, neck stiffness, headache, seizure, cerebral edema, hydrocephalus, and sensorineural hearing impairment. It cites the Mook-Kanamori pathogenesis review for the overall route, Woehrl 2011 for C5aR-dependent inflammatory injury in mouse pneumococcal meningitis with human CSF C5 correlation, a matrix-metalloproteinase inhibitor rat study and a vitamin-B6/APE1 rat study for inflammatory brain injury, and Tabusi 2021, Braun 2007 and Perny 2017 for pneumolysin-driven neuronal and organ-of-Corti injury.

    Phenotypes are deliberately limited to cohort-backed acute findings, intracranial complications, or sequelae: fever, altered mental status, neck stiffness, headache, seizure, cerebral edema, hydrocephalus and sensorineural hearing impairment. Frequency bands come from the 187-case Danish nationwide pneumococcal meningitis cohort for admission findings and hearing loss and from an 87-adult pneumococcal meningitis series for edema and hydrocephalus. Epidemiology and burden entries capture PSERENADE incidence surveillance after PCV10/PCV13 rollout and GBD 2021 pediatric Streptococcus pneumoniae meningitis mortality/DALYs. Environmental context records primary otogenic, pneumonic and sinusitic foci from the Danish cohort. Diagnosis entries cover CSF/blood-culture case confirmation and CSF lactate as a bacterial-versus-aseptic meningitis discriminator. Animal-model entries cover intracisternal infant-rat pneumococcal meningitis for inflammatory brain injury and a C5aR-deficient mouse perturbation for complement-linked inflammation.

    Treatment entries cover urgent empiric antibiotic therapy and adjunctive dexamethasone from the ESCMID-guideline review, plus pneumococcal vaccination from the 2025 PSERENADE global surveillance analysis. All evidence carries reference titles, and review or background claims are annotated with quote_role rather than explaining evidence_source = OTHER from publication type alone.


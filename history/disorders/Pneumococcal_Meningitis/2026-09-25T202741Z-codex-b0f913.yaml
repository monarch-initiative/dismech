  summary: 'Create: Pneumococcal Meningitis'
  details: |
    New entry for pneumococcal meningitis (MONDO:0006913), caused by Streptococcus pneumoniae. Duplicate preflight checked the current knowledgebase, all PR states, and all issue states for MONDO:0006913 and the pneumococcal meningitis label; the only existing curation was the parent Bacterial_meningitis entry and related pneumococcal references, not a dedicated disorder file.

    Deep research: one OpenScientist run completed for Pneumococcal_Meningitis and is committed as research/Pneumococcal_Meningitis-deep-research-openscientist.md with its citations and artifacts. The report's references resolved, and just preflight-dr skipped only because MONDO records no causal human gene for this acquired infection. The MONDO record was checked manually to confirm the label, synonyms, pneumococcal infection parentage, and NCBITaxon:1313 equivalence. The report's term_validation needs_review was heeded: no HPO/UBERON labels were copied without an OAK read-back, the report's table-cell labels for HP:0000407, HP:0002181, HP:0100543, UBERON:0002361 and UBERON:0001844 were not used as ontology labels, and host modifier genes such as C5, MBL2, CFH and C2 were not modeled as disease etiology.

    The pathophysiology chain is S. pneumoniae nasopharyngeal colonization and invasive bacteremia -> blood-brain-barrier crossing with free CSF replication -> C5-linked subarachnoid inflammation -> pneumolysin-associated neuronal and cochlear injury. It cites the Mook-Kanamori pathogenesis review for the overall route, Woehrl 2011 for C5aR-dependent inflammatory injury in mouse pneumococcal meningitis with human CSF C5 correlation, and Tabusi 2021, Braun 2007 and Perny 2017 for pneumolysin-driven neuronal and organ-of-Corti injury.

    Phenotypes are deliberately limited to cohort-backed acute findings or sequelae: fever, altered mental status, neck stiffness, headache, seizure and sensorineural hearing impairment. Frequency bands come from the 187-case Danish nationwide pneumococcal meningitis cohort. Treatment entries cover urgent empiric antibiotic therapy and adjunctive dexamethasone from the ESCMID-guideline review, plus pneumococcal vaccination from the 2025 PSERENADE global surveillance analysis.

    Validation: just validate kb/disorders/Pneumococcal_Meningitis.yaml passed after 17/17 snippets were checked; just validate-terms passed; just count-verified-snippets reported 17/17 snippets verified against cached references.

  summary: 'Create: Neurodevelopmental_Disorder_With_Poor_Growth_And_Behavioral_Abnormalities'
  details: |
    New entry for MONDO:0859377 (OMIM 620242), the autosomal recessive
    ATP9A disorder, curated as entry_type DISEASE from the stub of the same
    name (stub deleted).

    Lump/split: MONDO defines this entity by biallelic ATP9A variants.
    Heterozygous de novo ATP9A missense variants (PMID:40226306) and de novo
    truncating/splice variants in schizophrenia (PMID:42757772) have no MONDO
    term of their own; they are described in notes only and none of their
    phenotypes or the proposed dominant spine-maturation mechanism is curated
    here. The deep-research report merged both inheritance modes into one
    disease ("dual inheritance"); that framing was not adopted. A homozygous
    missense VUS (PMID:41604004, Research Square preprint) is mentioned in
    notes but not curated as an allele.

    Deep research: openscientist
    (research/Neurodevelopmental_Disorder_With_Poor_Growth_And_Behavioral_Abnormalities-deep-research-openscientist.md).
    Reference validation 6/6 resolved, confabulation 0.0, 4/6 scored on topic
    and none off topic. Term validation flagged one mislabelled CURIE
    (HP:0011154 offered as "Receptive language delay"; it is Focal autonomic
    seizure); it was not used. The report names ATP9A in its first paragraph
    and its OMIM (620242) agrees with the MONDO xref from OLS.
    just preflight-dr could not run: the local MONDO SQLite build is absent
    and was not downloaded (the shared disk was near full during this
    session). All six report PMIDs were fetched, read and cited.
    Items taken from the report after reading the primary source: the
    MON2-DOPEY2-ATP9A / Wntless branch (PMID:30213940), 2-3 toe cutaneous
    syndactyly and cerebellar vermis hypoplasia (Table 1 and case text of
    PMID:34379057), and limb muscle weakness (case text of PMID:36604604).
    Not taken: the report's per-phenotype frequency table, which pools counts
    across sources with differing denominators; no frequency band is set on
    any phenotype.

    Additional references found by PubMed search outside the report:
    PMID:40876594 (cryo-EM and lipid-stimulated ATPase activity of ATP9A),
    PMID:30947313 (ATP9A knockdown increases exosome release).
    GO molecular function GO:0140326 was chosen over a substrate-specific
    flippase term because ATP9A substrate specificity is not settled (the
    cryo-EM paper reports stimulation by PS, PI and phosphoinositides).

    Diagnosis and treatments record only what the case reports state:
    exome sequencing and Sanger segregation; valproate seizure control (one
    patient), fundoplication and gastrostomy (one patient), and two recorded
    non-responses (proton pump inhibitors for emesis; rehabilitation), the
    latter graded REFUTE. No disease-specific therapy exists.

    GeneReviews: just check-genereviews reports NO_CHAPTER with synonyms set.

    Validation: just validate, validate-terms, count-verified-snippets
    (61/61), check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-coarse-phenotypes, check-qualifier-terms,
    check-block-scalar-comments, check-folded-hyphens, check-folded-yaml,
    check-snippet-length, check-snippet-grading, check-reference-titles,
    check-title-snippets, check_gene_activity_grounding --against-ref
    origin/main, validate-disorders.

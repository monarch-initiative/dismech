  summary: 'Review round 1: add reported ATP9A alleles and three phenotypes'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 15621. Added six ATP9A alleles to genetic[0].variants, each with an exact quote from a cached full text: c.799+1G>T (homozygous, Pakistani family 1) and c.327+1G>T (homozygous, Iranian family 2) from PMID:34764295; c.433C>T p.Arg145* and c.658C>T p.Arg220* (compound heterozygous) and c.983G>A p.Trp328* (homozygous) from PMID:36604604; and c.2701G>T p.Glu901* from PMID:40226306, where it was maternally inherited alongside a de novo p.Arg145* in a patient the authors call biallelic (the cDNA change is taken from that paper's Table 1). PMID:40226306 is also added as a second report of p.Arg145*. Added phenotypes Visual impairment (HP:0000505, PMID:34764295), Joint hypermobility (HP:0001382), Knee flexion contracture (HP:0006380) and Elbow flexion contracture (HP:0002987), the last three from the single PMID:36604604 proband; no frequencies recorded. Heterozygous dominant-presentation variants remain out of scope. No new pathograph edges added. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), validate-disorders and the whole-repo offline gates.

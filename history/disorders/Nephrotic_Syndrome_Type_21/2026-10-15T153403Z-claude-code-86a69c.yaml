  details: |
    New entry for AVIL-related autosomal recessive steroid-resistant nephrotic syndrome (MONDO:0032826), claimed in issue 14344. The evidence base is one founding paper (Rao et al. 2017, PMID:29058690, full text cached), the ClinGen Glomerulopathy GCEP record (Limited, AR), the GeneReviews Genetic SRNS Overview, and the abstract of a 2026 Indonesian SRNS cohort that lists AVIL without per-patient detail. Deep research: falcon was requested but failed with 503 Failed to authenticate; the client classed it as a temporary server error, so neither --fallback nor --fallback-provider claude_code handed over. claude_code was then run directly (research/Nephrotic_Syndrome_Type_21-deep-research-claude_code.md; 8/8 references resolved; one term mislabel was a harmless paraphrase of HP:0000007). preflight-dr confirmed the report is about AVIL; PLCE1 mentions are the interaction partner, not a second disease. relationship_type is left unset because CAUSATIVE requires Definitive or Strong validity. The zebrafish CRISPR knockdown is recorded as FAILS_TO_RECAPITULATE, and a KNOWLEDGE_GAP discussion records the single-publication basis. A parallel session drafted a duplicate entry for the same disease (issue 14345, closed as duplicate); its consanguinity caveat and GeneReviews PMID tag were folded in here and its files deleted. The ClinGen cache file was generated from a local gene_validity.csv export dated 2026-10-15, newer than the manifest pin; its Source line records that date. A fresh-context review pass was applied (variants structured, edge types weakened where intermediates are known or unshown, unsupported GO terms dropped, Kidney Transplantation bound to NCIT:C15265). Validation: just validate-disorders passes; 45/45 snippets verified; entity refs, causal targets and term cache integrity pass.

  details: |
    Addressed the CHANGES_REQUESTED review on PR #9691 (six blocking items plus the non-blocking suggestions where sources were already cached).

    Blocking items:
    1. Added `reference_title` to all 27 pre-existing evidence items (titles taken verbatim from each references_cache/PMID_*.md frontmatter, never retyped from memory) plus a top-level `references:` block listing all 14 sources (13 PMIDs + the NCT05639283 trial summary) with titles.
    2. Added a `diagnosis:` section (renal/bladder ultrasonography, voiding cystourethrography to exclude reflux/bladder-outlet obstruction, diuretic renography for differential renal function), bound to NCIT:C159885/NCIT:C38049/NCIT:C38086. The diagnostic-workup clause was moved out of the Continuous Antibiotic Prophylaxis treatment's evidence snippet (which now quotes only the prophylaxis recommendation) into the new diagnosis items.
    3. Added `target_mechanisms` on both surgical treatments, joining them to the `Aperistaltic Juxtavesical Ureteric Segment` pathophysiology node: Ureteral Reimplantation with Tailoring (BYPASSES — the segment is excised, not restored) and Endoscopic High-Pressure Balloon Dilation (MODULATES — the lumen is widened mechanically without restoring peristalsis).
    4. Added evidence to the `Ureterovesical Junction Incompetence` pathophysiology node (PMID:11387761) and softened its description: it no longer asserts the "shortened, poorly supported intravesical tunnel" anatomic detail as an established megaureter-specific finding (no citable source for that specificity in megaureter was found in a genuine PubMed abstract) — it is now explicitly framed as inferred by analogy to isolated primary VUR, with the gap named in prose and picked up by a new KNOWLEDGE_GAP discussion.
    5. Added two new phenotypes: Renal Parenchymal Thinning (HP:0025327, evidence PMID:29937413) and Impaired Differential Renal Function (HP:0000083, evidence PMID:24206785), both scoped to the Obstructed/Combined subtypes via `subtypes:`. Deliberately omitted `frequency:` on both per the frequency-evidence-guidelines rule: the only quantitative estimates (36.7%/17.7% in an Ortiz et al. operated cohort) are from a selected surgical population, not the general primary-megaureter population, and that specific sentence is in the paper's PMC full text rather than its PubMed abstract, so it is not usable as a `--no-full-text`-safe snippet. Also corrected the reviewer's suggested HP:0011463 for "antenatal hydronephrosis" — that CURIE actually means "Childhood onset" (confirmed via OAK and the schema's own OnsetEnum); the correct fix was `onset: {onset_category: ANTENATAL}` (HP:0030674) on the Hydronephrosis phenotype_term, which is what was added instead.
    6. Added an evidence item to the `Hydroureter` phenotype (PMID:24206785, the BAPU 7mm-diameter-threshold sentence, reused with the same evidence_source as its other uses).

    Non-blocking items also addressed:
    - `progression:` — two phases (spontaneous resolution/stabilization in the non-obstructed non-refluxing form; persistent/progressive dilation with surgical risk in the obstructed/combined forms), evidence from PMID:22397575.
    - `prevalence:` — added with measure_type/prevalence_class UNKNOWN (population-level birth prevalence is not established per the source literature) and notes/evidence quoting the two already-cited "5-10%/6-10% of antenatal hydronephrosis" figures, deliberately not fabricating a rate_per_100000 from them since they are a share of another condition category, not a standalone population rate.
    - Three `discussions:` with `kind: KNOWLEDGE_GAP`: no validated animal model of isolated primary megaureter (attaches_to animal_models# and the core pathophysiology node, with a proposed mouse-perturbation experiment), no ClinGen-level gene-disease relationship for isolated megaureter specifically as distinct from the broader CAKUT gene set (attaches_to genetic#, evidence PMID:39076761 supports:PARTIAL since that paper documents CAKUT genes generally, not megaureter specifically), and no replicated omics/transcriptomic profile of the aperistaltic segment (attaches_to the core pathophysiology node, with a proposed paired-segment RNA-seq experiment).
    - `clinical_trials:` — added NCT05639283 (POMME registry, 120-patient completed French observational study), fetched via `just fetch-reference NCT05639283`; its own cached summary text ("The obstruction is linked to aperistalsis and hypertrophy of the circular muscle bundles and increased collagen 1 level") was also added as a second, independent evidentiary source on the core `Aperistaltic Juxtavesical Ureteric Segment` node, reinforcing the circular-muscle-hypertrophy half of the abnormal circular:longitudinal ratio claim (the pre-existing PMID:17301719 evidence covered the longitudinal-hypoplasia half).

    Validation: just validate (42/42 snippets), just count-verified-snippets (42/42), just validate-terms, just validate-disorders (batched, 42/42), just check-duplicate-keys (whole KB clean), just check-folded-hyphens (330 grandfathered, no new), just check-entity-refs, just check-snippet-length, just check-title-snippets, just check-snippet-grading, and just check-environmental-evidence all passed with no new issues introduced.

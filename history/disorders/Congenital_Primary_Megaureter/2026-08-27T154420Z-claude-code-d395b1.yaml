  summary: 'Create: Congenital Primary Megaureter'
  details: |
    New disorder entry for congenital primary megaureter (MONDO:0018960), a CURATE_ROOT_WITH_SUBTYPES target from issue #8966. Modeled the four Smith/King forms via has_subtypes bound to their own MONDO terms (obstructed MONDO:0016550, refluxing MONDO:0016551, non-obstructed non-refluxing MONDO:0016552, combined MONDO:0035295). Pathophysiology centers the aperistaltic juxtavesical ureteric segment (abnormal circular:longitudinal smooth muscle ratio plus excess collagen deposition, TISSUE scale, GO:0072105 ureteric peristalsis ABSENT, GO:0030199 collagen fibril organization INCREASED, CL:1000979 ureter smooth muscle cell) as a functional/dynamic lesion rather than a fixed anatomic stricture or obstructive uropathy, per the issue's guidance; downstream nodes branch into impaired antegrade transport (obstructed/combined) and a separate ureterovesical junction incompetence/reflux arm (refluxing/combined), converging on ureteral dilation and hydroureteronephrosis (ORGANISM scale).

    Deep research: ran "just research-disorder falcon Congenital_Primary_Megaureter" (research/Congenital_Primary_Megaureter-deep-research-falcon.md); its own reference-validation reported 7/7 resolved, 0 confabulated, 0 off-topic. Ran "just preflight-dr" against MONDO:0018960: verdict SKIP (MONDO records no causal gene for this term, expected for a largely idiopathic CAKUT lesion), so I manually cross-checked the MONDO record via OLS (no OMIM xref; is_a kidney disorder / disorder of development or morphogenesis; synonyms CGM, congenital giant megaureter, congenital megalo-ureter) and confirmed no named-entity confusion. The falcon report independently corroborated the aperistaltic-segment/developmental-maturation model and explicitly cautioned against attributing general CAKUT genes (PAX2, TBX18, SIX2, etc.) to isolated primary megaureter, so no genetic: block was added.

    All 27 evidence items were sourced from primary literature fetched directly via PubMed/PMC (not lifted verbatim from the DR report) and verified against cached abstracts: histology/etiopathology (PMID:17301719, PMID:34315317, PMID:9610598), ex vivo contractility (PMID:15665928, IN_VITRO), a computational peristalsis model (PMID:37961019, COMPUTATIONAL), the BAPU consensus statement (PMID:24206785), a classification review (PMID:11387761), natural-history studies (PMID:38441661, PMID:22397575), a temporizing-diversion case series (PMID:31968361), and two treatment-outcomes papers whose DOIs were surfaced by the DR report and resolved to PMIDs via the PMC ID Converter before use (PMID:38954357, PMID:30345263). No GeneReviews chapter exists (PubMed search for congenital megaureter[TI] AND GeneReviews[TI] returned 0 hits).

    Validation: just validate, just count-verified-snippets (27/27 verified), just validate-terms, just check-duplicate-keys (whole KB clean), just normalize-cache, and the batched pre-PR sweep just validate-disorders all passed clean with no errors. Branch was fast-forwarded onto origin/main (7 commits) before this record was written; re-ran the full validation suite after the rebase and confirmed it still passes.

  summary: 'Genetics pass: bind GLI3 and wire it into the pathograph'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    The entry already carried a well-evidenced GLI3 genetic record, but the gene was
    named only in free text: there was no `gene_term`, no HGNC CURIE anywhere in the
    file, and no pathophysiology node carried a gene descriptor. GLI3 was therefore
    invisible to the gene-to-disease export and to the gene-to-mechanism wiring
    metric (0/1 before, 1/1 after).

    Changes:
    - `genetic[0]` now binds `hgnc:4319` GLI3, with `relationship_type: CAUSATIVE`
      and `variant_origin: GERMLINE`.
    - GLI3 is bound as a `genes:` descriptor on three pathophysiology nodes: the
      root constitutive-repressor node, the hypothalamic development node, and the
      limb patterning node. The root node also gains a `genetic_context` recording
      germline heterozygous origin.
    - `functional_impact_category` is deliberately left unset on that
      `genetic_context`, with the reason stated in its description: the cited
      sources establish the variant classes and their positional correlation with
      phenotype but none of them labels the mechanism dominant-negative,
      neomorphic, or gain-of-function.
    - The `7p14.1` cytogenetic band in the record's notes was uncited. It is now
      sourced from PMID:20672375, already cited in the same record, whose
      introduction states the locus; the item is graded `quote_role: BACKGROUND`
      because that sentence restates the established locus rather than reporting
      this cohort's result. The same paper's constitutive-repressor sentence was
      added to the root node. Both required upgrading that reference's cache entry
      from abstract-only to full text.

    Verification: `just validate`, `just validate-terms`, `just
    count-verified-snippets`, `just check-entity-refs`, `just check-causal-targets`,
    `just check-enum-values`, `just list-gene-term-mismatches` all pass; the entry's
    GeneReviews chapter (PMID:20301638) was already tagged and cited.

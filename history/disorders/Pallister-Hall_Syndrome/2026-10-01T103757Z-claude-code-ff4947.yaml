  summary: 'Genetics pass: wire the GLI3 cascade to the phenotype layer; decline MONDO:0009436'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). Three of four pathophysiology nodes dead-ended, leaving all nine phenotypes without an incoming causal edge. Wired the GLI3 constitutive-repressor cascade through: the GLI3 node to hypothalamic development disruption and posterior limb patterning disruption, and directly to the three midline malformations (bifid epiglottis, laryngeal cleft, anal atresia) whose intervening developmental program this entry does not model and whose sources state none; hypothalamic development disruption to the hamartoma; limb patterning to postaxial polydactyly; the hypothalamic-pituitary node to hypopituitarism and adrenal insufficiency; and the hamartoma phenotype by sequelae to gelastic seizures and central precocious puberty. Phenotype causal inlink 0/9 to 9/9; dead-end nodes 3 to 0; genes wired unchanged at 1/1. Two references new to this entry (PMID:28591478 for the hamartoma being intrinsically epileptogenic, PMID:41818657 for precocious puberty) were already committed in the cache for the Hypothalamic Hamartoma with Gelastic Seizures entry. The series row MONDO:0009436 congenital hypothalamic hamartoma syndrome (SMO) is declined structurally and the reasoning recorded in a new discussions KNOWLEDGE_GAP: MONDO files it as the sole is_a child of Pallister-Hall syndrome while its own definition says the majority of cases are sporadic, and the SMO assertion belongs with the somatically driven entity curated at MONDO:0019484. Validation on the committed tree: just validate 0 issues, 43/43 snippets verified, validate-terms passed.

    Self-review round, same session: two new GeneReviews evidence items on the midline-malformation edges were graded OTHER while this entry grades the same chapter HUMAN_CLINICAL elsewhere, and the sentence they quote contains a fragment already quoted as HUMAN_CLINICAL on the laryngeal cleft phenotype. check-snippet-grading flagged both. They are regraded HUMAN_CLINICAL, keeping quote_role REVIEW_SYNTHESIS to record that the citing document is a review. Snippets after the round: 43/43.

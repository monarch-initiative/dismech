  details: |
    PR Shepherd pass on PR #7840: merged origin/main to clear a DIRTY branch, then addressed the CRITICAL finding from the ai4c-reviewer review.

    CONFLICT RESOLUTION (10 files). The branch was CONFLICTING against main. Merged origin/main into the branch - no rebase, no force-push - and resolved each hunk on its merits rather than taking a side wholesale:

    - kb/disorders/Endometriosis.yaml (3 hunks). Main had independently performed the same evidence audit on the PMID:16166933 item (NO_EVIDENCE to SUPPORT plus evidence_source), so main's equivalent explanation was kept to avoid gratuitous churn. For the Infertility phenotype, main had replaced the weak PMID:16166933 item with a proper PMID:37844487 citation that names infertility directly; main's supersedes, since the PR item's own explanation said a dedicated fertility-outcome citation was still needed and main supplied one. The third hunk was a genuine union - the PR bound ID4 to hgnc:5363 while main added KRAS, PIK3CA, ARID1A, PPP2R1A and PTEN somatic drivers; both were kept.
    - kb/disorders/Hashimotos_Thyroiditis.yaml (4 hunks). Two hunks were PR-only additions of relationship_type SUSCEPTIBILITY on CTLA4 and PTPN22 that git flagged only through adjacency - main never carried the slot - so the PR's improvement was kept. The other two hunks reintroduced MAXO:0000284 and MAXO:0000088; MAXO was removed repo-wide and every term remapped to NCIT, so main's MAXO-free blocks with their richer target_mechanisms were taken. Zero MAXO references remain in the file.
    - Seven cache CSVs were resolved as a canonical union computed with a real CSV reader and writer, never by string concatenation, with an assertion that every row parses to exactly three fields. Main wins timestamp collisions.

    STALE CACHE CORRUPTION FOUND AND REMOVED. The union surfaced three malformed rows that exist only on this stale PR branch and are absent from main: 887,ATP hydrolysis activity in cache/go/terms.csv, and MONDO:0MONDO:0008661,vitiligo plus MONDO:MONDO:0018088,familial Mediterranean fever in cache/mondo/terms.csv. These are the exact corruption signature described in issue #7682. The correctly formed counterparts GO:0016887, MONDO:0008661 and MONDO:0018088 are already present in both branches, so the malformed rows were deleted rather than retyped or regenerated, per the CLAUDE.md rule. check-term-cache-integrity now passes at 17 term and 24 enum files, and check-cache-order passes.

    CRITICAL FINDING ADDRESSED - superseded histological criterion in Placenta Accreta Spectrum. The entry asserted absence of the decidua basalis as the diagnostic criterion for the Creta subtype and at the Absent or Deficient Decidua Basalis node, citing PMID:28599899 from 2018. PMID:41485847, the same first author in 2026 and already cited eight times in this entry, states that reliance on that criterion is inadequate and possibly misleading and redirects pathologists to deep villous attachment within scar tissue and distortion of the uteroplacental interface with thick fibrinoid deposition. Added a REFUTE evidence item at both locations carrying that sentence verbatim, and softened the Creta description so the criterion is recorded as contested rather than settled.

    The REFUTE is deliberately scoped in both explanations: it refutes the diagnostic inference, not the loss-of-decidual-constraint mechanism the node encodes. The same paper supplies the permissive constraint-loss model this entry's canonical hypothesis rests on, so the mechanism and the retired criterion are consistent rather than in conflict. The existing PMID:28599899 explanations were adjusted to point at the REFUTE item rather than being deleted.

    Validation on the merged branch: linkml schema validation clean on all three touched entries; term validation passed; reference validation 23/23 snippets verified on Placenta_Accreta_Spectrum (up from 21, so both newly added snippets verify verbatim against the cached abstract), 54/57 on Endometriosis and 53/54 on Hashimotos with the remainder skipped by prefix; check-term-cache-integrity OK; check-cache-order OK. git status --porcelain cache/ is clean after the PAS edit, so no cache rows were added or drifted. No references_cache file was created or hand-edited; the validator's cosmetic requoting churn was discarded with git restore. Two-dot git diff against origin/main shows no unintended deletions - every deletion on a curation path is an in-place replacement from the PR's own audit commit.

    Remaining review findings 2 through 11 (ICP transporter gene evidence, GWAS locus under-consumption, the truncated PAS diagnosis snippet, the missing PAS treatments section, GDM genetic and diagnosis sections, and the deep-research artifacts) are substantive curation work left to the entry author.

  summary: 'Add treatments section from ACOG/SMFM consensus (review blocker #5)'
  details: |
    Addressed review blocker #5 on PR 7840: the entry had no treatments section despite a terminal Massive Obstetric Haemorrhage node and prose calling specialist-centre delivery the core of management. Fetched ACOG/SMFM Obstetric Care Consensus No. 7 (PMID:30461695) with just fetch-reference - the reviewer noted neither previously cached PAS reference carried quotable management text, and that was confirmed here. Added three treatments: planned cesarean hysterectomy with the placenta left in situ (NCIT:C15256, SURGERY), which joins the pathograph via target_mechanisms BYPASSES on Failure of Placental Separation at Delivery and INHIBITS on Massive Obstetric Haemorrhage; planned delivery in a level III-IV maternal care centre with a multidisciplinary team (NCIT:C89340), INHIBITS on Massive Obstetric Haemorrhage; and massive transfusion protocol / blood bank support (NCIT:C15192), deliberately without a target_mechanisms edge because it mitigates the consequences of haemorrhage rather than preventing it. All four evidence items are evidence_source OTHER because the source is a professional-society consensus document rather than a primary study. NCIT:C15239 Patient Care was tried first and rejected by term validation as unreachable from NCIT:C25218; NCIT:C89340 Obstetric Procedure was used instead. Validation: just validate clean, references 27/27 snippets verified (was 23/23).

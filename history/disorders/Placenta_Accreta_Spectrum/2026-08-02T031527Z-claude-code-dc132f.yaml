  summary: 'Create: Placenta Accreta Spectrum'
  details: |
    New entry filling part of the obstetric gap. Curated as the mechanistic counterpart of Preeclampsia at the same maternal-fetal interface.
    Important framing correction made during curation: the first draft described PAS as trophoblast 'over-invasion', the mirror of preeclampsia's under-invasion. Both cited authorities explicitly reject that account, so the entry instead models an Absent-Decidua Permissive Model as CANONICAL (PAS is loss of the decidual constraint that normally arrests extravillous trophoblast migration, not a gain of invasive capacity) and records the legacy Trophoblast Overinvasion Model as a DEPRECATED hypothesis carrying two REFUTE evidence items. The schema's HypothesisStatusEnum has no REFUTED value; DEPRECATED is the closest available.
    Node chain: uterine scar and endometrium-myometrial interface damage -> absent or deficient decidua basalis -> unconstrained trophoblast attachment into myometrium -> failure of placental separation at delivery -> massive obstetric haemorrhage.
    Two KNOWLEDGE_GAP discussions: whether placenta percreta is a real entity or an operative artefact of manipulating a dehiscent lower segment (with the note that both cited sources take the same side, so the entry currently records a one-sided literature and a curator should check for a counter-position); and the unidentified molecular identity of the decidual trophoblast-arrest signal, which is the counterpart of the invasion-promoting programme that fails in preeclampsia.
    Ontology gaps recorded: HPO has no placenta accreta, adherent placenta, placenta previa or obstetric/postpartum haemorrhage term. The maternal haemorrhage phenotype is bound to the coarse HP:0001892 Abnormal bleeding with a note that this understates severity and obstetric context; the adherent-placenta phenotype is left unbound.

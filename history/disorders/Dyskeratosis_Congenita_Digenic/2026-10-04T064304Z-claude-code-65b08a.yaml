  summary: Rebind to MONDO:0031057 and rename from Dyskeratosis_Congenita_Autosomal_Recessive_8
  details: |
    The entry curated digenic TYMS-ENOSF1 dyskeratosis congenita (OMIM 620040) under MONDO:0859319, which is dyskeratosis congenita autosomal recessive 8 (OMIM 620133, DCLRE1B). Verified in this session: OLS4 v2 shows MONDO:0031057 xrefs OMIM:620040 / MedGen 1823990 with causal-gene axioms to HGNC 12441 (TYMS) and 30365 (ENOSF1); MONDO:0859319 xrefs OMIM:620133 / MedGen 1824030 with its axiom to HGNC 17641 (DCLRE1B); the MedGen definitions match (1823990 names Tummala et al. 2022 and 5-FU reactions; 1824030 describes bone marrow failure without shortened telomeres). Changes: file and name renamed to Dyskeratosis_Congenita_Digenic, disease_term rebound to MONDO:0031057, synonym DKCB8 replaced by DKCD (and DKCB8 -> DKCD in prose and discussion/experiment ids). The discussion dkcb8_mondo_gene_association_is_wrong was withdrawn because its premise (that OMIM 620133 is the TYMS-ENOSF1 entity and MONDO's DCLRE1B axiom is wrong) was false; the description and notes identity paragraphs now state both identifiers correctly. The stub stubs/Dyskeratosis_Congenita_Digenic.yaml was deleted as curated. The three earlier history records were moved here with target.superseded_by. In the parent Dyskeratosis_Congenita, the DKCD subtype row gained curated_in: Dyskeratosis_Congenita_Digenic and the DCLRE1B row now binds MONDO:0859319 as its subtype_term; filename references in the AR2 and AR6 entries were updated. Evidence content unchanged; 298/298 snippets verified across the four touched entries.

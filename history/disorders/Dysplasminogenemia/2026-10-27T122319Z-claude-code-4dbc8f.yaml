  summary: 'Create: Dysplasminogenemia'
  details: |
    Created a new entry for dysplasminogenemia (type II plasminogen deficiency, MONDO:0100538, PLG hgnc:9071) from the claim issue and stub. Deep-research input was a single Perplexity sonar-deep-research report (research/Dysplasminogenemia-deep-research-perplexity.md), generated via a locally streaming-patched deep-research-client because of dismech#9357 / deep-research-client#94. Its reference validation resolved 23/23 references with none unresolved; its term validation flagged GO:0005615 as obsolete (not used here). The report's numbered citations do not map onto its 56-entry sidecar, so citations were taken from the sidecar and the cached references directly. The report gives PMID 29040284 for the Tashima et al. 2017 Plg-Tochigi knock-in mouse paper; that PMID is a different PLoS One paper (Korean hereditary thrombophilia in unprovoked VTE). The mouse paper's DOI (10.1371/journal.pone.0180981) resolves to PMID 28686706 via the PMC ID converter, and both PMIDs were fetched and cited for what each actually reports. Also fetched outside the report's resolved set: PMID 659588 (Aoki 1978 index case), PMID 6216475 (Miyata 1982 Tochigi structure). Not used: PMID 9239510 (D676N/Osaka; cache has no abstract text, so no quotable snippet); PMID 2311307 (IgA nephritis in two patients, one with dysplasminogenemia; too weak to support a phenotype); DOI-keyed copies of PMID-indexed papers (PMIDs cited instead); PMID 2146745, 8883289, 30581935 and DOI 10.1111/j.1538-7836.2007.02776.x (no cached content); type I/ligneous papers (PMID 37745749, 37940896, 38117723, 39334536, 32001536, 18312178) and PMID 7705657/9473227 (Plg-null mice model type I, not type II); PMID 34501736 and 38408253 (general thrombosis/thrombolysis, not about this disease); PMID 41663186 (Chinese-language duplicate report of the same proband as PMID 41398600). Thrombotic phenotypes are recorded with both SUPPORT (case reports, pedigrees, a selected stroke series) and REFUTE (family, population and mouse studies) evidence, with their edges placed in an ALTERNATIVE mechanistic hypothesis group and a CONTROVERSY discussion. Inheritance bound to HP:0032113 Semidominant inheritance on the basis of the index kindred (intermediate heterozygotes, severe homozygote). Reduced plasminogen activity bound to HP:0040224 because HPO has no plasminogen-activity term and HP:0040228 describes reduced concentration (type I). check-genereviews (offline and --online): NO_CHAPTER. No ClinGen assertion exists for PLG-dysplasminogenemia. Validation: just validate (schema, terms, 56/56 snippets), validate-terms, count-verified-snippets 56/56, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading and validate-disorders all passed. just preflight-dr was not run to completion: it exits 2 because the local MONDO build (mondo.db) is absent in this environment; the report names PLG and MONDO:0100538 throughout and every cited paper was read and is about plasminogen type II deficiency or the contrast with type I.
    Review round 1 (PR #15714): CI gate "Check for newly ungrounded genes" failed because the PLG gene descriptor sat on the variant node, which carries no molecular function. The descriptor was moved to the "Loss of Plasmin Catalytic Activity" node, which binds GO:0004252 serine-type endopeptidase activity; the gate then passed in ref mode. The PMID 8727351 isoelectric-focusing/urokinase sentence was re-graded from HUMAN_CLINICAL to IN_VITRO because it reports an ex vivo biochemical assay on patient plasminogen.

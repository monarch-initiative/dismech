  summary: 'Create: Intellectual_Disability_Autosomal_Dominant_48'
  details: |
    New entry for MRD48 (MONDO:0030913, RAC1), requested by the user and claimed in issue #13319. Modelled as three head-size subtypes (Microcephalic: dominant-negative or presumed dominant-negative; Normocephalic: activating; Macrocephalic: Val51, mechanism unresolved), following the field's own head-circumference grouping (PMID:42120539) and the variant-class findings of PMID:28886345, 35139179 and 37059841; pathophysiology branches carry subtypes. RAC1 is placed on the root variant node carrying GO:0003924 GTPase activity, so the new gene-activity grounding gate passes. Deep research was requested from falcon; no Edison key was configured, so the run used dr_fallback and the report was produced by claude_code. Report validation: 9/9 references resolved; preflight-dr PASS. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER).
    A fresh-context red-team review (2 critical, 7 important, several minor) led to these changes: the Normocephalic subtype was widened from N-terminal switch II only to activating variants including p.Ala159Thr (G5 box) and p.Glu62Lys, with a variant record and the 37059841 activation sentence; a Global developmental delay phenotype was added; the macrocephaly edge now cites the FoldX stability prediction (COMPUTATIONAL) rather than the 'weakly dominant negative or context dependent' sentence, and the V51 macrocrania sentence was added to that subtype; the Microcephalic subtype now says 'dominant-negative or presumed dominant-negative', with a REFUTE item recording that p.Pro73Leu and p.Cys157Tyr showed at most a modest effect; the neural crest cell term was corrected to CL:0011012 and its sentence regraded REVIEW_SYNTHESIS; prominent nasolabial folds, thin upper lip, widely spaced teeth, hydronephrosis, short feet and a separate ichthyosis phenotype were added from their stated frequencies; the Upadia 2025 mild cases were cited; p.Tyr40His is now described as a neonate with no neurodevelopmental assessment; the Y64D head-size change with age was recorded; the TRIO differential gained evidence; and an uncited DOI cache file was removed. The reviewer's suggestion to cite the fibroblast sentence on the variant records was not taken because the cited abstract sentence includes the zebrafish result those records also rely on. Validation: just validate 77/77 snippets; gene-activity grounding, entity-refs, causal-targets and duplicate-keys OK. Stub stubs/Intellectual_Disability_Autosomal_Dominant_48.yaml deleted.

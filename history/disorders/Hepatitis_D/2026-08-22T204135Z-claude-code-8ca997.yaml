  summary: 'Review fix: model HDV coinfection vs superinfection; add HBV vaccination'
  details: |
    Addresses a CRITICAL review finding on PR #9260. The entry did not distinguish the two HDV acquisition routes, which have opposite natural histories, and so attributed the accelerated cirrhotic course to HDV generically. Added has_subtypes for Coinfection and Superinfection, plus a new trigger node 'Acquisition Route - Coinfection versus Superinfection' carrying the quantitative contrast (>95% of coinfected patients clear both viruses within six months; >80% of superinfections chronify), and scoped the progression node to the Superinfection subtype with the 70-80%-cirrhosis-in-5-10-years figure. Also addressed two IMPORTANT findings: added HBV vaccination as an INHIBITS link on the acquisition node - because HDV cannot infect without HBsAg, HBV vaccination is fully protective in the uninfected, with a PARTIAL item recording that it does nothing for the established carrier - and corrected pegylated interferon's therapeutic_modality from PROTEIN_REPLACEMENT to OTHER per repo precedent, adding the missing therapeutic_agent and target_mechanisms. During this work an invented NCIT id (NCIT:C2549, which is actually 'Interleukin-2 Gene') was caught by term verification and replaced with NCIT:C225 Recombinant Interferon Alfa, and one snippet initially mis-attributed to PMID:37338616 was traced to PMID:26464754 by the snippet audit and reattributed. Validation: schema, terms and 26/26 snippets clean.

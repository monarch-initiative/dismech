  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block with three routes for hepatitis delta: percutaneous/parenteral exposure to infected blood, sexual transmission, and vertical mother-to-child transmission. Each route description records that HDV establishes infection only alongside HBV, as coinfection or superinfection, which is the dependency the entry's two subtypes model. Evidence: PMID:37338616 (Dig Dis Sci panel review; percutaneous/mucosal, needle-sharing and sexual, and in-utero/birth sentences) and PMID:26464754 (review; same routes as HBV, coinfection versus superinfection). No agent binding was needed - the HDV agent was already bound to NCBITaxon:12475. Validated with just validate (schema, terms, references), just count-verified-snippets (30/30 verified), and the batched just validate-disorders sweep.

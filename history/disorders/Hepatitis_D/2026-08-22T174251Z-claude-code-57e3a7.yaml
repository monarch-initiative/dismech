  summary: 'Create: Hepatitis D'
  details: |
    New entry completing the viral hepatitis series. Four-node chain organised around HDV's total dependence on hepatitis B: HBsAg-dependent hepatocyte entry via NTCP -> host-polymerase-mediated replication -> L-HDAg farnesylation and HBsAg-dependent virion assembly -> accelerated progression to cirrhosis and hepatocellular carcinoma. The entry node conforms to viral_entry_fusion_inhibition#Viral Attachment to the Host-Cell Receptor. The replication node exists specifically to record that HDV encodes no polymerase, which is why nucleos(t)ide analogues and HCV direct-acting antivirals are useless against it and every drug targets an HBV-supplied step instead. Bulevirtide is curated as INHIBITS on the entry node with trial response rates, and its bile acid rise recorded as PARTIAL because it is the on-target consequence of blocking a bile acid transporter rather than an unrelated adverse event. Lonafarnib is marked PARTIAL as phase II/III at the time of the cited review. A KNOWLEDGE_GAP records that approval rested on virological and biochemical endpoints, not on cirrhosis or hepatocellular carcinoma, so the entry inhibitors must not be curated as preventing those. Validation: linkml-validate clean; linkml-term-validator passed; 17/17 evidence snippets verified against cached references.

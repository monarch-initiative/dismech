  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). The entry had no diagnosis block; added one row for anti-HDV screening of HBsAg-positive people with reflex HDV RNA testing, cited to the CLDF expert-panel guidance already used in the entry (PMID:37338616) and a 2026 systematic review of double reflex testing (PMID:41552002, full text), whose pooled result that fewer than half of anti-HDV-positive people tested were RNA positive is quoted. Measurements: anti-HDV total antibody LOINC:13248-0 and the method-less HDV RNA panel LOINC:95144-2 (no method-less HDV RNA presence or quantitative code or LOINC Part was found in the Monarch KG). No band: no diagnostic HDV RNA threshold is stated in the cited sources.

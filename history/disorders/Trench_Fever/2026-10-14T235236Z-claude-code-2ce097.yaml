  summary: Bind LOINC B. quintana serology and genus-level Bartonella DNA codes
  details: |
    Added diagnosis[].measurements binding LOINC:26677-5 (Bartonella quintana Ab [Presence] in Serum) and LOINC:16275-0 (Bartonella sp DNA [Presence] in Blood by NAA with probe detection) to the Serology and PCR for blood-culture-negative endocarditis row. Searched the organism (Bartonella quintana) rather than the specific gene targets the row names (rnpB, fur), per the lesson that a narrow antigen/marker search misses organism-level codes. Confirmed both codes by direct Monarch KG entity lookup (api-v3.monarchinitiative.org/v3/api/entity/LOINC:<code>) rather than relying on their appearing in a ranked search result, per the lesson that a ranked, truncated search page can omit a real code. Verified no B. quintana-specific DNA code exists for blood or an unspecified specimen (only tissue and implanted-device variants do), so the genus-level Blood code is the molecular-arm binding; this is recorded as a fact about the codes in the entry's own notes. No cross-branch collision against any open loinc-*-batch* branch. New cache/loinc/terms.csv rows for both codes, confirmed absent from origin/main before seeding.

  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. CRITICAL: added the cardinal acute trench-fever syndrome, absent before. New Acute Febrile Bacteremic Illness node (downstream of Trw erythrocyte colonization; PMID:16494745 full text: sudden headache/shin pain/fever + the relapsing five-day/quintan form) feeding new Fever (HP:0001945), Headache (HP:0002315), and Bone pain (HP:0002653, shin/tibial) phenotypes. Added an Iatrogenic-free environmental entry Body louse infestation and homelessness (influences_mechanisms PREDISPOSES -> Body-Louse Fecal Bartonella Inoculation; PMID:16494745 homeless reemergence). Added a diagnosis section (serology + nested PCR for blood-culture-negative endocarditis, NCIT:C17003, PMID:15891120). Added a RARE prevalence record (homeless urban populations, PMID:16494745). Added the vasoproliferative adhesion step: a Vomp-Mediated Endothelial Adherence node (PMID:21536788, trimeric autotransporter adhesin mechanism) wired from Chronic Bacteremia and Endocarditis into the BafA/VEGF node. Wired the previously disconnected Chronic Lymphadenopathy phenotype from the bacteremia node. Added therapeutic_modality: SMALL_MOLECULE on the doxycycline+gentamicin treatment, and recorded on the Bacillary Angiomatosis phenotype why no HP term is bound (OLS l~angiomatosis returns only unrelated terms). Regraded the PMID:16494745 homeless-reemergence quotes consistently (evidence_source OTHER) to satisfy snippet-grading. Deferred (non-blocking): the VirB/D4-Bep step (PMID:23163798 is a B. henselae interference paper, not a clean B. quintana angiogenesis step) and animal models. All gates green; 7/7 phenotypes connected.

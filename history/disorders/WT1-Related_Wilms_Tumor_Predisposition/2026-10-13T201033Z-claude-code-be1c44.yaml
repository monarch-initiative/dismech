  summary: 'Create: WT1-Related_Wilms_Tumor_Predisposition'
  details: |
    New entry for MONDO:0008679 (Wilms tumor 1), the germline WT1 loss-of-function Wilms tumor predisposition condition, scoped by the ClinGen split (CGGV Definitive AD) from the WT1 congenital malformation syndromes and from the somatic tumor (Wilms_Tumor). Pathograph: germline WT1 truncating first hit, somatic paternal 11p uniparental disomy as second hit (biallelic WT1 loss plus biallelic IGF2 expression), blocked mesenchymal-to-epithelial transition in nephron progenitors, intralobar nephrogenic rests, later somatic CTNNB1 activation, stromal-predominant tumor; a separate branch for constitutional WT1 haploinsufficiency to cryptorchidism, hypospadias and chronic kidney disease. Surveillance from GeneReviews WT1 Disorder, AACR 2017 and 2024 and the 2006 UK recommendations. One falcon (Edison) deep-research report was used as a lead only; it resolved all 8 extracted references, and its one term-label mismatch is the template's '(if available)' text. Every claim was checked against cached primary sources; no DR-only claim was carried into the entry. Validated with just validate, validate-terms, count-verified-snippets (73/73), the entity-ref, causal-target, duplicate-key, qualifier, GeneReviews, gene-term-mismatch, block-scalar and whole-KB snippet/title/grading gates, check_gene_activity_grounding against origin/main, and validate-disorders (pass). preflight-dr could not run (local mondo.db absent, exit 2). Gaps: no unbiased penetrance estimate; surveillance end age disputed (knowledge-gap discussions); GU anomaly frequencies for truncating carriers specifically are not reported; the SIOP-Europe 2021 surveillance guideline is cached as abstract only and is not cited.

  summary: Address Round 1 PR review feedback on STAT3-Related Early-Onset Multisystem Autoimmune Disease
  details: >-
    Unbundled B-cell maturation arrest out of Impaired Nonclassical Monocyte
    and Dendritic Cell Development into a dedicated CELLULAR node Terminal B
    Cell Maturation Arrest (CL:0000236 B cell, GO:0002317 plasma cell
    differentiation DECREASED, PMID:25349174), wired from Constitutive STAT3
    Activation and projecting to Hypogammaglobulinemia and Recurrent infections;
    restored PMID:30825606 transplant mortality evidence (4 of 5 patients died
    from complications) on Hematopoietic Cell Transplantation and reworded its
    description to remove the unsupported unbridged-vs-bridged survival
    comparison; added notes on Tocilizumab clarifying dampening of
    cytokine-amplified rather than basal constitutive STAT3 activity; added
    Immunoglobulin Replacement Therapy (NCIT:C80829 Human Immunoglobulin G,
    targeting HP:0004313) and Conventional Immunosuppressive Therapy
    (NCIT:C15261) backed by PMID:36228738.

  summary: 'Create: STAT3-related early-onset multisystem autoimmune disease'
  details: |
    Created the STAT3-related early-onset multisystem autoimmune disease (STAT3 GOF) entry.
    Deep research via the claude_code provider (report in research/; references 19/19
    resolved, no off-topic, one unmatched quote not used); preflight-dr confirmed STAT3 as the
    dominant gene with matching OMIM 615952. Evidence anchored on fetched primary abstracts
    (Flanagan 2014 PMID:25038750, Milner 2015 PMID:25359994, Haapaniemi 2015 PMID:25349174,
    systematic review PMID:30825606, natural-history cohort PMID:36228738, NKG2Dhi CD8
    PMID:36446385, knock-in mouse models PMID:35995509/PMID:36136607, ruxolitinib
    PMID:39631446, low-IgE PMID:27608644). Built an atomic causal pathograph (one
    biological_scale per node) from the GOF variant through constitutive STAT3 activation to
    the Treg/effector-CD8/Th17/monocyte-DC/growth arms and on to multiorgan autoimmunity and
    lymphoproliferation; 9/11 phenotypes causally connected. Conforms its constitutive-
    activation node to jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear
    Translocation (activation arm only; the mirror LoF Job-syndrome entry is kept separate).
    Two JAK inhibitor / anti-IL-6R / HSCT treatments and two patient-variant knock-in animal
    models with modeled_mechanisms. just validate, validate-disorders, check-causal-targets,
    check-entity-refs, check-conformance-content, check-logical-rules all pass.

  summary: 'Address review: MODEL_ORGANISM retag and MAXO to NCIT remap'
  details: |
    PR-shepherd follow-up. 1. Addressed the blocking review item: PMID:24503136 is the Pex1-G844D mouse model paper but was tagged evidence_source HUMAN_CLINICAL at three places in the PBD1B entry. Retagged all three to MODEL_ORGANISM. Re-anchoring was not needed because each of the three nodes already carries independent human evidence alongside the mouse item (PMID:20301621 GeneReviews and the PMID:15098231 human cohort), so no human phenotype claim rests on model-organism evidence alone. 2. Surfaced and fixed a blocker the review could not see because that runner had no network access: both PBD entries are new files authored before the MAXO removal and carried ten MAXO treatment/diagnosis terms that the current schema rejects, which would have failed term validation on main. Remapped them with the canonical scripts/migrate_maxo_to_ncit.py driven by docs/superpowers/maxo_ncit_final_map.tsv - eight REMAP (clinical assessment to NCIT:C124351 Clinical Evaluation, molecular genetic testing to NCIT:C19770 Molecular Analysis, supportive care to NCIT:C15747 Supportive Care) and two BLANK (hearing aid usage, which has no NCIT equivalent, so the term block is dropped and the free-text preferred_term plus therapeutic_modality DEVICE are kept). Branch also updated from main via the GitHub update-branch API, a merge with no rebase or force-push. Validated with just validate and just validate-terms; all pass, 75/75 and 73/73 snippets verified.

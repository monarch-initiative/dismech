  summary: 'Create: Peroxisome Biogenesis Disorder 4B (PEX6 non-classic ZSD / SCAR3)'
  details: |
    Created the PBD4B entry (MONDO:0013931, OMIM 614863, PEX6), the PEX6 counterpart of PBD1B and curated at the same level - see that entry's history record for the shared level-of-curation rationale.

    Two features make PBD4B genuinely distinct from PBD1B rather than a gene swap: it subsumes the neurogenetic entity SCAR3/SCABD1 (early-onset cerebellar ataxia with hearing loss and blindness, cerebellar white matter change without atrophy, demyelinating motor neuropathy), and PEX6 uniquely carries an allelic expression imbalance mechanism in which c.2578C>T p.Arg860Trp causes disease heterozygously, producing apparently dominant pedigrees at a recessive locus.

    Named-entity-confusion handling: MONDO:0013931 carries both the peroxisomal (PBD4B) and neurogenetic (SCAR3/SCABD) labels. These are co-referent but the history is tangled - the original SCAR3 family mapped to 6p21-p23 was later shown to carry SLC52A2 (now SCABD2, allelic to Brown-Vialetto-Van Laere type 2), while a clinically similar family confirmed the 6p21 SCAR3/SCABD1 locus as PEX6 (PMID:26669662). That caveat is recorded in the entry notes so curators do not import SLC52A2-family literature.

    Recorded provider disagreement: the falcon report asserts SCAR3/SCABD1 is not a supported synonym and should not be loaded. That was not adopted - it reflects the provider's Open Targets retrieval set rather than the nomenclature record (MONDO exact synonyms, Orphanet ORPHA:95433 mapping to MONDO:13931 as exact, and the primary statement in PMID:26669662). The same report also gave HGNC:8856 for PEX6, which OAK shows is wrong - hgnc:8859 is PEX6, hgnc:8858 is PEX3. Both points are documented in the entry notes.

    Deep research: Edison/falcon (primary) and claude_code. OpenScientist timed out after 3600s in queue. NEC preflight passed: falcon report 113 PEX6 vs 21 PEX1 with OMIM:614863, claude_code report 128 vs 20.

    Content: 5-node causal chain mirroring PBD1B but anchored on PEX6, 14 phenotypes, 4 biochemical markers, PEX6 genetics including the allelic-expression-imbalance and Perrault-phenocopy findings, 3 diagnostic modalities, 5 treatments. A new Orphanet structured reference was generated for this entry via just structured-rebuild-orphanet --id 95433, giving citable support for the ataxia-blindness-deafness triad and the cerebellar-white-matter-without-atrophy imaging signature. Key sources: PMID:26669662 (SCAR3/SCABD1 is PEX6), PMID:19877282 (PEX6 mutation survey, second most common ZSD cause), PMID:29220678 (allelic expression imbalance), PMID:25079577 (late-onset PEX6 mimicking X-linked adrenoleukodystrophy), PMID:32399598 (PEX6 presenting as Perrault syndrome, surfaced by falcon), PMID:37567036 (dicarboxylic acylcarnitines, which discriminate PBD from X-ALD and so directly address this disorder's diagnostic trap, surfaced by falcon), PMID:26387595 (Heimler), PMID:20301621 (GeneReviews baseline), ORPHA:95433.

    Validation: just validate passes (schema, term and reference validation), with every snippet verified as an exact substring of its cached source. validate-graphs reports no findings for this file.

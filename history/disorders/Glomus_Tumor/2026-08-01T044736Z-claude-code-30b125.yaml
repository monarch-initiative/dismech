  summary: Fix pathograph connectivity regression from the gastric phenotype (#7484
    round 3)
  details: |
    Round-3 review of PR #7484 found a single blocking item, and it was a regression
    introduced by my own round-2 fix for the reviewer's gastric/visceral finding.

    Adding the "Gastric (Visceral) Glomus Tumor" phenotype without a corresponding
    causal edge left it as a floating node: just compliance-connectivity
    --list-unconnected reported Glomus_Tumor.yaml at 6/7 phenotypes connected (86%),
    with the gastric phenotype the only unconnected one. Every other phenotype in the
    entry has an inbound edge, and the PR body asserts zero unconnected phenotypes, so
    the addition silently falsified the entry's own stated invariant.

    Fix: added a fifth downstream target on "Glomus Cell Proliferation Around Distorted
    Vascular Channels" pointing at "Gastric (Visceral) Glomus Tumor", with
    causal_link_type DIRECT, shaped like the sibling Subungual Nodule edge. The edge is
    mechanistically the same claim as that sibling - the same proliferating glomus cell
    population, differing only in anatomic site and therefore in clinical presentation
    - so DIRECT is the correct link type rather than an indirect one.

    Two evidence items, both from caches already present in the PR:
    - PMID:24817939, "Our results show that GTs in the stomach are histologically and
      immunophenotypically fully comparable with the glomus tumors of peripheral soft
      tissues." This is the item that licenses the edge at all: it establishes the
      gastric lesion is produced by the same cell population this node models, rather
      than being a separate process that merely shares a name.
    - PMID:32337257, "Microscopically, small, round cell nodules surrounded the
      expansion of blood vessels in a nest pattern." Confirms the same nested
      perivascular architecture at the gastric site.

    Validation after the fix: just validate clean; just validate-references 123/123
    (was 121/121); weighted compliance unchanged at 96.7%; compliance-connectivity now
    reports no unconnected phenotypes for this file. The references_cache reference_id
    re-quoting churn (#7393) emitted by the validator was reverted again before commit.

    Process note for future rounds: adding a phenotype to an entry whose pathograph is
    a single connected component requires adding its inbound edge in the same change.
    compliance-connectivity is not part of just validate or just qc, so neither the
    schema validator nor the reference validator catches this - it needs an explicit
    just compliance-connectivity run.

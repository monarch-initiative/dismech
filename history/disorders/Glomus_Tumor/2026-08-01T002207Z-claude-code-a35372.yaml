  summary: 'Create: Glomus_Tumor'
  details: |
    Greenfield curation of glomus tumor (MONDO:0018327), the pericytic/perivascular soft-tissue neoplasm of modified glomus-body smooth muscle cells. Named Entity Confusion preflight run first: OAK confirmed MONDO:0018327 is_a pericytic neoplasm plus soft tissue neoplasm with xref NCIT:C3060 and ICDO:8711/0, explicitly NOT glomus jugulare/tympanicum paraganglioma (already covered by Pheochromocytoma_Paraganglioma). Falcon (Edison Scientific) deep research was run via just research-disorder falcon Glomus_Tumor (608s, 17 citations, 1 artifact); its report opens with an explicit scope statement excluding paraganglioma, so the NEC check on the DR output also passed. Falcon output was treated as leads only: every PMID was fetched with just fetch-reference and every snippet independently verified as an exact whitespace-normalized substring of the cached abstract. One falcon-suggested ontology mapping was rejected on verification (it proposed HP:0033748 as Tenderness; OAK shows HP:0033748 is Hypoesthesia). Falcon's NF1 lead was verified and proved correct, adding a whole mechanism arm (PMID:19738042, PMID:22250039); its NCT03422679 lead was verified against the ClinicalTrials.gov API, which confirmed Glomus Tumor, Malignant as an indexed condition. The entry models an 8-node fully connected pathograph with four parallel driver arms converging on glomus-cell proliferation: MIR143-NOTCH fusion, constitutive RAS-MAPK (BRAF V600E / KRAS / NF1), NF1 biallelic inactivation, and GLMN loss with a paradominant somatic second hit; downstream the nociceptor-rich and mast-cell-rich stroma and loss of thermoregulatory shunt function generate the classic triad, with a malignant-transformation branch on Folpe criteria. Declares conformance to sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation. Validation: just validate passed (schema, terms, references), 53/53 snippets verified, scripts/check_folded_hyphens.py clean, compliance-connectivity reports no unconnected phenotypes and 5/5 causal genes wired to mechanism, global compliance 91.5 percent.

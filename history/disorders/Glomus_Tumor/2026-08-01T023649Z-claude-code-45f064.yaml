  summary: 'Independent verification and hardening of PR #7484 (Glomus Tumor)'
  details: |
    Independent red-team verification of PR #7484 by a second agent, plus additive fixes.

    VERIFIED (no defect found):
    - All 17 cited PMIDs exist on live PubMed and their titles match the reference_title values in the YAML (17/17).
    - All 53 pre-existing evidence snippets match their cached abstracts under whitespace normalisation only; zero character substitutions (ligature, non-breaking space, en-dash, curly-quote) were required and zero failures.
    - Every ontology ID was re-resolved with OAK and checked against its DEFINITION, not just its label: MONDO:0018327, CL:0000192 / CL:0000669 / CL:0000097, 11 GO terms (none obsolete), 5 HP terms, 9 NCIT terms, CHEBI:145371, and 7 hgnc gene IDs. All are semantically appropriate. Confirmed that CL has no "glomus cell" term, so CL:0000192 smooth muscle cell is the correct fallback rather than a carotid-body chemoreceptor term.
    - Confirmed the deep-research artifact is genuine (falcon frontmatter, dense cited narrative) and that its suggested HP:0033748 "Tenderness" is a hallucination: HP:0033748 is actually Hypoesthesia. The original curator correctly avoided it.
    - No GeneReviews article exists for glomus tumor or glomuvenous malformation (PubMed search returns 0), so the GeneReviews baseline is N/A.
    - Pathograph: single connected component, all downstream and target_mechanisms targets resolve, every phenotype reachable.

    DEFECTS FOUND AND FIXED:
    1. biological_scale and role were absent from all 8 pathophysiology nodes. Tagged along the mechanism chain: the three driver-lesion nodes and the mitogenic node MOLECULAR, the proliferation node CELLULAR, and the stroma / shunt-loss / malignant-transformation nodes TISSUE; roles trigger, central_effector, mediator, consequence, outcome.
    2. differential_diagnoses was entirely absent, despite the deep-research report opening with an explicit warning that glomus jugulare and glomus tympanicum are paragangliomas and not this entity. Added 7 structured entries, headed by jugulotympanic paraganglioma (MONDO:0021064) framed unambiguously as a naming collision and cross-referenced to the CLAUDE.md Named Entity Confusion guidance, plus myopericytoma (MONDO:0017349), angioleiomyoma (MONDO:0006646), solitary fibrous tumour (MONDO:0016238), eccrine spiradenoma (MONDO:0003448), the painful-acral-lesion cluster, and the GLMN glomuvenous-malformation boundary (MONDO:0007672).
    3. The Folpe classification was truncated to malignant only. Added the three missing categories with exact quotes from PMID:11145243 (Symplastic Glomus Tumor, Glomus Tumor of Uncertain Malignant Potential, Glomangiomatosis) plus a bounding snippet on the malignant subtype recording that high nuclear grade alone is NOT associated with metastasis. This prevents the symplastic and malignant categories being collapsed.
    4. No diagnosis section. Added five entries: the clinical provocation triad (Love's pin test, Hildreth's test, cold test, trans-illumination) with reported operating characteristics, contrast-enhanced high-resolution MRI, ultrasonography, histopathology with immunohistochemistry, and NOTCH/BRAF molecular testing.
    5. No prevalence. Added a structured record using population / measure_type / prevalence_class (RARE) with an explicit note that no population rate exists and that archive-derived proportions are not prevalence. The deprecated percentage field is not used.
    6. Zero-evidence sections. Added verified evidence to 2 of 3 histopathology findings, the surgical target_mechanism, and all 9 previously bare downstream edges (downstream evidence coverage went from 4/13 to 13/13). PARTIAL is used honestly wherever an abstract supports a claim only indirectly.
    7. A treatment gap: MEK inhibition for NF1-deficient tumours is named in PMID:41693210 but was absent. Added as an explicitly investigational treatment with selumetinib (CHEBI:90227) as the exemplar agent and PARTIAL evidence.
    8. The biochemical entry named "Smoothelin Expression" was bound to NCIT:C113326 Caldesmon. Renamed to "Contractile Smooth Muscle Marker Expression (Smoothelin and h-Caldesmon)" so the entity name no longer contradicts its term; NCIT has no smoothelin concept.
    9. Added three discussions: two KNOWLEDGE_GAP records (the fusion-negative subungual paradox, and the epidemiology gap including the site-dependent sex-ratio inconsistency between the cited series) and one CURATION_TODO recording that ICD-O 8711/0 cannot currently be represented in the schema.

    LEFT FOR A HUMAN:
    - ICD-O morphology 8711/0 and 8711/3 have no schema home: ICDOMorphologyEnum has only ten coarse values (Carcinoma, Adenocarcinoma, Squamous Cell Carcinoma, Sarcoma, Leukemia, Lymphoma, Multiple Myeloma, Melanoma, Glioma, Embryonal Neoplasm) and DiseaseMappings supports only icd10cm / icd11f / mondo / ncit. Assigning Sarcoma would be wrong for a predominantly benign entity. Recorded as a CURATION_TODO discussion rather than mis-populated.
    - The pathophysiology node "Glomus Cell Proliferation Around Distorted Vascular Channels" arguably bundles a CELLULAR claim (clonal expansion) with a TISSUE claim (perivascular architecture and type IV collagen deposition). Tagged CELLULAR on the leading claim and flagged rather than split, because splitting would restructure the pathograph mid-review.
    - NCIT:C16722 Immunohistochemistry is the semantically exact diagnosis term but is not reachable from NCIT:C25218, the TreatmentActionTerm enum root; NCIT:C16853 Microscopy is used instead, with the precise preferred_term and an explanatory note.

    Validation: just validate, just validate-terms, just validate-references (103/103 snippets verified) and just compliance all pass. Compliance moved from 91.5 to 95.5 percent global and 92.0 to 95.9 percent weighted. Incidental references_cache reformatting churn produced by running the validators was reverted; the commit touches only the entry, four additive term-cache CSVs, one new reference cache file, and this history record.

  summary: 'Review round 2 - address ai4c-reviewer CHANGES_REQUESTED on PR #7484'
  details: |
    Second review round on PR #7484. The ai4c-reviewer bot returned CHANGES_REQUESTED
    with two IMPORTANT findings and six non-blocking suggestions, after an earlier
    independent audit (commit c0676ca) had already taken the entry from 91.5% to 95.5%
    weighted compliance. This record covers only the new round.

    IMPORTANT 1 - KRAS absent from structured data despite being quoted three times.
    Added a `genetic:` entry for KRAS (hgnc:6407, SOMATIC) citing PMID:40976119 with the
    already-verified distal-KRAS/proximal-BRAF snippet, and added KRAS (hgnc:6407) and
    NF1 (hgnc:7765) to the `genes:` list of the "Constitutive Mitogenic Pathway
    Activation" node, which previously listed only BRAF. The anatomic-site dichotomy is
    now readable from the structured data rather than only from prose.

    IMPORTANT 2 - four deep-research items unconsumed. All four were consumed:

    (a) Gastric/visceral presentation. New Clinical phenotype "Gastric (Visceral)
    Glomus Tumor" bound to HP:0006753 Neoplasm of the stomach, with four evidence items
    from two newly fetched series: PMID:32337257 (21 cases; antrum commonest site;
    benign, cured by complete resection) and PMID:24817939 (11 cases; gastric tumours
    histologically and immunophenotypically fully comparable with peripheral soft
    tissue glomus tumours; no KIT/PDGFRA mutation, the GIST discriminator). The
    disease-level description gained a sentence so the entry no longer reads as
    cutaneous-only. No frequency band asserted - the visceral share cannot be estimated
    from single-institution series with no common denominator, and this is stated in
    the phenotype notes.

    (b) GLI1-altered pericytic differential. New differential_diagnoses entry backed
    by PMID:31189998 (Agaram et al., Modern Pathology 2019 - the DOI the reviewer named,
    resolved to a PMID and fetched). Three evidence items: the GLI1/CDK4/MDM2
    amplification signature, the inconsistent frequently-S100-positive immunoprofile,
    and the paper's own statement of the glomus-tumour-side discriminator (consistent
    actin positivity plus MIR143-NOTCH2). Recorded without a disease_term because
    MONDO has no class for GLI1-altered soft tissue tumour; that is documented in
    notes rather than mapped to an approximate parent.

    (c) ERN GENTURIS 2023 NF1 surveillance. New SCREENING treatment "Symptom-Directed
    Surveillance for Digital Glomus Tumour in NF1" (NCIT:C20989 Physical Examination,
    verified reachable from the NCIT:C25218 TreatmentActionTerm root). Provenance
    caveat handled explicitly: the glomus-specific guideline content (Table 13, the
    at-least-three-yearly adult clinical assessment) is in the full text of
    PMID:36684394 while the local cache holds only the abstract, so the GENTURIS item
    is quoted at abstract level and marked PARTIAL, and the actionable content is
    evidenced from PMID:20530151 (Stewart et al. 2010), the primary series GENTURIS
    cites for it. No unverifiable text was quoted.

    (d) PMID:37712875 (Hanna et al. 2023), the peer-reviewed CB-103 phase I behind
    NCT03422679. Added as two evidence items on the clinical trial and the trial
    description rewritten. The bare "The study was terminated" now states that the
    registry gives the stop reason as a business reason (confirmed against the
    ClinicalTrials.gov v2 API whyStopped field; recorded as prose plus a notes block
    because that field is not in the cached registry summary), and that the phase I
    found manageable safety and biological activity but no objective responses, in an
    adenoid-cystic-carcinoma-dominated basket with no glomus-specific outcome - so the
    basket result must not be attributed to the glomus subgroup in either direction.

    Non-blocking suggestions addressed:
    - HP:0012531 reused for two phenotypes: kept (verified with OAK that HP:0025283
      "Tender" is_a HP:0025280 Pain characteristic, a modifier branch, and that every
      other HPO tenderness term is site-specific to a non-digit body part), but the two
      phenotypes are now held apart by preferred_term and the gap is documented as a
      term-request notes block inside the YAML.
    - HP:0002664 for "Metastasis": kept (OAK search of HPO for "metasta" returns only
      HP:0200059 Metastatic angiosarcoma), caveat moved from the PR body into a YAML
      notes block so it survives the PR.
    - PMID:19738042 negative finding on the mitogenic node re-encoded PARTIAL to
      REFUTE with an explanation naming exactly which sub-claim it refutes (the NF1
      route in sporadic tumours) and why the node still stands (the sporadic RAS-MAPK
      arm is entered via BRAF V600E and KRAS).
    - Solitary fibrous tumour differential was the only zero-evidence sub-object left;
      now backed by PMID:24030747 (Doyle et al., nuclear STAT6 distinguishes SFT from
      histologic mimics, 59/60 SFT positive, all other tumour types negative) plus the
      glomus-side discriminator from PMID:31189998.
    - Pathophysiology split candidate: not split, but the deferral is now documented in
      a node notes block rather than only in the PR body. Splitting "Glomus Cell
      Proliferation Around Distorted Vascular Channels" would re-target four incoming
      edges, four outgoing edges and one target_mechanisms reference mid-review.
    - ICD-O 8711/0 schema gap escalated as monarch-initiative/dismech#7548, assigned to
      @cmungall, and cross-referenced from the CURATION_TODO discussion.

    NEC discipline maintained. The entry remains scoped to the perivascular soft-tissue
    neoplasm (NCIT:C3060, ICD-O 8711/0) and not the glomus jugulare/tympanicum
    paraganglioma sense. Every newly added reference was checked to be about the
    perivascular entity; PMID:20530151 in fact strengthens the guardrail and was added
    as a second evidence item on the naming-collision differential, since it explicitly
    instructs readers to distinguish glomus bodies from the unrelated adrenal and
    extra-adrenal paragangliomas also commonly called glomus tumors. Sporadic
    MIR143-NOTCH fusion-driven tumours remain distinct from germline GLMN glomuvenous
    malformation, and the bounding snippet that high nuclear grade alone is not
    metastasis-associated is untouched.

    Validation: just validate clean; just validate-terms passed; just
    validate-references 121/121 snippets verified (up from 103/103); weighted
    compliance 95.9% to 96.7%. All 26 references re-checked programmatically for
    reference_title agreement with their cache frontmatter (issue #7536): 26/26 match.
    Snippets were chosen to survive the validator's normalizer, which lowercases,
    maps Greek letters, replaces punctuation with spaces and collapses whitespace but
    does NOT fold ligatures or re-join hyphenated line breaks - so candidate quotes
    from the PDF-extracted body of PMID:31189998 containing fi-ligatures or
    hyphen-split words were rejected in favour of ligature-free equivalents.

    Outcome needs_followup: three items remain for a human - the ICD-O schema change
    (#7548), the pathophysiology node split, and the two HPO term requests
    (pinpoint/localized tenderness, generic metastasis).

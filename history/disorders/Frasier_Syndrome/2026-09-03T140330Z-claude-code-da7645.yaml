  summary: 'Create: Frasier Syndrome'
  details: |
    De novo curation of Frasier syndrome (MONDO:0007635) from a falcon deep-research report. Built the causal graph around the WT1 intron 9 donor splice-site lesion: the mutant allele cannot make the +KTS isoform, the resulting +KTS/-KTS imbalance drives both failure of testis determination and podocyte injury with segmental glomerular scarring. All three mechanism-to-mechanism edges carry edge-level evidence; the gonadal and renal branches are supported by a WT1 +KTS mouse dosage series. Validated with just validate: schema, terms, and 32/32 evidence snippets verified against cached references.

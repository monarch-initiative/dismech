    three review-type papers (PMID:11032329, PMID:23739620, PMID:33212314), says why
    they are HUMAN_CLINICAL - each aggregates human patient data, which is what
    evidence_source grades - and records the IN_VITRO split below.

    Finding 2 (fibroblast enzyme assays): both items quoting 'The activity of
    glycerol kinase (GK) in fibroblasts was <10% of reference' from PMID:15303806
    are regraded HUMAN_CLINICAL -> IN_VITRO. A skin-fibroblast enzyme-activity assay
    is a cultured-cell measurement by CLAUDE.md's own definition. The parent paper is
    mixed-source (20-year clinical follow-up plus the assay) and the evidence split
    was already done correctly; only the typing needed to follow it. Both items now
    carry IN_VITRO, so the one quoted sentence keeps a single evidence_source across
    the file.

    Retired-enum migration surfaced by the merge: main retired supports: PARTIAL in
    #10003 while this branch was behind, so three items carried a value the schema no
    longer has - one on the Glycerol Kinase Loss of Function node, one on
    Encephalopathic Crisis, one on the gluconeogenesis-versus-ketolysis knowledge
    gap. All three are migrated to SUPPORT with directness left absent, matching what
    #10003 did corpus-wide. None needed rewording: each explanation already argues
    'retained as a limit on the node' rather than naming the retired value, and each
    quote does support the claim as the node states it. The Encephalopathic Crisis
    node in particular already carries the seizure-without-catabolic-trigger caveat
    in its own description, so the quote supports the node as written rather than
    contradicting it.

    Branch state: merged origin/main (no rebase, no force-push). Every conflict was

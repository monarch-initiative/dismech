  summary: 'Create: Isolated Glycerol Kinase Deficiency (WP-007 row 3.2.01.01)'
  details: |
    New kb/disorders entry for isolated glycerol kinase deficiency (MONDO:0018459, GK/hgnc:4289, Xp21.2), taking IEMbase WP-007 seed row 3.2.01.01 off the package worklist. Identity was verified against MONDO before curating: MONDO:0018459 carries the ORPHA:408 equivalence from the seed row, while the seed row OMIM:307030 sits on the parent MONDO:0010613, which also subsumes the Xp21 contiguous-gene form; the parent is therefore recorded as a skos:broadMatch rather than used as the anchor, and complex GKD is curated as a differential diagnosis (MONDO:0010399) instead of a subtype. Juvenile (MONDO:0017295) and adult (MONDO:0017296) forms are curated as subtypes; the infantile form (MONDO:0017294) is deliberately excluded and the reason recorded as a RESOLVED INTERPRETATION discussion, because in MONDO it hangs off the parent term and its definition folds in complex-GKD patients. Nine-node pathograph with two arms: a metabolic arm (enzyme block to loss of glycerol entry into gluconeogenesis and glycerolipid synthesis to fasting/catabolic-stress intolerance to hyperketotic hypoglycaemic decompensation to encephalopathic crisis), conforming to three nodes of metabolic_intoxication_decompensation; and an analytic arm (hyperglycerolaemia to pseudohypertriglyceridaemia on lipase-based assay to misdiagnosis and ineffective lipid-lowering treatment), which is where the adult morbidity actually lies. Conformance to the module encephalopathy node was withheld because that node mechanism is ammonia-driven astrocytic injury. The amplifier conformance is qualified in the node text: only the energy-deficit arm applies, since glycerol has not been shown to be toxic and long-term vascular follow-up of hyperglycerolaemic patients was negative (PMID:41047305). Hypertriglyceridemia (HP:0002155) is deliberately NOT curated as a phenotype: it is a property of the assay, not of the patient. Validation run on this file: schema validation passed via the pre-edit hook; just validate-terms passed; just count-verified-snippets reported 60/60 snippets verified against cached references; check-title-snippets, check-duplicate-keys, check-term-cache-integrity and check-cache-order were all clean; a targeted pytest selection covering conforms_to node references, subtype foreign keys, unique names and model readouts passed. All ten references were fetched with just fetch-reference; no cache file was hand-written; cache diffs are additive only.

  summary: 'Review round 1: add congenital heart defect and strabismus phenotypes'
  details: |
    Response to the automated review on PR #10098 (ai4c-reviewer, CHANGES_REQUESTED). The one blocking item and two of the three non-blocking suggestions are addressed; the third is declined with a reason. Nothing disputed. Snippets 42 to 45 verified.

    Blocking item, congenital heart defects. Correct, and the reviewer's diagnosis of why it slipped is right: it was inside two quoted snippets already in the file but was never curated as a phenotype and, unlike sleep apnea or temperature dysregulation, was not covered by the scoping rationale given in the PR body either. So it fell into a gap between "curated" and "explicitly deferred". Added as Abnormal heart morphology (HP:0001627, OCCASIONAL) with two evidence items - the GeneReviews clinical-characteristics sentence already quoted elsewhere in the entry, and the independent 2025 case report. The binding is deliberately general: the reported defects are minor and no systematic imaging series exists, so a narrower term would assert structure the sources do not describe. The description says so.

    Non-blocking, vision abnormalities. Added Strabismus (HP:0000486, OCCASIONAL) from the same GeneReviews sentence. Amblyopia was left out on the grounds that it is a consequence of the strabismus rather than an independent finding, and both are named in one clause.

    Non-blocking, octreotide modality. Changed therapeutic_modality from SMALL_MOLECULE to PEPTIDE. Octreotide is an octapeptide and PEPTIDE is the accurate platform classification.

    Non-blocking, a third modeled_mechanisms link for the Asxl2 cardiac phenotype. Declined, on the condition the reviewer themselves attached to it - "if you cache a primary source for it". A PubMed search for an Asxl2 cardiac or skeletal mouse study returned nothing fetchable that reports it as a primary result. Adding the link on the strength of the deep-research report's assertion would be exactly the failure this entry's notes warn about, since that report carries no PMID or DOI anywhere in its body. If a primary source surfaces, the link is a small addition.

    A gap the fix exposed, now closed properly. The original PR body said a handful of GeneReviews features were "represented in prose rather than as structured phenotypes" but the prose in question was in the PR description, not in the entry, so it was invisible to anyone reading the file. The notes block now carries that scoping paragraph: it names which features are curated from the long clinical-characteristics sentence and which are not, and states that the omission is a choice about snippet economy rather than a judgement that the features are absent. That is the durable form of the argument.

    Two things the reviewer was explicit about not flagging, recorded because they were deliberate choices: the NO_EVIDENCE grading on the ASXL1 sentence, and the DOMINANT_NEGATIVE assignment paired with a KNOWLEDGE_GAP discussion setting out the contrary haploinsufficiency evidence. Both were confirmed as the right handling rather than as hedges.

    Validation after the round: schema validation passes; 45 of 45 evidence snippets verified; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

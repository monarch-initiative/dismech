  summary: 'Create: Shashi-Pena Syndrome (MONDO:0014963, ASXL2)'
  details: |
    De-novo curation of Shashi-Pena syndrome (SHAPNS), the ASXL2-related developmental disorder.

    Lump/split decision. Curated as its own kb/disorders entry. MONDO:0014963 is a leaf with one causal gene. The KB already carries the two paralogous disorders - Bohring-Opitz syndrome (ASXL1) and Bainbridge-Ropers syndrome (ASXL3) - and the Bainbridge-Ropers entry already names Shashi-Pena syndrome as a distinct differential with its own MONDO term. That is a positive signal for a separate entry rather than a has_subtypes entry, and it is why this entry is written to be read alongside those two: the useful clinical content is what separates the three, not what they share.

    Curation inputs. One Perplexity deep-research run (research/Shashi-Pena_Syndrome-deep-research-perplexity.md, committed alongside) plus independent PubMed E-utilities searching, and the GeneReviews chapter PMID:39527683 as the mandatory phenotype baseline.

    The report was used for orientation only. It contains no PMID and no DOI in its body - reference validation found no parseable references at all on the first run - and its term validation reported 6 of 7 checked labels naming a different term. Two of those are the failure mode hardest to catch by eye, because they are real terms with their labels swapped: UBERON:0004288 offered as "vertebral column" when UBERON calls it skeleton, and UBERON:0008896 offered as "skeleton" when UBERON calls it post-hyoid pharyngeal arch. Neither CURIE nor name looks wrong in isolation. Every CURIE in this entry was verified independently against OLS.

    GeneReviews baseline. PMID:39527683 is tagged in the top-level references and is the source for most phenotype frequencies, the surveillance schedule, and the agents-to-avoid item (prolonged fasting in those with hypoglycemia). Its Clinical Characteristics list was cross-referenced against the phenotypes block; features from it that are recorded are macrocephaly, macrosomia, developmental delay with variable intellectual outcome, infantile hypotonia, the facial gestalt, dental anomalies, feeding difficulty, hypoglycemia, seizures, scoliosis, aggression/attention difficulty and conductive hearing loss. Features left out of the structured phenotypes and represented only in prose are the skin findings, hypermobility, temperature dysregulation, sleep apnea and global volume loss on MRI - these were not dropped for lack of relevance but because each would need its own evidence item quoting the same long list sentence, which would multiply near-duplicate snippets without adding information.

    The mechanism is unsettled, and the entry records the disagreement rather than picking a side quietly. The defining 2016 study argued a dominant-negative effect on mRNA evidence: truncated ASXL2 transcripts escape nonsense-mediated decay and both alleles are expressed in blood. Its own wording is "likely to exert", not "demonstrated". A 2021 family reached the same diagnosis through a balanced t(2;11) translocation with RNA-seq showing decreased average ASXL2 mRNA - a haploinsufficiency mechanism. Both cannot be the general explanation. genetic_context carries functional_impact_category DOMINANT_NEGATIVE, which is a choice made with the contrary evidence in view and stated as such in the discussion, not in ignorance of it.

    An evidence item graded NO_EVIDENCE on purpose. The chromatin node cites a sentence from the ASXL cancer review saying it is not clarified whether ASXL1 truncating mutations give loss of protein or a stable truncated protein. That sentence is about ASXL1, not ASXL2, so it does not bear on this node's claim either way. Grading it NO_EVIDENCE rather than SUPPORT is the honest reading and keeps it citable as a record that the question is open across the family.

    Model organism recorded with its mismatch. The Asxl2 knockout mouse is entered once with two links: PARTIALLY_RECAPITULATES / LOW fidelity against the chromatin node, and RECAPITULATES / MODERATE against the metabolic node. The chromatin link's limitations state both mismatches - the readout is myeloid rather than neurodevelopmental, and a deletion may test a different molecular lesion than a truncating dominant-negative allele. The metabolic link is the one place in this entry where a mouse phenotype preceded and correctly anticipated a human one: ASXL2-null mice are glucose-intolerant, insulin-resistant and lipodystrophic through PPAR-gamma, and a single prepubertal case of type 2 diabetes with dyslipidemia and hepatic steatosis has since been reported. MODERATE fidelity reflects that the prediction was met once, not a systematic comparison, and the limitations say so.

    Two discussions, both OPEN: the dominant-negative versus haploinsufficiency question (KNOWLEDGE_GAP, with a proposed allelic series), and the absence of any model for the neurodevelopmental phenotype (HUMAN_MODEL_MISMATCH, with a proposed truncating-allele knock-in that would also address the first question).

    A schema gap encountered. The classifications block originally carried mechanistic_category "chromatin disorder", which the MechanisticCategory enum does not contain - its values are RASopathy, ciliopathy, laminopathy, collagenopathy, desmosomopathy, mitochondrial disease, amyloidopathy, tauopathy, synucleinopathy, intermediate filament disease and proteotoxic disease. The block was removed rather than forced into an ill-fitting value. The KB already holds several disorders of the epigenetic machinery, so a chromatinopathy value may be worth adding; that is a schema change and does not belong in a curation PR.

    Somatic-germline caution. ASXL2 is recurrently mutated in AML with t(8;21) and its mouse deletion causes an MDS-like disease. The genetic notes state explicitly that this does not license a cancer-risk claim for Shashi-Pena syndrome: GeneReviews recommends no malignancy surveillance, no case of myeloid malignancy in a SHAPNS patient appears in the material reviewed, and the germline and somatic variant classes are not the same lesion.

    Immune involvement. The 2025 hypogammaglobulinaemia case postdates the GeneReviews chapter and is recorded at VERY_RARE with its novelty stated in the description, so a later curator can see where the claim came from.

    Validation. Schema validation passes; 42 of 42 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

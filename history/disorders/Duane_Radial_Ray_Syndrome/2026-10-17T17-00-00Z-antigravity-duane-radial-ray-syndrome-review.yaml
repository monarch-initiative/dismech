  details: 'Conducted comprehensive curation review of Duane_Radial_Ray_Syndrome (MONDO:0011812):

    1. Added top-level `prevalence` and `progression` blocks documenting rarity, epidemiological context
    relative to isolated Duane retraction syndrome (~1:1,000), and embryonic/congenital onset of radial
    ray and abducens nerve malformations.

    2. Added `differential_diagnoses` distinguishing SALL4-related Duane-radial ray syndrome from TBX5-related
    Holt-Oram syndrome (MONDO:0007732), thalidomide embryopathy (MONDO:0018034, which degrades SALL4 via
    cereblon), and isolated Duane retraction syndrome (MONDO:0007473).

    3. Integrated `PMID:34081534` into `pathophysiology` (`Embryonic Limb-Renal-Ocular Developmental Disruption`)
    and `references`, and expanded short snippets (<5 words) in `inheritance`, `phenotypes`, and `treatments`.


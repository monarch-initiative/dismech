  summary: Curate the resolved familial IHH duplication with qualified regulatory
    mechanism
  details: |
    Created a descriptive locus-defined entry for the large IHH-containing tandem duplication reported in maternal half-siblings K1549/K1552 (PMID:22234151), distinct from KIF7-related acrocallosal syndrome, coding IHH disorders, and small enhancer duplications associated with craniosynostosis. No exact MONDO equivalent was identified; online GeneReviews and StatPearls checks found no dedicated chapter. Curated one duplication with coding-sequence and intergenic overlap, explicit IHH coding-overlap and regulatory-target roles, nine human phenotype records, and four linked mechanism stages.

    Verified the primary 913663 bp allele at hg18 chr2:219583780-220497443 from the original full text and breakpoint figure. The cached PMID and separately fetched DOI supply the abstract despite a full_text_html designation, so exact cached abstract snippets support the case observations and their explanations identify the additional full-text details. The duplication spans IHH plus 29 other or partial genes. POSTRE Table 1 Nr5 reports hg19 chr2:219907598-220954793; it is retained only as a secondary benchmark representation with unresolved bounds, not another patient or a resolved synonym. A read-only comparison with the official UCSC hg18ToHg19 chain did not reconcile these intervals.

    Separated measured patient-fibroblast ectopic IHH contacts (PMID:25959774) from proposed embryonic limb misexpression. The latter is GOE with PROVISIONAL confidence for this human duplication: expression was measured in the distinct Doublefoot mouse deletion, whereas human adult fibroblast IHH transcript was undetectable. Primary mouse evidence (PMID:18272352) supports reduced Gli3 repressor and limb-patterning consequences. No IHH-specific causal edge assigns the corpus-callosum or developmental-delay findings to this mechanism, and no biochemical protein gain-of-function is asserted.

    Completed research/IHH-Related_Polysyndactyly-deep-research-asta.md through the standard research-disorder runner with explicit requested claude_code to actual asta fallback provenance. Earlier Claude attempts exited without output; the explicit OpenAI fallback failed because its configured o3-deep-research model was unavailable. The successful Asta run is retrieval-only: 18 papers, 33 resolved identifiers, automated needs_review relevance warnings, and two unverified OMIM identifiers. Manually reviewed the results and excluded the IHH/idiopathic-hypogonadotropic-hypogonadism acronym collision, unrelated SNCA and IRXB duplications, distinct coding/small-enhancer IHH disorders, and other nonmatching alleles. Used independently checked primary literature rather than importing report claims. The newer mosaic-deletion report PMID:39941010 remains a distinct future lead outside this duplication-defined scope.

    Local LinkML schema, ontology terms, all 24 cached snippets, and named causal-target checks passed before the final review; the parent reviewer expanded four short abstract quotes without changing claims. Final six-entry data tests and batched disorder validation are coordinated by the parent agent. Reference caches were generated only through fetch-reference; the frozen shared accession cache was not accessed.

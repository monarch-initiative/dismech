  summary: Enriched IHH-Related Polysyndactyly with Harrison's classification, GO molecular function and limb anatomy/cell-type grounding, evidenced downstream phenotype edges, phenotype categories, diagnostic bindings, and genetic counseling.
  details: Added GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classification supported by PMID:22234151. Grounded the ectopic limb IHH expression node with unmodified GO:0005113 (patched binding), limb bud/limb anatomical locations, and limb bud mesenchymal cell types, added chondrocyte and digit anatomy to the embryonic digit patterning node, and linked the five craniofacial and neurodevelopmental phenotypes downstream of the 2q35 multigene duplication with explicit unknown-gene descriptions and PMID:22234151 evidence while keeping inheritance unbound and genetic relationship_type unset. Populated HPO organ-system categories on all nine phenotypes, added NCIT diagnostic bindings and clinical evaluation, and added genetic counseling for suspected maternal gonadal mosaicism under treatments.

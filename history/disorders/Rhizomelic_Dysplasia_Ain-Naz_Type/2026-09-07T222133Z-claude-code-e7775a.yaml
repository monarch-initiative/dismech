  details: |
    New entry for rhizomelic dysplasia, Ain-Naz type (MONDO:0859203, OMIM:619598), the GNPNAT1 disorder.

    LUMP/SPLIT. Curated as entry_type DISEASE. The stub carried one MONDO parent (MONDO:0018230 skeletal dysplasia) and no MONDO descendants — the leaf signature — and the literature supports a single entity: three families, two homozygous missense alleles in one gene, one skeletal pattern. No subtypes were created; the third family's expanded phenotype is recorded as phenotypes plus two open discussions, not as a subtype.

    GENE AND SCOPE, VERIFIED INDEPENDENTLY. GNPNAT1 was confirmed from the cached abstract of PMID:32591345, which states 'WGS data analyses identified a homozygous missense variant c.226G>A; p.(Glu76Lys) in GNPNAT1, segregating with the disease' — not taken from the task prompt. The distinction from MONDO:0859156 (dysostosis multiplex, Ain-Naz type) was verified the same way: PMID:33252156 identifies TMEM251 (LYSET) and describes a dysostosis multiplex-like phenotype with coarse facies, a different gene and a different skeletal pattern. OMIM identifiers were not taken on trust either: OMIM:619598 was confirmed as an xref of MONDO:0859203 and OMIM:619345 as an xref of MONDO:0859156 by querying the OLS MONDO records, since omim.org returned HTTP 403. The GNPAT/GNPNAT1 confusion risk (rhizomelic chondrodysplasia punctata, a peroxisomal group) is recorded both in notes and as an explicit differential-diagnosis record with no evidence item, flagged as a curation guardrail rather than a clinical claim.

    THIRD FAMILY FOUND BY PUBMED SEARCH, NOT BY THE REPORT. A PubMed query for 'GNPNAT1 AND (skeletal OR dysplasia OR chondrocyte OR bone OR stature)' surfaced PMID:35427807 (a second individual with the same c.226G>A p.(Glu76Lys) allele) and PMID:36097642 (an Egyptian patient with a second allele, c.77T>G p.(Phe26Cys), plus immunodeficiency). The deep-research report missed PMID:35427807 and counted two families; this entry curates three, six affected individuals.

    MECHANISM: A GAP, NOT AN ASSERTION. The pathophysiology is a five-node chain from the biallelic missense variants through reduced glucosamine-6-phosphate N-acetyltransferase activity and diminished UDP-GlcNAc supply to impaired growth-plate chondrocyte proliferation/differentiation and disordered endochondral ossification. Which UDP-GlcNAc-dependent process carries the phenotype — mannose-6-phosphate tagging, O-GlcNAcylation, N-glycosylation or glycosaminoglycan synthesis — is deliberately NOT asserted; it is discussion rdan_udp_glcnac_route, a KNOWLEDGE_GAP, with the M6P route named as tempting and unmeasured. The two mid-chain nodes are graded mechanism_confidence HYPOTHETICAL, the two downstream ones PROVISIONAL, and genetic_context.functional_impact_category is UNKNOWN because neither missense allele has been assayed (discussion rdan_variant_function_unmeasured). No conforms_to was declared: congenital_disorder_of_glycosylation scopes itself to the N-glycosylation machinery converging on demonstrated hypoglycosylation, and no hypoglycosylation has been measured in any patient, so declaring conformance would assert the route the entry records as open.

    PHENOTYPES FROM TWO SOURCES, KEPT DISTINGUISHABLE. Nine phenotypes carry exact quotes from cached PubMed abstracts. Twelve more come from the HPO Consortium disease annotation for OMIM:619598, retrieved and verified independently from ontology.jax.org on 2026-09-07 (41 terms with per-term fractions). Those twelve carry no evidence item — HPOA has no cached quotable body in this repository — and instead record the endpoint, retrieval date and exact fraction in per-phenotype notes, with discussion rdan_hpoa_provenance explaining the choice and recommending an HPOA reference source as the general fix. Three VERY_FREQUENT frequency bands are the 6/6 and 5/5 annotations and nothing else. Two HPOA annotations are exclusions and were NOT curated as features: intellectual disability HP:0001249 is 0/6 and abnormality of alkaline phosphatase level HP:0004379 is 0/1. The deep-research report listed intellectual disability as a phenotype; that error is recorded in discussion rdan_phenotype_breadth rather than carried. The HPO craniofacial annotations conflict with the second report's definition of rhizomelic SEMD as sparing the cranio-facial sphere; that tension is discussion rdan_craniofacial_tension (CONTROVERSY) and only Wormian bones was curated from that group.

    DEEP RESEARCH. The committed report is a claude_code report, not a falcon one. Provider chain attempted: falcon (HTTP 402, Edison account out of credits), then openscientist via --fallback (cancelled at about 20 minutes after sibling runs in this batch were reported timing out server-side at 3600 s), then claude_code, which completed in 319 s over 18 web searches and 34 turns. Report validation: references 4/4 resolved, 0 unresolved, 1/1 quote valid, 0 off topic; terms 57/62 resolved, 0 unresolved, 2 obsolete, 3 mislabelled, needs_review true. Nothing under unresolved_references or unresolved_terms was cited or bound. Two mislabelled terms mattered and were avoided: UBERON:0002520 is submandibular lymph node, not epiphyseal cartilage, and UBERON:0002544 is digit, not growth plate cartilage; this entry binds UBERON:0002516 (epiphyseal plate). just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0859203, so the manual preflight was done instead: the report's dominant gene is GNPNAT1 (30 mentions) against PGM3 (9, the pathway comparator) and TMEM251 (4, an explicit exclusion), and its OMIM set includes 619598.

    DIAGNOSIS AND DIFFERENTIALS. Three diagnosis records: radiographic skeletal survey (NCIT:C17369), whole genome sequencing (NCIT:C101294) and whole exome sequencing with Sanger confirmation and parental carrier testing (NCIT:C101295). Three differentials: the LYSET Ain-Naz disorder, PGM3 deficiency / immunodeficiency 23 (MONDO:0014353, the enzyme immediately downstream of GNPNAT1, cited from PMID:24931394 and PMID:33534079), and rhizomelic chondrodysplasia punctata as an explicit exclusion.

    MODEL. The siRNA Gnpnat1 knockdown in primary rat chondrocytes is curated as an experimental_models PRIMARY_CELL_CULTURE record with modeled_mechanisms (PARTIALLY_RECAPITULATES, fidelity LOW, model_scale CELLULAR, two readouts) and three typed divergences: CAUSE_UNREPRESENTED (INVALIDATING — knockdown models a null, not either missense allele), SPECIES_MISMATCH and BOUNDARY_OMISSION.

    WHAT WAS DELIBERATELY LEFT EMPTY. isds_skeletal_category and icimd_category (could not confirm the disorder appears in the 2023 ISDS revision or the 2021 ICIMD, and both may only be assigned to listed disorders); mechanistic_category (no value fits a nucleotide-sugar supply defect); progression, clinical_burden, stages, histopathology, biochemical, datasets, clinical_trials, animal_models and computational_models (no published data — the biochemical absence is itself the substance of rdan_udp_glcnac_route); therapeutic_modality on the supportive-care treatment. No GeneReviews chapter exists (PubMed searched 2026-09-07: 'GNPNAT1 GeneReviews[All Fields]' 0 hits; 'rhizomelic dysplasia GeneReviews[All Fields]' 1 hit, the Achondroplasia chapter). GNPNAT1 is absent from the ClinGen Gene-Disease Validity table downloaded 2026-09-07. No Orphanet record was found by name and OMIM query against the Orphanet API, recorded as not-found rather than as absent. No clinical trials: ClinicalTrials.gov queries for GNPNAT1 and for rhizomelic dysplasia returned zero studies.

    VALIDATION RUN TO COMPLETION. just validate-disorders passed with 47/47 snippets verified. just validate, just validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading, check-reference-titles, check-folded-hyphens, check-environmental-evidence, check-not4curation, check-term-cache-integrity and check-cache-order all pass. just qc as a whole was not run: it exceeds the available command timeout, so the individual gates were run instead. model-scale-audit --strict reports no scale gap for this entry's single model link. The cache diff is additive only (17 rows across 10 files), and only the eight references_cache files this entry cites are staged; two DOI caches written by the report's own validation step are left unstaged.

  summary: 'Address PR 7493 review: add diagnosis, classifications, clinical trials'
  details: |
    Response to the automated CHANGES_REQUESTED review on PR 7493.

    BLOCKING (finding 1): added a four-entry diagnosis: section (clinical/EKG criteria, resting and ambulatory electrocardiography, Holter monitoring, KCNJ2 molecular testing) built on exact quotes from the already-cached GeneReviews chapter PMID:20301441 and the ECG-criteria review PMID:24827800, plus PMID:32947483 for the QU-not-QT repolarization discriminator and the roughly 60 percent complete-triad caveat. NCIT diagnostic-procedure terms C124351, C38053, C38064 and C19770 were OAK-verified and confirmed reachable from NCIT:C25218.

    Finding 2: added a classifications: block. harrisons_chapter CARDIOVASCULAR, NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE, and channelopathy_category 'cardiac channelopathy', each with an evidence item. The channelopathy slot is single-valued, so the skeletal-muscle arm of this mixed cardiac/skeletal-muscle channelopathy is documented in notes and its evidence graded PARTIAL.

    Finding 3: removed the unevidenced claim that micrognathia is a risk marker for life-threatening arrhythmic events. No source supports it, and the largest ATS1 outcome cohort (PMID:32299589) names history of syncope, documented sustained ventricular tachycardia and amiodarone administration as the predictors. A phenotype note records the removal and its reasoning.

    Finding 4: completed GeneReviews GENETIC COUNSELING mining by adding the 50-percent-per-child transmission-risk sentence and the prenatal-diagnosis sentence to the inheritance block.

    Finding 5: added clinical_trials: for NCT00521794 (completed observational genotype-phenotype longitudinal study), NCT00839501 (phase I potassium/acetazolamide trial, terminated for under-recruitment) and NCT06205550 (phase II N-of-1 series comparing flecainide monotherapy with flecainide plus a beta-blocker or calcium channel blocker). All three were cached with just fetch-reference and are backed by exact-quote evidence.

    Non-blocking suggestions also addressed: a progression: block quantifying the 7.9 percent five-year cumulative risk of a first life-threatening arrhythmic event and its evidenced predictors; a new Beta-Blocker Therapy treatment carrying REFUTE evidence that beta-blockade did not reduce event rates; amiodarone added to the drug-avoidance treatment; and differential_diagnoses for CPVT and long QT syndrome using the cached differential content in PMID:24827800.

    One new literature reference was cached (PMID:32299589, Mazzanti 2020 JACC).

    Validation: just validate passed with 103/103 snippets verified; just validate-references clean; just validate-terms clean; just validate-grouping clean; dismech.groupings --strict reports Andersen-Tawil Syndrome SATISFIED; check_folded_hyphens clean.

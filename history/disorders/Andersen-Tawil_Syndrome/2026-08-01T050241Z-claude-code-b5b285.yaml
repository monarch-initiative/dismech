  summary: 'Create: Andersen-Tawil syndrome'
  details: |
    De novo creation of the Andersen-Tawil syndrome (ATS) entry. GeneReviews baseline applied: PMID:20301441 fetched, tagged and mined for the diagnostic triad, management, surveillance interval, and the Agents/Circumstances to Avoid warning (QT-prolonging medications, salbutamol inhalers, potassium-wasting diuretics). Curated: a seven-node pathograph in which a single KCNJ2 loss-of-function lesion with dominant-negative suppression of IK1 fans out into three separate arms - skeletal muscle resting-potential depolarization to episodic flaccid paralysis, delayed cardiac terminal repolarization to ventricular arrhythmia, and a developmental-signalling arm accounting for the dysmorphic features. Three nodes declare conforms_to against cardiac_ion_channel_repolarization (Cardiac Ion-Channel or Calcium-Handling Variant, Arrhythmogenic Substrate and Triggered Activity, Ventricular Tachyarrhythmia). Seven HPO-bound phenotypes, one gene, two diagnosis modes, five treatments, two KNOWLEDGE_GAP discussions (the unexplained developmental-signalling arm; the therapeutic tension in which GeneReviews recommends flecainide while cautioning that class I antiarrhythmics may paradoxically worsen the neuromuscular limb). Note on scope: this entry was selected after the user rejected myofibrillar myopathy as too generic; Long_QT_Syndrome.yaml explicitly excludes Andersen-Tawil as a distinct descendant, so it is an expected gap. The Edison/falcon deep-research run had not returned by the time the entry was completed, so all content rests on independently verified GeneReviews and primary literature. Validation: just validate passes, 32/32 snippets verified; compliance 82.6 percent global, 83.1 percent weighted.

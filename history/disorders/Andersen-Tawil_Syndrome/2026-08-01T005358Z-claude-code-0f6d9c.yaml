  summary: 'Create: Andersen-Tawil_Syndrome'
  details: |
    Created a new dismech Disease entry for Andersen-Tawil syndrome (MONDO:0008222), an autosomal dominant KCNJ2/Kir2.1 channelopathy. NEC preflight was run first (runoak MONDO:0008222 -O obo) and confirmed the causal gene KCNJ2 (HGNC:6263), OMIM:170390, and the LQT7 synonym before any deep-research content was used. Deep research was performed with falcon (Edison Scientific) via 'just research-disorder falcon'; the report was treated as leads only. Every PMID was independently fetched with 'just fetch-reference' and every one of the 73 evidence snippets was verified twice: once by 'just validate-references' against the committed cache, and once by an independent script re-fetching each abstract live from the PubMed efetch API, to guard against false-green validation from transiently full-text-enriched cache files. The GeneReviews chapter (PMID:20301441) was fetched, tagged in the top-level references block, and its Clinical Characteristics and Agents/Circumstances to Avoid sections were cross-referenced into the phenotypes and treatments. The pathograph models the entry's distinguishing feature, the divergence of a single Kir2.1 lesion into three tissue compartments: reduced cardiac IK1 leading to delayed terminal repolarization, triggered activity and bidirectional ventricular tachycardia; reduced skeletal-muscle IK1 leading to paradoxical sarcolemmal depolarization, fiber inexcitability and periodic paralysis; and disrupted Kir2.1-dependent bioelectric patterning of the anterior ectoderm leading to the craniofacial and skeletal dysmorphism. Five pathophysiology nodes declare conforms_to against the cardiac_ion_channel_repolarization module across its whole chain, including the key target 'Arrhythmogenic Substrate and Triggered Activity'. Two discussions were added: a HUMAN_MODEL_MISMATCH covering the Xenopus-only bioelectric craniofacial mechanism, and a KNOWLEDGE_GAP covering variant-specific flecainide proarrhythmia. Andersen-Tawil Syndrome was also added as a member of the Inherited_Arrhythmia_Syndromes grouping, which its own NECESSARY_AND_SUFFICIENT classifier had already flagged as a candidate. Validation: just validate, just validate-references (73/73), just validate-terms, scripts/check_folded_hyphens.py, just validate-grouping and just check-groupings all pass.

  summary: 'Review and enhance: Primary Hypertrophic Osteoarthropathy'
  details: |
    Normalized category to Mendelian and added synonyms (resolving check-genereviews --strict unproven status); added Harrison's chapter classifications while preserving the ISDS 2023 unverified-membership caveat; bound HPO inheritance terms; migrated prevalence off legacy percentage string with source-matched explanations; grounded HPGD (GO:0016404) and SLCO2A1 (GO:0015132) molecular functions, CHEBI:15551 chemical entities, biological_scale, UBERON locations, and an Increased Bone Resorption (GO:0045453) node linking PGE2 excess to Osteolysis (HP:0002797) while removing unsupported Connective Tissue Proliferation edges to Hyperhidrosis and Acne and preserving protected Periosteal New Bone Formation node name; added Osteolysis (HP:0002797) and cohort-backed phenotype frequencies from PMID:31508314, PMID:28963081, and PMID:40140750 (leaving chronic SLCO2A1-associated non-peptic enteropathy for dedicated primary SLCO2A1 GI cohort curation); normalized genetic features and added HPGD c.310_311delCT hotspot variant; normalized biochemical presence values with CHEBI:15551 biomarker_term and readouts; added structured diagnosis entries (WES, bone radiography, urine chemistry); enriched treatments (removing contradicted Periosteal New Bone Formation target_mechanisms link on Etoricoxib, harmonizing PMID:37705574 and PMID:31508314 evidence grading, and adding Bisphosphonate/pamidronate CHEBI:7903); added clinical trial NCT02438709; and removed empty datasets key.

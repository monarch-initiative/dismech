  summary: 'Genetics pass: wire HPGD/SLCO2A1 into nodes and subtypes'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    Both causal genes were already bound with `gene_term` on the `genetic:` records,
    but neither reached a pathophysiology node and neither `has_subtypes` row
    carried a gene, so gene-to-mechanism wiring was 0/3.

    Changes:
    - `genes:` descriptors bind HPGD (`hgnc:5154`) to the PGE2-degradation node and
      SLCO2A1 (`hgnc:10955`) to the PGE2-transport and myelofibrosis nodes, each
      with a `subtypes:` scope. Wiring is now 3/3.
    - `genetic_context` on the two upstream nodes. The SLCO2A1 node deliberately
      records no zygosity, because zygosity is what separates PHOAR2 from PHOAD.
    - `genes:` on all three `has_subtypes` rows.
    - The third genetic record, `SLCO2A1 (Dominant)`, had no `gene_term` at all; it
      now binds SLCO2A1.
    - `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` on all three
      genetic records.
    - Separately, a prose-figure audit flagged the `16.9%` delayed-cranial-suture
      frequency in `phenotypes[]` as uncited. It is genuine: the literature-review
      section of PMID:40140750, which the same phenotype already cited, states it.
      An evidence item was added and that reference's cache upgraded to full text.
      No figure was changed.

    Verification: full offline gate list passes; `just check-genereviews` reports no
    GeneReviews chapter for this disease, which is expected and is not a gap.

  details: |
    Review round 1 on PR #14682. The reviewer noted that the shared snippet behind the split CSF HVA and CSF 5-HIAA markers says only "low neurotransmitter levels" and names neither metabolite, and suggested that if a source reporting the two separately were cached it would ground each split marker better.

    One is cached. PMID:32022462, already cited in this entry and held as full text, reports a CSF neurotransmitter panel in a genetically confirmed dihydropteridine reductase deficiency with each metabolite given separately against its own reference interval: 5-HIAA at 19 nmol/L against a normal range of 114 to 336, and HVA at 170 nmol/L against 295 to 932. Each split marker now carries the clause naming its own metabolite, alongside the original PMID:40243727 item.

    Because the evidence now separates the two metabolites, the sentence in each context saying it does not is removed. That sentence was accurate when written, since both markers then carried only the combined citation.

    The two new snippets are quoted in plain ASCII although the source uses a unicode hyphen in the analyte name and em dashes before the values. Both verified against the cache by the reference validator, which normalizes punctuation on both sides.

    No bindings or cache rows changed, and no reference cache file was added.


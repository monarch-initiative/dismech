  summary: 'Create: PBX1-Related Syndromic CAKUT (CAKUTHED)'
  details: |
    De novo curation of MONDO:0060549 (PBX1, AD CAKUTHED). claude_code deep research. Mechanism: PBX1 haploinsufficiency -> impaired PBX/HOX transactivation -> metanephric mesenchymal dysfunction (reduced ureteric branching/nephron number -> renal hypoplasia) and impaired urogenital-ridge development (DSD/cryptorchidism), with cardiac/ear/diaphragm branches. ClinGen DEFINITIVE (Syndromic Disorders GCEP) in gene_disease_validity. Pbx1-null and p.R184P knock-in mouse models RECAPITULATE renal and dominant developmental phenotypes. 19/19 snippets verified; all gates pass.

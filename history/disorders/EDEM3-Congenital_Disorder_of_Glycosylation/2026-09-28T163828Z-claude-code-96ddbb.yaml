  details: |
    New entry for EDEM3-CDG (CDG type 2v, MONDO:0030423, gene EDEM3), claimed in issue #13088. Deep research was requested from falcon; no Edison key was configured, so the run used dr_fallback and the report was produced by claude_code (research/EDEM3-Congenital_Disorder_of_Glycosylation-deep-research-claude_code.md; frontmatter records fell_back and requested_provider falcon). Report reference validation: 10/10 identifiers resolved and 29/29 quotes valid. The four term-validation mislabels were table-cell text beside correct CURIEs, not wrong bindings. preflight-dr returned WARN because the report cites the EDEM3 gene MIM (610214) alongside the phenotype MIM (619493) that MONDO cross-references; EDEM3 is the dominant gene in the report (43 mentions), so the report is about the right disease. The human clinical evidence is a single series (PMID:34143952, 12 individuals, 7 families); a PubMed search found no later case reports and check-genereviews --online returned NO_CHAPTER. Biochemistry is from PMID:34698634, 16431915 and 39838427 (hepatoma cells, used only as a contrasting REFUTE item on the direction of the ER stress response). The congenital_disorder_of_glycosylation module was not used as a conformance target because its shared lesion is protein hypoglycosylation, whereas EDEM3-CDG is a defect in ER mannose trimming with normal transferrin glycosylation.
    A fresh-context red-team review before the PR (7 important, 9 minor, no critical findings) led to these changes: the glycan phenotype was rebound from HP:0012355 (abnormal mannosylation, i.e. adding mannose) to HP:0410356 Abnormal high-mannose N-glycan level; the glycan-profile node process was changed from GO:0006487 protein N-linked glycosylation to GO:0006491 N-glycan processing; the unsupported ERAD-to-blunted-PERK edge was replaced by an indirect edge from the trimming node citing the authors' Glc1Man5 rationale; the trimming-to-phenotype edges were reduced to one edge to HP:0012758 Neurodevelopmental delay (replacing HP:0001263) carrying the authors' statement that the mechanism is undetermined; the intellectual-disability frequency was removed because the paper reports only a combined count; fibroblast cell_types were removed from the trimming node as an assay system; the knockout-hepatoma REFUTE item now quotes the knockout sentence with directness INDIRECT; the mouse-model description, Glc1Man5 hedge, missense loss-of-function wording, biomarker presence values, the remaining truncating variants and the normal-MRI evidence were added or corrected; and session narration was removed from notes. The reviewer's suggestions to use supports: PARTIAL were not taken because that value has been retired from the schema. Validation: just validate 57/57 snippets; check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-coarse-phenotypes all OK. Stub stubs/Congenital_Disorder_Of_Glycosylation_Type_2v.yaml deleted.

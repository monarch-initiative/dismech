  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for LMX1A (Definitive, autosomal dominant, 2025-04-22), which the entry already cited. The panel files it under MONDO:0019587 autosomal dominant nonsyndromic hearing loss, which the entry now maps as skos:broadMatch; that term's rows were added to the MONDO term and disease enum caches by validation. Set variant_origin GERMLINE. The reduced-transactivation node bound the general GO:0003700; it now binds GO:0001228, the RNA polymerase II activator term, which is what the reporter assays the node cites measure. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

  details: |
    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000 Hz per ear) to the existing Molecular diagnosis with clinical and vestibular assessment row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not the molecular testing, vestibular evaluation or imaging also described there. No reference range is bound: the entry's own phenotype section documents loss that is both progressive and markedly asymmetric between ears in most affected individuals, and a 2026 report is titled around familial phenotypic heterogeneity in this gene, so a single better-ear average band would misrepresent the asymmetry this entry's own diagnostic criteria rest on.

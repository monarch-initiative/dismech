  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 7 (DFNA7, LMX1A)'
  details: |
    De novo curation of DFNA7 (MONDO:0011074, LMX1A hgnc:6653) from the stub queue. entry_type decided as DISEASE: a single causal gene, no MONDO descendants, and one conserved pathograph running from LMX1A haploinsufficiency through reduced transactivation of target genes to a maintenance failure of cochleovestibular function. Not a subtype of any existing dismech entry; LMX1A previously appeared in kb/ only as an RFX6 target gene in Mitchell-Riley_Syndrome, which is not disease coverage of DFNA7.

    The organising point of the entry is the human/mouse dissociation. Every Lmx1a animal model of deafness is a homozygous null with gross labyrinthine malformation, while human DFNA7 is a heterozygous, imaging-normal ear that deteriorates; mouse heterozygotes hear normally. Both mouse models are therefore curated with FAILS_TO_RECAPITULATE links against the human maintenance node alongside PARTIALLY_RECAPITULATES against the transcriptional node, and a HUMAN_MODEL_MISMATCH discussion carries the unresolved translational question with a proposed aged-heterozygote experiment. A second KNOWLEDGE_GAP records that nothing in the curated mechanism explains the characteristic interaural asymmetry.

    Evidence: 11 references fetched with just fetch-reference; 53/53 snippets verified against the local cache. Haploinsufficiency rather than a dominant-negative effect is supported by three independent groups. The recessive LMX1A allele (PMID:29971487) is curated in genetic: as a boundary marker with an explicit note that the recessive phenotype is a separate MONDO concept not covered here. Asymmetric hearing loss is bound to HP:0000407 with the asymmetry carried by preferred_term because HPO has no asymmetric-hearing term; recorded in notes. Hearing-aid fitting is left with an unbound free-text treatment_term for the same reason as DFNB106. Cochlear implantation and speech rehabilitation are deliberately not curated because no DFNA7-specific report documents them.

    Deep research: a falcon report was run and preflighted against MONDO:0011074. Verdict WARN, not FAIL, and inspected: the gene profile is LMX1A=50 with the next gene at 3, and the OMIM mismatch comes from the report quoting the LMX1A gene MIM 600298 and the broad concept MIM 500008 while explicitly stating it could not verify a disease-specific OMIM. Not Named Entity Confusion. The entry was nevertheless curated from primary sources and every snippet re-verified against the cache rather than lifted from the report.

    Validation: just validate exit 0, just validate-terms exit 0, just check-entity-refs exit 0, just check-duplicate-keys exit 0.

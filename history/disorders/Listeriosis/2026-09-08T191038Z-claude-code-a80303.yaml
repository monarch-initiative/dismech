  details: |
    Response to the CHANGES_REQUESTED review on PR #11189. All eight blocking findings and all five suggestions were addressed in one push.

    Blocking. (1) The PMID:39458411 internalin sentence was graded HUMAN_CLINICAL on the environmental link and IN_VITRO on two pathophysiology items; regraded IN_VITRO throughout, since the internalin work behind that review sentence is cell culture. (2) prevalence was empty; three ANNUAL_INCIDENCE records added from the sentence at line 63 of the cached PMID:39458411, each with an explicit rate_denominator (POPULATION_PER_YEAR for the global figure, LIVE_BIRTHS for the two neonatal ones). No prevalence_class, since the enum now carries only qualitative tiers. (3) A diagnosis section was added: blood culture as the gold standard, cerebrospinal fluid culture, the ~36 h to detection, and placental culture at 80% against 55% sensitivity for the maternal-fetal form. (4) A clinical_burden block was added carrying the PMID:38733495 fatality figures, and the neurolisteriosis fatality sentence and the CNS risk-factor sentence were attached to the Central Nervous System Invasion node whose description had asserted them without evidence. (5) The distal half of the pathograph was connected. Central Nervous System Invasion now reaches Meningitis, Meningoencephalitis, Headache, Reduced Consciousness and Seizure; Haematogenous Dissemination reaches Sepsis and Fever; Placental Infection reaches Fetal Distress and Premature Birth. All targets are bare names. Gentamicin gained target_mechanisms on the cytosolic replication node. (6) Two statements that the later work invalidated were corrected: review_notes claimed dataset curation was not attempted, and datasets[0].notes claimed no evidence block was attached three lines above an attached one. (7) has_subtypes was added for early-onset and late-onset neonatal disease, with granulomatosis infantisepticum as a child of the early-onset entry, carrying its 80% preterm mortality and its cutaneous nodules. (8) Trimethoprim-sulfamethoxazole was added as the beta-lactam-allergy alternative, with the first-trimester folate-antagonism caution recorded.

    Non-blocking. Abdominal pain (12%, HP:0002027, OCCASIONAL) was added from the sentence already quoted five times. Amoxicillin was bound as a second therapeutic_agent (CHEBI:2676). Gentamicin was rebound from CHEBI:5312 (the sulfate salt) to CHEBI:17833 (the aminoglycoside entity) rather than to the reviewer-suggested CHEBI:27412, which is gentamycin C1, a single congener. The placental node now carries CL:0000523 and CL:0000525 rather than the generic trophoblast parent, with the resistance/susceptibility sentence as evidence. An animal_models block was added with three models: the conventional mouse as FAILS_TO_RECAPITULATE against intestinal invasion (murine E-cadherin is not an internalin receptor), the humanised E-cadherin knock-in mouse, and the guinea pig. A HUMAN_MODEL_MISMATCH discussion attaches to the intestinal and placental nodes with two proposed experiments.

    References. Three new PMIDs cached and cited: PMID:10406800, PMID:11387478, PMID:18806773. Two PMIDs guessed from memory during drafting resolved to unrelated papers and were deleted before use; the correct ones were found by PubMed search.

    Deliberate omissions, recorded in review_notes so the next reviewer does not read them as gaps. Vomiting and Abdominal Pain are left without an incoming causal edge: the cohort that supplies their frequencies reports them as manifestations of invasive disease without attributing them to a step, and the only cached sentence that places gastrointestinal symptoms mechanistically describes the non-invasive gastroenteritis form. Every other phenotype is now reached from the chain. The three subtypes carry no subtype_term because MONDO has no term for either neonatal form or for granulomatosis infantisepticum; the test_data warning is expected. The two proposed experiments carry evidence but no datasets, which is correct for an experiment that has not been run. Validation. just validate and just validate-disorders passed schema, term and reference validation with 80/80 snippets verified against cached references. just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-enum-values, just check-snippet-grading, just check-title-snippets, just check-snippet-length, just check-reference-titles, just check-folded-hyphens, just check-empty-snippets, just check-source-defect-claims and just check-not4curation all pass. pytest tests/test_data.py passed 6270 tests. Compliance is 98.9 percent global and weighted.

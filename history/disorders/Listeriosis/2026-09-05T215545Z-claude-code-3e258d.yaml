  summary: 'Create: Listeriosis'
  details: |
    New entry for listeriosis (MONDO:0005828), curated from an Edison falcon deep-research report (research/Listeriosis-deep-research-falcon.md) plus primary literature. Every snippet was extracted programmatically as an exact substring of the cached reference rather than transcribed, because the two full-text sources use en-dashes and curly apostrophes that hand-copying gets wrong. The pathograph runs ingestion, internalin-mediated intestinal epithelial invasion, listeriolysin O escape from the phagosome, cytosolic replication with ActA-driven cell-to-cell spread, failure of Th1 cellular containment, haematogenous dissemination, and then branches to CNS invasion and to placental infection with fetal compromise. The environmental entry links the food exposure into the pathograph with TRIGGERS and carries its own evidence block. Ten phenotypes, two treatments, two GEO datasets. Falcon suggested GO:0030260 for entry into host cell, GO:0046710 for phagosome escape and GO:0009405 for pathogenesis; the first does not exist, the second is GDP metabolic process and the third is obsolete, so all three were replaced with terms resolved through OAK (GO:0046718, GO:0141160, GO:0070360). HP:0005268 Miscarriage was rejected by the PhenotypeTerm dynamic enum because HPO files it under clinical course rather than phenotypic abnormality; Fetal distress HP:0025116 is bound instead and the miscarriage and stillbirth outcomes are described in the placental node. Validated with 'just validate': 37/37 snippets verified, term validation clean. check-entity-refs and check-duplicate-keys pass, 'just verify-datasets' resolves both accessions, compliance 100.0% global and weighted.

  summary: Remove tooling prose from genetic_context description
  details: |
    The genetic_context.description on the BCR-ABL1 Fusion Oncogene Formation node explained how the cell-of-origin derivation reads the record ('Marking the lesion here identifies this node as the origin of the disease, so the cell of origin is read from its cell_types'). That is curation mechanics in a field rendered to domain scientists on the disorder page, and the convention it described is documented in docs/cancer-cell-of-origin.md. Replaced with variant-level content: the acquired somatic t(9;22)(q34;q11) and the p210 BCR-ABL1 fusion product, the latter already asserted in this entry's genetic block. Deliberately does not restate the parent node's description, which already covers the BCR/ABL1 juxtaposition and the constitutive kinase activity; an intermediate draft did restate it and was trimmed after review. Marking and cell binding are unchanged, and the entry still derives CL:0000037 hematopoietic stem cell.

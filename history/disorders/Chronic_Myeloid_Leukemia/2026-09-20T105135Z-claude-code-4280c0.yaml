  summary: 'Genetics pass: bind BCR and ABL1 as somatic drivers, wire both into the
    fusion node, fix a stale MONDO label'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO's checklist gene for MONDO:0011996 is BCR. It was a genuine curation gap in the sense that mattered: the entry had a genetic record called BCR-ABL1 with no gene_term at all, so gene_to_edge in src/dismech/export/kgx_export.py emitted nothing for this disease.

    What changed. The unbound BCR-ABL1 record was replaced by two bound records, BCR (hgnc:1014) and ABL1 (hgnc:76), both relationship_type SOMATIC_DRIVER and variant_origin SOMATIC. A fusion has two partner genes and gene_term binds one, so one record per partner is the only shape that exports both. The BCR-ABL1 Fusion Oncogene Formation node gained a genes list with both, and its genetic_context gained the same pair plus a sentence saying why they are bound together. ABL1 additionally carries the acquired kinase-domain resistance role (T315I) with the Gorre 2001 primary result and the CIViC resistance evidence item, and its notes distinguish that later, selection-driven event from the initiating translocation.

    Disagreement with MONDO. MONDO asserts RO:0004003, has material basis in germline mutation in, between MONDO:0011996 and BCR. BCR::ABL1 is an acquired somatic translocation; germline BCR variation does not cause CML, and BCR is not mutated even in the fusion - it contributes the 5' end and the coiled-coil domain that forces the ABL1 kinase into a constitutively active state. The consequence in MONDO is visible: MONDO:0011996 is classified under MONDO:0003847 hereditary disease. The BCR record records this disagreement in its notes. Reported for a maintainer to decide on an upstream MONDO issue; not filed from here.

    Stale ontology cache corrected. The entry bound MONDO:0011996 with label 'chronic myelogenous leukemia, BCR-ABL1 positive'. Both ols:mondo and the local sqlite build now return 'chronic myeloid leukemia'. just validate-terms passed anyway because cache/mondo/terms.csv held the old label from 2026-03-18 and validation is cache-first. Following the term-cache recovery procedure, the single stale row was removed and re-derived through just validate-terms, and the entry's term.label updated to match.

    Cancer rules. just check-cancer-origin reports the same result before and after: one origin node identified via SOMATIC_LESION, cell of origin CL:0000037 hematopoietic stem cell. No germline gene was added to a somatic entry and no new disease entry was created.

    Validation. just validate-pre-edit, count-verified-snippets 38/38, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean.

    Not addressed. Phenotype causal inlink for this file is 0/7 and unchanged. Wiring the clinical features to the signalling cascade is real curation outside a genetics pass, and an edge added to move a metric is worse than no edge.

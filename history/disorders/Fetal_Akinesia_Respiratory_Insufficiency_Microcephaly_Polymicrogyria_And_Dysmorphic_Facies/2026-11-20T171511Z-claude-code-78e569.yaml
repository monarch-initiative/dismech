  summary: 'Fix CI: re-wrap a snippet whose folded line ended in Cl-'
  details: |
    The test job failed the 'Check for folded-scalar hyphen splits' gate (just check-folded-hyphens) on one line of the Atp1a2 mouse model's link evidence: a folded block scalar line ended in 'Cl-', the chloride ion as the source writes it.

    The trailing hyphen is real text, not a folding artefact, and YAML folding turns the line break into a space either way, so the quoted string was never corrupted - just count-verified-snippets reported 65/65 before and after the change. The gate flags the shape because it cannot tell a real trailing hyphen from a split word.

    CLAUDE.md says the right remedy when this gate flags genuinely correct text is to teach the detector the shape and pin it with a test, as it already does for suspended hyphens and clinical negativity markers, rather than record an exception. That is a change to scripts/check_folded_hyphens.py plus a test, which is unrelated cleanup and belongs in its own PR rather than inside a curation PR. The snippet was re-wrapped instead so the line does not end on the hyphen: formatting only, the folded string is byte-identical, and no exception was recorded. A follow-up to teach the detector 'Cl-' and similar ion notations would be worth opening separately.

    This gate was also one I had not run. check-folded-hyphens has no baseline, so any finding fails, and the finding was present from the first push - earlier CI runs were still in progress when I read their status, so I recorded 'checks: in_progress' without seeing the failure. The full ungated whole-tree gate list is now run against each entry rather than only the per-file ones plus validate-disorders.

    Validation: just check-folded-hyphens (now OK), just check-folded-yaml, just count-verified-snippets (65/65 unchanged) and just validate-disorders (0 issues).

  summary: 'Review round 2: replace two two-word snippets that supported nothing'
  details: |
    Round 2 on PR #18550. One blocking item, and it was a gate I had not run.

    The two new dentato-olivary evidence items added in round 1 each quoted the bare term 'dentato-olivary dysplasia' - two words. just check-snippet-length enforces a five-word floor with no grandfathering for new findings, and it fails on both. The floor exists for exactly this: a bare noun phrase is not a statement and cannot support a claim, so the snippet looked like evidence while carrying none. Both now quote the full clause from the same PMID:31608932 sentence, which is an exact substring and contains the dentato-olivary finding in context, and each explanation says why the full clause was used rather than the term.

    The miss was procedural: check-snippet-length is one of the ungated whole-tree CI checks CLAUDE.md lists, and I ran the per-file gates and validate-disorders in round 1 without running it. It has since been run against all three entries in this batch: FARIMPD now passes, and IDDALDS and urocanic aciduria were already clean.

    Two suggestions were carried over by the reviewer and remain declined, with the reasons given in round 1 unchanged. The eight uncited references_cache files are all cited by the committed deep-research report, and every other committed report in the repository caches all of its own citations, so dropping them would diverge from that convention and could fail qc-deep-research's citation coverage; if the convention should be narrower, that is a repository-wide decision rather than a one-off here. The frequency counts remain unsuitable because FrequencyEnum's OBLIGATE asserts a property of the disease that an n=4 index series does not establish, and inguinal hernia appears in no cached paper's text, only in the report's reproduction of an annotation table.

    Validation after the change: just validate-disorders (65 snippets, 67 titles, 0 issues), just count-verified-snippets (65/65), just check-snippet-length (no new findings), plus the per-file gates run in round 1.

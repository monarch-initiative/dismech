  summary: 'Review round 1: curate the missing autopsy phenotypes, debundle the grey-matter
    node'
  details: |
    Addressed both blocking findings and three of five suggestions on PR #18550.

    I2 was a real defect of the kind worth naming: the entry-level notes said meningeal arterial calcification 'is curated as such' when no phenotype row existed, so the sentence was false. Prose about repository state rots against the content it describes. Fixed by adding the row and by rewriting the sentence to say what is actually true - curated as a phenotype row with no inbound edge, because the mechanism that would explain it is the knowledge gap.

    I1, I2 (rows added). Three phenotype rows, each term looked up in the step it was written:
    - HP:0007363 Aplasia/Hypoplasia of the pyramidal tract, resolved against OLS. Exactly matches the source's 'severe hypoplasia/agenesis of the pyramidal tracts'.
    - HP:0100250 Meningeal calcification, resolved against OLS. HPO has no meningeal-artery term; the searches run are recorded in the row's notes, and the arterial specificity is in preferred_term.
    - HP:0100321 Abnormal dentate nucleus morphology for dentato-olivary dysplasia. HPO has no term for the combined lesion; searching HP for 'dentato-olivary dysplasia' returns nothing, and the cache yields only HP:0100321 and HP:0008303 Olivary degeneration. HP:0100321 is bound as accurate for the dentate half with the olivary component in preferred_term; HP:0008303 was rejected because degeneration is not what the source describes.

    S1 (taken). The bundled node was split into Basal Ganglia and Dentato-Olivary Grey Matter Necrosis and Pyramidal Tract Hypoplasia. The reviewer's reason was right and the node's own description gave it away by assigning the tract lesion a separate role. The split let the second route to akinesia be drawn as an edge from the tract node into Absent Fetal Breathing and Spontaneous Movement, graded INDIRECT_UNKNOWN_INTERMEDIATES because no study separates its contribution from the brainstem one. Every reference to the old node name was repointed - the inbound edge from the excitotoxic node and both discussion anchors - and the patch asserted the old name no longer appears anywhere, since a dangling bare target would have been silent.

    S3 (taken). sequelae on the fetal akinesia sequence now connect arthrogryposis, polyhydramnios, hydrops and the dysmorphic facies, using evidence already in the entry; hydrops is graded indirect with unknown intermediates because the route from akinesia to fluid accumulation is not established here. A further edge connects neonatal death to the respiratory insufficiency the ClinGen record names as its cause. Phenotype connectivity went from 10 of 15 to 11 of 15.

    Four phenotypes are left unconnected on purpose and the reason is now in notes: microcephaly, seizure and congenital diaphragmatic hernia have no mechanism stated by any source read, and writing plausible edges would put an inference in the graph where the literature has none; meningeal calcification is unconnected because its mechanism is the vascular knowledge gap.

    S5 (taken). Two BACKGROUND quotes were regraded. 'The Na+/K+- ATPase acts as an ion pump...' is general physiology, now OTHER rather than HUMAN_CLINICAL. 'The alpha2-isoform ... Cl- homeostasis in neurons, and in the function of respiratory neurons at birth' restates the mouse literature, now MODEL_ORGANISM. The reviewer was right that nothing in either sentence is a human clinical observation.

    S2 (declined). The counts offered are 4/4, 3/3 and 2/2 from the report's reproduction of the OMIM/HPO annotation table. FrequencyEnum's OBLIGATE means present in all cases of the disease, which an n=4 index series does not establish, and a FrequencyQuantity fraction on those denominators invites over-reading. Inguinal hernia was also declined: it appears only in that annotation table and in no cached paper's text, so there is nothing to quote.

    S4 (declined, with the reason). The eight uncited references_cache files are all cited by the committed deep-research report, which was checked PMID by PMID. Every other committed report in the repository caches all of its citations - spot-checked at 19/19, 24/24 and 39/39 - and qc-deep-research checks citation/reference coverage, so dropping them would diverge from the corpus convention and could fail that check.

    Validation: just validate, just validate-terms, just count-verified-snippets (65/65), just validate-disorders (65 snippets, 67 titles, 0 issues), plus check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-block-scalar-comments, check-cache-order and check-name-collisions.

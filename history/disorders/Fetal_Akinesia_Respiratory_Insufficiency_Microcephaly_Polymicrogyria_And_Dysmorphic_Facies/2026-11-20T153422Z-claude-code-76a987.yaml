  summary: 'Create: FARIMPD (MONDO:0859204, ATP1A2)'
  details: |
    De novo curation of FARIMPD from an OpenScientist deep-research report plus the primary literature ClinGen's gene-validity record names.

    Deep research: research/Fetal_Akinesia_Respiratory_Insufficiency_Microcephaly_Polymicrogyria_And_Dysmorphic_Facies-deep-research-openscientist.md (OpenScientist; 15/15 references verified, confabulation_rate 0.0). just preflight-dr returned WARN; resolved by reading the sections naming the secondary gene.

    Terms: the report's own term validation recorded 16 of 69 checked labels as mismatched, including every NCIT treatment term and every UBERON anatomical term it proposed (NCIT:C15346 offered as 'Physical therapy' is Vaccination; NCIT:C53555 as 'Comfort care' is Luminal B Breast Carcinoma; UBERON:0002634 as 'Pyramidal tract' is anterior nucleus of hypothalamus; UBERON:0002129 as 'Dentate nucleus' is cerebellar cortex; UBERON:0013694 as 'Inferior olivary complex' is brain endothelium). It also offered HP:0002803 for arthrogryposis multiplex congenita, which is Congenital contracture. None of those identifiers was used. Every CURIE was read from the committed term caches, or resolved against OLS or the Alliance in the step it was written. MGI:88106 was confirmed as Atp1a2 (Mus musculus) at the Alliance and cached by just check-gene-namespaces-online.

    Two schema facts worth recording for the next curator. HP:0003811 Neonatal death and HP:0001522 Death in infancy are both real, correctly labelled terms that sit OUTSIDE the PhenotypeTerm dynamic enum, so a lethal disorder cannot bind its own lethality; the row carries a free-text preferred_term instead, and the reason is in its notes. HP:0001999 Abnormal facial shape is in the curated coarse set and carries coarse_binding_basis: SOURCE_UNSPECIFIED, because the reports say 'dysmorphic features' without itemising them.

    Curation stance. The pathograph runs from biallelic ATP1A2 loss of function through the protein-null state, collapse of the local Na+/K+ gradients, and two demonstrated branches - KCC2-dependent chloride extrusion failure and impaired glutamate/GABA reuptake - to brainstem respiratory rhythm failure, absent fetal movement and breathing, the fetal akinesia deformation sequence, and the autopsy neuropathology. The vascular (NCX reverse-mode) branch is deliberately NOT drawn as edges: the deep-research report marks it inferred, and the arterial-physiology paper it cites (PMID:21048395) is a review of salt-induced hypertension that the report's own relevance assessment flagged off-topic. It is a KNOWLEDGE_GAP discussion and a references entry instead.

    A HUMAN_MODEL_MISMATCH discussion records the substantive finding that the Atp1a2-null mouse reproduces the akinesia and the fatal respiratory failure but none of the four structural brain features that define the human disorder, so the malformation arm of this disease has no animal model. The same fact is typed on the model link as an INCOMPLETE_PHENOTYPE divergence (QUALIFYING) rather than SPECIES_MISMATCH, since a mouse can express cortical malformation.

    This entry is the recessive arm only. ClinGen holds a second, separate Definitive record for ATP1A2 against the dominant hemiplegic migraine / DEE spectrum (MONDO:0100539, Epilepsy GCEP); it is named in notes and not modelled as a subtype.

    One snippet had to be re-chosen: a sentence quoting measured sodium and calcium concentrations could not be used because the reference validator strips bracketed spans before matching, and bridging them would have dropped the ion identities the claim depends on. A bracket-free sentence from the same abstract carrying the same colocalisation point was used, and the reason is recorded in that evidence item's explanation.

    Validation: just validate, just validate-terms, just count-verified-snippets (53/53), just validate-disorders (53 snippets, 55 titles, 0 issues), plus check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-qualifier-terms, check-block-scalar-comments, check-name-collisions and check-gene-namespaces. just check-genereviews reports TAGGED_RETIRED, which never gates: the only matching chapter is the retired Polymicrogyria Overview, tagged via just tag-references and explained in notes as withdrawn content rather than a baseline.

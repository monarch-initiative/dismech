  summary: 'Fix CI: ground ATP1A2 on the node it lands on'
  details: |
    The 'Check for newly ungrounded genes' gate (just check-gene-activity-grounding) fails on this entry: the ATP1A2 gene descriptor sat on the variant node, which named no molecular function, while the pump activity sat one node downstream. Found by running the gate on the sibling entry in this batch after it turned the approved PR #18548 red, then confirming it here before CI reported it.

    Fixed by adding GO:0005391 P-type sodium:potassium-exchanging transporter activity with modifier LOSS_OF_FUNCTION to the variant node, which is the pattern CLAUDE.md describes for a lesion node bound to the wild-type molecular function of its gene. It does not duplicate the downstream node, which asserts the absence of immunodetectable protein rather than the identity of the gene product. No baseline exemption taken: the gene has one clear molecular function.

    The same mistake was present in all three entries curated in this batch and is fixed on each branch separately.

    Validation: just validate-terms, just check-logical-rules, just check-gene-activity-grounding (now OK) and just validate-disorders (0 issues).

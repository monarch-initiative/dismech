  details: |
    Backfill for issue #8085. Both entries are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, deliberately not TRIGGERS, because gluten remains the necessary trigger in this disease and these are contributory environmental factors rather than causes. Gastrointestinal infections target the gluten-triggered immune response node as a proposed route to loss of tolerance. Gut microbiome targets the entry's own microbiome dysbiosis node rather than the gluten trigger, and the description records that the direction of causation is unsettled, since dysbiosis is both a proposed contributor and a consequence of established disease.

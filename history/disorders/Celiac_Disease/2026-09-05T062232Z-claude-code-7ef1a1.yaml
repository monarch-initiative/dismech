  details: |
    Integrated the RETAINED and QUALIFIED claims of the codex assessment of kb/hypotheses/Celiac_Disease/canonical_gluten_hladq_ttg_enteropathy_model/openscientist.md (overall_verdict SUPPORTED). Added two evidence items to the canonical mechanistic_hypotheses entry: PMID:23775608 (intestinal gluten-reactive CD4 T-cell frequency correlating with Marsh grade and serum anti-TG2) for claim canonical-core, and PMID:37445994 (ZED1227-TG2 complex localized to the villous brush border) for claim zed1227-interventional-support. Rewrote that entry's ZED1227 explanation and its notes, which had promoted the report's own wording: the trial explanation no longer calls TG2 a necessary node (assessment claim zed1227-dose-dependence-and-necessity, REJECTED; the 0.44/0.49/0.48 endpoint differences are not a dose response), the notes now record each of the report's five expansions with its assessed disposition instead of as established fact, the rejected IgA-CD71 route-dominance claim is marked REJECTED rather than asserted, and the conflated 0.1-1.8 percent tetramer figure was corrected to the source's 0.5-1.8 percent by cloning and 0.1-1.2 percent by tetramer. Added pathophysiology node Mixed Th1/Th17/IL-21 Mucosal Cytokine Response (claim mixed-cytokine-response, QUALIFIED) with PMID:20061410, PMID:21206487 and PMID:22785229, bound to cached GO:0035744 and GO:0032620 and CL:0000492, wired in by bare-name causal edges from Gluten-Triggered Immune Response and to Intestinal Epithelial Damage. Added PMID:15357948 to Intestinal Epithelial Damage for the gliadin-to-IL-15-to-MICA/NKG2D step, and PMID:27352981 to Autoantibody Production bounding the humoral arm as non-required for enteropathy (claim seronegative-core-inference, QUALIFIED). Created a discussions block with five entries: a HUMAN_MODEL_MISMATCH on the three-signal villous-atrophy requirement (claim three-signal-generalization, QUALIFIED) citing PMID:32051586 and PMID:26001928 plus the previously unrecorded negative AMG 714 anti-IL-15 phase 2a trial PMID:31494096 as REFUTE, which is also why no anti-IL-15 evidence gap was recorded; a KNOWLEDGE_GAP for the tolerance-breaking trigger; a KNOWLEDGE_GAP for refractory celiac disease type II gluten-independent clonal expansion (claim rcd2-boundary, RETAINED) citing PMID:28188172 and PMID:29787419; a KNOWLEDGE_GAP for untested integration of the three amplification loops (claim feedback-loops-and-chronicity, QUALIFIED) citing PMID:22750506 and PMID:31285344; and a HUMAN_MODEL_MISMATCH for the ATI/TLR4 adjuvant claim (claim ati-celiac-amplifier, QUALIFIED) citing PMID:27993525 only. Deliberately not integrated: the four REJECTED claims (dose-dependence/necessity, Nexvax2 inference, transcellular route dominance, anti-IL-15 trial gap) and the report's unverified CL/GO candidate terms; ATIs were kept out of pathophysiology because no cited experiment reaches human celiac initiation, and PMID:29574077 was excluded because it studies allergic inflammation; the hla-dq2-dq8-necessity qualification needed no edit because the entry already says HLA-DQ2 is present in about 95 percent of patients and asserts no exceptionless rule; PMID:30978358 (potential celiac disease) was left out because the entry has no progression section to carry it and the assessment holds it consistent with but not proof of a multi-signal requirement. No new assessment sidecar was written: openscientist-assessment-by-codex.yaml already exists. Verified with linkml-validate (Disease), count-verified-snippets 85/85, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

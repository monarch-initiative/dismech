  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 tranche 1. Sources were located by PubMed search, cached with `just fetch-reference`, and every snippet was verified as an exact quote from the cached abstract. Added an EvidenceItem to the five remaining evidence-free `environmental:` exposures (Gluten Exposure, Wheat Food Products, Barley, Rye, Early Gluten Introduction). The notable outcome is Early Gluten Introduction: its note read 'Timing may affect risk', but the PreventCD randomized trial (PMID:25271603) found gluten introduction at 16-24 weeks did not reduce celiac disease risk by age 3 in 944 HLA-DQ2/DQ8-positive at-risk infants. The evidence item is therefore graded REFUTE and the note now states the trial result, replacing an observational-era hypothesis the KB was still asserting as open. Validated with `just validate`, `just count-verified-snippets` and the batched `just validate-disorders` sweep.

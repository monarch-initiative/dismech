  summary: Wire mechanism-to-phenotype edges from targeted Edison deep research
  details: |
    Two targeted Edison (falcon) deep-research runs asked for the mechanism-to-phenotype wiring layer rather than another pathophysiology survey, since a generic falcon report for this disease already existed from 2025-12. Before the runs the entry had 22 evidenced phenotypes and 0 causally connected, with three pathophysiology nodes (Autoantibody Production, Barrier Dysfunction, Microbiome Dysbiosis) carrying no downstream edges at all.

    Added three pathophysiology nodes (Generalized Nutrient Malabsorption, Secondary Hyperparathyroidism, Aberrant Clonal Intraepithelial Lymphocyte Expansion) and 16 causal edges, taking phenotype causal-inlink coverage to 13 of 22. Also wired the gluten-free diet to the mechanism it acts on. Every edge carries its own evidence with exact snippets verified against newly cached references.

    Nine phenotypes remain unconnected, and all nine are now dispositioned across three KNOWLEDGE_GAP discussions. Five (constipation, fatigue, recurrent aphthous stomatitis, peripheral neuropathy, arthritis) were graded NOT_ESTABLISHED by the reports. Three (cerebellar ataxia, abdominal pain, bloating) were graded PROPOSED and are recorded in a separate gap, because each has a coherent proposed route that stops one step short of what an edge would assert - ataxia most instructively, since its shape mirrors the TG3/dermatitis herpetiformis chain that IS wired, and the difference is that TG3 was demonstrated inside the lesion-defining deposit while TG6 remains a candidate antigen. Dental enamel defects have their own gap.

    Two reports disagreed on one chain. The deep dive graded the female infertility chain CONTESTED and the wiring sweep graded it NOT_ESTABLISHED, from the same human placental-tissue and primary-trophoblast evidence; they differ on whether tissue-level and cell-level work can place the antibody route causally with no in vivo perturbation in women. The edge was retained at INDIRECT_UNKNOWN_INTERMEDIATES on that evidence plus the treatment-stratified epidemiology. An earlier draft narrated this disagreement inside the edge description itself; review (#12866) correctly identified that as session narration in content, per the CLAUDE.md rule on notes prose and #12535, so it lives here instead and the edge states only the biology.

    Review round 1 (#12866) also corrected four things worth recording. The unconnected count was stated as six in the first PR body and history record when it is nine, and three of the nine were not addressed at all. The Secondary Hyperparathyroidism node cited a review that never mentions parathyroid hormone (PMID:24290593 contains no occurrence of "parathyroid" or "PTH"); it now rests on PMID:36904090, which states the calcium-PTH-bone-turnover step directly. The Vitamin D edge cited a methods sentence that recorded only that the analyte was measured; the reviewer proposed a result sentence from the same cache, which turned out to be a row in that review's literature-summary table attributing the figure to a different study (Lerner 2012), so it was not used - the edge now cites PMID:10071918's own celiac-cohort result instead. The lymphoma edge cited a background framing sentence; it now cites the JAK1/STAT3 gain-of-function finding, with the JAK1-inhibitor cell-line result as a separate IN_VITRO item.

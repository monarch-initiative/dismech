  summary: Wire mechanism-to-phenotype edges from targeted Edison deep research
  details: |
    Two targeted Edison (falcon) deep-research runs asked for the mechanism-to-phenotype wiring layer rather than another pathophysiology survey, since a generic falcon report for this disease already existed from 2025-12. Before the runs the entry had 22 evidenced phenotypes and 0 causally connected, with three pathophysiology nodes (Autoantibody Production, Barrier Dysfunction, Microbiome Dysbiosis) carrying no downstream edges at all. Added three pathophysiology nodes (Generalized Nutrient Malabsorption, Secondary Hyperparathyroidism, Aberrant Clonal Intraepithelial Lymphocyte Expansion) and 16 causal edges, taking phenotype causal-inlink coverage to 13 of 22. Added two KNOWLEDGE_GAP discussions for the manifestations both reports left unexplained, and wired the gluten-free diet to its mechanism target. Every edge carries its own evidence with exact snippets verified against newly cached references; six phenotypes deliberately remain unconnected because both reports graded their mechanism NOT_ESTABLISHED, and the two reports disagreement on the infertility chain is recorded in that edge rather than resolved.

  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the part of the earlier assessed-OpenScientist sweep that never merged, rebased by hand onto current main rather than merged.

    Added: one pathophysiology node (Mixed Th1/Th17/IL-21 Mucosal Cytokine Response, biological_scale TISSUE) wired in from Gluten-Triggered Immune Response and out to Intestinal Epithelial Damage, giving the entry its first two pathograph edges - main had none. Five discussions (two HUMAN_MODEL_MISMATCH, three KNOWLEDGE_GAP) covering the three-signal IL-15 co-requirement, the tolerance-breaking trigger, the RCD type II boundary, the integrated feedback loops, and the ATI/TLR4 adjuvant question. Fourteen evidence items across the hypothesis, three pathophysiology nodes, one causal edge and four discussions; every snippet re-derived from references_cache records fetched fresh into this worktree (all 15 were absent here), not copied from the old branch. 88/88 snippets verify.

    The consequential item is a refutation: the report claimed no published human anti-IL-15 trial existed. AMG 714 (PMID:31494096) is published and negative - it did not prevent mucosal injury on gluten challenge - curated as REFUTE inside the three-signal discussion, worded to constrain necessity rather than exclude an IL-15 contribution, since the trial was short and did show a smaller IEL rise at 300 mg.

    Prose corrections carried over, both still needed against main's text and both contradicting the assessment sidecar already committed under kb/hypotheses/: main asserted TG2 as a 'necessary node' on the strength of primary-endpoint differences of 0.44, 0.49 and 0.48, which is not a dose response (assessment disposition REJECTED), and it attributed a conflated 0.1-1.8% gluten-reactive T-cell range to tetramer studies when PMID:23775608 reports 0.5-1.8% by direct cloning and 0.1-1.2% by tetramer. The hypothesis notes now carry the sidecar's QUALIFIED/REJECTED dispositions for all five proposed expansions instead of listing them as required, and the description no longer states the IL-15 co-requirement as established human fact.

    Skipped: PMID:21206487 (gliadin-specific mucosal Th17 cells). Three fetch attempts returned content_type unavailable from NCBI, so no snippet could be verified in this worktree; the node's cell_types preferred_term was written as 'Mucosal CD4+ T cell' rather than the old branch's 'Gliadin-specific mucosal CD4+ T cell' so nothing asserts TCR-level gliadin specificity without support. Worth refetching later. The assessment sidecar needed no copying - it is already on main and byte-identical.

    Deliberately not added: an ATI pathophysiology node. No cited experiment reaches human celiac initiation, one citation studies allergic inflammation, and the gluten-free diet removes ATIs and gluten together, so it is recorded as a discussion instead.

  summary: Add histopathology grading, clinical forms, animal model and trials
  details: |
    A section-level coverage audit of the entry found that several structured dimensions were absent while the entry's own prose and evidence already named the facts for them: Marsh grading appeared in a mechanistic-hypothesis note and inside a quoted snippet, the IL-15/HLA-DQ8 mouse was cited only inside a discussion, and the ZED1227 and AMG 714 phase 2a trials were cited as publications with no clinical_trials records. A targeted Edison coverage-gap run (templates/disease_coverage_gap_research.md, approaches 3 and 4 of the session's targeting plan: organ-system fan-out plus absence-only reporting) independently confirmed those gaps and added three things the audit missed - the Corazza-Villanacci grading system, the latent form, and the distinction between nonresponsive and refractory disease, where most nonresponsive cases are not refractory. Adds histopathology (Marsh-Oberhuber and Corazza-Villanacci as separate records, since both are in live use and are not interconvertible at the 3a/3b/3c boundary that grade B2 collapses), has_subtypes (nine clinical forms grounded on the Oslo classification), one animal model with a modeled_mechanisms link and its translational limitation, and two clinical trials including the ZED1227 trial which is registered on EUCTR rather than ClinicalTrials.gov and so is keyed on its WHO ICTRP identifier. Phenotypes are deliberately not stratified by these subtypes: celiac's clinical forms are defined by symptom pattern, so tagging a phenotype with a form would be close to circular. Branch is stacked on the PR 12866 branch rather than main, because both touch this file and the Refractory Type II subtype refers to a pathophysiology node that PR introduces; the diff against that base is 227 insertions and zero deletions. Pass 1 of the same coverage-gap run (organ-system fan-out) surfaced two further phenotypes with verified abstract quotes, added here: hypoproteinemia (HP:0003075, 18.5% in a 108-patient adult series, the second commonest extra-digestive finding after iron deficiency anemia) wired to Generalized Nutrient Malabsorption as an indirect edge because the cited source does not separate failure-to-absorb from protein-losing enteropathy; and arthralgia (HP:0002829, 20-30% at diagnosis), kept separate from the existing Arthritis phenotype because the literature describes celiac joint complaints as arthralgia rather than objective synovitis, which is the substance of the dispute about whether a celiac inflammatory arthropathy exists. Three further candidates from that pass were deliberately not added: osteopenia, because the existing Reduced Bone Mineral Density phenotype already declares that it covers osteopenia and osteoporosis; vitamin B12/folate-deficiency anemia, because the report itself flagged that its subgroup figure appears in the study's results rather than its abstract and so cannot be exact-quote verified; and Hashimoto thyroiditis, psoriasis and asthma, which the report classified as comorbidities rather than manifestations of the disease.

  summary: Model PS212750 susceptibility loci as genetic risk-factor rows
  details: |
    OMIM phenotypic series audit follow-up (docs/reports/omim-phenotypic-series-groupings-2026-08-01.md).

    PS212750 'Celiac disease' is a series of 15 brace-annotated susceptibility entries, not a series of diseases: MONDO holds all 13 as 'celiac disease, susceptibility to, N' classes that carry excluded_subClassOf MONDO:0005130 and predisposes_towards MONDO:0005130, so they are deliberately NOT subclasses of celiac disease. The correct dismech shape is therefore one Disease entry with risk-locus rows in genetic:, not a kb/groupings/ union (which would have no members).

    Changes, all in the genetic: block:
    - HLA-DQ2 and HLA-DQ8: added relationship_type: RISK_FACTOR (the enum's stated use for HLA risk alleles). No gene_term is bound because these are serotypes encoded by an HLA-DQA1/HLA-DQB1 haplotype rather than a single gene; the notes record that this is the CELIAC1 locus (OMIM:212750, 6p21.32) and that MONDO models it as MONDO:0008930.
    - IL2, IL21, BACH2, TNFAIP3, CD28, EGR2, ETS1, IRF4, SMAD3, PTPN22: added relationship_type: SUSCEPTIBILITY and gene_term HGNC bindings (hgnc:6001, 6005, 14078, 11896, 1653, 3239, 3488, 6119, 6769, 9652). IL2/IL21 notes record the 4q27 CELIAC6 (OMIM:611598) region.

    No new claims are asserted: relationship_type is a controlled restatement of the pre-existing free-text association values (Risk Factor / GWAS), and the gene bindings are identifier lookups for gene symbols already present. No evidence items were added or altered.

    Validation: linkml-validate (Disease) clean; linkml-term-validator passed with the 10 new HGNC bindings; reference snippet audit 60/60 verified.

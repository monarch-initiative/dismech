  summary: 'Create: Stickler_Syndrome_Type_6'
  details: |
    Created kb/disorders/Stickler_Syndrome_Type_6.yaml for the COL9A3-related autosomal recessive form of Stickler syndrome (MONDO:0031047), claimed via issue #11396.

    Deep research: requested falcon, which is not configured in this environment (no EDISON_API_KEY). Rather than substituting a provider by hand, the run used the recipe's own fallback mechanism (dr_fallback='--fallback'), which fell back to claude_code and recorded fell_back/requested_provider/provider_attempts in the report frontmatter. Report used: research/Stickler_Syndrome_Type_6-deep-research-claude_code.md. Its reference validation was clean (15/15 verified, confabulation_rate 0.0), but its term validation was not: 11 of 28 CURIE labels mismatched, including UBERON:0003889 offered as 'vitreous body' (actually fallopian tube) and UBERON:0000362 as 'cochlea' (actually renal medulla). No CURIE from the report was bound. Every ontology term in this entry was independently looked up via the EBI OLS API or taken from the committed term caches, and all pass just validate-terms.

    The report did contribute four mechanistic references that the PubMed sweep had not surfaced and that carry the core of the mechanism: PMID:9252382 (obligate heterotrimer assembly), PMID:8197187 (Col9a1-null mouse), PMID:10090888 (COL9A3 as third MED locus), PMID:11308397 (lumbar disc disease risk allele).

    GeneReviews baseline: PMID:20301479 (Stickler Syndrome) fetched, cached and tagged GeneReviews in the top-level references block. Its Clinical Characteristics were cross-referenced against the phenotypes section; the Agents/circumstances to avoid warning (contact sports, traumatic retinal detachment) is captured as a treatment entry with the GeneReviews quote.

    Curation decisions worth flagging for review:
    - entry_type DISEASE rather than SUBTYPE. Stickler_Syndrome_Type_1 and Stickler_Syndrome_Type_2 are already standalone entries, so one entry per numbered Stickler type is the existing KB convention, and the stub records a single MONDO parent with no descendants.
    - Cleft palate is recorded as absent in the description, notes and the Midface Hypoplasia evidence rather than as a zero-frequency phenotype row, since the schema cannot assert a phenotype's absence.
    - The sibling recessive type IX forms (COL9A1 type 4, COL9A2 type 5) are not curated, and the literature analyses the three together. Several evidence items therefore come from pooled type IX cohorts and say so in their explanations; this limitation is stated explicitly in notes.
    - Two animal models: the naturally occurring Labrador retriever drd1 COL9A3 frameshift (same gene, recessive, ocular + skeletal) and the Col9a1-null mouse, which is a paralog knockout justified by PMID:9252382 showing that losing any one chain functionally removes the whole protein. The mouse link carries typed divergences (SPECIES_MISMATCH, PROXY_QUANTITY) recording that the perturbed chain is not the disease's chain.
    - 2 of 11 causal edges are left without their own evidence rather than reusing node citations for edges no source states.

    Validation run on this tree: just validate (pass), just validate-terms (pass), just check-entity-refs (pass), just check-causal-targets (pass, no new dangling), just check-duplicate-keys (pass), just check-qualifier-terms (pass), just check-enum-values (pass), just count-verified-snippets (47/47), just validate-disorders (pass, the batched gate CI runs), and check-folded-hyphens / check-snippet-length / check-title-snippets / check-snippet-grading (all clean, no new baseline entries). just compliance reports 93.3% weighted. just discover-datasets found no GEO candidates, which is expected for an ultra-rare disorder, so no datasets block was added.

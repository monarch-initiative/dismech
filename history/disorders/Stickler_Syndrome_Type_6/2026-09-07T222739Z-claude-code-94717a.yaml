  summary: 'Address pre-PR self-review findings: Stickler_Syndrome_Type_6'
  details: |
    Second session on the same entry, addressing an adversarial pre-PR review run before any PR was opened. All 14 findings were acted on.

    The substantive one: the entry's upstream mechanism asserted that losing the alpha3 chain abolishes the collagen IX heterotrimer outright, resting on mouse Col9a1 data (PMID:9252382). PMID:35885918 -- a paper this entry already cited -- argues the opposite in its full text, reasoning from the milder-than-expected skeletal phenotype that the remaining two alpha chains may form a partly functional alternative heterotrimer. The entry now records that as a REFUTE evidence item on the assembly node, softens the node description and the top-level description to present both readings, and carries the unresolved question as a discussions entry with kind HUMAN_MODEL_MISMATCH (evidence exists in a model; translational validity is the open question). This matters beyond the one node: a true null predicts the three type IX genes give equivalent disease, which is the assumption licensing this entry's use of pooled type IX cohort statistics.

    Also corrected a claim in notes that the allele-class reading (in-frame incorporated chain acts dominant-negatively; null allele is recessive) was the curator's inference alone. PMID:35885918 states it, and PMID:33633367's cDNA work shows the dominant families carry exactly that allele class. The note now cites both instead of disclaiming support it has.

    Other changes: added the missing Cataract phenotype (HP:0000518, no frequency band since no COL9A3 number exists); mined GeneReviews Clinical Characteristics, which had been used only for management and diagnosis; downgraded High Myopia from VERY_FREQUENT to FREQUENT and recorded the counter-figure, because the VERY_FREQUENT band rested on a pooled type IX + type XI review calling it near-universal while the type IX-only series scored 77% against a defined -6D threshold; added the pooled-cohort caveat to the three explanations carrying 91.7%, 15.4% and 30.8%, all from a 13-patient COL9A1/COL9A2/COL9A3 series rather than a COL9A3-only cohort, noting that the single COL9A3 patient with audiometry had normal hearing while both detachments in that cohort were COL9A3; connected four orphan phenotypes to the causal chain; renamed the pathophysiology node 'Peripheral Vitreoretinal Degeneration' to 'Vitreoretinal Interface Degeneration' so it no longer collides with the phenotype of that name and collapses into one pathograph node; added directness INDIRECT to the two PMID:33633367 items, which evidence a biallelic entry from heterozygous families; rebound the retinopexy treatment from the generic NCIT:C15329 to NCIT:C217424 Laser Photocoagulation; applied the CLAUDE.md device carve-out, attaching NCIT:C87148 Glasses and NCIT:C183182 Hearing Aid as NCIT:C16830 qualifier values rather than losing the device concept, and changed Audiologic Management from therapeutic_modality DEVICE to OTHER since it bundles amplification, otitis media treatment and myringotomy; added mappings, differential_diagnoses (including the honest entry that COL9A1/COL9A2 recessive Stickler is not phenotypically separable from this one) and three curated Genetic.variants; cited PMID:42518710 for the visual-field cost of encircling prophylaxis, which is the other half of the case-by-case judgement.

    Two review suggestions were quoted slightly inexactly and were corrected against the cache rather than copied: the PMID:35885918 dominant-negative sentence needed its trailing citation marker excluded, and the cataract and joint-disease snippets were sub-propositional fragments that failed check-snippet-length, so both were extended to the full sentences.

    Prose overreach flagged in the review ('presents at least as often through the ear as through the eye') had already been removed before the first commit.

    Not done: no OMIM or Orphanet identifier was bound in mappings. The deep-research report offered both, but flagged the Orphanet one unverified and neither has a cached record, so binding them would be unverifiable; the mappings block says so.

    Validation after the changes: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-qualifier-terms-online (resolving the one uncached NCIT device CURIE), check-enum-values all pass; 61/61 snippets verified exact; the batched just validate-disorders gate passes; check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean with no new baseline rows. Compliance 92.0% weighted. The pathograph is now 7 nodes and 15 edges with no orphan nodes, no unresolved targets and no name collisions; Cataract and Midface Hypoplasia remain deliberately unconnected because no cited source gives a mechanism, and notes records that.

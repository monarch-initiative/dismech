  summary: 'Create: Hereditary Hemorrhagic Telangiectasia Type 2 (ACVRL1/ALK1, MONDO:0010880)'
  details: |
    New entry for the ACVRL1 (ALK1) form of hereditary hemorrhagic
    telangiectasia, MONDO:0010880, OMIM 600376. Curated as a separate entry
    alongside the existing parent entry (Hereditary_Hemorrhagic_Telangiectasia,
    MONDO:0019180) and the locus-defined HHT4 entry, because the ACVRL1
    genotype-phenotype correlation is reproducible across cohorts and
    clinically consequential.

    Duplicate preflight. Searched origin/main kb/disorders for MONDO:0010880,
    ACVRL1 and HHT2 (three existing HHT-family entries found, none for type 2),
    and searched GitHub PRs and issues for "hemorrhagic telangiectasia" and for
    MONDO:0010880/ACVRL1: the only hit was the merged HHT4 PR
    (monarch-initiative/dismech#8876). No stub existed for this disease.

    Deep research. `just research-disorder falcon` was requested per the
    curation default. Edison/falcon authentication failed in this environment
    (403 ProviderAuthError, reproduced with `deep-research-client providers
    --check`, which reported falcon UNREACHABLE and claude_code OK). Rather
    than substituting a provider by hand, the run was reissued as
    `just dr_fallback='--fallback' research-disorder falcon ...`; it fell
    through to OpenScientist, which completed in 2445 s. The report is
    research/Hereditary_Hemorrhagic_Telangiectasia_Type_2-deep-research-openscientist.md
    (plus its .citations.md sidecar and an _artifacts/ directory holding the
    provider's own HTML and PDF renderings). Its frontmatter records
    fell_back: true, requested_provider: falcon, and both provider attempts.
    The report file was written as -falcon.md and renamed to -openscientist.md
    when the validation retro-fit ran.

    Report validation. The run emitted no ## Reference Validation or ## Term
    Validation section, so both were retro-fitted with
    `just validate-research-reference` and `just validate-research-terms`.
    References: 35 of 35 resolved, 0 unresolved, 0 off topic; 4 of 13 quoted
    claims were reported as not found, but in each case the tool's own "closest
    text in source" was the same sentence differing only in trailing
    punctuation or an elision, so none is a confabulation. Every quote reused
    in this entry was re-verified independently against references_cache by
    `just count-verified-snippets`.

    Terms: the report offered six wrong or nonexistent ontology bindings -
    HP:0000562 (does not exist in HPO) for "telangiectasia of the skin";
    HP:0002110 for "pulmonary AVM" when it is Bronchiectasis; HP:0002435 for
    spinal AVM when it is Meningocele; NCIT:C45386 for pazopanib when it is
    Carcinogenic Chlorinated Hydrocarbon; NCIT:C716 for thalidomide when it is
    Omeprazole; NCIT:C79809 for pomalidomide when it is Defactinib. None of
    those CURIEs is used here. Every term in this entry was bound independently
    from cache/{hp,go,cl,uberon,ncit,chebi,hgnc,mondo}/terms.csv, the
    cache/enums/ membership caches, and EBI OLS4, then checked by
    `just validate-terms`.

    GeneReviews baseline. PubMed returned PMID:20301525 (Hereditary Hemorrhagic
    Telangiectasia, GeneReviews, updated 2026-02-19). Fetched, cached, and
    tagged GeneReviews in the top-level references: block. Its Clinical
    Characteristics, Management, Surveillance and Agents/Circumstances-to-Avoid
    content is carried into the phenotypes, diagnosis and treatments sections;
    the Agents-to-Avoid list (anticoagulants/NSAIDs in significant bleeding,
    scuba diving without a recent negative contrast echocardiogram, liver
    biopsy) is quoted verbatim on the prophylaxis treatment entry.

    What was curated. A connected 14-node pathophysiology chain running germline
    ACVRL1 loss of function and somatic second hit -> reduced endothelial ALK1
    signalling -> deficient SMAD1/5-SMAD4 output -> loss of endothelial
    quiescence -> failure of arteriovenous patterning -> four organ branches
    (mucocutaneous, hepatic, pulmonary, neuraxial) terminating in 14
    HPO-bound phenotypes, plus a divergent branch to occlusive pulmonary
    arteriopathy. Also: ACVRL1 genetic block with two case_fraction records
    (46% US kindreds, 68.1% Spanish RiHHTa) and two variant classes; two
    prevalence records (clinical 1 in 5,000 and genetic 1.753-2.555 per 5,000),
    both explicitly annotated as all-genotype rather than HHT2-specific;
    inheritance; a two-phase progression; pregnancy as a pathograph-linked
    environmental exacerbator; four diagnosis records; nine treatments; two
    clinical trials (NCT00843440, NCT03910244); one animal model (endothelial
    Alk1 conditional knockout, with two readouts); one experimental model (the
    LUMCi029-A-3 hiPSC line, deliberately without a modeled_mechanisms link
    because no vascular phenotype has been reported for it); three GEO datasets;
    one mechanistic hypothesis; and three discussions.

    Judgment calls worth recording. (1) Frequency bands were set only where an
    HHT2-specific percentage exists in a cited cohort, so epistaxis and hepatic
    involvement - the entry's most characteristic features - carry no frequency,
    because the sources report onset, penetrance or a genotype contrast rather
    than a percentage of ACVRL1 carriers. (2) The "~20% of ACVRL1 carriers
    develop PAH" figure is quotable only from the introduction of a case report
    citing a further source, so it is recorded in prose with that provenance,
    graded OTHER/INDIRECT, and is not used to set a frequency band. (3) The
    report's claim that pomalidomide response is worse in ACVRL1 carriers is a
    post-hoc trend at P=0.06 in a trial that did not randomise on genotype; it
    is recorded on the treatment and in a discussion as the only genotype signal
    in HHT therapeutics, explicitly not as grounds for withholding the drug.
    (4) The shear-stress-set-point mechanism was shown by deleting SMAD4, not
    ALK1, so its evidence item is graded directness: INDIRECT. (5) Cerebral and
    spinal AVMs share one pathophysiology node because the single cohort that
    separates them reports them together and the genotype effects run in
    opposite directions. (6) Dataset relevance was triaged by hand: of 12 GEO
    candidates only the three with an explicit HHT2/Alk1 arm were taken, and the
    ENG and SMAD4 arms of GSE197105 are flagged in its notes as belonging to
    other entities.

    Validation run. `just validate` passed (schema, terms, references).
    `just validate-disorders` (the batched pre-PR gate CI runs) passed with
    131/131 snippets verified. `just count-verified-snippets` 131/131.
    `just verify-datasets` 3/3 OK. Offline gates all clean:
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-environmental-evidence,
    check-snippet-length, check-title-snippets, check-folded-hyphens,
    check-snippet-grading. `just compliance` reports 92.6% global / 92.5%
    weighted, with 100% reference_title and 100% term coverage; the residual
    gap is uncited causal edges and dataset-level evidence blocks.

  summary: 'Create: Schwartz-Jampel Syndrome (HSPG2/perlecan)'
  details: |
    First dismech entry for Schwartz-Jampel syndrome, created to close the zero-coverage ISDS proteoglycan group flagged in issue 7867 (2019 group 5 "Perlecan group" to 2023 group 7 "Proteoglycan core protein disorders"). Seven-node pathograph spanning MOLECULAR to ORGANISM: HSPG2 hypomorphic variation to reduced perlecan secretion into basement membranes, branching into an endplate acetylcholinesterase deficiency arm (distal peripheral nerve hyperexcitability and junctional remodeling, then continuous muscle fiber hyperactivity) and a cartilage arm (pericellular matrix failure and impaired chondrocyte condensation, then chondrodysplasia and skeletal deformity). 17 phenotypes, HSPG2 genetics, 4 treatments with target_mechanisms, 3 mouse models including a FAILS_TO_RECAPITULATE negative result for the C1532Y point-mutation-only line, 2 non-animal experimental models, 2 differential diagnoses, and 2 discussions (a KNOWLEDGE_GAP on whether endplate AChE deficiency is sufficient for the spontaneous activity, and a HUMAN_MODEL_MISMATCH on the C1532Y mouse). A Named Entity Confusion guard is written into the entry notes: the historical "SJS type 2" is LIFR-related Stuve-Wiedemann syndrome, a distinct entity, and the allelic HSPG2 null disorder DDSH is deliberately modeled as a differential diagnosis rather than as a subtype. Validation run: just validate PASS; just validate-terms PASS; just validate-disorders batched with --no-full-text PASS with 78/78 snippets verified against cached references; check-duplicate-keys, check-term-cache-integrity, check-reference-cache-frontmatter and check-title-snippets all OK. Weighted compliance 94.6 percent. All 15 PMIDs were fetched with just fetch-reference; an initial set of recalled PMIDs turned out to be misattributions and was discarded in favour of PubMed-verified identifiers before any curation.

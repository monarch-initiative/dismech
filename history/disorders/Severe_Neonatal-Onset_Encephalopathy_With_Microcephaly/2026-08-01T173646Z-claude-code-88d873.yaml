  summary: 'Create: Severe Neonatal-Onset Encephalopathy With Microcephaly (MECP2,
    MONDO:0010397)'
  details: |
    De novo curation of the X-linked MECP2 phenotype seen in hemizygous 46,XY males, curated as an entity distinct from Rett_Syndrome (heterozygous female, mosaic loss) and MECP2_Duplication_Syndrome (Xq28 copy-number gain).

    Deep research: falcon and openscientist providers both run; reports committed under research/. NEC preflight against MONDO:0010397 passed on all three anchors - MECP2 dominates gene mentions in both reports (falcon 87 vs CDKL5 1 / FOXG1 1; openscientist 48 vs CDKL5 3 / FOXG1 3), MONDO:0010397 used consistently (18 mentions in falcon), and no competing OMIM identity asserted. GeneReviews PMID:20301670 (MECP2 Disorders) used as the clinical baseline.

    Central mechanistic claim: the severity difference from Rett syndrome is not a difference in the MECP2 lesion but the absence of mosaic rescue by X-chromosome inactivation. 16-node single-root pathophysiology DAG runs from the hemizygous loss-of-function variant through absence of mosaic rescue and impaired MBD DNA binding / chromocenter clustering, to uniform neuronal AND glial MeCP2 deficiency, then to failed dendritic arborization and synaptogenesis (documented directly in human autopsy material, not inferred), branching to reduced brain growth, perisylvian polymicrogyria, brainstem respiratory network failure with chronic central hypoxia, cortical network hyperexcitability, impaired motor control, and cardiac autonomic conduction instability.

    29 HPO-bound phenotypes. Death in infancy modeled as a terminal pathophysiology node rather than a phenotypes entry because HP:0001522 sits in the HPO mortality branch outside HP:0000118 (convention already used by Isolated_Sulfite_Oxidase_Deficiency and Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I).

    Four discussions: a KNOWLEDGE_GAP on whether the microcephaly has a prenatal component in addition to the documented postnatal deceleration; a HUMAN_MODEL_MISMATCH on the Mecp2-null male mouse being the genotypically correct but temporally wrong model (asymptomatic to 5-6 weeks vs human encephalopathy from birth); a KNOWLEDGE_GAP on the structural exclusion of males from trofinetide and AAV-MECP2 development; and a KNOWLEDGE_GAP on cardiac vs respiratory mode of death.

    Six differential diagnoses, all MONDO-bound, including neonatal hypoxic-ischemic encephalopathy as the documented real-world misdiagnosis.

    Validation: schema clean, term validation clean, 194/194 evidence snippets verified verbatim against cached references. Two DR-suggested HPO bindings were rejected during term verification as hallucinated labels (HP:0001298 proposed as "Neonatal encephalopathy" but is actually "Encephalopathy"; HP:0000251 proposed as "Deceleration of head growth" does not exist).

    ORPHA:209370 recorded in external_assertions but NOT cited as evidence: the pinned Orphadata snapshot in data/orphadata/MANIFEST.yaml no longer matches upstream (sha256 mismatch on en_product1.xml), so no ORPHA cache record could be built by the sanctioned tooling. Should be added when the Orphadata pin is refreshed.

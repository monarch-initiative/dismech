  details: |
    Review response to ai4c-reviewer CHANGES_REQUESTED on PR #7735. All three IMPORTANT items fixed; five of six optional items taken up, one declined with reasoning.

    IMPORTANT 1 - added the missing top-level references: block. PMID:20301670 tagged GeneReviews per the Bachmann-Bupp #7665 convention, plus all 23 other cited references with titles copied verbatim from references_cache. Purely metadata; the GR mining was already complete across all five sections.

    IMPORTANT 2 - PMID:19234456 (Ballas 2009) retagged HUMAN_CLINICAL to MODEL_ORGANISM on the Uniform Neuronal and Glial MeCP2 Deficiency node. Reviewer is correct: no Humans MeSH term, and the "RTT brains" of the abstract are mouse brains. Rather than simply retag and leave the node resting entirely on mouse evidence, the node description now separates the two kinds of warrant explicitly - the HUMAN claim is genetic (X-linkage plus non-mosaic 46,XY hemizygosity entails uniform deficiency by deduction, anchored on PMID:34502518 and PMID:18477000), while the glial protein-loss demonstration is model-organism and flagged as extrapolated. This mirrors the treatment already used in mechanistic_hypotheses.notes.

    IMPORTANT 3 - added MOLECULAR node "Preferential De-Repression of Long Neuronal Genes" between the MBD-binding node and Dysregulated Activity-Dependent Neuronal Gene Expression, also feeding Failure of Dendritic Arborization and Synaptogenesis. Verified PMID:25232122 with a fresh fetch-reference before citing (Sugino 2014 J Neurosci, real, on topic). NOTE: the reviewer-supplied snippet contained an ellipsis and would have failed substring validation; the actual sentence continues "but this is not true for downregulated genes". Used the complete sentence plus two further verified sentences covering the connectivity-gene class and the causal bridge to altered circuit function.

    Optional items taken up:
    - Dropped both remaining HUMAN_CLINICAL-tagged Ballas literature-summary items (progression Death phase, death node) and replaced each with primary human case evidence from PMID:11930274 rather than leaving the slots thinner.
    - Re-checked PMID:20298210 (reversibility), which I had discarded last round without verifying. The reviewer-supplied line DOES verify as an exact substring. My earlier exclusion was wrong. Added to the male-exclusion discussion as its mechanistic premise and to the animal model, both MODEL_ORGANISM.
    - Added paternal-origin bias (PMID:22182064, paternal in 84/88) and paternal germline mosaicism (PMID:30405208, 5/21 fathers) to the genetic section with counselling framing. Also added the male-vs-female somatic mosaicism split (3/18 males vs 2/453 females) to the mosaic-rescue node, where it is the human-genetic counterpart of the modelled mechanism. Reviewer was right that these bear on recurrence-risk counselling the entry already covers.
    - Replaced two generic NCIT treatment terms: cardiac surveillance now NCIT:C38053 Electrocardiography (was C15747 Supportive Care); Seizure Management now NCIT:C64172 Anticonvulsant Therapy with therapeutic_agent NCIT:C264 Anticonvulsant Agent (was bare C15986 Pharmacotherapy).
    - Named NGN-401 (NCT05898620) and TSHA-102/REVEAL (NCT06152237) in the male-exclusion discussion. Both trial records state enrolment is restricted to females, so this became verified evidence rather than the prose mention the reviewer suggested - it converts the male-exclusion argument from inference to documented eligibility criteria.

    Optional item declined:
    - Abnormal Eye Movements stays on HP:0000496. Searched HPO: there is no ocular-dyskinesia term, and the three specific candidates (HP:0010553 oculogyric crisis, HP:0031931 ocular flutter, HP:0010543 opsoclonus) each name a distinct pattern the source does not specify. Sharpened preferred_term to "Ocular dyskinesia" and recorded the reasoning in the phenotype description. The reviewer had already conceded this as the likely right call.

    Validation: schema clean, term validation clean, 211/211 snippets verified verbatim (up from 194/194). No new cache/**/*.csv rows were required - all terms used were already in the committed caches.

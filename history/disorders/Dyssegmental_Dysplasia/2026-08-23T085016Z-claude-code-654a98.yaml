  summary: 'Create: Dyssegmental Dysplasia (HSPG2/perlecan, DDSH + DDRD)'
  details: |
    New entry for the ISDS Nosology 2023 group 7 (proteoglycan core protein
    disorders) row "Dyssegmental dysplasia, Silverman-Handmaker and
    Rolland-Desbuquois types" — the second dismech member of that group after
    Schwartz-Jampel syndrome, and the completion of its HSPG2/perlecan arm.

    Lump/split decision. Curated as ONE spectrum entry with DDSH and DDRD as
    has_subtypes rather than as two entries. Until 2024 only DDSH was
    attributed to HSPG2; Yamaguchi et al. (PMID:38424183) found biallelic
    HSPG2 variants in five DDRD patients sharing a founder p.G3324R haplotype
    and concluded that SJS, DDRD and DDSH are allelic disorders. The two
    grades therefore share one pathomechanism and differ in the amount of
    residual functional perlecan, which is the case a single mechanism entry
    models. The ISDS Table 1 makes the same lumping call.

    Ontology anchor. No top-level disease_term is asserted. MONDO carries the
    two grades as separate leaves (MONDO:0009140 DDSH, MONDO:0009139 DDRD)
    plus the unrelated MONDO:0011110, and has no umbrella class for the
    spectrum concept. Both leaves are recorded as skos:narrowMatch mappings
    and as subtype_term bindings on the has_subtypes entries, rather than
    grounding a spectrum entry on one of its own subtypes — the defect tracked
    in monarch-initiative/dismech#8997. A MONDO new-term request for the
    umbrella concept is the correct upstream fix and was NOT filed in this
    session. Flagged in the entry notes and review_notes for a maintainer.

    Content. Seven-node pathograph: biallelic HSPG2 loss of function ->
    failure of perlecan secretion into the extracellular matrix -> cartilage
    ECM disorganization -> growth-plate disorganization and defective
    endochondral ossification, branching to anisospondyly and to micromelia
    with bowed dumbbell-shaped tubular bones, both converging on narrow thorax
    with neonatal respiratory failure. Plus 11 phenotypes, 2 prevalence
    records, 2 subtype-scoped progression records, HSPG2 genetics, 2 diagnosis
    blocks, the Hspg2-/- mouse with four modeled_mechanisms links (two HIGH,
    two MODERATE fidelity) and two readouts, 2 differential diagnoses
    (Schwartz-Jampel syndrome, Kniest dysplasia), and a KNOWLEDGE_GAP
    discussion on what determines whether a genotype yields SJS, DDRD or DDSH.

    Perinatal lethality is curated as a progression record, not a phenotype:
    HPO's mortality terms (HP:0003826 Stillbirth, HP:0003811 Neonatal death)
    sit outside the Phenotypic abnormality branch the PhenotypeTerm dynamic
    enum is expanded from, and HP:0003826 was rejected by term validation.

    Reference-verification note. Two PMIDs recalled from background knowledge
    during planning (10471508, 10225951) resolved to entirely unrelated papers
    — a glucocorticoid-receptor study and a C. elegans cofilin study. Both
    were discarded and their cache files deleted; the correct perlecan-null
    mouse paper (PMID:10545953, Arikawa-Hirasawa 1999) was located by PubMed
    esearch instead. Nine references in total, every one fetched with
    `just fetch-reference`; no cache file was hand-written.

    Two snippets are quoted verbatim although the source text is imperfect:
    PMID:3605216 misspells the eponym as "Silverman-Handmarker", and the
    PMID:38424183 founder-haplotype quote is truncated before the "bp" unit
    because the cached text uses a thin space there. Both are noted in the
    surrounding explanation fields.


  details: |
    PR shepherd pass over review round 1 on PR 9294. Merged origin/main first,
    which was necessary rather than cosmetic: the branch predated the retirement
    of the supports: PARTIAL enum value (#10003) and carried five occurrences.
    The branch's own copy of the schema still defined PARTIAL, so branch CI was
    green while the merge result would have been invalid on main. The merge also
    brought in the directness slot that replaces it. All five were migrated per
    the CLAUDE.md mapping table, and the explanations that narrated "Marked
    PARTIAL because ..." were rewritten, since prose naming a retired value is
    not caught by any gate.

    Review finding 2, phenotype coverage: added Coronal Cleft Vertebrae
    (HP:0003417), Deficient Vertebral Ossification (HP:0004599 Absent or
    minimally ossified vertebral bodies), and two DDSH-scoped CNS phenotypes,
    Hydrocephalus (HP:0000238) and Occipital Encephalocele (HP:0002085). The
    reviewer proposed the CNS pair as one item; they are curated as two
    phenotypes because they are two findings. No frequency band is asserted on
    any of them: the DDSH source says "sometimes" without quantifying it.

    Review finding 3: the growth-plate node's cell type moved from the generic
    CL:0000138 chondrocyte to CL:1000217 growth plate cartilage chondrocyte,
    which the preferred_term already named. The upstream Cartilage Extracellular
    Matrix Disorganization node keeps CL:0000138, which is correct there.

    Review finding 4: GeneReviews searched and confirmed absent. See
    review_notes item 9 for the four queries and their results. Recorded so the
    check is closed rather than deferred.

    Review finding 5: the anisospondyly HP binding is left on HP:0003422 and the
    reasoning recorded in review_notes item 10, which the reviewer asked for
    either way. Two of the three cited sources define anisospondyly in explicit
    segmentation language, so the current binding is the one the quoted evidence
    supports; the ossification side of the concept is now carried by the
    separate Deficient Vertebral Ossification phenotype.

    Review finding 1, the missing deep-research artifact, is NOT addressed and
    remains blocking. Generating a deep-research report is substantive
    scientific content generation that this automated shepherd pass should not
    fabricate, and the entry then needs reconciling against it. Left for a
    curator with the deep-research skill.

    Validation: just validate (68/68 snippets verified, up from 62),
    just validate-terms, check-enum-values, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms and
    check-term-cache-integrity all pass. No cache rows changed: every term used
    was already cached.

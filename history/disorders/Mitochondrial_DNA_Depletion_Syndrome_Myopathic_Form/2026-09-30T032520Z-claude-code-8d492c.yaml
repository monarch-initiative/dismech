  summary: 'Address review on #13196: dysarthria figure, facial diplegia term, KYGEVVI
    approval, DR artifact'
  details: |
    Second round on PR #13196, addressing a CHANGES_REQUESTED review. Three blocking
    findings and five suggestions were worked; all were actioned.

    BLOCKING 1 -- unsupported figure in the Dysarthria description. The description
    claimed "six of eighteen late-onset patients". Both cache bodies were grepped
    directly. PMID:31060578 (the eighteen-case late-onset series) never mentions
    dysarthria: its only speech finding is "dysphonia due to vocal cord palsy
    (2/18;11.1%)", and its "6" refers to swallowing difficulty ("difficulty in
    swallowing, which resulted in severe weight loss and/or detriment to the safety of
    oral feeding in 6 cases"). The reviewer's diagnosis was correct: a dysphagia count
    had been read as a dysarthria count. The supported figures are both in
    PMID:29602790 -- "dysarthria/dysphonia (3)" of the 85 patients assessed for other
    muscular functions, and "dysarthria/dysphonia (three)" of its sixteen late-onset
    patients. The description now gives those, and additionally records the
    laryngeal-versus-articulatory distinction, with the eighteen-case series' vocal
    cord palsy sentence cited for that point rather than for a dysarthria count.

    BLOCKING 2 -- Facial diplegia rebound to the exact term. Was HP:0010628 "Facial
    palsy". HP:0001349 was verified by OAK (`runoak -i sqlite:obo:hp info HP:0001349
    -O obo`): canonical label "Facial diplegia", def "bilateral facial palsy", is_a
    HP:0010628. Present in cache/hp/terms.csv and in the phenotypeterm enum membership
    cache, so it validates offline. Rebound; `just validate-terms` passes. While in
    that block, the description's "19 of 85" figure had no cited quote containing it,
    so the whole-cohort sentence carrying "facial diplegia (19)" was added as evidence.

    BLOCKING 3 -- treatment status brought up to date. PMID:41604077 (Blair HA,
    "Doxecitine and Doxribtimine: First Approval", Paediatr Drugs 2026) was already
    fetched into the worktree and was read in full. KYGEVVI was approved in the USA on
    3 November 2025 for TK2 deficiency with symptom onset on or before 12 years. The
    treatment description now states the approval as fact and attributes the 2022
    "trials ongoing" sentence to that older review as historical context, with its
    explanation rewritten to say it is superseded and must not be read as current
    status. Six new evidence items were added from PMID:41604077, all with
    quote_role: REVIEW_SYNTHESIS. Their evidence_source is split deliberately:
    regulatory statements (approval date and indication, first-approved status,
    labelled pharmacodynamics) are OTHER, because a regulatory action is not a study;
    the pooled human mortality outcomes are HUMAN_CLINICAL, because evidence_source
    grades the study the quoted text describes. That reasoning is recorded in the
    entry's notes so a later reader does not have to reconstruct it.

    The approval record also supplied genuinely new clinical content: the pooled
    analyses show a mortality benefit only in onset at or before 12 years (4% treated
    against 57% untreated) and no significant difference in later onset (18% against
    24%), which is where the licensed age limit comes from. That was added to the
    description and cited, and the tk2_no_controlled_trial knowledge gap was rewritten:
    the approval does not close it, because the age limit is itself drawn from a
    subgroup contrast inside the same uncontrolled data, and it is unresolved whether
    later-onset disease is unresponsive or merely slower than the available follow-up
    can resolve.

    Identifier decisions on the approved product, all recorded in notes. No
    regimen_term was added: NCIT has no term for KYGEVVI, MT-1621, or any
    deoxynucleoside combination regimen (searched `KYGEVVI`, `MT-1621`, `MT 1621`,
    `l~Nucleoside Regimen`, `l~Deoxynucleoside`, `l~Nucleoside Therapy`), and
    RegimenTerm is reachable only from NCIT:C15697. NCIT:C1330 "Deoxythymidine" exists
    but is_a NCIT:C85834 "Retired Concept 2009" and was not used. NCIT:C420
    "Doxecitine" does exist, but adding it beside CHEBI:15698 would list the same
    molecule twice and its NCIT parents (Pyrimidine Antagonist, Chemoprotective Agent)
    describe an antineoplastic role. The existing CHEBI bindings were kept and the
    pharmaceutical names carried in preferred_term instead. The treatment name was left
    as the mechanistic "Deoxycytidine and Deoxythymidine Substitution": it is the
    target of an attaches_to foreign key and a mechanism name outlives a trade name.

    BLOCKING 4 -- deep-research artifact committed, and what it actually is. The report
    at research/Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form-deep-research-claude_code.md
    is committed with this round, together with the six DOI reference-cache files its
    own reference validation rests on. It carries genuine provider frontmatter
    (template_sha 1e7ea4ee81, 24/24 references verified, 0 confabulation, 72/72 terms
    verified) and `just preflight-dr ... MONDO:0012301` returns PASS with TK2 mentioned
    51 times and matching OMIM 609560.

    It is NOT independent corroboration of this entry and must not be described as
    such. It was generated after the entry was curated, on 2026-09-29, and the provider
    read the entry and its reference cache while writing. The report says so itself:
    it describes being "assembled from 18 references held in the dismech verified
    reference cache", states that its ontology identifiers were "read from the
    repository's authority-backed term caches ... and from the validated bindings of
    the curated kb/disorders/ entry", and at one point enumerates what "the curated
    dismech entry binds". Agreement between the report and the entry is therefore
    circular. Its actual contribution was narrower than "found a new reference": it
    flagged PMID:41604077 as present in the cache but unused, explicitly declining to
    quote it ("present in the cache but not reproduced here, as I do not hold them
    verbatim -- read them from the source"). All approval content curated here was read
    from the reference, not from the report.

    SUGGESTIONS, all taken.

    Seizures -- the two source counts do not reconcile and are no longer presented as
    if they did. The whole-cohort paragraph gives "recurrent seizures (six)" of 92; the
    infantile paragraph gives "seizures (seven)" of 39, a subgroup count exceeding the
    cohort count. The wording differs between them, so the description offers the most
    economical reading (the cohort figure counts only recurrent seizures) while stating
    that six to seven is the defensible range rather than adopting either number. Both
    sentences are now cited.

    Encephalopathy -- the aggregate "10/39 ... CNS abnormalities" snippet was the only
    evidence. The specific counts were verified and added: "encephalopathy (seven)" of
    92 and "encephalopathy (five)" of 39. Unlike the seizure figures these reconcile,
    and the description now says so. The aggregate quote was kept as denominator
    context rather than removed.

    Multiple mitochondrial DNA deletions -- frequency OCCASIONAL to FREQUENT. Summing
    the source's per-onset denominators (1/8, 7/14, 16/16) gives 24 of 38 tested, 63%,
    which is FREQUENT (30-79%); 24/92 would be 26% only as an artefact of incomplete
    testing, since a finding requiring a biopsy and a deletion assay cannot be scored
    in patients who had neither. The denominator choice and the rejected alternative
    are both stated in the record, and the quote carrying the breakdown was added as
    frequency evidence. Incidentally verified that the description's "one of fourteen
    had frank depletion" is correct -- it is the late-onset depletion figure (1/14; 7%).

    Evidence-provenance paragraph moved out of notes. The paragraph narrating the
    curation session ("found by independent PubMed search (E-utilities), fetched with
    `just fetch-reference` ... Sixteen PMIDs ...") was removed from notes; that history
    is in the CREATE record for this entry and in this one. It was also factually stale,
    since it asserted that no deep-research report exists. The "no ORPHA cache for
    Orphanet:254875" and "no module covers mtDNA maintenance" paragraphs were kept, as
    they record searches and their results rather than session narration. New notes
    paragraphs record the identifier decisions, the evidence_source split, the
    counting-denominator discipline, and the deep-research report's non-independence.

    Muscle MRI moved from histopathology to diagnosis. Its own description had conceded
    it was "not histology". Moved, that preamble dropped, and a diagnosis_term added:
    NCIT:C16809 "Magnetic Resonance Imaging", verified by OAK and present in
    cache/ncit/terms.csv. This follows the existing KB convention -- the
    Muscular_Dystrophy_Congenital_Hearing_Loss_And_Ovarian_Insufficiency_Syndrome entry
    files the same record under diagnosis with the same term. The description was also
    strengthened to say what the record is good for: the pattern comes from a single
    eighteen-patient series and has not been compared against the myopathies TK2
    deficiency is mistaken for, so it can direct a biopsy but not replace one.

    NOT CHANGED, deliberately. The two sibling files on this branch
    (Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type,
    SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome) carry only additive reciprocal
    differentials and were left untouched; they were included in the validation sweep
    only. Two unrelated reference-cache files (PMID_33231368, PMID_34026460, both
    SUCLA2 references) were rewritten by the validator's own fix-references-cache step
    with trailing-whitespace normalization; that churn is out of scope for this PR and
    was restored rather than swept in. It is deterministic and will reappear for whoever
    runs the validator next.


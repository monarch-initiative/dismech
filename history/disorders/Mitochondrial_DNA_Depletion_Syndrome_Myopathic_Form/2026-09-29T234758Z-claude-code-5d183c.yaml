  summary: 'Create: mtDNA depletion syndrome, myopathic form (TK2)'
  details: |
    New entry for mitochondrial DNA depletion syndrome, myopathic form
    (MONDO:0012301; MDS type 2; TK2 deficiency), closing issue #11702 and
    retiring stubs/Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form.yaml.

    References were derived entirely by independent literature search, because
    no deep-research report exists for this disease. Candidate PMIDs came from
    NCBI E-utilities searches on TK2 deficiency, thymidine kinase 2 mutations
    myopathy, mtDNA depletion muscle, the mitochondrial dNTP salvage pathway,
    the Tk2 H126N knock-in mouse, and deoxynucleoside/deoxynucleoside-
    monophosphate therapy. Sixteen PMIDs and two ClinicalTrials.gov records
    were fetched with `just fetch-reference` and read from the resulting cache
    files before any snippet was written; nothing was cited that was not
    fetched. No research report was created or committed.

    Curated: disease_term, synonyms, description, parents, classifications
    (NEUROLOGIC / ICIMD nucleotide_pool_maintenance / mitochondrial disease),
    three has_subtypes (infantile-, childhood- and late-onset), inheritance,
    two prevalence records, nine pathophysiology nodes, 22 phenotypes, three
    progression phases, two histopathology records, one genetic record with a
    Spanish founder-allele case fraction, five diagnosis records, six
    differential diagnoses, eight treatments, two clinical trials, the Tk2
    H126N knock-in mouse with three modeled_mechanisms links, four
    discussions, and entry notes.

    Mechanism chain: TK2 loss of function -> failure of mitochondrial pyrimidine
    deoxynucleoside salvage -> imbalanced mitochondrial dNTP pool -> skeletal
    muscle mtDNA depletion and multiple deletions -> combined respiratory chain
    deficiency -> progressive muscle fibre degeneration -> respiratory muscle
    failure, with a separate node for post-mitotic dependence on salvage (the
    tissue-specificity gate) and one for the unsettled CNS involvement. All 22
    phenotypes are causally connected (`just list-disconnected-phenotypes`
    reports 22/22, 100%).

    Terms. TK2 was resolved in both directions before binding: `runoak -i
    sqlite:obo:hgnc search "l^TK2"` returned hgnc:11831, and `runoak -i
    sqlite:obo:hgnc info hgnc:11831` returned TK2. MONDO:0012301 was inspected
    with `runoak -i sqlite:obo:mondo info MONDO:0012301 -O obo`, confirming
    OMIM:609560 and RO:0004003 HGNC:11831. GO:0000002 (mitochondrial genome
    maintenance) was rejected as obsolete and GO:0006264 used instead. Every
    HP, GO, CL, UBERON, NCIT, CHEBI and MONDO CURIE was resolved with OAK in
    the same step it was written. CHEBI:15698 and CHEBI:17748 were checked
    against their definitions to confirm they are the 2'-deoxyribonucleosides
    rather than the nucleotides. HP:0003236's canonical label was corrected
    from "concentration" to "activity" after the validator reported the
    mismatch.

    Conformance: Combined Respiratory Chain Deficiency conforms to
    mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress,
    consistent with the four other mtDNA depletion entries. complex_i_deficiency,
    complex_iv_assembly_deficiency, deregulated_cellular_energetics and
    cardiomyopathy_maladaptive_remodeling were considered and rejected, with
    reasons recorded in the entry notes. No module covers mtDNA maintenance or
    the mitochondrial dNTP pool.

    Sibling consistency: MSTO1-Related_Mitochondrial_Myopathy already carried a
    differential pointing at MONDO:0012301, so the reverse pointer was added
    here. Reverse differentials naming MONDO:0012301 were also added to
    Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type (the purine arm
    of the same salvage pathway) and
    SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome (the encephalomyopathic
    form), each with its own history record. No sibling entry's existing content
    was changed.

    Negative and limiting results were curated rather than dropped: a normal
    creatine kinase does not exclude the diagnosis (REFUTE), no usable
    genotype-phenotype correlation exists (REFUTE), adding tetrahydrouridine to
    the nucleotide therapy shortened mouse survival (REFUTE), the mouse's
    respiratory-chain defect is CNS-predominant with muscle spared so it is not
    a faithful muscle model (REFUTE, with a SPECIES_MISMATCH divergence), and
    CNS features in patients may be hypoxic-ischaemic rather than primary
    (REFUTE). Mouse evidence is graded MODEL_ORGANISM throughout and is never
    the sole support for a human phenotype.

    Not curated: no ClinGen Gene-Disease Validity assertion exists for TK2
    (`just clingen-list` returns none), so gene_disease_validity is absent and
    the reason is recorded in the genetic record's notes. No ORPHA cache file
    exists for Orphanet:254875, so prevalence rests on published case counts
    with no rate_per_100000 asserted. Mitochondrial dNTP pools have not been
    measured in patient tissue in any cited source; the node says so.

    Validation, each run separately and read: `just validate` (149 snippets
    checked, 0 issues, 150 titles checked), `just count-verified-snippets`,
    `just validate-terms`, `just validate-disorders` over all three changed
    disorder files, `just check-duplicate-keys`, `just check-entity-refs`,
    `just check-causal-targets`, `just check-qualifier-terms` (0 qualifier
    terms; none used), `just check-enum-values`, `just check-coarse-phenotypes`,
    `just check-delivery-system`, `just check-genereviews` (GeneReviews chapter
    PMID:23230576 tagged, EXACT title match), and `just validate-history-all`.

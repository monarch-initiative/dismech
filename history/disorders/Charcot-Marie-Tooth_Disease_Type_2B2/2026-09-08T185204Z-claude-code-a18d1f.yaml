  summary: 'Create: Charcot-Marie-Tooth Disease Type 2B2 (MONDO:0011570, PNKP)'
  details: |
    Resolved claim issue #11468 as entry_type DISEASE, not OUT_OF_SCOPE.

    The issue raised the possibility that CMT2B2 is a mapped locus with no identified gene, on the pattern of the three DCM loci ruled OUT_OF_SCOPE in PR #11466. It is not. The gene is PNKP, and the entity has a mechanism to build a pathograph from.

    Gene identity, resolved without a second MONDO query. Two sources keyed on this entry's own MONDO ID:
    - ClinGen's Gene-Disease Validity table (the release pinned in the committed data/clingen/MANIFEST.yaml, snapshot_date 2026-08-13; the CSV itself is gitignored and not committed) carries MED25 / HGNC:28845 / Charcot-Marie-Tooth disease type 2B2 / MONDO:0011570 / AR / Disputed, curated by the Charcot-Marie-Tooth Disease Gene Curation Expert Panel in March 2021. Its narrative names PNKP as the better supported gene and records that the MED25 allele is homozygous in four unaffected gnomAD individuals.
    - PMID:30039206 (Leal et al., Neurogenetics 2018) re-sequenced the original Costa Rican family by exome and found homozygous PNKP c.1549C>T p.Gln517ter in the last exon of an adjacent gene inside the same linkage interval, plus five further Costa Rican CMT2 patients compound heterozygous for that allele and p.Thr408del.

    I then re-checked kb/ for PNKP under its own name rather than the numbered label, which is the miss the issue warned about. PNKP appears in seven files, all as prose mentions inside other entries; there is no PNKP umbrella entry, no MCSZ entry and no AOA4 entry, so nothing already covered this concept. dismech's own Charcot-Marie-Tooth_Disease_Type_2 entry already records the MED25-to-PNKP reassignment in its inheritance description, which is what first surfaced the gene.

    Mechanism. Seven pathophysiology nodes from biallelic PNKP loss of function through destabilisation of the buried C-terminus, impaired DNA single-strand break repair, and accumulated breaks in post-mitotic neurons, to a length-dependent axonal degeneration arm and a cerebellar arm. Three nodes declare conforms_to: two against peripheral_axonal_degeneration and one against cerebellar_purkinje_degeneration#Cerebellar Neuron Insult. The structure deliberately mirrors Ataxia_With_Oculomotor_Apraxia_Type_1, which curates the same kind of DNA-single-strand-break-repair lesion for APTX.

    Two claims are graded rather than asserted. The step from a repair-rate deficit measured in patient fibroblasts to break burden in neurons is curated with directness: INDIRECT and an INDIRECT_UNKNOWN_INTERMEDIATES edge, because no intermediate is established. And PMID:32504494's negative result - no significant double-strand break repair defect across the PNKP spectrum - is curated as a REFUTE item against the alternative reading of that node rather than being dropped.

    The cerebellar node explicitly does not assert Purkinje cell loss. There is no neuropathology in this entity; the evidence is MRI atrophy, and the node says so.

    MED25 is kept in the genetic block with relationship_type: DISPUTED rather than deleted, because the 2009 assignment is still in circulation and a reader meeting 'CMT2B2, MED25' needs to find the correction here. Its evidence carries both the original 2009 claim (PMID:19290556, SUPPORT) and the gnomAD counter-evidence (CGGV, REFUTE).

    Things deliberately constrained. No prevalence figure: one founder haplotype, six index cases. No frequency band on pes cavus (1 of 4 reassessed) or oculomotor apraxia (2 of 4). Two OBLIGATE bands are used and both carry their denominator in notes. Both treatments are marked deliberately uncited, because no CMT2B2-specific management study appears in the sources curated here and the GeneReviews CMT overview in the cache carries only its purpose statement, not management content. The negative phenotype - absence of microcephaly, seizures and developmental delay - carries no HP term and is deliberately unwired, with the reason recorded.

    A snippet note. Two evidence items originally quoted a sentence containing the bracketed citation marker [11], which the reference validator strips before matching. Rather than adding a literal_bracket_patterns entry, the quotes were changed to sentences that do not depend on the bracket.

    Deep research, and a failure worth recording. The committed falcon report is a RETRY. The first run, launched from the plain entry name, returned a report about the right disease (CMT2B2 named 62 times) that reproduced the superseded 2009 gene assignment throughout - MED25 mentioned 57 times, PNKP zero times, no mention of Gln517ter, AOA4 or MCSZ - and whose stated curation conclusion was to represent CMT2B2 as a MED25 disease-gene assertion. It was discarded rather than committed, because research/ is consumed as a curation input and that report would have led a curator straight to the disputed gene. The retry inlined the gene, both alleles, the OMIM number and the reassigning paper in the disease_name variable and returned PNKP as the top gene at 89 occurrences against MED25 at 19, independently reaching the same conclusion as this entry. Both runs are recorded in the entry's own notes with the reproduction command. just preflight-dr returns SKIP for this entity in both runs because MONDO records no causal gene for MONDO:0011570, so the gene-identity discriminator cannot run; SKIP is unchecked, not passed, and the substitution and gene-attribution checks were done by hand. The retry's own reference validation resolved 6 of 6 citations with a 0.0 confabulation rate and no off-topic references. No ontology term was bound from either report.

    Orphan audit. All 16 downstream, sequelae, reports_on and target_mechanisms targets diffed against node and phenotype names: zero orphans. Items with no incoming edge are the trigger node, the two treatments, and the deliberately unwired negative phenotype.

    Validation. just validate (40/40 snippets verified; PMID and CGGV references only, so nothing skipped by prefix), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-stubs, plus whole-KB check-title-snippets, check-snippet-length and check-snippet-grading.

    Post-review changes (#11485). Three findings, all additive, all accepted. First, the molecular-function binding was three levels too general and half-missing: GO:0016301 kinase activity was replaced with GO:0046404 ATP-dependent polydeoxyribonucleotide 5'-hydroxyl-kinase activity, and a second entry was added for GO:0046403 polynucleotide 3'-phosphatase activity, because PNKP is bifunctional, the node's own description says so, and a destabilising truncation removes both activities. Both terms were verified against OLS before binding. Second, claw hand was present in 4 of 4 reassessed patients - more frequent than the pes cavus that already had a phenotype - and survived only as prose inside that phenotype's description; it is now curated against HP:0034337, quoting the deformities row of the clinical table. Mild lumbar scoliosis, 4 of 4, was added from the same sentence against HP:0002650. Third, gait ataxia was quoted in the file but never curated; it is now a phenotype against HP:0002066, reusing the mobility-table snippet already present, and wired from the cerebellar outcome node. That one matters beyond completeness: ataxia is the axis on which this entity is distinguished from AOA4, and the differential argued it in prose while the structured data omitted it.

    On the review's fifth point, the notes sentence claiming the general CMT management literature does not address this entity was wrong, and the cache contradicted it. PMID:20301462, the RETIRED GeneReviews CMT2 chapter, is already cached here and carries a substantive management section. Both treatments are now cited to it with directness INDIRECT and evidence_source OTHER, and a third treatment was added for the agents-to-avoid statement (vincristine, isoniazid, nitrofurantoin), which is the one piece of that guidance that changes prescribing in an axonal neuropathy. Every one of those citations records in its notes that the chapter is retired and is written around the dominant CMT2 subtypes while this entity is recessive; the chapter's own sentence acknowledging that some CMT2 subtypes are recessive is quoted on the counselling entry for exactly that reason.

  summary: 'Review CMT2B2: distinguish PNKP alleles, repair evidence, cohort findings
    and current care'
  details: |
    Reviewed the complete entry and matching Falcon research/citation artifacts against cached primary full texts PMID:30039206, PMID:32504494, PMID:27066567 and PMID:19290556, the dated ClinGen MED25 assertion, and the current full GeneReviews CMT Overview. Read the retired chapter and replaced its care guidance. Added PMID:31436889 for broader adult PNKP neuropathy context; its available cache is abstract-only. The Dutch PNKP-spectrum cohort PMID:32980744 was evaluated but not transferred into the CMT2B2 denominator; publisher and institutional full-text fetches returned 403. No reference cache was hand-authored.

    Corrected the founder haplotype: p.Gln517Ter is linked to MED25 p.Ala335Val, whereas p.Thr408del is in trans in five additional patients. Split genotype, structural prediction, protein abundance and kinase/SSBR mechanisms; bounded the TOP1 and neuron-degeneration hypotheses. Added four patient-cell model records, distinguishing direct CMT2B2 experiments from related AOA4/MCSZ complementation and the childhood homozygous p.Thr408del case. Retained discrepant DNA-damage/DSBR findings with genotype and assay limitations.

    Separated pes cavus/hammertoes and three absent findings, removed unjustified OBLIGATE bands, corrected gait/postural-instability and cerebellar-atrophy edges, strengthened ocular/sensory evidence and added laboratory observations, lymphedema and obesity. Preserved the albumin table/narrative inconsistency. Replaced retired care with current full-chapter rehabilitation, orthoses, mobility aids, orthopedic surgery, recessive counseling and vincristine precaution, explicitly graded as extrapolation. Added the broad observational registry NCT05902351; the saved ClinicalTrials.gov query on 2026-11-06 returned no PNKP-specific intervention study.

    Completeness checklist: phenotype coverage adequate after additions; no separately established CMT2B2 subtypes requiring has_subtypes; mechanistic depth adequate with explicit uncertainty; treatments/trials adequate within available evidence; genetics adequate with allele configuration and disputed MED25/modifier context; biomarkers/diagnostics adequate with cohort and assay limitations; high-value references consumed including full text; overall research consumption adequate. The Pmp22 rodent experiments are historical MED25 context, not direct PNKP disease models. Broader MCSZ case cohorts are out of the CMT2B2 phenotype denominator. Research errors concerning founder evidence and time to wheelchair were rejected.

    Legacy top-level notes contained the history of an unsuccessful MED25-only deep-research attempt and its corrected retry. That provenance remains in the baseline entry and published creation history; this revision replaces the workflow narrative with domain-specific scope and source limitations. No published history record was edited.

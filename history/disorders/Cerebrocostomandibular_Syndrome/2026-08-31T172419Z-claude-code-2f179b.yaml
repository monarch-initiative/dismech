  summary: Clear the three non-blocking notes from the approving review
  details: |
    The approving review on PR #10226 (review 5068898312) listed three non-blocking
    observations "for a future pass". Cleared them now rather than leaving known
    defects in a merged entry, accepting that the push resets the approval.

    1. The clinical_burden evidence explanation said "the SEVERE band" while
       burden_level is HIGH. ClinicalBurdenLevelEnum has no SEVERE value, so the
       text named a band that does not exist. Corrected to HIGH. This was left over
       from the first draft, which used SEVERE before schema validation rejected it.

    2. The clinical_burden snippet opened mid-sentence on "which". Replaced with the
       full sentence from PMID:31884688.

    3. Both mortality quotes from PMID:31884688 are that chick paper's background
       prose about the human disease rather than its own experimental result. The
       HUMAN_CLINICAL grading is kept - the sentences report human clinical
       observation, and evidence_source classifies what the cited text reports - but
       both explanations now say so explicitly and point at PMID:37265362 as the
       independent and stronger source for the same claim.

    Also noted for the record: the reviewer corrected two points from its own first
    review, that HP:0000921's current label is "Missing ribs" rather than the stale
    "Aplasia/hypoplasia involving bones of the thorax", and that the OMIM/ORPHA
    mappings it had suggested are genuinely inexpressible under DiseaseMappings.

    Validation unchanged at 78/78 snippets verified; all offline gates pass.

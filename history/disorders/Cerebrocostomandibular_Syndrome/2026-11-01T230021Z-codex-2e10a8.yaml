  summary: Review CCMS using cached full texts and distinguish experimental mechanisms
  details: |
    Review of existing entry and Perplexity research against primary references. Added incomplete penetrance and the regulatory-exon reporter result from PMID:25047197 full text; separated observed RNA reduction from inferred protein dosage. Split Wnt/BMP and osteogenic/chondrogenic findings, modeled neural crest apoptosis and parallel morphogen-patterning effects with explicit causal uncertainty, and preserved opposite chondrogenic responses across experimental contexts. Corrected unspecified cardiac-septal evidence to a broad HPO binding and removed unsupported frequency bands. Added conductive hearing impairment and observed gastrostomy/palate-repair evidence from PMID:27307910 full text. Added mandibular-distraction outcomes with the SNRPB VUS and 22q11.2 duplication caveat from PMID:41727730. Added the October 2026 regulatory-deletion mouse model (PMID:42896850), limiting claims to its abstract and partial phenotype overlap. GeneReviews baseline check found no matching chapter. Named phenotype and causal targets checked; source titles and exact snippets validated. Final disorder validation passed: schema, ontology terms, and 113/113 cached snippets and titles. No infectious or environmental disease entry reviewed. Regenerated PMID:31884688 with the sanctioned fetcher, recovering full text; incorporated the observed fibrous bridge in the chick model without promoting the proposed tenocyte identity to fact.

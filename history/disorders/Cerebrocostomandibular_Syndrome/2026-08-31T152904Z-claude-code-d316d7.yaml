  summary: 'Create: Cerebrocostomandibular Syndrome'
  details: |
    Created kb/disorders/Cerebrocostomandibular_Syndrome.yaml (MONDO:0007301, SNRPB).

    Deep research: Perplexity (sonar-deep-research) ->
    research/Cerebrocostomandibular_Syndrome-deep-research-perplexity.md. The report
    carried no PMID or DOI identifiers at all: it cites 18 URLs, several of them
    Wikipedia, a hospital patient page, KEGG and PomBase. `just
    validate-research-reference` therefore reported "No PMID or DOI references were
    found in this report" and the reference gate was a no-op for it.
    `just validate-research-terms` did fire and flagged two problems, both avoided
    here: HP:0000353 does not exist, and CL:0000743 (which CL calls "hypertrophic
    chondrocyte") was offered as "cranial neural crest cells". Neither was bound.

    Because the report supplied no citable identifiers, every evidence item was
    sourced independently from PubMed (esearch/esummary/efetch) and fetched with
    `just fetch-reference`: PMID:25047197 (Lynch 2014, the SNRPB autoregulatory
    exon), PMID:25504470 (Bacrot 2015 replication), PMID:26971886 (Tooley 2016,
    16-patient series), PMID:35593225 (Snrpb neural crest mouse), PMID:37584444
    (osteo/chondro-differentiation in vitro), PMID:31884688 (chick Wnt/BMP bead
    model), PMID:37265362 (thoracic phenotype review), PMID:38782423 (case report),
    PMID:25865758 (spliceosomopathy review), PMID:37161864 (poison-exon annotation).

    No GeneReviews chapter exists for CCMS. PubMed searches for "cerebrocostomandibular
    GeneReviews[All Fields]" returned nothing, so the Step 3b baseline does not apply.

    Validation: `just validate` passes schema, term and reference checks with 62/62
    snippets verified. check-entity-refs, check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading and
    check-environmental-evidence all pass.

    Curation note: the reference_title for PMID:31884688 has to be the PubMed title,
    which stops at "cerebro-costo-mandibular syndrome." and omits the journal
    title's trailing "in a model animal".

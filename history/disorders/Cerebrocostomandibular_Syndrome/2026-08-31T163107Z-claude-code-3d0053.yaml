  summary: 'Address PR review: mortality, missing ribs, glossoptosis, hypomorphic
    allele, chondrogenesis conflict, treatments'
  details: |
    Addressed the automated review on PR #10226 (review 5068386207,
    CHANGES_REQUESTED, all IMPORTANT — no CRITICAL findings).

    Every blocking item was accepted and fixed; each rested on material already in
    reference cache files the PR itself commits.

    1. Rib-gap knowledge gap widened. PMID:37265362 nominates a fourth contributor
       the gap statement omitted — "a further absence of ribs or vestigial rib
       formation is associated with respiratory distress and increased lethality" —
       and proposes counting it as "a priority indicator". Both quotes added, and
       the rationale reframed from "how much do the gaps contribute" to "which of
       the four thoracic features should be measured".
    2. Added phenotype Missing ribs (HP:0000921), VERY_FREQUENT, cited to
       PMID:37265362 (one of the three main thoracic phenotypes) and PMID:26971886
       ("reduced numbers of ribs with gaps are consistent findings").
    3. Added phenotype Glossoptosis (HP:0000162), quoted verbatim from PMID:25047197.
    4. Added mortality content: a "Perinatal mortality" progression phase citing
       PMID:31884688 ("inadequate ventilation at birth and high perinatal
       mortality") and PMID:37265362 ("Although the condition can be lethal..."),
       plus a clinical_burden block at HIGH.
    5. Added functional_impact_category: PARTIAL_LOSS_OF_FUNCTION via genetic_context
       on the SNRPB node, with the Lynch characterisation of the alleles as
       hypomorphic (0.53-0.66 of control expression) and the separate, more severe
       null-allele phenotype recorded in the description.
    6. Resolved the directional tension the reviewer surfaced. The edge from
       "Impaired Osteogenic and Altered Chondrogenic Differentiation" to "Costal
       Patterning Failure" was REMOVED: it asserted increased chondrogenesis
       upstream of the rib lesion, while the in-vivo chick model of that same lesion
       reports reduced Sox9 and concludes that inhibited chondrogenesis precipitates
       it. The Sox9 quote was added to the Wnt/BMP -> Costal Patterning Failure edge,
       and a new KNOWLEDGE_GAP (ccms_chondrogenesis_direction) records the conflict
       with a SUPPORT item from the HEPM in-vitro result and a REFUTE item from the
       chick model.
    7. Treatments expanded from two to six: EXIT procedure (PMID:25252050, new
       reference), cleft palate repair (NCIT:C168380 Palatorrhaphy), gastrostomy
       (NCIT:C52006), and scoliosis surveillance/spinal fusion (NCIT:C157986). The
       last three carry directness: INDIRECT, because the cited series establishes
       that the problem is common but reports no management or outcome — the step to
       the standard operation is the curator's inference. Every NCIT identifier was
       resolved against cache/ncit/terms.csv or the OLS API, not taken from the
       deep-research report.
    8. Added a prenatal diagnosis/delivery-planning entry citing PMID:25252050.

    Not done, with reasons: the suggested mappings block for OMIM:117650 and
    ORPHA:1393 cannot be expressed — DiseaseMappings supports only
    icd10cm/icd11f/mondo/ncit sub-slots, and there is no omim_mappings or
    orphanet_mappings. Mandibular distraction osteogenesis was left out because no
    cached CCMS reference mentions it and adding it would mean citing a source not
    about this disease.

    GeneReviews: the reviewer could not verify the absence because network access
    was denied in its environment. Confirmed here — PubMed searches for
    "cerebrocostomandibular GeneReviews[All Fields]" and
    "cerebrocostomandibular syndrome[TI] GeneReviews[TI]" both return zero results.

    Validation after fixes: `just validate` passes schema, term and reference checks
    with 78/78 snippets verified (up from 62/62). check-entity-refs,
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets and check-snippet-grading all pass.

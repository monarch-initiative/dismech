  summary: Make the clinical_burden cross-reference position-independent
  details: |
    Clears the single residual note from the approving re-review on PR #10226.

    The clinical_burden evidence explanation said the corroborating PMID:37265362 item was "on the progression entry below". It is above: progression: starts at line 83 and clinical_burden: at line 147. The reviewer judged this not worth a commit on its own and said to fold it in if anything else touched the file. Nothing else was going to, so it would have merged wrong.

    Rather than swapping "below" for "above", I removed the positional word entirely - the explanation now reads "in the progression section". A section reference cannot go stale when the file is reordered, which is how this one broke: the sentence was written when the two blocks sat the other way round. The companion note in the progression block at line 121 says "below" and is correct, because the item it points at immediately follows it; that one is left alone.

    Pushed knowing it resets the approval. A one-word directional error is small, but it renders on the disorder page and points a reader the wrong way, and this was the only thing standing between the entry and being correct as merged.

    Validation: just validate clean at 78/78 snippets verified.

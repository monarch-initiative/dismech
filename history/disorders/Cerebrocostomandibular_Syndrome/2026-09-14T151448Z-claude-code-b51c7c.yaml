  summary: Annotate quote_role on the PMID:31884688 citations
  details: |
    The worked example behind issue #10262. The same chick-embryo paper (PMID:31884688) is cited both as background and as a primary result, and nothing in the record said which was which. The two clinical_burden/progression items quoting its introductory statement of the human thoracic picture now carry quote_role: BACKGROUND alongside the unchanged evidence_source: HUMAN_CLINICAL; the three items quoting its own bead-implantation results carry quote_role: PRIMARY_RESULT. Explanations were trimmed where the new slot now carries what the prose was doing, and the pointer to the independent human source (PMID:37265362) is kept. No snippet, reference or supports value changed. The link-level item quoting the study's stated aim is deliberately left unannotated: an aim statement is neither a finding nor somebody else's fact, and the enum has no value for it.

  summary: 'Create: Chromosome 15q24 Deletion Syndrome'
  details: |
    De novo curation of the recurrent 15q24 contiguous-gene microdeletion syndrome. Modelled as a Chromosomal entry: NAHR between LCR15q24 segmental duplications -> recurrent heterozygous deletion -> haploinsufficiency of dosage-sensitive genes in the SRO (candidate genes SIN3A, CSK, STRA6, ARID3B, SEMA7A, CPLX3, CYP11A1) -> neurodevelopmental, craniofacial and connective-tissue phenotypes. Distinguished from SIN3A-only Witteveen-Kolk syndrome in differential diagnoses and notes. Deep research: openscientist (17/17 refs verified, 0 confabulation; preflight-dr PASS). Evidence from primary case series (PMID:17360722, 19557438, 22180641, 22216833, 19233321, 20678247, 34922566, 22140075) and the retired GeneReviews chapter (PMID:22359776) tagged as historical baseline. Validated with just validate (0 issues) plus entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, duplicate-keys, block-scalar-comments, logical-rules, genereviews.

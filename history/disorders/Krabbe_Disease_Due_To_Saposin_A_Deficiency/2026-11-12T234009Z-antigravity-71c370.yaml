  details: |
    Upgraded PMID:29995202 to PMC full text and fetched PMID:31439510, PMID:11371512, and PMID:17986137 to eliminate all abstract-unavailable process narration on Seizures, Hypertonia, and Peripheral neuropathy. Added classifications (sphingolipidosis, ICIMD sphingolipid_degradation, Harrison's ENDOCRINOLOGY_METABOLISM/NEUROLOGIC/GENETICS_ENVIRONMENT_DISEASE), expanded pathophysiology into 5 scale-typed nodes conforming to lysosomal_substrate_accumulation, cns_myelin_failure, and peripheral_axonal_degeneration (correcting autophagosome-lysosome fusion GO:0061909 to DECREASED per PMID:29995202 full text), evidenced and causally wired all 10 human phenotypes (including Peripheral axonal neuropathy HP:0003477, Developmental regression, Hyperreflexia, Feeding difficulties in infancy, Optic nerve thickening HP:0000587 with NO_HPO_TERM, and Increased CSF protein concentration), added inheritance evidence, DBS psychosine LOINC:93688-0 and Brain MRI diagnosis entries, Saposin A-deficient (Psap C106F) mouse animal_models entry, and Supportive Care treatment evidence.

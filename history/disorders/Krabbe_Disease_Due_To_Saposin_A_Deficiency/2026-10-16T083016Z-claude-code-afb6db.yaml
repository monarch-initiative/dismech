  details: |
    LOINC tranche D batch 2 (enzyme activity and metabolite assays). Added measurements: to the existing 'Galactosylceramidase assay pattern with PSAP sequencing' diagnosis row, binding BOTH specimen-specific codes rather than the specimen-generic Part code: LOINC:24084-6 (Galactosylceramidase [Enzymatic activity/mass] in Leukocytes) and LOINC:24083-8 ([...] in Fibroblast). This entry's own diagnostic claim is specifically the leukocyte-versus-fibroblast discordance (deficient in leukocytes, normal in cultured fibroblasts), which is what distinguishes this PSAP/saposin-A-activator-deficiency variant from classic GALC-deficient Krabbe disease (a different kb entry, Krabbe_Disease.yaml). The specimen-generic Part code (LOINC:LP14027-4, Galactosylceramidase) is already cached on origin/main from the merged newborn-screening tranche and already bound on that separate classic-Krabbe entry's own NBS diagnosis row (along with the DBS screening code LOINC:62310-8) -- checked before seeding, found, and deliberately NOT reused here, because binding the generic code on this entry would flatten away the specimen discordance that is the entire diagnostic signature for this variant. No reference_ranges band: the source states 'did not show a similar enzyme deficiency' qualitatively for either specimen, with no numeric cut-off. Neither new code requires a third-party copyright notice. No collision with either on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass.

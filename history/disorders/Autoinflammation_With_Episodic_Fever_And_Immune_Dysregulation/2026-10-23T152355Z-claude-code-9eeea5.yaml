  summary: 'Create: Autoinflammation With Episodic Fever and Immune Dysregulation'
  details: |
    De-novo curation of SHARPIN deficiency / 'sharpenia' (MONDO:0968982, OMIM:620795, SHARPIN hgnc:25321), claim issue #14410. Autosomal recessive LUBAC-component deficiency. Mechanism: biallelic SHARPIN loss destabilizes LUBAC (reduced HOIP) -> decreased linear (M1) ubiquitination -> attenuated canonical NF-kB AND sensitization to TNF-induced cell death (apoptosis-predominant in humans) -> systemic autoinflammation; attenuated NF-kB -> impaired germinal-center B cell development (immunodeficiency). Sourced primarily from the disease-defining paper (PMID:38609546, two homozygous frameshift patients, anti-TNF resolution) and the cpdm mouse model (PMID:34887354). Key curation decision: the human disease has NO dermatological phenotype, unlike the cpdm mouse; captured as a HUMAN_MODEL_MISMATCH discussion and a SPECIES_MISMATCH model divergence. Deep research: falcon requested but unavailable (403 auth), fell back to openscientist (report generation still in progress at commit time; entry does not depend on it, being built from the primary source). Validated with just validate, validate-terms, count-verified-snippets (22/22), check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes.

  details: |
    Added a measurements: list to the existing 'Cerebrospinal fluid protein assessment' diagnosis row, binding LOINC:2880-3 (CSF protein). Unlike CIDP, AMSAN and GBS, a second CSF cell-count code was not added: the foundational SIDP cohort's (PMID:14663033) own supportive criteria pair elevated CSF protein with nerve-biopsy inflammatory cells, not a CSF cell count, and a PubMed search (subacute inflammatory demyelinating polyneuropathy cerebrospinal fluid cell count, 2 results) found no SIDP-specific source reporting one -- recorded in the row's description so the absence is not mistaken for an oversight. LOINC:2880-3 was already cached (seeded earlier in this same branch for Neurosarcoidosis). just validate-disorders passed with 0 issues.

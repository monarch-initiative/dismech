  summary: 'Create: Hypotrichosis_4'
  details: |
    New entry for hypotrichosis 4 (HYPT4 / Marie Unna hereditary hypotrichosis 1, MONDO:0100522).

    Lump/split. Curated as a DISEASE, not a subtype or grouping. MONDO:0018631 'Marie Unna hereditary hypotrichosis' has exactly two children in MONDO: MONDO:0100522 (MUHH1, causal gene HGNC:55085 HRURF at 8p21.3, confirmed as the RO:0004003 edge in the local MONDO build) and MONDO:0013017 (hypotrichosis 5 / MUHH2, attributed to EPS8L3 at 1p21.1-1q21.3). Two distinct causal loci make those siblings, so MUHH2 is recorded under differential_diagnoses rather than has_subtypes, and the parent is a skos:broadMatch cross-reference only. If MONDO:0018631 is ever curated it belongs in kb/groupings/.

    Mechanism direction. The lesion is translational DE-REPRESSION, not loss of hairless function, and the entry is written to keep that straight. Node 1 (HRURF uORF disruption) carries genetic_context functional_impact_category LOSS_OF_FUNCTION against HRURF, whose repressive uORF function is destroyed, with an explicit description saying the category applies to the uORF and not to HR. Node 2 (translational de-repression) carries GO:0006412 translation with modifier INCREASED, cited to two independent functional-assay results (PMID:19122663 'increased translation of the main HR physiological ORF'; PMID:20163456 'increased translation of the main HR ORF'). Node 3 is HR corepressor overexpression with GO:0000122 modifier INCREASED. No node anywhere asserts reduced HR function.

    Gene attribution, checked against the primary literature rather than assumed. Every primary report from 2009 (PMID:19122663) through 2023 (PMID:37012647) attributes the variants to U2HR, described as an inhibitory uORF inside the 5' UTR of HR. HGNC approved HRURF (HGNC:55085, alias U2HR) as a separate gene record only in 2020-12-16; reports from 2025 on (PMID:40433810, PMID:39872230) use HRURF and gloss it as formerly U2HR. Both hgnc:55085 and hgnc:5172 were confirmed present in the HGNC build. The entry binds hgnc:55085 as CAUSATIVE, matching MONDO, and records a discussion (muhh1_gene_symbol_attribution) on the practical consequence: an HR coding-exon panel does not test this element.

    HR is recorded as a second genetic entry with relationship_type DISPUTED and no evidence, purely to make the relationship explicit. The one report of a coding HR missense variant under a MUHH1 label (PMID:22584530, alopecia universalis plus four-limb deformities) is described in notes, not curated as a mechanism: the authors themselves called for further study, the phenotype is not the MUHH1 triphasic course, and no family has replicated it.

    Downstream mechanism honesty. Everything between increased HR translation and reduced human follicle density comes from the hairpoor mouse alone. Two discussions record this: muhh1_wnt_direction (CONTROVERSY) because the same group reported Sfrp2 DOWN in 2010, read as excess Wnt, and Dkk1 UP in 2014, a Wnt inhibitor and catagen inducer, so the Wnt node is curated DYSREGULATED rather than INCREASED; and muhh1_human_mechanism_gap (HUMAN_MODEL_MISMATCH) because no Wnt or hair-cycle readout exists in human MUHH1 scalp and PMID:10674378 states outright that the mechanism of hair loss is unknown. The hairpoor mouse is curated in animal_models with four modeled_mechanisms links carrying model_scale, fidelity, limitations and readouts; the Wnt link is MEASURES/LOW with an explicit upward-extrapolation caveat.

    A REFUTE evidence item is curated on the 'Sparse Scalp Hair at Birth' phenotype: PMID:10674378 describes affected individuals as 'born with adequate, normal to coarse hair', contradicting the usual statement that congenital sparse hair is universal.

    Deep research. The committed report is a claude_code report (research/Hypotrichosis_4-deep-research-claude_code.md; 5m14s, 16 web searches, 26 citations). falcon was not attempted because it returns HTTP 402 (out of credits) and openscientist because it was timing out server-side; no fallback substitution was made. just validate-research-reference and validate-research-terms were run and their sections committed with the report: 14/14 references resolved, 0 unresolved, 0 off topic; term validation flagged MONDO:0007806 as obsolete (replaced by MONDO:0100522, which this entry binds), GO:0070577 as obsolete (not used), and HP:0002293 as mislabelled by the report ('Hypotrichosis'; HPO calls it 'Alopecia of scalp') - that term was NOT bound. just preflight-dr returned WARN because HR is mentioned 71 times against HRURF 22; that is intrinsic to a disease whose causal element sits inside another gene's 5' UTR, and identity was confirmed independently against MONDO (OMIM:146550 and RO:0004003 HGNC:55085 both match). The report's atrichia-with-papular-lesions and hairless-mouse coding-mutant content was deliberately excluded from the mechanism and kept only as a labelled differential diagnosis.

    Claims dropped or left unevidenced. The topical-minoxidil lead (Cui et al., DOI:10.1111/jocd.70382, PMC12340736) is curated as a treatment with NO evidence item: the record has no abstract in PubMed, Europe PMC or Crossref and no PubMed record at all, so no exact snippet exists. Rather than quote its title as a finding, the limitation is stated in the treatment notes and the paper is listed in the top-level references block. Follicular hyperkeratosis with milia-like papules was not curated because no cached source stated it quotably. No Orphanet evidence could be curated: ORPHA:444 is not in the Orphadata leaf-disorder bulk file this repo caches, so just fetch-reference ORPHA:444 failed and prevalence is curated as measure_type UNKNOWN / prevalence_class RARE with no rate. No conforms_to target was added; there is no hair-follicle-cycle module in kb/modules/, and eda_edar_nfkb_ectodermal_appendage and keratin_intermediate_filament_fragility were inspected and rejected as out of scope.

    Validation run to completion. just validate, just validate-terms, just count-verified-snippets (71/71 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-title-snippets, just check-snippet-length, just check-snippet-grading, just check-folded-hyphens, just check-environmental-evidence, just check-not4curation, just check-reference-titles, just normalize-cache, just check-term-cache-integrity - all pass. just validate-disorders kb/disorders/Hypotrichosis_4.yaml: schema 'No issues found', terms 'Validation passed', references 'All validations passed', 'Snippets checked: 71/71 verified against cached references'. just qc was NOT run (exceeds the tool timeout); the individual gates were run instead.

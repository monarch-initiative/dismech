  summary: 'Create: Progressive Spondyloepimetaphyseal Dysplasia-short Stature-short
    Fourth Metatarsals-intellectual Disability Syndrome (RSPRY1)'
  details: |
    De-novo curation of MONDO:0014748 [spondyloepimetaphyseal dysplasia, Faden-Alkuraya type; SEMDFA; OMIM #616723; ORPHA:457395], caused by biallelic RSPRY1 variants.

    Deep research: the default provider falcon/Edison failed with HTTP 402 Payment Required - the EDISON_API_KEY in this environment has no credits - so no falcon report was produced. Two other providers were run instead and both reports are committed: claude_code [254 s, 9 web searches, 14 citations; reference_validation 6/6 resolved, 2/2 quotes valid, 6/6 on topic, needs_review absent] and openscientist [857 s, 5 citations, 2 artifacts; reference_validation 6/6 resolved, 10/11 quotes valid, needs_review true]. The single unsupported openscientist quote is from PMID:30063090 and fails only because of the square-bracketed cDNA designations in that abstract, which the reference validator strips; the entry's own snippets from that paper deliberately avoid the bracketed spans.

    NEC preflight [just preflight-dr against MONDO:0014748]: claude_code PASS, with RSPRY1 mentioned 50 times and dominant, and the report OMIM 616723 matching the MONDO xref. openscientist WARN, triggered solely by SMAD3 being mentioned 20 times; SMAD3 is the mechanistic partner established by PMID:39940902, not a rival disease entity, and the report OMIM matches the MONDO xref exactly, so this is a false positive rather than named entity confusion.

    GeneReviews baseline: none exists. PubMed searches for RSPRY1 GeneReviews and Faden-Alkuraya GeneReviews both return zero results; the four GeneReviews chapters matching spondyloepimetaphyseal dysplasia cover TRPV4, EXOC6B, COL2A1 and MBTPS1, none of them RSPRY1. Recorded in the entry notes.

    Sources: primary literature only - PMID:26365341 Faden 2015 gene discovery, PMID:30063090 Simsek-Kiper 2018 phenotype delineation in five patients, PMID:38562122 Singh 2024 two Indian sisters with joint dislocation as phenotypic expansion, PMID:39940902 Imren 2025 TGF-beta/SMAD3 mechanism, PMID:39706863 Indian skeletal dysplasia cohort - plus the structured Orphanet record ORPHA:457395, newly built with just structured-rebuild-orphanet --id 457395 after refreshing the bulk XML. data/orphadata/MANIFEST.yaml is unchanged, so there is no snapshot drift.

    Content: a five-node pathograph running RSPRY1 biallelic loss of function to loss of restraint on TGF-beta/SMAD signalling to ECM dysregulation and increased cell motility to disrupted endochondral ossification at the growth plate to progressive skeletal dysplasia, with a craniosynostosis branch; 30 phenotypes; 3 variant records; the patient-fibroblast CRISPR knockout system as the sole experimental model, with modeled_mechanisms and two grounded readouts; supportive treatments only.

    Epistemic discipline applied: the mechanism nodes downstream of the gene are curated PROVISIONAL, not ESTABLISHED, because the entire molecular account rests on 2D dermal fibroblasts from two patients and has never been measured in a skeletal lineage. Six discussions record this explicitly - a HUMAN_MODEL_MISMATCH on the fibroblast-to-growth-plate extrapolation, KNOWLEDGE_GAPs on the unidentified ubiquitination substrate, the absent animal model, and the wholly unexplained intellectual-disability mechanism, a CONTROVERSY on the secreted-versus-cytoplasmic localization conflict between PMID:39940902 and PMID:38562122, and an EMERGING_HYPOTHESIS recording that TGF-beta-directed therapy is untested so that no treatment entry asserts it. There is no conforms_to link to aortopathy_tgfbeta_dysregulation: both reports and that module's own scope argue against it, and the reasoning is in the entry notes.

    Deliberately not curated: the exact cDNA designations of the two Faden 2015 index alleles. Both deep-research providers reported them sourced to OMIM, but they appear only in that paper's full text, which is not open access - the PMC record PMC4596891 refuses full-text XML download and the cached reference is abstract-only - so they could not be verified against a cached primary source. This is recorded in genetic review_notes for a curator with journal access. There is no datasets block: just discover-datasets found no GEO candidates and the 2025 transcriptomics paper cache carries no accession, so none was invented.

    Validation: just validate passes for schema and terms. just count-verified-snippets reports 90/90 verified against cached references. just check-duplicate-keys OK. just check-title-snippets reports no new title-quoting snippets. just compliance reports 89.8% global and 90.0% weighted. just validate-disorders was run as the final pre-PR sweep. The curation stub was deleted and just check-stubs passes.

    Curation was AI-assisted via claude-code; the model identifier is deliberately omitted from this record per the operating instructions for this session.

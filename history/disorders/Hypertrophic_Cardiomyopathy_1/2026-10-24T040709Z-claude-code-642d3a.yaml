  summary: Add epistasis hiPSC-CM model and modifier knowledge gap from PMID:40473955
  details: |
    Curated Wang et al. 2025 (Nat Cardiovasc Res, DOI 10.1038/s44161-025-00656-8, PMID:40473955) from the PMC full text. Added an IPSC_DERIVED_MODEL experimental model: MYH7 R403Q patient hiPSC-cardiomyocytes in which CCDC141, IGF1R and TTN were silenced singly or in pairs. It is linked to the ventricular hypertrophy node as PERTURBS with LOW fidelity, typed SCALE_EXTRAPOLATION and BOUNDARY_OMISSION divergences, and one cell-size readout. Added a KNOWLEDGE_GAP discussion asking whether these genes modify hypertrophy in MYH7 carriers. CCDC141, IGF1R and TTN were not added to genetic[] as modifiers, because the human data are left ventricular mass in a general-population UK Biobank sample, not HCM severity. The failing-heart co-expression analysis was not curated. The DOI fetch returned no text, so the PMID record was cited instead.

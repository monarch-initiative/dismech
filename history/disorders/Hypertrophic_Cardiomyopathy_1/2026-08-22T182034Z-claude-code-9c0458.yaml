  summary: 'Create: Hypertrophic Cardiomyopathy 1 (MYH7/CMH1)'
  details: |
    Curated CMH1 (MONDO:0008647), the MYH7/beta-cardiac myosin heavy chain form of familial hypertrophic cardiomyopathy and the founding molecular diagnosis of the field (R403Q, 1990). MYH7 is, with MYBPC3, one of the two commonest HCM causes and was represented only inside the MONDO:0005045 umbrella entry. Seven-node pathograph modeling the MYH7 gain-of-function/poison-peptide mechanism (missense mutant motor -> super-relaxed-state/IHM destabilization -> increased intrinsic motor force and tension cost -> sarcomere hypercontractility with impaired relaxation -> cell-to-cell contractile imbalance -> hypertrophy/disarray/fibrosis -> diastolic dysfunction, LVOT obstruction, heart failure and arrhythmic risk), deliberately contrasted with the MYBPC3 haploinsufficiency entry (CMH4). Conforms to cardiomyopathy_maladaptive_remodeling at the trigger, ventricular-remodeling, and structural-impairment nodes. Mavacamten linked via target_mechanisms to the SRX node. Allele-heterogeneity caveat (PMID:40118457) and cohort-level MYH7-vs-MYBPC3 no-difference finding (PMID:23674365) preserved. All 32 evidence snippets verified against cached references; schema, terms, and the five ungated CI gates pass. Deleted the CMH1 stub and added CMH1 to the Familial Hypertrophic Cardiomyopathy grouping.

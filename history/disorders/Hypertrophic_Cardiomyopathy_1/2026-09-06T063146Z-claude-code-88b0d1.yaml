  summary: 'Augment: Hypertrophic Cardiomyopathy 1 (MYH7/CMH1)'
  details: |
    Augmentation round on the existing MYH7/CMH1 entry (created in PR #9371). The
    entry already carried a well-developed pathophysiology chain, phenotypes,
    genetics and three treatments; this round added the sections it was missing
    rather than reworking what was there. File grew from 938 to 2722 lines.

    Deep research provider: falcon (Edison Scientific), run as
    `just research-disorder falcon Hypertrophic_Cardiomyopathy_1`, 18m22s, 47
    citations, one artifact. Report committed at
    research/Hypertrophic_Cardiomyopathy_1-deep-research-falcon.md. No fallback
    was needed. The report predated in-line validation, so a
    `## Reference Validation` and `## Term Validation` section were added
    retrospectively with `just validate-research-reference` and (as part of the
    same recipe) term validation.

    Report validation results and what was done with them.
    - References: 20/20 resolved, 0 unresolved, 0 off topic.
    - Terms: 54 checked, 2 unresolved and 10 named as a different term. Six bad
      CURIEs were caught and NOT bound: NCIT:C29622 and NCIT:C151608 (do not
      exist); HP:0031604 (offered for myocardial fibrosis, is Agenesis of the
      carotid canal); HP:0005117 (offered for diastolic dysfunction, is Elevated
      diastolic blood pressure); HP:0031797 (offered for incomplete penetrance,
      is Clinical course); NCIT:C139785 (offered for gene editing, is a TNM
      finding). Myocardial fibrosis was bound to HP:0001685 instead, found with
      OAK. A seventh wrong binding of my own, HP:0031200 (Hyaline casts) for LVOT
      obstruction, was caught by linkml-term-validator during curation and
      corrected to HP:0032092.
    - `just preflight-dr research/... MONDO:0008647` returned PASS: MYH7
      mentioned 71 times, report OMIM 192600 matches MONDO's.

    What was curated.
    - New pathophysiology node: Cardiomyocyte-to-Fibroblast EGFR Paracrine
      Signaling (PMID:39413182), placed between hypercontractility and the
      tissue remodeling node, with its own edge evidence. Records that
      interstitial fibrosis in MYH7 disease is driven by a soluble signal from
      the mutant cardiomyocyte to the fibroblast (conditioned medium transfers
      it; erlotinib blocks it; collagen I +40% over isogenic wild type), not by
      wall stress alone.
    - Quantitative SRX evidence added to the super-relaxed-state node from the
      MYH7 G256E multiscale study (PMID:38683993): folded-back fraction reduced
      33%, via the transducer region rather than an IHM contact surface.
    - Three phenotypes: Atrial Fibrillation (HP:0005110), Syncope (HP:0001279),
      Myocardial Fibrosis (HP:0001685).
    - New sections: histopathology, biochemical, imaging_findings, progression,
      differential_diagnoses, experimental_models, animal_models, datasets,
      discussions.
    - Seven treatments: aficamten (CHEBI:747213, PMID:38739079), disopyramide
      (CHEBI:4657, PMID:15837258), alcohol septal ablation (NCIT:C80439,
      PMID:26746632 Euro-ASA), beta-adrenergic blockade (NCIT:C29576 +
      CHEBI:7444, PMID:8496536), verapamil (CHEBI:9948, PMID:8496536), oral
      anticoagulation for atrial fibrillation (NCIT:C263, PMID:24014282), and
      preclinical MYH7 allele-directed gene editing (PMID:36797478 base editing,
      PMID:36797483 in vivo editing, PMID:38752340 hpCas13d). Evidence was also
      added to the two previously uncited treatments, myectomy (PMID:16053960)
      and ICD (PMID:17652294).
    - A diagnosis section: the echocardiographic wall-thickness criterion, the
      sarcomere gene panel, and cascade testing of first-degree relatives, all
      from PMID:38540296.
    - Two clinical trials: SEQUOIA-HCM (NCT05186818) and VALOR-HCM
      (NCT04349072, PMID:35798455).
    - Four GEO datasets, all MYH7-relevant and relevance-triaged by hand:
      GSE195436, GSE276210, GSE198258, GSE201755. `just verify-datasets`
      reported 4/4 OK; GEO_*.md caches are committed.
    - Three discussions: the SRX allele-heterogeneity gap, the structural absence
      of MYH7-stratified clinical evidence, and a HUMAN_MODEL_MISMATCH on the
      founding mouse model's alpha- versus beta-myosin isoform mismatch.

    Directness discipline. Nearly every clinical evidence item added this round
    carries directness: INDIRECT for the same reason: the trials and cohorts
    enrolled hypertrophic cardiomyopathy broadly, not genotyped MYH7 carriers.
    Discussion cmh1-myh7-specific-clinical-evidence records that as a structural
    gap so the volume of clinical citation is not read as MYH7-specific evidence.
    The genuinely MYH7-specific evidence added is the biophysical, model and
    genetic literature, plus the penetrance meta-analysis (PMID:37929589), which
    reports MYH7 separately (~65% in non-proband relatives against ~11% in
    incidentally identified carriers; ~23% versus ~12% short-term conversion
    against MYBPC3).

    Retired-enum prose cleanup. Four `explanation` strings still argued for the
    retired supports: PARTIAL grade (#7439/#10061). They were rewritten to say
    what they meant, and the two that meant an inference step now carry
    directness: INDIRECT on the slot rather than only in prose.

    Model fidelity was recorded honestly rather than favourably. The founding
    alpha-MHC 403/+ mouse (PMID:8614836) is LOW fidelity with a SPECIES_MISMATCH
    divergence because its lesion is in Myh6, not the MYH7 orthologue. The
    beta-MyHC-Q403 rabbit (PMID:15135661) and the MYH7 R723G knock-in pig
    (PMID:29555974) are curated alongside it because both species run on
    beta-myosin as humans do; the pig carries an INVALIDATING TEMPORAL_SCOPE
    divergence since the animals died within 24 hours of birth.

    Deliberately not curated. `has_subtypes` and `variants` were left empty: the
    report's variant-level content is allele-specific functional data rather than
    a defined subtype structure, and curating individual MYH7 alleles as subtypes
    would be a separate decision. Alcohol septal ablation carries positioning
    evidence only; the ablation-versus-myectomy comparative literature was not
    screened this round and no comparative-efficacy claim is made. The clinical
    gene-replacement program TN-201 targets MYBPC3, not MYH7, and is explicitly
    excluded in the treatment notes.

    Adversarial self-review before PR. A subagent ran the dismech-pr-review
    checklist against the change and returned no CRITICAL findings and eight
    IMPORTANT ones, all taken in a single round rather than deferred:
    (1) the new EGFR edge asserted causal_link_type: DIRECT for a coupling the
    source explicitly calls unestablished, changed to
    INDIRECT_UNKNOWN_INTERMEDIATES with the source's own hedge recorded in the
    edge description;
    (2) the disopyramide mechanism edge quoted the abstract's BACKGROUND framing
    of prior work rather than a finding, replaced with the CONCLUSIONS result;
    (3) alcohol septal ablation was evidenced entirely by a disopyramide trial,
    replaced with the Euro-ASA registry (PMID:26746632, 1275 patients) at both
    treatment and mechanism-edge level;
    (4) the notes claimed near-universal directness: INDIRECT while roughly one
    clinical item in three carried it. Five more items were marked and the prose
    rewritten to state exactly which items carry it, which do not, and why;
    (5) CL:0002548 was one level too general where the source says
    "ventricular", narrowed to CL:2000066 cardiac ventricle fibroblast;
    (6) the LGE imaging record left the recommended imaging_finding_term empty
    when NCIT:C209440 Late Gadolinium Enhancement exists, now bound;
    (7) the report's first-line therapies were absent while preclinical gene
    editing was curated. Beta-blockade, verapamil and anticoagulation were added,
    and the scoping rule that admits gene editing but excludes the SGLT2i finding
    is now stated in notes;
    (8) no diagnosis section, added as above from a reference that had been
    fetched and left unused.
    Minor findings taken: a PROXY_QUANTITY divergence on the rabbit model (its
    measured quantity moves opposite to the node's), the ICD inappropriate-shock
    datum regraded REFUTE as a separate opposite-direction item rather than
    SUPPORT, the pig BOUNDARY_OMISSION reworded because the paper actively
    reports no obvious hypertrophy rather than not reporting it, a false claim
    that R403Q appears in the GSE201755 series title corrected, a directness note
    on the syncope item, and seven downstream edges added from the terminal
    pathophysiology node to the phenotypes it had been bundling. The entry
    previously rendered as two disconnected graph components. The unused feline
    transcriptome reference (PMID:36928240) is now explicitly declined in
    animal_models notes, with the reason: feline HCM is predominantly MYBPC3.
    An unsourced pharmacokinetic claim about aficamten (shorter half-life,
    narrower titration range) was removed on my own re-read before the review
    reported.

    Validation. `just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_1.yaml`
    passed after every round; final run: schema OK, term validation passed, 92/92
    snippets verified against cached references. Also run and passing: check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-qualifier-terms,
    check-enum-values, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-folded-hyphens (one new finding fixed by
    reflowing an `isoproterenol-` line break), check-environmental-evidence,
    check-term-cache-integrity, check-not4curation, and verify-datasets.
    Compliance rose in absolute terms (96/108 to 232/274 checks passing) while
    the percentage fell from 88.9% to 84.7%, because the added sections more than
    doubled the denominator.

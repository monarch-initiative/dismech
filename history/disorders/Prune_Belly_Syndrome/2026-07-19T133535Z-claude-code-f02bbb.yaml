    De-novo curation of Prune Belly Syndrome / Eagle-Barrett syndrome MONDO:0007032, triggered by the prunebelly.org reference. Deep research via the claude_code provider after Edison/falcon returned 402 payment-required. Modeled the defining triad of abdominal wall muscle deficiency, bilateral cryptorchidism, and urinary tract dilation/megacystis, plus hydroureter, hydronephrosis, vesicoureteral reflux, renal dysplasia, progressive CKD, and oligohydramnios/pulmonary hypoplasia. Two competing etiologic mechanistic_hypotheses modeled with hypothesis_groups on causal edges. Genes CHRM3 biallelic AR MONDO-linked with Chrm3-null mouse phenocopy, FLNA X-linked, PIEZO1 candidate, HNF1B disputed. Treatments orchiopexy, reconstruction, antibiotics, kidney transplantation. All 41 evidence snippets verified as exact substrings of cached PubMed sources; schema, term, and reference validation pass; compliance 93.9 percent.

  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 7347.

    Committed the missing references_cache/PMID_42487691.md, regenerated with 'just fetch-reference PMID:42487691' (never hand-written), which was the review's blocking item.

    Retagged every PMID:42487691 evidence item from HUMAN_CLINICAL to OTHER: the cached abstract states the work 'employs a narrative review approach to synthesize current neuroimmunobiology literature', so it reports no primary human data.

    Split the bundled 'Microglial Activation and Parvalbumin Interneuron Pruning' node into four atomic pathophysiology nodes - Basal Ganglia Microglial Priming, Excessive Microglial Synaptic Pruning, Parvalbumin Interneuron Loss, and Attenuated Feedforward Inhibition of Medium Spiny Neurons - chained by downstream edges, and gave the chain an incoming edge from the existing Complex Genetic Liability node so it is no longer orphaned in the pathograph.

    Added a disease-level mechanistic_hypotheses entry (hypothesis_group_id microglial_pruning_model, status EMERGING) and opted every new causal edge into it via hypothesis_groups. Claims the authors hedge ('are hypothesized to execute', 'potentially contributing') are curated as supports: PARTIAL.

    Refined three ontology bindings: GO:0061002 to GO:0098883 synapse pruning (removes an INCREASED-on-a-negative-regulation double negative), GO:0006836 to GO:0007214 gamma-aminobutyric acid signaling pathway, and CL:0011005 to CL:4042023 striatal pthlh-expressing interneuron. CL:4042023 was chosen over the reviewer-suggested CL:4023018 because CL:4023018 is defined with the soma in the pallium (cortical), whereas CL:4042023 is defined as 'A GABAergic interneuron expressing PTHLH and PVALB that has its soma in a striatum' - the basal-ganglia population the paper actually describes.

    Tagged all four nodes with biological_scale.

    Validation: 'just validate kb/disorders/Tourette_Syndrome.yaml' passed schema, term, and reference validation; 'just count-verified-snippets' reports 35/65 verified against cached references with 30 skipped by prefix (pre-existing DOI/url references, not failures).

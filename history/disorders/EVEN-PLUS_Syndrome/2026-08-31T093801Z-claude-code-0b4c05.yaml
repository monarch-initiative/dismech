  details: |
    Second automated review cycle on PR 10213. Supersedes the 08:18 CREATE record, which was written before the round-1 fix commit and understates what the entry now holds: it omits the treatments section and reports 43/43 snippets against the current 58/58.

    Fixed the one substantive finding of round 2. The notes block claimed the zebrafish crimsonless mutant was cited twice for two different claims and that both items were MODEL_ORGANISM and INDIRECT. It was cited once. The prose was never true, not something a fix commit dropped, and it survived a full review round because the PR body restated it and the round-1 review repeated it back as praise without counting. Rather than trim the prose to match one citation, the second citation was added, because the claim the prose describes - that hspa9 loss disturbs morphogenesis globally rather than regionally - was carried by prose alone. The new item quotes the global developmental arrest sentence from the same cached paragraph, graded SUPPORT INDIRECT MODEL_ORGANISM, and its explanation records that the underlying result is Craven et al. 2005's, summarised by the EVEN-PLUS report that this entry actually caches.

    Added frequency OBLIGATE to three phenotypes, on the review's own 12-case denominator rather than on pooled percentages across independent reports. Two of the three needed a stated reason. Epiphyseal Dysplasia is entailed rather than asserted: the source reports dysplastic femoral heads at 100 percent 12 of 12, and the femoral head is an epiphysis, so a narrower feature at full penetrance carries the broader node. Synophrys and Arched Eyebrows is a compound node and the source states the feature disjunctively, so OBLIGATE is asserted for the compound and explicitly not for synophrys alone.

    Declined the same suggestion for Microtia and recorded why in its description. The 12 of 12 statement is for hypoplastic or dysplastic ears, which is broader than microtia, and unlike the femoral-head case a broader feature at full penetrance does not carry the narrower one. Applying the suggestion uniformly would have asserted that all twelve patients had microtia specifically, which no source says.

    Declined the rebinding of Basal Ganglia Lesions from HP:0002134 to HP:0012751 Abnormal basal ganglia MRI signal intensity. The cached snippet says basal ganglia lesions in cerebral MRI. Lesion is structural language; signal intensity is a claim the source does not make, and binding it would manufacture a narrower match, which the term contract forbids. HP:0007146 was also rejected because its bilaterality is unsupported.

    Declined the optional progression block. No denominatored or syndrome-level progression statement exists in any cached reference. The only candidate sentence describes one patient's posture not worsening, and the structural claim the reviewer pointed at lives in deep-research synthesis prose, which is not citable.

    Validation on this head: linkml-validate clean, term validation passed, 58 of 58 snippets verified against cached references, cache normalization reported zero files updated, and check-entity-refs, check-duplicate-keys, check-snippet-grading and check-snippet-length all clean with no baseline movement.

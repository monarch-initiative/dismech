  summary: 'Create: EVEN-PLUS Syndrome'
  details: |
    De-novo curation of EVEN-PLUS syndrome, MONDO:0014801, HSPA9 - the biallelic mortalin/mtHSP70 chaperonopathy. One OpenScientist deep-research run, research/EVEN-PLUS_Syndrome-deep-research-openscientist.md: 14/14 references verified, 21/21 quotes valid, confabulation_rate 0.0, but term_validation needs_review true with 8 label mismatches. No CURIE was taken from the report; every ontology binding here was selected against the committed term caches and validated by just validate-terms. The report's suggested terms included HP:0011003 labelled 'Arched eyebrows' when it is High myopia, and NCIT:C15190 labelled 'Supportive Care' when it is Needle Biopsy, so the caution was warranted. The report did contribute two verified leads that materially improved the entry: PMID:30933555, a dedicated biophysical study of the R126W and Y128C alleles, and PMID:25550197, establishing that homozygous Hspa9 knockout is embryonically lethal. Both were fetched and independently read before use. The entry deliberately does NOT curate the report's proposed energy-failure and apoptosis causal chain, because the primary source states explicitly that the phenotype does not resemble bioenergetic mitochondrial disease and that the pathogenesis of the developmental defects remains unexplained; that step is curated as a KNOWLEDGE_GAP discussion instead. Validated with just validate - schema, terms, 43/43 snippets verified - plus check-entity-refs and check-duplicate-keys.

  summary: 'Review response round 3: drop unsupported obligate frequency on synophrys'
  details: |
    Third automated review cycle on PR 10213. One finding, and it was my inconsistency rather than a missed detail.

    The round-2 pass added frequency OBLIGATE to Synophrys and Arched Eyebrows on the strength of the sentence 'All patients had synophrys or arched eyebrows, hypoplastic or dysplastic ears, hypoplastic nasal bone, and dysplastic femoral head'. That sentence puts the disjunction at twelve of twelve; it says nothing about synophrys alone, which could be anywhere from zero to twelve. I recorded the carve-out in the node description - that OBLIGATE was asserted for the compound and not for synophrys alone - but there is nowhere in the data for a carve-out to live. The frequency slot sits on a phenotype record whose machine-readable identity is HP:0000664, so any export or HPOA-style query reads it as EVEN-PLUS synophrys one hundred percent, which no source states. A prose caveat beside a machine-queryable value does not restrict the value.

    What makes this worse than an oversight is that the same commit applied the correct rule to Microtia sixty lines further down, declining OBLIGATE there because hypoplastic or dysplastic ears is broader than microtia. Synophrys or arched eyebrows is broader than synophrys in exactly the same way. I wrote the right rule and then failed to apply it to the node I had just edited.

    Removed the frequency line and reworded the description to state the decline the way the Microtia description does, rather than explaining a value that is no longer there. Kept the HP:0000664 binding: the reviewer's alternative was to rebind the node to HP:0000534 Abnormal eyebrow morphology, which is the least common subsumer of synophrys and highly arched eyebrow and would make the hundred percent claim literally true. That is defensible, but it trades away a correct specific binding to rescue a frequency value, and the frequency is the unsupported part. Dropping the number and keeping the term loses less.

    Also rewrote the counting paragraph in notes, which had gone stale the moment the round-2 commit converted two of the four features into numbers. It still described all four as quoted rather than converted. The replacement states the actual rule the entry now applies: a frequency is asserted when the source sentence distributes over the bound term, either exactly as for hypoplastic nasal bone against HP:0004646, or by entailment as for dysplastic femoral head against HP:0002656 since the femoral head is an epiphysis. It is withheld when the sentence is a disjunction broader than the bound term, because entailment runs from narrow to broad and never the reverse. This is the same defect class as the round-2 finding: notes prose describing entry content that has moved underneath it, which nothing in the validation stack checks.

    Validation on this head: linkml-validate clean, term validation passed, 58 of 58 snippets verified, cache normalization reported zero files updated, check-entity-refs and check-duplicate-keys clean, and the three baseline gates clean with no movement.

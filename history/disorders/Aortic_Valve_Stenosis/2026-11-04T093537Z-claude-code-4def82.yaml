  details: |
    Reviewed the 12 active whole-claim MISMATCH findings from the Jev evaluation (source revision fc510ecca, unchanged since). Changed: NOTCH1 PMID:35288444 snippet extended to include the pedigree pathogenic-variant result so it supports the CAUSATIVE claim; Replacement Myocardial Fibrosis -> Myocardial Fibrosis edge now cites the PMID:28017384 cohort result (27% mid-wall LGE) instead of the background imaging-definition sentence; NCT03094143 and NCT02132026 registry snippets replaced with the registry design sentences (randomization arms) instead of disease-background sentences; removed the generic EVOLVED 'findings are not definitive' item from CMR diagnosis (the primary-endpoint item already carries the caveat); removed negative-arm snippets (SB204741 antagonist arm, normal-media glucose null) from the model-mechanism link and readout evidence they did not support, keeping them as model-level evidence where the model descriptions state those limits. Retained after review: rheumatic penicillin prophylaxis (ESC guideline sentence directly supports the treatment), EVOLVED primary-endpoint evidence on the fibrosis knowledge gap, and the remaining CMR diagnosis evidence. Validated with just validate, count-verified-snippets (214/214), validate-disorders.

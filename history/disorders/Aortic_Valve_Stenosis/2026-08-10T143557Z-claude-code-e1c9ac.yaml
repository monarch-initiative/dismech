  summary: 'Create: Aortic Valve Stenosis'
  details: |
    New Disease entry for calcific aortic valve disease, organised around the transition from a lipid-retention lesion to an autonomous osteogenic program, and then from the valve to the ventricle. Ten pathophysiology nodes. Three competing mechanistic_hypotheses with edge-level opt-in: osteogenic_autonomy (CANONICAL), lipid_driven_progression (DEPRECATED, carrying the SALTIRE and SEAS REFUTE evidence), lipoprotein_a_specific_pathway (EMERGING). Deliberate non-conformance to the atherogenesis module is recorded in notes with the module's own curation boundary quoted as the reason. Three discussions: the prognostic-versus-treatment-selection controversy over myocardial fibrosis anchored on EVOLVED, a knowledge gap on reversibility of osteogenic commitment with two proposed experiments, and an open question recording the absence of a Cell Ontology term for the valve interstitial cell. Validated: just validate (schema OK), just validate-terms (OK), and reference validation with 44/44 snippets verified against cached references.

  summary: 'Address review: symptom evidence, diagnosis, prevalence, inheritance'
  details: |
    Addressed all five blocking findings from the automated review. The first was a genuine error: the Exertional Dyspnea phenotype cited a snippet describing asymptomatic EVOLVED participants, which cannot support a dyspnea phenotype. Replaced with a source naming the symptom set explicitly, and added the same evidence plus an independent second source to Angina Pectoris and Syncope, both of which previously had no evidence block. Added a diagnosis block covering transthoracic echocardiography, exercise stress testing (EARLY TAVR: 15.2% of apparently asymptomatic severe stenosis patients had a positive treadmill test), and cardiac magnetic resonance with late gadolinium enhancement. Added a structured prevalence record for the worldwide case count and two new epidemiology entries for mortality and the rising global burden. Added an inheritance block scoped deliberately to the NOTCH1 autosomal-dominant arm, with the scoping justified in the description because the disease as a whole is acquired and non-Mendelian. Two NCIT identifiers were initially written from memory and were both wrong; the term validator caught them and they were replaced with OAK-verified terms. Validated: schema OK, terms OK, snippet-length and folded-hyphen lints clean, 59/59 snippets verified against cached references.

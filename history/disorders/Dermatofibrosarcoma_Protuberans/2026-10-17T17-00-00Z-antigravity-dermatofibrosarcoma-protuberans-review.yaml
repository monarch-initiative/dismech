  summary: >-
    Enrich Dermatofibrosarcoma Protuberans with top-level synonyms, sporadic
    inheritance, annual incidence prevalence, progression, COL1A1-PDGFB/PDGFRB
    pathophysiology grounding, diagnostic procedures, and Fibrosarcoma
    differential diagnosis.
  details: >-
    Added top-level synonyms, sporadic inheritance (HP:0003745), annual
    incidence prevalence (0.8-5 cases per million per year with
    POPULATION_PER_YEAR denominator), clinical progression, diagnostic
    procedures (skin biopsy, CD34 IHC, COL1A1-PDGFB FISH/RT-PCR), and the
    Fibrosarcoma (MONDO:0005161) differential diagnosis; grounded COL1A1
    (hgnc:2197), PDGFB (hgnc:8800), and PDGFRB (hgnc:8804) in pathophysiology
    and genetic sections with somatic gain-of-function genetic_context, cell
    types (CL:0002551), locations (UBERON:0002067, UBERON:0002190), molecular
    functions (GO:0008083, GO:0005019), and downstream phenotype edges;
    replaced ungrounded Local Recurrence with Fibrosarcoma (HP:0100244); and
    populated evidence_source and REVIEW_SYNTHESIS quote_role fields while
    omitting unverified FS-DFSP frequency claims, uncited differentials, and
    clinical_trials entries without NCT identifiers.

  summary: 'Dermatofibrosarcoma_Protuberans: add soft tissue perineurioma as a differential
    diagnosis'
  details: >-
    Added soft tissue perineurioma as a differential diagnosis of dermatofibrosarcoma protuberans,
    bound to MONDO:0015031 extraneural perineurioma, with nine evidence items: a 2002 marker study's
    background sentence on perineurioma as a benign soft tissue tumor with a perineurial
    immunophenotype, its comparison of 12 perineuriomas (selected as EMA-positive and
    S-100-negative) with tumors in their differential diagnosis, seven DFSPs among them, its finding
    of claudin-1 in 11 of the perineuriomas and in none of the DFSPs, and its authors' view that
    claudin-1 may be a useful adjunct to EMA in difficult cases (PMID:12459629); a 2026 study's
    background statements that conventional and sclerosing perineuriomas overlap histologically with
    DFSP and that EMA lacks specificity (PMID:43020433); the 81-case soft tissue series, in which
    claudin-1 was positive in only 22 of 76 tumors (PMID:15958848); and a background statement that
    CD34 is common in both (PMID:24030747). Quotes shared with the Perineurioma entry keep its
    grading, and the new prose uses this entry's American spelling. One new reference cache file,
    and one row added to the disease-term enum cache. The Perineurioma entry has no DFSP row: its
    low-grade fibromyxoid sarcoma row notes that its sources gave no distinguishing features for
    DFSP, and this marker study now supplies a partial one. just validate, validate-terms and
    count-verified-snippets pass.

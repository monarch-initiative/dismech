  summary: 'Review fix: model adaptive-immunity dimension; split bundled prodrome'
  details: |
    Addresses two IMPORTANT review findings on PR #9260. The entry asserted host-determined severity without modelling the mechanism behind it; the inflammatory central-effector node now carries T cell and B cell types and GO:0002250 adaptive immune response, cited to PMID:29844218. Deliberately stopped short of curating a specific CD8 or NK cytotoxic effector mechanism: only the abstract of that review is cached and it does not state one in quotable form, and the review itself says how HAV is controlled by B and T cell immunity cannot yet be adequately explained. Recorded that as a KNOWLEDGE_GAP attached to both the inflammatory and severity-modulation nodes rather than asserting more than the evidence supports. Separately split 'Constitutional Prodrome', which bundled dark urine under HP:0001945 Fever, into the constitutional phenotype plus a distinct Dark Urine phenotype on HP:0040319, since bilirubinuria is a cholestatic marker rather than a constitutional symptom. Supportive Care modality changed from BEHAVIORAL to OTHER. Validation: schema, terms and snippets clean.

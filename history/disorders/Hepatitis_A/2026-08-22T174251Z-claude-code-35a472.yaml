  summary: 'Create: Hepatitis A'
  details: |
    New entry completing the viral hepatitis series alongside the existing Hepatitis_B and Hepatitis_C entries. Five nodes: faecal-oral acquisition and hepatocyte infection -> acute hepatic inflammatory reaction (central_effector) -> host-factor-dependent severity modulation, branching to a prolonged/relapsing/fulminant course and to spontaneous resolution with lifelong immunity. The entry deliberately curates the absence of a chronic arm as a positive finding, citing PMID:34652109 stating that chronic infection and chronic liver disease do not occur - the guardrail that distinguishes HAV from every other hepatotropic virus. Severity is curated as host-determined rather than viral, and vaccination is linked as INHIBITS on the trigger node with population-level incidence reduction as evidence, i.e. prevention of infection rather than attenuation of disease. Validation: linkml-validate clean; linkml-term-validator passed; 18/18 evidence snippets verified against cached references.

  details: |
    Addressed review on PR 16669. CRITICAL fix: the entry wrongly said a single patient; the cached ClinGen record documents three nonsense variants in three probands across three publications (PMIDs 22231303, 27742395, 28903942). Rewrote description, inheritance, genetic features and notes to say three probands, citing the ClinGen evidence-summary sentence; added the two later publications to top-level references. The two later abstracts are not retrievable (fetch returned content unavailable), so their specific alleles are not written as variant rows and their patient details are cited via the ClinGen summary, which is noted. Added phenotypes from Lanzi full text and ClinGen: CD8-predominant T-cell lymphopenia (HP:5210426), bloody diarrhoea (HP:0025085), and normal platelet volume on the thrombocytopenia node (distinguishing WIP deficiency from WAS microthrombocytopenia); all wired from the actin-remodeling node. Added an immunoglobulin-replacement/anti-infective-prophylaxis supportive treatment (NCIT:C121331) from the Lanzi supportive-care sentence; the report's suggested NCIT:C62016 was wrong (an ECG term) and was not used. Added mouse colitis/interstitial pneumonitis to the WIP-knockout model description (ClinGen). Human pneumonitis was left unbound because HP only offers over-specific interstitial terms while ClinGen states it generically. Revalidated: just validate passed, 29/29 snippets, entity-ref/causal-target/gene-validity/gene-grounding/snippet-grading all OK.

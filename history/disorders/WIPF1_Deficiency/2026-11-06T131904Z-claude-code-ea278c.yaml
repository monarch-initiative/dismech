  summary: 'Create: WIPF1_Deficiency'
  details: |
    New entry for WIPF1 deficiency / Wiskott-Aldrich syndrome 2 (MONDO:0013779), claimed in issue 14001. Curated as a standalone AR Disease: single gene (WIPF1), leaf MONDO term, distinct from the X-linked WAS entry already in kb (different gene). Deep research: one Perplexity report via the merged async transport (quota restored); report resolved 3/3 references and was on-topic, but flagged ~10 mislabelled CURIEs, so every term was verified in OLS independently. Evidence rests on the single founding patient (Lanzi 2012, PMID:22231303), the WIP-knockout/in-vitro WASP-stabilization mechanism (de la Fuente 2007, PMID:17213309), and the ClinGen Definitive AR assertion. Pathograph: WIP loss -> WASP degradation (normal WAS mRNA; rescued by WIP reintroduction) -> defective actin remodeling -> WAS phenotype (recurrent infections, eczema, thrombocytopenia, abnormal T-cell proliferation, abnormal NK physiology). Treatment: allogeneic HCT (the patient had cord blood transplant). Stub deleted. Validated with just validate and the whole-repo gates.

  summary: Replace CRTAP bowing quote with LEPRE1 cohort evidence, refine P3H1 GO
    bindings, unbundle 5-node collagen/bone pathograph, qualify pamidronate and white
    sclerae claims, and drop deprecated percentage fields
  details: |
    Replaced the Proband 3 CRTAP snippet on Bowing of the Long Bones (HP:0006487) with LEPRE1-specific cohort evidence from PMID:24498616 (all 44 individuals had short bowed limbs and multiple fractures) and PMID:18566967. Upgraded GO bindings to procollagen-proline 3-dioxygenase activity (GO:0019797) and peptidyl-proline hydroxylation to 3-hydroxy-L-proline (GO:0018400), and unbundled pathophysiology into five nodes separating Pro986 3-hydroxylation loss, delayed folding/overmodification, abnormal fibril and bone matrix architecture (local hypermineralization alongside focal osteoid), and whole-bone osteopenia/skeletal fragility. Qualified Bisphosphonate Therapy efficacy with the full PMID:18566967 uncertainty quote, softened white-sclerae prose and added PMID:18566967 REFUTE evidence, removed deprecated percentage fields from prevalence, replaced methods quotes on Sclerostin-Neutralizing Antibody with uCT/biomechanical result quotes (PMID:26716893), and added top-level notes documenting the absence of a P3H1-specific GeneReviews chapter.

  summary: Repaired unevidenced physical therapy and unstructured prevalence, grounded
    P3H1 pathophysiology, wired 12 phenotypes, and tagged GeneReviews
  details: |
    Added MONDO and P3H1/LEPRE1 synonyms, Harrison's chapters and collagenopathy classification, and split prevalence into structured CARRIER_FREQUENCY and BIRTH_PREVALENCE records for West Africa and Mid-Atlantic African Americans (PMID:22281939). Grounded pathophysiology with biological_scale, P3H1 (hgnc:19316), 2-oxoglutarate-dependent dioxygenase activity (GO:0016706), endoplasmic reticulum (GO:0005783), bone tissue/element locations, quote_role annotations, histomorphometric primary-result evidence (PMID:27383115), and bare-name downstream edges to all 12 phenotypes. Expanded phenotypes from 5 to 12 (adding Bowing of the long bones, Metaphyseal widening, Popcorn epiphyses, Multiple rib fractures, Decreased calvarial ossification, Respiratory insufficiency, and absent Blue sclerae for white sclerae), enriched genetic with CAUSATIVE/GERMLINE and PMID:24498616 allelic series, repaired empty evidence on Physical Therapy and Rehabilitation using PMID:20301472 (tagged GeneReviews), and added pamidronate therapeutic_agent, target_mechanisms, and Genetic Counseling.

  summary: 'Genetics pass: re-anchor disease_term to the PTRH2 class, route the YARS1
    sibling to a stub'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:8000012 IMNEPD1 / PTRH2 and MONDO:0030375 IMNEPD2 / YARS1). Neither CURIE
    appeared anywhere in kb/ before this change.

    Anchor finding, and the substantive change here. The entry was bound to
    MONDO:0024189, the two-member series parent, which asserts no causal gene of its
    own - while the entry's own scope note already said "This is IMNEPD1, the PTRH2
    form." MONDO:8000012 is the PTRH2 leaf: hgnc:24265 in its logical axioms, xrefs
    OMIM:616263 and Orphanet:456312, and "IMNEPD" among its synonyms. `disease_term`
    was rebound to it and MONDO:0024189 recorded as `skos:broadMatch`.

    Rows. The rebinding curates MONDO:8000012. MONDO:0030375 is declined and routed
    to a new curation stub,
    stubs/Neurologic_Endocrine_And_Pancreatic_Disease_Multisystem_Infantile-onset_2.yaml.
    YARS1 encodes cytoplasmic tyrosyl-tRNA synthetase, so its lesion is impaired
    aminoacylation rather than anything in the peptidyl-tRNA hydrolase or
    adhesion-survival machinery this entry models; it has a GeneReviews chapter of its
    own titled "YARS1 Deficiency"; and a seven-child consanguineous series
    (PMID:30304524) shows its p.Pro167Thr allele is hypomorphic in yeast
    complementation and homodimerizes poorly in HEK cells. Every phenotype frequency
    in this entry comes from PTRH2 cohorts, so extending the entry to cover YARS1
    disease would attribute those denominators to a different gene.

    Wiring. Gene-to-mechanism coverage was already 1/1 and is unchanged. Phenotype
    causal inlink is 15/17 before and after: the two unconnected phenotypes,
    Abnormality of the hand and Abnormality of the face, now carry a `notes:` field
    recording that no incoming edge is asserted because the cohort source counts the
    features without attributing them to a mechanism and no node in this entry
    reaches a skeletal lesion.

    Two new reference caches are committed, PMID_30304524.md and PMID_40608960.md,
    both cited in the stub's reasoning. The GeneReviews chapter's PMID is deliberately
    not cited in this entry, because it is the sibling disease's baseline and not
    this one's. Validation on the committed tree: `just validate` clean,
    `just validate-terms` clean, 52 snippets verified in this file, within a 643/643
    verification across the ten files this PR touches.

  summary: 'Review round 2: folded-hyphen CI fix, motor delay wired, variant evidence'
  details: |
    Addressed the round-2 CHANGES_REQUESTED review on PR #12069, and the CI failure that preceded it. Blocking finding 1: check-folded-hyphens went red because the family-testing snippet quoted across the cached PDF's own line break, where 'recurrence' is hyphenated; a folded YAML scalar turns that break into a space, so the stored quote read 'recur- rence'. Replaced with the clean second half of the same clause, with the reason recorded in the evidence explanation. The root cause was process: I did not run the whole-KB gate set before the round-1 push. Blocking finding 2: the notes claimed two deliberately unwired phenotypes while list-disconnected-phenotypes reported three isolated nodes; the third, Motor delay, was an oversight and is now wired from Post-Mitotic Cell Attrition Outside the Cerebellum alongside its already-wired siblings, taking the entry to 15/17 connected. Suggestion 3: the vitamin treatment's preferred_term no longer echoes its broader NCIT:C15433 label and reads 'lipophilic vitamin substitution'. Suggestion 4: the valproate-avoidance treatment is therapeutic_modality OTHER rather than BEHAVIORAL, which describes patient behaviour rather than a prescribing constraint. Suggestion 5: the attrition node is rescaled ORGANISM to CELLULAR. Suggestion 6: both alleles now carry their own evidence, the frameshift from PMID:25574476 and the p.Gln85Pro protein-versus-mRNA measurement from PMID:27129381 graded IN_VITRO. PMID:25558065 was fetched and deliberately not cited: it is abstract-only and names PTRH2 only inside a 33-gene list, so it cannot substantiate the variant claim; the notes record that. One self-caught error while writing this round: I composed a reference_title for PMID:27129381 from memory rather than copying the cached title, and corrected it before validating. Validation: just validate clean, 52/52 snippets verified, and the full CI offline gate list run locally.

  summary: 'Review round 1: curate the cohort percentages the full-text cache held
    all along'
  details: |
    Addresses the CHANGES_REQUESTED review on PR 12069. The blocking finding was correct and the error was mine: I wrote that the 2024 cohort update's phenotype percentages were 'not in that paper's abstract, which is what the reference cache holds', without checking the cache file's own content_type field. references_cache/PMID_39766776.md is content_type: full_text_xml, six of the entry's seven caches are full text, and validate-kb-references matches full text where present. Every percentage was in the committed cache with per-phenotype denominators. Changes: all thirteen measured frequencies are now curated from quoted full-text sentences; two phenotypes above 50% that the draft omitted were added (hand deformity 18/31, deformity of the head and face 16/30), each quoted with its table row and denominator; five previously bandless phenotypes got bands (cerebellar atrophy FREQUENT, diabetes FREQUENT, exocrine pancreatic insufficiency FREQUENT, hypothyroidism OCCASIONAL, liver abnormality OCCASIONAL); and two bands were corrected downward, hearing impairment 78.12% and ataxia ~77% from VERY_FREQUENT to FREQUENT, because the draft had read the source's qualitative 'most common' grouping as implying 80% or above. Three further phenotypes were added from the case series (epileptic seizures, developmental regression, severe speech delay), each without a band because the cohort table does not count them. The supportive-care treatment's snippet quoted a sentence about how the diagnosis was reached rather than about management and was replaced with the management sentence plus the family-testing sentence. Two treatments were added: avoidance of valproic acid, a genotype-driven contraindication because IMNEPD is a mitochondrial cytopathy, and lipophilic vitamin substitution, the only intervention in the entry with a reported outcome. Pathograph connectivity was repaired: the extracerebellar attrition node had nine outgoing edges and no inbound edge, so it now takes edges from the mTOR node and from the adhesion node, which also stops the adhesion node being a dead end, and the previously unevidenced PTRH2-to-adhesion edge carries evidence. PMID:31057140 was added to the top-level references block. Hand and face deformity are deliberately left causally unwired, with the reason recorded in notes: a dysmorphism is a morphogenesis phenotype and the node above them claims post-mitotic cell attrition. Validation after the round: just validate 50/50 snippets verified, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms all clean.

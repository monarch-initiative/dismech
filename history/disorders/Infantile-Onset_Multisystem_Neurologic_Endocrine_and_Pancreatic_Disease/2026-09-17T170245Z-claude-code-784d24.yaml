  summary: 'Create: Infantile-Onset_Multisystem_Neurologic_Endocrine_and_Pancreatic_Disease
    (MONDO:0024189, PTRH2)'
  details: |
    De novo curation of MONDO:0024189, IMNEPD1, biallelic PTRH2. Deep research: one OpenScientist run, reference validation 11/11 resolved. preflight-dr returned SKIP because MONDO records no causal gene and no OMIM xref for this term; manual fallback used the report's gene counts (PTRH2 46 mentions vs MFN1/FKBP8 7, KIF1A 5) and its OMIM 616263. Two deliberate restraints are recorded in the entry notes. First, the report tabulates numeric phenotype frequencies (motor delay 94 percent, neuropathy 89 percent, intellectual disability 87.5 percent and so on) attributed to the 2024 cohort update; those numbers are not in that paper's abstract, which is what the reference cache holds and what snippet validation can check, so none was curated. The abstract's qualitative ranking of six features as most common is what the VERY_FREQUENT bands rest on, and the endocrine and pancreatic features the disease is named after carry no band as a result. Second, the run's term validation flagged three NCIT identifiers whose labels name unrelated concepts (C158477 offered as Pancreatic Enzyme Replacement but named 5/10 HLA Match; C29099 as Levothyroxine but named Hydrocodone Bitartrate; C99277 as Cochlear Implant but named FUS/ATF1 Fusion Gene). None is bound, so the entry carries one generic supportive-care treatment rather than three specific ones. The cerebellar mechanism comes from the Purkinje-cell conditional knockout (PMID:36219306) and is curated as an animal_models link; every extracerebellar edge is INDIRECT_UNKNOWN_INTERMEDIATES and the reason is recorded as a HUMAN_MODEL_MISMATCH discussion, since the constitutive knockout dies at postnatal day 14 and cannot express a phenotype that in patients takes years. No GeneReviews chapter exists; check-genereviews reports NO_CHAPTER, confirmed after synonyms were written rather than before. Validation: just validate 36/36 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys - all clean.

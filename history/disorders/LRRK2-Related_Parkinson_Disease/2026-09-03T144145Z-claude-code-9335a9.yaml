  summary: 'Create: LRRK2-Related Parkinson Disease (PARK8)'
  details: |
    De novo curation of LRRK2-related Parkinson disease / PARK8 (MONDO:0011764) from a Perplexity sonar-deep-research report plus the LRRK2 GeneReviews chapter (PMID:20301387). Causal chain: LRRK2 kinase gain of function (G2019S activates kinase 2-3x) -> Rab GTPase hyperphosphorylation with loss of Rab-GDI affinity -> autophagy-lysosomal dysfunction -> alpha-synuclein aggregation/Lewy pathology -> nigrostriatal dopaminergic neurodegeneration -> parkinsonism. Conforms to parkinsonism_dopaminergic_degeneration module at the alpha-synuclein and nigrostriatal nodes. Genetic block covers causative GOF LRRK2, Asian risk variants (G2385R/R1628P), and the protective N551K-R1398H-K1423K haplotype (PMID:23962496). 15/15 snippets verified (PMID:26824392 Steger, 15852371 Aasly, 32523507, 20301387). Corrected report errors: LRRK2 HGNC:18666->hgnc:18618 (18666 is RNPC3) and several unrelated inline PMIDs were refetched from correct sources. Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys.

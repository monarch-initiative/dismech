  summary: Review ESRRB hearing loss against full-text clinical, functional and dataset
    evidence
  details: |
    Full review of the existing entry against the Falcon research report and cited caches. Recovered the 2008 gene-discovery full text and refreshed the 2021 vestibular cache to include tables; manually inspected page 4/Table 2 of the published vestibular PDF. Corrected human vestibular evidence: normal caloric testing in two Turkish adults versus abnormal cVEMP with normal rotary-chair testing in the one pediatric ESRRB-associated case; supplementary variant details could not be recovered from the tested publisher/PMC/EuropePMC routes. Added absent otoacoustic emissions from the original Turkish family. Corrected dental claims using the complete 2014 full text: six affected homozygotes and four heterozygotes in the Turkish family had reported severe caries, but the affected Czech child was caries-free at age four. Histories were telephone-based; common-SNP/enamel experiments do not establish a DFNB35 mechanism and their reported p values exceed the specified multiple-testing threshold. The 2015 implantation full text identifies two ESRRB-associated good-outcome controls with CAP7/SIR5 selection, qualifying earlier claims of no outcome data; the missing image-only variant table could not be recovered through the DOI fetch. Read the 2024 functional results, discussion and methods and retained Arg382Cys as warm VUS; avoided interpreting nonsignificant reporter activation as zero residual activity or family-cell transcription as direct strial targeting. Corrected Gly167Arg and Tyr295Cys to the papers' likely-pathogenic classifications; added Asp245His-associated moderate-to-severe loss and the founding frameshift protein consequence. Read relevant family full texts (32681043,34194829,35101039), abstracts (21802533,22951369,33269433), and the TBX1 comparison. Split protein stability, secretory expression, partial cell-fate change, intermediate-cell response, capillary loss and secondary outer-hair-cell dysfunction; retain model and inference boundaries. No module conformance where the module additionally asserts oxidative stress, cell death and neural degeneration. The 2007 Chen/Nathans primary full text remained inaccessible after DOI, Cell, Elsevier and author-lab attempts; use its cached abstract and explicitly indirect summary from Collin 2008, without claiming no quantitative study exists. Verified GSE8434 (six mouse samples, GPL1261, linked PMID17765677) using NCBI E-utilities and just verify-datasets, generating GEO_GSE8434.md. General GeneReviews NBK1434 supports management/counseling and is tagged; no ESRRB/DFNB35-specific trial found in ClinicalTrials.gov API search on 2026-09-27. Research checklist: phenotype, mechanism, genetics, management, diagnostics and reference gaps corrected; no established subtypes or disease-specific trial omission. No unsupported direct neural mechanism inferred from rodent expression. Initial schema/ontology/reference and causal/entity/coarse/source-defect/boundary checks pass; final dataset/history/precommit checks recorded with the PR.

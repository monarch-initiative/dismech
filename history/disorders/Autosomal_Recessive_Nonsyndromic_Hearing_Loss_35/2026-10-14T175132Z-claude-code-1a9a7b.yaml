  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing genetic-testing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: most reported patients fall at the severe-to-profound end, which spans the WHO/GBD Severe/Profound boundary, and the Korean proband's asymmetric, progressive pattern (moderate in one ear, severe-to-profound in the other, deteriorating over seventeen years of follow-up) shows severity is not fixed at presentation in every patient.

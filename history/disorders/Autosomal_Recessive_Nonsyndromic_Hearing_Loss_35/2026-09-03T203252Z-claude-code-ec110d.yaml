  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 35 (DFNB35, ESRRB)'
  details: |
    New Disease entry for MONDO:0012060 (DFNB35, biallelic ESRRB). entry_type decision: DISEASE - a single-gene recessive disorder with one conserved pathograph (ESRRB loss of function -> reduced ERR-beta transcriptional output -> failure of the strial marginal cell secretory programme -> cochlear lateral wall failure -> bilateral sensorineural hearing loss), mechanistically distinct from the hair-cell and stereocilium lesions of the other DFNB entries, so not folded in as a subtype. Stub deleted.

    Mechanism anchored on Chen and Nathans (PMID:17765677), which places ERR-beta in strial marginal cells and vestibular dark cells and reports the Nr3b2-null cell-fate defect, plus the 2024 Korean functional study (PMID:39261511), which supplies the only measurements made in human material (minigene exon-4 skipping with NMD, cycloheximide-chase protein destabilisation, abolished SMAD7 reporter activity, and reduced ATP1B1/EGR1/NRP1/TBX3/SPARC transcripts in patient lymphoblastoid cells).

    Discipline applied to the inferred step: no ESRRB mouse with an audiometric readout was found, so the step from failed strial secretion to an elevated threshold is left explicitly inferred - the tissue node is mechanism_confidence PROVISIONAL, the animal-model link for it is PARTIALLY_RECAPITULATES with the missing endolymph/EP/ABR measurements named in limitations, and a HUMAN_MODEL_MISMATCH discussion records the gap. The corroborating Tbx1 stria-vascularis deafness result (PMID:31550482) is carried on the edge with directness INDIRECT and an explanation stating it is a different gene.

    Also curated: the dental-caries finding (PMID:25023176) as an OCCASIONAL phenotype plus a modifier ameloblast node, with a KNOWLEDGE_GAP discussion arguing that nonsyndromic may be resting on nomenclature rather than data, since only two DFNB35 families have ever been examined for teeth. Deliberately not curated: progression, differential_diagnoses, any vestibular phenotype (a third discussion records that absence as untested), and datasets/clinical_trials/environmental.

    Deep research: falcon provider, preflight-dr PASS against MONDO:0012060 (ESRRB mentioned 51 times, top gene). The report contributed one reference not found by direct PubMed search (PMID:35101039, Iranian Azeri Turkish family, p.G167R), which was added.

    Validation: just validate, validate-terms, count-verified-snippets 58/58, validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens, check-stubs - all exit 0.

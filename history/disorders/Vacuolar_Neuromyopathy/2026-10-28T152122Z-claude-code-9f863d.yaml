  details: |
    New Disease entry for vacuolar neuromyopathy / PLIN4-related myopathy (MONDO:0011155, OMIM:601846). Lump/split: kept as its own Disease entry; no existing entry covered PLIN4, and MONDO:0014945 'myopathy, distal, with rimmed vacuoles' is the separate SQSTM1 disease. Deep research: falcon was requested but not configured (no EDISON_API_KEY); the run fell back to claude_code (research/Vacuolar_Neuromyopathy-deep-research-claude_code.md, 11/11 references resolved). Evidence was taken from the cached texts of the primary PLIN4 papers (Ruggieri 2020 PMID:32451610, Wang 2022 PMID:36151849, Maggi 2023 PMID:37145156, Llanso 2025 PMID:40693562, the 2025 duplication case PMID:41624901) plus the original 19p13 family reports (PMID:10489050, PMID:11039585, PMID:15236412). PMID:35499779 (Chinese families) cached with no quotable text after a forced refetch and is not cited. Pathograph: expansion -> perilipin-4 accumulation -> aggrephagy -> rimmed vacuoles -> myofiber atrophy -> weakness/fatty replacement phenotypes. PLIN4 has no GO molecular-function annotation; the gene node binds GO:0008289 lipid binding, supported by a 2026 perilipin review describing PLIN4 amphipathic-helix lipid binding. Whether the 1999 'vacuolar neuromyopathy' family carries the expansion is recorded as a knowledge gap. Validation: just validate, validate-terms, count-verified-snippets (70/70), entity refs, causal targets, duplicate keys, folded hyphens, snippet grading all clean; validate-disorders run before push.

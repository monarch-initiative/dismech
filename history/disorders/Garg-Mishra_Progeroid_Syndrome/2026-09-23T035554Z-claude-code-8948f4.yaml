  summary: 'Create: Garg-Mishra_Progeroid_Syndrome'
  details: >-
      New entry for MONDO:0957953 (TOMM7, OMIM:620601), taken from the stub queue
      (stub deleted). Deep research used the claude_code provider
      (research/Garg-Mishra_Progeroid_Syndrome-deep-research-claude_code.md). All 8
      of its references resolved. None of the terms its term validation flagged
      were bound: HP:0005440 (unresolved), GO:0006626 (obsolete), and the
      mislabelled NCIT:C1502, HP:0000238 and HP:0001635. The report missed the
      nine-patient Taiwanese P29L cohort (PMID:39615461), which a direct PubMed
      search found. Its Table 1 frequency rows are quoted as snippets for most
      phenotype frequencies. Also curated beyond the report: the zebrafish and
      mouse Tomm7-Rac1 cerebrovascular model (PMID:30354240) and the PINK1
      stabilization paper (PMID:24270810, cited only in notes). The Leigh syndrome
      splice-variant report (PMID:39333057) is recorded in the genetic notes as an
      unresolved allelic question and is not folded into the phenotype.

      A red-team subagent review before the PR led to these changes:
      - added cohort-backed phenotypes: ischemic stroke (a sequela of moyamoya),
        amblyopia, strabismus, optic atrophy, narrow chest, coxa valga,
        scoliosis, cardiomegaly, and death in childhood (unbound, because
        HP:0003819 is outside the PhenotypeTerm enum);
      - downgraded partial lipodystrophy to OCCASIONAL (1/8 in the cohort);
      - added a growth-plate chondrocyte hypoproliferation node (mouse
        histology) between uncoupling and growth failure;
      - regraded the Seahorse uncoupling snippet from mouse primary cells as
        IN_VITRO;
      - rebound hyperopia to HP:0008499 High hypermetropia;
      - split learning disability into mild intellectual disability and global
        developmental delay;
      - broadened the import GO term to GO:0070585;
      - split the zebrafish and mouse cerebrovascular models into separate
        records, marked PARTIALLY_RECAPITULATES;
      - retargeted GH therapy to short stature, with modality OTHER, because
        GH and IGF-1 were normal.

      Validation: just validate passes, and 75/75 snippets are verified. Also
      passing: check-entity-refs, check-causal-targets, check-enum-values,
      check-duplicate-keys, and the snippet-length, title and grading gates.
      check-genereviews reports NO_CHAPTER. 7 of 31 phenotypes are causally
      connected. The rest have no sourced upstream step and are left unwired
      rather than given invented edges.

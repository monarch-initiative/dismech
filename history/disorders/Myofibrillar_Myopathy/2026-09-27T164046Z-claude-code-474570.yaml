  summary: 'Genetics pass: add MFM2B and MFM12 subtype rows, wire HSPB8 onto the shared
    variant node'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0013472 fatal infantile hypertonic myofibrillar myopathy / CRYAB and
    MONDO:0859168 MFM12 / MYL2).

    Both rows were already dispositioned in prose, which is why a CURIE grep found
    them. MONDO:0013472 was discussed inside the MFM2 subtype description as the
    recessive infantile arm whose class the bound term does not cover; MONDO:0859168
    was named in the MFM11 description as a numbered series member "not separately
    modelled here". Neither was bound. That is the notes-prose blind spot recorded on
    dismech#12189, and it makes the rows real curation opportunities rather than
    spurious.

    Anchor test. MONDO:0018943 is correct and unchanged. All fourteen pre-existing
    subtype rows resolve inside it. Reading its thirteen children turned up one MONDO
    oddity reported in the PR rather than acted on: central core myopathy
    (MONDO:0007294) is asserted as a child of myofibrillar myopathy, which brings an
    RYR1 core myopathy into the subtree.

    Rows. MFM2B is now a `has_subtypes` row bound to MONDO:0013472 with CRYAB, citing
    three items from PMID:36727013 for the recessive inheritance, the clinical
    picture, and the biopsy showing the same desmin / alpha-crystallin / myotilin
    aggregate pathology as the rest of the group. MFM12 is now a row bound to
    MONDO:0859168 with MYL2, citing PMID:31127036 and PMID:27378946. Its description
    carries the caveat that matters: the reported skeletal histology is congenital
    fiber-type disproportion rather than Z-disc-initiated myofibrillar dissolution,
    and MYL2 is a thick-filament protein, so the MFM number is an OMIM series
    assignment rather than a demonstrated pathological match.

    MYL2 deliberately has no `genetic` record and no node binding. Every other gene
    here is bound on the Z-Disc and Chaperone Protein Variant node, and binding MYL2
    there would assert a Z-disc or chaperone lesion its sources do not report. The
    entry `notes:` records that decision.

    Wiring. Gene-to-mechanism coverage went 13/14 to 14/14 by adding HSPB8 to that
    node's `genes:` list, the one gene of the fourteen that was missing from it.
    Phenotype causal inlink was already 19/19 and is unchanged.

    Two stale sentences were repaired: the MFM11 description said MFM12 was not
    modelled here, and the MFM2 description described its bound term as covering only
    the dominant arm without pointing at the new recessive row.

    Two new reference caches are committed, PMID_36727013.md and PMID_31127036.md;
    PMID_27378946.md was already committed and was not re-fetched. Validation on the
    committed tree: `just validate` clean, `just validate-terms` clean, 146 snippets
    verified in this file, within a 643/643 verification across the ten files this PR
    touches.

  summary: 'Create: Myofibrillar_Myopathy'
  details: |
    De-novo curation of Myofibrillar Myopathy (MONDO:0018943) as an umbrella Disease with 13 has_subtypes covering MFM1-MFM11 plus FHL1- and DNAJB6-related forms. Deep research provider: Edison/Falcon (research/Myofibrillar_Myopathy-deep-research-falcon.md; 488 s, 24 citations, 1 artifact), treated as leads only and independently verified. GeneReviews baseline mined: PMID:20301672 (Myofibrillar Myopathy overview, retired chapter) and PMID:24575448 (HMERF), both tagged GeneReviews in top-level references; the Clinical Characteristics frequencies (distal weakness about 80 percent, peripheral neuropathy about 20 percent, overt cardiomyopathy 15-30 percent) and the Management and strengthening-exercise caveat were transcribed into phenotypes and treatments. Every gene-to-MFM-number assignment was verified independently against the MONDO term definition, the OMIM phenotype MIM number and NCBI mim2gene_medgen rather than taken from the task brief: DES/MFM1, CRYAB/MFM2, MYOT/MFM3, LDB3/MFM4, FLNC/MFM5, BAG3/MFM6, KY/MFM7, PYROXD1/MFM8, TTN/MFM9 HMERF, SVIL/MFM10, UNC45B/MFM11; MYL2/MFM12 and HSPB8/MFM13 are noted but not separately modelled. The pathograph has 8 nodes, all carrying role and biological_scale, including an explicit chaperone-assisted selective autophagy node and a cardiomyocyte node declaring conforms_to cardiomyopathy_maladaptive_remodeling hash Primary Cardiomyocyte Insult. Four structured differential diagnoses carry bound MONDO disease_term values: limb-girdle muscular dystrophy, inclusion body myositis, distal myopathy and Pompe disease. Validation: just validate passes schema, term and reference checks with 105 of 106 snippets verified against cached abstracts; phenotype connectivity 16/16 and gene-to-mechanism wiring 13/13 at 100 percent; compliance 87.0 percent global and 87.2 percent weighted. Falcon emitted several semantically-wrong-but-valid ontology IDs that OAK checks caught and that were NOT used: HP:0003795 offered for rimmed vacuoles is Short middle phalanx of toe; GO:0061702 offered for protein-containing aggregate is canonical inflammasome complex; NCIT:C15313 offered for Physical Therapy is Radiation Therapy; GO:0061919 offered for selective autophagy is the broader process utilizing autophagic mechanism. GO:0051082 unfolded protein binding was rejected as obsolete and replaced with GO:0140662.

  summary: Curate MFM13 (HSPB8) as a has_subtypes row binding MONDO:0976133
  details: |
    Resolved claim issue #11471 (myopathy, myofibrillar, 13, with rimmed vacuoles; MONDO:0976133) as entry_type SUBTYPE rather than a standalone kb/disorders/ file.

    Decision. MFM13 is the thirteenth member of the OMIM myofibrillar-myopathy series, and MFM1 through MFM11 are already curated as has_subtypes rows on this entry, each binding its own MONDO subtype_term. This entry's own MFM11 description already named MONDO:0976133 in prose and recorded it as not separately modelled here, so the umbrella had considered the entity without binding it. Adding the row is the consistent placement and it binds the MONDO ID, which is what lets the stub be retired.

    Gene. HSPB8 (hgnc:30171), from the stub genes block, confirmed independently against the ClinGen gene-disease validity table shipped in data/clingen/gene_validity.csv (HSPB8 / HGNC:30171 / neuronopathy, distal hereditary motor, autosomal dominant / Definitive) and against PMID:41426051, which states the HSPB8 myopathy phenotype is the entity OMIM numbers as myofibrillar myopathy 13 with rimmed vacuoles.

    Pleiotropy handled explicitly. HSPB8 also causes dHMN2A (curated as Distal_Hereditary_Motor_Neuronopathy_Type_2A, MONDO:0008025) and CMT2L, and the K141 hot spot is shared between the neuropathic and myopathic poles. The subtype description says so rather than implying MFM13 renames the neuropathy.

    Evidence. Five evidence items on the subtype row (PMID:41426051 identity anchor; PMID:26718575 gene discovery and MFM placement; PMID:31403083 independent C-terminal frameshift family; PMID:32165108 myopathy without neuropathy) and two on a new genetic HSPB8 block (PMID:26718575 human; PMID:28780615 knock-in/knock-out mouse for the toxic gain-of-function reading, graded MODEL_ORGANISM). All snippets are exact substrings of the cached references.

    Validation. just validate (141/141 snippets verified; no DOI references in this file, so nothing is skipped by prefix), just validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, check-stubs, and the whole-KB check-title-snippets / check-snippet-length / check-snippet-grading. No new pathophysiology nodes or causal edges were added, so there is no orphan-target exposure from this change.

    No deep-research report was run. The literature for this entity is small and specific (five primary sources plus a mouse model), and a provider report for an obscure numbered myopathy carries a substitution risk that would have cost more to gate than the sources cost to read directly.

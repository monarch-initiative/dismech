  summary: 'Apply reviewer suggestions on PR #11270: Blastic Plasmacytoid Dendritic
    Cell Neoplasm'
  details: |
    PR #11270 was approved with no blocking findings and eight non-blocking
    suggestions. Six were taken, one was taken in part, one was declined.
    Bundled into a single push because main runs dismiss_stale_reviews, so a
    push costs a full re-review cycle whatever its size.

    TAKEN
    - The 9p21.3 node was named "CDKN2A and CDKN2B Deletion" and described the
      loss of both, but `genes` bound only CDKN2A. Added hgnc:1788.
    - Added `genetic` entries for the CDKN2A/CDKN2B deletion and for MYC. The
      reviewer's point was an internal inconsistency rather than a scope
      boundary: the NR3C1 deletion was already in `genetic`, so excluding the
      other copy-number lesions was arbitrary. `gene_term` is single-valued, so
      the CDKN2A/B entry carries CDKN2A and says so in `notes`.
    - Curated MYC 8q24 rearrangement rather than deferring it with a note. Two
      new references: PMID:29407586 (5 of 41, 12%, in a single-institution
      series) and PMID:32336417 (about a third, most often partnered with 6p21
      RUNX2, associated with immunoblastoid cytomorphology). Both estimates are
      recorded rather than averaged, and the entry states that the ~40% figure
      the deep-research report gave is supported by neither primary source.
    - Rebound two treatments off generic Pharmacotherapy: the CAR-T entry to
      NCIT:C126102 Chimeric Antigen Receptor T-Cell Therapy, the antibody entry
      to NCIT:C15262 Immunotherapy, with NCIT:C184834 Pivekimab Sunirine added
      as its therapeutic_agent so IMGN632 is machine-queryable rather than
      only named in prose.
    - Added `target_mechanisms` to allogeneic HCT and intensive induction
      chemotherapy. These are the two interventions with the largest survival
      effect and were the only treatments not joining the pathograph. The
      allograft link is the interesting one: it targets both the expanded
      clone and the premalignant progenitor node, because unlike every
      pharmacological agent here it can remove the founder clone itself.

    TAKEN IN PART
    - The reviewer noted that the evidence on Marrow Failure Cytopenias is
      indirect (it establishes marrow involvement as a survival risk factor,
      not that cytopenias occur) and load-bearing for three phenotypes that
      carry none of their own. Correct. No cohort reporting anaemia,
      thrombocytopenia and neutropenia frequencies in BPDCN was found in this
      session, so instead of manufacturing support the explanation now states
      exactly what the quote does and does not establish, and the Anemia
      phenotype was given its own evidence from the German-language case
      report. Thrombocytopenia and Neutropenia remain uncited; that is the
      honest state.

    DECLINED
    - Adding a downstream edge from Glucocorticoid Resistance. There is no
      treatment-response node for it to point at, and inventing one to avoid a
      terminal leaf would assert a relationship no source supports. Terminal
      leaves are legitimate in this graph: Marrow Failure Cytopenias, CNS
      Infiltration and T Cell Exhaustion are all terminal for the same reason.
      Reported on the PR rather than silently skipped.

    NOT ACTED ON
    - The reviewer noted that cache/ncit/terms.csv still carries a row for the
      superseded NCIT:C39273 binding and said it should not be hand-cleaned.
      Agreed and left alone: those files are derived, and hand-editing them is
      forbidden by CLAUDE.md.

    VALIDATION
    - `just validate-disorders`: passed, 110/110 snippets verified (was 104).
    - `just validate`: schema, term and reference validation all passed.
    - entity-ref, causal-target, duplicate-key, qualifier-term and enum-value
      checks: all OK. 24 pathophysiology nodes, no orphans.
    - whole-KB title-snippet, snippet-grading, snippet-length, folded-hyphen
      and environmental-evidence gates: no new violations, no baseline touched.
    - cache/ diff is two added rows, zero deletions.
    - Every reference_title in this round was derived programmatically from
      references_cache frontmatter, not typed.

  summary: 'Create: Blastic Plasmacytoid Dendritic Cell Neoplasm'
  details: |
    De-novo creation of kb/disorders/Blastic_Plasmacytoid_Dendritic_Cell_Neoplasm.yaml,
    curating MONDO:0019467 under its current clinical name rather than the
    WHO-2001-era MONDO label "CD4+/CD56+ hematodermic neoplasm". Claimed via
    issue #11265; stubs/CD4_CD56_Hematodermic_Neoplasm.yaml deleted in the
    same change.

    DEEP RESEARCH
    One provider was used, as requested: `claude_code`
    (research/Blastic_Plasmacytoid_Dendritic_Cell_Neoplasm-deep-research-claude_code.md,
    18 web searches over 22 turns, 44 citations, models
    claude-haiku-4-5-20251001 + claude-sonnet-5). No fallback was needed. The
    report was generated before the recipes emitted validation frontmatter, so
    both `just validate-research-reference` and `just validate-research-terms`
    were run against it and their sections committed with the report.

    Reference validation: 28/28 resolved, 0 unresolved, 0 off topic.
    Term validation: 25/28 resolved, 0 unresolved, 2 obsolete, 1 mislabelled.
    The mislabelled one mattered - the report offered HP:0031969 for "Skin
    nodule", which HPO calls *Reduced blood urea nitrogen*. It was not bound;
    HP:0200036 (Skin nodule) is used instead. The two obsolete GO terms it
    suggested (GO:0016575, GO:0006306) were likewise not bound.

    WHAT WAS CURATED
    Sixteen pathophysiology nodes wired as a causal chain rather than a list:
    founder epigenetic-regulator loss (TET2/ASXL1) in a marrow progenitor ->
    pDC differentiation block (with ZRSR2, IKZF1 and MYB lesions entering as
    parallel upstream inputs) -> TCF4/BRD4 super-enhancer addiction -> CD123
    overexpression and BCL2-dependent apoptosis resistance -> clonal expansion
    -> cutaneous, marrow/leukemic and CNS compartments. Ten phenotypes, six
    genetic drivers, two histopathology findings, three diagnostic modalities,
    seven treatments (tagraxofusp, venetoclax, alloHCT, intrathecal CNS
    prophylaxis, BET inhibition, CD123-directed cellular/bispecific agents),
    prevalence, three epidemiology records, two progression phases, the
    pivotal trial NCT02113982, two experimental models, one animal model, one
    environmental exposure and two discussions.

    A FINDING THE REPORT DID NOT SURFACE
    `just discover-datasets` returned geo:GSE227690, whose GEO summary is the
    abstract of PMID:37286599 (Nature 2023) - a paper the deep-research report
    never cited. It settles a question the entry had initially recorded as
    open: BPDCN arises from clonal premalignant precursors in the *bone
    marrow*; skin tumours appear first at sun-exposed sites carrying clonally
    expanded UV mutational signatures; UV damage precedes the transformation
    events; and Tet2 loss confers UV-death resistance in plasmacytoid but not
    conventional dendritic cells. That produced a new pathophysiology node
    (UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin),
    an `environmental:` entry bound to ECTO:0000006 with a PREDISPOSES
    mechanism link, and a rewritten cutaneous-tropism KNOWLEDGE_GAP that now
    contrasts the UV account against the IKZF1-adhesion account instead of
    calling both untested.

    JUDGMENT CALLS
    - C1/C2 transcriptomic subgroups (PMID:35788129) were NOT curated as
      has_subtypes. They are one cohort's hierarchical clustering with no
      established therapeutic or diagnostic consequence; promoting them would
      assert a stability the source does not claim. Recorded in `notes`.
    - Two disagreeing survival estimates are both curated, as separate
      `progression` phases: 12-24 months median OS from institutional/trial
      series versus 43.9% five-year OS from SEER (PMID:37251924, mean age 53.7
      vs a seventh-decade median elsewhere). The cohorts differ in
      ascertainment and treatment era; averaging them would manufacture a
      number neither source supports.
    - tagraxofusp is recorded as therapeutic_modality PROTEIN_REPLACEMENT
      because that is the only TherapeuticModalityEnum value covering a
      recombinant protein therapeutic. It is a fusion toxin, not a
      replacement. Flagged in `notes` as a vocabulary gap, not a claim.
    - geo:GSE261411 was offered by dataset discovery and deliberately declined:
      it profiles K562, a CML comparator line from the same publication, not
      BPDCN material. Recorded in the geo:GSE261534 `notes`.
    - GATA2-deficiency predisposition, diphthamide-pathway methylation and
      TXNRD1 as tagraxofusp-resistance mechanisms, and a candidate PLD4
      biomarker were all in the report and all left out: the GATA2 material is
      about GATA2 deficiency rather than BPDCN, and the resistance/biomarker
      claims trace to sources this session did not verify.

    GENEREVIEWS
    Searched and absent, as expected for a somatic clonal neoplasm. PubMed
    `blastic plasmacytoid dendritic cell neoplasm GeneReviews[All Fields]`
    returned 0 records. No baseline to cross-reference.


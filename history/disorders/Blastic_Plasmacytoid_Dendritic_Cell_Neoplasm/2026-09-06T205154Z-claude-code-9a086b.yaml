  summary: 'Address pre-PR red-team review: Blastic Plasmacytoid Dendritic Cell Neoplasm'
  details: |
    Second round on the same session's entry, applying a pre-PR adversarial
    review run with the dismech-pr-review skill in a fresh-context subagent.
    Every quote and every suggested ontology term the reviewer proposed was
    re-checked against the caches and OLS before being acted on; all of them
    held up.

    EVIDENCE INTEGRITY
    - BCL2/venetoclax dependence regraded HUMAN_CLINICAL -> IN_VITRO. The
      source calls it "ex vivo functional assessment of primary tumor tissue";
      BH3 profiling of explanted cells is not a human clinical study.
    - The cutaneous-phenotype snippet was truncated just before "(in ~90% of
      cases)", so the VERY_FREQUENT tag and the "near-universal" explanation
      rested on text left outside the quotation marks. Extended.
    - The SEER multivariate explanation said one factor survived adjustment.
      Three did: age adversely, second primary malignancies and radiotherapy
      favourably. Snippet and explanation both corrected.
    - `progression` phase "Untreated Natural History" renamed to
      "Chemotherapy-Era Outcome": both its snippets describe patients who
      responded to chemotherapy and then relapsed.
    - The TET2 genetic entry claimed one quote established both recurrence and
      prognosis; it established prognosis only. Recurrence now has its own
      quote from the same paper.
    - A TCF4 snippet mixed a human immunostaining clause with a cell-line
      knockdown clause under a single IN_VITRO grade. Trimmed to the knockdown
      clause.
    - PMID:38334635 was graded HUMAN_CLINICAL in seven places while two other
      narrative reviews were graded OTHER. All seven regraded to OTHER.
    - Night Sweats and Weight Loss carried assertive prose with no evidence.
      Now cited to the German-language case report, quoted in the source
      language, with the descriptions no longer asserting a frequency.

    CAUSAL CHAIN
    - The presenting sign was the one phenotype not wired into the graph;
      Violaceous Cutaneous Plaques and Nodules now reports_on the cutaneous
      node.
    - Added Lymphoid Organ Infiltration (UBERON:0000029). Lymphadenopathy was
      FREQUENT with SEER evidence that lymph node is the leading primary site,
      and nothing in the graph covered it; Lymphadenopathy and Splenomegaly
      now report on it.
    - Split the founder node. "Clonal Hematopoiesis with Epigenetic Regulator
      Loss" (MOLECULAR) bundled a molecular lesion with a cellular clonal
      state -- the single-value biological_scale rule is exactly the tripwire
      for that. Now "Epigenetic Regulator Loss in a Hematopoietic Progenitor"
      (MOLECULAR) -> "Clonal Hematopoiesis of the Mutant Progenitor"
      (CELLULAR).
    - Added Glucocorticoid Resistance as the intermediate the NR3C1 node
      described but the graph did not model.
    - Added CDKN2A and CDKN2B Deletion at 9p21.3, absent despite being among
      the few cytogenetic lesions with reported prognostic impact and
      quotable from a paper already cited six times.
    - Added Diphthamide Pathway Silencing (see below), wired as a
      therapy-conditional edge off clonal expansion with the conditionality
      stated rather than implied.
    - Dropped "a survival-signalling input" from the CD123 node: nothing
      cited supports CD123 signalling driving survival, and tagraxofusp works
      by toxin delivery rather than signal blockade. The description now says
      so explicitly.
    - Hedged the adhesion -> cutaneous edge, which asserted causation the node
      prose disclaimed.
    - The CNS node said involvement is present "at diagnosis" while its own
      snippet says CNS disease typically emerges at relapse. Rewritten; the
      commonly quoted ~30% figure is named as not curated because its source
      was never fetched.
    - Added human evidence to the differentiation-block node, which rested on
      model-organism evidence alone.
    - Marrow Failure Cytopenias had no evidence or binding; both added.
    - Added GO:0000086 and GO:0008283 where obvious terms existed.
    - 23 nodes, no orphans, all targets resolve.

    ONTOLOGY
    - NCIT:C39273 "Interleukin 3 Receptor" replaced with NCIT:C39275
      "Interleukin-3 Receptor Subunit Alpha". C39273 is the alpha-beta-c
      heterodimer whose beta chain is shared with the IL-5 and GM-CSF
      receptors; CD123 is the alpha chain, which is what the entry's own
      snippet says and what every targeted agent here binds. This is the
      review's most consequential catch.
    - venetoclax rebound NCIT:C103147 -> CHEBI:133021, per the CHEBI-first
      rule for specific small molecules.
    - Added CHEBI methotrexate and cytarabine to the intrathecal treatment,
      whose drugs were named in its description and snippet but unbound.
    - The CNS phenotype's preferred_term claimed "central nervous system
      leukemic infiltration" over an HP term that means the CSF finding.
      Renamed to match what is actually bound, with the reason stated.

    THE FACTUAL ERROR IN MY OWN PROSE
    The `notes` block said the tagraxofusp diphthamide-resistance claims
    "trace to sources this session did not verify". That was wrong.
    PMID:38338733 is cited four times in this entry, is cached in full text,
    and states the mechanism outright: resistance is not CD123 loss but
    methylation-driven silencing of the diphthamide biosynthesis pathway, and
    azacitidine reverses it. The correction is not just to the sentence -- the
    mechanism is now a pathophysiology node with a hypomethylating-agent
    treatment targeting it. Prose describing repository state is content, and
    this one had rotted within the same session that wrote it.

    TREATMENTS ADDED
    Intensive Induction Chemotherapy (hyper-CVAD/ALL- and AML-type regimens --
    the backbone tagraxofusp is positioned against, and previously absent
    entirely), Hypomethylating Agent Therapy, All-Trans Retinoic Acid
    (preclinical, MYB-specific). The transplant entry's headline claim was
    unsupported by anything it quoted: the EBMT registry compared conditioning
    intensities among transplanted patients, did not make a
    transplant-versus-none comparison, and found MAC superior *independently
    of* CR1. Rewritten, with the autologous-transplant alternative it
    explicitly offers now included.

    DIFFERENTIALS
    Added MPDMN -- BPDCN's WHO-5 sibling and the hardest differential --
    deliberately without an evidence item, because no cached reference
    characterizes it and citing a BPDCN paper for a claim about a different
    entity is the exact failure this differential warns about. Added leukemia
    cutis / myeloid sarcoma.

    HOUSEKEEPING
    - The patient-derived xenograft was in `experimental_models` with
      `experimental_model_type: OTHER` and `organism: human` -- the workaround
      CLAUDE.md records as retired since #8199, for a model that is a mouse.
      Moved to `animal_models` with `species: Mouse`.
    - geo:GSE261534 retyped ATAC_SEQ -> CHIP_SEQ (the series is CUT&RUN).
    - geo:GSE164939 given its linked publication.
    - Pruned ten uncited cache files, nine of them DOI-keyed duplicates of
      PMIDs the entry already cites. Consumed three that were worth citing
      instead of pruning (PMID:42681647 phase 1 CD123 CAR-T, PMID:35963025
      fatal CRS after UCART123, PMID:42602092 CAR-T with autologous rescue) --
      the CAR-T treatment previously rested on one sentence of a narrative
      review while trial data sat unused in the cache. The cited-reference
      list was re-derived after pruning: all 29 resolve.
    - Recorded the WHO-5 nosology tension in `notes` rather than leaving the
      entry citing WHO-5 for granularity while carrying the 2016/2017
      icdo_morphology placement silently.

    A MISTAKE I MADE WHILE FIXING THESE
    Two defects in the first attempt at this round, both caught by
    `just validate` before push. I quoted PMID:42602092's *title* as an
    evidence snippet -- the defect `check-title-snippets` exists to catch --
    and replaced it with a real finding from the body. And five
    `reference_title` values I typed by hand were wrong, including one where I
    copied the reviewer's rendering instead of the cache's ("Central Nervous
    System Involvement" for "...Presentations"). Every title in the file was
    then re-derived programmatically from cache frontmatter, which is how the
    original 80 were produced and why none of those were wrong. The rule holds
    without exception: derive, never type.

    VALIDATION
    - `just validate-disorders`: passed, 104/104 snippets verified.
    - `just validate`: schema, term and reference validation all passed.
    - `just verify-datasets`: 4/4.
    - entity-ref, causal-target, duplicate-key, qualifier-term and enum-value
      checks: all OK.
    - whole-KB title-snippet, snippet-grading, snippet-length, folded-hyphen
      and environmental-evidence gates: no new violations, no baseline touched.
    - `just compliance`: 82.6%, up from 81.4%.

    NOT ACTED ON
    The reviewer flagged a missing history record; one was already committed
    (2026-09-06T202453Z). Their finding that the NR3C1 -> clonal expansion edge
    was undescribed and unevidenced was also stale -- both were added shortly

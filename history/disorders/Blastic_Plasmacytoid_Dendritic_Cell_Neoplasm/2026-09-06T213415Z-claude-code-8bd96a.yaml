    - `just validate`: schema, term and reference validation all passed.
    - entity-ref, causal-target, duplicate-key, enum-value, qualifier-term and
      term-cache-integrity checks: all OK.
    - whole-KB snippet, folded-hyphen and environmental gates: no new
      violations, no baseline touched.
    - No cache rows added or removed: NCIT:C70601 was already cached from
      another entry, and no evidence changed.

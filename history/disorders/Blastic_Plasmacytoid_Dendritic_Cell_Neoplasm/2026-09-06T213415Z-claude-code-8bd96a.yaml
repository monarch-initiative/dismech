  summary: 'Round 2 reviewer suggestions: remove an unsupported prognostic claim'
  details: |
    The re-review re-approved and left two optional suggestions. Both taken.

    AN UNSUPPORTED CLAIM REMOVED
    The reviewer noticed that the new CDKN2A/CDKN2B `genetic` record carried
    "biallelic loss carries adverse prognosis" in `frequency` while its only
    evidence item establishes recurrence. Checking that, the same claim was
    also in the pathophysiology node description ("among the few cytogenetic
    findings with a reported adverse prognostic effect"), and no cached source
    in this entry supports either. A grep across `references_cache/` returned
    the claim only from other diseases' caches - acute lymphoblastic leukemia,
    mesothelioma, Fanconi anemia - not from any BPDCN source.

    The claim traces to the deep-research report, which states it at review
    level without a quotable primary abstract. Both occurrences are now
    removed, and both locations say where the assertion comes from and that
    this entry does not make it. The `genetic` record's `notes` records the
    removal explicitly rather than letting the softened text look like it was
    always that way.

    This is the third instance of the same defect class in this entry across
    the session: prose asserting more than the cited evidence carries. The
    first was an explanation claiming one quote established both recurrence
    and prognosis; the second was the notes paragraph wrongly calling the
    diphthamide mechanism unverified. All three were found by review rather
    than by validation, because no gate checks prose against evidence.

    ONTOLOGY
    The CAR treatment is named "CD123-Directed CAR-T and CAR-NK Cell Therapy"
    and its description covers both platforms, but it was bound to
    NCIT:C126102 Chimeric Antigen Receptor T-Cell Therapy, which names only
    one. Rebound to NCIT:C70601 Cellular Therapy, which is platform-neutral,
    already cached, and enum-valid. The reviewer rated this low priority
    because all three cited items are CAR-T trials, but the mismatch between a
    treatment's own name and its binding is the same internal-inconsistency
    shape as the CDKN2B gene binding fixed in the previous round.

    VALIDATION

    The content is unchanged and was correct either way; this is purely which
    slot it lives in. Worth recording because the underlying distinction is
    easy to get wrong: `description` is read by someone learning the disease,
    `notes` by someone auditing the curation, and provenance in the first slot
    is noise to its audience.


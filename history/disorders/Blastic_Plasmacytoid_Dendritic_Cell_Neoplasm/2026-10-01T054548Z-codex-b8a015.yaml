  summary: Review BPDCN mechanisms, evidence and current treatment
  details: |
    Reviewed the complete preexisting entry, all five prior histories, the scientific portion and citation sidecar of the deep-research report, and all cited source contexts. Consumed full experimental papers on TET2/UV selection, ZRSR2/IRF7 activation, IKZF1, TCF4/BRD4, MYB, NR3C1/lincRNA-3q, BCL2 and DPH1 resistance, plus clinical, pathology and registry sources. The official JCI full text was fetched into a URL cache when its PMID fetch supplied only the abstract; unavailable DOI and captcha caches are not evidence. Corrected CDKN2A/B chromosome-9 deletions being conflated with CDKN1B/RB1 on chromosomes 12/13. Separated founder lesions and activation-coupled apoptosis from BCL2 dependence; qualified human associations, ex vivo experiments, mouse models and emerging tissue/immune hypotheses. Added GCR/H3K27me3 and lincRNA maintenance evidence, and founder-lesion culture/chimera models that do not themselves establish complete BPDCN transformation. Corrected MYB fusion architecture and partner-dependent Cdkn2a cooperation, and removed the claim that ATRA activity is limited to fusion-positive disease. Updated pivekimab to the May 2026 FDA approval, kept regulatory and publication denominators distinct, incorporated the 2026 transplant guideline and BPDCN-specific tagraxofusp/azacitidine/venetoclax results, and verified eight trial records against current registry snapshots. CAR-T efficacy and safety are specific to the two treated BPDCN patients; AML outcomes are not imported. Added fatigue, direct cutaneous histology, PLD4 candidate-marker evidence and diagnosis/staging context, with appropriate limits on cytopenia causation and CNS frequency. Corrected GSE164939 to its original epigenetic publication; the neural-program paper reused those data. Neural dissemination, TXNRD1 resistance and ABCB1 findings remain explicit research questions because direct functional or clinical validation is missing. All four GEO accessions were verified through individual reference caches. Completeness assessment: phenotypes, mechanisms, genetics, diagnostics/biomarkers, treatment/trials and source consumption adequate; no established formal molecular subtypes. C1/C2 expression clusters are not promoted to clinical entities. Reference caches were generated only with the repository fetcher or validator normalization; no cache was manually authored. Removed curation-process narration from disease-facing notes.

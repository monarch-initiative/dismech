  summary: 'Create: Hypomyelinating Leukodystrophy 17 (AIMP2)'
  details: |
    New entry for HLD17 (MONDO:0054817), autosomal recessive biallelic AIMP2 loss of function. Name kept in the numbered HLD series per the entry-naming skill (no established AIMP2-related dyad: one case report only); MONDO label and AIMP2-related leukodystrophy kept as synonyms.

    Sources: primary literature fetched by PMID (Shukla 2018 PMID:29215095; Mazaheri 2022 PMID:35140751, full text; Ochiai 2022 PMID:34523057; Mullen 2026 PMID:42719951; Kim 2002 mouse PMID:12060739; Han 2008 p53 role PMID:18695251; Indian microcephaly cohorts PMID:35568357 and PMID:42833956), the ClinGen Definitive AR record (CGGV:assertion_ba6f8aa3...), and one OpenScientist deep-research report (research/Hypomyelinating_Leukodystrophy_17-deep-research-openscientist.md). Report validation: 14/14 references resolved, 15/16 quotes matched (the unmatched one is a bracket-normalisation artefact in PMID:34523057), one off-topic reference (PMID:42468917, a general MRI review, not used). Term validation flagged HP:0021010 as nonexistent (the report's spinal cord atrophy term; HP:0006827 used instead) and the report bound CNS hypomyelination to HP:0002500. preflight-dr returned WARN: CASP2 mentions are the Ochiai caspase-2 model for this same disease, and the report wrote HGNC:20609 beside 'MSC' (the complex abbreviation); no gene identifier was copied from the report. The report missed the Aimp2 mutant mouse (PMID:12060739). From the report, the HLD review PMID:33324001 was added as REVIEW_SYNTHESIS evidence for the translation-machinery class.

    Modelling: two EMERGING hypothesis groups, MSC loss with reduced translation (patient fibroblasts, zebrafish, mouse) and a toxic truncated-product Golgi/caspase-2 model (overexpression in a mouse oligodendroglial line), kept separate because ClinGen gives loss of function as the mechanism. Conforms to cns_myelin_failure at the differentiation and myelin-sheath nodes, as HLD9 does. The MONDO:0009843 (HLD3) differential is left unbound because cache/mondo/terms.csv has 'hypomyelinating leukodystrophy 3' while current MONDO (OLS 2026-10-06) has 'leukodystrophy, hypomyelinating, 3'. No GeneReviews chapter (check-genereviews NO_CHAPTER).

    Validation: just validate, validate-terms, count-verified-snippets (all verified), check-genereviews, the whole-repo gates, check-snippet-grading, check-gene-activity-grounding (after adding GO:0140378 protein complex scaffold activity), compliance-connectivity, list-gene-term-mismatches, validate-disorders.

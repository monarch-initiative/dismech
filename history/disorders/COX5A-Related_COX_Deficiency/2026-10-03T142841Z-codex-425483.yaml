  summary: Review COX5A disease against both full-text clinical reports
  details: |
    Review all existing content and cached reference leads; retrieve and read the 2017 Radboud publisher PDF and 2022 institutional full text. Expand to both homozygous alleles, variable cardiac/developmental involvement, hypoglycemia, growth and endocrine findings; distinguish residual assembled complex IV, predicted interface disruption, measured protein/activity depletion and supercomplex distributions. Copper remains preclinical and does not clear the S1 intermediate; record unsuccessful clinical supplements and limited nutritional response. Add diagnostics, inheritance bindings, 28 phenotypes and three experimental models. GeneReviews and StatPearls checks show no matching chapter. No disorder-specific deep-research report exists; other-gene research mentions were screened but not imported as COX5A patient evidence. No public patient-cohort dataset accession is reported. Correct the grouping member summary without changing membership or other members.

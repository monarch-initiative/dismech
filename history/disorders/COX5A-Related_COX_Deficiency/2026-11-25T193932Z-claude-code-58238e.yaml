  summary: 'Gene-family review: COX5A'
  details: |
    COX5A genetic record typed: relationship_type UNKNOWN and variant_origin GERMLINE, with a note. Two families are reported, homozygous for p.Arg107Cys (PMID:28247525) and p.Ile89Ser (Torraco et al. 2022); ClinGen rates COX5A Moderate (AR) only for mitochondrial disease (MONDO:0044970), broader than this entry's MONDO:0033655, so no tier is recorded and CAUSATIVE (Definitive/Strong) is not used. The GO:0004129 descriptor on the COX5A node is now described as the holoenzyme activity the non-catalytic structural subunit supports.

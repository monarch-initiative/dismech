  summary: 'Create: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type
    7 (ATP5PO)'
  details: |
    New entry for MC5DN7 (MONDO:0957255), the recessive disorder of ATP5PO (hgnc:850), which encodes the OSCP subunit of the complex V peripheral stalk. Gene-family gap fill for the complex V family; replaces stubs/Mitochondrial_Complex_V_ATP_Synthase_Deficiency_Nuclear_Type_7.yaml. Evidence base: the five reported patients from four families, homozygous c.87+3A>G in three families (PMID:35621276, two families with fibroblast splicing, assembly and activity studies and yeast complementation; PMID:40913360, a third family with fibroblast ATPase activity at about 35 percent) and compound heterozygous c.34C>T (p.Gln12*) with c.329-20A>G in one patient (PMID:34954817). Function of OSCP from PMID:24786291 (review), PMID:39016153 (systematic review; exon 2 encodes part of the transit peptide) and PMID:42362697 (OSCP-deleted human cells assemble only F1-c8). Diagnostic assay from PMID:41124875 (an ATP5PO fibroblast line at 14 percent of control ATPase activity). ClinGen rates ATP5PO Strong (AR) only for the lumped concept mitochondrial disease (MONDO:0044970), so no gene_disease_validity tier was copied; relationship_type CAUSATIVE rests on four unrelated families with functional support. HP:0001522 Death in infancy was not used because it falls outside the PhenotypeTerm enum; mortality is described in prose. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validation: linkml-validate, term validation via OLS, reference validator (59 snippets, 0 issues), count-verified-snippets 59/59, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens and list-gene-term-mismatches all passed.

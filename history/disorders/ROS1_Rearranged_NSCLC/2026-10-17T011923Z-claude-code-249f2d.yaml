  details: |
    LOINC tranche F batch 4. No diagnosis: section exists; used biochemical[].loinc_term. Bound LOINC:81747-8 (Chromosome region 6q22 rearrangements in Tissue by FISH): LOINC codes the ROS1 break-apart FISH probe by its cytogenetic locus (6q22, where ROS1 is located) rather than by gene symbol in its own label; verified this is the correct code by confirming it is surfaced when searching 'ROS1' directly in both the NLM Clinical Table and by cross-checking against the gene-symbol-named point-mutation codes LOINC also carries for ROS1. As with RET_Rearranged_NSCLC in this same batch, LOINC's gene rearrangements family has no method-free identity code, so FISH is the only rearrangement-specific identity available; the only other ROS1 code is a point-mutation-style 'mutations found' code, which would misrepresent a fusion test. This row names EGFR, ALK and KRAS only as mutually exclusive driver exclusions, not as ROS1's own test (per the row's own text: 'ROS1 fusions are mutually exclusive with EGFR, ALK, and KRAS alterations'), so none of those genes' codes are bound here. Newly seeded. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

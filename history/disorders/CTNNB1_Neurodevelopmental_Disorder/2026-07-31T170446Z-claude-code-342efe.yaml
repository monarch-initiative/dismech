  details: |
    Created the CTNNB1 neurodevelopmental disorder entry (CTNNB1 syndrome / NEDSDV / MRD19; MONDO:0014035; OMIM 615075) for issue #7211. Deep research provider: falcon/Edison, 545s, 14 citations, 1 markdown artifact and no images, so no evidence images slots were populated. NEC preflight passed: the MONDO definition names CTNNB1 and the OMIM:615075 xref matches PMID:36083290; the falcon report is anchored on the germline neurodevelopmental disorder and explicitly separates somatic CTNNB1 oncogenesis, which was deliberately excluded from curation. GeneReviews chapter PMID:35593792 was fetched and tagged in the top-level references block, and its Clinical Characteristics list is fully represented in phenotypes. Curated 7 pathophysiology nodes forming a connected causal chain, 22 phenotypes with HPO terms, structured prevalence, genetics, diagnosis, differential diagnoses, 7 treatments including the investigational AAV9 gene replacement, 2 animal models, 3 verified clinical trials, and a HUMAN_MODEL_MISMATCH discussion on the dopaminergic-deficit levodopa hypothesis. No conforms_to was declared because no existing module captures a canonical Wnt/beta-catenin developmental signalling chain; this is documented in notes. Validation: just validate PASS, just validate-terms PASS, programmatic snippet check 83 of 83 exact whitespace-normalised substrings with 0 mismatches.

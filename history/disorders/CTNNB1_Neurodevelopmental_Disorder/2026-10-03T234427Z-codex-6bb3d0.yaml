- type: REVIEW
  outcome: changed
  summary: Review CTNNB1 mechanisms, phenotype spectrum, variant effects and emerging
    therapies against full-text evidence
  details: |
    Reviewed the Falcon research report, citation artifact, GeneReviews full-text PDF, cached primary full texts and detailed records for five trials. Corrected congenital versus acquired microcephaly, patient and assessment denominators, inherited exceptions, exploratory genotype-phenotype claims, and the distinction between batface and true haploinsufficiency models. Expanded atomic mechanisms to include variant-specific dominant-negative effects, dendritic and synaptic defects, provisional ATPase/excitability changes and callosal guidance defects with the negative heterozygote result. Added common phenotypes, representative variants, supportive care and preclinical GSK3 inhibition. Gene-addition eligibility exclusions and absent posted trial results are explicit. No validated mechanistic subtype, modifier or established regulatory noncoding mechanism was identified. Unresolved clinical mechanisms were not converted into unsupported causal edges. All reference caches were generated by official fetch/normalization commands; no manual cache edits.

  details: |
    Backfill for issue #8085. This entry already carries a node written to hold the non-genetic minority of cases, and it names these exposures in its own text, so all four point there. The grades follow the source's own ranking rather than a curatorial preference: one sentence in the cited review names all four exposures at once, putting the strongest evidence with gestational infection and attaching the other three to a hedged may also include. Gestational infection is therefore TRIGGERS with DIRECT and supports SUPPORT, and the other three are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL. That sentence is quoted whole on each of the four links, because it is the comparison between the exposures that does the work and the pre-existing items quote only their own fragment of it. Maternal vitamin A deficiency takes a second, mechanistically specific link into the retinoic acid signalling node at INDIRECT_KNOWN_INTERMEDIATES, since maternal retinol is the substrate for the embryonic retinoic acid that node is built around. Teratogenic drug exposure was deliberately NOT given the corresponding retinoid link, even though this entry's own description argues that systemic retinoids act directly on that node: no cited sentence names a retinoid, so the edge would rest on the description rather than on evidence. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 117 of 117 verified.

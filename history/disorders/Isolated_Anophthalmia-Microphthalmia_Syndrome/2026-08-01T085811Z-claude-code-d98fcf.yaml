  summary: 'Create: Isolated Anophthalmia-Microphthalmia Syndrome (MONDO:0016764)'
  details: |
    De-novo curation of MONDO:0016764 (isolated anophthalmia-microphthalmia / MAC spectrum) for issue #7565. Mechanistic spine modelled as the three sequential steps of early ocular morphogenesis (optic vesicle evagination -> optic cup invagination -> optic fissure closure), with the step of failure determining anophthalmia vs microphthalmia vs coloboma; plus a retinoic-acid sub-pathway node (RBP4/STRA6/ALDH1A3/RARB), a VSX2 retinal-progenitor/RPE fate node, a convergent iPSC-derived apoptosis-proliferation node, and an explicit extraocular-pleiotropy node documenting that the 'isolated' label is an ascertainment qualifier rather than a biological claim (SOX2 AEG/MCOPS3, OTX2 pituitary-plus-eye, RAX hypopituitarism). Deep research: Edison/Falcon (610 s, 40 citations resolving to ~10 distinct sources); treated as leads only and the evidence base was rebuilt independently from PubMed E-utilities. GeneReviews PMID:20301552 (retired MAC Spectrum chapter) fetched, tagged and actively mined for Clinical Characteristics, Diagnosis/Testing and Management. MCOP1-8 and MCOPCB1-13 gene-to-locus assignments were re-derived independently from MONDO via OAK rather than taken from the deep-research output; MCOPS (syndromic) series explicitly excluded as out of scope. Boundary handling: MONDO:0000170 (Microphthalmia_with_Coloboma) is a MONDO child already curated separately and is cross-referenced as the fissure-closure arm rather than duplicated; STRA6/RARB/CHARGE/Axenfeld-Rieger syndromic entries appear only as differential diagnoses. Validation: just validate PASS, term validation PASS, validate-references 108/108 snippets verified, compliance 87.1 percent, compliance-connectivity 100 percent phenotype in-links and 12/13 causal genes wired. Red-teamed against the dismech-pr-review skill before opening the PR; two CRITICAL truncated-snippet defects (a MAB21L2 claim quoting only the FOXE3 clause, and an OTX2 snippet whose truncation inverted its meaning) and 15 IMPORTANT findings were fixed, including adding a diagnosis section, an ocular-prosthesis treatment, four missing genetic entries, subtype_term MONDO bindings, and causal edges for three orphan pathophysiology nodes.

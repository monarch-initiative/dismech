  summary: 'Genetics pass: add dominant nanophthalmos arm (MYRF, TMEM98) and reconcile
    MONDO descendants'
  details: |
    Genetics pass for issue 12247 (d2g series-040). Enumerated the 25 hierarchical
    descendants of MONDO:0016764 through OLS4 and reconciled each one against the
    entry. Added the dominant nanophthalmos arm the entry was missing: NNO1
    (MONDO:0010836, MYRF, OMIM:600165) and NNO4 (MONDO:0014426, TMEM98,
    OMIM:615972) as gene-bound has_subtypes rows with their own evidence, matching
    genetic records, and both genes bound as genes descriptors on the "Absent or
    Severely Reduced Globe Formation" pathophysiology node, whose description now
    distinguishes the dominant RPE-driven route from the recessive MFRP/PRSS56
    posterior-microphthalmia route. TMEM98 carries its ClinGen Limited
    classification (Glaucoma and Neuro-Ophthalmology expert panel, 2025-04-22)
    explicitly, quoted from the newly built CGGV record.

    Also wired seven pre-existing gene records to their numbered subtype rows with
    subtype foreign keys (RAX, VSX2, ALDH1A3, GDF6, GDF3, MFRP, PRSS56), and added
    the gene-discovery primary sources for GDF6 (PMID:17236135) and GDF3
    (PMID:19864492), which previously rested only on a review quote.

    Dispositioned without curating: nanophthalmos 2 (MONDO:0012299) records MFRP,
    the same gene as MCOP5, so MFRP disease carries two MONDO identifiers and the
    entry anchors on MCOP5 rather than creating a second row; nanophthalmos 3
    (MONDO:0012754) and microphthalmia-with-cataract 1 (MONDO:0007995) carry no
    causal gene edge in MONDO; the twelve MCOPCB coloboma loci belong to
    Microphthalmia_with_Coloboma, five of which were curated there in the same PR.

    Upstream MONDO observation recorded in notes, not filed: MONDO:0009631 (MCOP1)
    and MONDO:0012605 (MCOP5) are the only MCOP-series members lacking
    MONDO:0016764 as a second hierarchical parent, which their six siblings all
    carry, and MONDO:0000062 isolated microphthalmia is itself not a descendant of
    MONDO:0016764.

    Every CURIE, HGNC symbol and OMIM number was read from a live OLS4 or HGNC REST
    lookup in the same step it was written. Every new snippet was checked against
    the cited paper's PubMed abstract, not only the cached body.

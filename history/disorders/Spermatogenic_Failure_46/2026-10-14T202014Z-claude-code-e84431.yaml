  summary: 'Create: Spermatogenic_Failure_46'
  details: |
    New entry for MONDO:0033673 (DNAH8-related SPGF46), curated from the open stub, which was deleted. Evidence comes from the full texts of PMID:36308074 and PMID:33611675, the abstracts of PMID:32619401, PMID:32681648, PMID:33704367 and PMID:31178125, and the ClinGen records for DNAH8/SPGF46 (Strong, copied into gene_disease_validity) and DNAH8/PCD (Disputed, cited against a PCD reading), all fetched with just fetch-reference. The causal chain runs from DNAH8 loss, to loss of the sperm outer dynein arm (with co-depletion of DNAH17), to axonemal disorganization, to MMAF and the flagellar phenotypes. A CANONICAL hypothesis records the sperm-restricted gamma heavy chain (DNAH8 in sperm, its paralogue DNAH5 in respiratory cilia). The sperm-head phenotype is deliberately left unconnected because one family shows it and no mechanism is known. Deep research: just research-disorder falcon failed repeatedly with 503 'Failed to authenticate' from Edison over about 40 minutes, including with --fallback and --fallback-provider claude_code (the 503 is classed as temporary so no fallback fired). just research-disorder claude_code produced research/Spermatogenic_Failure_46-deep-research-claude_code.md; just preflight-dr returned PASS. The report added no claims beyond the cited primary papers. Validated with just validate, count-verified-snippets, validate-disorders (both files, 80/80 snippets), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-genereviews (NO_CHAPTER).

  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:1010178 CHD7-related CHARGE syndrome is recorded as a skos:narrowMatch in mappings.mondo_mappings rather than curated as a has_subtypes row, and the mapping_justification says why: this entry is already CHD7-centred, CHD7 is its only causal gene and is wired into the pathograph, and a subtype row naming the gene the whole entry is about would partition nothing. A narrowMatch retires the concept from the curation queue, which is the intended effect here, where a broadMatch would not. Note that MONDO:0008965's OLS description list has a Strategic Refinement editor comment at element 0 and the real definition at element 1, and that it asserts no causal gene in its own axioms. Wiring numbers unchanged at 1/1 genes and 24/28 phenotypes. Validation on the committed tree: just validate 0 issues, validate-terms passed, 120/120 snippets verified.

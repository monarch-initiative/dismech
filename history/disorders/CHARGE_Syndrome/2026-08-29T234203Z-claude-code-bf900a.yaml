  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review of an IUIS Table 2 entry. PRIMARY GAP FILLED: the entry had no immune content at all, despite the thymic/T-cell phenotype being the reason IUIS lists CHARGE syndrome. Added a pathophysiology node (Impaired thymic development and T-cell output, GO:0048538, downstream of CHD7 haploinsufficiency as INDIRECT_UNKNOWN_INTERMEDIATES) with edges to four new phenotypes: Thymic hypoplasia (HP:0000778), T-cell lymphopenia (HP:0005403), Severe combined immunodeficiency (HP:0004430) and Recurrent infections (HP:0002719). Deliberately calibrated to VERY_RARE bands: the already-cited PMID:20186815 calls immunological problems 'a rare feature', and two NEW references were fetched to bound the claim rather than inflate it - PMID:29159871 (Mehr review, graded severity spectrum) and PMID:26563674 (Hsu prospective cohort, only 2/21 patients with an identifiable immune defect, but 30% persistent early-life lymphopenia). Added a KNOWLEDGE_GAP discussion (charge_immunodeficiency_prevalence) recording that these two lines of evidence disagree, with two proposed experiments. FIDELITY FIX: the prevalence record asserted a birth prevalence of 1 in 8,500 to 1 in 17,000 that no cited source stated - its evidence snippet established only that the disorder is rare. Replaced with the sourced ~1:10,000 figure (PMID:20186815) plus structured measure_type/prevalence_class/rate_per_100000, and recorded the correction in notes. MISSED CLAIMS FROM ALREADY-CITED SOURCES: PMID:20186815 was cached as full_text_xml but only its abstract had been mined; harvested its Table III frequencies to add evidence-backed frequency bands to nine phenotypes (coloboma 75%, choanal atresia 38%, temporal bone 98%, facial palsy 39%, cleft 33%, TEF 19%, hearing loss 89%, external ear 91%, genital hypoplasia 61%), its variant-spectrum percentages (67% mutation-positive; 72% nonsense/frameshift) to substantiate the genetic notes, a temporal bone CT diagnosis record, and two differential_diagnoses (22q11.2 deletion MONDO:0008564, Kallmann MONDO:0018800). Added three missed phenotypes: olfactory bulb hypoplasia (HP:0040326), autistic behavior (HP:0000729, from PMID:16155193), scoliosis (HP:0002650). Added a second progression phase (childhood through adulthood) including the counterbalancing GeneReviews statement that life expectancy can be normal. Snippets 65 -> 119, all verified; validate, validate-terms, validate-disorders, check-duplicate-keys, check-entity-refs all pass.

  summary: Record RP23 as the isolated-retinal pole of the OFD1 allelic series (#4243)
  details: |
    Closed the OFD1 half of the last open checkbox on issue #4243 (ciliary
    retinal-dystrophy lumping decision).

    Added a `mappings.mondo_mappings` entry for MONDO:0010320 (retinitis pigmentosa
    23) with `mapping_predicate: skos:relatedMatch`, plus a new `genetic:` block
    "OFD1 Hypomorphic Alleles (Isolated X-Linked Retinitis Pigmentosa, RP23)"
    carrying three evidence items from PMID:22619378 (Webb et al., Hum Mol Genet
    2012).

    Term identity verified directly against the ontology rather than taken from the
    issue text: `uv run runoak -i sqlite:obo:mondo info MONDO:0010320 -O obo` gives
    label "retinitis pigmentosa 23", `intersection_of: RO:0004003 HGNC:2567` (OFD1)
    and `xref: OMIM:300424`.

    Modeling decision. `skos:relatedMatch` was chosen deliberately over
    `narrowMatch`, and a `has_subtypes` entry was deliberately not created. RP23
    shares OFD1 with this entry but not its pathograph: it is X-linked recessive in
    surviving hemizygous males, arising from a deep intronic variant that still
    leaves 39% correctly spliced transcript, whereas OFD I is X-linked dominant and
    male-lethal from truncating alleles. Per CLAUDE.md, `relatedMatch` does not
    retire a concept from the curation queue, which is the honest state here - RP23
    remains available for its own dismech entry or a future OFD1 allelic-series
    entry.

    The third evidence item (photoreceptor susceptibility to reduced OFD1 dosage) is
    marked PARTIAL because the source abstract frames it as a suggestion from the
    splicing data rather than a demonstrated mechanism.

    Validation run and read, not assumed:
    - `just validate kb/disorders/Orofaciodigital_Syndrome_Type_I.yaml` - passed
      (schema + terms + references), 48/48 snippets verified.
    - `just validate-disorders` over both changed files (the batched pass CI runs) -
      passed, 131/131 snippets verified against cached references.
    - `just check-duplicate-keys`, `just check-title-snippets`,
      `just check-term-cache-integrity`, and
      `just check-groupings kb/groupings/Ciliopathies.yaml` - all clean.

    `references_cache/PMID_22619378.md` was created by
    `just fetch-reference PMID:22619378`. It was never hand-written or hand-edited.
    The two new rows in `cache/mondo/terms.csv` and the `diseaseterm` enum cache were
    written by linkml-term-validator via the repository's own PreToolUse validation
    hook.

  summary: Add allele-specific computational models for Noonan syndrome
  details: |
    Curated five complementary computational models spanning LZTR1-RIT1
    protein-protein docking and molecular dynamics, LZTR1 L580P multimer
    prediction, RIT1 A57G-RAF1 interface modeling, PTPN11 N308S molecular
    dynamics, and SOS1 R1131K transfer-entropy signaling analysis. Each model is
    linked only to the pathophysiology node it directly represents or measures,
    with structured readouts, fidelity assessments, validation boundaries,
    repository and license status, and explicit replay limitations.

    The reusable Zenodo LZTR1-RIT1 coordinate deposit and SOS1 notebook/data
    repository were inspected and pinned; static checks identified the missing
    mutant MD artifacts in the former and the manual input-renaming requirement
    in the latter. Paper-only models explicitly omit repository identifiers.
    PubMed caches were generated through the repository fetch workflow and all
    new evidence snippets were checked against cached primary sources.

    Corrected the RIT1 mechanism prose to reflect the cited finding that direct
    mutant-RIT1 recruitment of RAF remains dependent on classical RAS for full
    MAPK activation rather than bypassing RAS regulation.

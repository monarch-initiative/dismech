  details: |
    Typed the genetic records from the ClinGen RASopathy GCEP assertions the entry already cited (Noonan syndrome, MONDO:0018997, the entry's own disease term). Records with a Definitive tier (PTPN11, SOS1, SOS2, RAF1, RIT1, RRAS2, KRAS, NRAS, LZTR1 autosomal dominant, LZTR1 biallelic autosomal recessive) are CAUSATIVE; records rated Moderate (BRAF, MRAS) or Limited (MAP2K1, MAP2K2, RASA2, RRAS) are UNKNOWN with the tier recorded and a note, because the schema reserves CAUSATIVE for Definitive or Strong. All typed records carry variant_origin GERMLINE, and each now has a gene_disease_validity assertion quoting its CGGV row. On the RAF1 Kinase Hyperactivation node the protein serine/threonine kinase activity binding gained modifier INCREASED, grounded in PMID:17603483 (hotspot RAF1 mutants had increased kinase activity and enhanced ERK activation; non-HCM-associated mutants were kinase impaired, which the evidence explanation records). Not changed: the 'Additional RAS-MAPK Signal-Amplifying Variants' node still bundles nine genes of five protein classes (RAS GTPases, RAF/MEK kinases, a RasGAP, CBL, SPRED2) with no molecular function; it needs splitting by protein class rather than a single binding.

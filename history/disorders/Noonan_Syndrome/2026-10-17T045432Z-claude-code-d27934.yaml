  summary: Rebind the cushion EMT process from GO:0001837 to GO:0003198
  details: |
    The Cardiac Valve Morphogenesis Defects node already named the right process: its preferred_term was 'epithelial to mesenchymal transition involved in endocardial cushion formation', which is the exact canonical label of GO:0003198. The binding was to GO:0001837, the generic parent, whose definition asserts an epithelial substrate; the node's only cell type is CL:0002350 endocardial cell, which is endothelium rather than epithelium, so the parent term contradicted the cell annotation. GO:0003198 does not: it is defined over a cardiac epithelial cell contributing to endocardial cushion formation and sits under GO:0060317 cardiac epithelial to mesenchymal transition, the subtree where GO itself classifies an endocardial endothelial substrate under EMT. Rebinding therefore makes the node say what it already meant and resolves the contradiction without changing any claim. GO:0003179 heart valve morphogenesis beside it is unchanged.

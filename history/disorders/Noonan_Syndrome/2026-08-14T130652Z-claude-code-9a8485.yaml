  summary: Add neural crest node, chick model link, and ERK-vs-phenotype open question
    (#6513)
  details: |
    Curation-scanner run against issue #6513 ([preprint-scan] Noonan Syndrome: PTPN11 SHP2 variant effects on ERK signaling and neural crest behavior).

    Added a "Neural Crest Cell Developmental Dysregulation" pathophysiology node (biological_scale CELLULAR; CL:0000333 migratory neural crest cell; GO:0001755 neural crest cell migration with modifier DYSREGULATED; GO:0014032 neural crest cell development with modifier ABNORMAL), an incoming edge from "ERK Cascade Hyperactivation", and outgoing edges to "Congenital Cardiac Structural Defects", "Hypertelorism" and "Triangular Face". The entry previously had no neural-crest content at all, so the craniofacial and conotruncal phenotypes hung directly off the ERK node with the lineage step left implicit. The node is grounded on peer-reviewed mouse (PMID:19706403 neural-crest-restricted SHP2 Q79R; PMID:19541608 NCC-specific PTPN11 ablation) and zebrafish (PMID:20493809) evidence, not on the preprint.

    The migration modifier is DYSREGULATED rather than INCREASED/DECREASED because direction genuinely varies by lesion: SHP2 loss in neural crest impairs outflow-tract migration, while a Noonan-spectrum missense variant has been reported to drive excessive migration.

    Added a chick neural tube electroporation animal model with modeled_mechanisms (PERTURBS, fidelity LOW) targeting that node, one ALTERED melanocyte-precursor-distribution readout, and explicit limitations covering preprint status, overexpression above endogenous SHP2 levels, and avian trunk versus human cranial neural crest.

    Added a discussions entry (kind OPEN_QUESTION, noonan_erk_magnitude_vs_neural_crest_phenotype) asking whether ERK activation magnitude predicts neural crest phenotype and clinical severity, with three proposed_experiments. Per the issue's explicit instruction, PPR:PPR1278294 is never sole support for a mechanistic claim: its findings appear only inside the open question and as corroborating model evidence alongside peer-reviewed literature.

    The pre-existing direct ERK-to-craniofacial-phenotype edges were deliberately left in place rather than rerouted through the new node; de-duplicating them is flagged in the PR as a reviewer judgement call rather than silently deleting curated edges.

    Validation run: just validate (passed), just validate-terms (passed), just count-verified-snippets (199/217 verified, 18 skipped by prefix -- every non-skipped snippet verified against cached references), just check-title-snippets (OK, no new title-quoting snippets), plus the pre-PR just validate-disorders sweep.

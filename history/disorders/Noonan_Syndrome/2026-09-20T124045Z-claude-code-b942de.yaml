  summary: 'Genetics pass: wire CBL/SPRED2, record SPRED2 recessive inheritance'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: seventeen genes curated and bound, thirteen already wired to
    pathophysiology nodes. The checklist keys only PTPN11 (MONDO:0008104), long
    since curated. The existing SHP2 GAIN_OF_FUNCTION modelling on GO:0004725 is the
    CLAUDE.md worked example and was left untouched. The RASopathies grouping
    (kb/groupings/RASopathies.yaml) already covers this entry, so nothing was added
    there.

    The gap was four unwired genes, and they split into two very different cases.

    Changes:
    - Added PTPN11 as a `genes:` descriptor on both `has_subtypes` rows.
    - On the lentigines row, bound only PTPN11 and said so in the description: MONDO
      also records RAF1 and BRAF against MONDO:0007893, but no source this entry
      cites attests them for that subtype, and the cohort it does cite found PTPN11
      in both of its lentigines cases.
    - Wired CBL and SPRED2 onto `Additional RAS-MAPK Signal-Amplifying Variants` and
      extended the node's description: both reach raised RAS-MAPK output by losing a
      brake rather than gaining a signal. Evidenced from the founding reports
      PMID:20619386 (CBL; impaired receptor ubiquitylation) and PMID:34626534
      (SPRED2; loss of negative modulation of EGF-promoted RAF1/MEK/ERK
      phosphorylation in patient fibroblasts).
    - Added SPRED2 to the autosomal recessive `inheritance:` block. SPRED2 is the
      exception to this entry's dominant pattern - homozygous in all four reported
      subjects, and the authors call it the second recessive form of Noonan
      syndrome. The block previously named only LZTR1.
    - Deliberately did NOT wire MAP2K2 or RRAS. ClinGen classifies both
      gene-disease relationships as Limited; wiring them beside the Definitive genes
      on the convergent node would give them equal weight in the pathograph.
      Recorded that reasoning in each record's `notes` with a trigger to reconsider
      if ClinGen upgrades.
    - Added `relationship_type: CAUSATIVE` to CBL and SPRED2, and recorded in both
      notes that the committed ClinGen snapshot carries no assertion for either
      gene-disease pair (checked by querying the ClinGen index directly), so the
      attestation is Orphanet plus primary literature.

    New references cached: PMID:20619386, PMID:34626534.

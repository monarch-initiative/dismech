  summary: Map Noonan syndrome to OMIMPS:163950
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS163950 contains the fourteen numbered Noonan forms plus Noonan-like disorders with loose anagen hair 1 and 2 (OMIM:607721 and OMIM:617506) in the January 2026 snapshot. This entry includes the numbered forms and a Noonan syndrome with multiple lentigines subtype, which is not a member of that series. MONDO:0018997 has the fourteen numbered children, so its exact crosswalk does not resolve the different boundaries. RelatedMatch records the overlap without equating the entire entry with the series or asserting either is a strict subset of the other. RAS-MAPK convergence explains the clinical association, while gene-specific mechanisms, recessive LZTR1 disease, and distinct RASopathy syndromes remain distinguishable.

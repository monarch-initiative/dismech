  summary: 'Curate the RAF1 cardiac axis: two mouse models, human myocardial slices,
    trametinib case reports'
  details: |
    Curated the four lines of evidence for MEK inhibition in RAF1-driven Noonan hypertrophic cardiomyopathy, which the entry previously carried only as the RAF1 S257L iPSC-cardiomyocyte model (PMID:31163979).

    Added the Raf1 L613V/+ knock-in mouse (PMID:21339642) with four mechanism links, including a FAILS_TO_RECAPITULATE link against Cardiac Valve Morphogenesis Defects: the source states valvuloseptal development is normal, so a RAF1 kinase-activating allele sufficient for postnatal hypertrophy does not reproduce the valve lesion. Added the Tie2-Cre Q79R-Shp2 endocardial cushion mouse (PMID:19017799), which fills that node; ERK1 deletion fully rescues the cushion phenotype. Added the paediatric RASopathy myocardial tissue slice model (PMID:39573843) as the only human, loaded, multicellular system on the cardiac axis. Added the infant (PMID:35052347) and adult (PMID:38827265) trametinib reports to MEK Inhibitor Therapy, wired that treatment to Cardiomyocyte Hypertrophy, and set therapeutic_modality SMALL_MOLECULE.

    Recorded the two directions of MEK pharmacology as a KNOWLEDGE_GAP discussion rather than a conforms_to link. The toxicity module mek_inhibition_cardiac_mitochondrial_injury is conformed to by MEK_Inhibitor_Induced_Cardiomyopathy, the drug-toxicity entry; Noonan's own pathophysiology does not instantiate MEK-inhibition injury, so conformance would be the wrong relation. Treatment has no slot that would carry the link (dismech#12664).

    Sources were identified independently of the OpenScientist alternative-models report committed on this branch, which reports human Noonan myocardial slices as a confirmed-empty search; PMID:39573843 is such a study, so that finding is a false negative. The slide-deck claim that MEK inhibitors work only if started early is not curated: the Wu 2011 abstract reports postnatal MEK inhibition normalizing the cardiac defects, and the adult case report shows benefit at 18 years.

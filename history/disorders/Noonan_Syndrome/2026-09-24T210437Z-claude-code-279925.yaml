  summary: 'Genetics pass: numbered Noonan subtype series (d2g series-030)'
  details: |
    Genetics pass for the d2g series-030 gap list (issue #12237), covering the gene-defined
    numbered Noonan syndrome subtypes that MONDO records but this entry did not catalog.

    Anchor check first. The parent disease_term MONDO:0018997 "Noonan syndrome" resolves in OLS
    to that label and is the correct anchor for this entry; no over-broad-anchor remedy was
    needed, so the series was built as the issue intended rather than declined.

    What was added. Eleven has_subtypes rows for the numbered series the gap list names (NS2,
    NS3, NS4, NS5, NS7, NS8, NS9, NS10, NS12, NS13, NS14), plus NS6 and NS11 so the numbered
    catalog has no holes; NS6 and NS11 are curated in full as standalone entries
    (Noonan_Syndrome_6.yaml, Noonan_Syndrome_11.yaml) and the rows say so. Each row carries a
    MONDO-bound subtype_term read from OLS in the same step it was written, an HGNC-bound gene
    read live from rest.genenames.org, and its own evidence.

    Reciprocal foreign keys. Twelve existing genetic records gained a subtype key (PTPN11 NS1,
    KRAS NS3, SOS1 NS4, RAF1 NS5, NRAS NS6, BRAF NS7, RIT1 NS8, SOS2 NS9, LZTR1 NS10, MRAS NS11,
    RRAS2 NS12, SPRED2 NS14). Two new genetic records were added: MAPK1 for NS13, and a separate
    "LZTR1 (biallelic)" record for NS2, because NS2 and NS10 are different MONDO classes
    separated by zygosity rather than by gene and ClinGen curates the dominant and recessive
    LZTR1-Noonan relationships as two assertions.

    The existing NS1 row was renamed from "Noonan Syndrome 1 (PTPN11-related)" to "NS1" with the
    old string kept as display_name, so the whole series uses the short slug-friendly foreign-key
    names CLAUDE.md asks for. Nothing referenced the old name.

    Case fractions. Seven genetic records gained structured case_fractions from cohort shares the
    cited abstracts state: PTPN11 50%, SOS1 20% of the PTPN11-negative group, SOS2 4% and LZTR1 8%
    of a 50-proband Brazilian cohort, RAF1 3% of all affected individuals, RIT1 9% of 180, and a
    KRAS upper bound of 5% recorded as case_fraction_high because the source gives "<5%" rather
    than a point estimate. The RAF1 record notes explicitly which of the two figures in its source
    sentence was taken, because "18 of 231 ... corresponding to 3% of all affected individuals"
    names two different denominators.

    Pathograph. MAPK1 was bound as a genes descriptor on the ERK Cascade Hyperactivation node
    rather than on an upstream node, because MAPK1 encodes ERK2 itself: the NS13 genotype alters
    the effector that node names instead of an input to it. Its evidence item was merged into the
    node's existing evidence list rather than added as a second one. Every other gene in the
    series already reached the pathograph.

    Two attributions are recorded as weaker than the rest of the series, in the subtype
    descriptions and in the gene notes rather than by omitting them. MAPK1 (NS13): the founding
    report calls the phenotype "reminiscent of Noonan syndrome in some subjects"; the 2025
    GeneReviews chapter's diagnostic gene list does not include MAPK1; a grep of
    data/clingen/gene_validity.csv returns no MAPK1 row for any disease; a grep of
    references_cache/ORPHA_648.md returns no MAPK1 row in the Orphanet gene table. SPRED2 (NS14):
    GeneReviews likewise omits it and ClinGen carries no assertion, so it rests on the founding
    report plus Orphanet, which the pre-existing gene record already said.

    Genes left without a subtype key, deliberately: MAP2K1, RASA2, CBL, MAP2K2 and RRAS have no
    numbered MONDO class in this series. MAP2K2 and RRAS remain unwired from the pathograph on
    the ClinGen Limited grounds their existing notes give.

  summary: 'Review round 1: scope the dominant LZTR1 record, narrow the MAPK1 quote'
  details: |
    Review round 1 on PR #12727.

    The dominant LZTR1 record had been keyed to NS10 while still describing and citing the
    recessive form. Its notes now cover the dominant form only and point at the LZTR1 (biallelic)
    record for the recessive one, and the ClinGen autosomal recessive assertion was removed from
    it; that assertion remains on the LZTR1 (biallelic) record, which is the claim it supports.

    The MAPK1 mechanism quote was narrowed from "... boosts MAPK signaling in vitro and in vivo"
    to end at "boosts MAPK signaling", in both places it appears (the MAPK1 genetic record and the
    ERK Cascade Hyperactivation node). The longer form described two kinds of evidence under one
    IN_VITRO grade. The shorter form is still an exact substring and still states the mechanism the
    node asserts.

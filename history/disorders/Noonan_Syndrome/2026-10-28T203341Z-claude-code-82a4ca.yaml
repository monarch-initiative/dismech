  summary: Add a neuroblastoma phenotype and its edge from RASopathy Neoplastic Predisposition
  details: |
    Adds a Neuroblastoma phenotype (Oncologic, HP:0003006) after Juvenile Myelomonocytic Leukemia, and one downstream edge to it from RASopathy Neoplastic Predisposition, so that every phenotype in the entry is causally connected. Part of the neuroblastoma expansion series (issue 15822); HP:0003006 sits under HP:0004376 'Neuroblastic tumor', so a later neuroblastoma-predisposition grouping can select the entry.

    Occurrence: the 2024 AACR RASopathy surveillance update (PMID:39196581, full text) lists neuroblastoma in the Noonan syndrome cancer spectrum, and Kratz et al. 2015 (PMID:25742478, full text) report one neuroblastoma among 632 people with Noonan syndrome matched against the German Childhood Cancer Registry (Table 2 patient 8, PTPN11 I282M; Table 3 SIR 10.8, 95% CI 0.3-59.9). That single case is the basis for frequency VERY_RARE (<5% in the schema); the notes say the interval includes 1, so no raised risk is shown. The 2024 update's neuroblastoma risk figures belong to Costello syndrome and are not carried over.

    Surveillance: neither AACR consensus recommends radiologic or laboratory screening for neuroblastoma in Noonan syndrome. The 2017 workshop paper (Kamihara et al., PMID:28674118) hedged that it might be warranted in 'perhaps some forms' of Noonan syndrome but named Costello syndrome as the only RASopathy warranting neuroblastoma screening; the 2024 update judges non-hematologic cancer risk, neuroblastoma included, not high enough to warrant surveillance. The description reports this as a threshold judgment, not as a low risk, because the 2024 update calls overall childhood cancer risk in Noonan syndrome moderate.

    Grading: sentences about which cancers occur are HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS (registry rows PRIMARY_RESULT); surveillance recommendations are OTHER with REVIEW_SYNTHESIS, matching how Costello_Syndrome.yaml grades the 2024 paper and how Noonan_Syndrome_6.yaml grades the identical recommendation passage. The existing DOI:10.1158/1078-0432.ccr-24-1611 abstract quotes were left unchanged.

    The Tumor Predisposition notes were reworded for the new second edge from RASopathy Neoplastic Predisposition (in-degree still 1, fan-out 2), and the same worked example in docs/coarse-phenotype-bindings.md and the coarse-phenotype-bindings skill was reworded to match.

    Validated with run_c4 (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present and check-skill-files.

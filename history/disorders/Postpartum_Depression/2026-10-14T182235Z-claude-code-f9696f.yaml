  summary: Promote the Gabrd mouse model to animal_models
  details: |
    Added an animal_models record for Gabrd+/- and Gabrd-/- mice (PMID:18667149), the paper the entry already cited five times as model-organism evidence. Linked to Failure of GABA-A Receptor Subunit Plasticity as PARTIALLY_RECAPITULATES with fidelity UNKNOWN, because whether women with postpartum depression have a receptor-remodelling defect has not been measured, and to Postpartum Major Depressive Episode as PARTIALLY_RECAPITULATES with fidelity LOW, with readouts for absent delta-subunit regulation, depression-like and maternal behaviour, and rescue by THIP. Divergences record the species gap, the behavioural proxy, and that germline deletion imposes the lesion rather than letting it arise in pregnancy. The model now attaches to the existing Gabrd human-model mismatch discussion. No new references were added. Validated with just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs and check-duplicate-keys.

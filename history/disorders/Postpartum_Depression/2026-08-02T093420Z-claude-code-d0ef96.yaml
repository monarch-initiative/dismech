  summary: 'Create: Postpartum Depression (MONDO:0005929)'
  details: |
    De novo entry created to close part of the obstetric coverage gap in #7837, which flagged postpartum depression as the most tractable missing obstetric entry (existing MONDO anchor, defined mechanism, two approved mechanism-matched drugs).

    Mechanism curated as two competing hypothesis groups: neurosteroid_withdrawal_model (CANONICAL) and hpa_axis_crh_model (ALTERNATIVE). Six pathophysiology nodes chain perinatal neurosteroid surge/withdrawal to failed GABA-A subunit plasticity, loss of inhibitory tone, and the depressive episode, with parallel placental-CRH and estrogen-sensitive-epigenetics arms converging on the same endpoint. Brexanolone and zuranolone are linked to the inhibitory-tone node via target_mechanisms (RESTORES), making the drug-mechanism match explicit in the graph.

    Reference discipline: eight of the PMIDs initially drawn from recall resolved to unrelated papers when fetched (Bloch, Maguire/Mody, Schiller and the ROBIN trial all had wrong IDs). All citations were re-derived from PubMed esearch/esummary and identity-checked by first author, journal and year before use. Final state: 37/37 snippets verified against cached references; schema and term validation pass.

    Two curator discussions recorded: a CONTROVERSY on why null hormone-concentration studies do not refute a differential-sensitivity model, and a HUMAN_MODEL_MISMATCH on the GABA-A subunit-plasticity step, whose direct evidence is entirely murine while human support is inferred from drug efficacy.

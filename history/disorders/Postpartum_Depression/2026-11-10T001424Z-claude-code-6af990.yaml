  details: |
    Anhedonia, Irritability and Poor appetite, which had no evidence, now cite the StatPearls Perinatal Depression chapter (PMID:30085612, newly cached), whose abstract lists the symptoms that characterize perinatal depression, the DSM-5-TR category that includes postpartum onset. Added Low Self-Esteem (HP:0031469) and Hopelessness (HP:5200271) from the same source. Insomnia and Fatigue were left without new evidence because the chapter lists sleep disturbance generally and names fatigue only for postpartum blues. Validated with just validate-disorders.

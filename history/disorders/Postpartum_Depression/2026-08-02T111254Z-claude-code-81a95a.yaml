  summary: 'Address PR #7862 review: BIOMARKER relationship, node split, SKYLARK trial,
    diagnosis'
  details: |
    Addressed all 4 IMPORTANT items from the ai4c-reviewer review on PR #7862.

    1. relationship_type corrected from SUSCEPTIBILITY to BIOMARKER for HP1BP3 and TTC9B. The reviewer was right and the schema is explicit: SUSCEPTIBILITY is defined as variant-based ('Variants in the gene confer susceptibility... GWAS hits'), whereas the cited evidence (PMID:23689534) is antenatal DNA methylation used predictively. BIOMARKER is defined as 'expression, mutation, or amplification status serves as a diagnostic, prognostic, or predictive biomarker without a required causal role' — an exact fit.

    2. Two bundled pathophysiology nodes split into four atomic nodes, per the single-mechanistic-claim discipline:
       - 'Perinatal Neurosteroid Surge and Precipitous Postpartum Withdrawal' -> 'Gestational Neurosteroid Surge' (GO:0006694 INCREASED) + 'Precipitous Postpartum Neurosteroid Withdrawal' (GO:0006694 DECREASED). This resolves the contradiction the reviewer flagged, where a single node named 'Surge' carried a DECREASED modifier. The surge node now points both to the withdrawal node and to the plasticity node (it is the remodeling stimulus), while the withdrawal node points to the plasticity node for a different reason (it exposes the mismatch) — the two edges carry distinct descriptions.
       - 'Placental CRH Elevation and HPA Axis Dysregulation' -> 'Placental CRH Elevation' (GO:0071376 INCREASED) + 'Postpartum HPA Axis Hyporesponsiveness' (GO:0071376 DYSREGULATED). Evidence redistributed so each node carries the snippets that bear on it; the cortisol/ACTH null result stays on the hyporesponsiveness node where it constrains the locus.
       Pathograph is now 8 nodes. The ppd_hormone_concentration_null_findings discussion's attaches_to was repointed to the renamed withdrawal node; graph check confirms no dangling downstream/hypothesis_group/target_mechanism/attaches_to references.

    3. SKYLARK (NCT04442503) added to clinical_trials, cached via the reference validator. This is the registrational phase 3 for zuranolone 50 mg — the dose and duration of the only PPD-specific pharmacotherapy still marketed — so its absence was a real gap. Cited from both the ClinicalTrials.gov summary and the primary publication.

    4. diagnosis section added: DSM-5 major depressive episode with peripartum-onset specifier, EPDS and PHQ-9 screening, and the US/UK policy divergence on universal screening. Bound to NCIT:C15220. Note the reviewer's suggested term name did not match: NCIT:C15220 is 'Diagnosis Assessment', not 'Screening'; label corrected against OAK before use.

    Validation: schema pass, terms pass, 44/44 snippets verified (was 39/39).

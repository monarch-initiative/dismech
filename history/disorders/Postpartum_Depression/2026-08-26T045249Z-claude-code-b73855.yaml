  summary: 'Augment: shared PMD/PPD genetic architecture (KCTD16, PCDH9)'
  details: |
    Added the two cross-trait GWAS loci shared between premenstrual disorder and postpartum depression (KCTD16, hgnc:29244; PCDH9, hgnc:8661) to the `genetic:` section as SUSCEPTIBILITY associations, sourced from the medRxiv/Research Square preprint PPR:PPR1293935 (Qu et al., 2026).

    Evidence discipline. Per the preprint-scan rule that a preprint must not be the sole support for a claim, the KCTD16 GABA-B assignment is independently supported by Schwenk et al. 2010 (PMID:20400944), which establishes KCTD16 as an auxiliary subunit of the native brain GABA-B receptor complex. PCDH9 is curated as a positional association with no mechanistic claim attached, because the preprint offers none. Neither locus was wired into the pathophysiology chain: the source is not peer reviewed and the loci are unreplicated, so both are recorded as susceptibility associations with a `notes:` line stating that limitation explicitly.

    New knowledge gap. The finding creates a real mechanistic tension worth recording rather than smoothing over: every curated strand in this entry, including both approved drugs, runs through the ionotropic GABA-A neurosteroid-withdrawal axis, while KCTD16 implicates metabotropic GABA-B. That is captured as a KNOWLEDGE_GAP discussion, ppd_gabab_versus_gabaa_inhibitory_axis, attached to pathophysiology#Loss of GABAergic Inhibitory Tone and genetic#KCTD16, with two proposed experiments (independent replication plus a measured direction of effect on hippocampal KCTD16 expression; Kctd16 manipulation in a neurosteroid-withdrawal model to test whether GABA-B is a parallel route to reduced inhibitory tone).

    Deliberately not done. The symmetric shared-locus entries were not added to Premenstrual_Dysphoric_Disorder.yaml, whose `genetic:` section still uses the older free-text `association:` style; that is recorded as follow-up in the entry notes rather than bundled here.


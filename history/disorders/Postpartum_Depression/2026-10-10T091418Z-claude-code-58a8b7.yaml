  summary: Bind validated instruments and their severity bands as LOINC measurements
  details: |
    Extended the existing perinatal depression screening row. EPDS panel LOINC:71354-5 bound as the measurement with the Royal College of Psychiatrists LOINC copyright notice verbatim in the row notes. Total score LOINC:99046-5 (no third-party notice) carries two cut-off schemes from the Levis 2020 BMJ individual participant data meta-analysis (PMID:33177069): 11 or higher, which maximised combined sensitivity and specificity, and 13 or higher, the higher-specificity cut-off for higher symptom levels. Added the Cox 1987 development study (PMID:3651732) as row evidence. No instrument items are quoted.

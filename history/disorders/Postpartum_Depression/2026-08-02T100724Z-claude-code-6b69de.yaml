  summary: Deep research (claude_code) + brexanolone market-withdrawal correction
  details: |
    Ran the REQUIRED Step 3 deep research that the initial curation pass skipped: 'just research-disorder claude_code Postpartum_Depression' (provider claude_code, the only one available without additional API keys; 22 web searches, 58 citations, 298 s, $1.91). Report and citations sidecar committed under research/.

    Material correction driven by the run: the entry presented brexanolone as a current approved therapy. The DR report stated its FDA approval had been withdrawn in April 2025. Treated as a lead, not fact: no PubMed abstract documents the withdrawal, so it was verified against the primary regulatory source, the Federal Register notice (FDA Docket FDA-2024-N-5852), fetched via the govinfo.gov mirror and cached with the reference validator.

    Cache-hygiene note: the first attempt cached federalregister.gov directly and captured a bot-block 'Request Access' page rather than the document. That cache file was deleted rather than kept, since a cache standing in for an authority must not contain something other than what it claims.

    Changes: brexanolone treatment description now records the withdrawal, its commercial (not efficacy/safety) basis, and why the entry retains the drug — its trial data remain the primary human evidence for the causal role of the inhibitory-tone node. Top-level description reframed so zuranolone is the surviving mechanism-matched treatment. Two Federal Register evidence items added with evidence_source OTHER (regulatory status, not a study result).

    Also removed an unevidenced 'frequency: OBLIGATE' on the depressed-mood phenotype: the cited snippet supported only 'common', and a major depressive episode requires depressed mood OR anhedonia, so the band was not defensible.

    Uncurated DR findings recorded in entry notes as future work: postpartum inflammatory arm (IL-6/hs-CRP, kynurenine, NLRP3), limbic-prefrontal imaging signature, oxytocin signaling. Validation after changes: schema pass, terms pass, 39/39 snippets verified.

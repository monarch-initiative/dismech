  summary: 'Address PR #7246 review: ground Culler-Jones subtype, add maternal-diabetes
    exposure and CMA diagnosis'
  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES round on PR #7246. Blocking finding (yellow 1) resolved: the Pituitary-Polydactyly subtype now carries subtype_term MONDO:0014369 (postaxial polydactyly-anterior pituitary anomalies-facial dysmorphism syndrome), verified by OAK as carrying synonym 'Culler-Jones syndrome', xref OMIM:615849 and Orphanet:420584, and relationship RO:0004003 to HGNC:4318 GLI2 - so the identifier is grounded on the correct gene and OMIM entry. The subtype description now spells out all three identifiers and points at the hpe9_nomenclature discussion for the lump-versus-split decision. The HPE-spectrum subtype is deliberately left without a subtype_term and now says why: that tier has no MONDO class distinct from the entry's own disease_term, because GLI2-related disease with forebrain non-cleavage simply is holoprosencephaly 9 (MONDO:0012563); only the mild tier acquired a separate identifier, having been historically split out as Culler-Jones syndrome. Suggestion blue 2 adopted: a Maternal pregestational diabetes entry was added to environmental, the section's first HUMAN_CLINICAL entry, citing a CDC systematic review (PMID:29761639) and a case-control study quantifying pregestational diabetes in 9.2 percent of holoprosencephaly cases versus 0 controls (PMID:33111505); both PMIDs newly fetched and cached, and the entry states explicitly that the evidence is for holoprosencephaly broadly rather than GLI2 carriers specifically. Suggestion blue 6 adopted: a Chromosomal microarray diagnosis entry was added as the diagnostic counterpart to the existing 2q14.2 deletion variant class, noting that sequencing alone misses whole-gene deletions. Suggestions blue 3 (Roessler 2/11, 3/11, 6/11 penetrance breakdown) and blue 5 (hearing loss, ear anomalies) were declined because no snippet-supportable source exists in the cache for either; suggestion blue 4 (tagging phenotypes with subtype Pituitary-Polydactyly) was declined on accuracy grounds because that tier is defined by the absence of holoprosencephaly rather than by any exclusive phenotype, so tagging shared phenotypes such as hypopituitarism or postaxial polydactyly to it would assert an exclusivity the literature contradicts. All three declines are explained in a PR comment. Validation after the changes: just validate passes; all 118 evidence snippets confirmed as exact substrings of their cached abstracts; compliance rose to 90.7 percent global and 91.0 percent weighted; downstream, subtype, conforms_to and attaches_to foreign keys all still resolve.

  summary: Link teratogen exposures to the Hedgehog buffering node
  details: |
    Backfill for issue #8085. All three environmental entries target the 'Reduced Developmental Buffering of the Hedgehog Pathway' node, which this entry already models as the reserve that GLI2 haploinsufficiency removes. That is the correct substrate for environmental insult: the exposures do not cause holoprosencephaly outright, they act on a pathway that has lost its margin. Maternal pregestational diabetes is PREDISPOSES on human case-control data. Prenatal ethanol and low-dose teratogen exposure are EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES, since both are demonstrations of gene-environment interaction rather than independent causes. Both of those carry supports PARTIAL, not SUPPORT, because the demonstrations are in Shh and Gli2 heterozygous mice and have not been shown in human carriers; the evidence_source is MODEL_ORGANISM and the explanations say so explicitly. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged.

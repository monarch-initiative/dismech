  summary: 'Create: Holoprosencephaly 9 (GLI2)'
  details: |
    De novo curation of Holoprosencephaly 9 / GLI2-related disease (MONDO:0012563). Deep research was run with the claude_code provider (research/Holoprosencephaly_9-deep-research-claude_code.md; 18 web searches, 33 citations) and treated as a lead-generation source only: every PMID, snippet and ontology term was independently re-verified against cached abstracts and OAK. Named-entity-confusion preflight passed - MONDO:0012563 names GLI2 (HGNC:4318) as causal gene and cross-references OMIM:610829, matching the source literature. Two HPO terms suggested by the report (HP:0004926, HP:0030082) do not denote what it claimed and were replaced with OAK-verified terms. The entry models the spectrum with two subtypes (pituitary anomaly plus postaxial polydactyly, i.e. the Culler-Jones presentation, versus frank holoprosencephaly), an 11-node pathophysiology chain running from GLI2 loss of function through attenuated Hedgehog transcriptional output to four tissue-level patterning defects (ventral forebrain midline, Rathke pouch, limb bud, first branchial arch), three competing mechanistic hypotheses (haploinsufficiency CANONICAL, allele-specific dominant negative ALTERNATIVE, gene-environment second hit EMERGING), 24 phenotypes with frequency bands taken from the Corder 2022 (PMID:34921505) and Aouchiche 2025 (PMID:39938560) cohorts, 3 MRI imaging findings, 4 animal models, 5 treatments, 5 differential diagnoses and 3 discussions (nomenclature CONTROVERSY, penetrance-modifier KNOWLEDGE_GAP, mouse-heterozygote HUMAN_MODEL_MISMATCH). One conformance is declared, to limb_digit_patterning_serial_homology at the Disrupted Digit Number and Identity Specification node; conformance to ciliopathy_dysfunction was deliberately not declared because GLI2 acts downstream of the primary cilium. A self-review pass then applied frequency-evidence discipline per docs/frequency-evidence-guidelines.md: frequency bands were removed from the 16 phenotypes whose sources report no proportion and no explicit frequency word, leaving 9 of 25 phenotypes banded, each backed by a cited percentage or an explicit "frequently"/"common" statement. The same pass replaced HP:0001249 (Intellectual disability) with HP:0012759 (Neurodevelopmental abnormality) for the "neurocognitive disorders (38%)" phenotype, since the narrower term overstated the source, and added a quantitative second citation (PMID:22967285, 2 of 24 patients) for the diabetes insipidus OCCASIONAL band. Validation: just validate passes (schema plus term validation); all 114 evidence snippets independently confirmed as exact substrings of their cached abstracts, and every evidence item carries a reference_title backfilled from the cache; compliance 90.5 percent global and 90.7 percent weighted; folded-hyphen guard clean; downstream, subtype, conforms_to and attaches_to foreign keys all resolve.

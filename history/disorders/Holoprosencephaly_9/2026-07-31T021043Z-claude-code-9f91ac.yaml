  summary: Bind diagnosis_term on all four diagnosis entries
  details: |
    Follow-up to the optional (non-blocking, blue) suggestion from the ai4c-reviewer approval round on PR #7246, which merged before this was ready. All four diagnosis entries now carry a diagnosis_term: Pituitary MRI to MAXO:0000424 magnetic resonance imaging procedure, Anterior pituitary hormone assessment to MAXO:0000604 endocrine testing, GLI2 molecular testing to MAXO:0000127 genetic testing, and Chromosomal microarray to MAXO:0001612 chromosomal microarray testing. The reviewer supplied two of these identifiers (MAXO:0001612 and MAXO:0000127); both were independently re-verified with OAK rather than taken on trust, and the remaining two were sourced by OAK lookup. preferred_term is set more specifically than the ontology label where the repo convention allows it (pituitary magnetic resonance imaging, anterior pituitary hormone axis testing, GLI2 sequencing) while term.label matches the canonical MAXO label exactly. No evidence items, phenotypes or pathophysiology nodes were touched. Validation: just validate passes (schema plus term validation); compliance rose from 90.7 to 90.8 percent global and 91.0 to 91.1 percent weighted. Branch was restarted from origin/main after PR #7246 merged, per the merged-PR rule that a merged pull request cannot track new work.

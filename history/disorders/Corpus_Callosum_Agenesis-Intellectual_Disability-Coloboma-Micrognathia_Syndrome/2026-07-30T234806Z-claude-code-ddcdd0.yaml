  details: |
    Created de-novo entry for MONDO:0010333 Graham-Cox syndrome / MRXS28, X-linked, gene IGBP1/Alpha4. Deep research via claude_code provider; falcon unavailable 402 Payment Required, openscientist queued. Curated from the defining single-family paper PMID:14556245 two brothers: agenesis of corpus callosum, ocular coloboma iris+optic nerve, high forehead, severe retrognathia/micrognathia, low-set cupped ears, sensorineural hearing loss, pectus excavatum, scoliosis, short stature; choanal atresia and VSD/PDA in one brother. Mechanism: IGBP1/Alpha4 as PP2A regulatory subunit, IN_VITRO PMID:9792806, interacting with MID1 Opitz GBBB overlap; modeled as an EMERGING mechanistic_hypothesis. Added KNOWLEDGE_GAP discussion capturing PMID:23871722 Piton/Mandel AJHG 2013 flagging IGBP1 as an XLID gene needing replication. Single-family prevalence recorded as CASES_IN_LITERATURE / NOT_YET_DOCUMENTED. No GeneReviews chapter. Validated with just validate and compliance 98.6%.

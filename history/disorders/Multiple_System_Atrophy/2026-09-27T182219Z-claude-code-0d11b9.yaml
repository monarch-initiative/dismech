  summary: 'Genetics pass: regional degeneration nodes, gene and phenotype wiring,
    MONDO hierarchy finding'
  details: |
    Genetics pass for the d2g gap list in issue 12280. The issue's single row for this parent was
    MONDO:0014889 striatonigral degeneration, childhood-onset, whose MONDO OWL axiom records
    hgnc:25507 VAC14.

    Anchor audit first, and this is the finding of the pass. The entry binds MONDO:0007803 multiple
    system atrophy, which is exactly the disease it models. Read live from OLS4, that class has four
    children: MONDO:0003122 striatonigral degeneration, MONDO:0016418 MSA cerebellar type,
    MONDO:0020352 MSA parkinsonian type, and MONDO:0018608 pure autonomic failure. MONDO:0003122 is
    the route the row arrived by, and it is a conflated class. Its own definition calls it "a type of
    multiple system atrophy (MSA)", but its other parents are inborn errors of metabolism and
    inherited neurodegenerative disorder, and all three of its children are inherited striatal
    degenerations: MONDO:0000211 autosomal dominant striatal degeneration, MONDO:0010080 familial
    infantile bilateral striatal necrosis, and MONDO:0014889 itself. So every inherited striatal
    degeneration in that branch is classified beneath a sporadic adult-onset disease. The anchor is
    correct and was left alone; what is wrong is one level down in MONDO.

    Row disposition: declined structurally. MONDO:0014889 is a distinct autosomal recessive
    childhood disorder (OMIM:617054, Lenk-Ploski syndrome), MONDO's second parent for it is
    inherited dystonia, and its closest sibling under MONDO:0003122 is already curated here as its
    own Disease entry, kb/disorders/Autosomal_Dominant_Striatal_Neurodegeneration.yaml bound to
    MONDO:0000211. That precedent is followed: the concept is nominated as
    stubs/Striatonigral_Degeneration_Childhood-onset.yaml with entry_type DISEASE, and the MONDO
    hierarchy finding is recorded in this entry's notes so the next curator who meets the same row
    does not have to rediscover it. The VAC14 gene-disease claim itself was deliberately not
    researched, because researching a checklist row in order to justify declining it is the backward
    move; the stub says so and says it must be established from primary literature when the entry is
    curated.

    Two concepts were retired while the anchor was being read. MONDO:0020352 and MONDO:0016418 are
    now bound as subtype_term on the existing MSA-P and MSA-C rows, which previously carried no
    CURIE.

    Pathograph wiring, which is where the real gap was, and it was the worst of the three parents in
    this issue. Before this change all six pathophysiology nodes had no outgoing edge and none of the
    ten phenotypes had an incoming causal edge, so the entry was six disconnected mechanism islands
    beside ten disconnected phenotypes. The entry's own top-level description already asserted
    "widespread neuronal loss across striatonigral, olivopontocerebellar, and autonomic systems"
    without any node representing it, which is the gap that made the graph unconnectable. Five nodes
    were added to close it: Secondary Neuronal Degeneration as the hub the oligodendroglial,
    bioenergetic and inflammatory mechanisms converge on, then Striatonigral Degeneration,
    Olivopontocerebellar Degeneration, Central Autonomic Network Degeneration and Laryngeal Abductor
    Denervation as the regional patterns that reach the phenotypes. Each carries UBERON locations
    read from OLS4 in the same step and exact-quote evidence.

    Three references were fetched for this: PMID:40719373 for the brainstem and spinal autonomic
    nuclei, PMID:40556494 for the preganglionic localization and the medulla-to-orthostatic-hypotension
    correlation, and PMID:36407156 for the posterior cricoarytenoid autopsy finding behind stridor.
    SNCA and COQ2 were bound as genes descriptors on the nodes their own evidence already names, with
    CURIEs read live from rest.genenames.org: hgnc:11138 SNCA, hgnc:25223 COQ2.

    Measured with dismech.qc_plugins on the committed tree, before and after:
      genetic[].mechanism_outlink      0/2 -> 2/2
      phenotypes[].causal_inlink       0/10 -> 8/10
      pathophysiology nodes with no downstream edge  6 -> 0

    Two phenotypes are deliberately left unwired. REM sleep behavior disorder and dysphagia both
    have real anatomical substrates in this disease, but the sources reachable here describe them
    clinically rather than localizing them, and the nearest candidate quote localizes only "the
    pathways regulating sleep and wake" without naming a structure. Adding a node on that would be
    asserting anatomy the source does not give.

    Validation on the committed tree: just validate, just validate-terms and just validate-disorders
    all pass; 45/45 snippets verified by just count-verified-snippets after reverting the 15
    reference caches that fix-references-cache renormalised during the run. just check-genereviews
    reports NO_CHAPTER, confirmed against cache/bookshelf/genereviews.csv. Neither ClinGen nor
    Orphanet could be consulted: data/clingen and data/orphadata hold only MANIFEST.yaml in a fresh
    worktree, no CGGV cache among the 673 committed mentions VAC14, and ORPHA:102 is not among the
    368 committed Orphanet caches.

    A second MONDO observation is recorded in the entry's notes for a maintainer to judge:
    MONDO:0018608 pure autonomic failure is filed as a child of MONDO:0007803, although its own
    definition describes it as a neurodegenerative disease of the sympathetic branch of the autonomic
    nervous system rather than as a form of multiple system atrophy.

  summary: Curate occupational exposures and the pesticide null
  details: |
    Replaced the single placeholder entry with four, of which the most important is a null.

    Occupational pesticide exposure assessed with a formal job-exposure matrix shows no
    relationship with this disease (PMID:15272223, graded REFUTE), in a study that enrolled
    Parkinson disease patients as a comparison group. This is the clearest demonstration
    that the pesticide association established for Parkinson disease does not transfer here,
    and it is curated as content with no mechanism link so the entry distinguishes an
    exposure studied and found null from one never studied.

    The positive occupational evidence is one unreplicated case-control study reported at
    second hand through a review (PMID:11487219), graded REVIEW_SYNTHESIS for that reason
    and linked to the defining oligodendroglial lesion as PREDISPOSES with unknown
    intermediates. That review's statement that only one case-control study of this disease
    exists is quoted in its own right, because the size of the evidence base is the main
    reason exposure claims here cannot be graded as they can for Parkinson disease.

    Smoking is recorded as an unlinked observation rather than a protective exposure: both
    sources report cases smoking less often than controls, but the Aquitaine study found
    this significant only for its Parkinson disease comparison group and a mere tendency for
    this disease, so asserting protection would overstate it.

    The original Unknown Environmental Triggers entry is retained with its evidence intact,
    its note expanded to say it now sits beside exposures that have actually been examined.

    Provider: OpenScientist (autonomous mode, 5 iterations, 52 citations, 20 minutes).
    The report is committed at research/Alpha_Synucleinopathies-environmental-exposures-deep-research-openscientist.md
    with its citations sidecar and HTML/PDF artifacts. Falcon was unavailable for this
    run (the configured Edison key returns 403), so no second provider corroborates it.

    Every quoted sentence was read from the cached abstract in references_cache/ rather
    than from the report, and several of the report's figures were corrected or qualified
    against source in the process. The report was treated as a lead throughout.

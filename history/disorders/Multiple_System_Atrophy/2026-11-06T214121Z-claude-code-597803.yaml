  summary: Add nOH mechanism chain conforming to the module, link drugs, add atomoxetine
    and pyridostigmine
  details: |
    Central Autonomic Network Degeneration now conforms to the neurogenic_orthostatic_hypotension module central lesion node; its edge to Orthostatic Hypotension is rerouted through two new conforming nodes, Deficient Norepinephrine Release on Standing and Failure of Baroreflex-Mediated Vasoconstriction. Added target_mechanisms to fludrocortisone, midodrine and droxidopa. Added atomoxetine and pyridostigmine with MSA-specific evidence, including two REFUTE items: the Okamoto 2019 crossover in which MSA patients responded no better than peripheral autonomic failure, and the 4-week trial MSA subanalysis (PMID:39294522). All references were already cached. Validated with just validate, validate-terms, count-verified-snippets (63/63), check-causal-targets, check-entity-refs, check-snippet-grading, check-snippet-length and check-reference-titles.

  summary: 'Review round 2: unstratify chronic diarrhea, add failure to thrive and
    three further Table 1 phenotypes'
  details: |
    Addresses both IMPORTANT items of the second review round on dismech#18381, plus the phenotype suggestions, in one push.

    Chronic diarrhea unstratified. The row carried subtype Complete, taken from the sentence describing P2 from early infancy. Table 1 of PMID:41103553 records diarrhoea for both of Morgan's splice-allele patients as well, in the row listing recurrent respiratory tract infection, otitis media, candidiasis, diarrhea, and failure to thrive. The subtype scoping is removed, the description now says the finding is not confined to either form, and that Table 1 row is added as a second evidence item beside the existing P2 sentence. Chronic oral candidiasis was already unstratified, so the two rows are now treated consistently.

    Failure to thrive added, bound to HP:0001508, carried by the same Table 1 row. It is recorded for both splice-allele patients and for the Iranian complete-loss patient, with a deceased sibling also affected, so it spans both forms and is left unstratified.

    Three suggested phenotypes added. Recurrent otitis media (HP:0000403) from the same Table 1 row, unstratified. Vitiligo (HP:0001045) and alopecia areata (HP:0002232 Patchy alopecia, which carries Alopecia areata as an exact synonym) from the splice-allele patient's row, both scoped subtype Partial. The subtype scoping on those two is a deliberate claim rather than a transcription of where the row sits: the partial form leaves a residual alpha-beta T cell compartment that the complete form does not, which is the precondition for an autoimmune feature, so recording them against Partial says something the entry can defend. Diarrhoea, otitis media and failure to thrive carry no subtype because infection and growth failure follow from the deficiency in either form.

    HPO terms were resolved in OLS rather than written from memory. HP:0002232's canonical label is Patchy alopecia, so the binding carries that label with Alopecia areata as the preferred_term.

    Not added. The two further case reports the deep-research report cites, a Turkish sibship and a Canadian newborn-screening case, are not used: neither is in references_cache, and citing a paper through a deep-research report's description of it is not evidence. The GO:0032395 binding and the CAUSATIVE grade are left as they are, both being explicitly non-blocking in the review.

    Validation: just validate passes with 46 of 46 snippets and 46 titles verified, up from 41.

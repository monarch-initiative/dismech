  summary: 'Review round 1 and deep research: TCR-alpha-beta-positive T-cell Deficiency'
  details: |
    Addresses the first review round on PR 18381 and adds the deep-research artifact the review SOP requires. Ontology correction: GO:0042608 T cell receptor binding was bound to the node about failed surface assembly. GO defines that term as binding to a T cell receptor, which is what a ligand does, so with LOSS_OF_FUNCTION attached the node asserted that something fails to bind the TCR, which no source claims. Replaced with the cellular component GO:0042101 T cell receptor complex, DECREASED. Typing correction: the root node carried functional_impact_category LOSS_OF_FUNCTION, which also covered the splice allele the entry itself calls hypomorphic; now PARTIAL_LOSS_OF_FUNCTION, with the per-allele distinction carried by has_subtypes and the variant records. CI gate: check-gene-activity-grounding failed because TRAC was wired into the pathograph on a node binding no molecular function. GO annotates exactly one molecular function to TRAC, GO:0032395 MHC class II receptor activity, experimentally supported by PMID:1323144 with ECO:0000314, read from QuickGO through the UniProt accession P01848 rather than chosen for fit. It is bound with LOSS_OF_FUNCTION and the node states that it is narrower than the receptor's role, since alpha-beta T cells also recognise peptide on MHC class I. Content: the Complete subtype previously had no phenotypes of its own, only prose, so BCGosis (HP:0020087) is added stratified to it, together with chronic diarrhea and chronic oral candidiasis from the same report, and hepatosplenomegaly from the Indian kindred. The adaptive-immunity node gained the patients' own infection burden as evidence rather than resting on a conclusion sentence about non-redundancy. Deep research: the requested provider was openscientist, which failed on every attempt. Six runs were cancelled by the client timeout in dismech#10387 and two more failed server side at report generation with a stream idle timeout, filed as dismech#18386. The sanctioned --fallback flag does not engage on either failure mode, only on an unregistered provider, so the substitution to claude_code was made by hand and is recorded here and in that issue rather than in report frontmatter. The committed report is research/TCR-alpha-beta-positive_T-cell_Deficiency-deep-research-claude_code.md: 25 of 25 references verified at a confabulation rate of 0.0, and just preflight-dr against MONDO:0014160 returns PASS with TRAC mentioned 142 times and the MONDO OMIM cross-reference present. The report supplied the curated HPO annotation set for OMIM:615387, which is where the added phenotypes came from; only those with an exact quote in a cached reference were taken. One ontology note: the report and the OLS search both give HP:0009098 as Recurrent oral thrush, while the repository's term validator holds Chronic oral candidiasis as the canonical label, and the validator's label is the one bound. Validation: validate-disorders passes with 41 of 41 snippets and 39 titles verified, and the gene-grounding, entity-ref, causal-target, coarse-phenotype, enum-value and logical-rule gates all pass.

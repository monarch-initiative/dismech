  summary: 'Create: TCR-alpha-beta-positive T-cell Deficiency'
  details: |
    New entry for TRAC-related TCR alpha chain deficiency (MONDO:0014160, IMD7), curated from PMID:21206088 (Morgan 2011, founding report and the c.*+1G>A allele), PMID:33909184 (Rawat 2021, three Indian siblings, lymphoma, TCR repertoire skewing) and PMID:41103553 (2025, two Iranian patients with premature stop codons plus Jurkat reconstitution assays). The 2025 study is what shapes the entry: it shows the recurrent splice allele is hypomorphic rather than loss of function, which splits the disease into a SCID-like complete form and a CID-like partial form. Those are recorded as has_subtypes rows, with the subtype-divergent phenotypes stratified by subtype foreign key. Pathophysiology is a linear chain from the biallelic TRAC variant through failure to assemble a surface TCR-alpha-beta complex, arrest of alpha-beta thymocyte selection, loss of alpha-beta adaptive immunity and immune dysregulation, to the infectious, autoimmune, atopic and lymphoproliferative phenotypes. ClinGen rates TRAC Moderate for exactly this MONDO term; the assertion is transcribed into gene_disease_validity with its CGGV record cited and cached. relationship_type is left CAUSATIVE, so check-gene-validity reports the record as overstated. That is deliberate and the reason is written into the gene's notes: biallelic TRAC variants are mendelian-sufficient and three alleles were shown to abolish surface TCR assembly against a wild-type control, so the Moderate tier reflects patient numbers rather than mechanistic doubt, and strength belongs in gene_disease_validity rather than in relationship_type. Two schema limits were hit and worked around rather than fought: Subtype has no distinguishing_features slot and Variant has no subtype slot, so both were folded into the relevant description fields. One ontology gap is recorded in notes: HPO has no term for a decreased alpha-beta T cell proportion, although it carries both directions for gamma-delta, so the defining laboratory finding is modelled as a pathophysiology node and through the gamma-delta expansion. Validation: just validate-disorders passed with 33 of 33 snippets and 33 titles verified; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-logical-rules, check-delivery-system and check-genereviews all pass, and check-gene-validity exits 0. The OpenScientist deep-research run for this disease was still queued when the entry was written, so the entry rests on the primary literature; the report will be reconciled against it before the pull request is opened.

  summary: 'Create: Periventricular Nodular Heterotopia 8 (ARF1)'
  details: |
    Created PVNH8 (MONDO:0032588) as its own autosomal-dominant disorder entry following the PVNH9 per-type precedent (parent: Periventricular Nodular Heterotopia). Causal gene ARF1 (hgnc:652). Built a four-node causal chain: ARF1 GTPase cycle dysregulation -> Golgi vesicular trafficking failure -> radial glial/neuroependymal integrity failure -> neuronal migration failure -> PVNH. Phenotypes: PVNH (variable, 3/15), intellectual disability, developmental delay, seizures, microcephaly, corpus callosum hypoplasia, hypotonia, sensorineural hearing impairment, polymicrogyria, micrognathia. Recorded the haploinsufficiency-vs-constitutive-activation mechanism controversy as a CONTROVERSY discussion. Evidence from primary literature (PMID:34353862 Gana 2022 foundational; PMID:37185208 spectrum cohort; PMID:36345169 R99H constitutive activation; PMID:39052890 functional+in utero electroporation; PMID:24089482 FLNA-ARFGEF2-ARF1 mouse mechanism; PMID:40689678 first Chinese case, p.Leu170Pro, PVNH-absent). Deep research: requested falcon (no EDISON/FUTUREHOUSE key); produced by openscientist via --fallback (research/Periventricular_Nodular_Heterotopia_8-deep-research-openscientist.md); preflight-dr PASS (ARF1 x62, OMIM 618185 match); report refs 8/8 verified, 0 confabulation. The report corroborated the manual curation and surfaced no new on-topic references to add (two other PMIDs off-topic; one Drosophila neuroblast-polarity paper left out as model-distant). A fresh-context red-team review drove three fixes folded in here: corrected a clinical snippet mis-graded IN_VITRO to HUMAN_CLINICAL (caught by check-snippet-grading); rebalanced the mechanism controversy after finding PMID:37185208's own pulldown shows DECREASED ARF1 activity, conflicting with the constitutive-activation reading for the same R99H variant; and consumed the previously-uncited PMID:40689678 as the p.Leu170Pro variant. Declined to wire polymicrogyria downstream of the migration node (parallel cortical-organization defect, not a sourced downstream consequence). No GeneReviews chapter exists (checked offline + PubMed genereviews[book]). Validated: just validate, validate-terms, validate-disorders, count-verified-snippets 32/32, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-snippet-grading all pass.

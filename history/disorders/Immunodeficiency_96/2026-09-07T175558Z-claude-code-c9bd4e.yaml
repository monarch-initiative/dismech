  summary: 'Review round 1: evidence_source regrading (PR #11372)'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES verdict on PR #11372. Blocking fix: the PMID:36341401 clonogenic-survival snippet ('Fibroblasts cultured from skin biopsy showed an intermediate sensitivity to ionizing radiation') was graded HUMAN_CLINICAL in all three places it appears; a clonogenic assay on cultured skin fibroblasts is IN_VITRO under the CLAUDE.md classification rules regardless of the publication being a case report, and the adjacent PMID:38896336 fibroblast snippet in the same file was already graded IN_VITRO, so the same class of evidence was graded two ways within one entry. Regraded all three to IN_VITRO. Also took all three non-blocking suggestions. The PMID:30395541 snippet on the Lig1 R771W FAILS_TO_RECAPITULATE link was changed from REFUTE to SUPPORT: the link's own claim is that the model fails to recapitulate, and the preserved-haematopoietic-lineages result establishes that claim, so the direction is SUPPORT; CLAUDE.md is explicit that supports records direction rather than whether the underlying result is negative. The reviewer noted the KB is split 157 SUPPORT / 54 REFUTE on FAILS_TO_RECAPITULATE evidence, so this is a KB-wide ambiguity rather than a defect introduced here. Added therapeutic_agent NCIT:C254 (Anti-Infective Agent) to the Antimicrobial prophylaxis treatment, which is the class term matching a source that names antibiotics plus anti-viral, anti-fungal and anti-Pneumocystis prophylaxis rather than individual drugs. Regraded two PMID:36341401 mechanistic-inference snippets from HUMAN_CLINICAL to OTHER ('As result, Okazaki fragments are improperly catalyzed...' and both occurrences of 'Macrocytic anemia probably results from an impaired DNA synthesis...'), since these are the authors' hedged interpretation rather than measured findings; both occurrences of the macrocytic-anemia snippet were changed together so no snippet-grading divergence is introduced. No new references, no new reference_cache files, and no new ontology term rows were needed (NCIT:C254 was already in cache/ncit/terms.csv and in the chemicalentityterm enum cache). Validation after the change: just validate passed with 96/96 snippets verified, just validate-terms passed, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values and check-snippet-grading are all clean.

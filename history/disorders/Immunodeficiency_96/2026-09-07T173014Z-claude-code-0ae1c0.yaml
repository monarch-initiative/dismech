  summary: 'Create: Immunodeficiency_96'
  details: |
    De novo creation of the IMD96 (LIG1 / DNA ligase I deficiency) entry from the stub stubs/Immunodeficiency_96.yaml, which is deleted in the same change.

    LUMP/SPLIT. entry_type DISEASE. MONDO:0030693 is a leaf: one parent (MONDO:0021094 immunodeficiency disease), no descendants, and one causal-gene relation (RO:0004003 -> hgnc:6598 LIG1), confirmed against the committed stub and re-read from the MONDO OBO record while checking xrefs. Not a grouping (nothing below it), not a subtype (no curated parent disease it refines), not out of scope (it carries a mechanism).

    DEEP RESEARCH. falcon was requested and failed twice with HTTP 402 ProviderBillingError (Edison account out of credits). The re-run used 'just dr_fallback=--fallback research-disorder falcon Immunodeficiency_96', which fell back to openscientist. The report that was actually used and is committed is research/Immunodeficiency_96-deep-research-openscientist.md (frontmatter records fell_back: true, requested_provider: falcon), with its .citations.md sidecar and an _artifacts/ directory holding the provider's HTML and PDF renderings. No falcon report exists.

    REPORT VALIDATION. reference_validation: 4 total references, 4 verified, 0 not found, confabulation_rate 0.0, no unresolved_references; 2 of 4 assessed as on topic. term_validation: needs_review true - 56 terms, 53 verified, 0 not found, 1 obsolete (GO:0006266 'obsolete DNA ligation'), 2 unverifiable, 7 mislabelled. Every one of the 7 mislabelled entries is a parsing artifact where the report's frequency annotation ('2/5; Maffucci 2018') was read as a second label; the ontology labels themselves matched. The obsolete GO:0006266 was independently caught by 'just validate-terms' when I had used it for the abortive-ligation node, and was replaced with GO:0003910 (DNA ligase (ATP) activity, modifier ABNORMAL). No CURIE from the report was bound without independent OAK lookup.

    PREFLIGHT. 'just preflight-dr research/Immunodeficiency_96-deep-research-openscientist.md MONDO:0030693' returned WARN: rival gene 'HP' at 17 mentions (59% of LIG1's 29). Resolved as a false positive - every bare 'HP' in the report is the ontology prefix quoted inside the report's own auto-generated Term Validation section, not haptoglobin (verified by grepping bare-HP occurrences: all are on lines 568 and 1120-1139, inside that section). Identity otherwise confirms: LIG1 dominant, report OMIM 619774 == MONDO xref OMIM:619774. AR=4 is the autosomal-recessive abbreviation; BLM=2 and PCNA=2 are legitimate mentions (Bloom syndrome as the historical differential, PCNA as LIG1's binding partner). Proceeded on that basis.

    GENEREVIEWS. No GeneReviews chapter exists. PubMed search '(DNA ligase I deficiency OR LIG1 deficiency OR immunodeficiency 96) AND GeneReviews[All Fields]' returned 0 results. The phenotype baseline is therefore the primary literature (Maffucci 2018 JCI, the 1992 index reports, the 2022 and 2024 case reports) plus the IUIS 2022 classification table, and this is recorded in the entry's notes.

    REFERENCES USED. PMID:30395541 (Maffucci 2018, disease-defining series, full text), PMID:1351188 (Webster 1992 Lancet, index patient), PMID:1581963 (Barnes 1992, 46BR biochemistry), PMID:36341401 (2022 Omenn-like SCID case), PMID:38896336 (2024 A624T SCID case, with the aggregate table of all reported patients), PMID:39510190 (2024 rare-variant biochemistry), PMID:31630206 (ligase deficiency review), PMID:30725883 (chromosome instability syndromes), PMID:35748970 (IUIS 2022 classification), PMID:11896201 (Bentley 2002 Lig1-null mouse, taken from the DR report's key-reference list). All fetched with 'just fetch-reference'; none hand-written.

    NOT USED, AND WHY. PMID:42527943 (2026 cyclosporine single-case report, further compound heterozygous LIG1 children) was fetched and PubMed exposes no abstract or full text for it - the cache is content-empty - so no exact-quote snippet is obtainable and nothing in the entry rests on it. Its existence is recorded in the entry's notes so the patient counts read as a floor for the 1992-2024 window rather than as a current total, and its cache file was pruned rather than committed. PMID:33087274 (Human DNA ligases in replication and repair) was fetched, not cited, and pruned. The DR report's HPO frequency table (n/N per phenotype) was read and deliberately not transcribed: with eight published patients an HPO frequency band implies precision the literature does not have, so no phenotype carries 'frequency:'. The DR report gives MedGen as C5676930, which is the UMLS CUI; MONDO's actual MedGen xref is 1810465, and the corrected identifiers are what the entry records.

    MODELING DECISIONS. Eight-node pathophysiology chain from biallelic hypomorphic LIG1 alleles through failed Okazaki-fragment ligation and abortive ligation, to persistent nicks and replication-associated breaks, to genomic instability, branching into lymphoid, erythroid and somatic-hypermutation arms. The edge from the cellular damage phenotype to the lymphoid phenotype is deliberately INDIRECT_UNKNOWN_INTERMEDIATES and cited to PMID:31630206, which states that the cause of the immunodeficiency in DNA ligase I deficiency is not known - this is the central open question and is also carried as a KNOWLEDGE_GAP discussion. functional_impact_category is PARTIAL_LOSS_OF_FUNCTION, not LOSS_OF_FUNCTION, because no reported genotype is a double null. No conforms_to was declared: genome_instability_mutation and dna_repair_synthetic_lethality are cancer-facing and genomic_instability_aging is aging-facing, and none of their node chains is what this constitutional replication defect produces; the reasoning is recorded in the entry notes. mappings carries an NCIT exactMatch to NCIT:C122658 (DNA Ligase I Deficiency); no ICD-10-CM or ICD-11 mapping is asserted because the closest codes are unspecified-immunodeficiency codes. Five discussions record real open questions, including the 2024 rare-variant work that makes the catalytic-efficiency-versus-abortive-ligation question answerable. The Lig1-null mouse is curated with a PARTIALLY_RECAPITULATES and a RECAPITULATES link plus a REFUTE evidence item for the R771W knock-in, because both models fail to reproduce the human immune phenotype and that failure is informative.

    PATIENT COUNTS. Corrected mid-curation against the aggregate table in PMID:38896336: eight published patients (1992 index + 5 in Maffucci 2018 + 1 in 2022 + 1 in 2024), four transplanted, four with entirely normal growth, seven of eight with normal mentation. An earlier draft said nine and was wrong.

    VALIDATION RUN AND READ TO COMPLETION. 'just validate' pass; 'just validate-terms' pass; 'just count-verified-snippets' 96/96 verified against cached references; 'just check-duplicate-keys', 'just check-entity-refs', 'just check-causal-targets', 'just check-qualifier-terms' (0 qualifier terms in this entry), 'just check-enum-values' all OK; 'just check-folded-hyphens', 'just check-snippet-length', 'just check-title-snippets', 'just check-snippet-grading', 'just check-reference-titles' all OK with no new baseline entries; 'just check-environmental-evidence' OK (both new exposures carry entry-level evidence, no waiver used); 'just check-not4curation' OK; 'just check-source-defect-claims' reports nothing for this file. 'just normalize-cache' and 'just check-term-cache-integrity' clean. 'just validate-disorders kb/disorders/Immunodeficiency_96.yaml' passed end to end (schema, terms, references). No DOI-keyed evidence is used, so --unskip-prefix DOI was not needed.

    CACHE NOTE. cache/go/terms.csv gains a row for GO:0006266 'obsolete DNA ligation'. That row was written by 'just validate-terms' during the draft in which I had bound the now-obsolete term, and it is left in place rather than hand-deleted: it is a correct, tool-derived label row, hand-editing cache rows is against the repository contract, and the row is useful - a future curator reaching for GO:0006266 now gets a cache hit telling them it is obsolete. The entry itself does not reference it. Every other cache addition (GO:0033567, GO:0003910, HP:0500270, MONDO:0030693, NCIT:C122658, NCIT:C15409 and the matching enum-membership rows) is a term this entry binds. CL and ECTO terms used here were already cached, so those files are untouched.

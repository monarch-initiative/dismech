  summary: Map Fanconi Anemia to OMIMPS:227650
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS227650 represents the Fanconi anemia syndrome through its complementation groups, matching the syndrome-level scope of this Disease and MONDO:0019391. The January 2026 snapshot has 22 records, including FAAP100-related group X; the existing entry does not yet have a dedicated FA-X subtype row. That is a curation gap rather than a different syndrome boundary. Defective Fanconi anemia DNA crosslink repair unites the clinical syndrome, with core-complex, ID-complex, and downstream-effector differences retained as internal subtypes. The mapping does not assert uniform recessive inheritance, universal marrow failure, or equivalence with heterozygous BRCA-associated cancer susceptibility.

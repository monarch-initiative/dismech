  summary: Add subtype-scoped neuroblastoma phenotypes for FA-D1 and FA-N
  details: |
    Adds two phenotypes bound to HP:0003006 Neuroblastoma, after the existing FA-D1 Nephroblastoma row: Neuroblastoma in FANCD1/BRCA2 (subtype FA-D1) and Neuroblastoma in FANCN/PALB2 (subtype FA-N). They let the entry join the neuroblastoma predisposition grouping. Part of the neuroblastoma expansion series (issue 15822).

    Evidence: a pooled series of published and NCI-cohort cases (PMID:34687993, newly cached, full text) in which neuroblastoma was the first or only cancer in 4 of the 66 FANCD1 patients with a cancer and in 1 of 16 FANCN patients, every case was diagnosed before age five, and these embryonal tumours were reported almost exclusively in FANCD1 or FANCN; plus one case report per subtype (PMID:26834852 for FA-D1 and PMID:23112754 for FA-N, both newly cached). The FA-D1 row is banded OCCASIONAL from the 4 of 66 share; its explanation states the denominator (patients with a cancer, 66 of the series' 71 FANCD1 patients) and the authors' caveat about literature-based ascertainment. The FA-N row has no band, because one case is too few.

    No causal edges: the rows' notes say that the cited series offers a mechanism only as a hedged, untested hypothesis, so the rows are left unlinked rather than given an edge without evidence. The existing FA-D1 tumour rows, their edges and the subtype descriptions are unchanged.

    Validation: just validate-disorders, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates that CI runs, check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

  details: |
    Review round addressing the CHANGES_REQUESTED verdicts of 2026-09-16 on PR #11368. No new evidence, no new references, no new phenotypes.

    Correction to the record first: the previous session record (2026-09-16T004352Z-claude-code-ee5a25) states that the two discussions blocks "were unioned per CLAUDE.md (no block deleted)" and that check-duplicate-keys and validate pass. That is not true of what was pushed. Commit 3d6271b7ef carries two top-level 'discussions:' keys, at lines 7700 and 8002. History records are append-only, so that record is left as written and corrected here.

    The consequence was silent rather than loud for every gate except two. PyYAML keeps the last duplicate key, so the committed file parsed to the branch's five discussions and dropped main's eight - present as bytes, absent as content. check-entity-refs, check-causal-targets, check-enum-values and check-qualifier-terms all read through PyYAML and saw nothing wrong; only check-duplicate-keys and the ruamel-backed reference validator inside just validate went red, which is what took CI test (3.13) red.

    Union performed: one 'discussions:' key at main's position (after mechanistic_hypotheses, before notes), holding main's eight entries in their original order followed by the branch's remaining four. Neither side's block was deleted. Twelve entries rather than thirteen because the two mental-health gaps were reconciled rather than concatenated, per the review.

    - gap_fa_mental_health_burden (main) and gap_fa_psychosocial_mental_health (branch) attached to the same three phenotypes and asked the same question. Main's id is kept because it is already on main; the branch's candidate biological mechanisms (CNS involvement, endocrine dysfunction, chronic inflammation) are folded into its prompt and the branch's "no study separates disease-burden effect from biological contribution" point into its rationale. Nothing either side argued is lost.

    Freckling contradiction resolved in favour of the branch. Provenance: the merge base 759711e904 has no Skin Pigmentation Changes -> Freckling edge; main added it in 88c902707b (#11800), a bulk pass that wired 18 unexplained phenotypes to "their hubs" without freckling-specific evidence review; the branch withdrew the edge after reading PMID:32822789, and two review rounds endorsed that withdrawal. The edge is therefore not drawn. Checked rather than assumed: PMID:32822789 reports sun-exposed freckling associated with voriconazole exposure at OR 15.25 (95% CI 3.428-107.947), a drug phototoxicity route, and describes the skin-fold freckle-like macules as often hypopigmented or mixed - neither is embryonic melanocyte progenitor loss, which is what the Skin Pigmentation Changes node's description asserts. The OR and the reasoning are now recorded in gap_fa_cranial_nerve_and_freckling_mediation so the edge is not re-added by the next connectivity pass. Main's four other edges from that node, including the Axillary and Flexural Hyperpigmentation edge added by the same commit, are untouched.

    Two suggestions from earlier rounds that had not been taken, folded in here rather than deferred to another push:
    - The Holoprosencephaly edge description claimed the malformation is "reported with FANCO/RAD51C and other rare FA genotypes" where the phenotype's only evidence, PMID:29278735, is a single antenatally diagnosed FANCO/RAD51C case. The description now says that and says no other genotype is cited.
    - The FA endocrine consensus review appeared under two identities in one entry - eight PMID:25575015 citations and one url:PMC4333044 form - with nothing connecting them. The url item's explanation now states they are the same paper and why the url form is needed (the quoted sentence is in the body, and the PMID cache is abstract-only).

    One residual tension the review did not name, handled in prose rather than by an edit to main's curation: gap_fa_metabolic_mediation attaches to Obesity and Abnormal Circulating Lipid Concentration, but main added an Obesity -> Abnormal Circulating Lipid Concentration sequela, so the second phenotype is now connected. The sequela is a narrower claim than the one the gap denies - ordinary adiposity-to-dyslipidemia within the metabolic-syndrome cluster, not an FA-pathway mechanism - so it is retained and the rationale now says so.

    Connectivity after the union: 169 of 185 phenotypes connected (91%). The 16 unconnected are exactly the phenotypes named across the five knowledge gaps - Developmental Delay and Intellectual Disability; Obesity; Cranial nerve paralysis and Freckling; Anxiety, Depression and Diminished Mental Health; and the eight-phenotype occasional-somatic cluster minus Abnormal Circulating Lipid Concentration, which is now connected. No phenotype is unconnected without a recorded reason.

    Gates run on the result: just validate (444/445 snippets verified, 1 skipped by prefix - the figure the reviewer independently predicted for a correct union), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, validate-history, and uv run pytest tests/phenoagent (48 passed, 23 skipped).

    Not done: no re-audit of the entry's evidence items was attempted, and the overlapping pulmonary-fibrosis coverage between gap_fa_pulmonary_fibrosis_mechanism (main) and gap_fa_unexplained_somatic_phenotypes (branch) is left as the merge produced it - both sides are somebody's curation, they ask different questions, and collapsing them is a curation decision rather than a merge repair.

  summary: Correct inverted genotype-phenotype claim on radial-ray/thumb phenotype;
    structure VACTERL-H enrichment on FA-B and FA-I
  details: |
    Corrected an unevidenced - and, on checking, factually inverted -
    genotype-phenotype claim carried in free text on the "Absent or Hypoplastic
    Thumbs" phenotype.

    The claim as curated read: "More prevalent in core complex complementation
    groups (FANCA, FANCC, FANCG). The VACTERL phenotype is overrepresented in FA
    complementation groups D1, E, and F." None of the four evidence items attached
    to that phenotype supported either sentence - they covered limb malformation in
    FA generally (GeneReviews), radial rays in VACTERL patients (PMID:16015582), and
    a disease-level Orphanet frequency row.

    Checked against Fiesco-Roa et al., Blood Rev 2019 (PMID:31351673), a systematic
    review of 187 publications and 1101 FA cases with gene or complementation group
    identified - the standard source for FA genotype-phenotype association. Both
    sentences are contradicted:

    - VACTERL-H is enriched in FANCB (81%) and FANCI (41%), against 12% across FA
      overall - not in D1, E and F. The same sentence states that FANCA and FANCG
      patients had VACTERL-H LESS often, directly inverting the first claim.
    - At the pathway-tier level, "A lower proportion of patients with pathogenic
      variants in upstream genes had at least one abnormality (p<0.001) compared
      with the ID complex and downstream genes" - so core-complex/upstream variants
      carry fewer congenital abnormalities, not more.

    Fix applied:
    - The phenotype notes now state the evidenced direction and explain why the
      phenotype itself stays unqualified by subtype: radial ray and thumb defects
      occur across complementation groups, and it is only the VACTERL-H combination
      that shows a gene association. A PMID:31351673 evidence item with the exact
      quantitative sentence backs it.
    - The subtype-level claims were moved to where they are queryable: the FA-B and
      FA-I has_subtypes entries now carry the enrichment in their descriptions with
      their own PMID:31351673 evidence items.

    Deliberately NOT done: mass-qualifying the radial-ray/thumb phenotypes with
    subtype:. Only 1 of 141 phenotypes in this entry carries a subtype qualifier
    (early-onset solid tumors -> FA-D1), and that sparsity is defensible here -
    these limb defects genuinely occur across groups, so disease-level curation with
    Orphanet-sourced frequency bands is the honest representation.

    Validation: 334/334 snippets verified against cached references; schema and term
    validation pass.

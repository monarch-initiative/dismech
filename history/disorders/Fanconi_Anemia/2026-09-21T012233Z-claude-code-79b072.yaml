  summary: 'Review: wire 7 phenotypes left orphaned after #11368; record 9 deliberate non-connections'
  details: 'Rebuilt on top of main rather than rebased. This branch originally wired 61 of 66 orphan phenotypes;
    while it was in review, #11368 landed an independent phenotype and pathograph review of the same entry
    that wired most of the same ones. Rebasing would have meant resolving my 50-edge change against their
    264-line rewrite of the same file, with a real chance of silently reverting part of their work. The
    branch was reset to main and only the contribution that remains unique was re-applied.


    Six edges main still leaves unwired: cranial nerve paralysis and hyperreflexia from CNS Developmental
    Anomalies; obesity and feeding difficulties from Endocrine Gland Dysfunction; gingival overgrowth
    as a sequela of periodontitis; weight loss as a sequela of feeding difficulties. The hyperreflexia
    and feeding-difficulty edges say plainly that they are weak attributions - no source localises the
    lesion in the first, and feeding difficulty is multifactorial with no source separating the endocrine
    contribution.


    Three edges reinstated after a regression. #11368 split the neurodevelopmental phenotype into Developmental
    Delay and Intellectual Disability and left both without a parent, and Freckling lost its edge from
    Skin Pigmentation Changes in the same reorganisation. All three had incoming edges before that PR.
    They are now restored, with the split ones curated as separate claims - delay is about trajectory,
    disability about endpoint.


    Nine phenotypes are deliberately left unconnected, each with the reason in notes rather than description.
    The criterion throughout is the absence of any node in this entry whose described mechanism could
    produce the phenotype; source quality is a separate axis, carried by the link type and the edge description
    rather than by withholding an edge.


    The three psychiatric phenotypes describe the burden of living with the disease rather than a consequence
    of any node. Pulmonary fibrosis rests on one confounded case report with a conjectured mechanism.
    Reduced salivary flow has nothing cited saying what produces it, and nothing curated for it to lead
    to. Clubbing of toes and hypertrophic cardiomyopathy are an acquired soft-tissue change and myocardial
    disease respectively, so the only candidate parent - Congenital Structural Anomalies - has a scope
    that excludes them. Obesity and feeding difficulties were removed in review; see the round 6 paragraph
    below.


    Connected phenotypes 169 to 176 of 185, with 9 deliberately unconnected. Seven edges were wired: two
    to the CNS node, gingival overgrowth and weight loss as sequelae, and the three reinstated after the
    #11368 split.


    Review round 6. Two edges removed after review, and the reason is the sharper half of this record.
    Obesity and feeding difficulties had been drawn from Endocrine Gland Dysfunction citing that node''s
    mention of metabolic syndrome as authorisation; the node mentions those associations in order to DECLINE
    the causal route, saying in terms that they do not establish one. A disclaimer was read as a licence.
    Both are now deliberate non-connections.


    The stated non-connection criterion was also wrong and is corrected. It said the disqualifier was
    a phenotype whose only source is an ORPHA frequency row - but three edges this same change draws rest
    on exactly that kind of source. The real criterion is the absence of any node in the entry whose described
    mechanism could produce the phenotype; source quality is a separate axis carried by the link type
    and the edge description. The two were conflated.


    The gingival overgrowth edge was retyped from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES: its snippet
    reports co-occurrence rather than causation, and ciclosporin is a recognised cause of gingival overgrowth
    used in this population around transplantation, which nothing cited distinguishes from the periodontal
    route.'

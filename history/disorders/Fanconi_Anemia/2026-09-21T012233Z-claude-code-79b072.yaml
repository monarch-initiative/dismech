  summary: 'Review: wire the 9 phenotypes left orphaned after #11368; record 7 deliberate
    non-connections'
  details: |
    Rebuilt on top of main rather than rebased. This branch originally wired 61 of 66 orphan phenotypes; while it was in review, #11368 landed an independent phenotype and pathograph review of the same entry that wired most of the same ones. Rebasing would have meant resolving my 50-edge change against their 264-line rewrite of the same file, with a real chance of silently reverting part of their work. The branch was reset to main and only the contribution that remains unique was re-applied.

    Six edges main still leaves unwired: cranial nerve paralysis and hyperreflexia from CNS Developmental Anomalies; obesity and feeding difficulties from Endocrine Gland Dysfunction; gingival overgrowth as a sequela of periodontitis; weight loss as a sequela of feeding difficulties. The hyperreflexia and feeding-difficulty edges say plainly that they are weak attributions - no source localises the lesion in the first, and feeding difficulty is multifactorial with no source separating the endocrine contribution.

    Three edges reinstated after a regression. #11368 split the neurodevelopmental phenotype into Developmental Delay and Intellectual Disability and left both without a parent, and Freckling lost its edge from Skin Pigmentation Changes in the same reorganisation. All three had incoming edges before that PR. They are now restored, with the split ones curated as separate claims - delay is about trajectory, disability about endpoint.

    Seven phenotypes are deliberately left unconnected, each with the reason in notes rather than description: the three psychiatric ones, which describe the burden of living with the disease rather than a consequence of any node; pulmonary fibrosis, which rests on one case report with a conjectured mechanism; reduced salivary flow, where nothing cited says what produces it; and clubbing of toes and hypertrophic cardiomyopathy, which are an acquired soft-tissue change and myocardial disease respectively, not developmental malformations, and are sourced only from ORPHA frequency rows that give occurrence without mechanism.

    Connected phenotypes 169 to 178 of 185.

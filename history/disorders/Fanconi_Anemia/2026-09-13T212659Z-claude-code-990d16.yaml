  summary: 'Apply OpenScientist follow-ups: relabel progenitor effector node, add
    verified evidence, soften pulmonary fibrosis, record HPO immune-annotation gap'
  details: |
    Follow-ups from the six OpenScientist hypothesis reports, applied only after fetching and verifying each cited paper in the reference cache. Renamed the effector node Developmental Progenitor Apoptosis to p53-Dependent Developmental Progenitor Arrest and Apoptosis, rewrote its description to state p21-dependent G0/G1 arrest with apoptosis as one branch, added GO:0072331 and GO:0008285 bindings, and added three evidence items (PMID:22683204 p53/p21 arrest in FA hematopoietic cells, IN_VITRO INDIRECT; PMID:21734703 Aldh2 essential for Fancd2-null embryos; PMID:25280231 chick limb-bud radius loss without apoptosis, MODEL_ORGANISM INDIRECT); updated the one downstream target, the discussion entity reference and two prose mentions. Added evidence: FANCC knockdown reduces insulin and glucokinase in 1.1B4 beta cells (PMID:29901137) on the insulin-secretion phenotype and hypothesis; NK degranulation defect (PMID:30949167) and transplant-free cohort design (PMID:28557197) on the NK phenotype and hypothesis, plus the Fancc-null B-cell mouse (PMID:26895835) on the hypothesis; FA SCC copy-number signature (PMID:36450981) and the HNSCC review (PMID:40970532) on the HNSCC phenotype and hypothesis; Aldh2 and chick evidence (the latter as REFUTE of apoptosis-only) on the radial ray hypothesis. Rewrote the Pulmonary Fibrosis description to state that the sole case carried smoking, prednisone and TMP-SMX confounders and that the mechanism was the authors' conjecture, with two supporting evidence items and a notes waiver for the missing causal edge. Appended each hypothesis's provider verdict to its notes; all six remain EMERGING. Added a CURATION_TODO discussion recording that live HPO and Monarch queries found no immune annotation for Fanconi anemia, which needs an upstream HPO annotation request rather than a dismech edit. Assessment sidecars by claude-code are being added per report under kb/hypotheses/Fanconi_Anemia/*/assessments/.

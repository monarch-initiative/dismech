  details: |
    Added biological_scale: MOLECULAR to two pathophysiology nodes (DNA Repair Deficiency, Homologous Recombination Impairment) and model_scale: MOLECULAR to both FA/BRCA Boolean model links. Both resolve as ALIGNED. This is the useful negative case for the new slot: the Homologous Recombination Impairment link is PARTIALLY_RECAPITULATES, but for a reason that is not a scale gap -- the model reports pathway activation state rather than recombination fidelity. It demonstrates that model_scale is orthogonal to relationship and fidelity rather than a restatement of them, and that an ALIGNED result must be read as no scale gap, not as a good model.

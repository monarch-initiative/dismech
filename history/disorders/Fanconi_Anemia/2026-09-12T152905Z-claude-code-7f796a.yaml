  summary: 'Adopt HPO 2026-09-01 terms: HNSCC, first-phase insulin secretion, axillary
    hyperpigmentation'
  details: |
    Reviewed the 69 new HPO terms in release v2026-09-01 against the Fanconi anemia entry once OLS served that release. Rebound the head and neck squamous cell carcinoma phenotype (name: Oral and Oropharyngeal Squamous Cell Carcinoma) from HP:0012182 Oropharyngeal squamous cell carcinoma to the new HP:0020357 Head and neck squamous cell carcinoma, which matches the claim and the quoted registry evidence. Added Impaired First-Phase Insulin Secretion (HP:6001516) citing Elder et al. 2008 (PMID:18454466, newly cached) for the reduced insulinogenic index and secretory defect, plus the diagnostic review PMID:19622403; the insulinogenic-index item is graded directness INDIRECT. Added Axillary and Flexural Hyperpigmentation (HP:6001491) citing the cutaneous-findings series PMID:32822789 (6.5% confluent flexural hyperpigmentation, 24.7% skin-fold freckle-like macules across axillary and other creases). Both new phenotypes were wired as downstream targets of the existing endocrine and pigmentary pathophysiology nodes. Other new terms in the release (thenar muscle aplasia, limited thumb abduction, duodenal web, displaced radial artery, oral mucosal fragility) were judged plausible for FA but not added because no FA-specific source was in hand. No obsoleted term from the release is used in kb/. Validated with just validate, count-verified-snippets, and validate-disorders.

  summary: Separate intellectual disability and reassess phenotype causal claims
  details: |
    Response to PR 11368 review: separate HP:0001249 Intellectual disability from HP:0001263 Global developmental delay and move BRCA1/FA-S evidence into the intellectual-disability context. Remove unsupported homozygous-only and frequency assertions from that context. Use Orphanet aggregate FREQUENT for both distinct phenotypes; remove mutation-context frequency bands inferred from P values and the CNS-anomaly-only context from developmental delay. Remove the aplastic-anemia frequency inferred from the broader anemia annotation and mark that evidence indirect. Expand structural-anomaly scope wording, restrict two tumor-edge descriptions to FANCD1/BRCA2, and classify early-onset osteoporosis as indirect, with exact consensus-review evidence for the bone-mineralization benefit of treating GH deficiency and hypogonadism. Remove five unsupported causal edges (developmental delay, cranial nerve paralysis, freckling, obesity, dyslipidemia), add three knowledge-gap discussions, and leave new intellectual disability unwired because the full MRI and FA-S reviews do not establish structural brain anomalies as its cause. Regenerate PMID 38146508 and PMID 26369989 caches for full-source context; preserve prior history attribution and add its PR link. This is a review-response pass on identified findings, not a new whole-entry evidence audit.

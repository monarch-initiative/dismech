  summary: Add differential_diagnoses to Fanconi anemia
  details: |
    Added a nine-entry differential_diagnoses block to kb/disorders/Fanconi_Anemia.yaml, which previously had none despite 909 other KB entries carrying one. Entries split into two presentation windows: differentials live at the congenital-malformation presentation [VACTERL/VATER association, Baller-Gerold syndrome, thrombocytopenia-absent radius syndrome, Holt-Oram syndrome], and differentials live at the hematologic presentation [Diamond-Blackfan anemia, dyskeratosis congenita, Shwachman-Diamond syndrome, Nijmegen breakage syndrome, acquired aplastic anemia]. Each entry binds a MONDO disease_term and carries distinguishing_features naming the chromosomal breakage test with DEB or MMC as the discriminator where it applies. All 13 evidence snippets are exact substrings verified against three already-cached sources: PMID:19622403 Auerbach "Fanconi anemia and its diagnosis"; PMID:25227706 Fargo et al. NCI IBMFS breakage comparison; PMID:16015582 Faivre et al. VACTERL breakage studies. Three new MONDO terms entered the term and DiseaseTerm enum caches via validate-terms: MONDO:0009039, MONDO:0010121, MONDO:0015610. Validated with just validate, just validate-disorders reporting 404/405 snippets verified with 1 skipped by prefix, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, and pytest tests/test_data.py with 10260 passed.

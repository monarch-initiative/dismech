  summary: Add typed divergences to the FA/BRCA Boolean model links
  details: |
    Four typed divergences. This entry is the demonstration case for the taxonomy being orthogonal to the scale comparison: both links are ALIGNED on scale, and the Homologous Recombination Impairment link is PARTIALLY_RECAPITULATES purely because of a PROXY_QUANTITY divergence -- HR appears as network components inside a crosslink-repair model, so what is reported is their activation state, while the node describes recombination fidelity and outcome. No scale comparison could surface that. DNA Repair Deficiency: TEMPORAL_SCOPE (no cell-cycle timing, no lesion burden, both material because ICL repair is replication-coupled and dose-dependent), BOUNDARY_OMISSION (haematopoietic context), and CALIBRATION_PROVENANCE graded IMMATERIAL -- the network being parameter-free is a real property but does not bear on a structural claim about pathway logic. That IMMATERIAL grading is the worked example of why materiality is per-divergence rather than per-link.

  summary: 'Evidence-claim mismatch review: replace generic GeneReviews snippets on
    congenital-anomaly phenotypes'
  details: |
    Reviewed the 30 claims the Jev evidence-claim-match run labelled MISMATCH
    at the whole-claim level (issue #13619). 27 were congenital-anomaly
    phenotypes whose only evidence was the GeneReviews summary sentence
    (PMID:20301575) listing short stature, pigmentation, limb, microcephaly,
    eye and genitourinary anomalies, which names none of them.

    Replaced that evidence with quotes that name each anomaly:
    - GI (structural anomalies, esophageal/duodenal/jejunal atresia, anal
      atresia, malrotation, annular pancreas, TEF): PMID:34405046 review,
      PMID:36091172 review, PMID:35417938 (BACKGROUND, VACTERL-H list), and
      ORPHA:84 HPO rows for anal atresia and TEF.
    - Face/eyes (micrognathia, cleft palate, triangular face, midface
      retrusion, pointed chin, hyper/hypotelorism): ORPHA:84 rows,
      PMID:34405046, PMID:36091172, PMID:23648176.
    - CNS (anterior pituitary hypoplasia, interrupted stalk, agenesis of
      corpus callosum, cerebellar hypoplasia, hydrocephalus,
      ventriculomegaly): PMID:28283722 and PMID:26369989 MRI series,
      PMID:34405046, ORPHA:84.
    - Spine (hemivertebrae, scoliosis, kyphosis, fused cervical vertebrae,
      coccyx): PMID:15817983, PMID:14564161 case reports, PMID:34405046,
      PMID:36091172.
    - Situs inversus: PMID:34405046 and PMID:36091172 (previously cited a
      GeneReviews management sentence about cardiac anomalies).

    Frequency changes: anterior pituitary hypoplasia OCCASIONAL -> FREQUENT
    (11/36 hypoplastic adenohypophysis, PMID:28283722); jejunal atresia,
    intestinal malrotation and annular pancreas OCCASIONAL -> VERY_RARE, since
    PMID:34405046 puts all GI malformations together at about 5%. Notes that
    cited uncited "FA guideline" tables were rewritten to describe the cited
    sources.

    Facial palsy: no quotable source naming it in FA was found (PubMed, Europe
    PMC and the two full-text reviews searched; queries recorded in the
    phenotype notes). The non-supporting GeneReviews evidence was removed and
    the phenotype left unevidenced rather than deleted.

    Other fixes: removed an FA-S (BRCA1) snippet about absent marrow failure
    from the FA-D1 early-onset solid tumour phenotype; on the FA-S context of
    squamous cell carcinoma, dropped zygosity HOMOZYGOUS and re-sourced the
    note, since PMID:38146508 reports breast/ovarian tumours only in female
    compound heterozygotes.

    PMID:36091172 cache regenerated by fetch-reference to full text (abstract
    retained). Validation: just validate, count-verified-snippets (all
    verified), validate-terms.

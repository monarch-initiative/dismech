  summary: Wire 25 causal edges, register 6 emerging hypotheses and 7 knowledge-gap
    discussions for unexplained phenotypes
  details: |
    Phenotype connectivity audit found 94/184 phenotypes (51%) with an incoming causal edge and no dangling targets. Added 18 downstream edges on existing pathophysiology nodes (DNA Repair Deficiency to the three cellular hallmark phenotypes; Bone Marrow Failure to hypocellularity and neutropenia; Clonal Evolution to AML; Epithelial Cancer Susceptibility to HNSCC, basal cell carcinoma and oral leukoplakia; Homologous Recombination Impairment to the FA-D1 embryonal tumors; Endocrine Gland Dysfunction to reduced GH and early osteoporosis; Skin Pigmentation Changes to freckling; CNS Developmental Anomalies to holoprosencephaly; Congenital Structural Anomalies to the three radial-ray siblings) and 7 sequelae edges (thrombocytopenia to petechiae and bruising; neutropenia to recurrent infections; aplastic anemia to transfusional iron overload; oral leukoplakia to HNSCC; obesity to insulin resistance and dyslipidemia). Connectivity rose to 118/184 (64%). Deliberately left disconnected: pulmonary fibrosis, moyamoya, reduced NK count, the three psychiatric phenotypes, and about 45 congenital malformations that would only reach the generic structural-anomaly hub. Registered six EMERGING mechanistic_hypotheses (beta-cell secretory defect, radial ray field specificity, HPV-independent oral carcinogenesis, pulmonary fibrosis, intrinsic NK/B lymphoid defect, moyamoya arteriopathy) seeded with evidence already verified in the entry, and seven KNOWLEDGE_GAP discussions attached to the phenotypes, nodes and hypotheses concerned. OpenScientist hypothesis deep-research runs were launched for the hypotheses; reports land under kb/hypotheses/Fanconi_Anemia/ and still need provider-report assessment sidecars (review-hypothesis-exploration) before any hypothesis status changes.

  summary: Wire the FA/BRCA Boolean model into the pathograph
  details: |
    Repaired the existing but disconnected BOOLEAN_NETWORK entry (PMID:22267503, Rodriguez et al. 2012). Added two modeled_mechanisms links so the model reaches the pathograph: DNA Repair Deficiency (RECAPITULATES, with an ABOLISHED readout for simulated ICL repair under FA/BRCA-deficient genotypes) and Homologous Recombination Impairment (PARTIALLY_RECAPITULATES — the quoted claim concerns compensatory pathway activation, not recombination fidelity, hence only partial recapitulation). Added a fourth finding covering the model's untested mutant predictions, plus fidelity and limitations on both links. model_format and repository_url were deliberately left unset and the reason recorded in notes: the 2012 model predates routine SBML-qual deposition and no public model-repository record could be sourced, so populating either would have been a guess. Reflowed the description folded scalar. Validation as for the sibling entries in this tranche.

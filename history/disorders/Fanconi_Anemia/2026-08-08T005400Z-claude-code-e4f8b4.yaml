  summary: Add 41 phenotypes closing gaps vs the FCF-guideline HPO profile
  details: |
    Gap analysis of kb/disorders/Fanconi_Anemia.yaml against the 264-term Fanconi anemia HPO
    profile that Connelly et al. derived from the Fanconi Cancer Foundation Clinical Care
    Guidelines, obtained from github.com/ehurwitz/FA-custom-profile. Coverage was computed by
    HPO closure rather than string matching, distinguishing exact matches, parent-only
    coverage, child-only coverage, and terms with no ontological relation to anything in the
    entry. Baseline: 78 exact, 56 parent-only, 21 child-only, 109 not represented.

    Curated 41 new phenotype blocks in two tranches, concentrated in the domains the
    manuscript identifies as the guideline-derived novelty: oral and dental (gingivitis,
    gingival overgrowth, periodontitis, microdontia, tooth agenesis, tooth malposition,
    hyposalivation, oral ulcer, oral leukoplakia); psychiatric
    (anxiety, depression, diminished mental health); endocrine and metabolic (osteoporosis,
    insulin resistance, growth hormone deficiency); immune (recurrent infections, reduced NK
    cell count); haematologic manifestations (marrow hypocellularity, neutropenia, petechiae,
    bruising susceptibility, transfusional iron overload); cellular and diagnostic
    (crosslinker-induced chromosomal breakage, DNA repair defect, clinical radiosensitivity);
    neoplasms (AML, basal cell carcinoma, oral and oropharyngeal SCC, medulloblastoma,
    nephroblastoma); skeletal and limb (abnormal rib morphology, scapular hypoplasia, radial
    ray anomaly spectrum, thumb duplication); ocular (microcornea);
    dermatologic (freckling); plus pulmonary fibrosis, ectopic kidney, moyamoya phenomenon,
    holoprosencephaly and feeding difficulties.

    Evidence policy: the manuscript and its hpoa file were used ONLY to identify gaps, never
    as evidence. Every added phenotype carries an independent primary-literature citation,
    fetched with fetch-reference and snippet-verified against the cached PubMed abstract.
    Terms whose only available literature describes a transplant or treatment sequela were
    left uncurated (keratoconjunctivitis sicca, verrucae), as was melanoma, for which no
    FA-specific primary source was located. Frequency bands were assigned only where a cited
    percentage maps cleanly onto a FrequencyEnum band.

    Review pass on PR #8190: two blocks curated in the first draft were withdrawn because
    their evidence did not support the claimed term - HP:0045025 narrow palpebral fissure (the
    snippet measures fissure length, which is HP:0012745, already asserted) and HP:0011107
    recurrent aphthous stomatitis (the snippet supports neither recurrence nor stomatitis).
    Moyamoya and microcornea were re-evidenced from FA-specific sources, and four terms were
    made more precise or renamed to remove name collisions. Net 43 -> 41 added blocks.

    Post-curation coverage: 116 exact, 50 parent-only, 22 child-only, 76 not represented.
    Outcome is needs_followup because two clusters remain open: fine-grained hand and
    upper-limb radiographic detail (individual carpal bones, forearm bowing, humeral
    anomalies, joint motion limits), which needs the full text of a radiographic series rather
    than an abstract; and gastrointestinal symptomatology (reflux, dysphagia, nausea,
    constipation, diarrhoea, gastroparesis, malabsorption), for which repeated PubMed searches
    found no FA-specific primary study quantifying symptoms. The full remaining worklist is
    enumerated in docs/curation-notes/Fanconi_Anemia-hpo-profile-coverage-2026-08-08.md.

    Validation: schema plus reference validation passed; the snippet audit reported 388/388
    verified against cached references; term validation passed.

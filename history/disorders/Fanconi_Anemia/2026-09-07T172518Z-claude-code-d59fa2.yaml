  summary: 'Phenotype review: Fanconi_Anemia'
  details: |
    Campaign phenotype review of the largest KB entry (182 phenotypes). Wired 79 previously unexplained phenotypes into existing pathophysiology arms (Congenital Structural Anomalies, CNS Developmental Anomalies, Bone Marrow Failure, Endocrine Gland Dysfunction, Clonal Evolution, Epithelial Cancer Susceptibility, Homologous Recombination Impairment, DNA Repair Deficiency, Skin Pigmentation Changes) with honest causal_link_type on indirect edges; connectivity 92/182 to 171/182. Replaced the irrelevant 'Hearing aids may be helpful' snippet on five ear/hearing phenotypes with the IFAR otologic-manifestations sentences from PMID:19622403. Rebound three HPO terms: Aplastic Anemia HP:0001903 Anemia to HP:0001915 Aplastic anemia; Developmental Delay HP:0001249 Intellectual disability to HP:0001263 Global developmental delay; Oral and Oropharyngeal SCC HP:0012182 to HP:0020357 Head and neck squamous cell carcinoma. Added two KNOWLEDGE_GAP discussions covering the 11 deliberately unwired phenotypes (psychosocial mental-health cluster; unexplained somatic cluster). Spot-checked first evidence items on all 182 phenotypes via compact extraction; verified suspicious refs PMID:29278735 (RAD51C holoprosencephaly) and PMID:9096763 (FA interstitial lung disease) are genuine FA papers. Left untouched: seven zero-evidence GU phenotypes (Micropenis, Gonadal Dysgenesis etc., no ORPHA:84 rows available), the passing-mention 'Treatment of...' GeneReviews snippets on cardiac/genital phenotypes (supportive though weak), and GH-deficiency term granularity. All validation gates passed.

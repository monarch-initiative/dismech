  summary: 'Review: connect 61 of Fanconi anemia''s 66 orphan phenotypes (IUIS Table
    9)'
  details: |
    Sixty-six of 184 phenotypes had no incoming causal edge. The entry's node structure was already rich enough to absorb nearly all of them - Congenital Structural Anomalies, CNS Developmental Anomalies, Endocrine Gland Dysfunction and Bone Marrow Failure were all present and well described - so this was a wiring job rather than a modelling one.

    Fifty edges were added to pathophysiology nodes, grouped by the organ system each finding belongs to: skeletal and limb, craniofacial, dental, ocular, renal and genitourinary, cardiac and vascular, and gastrointestinal under Congenital Structural Anomalies; cranial nerve palsy and hyperreflexia under CNS Developmental Anomalies; obesity and the three male fertility findings under Endocrine Gland Dysfunction; reduced NK cell count under Bone Marrow Failure.

    Eleven were modelled as sequelae instead, because the entry's own phenotype descriptions state their causation: renal insufficiency and recurrent urinary tract infection from the renal malformations, periodontitis and gingivitis from neutropenia, oral ulceration from the cytopenia (it improves when the anaemia is corrected), gingival overgrowth from the periodontitis it accompanies, visual impairment from microphthalmia, weight loss from feeding difficulties.

    Several attributions are weak and say so rather than reading as settled. Hyperreflexia is drawn from the only CNS parent available and no source localises the lesion. Oligohydramnios is drawn from the renal malformations without the intermediates being established in Fanconi cohorts. Feeding difficulty is multifactorial and no source separates the endocrine contribution from the structural GI anomalies.

    Five are left unconnected deliberately, with the reason recorded in each phenotype so an orphan sweep does not attach them. Anxiety, depression and diminished mental health describe the burden of living with the disease rather than a consequence of any node; an edge from DNA repair deficiency would assert a biological route the literature does not claim. Pulmonary fibrosis rests on one case report with a conjectured mechanism, and giving it an edge would grant a single case the graph status of the established arms. Reduced salivary flow is well documented but nothing cited says what produces it.


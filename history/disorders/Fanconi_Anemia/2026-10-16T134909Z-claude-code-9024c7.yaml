  summary: Conform to DNA damage checkpoint arrest module
  details: |
    Wired the haematopoietic arm of the entry to kb/modules/dna_damage_checkpoint_arrest.yaml at three nodes. Added a new pathophysiology node, 'Checkpoint-Enforced p53-p21 Arrest of Hematopoietic Stem and Progenitor Cells', conforming to dna_damage_checkpoint_arrest#Checkpoint-Enforced Arrest of the Progenitor: the entry previously had no node for the HSPC arrest itself, only the embryonic p53 arrest node and the downstream attrition node, so the module's central effector had no counterpart to match. The new node binds GO:0031571, GO:0030330 and GO:0045786 with the p21 inhibitor activity GO:0004861, substitutes CL:0000037 hematopoietic stem cell for the module's generic progenitor, and is evidenced from PMID:22683204 (HSPC defect present before clinical marrow failure; p53 hyperactivation triggering a p21-dependent G0/G1 arrest; p53 recruited to CDKN1A and GADD45a promoters rather than BAX). It sits on the existing Genomic Instability to Hematopoietic Stem Cell Attrition path, with the p53-knockdown rescue quote on the new downstream edge. 'Hematopoietic Stem Cell Attrition' now conforms to the module effector node, gaining GO:0019827 DECREASED and GO:0008283 DECREASED, and 'Bone Marrow Failure' conforms to the module consequence node, gaining GO:0030097 DECREASED with the bone marrow site and HSC cell type. The fit is the module's own worked Fanconi arm: the checkpoint is intact and exaggerated rather than lost, which is what separates this from the entry's clonal-evolution arm. The embryonic node 'p53-Dependent Developmental Progenitor Arrest and Apoptosis' was deliberately left unlinked so the central-effector target is claimed once, in the haematopoietic compartment the module cites.

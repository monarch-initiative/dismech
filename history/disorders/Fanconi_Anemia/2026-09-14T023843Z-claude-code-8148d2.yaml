  summary: 'Classify: IUIS 2022 Table 9'
  details: |
    Added classifications.iuis_category: bone marrow failure, backfilled from IUIS 2022 Table 9 (Tangye et al., PMID:35748970). Fanconi anemia is not one Table 9 row but twenty-two - Types A, B, C, D1, D2, E, F, G, I, J, L, M, N, O, P, Q, R, S, T, U, V and W, each with its own gene and OMIM number, from FANCA/227650 to RFWD3/617784 - all sharing one Major Category cell reading 'Bone marrow failure with immune deficiency' and one Subcategory cell reading 'Fanconi Anemia'. The notes say so rather than implying a single row. Two evidence items, both cited to PMID:35748970 and graded OTHER (expert-committee nosology, not a primary study): the category/subcategory cell and the Type A row. Both snippets verified as exact substrings of references_cache/PMID_35748970.md under the validator's whitespace-collapsing normalization. The pre-existing harrisons_chapter and isds_skeletal_category assignments were left untouched; the ISDS limb-hypoplasia note with its decline-to-decompose caveat is intact. Recorded two traps in the notes: Shwachman-Diamond syndrome is Table 5, not Table 9, and Diamond-Blackfan anemia is absent from IUIS 2022 entirely. Also added as a member of kb/groupings/Bone_Marrow_Failure_IEIs.yaml.

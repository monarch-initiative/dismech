  - differential_diagnoses
  summary: Add NUT carcinoma as a differential diagnosis
  details: |
    Adds a differential row for NUT carcinoma (MONDO:0005563). Sources: a series that stained
    sinonasal carcinomas for NUT (PMID:22534723): 2 of 13 tumors diagnosed as sinonasal
    undifferentiated carcinoma, and 3 of 45 nasal carcinomas in patients younger than 50, were
    NUT carcinomas; the authors advise staining any sinonasal carcinoma with an undifferentiated
    component for NUT; NUT staining was diffuse and nuclear in each case except in areas of
    overt squamous differentiation; and p63, which earlier work cited by the series says favors
    NUT carcinoma while sometimes being only focal, was entirely negative in one of its three
    cases. The sequencing study the entry already cites (PMID:28084339) found no IDH-activating
    mutation in six NUT midline carcinomas, and a review (PMID:31876536) gives IDH2 mutations in
    most histologically defined cases and the subdivision of the historical category. The
    series' discussion also says 3 of 4 patients younger than 50 diagnosed with sinonasal
    undifferentiated carcinoma had NUT carcinoma, which its own results contradict; that figure
    is not used. Quotes that describe one tumor only, cited for a comparison, are graded
    INDIRECT, and the caveats are in the row's notes. Validation: just validate and
    check-entity-refs pass; all snippets verify.

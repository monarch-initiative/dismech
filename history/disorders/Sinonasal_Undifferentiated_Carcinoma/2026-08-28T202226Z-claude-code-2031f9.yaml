  details: |
    Response to the CHANGES_REQUESTED review on PR #9766, which found that five reference caches the PR itself fetched were cited nowhere.

    Mito 2018 (DOI:10.1097/PAS.0000000000001064, n=193) now qualifies the "Mutant-Specific IDH1/2 Immunohistochemistry" diagnosis node. The node previously claimed IHC separates IDH2-mutant SNUC from wild-type mimics "without sequencing" on the strength of a 3/3-positive, 4/4-negative series. The larger cohort shows specificity is perfect against 132 mimics but sensitivity is 26/53 (49%), and the authors state the assay "lacks sensitivity for the full range of IDH mutations". The node is recast as a rule-in test; the sensitivity item is supports: PARTIAL because it supports IHC's specificity while refuting the stronger no-sequencing reading. A node-level notes reconciles the two series: sensitivity is allele-dependent (strong staining tracked IDH2 R172S/G, weak staining R172T, and sequencing of IHC-negative cases recovered R172T and IDH1 R132C), so the small early series is a view of the strongly staining alleles rather than a contradiction.

    Added KIT to genetic: as a co-occurring somatic activating mutation (45% in the same cohort). The PI3K-pathway figure (36%) is recorded in that entry's notes rather than as a gene entry, because the paper reports it at pathway level and names no gene. No pathophysiology node is asserted for either co-alteration, since protein-level pathway activation is not shown - the same restraint already applied to the ethmoid entry's pathway-mutation node.

    Added a clinical_trials: section with NCT06176989 (NCI phase II enasidenib in IDH2-mutated sinonasal and skull-base tumors including SNUC) and NCT05925491 (phase II neoadjuvant pembrolizumab plus chemotherapy in SNUC), both PHASE_II / RECRUITING, both fetched with just fetch-reference. NCT06176989 contradicted prose already in the file: the IDH2-Targeted Therapy treatment said "no controlled trial evidence in SNUC is cited here". That now reads that the rationale has reached prospective testing but no efficacy results are yet reported, which is the accurate weaker claim.

    Cited Agaimy 2022 (DOI:10.1007/s12105-022-01416-x) on the SMARCB1-deficient differential for the genotypic separation that differential rests on.

    Declined the reviewer's suggestion to add a 0.02/100,000 annual incidence to prevalence:. The figure traces to Thawani 2023, whose cached abstract does not contain it - the abstract carries only the all-sinonasal 0.5-1.0/100,000 rate, which the deep-research artifact itself flags as explicitly not SNUC-specific. Quoting it on a SNUC prevalence record would misattribute a class-level rate to one histology. The existing prevalence notes already record why no rate is given.

    Validation: just validate, just validate-terms, just check-duplicate-keys all pass. just count-verified-snippets reports 33/37 verified, 4 skipped by prefix; the 4 skipped are DOI: references, which the validator skips by configuration, and all four were checked by hand as exact whitespace-normalized substrings of their caches.

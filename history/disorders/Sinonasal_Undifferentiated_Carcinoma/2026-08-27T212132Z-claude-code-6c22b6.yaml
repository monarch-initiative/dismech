  summary: 'Create: Sinonasal Undifferentiated Carcinoma (MONDO:0006411)'
  details: |
    New Disease entry for sinonasal undifferentiated carcinoma, curated as one member of the paranasal sinus carcinoma umbrella (issue 9036) rather than as the umbrella itself.

    Pathograph: IDH2 R172 neomorphic hotspot mutation -> DNA and histone (H3K27) hypermethylator phenotype -> undifferentiated high-grade proliferation -> rapid local invasion of orbit and anterior skull base, with a parallel cooperating tumour-suppressor-loss node (TP53, CDKN2A/2B in IDH2-mutant tumours; SMARCA4, NOTCH1, TET2 in IDH2-wild-type tumours) declaring conforms_to evading_growth_suppressors#Tumor Suppressor Inactivation.

    Also curated: histopathology (nuclear pleomorphism, mitotic activity, tumour necrosis), presenting phenotypes, four causal or co-occurring genes, the induction-chemotherapy-response treatment algorithm (induction chemotherapy as both therapy and biological test; definitive chemoradiotherapy in responders, surgery in non-responders), diagnosis including mutant-specific IDH1/2 immunohistochemistry and DNA methylation profiling, a SEER-based rarity record, and two differential diagnoses (olfactory neuroblastoma, SMARCB1/INI-1-deficient sinonasal carcinoma).

    Evidence discipline: the IDH2-targeted-therapy treatment is recorded as supports PARTIAL because the cited paper infers therapeutic amenability from mutation frequency and reports no treatment outcomes. The entry notes that MONDO classifies SNUC only under undifferentiated carcinoma (MONDO:0005617) and not under the paranasal sinus branch, which is why the curated grouping records the site-based membership MONDO does not assert.

    NEC preflight: just preflight-dr against MONDO:0006411 returned SKIP, because MONDO records no causal RO:0004003 gene for this somatic neoplasm. Manual fallback per CLAUDE.md: the falcon report's dominant gene is IDH2 (28 mentions, against SMARCB1 9 and IDH1 8), matching the established SNUC driver; MONDO:0006411 carries no OMIM xref and the report asserts none, so no conflict; the entry synonyms match the MONDO synonym list and none is the label of a different MONDO entity. Cleared.

    Validation: just validate passed on schema, terms and references; snippets 31/31 verified against cached references. A compliance pass added reference_title to the newly added evidence items and evidence to the IDH2-targeted-therapy target_mechanisms edge; the entry sits at 88.9% global compliance.

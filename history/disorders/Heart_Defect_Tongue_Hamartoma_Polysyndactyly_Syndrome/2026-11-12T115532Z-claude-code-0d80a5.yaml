  summary: Review and enrich Heart_Defect_Tongue_Hamartoma_Polysyndactyly_Syndrome
  details: |
    Added MONDO-verified synonyms confirming clean GeneReviews NO_CHAPTER status; added classifications (harrisons_chapter GENETICS_ENVIRONMENT_DISEASE and CARDIOVASCULAR; mechanistic_category ciliopathy); structured 5 atomic pathophysiology nodes grounding WDPCP (hgnc:28027) on GO:0003779 and GO:0035869, dropping misleading ciliated-cell binding on the PCP node, and splitting cardiac outflow tract, embryonic digit morphogenesis (GO:0042733), and tongue morphogenesis (GO:0043587) with indirect/hypothesized human developmental edges; fetched and cited original syndrome reports Orstavik et al. 1992 (PMID:1516223) and Digilio et al. 1996 (PMID:8733055) adding Atrioventricular Canal Defect (HP:0006695) and Subvalvular Aortic Stenosis (HP:0001682) phenotypes plus surgical coarctation repair evidence; documented the HPO polysyndactyly query in notes; and added CAUSATIVE/GERMLINE genetic qualifiers and diagnostic imaging rows.

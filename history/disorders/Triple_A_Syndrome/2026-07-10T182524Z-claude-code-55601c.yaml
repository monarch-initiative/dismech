  summary: 'Create: Triple A Syndrome (Allgrove syndrome, MONDO:0009279)'
  details: |
    New AAAS/ALADIN autosomal-recessive Triple A syndrome (Allgrove syndrome) entry created for lit-scan issue #5853. Curated the classic triad achalasia, alacrima, ACTH-resistant primary adrenal insufficiency plus the progressive neurological phenotype peripheral neuropathy, cerebellar ataxia, autonomic dysfunction, mild dementia; a 3-node pathophysiology chain AAAS/ALADIN loss then ALADIN mislocalization and impaired nucleocytoplasmic transport then tissue-specific adrenal/oesophageal/lacrimal/neural dysfunction; AAAS genetics with compound-heterozygous variants from PMID:42415167; and treatments adrenal hormone replacement, Heller myotomy, supportive care. Evidence anchored to PMID:11062474 AAAS/ALADIN discovery, PMID:12730363 ALADIN NPC mislocalization IN_VITRO, and PMID:42415167 2026 clinical case and review. NEC preflight passed. Validated schema, terms with labels, and whitespace-normalized snippet substring checks. Added MONDO:0009279 to the DiseaseTerm enum positive-hit cache after verifying reachability from MONDO:0000001 via OAK.

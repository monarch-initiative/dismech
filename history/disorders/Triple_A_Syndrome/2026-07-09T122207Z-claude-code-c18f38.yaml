  summary: 'Create: Triple A Syndrome / Allgrove syndrome'
  details: |
    New kb/disorders/Triple_A_Syndrome.yaml created in response to lit-scan issue #5853 (PMID:42415167). AAAS/ALADIN autosomal recessive nucleoporin disorder. Modeled the mechanistic chain: AAAS loss-of-function to ALADIN mislocalization from the nuclear pore complex to selective nucleocytoplasmic import failure of DNA-repair/antioxidant proteins to oxidative-stress hypersensitivity and impaired DNA repair to adrenocortical failure/impaired steroidogenesis and neurodegeneration/autonomic dysfunction. Curated the classic triad plus dysphagia, peripheral neuropathy, cerebellar ataxia; AAAS genetics; and organ-directed treatments. Six references verified; all 28 evidence snippets are exact substrings of cached abstracts. Validated with just validate, validate-terms, check-reference-cache-frontmatter.

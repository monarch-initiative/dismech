  summary: 'Create: Triple A Syndrome - Allgrove syndrome, AAAS/ALADIN'
  details: |
    New disease entry for Triple A / Allgrove syndrome [MONDO:0009279, AAAS/ALADIN, autosomal recessive] created in response to lit-scan issues #5853 and #6143 [both citing PMID:42415167]. NEC preflight passed against MONDO:0009279 [gene AAAS/HGNC:13666, OMIM:231550]. Curated the classic triad - achalasia, alacrima, ACTH-resistant primary adrenal insufficiency - plus neurological features [peripheral/central neuropathy, autonomic dysfunction, cerebellar ataxia, mild dementia]; a five-node pathophysiology chain from ALADIN NPC mislocalization through selective nuclear import failure of DNA-repair factors, impaired SSB repair/oxidative-stress hypersensitivity, and tissue-specific degeneration to ACTH-resistant adrenal cortical failure; plus treatments [hydrocortisone/fludrocortisone replacement, Heller myotomy/dilation, ocular lubrication]. Evidence anchored on 4 verified PMIDs [42415167, 11062474, 12730363, 16467144] with exact-quote snippets machine-verified against fetched abstracts. Two mis-recalled PMIDs were discarded during verification. Schema, term [OAK/OLS], and reference validators all pass.

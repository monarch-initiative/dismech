  summary: 'Augment: MNS1/CFAP53 redundancy hypothesis, gene-environment entry, causal-edge
    evidence'
  details: |
    Augmentation session on an existing 96%-compliant entry (created in PR #8880); no new entry was created.

    Deep research. Falcon was requested per the /curate default and returned HTTP 403 (ProviderAuthError) on two attempts; `providers --check` confirmed it UNREACHABLE. Rather than hand-substituting a provider, the run was re-issued with `just dr_fallback='--fallback'`, which fell back to OpenScientist and recorded fell_back/requested_provider/provider_attempts in the report frontmatter. The report is committed as research/Visceral_Heterotaxy_9-deep-research-openscientist.md, named for the provider that actually produced it. The fallback initially left a stale duplicate named -falcon.md whose frontmatter lacked template_sha and whose artifact paths pointed at a directory that did not exist; that duplicate was deleted rather than committed, and the preflight was re-run against the canonical file (PASS, MNS1=58).

    NEC preflight. This disease previously produced the canonical Named Entity Confusion failure (PR #8880 discarded a falcon report that resolved 'Visceral Heterotaxy 9' to MMP21-related heterotaxy 7, MNS1=0/MMP21=62). The new report PASSES `just preflight-dr ... MONDO:0030070` with MNS1=58 mentions and MNS1 as top gene, so it was kept rather than discarded.

    Report validation. Neither validation section existed, so both were retro-fitted: `just validate-research-reference` (18/18 references resolved, 0 unresolved, 0 off topic) and `just validate-research-terms` (30/31 resolved). Term validation flagged two bindings that resolve but name different concepts - HP:0011885 offered for 'Abnormal visceral situs' is actually Hemorrhage of the eye, and UBERON:0004341 offered for the left-right organiser is actually primitive streak. Neither was bound; both are recorded in the entry notes so a later curator does not pick them up.

    What was added, and where it came from. The report corroborated existing content rather than extending it, so the substantive additions come from independent PubMed searches of the MNS1 literature, all three papers previously uncited:

    - PMID:39007638 (Development 2024) - MNS1 and CFAP53 are paralogous filamentous microtubule inner proteins that act redundantly in (9+2) cilia; combined loss strips outer dynein arms. Used for two new evidence items on the Outer Dynein Arm Docking Defect node and as the basis of a new mechanistic_hypotheses entry, cfap53_paralogue_redundancy_airway_sparing (status EMERGING), which offers a mechanistic account of why the airway is spared while laterality fails and therefore of ClinGen's Disputed MNS1-PCD classification. The report never mentions CFAP53.
    - PMID:24876927 (Cilia 2014) - MFN2/MNS1 co-immunoprecipitation; MNS1 in detergent-resistant flagellar structures and distributed along the whole tail. Two evidence items on the Sperm Flagellar Axoneme Assembly Failure node.
    - PMID:30129265 (ACER 2018) - Mns1 dosage interacts with gastrulation-stage alcohol to raise craniofacial/ocular defect rates (41% WT, 64% het, 92% null). Basis of a new environmental: section, the entry's first, bound to ECTO:0300001 via influences_mechanisms with environmental_effect MODULATES.

    Also filled the entry's central uncited causal edge (Nodal Cilia Motility Failure -> Randomization of Left-Right Axis Specification) with two quotes that make the causal claim directly, from references already in the cache.

    Honesty and scope decisions. The environmental entry is MODULATES, not EXACERBATES or PREDISPOSES: the evidence is murine, the potentiated phenotype (craniofacial/ocular/midline) is not a reported human MNS1 feature, and the interaction was seen in heterozygotes too, so it is a statement about Mns1 dosage rather than about the biallelic state defining HTX9. All three limits are written into its notes. The redundancy hypothesis is EMERGING, not CANONICAL, and carries an explicitly recorded internal problem: the sperm flagellum is itself (9+2) and should be buffered on this model yet fails most penetrantly, which is captured as a new KNOWLEDGE_GAP discussion (mns1_sperm_9plus2_redundancy_paradox) with a decisive proposed experiment rather than smoothed over. An earlier draft of the hypothesis asserted the sperm flagellum has 'its own fMIP composition'; that was unsourced and was removed. Two new evidence items were also regraded from MODEL_ORGANISM to IN_VITRO on review - the PMID:39007638 MNS1 self-association and the PMID:24876927 MFN2 co-immunoprecipitation - because both claims rest on binding assays rather than in vivo observation, which is how this entry already grades the co-IP/yeast-two-hybrid demonstration of the MNS1-CCDC114 interaction from PMID:30148830. Localization claims from the same mouse papers were left as MODEL_ORGANISM, matching the existing PMID:22396656 detergent-resistance items. The report's two novel contributions - gnomAD v4 constraint metrics and UniProt/Pfam domain architecture - were deliberately not curated because neither has a citable reference whose abstract carries the numbers. The prior curator's scope decisions (standalone entry, no PCD causation claim, uncited cardiac-surgery treatment) were left intact.

    Pre-PR red-team review. A fresh-context review pass against the dismech-pr-review skill confirmed no fabricated snippets, no wrong PMIDs, no NEC, no ontology errors and no broken references (all 98 snippets byte-exact against cache), and raised ten prose-level overreach findings, all fixed before commit rather than argued with. The PMID:39007638 'combined loss of both proteins' snippet is an MNS1/CFAP53 DOUBLE mutant result and had been explained on the ODA node as 'the same lesion' as single MNS1 loss, which the node itself describes as partial and distal; it is now INDIRECT and explicitly named as the double-mutant phenotype. The hypothesis's (9+0) premise was uncited and its 'therefore' was a non-sequitur, since CFAP53 being essential in (9+0) does not entail it cannot cover for absent MNS1; the source's own '(9+0), but not (9+2)' sentence was added as evidence and the passage now says the asymmetry motivates the model rather than derives it. The hypothesis also did not acknowledge a counterexample already curated in this entry - Mns1 SINGLE nulls lose tracheal outer dynein arms and develop hydrocephalus (PMID:22396656), and tracheal and ependymal cilia are both (9+2) - which is now in the hypothesis notes with the conclusion that the model accounts for human airway mildness and not for the mouse (9+2) phenotypes. The environmental mechanism link had asserted that alcohol and MNS1 deficiency 'converge' on nodal motile cilia and combined 'supra-additively', which the cited authors do not claim: their discussion prefers primary (non-motile) cilia and Shh, and they report situs inversus without craniofacial consequence. That description was rewritten to the source's framing, and the link's evidence - previously the abstract's background sentence, which evidenced nothing about alcohol - replaced with the conclusions sentence carrying the interaction claim, the hedged 'likely though interaction of alcohol with motile cilia function' as INDIRECT, and a REFUTE item carrying the authors' own primary-cilia reading. Smaller fixes: 'oligoasthenoteratozoospermia in every reported male' narrowed to males actually assessed; ClinGen 'Disputed' no longer read as a phenotype-severity measurement; 'abolishes motility' softened to match 'significantly affecting'; an unsupported 'homodimerises before engaging' claim removed; the PMID:24876927 detergent-fractionation item regraded IN_VITRO for consistency with the co-IP items; and the PMID:31534215 edge quote marked INDIRECT, since it is a doubly-hedged author synthesis and nodal flow was never measured in patients.

    Automated PR review round (PR #10528). The ai4c-reviewer bot requested changes on one IMPORTANT source-fidelity error, which was real and had been introduced by the earlier review pass: the environmental link description said "alcohol-exposed nulls showed situs inversus ... without that tracking craniofacial outcome". PMID:30129265 makes that dissociation about the VEHICLE-treated nulls ("loss of Mns1 did not affect the incidence of eye defects or other craniofacial abnormalities in vehicle-treated animals. However 5/8 of these fetuses exhibited situs inversus"); the alcohol-exposed nulls had 92.31% defects, so as written the sentence inverted the paper's argument and destroyed the dissociation it was trying to describe. Corrected to name the vehicle-treated group and the 5/8 figure. Verified against the cached full text before editing. All three of the reviewer's non-blocking suggestions were also taken: a sentence was added to the hypothesis notes making the edge opt-in polarity explicit (the group is declared on the ODA-docking to Respiratory Ciliary Dysfunction edge and explains why that edge is ATTENUATED, not why it holds, so the opt-in is not the edge's causal warrant); and the stale retired-enum prose was cleaned up. The reviewer flagged one instance of an explanation still saying "Recorded as PARTIAL" after #10003 migrated the value; the file actually carried four, all pre-existing and none introduced by this PR. All four were reworded to drop the retired value and to carry directness: INDIRECT instead, which is what each was actually expressing. The file now contains no mention of PARTIAL. The reviewer's remaining suggestion, that the two PMID:24876927 items carry different evidence_source values, was deliberately left as-is: the reviewer itself judged both defensible, and the split is intentional - detergent fractionation is a biochemical assay (IN_VITRO) while immunofluorescence localisation in ex vivo sperm is MODEL_ORGANISM, and each explanation states its own reasoning.

    Validation. `just validate-disorders` passed (schema + terms + references, batched, what CI runs). 98/98 snippets verified. check-enum-values, check-causal-targets, check-entity-refs, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all OK. The validator caught one invented reference_title during drafting (PMID:31534215), which was corrected to the real title. An unrelated formatting-only rewrite of references_cache/PMID_38884744.md, produced by re-fetching a pre-existing cache file with a newer fetcher, was reverted to keep the diff clean.

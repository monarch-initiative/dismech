  summary: 'Review response: correct laterality-defect frequency band to FREQUENT'
  details: |
    Second review round on PR #8880 (review submitted 2026-08-19T10:13:12Z). One blocking finding, plus the two nits the reviewer had explicitly deferred.

    BLOCKING: `frequency: VERY_FREQUENT` on the "Laterality defect" phenotype was unsupported and contradicted this entry's own central mechanistic claim. MNS1 loss randomises rather than reverses left-right specification, so a substantial fraction of biallelic individuals are expected to have normal situs; an 80-99% band cannot coexist with that. The supporting evidence item cited PMID:30148830 (five homozygotes, all with laterality defects), but those individuals were ascertained through their laterality defects, so the count establishes the association and cannot estimate its frequency.

    RESOLUTION: set `frequency: FREQUENT` (30-79%) rather than dropping the band, because a genuine genotype-first denominator exists in a source already cached on this branch. PMID:31534215 genotyped and clinically assessed 26 members of the Amish pedigree and reports: "Six individuals were found to be homozygous for the MNS1 NM_018365.2:c.407_410del variant, of whom four (67%) exhibited SI and two (33%) exhibited situs solitus." 67% sits inside the FREQUENT band, and the two situs-solitus homozygotes are exactly what the randomisation mechanism predicts. Added that sentence as a new evidence item carrying the band, and rewrote the PMID:30148830 explanation so it claims only the association and states the ascertainment limitation explicitly. The mechanism claim itself was not weakened - it is the evidenced core of the entry, and the frequency band was corrected to match it rather than the reverse.

    Corroborating, but not curated as separate evidence items: PMID:33037173 states situs abnormalities occur in about half of PCD patients owing to randomisation, and the Mns1-null mouse data quoted inside PMID:31534215 give 22% SI plus 17% left isomerism (39% with a laterality defect).

    NIT 1 (previously deferred by the reviewer): the "Situs inversus totalis" downstream edge quoted the randomisation/inheritance sentence, which supports the mechanism without ever naming situs inversus. Re-quoted to the pedigree sentence that names the diagnoses directly ("IX-5 died from meningitis aged 5 months and was discovered to have heterotaxy, subsequently a diagnosis of SI was made in IX-2, IX-1, VIII-15 and VII-9"), which additionally shows heterotaxy and SI arising within the same pedigree - the stochastic spectrum the edge asserts.

    NIT 2 (previously deferred): the otitis-media explanation said "one of four clinically assessed homozygotes". The paper reports six homozygotes (four SI, two situs solitus), of whom only IX-1 had any airway symptom. Corrected to 1/6 (17%); the OCCASIONAL (5-29%) band is unaffected on either denominator.

    VALIDATION RUN THIS SESSION: `just validate` passed with "Files updated: 0" (no cache churn); `just count-verified-snippets` 82/82 verified against cached references (was 81/81 - the increase is the single added evidence item, so no regression); `just validate-terms` passed; `just validate-disorders kb/disorders/Visceral_Heterotaxy_9.yaml` passed end to end (schema + terms + batched references, 82/82). Both new snippets were confirmed as exact substrings of references_cache/PMID_31534215.md before being written.

    A full `pytest tests/test_data.py` was NOT run to completion locally: the suite currently fails on an unrelated pre-existing problem in kb/disorders/Travelers_Diarrhea.yaml (bare-URL references, introduced on main in af3849cba5), and this machine is running many concurrent pytest processes. Recording that plainly rather than claiming a finished run. No foreign keys were added or changed by this session - the edits are one frequency enum value, three explanation strings, one re-quoted snippet, and one added evidence item, none of which introduce or alter a cross-reference.

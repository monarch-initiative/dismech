  summary: 'Create: Visceral Heterotaxy 9 (HTX9, MONDO:0030070, MNS1)'
  details: |
    New standalone Disease entry for heterotaxy, visceral, 9, autosomal, with male infertility (HTX9; MONDO:0030070; OMIM:618948).

    NEC preflight (CLAUDE.md section 2b). MONDO:0030070 carries no definition text, so identity was anchored on OMIM:618948 and on the MONDO RO:0004003 causal-gene relationship, which resolves to HGNC:29636 (MNS1). A Falcon deep-research report was generated and then DISCARDED WHOLE after `just preflight-dr research/Visceral_Heterotaxy_9-deep-research-falcon.md MONDO:0030070` returned FAIL (MNS1 = 0 mentions; MMP21 = 62 mentions). The report had resolved the disease name to MMP21-related heterotaxy 7 (MONDO:0014762, OMIM:616749). Its citations all resolved and its quotes would have validated as exact substrings, so only the semantic gene check caught the confusion. The report, its citations sidecar and its artifacts directory were deleted rather than committed, so that no curator can later pick them up under the misleading filename. All curated content therefore comes from PubMed-sourced MNS1 primary literature plus one ClinGen structured record.

    Scope decision. Curated as a standalone entry rather than a subtype of the existing Visceral_Heterotaxy entry (MONDO:0018677), which models heterotaxy as a genetically heterogeneous clinical class and carries no subtypes. HTX9 has its own MONDO term, its own OMIM phenotype number, a single causal gene, and a male-infertility phenotype that is not part of the umbrella entity. MONDO's is_a link to visceral heterotaxy is reflected in the parents list. The umbrella entry was not modified.

    Mechanism. Biallelic MNS1 loss of function to outer dynein arm docking defect in the motile axoneme (MNS1 dimerises and binds the ODA-DC subunit CCDC114) to three parallel arms - nodal cilia motility failure at the left-right organizer, sperm flagellar axoneme assembly failure, and respiratory ciliary dysfunction - converging on randomization of left-right axis specification and on oligoasthenoteratozoospermia with male infertility.

    Module conformance. Two nodes declare conforms_to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction: the nodal-cilium node (the module node explicitly covers nodal-flow randomisation of left-right asymmetry) and the respiratory node (MNS1 is demonstrably absent from patient airway epithelium, with a partial ODA defect). The respiratory node carries an explicit note that conformance is asserted for the mechanism, not for a claim that MNS1 deficiency reproduces primary ciliary dyskinesia.

    Honest constraints recorded rather than smoothed over. ClinGen's Motile Ciliopathy Gene Curation Expert Panel classifies MNS1-primary ciliary dyskinesia as Disputed (cited as a CGGV structured record, evidence_source OTHER). The index-cohort individual with airway disease also carried homozygous DNAH5 mutations. The single reported ICSI attempt failed and is curated as a REFUTE evidence item against the implicit claim that ICSI rescues fertility. The cardiac-surgery treatment deliberately carries no evidence item because no MNS1-specific management study exists. Three discussions were added: a KNOWLEDGE_GAP on the MNS1-PCD boundary, a HUMAN_MODEL_MISMATCH on mouse hydrocephalus with no reported human counterpart, and a KNOWLEDGE_GAP on the GLDN-confounded phenotype expansion. Non-ciliary features from single case reports (severe myopia, oligodontia, a fetal malformation syndrome) were deliberately NOT curated as phenotypes.

    Validation. `just validate`: all validations passed. `just validate-terms`: passed. `just count-verified-snippets`: 60/60 verified against cached references. `just check-duplicate-keys`: OK. `just check-title-snippets`: OK, no new title-quoting snippets. Targeted tests/test_data.py selection (conforms_to node references, unique names, model readout targets, subtype foreign keys, history record layout): 8383 passed. `just validate-disorders` was run once before opening the PR.

  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #8880.

    BLOCKING FINDING (fixed). Five evidence items quoted the same sentence from PMID:33037173 - "Oligoasthenoteratozoospermia (OAT) refers to the combination of various sperm abnormalities, including a decreased sperm count, reduced motility, and abnormal sperm morphology." That is the paper defining the term, not reporting an observation: it is the "A Title Is Not a Finding" failure mode one sentence downstream, and it is not support for a claim that a particular patient had reduced motility or a reduced sperm count. The reviewer flagged three occurrences in the committed entry (the Oligoasthenoteratozoospermia and Male Infertility pathophysiology node, and the Reduced sperm motility and Oligozoospermia phenotypes); two further occurrences had been introduced in the uncommitted downstream edges written just before this session and are fixed here too. All five now quote the proband's actual semen analysis from the same cached reference - semen volume 3.4 ml, sperm concentration 1.8 x 10^6/ml, progressive motility 5.8% - which is a measured finding in a named individual and quantitatively supports all three claims. Each explanation was rewritten to state the measured value rather than restate the definition.

    PATHOGRAPH LEAF (fixed; reviewer suggestion). Respiratory Ciliary Dysfunction had no downstream edges, so the airway phenotypes sat unconnected while the laterality and reproductive branches ran to ORGANISM-scale consequences. Downstream edges were added from Respiratory Ciliary Dysfunction to Recurrent respiratory tract infections, Chronic rhinitis, Neonatal respiratory distress and Recurrent otitis media; from Randomization of Left-Right Axis Specification to Laterality defect, Situs inversus totalis, Complex congenital heart disease and Asplenia; and from Oligoasthenoteratozoospermia and Male Infertility to Male infertility, Reduced sperm motility, Oligozoospermia and Abnormal sperm morphology. Each edge carries its own evidence item. Two new source-backed phenotypes were added in the same pass: Asplenia (HP:0001746, reported with right isomerism in an MNS1-deficient individual) and Recurrent otitis media (HP:0000403, frequency OCCASIONAL - the only airway symptom in any affected individual in the Amish founder pedigree, the rest explicitly free of PCD symptoms).

    ODA LINKAGE (added). The reviewer noted that the DNAI1 immunofluorescence result in PMID:33037173 ties the sperm phenotype back to the ODA node. That evidence was added to Sperm Flagellar Axoneme Assembly Failure rather than to the ORGANISM-scale OAT node, because it is an axonemal ultrastructure claim and that is the node it substantiates: "In our study, MNS1 defect was associated with missing peripheral DMTs (2-4 out of 9) and absent ODAs in humans".

    TREATMENT MECHANISM LINK (partially adopted). ICSI now declares target_mechanisms on Oligoasthenoteratozoospermia and Male Infertility with treatment_effect BYPASSES, which is the correct predicate: ICSI does not repair the flagellum, it circumvents the requirement for motility. Its evidence is the reported 80% fertilisation rate and eight viable cleavage embryos, recorded as PARTIAL because that same cycle did not produce a pregnancy, so the bypass is demonstrated only as far as cleavage. This is consistent with, not contradicted by, the existing REFUTE evidence item on the treatment itself, which addresses the separate claim that ICSI reliably rescues fertility.

    DELIBERATE NON-CHANGE. Surgical management of congenital heart disease still declares no target_mechanisms. It already joins the pathograph through target_phenotypes on the CHD phenotype, which is the node it actually addresses, so a mechanism link would duplicate an edge the graph already has; and no TreatmentEffectEnum value honestly describes staged palliation of an already-malformed heart, none of INHIBITS, ACTIVATES, MODULATES, BYPASSES or RESTORES being true of it. The reviewer marked this suggestion entirely optional.

    Validation. `just validate`: all validations passed (schema, terms, references). `just validate-terms`: passed. `just count-verified-snippets`: 81/81 verified against cached references, up from 64/64. `just check-duplicate-keys`: OK across 2334 files. `just check-title-snippets`: OK, no new title-quoting snippets. `just validate-disorders kb/disorders/Visceral_Heterotaxy_9.yaml` (the batched schema+terms+references sweep CI runs on changed disorder files): passed. `just validate-history` on this record: No issues found. The pathograph foreign keys the new edges depend on were checked directly - every `downstream[].target`, every `target_mechanisms[].target` and every `discussions[].attaches_to` node resolves to a pathophysiology or phenotype name in the same file, with no duplicate names. tests/test_data.py was NOT run to completion locally: this machine was executing eighteen concurrent pytest processes from other curation worktrees and the run did not finish inside the available window. It is left to CI, where `test (3.13)` was already green on the parent commit. No new references were fetched and no cache file was hand-edited; every new snippet was drawn from references_cache/PMID_33037173.md, references_cache/PMID_38920647.md and references_cache/PMID_31534215.md, all already committed on this branch.

  summary: Add lipoprotein(a) marker with EAS 2022 risk bands
  details: |
    Added a Lipoprotein(a) biochemical marker bound to LOINC:43583-4 (molar) with two reference ranges carrying the European Atherosclerosis Society 2022 consensus risk thresholds (PMID:36036785): rule-out <75 nmol/L (<30 mg/dL), grey zone 75-125 nmol/L (30-50 mg/dL), rule-in >=125 nmol/L (>=50 mg/dL), and very high >430 nmol/L (>180 mg/dL, FH-equivalent lifetime risk). The mass-unit range is bound to LOINC:10835-7. LOINC labels were seeded with just loinc-seed-cache.

  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 2. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. Cited all five previously evidence-free `environmental:` exposures (Smoking, Diabetes, Hypertension, Dyslipidemia, Sedentary Lifestyle). Smoking and Diabetes are cited to the global PAD risk-factor meta-analysis (PMID:23915883), which ranks smoking first and diabetes second among 15 risk factors. Hypertension is PARTIAL: the CALIBER cohort evidences the association but not the atherogenic mechanism the note asserts. Dyslipidemia keeps its original 'LDL elevation' note because a source was found that supports the LDL fraction specifically and causally (PMID:33221847), rather than the broader hypercholesterolaemia the meta-analysis measured. Sedentary Lifestyle uses a device-measured prospective cohort rather than self-report. Curation note: Diabetes, Hypertension and Dyslipidemia are comorbid disease states rather than environmental exposures and would arguably be better modeled as comorbidity entries -- flagged, not restructured. Validated with `just validate`, `just count-verified-snippets` and the batched sweep.

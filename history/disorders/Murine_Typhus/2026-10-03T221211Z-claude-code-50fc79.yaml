  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for Rickettsia typhi, organised around the two cycles the source recognizes. Hosts: Rattus (NCBITaxon:10114, genus-level, primary mammalian reservoir of the urban cycle, with R. norvegicus and R. rattus named in the role string as the implicated species), Xenopsylla cheopis (NCBITaxon:163159, Oriental rat flea, urban vector), Didelphis (NCBITaxon:9266, genus-level, opossum reservoir and amplifying host of the suburban cycle), Ctenocephalides felis (NCBITaxon:7515, cat flea, suburban vector), Homo sapiens (NCBITaxon:9606, accidental host). Rattus and Didelphis are bound at genus because the source attributes the roles to rats and opossums generically. Vectors: both fleas. Felis catus is NOT recorded: PMID:33574726 names the cat flea as the suburban vector and describes it infesting opossums, but does not establish the cat as a reservoir of R. typhi, so no host row was invented for it. Three stages: urban maintenance cycle in rats and rat fleas, suburban maintenance cycle in opossums and cat fleas, and flea-borne transmission to the accidental human host. All evidence is PMID:33574726, the review the entry already relies on; the ecology sentences are graded OTHER with quote_role REVIEW_SYNTHESIS because they are the review's synthesis of vector-mammal ecology rather than human clinical data, while the human transmission sentence reuses the entry's existing HUMAN_CLINICAL grading unchanged. The file already carried both OTHER and HUMAN_CLINICAL for this reference on different sentences. No new references needed. The pre-existing NO_PROGRESSION finding is out of scope. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

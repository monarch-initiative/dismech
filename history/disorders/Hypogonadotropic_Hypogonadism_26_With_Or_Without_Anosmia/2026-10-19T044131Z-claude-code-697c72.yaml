  summary: 'Create: Hypogonadotropic Hypogonadism 26 With or Without Anosmia (TCF12)'
  details: |
    New entry for HH26 (MONDO:0030534), claimed in issue 14872. Curated as a standalone Disease following the HH18 and HH23 entries; MONDO lists no descendants and Kallmann_Syndrome has no TCF12 subtype row. Evidence: the founding 13-family cohort (PMID:32620954, abstract only), two case reports with full text (PMID:39036055 intragenic deletion; PMID:40642286 de novo splice variant), the TCF12 craniosynostosis paper for E-protein heterodimer function (PMID:23354436), and GeneReviews isolated GnRH deficiency (PMID:20301509) for management. Pathograph: TCF12 haploinsufficiency -> reduced E-protein heterodimer activity -> attenuated tcf3/stub1 expression (zebrafish, STUB1 rescue) -> disrupted GnRH neuron patterning and olfactory development -> gonadotropin deficiency. Epilepsy, obesity and papillary thyroid carcinoma in one case were not recorded as phenotypes because the reporting authors decline to attribute them to TCF12. Validated with just validate-disorders (52 snippets verified, 0 issues) and validate-terms.

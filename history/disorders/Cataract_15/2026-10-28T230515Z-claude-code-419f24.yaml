  summary: 'Create: Cataract_15'
  details: |
    New entry for cataract 15 multiple types (MONDO:0014110), autosomal dominant congenital cataract caused by heterozygous MIP (aquaporin 0, hgnc:7103) variants. Curated from 35 PubMed references fetched into references_cache: the founding MIP families (Berry 2000, Francis 2000), later family reports covering lamellar, polymorphic punctate, nuclear, cortical, polar, sutural and cerulean morphologies, cell-system functional studies (oocyte water permeability, endoplasmic reticulum retention and dominant-negative trapping, R33C adhesion loss), and mouse, rat and zebrafish models (Lop, Cat-Fr, Hfi, Cat-Tohm, Nat, Aqp0 knockout with AQP1 rescue, kfrs4 rat, aqp0a/b morphants). Pathophysiology is a chain from AQP0 dysfunction through mistrafficking, reduced water permeability, impaired fiber cell adhesion, fiber disorganization and ER stress to light scattering, conforming to cataract_lens_opacification at Lens Homeostasis Insult and Loss of Lens Refractive Transparency and Light Scattering. The OpenScientist report (research/Cataract_15-deep-research-openscientist.md) was used for leads: 19/19 references resolved, 0 off topic, needs_review true because of term mislabels (it binds lens fiber cell to CL:0000204 acceleration receptive cell; the entry uses CL:0011004 from the cache). It cites MIP 60 times and no other causal gene, so it is about this disease; just preflight-dr could not run because the local MONDO build is absent. References taken from it: PMID:32920712, 29947569, 20599966, 23226368, 36980880, 10802646, 11090476, 21511033, 28442635. No GeneReviews chapter (check-genereviews --online NO_CHAPTER) and no cached ClinGen record for MIP. Validation: validate, validate-terms, count-verified-snippets 85/85, validate-disorders, entity-ref, causal-target, coarse-phenotype, qualifier, duplicate-key, block-scalar, enum, logical-rule and gene-term checks all pass. Microphthalmia and persistent fetal vasculature (one de novo case) are deliberately left unwired.

  summary: 'Review and enrich: ADAM9-Related Retinopathy'
  details: |
    Added CORD9 synonyms, Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC), ultra-rare literature prevalence record, and variant_origin: GERMLINE on ADAM9. Added causal_link_type and verbatim evidence across pathophysiology downstream phenotype links. Bound Genetic Testing (NCIT:C15709) on Molecular genetic testing and added Full-field electroretinography (NCIT:C101217), Optical coherence tomography (NCIT:C20828), and Fundus autofluorescence imaging (NCIT:C162465) to diagnosis. Added treatments covering Supportive low-vision management (NCIT:C15747), Genetic counseling (NCIT:C15240, COUNSELING_INFORMATIONAL), and proposed ADAM9 Gene Augmentation Therapy (NCIT:C15238).

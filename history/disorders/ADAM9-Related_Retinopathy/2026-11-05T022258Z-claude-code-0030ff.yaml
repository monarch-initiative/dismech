  summary: 'Review round 1: ADAM9-Related_Retinopathy'
  details: |
    Addressed review 5778889580 on PR 16567. Removed the RPE Reorganization node, which had no incoming edge and duplicated the Egyptian-family fundus sentence already cited on the Abnormal retinal pigmentation phenotype; that phenotype is now a downstream target of RPE Apical Microvillus Disorganization, with a description saying the link is inferred from the animal models. Replaced the ambiguous PMID:38028590 colour-vision snippet (the same sentence appears for the PROM1 and ADAM9 probands) with a contiguous quote that names the family 4 proband, extended the CORD diagnosis snippet to include the ADAM9 genotype sentence that follows it, and added the family 4 sentence as childhood-onset evidence for reduced visual acuity. Switched the pseudopod node from GO:0006909 phagocytosis to GO:0006911 phagocytosis, engulfment, whose definition covers pseudopod-mediated internalization. PMID:23661369, cited by ClinGen, was fetched (also with --force) but only its abstract is available and it does not name ADAM9, so it is recorded in notes and not cited. No treatment row was added: none of the cited sources has a sentence on supportive care for this disease. Validation: just validate (50/50 snippets), validate-terms, path gates, and validate-disorders.

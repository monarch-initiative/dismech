  summary: 'Create: ADAM9-Related_Retinopathy'
  details: |
    Created the ADAM9-related retinopathy (MONDO:0800398, CORD9) entry from an OpenScientist deep-research report, used as leads only. just preflight-dr returned WARN only because RPE (retinal pigment epithelium) was counted as a second gene; the report is about ADAM9 throughout. The report's two failed quotes (PMID:20806078, PMID:20691256) were elided paraphrases of real abstract sentences; snippets here were taken from the cached abstracts directly. PMID:19409519 was re-fetched with --force to full text, which supplied the human fundus and ERG description and the per-family variants. Added ClinGen Definitive validity (CGGV assertion c648ec73) and used its evidence summary for myopia and peripheral retinal degeneration. Not used: PMID:25546566 (no abstract text retrieved), the report's photophobia and nystagmus phenotypes (the gene discovery report states neither was noted), its gnomAD and ClinVar figures (no citable source), the in-vitro MerTK/ADAM10/integrin branch (PMIDs 35163068, 21956108, 17704059, not shown in retina disease), and the review PMID:42171934. Cataract is recorded with a caveat because heterozygous unaffected siblings also had cataract. No prevalence, treatment or GeneReviews chapter found. Validated with just validate (50/50 snippets), validate-terms, the path-accepting gates and validate-disorders.

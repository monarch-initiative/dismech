  summary: 'Create: Necrotizing Enterocolitis'
  details: |
    De novo creation of kb/disorders/Necrotizing_Enterocolitis.yaml, anchored on
    MONDO:0005313. Curated as `category: Complex` with no `genetic:` block: NEC
    is a multifactorial disease of prematurity and no gene meets this KB's bar
    for a causal record, so the section was omitted rather than filled with a
    nominal susceptibility locus.

    No deep-research report exists for this disease. Every reference was found
    by independent PubMed search (NCBI E-utilities esearch/esummary over the
    pathophysiology, TLR4, microbiome, human-milk, probiotic, staging, surgical,
    imaging and neurodevelopmental literatures), triaged on title and journal,
    then fetched with `just fetch-reference` and quoted only from the resulting
    references_cache file. 23 references fetched, 23 cited, 88 evidence snippets.
    No reference was cited without its cache body being read first.

    Content curated: 15 pathophysiology nodes covering prematurity as the
    substrate, the two arms of TLR4 signalling (epithelial apoptosis with
    arrested restitution; endothelial eNOS loss with microcirculatory
    hypoperfusion), abnormal preterm colonization decomposed into a
    community-structure node and a Gammaproteobacterial-bloom/LPS-load node per
    the microbiome-curation skill, barrier failure with translocation, mucosal
    cytokine amplification, coagulative necrosis with intramural gas, transmural
    necrosis with perforation, systemic inflammation/sepsis, and cerebral white
    matter injury. 14 phenotypes, all 14 causally connected to the pathograph
    (verified with `just list-disconnected-phenotypes`). Bell staging curated as
    a `definitions` DIAGNOSTIC_CRITERIA record plus three `stages` entries.
    Two prevalence records (medical and surgical NEC, same contemporary US
    cohort, denominator stated as the at-risk preterm population). One
    histopathology finding. Two environmental exposures with
    `influences_mechanisms` links. Eight treatments, one of which
    (standardized feeding regimen) carries REFUTE evidence against slow enteral
    volume advancement. One `clinical_burden`
    record. Two `discussions`: a CONTROVERSY on the Paneth cell hypothesis
    (carrying a REFUTE item, because the human tissue series read here finds
    Paneth cell abundance unchanged in acute NEC) and a KNOWLEDGE_GAP on whether
    the post-NEC neurodevelopmental excess is causal.

    Module conformance: two nodes conform to `intestinal_barrier_dysfunction`
    (#Epithelial Stress and Injury, #Luminal Access and Inflammatory
    Amplification). Modules considered and rejected, with reasons recorded in
    the entry's `notes`: `gut_dysbiosis` (an aging hallmark scoped to
    age-associated microbiota drift feeding inflammaging, the wrong direction of
    life course for neonatal colonization), `epithelial_barrier_dysfunction`
    (models the type 2 allergic barrier hypothesis, terminating in IgE class
    switch and the atopic march), `neuroinflammation_glial_activation` (its
    central node is a reactive microglial and astrocytic state, and no source
    read for this entry measures glial activation in the brains of infants with
    NEC). No ischemia-reperfusion module exists in `kb/modules/`, so the
    microcirculatory nodes are curated de novo.

    Every ontology identifier was looked up at the time of writing, none from
    memory: MONDO:0005313 via OLS (label and non-obsolete status confirmed); HP,
    GO, CL, UBERON, NCBITaxon and NCIT terms via OLS search plus the committed
    `cache/<prefix>/terms.csv` labels; ECTO:9001757 via `runoak -i
    sqlite:obo:ecto`. Two bindings were deliberately left absent after recorded
    searches, both documented in `notes`: the preterm-formula exposure (ECTO has
    no infant-formula or human-milk feeding class) and the short bowel syndrome
    phenotype (HPO's only short-bowel term, HP:0030889, is congenital). An
    earlier draft bound short bowel syndrome to HP:0005214 Intestinal
    obstruction; that was removed as a wrong binding rather than carried with a
    coarse-binding basis. `HP:6000377 Intramural intestinal gas` was confirmed
    to carry "Pneumatosis intestinalis" as a synonym before use.

    Validation, each run separately and read: `just validate` (schema + terms +
    references) passed with 88/88 snippets verified and 111 titles checked, 0
    issues; `just validate-disorders` (the authoritative batched gate) passed;
    `just count-verified-snippets` 88/88; `just check-duplicate-keys`,
    `check-entity-refs`, `check-causal-targets`, `check-qualifier-terms`,
    `check-enum-values`, `check-environmental-evidence`, `check-snippet-length`,
    `check-title-snippets`, `check-snippet-grading`, `check-folded-hyphens`,
    `check-coarse-phenotypes`, `check-reference-titles` and
    `validate-history-all` all OK with no new findings and no baseline changed.

    The stub `stubs/Necrotizing_Enterocolitis.yaml` is deleted in the same
    commit.

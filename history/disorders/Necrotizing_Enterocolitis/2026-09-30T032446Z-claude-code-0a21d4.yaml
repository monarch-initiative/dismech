  details: |
    Review round addressing the CHANGES_REQUESTED review on PR #13195.

    Two ontology bindings were wrong and are corrected.

    1. `phenotypes[Ileal stricture]` was bound to `HP:0020002 Ileal stricture`
       under a `notes:` claim that HPO has no generic intestinal-stricture class.
       That claim was false, and false in an instructive way: the original search
       had only ever used the word *stricture*, and HPO names this concept by the
       word *stenosis*. Re-running against OLS HP, `l~stenosis` returns
       `HP:0012851 Colonic stenosis` and `l~intestinal stenosis` returns
       `HP:0012848 Small intestinal stenosis`. The row is renamed to
       `Post-NEC intestinal stricture` and rebound to `HP:0012851`, the colon
       being the site the cited review puts up to 80% of post-NEC strictures in -
       a figure that turned out to be quotable from the same complications-table
       row the entry already cited, and which is now recorded as evidence rather
       than asserted in prose. The `notes:` field is rewritten to record every
       query verbatim and what each returned. `HP:0012848` is named there as the
       term that would carry the non-colonic minority, but no source read for
       this entry names or quantifies the small-bowel share, so a second row is
       not asserted on the strength of the "up to 80%" complement alone.

       The rename dangled one bare-name pathograph target
       (`Coagulative Mucosal Necrosis and Intramural Gas Formation.downstream`),
       which is updated in the same edit.

       One incidental finding worth recording, because it would make a future
       negative-existence note false the same way: an `l~` search against OLS
       that returns exactly 50 results is truncated at the page limit, so a
       negative drawn from one is not a negative. `l~gas` returns 50 and misses
       `HP:6000377`, which `l~intramural` returns directly. This is noted in the
       entry beside the searches it affects.

    2. `pathophysiology[Endothelial TLR4 Activation and Loss of eNOS-Dependent
       Vasodilation]` bound `GO:0061028 establishment of endothelial barrier`
       DECREASED. Nothing in the node, its description or either PMID:23650378
       evidence item measured barrier establishment; both are about eNOS
       expression and NO-dependent perfusion. Rebound to `GO:0006809 nitric oxide
       biosynthetic process` DECREASED, which the upstream
       `Impaired Intestinal Microcirculatory Autoregulation` node already binds,
       with `preferred_term` carrying the eNOS specificity GO's label lacks.

    The deep-research artifact the review asked for is now committed as
    `research/Necrotizing_Enterocolitis-deep-research-claude_code.md` (1,683
    lines, `provider: claude_code`, `template_sha`
    1e7ea4ee817acfe1dda5f77fafe6f2e8b5927666, 27/27 references verified, 58/58
    terms resolved).

    It must not be read as independent corroboration of this entry, and the
    reason is a matter of provenance rather than of quality. It was generated
    AFTER the entry was curated, and the provider had the committed entry and its
    reference cache available while writing. Overlap between the report and the
    YAML is therefore expected by construction and carries no evidential weight;
    where the report agrees with a curated claim, that agreement is not a second
    source. It is committed as a cross-check input and as a lead list, which is
    all the review asked of it.

    `just preflight-dr` returns SKIP rather than PASS: MONDO records no causal
    gene (`RO:0004003`) for MONDO:0005313, so the gene-identity discriminator has
    nothing to work with. That is the expected result for a non-Mendelian disease
    and not a degraded lookup. The manual identity check was done instead - the
    report's gene tally is TLR4=76, SIGIRR=21, NFKB1=4, LY96=4, which is this
    disease's mechanism and not a neighbouring one. The report's own term
    validation flags `HP:0006970`, which the report names "Necrotizing
    enterocolitis (the disease as an HP feature)" while HPO calls it
    Periventricular leukomalacia; this entry uses `HP:0006970` correctly for
    periventricular leukomalacia, and no CURIE was lifted from the report.

    Genetic susceptibility. The report surfaced four references the entry did not
    cite, three of them on a theme the entry said nothing about. Each was fetched
    and read.

    - PMID:25963006 (SIGIRR variants in premature infants with NEC) is cited, and
      a `genetic:` block is added on the strength of it: one record, SIGIRR,
      `relationship_type: SUSCEPTIBILITY`, `variant_origin: GERMLINE`, with two
      evidence items - the human sequencing result (10 of 17 stage II+ infants)
      and the in-vitro demonstration that the variants are loss-of-function and
      exaggerate the lipopolysaccharide response. The entry keeps
      `category: Complex`. This is deliberately option (a) over a notes-only
      answer, because SIGIRR is the one NEC locus with both human
      loss-of-function variants and functional corroboration, and because the
      mechanism it implicates is the TLR4 arm this entry is built around - losing
      the epithelial brake on TLR4 lowers the threshold at which a given luminal
      lipopolysaccharide load fires the node the pathograph already carries.

      What the record deliberately does NOT claim: `gene_disease_validity` is
      absent, because no external body has classified the pair and a tier is
      copied rather than assigned. The cohort is 17 sequenced infants with no
      matched preterm control group reported, so "10 of 17" is a variant
      frequency among cases and not an effect estimate; the `notes:` field says
      so, because the number reads like an association until you look for the
      denominator. NFKB1, LY96, IL18 and TLR4 itself are named in the disease
      notes as reviewed and not curated - nothing read here supplies a quotable
      human result for them.

    - PMID:39949097 (Twins and NEC: Genetic Relevance) is cited in a new
      `discussions` entry, `nec_heritable_component`, `kind: KNOWLEDGE_GAP`,
      attached to `genetic#SIGIRR`. The review cuts both ways within one
      abstract, so it is curated as three items and not one: concordance and
      zygosity data suggesting a heritable contribution (SUPPORT), the
      gestational-age-adjusted analyses that erase the twin-singleton difference
      (REFUTE), and the authors' own statement of what would settle it.
      Twins are born earlier and prematurity is this disease's dominant risk
      factor, so the adjusted comparison is the one that matters, which is why
      the gap is recorded as open rather than resolved in favour of heritability.

    - PMID:31375667 (murine anemia/RBC-transfusion NEC model) supports a new
      `environmental:` entry for transfusion-associated NEC, bound to
      `ECTO:2000058 exposure to blood transfusion`. Graded carefully: the
      clinical association is quoted from the paper's own background sentence as
      HUMAN_CLINICAL with `quote_role: BACKGROUND`, so a mouse study is not made
      to assert a human epidemiological link; the mechanism, the dose-response on
      anemia and the four protective interruptions are MODEL_ORGANISM and
      INDIRECT. The mechanism link targets
      `Mucosal Proinflammatory Cytokine Amplification` with
      `causal_link_type: INDIRECT_KNOWN_INTERMEDIATES`, because the model names
      the intermediates (macrophages, TLR4) rather than leaving them open, giving
      a third TLR4-dependent input into a node the epithelial and endothelial
      arms already converge on. `environmental_effect` is PREDISPOSES and not
      TRIGGERS even though the model demonstrates triggering: the human
      association is contested, and whether transfusion or the anemia behind it
      is the operative exposure is unresolved. The entry `notes:` records the
      iatrogenic tension - transfusion is a putative risk exposure at onset and a
      supportive treatment in established disease, and neither reading cancels
      the other.

    - PMID:41315724 ("Does genetic susceptibility play a role in necrotizing
      enterocolitis?") was fetched and is NOT cited. Its cache carries
      `content_type: unavailable` with an empty body: PubMed holds no abstract
      for this 2026 commentary, so there is nothing quotable in it and its title
      is a question rather than a finding. The cache file was deleted rather than
      committed uncited.

    Suggestions taken from the review.

    - `Probiotic Supplementation` gains `therapeutic_modality: OTHER`, with a
      `notes:` line recording why not the `BEHAVIORAL` that `NCIT:C15447 Dietary
      Intervention` would suggest mechanically: a dose of live organisms given to
      alter the colonizing community is not a change in diet pattern, and this is
      the same reason the documented backfill table excludes
      nutritional-supplementation terms.

    - `Hematochezia`'s description said "gross or occult blood" against
      `HP:0002573`, which means visible blood. Rewritten to say visible blood and
      then to say explicitly that occult faecal blood also occurs and is
      deliberately outside what this row records, which is the clearer of the two
      options the review offered.

    - Two radiographic phenotypes are added and wired into the pathograph:
      `Portal venous gas` downstream of
      `Coagulative Mucosal Necrosis and Intramural Gas Formation`, and
      `Pneumoperitoneum` downstream of
      `Transmural Necrosis and Intestinal Perforation`. Both are left unbound,
      because HPO has neither concept. Every query is recorded in the respective
      `notes:` field with a positive control on the same adapter in the same
      session (`l~intramural` returns `HP:6000377`; `l~Hematochezia` returns
      `HP:0002573`), so the negative is demonstrably about HPO's coverage rather
      than a dead lookup. The searches were: `l~pneumoperitoneum`,
      `l~pneumatosis`, `l~free air`, `l~intraperitoneal`, `l~peritoneal gas`,
      `l~peritoneal`, `l~air`, `l~portal venous gas`, `l~hepatoportal`,
      `l~portal`.

    - Acid suppression is added as two `environmental:` entries rather than one,
      `Proton pump inhibitor exposure` (`ECTO:2000019`) and `Histamine H2
      receptor antagonist exposure` (`ECTO:9001771 exposure to histamine
      antagonist`, broader than H2 with the specificity carried in
      `preferred_term`). ECTO has no class covering acid suppression as a whole -
      `l~antiulcer`, `l~gastric acid` and `l~acid suppress` each return nothing -
      so a single entry would have had to bind one class and silently cover the
      other. The two share their supporting sentence from PMID:38564081 because
      the review names both classes in one breath and separates neither.

    Gates, all run separately and all passing on this tree: `just validate`
    (107 snippets, 133 titles, 0 issues), `just count-verified-snippets`
    (107/107), `just validate-terms`, `just validate-disorders` (the
    authoritative batched sweep), `check-duplicate-keys`, `check-entity-refs`,
    `check-causal-targets`, `check-qualifier-terms`, `check-enum-values`,
    `check-environmental-evidence` (the hard gate, with three new exposures
    each carrying their own entry-level evidence and no waiver used),
    `check-folded-hyphens`, `check-snippet-length`, `check-title-snippets`,
    `check-snippet-grading`, `check-coarse-phenotypes`,
    `check-reference-titles`, `check-case-collisions`, `check-not4curation`.
    `just list-disconnected-phenotypes` reports 16 of 16 phenotypes causally
    connected after the two additions. No baseline file was modified.

    Term caches gained four validator-written rows: `HP:0012851`,
    `ECTO:2000019`, `ECTO:9001771` and `hgnc:30575`, plus their enum-membership
    rows. `HP:0020002` remains in `cache/hp/terms.csv` now that nothing binds
    it; that row is validator-derived and is deliberately left alone.

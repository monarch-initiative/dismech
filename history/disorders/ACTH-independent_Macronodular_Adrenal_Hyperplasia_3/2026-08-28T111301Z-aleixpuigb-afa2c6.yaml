  summary: 'Review round 1: add diagnosis, ACTH and morning-cortisol phenotypes, fix
    urinary cortisol term'
  details: |
    Review round 1 on PR #9821 (ai4c-reviewer, CHANGES_REQUESTED). All four blocking findings accepted and fixed; they were correct.

    A. Added a diagnosis: section with four entries - the mixed meal test with oral versus intravenous glucose (the oral/IV dissociation is the cleanest physiological proof of the GIP mechanism and was quotable from PMID:21264796, already cached in the PR), dexamethasone non-suppression, the morning/midnight cortisol ratio as a screening discriminator cross-referencing the biochemical entry, germline KDM1A/ARMC5 sequencing, and adrenal cross-sectional imaging.

    B. Fixed the cortisol phenotype. The claim and snippet are about 24-h URINARY free cortisol but the term was HP:0003118, a plasma analyte; changed to HP:0012030 Increased urinary cortisol level. Also removed frequency: VERY_FREQUENT - it had been derived from a group MEAN in a ten-patient cohort rather than from a count of affected patients, which is an arithmetic error dressed as an annotation. Added the reviewer's counterexample from PMID:21264796, a GIP-dependent case with UFC within normal limits, as PARTIAL evidence, and a note explaining why no frequency band is asserted.

    C. Added Low Morning Fasting Cortisol as a phenotype (HP:0008163) with temporality: DIURNAL. The entry's own prose called this the reason patients are missed but never recorded it. The note warns that the HP term alone reads as hypocortisolism, which would be a dangerous misreading - the level is low only at the morning timepoint while total daily output is raised.

    D. Added Decreased Circulating ACTH (HP:0002920). The reviewer was right that the entity's defining feature was unsupported - none of the seven cached references mentioned ACTH. Fetched PMID:39465833, a PBMAH case report with a measured suppressed ACTH and bilateral adrenal masses on CT. Graded PARTIAL and noted explicitly that the evidence is at the level of PBMAH rather than KDM1A-related PBMAH, since no KDM1A cohort paper reports ACTH values. Also recorded the nuance the reviewer raised from PMID:42067271: intra-adrenal ACTH production means "ACTH-independent" describes independence from PITUITARY ACTH, not absence of ACTH signalling.

    Also took the non-blocking suggestion to add pasireotide as a second therapeutic_agent on the somatostatin treatment.

    Two errors of my own were caught during this round and fixed before pushing. I guessed NCIT:C79835 for pasireotide; term validation reported it as Hsp90 Inhibitor XL888, and the correct binding is CHEBI:72312. That wrong CURIE had also been written into cache/ncit/terms.csv and the chemicalentityterm enum cache as a side effect, so both files were reverted and re-derived so only terms the entry actually uses are cached. PMID:41864332 was fetched during the ACTH search but is not cited, so it was removed rather than committed.

    Validation after fixes: just validate passes - schema, terms, and 43/43 snippets verified (up from 30/30); just validate-disorders, just check-entity-refs and just check-duplicate-keys pass. Cache diff is a single additive row, HP:0012030.

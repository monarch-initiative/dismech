  summary: 'Create: ACTH-Independent Macronodular Adrenal Hyperplasia 3 (KDM1A)'
  details: |
    De-novo curation of MONDO:0700299 (KDM1A-related PBMAH / food-dependent Cushing syndrome).

    Deep research: one openscientist run (research/ACTH-independent_Macronodular_Adrenal_Hyperplasia_3-deep-research-openscientist.md). Its reference_validation reported 15/15 references resolved, confabulation_rate 0.0, 1/1 quoted claims valid, 0 off-topic. `just preflight-dr` flagged GIP as a rival gene at 44% of KDM1A mentions; this was assessed and judged a false positive - GIP/GIPR is this disease's effector mechanism, not a second disease entity.

    The DR report added two things the initial draft missed, both incorporated: somatostatin-analogue therapy (PMID:21264796, recorded as REFUTE - acute postprandial suppression with escape and no clinical benefit), and the reported association with adrenal myelolipoma, MGUS and multiple myeloma (PMID:36857084), recorded as PARTIAL with no frequency asserted.

    Mechanism modelled as a chain: germline truncating KDM1A allele -> somatic 1p loss of the wild-type allele -> loss of H3K4 demethylase activity in adrenocortical cells -> ectopic GIPR expression -> meal-triggered adenylate cyclase activation and cortisol synthesis -> inverted diurnal rhythm and bilateral macronodular hyperplasia -> ACTH-independent hypercortisolism.

    Four discussions record the gaps: surgical evidence is extrapolated from a BMAD cohort in which no KDM1A variants were found; the morning/midnight cortisol ratio's reported 100% sensitivity/specificity is a derivation-cohort figure from ten patients with no external validation; the all-female KDM1A series is unexplained; and the cAMP/PKA step is inferred from GIPR's canonical coupling rather than measured in this disease.

    One error was caught by term validation and fixed before commit: hgnc:4270 (GIP) had been used for GIPR, which is hgnc:4271.

    Validation: just validate passes - schema, terms, and 30/30 snippets verified against cached references; just check-entity-refs and just check-duplicate-keys pass.

  summary: Split multiple myeloma out of the extra-adrenal neoplasia binding
  details: |
    The 'Associated Extra-Adrenal Neoplasia' phenotype bound HP:0002664 Neoplasm and covered three reported associations. One of them, multiple myeloma, has an HPO term (HP:0006775) and is now its own phenotype citing the same review sentence (PMID:36857084) with no frequency, since the review gives no denominator. The other two do not: searches of 'myelolipoma' and 'gammopathy' return no HPO term, so the coarse node keeps them under coarse_binding_basis NO_HPO_TERM with that search recorded in term_gap, and its preferred_term now names what it covers rather than echoing 'Neoplasm'. Also removed a stale evidence explanation that said 'Graded PARTIAL because...' - that value was retired from EvidenceItemSupportEnum and the prose outlived it. Validated with linkml-validate, linkml-term-validator, the snippet audit (44/44) and the offline KB gates.

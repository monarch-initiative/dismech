  summary: 'Edit: Multiple_Endocrine_Neoplasia_Type_2, rebind intestinal ganglioneuromatosis
    and mucosal neuromas off HP:0003005'
  details: |
    Rebinds the two MEN2B phenotype rows that were bound to Ganglioneuroma (HP:0003005), which HPO defines as a tumour of the sympathetic nervous system arising from neural crest sympathogonia. Neither lesion is that tumour.

    Intestinal Ganglioneuromatosis now binds Ganglioneuromatosis (HP:0025151), defined as a hyperplastic submucosal and myenteric plexus with increased ganglion cells, glial cells and nerve fibres (parent HP:0004362 Abnormal enteric ganglion morphology). Its description said the lesion causes "constipation, megacolon, and feeding difficulties from infancy"; no cached source supported megacolon or feeding difficulties, so the description now states only what the evidence carries. Two items from the Gfroerer 2017 systematic review of 55 MEN2B patients with gastrointestinal symptoms (PMID:27899172, fetched with just fetch-reference, abstract only) support it: constipation was the commonest symptom (72.7%), onset was below one year in 29 of 55, MEN2B was diagnosed at a median of 13.0 years, and intestinal ganglioneuromatosis on histology led to the diagnosis in 15 of 55 at a median of 3 years.

    Mucosal Neuromas now binds Multiple mucosal neuromas (HP:0031023), defined as papules on the oral mucosa (parent HP:0030430 Neuroma). Its note had said HPO has no specific term for mucosal neuromas; an OLS search of HP for "neuroma" on 2026-11-05 returned HP:0030430 Neuroma, HP:0031023 Multiple mucosal neuromas, HP:0009588 Vestibular schwannoma and HP:0009589 Bilateral vestibular schwannoma, so the note was wrong. The new note records that the HPO definition covers the lip and tongue neuromas the GeneReviews evidence names but not the eyelid neuromas the description also mentions. The GeneReviews evidence item (PMID:20301434) is unchanged on both rows.

    Term labels and parents were read from OLS (ols4 hp) in the same step. validate-terms added HP:0025151 and HP:0031023 to cache/hp/terms.csv and the phenotype enum cache. Validation: just validate, validate-terms and count-verified-snippets (49 of 49) pass on the entry.

    Review round 1 (a non-blocking suggestion on #16626): the description's "rectal biopsy" had no snippet behind the word rectal, so a third PMID:27899172 item now quotes the abstract's CONCLUSION sentence, that taking a rectal biopsy that screens for intestinal ganglioneuromatosis offers the chance of diagnosing MEN2B in infancy. The description is unchanged. The rebase onto main for the ruff fix (#16622) changed nothing else.

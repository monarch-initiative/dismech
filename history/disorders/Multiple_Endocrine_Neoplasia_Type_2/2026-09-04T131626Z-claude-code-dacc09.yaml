  details: |
    PR Shepherd review round on PR #8799.

    (1) Blocking item. genetic[0].notes still carried the unqualified claim that germline RET mutations "cause ligand-independent dimerization and kinase activation", which the PR had already corrected on the pathophysiology node and which PMID:9620546 (added by this PR) contradicts for MEN2B. The notes now state the subtype split: ligand-independent kinase activation, via extracellular-cysteine disulfide dimerization in MEN2A, while the MEN2B M918T kinase-domain allele activates without forming dimers.

    (2) Took the reviewer's preferred non-blocking route on the RET Oncogene Activation node description rather than only annotating it. The description now carries the subtype split directly, so the PMID:9620546 dimer-formation evidence reads as clean support for the MEN2B half instead of an erratum against the node, and the node notes read as mechanistic detail rather than a correction. This also resolved the retired supports: PARTIAL value on that item, which issue #10003 removed from EvidenceSupportEnum after this branch was cut and which would have failed check-enum-values on merge. An intermediate SUPPORT/REFUTE split of the same sentence was tried and discarded: correcting the description is the better fix and is what the reviewer suggested.

    (3) Fixed the failing test (3.13) check. check-folded-hyphens flagged the root notes: at line 958, where a folded-scalar line ended in "no RTK/oncogene-", so folding would have inserted a space inside the compound. Reflowed to "and the enum has no RTK/oncogene-activation value."

    (4) Two further non-blocking suggestions taken. The unsourced "95% of cases" figure for M918T is replaced with the cached source's own "almost always" in both places it appeared (has_subtypes[MEN2B].description and genetic[0].notes), and the attached explanation no longer needs to disclaim the numeric gap. The evidence_source on the PMID:15013219 disease-causation snippet at the Downstream Signaling Cascade Activation edge is changed from IN_VITRO to HUMAN_CLINICAL, since that sentence is a statement about human tumor causation rather than a cell-based result.

    Not done: the reviewer's observation that the root notes: slot mixes taxonomy commentary with disease notes is a schema gap (DiseaseClassifications has no notes slot) and is out of scope for a review round.

    Validation: just validate passes (schema, terms, references); just count-verified-snippets 34/45 with 11 DOI refs skipped by prefix, unchanged from the pre-existing count since no snippet text was altered; check-folded-hyphens clean; check-duplicate-keys clean. check-snippet-length and check-title-snippets report findings in eleven other entries, all pre-existing and none in this file; they surface here only because this branch's baselines are 994 commits old.

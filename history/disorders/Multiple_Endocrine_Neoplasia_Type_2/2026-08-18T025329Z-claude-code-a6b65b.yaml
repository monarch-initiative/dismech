  details: |
    Weekly compliance pass, endocrine classification/taxonomy focus. Added a classifications block with three Harrison's Parts, each with a notes rationale: ONCOLOGY_HEMATOLOGY (hereditary cancer syndrome, MTC is the defining neoplasm), ENDOCRINOLOGY_METABOLISM (tumors of two or more endocrine glands; essentially all management is endocrine), GENETICS_ENVIRONMENT_DISEASE (autosomal dominant germline RET with clinically actionable genotype-phenotype correlations). Left icdo_morphology empty because the entry is a multi-tumor predisposition syndrome rather than a single neoplasm, and mechanistic_category empty because MEN2 is not a RASopathy and no RTK-activation value exists; both recorded in a notes block. Added evidence to all four previously unevidenced pathophysiology nodes, all three bare downstream causal edges, all three has_subtypes entries, the genetic inheritance block, and both biochemical markers. Two new references fetched with just fetch-reference: PMID:15013219 (RET downstream signalling pathways) and PMID:9620546 (RET dimerization). The latter materially qualifies the RET Oncogene Activation node: MEN2B M918T activates RET ligand-independently but does NOT form dimers, so the node's ligand-independent dimerization clause covers the MEN2A cysteine alleles only. Recorded as a PARTIAL evidence item plus a node notes block rather than silently rewriting the description. Also recorded that the cited signalling review does not mention the JAK-STAT arm the node description names. Validated with just validate: schema, terms and references all pass, 34/34 PMID snippets verified (11 DOI references skipped by prefix). Weighted compliance 83.0 percent to 95.5 percent. Remaining: root datasets, two deep-research reference findings whose statement is only the paper title, and harrisons_chapter evidence (notes preferred for taxonomy placements).

  summary: Fix title-only findings in MEN2 references block
  details: |
    Content-by-content read of the Falcon deep-research references bibliography block (issue #6980), following the same audit already done for Addisons_Disease, Graves_Disease, Type_I_Diabetes and Congenital_Adrenal_Hyperplasia. Two entries (DOI:10.1007/s12022-024-09836-x and DOI:10.1186/s12964-024-01837-x) had both statement and supporting_text simply repeating the paper title with no evidence block at all, even though the cached full text carries a real abstract; replaced both with a genuine content-bearing sentence quoted from the cached abstract and added a proper evidence item (evidence_source OTHER, since both are reviews or consensus statements rather than primary human-clinical data). Two further entries (DOI:10.3390/cancers15194865 and DOI:10.3390/cancers16030494) already had a real supporting_text and evidence snippet but a statement field that duplicated the title; replaced statement with a short paraphrase of the already-verified supporting_text. The remaining nine reference entries in the block were left untouched, since their statement and supporting_text already state genuine findings distinct from the title. Verified with just validate, just count-verified-snippets, just check-folded-hyphens, just check-duplicate-keys, just check-snippet-length, just check-title-snippets and just check-source-defect-claims; all pass with no new findings on this file.

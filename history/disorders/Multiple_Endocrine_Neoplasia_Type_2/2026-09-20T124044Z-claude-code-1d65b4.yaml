  summary: 'Genetics pass: wire RET into the pathograph and subtype rows'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: GeneReviews PMID:20301434 is already the tagged baseline and the
    entry's RET curation was checked against it and against Orphanet before the MONDO
    reconciliation checklist was opened. MONDO records RET (hgnc:9967) for all three
    keyed subtypes (MONDO:0008234 MEN2A, MONDO:0008082 MEN2B, MONDO:0007958 FMTC);
    RET was already curated and bound, and each subtype row already carried the
    correct MONDO term. Every subtype term was cross-checked against the Monarch
    CausalGeneToDiseaseAssociation endpoint, which returns RET for all three.

    Changes:
    - Wired RET onto the `RET Oncogene Activation` pathophysiology node as a `genes:`
      descriptor. Before this the entry's only gene binding was in `genetic:`, which
      the KGX exporter emits against the umbrella term only.
    - Added RET as a `genes:` descriptor on all three `has_subtypes` rows.
    - Added `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` to the RET
      genetic record. GERMLINE is the honest value and does not disturb the
      cancer-origin derivation, which skips this entry as a germline predisposition
      syndrome (`just check-cancer-origin` confirms).
    - Removed an unsourced cytogenetic sub-band. The RET note read "RET (10q11.21)";
      10q11.21 appears in no reference this entry cites. Replaced with the location
      the cited review PMID:11786689 actually gives, attributed inline.

    No new evidence items were needed: the pathograph wiring reuses bindings whose
    claims the node already evidences.

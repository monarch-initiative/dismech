  summary: Bind MONDO:0007958 to the FMTC subtype row
  details: |
    Review round 2 (#11465): the reviewer blocked on the Familial Medullary Thyroid Carcinoma (FMTC) has_subtypes row being left unbound, on the stated ground that no MONDO identifier exists. That ground was wrong. MONDO:0007958 'familial medullary thyroid carcinoma' resolves in MONDO and its hierarchicalParents are MONDO:0015277 (medullary thyroid gland carcinoma) and MONDO:0019003 (multiple endocrine neoplasia type 2), so MONDO itself places the concept under MEN2 and binding it here asserts a containment the ontology already makes. Resolution 1 of the two the reviewer offered was taken: added the subtype_term block with the character-exact canonical label. just validate and just validate-terms both pass; the term and enum caches were populated by the validator (one appended row each, no reordering or restamping). The earlier history record for this entry is left unamended, per the append-only rule.

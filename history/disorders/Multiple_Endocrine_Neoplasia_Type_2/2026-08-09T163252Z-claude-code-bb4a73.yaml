  details: |
    Follow-up sub-task from issue #6307 (cancer-predisposition evidence review). Added evidence: blocks (all citing the newly fetched GeneReviews chapter PMID:20301434) for the five uncited MEN2 phenotypes (Pheochromocytoma, Primary Hyperparathyroidism, Mucosal Neuromas, Intestinal Ganglioneuromatosis, Marfanoid Habitus) and for the three uncited treatments (RET Kinase Inhibitors, Surveillance Protocol, Genetic Counseling). Added a second evidence item to the RET genetic note citing PMID:20301434's exact de novo germline-variant rate (5-9% MEN2A / 50% MEN2B), which matches the entry's existing figures and resolves the issue's flagged ~75% discrepancy: that 75% figure (DOI:10.3390/cancers15194865) is the sporadic-vs-genetic MTC split, not a MEN2B de novo rate, so it was never actually in conflict; explanation text now records why. Replaced the generic JCO Clinical-Trial-Updates boilerplate snippet on the DOI:10.1200/jco.23.02503 references roll-up entry with the real LIBRETTO-001 objective-response-rate finding. Left the remaining sub-tasks in #6307 (Fanconi_Anemia KMT2D citation, SUFU-related NBCCS ovarian fibroma strengthening, Cowden/Retinoblastoma evidence discipline, and the DOI:10.1186/s12964-024-01837-x stub, whose cache is no longer empty but needs its own careful full-text-quoting pass) for a future run. Validated with just validate (schema + terms + references, --no-full-text) and just count-verified-snippets: 11/22 verified against cached references, 11 skipped by DOI prefix per repo policy; all pass.

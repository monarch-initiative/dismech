  details: |
    Correctness review of endocrine entries. Regraded medullary thyroid carcinoma frequency OBLIGATE -> VERY_FREQUENT: OBLIGATE means 100% but the entry's own subtype text says penetrance 'approaches 100% but varies with specific mutation', and moderate-risk RET variants plus incidentally ascertained carriers are substantially less than fully penetrant. Rebound Marfanoid Habitus from HP:0001166 (Arachnodactyly, only one component of the habitus) to HP:0001519, which carries 'Marfanoid habitus' as an exact synonym (verified with OAK). Primary hyperparathyroidism FREQUENT -> OCCASIONAL to match the stated 20-30% against the 30-79% FREQUENT band. Intestinal ganglioneuromatosis FREQUENT -> VERY_FREQUENT (near-universal in MEN2B from infancy). Added the missing RET gene_term (hgnc:9967) and an HPO inheritance_term binding. Added pralsetinib as a therapeutic_agent (named in the description but unbound); NCIT id verified with OAK after an initial guess resolved to an unrelated preeclampsia term. Retagged three deep-research 'findings' from HUMAN_CLINICAL to OTHER where the quoted sentence is a definitional or methodological statement from a review, not human clinical data.

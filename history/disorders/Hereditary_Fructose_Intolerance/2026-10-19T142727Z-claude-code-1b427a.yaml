  details: |
    Fetched the GeneReviews chapter (PMID:26677512, NBK333439), added it to references with the GeneReviews tag, and added exact-quote evidence from each abstract section: clinical characteristics (Hypoglycemia, Nausea, Vomiting, Abdominal pain, Growth delay, Hepatic Failure, Renal insufficiency), diagnosis/testing (Molecular genetic testing), management (fructose/sucrose/sorbitol-restricted diet, including avoidance of fructose-containing IV fluids) and genetic counseling (autosomal recessive inheritance and the 25% sib recurrence risk). Removed the duplicate ALDOB genes descriptor on the Aldolase B deficiency node, which already carried gene hgnc:417. Split essential fructosuria into its own differential_diagnoses item bound to MONDO:0009252 (label checked in cache/mondo/terms.csv) and moved the fructosuria snippet from PMID:18035330 there; the IBS row keeps the adult-presentation snippet. Corrected the previous session's history record, which named MONDO:0009250 and claimed a GO:0004332 addition that was already on main. Fructose-1,6-bisphosphatase deficiency was not added as a differential because the GeneReviews abstract does not mention it.

  summary: Bind LOINC codes for ALK IHC and FISH testing (tranche F batch 1)
  details: |
    LOINC tranche F batch 1 (tumour markers and somatic biomarker tests). This row names three complementary, non-interchangeable methods (IHC, break-apart FISH, DNA/RNA NGS) with no single committed method -- discordant results require orthogonal confirmation. Searched LOINC for a Part-level 'ALK gene rearrangement' identity code independent of method and confirmed none exists; every ALK code in LOINC is method-specific. Bound two of the three methods with clean [Presence]-level codes: LOINC:47303-3 (Anaplastic lymphoma kinase Ag [Presence] in Tissue by Immune stain) for IHC, and LOINC:78205-2 (ALK gene rearrangements [Presence] in Blood or Tissue by FISH) for FISH. Left the NGS/RNA-fusion method unbound: the only LOINC codes for ALK by molecular-genetics method are point-mutation-style 'mutations found/tested for' codes, not a rearrangement- or fusion-specific presence code, so binding one would misrepresent what NGS actually detects for this disease. Both codes newly seeded (absent from origin/main). just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

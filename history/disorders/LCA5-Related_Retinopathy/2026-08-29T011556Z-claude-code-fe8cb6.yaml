  details: |
    # Fix summary: LCA5-Related Retinopathy

    ## Findings fixed

    1. **MINOR — flat-ERG evidence rests on a different-gene, general-LCA paper**
       (review finding 1). PMID:10615133 is the AIPL1/LCA4 gene-discovery paper; its
       snippet is a general statement about LCA, not LCA5-specific ERG data. The entry was
       already transparent ("of which LCA5 is a genetic subtype"), so per the task this was
       a wording-improvement only. Updated both identical explanations (phenotype
       "Undetectable electroretinogram" and diagnosis "Electroretinography") to state
       explicitly that no LCA5-specific ERG data was available and that the snippet is a
       general LCA statement drawn from a different LCA-subtype gene-discovery paper
       (AIPL1/LCA4). Snippet and evidence_source unchanged (correct as-is).

    2. **MINOR — phenotype frequencies extrapolated from a 2-patient (1-patient for
       pigmentary retinopathy) case series** (review finding 2). Per the task's preference
       ("prefer softening notes over inventing new bands"), kept the bands and added honest
       cohort-size context to each explanation:
       - Nystagmus (VERY_FREQUENT): now states it was seen in both patients of a
         two-patient series and that the band is a clinical estimate extrapolated beyond
         the sample but consistent with nystagmus being a cardinal LCA feature.
       - Hyperopia (FREQUENT): now states both patients of the two-patient series and that
         the band is a clinical estimate.
       - Pigmentary retinopathy (FREQUENT): now states the finding was documented in one
         patient (P1) of a two-patient series and the band extrapolates beyond that single
         documented case.
       No frequency bands were changed and no new bands invented; only the explanations
       were softened to make the small-sample basis explicit.

    ## Findings intentionally skipped

    - **Review finding 3** (GeneReviews PMID:30285347 dispositioned in
      `references[].findings[]`): report explicitly marks this "Not a finding (noted as good
      practice) ... Correctly handled." No change.

    ## New/changed references

    - None. All edits were explanation-prose only; no snippets, bindings, or references
      changed or fetched.


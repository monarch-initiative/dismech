  summary: 'Create: LCA5-Related Retinopathy'
  details: |
    Fresh curation of LCA5-related retinopathy (issue #4008 long-tail gene list). 3-node pathograph: lebercilin loss destabilizes the bulge region of the photoreceptor ciliary axoneme (shared with RP1/IFT81/IFT88) -> impaired IFT cargo delivery and outer-segment disc formation failure -> photoreceptor outer segment degeneration (conforms_to ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration). 4 phenotypes (severe congenital visual impairment, nystagmus, hyperopia, pigmentary retinopathy), autosomal recessive inheritance, and the OPGx-001/OPGx-LCA5 AAV8 gene-augmentation trial (NCT05616793, phase 1b/2a/3, cone-vision recovery sustained to 12 months) as the primary treatment entry. Sourced via independent WebSearch/WebFetch literature research (no deep-research tool run this session) against 5 independently-verified PMIDs (17546029, 18334959, 19503738, 37071472, 40598770) plus the GeneReviews LCA/EOSRD overview and the ClinicalTrials.gov NCT05616793 registry record. disease_term MONDO:0100445 (LCA5-related retinopathy) chosen to match sibling gene-tail entries' ClinGen-affiliated MONDO:0100xxx convention (AIPL1, RDH5, RP2, etc.); classic MONDO:0011473 (Leber congenital amaurosis 5, OMIM:604537) cross-referenced via mondo_mappings skos:narrowMatch. NEC check: MONDO:0011473's causal-gene relationship (hgnc:31923 LCA5) matches the gene used throughout. Full validation clean: schema (No issues found), term validation (Validation passed), reference validation (22/22 snippets verified, zero unresolved). Two known Windows-local cache side effects hit during validation and manually reverted before commit: the recurring cache/mondo/terms.csv mojibake corruption of MONDO:0009145/MONDO:0100163 (restored to correct UTF-8), and an unrelated references_cache/PMID_30285347.md frontmatter re-normalization (reverted, out of scope for this PR).

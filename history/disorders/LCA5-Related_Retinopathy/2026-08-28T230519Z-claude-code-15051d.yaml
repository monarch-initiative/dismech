    # Review: LCA5-Related Retinopathy

    - File: `/home/user/dismech/kb/disorders/LCA5-Related_Retinopathy.yaml`
    - Review date: 2026-08-28
    - Mechanical audit: **32/32 snippets verified** against cached references
      (`uv run python -m dismech.reference_snippet_audit`).

    ## Verdict: MINOR_ISSUES

    No claim-fidelity or misclassification finding rises to MAJOR/CRITICAL. Every
    snippet is an exact substring of its cached source and substantively supports
    its specific claim (right gene LCA5/lebercilin, right disease LCA5-LCA, right
    direction). `evidence_source:` is correct throughout: MODEL_ORGANISM for the
    Lca5gt/gt mouse mechanism/gene-augmentation study (PMID:37071472),
    HUMAN_CLINICAL for the patient gene-discovery / imaging papers and the
    first-in-human trial (PMID:40598770), and OTHER-free entries are appropriately
    uncited. The model/human evidence layering on the pathophysiology and
    animal-model links is careful (mouse mechanism nodes are backed by the human
    lebercilin-localization paper PMID:17546029 and the human structural-imaging
    paper PMID:19503738, so no mechanism rests on mouse data alone). The findings
    below are minor.

    ## Findings

    1. **MINOR — the ERG claim (phenotype "Undetectable electroretinogram",
       VERY_FREQUENT; and diagnosis "Electroretinography") rests solely on a
       different-gene, general-LCA paper (PMID:10615133).** PMID:10615133 is the
       AIPL1 / LCA4 gene-discovery paper (a new photoreceptor-pineal gene on
       chromosome 17p) — not LCA5. Its quoted snippet, *"Individuals affected with
       LCA are diagnosed at birth or in the first few months of life with severely
       impaired vision or blindness, nystagmus and an abnormal or flat
       electroretinogram (ERG),"* is a statement about LCA in general. No
       LCA5-specific ERG data is cited anywhere in the entry (the LCA5 imaging paper
       PMID:19503738 measured dark-adapted psychophysical thresholds and pupillary
       responses, not ERG). The entry handles this transparently — both explanations
       state the paper "establishes the abnormal or flat ERG as a defining
       diagnostic feature of LCA, of which LCA5 is a genetic subtype" — and a flat
       ERG is genuinely definitional of the LCA syndrome, so the claim is defensible.
       Two soft points remain: (a) the snippet says "abnormal or flat," slightly
       broader than the HP term "Undetectable electroretinogram" (HP:0000550); (b) a
       VERY_FREQUENT frequency for LCA5 specifically leans on a non-LCA5, different-
       gene source. Why it matters: it is the one place where a defining phenotype's
       only citation is not about this gene.

    2. **MINOR — several phenotype frequencies extrapolate from a 2-patient (in one
       case single-patient) case series (PMID:19503738).** Nystagmus (VERY_FREQUENT),
       Hyperopia (FREQUENT), and Pigmentary retinopathy (FREQUENT) all cite this
       study of two unrelated LCA5 patients; the pigmentary-retinopathy snippet
       describes only *"P1"* (one patient): *"P1 showed a prominent central island of
       retinal pigment epithelium (RPE) surrounded by alternating ... areas of
       decreased and increased pigmentation."* The frequency bands are clinically
       reasonable for LCA5, but they generalize beyond the cited sample size. The
       snippets themselves are exact and the phenotype bindings correct; only the
       frequency grading extrapolates. Low severity.

    3. **Not a finding (noted as good practice) — the GeneReviews reference
       (PMID:30285347) is honestly dispositioned.** The `references[].findings[]`
       entry states the cached record is a generic purpose/scope abstract lacking
       quotable disease-specific text, names the primary sources used instead, and
       retains the overview only as a tagged baseline. Its `supporting_text`
       ("characteristics of nonsyndromic Leber congenital amaurosis") is an exact
       substring and is not overclaimed as a finding. Correctly handled.


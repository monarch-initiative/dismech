  details: |
    New Disease entry for Type B Insulin Resistance Syndrome MONDO:0016464, an acquired autoimmune anti-insulin-receptor-antibody disorder, curated for issue #6481 lit-scan:new. Modeled the autoantibody to insulin-receptor partial-agonism to impaired insulin signaling causal chain, the titer-dependent bimodal hyperglycemia/hypoglycemia mechanism, cardinal phenotypes, diagnostic anti-insulin-receptor autoantibody biochemistry, the near-invariable autoimmune SLE association, and treatments including the NIH rituximab/cyclophosphamide/pulse-steroid protocol, glucocorticoids, plasmapheresis, and high-dose insulin. Evidence anchored on verified PubMed abstracts PMID:20484479, PMID:27254267, PMID:29264467, PMID:42255432, PMID:42438801; all snippets verified as exact substrings via validate-references. MONDO:0016464 was reachable but absent from the DiseaseTerm enum cache per issue #6432, so the verified-reachable curie was appended to the sorted diseaseterm cache CSV. Schema, term, and reference validation pass; compliance 93.8 percent.

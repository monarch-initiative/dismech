  details: |
    Reviewed Type B insulin resistance syndrome for acquired-autoimmune disease identity, causal claim-to-evidence alignment, ontology grounding, clinical completeness, and provenance. Split the bundled receptor effect into high-titer antagonism and low-titer agonism, replaced the bundled cellular/organism node with atomic impaired signaling, added evidence to every causal and treatment-target edge, connected all six mechanism-explained phenotypes without speculative bridges, moved coexisting autoimmunity out of the environmental section, and added prevalence uncertainty, biphasic progression, diagnostic pattern, burden, explicit model/genetic/dataset gaps, and review limitations. A Monarch D2P audit was screened; directly observed diabetic ketoacidosis was added but deliberately left unwired rather than inferring a causal route from a single case. Pre-publication validation passed for schema, terms, references with 44/44 cached snippets, targeted causal graph, 6/7 phenotype connectivity, weighted compliance, dataset verification, and the new-snippet length ratchet.

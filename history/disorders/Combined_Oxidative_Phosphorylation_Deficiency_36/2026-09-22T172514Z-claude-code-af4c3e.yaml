  summary: 'Create: Combined Oxidative Phosphorylation Deficiency 36'
  details: |
    De novo curation of COXPD36 (MRPS2, MONDO:0054781) from four published patients. Deep research: one openscientist run, committed at research/Combined_Oxidative_Phosphorylation_Deficiency_36-deep-research-openscientist.md (4 references, 4/4 resolved, 1/1 quote valid, term_validation needs_review true with 4 label variants and OMIM/NCBIGene unresolvable prefixes). The report supplied PMID:34991560 (Liu 2022), a third patient a direct PubMed search on the gene symbol and disease name did not return; without it the entry would have carried three patients, an unresolved count discrepancy against the 2024 report, and none of the 2022 patient's glucose values, gallstones, recurrent vomiting or treatment response. Pathograph is a nine-node chain from the biallelic alleles through MRPS2 destabilisation, mt-SSU assembly failure and 12S rRNA loss to a combined complex I and IV deficiency, then to lactate, 2-oxoglutarate and fasting hypoglycaemia. Causality is grounded on the 2018 lentiviral complementation rather than on prediction; the 2022 and 2024 alleles have no functional data and the entry says so. Three discussions record the open questions: the unmeasured cochlear mechanism, the late-assembly severity hypothesis, and whether the wrinkled skin and joint hypermobility are one connective-tissue feature. Validation on the final tree: just validate, validate-terms, count-verified-snippets 57/57, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-genereviews (NO_CHAPTER, recorded in notes), list-disconnected-phenotypes 9/15.


    Review round 1 (ai4c-reviewer, REQUEST_CHANGES, four IMPORTANT findings, all taken in one push).
    Added six phenotypes the first pass missed: hypotonia, reported only in the founding paper's
    comparative Table 1 and not in either patient narrative, and five single-patient narrative
    findings (low-set ears, upslanted palpebral fissures, intermittent divergent strabismus,
    frequent headaches, lower-limb weakness) that had been passed over while the 2024 report's
    equally single-patient findings were curated; the asymmetry had no justification. Regraded four
    phenotypes from VERY_FREQUENT to FREQUENT, where the denominators of 2 of 4 and 3 of 4 recorded
    in their own notes fall; they had been graded before the 2022 patient was folded in. Updated
    three passages in discussions that still said three patients, re-reasoning the connective-tissue
    chance argument on the corrected denominator rather than find-and-replacing the number. Rebound
    the small-subunit assembly process from GO:0000028 (ribosomal small subunit assembly) to
    GO:0180026 (mitochondrial small ribosomal subunit assembly), more specific than either the
    original binding or the GO:0061668 the reviewer suggested. Wired hypotonia and lower-limb
    weakness into the pathograph from the OXPHOS node; left the dysmorphic features and the headache
    disconnected, since nothing in this literature gives them a mechanism. Post-round validation:
    count-verified-snippets 63/63, list-disconnected-phenotypes 11/21.
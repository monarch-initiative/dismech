  summary: 'Create: Jalili_Syndrome'
  details: |
    Created the Jalili syndrome entry (MONDO:0009007, CNNM4, hgnc:105 looked up via the HGNC REST API). Curated from primary literature fetched with just fetch-reference: the two 2009 gene-discovery papers (PMID:19200525 full text, PMID:19200527), the Cnnm4 knockout mouse (PMID:24339795 full text), clinical series and case reports (PMID:29421294, 32022389, 34875963, 41280631, 25613845, 35150469, 27419834, 29421602, 20706282, 36354001, 28586144, 29322253, 23362848, 39024658), dental analyses (PMID:24194943), histopathology (PMID:39522753), functional variant work (PMID:39580587) and the 2q11 linkage paper (PMID:12461695). The pathograph has two branches from CNNM4 loss of function: an enamel branch (impaired Mg2+ extrusion by maturation-stage ameloblasts, then enamel hypomineralization with magnesium and organic matrix retention) supported by human tooth analyses and the knockout mouse, and a retinal branch (cone-predominant photoreceptor degeneration) linked with INDIRECT_UNKNOWN_INTERMEDIATES because the knockout mouse retina is normal and retinal Cnnm4 is mainly in plexiform and ganglion cell layers; this is recorded as a FAILS_TO_RECAPITULATE model link and a HUMAN_MODEL_MISMATCH discussion. Leg muscle overgrowth and myopathic EMG are included as a single-family observation. OpenScientist deep research (research/Jalili_Syndrome-deep-research-openscientist.md) was used as a cross-check: 21/21 references resolved, 0 off topic, no needs_review on references; term validation needs_review true for three mislabelled CURIEs (HP:0007641 called bull's eye maculopathy, HP:0000684, UBERON:0005421), none of which were bound. The report's retinal Mg2+ transport step is stated as assumed and was not adopted as a mechanism node. just preflight-dr exited 2 because the local mondo.db is absent; the report was checked by reading and is about CNNM4 and Jalili syndrome throughout. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets 70/70, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-logical-rules, list-gene-term-mismatches, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading and validate-disorders all passed.

  summary: 'Create: Mitochondrial Pyruvate Carrier Deficiency'
  details: |
    New entry for mitochondrial pyruvate carrier deficiency (MONDO:0013877), MPC1 and MPC2, with MPC1 and MPC2 subtypes. Pathograph: biallelic MPC1/MPC2 variants -> loss of the MPC1-MPC2 carrier complex (unstable complex or transport-dead complex) -> impaired mitochondrial pyruvate import -> reduced pyruvate oxidation -> pyruvate and lactate accumulation (normal lactate:pyruvate ratio) and neuronal energy failure -> phenotypes (all 9 connected). Treatments: ketogenic diet and glutamine, both modelled as BYPASSES. Animal models: Mpc1 knockout mouse (embryonic lethal, rescued by maternal ketogenic diet) and Mpc1+/- mouse. One OpenScientist deep-research report: built-in validation completed (22/22 references resolved); preflight-dr PASS, with MPC2 mentions reflecting the second carrier subunit. The report swapped the HGNC identifiers of MPC1 and MPC2 and said no human MPC2 disease exists; the entry uses HGNC's own identifiers and cites PMID:36417180 for MPC2 disease. No GeneReviews chapter exists. Validated with just validate-disorders and the offline CI gates.

  summary: Add diagnosis rows for the Nugent score and Amsel criteria with LOINC codes
  details: |
    LOINC tranche B batch 28. This entry carried its diagnostic content only in definitions, which has no measurements slot, so a minimal diagnosis section was added with two rows mirroring the two existing definitions. Each row reuses an evidence snippet already verified in this file, with the same evidence_source, and adds no new citation; the criteria themselves stay in definitions and the rows point at them rather than restating them.

    Nugent row: LOINC:101433-1 (Bacterial vaginosis score in Vaginal fluid Qualitative by Nugent). The Nugent-qualified code is bound rather than the method-less bacterial vaginosis score code, which is the opposite of the choice made on the Amsel row, and deliberately: there the method is incidental to the finding, whereas here the scoring system is the instrument's identity and a score of 7 means nothing without saying it is Nugent's. The published cut-offs are quoted in the definition and would suit interpretation bands on the score, which were not added.

    Amsel row: three of the four criteria are separately measured observations and each is bound - LOINC:20502-1 clue cells, LOINC:48037-6 vaginal fluid pH, LOINC:46730-8 whiff test. The pH and whiff items take method-less codes; the clue-cell item takes the wet-preparation code because Amsel reads clue cells on a saline wet mount, so the method is part of the criterion rather than incidental. The discharge item has no code: no vaginal-fluid discharge measurement exists in the 2.83 release, and the generic vaginal physical-findings code would not carry the appearance the criterion names.

    Two method findings from this entry. First, a per-item name search is the wrong instrument for a criteria set: searching the item names returned nothing for pH or the whiff test, and a draft of this record would have claimed both were absent. Enumerating every ACTIVE code whose system is vaginal - 182 of them - found both immediately, each method-less. For a criteria set, enumerate by specimen rather than by item name, because each item is named differently and a per-name search misses some.

    Second, presence in the pinned export is necessary but not sufficient for a binding. LOINC:107527-4, the method-less clue cells code, is ACTIVE and not deprecated in LOINC 2.83 but resolves in the Monarch KG without a name, so the term validator cannot label it and it is not bindable today. That is release lag rather than a fabricated code. The wet-preparation code was used instead, which is independently the better match to Amsel as practised. So the export is the stronger authority for absence, and the KG remains the gate for presence.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status, deprecation and third-party copyright notice checked per code; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

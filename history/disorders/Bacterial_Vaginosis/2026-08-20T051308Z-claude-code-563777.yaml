  summary: 'Create: Bacterial Vaginosis (MONDO:0005316)'
  details: |
    New disorder entry created for the obstetrics/gynaecology coverage gap tracked in issue #7837.

    Modelled as a community-state disease rather than a single-organism infection: no infectious agent is curated as sufficient, and the Gardnerella entry carries a PARTIAL evidence item recording that carriage occurs in asymptomatic women. Fifteen pathophysiology nodes run from loss of Lactobacillus dominance through the adherent Gardnerella biofilm, vaginolysin-mediated epithelial signalling and bacterial sialidase degradation of the cervicovaginal mucus barrier, to HIV susceptibility, adverse pregnancy outcomes, and recurrence.

    Load-bearing curation decisions:
    - Recurrence is curated as two competing mechanistic hypotheses converging on one node: biofilm_persistence_relapse (CANONICAL, because the biofilm is directly demonstrated on biopsy) and sexual_reinfection (EMERGING, on the strength of the 2025 StepUp randomised trial stopped early for benefit, PMID:40043236). Neither is asserted as operative in an individual woman; the indistinguishability is curated as a KNOWLEDGE_GAP.
    - Biogenic amine production is a pathophysiology node with a feedback edge onto the trigger node, not merely the odour phenotype, because the cited work shows amines slow lactobacillus growth and independently cut lactic acid output.
    - The mucus-barrier node records that the defect is in adhesive rather than structural properties (PMID:31971984), and is deliberately not described as the barrier being torn open.
    - Negative and constraining results are retained rather than dropped: no increase in O-glycanase, proteinase or whole-mucinase activity in BV (PMID:10454178); prolidase and anti-Gvh IgA did not predict preterm birth (PMID:12388968); and a prospective REFUTE item against the BV-to-PID inference (PMID:35086915).
    - conforms_to is claimed only at bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome, for the clindamycin arm. Metronidazole is explicitly not attached to that node, and intracellular_pathogen_persistence is explicitly not claimed.
    - A HUMAN_MODEL_MISMATCH discussion records the receptor-level reason BV has no animal model (vaginolysin requires human CD59) alongside the absence of a lactobacillus-dominant vagina in model species; the one murine model is curated as PARTIALLY_RECAPITULATES with fidelity LOW.
    - The StepUp trial has no NCT number and is keyed on ICTRP:ACTRN12619000196145 (ANZCTR) fetched with just ictrp-fetch.
    - Two environmental exposures are curated with influences_mechanisms but no exposure_term; ECTO was searched for sexual-activity and contraceptive-device exposure concepts and nothing suitable was found, which is recorded in each entry notes field rather than left implicit.

    Validation: just validate (schema, terms and references) passes, reporting 88 of 88 snippets verified against cached references. just check-duplicate-keys, just check-title-snippets and just check-term-cache-integrity are all clean. Cache diffs are purely additive: 10 new rows across 8 files, all written by the validator, with no reordering churn. No deep-research provider report was used; all references were found by PubMed search and fetched with just fetch-reference.

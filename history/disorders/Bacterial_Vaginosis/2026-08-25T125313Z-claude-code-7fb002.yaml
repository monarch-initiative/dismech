  summary: 'Review response on PR #9073: licensed treatments, evidence retagging,
    DR sweep'
  details: |
    Response to the 2026-08-20 ai4c-reviewer CHANGES_REQUESTED review on PR #9073, plus a
    merge of origin/main to clear a conflict the branch had accumulated.

    Branch refresh. The conflict was confined to two derived cache files,
    cache/chebi/terms.csv and cache/enums/chemicalentityterm_b3afbb412a9e.csv. Resolved by
    taking main's rows wholesale and then re-deriving this entry's own rows with
    `just validate-terms`, rather than hand-placing any row. The resulting cache diff is
    additive only (CHEBI:18127 cadaverine restored; CHEBI:140628 and CHEBI:31466 added).

    Blocking finding 1 - no deep-research artifact. Produced
    research/Bacterial_Vaginosis-deep-research-claude.md, a PubMed E-utilities
    completeness sweep over eight dimensions (treatments, adverse outcomes, pathogenesis
    models, host genetics, immune/barrier mechanism, diagnostics, sialidase provenance,
    datasets). Every PMID, title, journal and publication type in it was read back from
    the NCBI record rather than recalled. `just preflight-dr` returns SKIP because
    MONDO:0005316 has no RO:0004003 causal gene, so the gene-identity check cannot
    discriminate; `just qc-deep-research --only Bacterial_Vaginosis` reports 0 missing and
    0 unresolved references. The sweep is recorded honestly as having been run *after*
    curation rather than before, in the entry's provenance notes.

    Blocking finding 2 - missing licensed treatments. Added three:

    - Secnidazole (CHEBI:140628), single 2 g oral dose, FDA-approved 2017. PMID:28867602,
      phase 3 double-blind placebo-controlled, 189 women at 21 US centres.
    - Tinidazole (CHEBI:63627), FDA-approved and a CDC alternative regimen. PMID:17666604,
      multicentre placebo-controlled trial, plus its registration record NCT00229216 added
      to clinical_trials.
    - Dequalinium chloride (CHEBI:31466), a non-antibiotic antiseptic. PMID:38696172,
      phase 4 double-dummy non-inferiority trial against oral metronidazole.

    All three attach to Polymicrobial Anaerobic Overgrowth and none to the ribosomal
    translation node, matching the existing treatment of metronidazole: secnidazole and
    tinidazole share metronidazole's nitroimidazole reductive-activation mechanism, and
    the dequalinium evidence is a clinical cure rate rather than a demonstrated action on
    the biofilm. The tinidazole entry deliberately curates both halves of its
    endpoint-dependent result - the 36.8%/27.4% cure rates under the strict five-criterion
    FDA definition and the paper's own statement that efficacy was greater under
    traditional criteria - so that those figures are not read against the 70-85% quoted
    from Amsel-based series elsewhere in the same entry.

    Blocking finding 3 - background prose quoted as findings. Three items fixed:

    - PMID:39162399 on the biofilm/adhesion node re-quoted from the abstract's opening
      background sentence to the study's own adhesion result, which supports the node
      directly and is the sentence the reviewer identified.
    - Two PMID:18390664 items (Gardnerella carriage in asymptomatic women; the absence of
      a suitable animal model) retagged from IN_VITRO to OTHER, with each explanation now
      stating that the sentence is the authors' introduction rather than an outcome of
      their cytolysin experiments. Both are genuinely in that paper's introduction, citing
      its own references, and were verified against the cached full text.

    Non-blocking findings also taken:

    - Finding 5. GO:0006885 regulation of pH removed from the trigger node. The claim is
      about the chemistry of the vaginal lumen, not a cellular homeostatic process, and GO
      annotates the latter. The reason is recorded in the node description rather than
      left as a silent deletion; the mechanism is still carried by GO:0019249 lactate
      biosynthetic process and the luminal measurement by the Amsel pH definition.
    - Finding 6. A DIRECT edge added from Recurrent Bacterial Vaginosis back to Loss of
      Lactobacillus Dominance and Vaginal Acidification, closing the cycle the entry
      argues for. Evidenced by the LACTIN-V recurrence definition (recurrence is
      operationalised as re-meeting the same Amsel and Nugent criteria as an incident
      case) and by PMID:34470644 naming failure to recolonise with lactobacilli among the
      drivers of recurrence.

    Finding 4 - three compound node names - was not taken. The reviewer marked it
    non-blocking and noted that each is a tight mechanistic pair rather than a chain;
    splitting them would fragment shared evidence.

    Finding 7 - phenotype coverage - was left for a follow-up. The sweep surfaced the
    meta-analytic preterm-birth literature and a live controversy in it (a robust
    association whose causal reading is undermined by the failure of the corresponding
    intervention), which is a discussion rather than a frequency band and is recorded in
    the report as a follow-up rather than curated here.

    Validation run in the worktree: `just validate-disorders` passes schema, terms and
    references with 99/99 snippets verified against cached references (88/88 before this
    revision);
    `just validate-history` clean on this record.

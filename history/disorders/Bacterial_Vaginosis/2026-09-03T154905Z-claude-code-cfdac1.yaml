  summary: 'Review response: correct the over-read PID hazard-ratio gradient'
  details: |
    Round-4 review finding on PR #9073: two passages claimed symptomatic Amsel-BV carries 'roughly twice the hazard' of Nugent-BV for incident PID in PMID:34396403. The reported adjusted hazard ratios are 1.53 (95% CI 1.05-2.21) and 2.15 (95% CI 1.23-3.75); 2.15 is 1.4x 1.53, the intervals overlap across most of their range, and the paper does not test the difference between the two exposure definitions. Both the node description and the second PMID:34396403 explanation on the 'Increased Susceptibility to HIV and Other Genital Tract Infections' node now state both point estimates, state that the intervals overlap and the difference is untested, and rest the reconciliation with the negative microbiome-sequencing cohort on the differing exposure and outcome ascertainment rather than on an effect-size gradient. No snippet, term, or graph structure changed. Validated with just validate (104/104 snippets verified, terms pass, schema clean), plus check-duplicate-keys and check-entity-refs.

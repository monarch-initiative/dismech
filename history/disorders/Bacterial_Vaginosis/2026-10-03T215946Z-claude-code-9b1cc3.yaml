  summary: Backfill transmission (#10115, R25)
  details: |
    Added three transmission records; the existing infectious_agent block (Gardnerella vaginalis, Prevotella/Hoylesella timonensis) was left untouched. Routes: endogenous overgrowth of resident vaginal anaerobes (PMID:35118003, which also records the reviewers' judgement that the absence of a known causal agent makes BV hard to classify as an STI); sexual exchange of consortium organisms between partners (PMID:40043236, the StepUp randomised male-partner-treatment trial stopped early for benefit - interventional evidence that the partner is a source); and exposure to alkaline semen and other alkalinising sexual exposures (PMID:35118003, including the lifetime-partner-number dose-response and the non-zero prevalence in never-sexually-active women). Both references were already cited by the entry, so no new reference caches. just validate clean (115 titles). No other section touched.

  summary: 'Create: Hereditary Spastic Paraplegia 77'
  details: |
    New SPG77 (MONDO:0014882, FARS2) entry. The requested Perplexity deep-research run failed (server disconnected without a response), so no report was produced and none is committed; curation was done directly from PubMed (esearch FARS2[TIAB], 57 hits) with all references fetched via just fetch-reference. GeneReviews 'FARS2 Deficiency' (PMID:30869852) used as the phenotype baseline and tagged. Scoped to SPG77 only: COXPD14 (MONDO:0013986) is a separate MONDO disease with its own stub, so it is recorded as an allelic differential rather than a subtype, matching the one-entry-per-MONDO-term convention of the sibling mitochondrial aaRS entries. Pathograph: FARS2 partial loss of function -> impaired mitochondrial translation -> OXPHOS/bioenergetic failure -> impaired neurite outgrowth and neuronal apoptosis -> corticospinal tract dysfunction -> UMN phenotypes, with conforms_to on corticospinal_tract_axonopathy at the trigger and stretch-reflex nodes only (no SPG77 neuropathology to support the length-dependent degeneration node). Complicated-form edges (developmental delay, ID, seizures, dysarthria, dysphonia, tremor, MRI lesions) are marked as inferred without evidence. Validation: just validate-disorders passed (65/65 snippets verified), validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-genereviews (TAGGED), list-gene-term-mismatches clean; 19/20 phenotypes causally connected (Kyphoscoliosis left unconnected).

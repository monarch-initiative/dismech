  summary: 'Create: Hereditary Spastic Paraplegia 77'
  details: 'New SPG77 (MONDO:0014882, FARS2) entry, curated from PubMed (esearch FARS2[TIAB], 57 hits)
    with all references fetched via just fetch-reference. Deep research: the first Perplexity run failed
    with a server disconnect before any report was written; a rerun using a streaming request succeeded
    and produced research/Hereditary_Spastic_Paraplegia_77-deep-research-perplexity.md (+ .citations.md).
    The report was read after the entry had been drafted and used only as a list of leads. Its identity
    is correct (FARS2, OMIM 617046, MONDO:0014882); just preflight-dr could not run because the local
    MONDO build is absent. Only two of its citations are PubMed records (PMID:30869852 GeneReviews, already
    cited, and PMID:31377012, a general HSP review not used); the rest are ClinVar, OMIM, Orphanet, MedGen
    and MSeqDR pages. Term validation flagged 4 nonexistent HP CURIEs, 1 obsolete term and 11 CURIEs labelled
    as unrelated terms; none of its CURIEs were copied. One lead was taken: ocular abnormalities (strabismus,
    ptosis), which the report attributes to Orphanet. The Orphanet record could not be cached (fetch-reference
    has no ORPHA fetcher and the Orphadata XML is not present), so the two phenotypes are instead cited
    to the SPG77 literature table in PMID:37152989 (Vernon et al. 2015 sibling pair). The Vernon genotype
    (p.Arg419Cys with an exon 6 deletion, PMID:25851414) was added to the genetic notes, with the caveat
    that the Vernon abstract does not itself name spastic paraplegia, contrary to the report. GeneReviews
    ''FARS2 Deficiency'' (PMID:30869852) is the phenotype baseline and is tagged. Scoped to SPG77 only:
    COXPD14 (MONDO:0013986) is a separate MONDO disease with its own stub, so it is recorded as an allelic
    differential rather than a subtype. Pathograph: FARS2 partial loss of function -> impaired mitochondrial
    translation -> OXPHOS/bioenergetic failure -> impaired neurite outgrowth and neuronal apoptosis ->
    corticospinal tract dysfunction -> UMN phenotypes, conforming to corticospinal_tract_axonopathy at
    the trigger and stretch-reflex nodes only. Complicated-form edges are marked as inferred without evidence.
    Validation: just validate-disorders passed (68/68 snippets verified); validate-terms, check-causal-targets,
    check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-genereviews (TAGGED) and list-gene-term-mismatches
    clean; 21/22 phenotypes causally connected (Kyphoscoliosis unconnected).'

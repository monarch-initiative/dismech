  summary: 'Create: Non-24-Hour Sleep-Wake Rhythm Disorder'
  details: |
    New entry created as part of a sleep-disorders review, curated specifically as the worked conformer for the entrainment-input arm of the circadian_phase_misalignment module: the oscillator is normal and the disorder consists of losing the light signal that should reset it, a separation not demonstrable in jet lag, shift work, or the familial clock-variant disorders. Records the visual-versus-circadian blindness dissociation, the cyclical rather than constant symptom pattern and the diagnostic obstacle it creates, and an open discussion on the sighted form, whose mechanism cannot be absence of photic input. All evidence snippets verified as exact substrings of cached PubMed abstracts.

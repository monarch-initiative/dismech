  summary: 'Create: Severe Combined Immunodeficiency Due To DNA-PKcs Deficiency'
  details: |
    New entry for PRKDC (DNA-PKcs) deficiency, MONDO:0014423, autosomal recessive. Curated from primary literature fetched via PubMed (van der Burg 2009 founder allele L3062R; Woodbine 2013 compound heterozygous patient with neurological disease; Mathieu 2015 granuloma and AIRE-dependent autoimmunity; Esenboga 2018; Adelon 2024 seven-patient review; Bjorkman 2015 class switching; Ma 2002 Artemis activation; Cowan and Gennery 2015 conditioning) plus the scid mouse, Arabian foal and Jack Russell terrier models. 12 pathophysiology nodes (variant, Artemis activation, NHEJ, V(D)J recombination, lymphocyte development, class switching, adaptive immune defense, AIRE-dependent tolerance, organ-specific autoimmunity, immune dysregulation, granulomatous inflammation conforming to granuloma_formation, neurogenesis), 28 phenotypes (27 causally connected), ClinGen Definitive gene_disease_validity copied from CGGV:assertion_fff25ca1, two treatments (HSCT, immunosuppression for arthritis), diagnosis, three differentials, a HUMAN_MODEL_MISMATCH discussion on the neurodevelopmental phenotype and a KNOWLEDGE_GAP on founder-allele variability. One deep-research report was used, from openscientist: 32 of 32 cited references resolved (0 unresolved, 27 on topic), 33 of 35 terms resolved with HP:0002543 unresolved and not used; needs_review was set because of label mismatches that are table-parsing artefacts. preflight-dr returned WARN only for AIRE mentions, which belong to this disease's own mechanism. The report was used as leads; three of its references (PMID:34936881, PMID:35801871, PMID:20113890) were added after checking each snippet against the cached abstract. GeneReviews and StatPearls: no chapter. Validation: validate, validate-terms, count-verified-snippets (133/133), check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-qualifier-terms, check-name-collisions, check-gene-namespaces (after the online resolve), check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-cache-order and validate-disorders all pass.

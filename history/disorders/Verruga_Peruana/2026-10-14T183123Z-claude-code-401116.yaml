  details: |
    Added diagnosis[].measurements binding LOINC:49212-4 (Bartonella bacilliformis IgG Ab [Titer] in Serum) to the Chronic-phase Bartonellosis Serologic Assay row. Searched the Monarch KG for a method-less, Ig-class-unspecified B. bacilliformis antibody code (parallel to the Streptococcus pyogenes [Presence] in Specimen pattern used elsewhere in this campaign) and found none; every B. bacilliformis code is IgG-specific, and all but 49212-4 also commit to an immunofluorescence method. 49212-4 is the narrowest code with no method commitment, so it is bound as the closest available identity-level code, with a notes field recording the search and its negative result rather than asserting the conclusion alone. New cache/loinc/terms.csv row, confirmed absent from origin/main before seeding.

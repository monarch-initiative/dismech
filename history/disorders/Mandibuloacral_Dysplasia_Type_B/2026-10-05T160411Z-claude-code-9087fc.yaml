  summary: 'Create: Mandibuloacral_Dysplasia_Type_B'
  details: |
    Created the ZMPSTE24-related mandibuloacral dysplasia with type B lipodystrophy entry (MONDO:0012074). Phenotype frequencies are taken item by item from Table 2 of the Suriname cohort plus literature review (PMID:31856865, n=20); FSGS, osteoporosis, myopathy, diabetes and heart failure come from individual reports. The pathograph runs from partial ZMPSTE24 loss of function (residual-activity spectrum, PMID:22718200, 29794150) through failed prelamin A processing (patient cells, PMID:18435794, 21267004) to nuclear dysmorphology, DNA repair failure, p53 activation and senescence, with a nuclear-shape-independent AKT-mTOR route (PMID:23686339, 32910507), skeletal stem/progenitor cell bone loss (PMID:37407584), intramembranous ossification failure, adipose loss and glomerulosclerosis. Mouse-derived links are marked INDIRECT. Insulin resistance was deliberately not asserted; diabetes is recorded with REFUTE items because the ZMPSTE24 form is usually metabolically spared. Two open questions are recorded as discussions: whether the lipodystrophy is adipocyte-autonomous, and whether heart failure belongs to the disease. Deep research: OpenScientist (24/24 references resolved, preflight-dr PASS); its citations 37407584, 21746928, 23686339 and 32910507 were taken into the entry. An internal fresh-context review before the PR led to replacing grouped criteria snippets with per-feature table rows, correcting FTI evidence (ABT-100 and FTI-277 are not lonafarnib), re-routing edges whose snippets supported a neighbouring node, adding the occipital ossification phenotype, and regrading cultured mouse cell evidence as IN_VITRO. No GeneReviews chapter exists.

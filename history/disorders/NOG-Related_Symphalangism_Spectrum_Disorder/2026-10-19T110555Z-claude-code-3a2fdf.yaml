  summary: Add HUMAN_MODEL_MISMATCH discussion for the Nog heterozygous mouse
  details: |
    Added a discussions block with one HUMAN_MODEL_MISMATCH entry (nog_heterozygous_mouse_mismatch) attached to pathophysiology#Failure of Joint Interzone Formation and animal_models#Nog heterozygous mouse. It records that heterozygous NOG loss fuses human proximal interphalangeal joints while Nog+/- mice show only strain-dependent carpal/tarsal fusion and conductive hearing loss, with no digit-joint fusion reported. Six evidence items quote PMID:10080184, PMID:11562478, PMID:16598734 and PMID:18096605, all already cached. The null-lethality quote is labelled as describing the null on 129X1/SvJ, not the heterozygote; the PMID:11562478 introduction sentence is quote_role BACKGROUND. Two proposed experiments: a Nog dosage series across inbred backgrounds scored at the digit joints, and a human/mouse comparison of BMP antagonist expression at the digit interzone. Validated with just validate, count-verified-snippets (84/84) and check-entity-refs.

  summary: 'Create: NOG-Related_Symphalangism_Spectrum_Disorder'
  details: 'Created a Disease entry for MONDO:0100521 with five has_subtypes rows (SYM1A, SYNS1, SABTT,
    TCC, BDB2). The lump follows the ClinGen Lumping and Splitting Working Group, which merged the five
    MIM phenotypes into this MONDO term (CGGV assertion, Definitive, recorded on the NOG gene row). SYNS1
    and BDB2 are pointer subtypes (curated_in) to Multiple_Synostoses_Syndrome and Brachydactyly_Type_B2.
    SYNS1 deliberately has no subtype_term, because that entry already maps MONDO:0008519 as narrowMatch.
    Pathograph: NOG loss of function -> unopposed BMP signalling at prospective joints -> failure of joint
    interzone formation -> symphalangism, carpal/tarsal synostosis and stapes fixation -> conductive hearing
    loss. Deep research: falcon was requested but failed Edison authentication (503); dr_fallback=''--fallback''
    and ''--fallback-provider claude_code'' both failed to switch providers on that error, so claude_code
    was run directly (research/NOG-Related_Symphalangism_Spectrum_Disorder-deep-research-claude_code.md:
    26/26 references resolved, 2 report quotes unsupported (PMID:17668388, PMID:33308208); no report quote
    was reused, and both papers are quoted here from their cached text; preflight-dr PASS). No GeneReviews
    chapter exists (check-genereviews NO_CHAPTER). Validated: just validate, count-verified-snippets 55/55,
    check-entity-refs, check-causal-targets, check-granularity (2 pointers, no mismatch), and the KB-wide
    snippet gates.


    A fresh-context review pass before the PR led to these changes. 17q22 deletions that remove only NOG
    are now in scope (PMID:34049328), with the larger microdeletion syndromes left as the differential.
    Heterozygous-mouse evidence (PMID:18096605) now supports the haploinsufficiency edge and the BMP node.
    The loss-of-function node description was narrowed to what the sources show. BDB2 brachydactyly is
    bound to HP:0005831 Type B brachydactyly. Primary-source evidence was added for strabismus, stapes
    ankylosis and conductive hearing loss. Fused cervical vertebrae and thin upper lip vermilion were
    added, along with penetrance, parental mosaicism and a stapes location. Hearing aids and audiological
    surveillance are now separate treatment rows. The final run gave 73/73 snippets verified and validate-disorders
    passed.

    '

  summary: Address PR #5349 CHANGES_REQUESTED review
  details: |
    Addressed the four required (yellow) review items on PR #5349: (1) added gene_term HGNC
    bindings (OAK-verified) and relationship_type: SUSCEPTIBILITY to all genetics entries
    (LINGO1 hgnc:21205, FUS hgnc:4010, SLC1A2 hgnc:10940), and split the bundled CA3/CPLX1
    entry into two separate entries (CA3 hgnc:1374, CPLX1 hgnc:2309); reviewer-suggested IDs
    for LINGO1/CA3/CPLX1 were wrong and were corrected against OAK. (2) Added a structured
    prevalence block (~1% overall, ~5% over 65; PMID:41145148). (3) Added the missing
    cerebello-thalamo-cortical downstream edge to Lower limb tremor. (4) Replaced the weak,
    drug-agnostic topiramate/gabapentin evidence snippets with drug-specific sources
    (topiramate crossover RCT PMID:18382182; Italian MDS guideline second-line recommendation
    PMID:22886006). Also added a mondo_mappings exactMatch and this issue link; OMIM:190300 /
    Orphanet:862 cross-refs deferred (DiseaseMappings has no OMIM/Orphanet slot). Additionally
    corrected pre-existing PMID:38671141 snippets that spanned hard line-wraps in the refreshed
    full-text cache. ET-vs-ET-plus subtypes and the cerebellar_purkinje_degeneration conforms_to
    suggestion deferred as non-trivial.

  summary: Create Essential Tremor MONDO:0003233
  details: |
    Created new dismech Disease entry for essential tremor via the initiate-new-disorder-creation skill. Ran falcon Edison deep research. Built a single connected pathophysiology graph: inferior olivary oscillation and climbing-fiber entrainment to Purkinje-cell pathology and hypersynchronous firing to cerebellar GABAergic disinhibition to cerebello-thalamo-cortical oscillatory propagation to action tremor phenotypes. Genetics modeled with hedging as risk factors, not Mendelian. Treatments include propranolol, primidone, topiramate, gabapentin, VIM DBS, MRgFUS thalamotomy. All 28 evidence snippets independently verified as exact substrings of cached PubMed abstracts; folded-hyphen, schema, term, and reference validation all pass. Falcon inline PMIDs for FUS and NOTCH2NLC were found unreliable and not used; genetics anchored on the Kuhlenbaumer 2014 Neurology review and Skuladottir 2024 GWAS.

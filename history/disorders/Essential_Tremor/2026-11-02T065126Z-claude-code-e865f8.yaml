    Deferred parent from #12918 (#12262), recovered under #12931. Added four MONDO-bound has_subtypes rows (ETM1 DRD3 MONDO:0008590, ETM4 FUS MONDO:0013888, ETM5 TENM4 MONDO:0014756, ETM6 NOTCH2NLC MONDO:0030027); gene attributions confirmed against each term's RO:0004003 axiom in OLS. Added DRD3 (DISPUTED, meta-analysis REFUTE), TENM4 and NOTCH2NLC (UNKNOWN, no external validity tier) genetic records and a subtype key on the existing FUS record. Added four gene-level mechanism nodes; only FUS has a downstream edge (to GABAergic disinhibition, from a Drosophila model, INDIRECT_UNKNOWN_INTERMEDIATES), because no source links the other three lesions to the olivocerebellar circuit. GWAS genes LINGO1, SLC1A2, CA3, CPLX1 left unwired. Validated with validate-disorders and the offline whole-repo gates.

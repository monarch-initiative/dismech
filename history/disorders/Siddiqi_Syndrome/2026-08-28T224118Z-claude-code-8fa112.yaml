  summary: 'Review round 1: consume the report, and fix a gap that was wrong'
  details: |
    The review was right that the entry under-consumed its own report - two of twelve verified references used - and three of the unused ones bore directly on the entry's own arguments. Fetching them changed the entry's claims rather than padding it. The most important consequence: PMID:36805337 shows hepatocyte-specific Fitm2 knockout mice with elevated acyl-CoA, ER stress and liver injury in vivo. The ER-stress node had said no cited source demonstrates ER stress, and the knowledge gap was built on that premise. The premise was false. The gap is rewritten from is ER stress the mediator at all, which the evidence no longer leaves open, to why the human tissue pattern differs from the mouse - and the mouse data make that sharper rather than softer, because tissue-specific knockouts produce liver injury and lipodystrophy, two phenotypes the human disease does not have, while the human phenotype falls on cochlea, neurons and skin, which no cited knockout has targeted. The tissues that fail in mouse and human are close to disjoint. PMID:30020828 supplies the counterpart that turns the absent lipodystrophy from an absence into a dissociation: adipose-specific FIT2 knockout mice do get lipodystrophic features, while patients lacking FIT2 everywhere do not. PMID:39974099 supplies an allelic dosage series - compound heterozygotes with one null and one G100R hypomorphic allele at 20 percent residual protein have hereditary spastic paraplegia rather than this disease. That is now in the genetic notes and a second knowledge gap, recorded as an open question rather than asserted as a continuum because a qualitative property of G100R is not excluded. Two corrections to evidence-to-claim fit, and they are the same mistake twice. Growth Delay cited the ascertainment sentence, which says nothing about growth; I had graded it PARTIAL and said so in the explanation, treating the grade as a way to be honest about a bad fit. The reviewer's point stands: a PARTIAL grade does not repair an off-claim snippet. It now cites PMID:41113320, which names growth failure. Motor Delay was supported only by MODEL_ORGANISM evidence quoting the fly's locomotor impairment, which CLAUDE.md forbids as sole support for a human phenotype; the phenotype is removed, since the human sources describe regression, which the entry already curates. Also added: GO:0010945 on the enzymatic node, intellectual disability from the Iranian sibling report with no frequency because the source hedges with often. Validation: just validate passes, 22 of 22 snippets verified up from 17, entity refs clean, one root, no dangling targets. Absence of Lipodystrophy remains deliberately unreached by any causal edge.

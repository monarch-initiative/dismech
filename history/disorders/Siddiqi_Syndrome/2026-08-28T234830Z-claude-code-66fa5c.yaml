  summary: 'Review round 2: variants, diagnosis, treatments, title-quote fix'
  details: |
    Second review round on PR #9928.

    Replaced the Developmental Regression snippet, which quoted a substring of PMID:28067622's title and failed `just check-title-snippets`, with a non-title sentence from PMID:41113320.

    Added structured Genetic.variants: the six-family allele catalog (which also supplies the previously uncited compound-heterozygote claim), the Iranian allele, and the truncating-versus-missense severity gradient graded PARTIAL on the authors' own hedge.

    Added Global Developmental Delay (HP:0001263). Added a diagnosis section (exome sequencing with Sanger segregation; auditory brainstem response) and four differential diagnoses.

    Added a treatments section: supportive management as reported, plus cochlear implantation graded PARTIAL because the authors propose it rather than report it. Corrected the stale top-level note claiming no citable management protocol existed - true of the two references the entry had at round 0, false once PMID:41113320 was fetched.

    Moved the adipose-specific FIT2 knockout mouse evidence off the Absence of Lipodystrophy phenotype record onto the lipid-droplet partitioning node, so a term-level query is not told that model-organism evidence supports lipodystrophy in this disease.

    Both NCIT terms initially chosen for the diagnosis section were wrong (NCIT:C101293 is Next Generation Sequencing, NCIT:C38031 is Tearing) and were caught by term validation, then replaced with NCIT:C101295 and NCIT:C184949 verified via OAK.

    Validation: 33/33 snippets verified, check-title-snippets, check-entity-refs, check-duplicate-keys, check-folded-hyphens and check-snippet-length all pass.

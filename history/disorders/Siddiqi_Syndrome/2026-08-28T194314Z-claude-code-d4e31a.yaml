  summary: 'Create: Siddiqi syndrome (FITM2)'
  details: |
    De novo curation from an OpenScientist deep-research report (12 of 12 references verified, zero confabulation, 7 of 12 on topic). All eight quotes lifted from the report were re-verified against the primary abstracts before use and all eight matched exactly. Gene identifier correction, the second in this batch of three reports. The report gives the causal gene as HGNC:14929 in three places including its header and summary table. HGNC:14929 is SIRT1, a sirtuin deacetylase unrelated to lipid droplet biology. FITM2 is hgnc:16135. The detail that makes this worth recording rather than silently fixing is that the three other identifiers on the same line of the report - OMIM 612029, NCBI Gene 128486, UniProt Q8N6M3 - are all correct for FITM2, so a wrong HGNC identifier sat between correct identifiers for the right gene. Combined with the SPG81 report in the same batch giving SELENOS for SELENOI, two of three reports carried a wrong causal-gene HGNC ID, and the two wrong IDs were unrelated in kind: one a same-family near-miss, one a completely unrelated gene. That rules out a systematic offset and means the identifier simply cannot be trusted. Pathograph runs from the lost ER-lumenal acyl-CoA diphosphatase activity through unbuffered acyl-CoA and failed lipid droplet partitioning to ER structural disruption and stress, then to injury in post-mitotic metabolically active cells. That last node is explicitly labelled an interpretation: no cited source demonstrates ER stress in patient cochlea, neurons or skin, and the description says so rather than letting the arrow imply evidence. The most interesting curation decision is a negative phenotype. FITM2 partitions triglyceride into lipid droplets so the naive prediction is a lipodystrophy, and the founding report looked and found none. That dissociation is curated as its own phenotype record with supports REFUTE, because it is what pointed the field away from a storage defect toward the ER homeostasis account the 2020 enzymology later supplied. Recording it exposed a schema gap: the Phenotype class has no presence slot, unlike Biochemical and Genetic, so an absent finding cannot be marked absent structurally and a term-level query will see Lipodystrophy attached to this disease without seeing that the entry asserts the opposite. That limitation is stated in the phenotype description. Validation: just validate passes, 17 of 17 snippets verified, entity refs and duplicate keys clean, one root, no dangling targets. Absence of Lipodystrophy is deliberately not reached by any causal edge.

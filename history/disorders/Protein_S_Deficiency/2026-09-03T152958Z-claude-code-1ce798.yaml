  summary: 'Create: Protein S Deficiency'
  details: |
    De-novo curation of PROS1-driven hereditary protein S deficiency (THPH5; MONDO:0012868) as a distinct single-gene Mendelian thrombophilia, kept separate from the general Thrombophilia umbrella entry. Modeled the APC/TFPI cofactor loss pathophysiology chain (Reduced Protein S Cofactor Activity -> Unopposed Thrombin Generation -> Venous Thrombus Formation), conforming to the thrombogenesis module at the coagulation-cascade and fibrin-platelet-thrombus nodes, plus a warfarin-induced transient anticoagulant depletion branch. Curated has_subtypes Type I/II/III (ISTH), phenotypes (DVT, PE, neonatal purpura fulminans, reduced protein S activity, warfarin-induced skin necrosis), PROS1 genetics (AD incomplete penetrance and severe AR biallelic form), structured prevalence (mild congenital ~1/500, blood-donor 0.03-0.13%, Japanese 0.48-0.63%), free-vs-total protein S diagnostic assay, anticoagulation treatment (warfarin/rivaroxaban with heparin-bridged initiation), estrogen environmental second-hit, and the platelet-specific Pros1 knockout mouse model. Deep research run with claude_code provider; all evidence snippets verified as exact substrings against cached references (PMID:42429079, 40429442, 41180656, 9885367, 24144709, DOI:10.1182/blood.2019003630). Validated green: just validate, validate-terms, count-verified-snippets, check-causal-targets, check-duplicate-keys, check-entity-refs, check-qualifier-terms, check-environmental-evidence, check-enum-values, and authoritative validate-disorders.

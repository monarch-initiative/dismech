  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED (round 1). Item 1: kept disease_term MONDO:0012868 (AD) and added mappings.mondo_mappings MONDO:0013791 (AR, THPH6) at skos:narrowMatch, with a notes paragraph on the split vs Thrombophilia.yaml's MONDO:0019144 subtype_term; added a Severe AR has_subtypes entry that Neonatal Purpura Fulminans now points at. Item 2: connected the two orphan phenotypes - Reduced Protein S Cofactor Activity -> Reduced Protein S Activity (lab readout edge), and a new Disseminated Microvascular Thrombosis node (Unopposed Thrombin Generation -> microvascular -> Neonatal Purpura Fulminans). Item 3: added an F5 relationship_type MODIFIER genetic entry (factor V Leiden co-inheritance) evidenced by PMID:8584987 (80% double-carriers symptomatic; FVL 38%) and PMID:9607123 (first-thrombosis age 18.4 vs 32.6y); note reviewer swapped these two citations - snippets attached to the paper that actually contains them. The Genetic class has no odds-ratio slot, so effect sizes live in association text + snippets. Item 4: added Superficial thrombophlebitis (HP:0002638) at ~72% from PMID:2952034 (Engesser 1987), a primary source not in the two originally cited reviews; connected off Venous Thrombus Formation. Item 5: added the global Pros1-/- knockout (PMID:19729839) and the PS K196E Tokushima knock-in (PMID:26251307) with modeled_mechanisms + readouts; both ground the ps_cofactor_pathway_partition knowledge gap, whose rationale now cites them and records the mouse-plasma TFPI caveat honestly. Suggestions done: reworded DVT frequency (VTE->DVT-specific, Engesser 74%); added a biochemical section (free/total protein S antigen, NCIT:C122142/C100436, readouts); added a PROS1 molecular-testing diagnosis entry (repeat-in-stable-conditions + sequencing; MLPA and the exact ISTH >=4-week interval left unasserted as not in the cited review); added pregnancy LMWH thromboprophylaxis; switched GO:0030234 -> GO:0008047 enzyme activator activity for the non-enzymatic APC cofactor. Not done: full split of Reduced Protein S Cofactor Activity into separate APC- and TFPI-cofactor nodes (suggestion 6) - deferred as too high-risk for a review round given the many bare-name pathograph joins into that node; knowledge gap still attaches to the single node. Fixed the CREATE history record: moved #10720 to links.issues and removed the phantom biochemical section tag.

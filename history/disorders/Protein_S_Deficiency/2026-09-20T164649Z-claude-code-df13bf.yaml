  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    This entry was already strong on genetics - PROS1 bound with `gene_term` and
    `relationship_type: CAUSATIVE`, F5 recorded as a `MODIFIER`, both with quoted
    evidence. What was missing was reach into the pathograph: no pathophysiology
    node and no `has_subtypes` row carried a gene descriptor, so wiring was 0/1.

    Changes:
    - PROS1 (`hgnc:9456`) bound as a `genes:` descriptor on the trigger node
      (Reduced Protein S Cofactor Activity), with a `genetic_context`. Wiring is now
      1/1.
    - That `genetic_context` deliberately records no zygosity, and says why: zygosity
      is the axis separating the common heterozygous autosomal dominant deficiency
      from the severe biallelic neonatal form, both of which this entry models.
    - PROS1 bound on all four `has_subtypes` rows (Type I, Type II, Type III,
      Severe AR).

    F5 was left as a `MODIFIER` with no node wiring: factor V Leiden is a
    co-inherited second thrombophilic hit, not a step in the protein S mechanism
    this entry models, and the wiring metric correctly counts only mechanism-relevant
    causal genes.


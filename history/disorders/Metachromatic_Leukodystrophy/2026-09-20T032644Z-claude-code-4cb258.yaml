  summary: 'Genetics pass: bind ARSA on the onset subtypes and add PSAP saposin B
    deficiency as its own node and subtype'
  details: |
    Genetics pass for the d2g wiring-013 gap job (issue #12202). Research first: fetched and read the GeneReviews baseline chapter NBK1130 "Arylsulfatase A Deficiency" (PMID:20301309), which the entry had not cited, plus the ClinGen PSAP / saposin B MLD curation and two saposin B primary reports.

    The entry curated ARSA only. It already quoted a sentence naming saposin B ("whether caused by defects in ARSA or saposin B") without ever binding the gene, which is exactly the invisible-gene pattern this campaign measures.

    Changes:
    - Bound ARSA on all four age-at-onset has_subtypes rows, each with the GeneReviews sentence that treats those onset forms as arylsulfatase A deficiency.
    - Added PSAP (hgnc:9498) as a second causative gene: a genetic: entry scoped to the new subtype, a Saposin B-Deficient MLD has_subtypes row anchored to MONDO:0009590, and a matching mondo_mapping.
    - Added a distinct pathophysiology node, Saposin B Deficiency, conforming to lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency, with a downstream edge into Sulfatide Accumulation. It is modelled separately from Arylsulfatase A Deficiency because the lesion is in the activator protein, not the enzyme, and ARSA activity measures normal.
    - Restricted the PSAP claim explicitly to the saposin B domain in notes:, citing ClinGen's own statement that PSAP is curated separately for four conditions. Saposin A Krabbe, saposin C Gaucher and combined prosaposin deficiency are deliberately out of scope here.
    - Amended the entry description, which previously said MLD is caused by arylsulfatase A deficiency full stop.
    - Set relationship_type CAUSATIVE and variant_origin GERMLINE on both genes.

    Upstream observation, not acted on here: MONDO:0009590 has no asserted RO:0004003 to PSAP; the gene is reachable only through its is_a parent MONDO:0100517 PSAP-related sphingolipidosis. And MONDO:0017729 (late infantile form) and MONDO:0017730 (adult form) are both is_a MONDO:0009591 (juvenile form), which looks wrong.

    Validation: just validate (53/53 snippets), validate-terms, check-entity-refs, check-causal-targets, and the rest of the offline suite all clean.

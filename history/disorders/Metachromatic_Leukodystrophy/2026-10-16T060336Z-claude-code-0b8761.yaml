  summary: Add arylsulfatase A diagnosis row (tranche D batch 1)
  details: |
    LOINC tranche D batch 1 (enzyme activity and metabolite assays). Added a new diagnosis[] row binding LOINC:LP14023-3 (Cerebroside sulfatase, the specimen-generic Part code -- LOINC's component name for arylsulfatase A, reflecting its substrate rather than the enzyme's common name; a broader family-level Arylsulfatase Part code, LOINC:LP15423-4, spanning arylsulfatases A/B/C, was found and rejected as less specific) via measurements, citing PMID:20301309 (the GeneReviews Arylsulfatase A Deficiency chapter, already cited elsewhere in this entry) stating arylsulfatase A enzyme deficiency as one of MLD's diagnostic criteria. No specimen is named in the cached abstract, so the generic Part code was the only option rather than a preference among alternatives; searched for a leukocyte-specific mention and found none. No reference_ranges band: the source states deficiency qualitatively, with no numeric cut-off. LOINC:LP14023-3 confirmed against the Monarch KG API in the step written, then seeded; no third-party copyright notice required. No collision with this code on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

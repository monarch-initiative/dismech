  summary: Reword enzyme-assay row to suggestive, not diagnostic (PR 14481 review
    round)
  details: |
    Review round on PR 14481. The diagnosis[] row's description and evidence explanation called arylsulfatase A enzyme deficiency a diagnostic criterion, but the cited GeneReviews sentence (PMID:20301309) actually lists it among the suggestive findings (alongside progressive neurologic dysfunction and brain MRI evidence of leukodystrophy), with diagnosis established separately by biallelic ARSA pathogenic variants, elevated urinary sulfatide excretion, or metachromatic tissue deposits. ARSA pseudodeficiency is common, which is exactly why GeneReviews places the enzyme assay on the suggestive side rather than the confirmatory side -- the prior wording would have a reader treat low enzyme activity alone as diagnostic. Reworded the description to state the suggestive/confirmatory structure explicitly and mention pseudodeficiency; reworded the existing evidence item's explanation to match. Added a second evidence item (PMID:30828547, already cited with the same grading on this entry's 'Reduced arylsulfatase A activity' biochemical[] marker) quoting the pseudodeficiency-allele sentence directly, so the diagnosis row carries its own citation for the caveat rather than only pointing at the marker. The measurements binding itself (LOINC:LP14023-3, Cerebroside sulfatase) is unchanged -- only the diagnosis row's prose and evidence set were corrected. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

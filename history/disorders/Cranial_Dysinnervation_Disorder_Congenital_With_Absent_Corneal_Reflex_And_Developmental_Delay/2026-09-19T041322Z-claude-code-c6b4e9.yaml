  summary: 'Create: Congenital Cranial Dysinnervation Disorder with Absent Corneal
    Reflex and Developmental Delay (NEUROG1)'
  details: |
    New kb/disorders entry for the NEUROG1-related congenital cranial dysinnervation disorder (MONDO:0957563, OMIM:620469), claimed via issue #12179.

    entry_type decision. The stub was UNDECIDED and the alternatives were checked rather than assumed. Curated as a standalone DISEASE: own MONDO term and OMIM number, no MONDO descendants, one causal gene, and NEUROG1 appears nowhere else in kb/. The CCDD entries already in the KB (Hereditary_Congenital_Facial_Paresis_3, the three Duane entries, Congenital_Fibrosis_of_the_Extraocular_Muscles, Oculomotor_Nerve_Palsy, TUBB3-related_Tubulinopathy) are standalone entries with different genes and different affected nerves, so none is a parent this could be a has_subtypes row of, and there is no CCDD grouping in kb/groupings/ to join. A CCDD grouping collecting those entries with this one is proposed as a separate change and is deliberately not attached.

    Mechanism. Curated as a proneural determination failure rather than a list of clinical features: biallelic NEUROG1 loss of function -> failure of proneural commitment in the trigeminal and otic placodes (before neuroblast delamination, upstream of the NeuroD/MATH3/NSCL1 cascade) -> two arms, a trigeminal sensory deficiency running through loss of corneal sensory innervation to the absent corneal reflex and to neurotrophic epitheliopathy with opacity and ulceration, and a vestibulocochlear agenesis arm running to sensorineural hearing loss, vestibular dysfunction, and secondary stunting of the inner-ear sensory epithelia producing the cochlear malformation. The NEUROG1/NEUROG2 proximal-versus-distal division of labour is what makes the phenotype selective and is curated explicitly.

    Two claims worth flagging. The inner-ear malformation is placed downstream of the missing afferents, not as a primary hair-cell defect, because the mouse null makes structurally normal hair cells in smaller epithelia. And cochlear implantation is curated as ineffective, from the one patient implanted bilaterally with no hearing or speech benefit either side.

    Twelve HPO-bound phenotypes, seven of them causally wired. The five left unconnected (narrow internal auditory canal, global developmental delay, mask-like facies, hypotonia, autism) each state in their own description why no edge was drawn, and are covered by two KNOWLEDGE_GAP discussions. No edge was invented to clear the disconnected-phenotype report.

    Discussions. One HUMAN_MODEL_MISMATCH recording that the Neurog1-null mouse dies within about 12 hours of birth from suckling failure while patients survive into childhood with a modified diet, and that the two candidate explanations are not distinguished by any cited source; this matters because the mouse is where the whole mechanism comes from and the fifth-nerve link is the one place the human and mouse phenotypes most clearly diverge. Plus two KNOWLEDGE_GAPs (central neurodevelopmental features unexplained; facial and bony findings unconnected).

    Evidence discipline. Three human case reports exist for this disorder and one further family is known only through the 2023 review of the series, which is cited as REVIEW_SYNTHESIS rather than quoting the primary exome-screening paper whose abstract does not name the variant. Mouse determination literature is graded MODEL_ORGANISM throughout, including where a human case report restates it, which is marked quote_role BACKGROUND. No human phenotype is supported by mouse evidence alone. The corneal arm uses two ophthalmology reviews graded OTHER with quote_role recorded.

    No conforms_to. sensorineural_hair_cell_loss was rejected because its chain runs hair-cell insult to secondary ganglion degeneration, which is this disorder backwards; pharyngeal_arch_patterning_serial_homology covers neural-crest skeletogenesis, a different tissue and program. No module covers proneural bHLH specification of cranial sensory ganglia.

    Validation. Schema pass, term validation pass, 93/93 snippets verified against cached references, check-entity-refs / check-causal-targets / check-duplicate-keys / check-qualifier-terms / check-enum-values / check-folded-hyphens / check-snippet-length / check-title-snippets / check-snippet-grading / check-environmental-evidence / check-case-collisions / check-stubs all clean, list-gene-term-mismatches reports 2 of 2 gene bindings naming the gene the entry is about. check-genereviews confirms offline against the committed Bookshelf index that no GeneReviews chapter exists, which is expected for an entity with four published families. The stub is deleted in the same change.

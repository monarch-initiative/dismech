  summary: Add treatments, split the fan-out node, correct two source claims
  details: |
    Review round on PR #18336. Every blocking item and every suggestion taken, in one push.

    Item 3 is the one worth recording, because it is the same error as the ITCH entry in this batch and it was made the same way. The c.83delG variant note said PMID:36584998's cached record is a Chinese-language abstract with 'no English sentence that states this variant', so there was nothing to quote. The cache holds a full English structured abstract. Its RESULTS section names the variant, its protein change, its four carriers and its novelty in one sentence, and its CONCLUSION attributes the disease in that pedigree to it. I had read the first lines of the cached file, seen a bracketed Chinese title, and written a negative-existence claim about the whole file; the note then told the next reader that a curator who reads Chinese was needed, which actively discouraged the one check that would have caught it. Three evidence items now carry those sentences.

    Two further things in that note were wrong in the same direction, both now corrected against the abstract. The pedigree is three generations, not four: grandfather, father, and the fetus with its elder brother. And the 17q12 microdeletion was not an 'incidental, unrelated finding in the same family' in the vague sense the note implied: it is de novo in the mother and the authors attribute her bilateral renal cysts to it. The description now says so, with the sentence quoted, and also records that the elder brother's hearing loss is attributed to GJB2/GJB3 variants, so neither finding can be read as part of this disease.

    Item 1. The Orofacial Cleft evidence item from PMID:40028877 quoted the duplex kidney sentence while the explanation said it was cited for the cleft in the preceding clause. The cleft is in the same sentence, so the quote now starts earlier and states it. The description's claim that unilateral clefting occurs now rests on a quote that says unilateral.

    Item 2. The treatments section was absent. Four treatments added, all grounded in references that were already cached: eyelid reconstruction (NCIT:C157852, PMID:11476703 and PMID:39442179), cleft lip and palate repair (NCIT:C15329, PMID:20073547), prosthodontic and orthodontic management of oligodontia (NCIT:C64248, PMID:20073547), and genetic counseling (NCIT:C15240, PMID:36584998). The counselling entry records what differs from the CDH1 form: there is no hereditary cancer question for CTNND1, which is a practical consequence of resolving which gene is involved. Three of the four point target_mechanisms at the new split nodes.

    Item 4. gene_disease_validity now carries external_id CGGV:assertion_5000144a-71c1-4ae7-95a9-17ad67a388c5-2024-03-21T160000.000Z with the validity row and the mechanism sentence quoted. I verified the identifier against the committed ClinGen CSV before fetching it rather than taking the reviewer's CURIE on trust: the row is CTNND1, HGNC:2515, blepharocheilodontic syndrome 2, MONDO:0040503, AD, Definitive, Craniofacial Malformations GCEP, and its MONDO term is this entry's own disease_term. As with the KNG1 and ITCH entries, the fetch warned that the committed CSV no longer matches its manifest pin, so the cache file carries the file's own date.

    Item 5. The notes field carried a 'Deep-research report' paragraph about the report's citation_count, the #10979 shape, the retro-fit, and the #11896 and #16582 timeouts. That is a description of the curation session, not a fact about the disease, and it is in this record instead. The report came back with citation_count 0 and no validation blocks although its body cites thirteen PMIDs; the identifiers were swept out and reference validation was retro-fitted (13 of 13 resolved, 12 of 13 on topic); the term-validation retro-fit could not be completed because validate-research-terms aborted on an unsupported MedGen prefix and then on a 5-second OLS timeout for an ordinary HP CURIE. No CURIE in this entry comes from the report.

    I kept the GeneReviews paragraph's two PubMed queries, and dropped only the run date. The queries are a negative-existence claim about the literature, and CLAUDE.md requires such a note to record the query verbatim so a reviewer can re-run it; removing them would leave an unsupported assertion that no chapter exists. The date is session bookkeeping and is here instead.

    The frequency paragraph contradicted the entry. It said HPOA-style rates 'are not transcribed as frequency: values here' while seventeen phenotypes carry a band. It now says what is true: the bands are a qualitative reading of how consistently a feature appears across the quoted sources, no published cohort reports frequencies for the CTNND1 form specifically, and the dental series is the only source that states counts.

    Suggestions taken.

    The fan-out node is split. Failed Epithelial Tissue Fusion had seven bare edges and bundled tooth agenesis with two fusion failures. It is now Failed Lip and Palate Fusion (GO:0060021), Defective Eyelid Morphogenesis (GO:0061029) and Defective Odontogenesis (GO:0042476), matching the sibling CDH1 entry's node names so the two pathographs are comparable. The reviewer's reason is recorded in the odontogenesis node's own description: the lip, palate and eyelid phenotypes are failures of two epithelial sheets meeting, where agenesis is a failure of the dental lamina to initiate a tooth germ, and what they share is the upstream adhesion deficit rather than the morphogenetic event.

    Every fan-out edge now carries edge-level evidence. Two of them say in the explanation that the model evidence covers the territory rather than the specific sign: the conditional deletions are reported to disturb eyelid and tooth development, not distichiasis or conical crowns in particular. Naming that is better than either a bare edge or an explanation that overstates what the quote says.

    All three previously uncited cache files are now cited, each where it belongs rather than where it was convenient. PMID:22736606 (p120ctn ablation in neural crest) is an animal_models entry linked to the cadherin-turnover node, bound to MGI:105100 for mouse Ctnnd1, with two typed divergences. It is included for the mechanistic step and not the phenotype: the anterior segment dysgenesis it produces is not a BCDS feature, and the description and the divergences say so. PMID:15930907 is a differential, the pre-molecular lagophthalmos-syndrome overlap. PMID:35700046 (CTNND1 FEVR through the Wnt/cadherin axis) is a REFUTE item on the node whose description gives the reason the Wnt branch is left out: CTNND1 variants do reach disease through Wnt signalling in retinal endothelium, so dispensability during craniofacial development is not a claim about p120-catenin in general. Graded INDIRECT because it is another disease in another tissue.

    The unsourced sentence saying CTNND1 is among the most loss-of-function-intolerant genes in the genome is removed. It was a constraint-metric claim with no citable source in this repository's reference system, and the haploinsufficiency mechanism it was offered as support for is already established by the quoted cohorts.

    Identifier discipline: the three new GO terms and the MGI identifier were each read from a source in the step they were written, GO from OLS and MGI:105100 from NCBI Gene 12388's own MGI and AllianceGenome cross-references. The three NCIT treatment terms were checked against cache/ncit/terms.csv. I ran just check-gene-namespaces-online before committing, which is what I skipped on the ITCH entry and which cached the MGI row.

    Re-verified on this head: just validate passes with 74/74 snippets and 72 titles, up from 46. check-gene-namespaces, check-gene-namespaces-online, check-gene-validity, check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-logical-rules, check-duplicate-keys, check-name-collisions, check-snippet-length, check-snippet-grading, check-title-snippets, check-reference-titles, check-retired-support-prose, check-shared-disease-terms and check-cache-order all pass, and list-gene-validity reports zero in every class for this file.

    check-name-collisions notes that one baseline row in Sarcoglycanopathy no longer collides. That is someone else's change, not this branch's, so the baseline is left alone rather than shrunk here.

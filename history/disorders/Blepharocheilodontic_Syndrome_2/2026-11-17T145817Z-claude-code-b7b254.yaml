  summary: Fix a self-contradiction, a misplaced REFUTE item, and the CI gate I never
    ran
  details: |
    Second review round on PR #18336, plus the CI failure that arrived with it. Both blocking findings and both suggestions.

    The CI failure is the one worth recording, because it hit all four open PRs in this batch at once and I caused it in the same way in each. check_reference_titles_present failed: every evidence item needs a reference_title copied from its references_cache frontmatter, and the ClinGen evidence items I added during the previous round carried none. I had run just check-reference-titles, which checks that a title MATCHES its cached frontmatter, and assumed that covered it. It does not: a missing title is a different gate with a different recipe name, and an item with no title trivially passes the matching check. Two items here, one each on the KNG1, DNAJC21 and ITCH entries. Fixed with scripts/backfill_reference_titles.py, which copies from the cache rather than letting me type a title, which is the point of the rule.

    Blocking 1 is a self-contradiction I introduced while fixing the previous round. The variant description was corrected from a four-generation to a three-generation pedigree, matching the abstract's grandfather, father, fetus and elder brother. The inheritance block still said four. Correcting one statement of a fact and leaving its duplicate is a specific hazard of fixing review findings by targeted edit, and grepping the corrected phrase would have caught it.

    Blocking 2 is a placement error with a real consequence. The PMID:35700046 FEVR item was attached to Increased Cadherin Endocytosis and Turnover and graded REFUTE, so it read as evidence against p120-catenin loss reducing surface cadherin. The snippet says the opposite of that: CTNND1 variants act by compromising the expression of adherens junctions, which supports the node. What the item actually disputes, as its own explanation said, is the reasoning in the upstream Reduced p120-Catenin Dosage node for leaving the Wnt and Kaiso branch out. So a reader filtering on REFUTE got a false signal against a well-supported node. The item now sits on the dosage node, whose description carries that reasoning, still REFUTE and INDIRECT, with an explanation saying it is graded against the stated reason rather than against the dosage claim.

    The general shape is the same as the ITCH entry's IgA item from earlier today: an evidence item whose explanation describes a different target from the one it is attached to. There the explanation conceded the quote was off-claim; here it named the right node and the item was filed under the wrong one.

    Suggestions taken. The Defective Odontogenesis to Taurodontia edge now carries the shared-territory snippet with the same caveat as Conical Teeth: tooth development is among the territories the conditional deletions disturb, and the enlarged pulp chamber is not separately reported in the models. And the N-cadherin readout's interpretation no longer implies that a mouse link's readout was measured in the mouse: it says the measurement comes from the paper's companion in vitro experiment in a human trabecular meshwork cell line, and points at the node-level evidence for the knockout tissue's own cadherin change.

    Re-verified on this head: just validate passes with 75 snippets, up from 74, and 0 issues. check-reference-titles-present, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-logical-rules, check-gene-activity-grounding, check-gene-namespaces, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles and check-cache-order all pass.

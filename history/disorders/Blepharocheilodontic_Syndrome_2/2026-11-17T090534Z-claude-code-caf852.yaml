  summary: 'Create: Blepharocheilodontic Syndrome 2 (CTNND1)'
  details: |
    New entry for blepharocheilodontic syndrome 2 (MONDO:0040503), the CTNND1-associated form of blepharocheilodontic syndrome. Sibling of the existing Blepharocheilodontic_Syndrome_1 entry, whose notes already identified this disease as a separate one with its own stub.

    Deep research: one openscientist run, research/Blepharocheilodontic_Syndrome_2-deep-research-openscientist.md. The run came back with citation_count 0 and therefore no reference-validation or term-validation block, although its body cites thirteen PMIDs. That is the dismech#10979 shape, where an empty citation sidecar is indistinguishable from a report with no identifiers. The identifiers were swept out of the body and the reference-validation section was retro-fitted with just validate-research-reference: 13 of 13 resolved, 12 of 13 on topic, none unresolved.

    The term-validation retro-fit could not be completed. just validate-research-terms aborted on an unsupported MedGen prefix, which is dismech#16582; applying --skip-prefix MedGen as that issue documents then aborted on a 5-second OLS read timeout for an ordinary HP CURIE, which is dismech#11896. Both are open and both were reproduced here rather than worked around further. No CURIE in this entry comes from the report: each was looked up in OLS at the time of writing.

    Mechanism: the chain runs from the heterozygous truncating variant through reduced p120-catenin dosage, increased cadherin endocytosis, and a named threshold node to failed epithelial fusion. The threshold node is the part worth pointing at, because it is what explains the syndrome's selectivity: a gene expressed throughout the embryonic epithelium produces a malformation concentrated in lip, palate, eyelid margin and dental lamina, and the 2026 mouse work shows upper lip fusion specifically requires more cadherin adhesion than neighbouring tissue does. The same work's p120-catenin allelic series showed that binding to RhoA and Kaiso is dispensable in mammalian development while cadherin stabilisation is crucial, which is why the Wnt and Kaiso transcriptional branch the report describes is not modelled here as a parallel disease mechanism; the entry says so.

    Phenotype frequencies from the report's HPOA-style table were deliberately not transcribed as frequency values, because the cohorts behind them are small, partly overlapping and partly pre-molecular, and the quoted sources state presence rather than a rate. Where a source states a rate for its own cohort, it is quoted.

    Much of the clinical literature predates the molecular split between the two genes. The dental and craniofacial series (PMID:28181393) describes BCD syndrome without a gene and may include CDH1 cases; the evidence items drawn from it say so in their explanation, and features reported only there are not asserted as CTNND1-specific.

    One reference is quoted at a deliberately minimal level: PMID:36584998 is a Chinese-language abstract whose quotable English text is limited to the gene symbol, so the c.83delG variant detail in the description is attributed to the deep-research report's reading of it rather than asserted as a quoted finding.

    The cardiac, limb and neurodevelopmental phenotypes carry no mechanistic edge, because the cohort that established them divided the phenotype into epithelial-integrity features and features suggesting a separate mesenchymal role, and only the former is modelled. A KNOWLEDGE_GAP discussion records that division and why it matters.

    One YAML defect was caught by validation rather than by me: an unquoted explanation containing a colon followed by a space broke the parse. It is reworded.

    Validation: just validate passes (46/46 snippets), and check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-genereviews and check-shared-disease-terms all pass. GO:0045296 cadherin binding was bound on the lesion node, taken from CTNND1's own GO annotations and matching the mechanism the entry models. One coarse binding, HP:0001627 for the unspecified cardiac anomalies, carries coarse_binding_basis SOURCE_UNSPECIFIED because the source names no lesion.

  summary: Add daraxonrasib (RAS(ON) inhibitor) treatment and RASolute 302 trial
  details: |
    Curated the RASolute 302 phase 3 trial (NEJM 2026, PMID:42223072 / DOI:10.1056/NEJMoa2605555; NCT06625320) into the metastatic PDAC entry. Added a Daraxonrasib treatment (RAS(ON) multiselective tri-complex inhibitor; therapeutic_modality SMALL_MOLECULE; therapeutic_agent CHEBI:746946; target_mechanisms INHIBITS the KRAS-Centered Oncogenic Signaling node) and a clinical_trials entry for NCT06625320. Evidence is snippet-backed against the PubMed abstract (PMID:42223072): the RAS(ON) tri-complex mechanism sentence, the overall-survival result (13.2 vs 6.6 months, HR 0.40, P<0.001), and the progression-free-survival result (7.3 vs 3.5 months, HR 0.45), plus the ClinicalTrials.gov RAS(ON)-inhibitor-vs-SOC summary. Also seeded two EMERGING mechanistic_hypotheses for OpenScientist deep-research exploration: ras_on_inhibitor_acquired_resistance (mechanisms of escape from RAS(ON) multiselective inhibition; premise anchored on the PMID:42223072 PFS result) and ras_on_inhibition_immune_tme_remodeling (whether RAS(ON) inhibition reverses the immunosuppressive PDAC microenvironment and rationalizes checkpoint-inhibitor combination; supporting evidence to be gathered via the DR run). scripts/hypothesis_deep_research.py lists both. Ran the OpenScientist deep-research job for ras_on_inhibition_immune_tme_remodeling (report committed under kb/hypotheses/; verdict PARTIALLY SUPPORTED) and, after the DR anti-hallucination workflow (fetched each PMID, verified snippets are exact abstract substrings, checked title/identity for NEC), enriched that hypothesis with four verified MODEL_ORGANISM/PARTIAL evidence items (PMID:41670434 daraxonrasib RAS(ON) doublet + ICB in NSCLC; PMID:37782788 KRAS activity governs immune composition, ICB combo needed for durable regression; PMID:36824971 MRTX1133 + immunotherapy CD8-dependent PDAC regression; PMID:42436354 CDK8-driven transient-window durability caveat naming daraxonrasib) plus an evidence-based notes verdict (agent gap, Treg-arm source absence, autophagy/FAK-owned antigen presentation, untested daraxonrasib+ICB). Two report snippets were caught as misquotes and replaced with exact abstract quotes. Also ran the OpenScientist job for ras_on_inhibitor_acquired_resistance (report committed under kb/hypotheses/; verdict SUPPORTED that resistance occurs, UNRESOLVED which route dominates) and, after the same anti-hallucination workflow, enriched that hypothesis with four verified evidence items (PMID:42465401 daraxonrasib allele-specific resistance with cyclophilin-A loss; PMID:41959066 RAS-independent cell-cycle uncoupling under RMC-6236 rescued by CDK2/4/6; PMID:41572361 mTOR/JUN-AP1 CRISPR-screen resistance in KRAS-mutant PDAC; PMID:41165456 RAS-reactivation/RTK routes remaining targetable by multiselective RAS(ON) inhibition) plus two mechanisms added to the description (CypA chaperone loss; RAS-independent cell-cycle uncoupling) and an evidence-based notes verdict. Both hypotheses remain EMERGING. Followed on by promoting the two best-verified resistance mechanisms into the pathograph: added three pathophysiology nodes - Cyclophilin A Loss and Reduced Tri-Complex Engagement (PPIA hgnc:9253, GO:0003755, PMID:42465401), RAS-Independent Cell-Cycle Uncoupling (GO:0008283, PMID:41959066), and a convergent Acquired RAS(ON) Inhibitor Resistance node (PMID:42223072) - with DIRECT downstream causal edges opting into the ras_on_inhibitor_acquired_resistance hypothesis_group. Then, per curator preference to include mechanisms (marking weak evidence explicitly and tagging each edge to a hypothesis), expanded both hypothesis-tagged sub-graphs. Resistance additions: On-Target RAS Reactivation/KRAS Amplification and RTK/Feedback Reactivation (PMID:41165456, PARTIAL, INDIRECT); Adaptive mTOR/JUN-AP1 Program (PMID:41572361); Mitochondrial Remodeling/Ferroptosis Vulnerability (PMID:41545339, GO:0097707); MYC Amplification (PMID:39586491, PARTIAL, flagged WEAK/review-level). Immune-remodeling sub-graph converging on a new Immunosuppressive TME Reversibility node (PMID:37782788), fed by Myeloid Relief/CD8 Infiltration (PMID:37625401, CL:0000625), Tumor-Cell FAS Induction (PMID:36824971), Antigen Presentation Restoration (PMID:41670434, GO:0019882, flagged WEAK/competing autophagy-FAK), Regulatory T-Cell Relief (CL:0000815, UNSUPPORTED source-absence edge, causal_link_type UNKNOWN, no evidence), and USP20 Cholesterol CD8-Exhaustion Checkpoint (PMID:42392864); plus a CDK8-CXCL2 Adaptive Immune Reversal node bridging both hypotheses. Evidence strength is marked first-class via supports (SUPPORT/PARTIAL) and causal_link_type (DIRECT/INDIRECT/UNKNOWN). Both hypotheses remain EMERGING. Schema, reference, and term validation all pass.

  summary: Add daraxonrasib (RAS(ON) inhibitor) treatment and RASolute 302 trial
  details: |
    Curated the RASolute 302 phase 3 trial (NEJM 2026, PMID:42223072 / DOI:10.1056/NEJMoa2605555; NCT06625320) into the metastatic PDAC entry. Added a Daraxonrasib treatment (RAS(ON) multiselective tri-complex inhibitor; therapeutic_modality SMALL_MOLECULE; therapeutic_agent CHEBI:746946; target_mechanisms INHIBITS the KRAS-Centered Oncogenic Signaling node) and a clinical_trials entry for NCT06625320. Evidence is snippet-backed against the PubMed abstract (PMID:42223072): the RAS(ON) tri-complex mechanism sentence, the overall-survival result (13.2 vs 6.6 months, HR 0.40, P<0.001), and the progression-free-survival result (7.3 vs 3.5 months, HR 0.45), plus the ClinicalTrials.gov RAS(ON)-inhibitor-vs-SOC summary. Schema, reference, and term validation all pass.

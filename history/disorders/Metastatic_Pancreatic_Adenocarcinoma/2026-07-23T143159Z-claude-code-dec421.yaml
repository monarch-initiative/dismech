  summary: Add daraxonrasib (RAS(ON) inhibitor) treatment and RASolute 302 trial
  details: |
    Curated the RASolute 302 phase 3 trial (NEJM 2026, PMID:42223072 / DOI:10.1056/NEJMoa2605555; NCT06625320) into the metastatic PDAC entry. Added a Daraxonrasib treatment (RAS(ON) multiselective tri-complex inhibitor; therapeutic_modality SMALL_MOLECULE; therapeutic_agent CHEBI:746946; target_mechanisms INHIBITS the KRAS-Centered Oncogenic Signaling node) and a clinical_trials entry for NCT06625320. Evidence is snippet-backed against the PubMed abstract (PMID:42223072): the RAS(ON) tri-complex mechanism sentence, the overall-survival result (13.2 vs 6.6 months, HR 0.40, P<0.001), and the progression-free-survival result (7.3 vs 3.5 months, HR 0.45), plus the ClinicalTrials.gov RAS(ON)-inhibitor-vs-SOC summary. Also seeded two EMERGING mechanistic_hypotheses for OpenScientist deep-research exploration: ras_on_inhibitor_acquired_resistance (mechanisms of escape from RAS(ON) multiselective inhibition; premise anchored on the PMID:42223072 PFS result) and ras_on_inhibition_immune_tme_remodeling (whether RAS(ON) inhibition reverses the immunosuppressive PDAC microenvironment and rationalizes checkpoint-inhibitor combination; supporting evidence to be gathered via the DR run). scripts/hypothesis_deep_research.py lists both. Ran the OpenScientist deep-research job for ras_on_inhibition_immune_tme_remodeling (report committed under kb/hypotheses/; verdict PARTIALLY SUPPORTED) and, after the DR anti-hallucination workflow (fetched each PMID, verified snippets are exact abstract substrings, checked title/identity for NEC), enriched that hypothesis with four verified MODEL_ORGANISM/PARTIAL evidence items (PMID:41670434 daraxonrasib RAS(ON) doublet + ICB in NSCLC; PMID:37782788 KRAS activity governs immune composition, ICB combo needed for durable regression; PMID:36824971 MRTX1133 + immunotherapy CD8-dependent PDAC regression; PMID:42436354 CDK8-driven transient-window durability caveat naming daraxonrasib) plus an evidence-based notes verdict (agent gap, Treg-arm source absence, autophagy/FAK-owned antigen presentation, untested daraxonrasib+ICB). Two report snippets were caught as misquotes and replaced with exact abstract quotes. Schema, reference, and term validation all pass.

  summary: 'Pre-PR review fixes: Combined_Immunodeficiency_Due_To_MALT1_Deficiency'
  details: |
    Applied pre-PR review fixes. Moved the Th17 edge from the antigen-receptor T cell activation node to the paracaspase node, because its only evidence (PMID:25762782) attributes defective Th17 differentiation to loss of protease activity, and regraded that in-vitro mouse T cell snippet IN_VITRO. Reworded the paracaspase node description to say the protease was largely dispensable for activation in one knock-in line (PMID:25456129) while a second line showed reduced proliferation, IL-2 and Th17 differentiation in vitro (PMID:25762782); added human evidence for the paracaspase node (PMID:40748513) and marked the PMID:25456129 background sentence quote_role BACKGROUND. Bound antibiotic prophylaxis to NCIT:C51993 Antibiotic Prophylaxis instead of Pharmacotherapy and dropped the unsourced antifungal claim. Cited PMID:40853399 for the c.609G>A Trp203 nonsense allele named in the genetic notes and committed its cache file. Added a diagnosis section (functional lymphocyte testing, molecular testing, normal newborn TREC caveat), a Periodontitis phenotype (HP:0000704), infantile onset on Recurrent infections, Human Immunoglobulin G as therapeutic agent for immunoglobulin replacement, an HSCT recommendation snippet, evidence on four previously bare phenotype edges, and two animal models (Malt1 protease-dead knock-in, Malt1 knockout) with modeled_mechanisms. Regraded PMID:33714841 phenotype items from OTHER to HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, set the prevalence snippet to quote_role BACKGROUND, and removed the Oral ulcer frequency because the published figures cover oral lesions of any kind. Validated with just validate (93/93 snippets), validate-terms, validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles and check-enum-values.

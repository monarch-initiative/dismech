  summary: 'Create: Combined_Immunodeficiency_Due_To_MALT1_Deficiency'
  details: |
    De novo curation of combined immunodeficiency due to MALT1 deficiency (IMD12, MONDO:0014197). One openscientist deep-research report was generated and used as a source of leads only; every claim was checked against the cached PubMed abstracts or full texts. The pathograph runs from biallelic MALT1 loss of function through defective CBM signalling to NF-kappaB and loss of paracaspase activity, to impaired antigen-receptor T cell activation, impaired Th17 immunity, arrested B cell maturation with progressive depletion, regulatory T cell deficiency and Th2-skewed dysregulation, and from these to 21 HP-bound phenotypes (18 causally connected). Treatments: allogeneic HSCT (curative, linked to three mechanism nodes), immunoglobulin replacement and antimicrobial prophylaxis (recorded with REFUTE evidence for efficacy from the largest cohort). Validated with just validate (79 snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles, check-enum-values and check-genereviews (no GeneReviews or StatPearls chapter exists).

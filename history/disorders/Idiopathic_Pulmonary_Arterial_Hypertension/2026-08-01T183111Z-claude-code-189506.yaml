  summary: 'Create: Idiopathic Pulmonary Arterial Hypertension'
  details: |
    Created kb/disorders/Idiopathic_Pulmonary_Arterial_Hypertension.yaml for MONDO:0001999, issue 7712. Deep research provider Edison/Falcon via just research-disorder falcon: 607s run, 23 citations, 1 artifact, report at research/Idiopathic_Pulmonary_Arterial_Hypertension-deep-research-falcon.md. NEC preflight with runoak on MONDO:0001999 confirmed sporadic Group 1 IPAH, is_a pulmonary arterial hypertension MONDO:0015924 plus idiopathic disease MONDO:0700007, synonyms IPAH and primary pulmonary hypertension; the DR report was verified to concern Group 1 IPAH and to explicitly exclude Groups 2-5 and CTEPH. Duplicate preflight against origin/main, all PRs and all issues found no existing entry. Positioning: five pathophysiology nodes declare conforms_to against the pulmonary_vascular_remodeling module rather than re-deriving the shared cascade. IPAH-specific content is the Unidentified Initiating Insult trigger node, the Occult Rare Variant Burden node quantifying the porous IPAH/HPAH boundary at a pooled 17.75 percent pathogenic BMPR2 across 3124 IPAH patients, three registry and physiology defined subtypes classical / low-DLCO lung phenotype / vasoresponder, female predominance of 4.1 to 1, and the IPAH-specific CCL5 T and NK immune-vascular crosstalk node. Genes are typed SUSCEPTIBILITY rather than CAUSATIVE by design. Treatments use target_mechanisms to link endothelin receptor antagonists, PDE5 inhibitors and riociguat, prostacyclin pathway agents, sotatercept, vasoreactivity-gated calcium channel blockers and lung transplantation back to the mechanism nodes they act on. Every DR-supplied DOI was converted to a PMID and fetched with just fetch-reference. Validation: just validate, just validate-terms and just validate-references all pass, with 59 of 73 snippets verified against cached references and 14 skipped by prefix. Claims the DR report sourced from uncached full-text pages, namely numeric haemodynamic thresholds, incidence, diagnostic delay, survival percentages and the 2024 WSPH 12-gene list, were deliberately not asserted and are documented in the entry notes.

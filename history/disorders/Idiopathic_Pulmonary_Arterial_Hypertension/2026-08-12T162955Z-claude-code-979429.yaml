  summary: Link an absence and a phenotype marker, both as MODULATES
  details: |
    Backfill for issue #8085. Both links point at the unidentified-initiating-insult node and both are MODULATES, and the reason is the same in each case: neither exposure acts on a mechanism, each decides which entity the patient has. The absence-of-recognised-exposure link is the strangest in this backfill and its description says so plainly. The exposure is an absence, so it cannot act on anything, and the node it targets is described by this entry as epistemic rather than biological, holding the fact that no cause has been found; absence and node are therefore the same statement, which is why the link is DIRECT. No value in the effect enum is truly honest for a classification criterion, and MODULATES was chosen as the least misleading, since identifying such an exposure moves the case out of this entry entirely. The smoking link is MODULATES for the entry's own stated reason, that smoking is not a validated cause of classical disease here and in this subgroup marks a presumably smoking-related pulmonary vascular disease behaving more like pulmonary hypertension due to lung disease. On evidence_source: the generator's target-node cross-check flagged that the review cited on the absence link was tagged OTHER on the link and HUMAN_CLINICAL on the node. Rather than impose a convention, the link item was aligned to the file, where ten pre-existing items already tag that reference HUMAN_CLINICAL; retagging all of them belongs to the unresolved question in issue #8184 rather than to a link backfill. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 62 of 79 with 17 pre-existing DOI-prefix skips.

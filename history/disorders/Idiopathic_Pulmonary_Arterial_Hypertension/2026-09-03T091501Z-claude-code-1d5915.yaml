  summary: 'Edit: Idiopathic Pulmonary Arterial Hypertension - obsolete MONDO:0017147
    disposition and gap closure'
  details: |
    Curation was requested for "obsolete idiopathic pulmonary arterial hypertension".
    That is not a disease. MONDO:0017147 carries the literal label "obsolete idiopathic
    pulmonary arterial hypertension": it is deprecated with obsolescence reason
    MONDO:TermsMerged and "term replaced by" MONDO:0001999
    (monarch-initiative/mondo#9136, xref NANDO:2201046). MONDO:0001999 is already
    curated as this entry (created by dismech#7748). The preflight found no stub, no
    claim issue and no PR carrying MONDO:0017147, so no queue item needed retiring.

    Outcome: no new entry. A second entry against a merged-away term would have been a
    duplicate of this one. The disposition is recorded in this entry's notes, following
    the precedent set in Lambert-Eaton_Myasthenic_Syndrome for MONDO:0000287, so the
    concept is not nominated a third time from a MONDO label list. The obsolete CURIE
    is deliberately not bound anywhere in the file, mappings.mondo_mappings included: a
    deprecated term is detached from the MONDO hierarchy and is therefore not a member
    of the DiseaseTerm dynamic enum, and recording it as a mapping would assert a live
    cross-reference that does not exist.

    The session was then spent closing measured gaps in the existing entry, which sat
    at 87.7% compliance and now sits at 93.5% (261/279).

    Deep research: no new provider run. research/Idiopathic_Pulmonary_Arterial_Hypertension-deep-research-falcon.md
    already existed from the original curation; re-running the same provider on the same
    disease to support an augmentation pass would have been a provider call for
    identifiers already on disk. It predated the in-line validation sections, so both
    retro-fits were run against it. Reference validation: 10 references checked, 10
    resolved, 0 unresolved, 0 off topic. Term validation: 39 terms checked, 38 resolved,
    0 unresolved, 0 obsolete, 1 unverifiable (an ORPHA CURIE, no configured resolver).
    Both sections are committed with the report.

    What changed in the entry:

    - datasets: new block, 0% -> 100% compliance. Five GEO series, all DIRECT
      candidates from `just discover-datasets` and all resolving under
      `just verify-datasets` (5/5 OK): GSE169471 (scRNA-seq of IPAH lung explants,
      PMID:32166015), GSE256539 (GeoMx spatial profiling of microdissected IPAH
      vascular lesions, PMID:38568479), GSE244781 (SSc-PAH and IPAH, PMID:38841857),
      GSE126322 (endothelial enhancer ChIP-seq, PMID:32245974) and GSE84395
      (endothelial DNA methylation, PMID:28881789). Relevance triage is manual and is
      recorded per record in `notes`, including the two caveats a resolving accession
      does not catch: GSE244781 pools systemic-sclerosis-associated PH with IPAH and
      needs the arms separated, and GSE126322/GSE84395 are PAH-wide rather than
      IPAH-restricted. Bulk records carry `publication` and provenance notes and no
      `evidence` block, per the dataset SOP. Candidates rejected on triage: GSE48149
      (systemic sclerosis lung), GSE314466 and GSE228133/GSE228134 (mouse
      hypoxia/SU5416 and ADAR1 knockout models).

    - pathophysiology causal edges: 0/15 -> 11/15 carrying their own evidence. The
      backbone chain (unidentified insult -> endothelial dysfunction -> PASMC
      proliferation/vasoconstriction -> obstructive remodeling -> increased PVR ->
      precapillary PAH with RV failure -> RV hypertrophy, RV failure, dyspnea, syncope,
      exercise intolerance) is now cited edge by edge from PMID:38716930,
      PMID:36603064 and PMID:29540357, using sentences that assert the causal step
      rather than either node. Four edges are left uncited because no cached source
      makes the link (the two immune-crosstalk edges, and the peripheral-edema and
      T/NK-to-PASMC edges); an uncited edge was preferred to reaching for a node's
      citation.

    - phenotypes[].sequelae: the RV hypertrophy -> RV failure link now cites
      PMID:29540357, which names the same ischaemia and fibrosis intermediates the
      link records.

    - treatments[].target_mechanisms: 0/7 -> 5/7 carrying evidence (endothelin
      receptor antagonist, NO-cGMP, prostacyclin, sotatercept, calcium channel
      blocker). The two left uncited are lung transplantation and the sotatercept
      remodeling link, where the cached sources support the treatment but not the
      specific mechanism claim.

    - histopathology: the single finding bundled intimal fibrosis, medial hypertrophy,
      in-situ thrombosis, plexiform lesions and inflammatory infiltrate into one
      record, which is why it could take no ontology binding. Plexiform lesions and
      medial hypertrophy are now separate findings evidenced from PMID:38568479, and
      the original record is narrowed to the perivascular inflammation its own quote
      supports. `diagnostic` on that record changed true -> false: perivascular
      inflammation is shared across Group 1 PAH and the record's own description says
      lung biopsy is avoided in routine diagnosis, so the two contradicted each other.

      None of the three findings is bound, and that is a decision rather than an
      omission. HPO has exact terms for all three - HP:0033420, HP:0004964, HP:0033392
      - but HistopathologyFindingTerm admits HP only below HP:0025461 (Abnormal cell
      morphology) and all three sit under HP:0025015 (Abnormal vascular morphology),
      so binding them fails term validation. The NCIT side of the enum has no
      counterpart: the morphologic-finding branch returns nothing for plexiform
      lesion, arterial medial hypertrophy or perivascular inflammation, and the
      nearest matches (NCIT:C139156, NCIT:C139160) name atherosclerotic coronary
      lesions. Per the project term rule, no term beats a bad one. Widening the enum
      to the HPO vascular-morphology subtree is a schema change and is recorded in the
      entry notes as the real fix.

    - differential_diagnoses: the drug- or toxin-induced PAH entry was the one
      differential with no evidence; it now cites PMID:29417823, whose abstract
      supports both recorded distinguishing features in one sentence.

    - retired-enum prose: four `explanation` fields still argued for `supports:
      PARTIAL`, retired in dismech#10003. Each was rewritten to say what it meant and
      given `directness: INDIRECT`, which is the axis the old value was standing in
      for.

    Validation run: `just validate` passed; `just validate-terms` passed;
    `just count-verified-snippets` 82/101 (19 skipped by prefix) and
    `just count-verified-snippets --unskip-prefix DOI` 101/101, so every DOI-keyed
    snippet was checked by hand even though the gating validator skips that prefix;
    `just verify-datasets` 5/5 OK; `just check-duplicate-keys`, `check-entity-refs`,
    `check-causal-targets`, `check-qualifier-terms`, `check-folded-hyphens`,
    `check-snippet-length`, `check-title-snippets`, `check-snippet-grading`,
    `check-environmental-evidence` and `check-enum-values` all clean with no baseline
    changed; `just validate-disorders` passed as the final batched gate.

    The actor record carries no `model` field. The session running this curation is
    configured not to write a model identifier into repository artifacts, and the
    history schema makes the field optional; `agent_tool` is recorded as usual.

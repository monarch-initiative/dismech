  details: |
    Touched only as collateral of issue #12250. The snippet 'Current therapies have mechanisms of action involving signalling via one of four pathways: endothelin-1, nitric oxide, prostacyclin and bone morphogenetic protein/activin signalling.' from DOI:10.1183/13993003.01325-2024 had stopped verifying under linkml-reference-validator 0.3.0rc1. The committed cache held the sentence with the publisher's italic 'via' concatenated as 'signallingviaone'; on re-fetch the extractor now emits the three words separated by whitespace, so the stale byte sequence no longer matched. The same sentence is quoted in Heritable_Pulmonary_Arterial_Hypertension, which is the entry this issue is about, so all six occurrences across the three entries were requoted from the refreshed cache and the refreshed cache was committed. The claim and its explanation are unchanged; only the quoted bytes moved. This is the publisher-revision class described in the campaign brief, not a defect in the entry.

  details: |
    Added diagnosis.measurements (LOINC:8414-5 mPAP, LOINC:8587-8 PAWP, LOINC:8828-6 PVR) to the existing Right heart catheterisation row, with a reference_ranges band on each (mPAP>20mmHg, PAWP<15mmHg, PVR>=3 Wood units) cited to PMID:30545968. This resolves a 'deliberate omissions' note already on this entry, which had left these thresholds unbound because the 2022 ESC/ERS guideline (PMID:36017548) has no PubMed abstract -- PMID:30545968 is the 2019 task-force paper that guideline adopted, and it is fully cached with quotable text. Also corrected the PVR figure: the entry's prior notes carried a deep-research-supplied '>2 Wood units' figure, while the officially adopted cut-off this source states is >=3 Wood units; updated the deliberate-omissions prose to record both the resolution and the correction. Part of LOINC_DIAGNOSTICS.md tranche G.

  summary: 'LOINC tranche G batch 7: mPAP/PAWP/PVR measurements and the pre-capillary
    PAH triad bands'
  details: |
    Added diagnosis.measurements (LOINC:8414-5 mPAP, LOINC:8587-8 PAWP, LOINC:8828-6 PVR) to the existing Right heart catheterisation row, with a reference_ranges band on each for the pre-capillary PAH triad (mPAP>20mmHg, PAWP<=15mmHg, PVR>2 Wood units), cited to PMID:39209475 (Kovacs, Bartolome and Denton, 2024), which restates the current 2022 ESC/ERS criteria with a quotable abstract and full text. This resolves a 'deliberate omissions' note already on this entry, which had left these thresholds unbound because the 2022 ESC/ERS guideline (PMID:36017548) has no PubMed abstract.

    Review round: the initial push had bound the PVR band at >=3 Wood units, citing PMID:30545968 (the 2019 task-force paper that proposed the mPAP revision) and attributing it to the "6th WSPH, 2018". That was wrong on both counts -- >=3 WU is the 2003 (3rd WSPH) figure, which the 2019 paper's own "best defined by" sentence still pairs with the new mPAP rather than revising, and it was superseded by a lower figure (>2 WU) the 2022 ESC/ERS guideline adopted -- the same figure the 2019 paper had already flagged, with a hedge, as "the direction of travel". Re-bound all three bands to PMID:39209475, fixed the PVR value to >2 WU with the corrected history in notes (quoting PMID:30545968's hedge sentence), and fixed the PAWP band's boundary: the source states the criterion inclusively (PAWP<=15mmHg) but the original band's upper_bound of 15 excluded a value of exactly 15 under the half-open convention; moved it to 16, the same whole-number half-open placement the Heart_Failure entry's HFrEF/HFmrEF split uses. Applied identically to the Heritable_Pulmonary_Arterial_Hypertension and Drug_or_Toxin-Induced_Pulmonary_Arterial_Hypertension entries and the pulmonary_vascular_remodeling module.

    Review round 2: the mPAP band had the same class of off-by-one as PAWP did, at the other boundary: the criterion is mPAP >20 mmHg (strict), but lower_bound: 20 included exactly 20 mmHg as meeting the PH criterion, even though the Pulmonary_hypertension entry's own cited sentence calls 20 mmHg "the upper limit of normal." Moved to lower_bound: 21, the same whole-number convention. Separately audited the PVR band for the same class of error: the criterion is PVR >2 WU (strict) and lower_bound: 2 has the identical technical inclusion of exactly 2.0 WU, but this one is not fixed the same way, because PVR (unlike mPAP and PAWP) is reported with decimal precision in the literature -- including in this very source, which discusses "PVR 2-3 WU" as a real continuous zone, not a rounding artifact. Bumping to lower_bound: 3 would wrongly exclude a genuinely elevated value such as PVR 2.5 WU, so the PVR band keeps lower_bound: 2 with the discrepancy at exactly 2.0 WU documented in notes instead, the same way the Osteoporosis entry's WHO T-score bands document their own boundary tension rather than inventing a fix. Part of LOINC_DIAGNOSTICS.md tranche G.

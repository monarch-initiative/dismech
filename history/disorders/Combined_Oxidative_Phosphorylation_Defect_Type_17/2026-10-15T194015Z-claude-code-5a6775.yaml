  details: |
    New Disease entry for ELAC2-related combined oxidative phosphorylation defect type 17 (MONDO:0014190), curated as one allelic spectrum covering the infantile hypertrophic cardiomyopathy presentation and the neurological-predominant presentation. Deep research: falcon (Edison) failed three times with '503 Failed to authenticate', including with dr_fallback set, because the client does not hand over on that error; the one report used was produced by the claude_code provider. That report was thin and was used only as a lead list after just preflight-dr (WARN: MIPEP mentions were the report's own correction that MIPEP belongs to COXPD31, not this disease). All claims were checked against primary sources fetched with just fetch-reference: Haack 2013 (PMID:23849775), Saoura 2019 (PMID:31045291), Shinwari 2017 (PMID:28441660), Akawi 2016 (PMID:27769300), the 2023 French series (PMID:36836802), the Kuwaiti founder cohort (PMID:42477863), Paucar 2018 (PMID:30217939), Siira 2018 mouse knockout (PMID:30126926), the Drosophila model (PMID:34338278) and mechanistic papers (PMID:21593607, PMID:21559454, PMID:29040705, PMID:39516281). The ClinGen Definitive AR assertion for ELAC2 is for the lumped MONDO:0044970 'mitochondrial disease', so it is cited as evidence but not recorded as gene_disease_validity. PMID:29302266 (single heterozygous variant) and PMID:35946480 (abstract without genotype) were read and deliberately not used as evidence. The ELAC2 prostate-cancer susceptibility association is mentioned in notes only. Validation: just validate, validate-terms, count-verified-snippets (80/80), the CLAUDE.md offline gates, and just validate-disorders.

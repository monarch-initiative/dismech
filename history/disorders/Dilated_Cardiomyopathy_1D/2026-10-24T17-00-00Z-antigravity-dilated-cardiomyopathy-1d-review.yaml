  summary: Review and enrich Dilated Cardiomyopathy 1D with TNNT2 molecular function grounding, diagnostic
    procedures, treatment target mechanisms, and evidence prose cleanup
  details: |
    - Grounded `TNNT2 Variant in Cardiac Troponin T` and `Decreased Myofilament Calcium Sensitivity` pathophysiology nodes with GO molecular functions (`GO:0005523` tropomyosin binding, `GO:0008307` structural constituent of muscle), cellular components (`GO:0005861` troponin complex, `GO:0030017` sarcomere), and anatomical locations (`UBERON:0001133` cardiac muscle tissue, `UBERON:0000948` heart), and added downstream links to phenotypes.
    - Marked `Dilated Cardiomyopathy` phenotype with `diagnostic: true`.
    - Added `variant_origin: GERMLINE` to `TNNT2` and rewrote the `explanation` on the sarcomere-class frequency evidence item to remove legacy `PARTIAL` terminology.
    - Added `diagnosis` section (`Echocardiography` and `TNNT2 molecular genetic testing`) backed by verbatim snippets from PMID:11106718.
    - Linked `Heart Failure Pharmacotherapy` and `Heart Transplantation` to pathophysiology nodes via `target_mechanisms`.

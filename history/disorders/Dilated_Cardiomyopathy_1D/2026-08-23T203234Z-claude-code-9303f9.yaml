  summary: 'Create: Dilated Cardiomyopathy 1D (TNNT2)'
  details: |
    Curated CMD1D (TNNT2, MONDO:0011095; ClinGen Definitive). The functional separation from the TNNT2 hypertrophic entity (CMH2) is measured rather than inferred: in one experimental system the dilated alleles DeltaK210 and R141W decreased the calcium sensitivity of force generation while the hypertrophic allele R94L increased it; both sides curated as evidence on the effector node. Also preserves that the two dilated alleles lie in different parts of the molecule yet desensitize equally, so direction of the calcium shift rather than variant location tracks with phenotype - no domain rule asserted. Conforms to cardiomyopathy_maladaptive_remodeling. Stub deleted; added to grouping. 11 snippets verified.

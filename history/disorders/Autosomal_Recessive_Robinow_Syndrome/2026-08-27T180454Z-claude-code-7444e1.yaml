  summary: 'Create: Autosomal Recessive Robinow Syndrome (ROR2)'
  details: |
    Split out of the lumped Robinow_Syndrome entry, covering row NOS 15-0090. The richest of the set: the Ror2-null mouse resolves the syndrome into four separate developmental lesions at four sites, and each is curated as its own node with its own phenotype edges rather than collapsed into one growth-failure claim. Two molecular routes to absent receptor are distinguished, nonsense-mediated decay of truncating transcripts and endoplasmic-reticulum retention of missense protein, with whole-exon deletions cited as corroboration that the mechanism is loss of function. Brachydactyly type B is a differential rather than a subtype, on the positional separation of the two allele classes at the same locus. A HUMAN_MODEL_MISMATCH discussion records that Ror1 partially compensates in the single-mutant mouse the decomposition was done in. Both connectivity metrics 100 percent.

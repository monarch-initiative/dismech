  summary: Review ROR2-related Robinow syndrome using clinical and mechanistic full texts
  details: 'Reviewed the existing ROR2-related Robinow syndrome entry (MONDO:0009999; OMIM:268310), which
    had CREATE history but no REVIEW. This Mendelian condition is eligible for the review sweep excluding
    infectious and environmental diseases/poisonings. Began from origin/main 6345831563e after rebase;
    checked for overlapping open ROR2/Robinow PRs and found only distinct dominant Robinow entries.


    Corrections and clinical coverage:

    Removed a WNT5A case (PMID:41477475) from ROR2 evidence. Qualified universal homozygosity, complete
    receptor absence, uniform ER retention, purely positional ROR2 genotype-phenotype rules, and categorical
    endocrine assumptions. Corrected low frequency bands for vertebral/rib anomalies and scoliosis. Mined
    the newly recovered 2022 cohort tables for the common craniofacial, oral, limb, genital and other
    manifestations. Added specific cardiac, renal, dental and developmental findings from the full GeneReviews
    chapter. There are 75 phenotype records; overlapping broad and specific findings are not independent
    prevalence estimates. Variable assessment denominators, uncertain female-genital percentages, and
    the table/discussion discrepancies for scoliosis and clinodactyly are preserved. Developmental delay
    uses the broader neurodevelopmental-delay term rather than asserting global delay.


    Mechanistic and genetic review:

    Separated transcript loss, trafficking failure, noncanonical signaling, presomitic mesoderm, somitogenesis
    and the distinct developmental tissue defects. The 2024 iMEF assays show residual signaling and surface
    expression for R189W/R272C; the 2012 paper distinguishes Ror-dependent signaling from core PCP phenotypes.
    Removed the unqualified PCP process annotation. Added three signaling/localization cell systems plus
    the 2023 marrow stromal-cell study, retaining its incomplete cell provenance and provisional human
    relevance. The sphingomyelin and anti-Frizzled results are cell experiments, not demonstrated treatments.
    Added the Ror1/Ror2 double-null animal comparison with its genotype and species limitations. Eleven
    representative variants cover missense, nonsense, frameshift, initiation, intronic and deletion contexts.
    The 2022 automated classifications are dated to the source and VUS remain uncertain, including Arg302Cys
    despite later cell assays. Historical Arg441 versus transcript-specific Arg442 nomenclature is not
    silently harmonized.


    Care and diagnostics:

    GeneReviews supplies exact evidence across clinical characteristics, molecular diagnosis, management
    and counseling. Added orthodontics, cleft repair, urologic reconstruction, hCG with the limits of
    the small combination-treatment series, scoliosis/dental surveillance, cardiac/renal follow-up, baseline
    imaging and perioperative assessment. Counseling qualifies the usual 25% recurrence calculation by
    parental genotype and recognizes possible heterozygous brachydactyly. Three monitoring descriptors
    remain unbound because the pertinent NCIT monitoring/follow-up terms are outside the current TreatmentActionTerm
    subtree; no inaccurate intervention binding was substituted.


    Source consumption:

    Read the original entry and CREATE record and all eight original cached sources. Refreshed abstract-only
    records using just fetch-reference. Read the full scientific body, methods, figures and recovered
    Tables I/II of PMID:35344616; the full scientific body/methods/figure legends of PMID:38780011; the
    full GeneReviews clinical, diagnostic, management and counseling sections via its sites/books URL;
    the full scientific body, methods and figures of Ho 2012 from the author''s Harvard PDF; and the complete
    scientific body/methods/results/figure legends of DOI:10.32604/biocell.2023.028851. Read the founding
    clinical abstracts and the 2007 trafficking, 2009 NMD, 2009 gradient and 2024 prenatal abstracts.
    The 2004 mouse publisher page and 2009 gradient publisher PDF returned HTTP403; their abstract support
    is not represented as full-text consumption. Canonical GeneReviews HTML/PDF fetches returned recaptcha
    material; those failed cache artifacts are excluded, and the successful full chapter cache is included.
    No reference cache was hand-authored or patched.


    The RCSB deposition confirms 9FSE is the 2.48-Angstrom wild-type human ROR2 CRD-Kr structure associated
    with PMID:38780011. The generic dataset verifier has no pdb resolver, so the deposition was checked
    directly and generated into references_cache with just fetch-reference. Its URL is used as the resolvable
    dataset identifier. The 2023 BMSC paper makes its data available on request and supplies no public
    accession. No retired shared accession cache was read or restored. ClinicalTrials.gov condition search
    for Robinow syndrome returned zero; the two ROR2 hits were oncology trials (NCT03393936 and NCT03504488),
    not Robinow interventions.


    Research cross-check and completeness:

    No exact ROR2 deep-research artifact was present. The separate dominant WNT5A report and its citation
    list were read for disease boundaries; its gene-specific cases and growth-hormone report were not
    imported as ROR2 evidence.

    1. Phenotypes: adequate; all common cohort findings are represented, with rare lesion subtypes and
    uncertain denominators handled conservatively.

    2. Subtypes: adequate; this entry is the ROR2 disease, distinct from NXN and dominant WNT5A/DVL forms.
    No new ROR2 severity subtypes are warranted.

    3. Pathophysiology: adequate; receptor, developmental and provisional osteogenic mechanisms plus functional
    models are represented. Quantitative transfer from mouse and cell experiments remains unresolved.

    4. Treatments/trials: adequate; full clinical baseline mined. No disease-specific registered trial
    identified by the stated search; model rescue is not clinical efficacy.

    5. Genetics: adequate; inheritance, variant classes, representative genotypes, VUS and allele-dependent
    functional evidence are represented. Exploratory small-cohort genotype associations are not promoted
    to reliable prognosis.

    6. Diagnostics: adequate; clinical/radiographic recognition, prenatal testing, biallelic confirmation,
    copy-number awareness and organ evaluation are covered. No diagnostic signaling biomarker is asserted.

    7. References: adequate; high-value newly recovered full texts are consumed. Inaccessible older full
    texts are a non-blocking source limitation, with claims limited to their available abstracts.

    8. Overall: no blocking content omission identified. The record now has 10 mechanism nodes, 75 phenotypes,
    11 variants, 10 care actions, 6 diagnoses, 4 experimental models, 2 animal models and the structural
    dataset.


    Validation: schema/ontology/reference checks, exact-snippet audit and two scoped data tests run locally;
    final results and independent PR review recorded in the PR. Reference titles and disease relevance
    inspected. New-history scaffold corrected to the actual Codex actor before publication.'

  summary: Connect supported Robinow developmental phenotypes and refine annotations
  details: |
    Follow-up to independent review of PR 12994. Added 18 indirect developmental links: nine craniofacial/oral findings, five limb findings, thoracic vertebral fusion, hypospadias, and two specific renal lesions. These extend existing mouse-to-human developmental hypotheses and explicitly retain unresolved intermediates. Macrocephaly, cryptorchidism and labial hypoplasia remain unlinked: the cited midline/tubercle experiments do not establish the specific processes responsible for those findings, and labioscrotal or urogenital-fold derivatives should not be equated with genital-tubercle tissue. Unrelated organ findings likewise remain unlinked.
    Replaced generic chondrocyte binding with verified CL:1000217. Moved 9FSE to the mechanism-level pdb_structures slot for structural visualization. Added source-dated clinical significance and physical variant classes for all eleven variants, preserving VUS and caveats; added the R366W functional effect and supporting assay evidence. Expanded the trigger allele types to include initiation and splice-region alleles. Added hCG peptide and orthodontic-device modalities. The micropenis therapies already carry target_phenotypes; target_mechanisms was not used for a phenotype or to imply that hormone therapy repairs the ROR2 developmental lesion. Shortened long table snippets where a single sufficiently informative row was available and normalized BIOCELL snippet whitespace in the KB only.
    The CAH differential was removed because its only supporting case, PMID41477475, concerns WNT5A-related dominant Robinow rather than ROR2-related disease. The revision does not claim that CAH can never enter a real-world clinical differential.
    Validation: schema, terms, 162 snippets and165 titles pass. Follow-up history, causal links, scoped tests and commit hooks are checked with this change.

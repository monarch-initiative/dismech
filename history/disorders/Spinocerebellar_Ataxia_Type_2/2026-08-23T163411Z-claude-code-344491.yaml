  summary: 'Review rounds: address ai4c-reviewer findings on SCA2'
  details: |
    Two review rounds on PR #9306, recorded together. Round 2 approved the entry.

    Round 1 raised three CRITICAL and seven IMPORTANT findings, all additive. GeneReviews
    PMID:20301452 was tagged in a references: block and all four of its sections mined:
    Clinical Characteristics (nystagmus, ophthalmoparesis, the reflex trajectory),
    Diagnosis/Testing (a new diagnosis: section with the >=33-repeat criterion), Management
    (dysarthria, dysphagia) and Genetic Counseling (50% recurrence, paternal expansion
    bias). Four missing GeneReviews phenotypes were added, taking the count from 5 to 11.

    Slowed saccades had been bound to a grouping term, HP:0000496, when HP:0000514 was
    already the node's own preferred_term - a straightforward error. Two compound
    phenotypes were unbundled into four, and the tremor term corrected from intention to
    postural, which the snippet had contradicted all along.

    The reflex finding was in genuine conflict between sources and is reconciled rather
    than adjudicated: GeneReviews reports reflexes brisk early and absent later, while
    PMID:18418684 lists early hyporeflexia. Both are curated as points on a
    stage-dependent trajectory, the latter downgraded to PARTIAL. In round 2 the entry
    went further and modelled the early half explicitly as its own Hyperreflexia
    phenotype, since a description that sets out a trajectory while modelling only its
    endpoint is internally inconsistent.

    One round-1 recommendation could not be followed as written: modifier: ABERRANT is not
    a ModifierEnum value. The intent was correct - the calcium lesion is sensitised release,
    not reduced homeostasis - so DYSREGULATED was used and the deviation stated. The round-2
    reviewer confirmed this was the right call and corrected their own prior review.

    Also added clinical_trials: (ARO-ATXN2 and ATRIL, with ARO-ATXN2 flagged as an RNAi
    rather than ASO platform so the two are not conflated) and animal_models: with three
    models carrying pathograph join points and recorded limitations.

    Round 2 approved with five non-blocking suggestions; three were taken. Trial phase and
    status are absent from the cached registry summaries, so they were confirmed against
    the ClinicalTrials.gov API - PHASE3/COMPLETED for NCT03347344 and
    PHASE1/ACTIVE_NOT_RECRUITING for NCT06672445 - and the ATRIL completion is now
    additionally evidenced from PMID:35063116's abstract, which states it. The GeneReviews
    management content is now modelled as three treatments rather than left quotable but
    unused. The two not taken - the Cuban Holguin founder prevalence and a
    nerve-conduction citation for the peripheral neuropathy node - both lack an
    abstract-quotable source among the cached references; the neuropathy node remains
    honestly flagged PARTIAL rather than propped up.

    Validation: 56/56 snippets verified under just validate-disorders, the exact CI command,
    up from 34/34 at first submission. All five ungated CI gates pass, and check-groupings
    reports all five Polyglutamine Disorders members SATISFIED.

  summary: 'Create: Spinocerebellar Ataxia Type 2 (MONDO:0008458)'
  details: |
    Created kb/disorders/Spinocerebellar_Ataxia_Type_2.yaml and added SCA2 as a fifth
    member of kb/groupings/Polyglutamine_Disorders.yaml, whose NECESSARY_AND_SUFFICIENT
    criterion already anticipated it as a candidate member.

    A Perplexity deep-research report was generated and passed the NEC preflight against
    MONDO:0008458 - ATXN2 mentioned 117 times, no rival gene, no OMIM conflict. It was
    used strictly as a lead-generation aid: no snippet, PMID or ontology term in the entry
    is taken from the report's prose. Two of the report's own sources were MalaCards pages
    for different diseases - "spinocerebellar ataxia x-linked 2" and "spinocerebellar
    ataxia 8" - so anything traceable to them was discarded. That is a source-level named
    entity confusion which a report-level preflight PASS does not detect.

    Three conformance judgements are recorded rather than left implicit. First, the module
    node "Transcriptional Dysregulation" is deliberately NOT claimed: ataxin-2 is an
    RNA-binding translational regulator, not a transcription factor, so a disease-specific
    translational-lesion node is curated instead. Second, the node "Somatic Repeat
    Expansion in Post-Mitotic Cells" of mismatch_repair_driven_repeat_instability is
    deliberately NOT claimed, because no study measuring somatic ATXN2 CAG mosaicism in
    human SCA2 tissue was identified; the nearest support, PMID:27044000, pools Huntington
    disease with multiple polyglutamine SCAs and does not isolate SCA2. That is recorded as
    an open KNOWLEDGE_GAP with a proposed experiment, while conformance IS claimed to the
    directly evidenced threshold and repeat-length-dependence nodes of the same module.
    Third, the aggregation node is curated as cytoplasmic rather than nuclear per
    PMID:10973246, with an explicit in-entry warning against "correcting" it toward the
    Huntington/SCA3 nuclear-inclusion pattern.

    MONDO:0010065, spinocerebellar degeneration with slow eye movements, is recorded as a
    skos:closeMatch rather than a has_subtypes entry. MONDO gives it no definition, carries
    an editor note reading "check this", and its OMIM xref sits in the recessive series
    while SCA2 is dominant. Per the MONDO-coverage rule, closeMatch deliberately does not
    retire the concept from the curation queue.

    Repeat-length thresholds are attributed per source rather than harmonised: STRchive
    intermediate 31-34, Elden et al. 27-33 for ALS risk, and the ARO-ATXN2 trial enrolling
    at 33 or more. The riluzole ATRIL trial is curated as a REFUTE evidence item rather
    than omitted, since the negative result is the clinically load-bearing fact.

    Validation: just validate passes all three stages, reporting "Snippets checked: 34/34
    verified against cached references". All 20 newly cited PMIDs were fetched with just
    fetch-reference; no cache file was hand-written. One snippet had to be re-chosen
    because bracketed spans such as the Q58 designation in "ataxin-2[Q58]" are stripped as
    citation markers before substring matching.

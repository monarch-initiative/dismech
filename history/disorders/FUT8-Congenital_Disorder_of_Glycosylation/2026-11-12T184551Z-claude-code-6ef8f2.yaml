  summary: 'Create: FUT8-Congenital Disorder of Glycosylation'
  details: |
    New entry for MONDO:0020775 (FUT8-CDG, CDGF1), curated from the stub of the same MONDO term, which this change deletes. Sources: the two Ng et al. patient series (PMID:29304374, abstract only; PMID:32049367, full text with the seven-patient Table 1 used for phenotype frequencies), the L-fucose twin report (PMID:33312876, full text), the glaucoma case report, a 2026 plasma N-glycomics cohort, and the Fut8 mouse and cell literature (TGF-beta1 receptor, EGFR, integrin, VEGFR-2, neurogenesis). Gene-disease validity is copied from the ClinGen Definitive AR record for this MONDO term. Ten pathophysiology nodes and 35 causal edges; all 23 phenotypes are causal edge targets, most through mouse-derived or explicitly unknown-intermediate edges, as human mechanism data are limited to the glycan defect. Death in childhood was not bound because HP:0003819 is outside the PhenotypeTerm enum; mortality is recorded on the multisystem node. Oral L-fucose is recorded as experimental with both supporting and refuting evidence. The single deep-research report is OpenScientist; its reference validation resolved 24 of 24 citations (0 unresolved), term validation resolved 27 of 30 terms with 1 obsolete (GO:0036065) and 2 unverifiable OMIM, and preflight-dr returned WARN only because EGFR, a downstream receptor of FUT8, is mentioned often. It was used as leads: three mouse papers it cited (PMID:17132494, PMID:19179362, PMID:16861703) were fetched, read and cited; its CDG-IIj synonym and its statement that all patients are homozygous were not used because the cited sources do not support them. FUT8-CDG was also added to the Congenital_Disorders_of_Glycosylation grouping (criterion satisfied via GO:0006491). Validation: validate, validate-terms, 94/94 snippets verified, causal targets, entity refs, coarse phenotypes, qualifier terms, name collisions, gene namespaces (after the online MGI lookup), snippet grading, snippet length, title snippets, reference titles, cache order and validate-disorders all pass; validate-grouping and check-groupings pass for the grouping.

  details: |
    Answered review round 1 on PR 18508. All three blocking findings were real content gaps rather than defects in what was there, and the review was explicit that none of them touched the evidence layer. Three of the four suggestions are also taken; the fourth is declined with a reason.

    The treatment finding was the one worth having. The entry carried a single treatments row saying pharmacotherapy is not established, which is accurate and, standing alone, misleading: it said what does not work and was silent on what does. Psychosocial treatment is the standard of care for this disorder and now has two rows. Cognitive-behavioural and motivational enhancement therapy, from the 2016 Cochrane review of 23 randomised trials in 4,045 participants, with the abstinence risk ratio and its interval quoted. And contingency management, voucher-based incentives for cannabis-negative urines, as its own row because it is an additive component with its own evidence.

    Both rows carry their limits as REFUTE items rather than as prose, because the limits are what a reader would otherwise get wrong. On the psychosocial row: roughly one quarter of participants were abstinent at final follow-up, and no particular intervention was consistently effective at nine months or later. Both are recorded as REFUTE against the claim that this treatment resolves the disorder, which is the claim a row naming the standard of care invites. On the contingency-management row: the single study where the twelve-month contrast favoured cognitive-behavioural therapy alone, without the added incentives. One study against five, so the row is not retyped, but it is quoted rather than omitted.

    Prevalence is two records from NESARC-III, which interviewed 36,309 US adults with a structured diagnostic instrument: twelve-month DSM-5 cannabis use disorder at 2.5 per cent and lifetime at 6.3 per cent, converted at the documented rate to 2,500 and 6,300 per 100,000. They are separate records because a period prevalence and a lifetime prevalence are different measures, and the same reported sentence carries both. A clinical_burden block takes the treatment gap from the same survey: only 13.2 per cent of people with a lifetime diagnosis had ever had professional treatment or attended a twelve-step programme. Burden is recorded as MODERATE rather than HIGH, and the rationale says why the judgement differs from the methamphetamine entry's: there the best trial result leaves most patients unhelped and nothing else works, whereas here a treatment does reduce use and the gap is in reach.

    The entry had no description, which the review was right to flag: the notes block was doing curation-decision work, which is what notes is for, and no field described the disease. The new description states the clinical picture, the prevalence, the pharmacology with its human-versus-animal asymmetry, and the treatment position.

    A genetic section is added, and the care it needed is the point. The most authoritative source, the 2023 multi-ancestry study, names no gene in its abstract, so binding CNR1 as a susceptibility gene on its strength would have been the careless version the review warned against; CNR1 is bound twice in the pathophysiology as a node gene and is not a GWAS hit this entry can cite. The row is CHRNA2 instead, from the 2019 study that names it, typed SUSCEPTIBILITY rather than CAUSATIVE because the finding is a replicated common-variant association whose index variant is an expression quantitative trait locus rather than a coding change. No variant is bound and no functional impact category is set, since an eQTL has no protein consequence to describe.

    Two things guard that row against being read as more than it is. The second reference is cited on the same row so a single-gene entry cannot stand in for a polygenic architecture: 22 genome-wide significant loci in European ancestry alone, further loci unique to African, East Asian and admixed American ancestries, and common-variant heritability detected in every population the study was powered for. And CHRNA2 is deliberately kept out of the pathophysiology, because no cited source connects a nicotinic alpha-2 subunit to any mechanism this entry models, and wiring it in to tidy the pathograph would assert a route nothing supports. The twin heritability range, 51 to 70 per cent, is graded BACKGROUND, because the citing paper restates it from earlier work in its introduction rather than measuring it.

    Two suggestions about binding precision are taken as node-description paragraphs rather than as changes to the bindings, because in both cases the binding is already the most specific available and the loss is in what the graph can express. The cortical downregulation node now records that GO:0004949 cannabinoid receptor activity stands in for a density measurement, that density and activity are not the same quantity, and that no receptor-availability term was found. The accumbens node records that UBERON:0001882 is bound for both the accumbens shell and the ventral striatum, so the shell-versus-core distinction its prose rests on is not queryable, and the two nodes are indistinguishable by anatomy in the graph.

    The diagnosis-block suggestion is declined rather than deferred. No NCIT diagnostic-procedure term that fits a DSM-5 structured interview is in cache/ncit/terms.csv, a CURIE may not be typed into a binding from memory, and the DSM-5 threshold is already quoted where it does work, on the withdrawal node, so a diagnosis row would duplicate that without adding anything sourceable. This is the same reasoning the nicotine entry recorded for leaving diagnosis measurements unbound for want of a LOINC code.

    The deep-research item is unresolved rather than answered. The OpenScientist run launched before this PR opened was still running after about eighty minutes when this round was prepared, so nothing from it is committed and no claim in the entry derives from a provider. Two earlier OpenScientist runs in this session failed at report generation at around a hundred minutes. If this one returns answer_status: unsuccessful it will not be committed, because scripts/check_unsuccessful_research.py gates that marker and it is what turned PR 18480 red earlier.

    50 of 50 snippets verified, up from 34. Every one of the sixteen new candidates was checked with SupportingTextValidator.normalize_text before being written, and every new explanation was read back against its own snippet.

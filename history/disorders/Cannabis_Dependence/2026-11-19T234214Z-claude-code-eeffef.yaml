  summary: 'Create: Cannabis Dependence (MONDO:0005689)'
  details: |
    De-novo curation of Cannabis Dependence (MONDO:0005689), the fourth and last substance-dependence entry in this batch, after nicotine, cocaine and methamphetamine. Eight pathophysiology nodes, three conformance links against addiction_cycle, three phenotypes all causally connected, one treatment row recording an absence, one EMERGING hypothesis and two discussions. Nine references, 34 of 34 snippets verified.

    What makes this entry different from its three siblings is not a different route to a strong dopamine signal but the weakness of the human signal itself. In cocaine and methamphetamine dependence the rise in synaptic dopamine is large and uncontested. Here the animal result is clear, from microdialysis in freely moving rats; the human result is a pooled re-analysis of two raclopride studies finding about a three and a half per cent reduction in binding confined to limbic striatum and nothing elsewhere; and the same paper introduces itself by noting that earlier human imaging of the question had been inconsistent. The chronic finding then runs the other way, as blunted reactivity rather than elevated release. The entry records that asymmetry rather than smoothing it: the accumbens node is marked PROVISIONAL and carries a human and an animal item that do not agree in magnitude, and a CONTROVERSY discussion states the open question as one of weighting rather than of fact.

    Two mechanistic features were found by reading rather than assumed. The dopamine effect of delta-9-tetrahydrocannabinol requires mu1 opioid receptors in the ventral tegmentum, not the cannabinoid receptor alone: infusing naloxonazine there abolishes it, and abolishes heroin's effect too, which is the sense in which the two drugs share a final step. No stimulant sibling needs an opioid receptor, so that is the clearest mechanistic difference in the batch, and it has its own node. And the CB1 downregulation of chronic use is selective to cortical regions rather than striatal, and reverses within about four weeks of monitored abstinence, so it is an adaptation outside the reward pathway rather than a lesion within it. Both facts would have been wrong in the version of this entry I had planned from memory.

    Three source problems were caught before writing, each by reading the abstract rather than trusting a prior note.

    The first was a reference earmarked for a claim it does not make. My prep recorded PMID:23108546 as the source for THC disinhibiting ventral tegmental dopamine neurons through GABAergic interneurons. Its abstract is about endocannabinoids as metabolic and homeostatic signal detectors and their anti-addicting properties in relapse prevention, and never states that mechanism. It is not cited. The replacement, PMID:12099913, establishes the step for CB1 activation and carries three caveats that are recorded rather than glossed: the agonist is WIN55212-2, a synthetic mixed CB1/CB2 agonist and not THC; the preparation is rat coronal midbrain slices, which is IN_VITRO under this repository's ex-vivo rule and not MODEL_ORGANISM; and the dopamine consequence is the authors' conditional inference, quoted with its "would" intact, not a measurement.

    The second was a famous paper that does not cover this drug. PMID:2899326, Di Chiara and Imperato, is already cached in this repository and is cited by both the cocaine and the methamphetamine entries for the preferential mesolimbic dopamine rise. Its drug list is opiates, ethanol, nicotine, amphetamine and cocaine. It says nothing about cannabinoids. It was the obvious reach for this entry's dopamine node and citing it would have been Named Entity Confusion arriving through a paper already in the cache, which is the hardest version of that error to notice. PMID:9197269 is cited instead.

    The third was a direction that is not in the source. PMID:15514394 reports "appetite change, weight loss, and physical discomfort" among frequent withdrawal features. Appetite change carries no direction, so no decreased-appetite phenotype is bound from it; weight loss is explicit and is bound. More generally, neither withdrawal source enumerates the seven DSM-5 criterion symptoms in the text available here, so the entry binds one withdrawal phenotype rather than reconstructing a criterion list, and a KNOWLEDGE_GAP discussion records what closing that would need. This is the methamphetamine round-1 failure avoided at the point where it was made rather than at review: there a withdrawal node was built from a paper's aims and bound the opposite phenotype to what its results reported.

    Every one of the 34 snippets was verified with SupportingTextValidator.normalize_text against its cached body before being written, and every explanation was read back against its own snippet rather than against the paper as a whole. That second check is what the methamphetamine entry needed four review findings to install. Two snippets were extended rather than left as found, because the five-word floor is a word count and not a test of whether a quote asserts anything: the CB1 recovery quote now carries its four-week timescale, and the withdrawal-prevalence quote now carries the threshold it is a prevalence of.

    One claim is deliberately absent with its reason recorded. No ICD-10-CM mapping is given, although the sibling nicotine entry has one: no code for cannabis dependence is in cache/icd10cm/terms.csv, the MONDO term returns no database cross-references through the OLS entity endpoint, and a code may not be written into a binding from memory. MONDO holds only two cannabis concepts, so unlike the cocaine entry there is also no abuse term to map; cannabis abuse is a synonym here rather than a sibling, and mappings is empty.

    Two conformance findings were repaired by curation rather than left as reports. The accumbens node bound no cell type where its module node binds dopaminergic neuron, and it was a dead end with no downstream edge. The cell type is now bound. The edge now runs to the blunted-reactivity node, marked INDIRECT_UNKNOWN_INTERMEDIATES and scoped to the entry's hypothesis group, because no cited study measured the transition from repeated acute release to the chronic blunted state: the blunting is observed cross-sectionally in people who already use cannabis, and its correlation with addiction severity is equally consistent with the blunting preceding the use. Scoping the edge to a hypothesis group is what keeps it distinguishable from the sourced steps above it. The remaining finding is anchor_no_process, where the module node binds no process and there is nothing to compare.

    Treatment is one row that records an absence. The 2025 Cochrane review of 37 randomised trials in 3,201 participants found abstinence no more likely with tetrahydrocannabinol preparations or N-acetylcysteine than with placebo and concluded that these pharmacotherapies should still be considered experimental. The row carries no therapeutic_agent, because there is no established agent to name.

  summary: 'Update: Syphilis - address pre-PR red-team review'
  details: |
    Addressed an adversarial pre-PR review of the Syphilis entry. The review confirmed zero fabricated evidence - all 55 snippets were genuine exact substrings - but found four classes of real problem, all now fixed.

    Evidence that validated but did not argue. Eight evidence items were title-scraps or stage-anchors such as the bare strings secondary syphilis, neurosyphilis, primary syphilis, and prenatal care providers. These were technically valid substrings that supported nothing. All were replaced with substantive quotes already present in the cached sources, chiefly the CDC 2021 STI Treatment Guidelines full text which had been mined for only eight sentences out of 1.1 MB. Where no cited source actually described a phenotype - alopecia, syphilitic hepatitis, glomerulonephritis, cutaneous gumma morphology - the evidence item was removed entirely and replaced with a notes field stating that the phenotype is curated as unevidenced description rather than propped up by a stage-level quote that does not mention it.

    Frequency band corrected. Aortic aneurysm carried FREQUENT on the basis of a 71 percent figure whose denominator was published cardiovascular-syphilis case reports, not patients with syphilis. The previous explanation documented that mismatch and asserted the band anyway, which is precisely what the frequency-evidence guidelines forbid. The band is removed, the figure and its denominator moved into the description. Conversely, three phenotypes gained defensible bands: meningitis, uveitis, and sensorineural hearing impairment are now VERY_RARE on the basis of a genuine population denominator - 1.1, 1.1 and 0.4 percent of 41,187 surveillance cases.

    Pathograph connectivity. The graph was 24 percent connected: 13 of 17 phenotypes had no incoming causal edge, and both the gumma and congenital arms terminated in mid-air. Added the missing edges throughout - endarteritis to chancre, secondary dissemination to its six mucocutaneous and visceral phenotypes, sanctuary-site invasion to ocular and otic disease, the gumma node to cutaneous granuloma and ulcer, and transplacental dissemination to the six congenital phenotypes. Also gave the Th1 node an incoming edge, since nothing previously caused it. Connectivity is now 100 percent.

    Node split. Meningovascular and Parenchymal Neurosyphilis bundled two mechanistically distinct entities with different timescales, and the bundling made an incoming edge wrong: obliterative endarteritis does not cause general paresis or tabes dorsalis. Split into Meningovascular Neurosyphilis, fed by endarteritis and producing stroke and meningitis, and Parenchymal Neurosyphilis, fed by sanctuary-site persistence and producing dementia and sensory ataxia. Each now carries its own CDC quote giving its timing.

    Granuloma conformance earned rather than asserted. The gumma node declared conformance to granuloma_formation but contained none of the module's content and cited a syphilitic aortitis quote justified by calling aortitis the microgumma equivalent - a curator-invented equivalence appearing in no source. Added the epithelioid and giant-cell content and GO:0000768, added the downstream edges, removed the mismatched citation, and added a note stating plainly that the giant-cell content is asserted from the module pattern rather than from a verified quote.

    Missing slots and content. Added classifications, stages with all six clinical stages including the early versus late latent distinction that previously survived only as prose inside a node description, progression, and prevalence. Added condylomata lata and four early congenital phenotypes - rhinitis, hepatosplenomegaly, periostitis - which had been absent despite congenital syphilis being modelled. Added CSF examination to diagnosis, the test that actually governs neurosyphilis management. Added doxycycline post-exposure prophylaxis as a treatment: the previous entry deferred it in notes for want of a citation, but the reviewer correctly pointed out that one PubMed lookup resolves it - PMID:38833414, the 2024 CDC doxy-PEP guideline - which is now fetched, cached, and cited.

    Ontology bindings tightened. Stroke to HP:0002140 Ischemic stroke, Ataxia to HP:0010871 Sensory ataxia, Aortic aneurysm to HP:0012727 Thoracic aortic aneurysm, Hutchinson teeth to HP:0006482 Abnormal dental morphology, gumma to HP:6000070 Cutaneous granuloma with a separate Skin ulcer phenotype for its breakdown. Serology diagnosis terms moved off the generic Laboratory Procedure to NCIT:C74716 Rapid Plasma Reagin Measurement and NCIT:C132388 Treponema pallidum Antibody Measurement; histopathology to NCIT:C35984 Lymphoplasmacytic Infiltrate. Penicillin gained NCIT:C47657 Penicillin G Benzathine alongside benzylpenicillin, since the depot formulation is the clinical point. Condylomata lata is curated with a free-text preferred_term and no binding, because HPO has no term for it or for the chancre - flagged as a new-term request candidate rather than forced onto an inaccurate term.

    Also fixed: the transplacental transmission claim conflated gestational age with maternal stage; it now matches the source, which attributes risk to maternal stage. Doxycycline dosing is now evidenced by the sentence that actually gives the regimen. Plasma cell was removed from the Th1 node, which makes no humoral claim.

    Metrics: snippets went from 55 of 55 to 75 of 75 verified, all exact. Pathograph connectivity 24 percent to 100 percent. Compliance moved from 81.2 to 74.6 percent - this is a denominator effect, not a regression: the absolute score rose from 151 to 191 while the check count grew from 186 to 256 as the new slots were added.

    Validation: just validate passes for schema, terms, and references; validate-graphs reports no dangling causal targets; all four conforms_to references resolve.

  summary: 'Create: Syphilis'
  details: |
    De-novo curation of syphilis, MONDO:0005976, Treponema pallidum subsp. pallidum, NCBITaxon:161. The KB already covered the three endemic treponematoses - yaws, bejel, pinta - but not the venereal member of the family.

    Deep research: claude_code provider via just research-disorder claude_code Syphilis. 18 web searches, 21 turns, 52 citations, about 6 minutes. The report was treated as leads only: every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached text.

    DR errors caught and corrected. The report proposed MONDO:0005097 as the disease term; that CURIE is squamous cell lung carcinoma. The correct term MONDO:0005976 was resolved with OAK. The report also emitted a malformed taxon identifier, NCBITaxon:160rest; the correct venereal subspecies taxon is NCBITaxon:161. Both corrections are recorded in the entry notes. Separately, the pre-edit validation hook caught an incorrect HPO binding of my own: HP:0500009 is Dysplastic gangliocytoma of the cerebellum, not genital ulcers, which is HP:0003249.

    NEC preflight: the report consistently and explicitly distinguishes venereal syphilis from yaws, bejel, and pinta and names the correct subspecies throughout, so there is no named-entity confusion with the sibling treponematosis entries already in the KB.

    GeneReviews: not applicable. A PubMed search returned no chapter, as expected for an acquired infection. Inheritance is deliberately not modelled - congenital syphilis is vertical transmission, not a Mendelian pattern - and this is stated in notes.

    Content: 16 pathophysiology nodes forming the chain inoculation, early dissemination, sanctuary-site invasion, secondary dissemination, latency, and the tertiary arms of gumma, aortitis, and neurosyphilis, plus transplacental fetal dissemination. Two immune-evasion nodes carry the central mechanistic theme: the LPS-free, PAMP-poor stealth outer membrane, and TprK antigenic variation by segmental gene conversion. Obliterative endarteritis is modelled as a single node feeding chancre, gumma, and aortitis, since one vascular lesion explains disease in otherwise unrelated organs.

    Four module conformances, all verified to resolve: granuloma_formation for the gumma as a delayed-type hypersensitivity granuloma; bacterial_cell_wall_synthesis_inhibition for the penicillin PBP target, matching the pattern already used by Bejel and Pinta; and both bacterial_protein_synthesis_inhibition nodes - the ribosome as drug target and, distinctively, Ribosomal Target Resistance for the 23S rRNA A2058G macrolide resistance that makes azithromycin unreliable in syphilis while it remains a mainstay of mass treatment in the endemic treponematoses. That resistance node is the sharpest mechanistic contrast between this entry and its endemic siblings.

    Also curated: 17 phenotypes with HPO bindings, three diagnosis entries covering nontreponemal serology, treponemal serology with the reverse sequence algorithm, and lesion PCR, four differential diagnoses, six treatments including penicillin desensitization in pregnancy and anticipatory counselling for the Jarisch-Herxheimer reaction, one histopathology finding, two environmental risk factors, and two KNOWLEDGE_GAP discussions with proposed experiments.

    Evidence discipline: frequency bands are asserted only where a quantitative source exists. Aortic aneurysm carries FREQUENT from a 71 percent figure, with the explanation stating explicitly that the denominator is patients with syphilitic aortitis rather than all patients with syphilis. Several stage-level phenotypes are marked PARTIAL because the guideline snippet anchors the stage rather than the individual sign. Four well-known claims are named in notes as deliberately not asserted for want of a citable abstract: the 2024 doxy-PEP recommendation, the 15-40 percent progression figure, stage-specific transplacental transmission probabilities, and congenital syphilis surveillance counts.

    Validation: just validate passes for schema, terms, and references; 55 of 55 snippets verified against cached references; just validate-graphs reports no dangling causal targets for this entry; all four conforms_to references resolve to real module nodes; compliance 81.2 percent global and 81.4 percent weighted.

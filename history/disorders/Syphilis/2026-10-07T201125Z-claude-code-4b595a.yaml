  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Bound measurements on all four diagnosis rows: reagin antibody presence and titer in serum (LOINC:22461-8, LOINC:11084-1) on the nontreponemal row, Treponema pallidum antibody in serum (LOINC:22587-0) on the treponemal and reverse-sequence row, T. pallidum DNA by NAA (LOINC:41163-7) on the lesion PCR row, and CSF-VDRL (LOINC:5290-2) on the neurosyphilis row. Added CDC 2021 STI guideline evidence (PMID:34292926, already cited) for the traditional algorithm, the reverse sequence reflex steps, the fourfold titer change as the smallest significant difference and as the treatment-response criterion, and direct molecular detection. The fourfold criterion is in the description, not reference_ranges, because it is a ratio between two titers and cannot be a band on one titer code. Pre-existing PARTIAL explanation on the PCR row left unchanged.

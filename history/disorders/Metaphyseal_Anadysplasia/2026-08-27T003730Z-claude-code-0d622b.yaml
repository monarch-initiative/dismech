  summary: 'Create: Metaphyseal anadysplasia'
  details: |
    Curated to complete ISDS Nosology group 11, rows NOS 11-0100 (MMP13, dominant) and 11-0110 (MMP9, recessive). Pathograph separates the two molecular routes - dominant MMP13 prodomain autoactivation causing a double MMP13/MMP9 deficiency versus biallelic MMP9 loss - and converges them on failed metaphyseal matrix remodelling and the regressive growth-plate lesion. Records an open knowledge gap on why a constitutive protease deficiency produces a lesion that resolves in childhood. 42 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

  summary: Fix snippet-grading divergence on PMID:19615667
  details: |
    just check-snippet-grading failed with 6 findings: five evidence items quoted the same PMID:19615667 abstract sentence, or a sub-span of it, and graded it both HUMAN_CLINICAL and IN_VITRO. Regraded the three IN_VITRO items to HUMAN_CLINICAL. That is the correct direction rather than the reverse: the cached record is abstract-only, so the mechanism cannot be re-quoted from a separate in-vitro sentence, and the quoted sentence is the paper's cohort genotype-phenotype result, on which the inheritance-mode and recurrence-risk claims also rest - grading it IN_VITRO would mis-grade those. The transfection provenance of the double-deficiency clause is now recorded in the explanation fields, where the reader needs it. Deep-research provenance for this tranche, recorded here at reviewer request so it is durable rather than living only in a PR comment: the ten ISDS group 11 and 12 entries in PR 9744 were curated directly from primary literature, not from a deep-research provider sweep, which is why research/ contains no artifact for any of them. The disease list was not discovered but enumerated - it is the membership of Table 1 groups 11 and 12 of the ISDS Nosology 2023 revision (PMID:36779427), and the curation task was to cover every row. Sources were reached from each row's gene and OMIM number via PubMed. Retrospective DR artifacts would be provenance fiction, so none were generated.

  summary: Correct evidence_source on the drug-screen item and three grading calibrations
  details: |
    Review-response pass on PR 9757, correcting an evidence_source error I made and three calibration items I had already agreed with. The blocking item: the sole evidence on the erythromycin influences_mechanisms link was graded HUMAN_CLINICAL. It is not a human study. I verified the reviewer's claim against the cached full text rather than accepting it: the methods say sixty-three drugs were screened in isotopic uptake studies in HEK293 cells expressing SLC19A2, and the second half of the quoted sentence, predicted to inhibit at clinically relevant unbound plasma concentrations, is an FDA fu-times-Cmax over IC50 calculation across literature pharmacokinetics rather than an observation. The word clinically qualifies the concentration threshold, not the study design. Regraded IN_VITRO with that reasoning recorded in the explanation. The decisive internal evidence is that this same file already grades the sibling result from the same methods section of the same paper as IN_VITRO, so one paper carried two classifications for one assay. Worth recording why no gate caught this: check-snippet-grading is keyed on the quoted sentence, so it detects the same sentence graded two ways but cannot detect two different sentences from one methods section being graded inconsistently. Also applied three calibrations agreed in earlier rounds. The variant-class summary sentence was regraded HUMAN_CLINICAL to OTHER because it is a Discussion-section summary of prior reports, the same construct this entry already grades OTHER for two other clauses. The two domain-level GeneReviews items backing Seizures and Stroke went SUPPORT to PARTIAL because the quoted sentence names neurologic manifestations as a managed domain, which is broader than either specific claim, and the entry already applies exactly that reasoning to the erythromycin EHR item. The pregnancy treatment modality went BEHAVIORAL to OTHER because glycaemic control in a TRMA pregnancy is usually insulin-mediated, and CLAUDE.md warns specifically against reading supportive-care terms as dietary. Note the deliberate contrast with sibling PR 9756, where BEHAVIORAL is correct for an avoidance instruction: same NCIT action term, different modality, and the discriminator is whether the intervention is a chemical or a change in what the patient does. Validation: schema and terms pass, 41/41 snippets verified, entity-refs and duplicate-keys pass, snippet-grading reports no new divergences, environmental-evidence clean against the current origin/main baseline.

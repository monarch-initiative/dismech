  summary: 'Follow-up #9787: wire extra-triad phenotypes into the pathograph, megaloblastosis
    model link, prevalence, histopathology'
  details: |
    Clears the remaining TRMA items deferred from PR #9757 review and tracked in issue #9787.

    Two of the four checklist items were already satisfied on main and needed no change. The supports SUPPORT to PARTIAL regrade on the domain-level GeneReviews evidence for Seizures and Stroke is already PARTIAL in both blocks, and the pregnancy treatment already carries therapeutic_modality OTHER rather than BEHAVIORAL. Both were evidently applied before #9757 merged. Verified against origin/main rather than assumed.

    pathophysiology: wired the five extra-triad phenotypes into the pathograph as downstream edges from Intracellular Thiamine Pyrophosphate Deficiency - Cardiac Rhythm Disturbance, Seizures, Stroke, Optic Atrophy, Retinal Dystrophy. Phenotypes are first-class graph nodes (graph.py line 319), so no new pathophysiology nodes were needed. All five use INDIRECT_UNKNOWN_INTERMEDIATES, matching the three triad edges from the same node: the cofactor requirement is established, the route from it to any particular organ failure is not. The node description now states that this is the branch point for the whole disease and branches wider than the triad, so a reader understands why eight edges leave it. Confirmed via build_causal_graph that all eight resolve with no dangling edges.

    Separately wired Persistent Macrocytosis, which was an orphan phenotype with no incoming edge, off Impaired Nucleotide Synthesis in Erythroid Precursors. The GeneReviews evidence already on that phenotype states the anemia corrects on thiamine while the red cells stay macrocytic, so the edge is what keeps the pathograph from implying that treating the anaemia reverses the cellular defect. Not on the issue checklist; found while checking the wiring above.

    animal_models: added the third modeled_mechanisms link on the Slc19a2-null mouse, to Impaired Nucleotide Synthesis in Erythroid Precursors. The model was linked to the beta-cell and hair-cell arms but not the haematopoietic one, despite megaloblastosis being in the paper's own title. RECAPITULATES with a bone-marrow-morphology readout, direction ALTERED. Limitations record that the mouse megaloblastosis is trilineage (erythroid, myeloid, megakaryocyte) under an imposed dietary deficiency, and that whether human TRMA marrow shows the same breadth is not established by this source - so the human node stays erythroid-scoped.

    prevalence: added a CASES_IN_LITERATURE record, ULTRA_RARE, no rate. Two evidence items rather than one because the source says two separate things: 183 patients in as many families worldwide, and that prevalence and incidence remain unknown. Those are not in tension - the count is an ascertainment floor, not an estimate. Deliberately no rate_per_100000.

    histopathology: added Dysplastic Erythropoiesis with Megaloblastic Changes, from a newly fetched reference (PMID:39467528, fetched with just fetch-reference, full_text_xml). This is the section's reason to exist: the TRMA marrow mimics myelodysplastic neoplasm, and the reported patient carried an MDS diagnosis from age 26. Three evidence items cover the finding, the generalized mimicry, and the reversal on thiamine at 12 weeks - the last being what distinguishes a cofactor-supply state from a clonal lesion.

    Ontology note: bound to NCIT:C35825 Megaloblastic Erythroid Hyperplasia, which is the closest reachable fit rather than an exact one. NCIT:C206357 Dyserythropoiesis is the better label for the dysplastic component but is not reachable from any HistopathologyFindingTerm source node; NCIT:C82929 Megaloblastoid Changes Present is reachable but megaloblastoid is conventionally the hedged form of the word while the source says megaloblastic. Recorded in the block's context field. Both cache/ncit/terms.csv and cache/enums/histopathologyfindingterm_b0babf2f7c57.csv were seeded by running just validate-terms, not hand-written.

    treatments: added the missing therapeutic_modality OTHER on Audiological and Metabolic Surveillance, matching the pregnancy treatment and the surveillance house pattern.

    Review follow-up (PR #9909). Two blocking items and two suggestions.

    Blocking: diagnostic: true on the new histopathology block contradicted the block
    itself. The schema defines the slot as pathognomonic or highly diagnostic, while the
    block's own description says the finding misdirects the diagnosis toward MDS, and its
    source is titled "...Mimicking Myelodysplastic Neoplasm". Set to false, with the
    reason stated in the description: a finding that disguises a disease cannot be
    pathognomonic for it.

    Blocking: added ring sideroblasts as a second histopathology entry, bound to
    NCIT:C35995 (Ring Sideroblasts Present), reachable via NCIT:C36289 - confirmed with
    runoak and then with just validate-terms, not assumed from the neighbouring term.
    This is the other half of the MDS mimicry and arguably the more misleading half,
    since ring sideroblasts define an MDS subtype rather than being a generic dysplastic
    change. The evidence was already sitting in the cache file the first commit added,
    in the sentence that names the mimicry as the reason distinguishing the two is hard;
    the quote stops cleanly before the trailing bracketed citation marker. With both
    findings present the section shows why the mimicry is convincing, and neither entry
    needs to be labelled diagnostic.

    Suggestion taken: Persistent Macrocytosis was bound to HP:0001972 Macrocytic anemia,
    which asserts the anemia is still present - while the entire point of that phenotype,
    and of the new edge feeding it, is that the macrocytosis outlives the corrected
    anemia. Rebound to HP:0005518 Increased mean corpuscular volume, which is the finding
    actually described. Pre-existing binding, but this PR is what made it a pathograph
    endpoint. Both cache rows seeded by the validator.

    Suggestion taken: trimmed curation rationale out of four rendered description fields
    on the new edges - phrases like "both of which this link type records rather than
    papers over" and "this edge is what keeps the pathograph from implying". description
    renders on the disorder page as a claim about the disease; the modelling reasoning
    belongs here. The same reviewer raised this on three sibling PRs in this round, so it
    is a habit of mine rather than a slip.

    Suggestions noted and not acted on: the structural asymmetry between the triad
    (molecular to tissue to phenotype) and the five new arms (molecular straight to
    phenotype) is deliberate - no tissue-level mechanism is established for those arms
    and INDIRECT_UNKNOWN_INTERMEDIATES says so, so inventing an intermediate node would
    assert more than the sources do. The pre-existing Stroke phenotype still has no
    source that names a cerebrovascular event; that is a real gap but this PR did not
    author the phenotype and no cached reference here can close it.

    Validation: just validate-disorders kb/disorders/Thiamine-Responsive_Megaloblastic_Anemia_Syndrome.yaml passed, exit 0, Snippets checked: 48/48 verified against cached references. Each of the five new snippets was confirmed as an exact substring of its cache before being written, and none crosses a bracketed citation marker.

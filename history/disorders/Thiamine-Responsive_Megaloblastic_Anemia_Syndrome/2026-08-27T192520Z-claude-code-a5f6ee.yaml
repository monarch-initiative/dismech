  summary: 'Create: Thiamine-Responsive Megaloblastic Anemia Syndrome'
  details: |
    Curated TRMA/Rogers syndrome (MONDO:0009575, SLC19A2) from a claude_code deep-research report plus GeneReviews PMID:20301459, mined across all four sections. Nine pathophysiology nodes, one connected component, seven join points. The entry is built around the transport-capacity model: THTR-1 loss removes only the high-affinity uptake route, and pharmacologic thiamine works by driving flux through the residual low-affinity routes. The Slc19a2-null mouse is the decisive evidence, being normal on a high-thiamine diet and developing all three arms only on thiamine restriction. Thiamine carries three separate target_mechanisms with different effects (RESTORES on the cofactor deficiency and the anemia, MODULATES on the diabetes) and deliberately has NO link to the hearing-loss node, since the sources state the deafness is irreversible; an INTERPRETATION discussion explains the asymmetry as cell death versus cell dysfunction, since inner hair cells do not regenerate while erythroid precursors are continuously replaced. Erythromycin is curated as an environmental exposure with EXACERBATES on the transport node, with the entry noting the evidence comes from the general population rather than TRMA patients. A reference title mismatch was caught by an independent check and traced to a non-breaking space in the source title; the reference was also uncited, and is now cited for the four-patient series in which no patient's deafness resolved. Validation: 29/29 snippets verified plus an independent raw-substring re-check; schema, terms, entity-refs and duplicate-keys pass.

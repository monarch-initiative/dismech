  summary: Split and bind the extra-triad phenotypes; add pregnancy management
  details: |
    Third review-response pass on PR 9757, closing four blocking items. The most important correction is to a claim I made about a source. The Seizures and Strokes phenotype cited a clause that never names seizures or strokes, and its explanation asserted that the enumerating half of the sentence could not be quoted because bracketed citations interrupt it and the reference validator strips them. That assertion was testable and wrong: only the whole enumeration spans a bracket, while 'seizures and strokes' and 'such as congenital heart defects and arrhythmias' are each contiguous bracket-free substrings of the cached text. One grep would have shown it. This is the same unverified-negative-claim-about-a-source pattern that has recurred in this session, and it is worse here because the false reasoning was written into the entry itself, not only into a commit message. The bare three-word fragment is still unusable, but for a different and correct reason - it falls below the five-word threshold that check-snippet-length enforces - so the neurologic phenotypes are evidenced by the GeneReviews sentence naming neurologic manifestations as a managed domain, which is authoritative, bracket-free, and also closes the last unmined clause of the GeneReviews MANAGEMENT section. The cardiac phenotype now additionally quotes the arrhythmia clause directly. Seizures and Strokes was split into two phenotypes, the same objection correctly acted on for the ocular pair in the previous round, and all three new phenotypes are bound: HP:0011675 Arrhythmia, HP:0001250 Seizure, HP:0001297 Stroke. Added periconceptional and pregnancy glycaemic control as a treatment with MODULATES on Diabetes Mellitus, which matters because thiamine only modulates that arm. One process note: a first attempt at the phenotype split used index arithmetic rather than exact anchors and deleted 416 lines - every section after the last phenotype. It was caught immediately by the snippet count dropping from 36 to 22, restored with git checkout, and redone using only assert-count-one anchors. Validation: schema and terms pass, 41/41 snippets verified and 41/41 on the raw-substring re-check, entity-refs and duplicate-keys pass, all ten sections present, declared and cited references agree, check-reference-titles and check-snippet-length report no new baseline entries.

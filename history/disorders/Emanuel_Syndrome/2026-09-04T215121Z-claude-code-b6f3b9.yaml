  summary: Remove three wrongly-inferred BEHAVIORAL modalities; link treatments to
    phenotypes
  details: |
    Corrects a false statement I made on PR #10922 and takes the two non-blocking items from the approving review.

    The correction first, because it is the reason this record exists. My review-response comment on #10922 said I had dropped the mechanically-inferred BEHAVIORAL modality from the genetic-counselling treatment. That was false. No therapeutic_modality line was ever touched; the reviewer checked the diff and found all three still present, and it was right. What had actually happened is that the newly added surveillance treatment was correctly left untagged, and I reported that as though it were the removal.

    All three values were wrongly inferred and are now removed rather than changed. CLAUDE.md's mechanical-backfill table deliberately excludes generic action terms, naming NCIT:C15240 Genetic Counseling and NCIT:C15747 Supportive Care among them, because the modality of a generic action depends on what is actually being done. Counselling is an information intervention, not a behavioural one; the supportive-and-surgical entry bundles surgical repair, which is not behavioural either; and the airway precaution is a procedural constraint on anaesthesia. Absent is the honest value for all three, and the enum has no value that fits.

    Second item: treatments were four disconnected singletons. Three now carry target_mechanisms, taking the treatment half of the connectivity finding that was fixed for phenotypes two rounds ago. Multidisciplinary supportive and surgical management links to cleft palate, hearing impairment, failure to thrive and male genital abnormality, all four named explicitly in its own quoted GeneReviews management sentence. The airway precaution links to micrognathia, which is the phenotype that makes the airway difficult. Developmental and specialist surveillance links to the developmental-delay phenotype, with its description recording that surveillance detects and tracks rather than modifies, so the edge is not read as a therapeutic effect.

    Genetic counselling is deliberately left unlinked, as the review suggested: it is directed at the carrier parents and targets nothing in the affected individual. It is the one isolated node in the rebuilt graph, and that is correct.

    Validation: just validate passes with 35/35 snippets verified, unchanged since no evidence was added; validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets and check-enum-values all clean; cache diff empty. Pathograph rebuilt: 24 nodes, 25 edges (up from 19), 0 orphan targets, everything in one component except the genetic-counselling node.

    Not taken: a classifications block. That is a separate pass and the disease-classification skill covers it.

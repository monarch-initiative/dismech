  summary: 'Create: Emanuel Syndrome (MONDO:0012176)'
  details: |
    New entry for Emanuel syndrome, curated as a DISEASE. Bound to MONDO:0012176.

    Term verification changed a binding before it was written. The deep-research report gave MONDO:0009301 as the Emanuel syndrome identifier. That is wrong: OLS returns MONDO:0009301 as 46,XY sex reversal 7 with xref OMIM:233420, while MONDO:0012176 is Emanuel syndrome with xrefs OMIM:609029 and Orphanet:96170. The stub's own mondo_id was correct and the report's was not, which is a reminder that a research report's identifiers are leads even when its reference validation is clean, as this one's was (13/13 resolved, 0 unresolved).

    The reason this earns a mechanism entry rather than a malformation list is that its upstream cause is curatable as DNA structure. The t(11;22)(q23;q11.2) is the most common recurrent constitutional reciprocal translocation in humans, and it recurs because both breakpoints sit at the centre of palindromic AT-rich repeats that extrude cruciform structures and carry a measurably elevated double-strand break rate in both mitotic and meiotic cells. So the pathograph starts one step above the rearrangement, at the sequence architecture that predisposes to it.

    Five nodes: cruciform extrusion at palindromic AT-rich repeats, the recurrent constitutional translocation, 3:1 meiotic malsegregation producing a supernumerary der(22), partial trisomy 11q23-qter and 22q11, and multisystem developmental disruption from trisomic gene dosage. The balanced-translocation node is deliberately kept as its own step even though the carrier is phenotypically normal, because that silent intermediate is what separates the person carrying the lesion from the person who has the disease, and it is where recurrence risk actually sits.

    Inheritance is modelled as a balanced parental translocation with 3:1 malsegregation rather than as a Mendelian pattern, with the sex-of-carrier effect on recurrence risk and the up-to-10-per-cent risk of a liveborn affected child both cited.

    Phenotype frequencies come from the 63-individual cohort (PMID:19606488) rather than from prose, so ear pits, micrognathia, heart malformations and cleft palate carry the reported percentages and enum frequency values.

    One discrepancy is recorded rather than resolved. This entry states the cohort figure that over 70 per cent of individuals eventually learn to walk with support. Secondary summaries of the GeneReviews chapter give a much more pessimistic motor outcome, to the effect that only a small number learn to walk. That statement is not in the cached GeneReviews record so it is not cited, and the notes say so explicitly, along with the observation that the cohort was recruited through an online family support group and could plausibly be biased toward better-functioning individuals. A curator with the full chapter text should check it rather than assume the cohort figure supersedes it.

    GeneReviews baseline: PMID:20301440 is tagged and is quoted for clinical characteristics, diagnosis, management and genetic counselling; its cached record carries the structured summary sections, so quotations are drawn from those.

    Not done: no prevalence record, since the available figures are registry-based and were not verifiable from a cached source in this pass; no preimplantation genetic testing treatment entry, since the research described it but no cached reference carried a quotable statement about it.

    Validation: just validate, just validate-terms, just count-verified-snippets (22/22 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values and just check-stubs all pass.

  summary: 'Address review on PR #10922: six phenotypes, frequency band, pathograph
    connectivity, dosage-asymmetry gap'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10922. All four blocking items closed, plus two of the suggestions.

    1. Six phenotypes added, all quotable from PMID:19606488 which was already cached in the PR: hearing impairment at 72 per cent, recurrent otitis media at 96 per cent, seizures at 48 per cent, failure to thrive, visual impairment in at least a third, and male genital abnormality. The reviewer's diagnosis of the cause was right: the cohort paper's own summary sentence names vision and hearing impairment, seizures, failure to thrive and recurrent otitis media as the common findings, and none of them had been curated. Every quote the reviewer cited was verified against the cache before use, and all four matched. The ear findings are curated as two separate phenotypes rather than one because the paper reports them separately and the causal relationship between recurrent otitis and the hearing loss is plausible rather than established.

    2. Preauricular pits corrected from VERY_FREQUENT to FREQUENT. The schema puts VERY_FREQUENT at 80 to 99 per cent and FREQUENT at 30 to 79, and the snippet attached to that phenotype reports 76 per cent, so the enum value contradicted its own evidence. The three sibling phenotypes drawn from the same sentence were already correct.

    3. Pathograph connectivity fixed. The terminal dosage node had no downstream edges, so all the phenotypes rendered as orphan nodes beside a five-node chain. Fifteen bare-name downstream edges added from that node to the phenotypes. Targets are bare names, not entity references with a phenotypes prefix, which would have drawn phantom nodes silently. Verified by building the graph: 19 edges, no unresolved targets, one connected component with a single root at the cruciform extrusion node.

    4. Knowledge gap discussion added on the dosage asymmetry between the two duplicated segments, which the research report had recommended and which the previous version flattened into the statement that no single gene in either interval accounts for the phenotype. The point of the gap is that the two intervals are not equally understood: proximal 22q11 overlaps the DiGeorge and velocardiofacial critical region where dosage has been studied and where dismech already curates 22q11.2 Duplication Syndrome, while 11q23-qter has no comparable dissection. The discussion deliberately names no candidate genes on either side, including TBX1, because naming them from review literature rather than from dosage studies would manufacture exactly the symmetry the gap is about. No genetic section was added for the same reason; the reviewer's comparison to Cri-du-Chat is apt but that entry's per-gene nodes rest on dosage evidence this entry does not have.

    Suggestions taken: the mechanically-inferred BEHAVIORAL therapeutic_modality was dropped from the genetic counselling treatment, since CLAUDE.md excludes NCIT:C15240 from mechanical modality inference; and a surveillance treatment was added from the GeneReviews management sentence that was the one sub-section not previously mined.

    Suggestions not taken: no prevalence block, because the Ohye figure is not in any cached reference and no ORPHA_96170 cache file exists, so either route needs a fetch; and no mortality or prognosis record, for the same reason.

    Validation: just validate, just validate-terms, just count-verified-snippets (29/29 verified, up from 22/22), just check-duplicate-keys, just check-entity-refs, just check-causal-targets and just check-enum-values all pass, and the pathograph was independently checked for connectivity.

  summary: Take the prevalence and prognosis suggestions; correct the ascertainment
    note
  details: |
    Takes the two remaining non-blocking suggestions from the review on PR #10922. Both turned out to be answerable from PMID:19606488, whose full text was already cached in this PR and already cited nine times — so this was under-consumption of a source in hand, not a missing fetch. The previous round had recorded both as needing a fetch first, which was wrong for these two.

    prevalence: one CASES_IN_LITERATURE record on the paper's statement that over 100 individuals have been reported. Deliberately not the per-birth figure the deep-research report gave (Ohye 2014, roughly 1 in 110,000): that is in no reference cached in this repository, and notes says so, so nobody reads the case count as a rate.

    progression: one phase spanning infancy to adulthood, carrying the five deaths among 63 individuals with their ages, the surviving 58's age range, and the paper's own statement that the true infant mortality rate is unknown while long-term survival is possible. No survival estimate is asserted.

    The correction is the third item and matters more than either addition. The entry's notes said the cohort 'could plausibly bias toward better-functioning individuals' — my own speculation, stated one-directionally. The paper states both directions itself and I had not read that far: recruitment through an online support group could over-represent severely affected children, which the authors say biases toward a poorer prognosis, while the predominance of living children means the findings apply primarily to long-term survivors. Both sentences are now quoted on the progression section and the notes paragraph is rewritten to attribute the reasoning to the paper rather than to me. The motor-outcome discrepancy against the GeneReviews summaries still stands open; the two biases run in opposite directions and the paper does not net them out, so nothing here resolves it.

    One error caught by validation: I wrote a reference_title from memory for all six new evidence items and it was wrong. The cached title is 'Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals.' Corrected before commit.

    Validation: just validate passes with 35/35 snippets verified against cached references, up from 29/29; validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-title-snippets, check-snippet-length and check-snippet-grading all clean; cache diff empty.

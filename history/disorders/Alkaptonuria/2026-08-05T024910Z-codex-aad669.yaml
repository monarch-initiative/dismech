  summary: 'Publication readiness review: Alkaptonuria'
  details: |
    Independent publication-readiness review of kb/disorders/Alkaptonuria.yaml.
    Audited all claim/evidence pairs and exact snippets, and compared the entry
    with GeneReviews, the repository research artifact, IEMbase notes,
    Orphanet, ClinGen, and a current PubMed literature sweep through 2026-08-04.

    Separated HGA accumulation from oxidative pigment polymerization; added 2025
    semiquinone/NMR evidence and 2026 human-chondrocyte oxidative-stress and
    autophagy-lysosomal evidence with provisional/partial scope; removed the
    misleading broad aminoaciduria phenotype because the specific abnormality
    is homogentisic aciduria and primary literature reports normal urinary amino
    acids; removed a tautological causal edge to a biochemical readout; and
    added biological scales and chondrocyte/GO terms.

    Expanded GeneReviews-backed biochemical and molecular diagnosis,
    recurrence-risk counseling, physical/occupational therapy,
    manifestation-directed surgery, nitisinone-induced tyrosinemia dietary
    management, joint-protective activity modification, and the SONIA 2
    clinical trial. Qualified nitisinone benefit with a 2024 cohort finding
    that incident arthroplasty was not reduced. Added the Hgdaku/aku mouse while
    explicitly recording its failure to reproduce human ochronosis. Automated
    publication-review follow-up added hypothyroidism, prostate stones and
    prostatitis, thyroid and echocardiographic surveillance, thyroid replacement,
    and a queryable human-model-mismatch discussion; it also re-parented the
    chondrocyte oxidative-stress arm directly to accumulated HGA and corrected
    two animal-model reference titles. Broad nonspecific nose and nail umbrella
    annotations were explicitly scoped out because their sources supply no
    morphology or mechanism.

    Added central disease-specific publications PMID:41096940, PMID:42510554,
    PMID:38846518, PMID:39290064, and clinicaltrials:NCT01916382. Reviewed but
    did not promote small or preliminary signals such as the reported Parkinson
    association and pediatric cognitive findings because their scope and
    replication do not yet support disease-level assertions.

    Targeted schema, ontology, and history validation passed; 139/139 exact
    snippets verified; weighted compliance was 100%; cache contracts passed;
    and no Alkaptonuria phenotype was disconnected. Focused connectivity tests
    passed. Broader tests exposed only unrelated baseline failures: a missing
    SHH_Holoprosencephaly_Spectrum grouping member and short snippets in the
    COA3-Related COX Deficiency and FG Syndrome 1 records.

  summary: Ground NHS on a molecular function
  details: |
    The NHS Loss of Function node now binds GO:0044877 protein-containing complex binding (modifier DECREASED, preferred term WAVE regulatory complex subunit binding). NHS has no GO molecular function annotation in UniProt (Q6T4R5 lists only biological process terms), and its one characterised activity is binding WAVE regulatory complex subunits through its WAVE homology domain, which PMID:20332100 and PMID:42595116 describe and the entry already cites on the Loss of NHS WAVE Shell Complex node. This satisfies the gene-activity grounding gate, which requires a molecular function on the node a gene lands on. A baseline exemption was not used because that exemption is for many-gene bundles, not a single gene with a documented binding activity. The PMID:14564667 gene-identification snippet was also extended to the end of its sentence, as the reviewer suggested.

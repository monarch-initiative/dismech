  summary: 'Create: Nance-Horan_Syndrome'
  details: |
    New entry for Nance-Horan syndrome (MONDO:0010545), the X-linked disorder caused by loss of NHS (hgnc:7820). Content: X-linked inheritance bound to HP:0001417 with an explanation of heterozygous female expression; NHS genetic record with the ClinGen Definitive XL assertion and three variant records (Q39X, recurrent R373X, Xp22.13 microdeletions); a pathograph running from NHS loss of function through loss of junctional NHS-A (ZO-1 partner), loss of the WAVE shell complex and disorganised actin and lamellipodial dynamics, to lens epithelial contact disruption and to ocular, dental, craniofacial and brain developmental nodes, plus an X-inactivation node for heterozygous females; 24 HPO-bound phenotypes, 23 of them causally connected (congenital heart defect is left unconnected because no mechanism has been studied); four diagnostic approaches; three supportive treatments; and the Xcat mouse with two model-to-mechanism links. Isolated X-linked congenital cataract (cataract 40, MONDO:0010544) was kept out of this entry and its stub left in the queue: MONDO classifies it separately and the published CXN alleles alter NHS transcription rather than abolishing the protein (PMID:19414485). No GeneReviews chapter exists. The OpenScientist report (research/Nance-Horan_Syndrome-deep-research-openscientist.md) was used as a source of leads: 21 of 21 references resolved, none off topic; term validation flagged mislabelled CURIEs (for example HP:0006315 offered for screwdriver incisors, which is Solitary median maxillary central incisor; HP:0006346 was bound instead) and two obsolete terms (GO:0005913, CL:0000181), none of which were used; preflight-dr returned PASS (NHS mentioned 87 times, OMIM 302350 matches). Report citations not used: PMID:33149277 and PMID:30664714 (CYFIP2 disorders, a different disease, offered only as mechanistic analogy); PMID:23288986 (lens epithelial cell lines, not about NHS); PMID:30457727 (differential diagnosis of supernumerary teeth); PMID:36107778 (general intraocular lens versus aphakia review, no Nance-Horan content). Phenotypes the report listed but that were not added: ptosis and high myopia (no quotable source); hearing loss, axial hypotonia and foot contractures (seen only with a contiguous deletion of eight further genes, recorded in notes). PMID:42253502, a 2026 cell study proposing extracellular-matrix and mitochondrial mechanisms for two NHS variants, was read and not used because it is a single unreplicated overexpression study. Every snippet (99 of 99) verifies against the cached abstract text.

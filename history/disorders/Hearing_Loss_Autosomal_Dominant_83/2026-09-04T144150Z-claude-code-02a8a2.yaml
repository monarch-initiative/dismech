  summary: 'Review round 1: Hearing Loss Autosomal Dominant 83'
  details: |
    First review round on PR 10936, in response to the ai4c-reviewer CHANGES_REQUESTED review. All six blocking items addressed plus three of the four suggestions, in a single push. Blocking item 1: a mouse expression evidence item on genetic MAP1B was graded HUMAN_CLINICAL and duplicated the correctly graded MODEL_ORGANISM item above it; the duplicate was deleted rather than regraded, as the reviewer asked. Blocking item 2: the phenotype named Preserved distortion product otoacoustic emissions was bound to HP:0006958 Abnormal auditory evoked potentials, which asserts the opposite of the node name and made the incoming pathograph edge read backwards. The node is renamed to Abnormal auditory brainstem response with preserved otoacoustic emissions, which is what the dissociation actually is and what the HPO binding can carry; the edge target and the discussion attaches_to were updated with it. HPO genuinely has no auditory neuropathy or preserved emissions term, which is now stated in the evidence explanation. Blocking item 3: a diagnosis block was added, covering the failed 89-gene panel in the founding family and the neural audioprofile that narrows the differential before sequencing. Blocking item 4: a prevalence record was added as CASES_IN_LITERATURE ULTRA_RARE, with the 863-proband and 206-control screening result as the quantitative rarity statement. Blocking item 5: PMID:20301607 Genetic Hearing Loss Overview tagged as GeneReviews in the references block, tag only and no manufactured evidence items, as instructed. Blocking item 6: the experimental_models link evidence quoted the paper's opening motivation sentence, which does not attest that the model is informative; replaced with the reviewer's suggested sentence naming the model, its patient and control provenance and its result. Suggestions taken: PMID:40874586 is now cited in the HUMAN_MODEL_MISMATCH discussion as a second, primary-data LOF/PVNH series of seven individuals from three families, which moves the allelic dichotomy off a single review's literature summary; the High-frequency predominant hearing loss phenotype was given an incoming edge from Failure of Auditory Nerve Signal Transmission; and the three evidence items quoting isolated primary mouse spiral ganglion neuron cultures were regraded MODEL_ORGANISM to IN_VITRO per the CLAUDE.md rule that cultured cells from any species are IN_VITRO, moving all occurrences of each quoted sentence together so check-snippet-grading stays clean. The fourth suggestion, that variant-level detail was prose only, was also taken: a structured variants list now records all three alleles with clinical_significance LIKELY_PATHOGENIC for p.Ser1400Gly and UNCERTAIN_SIGNIFICANCE for p.Ile923Thr and p.Phe1838Leu, matching the reporting group's own differential assessment. One correction to the reviewer's text: the title of PMID:40874586 in the cache is MAP1B Variants Disrupt Neuronal Migration: Insights From Three Novel Families, not the title initially written in this entry, and reference validation caught the mismatch. Validation after the round: just validate-disorders passed with 37/37 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-enum-values all clean.

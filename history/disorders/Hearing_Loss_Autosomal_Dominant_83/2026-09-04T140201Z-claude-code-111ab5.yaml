  summary: 'Create: Hearing Loss Autosomal Dominant 83 (DFNA83, MAP1B)'
  details: |
    De novo curation of DFNA83 (MONDO:0030723, OMIM:619808, MAP1B). Deep research: one OpenScientist run, committed as research/Hearing_Loss_Autosomal_Dominant_83-deep-research-openscientist.md. That run did emit both reference_validation and term_validation frontmatter blocks and both report sections, unlike the sibling DFNA75 run in the same batch (see issue 9702, commented). Its reference validation reported 4/4 identifiers resolved and 4/4 on topic. Its term validation reported 4 terms named as a different term, and two of those were consequential and were not used: UBERON:0001681 offered as spiral ganglion (it is nasal bone) and HP:0006385 offered as high-frequency hearing loss (it is Short lower limbs). The entry uses CL:0011113 spiral ganglion neuron and HP:0005101 High-frequency hearing impairment instead, both taken from the committed term cache. Entry content is built almost entirely on PMID:33268592 (Cui 2020, JCI Insight), whose full text was available in the reference cache and which carries the human genetics, the patient iPSC otic sensory neuron model with an isogenic CRISPR-corrected control, and the Map1b heterozygous knockout mouse. The deep-research report contributed one substantive addition that changed the entry's conclusions: PMID:40802165, a 2025 review establishing that MAP1B loss-of-function alleles cause periventricular nodular heterotopia 9 while missense alleles present with deafness. That reframes the HUMAN_MODEL_MISMATCH discussion, because the mouse used as the in vivo model is a heterozygous null, which is the allele class that in humans causes a brain malformation rather than hearing loss. Validation: just validate-disorders passed with 32/32 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-enum-values all clean.

  summary: 'Create: Baller-Gerold syndrome'
  details: |
    New Disease entry for Baller-Gerold syndrome (MONDO:0009039), RECQL4
    (hgnc:9949), curated from the stubs/ queue against claim issue #10661. The
    stub stubs/Baller-Gerold_Syndrome.yaml was deleted in the same change.

    Lump/split decision. Curated as its own Disease entry rather than as a
    has_subtypes entry on Rothmund-Thomson Syndrome, on four grounds recorded in
    full in the entry's notes field. Craniosynostosis is present in BGS and
    absent in RTS, and the RECQL4 literature treats that as the reason the two
    remain separate syndromes (PMID:34869606). MONDO parents differ, with BGS
    under syndromic craniosynostosis and RTS among the genodermatoses, and the
    RTS entry's has_subtypes slot is already used for its own ANAPC1 and RECQL4
    molecular types. BGS is a clinically ascertained entity of which only the
    poikiloderma-positive subgroup is RECQL4-related, so it cannot be
    represented as a subtype of an RECQL4-defined entry. Management diverges,
    with cranial vault surgery before six months and pollicization appearing
    nowhere in the RTS entry. The opposing spectrum argument from Van Maldergem
    (PMID:15964893) and Siitonen (PMID:18716613) is recorded in the notes rather
    than dismissed. That RECQL4-positive versus RECQL4-negative split is also
    carried structurally as two has_subtypes entries.

    Sources. GeneReviews baseline PMID:20301383 was fetched, cached and tagged
    in the top-level references block; its Clinical Characteristics,
    Diagnosis/Testing, Management, Surveillance, Agents-to-Avoid and Genetic
    Counseling content is cross-referenced into phenotypes, treatments,
    inheritance and the genetic block. Molecular basis from PMID:15964893 (two
    BGS families with biallelic RECQL4 variants) and PMID:25966250 (novel
    compound heterozygous variants used for prenatal diagnosis). Nosology and
    cancer-risk bounds from PMID:18716613 and PMID:24635570. Mechanism from
    PMID:15960976 (RECQL4 required for replication-origin firing),
    PMID:34869606 (origin replisome complex; the RTS/BGS distinction),
    PMID:25859855 (osteoblast-progenitor conditional mouse) and PMID:12915449
    (helicase-domain mouse). Severe end of the clinical spectrum from
    PMID:1583650.

    Structure. Pathophysiology is a connected chain rather than a list:
    biallelic RECQL4 loss, to failure of DNA replication origin firing, to
    progenitor cell proliferation failure, branching into defective ossification
    and skeletal patterning, generalized growth restriction, and cutaneous
    poikilodermatous degeneration, each of which reaches the corresponding
    phenotype node by bare-name causal target. Two animal models are linked
    through modeled_mechanisms with fidelity and limitations, both recording
    that neither reproduces craniosynostosis.

    Deliberate omissions. Osteosarcoma and lymphoma are NOT curated as BGS
    phenotypes. GeneReviews recommends surveillance for them by extrapolation
    from the allelic RECQL4 disorders, and PMID:18716613 states that the cancer
    incidence in BGS itself has not been determined, so they appear only as the
    indication for the surveillance treatment. No conforms_to was declared,
    because both candidate genomic-instability modules frame their chains around
    aging or tumor clonal evolution rather than a developmental proliferation
    deficit. Two KNOWLEDGE_GAP discussions record the unexplained
    craniosynostosis mechanism and the unexplained RECQL4-negative BGS group.
    No Orphanet cache entry exists for this disorder locally and none was
    fabricated, so prevalence rests on the literature case count alone.

    Validation. just validate (schema, terms and references), just
    validate-terms, just count-verified-snippets (61/61 verified), just
    check-duplicate-keys, just check-entity-refs, just check-causal-targets,
    just check-qualifier-terms, just check-enum-values, just
    check-folded-hyphens, just check-snippet-length, just check-title-snippets,

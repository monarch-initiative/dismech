  details: |
    Second review round on PR #11421. Both findings were in content added by the previous round, and both are mine.

    Finding 1 (snippet grading). The differential_diagnoses entry for Rothmund-Thomson syndrome type 2 copied a PMID:34869606 sentence already cited in discussions[0] and graded it HUMAN_CLINICAL where the existing item grades it OTHER. evidence_source classifies the cited publication, so it cannot change because the quote moved. Regraded to OTHER, which is both the pre-existing value and the internally consistent one: the entry already grades another synthesis sentence from that review OTHER while reserving IN_VITRO for its molecular results. The root cause was procedural rather than analytical: check-snippet-grading takes no file argument and runs whole-KB, so it was omitted from the per-file loop run in the previous round even though CLAUDE.md lists it among the gates to run after a tranche of edits. It is now run before pushing.

    Finding 2 (a false claim about the ontology). The diagnosis entry for clinical recognition at birth was left with an unbound diagnosis_term and a notes paragraph asserting that nothing under NCIT:C25218 names the newborn examination without overstating the procedure. That assertion was false. NCIT:C20989 Physical Examination is reachable from C25218, is present in cache/ncit/terms.csv and in the TreatmentActionTerm enum cache, and is already bound in this slot by 32 other entries. The claim came from a narrow grep of the cache rather than an actual term search, and it would have rendered on the disorder page telling readers the ontology lacks a term it has. Bound NCIT:C20989 with preferred_term physical examination of the newborn, carrying the newborn specificity in preferred_term as the term contract permits, and deleted the notes paragraph rather than rewriting it.

    Suggestion 1 (name/binding disagreement). The differential named TWIST1-related craniosynostosis while binding MONDO:0007042 Saethre-Chotzen syndrome, and its distinguishing_features described Saethre-Chotzen. Renamed the entry to Saethre-Chotzen syndrome so name and binding agree, and the description now states explicitly that TWIST1 is the Saethre-Chotzen gene and that the cited source reports the variant without naming the syndrome, so the entity is named from that gene attribution rather than from the quote.

    Suggestion 2 required no action; it recorded that the absent frequency on the split carpal and metacarpal phenotypes is deliberate.

    Validation: just validate passes with 74/74 snippets verified; validate-terms passes; check-snippet-grading now reports no new divergences, having gone red on this branch before the fix.

  summary: 'Review: FAS-related ALPS publication-completeness deep review (IUIS Table
    4)'
  details: |
    Publication-completeness pass over already-cited sources, adding 208 lines.

    The main addition is the diagnostic biomarker triad the entry named in prose but did not curate: elevated serum vitamin B12, elevated soluble FAS ligand (sCD95L) and elevated serum IL-10. These are the accessory criteria that separate ALPS from the lymphoproliferation it mimics, so leaving them unstructured made the entry unqueryable on exactly the axis clinicians use.

    Also added two differential diagnoses: common variable immunodeficiency, and the non-FAS apoptosis-pathway disorders (FASLG, CASP8, CASP10) that reach the ALPS phenotype through a different lesion in the same pathway.

    Every snippet exact-verified against its cached reference.

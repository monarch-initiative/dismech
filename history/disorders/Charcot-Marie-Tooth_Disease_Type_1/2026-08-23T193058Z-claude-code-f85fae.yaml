  summary: 'Review: retarget module conformance to the correct node'
  details: |
    Coherency review of the conformance declarations added to this entry earlier in this branch. Retargeted, no other content changed.

    Nodes had been pointed at schwann_cell_myelin_maintenance's amplifier node (Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking) that make no proteostatic or mistrafficking claim in their own text. The CMT1 connexin-32 node describes loss of reflexive gap-junction channels and a lengthened radial diffusion pathway; the CMT4 myotubularin and SH3TC2 nodes describe phosphoinositide turnover and endosomal recycling. None of these is ER/Golgi protein quality control, and conforming them to that node asserted something the nodes do not say.

    Two independent checks agreed on the correct target. First, the module's own notes already list the connexin-32 and recessive CMT4 trafficking-gene lesions under the trigger node, so the wiring contradicted the module documentation. Second, in the CMT4 pathograph all four gene nodes have in-degree zero and feed the single demyelination node, i.e. they sit at trigger altitude by graph position. Retargeted to schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells.

    The pre-existing conformance to peripheral_axonal_degeneration on the demyelination node is untouched.

    Verified with tests/test_data.py::test_conforms_to_module_node_references and a re-run of just validate-disorders.

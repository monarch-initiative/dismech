  summary: 'Genetics pass: CMT1H (FBLN5) and CMT1J (ITPR3) added to the demyelinating
    compartment'
  details: |
    Genetics pass for issue #12240 (d2g series-033). Two gene-defined subtypes of the
    demyelinating compartment were added, each with a bound MONDO subtype_term, a
    genes descriptor and a reciprocal genetic[].subtype foreign key: CMT1H
    (MONDO:0030689, FBLN5) and CMT1J (MONDO:0859311, ITPR3).

    Two new pathophysiology nodes carry the genes into the graph and link downstream
    to the pre-existing terminal node Demyelination and Secondary Axonal Loss:
    Fibulin-5 Extracellular Matrix Defect and ITPR3 Calcium Release Dysregulation.
    Both downstream links are typed INDIRECT_UNKNOWN_INTERMEDIATES because neither
    cited source establishes how the molecular lesion reaches the Schwann cell; that
    gap is stated in the node descriptions rather than bridged by assertion.

    Evidence is abstract-level and exact: PMID:21576112 for FBLN5, which establishes
    the gene in a dominant CMT1 family mapped to 14q32 and in two further families
    with hyperextensible skin, and PMID:32949214 for ITPR3, which reports a
    segregating p.Val615Met variant, an independent de novo p.Arg2524Cys variant and
    altered calcium transients in patient fibroblasts. ClinGen classifies FBLN5 as
    Moderate for demyelinating hereditary motor and sensory neuropathy
    (CGGV:assertion_a863341a, cited in the entry); a search of the approved symbol
    ITPR3 in the same 2026-08-13 snapshot returns no row.

    The MONDO label for MONDO:0030689 is malformed ("demyelinating, IIA 1H",
    inherited from MedGen) and is copied verbatim into term.label.

    Validation: just validate, just validate-terms and just count-verified-snippets
    clean under linkml-reference-validator 0.3.0rc1.

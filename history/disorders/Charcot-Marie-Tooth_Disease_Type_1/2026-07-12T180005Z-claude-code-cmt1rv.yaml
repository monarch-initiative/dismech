  summary: Manual evidence review of CMT1 (demyelinating compartment); no claim errors found
  details: |
    Manual, no-scripting review of the CMT1 demyelinating-compartment entry.
    Verified every evidence snippet is an exact substring of its cached source and
    supports its claim. The 119-case CMT1A cohort (PMID:9183252) backs each
    phenotype/causal edge it is cited for (uniformly reduced MNCV <=33 m/s in the
    median nerve, distal weakness/wasting, universal pes cavus or ankle areflexia,
    abnormal sensory potentials); the CMT1B UPR/ER-stress mechanism
    (DOI:10.3390/ijms25179227), connexin-32 loss-of-function in CMTX1
    (PMID:30881289), EGR2/Krox20 myelination role (PMID:9537424), and the Brain
    2024 subtype frequencies all verify. Descriptions correctly frame CMT1A as
    dysmyelinating (uniformly shortened internodes) rather than classic segmental
    demyelination.

    No fixes were required. Follow-up gaps recorded as GitHub issues: CMT1 has no
    inheritance block (the compartment is autosomal dominant with an X-linked
    CMTX1 member and would benefit from HP:0000006 / HP:0001417 inheritance_term
    bindings), and no structured prevalence record. Entry left unchanged.

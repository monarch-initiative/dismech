  summary: 'Genetics pass: add CMT1C and CMT1F rows, bind CMT1A/1B/1D terms, wire
    EGR2/LITAF/NEFL'
  details: |
    Genetics pass for dismech#12256 (d2g series-049), Charcot-Marie-Tooth disease type 1.

    Anchor. disease_term MONDO:0019011 Charcot-Marie-Tooth disease type 1 is the entry's own concept and was left alone. The reciprocal test does find a mismatch, recorded in the entry's new notes rather than acted on: the CMT1H row binds MONDO:0030689 and the CMT1J row binds MONDO:0859311, and MONDO files both under MONDO:0015626 Charcot-Marie-Tooth disease rather than under MONDO:0019011, even though MONDO:0859311's label is "Charcot-Marie-Tooth disease, demyelinating, type 1J" and CMT1H is a synonym of MONDO:0030689. The CMTX1 row binds no MONDO term because the X-linked form is curated as Charcot-Marie-Tooth_Disease_Type_X against MONDO:0018994.

    Issue rows. MONDO:0007309 CMT1A and MONDO:0011890 CMT1D already had rows under those names but bound neither their MONDO term nor their gene; both now carry subtype_term and genes. MONDO:0007311 CMT1E was already curated as the standalone entry Charcot-Marie-Tooth_Disease_Type_1E, which binds it as its own disease_term, so that row was spurious and is dispositioned in the entry's notes rather than duplicated. MONDO:0010995 CMT1C (LITAF) and MONDO:0011902 CMT1F (NEFL) were genuine gaps and are new rows with genes, descriptions and evidence. MONDO:0007307 CMT1B is not an issue row but was the sixth child of the anchor and had an open stub; it is now bound on the existing CMT1B row. stubs/Charcot-Marie-Tooth_Disease_Type_1A.yaml and stubs/Charcot-Marie-Tooth_Disease_Type_1B.yaml deleted.

    Gene wiring. dismech.qc_plugins.gene_mechanism_wiring_coverage was 5/6: the EGR2 genetic record reached no pathophysiology node. Three nodes were added, each with its own evidence and a downstream edge to the shared "Demyelination and Secondary Axonal Loss" node: EGR2 Schwann-Cell Myelination Program Failure, LITAF Endolysosomal Homeostasis Failure, and Neurofilament Light Chain Assembly Defect. Wiring is now 8/8 against two new genetic records (LITAF, NEFL). The LITAF edge is typed INDIRECT_UNKNOWN_INTERMEDIATES because the cited work was done in patient fibroblasts and says so.

    Phenotype connectivity. causal_inlink_coverage was 5/6; Onion Bulb Formation had no incoming edge despite the demyelination node's own description naming onion-bulb formation. Added that edge, sourced to the sural-nerve biopsy series in PMID:28501821. Now 6/6, with no node lacking an outgoing edge.

    Caveat recorded rather than smoothed over. PMID:33993654 collates the published NEFL cases and argues that the CMT1F, CMT2E and DI-CMTG labels reflect variable presentation rather than different mechanisms, and that the process is most likely primarily axonal in all cases. That is quoted on both the CMT1F row and the NEFL node, so the entry does not assert that CMT1F is a mechanistically separate lesion. NEFL has two rows in the committed ClinGen cache, Definitive against MONDO:0015626 (AD) and Definitive against MONDO:0018993 (AR); neither is scored against CMT1F, and the notes say so. A search of the approved symbol LITAF across the 718 committed CGGV_*.md records returns no row, re-run before committing.

    Collateral fix. Intermediate_Charcot-Marie-Tooth_Disease.yaml carried a DI-CMTG description saying the demyelinating CMT1F presentation "is uncurated" and that MONDO:0011902 "appears in no kb/ or stubs/ file". This change makes that false, so the sentence now names the CMT1F row that holds it.

    Validation on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 342 snippets checked, 0 issues; just count-verified-snippets reports 342/342 after reverting the whitespace churn. just list-gene-term-mismatches over the changed files examined 123 gene bindings with 0 findings.

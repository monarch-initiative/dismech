  summary: 'Review round 1: source and rename the NEFL node, add LITAF and NEFL molecular
    functions, fix an edge explanation'
  details: |
    Review round 1 on dismech#13279, blocking item 2 plus one suggestion and one CI gate.

    The NEFL node was named for a claim none of its evidence made. "Neurofilament Light Chain Assembly Defect" asserted an assembly defect, and bound intermediate filament organization DECREASED, while its four evidence items were about the three electrophysiological presentations, the protein's subunit identity, the biopsy findings and the classification caveat. None of them mentioned assembly. Two sentences in PMID:33993654, already committed in references_cache, supply it: "There are many reports that missense mutations in NEFL disrupt neurofilament assembly in cultured cells", graded IN_VITRO with quote_role REVIEW_SYNTHESIS because the review is summarising cultured-cell work it did not perform, and "How dominant missense mutations in NEFL result in the absence of neurofilaments from axons is less clear, but it seems likely to involve defective neurofilament assembly and/or transport", graded OTHER and REVIEW_SYNTHESIS because it is the review's own inference and reports no experiment.

    Both the name and the description were changed rather than only one of them. The node is now "NEFL Neurofilament Assembly and Transport Defect", because the source names assembly and transport together and declines to choose, and the description carries the hedge explicitly: the step from disrupted assembly in culture to absent axonal neurofilaments in patients is called less clear by the review. Nothing targets the old node name, and the node names in this entry remain unique.

    Molecular functions, for the CI gate. scripts/check_gene_activity_grounding.py failed on this branch with LITAF and NEFL newly wired to nodes carrying no molecular_functions. structural molecule activity was added to the NEFL node, sourced by the already-cited sentence calling NEFL one of five proteins that co-assemble to form neurofilaments. phospholipid binding was added to the LITAF node, with a new evidence item for it from PMID:33059769: membrane association is mediated by the C-terminal LITAF domain via a predicted hydrophobic helix and specific interactions with phosphoethanolamine head groups. That region is where all the CMT1C variants lie, which is why disrupting it is the proposed consequence. The gate now reports no newly ungrounded genes, and no baseline was touched.

    Suggestion taken. The Demyelination to Onion Bulb Formation edge explanation called PMID:28501821 a demyelinating-CMT cohort. It is an NEFL-related CMT cohort whose presentations are mostly axonal, and the explanation now says so and says that the biopsy finding is the histology of the demyelinating component rather than of a CMT1A series. The quote itself is unchanged. No better cached CMT1A biopsy source was found: the one candidate, the PMP22 review cached as DOI:10.1186/1750-1172-9-38, is a full_text_pdf whose onion-bulb sentence is split across a line break mid-word, so quoting it cleanly is not possible.

    Validation after the round, on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 349 snippets checked, 364 titles checked, 0 issues; just count-verified-snippets reports 349/349 after reverting the 18 reference-cache files the validator renormalised. gene_mechanism_wiring_coverage stays 8/8 and causal_inlink_coverage 6/6.

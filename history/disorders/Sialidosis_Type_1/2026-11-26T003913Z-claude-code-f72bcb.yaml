  details: |
    Reviewed NEU1 modelling: the node binds exo-alpha-sialidase activity (GO:0004308) as decreased, matching lysosomal neuraminidase 1, which removes terminal sialic acid from sialoglycoconjugates. The genetic record now records GERMLINE origin and binds HP:0000007 on its inheritance block. Two evidence quotes stopped before their claims ('Genetic analysis identified novel homozygous'; 'a newly reported family carrying N-acetyl-alpha-neuraminidase-1'); they now quote the full sentences naming the homozygous NEU1 p.G248C variant (PMID:28138907) and the compound heterozygous S182G/V143E family with a mild allele confirmed by sialidase assay (PMID:38600684). ClinGen's Definitive NEU1 assertion is for sialidosis (MONDO:0017734), the parent of this entry's term, so it is not copied.

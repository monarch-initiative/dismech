  details: |
    Cached and tagged the GeneReviews DRPLA chapter (PMID:20301664) and added exact abstract snippets to ataxia, seizures, myoclonus, choreoathetosis, dementia, the ATN1 genetic-testing diagnosis, antiseizure and supportive treatments, and genetic counseling. The cached chapter is abstract-only, so the repeat-size thresholds stay cited to PMID:30410817. Removed GO:0003714 transcription corepressor activity from the ATN1 CAG Repeat Expansion and Proteostasis Failure nodes, keeping it only on the co-repressor dysregulation node. Removed the subtype restriction from ataxia, dementia and seizures, since GeneReviews lists all three among the cardinal features irrespective of age of onset. Added psychiatric manifestations (HP:0000708) and cerebral white matter hyperintensity on MRI (HP:0030890) phenotypes using snippets already in the entry, both wired from the degeneration node. Dropped the PMID:9124808 evidence on the SCA1 differential, which shows a shared repeat mechanism rather than clinical overlap. Corrected the earlier history record's links to point at this PR. Validated with just validate, validate-terms, count-verified-snippets (76/76), check-folded-hyphens, check-genereviews and check-causal-targets.

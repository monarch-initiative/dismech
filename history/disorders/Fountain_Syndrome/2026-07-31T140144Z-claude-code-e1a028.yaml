  summary: 'Review response: PR #7344 seizure-term specificity, inner-ear node split,
    DR provenance, parents'
  details: |
    Addressed the ai4c-reviewer round on PR #7344: one IMPORTANT (blocking) item and all four non-blocking suggestions.

    IMPORTANT - phenotype term less specific than its own evidence. The Seizures phenotype bound HP:0001250 Seizure while the snippet attached to it reads "early-onset, generalized seizures can be added to the symptom complex". Rebound to HP:0002197 Generalized-onset seizure, verified via OAK, keeping the INFANTILE onset qualifier and the existing evidence item. No new evidence burden - the specificity was already present in the quoted text.

    Suggestion 1 (pathophysiology bundling) - accepted. The node "Inner-Ear Malformation and Sensorineural Deafness" bundled a structural lesion with its functional consequence, which CLAUDE.md's biological_scale guidance treats as a signal to split. Split into "Inner-Ear Malformation" (biological_scale TISSUE) and "Sensorineural Deafness" (biological_scale ORGANISM) joined by a DIRECT causal edge, licensed by the source sentence asserting the direction explicitly ("congenital deafness due to an anatomical inner ear anomaly"). Updated the two inbound references: the Unknown Molecular Etiology downstream edge now targets the structural node, and the Hearing Rehabilitation treatment target_mechanisms now targets the functional node, which is more accurate since amplification compensates for the deficit without correcting the malformation. Verified no dangling node references remain across downstream, target_mechanisms and discussions attaches_to. Pathograph is now 6 nodes.

    Suggestion 2 (DR provenance) - accepted. The 2026-07-31 claude_code re-run had overwritten the 2026-07-30 run committed with merged PR #7215. Restored the superseded run from git as research/Fountain_Syndrome-deep-research-claude_code-2026-07-30.md plus its citations sidecar, so both provider runs are preserved. Confirmed the reviewer's observation: the 2026-07-30 run asserts the correct MONDO:0009241 four times and contains no KCTD3 mention, whereas the 2026-07-31 re-run introduced the KCTD3 artifact. Recorded in notes that two runs of the same provider on the same disease differ in their hallucinations, which is the substantive argument for archiving rather than overwriting.

    Suggestion 3 (overstated cacheability claim) - accepted. The notes said the unmodeled single-patient features were omitted because "no citable structured source could be cached". Narrowed to "not quotable from the BODY of any cached reference", and added the reviewer's specific finding that PMID:4431800 carries the MeSH keyword Gingival Diseases/genetics and PMID:2585470 carries Skull/abnormalities in cached frontmatter - frontmatter is not validated body text, so it cannot serve as an evidence snippet and is not a route around the ceiling.

    Suggestion 4 (parents) - accepted. Added "multiple congenital anomalies/dysmorphic syndrome-intellectual disability" as the leading parent. Confirmed with OAK that MONDO:0015159 is the actual asserted rdfs:subClassOf parent of MONDO:0009241, and that three existing KB entries (Arboleda-Tham, KBG, Stromme) already use that exact label string in parents. Retained hereditary disease and neurodevelopmental disorder.

    Validation after changes: just validate passes (schema, terms, references), just validate-terms passes, 18/18 Fountain tests pass, all 45 evidence snippets re-verified as exact whitespace-normalized substrings of the post-frontmatter body of their cached references with 0 mismatches, and a foreign-key check confirms every pathophysiology node reference resolves after the node split.

  summary: 'Augment: Fountain Syndrome (classifications, progression, differential
    and causal-edge evidence)'
  details: |
    Follow-up augmentation of the entry created in PR #7215 (merged). Branched fresh from origin/main.

    Deep research: falcon (the /curate default) FAILED with HTTP 402 Payment Required from the Edison Scientific API (no account credits), so it could not be run this session. Fell back to the claude_code provider, which completed successfully (11 web searches, 13 turns, 258s) and regenerated research/Fountain_Syndrome-deep-research-claude_code.md; the falcon and claude_code reports committed with PR #7215 were also re-mined. An openscientist run was submitted but was still queued server-side when this work was committed.

    Additions: (1) classifications block - GENETICS_ENVIRONMENT_DISEASE (primary; Mendelian autosomal recessive multisystem syndrome), NEUROLOGIC (intellectual disability and epilepsy arm), DISORDER_OF_EAR (congenital sensorineural deafness from inner-ear malformation), each with an evidenced snippet. (2) progression block - two phases capturing congenital/infantile onset of deafness and seizures, and the age-dependent accentuation of the clinical gestalt reported in the 1996 follow-up series, including a PARTIAL item recording that the trend rests on only five patients. (3) Evidence on all three differential_diagnoses, previously bare: Hao-Fountain syndrome now cites GeneReviews PMID:41343689 for autosomal dominant de novo USP7 inheritance, the heterozygous-USP7 molecular test, and the fact that hearing loss occurs in fewer than 50% of Hao-Fountain patients versus obligate congenital deafness in classic Fountain; DOORS syndrome cites GeneReviews PMID:25719194 for the DOORS phenotype and biallelic TBC1D24 testing; Melkersson-Rosenthal cites PMID:33422123 and PMID:29261927 for the classic triad and its acquired young-adult onset. (4) Evidence on all four pathophysiology downstream causal edges leaving the Unknown Molecular Etiology node, deliberately typed PARTIAL because the abstracts establish co-segregation of the manifestations within one autosomal recessive trait but assert no mechanism.

    Notes expanded with three curation facts: no GeneReviews chapter exists for classic Fountain syndrome, and the two GeneReviews chapters cited here document differential diagnoses and are intentionally NOT tagged GeneReviews in the references block; the literature ceiling is four papers, two of which - PMID:4431800 and PMID:2585470 - are title-only PubMed records with no abstract, leaving only PMID:3565469 and PMID:8897038 quotable; and a gene-attribution guardrail rejecting both USP7, which belongs to Hao-Fountain syndrome, and KCTD3, a keyword co-occurrence artifact surfaced by the claude_code pass, as spurious associations.

    Blocked/deferred: ORPHA:3219 could not be cached because just refresh-orphadata fails on a sha256 mismatch for en_product1.xml against the pinned data/orphadata/MANIFEST.yaml. Re-pinning would invalidate all 322 existing ORPHA cache files and is out of scope for a single-disorder curation PR. The Orphanet HPO-frequency table remains the best future source for phenotype frequencies and for the additional features - thickened calvaria, hypotonia, scoliosis, gingival overgrowth, myopia - still recorded only in notes.

    Validation: just validate passes for schema, terms and references. IMPORTANT CAVEAT - the linkml-reference-validator currently reports "Total checks: 0" on every disorder file tested, including Asthma, Fabry and Cystinuria, so it is a repo-wide no-op and its pass result does not attest snippet correctness. All 39 evidence snippets in this entry were therefore independently re-verified as exact whitespace-normalized substrings of their cached references_cache files, with 0 mismatches. Compliance rose from 78.3% to 89.7% global and 78.8% to 90.4% weighted.

  details: |
    OpenScientist deep-research run landed after the earlier commits and is added here, completing the deep-research obligation for this session with a third provider.

    Provider status this session: falcon (the /curate default) FAILED with HTTP 402 Payment Required from the Edison Scientific API. claude_code completed (11 web searches, 258s). openscientist completed after roughly 60 minutes of server-side queueing and is committed here as research/Fountain_Syndrome-deep-research-openscientist.md plus its citations sidecar and final_report.html/final_report.pdf artifacts, matching the convention used by the 44 already-tracked openscientist artifact files.

    Assessment of the openscientist report: its narrative content is accurate and, importantly, NOT named-entity-confused - it correctly identifies classic Fountain syndrome as the autosomal recessive tetrad, sources that content from PMID:3565469 and PMID:8897038, and explicitly demarcates Hao-Fountain/USP7 as a separate autosomal dominant disorder. The ten USP7-era PMIDs it cites are used only to characterize that differential, which is legitimate. No new curatable claim about classic Fountain syndrome was extracted, because the report is bounded by the same two-abstract evidence ceiling already documented in the entry notes.

    HOWEVER the report asserts two INCORRECT identifiers for this disease in both its summary and its identifier table: MONDO:0008788 and ORPHA:2001. MONDO:0008788 was checked with OAK and resolves to IRIDA syndrome (iron-refractory iron deficiency anemia), an entirely unrelated disorder. The correct identifiers, re-derived from the xref block of MONDO:0009241, are MONDO:0009241, OMIM:229120, ORPHA:3219, GARD:0000064, MEDGEN:208650, MESH:C537270 and UMLS:C0795944. The entry already carried the correct MONDO term, so nothing needed fixing in the data; an identifier guardrail was added to notes recording the two wrong IDs and instructing curators to re-derive identifiers with OAK rather than copying them from a deep-research report. This is a textbook instance of the hallucination class the dismech anti-hallucination SOP exists to catch, and it is especially instructive because the wrong IDs are embedded in a report whose prose is otherwise reliable.

    No change to phenotypes, pathophysiology, treatments, differential diagnoses, or evidence resulted from this run. Validation re-run after the notes edit: just validate passes for schema, terms and references.

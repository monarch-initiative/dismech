  details: |
    Review-response pass on the augmentation committed in 67b761b0, addressing an adversarial pre-PR review (2 IMPORTANT, 8 MINOR, 3 NIT).

    CORRECTION to the previous history record in this directory (2026-07-31T054541Z): that record and commit 67b761b0 state that linkml-reference-validator is a "repo-wide no-op" because it reports "Total checks: 0" on every disorder file. THAT CLAIM IS WRONG and should not be relied on. "Total checks" counts validation ISSUES FOUND, not snippets examined. Proven two ways during this pass: (a) the repo pre-edit hook (.claude/hooks/validate_disorder_hook.py) rejected a proposed ATP6V1B2 snippet because the validator strips bracketed text, so "intellectual disability [ID], and seizures" did not match; (b) a deliberately fabricated snippet injected into a temp copy of this entry was caught with an explicit [ERROR] Text part not found as substring. The validator works and does protect against hallucinated snippets. No follow-up issue against the validator is warranted; the counter label is merely misleading.

    Review fixes applied. IMPORTANT-1: notes previously asserted that the cited GeneReviews chapters are "deliberately NOT tagged GeneReviews" in the references block. scripts/tag_references.py detects GeneReviews by naive substring match over the whole cache file, so it does auto-tag them - dry run confirmed 2 entries tagged. The note now states plainly that the tooling will auto-tag these chapters, that they document differential diagnoses rather than this disease, and that the tag must not be read as evidence of a GeneReviews baseline for classic Fountain syndrome. IMPORTANT-2 (working-tree scope) was already handled before 67b761b0: the 7,598 validator-rewritten references_cache files were reverted and the commit contains 11 intentional files.

    MINOR-3: the causal-edge evidence on the Subcutaneous Connective-Tissue Swelling and Generalized Skeletal Dysplasia edges quoted pure phenotype descriptions with no attribution language while their explanations claimed support for a shared inherited cause. Both now quote PMID:8897038's "an autosomal recessive entity with mental retardation, deafness, skeletal abnormalities and coarse face with full lips as cardinal features", which explicitly binds those domains to the recessive entity. MINOR-4: deleted the progression evidence item quoting the 1996 methods sentence about cohort composition, which described the denominator rather than supporting the age-accentuation claim; the five-patient denominator now lives in the phase notes. MINOR-5: corrected the literature-ceiling sentence - the 26-record PubMed result contains only two classic-syndrome papers (PMID:3565469, PMID:8897038), not four; PMID:4431800 and PMID:2585470 are indexed under other titles. MINOR-6: noted the 1974 title-quote exception for the lip granuloma phenotype. MINOR-7: dropped the unsupported word "acquired" from the Melkersson-Rosenthal explanation, since the cited source calls it a disorder of unknown cause. MINOR-9: added evidence for the previously unevidenced ATP6V1B2 arm of the DOORS differential (PMID:36135319 for the DDOD/ZLS2/DOORS spectrum, PMID:32597767 for de novo monoallelic dominant inheritance, the discriminator from recessive Fountain syndrome). MINOR-10: added a fourth differential diagnosis for the mucopolysaccharidoses (MONDO:0001586, MPS I/Hurler) with three evidence items from the already-cached GeneReviews PMID:20301341, covering progressive cardiorespiratory involvement and corneal clouding, dysostosis multiplex with arthropathy, and post-infancy facial coarsening - the highest-yield metabolic mimic for a coarse-facies plus deafness plus skeletal plus ID phenotype. NIT-11: removed the redundant "PARTIAL." prefix from four explanations. NIT-12: shortened the progression phase label. NIT-13: softened an unsupported inference about age of recognition of intellectual disability.

    Reviewer non-findings accepted without change: evidence_source HUMAN_CLINICAL on GeneReviews and StatPearls citations follows the dominant repo convention (3,624 vs 1,403 and 114 vs 90 respectively); changing it is a repo-wide policy question, not a Fountain-syndrome item. Harrison's enum keys and free-text phase values verified correct.

    Validation: just validate passes (schema, terms, references). All 43 evidence snippets independently re-verified as exact whitespace-normalized substrings of the post-frontmatter BODY of their cached references, 0 mismatches. Compliance now 90.3% global, 90.9% weighted, up from 78.3/78.8 before this session.

  summary: 'Create: Fountain Syndrome'
  details: |
    Created de-novo KB entry for classic Fountain syndrome MONDO:0009241 / OMIM:229120, an ultra-rare autosomal recessive clinically defined syndrome. Kept distinct from the existing Hao-Fountain USP7 entry - an NEC risk confirmed and disambiguated by the claude_code deep-research report, which also flagged ATP6V1B2 DDOD/DOORS/Zimmermann-Laband as phenotypic mimics to exclude. Deep research providers: claude_code and falcon. No causal gene is established, so no genetic block was added; the unmapped gene is recorded as an OPEN KNOWLEDGE_GAP discussion with a proposed sequencing experiment. Curated 11 phenotypes, 3 descriptive pathophysiology nodes, AR inheritance, prevalence, and supportive treatment. All 17 evidence snippets verified as exact substrings of cached abstracts PMID:3565469 and PMID:8897038; landmark refs PMID:4431800 Fountain 1974 and PMID:2585470 Fryns 1989 cited. Validated with just validate schema+terms+references, validate-terms, compliance 92.5 percent weighted 94.

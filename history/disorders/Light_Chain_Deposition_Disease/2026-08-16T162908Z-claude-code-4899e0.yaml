  summary: 'Address review: fix mis-cited evidence, add biochemical/histopathology/diagnosis'
  details: |
    Addressed the 12 IMPORTANT findings. The two that mattered most were evidence cited for claims it does not make. The Nodular Glomerulosclerosis node carried the kidney-transplant-recurrence sentence, which supports the transplant discussion and not the histological lesion; replaced with the sentence that does support it (nodular mesangial sclerosis in 39 patients, 61 per cent). The same transplant snippet was reused on the prevalence record for the scale of the series, where it states neither a series size nor a rate; replaced with the nationwide-cohort sentence from PMID:30578255, and the accompanying note corrected, since it claimed the largest series number in the tens of patients when a 255-patient cohort with 212 cases of this disease was already cached in the PR. Proteinuria rested on model-organism evidence alone and now carries a human presentation sentence; chronic kidney disease rested on an inferential quote and now carries the 39 per cent progression-to-ESRD figure. Added extrarenal organ involvement as a phenotype at FREQUENT, 35 per cent symptomatic and mostly hepatic and cardiac, which was entirely absent despite being above the coverage threshold and despite mattering clinically: a patient whose renal disease is controlled can still be losing an unmonitored organ. Added biochemical for the serum free light chain ratio, abnormal in all 51 patients tested, which is both the practical entry point to diagnosis and the measure of haematologic response. Added histopathology with Congo red negative granular deposits and nodular mesangial sclerosis; the Congo red negativity is the entry's central argument and had no structured home. Added diagnosis with the free light chain plus biopsy spine and a separate record for Congo red staining, framed as the step that assigns the diagnosis rather than a refinement. Daratumumab gained NCIT:C74007 as therapeutic_agent (which validated, contrary to the usual pattern for NCIT drug terms) and an evidence item deliberately quoted at the sentence naming the POOLED AL-plus-LCDD cohort rather than at the response figures, since those cannot be attributed to either disease alone. genetic gained the variable-domain pathogenicity evidence it previously lacked. Cited references 9 to 11; the PR body's claim of 14 was wrong and is corrected in the reply comment. Validated: just validate passed; count-verified-snippets 32/32 (was 23/23); title audit 32 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

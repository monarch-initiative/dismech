  summary: 'Create: Light Chain Deposition Disease (MONDO:0019730)'
  details: |
    New entry from a claude_code deep-research report (24/24 references resolved, zero confabulations). Eight pathophysiology nodes. The central curation decision was to DECLINE conformance to the amyloidogenesis module, which this disease superficially resembles most: both involve a monoclonal light chain depositing in tissue, but the mechanisms are exact inverses at the decisive step. Light chains from this disease are NOT endocytosed by mesangial cells and signal at the cell surface, driving myofibroblast transformation and matrix overproduction; amyloidogenic light chains from the same cell type ARE endocytosed, reach the lysosome, form fibrils there, and stimulate matrix degradation instead. AL hollows the mesangium out, this disease makes it build. MONDO independently classifies the disease under non-amyloid monoclonal immunoglobulin deposition disease. Both halves of the mirror-image evidence are curated on the relevant nodes rather than left as prose, so a future curator meets the reason and not just the decision. fibrotic_response conformance also declined, because its chain runs through inflammatory recruitment and this mechanism runs from direct receptor-level signalling to mesangial transformation without an inflammatory intermediate. HP:0001917 Renal amyloidosis was explicitly avoided as the highest-risk mis-annotation. The plasma-cell ER-stress node exists as a therapeutic-vulnerability node rather than a step toward kidney injury, and carries the bortezomib INHIBITS edge: the clone makes a protein its own folding machinery struggles with, so blocking the proteasome is selectively lethal to it. A CONTROVERSY discussion records the kidney-transplant question with both opposing series curated (REFUTE for three-of-four graft recurrence, PARTIAL for no recurrence to 9.7 years in sustained clonal remission) plus the proposed reconciliation that remission status rather than transplantation is the discriminator. A KNOWLEDGE_GAP records the glomerulopathic-versus-tubulopathic light chain question, which is experimentally demonstrated rather than hypothetical. Daratumumab is recorded as used but not established, with the pooled AL+LCDD cohort caveat in notes and its response figures deliberately not curated as disease-specific. genetic uses SOMATIC_DRIVER with no gene descriptor bound, since the driver is a somatic rearrangement and the pathogenic property lies in the expressed variable domain. Process improvement applied this entry: every reference_title was written as PLACEHOLDER and filled programmatically from references_cache, after fabricating five titles by hand across the three earlier entries in this batch; 23 titles filled, 0 mismatches. Validated: just validate passed; count-verified-snippets 23/23; title audit 23 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

  summary: Add genetic evidence that a prior record wrongly claimed, plus renal phenotypes
  details: |
    CORRECTION TO THE PRECEDING HISTORY RECORD IN THIS DIRECTORY. That record states that genetic gained the variable-domain pathogenicity evidence it previously lacked. It did not; the text replacement failed to match and I asserted the outcome without checking. This is the third instance of the same failure in this session, the others being on PR 8629 and in the DPD entry, and the common cause is asserting a completed edit rather than grepping for it. The earlier record is left in place as an account of what I believed I had done, and this record supersedes it on that point. genetic now carries two evidence items, verified present: the variable-domain pathogenicity sentence, and PMID:11423577 supporting the kappa predominance recorded in the notes, which is the reverse of AL amyloidosis and one of the simplest discriminators between the two. Added three renal phenotypes (renal insufficiency, hypertension, hematuria) from a sentence already quoted verbatim elsewhere in the file; renal insufficiency at 96 per cent of presentations was well above the coverage threshold and its absence was a genuine gap. Removed the superseded inferential evidence item on chronic kidney disease, which quoted a bortezomib sentence and argued in its explanation that the early-treatment qualifier implies a progressive course; that is the cited-for-a-claim-it-does-not-make pattern and it had no reason to remain once the direct progression-to-ESRD figure was curated. Took three suggestions: PMID:26915878 added as PARTIAL evidence on the transplant CONTROVERSY discussion, where it gives case-level support for the proposed reconciliation while being too small to establish it; target_mechanisms added on daratumumab so it joins the pathograph, INHIBITS on the clonal secretion node, with the pooled-cohort caveat repeated on that link; and an HP binding added on the extrarenal phenotype. Validated: just validate passed; count-verified-snippets 38/38 (was 32/32); title audit 38 citations 0 mismatches; check_folded_hyphens OK. Every claim in this record was verified by grep before writing it.

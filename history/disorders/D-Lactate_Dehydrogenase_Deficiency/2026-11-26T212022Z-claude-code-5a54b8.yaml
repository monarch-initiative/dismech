  summary: 'Create: D-Lactate Dehydrogenase Deficiency'
  details: |
    New entry for MONDO:0009505 (lactic aciduria due to D-lactic acid), curated from
    the stub and claimed in issue 19052. entry_type decision: DISEASE. The MONDO term
    is a leaf with one causal gene (LDHD); the gout presentation and the
    neurodevelopmental presentation share one pathograph up to D-lactate
    accumulation and the same allele (p.Thr251Met) occurs in both, so they are
    kept as one entry without subtypes. The entry is named for the enzyme defect
    because "D-lactic aciduria" also describes acquired short-bowel D-lactic
    acidosis; the reasoning is in the entry notes.

    Sources. Curated from the primary reports read in full where PMC text was
    available (PMID:30931947, PMID:34258137, PMID:40678184, PMID:37863926) and
    from abstracts otherwise (PMID:31638601, PMID:37021930, PMID:38373542). A
    forced re-fetch of PMID:31638601 still returned the abstract only, so the
    gout kindred's treatment and transporter experiments could not be quoted.
    The Asta retrieval report (research/...-deep-research-asta.md) was of
    little use: its own relevance check scored 9 of 35 references on topic
    and none of its papers is cited in the entry. Two OpenScientist jobs were
    submitted through `just research-disorder openscientist` and
    `just research-hypothesis openscientist ...
    ldhd_hydroxyacid_neurotoxicity_model`; the first disease-level run timed
    out at the provider's 3600 s limit and was resubmitted with a longer
    timeout. Neither produced a report: both exceeded a 7000 s client
    timeout. The disease-level job was cancelled on timeout; the hypothesis
    job was still queued at the provider and its job record is committed at
    kb/hypotheses/D-Lactate_Dehydrogenase_Deficiency/ldhd_hydroxyacid_neurotoxicity_model/openscientist.md.job.yaml
    so the report can be fetched later. Nothing in the entry depends on
    either.

    Structure and variant analysis (computed in this session, scripts not
    committed here; the companion LDHD review in ai4curation/ai-gene-review
    carries the reproducible version). UniProt Q86WU2 features; NM_153486.4
    and NM_194436.3 coding sequences translated and compared, which showed
    that the literature (507-residue isoform 1), ClinVar/gnomAD (MANE Select,
    484-residue isoform 2) and PMID:38373542 (offset 51) number the same
    residues differently; pairwise alignment of human to mouse LDHD; minimum
    heavy-atom distances from each variant residue to FAD, Mn2+ and D-lactate
    in PDB 8JDE, relative solvent accessibility, and side-chain hydrogen
    bonds; AlphaFold AF-Q86WU2-F1 v6 pLDDT; exon structure of ENST00000300051
    from Ensembl REST to place the frameshift in the last exon; ClinVar
    esummary for all LDHD records; gnomAD v4 GraphQL for constraint and
    allele counts. One literature inconsistency was found and recorded in the
    entry: the abstract of PMID:37021930 writes c.206C>T where the reference
    base is T (c.206T>C, p.Val69Ala).

    Not done: no treatments section (no quotable source; recorded as a
    knowledge-gap discussion), no classifications block (the ICIMD and
    Harrison placements were not looked up), no datasets.

    Reconciliation with the gene review. The entry was checked against the
    LDHD review in ai4curation/ai-gene-review (pull 7124), which reached the
    same residue placements independently. Changes made here as a result:
    the molecular function terms are GO:0140170 and GO:0004458 with
    cytochrome c as the acceptor (PMID:38413804, fetched and quoted); the
    face of the inner membrane and the oligomeric state are stated as
    unsettled; and the gnomAD loss-of-function count is restricted to the
    MANE transcript, because the commonest stop-gain (p.Trp223Ter) lies in
    the isoform-1-only segment.

    Validation: just validate-disorders (schema, terms, references; 87 of 87
    snippets verified), just check-gene-namespaces-online, just
    check-genereviews --online (no chapter), and the offline gates listed in
    CLAUDE.md under "Evidence and Reference Workflow".

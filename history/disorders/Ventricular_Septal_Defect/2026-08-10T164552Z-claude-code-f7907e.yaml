  summary: 'Second review round: phenotypes, catheterization, PAH agents, mouse model'
  details: |
    Second round of review fixes. Added four presenting phenotypes: heart murmur with PARTIAL evidence from a newborn physical-examination screening study, plus tachypnea, hepatomegaly, and recurrent respiratory infections carried as descriptions with notes stating that no cited source documents them in ventricular septal defect specifically. Used HP:0030148 Heart murmur rather than the reviewer-suggested HP:0031667 Holosystolic murmur, because the available evidence establishes murmur as the commonest abnormal newborn examination finding and does not characterize its timing; the holosystolic character is stated in the description as a prose claim. Added cardiac catheterization to the diagnosis block, which the entry's own operability and Eisenmenger reasoning depends on. Added bosentan and sildenafil as therapeutic_agent on the targeted PAH therapy, with supporting evidence from the already-cached review; the reviewer-suggested CHEBI:59784 for bosentan is actually diphenoxylate hydrochloride, so the OAK-verified CHEBI:51450 was used instead. Added an animal_models entry for the Nkx2-5 heterozygous mouse with its mapped modifier loci and genotype-conditional maternal-age effect, which is the experimental result reconciling the entry's two competing hypotheses. Validated: schema OK, terms OK, lints clean, 60/60 snippets verified against cached references.

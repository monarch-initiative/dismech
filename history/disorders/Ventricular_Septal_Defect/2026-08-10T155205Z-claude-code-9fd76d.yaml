  details: |
    Addressed the automated review's nine IMPORTANT findings. Added has_subtypes for muscular, perimembranous, and doubly committed juxta-arterial defects, each with its own evidence, which also corrects a claim in the original PR body that subtype was already carried explicitly when it was prose only. Added a diagnosis block covering transthoracic and fetal echocardiography, recording that every occurrence figure in the entry comes from universal newborn screening rather than clinical referral. Added three structured prevalence records separating birth prevalence from one-year point prevalence. Added an inheritance block with Sporadic and Non-Mendelian inheritance entries. Rewrote environmental to add influences_mechanisms edges so both exposures now join the pathograph, and added maternal diabetes with a defect-specific relative risk of 1.31. Wired six new causal edges from pathophysiology nodes to phenotypes, resolving the dead-end volume-overload node. Retyped transcatheter closure from Surgical Procedure to Therapeutic Procedure, added a diuretic treatment with an NCIT therapeutic_agent, and removed the folic acid duplication between treatments and environmental. Three phenotypes that previously had no evidence now carry the one review statement that genuinely applies, graded PARTIAL where it reaches further than the source does; notes record that no cited source quantifies growth failure or chamber dimensions in ventricular septal defect and that none was manufactured. Validated: schema OK, terms OK, snippet-length and folded-hyphen lints clean, 53/53 snippets verified against cached references.

  details: |
    New Disease entry for ventricular septal defect, organised around the inversion of the interventricular pressure gradient rather than around the anatomy. Eight pathophysiology nodes with two mutually exclusive downstream branches off the same anatomic node: spontaneous closure, which is the majority outcome, and progressive pulmonary vascular disease ending in Eisenmenger physiology where closure becomes contraindicated. One conforms_to declared, on the pulmonary vascular arm only, targeting pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling with shunt overcirculation substituted for the BMPR2 or acquired-injury trigger. Two mechanistic_hypotheses with edge-level opt-in: stochastic_developmental_error (CANONICAL, anchored on 10 percent monozygotic twin concordance) and transcriptional_network_lesion (ALTERNATIVE, GATA4-NKX2-5-TBX5). Two discussions: an OPEN_QUESTION on the two-sided intervention window, and a KNOWLEDGE_GAP asking whether the stochastic residue is genuine developmental noise or undetected somatic causes, with a proposed discordant-twin experiment. Notes record that several passages in the PMID:39711769 cache carry text-extraction whitespace artifacts, and that snippets quote around them rather than reproducing the corruption. Validated: just validate (schema OK), just validate-terms (OK), and 36/36 snippets verified against cached references.

  summary: 'Review response: HNRNPU DEE54 - correct organoid claim, add mechanism
    and phenotype depth'
  details: |
    Addressed the review of PR 8907. Finding 1: the HUMAN_MODEL_MISMATCH discussion asserted that the organoid reports transcriptional dysregulation but not progenitor death; PMID:36594023 in fact reports significant reductions in progenitor populations and significantly smaller organoids at the heterozygous human dose. The rationale was rewritten and the correcting evidence added, and the organoid model now links to Neural Progenitor Cell Death as well as to the transcriptional node. Finding 2: added p53-dependent canonical and non-canonical death mechanism and the SRSF3 rescue to the progenitor node from the already-cached PMID:35864088; added PMID:28283832 for the 1q43q44 contiguous-gene dissection, which shows AKT3 drives microcephaly and ZBTB18 the callosal anomalies while HNRNPU drives epilepsy and the degree of intellectual disability, correcting the earlier claim that the deletion and point-mutation routes simply converge; added PMID:37120726 for the DNA methylation episignature as a diagnostic biomarker. Finding 3: added an extraneurological phenotype node for the GeneReviews cluster. Finding 4: added a routine surveillance treatment and the prenatal/preimplantation testing option. Suggestions: dropped severity SEVERE on intellectual disability since the source says moderate to severe. Also fixed a CI failure: six evidence snippets had been trimmed below the five-word minimum and were restored to the full percentage sentence. Validated with just validate 73/73 snippets verified, just validate-terms passed, check_snippet_length, just check-duplicate-keys, and just check-title-snippets.

  summary: 'Review round 2: add dose-matched heterozygous Hnrnpu mouse model'
  details: |
    Addressed the carried-forward non-blocking suggestions on PR #8907. Resolved PMC10569524 to PMID:37782669 via the NCBI ID converter and fetched it with just fetch-reference. Added the Hnrnpu+/113DEL heterozygous mouse (Dugger et al., PLoS Genet 2023) to animal_models with three modeled_mechanisms links: RECAPITULATES against Cortical Network Hyperexcitability with the lowered maximal electroconvulsive threshold as readout, which supplies the direct excitability measurement that node previously lacked; and two FAILS_TO_RECAPITULATE links, against Recurrent Seizures (no spontaneous epileptiform activity across 300+ hours of video EEG) and Loss of Cortical Structure (brain size, callosal morphology, cortical thickness and hippocampal width all unchanged), each carrying limitations and evidence as the schema requires for a negative claim. Added the electroconvulsive-threshold evidence item directly on the Cortical Network Hyperexcitability node and rewrote its description accordingly. Extended the mismatch_conditional_truncation_versus_human_haploinsufficiency discussion: the dose-matched mouse lands on the patient side of the dose argument, qualified by its own roughly 20-25 percent rather than 50 percent reduction in cortical hnRNP U. Clarified the lesion node so it no longer says the point-variant and 1q44-deletion routes are the same lesion, matching the sharpened genetic notes. Validation: just validate passed with 86/86 snippets verified against cached references (up from 73/73), just validate-terms passed, no duplicate keys, no new title-quoting or under-length snippets.

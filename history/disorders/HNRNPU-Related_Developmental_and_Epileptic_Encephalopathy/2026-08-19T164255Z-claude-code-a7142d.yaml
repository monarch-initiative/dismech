  summary: 'Review round 3: supports convention, readout scoping, NCIT specificity'
  details: |
    Third review round on PR #8907, taking all three non-blocking suggestions. Suggestion 1: changed supports REFUTE to SUPPORT on the six evidence items inside the two FAILS_TO_RECAPITULATE modeled_mechanisms links of the Hnrnpu+/113DEL mouse, at both link and readout level. A link's evidence attests that the model is informative for the node in the way the relationship states; where the relationship is that the model fails to recapitulate, a negative result supports that claim rather than refuting it, and REFUTE negates twice. An independent audit of the whole KB confirmed the convention more strongly than the review reported: across every other FAILS_TO_RECAPITULATE link the supports values are SUPPORT 20, NO_EVIDENCE 2, PARTIAL 1, and REFUTE 0. The functional consequence is the deciding one, since any consumer filtering on supports SUPPORT would have dropped these items. The discussion-level REFUTE item was deliberately left alone: a discussion poses a question and evidence bearing on it can genuinely cut either way, which is how the KB uses REFUTE elsewhere. Suggestion 2: removed the Cortical Hnrnpu expression in the heterozygote readout from the hyperexcitability link. The reviewer noted the schema forces a readout target to repeat its link target, so a dose measurement filed under an excitability node asserts, when lifted out standalone, that decreased Hnrnpu expression is a readout of network hyperexcitability. Rather than leave it, the readout was dropped: the same measurement is already stated in the link limitations and curated as a PARTIAL evidence item on the mismatch discussion, so no claim and no verified snippet is lost. Suggestion 3: moved two treatments off the generic NCIT C15747 Supportive Care term, to NCIT C15322 Respiratory Therapy for the oxygen CPAP BiPAP treatment and NCIT C15433 Nutritional Support for feeding therapy and enteral support, and a third to NCIT C15843 Preventive Intervention for the avoidance treatment. Routine Surveillance was left on Supportive Care because NCIT C15719 Surveillance is not reachable from NCIT C25218 Clinical Intervention or Procedure and so is not a valid TreatmentTerm value; reachability was checked with OAK before editing rather than discovered through a failed validation. NCIT has no clean enteral nutrition clinical-action term, only questionnaire items, complications, and gastrostomy placement procedures. Validation: just validate passed with 85 of 85 snippets verified against cached references, one fewer than the previous 86 because of the removed readout; just validate-terms passed; no duplicate keys; no new title-quoting or under-length snippets; 6558 tests passed; no cache CSV churn since all three NCIT terms were already cached from other entries.

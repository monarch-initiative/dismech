  summary: 'Create: HNRNPU-Related Developmental and Epileptic Encephalopathy DEE54'
  details: |
    New entry for DEE54 MONDO:0033363, HNRNPU haploinsufficiency. Deep research via "just research-disorder claude_code"; NEC preflight PASS with HNRNPU mentioned 59 times and report OMIM 617391 matching the MONDO xref. GeneReviews baseline PMID:35274911 cross-referenced across all four chapter domains: clinical characteristics, diagnosis, management including the agents-to-avoid section, and genetic counseling. Pathophysiology de-bundled into 12 atomic nodes carrying three parallel molecular arms, because hnRNP U has three documented functions and the disease models cannot currently separate them: an alternative-splicing arm, a chromatin-architecture arm via the SAF-A/RNA nuclear mesh, and a transcriptional arm. Progenitor cell death and radial migration are kept as separate cellular consequences since the rescue experiments correct them separately. Frequency bands are derived from published percentages: developmental delay about 95% VERY_FREQUENT, seizures 83-95% VERY_FREQUENT, intellectual disability 52% FREQUENT, craniofacial dysmorphism 54-95% banded FREQUENT at the lower bound so as not to over-claim, microcephaly 14-20% OCCASIONAL. Four discussions: a KNOWLEDGE_GAP on which of the three functions is the dose-sensitive one, two HUMAN_MODEL_MISMATCH entries covering the conditional-truncation versus heterozygous dose gap and the organoid developmental-window limit, and an OPEN_QUESTION on why valproate is unusually effective here. Validated with just validate 57/57 snippets verified, just validate-terms passed, just check-duplicate-keys, and just check-title-snippets.

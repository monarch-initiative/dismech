  summary: Removed deprecated prevalence.percentage fields, split CHD7 and MYCN/SOX2/FOXF1 into molecular-activity-grounded pathophysiology nodes upstream of Developmental signaling defects in foregut morphogenesis, added an atomic Anastomotic stricture pathophysiology node, and linked surgical repair and balloon dilatation via evidenced target_mechanisms.
  details: Reviewed Esophageal_Atresia.yaml against cached references. Removed deprecated prevalence.percentage fields in favor of structured rate_per_100000 and rate_low/rate_high fields. Added upstream molecular-activity-grounded pathophysiology nodes CHD7 chromodomain helicase DNA-binding dysfunction (GO:0004386 helicase activity and GO:0003677 DNA binding) and Foregut transcription factor dysfunction (GO:0003700 DNA-binding transcription factor activity for MYCN, SOX2, and FOXF1) feeding into Developmental signaling defects in foregut morphogenesis, and broadened the description on Developmental signaling defects in foregut morphogenesis to cover developmental signaling and transcriptional/chromatin regulators. Added an atomic Anastomotic stricture pathophysiology node downstream of Interrupted esophageal continuity and tracheoesophageal communication (with a direct downstream edge to Dysphagia), and linked Primary surgical repair with tracheoesophageal fistula ligation and Balloon dilatation for post-repair anastomotic strictures to their target pathophysiology nodes via evidenced target_mechanisms.

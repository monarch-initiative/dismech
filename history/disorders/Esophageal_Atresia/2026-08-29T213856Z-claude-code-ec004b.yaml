    # Evidence review — Esophageal_Atresia.yaml

    ## Stats
    - 66 evidence items checked (every `reference:` block, including subtype, prevalence, progression, pathophysiology node + downstream-edge, phenotype, genetic, diagnosis, and treatment evidence).
    - 10 references read in full from cache: PMID:20425471 (full text), PMID:27993359, PMID:31571760 (full text), PMID:22247246, PMID:27190912, PMID:31000707, PMID:32515280, PMID:27579697, PMID:23877544, ORPHA:1199.
    - 62 verified fully clean (exact snippet, correct claim, honest grading, correct evidence_source). No cache files missing; every snippet is an exact substring of its cache body, including all 22 ORPHA:1199 table-row quotes, which match the cached Epidemiology/Phenotypes tables row for row (frequencies included).

    ## Findings
    1. Location: phenotypes / "Absence of stomach bubble on fetal sonography" (line 794). Reference PMID:22247246. Problem: second evidence item quotes "Prenatal detection rates varied by registry from >50% of cases to <10% of cases." — this reports overall prenatal detection of EA and never mentions the stomach-bubble sign, so it supports prenatal detectability generally, not this specific phenotype (the ORPHA:1199 row in the same block does carry the phenotype). `supports: SUPPORT` is generous; PARTIAL would be more honest. Severity: MINOR. ACTION: reported only — the grade is defensible as contextual support and the primary ORPHA evidence is sound; not plainly wrong under the conservative fix policy.
    2. Location: has_subtypes / Gross Types A, B, D, E (lines 33, 53, 86, 101). Reference PMID:20425471. Problem: the same quote "Five subtypes are described, based on the location of the atresia and the type of connection between trachea and esophagus [2]." is reused for four subtypes; it establishes the five-type Gross classification but does not individually name or characterize each subtype. Severity: NOTE. ACTION: reported only — the explanations honestly claim only "supports inclusion of the ... subtype", and the classification claim is what the quote makes; Types A and C carry additional quantitative cohort evidence (PMID:27993359).
    3. Location: pathophysiology / "Incomplete embryonic foregut compartmentalization" (line 266). Reference PMID:32515280, `evidence_source: MODEL_ORGANISM`. Problem: the quoted sentence "Esophagus and trachea arise from a common origin, the anterior foregut tube." is a general developmental-biology statement rather than a specifically animal-model finding, though the cited publication is a review of genetic mouse models and iPSCs. Severity: NOTE. ACTION: reported only — MODEL_ORGANISM is defensible for this publication and not clearly wrong.
    4. Location: pathophysiology / "Post-repair esophageal dysmotility..." downstream edge to Gastroesophageal reflux (line 477). Reference PMID:27579697. Problem: snippet "diagnosis, and treatment of gastroesophageal reflux" is a short clause establishing only that the guideline covers GERD in EA/TEF, not the mechanistic edge (dysmotility → reflux); the edge itself is marked INDIRECT_KNOWN_INTERMEDIATES with an intermediate listed, and the explanation claims no more than the quote gives. Severity: NOTE. ACTION: reported only.
    5. Location: prevalence (line 112). Problem: deprecated free-text `percentage:` field is populated ("2.43 per 10,000 births" / "1-5 per 10,000") alongside the structured slots. Not an evidence defect; the structured `rate_per_100000: 24.3` and `rate_low/rate_high: 10.0/50.0` correctly normalize the quoted figures. Severity: NOTE. ACTION: reported only (out of scope for the evidence-fix policy).

    ## Sections reviewed
    has_subtypes, prevalence, progression, pathophysiology (incl. downstream edges), phenotypes, genetic, diagnosis, treatments, datasets (no evidence blocks; provenance in notes as policy requires)

    ## Verdict
    This is a high-quality, honestly graded entry: every snippet is an exact cache substring, quantitative claims (85%/7% anatomy split, 35% CHD, 2.43/10,000 prevalence) trace directly to the quoted result sentences, evidence_source values correctly separate the human-cohort sentences from the animal-model sentences of the same review (PMID:20425471), and ORPHA structured rows are used exactly as designed. The only weaknesses are a handful of contextual/fragment quotes graded SUPPORT where PARTIAL would be stricter; nothing required correction.

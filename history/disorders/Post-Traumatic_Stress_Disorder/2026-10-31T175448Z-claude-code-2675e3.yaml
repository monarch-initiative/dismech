  summary: Add trauma exposure as environmental trigger; wire avoidance and depressive
    phenotypes
  details: |
    Added an environmental entry for exposure to a traumatic event with a TRIGGERS influences_mechanisms link to the Traumatic Stress Exposure node. Entry-level evidence is DSM-5-TR Criterion A quoted in DOI:10.1192/bja.2024.27; the link cites the TRACK-TBI cohort (DOI:10.1038/s41398-023-02313-9). The exposure is left unbound because ECTO label searches for trauma, traumatic, psychological, life event, disaster, combat, assault, injury, neglect and child abuse returned no term, and ECTO:6000001 exposure to violence is narrower than the exposure; the searches are recorded in the entry's notes. Connected the two previously unwired phenotypes: Threat-Circuit and Fear-Extinction Dysregulation -> Avoidance of Trauma Reminders (PMID:37535308, INDIRECT) and HPA-Axis Regulation Alteration -> Depressive Symptoms (PMID:33789596, INDIRECT, correlational). Added evidence to the previously bare Threat-Circuit -> Hyperarousal and Anxiety edge and an Avoidance -> Intrusive Re-experiencing sequela (PMID:37535308). All four phenotypes now have an incoming causal edge. Validated with just validate, count-verified-snippets (57/57), validate-terms, and the whole-repo offline gates.

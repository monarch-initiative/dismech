  summary: 'Follow-up to PR 16220: qualify TRACK-TBI evidence, cite non-progression
    statement'
  details: |
    Follow-up to the optional review suggestions on PR 16220 (review 5724756434). On the Exposure to a traumatic event -> Traumatic Stress Exposure link, the TRACK-TBI item (DOI:10.1038/s41398-023-02313-9) is now directness INDIRECT, and its explanation says the cohort is limited to mild traumatic brain injury, so psychological trauma is confounded with physical brain injury. The same 16.3% sentence is added as entry-level evidence for the description's statement that most exposed people do not develop persistent PTSD, also INDIRECT for the same reason. Following the review of PR 16267, added a population-level source, Liu et al. 2017 from the WHO World Mental Health surveys (PMID:28055082), which reports PTSD after 4.0% of randomly selected traumatic experiences and lifetime trauma exposure in 70.3% of respondents. It is cited at entry level for the non-progression statement (DIRECT) and on the exposure link (INDIRECT, since it does not measure the stress response). The TRACK-TBI items are kept. The broader question of how to model psychosocial stressors is in issue 16203. Validated with just validate, validate-terms, count-verified-snippets (61/61) and the offline KB gates.

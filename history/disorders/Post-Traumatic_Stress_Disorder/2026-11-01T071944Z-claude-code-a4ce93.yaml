  details: |
    Follow-up to the optional review suggestions on PR 16220 (review 5724756434). On the Exposure to a traumatic event -> Traumatic Stress Exposure link, the TRACK-TBI item (DOI:10.1038/s41398-023-02313-9) is now directness INDIRECT, and its explanation says the cohort is limited to mild traumatic brain injury, so psychological trauma is confounded with physical brain injury. The same 16.3% sentence is added as entry-level evidence for the description's statement that most exposed people do not develop persistent PTSD, also INDIRECT for the same reason. A better source on trauma in general is still wanted. The broader question of how to model psychosocial stressors is in issue 16203. Validated with just validate, validate-terms, count-verified-snippets (58/58) and the offline KB gates.

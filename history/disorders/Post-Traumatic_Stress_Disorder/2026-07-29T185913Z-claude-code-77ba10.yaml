  summary: Add investigational ketamine treatment and ketamine EEG mechanistic hypothesis
    (PMID:42405700)
  details: |
    Addresses lit-scan issue #5832 (PMID:42405700, Int J Neuropsychopharmacol 2026, Shadli et al).

    Added a 'Ketamine' entry to treatments: modality SMALL_MOLECULE, treatment_term NCIT:C15986 Pharmacotherapy, therapeutic_agent CHEBI:6121 ketamine, target_mechanisms MODULATES on the existing 'Threat-Circuit and Fear-Extinction Dysregulation' node. Framed explicitly as investigational and off-label; notes the intramuscular route (0.5-1.0 mg/kg), which differs from the IV/intranasal esketamine route curated for major depressive disorder.

    Supporting evidence for the treatment entry is marked supports: PARTIAL rather than SUPPORT because the ketamine-responsiveness statement appears in the paper's Background and summarizes prior literature; this study is a mechanistic EEG study with no efficacy endpoint. The explanation field records that reasoning so a reviewer can audit it.

    Added a new top-level mechanistic_hypotheses block (the entry previously had none) with hypothesis_group_id emerging_ketamine_eeg_signature, status EMERGING, carrying the two primary abstract findings: the TR-PTSD dose- and band-dependent EEG power change versus TR-MDD, and the authors' diagnosis-specificity conclusion. The description bounds the claim to a single unreplicated study of 22 TR-PTSD patients (20F, 2M) and flags that the EEG/symptom causal direction is unresolved.

    Data-quality note recorded in an evidence explanation: the abstract's Results sentence quotes 'alpha at 0.05 mg/kg' while Methods specify 0.5 or 1.0 mg/kg I.M. The snippet is reproduced verbatim and the 10x discrepancy is flagged as an apparent source-publication error rather than silently corrected or propagated as a dosing claim.

    Validation: reference fetched via 'just fetch-reference PMID:42405700' (abstract_only; publisher PDF returned 403). Schema and term validation pass. All three PMID:42405700 snippets in this file were additionally verified by hand as whitespace-normalized exact substrings of references_cache/PMID_42405700.md, because the local linkml-reference-validator reports 'Total checks: 0' on this machine (reproduced on unmodified files, so pre-existing and not specific to this change). Term validation required UV_PYTHON=3.12; the default resolution to Python 3.14 crashes oaklib via pyhornedowl.

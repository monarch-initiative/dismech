  summary: 'Phenotypes: DSM-5-TR symptom-level HPO bindings'
  details: |
    Phenotypes now cover the DSM-5-TR intrusion, negative-mood and arousal criteria with specific HPO terms: Trauma-Related Nightmares (HP:0032938), Dissociative Flashbacks (HP:0032940), Hypervigilance (HP:5200231), Exaggerated Startle Response (HP:0002267), Irritability and Angry Outbursts (HP:0000737), Problems with Concentration (HP:0031987), Sleep Disturbance (HP:0002360) and Emotional Numbing (HP:0030213). Each cites the criterion text as reproduced in the DSM-5-TR/ICD-11 criteria table of DOI:10.1192/bja.2024.27 (cached as full text). Intrusive Re-experiencing was narrowed to intrusive memories, since nightmares and flashbacks are now separate phenotypes, and its evidence was replaced with criterion B1; the earlier review-abstract quote naming nightmares and flashbacks moved to those two phenotypes. HP:0032937 was relabelled to its current HPO label, Intrusive mental imagery (the previous label is now an exact synonym); the stale cache row was removed and re-derived. Added INDIRECT edges from Threat-Circuit and Fear-Extinction Dysregulation to Dissociative Flashbacks, Hypervigilance and Exaggerated Startle Response, citing PMID:31991875 (fear reactivity and traumatic-memory retrieval). Added an arousal-cluster evidence item to Hyperarousal and Anxiety. Irritability and Sleep Disturbance each carry a second evidence item, from the umbrella review DOI:10.1017/S0033291724002319, recording that ICD-11 omits these symptoms from its PTSD criteria as not specific to PTSD. Validated with just validate-disorders (all snippets verified).

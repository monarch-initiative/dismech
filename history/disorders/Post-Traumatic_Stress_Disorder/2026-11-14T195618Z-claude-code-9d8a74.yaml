  summary: 'Mappings: ICD-10-CM F43.1; definitions: DSM-5-TR rule'
  details: |
    Added ICD10CM:F43.1 (Post-traumatic stress disorder (PTSD)) as skos:exactMatch, copied from MONDO's exact cross-reference (MONDO mapping set mondo.sssom.tsv retrieved 2026-11-14 (md5 1a9da85954d80718f635a32792802f05)). Added a DIAGNOSTIC_CRITERIA definition for individuals older than 6 years from the DSM-5-TR criteria table in DOI:10.1192/bja.2024.27: criterion A (1 of 4 exposure routes), B (1 of 5 intrusion symptoms), C (1 of 2 avoidance symptoms), D (2 of 7), E (2 of 6), and F-H (duration over a month, impairment, substance/medical exclusion); all sets required. The criteria for children 6 years and younger, the dissociative subtype and the delayed-expression specifier are not encoded. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

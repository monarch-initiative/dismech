  summary: 'Integrate assessed OpenScientist findings: chronic-neuropathy heme-deficiency
    gap, non-cirrhotic HCC gap'
  details: |
    Integrated the RETAINED/QUALIFIED claims of the two existing codex assessments of the OpenScientist reports for canonical_hepatic_precursor_overproduction_model (SUPPORTED) and canonical_precursor_neurotoxicity_model (PARTIALLY_SUPPORTED). Added four evidence items and two discussions. (1) PMID:23344888 (Swedish acute hepatic porphyria cohort over 50, relative risk 86) added to the 'Precursor-associated primary liver cancer risk' pathophysiology node, explained as risk magnitude rather than precursor causality. (2) PMID:8550820 (rat pineal melatonin, ALA mimicking GABA in vivo) and PMID:27212246 (phase I rAAV2/5-PBGD, clinical trend with unchanged ALA and PBG) added to the existing unresolved_precursor_neurotoxicity_route discussion, whose rationale was extended to record that no intervention has separated ALA from PBG. (3) New HUMAN_MODEL_MISMATCH discussion neural_heme_deficiency_versus_precursor_toxicity, citing PMID:10207164 twice (chronic progressive motor neuropathy at normal or twofold ALA; the authors' conclusion favouring heme deficiency and hemeprotein dysfunction) and re-citing PMID:26062020 to scope its preserved hepatic microsomal heme to liver rather than nerve, with a proposed tissue-compartment heme experiment. (4) New KNOWLEDGE_GAP discussion noncirrhotic_hepatocarcinogenesis_mechanism, citing PMID:23344888 (cirrhosis frequency differs from other aetiologies) and PMID:36746260 (HepG2 at 25 mM ALA; authors state the HCC role rests on hypotheses), with a proposed mutational-signature experiment. Deliberately not integrated: PMID:20133237 (two-case liver transplant series), because the RETAINED hepatic-source claim is already curated with the stronger explanted-liver biochemistry of PMID:26062020 plus two management reviews; PMID:36883675, a sponsor-authored givosiran exposure-response model that both assessments explicitly say does not establish clinical mediation, and whose biochemical point is already carried by PMID:31994716; PMID:9070373 and PMID:25220386, redundant chemistry and cell-culture plausibility citations for a claim being qualified as not human-causal, where PMID:36746260 is the AIP-and-HCC-specific study. Hypothesis status values were left CANONICAL, as both reports recommend. No ontology terms were added. Verified with count-verified-snippets (162/162), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading.

  summary: 'Review: Acute Intermittent Porphyria'
  details: |
    Comprehensively re-reviewed classic low-penetrance heterozygous HMBS acute intermittent porphyria. Distinguished carrier prevalence from symptomatic disease and latent, episodic, recurrent, and chronically symptomatic states; rebuilt and qualified the hepatic precursor-overproduction and precursor-neurotoxicity models; expanded kidney and liver-cancer complications, phenotypes, diagnosis, management, clinical-trial, animal-model, experimental-model, and open evidence-gap coverage; and explicitly separated severe homozygous disease and its model from classic AIP. New reference caches were generated only with just fetch-reference. Focused schema, terminology, graph-connectivity, reference-cache, and diff-integrity findings are recorded from the final audits.

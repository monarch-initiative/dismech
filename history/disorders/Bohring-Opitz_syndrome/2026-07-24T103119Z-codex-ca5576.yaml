  summary: 'Review: Bohring-Opitz syndrome'
  details: |
    Refined the ASXL1 causal model by replacing a simple decreased-gene modifier with abnormal function, adding explicit confidence and causal directness, and preserving uncertainty over the molecular effect of late truncating variants. Added source-backed natural history, high clinical burden, five clinically central phenotypes, supportive management, Wilms-tumor surveillance limitations, updated GSE230696 metadata, two current observational registries, and open knowledge gaps. Verified 65 normalized-exact evidence snippets and all citation titles, ontology terms, schema, 15/15 phenotype connectivity, a 24-node/23-edge graph without integrity issues or orphan targets, 99.4% compliance, targeted CX2/KGX exports, and the Monarch D2P audit. The D2P audit retained 90 granular external gaps rather than bulk-importing claims without exact cached support.

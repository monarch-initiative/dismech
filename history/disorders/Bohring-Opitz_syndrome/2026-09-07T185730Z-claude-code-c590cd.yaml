  summary: 'Edit: Bohring-Opitz syndrome - promote assessed provider findings'
  details: |
    Screened the entry's contested-mechanism hypothesis with the OpenScientist hypothesis deep-research runner, assessed the report into kb/hypotheses/<disease>/<hypothesis_id>/assessments/, and promoted only claims that survived that review. Bohring-Opitz gained three references: direct protein-level detection of truncated ASXL1 and sufficiency of a truncated fragment for neural-crest defects on the dominant/gain side, and constitutive Asxl1 deletion reproducing BOS-like malformations on the loss side, with the controversy rationale widened accordingly. Arboleda-Tham gained no new evidence; its late-truncating hypothesis was reframed as a severity modifier layered on a haploinsufficiency baseline rather than a competing primary mechanism. ADNP gained two items from one paper, mutant mRNA detected in patient blood supporting the branch premise and a systematic failure to detect mutant protein in patient material recorded as REFUTE, with the hypothesis description amended so it no longer implies the question is merely unexamined. The variant functional_impact_category stays UNKNOWN in all three: no run performed the comparison that would settle it, and nothing from any provider computational analysis was promoted because every bundle omitted the manifest and code it claimed. Validated with linkml-validate, the reference snippet audit, term validation, and the snippet-grading, enum, duplicate-key, entity-ref, title-snippet and reference-title checks.

  details: |
    New KB entry for Chuvash polycythemia (MONDO:0009892), the first recognized congenital disorder of oxygen sensing, curated from a claude_code deep-research report (research/Chuvash_Polycythemia-deep-research-claude_code.md), whose own reference validation reported 52/52 references verified, 15/15 quotes valid, confabulation rate 0.0. Nine pathophysiology nodes from impaired pVHL binding to hydroxylated HIF-alpha through normoxic HIF stabilization and HIF target gene activation, fanning out to erythroid expansion, the prothrombotic state, pulmonary vascular tone and remodeling, hepcidin suppression, glycolytic reprogramming, and increased solid organ size. STRUCTURAL DECISION: the edge to the prothrombotic state runs from HIF target gene activation directly, in parallel with the erythroid arm rather than through it, because prospective cohort data show erythropoietin elevation and not hematocrit correlates with thrombotic risk; phlebotomy is modeled with INHIBITS on the erythroid node plus two REFUTE evidence items for its harms. Two mechanistic_hypotheses recorded: canonical_hif_stabilization (CANONICAL) and vhl_socs1_jak2_dysregulation (ALTERNATIVE) with the contradicting human H191D progenitor data attached as REFUTE. Fifteen phenotypes, two biochemical markers, one animal model with two modeled_mechanisms links, four discussions including the mechanism of the absent tumor phenotype. Declares conforms_to pulmonary_vascular_remodeling on the pulmonary node; conformance to thrombogenesis was considered and deliberately NOT declared because the cited evidence is for PAI-1/VEGF/endothelin-1 elevation rather than the module's coagulation-cascade node. HONESTY NOTES: PMID:39113647 (belzutifan human case) and PMID:31289208 (hematocrit letter) both cache with content_type unavailable, so neither is cited for a snippet; the belzutifan treatment carries only mouse evidence and the human case is recorded in notes with its compound-heterozygote caveat. Worldwide prevalence recorded as UNKNOWN per Orphanet rather than derived by Hardy-Weinberg from endemic allele frequencies. Validated: just validate passed (schema + terms) and just count-verified-snippets reported 83/83 verified against cached references. Three snippets were trimmed during verification because a square-bracketed abbreviation in the PMID:9058738 abstract is stripped by the snippet validator; the affected explanations state the omitted figure rather than quoting it.

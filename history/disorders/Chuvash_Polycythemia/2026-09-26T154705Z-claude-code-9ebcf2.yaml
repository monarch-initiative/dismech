  summary: Rebind pVHL molecular function to the ligase-substrate adaptor term
  details: |
    The molecular function on the node 'Impaired pVHL Binding to Hydroxylated HIF-alpha' was changed from GO:0004842 (ubiquitin-protein transferase activity) to GO:1990756 (ubiquitin-like ligase-substrate adaptor activity), keeping modifier DECREASED. The node describes pVHL as the substrate-recognition subunit of the Cullin-2 RING E3 ligase, and describes the Arg200Trp defect as weakened binding of hydroxylated HIF-alpha. That is an adaptor function; the transferase activity belongs to the ligase's catalytic core. Found with runoak -i ols:go search 'l~substrate adaptor', which returned GO:1990756, GO:0140767 enzyme-substrate adaptor activity and GO:0140768; GO:1990756 is the ubiquitin-specific one. Validated with linkml-validate and just validate-terms.

  summary: 'Create: Teebi_Hypertelorism_Syndrome_2'
  details: |
    Created the entry for the CDH11-associated Teebi hypertelorism syndrome
    (MONDO:0030674, OMIM 619736) from PubMed literature: the founding cohort
    (PMID:33811546, 19 individuals from 9 families), a 2024 de novo case
    (PMID:37646430) and the ClinGen gene-disease validity record
    (Moderate, AD). Model-organism evidence comes from Xenopus cadherin-11
    neural crest studies (PMID:11688555, PMID:24392028, PMID:19528317) and
    Cdh11 null mice (PMID:11450702, PMID:26188246).

    The cached copy of PMID:33811546 was abstract_only with
    full_text_attempted set; it was refetched with --force and is now
    full_text_xml carrying Table 1. The 28 Elsahy-Waters_Syndrome snippets
    that cite it still verify (28/28) after the refetch.

    relationship_type is left unset on the CDH11 record because ClinGen
    rates the pair Moderate and the schema reserves CAUSATIVE for Definitive
    or Strong. functional_impact_category is left unset because the source
    authors and ClinGen both leave the mechanism open; a KNOWLEDGE_GAP
    discussion records the dominant-negative versus loss-of-function versus
    gain-of-function question. Heart, umbilical, genital, limb and
    neurodevelopmental phenotypes are deliberately left without upstream
    mechanism nodes except the heart, which links to a cardiac node supported
    only indirectly by null-mouse valve data.

    The OpenScientist deep-research run timed out once in the provider queue
    and was relaunched with a 7200 s timeout. Its report arrived after the
    entry was written and is committed as a lead: 13/13 references resolved,
    and preflight-dr PASS (CDH11 mentioned 65 times, OMIM 619736 matches).
    It adds no claim the entry lacks; its one off-topic citation
    (PMID:42008577, cadherin-11 as a bacterial adhesin receptor) was not used.

    Validation: just validate, validate-terms, count-verified-snippets
    (84/84), check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms, check-block-scalar-comments,
    check-reference-titles, check-gene-validity and validate-disorders all
    passed; check-genereviews found no GeneReviews chapter.

  details: |
    Rebuilt the disconnected Akinetopsia model into an evidence-calibrated causal graph: structural V5/MT network injury, paroxysmal MT/V5 hyperexcitability, and transient exogenous motion-network interference converge on cortical visual-motion integration failure and terminate in Global Akinetopsia and Hemifield Akinetopsia. Folded laterality, surviving-network, stimulus-speed, and bilateral-chronicity observations into node or edge context instead of duplicate mechanism stubs. Replaced the misleading hemifield visual-field-defect mapping with HP:0030222 Visual agnosia. Restricted environmental entries to external TMS and medication or intoxication exposures; moved stroke, posterior cortical atrophy, and Parkinson disease observations from differential diagnoses into supported structural etiologic context. Removed the nonspecific underlying-condition treatment and linked the single-case carbamazepine response to paroxysmal MT/V5 hyperexcitability with explicit uncertainty. Repaired both altered PMID:39996018 bilateral-lesion snippets using exact continued source text. Used only existing cached references and added no unsupported frequencies or molecular mechanisms.

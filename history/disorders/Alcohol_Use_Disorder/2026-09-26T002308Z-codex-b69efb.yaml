  details: |
    Reviewed all 255 evidence/claim inputs (195 distinct assertion owners) in the
    linked Jev evidence_claim_match.yaml, observed 2026-09-25T16:18:17Z. Its source
    SHA256 7f193ce61b4c20ad12869216bc7e7528c0cd5e2ce177e495d96819e21544b838
    matches the pre-edit disease file. The issue counts are correct after deduplicating
    by assertion_path: 82 owners with any MISMATCH, 166 with any PARTIAL, 177 in their
    union. Whole-input labels were 13 MISMATCH, 161 PARTIAL, 81 MATCH. These are
    pre-curation assessment counts; no classifier rerun is claimed.

    Full inventory disposition by section (reviewed owners; flagged owners):
    - prevalence (2; 2): retained. The overall and subgroup estimates, survey date,
      sample size, and response rate are supported by the same NESARC-III paper;
      one excerpt need not restate each other excerpt's result.
    - clinical_burden (1; 1): added AUD-specific disability evidence. Retained the
      separately identified all-alcohol GBD burden and treatment-gap estimates.
    - inheritance (1; 1): retained complementary heritability, shared-environment,
      and multi-ancestry association evidence; no Mendelian inheritance claim.
    - pathophysiology (88; 80): strengthened chronic GABA receptor plasticity,
      conditional liver progression, withdrawal sleep disturbance, negative
      reinforcement, and TLR4 glial/caspase endpoints. Replaced the general DSM
      threshold quote on impaired-control feedback with control criteria and
      marked the inference indirect. Other flags concern partial mechanistic
      resolution, organism/exposure scope, molecular annotations, or complementary
      citations; existing uncertainty and model qualifications were retained.
    - phenotypes (24; 19): replaced general withdrawal and liver-stigmata excerpts
      with sleep and liver-progression passages. Other clinical associations and
      their exposure/withdrawal qualifications were supported and retained.
    - genetic (6; 4): retained metabolic allele associations and explicit OPRM1
      pharmacogenetic uncertainty. The null genotype result correctly supports
      that caveat, despite its whole-input MISMATCH label.
    - environmental (3; 3): removed the susceptibility-caveat citation from the
      definitional consumption-to-exposure link. The parent exposure retains this
      appropriate caveat and its evidence; the link does not assert AUD causation.
    - treatments (24; 24): replaced topiramate genotype evidence at the efficacy
      claim with primary/secondary outcome results; clarified acamprosate context;
      added the positive ASAM alpha-2 agonist and beta-blocker recommendations
      beside their limitations. Retained efficacy/safety/contraindication evidence
      and the explicit primary-outcome uncertainty. Thiamine INHIBITS the named
      deficiency state; this enum flag does not justify RESTORES the deficiency.
    - biochemical (8; 8): added GGT, CDT, and MCV specificity evidence and CDT
      sensitivity evidence. Retained the independently cited assay ranges and
      cutoffs. MCV was not stale after the prior split: its specificity needed
      support, while 96/98 fL ranges already had their own source. LOINC identifiers
      are assay annotations, not findings expected in the sensitivity excerpt.
    - diagnosis (4; 3): retained threshold, differential, and qualified imaging
      claims. Individual symptom excerpts are partial support for compound
      criteria; diagnostic accuracy or specificity is not inferred from imaging.
    - clinical_trials (2; 2): retained registry-defined designs and dated status
      notes; classification and registry metadata flags do not establish a
      conflicting outcome result. No new efficacy is inferred from trial design.
    - animal_models (28; 26): replaced P-rat model-quality prose with intake data;
      removed the unsupported HAP/LAP F2 increase direction and quoted preference
      QTL results; sourced HDID blood ethanol from the selection study; used VTA
      DID reduction for the CRF readout; added both glial markers and the knockout
      caspase comparison. Retained reward/aversion and CeA null findings at their
      appropriate model-level context. Other flags concern species, model fidelity,
      nested independently evidenced readouts, and explicit translation limits.
    - experimental_models (3; 3): retained the culture-specific TLR4/NF-kappa-B
      findings and limits; these do not assert a measured patient phenotype.
    - discussions (1; 1): retained the explicit human/model translation warning;
      a selected model paper supports one part of the compound discussion.

    Confirmed mismatch families therefore include endpoint substitution, null-result
    misattribution, unsupported comparator direction, missing specificity evidence,
    and general snippets that do not state the claimed mechanism or symptom.
    Limited support by one selected snippet in a compound assertion is often real,
    but is not evidence that separately cited sibling claims are false. Additional
    false-positive interpretations include equating animal/exposure mechanisms with
    a claim to have diagnosed AUD in animals, and expecting canonical identifiers
    or curator fidelity judgments to appear verbatim in a paper.

    New literature: PMID:24219304 (HDID selection result) and PMID:36983134
    (biomarker specificity review), fetched with just fetch-reference. Regenerated
    PMID:26247973 through the same command to full_text_xml and repaired extraction
    spacing in its existing quotations. No cache was hand-edited. No source
    identifier migration was committed: attempted PMID:20554880/37934220 and
    canonical PMC URL alternatives did not provide the required full text.

    The remaining scientific limitations are explicitly retained: indirect human
    causal mediation, incomplete genetic mechanisms, and limited translation from
    selected rodent/culture systems. The review does not resolve those questions.
    Authoritative reference validation also remains blocked by current retrieval of
    the two existing PMC URL papers as reCAPTCHA pages and inability to regenerate
    PMID:32159228 full text. Incidental/degraded cache rewrites were restored.
    The final just validate-disorders run passed schema and term phases but reported
    33 reference errors: 32 reCAPTCHA title mismatches across the two PMC URL
    papers and one pre-existing full-text excerpt from PMID:32159228. After
    restoring incidental caches, count-verified-snippets verified 265/265
    strictly. validate-terms and validate-history passed. Folded-hyphen,
    snippet-length, title-snippet, snippet-grading, environmental-evidence,
    duplicate-key, entity-reference, causal-target and qualifier-term checks
    passed. Repository pre-commit hooks normalized generated cache whitespace;
    the staged diff has no whitespace errors.

    The handoff was actionable for an agent: exact evidence pointers, source links,
    and an executable audit inventory. For a human it required substantial source
    inspection and care with the difference between assertion owners and citation
    pairs. Its prior comment about stale MCV findings was not supported by the
    matching source hash; its animal-model examples were useful leads. Contextual
    quote review and inspection beyond the five examples were necessary.

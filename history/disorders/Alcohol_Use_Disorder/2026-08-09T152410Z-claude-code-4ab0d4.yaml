  summary: 'Create: Alcohol Use Disorder'
  details: |
    New Disease entry for Alcohol Use Disorder, bound to MONDO:0007079 (alcohol dependence) as the closest MONDO term to the DSM-5 construct; the terminology caveat is recorded in the entry's notes.

    Deep-research provider: claude_code. Run via `just research-disorder claude_code Alcohol_Use_Disorder`; 18 web searches over 16 turns, 34 citations, report at research/Alcohol_Use_Disorder-deep-research-claude_code.md.

    NEC preflight: `just preflight-dr research/Alcohol_Use_Disorder-deep-research-claude_code.md MONDO:0007079` returned SKIP, because MONDO records no causal gene for this complex trait and the automated gene check cannot discriminate. The manual fallback checks passed: the report's asserted OMIM 103780 matches the MONDO OMIM xref, the report's top gene mentions (ALDH2, ADH1B) are the correct alcohol-metabolism loci for this entity, and the queried name matches MONDO's synonym list (alcoholism / alcohol dependence).

    DR outputs were treated as leads, not ground truth, and every identifier was independently verified. Four errors were found and corrected: three HGNC IDs supplied by the report were wrong (hgnc:249 is ADH1A, not ADH1B; hgnc:4083 is GABRB3, not GABRA2; hgnc:24578 is DDI2, not KLB), replaced with OAK-verified hgnc:250, hgnc:4076, hgnc:15527; and the heritability PMID it supplied (25066582) is an unrelated orthopedics paper, replaced with the correct Verhulst/Neale/Kendler meta-analysis PMID:25171596. The report also proposed GO:0038003 as a molecular function and several HPO IDs that did not match their stated labels; these were corrected against OAK before use.

    Content curated. Pathograph: 14 pathophysiology nodes implementing the Koob-Volkow three-stage addiction cycle - polygenic and metabolic-gene susceptibility; ethanol oxidative metabolism; the protective acetaldehyde-flush branch; acute GABA-A potentiation and NMDA inhibition; mesolimbic dopamine and endogenous opioid reward; incentive salience and cue reactivity; GABAergic-glutamatergic neuroadaptation and tolerance; withdrawal hyperexcitability; extended-amygdala stress-system recruitment; hyperkatifeia and reward deficit; dorsolateral striatal habit recruitment; prefrontal executive control deficit; compulsive seeking and loss of control; sustained exposure and multiorgan toxicity. Also 21 phenotypes, 6 genetic entries (ADH1B and ALDH2 as PROTECTIVE, GABRA2/GCKR/KLB as SUSCEPTIBILITY, OPRM1 as a contested MODIFIER carrying a REFUTE evidence item from the genotype-stratified trial), 1 environmental exposure with influences_mechanisms edges, 10 treatments, 2 prevalence records, 1 biochemical marker, 2 diagnosis records, 2 clinical trials, and 2 discussions (KNOWLEDGE_GAP on translating extended-amygdala stress pharmacology to humans; HUMAN_MODEL_MISMATCH on the rodent-derived habit-system claim).

    Scope decision: end-organ sequelae of chronic drinking are deliberately shallow because Alcoholic_Liver_Disease is a separate entry. Those phenotypes carry supports: PARTIAL, with the missing organ-specific citation named in the explanation rather than papered over. Three known gaps are recorded in the entry's notes rather than left implicit: the neuroimmune/TLR4 arm is not modelled as its own node (no abstract-quotable primary source verified this session), the PARTIAL end-organ phenotypes need organ-specific references, and the indirect biomarkers GGT/CDT/MCV are not curated alongside PEth.

    A self-review pass against the dismech-pr-review content-completeness checklist added three things the first draft had missed: a Craving phenotype (DSM-5 criterion, deliberately left unbound because HPO has only food-specific craving terms - flagged as an NTR candidate), baclofen as an off-label treatment, and an incoming causal edge to the prefrontal executive-control node so it is no longer a graph root.

    Validation: `just validate-disorders kb/disorders/Alcohol_Use_Disorder.yaml` passes - this is the batched schema + ontology-term + reference check that CI runs on changed disorder files. Snippets checked: 116/116 verified against cached references, 0 skipped by prefix. Compliance: 94.2 percent global, 94.4 percent weighted.

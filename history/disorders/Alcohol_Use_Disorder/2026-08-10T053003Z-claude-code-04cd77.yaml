  summary: Split bundled GGT/CDT/MCV biochemical record into per-analyte entries with
    LOINC binding
  details: |
    Split the single 'Indirect laboratory markers of heavy drinking (GGT, CDT, MCV)' Biochemical record into three per-analyte records (GGT, CDT, MCV), each bound to a verified LOINC term (LOINC:2324-2, LOINC:48495-6, LOINC:30428-7 respectively) and carrying its own reference_ranges. Sourced new screening-cutoff evidence: GGT sex-specific cutoffs (85 U/L males, 65 U/L females) from PMID:17767129; %CDT/%disialotransferrin cutoff (1.7%) from PMID:25698630; MCV upper limits by drinking status (96 fL abstainers, 98 fL moderate drinkers, NORIP reference data) from PMID:16581347. Kept the original combined GGT-CDT index evidence (PMID:16799164) on the GGT record only, per the issue's guidance to avoid tripling the same snippet, with cross-reference notes on the CDT and MCV records. All three new PMIDs fetched via 'just fetch-reference' and verified against cache; LOINC codes verified against the NLM clinical-tables LOINC service (LOINC is not covered by repository OAK term validation, per existing convention in Adrenal_Cortex_Adenoma.yaml). just validate-disorders and just count-verified-snippets both pass (131/131 snippets verified).

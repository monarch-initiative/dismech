  details: |
    Addressed the eight non-blocking suggestions from the ai4c-reviewer approval on PR #8264.

    Applied as suggested: (1) central amygdala node rebound from UBERON:0001876 (amygdala) to the precise UBERON:0002883 (central amygdaloid nucleus), which is what the CRF-signalling claim actually refers to; (2) GABAergic interneuron descriptor rebound from CL:0000617 (GABAergic neuron) to the exact-label CL:0011005 (GABAergic interneuron); (3) the preferred_term/term direction mismatch on the incentive-salience node resolved by binding UBERON:0005403 (ventral striatum) rather than the narrower nucleus accumbens; (6) extended-release injectable naltrexone added as its own treatment, since XR-NTX is separately approved, has a distinct adherence profile, and is reported separately in the JAMA meta-analysis; (7) the indirect laboratory markers GGT, CDT and MCV added as a second biochemical record, with the combined GGT-CDT sensitivity comparison from PMID:16799164 and an explicit note that they are indirect consequence markers rather than a diagnostic test.

    Applied with a correction to the suggestion: (4) the reviewer proposed an `experimental_models` section, but that slot is scoped to non-animal systems (organoids, cell lines, chips). The research material it pointed at is selectively bred rodent lines, so it went into `animal_models` instead - three entries covering the alcohol-preferring P and high-alcohol-drinking HAD rats (PMID:24268381), the HAP/LAP mouse lines (PMID:16482403), and the High Drinking in the Dark HDID lines (PMID:23910826). The HDID entry carries the dissociation that matters for this entry's reward node: the binge phenotype tracks attenuated aversion, not increased reward sensitivity.

    Not applied, with reasons recorded in the entry notes: (5) psychiatric comorbidity cannot be modelled here because the `Disease` class has no `comorbidities` slot - that belongs in a `kb/comorbidities/` entry and is left as follow-up; the phenotype-level association statistics from NESARC-III remain. (8) The vestigial `NCIT:C874,Thiamine` cache row is left in place: cache CSVs are tool-generated artifacts and the guidance is to regenerate rather than hand-edit them, the row is a valid NCIT term, and an unused label-cache row has no effect on validation.

    Validation after the changes: `just validate-disorders kb/disorders/Alcohol_Use_Disorder.yaml` passes; snippets checked 125/125 verified against cached references, 0 skipped by prefix; compliance 94.2 percent global, 94.4 percent weighted.

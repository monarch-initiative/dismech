  summary: Conform to addiction_cycle; link gabapentin and semaglutide to mechanisms
  details: |
    Eight pathophysiology nodes now declare conforms_to on the addiction_cycle module. Two treatments gained target_mechanisms with new primary evidence. Semaglutide INHIBITS Mesolimbic Dopamine Reinforcement: in mice it blunts the alcohol-evoked rise in accumbens dopamine (PMID:37295046). Gabapentin INHIBITS Withdrawal-Associated Negative Affect: in ethanol-dependent rats it reverses the anxiety-like state of abstinence through central amygdala GABAergic transmission (PMID:18509038). Both are graded MODEL_ORGANISM and INDIRECT. Three drugs were deliberately left unlinked. Acamprosate: the entry's description already records that its molecular mechanism is uncertain and must not be curated as reversing a glutamate abnormality. Topiramate: its mechanism in AUD is similarly unsettled. Baclofen: the one direct test found (PMID:22982185, not cited) reports that GABA-B activation attenuates the stimulant but not the mesolimbic dopamine response to ethanol, so it contradicts a dopamine-reinforcement link.

  summary: 'Review: WAS - repair truncated shared snippet, retag reviews, prune Orphanet
    artifact phenotypes'
  details: |
    Manual expert claim-evidence review.
    Fixed: (1) The PMID:7579347 snippet was truncated at 'is an X-linked recessive disorder', cutting off immediately before the clause naming the features - yet it was reused as the sole/primary human evidence for thrombocytopenia, abnormal platelet morphology, eczema and immunodeficiency. Extended to include 'characterized by thrombocytopenia, small platelets, eczema, recurrent infections, and immunodeficiency' in all six places. (2) PMID:10523789, PMID:19628299 and PMID:26159751 are narrative reviews but were tagged evidence_source HUMAN_CLINICAL (inconsistent with PMID:28805251 in the same file, correctly OTHER) - retagged OTHER. (3) Removed two phenotypes transcribed wholesale from the ORPHA:906 HPO table that have no basis in the WAS literature and are annotation artifacts: Arrhythmia (FREQUENT) and Specific learning disability (FREQUENT), plus their dangling downstream edges. (4) Added a frequency-provenance caveat to notes recording that ALL bands here are Orphanet annotations rather than cohort data, naming the soft ones, and documenting that Orphanet's Occasional band for eczema contradicts the primary literature (eczema is a cardinal triad feature). (5) Removed deprecated percentage field from prevalence.

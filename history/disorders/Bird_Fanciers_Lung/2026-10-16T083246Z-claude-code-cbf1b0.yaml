  summary: Correct attribution; confirm IgG panel choice over isotype-agnostic panel
  details: |
    Correction round on #14490 review feedback. The original session's history record (2026-10-16T082830Z) and the entry's notes incorrectly attributed the decision to bind IgG serology (rather than declining the entry as out-of-scope for allergen-specific IgE) to 'the coordinator's explicit direction'. That is wrong: the coordinator's brief only noted that ImmunoCAP avian-antigen panels exist, without directing a binding. The actual reasoning is the entry's own content -- its biochemical record names IgG/IgA precipitins specifically, and this disease (hypersensitivity pneumonitis) is type III/IV, not IgE-mediated -- which independently supports binding the IgG panel while declining to assert an IgE mechanism the disease does not have (the coordinator independently verified that in-tranche IgE options exist for pigeon antigens -- LOINC:17464-9, 17465-6, 10948-8 -- and confirmed declining them was correct). The entry's notes field was reworded to drop the misattribution. Separately weighed LOINC:35575-0 'Pigeon antibody panel - Serum' (isotype-agnostic, arguably the better panel-first identity binding) against the already-bound LOINC:78367-0 (IgG-specific serum+feathers+droppings panel): kept 78367-0 because every cited evidence snippet in the record specifically names IgG (anti-pigeon IgG titers by ELISA/ImmunoCAP), so the IgG-specific panel matches the record's own claim more precisely than the isotype-agnostic one would. Per the coordinator's scope ruling: this binding is correct content for the entry but is out-of-scope for tranche L as defined (allergen-specific IgE) -- it should be counted separately from tranche L's own coverage in the closing ledger, not folded into it.

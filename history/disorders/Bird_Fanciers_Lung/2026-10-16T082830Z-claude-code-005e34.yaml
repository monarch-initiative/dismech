  summary: 'LOINC: bind pigeon antigen IgG panel code'
  details: |
    Bound LOINC:78367-0 (Pigeon serum proteins+feathers+droppings IgG Ab [Mass/volume] in Serum) to the Bird antigen-specific IgG/IgA antibodies biochemical record, as part of dismech LOINC Diagnostics tranche L. The record's own cited evidence is IgG-specific (anti-pigeon IgG titers by ELISA/ImmunoCAP), not allergen-specific IgE -- this disease is Type III/IV hypersensitivity pneumonitis, not IgE-mediated allergy -- but the coordinator explicitly named this entry as a tranche-L candidate given the ImmunoCAP avian-antigen panel codes available, so the binding follows that direction. Chose the joint serum-proteins+feathers+droppings IgG panel code over the three single-antigen codes, matching the panel-first convention and the row's own description of testing 'bird antigens' generally rather than one antigen source. [Mass/volume] was chosen over [Presence] since the cited evidence quotes numeric titers. No IgA-specific pigeon antibody code exists in the Monarch KG (searched 'Pigeon serum IgA', zero results), so the IgA arm this record names is not reachable from a LOINC code; recorded in notes. Label verified against the Monarch KG entity API in the same step it was written. Confirmed absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

  summary: 'Create: Tonne-Kalscheuer_Syndrome'
  details: |
    New entry for Tonne-Kalscheuer syndrome (TOKAS; MONDO:0010506, label 'intellectual disability, X-linked 61'), RLIM (hgnc:13429), X-linked recessive. Lump/split: entry_type DISEASE, own entry; not a subtype row of Non-Syndromic_X-Linked_Intellectual_Disability (declined there in #12227 because the clinical literature describes a syndromic multiple congenital anomaly disorder and OMIM:300978 is titled Tonne-Kalscheuer syndrome). Stub stubs/Intellectual_Disability_X-linked_61.yaml deleted. Deep research: Perplexity report (sonar-deep-research) committed as generated. Its reference_validation: 6/6 references resolved, 4 on topic, 0 off topic, confabulation_rate 0.0. Its term_validation: 69 terms, 1 unresolved (HP:0008735), 6 obsolete and 9 mislabelled (e.g. CL:0000127 given as neuron is astrocyte; NCIT:C16467 given as Supportive Care is Congo); needs_review true. No DR-suggested CURIE was copied; every binding was looked up in the cache CSVs or via runoak (ols:hp, sqlite:obo:hgnc, sqlite:obo:mondo). preflight-dr PASS (RLIM mentioned 213 times; OMIM 300978 matches); the first attempt crashed with 'database disk image is malformed' because mondo.db was being re-downloaded concurrently, and passed on re-run. Perplexity cited mostly URLs; PMIDs were recovered via PubMed E-utilities for the Tonne 2015, Frints 2019, Bustos 2018 and 2021, Cuinat 2024 (J Med Genet), Bandi 2025, Siavriene 2025 and Woody 2026 papers it described, plus primary mechanism papers (PMID:22596162, 20962847, 30420655, 22560923, 19945382, 24870238, 35857630, 38199845, 33080171, 35764390) and a 2026 epilepsy series (PMID:42341533). Not used: DR claims on OMIM/MedGen/LOVD pages and affinage gene summary (no PMID), the DR's '0.5% of unsolved XLID' figure (not found in a cited abstract), and DR-proposed HPO terms for testicular hypoplasia (HP:0008735 does not exist). HP:0003811 Neonatal death and HP:0012546 Skewed maternal X inactivation were rejected by the PhenotypeTerm enum and moved to prose. 21 phenotypes, 9 pathophysiology nodes. Only evidenced mechanism-to-phenotype edges are drawn (congenital diaphragmatic hernia, intellectual disability); the other malformations and neurodevelopmental features have no upstream node, and a KNOWLEDGE_GAP discussion records that no study links the RLIM substrate defects to them. An earlier draft drew 18 unevidenced INDIRECT_UNKNOWN_INTERMEDIATES edges to those phenotypes; they were removed before the PR as connections no source makes. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms clean; count-verified-snippets 85/85; list-disconnected-phenotypes 3/21 connected after removing the unevidenced edges; validate-disorders passed (85 snippets, 0 issues).

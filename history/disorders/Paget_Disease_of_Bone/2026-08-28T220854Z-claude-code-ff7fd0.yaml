  details: |
    De novo curation of bone Paget disease, MONDO:0005382, claimed via issue #9940. One OpenScientist deep-research report was run: research/Paget_Disease_of_Bone-deep-research-openscientist.md. Reference validation reported needs_review with three unsupported quotes at PMID:38963497, PMID:33768371 and PMID:21515589; no quoted material from those three was reused. Term validation flagged HP:0002750, which the report labelled Abnormal long bone morphology but which HPO calls Delayed skeletal maturation; HP:0006487 Bowing of the long bones was bound instead. A further term error the report's own validation did not catch was found during curation: UBERON:0000033, offered for skull, is head; UBERON:0003128 cranium was bound instead. Juvenile Paget disease was excluded from scope as a distinct recessive disease and keeps its own stub. Validated with just validate at 38/38 snippets verified.

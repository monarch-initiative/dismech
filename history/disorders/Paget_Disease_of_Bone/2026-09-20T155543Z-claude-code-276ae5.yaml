  summary: 'Genetics pass: Correct the SQSTM1 subtype MONDO binding and wire all four
    genes to nodes'
  details: |
    Genetics pass for the d2g wiring-015 job (issue #12204, epic #12189). Genetics researched from the entry's own cited literature plus a GeneReviews baseline check (just check-genereviews), with MONDO/Monarch consulted only afterwards for reconciliation. ClinGen bulk refresh was unavailable (just clingen-refresh fails on a drifted pin, issue #10426), so no new ClinGen assertion was fetched. Every HGNC CURIE written here was read from cache/hgnc/terms.csv in the same step it was written; just list-gene-term-mismatches reports 0 findings over the changed files.

    Two problems. First, the SQSTM1-related subtype row was bound to MONDO:0011183 (Paget disease of bone 2, early-onset), which is the TNFRSF11A locus: Monarch reports SQSTM1 (HGNC:11280) as the causal gene of MONDO:0008176 (Paget disease of bone 3, OMIM 167250), not of MONDO:0011183 (OMIM 602080). Rebound the row to MONDO:0008176, corrected the display_name from PDB2 to PDB3, and recorded the reason in the row's review_notes. Nothing in the repository catches this class of error, which is the pattern reported in issue #12333. Second, none of the four gene records reached a pathophysiology node (0/4). Bound SQSTM1 to the UBA-domain autophagy node and TNFRSF11A to the RANKL node, both already supported by evidence those nodes carry, and bound ZNF687 and PFN1 to Giant Hypernucleated Hyperactive Osteoclasts with three new evidence items fetched for this purpose (PMID:36918542 for ZNF687, PMID:33599011 for PFN1), which place both genes' action at the osteoclast rather than at the SQSTM1 autophagy step. Wiring 0/4 to 4/4. Also bound SQSTM1 and ZNF687 to their subtype rows, recorded in the scope note and in the TNFRSF11A review_notes why MONDO:0011183 deliberately gets no subtype row here (Familial_Expansile_Osteolysis already holds the lump/split decision for the allelic TNFRSF11A duplication disorders), and repaired one leftover explanation that still justified itself by the retired PARTIAL evidence value.

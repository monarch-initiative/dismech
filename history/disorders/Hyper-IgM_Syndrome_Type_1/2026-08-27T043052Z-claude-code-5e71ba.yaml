  summary: 'Create: Hyper-IgM Syndrome Type 1 (CD40LG)'
  details: |
    De novo curation of hyper-IgM syndrome type 1 (X-linked hyper-IgM syndrome / CD40 ligand deficiency; MONDO:0010626, CD40LG hgnc:11935, OMIM 308230) from the stubs/ queue. The stub stubs/hyper-IgM_Syndrome_Type_1.yaml was deleted in the same change. A duplicate preflight over kb/ confirmed no existing entry covers this disease; the separate broader "hyper-IgM syndrome" grouping stub was deliberately left in place.

    Sources were located by targeted PubMed E-utilities searches rather than a deep-research provider run, and every PMID was resolved and cached with `just fetch-reference` before use. No snippet was taken from a report or from memory.

    GeneReviews baseline (skill Step 3b) applied: PMID:20301576 "CD40 Ligand Deficiency" exists, was cached, is tagged GeneReviews in the top-level references block, and its Clinical Characteristics and Management sections were cross-referenced against the phenotypes and treatments sections.

    Core literature used: PMID:7679801 (Allen 1993, Science), PMID:7679206 (Korthauer 1993, Nature) and PMID:7678782 (Aruffo 1993, Cell) for the CD40LG loss-of-function molecular lesion and Xq26 mapping; PMID:7539026 (Facchetti 1995) for the abortive germinal centre reaction and follicular dendritic cell depletion in patient lymphoid tissue; PMID:27554817 (Cabral-Marques 2017) for the macrophage/dendritic-cell licensing arm; PMID:9255191 (Levy 1997, n=56) and PMID:14663287 (Winkelstein 2003 US registry, n=79) for the clinical spectrum, frequencies and occurrence estimate; PMID:27697500 (de la Morena 2017, n=176) for long-term outcomes and transplantation; PMID:35748970 (IUIS 2022) for the classification assignment.

    Pathophysiology: an atomic six-node causal chain running from the CD40LG loss-of-function lesion on activated CD4+ T cells, through failed CD40 engagement on B cells, to defective immunoglobulin class switch recombination and (in parallel) the abortive germinal centre reaction; and, on the second arm, through failed CD40-dependent licensing of macrophages and dendritic cells to the opportunistic-infection and Cryptosporidium-associated biliary-tract injury nodes. Every node carries a biological_scale tag, GO/CL/UBERON bindings where a term accurately fits, and evidenced downstream edges. The neutropenia edge is deliberately curated as INDIRECT_UNKNOWN_INTERMEDIATES because the causal path from the CD40LG lesion to the granulocyte defect is not established in the literature.

    Classifications: harrisons_chapter IMMUNE_RHEUMATOLOGIC plus GENETICS_ENVIRONMENT_DISEASE, and iuis_category "combined immunodeficiency". The IUIS assignment is evidenced by the Table 1 section-3 row quoted from the cached full text of PMID:35748970 (the same pattern used for ARPC1B_Deficiency), plus a functional citation from Cabral-Marques. Entry notes record explicitly that IUIS places CD40 ligand deficiency among the combined immunodeficiencies rather than the predominantly antibody deficiencies, despite the immunoglobulin-centric disease name.

    Prevalence curated with the structured slots (measure_type BIRTH_PREVALENCE, prevalence_class BELOW_1_IN_1000000, rate_per_100000 0.097) from the Winkelstein registry figure of approximately 1/1,030,000 live births, with notes deriving the roughly 2-per-million-male-births figure and flagging it as a minimal estimate.

    Validation: `just validate` (schema + terms + references) passed; `just count-verified-snippets` reports 67/67 snippets verified against cached references; `just validate-terms` passed; `just check-duplicate-keys`, `just check-entity-refs`, `just check-snippet-length`, `just check-title-snippets`, `just check-folded-hyphens`, `just check-environmental-evidence` and `just check-not4curation` all passed; and the authoritative batched `just validate-disorders kb/disorders/Hyper-IgM_Syndrome_Type_1.yaml` passed.

  summary: 'LOINC tranche G batch 7: new Right Heart Catheterization diagnosis row
    with the PAH triad'
  details: |
    Added a new diagnosis row, Right Heart Catheterization, since this entry previously carried only molecular-testing and surveillance diagnosis rows. Bound diagnosis.measurements (LOINC:8414-5 mPAP, LOINC:8587-8 PAWP, LOINC:8828-6 PVR) with reference_ranges bands for the pre-capillary (group 1, PAH) hemodynamic triad (mPAP>20mmHg, PAWP<=15mmHg, PVR>2 Wood units), cited to PMID:39209475, a 2024 paper restating the 2022 ESC/ERS criteria.

    Review round: the initial push bound PVR at >=3 Wood units citing PMID:30545968 and mis-attributed it to the "6th WSPH, 2018" revision; >=3 WU is actually the 2003 (3rd WSPH) figure, superseded by the 2022 guideline's lower >2 WU threshold. Re-bound all three bands to PMID:39209475 and fixed the PVR value and the PAWP boundary (upper_bound moved from 15 to 16 so the inclusive "<=15" criterion is not excluded by the half-open convention); see the Idiopathic_Pulmonary_Arterial_Hypertension entry's matching bands for the fuller history and the quoted correction. Part of LOINC_DIAGNOSTICS.md tranche G.

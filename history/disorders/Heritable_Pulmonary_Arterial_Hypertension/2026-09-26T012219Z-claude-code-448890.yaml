  summary: 'Review round 1: node evidence for CAV1 and KDR, SOX17 row correction'
  details: |
    Two suggestions on PR 12780. CAV1 and KDR were bound at the pulmonary arterial endothelial dysfunction node with no evidence there, where SOX17 and ATP13A3 had node-level evidence placing them in that compartment. CAV1 now cites PMID:33836561, newly fetched, whose abstract reports that CAV1-silenced primary human pulmonary artery endothelial cells become proliferative and hypermigratory; that places the product in this node's compartment as directly as the SOX17 and ATP13A3 items do. KDR is only partly closed and the record says so. The best available abstract-safe sentence is from PMID:33320693, already cited on the gene record, and it establishes that KDR encodes VEGFR2 and validates the gene in PAH without asserting that VEGFR2 acts in the pulmonary arterial endothelium; the explanation states that limit rather than implying the binding is as well supported as its neighbours. A PubMed search for a KDR or VEGFR2 paper with a pulmonary-endothelial abstract returned only unrelated mechanistic studies, and citing one of those for a gene-placement claim would be a stretch. Separately, the Rare endothelial-signaling HPAH row's description listed SOX17 among the genes whose MONDO terms are recorded as mappings for that row; SOX17 belongs to the developmental-regulator row, as its own mapping justification states, and has been removed from the sentence.

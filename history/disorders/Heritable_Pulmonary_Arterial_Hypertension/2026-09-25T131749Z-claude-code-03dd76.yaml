  summary: 'Genetics pass: wire thirteen genes into the pathograph, add CAPNS1 subtype,
    map PPH1-7'
  details: |
    Genetics pass against the MONDO descendant set of MONDO:0017148 (issue #12250, series-043). The OLS4 enumeration run on 2026-09-25 returned exactly the seven "pulmonary hypertension, primary, 1-7" terms with no unlisted siblings, so the gap here was not missing genes but missing wiring: twelve genes were curated with per-gene evidence and none of them reached a pathophysiology node. All twelve are now wired, plus CAPNS1, which was the one gene MONDO records that the entry did not carry. BMPR2, GDF2, SMAD9, ACVRL1 and ENG are bound at the BMP/TGF-beta trigger node; CAV1, KDR, SOX17 and ATP13A3 at the endothelial dysfunction node; KCNK3 at the smooth-muscle node. Two new nodes carry the mechanisms with no existing home: a TBX4 lung-mesenchymal developmental node and a recessive CAPNS1 node. ATP13A3 was initially bound at the smooth-muscle node and moved after reading the primary functional study, which measured reduced proliferation and increased apoptosis in endothelial cells rather than a smooth-muscle effect. EIF2AK4 is deliberately not wired: the pulmonary veno-occlusive disease and capillary haemangiomatosis lesion is a different lesion from arteriolar remodelling and is already curated with its own EIF2AK4/GCN2 node in Pulmonary_Veno_Occlusive_Disease_And_Or_Pulmonary_Capillary_Haemangiomatosis, whose MONDO term is not a descendant of heritable PAH. Added a CAPNS1-related HPAH subtype row with its own autosomal recessive inheritance block, since recessive biallelic loss is a real inheritance distinction from the dominant BMPR2 arm. Bound subtype_term on the three rows that correspond one-to-one to a MONDO numbered concept and recorded the other four as skos:narrowMatch in mappings.mondo_mappings. Recorded the ClinGen Pulmonary Hypertension panel's Disputed classifications for SMAD1 and SMAD4 and Limited for AQP1, BMP10 and KLF2, none of which is curated as a cause here, and noted that ACVRL1 and ENG carry ClinGen assertions only for hereditary haemorrhagic telangiectasia. Also repaired a snippet that had stopped verifying because the publisher's italic markup extracts differently now ('signallingviaone'); the same sentence is quoted in Idiopathic_Pulmonary_Arterial_Hypertension and Drug_or_Toxin-Induced_Pulmonary_Arterial_Hypertension and was repaired there too, with the refreshed cache committed. Verified: schema, terms, snippets (validate-disorders under linkml-reference-validator 0.3.0rc1), duplicate keys, entity refs, causal targets, enum values, gene-term identity.

  summary: 'Perineurioma: observation, nerve surgery and tendon transfer'
  details: >-
    Deepened the intraneural form's treatments and added two rows. Bad outcomes are graded REFUTE,
    as elsewhere in the treatments section. On the Observation row, the 2021 systematic review's
    outcomes without surgery, split into two items, 21 of 31 unchanged (SUPPORT) and 9 worse
    (REFUTE), at a median 11 months (PMID:34284162); three patients of the 2026 series stable on
    observation and physiotherapy for 34 to 85 months (PMID:41657107); the 2024 review's own case, a
    child with a sciatic lesion longer than 12 cm, not resected and unchanged after 2 years of
    physiotherapy, with the review's own table giving more than 10 cm and 12 months, and its count,
    by its own classification, of 16 children followed without surgery over a mean of about 51
    months, split into stable in three (SUPPORT, the review's own case among them) and declined in
    13 (REFUTE); 11 of the 16 are children of the longitudinal series, which describes the
    progression in its re-examined patients as very mild and slow (PMID:38434310; PMID:19567701,
    already cited for that description in the progression section); and one centre's more
    conservative policy above 60 years (SUPPORT), beside its operating on 18 of its 19 patients, one
    of them, by the source's counts, for palliative treatment only, with the 19th's management not
    stated (REFUTE, INDIRECT since the sentence does not mention observation) (PMID:30637060). On
    the Tendon transfer row, further surgery in 13 of the longitudinal series' 32 patients, 11 of
    them tendon transfers; of seven operated patients interviewed, four felt surgery had improved
    them (two after tendon transfer alone, by the series' Table 4, which also records no change in
    clinical symptoms for two of the four), two lost an early gain as weakness progressed and one
    developed arthrofibrosis (both REFUTE) (PMID:19567701); and the 2026 series' reading of its
    reliance on tendon transfer (NO_EVIDENCE, cited for the description, since it gives a cause for
    the reliance and no count of use or outcome) and its advice, split into a possible gain in
    quality of life (SUPPORT) and its caution (REFUTE) (PMID:41657107). On the Nerve resection row,
    the 2021 review's mix of operations (PMID:34284162); the 2024 review's comparison of lesion
    lengths in its 33 cases with known length (a selection effect, INDIRECT) and its restatement of
    a 77-patient surgical analysis (REFUTE, INDIRECT since the sentence does not list the
    operations), with a note that the review does not say how the other 34% fared (PMID:38434310); a
    2016 report's child grafted without meaningful recovery despite reinnervation (REFUTE), with the
    2024 review's table row for the same child (REFUTE, DIRECT; PMID:38434310), so that the two
    items and the review's pooled 2.5 cm case are read as one patient; the 2016 authors' caveat on
    long-standing neuropathy (REFUTE, INDIRECT since it names neither grafts nor transfers)
    (PMID:27086131); the pre-existing items on the 2024 review's grafted patients now name the 2016
    report's two children as matching cases; the 2018 centre's policy below 60 years (a single
    operation, excision and direct suture or a graft, the graft most often with palliative
    treatment) (PMID:30637060); and the 2026 series' lesion lengths (REFUTE) (PMID:41657107). Two
    rows are new. Neurolysis (citing PMID:34284162 and PMID:38434310; 16 of 64 cases in the 2021
    review; three patients treated with biopsy and neurolysis in the 2024 review, the first matching
    a table row that records excision biopsy, two cited to the same source as the 77-patient
    analysis, whose outcomes are added as REFUTE and INDIRECT; lesions up to 15 cm), bound to
    NCIT:C15329 Surgical Procedure, since NCIT labels containing neurolysis or decompression name a
    particular site or another procedure, none a limb nerve or the brachial or lumbosacral plexus;
    and Nerve transfer (citing PMID:27086131 and PMID:38434310; the 2016 report's second child,
    whose two-stage operation included an end-to-side nerve transfer, graded INDIRECT since a
    matching row of the 2024 review's table records it as excision with grafting and the gain cannot
    be credited to the transfer alone; that table row (NO_EVIDENCE, cited for that caveat, since it
    records grafting and no transfer); the authors' question from traumatic plexus injury, graded
    INDIRECT; their background statement on transfers in traumatic plexus injury (INDIRECT); their
    background sentence that management is controversial and that reports of recovery after grafts
    and transfers vary (REFUTE, INDIRECT); their caveat on long-standing neuropathy; and the 2024
    review's list of management options, which includes nerve transfer), bound to NCIT:C185713
    Neurotization Procedure, since NCIT has no term labelled nerve transfer. Both rows' notes give
    the label searches. Not added: excision of oral intraneural tumours (five patients in the 2024
    review), which does not fit the excision row's soft tissue scope; orthoses; the TRAF7 and NF2
    statements on future therapy; the 2024 review's two palliative tendon transfers, whose patients
    are children of the longitudinal series already counted; and the longitudinal series' advice
    that tendon or distal nerve transfers need evidence of static disease, since the sentence names
    the transfers only inside a bracketed span that the reference validator strips, and quoting
    around it would drop the words the claim rests on. 35 new evidence items, one new reference
    cache file (PMID:27086131), and NCIT:C185713 rows in cache/ncit/terms.csv and the
    treatment-action enum cache. New text is appended to the existing descriptions without
    rewrapping their lines. just validate, validate-terms and count-verified-snippets pass.

  summary: 'Perineurioma: histopathology, markers and ultrastructure'
  details: >-
    Added a histopathology section with 12 rows. Pseudo-Onion Bulb Whorls
    (Intraneural, NCIT:C41414): the 2012 and 2022 reviews (PMID:22327363, PMID:35741273), the
    longitudinal series' figure legend and the origin of the term (BACKGROUND) (PMID:19567701), and
    the 2026 series' diagnostic and inclusion criteria (methods sentences, no quote_role) beside its
    finding in all ten cases, read as restating that criterion (PMID:41657107). Storiform and
    Whorled Growth (Soft tissue, NCIT:C35888, no diagnostic flag, since the sources call the pattern
    typical rather than diagnostic; notes say why this term is bound): pattern, cellularity and
    stroma in the 81-case series (PMID:15958848); a 2021 review's figure legend (PMID:33588442); the
    2012 review's typical pattern of loose fascicles or whorls and its statement, of hybrid tumours,
    that storiform growth is typical of perineurioma (INDIRECT); and the 2022 review's list of
    patterns. Atypical Histological Features (Soft tissue, NCIT:C8448 Mesenchymal
    Cell Atypia, OCCASIONAL): 14 of 81 tumours atypical, the mitotic counts and the series' reading
    that the features seem to have no clinical significance, and the 2022 review's statement that
    they may occur in 10 to 20% beside its own statement that atypia and mitoses are virtually
    absent (REFUTE); notes say why Mesenchymal Cell Atypia is bound. Reticular Pattern (Reticular,
    NCIT:C157705 Reticular Growth Pattern): the six-case series (PMID:11257623) and two reviews, one
    of which attributes the pattern to myxoid change. Sclerosing Pattern (Sclerosing, NCIT:C60921
    Dense Collagenized Tissue Present): series of 19, 5 and 7 tumours (PMID:9414186, PMID:12836021,
    PMID:25051109); notes say why this term is bound rather than the pattern, collagenous-stroma,
    sclerosis or hyalinised-stroma terms. Epithelial Membrane Antigen Immunoreactivity
    (NCIT:C40998, VERY_FREQUENT): counts from the 81-case, the 2026 intraneural, the reticular and
    two sclerosing series, and the 2026 series' figure legend; 84% of 50 gut tumours in the gut-wide
    review (PMID:40225020), with its selection of reports positive for at least one of four markers
    (a methods sentence); the longitudinal series' inclusion criterion; a 2021 review's statement
    that it may be weak or focal, the 2012 review's that it stains the majority, and a 2002 study's
    that it may be focal or faint (PMID:12459629); the 2003 study's statement that EMA and GLUT1 are
    specific to perineurial cells (INDIRECT) beside its EMA-positive cells within neurofibromas
    (REFUTE, INDIRECT) (PMID:12692193); and, against its specificity, the 2012 review's statement
    that it may be present in up to 40% of low-grade fibromyxoid sarcomas and a 2026 study's
    statement that EMA and GLUT1 lack specificity (both REFUTE) (PMID:43020433). The description
    adds that series of diagnosed tumours may undercount EMA-negative ones and that two of the
    series may share tumours. Claudin-1 Immunoreactivity (NCIT:C40998): the 2002 study of 12
    perineuriomas selected as EMA-positive and S-100-negative and 39 mimics, with its findings in
    neurofibromas and a schwannoma (both REFUTE for specificity, INDIRECT as cells the authors take
    to be perineurial) and its conclusion that the lesional cells of the mimics are negative; the
    81-case series' 22 of 76; a sclerosing series' 7 of 7; five intraneural tumours of the 2026
    series; 88% of 50 gut tumours with the gut-wide review's selection; a 2022 review's note that
    low-grade fibromyxoid sarcoma may express it (REFUTE, INDIRECT); and the 2012 review's naming of
    claudin-1 and GLUT1 as markers (SUPPORT) and its statement that neither is entirely specific
    (REFUTE). GLUT1 Immunoreactivity (NCIT:C40998): a 2003 study of 3 perineuriomas and 4
    perineurial malignant nerve sheath tumours among other lesions (its methods sentence) that calls
    GLUT1 and EMA specific to perineurial cells (INDIRECT) (PMID:12692193), with its finding of
    positive cells in neurofibromas and conventional malignant nerve sheath tumours (REFUTE,
    INDIRECT) and in normal perineurium (INDIRECT); two sclerosing series; 94% of 50 gut tumours
    with the gut-wide review's selection; a 2022 review; the same two 2012 sentences; and the 2026
    statement (REFUTE). Absent or Focal S-100 Protein (NCIT:C40998): the 81-case, reticular and a
    sclerosing series, two figure legends and the inclusion criterion of the longitudinal series,
    and focal staining in 3 of 10 intraneural tumours read by the 2026 authors as residual Schwann
    cells. Variable CD34, Actin, Cytokeratin and Desmin (NCIT:C40998): the 81-case series, three
    smaller series and the 2022 review, all of the soft tissue form; notes name the marker terms
    that each cover one marker. Perineurial Ultrastructure (NCIT:C43265): a 1988 intramuscular
    tumour first read as a myxoma (PMID:3057710), a sclerosing series, eight intraneural tumours of
    the 2026 series, two reticular tumours and the sclerosing series of 19, both described only as
    perineurial, and the longitudinal series' figure legend. Rare Histological Patterns
    (NCIT:C35867, VERY_RARE): a meningioma-like epithelioid tumour (PMID:18820102), a microreticular
    tumour (PMID:36820822), and the 2022 review's minor component of plumper or epithelioid cells
    and its lipomatous pattern; notes say why Morphologic Finding is bound. The rows bound to
    Immunophenotypic Finding or Ultrastructural Finding record in notes the NCIT searches behind
    each root binding. Sentences already quoted elsewhere in the entry keep their evidence_source
    and quote_role. 96 new evidence items; six new reference cache files (PMID:3057710,
    PMID:12836021, PMID:18820102, PMID:33588442, PMID:35741273, PMID:36820822); NCIT rows for
    C35888, C41414, C8448, C157705 and C60921 in cache/ncit/terms.csv and the histopathology-finding
    enum cache. Left out: the chromosome and copy-number findings the sources give, which this
    project leaves out. Every quote was checked against its source with the reference validator's
    own normaliser; just validate and count-verified-snippets pass.

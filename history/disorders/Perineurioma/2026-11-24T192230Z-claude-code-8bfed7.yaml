  summary: 'Edit: Perineurioma — differential diagnoses'
  details: >-
    Adds a differential_diagnoses section with seven rows and 62 evidence items from cached
    sources, 8 of them INDIRECT. Focal demyelinating and onion-bulb neuropathies, for the
    intraneural form: EMA on the tumour's whorls against S-100 on onion bulbs (with the series'
    account of how EMA staining first separated them), electron microscopy and
    immunohistochemistry as the means to tell the cells apart, normal spinal fluid protein and
    avid gadolinium enhancement against CIDP, the longitudinal series' 2009 view that biopsy is
    the only definitive test and the 2026 series' imaging-first pathway for typical cases, from
    histologically confirmed cases (PMID:19567701, PMID:17824794, PMID:41657107); the row's notes
    list the differentials the sources name without contrasting features. Schwannoma
    (MONDO:0002546) and neurofibroma (MONDO:0016755), for the intraneural form, which the
    longitudinal series names in its differential: Schwann cell markers, focal S-100 in a minority
    of intraneural tumours, and the review's table, in which neurofibroma is EMA-positive as well
    and schwannoma EMA-negative apart from its capsule (an inference graded INDIRECT)
    (PMID:19567701, PMID:22327363, PMID:41657107). Hybrid schwannoma-perineurioma, with no MONDO
    label (the searches are recorded in the row's notes): the review's own experience of hybrids
    with soft tissue perineurioma architecture but increased S-100, its summary of a published
    series, including its benign behaviour and predominantly Schwann cell cytology, and the 2026
    methylation study's conclusion (PMID:22327363, PMID:43020433, PMID:41657107). Low-grade
    fibromyxoid sarcoma (MONDO:0006272), for the soft tissue form: the abrupt myxoid transition
    and curvilinear vessels (sclerosing perineurioma also has extensive collagen, so collagen may
    not separate them, an inference graded INDIRECT), EMA in up to 40%, and MUC4 and FUS
    rearrangement (PMID:22327363, PMID:43020433). Solitary fibrous tumour (MONDO:0016238), for the
    soft tissue form: nuclear STAT6, absent in 10 of 10 soft tissue perineuriomas, with CD34
    shared and EMA positive in a minority (PMID:24030747). Conventional malignant peripheral nerve
    sheath tumour, bound to the general class MONDO:0017827 (the row's notes record the searches),
    for the malignant form: the perineurial MPNST series' selection by architecture and
    immunophenotype, with the review's caveats that MPNST may lose S-100 (so S-100 negativity
    alone may not separate them, an inference graded INDIRECT) and may express EMA, and that
    whorls are frequent but not specific in MPNST, the series' own electron microscopy, the
    series' tumours' lack of NF-1 association or neurofibroma component against neurofibroma as
    the "main recognizable benign precursor" of MPNST, their course and the series' impression of
    a better prognosis, the review's table, and the 2026 methylation study's finding and
    conclusion (PMID:9808129, PMID:22327363, PMID:43020433). Sentences already quoted elsewhere in
    the entry keep their evidence_source and quote_role. Validated with just validate, just
    validate-terms, just count-verified-snippets, just check-snippet-grading and just
    check-snippet-length.

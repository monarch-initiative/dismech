  summary: 'Perineurioma: open questions on neurofibromatosis and hybrid tumours'
  details: >-
    Added a discussions section with three open items, each giving the sources' competing readings.
    perineurioma_in_neurofibromatosis (OPEN_QUESTION, attached to the Soft tissue and Intraneural
    subtypes, the NF2 genetic row and the Somatic NF2 Inactivation node, whose notes infer that its
    mutations are somatic): single soft tissue cases in patients with NF2 (PMID:17122521, the first
    such report) and NF1 (PMID:17696922, PMID:24294391, PMID:28812461); how each report established
    the syndrome (clinical criteria in 2006 and 2013, clinical signs and genetic testing in the 2020
    series, whose tumours were found by a radiologic or pathologic diagnosis, not stated in the 2007
    and 2017 abstracts); the 2007 report's background statement of no known association
    (BACKGROUND), the 2013 report's statements that larger series have not observed one
    (BACKGROUND), that its tumour's unusual origin from a visible nerve likely relates to the
    patient's NF1, and that the tumour may be underreported in NF1; and a 2020 series in which two
    of 112 patients with intraneural perineurioma had NF2, with a third seen by virtual consultation
    added outside that count, whose authors suggest that the rarity of both conditions could explain
    how seldom they occur together, and read their cases as further evidence of a potential link
    (PMID:32529330). The rationale points to the NF2 row's note on an intraneural study that reports
    no signs of NF2. hybrid_tumours_and_neurofibromatosis (CONTROVERSY, attached to the Hybrid
    schwannoma-perineurioma differential row): a 2009 series of 42 with no signs of
    neurofibromatosis presumably from the clinical details supplied by referring pathologists, and
    no evident association (PMID:19623031) against a 2023 systematic review's 10 NF1 and 2 NF2
    histories among 74 pooled cases with data, its occasional association, its call for future work
    on the association, its limitations (variable reporting, reporting bias, observational studies
    and selection bias), its aim of identifying all reported cases and its 72 cases from articles of
    2000 to 2009 (both INDIRECT for the overlap), and its type breakdown (137
    perineurioma-schwannomas, 20 perineurioma-neurofibromas, 2 three-way hybrids), which does not
    say which kind the patients with neurofibromatosis had (PMID:36396843). The rationale says part
    of the disagreement may be one of scope, and that the review's aim and its 72 cases from 2000 to
    2009 make it likely to include the 2009 series, in which case the counts are not independent.
    nature_of_hybrid_schwannoma_perineurioma (OPEN_QUESTION, attached to the same row; prompt: do
    one or both cell populations carry the drivers of schwannoma or perineurioma, or is the tumour
    distinct and fusion-driven): the 2009 series' admixture of two cell types and its statement that
    the basis of the dual differentiation is poorly understood; a 2021 RNA-sequencing study's
    discussion, which raises, by analogy with the two cell populations, that one or both carry the
    conventional tumours' drivers (BACKGROUND), its VGLL3 rearrangement in 14 of 18, unrelated
    fusions in two and none identified in two, its partly VGLL3-selected cohort, its reading of a
    distinct entity, and its authors' statements that the fusion does not exclude other genomic
    drivers and that whether one or both cell types carry it remains to be established
    (PMID:33649458); and the 2026 methylation sentence already cited on the hybrid row, with its
    existing grading (PMID:43020433). Left out: the 2006 report's background statement on NF2 gene
    changes in perineurioma, a 2020 single NF2 case whose PubMed record has no abstract
    (PMID:32271143), and every sentence the sources give in chromosome or copy-number terms. 34 new
    evidence items; eight new reference cache files (PMID:17122521, PMID:17696922, PMID:19623031,
    PMID:24294391, PMID:28812461, PMID:32529330, PMID:33649458, PMID:36396843). A literature digest
    sub-agent listed candidate quotes, and every quote was checked against its source with the
    reference validator's own normaliser. just validate and count-verified-snippets pass.

  summary: 'Edit: Perineurioma — imaging, nerve conduction studies and biopsy'
  details: >-
    Adds an imaging_findings section for the intraneural form with seven rows: nerve enlargement,
    usually fusiform (HP:0012645 Enlarged peripheral nerve; 29 of 32 and 10 of 10, with a 2018
    series of 19 that reports an aspecific enlargement in 16 and a fusiform tumour in five, which
    its results call typical and its abstract atypical, and whose authors call most enlargements
    non-specific, graded REFUTE and INDIRECT; two further REFUTE items record that lipomatosis,
    schwannoma and neurofibroma, and amyloidosis, can show some of these features, with the sources'
    qualifiers); T2 hyperintensity (NCIT:C182328 Hyperintensity; 25 of the 27 with a T2 reading and
    9 of 10, banded very frequent); gadolinium enhancement (NCIT:C28746 Gadolinium-Enhancing Lesion;
    20 of 20 and 10 of 10); denervation oedema of the supplied muscles (HP:0100748 Muscular edema,
    with the searches in its notes; one patient of the longitudinal series, three to six of eight in
    a 2026 FDG PET series, banded frequent, and one child whose case is graded INDIRECT); hypoechoic
    fusiform enlargement on ultrasound (NCIT:C208181 Hypoechoic; a 2025 series of 11 and one child);
    increased nerve cross-sectional area on ultrasound (HP:6001147); and low-level FDG uptake
    (NCIT:C116094 FDG-PET Scanning Finding; eight patients, five diagnosed from clinical and MRI
    findings, banded very frequent, with the authors' advice on when PET should and should not be
    used, their caution that unexpectedly high uptake calls for reconsidering the diagnosis, and the
    study's stated limits). In the diagnosis section, the biopsy row gains the longitudinal series'
    biopsy counts, technique, unquantified morbidity and yield (on our reading it attributes no
    worsening to a biopsy, and its cohort was selected on a diagnostic biopsy), 2009 advice, and a
    2026 statement that a classic picture often allows the diagnosis without biopsy; the MRI row's
    first sentence now points to the imaging findings and says the enlargement is usually fusiform,
    its second states the criteria's shape and thresholds, and the row gains the longitudinal
    series' and the 2026 series' statements on the diagnostic value of the combined MRI features, as
    well as the diagnostic-criteria study's cohort and accuracy (specificity and positive predictive
    value 1.0; the abstract gives no sensitivity for the criteria), the limits of older or
    conventional MRI and the 3 T recommendations, the 2026 series' field strengths, a 2018 series
    that, on our reading, calls diagnosis from a typical clinical presentation with MRI and nerve
    conduction studies of little help in its patients, the 2015 review's checklist for a missed
    lesion, and a note on shared authors, as do the gadolinium, biopsy and nerve conduction rows
    (such notes are given where sources sharing authors corroborate each other on a row; the PET
    series' sentences on other conditions are not treated as corroboration); a new row for
    high-frequency ultrasound (NCIT:C17230 Ultrasound Imaging), with the case report's advice to
    consider it, follows it; the nerve conduction row's first sentence now says its findings suggest
    loss of axons, and the row gains the longitudinal series' findings, which suggest mainly axonal
    degeneration, its counts and localisation, why MRI is still needed, and a 2015 review's call for
    electrophysiological localisation before imaging. Sources: PMID:19567701, PMID:41657107,
    PMID:30637060, PMID:26323815, PMID:40302315, PMID:40353166, PMID:42804796, PMID:29192862. 86 new
    evidence items, 16 INDIRECT and 6 REFUTE (the 2018 series' statement that most of its
    enlargements were non-specific, on the enlargement row and, as making MRI with nerve conduction
    studies of little help, on the MRI row; the 2018 sentence on lipomatosis, schwannoma and
    neurofibroma on the enlargement row; and the PET series' sentence on amyloidosis on the
    enlargement, T2 and gadolinium rows). The gadolinium row also cites the PET series' statement
    that CIDP typically lacks enhancement, and the denervation row gains a shared-author note. The
    three MRI imaging rows are marked diagnostic as features of the Perineurioma Diagnostic
    Criteria, which they cite, with a note that the sources give diagnostic value to the
    combination. Sentences from a results or discussion section carry a quote_role and directness;
    sentences describing a study's methods carry none, unless cited for an inference, when they are
    graded INDIRECT. Sentences already quoted elsewhere in the entry keep their evidence_source and
    quote_role. Validated with just validate, just validate-terms and just count-verified-snippets.

  summary: 'Perineurioma: codes, mappings, Orphanet prevalence and epidemiology'
  details: >-
    Added mappings, classifications and epidemiology, and NCIT mappings on the five subtypes. Entry
    mapping: NCIT:C4973 Perineurioma (exactMatch; MONDO's cross-reference, and NCIT's definition
    covers soft tissue, intraneural and mucosal sites). ICD10CM:D36.1 (relatedMatch) is mapped on
    the Intraneural and Soft tissue subtypes, not the entry, since the benign-only code does not
    cover the malignant subtype. Orphanet attributes WHO ICD-10 D36.1 to its two disease records
    (ORPHA:100003, ORPHA:100002) and records each form as broader than the code (BTNT; the
    repository's Orphanet serializer renders this as Broader, and the raw Orphadata relations for
    both records confirm it). The code also takes in other benign peripheral nerve tumours, so the
    relation is an overlap and is recorded as related rather than broader or narrower. Where the
    predicate is the curator's (these two, and the Soft tissue NCIT closeMatch), mapping_source
    names the source of the pairing and manual curation. Subtype NCIT mappings: Intraneural
    NCIT:C6911 (exactMatch) and Soft tissue NCIT:C6912 (closeMatch, the curator's choice: Orphanet
    gives soft tissue perineurioma as a synonym of its extraneural record but also includes visceral
    sites, while NCIT names soft tissue sites) from MONDO's cross-references; Reticular
    NCIT:C207064, Sclerosing NCIT:C207065 and Malignant NCIT:C207066 by manual curation, since MONDO
    gives the first two no NCIT cross-reference and cross-references malignant perineurioma to
    NCIT:C66845, which NCIT has retired (2024). Classifications: Harrison's oncology and haematology
    part, and ICD-O morphology group Nerve Sheath Neoplasm with a 2026 study's background sentence
    (PMID:43020433), graded INDIRECT for the group; the notes record MONDO's ICD-O codes 9571/0 and
    9571/3, for which the schema has no slot. Epidemiology: age of the intraneural form (median 18
    years at diagnosis, 13.5 at onset, PMID:34284162), age of the soft tissue form (mean 46, range
    10 to 79, PMID:15958848) and sex (slightly more than half female in the 2021 systematic review
    and in the 81-case soft tissue series, the two sclerosing series differing, with a pointer to
    the Sclerosing subtype that cites them). Prevalence: Orphanet's point-prevalence class below 1
    in 1 000 000 for the intraneural (ORPHA:100003) and extraneural (ORPHA:100002) forms, and the
    existing intraneural record's note now says no study reports a rate, points to Orphanet's class,
    and says its own class (not yet documented) refers to the absence of a measured rate.
    ORPHA:85102 is a clinical group, which the repository's Orphanet index does not cover, so no
    cache file can be built for it; the reticular (ORPHA:100000), sclerosing (ORPHA:100001) and
    malignant (ORPHA:252128, MONDO's cross-reference for malignant perineurioma) records were built
    locally to check and have no phenotype or epidemiology rows; none is cited, so their cache files
    are not committed. 7 new evidence items. just validate, validate-terms and
    count-verified-snippets pass.

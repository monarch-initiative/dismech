  summary: 'Edit: Perineurioma — intraneural form: motor signs, course on follow-up,
    somatic origin and surgery'
  details: >-
    Adds three phenotype rows for the intraneural form from the 2009 longitudinal series of 32
    patients (PMID:19567701): foot drop (HP:0009027 Foot dorsiflexor weakness; 11 of 32, with the
    series' count of sciatic involvement, the four patients wearing ankle-foot orthoses at
    telephone follow-up, and a 2024 case report, PMID:38434310), wrist drop (HP:0031189; 3 of 32,
    with the one patient using a wrist brace) and reduced or absent reflexes (HP:0001315 Reduced
    tendon reflexes, the HPO parent of hyporeflexia and areflexia; 16 of 29 with recorded
    reflexes), each with an edge from Axonal Degeneration in the Affected Nerve
    (INDIRECT_UNKNOWN_INTERMEDIATES, one INDIRECT item each). Extends the progression phase with
    the series' follow-up: Neuropathy Impairment Score 12.6 to 15.4 points (P = 0.19), follow-up
    MRI unchanged in 11 patients, the symptom questionnaire's mildly worse ratings (15 responses,
    five at the first visit) and the telephone follow-up of 23 patients, seven of whom had had
    further surgery (ten unchanged, nine slightly worse, four slightly better). The phase's
    existing sentence on the 2024 review now says that its motor decline count is the review's own
    classification of that follow-up. On the TRAF7 genetic record, notes that the 2017 series
    (PMID:28019650) calls the mutations somatic but had germline DNA for only 7 of 16 patients and
    filtered variants against those samples, in-house exomes and population databases, and that
    the 2026 series (PMID:41657107) sequenced DNA from paraffin-embedded tumour tissue and
    describes no germline comparison; the two 2017 methods items and the 2026 methods item are
    graded INDIRECT, since they bear on somatic origin only through the limit they show, and carry
    no quote_role. Adds a treatment row for the intraneural form, Nerve resection, with or without
    grafting, bound to NCIT:C51785 Neurectomy (the row's notes record the NCIT searches and why
    not NCIT:C94428 Nerve Grafting), with an INHIBITS link to Intraneural Perineurial Cell
    Proliferation backed by the 2021 systematic review's no-recurrence finding (PMID:34284162,
    INDIRECT) and qualified by the 30-patient series' suggestion that tumour cells may remain
    along the nerve (PMID:34030186, INDIRECT). The row's evidence: that finding; a 30-patient
    series' advice against complete resection and its judgement that results after grafting are
    poor (PMID:34030186); the longitudinal series' warning of iatrogenic deficit, its view that
    resection with grafting may be considered for focal, more distal lesions without long-term
    muscle atrophy when the nerve action potential is absent or low, its conclusion that resection
    should usually not be performed, its finding of no spread to uninvolved nerves on surveillance
    MRI (INDIRECT), its two interviewed grafted patients who felt improved after grafting with
    tendon transfers (INDIRECT) and a grafted patient whose wrist and finger extension worsened
    after surgery; the 2024 review's mixed motor outcomes (five of ten improved mildly, five
    stable; one improved patient is also one of the longitudinal series' two); its note that
    resection is widely held, without consensus, to be restricted to shorter lesions, its
    suggestion that complete removal may prevent progression for short terminal-branch
    involvement, its caution for tumours involving major nerves, its restatement of an earlier
    finding that the tumours rarely grew in length (INDIRECT), and the outcomes of its two
    followed-up patients excised without a graft; and the 2026 series' one grafted patient and its
    restriction of surgery to select cases. Items that cut against the treatment are graded
    REFUTE; items naming the cases it is kept for, and favourable outcomes, are SUPPORT. 39 new
    evidence items from cached sources, 15 of them INDIRECT and 12 REFUTE. Validated with just
    validate, just validate-terms, just count-verified-snippets, just check-causal-targets, just
    check-entity-refs and just check-snippet-grading.

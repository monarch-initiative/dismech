  summary: 'Perineurioma: the soft tissue form, its gut sites, and the sclerosing
    and reticular variants'
  details: >-
    Deepened the soft tissue (extraneural) form and its two variants, and added its gut sites; the
    top-level description gains a phrase on the gut. Soft tissue subtype row: depth in the 81-case
    series (PMID:15958848), two acral cutaneous tumours, graded INDIRECT since the report does not
    name the soft tissue form (PMID:9694624), the gut-wide review's conclusion and its background
    statement that perineuriomas arise less often in the gut, both graded INDIRECT for the same
    reason (the same sentence on the node's edge to the colonic polyp is DIRECT for the presentation
    in the gut, as its explanation says), and its background statement that earlier authors
    suggested reclassifying benign fibroblastic polyps as extraneural perineurioma (PMID:40225020),
    and the 2018 exome series of 14 tumours, whose authors take the absence of TRAF7 mutations to
    indicate different pathogenetic mechanisms in the soft tissue and intraneural forms
    (PMID:30303818). Soft tissue proliferation node: circumscription and focal infiltrative margins
    (PMID:15958848); a 2012 review's statement that the tumour almost always lacks an associated
    nerve and may have a capsule (PMID:22327363), beside the 1997 report already cited that
    describes it as generally not encapsulated; the gut-wide review's 84% epithelial membrane
    antigen positivity among 50 gut cases stained for three markers, with no significant difference
    among the three markers in one chi-square test (PMID:40225020) and the gastric review's
    statement that most but not all gastric cases were positive (PMID:41954346), which the top-level
    description and the Immunohistochemistry diagnosis row now allow for; the mucosa of the large
    intestine and of the stomach added as locations; new edges to two new phenotype rows. Colonic
    mucosal polyp (HP:0005266 Intestinal polyp) from a systematic review of 148 gut cases
    (PMID:40225020), and Gastric polyp (HP:0006753 Neoplasm of the stomach) from a review of the
    gastric cases (PMID:41954346), with two items from the gut-wide review. HPO has no term for a
    single colonic or gastric polyp of unspecified type; the colonic row keeps a polyp term, which
    covers the intestine, and the gastric row falls back on the site, as each row's notes explain.
    The gastric row records where the review's text and tables disagree (epigastric pain in most by
    the text and 6 of 13 by the table; screening for the asymptomatic third by the text and for two
    reports by the per-case table; sessile polyps in 12 of 13 by the summary table and in two by the
    per-case table, which leaves the authors' own case blank) and that the two reviews share
    published cases. The painless-mass row and its edge are now scoped to the form outside the gut.
    Outcome phase: from the 81-case series, the absence of metastasis and its reading that atypical
    histological features did not seem to matter clinically; from the gut review, its statements
    that follow-up of the gut tumours is limited and that no direct evidence exists on their
    recurrence rates. Sclerosing row: presentation, duration and size from both series
    (PMID:9414186, PMID:25051109), margins and follow-up from the first, age and sites from the
    second, their difference in sex, and their ages, and the 2012 review's summary, which predates
    the second series. Reticular row: sex, age, sites, symptoms, size, stroma and the two
    followed-up cases (PMID:11257623), and the 2012 review's account of the pattern. TRAF7 genetic
    row gains a note pointing to the exome series. 52 new evidence items, and one existing Outcome
    item's snippet extended and its explanation rewritten. Not added: further NF2 content, because
    what the cited sources add beyond the existing NF2 items is stated at chromosome level; no
    source stated NF1 at gene level. The malignant form is left for its own change. A literature
    digest sub-agent listed candidate quotes, and every quote was checked against its cached source
    before use. Two checker sub-agents, one on the evidence and one on bindings and formatting,
    reviewed the change; their findings were checked against the sources before fixing. just
    validate, validate-terms and count-verified-snippets pass.

  summary: 'Create: Perineurioma'
  details: |
    New entry for perineurioma (MONDO:0019404), a rare benign tumour of the peripheral nerve
    sheath made of perineurial cells. Curated by hand from cached sources: the 2009 longitudinal
    series of 32 intraneural cases and the 2017 exome series of 16 intraneural tumours (both
    full text), a 2026 intraneural series with TRAF7 hotspot testing (full text), a 1995 series
    of eight intraneural tumours, systematic reviews of intraneural cases from 2007 and 2021, a
    30-patient intraneural series, a series of 18 with the plexal form, a 2024 review of
    childhood cases (full text), series of 81 soft tissue, six reticular, 19 and seven
    sclerosing and seven malignant tumours, a 1997 two-case report with a review of the
    literature, a molecular study of NF2 in eight benign tumours, a 2026 methylation study, a
    2018 diagnostic-criteria cohort, a 2008 series of four intraneural tumours (one tested for
    NF2), and a 2024 case report of a malignant tumour (full text). Five subtype rows follow
    MONDO: intraneural, soft tissue (extraneural), reticular, sclerosing and malignant. The
    pathophysiology is two chains, each from a somatic origin node in the perineurial cell
    (CL:0002576): TRAF7 WD40-domain mutation, intraneural proliferation, axonal degeneration,
    and weakness, atrophy and sensory loss, with mononeuropathy from the proliferation node (all
    these edges indirect); and NF2 inactivation, recorded as somatic on the inference that the
    tumours were sporadic, soft tissue proliferation and a painless mass. Five of the six
    phenotype rows carry frequency bands from the intraneural series; pain is not linked to a
    mechanism, because no cited source establishes how the tumour produces it. Diagnosis rows
    cover targeted fascicular biopsy, MRI with the diagnostic criteria, nerve conduction studies
    with electromyography, and immunohistochemistry; treatment rows cover observation, tendon
    transfer and excision. Two progression phases and one cases-in-literature row for the
    intraneural form complete it. A 2018 genomic series of soft tissue tumours is not cited,
    because its TRAF7 result sits beside chromosome-level findings left out of this entry. The
    deep-research report generated for this entry was used as a lead and is not committed.
    Validated with just validate, count-verified-snippets (91 of 91) and the pre-PR gates.
- type: REVIEW
  outcome: changed
  sections:
  - pathophysiology
  summary: 'Review round 1 on PR 18667: grade three background quotes, explain the actin binding'
  details: |
    Answers the automated review of PR 18667. Three quotes that restate earlier work (TRAF7's
    interaction with MEKK3 and its role in NF-kappaB signalling; the NF-kappaB mechanism
    proposed for the TRAF7 variants; merlin's role in cell survival, proliferation and adhesion)
    are graded IN_VITRO, the evidence they describe or rest on, keeping quote_role BACKGROUND,
    instead of OTHER; none of the three sentences is quoted in another entry. The NF2 node keeps
    actin binding as its molecular function, and its notes now say why: it is the binding the
    Schwannoma, Ependymoma and Malignant_Mesothelioma entries use on their NF2 nodes, recorded
    so that the node names an activity of the gene it carries, and not the tumour-suppressor
    role the node describes. The deep-research report the entry drew on
    (research/Perineurioma-deep-research-claude_code.md, with its citations sidecar) is
    committed unchanged, as the review asked. Validated with just validate-disorders,
    count-verified-snippets and the rest of the repository's gate set.

  details: |
    Added conforms_to: lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation on 'Lysosomal Unesterified Cholesterol Accumulation'.

    Only the substrate-accumulation node is claimed. NPC is a lipid EGRESS/transport defect (NPC1/NPC2), not a hydrolase or cofactor deficiency, so the module's 'Lysosomal Hydrolase or Cofactor Deficiency' trigger node is deliberately not declared - unlike the sialidosis and metachromatic leukodystrophy conformers, which do declare it.

    Resolves a contradiction reported on a grouping page: this entry is asserted as a member of a grouping whose NECESSARY criterion it did not satisfy.


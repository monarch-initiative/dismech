  summary: Enriched Noonan syndrome-like disorder with loose anagen hair with synonyms, classifications, molecular function groundings, causal pathograph edges, diagnostic procedures, and treatment links.
  details: Added disease synonyms (Mazzanti syndrome, NS/LAH, NS-LAH), Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, ENDOCRINOLOGY_METABOLISM, DERMATOLOGY, NEUROLOGIC), and RASopathy mechanistic classification backed by verbatim literature snippets. Grounded SHOC2 and PPP1CB pathophysiology nodes with non-protein-binding GO molecular functions, cellular components (including DECREASED nuclear localization on SHOC2 S2G), cell types, anatomical locations, and appropriately scoped downstream causal edges to cardinal phenotypes. Added phenotype categories and diagnostic flags, curated diagnostic procedures (whole-exome sequencing with Sanger confirmation, brain MRI, echocardiography), and enriched somatropin growth hormone therapy (CHEBI:749556) targeting Growth Hormone Deficiency while removing inappropriate therapeutic_modality values from generic supportive care and genetic counseling actions.

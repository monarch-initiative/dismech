  summary: 'Create: Noonan Syndrome-like Disorder with Loose Anagen Hair'
  details: |
    New RASopathy entry for NS/LAH / Mazzanti syndrome (MONDO:0011899), addressing one of four gaps in issue #6206. Curated SHOC2 NSLH1 (MONDO:0054637) and PPP1CB NSLH2 (MONDO:0054588) subtypes; pathophysiology of aberrant SHOC2 N-myristoylation p.Ser2Gly and PP1C-SHOC2 RAF dephosphorylation converging on RAS-MAPK dysregulation; 12 phenotypes including loose anagen hair HP:0040169, GH deficiency, macrocephaly, congenital heart defects; autosomal-dominant de novo inheritance; GH/supportive/genetic-counseling treatments. Evidence on verified PMIDs 19684605 Cordeddu 2009 SHOC2, 27264673 Gripp 2016 PPP1CB, 12673660 Mazzanti 2003, 24124081 Mazzanti GH therapy. An initially DR-suggested PMID for the PPP1CB paper was a misattribution 26173643 SOS2 Noonan and was corrected via literature search. All snippets validated as exact substrings; schema/term/reference validators pass.

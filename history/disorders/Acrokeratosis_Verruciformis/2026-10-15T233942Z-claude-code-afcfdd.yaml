  summary: 'Create: Acrokeratosis Verruciformis'
  details: |
    New entry for acrokeratosis verruciformis of Hopf (MONDO:0007048), replacing the minimal seed and deleting stubs/Acrokeratosis_Verruciformis.yaml.

    Lump/split decision: curated as a DISEASE allelic with Darier disease, not as a Darier subtype. Grounds: separate MONDO and OMIM (101900) records; a recurrent ATP2A2 p.(Pro602Leu) variant not reported among Darier variants (PMID:28498512, PMID:22814319); acral distribution sparing seborrheic areas and histology without acantholysis or dyskeratosis (PMID:12542527, PMID:42205461); and Chinese AKV families with no ATP2A2 variant and no linkage to 12q23-q24 (PMID:16716163). The counter-evidence (AKV-like papules in 73% of adults with Darier disease, PMID:1390140; Darier histology in such papules, PMID:9378638; coexistence, PMID:15515213; focal acantholysis on step sections of P602L lesions, PMID:22814319; Darier-like cytology, PMID:27663152) is recorded in a CONTROVERSY discussion and a separate, inconstant pathophysiology node with SUPPORT and REFUTE evidence. Darier_Disease.yaml was not edited and still does not mention AKV.

    Curated: synonyms, parents, Harrison classification, prevalence (UNKNOWN measure, RARE class; the only figure is a clinic-based 1 per 41,000 dermatology consultations, not normalized), autosomal dominant and sporadic inheritance (HP:0000006, HP:0003745), a four-node pathophysiology chain (P602L loss of SERCA2 calcium transport; ER calcium homeostasis in keratinocytes, marked INDIRECT because no study measured it in AKV; abnormal keratinocyte differentiation with verrucous hyperplasia; focal acantholysis with mild dyskeratosis), eight phenotypes with six causally connected (acrokeratosis HP:0200016, punctate palmoplantar hyperkeratosis, hyperkeratosis, hypergranulosis, epidermal acanthosis, and squamous cell carcinoma as a sequela of longstanding papules); nail dystrophy and leukonychia are left unwired because no source gives their mechanism. Genetic block with P602L and A698V variants and REFUTE evidence for genetic heterogeneity; diagnosis (skin biopsy, ATP2A2 testing, dermoscopy); treatments (superficial ablation, cryotherapy, systemic retinoids with acitretin and etretinate, topical keratolytics and retinoids, genetic counseling); a KNOWLEDGE_GAP on why P602L gives an acral non-acantholytic phenotype and on the unidentified second locus. Term bindings reuse the Darier entry's SERCA2/keratinocyte terms (GO:0005388, CL:0000312, GO:0030216, GO:0031424, GO:0098609, UBERON:0001003) where they fit; GO:0032469 and HP:0200016 were looked up in OLS.

    Deep research: one openscientist report (research/Acrokeratosis_Verruciformis-deep-research-openscientist.md, with .citations.md and an _artifacts dir holding the provider's final_report.html and .pdf). The job was started once; after a container restart the report was retrieved by re-attaching to that original job (aa79c9e3-3df9-47ee-b6b4-a7a78eaef4c7), with no second job submitted. Its reference validation: 19/19 references resolved, 0 off topic, 16/17 quotes found; the unsupported quote attributes a sentence from PMID:31696902 to PMID:28498512, so that attribution was not reused. Term validation: HP:0007531 unresolved (not used) and NCIT:C1516 is Lisofylline, not a keratolytic (not used). Report claims dropped: that P602L is a milder partial loss of function than Darier alleles (contradicted by the functional assay in PMID:12542527 showing loss of calcium transport); that human AKV has no reported skin cancer (two SCC cases are reported in PMID:42205461); the Darier organoid, calcium-pump review and Darier microbiome papers (PMID:41466489, PMID:39207315, PMID:37496039) and the second-hit somatic study (PMID:38536168), because they describe Darier disease and the report itself marks their transfer to AKV as inferred; and the Atp2a2 heterozygous mouse (PMID:11389134), which models tumour predisposition rather than AKV. PMID:3323700 (etretinate failure) was taken from the report. Most evidence came from a separate PubMed search; the 2026 review PMID:42205461 (full text cached) is the phenotype baseline.

    just preflight-dr could not run: it requires the local MONDO build (/root/.data/oaklib/mondo.db, about 1.3 GB), which is absent and was not downloaded. As a manual Named Entity Confusion check, the report names ATP2A2 37 times, ATP2C1 never, and MONDO:0007048 consistently, matching the MONDO causal gene recorded in the stub. just check-genereviews --online: NO_CHAPTER for GeneReviews; the StatPearls chapter PMID:30725935 is cited and tagged.

    Validation: just validate, validate-terms, count-verified-snippets (63/63), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-coarse-phenotypes, check-snippet-grading, normalize-cache, check-term-cache-integrity and validate-disorders all passed.

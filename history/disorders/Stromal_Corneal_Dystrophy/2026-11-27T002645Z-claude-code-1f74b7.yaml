  summary: 'Review fixes: Stromal Corneal Dystrophy'
  details: |
    Retargeted the Supportive Ocular Surface Care target_mechanisms link from TGFBI Protein Deposition to the Recurrent corneal erosions phenotype, matching the quoted sentence (conservative care treats corneal erosion). Reworked the PIKFYVE Endosomal Phosphoinositide Dysregulation node: replaced GO:0042147 (retrograde transport, endosome to Golgi), which no cited source supports, with GO:0016197 (endosomal transport), grounded in Li et al. 2005 (PMID:15902656), which describes PIP5K3 regulating sorting and traffic of peripheral endosomes; added that paper and the IC3D Edition 3 fleck dystrophy histopathology sentence (swollen, vacuolated keratocytes containing GAGs and complex lipids) as node evidence; rewrote the description to state that reduced kinase activity is inferred from the allele spectrum. Added PMID:15902656 as evidence on the PIKFYVE genetic row. Replaced CHST6 molecular function GO:0008146 with the more specific GO:0001517 N-acetylglucosamine 6-O-sulfotransferase activity. Added evidence for the GCD2 East Asia prevalence note and a GCD2 Korea prevalence record (11.5 per 10,000, quoted from the GCD2 mini-review, marked REVIEW_SYNTHESIS). Added a CSCD strabismus patching/surgery treatment from the GeneReviews management section, targeting Strabismus. Added a note explaining why Amblyopia carries no frequency. Dropped two generated MONDO label-variant synonyms. Replaced the TGFBI genetic-row snippet that contained citation numerals with a clean abstract sentence from the same paper.

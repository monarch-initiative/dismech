  summary: 'Create: Stromal Corneal Dystrophy root with subtypes'
  details: |
    De-novo root entry for stromal corneal dystrophy MONDO:0020213, issue #8458, CURATE_ROOT_WITH_SUBTYPES. Six subtypes modeled: macular MCD/CHST6 AR, Schnyder SCCD/UBIAD1 AD, congenital stromal CSCD/DCN AD, and the TGFBI arm GCD1/GCD2/LCD1 cross-referencing existing TGFBI_Corneal_Dystrophies.yaml. Shared pathophysiology: inherited non-inflammatory abnormal stromal deposition then progressive stromal opacification. Sandbox had no scholarly network egress: NCBI/EBI/OLS/OpenAlex blocked 403 via egress proxy; WebFetch and just fetch-reference blocked; only WebSearch worked. So new references could not be fetched to references_cache and new MONDO/OLS terms could not be network-validated locally. Science confirmed via WebSearch; HGNC IDs CHST6 6938, UBIAD1 30791, DCN 2705, TGFBI 11771 and subtype MONDO IDs confirmed against monarchinitiative.org and NORD. Evidence attached only to already-cached offline-verifiable DOI reviews DOI:10.3390/vision7010022 and DOI:10.3341/kjo.2023.0032; all 5 snippets confirmed exact substrings of cached bodies. Subtype molecular mechanisms kept in node descriptions/notes with real PMIDs as plain-text provenance rather than unverifiable snippets, per evidence SOP section 4. Local validation: linkml-validate schema No issues found; validate-terms fails only on the 4 new uncached MONDO terms network-blocked, all HP/CL/GO/UBERON/NCIT/hgnc pass; snippet substrings confirmed; pytest structural tests pass for this file. MONDO network validation and reference fetching deferred to CI which has network.

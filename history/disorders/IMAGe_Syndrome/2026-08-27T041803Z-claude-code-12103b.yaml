  summary: 'Create: IMAGe Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0210 (CDKN1C, OMIM 614732). Deep research: claude_code provider. NEC preflight returned WARN on a rival gene, PCNA at 47% of CDKN1C mentions; on inspection that is not a second disease but the PCNA-binding domain in which the IMAGe variants cluster, so no content was excluded on that basis. GeneReviews (PMID:24624461) fetched and used as the phenotype baseline. The entry records the two mechanistically unusual features explicitly: the variants are gain-of-function through protein stabilization (PMID:24098681), the mirror image of the loss-of-function CDKN1C variants causing Beckwith-Wiedemann, and inheritance is imprinted so only maternal transmission causes disease. Frequency discipline: metaphyseal dysplasia is curated as OCCASIONAL despite being in the acronym, because GeneReviews says it is only occasionally present and of varying severity. A KNOWLEDGE_GAP discussion records that nothing in the stabilization mechanism explains the adrenal tissue selectivity. NCIT:C2322 (Corticosteroid), which CLAUDE.md gives as a drug-class example, failed the ChemicalEntityTerm dynamic enum and was replaced with CHEBI:24261 and CHEBI:25354. Validation: schema clean, term validation passed, 25/25 snippets verified.

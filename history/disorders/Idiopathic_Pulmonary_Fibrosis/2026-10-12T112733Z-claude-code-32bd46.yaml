  summary: Add rentosertib (TNIK inhibitor), its phase 2a trial, and the proteomic
    aging-clock question
  details: |
    Curated the rentosertib programme into the entry from three sources fetched this session: the phase 2a trial report (PMID:40461817), a TNIK inhibitor patent review (PMID:40820280), and the proteomic aging-clock reanalysis of the same cohort (PMID:42706338), plus the registry record for NCT05938920.

    Added a Rentosertib treatment record (SMALL_MOLECULE, NCIT:C93352 Targeted Therapy, therapeutic_agent CHEBI:747470 rentosertib) with three evidence items from the trial: the authors' tolerability conclusion, the 60 mg QD forced-vital-capacity change against placebo, and the discontinuation toxicities. Two target_mechanisms edges. The edge to 'Excessive extracellular matrix deposition' rests on dose- and time-concordant falls in serum COL1A1, FAP, FN1 and MMP10 and on enrichment of the downregulated set for extracellular matrix organization; both items are graded directness: INDIRECT because the measured quantity is circulating protein abundance and the trial reported no histological or imaging measure of lung fibrotic burden. The edge to 'Chronic canonical Wnt activation' records the target rationale rather than a measurement: the patent review places TNIK in the Wnt/beta-catenin pathway (quote_role: REVIEW_SYNTHESIS, evidence_source: OTHER) and the trial report's introduction states the target claim (quote_role: BACKGROUND), and the description says plainly that no Wnt readout was measured under rentosertib.

    Added clinical trial NCT05938920 (PHASE_II, COMPLETED), with registry state verified against the ClinicalTrials.gov v2 API on 2026-10-12: phase 2, completed, 71 actual participants, completion 2024-08-08, results first posted 2025-12-02, all agreeing with the published report. Its registry evidence item is graded OTHER as a registration document. The quotable span deliberately omits the drug code: the cached record escapes it as 'INS018\_055' and an underscore is a word character under snippet normalization, so a snippet containing INS018_055 cannot match that cache.

    Added discussion disc_ipf_aging_clock_deconvolution (KNOWLEDGE_GAP, OPEN) attached to treatments#Rentosertib and the two senescence nodes, with two proposed experiments. The six proteomic clocks all read lower in the treated arms, and the question is whether that is aging biology or the reversal of a disease protein signature the clocks score as age; the confounding is structural in a cohort where everyone has the disease, and the authors say so themselves. No biological-age BiomarkerReadout was added: a clock output is a value computed over other measurements, which is the undecided case recorded in design decisions section 12, and NCIT has no term for an epigenetic clock or biological age.

    A sponsor-independence caveat is recorded in the treatment notes: all three literature sources are authored by Insilico Medicine, the trial sponsor, and share the same 42-71 patient cohort.

    Validation on the changed file: linkml-validate clean; validate-terms passed, adding CHEBI:747470 to cache/chebi/terms.csv and the chemicalentityterm enum cache; validate-disorders passed with 237/237 snippets verified and 241 titles checked. Every snippet was pre-checked against the normalized cache bodies before insertion; the one candidate that failed that check was replaced rather than reworded into prose. Offline gates run on the file: duplicate keys, entity refs, causal targets, qualifier terms, enum values, block-scalar comments.

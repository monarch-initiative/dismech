  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the part of the earlier OpenScientist senescence-first sweep that never merged, rebased onto main's rewritten entry (3809 lines). Four citations were still absent and all four were applied, with snippets re-derived from references_cache on disk rather than copied from the old branch. PMID:12707032 (Chilosi 2003) goes on Chronic canonical Wnt activation, whose evidence was entirely in vitro: nuclear beta-catenin with cyclin-D1 and matrilysin induction in 18 of 20 human IPF/UIP samples, absent from normal lung and other fibrosing pneumonias, localized to proliferative bronchiolar and honeycomb lesions rather than to AT2 cells. PMID:34969962 (Kathiriya 2022) goes on Aberrant basaloid cell emergence, sourcing that node's previously uncited statement that human AT2 cultures can undergo a basal transition, and recording that the transition is driven by mesenchymal TGF-beta1 and BMP antagonism rather than by senescence and that murine AT2 cells did not transdifferentiate. The cache now holds full text, so the snippet is the abstract's load-bearing sentence rather than the old sweep's organoid sentence. PMID:30616998 (Justice 2019) goes on the Dasatinib and Quercetin treatment, whose description already asserted the uncontrolled 14-participant result with no citation; the quoted split outcome is improved physical function with unchanged pulmonary function. PMID:30067250 (Molina-Molina 2018) was re-purposed rather than re-applied: the old sweep used it as a REFUTE item against the senescence-first hypothesis, and main's hypothesis notes now explicitly reject that inference (short leukocyte telomere length is an enrichment feature, not a boundary on senescence mechanisms), so it is applied instead as SUPPORT on Alveolar epithelial telomere dysfunction for the subset frequency, a quarter of sporadic and half of familial cases, which nothing in the entry cited. The explanation states that the figure describes detectable shortening in the assayed compartment and is not a measure of the senescence-mediated fraction. One knowledge gap was added, the unstudied MUC5B by AT2-senescence interaction, attached to genetic#MUC5B, the MUC5B pathophysiology node and the senescence node, with two proposed experiments; its rationale marks the reported PubMed absence as reported rather than documented, since the provider committed no query log. Three prose corrections from the old sweep were checked and not re-applied because main had already made them independently: the senescence node now lists DNA damage, telomere dysfunction, chronic Wnt signaling and metabolic stress as candidate routes rather than telomere attrition alone; main has its own Chronic canonical Wnt activation and AT2 fatty-acid oxidation impairment nodes feeding the senescence node; and Circulating GDF15 is already curated with a correlation readout. The old sweep's second knowledge gap, on senescence-to-basaloid causality, was skipped because its premise no longer holds: main removed the AT2-senescence-to-basaloid edge, and the node description already records the origin and causal contribution as unresolved. The claude-opus-5 assessment sidecar was copied across verbatim (sha b838edd7) beside main's existing codex assessment; its summary narrates the original sweep's integration actions, several of which main's parallel curation had already landed in its own form. Verified: linkml-validate clean, 218/218 snippets verified, duplicate-key, entity-ref, causal-target, enum-value, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all clean.

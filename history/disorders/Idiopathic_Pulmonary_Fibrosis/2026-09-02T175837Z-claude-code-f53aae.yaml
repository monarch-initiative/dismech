  summary: Integrate assessed OpenScientist findings for senescence_first_model
  details: |
    Reviewed kb/hypotheses/Idiopathic_Pulmonary_Fibrosis/senescence_first_model/openscientist.md and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml (verdict PARTIALLY_SUPPORTED, 14 claims). Fourteen cited papers were fetched into references_cache/ and checked against the report's quotations; all matched and none was mis-attributed. Integrated: (1) new pathophysiology node 'Chronic WNT/beta-catenin pathway reactivation' with a downstream edge to 'AT2 cell senescence and SASP', evidenced by PMID:32109549 (chronic but not acute canonical WNT activation induces ATII senescence; IN_VITRO) and PMID:12707032 (nuclear beta-catenin in 16 of 20 human IPF/UIP samples; HUMAN_CLINICAL); (2) PMID:39927460 on the AT2 senescence node, a CPT1a/fatty-acid-oxidation route into the same state, plus a description edit recording that telomere attrition is one route in rather than the only one; (3) PMID:34969962 on 'Aberrant basaloid cell emergence', which supplies the AT2-to-basal lineage claim while constraining it, since the transdifferentiation is driven by pathologic mesenchyme and is human-specific; (4) a GDF15 biochemical entry with a CORRELATES_WITH readout on the AT2 senescence node (PMID:31432710), carrying an explicit non-specificity caveat; (5) PMID:30616998, the first-in-human dasatinib+quercetin trial, on the senolytic treatment, quoted so that improved physical function and unchanged pulmonary function travel together; (6) PMID:30067250 (REFUTE) and PMID:32109549 on the senescence_first_model hypothesis entry, attaching sources to the subtype-scope and multiple-trigger statements that its notes previously asserted uncited; (7) two KNOWLEDGE_GAP discussions, disc_ipf_muc5b_senescence_interaction and disc_ipf_senescence_to_basaloid_causality, each with proposed experiments. Deliberately not integrated: the SCARF2 Mendelian-randomization result (PMID:38958042), because the paper is titled and concluded for COPD and its IPF odds ratio is 0.9974 with single-cell and UK Biobank validation supporting COPD only; and the endothelial/fibroblast ageing material (PMID:35879310, PMID:24718857), which is sound but would need endothelial and fibroblast senescence nodes this entry does not have, and which the report itself flags as possibly a separate multi-cellular ageing hypothesis. The immune-independence qualification and the two-hit requirement were already curated and needed no change. No status change: the report recommends retaining ALTERNATIVE.

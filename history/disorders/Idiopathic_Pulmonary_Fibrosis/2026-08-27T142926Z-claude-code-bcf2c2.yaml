  summary: Add microengineered alveolar array lung-on-chip (PMID:41406599)
  details: |
    Added an experimental_models entry for the injection-moulded alveolar array chip with a suspended collagen-elastin hydrogel membrane and breathing-mimetic cyclic actuation (PMID:41406599, Biofabrication), with two modeled_mechanisms links. The curatable claim is that cyclic stretch amplifies TGF-beta 1-driven fibrotic signalling beyond TGF-beta 1 alone, making breathing motion an explicit cofactor of fibroblast activation rather than background; a static culture cannot test this. Links: Fibroblast activation and myofibroblast differentiation (RECAPITULATES), and Excessive extracellular matrix deposition (RECAPITULATES), the latter validated pharmacologically by nintedanib reducing ECM proteins and PAI-1. Limitations recorded: amplification was shown with exogenous TGF-beta 1 rather than endogenous IPF injury signals; the cells are non-diseased, so IPF-specific biology such as the aberrant basaloid state is absent; readouts are expression-level over days rather than accumulated cross-linked matrix; and the defined hydrogel membrane does not reproduce matrix-stiffness feedback. Validated: linkml-validate clean, linkml-term-validator clean, snippets verified.

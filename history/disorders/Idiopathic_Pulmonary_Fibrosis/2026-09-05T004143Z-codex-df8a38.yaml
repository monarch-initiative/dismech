  summary: Make confidence explicit for emerging pathophysiology mechanisms
  details: |
    Set PROVISIONAL confidence on six specific experimental routes: IL-11 autocrine fibroblast signaling, distal MUC5B-dependent clearance impairment, chronic Wnt-driven senescence, AT2 fatty-acid oxidation impairment, epithelial cGAS self-DNA sensing and ERG-associated endothelial repair failure. These have functional model support with incomplete human causal or independent replication evidence. Set gut dysbiosis to HYPOTHETICAL because the cited synthesis and associations do not validate directionality in human IPF. Retain established confidence for the repeatedly supported telomere, epithelial senescence, matrix and physiological injury framework; the MUC5B risk association itself remains established, while the combined clearance mechanism carries the provisional label.

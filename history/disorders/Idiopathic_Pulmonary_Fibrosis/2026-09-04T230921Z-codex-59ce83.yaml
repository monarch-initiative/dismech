  summary: Comprehensive IPF pathograph, clinical and OpenScientist review
  details: |
    Reviewed the entire disorder YAML, the complete senescence_first_model OpenScientist report, all 41 report-body PMID sources and the citation sidecar, and the matching Asta research synthesis. Independently checked counterexamples, primary mechanistic experiments, clinical trials, genetic pedigrees, clinical guidance and registered study status. Entity preflight returned SKIP because MONDO:0800504 has no recorded canonical causal gene; manual disease/synonym, species, tissue and gene-family checks were used. SFTPA1, SFTPA2 and SFTPC findings remain variant-specific rather than treated as interchangeable.

    Content-completeness review:
    - Identity and subtypes: distinguish idiopathic pulmonary fibrosis from the UIP morphologic pattern, progressive pulmonary fibrosis and broader familial/telomere-related ILD. Do not manufacture a validated exclusive 25-50% senescence-first subtype from different blood-telomere denominators. Preserve hypothesis-level causal-ordering uncertainty and variable penetrance.
    - Proximal mechanisms: telomere dysfunction is distinct from TERT loss without measured shortening and from shelterin uncapping. Add MUC5B/clearance, surfactant/proteostasis, chronic canonical Wnt, CPT1a/FAO, self-DNA/cGAS, TGF-beta dysplastic repair, senescent fibroblast persistence and endothelial repair failure. Retain IL-11 and review the existing injury, senescence, regeneration, macrophage and matrix nodes. Do not impose universal STING activation, recruited-immune-cell necessity or an exogenous second hit. Distinguish macrophage-dependent resolution from profibrotic recruitment.
    - Graph and distal manifestations: add explicit evidence for directed mechanisms and physiologic/clinical consequences. Correct reduced elastic recoil to reduced compliance with increased recoil. Trace scarring to dyspnea, exertional limitation, hypoxemia, respiratory failure and pulmonary vascular remodeling. Restrictive physiology is a readout. Cough, crackles and clubbing remain clinical findings without invented mediating arrows. Remove unsupported direct senescence-to-basaloid lineage and gut-dysbiosis causal edges; only source-supported TGF-beta and matrix feedback is represented. No graph connectivity requirement is used to invent arrows or cycles.
    - Clinical coverage: add cough, inspiratory crackles, finger clubbing, hypoxemia, restrictive ventilatory defect and pulmonary hypertension; add UIP histopathology, HRCT, multidisciplinary exclusion of known ILD causes, functional assessment and targeted genetic/telomere evaluation. Distinguish group 3 pulmonary hypertension from group 1 PAH despite the broad HPO label. Add connective-tissue disease, hypersensitivity pneumonitis and asbestosis differentials. Qualify historical survival as heterogeneous and cohort-dependent.
    - Genetics and counseling: link the original MUC5B/TERT/TERC/RTEL1 records to mechanism nodes, add PARN and surfactant-gene disease subsets with evidence, and distinguish common susceptibility from monogenic predisposition. Record age-dependent incomplete penetrance, variable ILD diagnoses and autosomal dominant recurrence in the appropriate subset; no blanket Mendelian inheritance for all IPF.
    - Treatment and trials: add mechanism targets for pirfenidone, nintedanib and approved nerandomilast; distinguish cellular pharmacology from randomized slowing of FVC decline and from unproven reversal/survival benefit. The longer nerandomilast follow-up did not establish a composite exacerbation/hospitalization/death benefit. Replace D+Q rationale quotes with actual pilot results, adverse-event imbalance and tissue-specific target-engagement limits. Add oxygen, rehabilitation, transplant and genetic counseling, plus the PANTHER-IPF harmful-regimen exclusion. Check completed NCT05321069 and NCT02874989 registry design/status independently; distinguish the latter's old open-label title from its mixed open-label/randomized design.
    - Experimental systems: add TRF1, Sin3a and TERT mouse models and immune-cell-free organoids with explicit perturbations, readouts, fidelity and limitations. Preserve and assess the existing breathing lung-chip, including the difference between expression readouts and accumulated cross-linked matrix. Review relevant errata for Sin3a and nerandomilast preclinical pharmacology. Do not call published experiments provider-executed analyses.
    - Biomarkers and datasets: retain FVC as a physiologic trial endpoint, add GDF15 as an observational epithelial-stress/prognostic marker rather than a causal profibrotic arrow. Spatial and methylation-clock associations remain context, not proof of temporal initiation. All eight existing dataset accessions resolve; reviewed organism, tissue and assay descriptions and preserved aggregator versus source-study provenance. No raw or controlled dataset reanalysis was performed or claimed.
    - GeneReviews: fetched the canonical full NBK1230 chapter using fetch-reference URL support after the PMID cache returned only its overview-purpose abstract. Read clinical characteristics, genotype/phenotype tables, syndromic differentials, evaluation strategies, management, surveillance and counseling. Add the GeneReviews tag and exact chapter snippets in clinical features, targeted diagnosis, transplant management and inheritance/counseling. Keep broader familial pulmonary fibrosis distinct from IPF. No manual reference-cache editing.
    - OpenScientist assessment: add an authoritative 32-claim YAML, overall PARTIALLY_SUPPORTED. Reject the false universal-second-hit and obligatory-immune conclusions, TERT/attrition substitution, exclusive subtype percentages, all-surfactant-UPR mechanism and causal GDF15 inference. Qualify MUC5B/telomere literature-gap novelty, basaloid lineage, early-disease timing, MR/SCARF2, epigenetic clocks, senolytic efficacy and proposed experimental designs. Record all 22 declared artifact files as missing in provenance notes, literature/figure generation as REPORTED_ONLY, and future computational analyses as SKIPPED. No successful provider execution is inferred from figure placeholders or publication results.

    Validation: targeted disease schema/ontology/evidence validation and the 32-claim assessment's schema, relative links and verbatim report quotes passed. Dataset verification passed 8/8. Scoped duplicate-key, enum, entity-reference, causal-target, qualifier and source-defect checks passed. Additional snippet/title/offline cache and precommit results are reported in the PR. Reference caches were generated through fetch-reference; the frozen shared dataset-accession file is sparse-excluded and was never read, written or staged.

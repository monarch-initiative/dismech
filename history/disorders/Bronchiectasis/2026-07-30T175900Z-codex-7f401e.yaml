  summary: Strengthen Bronchiectasis evidence model
  details: |
    Reviewed the bronchiectasis entry for causal evidence, phenotype support, diagnostic structure, and guideline-concordant treatment. Added evidence to core vicious-vortex mechanisms and causal edges; added exact support for dyspnea, hemoptysis, wheeze, and 70%-frequency crackles; structured CT and pulmonary-function diagnostics; added guideline-supported acute, macrolide, and inhaled antibiotic treatment contexts; and removed unsupported CFTR/SCNN1A modifiers, generic biomarkers, exposures, and routine inhaled-corticosteroid treatment. Folded the Brensocatib therapeutic-agent descriptor from overlapping PR 4134. PR 2620 only added identifiers to the removed unsupported modifiers, so no gene descriptor survived to carry forward.

  summary: 'Genetics pass (d2g series-068): curate SCNN1A and SCNN1G as susceptibility
    loci with a new ion-transport node'
  details: |
    Genetics-gap issue 12275. MONDO:0013087 (BESC2, SCNN1A) and MONDO:0013112 (BESC3, SCNN1G) are grandchildren of this entry's MONDO:0004822 anchor through MONDO:0018956 idiopathic bronchiectasis. Both are recorded as skos:narrowMatch on the entry. Two references were fetched or reused: PMID:18507830, whose conclusion is that ENaC beta and gamma variants might be deleterious and lead to bronchiectasis, especially in trans-heterozygotes who also carry a CFTR variant, and PMID:19462466, which attributes only a small fraction of its cohort to a Mendelian ENaC mechanism and otherwise reports a more than three-fold excess of rare ENaC polymorphisms over controls. On that evidence both genes are typed SUSCEPTIBILITY rather than CAUSATIVE, which is a considered disagreement with MONDO's RO:0004003 typing and is recorded in the mapping justification. SCNN1G was added as a new genetic record; SCNN1A was retyped from a free-text modifier to SUSCEPTIBILITY and given its first evidence. A new Airway Surface Liquid Dehydration node carries SCNN1A, SCNN1G and CFTR and feeds Impaired Mucociliary Clearance. Gene wiring went from 0/0, the whole denominator having been excluded as modifiers, to 2/2. Phenotype inlink unchanged at 7/7. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

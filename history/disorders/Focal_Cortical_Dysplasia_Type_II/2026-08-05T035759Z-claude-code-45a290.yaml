  summary: 'Create: Focal Cortical Dysplasia Type II (MONDO:0011818)'
  details: |
    De-novo curation of focal cortical dysplasia type II, the Taylor-type malformation of cortical development and the most common cause of neocortical epilepsy in children. Previously absent from dismech, though the related DEPDC5-Related_Epilepsy and Tuberous_Sclerosis_Complex entries existed.

    Deep research: claude_code provider (110 KB report, 43 unique PMIDs), report and citations sidecar committed under research/. Treated as leads only; every PMID independently fetched and every snippet verified as an exact substring of the cached abstract.

    Model: a six-node chain from a somatic mTOR-pathway variant in a cortical progenitor, through constitutive mTORC1 signalling in a clonal patch, branching to dysmorphic-neuron/balloon-cell formation and to disrupted migration/lamination, converging on intrinsically epileptogenic dysplastic cortex and drug-resistant focal epilepsy. Both the activator gain-of-function arm and the repressor two-hit loss-of-function arm are modelled.

    Three discussions: (1) CONTROVERSY on whether balloon cells are epileptogenic, recording the patch-clamp reversal showing they cannot fire action potentials; (2) KNOWLEDGE_GAP on the roughly 40 percent of cases that are sequencing-negative despite uniform phospho-S6 positivity; (3) CONTROVERSY on the negative everolimus randomized trial versus its genotype-restricted responder signal.

    Scope decisions recorded in notes: FCD type I and mild MCD are deliberately excluded because the same cohort work shows they are not mTORopathies and are instead enriched for SLC35A2 defects; hemimegalencephaly shares the mechanism but differs in scale.

    Cache note: MONDO:0011818 was new to dismech and the live OLS lookup timed out during term validation. The DiseaseTerm enum cache and cache/mondo/terms.csv were seeded by a one-off validate run against the local sqlite:obo:mondo adapter; conf/oak_config.yaml was restored to its committed ols:mondo state afterwards and is unmodified in this branch.

    Validation: just validate passes (schema, terms, references) with 32/32 snippets verified against cached references.

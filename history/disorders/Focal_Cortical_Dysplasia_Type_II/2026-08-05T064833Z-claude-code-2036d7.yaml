  summary: 'Review response: Focal Cortical Dysplasia Type II (PR 7973, rounds 1-3)'
  details: |
    Append-only record of three review rounds on PR 7973. The CREATE record describes the entry as first written (32/32 snippets); this record describes what it became.

    Added: conforms_to on four nodes, three against pi3k_akt_mtor_cortical_overgrowth (a pre-existing module that names FCD II in its own description and that I had failed to find) and one against epilepsy_excitation_inhibition_imbalance; a dual inheritance block, somatic mosaicism for the activator arm and autosomal dominant with INCOMPLETE penetrance for the germline GATOR1/TSC arm, because recurrence-risk counselling diverges sharply between them; a diagnosis section covering histopathology, MRI, and deep sequencing of resected tissue at 2000-fold depth with its 63 percent yield; clinical_trials NCT03198949; an antiseizure-medication treatment and sirolimus; and quantified phenotypes for developmental delay (49.1 percent), epileptic spasms (20.5 percent), and epileptic encephalopathy (12.5 percent).

    Genetic section corrections. Five genes the entry was already asserting in its inheritance prose and quoted snippets but not listing were added: RHEB, TSC1, TSC2, NPRL2, and NPRL3. NPRL2 was then removed again, because no cited source reports a causal NPRL2 variant in FCD type II; it appears only in sequencing-panel gene lists. That deliberate exclusion is recorded in the NPRL3 notes so a future curator does not re-add it by accident. NPRL3 was rebased onto a gene-specific finding from PMID:36700525, which also feeds the mutation-negative discussion since it comes from panel-negative cases. variant_origin on the four repressor-arm genes was retyped GERMLINE to GERMLINE_AND_SOMATIC; germline-only contradicted the entry's own quoted snippet and would have dropped the entire repressor arm from a somatic-origin query, which matters because the two-hit architecture is this entry's headline mechanism.

    Other corrections. Epileptic encephalopathy was rebound to HP:0200134, which does exist despite my explanation claiming otherwise, removing a duplicate use of HP:0001263 with two contradictory frequencies. The balloon-cell CL:0000125 binding was dropped, because it asserted a glial lineage that this entry's own controversy treats as open. An unsourced clinical-trial phase was dropped rather than guessed after the ClinicalTrials.gov API returned HTTP 500.

    The sirolimus addition strengthened the mTOR-inhibition discussion materially: two independent trials of two different mTOR inhibitors have now both missed their prespecified endpoints.

    Final state: just validate passes with 54/54 snippets verified. Compliance 83.3 percent. Reviewer decision APPROVE.

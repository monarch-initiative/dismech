  summary: 'Review round 1: ARDS term, human hypoxemia evidence, cell-type binding,
    supportive treatments'
  details: |
    Addressed all four blocking findings and every suggestion from the first review. (1) The severe outcome was bound to HP:0002878 Respiratory failure while both its snippets and its description said acute respiratory distress syndrome; ARDS is now its own phenotype on HP:0033677, wired from the edema node, with the broader respiratory failure state retained separately. (2) Hypoxemia rested only on sheep data, against the CLAUDE.md rule that model-organism evidence must not be the sole support for a human phenotype; two human items were added, to the phenotype and to the edema-to-hypoxemia edge. (3) CL:0002063 pulmonary alveolar type 2 cell was bound with nothing naming type II cells, the sheep snippets saying only epithelial cell number and the research report listing type I, type II and bronchiolar cells as unverified candidates; replaced with CL:0000082 epithelial cell of lung, which the evidence supports. (4) Three supportive treatments were missing and are now curated with quotable human evidence: supplemental oxygen therapy on NCIT:C94624 targeting hypoxemia, mechanical ventilation on NCIT:C70909 targeting the edema, and veno-venous extracorporeal membrane oxygenation on NCIT:C171507 as a BYPASSES link to the ARDS phenotype, with notes recording that it rests on one case report. Corticosteroid therapy gained therapeutic_agent bindings for corticosteroid and methylprednisolone. Suggestions taken: the observation treatment now quotes the extended-observation recommendation directly, dropping its INDIRECT grade; a Cough phenotype was added and wired off the epithelial injury node; the lung mechanics readout is ALTERED rather than DECREASED because resistance rises while compliance falls; the ventilation treatment moved from NCIT:C15900 Lifestyle Therapy to NCIT:C15843 Preventive Intervention; and PMID:32119426 is tagged StatPearls. Every explanation drawing on PMID:31060842 or PMID:38665593 states that those exposures were an explosive detonation and boiler cleaning rather than a silo, with the same agent. Re-validated: 77 snippets, 85 titles, 0 issues; term validation passed; all 7 phenotypes causally connected.

  summary: 'Create: HIV Infectious Disease (MONDO:0005109)'
  details: |
    New entry curated so that kb/modules/viral_integrase_inhibition.yaml has a conformer, which it could not have had from any existing entry because integration is a step unique to the retroviruses and no retroviral infection was curated. Eight pathophysiology nodes conform at seven anchors across two modules: reverse transcription, integrase strand transfer, establishment of the integrated provirus and integrase inhibitor resistance against viral_integrase_inhibition, and the latent reservoir in resting memory CD4-positive T cells, suppression without reservoir eradication, and rebound on treatment interruption against viral_latency_reservoir_persistence, which previously rested on a single herpesvirus conformer at one node. Integration and latency were split into separate nodes after the pre-edit hook rejected a multivalued conforms_to; the schema takes one anchor per node, and the split is better modelling anyway. Also curated: the taxon-bound agent, three transmission routes, two prevalence records with the absolute counts in evidence because a whole-population rate averages away a geographically concentrated epidemic, dolutegravir-based therapy with an INHIBITS link to the strand-transfer node and the note that it cannot touch an already-integrated provirus, two progression phases, and a KNOWLEDGE_GAP discussion on reservoir eradication. Scope is recorded in notes: acute infection, chronic infection and AIDS are phases rather than entries under the granularity ladder, the opportunistic infections cross-link rather than being absorbed, HIV-2 is excluded with the reason, and the mucosal, immune-activation and tuberculosis dimensions are named as absent rather than extrapolated. check-granularity reports zero findings in every class. check-conformance-content initially reported one divergent link, which was a real omission in my node rather than a benign substitution, so the reservoir node now binds establishment of viral latency alongside viral latency and all seven links agree. Every PMID was found by PubMed search in this session and every snippet copied from the cached abstract. Validation: just validate-disorders passed with 30/30 snippets verified and terms clean. stubs/HIV_Infectious_Disease.yaml is deleted by the same change.

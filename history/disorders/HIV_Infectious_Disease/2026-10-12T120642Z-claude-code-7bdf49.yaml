  details: |
    Addresses round 2 of the automated review of PR 13924, item 3. Item 2, how this entry and Acquired_Immunodeficiency_Syndrome divide the scope under design decisions 3e, is a lump/split question for a maintainer and nothing here anticipates its answer; these are defects that need repairing whichever way it goes.

    Evidence. The Progressive CD4-Positive T Cell Depletion node and the Immunodeficiency phenotype both cited only the sentence recommending antiretroviral therapy at diagnosis regardless of CD4 count, which is a treatment policy and describes neither depletion nor immunodeficiency. None of the six references this entry already cited contains a sentence stating progressive CD4 loss, so PMID:27188527, the Nature Reviews Disease Primers primer on HIV infection, is added. Both records now quote its statement that untreated HIV replication causes progressive CD4 loss and a wide range of immunological abnormalities leading to increased risk of infectious and oncological complications, plus its statement that viral suppression nearly eliminates the risk of developing AIDS. The treat-at-diagnosis sentence is kept on the depletion node with its explanation narrowed to the last clause of the node description, which is the only thing it supports.

    The strand-transfer node quoted the review's own aim sentence, which is neither the paper's finding nor somebody else's fact and so carries no information. It is replaced with the sentence naming the reaction the inhibitor class blocks, which is what makes that node the therapeutic vulnerability rather than the 3 prime processing step before it.

    Ontology binding. GO:0009410 response to xenobiotic stimulus is dropped from Integrase Inhibitor Resistance. That term is defined as a change in the state or activity of a cell or organism as a result of a xenobiotic stimulus, an induced response; integrase inhibitor resistance is a selected change in the viral target protein that reduces inhibitor binding and is present before the drug acts. The searches run are recorded in the node notes, including that the nearest GO hits regulate a drug response rather than describe a resistant target. The notes also record that the module node this conforms to still carries the same binding: that module is unchanged on main and fixing it is a separate change rather than something to fold into this PR silently.

    Grading. Nineteen review quotes move off evidence_source OTHER, graded from the quoted sentence rather than the citing review's genre: statements about human infection, reservoir persistence, rebound and therapy become HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, and the viral replication-cycle and inhibitor-mechanism statements become IN_VITRO. Two stay OTHER on purpose: a sentence recording that three named second-generation drugs were developed, which reports no study type at all, and a knowledge-gap sentence about what future eradication strategies will require.

    Not done. This entry still has no diagnosis section. The review named only the other two entries for that, and adding one here would mean sourcing new references into an entry whose scope is undecided.

    Validation. just validate-disorders over all three changed entries: 109 of 109 snippets verified, 0 issues, plus the full offline gate set.

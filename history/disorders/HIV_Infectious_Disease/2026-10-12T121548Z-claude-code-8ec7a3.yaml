  summary: 'Review round 2b: reverse-transcription snippet, the false notes claim
    and the AIDS phase'
  details: |
    Two findings from the full round-1 verdict that were not in the short review summary the previous round was worked from.

    Reverse transcription. The node quoted the generic sentence that HIV replication is composed of many steps from viral entry to the release of new particles, which places the node in the cycle but says nothing about reverse transcription. It now quotes the sentence naming the reverse transcription step as the first to occur and as the conversion of viral RNA into linear viral DNA, which is the claim the node makes and what its trigger role records. A second item is added from the reservoir review, naming reverse transcription and integration within hours of entry, which also supports the downstream edge.

    The notes claim and the progression section. The entry's scope note asserted that acute infection, chronic infection and AIDS are recorded in progression. They were not: that section held only the untreated and virologically suppressed phases, which is a treatment-status axis rather than the clinical triad. Prose describing repository state is content and it rots, so this was a false statement about the file's own contents.

    An Acquired immune deficiency syndrome phase is added, sourced from the Nature Reviews Disease Primers primer for both the progression from untreated replication to infectious and oncological complications and for suppression nearly removing the risk of reaching it. Acute or primary infection is still not recorded, and the note now says so and why: no reference cited by this entry describes that phase in a quotable sentence, which is the same reason the scope note already gives for excluding the response to acute infection. The infectious-disease ladder's requirement that phases be listed in progression is met for the phases that have sources, and the gap is stated rather than implied.

    Cross-reference. The entry's notes now open by naming Acquired_Immunodeficiency_Syndrome, which is bound to MONDO:0012268 and models ten nodes covering persistent HIV replication, progressive CD4 depletion, the cellular reservoir and opportunistic infection susceptibility, against this entry's MONDO:0005109 replication-and-reservoir chain. The note states the overlap and that the boundary is unsettled, and resolves nothing: under the infectious-disease ladder AIDS is a phase rather than a separate disease, which argues for one entry, while the two files were curated independently and neither is a subtype of the other as curated. Which way that goes is a maintainer's lump/split decision. The note exists so a reader of either file knows the other is there, which was the reviewable half of the finding; the decision itself is not taken here.

    Validation. just validate on the entry: 36 of 36 snippets verified, 0 issues. Entity-refs, causal-targets, duplicate-keys, enum-values, block-scalar-comments, snippet-grading, snippet-length, title-snippets and folded-hyphens all pass.

  summary: Evidence-claim mismatch review (#14983)
  details: |
    Reviewed the 11 active whole-claim MISMATCH findings in the Jev evaluation queue for this entry (the evaluated file hash matches the current file). Corrections: CGL2 subtype now cites the PMID:11479539 sentence reporting BSCL2 (Gng3lg homologue) mutations in all 11q13-linked families instead of the null-allele sentence; the BSCL2 genetic record gains the same sentence and keeps the null-allele one for allele class; the Severe insulin resistance -> Acanthosis nigricans edge now cites the PMID:26239609 sentence listing acanthosis nigricans among insulin-resistance complications and the PMID:27710244 statement that acanthosis improves with treatment of insulin resistance (INDIRECT), replacing a snippet that only described where acanthosis occurs; the PCYT1A differential gains the PMID:24889630 abstract sentences on biallelic PCYT1A loss of function and on fatty liver with lipodystrophy; the FPLD differential description was rewritten to state the defining features and to say that biallelic PPARG cases are the CGL-PPARG subtype of this entry, with the guideline's FPLD definition added as evidence. Explanations clarified for the metreleptin lymphoma and statin myopathy items, which support safety caveats. Retained: the REFUTE item on CGL-PPARG (deliberate, documented in review_notes), the CAVIN1 fibroblast model evidence (snippets match the description), the CAV1 frameshift variant (carries its own evidence), and the clinical-trial status/phase flags (registry fields, not snippet claims). Validated with just validate, validate-terms and count-verified-snippets.

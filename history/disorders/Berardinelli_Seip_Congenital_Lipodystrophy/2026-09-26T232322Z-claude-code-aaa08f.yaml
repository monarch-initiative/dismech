  summary: Curate biallelic PPARG as a CGL subtype and bind the subtype rows
  details: |
    Residual genetics work recovered after PR #12906 deferred it (issue #12259, closed). Measured first: subtype FK coverage was already 4/4 and all four numbered genes reached their own pathophysiology node, but no has_subtypes row carried a genes list or a subtype_term, and the one MONDO descendant of the bound class with a causal gene that the entry did not cover was PPARG. Verified the PPARG claim rather than inheriting the earlier note that the MONDO term looked questionable: MONDO:0979300 has an empty description and no synonyms but its OWL axioms record RO:0004003 hgnc:9236, and it is imported from Orphanet:696242 with a subClassOf MONDO:0018883 sourced to the same Orphanet record. The primary literature supports it. Dyment et al. (PMID:24980513) report a compound heterozygous PPARG proband with generalized infantile-onset lipodystrophy showing the hallmark features of CGL; Gosseaume et al. (PMID:36806620) report one homozygous patient with congenital generalized lipodystrophy among 26; and ClinGen's Monogenic Diabetes expert panel (CGGV:assertion_b4c76c1c-7e8a-418f-ba62-b7eeb3c3d472-2024-08-14T160000.000Z, Definitive, semidominant) states that the occasional recessive cases feature early-onset congenital generalized lipodystrophy. So the term is correct and PPARG is now curated here: a CGL-PPARG has_subtypes row bound to MONDO:0979300, a CAUSATIVE genetic record, and a PPARG adipogenic nuclear receptor deficiency pathophysiology node bound to fat cell differentiation (GO:0045444, DECREASED) and adipocyte (CL:0000136), with an INDIRECT_KNOWN_INTERMEDIATES edge to generalized adipose tissue loss. The subtype row's review_notes record that the sources disagree on how generalized the phenotype is, because Patni and Garg (PMID:26239609) note the index patient retained some facial adipose tissue. The dominant partial form of PPARG disease stays on the Familial Partial Lipodystrophy entry, which is a deliberate split from ClinGen's single lumped lipodystrophy curation, recorded in the genetic record's notes. Also bound subtype_term and genes on CGL1 to CGL4 (MONDO:0012071, MONDO:0010020, MONDO:0012923, MONDO:0013225) and updated the entry description, which the PPARG addition would otherwise have made false. CAVIN1 confirmed as the approved symbol for the gene previously called PTRF, read live from HGNC. After: 5 gene-specific subtype rows, all 5 WIRED_DIRECT, FK coverage 5 of 5, causal genes wired to a mechanism 4 of 4 to 5 of 5. Phenotype causal inlink coverage was already 17 of 18 and is unchanged; no phenotype was added or rewired. Validation under linkml-reference-validator 0.3.0rc3: validate and validate-terms pass; 125 of 125 snippets verified; entity refs, causal targets, duplicate keys, enum values, qualifier terms all clean; 37 of 37 gene bindings across both entries resolved against HGNC with no mismatch.

  details: |
    Addressed independent review on PR13252: added seven phenotype records for acromegaloid components, accelerated growth, advanced bone age and splenomegaly, with one source-supported appetite-to-growth edge. Clarified PPARG gene-function BACKGROUND/OTHER evidence versus HUMAN_CLINICAL patient synthesis, removed duplicate ectopic-lipid evidence, replaced myopathy and CAVIN1-to-fat-loss snippets with primary patient observations, separated the CAV1 adipocyte binding from measured fibroblast assays, added the pancreatic compensation intermediate, normalized the JCI bibliography entry to PMID29723161 while retaining its generated full-text URL cache, and bound insulin, omega-3 fatty acids and the statin class. Added both the retired GeneReviews universal-steatosis statement and the primary CGL4 two-of-five observation; a universal all-subtype frequency would contradict the latter, so none is asserted. Causal connections for new skeletal/acromegaloid/splenic findings are not invented where the sources provide association only. Registry and reference provenance from the original REVIEW remains unchanged.

  summary: Review BSCL subtype mechanisms, primary evidence, care and trials
  details: |
    Substantive review of the pre-existing Berardinelli-Seip congenital lipodystrophy entry. The three prior histories were EDIT events, and the fresh open-PR census found no overlapping curation. Preserved the four numbered subtypes and the recently added rare PPARG subtype, including the explicit conflict over its generalized phenotype. Scope follows docs/explanation/design-decisions.md section 3: subtype distinctions remain in the parent entry, and the broader PCYT1A phosphatidylcholine disorder is discussed as a related differential rather than automatically becoming a numbered classical CGL subtype.

    Completeness assessment:
    1. Phenotypes: expanded from 20 to 39, including appetite, pancreatitis, xanthomas, low HDL, female reproductive manifestations, renal lesions, CGL1 bone lesions, and CGL3/CGL4 gastrointestinal, muscle and rhythm findings. Removed unsupported aggregate frequencies for insulin excess, liver fat and intellectual impairment; retained source-specific estimates and denominators. CGL4 fat loss can progress after birth. Normal resting ECG or absent QT prolongation does not exclude exercise-related arrhythmia.
    2. Subtypes: retained all five ontology-bound concepts, distinguishing metabolic/mechanical fat distribution and rare PPARG CGL-like disease from dominant partial lipodystrophy. The 2002 cohort did not establish a cardiomyopathy prevalence difference between genotypes. PCYT1A includes childhood-onset limb fat loss and intrinsic hepatic phosphatidylcholine defects; it is a bounded diagnostic comparison, not an asserted equivalence to skeletal-retinal PCYT1A disease. The doubtful FOS promoter report is not promoted to an established causal gene.
    3. Mechanisms and tissue: 13 atomic nodes separate caveola loss, seipin-associated lipolysis, terminal differentiation, adipose loss, leptin deficiency, appetite, ectopic lipid and systemic triglyceride excess. Replaced incomplete citation fragments and misplaced lipid-droplet location. Human CGL4 muscle and intestinal histology and patient fibroblast rescue are modeled. Caveolin mislocalization is distinguished from study-dependent protein depletion; fibroblast rescue is not clinical gene therapy. Biochemical readouts follow their actual compartments.
    4. Care and trials: 15 care records include diet/growth balance, exercise precautions, metreleptin, metformin, insulin, triglyceride and cholesterol management, specialist arrhythmia care, surveillance, reproductive precautions, psychosocial support and counseling. Metreleptin's congenital subgroup is separated from pooled acquired/generalized results and overlapping NIH cohorts; hypoglycemia and withdrawal pancreatitis are represented. Six live registry records distinguish completed trials, the recruiting LAGO trial, an observational registry and a terminated pediatric trial whose closure was administrative. Mibavademab remains investigational; posted phase II results are acknowledged without claiming a CGL-specific efficacy estimate. GLP1/SGLT2 options remain mixed-population guideline suggestions.
    5. Genetics: strengthened AGPAT2/BSCL2 discovery evidence, added primary CAV1 and CAVIN1 alleles, preserved ClinGen PPARG semidominant scope, and limited asymptomatic-carrier wording to its gene/family context. CAVIN1 splice consequences described as predicted are not treated as measured patient RNA. Seipin gain-of-function neuropathy is distinguished from recessive lipodystrophy.
    6. Diagnosis and biomarkers: phenotype/depot distribution, broader genetic testing, negative-test limitations, metabolic evaluation, and the lack of a diagnostic leptin cutoff are explicit. Related acquired, partial and PCYT1A disorders are distinguished.
    7. References: read complete scientific text for PMID26239609, 27710244, 19726876, 20300641, 20684003, 24889630 and 29644599, including extracted tables. Read the full scientific body of PMID29723161 through its generated JCI URL cache after PMID/DOI retrieval yielded only abstract/unavailable content; tables represented as images were not separately digitized. Read primary discovery, CAV1, PPARG and seipin abstracts; read targeted gene-function/CGL passages and relevant tables of the partial-lipodystrophy review PMID39398333, without claiming whole-report consumption. Primary human, cultured-cell and animal findings are distinguished from background and review synthesis; new evidence is titled. GeneReviews PMID20301391 is retired: all four abstract domains are mined with historical qualifications and independent guideline corroboration, rather than treating its two-gene panel or old surveillance schedule as current complete guidance. Bookshelf full text was inaccessible (CAPTCHA). PMID12362029 cache's apparent full-text HTML is a duplicated abstract/PDF notice, not a consumed full article. Seipin PMID22269949 and metreleptin PMID25734254 remained abstract-only after alternate retrieval attempts. Unusable generated caches are excluded.
    8. Overall: read the existing research artifact in full; it honestly records two timed-out providers and a fallback source inventory, not an independent completed provider narrative. Central source-backed omissions are now modeled. Unproved cardiac ion-channel pathways, universal human phosphatidic-acid depletion, animal-to-human effect transfer and CGL-specific efficacy inferred from partial/acquired lipodystrophy are not asserted.

    Local source ledger and live registry observations were collected on 2026-10-01. Reference caches were generated only through just fetch-reference; no cache prose was hand-authored.

  summary: 'Create: Kagami-Ogata Syndrome'
  details: |
    New entry for Kagami-Ogata syndrome (MONDO:0016779), curated together with Temple_Syndrome as the reciprocal 14q32.2 DLK1-DIO3 imprinting disorders, with RTL1 (PEG11/SIRH2) dosage excess as the central mechanism.

    Sources: GeneReviews chapter (PMID:39446997, tagged), Ogata and Kagami 2016 review (PMID:26377239, full text) and the 34-patient Kagami 2015 cohort (PMID:25689926, full text; phenotype frequencies quoted from its table rows), Kagami 2008 Nat Genet (PMID:18176563), Orphanet ORPHA:254519 (definition, exact MONDO mapping, prevalence class). Mouse evidence (PMID:32878913 muscle, PMID:18176565 placental capillaries, PMID:26138477 miR-127/Rtl1) and the callipyge sheep (PMID:20072617) are graded MODEL_ORGANISM.

    MONDO: MONDO:0016779 is primary. MONDO:0011975 (paternal UPD14, OMIM:608149) is an is_a child in MONDO, so it is recorded as skos:narrowMatch and also bound as the UPD(14)pat subtype; MONDO:0016783 and MONDO:0016781 bind the epimutation and microdeletion subtypes. All MONDO, HP, GO, CL and HGNC CURIEs were looked up via OLS or the HGNC REST API when written; NCIT treatment terms were read from cache/ncit/terms.csv.

    Genes RTL1, DLK1 and MEG3 are recorded without relationship_type, because no enum value fits an imprinted dosage gene and CAUSATIVE would imply a Mendelian coding-variant relationship. RTL1as has no HGNC symbol; MIR127 represents its microRNAs.

    Deep research: just research-disorder openscientist Kagami-Ogata_Syndrome produced research/Kagami-Ogata_Syndrome-deep-research-openscientist.md (26/26 references resolved, no quote checks, term validation flagged 5 mislabelled terms in the report). Its content agreed with the curated sources and no claim was taken from it directly. preflight-dr could not run because the local MONDO build is absent; MONDO records no causal gene for this class, and the report names the 14q32.2 locus and MONDO:0016779, so identity was checked by hand.

    Validation: just validate, validate-terms, count-verified-snippets (64/64 for this file) and validate-disorders passed; whole-repo gates passed.

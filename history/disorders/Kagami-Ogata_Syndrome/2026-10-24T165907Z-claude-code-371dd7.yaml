  summary: 'Review round 1: rebind abdominal wall defect, split facial features, add
    table phenotypes'
  details: |
    Addressed review on PR 15498. The OBLIGATE 'Abdominal wall defects' phenotype was bound to HP:0001540 Diastasis recti; it is now bound to HP:0010866 Abdominal wall defect, and diastasis recti is its own FREQUENT phenotype (23/34, PMID:25689926 table), beside the existing omphalocele entry (11/34). The RTL1-excess muscle node's edge now targets Diastasis recti, which is what PMID:32878913 states the mechanism for. 'Full cheeks and protruding philtrum' was split into Full cheeks (27/29) and Protruding philtrum (33/34, bound to HP:0002002 Deep philtrum, whose synonyms include Prominent philtrum; GeneReviews PMID:39446997 calls it prominent and deep). Added Short webbed neck (33/33, HP:0000465 Webbed neck), Coxa valga (11/32, HP:0002673) and Cardiac disease (8/33, HP:0001626 with coarse_binding_basis SOURCE_UNSPECIFIED because neither source specifies the lesions). New phenotypes other than diastasis recti are left unconnected to the pathograph because no cached source states their mechanism. HP CURIEs and labels were looked up in OLS. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders. Also grandfathered DLK1, MEG3 and RTL1 in tests/gene_activity_grounding_baseline.txt: no cached source supports a molecular function on the nodes they reach (MEG3 is a lncRNA, RTL1 has no established activity, and the only cached DLK1 statement calls it a Notch-like ligand, which does not support GO:0005112 Notch binding).

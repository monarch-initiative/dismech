  summary: Add gene therapy treatments with review feedback corrections
  details: |
    Added three gene-based therapeutic modalities to address review feedback:

    1. AAV Gene Replacement Therapy - adeno-associated virus-mediated gene replacement to restore normal sarcomeric protein expression
    2. Allele-Specific Silencing - corrected from ANTISENSE_OLIGONUCLEOTIDE to GENE_THERAPY modality per reviewer feedback that the abstract does not specify ASO platform; HCM implementations predominantly use AAV-delivered RNAi/shRNA
    3. Gene Editing - base editing and CRISPR-Cas9 approaches for precise genomic correction

    All evidence sourced from PMID:42526431 (Keen et al., Med 2026): "Rewriting the sarcomere: Gene therapy approaches for hypertrophic cardiomyopathy from bench to bedside"

    Committed previously missing references_cache/PMID_42526431.md file for deterministic validation CI compliance. Addressed all four blocker items from ai4c-reviewer's CHANGES_REQUESTED review: (1) added cache file, (2) corrected therapeutic_modality over-specification, (3) avoided aso_details requirement by using GENE_THERAPY instead of ASO, (4) created this history record.

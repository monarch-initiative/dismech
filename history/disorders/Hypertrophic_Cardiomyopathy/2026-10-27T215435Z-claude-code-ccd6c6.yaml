  summary: Correct beta-blocker therapeutic_agent from agonist to antagonist
  details: |
    The beta-blocker treatment bound NCIT:C48149 Beta-Adrenergic Agonist as its therapeutic_agent, naming the opposite pharmacological class from the treatment itself. Rebound to NCIT:C29576 Beta-Adrenergic Antagonist, with preferred_term changed to match.

    The error was invisible to every existing gate. NCIT:C48149 is a real CURIE, Beta-Adrenergic Agonist is its correct canonical label, and it is a member of the ChemicalEntityTerm dynamic enum (reachable from NCIT:C1909 Pharmacologic Substance), so linkml-term-validator had nothing to report. Only the surrounding treatment name, description and evidence identify it as wrong. This is the failure shape CLAUDE.md records under 'A Gene Binding Only Has To Be Self-Consistent', landing on a drug class rather than a gene.

    The treatment's own evidence establishes the direction: every cited snippet describes beta-blockade. NCIT:C29576 was confirmed admissible in the same enum before binding, and just validate-terms passes on the changed file.

    Found while scanning the corpus for beta2-adrenergic agonist usage during GPCR drug-mechanism module curation; the scan separated therapeutic uses of a beta2 agonist from entries that merely mention one, and these four surfaced as treatments whose bound agent contradicted their own text. therapeutic_modality is left unset rather than backfilled, to keep this change to the defect.

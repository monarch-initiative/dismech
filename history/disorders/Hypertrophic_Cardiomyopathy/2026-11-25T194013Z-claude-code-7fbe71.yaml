  summary: 'Gene-family review: MT-TI'
  details: |
    The MT-TI record was untyped and sat on the generic sarcomere-energetics node 'Mitochondrial Dysfunction'. It now has its own node for the homoplasmic m.4300A>G lesion, with very low mature tRNA-Ile in patient heart tissue and a heart-restricted respiratory chain defect (PMID:12767666), binding triplet codon-amino acid adaptor activity (GO:0030533) and mitochondrial translation, both DECREASED, with edges to 'Mitochondrial Dysfunction' and to left ventricular hypertrophy (PMID:39639347). The record is typed UNKNOWN rather than CAUSATIVE because ClinGen rates MT-TI for hypertrophic cardiomyopathy Moderate; that tier is now recorded in gene_disease_validity from the cited CGGV assertion. It also gains variant_origin GERMLINE, a Mitochondrial inheritance block, and the 100,000 Genomes estimate that m.4300A>G explains 0.6% of genetically undiagnosed HCM. Other HCM genes listed as ClinGen backfill candidates were not part of this review.

  summary: Augment HCM genetic section with variant-reclassification and allelic-mechanism
    evidence
  details: |
    Augmented kb/disorders/Hypertrophic_Cardiomyopathy.yaml from the SHaRe registry variant-reclassification preprint PPR:PPR1295400, a medRxiv preprint that has not been peer reviewed, raised in issue 8481.

    genetic#MYH7 gained notes plus four evidence items: pathogenic MYH7 alleles are predominantly missense and cluster in the myosin motor/head domain, which the ClinGen Cardiomyopathy Expert Panel encodes as the PM1 critical-domain rule; 23 of 29 upgraded MYH7 variants in the registry fell inside that hot spot; and, as a PARTIAL item, 55 MYH7 variants were downgraded because hot-spot rarity alone did not reach P/LP.

    genetic#MYBPC3 gained notes plus four evidence items: MYBPC3 is the only HCM gene in which loss of function is an established disease mechanism, so PVS1 applies only there; the truncating/haploinsufficiency allelic mechanism; and the resulting classification stability, 11.1 percent reclassification, the lowest of the sarcomere genes.

    A discussions entry was added, kind INTERPRETATION, status OPEN, id q_hcm_variant_reclassification_burden, attaching to genetic#MYH7 and genetic#MYBPC3, recording that 10 percent of registry variants were reclassified in a clinically meaningful way and that most variants of uncertain significance are unlikely to be causal.

    Per the preprint-scan guardrail the preprint is never sole support. Peer-reviewed co-support was fetched for both mechanistic claims: PMID:29300372, the ClinGen Inherited Cardiomyopathy Expert Panel MYH7 ACMG/AMP adaptation, and PMID:30674652, Toepfer et al. on MYBPC3 haploinsufficiency. The latter is split into an OTHER item and a MODEL_ORGANISM item so each carries a single evidence_source.

    Validated: just validate passed; just count-verified-snippets reported 124/124 verified; just validate-terms passed; just check-duplicate-keys passed; check-snippet-length, check-title-snippets and check-folded-hyphens reported no new defects.

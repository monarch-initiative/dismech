  summary: 'Genetics pass (series-045): Hypertrophic_Cardiomyopathy'
  details: |
    Genetics pass for the series-045 gap list (issue #12252). Four of the six checklist genes (ALPK3, FHOD3, TRIM63, CSRP3) were already curated and wired, confirming that the CSRP3 decline from PR #12727 landed. Added the two missing ones with their real evidence weight rather than as flat CAUSATIVE rows: MYOZ2 (hgnc:1330) typed DISPUTED, citing the 2007 linkage report and the 438-patient European replication cohort that found no disease-causing variant, and deliberately not bound to a pathophysiology node; PLN (hgnc:9080) typed CAUSATIVE on the 1,064-proband cohort with a cosegregating L39X variant, and bound to the Altered Calcium Handling node. That node previously carried three gene bindings and no evidence at all; added two evidence items from a calcium-handling-gene review that source TNNC1, PLN and JPH2 together. Recorded relationship_type and variant_origin on ALPK3, FHOD3 and CSRP3, and recorded in TRIM63's notes the second ClinGen curation the entry had not mentioned (autosomal dominant Disputed alongside the autosomal recessive Moderate it already cited), leaving that record untyped because Moderate maps to no enum value. Added the Nonsyndromic Hypertrophic Cardiomyopathy Overview GeneReviews chapter to the reference list, tagged, with no findings: its cached content holds only the chapter's purpose statement, which is not a quotable finding.

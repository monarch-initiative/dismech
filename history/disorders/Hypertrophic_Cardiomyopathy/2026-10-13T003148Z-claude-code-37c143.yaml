  details: |
    Added diagnosis.measurements (LOINC:99528-2, interventricular septum thickness) to the existing Echocardiogram diagnosis row, with a reference_ranges band for the general (>=15 mm, PMID:41077648) HCM wall-thickness diagnostic threshold. Review round: a second band for the family-history threshold (>=13 mm), originally cited to a CADTH reimbursement summary (PMID:37643270), was dropped -- that cache file has no PubMed title, which fails dismech.reference_cache_frontmatter in CI. Searched for a guideline-sourced replacement (ESC 2023, AHA/ACC 2020, and PubMed abstract searches combining "13 mm" with "family history"/guideline terms) and found none with a citable title and abstract stating the paired 15/13 mm criterion; the 13 mm threshold is recorded in this row's notes as a real but currently uncited criterion, and PMID_37643270.md was removed from references_cache/. Part of LOINC_DIAGNOSTICS.md tranche G.

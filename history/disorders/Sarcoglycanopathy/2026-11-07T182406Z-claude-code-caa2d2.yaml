  summary: Map subtypes to MONDO sarcoglycan-defect classes
  details: |
    Settled the open scope question from issue 12931 on where MONDO:0016141-0016144 (Orphanet-derived qualitative or quantitative defects of alpha/beta/gamma/delta-sarcoglycan) belong. OLS shows each class is a direct child of MONDO:0016140 and the parent of the LGMD term already bound as the matching subtype_term; the delta class also holds MONDO:0011702 dilated cardiomyopathy 1L, which has its own entry. Each subtype row now records its class under mappings.mondo_mappings as skos:broadMatch, keeping the LGMD terms as subtype_term. Also renamed the SGCG-stratified respiratory-insufficiency phenotype to 'Respiratory insufficiency in gamma-sarcoglycanopathy' so it no longer collides with the cross-subtype row of the same name, and removed that row from tests/name_collision_baseline.txt. No bare targets referenced either name. Validated with just validate, validate-terms, count-verified-snippets (85/85), check-name-collisions, check-entity-refs, check-causal-targets and validate-disorders.

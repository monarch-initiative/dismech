  summary: 'Address PR #9558 review feedback: GeneReviews mining, evidence_source
    fixes, animal models, treatment mechanism links'
  details: |
    Addressed the 11 IMPORTANT items from the CHANGES_REQUESTED review on PR #9558
    (issue #9547, Sarcoglycanopathy MONDO:0016140):
    (1) mined the previously-tagged-but-uncited GeneReviews chapter PMID:20301582
    for diagnosis/management/genetic-counseling evidence;
    (2) fixed three evidence_source misclassifications (PMID:39663450 mouse
    cryo-EM -> IN_VITRO, PMID:37628888 zebrafish background statements -> OTHER,
    PMID:26709803 review -> OTHER, applied consistently across all occurrences);
    (3) replaced the mismatched genetic-counseling snippet with a GeneReviews
    prenatal-testing quote;
    (4) debundled the "Progressive Myofiber Degeneration and Fibrofatty
    Replacement" node into two atomic nodes (CELLULAR degeneration -> TISSUE
    fibrofatty replacement) and dropped the inaccurate fibrotic_response
    conforms_to (no myofibroblast/TGF-beta evidence available to support it);
    (5) dropped the unsupported GO:0001778 (plasma membrane repair) descriptor
    and added evidence for GO:0006816 (calcium ion transport) from the zebrafish
    paper;
    (6) added a direct 67%-missense-variant citation supporting the quantitative
    lesion-class claim;
    (7) added five animal_models entries (Sgcb/Sgcg/Sgcd-null mouse, Sgca-null
    mouse with a FAILS_TO_RECAPITULATE cardiomyopathy link, missense knock-in
    mice with a FAILS_TO_RECAPITULATE link, delta-SG-deficient Syrian hamster,
    and sgcb/sgcd-null zebrafish), all with modeled_mechanisms wiring to
    pathophysiology/phenotype nodes;
    (8) added target_mechanisms to the two AAV gene-replacement treatments and
    the ERAD-inhibitor treatment, linking them to "Sarcoglycan Complex Loss and
    DGC Destabilization";
    (9) added three new phenotypes (Distal muscle weakness and Cardiac
    arrhythmia scoped to SGCD, and a disease-level Respiratory insufficiency
    phenotype);
    (10) corrected HP:0001638 (Cardiomyopathy) to HP:0001644 (Dilated
    cardiomyopathy) on both cardiomyopathy phenotype entries;
    (11) fetched and added four clinical trials (NCT03652259, NCT05876780,
    NCT05973630, NCT04475926) plus wired NCT05973630 into the AAV-SGCG
    treatment.

    Also addressed all four non-blocking suggestions: moved the prevalence
    population parenthetical to notes, added Genetic.case_fractions for
    SGCA/SGCB/SGCG from the verified 100-patient French cohort breakdown, added
    a histopathology section (dystrophic necrosis/regeneration plus SGCD
    fibrosis/inflammatory-infiltrate finding), and left the disease-level vs
    SGCG-specific cardiomyopathy duplication as-is per the reviewer's own
    "defensible" framing.

    One reviewer-suggested figure (28% LGMDR4 arrhythmia) could not be verified
    against the abstract-only PMID:25862795 cache, so a verified SGCD-cohort
    arrhythmia quote was substituted instead rather than fabricating the
    unverifiable figure.

    Validation run and observed: just validate (schema/terms/references all
    pass, 85/85 snippets verified), just count-verified-snippets (85/85), just
    validate-terms (pass), just check-duplicate-keys (pass),
    scripts/check_snippet_length.py --against-ref origin/main (no new short
    snippets), scripts/check_folded_hyphens.py (no new hyphen splits after
    fixing one introduced during editing), just validate-disorders (full
    batched pass), and the 18 Sarcoglycanopathy-parametrized pytest cases in
    tests/test_data.py including test_animal_model_mechanism_targets,
    test_failure_to_recapitulate_links_are_substantiated, and
    test_model_readout_targets_match_link.

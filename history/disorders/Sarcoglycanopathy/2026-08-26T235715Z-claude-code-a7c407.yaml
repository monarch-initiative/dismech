  summary: 'Create: Sarcoglycanopathy (MONDO:0016140)'
  details: |
    Created a new Disease entry for sarcoglycanopathy (MONDO:0016140), the sarcoglycan-complex/DGC-destabilization subgroup of autosomal recessive limb-girdle muscular dystrophy, per issue #9547 (CURATE_ROOT_WITH_SUBTYPES). Modeled as a Disease with has_subtypes for the four gene-defined forms (SGCA/LGMDR3, SGCB/LGMDR4, SGCG/LGMDR5, SGCD/LGMDR6), each bound to its own MONDO subtype term (MONDO:0011968/0011423/0009677/0011028), matching MONDO's own class structure where MONDO:0016140 has four exact-child terms (MONDO:0016141-0016144) and each clinical LGMD subtype term is multiply classified under both this term and the broader AR-LGMD root (MONDO:0015152, kb/disorders/Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy.yaml). Cross-referenced rather than duplicated that existing entry; this entry focuses specifically on the shared sarcoglycan-sarcospan subcomplex assembly / DGC destabilization / contraction-induced sarcolemmal damage mechanism (four-node pathophysiology chain, with a fibrotic_response#Mesenchymal Cell Activation conforms_to link), plus subtype-specific genetics, epidemiology, and treatments. Deep research: falcon (Edison Scientific), research/Sarcoglycanopathy-deep-research-falcon.md; reference_validation in the report frontmatter showed 6/6 references verified, confabulation_rate 0.0, 5/6 on topic. just preflight-dr returned SKIP (MONDO:0016140 has no single RO:0004003 causal gene since it is a four-gene grouping term) with all four expected genes (SGCA/SGCB/SGCG/SGCD) represented among top gene mentions and no rival gene dominating -- no NEC signal. Independently verified all identifiers cited from the DR report before use, and caught two DR hallucinations that were NOT incorporated: an invented HGNC:6615 for SGCA (real SGCA is hgnc:10805, confirmed via HGNC REST API) and a wrong OMIM phenotype number for LGMDR3 (report cited OMIM:253600, which is actually LGMDR1/calpainopathy; correct LGMDR3 OMIM is 608099) -- OMIM identifiers were omitted from the entry entirely as a result. A third draft claim (a "0.86 per million" beta-sarcoglycanopathy prevalence figure attributed to PMID:25862795) could not be located anywhere in that paper's cached abstract, so it was likewise dropped; the prevalence: block instead records only the independently-quoted 10-25%-of-LGMD relative-frequency statement and notes that no verifiable general-population prevalence figure was found. All other new content (Mendell 2024 SGCB gene-therapy Phase 1/2 trial results, Guimaraes-Costa 2021 100-patient cohort, Semplicini 2015 LGMDR4 cohort, Alonso-Perez 2022 LGMDR6 cohort, Barba 2023 zebrafish ERAD mechanism) was independently found and fetched via PubMed/just fetch-reference, not taken on the DR report's citation alone. Added a resolved INTERPRETATION discussion distinguishing recessive SGCD loss-of-function (LGMDR6, this entry) from unrelated dominant-negative SGCD missense variants that cause isolated familial DCM (PMID:26968544), scoping that evidence out of the main pathophysiology chain. Validation: just validate (schema/terms/references all passed, 45/45 snippets verified against cached references), just count-verified-snippets (45/45), just validate-terms (passed), just check-duplicate-keys (no duplicates), just validate-disorders (batched pre-PR sweep -- same as CI -- passed cleanly), uv run pytest tests/test_data.py -q (9579 passed on a -k filtered run before enrichment; full-suite run before PR).

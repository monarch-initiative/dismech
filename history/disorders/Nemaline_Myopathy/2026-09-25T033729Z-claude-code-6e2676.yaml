  summary: 'Genetics pass: thirteen gene-defined NEM subtypes, MYPN genetics and node,
    KBTBD13/KLHL41 wiring, case fractions'
  details: |
    Genetics pass for the d2g series-036 gap list (issue #12243): enumerate the gene-defined numbered subtypes under the nemaline myopathy family root, add the one missing causal gene, and wire the unwired genes into the pathograph.

    Anchor check first. MONDO:0018958 nemaline myopathy resolves in OLS as the family root and is not obsolete; its direct children are the four ENMC clinical severity classes this entry already binds, plus the TNNT1 and MYPN concepts. The anchor is correct and no re-anchoring is needed.

    Thirteen gene-defined rows were added to has_subtypes as classification: genetic, covering all ten diseases on the gap list plus three unlisted siblings: NEM1 (TPM3, MONDO:0012239), NEM2 (NEB, MONDO:0009725), NEM3 (ACTA1, MONDO:0008070), NEM4 (TPM2, MONDO:0012240), NEM5 (TNNT1, MONDO:0011539), NEM5B (TNNT1, MONDO:0957281), NEM5C (TNNT1, MONDO:0957284), NEM6 (KBTBD13, MONDO:0012237), NEM7 (CFL2, MONDO:0012538), NEM8 (KLHL40, MONDO:0014138), NEM9 (KLHL41, MONDO:0014326), NEM10 (LMOD3, MONDO:0014513) and NEM11 (MYPN, MONDO:0015023).

    The three unlisted siblings are the commonest genotypes after NEB, and they are absent from the gap list because their genes were already curated in the genetic: section: MONDO:0008070 (ACTA1), MONDO:0012239 (TPM3) and MONDO:0012240 (TPM2). They sit under the clinical severity intermediates rather than directly under the family root, and MONDO's primary label for each is now a gene-scoped congenital myopathy concept with the NEM number as a synonym only. The rows bind those terms rather than leaving the three concepts unbound.

    Both subtype axes now coexist. children is deliberately not used to link them: NEB disease spans severe congenital, typical and childhood-onset presentations, and MONDO itself files nemaline myopathy 2 under all three severity terms, so the relation is many-to-many and a children list would flatten it.

    MYPN is the one gene the gap list named that the entry did not carry. A genetic: record was added (biallelic loss of function, ClinGen Definitive under autosomal recessive inheritance), together with a Z-Disc Scaffold Loss (MYPN) pathophysiology node feeding nemaline rod formation. The mechanism reading is the gene-identification paper's own: myopalladin sits at the Z-line in control muscle and is absent from affected muscle, and a nonsense knockin mouse shows Z-streaming with nemaline-like bodies against a disorganised Z-line — so the lesion is at the structure the rods derive from, not in the thin filament.

    Two genes that were listed but unwired now reach the pathograph. KBTBD13 was bound onto Thin Filament Dysfunction rather than onto a ubiquitin node: its BTB-Kelch architecture would group it with KLHL40 and KLHL41, but recombinant binding assays with knockout and knockin mice and a transgenic zebrafish show it binds actin directly, and the patient lesion measured by transcranial magnetic stimulation is a structural change in the thin filament. KLHL41 was given its own node rather than being folded into the existing KLHL40 node, because the KLHL40 node's evidence is specifically about CUL3-dependent SAR1A degradation and ER-to-Golgi trafficking, whereas the KLHL41 evidence is about BTB-Kelch maintenance of sarcomeric integrity; collapsing them would have made the KLHL40 node's citations appear to support a claim they do not make.

    case_fractions were added to five genetic: records from one cohort that reports per-gene shares with its denominator: NEB 73.9%, ACTA1 15.2%, TNNT1 6.5%, KBTBD13 2.2%, CFL2 2.2%, all of the 46 genetically solved patients in a 48-patient myopathologically confirmed Chinese cohort. cohort_size records 46 and the notes state that the percentages are of the solved subset rather than of the 48 enrolled, because the abstract gives both numbers and they are not interchangeable.

    Inheritance is bound per subtype where a source states it for that specific concept, and left absent where none does. NEM2, NEM9, NEM10 and NEM11 carry a cited recessive mode; NEM3, NEM5B and NEM5C carry the mode that is part of the bound MONDO term's own label, and each row's description says that is the basis. NEM1 and NEM4 carry none, with review_notes explaining why: MONDO labels NEM1's term autosomal recessive while ClinGen grades TPM3-related myopathy Definitive under both modes, and neither the label nor the definition of NEM4's term states a mode at all.

    Genes considered and not added. RYR3 is graded Disputed for congenital myopathy in the ClinGen Gene-Disease Validity download (file created 2026-09-25) and is not curated. MYO18B has no descendant of MONDO:0018958 to bind. TNNT3 is retained with its existing ClinGen Limited citation and deliberately given no subtype row, since the ClinGen assertion is against the family term rather than a TNNT3-specific concept.

    ClinGen was reachable, but not through the repository tooling. just clingen-refresh fails on the pinned checksum because upstream has republished since the 2026-08-13 snapshot (the known drift tracked in issue #10426), so the gene-validity CSV was read directly from ClinGen's public download instead. Only three CGGV records are cached in this repository, of which two are relevant, so the remaining gradings are recorded as review_notes and notes prose naming the download and its file-creation date rather than cited as evidence.

    No GeneReviews baseline exists for this entry: the nemaline myopathy chapter NBK1288 is retired and labelled FOR HISTORICAL REFERENCE ONLY, which is recorded in notes.

    All snippets are exact substrings of committed references_cache files and all were quoted from abstracts. Where an existing snippet was reused on a new row it was copied together with its existing evidence_source grading, so no sentence carries two gradings in the file. Validator runs during this pass rewrote 27 committed references_cache files as a side effect; all 27 were reverted with git checkout and every snippet in both entries touched by this pass was re-verified against the reverted tree afterwards. Only the newly fetched cache files are committed.


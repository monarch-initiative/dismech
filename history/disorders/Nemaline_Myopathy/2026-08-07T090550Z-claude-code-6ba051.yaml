  summary: 'Fix has_subtypes axis-mixing: drop redundant NEM-number genetic-locus
    subtypes'
  details: |
    Resolved issue #6970: has_subtypes mixed two orthogonal axes (clinical severity vs OMIM NEM genetic-locus numbering), so subtype foreign keys did not partition the disease and e.g. a NEM3/ACTA1 patient could also be Severe Congenital, Typical, or Adult-Onset. Applied Option 1 from the issue (matching the Central_Core_Myopathy.yaml precedent): removed the six genetic-locus stub has_subtypes entries (NEM1, NEM2, NEM3, NEM6, NEM10, Amish nemaline myopathy), which carried no description/evidence of their own and existed only as subtype FK targets. Removed the corresponding subtype: FK from the six genetic[] entries (NEB, ACTA1, KBTBD13, TPM3, TNNT1, LMOD3) that pointed at those stubs, bringing them in line with the other five genetic entries (KLHL40, TPM2, CFL2, KLHL41, TNNT3) which already carried no subtype FK. To avoid losing the NEM-number handles, added the parenthetical NEM designation into the affected genes' free-text notes where not already present (KBTBD13 already mentioned NEM6 in its notes); each addition is already supported by that gene's own cited evidence snippet in the same entry, so no new PMIDs were needed. has_subtypes now contains only the four clinical-severity/age-of-onset subtypes (Severe Congenital, Typical, Childhood-Onset, Adult-Onset), which partition cleanly and match how genetic identity is modeled elsewhere in the KB. Ran just validate (schema/term/reference validation; 118/118 snippets verified against cache) and the subtype-foreign-key slice of tests/test_data.py (3759 passed) against the changed file.

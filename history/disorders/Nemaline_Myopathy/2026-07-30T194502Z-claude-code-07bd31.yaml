  summary: Reconcile Amish nemaline myopathy onto NEM5 and populate the genetic-axis
    subtypes
  details: |
    Addresses the PR #7122 review. BLOCKER: issue #6970 required that 'Amish nemaline myopathy' be reconciled onto whichever axis TNNT1/NEM5 lands on; it was tagged classification: complementation_group while every other member of that axis was an OMIM NEM number. Renamed the entry to name: NEM5 with display_name: Amish nemaline myopathy (preserving the human-facing label, since renderers prefer display_name), bound subtype_term to MONDO:0011539 (nemaline myopathy 5), added the TNNT1 gene descriptor and a geography entry for the Old Order Amish founder population, and updated the single foreign key on the 'TNNT1 Mutations' genetic entry from 'Amish nemaline myopathy' to 'NEM5'. FOLLOW-UP (reviewer 🔵 #1): the six genetic-axis subtypes were name+classification stubs; added genes, description, and — where a verifiable MONDO term exists — subtype_term and ClinGen evidence for NEM2 (NEB, MONDO:0009725), NEM5 (TNNT1, MONDO:0011539), NEM6 (KBTBD13, MONDO:0012237), and NEM10 (LMOD3, MONDO:0014513). NEM1 (TPM3) and NEM3 (ACTA1) were deliberately left without subtype_term and carry review_notes explaining why: MONDO has reorganized both into the CMYO congenital-myopathy series and split them by inheritance mode (TPM3 -> MONDO:0800341 CMYO4A autosomal dominant / MONDO:0012239 CMYO4B autosomal recessive; ACTA1 -> MONDO:0008070 CMYO2A autosomal dominant), so no single MONDO term is equivalent to the NEM1 or NEM3 complementation group and binding one would silently narrow the subtype to a single inheritance mode. FOLLOW-UP (reviewer 🔵 #2): the TNNT1 genetic entry cited the ClinGen Limited/AD assertion against the MONDO:0018958 grouping term; replaced it with the Definitive/AR assertion against nemaline myopathy 5 (CGGV:assertion_8f993d88...), which matches the recessive founder biology in PMID:29931346, and noted the weaker Limited/AD assertion in the explanation. Four new ClinGen cache files were generated with 'just clingen-rebuild --id ...' (never hand-written). FOLLOW-UP (reviewer 🔵 minor): added PR #7122 to links.prs on the prior history record. Validated: just validate (schema + references, all pass), just validate-terms (pass), pytest tests/test_data.py -k subtype (3280 passed, 0 failed, no Nemaline warnings).

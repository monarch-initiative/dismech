  summary: 'Review round 2: split the bundled KLHL41 node; regrade eight animal-paper
    background quotes'
  details: |
    Review round 2 on PR #12748. One blocking finding and one suggestion, both on this entry.

    The blocking one was a bundled node. BTB-Kelch Ubiquitination Defect and Myofibrillar Disruption (KLHL41) joined two events with "and" in its own name, carried a molecular process (GO:0016567 protein ubiquitination, DYSREGULATED) beside a cellular one (GO:0030239 myofibril assembly, ABNORMAL), and was tagged biological_scale: MOLECULAR, which fits only the first. Needing two scales is the documented signal that a node carries two mechanistic claims.

    It is now two nodes. BTB-Kelch Sarcomere Maintenance Failure (KLHL41) is MOLECULAR and keeps the protein-ubiquitination binding, evidenced by the authors' own statement that BTB-Kelch family members have a critical role in maintenance of sarcomeric integrity. Its single downstream edge reaches Myofibrillar Disorganization (KLHL41), which is CELLULAR, keeps the myofibril-assembly binding, and carries the two edges that previously hung off the bundled node, to Nemaline Rod Formation and Reduced Sarcomeric Tension. The zebrafish loss-of-function snippet supports the cellular node and all three of its edges, since it names diminished motor function, myofibrillar disorganisation and nemaline body formation in one sentence.

    Because downstream targets are matched as bare names with no resolution step, a rename can dangle silently. The old node name was grepped out of kb/ and history/ before the rename and returns nothing, and just check-causal-targets was run afterwards. The notes: paragraph that named the old node is updated and now records why the split was needed.

    The reviewer's suggestion on evidence grading was taken in full. Three sentences copied out of animal papers' abstracts state human clinical facts - that recessive NEB variants cause about 50% of cases, that ACTA1 variants comprise 15-25%, and that KLHL40 mutations result in severe congenital nemaline myopathy - and all were graded MODEL_ORGANISM. Each was re-read in its cached abstract first: all three are opening framing sentences, ahead of the paper's own work, so HUMAN_CLINICAL with quote_role: BACKGROUND is the accurate pair and MODEL_ORGANISM asserted that an animal measured a human population figure.

    check-snippet-grading keys on the quote and decomposes a snippet into sentences, so every copy had to move together and the set is larger than a grep of the three sentences suggests. It is ten items, against the eight locations the review listed. Regrading the long ACTA1 quote, which is two sentences, pulled its second sentence - "Patients harboring variants in ACTA1 present with a heterogeneous disease course characterized by stable or progressive muscle weakness and, in severe cases, respiratory failure and death." - into the same equivalence class as the first. Two pre-existing Reduced Sarcomeric Tension edges quote that sentence on its own and were still MODEL_ORGANISM, so the first attempt failed check-snippet-grading with four new divergences. Those two describe human patients by the same reasoning as the other eight, so regrading them is the consistent reading rather than a way round the gate; the gate passes afterwards. Three of the ten items were added by this PR and seven were already on main. The 23 remaining MODEL_ORGANISM items in the entry are genuine animal results and were left alone.

    The general lesson is worth keeping: a multi-sentence snippet joins every sentence it contains to the same grading, so re-grading one drags the others with it, and the affected set cannot be enumerated by searching for the sentence you meant to change.

    Validator runs during this round rewrote 26 committed references_cache files again as a side effect; all were reverted and every snippet re-verified against the reverted tree. The branch was rebased onto origin/main (21 commits behind) before this round; the rebase was clean with no conflicts, including none in cache/.


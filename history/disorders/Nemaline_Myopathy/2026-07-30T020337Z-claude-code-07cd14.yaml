  details: |
    Issue #6970 flagged that has_subtypes mixes two orthogonal axes (clinical severity/age-of-onset vs OMIM NEM genetic-locus/complementation-group) with no marker distinguishing them, so subtype: foreign keys in histopathology (clinical axis) and genetic (NEM axis) resolve against non-partitioning sets. Rather than deleting the genetic axis (Option 1, as suggested by the automated triage comment), implemented Option 3 explicitly per existing repo precedent: Fanconi_Anemia.yaml already models two crossing Subtype axes (pathway_tier vs complementation_group) side by side using the schema's classification field, and Cystinosis/Fabry_Disease/Cystic_Fibrosis/PRPS1_Superactivity/Dentatorubral-Pallidoluysian_Atrophy/Delayed_Sleep_Phase_Syndrome/Folliculitis already tag classification: clinical_phenotype. Added classification: clinical_phenotype to the four clinical-severity has_subtypes entries (the six NEM-axis entries already carried classification: complementation_group), plus short comments marking each axis block. No entries deleted and no subtype: foreign keys changed, so no remapping/reconciliation of the six genetic entries (NEB/ACTA1/KBTBD13/TPM3/TNNT1/LMOD3) was needed or attempted. Validated with just validate and just validate-references (all pass, 0 errors).

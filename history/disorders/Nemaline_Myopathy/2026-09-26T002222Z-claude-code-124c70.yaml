  details: |
    Resolved the review of PR 7122. Reworded the NEM6 description from 'the only dominantly inherited complementation group in this list' to 'the only exclusively dominant complementation group in this list (NEB, TNNT1, and LMOD3 disease is recessive)', which removes the contradiction with NEM1 (TPM3 AD and AR) and NEM3 (ACTA1 often de novo AD) added in the same diff. Committed the four MONDO term-cache rows (MONDO:0009725, 0011539, 0012237, 0014513) that binding the NEM2/NEM5/NEM6/NEM10 subtype_terms generated, in both cache/mondo/terms.csv and the diseaseorsubtypeterm enum cache, via just validate-terms + normalize-cache. Also resolved a merge conflict with main in the has_subtypes complementation-group block and the TNNT1 subtype foreign key. CORRECTION: the resolution restores what PR #8114 (commit b26a3215c, merged 2026-08-08, closing #6970) had deliberately removed. #8114 applied Option 1 of #6970 — it deleted the six NEM complementation-group has_subtypes entries (NEM1/2/3/5/6/10) and their six genetic subtype foreign keys. This PR keeps and tags those entries instead, which is Option 3 (make both the clinical_phenotype and complementation_group axes explicit). So the merge reverses #8114, and this is a deliberate design choice pending maintainer sign-off, not a purely additive resolution. The earlier wording 'main never carried them' was wrong: main carried them until #8114 removed them on purpose.

  summary: 'Create: Thalidomide Embryopathy'
  details: |
    Created the thalidomide embryopathy entry (MONDO:0018034) to home the thalidomide arm of the ReproTracker NAM paper (PMID:38029956), per issue 16910. Mechanism chain curated: transplacental exposure in the 20-36 day window -> cereblon (CRBN) binding and E3 ligase reprogramming -> CRBN-dependent SALL4 degradation (species-restricted) -> limb (FGF8/SHH) and cardiac/visceral differentiation outcomes, plus a parallel antiangiogenic branch. Evidence from Ito 2010 (PMID:20223979), Donovan 2018 (PMID:30067223), Vargesson 2015 review (PMID:26043938), and the ReproTracker paper. ReproTracker linked as an IPSC_DERIVED_MODEL experimental_models entry (PARTIALLY_RECAPITULATES the cardiac/visceral differentiation node; PROXY_QUANTITY + BOUNDARY_OMISSION divergences). Mouse added as a FAILS_TO_RECAPITULATE animal model with a SPECIES_MISMATCH divergence, and a HUMAN_MODEL_MISMATCH discussion records why a negative mouse result is uninformative. All 35 snippets exact-quote verified; terms, entity-refs, causal-targets, coarse-phenotypes, model-scale and the formatting gates pass.

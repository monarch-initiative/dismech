  summary: 'Review round 1 (#18712): split surgery treatments, add pain/OA phenotypes
    and entrapment neuropathy'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR 18712 (all four findings closable from the DR report's references). Split the single reconstructive-surgery treatment into Limb reconstruction (pollicisation PMID:19492556 + Krukenberg PMID:40988535, both re-scoped as INDIRECT cross-aetiology evidence, fixing the over-stated relevance), Carpal tunnel decompression (thalidomide-specific PMID:16530898 + PMID:29053750), and Joint arthroplasty for secondary osteoarthritis (PMID:27117810) with a target_mechanisms join to the new Osteoarthritis phenotype. Added two high-frequency adult-survivor phenotypes - Chronic pain (HP:0012532, PMID:30650111) and Osteoarthritis (HP:0002758, PMID:27117810, BACKGROUND). Added the entrapment-neuropathy finding to the progression ageing phase (PMID:27100829 15/17 compressive neuropathy, PMID:23078293 not a generalised neuropathy). Cited the previously-uncited Brazilian control clause (PMID:24196904). All 65 snippets exact-quote verified.

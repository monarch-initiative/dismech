  summary: 'Create: Platelet-type Bleeding Disorder 15'
  details: |
    De-novo curation of ACTN1-related thrombocytopenia (BDPLT15, MONDO:0014078) as a single Disease entry. A Perplexity sonar-deep-research report (research/Platelet-type_Bleeding_Disorder_15-deep-research-perplexity.md) was used as a lead list only; its original validation step crashed on an OLS timeout, so retrofitted Reference Validation and Term Validation sections were read first. The report cited URLs rather than PMIDs, so every source was resolved to a PMID via PubMed E-utilities and fetched with just fetch-reference before quoting. Of the report's 19 citations, six (PMIDs 22102188, 23934752, 6286015, 18333841, 26882161 and DOI 10.1111/bjh.19025) are platelet-type von Willebrand disease papers and were rejected as off-topic; OMIM, MedGen, GTR, ClinVar, ZFIN and an icliniq consumer page are not citable reference types here and were also dropped. The report's HP suggestions were not used: HP:0000425 does not exist in HPO, HP:0000138 is Ovarian cyst rather than menorrhagia, and HP:0001655 is Patent foramen ovale rather than valvular heart disease; all HP, GO, CL, UBERON and NCIT terms were selected independently with OAK against ols: adapters. Eleven PMIDs are cited: the Kunishima 2013 discovery study, Gueguen 2013 French pedigree, Bottega 2015 and Vincenot 2019 cohort screens, Yasutomi 2016 rod-domain case, Faleschini 2018 49-carrier series, Zanchetta 2024 homozygous family, O'Sullivan 2020 biochemistry, the 2025 PF4-Actn1-/- mouse, a 2025 alpha-actinin-1 review, and one MYH9 paper for the differential. Substantive curation calls: the molecular lesion is curated as a gain of actin association (the direction O'Sullivan measured) rather than the loss of cross-linking the report asserted, with both readings carried as mechanistic hypotheses and an open KNOWLEDGE_GAP discussion; the entry deliberately does not conform to the primary_hemostatic_plug_failure module even though the Inherited_Platelet_Function_Disorders grouping expects it, because platelet function is normal in this disorder and the lesion is in proplatelet formation; and the knockout mouse is recorded as FAILS_TO_RECAPITULATE against the preserved-function node with a HUMAN_MODEL_MISMATCH discussion. Validation run: just validate (passed, 81/81 snippets verified), just validate-terms (passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets all OK, compliance 89.3 percent, and the batched just validate-disorders sweep.

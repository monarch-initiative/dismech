  summary: 'Create: Primordial Dwarfism-immunodeficiency-lipodystrophy Syndrome'
  details: |
    New entry for PRIM1-associated primordial dwarfism-immunodeficiency-lipodystrophy syndrome (MONDO:0859276, OMIM:620005), curated from the Perplexity deep-research report as leads and verified against the two primary case reports (PMID:33060134, full text; PMID:38773012, full text) and the ClinGen Moderate assertion (CGGV:assertion_56859937...). The pathograph runs from biallelic hypomorphic PRIM1 variants through deficient primer synthesis, impaired origin firing and fork progression, replication stress and a prolonged S phase to hypocellular growth failure, with a separate B-cell lymphopenia arm and an EMERGING type I interferon inflammation hypothesis for the lung and liver disease. Lipodystrophy is recorded as a phenotype without a causal edge because no source demonstrates its mechanism. No conforms_to: dna_damage_checkpoint_arrest was considered and rejected because the defining report attributes hypoproliferation to slowed cell-cycle progression and leaves checkpoint activation undetermined. Death in childhood (HP:0003819) is outside the PhenotypeTerm enum, so mortality is carried in descriptions and the Pneumonia phenotype instead. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified) and the whole-repo gates.

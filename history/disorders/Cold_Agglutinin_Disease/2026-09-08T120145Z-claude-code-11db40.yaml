  summary: 'Review round: add bortezomib, histopathology, two trials, KNOWLEDGE_GAP
    discussions, reticulocytosis'
  details: |
    Round answering the ai4c-reviewer review of 2026-09-08 (changes requested, 1 blocking + 4 suggestions). All five taken.

    BLOCKING - bortezomib. Curated as a treatment rather than dispositioned in the scoping note, because a prospective phase 2 GIMEMA trial clears the same evidential bar that already admits eculizumab, and because it is a third therapeutic axis: target_mechanisms links it to Monoclonal IgM Cold Agglutinin Production, which previously had no incoming treatment edge. The trial report (PMID:29898955, Rossi et al., Blood 2018) is a Letter that PubMed exposes without an abstract and whose full text is paywalled, so no snippet can be verified against it; it goes in the top-level references: block for provenance, exactly as the two Malecka letters do, and the result is quoted from PMID:42696222, which reports it.

    A numeric point worth recording. The falcon report, and the review quoting it, give the result as 'approximately 32% overall and 16% complete response'. The only cached source that states it, PMID:42696222, says an overall response rate of approximately 32% with a median response duration of approximately 16 months. Those are not the same claim and 16 appears in both, so this looks like a duration-for-CR-rate substitution somewhere upstream. It could not be settled against the primary source because that source has no abstract, so the entry records only what the cached review states and a treatment notes: line says why the CR figure is absent. Not asserted to be an error in the review, because it is not verifiable either way from here.

    SUGGESTIONS, all four taken:
    - histopathology: (new section, 3 findings) - the nodular clonal B-cell marrow infiltrate bound to NCIT:C199388, the extranodular monotypic plasma cells that carry the not-LPL argument, and the finding that only 11% of CAD marrows strictly meet the WHO-HAEM5 CAD-LPD morphological description despite clonality being demonstrable in 84%. That third finding qualifies rather than reinforces the entry's CAD-LPD framing, which is why it is curated as its own finding with diagnostic: false.
    - clinical_trials: pegcetacoplan NCT05096403 (phase 3, completed, n=24) and iptacopan NCT05086744 (phase 2, terminated, n=19). Phase, status and enrollment were verified against the ClinicalTrials.gov v2 API rather than taken from the deep-research report; the registry gives the iptacopan termination reason as a business decision, which is recorded in the description so a terminated trial is not misread as a negative result.
    - discussions: two KNOWLEDGE_GAP entries attached to the two mechanism_confidence: HYPOTHETICAL nodes (CR1 downregulation, prothrombotic state), making the open questions queryable instead of leaving them as confidence flags.
    - biochemical: reticulocyte count bound to HP:0001923, completing the LDH/haptoglobin/bilirubin hemolysis panel. Graded evidence_source: OTHER to match the existing grading of the same quoted sentence in the LDH entry, since check-snippet-grading keys on the sentence.

    PROSE ROT FOUND WHILE EDITING. The 'What is not modelled' paragraph claimed CADENZA Part B was 'likewise not curated' and that the entry 'cites the two pivotal Part A results only'. PMID:39091672 is in fact cited as evidence on the sutimlimab treatment. The paragraph is rewritten to state what is curated and why, covering bortezomib, iptacopan-as-trial-not-treatment, and the CADENZA/CARDINAL split accurately. This is the second instance of the same defect class in this entry, after the PMID:29265349 references claim fixed earlier in the PR.

    Validation: schema, terms and references pass, 139/139 snippets verified (up from 128). check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-cache-order and check-term-cache-integrity all clean.

  details: |
    Pre-review self-audit of the four batch PRs that had no completed review, looking for the defect classes the reviewer had raised on the three approved siblings.

    Two changes here.

    1. PMID:29265349 (Malecka et al. 2018, the original KMT2D/CARD11 report) had a committed references_cache/ file but appeared nowhere in a citation slot — only inside a notes: paragraph. The notes: paragraph itself asserted that this PMID and PMID:33891703 are 'both listed in the top-level references: block for provenance', which was true of the 2021 paper and not of the 2018 one. Added the missing top-level references: entry, with the title copied exactly from references_cache/PMID_29265349.md. The record is content_type: unavailable (a PubMed Letter with no abstract), so it correctly carries no evidence item and no snippet; the same findings remain quoted from PMID:42117133 and PMID:38133636, which report them in verifiable text.

    2. Treatments 'Corticosteroid Therapy' (NCIT:C122080 Systemic Corticosteroid Therapy) now carries therapeutic_modality: SMALL_MOLECULE. Left absent deliberately on 'Red Blood Cell Transfusion' and on the two chemoimmunotherapy combinations (bendamustine+rituximab, fludarabine+rituximab): the slot is single-valued, and a combination of a small molecule with a monoclonal antibody has no single correct value.

    Validation on this tree: just validate passed schema, terms, and references, with 128/128 snippets verified against cached references. check-folded-hyphens and check-environmental-evidence clean. check-snippet-length, check-title-snippets and check-snippet-grading report findings, but the identical counts (24/3/8) appear on the unmodified branch tip and none are in this entry — they are an artefact of the branch trailing origin/main, which makes those gates re-check every differing entry without grandfathering. CI on the merge result is green.

  details: |
    Created kb/disorders/Cold_Agglutinin_Disease.yaml (MONDO:0018922) as a standalone
    disease entry, and deleted stubs/Cold_Agglutinin_Disease.yaml.

    DEEP RESEARCH. Two providers actually ran, both to completion.
    - `just research-disorder asta Cold_Agglutinin_Disease` returned in 6.75 s.
      research/Cold_Agglutinin_Disease-deep-research-asta.md. 37 references, 37
      resolved, confabulation_rate 0.0, but only 17/37 judged on topic — and in the
      body only 3 of the 20 retrieved papers were about cold agglutinin disease. The
      rest were retrieval noise (rare genetic skeletal disease, obesity-associated
      asthma CD4+ T cell transcriptomics, goat pregnancy toxemia, Bartter syndrome).
      term_validation found zero ontology CURIEs, so nothing was taken from it there.
      Useful contributions: PMID:42117133 and PMID:38938203.
    - `just research-disorder falcon Cold_Agglutinin_Disease` returned after 860 s
      (14 min). research/Cold_Agglutinin_Disease-deep-research-falcon.md plus one
      artifact (artifact-00.md). 17 references, all resolved, 8 on topic, 1 quote
      checked and valid, 1 quote not checkable. 27 terms, 26 resolved, 0 not found.
      `needs_review: true` is driven only by a spurious label mismatch on
      MONDO:0018922 where the "reported label" is the template's own placeholder
      string "if available" — not a real mislabelling. Falcon cites by author-year
      key and DOI, not PMID, so its identifiers were resolved back to PubMed by hand
      where used. Its ordered causal chain agrees step for step with the graph built
      here; it contributed the eculizumab/DECADE and CADENZA Part B material added in
      a second pass.
    Because asta's retrieval was mostly off-target and falcon carries no PMIDs, the
    reference base is predominantly a systematic PubMed E-utilities sweep (Berentsen,
    Randen, Malecka, Roth, Bylsma, Swiecicki, Jager, and the 2026 reviews).

    GENEREVIEWS. Skipped deliberately: CAD is an acquired somatic clonal disease with
    no germline causal gene, and GeneReviews covers Mendelian disorders. Falcon
    independently reached the same conclusion ("no causal germline OMIM disease-gene
    entry should be assigned"). The authoritative consensus documents were used
    instead: the First International Consensus Meeting recommendations
    (PMID:31839434) and the two pivotal sutimlimab trials.

    MECHANISM MODEL. Fourteen pathophysiology nodes in one connected causal graph,
    every edge a bare-name target (0 prefixed, 0 dangling, 0 self-referential per
    scripts/check_causal_targets.py --report). The spine runs: somatic KMT2D
    (loss-of-function) and CARD11 (gain-of-function) mutation -> clonal bone-marrow
    B-cell lymphoproliferation -> monoclonal IGHV4-34 IgM-kappa anti-I cold
    agglutinin -> cold-dependent erythrocyte agglutination -> classical complement
    pathway activation on the erythrocyte surface -> C3b opsonization -> hepatic
    (Kupffer cell) extravascular hemolysis -> chronic hemolytic anemia. Two branches
    leave that spine, and the branching is the point of the entry:
    1. Agglutination branches directly to acral microcirculatory obstruction ->
       acrocyanosis, Raynaud phenomenon, livedo reticularis. This limb is NOT
       complement-mediated, which is why complement inhibitors do not relieve it.
    2. C3b opsonization branches to terminal complement pathway assembly / C5b-9 ->
       intravascular hemolysis -> hemoglobinuria. This is the minority route,
       limited by intact CD55/CD59, and is why C5 inhibition alone underperforms.
    Two further nodes: acute-phase complement repletion during febrile illness
    (the mechanistic explanation for the paradoxical febrile exacerbation seen in
    74% of the Norwegian cohort), and a hypothesis-flagged prothrombotic state.
    Nodes carrying an inferential claim are marked mechanism_confidence HYPOTHETICAL
    or PROVISIONAL rather than asserted flat (CR1 downregulation, febrile repletion,
    prothrombotic state).

    CONFORMANCE. Two modules. `hemolytic_anemia_erythrocyte_destruction#Premature
    Erythrocyte Destruction` on the hepatic extravascular node and
    `...#Hemolytic Anemia` on the anemia node. `complement_dysregulation#C5
    Convertase Activation and Terminal Pathway Assembly` on the terminal-pathway
    node ONLY — not on the trigger node, because that module scopes itself to
    alternative-pathway regulator failure and says explicitly that
    classical-pathway-initiated disease enters downstream at whichever node its
    curated content actually models. A note on the node records that reasoning.

    SCOPING AGAINST Autoimmune_Hemolytic_Anemia.yaml. Read it first; not edited.
    That entry (MONDO:0020108) is the parent concept and already has a
    pathophysiology node "Cold Agglutinin-Mediated Hemolysis" that correctly states
    IgM/complement/hepatic extravascular clearance. This entry does not contradict
    it. What it adds is what the parent does not carry: the clonal marrow
    lymphoproliferative disorder, its somatic mutation profile, the WHO-HAEM5
    entity status, and the CAD-specific therapeutic biology. The parent has no CAD
    subtype; adding one there was deliberately left to whoever next edits that file,
    and that is stated in this entry's `notes:`. Secondary cold agglutinin SYNDROME
    is handled as a `differential_diagnoses` entry, not a subtype, because its
    antibody is polyclonal/transient (post-infectious) or produced by an overt
    neoplasm (lymphoma-associated) and its management targets the underlying cause.
    MONDO:0016450 ("autoimmune hemolytic anemia, cold type"), which lumps CAD, CAS
    and paroxysmal cold hemoglobinuria, is recorded as skos:broadMatch for the same
    reason.

    REFERENCES REJECTED. PMID:29265349 (Malecka 2018, the original KMT2D/CARD11
    letter) and PMID:33891703 (Malecka 2021, the full mutational landscape) are both
    abstract-less PubMed records; their caches are `content_type: unavailable` and no
    snippet can be verified against either. Falcon's validator hit the same wall on
    the 2021 paper. Both are listed in the top-level `references:` block for
    provenance, and the same findings are quoted from PMID:42117133 and PMID:38133636
    instead. Eleven of the twelve `just discover-datasets` candidates were rejected on
    relevance triage: they matched on KMT2D, CARD11 or CXCR4 in B-cell lymphoma,
    colorectal cancer, HIV host-factor screens and neurodevelopmental disorders, not
    on cold agglutinin disease. Only the DIRECT candidate geo:GSE140415 (CNV
    profiling of 13 CAD samples, trisomy 3/3q in 12/13) was curated, and its
    references_cache/GEO_GSE140415.md was written by `just verify-datasets`.

    TERM-CACHE DRIFT SURFACED, NOT PATCHED. HP:0020181 is bound with the label
    "Reduced haptoglobin level", which is what cache/hp/terms.csv holds and what
    Atypical_Hemolytic_Uremic_Syndrome and HELLP_Syndrome already use. Live OLS
    returns "Decreased circulating haptoglobin concentration" for the same CURIE, so

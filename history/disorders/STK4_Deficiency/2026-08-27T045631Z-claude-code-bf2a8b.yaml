  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review against every cited reference in references_cache. The largest gap was PMID:39110273, cited once for inheritance while its substantive content went uncurated; it now supports Persistent human papillomavirus infection (epidermodysplasia verruciformis from the weakly virulent beta-papillomavirus HPV38), Increased gamma-delta T cell proportion (Vd2 expansion at 67.4% of CD3+ cells, masking the CD4 deficit behind a normal total CD3 count, and reported as recurring across the 33 published cases), adult-onset DLBCL, and a variable-penetrance progression phase. Added ten phenotypes: Atopic dermatitis, Eosinophilia, Decreased circulating total IgM, Decreased naive T cell proportion, Increased plasmablast proportion, Decreased class-switched memory B cell proportion, Autoimmune cytopenia, Increased double-negative T cell number, Decreased specific antibody response to vaccination, Decreased regulatory T cell proportion, Hypothyroidism and Short stature. Added frequency bands with cohort-count evidence for Autoimmunity, Autoimmune cytopenia, Lymphoproliferative disorder and Lymphoma. Added two pathograph edges: gamma-delta expansion as incomplete compensation for the failing CD4 compartment, and papillomavirus susceptibility downstream of the interferon defect. Added a progression section (median symptom onset 6 years 8 months, median diagnosis 7 years 5 months, both ranges extending past 20 years) and a differential_diagnoses section the entry previously lacked, covering autosomal recessive hyper-IgE syndrome (named by the cohort review as the crucial differential) and ALPS (with the FAS-pathway negative results that exclude it). Added an Immunomodulatory therapy treatment at PARTIAL. Fidelity fix: the Lymphoma description asserted loss of STK4 tumour suppression AND impaired immune surveillance as the cause; PMID:30386345 offers these as two alternative hypotheses, so the wording was softened and the mechanism sentence added as PARTIAL. Term note: HP:0002850 was bound with the pinned cache label 'Decreased circulating total IgM', which the rest of the KB uses; live OLS now returns a renamed label, and the cache was not hand-edited. Validation: schema pass, terms pass, 82/82 snippets verified individually and 188/188 in the batched sweep; three initially over-short count snippets were replaced with the full cohort sentence to clear check-snippet-length.

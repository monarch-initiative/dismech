  details: |
    Created kb/disorders/VPS4A-Related_Neurodevelopmental_Syndrome.yaml for MONDO:0035819 (CIMDAG syndrome; OMIM:619273; causal gene VPS4A, HGNC:13488), claiming issue #7693 toward epic #1079.

    NEC preflight (run BEFORE any deep-research content was used): 'runoak -i sqlite:obo:mondo info MONDO:0035819 -O obo' confirms RO:0004003 -> HGNC:13488 VPS4A, xref OMIM:619273, synonym 'CIMDAG syndrome'. The claude_code deep-research report was then gene-frequency checked: VPS4A 120 mentions vs VPS4B 23 (VPS4B appears because paralog non-redundancy is a genuine subject of the literature, not because of entity substitution); the only OMIM asserted is OMIM:619273 and the only disease MONDO asserted is MONDO:0035819. Preflight passed, so the report was used as leads.

    Deep research: just research-disorder claude_code VPS4A-Related_Neurodevelopmental_Syndrome (990 s, 11 web searches, 69 turns, 18 citations); report and citations sidecar committed under research/.

    Curated content: a five-node causal graph (VPS4A ATPase-domain missense -> failed ESCRT-III disassembly -> enlarged IST1-retaining endosomes and defective cytokinetic abscission -> ineffective erythropoiesis / abnormal neurodevelopment -> multisystem disease), plus a PROVISIONAL lipotoxicity node from the single 2026 family. Twelve phenotypes, imaging finding, bone marrow histopathology, genetic and variant blocks, diagnosis, two differential diagnoses (CDA I, CDA II), one supportive-care treatment, one zebrafish animal model, two experimental models, prevalence, the CDA Registry observational trial, and five discussions (one HUMAN_MODEL_MISMATCH, two KNOWLEDGE_GAP, two OPEN_QUESTION) with structured proposed experiments.

    Deliberate omissions, all recorded in the entry notes: no phenotype frequency bands (published cohorts are 6, 3, and single cases; the abstracts give no per-feature denominators, so per the frequency guidelines the bands are left unset); no onset descriptors except CONGENITAL for the microcephaly, which the sources state; no ORPHA:603448 evidence (that cache file does not exist locally and rebuilding it would require touching data/orphadata, which is out of PR scope); no ciliopathy_dysfunction conforms_to (cilium morphology is disturbed but the primary lesion is ESCRT, not IFT, so conformance would overstate); no GeneReviews baseline (PubMed searches for 'VPS4A GeneReviews[All Fields]' and 'CIMDAG GeneReviews[All Fields]' both return zero records). Detail from the deep-research report that rests on the HPO annotation file, paper full text, or a family support-group guide was NOT converted into evidenced assertions because only PMID:38687820 is cached as full text; everything else is abstract-only.

    Validation: just validate (schema + terms + references) PASS; just validate-terms PASS; just validate-references 59/59 snippets verified; scripts/check_snippets_verbatim.py 59/59 verified verbatim (both checkers run - one DR-suggested full-text quote failed validate-references on a PDF line-break hyphenation artifact and was replaced rather than papered over); scripts/check_folded_hyphens.py --check OK; just validate-history-all clean; pytest tests/test_data.py has one pre-existing unrelated failure (SETD5_Haploinsufficiency_Syndrome). Compliance ~90 percent.

  summary: 'Address PR #7728 review: add 12 HPOA/literature-sourced phenotypes, split
    bundled abscission node, close lipotoxicity dead-end'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7728.

    BLOCKING item (phenotype coverage, checklist dimension 1): added 12 phenotypes, taking the entry from 12 to 24. The HPO annotation set for OMIM:619273 was retrieved independently from https://ontology.jax.org/api/network/annotation/OMIM:619273 on 2026-08-01 (35 annotations returned) and each new descriptor records its patient-count fraction and the retrieval date in notes. Four of the new phenotypes carry real evidence items (HP:0000252 Microcephaly from PMID:42498620; HP:0000505 Visual impairment and HP:0000407 Sensorineural hearing impairment from the cached full text of PMID:38687820, both tagged OTHER/PARTIAL because the sentence is that paper's background summary of prior human reports; HP:0010972 from PMID:33186543). Seven are evidence-free descriptors with provenance notes because no cached reference mentions them and the AJHG full texts are unreachable. No frequency bands were set: the HPOA figures are patient counts over series of three to six probands, not population frequencies.

    Suggestion 1: HP:0000252 Microcephaly added alongside HP:0011451 Primary microcephaly, both retained.

    Suggestion 2: the node 'Defective Cytokinetic Abscission and Cell-Division Errors' was split into three atomic nodes - 'Defective Cytokinetic Abscission' (GO:0000281, keeps the erythroid downstream edge), 'Chromosome Missegregation and Mitotic Spindle Errors' (GO:0007059, GO:0000278) and 'Centrosome Number and Primary Cilium Abnormalities' (GO:0007098, GO:0060271). Parent edges from the ESCRT-III turnover node were duplicated to all three, and the vps4a_micronuclei_cgas_sting_interferon discussion now attaches to the chromosome-segregation node.

    Suggestion 3: HP:0010972 Anemia of inadequate production added alongside, not instead of, HP:0001903; the term-choice audit note was extended to explain why both are kept.

    Suggestion 4: the 'VPS4A Destabilization and Lipotoxic Stress' dead-end was closed with an INDIRECT_UNKNOWN_INTERMEDIATES/PARTIAL edge to the multisystem endpoint plus a note recording that no specific clinical consequence of lipotoxicity is established.

    Suggestion 5 (classifications block) declined: no value in MechanisticNosologyEnum fits an ESCRT/membrane-scission disorder, ciliopathy was already deliberately declined, and the other classification axes (ICIMD, IUIS, channelopathy, lysosomal storage, ICD-O, Harrison's, NIH priority) are inapplicable.

    Splenomegaly (HP:0001744) is the one new descriptor with weaker provenance: it is NOT in the HPO annotation set (verified term by term on 2026-08-01) and comes from the deep-research artifact's reading of the Seu et al. full text, which is not cached. That is stated in its note.

    Validation: just validate PASS; validate-terms PASS; validate-references 68/68; check_snippets_verbatim 68/68; check_folded_hyphens --check clean.

  summary: 'Create: CEBALID_Syndrome'
  details: |
    New entry for CEBALID syndrome (MN1 C-terminal truncation syndrome, MONDO:0032908, OMIM 618774). Lump/split: curated as a DISEASE entry. The entity is a single-gene, single-mechanism disorder defined by NMD-escaping truncating variants in the last exon or the extreme 3' end of exon 1 of MN1; earlier exon 1 truncations and whole-gene deletions give a milder, different phenotype and are recorded in the genetic notes as an allelic contrast, not as subtypes. ClinGen classifies MN1 and CEBALID syndrome as Definitive (AD); the tier is copied from the cached CGGV record. Somatic MN1 neoplasms (meningioma, MN1::ETV6 leukaemia) are out of scope and no AML or meningioma content was used.

    Sources: GeneReviews chapter PMID:32790267 (tagged and mined for clinical characteristics, diagnosis, management, surveillance and genetic counselling), the two founding papers (Mak 2020, PMID:31834374, for cohort frequencies; Miyake 2020, PMID:31839203, for NMD escape, protein stability, RING1 and ZBTB24 binding, nuclear condensates and proliferation), case reports, Mn1 knockout mouse papers, and the cached ClinGen record. The pathophysiology chain runs from the variant through NMD escape, loss of RING1/ZBTB24 binding, impaired proteasomal degradation, nuclear condensation and dysregulated transcription to brain and craniofacial development nodes wired to phenotypes. The gain-of-function category is sourced from Miyake's in vitro data and marked indirect; the dominant-negative alternative raised by Mak is recorded as a knowledge gap, and the mismatch between Mn1 null mice and the truncation mechanism as a HUMAN_MODEL_MISMATCH discussion.

    Deep research: the openscientist report research/CEBALID_Syndrome-deep-research-openscientist.md was used. Its run exited non-zero only because report term validation timed out against EBI OLS (5 s read timeout); the report itself was written. just validate-research-reference was run afterwards: 12/12 references resolved, 0 unresolved, 0 off topic, 5 judged on topic. just validate-research-terms failed twice on the same OLS timeout, so the report has no Term Validation section; no CURIE was copied from the report without a separate lookup. just preflight-dr against MONDO:0032908 returned PASS (MN1 mentioned 80 times). From the report, PMID:12569362 (MN1 as a transcription coactivator) and PMID:18948418 (Mn1 upstream of Tbx22 in palate growth) were added; its AML context references were not used.

    Validation: just validate, validate-terms, count-verified-snippets (86/86), the per-file gates, the whole-tree gates and validate-disorders.

  summary: 'Round-3 review polish: ligature elision, therapeutic_modality, venetoclax
    sourcing, DDx MONDO bindings'
  details: |
    Addressed the remaining non-blocking suggestions from the round-3 (APPROVED)
    automated review of PR #7494, plus one gap found independently.

    Reviewer suggestion 1 — venetoclax agent identity exceeds its sole source.
    The "BCL-2 Inhibition with Venetoclax" treatment binds CHEBI:133021
    venetoclax and CHEBI:2038 5-azacytidine, but its only evidence item
    (clinicaltrials:NCT07573670) says only "Bcl-2 Inhibitor" and never names the
    agent. Added a caveat clause to the existing PARTIAL explanation recording
    that the registration record does not source the agent identity, and added a
    second evidence item, PMID:41540127 (Ann Hematol 2026; single-center
    retrospective series of 13 Philadelphia-negative ALAL patients given mini-CVD
    plus venetoclax and azacitidine, 92.3% CR), which names both agents
    explicitly. Marked PARTIAL because the cohort is ALAL rather than
    MPAL-restricted, the design is retrospective and small, and the agents were
    given on a mini-CVD backbone rather than as the doublet the trial is testing:
    it sources the agent identity and clinical plausibility, not efficacy in MPAL.

    Reviewer suggestion 2 — therapeutic_modality unset on 3 of 9 treatments. Set
    CELL_THERAPY on Allogeneic Hematopoietic Stem Cell Transplantation
    (NCIT:C46089) and SMALL_MOLECULE on Central Nervous System-Directed
    Prophylaxis (NCIT:C15750, intrathecal chemotherapy), both mechanically
    inferable per the CLAUDE.md backfill table. Supportive Care left unset — it
    has no therapeutic platform.

    Reviewer suggestion 3 — ligature-split snippet. The WHO-HAEM5 (PMID:35732831)
    BCL11B quote carried a space-broken fi-ligature in "identified", which would
    render as a split word on the disorder page. Fixed with the validator's "..."
    elision mechanism in BOTH places the quote appears — the has_subtypes "ALAL
    BCL11B" entry and the genetic BCL11B entry. The review flagged only one of the
    two occurrences.

    Reviewer suggestion 4 — residual line-break hyphenation in the PMID:28422191
    quotes. Declined, agreeing with the reviewer's own "not worth churn"
    assessment: eliding "anemic syn- drome" would drop the content word
    "syndrome" from the quote, making it less informative rather than more, and a
    single line-break hyphen is materially different from the intra-word damage it
    replaced.

    Reviewer suggestion 5 — downstream[].evidence 8/33 and
    differential_diagnoses[].evidence 4/7. Deferred as agreed; both improved in
    the prior round and the parent claims are evidenced.

    Independent finding not raised by the reviewer: all 7 differential_diagnoses
    entries lacked disease_term, while 830 of 1,246 DDx entries repo-wide (66.6%)
    carry one. Bound all seven to MONDO, OAK-verified non-obsolete with exact
    canonical labels: acute lymphoblastic leukemia MONDO:0004967; acute
    undifferentiated leukemia MONDO:0020321; early T-cell precursor ALL
    MONDO:0100291; blastic plasmacytoid dendritic cell neoplasm MONDO:0019467
    (canonical label "CD4+/CD56+ hematodermic neoplasm", more specific
    preferred_term retained per the CLAUDE.md preferred_term-vs-label rule). The
    three AML-family differentials have no dedicated MONDO term — the natural
    umbrella for "AML with defining recurrent genetic abnormalities",
    MONDO:0020078, is OBSOLETE and the lesion-specific children are too narrow to
    stand for the grouping — so all three anchor on the parent MONDO:0018874
    acute myeloid leukemia with a more specific preferred_term; the obsolescence
    is recorded in that entry's description.

    Also re-audited independently, with no defects found: every GO and CL term
    re-resolved with OAK and its definition read against the node it annotates (no
    semantically wrong bindings); the full file scanned for character-substitution
    problems (only en-dashes, plus-minus signs and intact fi-ligatures remain,
    none of which split a word); the WHO 2016 to 2022/ICC lineage-assignment
    criteria re-checked and still correctly stated after all edits (MPO or
    monocytic differentiation for myeloid, cytoplasmic or surface CD3 for T,
    strong CD19 plus one of CD79a/cCD22/CD10 or weak CD19 plus two for B, with the
    WHO-HAEM5 50%-of-mature-neutrophil MPO intensity threshold); and the ALL-type
    versus AML-type induction question confirmed still framed as an open
    KNOWLEDGE_GAP discussion rather than asserted.

    The disease_term anchoring on MONDO:0020743 rather than the MONDO:0020322
    tracked by issue #7468 remains escalated to @cmungall and was deliberately not
    changed.

    Validation: just validate passes; just validate-references 128/128 snippets
    verified (was 127/127); just validate-terms passes;
    scripts/check_folded_hyphens.py --check clean; pytest tests/test_data.py -k
    "subtype_foreign or conforms or unique_name or history or differential or
    pathograph or connect or evidence" 3427 passed. Compliance 85.0% to 85.3%
    (weighted 85.4% to 85.7%). references_cache validator churn (issue #7393)
    reverted; the only reference cache file added is PMID_41540127.md, created via
    just fetch-reference.

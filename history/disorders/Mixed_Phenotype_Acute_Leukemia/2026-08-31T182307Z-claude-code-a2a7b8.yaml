  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place, so this entry explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim, restated in terms of the current enum, following the pattern set by PR 10120 and continued in PRs 10258 and 10263. directness: INDIRECT is added only where the curator's own words name an inference step. Where they do not, the retired token is dropped and no directness is asserted: absent means nobody has assessed the item, which is the honest state and is what #10003 chose for all 11,620 of its own migrated items. A consistency check enforces both directions - no explanation claims INDIRECT without the item carrying the slot, and no item carries the slot without the explanation saying why - and is zero across the tranche. No supports value, snippet, reference, evidence_source or ontology term changed. Nineteen explanations rewritten mechanically and one by hand: the venetoclax/azacitidine item, whose curator had written PARTIAL rather than SUPPORT to record that the series is single-centre and retrospective, that the drugs were given on a mini-CVD backbone rather than as the doublet under trial, and that the cohort is ALAL rather than MPAL-restricted. There is no middle value left to express that, so the three caveats are preserved as prose. One item carries directness: INDIRECT. Validated with just validate-disorders across the tranche: 372/372 snippets verified.

  summary: 'Review fixes: biological_scale, genetic/phenotype evidence, MPAL trials'
  details: |
    Independent red-team verification of PR #7494 plus additive fixes. Verification performed: all 87 original evidence snippets confirmed byte-literal substrings of their cached references under whitespace normalization, including ligature and en-dash sensitive spans; all 62 ontology term IDs independently re-resolved through OAK with exact canonical label match; pathograph confirmed to be a single connected component with every downstream target resolving to a pathophysiology node or a declared phenotype; all subtype foreign keys resolve; PR scope confirmed clean with no unrelated references_cache or cache churn and no silent reversions.

    Defects found and fixed in this commit. First, biological_scale was absent from all twelve pathophysiology nodes; each node was tagged with a single value following the CLAUDE.md guidance (CELLULAR for the progenitor, lineage-commitment, T-lineage-program, antigen-co-expression and plasticity nodes; MOLECULAR for the stem-like/epigenetic, BCR-ABL1 kinase, KMT2A-HOXA and ZNF384 nodes; TISSUE for marrow replacement; ORGANISM for marrow failure and extramedullary infiltration). Second, all eight genetic entries carried zero evidence items; each now has one or two evidence items with verified snippets from the WHO-HAEM5 classification, the Alexander 2018 landmark genomics paper, the Matutes 2011 WHO-2008 reference series, and the Qasrawi 2020 SEER registry analysis, with PARTIAL used where the abstract does not name the gene explicitly. Third, eleven of fifteen phenotypes carried zero evidence; each now cites the Karasek 2025 MPAL review, using its explicit hepatosplenomegaly/lymphadenopathy/CNS statement as SUPPORT for the organ phenotypes and its shared-presentation statement as PARTIAL for the cytopenia and constitutional phenotypes, with no frequency bands asserted. Fourth, the two clinical-trial evidence items lacked reference_title. Fifth, two verified MPAL-specific prospective trials were missing and have been added: NCT07573670, a two-cohort phase 2 of BCL-2 inhibitor plus azacitidine stratified by B/myeloid versus T/myeloid immunophenotype, and NCT07222579, a phase 2 of subcutaneous blinatumomab in CD19-positive adult MPAL; both were confirmed real and MPAL-specific against the ClinicalTrials.gov API before being cited.

    Five reference cache files were added for the new citations, all produced by just fetch-reference and never hand-edited: PMID:41477275, PMID:32419244, PMID:25858895, PMID:29720486, PMID:38972954, plus the two new clinicaltrials records.

    Left for a human: the entry anchors disease_term on MONDO:0020743 (mixed phenotype acute leukemia) rather than the MONDO:0020322 named in issue #7468. The choice is documented in the entry mappings with a defensible rationale, and MONDO:0020322 is recorded both as a mapping and as a synonym, so this is a deliberate curatorial decision rather than an error, but it diverges from the identifier the issue tracks and was left unchanged. Also left unchanged: acute undifferentiated leukemia is modelled as a has_subtypes member although it is a sibling ambiguous-lineage entity rather than an MPAL subtype; the entry states this explicitly in the subtype description.

    Validation after changes: just validate passes (schema, terms, 111/111 snippets), just validate-terms passes, just validate-references passes, just compliance rises from 72.3 to 81.0 percent weighted.

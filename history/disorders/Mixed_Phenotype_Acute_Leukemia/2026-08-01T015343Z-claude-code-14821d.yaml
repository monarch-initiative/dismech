  details: |
    Addressed the two blocking items from the round-2 review of PR #7494.

    (1) The PMID:39813682 lineage-switch snippet on the "Lineage Plasticity and Therapy Escape" node was truncated at "in contrast to MPAL" while its explanation claimed "roughly one third of cases". The reviewer's literal fix (appending the parenthetical with bracketed percentages) cannot be applied: linkml-reference-validator strips [...] editorial brackets from the snippet but not from the cached abstract, so the bracketed percentages are dropped from the query and the substring comparison fails. Used the validator's own "..." elision instead, so the snippet now reads "Furthermore, AML-MP rarely switches to a lymphoid immunophenotype after treatment, in contrast to MPAL ... 10/28 35.7%; P = .0003". The quantitative claim is now quoted and the explanation records the elision.

    (2) All 11 phenotype evidence items sourced from references_cache/PMID_41477275.md quoted PDF-extraction text with intra-word spacing damage ("The clinical pr esentation of MPAL re sembles that of other acu te leuke mias", "hepatosplenomegal y, lymphadenopat hy"). Replaced with clean already-cached PMID:28422191 quotes: the presenting-signs sentence naming anemic syndrome, hemorrhage and infection for Fatigue, Pallor, Fever, Abnormal bleeding, Petechiae, Recurrent infections and Bone pain; the direct hyperleukocytosis sentence for Increased total leukocyte count (upgraded PARTIAL to SUPPORT); and the hepatosplenomegaly/lymphadenomegaly sentence for the organ-involvement phenotypes. Abnormal bleeding was also upgraded to SUPPORT because hemorrhage is named directly. PMID:41477275 is retained only where its clean structured abstract says something the 2017 review does not (elevated leukocyte counts as an adverse prognostic factor; the four-way genetic subcategory list).

    Non-blocking items also applied: removed the redundant standalone Splenomegaly phenotype (HP:0001433 Hepatosplenomegaly is_a HP:0001744 Splenomegaly) and its causal edge; added evidence to 9 previously unevidenced downstream causal edges; added evidence to 3 differential diagnoses (1/7 to 4/7); promoted BCL11B to a has_subtypes entry named "ALAL BCL11B" (no MONDO term exists for the entity, so subtype_term is intentionally unbound and the gap is documented in the description); split the bundled CD19-directed treatment into blinatumomab (MONOCLONAL_ANTIBODY) and CD19-directed CAR T cells (CELL_THERAPY); added a venetoclax plus azacitidine BCL-2 treatment matching NCT07573670; retagged ALL-type induction from SMALL_MOLECULE to OTHER and gave it a four-agent therapeutic_agent list; added target_phenotypes to all four clinical trials.

    Validation: just validate passes (127/127 snippets verified, term validation clean), scripts/check_folded_hyphens.py is clean against the 330-entry baseline, and 1711 selected tests/test_data.py foreign-key, pathograph and uniqueness checks pass. All ontology IDs were OAK-verified: CHEBI:28445 vincristine, CHEBI:41879 dexamethasone, CHEBI:41977 daunorubicin, NCIT:C286 Asparaginase, CHEBI:133021 venetoclax, CHEBI:2038 5-azacytidine, NCIT:C126102 Chimeric Antigen Receptor T-Cell Therapy. NCIT:C155798 was rejected because it is a retired concept not reachable from NCIT:C25218.

  summary: 'Create: Mixed_Phenotype_Acute_Leukemia'
  details: |
    Created a new dismech Disease entry for mixed phenotype acute leukemia (MPAL), resolving issue #7468. Falcon (Edison Scientific) deep research was run via 'just research-disorder falcon Mixed_Phenotype_Acute_Leukemia'; the report was treated as leads only and every PMID it named was independently re-fetched with 'just fetch-reference', with every snippet verified as an exact substring of the cached abstract. A Named Entity Confusion preflight was run with OAK against MONDO: MONDO:0020322 (the ID cited in the issue) is the narrower legacy term 'acute biphenotypic leukemia' and is a subclass of MONDO:0020743 'mixed phenotype acute leukemia', so the entry is bound to MONDO:0020743 and records MONDO:0020322 as a skos:narrowMatch mapping. Curated 12 connected pathophysiology nodes: immature multipotent progenitor cell of origin, failure of lineage commitment, stem-like transcriptional and epigenetic lineage programming, BCR-ABL1 kinase signaling, KMT2A/HOXA program, ZNF384 B/myeloid programming, immature T-lineage with retained myeloid potential, cross-lineage antigen co-expression, clonal blast expansion, marrow failure, extramedullary infiltration, and lineage plasticity with therapy escape. Also curated 5 WHO/ICC subtypes plus acute undifferentiated leukemia, 15 phenotypes, 8 genetic entries, 7 treatments, 5 diagnostic modalities, 7 differential diagnoses, epidemiology, prevalence and progression records, 2 clinical trials, and 3 discussions. Validated with just validate, just validate-terms, just validate-references (87 of 87 snippets verified) and scripts/check_folded_hyphens.py.

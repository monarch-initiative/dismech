  summary: Review DFNA50 allele mechanisms, clinical phenotype and preclinical therapies against primary
    full text
  details: 'Reviewed the entry, original CREATE history, matching OpenScientist report, citation list
    and artifact table against primary references. DFNA50 is a Mendelian MIR96 disorder and remains in
    scope under the exclusion of primary infectious and environmental diseases. No prior REVIEW event
    or overlapping open PR was found at selection.


    Read the accessible scientific full text for the original diminuendo study, Italian precursor-variant
    family, maturation physiology, Ptprq comparison, cluster knockout, Mir183/96 double knockout, sorted
    hair-cell transcriptomics, human-seed knock-ins, allele-specific editing and 2025 single-Mir96/adult-inducible
    knockout. Used generated URL caches where PMID caches lacked full text. The founding Spanish human
    report and CLIC5 cell study were assessed within their abstracts, supplemented by accessible Spanish
    figure captions. Read ClinGen''s complete evidence table and the relevant GeneReviews clinical, diagnostic,
    management and counseling sections. Two full-text XML caches have automatically extracted generic
    Abstract titles: evidence retains those cache titles and gives the verified article title and PMID
    in its explanation. Cache files were generated, never manually authored or edited.


    Corrected the precursor allele: +57T>C preserves the miR-96-5p sequence but also changes position
    6 of the companion miR-96-3p seed. Its processing defect cannot be assumed purely quantitative; Dicer
    cleavage is proposed, not directly assayed. Separated decreased normal target repression from acquired
    mutant targeting. Normal hearing in deletion heterozygotes does not exclude dosage effects for every
    human allele. Corrected the old five-gene/no-target-site statement: only Ocm/prestin were tested against
    nine other deaf mutants, and later analysis identified a potential mutant-seed site in Ptprq. Ptprq-null
    overlap supports a partial contribution without proving mediation. Human-seed knock-in transcriptomes
    also have acquired-target signatures; this is not unique to diminuendo.


    Separated neonatal maturation impairment from adult maintenance, retained residual mechanotransduction
    in diminuendo, and added allele-specific synaptic dysfunction. Complete neonatal arrest belongs to
    homozygous mouse experiments, not established universal human pathology. +13G>A heterozygotes can
    have subtle bundle abnormalities despite normal thresholds; homozygous synapse loss is not shared
    by the +14C>A comparison. Marked model-to-human cellular chains provisional and explicitly linked
    the hearing-loss endpoint. Vertigo remains unconnected because the family report does not trace its
    cellular mechanism.


    Consolidated hearing phenotypes with bilateral laterality and variable-onset notes; added high-frequency
    configuration and the Italian family''s episodic vertigo. Removed unsupported obligate frequency and
    population rarity tier. Young normal-hearing carriers do not distinguish delayed onset from incomplete
    penetrance. Case counts are bounded to the September 2023 ClinGen curation, which classified the association
    Moderate; unscored candidates with alternative causes were not promoted. Added panel/noncoding-locus
    coverage and VUS interpretation, hearing aids/communication support, cochlear implant consideration,
    counseling/surveillance and general noise conservation using GeneReviews evidence in all four clinical
    domains.


    Added named experimental AAV2 mutant-allele disruption and amitriptyline treatments, with explicit
    preclinical scope. Editing uses end joining, not nucleotide correction; benefit at three/six weeks
    did not extend to sixteen-week intervention. The full-text standard-dose integration result (102 reads,
    0.26%) prevents repeating the abstract''s unqualified no-integration claim. Amitriptyline exposure
    began with breeding parents and continued in offspring, delayed progression temporarily, did not rescue
    homozygotes and gained no benefit at double dose; the authors did not recommend human treatment. Multiplex
    guides did not cover every reported human allele. Neonatal AAV8 rescue of a null genotype remains
    a separate model observation. ClinicalTrials.gov searches on 2026-09-23 found no DFNA50 study; the
    one MIR96 hit was unrelated platelet study NCT02101437.


    Reassessed model fidelity and readout direction, adding the single-gene adult-inducible comparator.
    Corrected GSE255796 to sorted mixed cochlear/vestibular hair cells, and GSE247473 to constitutive/adult-inducible
    knockout whole-cochlea comparisons rather than viral-restoration transcriptomes. Both accessions were
    fetched, verified and committed as generated GEO caches; the retired shared accession blob was not
    accessed. Updated the CLIC5 discussion with single-knockout upregulation while preserving the unknown
    dominant-seed contribution. RAB11A target-site differences remain an unvalidated explanation of the
    human/mouse mismatch.


    Completeness assessment: clinical phenotypes, pathophysiology, genetics, diagnosis, standard care,
    experimental treatments, datasets/models and high-value references are adequately represented after
    these corrections. No established subtype or omitted disease-specific biomarker was identified. General
    noise-injury biology and untested regulatory intermediates were not promoted to established DFNA50
    mechanisms. GeneReviews is tagged, cached and mined for clinical characteristics, diagnosis, management
    and inheritance/counseling; general guidance is identified as such. All 107 evidence quotations were
    checked against generated caches, titles and claim/assay context. Schema and ontology validation passed.
    Local causal/entity/qualifier/delivery/hypothesis, snippet, title and grading gates and the history
    record are checked before publication; independent PR review and CI remain publication gates.'

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 50 (DFNA50, MIR96)'
  details: |
    De-novo curation of DFNA50 (MONDO:0013114, MIR96), claim issue #10461.

    Scope decision: DISEASE. One gene, one conserved pathograph (MIR96 point mutation ->
    altered target repertoire -> arrested hair cell maturation -> progressive SNHL), no
    member diseases to unite, and the only MONDO parent (MONDO:0019587) is an ontology
    grouping of unrelated DFNA loci. Stub deleted.

    miRNA-specific modelling decisions:
    - GeneDescriptor for MIR96 (hgnc:31648) uses the same shape as a protein-coding gene;
      the GeneTerm enum has no reachable_from constraint, so an "RNA, micro" locus type
      validates normally. Confirmed by validate-terms.
    - functional_impact_category is left ABSENT on the seed-mutation GeneticContext, with a
      notes block giving the reason. FunctionalImpactEnum is single-valued and the seed
      substitution is simultaneously hypomorphic (for the wild-type target set) and
      neomorphic (for transcripts complementary to the mutant seed). LOSS_OF_FUNCTION is
      refuted by Mir183/96 null heterozygotes hearing normally (PMID:39434156);
      NEOMORPHIC records only half. The Italian precursor allele DOES get a controlled
      value, PARTIAL_LOSS_OF_FUNCTION, because that defect is purely quantitative - the two
      allele classes are curated as separate pathophysiology nodes for this reason.
    - modifier is left ABSENT on the GO:0035195 descriptor of the "Repression of Novel
      Targets Acquired by the Mutant Seed" node, with a notes block. What changed is
      silencing specificity, not level; INCREASED/DECREASED are the PATO-bound quantitative
      pair, GAIN_OF_FUNCTION is defined here as activation of the same process outside
      regulatory constraints, and DYSREGULATED still reads as a level claim. The sibling
      node ("Loss of Repression of Normal miR-96 Targets") does carry modifier: DECREASED,
      which is honest for that target set.

    miR-96 / CLIC5 cross-entry link (Autosomal_Recessive_Nonsyndromic_Hearing_Loss_103):
    recorded, but NOT as "DFNA50 acts through CLIC5". Established: miR-96 represses CLIC5
    via a conserved 3'-UTR site at nt 760-766 (PMID:22889583), and Clic5 is upregulated in
    the cochlea of miR-183/96/182 cluster-null mice (PMID:30575790). That direction is the
    opposite of DFNB103, which is a CLIC5 loss disease, so the naive convergence claim does
    not follow. Curated as a notes block on the loss-of-repression node plus a
    discussions KNOWLEDGE_GAP (mir96_clic5_direction) naming GSE255796 as the dataset that
    could settle whether CLIC5 moves at all in a seed mutant.

    Four mouse lines in animal_models with modeled_mechanisms: diminuendo (ENU seed),
    Mir96+14C>A and Mir96+13G>A human-allele knock-ins, and the Mir183/96 double knockout.
    Two FAILS_TO_RECAPITULATE links, each with limitations and evidence: the +13G>A
    heterozygote does not reproduce the human dominant phenotype, and the null cannot
    reproduce novel targeting. A HUMAN_MODEL_MISMATCH discussion records the +13G>A
    discrepancy. RESCUES link on the +14C>A line carries both the AAV-SaCas9-KKH editing
    and the amitriptyline arms, with the authors' own proof-of-concept caveat quoted so the
    link cannot read as a therapy claim. ABR/DPOAE threshold readouts use direction
    INCREASED for the mutants (a higher threshold is worse hearing) and RESTORED for the
    editing rescue.

    Deliberately not curated: no treatments block (reasoning in the
    dfna50_no_disease_modifying_therapy discussion - gene editing and amitriptyline are
    preclinical and live on the model link; importing generic SNHL management would attach
    another disease's evidence). No biochemical, histopathology, imaging or clinical_trials
    content - none published for these three families. Audiometric natural history per
    allele, the Italian family's vertigo, and its age-dependent penetrance are in the Solda
    2012 full text, which is not retrievable (PubMed and Europe PMC both abstract-only;
    DOI:10.1093/hmg/ddr493 fetch returns content_type unavailable), so the numbers were not
    taken second-hand.

    Deep research: falcon, one report. preflight-dr against MONDO:0013114 PASSED - MIR96
    mentioned 52 times, no competing gene (next highest was the acronym ABR at 5). The
    report proposed three HPO terms that do not mean what it said: HP:0008527 offered as
    "Postlingual sensorineural hearing impairment" (it is Congenital sensorineural hearing
    impairment), HP:0008607 as "Abnormality of the auditory threshold" (it is Progressive
    conductive hearing impairment), and HP:0000404 which does not resolve. Every term used
    here was resolved through OLS first. The report's clinical detail on the Italian family
    was not used because its underlying source is not quotable from the cache.

    Validation, all exit 0: validate, validate-terms, count-verified-snippets (70/70),
    validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-folded-hyphens, verify-datasets (2/2 OK).

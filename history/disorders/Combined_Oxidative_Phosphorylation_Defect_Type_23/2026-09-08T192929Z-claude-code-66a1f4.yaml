  summary: 'Address PR #11484 review: notes accuracy, GO binding, cardiac omission'
  details: |
    Response to the automated review on PR #11484. Four changes, all accepted findings.

    IMPORTANT 1 - the "Pathograph wiring" paragraph in notes was wrong twice, and the
    reviewer was right on both counts. It claimed every phenotype had an incoming edge when
    strabismus does not, contradicting that phenotype's own notes and the PR body; and it
    said two nodes were PROVISIONAL and then enumerated three. Both corrected. Worth
    recording that the underlying curation was right in each case and only the summary was
    false - which is the more dangerous failure mode, because a summary paragraph is what a
    reader trusts instead of checking.

    IMPORTANT 2 - the notes on the GTPBP3-Specific Metabolic Reprogramming node said "the
    modifier is ALTERED" while the slot carries DYSREGULATED, and ALTERED is not a member of
    ModifierEnum. This is a residue of an earlier draft: the node did originally carry
    ALTERED, schema validation rejected it, the slot was changed to DYSREGULATED and the
    prose was not. Corrected.

    SUGGESTION accepted - the GO binding on the same node moved from GO:0071456 cellular
    response to hypoxia to GO:0031669 cellular response to nutrient levels. The reviewer's
    argument is correct and is the stronger version of the point the note was already making:
    the defining observation in that node is HIF-1 INACTIVATION, so binding a hypoxia-response
    term was semantically inverted, while AMPK activation and PPAR-gamma induction are
    nutrient-sensing responses. The note now records why the hypoxia term was rejected rather
    than only that the binding is imperfect.

    IMPORTANT 3 - cardiac management. The reviewer is right that this is the one unsignalled
    omission, and that it matters more than the signalled ones because the cardiomyopathy is
    what determines outcome in the milder cluster. The omission stands - no source read here
    reports a cardiac intervention in a GTPBP3 patient, and importing standard heart-failure
    or hypertrophic-cardiomyopathy management would assert of these patients a course of care
    recorded only of others - but it is now stated explicitly in the "What is deliberately not
    curated" paragraph, together with what would close the gap.

    Also fixed, from CI rather than the review: two folded-scalar hyphen splits
    (check-folded-hyphens), at "loss-of-/function" and "twelve mild-/phenotype". Both reflowed
    so the compound stays on one line. That gate was not in the per-file check list used
    during curation and should have been run before the first push.

    The three phenotype suggestions (visual impairment, dilated cardiomyopathy,
    hyperalaninemia) are not taken in this round: none has a published numerator, and each
    would add a band resting on a qualitative mention when the entry already carries five such
    bands and flags them as such.

    Re-validated after the changes: just validate (schema, terms, references),
    count-verified-snippets 68/68, check-enum-values, check-folded-hyphens. No cache rows
    changed - GO:0031669 was already present.

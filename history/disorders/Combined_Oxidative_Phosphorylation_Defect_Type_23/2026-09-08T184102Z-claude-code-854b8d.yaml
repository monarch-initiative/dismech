  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 23 (GTPBP3)'
  details: |
    De novo curation of COXPD23 (MONDO:0014525, GTPBP3) from claim issue #11474.

    Scope decision: DISEASE, standalone entry. MONDO:0014525 is a leaf under
    MONDO:0000732 with a single causal gene, and eight other COXPD types and deficiencies
    are already curated as standalone per-gene entries. The stub is deleted.

    The named risk for this curation was duplication of kb/disorders/MTO1_Deficiency.yaml.
    GTPBP3 and MTO1 catalyse the same wobble-uridine taurinomethylation on the same five
    mitochondrial tRNAs, and the two diseases are near-phenocopies separated by sequencing
    rather than by phenotype. Three deliberate measures were taken against it. The
    differential is stated in its own differential_diagnoses block using the founding
    series' own contrast sentence, mirroring the block MTO1_Deficiency already carries in
    the other direction. The cellular asymmetry between the two defects - the
    HIF-PPAR-gamma-UCP2-AMPK axis running in opposite directions, PMID:29348686 - is
    curated as its own pathophysiology node rather than as prose, because it is the only
    known biological difference between them. And every frequency band is taken from the
    GTPBP3 literature's own denominators (11 patients in the 2014 founding series, 20 in the
    2024 review split 8 severe and 12 mild), not from the MTO1 cohort whose numbers would
    have been easy to reuse and would have been wrong.

    Evidence base: nine references, 68 of 68 snippets verified against the local cache, no
    DOI-prefixed references cited so nothing skipped by prefix. The founding series
    (PMID:25434004) is abstract-only in the cache because the publisher returned 403 for the
    full text; the abstract carries the sentences the entry needs, including the MTO1
    contrast. Four snippets from PMID:29348686 sit in an abstract that is hard-wrapped in
    the cache, so they are stored with normalised single spaces and pass the audit through
    its whitespace normalisation rather than as raw byte substrings; this is recorded here
    rather than left for a reviewer to discover.

    Eight pathophysiology nodes run from the biallelic variant through loss of the tRNA
    modification, impaired mitochondrial translation and a combined respiratory chain defect
    to cardiomyocyte and thalamic injury, with the GTPBP3-specific metabolic reprogramming
    branching off the respiratory node. Three nodes are marked PROVISIONAL: the
    reprogramming node because the authors' inference from a measured divergence is
    explicitly hedged, and both tissue nodes because no myocardial or neuropathological
    tissue study exists in any GTPBP3 patient and both accounts rest on model organisms.

    Fourteen phenotypes. One - strabismus - is deliberately left unwired, with the reason in
    its own notes: brainstem involvement would make an oculomotor mechanism easy to assert,
    but the source that reports the strabismus proposes none. Several bands rest on a
    qualitative statement rather than a numerator (arrhythmia, congestive heart failure,
    feeding difficulties, hypotonia, strabismus) and each says so. Lactic acidosis is
    VERY_FREQUENT rather than OBLIGATE despite 11/11 in the founding series, because that
    cohort was ascertained on a phenotype including lactic acidosis.

    Two animal models: the CRISPR gtpbp3 zebrafish knockout, which supplies the cardiac
    tissue-level evidence patients cannot, and the 2026 patient-allele knock-in mice, the
    first mammalian models, in which virus-mediated Gtpbp3 expression reversed the
    mitochondrial pathology. That rescue is curated under animal_models rather than
    treatments and its preclinical status is argued in a KNOWLEDGE_GAP discussion, including
    the point that neither lactate nor MRI predicts severity so a future trial has no
    validated surrogate endpoint.

    A ClinGen trap is recorded in the genetic notes: two live assertions exist for this gene
    (Leigh syndrome spectrum, Moderate, 2020; primary mitochondrial disease, Definitive,
    2024), the later explicitly subsuming the earlier's cases, and a curator who takes the
    first will report a weaker classification against a narrower disease. This entry cites
    the 2024 record. A second trap is a 2026 paper that gives COXPD23 the OMIM number of the
    GTPBP3 gene rather than of the disease; the entry uses 616198 and does not repeat it.

    Validation run: just validate (schema, terms, references), count-verified-snippets
    (68/68), check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-enum-values, check-qualifier-terms, plus the whole-KB snippet ratchets and
    validate-disorders.

    Cache provenance note. The CGGV assertion was rebuilt during this curation because it
    was absent from the committed cache; the ClinGen gene-validity CSV downloaded on
    2026-09-08 no longer matches the sha256 pinned in data/clingen/MANIFEST.yaml, which is
    the ordinary unversioned-URL release drift the manifest documents. The GTPBP3 row is
    unchanged and the assertion is dated 2024-05-23. Repinning is a separate change and is
    not made here. One stray CHEBI row (CHEBI:6566, lunarine) was written into the term
    cache by a validation run against an incorrect binding, was caught, and was reverted
    rather than committed; the correct bindings are (R)-carnitine, vitamin B1 and
    L-ascorbic acid.

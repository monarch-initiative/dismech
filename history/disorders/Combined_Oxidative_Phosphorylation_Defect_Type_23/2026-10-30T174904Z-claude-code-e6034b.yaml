  summary: Merge duplicate conforms_to into the multivalued list form
  details: |
    Resolved a duplicate conforms_to key that only the merge of main could produce. This branch wired the entry's mitochondrial-translation node to mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits; main then wired the same node to primary_oxphos_deficiency#Mitochondrial Translation Defect. Neither side carried both, git merged the two added lines without a textual conflict, and the result was one YAML mapping with two conforms_to keys. PyYAML keeps the last, so every test and renderer saw only main's anchor, while the ruamel-backed reference validator refused the file outright and turned validate-disorders red. Both anchors are kept, as the multivalued conforms_to spelling from dismech#13923 allows, because the node is a genuine instance of both: primary_oxphos_deficiency is the broad monogenic-mitochondrial-disease module whose Mitochondrial Translation Defect node is one of its three lesion classes, and mitochondrial_translation_deficiency decomposes that one lesion class into its own chain. Neither anchor is redundant and main's separate wiring of the downstream OXPHOS Complex Deficiency node is untouched. The specific anchor is listed first. No evidence, term, binding or node was changed.

  summary: 'Gene-family review: GTPBP3'
  details: |
    The GTPBP3 taurinomethyluridine node bound only a process. It now binds GTPase activity (GO:0003924) and tRNA 5-taurinomethyluridine synthase activity (GO:0160236), both DECREASED, supported by its existing evidence that patient variants decrease GTPase activity and tRNA modification (PMID:41957021) and that GTPBP3 catalyses the modification with MTO1 (PMID:25434004). The genetic record gains the entry's autosomal recessive inheritance block (HP:0000007).

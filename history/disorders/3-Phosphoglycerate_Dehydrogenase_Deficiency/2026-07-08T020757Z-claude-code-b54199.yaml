  summary: 'Create: 3-Phosphoglycerate Dehydrogenase Deficiency - PHGDH serine deficiency'
  details: |
    New standalone Disease entry for WP-003 issue 5558 row 1.6.02.01, PHGDH-related 3-phosphoglycerate dehydrogenase deficiency. Anchored to MONDO:0011152 PHGDH deficiency, OMIM 601815, ORPHA 79351. Modeled the serine-biosynthesis block from PHGDH enzyme deficiency to low L-serine and glycine to impaired CNS serine-dependent biosynthesis to hypomyelination and neurodevelopmental impairment, plus core phenotypes, biochemical markers, PHGDH genetics, an infantile and a Neu-Laxova-1 severe subtype, and treatable L-serine with or without glycine supplementation. Seven primary PMIDs; all 29 evidence snippets verified as exact substrings of freshly fetched abstracts. NEC preflight passed against the local MONDO snapshot. Validation via just validate, validate-terms, and validate-references all pass.

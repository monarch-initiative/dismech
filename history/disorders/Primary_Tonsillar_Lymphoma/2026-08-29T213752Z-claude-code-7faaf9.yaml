  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Detailed review of all 66 evidence items against 47 unique cached references (re-reading each cited publication in references_cache/). All snippets were mechanically exact substrings, but the semantic layer had systematic problems; 23 items were edited, 14 removed, 8 added. Removed 7 named-entity-confusion citations: HPV-positive tonsillar squamous cell carcinoma (PMID:36943852) backing lymphoma spread; a canine veterinary study (PMID:32352191, also misgraded HUMAN_CLINICAL) and a testicular-lymphoma study (PMID:20466616) under Stage IV; primary CNS lymphoma (PMID:32725379) under stem cell transplant; tonsil-SCC radiotherapy (PMID:8189757) and Hodgkin ILROG guidelines (PMID:23790512) under radiation therapy; plus off-topic melanoma, histiocytic sarcoma, tongue-lymphoma and periodic-fever fillers. Fixed frequency/evidence contradictions: fever, night sweats and weight loss were FREQUENT while carrying only NO_EVIDENCE/REFUTE items; changed to OCCASIONAL with genuine tonsillar-cohort support (PMID:11338097 systemic symptoms 2/8; PMID:24387945 B symptoms 16 percent, regraded REFUTE to SUPPORT). Radiation therapy previously had zero supporting evidence; now cites PMID:34600539 (SEER overall-survival benefit), PMID:6690005, and a regraded PMID:10592134 item. Removed title-only snippets from the abstract-less PMID:38044117, a quote that explicitly excludes Waldeyer's ring from primary extranodal lymphoma (PMID:9157474) misused as Stage II support, and an invented imaging claim. Downgraded five over-claimed SUPPORT items to PARTIAL and corrected false explanations (invented CHOP regimen; rituximab attributed to a tositumomab paper). Added Waldeyer's-ring dissemination quotes (PMID:3891063) and sore-throat/enlarged-tonsil support. Left unfixed: honest on-disease NO_EVIDENCE fillers, the deprecated percentage field, generic Ann Arbor staging boilerplate, and absent evidence_source fields whose HUMAN_CLINICAL default is correct. Validation: just validate, count-verified-snippets --strict, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length all pass; no baselines touched.

  summary: 'Create: Peroxisome_Biogenesis_Disorder_6B'
  details: |
    De novo curation of MONDO:0013937 (OMIM:614871), the mild band of the PEX10 allelic series, as a standalone Disease entry.

    Lump/split. Curated as its own entry rather than a has_subtypes row on Peroxisome_Biogenesis_Disorder_6A_Zellweger, following the repository precedent set by the two A/B pairs already curated at this granularity (4A/4B and 11A/11B; _1B and _2B are also separate entries, though their A arms remain stubs) and following MONDO and OMIM, which assign the two bands separate identifiers. The decision was recorded on stubs/Peroxisome_Biogenesis_Disorder_6B.yaml in a prior commit (entry_type: DISEASE) before the stub was deleted, so it is auditable separately from the entry.

    Scope. Within the entry the childhood-onset cerebellar-ataxia presentation and the older neonatal adrenoleukodystrophy / infantile Refsum presentation are two has_subtypes rows. Whether the ataxic form belongs under the 6B label at all is contested in the sources: PMID:28320181 frames it as a third subtype alongside Zellweger syndrome and neonatal adrenoleukodystrophy, while PMID:30640048 and PMID:40267090 both assign milder PEX10 patients to PBD6B directly. That disagreement is carried as a CONTROVERSY discussion with evidence on both sides rather than resolved silently. Consequence for the KB: the existing 6A entry carries a differential-diagnosis row for the PEX10 ataxic form written on the three-band reading, and that row and this entry now describe the same patients.

    Evidence. 79 snippets, all exact substrings of fetched references_cache records; 94 reference titles checked. Sources are primary literature (PMID:10862081, 20695019, 27230853, 28320181, 28784167, 30640048, 35038753, 40267090, 19127411, 9683594, 9700193, 35768507), the GeneReviews Zellweger Spectrum Disorder chapter (PMID:20301621, tagged), a treatment-guideline review (PMID:26750748), and one ClinGen gene-disease validity assertion (CGGV assertion c0f7f094, PEX10 / peroxisome biogenesis disorder, Definitive, AR). The ClinGen assertion is made against the grouping concept MONDO:0019234 rather than against MONDO:0013937 and its explanation says so.

    Gaps recorded rather than smoothed over. No numeric prevalence is asserted - no source cited gives a rate or PEX10's share of the spectrum. No animal model is curated: no PEX10-specific model appears in the cited sources. No treatment in the entry has a reported outcome; the bile acid supplement and the phytanic acid restriction are recorded as having been started, with directness INDIRECT and no efficacy claim. Cognitive impairment carries a REFUTE item beside its supporting one, because two of the founding patients had normal intelligence. A KNOWLEDGE_GAP discussion records that the false-negative rate of a peroxisomal screen at this end of the spectrum is unknown.

    Negative searches, re-run immediately before committing. HPO searched through the OLS search API for 'cerebellar ataxia': fourteen hits, no class with that primary label; HP:0001251 Ataxia carries it as an exact synonym, and the labelled alternatives HP:0002073 and HP:0002470 are course-qualified. HP:0002073 was considered and not taken because the reported patients are not uniformly progressive and this repository carries course on clinical_course. NCIT searched through the OLS search API by label for 'surveillance' and 'monitoring': the two plausible candidates NCIT:C15719 and NCIT:C53607 were each checked for hierarchical ancestors and neither has NCIT:C25218 among them, so the multisystem surveillance treatment is left with an unbound treatment_term.

    Deep research. One report, requested provider falcon, which returned HTTP 402 (out of credits); the claude_code fallback produced the report, which is committed as research/Peroxisome_Biogenesis_Disorder_6B-deep-research-claude_code.md with fell_back true and requested_provider falcon in its frontmatter. Its own validation sections record 12/12 references resolved with no confabulation and 39/40 terms resolved. just preflight-dr returned SKIP rather than PASS or FAIL because MONDO records no causal gene for MONDO:0013937 and the automated gene-identity check cannot discriminate; the manual fallback is satisfied - PEX10 is the report's dominant gene at 104 mentions and OMIM 614871 appears in it. No citations sidecar was produced by this run. The report supplied two leads that were then checked against their own primary sources and cited: PMID:35768507 and PMID:40267090. Everything else in the entry was written from the fetched reference cache, not from the report.

  details: |
    De-novo curation of Vici syndrome (MONDO:0009452, EPG5). Deep research run via claude_code provider (19 web searches per run_metadata) but its output serialization truncated on both attempts; research completed via direct PubMed/GeneReviews with every snippet verified against cached abstracts. Unbundled autophagy pathophysiology: EPG5 LoF -> impaired autophagosome-lysosome fusion -> block in autophagic flux with cargo accumulation -> five parallel tissue-specific injury nodes (neuron/CNS, cardiomyocyte, T-cell/immune, skeletal muscle, melanocyte/lens). Cardinal pentad phenotypes + microcephaly/FTT/GDD. GeneReviews (EPG5-Related Disorder, PMID:36228046) tagged. KNOWLEDGE_GAP (fusion-step therapeutics) + HUMAN_MODEL_MISMATCH (Drosophila neuronal-only model) discussions. NOTE: dropped PMID:23649807 as a wrong-paper near-miss (it is about UBXN-2/Aurora A, not EPG5). Validated schema+terms; all 14 snippets verified as exact substrings.

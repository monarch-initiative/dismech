  summary: 'Review: Vici Syndrome evidence, scope, and completeness'
  details: |
    Reviewed the Vici Syndrome entry for disease-entity scope, evidence-to-claim fidelity, causal graph semantics, clinical completeness, and ontology usage. Restricted the entry to classic Vici syndrome rather than the broader EPG5-related disorder spectrum; removed unsupported penetrance and prevalence inferences; corrected frequency, diagnosis, treatment, and variant wording; added evidence-backed hearing, optic atrophy, cardiac, renal, hematologic, antiseizure, cataract-surgery, and Epg5-knockout mouse content; added explicit mechanistic uncertainty; and replaced unsupported causal assertions with evidence-qualified edges or honest graph gaps. A separate read-only agent performed three audit passes, and all findings were addressed. Final validation included schema and term checks, 71/71 exact evidence snippets, reference-cache frontmatter validation, pathograph connectivity review, and the repository disorder test suite.

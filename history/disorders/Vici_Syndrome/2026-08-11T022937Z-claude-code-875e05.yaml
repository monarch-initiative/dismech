  summary: Adopt HP:0010515 thymus union term per review blocker
  details: |
    Resolved the single blocking item from the ai4c-reviewer CHANGES_REQUESTED reviews on PR #8297.

    Thymus phenotype term. The "Thymic aplasia or hypoplasia" phenotype carried HP:0000777 (Abnormal thymus morphology), which also subsumes thymic hyperplasia, cysts and ectopia -- none of which the cited snippet claims. Replaced with the exact union term HP:0010515 (Aplasia/Hypoplasia of the thymus), which maps term-for-term onto the cited statement "Complete thymus aplasia or hypoplasia has been re- ported in around one fifth of patients" (PMID:26927810). preferred_term and the OCCASIONAL frequency band are unchanged; "around one fifth" continues to support OCCASIONAL. Label verified against OAK: `runoak -i sqlite:obo:hp info HP:0010515 -O obo` returns name "Aplasia/Hypoplasia of the thymus", is_a HP:0000777.

    Cache. HP:0010515 was absent from both cache/hp/terms.csv and cache/enums/phenotypeterm_939f99dde0f5.csv. Running the term validator resolved it and appended one row to each, in canonical sorted position with a real retrieval timestamp. Both rows are validator-generated -- no cache file was hand-edited -- and are committed here because deterministic term-validation CI depends on them. `just check-term-cache-integrity` passes (18 term cache files, 24 enum cache files).

    Investigated and deliberately NOT changed: animal model names. A proposed follow-up asked for a required "name" on each of the two animal_models entries. Not applied, because the premise is incorrect. The AnimalModel class in src/dismech/schema/dismech.yaml (line 6117) declares only species, genotype, background, genes, category, alleles, description, associated_phenotypes and evidence -- there is no "name" slot, and the generated JSON Schema forbids additional properties. Adding it was tested empirically and fails schema validation with: Additional properties are not allowed ('name' was unexpected) in /animal_models/0. A KB-wide survey confirms the convention: 229 entries use animal_models and zero carry a "name" key. The two models here remain identified by species plus category (Mus musculus / Epg5 knockout model; Drosophila melanogaster / Autophagy-gene knockdown model). Introducing names would require a schema change, which is out of scope for this evidence-tightening PR.

    Non-blocking reviewer suggestions were deliberately left unaddressed so the entry can be frozen for a fresh independent audit: re-parenting the orphaned Seizures phenotype via an INDIRECT_UNKNOWN_INTERMEDIATES edge from the CNS neurodevelopmental node, the parallel Feeding difficulties / Hypotonia link, and restoring the second thyroid snippet alongside the current one.

    Validation run on the changed file: `just validate kb/disorders/Vici_Syndrome.yaml` -> schema "No issues found", terms "Validation passed", references "All validations passed" with "Snippets checked: 95/95 verified against cached references".

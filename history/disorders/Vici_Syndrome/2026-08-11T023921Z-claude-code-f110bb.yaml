  summary: Name both animal models after integrating main's AnimalModel schema
  details: |
    Integrated current main into PR #8297 and brought the entry's animal models up to the schema that merge introduced.

    Branch refresh. PR #8297 was refreshed solely through the GitHub update-branch API, guarded with expected_head_sha 469180dd90778d7190d20d16d9f0be94ce78d027, producing server-side merge commit 6d1e0fd1ef9aea7be609f85b64ba4f995629a88c ("Merge branch 'main' into agent/vici-audit-followup", first parent 469180dd90). This recovery branch was then set to track origin/agent/vici-audit-followup and advanced with git pull --ff-only. No local rebase or merge was performed at any point; the merge exists only as the one GitHub created.

    Animal model names. Current main reworked the AnimalModel class: it now carries name, publication, modeled_mechanisms and notes, and the class-level comment describes name as "optional but recommended". That comment is misleading -- the global name slot is declared identifier: true (src/dismech/schema/dismech.yaml:2471), which makes it required in the generated JSON Schema, and slot_usage recommended: true does not relax that. Immediately after the fast-forward the entry was therefore invalid under the integrated schema, failing with "'name' is a required property" at /animal_models/0 and /animal_models/1. Two precise names were added, following the slot_usage example style ("SOD1-G93A transgenic mouse") and grounded in the entry's own cited snippets:
    - "Epg5-null knockout mouse" (Mus musculus; snippet reads "The phenotype of epg5-/-KO mice recapitulates the autophagy defect and the skeletal muscle myopathy seen in humans with Vici syndrome").
    - "epg5 (CG14299) RNAi knockdown Drosophila" (Drosophila melanogaster; snippet reads "downregulation of epg5 (CG14299) in Drosophila resulted in autophagic abnormalities and progressive neurodegeneration").
    Both are short, stable, mutually distinct labels suitable for use as pathograph node labels and in-page anchors. No other field of either model was touched; modeled_mechanisms was deliberately not populated, since wiring the models into the pathograph is a content change beyond this evidence-tightening PR and would pre-empt the pending audit.

    Supersedes the note in history record 2026-08-11T022937Z-claude-code-875e05.yaml, which recorded that AnimalModel had no name slot and that adding one failed validation. That was accurate against the pre-merge schema on this branch and is left unmodified per append-only policy; main has since added the slot and made it required, so the finding no longer holds.

    Repo-wide observation, not addressed here: this schema change left 429 of 437 animal_models entries across 225 KB files without the now-required name. CI validates only the disorder files changed in a PR, so that breakage is latent on main and surfaces only when an affected entry is next touched, exactly as it did here. Flagged for a separate backfill rather than fixed in this PR.

    Validation under the integrated schema: just validate-disorders kb/disorders/Vici_Syndrome.yaml -> schema "No issues found", terms "Validation passed", references "All validations passed" with "Snippets checked: 95/95 verified against cached references". pytest tests/test_render_animal_model_links.py -> 4 passed. pytest tests/test_data.py -k "history or term_cache or animal" -> 4097 passed. No cache delta was produced by this change; HP:0010515 was already cached by the preceding commit.

  details: |
    Review round on the CD3E entry. Added three phenotypes that the description and the Failure of Cellular Immunity node already named in prose but that were collapsed into HP:0005390: oral candidiasis (HP:0009098), persistent diarrhea (HP:0002014), pneumonia (HP:0002090). None carries a frequency band. The counts come from a T-B+ SCID cohort in which JAK3 predominates and CD3E accounts for one patient, so the cohort proportion is a frequency for that mixed genotype set rather than for this disease; each notes block says so, matching how Failure to thrive was already handled in this file. Also added protective isolation and anti-infectious prophylaxis as a supportive treatment, the holding measure before transplant, quoted from the PIDTC 2022 SCID definitions full text. Its therapeutic_modality is deliberately absent because the bundle spans a non-pharmacological measure and drug prophylaxis while the enum is single-valued. One defect of my own caught by validation: I wrote the reference_title for PMID:36456361 from memory and it was a different paper's title; corrected from the cache frontmatter.

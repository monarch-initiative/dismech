  summary: Regrade PIDTC evidence to OTHER
  details: |
    Second review round. The reviewer found that PMID:36456361, the PIDTC 2022 consensus definitions paper, was graded HUMAN_CLINICAL on the two evidence items I added for the supportive-care treatment, while the same file grades it OTHER in the diagnosis section and its own notes block states that the IUIS classification table and the PIDTC consensus definitions are OTHER because neither reports primary study data. The finding is correct and the error was mine. Both items regraded to OTHER. Worth noting for the gate: check-snippet-grading is keyed on the quoted sentence, so it cannot catch one paper graded two ways across two different sentences, which is exactly the shape of this defect.

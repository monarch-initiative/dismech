  summary: 'Create: Immunodeficiency 18 (CD3E deficiency, MONDO:0014278)'
  details: |
    De novo curation of immunodeficiency 18 (CD3E) from the stubs/ queue, claim issue #10462. entry_type recorded as DISEASE: one conserved pathograph (loss of CD3epsilon -> failed pre-TCR/TCR assembly -> blocked beta-selection -> thymocyte arrest), with a second, genotype-dependent hypomorphic branch curated explicitly rather than flattened away.

    Boundary with the sibling entry Combined_Immunodeficiency_Due_To_CD3gamma_Deficiency (curated 2026-08-28): that entry confined the CD3delta/epsilon/zeta literature to differential_diagnoses to protect the CD3gamma entity; here that literature is primary. Both sides cite the same sentence from PMID:16264327 - homozygous CD3D/CD3E mutations block T-cell development, in contrast with the partial immunodeficiency of CD3G. This entry adds only that CD3epsilon deficiency is not uniformly complete, and states that the hypomorphic presentation is separated from CD3gamma deficiency by the gene rather than by immunophenotype. The CD3gamma entry was read but not edited.

    Severity spectrum modelled as two branches off the variant node rather than as a single severity claim: a null branch (Loss of the CD3epsilon Chain -> ... -> Absent Peripheral T Cells) and a hypomorphic branch (Residual Unstable CD3epsilon in Partial Deficiency -> Reduced Surface TCR/CD3 with Impaired T-Cell Activation), both converging on Failure of Cellular Immunity. The hypomorphic branch rests on the original 1992/1993 family (PMID:1370449, PMID:8490660).

    Two discussions: HUMAN_MODEL_MISMATCH on the arrest stage, which in humans was never measured (PMID:15546002 states no thymus material was available) and is carried over from the Cd3e-null mouse; and a KNOWLEDGE_GAP on whether residual protein predicts course.

    Deep research: Falcon report research/Immunodeficiency_18-deep-research-falcon.md, preflight-dr PASS against MONDO:0014278 (CD3E mentioned 77 times, top gene). Used as leads only; every snippet re-verified against its cached reference. Two DR leads were dropped for lack of a resolvable citation.

    Validation (all exit 0): just validate (schema, terms, 64/64 snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, plus the whole-KB advisory gates. NCIT:C16360 was drafted for newborn screening and corrected to NCIT:C81178 after OLS resolved C16360 to 'Book'.

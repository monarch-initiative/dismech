  summary: Ground the NSCLC organ-chip TKI readout in GO
  details: |
    Added a biological_processes grounding (GO:0007169, cell surface receptor protein tyrosine kinase signaling pathway) to the 'Tyrosine kinase inhibitor therapeutic response' readout on the human orthotopic NSCLC lung organ-on-chip experimental_models entry (PMID:29020635), which PR #9665 added ungrounded. The readout interpretation already attributes the mechanical modulation of TKI response to EGFR and MET signaling; the GO term makes that machine-queryable and matches the grounding already carried by the target pathophysiology node Oncogenic Driver Mutations. The relationship on that link was reviewed and deliberately left as MEASURES: the abstract reports lung cancer cell lines carrying incidental drivers in a reconstituted microenvironment and never claims to reproduce a driver lesion, so the chip reads the node out rather than instantiating it. No other content changed. Schema and term validation pass.

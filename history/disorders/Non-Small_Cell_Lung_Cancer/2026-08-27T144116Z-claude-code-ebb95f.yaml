  summary: 'Add experimental_models NAM record: lung organ-chip'
  details: |
    Recorded the Wyss Institute human lung organ-chip (PMID:29020635) as a structured experimental_models entry with three pathograph links: Oncogenic Driver Mutations (MEASURES), Tumor Microenvironment Remodeling (PARTIALLY_RECAPITULATES) and Metastasis (PARTIALLY_RECAPITULATES, LOW fidelity), each carrying fidelity, limitations and readouts with their own evidence. The organ-chip evidence item was already cited on the Targeted Therapy treatment, so no new mechanistic claim is introduced; the gap this closes is structural, since without modeled_mechanisms the model was invisible to the pathograph. Limitations state explicitly that only EGFR and MET were implicated (not the ALK/ROS1 arms), that the microenvironment modelled is epithelial and mechanical with no immune or fibroblast compartment, and that only the local invasive step of metastasis is represented. Schema, term, entity-ref, duplicate-key and all four snippet gates pass; snippets re-verified as exact whitespace-normalized substrings of the cached abstract.

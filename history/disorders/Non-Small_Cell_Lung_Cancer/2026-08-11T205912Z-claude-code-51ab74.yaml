  details: |
    Curated from the preprint surfaced in issue #6066 (PPR:PPR1273960, PD-1 inhibitor outcomes in Xuanwei NSCLC). Added an 'environmental:' entry for household smoky (bituminous) coal combustion (ECTO:7000004) with an influences_mechanisms edge to the existing 'Oncogenic Driver Mutations' node, typed TRIGGERS / INDIRECT_KNOWN_INTERMEDIATES because the PAH-activation and adduct-bypass intermediates are established chemistry not modelled as nodes here, and because the Xuanwei-specific attribution rests on mutational-signature inference. Peer-reviewed support: PMID:22936785 (smoky vs smokeless coal cohort), PMID:36921559 (methylated PAH exposure-response), PMID:26288819 (C:G to A:T transversion spectrum), PMID:39432560 (BaP signature, EGFR-G719X hotspot). Added a KNOWLEDGE_GAP discussion asking whether the higher tumour mutation burden of Xuanwei NSCLC (PMID:33889543) actually causes the higher disease control rate reported in the preprint, with a proposed TMB/signature-stratified prospective cohort. Per the preprint-scan policy the PPR reference is cited only inside the discussion, marked PARTIAL, and is not the sole support for any claim; no mechanism edge was created from it. Validation: 'just validate' passed (schema + terms + references), reporting 'Snippets checked: 132/132 verified against cached references'; 'just validate-terms' passed separately. Unrelated references_cache YAML-quoting churn produced by the validator was reverted and not committed.

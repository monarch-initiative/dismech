  summary: 'Create: Glycosylphosphatidylinositol_Biosynthesis_Defect_15'
  details: |
    New entry for GPIBD15 (MONDO:0060627, GPAA1). Deep research: falcon was requested but failed with an Edison authentication error (503 Failed to authenticate) on two attempts; the justfile in this checkout has no dr_fallback option, so the claude_code provider was run explicitly instead. Its report resolved all 14 references but 3 of 6 quoted sentences did not match the cited source, so no quote was taken from the report; every snippet was copied from the cached abstract or full text. Two of the report's claims were confirmed against source before use: no patient carries two null alleles (PMID:34703884, basis for PARTIAL_LOSS_OF_FUNCTION) and the GPAA1 D250A result (PMID:34576938). Primary sources: Nguyen 2017 (PMID:29100095), Castle 2021 full text (PMID:34703884), Fontana 2023 (PMID:37510348), Ouyang 2026 pooled 24-patient review (PMID:42001530), plus transamidase biochemistry (PMID:34576938, 38963495). Kept out of phenotypes and recorded in notes: single-case periodic fever (PMID:38112147) and the heterozygous familial vascular-anomaly pedigree (PMID:32533362). No GeneReviews chapter exists. Also added the entry to the Disorders_of_GPI_Anchor_Biosynthesis grouping, widening its NECESSARY criterion from GO:0006506 to its parent GO:0180046 (GPI anchored protein biosynthesis), because the GPAA1 lesion is in the attachment step (GO:0016255), a sibling of GO:0006506; all seven existing members still satisfy it, and the closure cache was rebuilt. A fresh-context self-review before the PR led to: reference_title on every evidence item; delayed myelination, thin corpus callosum, absence seizures and epileptic spasms added from Castle 2021; osteopenia Z score corrected to -2.3; flow-cytometry description narrowed to CD16 as the consistent marker; cerebellar node renamed from Progressive to Acquired Cerebellar Degeneration (atrophy was stable from 21 to 29 years in one patient); the Piga Nestin-Cre mouse (PMID:32179897) added as indirect model-organism evidence; an EMERGING osteoblast alkaline phosphatase hypothesis group tagged on the bone branch; seizure-type frequency denominators stated as not given in the abstract. Validation: just validate-disorders, 62/62 snippets verified, check-reference-titles, check-entity-refs, check-causal-targets, check-groupings (8/8 satisfied), validate-grouping-batch. After the PR opened, CI's gene-activity grounding gate failed because the GPAA1 node named no molecular function; GO:0003923 GPI-anchor transamidase activity (DECREASED) was bound there, following the PIGQ entry's treatment of a non-catalytic complex subunit, and the grouping's MONDO note was corrected to list the six members that descend from MONDO:0024321. All 26 CI whole-repo gates then passed locally.

  summary: 'Address review on PR 14716: drop unsupported hearing edge, tighten snippets'
  details: |
    Removed the Abnormal Craniofacial and Axial Morphogenesis -> Mixed hearing impairment edge: its only evidence (PMID:30194892) reports mixed hearing loss in the siblings but states no mechanism, and skeletal morphogenesis cannot explain a sensorineural component; the phenotype is left unconnected. Restored the hearing snippet to the hearing-only clause ending at (Figure 1C) and cut the alopecia snippet to the alopecia sentence. Marked the two ectodermal edges (Alopecia, Thickened skin) directness INDIRECT, since both cite the authors' Discussion interpretation, and softened their descriptions to match the quote. Added MONDO:0008885 exact synonyms from OLS (plus the related synonym branchio-skeleto-genital syndrome, already used in the description). Validated with just validate, validate-terms, count-verified-snippets (28/28) and check-folded-hyphens.

  summary: Backfill infectious_agent bindings and transmission (#10115)
  details: |
    Bound the three species-level agents to NCBITaxon terms read from lookups: Toxoplasma gondii NCBITaxon:5811, Treponema pallidum NCBITaxon:160 (species level, since the entry names the species and not a subspecies), Mycobacterium tuberculosis NCBITaxon:1773. Replaced the umbrella agent 'Human herpesviruses and other neurotropic viruses' - the granularity defect itself, since no taxon covers it - with three individually bound agents: Human cytomegalovirus NCBITaxon:10359, Herpes simplex virus NCBITaxon:10298 (HSV-1, the predominant type), and Varicella-zoster virus NCBITaxon:10335. Both of the umbrella's evidence items were preserved verbatim on the successor agents with their original gradings, and the cytomegalovirus description now records that other neurotropic viruses cause posterior uveitis more rarely and are not separately curated here, so that claim is not lost. Added a transmission block with five routes: foodborne/waterborne ingestion of T. gondii (PMID:38843299), congenital transplacental transmission of T. gondii (PMID:35874584, newly fetched), sexual transmission of T. pallidum (PMID:33845020), haematogenous seeding of the choroid from a pulmonary tuberculous focus (PMID:38916325, newly fetched), and perinatal/close-contact/parenteral acquisition of the herpesviruses followed by reactivation (PMID:28012878). New evidence items quoting a review's synthesis are graded OTHER with quote_role REVIEW_SYNTHESIS, and items quoting a study's background statement of human epidemiology are graded HUMAN_CLINICAL with quote_role BACKGROUND. Validated with just validate, just count-verified-snippets (152/152 verified), and the batched just validate-disorders sweep.

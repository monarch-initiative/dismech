  details: |
    Backfill for issue #8085. Four links across three exposures, distributed across both arms of this entry's aetiologic fork. Ocular penetrating trauma takes two edges into the non-infectious arm from one sentence: into autoimmune recognition of ocular self-antigen, which already names sympathetic ophthalmia as its worked example of lost antigen sequestration, and into granulomatous choroidal inflammation, since the same sentence describes the resulting entity as granulomatous rather than as a generic infiltrate. The first is graded PARTIAL because the sentence fixes the exposure and the disease without reaching the T cell recognition event; the second is SUPPORT because granulomatous is the word the sentence itself uses. Endemic residence and immunocompromise both point at pathogen invasion and persistence in the infectious arm, and are separated on the effect axis: residence PREDISPOSES, since it is an ecological proxy for meeting the organism, while immunocompromise EXACERBATES, since impaired immunity permits the organism to grow rather than causing it to arrive. Immunocompromise was deliberately NOT pointed at this entry's unopposed-immunosuppression node, which is a distinct claim: that node models iatrogenic immunosuppression given for a misdiagnosed infection, whereas this exposure is host immunocompromise however arising. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 143 of 143 verified.

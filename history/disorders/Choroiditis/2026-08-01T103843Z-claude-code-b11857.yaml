  summary: 'Create: Choroiditis (MONDO:0001280)'
  details: |
    Created the Choroiditis entry (MONDO:0001280) as an umbrella over the infectious and non-infectious causes of choroidal inflammation. The organising principle is the infectious-versus-non-infectious aetiologic fork, modelled as real pathophysiology nodes (Aetiologic Fork -> Pathogen Invasion and Persistence / Autoimmune Recognition of Ocular Self-Antigen) plus an explicit harm node, Unopposed Immunosuppression of Unrecognised Infectious Choroiditis, because corticosteroid and immunosuppression are the mainstay of the non-infectious arm and are hazardous in unrecognised infectious disease. Both arms converge on choriocapillaris hypoperfusion, outer-retinal/RPE damage, chorioretinal scarring and inflammatory choroidal neovascularization. Ten subtypes are modelled (ocular toxoplasmosis, tubercular/serpiginous-like, syphilitic, POHS, birdshot, MFCPU, PIC, serpiginous, sarcoid, sympathetic ophthalmia). The HLA-A29 birdshot association is evidenced with 95.9 percent carriage from PMID:3341436, the strongest-HLA-association statement from PMID:25434765, ERAP1/ERAP2 modifiers and the peptide-threshold mechanism from PMID:34727153, and allele dosage from PMID:39570638. Deep research used the falcon (Edison) provider; the run returned only nine unique DOIs and two of its quantitative claims (an HLA-A29 odds ratio of 157.5 and a 40 percent contralateral recurrence figure) could NOT be verified in the cited abstracts and were discarded. The evidence base was therefore rebuilt largely from independent PubMed E-utilities searches. Boundary handling cross-references rather than duplicates Sarcoidosis, Neurosarcoidosis, Tuberculosis, Behcets_Disease, Vogt-Koyanagi-Harada_Disease, Panuveitis and Cytomegalovirus_Retinitis. Validation: just validate passes, term validation passes, reference validation reports 137 of 137 snippets verified with zero skipped, compliance-connectivity reports no unconnected phenotypes and no unwired causal genes, weighted compliance 92.5 percent. A self-review pass caught and fixed a spliced snippet, two SUPPORT-to-PARTIAL downgrades, a false ontology-gap claim (UBERON:0005336 capillary layer of choroid does exist), a misleading secondary-syphilis binding, and two context-only differential snippets.

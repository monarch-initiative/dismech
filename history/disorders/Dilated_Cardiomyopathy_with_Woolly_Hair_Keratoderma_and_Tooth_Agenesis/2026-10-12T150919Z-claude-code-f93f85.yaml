  summary: 'Create: Dilated_Cardiomyopathy_with_Woolly_Hair_Keratoderma_and_Tooth_Agenesis'
  details: |
    New entry for the autosomal dominant DSP cardiocutaneous syndrome MONDO:0014355 (OMIM 615821). Lump/split: kept separate from Carvajal_Syndrome (recessive biallelic DSP truncation, MONDO:0011581) and DSP_Cardiomyopathy (heterozygous DSP loss-of-function arrhythmogenic cardiomyopathy, MONDO:0011831), because the literature defines this disease by heterozygous, mostly de novo, missense or in-frame variants in spectrin repeat 6 of the DSP plakin domain with tooth agenesis (PMID:20940358, PMID:22949226, PMID:28649555, PMID:35574671). MONDO lists erythrokeratodermia-cardiomyopathy (EKC) syndrome as an exact synonym (the former MONDO:0018774 is obsolete and merged here; Orphanet 476096), so EKC syndrome (PMID:26604139, de novo Q616P/H618P/L622P) is curated as a has_subtypes entry with its own subtype-stratified phenotypes. Pathograph: SR6 variant to epidermal desmosome aggregation, loss of suprabasal adhesion and reduced connexin 43 junctional localization (conforming to desmosomal_adhesion_failure nodes), a provisional myocardial desmosome node leading to progressive ventricular dilation (conforming to cardiomyopathy_maladaptive_remodeling) and ventricular electrical instability, and a provisional tooth-development node; 19 of 21 phenotypes causally connected. No frequencies recorded because no source has more than three patients. One openscientist deep-research report was used: 28/28 references resolved, 0 off topic; term validation flagged three mislabelled CURIEs (none bound here). Its body conflates this dominant disease with recessive Carvajal syndrome and DSP-ERADOS dominant LoF cardiomyopathy (states inheritance is predominantly autosomal recessive), so its inheritance, Wnt-mechanism and cohort claims were not used; it contributed only cross-confirmation of PMID:20940358 and the pointer to PMID:26833927 (no abstract, not quoted). just preflight-dr could not run because the local MONDO build is absent and was not downloaded; the named-entity check was done by reading the report. Validation: validate, validate-terms, count-verified-snippets (67/67), entity-refs, causal-targets, duplicate-keys, qualifier-terms, genereviews (no chapter), coarse-phenotypes, snippet-length passed; validate-disorders passed (schema, terms, 67 snippets).

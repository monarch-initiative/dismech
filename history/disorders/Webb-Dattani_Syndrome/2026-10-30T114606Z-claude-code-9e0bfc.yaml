  summary: 'Create: Webb-Dattani Syndrome'
  details: |
    De novo creation of Webb-Dattani Syndrome (WEDAS, MONDO:0014404), biallelic ARNT2 loss of function (hgnc:16876, verified via sqlite:obo:hgnc lookup). Source: Perplexity sonar-deep-research report (research/Webb-Dattani_Syndrome-deep-research-perplexity.md); every CURIE/snippet re-verified from live lookups and the local reference cache, not from the report. Curated the ARNT2 LOF -> NMD/protein loss -> failed SIM1-ARNT2 heterodimeric transcription -> hypothalamic neurosecretory neuron differentiation failure causal chain, branching to forebrain, visual-pathway and renal/urinary-tract development; 20 phenotypes (central DI, ACTH/TSH/GH/gonadotropin deficiencies, panhypopituitarism, anterior pituitary hypoplasia, secondary microcephaly, GDD, seizures, spastic tetraplegia, delayed myelination, thin corpus callosum, cerebral visual impairment, hydronephrosis, VUR, neurogenic bladder, cryptorchidism, hip dislocation, GERD); AR inheritance (HP:0000007); hormone-replacement treatments (desmopressin, hydrocortisone, levothyroxine). Thin-literature disease (a few consanguineous families): three on-topic references used - Webb et al. 2013 (PMID:24022475, delineating six-patient family, full text), Hosoya et al. 2001 Arnt2-knockout mouse (PMID:11318878, MODEL_ORGANISM, abstract) for the obligate SIM1-ARNT2 mechanism, and a 2025 17-year survival follow-up (PMID:41363294). Heterozygous-ARNT2 obesity/hypomorph literature deliberately excluded as off-topic. No GeneReviews chapter exists (checked against committed Bookshelf index). Validation: just validate, validate-terms, count-verified-snippets (64/64), validate-disorders all passed; entity-refs, causal-targets, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, block-scalar-comments, snippet-grading all clean.

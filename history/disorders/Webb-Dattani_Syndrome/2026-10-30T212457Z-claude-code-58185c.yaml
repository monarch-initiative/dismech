  summary: 'Review round 1: add missing phenotypes and diagnosis'
  details: |
    Addressed the first review using the cached full text of PMID:24022475 and the PMID:41363294 abstract. Added phenotypes for obesity (HP:0001513), frontal lobe hypoplasia (HP:0007333), temporal lobe hypoplasia (parent HP:0034221, no hypoplasia term found in OLS), thin pituitary stalk (parent HP:0034977), absent posterior pituitary bright spot (parent HP:0011751, since the source does not say ectopic or absent) and sepsis (HP:0100806); each parent binding carries a notes line with the OLS searches run. Wired obesity, stalk and bright spot from the hypothalamic neurosecretory node and the two lobe phenotypes from the forebrain node. Added a diagnosis section: exome sequencing, hypothalamo-pituitary MRI, visual evoked potentials, and the biochemical diagnosis of central diabetes insipidus. Replaced the Arnt2 lethality snippet on the hypothalamic node with the neurosecretory-neuron loss snippet. Fixed the creation record's PR and issue links. Not taken: the animal_models entry and the edge re-sourcing suggestions.

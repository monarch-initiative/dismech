  summary: Add MUC1 peptide-vaccine immunoprevention treatment
  details: |
    Added a MUC1 Peptide Vaccine investigational-immunoprevention treatment, motivated by the NCI TACPAD meeting report (Schoen session) used as a lead source only. Evidence from the PRIMARY randomized placebo-controlled prevention trial Schoen et al., Clin Cancer Res 2023 PMID:36892581. therapeutic_modality VACCINE; target_mechanisms INHIBITS the Adenoma-Carcinoma Sequence node, modeled honestly: the vaccine was immunogenic only in recipients but did NOT significantly reduce adenoma recurrence overall (supports:PARTIAL), with a 38% absolute reduction confined to immune responders. Validated with just validate, just validate-terms, and batched just validate-disorders. No causal snippet drawn from the secondary meeting report.

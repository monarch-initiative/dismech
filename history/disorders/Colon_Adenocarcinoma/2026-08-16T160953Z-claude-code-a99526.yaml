  summary: Add aspirin and GUCY2C-agonist chemoprevention plus GUCY2C tumor-suppressive
    node
  details: |
    Added colorectal chemoprevention/interception content, motivated by the NCI TACPAD meeting report (Miller & Mohammed, J Cancer Prev 2023;28:24-28) used as a lead source only. New pathophysiology node GUCY2C Tumor-Suppressive Axis Silencing (GO:0007168 receptor guanylyl cyclase signaling pathway, DECREASED; downstream to Adenoma-Carcinoma Sequence). Two treatments: Aspirin Chemoprevention (SMALL_MOLECULE, acetylsalicylic acid CHEBI:15365, INHIBITS Adenoma-Carcinoma Sequence) evidenced by the Baron et al. NEJM 2003 randomized adenoma-prevention trial PMID:12621133; and GUCY2C Agonist Investigational Chemoprevention (PEPTIDE, linaclotide CHEBI:68551, RESTORES the GUCY2C node) evidenced by Weinberg/Waldman Cancer Prev Res 2017 PMID:28396341, whose honest formulation limitation is preserved as a PARTIAL evidence item. Validated with just validate, just validate-terms, and the batched just validate-disorders sweep 40/40 snippets over both files. No causal snippet was drawn from the secondary meeting report.

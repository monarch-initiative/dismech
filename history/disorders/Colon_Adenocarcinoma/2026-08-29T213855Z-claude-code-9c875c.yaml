    # Evidence review: Colon_Adenocarcinoma.yaml

    ## Stats
    - Evidence items checked: 21 (pathophysiology, phenotypes, histopathology, treatments incl. target_mechanisms)
    - References read: 11 (PMID:8055224, PMID:19092804, PMID:28396341, PMID:35613396, PMID:42322147, PMID:28548122, PMID:24418853, PMID:17008531, PMID:29754777, PMID:12621133, PMID:36892581)
    - Verified clean: 21 (no edits required); mechanical snippet check verified all (part of 120/120 batch)

    ## Findings
    1. Location: phenotypes Anemia (line ~87), Hematochezia (~102), Abdominal Pain (~117) and treatment "Surgical Resection" (~275); reference PMID:35613396. Problem: the cited case report is a colonic **adenosquamous** carcinoma — explicitly a different, rare histologic subtype from the adenocarcinoma this entry models (the abstract itself contrasts them) — so the presenting-symptom and resection evidence is borderline Named Entity Confusion at the histology level. Mitigations already in place: all four items are graded PARTIAL and the explanations are generic ("presenting feature of colon cancer"). Additionally the `frequency: FREQUENT` on all three phenotypes has no quantitative support anywhere (a single case report cannot ground a frequency band). Severity: MINOR. ACTION: reported only — no better quote exists in this reference; the right remedy is a colon-adenocarcinoma symptom-frequency source, which is outside the conservative fix scope.
    2. Location: pathophysiology "APC Loss in Intestinal Stem Cells" (line ~41); reference PMID:19092804. Problem: none — this is a model item: mouse Lgr5/Apc study tagged MODEL_ORGANISM with supports: PARTIAL for the human-disease claim, exact quote. Severity: NOTE (exemplary). ACTION: none.
    3. Location: pathophysiology "Adenoma-Carcinoma Sequence" (line ~27); reference PMID:8055224. Problem: 1993 narrative review with no `evidence_source` (defaults HUMAN_CLINICAL); OTHER would arguably classify the review better, but the repo default convention tolerates the omission and the quote directly states the claim. Severity: NOTE. ACTION: reported only.
    4. Location: histopathology "High-grade tumor budding" items 3-4 (lines ~163-178); reference PMID:28548122 (ITBCC consensus). Problem: `evidence_source: HUMAN_CLINICAL` for a consensus-conference paper; the quoted statements are GRADE-backed consensus over patient outcome data, so HUMAN_CLINICAL is defensible, though OTHER (consensus) is arguable. Severity: NOTE. ACTION: reported only — not plainly wrong.
    5. Location: treatment "MUC1 Peptide Vaccine" INHIBITS edge (line ~399); reference PMID:36892581. Problem: none — noteworthy positive: a nominally favorable subgroup quote ("a 38% absolute reduction...") is graded PARTIAL with an explanation that spells out non-significance (P = 0.08; ITT P = 0.25) and labels the edge non-confirmatory. Matches the cached trial exactly. ACTION: none.
    6. Location: treatment "GUCY2C Agonist" (line ~364) and its RESTORES edge; reference PMID:28396341. Problem: none — quotes exact from the full-text cache; the failed-formulation limitation is carried as PARTIAL on the entry-level item. The RESTORES-edge quote (Ki67 reduction with GUCY2C activation) is graded SUPPORT, which is fair for the mechanism claim while the entry-level PARTIAL carries the delivery caveat. ACTION: none.
    7. Location: histopathology "Poorly differentiated clusters" and "Tumor-infiltrating lymphocytes (Immunoscore)"; references PMID:24418853, PMID:17008531, PMID:29754777. Problem: none — exact quotes (Immunoscore quote verified against the cache full text), correct grading, explanations match the studies' designs (3243-case multicenter review; Science 2006 cohort study; international validation). ACTION: none.

    ## Sections reviewed
    pathophysiology (incl. downstream edge), phenotypes, histopathology, treatments (incl. target_mechanisms), datasets (no evidence blocks), gene_sets (no evidence)

    ## Verdict
    This is a carefully curated entry: quotes are exact, supports-grading is unusually honest (PARTIAL used correctly for a mouse study, a negative-overall trial subgroup signal, and a formulation-limited chemoprevention study, each with limitation-aware explanations). The one weakness is the three presenting-symptom phenotypes plus the surgery item all resting on a single case report of adenosquamous carcinoma — a different histologic subtype — with unquantified FREQUENT frequency bands; replacing that source with a colon-adenocarcinoma cohort reference would resolve the entry's only substantive gap.

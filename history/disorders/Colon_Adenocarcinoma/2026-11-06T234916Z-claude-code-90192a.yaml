  details: |
    Added an experimental_models ORGAN_ON_CHIP entry for the patient-derived colorectal cancer organ-on-a-chip (PDOC) platform of Zhou et al. (DOI:10.1002/btm2.70190, Bioeng Transl Med 2026), curated as a functional precision-oncology resource for predicting chemotherapy response in locally advanced CRC. modeled_mechanisms: MEASURES on 'WNT and RAS Pathway Cooperation' (the node's therapy-response facet; FOLFOX vs FOLFIRI stratification, with a preliminary 7-month disease-free clinical correlation) and RECAPITULATES on 'Adenoma-Carcinoma Sequence' (high-fidelity histological concordance with the parental tumour). Evidence quotes the abstract verbatim (abstract_only cache); IN_VITRO for chip readouts, HUMAN_CLINICAL for the follow-up correlation. Validated with just validate-disorders (54 snippets, 0 issues), model-scale-audit (2 links seen), and the offline kb gates incl. check-snippet-grading.

  summary: Rebind TIL histopathology finding_term to NCIT:C35980; document HP:0025461
    fallbacks
  details: |
    Applied the unaddressed CHANGES_REQUESTED item from PR #6529, which was merged on
    2026-08-07 without it.

    The "Tumor-infiltrating lymphocytes (Immunoscore)" histopathology finding carried
    finding_term HP:0025461 "Abnormal cell morphology". That is a category mismatch, not
    merely a too-general term: the finding is the density and location of a
    morphologically normal lymphocyte population, not an anomaly of cell structure.
    Rebound to NCIT:C35980 "Chronic Inflammatory Infiltrate", whose NCIT definition
    ("A morphologic finding indicating the presence of reactive lymphocytes,
    lymphoplasmacytic cells, and/or reactive plasma cells in a tissue sample") covers
    the observed infiltrate. This is the same binding already used for the directly
    analogous intratumoral lymphocytic infiltrate in Testicular_Seminoma.yaml.

    Independently re-checked NCIT via OLS before rebinding rather than taking the
    review at face value. No morphologic-finding term exists for a present or dense TIL
    population: NCIT:C12546 is a cell type, NCIT:C160833 asserts the inverse of this
    finding, NCIT:C160832 is a CRF question, and NCIT:C204678 is a count measurement.
    NCIT also has no tumor-budding term and no poorly-differentiated-cluster or
    Grade(PDC) term.

    Added notes to all three findings recording those ontology gaps and the reasoning:
    HP:0025461 remains defensible for tumor budding and PDCs, which genuinely are
    cell-arrangement and differentiation findings, but not for TILs.

    No evidence item, snippet, PMID, or claim text was changed; this is a term-binding
    and documentation edit only.

    Validation run on the changed file: just validate (14/14 snippets verified),
    just validate-terms, just count-verified-snippets (14/14), just check-duplicate-keys,
    and the batched pre-PR sweep just validate-disorders. NCIT:C35980 was already
    present in both cache/ncit/terms.csv and the histopathologyfindingterm enum cache,
    so the change produced no cache diff.

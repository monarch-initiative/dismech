  summary: 'Review and enhance: BMP4-Related Ocular Growth Disorder'
  details: |
    Enriched BMP4 Haploinsufficiency with GO:0008083 (growth factor activity), GO:0030509 (BMP signaling pathway), and UBERON:0000970 (eye); added embryonic UBERON anatomical locations (optic vesicle, lens placode, and extraocular target organs) across ocular and extraocular developmental nodes; added evidence and ENDOCRINOLOGY_METABOLISM (noting the single reported CPHD case) to classifications; added variant_origin GERMLINE on BMP4; enriched diagnosis with NCIT bindings, Chromosomal Microarray Analysis (with array-CGH evidence from PMID:18925664), and Brain/Pituitary MRI; added Genetic Counseling and treatment target_mechanisms on Orbital Socket Expansion.

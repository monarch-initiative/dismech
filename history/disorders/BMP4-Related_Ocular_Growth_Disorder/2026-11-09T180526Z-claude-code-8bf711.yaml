  details: |
    Addressed review 5830340238 on PR 16930. Coloboma now cites the case-level sentence in PMID:21340693 (the Bakrania index proband, quote_role BACKGROUND) instead of ClinGen's general ocular-features line, and the notes sentence saying no case-level source existed was replaced. Added Rieger anomaly (HP:0000558, found by OLS search l~Rieger; PMID:21340693 Patient 1 and the abstract), wired from Failed Optic Cup Formation and Lens Induction. Added the Stickler-like family's findings from PMID:30568244: high myopia (HP:0011003), congenital vitreous hypoplasia bound to HP:0004327 Abnormal vitreous humor morphology because OLS l~vitreous returned no hypoplasia term, retinal detachment (HP:0000541), sensorineural hearing impairment (HP:0000407), retrognathia (HP:0000278) and high palate (HP:0000218). Each description says the source is a single family; none is wired because the source proposes a mechanism only as speculation. The existing Myopia phenotype was kept because the discovery-family snippet says myopia, not high myopia. The PMID:31120642 Rathke's pouch sentence was regraded MODEL_ORGANISM with quote_role BACKGROUND; check-snippet-grading reports no new divergence. Revalidated with just validate (53/53 snippets), count-verified-snippets, causal targets, entity refs, name collisions, coarse phenotypes, gene validity and list-disconnected-phenotypes.

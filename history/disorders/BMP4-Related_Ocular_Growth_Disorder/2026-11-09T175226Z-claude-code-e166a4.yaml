  details: |
    New entry for BMP4-related ocular growth disorder (MONDO:0100613) from one OpenScientist deep-research report (research/BMP4-Related_Ocular_Growth_Disorder-deep-research-openscientist.md; 22/22 cited references resolved, preflight-dr PASS). Scope follows the ClinGen Definitive AD assertion, which lumps all BMP4 cases with ocular features; MCOPS6 (MONDO:0011936) is a has_subtypes row, and BMP4 orofacial cleft without eye involvement stays in Cleft_Lip_Palate. Claims were re-sourced from the cached abstracts or PMC full text of PMID:18252212, 21340693, 18925664, 30568244, 31120642, 31053785, 17173667, 19906857, 19854269 and 12812886, plus the ClinGen record. Report-suggested HP:0000483 (it is Astigmatism, not Axenfeld-Rieger) was not used. Validated with just validate (schema, terms, 45 snippets), count-verified-snippets, causal targets, entity refs, name collisions, coarse phenotypes, gene validity, check-genereviews (NO_CHAPTER) and the whole-repo offline gates.

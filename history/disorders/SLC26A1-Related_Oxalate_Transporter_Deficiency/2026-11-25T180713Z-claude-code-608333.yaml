  summary: 'Gene-family review: SLC26A1 retyped UNKNOWN; ClinGen Limited recorded'
  details: |
    The SLC26A1 record was typed CAUSATIVE and its notes said no ClinGen assertion existed. ClinGen's Tubulopathy GCEP (2022-07-06) classifies SLC26A1 as Limited (AR) for MONDO:0020722, nephrolithiasis susceptibility caused by SLC26A1, which this entry maps as a closeMatch. CAUSATIVE asserts Definitive or Strong evidence; the human evidence is two unrelated stone formers (PMID:27210743), one knockout mouse line was hyperoxaluric and a second was not (PMID:20160351, PMID:30383413), and a 2026 review states that few patients with damaging variants have been characterized (PMID:41056011). The record is now typed UNKNOWN, the note records the ClinGen tier, and the ClinGen row is quoted as evidence (CGGV:assertion_405dbe82-9d40-4b5e-a88a-f6230346abd1-2022-07-06T050000.000Z); it is not copied into gene_disease_validity because MONDO:0020722 is not this entry's disease_term. The description now calls the disorder a proposed Mendelian form. Record-level autosomal recessive inheritance added. Mechanism node unchanged: oxalate and sulfate transmembrane transporter activities decreased.

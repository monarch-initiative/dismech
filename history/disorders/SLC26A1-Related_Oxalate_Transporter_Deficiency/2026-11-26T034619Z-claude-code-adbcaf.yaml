  summary: 'Curate phenotypes: SLC26A1-Related Oxalate Transporter Deficiency'
  details: |
    Searched PubMed/Europe PMC (SLC26A1 with nephrolithiasis, oxalate, sulfate, SAT1), GeneReviews/StatPearls (no chapter), cached 10 candidate papers. Added childhood onset and an independent cohort citation to the stone phenotype (PMID:40814648), an acute kidney injury phenotype with a causal edge (PMID:41203986, second-hand account of an original proband), a null nephrocalcinosis result, and a caveat that the pilot nephrocalcinosis case carries the common Q556R variant. Heterozygous cases recorded as leads in notes.

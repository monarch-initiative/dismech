  summary: Record MONDO:0020722 as skos:closeMatch; disease_term deferred
  details: |
    Re-audit for dismech#3691 (entries lacking a top-level disease_term). The entry notes previously asserted that no exact MONDO term was found; that was stale. MONDO:0020722 (nephrolithiasis susceptibility caused by SLC26A1) carries the entry's package seed record OMIM:167030 and is gene-anchored to SLC26A1 via RO:0004003 HGNC:10993, so it denotes the same gene-phenotype relationship. It is recorded as a mappings.mondo_mappings skos:closeMatch rather than promoted to the top-level disease_term because MONDO models the class as an inherited disease susceptibility (is_a MONDO:0020573 inherited disease susceptibility; predisposes_towards MONDO:0008171 nephrolithiasis), whereas this entry models a recessive Mendelian transporter deficiency. Promotion to disease_term is left as a maintainer framing decision and flagged on dismech#3691. Verified with runoak -i sqlite:obo:mondo info MONDO:0020722 -O obo. Validated with just validate and just validate-terms, both passing. No evidence, phenotype, or pathophysiology content changed.

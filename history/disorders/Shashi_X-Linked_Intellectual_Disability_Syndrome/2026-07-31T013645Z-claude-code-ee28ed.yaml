  summary: 'Create: Shashi_X-Linked_Intellectual_Disability_Syndrome'
  details: |
    Created the Shashi X-linked intellectual disability syndrome (MRXS11/SMRXS, MONDO:0010277, RBMX) entry. Deep research via Edison/falcon (571s, 19 citations, 1 markdown artifact). NEC preflight against MONDO:0010277 confirmed RBMX/hgnc:9910, OMIM:300238 and the MRXS11 synonym; the falcon report was correctly anchored and explicitly distinguished the entity from Shashi-Pena syndrome (ASXL2) and Gustavson syndrome (allelic RBMX). The falcon phenotype summary (short stature, hypogonadism) was rejected as unsupported by the primary abstracts, which report macroorchidism and do not mention short stature; phenotypes were curated directly from PMID:10677307 and PMID:12605440. Curated 7 pathophysiology nodes chaining RBMX loss of function to disrupted RGG/RG-dependent splicing regulation, RBMX/SRSF1 disruption with MDM4 mis-splicing, aberrant p53 activation, neural progenitor differentiation failure with excessive apoptosis, impaired cortical development, and syndromic neurodevelopmental impairment. Also curated 10 HPO-bound phenotypes, genetics (RBMX causative, RBMXL1 modifier), X-linked recessive inheritance, structured prevalence (CASES_IN_LITERATURE / ULTRA_RARE), diagnosis, two differential diagnoses (fragile X, Gustavson), genetic counseling, and two discussions (HUMAN_MODEL_MISMATCH on mouse Rbmx buffering by RBMXL1; KNOWLEDGE_GAP on the obesity and macroorchidism mechanism). No GeneReviews chapter exists for RBMX-related disease. Validated with just validate and just validate-terms (both pass) plus a programmatic whitespace-normalised substring check of all evidence snippets against references_cache.

    Self-review pass (dismech-pr-review checklist) found and fixed three defects before submission. (1) Frequency-band contradiction: four VERY_FREQUENT phenotypes (moderate intellectual disability, distinctive craniofacial dysmorphism, obesity, macroorchidism) carried explanations asserting the feature was present in "all seven living affected males", i.e. 100 percent, which is the OBLIGATE band rather than VERY_FREQUENT (80-99 percent) - anti-pattern 1 in docs/frequency-evidence-guidelines.md. The PMID:10677307 abstract summarises findings across the seven affected males as a group and does not tabulate per-patient counts, so a per-feature count cannot be derived; the explanations were rewritten to state an explicit Pattern C qualitative-mapping basis and the VERY_FREQUENT band was retained. (2) Methods-only snippet claiming SUPPORT: an evidence item on the neural-progenitor node quoted the PMID:34260915 aims sentence ("In this study, we investigate the contribution of the XLID-associated RBMX in neuronal differentiation.") as SUPPORT; it was removed, as the node already carries the direct observational finding. (3) Four terminal causal edges from Syndromic Neurodevelopmental Impairment to the phenotype nodes carried no evidence; verified snippets were added, using PARTIAL for the three INDIRECT_UNKNOWN_INTERMEDIATES edges (craniofacial, obesity, macroorchidism) since the sources establish co-occurrence but not the causal intermediates.

    Pathograph integrity verified programmatically: 7 pathophysiology nodes, 10 causal edges, no dangling downstream targets, no orphaned nodes, both discussion attaches_to refs resolve. Reference cache bodies inspected for HTML mangling (clean). The single falcon artifact is a markdown summary table, not an image, so no evidence images slot was populated. Final state: 7 pathophysiology nodes, 10 phenotypes, 58 evidence items across 9 references, 0 snippet mismatches, compliance 97.7 percent (98.4 percent weighted).

  summary: 'Create: Hereditary Sclerosing Poikiloderma With Tendon And Pulmonary Involvement'
  details: 'New entry for MONDO:0014310 (POIKTMP, FAM111B). Curated from one Perplexity deep-research report run at reasoning_effort low, used as leads only, plus primary literature found via PubMed. PMIDs beyond those named in the report body: 27748098 (GeneReviews chapter, tagged, with its Bookshelf URL), 32776417 (protease gain-of-function study, previously only abstract-cached; full text refetched), 26495788, 28349113, 34358284, 35869874. Pathograph: FAM111B protease gain of function, chromatin displacement of RFC1/PCNA/RPB1, caspase-dependent apoptosis, then an inferred (INDIRECT_UNKNOWN_INTERMEDIATES) step to systemic fibrofatty degeneration branching into skin, muscle, lung, pancreas and liver nodes; a second branch records mutant nuclear-envelope accumulation and telomere/genomic instability (knockout-cell data, marked indirect) leading to chromosomal instability and pancreatic adenocarcinoma. The competing dominant-negative reading (PMID:37342232) is recorded beside the gain-of-function evidence. Phenotype frequencies come from the 15-patient series (PMID:26471370). Pancreatic cancer is included with the case report and the 2-of-17-adults count; no risk estimate. Prevalence omitted: none published. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-genereviews (TAGGED) and validate-disorders all pass; 89/89 snippets verified; gene activity grounding OK. Before review, the respiratory-support treatment was rebound from NCIT:C70909 Mechanical Ventilation to NCIT:C171457 Non-Invasive Mechanical Ventilation, which is what GeneReviews recommends, and a CASES_IN_LITERATURE prevalence record (about 30 and 34 published cases; PMID:35869874, PMID:36102338) was added. A review round added a diagnosis section (clinical suspicion, FAM111B molecular testing, muscle MRI, skin biopsy, pulmonary function testing) citing the GeneReviews diagnosis text, the GeneReviews recurrence-risk sentence on the inheritance block, heat-avoidance and annual-surveillance management items, palmoplantar keratoderma and sparse eyelashes as separate phenotypes, a rebinding of pancreatic cancer to HP:0006725 Pancreatic adenocarcinoma, and the GeneReviews dominant-negative statement; 110/110 snippets verified and validate-disorders passes.


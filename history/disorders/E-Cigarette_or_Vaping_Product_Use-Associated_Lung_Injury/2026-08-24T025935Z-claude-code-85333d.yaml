  summary: Act on the round-2 non-blocking suggestions
  details: |
    Round 2 approved the entry with zero blocking findings and five non-blocking
    suggestions. Four are acted on here; the fifth needs no action.

    THE HYPOTHESIS GROUPS NOW DO WORK. Both declared groups existed without a
    single causal edge opting into them, which made them documentation rather
    than structure. The two INDIRECT_UNKNOWN_INTERMEDIATES edges around the
    surfactant node now carry hypothesis_groups: [vea_surfactant_route], so the
    canonical route is attached to the specific edges it explains and the ketene
    alternative stands visibly apart from them.

    The reviewer noted that roughly 35% of entries declaring groups never
    reference them, and offered that as grounds for leaving it. That is an
    argument that the gap is common, not that it is right: an unreferenced group
    cannot be queried, and CLAUDE.md describes edges opting in as the mechanism.
    Fixing it costs four lines.

    THE SUPPORTIVE-CARE TREATMENT WAS RENAMED RATHER THAN RE-TAGGED. The
    reviewer flagged therapeutic_modality: DEVICE against a treatment called
    "Supportive Care and Supplemental Oxygen" as a granularity mismatch, and
    called it defensible. It was the name that was wrong, not the modality:
    supportive care spans nursing and fluids and much else that is not a device,
    while what this entry actually curates - and what its evidence and its
    BYPASSES edge describe - is oxygen and ventilation. Renamed to "Supplemental
    Oxygen and Mechanical Ventilation", which DEVICE describes exactly.

    Also: NCIT:C191501 Chest Computed Tomography bound as diagnosis_term on the
    imaging entry, verified with OAK first. The infection-exclusion entry is
    deliberately left unbound - it is a diagnostic strategy rather than a single
    procedure, and no NCIT term names it.

    And the second ketene snippet now quotes its full sentence. It previously
    began mid-sentence in lowercase ("increased with repeat puffs..."), which
    passed every check - exact substring, over the five-word floor - while
    reading as though the subject had been trimmed to fit. "The production of
    ketene increased with repeat puffs..." says the same thing and stands on its
    own.

    Suggestion 5 needs no action and is agreed: the CANONICAL hypothesis group
    carries no evidence because it is the framing model, and the KNOWLEDGE_GAP
    discussion attached to the node it explains carries four evidence items.

    Validation: just validate passes. Snippets 44/44 verified, unchanged - the
    ketene snippet was lengthened, not added, so the count is stable and that is
    the expected arithmetic for this edit. All six ratchet gates and
    check-not4curation pass. Test subset (NOT the full suite): pytest -k
    "hypothesis or diagnosis or foreign or treatment" gives 6771 passed, 29646
    deselected. Compliance 87.4%/87.9% to 87.5%/88.0%, the diagnosis_term
    binding.

  details: |
    Round 3 approved with zero blocking findings and two non-blocking
    suggestions. One implemented, one declined on evidence.

    SUGGESTION B IMPLEMENTED, AND IT WAS A REAL PRECISION DEFECT. The
    chest-imaging evidence item's explanation claimed the quote "states both what
    imaging shows and its limit as a diagnostic test". The limit is genuinely in
    the source, but it sat in the clause immediately BEFORE the quoted span, so
    the explanation asserted something true that fell outside its own quotation
    marks. That is a small thing that matters here, because the entire discipline
    of this knowledge base is that an explanation is answerable to its snippet;
    an explanation reaching past the quote is the same species of error as a
    snippet reaching past its source, just quieter and unreachable by any
    automated check.

    The snippet was extended leftward to cover the whole sentence, which now
    includes "Radio-graphic findings may not be apparent on presentation, but".
    The source carries a line-break artefact in "Radio-graphic" and it is quoted
    as printed rather than silently repaired. Snippet count stays at 44/44,
    because a quote was lengthened rather than added - the expected arithmetic
    for this edit, and the same signature as the ketene fix last round.

    SUGGESTION A DECLINED, WITH THE TERM VERIFIED FIRST EITHER WAY. NCIT:C94624
    Oxygen Therapy was proposed as a closer fit for the renamed treatment now
    that it is called "Supplemental Oxygen and Mechanical Ventilation". The term
    is real - OAK returns the exact label, it is already in the treatmentactionterm
    enum cache, and three other entries bind it - and the reviewer verified all of
    that before proposing it, which is a visible correction of the NCIT:C2963
    episode two rounds ago.

    It is still the wrong binding here, for a reason the term's existence does
    not settle: NCIT separates oxygen therapy from mechanical ventilation
    (NCIT:C171457 non-invasive, NCIT:C191573 invasive) and has no term spanning
    both. Binding Oxygen Therapy would name half of what this treatment covers.
    The previous round moved the treatment's NAME to match its DEVICE modality;
    moving the TERM now would reintroduce the same mismatch running the other
    way, with a term narrower than its content instead of broader. Accurate
    generality beats a precision that excludes the ventilation arm. Recorded in a
    note on the treatment so the suggestion is not re-made, and so the next
    curator sees that the term was checked rather than overlooked.

    Validation: just validate passes. Snippets 44/44 verified, unchanged. All six
    ratchet gates and check-not4curation pass. Test subset (NOT the full suite):
    pytest -k "diagnosis or evidence or treatment" gives 4367 passed, 32050
    deselected. Compliance unchanged at 87.5%/88.0%.

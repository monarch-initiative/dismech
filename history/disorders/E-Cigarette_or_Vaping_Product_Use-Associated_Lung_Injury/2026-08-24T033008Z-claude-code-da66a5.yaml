  summary: Remove revision narration from an explanation, repeating a rule set one
    PR ago
  details: |
    Round 4 approved with zero blocking findings and one non-blocking suggestion.
    Implemented, and it is a repeat of a mistake I had already diagnosed.

    THE FINDING. The chest-imaging explanation, rewritten last round to fix a
    different defect, narrated its own edit: "an earlier version of this item
    claimed something true that fell outside its own quotation marks". An
    explanation is claim-facing. It argues why THIS snippet supports THIS claim,
    to a reader who has only the file and no access to the review thread. Edit
    history is history-record material, and this change was already recorded in
    one. The reviewer also notes the phrase becomes unresolvable once the branch
    is squash-merged, which is true and is a second reason.

    THIS IS THE SAME ERROR AS Iron_Poisoning COMMIT 74300b2f, ONE PR AGO. That
    commit removed revision narration from FOUR evidence explanations and landed
    on the rule explicitly: "an explanation says why this evidence bears on this
    claim, for a reader who has only the file. What the field used to say, and
    why it changed, is history-record material." The cause diagnosed there
    applies unchanged here - each instance was written in the same motion as the
    fix it describes, when the reasoning for the change was the most salient
    thing in mind. Knowing the rule did not prevent recommitting the error under
    the same conditions, which is worth recording plainly rather than fixing
    quietly.

    The reviewer offered an out - the same construction exists in
    Gambling_Disorder.yaml and Gonorrhea.yaml, so it has KB precedent. Precedent
    is not the reason to keep it. The stronger reason to remove it is that I set
    this rule one PR ago and should hold to it.

    The explanation now argues the claim only: the quote spans both clauses
    because the limit is the load-bearing half for a diagnosis of exclusion, a
    normal early study does not exclude the disease, and imaging therefore cannot
    rule it out at presentation. The note that "Radio-graphic" is quoted as
    printed rather than silently repaired is KEPT - that is snippet-facing rather
    than history-facing, telling a reader the odd hyphen is the source's and not
    a transcription error.

    ONE INSTANCE IS DELIBERATELY LEFT. The top-level `notes` still says "An
    earlier version of this note also claimed ground-glass opacification was
    unsupportable". That is not the same case and should not be swept up by the
    same grep. `notes` is entry-level commentary rather than a claim-facing
    argument, and what it retracts is a false statement THE NOTES THEMSELVES
    MADE. A block correcting its own error in place is self-correction; an
    explanation narrating an edit to a different field is provenance in the wrong
    place. The round-1 review credited that retraction specifically as honest
    curation provenance, and removing it would delete the record of the entry's
    most instructive mistake.

    Validation: just validate passes. Snippets 44/44 verified, unchanged - only
    explanation prose was touched. All six ratchet gates and check-not4curation
    pass. Test subset (NOT the full suite): pytest -k "diagnosis or evidence"
    gives 2182 passed, 34235 deselected. Compliance unchanged at 87.5%/88.0%.

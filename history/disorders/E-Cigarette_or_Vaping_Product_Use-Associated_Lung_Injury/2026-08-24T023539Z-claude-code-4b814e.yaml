  summary: Address round-1 review; correct a factually wrong notes claim
  details: |
    Round-1 review returned CHANGES_REQUESTED with 1 critical, 6 important and 6
    suggestions. Every quoted claim in it was verified against the caches before
    acting - all ten checked out - and the review was right about the thing that
    mattered most.

    THE WORST FINDING WAS MINE, AND IT WAS A FACTUAL ERROR IN THE ENTRY'S OWN
    NOTES. The notes asserted that ground-glass opacification could not be
    curated "for want of a quotable source". That was false. Two references
    ALREADY COMMITTED IN THIS PR state it plainly: PMID:31860793 ("such patients
    commonly are found to have basilar-predominant consolidation and ground-glass
    opacity") and PMID:34584727 ("HRCT showed consolidation and ground-glass
    opacities in both lungs").

    The process error behind it is worth naming precisely, because it is
    repeatable. I searched PubMed for a DEDICATED IMAGING PAPER, found only
    off-topic results, and concluded no source existed - without searching the
    caches already on disk. The absence of a NEW source was mistaken for the
    absence of ANY source. That is worse than an omission: a note claiming
    something is unsourceable sends the next curator hunting for a paper that is
    already in the repository. The phenotype is now curated with both quotes, and
    the note has been rewritten to record the mistake rather than quietly
    deleted, since the reasoning error is more useful to a future curator than a
    clean note would be.

    THE CRITICAL FINDING WAS ALSO CORRECT. Alveolar Macrophage Lipid Accumulation
    had no incoming edge, no downstream edge and no evidence - a disconnected
    component in an otherwise linear pathograph. It is now wired both ways
    (exposure node to it as DIRECT; it to the inflammation node as
    INDIRECT_UNKNOWN_INTERMEDIATES, because whether these macrophages drive the
    inflammation or merely mark it is not established) and carries two
    MODEL_ORGANISM items, including the JUUL control that makes the finding
    specific to vitamin E acetate rather than to inhaled aerosol generally.

    TWO REVIEW ITEMS WERE DECLINED ON EVIDENCE, AND BOTH DECLINES ARE RECORDED IN
    THE ENTRY RATHER THAN ONLY IN THE PR THREAD.

    Item 6 asked for an oxidative-stress node, citing PMID:32822237 as
    "demonstrating VEA-induced oxidative injury in both whole lung and isolated
    alveolar macrophages". The paper does not demonstrate that. Its full text
    contains exactly one occurrence of "oxidat", and it describes vitamin E's
    normal ANTIOXIDANT function - scavenging free radicals and terminating lipid
    peroxidation. The characterization is not merely unsupported but inverted.
    The paper was fetched anyway and turned out to be the single most valuable
    addition of this round for other reasons: it supplies the human arm of the
    mechanism, showing aerosolised VEA directly injuring primary human alveolar
    type II cells, which is the only human-cell evidence in the entry and the
    closest anything cited comes to the surfactant proposal.

    Suggestion 11 proposed NCIT:C2963 as a more specific "Corticosteroid" term.
    OAK resolves NCIT:C2963 to "Cranial Nerve Neoplasm". Taking the suggestion
    would have put a neoplasm term inside a treatment. The real Corticosteroid
    term is NCIT:C2322, which fails the ChemicalEntityTerm dynamic enum - the
    reason the agent was bound to CHEBI:24261 in the first place. A note on the
    treatment now records all three facts so the suggestion is not re-made.

    EVERYTHING ELSE WAS IMPLEMENTED. Evidence added to the DAD node (items 2);
    ground-glass curated (3); a biochemical section for the white cell count and
    differential (4); tachycardia and tachypnea (5); a diagnosis section with
    imaging and the infection-exclusion limb (7); vaping cessation counselling
    (8) and supportive care/oxygen (9); the ketene thermal-degradation route as
    an ALTERNATIVE mechanistic_hypotheses entry (10); entry-level evidence on the
    animal model (12); and a relapse-on-re-exposure progression phase (13).

    THREE JUDGEMENT CALLS INSIDE THOSE FIXES.

    The fatal-case denominators are carried explicitly. The tachycardia,
    tachypnea and laboratory figures all come from the FATAL-case subset of
    national surveillance, so each explanation states that a proportion measured
    among those who died says nothing about those who did not, and no frequency
    band is set. The review flagged this for the laboratory values; the same
    caveat applies to the vitals and is applied there too.

    Supplemental oxygen uses treatment_effect: BYPASSES, not INHIBITS. It does
    not act on the injury at all - it substitutes for the function the injured
    alveolus has lost. BYPASSES says that precisely, and distinguishes it from
    the glucocorticoid entry, which does target a mechanism.

    Ketene is curated as a HYPOTHESIS, not as pathograph nodes. It has been shown
    in a device, not in a lung. The hypothesis description records why the two
    routes are hard to separate from human specimens at all: anyone who inhaled
    ketene also inhaled vitamin E acetate, so lavage recovers the parent compound
    either way, and every piece of evidence for the canonical route is equally
    compatible with the alternative.

    Validation: just validate passes (schema: no issues; terms: passed).
    validate-disorders passes with 44/44 snippets verified, no skips, up from
    28/28. All six ratchet gates and check-not4curation pass. Test subset (NOT
    the full suite): pytest -k "foreign or unique or evidence or environmental or
    hypothesis" gives 11275 passed, 25142 deselected. Compliance 85.5%/86.2% to
    87.4%/87.9%, raised while nearly doubling the size of the entry.

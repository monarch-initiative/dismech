  summary: 'Create: EVALI, an exposure disorder with no MONDO term'
  details: |
    First curation of EVALI (E-cigarette or Vaping product use-Associated Lung
    Injury), chosen because it is an exposure disease with NO MONDO TERM, which
    was the property the requester wanted exercised.

    THE MISSING MONDO TERM WAS VERIFIED, NOT ASSUMED. Label-only lookups returned
    nothing for every candidate disease considered, which was suspicious enough
    to be worth checking, so the adapter was controlled against "silicosis" and
    MONDO:0800385; both resolved. A full-text search (t~vaping, t~cigarette,
    t~EVALI) then confirmed the absence. Only `name` is required by the schema,
    and 27 existing entries including Arsenic_Poisoning already omit
    `disease_term`, so the entry is schema-valid without one. ICD-10-CM does code
    the disease as U07.0 "Vaping-related disorder", which is bound under
    `mappings` instead, and the top-level notes say MONDO records nothing so a
    later curator reads "not MONDO-ed" rather than "overlooked".

    A CONSEQUENCE WORTH RECORDING: `just preflight-dr` REQUIRES a MONDO ID and
    therefore CANNOT RUN for a MONDO-less entry. The automated Named Entity
    Confusion check is structurally unavailable here. The manual fallback was
    used instead: the report mentions EVALI 69 times, vitamin E acetate 25 and
    e-cigarette 20, with no rival entity (silicosis 0, diacetyl 0, lipoid
    pneumonia and bronchiolitis obliterans 1 each in passing). No entity
    confusion.

    THE DEEP-RESEARCH REPORT'S QUOTED MATERIAL WAS NOT USED AT ALL, AND THE
    VALIDATION BLOCK IS WHY. The claude_code run reported confabulation_rate 0.0
    with all 30 identifiers resolving - and quotes_valid 3 of 6. Half its checked
    quotes are not in their sources. That is precisely the case CLAUDE.md warns
    about: confabulation rate measures identifiers only, so a report whose every
    PMID is real but whose quotes drifted still scores a clean zero, and reading
    that number as the all-clear would have carried three bad quotes into the
    entry.

    The three are paraphrase drift rather than invention, and the third is the
    dangerous one: it renders "bilateral symmetric ground-glass opacities,
    consolidation, and a lower lobe predominance" as "...with subpleural
    sparing...", ADDING a clinical finding the source does not state. Subpleural
    sparing is a real and frequently cited EVALI imaging sign, so the fabricated
    version reads as more correct than the true one. A fourth quote is
    uncheckable - the reference resolves but exposes no abstract or full text.

    Every one of the 28 snippets in this entry was therefore extracted
    programmatically from cached abstracts by sentence-boundary search, and none
    was retyped or copied from the report. That caught a further hazard on the
    way: the mouse-model paper writes "PG-VG" with an EN DASH (U+2013), so a
    retyped anchor failed its assertion. Same family as the thin spaces in
    Iron_Poisoning, different character.

    A CIRCULARITY TRAP IS CURATED AS A TRAP. "All case patients had bilateral
    infiltrates on chest imaging" reads as a 100% frequency. It is not one: the
    same paper's case definition REQUIRES pulmonary infiltrates on imaging, so a
    cohort assembled under it cannot contain a patient without them. The figure
    describes the case definition, not the biology. Pulmonary infiltrates is
    deliberately left unbanded and the explanation states the circularity.

    The same discipline retired the headline symptom frequencies. Respiratory
    97%, gastrointestinal 77% and constitutional 100% are CATEGORY-LEVEL
    COMPOSITES, and a composite cannot be apportioned among its members, so they
    are curated as evidence of occurrence and no phenotype carries a frequency
    band. Each of the six explanations names which category covers that
    phenotype rather than repeating one generic caveat - an initial version used
    identical text six times and was differentiated on self-review.

    TWO ONTOLOGY GAPS, BOTH RECORDED RATHER THAN FILLED. Beyond MONDO, ECTO has
    no vaping or e-cigarette term; the only candidate is ECTO:0100003 "exposure
    to cigarette smoking", which is combusted tobacco - a different exposure -
    and binding it would assert something false in a machine-readable field. The
    environmental entry is left unbound with the search recorded, per the "no
    term beats a bad one" rule.

    THINGS LEFT OUT FOR WANT OF A SOURCE, NOT BY JUDGEMENT. Ground-glass
    opacification and weight loss were drafted as phenotypes and then REMOVED,
    because nothing citable supports them: the imaging source found during
    research resolves but exposes no text, and a targeted PubMed search for a
    substitute returned only off-topic papers. Keeping an unevidenced phenotype
    would have been worse than the gap. PMID:31577870, the strongest published
    pathology series, cached with a ZERO-CHARACTER body and is uncitable rather
    than merely uncited, so histopathology rests on a single case report and
    says so. All three omissions are recorded in the entry's top-level notes.

    Terms verified before use, and one was wrong: HP:0006536, drafted for
    pulmonary infiltrates, is actually "Airway obstruction" - caught by OAK
    before it entered the file. NCIT:C2322 (Corticosteroid) passed OAK but failed
    the ChemicalEntityTerm dynamic enum, the same trap as Iron_Poisoning's
    NCIT:C416; swapped to CHEBI:24261 glucocorticoid.

    EVIDENCE BALANCE, STATED PLAINLY: 27 SUPPORT and 1 PARTIAL, with no REFUTE.
    Unlike Iron_Poisoning this entry curates no disagreement, because the cited
    literature does not contain one - it is a small, young and consistent body of
    work from a single outbreak. The one PARTIAL is the causal-agent paper's own
    conclusion, which claims association in a convenience sample and declines
    causation. No disagreement was manufactured to balance the ledger.

    Validation: just validate passes (schema: no issues; terms: passed).
    validate-disorders passes with 28/28 snippets verified and no skips. All six
    ratchet gates and check-not4curation pass. Test subset (NOT the full suite):
    pytest -k "foreign or unique or required or evidence or environmental" gives
    13321 passed, 23096 deselected. Compliance 85.5% global / 86.2% weighted,
    raised from 77.5% by evidencing blocks that initially had none rather than by
    removing the blocks.

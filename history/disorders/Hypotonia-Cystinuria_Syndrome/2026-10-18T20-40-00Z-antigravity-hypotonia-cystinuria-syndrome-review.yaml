    summary: Ground SLC3A1 and PREPL molecular functions on gene-specific pathophysiology
      nodes and add classifications, prevalence, progression, diagnosis, and differential
      diagnoses for Hypotonia-Cystinuria Syndrome (#10985).
    details: Grounded SLC3A1 (GO:0015171) on Proximal tubular cystine transport defect
      and PREPL (GO:0004252) on PREPL-related neuromuscular transmission defect, populated
      classifications, prevalence (BAND_1_9_PER_1000000, PMID:31024870), progression,
      diagnosis (urinary cystine analysis NCIT:C18020 and 2p21 deletion analysis via
      MLPA/WES NCIT:C19770 backed by PMID:31024870 and PMID:34612606), and Prader-Willi
      syndrome (MONDO:0008300) under differential_diagnoses.

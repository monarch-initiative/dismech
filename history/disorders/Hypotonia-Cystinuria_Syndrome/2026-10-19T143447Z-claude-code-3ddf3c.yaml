  details: |
    Addressed the CHANGES_REQUESTED review on PR 14799. Prevalence notes now match PMID:31024870 (26 reported cases, 8 different deletions) instead of the unsourced 20 families / 9 deletions; prevalence_class changed from ULTRA_RARE to BAND_1_9_PER_1000000 because a numeric rate (0.1 per 100,000) is populated. Diagnosis results for urinary amino acid analysis no longer state an unsourced >300-400 mg/L cut-off; it now says the cystine/creatinine ratio is far above the reference range, as the cited single-patient value shows. Removed the two molecular functions from the bundled SLC3A1-PREPL deletion node: GO:0015171 already sits on the SLC3A1 proximal tubular transport node, and the PREPL function moved to the PREPL neuromuscular node as GO:0017171 serine hydrolase activity (parent of the previously bound serine-type endopeptidase term, verified with runoak ols:go) because PMID:16385448 shows serine hydrolase probe reactivity and only infers oligopeptidase function by homology; added that sentence as IN_VITRO evidence. Added the PMID:34612606 WES snippet to the MLPA/WES diagnosis row. Did not add a LOINC urine cystine measurement (needs the LOINC seed-cache overlay; left as a follow-up).

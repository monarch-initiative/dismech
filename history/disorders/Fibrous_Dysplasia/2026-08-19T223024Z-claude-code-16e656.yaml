  summary: 'Edit: wire Fibrous Dysplasia to defective_skeletal_mineralization'
  details: >-
    Added one conforms_to declaration and corrected one modifier. The
    'FGF23-mediated phosphate wasting' node now conforms to
    defective_skeletal_mineralization#Phosphopenic Substrate Deficiency. The
    match is exact: the node already describes FGF23 decreasing renal phosphate
    reabsorption and active vitamin D to produce hypophosphatemia with rickets or
    osteomalacia, which is the module trigger node's own chain, and it already
    carries GO:0055062 phosphate ion homeostasis, the same process the module
    node binds. This is also the acquired (McCune-Albright) FGF23 route that
    issue #8995 records as otherwise unrepresented. Separately, on PR review, the
    GO:0055062 modifier on that node was changed from ABNORMAL to DECREASED to
    match the module node and because DECREASED is the more specific and accurate
    claim for FGF23-driven phosphate wasting. Part of item 2 of #8995, the second
    pass over the recommendations in #8955 after #8975 merged.

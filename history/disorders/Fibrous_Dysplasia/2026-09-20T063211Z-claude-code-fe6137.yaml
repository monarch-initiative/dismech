  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    GNAS was already curated with relationship_type: CAUSATIVE and
    variant_origin: SOMATIC on the genetic[] record, and the upstream node already
    carried a gene: descriptor. Three things were added.

    1. genetic_context on 'Somatic GNAS activation in mosaic skeletal progenitors'
       (variant_origin: SOMATIC, functional_impact_category: GAIN_OF_FUNCTION,
       allele_type: missense). CLAUDE.md asks for the somatic lesion to be recorded
       as a genetic_context on the node it happened at; the entry previously stated
       the post-zygotic mosaicism only in prose and in the disease-level genetic[]
       record. Fibrous dysplasia is not a neoplasm entry, so this is the
       somatic-mosaic case rather than a cancer cell-of-origin marking.
    2. genes: GNAS on the McCune-Albright syndrome subtype row (MONDO:0018919),
       which MONDO records GNAS for. MAS is the extraskeletal end of the same
       mosaic spectrum, so the gene is the same and the row now says so.
    3. The GeneReviews chapter for this disease (PMID:25719192, NBK274564) was
       neither cited nor tagged. It is now tagged in references: and cited three
       times: for the post-zygotic somatic activating GNAS variant, for the
       non-inheritance that is the reason there is no germline record to make, and
       on the subtype row for the one-entity FD/MAS scope. The missense allele_type
       is sourced separately from PMID:27492469, which names Arg201 and Gln227.

    Note for the campaign: this entry exports one gene edge, GNAS to
    MONDO:0000845, because kgx_export.py keys gene edges off disease_term and does
    not read has_subtypes (dismech#12316). The GNAS-to-MONDO:0018919 pair the gap
    list asks for cannot be emitted until that is fixed, regardless of curation.

    Validation: just validate, validate-terms, count-verified-snippets (79/79),
    check-genereviews (now TAGGED), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings), validate-disorders.

  summary: Review sporadic brain AVM mechanisms, clinical comparisons and investigational
    therapies against full-text evidence
  details: |
    Reviewed the complete entry, prior history and Falcon research report against generated reference caches. Used primary full text to separate endothelial GLUT1 trafficking from HK2 induction, distinguish capillary/venular identity loss from unchanged arterial/venous markers in HUVECs, and separate endothelial cytokines, myeloid activation, junction injury and smooth-muscle apoptosis. Removed universal genetic/clonal and blood-test claims. Compared ARUBA all-stroke/death endpoints with observational MATCH AVM-hemorrhage/death endpoints, including subgroup and confounding limits. Added specific neurological findings, VALE score caveats, acute and seizure care, completed bevacizumab pilot results, and preprint-only compassionate trametinib experience including an on-treatment hemorrhage. Added adult and postnatal KRAS mouse models, CasRx RNA knockdown, embryonic zebrafish and distinct endothelial/myeloid cultures, preserving prevention-versus-treatment and species limitations. Verified nine live registry records on 2026-10-01, including zero-enrollment withdrawal of NCT06098872 and active drug/diagnostic/device studies. GeneReviews has no chapter; read current StatPearls full text but rejected its incorrect VALE components and reversed transcriptomic direction in favor of primary sources. BRAF mouse and several clinical papers remain abstract-only retrievals. New reference bibliography and machine-generated caches retain exact evidence. Existing candidate associations remain uncertain rather than established drivers.

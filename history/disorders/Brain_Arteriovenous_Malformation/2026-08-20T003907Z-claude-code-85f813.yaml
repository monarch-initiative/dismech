  summary: 'Round 3 review on PR #9007: fix orphan-root mural node and drop non-causal
    motivation edge'
  details: |
    Third review round on PR #9007. Both IMPORTANT items were pathograph edge-semantics
    defects and both are correct.

    ITEM A - the mural cell node was a directed orphan root. My own connectivity check was
    undirected, which is why it passed: the node had an outgoing edge to rupture but no
    incoming edge, so it rendered as a second initiating root alongside the somatic mutation -
    implicitly claiming deficient mural coverage arises independently of the KRAS/BRAF
    programme, while its own description claimed it sat "between the malformed nidus and
    rupture". Added the incoming edge from "Aberrant Angiogenic and Notch Programme with Loss
    of Arteriovenous Identity", which is the parent the reviewer suggested and the one that
    reads truer to the evidence: loss of Notch-dependent arteriovenous identity is
    mechanistically upstream of failed pericyte and smooth-muscle recruitment. The graph now
    has exactly ONE directed root, the trigger node.

    ITEM B - "Nidus Rupture -> MAPK-ERK Pathway Inhibition" was a clinical-motivation
    statement encoded as a causal edge, which would export to KGX/cx2 as an assertion that
    haemorrhage produces a drug target. Dropped. It cost no connectivity, since the
    vulnerability node is already correctly reached from "Constitutive RAS-MAPK-ERK
    Signalling", the true mechanistic basis. The clinical rationale was moved into the node's
    own description with an explicit note that it is a rationale rather than a causal
    relationship.

    SYSTEMATIC FINDING. Item B is not local to this entry - I made the same category error in
    both other entries curated this session, and am fixing all three rather than only the one
    that was reviewed:
      - Scrub_Typhus (PR #9006): "Multi-Organ Vascular Leak -> Requirement for Cell-Penetrant
        Antimicrobials" ("organ failure is what makes prompt therapy urgent"), and
        "Eschar Formation -> Multi-Organ Vascular Leak", whose own description conceded "it is
        not itself the cause of organ failure".
      - Purine_Nucleoside_Phosphorylase_Deficiency (PR #9008): two edges into the HSCT node
        describing why transplantation matters rather than what causes what.
    Both of those PRs are being corrected in the same pass. Worth recording as a recurring
    trap: a therapeutic_vulnerability or consequence node invites an edge that explains why
    the clinician cares, which is exactly what a causal edge must not encode.

    SUGGESTIONS: modifier-gene scoping note added to `notes:` per suggestion 1, so the
    omission is auditable rather than looking like under-consumption. MATCH registry and a
    second animal model deferred - both are additive rather than corrective, and the
    modifier-gene figures still have no quotable source.

    Validation actually run and read:
      just validate                -> All validations passed
      just validate-terms          -> Validation passed
      just count-verified-snippets -> 65/65 verified
      just check-duplicate-keys    -> OK

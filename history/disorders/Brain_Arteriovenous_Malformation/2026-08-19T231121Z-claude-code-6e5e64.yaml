  summary: 'Create: Brain arteriovenous malformation (MONDO:0007154)'
  details: |
    New disorder entry for sporadic brain arteriovenous malformation (MONDO:0007154).
    Claimed via issue #9000 off the priority dashboard (CURATE_ROOT, score 71.5, no NEC
    risk badge).

    Deep research: `just research-disorder falcon Brain_Arteriovenous_Malformation`
    (Edison/Falcon, research/Brain_Arteriovenous_Malformation-deep-research-falcon.md).
    Three gates:
      Gate 1 - report reference_validation: 13 references, 12 resolved, 0 unresolved,
        0 off-topic, 1 unverifiable (not curated).
      Gate 2 - `just preflight-dr ... MONDO:0007154` returned SKIP because MONDO records no
        causal gene (correct: this is a somatic mosaic disease). Manual fallback was run and
        is notably informative here: the report's OMIM (108010) matches the MONDO xref
        exactly, and although the gene histogram showed rival genes (KRAS=13, ENG=9,
        EPHB4=9, ACVRL1=8, BRAF=7), inspection showed ENG/ACVRL1/EPHB4 appear only where the
        report discusses the HHT and CM-AVM syndromic differential and the genetic-testing
        panel. Disease-name counts confirm the centre of mass: bAVM=31 and "brain
        arteriovenous malformation"=29 versus "hereditary hemorrhagic telangiectasia"=1.
        Not NEC.
      Gate 3 - the entry was built from independently sourced and fetched references before
        the report landed; the report was then used as a structural cross-check. Its causal
        chain independently reproduced the curated pathograph.

    DR DEFECT FOUND AND AVOIDED. The report quoted the Winkler 2022 Science atlas abstract
    as "We illustrated an interplay between vascular and immune cells contributory to brain
    hemorrhage." The real abstract (PMID:35084939, verified against the fetched cache) reads
    "We illustrate the interplay between vascular and immune cells that contributes to brain
    hemorrhage." The DR string does not occur anywhere in the cached article - a
    category-2 (misquoted snippet) hallucination. The verified wording was curated instead.
    This is a concrete demonstration that the report's own reference_validation block passing
    does NOT imply its quoted snippets are accurate.

    Pathograph: 10 atomic nodes, 12 edges, single connected component, no orphans, all four
    biological_scale values (4 MOLECULAR). Chain: somatic KRAS/BRAF mutation in brain
    endothelium -> constitutive RAS-MAPK-ERK -> {aberrant angiogenic/Notch programme with
    loss of arteriovenous identity, glycolytic reprogramming via GLUT1/HK2, MEK-inhibition
    vulnerability} -> nidus with direct AV shunting -> {high-flow haemodynamics and venous
    hypertension, vascular inflammation and BBB junction loss} -> {seizure generation,
    rupture and haemorrhage}. The two routes to instability - haemodynamic and inflammatory
    - are modelled as separate parallel arms because the literature separates them.

    Module conformance: none declared, deliberately. The obvious candidate
    `sustaining_proliferative_signaling` is explicitly scoped as the first hallmark of
    cancer (Oncogenic Growth-Signal Lesion -> Growth-Factor-Independent Proliferation).
    Brain AVM shares the constitutive RAS-MAPK node but is not a neoplasm and produces a
    malformed vascular architecture rather than proliferative expansion, so conformance
    would import a neoplastic frame the disease does not have. Recorded in the entry notes
    with the attachment point a future non-neoplastic RASopathy / mosaic vascular
    malformation module would use.

    Scope: MONDO files this term under `hereditary disease`, which is misleading - the
    mutations are post-zygotic and absent from paired blood. Curated as the sporadic somatic
    disease and explicitly delimited from Hereditary_Hemorrhagic_Telangiectasia,
    Capillary_Malformation-Arteriovenous_Malformation_Syndrome and
    Cerebral_Proliferative_Angiopathy, all already in the KB.

    Frequency discipline: no phenotype carries a frequency band. Haemorrhage is an incident
    event with an annual rate (2.3%/yr overall; 4.8% ruptured vs 1.3% unruptured) not a
    cross-sectional proportion; the 80.4% seizure figure is from a surgical series of
    unruptured lesions only. Both are quoted in descriptions with their cohort context. A
    headache phenotype was drafted and then REMOVED because the only snippet available did
    not actually support the claim - the #8352 pattern.

    Two prevalence records are curated as ANNUAL_INCIDENCE with normalised rates: New York
    Islands 1.34/100,000/yr and Scotland 1.12/100,000/yr, deliberately both, because they
    independently reproduce each other in different health systems. Notes record that these
    are detection rates for a congenital lesion, not incidence of lesion formation.

    Discussions: `bavm-unruptured-management-controversy` (KNOWLEDGE_GAP) records the ARUBA
    trial versus the 2025 MATCH target-trial-emulation disagreement, with the registry
    result curated as REFUTE against the conservative-management position rather than
    smoothed over; and `bavm-mek-inhibition-translation` (HUMAN_MODEL_MISMATCH) records that
    the shunt-reversal evidence for MEK inhibition is zebrafish and that model systems test
    prevention while patients present with established lesions.


  summary: 'Address review on PR #9007: diagnosis section, embolization, ARUBA final
    follow-up, mural cells, animal model'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9007. All five blocking
    findings addressed plus all five suggestions.

    FINDING 1 - claim/evidence mismatch on "Focal neurological deficit". Correct call, and
    the fix went further than swapping the citation. The phenotype was bound to HP:0001269
    Hemiparesis while the name and evidence were about focal deficits generally. I first
    drafted a narrowing to "Hemiparesis" with a snippet I believed came from PMID:29298116 -
    then my own verification step showed that text is from the MONDO/Orphanet definition, NOT
    from the paper, and it does not appear in the cached abstract. Discarded it. The final
    version keeps the broad name, DROPS the term entirely (HPO has no general
    "focal neurological deficit" concept and HP:0012638 is far too coarse), keeps a free-text
    preferred_term with the reasoning recorded in the description, and cites two sources that
    actually name focal neurological deficits: PMID:41303829 and PMID:42138076.

    FINDING 2 - 13 of 29 fetched references uncited. Addressed, but the premise needs
    correcting on one point of fact. Those DOI_*.md files were written by the DR run's own
    reference-validation pass, not deliberately fetched by a curator - `just research-disorder`
    resolves the report's citations as a side effect - so an uncited one reflects what the
    report cited, not a curatorial relevance judgement. More importantly, an audit shows FIVE
    of the eleven named files are metadata stubs with `content_type: unavailable` and zero
    body text, so they cannot be quoted at all. That specifically includes the ARUBA final
    follow-up the review called "the direct answer" - its cache file has 0 bytes of content.
    The right fix was to resolve those DOIs to PMIDs and fetch real abstracts, which I did:
    PMID:32562682 (ARUBA final), PMID:34541474 (mural cells), PMID:31795902 (human RNA-seq),
    PMID:39125532 (4D-MRA), PMID:38700584 (BrafV600E mouse), all now cited. A `notes:` block
    records the scoping rationale for what remains unconsumed and why.

    FINDING 3 - embolization missing. Added, with NCIT:C15230 Embolization Therapy,
    therapeutic_modality DEVICE, target_mechanisms on the nidus node. Deliberately curated with
    a PARTIAL evidence item recording that only microsurgical resection showed a consistent
    haemorrhage benefit in the registry emulation, so embolization does not inherit resection's
    result.

    FINDING 4 - ARUBA final follow-up. Now cited (PMID:32562682). Both the conservative
    management treatment description and the surrounding framing were rewritten: the entry no
    longer rests on the 33-month interim horizon but reports the mean 50.4-month result (3.39
    vs 12.32 per 100 patient-years, HR 0.31, 95% CI 0.17-0.56) and states that what remains
    contested is generalisability beyond the enrolled population rather than durability. Also
    added TOBAS (NCT02098252), noting it enrols ruptured as well as unruptured lesions and so
    is structured against the generalisability criticism.

    FINDING 5 - no diagnosis section. Added, 4 entries: DSA as reference standard;
    non-contrast 4D-MRA with its accuracy figures and the contrast-avoidance rationale that is
    specifically important in a lifelong lesion needing repeated imaging; angioarchitectural
    grading, promoted out of treatment prose because grade is the operative determinant of
    whether intervention helps or harms; and somatic genotyping from lesion tissue or cfDNA,
    which is the diagnostic consequence of the entry's central mechanistic claim - a germline
    blood panel is negative in a patient whose disease is entirely genetically explained.

    SUGGESTIONS - all addressed:
      - NCIT specificity: NCIT:C15656 Neurosurgical Procedure and NCIT:C15358 Stereotactic
        Radiosurgery replace the generic parents.
      - therapeutic_modality BEHAVIORAL -> OTHER on conservative management, with the reason
        recorded inline.
      - Missing treatment_effect added to that treatment's target_mechanisms entry.
      - Animal model added: the endothelial BrafV600E mouse with THREE modeled_mechanisms
        links, each with limitations, readouts and evidence. The third link is the important
        one - PARTIALLY_RECAPITULATES against the MEK-inhibition node, because dabrafenib
        slowed progression when given early while efficacy against established lesions
        "remained uncertain". That is exactly the prevention-versus-reversal distinction the
        bavm-mek-inhibition-translation discussion argues in prose, now carried as a structured
        model claim.
      - Pathophysiology depth: added a "Deficient Mural Cell Coverage and Vessel Wall
        Instability" TISSUE node between the nidus and rupture, evidenced from the mural cell
        review and corroborated by human RNA-seq showing downregulated ECM and angiopoietin-TIE
        programmes. Graph is now 11 nodes / 13 edges, still one connected component, no
        orphans.

    NOT DONE: modifier genes (IL6/TNF/APOE). The review cited
    DOI:10.1007/s12975-014-0351-0 for these, but that cache file is a 687-byte metadata stub
    with no body text, and the PMID it resolves to (24930128) is a natural-history review whose
    abstract does not mention modifier genes at all. There is no verified snippet available, so
    curating them would be an unsupported claim.


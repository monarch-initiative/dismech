  summary: 'Address PR #7460 review: diagnosis, phenotypes, genetics, pathograph wiring'
  details: |
    Responded to the ai4c-reviewer REQUEST_CHANGES on PR #7460. Added a diagnosis section (WES route plus the ciliary cell-biology workup, and the critical normal-axonemal-TEM pitfall that distinguishes this RGMC disorder from axonemal PCD); added seven phenotypes (intellectual disability, anterior-predominant pachygyria, corpus callosum hypoplasia, axial hypotonia, otitis media, neonatal respiratory distress, ventriculomegaly), using the notes-only pattern where the detail is full-text-only and not quotable from the abstract; expanded the genetic block with the null-variant-class spectrum, complete penetrance, and consanguinity; wired the previously orphaned phenotypes into a single connected pathograph via downstream edges; reframed the situs-inversus claim as a mechanistic expectation; added an animal_models section (Trp73-null mouse) and a HUMAN_MODEL_MISMATCH discussion on the mouse-vs-human hydrocephalus discrepancy; added prevalence (CASES_IN_LITERATURE / ULTRA_RARE), a classifications block, and genetic-counseling plus rehabilitation treatments; fixed a sentence fragment; and reclassified the fetal-tissue IHC evidence to IN_VITRO. Term-drift guard: used HP:0001302 Pachygyria (NOT the DR-suggested HP:0007260, which is Type II lissencephaly). GeneReviews baseline reconfirmed NON-APPLICABLE: no TP73/CILD47-specific GeneReviews chapter exists (disease first described 2021). Validated: schema, terms, and references pass with 22/22 snippets verified.

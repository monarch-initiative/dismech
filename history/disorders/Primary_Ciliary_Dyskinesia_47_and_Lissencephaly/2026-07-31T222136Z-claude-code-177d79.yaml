  summary: 'Create: Primary Ciliary Dyskinesia 47 and Lissencephaly [CILD47, TP73]'
  details: |
    Created new disorder entry for CILD47 [MONDO:0030346, OMIM 619466], an autosomal-recessive TP73 motile ciliopathy combining a mucociliary clearance disorder with lissencephaly. Modeled a five-node pathophysiology chain from TP73 loss of function through impaired multiciliated cell differentiation [FOXJ1/RFX2], motile cilia deficiency and basal body mislocalization [conforms_to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction], to impaired mucociliary clearance; plus a parallel Cajal-Retzius/Reelin neuronal-migration arm to lissencephaly. Evidence anchored to Wallmeier et al. 2021 [PMID:34077761] with supporting mechanism papers [PMID:26947080, PMID:27257214] and the p73/Reelin Cajal-Retzius paper [PMID:15054064]. Deep research: falcon failed on API auth; used claude_code provider plus direct PubMed literature. Validated with just validate: 13/13 snippets verified, schema and terms pass; compliance 88.2 percent.

  summary: Review HMGCS2 deficiency evidence and clinical scope
  details: |
    Rebuilt the HMGCS2-deficiency record using current human cohort, biochemical, functional, and model-organism evidence. Separated the canonical human ketogenesis-failure pathway from mouse-only acetyl-CoA hyperacetylation, ACSL1 lipid-partitioning, and acetate-compensation findings; removed contradictory disease-wide frequency bands; tightened acute biomarkers, diagnosis, management, and metabolic differentials; regenerated PMID:35308163 through just fetch-reference for full-text support; and recorded unresolved expert questions in issue #6564. Schema, ontology, reference, graph, formatting, exact-quotation, and bibliography-closure checks passed. Two independent final reviews returned GO.

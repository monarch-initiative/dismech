  summary: 'Integrate assessed OpenScientist findings: 4HMP performance and mouse-to-human
    steatosis limits'
  details: |
    Integrated the QUALIFIED claims from the existing codex assessment of the OpenScientist report for hypothesis canonical_hmgcs2_ketogenesis_failure_model (the entry records this hypothesis under the renamed id canonical_human_hmgcs2_ketogenesis_failure; no second hypothesis block was added). Added PMID:25511235 (Pitt 2015) twice with a single consistent HUMAN_CLINICAL grading: to biochemical 'Urinary 4-hydroxy-6-methyl-2-pyrone' and to discussion gap_hmgcs2_biomarker_specificity_and_screening, quoting the combined adipate-plus-4HMP cutoff result (eight decompensation samples, positive predictive value 80 percent, 95 percent CI 35-100). Qualified the 4HMP context prose and the discussion rationale so the 33/35 acute-sample detection fraction is not read as a validated prospective sensitivity, which was the assessment's QUALIFIED disposition on claim four-hmp-performance. Added PMID:35421611 to the Preclinical Hepatic Acetyl-CoA and Lipid-Handling Changes downstream edge to Hepatic steatosis as a second mouse model with bidirectional loss- and gain-of-ketogenic-function arms, and PMID:40272888 to the HUMAN_MODEL_MISMATCH discussion gap_hmgcs2_mouse_to_human_acetyl_coa_translation, with a rationale clause recording that the human arms of that literature are metabolic steatotic liver disease rather than inherited HMGCS2 deficiency. Deliberately not integrated: PMID:37931961 (bicytopenia), because the assessment records that its molecular diagnosis rested on a homozygous variant of uncertain significance and should not establish an expanded phenotype; and PMID:37503004, because the assessment identifies it as the preprint of the already-cited PMID:40692014 and citing it would double-count one study. No treatment recommendation was added for L-carnitine or ketone ester, and hypothesis status values were left unchanged, per the assessment. No new assessment sidecar was written because openscientist-assessment-by-codex.yaml already exists.

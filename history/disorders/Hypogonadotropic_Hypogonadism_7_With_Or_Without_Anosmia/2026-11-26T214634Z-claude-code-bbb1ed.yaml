  summary: 'Create: Hypogonadotropic Hypogonadism 7 With or Without Anosmia (GNRHR)'
  details: |
    Created from the stub (entry_type decided as DISEASE: a MONDO leaf with one causal gene,
    which Kallmann_Syndrome declines as a subtype because GNRHR disease is normosmic).
    Curated as the disease half of a co-review with the GNRHR gene review in
    ai4curation/ai-gene-review (branch claude/gnrhr-hh7-coreview).

    Sources. 41 PubMed references were fetched with `just fetch-reference` and quoted from the
    cached text; all 140 snippets verify. The two founding reports (PMID:9371856,
    PMID:9425890) have no abstract in PubMed and were not used. The GeneReviews chapter
    (PMID:20301509) covers all isolated GnRH deficiency and is cited only for shared features
    and management. No ClinGen validity record for GNRHR is in the committed cache.

    Structure. Variant positions were computed, not recalled: UniProt P30968 and GPCRdb
    numbering checked against each other, PDB 7BR3 (human, inactive), PDB 9U4W (pig, active,
    mapped by alignment) and the AlphaFold model. The method, table and script are in
    docs/curation-notes/Hypogonadotropic_Hypogonadism_7-variant-structure-placement-2026-11-26.md.
    The first pass counted the hydrogen atoms present in 9U4W, which shortened distances to
    GnRH and Gq by up to about 1 angstrom; this was found by comparing with the companion
    analysis and corrected before the entry was committed. The companion had the same
    problem on the partner side and was told. After correction the two analyses agree on
    variant classes and on receptor-to-GnRH distances to within 0.3 angstrom. gnomAD v4.1 and
    ClinVar were queried on 2026-11-26.

    Terms. NCIT:C2275 (Human Chorionic Gonadotropin) failed the ChemicalEntityTerm enum and
    was replaced by CHEBI:81570. MGI:95790 (Gnrhr) was resolved through the Alliance API with
    `just check-gene-namespaces-online`.

    Deep research. The committed report is
    research/Hypogonadotropic_Hypogonadism_7_With_Or_Without_Anosmia-deep-research-claude_code.md,
    read after the entry had been written from the primary literature. Three earlier
    OpenScientist submissions did not produce one: the first was lost when the session worker
    restarted, the second (job cb11a251-4130-4fe8-87a7-27d25bf68990) was cancelled by its
    client after the default 3600 s, and a third with --param timeout=7200, plus a hypothesis
    exploration of dominant_negative_er_retention, had not returned.

    What the report added, each read back to its own source before use: the differential
    effect of Gln106Arg and Arg262Gln on the FSH beta promoter (PMID:12574221); the mild end
    of the spectrum in two brothers homozygous for Arg262Gln who presented as constitutional
    delay (PMID:16968799, the one identifier the report's own validation could not resolve,
    which resolved on fetch); constitutional delay and polycystic ovary syndrome as
    differential diagnoses (PMID:16968799, PMID:29182666, PMID:30476149); normal hormones and
    fertility in 43 Maltese heterozygotes for Gln106Arg, which is evidence against a single
    allele being sufficient (PMID:38196663); founder-allele status for Gln106Arg, Arg262Gln
    and Arg139His (PMID:26207952); and the FGFR1 co-variant family (PMID:17235395), recorded
    in notes as a candidate modifier rather than as digenic inheritance, because the GNRHR
    genotype is biallelic and one family cannot fix a mode of inheritance.

    What the report offered and was not used: figures attributed to OMIM or to a search
    summary rather than to an abstract; prevalence and ICD codes it did not retrieve; and its
    suggested GO term GO:0034975, which does not resolve. Its term-validation section reports
    8 label mismatches, all of which are the report writing "hp" instead of a term name, not
    wrong identifiers.

    Review round 1 (PR #19071, reviewer ai4c-reviewer). Added the GeneReviews
    diagnosis/testing and genetic-counselling citations, a reduced bone mineral density
    phenotype with edges from both sex-steroid nodes, and an investigational pharmacoperone
    treatment row; regraded two BACKGROUND quotes from OTHER to HUMAN_CLINICAL; removed the
    FREQUENT frequency on Azoospermia, which rested on a statement about normosmic CHH in
    general. The curation note holding the structural method and table was moved out of this
    PR to its own branch, claude/hh7-gnrhr-structure-note, because CI blocks a curation PR
    that touches docs/ without a scope-override label; the entry now points at the
    independent scripts in the ai-gene-review repository instead.

    Validation. `just validate-disorders`, `just count-verified-snippets`, `just
    check-genereviews --online` and the whole-repo gates in the CI step all pass.

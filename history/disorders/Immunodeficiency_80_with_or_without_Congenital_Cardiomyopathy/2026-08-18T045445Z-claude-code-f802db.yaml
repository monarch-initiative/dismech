  details: |
    Created de novo entry for MONDO:0030266 / OMIM:619313 (IMD80, MCM10 deficiency), resolving issue #8742. Deep research: ran 'just research-disorder falcon' (research/Immunodeficiency_80_with_or_without_Congenital_Cardiomyopathy-deep-research-falcon.md); its reference-validation summary reported 7/7 references resolved, 0 off-topic, 0.0 confabulation_rate. Ran 'just preflight-dr' against MONDO:0030266 -> PASS (MCM10 mentioned 55x, dominant gene; OMIM 619313 matches MONDO xref). All clinical/molecular claims sourced from the deep-research report were independently re-verified against the primary-literature cache (PMID:32865517, PMID:33712616, PMID:38262603, PMID:36809597) before being curated, rather than transcribed directly from the report. Two published kindreds only: an NK-cell-deficiency proband (compound het p.R426C/p.R582X, fatal CMV at 24mo despite BMT) and a three-sibling restrictive-cardiomyopathy family with splenic/thymic hypoplasia (compound het frameshift/splice-donor alleles). Pathophysiology chain: biallelic MCM10 hypomorphism -> chronic replication stress/genomic instability/telomere erosion -> lineage-specific arrest (NK precursor terminal maturation vs cardiac/lymphoreticular progenitor differentiation). Added a KNOWLEDGE_GAP discussion on why the two allele sets diverge phenotypically. Added two experimental_models entries (patient-iPSC and MCM10+/- iPSC NK differentiation) with modeled_mechanisms links. Added one treatments entry (bone marrow transplantation, PARTIAL support since it did not rescue the reported patient). No datasets block: 'just discover-datasets' returned only GENE_ONLY MCM10 replication-biology candidates, none disease-specific. Validation: just validate, just count-verified-snippets, and just validate-disorders (batched pre-PR sweep, matches CI) all passed, 30/30 snippets verified against cached references (PMID:32865517's cache includes full open-access text, PMC7524476). A red-team review subagent pass found one issue (missing sequelae edge from NK deficiency to CMV infection), which was fixed. Global compliance 80.2%.

  summary: Add evidence for IUIS Table 6 assignment; merge duplicate notes
  details: |
    IEI grouping review. classifications.iuis_category was 'innate immunity defect' with a notes line but no evidence. Added a verified evidence item citing PMID:32865517, which frames human NK cell deficiency as an inborn error of immunity impairing NK cell development or function - the basis for a Table 6 (intrinsic and innate immunity) rather than a combined-immunodeficiency assignment. The existing notes caveat, that the RCM-predominant genotype is not itself an immunodeficiency and the IUIS placement reflects the NKD-associated genotype specifically, was preserved and merged with the new material into one notes block. Classification value unchanged. The entry is now a member of the new Intrinsic and Innate Immunity Defect IEIs grouping. Validated: count-verified-snippets, validate, validate-terms, check-duplicate-keys.

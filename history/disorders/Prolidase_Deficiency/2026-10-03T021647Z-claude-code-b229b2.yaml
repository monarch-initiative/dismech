  summary: Add executable protocols and typed model divergences to an open gap
  details: |
    Adds a proposed experiment (pd_allele_panel_abundance_stability_catalysis) to the existing open gap pd_pathophysiology_unresolved, decomposing the single clinical residual-prolidase-activity figure into abundance, folding and catalysis across a patient allele panel. The uncoupling of severity from residual activity is what the gap records; clinical practice measures that activity as one number in erythrocyte or fibroblast lysate, in which low abundance of a catalytic enzyme and normal abundance of a dead one are indistinguishable. Carries three executable_protocols (Ginkgo Cloud Lab, the first use of that new slot), three readouts, a decision criterion, and a declared cell-free model system whose shortfalls are recorded as two typed BOUNDARY_OMISSION divergences rather than as prose: the reaction excludes the cytosol in which prolidase is proposed to act non-enzymatically, and a bacterial extract supplies no human chaperones, which bears on the folding readout specifically. The amount-versus-activity axis this turns on is deferred in design decisions section 12 and is not settled here. No new references, snippets or disease claims; the only new ontology binding is NCBITaxon:9606 on the model system.

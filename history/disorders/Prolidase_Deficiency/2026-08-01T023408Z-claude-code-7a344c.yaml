  details: |
    New disease entry curated for IEMbase metabolic work package WP-006 (row 2.2.08.01, PEPD / OMIM:170100), created by the automated curation scanner. NEC preflight per CLAUDE.md section 2b was run first: MONDO:0008221 carries RO:0004003 HGNC:8840 (PEPD) and xref OMIM:170100, both matching the seed row, and the synonym set (hyperimidodipeptiduria, imidodipeptidase deficiency) shows no eponymic collision. Curated a 9-node pathograph splitting the disorder into its two mechanistic arms: the canonical collagen-recycling/matrix-remodelling arm (PEPD catalytic loss to impaired proline recycling to defective matrix remodelling and wound healing to chronic cutaneous ulceration), a parallel biomarker branch (imidodipeptide accumulation/imidodipeptiduria), and an EMERGING immune-dysregulation arm (spontaneous T cell activation, enhanced inflammasome activation to systemic autoimmunity) modelled with INDIRECT_UNKNOWN_INTERMEDIATES edges and two mechanistic_hypotheses groups. 19 phenotypes: 15 carry a frequency band derived from explicit numerator/denominator figures in the PMID:32455636 systematic review; the remainder are deliberately left unbanded, or share a pooled band, because the sources give no independent denominator. Two discussions record the open questions: a KNOWLEDGE_GAP for the unresolved multisystem pathophysiology (severity uncoupled from residual enzyme activity and metabolite level) and a HUMAN_MODEL_MISMATCH for whether the Pepd-null mouse T-cell mechanism translates to human autoimmunity, each with three structured proposed_experiments. No conforms_to asserted: not an intoxication-type decompensation, and no collagen-recycling module exists yet. Validated: schema validate pass, validate-terms pass, validate-references 71/71 snippets verified against cached references fetched with just fetch-reference.

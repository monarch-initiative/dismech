  details: |
    Self-caught instance of the same defect the reviewer found on PMID:41721156. PMID:38769304 is also cached as full text on this branch, and only its abstract had been mined.

    Its body carries the primary clinical description of the two siblings this entry already cites. That upgrades microcephaly from OTHER, where the only evidence was PMID:41721156 restating another group's patients, to HUMAN_CLINICAL from the group that reported them; the secondary item is kept alongside with its explanation now pointing at the primary. It also adds rotatory nystagmus and axial hypotonia, both from the same sentence.

    The introduction also quantifies the functional deficit at roughly 30-50 percent reduced charging activity in patient fibroblasts across the EPRS1 and RARS1 variant sets, which is added to the Reduced EPRS1 Protein node — that node previously asserted a reduction with no magnitude attached.

    Found while cleaning staging files after a stop-hook prompt, by diffing a local cache copy against the branch copy and noticing the branch had been upgraded to full text.


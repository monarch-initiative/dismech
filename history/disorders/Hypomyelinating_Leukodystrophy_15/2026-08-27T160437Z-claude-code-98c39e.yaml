  summary: Mine the PMID:41721156 full text this PR already fetched
  details: |
    The reviewer's remaining blocker was fair: the previous commit upgraded PMID:41721156 from abstract_only to full text and then mined only the abstract. The body carries a Table 1 covering all eight published biallelic-EPRS1 patients plus a synthesis discussion, none of which had been read.

    Added four phenotypes, all quotable from that cache file: cerebral white matter atrophy (7 of 8 patients), cerebellar atrophy (5 of 8), microcephaly, and seizures. Grading differs by provenance within the same paper. The MRI sentence is the authors' own patient, so HUMAN_CLINICAL. The microcephaly and domain sentences are the paper restating Khan et al. and summarizing the published series, so OTHER — the same secondary-restatement treatment already applied to PMID:33805425 in this entry. The cerebellar item is PARTIAL because the quotable sentence names cerebral white matter while the cerebellar involvement sits in the table rather than in prose.

    The more valuable half of the finding was the domain-phenotype sentence, which is now a fourth mechanistic_hypotheses group rather than only a phenotype. EPRS1 is bifunctional, and the series associates ProRS-domain variants with the typical hypomyelinating imaging pattern and GluRS-domain variants with seizures, deafness and less obvious hypomyelination. That is an axis of variant non-interchangeability independent of the three already curated: those distinguish how a variant lowers EPRS1 function, this distinguishes which of the enzyme's two functions is lost. Status EMERGING, evidence PARTIAL, because the source hedges explicitly and rests on eight patients.

    Snippets were extracted programmatically again — the microcephaly sentence contains a non-breaking hyphen and an en dash inside Zn2+-binding-domain that hand-typing would silently normalise.

    44/44 snippets verified; graph rebuild shows no dangling targets and a single root; all gates pass; no new cache rows.

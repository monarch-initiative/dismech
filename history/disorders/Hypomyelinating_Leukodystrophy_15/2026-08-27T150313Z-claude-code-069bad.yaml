  summary: 'Create: Hypomyelinating Leukodystrophy 15'
  details: |
    Curated MONDO:0054782 as a Disease entry from three primary references (PMID:29576217 original HLD15 identification, PMID:38769304 m6A accessibility mechanism, PMID:33805425 R339X aggregation in oligodendroglial cells). 20/20 snippets verified; term validation passed.

    Three mechanistic_hypotheses groups rather than one pathway. The literature offers a unifying reduced-translation-capacity model plus two variant-specific routes (m6A site masking impairing mRNA export/translation; polymeric aggregation of mutant protein blocking oligodendroglial differentiation). The second is a gain-of-toxic-function that a pure loss-of-capacity model does not predict, so collapsing them would lose a distinction that bears on whether a translation-directed therapy would help every patient. All three are status EMERGING.

    Evidence grading note for reviewers: the clinical phenotype list (optic atrophy, dysphagia, dystonia, ataxia, spasticity) is graded OTHER, not HUMAN_CLINICAL, because it comes from the introduction of PMID:33805425 — a cell-biology paper restating those features and citing other work, with no patients of its own. The same paper's own experiments are graded IN_VITRO. Two gradings from one paper is the intended behaviour of the split-by-evidence_source rule. A curator with the primary clinical cohorts should regrade and cite them directly.

    Entry named per the Hypomyelinating_Leukodystrophy_7/_10 convention rather than the MONDO label word order; the MONDO label is used verbatim in disease_term and kept as a synonym.

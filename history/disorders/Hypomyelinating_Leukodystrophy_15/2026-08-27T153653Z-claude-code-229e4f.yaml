  summary: Address review findings 1-8 on PR 9670
  details: |
    Addressed all eight blocking findings.

    The most substantive was finding 3: pathophysiology node 1 bundled the genotype with its molecular consequence, and that bundling had inverted an edge. The entry read reduced-EPRS1-protein causing the m6A defect, where PMID:38769304 reports the m6A accessibility defect causing the protein reduction. Split into Biallelic EPRS1 Variants (branching to the two variant-specific routes) and a separate Reduced EPRS1 Protein node downstream of the m6A node. The aggregation branch now bypasses the reduced-protein node entirely, which is correct: it is a gain-of-toxic-function route, and hanging it beneath a loss-of-protein node was the exact conflation this entry argues against. The blanket functional_impact_category on the old node is gone; PMID:33805425 explicitly leaves open whether R339X is loss or toxic gain of function, so the category is per variant now.

    HP:0002079 Hypoplasia of the corpus callosum was the wrong binding for a phenotype named and sourced as thin corpus callosum; HP:0033725 Thin corpus callosum exists and is used in 30 other entries. Hypoplasia asserts developmental underdevelopment, which the source does not claim.

    Pathograph now reaches the phenotypes. Added experimental_models for both cell systems with modeled_mechanisms, readouts and limitations, which moves the only therapeutic handle in the entry out of a free-text description and gives the HUMAN_MODEL_MISMATCH discussion something structural to attach to. Added references and OMIM:617951 external_assertion (the ID was in the cached source text). Added hearing loss, visual loss and amblyopia, all from sentences already quoted in the file. Added four variants, since the entry's central thesis is that variants are not interchangeable. Added the MSC-assembly negative result as a PARTIAL item against the unifying hypothesis it qualifies, plus symptomatic treatments and a diagnosis block.

    parents named Hypomyelinating Leukodystrophy, which matches no entry or grouping in kb/; corrected to the descriptive form the sibling HLD10 entry uses.

    Orphanet was not consulted and cannot be: just refresh-orphadata fails because the pinned checksums are for the 2025-12-09 snapshot while Orphadata now serves 2026-06-23 at the same URLs. Recorded in notes and filed as issue 9687.

    39/39 snippets verified; schema, term, entity-ref, duplicate-key, three baseline gates and the model-readout pytest lane all pass. No new cache rows.

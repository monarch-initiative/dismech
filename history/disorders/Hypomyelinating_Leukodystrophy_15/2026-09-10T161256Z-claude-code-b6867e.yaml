  details: |
    Item 6: replaced the Cerebellar Atrophy evidence snippet, which had been sharing a Table 1 imaging row with patients 3, 4, 6 and 7 (all previously published by other groups) and so overstated the HUMAN_CLINICAL grade, with patient 8's own row ('hypomyelination; cerebellar atrophy; corpus callosum thinning', marked *The present case in the source), which is a verified unique substring of references_cache/PMID_41721156.md. Item 7: the originally proposed replacement snippet for Cerebral White Matter Atrophy evidenced only patients 1-2's row, not the 6-of-8 tally the description claims, so instead of swapping the snippet I reworded the description to state plainly that the 6-of-8 count is a curator aggregation read off the whole Table 1 column (patients 1,2,3,4,6,7; patient 5 has cortical atrophy instead) rather than a claim any single quoted sentence carries, and flagged the narrative-vs-table discrepancy for patient 8 (narrative says extensive cerebral white matter atrophy; that patient's own table row does not list supratentorial atrophy). Also added a second evidence item, graded OTHER, quoting patients 1-2's row to show the finding recurs beyond the index case. Item 8: trimmed the p.Leu1144Val snippet to drop the trailing ', without second variant.' clause (true of the whole-exome-sequencing step alone, misleading out of context) and extended the explanation to state the second allele -- the 220-bp exon-15 deletion -- was found later by whole-genome sequencing, making this a compound-heterozygous genotype rather than the monoallelic finding the untrimmed quote could be read as. Noted but did not fix: this file (like several others in the KB) still has several explanation strings referencing the retired supports: PARTIAL enum value migrated away in #10003; that is pre-existing, whole-KB technical debt CLAUDE.md documents as deliberately out of scope for an incremental curation PR, not something introduced or required by this issue.

  details: |
    Review round follow-up on #11600, finding 1, applied by the PR Shepherd agent.

    Regraded the Table 1 evidence item on the Cerebral White Matter Atrophy phenotype from evidence_source: OTHER to HUMAN_CLINICAL. The previous explanation grounded OTHER in the observation being "a restatement of another group's observation rather than this paper's own". Secondhand-ness is not what evidence_source measures: CLAUDE.md states it classifies the type of evidence presented in the cited publication, and HUMAN_CLINICAL covers human patients, cohorts and case reports. A Table 1 row carrying two human patients' imaging findings is human clinical evidence whoever first published those patients. The inconsistency was visible inside the file: patient 8's row from the same table in the same paper is graded HUMAN_CLINICAL two phenotypes further down.

    The scope caveat that was bundled into the same explanation is kept: this row evidences the finding's recurrence beyond the index case, not the 6-of-8 tally, which remains a curator aggregation stated in the description.

    Also restated the Cerebellar Atrophy explanation. The retarget to patient 8's unique Table 1 row is a genuine improvement and stands, but it was justified as correcting a claim that "overstated the claim at HUMAN_CLINICAL grade". The actual problem was snippet specificity - the earlier quote was a string shared with patients 3, 4, 6 and 7, so it did not identify the patient the claim was about. Both quotes are human patient-level imaging findings, so no grade question arises. The explanation now says that.


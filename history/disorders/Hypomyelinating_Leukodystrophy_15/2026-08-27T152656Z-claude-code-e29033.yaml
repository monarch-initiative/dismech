  summary: Add deep-research report and the 2026 EPRS1 exonic-deletion case
  details: |
    The Perplexity run that had failed on API disconnects succeeded on retry; report and citations sidecar added.

    Its one genuinely useful lead was PMID:41721156 (2026), which was not in the cache and which materially widens this entry. It reports the first EPRS1 exonic deletion and, more importantly, a 40-year-old woman with only mild intellectual disability who did not come to neurological attention until her thirties. The entry previously described HLD15 as a severe childhood disorder; that is the typical presentation but not the spectrum, and the description, a PARTIAL-graded phenotype counterpoint, and notes now say so. The RT-PCR result showing the deletion allele is degraded by nonsense-mediated decay is added to genetic as a concrete instance of the reduced-EPRS1 mechanism.

    As with the other reports in this run, none of the deep-research phenotype term suggestions were adopted. Of the 14 HP CURIEs it proposed, several are not HLD15 features (HP:0000603 Central scotoma, HP:0000716 Depression, HP:0000739 Anxiety, HP:0003758 Reduced subcutaneous adipose tissue). The report's own reference_validation block reads confabulation_rate 0.0, which is accurate for references and says nothing about ontology terms.

    23/23 snippets verified; schema, term, entity-ref, duplicate-key and the three baseline gates pass.

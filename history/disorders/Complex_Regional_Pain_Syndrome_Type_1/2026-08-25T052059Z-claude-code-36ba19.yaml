  summary: 'Create: Complex Regional Pain Syndrome Type 1 (MONDO:0011441)'
  details: |
    De novo curation of MONDO:0011441 (complex regional pain syndrome type 1).

    Deep research: claude_code provider (research/Complex_Regional_Pain_Syndrome_Type_1-deep-research-claude_code.md), 31 references, all resolved (confabulation_rate 0.0), needs_review=true for two off-topic PMC references which were not used. just preflight-dr returned SKIP because MONDO records no causal gene; disease identity was checked manually against the MONDO/ORPHA:83452/OMIM 604335 record and the type-1 vs type-2 distinction.

    Content: seven pathophysiology nodes (peripheral tissue trauma; neurogenic inflammation; autoantibody production against autonomic receptors; central sensitization and spinal glial activation; sympathetic vasomotor dysregulation; cortical somatosensory reorganization; regional bone loss) under three mechanistic hypothesis groups (aberrant host response, autoimmune, maladaptive neuroplasticity). Eight phenotypes across the four Budapest domains, one susceptibility gene entry (HLA-DQB1, no evidence item, see below), one environmental exposure with an influences_mechanisms link, prevalence and incidence recorded as separate measures from the Olmsted County population study, progression, clinical burden VARIABLE, two diagnosis entries, three treatments (neridronate, graded motor imagery/mirror therapy, vitamin C prophylaxis), the CRPS IgG passive-transfer mouse model with two modeled_mechanisms links and readouts, one differential diagnosis (CRPS type 2), and three discussions.

    Ontology-binding note: the deep-research report proposed several IDs that resolve to unrelated terms in the current releases (UBERON:0006459 for primary somatosensory cortex, CL:0000636 for sympathetic neuron, CL:0000850 for C-fibre neuron). Every binding was re-resolved with OAK against the local release; the report's suggested IDs were not used. Recorded in the entry notes.

    Deliberate omissions: claims whose sources resolved only to journal/PMC URLs were left uncurated — HLA-DQ8 and the ANO10/P2RX7/PRKAG1/SLC12A9 candidate SNPs (HLA-DQB1 curated as SUSCEPTIBILITY with a note plus a CURATION_TODO discussion; the SNPs not curated at all), sex-ratio and age-distribution figures, S1 functional-connectivity and M1 disinhibition findings, the CPIP and tibia-fracture rodent models, the pediatric prognosis series, and the sympathetic-block/spinal-cord-stimulation evidence.

    Two snippets initially drafted from the deep-research narrative failed verification against the cached abstracts and were replaced with exact quotes (graded motor imagery review PMID:27858687; vitamin C trial PMID:17606778), and the entry prose was corrected to the trial's actual figures.

    Validation: just validate (47/47 snippets verified), just validate-terms, just validate-disorders, just compliance (87.6% global), the offline gates (duplicate keys, snippet length, folded hyphens, title snippets, environmental evidence), and the entity-reference/foreign-key/environmental-target pytest selection (16285 tests).

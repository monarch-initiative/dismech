  summary: 'Review response: CRPS Type 1 (PR #9458)'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9458.

    The review's central finding was correct and matched the same error found on PR #9455: the entry's notes justified several omissions on the grounds that no citable source existed, while the deep-research run's reference validation had already cached those sources in the same commit. Seven are now curated and the notes record the mistake.

    Split the bundled node. `Central Sensitization and Spinal Glial Activation` is now two nodes — `Spinal Glial Activation` (CELLULAR, keeps the microglia/astrocyte cell types and the GO terms) feeding `Central Sensitization` (ORGANISM, NMDA-dependent). The split is what makes the treatment links precise: IL-1 blockade acts on the glial node, ketamine on the sensitization node. All downstream targets, modeled_mechanisms targets, readout targets, and discussion attaches_to references were retargeted.

    Added intravenous ketamine as a treatment (PMID:19783371, randomized double-blind placebo-controlled, placebo arm showed no effect in any parameter), linked to the new Central Sensitization node, and bounded with the 2025 RCT systematic review's "strong short-term analgesia ... lack of long-term data" (PMID:40917914).

    Added the negative MR spectroscopy result (PMID:31980452) to the maladaptive-neuroplasticity hypothesis as REFUTE evidence: it refutes the cortical-disinhibition-through-reduced-GABA account specifically, while the same study independently replicates the tactile acuity deficit, which is curated as SUPPORT. The hypothesis stays CANONICAL for the map change and explicitly not for a GABA mechanism.

    Added the rodent tibia fracture model (PMID:29684510) with two modeled_mechanisms links and readouts, plus a HUMAN_MODEL_MISMATCH discussion for the point the review flagged: the model reproduces early CRPS but most post-fracture changes resolve within five months, so it may not contain the mechanism that makes human CRPS chronic.

    Also added: autoantibody prevalence quantifying the subset the entry hedges about (PMID:25741131, 33% ANA-positive of 82 patients); three-phase bone scan diagnostic accuracy against Budapest-criteria diagnosis (PMID:24900016, 80%/72%), including the point that decreased periarticular uptake is as informative as increased; long-term residual disability for the clinical_burden rationale (PMID:39315115); and a paediatric progression phase (PMID:27130211). Applied the reviewer's two smaller suggestions: the cortical reorganization node is now biological_scale TISSUE, and HP:0004370 carries a notes line explaining that it is broader than the claim but that HPO has no better term.

    Validation after changes: just validate (63/63 snippets verified, up from 47), validate-terms, validate-disorders, duplicate-key/snippet-length/title-snippet gates, compliance 87.4%, and the entity-reference/foreign-key/model-readout pytest selection (16283 tests).

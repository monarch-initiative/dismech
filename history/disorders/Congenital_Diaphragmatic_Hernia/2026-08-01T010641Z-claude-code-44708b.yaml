  summary: 'Create: Congenital_Diaphragmatic_Hernia'
  details: |
    De novo curation of congenital diaphragmatic hernia (MONDO:0005711) resolving issue #7471. NEC preflight was run against sqlite:obo:mondo (definition, Orphanet:2140, OMIMPS:142340, ICD10CM:Q79.0 and the CDH synonym all confirmed) before any deep-research content was used. Deep research was performed with the Edison Scientific falcon provider via "just research-disorder falcon Congenital_Diaphragmatic_Hernia" (725 s, 47 citations, 1 artifact); the report and citations sidecar are committed under research/. Falcon output was treated strictly as leads: every PMID was independently re-fetched with "just fetch-reference" and every snippet verified as an exact substring of the cached abstract, with no hand-editing of references_cache. Curated a 7-node connected pathograph (retinoid and pleuroperitoneal-fold mesenchymal deficit, to failure of diaphragm closure and visceral herniation, branching into pulmonary hypoplasia and pulmonary vascular maldevelopment, converging on persistent pulmonary hypertension of the newborn, right ventricular failure and refractory hypoxemia), 5 subtypes (Bochdalek, Morgagni, central, isolated, syndromic), 17 phenotypes, 8 genes (ZFPM2, GATA4, NR2F2, WT1, MYRF, LRP2, STRA6 as CAUSATIVE; LONP1 as RISK_FACTOR), 7 treatments (FETO, gentle ventilation, inhaled nitric oxide, sildenafil, milrinone, ECMO, delayed repair), structured prevalence, polygenic inheritance, two mechanistic hypotheses (dual-hit and retinoid), and two discussions (an iNO-efficacy CONTROVERSY and a rodent-model HUMAN_MODEL_MISMATCH). Declared conforms_to against pulmonary_vascular_remodeling for the pulmonary-hypertension arm, with the scope limit recorded in notes. Validation: just validate passed for schema and terms, just validate-references verified 84 of 84 snippets, scripts/check_folded_hyphens.py passed, compliance was 88.3 percent global and 88.6 percent weighted, and the structural subset of tests/test_data.py (5145 tests) passed. A pre-PR red-team review pass was run and its findings applied, including a ten-fold rate_per_100000 unit error on all prevalence records, a LONP1 mechanism and CODAS misattribution, evidence_source normalization for two review articles, and several SUPPORT to PARTIAL downgrades.

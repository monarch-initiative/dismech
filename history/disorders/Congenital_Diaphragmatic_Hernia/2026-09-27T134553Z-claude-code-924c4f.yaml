  summary: 'Genetics pass: wire 11 genes to nodes, add ALDH1A2, bind DIH3/DIH4 subtype
    rows'
  details: |
    Genetics-gap pass for issue #12268 (d2g series-061), parent 1 of 7.

    Measurement. Gene-to-mechanism wiring was measured with
    dismech.qc_plugins.gene_mechanism_wiring_coverage, which builds the causal
    graph and so reads the gene, gene_term, genes and genetic_context slots
    together. This entry started at 0/11: every causal gene had a bound gene_term
    and none reached a pathophysiology node. Phenotype inlink
    (causal_inlink_coverage) was already 19/21 and is unchanged.

    Wiring. Eleven existing genes were bound as genes descriptors on the node each
    acts at, and a twelfth gene was added, giving 12/12. ZFPM2, GATA4, GATA6,
    NR2F2, WT1 and STRA6 went to the retinoid and pleuroperitoneal-fold node, whose
    own description and evidence already named four of them; PBX1, SLIT3, MYRF and
    LRP2 to the diaphragm-closure node; LONP1 to the pulmonary hypoplasia node,
    because the only mechanism reported for it is a lung-growth deficit from
    deletion restricted to lung epithelium. Seven node-level evidence items were
    added so each gene placement rests on a quoted sentence rather than on the
    gene's presence elsewhere in the entry.

    New gene. ALDH1A2 was added to genetic as CAUSATIVE with autosomal recessive
    inheritance bound to HP:0000007. The entry previously carried a notes paragraph
    stating that no human variant evidence implicated ALDH1A2 in CDH. That was
    false: PMID:33565183 reports biallelic hypomorphic variants causing a recessive
    malformation syndrome with diaphragmatic, pulmonary and cardiovascular defects,
    and PMID:36263470 adds an independent sibship. The paragraph was rewritten to
    separate the two distinct ALDH1A2 claims the entry now holds - the expression
    finding at the node, which the cited study reads as secondary to lung injury,
    and the germline gene-disease claim - rather than deleted.

    Subtype rows. DIH3 (MONDO:0012431, ZFPM2) and DIH4 (MONDO:0859571, ALDH1A2)
    were added with bound subtype_term and genes. Both carry review_notes recording
    that they are molecular designations cutting across the entry's anatomic and
    aetiologic rows, and that the founding human probands had diaphragmatic
    muscularization or eventration defects rather than true hernias, which the MONDO
    labels do not convey.

    MONDO reconciliation. MONDO:0012431 and MONDO:0859571 are now bound. The third
    checklist row, MONDO:0010606 hernia, anterior diaphragmatic (PLS3), is declined
    structurally: MONDO records nothing for that class beyond the PLS3 causal-gene
    axiom, so binding it to the anatomic Morgagni row would assert that anterior
    retrosternal hernia is the PLS3 disease. Its home is the existing stub
    stubs/Hernia_Anterior_Diaphragmatic.yaml.

    Anchor audit. MONDO:0005711 was checked against four tests. It is not
    over-broad and not reciprocally wrong. Its own definition text describes a
    posterolateral diaphragmatic defect, which is narrower than the class's own
    subtree, since the anterior-hernia child sits under it; the binding was kept
    and the mismatch recorded in notes, because the class's label, synonyms and
    children all support the umbrella reading the entry uses.

    Also. ZFPM2's only prior evidence was an enumeration naming four genes
    together, which supports a claim about the set rather than about the member. A
    gene-specific human variant item from the founding FOG2 report was added beside
    it. Two unsourced descriptors were softened during self-review: a
    "consanguineous" family for SLIT3 and "biallelic" for STRA6, neither stated by
    the cited sources.

    Validation: just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches --resolve
    (73/73 bindings compared against HGNC, no findings), the whole-repo gates
    including check-folded-hyphens, and validate-disorders.

  details: |
    Second review-response pass on PR #7495, layered on top of commit 16a70b8d86 (which had already added a prenatal-imaging diagnosis block, biological_scale, dual-hit hypothesis wiring and the two TOTAL clinical trials). Items from the REQUEST_CHANGES review still outstanding and now fixed: (2) the two phenotypes dropped from the already-quoted Zani survivor-morbidity sentence - Chronic lung disease (HP:0006528, FREQUENT; 41 percent BPD in day-30 survivors, PMID:21042035) and the musculoskeletal pair Scoliosis (HP:0002650, 18/98) and Pectus excavatum (HP:0000767, 16/98), both OCCASIONAL from PMID:31482324 - each given an incoming downstream edge; (3) two non-canonical attaches_to values changed to the pathophysiology#Node grammar; (4) Bochdalek hernia removed from synonyms since it is a subtype already modelled in has_subtypes; (5) the eight PMID:35650272 evidence items moved from OTHER to HUMAN_CLINICAL to match PMID:22214468. Item (1) diagnosis was already largely covered by 16a70b8d86; the missing genetic workup ladder was added as two further diagnosis entries, chromosomal microarray (NCIT:C18477) and trio exome or genome sequencing (NCIT:C101295), both from PMID:34911129. Suggestions applied: ALDH1A2 (hgnc:15472) added to the retinoid pathophysiology node as a pathway component with PMID:25416379 evidence, deliberately not as a genetic entry because the same study shows the overexpression is secondary to lung injury; GATA6 (PMID:24385578), PBX1 (PMID:29036646, PMID:22315423) and SLIT3 (PMID:33933663, typed RISK_FACTOR on single-family human evidence) added to genetic; a new Left Heart Hypoplasia in Left-Sided CDH pathophysiology node plus the Hypoplastic left ventricle phenotype (HP:0004383, PMID:28370263); a three-phase progression block including post-repair recurrence (46.7 percent patch versus 6.3 percent muscle flap, PMID:40834916); a biochemical entry for circulating small-RNA severity biomarkers (PMID:39505208); and clinical trial NCT06179472 alongside the two TOTAL arms. All reference cache files fetched with just fetch-reference. Validation: just validate PASS, 143 of 143 snippets verified, term validation PASS, folded-hyphen check clean, 3427 targeted pytest data tests PASS.

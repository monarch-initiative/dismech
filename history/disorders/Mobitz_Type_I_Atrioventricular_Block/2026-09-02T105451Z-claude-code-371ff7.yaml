  summary: 'Pathograph repair: wire phenotypes into the causal graph (1/4 -> 3/4)'
  details: |
    Pathograph review and repair as part of a systematic pass over the non-Mendelian cardiac entries. The mechanism layer was already wired; the clinical manifestations were curated as a list that never entered the causal graph.

    Phenotypes reached by a causal edge went from 1 of 4 to 3 of 4. Edges went from 7 to 13 over 10 nodes, and isolated nodes from 2 to 0.

    Added mechanism-to-phenotype downstream edges, phenotype sequelae, reports_on readouts for investigation and test-result phenotypes, treatment target_mechanisms links, environmental influences_mechanisms links with an explicit environmental_effect, and biomarker readouts, as each entry required. No node was renamed, added, deleted or reordered, and no ontology binding was touched.

    Evidence discipline: every new edge carries a description. No PMID, snippet or reference title was invented. An evidence block appears on a new edge only where an item already present in this file supports that specific edge.

    Validated with linkml-validate against the Disease class plus check_causal_targets, check_entity_refs, check_duplicate_yaml_keys and check_enum_values.

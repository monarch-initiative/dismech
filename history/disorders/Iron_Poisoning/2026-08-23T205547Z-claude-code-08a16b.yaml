  summary: Split a compound evidence item so each half carries its own evidence_source
  details: |
    Acts on the single 🔵 from the round-10 review, which approved 276af1d3 with
    the full pytest suite (35859 passed, the whole file rather than a -k subset).

    THE OBSERVATION. The PMID:30598567 item added in 20d8227f quoted two
    consecutive sentences under one evidence_source: "Acute iron toxicity is
    usually seen in children with accidental ingestion of iron-containing
    syrups. However, the literature on acute iron toxicity with suicidal intent
    in adults is scant." The first is a generalization about patients, for which
    HUMAN_CLINICAL is right. The second describes the state of the literature,
    for which this branch has been tagging OTHER since 80b28ee. The item was
    HUMAN_CLINICAL throughout, and the PMID:21975503 literature-state item two
    entries above it in the same list is OTHER, so a reader moving between them
    could not tell which convention governed.

    The reviewer called it genuinely borderline and offered two resolutions:
    split the item, or keep it and name in the explanation which clause the tag
    covers.

    SPLIT, BECAUSE CLAUDE.MD ALREADY PRESCRIBES IT. The evidence-source section
    ends with an explicit edge-case rule: "If a paper mixes sources, split
    evidence items so each item gets a single evidence_source." That is this
    case exactly, one level down - not a paper mixing sources across sections
    but a single quoted passage mixing them across sentences. Annotating which
    clause the tag covers would have left one item making two kinds of claim,
    which is the thing the rule exists to prevent.

    Both sentences verified as independent exact substrings of the cache before
    splitting, and both are 14 words, so neither trips the five-word minimum.
    Each explanation now states its own tag and points at its companion, so the
    pairing is legible from either half rather than only from the one a reader
    happens to land on.

    A SMALL SELF-CORRECTION CAME WITH IT. The old explanation opened "States both
    halves of this entry's scope problem in one sentence". It was two sentences,
    and the miscount is not incidental: treating the passage as one sentence is
    the same mistake as treating it as one claim. The replacement text does not
    reuse the phrasing.

    Validation: just validate passes (schema: no issues; terms: passed). Snippets
    148/149 verified, up exactly 1, which is the arithmetic signature of a split
    rather than an addition: one item became two, the same text is quoted, and
    the total rises by one. All six ratchet gates and check-not4curation pass.
    Test subset (NOT the full suite): pytest -k "environmental or foreign or
    evidence_source" gives 6535 passed, 29324 deselected.

    Compliance 94.0%/94.3% to 94.1%/94.3%. The split adds one fully-compliant
    evidence item to the denominator and the numerator alike, so global ticks up
    a tenth and weighted is unchanged.

  summary: Curate PMID:39509998 and curate the conventional serum-iron thresholds
    as convention
  details: |
    PMID:39509998 / DOI:10.1016/j.ajem.2024.10.042 (Am J Emerg Med 2025), "Utility
    of iron concentration two to four hours post ingestion in predicting toxicity"
    - a 75-patient single-centre retrospective poison-centre series. Author-
    supplied as a DOI; resolved to a PMID via esearch before citing, for the same
    reason as the last two rounds, since DOI: sits in skip_prefixes and a
    DOI-cited snippet is never machine-checked.

    THIS REFERENCE UNBLOCKS SOMETHING THE ENTRY HAD DECLARED BLOCKED.

    Since the first commit this entry has refused to curate the conventional
    serum-iron toxicity threshold, and said why in two places: the consensus
    guideline that states it (DOI:10.1081/CLT-200068842) was fetched but cached
    with an empty body, so there was no verifiable snippet. The number was
    nonetheless already in the file, in the biochemical notes, as the uncited
    parenthetical "commonly taught as 500 microg/dL".

    This paper states both thresholds in its own background: 350 microg/dL with
    symptoms, 500 microg/dL without. That is quotable, so the entry now curates
    them - as two interpretation bands on the serum-iron biochemical entry, named
    for the conditional rule they encode, with the 350 band bounded at 500
    precisely because below 500 the convention depends on symptoms and at or
    above it does not. The bands partition cleanly against the existing 1700
    microg/dL hepatotoxicity band.

    WHAT THAT FIXES IS ATTRIBUTION, NOT VALIDATION, AND THE CURATION SAYS SO.
    The sentence is background, offered as the study's premise rather than as its
    finding, and phrased as what is traditionally considered toxic. So it is
    tagged OTHER and its explanation states that it attests the convention exists
    and takes this conditional form, not that either figure has been validated.
    The band interpretations say the same. The stale claim in the biochemical
    notes - that the threshold is deliberately not curated for want of a snippet -
    was rewritten rather than left to contradict the bands above it, and the same
    correction was made in the CONTROVERSY rationale, which asserted the entry
    "curates no numeric serum-iron chelation threshold". An entry that curates a
    threshold while still saying it does not is worse than one that does neither.

    EVIDENCE_SOURCE IS SPLIT WITHIN A SINGLE REFERENCE, DELIBERATELY. Two items
    from this paper are tagged OTHER (the threshold convention, and the general
    recommendation to draw the concentration at least 4 h post-exposure) because
    those sentences present no data. Three are tagged HUMAN_CLINICAL (the NPV
    result, the sensitivity/specificity cutoff, the conclusion) because those are
    the retrospective cohort's own findings. CLAUDE.md's rule is that
    evidence_source classifies the evidence presented in the publication, and in
    a structured abstract that is not uniform across the abstract.

    IT IS ALSO A THIRD VOICE IN THE serum_iron_versus_ingested_dose CONTROVERSY,
    AND IT LANDS WHERE THE PROPOSED EXPERIMENT PREDICTED. That discussion was
    added one commit ago with a proposed experiment whose specific hypothesis was
    that serum iron discriminates in the mild severity stratum while dose
    discriminates in the severe one. This paper stratifies by symptom severity
    and finds exactly the mild-stratum half: among patients whose symptoms stayed
    minor, a 2-to-4-hour concentration at or below 300 microg/dL was followed by
    no subsequent toxic concentration, NPV 100%. That is the predicted direction,
    arriving from a study run without reference to the prediction.

    It is recorded as narrowing the disagreement, not resolving it, and the four
    reasons are curated rather than left implicit: no severe stratum was
    analysed; the ingested dose was not compared against the concentration in the
    same analysis; the abstract does not report the age distribution of the 75
    patients, so it does NOT stand as a third paediatric cohort beside
    PMID:14722368 and PMID:34121325; and the specificity is 54%, so roughly half
    the patients the cutoff flags never reach a toxic concentration. That last
    figure is the one most easily dropped when quoting an NPV of 100%, and the
    explanation states the consequence plainly: a sensitive rule for whom to stop
    watching is not a rule for whom to chelate. The proposed experiment's
    description now names this paper as a partial instance of its own design and
    says which arms are still missing.

    A GENUINELY NEW DIAGNOSTIC DIMENSION: TIMING. The 4-hour sampling
    recommendation, and its stated reason - a concentration drawn before
    absorption is complete can be falsely low - was absent from the entry
    entirely. It matters mechanistically, not just procedurally: it means an
    early serum iron can under-read the exposure rather than measure it, which is
    a direct consequence of the absorption kinetics modelled by the ingestion
    node. Curated on the serum-iron diagnosis entry, whose description now
    carries the timing caveat alongside the three-way disagreement.

    TRANSCRIPTION: the lesson from the previous round was applied from the start
    rather than after four failures. This abstract carries 15 non-breaking spaces
    (U+00A0) between numbers, operators and units, plus U+2264/U+2265/U+03BC, so
    every snippet was extracted programmatically from the cache body by
    sentence-boundary search and interpolated into the YAML; none was retyped.
    All seven verified on the first attempt. The NPV snippet also spans a
    bracketed abbreviation, "[NPV]", which is KEPT rather than stripped because
    it matches the ^[A-Z]{2,} literal_bracket_pattern - checked against
    conf/reference_validator_config.yaml before quoting rather than discovered by
    a failure. The same snippet contains a stray repeated word in the source; it
    is quoted as printed and the explanation says so, rather than being silently
    tidied.

    The edit script asserted all six (then all four) anchors before writing any,
    and every change was grepped back out of the file afterwards, including
    negative greps for the three stale claims that had to disappear. That is the
    remedy adopted after the dropped-hunk failures earlier in this PR, and it
    caught one bad anchor here: the biochemical-notes hunk began mid-line, the
    assertion failed, and nothing was written until it was corrected.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 136/137 snippets verified, up exactly 7, the
    single skip being the pre-existing DOI:10.1177/0009922819901010 item. All six
    ratchet gates and check-not4curation pass. Test subset (NOT the full suite):
    pytest -k "conforms_to or foreign or discussion or reference_range or band"
    gives 6714 passed, 29145 deselected.

    Compliance RISES for the first time in this PR, 94.3%/94.6% to 94.4%/94.8%
    (248/263 to 255/270). The mechanism is the same one that caused the three
    previous falls, running the other way: seven fully-compliant evidence items
    were added and no new PROPOSED experiment, so this time the numerator grew
    faster than the denominator.

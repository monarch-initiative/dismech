  summary: Rename organelle-injury node, add lysosome, downgrade PMID:38867112 to
    NO_EVIDENCE, split experiment
  details: |
    Address four of the five blue suggestions from the ai4c-reviewer review of
    01b1d3a. The fifth (NCIT procedure terms, the ferric-hydrolysis acidosis arm, the
    direct-toxicity shock arm, and three cached-but-uncited references) is carried
    forward unchanged.

    NODE RENAMED. "Iron-Catalysed Oxidative and Mitochondrial Injury" ->
    "Iron-Catalysed Oxidative Organelle Injury". The 80b28ee curation of PMID:11978485
    had added lysosomes as a co-equal proposed proximate target to the node
    description, so the old name singled out one of the two organelles it now
    describes. Three sites updated together: the node name, the incoming causal edge
    target on the Non-Transferrin-Bound Iron in Plasma node, and the attaches_to
    reference in the ferroptosis KNOWLEDGE_GAP discussion. The full pytest suite
    (6684 selected tests, including the pathophysiology foreign-key and conforms_to
    reference checks) passes, which is what confirms no dangling reference was left.

    LYSOSOME ADDED TO cellular_components. The node carried only GO:0005739
    mitochondrion while its description and one of its three snippets are
    specifically about lysosomal destabilisation. GO:0005764 lysosome added
    alongside it.

    PMID:38867112 DOWNGRADED FROM PARTIAL TO NO_EVIDENCE. This is the more
    interesting of the four. The reviewer observed that the item's own explanation
    says the paper "does nothing to close this gap; if anything it shows how far the
    ferroptosis literature sits from the disease" - which contradicts PARTIAL, whose
    schema definition is "partially or indirectly supports the claim". NO_EVIDENCE
    ("the cited reference does not contain evidence relevant to the claim") is what
    the explanation actually describes. The paper is relevant to HOW the gap should
    be tested, not evidence ABOUT the gap, and NO_EVIDENCE with an explanation saying
    why it is cited at all is the honest encoding of that. Agreed and applied.

    PROPOSED EXPERIMENT SPLIT. The single experiment
    ferroptosis_markers_in_iron_poisoning_liver had accreted three separable
    questions across two commits: assay ferroptosis markers, assay lysosomal
    permeabilisation, and handle the GPX4/selenium confound. Split into
    death_route_discrimination_in_poisoning_liver (assay both candidate routes in the
    same tissue against a non-iron comparator, since a design assaying only one
    cannot discriminate) and gpx4_readout_validation_against_selenium_status
    (establish what GPX4 abundance measures before using it as an index, by
    measuring selenium status and selenoprotein-synthesis capacity in the same
    specimens). The old experiment_id no longer exists; nothing referenced it.

    COMPLIANCE DROPPED, EXPECTEDLY. 96.3% global / 96.7% weighted -> 95.6% / 95.9%.
    This is caused by the experiment split, not by a loss of content: each Experiment
    object has recommended datasets and evidence slots which are empty for a PROPOSED
    experiment, so going from one experiment to two adds two more unfilled
    recommended slots to the denominator. The drop is recorded here rather than
    bought back, because filling those slots would mean inventing datasets and
    evidence for experiments that have not been run.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 121/122 snippets verified, the single skip being the
    DOI: reference from 3b57d37. All six ratchet gates and check-not4curation pass.
    Full pytest suite: 6684 passed.

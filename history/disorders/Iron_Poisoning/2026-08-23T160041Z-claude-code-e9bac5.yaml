  summary: 'Curate PMID:14722368 paediatric cohort: frequency bands, and a REFUTE
    on serum iron'
  details: |
    Curate PMID:14722368 (Singhi et al., Indian Pediatr 2003), supplied by the PR
    author. A single-centre retrospective cohort of 21 paediatric acute iron
    poisonings over five years. It was not in the deep-research report and had not
    been fetched; it is the first real clinical cohort in this entry, and it does
    three things nothing else cited here could.

    1. FREQUENCY BANDS. Four phenotypes now carry an evidence-backed frequency,
    closing the reviewer's suggestion 5 for the phenotypes the cohort actually
    counted: Vomiting FREQUENT, Diarrhoea FREQUENT, Gastrointestinal haemorrhage
    FREQUENT, Acute hepatic failure OCCASIONAL.

    DENOMINATOR CHOICE, which changes the band: the paper reports vomiting at 83%,
    diarrhoea 72%, melaena 44%, haematemesis 33%. Those percentages are computed
    against the 18 SYMPTOMATIC patients, not the 21 poisoned ones (15/18 = 83%).
    Disease-level frequency in the HPO sense is the fraction of patients with the
    disease showing the feature, and all 21 had iron poisoning, so the bands here are
    derived against 21: vomiting 15/21 = 71% (FREQUENT, not the VERY_FREQUENT that
    83% would give), diarrhoea 13/21 = 62%, melaena 8/21 = 38%, haematemesis 6/21 =
    29%, acute liver failure 2/21 = 10%. Each explanation states the derivation and
    the cohort's size.

    Deliberately NOT banded: Shock. The cohort reports "Nine progressed to shock
    and/or impaired consciousness", which counts two features together and cannot be
    split, so per the frequency-evidence guidance no frequency was assigned. The
    sentence is still curated on the Acute hepatic failure phenotype for the liver
    figure, with a note saying why the shock half of it is unused.

    2. A DIRECT CONTRADICTION, CURATED AS REFUTE RATHER THAN RECONCILED AWAY. The
    cohort found "Dose of ingested iron and clinical signs were most useful guide to
    iron toxicity and management decisions; serum iron did not help." That is the
    reverse of what this entry already asserted from PMID:2870463 (serum iron is one
    of three inputs to the chelation decision) and PMID:3784842 (the ingested dose is
    unusable as a severity measure). Both positions are now curated on the Serum iron
    concentration diagnosis entry, the new one as supports: REFUTE, with a notes
    block saying plainly that the question is contested and this entry does not
    resolve it. The biochemical notes were updated to match, so the reference
    interval and the hepatotoxicity-associated concentration are framed as
    measurements rather than decision rules. This also raises the bar for the
    still-uncurated 500 microg/dL threshold: a curator adding it must treat this
    disagreement as its context.

    3. CLINICAL DETAIL AVAILABLE NOWHERE ELSE IN THE ENTRY.
    - Deferoxamine carries a PARTIAL caution: vin-rose urine was absent in 31% of
      chelated patients despite a high serum iron, so its absence is not evidence
      that chelation is unnecessary. This is a caution attached to the treatment, not
      support for it, and is marked as such.
    - Deferoxamine infusion plus shock support is confirmed as the mainstay.
    - Fluid resuscitation gains real outcome data: shock responded to saline plus
      dopamine in 7 of 9 children.
    - Stage Phase 3 gains the mortality association - shock, or acute liver failure
      with coagulopathy and/or severe acidosis, preceded all four deaths - with a
      notes block stating it is a description of the fatal cases in a four-death
      series, not a validated prognostic rule.
    - A second prevalence record gives iron's share of paediatric accidental
      poisonings at that centre (21 of 337), measure_type UNKNOWN with notes
      explaining it measures what fraction of poisoned children were poisoned by
      iron, not how common iron poisoning is.

    A first attempt put the mortality finding in a top-level progression: block;
    ProgressionInfo takes phase/duration, not name/description, so schema validation
    rejected it and it was moved onto the Phase 3 stage, which is that same feature
    combination and a better home anyway.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 116/117 snippets verified, the single skip being the
    DOI: reference from the previous commit, which skip_prefixes excludes and which
    was hand-verified there. All six ratchet gates and check-not4curation pass.
    Compliance 96.3% global / 96.6% weighted, up from 96.1/96.5.

    All eight snippets from this reference were confirmed as exact substrings of the

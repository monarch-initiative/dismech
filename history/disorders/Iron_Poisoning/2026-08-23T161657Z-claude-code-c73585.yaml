  summary: Curate PMID:11978485 organelle routes (PARTIAL); decline PMID:38867112
    as mechanism evidence
  details: |
    Two more author-supplied references. They were handled very differently, and the
    difference is the point of this record.

    PMID:11978485 (Eaton & Qian, Free Radic Biol Med 2002) - "Molecular bases of
    cellular iron toxicity". USED, but every item marked PARTIAL.

    This review supplies organelle-level detail the entry did not have: mitochondria
    and lysosomes as the intracellular targets of iron, the principle that iron may
    be preferentially toxic to cells with high mitochondrial activity, and a second
    route to cell death in which iron-catalysed oxidative destabilisation of
    lysosomes releases digestive enzymes into the cytoplasm.

    The catch, and the reason nothing from it is SUPPORT: its clinical frame is
    hereditary and secondary haemochromatosis, not acute ingestion. This is exactly
    the hazard the entry's own top-level notes warn about - MONDO:0800385 carries
    "iron overload" as an EXACT synonym, and literature reached through that phrase
    is usually about the chronic disorders. The three evidence items are therefore
    PARTIAL with evidence_source OTHER, and a new notes block on the
    Iron-Catalysed Oxidative and Mitochondrial Injury node states the extrapolation
    explicitly: these are cell-level mechanisms that do not depend on how the iron
    arrived, used because acute iron poisoning has no comparable mechanistic
    literature of its own.

    One arm of the same review is deliberately NOT curated and the notes say so: its
    proposal that iron-mediated damage to the mitochondrial genome accumulates
    mutational events is explicitly about LONG-TERM toxicity and cannot apply to a
    poisoning that kills within about 48 hours. Taking the whole abstract would have
    imported a chronic-disease mechanism into an acute entry.

    The lysosomal route also widened the ferroptosis KNOWLEDGE_GAP rather than
    filling it. The gap now records that there are at least two mechanistically
    distinct candidate death routes on offer - lipid-peroxidative ferroptosis and
    lysosomal rupture - and that the acute iron poisoning literature demonstrates
    neither. The proposed post-mortem experiment was rewritten to discriminate
    between them (cathepsin release and LAMP staining alongside the lipid
    peroxidation panel) instead of testing ferroptosis in isolation.

    PMID:38867112 / DOI:10.1038/s41594-024-01329-z (Fujita et al., Nat Struct Mol
    Biol 2024) - PRDX6 and selenium utilisation. NOT curated as mechanism evidence;
    used once, as an experimental-design caveat only.

    This paper is cell-line selenium biology: PRDX6 as a selenoprotein synthesis
    factor, whose loss lowers GPX4 and induces ferroptosis. There is no ingestion, no
    human subject, no poisoning. The "iron toxicity" of its title means ferroptotic
    death in culture, not the clinical syndrome - a second terminological collision
    of the same family as the "iron overload" synonym trap, and the reason it was
    declined as evidence for any mechanism claim in this entry.

    It was kept for one narrow and genuine contribution: the ferroptosis gap's
    proposed experiment had listed "GPX4 abundance" as a readout, and this paper
    shows GPX4 expression is set by selenoprotein-synthesis capacity. That makes a
    low GPX4 in poisoned liver ambiguous - it could reflect selenium status rather
    than iron-driven consumption. The experiment now says to treat GPX4 abundance as
    a confounded readout, measure selenium status alongside it, and prefer the lipid
    hydroperoxide products as the primary index. The single evidence item is PARTIAL
    / IN_VITRO and its explanation states outright that it is cited only as a caveat
    on how to test the gap, does nothing to close it, and if anything shows how far
    the ferroptosis literature sits from this disease.


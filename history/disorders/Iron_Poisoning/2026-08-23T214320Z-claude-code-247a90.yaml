  details: |
    Acts on the first of two round-11 suggestions, and carries the correction the
    second one asked for rather than adding a record of its own.

    1. THE COST OF THE SPLIT, PAID. 9188469a split a compound PMID:30598567 quote
    into two evidence items so each could carry its own evidence_source. The
    reviewer noticed the split had a side effect I had not weighed: the source
    sentence pair is contrastive, "X. However, Y.", and separating them stranded
    the "However" that made the first half relevant. Read alone, half one
    describes PAEDIATRIC ACCIDENTAL poisoning while sitting on the DELIBERATE
    ADULT self-poisoning exposure entry, still marked SUPPORT.

    It is now PARTIAL. The reasoning is in the explanation: the half supports
    this entry only by establishing the contrast that makes the adult deliberate
    route the uncommon one, which is a partial relationship to the claim rather
    than a direct one, and the companion item carries the half that bears on it
    directly.

    The reviewer explicitly declined to reopen this, on two grounds - the paired
    explanations cross-reference each other, and round 10 had already accepted
    the placement and polarity of the COMBINED item. The second ground is the one
    that argues for changing it anyway: round 10 accepted a polarity for an item
    that contained both sentences, and that item no longer exists. My split is
    what changed what the polarity applies to, so the polarity was mine to
    revisit.

    2. A LOCATOR ERROR IN THE PRECEDING RECORD, CORRECTED HERE. The record
    2026-08-23T205547Z-claude-code-08a16b.yaml describes PMID:21975503 as "two
    entries above it in the same list". It is not: it is in the PRECEDING
    environmental entry's evidence list, at line 1629, and two entries above the
    split item is PMID:33729557. The substantive claim - that the entry already
    tags that literature-state sentence OTHER, which is what the convention
    argument rests on - is correct and independently confirmed by the reviewer.

    Only the locator was wrong. Records here are append-only and the reviewer
    specifically said not to add a record just to correct it, so it is corrected
    here, in the next record, as instructed. The earlier record stands unaltered.

    3. THE FAILING TEST IS MAIN'S, AND I CONFIRMED THAT MYSELF RATHER THAN
    ACCEPTING THE REVIEW'S FINDING. The full suite reports
    tests/test_models_export.py::test_exported_data_js_is_in_sync_with_the_knowledge_base
    failing: app/models/data.js is stale against the KB, missing several
    computational models. The review argued from the test's two inputs that this
    predates the branch. That argument is sound, and I checked its premises
    independently - this branch touches no file under app/, app/models/data.js is
    byte-identical to origin/main, and the only KB file it changes contains no
    computational_models block - but a red test on a PR I own deserves a
    reproduction rather than an inference.

    So I ran the test at origin/main (99c7f647e) in a detached worktree, with
    none of this branch's changes present. It fails there too. That is the
    documented "red on the base branch" case: not this PR's failure, and not to
    be fixed here, since app/models/data.js is a derived artifact written only by
    the generate-pages workflow and committing it in a curation PR would break
    the derived-artifact rule. It self-heals on the next page build.


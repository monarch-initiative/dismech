  summary: Act on the three round-9 review suggestions
  details: |
    All three round-9 suggestions acted on. Two were flagged rather than
    requested; the first was a genuine defect.

    1. A MIS-TAGGED POLARITY THAT I INTRODUCED. The reviewer noticed that the
    PMID:34121325 dose item on the serum-iron diagnosis entry was marked REFUTE
    while reporting that symptomatic and asymptomatic children had SIMILAR
    ingested doses. That finding knocks down the rival predictor, which
    corroborates this entry's thesis by elimination rather than contradicting
    it, and the item's own explanation said as much: "Refutes the ingested dose
    as the alternative to serum iron."

    The decisive part of the observation is that the file already knew the
    answer. PMID:3784842's structurally identical claim, that the ingested dose
    is unacceptable because it is seldom known accurately, sits eleven lines
    above tagged PARTIAL, with an explanation drawing exactly the distinction
    that was needed: it refutes the dose but "does not itself validate the serum
    measurement". Two items making the same kind of claim carried different
    enums, and mine was the wrong one.

    This one is worth recording precisely because of when it was found. It was
    introduced in 55a2824 and survived the commit that was ABOUT polarity
    (238c8fdc), whose verification I scoped to checking WHERE the REFUTE items
    were rather than whether each was right. The check confirmed both sat in the
    diagnosis section, which was true and was not the question. A verification
    that answers a narrower question than the change warrants will pass while
    the defect stands.

    2. THE ENCODING CONVENTION MOVED OUT OF THE PROMPT. 238c8fdc put three
    sentences explaining the SUPPORT-everywhere convention into the CONTROVERSY's
    prompt, where they crowded out the question the prompt exists to pose. The
    reviewer called it a real trade-off rather than a mistake, since putting it
    first is what stops the enum being misread. Both halves are obtainable: the
    convention is now the FIRST paragraph of the rationale, so it is still read
    before the evidence, and the prompt is a question again.

    3. THE 150-350 MICROG/DL GAP RECORDED AS DELIBERATE. The bands now run 50-150,
    a gap, 350-500, 500-1700, 1700+. A concentration of 250 falls in no band. The
    reviewer noted this is the honest state and asked only that a later curator
    be able to tell it from an oversight. That belongs in the file rather than in
    a review thread, so the biochemical notes now say the range is deliberately
    unbanded, why (above the reference interval, below the lower conventional
    threshold, and nothing quotable says what it means), and that a band invented
    to fill it would assert an interpretation nobody has published.

    A NOTE ON THE EDIT ITSELF, since it repeats a hazard this entry keeps
    recording. The first attempt to flip the polarity failed its anchor assertion
    because the snippet line contains a thin space (U+2009) in "60 mg/kg" and my
    retyped anchor used an ordinary space. Same failure as PMID:34121325's and
    PMID:39509998's snippets, but in an ANCHOR rather than a quote, which is a
    case not previously recorded here. The fix was to stop matching on the
    snippet line at all: the supports value was changed by locating the line
    index and asserting the surrounding context mentions both PMID:34121325 and
    "Children symptomatic", and the prose changes were anchored on ASCII-only
    text. Assert-before-write caught it and nothing was written on the failed
    attempt.

    Also noted for the next reviewer: round 9's carried-forward list still names
    DOI:10.1148/71.5.732, PMID:23170793 and PMID:8187690 as cached but uncited.
    All three were resolved in 20d8227f, which the round-9 delta predates
    (PMID:23170793 is now curated as a KNOWLEDGE_GAP; the other two are declined
    with reasons, both having empty cache bodies). That commit also found seven
    further uncited caches nobody had been tracking.

    Validation: just validate passes (schema: no issues; terms: passed).
    Snippets 147/148, unchanged, since no snippet text was touched. All six
    ratchet gates pass. Test subset (NOT the full suite): pytest -k "discussion
    or attaches or foreign" gives 4380 passed, 31479 deselected. Compliance
    unchanged at 94.0%/94.3%.

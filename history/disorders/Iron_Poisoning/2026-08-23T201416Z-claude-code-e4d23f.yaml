  summary: Mine five previously-uncited cached references; close out the rest with
    reasons
  details: |
    An audit of every reference cached on this branch against every reference
    cited in the entry. The reviews have been carrying three fetched-but-uncited
    references forward since round 3. The real number was TEN. Seven had gone
    unnoticed because nothing in the stack looks for them: cache files are
    committed for CI determinism, so an unused one is invisible to schema, term
    and reference validation alike.

    FIVE WERE MINED.

    PMID:10798501 (CPSC/NCHS/AAPCC national data, 1980-1996). Four items. The
    strongest is the exposure route: children were getting iron out of
    child-resistant containers, or out of ones an adult had left open. That
    reframes the packaging story the entry already curates - it is about product
    form, not container closures, which is why the regulatory move was unit-dose
    blistering. Second, fatalities peaked at 10 in 1991 and fell to 2 by 1995,
    i.e. BEFORE the 1997 mandate, which is independent pre-mandate support for an
    equivocation the entry previously carried only from the post-mandate side.
    The two series are deliberately NOT merged: different source, different case
    definition. Third, the 2000-vintage prediction that unit-dose packaging would
    reduce severe poisoning, curated PARTIAL because it is an expectation rather
    than a result, and worth recording precisely because the entry also curates
    what happened next. Fourth, a new prevalence record for the national injury
    counts, following the existing two records in declining to normalize: the
    source gives no denominator, so no rate per 100,000 is derived.

    PMID:30598567 (fatal adult case). Two items on the deliberate-self-poisoning
    exposure. One states this entry's scope problem in a single sentence: acute
    iron poisoning is a paediatric literature and the adult intentional route is
    the thinly documented one. The other records a failure mode the diagnosis
    section does not model at all, because every diagnosis entry assumes iron is
    already suspected: here the ingested agent was misidentified and that was the
    delay.

    PMID:39649034 and PMID:39554796 (acetaminophen hepatotoxicity) into the
    ferroptosis KNOWLEDGE_GAP. These are not about iron poisoning and are marked
    accordingly, but they are the best-studied iron-dependent drug-induced liver
    injury, and the first does something valuable: it makes this discussion's
    central caution SOURCED rather than asserted. The gap says ferroptosis is
    being carried into acute iron poisoning from other cell types and disease
    states; a critical review of the ferroptosis literature names that exact move
    as the thing to be wary of. It also supplies a testable condition - hepatic
    antioxidant defences normally hold lipid peroxidation below
    pathophysiological relevance, and ferroptosis matters only where they are
    severely compromised - which converts "plausible" into "plausible and
    checkable". PMID:39554796 supplies a lysosome-to-mitochondrion iron relay,
    interesting because this entry annotates both organelles on one node without
    asserting a route between them; the disanalogy is stated rather than glossed,
    since in acetaminophen injury the lysosome is the iron SOURCE whereas here the
    iron arrives from plasma.

    PMID:23170793 as a new KNOWLEDGE_GAP, and this one contradicts the entry's own
    node text. The coagulation node says iron inactivates thrombin, factor Xa and
    kallikrein "without damaging the zymogens or fibrinogen itself". This paper
    reports ferric ions generating hydroxyl radicals that convert fibrinogen into
    dense matted deposits with permanent resistance to enzymatic degradation - an
    effect on precisely the molecule the node calls undamaged, and pointing
    prothrombotic where the node points anticoagulant.

    It is curated as a gap rather than a contradiction for three stated reasons
    (chronic degenerative disease frame, different iron species and targets so
    both can be true, and nothing has looked for fibrinogen change in acute
    poisoning). What earns it a place is a therapeutic consequence: the node
    asserts the coagulopathy is in principle correctable by chelation BECAUSE the
    inhibition is reversible. A permanent structural conversion of fibrinogen
    would not be undone by removing the iron. The proposed experiment therefore
    assays both arms in the same specimens before and after chelation, since
    protease recovery without clot-architecture recovery is the discriminating
    result.

    FIVE WERE DECLINED, WITH REASONS, SO THEY STOP BEING OPEN ITEMS.

    PMID:8187690 (1994 review): the abstract is a pure statement of topic - it
    "reviews the pathophysiology" and "describes a comprehensive management plan"
    - with no finding in it. Nothing quotable under SOP section 6. This has been
    on the open list since round 3 and should not have been; it was never usable.

    DOI:10.1148/71.5.732 (Radiology 1958) and DOI:10.1081/CLT-200068842 (AAPCC
    guideline): both cached with content_type unavailable and an empty body.
    Uncitable, not merely uncited.

    PMID:27928480 (iron chelator review): framed entirely on transfusional iron
    overload with no acute-poisoning content. The entry's own top-level synonym
    guardrail is the reason to leave it.

    PMID:38179398 (Cureus case report, activated charcoal monotherapy for ferrous
    sulfate). Declined, and this one needed a decision rather than a glance. The
    claim runs against the standard rationale that activated charcoal does not
    adsorb iron - but that rationale is not quotable from anything cached here: a
    grep across the whole reference cache found no source stating it. So curating
    the claim would put a single case report into the entry unopposed, and
    curating a rebuttal would assert the counter-claim without a source. Declining
    is the only option that asserts nothing.

    A DUPLICATE YAML KEY WAS INTRODUCED AND CAUGHT. Adding an evidence block after
    attaches_to in the ferroptosis discussion duplicated an evidence key that
    already existed further down - the exact #8623 failure mode. The instructive
    part is which check caught it. count-verified-snippets reported a clean
    144/145, because PyYAML silently keeps the LAST duplicate key and my three
    items were simply dropped; only the ruamel-backed validator raised
    DuplicateKeyError. The arithmetic was the tell: 11 snippets added but the
    count rose by 8. Fixed per CLAUDE.md by merging into the single block rather
    than deleting either, after which the count rose by exactly 11 as expected.
    This is a live demonstration that the fast check is advisory and the batched
    sweep is authoritative.

    Validation: just validate passes (schema: no issues; terms: passed).
    validate-disorders passes with 147/148 snippets verified, up exactly 11, the
    single skip being the pre-existing DOI:10.1177/0009922819901010 item. All six
    ratchet gates and check-not4curation pass. Test subset (NOT the full suite):
    pytest -k "discussion or attaches or foreign or prevalence or environmental"
    gives 6536 passed, 29323 deselected.

    Compliance falls 94.4%/94.8% to 94.0%/94.3%, the familiar
    PROPOSED-experiment denominator effect: one new discussion means one more
    experiment whose datasets and evidence slots are necessarily empty. Eleven
    fully-compliant evidence items were added in the same commit and still did
    not outrun it.

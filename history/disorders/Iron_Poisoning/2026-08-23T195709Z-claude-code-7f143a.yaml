  summary: Neutralise SUPPORT/REFUTE polarity on the serum-iron CONTROVERSY
  details: |
    Acts on a non-blocking suggestion from the round-8 review of 55a2824, which
    explicitly said it was not asking for a change. Two things made it worth
    doing anyway. The reviewer's own condition was "worth a thought if the
    discussion is ever revisited", and the very next commit (3dcec48) revisited
    that discussion. And revisiting it made the problem worse rather than
    leaving it as found: adding two PMID:39509998 items took the discussion-level
    evidence to four SUPPORT against one REFUTE on a two-sided question, so the
    asymmetry the reviewer noticed was now four to one.

    THE OBSERVATION. The discussion's prompt asks which of two predictors is
    better. Marking the serum-iron-favouring items SUPPORT and the
    dose-favouring item REFUTE made one side read as the discussion's thesis and
    the other as its refutation, which is precisely what a CONTROVERSY is not
    supposed to assert. The polarity was defensible against the prompt's second
    sentence, but it was doing work no one intended.

    THE FIX, AND WHY IT IS NOT A LOSS OF INFORMATION. This discussion's only
    claim is that the literature disagrees. Every cited finding supports that
    claim, including the referral cohort's, so PMID:14722368's discussion-level
    item is now SUPPORT like the rest, and the prompt says so in terms: every
    item is SUPPORT, what each supports is the disagreement, and this discussion
    has no thesis for a source to refute.

    Which side each source is on was never carried by the enum anyway - there is
    no schema slot for "side" - it is carried by the explanation prose, which
    still names it in every item.

    THE POLARITY STILL EXISTS WHERE IT MEANS SOMETHING. Both REFUTE items on the
    serum-iron diagnosis entry are untouched (PMID:14722368 and the
    dose-comparison item from PMID:34121325). That entry does have a thesis -
    that the serum iron concentration is informative - so a source contradicting
    it genuinely refutes something. Verified after the edit that exactly two
    REFUTE items remain in the file and both sit inside the diagnosis section
    rather than in discussions. The separation is now clean: the entry with a
    claim carries polarity, the discussion without one does not.

    The prompt also drops "child" for "patient", since PMID:39509998 does not
    report the age distribution of its 75 patients and the earlier wording
    implied a paediatric-only question that its inclusion no longer matches.

    Validation: just validate passes (schema: no issues; terms: passed).
    Snippets 136/137 verified, unchanged - no snippet text was touched, only two
    supports: values, one prompt and two explanations. All six ratchet gates
    pass. Test subset (NOT the full suite): pytest -k "discussion or attaches or
    foreign" gives 4380 passed, 31479 deselected.

    The review's second suggestion needs no action: the compliance dip it flagged
    was the PROPOSED-experiment denominator effect, already recorded three times,
    and 3dcec48 moved the number back up.

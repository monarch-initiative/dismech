  details: |
    Two things: the last residual instance of a narrowing removed across several
    earlier commits, and a correction to a verification claim I made in an earlier
    record.

    RESIDUAL NARROWING. The ferroptosis KNOWLEDGE_GAP rationale still read "This
    entry therefore curates the oxidative and mitochondrial injury it has evidence
    for". That is the same mitochondrion-only framing that 77c4603 removed from the
    node name, and that 8c4d551 removed from the node description and from this same
    discussion's prompt - and it sat a paragraph above the rationale's own text
    introducing the lysosomal route as a second candidate. Now "oxidative organelle
    injury". The whole-file count of the old phrasing is zero.

    CORRECTION TO AN EARLIER VERIFICATION CLAIM. The history record for 77c4603
    (2026-08-23T164122Z-claude-code-8171af.yaml) says "Full pytest suite: 6684
    passed", and that commit's message says "The full pytest suite (6684 tests...)".
    Both are wrong about scope. That run was

        uv run pytest tests/test_data.py -k "conforms_to or foreign" -q

    which reported "6684 passed, 29175 deselected". It was a FILTERED SUBSET, not
    the full suite. The 6684 tests did pass and did include the pathophysiology
    foreign-key checks that the node rename needed, so the substance of the claim
    holds; the coverage implied by the words "full pytest suite" does not.

    The earlier record is left unaltered because history here is append-only, and
    the commit message cannot be corrected without rewriting already-pushed history.
    This record is the correction.

    THE FULL SUITE HAS NOW ACTUALLY BEEN RUN, to completion, on this content:

        uv run pytest tests/test_data.py -q
        35859 passed, 597 warnings in 1001.68s (0:16:41)

    Note why it had not been run before: two earlier attempts were wrapped in a
    900-second timeout and were killed at "Terminated", which is a timeout and not a
    failure - the suite needs about 1002 seconds. The 8c4d551 commit message
    correctly declined to claim that killed run and named the subset as the actual
    claim. The reviewer then ran the full suite itself, explicitly because that
    commit had declined to claim it, and independently reported the same 35859. Two
    independent runs agree.

    The general point worth keeping: a filtered pytest run and the full suite are
    different claims, and "-k" makes the difference invisible in the summary line
    unless the deselected count is read. Report the command, not an impression of it.


  summary: Address four review suggestions; fix a %%-escaping defect from the prior
    batch
  details: |
    Address the four blue suggestions from the ai4c-reviewer review of b0e30ab.

    One of the four was a real defect I introduced, and it is worth recording how.

    DOUBLED PERCENT SIGN. The biochemical notes read "absent in 31%% of chelated
    patients". Cause: the b0e30ab edits were applied by a Python script using
    %-formatting, so literal percent signs in the replacement text had to be written
    %%. One hunk in that batch - the biochemical notes - had no % operator applied to
    it, being a plain tuple rather than a formatted string, so its escaping was never
    consumed and the doubled sign survived into the file. Every other percent sign in
    that batch was in a hunk that WAS formatted and rendered correctly, which is why
    it was not obvious on review.

    This is the same class of error as the dropped hunks in 3b57d37: an artefact of
    the edit mechanism rather than of the curation. The general lesson is that
    %-formatted edit templates are a poor fit for text that legitimately contains
    percent signs, which curation text routinely does. Prefer a formatting method
    with no escaping burden, and grep the applied file for the escape sequences
    themselves after any batch.

    WHITESPACE-ONLY LINES. Four trailing whitespace-only lines at what were lines
    785, 816, 880 and 1088, from template endings in the same batch. Stripped
    repository-wide within this file; the whole-file count of whitespace-only lines
    is now zero.

    GI HAEMORRHAGE BAND AND THE UNREPORTED OVERLAP. The reviewer noted the FREQUENT
    band is derived from melaena alone (8/21 = 38%), and that the melaena/haematemesis
    overlap is unreported. The explanation now records that the true union is bounded
    between 38% (complete overlap) and 67% (disjoint), and that both ends fall inside
    FREQUENT, so the band holds regardless. This is written down because a later
    curator recomputing the band will hit exactly the same question.

    SERUM IRON DESCRIPTION HEDGE. The description read as settled three lines above a
    supports: REFUTE item and a notes block saying the question is contested. The
    notes carried the caveat but the description is what a reader sees first, so the
    description was rewritten to lead with the disagreement: it now states that how
    much weight the serum iron should carry is contested and that this entry does not
    settle it, gives both positions, and ends with the one use not in dispute -
    discriminating acute poisoning from the chronic iron-overload states that share
    the MONDO synonym.

    Not addressed here, and still open: the reviewer's suggestions 6 (NCIT procedure
    terms on the supportive-care treatments), 7 (the ferric-hydrolysis arm of the
    acidosis node) and 8 (the direct-toxicity contribution to shock). 7 and 8 are
    described in the deep-research report but have no cached source that states them
    quotably, so curating them now would mean asserting a mechanism on the strength
    of the report rather than of a reference. They are deliberately left for a source.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 121/122 snippets verified, the single skip being the
    DOI: reference from 3b57d37. All six ratchet gates and check-not4curation pass.
    Compliance unchanged at 96.3% global / 96.7% weighted - these were text-quality
    fixes, not coverage changes.

  summary: Remove revision narration from four evidence explanations
  details: |
    Acts on the round-12 🔵, and generalizes it. The reviewer flagged one
    explanation opening "PARTIAL rather than SUPPORT, because of what splitting
    this quote cost", noting that the clause narrates a revision event rather
    than the evidence, that a future curator has no access to the PR thread and
    no reason to know a split happened, and that the rest of the paragraph is
    self-contained. It called this cosmetic and said it was not worth a commit
    of its own.

    It was not worth a commit for ONE line. A grep for the pattern found FOUR,
    all mine, all added over the last four rounds as I acted on review feedback:

      :1294  "It was tagged REFUTE when first curated, which made a finding that
             corroborates this entry by elimination read as one that opposes it."
      :1772  "PARTIAL rather than SUPPORT, because of what splitting this quote
             cost." (the flagged one)
      :1791  "Previously this and the sentence before it were one evidence item
             tagged HUMAN_CLINICAL throughout..."
      :2419  "It was previously marked REFUTE relative to the prompt's serum-iron
             arm, which made one side of a two-sided question read as this
             discussion's thesis..."

    Four instances is a habit rather than a slip, and the habit has a cause worth
    naming: each was written in the same motion as the fix it describes, while
    the reasoning for the change was the most salient thing in mind. That is
    exactly the moment at which edit provenance feels like it belongs in the
    entry, and exactly when it does not.

    THE RULE THIS SETTLES. An `explanation` says why this evidence bears on this
    claim, addressed to a reader who has only the file. What the field used to
    say, and why it changed, is history-record material - which is what these
    records are for, and every one of these four changes is already recorded in
    one. Keeping the same account in both places does not add provenance; it
    puts a shrinking audience's context into the artifact with the widest one.

    WHAT WAS PRESERVED. In each case the substantive reasoning was kept and only
    the retrospective framing removed, so no argument is lost:

      :1294 keeps the PMID:3784842 parallel and the "corroborates by elimination
            is not opposes" point, now stated in the present tense rather than
            as a correction.
      :1772 now leads with the evidential relationship - the sentence describes
            paediatric accidental poisoning under an adult deliberate exposure,
            so it bears on the entry only through the contrast - and mentions the
            contrastive pair only to point at the companion item.
      :1791 keeps the OTHER-vs-HUMAN_CLINICAL convention and why this item is
            separate, stated as a standing fact rather than as an undoing. Its
            cross-reference to PMID:21975503 is also corrected while the line was
            open: it is in the PRECEDING exposure entry, not "above" in this one,
            which is the round-11 locator error recurring in the entry itself
            rather than in a record.
      :2419 keeps the whole polarity argument, reframed from "it was previously
            REFUTE" to why marking either side REFUTE would misrepresent a
            two-sided question.

    That last one is the payoff: stated positively, the sentence now explains the
    convention to anyone reading the discussion, instead of explaining a change to
    someone who remembers the previous version.


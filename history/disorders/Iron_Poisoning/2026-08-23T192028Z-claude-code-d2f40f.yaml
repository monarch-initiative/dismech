  summary: Curate PMID:21975503 evidence-base gap; decline DOI:10.5070/M541042366
    as unquotable
  details: |
    Two more author-supplied references. One used, one declined.

    PMID:21975503 / DOI:10.1097/PEC.0b013e3182302604 (Chang & Rangan, Pediatr Emerg
    Care 2011), "Iron poisoning: a literature-based review of epidemiology,
    diagnosis, and management". USED.

    The DOI is not in PMC; it was resolved to a PMID via a PubMed DOI-field search so
    the reference could be cited as PMID and therefore be snippet-checked, rather
    than as DOI which skip_prefixes excludes from checking.

    WHAT IT DOES NOT DO, stated first because it is what was hoped for. This review
    covers exactly the two areas still open in this entry - the elemental-iron dose
    bands and the serum-iron chelation threshold - but its cache is abstract_only
    (full_text_attempted: true), and the ~102-word abstract states no numbers at all.
    Those figures are in the full text, which is not retrievable. So this reference
    does NOT unblock the 500 microg/dL threshold or the 20/40/60 mg/kg bands, and
    they remain uncurated. Recording that explicitly so a later curator does not
    re-fetch it expecting otherwise.

    WHAT IT DOES DO, which is worth more than the numbers would have been. Its
    abstract states the evidence base of the whole field: "diagnosis and management
    of iron poisoning have minimally evolved, and the current evidence for iron
    poisoning is yet based principally on case series, expert consensus, animal
    studies, and adult volunteer studies."

    That is a sourced statement of the exact epistemic situation this entry has been
    navigating commit by commit, and it is now curated as a disease-wide
    KNOWLEDGE_GAP discussion (evidence_base_quality_for_diagnosis_and_management)
    attached to the two diagnosis entries and the two most evidence-thin treatments.
    Its rationale ties the general statement to the specific places it explains: the
    serum-iron REFUTE sitting beside its SUPPORT items rather than being resolved,
    oral deferiprone being investigational on rat data, abdominal radiography resting
    on one case report, the Phase 3 mortality association being a four-death series,
    and the chelation threshold being curated nowhere. The point of recording it once
    in sourced form is that the caveat no longer has to be repeated at every node,
    and a curator who finds any of those thin can see that the thinness is the
    field's rather than an artefact of what was reachable here.

    A proposed experiment was added with it - a prospective multicentre poison-centre
    registry with a common dataset - because that is the design that could actually
    test the conventions rather than inherit them, and because a randomised trial is
    not available here: withholding chelation from a severely poisoned child is not
    randomisable, and the record says so rather than proposing an impossible study.

    The same review's line that "legal and manufacturing practices" have changed the
    landscape of iron poisoning over the decades was added to the unintentional
    paediatric exposure, supporting the framing of that exposure as one whose
    incidence is set by regulation and product design rather than host biology -
    which is what the existing packaging notes argue.

    DOI:10.5070/M541042366 (Waymack, Tweet & Austin, J Educ Teach Emerg Med 2019),
    "Iron Overdose". DECLINED, and the cache file deleted rather than committed.

    Two independent reasons.

    First, there is nothing to quote. It is not in PubMed or PMC, so it could only be
    cited as a DOI; the fetcher's attempt at the eScholarship PDF returned HTTP 403,
    and the resulting cache body is a single character. Any snippet attributed to it
    would be invented. This matters more than usual because DOI: is in skip_prefixes,
    so linkml-reference-validator would not check such a snippet and nothing in CI
    would catch the fabrication - the one circumstance where the guard rails are
    absent is exactly the circumstance where inventing a quote is easiest.

    Second, even with full text it is a teaching artifact. JETEM publishes simulation
    and oral-board cases; a case of this kind repeats figures from the primary
    literature rather than establishing them, so it would be a weaker source for the
    dose thresholds than the primary sources that are already unavailable.

    The empty cache file was deleted rather than committed. A committed reference
    cache with no citation and no content is dead weight in the tree - the reviewer
    made that point about three other uncited caches - and an empty one does not even
    document that the source was checked. This record documents it instead.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 124/125 snippets verified, the single skip being the
    pre-existing DOI:10.1177/0009922819901010 item. All six ratchet gates and
    check-not4curation pass. Foreign-key and discussion-reference subset: 4380
    passed, which is what covers the new discussion's four attaches_to targets.

    Compliance falls 95.6%/95.9% to 94.9%/95.2%. Same cause as the earlier drop and
    recorded for the same reason: the new discussion carries one PROPOSED experiment,
    whose datasets and evidence slots are necessarily empty, so the denominator grows
    by more than the numerator. Filling them would mean inventing datasets for a
    registry nobody has run.

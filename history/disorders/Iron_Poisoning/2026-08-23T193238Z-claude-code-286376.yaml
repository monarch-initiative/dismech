  summary: Curate PMID:34121325; convert the serum-iron disagreement into a CONTROVERSY
    discussion
  details: |
    PMID:34121325 / DOI:10.1111/1742-6723.13806 (Emergency Medicine Australasia
    2021), "Unintentional paediatric iron poisoning: A retrospective case series" -
    54 unintentional exposures in children under 7, no severe toxicity. Author-
    supplied. Resolved DOI to PMID first so it could be snippet-checked rather than
    cited under the skip_prefixes-excluded DOI: form.

    THIS IS THE OTHER SIDE OF A DISAGREEMENT THE ENTRY ALREADY CARRIED.

    The entry has been curating, since b0e30ab, PMID:14722368's finding that the
    ingested dose and clinical signs guided management while "serum iron did not
    help", marked REFUTE against the entry's own serum-iron framing, with notes
    saying the question was contested and unresolved. That was a one-sided contest:
    one paper against a framing.

    This cohort answers in the opposite direction on both counts. Peak serum iron
    separated symptomatic from asymptomatic children (66 vs 12 micromol/L, P <
    0.001), and suspected dose did not differ between them - the paper's own
    conclusion being "Suspected dose ingested is a poor predictor of toxicity". So
    the quantity PMID:14722368 found most useful is the one that failed here, and
    the quantity it dismissed is the one that discriminated.

    Curated as a CONTROVERSY discussion (serum_iron_versus_ingested_dose) rather
    than by choosing a side, because that is what the discussion kind is for: "a
    live disagreement or competing interpretation between published positions". The
    prose notes on the serum-iron diagnosis entry were replaced with a pointer to
    it, so the disagreement lives in one structured object rather than being
    restated.

    THE RATIONALE ARGUES THE COHORTS MAY BOTH BE RIGHT. One is a referral series of
    21 with four deaths; the other is a poisons-information-service series of 54
    unintentional exposures where nobody became severely toxic. A measurement can
    discriminate mild toxicity from none and still fail to guide management in an
    already-shocked child, and a parent-estimated dose is not the same measurement
    in the two settings. The proposed experiment is therefore stratified by severity
    rather than pooled - the specific hypothesis being that serum iron discriminates
    in the mild range and dose in the severe range, which would make both findings
    correct in their own populations. Nothing cited resolves it, and the record says
    so.

    IT ALSO STRENGTHENS THE CASE FOR NOT CURATING THE DOSE BANDS. The median
    suspected dose here was 72 mg/kg with no severe toxicity, against a deep-research
    figure of >60 mg/kg as potentially lethal. Until now the bands were uncurated for
    one reason: no quotable source. There is now a second and better reason, recorded
    in the CONTROVERSY - a cohort found dose a poor predictor of toxicity at all, so
    a band on that axis would assert a predictive value two cohorts disagree about.

    A UNIT CONVERSION WAS DERIVED, AND MARKED AS DERIVED. The source reports
    micromol/L; this entry's reference range is in microg/dL. The explanation gives
    66 micromol/L as about 369 microg/dL and 12 as about 67, stating explicitly that
    these are derived not quoted, and anchoring the factor to PMID:11778670, which
    states its own reference interval in both units (50-150 microg/dL, 9-27
    micromol/L) and so supplies the conversion from a
    cited source rather than from arithmetic alone.

    TWO TRANSCRIPTION HAZARDS HIT HERE, BOTH WORTH RECORDING.

    First, this abstract uses thin spaces (U+2009) and non-breaking spaces (U+00A0)
    between numbers and units - "66 micromol/L", "P < 0.001". Retyping
    what the abstract looks like produces ordinary spaces and fails to match. Four of
    the eight candidate snippets failed on first attempt for exactly this. The fix
    was to stop retyping and extract the snippets programmatically from the cache
    body, which guarantees exactness. That is the safer habit for any source with
    formatted numerics.

    Second, the documented square-bracket stripping rule bit. The snippet comparing
    symptomatic and asymptomatic doses contains "[IQR 41-143 mg/kg]", and
    square-bracketed spans are stripped from the snippet before matching unless
    conf/reference_validator_config.yaml lists a matching literal_bracket_patterns
    entry. The validator said so precisely, naming the span. The snippet was
    truncated to stop before that bracket rather than adding a config pattern, since
    CLAUDE.md warns a new pattern affects every cached reference and would need the
    whole KB replayed. The explanation records the omitted P = 0.809 in prose so the
    non-significance is not lost with the quote.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 129/130 snippets verified, the single skip being the
    pre-existing DOI:10.1177/0009922819901010 item. All six ratchet gates and
    check-not4curation pass. Foreign-key and discussion-reference subset: 4380
    passed, covering the new CONTROVERSY's three attaches_to targets, one of which
    (biochemical#Serum iron concentration) is a form this entry had not used before.

    Compliance falls 94.9%/95.2% to 94.3%/94.6%, again the PROPOSED-experiment
    denominator effect: the new discussion adds one more experiment whose datasets
    and evidence slots are necessarily empty. Third time this has happened and the
    cause is the same each time; it is not lost content.

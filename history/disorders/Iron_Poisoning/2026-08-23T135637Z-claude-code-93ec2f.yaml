  summary: 'Create: Iron Poisoning (MONDO:0800385)'
  details: |
    De novo creation of the Iron Poisoning entry (MONDO:0800385), the only uncurated
    child of MONDO:0023305 heavy metal poisoning. Cadmium, thallium, lead, mercury,
    arsenic and manganese were already curated; cesium was the only other unclaimed
    child.

    Duplicate preflight: git grep for MONDO:0800385 and "iron poisoning" over
    origin/main kb/ and stubs/ returned nothing; GitHub PR and issue searches
    returned nothing.

    Deep research provider: claude_code (the required provider for this request),
    run via `just research-disorder claude_code Iron_Poisoning`. Report at
    research/Iron_Poisoning-deep-research-claude_code.md - 16 web searches, 18 turns,
    45 citations, 236s. Its own reference validation (linkml-reference-validator
    0.2.1) reported 19/19 references resolved, 0 unresolved, 0 off topic,
    confabulation_rate 0.0. That validator version does not check quoted material,
    so every snippet used here was checked separately against the local cache.

    NEC preflight: `just preflight-dr ... MONDO:0800385` returned SKIP because MONDO
    records no causal gene for a poisoning term. Fell back to the manual check - the
    MONDO textual definition ("Ingested iron can cause direct caustic injury to the
    gastrointestinal mucosa"), the corrosive-vs-cellular split, and the absence of an
    OMIM xref all match the report's subject. No entity confusion found.

    The report's ontology suggestions were substantially wrong and none were used
    unverified. Seven of its suggested IDs failed OAK verification: HP:0011900
    (suggested "Metabolic acidosis", actually Hypofibrinogenemia), HP:0001257
    (suggested "Lethargy", actually Spasticity), HP:0002583 (suggested "GI
    obstruction", actually Colitis), HP:0001744 (suggested for shock, actually
    Splenomegaly), CHEBI:4058 (suggested "deferoxamine", actually reduced cytochrome
    P450), CHEBI:75771 (suggested "ferrous sulfate", actually mouse metabolite), and
    GO:0055072 (obsolete). Every term in the entry was independently verified with
    OAK before use.

    Curated: 9 pathophysiology nodes with causal edges, spanning the two arms the
    MONDO definition names - a corrosive arm (mucosal injury, and its late fibrotic
    gastric-outlet stenosis) and a cellular arm (transferrin saturation to
    non-transferrin-bound iron, oxidative and mitochondrial injury, metabolic
    acidosis, periportal hepatocellular necrosis, shock, acute kidney injury). The
    reversible inhibition of coagulation serine proteases by non-transferrin-bound
    iron is curated as its own node, because it makes the coagulopathy of iron
    poisoning mechanistically distinct from hepatic synthetic failure. Also curated:
    the four-phase clinical course from PMID:3784842 as `stages` (with a note on the
    five-stage teaching variant), 14 phenotypes, 2 environmental exposures both
    linked into the pathograph via influences_mechanisms, 6 treatments with
    target_mechanisms edges, a rat acute-oral-iron animal model with two readouts,
    one prevalence record, and two discussions (a KNOWLEDGE_GAP on whether
    ferroptosis contributes to the cell death, and a HUMAN_MODEL_MISMATCH on oral
    deferiprone, whose acute-poisoning efficacy data are rat-only).

    A top-level note records that MONDO:0800385 carries "iron overload" as an EXACT
    synonym, which conflates this acute ingestion syndrome with the chronic
    iron-overload disorders (haemochromatosis, transfusional haemosiderosis) that are
    separate diseases and separate entries. This is a live retrieval hazard for
    anyone extending the entry.

    A pre-PR red-team review was run against the dismech-pr-review skill in a
    fresh context before opening the PR, and its findings were acted on rather
    than filed. The substantive ones, all fixed: the central oxidative /
    mitochondrial node and the edge into it were carrying snippets that did not
    state the claim (fixed with PMID:40650208 and PMID:37629109, which were
    already cached and unused); the NTBI node's transferrin-receptor-bypass claim
    was uncited (PMID:40650208); the deferiprone treatment edge pointed at plasma
    NTBI while its evidence was gut-lumen histology (retargeted to the ingestion
    node); "activated charcoal does not absorb iron" was asserted without a source
    (PMID:1754488 states it verbatim); liver transplantation rested on a
    recommendation to consider it rather than on the case where it was performed
    (PMID:38060750); `parents: heavy metal poisoning` was missing, inconsistent
    with every sibling poisoning entry; two GO terms described the cell responding
    to ROS on a node claiming iron generates them (GO:0034614 and GO:0006119
    replaced by GO:0072593 INCREASED); and several evidence_source values were
    HUMAN_CLINICAL on review articles or mixed-source statements (retagged OTHER).
    Three overstated `supports: SUPPORT` values were downgraded to PARTIAL, and
    the top-level description was hedged to match what the sources actually say.

    Two omissions the review flagged were filled with cached-but-uncited
    references: a `biochemical` serum-iron block with the 50-150 microg/dL
    reference interval and an interpretation band at the lowest concentration
    reported with hepatotoxicity, and a `histopathology` block. The
    histopathology deliberately carries a negative that cuts against this entry's
    own hepatic argument - the one cited autopsy found no significant stainable
    iron in the liver despite hepatic compromise - with a note on how that sits
    against the periportal-delivery node, rather than omitting it.

    An honest gap is recorded in the entry rather than papered over: the commonly
    taught 500 microg/dL serum-iron chelation threshold and the 20/40/60 mg/kg
    elemental-iron dose bands are NOT curated, because the AAPCC consensus
    guideline (DOI:10.1081/CLT-200068842) was fetched but cached with an empty
    body, leaving no verifiable snippet. Abdominal radiography is curated from a
    single case report (PMID:8629765) with its evidentiary limits stated; the
    "a negative film does not exclude significant ingestion" caveat is left
    unasserted for the same reason.

    Validation: `just validate` passes (schema: no issues; terms: passed).
    `just count-verified-snippets` reports 105/105 snippets verified against
    cached references. All five ungated CI gates pass - check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-environmental-evidence,
    check-duplicate-keys - plus check-not4curation, check-term-cache-integrity and
    check-reference-cache-frontmatter. `just compliance` reports 96.1% global /
    96.4% weighted. The final batched `just validate-disorders` sweep was run over
    the changed file before the PR.

    No GeneReviews baseline applies: a PubMed search for a GeneReviews article on
    iron poisoning returned zero results, as expected for an acquired toxic exposure
    rather than a Mendelian disorder.

  summary: Align gap prompt, node description and deferiprone attaches_to with their
    own content
  details: |
    Address the three blue suggestions from the ai4c-reviewer review of 77c4603. All
    three were internal inconsistencies rather than cosmetics, which is why they were
    taken now rather than deferred.

    KNOWLEDGE_GAP PROMPT CONTRADICTED ITS OWN RATIONALE. The prompt asked whether the
    injury was "adequately explained by non-programmed oxidative and mitochondrial
    damage". Two problems, both introduced by earlier commits widening the content
    under a prompt that was never revisited: the mitochondrial narrowing is the same
    one the 77c4603 node rename removed, and the rationale below the prompt describes
    a lysosomal route "eventuating in apoptotic or necrotic cell death" - apoptosis
    is a death programme, so calling the alternative "non-programmed" was wrong on
    its face. The prompt now poses three explicitly non-exclusive routes: ferroptosis,
    lysosomal destabilisation ending in apoptotic or necrotic death, and unregulated
    oxidative organelle damage requiring no death programme at all.

    NODE DESCRIPTION LED MITOCHONDRION-ONLY. "peroxidising membrane lipids and
    damaging mitochondria" sat two sentences before the description's own claim that
    two organelles are co-equal proposed targets. Generalised to "damaging
    intracellular organelles" so the opening no longer contradicts the sentence that
    follows it.

    TWO LINKS DISAGREED ABOUT WHERE DEFERIPRONE ACTS. This is the substantive one.
    3b57d37 retargeted the Oral Deferiprone target_mechanisms edge away from
    Non-Transferrin-Bound Iron in Plasma to the ingestion node, because the only
    measurement supporting the treatment in the acute setting is gastrointestinal
    tissue iron rather than a plasma iron species. The HUMAN_MODEL_MISMATCH
    discussion about that same treatment still attached to the NTBI node, so after
    that retarget the causal edge and the discussion pointed at different mechanisms
    for the same drug. The discussion now attaches to the ingested-burden node,
    matching the edge.

    The rationale records WHY, so the alignment is not silently reversed by a later
    curator who notices that a systemically absorbed chelator plausibly does act on
    plasma NTBI: it probably does, but nothing in the cited evidence measures that,
    and both links are drawn where the evidence is rather than where the pharmacology
    is assumed to reach. That is the same principle 3b57d37 applied to the edge, now
    stated once in a place a reader will find it.

    Verification: the retargeted attaches_to was confirmed to resolve by running the
    foreign-key and discussion-reference subset of the test suite - 4380 passed. The
    full suite was launched but had not finished at commit time, so it is not claimed
    here; the subset run is the one that covers this change, and it is the claim being
    made.

    Validation: just validate passes (schema: no issues; terms: passed). just
    validate-disorders reports 121/122 snippets verified, the single skip being the
    DOI: reference from 3b57d37. All six ratchet gates and check-not4curation pass.
    No snippets were added or altered, so the verified count is unchanged from
    77c4603.

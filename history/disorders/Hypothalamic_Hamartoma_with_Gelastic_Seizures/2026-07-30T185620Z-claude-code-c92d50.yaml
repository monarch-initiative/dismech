  summary: 'Create: Hypothalamic Hamartoma with Gelastic Seizures (somatic Shh pathway)'
  details: |
    New de-novo entry for hypothalamic hamartoma with gelastic seizures (MONDO:0019484), the drug-resistant epilepsy syndrome of a congenital ventral-hypothalamic malformation. Deep research via the claude_code provider (research/Hypothalamic_Hamartoma_with_Gelastic_Seizures-deep-research-claude_code.md). No GeneReviews chapter exists (PubMed GeneReviews[book] search empty; PMID:32809498 is StatPearls, not GR), so primary literature is the baseline. Seven atomic (unbundled) pathophysiology nodes, every edge evidenced: somatic Sonic hedgehog pathway mutation (GLI3/PRKACA/SMO, brain-restricted mosaic; 37% of cases, PMID:27453577) -> hypothalamic hamartoma formation -> two arms: (a) the epileptic arm, small GABAergic neuron spontaneous pacemaker firing (80-90% of lesion neurons) -> paradoxical GABA-mediated excitation of the large projection neurons (with GABA-A receptor rundown, PMID:21391233) -> intrinsic ictogenesis within the hamartoma -> gelastic seizures + secondary epileptogenesis in extrahypothalamic networks; and (b) the endocrine arm, ectopic GnRH secretion -> central precocious puberty. The defining mechanistic point, that the seizures are generated inside the lesion rather than in cortex (PMID:16114178), is captured as an INTERPRETATION discussion because it is what makes antiseizure medication ineffective and lesion ablation curative. 7 phenotypes (gelastic HP:0010821 and dacrystic HP:0010820 seizures, drug-resistant epilepsy, progressive cognitive decline, rage attacks, precocious puberty, the hamartoma itself), neuropathology histopathology, somatic-mutation diagnosis (paired lesion-vs-leukocyte sequencing), treatments (MRgLITT/RFTC with quantified seizure-freedom outcomes from the 2024 Neurology IPD meta-analysis PMID:39642321, stereotactic radiosurgery, and antiseizure medication modeled with supports: REFUTE for its documented poor efficacy), qualitative rarity prevalence, NEUROLOGIC classification, and a discussions section (INTERPRETATION on subcortical seizure origin; KNOWLEDGE_GAP on the local cluster-network ictogenesis mechanism with two proposed_experiments). Distinct from Pallister-Hall_Syndrome (MONDO:0007804), the germline GLI3 syndrome in which hypothalamic hamartoma is one component. Validated: schema, term validation (--labels), 40/40 snippets exact, folded-hyphen, pathograph fully connected (7 nodes, no dangling or duplicate edges), reference validator, compliance 91.5%.

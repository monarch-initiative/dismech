  summary: 'Create: Hypothalamic Hamartoma with Gelastic Seizures (somatic Shh pathway)'
  details: |
    New de-novo entry for hypothalamic hamartoma with gelastic seizures (MONDO:0019484), the drug-resistant epilepsy syndrome of a congenital ventral-hypothalamic malformation. Deep research via the claude_code provider (research/Hypothalamic_Hamartoma_with_Gelastic_Seizures-deep-research-claude_code.md). No GeneReviews chapter exists (PubMed GeneReviews[book] search empty; PMID:32809498 is StatPearls, not GR), so primary literature is the baseline. Eight atomic (unbundled) pathophysiology nodes, every edge evidenced: somatic Sonic hedgehog pathway mutation (GLI3/PRKACA/SMO, brain-restricted mosaic; 37% of cases, PMID:27453577) -> hypothalamic hamartoma formation -> two arms: (a) the epileptic arm, small GABAergic neuron spontaneous pacemaker firing (80-90% of lesion neurons) -> paradoxical GABA-mediated excitation of the large projection neurons (with GABA-A receptor rundown, PMID:21391233) -> intrinsic ictogenesis within the hamartoma -> gelastic seizures + secondary epileptogenesis in extrahypothalamic networks; and (b) the endocrine arm, ectopic GnRH secretion -> central precocious puberty. The defining mechanistic point, that the seizures are generated inside the lesion rather than in cortex (PMID:16114178), is captured as an INTERPRETATION discussion because it is what makes antiseizure medication ineffective and lesion ablation curative. 7 phenotypes (gelastic HP:0010821 and dacrystic HP:0010820 seizures, drug-resistant epilepsy, progressive cognitive decline, rage attacks, precocious puberty, the hamartoma itself), neuropathology histopathology, somatic-mutation diagnosis (paired lesion-vs-leukocyte sequencing), treatments (MRgLITT/RFTC with quantified seizure-freedom outcomes from the 2024 Neurology IPD meta-analysis PMID:39642321, stereotactic radiosurgery, and antiseizure medication modeled with supports: REFUTE for its documented poor efficacy), qualitative rarity prevalence, NEUROLOGIC classification, and a discussions section (INTERPRETATION on subcortical seizure origin; KNOWLEDGE_GAP on the local cluster-network ictogenesis mechanism with two proposed_experiments). Distinct from Pallister-Hall_Syndrome (MONDO:0007804), the germline GLI3 syndrome in which hypothalamic hamartoma is one component. An internal red-team review (dismech-pr-review) ran before PR and all its CRITICAL/IMPORTANT findings were folded in: corrected the dacrystic-seizure claim-evidence mismatch by sourcing the 2026 international consensus (PMID:41818657) and a multicenter gelastic/dacrystic study (PMID:36580957); retagged all ex vivo electrophysiology evidence (patch-clamp on resected tissue, Xenopus oocyte expression) from HUMAN_CLINICAL to IN_VITRO and split the oocyte control experiment into its own item; moved the GABA-A receptor rundown and GO:0004890 from the large-projection-neuron node to the small-GABAergic-neuron node where the defect actually resides, and reframed the large-neuron depolarization as a chloride-gradient phenomenon; split the bundled secondary-epileptogenesis node into Secondary Epileptogenesis (TISSUE) -> Progressive Epileptic Encephalopathy (ORGANISM) and wired the previously orphaned clinical phenotypes to it; corrected three causal_link_type values (Shh->hamartoma and GABA-excitation->ictogenesis to INDIRECT_UNKNOWN_INTERMEDIATES, GnRH->precocious puberty to INDIRECT_KNOWN_INTERMEDIATES with intermediate_mechanisms); evidenced every remaining edge; swapped the stereotactic-radiosurgery evidence for a directly supporting quote; added MRI and scalp-EEG diagnostics (the characteristically absent ictal EEG correlate being a signature of subcortical origin); made the somatic mosaicism machine-queryable (category Somatic mosaic, variant_origin SOMATIC, inheritance HP:0001442); added the somatic CNV/LOH mutational class; upgraded MRgLITT to MAXO:0000453; and corrected frequency bands against quantitative evidence (gelastic 77% -> FREQUENT; hamartoma -> OBLIGATE). Validated: schema, term validation (--labels), 59/59 snippets exact, folded-hyphen, pathograph fully connected (8 nodes, no dangling/duplicate edges, no unevidenced edges, no orphan phenotypes), reference validator, compliance 94.9%.

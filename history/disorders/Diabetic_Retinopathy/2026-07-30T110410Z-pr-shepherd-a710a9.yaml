  summary: Regrade three ICO-guideline items from SUPPORT to PARTIAL
  details: |
    PR shepherd run addressing ai4c-reviewer IMPORTANT 3 on PR #6963.

    One ICO guideline snippet (PMID:29776671) about resource-tailored public health strategies was
    attached three times as SUPPORT for claims it never mentions. All three regraded to PARTIAL:

    1. Severe NPDR subtype: the snippet says nothing about the 4-2-1 rule, severe NPDR staging or
    follow-up intervals. The ICO guideline is the right source, but a snippet quoting the staging
    criteria themselves is needed to restore SUPPORT.
    2. Panretinal photocoagulation treatment: the snippet does not mention laser photocoagulation or
    cost-effectiveness. The companion PMID:39673354 item already carries SUPPORT for PRP as primary
    PDR treatment.
    3. Pars plana vitrectomy treatment: the quoted fragment establishes the guideline covers management
    of vision-threatening DR but never mentions vitrectomy or its surgical indications.

    No snippets or references were changed, only grades and explanations. Validation: just validate and
    just validate-references pass.

  summary: Distinguish exposure, cumulative dose, comorbidity and marker
  details: |
    Backfill for issue #8085. The four entries are four different kinds of thing and the links say so. Chronic hyperglycaemia is TRIGGERS/DIRECT into the hyperglycaemia-induced oxidative stress node, an identity since the exposure and the node are the same fact. Diabetes duration is EXACERBATES/DIRECT into that same node because duration is not a separate exposure but the integral of the same one, which is why ten years or longer carries the highest odds ratio in the cited cohort. Hypertension is EXACERBATES into the retinal vascular injury node rather than the metabolic one, adding haemodynamic stress to capillaries already injured metabolically, which is why blood pressure control slows retinopathy independently of glycaemic control. Nephropathy and proteinuria is PREDISPOSES into the same vascular node and is explicitly not an exposure: it marks the same diabetic microvascular process already established elsewhere, predicting retinopathy without causing it. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 38 of 38 verified; integrity issue count unchanged.

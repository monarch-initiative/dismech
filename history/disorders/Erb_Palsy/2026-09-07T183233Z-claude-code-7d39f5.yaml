  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES on PR #11381. All four blocking findings and three of the four suggestions applied in one push.

    Finding 1, PMID:38263956 misgraded: confirmed from the cache that it is 'Nerve Tracing in Juvenile Rats' in J Brachial Plex Peripher Nerve Inj. Both evidence items citing it were HUMAN_CLINICAL, which contradicted the rule this entry states for itself elsewhere. Regraded to MODEL_ORGANISM with directness INDIRECT.

    Finding 2, elbow flexion contracture unsupported: the previous snippet was about nerve graft versus transfer outcomes and did not mention the elbow. Fetched PMID:42438048, a 73-patient series on fixed flexion deformity of the elbow following obstetric brachial plexus palsy, and re-evidenced the phenotype from it with two snippets. Frequency dropped rather than re-estimated: a treated case series is a numerator without a denominator of all OBPP, and the description says so.

    Finding 3, no phenotype connected to the pathograph: added five downstream edges so all five phenotypes are now targets. Resolved the two case-only name collisions the reviewer identified by renaming the phenotypes to the clinical signs they actually are, Limited passive shoulder external rotation and Glenoid deformity with posterior humeral head subluxation, with each description recording why the name differs from its mechanism node. Verified programmatically: 5 of 5 phenotypes connected, no dangling targets.

    Finding 4, research under-consumption in the environmental section: added Cesarean delivery with environmental_effect PROTECTS_AGAINST, carrying the adjusted odds ratio of 0.581 in macrosomic newborns, and Fetal macrosomia with environmental_effect PREDISPOSES and causal_link_type INDIRECT_KNOWN_INTERMEDIATES, since it acts through shoulder dystocia rather than directly. Both from already-cached references. The notes now state the consumption rationale rather than leaving it to be inferred: 20 of 46 fetched references cited, with the remainder mostly surgical-technique series that add operative detail rather than mechanism.

    Suggestions taken: NCIT:C157775 Botulinum Toxin Therapy replaces the generic Pharmacotherapy term; MRI diagnostic accuracy added to the diagnosis section, where the 68 percent sensitivity is the point since a negative MRI does not exclude avulsion; directness INDIRECT completed across all MODEL_ORGANISM evidence, 21 items in total.

    Suggestion not taken: the Moro reflex and upper limb undergrowth phenotypes. Both are real and clinically well known, but no reference in this PR's cache states either, so they are recorded in notes rather than asserted from the report alone.

    One snippet failed the pre-commit exact-substring check because the extraction helper matched the cache file header rather than the abstract body, producing a multi-line value that also broke the YAML. Repaired by block-level replacement and re-parsed before validating.

    Validated: just validate (56/56 snippets), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence.

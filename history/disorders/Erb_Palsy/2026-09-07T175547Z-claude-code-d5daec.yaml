  summary: 'Create: Erb Palsy (upper brachial plexus birth injury)'
  details: |
    De novo curation of MONDO:0700303 (Erb palsy), an acquired mechanical injury rather than a Mendelian disorder. Pathophysiology is a causal chain from intrapartum traction through graded stretch injury of the C5-C6 upper trunk and denervation, branching into spontaneous recovery (the dominant outcome) and, in the minority, two independently sufficient routes to internal rotation contracture (subscapularis denervation atrophy, and rotator imbalance) plus aberrant reinnervation through a neuroma-in-continuity, converging on contracture and then glenohumeral dysplasia. 50 evidence snippets, all exact-quote verified. Evidence grading is the point of interest here: the contracture mechanism rests on neonatal rat work and those edges carry evidence_source MODEL_ORGANISM with directness INDIRECT throughout, while the human endpoints and treatment outcomes are evidenced from clinical series. Three rat models curated with modeled_mechanisms, per-link fidelity and limitations, including a HUMAN_MODEL_MISMATCH for the glenoid version change, which goes in the opposite direction to the human deformity. Deep research: one openscientist run, committed, 40/40 citations verified and 9/9 quotes valid; its causal chain is the backbone of the pathophysiology section. Its term validation caught that the report offered HP:0031843 for shoulder contracture, which is Abnormally slow thought process; that term was never bound. A separate error the report and I shared, UBERON:0001812 for brachial plexus, was caught by just validate-terms: that code is palpebral conjunctiva, and the correct term is UBERON:0001814 brachial nerve plexus. 27 reference_title values were corrected against the cache after the reference validator flagged them. Validated with just validate, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-environmental-evidence and the four snippet gates, all passing.

  summary: Review and enrich Shprintzen-Goldberg Syndrome
  details: |
    Tagged GeneReviews PMID:20301454 in top-level references, populated synonyms, bound HP:0000006 on Autosomal Dominant inheritance with GeneReviews support for de novo occurrence and parental germline mosaicism, added Harrison's chapter classifications while preserving ISDS craniosynostosis_syndromes and aortopathy_tgfbeta_dysregulation module conformance, added root molecular node Impaired SKI-SMAD Transcriptional Repression (GO:0003714, GO:0070412, hgnc:10896), moved GO:0060363 cranial suture morphogenesis to Skeletal Development Disruption, documented the TGF-beta hyperactivation vs SKI stabilization/attenuation controversy (PMID:23023332, DOI:10.1101/2021.02.12.431010, PMID:33416497) via counter-evidence and a CONTROVERSY discussion entry, added the orthologous Ski knock-in mouse animal model (DOI:10.1101/2021.02.12.431010), populated Orphanet frequency bands and 25 missing very-frequent/frequent/diagnostic craniofacial, skeletal, neurological, and cardiovascular phenotypes from ORPHA:2462, PMID:20301454, and PMID:9508238 with edge evidence, consolidated SKI genetic entry with ClinGen DEFINITIVE validity assertion, and added preventive avoidance counseling, endocarditis prophylaxis, hernia/aneurysm surgical repair, myopia management, and early developmental intervention treatments.

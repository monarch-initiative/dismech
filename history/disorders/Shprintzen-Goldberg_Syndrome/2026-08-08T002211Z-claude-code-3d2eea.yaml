  summary: Refine Aortic Aneurysm to Aortic root dilatation (HP:0002616)
  details: |
    Retargeted the aortic phenotype from the parent term HP:0004942 (Aortic aneurysm) to HP:0002616 (Aortic root aneurysm), whose HPO definition is 'an abnormal localized widening (dilatation) of the aortic root' and which carries 'Aortic root dilatation' as a broad synonym.

    This is a refinement, not a new claim: the node's own description already read 'Aortic root dilation and aneurysm' - the term binding was simply more general than the prose. Added GeneReviews (PMID:20301454) for the root-specific localization; the original SKI paper citation is retained with its explanation adjusted to say it supports aortic aneurysm generally rather than the root specifically. No frequency band asserted, since SGS cardiovascular involvement is milder and less consistent than in Marfan or Loeys-Dietz.

    Retargeted the existing Enhanced TGF-beta Signaling causal edge to the renamed Aortic Root Dilatation phenotype so the edge continues to resolve after the phenotype refinement.

    Resolves a contradiction reported on a grouping page: this entry is asserted as a member of a grouping whose NECESSARY criterion it did not satisfy.

    Validation: linkml-validate (schema) clean; linkml-term-validator (--labels) clean; reference_snippet_audit 557/557 snippets verified against cached references across the 7 files changed in this tranche.

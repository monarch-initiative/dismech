  summary: 'Create: FDX2-Related_Mitochondrial_Myopathy'
  details: |
    New Disease entry for MEOAL (MONDO:0020714, OMIM:251900), autosomal recessive FDX2 (hgnc:30546, previously FDX1L) deficiency. LUMP/SPLIT: DISEASE. MONDO:0020714 has no descendants, one causal gene and one recessive mode; the muscle-restricted (start-codon alleles) and multisystem (p.Pro144Leu) presentations are described in phenotype descriptions rather than as subtypes because they rest on about a dozen patients and no source names them as separate entities. CONTENT: an 11-node causal chain from biallelic FDX2 variants through reduced FDX2 protein and impaired FDXR-to-FDX2 electron transfer to impaired mitochondrial Fe-S cluster assembly, then four arms (combined complex I-III deficiency, aconitase loss, lipoate-dependent 2-oxoacid dehydrogenase deficiency, mitochondrial iron accumulation) converging on skeletal muscle energy failure and episodic rhabdomyolysis, plus a neuro-ophthalmic node for the p.Pro144Leu families. The lipoylation step carries both SUPPORT (PMID:41372147) and REFUTE (PMID:35079622, PMID:36280795) evidence, and muscle iron accumulation carries a REFUTE item from PMID:35079622. 27 phenotypes (23 causally connected; hyperammonemia, ketonuria, microcytic anaemia and neutropenia left unwired because no source links them to a mechanism), six variants, four treatments (high-lipid/protein parenteral nutrition from a single case, haemodialysis, cofactor supplementation, and trigger avoidance with graded exercise extrapolated from general mitochondrial cytopathy guidance), two diagnostic rows and two differentials (ISCU myopathy, FDXR auditory neuropathy-optic atrophy). No module conformance: complex_i_deficiency models isolated complex I deficiency. KEY PMIDS: 24281368, 30010796, 35079622, 34905296, 37565517, 38444577, 39467201, 41372147, 20547883, 36280795, 32817474.

    DEEP RESEARCH: one openscientist report (research/FDX2-Related_Mitochondrial_Myopathy-deep-research-openscientist.md). It arrived without reference or term validation sections, so just validate-research-reference and just validate-research-terms were run on it in place: 16/16 references resolved, 0 unresolved, 0 off topic (9 judged on topic); 31 terms checked, 29 resolved, 0 unresolved, 2 unverifiable, 11 flagged as named differently, all table-parsing artifacts (frequency-column text read as the label) or the MedGen xref. No CURIE was copied from the report; every binding was looked up in OLS or the committed caches. just preflight-dr could not run because the local MONDO build is absent; a manual check found FDX2 named 71 times and FDX1L 13 times, OMIM 251900 and MEOAL named correctly, and no competing disease gene, so the report is about this disease. From the report the entry uses PMID:39632806 (cryo-EM of FDX2 in the core ISC complex), PMID:12970193 (yeast Yah1), PMID:28965846 (FDXR differential) and PMID:25008908 (exercise guidance); its gnomAD constraint figures were not used because they could not be checked against a cached source.

    VALIDATION: just validate-disorders passed with 128/128 snippets and 128 reference titles verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-reference-titles and check-gene-activity-grounding pass. No GeneReviews chapter exists.

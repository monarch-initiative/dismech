  summary: Wire Hereditary_Breast_and_Ovarian_Cancer_Syndrome to mechanism modules
  details: |
    Added conforms_to edges linking existing pathophysiology nodes to the new germline_two_hit_tumor_predisposition module and, where applicable, to existing hallmark modules the entry had been missing. A survey of 28 hereditary cancer predisposition entries found 21 with no module conformance at all. Conformance targets were chosen against each node's own description so the claim stays honest: nodes describing only a germline heterozygous state map to the first-hit node, and only nodes that assert demonstrated biallelic loss map to the biallelic node. Retinoblastoma additionally gained explicit germline first-hit and somatic second-hit pathophysiology nodes with structured genetic_context (allelic_hit_role, allelic_events, variant_origin) and evidence verified against cached abstracts. All conforms_to foreign keys resolve; schema validation passes.

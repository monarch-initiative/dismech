  summary: 'Create: Dilated Cardiomyopathy 2B'
  details: |
    New entry for dilated cardiomyopathy 2B (GATAD1, MONDO:0013848), replacing
    the curation-queue stub.

    Sources. The human content comes from the single published family
    (Theis et al. 2011, PMID:21965549; its cache was refreshed by
    `just fetch-reference` from abstract-only to PMC full text so that the
    pedigree, treatment and immunohistochemistry passages could be quoted) and
    the ClinGen Limited assertion already cited by the parent
    Dilated_Cardiomyopathy entry. Mechanism and model content comes from the
    14-3-3/Ser102 interaction study (PMID:38605029), the EMSY complex study
    (PMID:26841866), the zebrafish model (PMID:28955713), the cardiomyocyte
    knockout mouse (PMID:39641830) and the ischemia-reperfusion knockout mouse
    (PMID:39626862). ICD, transplantation and cascade screening are supported
    only by general dilated cardiomyopathy sources (PMID:39519012,
    PMID:39833651, and the GeneReviews overview PMID:20301486) and are marked
    INDIRECT. A PubMed search for GATAD1[Title/Abstract] (25 records on
    2026-09-25) found no second family.

    Deep research. One OpenScientist report
    (research/Dilated_Cardiomyopathy_2B-deep-research-openscientist.md) was
    used. Its reference validation resolved 12/12 references; its term
    validation flagged two mislabelled HPO terms and one obsolete GO term,
    none of which were bound. `just preflight-dr` returned PASS (GATAD1
    mentioned 51 times, OMIM 614672 matches MONDO). Several report claims were
    not carried over because the cited sources do not support them: that
    S102P has been shown to alter GATAD1 nucleocytoplasmic transport (the
    interaction paper only suggests this, and found normal nuclear
    localization of S102P in HEK293 cells); that the disease course is
    progressive (both affected sisters were stable in NYHA class II for more
    than 20 years); that GATAD1 is an H3K4me3 reader (it co-purifies with an
    H3K4me3-binding complex); and the 249-residue protein length (the
    discovery paper gives 269). Report citations not used: PMID:40200748,
    PMID:42537484, PMID:31431100, PMID:18579481 and PMID:39855353 are general
    cardiomyopathy papers that do not mention GATAD1 (the report cites
    PMID:40200748 for GATAD1 panel VUS findings, but the cached full text
    contains no GATAD1 mention); PMID:38664609 concerns heterozygous GATAD1
    variants of uncertain significance in an unselected DCM cohort and is
    recorded in notes as not bearing on this recessive entity. The ClinVar
    record for the variant (VCV000031656, Pathogenic, no assertion criteria,
    one submission) was checked directly through NCBI E-utilities.

    Modelling decisions. The variant node is linked to the remodeling node
    by an edge with unknown intermediates, backed by the genetic evidence
    alone; the chromatin and 14-3-3 routes are carried as EMERGING hypothesis
    groups, alongside competing loss-of-function and mutation-specific
    models, with the negative mouse result recorded as REFUTE evidence and as
    a HUMAN_MODEL_MISMATCH discussion. Atrial fibrillation and the left
    ventricular thrombus each occurred in one patient and are left without an
    upstream causal edge. No frequencies are assigned. Only the remodeling
    and heart-failure nodes conform to cardiomyopathy_maladaptive_remodeling,
    for the reasons given in the entry notes.

    Side effects in references_cache: running `just validate` re-extracted
    PMID_20301486.md and PMID_39519012.md with the current extractor
    (frontmatter and body formatting changed; the GeneReviews record also
    lost one editor name). All snippets in the 38 KB files citing these PMIDs
    or PMID:21965549 still verify (2099/2099).

    Validation: just validate, validate-terms, count-verified-snippets
    (all snippets verified), check-entity-refs, check-causal-targets,
    check-genereviews --online (TAGGED), and just validate-disorders.

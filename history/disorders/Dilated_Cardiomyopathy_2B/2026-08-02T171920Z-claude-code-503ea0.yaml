  summary: 'Create: Dilated Cardiomyopathy 2B (GATAD1, MONDO:0013848)'
  details: |
    De novo curation of CMD2B, the GATAD1-related autosomal recessive form of familial isolated dilated cardiomyopathy (MONDO:0013848, OMIM:614672). Deep research was run with two providers: falcon (Edison) and claude_code. Both converged on the same sparse core (PMID:21965549 gene discovery, PMID:28955713 adult zebrafish model, PMID:39641830 negative mouse cardiomyocyte-specific knockout); falcon additionally surfaced PMID:38605029, 2024 interaction proteomics showing Ser102 is a phosphosite whose phosphorylated form binds 14-3-3 in a region validated as a functional nuclear localization signal. That lead was independently verified against the cached full text before use and materially changed the curated mechanism. The entry models two parallel mechanistic_hypotheses rather than one settled chain: gatad1_chromatin_dysregulation_model (CANONICAL, H3K4me3-reader / EMSY-KDM5A-SIN3B epigenetic dysregulation) and gatad1_phospho_14_3_3_nls_model (ALTERNATIVE, Ser102 phospho-switch with NLS masking). Six pathophysiology nodes; the four upstream nodes carry mechanism_confidence HYPOTHETICAL. conforms_to cardiomyopathy_maladaptive_remodeling at the Primary Cardiomyocyte Insult, Ventricular Remodeling, and Structural Cardiac Impairment and Heart Failure nodes; the module Neurohormonal Activation node is deliberately not instantiated because no CMD2B source measures it. Two discussions: a HUMAN_MODEL_MISMATCH on the normal-mouse-knockout versus affected-zebrafish-and-human discrepancy, with four proposed experiments, and an INTERPRETATION discussion on whether a ClinGen Limited single-family entity should be curated at all. NEC preflight was performed against the MONDO gene, OMIM xref, and synonym list and was clean; the entry is kept distinct from dilated cardiomyopathy 2A (MONDO:0012746). GeneReviews: no GATAD1-specific chapter exists, so the disease-class Dilated Cardiomyopathy Overview (PMID:20301486) is tagged in the top-level references block. Validation: just validate passes across schema, term, and reference checks with 53 of 53 snippets verified against cached references; all conforms_to, downstream, attaches_to, target_mechanisms, and hypothesis_group foreign keys were separately verified to resolve.

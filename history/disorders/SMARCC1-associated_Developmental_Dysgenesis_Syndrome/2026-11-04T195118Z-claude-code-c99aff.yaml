  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #16515. (1) Backfilled reference_title on all 30 evidence items from references_cache frontmatter (just backfill-reference-titles) to satisfy the find_missing_reference_titles gate. (2) Split the bundled 'Aberrant H3K27 Methylation and De-repressed Wnt Signaling' node into two: 'Aberrant H3K27me3 Accumulation' (GO:0071558 histone H3K27me2/H3K27me3 demethylase activity DECREASED, PMID:26986003) -> 'De-repressed Wnt Signaling' (GO:0060070 canonical Wnt signaling pathway INCREASED, PMID:29779894). (3) Fixed the progenitor node direction contradiction: renamed to 'Impaired Neurogenesis and Neuronal Differentiation', rebound GO:0021846 proliferation DECREASED -> GO:0030182 neuron differentiation DECREASED (the outcome both mouse models share), and recorded the Baf155/Baf170 dcKO vs Baf155msp proliferation-direction conflict in the node and mouse-model descriptions. Also: grounded SMARCC1 with GO:0003682 chromatin binding (QuickGO-verified MF) on its node for check-gene-activity-grounding; strengthened the SMARCC1->BAF edge with PMID:31020615 (scaffold); added ETV + PMID:42829386 shunt-failure evidence to the CSF-diversion treatment; removed the cardiac clause from Structural Brain Dysgenesis description; added an entry-level ascertainment caveat on the VERY_FREQUENT frequencies; removed 10 uncited reference caches. Fixed the two CI gate failures (reference titles, gene grounding). Revalidated: validate-disorders PASS, terms/entity-refs/causal-targets/logical-rules/grounding/model-scale all clean.

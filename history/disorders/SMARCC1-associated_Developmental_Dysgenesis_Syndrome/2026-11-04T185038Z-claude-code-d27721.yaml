  summary: 'Create: SMARCC1-associated Developmental Dysgenesis Syndrome'
  details: |
    De-novo curation of the SMARCC1 BAFopathy (MONDO:0700123, SMARCC1/hgnc:11104, ClinGen Definitive AD, Brain Malformations GCEP). Deep research: openscientist (preflight-dr PASS, SMARCC1=56 mentions; report reference_validation 21/21 verified, term_validation 22/22, needs_review only benign label mismatches). Primary sources: PMID:38128548 (defining Brain 2024 cohort + Xenopus model), PMID:33077954 (Jin 2020 Nat Med CH exome + Baf155msp mouse), PMID:37285932 (fetal cases, incomplete penetrance), PMID:26986003 & PMID:29779894 (BAF/H3K27me3/Wnt epigenetic mechanism), PMID:34906496 (independent BAFopathy cohort). Pathograph: SMARCC1 LoF -> BAF remodeling dysfunction -> aberrant H3K27me3/de-repressed Wnt -> dysregulated neurodevelopmental transcription -> impaired neural progenitor proliferation -> structural brain dysgenesis; 7/7 phenotypes connected. Xenopus and mouse animal models with modeled_mechanisms. No GeneReviews chapter (verified offline + online). Validated: just validate-disorders PASS (26/26 snippets), terms/entity-refs/causal-targets/logical-rules/gene-validity/coarse/enum/duplicate-keys all clean.

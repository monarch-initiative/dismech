  summary: 'Create: immunodeficiency 32B (IRF8)'
  details: |
    De-novo curation of immunodeficiency 32B (MONDO:0009194), autosomal recessive complete IRF8 deficiency (biallelic LOF, hgnc:5358). Grounded directly in primary literature (no deep-research recipe run): Hambleton NEJM 2011 (PMID:21524210, foundational; K108E AR vs T80A AD alleles), Salem Blood 2014 (PMID:25122610, K108E functional characterization + mucocutaneous fungal infection), Bigley JACI 2018 (PMID:29128673, biallelic complex immunodeficiency), Rosain J Clin Immunol 2022 (PMID:35338423, AR complete IRF8 deficiency with PAP), Cytlak Immunity 2020 (PMID:32735845). Modeled a causal chain: IRF8 biallelic LOF -> failed mononuclear-phagocyte/dendritic-cell development -> compensatory granulocytic hyperplasia + impaired antimicrobial effector immunity -> disseminated BCG, mucocutaneous candidiasis, severe viral infection, PAP. Phenotypes bound to HP; cell types CL; processes GO; treatments NCIT (HSCT, antimicrobials). IMD32A (T80A, autosomal dominant, MONDO:0009193) noted in description as the separately-curated milder allelic disorder. All 24 evidence snippets are exact abstract-level quotes verified via count-verified-snippets; validated with just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-disorders (all pass). No GeneReviews article exists for IRF8.

  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #10584. CRITICAL: rebound 'Impaired natural killer cell development' from HP:0040218 (Reduced total NK count) to HP:0012177 (Abnormal natural killer cell physiology) since all reported IMD32B patients had normal or increased NK counts (Rosain 2022); added a REFUTE counterbalancing evidence item recording the normal NK count. IMPORTANT: moved the PAP downstream edge from 'Impaired Antimicrobial Effector Immunity' to 'Failed Mononuclear Phagocyte and Dendritic Cell Development' (alveolar-macrophage/developmental basis); connected the two orphan phenotypes by adding a 'Microglial Dysfunction' node (off the development node) driving Intracerebral calcification and a 'Widespread Immune Dysregulation' node (off IRF8 loss) driving NK, memory-B, and memory-T phenotypes; softened 'fatal in infancy' to early childhood (transplants at 9 months and 4 years); cited the previously uncited IL-12/IFN-gamma claim (PMID:25122610, PMID:35338423). Mined the unmined immune-dysregulation axis from PMID:29128673 (TH1/TH17/CD8 memory reduction, impaired B-cell development/class-switch, dysplastic hypofunctional granulocytes). SUGGESTIONS: cited PMID:32735845; added PAP whole-lung-lavage/steroid and live-vaccine-avoidance treatments; replaced coarse NCIT:C254 with specific CHEBI antimicrobial agents (rifampicin, ethambutol, pyrazinamide, levofloxacin, amphotericin B); moved RECURRENT from candidiasis name to a temporality qualifier. IMD32A stub already exists (MONDO:0013957); OMIM 226990 already xref'd by MONDO:0009194 so no separate mapping added. Deep-research providers unavailable in this environment (no API keys); grounded entirely from the five cached full texts. Validated: schema, terms, count-verified-snippets 45/45, causal-targets, entity-refs, duplicate-keys, enum-values, snippet-length, snippet-grading, validate-disorders all pass.

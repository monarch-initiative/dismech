  summary: 'Create: CHKB-Related Congenital Muscular Dystrophy'
  details: |
    New entry for megaconial congenital muscular dystrophy (CHKB). Deep research via claude_code (preflight-dr PASS, gene CHKB). Unbundled chain: CHKB LoF -> impaired CDP-choline flux -> phosphatidylcholine deficiency -> mitochondrial membrane dysfunction -> impaired fission + megaconial redistribution -> myofiber degeneration. disease_term rebound from the claim's MONDO:0010923 (adult allelic form) to the canonical MONDO:0011246 (congenital megaconial CMD); 0010923 kept as relatedMatch. No mitochondrial module fits (respiratory-chain/aging modules only), so no conformance. Evidence PMID:21665002, 9427222, 19236939, 21750112, 34518586. Validated: validate, validate-terms, 14/14 snippets, validate-disorders, all gates.

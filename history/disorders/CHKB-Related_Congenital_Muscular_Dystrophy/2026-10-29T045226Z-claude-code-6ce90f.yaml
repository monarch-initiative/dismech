  summary: 'Review round 2: CHKB-Related Congenital Muscular Dystrophy'
  details: |
    Addressed the PR #15901 CHANGES_REQUESTED review. Fetched, cited and GeneReviews-tagged the CHKB-Related Muscular Dystrophy chapter (PMID:37011121) for diagnosis, management (avoid strenuous exercise and viral infections) and genetic counseling. Fixed a 3-word evidence snippet on the Myofiber Degeneration node to a full source substring. Added common phenotypes from the 15-patient series PMID:26067811 (elevated CK, ichthyosis, microcephaly, seizures, global developmental delay) and GeneReviews (speech delay, loss of ambulation, autistic behavior, ADHD), wiring elevated CK causally to myofiber necrosis. Added diagnosis (molecular testing, muscle biopsy) and histopathology (megaconial pattern) sections. Added the enhanced-mitophagy pathophysiology branch (PMID:21750112) and the rmd mouse animal model. Added the adult-onset LGMD allelic form (MONDO:0010923, PMID:26782016) as a has_subtypes entry, dropping the prior relatedMatch mapping. Dropped the unsupported supportive-care INHIBITS edge; added cardiac-surveillance and exercise/infection-avoidance management rows. All offline gates pass; 35/35 snippets verified.

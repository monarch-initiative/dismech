  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 13'
  details: |
    De-novo curation of COXPD13 (MONDO:0013977, OMIM 614932, PNPT1). Deep research: falcon (Edison) run committed under research/; passed just preflight-dr against MONDO:0013977 (PNPT1 mentioned 50 times, OMIM 614932 agreeing); its reference validation was 6/6 resolved with 0 confabulation and its term validation had 0 unresolved terms - the four mislabelled entries in its frontmatter are the validator reading a table commentary column as a term label, not real mis-bindings. The report cites by author-year key rather than PMID, so leads were resolved via DOI and the PMC ID converter before use; PMID:30024931 (Shimada mouse Pnpt1 knockout) came from it. All other references were found independently through PubMed E-utilities. GeneReviews: searched, none exists for PNPT1 or COXPD13; recorded as a checked negative in the entry notes. Content: 12-node pathophysiology chain drawn as two branches from one molecular lesion - the respiratory-chain branch (PNPase trimer/catalysis loss -> impaired small-RNA import and defective mtRNA processing -> impaired mitochondrial translation -> combined complex deficiency -> tissue energy failure) and the innate-immune branch (degradosome loss -> mitochondrial double-stranded RNA accumulation and cytosolic escape -> type I interferon activation). 21 phenotypes, 5 variants, 3 biochemical markers, 1 animal model with 2 mechanism links and 2 readouts, 3 diagnostic entries, 4 differential diagnoses including the two allelic PNPT1 entities (DFNB70 and SCA25) kept deliberately separate, 3 treatments, 4 discussions. Module conformance declared only at mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress; innate_antiviral_interferon_response was considered for the interferon node and rejected as pathogen-specific. Validation: just validate-disorders passed (schema, terms, references batched); count-verified-snippets 87/87 verified; validate-terms passed; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all clean. Compliance 89.9 percent global, 90.2 percent weighted. No datasets block: with roughly 15-24 reported patients worldwide there is no disease-specific dataset, and a gene-only search on PNPT1 would surface the cancer literature, which is Named Entity Confusion by another route.

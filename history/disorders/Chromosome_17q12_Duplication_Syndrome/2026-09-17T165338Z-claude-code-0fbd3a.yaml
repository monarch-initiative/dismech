  summary: 'Create: Chromosome_17q12_Duplication_Syndrome (MONDO:0013796)'
  details: |
    De novo curation of MONDO:0013796, the recurrent 17q12 copy-number gain, as a separate Disease entry from the existing Chromosome_17q12_Deletion_Syndrome. Deep research: one OpenScientist run (research/Chromosome_17q12_Duplication_Syndrome-deep-research-openscientist.md). Two process findings are recorded in the entry notes and are the reason several draft claims changed. First, that run wrote neither the reference_validation frontmatter block nor the Reference Validation and Term Validation sections although the validators demonstrably ran, since their warnings appear in the run log; both sections were recovered with just validate-research-reference and the committed report carries them. Second, just check-genereviews reported NO_CHAPTER when run against the draft that had no synonyms, and UNTAGGED_CHAPTER once synonyms were added, surfacing PMID:26925472 '17q12 Recurrent Duplication' which the deep-research report never cites. Two claims in the first draft were wrong as a result and were corrected: the de novo fraction (the class-wide 34 percent from newborn trios was used where the chapter gives about 10 percent for this locus) and the absence of a seizure frequency (the chapter gives 36 percent). The chapter is now tagged and supplies five further phenotypes, the diagnostic criterion and the surveillance schedule. The report's term validation flagged four NCIT identifiers whose labels name unrelated concepts (C15318, C15328, C15311, C265); none is bound. preflight-dr returned SKIP because MONDO records no causal gene for this term; manual fallback gene counts are HNF1B 33, LHX1 13, ACACA 12. Validation run in the worktree: just validate 51/51 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-genereviews TAGGED - all clean.

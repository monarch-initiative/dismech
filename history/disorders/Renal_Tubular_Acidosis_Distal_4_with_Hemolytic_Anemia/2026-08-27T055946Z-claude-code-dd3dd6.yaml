  summary: Resolve the dRTA arm assignment and wire it to the mineralization module
  details: |
    Issue #8995 item 2 left this entry's arm assignment open ('needs a look'). Added an 'Acidosis-Driven Calciopenic Mineralization Defect' node conforming to defective_skeletal_mineralization#Calciopenic Substrate Deficiency, interposed between the existing 'Distal Urinary Acidification Failure' node and the Rickets phenotype; the previous direct edge was refined into the two-step chain, carrying its PMID:20799361 evidence onto the new downstream edge. Assignment rests on PMID:16110243 (alkali alone raised 1,25-dihydroxyvitamin D with 25-hydroxyvitamin D unchanged, locating the defect at calcitriol generation) and PMID:35118447 (hypercalciuria and secondary hyperparathyroidism as the distal-RTA route to bone disease). Node notes record that the assignment is non-exclusive: PMID:35118447 also postulates acidosis-mediated osteoclastic resorption, which belongs to osteoporosis_bone_resorption, and PMID:16110243 is n=2 adults with osteomalacia rather than paediatric rickets. Validated with just validate (66/66 snippets verified) and the offline CI gates.

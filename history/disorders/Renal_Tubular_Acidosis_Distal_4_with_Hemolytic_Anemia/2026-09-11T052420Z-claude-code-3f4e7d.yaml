  summary: 'Address review: bind net renal calcitriol generation to a live GO term'
  details: |
    Review round on PR #9636. The reviewer suggested binding the node's central claim (net renal calcitriol generation falls with 25-OH-D intact) to GO:0036378 'calcitriol biosynthetic process from calciol'. Checked that CURIE against GO before using it: it is OBSOLETE, so binding it would have introduced a retired term. Searched GO for a live replacement; the only other live calcitriol term is GO:1902098 'calcitriol binding', a molecular function that does not carry a biosynthesis claim. Bound GO:1901755 'vitamin D3 biosynthetic process' (DECREASED) instead, which is live and correct-grain since calcitriol is 1,25-dihydroxyvitamin D3. The two module-inherited terms on the node were left untouched, as the reviewer asked. Validated with just validate-disorders (111/111 snippets verified), just check-not4curation.

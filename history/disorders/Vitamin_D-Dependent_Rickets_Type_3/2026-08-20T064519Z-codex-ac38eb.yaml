  summary: 'Review: scientific and structural expansion of VDDR3'
  details: |
    Performed an independent scientific and structural review after the existing CREATE and EDIT records. The reviewed entry now represents the recurrent germline CYP3A4 c.902T>C (p.Ile301Thr) gain-of-function disorder across five molecularly confirmed cases located through August 2026, while keeping acquired CYP3A4 induction separate. Curated 6 atomic pathophysiology nodes, 18 phenotypes, 6 imaging findings, 2 treatments, 3 diagnostic approaches, 8 differential diagnoses, 2 experimental models, 1 computational model, and 2 discussions. No disease-specific animal model, clinical trial, or dataset was located. The six unique evidence sources support 106 exact cached snippets; five new reference-cache files were generated only with just fetch-reference. Effective pharmacologic-dose vitamin D, alfacalcidol, and adjunctive calcium regimens are evidence-calibrated, as are VDDR2B and other close differentials. Case-only observations do not carry unsupported frequency estimates, and delayed speech remains unwired because its report establishes co-occurrence rather than causality. Validation passed for schema, live ontology terms, offline enum membership, term-cache integrity and order, reference frontmatter, and 106/106 strict snippets. The graph has 31 nodes, 38 edges, no orphan targets, complete causal-gene wiring, and two weak components: a 30-node mechanistic component plus the intentionally unwired delayed-speech observation. A total of 229 focused render, export, and QC tests passed, together with duplicate-key, empty-snippet, folded-hyphen, title-snippet, short-snippet, and diff guards. Independent pinned content audit approved target SHA256 53444f531412634abd57eb283741a44f5a7bc1553437153e81ae3f52585eb8a1, git blob 908ea2dd1b7ff8a8804e1e444d4f5fa2f8204544, and the exact 14-file manifest SHA256 9a3f275e9ad9f172b28cc29cd8915ee9182b0813125a4352de0a9d7600bfa9b0. Remote main had advanced to c61c965f8630ddf155cae58e827a23a03616740a after that pinned-base audit, so cache-row union and current-base validation are explicitly deferred to the clean post-commit rebase; no reviewed content blob may be silently rewritten during integration.

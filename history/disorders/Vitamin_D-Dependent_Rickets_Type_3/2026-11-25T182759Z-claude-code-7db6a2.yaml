  summary: 'Gene-family review: CYP3A4'
  details: |
    CYP3A4 modelling re-reviewed and the direction confirmed: the heterozygous recurrent p.Ile301Thr allele is a gain of function, and the trigger node binds steroid hydroxylase activity (GO:0008395) as increased. GO has position-specific vitamin D hydroxylase terms (23-, 24-, 25-hydroxylase), but the mutant's distinguishing product is 11-alpha-hydroxylated 25-hydroxyvitamin D3 and calcitriol, which no GO term names, so the generic term was kept. The node description and evidence now record that acquired 11-alpha-hydroxylation and the low VDR affinity of its products (PMID:41046353). The genetic record gains a record-level autosomal dominant inheritance block (de novo occurrences, PMID:29461981) and a 2025 review stating that CYP3A4 gain-of-function mutations cause VDDR3 through accelerated calcitriol clearance (PMID:39893280). No ClinGen CYP3A4 assertion exists.

  summary: Bind CYP3A4 targeted mutation analysis LOINC code to the molecular diagnosis
    row
  details: |
    LOINC tranche H batch 3. This disease is itself caused by a germline CYP3A4 gain-of-function variant (the recurrent c.902T>C / p.Ile301Thr allele), and its existing 'CYP3A4 Molecular Testing' diagnosis row describes sequencing that confirms the diagnosis -- a different shape from the other CYP3A4-mentioning entries examined in this batch (Cushing_Disease, Ergotism, Vitamin_D-Dependent_Rickets_Type_1B), all of which mention CYP3A4 only as a drug-metabolism confound or a differential-diagnosis gene, with no CYP3A4 test of their own, and so were declined. Searched the gene-symbol abbreviation 'CYP3A4' (surfaces a full identity family including a targeted-mutation-analysis code, LOINC:74007-6) and the spelled-out name 'cytochrome P450 3A4' (returns no LOINC results, confirming the symbol search was the productive direction). Bound LOINC:74007-6 'CYP3A4 gene targeted mutation analysis', the identity-level code, rather than a variant-specific Presence code, consistent with how TPMT, DPYD, UGT1A1 and VKORC1 were each bound in this project. Confirmed LOINC:74007-6 absent from origin/main before seeding, and its label verified fresh from the Monarch KG entity endpoint.

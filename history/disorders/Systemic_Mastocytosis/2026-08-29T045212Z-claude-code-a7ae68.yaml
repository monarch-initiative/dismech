  details: |
    Added Bone Marrow Mastocytosis (MONDO:0015558) as a has_subtypes entry per WHO 5th ed and the ECNM/AIM consensus (PMID:35732831, PMID:34901755). Added a SRSF2/ASXL1/RUNX1/NRAS somatic co-mutation genetic entry (relationship_type: COOPERATING) citing PMID:26464169 and PMID:42310859, with notes distinguishing TET2's high frequency from its lack of independent prognostic significance. Added a TPSAB1 germline copy-number-gain genetic entry (relationship_type: MODIFIER, variant_origin: GERMLINE) for hereditary alpha-tryptasemia citing PMID:32777817 and PMID:27749843. Added an Anti-Mediator Symptomatic Therapy treatment (H1/H2 antihistamines, cromolyn, epinephrine) targeting the Mast Cell Mediator Release node, grading the only placebo-controlled cromolyn trial (PMID:2110198) as PARTIAL since benefit was GI-specific. Added a prevalence: block (annual incidence and 14-year period prevalence, Denmark) from PMID:24761987. All sourcing was pre-verified in the issue's own analysis comment; validated with just validate-disorders, check-entity-refs, check-duplicate-keys, count-verified-snippets (39/39 verified).

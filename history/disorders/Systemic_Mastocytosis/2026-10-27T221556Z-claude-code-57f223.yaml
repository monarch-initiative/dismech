  summary: Wire the H1 antihistamine component of anti-mediator therapy to the H1
    receptor antagonism module
  details: |
    The Anti-Mediator Symptomatic Therapy treatment already bound its four components as separate agents, an H1 antihistamine, an H2 antihistamine, cromolyn and epinephrine, so it identifies which agent is which and needed no split. Splitting it would also have been wrong: its evidence is strategy-level, stating treatment goals for indolent disease and a cromolyn trial result, and no snippet supports an H1-specific or H2-specific claim, so the split halves would each have been left without evidence of their own.

    An Antihistamine Occupancy of H1 Receptors node was added as a therapeutic_vulnerability conforming to h1_receptor_antagonism, and the treatment reaches it through a second target_mechanisms item with treatment_effect ACTIVATES; the pre-existing link to the mast cell mediator release node is unchanged. Receptor-level evidence is cited for the link and the node, since the entry's own citations do not go to the receptor. The node carries no downstream edge, because the relation between an antagonist and the mediator release it blocks is inhibitory. No location is bound, as the H1-mediated symptoms are multisystem.

    The H2 component is deliberately not wired. The h2_receptor_antagonism module is scoped to gastric acid secretion and this entry does not establish that pathway; the other two components act on degranulation rather than at a histamine receptor.

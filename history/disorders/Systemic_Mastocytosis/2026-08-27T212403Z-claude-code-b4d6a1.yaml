  summary: Link KIT inhibitors to the KIT D816V node via target_mechanisms
  details: |
    Added target_mechanisms links from the two KIT-inhibitor treatments back into the pathograph, closing the gap issue #9035 named explicitly ("The KIT-inhibitor treatment pattern (midostaurin, avapritinib) is a good target_mechanisms candidate"). Before this change neither mastocytosis entry had a single target_mechanisms link, so the drugs rendered as an unattached treatment list beside a KIT-driven pathograph they never touched.

    Avapritinib and midostaurin both point at the existing Constitutive KIT D816V Signaling node with treatment_effect INHIBITS. Both links carry their own evidence, separate from the treatment-level evidence, because the link makes a different claim (this drug acts on this node) from the treatment entry (this drug works in this disease).

    The two links are deliberately not symmetrical. Avapritinib's cites molecular remission of the KIT D816V allele burden under treatment, which is evidence that the node itself and not only its downstream consequences is suppressed. Midostaurin's carries a second, PARTIAL item quoting the pivotal trial's finding that response rates were similar regardless of KIT mutation status: midostaurin is a multikinase inhibitor, so inhibition of this node is demonstrably not the whole of its effect in advanced SM, and the link should not be read as claiming otherwise.

    No other section of the entry was touched; the WHO subtype block, pathophysiology, phenotypes and genetic sections are unchanged.


  summary: Review and enrich Systemic_Mastocytosis
  details: |
    Added synonyms, Harrison's ONCOLOGY_HEMATOLOGY and ICD-O Myeloproliferative Neoplasm classifications, adulthood onset progression, and NCIT-bound diagnostic procedures (Bone Marrow Biopsy, Tryptase Measurement, Genetic Testing). Completed structured prevalence fields. Added SOMATIC GAIN_OF_FUNCTION genetic_context and CL:0000097 mast cell binding to Constitutive KIT D816V Signaling and removed redundant downstream biological processes. Wired Cutaneous Mastocytosis downstream of clonal mast cell infiltration, added cached evidence to phenotypes, and added therapeutic_modality and target_mechanisms to cytoreductive therapy and stem cell transplantation.

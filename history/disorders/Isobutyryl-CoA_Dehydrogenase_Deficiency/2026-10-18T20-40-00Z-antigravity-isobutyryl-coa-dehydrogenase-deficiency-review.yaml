    newborn screening/UPLC-MS/MS/ACAD8 diagnostic modalities, and differential diagnoses distinguishing
    short-chain acyl-CoA dehydrogenase deficiency (MONDO:0008722) and ethylmalonic encephalopathy (MONDO:0011229).

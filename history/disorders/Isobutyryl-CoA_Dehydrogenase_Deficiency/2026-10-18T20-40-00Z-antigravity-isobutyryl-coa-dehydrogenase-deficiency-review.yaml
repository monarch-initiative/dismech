  summary: Consolidated duplicate ACAD8 genetic entries for clean mechanism wiring, removed deprecated
    percentage slot in prevalence, and added inheritance, progression, diagnosis, differential_diagnoses,
    datasets, and references sections.
  details: Merged duplicate ACAD8 entries in genetic so ACAD8 wires cleanly into ACAD8 molecular function
    deficiency (GO:0003995 acyl-CoA dehydrogenase activity). Removed deprecated percentage slot from Zhejiang
    newborn screening prevalence and added global literature case count prevalence (172 cases via PMID:41606743).

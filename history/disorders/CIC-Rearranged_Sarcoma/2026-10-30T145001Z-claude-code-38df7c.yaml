  summary: 'Create: CIC-Rearranged Sarcoma (MONDO:0956989)'
  details: |
    New entry for one of the four entities of the undifferentiated small round cell sarcoma category introduced in the 2020 fifth edition of the World Health Organization classification of bone and soft tissue tumours. It is a neuroblastoma mimic and a sibling of Ewing sarcoma, which the knowledge base already holds.

    Curated by hand from the primary literature rather than from a deep-research provider run, so no report was placed in research/, which takes provider outputs only.

    Pathograph: five nodes in one chain. CIC gene rearrangement, carrying the CIC and DUX4 gene descriptors and GO:0003700 marked GAIN_OF_FUNCTION, leads to loss of CIC transcriptional repression (GO:0001227 DECREASED), then to PEA3 subfamily transcription factor upregulation (GO:0000981 INCREASED), then to aggressive undifferentiated round cell proliferation (GO:0008284 INCREASED), and finally to poor response to Ewing sarcoma chemotherapy. The last node records an outcome and says so: no molecular mechanism of chemoresistance is established for this entity.

    No cell of origin is marked, and the entry says why. The somatic lesion is recorded in the genetic section with variant_origin SOMATIC rather than as a genetic_context on a pathophysiology node, because the human cell of origin is unresolved. Marking an origin node without a cell type would have created the first finding in the ORIGIN_WITHOUT_CELL class, and binding a cell type would have asserted a lineage from a mouse ex vivo model. just check-cancer-origin reports the entry as having no origin node identified, which is the intended and accurate outcome.

    Two histopathology items, one with only its necrosis component bound. A label search of NCIT through the OLS4 API on 30 October 2026 for Small Round Cell, Round Cell Pattern and Myxoid returned disease concepts rather than morphology findings, so no finding term exists for the round cell pattern; the notes record the search and its result. The immunoprofile item is left unbound because NCIT codes immunohistochemistry results per marker and has no term for this combination.

    Prevalence is recorded as the qualitative ULTRA_RARE tier with measure_type UNKNOWN and no rate. No population incidence figure was found; the largest cohorts are referral-centre case series.

    Eleven references, all newly cached. Thirty-three snippets, all verified against the cached references, and thirty-three reference titles checked.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms, validate-terms and check-shared-disease-terms. Term validation added six rows across four cache files, all additions.

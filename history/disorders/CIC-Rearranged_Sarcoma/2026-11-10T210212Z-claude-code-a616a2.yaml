  summary: 'Edit: CIC-Rearranged Sarcoma, differential row for neuroblastoma'
  details: |
    Neuroblastoma names this entry as a differential diagnosis; this entry did not name it back. A third differential row now does, bound to MONDO:0005072.

    The row rests on two papers already cached and cited by the sibling entries. PMID:28640941, a PHOX2B immunohistochemistry series, names CIC-rearranged round cell sarcoma among the mimics the stain distinguishes from neuroblastoma: 70 of 76 peripheral neuroblastic tumours were positive and staining was absent or limited in all 164 other tumours, ten CIC-rearranged sarcomas among them. PMID:27562494, the ETV4 series, is quoted twice and graded INDIRECT, because its 110 comparison tumours included no neuroblastoma; the row says so. Quotes that also appear in the Neuroblastoma entry keep the same grading.

    Validation: just validate, validate-terms and validate-disorders pass; all snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass.

  summary: 'Review round 1: connect the phenotype layer, add the mouse model'
  details: |
    Round one of review on the pull request that creates this entry. The reviewer requested changes on one point and made four suggestions; all are addressed in this one push.

    Blocking point. The phenotype layer was disconnected from the pathograph, with 0 of 1 phenotypes causally connected, and the commonest clinical feature of the disease was missing. Added a Metastatic Dissemination phenotype and connected both it and Deep Soft Tissue Sarcoma to the proliferation node with downstream edges. just list-disconnected-phenotypes now reports 2 of 2 connected.

    The metastasis phenotype is deliberately left unbound. A label and synonym search of HPO through the OLS4 API on 30 October 2026 for metasta star returned exactly one term, HP:0200059 Metastatic angiosarcoma, which is a different disease. The reviewer suggested binding a metastasis term; none exists in HPO. Binding a site term such as HP:0100526 Neoplasm of the lung would have asserted a metastatic site that the sources cited here do not give for this entity, so the search and the reason are recorded in the phenotype notes instead.

    Suggestions taken. The ex vivo mouse model is now an animal_models entry with a modeled_mechanisms link to the proliferation node, RECAPITULATES, fidelity MODERATE, model_scale CELLULAR, a limitations field covering the mouse recipient cell, the transduced cDNA and the species, and a readout for Ccnd2 carrying the growth-inhibition result. just model-scale-audit reports the link as ALIGNED. The chemotherapy treatment now carries a target_mechanisms link to the proliferation node, with a description making clear that the link records what the treatment is aimed at rather than that it works. The node describing loss of CIC repression gained a second evidence item from a review of this disease, which anchors the repression mechanism in a CIC-sarcoma paper rather than only in the lung cancer study; the outcome node gained the same review's sentence on progression and chemotherapy resistance.

    Not taken. The reviewer also asked for a deep-research provider run. This entry was curated by hand on purpose, and a reply on the pull request explains why and asks the reviewer to accept the hand-curated approach for this series.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms, validate-terms, check-shared-disease-terms and check-delivery-system. Thirty-nine snippets, all verified. One new reference cache.

  summary: Add NUT carcinoma as a differential diagnosis for the CIC::NUTM1 variant
  details: |
    Adds a differential row for NUT carcinoma (MONDO:0005563), scoped to the CIC::NUTM1 variant.
    Sources: a six-case CIC::NUTM1 series (PMID:30407212): NUTM1 in all six, ETV4 in five and
    the C-terminal WT1 antibody in two; half arose in the central nervous system; and the
    phenotype may be confused with NUT carcinoma. A multicentre study already cited by the entry
    (PMID:35178869) gives the usual sites of CIC-rearranged sarcoma, mostly soft tissue, for
    contrast. A case report (PMID:29700887) describes a CIC::NUTM1-rearranged epithelioid
    neoplasm in a 60-year-old man classified as NUT carcinoma, with strong NUT, weak ETV4 and no
    WT1, and cites earlier expression profiling that placed three CIC::NUTM1 tumours with the
    CIC-rearranged sarcomas and apart from NUT carcinomas. The row's notes record that no source
    cited in the entry reports ETV4 or WT1 in a series of NUT carcinomas, or NUT staining in
    CIC::DUX4 sarcomas; that was checked by searching the sentences of the entry's 16 cached
    sources. Validation: just validate and check-entity-refs pass; all snippets verify.

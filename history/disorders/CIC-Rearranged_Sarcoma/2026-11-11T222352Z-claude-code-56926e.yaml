  summary: Add the CIC::DUX4/P300-CBP MHC class I immune-evasion branch
  details: |
    Adds the immune-evasion arm of this tumour's biology from one new reference, PMID:41299516. Two
    pathophysiology nodes, MHC Class I Antigen Presentation Suppression and Immune-Cold Tumour
    Microenvironment, hang off a second edge out of the root lesion node, so the entry now carries a
    branch parallel to the PEA3 proliferation arm rather than only that arm. The source is a mouse
    modelling paper, and its dox-inducible CIC::DUX4 chimeric mouse plus the imChCDS line derived from
    it are added as a second animal model with two mechanism links, each carrying a readout. That model
    is what makes the branch curatable at all: the entry's existing models are a xenograft and an ex
    vivo transplant, and neither can support a claim about the tumour microenvironment, where this line
    grows in immunocompetent hosts. The paper also states the chemoresistance this entry's own
    description asserts, so that clause is now cited, graded BACKGROUND and HUMAN_CLINICAL because the
    sentence is the paper's framing of the clinical literature rather than its own result.

    What the branch deliberately does not claim is that the cold microenvironment sustains tumour
    growth. Switching the fusion off arrests the cell cycle as well as restoring antigen presentation,
    and in immunodeficient hosts the same withdrawal makes established tumours regress with no T cells
    available, so the regression those experiments report cannot be attributed to the immune arm. The
    two new nodes therefore reach no phenotype and the branch dead-ends, which leaves phenotype
    connectivity unchanged at 2 of 2. An edge to either existing phenotype would have been unsourced.

    Two read-only verifiers re-checked the change against the cached paper before this was pushed, and
    four of their findings changed what the entry asserts. The first version of the new root edge said
    the MHC class I suppression was a separate output of the fusion rather than a consequence of the
    PEA3 programme. The paper does not support that: it reports no occupancy experiment at these loci,
    never relates ETV or PEA3 expression to antigen presentation, and both of its manipulations collapse
    the whole target programme at once, since the P300/CBP inhibitor also downregulates the fusion's
    target genes. The edge now says the route is untested and is drawn from the lesion for want of a
    demonstrated intermediate. Second, the model link's limitations claimed that the same manipulation
    restores presentation in human lines, concluding that the species gap was in the readout rather than
    the mechanism. Neither holds: dox withdrawal has no counterpart in a line carrying an endogenous
    translocation, and the human experiment used P300/CBP inhibition in combination with interferon
    gamma where the mouse system recovered without it - a difference the source does not explain, and
    itself a candidate species difference. Third, the node description said both transcript levels and
    surface presentation recover in the murine system under either manipulation; transcript-level
    recovery under P300/CBP inhibition is reported for the human lines, not the mouse ones, and the
    description now says so. Fourth, the entry's pre-existing note about no cell of origin being marked
    described the single mouse model that then existed and became ambiguous once a second was added; it
    now covers both, and records that the new model pre-selected no lineage yet produced tumours only
    in soft connective tissue, which narrows the permissive mouse lineage without naming a human cell
    of origin.

    Two grading changes followed from the same review. The cold-microenvironment node was supported by
    the sentence reporting T cells arriving after presentation was restored, graded DIRECT although the
    node's claim is the depleted state; it now quotes the sentence that states the cold phenotype
    outright, and the restoration sentence stays where its claim is the increase, as a readout on the
    model link. The model link's own informativeness evidence moved to INDIRECT, matching how the
    sibling link grades the same kind of claim. The animal model's genotype no longer calls the
    transgene human, which the cached record does not let a reader confirm.

    Validation: schema, terms and references clean; 67 of 67 snippets verified; 23 check recipes with no
    failures; the model-scale audit sees three links, all scale-determined and all aligned, where it saw
    one before, which confirms the new links are reachable by it.

    Review round 1. Two changes. The edge from the lesion node to MHC class I suppression was
    causal_link_type DIRECT while its own description said the route is untested and the edge is drawn
    from the lesion for want of a demonstrated intermediate; it is now
    INDIRECT_UNKNOWN_INTERMEDIATES, which is the value for that and which this file already uses
    twice. And the cold-microenvironment node was supported only by the figure legend that names the
    cold phenotype; it now also carries the measured composition of the infiltrate in the untreated
    state - predominantly CD4-positive before the fusion is switched off - which both strengthens the
    node and records why it binds the broad T cell term rather than a CD8 or cytotoxic one, since
    those would describe the treated compartment instead of the cold one.

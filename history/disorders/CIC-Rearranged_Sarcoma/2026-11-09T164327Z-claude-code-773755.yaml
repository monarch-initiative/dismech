  summary: Cite every causal edge in CIC-rearranged sarcoma
  details: |
    All six pathophysiology causal edges carried no evidence; all six are now cited, with ten evidence items drawn from the entry's existing reference set. No new references were fetched and no terms were bound.

    The gradings carry the argument. Both the fusion-to-loss-of-repression edge and the PEA3-upregulation-to-proliferation edge are INDIRECT: the review sentence on the first writes the activating output as potential and relief of repression at the same sites is an inference; on the second, the loss-of-function experiment silences Ccnd2, Ret and Bcl2, none of which is a PEA3 member, so it bears on the edge through the fusion's programme rather than through the named node. The chemotherapy edge pairs a review's statement of poor response to Ewing protocols with the 148-patient survival gap, the latter INDIRECT because survival under broadly similar treatment is not a response measurement. The metastasis edge's two items both come from the same 18-patient series, and the explanations name the six-patient denominator behind its 55 per cent.

    No cell of origin was marked, and no genetic_context was added to a pathophysiology node. The entry's own notes record that decision and its reason: the human cell of origin is unresolved, and the mouse model's embryonic mesenchymal recipient cell is a statement about a permissive mouse cell. That note was re-checked against the current literature before being left alone. PMID:41299516 (Mol Cancer, November 2025), a doxycycline-inducible CIC::DUX4 chimeric mouse model, reports that the fusion drives tumorigenesis in permissive lineages of soft connective tissues and that its derived cell line retains the transcriptional footprint of its own mesenchymal cell of origin. That reinforces the note rather than superseding it, so the entry still reports NO_ORIGIN under just check-cancer-origin.

    Validated with just validate-disorders over all three sibling entries (134 snippets, 134 titles, 0 issues) plus the per-file and whole-tree offline gates.

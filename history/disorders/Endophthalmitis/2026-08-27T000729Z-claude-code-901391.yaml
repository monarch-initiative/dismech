  summary: 'Create: Endophthalmitis'
  details: |
    New root entry for endophthalmitis MONDO:0016047, curated with CURATE_ROOT_WITH_SUBTYPES scope per issue 9550. Modeled route-of-entry has_subtypes: Acute Postoperative, Chronic Postoperative, Post-Traumatic, Bleb-Associated, Post-Intravitreal-Injection, Endogenous; each with per-subtype organism and incidence evidence. Pathophysiology models two distinct mechanistic threads as requested: first, breach of the blood-ocular barrier and loss of immune privilege leading to intravitreal microbial proliferation; second, neutrophil- and cytokine-driven intraocular inflammation leading to neutrophil/cytokine-mediated retinal toxicity leading to irreversible retinal damage, explicitly modeled as capable of exceeding direct microbial damage and motivating the adjunctive-corticosteroid rationale. Added conforms_to links to the bacterial_cell_wall_synthesis_inhibition module (vancomycin/lipid-II target and ceftazidime/PBP-cross-linking target) and the bacterial_protein_synthesis_inhibition module (amikacin/ribosome target), with matching treatment target_mechanisms. Cross-referenced Invasive_Candidiasis.yaml for the fungal endogenous route per the issue scope note instead of duplicating Candida chorioretinitis content. Deep research performed via just research-disorder falcon Endophthalmitis, written to research/Endophthalmitis-deep-research-falcon.md. just preflight-dr returned SKIP because MONDO:0016047 records no causal gene, which is expected for an infectious disease; a manual identity check confirmed the report is legitimately about endophthalmitis, since the reports own reference validation showed 13 of 13 references resolved, a confabulation rate of 0.0, and 0 references flagged off topic, and its ontology-ready summary independently matched the same route-of-entry, organism, and mechanism structure I had already derived from PubMed. All disease-file evidence, meaning every PMID and snippet actually written into the YAML, was independently sourced and verified via PubMed E-utilities and just fetch-reference rather than lifted from the DR report, because the reports own citations were DOI-only and not consistently resolved to PMIDs. Validation performed: just validate, covering schema, terms, and references, passed; just count-verified-snippets reported 45 of 45 verified; just validate-terms passed; just validate-disorders, the batched pre-PR sweep with no-full-text, passed with 45 of 45 snippets verified; just check-duplicate-keys passed; just check-reference-cache-frontmatter passed; a targeted pytest run of test_data.py for Endophthalmitis plus the subtype, conforms_to, and dataset-shape tests passed 4762 of 4762 with one advisory warning that the subtypes lack subtype_term, which is expected since MONDO has no route-of-entry-specific child terms for this disease. Compliance was 95.6 percent global and 96.4 percent weighted.

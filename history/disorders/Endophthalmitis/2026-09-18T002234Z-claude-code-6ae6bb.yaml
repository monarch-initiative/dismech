  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block recording the two routes of inoculation this entry's subtypes already divide along: exogenous entry through a breach of the globe (intraocular surgery, penetrating trauma, intravitreal injection, filtering bleb, corneal extension), and endogenous haematogenous seeding during bacteraemia or fungaemia. Evidence: PMID:23438028 (Clin Microbiol Infect review; exogenous majority with its portals, bacteraemic/fungaemic seeding, and the one-way direction - an infected eye never seeds the bloodstream) and PMID:31424768 (StatPearls; direct inoculation, the breaches that admit organisms, and haematogenous dissemination during bacteraemia). All four infectious agents were already bound, so only transmission was added. Validated with just validate, just count-verified-snippets (69/69 verified), and the batched just validate-disorders sweep.

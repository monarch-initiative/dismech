  summary: 'Review round 1: remove the contradicted histidine-elevation node'
  details: |
    Addressed the blocking finding on PR #18548.

    The finding was correct. The entry carried a Secondary Histidine Elevation node and an edge to it from Hepatic Block of Histidine Catabolism, inferred from the order of the pathway: urocanate accumulates, so histidine should back up behind histidine ammonia-lyase. PMID:30619714 measured histidine directly and found it normal - 'Notably, histidine levels were found to be within normal limits in all samples' - and the same paper reports normal plasma amino acids in its first case. The inference came from the deep-research report's mechanistic model, the same source that supplied the wrong HP:0500152 label already caught before the first push. Every quote the reviewer supplied was re-checked against references_cache/PMID_30619714.md before acting on it, and all verified.

    Changes: the node and its downstream edge are removed. The measurement is now curated as positive evidence on Hepatic Block of Histidine Catabolism, together with the authors' conclusion that the lesion is 'a single, isolated defect without significant inhibition or enrichment of alternate pathways' - which is what makes that node the end of the metabolic branch. The entry-level notes paragraph that described the histidine rise now records the removal and why.

    Optional suggestions taken: cis-urocanic acid added to Urocanate Accumulation as CHEBI:30819 (resolved against OLS). The folate explanation was added to the CONTROVERSY rationale - PMID:30619714 reports that most work linking urocanic aciduria to developmental delay proposed altered folate metabolism and calls that problematic, because glutamate formiminotransferase deficiency one step downstream produces its own inconsistent phenotype.

    Optional suggestions declined, with reasons. Imidazole propionate is named in the quoted metabolomic signature but deliberately not bound: the paper gives no structure or identifier, and the name maps to several distinct CHEBI entries, one of which (CHEBI:27384) is the urocanase product and so should fall rather than rise behind this block. Binding one would assert an identity the source does not give; the reasoning is recorded in the node's notes. The 1971 index case (PMID:5124677) cannot be used as evidence because its cache entry is title-only with no abstract body, and a title is not a finding; it stays in references.

    One leftover: cache/chebi/terms.csv and the chemicalentityterm enum cache carry a CHEBI:15971 L-histidine row added by the first push, which the entry no longer binds. It is a correctly resolved row and cache rows are not hand-edited, so it is left in place rather than removed by hand.

    Validation after the change: just validate, just validate-terms, just count-verified-snippets (24/24), just validate-disorders (24 snippets, 27 titles, 0 issues), plus check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-block-scalar-comments, check-cache-order and check-name-collisions. All pass.

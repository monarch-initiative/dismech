  summary: 'Create: Urocanic Aciduria (MONDO:0010167, UROC1)'
  details: |
    De novo curation of urocanic aciduria (urocanase deficiency) from an OpenScientist deep-research report plus the primary literature ClinGen's gene-validity record names.

    Deep research: research/Urocanic_Aciduria-deep-research-openscientist.md (OpenScientist, 1980s runtime, 24 references, 23 verified, confabulation_rate 0.042). just preflight-dr returned WARN on a secondary gene (FTCD at 37% of UROC1 mentions); read and resolved as a pathway neighbour in the histidine-degradation module (HAL, UROC1, AMDHD1, FTCD) used as a comparator in the report's own constraint analysis, not a second disease entity.

    The report's term validation initially reported nine unresolved identifiers with service_unreachable=1, during an EBI/OLS outage. Re-run once OLS recovered: not_found dropped to 0 and confabulation_rate to 0.0. Two genuine label errors survived and were NOT carried into the entry: HP:0500152, which the report labels 'Hyperhistidinaemia', is Hypocystinemia; and HP:0033354, which it labels 'Elevated plasma urocanate', is Abnormal urine metabolite level. The second identifier is bound here under its own label with the specificity in preferred_term; the first is not bound at all, since HPO has no hyperhistidinaemia term.

    Curation stance. The entry separates the demonstrated biochemical phenotype from the contested clinical one. The pathograph runs from biallelic UROC1 loss of function through loss of urocanate hydratase activity, the hepatic block of histidine catabolism, urocanate accumulation and secondary histidine elevation, and stops there. No causal edge reaches intellectual disability or ataxia: those rows record what ascertained probands were reported with, and each says why it is not wired. PMID:30619714 is cited with supports: REFUTE against intellectual disability as a feature of the disorder. A CONTROVERSY discussion carries the attribution question and a KNOWLEDGE_GAP discussion carries whether accumulated urocanate has any downstream effect.

    Gene-disease validity. ClinGen's current record is Limited (SOP12, 2026-04-10, Aminoacidopathy GCEP), cached as CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z. The committed cache/clingen/gene_validity.csv export of 2026-01-24 still carries this pair as Moderate under SOP10, so the stub's note and the claim issue body are stale on that point. No relationship_type is recorded, following the treatment of other Limited-tier genes: CAUSATIVE is defined as ClinGen Definitive or Strong and would overstate the tier, and DISPUTED would misdescribe a relationship ClinGen says nothing contradicts.

    Not asserted. The recurrent nonsense allele's cDNA coordinate is left out because ClinGen gives c.855G>A and the report gives c.854G>A in its summary and c.855G>A in its model; both would stop at Trp285 and the discrepancy cannot be settled by inspection. The report's gnomAD v4 constraint, GTEx v8 expression and IMPC knockout findings are recorded in notes as deep-research output, explicitly not re-derived in this session and deliberately not used as evidence items.

    Validation: just validate, just validate-terms, just count-verified-snippets (23/23), the offline gates (entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, logical-rules, delivery-system, block-scalar-comments, gene-namespaces, name-collisions) and just validate-disorders (23 snippets, 26 titles, 0 issues) all pass. just check-genereviews reports a verified NO_CHAPTER for GeneReviews and StatPearls once synonyms were present.

  summary: 'Fix CI: ground UROC1 on the node it lands on'
  details: |
    CI fix pushed to an already-approved PR, which needs explaining.

    PR #18548 was approved at ae951c61, but its test (3.13) job failed on the 'Check for newly ungrounded genes' gate (just check-gene-activity-grounding). The cause is mine: the UROC1 gene descriptor sat on 'Biallelic UROC1 Loss-of-Function Variants', a node that named no molecular function, while the urocanate hydratase activity sat one node downstream on 'Loss of Urocanate Hydratase Activity'. The gate asks that a gene be grounded on the node it lands on, and it was not.

    Fixed by adding GO:0016153 urocanate hydratase activity with modifier LOSS_OF_FUNCTION to the variant node. That is the pattern CLAUDE.md describes for a lesion node - bound to the wild-type molecular function of its gene - and it does not duplicate the downstream node, which asserts the absence of the activity in the hepatocyte rather than the identity of the gene product. No baseline exemption was taken: the gene has a single clear molecular function, so grandfathering it would have been the wrong remedy.

    Why this was pushed to an approved PR. A push dismisses the approval, and the curation skill says an approved PR is the finish line. But a required check was red, so the PR could not merge as it stood, and the failure was caused by this diff rather than by drift. Leaving it red would have left the work unmergeable while looking finished. The re-review is the cost.

    The same mistake is present in the two sibling entries from this batch, FARIMPD and IDDALDS, and is being fixed on their own branches rather than here.

    Validation: just validate, just validate-terms, just count-verified-snippets (24/24), just check-logical-rules, just check-gene-activity-grounding (now OK, no newly ungrounded genes) and just validate-disorders (0 issues).

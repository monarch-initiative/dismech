  summary: 'Create: Interstitial_Lung_Disease_1'
  details: |
    Curated SFTPA1-defined interstitial lung disease 1 (MONDO:0030608, OMIM 619611) as a standalone gene-defined Disease, not an IPF subtype: the phenotype spans infant-onset respiratory insufficiency, NSIP/UIP and lung adenocarcinoma, and ClinGen curates the pair separately (Moderate, autosomal dominant only).

    Deep research: Perplexity sonar-deep-research run at reasoning_effort=low, because default-effort requests were repeatedly cut off. Its reference validation resolved 12/12 identifiers. The five CL/DOID terms its term validation lists as mislabelled are table-column artefacts (role text read as labels); it also cites the obsolete GO:0045045, which was not used. The body's bracketed citation numbers ([78], [83] and so on) do not match its 55-item citation list, so references were taken from the PMIDs named in the text and re-found in PubMed. just preflight-dr returned WARN only because SFTPA2 is mentioned at 32% of SFTPA1; those mentions come from cohorts that pool SFTPA1 and SFTPA2 carriers, so the report is about ILD1.

    GeneReviews: just check-genereviews returned NO_CHAPTER, offline and with --online. The Pulmonary Fibrosis Predisposition Overview (PMID:20301408) has no quotable text in its PubMed record and is not cited.

    Sources: Nathan 2016 (p.Trp211Arg family), Doubkova 2019 (p.Val178Met family, PMC full text), Takezaki 2019 (homozygous p.Tyr208His family and knock-in mouse; the ER stress, JNK, RIPK3 and MLKL necroptosis chain is graded MODEL_ORGANISM and noted as untested for dominant alleles), Legendre 2020 (pooled SFTPA1/SFTPA2 functional series), Brudon 2024 (OrphaLung lung cancer cohort), Bermudez 2023 (transplant series), Tirelli 2026 (systematic review), and the ClinGen CGGV assertion. relationship_type is left unset because ClinGen rates the pair Moderate. Lung adenocarcinoma has no inbound causal edge because no cited source establishes the mechanism.

    Not used: PMID:28869238 (Indian familial IPF case series; ClinGen counts it, but its abstract does not name the variant), common SP-A1 polymorphism association studies, SFTPA2-specific evidence, and antifibrotic drugs (no SFTPA1-specific evidence). The CGGV cache file was built by just fetch-reference from a ClinGen export newer than the MANIFEST pin.

    In a follow-up commit on the same branch, every downstream edge was given its own evidence that states the link, uncited edges from the fibrotic remodeling node to imaging, physiology and symptom phenotypes were removed (3 of 14 phenotypes now have an inbound causal edge), context-dependent snippets were replaced with self-contained sentences, and pulmonary function testing and a molecular-diagnosis item were added to diagnosis.

    Validation: just validate, just count-verified-snippets (68/68 verified), just validate-terms, the offline gates, and just validate-disorders.

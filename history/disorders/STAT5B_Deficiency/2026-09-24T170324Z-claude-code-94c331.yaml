  summary: 'Create: STAT5B_Deficiency'
  details: |
    New entry for autosomal recessive STAT5B deficiency (MONDO:0100211), the dedicated home named by the STAT5B Deficiency subtype in Growth_Hormone_Insensitivity_Syndrome, which was left unedited. Curated both arms from primary case reports and reviews: the GH-IGF1 arm (GH receptor-STAT5B signalling failure, low IGF-1/IGFBP-3/ALS with normal or high GH, poor response to rhGH, mecasermin therapy with a smaller response than in GHR defects and dose-limiting hypoglycemia) and the immune arm (IL-2-STAT5B signalling failure, regulatory T-cell loss with low FOXP3, NK maturation and cytotoxicity defect, autoimmunity, eczema, hypergammaglobulinemia and IgE, T lymphopenia, recurrent infections and herpetic keratitis, lymphocytic interstitial pneumonia progressing to pulmonary fibrosis) plus hyperprolactinemia recorded as an unproven feedback-loss mechanism. Stat5b knockout mouse linked with a species-mismatch divergence (Stat5a compensation). The heterozygous dominant-negative form (GHIDR2) is mentioned in notes and not merged. Deep research: OpenScientist run completed (exit 0); preflight-dr PASS; its leads PMID:33122102 and PMID:23773921 were fetched and quoted; its suggested HP:0040163 and HP:0008291 were flagged by its own term validation as naming other concepts and were not used. HP:0030353 is bound with the label in cache/hp/terms.csv, which differs from the current OLS label (no 'serum'). An IUIS 2022 table snippet (PMID:35748970) was dropped because 'just validate' refreshes that cache file to an abstract-only version. Validation: validate, validate-terms, count-verified-snippets (78/78), entity refs, causal targets, duplicate keys, enum values and validate-disorders all pass; 22 of 24 phenotypes causally connected (the two facial features are not).

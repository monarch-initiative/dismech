  summary: Reviewed and enhanced Torsade de Pointes Syndrome With Short Coupling Interval with classifications,
    inheritance, prevalence, progression, oligogenic genetic susceptibility entries, differential diagnoses,
    experimental models, and treatment target_mechanisms.
  details: Added classifications (harrisons_chapter, channelopathy_category), inheritance (sporadic majority
    and autosomal dominant familial susceptibility), prevalence (literature case count and idiopathic
    VF cohort proportion), progression (adult and infantile onset), genetic susceptibility entries (DPP6
    risk haplotype, GJA5, and TNNI3K oligogenic modifiers alongside RYR2 and SCN5A), differential diagnoses
    (Familial long QT syndrome, Brugada syndrome, Short QT syndrome, Catecholaminergic polymorphic ventricular
    tachycardia bound to MONDO:0017990), experimental models (patient-specific hiPSC-CM electrophysiological
    model with CELLULAR model_scale and MODERATE fidelity), and treatment target_mechanisms across ICD
    placement, verapamil therapy, quinidine therapy, and catheter ablation.

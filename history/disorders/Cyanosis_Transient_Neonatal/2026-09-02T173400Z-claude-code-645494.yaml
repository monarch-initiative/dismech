  summary: 'Create: cyanosis, transient neonatal (HBG2)'
  details: |
    Created new Disease entry for cyanosis, transient neonatal (MONDO:0013511), an ultra-rare autosomal dominant hemoglobinopathy caused by HBG2 (Ggamma fetal globin) missense variants. Modeled the causal chain: variant Ggamma-globin in HbF (NEOMORPHIC genetic_context) branching into (a) M-hemoglobin/methemoglobin formation (Hb F-M-Fort Ripley, His->Tyr), (b) low oxygen affinity (Hb F-Toms River Val->Met; Hb F-SickKids Asn->Ser), and (c) hemoglobin instability/denaturation with hemolytic anemia (heme-driven Met->Asp), converging on impaired fetal oxygen transport -> cyanosis/hypoxemia, plus the developmental gamma-to-beta hemoglobin switch driving spontaneous resolution. Phenotypes (HP): cyanosis (transient, neonatal onset), methemoglobinemia, hypoxemia, hemolytic anemia. Treatments: supportive care and genetic counseling (NCIT). Toms River recorded as has_subtypes. Grounded directly in primary literature (no deep-research run): PMID:21561349, PMID:26969357, PMID:7517266, PMID:24939847 (IN_VITRO), PMID:42267386. Validated: validate, validate-terms, count-verified-snippets (18/18), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, validate-disorders all pass. Deleted stubs/Cyanosis_Transient_Neonatal.yaml.

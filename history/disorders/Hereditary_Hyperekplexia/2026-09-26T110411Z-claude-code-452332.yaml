  summary: Add the four MONDO hyperekplexia subtypes with bound terms and genes, wire
    ATAD1 into its own node, and substantiate the GPHN row
  details: |
    Genetics pass under dismech#12257 (d2g series-050), hereditary hyperekplexia parent.

    Anchor: disease_term MONDO:0021022 hereditary hyperekplexia is kept. It is the
    direct MONDO parent of hyperekplexia 1 to 4, and the entry models that class.

    The entry had no has_subtypes section at all, so none of MONDO's four numbered
    hyperekplexia concepts had a home even though all four causal genes were already in
    genetic:. Added HPX1 (GLRA1, MONDO:0007868), HPX2 (GLRB, MONDO:0013828), HPX3
    (SLC6A5, MONDO:0013827) and HPX4 (ATAD1, MONDO:0044330), each with a bound
    subtype_term, bound gene, inheritance mirroring the per-gene inheritance already
    curated in genetic:, and its own evidence. Reciprocal genetic[].subtype foreign keys
    added for all four.

    Added case_fractions to the GLRA1, GLRB and SLC6A5 records from the 97-case
    gene-confirmed series already cited in the entry. The series prints counts rather
    than percentages, so each record's notes states the count over 97 as well as the
    percentage.

    Pathograph wiring: GPHN and ATAD1 were the two genes reaching no node. ATAD1 now has
    its own node, Thorase-dependent AMPA receptor trafficking failure, rather than being
    appended to a glycinergic node, because its product acts at the excitatory synapse;
    the node carries GO:0099149 and GO:0032984 and one indirect edge to muscle stiffness.
    GPHN was deliberately NOT bound to a node - see below.

    GPHN: the row previously rested on the Orphanet gene list alone. The primary mutation
    screen behind that listing reports a single missense allele in a single hyperekplexia
    patient and its own functional test shows that allele does not disrupt
    glycine-receptor binding to gephyrin or collybistin-induced surface clustering. Both
    sentences are now cited, the second as a REFUTE item, and the row says so. The gene
    is not bound to a pathophysiology node because wiring it would assert a causal
    mechanism its own evidence contradicts. No MONDO class denotes a GPHN form of
    hyperekplexia: searched synonym-inclusive for GPHN (one unrelated hit) and gephyrin
    (no hits), recorded in the record's notes.

    Post-investigation disagreement with MONDO, recorded rather than acted on. MONDO
    files hyperekplexia 4 (ATAD1) and developmental and epileptic encephalopathy 8
    (ARHGEF9) under hereditary hyperekplexia. For ATAD1 the clinical delineation study
    that assembled all eight reported patients concludes the entity is a unique
    congenital encephalopathy distinct from hyperekplexia, and the molecular lesion is
    at the excitatory rather than the glycinergic synapse. MONDO:0044330's own definition
    does not address the question - it restates OMIM's numbering. The subtype row is
    carried under the ontology's numbering with the divergence recorded as a REFUTE
    evidence item and stated in the row description, not asserted as settled.
    DEE8 (MONDO:0010375) is dispositioned structurally: it already has its own entry,
    kb/disorders/Developmental_And_Epileptic_Encephalopathy_8.yaml.

    GeneReviews baseline: the Hereditary Hyperekplexia Overview chapter (PMID:20301437,
    NBK1260) existed but was uncited. It is now fetched and tagged in references:. Its
    cached abstract is the chapter's five-point goals statement and carries no
    quotable finding, so no snippet was taken from it.

    Validation: just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values,
    check-qualifier-terms, list-gene-term-mismatches --resolve, check-genereviews, and
    validate-disorders, under linkml-reference-validator 0.3.0rc3. Every new snippet was
    checked to be an exact substring of its cached reference and to sit in the abstract.

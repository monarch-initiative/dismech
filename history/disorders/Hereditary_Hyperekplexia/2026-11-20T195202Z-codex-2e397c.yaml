  summary: Map Hyperekplexia to OMIMPS:149400
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. The January 2026 PS149400 union contains the four numbered GLRA1-, GLRB-, SLC6A5-, and ATAD1-related forms, all represented by HPX1 through HPX4 here. This entry also discusses GPHN-associated disease outside that four-member union, so the series is a narrower target than the current entry scope. The September 2026 MONDO:0021022 hierarchy additionally includes developmental and epileptic encephalopathy 8; its series crosswalk is not proof that the descendant sets coincide. Glycinergic inhibition explains the first three forms, whereas ATAD1 affects AMPA receptor trafficking and its classification as hyperekplexia is disputed in the already-curated clinical literature. This alignment preserves that distinction and does not assert a universal glycinergic mechanism or classify every exaggerated-startle disorder as hyperekplexia.

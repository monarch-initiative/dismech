  summary: 'Detailed evidence review: BRAF-mutant papillary thyroid cancer'
  details: |
    Full evidence audit of every evidence item in the entry against its cached reference.

    Scope: 21 evidence items were re-read across 21 unique cited references - 4 PMID references carrying KB-content evidence, and 17 DOI references carrying deep-research bibliography findings in the top-level references block. Every cached reference file was read in full, title plus abstract or full text, before grading. The entry's 102 bibliography rows also include 81 title-only rows with no findings and no evidence items; those carry no evidence claim and were confirmed to be inert bibliography rather than reviewed as evidence.

    Snippet verification: all 4 pre-existing PMID snippets and all 17 DOI snippets were confirmed to be exact substrings of their cached reference bodies. The DOI snippets are skipped by the reference validator's prefix configuration, so they were checked with an independent whitespace-normalized substring test against the same caches. No fabricated or paraphrased snippet was found anywhere in the entry.

    Defects found and fixed:

    1. evidence_source misgrade on DOI:10.1002/hed.27950, the BRAF K601E systematic review and meta-analysis. It was graded OTHER. The cited study pools 32 studies covering 13,191 patients, and the quoted sentence about activating BRAF mutations occurring in 45 percent of papillary thyroid carcinomas is a statement about human papillary thyroid carcinoma, not about model or in-silico data. Corrected to HUMAN_CLINICAL.

    2. Under-evidenced histopathology frequency claim. The single histopathology entry asserts frequency VERY_FREQUENT for papillary carcinoma morphology in this BRAF-defined disease, but its only quote, that papillary thyroid carcinomas are the most common thyroid cancers, measures a different denominator: papillary carcinoma's share of all thyroid cancers, not the share of BRAF-mutant tumours showing papillary morphology. The existing quote was left in place because it exactly supports the entry's description sentence. A second evidence item was added from the same cached reference, PMID:21221869, quoting that molecular studies have shown the BRAF V600E mutation is found mainly in papillary and anaplastic thyroid carcinomas, which ties the BRAF V600E genotype to papillary histology specifically. Both quotes are exact substrings of the cache.

    3. Two evidence items were missing evidence_source: PMID:21221869 on histopathology and PMID:39502057 on the BRAF genetic entry. Both cite human clinical and surgical-pathology literature, which is also the schema default, so HUMAN_CLINICAL was recorded explicitly rather than left implicit.

    Verified as correct, no change made:

    - PMID:29651624 on the PD-L1/PD-1 immune-evasion node. Immunohistochemistry of 110 human papillary thyroid carcinomas; the quoted correlation sentence supports the node's correlational claim, and the node description states correlation rather than causation. HUMAN_CLINICAL is correct.
    - PMID:40988283 on the TERT genetic entry. A 144-patient differentiated thyroid cancer cohort; the quoted co-mutation odds ratio supports the prognostic-modifier claim. HUMAN_CLINICAL is correct.
    - The 14 remaining DOI evidence_source values were each checked against the study design in the cached record: organoid and embryonic-stem-cell engineering studies graded IN_VITRO, mouse knockout and murine cell-line studies graded MODEL_ORGANISM, and patient cohorts, registry and SEER epidemiology, retrospective case series and clinical reviews graded HUMAN_CLINICAL. All were found consistent with the cited study type.

    Named Entity Confusion check: every cited source was confirmed to be about thyroid carcinoma of the intended type. Papillary, anaplastic and follicular carcinoma are distinguished correctly wherever they appear, and the dabrafenib-trametinib description correctly separates the anaplastic thyroid cancer approval from activity in radioiodine-refractory differentiated disease. DOI:10.1002/hed.27950 is a BRAF K601E paper cited only for a general BRAF-oncogene background sentence, and its reference title preserves that provenance, so it is not a misattribution.

    Observations recorded but not changed, being outside an evidence review's remit: the bibliography lists the same paper twice, once as DOI:10.1007/s12022-025-09859-y and once as PMID:40237893, whose cache carries that same DOI; and several pathophysiology nodes, all phenotypes and all treatments carry no evidence at all, which is a completeness gap rather than an evidence defect.

    Validation after edits: schema validation passed; the snippet audit reports 5 of 5 cache-checkable snippets verified with 17 DOI snippets skipped by prefix and separately confirmed exact; entity-reference, duplicate-key, folded-hyphen, snippet-length, title-snippet and snippet-grading checks are all clean for this file.

    check-folded-hyphens initially FAILED on one line of my own explanation prose
    ("postnatal corepressor-" split across a folded scalar) and was fixed by
    rephrasing. No baseline file was modified by this change.

    SELF-REVIEW CATCH. A first draft of the free T4 and free T3 notes described
    median analyte values from PMID:38148509 as RTH-alpha cohort values. They are
    not: they are medians for children selected by that study's screening filter,
    none of whom carried a THRA variant. Corrected so that no RTH-alpha cohort
    mean or median is asserted for either analyte. Separately, all 21
    reference_title values were compared character-for-character against the
    title: frontmatter of their references_cache/ files - nothing validates that
    automatically - and all matched exactly.

    TERM AND IDENTIFIER PROVENANCE. hgnc:11796 was verified in both directions
    against the HGNC REST API (symbol THRA -> HGNC:11796 and hgnc_id 11796 ->
    THRA), per the CLAUDE.md warning that validate-terms checks a gene label
    against its CURIE but nothing against the gene the text names. HP, GO, CL,
    MONDO, NCIT and CHEBI terms were resolved via ols: adapters or the committed
    cache/<prefix>/terms.csv; no local MONDO/HP/NCIT database was built, per the
    run's disk constraint. The eight LOINC codes were resolved against the NLM
    Clinical Table Search Service; LOINC is not configured in conf/oak_config.yaml
    so they are hand-verified rather than gate-checked, and this is stated in the
    entry's notes:.

    DELIBERATE OMISSIONS, each with a reason recorded in the entry's notes:. No
    conforms_to - hypothyroidism_thyroid_hormone_deficiency is the mechanistic
    inverse of this disease (its chain starts at impaired hormone synthesis, which
    RTH-alpha does not have), the same call the RTH-beta entry made;
    defective_skeletal_mineralization was also read and rejected (its rate-limiting
    step is hydroxyapatite deposition, not chondrocyte maturation). A
    receptor-resistance module spanning RTH-alpha, RTH-beta, MCT8 deficiency and
    SECISBP2 deficiency is flagged as future work and was not created. No
    has_subtypes - the genotype-phenotype correlation is a severity gradient across
    a continuum of variants that no source partitions. No cell_types on the GI
    node, which is marked mechanism_confidence: PROVISIONAL, because nothing
    located names the responsible cell type in human disease. Hypercholesterolemia
    is deliberately left unconnected to any pathophysiology node because cholesterol
    handling is TR-beta territory and the route is unexplained. No reference-interval
    bounds for reverse T3, creatine kinase, haemoglobin or MCV. TSH bound to the
    NCIT analyte term NCIT:C2280 because NCIT has no TSH measurement term matching
    NCIT:C74786/C74787. No ORPHA evidence, because the Orphadata bulk XML is absent
    from this checkout and fetching it was out of scope - so the Orphanet prevalence
    figures are mentioned in notes: as uncited rather than quoted. No
    clinical_trials and no datasets, none located. Skin tags, decreased metabolic
    rate and pericardial effusion not curated as phenotypes for want of more than
    single-series or uncited support.

  summary: 'Create: Resistance to Thyroid Hormone Alpha (THRA, MONDO:0013757)'
  details: |
    De-novo creation of kb/disorders/Resistance_to_Thyroid_Hormone_Alpha.yaml,
    the THRA receptor disease (resistance to thyroid hormone alpha, RTH-alpha),
    from the stub stubs/Congenital_Nongoitrous_Hypothyroidism_6.yaml, which this
    change deletes. Claim issue #11606.

    LUMP/SPLIT AND ONTOLOGY DECISION. The stub was keyed on MONDO:0013757
    ("congenital nongoitrous hypothyroidism 6"), while the existing RTH-beta entry
    Generalized_Resistance_to_Thyroid_Hormone recorded RTH-alpha as MONDO:0034216
    and noted it was not yet curated. Checked both terms directly against OLS
    (ols:mondo) and Orphanet ORDO (ols:ordo) on 2026-09-10 rather than building a
    local MONDO database. Finding: the two MONDO terms are an unmerged duplicate
    pair for one disease. MONDO:0013757 is the OMIM-derived term (defined as "Any
    hypothyroidism, congenital, nongoitrous in which the cause of the disease is a
    mutation in the THRA gene", xref OMIM:614450, DOID:0070128); MONDO:0034216 is
    the Orphanet-derived term (no logical definition, xref Orphanet:566231); and
    Orphanet's own ORDO record for ORPHA:566231 cross-references BOTH
    MONDO:0034216 and OMIM:614450. Neither MONDO term asserts a has-exact-match to
    the other, neither is an ancestor of the other, and they sit under different
    parents, which is why the duplication is easy to miss. The entry therefore
    anchors on the stub's MONDO:0013757 and records MONDO:0034216 in
    mappings.mondo_mappings with mapping_predicate: skos:exactMatch, which is the
    predicate that retires the mapped concept from the curation queue - the
    correct consequence if the two are one disease. The full reasoning is in the
    entry's notes: and in the mapping's own notes:. This should be reported
    upstream to MONDO as a merge candidate; that was NOT done in this session.

    NAMING DECISION. Named "Resistance to Thyroid Hormone Alpha" rather than the
    stub's proposed Congenital_Nongoitrous_Hypothyroidism_6, for three reasons
    recorded in notes:: the clinically preferred name is what every cited source
    from 2013 onward uses; the ontology finding above means MONDO:0013757 is not a
    narrower CHNG6-specific concept, so nothing argues for the narrower title; and
    it parallels the sibling entry Generalized_Resistance_to_Thyroid_Hormone, with
    which this entry is mutually differential. The filename uses lowercase "to" to
    match that sibling exactly. CHNG6 and its synonyms are retained in synonyms:.

    DEEP RESEARCH. The assigned provider, falcon (Edison), returned HTTP 402
    Payment Required ("the account is out of credits") on two consecutive
    attempts. The second attempt was run with --fallback per repository procedure
    (just dr_fallback='--fallback' research-disorder falcon ...), so the provider
    substitution is recorded in the report's own frontmatter rather than only in
    prose; it fell back to openscientist. That fallback also failed: the
    OpenScientist job (id d5700215-0d24-42bf-846f-91d50b3902eb) timed out after
    3600 s and was cancelled server-side. The fallback chain then stopped, because
    the provider raised a ValueError which the runner reports as unable to carry
    the attempt trail, so no further candidate provider was tried. NO DEEP-RESEARCH
    REPORT EXISTS for this entry - research/Resistance_to_Thyroid_Hormone_Alpha-deep-research-*.md
    was never written, and nothing from a report is committed with this change. The
    repository procedure was followed (assigned provider attempted, then one
    re-run with --fallback) and is exhausted; no provider was substituted by hand.
    This is a real gap in the curation provenance for this entry and is reported
    as one rather than worked around.
    The entry as curated here was built from primary literature located by direct
    PubMed E-utilities searches, not from a deep-research report. Note that two
    PMIDs recalled from memory during that search (for the 2012 NEJM index
    reports) were both wrong - they resolved to unrelated papers on deep-brain
    stimulation and gonococcal infection - which is the documented reason every
    identifier here was read from a lookup in the same step it was written.

    GENEREVIEWS BASELINE. No GeneReviews chapter exists for RTH-alpha. A PubMed
    search for "resistance to thyroid hormone alpha GeneReviews[All Fields]"
    returned one hit, PMID:29072892, which is the GNAS chapter matched on the book
    series name; "THRA GeneReviews[All Fields]" returned nothing. This agrees with
    what Generalized_Resistance_to_Thyroid_Hormone records. The 2024 European
    Thyroid Association guideline (PMID:38963712) was used as the baseline
    reference instead and is listed under references:; its cached record is
    abstract-only.

    CONTENT. 12 pathophysiology nodes, all with biological_scale, forming a
    connected chain from the THRA dominant-negative variant
    (genetic_context.functional_impact_category: DOMINANT_NEGATIVE, zygosity
    HETEROZYGOUS, variant_origin GERMLINE) through persistent NCoR/SMRT corepressor
    occupancy at thyroid hormone response elements to transcriptional silencing of
    T3 target genes, then branching to six TR-alpha-dependent tissue nodes
    (skeletal maturation, GI motility, erythroid differentiation, cardiac
    chronotropic drive, skeletal muscle, CNS). A parallel branch records sparing of
    TR-beta tissues including the pituitary thyrotroph, the resulting discordant
    thyroid panel with non-elevated TSH, and escape from TSH-based newborn
    screening. Pathway-state claims use Descriptor.modifier (LOSS_OF_FUNCTION on
    the thyroid hormone receptor signaling pathway nodes, chosen over DECREASED
    because the claim is qualitative - the pathway is outside ligand control, not
    merely running low) while the variant-consequence claim uses
    GeneticContext.functional_impact_category, per the CLAUDE.md decision tree.
    Also: 15 HP-bound phenotypes with frequencies where sourced; 7 biochemical
    records with LOINC-coded reference_ranges and an HP:0033075 interpretation band
    on TSH; 3 definitions (one DIAGNOSTIC_CRITERIA, two PHENOTYPE_ALGORITHM with
    honest validation_status - UNVALIDATED for the anaemia filter that found no new
    cases in 6,540 children, PROPOSED for the fT3/fT4 centile screen); 2 treatments;
    4 animal models with modeled_mechanisms, model_scale, limitations and (for the
    zebrafish) typed divergences; 3 differential diagnoses; 2 discussions
    (KNOWLEDGE_GAP on levothyroxine outcome benefit, HUMAN_MODEL_MISMATCH on
    whether the mouse NCOR1 rescue transfers). 21 references, 101 snippets.

    A deliberate negative result is curated rather than dropped: the
    target_mechanisms edge from Levothyroxine to the cardiac node carries
    supports: REFUTE, because thyroxine provably does not raise heart rate in
    RTH-alpha patients (PMID:37286550), which is what makes higher dosing
    tolerable.

    VALIDATION RUN, with results. just validate - passed (schema, terms,

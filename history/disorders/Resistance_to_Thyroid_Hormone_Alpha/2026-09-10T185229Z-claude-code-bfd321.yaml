  details: |
    Second curation round for Resistance_to_Thyroid_Hormone_Alpha: obtaining a
    deep-research report and integrating what survived checking. The first round's
    record for this entry states that no report existed; that is now superseded by
    the report committed with this round, and that earlier record is left unedited
    because it describes its session accurately.

    DEEP RESEARCH, RESOLVED. The assigned provider falcon (Edison) returned HTTP
    402 Payment Required twice ("the account is out of credits"), and the
    --fallback run's OpenScientist job (d5700215-0d24-42bf-846f-91d50b3902eb) timed
    out after 3600 s and was cancelled. A third run used the sanctioned fallback
    mechanism with the claude_code provider:
    `just dr_fallback='--fallback' research-disorder claude_code Resistance_to_Thyroid_Hormone_Alpha`.
    It completed in 337.6 s and produced
    research/Resistance_to_Thyroid_Hormone_Alpha-deep-research-claude_code.md plus
    its .citations.md sidecar; no _artifacts/ directory was produced. The report's
    own frontmatter carries the provenance (provider claude_code; models
    claude-haiku-4-5-20251001 and claude-sonnet-5; 13 web searches; 23 turns;
    citation_count 25), so the provider substitution lives in the artifact rather
    than in prose. No provider was substituted by hand at any point.

    REPORT VALIDATION READ BEFORE USE. reference_validation: 20/20 references
    resolved, confabulation_rate 0.0, 18/20 on topic. term_validation:
    needs_review true - 48 terms checked, 44 resolved, 1 unresolved (HP:0008977),
    1 obsolete (GO:0004887, replaced by GO:0004879), 6 mislabelled.
    just preflight-dr PASSED: THRA mentioned 34 times, and the report's OMIM
    identifier 614450 matches the OMIM that MONDO gives for MONDO:0013757 -
    independent third-source corroboration of this entry's skos:exactMatch
    decision between MONDO:0013757 and MONDO:0034216.

    LEADS ACCEPTED, each checked against the primary source before curating.
    Seven new phenotypes, all CURIEs resolved by direct lookup: Wormian bones
    (HP:0002645, 32%), Cranial hyperostosis (HP:0004437), Skin tags (HP:0010609,
    21%), Delayed speech and language development (HP:0000750), Gait ataxia
    (HP:0002066), Seizure (HP:0001250), Hepatic steatosis (HP:0001397). Sourced
    frequencies added to three existing phenotypes: short stature 60% (12/20
    children), macrocephaly 70% (23/33), delayed tooth eruption 44% (8/18). The
    Impaired Gastrointestinal Motility node was raised from
    mechanism_confidence: PROVISIONAL to ESTABLISHED, because the report led to a
    colonic-manometry finding of decreased peristalsis in RTH-alpha patients - a
    measured human observation, where the first round had only inferred reduced
    motility from constipation. Human evidence was added to the erythroid node
    from PMID:28911146 (primary erythroid progenitors from 11 genotyped RTH-alpha
    patients), which closes the most substantive gap in the first round: that node
    previously rested on mouse data alone, which CLAUDE.md forbids as the sole
    support for a human phenotype. That paper also supports a new
    experimental_models entry (PRIMARY_CELL_CULTURE, two readouts,
    PARTIALLY_RECAPITULATES with the reason stated: the defect appears only in
    spontaneous differentiation, and induced differentiation and T3 response were
    normal). A fourth animal model was added, the low-T3-affinity TR-alpha1
    knock-in mouse (PMID:16131613), with relationship RESCUES, because it splits
    the CNS phenotype by therapeutic window - anxiety and recognition memory
    rescued by thyroid hormone in adulthood, locomotor dysfunction requiring
    post-natal treatment. That result materially sharpens the
    rtha_levothyroxine_outcome_benefit discussion, which now carries it. A new
    progression section (infancy/early childhood, adulthood) records age-related
    attenuation of both the clinical picture and the biochemistry, from the 2021
    review and a 2026 kindred (PMID:42301959). Four new references were fetched
    and are cited: PMID:28911146, PMID:16131613, PMID:42301959, and PMID:39132310
    (added this round to source the MCT8 differential-diagnosis claims, which were
    uncited in round one).

    LEADS REJECTED, recorded in the entry's notes: so they are not re-imported.
    Three wrong ontology bindings the report offered, each flagged by its own Term
    Validation and each confirmed wrong by direct lookup: HP:0010701 offered for
    "Skin tags" is Abnormal circulating immunoglobulin concentration (correct term
    HP:0010609 found independently); HP:0001923 offered for "Normocytic anemia" is
    Reticulocytosis; GO:0004887 offered for "thyroid hormone receptor activity" is
    obsolete, replaced by GO:0004879, which this entry already bound from its own
    lookup. Also not bound: UBERON:0001968 offered for "skeletal system" (it is
    semen) and HP:0008977 for "Decreased basal metabolic rate" (does not resolve).
    Two substantive claims failed checking. The report called increased bone
    mineral density characteristic in adults; the review it cites reports bone
    mineral density as NORMAL in the three adults measured, and that contradiction
    is curated as a supports: REFUTE evidence item on the Cranial hyperostosis
    phenotype rather than dropped. And it cited PMID:28856816 as evidence for an
    autism phenotype; that paper reports novel SNPs of uncertain significance in
    the THRA and THRB ligand-binding domains in 30 ASD subjects, not pathogenic
    RTH-alpha variants in RTH-alpha patients, so using it would be a category
    error - no autism phenotype was curated and the PMID is not cited. A creatine
    kinase figure it gave (73%, 8/11 untreated children, 218-981 U/L) could not be
    located in the source it was attributed to and was not used.

    VALIDATION RUN THIS ROUND, with results. just validate - passed. just
    validate-terms - passed. just count-verified-snippets - 126/126 verified (up
    from 101). just validate-disorders - passed, 126/126. just
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values - all passed. Whole-KB:
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-reference-titles - all passed. just
    normalize-cache and just check-term-cache-integrity - passed, and this round
    added no new cache rows because every new HP CURIE was already cached by other
    entries. just compliance - 84.4% global, 84.6% weighted (up from 84.0%). No
    baseline file was modified. All 24 reference_title values were re-checked
    character-for-character against their references_cache/ frontmatter; all
    matched.

    New downstream edges were added so the new phenotypes are reachable in the
    pathograph: wormian bones, cranial hyperostosis and coarse facial features
    from Impaired Skeletal Maturation, and delayed speech, gait ataxia and seizure
    from Impaired Central Nervous System Thyroid Hormone Action (the last as
    INDIRECT_KNOWN_INTERMEDIATES, via GABAergic interneuron development). Skin
    tags and hepatic steatosis are deliberately left unconnected, like
    hypercholesterolemia, because the liver is TR-beta territory and nothing
    located explains the skin tags at all; this is stated in the entry.

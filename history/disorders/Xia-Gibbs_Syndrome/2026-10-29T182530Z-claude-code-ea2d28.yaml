  summary: 'Create: Xia-Gibbs_Syndrome'
  details: |
    New entry for Xia-Gibbs syndrome (MONDO:0014358, AHDC1), replacing the stub AHDC1-related_Intellectual_Disability_-_Obstructive_Sleep_Apnea_-_Mild_Dysmorphism_Syndrome. No deep-research provider was run; literature was gathered from a PubMed search for AHDC1 / Xia-Gibbs and 16 PMIDs plus the ClinGen gene-validity record (Definitive, AD) were fetched into references_cache. Phenotype frequencies come from the 34-person Khayat 2021 cohort (PMID:33644933) and the 20-person XGS registry cohort (PMID:29696776); qualitative features from the GeneReviews chapter (PMID:34902026). Pathophysiology is kept to sourced nodes: the truncating variant, position-dependent nuclear mislocalization of truncated protein on overexpression (IN_VITRO), Gibbin-dependent mesodermal gene regulation from the 2022 organoid and chimeric mouse study, imaging-defined disrupted brain development, and a hypothetical upper-airway node for obstructive sleep apnea. Edges into the neurodevelopmental phenotypes are marked INDIRECT_UNKNOWN_INTERMEDIATES, with a KNOWLEDGE_GAP discussion for the missing neural mechanism and a CONTROVERSY discussion for haploinsufficiency versus dominant-negative effects (ClinGen records haploinsufficiency). Validated with just validate, count-verified-snippets (all snippets verified), validate-terms and the offline KB gates.

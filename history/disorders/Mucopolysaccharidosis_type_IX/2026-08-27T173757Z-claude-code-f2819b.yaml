  summary: Add classifications block
  details: |
    Added the classifications block, which this entry lacked entirely while every other MPS entry carried one. Records lysosomal_storage_category: mucopolysaccharidosis, with a note explaining that MPS IX meets the class criterion while being its atypical member - the stored substrate is hyaluronan, the only non-sulfated GAG, and the deficient enzyme is an endoglycosidase rather than an exoglycosidase or sulfatase. The note also states why the ISDS skeletal category carried by the other MPS entries is deliberately NOT asserted here: MPS IX lacks dysostosis multiplex, the feature defining ISDS group 27.

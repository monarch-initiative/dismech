  summary: 'Address PR #11640 round 4: replace false allele justification with structured variant records'
  details: 'Fourth review round on PR #11640, and the fourth instance of one defect class:

    a claim about which sources say what, written from an earlier draft rather than

    checked against the cache. This one is the worst of the four, because it was

    written in the same push whose commit message claimed to have swept for exactly

    this.


    The defect. The Genetic notes justified recording W59C, E87* and W66R as a

    prose mention rather than structured variant records on the grounds that "the

    source names them in a single summarising sentence with no per-allele

    phenotype, zygosity or functional data attached". All three particulars are

    false. PMID:31515291 gives two sentences, each attaching a phenotype.

    PMID:31851937 - cached as full text and already cited by this entry - gives

    zygosity outright (compound heterozygous W59C/E87X; homozygous W66R) and

    per-allele functional data (W66R fails to rescue CcO activity; W59C partially

    rescues).


    The fix is not the one the reviewer asked for. They said the decision to keep

    prose was fine and only the reason needed correcting. But the reason was the

    only thing holding the decision up: the schema has a `variants` slot on

    Genetic, the data the justification said was missing is present, and a worked

    pattern exists elsewhere in kb/. So the three alleles are now structured

    `variants` records carrying zygosity, per-allele phenotype, functional

    consequence, clinical_significance and variant type, with six evidence items.

    The notes now say why they are structured and record that an earlier draft

    asserted the opposite.


    A knock-on correction. Tracing the alleles to their primary sources identified

    Baertling 2015 as PMID:25339201 - which this entry already cites for the

    cardiomyopathy phenotype. In an earlier comment on this PR I told the reviewer

    the primary W66R report was not findable; that was wrong, and it was wrong

    because the PubMed search used the allele string rather than the author name

    the cached source supplies. The practical conclusion is unchanged - that

    paper''s abstract does not enumerate lactic acidosis or muscular hypotonia, so

    those two phenotypes stay graded OTHER against the PMID:31515291 secondhand

    summary - but the reason is now precise rather than a failure to look.


    Process. Before pushing, every claim about repository state in the file was

    grepped and re-verified against the files: 9 evidence PMIDs of which 4 are

    content_type full_text, 4 distinct conforms_to declarations against a 4-node

    module, 6 pathophysiology nodes, 3 phenotypes, 3 variant records. That sweep

    caught a sentence written earlier in this same session already going stale -

    the new justification said PMID:31851937 "is cited three times", which the

    variant records had just made seven. Both that count and a neighbouring "cited

    twice" were removed rather than corrected, because a citation count in prose

    decays every time the entry is edited and carries no information a reader

    needs.


    Reference titles were pulled programmatically from each cache file''s

    frontmatter in the edit script rather than typed. This was the fourth time in

    the session a title composed from memory was wrong - PMID:31851937 was nearly

    written as "Coa6 is a mitochondrial complex IV assembly factor critical for

    copper delivery to the catalytic core" when its real title is "COA6 Is

    Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper

    Delivery to Mitochondrial Cytochrome c Oxidase."


    The reviewer separately retracted its own node count, having written "six" then

    "seven" when the real figures were five then six. Recomputing rather than

    carrying a number forward is what surfaced that on both sides.


    Validation: just validate passes, 50/50 snippets verified, validate-terms,

    check-entity-refs, check-causal-targets, check-duplicate-keys,

    check-enum-values, check-qualifier-terms and check-reference-titles all green.'

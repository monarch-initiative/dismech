  summary: Review COA6 clinical evidence, assembly mechanisms, and experimental
    rescue studies
  details: |
    Reviewed the complete COA6 entry, all five prior history records, the matching Claude Code deep-research report and citation sidecar, all nine previously cited references, and newly recovered clinical and experimental sources. The entry had no REVIEW event and no overlapping open PR when selected; inherited COA6 deficiency is within scope and is neither infectious nor environmental/poisoning disease. Rebased the isolated branch onto current main before curation.

    Source consumption: read the cached full scientific bodies of PMID31515291,31851937,32061935,35053273 and relevant assay/cell-line methods. Retrieved PMID22277967 as full text and inspected the original C1orf31 patient P31, Table1, variant prioritization and phasing methods. Retrieved and read the full scientific body and figures of Ghosh2014 through the public PMC URL, plus Pacheu-Grau2015 through the Max Planck repository PDF (including available supplementary material as context). Retrieved and read the complete scientific body of PMID30038027, including the COA6-specific zebrafish experiment that is absent from its abstract, and selected model methods. Read the new 2026 yeast abstract PMID42551500. The five existing abstract-only PMIDs were regenerated and fully read. All cache files were generated with fetch-reference or its documented force-refetch wrapper, never handwritten.

    Retrieval limits: the Baertling2015 clinical full text and Stroud2015 full text could not be fetched after normal retries and publisher/repository leads (Wiley/OUP403; clinical ResearchGate403). A further attempt at the2016 epistasis full text returned a browser challenge and that unusable generated cache was discarded. Their abstracts remain usable. The clinical phenotype suggestions of noncompaction, valve regurgitation, hypothermia, failure to thrive and dysmorphism were not promoted from an unverified research report into disease prose. Detailed clinical ascertainment remains a source-access limitation, not evidence that those findings are absent.

    Corrections: removed blanket neonatal/first-days onset and death-in-weeks assertions. The original P31 record gives onset<1year, and Ghosh2014 explicitly records death before one year. Corrected the false clinical-versus-knockout dichotomy for combined complex I/IV deficiency: combined deficiency was already present in the first patient's heart; the second patient had isolated IV deficiency. Distinguished normal fibroblast activities in the first family from a definite fibroblast defect in the W66R family. Separated COX2 instability from assembly arrest, qualified indirect clinical edges, removed an unmeasured organism-level glycolysis GO process, corrected copper ion specificity, and retained the unresolved reductase/metallochaperone question. Removed unsupported all-variant protein-null and clinical severity ranking statements. Corrected human clinical background versus primary cell/model evidence grades, including yeast interaction experiments.

    Added the missing complex-IV-deficiency phenotype, separate protein-abundance biomarker, sequencing/phasing and enzymology diagnosis, and yeast model. Added elesclomol rescue in coa6-null/pathogenic-chimera yeast and COA6 morphant zebrafish, with the observed copper-combination toxicity and explicit limits on human translation. Added hypoxia/glutathione and2026cytochrome-c yeast findings as model-level evidence. Preserved patient supercomplex findings and the2020KO import/ROS constraints rather than imposing one uniform cellular phenotype. Counseling recurrence is explicitly derived under a two-carrier-parent assumption. Unsupported claims about actual supportive-care protocols were replaced by general management context. Moved process diary material out of KB prose.

    Research completeness checklist:
    1. Phenotypes: supported central HCM, hypotonia, lactate and complex-IV findings covered; clinical full-text access gap documented above, no unsupported frequencies.
    2. Subtypes: N/A; no established mechanistic subtypes identified in the report.
    3. Pathophysiology: central reductase, CuA maturation, COX2 instability, assembly arrest and clinical consequences covered; experimental specificity and unknown intermediates explicit.
    4. Treatments/trials: copper and previously omitted elesclomol model results covered, including toxicity; no COA6-specific clinical trial surfaced. SCO2 clinical copper/bezafibrate results are excluded as a different disease.
    5. Genetics: all three foundational alleles and biallelic configurations covered, residual activity and localization differences qualified; no unsupported penetrance or severity ranking.
    6. Biomarkers/diagnostics: activity versus abundance, tissue variability, sequencing and phasing covered; research assays distinguished from universal clinical requirements.
    7. References: original clinical study and central pharmacological/model full texts recovered and used; every evidence item and publication has a cache-matched title. Extra recovered PDF supports source interpretation even where abstract quotes suffice.
    8. Overall consumption: central disease-specific supported themes incorporated; broader-gene clinical extrapolation and unverified report phenotypes excluded. Remaining clinical detail is a retrieval limitation, not a deliberately narrower disease definition.

    GeneReviews: offline baseline check returns NO_CHAPTER with disease synonyms present. Removed an old process-note-only PMID for the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview, which was not actually a COA6 evidence citation. Deep-research identity preflight WARN was inspected: expected COA6 and OMIM616501 match; SCO2 mentions concern a binding partner or explicitly excluded comparator disease. Incorrect HPO suggestions in the report were not adopted.

    Validation: schema/ontology/reference validation passed with79/79 snippets and92 title instances, no skips or unavailable snippets; two targeted data tests passed. Snippet boundaries pass. All28 QA gates passed, with the cache-integrity check rerun after removal of an unusable generated browser-challenge file. Rendering succeeded. The PMC2014 quote retains the cached HTML entity for the less-than sign so the original age statement is verifiable without changing the generated cache.

    Additional verification: page rendering succeeded and generated HTML was restored. All content/term/snippet/internal-target/coverage QA checks passed. The first cache-integrity sweep encountered the rejected browser-challenge cache being removed during the sweep; the final full-tree rerun passed.

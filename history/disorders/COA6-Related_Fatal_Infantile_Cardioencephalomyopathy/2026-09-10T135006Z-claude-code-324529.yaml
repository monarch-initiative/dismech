  summary: 'Create: COA6-Related Fatal Infantile Cardioencephalomyopathy'
  details: |
    Created kb/disorders/COA6-Related_Fatal_Infantile_Cardioencephalomyopathy.yaml (MONDO:0014668, CEMCOX4/MC4DN13), an ultra-rare autosomal recessive Complex IV assembly disorder caused by biallelic COA6 variants.

    PREFLIGHT settled three things before any content was written. The gene is COA6 (hgnc:18025), not SCO2 - the CEMCOX series number does not map to the gene I would have guessed from it, and SCO2 is CEMCOX1. The repository convention for these siblings is <GENE>-Related_..., so the file is named for the gene rather than by the stub's proposed Cardioencephalomyopathy_Fatal_Infantile_Due_To_Cytochrome_C_Oxidase_Deficiency_4. And COA6 already appeared in kb/modules/complex_iv_assembly_deficiency.yaml and kb/groupings/Mitochondrial_Complex_IV_Deficiency.yaml, so the entry was built to conform to the module and was added to the grouping (separate history record). No PR or issue covered MONDO:0014668.

    DEEP RESEARCH: one provider, claude_code, 275 s, 23 web searches, 30 turns, 16 citations. No validation sections were emitted, so both retro-fits were run. References: 9/9 resolved, 0 unresolved, 0 off topic; one quote not found, which is the report quoting a paper's own title with an ellipsis rather than a fabrication. Terms: 30 checked, 3 named as a different term and 1 unresolved. Nothing was bound from the report. The three bad bindings were HP:0006955 offered for left ventricular non-compaction (that CURIE is Olivopontocerebellar hypoplasia), HP:0031628 offered for mitral regurgitation (that CURIE is Aborted sudden cardiac death), and HP:0001725 offered for biventricular hypertrophy (that CURIE does not exist in HPO). Every identifier in the entry was resolved independently at the moment it was written; hgnc:18025 was checked in both directions, symbol to id and id to symbol, because COA6-AS1 sits adjacent in HGNC.

    A SUBSTANTIVE REPORT ERROR CAUGHT: the report merged two different copper-rescue experiments into one claim, attributing to PMID:24549041 a sentence about patient fibroblasts that does not appear in that paper at all. The two results differ in system and in magnitude - copper completely rescued yeast coa6-null cells (PMID:24549041) and partially rescued patient fibroblasts (PMID:25339201). Curating the merged version would have asserted complete rescue of human cells, overstating a therapeutic lead in a fatal infantile disease. Both are curated separately at the magnitude each source reports.

    SCOPE, and the reason it is narrow. Reported patients are described in the literature with left ventricular non-compaction, valvular insufficiency, hypothermia, muscular hypotonia, failure to thrive and dysmorphic features, and lactic acidosis is a defining feature per OMIM. None is curated, because all six primary sources resolved as abstract-only records and none of that detail appears in any cached abstract - it lives in published full text and the OMIM clinical synopsis. Curating them would have required snippets that do not exist in the cited sources. Recorded in notes as a closable gap rather than as a judgement that the phenotypes are absent. One consequence is that the entry conforms to three of the module's four nodes but not to Lactic Acidosis and Metabolic Decompensation, since no lactate claim is citable here.

    ENCEPHALOPATHY DELIBERATELY NOT CURATED, following the sibling COA5 entry's precedent. The deep-research report asserted encephalopathic features by reasoning from the disease name rather than from an observation. The name's encephalo- half is inherited from the SCO2-defined syndrome it was coined for. Recorded as a KNOWLEDGE_GAP discussion naming this as the Named Entity Confusion risk it is.

    A LITERATURE DISAGREEMENT RECORDED RATHER THAN RESOLVED: the index patient was reported with isolated Complex IV deficiency, while a COA6 knockout cell line showed combined Complex I and Complex IV deficiency. Curated as a REFUTE evidence item on the enzyme-deficiency node plus an OPEN_QUESTION discussion, because the disease's classification in the isolated-COX-deficiency family rests on the first reading.

    MORTALITY MODELLING: HP:0001522 (Death in infancy) exists but is outside the PhenotypeTerm dynamic enum, being a mortality rather than phenotypic-abnormality term. The fatal course is curated in progression: instead, which is where it belongs.

    EVIDENCE GRADING: check-snippet-grading caught two divergences where one sentence carried two evidence_source values, and a full per-reference census then caught a third the gate could not see because it was a different sentence. All resolved by grading each publication for what it reports: PMID:24549041 is MODEL_ORGANISM throughout; PMID:25339201 legitimately carries HUMAN_CLINICAL for its clinical detail and IN_VITRO for its fibroblast experiments; PMID:26160915 and PMID:32061935 carry IN_VITRO for their own work and OTHER for introduction prose restating other reports.

    GENEREVIEWS: no COA6-specific chapter exists. A PubMed All-Fields search matched Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview (PMID:26425749), but COA6 appears nowhere in that chapter's PubMed abstract (verified by efetch), its cached record carries no abstract text at all, and this disorder is a cardioencephalomyopathy rather than Leigh syndrome. No baseline applied; the chapter is fetched but not cited.

    VALIDATION: just validate-disorders passed - schema, terms, 33/33 snippets verified against the cache. All eleven offline gates green. just check-groupings reports the new member SATISFIED against the grouping's criteria, which independently confirms the conforms_to links.

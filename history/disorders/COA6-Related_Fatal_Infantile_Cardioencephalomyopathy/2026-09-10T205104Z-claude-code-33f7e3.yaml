  summary: 'Address PR #11640 re-review: retract stale gap claim in discussion, record reported alleles'
  details: 'Third review round on PR #11640. The reviewer confirmed both prior blocking

    items fixed and raised a third, which was the same defect class for the third

    consecutive round: a claim corrected in one place and left standing in another.


    IMPORTANT 3. The coa6_clinical_phenotypes_behind_full_text discussion still

    asserted the scoping claim that the previous round had retracted from notes:.

    It said six clinical features are uncurated when two of them are now curated

    phenotypes in the same file; that none appears in any cached source when

    PMID:31515291 names two; that two sources are cached as full text when four

    are; and that the entry conforms to three of four module nodes when it conforms

    to all four. Narrowed the gap to the four features that genuinely remain out of

    reach - left ventricular non-compaction, valvular insufficiency, hypothermia,

    failure to thrive - and added an explicit scope note recording that the gap was

    previously stated too widely and why. This matters more than the equivalent

    error in prose because a KNOWLEDGE_GAP discussion is structured, queryable

    content asserting a gap, and it attaches to phenotypes#, the section it was

    misdescribing.


    Reported alleles. Taken this round, having been declined last round. W59C, E87*

    and W66R are now named in the Genetic notes with the reasoning for recording

    them as reported alleles rather than structured variant records: the source

    names them in one summarising sentence with no per-allele phenotype, zygosity

    or functional data. Added the PMID:31515291 sentence as an evidence item on the

    gene record, graded OTHER because it is that paper''s introduction summarising a

    previously published patient report.


    Process change, since the same defect recurred three times. Before this push,

    every claim about repository state in both changed files was grepped for and

    each surviving instance checked, rather than only the location the reviewer

    named. The sweep found the discussion block, and confirmed the corrected notes:

    paragraph is the only other place the topic is discussed. Ground truth was then

    recomputed from the files rather than carried forward from an earlier draft:

    6 pathophysiology nodes, 3 phenotypes, 4 of 4 module nodes conformed, 9 PMIDs

    cited as evidence of which 4 are content_type full_text (31515291, 31851937,

    32061935, 35053273). PMID:26425749 appears only as a prose mention of the

    GeneReviews negative search and is not an evidence citation, so the note''s

    "nine cited sources" is correct.


    That recompute caught an error nobody had flagged: the PR body said seven

    pathophysiology nodes and the reviewer''s own re-review described a "seventh

    pathophysiology node", but the entry has six. The new node was added and the

    count was wrong on both sides. The PR body has been corrected to the verified

    numbers.


    An earlier version of this session''s own check was also wrong and is recorded

    here because it is the same failure: a first attempt to count full-text sources

    grepped for "full_text", which matches the full_text_attempted key present in

    every cached file, and reported 10 of 10. The correct predicate is

    content_type: full_text.


    Validation: just validate passes, 44/44 snippets verified, validate-terms,

    check-entity-refs, check-causal-targets, check-duplicate-keys and

    check-enum-values green, check-groupings reports the COA6 member SATISFIED.'

  summary: 'Edit: COA6 - red-team review fixes, incl. two false claims and a wrong
    copper CURIE'
  details: |
    Pre-PR red-team review (dismech-pr-review skill, fresh-context subagent) returned REQUEST_CHANGES with two critical findings, seven important and four minor. All verified independently before acting; all addressed. Also corrects kb/groupings/Mitochondrial_Complex_IV_Deficiency.yaml (separate history record filed for that file).

    CRITICAL 1, verified and fixed. The grouping member row claimed copper supplementation gave 'the only mechanism-directed therapeutic lead in this arm'. That is false and is contradicted twice inside this repository: the COX5A member row in the same grouping file already states complex IV deficiency 'is partially rescued by copper supplementation in patient fibroblasts', and kb/disorders/SCO2-Related_Fatal_Infantile_Cardioencephalomyopathy.yaml carries a full Copper-Histidine Supplementation treatment whose lead is strictly stronger than COA6's, having actually been administered to a patient. Rewritten to place COA6 alongside the SCO2 and COX5A leads and to state the real distinction, which is that no copper has been given to a COA6 patient.

    CRITICAL 2, verified and fixed. The entry asserted flatly, in three places, that COA6 'is not a copper carrier'. PMID:26160915 - cited seven times in this entry - states in its abstract 'COA6 has the capacity to bind copper'. I asserted the negation of a sentence in a source I was citing. Two further sources cached by the first commit and never cited say the same: PMID:31515291's crystal structure assigns one disulfide a likely copper-binding site, and PMID:35053273, a critical review of the pathway, states that 'some discrepancy exists regarding the function of COA6' and that 'Its role as a copper metallochaperone has also been proposed'. The framing is now 'best-supported role' rather than a flat negative, and a new OPEN_QUESTION discussion (coa6_reductase_versus_metallochaperone) records the controversy with all four quotes. This was the same defect the entry already handled correctly for the isolated-versus-combined complex question, applied inconsistently within one file.

    IMPORTANT 1, verified and fixed. The notes claimed 'all six primary sources resolved as abstract-only records'. Two of them, PMID:31851937 and PMID:32061935, are cached as full_text_xml. The conclusion survives - both are structural and mechanism papers carrying no patient clinical detail, and it is the four patient-facing sources that are abstract-only - but the stated premise was wrong, and prose describing repository state is content that rots. Restated precisely, and the note now says explicitly that an earlier draft got it wrong.

    IMPORTANT 2, fixed. Three references cached by the first commit were never cited. PMID:26669719 now supports the genetic section ('patient mutations in Coa6 disrupt Coa6-Cox2 interaction, providing the biochemical basis for disease pathogenesis') and adds a REFUTE item bounding the copper lead ('copper supplementation fails to rescue Cox2 levels of these double mutants'). PMID:31515291 supports the genetic section with the crystal structure of a patient allele. PMID:35053273 anchors the new discussion. All nine cached references are now cited.

    IMPORTANT 3, fixed. PMID:25339201's abstract opening sentence was graded HUMAN_CLINICAL; it is background restating prior work immediately before the paper presents its own patient, so it is OTHER by the rule this entry already applies twice elsewhere.

    IMPORTANT 5, fixed. The COA6-knockout HEK293T model had no modeled_mechanisms and was a disconnected list entry despite being the source of the entry's REFUTE evidence. Now linked to Cytochrome c Oxidase Deficiency as PARTIALLY_RECAPITULATES at CELLULAR scale, with a POPULATION_MISMATCH divergence recording that a complete null is not the patient genotype - which is itself one candidate explanation for the isolated-versus-combined discrepancy.

    IMPORTANT 6, verified and fixed. CHEBI:748257 was bound for copper. It validates and its label really is 'copper', but it is a ChEMBL-derived drug-registry duplicate whose synonyms are copper IUD brand names and whose sole parent is 'organic molecular entity' - for a metal. Four sibling entries (COX5A, aceruloplasminemia, Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome) use the canonical CHEBI:28694. Rebound to CHEBI:28694 'copper atom'. This is precisely the self-consistent-but-wrong-concept binding CLAUDE.md warns about, and it survived the first pass because I disambiguated on label alone, preferring 'copper' over 'copper atom' without checking ancestry or repository convention.

    IMPORTANT 7, fixed: therapeutic_modality OTHER to SMALL_MOLECULE, matching the sibling SCO2 copper treatment.

    MINOR 1 and 2, fixed. The encephalopathy knowledge gap now anchors with the empty-anchor form phenotypes# rather than to two cardiac items. The six uncurated clinical phenotypes are now a structured KNOWLEDGE_GAP (coa6_clinical_phenotypes_behind_full_text) rather than only prose in notes, so the gap is findable by query.

    SCOPE DECISION UPHELD. The reviewer attacked the decision not to curate lactic acidosis and five other phenotypes and could not break it: it grepped all eight cached files including both full texts for every relevant term and found zero hits; it searched PubMed for a fetchable alternative and found none carrying patient clinical detail; and it confirmed MONDO:0014668 has no Orphanet xref, so the ORPHA structured source is genuinely unavailable. Its verdict was 'under-curated in outcome, correctly curated in method'. The refusal to curate encephalopathy was also upheld, on the grounds that MONDO's own definition is a classification inherited from the SCO2-defined syndrome rather than an observation.

    VALIDATION: just validate-disorders passes, 40/40 snippets verified (up from 33). All ten offline gates green. check-groupings still evaluates the COA6 member as SATISFIED. Per-reference grading census re-derived: no reference carries contradictory values on one sentence.

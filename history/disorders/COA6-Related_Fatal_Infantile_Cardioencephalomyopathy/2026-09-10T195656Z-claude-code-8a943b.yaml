  summary: 'Address PR #11640 review: add two quotable phenotypes, correct scoping note and grouping claim'
  details: 'Addressed both blocking items from the ai4c-reviewer CHANGES_REQUESTED review on

    PR #11640. Both were verified against the sources before acting; both were real.


    Item 1. The claim "COA6 is not a copper carrier" survived in

    kb/groupings/Mitochondrial_Complex_IV_Deficiency.yaml. Commit ab7bad1d9

    identified that exact assertion as a defect and reframed it in the disorder YAML,

    but did not check the grouping file edited in the same PR, so the branch shipped

    prose contradicting its own entry and two of its own cited sources

    (PMID:26160915, PMID:35053273). Reframed to match the disorder: the reductase

    role is the best-supported one, whether COA6 also carries copper is unsettled,

    and the coa6_reductase_versus_metallochaperone discussion carries both sides.

    The surrounding differentiating claim - a failure to prepare the copper-accepting

    cysteines rather than to deliver copper - is unchanged and remains correct.


    Item 2. The phenotype-scoping note was factually wrong. It said no reported

    phenotype appears in any cached source, and that two cited sources are cached as

    full text. Four are (PMID:31515291, PMID:31851937, PMID:32061935, PMID:35053273),

    and PMID:31515291 - already cited twice in this entry - contains "An additional

    patient with a W66R mutation in Coa6 suffered from neonatal hypertrophic

    cardiomyopathy, muscular hypotonia, and lactic acidosis with a COX defect in the

    fibroblasts". Lactic acidosis (HP:0003128) and Hypotonia (HP:0001252) are

    therefore both quotable and are now curated, each graded OTHER because the

    sentence is that paper''s introduction summarising a previously published patient

    report rather than its own result.


    Curating lactic acidosis unblocked the module''s fourth node. Added a

    pathophysiology node, Anaerobic Glycolytic Shift and Lactic Acidosis, conforming

    to complex_iv_assembly_deficiency#Lactic Acidosis and Metabolic Decompensation

    and carrying the GO:0019249 lactate biosynthetic process the module node expects.

    It is wired as a sibling of the cardiomyocyte node under Cytochrome c Oxidase

    Deficiency, mirroring the module''s own fan-out from Impaired Terminal Electron

    Transfer rather than being chained under the cardiac arm. The entry now conforms

    to all four module nodes. Hypotonia is edged from the enzyme-deficiency node

    directly, since no skeletal-muscle node is curated.


    The note was rewritten to say what is actually true, to list what genuinely

    remains out of reach after checking all nine cached sources (left ventricular

    non-compaction, valvular insufficiency, hypothermia, failure to thrive,

    dysmorphic features), and to record that this note has now been wrong twice - a

    claim about which sources say what is a claim about repository state and decays,

    so it should be checked against the cache rather than against an earlier draft.


    One error made and caught during this round: the reference_title for

    PMID:31515291 was written from memory as "Human COA6 Is a Heme A:Heme O

    Oxidoreductase Assembly Factor." The cache says "Structural and functional

    characterization of the mitochondrial complex IV assembly factor Coa6."

    Title validation caught it; corrected by copying from the cache frontmatter.


    Not done, and why. The reviewer noted that the same source sentence names the

    W59C, E87* and W66R alleles, which the genetic: section records only

    generically. Left as is: the alleles are named in a passing introductory

    sentence without per-allele phenotype or functional data, so recording them as

    structured variant records would assert more precision than the source carries.


    Validation after the fixes: just validate passes on the disorder and the

    grouping; 43/43 snippets verified; validate-terms, check-entity-refs,

    check-causal-targets and check-duplicate-keys all green; check-groupings reports

    the COA6 member SATISFIED.'

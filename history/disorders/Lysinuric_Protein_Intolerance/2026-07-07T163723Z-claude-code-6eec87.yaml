  summary: 'Create: Lysinuric protein intolerance SLC7A7'
  details: |
    New de novo Disease entry for Lysinuric protein intolerance (LPI, MONDO:0009109, OMIM:222700, SLC7A7 / hgnc:11065) curated for IEMbase metabolic WP-004 issue #5559, row 1.11.06.01. NEC preflight: confirmed MONDO:0009109 and OMIM:222700 match the seed gene SLC7A7. Pathograph debundled into SLC7A7 loss of function -> defective cationic amino acid transport at the intestinal/renal basolateral membrane -> urea-cycle substrate deficiency -> postprandial hyperammonemic decompensation, conforms_to metabolic_intoxication_decompensation node Acute Metabolic Decompensation, plus multisystem arms connected from the central transport defect: alveolar macrophage dysfunction/PAP, renal glomerulonephritis/CKD, hematologic HLH-like dysregulation, and skeletal/growth involvement. Follow-up review additions tag GeneReviews PMID:20301535 at top level, add GeneReviews recurrence-risk evidence to inheritance, add diarrhea, leukopenia, growth delay, hypercholesterolemia, and hypertriglyceridemia phenotypes, and correct Bodoy IJMS PMID:31653080 inducible Slc7a7 KO mouse evidence to MODEL_ORGANISM. Evidence from six independently verified references: GeneReviews PMID:20301535, Sperandeo Hum Mutat PMID:17764084, Tanner JIMD Rep PMID:27783330, Parto Hum Pathol PMID:8163273, Bodoy IJMS PMID:31653080. All PMIDs fetched via just fetch-reference; snippets confirmed exact substrings. Five originally-recalled PMIDs were discarded after resolving to unrelated papers. Validated with just validate, validate-terms, validate-references, all passing.

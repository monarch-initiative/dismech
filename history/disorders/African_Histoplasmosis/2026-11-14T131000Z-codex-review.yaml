  summary: Add dissemination and HIV host context to African histoplasmosis
  details: |
    Added a disseminated Hcd infection node with Republic of Congo and 1993-2019 case-review evidence, a progression block for localized disease, dissemination with 60.6% disseminated forms and 23.4% mortality, and delayed symptoms after remote endemic-area exposure. Added HIV infection as a host susceptibility context, wired it to dissemination, and used the previously unused PMID:18217546 HIV/Hcd review. Added fever plus skin, lymph-node, and bone frequency values, clarified rare visceral involvement in the notes, added serology-limitation evidence to diagnosis, softened the amphotericin/itraconazole severity-stratification wording, and recorded this local cached-source follow-up pass.

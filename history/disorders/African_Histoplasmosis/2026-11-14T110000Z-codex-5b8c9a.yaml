  summary: Create African histoplasmosis infectious-disease entry
  details: |
    Curated African histoplasmosis as a standalone H. capsulatum var. duboisii disease, distinct from the broader Histoplasmosis and Histoplasma capsulatum infectious disease stubs. Added the Hcd agent, a cautious environmental life cycle, the unresolved inhalation-or-transcutaneous acquisition route, a cases-in-literature prevalence record, a guano-enriched-soil exposure, a three-node tissue/giant-cell granulomatous pathophysiology, core cutaneous/bone/lymph-node phenotypes, diagnostic histopathology, and amphotericin B/itraconazole antifungal therapy from PubMed/PMC review and case-series sources.

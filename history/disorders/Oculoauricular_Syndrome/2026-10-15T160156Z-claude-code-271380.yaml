  summary: 'Review round 1: Oculoauricular_Syndrome'
  details: |
    Addressed the gene activity grounding gate and three agreed reviewer suggestions on PR 14365.

    1. scripts/check_gene_activity_grounding.py --against-ref origin/main flagged HMX1 as reaching a pathophysiology node without a molecular function. Bound GO:0003700 DNA-binding transcription factor activity (modifier DECREASED; label from cache/go/terms.csv and OLS, present in the molecular-function enum cache) on the HMX1 Loss of Function node, supported by the PMID:24945320 abstract sentence identifying HMX1 as a homeobox-containing transcription factor (quote_role BACKGROUND). The more specific RNA polymerase II repressor term was not used because the cited abstracts show repression of individual targets, not a general repressor activity. The descriptor has no evidence slot, so the evidence item sits on the node.
    2a. Chorioretinal and optic disc coloboma are now linked from the anterior segment, lens and optic fissure node with the same INDIRECT optic-fissure-closure evidence (PMID:25574057) as iris coloboma; the explanation notes that the second family had iris coloboma only, so extending the proposal to the other uveal colobomas is an inference.
    2b. Removed the ClinGen orodental-anomalies evidence item from High Palate; the 2026 case report stands alone.
    2c. Added quote_role BACKGROUND to the PMID:22736458 item on the HMX1 to pinna edge, where the rat paper restates the mouse dumbo finding.

    Validation: grounding script passes against origin/main; just validate, count-verified-snippets, validate-terms with normalize-cache, check-entity-refs, check-causal-targets and validate-disorders were rerun.

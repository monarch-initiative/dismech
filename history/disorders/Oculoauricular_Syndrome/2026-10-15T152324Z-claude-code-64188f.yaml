  summary: 'Create: Oculoauricular_Syndrome'
  details: |
    Created the oculoauricular syndrome (MONDO:0012802, HMX1, OMIM 612109) entry from the skeleton, keeping its creation_date.

    Deep research: research/Oculoauricular_Syndrome-deep-research-perplexity.md (Perplexity sonar-deep-research run at reasoning_effort=low, because default-effort requests were repeatedly cut off). just preflight-dr returned PASS (HMX1 mentioned 44 times, OMIM 612109 matches MONDO). The report's reference validation resolved 19/19 identifiers with one off-topic flag (PMC5123892, a microtia genetics review, not used). Its 9 'mislabelled' HP terms are table-parsing artifacts (the quality-of-life column was read as the label); none was used without lookup. Report claims not used because the cached abstracts do not state them: the Egyptian cohort variant c.570_571del (PMID:41953648 abstract does not name it), developmental delay and abnormal gait in that patient, and hearing data beyond ClinGen's 'typical hearing'.

    Evidence: all clinical claims cite abstracts of the five human reports (PMIDs 18423520, 21417677, 25574057, 29140751, 41735262) plus the 2026 Egyptian cohort (PMID:41953648) and the ClinGen Retina GCEP Definitive assertion for HMX1 (CGGV record cached with just fetch-reference). Mechanism and model evidence: zebrafish knockdown (PMID:23068565), HMX1 dimerization/EPHA6 repression (PMID:24945320), zebrafish uhrf1 (PMID:33465110), HMX1 target-gene study background statement (PMID:23946633), mouse dumbo/misplaced ears (PMID:19379485) and rat dumbo enhancer deletion (PMID:22736458). PMID:35946463 and PMID:30055074 cached with content_type unavailable and are listed as references only. No phenotype frequencies were recorded, since the literature is about six families.

    The lens and optic fissure node rests on an author proposal (PMID:25574057, 'possibly') and its edges are marked directness INDIRECT. Every downstream edge carries its own evidence stating that link; where no cited abstract states the step (microcornea, posterior synechiae, chorioretinal and optic disc coloboma, cleft earlobe, earlobe aplasia, hypoplastic helices, protruding ears, high palate) the phenotype is left unconnected rather than wired by inference, so 7 of 16 phenotypes are causally connected. The mesenchymal (rat dumbo) evidence is folded into the pinna morphogenesis node. A diagnosis section covers ophthalmological/ERG assessment (bound to NCIT:C38060 Eye Examination; OLS search of NCIT for electroretinogram/Electroretinography returned nothing) and molecular HMX1 testing (NCIT:C101295). No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER).

    Validation: just validate (75 snippets, 0 issues), just count-verified-snippets 75/75, just validate-terms passed, normalize-cache, and the offline gates (duplicate keys, entity refs, causal targets, qualifier terms, coarse phenotypes, enum values, block-scalar comments) passed; just validate-disorders run as the final gate.

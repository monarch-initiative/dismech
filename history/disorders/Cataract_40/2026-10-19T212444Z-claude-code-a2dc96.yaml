  summary: 'Review round 1: Cataract 40'
  details: |
    Addressed the first automated review of PR 14944. Added reference_title to every evidence item, copied from the references_cache title frontmatter. Added a diagnosis entry for copy number analysis (NCIT:C198497 Array-based Comparative Genomic Hybridization), because the defining alleles leave the NHS coding sequence intact and both published families were sequence-negative. Added frequency FREQUENT to the congenital heart defect phenotype (4 of 6 affected males in one family) and kept the broad HPO term because the lesions differed between patients. Added a Glaucoma phenotype as a post-surgical complication of dense congenital cataract (PMID:19084444). Set GO:0010467 modifier ABNORMAL and corrected creation_date from a placeholder to the session time. CI failed the gene activity grounding gate for NHS: NHS has no GO molecular function annotation and the cataract 40 alleles leave the protein intact, so a baseline line was added to tests/gene_activity_grounding_baseline.txt rather than binding a molecular function the entry does not claim.

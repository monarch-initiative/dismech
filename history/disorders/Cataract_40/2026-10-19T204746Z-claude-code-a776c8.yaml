  summary: 'Create: Cataract 40'
  details: |
    New entry for cataract 40 (MONDO:0010544; X-linked congenital cataract, OMIM 302200). Lump/split: kept as a separate Disease from Nance-Horan syndrome, matching the reciprocal decision already recorded in Nance-Horan_Syndrome.yaml; the defining alleles are copy number variants that preserve the NHS coding sequence (PMID:19414485). Deep research: one openscientist report (research/Cataract_40-deep-research-openscientist.md); 12/12 references resolved and 15/15 quotes valid; just preflight-dr PASS (NHS mentioned 96 times). The report treated cataract 40 as the mild end of the Nance-Horan spectrum and mostly described syndromic truncating alleles, so its syndromic phenotypes (dental anomalies, facial dysmorphism, intellectual disability, microcornea, microphthalmia, ptosis) were not carried over; it did not cite PMID:19414485 or the Xcat mouse papers, which were found by PubMed search and form the core of the entry. Taken from the report: surgical timing and visual outcome references (PMID:22383071, PMID:19084444). Not used: PMID:36370055 and PMID:28922055 (Nance-Horan syndrome microdeletion and translocation families), PMID:26231217 (SIPA1L3, a different gene). The expression-change node is marked HYPOTHETICAL because NHS expression was never measured in patients. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs and check-causal-targets pass.

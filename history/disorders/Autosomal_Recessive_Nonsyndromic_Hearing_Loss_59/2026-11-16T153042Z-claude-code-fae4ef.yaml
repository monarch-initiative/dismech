  summary: 'Review round 1: add sound exposure as an environmental factor'
  details: |
    Answers the review of PR #18253. Added an environmental entry for sound exposure, bound to ECTO:8000044 exposure to sound radiation (already cached in the ECTO label and exposure-enum caches), linked to the node Cochlear Oxidative Stress and Sound Hypervulnerability with environmental_effect EXACERBATES. Evidence is from PMID:26544938 (hair cells and auditory neurons of pejvakin-deficient mice and patients are exceptionally vulnerable to sound; noise induces Pjvk and peroxisome proliferation; pup-vocalization correlation) and PMID:30936319 (defective pexophagy as a cause of noise-induced hearing loss in mice). Also added a sentence to the oxidative-stress node description explaining that GO:0006979 response to oxidative stress is bound as DECREASED because the lesion is the failed antioxidant response. Not changed: no vestibular phenotype was added for the G292R knock-in mouse, because the cached abstract of PMID:32917362 states the aim of studying auditory and vestibular phenotypes but reports no vestibular result.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 59 (DFNB59, PJVK)'
  details: |
    New entry for MONDO:0012445, curated for claim issue #9059 (replaces stubs/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_59.yaml).

    Sources: an OpenScientist deep-research report (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_59-deep-research-openscientist.md; 13 of 13 references resolved and 12 judged on topic; 33 of 35 CURIEs resolved, the other 2 OMIM identifiers unverifiable) and the cached PubMed abstracts of the 13 papers it cites. Every snippet is quoted from those abstracts and verifies against references_cache.

    Identifiers suggested by the report were not copied. Its HGNC identifier for PJVK (HGNC:28015) is not HGNC's identifier for PJVK, which is hgnc:29502. Its CL:0000119 and UBERON:0001691 suggestions are cerebellar Golgi cell and external ear. All bindings come from the committed term caches or OLS.

    GeneReviews: the only chapter covering PJVK is the Genetic Hearing Loss Overview (PMID:20301607, NBK1434), whose cached abstract is a statement of purpose. It is tagged GeneReviews but not used as a phenotype baseline; the phenotypes come from the family and cohort reports.

    Lump or split: kept as its own per-locus entry, as DFNB104 is, rather than as a subtype of Auditory_Neuropathy (the suggestion recorded on #9863). Most PJVK alleles cause hearing loss of cochlear origin, and the curated mechanism lies mainly in hair cells. Whether pejvakin is required in auditory neurons is contested between mouse studies, and that is recorded as a HUMAN_MODEL_MISMATCH discussion rather than settled.

    Pathograph: biallelic PJVK loss, then impaired noise-induced peroxisome proliferation and pexophagy, then cochlear oxidative stress and sound hypervulnerability, then outer hair cell degeneration and auditory neuron dysfunction, with a parallel stereocilia-architecture branch. The oxidative-stress node conforms to sensorineural_hair_cell_loss. The c.547C>T allele tested in the Iranian cohort is the p.Arg183Trp variant of the discovery family by codon position (codon 183 spans c.547-549); the Iranian abstract gives only the cDNA change.

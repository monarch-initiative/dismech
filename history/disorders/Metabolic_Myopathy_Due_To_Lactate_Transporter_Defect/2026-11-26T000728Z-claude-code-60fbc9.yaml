  summary: 'Gene-family review: SLC16A1'
  details: |
    SLC16A1 was typed CAUSATIVE although its own notes recorded Limited gene-disease validity (GenCC) and disputed historical missense variants (PMID:10590411). It is now typed UNKNOWN with germline origin, and the note states why. The mechanism node (lactate transmembrane transporter activity, DECREASED, partial loss of function) matches MCT1's normal function and was not changed. The ketoacidosis disorder caused by loss of MCT1 (MONDO:0014490) remains a stub.

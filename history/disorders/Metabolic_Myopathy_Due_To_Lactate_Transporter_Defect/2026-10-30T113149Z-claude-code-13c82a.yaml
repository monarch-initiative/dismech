  summary: 'Create: Metabolic Myopathy Due To Lactate Transporter Defect'
  details: |
    Created the SLC16A1/MCT1 muscle lactate-transporter myopathy entry (MONDO:0009501, OMIM:245340, ORPHA:171690) from a Perplexity deep-research report (6/19 refs on-topic; treated as leads). Modeled the causal chain MCT1 partial LOF -> reduced sarcolemmal/erythrocyte monocarboxylate transport -> impaired lactate/H+ efflux on exercise -> intramuscular lactate/proton accumulation -> exertional cramps/stiffness/fatigue and myofiber injury -> rhabdomyolysis, hyperCKemia, myoglobinuria. Evidence from Fishbein 1986 (PMID:3775384), Merezhinskaya 2000 (PMID:10590411), Geistlinger/Schumann 2023 (PMID:36874278, IN_VITRO mechanism), and Orphanet ORPHA:171690; all 17 snippets verified. Allelic-scope decision: kept scoped to the muscle/erythrocyte lactate-transport phenotype and recorded in notes that MCT1 ketoacidosis (OMIM:616095, biallelic LOF) and dominant exercise-induced hyperinsulinism (OMIM:610021, promoter gain-of-expression) are distinct allelic diseases out of scope; used functional_impact_category PARTIAL_LOSS_OF_FUNCTION. Recorded disputed historical-variant pathogenicity and GenCC Limited validity in Genetic notes; excluded the report's misattributed PMID:25371203 (a 5-oxoproline paper). Validated with validate, validate-terms, validate-disorders, and the kb/ gate set.

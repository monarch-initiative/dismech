  summary: 'Create: Hypomyelinating_Leukodystrophy_14'
  details: |
    New entry for HLD14 (MONDO:0033486, UFM1). Deep research was requested from falcon; no Edison key was configured, so the run used dr_fallback and the report was produced by claude_code (research/Hypomyelinating_Leukodystrophy_14-deep-research-claude_code.md; frontmatter records fell_back, requested_provider falcon). Report reference validation: 16/16 identifiers resolved, 26/27 quotes valid; the one unsupported quote is on PMID:27545674 (a UBA5 paper), which is not cited here. Term validation mislabels were paraphrases only. preflight-dr WARN on UFC1 mentions was reviewed: UFC1 appears only as a differential diagnosis, and PMID:39846712 (describes a UFC1 variant as 'HLD14-related') is deliberately not used as evidence. Evidence was taken from primary papers cached with just fetch-reference (PMIDs 28931644, 29868776, 34573312, 35189806, 42195294, 41731076, 30626644, 40315331, 36543799, 39470296). A lymphoblast snippet first drafted from PMID:29868776 turned out to describe UFC1 patients and was replaced with the R81C-specific sentence; an unsupported claim of longer survival with p.Arg81Cys was removed. Death in infancy is curated under progression because HP:0001522 is outside the PhenotypeTerm enum. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validation: just validate passes, count-verified-snippets 88/88, check-entity-refs, check-causal-targets, check-duplicate-keys all OK. Stub stubs/Leukodystrophy_Hypomyelinating_14.yaml deleted.
    A fresh-context red-team review before the PR (6 important, 8 minor, no critical findings) led to these changes: p.Arg81Cys scope corrected from PMID:29868776 Table 2 (basal ganglia 0/4, delayed myelination 3/4), with the unconfirmed OMIM 617899 status noted; corpus callosum atrophy rebound to HP:0007371; drug-resistant epilepsy rebound to HP:0200134; UPR node narrowed to GO:0036499 PERK-mediated UPR; the UPR-to-translation edge downgraded to INDIRECT_UNKNOWN_INTERMEDIATES (trazodone rescue only in R81C neurons; p-eIF2alpha not significant); pseudobulbar signs (HP:0002200) and caudate head signal abnormality (HP:0012751) phenotypes added; tracheostomy, gastrostomy feeding and anticonvulsant therapy treatments added; progression age range corrected to a median of about 1-2 years; the 4.5% pan-European carrier rate added, with the 25% community figure flagged as ascertainment-biased; Orphanet ORPHA:139441 recorded as a broader external record; and several evidence_source and explanation corrections. Revalidated: just validate 99/99 snippets, validate-disorders, check-entity-refs, check-causal-targets and check-duplicate-keys all OK.

  summary: Quote source sentences for six table-cell snippets; merge main
  details: |
    The PR was blocked by one of 22 CI gates: check-snippet-length reported six new evidence snippets under five words, all in this entry and all citing PMID:35189806. Each quoted only a parenthetical count lifted out of a table-style list -- 'reduced myelination (6/6)', 'macrocisterna magna (5/9)', 'corpus callosum atrophy (3/6)', 'progressing to opisthotonus (6/9)', 'nystagmoid ocular movements (6/9)', 'malnutrition (5/9)'. The cached abstract carries both source sentences in full, and the entry already quoted them at pathophysiology[11] and phenotypes[13], so the six were replaced with the same two spans: the imaging sentence ('Brain imaging revealed cortical atrophy (7/9) ... caput nuclei caudati.') for the three imaging findings, and the 10-month clinical span ('microcephaly (6/9), malnutrition (5/9) ... nystagmoid ocular movements (6/9)') for opisthotonus, nystagmoid movements and malnutrition. Each explanation already named the specific finding, so it still points at the claim the item supports. No claim changed and no evidence item was added or removed. Both reused spans were already graded HUMAN_CLINICAL/SUPPORT in this file, so reusing them introduces no snippet-grading divergence. Also merged main. Before the merge, check-title-snippets reported three findings in Complex_Hereditary_Spastic_Paraplegia.yaml, which this PR does not touch: PR #12895 reworded those snippets on main after this branch was cut, so the branch carried the pre-rewording text while the baseline derived from current main no longer listed it. The merge resolved all three; main itself was verified green on that gate against its committed baseline. The merge also brought in the term-cache rows for the terms this entry binds (hgnc:20597 UFM1, MONDO:0033486, GO:0072344, GO:0061709, HP:0046507), which the branch had never committed, so term validation was resolving them over the network instead of from cache. Verified on the merged tree: check-snippet-length and check-title-snippets both clean, validate-disorders 100/100 snippets and 100/100 titles with 0 issues, and check-snippet-grading, check-entity-refs, check-duplicate-keys and check-causal-targets all pass.

  summary: Add the GRN-FTLD-TDP subtype row (MONDO:0011842), routed here from the
    Primary_Progressive_Aphasia gap row
  details: |
    Genetics pass for issue 12278 (series-071). This entry is not one of the issue's
    twenty named parents; it was touched because the checklist row MONDO:0011842
    belongs here rather than on the parent the gap list named.

    One has_subtypes row added: GRN-FTLD-TDP, bound to MONDO:0011842, with GRN
    (hgnc:4601) and four evidence items. MONDO gives the term two parents,
    MONDO:0017276 (this entry) and MONDO:0019806 (primary progressive aphasia), so
    either placement is MONDO-sanctioned; the term's own definition opens "A
    frontotemporal dementia characterized by variable phenotypic expression
    typically including social, behavioral, or language deterioration", which makes
    frontotemporal dementia the correct parent and progressive aphasia one
    presentation among several. GRN is already a wired causal gene here, landing on
    the TDP-43 Proteinopathy node, and reaches no mechanism node on the aphasia
    entry, so this is also where the row's gene binding means something. The
    reasoning is recorded both in the row's review_notes and in the aphasia entry's
    notes.

    The row sits beside the existing nonfluent/agrammatic clinical row, which binds
    the same gene. That is deliberate and the row says so: one row is the genotype
    and the other the syndrome, they cut the same patients along different axes, and
    neither is a parent of the other. The entry's has_subtypes list already mixed
    clinical rows with a gene-defined one (FTD3/CHMP2B), which is the precedent this
    row follows.

    The row adds no genetic record and no pathophysiology gene descriptor, so it
    changes neither the gene-wiring metric nor the gene-activity grounding ratchet;
    check-gene-activity-grounding against origin/main is clean.

    One of the four evidence items is graded HUMAN_CLINICAL with quote_role
    BACKGROUND, because the quoted sentence is the BACKGROUND paragraph of an
    in-vitro publication's structured abstract and states the human genetic
    picture. The same sentence is graded identically on the aphasia entry, so
    check-snippet-grading reports no new divergence.

    Validation on the final tree: just validate, just validate-terms and
    just count-verified-snippets clean; 50/50 snippets verified after reverting the
    validator's reference-cache renormalisation.

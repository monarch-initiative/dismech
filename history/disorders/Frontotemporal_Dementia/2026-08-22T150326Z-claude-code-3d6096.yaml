  summary: Add NEFL-C1QL2 projection neuron plasma proteomic aging clock biomarker
  details: |
    Curated the NEFL-C1QL2 projection neuron aging clock from Ding et al. (PMID:42297981, Nat Med 2026) as a biochemical biomarker with two readouts: PREDICTS onto Neuronal Death (via the established NEFL axonal-injury link) and CORRELATES_WITH onto Frontal and Temporal Lobe Atrophy (via C1QL2 enrichment in temporo-limbic structures). Strongest cellular-aging predictor of incident FTD (HR 3.03, 95% CI 2.47-3.72), ahead of microglia (HR 2.84), and the strongest cross-sectional association with prevalent FTD in GNPC (n = 199 cases). The cell-type binding needs care and the notes say so: the Human Protein Atlas catalogues this population as retinal 'horizontal cell' and the authors renamed it on transcript evidence, so it is bound to CL:0000540 neuron rather than to the retinal term the authors explicitly rejected. That makes this entry the clearest worked example in the KB of the probabilistic protein-to-cell-type mapping being the weak link in these clocks, which is the gap recorded in the Alzheimer_Disease discussion gap_cellular_aging_clock_generalizability_and_cell_assignment. The atrophy readout is flagged as a regional-expression argument, not a measured correlation with imaged atrophy. Grounded to NCIT:C97139 Proteomic Profile. This entry had no biochemical section before. Validation: linkml-validate clean; term validation passed; reference validation --no-full-text exit 0; new snippets confirmed as exact literal substrings of the cached full text.
    Source of this curation: the Cell Reports Medicine Spotlight by Heikal & Salama
    (PMID:42612620, doi:10.1016/j.xcrm.2026.102996), which surveys Ding et al.
    All numbers were taken from the primary paper rather than the commentary.
    Companion records in the same tranche: Alzheimer_Disease (astrocyte, OPC,
    inhibitory neuron) and Amyotrophic_Lateral_Sclerosis (skeletal myocyte).

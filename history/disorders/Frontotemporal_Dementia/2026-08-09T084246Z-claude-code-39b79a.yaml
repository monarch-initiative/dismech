  details: |
    Deferred item from issue #7025 (neurodegenerative claim-evidence review): modeled the four canonical FTD clinical syndromes as has_subtypes entries - Behavioral Variant FTD (MONDO:0017160), Semantic Variant PPA / semantic dementia (MONDO:0010857), Nonfluent Variant PPA / progressive non-fluent aphasia (MONDO:0015059), and FTD with Motor Neuron Disease (MONDO:0017161) - each carrying a genes[] list and evidence-backed genotype-phenotype correlations (MAPT->behavioral/temporal-predominant; GRN->nonfluent aphasia/TDP-43 type A; C9orf72->ALS co-occurrence/TDP-43 type B) sourced from the already-cited cohort study PMID:26473392, plus PMID:21325651 (Gorno-Tempini 2011 PPA consensus classification, newly fetched and cached) establishing the three canonical PPA variants. Did not touch the existing pan-FTD pathophysiology/phenotype/genetic sections (kept the risk bounded to the additive has_subtypes block) and did not add gene_term HGNC bindings to the pre-existing genetic: entries, which remains a separate, unrelated gap. Validated with just validate, just count-verified-snippets (20/20), just validate-terms, and the full tests/test_data.py suite (all Frontotemporal_Dementia and subtype-related tests pass).

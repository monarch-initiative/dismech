  summary: 'Review round on PR 13265: Correct the CHMP2B node biological_scale'
  details: |
    Review round 1 on PR #13265. The CHMP2B C-Truncation and Aberrant Endosome Formation node carried biological_scale MOLECULAR, which conflicts with its own content: its bound biological process is GO:0007032 endosome organization, an organelle-level process, and the phenotype it rests on is aberrant endosomal structures measured in cells. Changed to CELLULAR. The alternative the reviewer offered - splitting the truncation into a separate molecular node - was not taken, because the node is atomic as it stands and the truncation and the endosomal consequence are cited to the same measurements. The other MOLECULAR scale in this entry is on a different node and is unchanged. Validation: just validate and just validate-terms pass; count-verified-snippets 165/165 across this round's four files.

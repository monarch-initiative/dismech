  summary: 'Genetics pass: FTD3 subtype row, CHMP2B node and record, gene and phenotype
    wiring'
  details: |
    Genetics pass for the series-069 row MONDO:0010936 frontotemporal dementia and/or
    amyotrophic lateral sclerosis 7 (CHMP2B).

    Row ruling: has_subtypes row. An FTD3 row binds MONDO:0010936 with CHMP2B
    (hgnc:24537, read live from rest.genenames.org). MONDO lists the class under
    behavioral variant FTD as well as under familial ALS; the GeneReviews chapter says
    the entity presents most frequently as FTD, so this entry is the home rather than
    the ALS entry. The class carries FTD3 and "frontotemporal dementia, chromosome
    3-linked" as synonyms, which is why a CURIE grep found nothing here before.

    Also added: a CHMP2B genetic record, and a pathophysiology node "CHMP2B
    C-Truncation and Aberrant Endosome Formation" that gives the entry its fourth
    molecular class. The FUS node's own description already named CHMP2B-associated
    FTLD-UPS as the tau/TDP-43/FUS-negative remainder; the node now models it, bound to
    GO:0007032 endosome organization (label read from ols:go) with modifier ABNORMAL,
    and evidenced by the in-vitro aberrant-endosome result and the human postmortem
    reclassification of FTD-3 as ubiquitin- and p62-positive, TDP-43-negative.

    Wiring, measured with dismech.qc_plugins before and after:
      genes wired into the pathograph 1/3 -> 4/4 (denominator rose with the CHMP2B record)
      phenotypes with a causal inlink  2/4 -> 4/4
      pathophysiology nodes with no outgoing edge 1 of 5 -> 0 of 6
    GRN and C9orf72 are now node genes on the TDP-43 node, on the strength of the
    clinico-pathological sentence in PMID:26473392 that assigns them TDP-43 pathology
    and MAPT tau. The Neuronal Death node was a dead end while Frontal and Temporal
    Lobe Atrophy had no inbound edge at all; Neuronal Death now leads to the atrophy
    node and to Dementia.

    References: five sources added to the top-level references block, each title
    transcribed from the title: line of its references_cache file. Two are GeneReviews
    chapters and are tagged as such, which moves just check-genereviews from
    UNTAGGED_CHAPTER to TAGGED for this entry.

    Validation on the committed tree: just validate 0 issues; just validate-terms
    passed; just count-verified-snippets 38/38.

  summary: Bind validated instruments and their severity bands as LOINC measurements
  details: |
    Added a diagnosis section with three rows. MoCA: panel LOINC:72133-2, total LOINC:72172-0 with the bvFTD cut-off below 17 points (PMID:22859702), plus genetic-FTD comparison evidence (PMID:39951678). MMSE: panel LOINC:72107-6 without bands, since no cited source states an FTD cut-off; evidence on its insensitivity in presymptomatic carriers (PMID:39951678) and its language dependence in PPA (PMID:18166606). CDR: panel LOINC:72088-8 only; the FTD-adapted CDR plus NACC FTLD (PMID:38152057) has no LOINC code, and LOINC has no CDR score code, so no stage bands. Copyright notices copied verbatim into each row's notes; no items reproduced. Validated with just validate, loinc-seed-cache, count-verified-snippets, validate-terms and tests/test_loinc_measurement_schema.py.

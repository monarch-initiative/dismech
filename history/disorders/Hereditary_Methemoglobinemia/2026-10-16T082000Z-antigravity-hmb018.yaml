  summary: Review and enhance differential diagnoses, causal phenotype edges, structured prevalence, and
    coarse phenotype binding bases
  details: 'Added four evidence-backed differential_diagnoses entries distinguishing hereditary enzymopenic
    methemoglobinemia from:

    (1) Drug-induced methemoglobinemia (MONDO:0018740), supported by PMID:8416301 and PMID:22024786;

    (2) Hemoglobin M disease (MONDO:0018023), supported by PMID:8416301, PMID:26969357, and PMID:7517266;

    (3) Transient neonatal cyanosis / hemoglobinopathy Toms River (MONDO:0013511), supported by PMID:21561349;
    and

    (4) Cyanotic congenital heart disease (MONDO:0005453, with a notes line recording the MONDO search
    for a narrower term), supported by PMID:3752898 and PMID:14579544.

    Also migrated prevalence to structured fields (splitting Worldwide UNKNOWN point prevalence per ORPHA:621
    from the Yakutia pediatric founder-population point prevalence of 12.7-47.0 per 100,000 children with
    prevalence_class BAND_1_5_PER_10000 per PMID:27879543 and removing deprecated percentage); added role,
    biological_scale, and cited downstream causal edges from pathophysiology nodes to all 13 phenotypes
    (100% phenotype causal connectivity, using mechanistic quotes from PMID:8416301 and PMID:3752898 for
    Methemoglobinemia and Cyanosis and marking Orphanet frequency rows as directness: INDIRECT on Exertional
    dyspnea, Athetosis, Limb dystonia, and Spasticity); added evidence to genetic[].inheritance[]; declared
    coarse_binding_basis on coarse HPO bindings (HP:0001597 SOURCE_UNSPECIFIED, HP:0000707 VARIABLE_SPECTRUM);
    and added therapeutic_modality to treatments.

    '

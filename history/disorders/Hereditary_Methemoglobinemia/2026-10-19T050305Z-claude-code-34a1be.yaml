  summary: Add Type IV (CYB5A, MONDO:0009605) subtype and mechanism
  details: |
    Added the CYB5A cytochrome b5 deficiency form (methemoglobinemia type 4, MONDO:0009605, a direct MONDO child of the entry's disease_term) as a Type IV subtype with bound subtype_term and gene. Added a CYB5A genetic record carrying ClinGen's Definitive AR validity assertion, a CYB5A trigger node wired into the existing methemoglobin-reduction chain and into a new impaired CYP17A1 17,20-lyase node, and a Type IV-scoped 46,XY DSD phenotype (HP:0000037) with the 46,XX normal-development case as a caveat. Types I and II stay unbound because MONDO has no per-type classes; hemoglobin M diseases remain out of scope (recorded in notes). Evidence from PMIDs 3539237, 8168836, 22170710, 32051920, 42824631 and the ClinGen CGGV record; all snippets verify against cached references; schema and term validation pass. Follow-up to the stranded-parent list on issue 12931.

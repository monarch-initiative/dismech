  summary: Ground CYB5A node in a molecular function for CI
  details: |
    The test (3.13) gene-activity-grounding check flagged the new CYB5A gene as wired into the pathograph with no molecular function on its node. Bound GO:0008047 enzyme activator activity (DECREASED) on the 'CYB5A cytochrome b5 deficiency' node. The term was looked up with runoak ols:go and in cache/go/terms.csv; a search for more specific activator terms returned none for P450 or 17,20-lyase. Electron transfer activity was rejected because PMID:22170710 and PMID:32051920 state that in the lyase reaction cytochrome b5 acts as an allosteric facilitator rather than an electron donor. Added the supporting PMID:22170710 sentence as node evidence, graded IN_VITRO with quote_role BACKGROUND because it reports earlier mutagenesis studies. The latest review was APPROVED, and its three optional suggestions were not taken in this round.

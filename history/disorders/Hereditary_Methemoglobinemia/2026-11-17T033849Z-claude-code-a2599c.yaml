  summary: Map MONDO:0009606 (CYB5R3 deficiency) as narrowMatch; retire its stub
  details: |
    The curation stub for MONDO:0009606 (methemoglobinemia due to deficiency of methemoglobin reductase, OMIM:250800) was resolved as SUBTYPE: the CYB5R3-deficiency disease is already curated here as the Type I and Type II subtypes. Added MONDO:0009606 to mappings.mondo_mappings as skos:narrowMatch, because the entry also covers CYB5A-related Type IV (MONDO:0009605) and is therefore broader than the MONDO term. Label confirmed against OLS (MONDO). Deleted stubs/Methemoglobinemia_Due_To_Deficiency_Of_Methemoglobin_Reductase.yaml.

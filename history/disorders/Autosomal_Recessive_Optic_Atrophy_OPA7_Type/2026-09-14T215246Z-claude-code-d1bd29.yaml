  summary: 'Create: Autosomal Recessive Optic Atrophy OPA7 Type'
  details: |
    Created OPA7 (TMEM126A) from the primary literature plus an OpenScientist deep-research report (17/17 references verified, all assessed on topic). Four-node chain from TMEM126A loss of function through failure of ND4 module assembly into complex I and isolated complex I deficiency to retinal ganglion cell degeneration. The entry deliberately separates the 2009 gene identification, whose own paper calls the protein's function unknown, from the 2021 cell biology that established the ND4-module assembly role; the identification paper's admission is quoted rather than paraphrased so a reader sees what it did and did not claim. The final edge is graded causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and its evidence directness INDIRECT with quote_role REVIEW_SYNTHESIS, because no source argues retinal ganglion cell selectivity for TMEM126A specifically; a KNOWLEDGE_GAP discussion records that other complex I assembly-factor defects cause multisystem infantile disease, which makes the tissue selectivity a real question. A second discussion records whether the auditory and peripheral neuropathies are variable expressivity or under-ascertainment. One binding is deliberately imperfect: HPO has no term for auditory neuropathy or auditory neuropathy spectrum disorder, so the phenotype is bound to HP:0006958 Abnormal auditory evoked potentials with the clinical entity in preferred_term and the reason in the phenotype notes. The deep-research report offered HP:0031604 for auditory neuropathy, which is Agenesis of the carotid canal; its own term validation caught that and it was not used. LHON-derived therapeutic prospects (idebenone, AAV gene therapy) are described in the treatment description but not curated as treatments, since neither has been tested in OPA7. Validated with just validate-disorders (16/16 snippets), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms.

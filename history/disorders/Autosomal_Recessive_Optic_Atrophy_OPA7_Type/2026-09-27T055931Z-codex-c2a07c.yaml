  summary: Review OPA7 clinical spectrum and mitochondrial protein biogenesis evidence
  details: 'Reviewed the complete existing disorder and CREATE history, the matching OpenScientist scientific narrative and
    citation list, and the primary references. Eligibility: Mendelian disorder, no prior REVIEW, and no overlapping OPA7/TMEM126A
    PR at selection; infectious and environmental entries remain excluded. The branch was rebased before editing and again
    onto d3235da53a3 at resumption. The intervening main commit did not change this disorder, schema or workflows. The research
    identity preflight passed; its incorrect HP:0031604 suggestion was not adopted.


    Source consumption: read the full scientific bodies, relevant methods and clinical tables of PMID:30961538, PMID:20405026
    and PMID:22815638. Read the 2021 Formosa complex-I/ND4 study (PMID:33879611), including labeling, turnover and rescue
    experiments and methods. Read the direct TMEM126A HAP1 knockout results and assay methods in PMID:33882309 as well as
    the NDUFS3 context, keeping their distinct quantitative results separate. Recovered the founding 2009 paper through the
    generated PMC2667974 URL cache and read its scientific body, figure captions and methods, including discordant patient-fibroblast
    assays, cardiomyopathy, mitochondrial localization and wild-type mouse expression. The mouse expression experiment is
    not an OPA7 disease model.


    Additional primary sources: read the complete Italian clinical report PMID:31119195; the TMEM126A case, clinical and variant
    tables, methods and relevant discussion of the Korean cohort PMID:36071901; and the Chinese cohort PMID:32855858 methods,
    TMEM126A segregation/modeling results, tables and modifier discussion. Its narrative calls the affected F98 pair brothers
    while the demographic table lists one male and one female, so no sex-specific conclusion is imported. The Korean paper’s
    first-East-Asian claim is contradicted by the earlier Chinese cohort and is not copied. Read the full scientific body
    and biochemical methods of PMID:38199007, including OXA1L interaction, cross-linking, acute depletion, two knockout clones,
    nascent-chain labeling, protease codepletion and tagged versus untagged TMEM126B rescue.


    Mechanistic corrections: model OXA1L-associated insertion, iAAA-dependent turnover, loss of nascent mitochondrial proteins,
    secondary TMEM126B loss, complex I assembly and complex I activity as distinct molecular events. Preserve the difference
    between measured interactions/proteolysis/rescue and the inferred cargo-stalling/chaperone mechanism. Untagged TMEM126B
    rescues complex I in 2024 but does not rescue nascent-protein loss; the earlier negative FLAG-tagged rescue is not evidence
    of unconditional paralog non-interchangeability. The 2021 labeled ND4 pool did not turn over faster, and HAP1 basal respiration
    and substrate-driven ATP synthesis were preserved. Complex I deficiency is not invariably isolated across models, and
    patient fibroblast results are heterogeneous. Four cellular models record their measured outcomes and limitations; none
    establishes retinal ganglion-cell selectivity.


    Clinical and genetic corrections: remove unsupported phenotype frequencies, complete-penetrance and universal-consanguinity
    assumptions. Preserve stable abrupt-onset disease in the Moroccan proband versus progressive childhood disease in his
    siblings. Add five representative alleles including the Korean compound-heterozygous genotype; exon 2 skipping is measured,
    complete protein-null status is not. Ser36Leu has conflicting published VUS versus pathogenic/likely-pathogenic interpretations,
    without direct allele-specific function. Add RNFL thinning, nystagmus, bilateral sensorineural hearing loss, individual
    limb myoclonus and founding cardiomyopathy, retaining case scope and uncertain causal attribution for extraocular findings.
    Direct VEP/pattern ERG results support ganglion-cell/optic-nerve dysfunction. Normal full-field ERG is not treated as
    exclusion of all retinal disease, and lack of hearing complaints is not equivalent to normal auditory electrophysiology.


    Care and diagnostics: the Bookshelf snapshot of 2026-09-10 reports no disease-specific GeneReviews or StatPearls chapter.
    Read the full PMID:35024911 abstract and introductory care passage, using it only as indirect general inherited-optic-neuropathy
    support for low-vision rehabilitation and counseling; its LHON/DOA outcome studies are not OPA7 data. Preserve the single
    published IVIG response for peripheral symptoms without asserting a routine treatment, immune mechanism or optic benefit.
    ClinicalTrials.gov condition queries TMEM126A and OPA7 returned zero; the broader autosomal recessive optic atrophy query
    returned gyrate atrophy, a general rare-disease registry and newborn screening, not evidence of an OPA7-directed therapy.
    Idebenone and LHON gene therapy are not established TMEM126A treatments.


    Assertions, datasets and source limits: read the September 2024 ClinGen Glaucoma/Neuro-Ophthalmology evidence summary
    and variant evidence, preserving Definitive gene validity without assigning every allele the same certainty. The raw CGGV
    fetch route failed, so the automatically generated ClinGen URL cache supplies the evidence. Verified pride:PXD023136 through
    the authoritative PRIDE API and just verify-datasets; its title matches the 2021 proteomics study. The 2024 Mendeley data
    route returned 403, so that accession is recorded as a lead rather than a verified dataset. PMID:23500070, PMID:36155660
    and PMID:36317462 were consumed as cached abstracts. The 2022 review DOI returned no quotable content and its publisher
    route returned 403; the 2013 DOI fetch also returned no quotable content. Failed DOI caches and the recaptcha-only PMC9061690
    URL cache are excluded from the PR. Reference caches were generated by fetch-reference and never hand-edited.


    Content-completeness assessment: phenotypes adequate, with individual additional findings scoped to their reports; no
    established OPA7 subtypes; pathophysiology expanded with newer primary evidence and unresolved model differences; supportive
    care, individual IVIG response and trial scope represented; genetics expanded with five alleles and conflicting classifications;
    diagnosis covers molecular testing, OCT and electrophysiology; central cached and recoverable full text consumed. No blocking
    research-backed omission remains. Unresolved questions concern tissue selectivity, variant function, extraocular penetrance,
    an unproven heterozygous LHON modifier and the relationship between the ND4-associated and OXA1L-associated cellular mechanisms.


    Review follow-up: adopted the gene descriptor on the proximal TMEM126A loss-of-function node and CELLULAR scale for ganglion-cell
    degeneration. The sanctioned clingen-rebuild command successfully recovered the canonical CGGV structured record after
    the raw fetch route failed; all three citations and titles now use it, with the complete relationship conclusion available
    as a quote. The redundant generated ClinGen URL cache is removed. The generated founding-paper PMC URL cache remains necessary
    for its full-text-only statements because the PMID cache contains only the abstract. No OPA7-specific hearing-aid or cochlear-implant
    benefit was established by the consumed clinical sources, so those interventions are not asserted as evidence-backed treatments.

    '

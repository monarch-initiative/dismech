  summary: 'Create: Congenital Myasthenic Syndrome 6 (CMS6, CHAT-CMS)'
  details: |
    Created a new dedicated Disease entry for Congenital Myasthenic Syndrome 6 (MONDO:0009689, OMIM:254210), the CHAT-related presynaptic congenital myasthenic syndrome with episodic apnea, distinct from the umbrella Congenital_Myasthenic_Syndrome.yaml entry which only models the presynaptic subtype generically. Curated a three-node pathophysiology chain (CHAT catalytic deficiency -> use-dependent failure of ACh resynthesis/vesicular repackaging -> impaired NMJ transmission) plus phenotypes, genetics (CHAT, hgnc:1912, autosomal recessive), and treatments (acetylcholinesterase inhibitors first-line, amifampridine and salbutamol adjuncts, mechanical ventilation, genetic counseling), sourced initially from the founding Ohno et al. 2001 PNAS report (PMID:11172068) and four other primary-literature PMIDs found via targeted PubMed search. Deep research was performed via the Edison (Falcon) provider (just research-disorder falcon), per explicit user request to use their Edison API key; the run initially failed authentication (403 from api.platform.edisonscientific.com, confirmed via direct curl to be a genuine auth rejection and not a proxy issue) and was retried successfully after the user refreshed the key. The Falcon report surfaced a 2024 case series (Murtazina et al., PMID:38304750) describing a previously under-recognized mild, non-apneic, exercise-intolerance-only CMS6 phenotype and literature-aggregated phenotype frequencies (n=42 historical cohort), which were incorporated: frequency annotations on existing phenotypes, three new phenotypes (Proximal Muscle Weakness, Exercise Intolerance, Cold-Induced Muscle Weakness/Cold paresis HP:0031372 as a CHAT-CMS-distinctive diagnostic clue), an amifampridine safety caveat (severe adverse reaction in one patient), and a new salbutamol adjunct treatment entry. Animal-model findings from the Falcon report (mouse/zebrafish/dog CHAT models, cited to PMID:37212067) were intentionally omitted since that review is cached abstract-only in references_cache and the specific claims could not be verified against an exact quotable source. Validated with just validate (schema/term/reference checks all passed), just compliance (94.8% global / 95.7% weighted compliance), and uv run pytest tests/test_data.py (1656 tests passed, 0 failed).

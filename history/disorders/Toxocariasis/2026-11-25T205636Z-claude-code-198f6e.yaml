  summary: 'Create: Toxocariasis'
  details: |
    De novo curation of MONDO:0005988 (toxocariasis / visceral-ocular-neuro larva migrans). claude_code deep research (37/37 refs verified, 0% confabulation). Anchored to the clinical entity (claim #18931 was on species term MONDO:0024893; both stubs deleted). Toxocara canis (NCBITaxon:6265) and T. cati (NCBITaxon:6266) bound as agents; dog/cat definitive hosts, human paratenic dead-end, faecal-oral transmission, soil egg reservoir (PMID:30142562). Mechanism: ingested embryonated eggs -> intestinal hatching and portal/systemic migration -> arrested somatic migration with persistent TES antigen release -> type 2 eosinophilic response (conforms_to helminth_larval_migration_type2_response#Type 2 Immune Response, module PR #18938) -> eosinophilic granulomatous tissue injury branching to VLM (fever, hepatic, eosinophilia), ocular toxocariasis (retinal granuloma/tractional detachment, PMID:33273717), neurotoxocariasis (encephalitis, PMID:27084369) and epidemiological asthma (PMID:29573999) and epilepsy (PMID:30028858) associations. Global seroprevalence 19% (PMID:31856156); albendazole first-line (PMID:35208697). Human Th2/IgE polarisation inferred from mouse; asthma/epilepsy stated as association. All gates pass.

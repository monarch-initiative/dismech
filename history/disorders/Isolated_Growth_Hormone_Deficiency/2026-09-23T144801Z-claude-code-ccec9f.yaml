  summary: Retype BTK genetic record from RISK_FACTOR to UNKNOWN
  details: |
    The BTK genetic record was typed RISK_FACTOR, but its own association text and the Type III knowledge gap say BTK coding sequence and protein were normal in the founding XLA/GHD kindred (PMID:7650402) and a contiguous deletion was excluded in three further patients (PMID:7959728). No BTK variant has been shown to raise GHD risk, so RISK_FACTOR asserted more than the sources do. Retyped to UNKNOWN, and the three prose passages that named RISK_FACTOR were updated to match. Prompted by the #11999 fix: once graph.py reads genetic_context.gene, a RISK_FACTOR record would have inferred a contributes_to edge from BTK to the BTK-Region Xq21.3-q22 Genetic Lesion node, which is the causal link this entry argues against. UNKNOWN is a non-contributing relationship_type, so no edge is inferred and the record leaves the mechanism_outlink denominator.

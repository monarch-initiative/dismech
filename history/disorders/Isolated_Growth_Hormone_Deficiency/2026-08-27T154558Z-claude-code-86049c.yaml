  summary: 'Create: Isolated Growth Hormone Deficiency'
  details: |
    Created the root umbrella entry for isolated congenital growth hormone deficiency (MONDO:0000050), modeling four Mendelian molecular-cause subtypes via has_subtypes: type IA (pointer-only cross-reference to the existing kb/disorders/Isolated_Growth_Hormone_Deficiency_Type_IA.yaml, not duplicated), type IB (GHRHR or, rarely, GH1 loss-of-function; low but detectable GH), type II (autosomal dominant GH1 intron-3 splice/splicing-enhancer variant producing a dominant-negative 17.5-kDa GH isoform, modeled with functional_impact_category: DOMINANT_NEGATIVE on the variant GeneticContext, not modifier), and type III (X-linked; BTK-region Xq21.3-q22 or SOX3 dosage at Xq26-27). Type II pathophysiology is the mechanistically richest arm: GH1 splice variant -> exon 3 skipping and 17.5-kDa dominant-negative isoform production -> two parallel consequence nodes (disruption of GH secretory granules; ER stress/UPR-driven somatotroph apoptosis) -> anterior pituitary somatotroph loss (MODEL_ORGANISM evidence, flagged with a HUMAN_MODEL_MISMATCH discussion) -> shared 'Insufficient Circulating Growth Hormone' central effector. Type III genetics deliberately does not just repeat MONDO's RO:0004003 BTK relationship: two molecular papers on the founding XLA/GHD kindred argue against BTK itself as the GHD-causing gene (normal BTK mRNA/protein/sequence; contiguous deletion excluded in three further patients), so BTK is curated as RISK_FACTOR (not CAUSATIVE) with an INDIRECT_UNKNOWN_INTERMEDIATES causal edge and an open KNOWLEDGE_GAP discussion. Deep research was run via just research-disorder falcon Isolated_Growth_Hormone_Deficiency (research/Isolated_Growth_Hormone_Deficiency-deep-research-falcon.md); its own reference_validation reported 11/12 identifiers resolved (one DOI, 10.17458/per.vol16.2018.dd.geneticmutationsghigf, unresolved and NOT used in this entry) and needs_review: true (only 5/11 on-topic, rest undecided). Every PMID/DOI actually cited here (PMID:17965963, 12207163, 9432120, 9814493, 17073157, 12720086, 23736291, 7650402, 7959728, 15800844, and DOI:10.3390/endocrines5030025) was independently found via direct PubMed E-utilities / Crossref search and fetched with just fetch-reference, not taken on trust from the falcon narrative. just preflight-dr research/Isolated_Growth_Hormone_Deficiency-deep-research-falcon.md MONDO:0000050 returned SKIP (MONDO records no single causal gene for this umbrella term, so the automated gene-frequency check cannot discriminate); manual OMIM/synonym/gene check against the MONDO:0000050 OBO record (via runoak) found no Named Entity Confusion signal. GeneReviews baseline checked via PubMed, not found (same false-positive pattern as the Type IA sibling entry). Orphanet structured-source refresh (just refresh-orphadata) failed with a checksum mismatch against the pinned manifest, unrelated upstream drift, not remediated here; prevalence (birth prevalence 1:4,000-1:10,000, all IGHD types combined) is instead sourced from PMID:12207163 and independently corroborated by DOI:10.3390/endocrines5030025 (Ibba et al. 2024). Validation: just validate, just count-verified-snippets (37/37 non-skipped snippets verified; 2 DOI-prefixed evidence items skipped by prefix per conf/reference_validator_config.yaml and are supplementary to PMID-backed primary evidence on the same claims), just validate-terms, and just validate-disorders (the full batched CI-equivalent sweep) all passed. just check-duplicate-keys and just check-folded-hyphens passed across the whole KB.

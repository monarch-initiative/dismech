  summary: 'Address PR review: fix evidence grading, add diagnosis/biochemical/trials'
  details: |
    Addressed CHANGES_REQUESTED review on PR 9693. CRITICAL: fixed the check-snippet-grading CI failure - PMID:12720086's isoform-production quote was graded HUMAN_CLINICAL at one pathophysiology node and IN_VITRO at another for the identical sentence describing GC cells and transgenic mice; both nodes now grade IN_VITRO, with the snippet trimmed to the GC-cell clause (the mouse-specific claim is evidenced separately, MODEL_ORGANISM, on the existing Anterior Pituitary Somatotroph Loss node). Also regraded the same paper's dual-splicing-enhancers quote from HUMAN_CLINICAL to IN_VITRO (an in-vitro splicing-reporter finding). Fixed two evidence/claim mismatches flagged by the reviewer: the Loss of Growth Hormone Receptor Signalling node was evidenced by a prevalence sentence (1:4,000-1:10,000) that says nothing about receptor signalling - replaced with PMID:9814493's IGF-1/IGFBP-3 quote, the correct direct readout of that node's claim; the Delayed Skeletal Maturation phenotype was evidenced by a four-Mendelian-disorders classification sentence that says nothing about bone age - replaced with PMID:36960394 (a 2023 GHRHR founder-mutation paper) which explicitly states delayed bone age, with an honest caveat that it is IGHD type IV (out of this entry's declared scope) rather than a type IB/II/III-specific source, since no cached type IB/II/III literature supplied a quotable bone-age sentence despite MONDO's own def: text asserting one for type IB. Investigated and documented the GHRHR/type-IB-vs-type-IV classification tension the reviewer raised (confirmed via runoak against MONDO:0013006 and MONDO:0032567): MONDO:0013006's def: text and 'dwarfism of Sindh' synonym support GHRHR under type IB per the source issue's explicit instruction, while MONDO separately maintains MONDO:0032567/OMIM:618157 with its own RO:0004003 GHRHR relationship, and PMID:36960394 (2023) assigns GHRHR to type IV instead - a genuine unresolved field/OMIM/MONDO ambiguity, not a simple error, documented at length in notes: rather than silently resolved either way. Addressed the content-completeness findings: added biochemical: (IGF-1, IGFBP-3) and diagnosis: (GH stimulation testing, cross-country cutoff/priming heterogeneity, height/IGF-1/bone-age adjuncts) sections sourced from PMID:31707392 (a 2019 international GHD-diagnostics guideline audit) and the already-cited PMID:9814493; added four new phenotypes (Anterior Pituitary Hypoplasia, Neonatal Hypoglycemia, Prolonged Neonatal Jaundice, Micropenis) sourced from PMID:9802480, a human MRI series that explicitly separates isolated GHD from combined pituitary hormone deficiency and states these features occur equally in both, rather than a mixed-cohort proxy; added a long-acting weekly GH replacement treatment entry (somatrogon/somapacitan/lonapegsomatropin, verified NCIT terms) and a clinical_trials: section with all five NCT IDs the reviewer named, each independently verified as real and on-topic via just fetch-reference and the ClinicalTrials.gov API (status/phase confirmed programmatically, not asserted). Deleted the two now-curated stub files (stubs/Isolated_Congenital_Growth_Hormone_Deficiency.yaml for MONDO:0000050, stubs/Isolated_Growth_Hormone_Deficiency_Type_III.yaml for MONDO:0010615, confirmed as a genuine subtype-of-parent relationship via mondo_parents/mondo_descendants in the stub files themselves, not a guess). Left the ~9 uncited DOI reference caches in references_cache/ uncited but committed, per the reviewer's own suggestion that this is acceptable (harmless derived artifacts; DOI is in skip_prefixes so they were never machine-verified snippet sources regardless). Re-ran the full gate list after all fixes: just validate, just count-verified-snippets, just validate-terms, just validate-disorders, just check-duplicate-keys, just check-snippet-grading, just check-snippet-length, just check-folded-hyphens, just check-title-snippets, just check-entity-refs, just check-environmental-evidence - all passed; outputs read and reported verbatim in the PR comment, not merely re-invoked.

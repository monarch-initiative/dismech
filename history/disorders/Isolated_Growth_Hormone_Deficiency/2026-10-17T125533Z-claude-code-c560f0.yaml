  summary: Bind the stimulus-unqualified growth hormone challenge code plus the IGF-1
    and IGFBP-3 markers
  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:51434-9 (somatotropin pre or post unspecified challenge) as the measurement of the growth hormone provocative testing row, and LOINC:2484-4 and LOINC:2483-6 as the loinc_terms of the IGF-1 and IGFBP-3 markers, which this entry describes as the first-line screening pair before formal stimulation testing. The stimulus-unqualified code was chosen because the row names seven alternative stimuli and states that the preferred test and its cutoff differ by country: LOINC 2.83 carries stimulus-specific somatotropin panels one per stimulus, for insulin, arginine, glucagon, glucose and macimorelin, and none for GHRH, L-dopa or clonidine, so no panel covers the row. Two further unqualified somatotropin challenge codes were declined because the release marks them discouraged. The KG's somatotropin records were paginated in full, 371 of 371, and hold exactly one Part, LOINC:LP14695-8, the unqualified component, which would drop the stimulation that distinguishes this test from a random growth hormone level. Component Parts for IGF-1 and IGFBP-3 exist too, LOINC:LP15669-2 and LOINC:LP15668-4, and are recorded rather than bound because the Biochemical slot names the measurement that quantifies the marker and a component Part carries neither unit nor specimen. No reference ranges were added: the stimulation cutoff differs by country, and the age-specific IGF intervals are population reference data rather than a threshold this disease owns.

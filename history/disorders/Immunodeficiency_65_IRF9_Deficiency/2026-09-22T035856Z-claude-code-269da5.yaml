  details: |
    Follow-on to the CD16_Deficiency reversal in the same review round on PR #12473. Now that CD16 Deficiency also carries GENETICS_ENVIRONMENT_DISEASE, this entry's Part note names it alongside STAT2 Deficiency and states the principle the three placements share: the Part records the disorder's nosological kind rather than grading how settled its gene-disease relationship is, which is why CD16 carries the tag despite a DISPUTED relationship_type. The note is careful not to call CD16 an ISGF3 defect, which it is not. No classification_value or evidence changed. Validated with just validate (25/25 snippets), check-enum-values, check-duplicate-keys and check-folded-hyphens.

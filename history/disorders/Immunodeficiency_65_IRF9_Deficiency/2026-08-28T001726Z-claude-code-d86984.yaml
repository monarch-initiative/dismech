  summary: 'Review round 1: address ai4c-reviewer findings'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 9779. Item 1, the unsourced live-vaccine claim: searched PubMed for a source attributing disseminated live-attenuated vaccine disease to IRF9 deficiency and found none, and the one full-text source available reports the index patient receiving annual influenza vaccination without incident. The clause was therefore dropped from the description rather than evidenced, which is the honest outcome; the reviewer offered both options and the evidence supported only one. Item 2, treatments: added monoclonal antibody neutralisation of SARS-CoV-2 with casirivimab and imdevimab from PMID:34702736, the one published treatment success specific to this genotype and mechanistically the point since passive neutralisation bypasses ISGF3 entirely, plus prophylactic immunoglobulin replacement graded PARTIAL because the source attributes the improvement to immunoglobulin and annual influenza vaccination together. Item 3, diagnosis: added the ISGF3 versus GAF complex formation assay using the snippet already cached. Item 4, genetics: added the c.991G>A variant with clinical_significance PATHOGENIC and its loss-of-function evidence, functional_impact_category LOSS_OF_FUNCTION on the causal pathophysiology node, and the second kindred's c.577+1G>T recorded in notes rather than as an unsourced structured claim. Item 5, node bundling: split Interferon-Gamma-Like Late Transcriptional Output and Hyperinflammation into a CELLULAR transcriptional-switch node and an ORGANISM hyperinflammation node downstream, which puts the likely contributes hedge on the edge between them rather than on the observation. Item 6, pathograph connectivity: added downstream edges from the pneumonitis and hyperinflammation nodes to their phenotypes. Adopted the reviewer's GO:0060339 suggestion, binding negative regulation of type I interferon-mediated signaling pathway with DECREASED to state that the brake fails directly, which is better than defending two opposite modifiers on GO:0060337 in prose. Also added a prevalence record with CASES_IN_LITERATURE and NOT_YET_DOCUMENTED to make the denominator structured, the p48 knockout mouse as an animal model with a PARTIALLY_RECAPITULATES link and a limitation recording that the mouse impairs type II interferon responses while the human defect is selective, a HUMAN_MODEL_MISMATCH discussion on that divergence, removal of the Primary Immunodeficiency parent used by no other file, and a regrade of the type III interferon synthesis conclusion from HUMAN_CLINICAL to OTHER. Snippets now 24 of 24 verified.

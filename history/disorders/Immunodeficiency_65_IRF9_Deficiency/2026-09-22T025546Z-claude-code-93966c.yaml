  summary: Add GENETICS_ENVIRONMENT_DISEASE Harrison's Part tag (#11879 item 4)
  details: |
    Item 4 of #11879 flagged that IRF9 Deficiency's harrisons_chapter block was equally new and equally Mendelian to STAT2 Deficiency (the sibling ISGF3-axis entry) but lacked STAT2's GENETICS_ENVIRONMENT_DISEASE tag. This item was blocked pending PR #11810's merge, which has since landed. Confirmed IRF9's genetic.relationship_type is CAUSATIVE (biallelic loss-of-function, autosomal recessive), matching STAT2's causal certainty exactly, so added the same GENETICS_ENVIRONMENT_DISEASE classification_value with notes mirroring STAT2's phrasing. Validated with just validate-disorders.

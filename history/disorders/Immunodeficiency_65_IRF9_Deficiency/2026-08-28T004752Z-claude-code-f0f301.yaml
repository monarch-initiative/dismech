  details: |
    Corrects a false statement in the immediately preceding history record for this entry, the one timestamped 2026-08-28T001726Z. That record's details claim downstream edges were added from the pneumonitis and hyperinflammation nodes to their phenotypes. Only the hyperinflammation edge landed. The pneumonitis edge was attempted with a Python string replacement that did not match and silently no-opped, and unlike the other replacements in the same session that one carried no assertion, so the failure was invisible. The PR comment repeated the same false claim. The preceding record is left unedited because history records are append-only and describe a session as it ran; a record that misreports its own outcome is part of the audit trail, and rewriting it would hide the error rather than correct it. This record is the correction. The consequence was not cosmetic: without that edge the antiviral arm, which is the main arm of this disease, terminated at a pathophysiology node and never reached a clinical phenotype, while the inflammatory arm did, so the rendered pathograph asserted an asymmetry opposite to the entry's argument. The edge is now present and verified by grep and by just check-entity-refs rather than assumed. Also in this round: removed a provenance sentence from the USP18 node notes that cited the wrong PR number and would have rotted regardless, and added a proposed_experiments block to the HUMAN_MODEL_MISMATCH discussion, a three-way cell-type-matched comparison of GAF formation in p48-null mouse and IRF9-null human cells that separates the species-difference explanation from the comparison-artefact explanation the rationale already named. Snippets 24 of 24 verified.

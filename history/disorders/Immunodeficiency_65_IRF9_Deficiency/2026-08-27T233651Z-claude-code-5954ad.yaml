  summary: 'Create: Immunodeficiency 65 (IRF9 Deficiency)'
  details: |
    New Disease entry for MONDO:0032848, curated from a claude_code deep-research report at research/Immunodeficiency_65_IRF9_Deficiency-deep-research-claude_code.md. The report resolved 8 of 8 references with confabulation_rate 0.0, but only 4 of 8 scored on topic and 8 references is a thin base, so every claim in this entry was anchored to a primary paper read from the reference cache rather than taken from the report narrative. The report also gave the causal gene as HGNC:6398; that CURIE is KPNA5. The entry uses hgnc:6131, verified by OAK, and records the correction in the genetic block notes so it is not silently repeated. Pathophysiology is a seven-node chain with two arms from one lesion: an antiviral arm running biallelic IRF9 loss to failed ISGF3 assembly to narrowed ISG induction to uncontrolled respiratory virus replication to severe pneumonitis, and an inflammatory arm running the same ISGF3 failure to loss of USP18 negative feedback to prolonged IFNAR signalling and an interferon-gamma-like late transcriptional output. The two arms sharing one upstream node is the point of the entry. No phenotype carries a frequency value: the published cohort is a handful of kindreds and per-phenotype frequencies cannot be computed from that denominator, which is stated in the top-level notes. One evidence item is graded PARTIAL because its source says likely contributes. A KNOWLEDGE_GAP discussion records why no separate type III interferon node was modelled, citing the IL10RB observation that isolated type III unresponsiveness produces no overt viral disease. Validated with just validate, just validate-terms, just count-verified-snippets at 14 of 14, just check-entity-refs and just check-duplicate-keys.

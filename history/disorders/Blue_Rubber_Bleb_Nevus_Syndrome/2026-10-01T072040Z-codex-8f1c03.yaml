  summary: Review BRBNS mechanism, mosaic genetics, clinical spectrum, and care evidence
  details: |
    Reviewed the entire entry and scientific OpenScientist report against generated reference caches, primary full texts where retrieved, and the TEK-related venous-malformations GeneReviews chapter. Separated direct BRBN double-allele results from L914F/R849W models; split PDGFB and mural-cell effects; scoped causal edges and treatments. Corrected inheritance, unsupported prevalence and PIK3CA biomarker claims. Expanded organ findings, mosaic testing, gastrointestinal evaluation, surgery, sirolimus variability and surveillance. Distinguished established-lesion regression from 2026 preimplantation cell pretreatment. Familial CNS reports and emerging therapy remain explicit knowledge gaps. Live registry checks on 2026-10-01 distinguish BRBN eligibility from broad or historical diagnostic keywords. Completeness: phenotypes, genetics, mechanisms, diagnosis, care/trials and references adequate; no established subtypes omitted. Primary papers 15729077 and 26637981 retained abstract evidence after multiple full-text access failures; CAPTCHA pages excluded. All 107 quotations and 130 titles validate, as do ontology/schema and graph/evidence gates. Source grading and MRI quotation-length findings repaired before final validation.

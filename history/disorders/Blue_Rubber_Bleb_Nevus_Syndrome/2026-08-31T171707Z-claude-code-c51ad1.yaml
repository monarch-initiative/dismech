  summary: 'Create: Blue Rubber Bleb Nevus Syndrome MONDO:0007203'
  details: |
    Curated from an OpenScientist deep-research report (10 iterations, 83 papers, 54 distinct PMIDs). All cited PMIDs independently re-fetched and every reference_title read from the cache frontmatter. All 29 snippets verified as exact substrings. Every ontology CURIE was resolved against the local OAK databases and its label read back before use. Notably all fifteen CURIEs the research report suggested resolved correctly this time, a better rate than the two preceding reports; the errors caught were instead in the curator's own choices, and in schema drift. HP:0001428 Somatic mutation is obsolete and was replaced with HP:0001442 Typified by somatic mosaicism. The supports enum no longer accepts PARTIAL, so the phase II vascular anomaly trial item is graded SUPPORT with the partial-response caveat stated in its explanation instead. Two snippets had been written as paper titles rather than sentences and were replaced with real abstract sentences. One reference_title was written singular where the cached title is plural. The pathograph runs as a single chain from somatic TEK double cis mutation through ligand-independent TIE2 activation and PI3K-AKT-mTOR to two parallel consequences, suppressed endothelial apoptosis and PDGFB downregulation with mural cell deficiency, converging on ectatic mural-cell-poor venous channels and chronic gastrointestinal blood loss. HPO has no venous malformation term, so the cutaneous phenotype binds HP:0025015 Abnormal vascular morphology with a more specific preferred_term; HP:0100814 Blue nevus was rejected as melanocytic despite matching the eponym.

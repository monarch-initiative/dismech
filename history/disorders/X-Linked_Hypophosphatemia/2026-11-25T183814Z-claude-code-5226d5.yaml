  summary: 'Gene-family review: PHEX and FGF23'
  details: |
    Direction confirmed: XLH is PHEX loss of function with FGF23 excess. The PHEX trigger node carried the gene with no molecular function and no variant origin; it now binds metalloendopeptidase activity (GO:0004222) as decreased, PHEX being a member of the neutral endopeptidase family whose inactivating variants cause XLH (PMID:11062477), and records germline origin. The node for excess bone-derived FGF23 signaling now names FGF23 and binds hormone activity (GO:0005179) as increased, matching its evidence that XLH is characterized by increased FGF23 synthesis (PMID:39814982, PMID:29947083); XLH previously did not name FGF23 anywhere. The PHEX record now carries the ClinGen Tubulopathy GCEP Definitive (X-linked) tier it already cited (CGGV:assertion_7b966545-e9dc-4a75-8d6a-91b328bc4854-2025-05-15T060000.000Z) and a record-level X-linked dominant inheritance block (GeneReviews PMID:22319799).

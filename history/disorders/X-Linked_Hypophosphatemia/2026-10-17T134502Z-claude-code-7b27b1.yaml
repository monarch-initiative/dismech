  summary: Record that TmP/GFR has no LOINC code and why the fractional-excretion
    complement must not be substituted
  details: |
    LOINC Diagnostics tranche G, batch 28, the closing batch. Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows. Every KG query was paginated to its stated total. Validation for the whole batch: just validate-disorders over the five changed files reported 744 snippets and 793 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Nothing is bound on the TmP/GFR and renal phosphate wasting marker. The renal phosphate threshold has no LOINC code: neither the release table nor the KG returns a record for TmP or for a tubular reabsorption of phosphate. The nearest codes must not be substituted. The two fractional excretion of phosphate codes, LOINC:50057-9 and LOINC:56925-1, measure the excreted fraction, which moves in the opposite direction from the reabsorption this record reports, so the same patient reads high on one scale and low on the other; the two phosphate renal clearance codes, LOINC:2776-3 and LOINC:50058-7, are a volume rate, a third quantity. This is the second instance of the gap first recorded in Hyperphosphatemic_Familial_Tumoral_Calcinosis, where the direction runs the other way and a worked figure of 96 per cent against a scale reading 4 makes the error concrete; recording it here establishes that the gap is the quantity's and not one entry's. No reference range was added: the row itself notes that interpretation needs age-adjusted reference values, and there is no code to key an interval to in any case.

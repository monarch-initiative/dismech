  summary: 'Create: Thiopurine S-methyltransferase Deficiency'
  details: |
    De-novo curation. Pathograph: TPMT loss-of-function variant -> impaired thiopurine S-methylation -> 6-thioguanine nucleotide accumulation -> haematopoietic progenitor cytotoxicity -> bone marrow suppression -> multilineage cytopenias. Conforms to three myelosuppression module nodes.

    Curation decisions worth recording:
    - The pathograph below the methylation node is explicitly exposure-conditioned. A TPMT-deficient person who never receives a thiopurine has no disease, and notes state this so the cytopenia nodes are not read as spontaneous features of the genotype.
    - NUDT15 deficiency is deliberately NOT folded into this entry despite a clinically indistinguishable phenotype and joint CPIC dosing recommendations: different enzyme, different step, and opposite ancestry distributions.
    - Inheritance is autosomal codominant, which HPO has no term for. HP:0000006 is bound with the reasoning stated in the inheritance description rather than silently; the heterozygote is not a silent carrier.
    - A KNOWLEDGE_GAP records that only 27 percent of patients with thiopurine myelosuppression carried any TPMT variant in the cited cohort, with 73 percent having none. TPMT deficiency is a well-understood mechanism for a minority of a common toxicity, not the explanation for it.
    - Pre-prescription genotyping carries no target_mechanisms link, per the schema comment that screening and diagnostic actions must not link to pathophysiology nodes; the link sits on the therapeutic dose-reduction entry.

    Validation: schema, ontology-term and reference validation all run via `just validate` on each file. Every PMID was fetched with `just fetch-reference` and each evidence snippet verified as an exact substring of the cached abstract; no snippet was written from memory. Snippet count for this entry: 30/30 verified. The stub for this disease is deleted in the same change, and this PR carries only this disease's files: the entry, its history record, its five cited reference-cache files, and the seven ontology-term cache rows this entry introduced (CHEBI:50667, MONDO:0012503, GO:0008119, hgnc:12014 and their enum-membership rows).

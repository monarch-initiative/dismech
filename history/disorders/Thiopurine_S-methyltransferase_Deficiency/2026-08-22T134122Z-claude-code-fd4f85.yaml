  details: |
    Addressed the ai4c-reviewer re-review of 07b03c3a.

    Finding 3 (no diagnosis section) - ACCEPTED and fixed. Moved
    "Pre-Prescription TPMT Genotyping or Activity Testing" out of treatments: into a
    new diagnosis: section. treatment_term became diagnosis_term, which is the same
    TreatmentDescriptor range, so the NCIT:C15709 Genetic Testing binding carries over
    unchanged. therapeutic_modality: OTHER was dropped because the Diagnosis class has
    no such slot, which is itself evidence the entry was in the wrong section. Added
    markers pointing at the existing Erythrocyte TPMT activity biochemical marker, a
    results statement, and a paragraph making explicit that this identifies a
    metabolizer phenotype while a separate decision sets the dose.

    Finding 2, NUDT15 bullet - ACCEPTED in part. The scope claim was already made in
    the notes and in the KNOWLEDGE_GAP rationale, but with no citable snippet behind
    it. Added the CPIC sentence stating that NUDT15 explains the majority of severe
    thiopurine-related myelosuppression in patients of Asian descent, as a second
    evidence item on the new diagnosis entry, where it does the most work: it is the
    reason a TPMT-only test is incomplete.

    Finding 2, prevalence bullet - DISPUTED on its premise, conceded on substance.
    The claim "there is no prevalence: section at all" is not correct; the entry has
    carried a prevalence: block since the first commit, with two structured records
    (German-Caucasian blood donors 0.6%, US survey 0.3%), both cited and
    snippet-verified. The CPIC 0.19% figure is nonetheless a worthwhile addition and
    has been added as a third record, with notes explaining why it is lower than the
    two single-cohort surveys - it is a pooled frequency-table estimate, not a
    contradiction.

    Finding 2, compound TPMT+NUDT15 bullet - NOT actioned. Already covered: the
    treatments block cites "including for individuals with variants in both genes"
    and names the joint recommendation.

    Finding 4 (no deep-research artifact) - NOT addressed, remains open. Needs a
    deep-research provider run, outside this automated pass.

    Validation: just validate passes (schema, terms, references); 35/35 snippets
    verified, up from 33/33; check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets clean. check-environmental-evidence is
    clean against the PR merge-base but reported five phantom findings against current
    origin/main, which is branch staleness, so the branch was refreshed from main in
    this push.

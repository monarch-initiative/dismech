  summary: 'LOINC: bind TPMT activity and genotyping codes'
  details: |
    Bound LOINC:91141-2 (TPMT activity in RBC by production of 6-MMP) to the Erythrocyte TPMT activity biochemical record, and both LOINC:36922-3 (TPMT gene targeted mutation analysis) and LOINC:91141-2 to the Pre-Prescription TPMT Genotyping or Activity Testing diagnosis row's measurements, as part of dismech LOINC Diagnostics tranche H (pharmacogenomic tests). The enzyme IS the disease here, so the activity assay and genotyping are both the entry's own diagnostic tests, not a modifier for a different disease. LOINC has no method-less TPMT activity code, only three metabolite-specific variants (6-MMP, 6-MMP riboside, 6-MTG riboside); neither cited source specifies which was used, so the 6-MMP variant was chosen as the narrowest available option, not a sourced match. Deliberately bound the TPMT-only targeted mutation analysis code rather than the joint LOINC:93193-1 'TPMT gene and NUDT15 gene' panel: this entry's own text states NUDT15 deficiency is a separate entity not curated here, so the joint panel would assert testing this entry does not claim. The row names two distinct assay routes (genotyping and activity testing), so both got separate measurements entries rather than one code with a caveat. All labels verified against the Monarch KG entity API in the same step they were written. Confirmed both CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

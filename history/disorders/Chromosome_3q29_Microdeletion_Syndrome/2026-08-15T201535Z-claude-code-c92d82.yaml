  summary: 'Create: Chromosome 3q29 Microdeletion Syndrome (MONDO:0012269)'
  details: |
    De novo curation of chromosome 3q29 microdeletion syndrome (3q29 deletion syndrome / 3q29 recurrent deletion).

    Deep research: claude_code provider via `just research-disorder claude_code Chromosome_3q29_Microdeletion_Syndrome`. The report shipped its own reference-validation frontmatter: 25/25 references resolved, 0 unresolved, confabulation_rate 0.0, 2/2 quoted claims valid.

    NEC check: MONDO:0012269 is a contiguous-gene deletion syndrome with no single causal gene, so `just preflight-dr` would return SKIP. Manual identity check instead: the report's locus (chr3:195998129-197623129, GRCh38, ~1.6 Mb, ~21 protein-coding genes) and OMIM #609425 match the MONDO record and the GeneReviews chapter. The nearest confusable entity is the reciprocal 3q29 microduplication (OMIM #611936), which the report distinguishes explicitly and which this entry records as a differential rather than a subtype.

    GeneReviews baseline: PMID:27656750 (3q29 Recurrent Deletion) was fetched, used as the phenotype and management baseline, and tagged GeneReviews in the top-level references block. Its Clinical Characteristics, Diagnosis, Management and Genetic Counseling sections are all quoted in the entry.

    Four wrong ontology identifiers in the report were caught against the local term caches and not used: hgnc:2905 for DLG1 (correct hgnc:2900, confirmed against genenames.org), hgnc:7647 for NCBP2 (correct hgnc:7659), HP:0002571 offered for retrocerebellar cyst (that identifier is Achalasia), and HP:0031466 offered as an approximation for executive-function deficits (left unbound; curated in prose instead). None of these would have been caught by the report's own reference validation, which checks citations only.

    Curated content: a six-node pathophysiology chain from NAHR at the flanking low-copy repeats through combinatorial haploinsufficiency across the interval to three parallel consequences (mitochondrial/energy-metabolism dysregulation, cortical excitation-inhibition imbalance, posterior fossa and cerebellar maldevelopment) converging on the neurodevelopmental and neuropsychiatric phenotype. The entry deliberately does not nominate a driver gene, because single-gene knockouts of the leading candidates do not reproduce the syndrome; the genetic block binds DLG1 nominally with an explicit note saying so, and records PAK2 as COOPERATING and NCBP2 as MODIFIER.

    Also curated: 14 phenotypes with HPO bindings and cohort-derived frequency bands; two diagnosis entries including the recommendation that behavioural evaluation not be gated on IQ; two imaging findings recording the dissociation between cerebellar volumetrics (which predict function) and cystic malformations (which do not); five treatments; two differential diagnoses; three animal models and one experimental model (isogenic CRISPR cortical organoids) all with modeled_mechanisms, fidelity and limitations; and two discussions -- a KNOWLEDGE_GAP on driver-gene attribution and a HUMAN_MODEL_MISMATCH on whether antipsychotic-reversible prepulse inhibition in mouse informs human psychosis risk.

    Validation: `just validate` passed (schema, terms, references). `just count-verified-snippets` reported 63/63 verified against cached references. check_snippet_length, check_title_snippets and check_folded_hyphens all clean against origin/main. Compliance 89.6% (weighted 90.1%). No datasets block: relevance triage was not performed, and it would be particularly error-prone at this locus since the interval's gene names retrieve large volumes of unrelated cell-biology data.

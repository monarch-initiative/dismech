  details: |
    Third review-response session for PR #8564, addressing the single remaining blocking item plus the non-blocking snippet suggestions.

    Blocking item: the Global Developmental Delay phenotype asserted frequency VERY_FREQUENT (80-99%) while its own description said "roughly 70-90%", and neither cited snippet mentioned developmental delay at all. Both halves of the reviewer's objection were correct. The 70-90% figure came from the deep-research report and is not quotable from any reference cited in this entry: the GeneReviews abstract names delay only inside "speech delays", and the deep-phenotyping cohort reports intellectual disability, autism, executive-function and graphomotor figures without a separate delay rate. The frequency slot is therefore dropped rather than re-banded, matching how Cerebellar Hypoplasia is already handled in the same file, with the description stating why and retaining the deep-research estimate as prose. Evidence was replaced with DOI:10.3389/frcha.2026.1823061, whose abstract names developmental delay explicitly as a characteristic manifestation, and the GeneReviews item was re-typed to PARTIAL because its list names intellectual disability and specific cognitive deficits rather than global developmental delay as such.

    Non-blocking suggestions taken: quantitative snippets from the cached PMID:33564151 full text now support the ocular, dental and otitis-media bands. One implementation detail worth recording. The sentences carrying the 59%, 28% and 22% figures contain U+2009 thin-space characters inside their sample-size parentheticals ("n<thin space>=<thin space>19"). A snippet including those would validate today but is fragile: the characters are invisible in an editor, so any future reflow or retyping silently breaks the match. The quoted spans were therefore chosen to stop short of the parentheticals, and the percentages are given in the description instead, with that reasoning stated inline in the entry.

    Not taken, as before: component HP terms under Mild Facial Dysmorphism, and seizure/sleep/enuresis phenotypes. These remain optional and were below the reviewer's blocking threshold.

    Validation: `just validate-disorders` passed. `just count-verified-snippets` reported 84/88 verified, with 4 skipped by prefix (all DOI: references, excluded by skip_prefixes; read by hand). check_snippet_length, check_title_snippets and check_folded_hyphens all clean against origin/main.

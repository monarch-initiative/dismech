  summary: 'Address PR #8564 review: fix claim-evidence mismatch, add phenotypes,
    consume cached refs'
  details: |
    Review-response session for PR #8564. The automated reviewer returned CHANGES_REQUESTED with six IMPORTANT findings. All six are addressed.

    1. Claim-evidence mismatch (self-inflicted, and the reviewer was right). The GeneReviews snippet on the Congenital Heart Defect phenotype had been truncated before "patent ductus arteriosus" while its explanation claimed the snippet identified PDA. The truncation was itself a workaround: the abstract contains "gastroesophageal reflux disease [GERD]" and the validator's normalization strips the bracketed token, so the full sentence never matched as a substring. The fix is to quote the clause after the bracket instead -- "ocular issues, dental anomalies, and congenital heart defects (especially patent ductus arteriosus)." -- which matches exactly and does contain the claim. That clause now also serves the new ocular and dental phenotypes.

    2. Added the three GeneReviews phenotypes above 10% that were absent: ocular involvement (bound to HP:0000486 Strabismus), dental anomalies (HP:0000164), and recurrent otitis media (HP:0000388).

    3. Added Global Developmental Delay (HP:0001263, VERY_FREQUENT), which at 70-90% is the most frequent manifestation and was conspicuously missing.

    4. Added Executive Function Deficits (46%) and Graphomotor Weakness (78%) as full phenotype entries with descriptive names and no phenotype_term. The reviewer's distinction is correct: declining to bind a bad term justifies omitting the term, not the entry. PMID:39365000, previously cached and uncited, now supports the executive-function entry.

    5. Fixed three frequency/term mismatches where a class-level percentage was asserted on a child term. Gastrointestinal Symptoms re-bound to HP:0011024, Musculoskeletal Findings to HP:0033127, Congenital Heart Defect to HP:0001627, each with a description sentence stating why the umbrella level is the right one.

    6. Consumed the cached-but-uncited references. Now cited: PMID:26055425 (the primary meta-analytic source for the 41.1-fold schizophrenia risk, plus its own OR range caveat), PMID:20691406 (the original association report, PARTIAL because its estimate has been superseded), PMID:34131099 (human cortical network analysis, the human-tissue counterpart to the model-organism arm), DOI:10.1186/s11689-026-09696-y (driver-or-passenger review, on the KNOWLEDGE_GAP), PMID:38216835 (registry behavioral phenotypes), PMID:32874693 (microduplication, on the differential), PMID:32321479 (multiplex family, supplying an ascertainment-bias caveat on every frequency in the entry), and DOI:10.3389/frcha.2026.1823061 (early-onset psychosis case report). Two cache files were dropped: DOI:10.1126/sciadv.adh0558 duplicates the cited PMID:37585521, and PMID:33819264 is a two-hit study of the 16p12.1 deletion rather than this locus. PMID:29884173 is retained uncited as the study protocol for the cohort cited via PMID:33564151, with that noted in the entry.

    Suggestions also taken: the PAK2 explanation now says COOPERATING to match its relationship_type; the unsupported OCCASIONAL band on Cerebellar Hypoplasia was dropped rather than asserted from an unquotable figure; a Structured Multisystem Surveillance treatment entry now captures the GeneReviews schedule; and the references block was expanded.

    Validation after fixes: `just validate-disorders` passed. `just count-verified-snippets` reported 82/85 verified, with 3 skipped by prefix (all DOI: references, which conf/reference_validator_config.yaml excludes from snippet checking; those quotes were read against the cached records by hand). check_snippet_length, check_title_snippets and check_folded_hyphens all clean. Compliance rose from 89.6% to 91.9% (weighted 92.3%).

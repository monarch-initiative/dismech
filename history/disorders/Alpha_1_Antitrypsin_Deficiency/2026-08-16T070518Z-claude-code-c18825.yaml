  summary: Add Harrison's and mechanistic classifications
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter RESPIRATORY + GASTROINTESTINAL + GENETICS_ENVIRONMENT_DISEASE, and mechanistic_category 'proteotoxic disease' with a real evidence block quoting PMID:35868681, which attributes the liver disease to accumulation of mutant Z protein polymers. The notes scope the proteotoxic claim explicitly to the hepatic arm: the emphysema arm is a loss-of-function antiprotease deficiency, so the two arms of this disease have opposite mechanistic characters and a single unqualified mechanistic_category would misdescribe half the disease. Deliberately did NOT assign icimd_category: alpha-1 antitrypsin deficiency is a serpinopathy, not an inborn error of intermediary metabolism in the ICIMD sense, and there is no ICIMD group that fits without stretching. Validated with 'just validate' - schema, term and reference validation all passed, 91/91 snippets verified.

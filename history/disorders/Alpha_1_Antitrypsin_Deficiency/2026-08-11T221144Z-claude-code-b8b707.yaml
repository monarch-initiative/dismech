  details: |
    Backfill for issue #8085. The two exposures are routed to the two organ arms this entry models separately. Cigarette smoking is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES into alveolar tissue destruction: emphysema is alveolar destruction and the cited sentence names both the exposure and that outcome, the intervening step being the protease-antiprotease imbalance this entry models explicitly. Exacerbating rather than triggering, because the destruction proceeds from the inherited antiprotease deficiency and smoking accelerates it, which is the verb the source uses. Metabolic cofactors are EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES into hepatic stellate cell activation, with two limits stated in the link description rather than left in the grade: the measurement is liver stiffness, a proxy for the fibrosis this node drives rather than a measure of stellate activation, and the finding is specific to heterozygous Pi*MZ adults rather than to the classic homozygous disease this entry mostly models. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 90 of 90 verified.

    The old values were volume/issue/page/DOI fragments -- '2000 Aug;83(4):463-6. doi: 10.1054/bjoc.2000.1249.' -- written by scripts/backfill_deep_research_evidence.py, which sentence-split the plain-text PubMed cache body and took the first candidate over 40 characters that was not the title. In a PubMed record that is the citation line. Nothing was re-researched: each replacement is the next candidate sentence from the same already-cached reference, re-derived with the fixed extractor (PR #8105).


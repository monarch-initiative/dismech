  summary: 'Review round: MMDS4 (ISCA2) reviewer-requested additions'
  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES on PR #11131. Added reference_title to all 42 evidence items (copied verbatim from references_cache titles). Added a diagnosis section (molecular genetic testing, brain MRI, plasma/CSF glycine+lactate, respiratory-chain complex II/IV enzymology); no NCIT diagnosis_term bound because genetic-testing/MRI/lab-procedure NCIT terms are not reachable from the TreatmentActionTerm root NCIT:C25218, matching the existing diagnosis-block norm (Infantile_Liver_Failure_Syndrome_1). Wired the five orphaned phenotypes into the pathograph: complex-deficiency -> Optic atrophy (INDIRECT_UNKNOWN_INTERMEDIATES, directness INDIRECT) and Leukoencephalopathy sequelae -> Developmental regression, Spasticity, Seizures, plus Optic atrophy -> Nystagmus, all bare-name targets and INDIRECT. Added baclofen antispasticity treatment (CHEBI:2972) with a target_mechanisms link to the Spasticity node, plus early-intervention referral and swallowing-function surveillance from GeneReviews. Extended the two truncated pathophysiology snippets to full propositional clauses. Added phenotypes Recurrent respiratory infections (HP:0002205) and Hypotonia (HP:0001252, 95% per Alfadhel); did NOT add hyperreflexia (no citable snippet in fetched sources). Structured the allelic series in genetic.variants (founder c.229G>A/p.Gly77Ser PATHOGENIC; Iranian c.355G>A/p.Ala119Thr LIKELY_PATHOGENIC via PMID:31279336) plus a genetic_context (LOSS_OF_FUNCTION, GERMLINE, HOMOZYGOUS) on the ISCA2-LoF node and a review snippet on the seven sporadic variants. Added GO:0006120 (complex I) alongside GO:0006121. Dropped the unsourced 'roughly 30%' from the seizures description. Re-graded the two pure pathway-biochemistry review snippets (PMID:34440194) to evidence_source OTHER. Added a HUMAN_MODEL_MISMATCH discussion recording the mouse ISCA1-vs-ISCA2 dispensability finding. New reference cited/staged: PMID:31279336. Validated: validate, validate-terms, count-verified-snippets 42/42, validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms(+online), check-snippet-length/title/grading, check-folded-hyphens, validate-history.

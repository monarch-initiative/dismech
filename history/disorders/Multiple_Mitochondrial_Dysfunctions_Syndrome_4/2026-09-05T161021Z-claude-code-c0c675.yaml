  summary: 'Create: Multiple Mitochondrial Dysfunctions Syndrome 4 (MMDS4, ISCA2)'
  details: |
    De novo curation of MMDS4 (ISCA2-related mitochondrial disorder, MONDO:0014611) as a DISEASE entry. Deep research via claude_code literature sweep (research/Multiple_Mitochondrial_Dysfunctions_Syndrome_4-deep-research-claude_code.md; 10/10 report references resolved). Curated: biallelic ISCA2 LoF (hgnc:19857, founder p.Gly77Ser) causal genetics; a conserved pathograph chain (ISCA2 LoF -> defective mitochondrial [4Fe-4S] cluster biogenesis -> failure to mature [4Fe-4S] client enzymes -> branching to complex I/II deficiency + elevated lactate + leukoencephalopathy, and to deficient protein lipoylation -> hyperglycinemia); HP phenotypes (regression, leukoencephalopathy, optic atrophy, nystagmus, spasticity, seizures, hyperglycinemia HP:0002154, hyperlactatemia); supportive treatments (NCIT); autosomal recessive inheritance; ultra-rare prevalence. GeneReviews (PMID:29470032) used as mandatory phenotype baseline and tagged. Evidence from PMID:25539947 (Al-Hassnan original), PMID:29297947 (Alaimo mechanism), PMID:31106229 (Alfadhel review), PMID:34440194 (Lebigot review), all exact-substring verified. Corrected two report term slips: HP:0002153 (Hyperkalemia) -> HP:0002154 (Hyperglycinemia); avoided invalid HP:0007070. Validated: validate, validate-terms, count-verified-snippets 24/24, validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length/title/grading, check-folded-hyphens.

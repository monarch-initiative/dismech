  summary: Backfill transmission (#10115, R25)
  details: |
    Added three transmission records; the existing infectious_agent record (Human gammaherpesvirus 8, NCBITaxon:37296) was left untouched. Routes: salivary transmission, predominantly horizontal in childhood (PMID:30705286, PMID:39467162, PMID:12704590); sexual transmission, the commonest route in low-seroprevalence regions (PMID:12704590, DOI:10.3389/ti.2023.11856); and iatrogenic transmission by organ transplantation as donor-derived primary infection in a seronegative recipient (DOI:10.3389/ti.2023.11856). Each record states explicitly that this is a transmission record for KSHV and not for the Castleman phenotype: the virus is acquired long before, and independently of, the disease, which additionally requires loss of immune control. New reference caches: PMID_30705286, PMID_12704590, PMID_39467162; the transplant DOI was already cached. A cleaner adjacent sentence in that DOI cache was avoided because PDF extraction split 'transmission' across a space. just validate clean (65 titles). No other section touched.

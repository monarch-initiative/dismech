  summary: Bind the HHV-8 LANA-1 antigen test as a LOINC measurement
  details: |
    Added measurements: LOINC:49480-7 (Herpes virus 8 latent nuclear Ag [Presence] in Tissue by Immune stain) to the HHV-8 LANA-1 immunohistochemistry row, an exact match for the LANA-1 antigen-in-tissue test the row describes. No method-unspecified alternative exists for this specific antigen/tissue combination (checked via Monarch KG search for Human herpesvirus 8 / HHV-8 / Kaposi sarcoma-associated herpesvirus, all returning nothing, then a web search confirming LOINC's only HHV-8 LANA code is this Immune-stain-qualified one); antigen-in-tissue detection is definitionally a staining method, so this is treated as identity-level, the same reasoning as other NAA-method LOINC codes used elsewhere in the KB. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch12 (LOINC_DIAGNOSTICS.md tranche B).

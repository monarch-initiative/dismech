  summary: Carry forward main's audited vIL-6 edge explanation and fever directness
  details: |
    Round-5 review of PR 9974 found two of main's #10114 evidence corrections had not survived the split into this entry.

    The causal edge 'HHV-8/KSHV Viral Pathogenesis' -> 'IL-6 / vIL-6 Overproduction' carried an explanation asserting that HHV-8 lytic replication produces vIL-6 and triggers the cytokine storm. The cited sentence says only that uncontrolled HHV-8 infection is responsible for the cytokine storm; it never mentions vIL-6. Replaced with main's audited text, which supports the edge on what the quote actually says and states plainly that the vIL-6 mechanism is not part of the quote. The mechanism itself is real and is unchanged in the node description, where it is not attributed to this quote.

    The Fever phenotype's meta-analysis item regained 'directness: INDIRECT', which main had assessed. The quote reports a composite 'constitutional symptoms' rate of 98.6%; fever is a component of that composite, so the quote reaches the fever claim only through an inference step. The sibling Splenomegaly item on the same quote was deliberately left without a directness value, because splenomegaly is reported directly in that sentence rather than inferred.

    Correction to an earlier record: 2026-09-04T231426Z-pr-shepherd-aa53dd.yaml states that each of main's findings was checked against this entry. That claim was too broad - the vIL-6 edge explanation and the fever directness were not among the items checked. This record supersedes that coverage claim; the earlier record is left as written, per the append-only rule.

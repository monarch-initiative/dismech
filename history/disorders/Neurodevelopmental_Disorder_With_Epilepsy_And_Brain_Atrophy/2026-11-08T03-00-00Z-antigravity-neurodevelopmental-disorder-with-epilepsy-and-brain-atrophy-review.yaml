  summary: Enriched NEDEBA with top-level description, Harrison's classifications, pathophysiology cellular component/location annotations, and diagnostic procedures.
  details: Added a top-level disease description and NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:34909687. Enriched ATP6V0A1 pathophysiology nodes with V-ATPase, lysosomal, and autophagosomal cellular components and cerebellar anatomical location on cellular-scale nodes while preserving the Cerebellar atrophy -> Ataxia sequelae chain. Added autosomal recessive inheritance on the ATP6V0A1 genetic record, whole-exome sequencing and brain MRI diagnostic entries showing cerebellar atrophy, and diagnostic flags on Myoclonus and Cerebellar atrophy. Left treatments unpopulated because PMID:34909687 reports seizure refractoriness only for the de novo DEE104 cohort rather than the biallelic NEDEBA cohort.

  summary: 'Create: Neurodevelopmental Disorder with Epilepsy and Brain Atrophy'
  details: |
    De novo curation of NEDEBA (ATP6V0A1, MONDO:0859265, OMIM 619971) from a Perplexity deep-research report (preflight-dr PASS, ATP6V0A1 102x). NEDEBA is the biallelic/recessive ATP6V0A1 phenotype (progressive myoclonus epilepsy + ataxia + cerebellar atrophy), distinct from the de novo DEE104 (OMIM 619970, MONDO:0031021) already curated as an ATP6V0A1 subtype of Genetic_Developmental_and_Epileptic_Encephalopathy; no shared disease_term (different MONDO IDs). Mechanism chain: ATP6V0A1 LoF (V-ATPase proton transport, GO:0046961) -> impaired endolysosomal acidification (GO:0007042) -> lysosomal/autophagic dysfunction (GO:0006914) -> cerebellar atrophy, myoclonus, seizures. Evidence entirely from PMID:34909687 (Mattison et al., Brain Commun 2021); the detailed acidification/autophagy/C. elegans assays were on the de novo R740Q allele while the recessive R495W shares the acidification defect, noted explicitly. All terms verified via runoak/OLS (report-suggested UBERON/CL/GO CURIEs were mislabelled and not used); 12/12 snippets verified. No GeneReviews chapter.

  summary: 'Address independent review: ANCA node evidence, lupus nephritis subtype,
    treatment and evidence gaps'
  details: |
    Response to an independent cold review of the branch (a second reviewer with no
    prior context, run against the local branch state since the review-response
    commits were not yet pushed). Two IMPORTANT findings, both verified against the
    repository before acting, plus seven suggestions.

    IMPORTANT 1 — claim/evidence mismatch on the ANCA node. The
    `ANCA-Mediated Neutrophil Activation` node asserted MPO/PR3 surface
    translocation, adhesion, respiratory burst, degranulation, NETosis and C5a
    amplification, and carried three GO annotations, but its only evidence was a
    sentence from PMID:36109667 about *genetic association architecture*
    (PR3- versus MPO-ANCA specificity). The snippet is an exact quote, so the
    substring validator passed it; the defect was that it supported none of the
    node's claims. Fixed by:
      - adding PMID:32446935 (IN_VITRO) — "normal-density neutrophils were activated
        by MPO-ANCA and monoclonal anti-PR3 antibody" — for GO:0042119;
      - adding PMID:38837706 (IN_VITRO) twice — the ANCA-induced respiratory
        burst/NETosis result for GO:0140645, and the C5a sentence for the
        C5a-amplification limb that justifies the avacopan treatment link;
      - REMOVING the GO:0043312 (neutrophil degranulation) annotation, which no
        abstract-level source among this entry's references supports, and recording
        that removal plus the unevidenced adhesion claim in a node-level `notes`
        field rather than leaving them standing on an inferential basis;
      - re-marking the PMID:36109667 item as PARTIAL with an explanation that states
        plainly it evidences the ANCA-specificity axis and not neutrophil biology.

    IMPORTANT 2 — lupus nephritis omitted on a rationale that did not hold. LN was
    excluded from `has_subtypes` on the ground that it already exists as a standalone
    dismech entry. Verified that this criterion fails: IgA_Nephropathy,
    Membranous_Nephropathy and Anti-GBM_Disease are ALSO standalone entries carrying
    the exact MONDO IDs used in `has_subtypes`. Added Lupus Nephritis bound to
    MONDO:0005556 with evidence from PMID:36483271, and rewrote the `notes` to state
    the actual membership criterion (etiologic subtype with a MONDO term; existence
    of a standalone entry is orthogonal). The rewritten note also records why the
    remaining two Anders categories — alloimmune and monoclonal gammopathy-related
    GN — stay unlisted: no suitable MONDO subtype term, a different and still-valid
    reason. PMID:36483271 had been deleted in the previous commit as an uncited
    cache; it is now genuinely cited, so it was re-fetched.

    Suggestions addressed:
    - Anti-GBM node: the headline claim (autoimmunity against the α3 chain of type IV
      collagen) was uncited anywhere in the file. Added PMID:37981425, which states
      it directly; the pre-existing PMID:28515156 item was re-marked PARTIAL since it
      evidences consequences, not antigen identity.
    - Capillary-wall node: replaced a generic definitional snippet as primary
      evidence with two on-point ones from PMID:36635359 (focal capillary necrosis;
      the hypertension/proteinuria/haematuria presentation), demoting the
      definitional sentence to PARTIAL.
    - Leukocyte-recruitment node: added evidence for the macrophage and neutrophil
      annotations, which the previous single ANCA-GN T-cell snippet did not cover.
    - Prevalence: `measure_type` corrected from PERIOD_PREVALENCE to UNKNOWN — the
      record's own notes state it is a biopsy-series distribution, not a population
      rate, so the structured field contradicted the prose.
    - Mined the PMID:36635359 abstract for the five-category immunopathogenic scheme
      the entry's description adopts, attached to the trigger node.
    - Treatments: added SGLT2 inhibition (PMID:32970396, DAPA-CKD), Kidney
      Replacement Therapy (NCIT:C126400, GeneReviews), and a Surveillance entry
      mining the previously unmined GeneReviews Surveillance sub-section. Added the
      missing statin agent (NCIT:C1655) to the supportive-therapy treatment, whose
      description already referenced lipid-lowering.
    - Added `role: trigger` to the Alternative Pathway Complement Dysregulation node
      for consistency with the other root node.

    Not changed, with reasoning:
    - GO:0003094 on the capillary-wall node. Flagged again as a borderline judgement
      call, not a change request. Kept for the reasons recorded in the previous
      history entry; the second reviewer independently agreed with keeping it.
    - `animal_models:` / `experimental_models:`. The deep-research report's model
      section carries no PMIDs, so modelling it requires fresh literature work rather
      than consumption of already-verified material. Deferred rather than guessed at.

    Verified along the way that the reviewer's caveat about full-text snippets
    failing under `--no-full-text` does not apply here: that flag skips *downloading*
    full text for uncached references, but snippets still match against cache files
    that already contain full text. Confirmed empirically — the batched sweep passes
    88/88 including body-text snippets.

    Validation after changes (all from the worktree):
    - `just validate` — passed
    - `just validate-terms` — passed
    - `just validate-disorders` (batched, CI-equivalent) — passed, 88/88 snippets
      verified (was 75/75)
    - pytest tests/test_data.py -k "conforms_to_module_node_references or
      environmental_mechanism_targets or subtype_foreign_keys or unique or
      reference_cache or model_readout" — 10041 passed
    - Compliance: 90.3% global / 90.6% weighted (was 89.8% / 90.1%)

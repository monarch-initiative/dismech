  details: |
    Review-response session for PR #8369. Rebased the branch onto origin/main (clean,
    no conflicts, diff verified for silent reversions), then addressed the
    ai4c-reviewer CHANGES_REQUESTED review: 3 IMPORTANT findings and 7 suggestions.

    IMPORTANT findings addressed:
    1. Added an `inheritance:` block mining the GeneReviews GENETIC COUNSELING
       section (PMID:20301598) — the complex, rarely-Mendelian transmission of the
       complement arm, which is the attribution for curating the complement genes as
       SUSCEPTIBILITY rather than as Mendelian causes.
    2. Added "Renin-Angiotensin System Blockade and Supportive Antiproteinuric
       Therapy" mining the GeneReviews MANAGEMENT section — the one root-level,
       subtype-independent intervention, targeting the shared nephron-loss node with
       NCIT:C247 (ACE Inhibitor) and NCIT:C66930 (Angiotensin II Receptor
       Antagonist) as therapeutic agents. This closes the Management half of the
       GeneReviews section checklist.
    3. KDIGO 2021 (PMID:34556256) was uncited in `references:`. Investigated rather
       than assumed: PubMed holds NO abstract for it (276-page journal supplement),
       so no snippet can ever be verified against the cache and any quotation would
       be unverifiable. Removed from `references:` and deleted the cache file, with
       the reasoning recorded in the entry `notes` so a future curator does not
       re-add it and try to quote it.

    Suggestions addressed:
    4. Deleted two unused subtype-scoped caches (PMID:36483271 lupus nephritis,
       PMID:38278877 IgAN spatial transcriptomics). Kept PMID:38689160 and put it to
       use in the new `biochemical:` section.
    5. Added Hypoalbuminemia (HP:0003073, PMID:39341789) and Hypercholesterolemia
       (HP:0003124, PMID:29176657 — newly fetched) to round out the
       nephrotic-overlap arm.
    6. Replaced the title-as-snippet on "Leukocyte Recruitment and Glomerular
       Inflammation" with the substantive spatial/single-cell sentence from
       PMID:39300109, which also now grounds the CD4/CD8 cell-type annotations on
       that node.
    7. Added evidence to the two previously unevidenced phenotypes: Hypertension
       (PMID:39341789) and Acute kidney injury (PMID:37764071).
    8. Deepened the genetic section with PLA2R1 (hgnc:9042) and HLA-DQA1
       (hgnc:4942), both from the Stanescu GWAS (PMID:21323541, newly fetched), plus
       APOL1 (hgnc:618) typed as MODIFIER rather than SUSCEPTIBILITY — its effect in
       GN is on progression rate through the shared nephron-loss pathway, evidenced
       both by Genovese (PMID:20647424) and, within a GN subtype specifically, by
       the membranous-nephropathy progression cohort (PMID:36763808).
    9. Added `biochemical:` (anti-PLA2R from PMID:19571279; serum C3 from
       GeneReviews; omics-derived candidates curated as an explicitly unvalidated
       class from PMID:38689160) and `clinical_trials:` (the four DR-surfaced NCTs).
       Trial phase/status were verified against the ClinicalTrials.gov API rather
       than taken from the deep-research report, which turned out to matter:
       NCT05732402 is ACTIVE_NOT_RECRUITING, not "recruiting" as the report claimed.
       For the two Phase 1/2 trials the schema enum has no combined value, so
       `phase` is omitted and the registered phase stated in the description rather
       than misrepresented as a single phase.

    Not changed, with reasoning:
    10. GO:0003094 (glomerular filtration) on the capillary-wall-injury node was
        flagged as a borderline judgement call, not a change request. Kept: the
        node's claim is that filtration-barrier function is deranged, `modifier:
        ABNORMAL` states exactly that, and the alternatives (dropping the process
        annotation, or substituting a molecular term that does not describe the
        node) are worse. The organ-level context is already carried by
        `locations: UBERON:0005777`.

    One correction to an evidence snippet was caught by the pre-edit validation hook
    during this session: an APOL1 snippet had been paraphrased from memory rather
    than quoted; it was replaced with the exact wording from the cached abstract
    before the edit was accepted. No fabricated snippet reached the file.


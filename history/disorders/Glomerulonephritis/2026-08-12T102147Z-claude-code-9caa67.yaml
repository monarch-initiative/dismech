  summary: 'Create: Glomerulonephritis (MONDO:0002462) root entry with subtypes'
  details: |
    Created the mechanism-level root entry for glomerulonephritis (MONDO:0002462) as a CURATE_ROOT_WITH_SUBTYPES target per issue #8362.

    Deep research: Edison (falcon), 607s, 31 citations, 1 artifact -> research/Glomerulonephritis-deep-research-falcon.md.

    NEC preflight: `just preflight-dr research/Glomerulonephritis-deep-research-falcon.md MONDO:0002462` returned SKIP, correctly, because MONDO records no causal gene (RO:0004003) for this complex disease. Fell back to the manual CLAUDE.md section 2b checks and passed: the report's top gene mentions (C3=13, CFH=5, CFHR5=5, CFB=4, APOL1=4) are all genuinely GN-associated with no rival entity dominating; MONDO:0002462 carries no OMIM xref to contradict (xrefs are DOID/GARD/HP/ICD9/MEDGEN/MESH/NCIT/SCTID/UMLS); and the synonym list (glomerular nephritis, Bright's disease, nephritis of renal glomerulus) contains no term pointing at a different entity. The report's own opening explicitly scopes itself to glomerulonephritis and warns that syndrome-wide gene/inheritance/prognosis statements are invalid for GN.

    Two Edison ontology errors were caught and NOT propagated into the entry (also recorded in the entry notes): the report labelled HP:0031263 as "Crescentic glomerulonephritis" when that ID is actually "Abnormal renal corpuscle morphology" (the correct term, HP:0008653, is what the entry uses), and it gave HP:0003774 the stale label "End-stage renal disease" (current label "Stage 5 chronic kidney disease", which the entry uses). Every other DR-suggested HP/GO/CL/MONDO term was independently verified against OAK before use.

    Content: 6 has_subtypes (IgA nephropathy, membranous nephropathy, post-streptococcal GN, anti-GBM disease, ANCA-associated pauci-immune GN, membranoproliferative GN including C3 glomerulopathy), each bound to a verified MONDO term. 11 pathophysiology nodes modelling the shared nephritic final common pathway: nephritogenic antigen exposure / loss of tolerance (trigger) -> immune complex deposition, anti-GBM antibody binding, ANCA-mediated neutrophil activation, and alternative-pathway complement dysregulation -> complement activation -> leukocyte recruitment -> capillary wall injury and necrosis -> crescent formation -> nephron loss and progressive kidney failure. 12 phenotypes; 9 genetic entries (complement genes CFH/C3/CFHR5/CFI/CFB/CD46/DGKE from the C3G GeneReviews, plus PRTN3/MPO as the ANCA autoantigen loci); 1 environmental entry (infectious triggers) wired into the pathograph via influences_mechanisms with environmental_effect TRIGGERS; 5 treatments (corticosteroids, cyclophosphamide, rituximab, plasma exchange, avacopan) each linked by target_mechanisms; 2 diagnosis entries (kidney biopsy with LM/IF/EM, and the mechanism-directed serologic panel); and 1 prevalence record (pooled African biopsy-series subtype distribution, explicitly flagged as a distribution among biopsies rather than a population rate).

    Module relationship (issue #8362 asked for this explicitly): nephritic glomerular inflammation and nephrotic podocytopathy are kept as distinct mechanisms. Only the single "Subepithelial Immune Deposition and Podocyte Injury" node - the membranous/nephrotic arm - declares conforms_to "nephrotic_podocyte_injury#Podocyte Injury". The main nephritic chain deliberately does not conform to that module, so this entry relates to rather than duplicates it. The rationale is recorded in the entry notes.

    GeneReviews: no GeneReviews article exists for glomerulonephritis as an umbrella (PubMed search returned only Alport Syndrome and C3 Glomerulopathy, both separate entities). The C3 Glomerulopathy GeneReviews (PMID:20301598) is used as the authoritative source for the complement-mediated arm and is tagged GeneReviews in the top-level references block.

    Validation run and read: `just validate` passed; `just validate-terms` passed; `just count-verified-snippets` reported 57/57 verified against cached references; and the batched pre-PR sweep `just validate-disorders kb/disorders/Glomerulonephritis.yaml` (what CI runs, with --no-full-text) passed with 57/57 snippets verified. Compliance 87.3% global / 87.6% weighted. All 14 cited PMIDs were fetched via `just fetch-reference`; no cache file was hand-written.

    Self-review before PR: ran the dismech-pr-review content-completeness checklist against the Edison report and found one blocking gap in the first draft - no `diagnosis:` section, despite the report devoting a full section to diagnostics and Anders stating that biopsy is central because the clinical picture is nonspecific. Added the two diagnosis entries and a prevalence record in response, sourced from the C3G GeneReviews biopsy statement and a newly fetched African biopsy meta-analysis (PMID:37869232). Deliberately not modelled: the monoclonal-gammopathy-related and alloimmune GN categories from the Anders five-way scheme are named in the description but not given subtype entries or pathophysiology nodes, since neither has a suitable MONDO subtype term here and both are better served by their own entries; lupus nephritis is likewise referenced rather than duplicated because it already exists as a standalone dismech entry.

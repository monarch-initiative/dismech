  details: |
    Answered the CHANGES_REQUESTED review. ANK2 node: replaced GO:0030506 ankyrin binding (binding to ankyrin, the wrong direction) with GO:0044325 transmembrane transporter binding and GO:0030507 spectrin binding; added three items from Le Scouarnec et al. 2008 (PMID:18832177): ANK2 linkage in two SND families (HUMAN_CLINICAL), and AnkB membrane organization of sinoatrial channels/transporters plus the AnkB+/- mouse bradycardia phenocopy (MODEL_ORGANISM); marked the PMID:25145517 introduction sentence quote_role BACKGROUND on its three uses. KRT8 and MYH6 nodes: their only source is the PMID:33580673 GWAS, so removed the ABNORMAL molecular-function and cardiac-conduction bindings and the sinoatrial-node location, rewrote descriptions to say the mechanism is unknown, renamed the nodes to KRT8 Variant Susceptibility and MYH6 Variant Susceptibility, and softened the MYH6 explanation. HCN4: replaced GO:0005221 with its child GO:0005222 intracellularly cAMP-activated cation channel activity; dropped the redundant generic GO:0005216 from the HCN4 and SCN5A nodes. Added the PR link to the earlier history record. Validated with just validate (44/44 snippets), validate-terms, check-folded-hyphens, check-causal-targets, check-entity-refs and check-snippet-grading.

  summary: Grounded all 6 genetic entries to trigger pathophysiology nodes with specific GO molecular
    functions and replaced Exercise intolerance HPO binding on Chronotropic Incompetence with HP:0033992.
  details: Added HGNC gene bindings (hgnc:16882 HCN4, hgnc:10593 SCN5A) and specific GO molecular function
    terms (GO:0005221 intracellularly cyclic nucleotide-activated monoatomic cation channel activity,
    GO:0086006 voltage-gated sodium channel activity involved in cardiac muscle cell action potential)
    to HCN4 Pacemaker Current Loss of Function and SCN5A Sodium Current Loss of Function. Created 4 new
    trigger pathophysiology nodes for ANK2 (hgnc:493, GO:0030506 ankyrin binding), LMNA (hgnc:6636, GO:0160123
    structural constituent of nuclear lamina), KRT8 (hgnc:6446, GO:0005198 structural molecule activity
    and GO:1990254 keratin filament binding), and MYH6 (hgnc:7576, GO:0000146 microfilament motor activity
    and GO:0003779 actin binding), wiring each to Heritable Sinoatrial Node Pacemaker Dysfunction so all
    6 genetic entries are mechanistically wired and grounded. Replaced the approximate HP:0003546 (Exercise
    intolerance) binding on the Chronotropic Incompetence phenotype with the exact HPO term HP:0033992
    (Chronotropic incompetence).

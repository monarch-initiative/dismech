  summary: 'Review: connect PDDS''s entirely detached clinical layer (IUIS Table 9)'
  details: |
    All eleven phenotypes had no incoming causal edge. The ERCC6L2 mechanism chain was complete and correct from the germline lesion through R-loop accumulation, replication stress, p53-mediated HSPC attrition, marrow hypoplasia and somatic TP53 clonal rescue to malignancy - and none of it reached a single clinical finding. The pathograph rendered as two disconnected components.

    All eleven are now wired. The haematologic ones attach where the mechanism puts them: marrow hypocellularity, pancytopenia, thrombocytopenia and neutropenia from Bone Marrow Hypoplasia; anaemia from BOTH the specific erythroid differentiation block and the general marrow hypoplasia, because the sources report trilineage cytopenia with a disproportionate erythroid defect and that is two contributions rather than one; MDS/AML and AML from the TP53-mutated malignancy node.

    The four non-haematologic features - developmental delay, microcephaly, cerebellar involvement, retinal dystrophy - are attached to the ERCC6L2 root lesion rather than to any step in the haematopoietic chain, because they are not consequences of marrow failure and no source establishes which step produces them. All four are INDIRECT_UNKNOWN_INTERMEDIATES and say so.

    Correction worth recording: three reference_title values in the first draft of these edges were composed from what the papers are about rather than copied from the cache frontmatter, and all three were wrong. The reference validator caught every one. They are now copied from the cache. This is the exact failure mode CLAUDE.md documents for citation strings. 65/65 snippets verify.

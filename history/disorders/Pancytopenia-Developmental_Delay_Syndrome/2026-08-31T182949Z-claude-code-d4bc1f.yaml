  summary: Add OMIM/Orphanet external_assertions; correct a false schema claim
  details: |
    Adds external_assertions records for the OMIM and Orphanet identifiers, correcting a false statement I made to the reviewer.

    WHAT I GOT WRONG. Across three PRs in this run I told the reviewer that OMIM and Orphanet identifiers were "inexpressible" in the schema, because DiseaseMappings exposes only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings. The reviewer accepted that and withdrew the suggestion. Both of us were wrong. ExternalAssertion carries exactly this, with source and external_id both required, and it is the established convention: kb/disorders/ holds 124 ORPHA and 65 OMIM external_id records across 110+ files.

    The failure mode is the same one that produced most of the other corrections in this run - I checked one class, did not find the slot, and read "absent from the class I looked at" as "absent from the schema". Issue #9922 was filed and withdrawn for this identical mistake on 2026-08-28; its withdrawal note is what surfaced my own. A reviewer agreeing with me is not verification, and a suggestion withdrawn on a false premise is worse than one never made, because it closes the question.

    WHAT WAS ADDED. Identifiers were resolved from the entry's own MONDO term through OLS, not taken from the reviewer's message. That mattered: for Immunodeficiency 63 the reviewer offered ORPHA:444463, and MONDO:0032782 carries no Orphanet cross-reference at all, so no Orphanet record is asserted for that entry rather than a number I could not confirm. For Worth type, MONDO:0007764 cross-references two OMIM entries rather than one, so both are recorded instead of silently picking one.

    Each record's description says what it is and, where relevant, that the Orphanet record is not present in references_cache/ - so it is an identifier for a reader to follow, not a source anything here quotes. That distinction is the point: recording a resolvable identifier is not the same as citing it.

    Pushed knowing it resets an approval on an already-approved PR. Correcting a false claim I put on the record, and adding conventional metadata I wrongly said was impossible, is worth a review cycle.

    Validation: just validate clean, snippet counts unchanged.

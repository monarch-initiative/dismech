  summary: 'Address PR review: fix the inverted REFUTE item, re-band the neurodevelopmental
    phenotypes to a real source, unbind conditioning, add histopathology'
  details: |
    Addressed the automated review on PR #10232 (review 5068809988, 4 IMPORTANT, no
    CRITICAL), plus the non-blocking suggestions for histopathology, a references
    block and missing phenotypes.

    IMPORTANT 1 - the REFUTE item on Developmental delay quoted a sentence that
    AFFIRMS the association ("ERCC6L2-associated disease has been so far frequently
    related to neurodevelopmental delay..."). As graded it said the opposite of what
    it read. Replaced with the genuinely refuting sentence from the same cached full
    text: "Our patients, both homozygous for this variant, as well as the brother of
    one of them with the same genotype, did not exhibit microcephaly, developmental
    delay, or dysmorphic features."

    IMPORTANT 2 - Developmental delay and Microcephaly were graded FREQUENT on no
    cited frequency. Both lowered to OCCASIONAL and now cited. Tracing the reviewer's
    19% figure produced a finding worth recording: the deep-research report
    attributed it to "De Vitis et al.", and no such paper exists in PubMed - searches
    for `De Vitis[AU] AND ERCC6L2` and `Vitis[AU] AND ERCC6L2` both return nothing.
    The number itself is real. Following the report's own citation [11] to
    PMC9998559 resolves to PMID:36790458, Baccelli et al. 2023, which states "Regarding
    neurological features, 6/31 patients presented microcephaly" and "Developmental
    delay and/or learning difficulties were also described in 6 patients". So the
    figure was right and the attribution was invented. That reference was fetched and
    is now cited directly.

    IMPORTANT 3 - NCIT:C15747 "Supportive Care" was the wrong binding for
    conditioning intensity, which is cytotoxic pre-transplant therapy. The separate
    treatment entry was removed and its evidence folded into the HSCT entry, whose
    notes already carried the conditioning guidance.

    IMPORTANT 4 - the MDS phenotype was graded FREQUENT on a snippet that never names
    MDS. Renamed to "Myelodysplastic syndrome or acute myeloid leukemia" (the
    literature reports them as one progression endpoint with a combined denominator)
    and re-evidenced with "approximately a third of the whole cohort of patients
    (10/31) developed MDS or AML" plus the reviewer's suggested hallmark sentence
    from PMID:41628318 and the TP53-clone proportion (7/10 progressors, none of the
    non-progressors).

    SUGGESTIONS taken. Added a histopathology: section with the two marrow pictures
    and their denominators - hypocellular without dysplasia in 20 of 26 patients with
    reported morphology at presentation, versus megakaryocytic/erythroid dysplasia
    with erythroid predominance as the progression picture. Added Thrombocytopenia,
    Anemia and Neutropenia at VERY_FREQUENT. Added a top-level references: block for
    all nine PMIDs. Added the monosomy 7 cytogenetic finding to the malignancy node.

    SUGGESTION not done: OMIM/ORPHA mappings cannot be expressed. DiseaseMappings
    supports only icd10cm/icd11f/mondo/ncit sub-slots; schema validation rejects
    omim_mappings and orphanet_mappings. Same wall as PRs #10226 and #10227 in this
    run.

    GeneReviews: the reviewer could not check. Confirmed here - `ERCC6L2
    GeneReviews[All Fields]` returns nothing, and a GeneReviews[Book] search returns
    only other IBMFS chapters (Fanconi anemia, dyskeratosis congenita, SAMD9L,
    monosomy 7 predisposition), none of them ERCC6L2. No chapter exists.

    One tooling observation from this round: the trilineage-cytopenia sentence in
    PMID:36790458 carries a mid-sentence PMC citation marker ("between 4000 and [23]
    166,000/μL"), and the reference validator strips bracketed spans before matching,
    so the exact sentence cannot be quoted in full. The snippet was shortened to the
    clause before the marker. This is the same class of problem as issue #10192
    (HGVS designations in square brackets).

    Validation after fixes: `just validate` passes schema, term and reference checks
    with 59/59 snippets verified (up from 49/49). check-entity-refs,
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets and check-snippet-grading all pass.

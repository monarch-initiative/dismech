  details: |
    Added a classifications block carrying iuis_category: bone marrow failure, backfilled from IUIS 2022 Table 9 (Tangye et al., PMID:35748970), the row entered as 'BMFS2'. The entry previously had no classifications block. One row, one gene: ERCC6L2, autosomal recessive, OMIM 615667, which is the phenotype number this entry is curated against. The row's associated-features cell reads 'Bone marrow failure, learning difficulties, microcephaly', matching the three features this entry's name and phenotypes carry, and the whole row is quoted as the evidence snippet, graded OTHER and verified byte-exactly against references_cache/PMID_35748970.md. Notes record that the table gives the T-cell and B-cell columns as NA rather than reporting a lymphocyte defect, so the IEI status here rests on failure of the stem and progenitor compartment itself - which is the organising principle of Table 9 and the reason a disease with no measured lymphocyte abnormality is in the IUIS classification at all. Also added as a member of kb/groupings/Bone_Marrow_Failure_IEIs.yaml, differentiated from the other members by transcription-coupled repair as the failing process.

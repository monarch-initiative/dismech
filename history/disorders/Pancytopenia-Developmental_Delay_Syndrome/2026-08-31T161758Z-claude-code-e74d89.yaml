  summary: 'Create: Pancytopenia-Developmental Delay Syndrome'
  details: |
    Created kb/disorders/Pancytopenia-Developmental_Delay_Syndrome.yaml
    (MONDO:0014317, ERCC6L2; also BMFS2 / "ERCC6L2 disease").

    Deep research: Perplexity (sonar-deep-research) ->
    research/Pancytopenia-Developmental_Delay_Syndrome-deep-research-perplexity.md.
    Inline validation set `term_validation.needs_review: true` with 13 of 38 checked
    labels naming a different term. The NCIT bindings were wrong without exception:
    Blood Transfusion -> Health Services Research, Antibiotic Therapy -> Rabies,
    Colony-Stimulating Factor Therapy -> Medical Castration, Supportive Care ->
    Scientist Exchange Program, Hematopoietic Stem Cell Transplantation ->
    Psychosocial Assessment and Care, Bone Marrow Transplantation -> Health
    Promotion. HP:0005518 was offered as "bone marrow hypocellularity" (HPO:
    "Increased mean corpuscular volume") and HP:0002352 as "cerebellar atrophy"
    (HPO: "Leukoencephalopathy"). GO:0007067 is obsolete. None was bound; all terms
    here were resolved independently against the committed caches. Citation 18 is
    the bare string "ACMG guidelines".

    References used, all sourced independently from PubMed: PMID:24507776 (Tummala
    2014 discovery), PMID:29633571 (six-patient phenotype series), PMID:29987015
    (transcription deficiency, DNA-PK interaction, R loops), PMID:36156210 (impaired
    erythropoiesis and MSC niche remodelling), PMID:36952636 (52-subject global
    cohort with the survival figures), PMID:41490322 (mouse: replication stress, p53
    activation, somatic Trp53 rescue), PMID:41628318 (first systematic HSCT
    analysis), PMID:39906419 (Croatian non-classical presentations).

    One reference was deliberately not cited: PMID:42415356 (Br J Haematol 2026,
    "Advanced fibrosis, TP53 variants and acute/pure erythroid leukaemia: Diagnostic
    harbingers of ERCC6L2-related bone marrow failure"). It is relevant, but its
    PubMed record carries no abstract, so `just fetch-reference` cached a title-only
    file and there is no quotable text. Per the evidence SOP a title is not a
    finding, so it is named in the entry's notes instead. This is recorded because
    "relevant but unquotable" is a category the KB currently has no slot for.

    One error I made and the gate caught: the 3-year survival snippet was
    transcribed as "...for patients with BMF and HMs, respectively" where the
    abstract says "HM". `just validate` reported it as an abstract-only
    near-miss and it was corrected to the exact substring.

    Curation choices. The `Developmental delay` phenotype carries a SUPPORT item
    from the six-patient series where it was universal AND a REFUTE item from the
    Croatian report, whose patients had unremarkable histories and normal physical
    findings. Per the CLAUDE.md guidance on evidence that supports one part of a
    claim and contradicts another, these are two items rather than one hedged item.
    An open KNOWLEDGE_GAP argues that the MONDO label understates the disease on
    both counts, since the cytopenias are mild relative to the marrow hypoplasia and
    the defining feature is TP53-mutant transformation; the field has largely moved
    to "ERCC6L2 disease". TP53 is curated as a second `genetic:` entry with
    `relationship_type: SOMATIC_DRIVER`, because the somatic mutation is selected
    for rather than incidental - it reverses the p53-dependent attrition that causes
    the marrow failure.

    CORRECTION (appended 2026-08-31T18:52Z, before merge): the sentence below
    originally read "No GeneReviews chapter exists for this disorder." That is
    false as written. No DEDICATED chapter exists, but the GeneReviews "Monosomy
    7 Predisposition Syndromes Overview" (NBK571103) covers this disorder, and
    it was already cached in this PR's own references_cache/ when I wrote that
    line. Its Table 1 gives ERCC6L2 / Bone marrow failure syndrome 2
    (OMIM 615715) / AR / 1%-5% of monosomy 7 predisposition / adult onset /
    "Microcephaly, learning difficulties, DD", and its physical-examination
    section names ERCC6L2-related bone marrow failure among the causes of
    microcephaly. An absolute "does not exist" would have told the next curator
    not to look. This is the third time in this run I recorded an absence that
    the cache contradicted; the other two were a grep truncated by head -5 and
    an ASCII search for a full-width numeral.

    Not cited, and the reason is itself worth recording: that cache is stored as
    raw HTML, and every ERCC6L2 mention is wrapped in <i> tags mid-sentence, so
    no sentence naming the gene survives as an exact substring. I added the
    microcephaly sentence as an evidence item, ran just validate, got "Text part
    not found as substring", and removed it rather than ship an unverified
    snippet. A reviewer suggested the chapter was quotable; it is quotable on
    screen and not in the bytes, which is the same rendered-form-versus-actual-
    bytes mistake as the full-width numeral, made in the other direction.

    Validation: `just validate` passes schema, term and reference checks with 49/49
    snippets verified. check-entity-refs, check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets and check-snippet-grading all pass.

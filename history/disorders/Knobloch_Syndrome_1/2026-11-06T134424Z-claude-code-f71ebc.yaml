  summary: 'Create: Knobloch_Syndrome_1'
  details: |
    New entry for COL18A1-related Knobloch syndrome 1 (MONDO:0800167). Deep research: one Perplexity report (research/Knobloch_Syndrome_1-deep-research-perplexity.md; 6/6 references resolved, no unresolved terms; just preflight-dr PASS, COL18A1 mentioned 50 times). The report cited mostly aggregator web pages, so evidence was taken from the PubMed primary papers it named (Sertie 2000, Suzuki 2002, Passos-Bueno 2006) plus PubMed searches for molecularly confirmed cohorts (PMID:27259167, 33238767, 42710781, 40374141, 38556002) and Col18a1 knockout mouse papers. Khan 2012 (PMID:22399687) was deliberately not cited because it pools COL18A1 and ADAMTS18 children. ClinGen Definitive AR tier copied from its CGGV record. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Pathophysiology is a chain from COL18A1 loss of function through loss of collagen XVIII from basement membranes to seven tissue-level nodes, each wired to phenotypes except hyaloid regression. Validated with just validate (77/77 snippets) and just validate-disorders.

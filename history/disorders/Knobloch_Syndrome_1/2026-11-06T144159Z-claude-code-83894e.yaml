  summary: 'Review round 1: Knobloch_Syndrome_1'
  details: |
    Addressed review round 1 on PR 16674. CI failure: 8 ORPHA:1571 and CGGV evidence items lacked reference_title; filled with scripts/backfill_reference_titles.py (not by hand). Reviewer suggestions: the two PMID:25456301 background quotes regraded to evidence_source HUMAN_CLINICAL keeping quote_role BACKGROUND; a notes sentence on the prophylaxis treatment says NCIT:C217424 binds only the laser arm, not the scleral buckle. Of the Orphanet occasional phenotypes, strabismus is added as Esotropia (HP:0000565) from a COL18A1-homozygous case (PMID:28950998); vesicoureteral reflux and joint hypermobility were not added because Orphanet ORPHA:1571 pools KNO1 and KNO2 and a PubMed search found no COL18A1-confirmed report of either. The cone-rod ERG binding (HP:0008323) is unchanged; preferred_term carries the cone-rod specificity.

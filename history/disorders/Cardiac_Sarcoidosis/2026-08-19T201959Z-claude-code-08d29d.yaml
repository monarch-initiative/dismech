  summary: 'Address PR review: add clinical_trials, diagnostic criteria definitions,
    biochemical, TNF treatment'
  details: |
    Addressed the three blocking items and all four suggestions from the ai4c-reviewer CHANGES_REQUESTED review on PR #8979.

    Scoping decision made deliberately rather than by narrowing. The reviewer offered to accept a narrowed scope statement in notes as the answer to all three blocking items. I declined that route: the notes block did claim the cardiac diagnostic pathway and treatment repertoire as in scope, and having claimed them, the criteria frameworks and the cardiac trial landscape are genuine gaps rather than deferrals. More importantly the missing content is cardiac-specific and cannot live in Sarcoidosis.yaml - the 2014 HRS, 2016 JCS and WASOG frameworks are cardiac-sarcoidosis diagnostic instruments, and REPAIR-CS and MAGiC-ART are cardiac-sarcoidosis trials. The notes block was instead rewritten to state the scope boundary explicitly in both directions: what is in scope (cardiac mechanism, phenotypes, criteria frameworks, diagnostic pathway, cardiac biomarkers, treatments, trials) and what is deliberately out (sarcoidosis-general genetic susceptibility, environmental exposures, and the systemic activity biomarkers ACE/sIL-2R/CRP/ESR, all curated in Sarcoidosis.yaml).

    Blocking item 1 - clinical_trials added. Four cardiac-sarcoidosis-specific trials: NCT06660732 (REPAIR-CS, rilonacept, PHASE_II/RECRUITING, n=60), NCT04017936 (MAGiC-ART, anakinra, PHASE_II/COMPLETED, n=17), NCT06868381 (baricitinib, PHASE_II/NOT_RECRUITING, n=10), NCT07159074 (Tc-99m tilmanocept imaging, PHASE_II/RECRUITING, n=15). Phase and status enum values were taken from the ClinicalTrials.gov v2 API rather than from the report prose; NCT06868381 is NOT_YET_RECRUITING upstream, mapped to the closest schema enum NOT_RECRUITING. Each trial carries a snippet verified against its cached clinicaltrials_NCT*.md record. The REPAIR-CS entry explicitly notes that its endpoint is imaging inflammation, not arrhythmia or mortality, so it does not silently resolve the immunosuppression KNOWLEDGE_GAP.

    Blocking item 2 - diagnostic criteria frameworks and echocardiography added. Three definitions entries with definition_type DIAGNOSTIC_CRITERIA and derivation_basis ESTABLISHED_CRITERIA: 2014 HRS, 2016 JCS, and the WASOG Sarcoidosis Organ Assessment Instrument, evidenced from PMID:37123482 (the guideline comparison), PMID:24751450 (the WASOG instrument itself) and PMID:40445485 (the HRS screening arm). The WASOG entry records that it grades organ-involvement probability rather than issuing a binary cardiac diagnosis. An Echocardiography diagnosis entry was added (NCIT:C16525) carrying both the characteristic findings (PMID:37682338) and the low-sensitivity caveat, plus the screening-yield numbers from PMID:40445485.

    Blocking item 3 - biochemical added rather than deferred. Two cardiac-specific biomarkers, each attached by a readouts block to the pathophysiology node the reviewer identified: high-sensitivity cardiac troponin READOUT_OF Active Granulomatous Myocardial Inflammation (PMID:37591415, where cumulative cTnT trajectory after prednisolone predicted VT/VF, worsening heart failure and sudden death), and NT-proBNP READOUT_OF Progressive Ventricular Dysfunction and Heart Failure (PMID:21086902, AUC 0.913 for cardiac involvement, and explicitly not useful for pulmonary hypertension). Both readouts carry their own evidence in addition to the biomarker-level evidence. biomarker_term was intentionally omitted: there is no biomarkerterm enum cache in cache/enums, so NCIT biomarker CURIEs cannot be validated offline, and the sibling Sarcoidosis.yaml biochemical entries likewise carry none. A notes field on the section records that the systemic markers stay in Sarcoidosis.yaml and that no serum biomarker independently establishes the diagnosis.

    Suggestions addressed. The ORPHA:797 evidence item now carries evidence_source OTHER. The Corticosteroid-Sparing Immunosuppression treatment was split: Methotrexate Corticosteroid-Sparing Maintenance keeps therapeutic_modality SMALL_MOLECULE with its evidence narrowed to the methotrexate clause of PMID:31538835, and a new TNF Inhibitor Therapy treatment carries therapeutic_modality MONOCLONAL_ANTIBODY with adalimumab and infliximab as therapeutic_agent. The TNF treatment instantiates the granuloma_formation TNF-inhibitor design pattern by targeting Antigen-Driven CD4+ T-Cell and Macrophage Activation, which is the node already conforming to granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation - Treatment has no conforms_to slot, so pattern membership is expressed through the target_mechanisms edge rather than a declaration. It also carries the disease-specific safety caveat that anti-TNF therapy risks increased mortality in severe cardiomyopathy (PMID:33059834), and the evidence explanation records that the two cited reviews are not fully concordant on tolerability in impaired ventricular function.

    Two phenotypes were added, both without frequency as the reviewer instructed: Bundle Branch Block (HP:0011710) and Atrial Fibrillation (HP:0005110). Three suggested phenotypes were NOT added and the reason is recorded in notes: no quotable cardiac-sarcoidosis-specific statement was found in the cached references for pericardial effusion or ventricular premature beats, and late gadolinium enhancement is already modelled as the Myocardial Fibrosis phenotype plus the cardiac MRI diagnosis entry. Note also that three of the HPO identifiers suggested in the review do not carry the labels given for them - HP:0011711 is Left anterior fascicular block (not Abnormality of cardiac conduction), HP:0004308 is Ventricular arrhythmia (not Ventricular premature beat), and HP:0030972 is Abnormal systemic blood pressure (not Late gadolinium enhancement) - all verified with runoak, so the correct identifiers were used for the two phenotypes that were added.

    A third KNOWLEDGE_GAP discussion was added on criteria-framework discordance, which is the mechanism-level reason the three definitions entries are curated as three rather than one. Applied to the same 324-patient cohort, HRS classified 22.7 percent of women and 36.0 percent of men as having cardiac sarcoidosis while 2016 JCS classified 8.0 and 19.3 percent (PMID:34546787) - a two- to threefold difference in the same patients, which cannot be adjudicated because myocardial biopsy, the only definite standard, has low sensitivity. The discussion records that this uncertainty propagates into every cohort-derived number in the entry, including the prevalence records and phenotype frequency bands. The paper's own subject is sex differences, so the framework comparison is read off its reported data rather than being its stated conclusion, and the evidence explanation says so.

    Validation actually run and read after these changes: just validate passed (schema, terms, references); just count-verified-snippets reported 114/114 verified against cached references, up from 80/80; just validate-terms passed; scripts/check_snippet_length.py --against-ref origin/main reported no new snippets under 5 words; scripts/check_folded_hyphens.py reported no new folded-scalar hyphen splits; just check-duplicate-keys and just check-title-snippets both clean; the pytest selection for conforms_to, subtype foreign keys, unique names and definitions passed (6309 passed); all 51 distinct ontology term labels were re-verified against OAK with 0 problems; and the batched just validate-disorders sweep passed. Compliance rose from 96.4 percent to 97.2 percent. Nine cache files fetched during research but not cited by the entry were left unstaged.

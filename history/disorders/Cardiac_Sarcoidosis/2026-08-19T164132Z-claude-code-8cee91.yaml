  summary: 'Create: Cardiac Sarcoidosis (MONDO:0001707)'
  details: |
    New de-novo entry for cardiac sarcoidosis (MONDO:0001707), the cardiac-specific arm of sarcoidosis.

    Deep research: falcon (Edison), research/Cardiac_Sarcoidosis-deep-research-falcon.md. Its own reference_validation frontmatter block reported 8/8 references resolved, confabulation_rate 0.0, 0 unresolved and 0 off-topic; the report body's Reference Validation section agrees. The report was used as leads for scope and framing only - every snippet curated here was located and quoted from a PubMed abstract fetched independently via E-utilities and cached with just fetch-reference.

    NEC check: just preflight-dr research/Cardiac_Sarcoidosis-deep-research-falcon.md MONDO:0001707 returned SKIP, because MONDO records no causal gene (RO:0004003) for this term - cardiac sarcoidosis is not monogenic. The manual CLAUDE.md section 2b checks were used instead. uv run runoak -i sqlite:obo:mondo info MONDO:0001707 -O obo confirms label "cardiac sarcoidosis", definition "Sarcoidosis affecting the tissues of the heart", relationship RO:0004026 UBERON:0000948 heart, is_a MONDO:0019338 sarcoidosis and MONDO:0016345 non-familial restrictive cardiomyopathy, no OMIM xref (so the OMIM anchor is not applicable), and synonyms "heart sarcoidosis" and "sarcoidosis of heart". The falcon report's own Identifiers and synonyms section names the same MONDO ID, the same definition, and a superset of those synonyms, and its gene-frequency profile (CS, EMB, TNF, CD4) contains no rival monogenic entity. No entity confusion.

    Duplicate preflight: no Cardiac_Sarcoidosis.yaml on origin/main; no open or closed PR or issue covering MONDO:0001707 apart from tracking issue 8922. MONDO:0001707 does appear in kb/disorders/Arrhythmogenic_Right_Ventricular_Cardiomyopathy.yaml as the disease_term of a differential-diagnosis cross-reference; that is a cross-reference, not curation, and this entry reciprocates it with an ARVC differential_diagnoses record.

    Pathograph: a seven-node de-bundled chain. Antigen-driven CD4+ T-cell and macrophage activation -> myocardial non-caseating granuloma formation -> active granulomatous myocardial inflammation, which then branches to (a) conduction-system involvement and atrioventricular block (the potentially reversible arm) and (b) post-inflammatory replacement fibrosis and myocardial scar, which in turn feeds scar-mediated re-entrant ventricular tachyarrhythmia and progressive ventricular dysfunction and heart failure. Each node carries its own evidence and each downstream edge carries separate edge-level evidence.

    Module conformance: three granuloma_formation nodes - #Th1 and TNF-Driven Macrophage Recruitment and Activation, the module's key target #Epithelioid Transformation and Multinucleated Giant Cell Formation, and #Tissue Containment versus Destruction and Fibrosis - plus cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure on the heart-failure consequence node (that module explicitly names infiltrative injury in secondary cardiomyopathy as a substitutable primary lesion). Conformance to the intermediate cardiomyopathy nodes, in particular #Neurohormonal Activation, was NOT declared because no cited source evidences that arm in cardiac sarcoidosis specifically. Conformance to cardiac_ion_channel_repolarization was deliberately NOT declared, and the reason is recorded in a notes field on the arrhythmia node: that module models arrhythmia arising from an ion-channel or calcium-handling variant in a structurally normal heart, whereas cardiac sarcoidosis ventricular tachycardia is macro-re-entry around fixed granulomatous scar (PMID:25527825 mapped every induced VT to scar-mediated re-entry). Forcing that conformance would misstate the mechanism.

    Two KNOWLEDGE_GAP discussions recorded. First, whether immunosuppression reduces ventricular arrhythmia burden or mortality at all: the systematic review of 34 publications and 1297 patients (PMID:34472360) found no randomized trials and explicitly declined to conclude for those two outcomes, which is why the curated treatment edges run from corticosteroids and steroid-sparing immunosuppression only to the active-inflammation node and never to the scar-mediated arrhythmia node. Second, unexplained sex and race modification of presenting phenotype and arrhythmic risk (PMID:37062472).

    Datasets: four GEO series added, all DIRECT hits with cardiac sarcoidosis named in the series title (GSE205734, GSE314910, GSE319770, GSE319771). Relevance was triaged manually as CLAUDE.md requires, not inferred from the discovery score. All four resolved with just verify-datasets, and the two linked publication PMIDs (36111531, 42206386) were fetched and their titles confirmed to match. They carry provenance notes and no evidence block, per the dataset-curation policy.

    Validation actually run and read: just validate passed (schema, terms, references) and reported Snippets checked 80/80 verified against cached references; just count-verified-snippets independently reported 80/80; just check-duplicate-keys reported no duplicate mapping keys; just check-title-snippets reported no new title-quoting snippets; the conforms_to / subtype-foreign-key / unique-name pytest selection passed (4255 passed, 29977 deselected); and the batched pre-PR sweep just validate-disorders kb/disorders/Cardiac_Sarcoidosis.yaml passed all three stages. Compliance is 96.4 percent global and weighted; the only remaining gap is datasets[].evidence, which CLAUDE.md specifies bulk-generated dataset records deliberately omit.

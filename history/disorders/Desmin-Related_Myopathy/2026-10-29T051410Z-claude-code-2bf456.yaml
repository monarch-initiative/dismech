  details: |
    De-novo curation of desminopathy (MONDO:0016187) from a claude_code deep-research report, curated as one DES cardioskeletal spectrum with MFM1/CMD1I/Kaeser/LGMD1E recorded as has_subtypes. Atomic, unbundled pathograph: DES rod-domain dominant-negative variant -> filament assembly failure -> extrasarcomeric network collapse, branching into aggregate-proteotoxicity and network-loss arms plus mitochondrial dysfunction, converging on striated-muscle-cell degeneration and then cardiomyopathy, conduction-system degeneration and skeletal/respiratory phenotypes. The aggregate-toxicity vs network-loss debate is captured as two mechanistic_hypotheses groups (network-loss CANONICAL, aggregate ALTERNATIVE) tagged on the relevant edges. Cardiac node conforms_to cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult. R349P knock-in and desmin-null mouse models linked via modeled_mechanisms. Every snippet was taken from the cached abstracts (not the report, whose quotes were unverified and four of which did not match source) and verified; every CURIE and reference_title read from cache/OLS. All offline gates pass; 36/36 snippets verified.

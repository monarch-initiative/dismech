  summary: 'Create: Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome'
  details: |
    Created the entry for CACP syndrome (MONDO:0008828, PRG4) from primary literature found by PubMed search, replacing the stub. Pathophysiology is an eight-node chain: biallelic PRG4 loss of function, lubricin deficiency at joint, tendon and serosal surfaces, loss of cartilage boundary lubrication with raised friction, friction-induced superficial chondrocyte apoptosis (conforms_to osteoarthritis_cartilage_degradation#Mechanical Overload and Chondrocyte Stress), fibroblast-like synoviocyte overgrowth, progressive cartilage wear (conforms_to osteoarthritis_cartilage_degradation#Cartilage Matrix Loss and Subchondral Bone Remodeling), tendon sheath dysfunction and serosal effusion. Mechanistic edges rest on the Prg4-null mouse papers (PMID:15719068, 20191580, 17968947, 23530215, 28604608) and on patient synovial pathology and protein studies (PMID:15702367, 16000300, 25642942). Twenty-one HP-bound phenotypes with cohort frequencies from the Saudi (PMID:23290693), Turkish (PMID:29397575) and Indian (PMID:38856641) series. ClinGen Definitive validity recorded from the CGGV assertion. Treatments include REFUTE evidence for antirheumatic and biologic drugs and for yttrium-90 radiosynovectomy, plus pericardiectomy, hip arthroplasty and preclinical recombinant lubricin. Camptodactyly, acetabular cysts, reduced bone mineral density and mitral valve prolapse are left without an inbound causal edge because no source states their mechanism. Not cited: PMID:26508154 (no quotable text cached), PMID:24834922 (temporomandibular joint mouse phenotype, not needed), PMID:36252540 (surface-chemistry study of recombinant lubricin), PMID:34012381 and PMID:39705621 (no claim not already covered by primary series). The MONDO synonym Jacobs syndrome was omitted because it names 47,XYY in common use. No GeneReviews chapter exists. Deep research: research/Camptodactyly-Arthropathy-Coxa_Vara-Pericarditis_Syndrome-deep-research-openscientist.md (second run, after the first timed out) was used as leads after the initial curation. All 24 of its references resolved. Its term suggestions were not used: five HP/NCIT CURIEs are mislabelled (HP:0005750, HP:0001644, HP:0100658, HP:0100763, NCIT:C15431), HP:0002102 is Pleuritis rather than pleural effusion, GO:0005615 is obsolete, and it gives PRG4 as HGNC:9361 where the binding is hgnc:9364. just preflight-dr could not run because the local MONDO build is absent, so identity was checked by hand: PRG4 is named throughout, OMIM 208250 and MONDO:0008828 are cited, and WISP3/CCN6 progressive pseudorheumatoid dysplasia appears only as a differential. Taken from the report, each re-verified against the cached abstract: superficial-zone chondrocyte loss in Prg4-null mice (PMID:26975998); constrictive pericarditis first treated as tuberculosis, added as evidence and as a differential (PMID:38955384); neonatal pleural effusion (PMID:40830943); further REFUTE evidence for NSAIDs, methotrexate, corticosteroids and biologics (PMID:40830943, 42482035); misdiagnosis as JIA with biologic exposure (PMID:40475173); non-inflammatory synovial fluid and ultrasound findings (PMID:41637065, 41626297); DXA-confirmed reduced bone mineral density, which replaced the Osteoporosis phenotype with Reduced bone mineral density (PMID:42482035); variants c.1910_1911delCT, c.3756dup and c.4104T>A (PMID:40475173, 41626297, 42482035); and the minipig rhPRG4 study as INDIRECT treatment evidence (PMID:28129516). A Serositis phenotype (HP:0045073, OCCASIONAL) was added from the 22% serosal-involvement figure in PMID:29397575. Not used from the report: the TMJ hedgehog and BMP mouse papers (PMID:26945615, 26534931, 24834922), which concern ectopic TMJ cartilage rather than the human disease; the Turkish rheumatic-mimic series (PMID:40626694), a referral cohort giving no prevalence; the mutation count (PMID:36694203) and case reviews (PMID:40874560, 42074176, 25297354), which add nothing not already sourced; the single mitral stenosis case (PMID:38523390), mentioned in notes only; and the report's suggested ORPHA identifier, which no resolver checks. Validation: just validate, validate-terms, count-verified-snippets (119/119), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-genereviews and validate-disorders all passed.

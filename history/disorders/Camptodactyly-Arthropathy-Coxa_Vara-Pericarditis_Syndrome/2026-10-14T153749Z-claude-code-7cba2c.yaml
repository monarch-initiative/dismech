  summary: 'Create: Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome'
  details: |
    Created the entry for CACP syndrome (MONDO:0008828, PRG4) from primary literature found by PubMed search, replacing the stub. Pathophysiology is an eight-node chain: biallelic PRG4 loss of function, lubricin deficiency at joint, tendon and serosal surfaces, loss of cartilage boundary lubrication with raised friction, friction-induced superficial chondrocyte apoptosis (conforms_to osteoarthritis_cartilage_degradation#Mechanical Overload and Chondrocyte Stress), fibroblast-like synoviocyte overgrowth, progressive cartilage wear (conforms_to osteoarthritis_cartilage_degradation#Cartilage Matrix Loss and Subchondral Bone Remodeling), tendon sheath dysfunction and serosal effusion. Mechanistic edges rest on the Prg4-null mouse papers (PMID:15719068, 20191580, 17968947, 23530215, 28604608) and on patient synovial pathology and protein studies (PMID:15702367, 16000300, 25642942). Twenty HP-bound phenotypes with cohort frequencies from the Saudi (PMID:23290693), Turkish (PMID:29397575) and Indian (PMID:38856641) series. ClinGen Definitive validity recorded from the CGGV assertion. Treatments include REFUTE evidence for antirheumatic and biologic drugs and for yttrium-90 radiosynovectomy, plus pericardiectomy, hip arthroplasty and preclinical recombinant lubricin. Camptodactyly, acetabular cysts, osteoporosis and mitral valve prolapse are left without an inbound causal edge because no source states their mechanism. Not cited: PMID:26508154 (no quotable text cached), PMID:24834922 (temporomandibular joint mouse phenotype, not needed), PMID:36252540 (surface-chemistry study of recombinant lubricin), PMID:34012381 and PMID:39705621 (no claim not already covered by primary series). The MONDO synonym Jacobs syndrome was omitted because it names 47,XYY in common use. No GeneReviews chapter exists. The OpenScientist deep-research report had not finished when this record was written, so no content from it is included. Validation: just validate, validate-terms, count-verified-snippets (103/103), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-genereviews and validate-disorders all passed.

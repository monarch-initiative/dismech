  summary: 'Augment OI Type XI: add explicitly-absent scleral/dental hallmark phenotypes'
  details: |
    Added two explicitly-absent OI-hallmark phenotypes to Osteogenesis Imperfecta Type XI FKBP10/FKBP65: Blue sclerae modifier ABSENT HP:0000592 and Dentinogenesis imperfecta modifier ABSENT HP:0000703, mirroring the pattern already used in Types IX/XV/XIX. Both cite PMID:22718341 Barnes et al 2012, snippet 'white sclerae, and normal dentition' from the molecularly confirmed FKBP10-null type XI proband 9. NEC/misattribution guard: verified proband 9 carries the homozygous FKBP10 c.1271_1272delCCinsA mutation and is distinct from the PPIB type IX lethal branch of the same consanguineous pedigree. Validated with just validate, just validate-references, just validate-terms all pass. Part of issue 5079 second-pass phenotype-coverage audit of OI subtypes IX-XXIII.

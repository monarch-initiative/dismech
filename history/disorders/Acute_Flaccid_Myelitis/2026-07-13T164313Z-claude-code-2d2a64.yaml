  summary: Fix cache/substring issues and drop unsupported frequency bands
  details: |
    Addressed items from issue #6433 (viral disorder review follow-up).

    Section C cache/substring fixes:
    1. Changed reference from DOI:10.15585/mmwr.mm7304a1 to PMID:38300829 (same
       paper, PMID resolves to an abstract that is verifiable). Updated snippet
       to "The number of AFM cases was low during 2019-2022", a verified exact
       substring. Updated description to match abstract language.
    2. Restored "Enterovirus D68 (" prefix in PMID:41853773 snippet — the
       original snippet "EV-D68 can cause..." skipped the opening clause that
       appears in the abstract as "Enterovirus D68 (EV-D68) can cause...".

    Section B frequency band cleanup:
    - Removed frequency: FREQUENT from Cranial nerve palsy. The backing snippet
      "with cranial neuropathy" is too fragmentary to support a frequency band.
    - Removed frequency: FREQUENT from Facial weakness. The backing snippet
      "Respiratory, axial, bulbar, facial, and extraocular muscles may also be
      affected" uses "may also" which does not map to FREQUENT (30-79%) under
      Pattern C of the frequency guidelines.
    - Bulbar palsy OCCASIONAL retained as the "may also" wording is more
      consistent with Pattern C "sometimes" -> OCCASIONAL, and the same snippet
      was already used for that band — leaving it avoids introducing a new
      inconsistency.

  summary: Review and enrich Mucolipidosis_Type_IV
  details: |
    Added MONDO synonyms, Typical and Atypical subtypes, Ashkenazi Jewish carrier and birth prevalence, classifications (Harrison's ENDOCRINOLOGY_METABOLISM/NEUROLOGIC, mucolipidosis, ICIMD complex_molecule_degradation_other), unbundled pathophysiology into 8 atomic multi-scale nodes (TRPML1 cation channel loss, polymorphic lysosomal substrate storage, CNS hypomyelinating leukodystrophy, pro-inflammatory glial activation, corticospinal and cerebellar neurodegeneration, corneal epithelial storage, progressive retinal degeneration, and parietal-cell acid-secretion defect) wired to 13 phenotypes with frequencies (adding Strabismus, Hypergastrinemia, Iron deficiency anemia, Absence seizure, and Renal insufficiency and aligning Retinal degeneration to HP:0000546), added Ashkenazi founder MCOLN1 variants (c.406-2A>G, c.-1015_789del), and enriched diagnosis and treatments including GeneReviews annual surveillance, iron supplementation, and preclinical systemic AAV.CPP.16-MCOLN1 gene therapy (PMID:38934011).

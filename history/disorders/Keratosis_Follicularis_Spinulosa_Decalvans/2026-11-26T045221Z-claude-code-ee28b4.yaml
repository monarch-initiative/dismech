  summary: 'Gene-family review: SAT1; relationship typed DISPUTED with its single
    source'
  details: |
    The SAT1 record was UNKNOWN and cited only Orphanet's candidate-gene row. The claim it records comes from a single 2002 patient with dosage-sensitive sex reversal and KFSD carrying a large Xp21.1-p22.12 duplication that spans SAT1 and NR0B1, whose cells had a polyamine profile consistent with SAT1 (SSAT) overexpression (PMID:12215835). No further SAT1 cases have been reported, and the X-linked KFSD families are explained by MBTPS2 (PMID:20672378, already cited). That is an open, unreplicated claim, which the schema types DISPUTED; the record now carries that type, the primary report as evidence, and a note. No pathophysiology node was added for SAT1.

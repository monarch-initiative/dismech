  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The entry already curated both MBTPS2 (X-linked) and CST6 (autosomal dominant) as causative genes but had no has_subtypes rows at all, so neither of MONDO:0000136's two children was bound. Both are now rows: X-linked KFSD to MONDO:0010637 with MBTPS2, and autosomal dominant KFSD to MONDO:0013018 with CST6. The second row records that the CST6 binding is this entry's inference from the inheritance mode rather than something MONDO asserts: MONDO:0013018 has no definition text and no causal-gene axiom, and OMIM's entry for it names no gene, so the attribution rests on the single mother-and-son report this entry already cites. Note that reading only the first element of MONDO:0000136's OLS description would have been misleading here - element 0 is a Strategic Refinement editor comment and the real definition is element 1. Wiring numbers unchanged at 2/3 genes and 19/19 phenotypes; the one unwired gene is an LRP1 keratosis-pilaris-atrophicans overlap row. Validation on the committed tree: just validate 0 issues, validate-terms passed, 55/55 snippets verified.

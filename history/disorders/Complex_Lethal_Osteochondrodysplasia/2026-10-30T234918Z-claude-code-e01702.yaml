  summary: 'Create: Complex Lethal Osteochondrodysplasia (TAPT1)'
  details: |
    De-novo curation of complex lethal osteochondrodysplasia (Symoens-Barnes-Gistelinck type, MONDO:0014821), autosomal recessive TAPT1 loss of function. Deep research: requested falcon, which is unavailable in this environment (agentapi not on PATH). Two reports are committed: a claude_code run used to guide enrichment (research/Complex_Lethal_Osteochondrodysplasia-deep-research-claude_code.md), and the sanctioned --fallback run which fell back from falcon to openscientist (research/Complex_Lethal_Osteochondrodysplasia-deep-research-openscientist.md, 20/20 references verified, fell_back=true). The openscientist report additionally documents a broader TAPT1 phenotypic spectrum (recessive OI + neonatal progeria, isolated early-onset cataract) and further mechanism arms (ABCA3/surfactant, SUCO, HOXC8 axial patterning, ECM/collagen) that were deliberately left out of this lethal-CLO entry: the attenuated presentations are candidate separate MONDO entries, and the extra mechanism arms are a possible follow-up. Mechanism curated as a causal chain from the founding paper (PMID:26365339, abstract only; PMC full text not reachable via proxy): TAPT1 LOF -> mislocalization/Golgi+ciliary trafficking defect -> aberrant chondrocyte/neural-crest differentiation -> skeletal hypomineralization -> prenatal fractures/fetal lethality, plus a parallel dysregulated BMP-SMAD1/5 arm from PMID:36370851. Added a zebrafish tapt1b morpholino animal model with a modeled_mechanisms link (PARTIALLY_RECAPITULATES, morpholino caveat) and a KNOWLEDGE_GAP discussion for the unresolved (and directionally paradoxical) link between the cellular lesions and in-utero hypomineralization. A second enrichment pass added four convergent mechanism arms from the openscientist report, each with verified snippets: HOXC8-dependent axial skeletal patterning (PMID:17151244, mouse), impaired collagen fibril assembly / OI overlap (PMID:37292039, patient fibroblasts), ER-resident ABCA3/surfactant dysregulation wired to the lung phenotype (PMID:42401210, mouse), and TAPT1-SUCO proteostasis failure wired to the brain phenotype (PMID:41379998, mouse). This connects the previously-stranded brain and lung phenotypes to mechanism (connectivity 4/6; kidney left unconnected, as no source gives a kidney mechanism). TAPT1's own molecular function is uncharacterized in the literature ("its cellular function remains unknown", PMID:26365339), so the TAPT1 gene node carries no molecular_functions and is grandfathered in tests/gene_activity_grounding_baseline.txt rather than bound to a fabricated GO term. Kidney binding carries coarse_binding_basis: SOURCE_UNSPECIFIED. GeneReviews: NO_CHAPTER (checked with synonyms). Validated: just validate-disorders passed, 18/18 snippets verified, entity-refs/causal-targets/coarse/duplicate-keys/enum/qualifier/delivery-system/model-scale all clean.

  summary: 'Create: Complex Lethal Osteochondrodysplasia (TAPT1)'
  details: |
    De-novo curation of complex lethal osteochondrodysplasia (Symoens-Barnes-Gistelinck type, MONDO:0014821), autosomal recessive TAPT1 loss of function. Deep research: requested falcon, which is unavailable in this environment (agentapi not on PATH); used the claude_code provider via the sanctioned fallback path instead (report at research/Complex_Lethal_Osteochondrodysplasia-deep-research-claude_code.md). Mechanism curated as a causal chain from the founding paper (PMID:26365339, abstract only; PMC full text not reachable via proxy): TAPT1 LOF -> mislocalization/Golgi+ciliary trafficking defect -> aberrant chondrocyte/neural-crest differentiation -> skeletal hypomineralization -> prenatal fractures/fetal lethality, plus a parallel dysregulated BMP-SMAD1/5 arm from PMID:36370851. Added a zebrafish tapt1b morpholino animal model with a modeled_mechanisms link (PARTIALLY_RECAPITULATES, morpholino caveat) and a KNOWLEDGE_GAP discussion for the unresolved (and directionally paradoxical) link between the cellular lesions and in-utero hypomineralization. Kidney binding carries coarse_binding_basis: SOURCE_UNSPECIFIED. GeneReviews: NO_CHAPTER (checked with synonyms). Validated: just validate-disorders passed, 18/18 snippets verified, entity-refs/causal-targets/coarse/duplicate-keys/enum/qualifier/delivery-system/model-scale all clean.

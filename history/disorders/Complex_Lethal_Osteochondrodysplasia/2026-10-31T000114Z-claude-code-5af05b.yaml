  summary: 'Create: Complex_Lethal_Osteochondrodysplasia'
  details: |
    New Disease entry for MONDO:0014821 (TAPT1). Duplicate preflight on origin/main, claims, PRs and issues found no prior coverage. Deep research was requested from falcon; it had no API key and the run fell back to openscientist (report research/Complex_Lethal_Osteochondrodysplasia-deep-research-openscientist.md, 6/6 references resolved). Content was built from PubMed directly: Symoens 2015 (gene discovery, abstract only), the allelic OI/progeroid and cataract reports, and mouse/cell studies of the TAPT1-SUCO ER complex, ABCA3 surfactant loss and SMAD1/5 regulation. Report claims not used: its statement that null alleles are lethal and hypomorphic alleles survivable (PMID:36652330 reports the reverse), its HGNC:25787 for TAPT1 (correct id is hgnc:26887), and thorax, rib, microcephaly and hydrops features attributed to the Symoens abstract, which does not contain them. No GeneReviews or StatPearls chapter (just check-genereviews). Validated with just validate, the per-file KB gates and just validate-disorders. A fresh-context review before the PR led to: removing a conforms_to on the rickets/osteomalacia mineralization module (a matrix defect does not fit it); dropping an unsupported cilium-to-neural-crest edge; downgrading the neural-crest-to-ossification edge to indirect; recording the p.Leu108Trp ciliogenesis result as NO_EVIDENCE rather than REFUTE; marking the L5Jcs1 mouse FAILS_TO_RECAPITULATE for mineralization; binding protein secretion instead of collagen biosynthesis; and saying 'survival into childhood' rather than 'survivable' for the null allele (PMID:36652330 reports deaths at 4.5 to 10 years). TAPT1 is added to tests/gene_activity_grounding_baseline.txt: its only GO molecular-function annotation (GO:0016520, TAS) stems from its old mislabelling as a cytomegalovirus gH receptor transcript, and no activity has been characterized.

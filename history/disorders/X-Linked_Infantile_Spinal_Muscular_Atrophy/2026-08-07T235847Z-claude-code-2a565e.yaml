  summary: Add the defining motor-neuron-degeneration phenotype (HP:0002398 Degeneration
    of anterior horn cells)
  details: |
    Added one phenotype recording the anatomical lesion this entry shares with the rest of the Motor Neuron Disorders grouping: HP:0002398 Degeneration of anterior horn cells.

    Why: the grouping declares a NECESSARY membership criterion (an OR over HP:0002127 / HP:0002366 / HP:0007373). This entry satisfied none of the three, so the grouping page reported a contradiction between the membership assertion and the grouping's own axioms. The entry curated downstream clinical signs (weakness, atrophy, spasticity, reflex change) but never the motor-neuron lesion itself. Note that HPO places 'Spinal muscular atrophy' (HP:0007269) under skeletal muscle atrophy rather than the motor-neuron branch, so subsumption closure alone could not resolve this.

    Evidence is quoted verbatim from PMIDs already cited by this entry wherever one carried a usable sentence; snippets were extracted programmatically from references_cache/ rather than typed, then verified. No frequency qualifier was added, since the cited snippets support the association and not a frequency band.

    Validation: linkml-validate (schema) clean; linkml-term-validator (--labels) clean; reference_snippet_audit reported 545/545 snippets verified against cached references across all 18 files changed in this tranche.

  details: |
    Alternative fix for the red main introduced by the #3632 test meeting #8165's curation. The MONITORING action 'Orthopedic surveillance and specialist management' correctly must not carry target_mechanisms, but deleting the two links (Arthrogryposis Multiplex Congenita, Scoliosis) and folding them into prose left both phenotype nodes with zero incoming treatment edges in the pathograph. Instead the links are attached to the sibling therapeutic entry 'Orthopedic and Rehabilitation Care' (therapeutic_modality BEHAVIORAL, NCIT:C15302 Physical Therapy), where target_mechanisms is legitimate, and which already cites the same GeneReviews evidence covering orthopedic consultation plus PT/OT for contractures and progressive scoliosis. Link descriptions reworded so the subject is the therapy rather than the surveillance; the 'without correcting the UBA1 lesion' framing is retained. The prose added to the MONITORING description is reverted as now-redundant. action_category MONITORING left unchanged. No evidence, ontology terms, or clinical claims changed.

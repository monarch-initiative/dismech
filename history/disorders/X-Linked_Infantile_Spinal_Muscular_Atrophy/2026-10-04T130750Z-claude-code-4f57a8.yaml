  summary: Add muscle-targeted Uba1 knockdown mouse model; refresh PMID:42402962 title
  details: |
    PMID:42402962 was already cited (from #8165) on the Skeletal Muscle-Autonomous Dysfunction node, but its cache held the online-ahead-of-print abstract and title. Refetched it: the published record has full text and a new title, so both reference_title strings were updated. Added an animal_models entry for the siRNA-electroporated mouse tibialis anterior, linked to the node as PERTURBS with fidelity LOW and model_scale TISSUE, with two readouts (protein ubiquitination and force, both DECREASED) quoted from the full text. Limitations record that it is an adult, muscle-only siRNA perturbation, not the germline variants, and has no motor neurons. Validated with just validate, validate-terms, count-verified-snippets (79/79), check-entity-refs and check-causal-targets.

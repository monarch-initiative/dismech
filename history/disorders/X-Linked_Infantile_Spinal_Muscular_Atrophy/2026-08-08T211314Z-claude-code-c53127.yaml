  details: |
    PR #8165 introduced a treatments entry with action_category MONITORING that also carried target_mechanisms links. The test test_non_therapeutic_actions_do_not_use_treatment_targets in tests/test_data.py (present since #3632) forbids treatment-style target slots on non-therapeutic actions, because those links render as treats edges in the pathograph. The two changes passed CI independently but collided on merge, leaving main red. Removed the two target_mechanisms links from the Orthopedic surveillance and specialist management action and folded their content into the description prose, matching the house pattern for MONITORING actions elsewhere in the KB such as Warsaw_breakage_syndrome and Activated_PI3K-delta_Syndrome. The action_category is correct as MONITORING: a separate therapeutic entry, Orthopedic and Rehabilitation Care, already covers the rehabilitative arm, and the removed link descriptions themselves stated the monitoring does not correct the UBA1 lesion. No evidence, ontology terms, or clinical claims changed. Validated: full tests/test_data.py 1883 passed; just validate passes; Snippets checked 74/74 verified; just validate-terms passes.

  summary: "Review: X-linked infantile spinal muscular atrophy"
  details: |
    Reviewed the SMAX2 entry for disease identity, UBA1 inheritance and
    sex-specific ascertainment, causal mechanism, phenotype and natural history,
    genetics, diagnosis and differentials, supportive management, prevalence,
    and unresolved gaps.

    Qualified the previously over-settled motor-neuron proteostasis chain;
    separated directly observed human neuropathology from model-based
    muscle-autonomous evidence; and removed blanket loss-of-function language
    across heterogeneous UBA1 variants. Added qualitative prevalence without an
    unsupported numeric rate. Distinguished SMN1-related SMA, IGHMBP2-related
    SMARD1, AR-related Kennedy disease, ATP7A-related SMAX3, and adult UBA1-related
    non-Kennedy spinal-bulbar muscular atrophy.

    Added only exact cached-reference snippets and recorded gaps in tissue
    mechanism, female penetrance/X-inactivation, sex-specific ascertainment, and
    population rate. Before this history record was created, LinkML schema and
    ontology term validation passed and 48/48 snippets were verified against the
    local reference cache.

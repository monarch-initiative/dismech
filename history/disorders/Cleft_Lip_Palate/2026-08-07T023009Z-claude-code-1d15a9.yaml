  summary: Link maternal exposures including a protective folate link
  details: |
    Backfill for issue #8085. All four entries target the lip and primary palate fusion node but run in three different directions. Anticonvulsant (first-trimester valproate) exposure is TRIGGERS as an established human teratogen. Maternal tobacco smoking and maternal alcohol consumption are PREDISPOSES, since both cited sources report risk increases of modest effect rather than deterministic teratogenic action. Maternal folate status is PROTECTS_AGAINST: its evidence is that periconceptional folic acid supplementation reduced the risk of isolated cleft lip, so the exposure runs opposite in direction to the others in the same entry. All are INDIRECT_UNKNOWN_INTERMEDIATES because no step between the maternal exposure and the fusing facial prominences is established in these sources. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged. PR review then re-routed the anticonvulsant link from the lip and primary palate node to 'Failure of Secondary Palatal Shelf Elevation and Fusion', because the cited cohort quantifies cleft palate specifically at an adjusted odds ratio of 5.2 and this entry models the two fusion events separately; the snippet was changed from the generic several-malformations sentence to that odds ratio. The smoking and alcohol meta-analyses each report the secondary-palate arm within the sentence already quoted, so both gained a second PREDISPOSES link to the same node at no new evidence cost. The entry now carries six links across two nodes in three directions. Re-validated: 39 of 39 snippets verified.

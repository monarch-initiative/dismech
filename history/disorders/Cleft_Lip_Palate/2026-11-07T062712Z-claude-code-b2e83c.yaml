  summary: Bind the four MONDO orofacial cleft gene subtypes (OFC5/10/11/15) and wire
    MSX1, SUMO1, BMP4, DLX4
  details: |
    Picks up the Cleft_Lip_Palate parent stranded by PR #12930 (issue #12263, tracked on #12931). Added has_subtypes rows bound to MONDO:0012142 (OFC5, MSX1), MONDO:0013378 (OFC10, SUMO1), MONDO:0010906 (OFC11, BMP4) and MONDO:0014772 (OFC15, DLX4), each with a primary-literature snippet. Added SUMO1, BMP4 and DLX4 genetic records and keyed the existing MSX1 record to OFC5. Wired all four genes into the pathograph via three new molecular-function nodes (homeodomain TF haploinsufficiency for MSX1/DLX4, reduced sumoylation for SUMO1, reduced BMP4 signaling) with edges to the two fusion-failure nodes. SUMO1 and DLX4 are typed UNKNOWN (one or two families, no ClinGen classification); MSX1 and BMP4 leave relationship_type unset. Validated with just validate, validate-terms, count-verified-snippets (61/61) and the causal-target, entity-ref, gene-activity, name-collision, snippet and enum gates.

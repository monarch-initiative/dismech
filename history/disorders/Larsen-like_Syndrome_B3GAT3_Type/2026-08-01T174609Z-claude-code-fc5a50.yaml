  summary: 'Create: Larsen-like Syndrome B3GAT3 Type'
  details: |
    De novo curation of Larsen-like syndrome, B3GAT3 type [MONDO:0009511, OMIM 245600, B3GAT3 / hgnc:923], the GlcAT-I linkeropathy. NEC preflight against the MONDO record confirmed gene B3GAT3 and OMIM:245600 before any deep-research content was used; duplicate preflight against origin/main, all PRs and all issues -- including synonyms JDSCD, B3GAT3-related linkeropathy, GlcAT-I deficiency -- found no existing entry. Deliberately kept distinct from Larsen_Syndrome [FLNB, MONDO:0007875], Spondylodysplastic_Ehlers-Danlos_Syndrome [B4GALT7/B3GALT6/SLC39A13, MONDO:0007526] and CHST3-related skeletal dysplasia [MONDO:0007738]; all three are modeled as differential diagnoses instead. Deep research: Edison/falcon, at research/Larsen-like_Syndrome_B3GAT3_Type-deep-research-falcon.md, which corroborated the identity anchors and contributed the zebrafish b3gat3 model and the CHST3 differential as leads. Curated a seven-node pathograph running from GlcAT-I loss of function through incomplete tetrasaccharide linker assembly and combined heparan plus chondroitin/dermatan sulfate proteoglycan deficiency to a proteoglycan-deficient ECM branching into skeletal, articular and cardiovascular arms; 24 phenotypes with HPO terms; a B3GAT3 genetic block; autosomal recessive inheritance; a CASES_IN_LITERATURE prevalence record; two progression phases; two diagnostic modalities; seven differential diagnoses; four supportive treatments; the zebrafish animal model; one EMERGING mechanistic hypothesis on the catalytic-subdomain severity gradient; and three discussions, two KNOWLEDGE_GAP plus one HUMAN_MODEL_MISMATCH on the zebrafish CS-versus-HS asymmetry. Every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract. Validation: just validate PASS, just validate-terms PASS, just validate-references PASS with 91/91 snippets verified.

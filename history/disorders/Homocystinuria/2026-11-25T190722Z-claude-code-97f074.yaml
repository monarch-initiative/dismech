  summary: 'Gene-family review: MTHFR record typed; NADPH-specific reductase term'
  details: |
    The MTHFR record (remethylation-defect homocystinuria) was untyped with no variant origin and an unbound inheritance block; it is now typed CAUSATIVE with germline origin and the block bound to autosomal recessive (HP:0000007), quoting GeneReviews (PMID:40440437). ClinGen's MTHFR Definitive assertion is for MONDO:0009353 homocystinuria due to MTHFR deficiency, narrower than this entry's MONDO:0004737, so it is not copied. The MTHFR node bound the cofactor-ambiguous methylenetetrahydrofolate reductase [NAD(P)H] activity (GO:0004489); human MTHFR uses NADPH, and the node now binds the child term methylenetetrahydrofolate reductase (NADPH) activity (GO:0106313), the term ai-gene-review gives as the gene's core function.

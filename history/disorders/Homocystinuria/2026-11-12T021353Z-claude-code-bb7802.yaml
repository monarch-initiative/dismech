  summary: 'Evidence-claim mismatch review: Homocystinuria'
  details: |
    Reviewed the Jev evidence_claim_match assessments for issue 16986 against the current entry (source sha unchanged since assessment). Repaired the four root-level MISMATCH findings: (1) the Disrupted transsulfuration -> Cysteine edge cited an ERT mouse-model sentence about reduced homocysteine as CBS substrate; replaced with PMID:34449521 stating reduced CBS activity lowers cystathionine and cysteine (HUMAN_CLINICAL, quote_role BACKGROUND). (2) The Cysteine biomarker carried the same ERT sentence; replaced with PMID:32232970 stating HCU is characterized by decreased cysteine levels (BACKGROUND). (3) The total homocysteine biomarker cited a prevalence-study methods sentence (PMID:38962401) and a definitional sentence from PMID:39567721 whose explanation claimed measured elevation; replaced with the guideline recommendation to measure plasma tHcy (PMID:27778219) and the PMID:39567721 result sentence reporting mean tHcy 102 vs 8.9 umol/L in controls. (4) Autosomal recessive inheritance cited a sentence that never mentions inheritance (PMID:36417581); replaced with the GeneReviews sentence (PMID:20301697). Also added two GeneReviews evidence items to Thrombosis prevention (third-trimester/postpartum LMWH prophylaxis; avoidance of oral contraceptives, surgery, immobilization), which previously had only a review sentence on thromboembolism risk. Retained without change: ORPHA:394 phenotype-frequency rows on causal edges (they support that the downstream phenotype occurs, which is the claim component they are cited for; flagged PARTIAL, not wrong); the PMID:36417581 item on Homocysteic acid neuroexcitotoxicity, whose explanation already limits it to cognitive impairment as a complication while the NMDA mechanism rests on PMID:1676834. Validated with just validate-disorders (184/184 snippets verified), check-snippet-grading, check-reference-titles, check-title-snippets, check-snippet-length, check-retired-support-prose.

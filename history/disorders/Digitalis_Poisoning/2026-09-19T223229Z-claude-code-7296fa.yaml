  summary: 'Create: Digitalis_Poisoning (MONDO:0017863)'
  details: |
    New entry for digitalis poisoning, bound to MONDO:0017863, with a
    skos:broadMatch to MONDO:0800388 cardiac glycoside intoxication. Chosen because
    it had no entry and no stub despite fourteen MONDO poisoning terms being
    uncurated, and because the mechanism is a single enzyme lesion whose whole
    clinical picture follows by ion-gradient arithmetic - unlike the transporter and
    transcription mechanisms curated immediately before it.

    Deep research: `just research-disorder claude_code Digitalis_Poisoning`. This run
    completed cleanly and wrote both validation blocks itself, unlike the amatoxin
    run. Reference validation: 35 references, 34 verified, 0 not found, 1 off topic
    (PMID:40660117, on Na/K-ATPase toxin resistance in a serpent-eagle preying on
    cane toads - real and mechanistically adjacent, but not about the human
    disease). Term validation: 41 terms, 6 mislabelled.

    `just preflight-dr <report> MONDO:0017863` returned SKIP, because MONDO records
    no causal gene for a poisoning and the gene-identity check cannot discriminate.
    The manual identity check the skill prescribes was done instead: the report's
    content matches MONDO's own definition point for point (increased automaticity
    with decreased conduction; acute nausea/vomiting, bradycardia, block,
    dysrhythmia, CNS features and hyperkalemia; chronic GI, mental-status and visual
    disturbance). The gene profile the preflight printed is corroborating rather than
    discriminating but points the same way - ABCB1, SLCO1B3, ATP1A1, ATP1A2 are
    exactly the transporter and pump genes this poisoning turns on.

    No CURIE was taken from the report. Its six mislabelled terms were checked for
    individually and none appears in the entry: HP:0000496 offered as "Halo vision"
    is Abnormality of eye movement, HP:0011703 offered as "Atrioventricular block" is
    Sinus tachycardia, UBERON:0002205 offered as "AV node" is manubrium of sternum,
    UBERON:0002136 offered as "Purkinje fiber cell tissue" is hilus of dentate gyrus.
    Two further CURIEs the report suggested were wrong without being flagged, because
    the report gave them no label the validator could compare: CL:0002129 offered as
    "cardiac pacemaker cell" is regular atrial cardiac myocyte, and CL:1000497
    offered as Purkinje myocyte is not that term - the correct one is CL:0002068.

    One binding decision is worth recording because the obvious term is the wrong
    one. For xanthopsia the entry binds HP:0000551 Color vision defect, not
    HP:0007641 Dyschromatopsia, even though the latter reads as more specific:
    OLS gives HP:0007641 the definition "A form of colorblindness in which only two
    of the three fundamental colors can be distinguished due to a lack of one of the
    retinal cone pigments", which is congenital dichromacy and not an acquired drug
    effect. HP:0000551's definition and its "Disturbed color vision" synonym fit. The
    reasoning is recorded in the phenotype's own notes. This is the same
    looks-more-specific-but-means-something-else trap that cost PR #12297 a round.

    Snippets were pre-verified as exact substrings before the YAML was written: 23
    candidates checked, 22 passed, and the one failure was a thin space before "µM".
    Two further whitespace and bracket problems surfaced during validation. The
    first was the same thin space, extracted from the cache by regex rather than
    retyped. The second is more interesting: the reference validator strips
    "[Ca2+]" from a quoted conclusion as a numeric citation marker, leaving
    "cytosolic i-" which then cannot match. Rather than fight the normaliser the
    entry quotes the paper's result sentence instead, which states the control
    directly - calcium-current inhibition present both with and without the pump
    blocked by ouabain - and the explanation says why that sentence was chosen.

    Agent conflation was the main curation risk and is handled explicitly in the
    evidence rather than silently. PMID:7267327 is a digitoxin series, not digoxin,
    and every explanation citing it says so. PMID:17054261 and both randomised
    trials it reports are yellow oleander, and the treatment explanations say so.
    PMID:28550304's effect is strongest for bufadienolides, which are toad-derived,
    and the hypothesis description says so. PMID:15461240 is swine. PMID:20587052
    was fetched and deliberately not cited: it is a study protocol with no results,
    so it cannot support an efficacy claim.

    Pathophysiology is 15 nodes in one connected chain - pump inhibition, sodium
    accumulation, loss of NCX calcium extrusion, sarcoplasmic reticulum overload,
    spontaneous diastolic release, delayed afterdepolarization, triggered
    automaticity - with the vagal, potassium-shift, direct-channel-block and
    extracardiac branches joining it. All 11 phenotypes are causally connected.

    Three hypothesis groups, all wired: nka_calcium_overload_dad (CANONICAL, 7
    edges), extracardiac_pump_inhibition (EMERGING, 6), nka_independent_channel_block
    (EMERGING, 2). The last is graded EMERGING rather than ALTERNATIVE because it
    adds a mechanism rather than displacing one.

    Three deliberate REFUTE items, each scoped to a claim rather than a mechanism.
    PMID:15461240 refutes the claim that intravenous calcium worsens outcome in
    digitalis hyperkalemia, in swine and at one dose, and the same paper is also
    cited as SUPPORT for the existence of the contraindication it tests.
    PMID:22737544 refutes the "100% mortality above 5.5 mEq/L" figure as an absolute,
    which a single survivor is sufficient to do, while the same paper is cited as
    SUPPORT for the stratification itself. Neither refutation touches the
    potassium-mortality association, which the prognostic series supports.

    Three corrections made during curation, all before the red-team round. An
    earlier draft described bidirectional ventricular tachycardia as close to
    diagnostic; PMID:34159036 names six other causes, so the description now states
    the differential and cites it. An earlier draft attached a two-word snippet
    "bidirectional tachycardia" to PMID:8492338, which does not contain the word at
    all - that was an assumption rather than a reading, and it was replaced with two
    real sentences from a case report that does. Three phenotypes (nausea, vomiting,
    confusion) were left isolated by the first draft and are now wired through an
    extracardiac pump-inhibition node that is explicitly marked as an inferred site
    of action rather than a demonstrated one.

    One process failure to record: HP:0001695 for Cardiac arrest and CHEBI:18208 for
    benzylpenicillin in the sibling amatoxin entry were both written from memory
    rather than from a lookup. Both happened to be correct and both were checked
    immediately afterwards, but correct-by-luck is not the standard this entry is
    built to, and the same slip has now occurred in two consecutive entries.

    A pre-PR red-team review by a fresh-context subagent against
    `dismech-pr-review` returned 29 findings, six of them blocking. All six were
    acted on, along with most of the rest, before the first push. The review was
    unusually valuable because none of its blocking findings is caught by any gate
    in this repository - the entry passed a clean `just validate` while carrying
    all six.

    The worst was structural and self-inflicted. Nine of fifteen pathophysiology
    nodes carried no evidence at all, and they were exactly the canonical chain the
    entry is built around - pump inhibition, sodium accumulation, exchanger failure,
    calcium overload, spontaneous release, afterdepolarization, triggered
    automaticity, vagal tone, conduction block - while the peripheral EMERGING
    channel-block node carried two exact quotes. The CANONICAL hypothesis group had
    no evidence anywhere in the file. The quotes were sitting in caches this branch
    already commits. PMID:34159036 and PMID:28550304 now evidence the pump, sodium
    and calcium steps as BACKGROUND quotes, and PMID:1257581 - the classical canine
    Purkinje-fibre strophanthidin study, cached and previously unused - now
    evidences the afterdepolarization and automaticity nodes.

    Second, the ECTO justification note was false, which is the precise defect class
    CLAUDE.md records under "that recorded reason is itself a claim" (dismech#7835).
    The note said ECTO has no digitalis exposure class. Re-running the exact search
    it names returns ECTO:9000003 exposure to digitalin, and its parent
    ECTO:9000436 exposure to glycoside. Both were then examined properly and both
    rejected on real grounds - digitalin is one specific compound of Digitalis
    purpurea and almost no patient in this entry is exposed to it, and "glycoside"
    names a chemical class whose other members include the aminoglycoside
    antibiotics, so it picks out the wrong feature of the molecule. The binding
    stays ECTO:0000537, but the note now says what the searches actually returned.
    Writing a false negative-existence claim while having a section of this very
    record about that failure mode is worth stating plainly rather than burying.

    Third, a comparative prognostic claim appeared four times - that serum potassium
    predicts death better than the drug level - and no cited source makes it. The
    one prognostic series in the entry ranks nothing; it lists potassium alongside
    age, sex, atrioventricular block and prior heart disease. All four instances
    were rewritten.

    Fourth, `Increased Vagal Tone` had no causal upstream edge. Half the toxidrome -
    the bradycardia and block limb - hung off nothing, while the top-level
    description asserted in prose that the drug causes it. `check-causal-targets`
    passes this because it asks whether declared targets resolve, not whether a node
    is reachable. An edge from the trigger node was added with evidence.

    Fifth and sixth were internal contradictions. The phenotype description had been
    corrected to say bidirectional ventricular tachycardia is not specific to this
    poisoning, with a citation naming six other causes, while the pathophysiology
    node sixty lines away still called it close to pathognomonic. And Fab was
    described as the only treatment with randomised evidence while charcoal, two
    entries later, was described the same way - both from the same Cochrane review,
    which identified two trials.

    Beyond the blocking six: the channel-block node's agent caveat was materially
    understated. The paper's two cardenolides - the class digoxin belongs to -
    showed about 10 to 15 per cent inhibition with IC50s above 100 micromolar, which
    is essentially nothing, and digoxin itself was never tested. A REFUTE item
    carrying that sentence was added and the node description rewritten to say so.
    The Cochrane review's own non-transferability sentence, which says antidote
    results from yellow oleander cannot be readily translated to other cardenolides,
    was omitted from a discussion whose entire subject is whether they transfer; it
    is now recorded as a REFUTE against the entry's own mechanistic transfer
    argument. The cached negative ABCB1 pharmacokinetic study was unused while the
    positive post-mortem association was cited; both are now present. Three
    quote_role values were wrong against the deterministic NLM-section checker and
    are now correct, taking `just list-background-citations` to zero findings.
    `Triggered Ventricular Automaticity` was renamed `Triggered Automaticity`
    because a ventricular focus cannot produce the junctional rhythm the entry hangs
    off it. Two animal models were added. Atrial tachycardia with block, which the
    literature calls the classic pattern, was added from a cache the entry already
    cited. The serum-potassium diagnosis binding moved from the bare root
    NCIT:C18020 to NCIT:C61030 Serum Potassium Measurement after confirming its
    ancestry. Phenotype connectivity went from 11/11 to 12/12 and no pathophysiology
    node is now unreachable.

    Validation: `just validate-disorders` reports 44/44 snippets verified, schema and
    term validation passing. Clean: check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms,
    check-snippet-grading, check-title-snippets, check-snippet-length,
    check-folded-hyphens, check-environmental-evidence, check-case-collisions,
    check-reference-titles, check-not4curation, validate-history. All 12 distinct
    reference titles were written programmatically from cache frontmatter and
    re-checked after assembly.

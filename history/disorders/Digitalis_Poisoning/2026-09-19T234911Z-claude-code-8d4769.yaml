  summary: 'Review round 1: ECG diagnosis, acute/chronic subtypes, potassium bands'
  details: |
    Review round 1 on PR #12307 (ai4c-reviewer, changes_requested): two blocking
    content-completeness findings and six non-blocking suggestions, all answered in this
    single push, because main dismisses stale approvals.

    BLOCKING 1 - diagnosis: had no ECG entry. The section held only serum potassium and
    serum digoxin concentration, while the entry curates seven ECG-diagnosed arrhythmia
    phenotypes with no modality behind any of them. Added "Electrocardiography and
    continuous cardiac monitoring", bound to NCIT:C217427 Diagnostic Electrocardiography
    Testing, with two cited quotes: PMID:8492338 for the ECG as one of three findings that
    make the acute diagnosis, and PMID:34159036 for a worked instance. The description
    states explicitly that no ECG pattern here is specific to digitalis.

    BLOCKING 2 - acute / chronic / acute-on-chronic was prose in one node description
    rather than modeled. Added has_subtypes with the three presentations, each
    independently evidenced: PMID:38505194 for the presenting-feature split, PMID:39219774
    for the chronic time course and for acute-on-chronic as a recognised category, and
    PMID:41399569 for a worked acute-on-chronic case. The Hyperkalemia phenotype now
    carries subtype: Acute, which was the substantive consequence the reviewer named - the
    entry previously read as if hyperkalemia were a general feature of digitalis toxicity.
    The serum potassium diagnosis entry was already scoped in its own name and needed no
    change; the Diagnosis class has no subtype slot in any case.

    REVIEWER CURIES WERE VERIFIED BEFORE BINDING, per the rule filed this session as PR
    #12308. NCIT:C217427 and NCIT:C217390 both resolve in the local NCIT build with the
    labels the review gave, and `ancestors -p i` puts both under NCIT:C18020 and
    NCIT:C25218, the TreatmentActionTerm root that diagnosis_term requires. The reviewer's
    claim that C217390 Diagnostic Blood Testing is strictly narrower than the bound C18020
    Diagnostic Procedure is correct, so the serum digoxin binding was retargeted and its
    note rewritten to record the digoxin search verbatim.

    ONE REVIEWER ATTRIBUTION WAS WRONG AND IS RECORDED AS SUCH. The review asked for the
    potassium prognostic bands as structured interpretation_bands and said "PMID:7267327 is
    already cited". That abstract does not carry the bands: it reports 17% overall
    mortality in 179 patients and a 2-74% range across four clinical factors, and names no
    potassium threshold. The bands come from PMID:22737544, which this entry already cited
    for exactly that sentence. The new biochemical: block cites PMID:22737544, with the
    correction stated in its own notes.

    I WROTE A CURIE FROM MEMORY AGAIN, AND THIS TIME IT WAS WRONG. Drafting the pacing
    treatment I wrote NCIT:C62111 as "Cardiac Pacemaker"; it is Neoplastic Ghost Cell. In
    the same block I wrote treatment_effect: MITIGATES, which is not in
    TreatmentEffectEnum. Both were caught by looking them up in the same pass, not by a
    gate. Corrected: the device qualifier binds NCIT:C94198 Cardiac Pacemaker (OLS exact
    search; confirmed NOT reachable from C25218, which is correct for a device sitting in a
    qualifier value slot), the treatment_term binds NCIT:C99998 Pacemaker Procedure
    (verified reachable from C25218, and more specific than the NCIT:C15329 Surgical
    Procedure first written), and the effect is BYPASSES - which is also the more accurate
    claim, since pacing paces through the block rather than relieving it. Recorded because
    the previous record for this entry carries the same confession about a CHEBI identifier
    that happened to be right.

    NON-BLOCKING, TAKEN: the NCIT:C217390 retarget; the biochemical: block with three
    interpretation_bands; a Temporary Cardiac Pacing treatment carrying both the cited
    review's recommendation and its warning; the FDP trial recorded in clinical_trials:
    against ICTRP:ISRCTN71018309, whose registration number came from the protocol paper
    PMID:20587052 that this entry had fetched and declined to cite for efficacy; and the
    GeneReviews note corrected from UNTAGGED_CHAPTER to CITED_UNTAGGED, re-run to confirm.

    NON-BLOCKING, DECLINED WITH REASONS RECORDED IN notes:. The sympathetic limb of the
    autonomic branch stays out. The only cached sentences stating it are in veterinary
    oleander papers this entry screens out as a different host, and a PubMed search for a
    human source returns heart-failure pharmacology in which digoxin is sympatho-inhibitory
    at therapeutic concentrations - the opposite sign to the toxic-dose claim - so binding
    one would assert the wrong direction. GO:0055075 on the ORGANISM-scale Extracellular
    Potassium Shift node also stays: GO's only alternative, GO:0030007 intracellular
    potassium ion homeostasis, asserts the wrong compartment for a node about potassium
    leaving cells.

    VALIDATION. just validate passes schema, terms and references with 57/57 snippets
    verified against cached references, up from 44. Every new snippet was pre-verified as
    an exact substring before the YAML was written. 12/12 phenotypes remain causally
    connected. check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values and check-qualifier-terms all pass; check-qualifier-terms-online
    resolves the two device qualifier CURIEs, which the offline gate cannot see because
    nothing else in the KB binds them. All 55 reference_title values were re-derived from
    cache frontmatter and match.

  details: |
    Bound LOINC:2823-3 (Potassium, Serum or Plasma) as loinc_term on the existing Serum potassium biochemical marker, which already carried a full reference_ranges/interpretation_bands block (the antidote-decision potassium thresholds) -- the code now keys that existing grading, the same shape used for Iron_Poisoning's serum iron marker. Also bound the same code as measurements on the parallel 'Serum potassium in acute poisoning' diagnosis row, and LOINC:10535-3 (Digoxin, Mass/volume, Serum or Plasma -- the total-digoxin assay, not the Digoxin Free variant, matching the row's own discussion of why the total assay cannot distinguish bound from free drug after Fab) on the 'Serum digoxin concentration' diagnosis row. Corrected a stale note on the potassium marker's reference_ranges block, which stated LOINC could not be validated by anything in this repository; that was true before scripts/seed_loinc_cache.sh existed and is not true now.

  summary: 'Create: Sanjad-Sakati Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0040 (TBCE, OMIM 241410). Deep research: claude_code provider. NEC preflight returned WARN: the expected gene TBCE is dominant (55 mentions) but the report cites OMIM 604934 and 617207 rather than 241410 - 604934 is the TBCE gene MIM and 617207 is the allelic TBCE encephalopathy with distal spinal muscular atrophy, a different disease. Those sections were excluded and the entry was built from primary literature instead (PMID:12389028 gene discovery, PMID:19554981 Kuwaiti series, PMID:42433342 Jordanian series). No GeneReviews chapter exists for this disorder; a PubMed search returned no hits. Pathophysiology is a chaperone-disease chain: TBCE loss to reduced microtubule density to disturbed Golgi/endosomal trafficking, with the parathyroid link marked PARTIAL because the source states it as a potential connection rather than a demonstrated one. Validation: schema clean, term validation passed, 27/27 snippets verified.

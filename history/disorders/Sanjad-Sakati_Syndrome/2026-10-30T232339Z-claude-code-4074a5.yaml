  summary: Add AR Kenny-Caffey syndrome as a subtype
  details: |
    Resolved stub MONDO:0009486 (autosomal recessive Kenny-Caffey syndrome) as a SUBTYPE of this entry rather than a separate disease. PMID:12389028 maps HRD and AR-KCS to the same TBCE locus with a shared founder haplotype and calls both chaperone diseases of the tubulin assembly pathway, so there is no separate pathograph. Added an AR-KCS has_subtypes row bound to MONDO:0009486 with TBCE, and an osteosclerosis phenotype (HP:0011001, whose HPO exact synonym is Osteosclerosis) stratified to it and wired from the growth-failure node with INDIRECT_UNKNOWN_INTERMEDIATES. Deleted the stub. Validated with just validate, validate-terms, count-verified-snippets (47/47), and the entity-ref, causal-target, enum, duplicate-key and coarse-phenotype gates.

  summary: 'Address review: ectropion, accepted-case frequencies, and phenotype specificity'
  details: |
    Addressed independent review of PR 12949. Added ectropion and routed anterior lamella deficiency through ectropion to lagophthalmos; added photophobia. Corrected sparse scalp hair to FREQUENT using 75% in the 16 accepted cases of De Maria 2016 and incorporated other directly matching Table IV bands. Recorded ascertainment and minimum-observed-frequency limits. Removed separate absence-only eyebrow/eyelash bands because the table combines sparse and absent; recorded combined nipple, genital and syndactyly frequencies without assigning them to narrower terms. Qualified growth and changed domain-variable developmental delay to HP:0012758. Added verified NCIT tracheostomy binding and surgery modality to the airway intervention. Named all four PDF articles in disease notes because PublicationReference has no notes slot. OAK verified new HP and NCIT bindings; final validation recorded in PR reply.

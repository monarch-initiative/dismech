  summary: 'Create: Ablepharon Macrostomia Syndrome'
  details: |
    Created the Ablepharon-Macrostomia Syndrome entry (MONDO:0008693; TWIST2 p.Glu75Lys, autosomal dominant). Sources: the OpenScientist deep-research report research/Ablepharon_Macrostomia_Syndrome-deep-research-openscientist.md (25/25 references resolved; two flagged off topic; term validation flagged HP:0011500 as Polycoria, so Ablepharon is bound to HP:0011224 after an OLS lookup), plus a PubMed title/abstract search for "ablepharon". just preflight-dr returned WARN only because the report also cites OMIM 227260 (Setleis syndrome) as a differential; the report header, causal gene (TWIST2, 50 mentions) and OMIM 200110 match the intended disease. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER) and ClinGen has no TWIST2 gene-validity row. Frequency bands are assigned only where a cited abstract states a proportion (for example the 2002 series and a 2019 literature review). The pathograph runs from the Glu75Lys substitution through altered DNA binding and dysregulated mesenchymal transcription to eyelid anterior-lamella, dermal matrix, hair-follicle, craniofacial and oral-commissure nodes, with the dominant-negative and neomorphic models kept as parallel mechanistic hypotheses as in the Barber-Say entry; 24 of 35 phenotypes are causally connected. Added the heterozygous zebrafish twist2 p.Glu78Lys knock-in (PMID:33272268) from the report. Report references not used: PMID:20980404 and PMID:18231602 (Wnt/beta-catenin control of Dermo1 expression and mesenchymal lineages, upstream of the lesion rather than part of it), PMID:19609939 (TWIST genes in adult mesenchymal stem cells), PMID:21109964 (TWIST2 promoter methylation in cancer lines), PMID:37493047 (cryptophthalmos cohort that does not mention AMS). Three AMS papers cached without quotable text (PMID:10721975, 11746001, 33689605) and are named in notes as leads. Full-text quotes: the reference validator currently refuses the cached full text of PMID:26119818 and PMID:28690482 (issue #12672), so every evidence item quoting their full text was either re-cited to a sentence from the same paper's abstract, re-cited to another cached paper, or removed. This removed the clinical-table frequency bands, the phenotypes supported only by that table (cleft ala nasi, hypoplastic labia majora, anteriorly placed anus, Blaschko-line pigmentation in mosaic fathers), the skin electron microscopy behind the dermal matrix node (now HYPOTHETICAL), and the ChIP-seq peak counts; omphalocele was replaced by ventral hernia, which an abstract supports. Validation: schema and term validation pass, count-verified-snippets reports 155/155, and validate-disorders reports 0 issues.

  details: |
    Round 1 review fixes on PR 14417. (1) Added ten phenotypes from the pooled 16-patient table (Table 2) in the full text of PMID:41040850, each quoting its exact table row and with frequency bands mapped as elsewhere in the entry: Lethargy (7/8, VERY_FREQUENT), Ventriculomegaly (11/14), Communicating hydrocephalus (6/12), Widened subarachnoid space (6/15), Thin corpus callosum (8/14), Abnormal thalamic MRI signal intensity (8/11), Focal T2 hyperintense basal ganglia lesion (8/12), Abnormal brainstem MRI signal intensity (4/11), all FREQUENT, Subdural hemorrhage (2/15, OCCASIONAL; table row reads Subdural haematomas) and Death in infancy (8/16, FREQUENT). HP labels were taken from OLS lookups. Death in infancy is left unbound: HP:0001522 sits under HP:0011420 Age of death in the clinical-modifier branch, not under Phenotypic abnormality, and failed PhenotypeTerm enum validation when bound. Most new phenotypes are wired from Neuronal Dysfunction and Neurodegeneration. The thalamic and basal ganglia phenotypes are also wired from Impaired Mitochondrial Respiration, citing the authors' Leigh-like observation. Subdural hemorrhage is left unwired, as intracranial hemorrhage is. (2) Renamed the node Dopamine Beta-Hydroxylase Deficiency to Reduced Dopamine Beta-Hydroxylase Abundance; the old name no longer occurs in the entry. (3) Added PMID:39878654 CTR1-knockout edge evidence to the CTR1 Copper Import Dysfunction edges to the DBH and mTORC1-S6K nodes. (4) The Systemic Copper Deficiency edge description now says the genotype-phenotype correlation is proposed only for pore-disrupting alleles. The claude_code deep-research report and its citations sidecar are now committed unedited, on the requester's decision, rather than held back. Validation: just validate, validate-terms, count-verified-snippets (99/99), check-reference-titles, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check_gene_activity_grounding against origin/main and validate-disorders passed.

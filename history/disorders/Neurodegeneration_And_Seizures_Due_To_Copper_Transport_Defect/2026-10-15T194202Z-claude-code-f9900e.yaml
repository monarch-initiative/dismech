  summary: 'Create: Neurodegeneration_And_Seizures_Due_To_Copper_Transport_Defect'
  details: |
    New entry for the SLC31A1 (CTR1) recessive copper-transport encephalopathy, MONDO:0957211. Deep research: falcon was requested but failed three times with '503 Failed to authenticate' (twice plain, once with dr_fallback='--fallback', which does not hand over on this error class), so the one report was produced by the claude_code provider. That report was used only as a source of leads and is not committed with this entry: it is held back pending a maintainer decision because its generated frontmatter records model identifiers. The report could not reach PubMed or PMC and quotes no abstracts; preflight-dr returned PASS (SLC31A1 mentioned 17 times, OMIM 620306 matched), and its 7 references all resolved. It was used only for leads; every claim was taken from primary sources fetched with just fetch-reference: the index twin report (PMID:35913762, abstract only; PMC full text not retrievable), the congenital case (PMID:36562171), the 13-patient series with pooled 16-case table (PMID:41040850, full text), CTR1-knockout neuronal cell studies (PMID:39878654, PMID:42126960) and Ctr1 mouse knockouts (PMID:11391004, PMID:11391005, PMID:16950140, PMID:35433682). Key judgement calls: serum copper and ceruloplasmin are recorded as low only in 2 of 8 tested patients (not as a hallmark); a REFUTE item records normal copper uptake and CTR1 protein in p.His120Gln fibroblasts, with a KNOWLEDGE_GAP discussion on import versus intracellular trafficking; functional_impact_category PARTIAL_LOSS_OF_FUNCTION rests on the absence of biallelic null patients and mouse null lethality; DBH deficiency is supported only in CTR1-knockout cells; no gene_disease_validity recorded because no ClinGen record exists (the authors' own Moderate score is noted only). Intracranial hemorrhage, tortuous cerebral arteries, pulmonary hypoplasia and failure to thrive are left without a mechanism edge. Validation: just validate, validate-terms, count-verified-snippets (84/84), validate-disorders (84 snippets, 0 issues) and the offline gates all passed; check-genereviews --online reports NO_CHAPTER.

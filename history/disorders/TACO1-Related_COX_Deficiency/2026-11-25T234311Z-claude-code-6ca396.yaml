  summary: 'Gene-family review: TACO1'
  details: |
    TACO1's mechanism was updated from a COX1-specific translational activator to a mitochondrial translation elongation factor: TACO1 is the mitochondrial EF-P/eIF5A counterpart that alleviates mitoribosome stalling at polyproline stretches and is required for rapid synthesis of the polyproline-rich COX1 and COX3 (PMID:39036954, newly cited with two snippets). The TACO1 node now binds GO:0003746 translation elongation factor activity (DECREASED); the node, entry description, classification note, genetic features and entry notes were revised to match. The genetic record's inheritance is bound to HP:0000007 and a note records ClinGen's Definitive (mitochondrial disease) and Moderate (Leigh syndrome) tiers, neither being this entry's MONDO:0033638; CAUSATIVE is kept.

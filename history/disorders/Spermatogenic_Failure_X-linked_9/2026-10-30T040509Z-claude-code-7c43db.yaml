  summary: 'Create: RBBP7-Related X-linked Spermatogenic Maturation Arrest'
  details: |
    Curated a new dismech entry for MONDO:0976123 (spermatogenic failure, X-linked, 9 / RBBP7). Primary sources: Li et al. 2023 J Clin Invest PMID:37843278 (two-brother family, hemizygous RBBP7 frameshift c.1200dupA/p.W401Mfs*5, structural modeling of loss of histone H4/BRCA1 binding, mouse GC-1/GC-2 cell-line knockdown, Drosophila Caf1-55 germline- vs cyst-cell-specific knockdown, concurrent benign Leydig cell tumor) and Riera-Escamilla et al. 2022 Am J Hum Genet PMID:35809576 (2,354-man X-chromosome exome screen; RBBP7 the most recurrently affected gene, cohort burden test, independent Drosophila Caf1-p55 germline stem cell maintenance confirmation). Modeled a two-branch pathograph: a germline-autonomous arm (variant -> impaired RBBP7-histone H4/BRCA1 binding -> reduced BRCA1-mediated DNA repair -> germ cell cycle arrest/apoptosis -> germ cell depletion/maturation arrest -> azoospermia/small testes/elevated FSH) and a somatic-tumor arm (same DNA-repair-failure node -> testicular somatic cell hyperproliferation -> Leydig cell tumor), linked via an EMERGING mechanistic_hypotheses entry (rbbp7_shared_dsb_repair_and_tumor_risk) and an open KNOWLEDGE_GAP discussion questioning whether the tumor association generalizes beyond the single founding kindred. No GeneReviews/StatPearls chapter exists (just check-genereviews --online: NO_CHAPTER). No external gene-disease validity classification (e.g. ClinGen) has been published for this association, noted in genetic[].notes rather than assigned. Added a GO:0042393 (histone binding, DECREASED) molecular_functions binding on the RBBP7-carrying node to satisfy check-gene-activity-grounding. Deleted the corresponding stub (stubs/Spermatogenic_Failure_X-linked_9.yaml). Validation: just validate, just validate-disorders, just count-verified-snippets (43/43 verified), just validate-terms, just check-genereviews --online, just check-gene-activity-grounding, just check-snippet-grading, just check-causal-targets, just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-delivery-system, just check-logical-rules, just check-coarse-phenotypes, just check-qualifier-terms, just check-block-scalar-comments, just check-folded-hyphens, just check-title-snippets, just check-reference-titles, just check-retired-support-prose, just check-source-defect-claims, just check-shared-disease-terms all pass. Claimed via GitHub issue #15974 before curating; duplicate preflight against origin/main (git grep by MONDO ID, label, gene symbol) and open-PR search (REST API, since GraphQL search is unavailable in this session) found no existing coverage or in-flight PR.

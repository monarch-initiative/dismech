  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Creates the differential_diagnoses section, directly after treatments:, with a Neuroblastoma row. A review of infantile hepatic haemangioma (Gnarra 2016, PMID:27610342) lists metastatic neuroblastoma and hepatoblastoma among the differentials of a focal liver lesion in an infant; the row keeps that statement to the review's own scope. Four distinguishing features, including serum AFP and imaging, from a pedunculated-hepatoblastoma case report (PMID:36997898, stated as a pitfall) and von Schweinitz 2006 (PMID:16458842, the same sentence and grading already used elsewhere in this entry). No PHOX2B item, for the same reason as the LCH row. Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

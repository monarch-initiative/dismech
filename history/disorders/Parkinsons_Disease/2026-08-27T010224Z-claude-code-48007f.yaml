  summary: Add pontine REM-atonia mechanism nodes conforming to rem_sleep_atonia_control_failure
  details: |
    Added two pathophysiology nodes (Pontine Tegmental Alpha-Synuclein Pathology; REM Sleep Muscle Atonia Loss) downstream of the existing Vagal-Brainstem Alpha-Synuclein Propagation node, conforming respectively to rem_sleep_atonia_control_failure#Lesion of the Pontine REM-Atonia Generator and #Failure of REM Sleep Skeletal Muscle Atonia. This addresses item 1 of issue #9432 (REM Sleep Behavior Disorder curated as a bare phenotype in Parkinson's with no mechanism node conforming to the new module). Evidence: PMID:20187227 (Braak staging places pontine tegmental Lewy pathology ahead of substantia nigra involvement), PMID:12196654 (PSG-confirmed REM sleep without atonia in 58% of PD patients vs 6% of controls, and that only half of PSG-positive cases would be detected by clinical history alone), and reuse of the module's own PMID:17884926 for the atonia-circuit edge. New downstream edge links the atonia-loss node to the existing REM Sleep Behavior Disorder phenotype, with a PARTIAL-graded edge citing that 42% of PSG-positive PD patients show no behavioral enactment. Validated with just validate-disorders (schema, terms, 161/167 evidence snippets verified) plus check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, and the full pytest suite (10425 passed). Left for a follow-up: Dementia_with_Lewy_Bodies and Multiple_System_Atrophy still need their own mechanism-node build-outs (item 2 and the MSA gap flagged in the issue's own research comment); DLB's smaller conforms_to piece is already covered by open PR #9507.

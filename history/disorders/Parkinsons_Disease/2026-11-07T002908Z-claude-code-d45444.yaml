  details: |
    Answers the 2026-11-06 review of PR 16762. The midodrine evidence item (PMID:29508455) now quotes the full source sentence, including the drug name and its alpha-1 receptor class, instead of a fragment starting at 'adrenoceptor agonist'. The atomoxetine REFUTE item (PMID:39294522) is marked directness INDIRECT because the trial enrolled a mixed neurogenic orthostatic hypotension group (15 of 40 with MSA) and reports no PD-only result. The two lesion nodes (postganglionic sympathetic denervation and intermediolateral preganglionic neuron loss) change role from trigger to effector, since in this entry they sit downstream of Alpha-Synuclein Aggregation. Validated with just validate and count-verified-snippets (404/410, 6 skipped by prefix).

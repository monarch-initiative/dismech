  summary: Add astrocyte-mediated neuroinflammation evidence from PMID:42599550
  details: |
    Added three evidence items from Li et al. 2026 (PMID:42599550) to the Neuroinflammation pathophysiology node, documenting: (1) neuroprotective astrocyte functions via neurotrophic factors and BBB regulation, (2) pathogenic astrocyte functions via inflammatory mediators and glutamate dysregulation, and (3) PD-associated gene mutations affecting astrocyte function. These additions provide molecular-level documentation of astrocyte involvement in neuroinflammation, complementing existing microglia-focused evidence.

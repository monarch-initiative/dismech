  summary: Label sole-preprint support and drop directional prose in PPMI biomarker
    panel
  details: |
    Applied the ai4c-reviewer CHANGES_REQUESTED fix on PR #6334 (the reviewer prepared the patch but could not push it; its git push returned 403 for github-actions[bot]). Two changes, both in the biochemical section. (1) Added a notes field to each of the five PPMI GWAS biomarker nodes recording that sole support is the non-peer-reviewed preprint PPR:PPR1273884 (PPMI n=581); the CSF ceramide (MCF2L2/GMNN) and CSF tau (TP63) nodes are additionally marked as novel, unreplicated associations. This follows the repo preprint policy that a preprint must not be the sole, unlabelled support for a claim. (2) Rewrote the 'Lysosomal lipid biomarkers' context to drop 'show coordinated dysregulation in PD' and 'Elevated lysosomal lipids' - the cited snippet reports locus associations only and asserts no direction of change. The reviewer's characterizations were independently re-checked against the cached abstract in references_cache/PPR_PPR1273884.md before applying: 'We confirm strong associations' for BMP-LRRK2/GBA1, 'Novel associations were detected' covering both the ceramide and tau loci, and 'were associated with lysosomal lipid biomarkers' for the roll-up node. The reference id was deliberately left as PPR:PPR1273884 rather than swapped for PMID:42466396, since NIH Preprint Pilot indexing confers a PMID without peer review. No evidence items, references, or ontology terms were added or altered.

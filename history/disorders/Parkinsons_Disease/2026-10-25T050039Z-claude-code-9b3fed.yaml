  summary: Structure the pesticide exposure evidence and add a trifluralin entry
  details: |
    Populated exposure_classifications on Pesticide Exposure, which previously had none,
    and set disease_effect PREDISPOSES with causal_role RISK_FACTOR. Listed the compounds
    the PEG screen names in chemicals, and added the PEG pesticide-wide association study
    (PMID:37193692) and the Agricultural Health Study cohort (PMID:32919961) as
    HUMAN_CLINICAL evidence on the factor. The factor previously rested on a 2004 review
    and a 2000 rat rotenone study.

    Added a separate Trifluralin Exposure factor bound to ECTO:9000644, with a
    Mitochondrial Dysfunction edge carrying the measured lesion: preferential loss of
    complex I and complex IV subunits, and a dose-dependent loss of reserve respiratory
    capacity with basal ATP output maintained. Independent support for the respiratory half
    comes from PMID:31973855 in isolated rat liver mitochondria. The pS129 alpha-synuclein
    null is recorded as REFUTE so no alpha-synuclein route is claimed for this compound.

    Verification done before writing, recorded in the issue comment linked above. All nine
    ECTO exposure terms for the cell-screen hits were checked by label, including copper
    sulfate (ECTO:9002310), which the issue had left unchecked; endothall has no ECTO
    exposure term. The blot and respirometry figures were recomputed from the paper's
    deposited source data and reproduce, with the caveat that the paper's published spare
    capacity percentages are means of per-replicate ratios while a ratio-of-means
    aggregation gives 9.4/25.9/74.0.

    Two points were corrected against the issue body. The per-compound odds ratios are per
    one standard deviation of the log-transformed, centred and SD-scaled exposure estimate,
    read from the Methods, and the regressions are adjusted for age, sex, race/ethnicity,
    education and index year despite the main text calling them univariate. The trifluralin
    epidemiological association does have an independent cohort, which an OpenScientist
    claim-confirmation run had reported as absent.

    Not done here: the module-layer evidence updates, and the conformance decisions for
    xenobiotic_oxidative_phosphorylation_blockade and mitochondrial_dysfunction. The
    acute/chronic mismatch behind those is noted in the exposure_duration notes.

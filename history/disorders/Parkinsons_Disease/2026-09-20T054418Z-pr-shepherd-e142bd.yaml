  summary: Add non-motor phenotypes and wire them into the pathograph
  details: |
    Adds four non-motor phenotypes to Parkinsons_Disease from PMID:42646502 (Church et al., NeuroSci 2026) and connects three of them to mechanism nodes. Combines the original curation on this branch with the ai4c-reviewer CHANGES_REQUESTED round.

    Phenotypes: Anxiety (HP:0000739), Freezing of Gait (HP:0031825), Insomnia (HP:0100785), Hallucinations (HP:0000738).

    Review item 1 - Hallucinations frequency. The record carried frequency OCCASIONAL (HPO 5-29%) while its own explanation called hallucinations a common complication, and the attached snippet was a cortical-atrophy statement supporting no frequency claim. Set to FREQUENT on the review's own sentence, 'PD psychosis (PDP) is a common neuropsychiatric condition where PwP experience hallucinations and delusions'. The cortical-atrophy sentence was a mechanism claim and moved upstream rather than staying on the phenotype.

    Review item 2 - pathograph connectivity. All four phenotypes were islands; the commit had taken the entry from 8/12 connected (66.7%) to 8/16 (50.0%). Now 11/16 (68.8%), above the pre-PR baseline. Freezing of Gait is wired from the existing Basal Ganglia Circuit Dysfunction node on the review's pathophysiology-table row for glutamate/GABA imbalance, plus the off-phase timing sentence as an INDIRECT second item. Anxiety and Hallucinations had no existing upstream node, so two were added: Serotonergic Raphe Neuron Loss (CL:0000850 serotonergic neuron, UBERON:0004684 raphe nuclei) carrying the table's serotonin row, and Posterior Cortical and Limbic Atrophy (UBERON:0006093, UBERON:0002021, UBERON:0002421) carrying the atrophy sentence. Every ontology term was read from OLS at edit time; the new UBERON rows appended to cache/uberon/terms.csv and the anatomicalentityterm enum cache are committed with the entry.

    Insomnia is deliberately left with no incoming edge and the reason recorded in its notes, as the review asked. The nearest candidate mechanism in the source, 'sleep fragmentation, and sleep disturbances' under serotonergic raphe loss, names a broader sleep phenotype than this node, so wiring it would assert a mechanism the source does not make.

    Suggestions taken: quote_role REVIEW_SYNTHESIS with evidence_source OTHER on every item citing this review, since the cache frontmatter types it Journal Article/Review and each quoted sentence is the authors' synthesis of others' work; PMID:42646502 added to the top-level references block.

    Validation: just validate passes with 193/199 snippets verified (6 skipped by prefix), just validate-terms passes, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values are clean.

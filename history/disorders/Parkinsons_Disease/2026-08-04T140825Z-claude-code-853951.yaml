  summary: Add PGC-1alpha transcriptional program repression node and therapeutic-window
    HUMAN_MODEL_MISMATCH
  details: |
    Curation-scanner (high_effort) response to issue #6114 ([kgap-scan:scope] PGC-1alpha-mediated neuroprotection across neurodegenerative diseases). Added one atomic MOLECULAR pathophysiology node, 'PGC-1alpha Transcriptional Program Repression', with downstream edges to the existing Mitochondrial Dysfunction and Oxidative Stress nodes, and one HUMAN_MODEL_MISMATCH discussion (pd_pgc1a_therapeutic_window) with two proposed experiments capturing the issue core gap: PGC-1alpha restoration rescues in cellular models but sustained AAV overexpression in the adult rat nigrostriatal system is itself dopaminergic-toxic. Evidence: PMID:20926834 (human laser-captured nigral transcriptomes, PGC-1alpha-responsive genes underexpressed; cellular rescue), PMID:21376232 (PARIS/ZNF746 repression of PPARGC1A; accumulates in human PD brain; parkin cKO epistasis), PMID:22246294 (sustained nigrostriatal overexpression toxicity), PMID:42430091 (the issue source review, cross-disease rheostat framing). Two PMIDs recalled from memory during drafting were verified wrong via just fetch-reference and discarded before use. GO:0010821 and CL:2000030 were rejected by the pre-edit validation hook and replaced with cached, verified GO:0007005/GO:0003713/CL:0000700. Validated with just validate (schema + terms + references): passed, 151/157 snippets verified. Deliberately scoped to Parkinson disease only; ALS and Alzheimer entries remain uncurated for this mechanism and Huntington disease already carries the mHTT-PGC-1alpha chain.

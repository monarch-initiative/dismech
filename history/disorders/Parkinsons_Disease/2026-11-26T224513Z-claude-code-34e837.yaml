  summary: Add pimavanserin, rivastigmine and extended-release amantadine treatments
  details: |
    Refs #18256 (treatments item). Added three treatment rows, each sourced from its pivotal randomised placebo-controlled trial: pimavanserin for PD psychosis (PMID:24183563, NCT01174004) targeting the Hallucinations phenotype; rivastigmine for PD dementia (PMID:15590953) targeting the Cognitive Impairment phenotype, drawn to the phenotype because the entry has no cholinergic-deficit node; extended-release amantadine for levodopa-induced dyskinesia (PMID:28604926, NCT02136914), with no target edge because the entry does not model levodopa-induced dyskinesia as a phenotype. CHEBI terms looked up in OLS. All 479 snippets verified against cached abstracts.

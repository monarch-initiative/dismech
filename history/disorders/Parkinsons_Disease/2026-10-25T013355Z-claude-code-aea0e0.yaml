  summary: Extend environmental exposures with verified epidemiology and nulls
  details: |
    Rewrote the environmental section from three sparse entries to twelve, the ten new or
    extended ones each carrying their own mechanism link with link-level evidence.

    Extended: Pesticide Exposure gains the paraquat meta-analysis (PMID:30474499), the
    AGRICAN agricultural cohort (PMID:29136149), the glove-use modification study
    (PMID:25461423) and the organochlorine meta-analysis (PMID:39520734); the AGRICAN
    rotenone sentence was added to the existing Mitochondrial Dysfunction link because it
    is the one place the human epidemiology and the rat complex I work name the same
    molecule. Rural Living gains the classic positive meta-analysis (PMID:11437458) and the
    Bradford-Hill weight-of-evidence assessment that finds the proxy associations
    inconsistent (PMID:27055126, graded REFUTE), and is deliberately left with no mechanism
    link. Head Trauma gains the population-based null (PMID:30396335, graded REFUTE) beside
    the existing positive meta-analysis.

    New: Chlorpyrifos Exposure (the only pesticide with a reported autophagic rather than
    mitochondrial mechanism, linked to Autophagy-Lysosome Pathway Dysfunction on the
    zebrafish rescue experiments), Trichloroethylene Exposure (Camp Lejeune),
    Ambient Fine Particulate Matter, Lead Exposure, Dairy Consumption,
    Helicobacter pylori Infection, Truncal Vagotomy (PROTECTS_AGAINST
    Vagal-Brainstem Alpha-Synuclein Propagation, the closest thing in the human literature
    to an experimental test of that route), Cigarette Smoking and Caffeine Consumption
    (both PROTECTS_AGAINST, both recorded with the reverse-causation objection).

    Nulls curated as content rather than omitted: nine common infections unrelated to risk,
    metals other than lead, and the TBI population-based null. Manganese is explicitly not
    curated, because the metals meta-analysis found it null for idiopathic disease and
    manganism is a distinct toxicant parkinsonism.

    Most links are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, following the existing
    Head Trauma precedent: nearly all of this literature is risk epidemiology with no
    mechanistic arm, and pointing such a study at a mechanism node would assert a route it
    does not measure. Only pesticides (rat complex I) and chlorpyrifos (zebrafish autophagy)
    carry TRIGGERS/DIRECT, and both say in the link description that the mechanism is
    established in the model and not in human disease.

    The AGRICAN snippet is bridged with " ... " across a bracketed span the reference
    validator strips; the explanation says so and does not restate the stripped figures.

    Not curated, though verified and available: ibuprofen (PMID:21368281), the beta-2
    adrenoreceptor agonist work (PMID:28860381) and physical activity (PMID:25410713).
    These are medications and a lifestyle factor rather than environmental exposures, and
    were held back as a scope decision rather than for want of evidence.

    Provider: OpenScientist (autonomous mode, 5 iterations, 52 citations, 20 minutes).
    The report is committed at research/Alpha_Synucleinopathies-environmental-exposures-deep-research-openscientist.md
    with its citations sidecar and HTML/PDF artifacts. Falcon was unavailable for this
    run (the configured Edison key returns 403), so no second provider corroborates it.

    Every quoted sentence was read from the cached abstract in references_cache/ rather
    than from the report, and several of the report's figures were corrected or qualified
    against source in the process. The report was treated as a lead throughout.

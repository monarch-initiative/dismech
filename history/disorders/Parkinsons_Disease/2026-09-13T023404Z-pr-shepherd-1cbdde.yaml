  summary: 'Review round: fix ICB frequency band, add peer-reviewed support, bind
    HP term, move treatment evidence'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #10175 (issue #9168).

    Critical items:

    1. frequency FREQUENT -> OCCASIONAL. FrequencyEnum.FREQUENT is 30-79%; the meta-analytic
    point estimate is 19% (95% CI 15-24%) and the whole interval sits inside OCCASIONAL
    (5-29%). The notes now record which figures put it in that band.

    2. The phenotype no longer rests solely on a non-peer-reviewed preprint. Searched PubMed
    and fetched the DOMINION cross-sectional study (PMID:20457959, Weintraub et al., Arch
    Neurol 2010, n=3090) with just fetch-reference. Two evidence items quote it: the 13.6%
    point prevalence with the four constituent behaviors broken out, and the dopamine-agonist
    association (17.1% vs 6.9%; OR 2.72, 95% CI 2.08-3.54). The preprint is retained alongside
    it, not removed - the pooled 19% across 27 studies is still the better prevalence estimate,
    and the two now corroborate each other.

    Important items:

    3. reference_title added to every evidence item on the new content.

    4. phenotype_term bound to HP:0100710 Impulsivity with preferred_term "Impulse control
    behaviors", per the ontology contract allowing a more specific preferred_term. The notes
    previously claimed HP has no suitable term, which was wrong; they now state what HP
    actually lacks - a term for the dopaminergic-therapy-related ICB syndrome that distinguishes
    it from trait impulsivity and from HP:0000722 Compulsive behaviors.

    5. The treatment-response evidence moved out of phenotypes into a new "Impulse Control
    Behavior Management" treatment, bound to NCIT:C49236 (Therapeutic Procedure), with a
    target_mechanisms edge INHIBITS -> Impulse Control Behaviors. That connects the phenotype
    into the pathograph instead of leaving it a disconnected leaf.

    The dopamine-agonist risk claim was handled differently from the reviewer's suggestion.
    TreatmentEffectEnum has no INDUCES or CAUSES value (INHIBITS, ACTIVATES, MODULATES,
    BYPASSES, RESTORES), and Treatment has no adverse-effect slot, so an iatrogenic
    treatment -> phenotype edge cannot be expressed without asserting a predicate that means
    the opposite of the claim. Instead the DOMINION drug-class conclusion is recorded as
    evidence on the Dopamine Agonists treatment entry, with the adverse effect stated in its
    description, and the risk-factor evidence stays on the phenotype. This also covers the
    "dopaminergic therapy-related adverse effects" target from issue #9168.

    6. Scope: items 2 and 5 above extend the PR past a bare phenotype into treatment
    mechanisms and dopaminergic adverse effects, which were the other two targets in #9168.

    8. Snippet 2 was a bare sentence fragment; it now quotes through from the clause it
    depends on and is still an exact substring of the cached preprint.

    Validation: just validate passes (161/167 snippets verified, 6 skipped by prefix - the
    pre-existing DOI-only references); just validate-terms, just check-entity-refs and
    just check-duplicate-keys all pass. Treatment target_mechanisms targets were checked
    against pathophysiology and phenotype names and all resolve.

  summary: Add PD map cohort-specific probabilistic Boolean models
  details: |
    Appended a fifth computational_models entry: the PD map cohort-specific probabilistic Boolean networks (PMID:39429779), built by exporting PPMI-enriched PD map diagrams from CellDesigner, translating them to SBML-qual with CaSQ, parameterising against cohort miRNA/transcriptomic data, and simulating with pyMaBoSS. Recorded the LCSB GitLab repository URL and two modeled_mechanisms links: Autophagy-Lysosome Pathway Dysfunction (RECAPITULATES, PRKN mitophagy, with an ALTERED readout for subtype-dependent autophagy/mitophagy) and Striatal Dopamine Deficiency (PARTIALLY_RECAPITULATES, LOW fidelity — the model addresses dopamine transcription pathways, not striatal dopamine concentration, so the evidence is graded PARTIAL). notes flag that this is a probabilistic rather than deterministic Boolean network. Validation as for the sibling entries in this tranche.

  details: |
    PR Shepherd round. Merged origin/main (clean, no conflicts) to bring in references_cache/PMID_42646502.md, which this branch cited but never committed; the file arrived on main via sibling PR #12004. Fixed two things the merge made visible. First, the CI failure: phenotypes[14].evidence[1] quoted the four-word sentence 'Exercise effectively combats fatigue', under the five-word floor in check-snippet-length. Extending it leftward was rejected by the reference validator, which strips bracketed citation spans before matching, so the neighbouring '[212].' broke the substring match. Re-quoted instead from the same review's exercise and non-motor-symptom passage, a bracket-free sentence that reports an actual finding rather than a bare assertion, and recorded directness INDIRECT plus quote_role REVIEW_SYNTHESIS because the result is an aggregate across non-motor symptoms including fatigue rather than a fatigue-specific effect. Second, a merge-exposed snippet-grading divergence that neither PR could see alone: one anxiety sentence from PMID:42646502 was graded OTHER on main's pathophysiology[10].downstream[0].evidence[1] and HUMAN_CLINICAL on this branch's phenotypes[11].evidence[1]. Aligned the newer row to main's grading, which carries directness INDIRECT, quote_role REVIEW_SYNTHESIS and a written rationale that the source states a hypothesized circuit correlation rather than a demonstrated mechanism. Validation: just validate clean with 231/237 snippets verified (6 prefix skips), and snippet-length, snippet-grading, title-snippet, folded-hyphen, environmental-evidence, coarse-phenotype, duplicate-key, entity-ref, causal-target, qualifier-term and enum-value gates all green.

  summary: Decide the four golf-course pesticides; add maneb and chlorpyrifos to the
    pesticide factor
  details: |
    Resolves the question in issue #15601: whether the six compounds named in the golf-course proximity study's Discussion sentence (PMID:40338549) are citable for the Pesticide Exposure factor. They are not citable from that paper, whose sentence rests on a 1982 usage survey, a 1991 advocacy newsletter, a songbird dissertation and one sediment study, and which measured no pesticide. Each compound was decided on its own disease literature instead. Maneb is added to chemicals on PMID:19270050 (Central Valley residential GIS model, joint maneb-and-paraquat 1.75, 1.13-2.73; maneb alone rests on 3 cases and is uninterpretable) with the Dutch national a-priori null (PMID:28704700) recorded as a counterweight. Chlorpyrifos is added to chemicals; it already had its own environmental entry from PR #15563, to which this adds the measure behind its 2.5-fold figure (the duration-scaled 2.68, 1.58-4.55 in Table 2, not the 1.35 ever-versus-never contrast) and the Agricultural Health Study ever-use null as REFUTE evidence (0.92, 0.74-1.13). That entry also gains disease_effect, causal_role and chemicals, which its siblings carry and it did not. 2,4-D is excluded (Agricultural Health Study ever-use 1.06, 0.79-1.43; the only compound-level support located is a primary rodent midbrain culture requiring 1 mM, PMID:38001883) and mecoprop/MCPP is excluded with the PubMed queries run and their results recorded in notes. Organophosphates and organochlorines stay out of chemicals as classes. The cached PMID:41382278 was upgraded from abstract to PMC full text because the measure behind the 2.5-fold figure is in Table 2 and not in the abstract.

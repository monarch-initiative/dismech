  summary: 'Review round 1: correct two exposure bindings, add hepatitis C'
  details: |
    Review round 1 of PR #15563. Two ontology bindings were corrected and three
    additions made.

    Ambient Fine Particulate Matter was bound to ECTO:7000116 exposure to
    respirable suspended particulate matter, the thoracic fraction, while the entry
    and its quoted snippet are PM2.5-specific. Rebound to ECTO:7000117 exposure to
    fine respirable suspended particulate matter, read from the EBI Ontology Lookup
    Service in the same step. The notes line claiming no PM2.5-specific term existed
    was false and is replaced with the study's nitrogen dioxide and ozone results,
    checked against the cached abstract.

    Dairy Consumption was bound to ECTO:0070003 exposure to whole milk via
    ingestion, a fat stratum the cited meta-analysis specifically does not single
    out, since it reports raised risk for low-fat dairy as well. The exposure_term
    block is removed rather than rebound: searches for dairy, milk, cheese and
    yogurt return only product-level ECTO classes, all fat-graded except the generic
    liquid cow milk term, which is narrower than the dairy category the finding is
    reported at. The searches are recorded in notes. Removing the whole block rather
    than just the term keeps the entry UNBOUND rather than PARTIAL in
    environmental-term-audit.

    Added Hepatitis C Virus Infection, which the earlier round left uncurated
    although its odds ratio sits inside the snippet already quoted on the
    Helicobacter pylori record. It carries the antiviral-treatment arm as a second
    evidence item, read from the cached abstract. Left unbound: the only ECTO
    hepatitis C class names a single isolate, HCV-476, and the parent exposure to
    virus class names no organism.

    Rural Living gained the ECTO search record the other unbound entries already
    carried; rural, well water, farming and agricultural return no residence class.

    References cache churn from the validation pass was reverted again: 56 files,
    all identical after whitespace normalization, verified by comparing the removed
    lines and not only the added ones.

    Gates after the edits: validate-disorders clean over the three changed files
    (427 snippets, 0 issues), count-verified-snippets 427/433 on the reverted tree,
    validate-terms clean, check-environmental-evidence, check-causal-targets,
    check-entity-refs, check-duplicate-keys, check-enum-values and
    check-block-scalar-comments all clean. check-snippet-grading reports one
    cross-file divergence in Reelin_Pathway_Lissencephaly and its module, which this
    branch does not touch and which is present on main.

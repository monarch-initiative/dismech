  summary: 'Review round 1: cite the DNAJC6 GeneReviews chapter on both PARK19 rows
    and the inheritance block'
  details: |
    Review round 1 on PR 12752. The DNAJC6 GeneReviews chapter (PMID:33983693) had been fetched, cached and tagged but quoted nowhere, though it is the best available source for the two subtype rows this PR creates. All four sentences used here were confirmed present in the cached abstract, which is abstract_only so none depends on full text. PARK19A gains the chapter's account of the extra-parkinsonian features - developmental delay, intellectual disability, seizures, other movement disorders and neuropsychiatric features in the majority of juvenile-onset individuals, often preceding parkinsonism - and its description now says parkinsonism is usually not the presenting feature. PARK19B cites the chapter for the juvenile versus early-onset split; the chapter gives the onset window as the third to fourth decade where PMID:26528954 gives third to fifth, and both are kept with a note that they are different case series rather than reconciled. The DNAJC6 inheritance block had no evidence and now cites the chapter's autosomal-recessive statement. The chapter's avoidance caution - dopamine antagonists and VMAT2 inhibitors should be avoided as they could aggravate dopamine deficiency - is recorded in the record notes as a quote, with a line explaining it is not a treatments entry because it names a class to withhold rather than an intervention to give. All four items are graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, since the chapter synthesises reported cases rather than reporting its own.

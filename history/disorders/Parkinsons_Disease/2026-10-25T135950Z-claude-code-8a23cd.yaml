  summary: Record the exposure-route evidence for pesticide exposure and leave the route unassigned
  details: |
    Added the golf-course proximity study (PMID:40338549) as HUMAN_CLINICAL evidence on the
    Pesticide Exposure factor, and attached two evidence items to the exposure_route
    assignment, which had carried only a note. The route stays UNKNOWN.

    The issue this came from proposed offering a reviewer the option of recording ORAL
    alongside UNKNOWN. Two research results removed the basis for that and are now the
    evidence on the route assignment. A meta-analysis of 15 well-water case-control studies
    (PMID:34938078) is null overall at 1.16 (0.97-1.39) and null in the two strata matching
    the proximity study's design, America 0.97 (0.76-1.24) and population-based 0.96
    (0.73-1.26). And the airborne reading is not independent: the same authors had already
    published an urban-concentrated PM2.5 association in the same case series
    (PMID:39283636). Both papers start from one set of 450 incident Olmsted County cases and
    retain 419 and 346, so at least 315 cases are shared, computed as 419 + 346 - 450.

    No mechanism edge was added. The proximity study measured no pesticide in water, air or
    any participant, and the oxidative-stress and mitochondrial claims in its discussion are
    cited to Tanner 2011 and Betarbet 2000, the latter already carried by this entry.

    Two figures in the factor notes were derived rather than quoted. Table 3 of PMID:40338549
    uses vulnerable-groundwater-with-a-golf-course as its reference, so the golf-course
    contrast within vulnerable regions was recovered by inverting the
    vulnerable-without-a-course row, 0.74 (0.43-1.27), giving 1.35 (0.79-2.33) at p = 0.28.
    That contrast is null and the paper does not report it. The paper's two reported
    vulnerable-region comparisons, 1.82 and 1.92, reproduce exactly on the same inversion.

    Reference caches for all five papers were committed separately, before the knowledge-base
    edit, while this work was blocked on #15582.

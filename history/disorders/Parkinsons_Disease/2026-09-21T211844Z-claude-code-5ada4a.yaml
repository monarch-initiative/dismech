  summary: 'Review response: reconcile merge-created duplicate phenotype nodes'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review of 2026-09-21 on PR 12013. All CRITICAL and IMPORTANT items plus the three suggestions are addressed in one push.

    CRITICAL. This branch was authored before sibling PR 12004 landed phenotypes from the same PMID:42646502 on main. The merge was clean at the git level but produced genuine content duplication, and because dismech.graph keys nodes on the bare name the later item silently overwrote the earlier one, so the newly added nodes were the ones being dropped. Three nodes are removed and their net-new content folded into the nodes main already carried. Insomnia: main's node is kept whole, including its HP:0100785 binding, its quote_role and the deliberate rationale in notes for having no incoming causal edge; the duplicate bound the broader HP:0002360 Sleep disturbance under preferred_term Insomnia, which was also IMPORTANT 1, and is gone with it. Anxiety: main's node is kept and gains the duplicate's notes and its second evidence item on fear and limbic circuitry, which was net-new and already correctly graded INDIRECT plus REVIEW_SYNTHESIS. Psychosis: removed rather than folded. Its first snippet was already on main's Hallucinations node verbatim, and its second, the cortical-atrophy sentence, was already cited twice in the pathophysiology section, on the Posterior Cortical and Limbic Atrophy node and on that node's downstream edge to Hallucinations, both graded INDIRECT plus REVIEW_SYNTHESIS. Nothing was lost by deleting it, and re-quoting it a third time at a weaker grading is what IMPORTANT 2 objected to. Phenotype items are now 19 of 19 distinct, against 22 items collapsing to 20 before.

    IMPORTANT 3. frequency: FREQUENT was carried by four nodes whose snippets established the phenotype but not its frequency. Fatigue and Apathy keep the slot and each gain a second evidence item that states prevalence directly, both verified as exact substrings of the cache before use. Excessive Daytime Somnolence loses the slot, because no frequency sentence for it could be located in the cache and leaving it unsupported is worse than leaving it empty. Psychosis was removed, so its unsupported frequency went with it.

    Suggestions. Fatigue moves from category Psychiatric to Constitutional, which is an established value in this corpus with 129 uses and fits a symptom the review itself classifies as physical, mental and emotional rather than psychiatric. Apathy is wired from Serotonergic Raphe Neuron Loss with a new downstream edge, which removes it from the disconnected-phenotype report; the edge is deliberately hedged, because the cited sentence says apathy is thought to be related to losses of dopamine and serotonin, so it names two transmitters and states a belief rather than a mechanism, and the edge description and explanation both record that this carries the serotonergic arm only and does not exclude a parallel dopaminergic route. The stray HP:0008767 row was not hand-deleted: cache/hp/terms.csv and the phenotypeterm enum snapshot were reset to origin/main and re-derived with just validate-terms, which is the supported path, and they now match origin/main exactly.

    Validation. just validate passed for schema, terms and references, with 229 of 235 snippets verified and 6 skipped by prefix. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-qualifier-terms pass on the entry. check-coarse-phenotypes and check-snippet-grading pass whole-KB, the latter reporting no new divergences, which confirms the folded and added items agree with how the same sentences are graded elsewhere in the file. Phenotype causal connectivity for the entry is 12 of 19 after the Apathy edge; Insomnia stays deliberately unconnected for the reason main's notes record.

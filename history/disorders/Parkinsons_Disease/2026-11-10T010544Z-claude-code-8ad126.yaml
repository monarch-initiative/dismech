  summary: Record UCHL1 as DISPUTED and GIGYF2, HTRA2, EIF4G1 as REFUTED gene rows;
    close the four PARK susceptibility stubs
  details: |
    First step of the Parkinson disease lump/split plan (scenario 1: the entry stays on MONDO:0005180 as the basket for the clinical diagnosis, Mendelian forms get their own entries). Four historically claimed autosomal dominant susceptibility loci that have open stubs but should never become subtypes or entries are recorded as genetic rows with the curator's reading of the gene-disease claim: UCHL1 (PARK5) as DISPUTED, because the I93M family was never replicated and the S18Y meta-analyses conflict (null in Healy 2006 Europeans, protective recessive effect in the 2009 HuGE Asian-ancestry pooling); GIGYF2 (PARK11), HTRA2 (PARK13) and EIF4G1 (PARK18) as REFUTED, because in each case the variants the claim rested on were later found in neurologically normal controls, and large studies (566 multiplex kindreds for GIGYF2; 6,378 cases and 8,880 controls for HTRA2; 6,249 cases and 6,032 controls for EIF4G1) found no association or an excess in controls. REFUTED is the value added to GeneDiseaseRelationshipEnum in the same branch. Every evidence item cites the refutation, not only the original report, which is named with its PMID in notes. supports is graded relative to the row's own claim (the DISPUTED or REFUTED grade), following the ZFYVE27 row in Hereditary_Spastic_Paraplegia; the KB is currently split on this direction and the choice is flagged in the PR. gene_disease_validity is left absent on all four: the ClinGen gene-validity CSV downloaded 2026-11-10 carries no Parkinson disease assertion for any of them (UCHL1 is classified only for hereditary spastic paraplegia, HTRA2 only for 3-methylglutaconic aciduria type 8); the clingen-refresh checksum pin was not repinned in this PR. The four stubs are kept with entry_type OUT_OF_SCOPE and a notes paragraph pointing at the genetic row, following the 34 decided stubs already in stubs/ rather than deleting them, because next-stubs skips decided stubs and seed-stubs never overwrites an existing file, so a kept stub is what prevents re-nomination. Snippets are abstract-only exact quotes from references_cache; Leroy 1998 (PMID:9774100) and Vilarino-Guell 2009 (PMID:19133664) have no abstract text in the cache and are therefore cited in notes rather than as evidence items.

  summary: Evidence-claim mismatch review (#18354)
  details: >-
    Reviewed the 36 active whole-claim MISMATCH findings from the saved Jev
    assessment of this entry against the current YAML and the cached references.
    Corrected: (1) the four causal edges from Basal Ganglia Circuit Dysfunction to
    resting tremor, bradykinesia, rigidity and postural instability cited a
    Rotterdam Study design paper whose sentence lists the cardinal signs of
    parkinsonism and says nothing about basal ganglia circuitry. It was removed
    from all four edges. Bradykinesia and rigidity keep their existing
    PMID:19127584 circuit evidence. Resting tremor now cites PMID:22382359
    (Helmich 2012), which links tremor to both the basal ganglia and the
    cerebello-thalamo-cortical circuit. Postural instability now cites
    PMID:26966928 (Crouse 2016), which places it partly outside the basal ganglia.
    Both edges keep causal_link_type UNKNOWN, which these sources now justify.
    The phenotype-level Rotterdam citations stay; there the sentence does support
    the claim. (2) Three readouts on the healthy-line hiPSC midbrain organoid
    carried direction INCREASED against Dopaminergic Neuron Loss, Striatal
    Dopamine Deficiency and Basal Ganglia Circuit Dysfunction. The organoid has
    no PD genotype or comparator, so INCREASED read as a worsening of those
    nodes. The direction was removed; the interpretations already state what was
    measured. (3) The LRRK2 G2019S mouse gut-inflammation item now records
    directness INDIRECT, because it bears on human penetrance only by inference.
    Retained after review: the remaining flags are entry-level null or caveat
    quotes (TCE specificity, lead versus other metals, vagotomy precision,
    H. pylori), Hoehn and Yahr clinimetric context, mechanistic-hypothesis
    qualifiers, gene-function background quotes, the atomoxetine MSA-versus-PD
    contrast, and the FMT trial cited as REFUTE in the microbiome knowledge gap.
    Each explanation already states the narrower reading the snippet supports.

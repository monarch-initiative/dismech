  summary: Add neurogenic orthostatic hypotension, conforming to the nOH module
  details: |
    Added the Neurogenic Orthostatic Hypotension phenotype (HP:0004926) and four pathophysiology nodes conforming to the neurogenic_orthostatic_hypotension module: postganglionic sympathetic denervation (main PD lesion site), intermediolateral preganglionic neuron loss (co-occurring central site), deficient norepinephrine release on standing, and failed baroreflex vasoconstriction. Alpha-Synuclein Aggregation gains edges to both lesion nodes. Added midodrine, droxidopa, fludrocortisone and atomoxetine with target_mechanisms following the module lesion-site rule. Sources: Palma and Kaufmann 2018 (PMID:29508455), Orimo 2008 (PMID:18079166), Tipre and Goldstein 2005 (PMID:16269589), Hauser 2015 nOH306B (PMID:25487613), plus module references. PMIDs written from memory for the denervation papers were wrong and were replaced by PubMed title search before fetching. Validated with just validate, validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs and the whole-tree snippet gates.

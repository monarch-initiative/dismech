  summary: Add UPDRS/Hoehn-Yahr diagnosis row (tranche Q batch 2)
  details: |
    LOINC tranche Q batch 2 (staging and severity scores, Parkinsonism cluster). Added a diagnosis[] row binding LOINC:77717-7 (Unified Parkinson's Disease Rating Scale (UPDRS) panel) and LOINC:77714-4 (Modified Hoen and Yahr stage [UPDRS] -- LOINC's own 'Hoen' spelling, preserved verbatim per the copy-the-source-exactly convention) via measurements, citing PMID:34125001 (an LSVT BIG case report already partially cited elsewhere in this entry's Hoehn and Yahr stages: section) establishing both instruments as the clinical assessments used to classify and track this patient's PD severity. No reference_ranges band on either code: per the coordinator's explicit guidance for this tranche, do not reproduce UPDRS's individual item codes (Posture, Speech, Gait, Rigidity Neck, Depression scale, etc. all resolve in LOINC but binding them would violate the never-reproduce-an-instrument's-items rule), and Hoehn and Yahr is ordinal staging rather than a threshold on a measured quantity -- the entry's existing stages: section (lines ~3414-3498, cited to the original 1967 PMID:6067254 and the MDS Task Force report PMID:15372591) already carries the per-stage clinical definitions and is the authoritative home for that content; the new diagnosis row only establishes the LOINC identity of the two instruments. Both codes confirmed against the Monarch KG API (api-v3.monarchinitiative.org) in the step written, then seeded into cache/loinc/terms.csv via just loinc-seed-cache; neither requires a third-party copyright notice (checked against cache/loinc/external_copyright_codes.csv). No collision with either code on any other open loinc-* branch's cache. The reused PMID:34125001 snippet (already present at the Hoehn-Yahr Stage 4 node) was re-cited with evidence_source: HUMAN_CLINICAL explicitly set, matching the existing item's implicit default (absent evidence_source counts as HUMAN_CLINICAL per check_snippet_grading.py) -- no grading divergence. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass. Three sibling parkinsonism-cluster entries in this batch (Manganism, X-linked_Dystonia-Parkinsonism, the PTRHD1 neurodevelopmental disorder entry) were investigated and rejected as UPDRS candidates: each cites UPDRS only as an outcome/grading instrument embedded in one cited cohort study, case report, or clinical trial's secondary measure -- never as this entry's own diagnostic assessment identity -- the same incidental-mention shape documented for the Caroli_Disease rejection in tranche Q batch 1.

  summary: Add UPDRS diagnosis row (tranche Q batch 2, revised on review)
  details: |
    LOINC tranche Q batch 2 (staging and severity scores, Parkinsonism cluster). Added a diagnosis[] row binding LOINC:77717-7 (Unified Parkinson's Disease Rating Scale (UPDRS) panel) via measurements. No reference_ranges band: per the coordinator's explicit guidance for this tranche, UPDRS's individual item codes (Posture, Speech, Gait, Rigidity Neck, Depression scale, etc. all resolve in LOINC) are never reproduced here.

    Hoehn and Yahr staging is NOT bound in this row. A first version bound LOINC:77714-4 (Modified Hoen and Yahr stage [UPDRS]) alongside UPDRS, reasoning that an original-scale code did not exist. Review correctly rejected this: the code names the MODIFIED 0.5-increment Hoehn and Yahr scale, while this entry's own stages: section (lines ~3414-3498, cited to the original 1967 PMID:6067254) carries the original five-stage scale, and PMID:15372591 (the MDS Task Force report, already cited there) recommends that "the original five-point scales should be maintained" absent clinimetric validation of the modified version. Monarch KG queries (api-v3.monarchinitiative.org/v3/api/search) for "Hoehn", "Hoehn and Yahr", and "parkinson stage" all return total: 0; "Hoen" returns total: 1 (LOINC:77714-4 itself). So no LOINC code for the original Hoehn and Yahr scale exists, and the modified-scale code is left unbound rather than bound against evidence this entry does not support. The notes field on the diagnosis row records these exact queries and results.

    UPDRS evidence was also corrected on review. The first version cited PMID:34125001, an LSVT BIG rehabilitation case report where UPDRS part 3 is a before/after outcome measure -- the same incidental-mention shape this batch rejected for Manganism, X-linked_Dystonia-Parkinsonism, and the PTRHD1 neurodevelopmental entry. Replaced with PMID:19025984 (Goetz et al. 2008, the MDS-UPDRS clinimetric development/validation paper, fetched into references_cache/ for this fix), quoting its statement that movement disorder specialists administered the UPDRS and MDS-UPDRS to 877 patients across 39 sites, and its clinimetric-validity conclusion for the MDS-UPDRS (which correlates with the original UPDRS at rho = 0.96).

    LOINC:77717-7 confirmed against the Monarch KG API in the step written, then seeded into cache/loinc/terms.csv via just loinc-seed-cache; it requires no third-party copyright notice (checked against cache/loinc/external_copyright_codes.csv). No collision with it on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass on the revised row.

    Three sibling parkinsonism-cluster entries in this batch (Manganism, X-linked_Dystonia-Parkinsonism, the PTRHD1 neurodevelopmental disorder entry) were investigated and rejected as UPDRS candidates: each cites UPDRS only as an outcome/grading instrument embedded in one cited cohort study, case report, or clinical trial's secondary measure -- never as this entry's own diagnostic assessment identity -- the same incidental-mention shape documented for the Caroli_Disease rejection in tranche Q batch 1.

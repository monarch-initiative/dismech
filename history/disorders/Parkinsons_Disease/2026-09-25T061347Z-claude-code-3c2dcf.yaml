  summary: 'Genetics pass (d2g series-037): gene-defined subtypes and pathograph wiring'
  details: |
    Genetics pass for the d2g series-037 gap list (issue #12244), covering the ten
    gene-defined Parkinson disease subtypes MONDO files under MONDO:0005180.

    Anchor check first. The entry is bound to MONDO:0005180 "Parkinson disease",
    verified against OLS. That is the broad class, which is correct for an entry
    named after the disease itself, so the gap list is not an artifact of an
    over-broad anchor. Enumerating all 27 hierarchical descendants of
    MONDO:0005180 through the OLS4 API and reading each term's RO:0004003 edges
    found four gene-bearing siblings the gap list omits: MONDO:0010820 (PRKN),
    MONDO:0011658 (PARK7), MONDO:0011764 (LRRK2) and MONDO:0011706 (ATP13A2). All
    four already have their own Disease entries in this KB, so none is curated
    here. MONDO:0800369 (Parkinson disease 19B) carries no gene edge in MONDO even
    though the disease is DNAJC6-related; it is curated here as a subtype row
    anyway, and the missing edge is reported upstream.

    Added an eleven-row has_subtypes block: PARK1 and PARK4 (SNCA, split by
    allelic mechanism - missense versus locus multiplication), PARK6 (PINK1),
    PARK15 (FBXO7), PARK17 (VPS35), PARK19A and PARK19B (DNAJC6, split by onset),
    PARK20 (SYNJ1), PARK22 (CHCHD2), PARK23 (VPS13C) and PARK25 (PTPA). Each row
    binds its MONDO term and its gene.

    Added six genetic records: CHCHD2, PTPA, VPS13C, SYNJ1, DNAJC6 and FBXO7. None
    of these six has a ClinGen gene-disease validity assertion for Parkinson
    disease in the ClinGen gene-validity download, and each record says so. SYNJ1's
    only ClinGen assertion is for genetic developmental and epileptic
    encephalopathy, which is recorded in its notes. CHCHD2 is deliberately curated
    with the discovery study's own hedge quoted rather than asserted as
    established.

    Wiring. Genes were bound as descriptors on the nodes whose own evidence names
    them: PINK1, PRKN, FBXO7, VPS13C and CHCHD2 on Mitochondrial Dysfunction; GBA1,
    LRRK2, SNCA, PRKN, PINK1 and VPS35 on Autophagy-Lysosome Pathway Dysfunction;
    DNAJC6 and SYNJ1 on Synaptic Dysfunction. Where the existing node evidence did
    not name the gene, an evidence item was added rather than the binding being
    asserted on the node description alone. One new node, PP2A Phosphatase
    Activation Failure, carries PTPA and feeds Striatal Dopamine Deficiency through
    an explicitly indirect link, because the only in vivo functional result is a
    levodopa-reversible climbing defect in Drosophila.

    Not wired, and left as a stated gap rather than an under-sourced binding:
    PARK7 (DJ-1) and, before this pass, VPS35. VPS35 is now bound on the
    autophagy-lysosome node on the strength of a cell study showing the D620N
    allele impairs autophagy. PARK7 has no node whose own evidence names it and no
    abstract-level source was found that states a DJ-1 mechanism without relying on
    an overexpression rescue experiment, so it remains unbound.

    Validation: just validate (294 snippets, 0 issues), just validate-terms,
    just count-verified-snippets, and the offline gates all pass under
    linkml-reference-validator 0.3.0rc1. Every snippet added was checked to be
    present in both the committed cache and the current PubMed abstract, so none
    depends on full text.

  details: |
    Review round 1 on PR #16228. The reviewer approved with three non-blocking suggestions; two were the same defect, an evidence item whose quoted sentence spans two evidence sources, which this repository's rule says to split.

    On the edge to Neuroinflammation, the PMID:29386135 IL-6 item quoted a sentence covering both culture and in vivo work and whose load-bearing clause was about neuron degeneration rather than inflammation. The quote is now narrowed to the cultured-neuron clause and the item moved to the edge it bears on, Dopaminergic Neuron Loss, where it records what the route is not: IL-6 alone does not kill cultured dopaminergic neurons, which is why both edges carry unknown intermediates.

    On the node, the PMID:31543366 item quoted an abstract sentence covering human stem-cell-derived neurons and mice under a single IN_VITRO grade. It is replaced by the paper's own hESC-only statement, and a second item added for the CDKN1A inhibition experiment, which is the evidence that p21 is the effector between SATB1 loss and the arrest rather than a correlate.

    The third suggestion, a GeneReviews UNTAGGED_CHAPTER finding, is not taken and its stated cause is wrong: the Monogenic Parkinson Disease Overview chapter (PMID:20301402) is already cited and tagged. The finding is driven by five uncited gene-specific chapters, LRRK2, VPS35, RAB32, PRKN and PINK1. Mining those is a separate pass over the genetic section and predates this change.

    Re-validated after the edits: just validate, validate-disorders (377 snippets verified, 384 titles, 0 issues), check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, and the whole-tree snippet-grading, snippet-length, title-snippet and reference-title gates.

  summary: Add typed divergences to the PD map Boolean model links
  details: |
    Seven typed divergences across the two links. Striatal Dopamine Deficiency carries the tranche's clearest INVALIDATING divergence: PROXY_QUANTITY, because the model's quantity is transcriptional regulation of dopamine-synthesis genes and the node's quantity is striatal dopamine concentration, separated by transcription, translation, synthesis, transport and terminal survival. That is the divergence behind the link's LOW fidelity and it is invisible to the scale comparison. Also BOUNDARY_OMISSION (nigrostriatal terminal loss, presynaptic deficit), SCALE_EXTRAPOLATION (two steps) and CALIBRATION_PROVENANCE. Autophagy-Lysosome Pathway Dysfunction: PROXY_QUANTITY (transcriptional regulation standing for degradative flux), CALIBRATION_PROVENANCE (cohort miRNA/transcriptomics, no autophagic-flux assay), SCALE_EXTRAPOLATION. Also reflowed a folded-scalar hyphen split in this entry's notes that check-folded-hyphens caught -- Literature-/referenced was splitting across the fold, introduced in the previous commit.

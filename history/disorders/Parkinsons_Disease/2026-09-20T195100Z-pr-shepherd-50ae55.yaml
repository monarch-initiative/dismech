  details: |
    PR Shepherd, answering the 2026-09-19 re-review on #11827.

    Item 1 - the 46% figure is an RBD frequency, and this is the RWA node. The second PMID:21832215 evidence item on REM Sleep Muscle Atonia Loss described itself as 'independent replication of this node's core quantitative claim'. It is not. This node's claim is REM sleep without atonia; Sixel-Doring et al. report the frequency of video-PSG-confirmed RBD by their own modified definition, and 46% is not a majority. The rem_sleep_atonia_control_failure module requires a conforming entry to say which of the two it is evidencing, since only the electrophysiological finding satisfies conformance. The explanation now says the study measures RBD rather than atonia loss, pairs the 46% with the smaller series' one-third PSG-diagnosed-RBD figure rather than with its 58% atonia-loss figure, and states that the 58% figure remains what the conformance claim rests on. The snippet, supports, evidence_source and reference_title are unchanged, and the first evidence item's explanation was already correct and is untouched.

    Item 2 - removed the 2026-09-14T141839Z-claude-code-1c7f22 history record. It described adding two pathophysiology nodes, Pontine Alpha-Synuclein Pathology of the REM-Atonia Circuit and REM Sleep Without Atonia, neither of which exists in the merged result under any name: PR #9564 landed a fuller three-node chain for the same issue first, and the 2026-09-19 reconciliation dropped this branch's nodes rather than duplicate main's chain in a flat node namespace. The record has never been on main and its session left no surviving change to the entry, so removing it is not an append-only violation. The 2026-09-19T180611Z-pr-shepherd-886d9e record beside it narrates that session and the supersession in full and is left in place; its sentence about leaving the earlier record unedited describes what that session chose to do, and this record supersedes that call.


  summary: Link pesticide and head trauma exposures into the pathograph
  details: |
    Backfill for issue #8085. Pesticide exposure is TRIGGERS with DIRECT into the mitochondrial dysfunction node, which is built around complex I deficiency. The directness comes from the rat rotenone model, in which a pesticide directly inhibits complex I, and this is stated in the link description rather than left to inference, because the human evidence available here reaches only the association between pesticide exposure and developing the disease. Both items are graded PARTIAL accordingly, one tagged MODEL_ORGANISM and one OTHER for the review it comes from. PMID:11100151 was fetched for this change with just fetch-reference. The same rat study also reproduced alpha-synuclein-containing nigral inclusions, which would support an edge into the aggregation node; that edge was not drawn, because rodent inclusion pathology would then be its only support, and CLAUDE.md is explicit that model-organism evidence should not stand alone behind a human claim. Head trauma is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into dopaminergic neuron loss, the core neuropathological lesion, because the meta-analysis quantifies risk of the disease and no cited sentence follows the injury to a mechanism; neuroinflammation is the usual proposal and this entry has a node for it, but nothing here measures that route. Rural living was deliberately left unlinked. Its only evidence item is the sentence stating that clear links to rural living have NOT been established, so there is no exposure-to-node claim to draw; drawing one would convert a negative finding into a pathograph edge. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 154 of 160 with 6 pre-existing DOI-prefix skips, none on items added here.

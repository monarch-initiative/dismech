  details: |
    PR Shepherd conflict resolution. This branch and PR #9564 both addressed the Parkinson's half of issue #9432, and #9564 merged first.

    What main already has. #9564 added a three-node chain - Pontine Tegmental Alpha-Synuclein Pathology -> Loss of Descending Drive to Inhibitory Premotor Neurons -> REM Sleep Muscle Atonia Loss -> the existing REM Sleep Behavior Disorder phenotype - conforming to the same three nodes of rem_sleep_atonia_control_failure. That is a superset of what this branch proposed: this branch had two nodes and folded the intermediate step into an edge description, which is exactly the compression the round-1 review on this PR flagged as defensible-but-worth-reconsidering. Main also binds the module's sublaterodorsal nucleus term at the lesion node.

    Resolution. The conflicting hunks were resolved to main's structure wholesale. This branch's two proposed nodes are dropped, not merged: re-adding them would duplicate main's chain under different names in a flat node namespace, which is the phantom-duplicate failure mode CLAUDE.md warns about.

    What survives, and why it is worth keeping. PMID:21832215 (Sixel-Doring et al.) is cited nowhere on main and its cache file is absent there. It is an unselected PD cohort of n=457 studied with video-supported polysomnography, reporting an overall RBD frequency of 46%. Main's REM Sleep Muscle Atonia Loss node rests entirely on PMID:12196654, a 33-patient series. The two evidence items from this branch are therefore attached to main's node as independent replication at roughly fourteen times the cohort size, with explanations rewritten to say that rather than to restate the conformance-requirement argument main's existing items already make. The 46% figure sits between that series' 58% atonia-loss and one-third PSG-diagnosed-RBD figures, so the studies corroborate rather than conflict.

    Net effect on main: three files, +94 lines - two evidence items, the reference cache file generated for them, and history.

    The earlier record in this directory (2026-09-14T141839Z-claude-code-1c7f22.yaml) describes the original session on this branch and is left unedited. Its details describe adding the two nodes, which this reconciliation no longer does; a reviewer may reasonably prefer to drop that record before merge, since the session's structural output reached main through #9564 instead.

    Validation: just validate clean, 210/216 snippets verified against the local cache (6 skipped by prefix, 0 failures), both new snippets among the verified, plus check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and validate-terms all clean.

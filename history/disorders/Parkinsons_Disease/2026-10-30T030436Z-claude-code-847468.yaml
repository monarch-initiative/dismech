  summary: 'Parkinsons_Disease: link Mitochondrial Dysfunction to mitochondrial_dysfunction'
  details: |
    Added two mitochondrial_dysfunction module links to the Mitochondrial Dysfunction node, alongside its existing parkinsonism_dopaminergic_degeneration link. Bioenergetic Decline and Oxidative Stress rests on the complex I deficiency in post-mortem substantia nigra (PMID:2154550) and the CHCHD2 loss that impairs respiration and causes oxidative stress (PMID:28589937). Impaired Mitophagy and Quality Control rests on the PINK1, Parkin and FBXO7 quality-control evidence (PMID:23933751, PMID:25611507). VPS13C is not cited for either link: its evidence (PMID:26942284) shows lower membrane potential and fragmentation but increased respiration and exacerbated PINK1/Parkin mitophagy, so the node-wide DECREASED mitophagy modifier describes the PINK1/Parkin/FBXO7 core rather than the VPS13C subset. The module's description covers secondary mitochondrial injury in neurodegeneration. Added GO:0006119 oxidative phosphorylation and GO:0000422 autophagy of mitochondrion (both DECREASED) and GO:0072593 reactive oxygen species metabolic process (INCREASED), matching the module nodes and the node's statement that complex I deficiency leads to oxidative stress. No evidence was added or changed. Validated with just validate and count-verified-snippets.

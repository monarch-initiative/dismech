  summary: Add brain-to-gut barrier arm from nigrostriatal dopaminergic loss
  details: 'Addresses issue #12152, which asked whether pathophysiology nodes should be added for dopamine-dependent
    regulation of gut barrier integrity.


    The entry already carried a gut-to-brain (body-first) chain: Gut Microbiome Dysbiosis -> Intestinal
    Inflammation and Barrier Dysfunction -> Enteric Alpha-Synuclein Seeding -> Vagal-Brainstem Propagation
    -> Alpha-Synuclein Aggregation -> Dopaminergic Neuron Loss -> Striatal Dopamine Deficiency. What was
    missing was the return arrow. Added:


    1. New pathophysiology node ''Intestinal Tight Junction Protein Loss'' (biological_scale MOLECULAR),
    bound to GO:0120193 tight junction organization with modifier DECREASED, CL:0002563 intestinal epithelial
    cell, and UBERON:0001155 colon plus UBERON:0002116 ileum. It carries a negative result as evidence
    (villin/brush border unchanged) which narrows the node to the junctional compartment rather than generalized
    enterocyte injury. Downstream to the existing ''Intestinal Inflammation and Barrier Dysfunction''
    node via the LPS/iFABP translocation readouts.


    2. Two downstream edges out of ''Striatal Dopamine Deficiency'', to the new node and to ''Gut Microbiome
    Dysbiosis'', both causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES because neither lesion study identifies
    the mediating route. These close a feedback loop with the body-first chain; deliberate cycles of this
    kind are present in 55 other disorder entries.


    3. A HUMAN_MODEL_MISMATCH discussion (pd_brain_to_gut_tight_junction_translation) recording that the
    rodent result does not transfer cleanly. In human colonic biopsies (PMID:25775153, 31 patients) occludin
    rather than ZO-1 is reduced and neither para- nor transcellular permeability differs from controls,
    though both proteins are mislocalized. Two human-study evidence items are graded supports: REFUTE,
    which is established usage for a directly contradicting result (36 such items KB-wide on HUMAN_MODEL_MISMATCH
    discussions). The discussion names three non-distinguished explanations (lesion acuity, sampling stage/medication,
    species difference) and proposes two experiments with decision criteria.


    The new edges deliberately carry NO hypothesis_groups. The brain-first hypothesis in this entry is
    specifically about where alpha-synuclein pathology initiates, and the 6-OHDA model produces no brain
    alpha-synuclein pathology at all (stated in PMID:37271045), so tagging these edges brain-first would
    misattribute them.


    Evidence: PMID:42732868 (the paper named in the issue; 6-OHDA rat, MODEL_ORGANISM), PMID:37271045
    (independent 2023 replication from a different group, MODEL_ORGANISM), PMID:25775153 (human colonic
    biopsy study, HUMAN_CLINICAL). All eleven snippets were verified as exact normalized substrings of
    the cached references before insertion.


    Deep research: ''just dr_fallback=--fallback research-disorder falcon Parkinsons_Disease'' was run
    because EDISON_API_KEY/FUTUREHOUSE_API_KEY were not configured. Falcon failed with ProviderNotConfiguredError
    and openscientist produced the report, which is recorded in the report frontmatter (fell_back: true,
    requested_provider: falcon) and in its filename after running scripts/align_research_provider.py.
    The report covers the gut-to-brain direction (finding F008) and does not address the reverse arm,
    which corroborates the gap the issue describes; no claim in this change is sourced from it. The previously
    committed falcon report was transiently overwritten by the run and was restored from git untouched.


    Validation: just validate, just validate-terms, just check-entity-refs, just check-causal-targets,
    just check-duplicate-keys, just check-folded-hyphens, just check-snippet-length, just check-title-snippets
    and just check-snippet-grading all pass. just validate-disorders run over the changed file. Snippet
    verification reported 242/248 with 6 skipped by prefix, none of them from this change.


    Not changed, and pre-existing: just check-genereviews reports seven untagged GeneReviews chapters
    for this entry. All seven are gene-specific monogenic Parkinson chapters (LRRK2, VPS35, RAB32, PRKN,
    PINK1, DNAJC6, plus the Monogenic Overview) and this entry is category Complex with separate sibling
    entries for those genes, so they are not this entry''s baseline. The check is advisory and exits 0.
    Left for a separate decision rather than widened into this change.


    Report validation (retro-fitted with just validate-research-reference and just validate-research-terms,
    since the openscientist run wrote no validation frontmatter). References: 50/50 resolved, 0 unresolved,
    1/1 quoted claim verified, 0 off topic. Terms: 0 unresolved, but 3 named as a different term, including
    CHEBI:27958, which the report calls ''nicotine/tobacco'' and CHEBI calls cocaine, and CHEBI:8148,
    which is obsolete. None of those identifiers is bound anywhere in this change. The four bindings added
    here (GO:0120193, CL:0002563, UBERON:0001155, UBERON:0002116) were each read from a local OAK lookup
    at the time of writing, not taken from the report.


    Deliberately left out of the commit: the report reference validation fetched roughly 47 further references
    into references_cache/ and upgraded two already-tracked cache files (PMID_24136244, PMID_34210995)
    from abstract to full text. Those two were reverted and the untracked remainder was not staged, since
    none is cited by this entry and the repository convention is to commit the caches the KB entry actually
    cites.


    Pre-PR red-team review round (self-review before opening the PR, findings acted on in the same commit).
    The review read the cached full text of PMID:25775153, which is cached as full_text_xml rather than
    abstract only, and found that the first draft''s framing of the mismatch was wrong in two ways.


    First, the draft offered levodopa exposure as one of three candidate explanations. The paper tested
    that and argues against it: moderate to severe junctional disorganization was present in the five
    patients who had never received levodopa, and no correlation was found between cumulative dose and
    severity of altered permeability. That explanation was removed and the finding is now cited as its
    own evidence item.


    Second, and more substantively, the draft treated ''human ZO-1 unchanged'' as a flat contradiction
    of the rodent result. It is largely a modality difference. The human ZO-1 null is an immunoblot on
    whole-biopsy lysate; by immunofluorescence, which is the modality both rodent studies used, the same
    cohort is abnormal (normal reticular staining in 6 of 8 controls against 9 of 31 patients; disrupted
    morphology in 1 of 8 controls against 14 of 31 patients). On the matched modality human and rat agree.
    The discussion''s central claim was therefore narrowed to the functional permeability discordance,
    which carries no such confound, and measurement non-equivalence was added as a candidate explanation.
    The prompt, rationale and both experiment decision criteria were rewritten accordingly, and the first
    experiment now assays abundance, organization and flux on one specimen because the existing human
    study left modality and protein confounded.


    Three further findings were fixed. An evidence item that said ''Refutes ... while still supporting
    ...'' was split into a REFUTE on the ZO-1 immunoblot null and a SUPPORT on the immunofluorescence
    disruption counts, per the CLAUDE.md rule that one item may not make two opposite claims. The PMID:37271045
    item on the tight junction edge quoted the paper''s alpha-synuclein and glial-activation conclusion
    while its explanation claimed replication of the junctional outcome; it now quotes the ZO-1 barrier
    integrity sentence, and the directional quote was kept as a separate item graded directness: INDIRECT.
    The node''s description called it the ''gut-side terminus'' of the brain-to-gut arm, which its own
    downstream edge contradicts, and now states that the arm joins the body-first chain at the shared
    barrier node.


    Also from the review: added cellular_components GO:0005923 bicellular tight junction alongside the
    process term, since the node makes a protein-abundance claim and GO:0120193 is a process; relaxed
    the edge into Intestinal Inflammation and Barrier Dysfunction from DIRECT to INDIRECT_KNOWN_INTERMEDIATES
    because that target bundles inflammation with barrier failure and only the barrier half is direct;
    and removed an unsourced ''near-complete'' description of the rodent lesion extent. The review confirmed
    the four ontology bindings, all reference titles, every evidence_source, the omission of hypothesis
    groups, and that REFUTE is correct established usage here.'

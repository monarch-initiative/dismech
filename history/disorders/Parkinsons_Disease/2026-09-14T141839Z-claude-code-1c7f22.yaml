  details: |
    Added two pathophysiology nodes to the alpha-synuclein propagation chain: Pontine Alpha-Synuclein Pathology of the REM-Atonia Circuit (conforms_to rem_sleep_atonia_control_failure#Lesion of the Pontine REM-Atonia Generator), downstream of Vagal-Brainstem Alpha-Synuclein Propagation, evidenced by PMID:39577924 (post-mortem series distinguishing PD-without-dementia converters, whose alpha-synuclein stayed confined to brainstem/limbic structures) and PMID:17412731; and REM Sleep Without Atonia (conforms_to rem_sleep_atonia_control_failure#Failure of REM Sleep Skeletal Muscle Atonia), downstream of the pontine node and pointing at the existing REM Sleep Behavior Disorder phenotype, evidenced by PMID:21832215 (Sixel-Doring et al., n=457 PD cohort, video-supported polysomnography, 46% RBD frequency) and PMID:30166532. This addresses the Parkinson's Disease half of issue #9432; the Dementia_with_Lewy_Bodies half is explicitly left as a larger follow-up since that entry has only 3 pathophysiology nodes and no brainstem arm at all, per the issue's own scoping. Validated with just validate-disorders, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-snippet-length, just check-folded-hyphens, and just check-snippet-grading, all clean.

  summary: Deep claim-by-claim evidence review of Parkinson's Disease entry; fixed
    gene duplication, evidence_source, added prevalence + cognitive-impairment phenotype
  details: |
    Manual, claim-by-claim verification of every evidence snippet in the entry against its cached reference (no automated-only pass). All ~90 evidence snippets across mechanistic_hypotheses, pathophysiology causal edges, phenotypes, stages, genetic, environmental, treatments, and datasets were checked as exact substrings of their cited abstracts/full text; every one verified faithfully and supports its explanation. The four unusually high 2025-2026 PMIDs (42320726 MAPK, 42263400 complement C3, 41781031 weight loss, 41301797 non-motor severity) were independently confirmed real on PubMed with matching abstracts - not hallucinations. Fixes applied: (1) Genetics de-duplication - merged the duplicate PARK2 entry into PRKN and the duplicate GBA entry into GBA1 (same genes, old vs current HGNC symbols), preserving all evidence; (2) added missing gene_term HGNC bindings to SNCA (11138), LRRK2 (18618), PINK1 (14581) and relationship_type controlled-vocab to all monogenic entries; (3) corrected the LRRK2 GTPase-domain node preprint evidence_source from HUMAN_CLINICAL to IN_VITRO (structural/biochemical preprint); (4) added a structured prevalence block (2-3% of population >=65, POINT_PREVALENCE, PMID:28332488); (5) added a Cognitive Impairment phenotype (HP:0100543, PROGRESSIVE course) with two verified snippets from PMID:34210995 (Aarsland Nat Rev Dis Primers 2021). Schema, term, and reference validation all pass. Outstanding items filed as GitHub issues: LRRK2 R1441C/G/H pathogenic GTPase-mechanism claims need a dedicated primary citation (currently only the protective-R1398H preprint is cited); Calcium Dysregulation CaV1.3 pacemaker-vulnerability claim is under-cited (generic snippet only); several well-established PD phenotypes still missing (orthostatic hypotension/autonomic dysfunction, dysphagia, anxiety, psychosis/hallucinations, freezing of gait); cardinal-motor-sign phenotypes and their downstream edges lean on the Rotterdam Study epidemiology design paper (accurate but weak sourcing).

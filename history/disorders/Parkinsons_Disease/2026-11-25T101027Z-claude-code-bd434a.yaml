  summary: 'Review round: correct AHS maneb strata and non-US scope in pesticide notes'
  details: |
    Answers the 2026-11-22 review of PR 18743. The Pesticide Exposure notes said maneb was tested only in the Agricultural Health Study's under-63 subgroup; PMID:32919961 Table 2 tests it in the whole cohort with the hazard ratio split at the median age of 63 (footnote d, failed proportional-hazards check), null in both strata: 1.43 (0.63-3.22), 8 exposed cases, at 63 or under and 0.75 (0.44-1.25), 21 exposed cases, over 63. Both strata are now reported. The notes and the PMID:28704700 explanation called the Dutch study the only non-US study of this factor, which is false because the factor also cites the paraquat (PMID:30474499) and organochlorine (PMID:39520734) meta-analyses; both now say it is the only non-US compound-level screen cited here.

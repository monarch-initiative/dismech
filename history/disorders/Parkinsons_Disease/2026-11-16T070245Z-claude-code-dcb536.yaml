  summary: Record ClinGen validity for seven PD genes; add oropharyngeal dysphagia
  details: |
    Seven genetic rows (SNCA, LRRK2, PINK1, GBA1, PARK7, PRKN, VPS35) already cited a ClinGen gene-disease validity record for Parkinson disease (MONDO:0005180) as evidence but did not record it as gene_disease_validity. Each now carries one DEFINITIVE assertion, classified_by CLINGEN, with the CGGV identifier as external_id and the cached table row quoted as evidence, copied from the record the row already cited. just list-gene-validity reports 0 backfill and 0 conflict for the entry. GBA1 stays relationship_type RISK_FACTOR: the ClinGen assertion grades the strength of the gene-disease link, not its kind.

    Added Dysphagia (HP:0200136 Oral-pharyngeal dysphagia), the last phenotype issue 6231 listed that the entry lacked. The FREQUENT band follows the patient-reported pooled prevalence of 35% in the Kalf 2012 meta-analysis (PMID:22137459); the objective-measurement figure of 82% is recorded in notes and the explanation. It is linked from Alpha-Synuclein Aggregation as INDIRECT_KNOWN_INTERMEDIATES, through Lewy pathology in the pharyngeal motor nerves (PMID:23334595) and pharyngeal sensory nerves (PMID:23771215): two autopsy studies from one group and brain bank (10 PD patients, 4 controls) in which aggregate density was higher in patients who had had dysphagia. The motor-nerve paper's conclusion is quoted as DIRECT; the sensory-nerve paper's mechanism is the authors' inference, so that item is INDIRECT. Connected phenotypes went from 13 of 20 to 14 of 21.

    Checks: just validate, validate-terms and count-verified-snippets (423 of 429 verified, 6 skipped by prefix) pass on the entry, as do check-entity-refs, check-causal-targets, check-name-collisions, check-coarse-phenotypes, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-logical-rules, check-gene-validity, check-title-snippets, check-reference-titles and check-snippet-length.

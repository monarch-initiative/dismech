  summary: 'Parkinsons_Disease: link Neuroinflammation to neuroinflammation_glial_activation'
  details: |
    Linked the Neuroinflammation node to two neuroinflammation_glial_activation module nodes: Reactive Microglial and Astrocytic Activation (its microglia and astrocyte cell types and glial-activation description) and Proinflammatory Cytokine and Chemokine Release (its TNF, IL-1beta and IL-6 production processes, which match that module node exactly). Added GO:0001774 microglial cell activation (INCREASED). The node's existing evidence was three reviews, so added primary human evidence: post-mortem HLA-DR-positive nigral microglia (PMID:3399080), [11C](R)-PK11195 PET microglial activation (PMID:16182554), and raised striatal and CSF TNF-alpha (PMID:8015728) and striatal IL-1beta and IL-6 (PMID:7700568; the authors suggest the rise may be partly compensatory, noted in the explanation). On the edge to Dopaminergic Neuron Loss, added PMID:15668962 (microglial activation tracks dopamine terminal loss, SUPPORT, INDIRECT) and PMID:16182554 (no correlation with putamen dopa uptake or severity, REFUTE, INDIRECT). Refs issue 15590. Validated with just validate and count-verified-snippets.

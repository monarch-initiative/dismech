  summary: Integrate assessed OpenScientist findings for both alpha-synuclein origin-site
    hypotheses
  details: |
    Integrated the RETAINED and QUALIFIED claims from the two codex assessments of the OpenScientist hypothesis reports for body_first_enteric_alpha_synuclein_model and brain_first_central_alpha_synuclein_model. No new assessment sidecars were written; both hypothesis folders already carry openscientist-assessment-by-codex.yaml. Nineteen new evidence items, all snippet-verified against the local reference cache (count-verified-snippets went from 155 of 161 to 174 of 180). BODY-FIRST. Added PMID:28446653 (Swedish vagotomy register cohort) as a REFUTE plus a SUPPORT pair on the hypothesis entry: the entry previously cited only the Danish cohort and read the vagotomy epidemiology more strongly than the literature supports, since vagotomy overall showed no association and the authors call their own result preliminary and indirect. Added PMID:41105632 (cutaneous alpha-synuclein signatures) for the distal to proximal gradient, plus a second item recording that subtype membership came from the REM sleep behavior disorder proxy. Added PMID:42295088 and PMID:42327194 to the existing edge from Intestinal Inflammation and Barrier Dysfunction to Enteric Alpha-Synuclein Seeding; both are LRRK2 G2019S conditional mouse models, which the explanations state. Added PMID:38750146 to the LRRK2 genetic entry as a candidate explanation for incomplete penetrance. Added the two fecal microbiota transplantation trials PMID:41826284 (positive, repeated dosing) and PMID:41674471 (null, single dose) to the existing gap_pd_microbiome_causal_direction_body_first discussion, which is where the inconsistent intervention claim belongs. BRAIN-FIRST. Added PMID:41105632 for the proximal dominant cutaneous pattern, and PMID:41714532 (17.8 percent) with PMID:29084403 (62.5 percent) to ground the previously uncited RBD prevalence range in the hypothesis notes. Added PMID:40209563 (amygdala diffusion MRI) and PMID:33547846 (BAC-SNCA olfactory bulb preformed fibril mice) to the Central Alpha-Synuclein Initiation node, each paired with a bounding item recording the proxy based subtype labels and the absence of motor dysfunction respectively. NEW DISCUSSION. gap_pd_origin_site_operationalization (KNOWLEDGE_GAP), attached to both hypothesis groups, recording that neither NSD-ISS (PMID:38267190) nor SynNeurGe (PMID:39973492) carries an origin site axis and that data-driven subtypes outperform the body-first label for progression milestone enrichment (PMID:42286020). NOT CHANGED. Hypothesis status values stay ALTERNATIVE, as both reports own candidate status changes recommend. The 20 to 30 percent body-first prevalence estimate was left alone because the assessment marks it NEEDS_VERIFICATION with no validated origin site prevalence study behind it. The immunotherapy timing inference was REJECTED by the assessment and was not integrated. The report's proposed enteroendocrine cell node and curli cross-seeding edge were not added: the enteroendocrine cell type is already bound on the Gut Microbiome Dysbiosis node, and the curli edge falls outside the assessed claim set. The superseded preprint PMID:40678221 was not cited, only noted in the new discussion notes.

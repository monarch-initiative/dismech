  details: |
    Addresses the critical finding and findings 2-6, plus two of the suggestions, in one push.

    CRITICAL: the RBD evidence explanation attributed the disorder to 'brainstem dopaminergic pathology'. The subcoeruleus and magnocellularis nuclei are glutamatergic and glycinergic respectively, the word dopaminergic does not appear in the cited passage, and the clinical significance of RBD in PD is precisely that it marks non-dopaminergic brainstem degeneration preceding nigral loss. Rewrote the explanation to say that, and took finding 2 at the same time by replacing the dangling relative clause ('which normally inhibit muscle activity during REM sleep') with the sentence that actually carries the claim: 'It results from dysfunction of the subcoeruleus and magnocellularis nuclei in the brainstem'.

    Finding 3: the depression/anxiety/sleep snippet sat under REM Sleep Behavior Disorder but is about sleep disturbance in general. Moved it to the Depression phenotype and rewrote the explanation, which had added 'cognitive changes' and a therapeutic recommendation the quote does not support.

    Finding 4: the dopamine explanation asserted an effect on sleep-wake regulation 'independently of motor circuits' and used the word depletion; the snippet says neither. Narrowed it to what the sentence states - that sleep is among the non-motor functions dopamine influences.

    Findings 5 and 6 together: the Physical Therapy description and evidence claimed exercise rebalances basal ganglia circuits while the target_mechanisms edge said BYPASSES, which are opposite claims about the same edge. Changed the edge to MODULATES, which is the claim the entry cites evidence for, and noted in the edge description that cueing and compensation strategies do work around the circuit and are delivered alongside. Moved the mechanism-of-action snippet from treatment-level to link-level evidence on that edge, and regraded it from HUMAN_CLINICAL to OTHER with quote_role REVIEW_SYNTHESIS: it sits under the review's 'Modulation of glutamate and motor circuits' heading and is its synthesis of references [305-308], not a result this paper reports.

    Also took two suggestions. Added quote_role: REVIEW_SYNTHESIS to the other review-derived items from PMID:42646502. Made the UPDRS snippet self-describing by moving it to the sentence naming the study and the 8-week PWR!Moves intervention; the adjacent result sentence could not be quoted alongside it because the citation marker between them is stripped before substring matching, and that constraint is recorded in the explanation rather than worked around.

    Not taken: the review's uncovered insomnia/EDS/OSA/RLS content, which is new phenotype curation rather than a correction to what is here.

    Validation: just validate passes with 189/195 snippets verified (6 skipped by prefix, unchanged). check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-snippet-grading all clean.

  summary: Add Nigral Cellular Senescence pathophysiology node
  details: |
    Adds a Nigral Cellular Senescence node, the senescence arm of the autophagy-senescence-inflammasome axis that #6189 proposed for this entry and that #15590 tracked as the remaining Parkinson's gap. The entry had no senescence node; the cellular_senescence module was already linked from Alzheimer_Disease, Amyotrophic_Lateral_Sclerosis and Ischemic_Stroke but not from here.

    The node conforms to two cellular_senescence nodes, Senescent Cell Accumulation and Senescence-Associated Secretory Phenotype, and binds astrocyte and dopaminergic neuron cell types plus GO:0090398 cellular senescence, INCREASED. Three primary studies carry it: PMID:29386135 (p16INK4a and SASP factors in parkinsonian SNpc, lamin B1 loss localised to GFAP-positive astrocytes, paraquat model, senescent-cell depletion preserving nigral tyrosine hydroxylase), PMID:31543366 (p21 raised in TH-positive nigral neurons in sporadic PD; SATB1 loss sufficient for a senescence program in dopaminergic neurons) and PMID:34359864 (lamin B1, HMGB1 and SATB1 reduced and p21 raised in PD midbrain; alpha-synuclein preformed fibrils inducing the same marker shifts in mouse glia).

    Two outbound edges, both INDIRECT_UNKNOWN_INTERMEDIATES: to Neuroinflammation, carrying the authors' own finding that IL-6 alone did not reproduce dopaminergic degeneration, so the secreted route is not resolved; and to Dopaminergic Neuron Loss, resting on the paraquat depletion experiment. Two inbound edges: from Alpha-Synuclein Aggregation, and a TRIGGERS link from the existing Pesticide Exposure environmental entry, which already lists paraquat among its chemicals and previously reached only Mitochondrial Dysfunction.

    The two human datasets disagree on p16: PMID:29386135 reports it elevated in parkinsonian SNpc, PMID:34359864 reports it unchanged in PD midbrain. That disagreement is recorded as a REFUTE evidence item on the node and in its notes, and no p16 or CDKN2A term is bound; p21 is the marker raised in both and is what the node rests on. Microglia are not bound because the only microglial senescence evidence here is the mouse fibril model. The notes also record that the human evidence is post-mortem marker measurement and cannot order senescence against degeneration in time.


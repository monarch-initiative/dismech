  summary: Review COX15 clinical spectrum, heme A mechanism and experimental interventions
  details: |
    Reviewed the original COX15 entry against cached clinical and experimental sources, including the founding 2003 full text, the full 2025 sibling report and table, the 2016 heme A synthase study, and the 2011, 2015 and 2018 mouse intervention studies. Read the available abstracts of the intervening COX15 clinical reports. The 2004 Oquendo PMID and DOI fetches returned no quotable content; publisher/PMC routes were also unavailable on this review. No evidence quotes that empty cache. Its secondary clinical findings are attributed explicitly to the GeneReviews gene-specific table. Reference files were generated by the fetcher, never edited by hand.

    Replaced bundled mechanisms and the generic SCO2 functional citation with COX15-specific evidence. Separated synthase deficiency, heme A availability, complex IV biogenesis, respiratory capacity, cristae disorganization, and the provisional mouse autophagic-flux/mitochondrial-clearance branch. Protein stability differs by allele. Heart heme O accumulation is not assumed in fibroblasts. Normal assembled COX in a slowly progressive patient's fibroblasts limits a universal assembly-loss claim. Avoided unmeasured ATP collapse, constitutive mTOR activation and definitive PINK1/Parkin causality.

    Expanded the clinical spectrum from two to 33 features. Severe neonatal cardiomyopathy is not obligatory: slowly progressive neurological disease, adolescent generalized dystonia and normal cardiac examinations are documented. Added neurological, dysmorphic, skeletal, sensory, imaging and metabolic findings with no inferred population frequencies. GeneReviews-listed retinopathy/hepatic steatosis and the 2025 review's optic atrophy statement are explicitly secondary/background evidence. The 2025 paper's erroneous opening description equating COX15 with the full respiratory complex was not imported; internally awkward age/development and table/narrative details were not converted into unsupported per-patient assertions. Elevated liver enzymes were retained without guessing which enzymes were measured.

    Recorded recessive inheritance, recurrent Arg217Trp, splice/truncating classes, likely-pathogenic classifications and the limits of genotype-severity prediction. Historical nucleotide numbering from the founding report is labeled as such. OAK confirmed the current MONDO term and its mitochondrial complex IV deficiency nuclear type 6 synonym, HPO terms, COX15 gene identity, GO synthase activity/process terms, and treatment/agent bindings.

    GeneReviews assessment found no chapter named for COX15. The applicable Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview was fetched in full, tagged, and mined for clinical context, genomic diagnosis, surveillance, symptom management, metabolic/anesthetic precautions and recessive counseling/PGT. Its aggregate phenotype frequencies were not transferred to COX15. Muscle biopsy is not presented as a mandatory first test. The POLG-specific absolute valproate contraindication was not assigned to COX15.

    Linked immortalized patient fibroblast complementation, the yeast homologous pathogenic variant and conditional mouse/OPA1 rescue systems to mechanisms, with human-model limitations. AICAR improved biochemistry but not Cox15 motor performance; bezafibrate caused adverse effects; rilmenidine restored flux without phenotypic benefit; rapamycin improved clearance and function without raising absolute COX activity. OPA1 overexpression is a transgenic proof of principle, not established patient gene therapy or a human modifier allele.

    Completeness cross-check used the broad Cytochrome_c_Oxidase_Deficiency-deep-research-falcon report, its citation companion and gene table. Phenotypes, mechanisms, genetics, diagnosis, treatments, models and central references are covered with gene-specific verification. No mechanistically distinct COX15 subtypes are established; severe and milder courses remain a spectrum. Other-gene anemia/copper-rescue results and pooled myopathy-trial outcomes were not transferred. No disease-specific trial or dataset surfaced in the directly used studies. No population prevalence or penetrance estimate is inferred.

    Schema, ontology terms and reference validation pass: 116 verified snippets, 129 titles and two targeted disorder tests. Shared-cache consumers were checked (31 entries, 1724 snippets before the final clinical additions). Full repository QA and final scope inspection are recorded in the PR validation summary.

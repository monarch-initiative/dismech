  summary: 'Create: Noonan Syndrome with Multiple Lentigines / LEOPARD syndrome'
  details: |
    Created a single dedicated NSML/LEOPARD entry MONDO:0007893 unifying LEOPARD syndrome types 1, 2 and 3 as PTPN11/RAF1/BRAF gene-defined subtypes plus MAP2K1, per user-confirmed scope decision of one page not three, modeled as a RASopathy like Noonan_Syndrome. Deep research falcon auth-failed infra-side, fell back to claude_code provider. GeneReviews PMID:20301557 used as mandatory phenotype baseline. Mechanism captures the catalytically-impaired dominant-negative SHP2 vs Noonan gain-of-function distinction and the paradoxical cardiac ERK/mTOR hyperactivation driving HCM reversible by rapamycin. Validated with just validate schema and terms pass, all 32 PMID evidence snippets programmatically verified as exact substrings of cached abstracts, compliance 96.0 percent.

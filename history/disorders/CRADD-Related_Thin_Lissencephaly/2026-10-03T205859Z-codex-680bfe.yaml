  details: |
    Reviewed cached primary full texts for PMID:27773430, PMID:30281648, PMID:33710394, PMID:30167849 and PMID:22279524, the full 2019 Finnish founder report (PMC6777631), published clinical supplements, the Harel and Koprulu abstracts, and the ClinGen 2021 case-level curation. Corrected the universal preserved-PIDD-binding claim: G128R differs in cells, while R170C/H differ between cellular co-IP and purified-protein assembly. Separated protein depletion, assembly, caspase activation, cultured cell death and clinical morphology, with emerging hypothesis edges for human developmental apoptosis. Expanded cohort- and case-qualified phenotypes, nine alleles, MRI/cognitive/genetic evaluation, reported supportive and pharmacological care, five experimental preparations and the knockout mouse. Preserved discussion and proposed-experiment identifiers. Removed asserted human migration/pruning defects and progenitor-module conformance. The grouping now explicitly represents the genetically defined CRADD branch without asserting progenitor dysfunction. Corrected the renamed node-class example. External ClinGen classification is attributed with date and broader disease scope; no curator validity tier. No dedicated GeneReviews chapter in the alias-aware committed-index check. Parent/grouping deep-research reports and artifacts supply broader cortical-malformation context; their CASP2/PIDD1 and progenitor claims were not transferred into CRADD patient evidence. No established CRADD subtypes or trials surfaced. Supplemental DOCX visible text was extracted from word/document.xml w:p/w:t elements, excluding hidden EndNote instructions; source URLs are retained in research/*.extracted.md. File references were generated with scripts/run_reference_validator.sh cache reference file:research/CRADD_Polla_2019_Supplement.extracted.md (and Jarvela), using an otherwise unchanged validator config with reference_base_dir set to the repository root. No cache was hand-authored. The 2016 supplement download remained blocked by publisher/PMC access, but the full primary article including tables was read. Restored the original PMID:22279524 cache after a generated extractor refresh disrupted unrelated consumers; the focal quote verifies against the original. Removed old seeded-from-epic process notes from KB prose. Local schema/terms/references: 114 snippets and 125 titles verified; no short/title-only/grading conflicts; molecular-function grounding 1/1. Additional final graph, group, model, rendering and history checks recorded in PR validation.

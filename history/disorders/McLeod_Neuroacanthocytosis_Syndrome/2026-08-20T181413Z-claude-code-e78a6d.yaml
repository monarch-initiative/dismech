  summary: 'Create: McLeod Neuroacanthocytosis Syndrome (XK)'
  details: |
    New Disease entry for McLeod neuroacanthocytosis syndrome (MONDO:0018945, OMIM 300842), X-linked, caused by hemizygous loss of XK (hgnc:12811).

    Mechanism curated as 10 atomic pathophysiology nodes branching from one molecular lesion into four largely independent clinical arms rather than a single chain: XK loss splits into (a) loss of the covalent Kell-XK membrane complex, which gives the McLeod blood group phenotype and the Kx/Km alloimmunization risk, and (b) loss of XK-VPS13A phospholipid scrambling at membrane contact sites, which is the proposed driver of the striatal neurodegeneration. Acanthocytosis, compensated hemolysis, chronic axonal motor neuropathy, caudate-predominant neuronal loss, the Huntington-like syndrome and the cardiomyopathy are curated as separate endpoints.

    The cardiomyopathy is deliberately NOT placed downstream of the neurodegeneration: no source derives one from the other, and the GeneReviews surveillance recommendation treats cardiac disease as independent by applying to patients with no known cardiac involvement.

    The XK-VPS13A partnership (PMID:32845802) is the mechanistic centrepiece and explains why an X-linked and an autosomal recessive neuroacanthocytosis syndrome look alike. It also explains the NEC preflight WARN: VPS13A at 18 mentions against XK at 52 is a binding partner and the principal differential, not a second disease entity, and the report OMIM matches the MONDO xref exactly. Recorded in notes.

    Two claims curated against their own received wisdom. First, the muscle involvement: the disease was originally described as a benign myopathy, but PMID:18055495 found myopathic changes in only 4 of 10 patients while all 10 had neurogenic changes, and concluded the weakness is due to axonal motor neuropathy rather than primary myopathy. The entry therefore curates a neuropathy node, not a myopathy node. Second, the alloantibody rule: the belief that non-CGD McLeod patients form anti-Km but not anti-Kx is curated as a stated belief at supports PARTIAL, because the very paper quoted was reporting a non-CGD counterexample with antibodies to both.

    The GeneReviews Agents/Circumstances to Avoid entry (transfusion with Kx-positive blood) is carried as its own treatment entry, since it is a contraindication rather than a therapy, together with the prophylactic cryopreservation recommendation that makes it workable.

    Three discussions: a KNOWLEDGE_GAP on why a non-region-specific lipid-scrambling defect destroys the caudate selectively (the entry's central unexplained step, and the reason that edge is INDIRECT_UNKNOWN_INTERMEDIATES); a CONTROVERSY on anti-Kx formation in non-CGD patients, which determines the transfusion-compatibility standard each genotype needs; and a HUMAN_MODEL_MISMATCH recording that the VPS13A relocalization result comes from overexpression in cultured cells and has not been shown at endogenous XK levels in patient neurons.

    Three differential diagnoses: chorea-acanthocytosis (VPS13A, the mechanistic relative), Huntington disease, and CGD with contiguous Xp21 deletion — the last being a co-occurrence rather than a mimic, and clinically important because CGD management involves granulocyte transfusion that a McLeod patient cannot safely receive.


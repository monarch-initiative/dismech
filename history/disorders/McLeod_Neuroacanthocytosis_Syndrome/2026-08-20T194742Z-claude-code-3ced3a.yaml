  summary: 'Review response: connect orphan nodes, mine GeneReviews counseling, fix
    three bindings'
  details: |
    Addresses all seven IMPORTANT findings and four of the suggestions in the ai4c-reviewer CHANGES_REQUESTED review of PR #9118.

    Finding 1, disconnected pathograph. Chronic Axonal Motor Neuropathy and Cardiomyopathy and Arrhythmia had no incoming or outgoing edges, so the PR's own 'one lesion, four arms' framing was not actually expressed in the graph. Both now have edges from XK Loss of Function with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, which is honest: no source available to this entry connects XK loss to axonal degeneration or to myocardial injury through an identified route. The cardiac node's description had already asserted the missing edge in prose; it is now curated.

    Finding 2, GeneReviews GENETIC COUNSELING section unmined. Three quotes added to the inheritance block: the 50 percent per-pregnancy transmission risk, the statement that affected males pass the variant to all daughters and no sons, and the availability of carrier, prenatal and preimplantation testing. The daughters/sons quote matters beyond genetics here because it determines who in a pedigree needs transfusion-compatibility information.

    Finding 3, wrong diagnosis_term. The entry bound NCIT:C15192 Blood Transfusion for blood-film and Kell/Kx phenotyping, with a note conceding it was 'bound deliberately rather than accurately' on the premise that NCIT has no term for blood group serology. That premise was wrong. NCIT:C210738 Blood Typing Test exists and is reachable from NCIT:C25218; verified before rebinding. The self-justifying note is removed rather than kept, since it argued for an error.

    Finding 4, HP:0003701 Proximal muscle weakness unsupported. The word proximal appears nowhere in PMID:18055495, and a proximal pattern contradicts the entry's own thesis that the weakness is a length-dependent axonal neuropathy rather than a myopathy. Rebound to HP:0001324 Muscle weakness, with the description stating explicitly that no distribution qualifier is asserted and why. The phenotype was also named 'Muscle Weakness and Atrophy' while binding only weakness, so skeletal muscle atrophy (HP:0003202) is now a separate phenotype.

    Finding 5, GO:0016020 membrane rebound to GO:0005886 plasma membrane, matching the preferred_term that was already there.

    Finding 6, no treatment joined the pathograph. All three therapeutic entries now carry target_mechanisms: chorea therapy to the Huntington-like syndrome node, Kx-negative transfusion to the alloimmunization node, and cardiac device therapy to the cardiomyopathy node. The transfusion link is noted as the only one acting on the mechanism itself rather than on a downstream symptom, which is what makes a restriction the most effective intervention available in this disease.

    Finding 7, phenotype omissions. Areflexia (HP:0001284) added, cited to PMID:40898647 which groups absent or diminished tendon reflexes with the raised creatine kinase and acanthocytosis this entry already curates. It is the sign that most cheaply reveals the otherwise subclinical neuropathy arm. Sudden cardiac death (HP:0001645) added from the mortality sentence already cited on the cardiac node. Ventricular tachycardia and hepatosplenomegaly are deliberately NOT added and the omission is recorded in notes: neither appears in any reference cited by this entry in quotable form, and adding either would mean citing a source for a claim it does not make.

    Suggestions taken: NCIT:C101295 Whole Exome Sequencing replaced with NCIT:C15709 Genetic Testing, since the description is targeted XK sequencing with deletion analysis rather than exome; HP:0001250 Seizure narrowed to HP:0002197 Generalized-onset seizure, which the snippet directly supports; GO:0140268 endoplasmic reticulum-plasma membrane contact site added to the VPS13A node whose name already said 'at Membrane Contact Sites'; CL:1001474 medium spiny neuron added to the striatal node; and the '90 percent are point variants' wording corrected to 'intragenic XK variants', since the GeneReviews class includes intragenic deletions and duplications.

    Validation: just validate passed, snippets 58/58 verified (was 49/49); just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean.

  summary: 'Create: DNM1 Encephalopathy'
  details: |
    Created DNM1 Encephalopathy (MONDO:0014598, DEE31A), the endocytosis/recycling-arm conformer of the synaptic_vesicle_cycle module (dominant-negative dynamin-1 -> impaired synaptic vesicle endocytosis/recycling -> reduced neurotransmission and cortical hyperexcitability). References PMID:28667181 (von Spiczak, 21-patient spectrum, GTPase/middle-domain dominant-negative, p.Arg237Trp), PMID:25262651 (EuroEPINOMICS DNM1), PMID:15217342 (SV cycle endocytosis). Validated: schema, terms, exact-substring snippet check (15/15). Added to Synaptic_Vesicle_Cycle_Disorders grouping (SATISFIED).

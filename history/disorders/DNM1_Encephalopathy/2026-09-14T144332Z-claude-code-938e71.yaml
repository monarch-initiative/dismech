  summary: 'Review response: balance the levetiracetam and ketogenic-diet claims'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 10626. Both blocking findings were that prose read one half of the source's treatment paragraph and dropped the other half. PMID:28667181 reports two durable seizure-free outcomes, not one: patient 19 on the ketogenic diet, and patient 1 who 'became seizure-free on levetiracetam and lamotrigine'.

    Finding 1: the ketogenic-diet evidence explanation called the diet 'the one durable seizure-free outcome' and counted 'two of the three patients who did well'. The cited snippet does not support either claim - patient 21 is described as a dramatic reduction in myoclonic seizures rather than seizure freedom. Rewritten to claim only the two responders the snippet names, distinguishing the seizure-free one from the reduction-only one.

    Finding 2: the treatment description named levetiracetam only as an agent that worsens seizures, and the worsening evidence item's explanation said that 'is why they are not bound as therapeutic agents'. Both statements were true in isolation but omitted that levetiracetam with lamotrigine is one of only two interventions in this cohort linked to seizure freedom. Added the counterbalancing clause to the description, softened the explanation to say the effect is patient-specific rather than a property of the drug, and added a fourth evidence item quoting the patient 1 sentence from the same cached full text.

    Also took the non-blocking suggestion to change the ketogenic treatment's preferred_term from 'ketogenic diet intake' to 'ketogenic diet therapy', matching the convention in Aicardi_Syndrome.

    Deliberately not done: target_mechanisms on any treatment (the reviewer explicitly asked not to invent one), and curation of steroids/ACTH and topiramate/zonisamide as separate treatments, which is beyond this compliance sweep's scope.

    All new snippets are exact substrings of the PR's regenerated references_cache/PMID_28667181.md full text; no new fetch was needed.

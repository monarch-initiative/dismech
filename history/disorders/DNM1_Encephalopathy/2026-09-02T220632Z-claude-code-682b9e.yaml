  summary: Treatment evidence, ketogenic diet treatment, and drug bindings for DNM1
    encephalopathy
  details: |
    Weekly compliance sweep targeting treatments. None of the three treatments carried evidence. Regenerated references_cache/PMID_28667181.md with just fetch-reference, which now retrieves the von Spiczak DNM1 cohort as full text rather than abstract only, exposing its treatment-response paragraphs. Added seven evidence items: refractoriness in 15 of 18 patients, the ranked list of agents that improved seizure control without producing freedom, the agents reported to worsen seizures, the two ketogenic-diet responders, the statement that most patients stay intractable into adulthood, the universal profound impairment and hypotonia behind supportive care, and the de novo/parental-mosaicism finding behind genetic counseling. Added a new Ketogenic Diet Therapy treatment (NCIT:C173168), since the diet accounts for two of the three good outcomes in the cohort and was previously unrepresented. Replaced the unsourced vigabatrin therapeutic_agent with clobazam (CHEBI:31413) and clonazepam (CHEBI:3756), which the cited cohort names as the most frequently beneficial agents; vigabatrin is not mentioned anywhere in that paper. Validated with just validate, just validate-terms, just count-verified-snippets (27/27), just check-snippet-grading, and just check-title-snippets.

  summary: Add transient elastography row with HCV and HIV/HCV bands
  details: |
    Added a transient elastography diagnosis row (NCIT:C106517, LOINC:77615-3) with two reference ranges: HCV monoinfection fibrosis-stage bands from Castera 2005 (7.1/9.5/12.5 kPa; PMID:15685546) and HIV/HCV coinfection bands from Vergara 2007 (7.2 kPa significant fibrosis, 14.6 kPa cirrhosis; PMID:17879910). No separate HIV/HCV coinfection entry exists, so the coinfection cut-offs are a population-stratified range on this entry. The MSKCC FibroScan patient-education page was the lead, not the source.

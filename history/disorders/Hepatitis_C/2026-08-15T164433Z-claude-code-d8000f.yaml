  summary: Cite evidence for previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 3. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. This tranche used a hardened helper that pulls `reference_title` from the cache frontmatter rather than typing it, and asserts each snippet is non-empty, over 20 characters, at least 5 words, bracket-free and present in the cache -- the guards that the #8541 review showed were missing. Cited all four previously evidence-free `environmental:` exposures, all of which are genuine transmission routes (Injection Drug Use, Unsafe Medical Practices, Occupational Exposure, Tattoos and Body Piercing). Injecting drug use is cited to the meta-analysis where it carries the single largest odds ratio of any HCV exposure (OR 9.6), which is what justifies calling it the major route. Occupational exposure carries a per-exposure seroconversion rate (0.31% over 4,403 exposed healthcare workers). Tattoos is PARTIAL: the meta-analysis evidences tattooing but not body piercing, and measures association rather than the sterility mechanism the note names.

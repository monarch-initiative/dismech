  details: |
    PR shepherd conflict repair. #12540 wired the Hepatitis C pathograph on main while this branch replaced the coarse 'Viral Replication and Hepatocyte Injury' and 'Immune Evasion' nodes with a finer acquisition-to-chronicity chain. The branch's node structure was kept. Evidence #12540 attached to edges leaving the removed nodes was moved onto the branch edges making the same claim rather than dropped: the Cardif/NS3-4A quote (PMID:16177806) onto the NS3/4A processing to innate immune evasion edge, and both PMID:18657711 quotes onto the hepatocellular-injury edges to Elevated Transaminases and Jaundice. On edges both sides wrote (fibrosis to Cirrhosis, fibrosis to HCC development, HCC development to HCC) all distinct PMID:22537432 and PMID:19759533 quotes were kept as separate evidence items. The Jaundice frequency takes main's evidence-backed OCCASIONAL (symptomatic acute HCV in about 15% of infections), with the branch's description and Nausea/Anorexia phenotypes kept. The DAA target_mechanisms link #12540 added pointed at the removed replication node and was retargeted to 'HCV genome replication and early viremia', which its sofosbuvir/velpatasvir snippet supports. Also removed the duplicated Hepatitis_C line from projects/ANTIVIRAL.md frontmatter. Validated with just validate, validate-terms, 130/130 snippets verified, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading and check-reference-titles.

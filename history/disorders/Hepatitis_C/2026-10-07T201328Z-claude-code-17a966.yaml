  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Added a row for the CDC antibody-then-RNA testing sequence with reflex RNA testing, cited to the 2020 CDC screening recommendations (PMID:32271723) and the 2013 CDC testing guidance (PMID:23657112), both full text. Measurements: anti-HCV LOINC:16128-1 (method-less serum presence) and HCV RNA LOINC:104721-6 (IU per volume, generic molecular genetics method, since no method-less serum or plasma HCV RNA code or LOINC Part was found in the Monarch KG). The same codes were added to the two existing RNA and antibody rows and as loinc_term on the HCV RNA and anti-HCV biochemical markers. No band: the sequence is qualitative and the cited guidance defines no diagnostic RNA threshold. The combined antibody/antigen immunoassay row was left unbound.

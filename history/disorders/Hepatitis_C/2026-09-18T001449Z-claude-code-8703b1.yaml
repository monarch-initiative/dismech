  summary: Merge Acute_Hepatitis_C_Virus_Infection into Hepatitis_C as a progression
    phase (#10115, design decisions 3e)
  details: |
    Enacts decision 1 of issue #10115 (design decisions section 3e, pending in PR #12020): a phase of one infection is never its own entry, and the entry it belongs to lists its phases in progression.

    Moved in from Acute_Hepatitis_C_Virus_Infection (1,528 lines, MONDO:0100371), which was deleted with git rm: the 12 acute-phase pathophysiology nodes, 5 phenotypes, 3 biochemical markers, 3 diagnosis records, 2 differential diagnoses, 2 treatments, 1 clinical trial, 3 discussions, 2 mechanistic hypotheses, 2 prevalence records, the ECTO-bound environmental entry with its influences_mechanisms link, the transmission block, the harrisons_chapter classifications, the richer infectious_agent record, and 1 dataset (geo:GSE65123).

    Deduplicated rather than duplicated. Hepatitis_C's Viral Replication and Hepatocyte Injury node was split across the acute entry's atomic HCV genome replication and early viremia and Immune-associated hepatocellular injury nodes, and its Immune Evasion node folded into NS3/4A-mediated innate immune evasion together with its IPS-1 in-vitro evidence (PMID:16127453). Phenotypes Jaundice, Fatigue and Elevated Transaminases each merged to one record carrying both entries' evidence; Nausea and Anorexia are new. Biochemical HCV RNA, anti-HCV antibody and ALT merged to one record each. The two IL28B/IFNL3 genetic records merged to one, keeping the HGNC binding and adding the treatment-response GWAS (PMID:19684573).

    Rewiring. Pathophysiology now runs entry to translation to NS3/4A processing to replication to the innate and adaptive response to clearance or persistence to chronic infection, and from there into the pre-existing chronic nodes: new evidenced edges Chronic hepatitis C virus infection to Chronic Inflammation and Fibrosis and to Cryoglobulin Immune Complex Deposition, Chronic Inflammation and Fibrosis to Cirrhosis and to Hepatocellular Carcinoma Development, and Hepatocellular Carcinoma Development to Hepatocellular Carcinoma. The Elevated Transaminases reports_on link was repointed from the merged-away node to Immune-associated hepatocellular injury, and the discussion reference phenotypes#Elevated hepatic transaminases updated to phenotypes#Elevated Transaminases.

    Phases. progression now lists Acute infection (duration_days 180), Spontaneous viral clearance, Fluctuating viremia during unresolved infection, and Chronic infection, each evidenced. The two former has_subtypes rows Acute Hepatitis C and Chronic Hepatitis C were phases rather than organism strata; their content moved into those phases and has_subtypes was removed.

    New content. A four-route transmission block (percutaneous and parenteral blood exposure, transfusion of unscreened blood, sexual, vertical), each with exact snippets from already-cached references. MONDO:0100371 recorded in mappings.mondo_mappings with skos:narrowMatch so the concept is retired from the curation queue.

    Repointed elsewhere: kb/modules/viral_protease_inhibition.yaml, kb/node_classes/pathograph_node_classes.txt (3 worked examples), projects/ANTIVIRAL.md. The nine history records of the merged entry were moved here with target.superseded_by blocks and their original target.slug and target.path left intact.

    Validated: just validate (schema, terms, references; 122/122 snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, validate-disorders, check_granularity.py, and the unique-name, subtype-foreign-key, entity-ref, causal-target and history pytest selection.

  summary: Add exact HCV NS3/4A processing conformance and glecaprevir target
  details: |
    Review follow-up restored the verbatim GEO dataset description, removed the
    redundant parent GO term, and assigned biological scales to the three new
    conformance nodes.

    Added HCV polyprotein translation and NS3/4A-dependent nonstructural-polyprotein processing upstream of the preserved genome-replication node, and conformed that chain to the viral_protease_inhibition replicase branch. Routed active NS3/4A processing to the existing MAVS/TRIF immune-evasion node without making immune evasion a module conformer. Added a component-specific glecaprevir inhibition edge while preserving pibrentasvir as the regimen NS5A component and retaining the existing clinical efficacy edges. Restored the canonical acute-HCV hypothesis group across all three new processing-path edges, supplied causal typing and explicit intermediates for the processing-to-replication edge, aligned node roles with the module, and made replication-complex RNA synthesis explicit in the terminal conformer's description. Evidence uses PMID:22558217 and PMID:29084747.

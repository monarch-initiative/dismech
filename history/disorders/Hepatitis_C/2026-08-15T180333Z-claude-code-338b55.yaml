  summary: 'Resolve tranche-3 citation collision with #8556'
  details: |
    Conflict-resolution session against PR #8556, which landed a parallel tranche 3 over the same exposures from different sources while PR #8557 was in review. Unlike the Bipolar_Disorder record, the earlier Hepatitis_C record (2026-08-15T164433Z) remains accurate -- all four of its citations were retained -- so this record covers only what was added on top. Injection Drug Use, Unsafe Medical Practices and Occupational Exposure each now carry two citations rather than one: #8556's states the transmission route and this PR's quantifies it (OR 9.6 for injecting drug use; 0.31% seroconversion over 4,403 exposed healthcare workers). Complementary rather than redundant, so both were kept. Tattoos and Body Piercing: both agents independently selected the same PMID and the same snippet, differing only in grade. This PR's PARTIAL was kept over #8556's SUPPORT, because the source evidences tattooing but not piercing and measures association rather than the sterility mechanism the note names. That is the one place a grading on main was lowered, and it is recorded here rather than left silent. Subsequently, on review suggestion, a second citation (PMID:24923487) was added to that exposure whose RESULTS sentence names body piercing among significant risk factors, so both nouns in the exposure name are now evidenced; it is PARTIAL because the source gives no per-factor odds ratio. The sibling item's explanation was updated in the same edit, since it had asserted piercing was unevidenced. Also backfilled reference_title on the retained-from-#8556 items, and repaired merge artefacts: two evidence items attached to the wrong exposures, and duplicate `- name:` entries for Unsafe Medical Practices and Occupational Exposure.

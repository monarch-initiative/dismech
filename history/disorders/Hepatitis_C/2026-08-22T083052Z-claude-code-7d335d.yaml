  summary: Add HCV extrahepatic manifestation phenotypes (#6433)
  details: |
    Added five extrahepatic manifestation phenotype entries flagged by issue #6433 Section A ('extrahepatic spectrum ... largely unmodeled despite being classic'): Mixed Cryoglobulinemia (HP:0100778), Leukocytoclastic Vasculitis (HP:0034786) and Membranoproliferative Glomerulonephritis (HP:0000793, both citing the same immune-complex-deposition sentence from PMID:22919404 covering skin and kidney respectively), Porphyria Cutanea Tarda (no HPO term exists -- confirmed via OAK search of sqlite:obo:hp -- bound to the closest broader term, HP:0000992 Cutaneous photosensitivity, with a specific preferred_term, mirroring the SSPE-in-Measles precedent from PR #9127), and Sicca Syndrome (bound to HP:0001097 Keratoconjunctivitis sicca). Evidence: PMID:16510035 (already cited on this entry for Fatigue) and newly fetched PMID:22919404, a histomorphology review that names all five manifestations in two quotable sentences. Left out of scope for this run, per the issue's own text: HPV epidemiology/diagnosis, and the DAA-cure-paradigm curation gap. Validated with just validate (schema+terms+references, 29/29 snippets verified), just count-verified-snippets, just check-not4curation, just check-duplicate-keys, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, and just check-environmental-evidence -- all clean, no new findings.

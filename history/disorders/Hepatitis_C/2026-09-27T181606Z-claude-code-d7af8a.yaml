  summary: Repoint the Aston 2018 model link onto the split replication node
  details: |
    The computational model link and its readout both targeted a pathophysiology node named 'Viral Replication and Hepatocyte Injury'. That node no longer exists: #12098 merged Acute_Hepatitis_C_Virus_Infection into this entry and split it into atomic replication and injury nodes, repointing the links present in that tree at the time — the ALT readout to 'Immune-associated hepatocellular injury' and the direct-acting antiviral target_mechanisms link to 'HCV genome replication and early viremia'. This PR's model link was on a separate branch and so was not in that tree to be repointed, leaving it dangling once the two were merged.

    Repointed to 'HCV genome replication and early viremia', matching the side #12098 chose for the replication claim. The replication node is the one whose description covers the replication complex synthesizing viral RNA and the resulting circulating HCV RNA, which is what the model's fitted state V and its virion-production term describe. The injury node is deliberately not also linked: this model's own limitations record that aggregate death-rate terms replace immune-mediated injury, so it makes no claim about hepatocellular injury. The readout target is repeated to match the link, as check_model_readout_targets_match_link requires.

    No other field changes, and the model's description, fidelity, limitations and evidence are untouched.

    Caught by the merge queue, not by the PR's own checks: 'Run whole-KB schema-conformance sweep' and 'Run Python code/logic tests' are both path-gated and were skipped on this kb/-only PR, so tests/test_data.py never ran against the branch. The merge_group job runs that lane ungated.

  details: |
    Re-review round on PR #11228. The reviewer changed its verdict from approve to request-changes on one IMPORTANT finding, which was correct and was a defect the previous round introduced.

    The finding: the previous commit gave Septal Reduction Therapy a target_mechanisms link to the new Left Ventricular Outflow Tract Obstruction phenotype, but left in place the two sentences that existed to explain the absence of that link. The treatment description still said the procedure 'does not act on any node in this entry's pathograph', and an evidence explanation still referred to 'the limitation that keeps it out of the pathograph', eight lines above a block asserting the opposite. This is exactly the failure mode CLAUDE.md names - prose describing repository state is content, and it rots - and adding the edge is precisely the kind of change that invalidates it. Both sentences kept the biological claim they were making (septal reduction targets anatomy rather than the sarcomeric lesion, which is what the PMID:40993768 snippet actually supports) and dropped only the stale conclusion about this entry's graph. A grep for 'pathograph' now returns nothing in the file, and the other repository-state claims in notes were re-checked and still hold: no datasets block, the D166H letter still has no abstract, and the GeneReviews record is still abstract-only.

    Both accompanying suggestions taken. Mavacamten now carries a second target_mechanisms edge to the obstruction node alongside its molecular super-relaxed-state target, with its own EXPLORER-HCM evidence rather than borrowing the treatment's: the trial's post-exercise gradient reduction is a direct measurement of the drug acting on that node, so this is a genuine edge claim and not a node citation reused to fill a slot. It is marked INDIRECT because the trial enrolled by phenotype with no MYL2 subgroup. The description records why the two edges are separate claims - the gradient can fall whether or not the drug corrects the primary lesion, which is the open question this entry already records for R58Q.

    subtype: AD missense added to the two new phenotypes, and the rule being applied is now written down as a comment above has_subtypes rather than left for a reader to infer: tag a record when its evidence comes from a genotyped individual or pedigree in one arm, leave it untagged when it is a manifestation both arms reach. Obstruction (D166A) and atrial fibrillation (I158L) are allele-anchored, so they are tagged like the neighbouring septal-hypertrophy record; hypertrophic cardiomyopathy itself, diastolic dysfunction, heart failure and myofiber disarray stay unassigned.

    Snippets 90 -> 91 verified. Validation: validate-disorders passes 91/91; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-environmental-evidence all pass; full pytest suite 6108 passed.

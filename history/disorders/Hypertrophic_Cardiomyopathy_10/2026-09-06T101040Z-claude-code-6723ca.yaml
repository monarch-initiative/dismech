  summary: 'Address ai4c-reviewer suggestions: Hypertrophic Cardiomyopathy 10'
  details: |
    The automated reviewer (ai4c-reviewer) approved PR #11228 with no CRITICAL or IMPORTANT findings and three optional suggestions. All three were taken.

    Suggestion 1 (LVOT obstruction had no phenotype record, though both curated trials bind HP:0032092 and both obstruction-directed treatments reason about the gradient): added the phenotype, wired it downstream of the ventricular remodelling node with causal_link_type INDIRECT_KNOWN_INTERMEDIATES (septal geometry plus systolic anterior motion), and gave Septal Reduction Therapy a target_mechanisms link to it so the procedure now reaches the pathograph. The reviewer expected a generic HCM source; a MYL2-allele-specific one was available instead - PMID:30706179 attaches obstructive septal asymmetrical hypertrophy to D166A - so obstruction is curated as allele-dependent rather than as a disease-class import, which the D166H pedigree's explicitly non-obstructive phenotype corroborates.

    Suggestion 2 (atrial fibrillation absent): added, again with a MYL2-specific rather than generic source - the same review reports I158L causing severe hypertrophy with atrial fibrillation. Wired downstream of the clinical-endpoint node via atrial loading. Left atrial enlargement was NOT added: no quotable source exists for it outside the uncitable D166H research letter, and inventing one to complete the picture is the failure mode this entry has been avoiding throughout.

    Suggestion 3 (dominant and recessive forms distinguished only by inheritance blocks and prose, so phenotypes could not carry a subtype discriminator): added has_subtypes with 'AD missense' and 'AR biallelic LOF', and tagged the phenotypes and progression phases that belong to one arm only. The recessive subtype records that the original pedigrees reported dilated rather than hypertrophic cardiomyopathy and that a split should be revisited if a distinct MONDO term is minted for light chain myopathy.

    Not taken: the reviewer's related thought about splitting the arrhythmic axis out of 'Diastolic Dysfunction, Heart Failure and Arrhythmic Risk'. It conforms to a single module node, the reviewer agreed it is not a bundling defect, and renaming it would dangle the bare-name pathograph targets and the conforms_to anchor for no evidential gain. The two new phenotypes attach to it cleanly as it stands.

    One defect self-caught during this round: check-folded-hyphens flagged a line ending in 'obstruction-' inside a folded scalar, which would have folded to 'obstruction- directed'. Reflowed.

    Snippets 85 -> 90 verified. Compliance reads 87.7%, down from 88.2%, for the same reason as the previous round: the new phenotypes brought four more manifestation edges that are deliberately uncited. Validation: validate-disorders passes 90/90; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-environmental-evidence all pass; pytest subtype foreign-key and entry tests pass (8 passed).

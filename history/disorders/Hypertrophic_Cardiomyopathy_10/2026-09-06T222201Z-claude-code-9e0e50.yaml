  summary: Populate treatment_effect and link beta blockade to the pathograph
  details: |
    The reviewer approved the merge commit and left two optional suggestions about treatment-to-pathograph edges, explicitly saying neither was worth a push. Both were taken anyway, because verification showed the first is a defect in rendered output rather than a style preference.

    treatment_effect was unset on all three target_mechanisms edges. Checked rather than assumed: src/dismech/export/cx2_export.py selects the edge arrowhead from that slot, so an unset value falls through to the default triangle, which reads as activation for a drug that inhibits. A census over kb/disorders showed 3580 of 4150 edges (86.3%) populate it, so this entry was in the unpopulated minority. Septal reduction and mavacamten-to-obstruction are INHIBITS. Mavacamten-to-super-relaxed-state is MODULATES, not INHIBITS: the drug shifts that equilibrium in the same direction the R58Q allele already shifts it, which is neither inhibition nor activation of that node, and is the reservation this entry records in discussions. The contrast between the two mavacamten edges is now stated in the edge description so the difference is not read as an oversight.

    Beta Blockade carried no target_mechanisms at all despite being first-line therapy, so the entry's most-used drug reached nothing in the causal graph. Added two edges, each with its own evidence drawn from snippets already verified in the file: to Left Ventricular Diastolic Dysfunction (the PMID:40427081 clause naming enhanced diastolic filling) and to Left Ventricular Outflow Tract Obstruction (the PMID:40993768 clause naming first-line efficacy in obstructive HCM specifically). The diastolic edge description records that the drug acts by lengthening filling time rather than improving intrinsic relaxation, which the sarcomeric lesion still governs.

    Deliberately not linked, with the reason now recorded in notes: the implantable cardioverter-defibrillator and the generic heart-failure pharmacotherapy entry. The ICD acts on sudden cardiac death, which this entry curates, but its cached evidence reports implantation rates in sarcomeric mutation carriers rather than efficacy against arrest, and an INHIBITS edge is an efficacy claim. Asserting it uncited, or reaching for an unverified source, is the failure mode this entry has avoided throughout; it is a follow-up needing its own citation. The generic pharmacotherapy entry names no specific mechanism, which is what makes it generic.

    Snippets 91 -> 93 verified. Validation: validate-disorders passes 93/93; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all pass; pytest treatment and entry tests pass.

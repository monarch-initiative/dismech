  summary: Correct an over-broad rule stated in notes
  details: |
    Closes a defect introduced by the immediately preceding commit rather than resuming optional polish. That commit replaced a rot-prone count in notes with a stated rule, and the rule was wrong: it said a target_mechanisms edge carrying a treatment_effect is an efficacy claim needing evidence for that claim specifically. Read literally that condemns two of this entry's own edges — septal reduction to obstruction, which carries INHIBITS with the supporting evidence at treatment level rather than on the edge, and mavacamten to the super-relaxed state, whose description explicitly declines to make an efficacy claim at all. So the fix for prose that misdescribed the file introduced prose that misdescribed the file.

    The rule now says what the entry actually does: an edge asserting a treatment works against a node (INHIBITS, RESTORES) is an efficacy claim and the file must cite a supporting source somewhere, on the edge or on the treatment where one sentence carries both; MODULATES is exempt because it asserts action on the node without claiming benefit, which is why the mavacamten super-relaxed-state edge uses it. The ICD remains the worked failure, now stated precisely — no source in the file supports the efficacy claim at any level, not merely that edge-level evidence is missing.

    Checked mechanically rather than by reading: all five target_mechanisms edges satisfy the corrected rule.

    Notes prose only; no content, evidence, structure or terms touched. Snippets remain 93/93. Validation: validate-disorders passes; validate-terms, check-entity-refs, check-enum-values and check-folded-hyphens all pass.

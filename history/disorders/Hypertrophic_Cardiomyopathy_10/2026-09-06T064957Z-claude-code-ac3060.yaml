  summary: 'Review round: Hypertrophic Cardiomyopathy 10 (MYL2)'
  details: |
    Adversarial pre-PR self-review of the augmentation in the preceding record, run in a fresh-context subagent against the dismech-pr-review skill. It independently re-verified all evidence snippets and all ontology bindings and found no fabrication and no wrong terms, but did find one critical scientific error and several weaker claims. All findings were acted on.

    CRITICAL, and a genuine misreading on my part: the cardioskeletal claim was inverted relative to the model cited for it. PMID:30365366 uses a CARDIAC-RESTRICTED transgene - the mutant light chain is absent from soleus - and the authors present the soleus deficit as surprising for exactly that reason. The entry had read it as proof that the allele acts on both tissues in parallel, which is the opposite of what the experiment can show, and had added an unsourced gloss claiming fast-twitch EDL is spared because it does not use this light chain (impossible under a cardiac-restricted transgene). Fixed by: rewriting the node description to separate the human expression fact from what the mouse tests; deleting the EDL gloss; downgrading the MYL2 -> skeletal edge from causal_link_type DIRECT to UNKNOWN with directness INDIRECT on its pedigree evidence; adding the paper's own 'even though R58Q expression was restricted to the heart of mice' sentence as a REFUTE item against the local-action reading; and adding the cardiac-restricted limitation plus an INVALIDATING BOUNDARY_OMISSION divergence to the animal-model link.

    Other findings fixed: two evidence items quoting a transgenic-mouse paper's background clause were graded HUMAN_CLINICAL and are now MODEL_ORGANISM/INDIRECT (no primary human A13T clinical report could be located); mid-cavity obstruction was misattributed to PMID:8673105, whose cache contains no such wording, and is now attributed to the A13T literature where it is sourced; directness INDIRECT added to two clinical phenotypes evidenced only by an in-vitro myosin sentence, with a human clinical source added for congestive heart failure; a case-fraction record duplicated into prevalence with a structured RARE band was deleted, since it is already correctly homed in genetic.case_fractions; the notes overstated the research report's relevance screen as 'none off topic' when only 6 of 11 references were affirmatively on-topic; beta blockade and septal reduction therapy were missing despite VALOR-HCM being curated, and were added with therapeutic_agent bindings, along with agents on the generic pharmacotherapy entry; all eight phenotypes were isolated from the pathograph and are now reached by bare-name downstream edges from the terminal mechanism nodes; and a fourth modeled_mechanisms link was added to the Tg-R58Q model, which previously carried model-level evidence arguing for an edge the file did not contain.

    Minor: a narrative review graded HUMAN_CLINICAL regraded to OTHER for consistency with the entry's other reviews; the SRX node's DECREASED ATP-turnover annotation reconciled in prose against the raised fibre ATPase reported elsewhere; the duplicated disarray snippet removed from histopathology so that record carries the skeletal counterpart distinctly; OBLIGATE frequency qualified as frequency-among-affected rather than penetrance; and a comment added recording that variant clinical_significance values are curator classifications, not ClinVar or ClinGen assertions.

    Snippets 79 -> 85 verified. Compliance moved 91.7% -> 88.2%, and the drop is expected rather than a regression: connecting the eight phenotypes into the pathograph added ten CausalEdge objects, and those edges are deliberately uncited. They are manifestation links whose evidence lives on the phenotype records they point at, and the curation guidance explicitly permits an uncited edge while warning against reusing a node's citation to paper over one. The compliance metric counts evidence presence per edge and cannot tell the two apart. This is recorded in the entry notes so the next curator does not 'fix' it by duplicating citations onto the edges. Full gate suite re-run green: validate-disorders, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence.

  summary: 'Augment: Hypertrophic Cardiomyopathy 10 (MYL2)'
  details: |
    Augmented the existing CMH10 entry using a falcon (Edison) deep-research run plus targeted PubMed retrieval. Compliance 84.2% -> 91.7%; entry 430 -> ~1975 lines; 18 -> 79 verified evidence snippets.

    Deep research: just research-disorder falcon Hypertrophic_Cardiomyopathy_10 (709s, 23 citations, 1 artifact). The report carried no validation sections, so both were added retroactively with just validate-research-reference and just validate-research-terms. References: 11/11 extractable citations resolved, 0 unresolved, 0 off topic. Terms: 39/39 CURIEs resolved but several mis-named; three suggested HPO bindings were rejected after independent OAK lookup - HP:0001698 (offered for LVOT obstruction, actually Pericardial effusion; used HP:0032092), HP:0005117 (offered for diastolic dysfunction, actually Elevated diastolic blood pressure) and HP:0030680 (offered for left atrial enlargement, actually Abnormal cardiovascular system morphology). A fourth wrong term was caught outside the report: NCIT:C158384 is SIGLEC15 Gene, not mavacamten.

    Pathophysiology: four nodes added (Reduced RLC Ser15 Phosphorylation, Stabilization of the Myosin Super-Relaxed State, Slow-Twitch Skeletal Muscle Contractile Deficit, Calcium Handling Remodeling and Electrical Instability) and every pre-existing downstream edge given its own evidence (previously 0/3 cited). Existing node names and conforms_to targets were left untouched so foreign keys and module conformance hold.

    New sections: variants (E22K founder, R58Q, A13T, c.403-1G>C recessive splice), environmental (hypertension and obesity as penetrance-determining co-factors, both pathograph-linked via influences_mechanisms), progression, diagnosis, histopathology, animal_models (Tg-R58Q with three mechanism links and readouts), experimental_models (patient MYL2-R58Q iPSC-CM), clinical_trials (EXPLORER-HCM, VALOR-HCM, both flagged not-MYL2-stratified), discussions (4), genetic.case_fractions, and five phenotypes. Mavacamten treatment added.

    Deliberate omissions. No datasets block: GEO returns no MYL2-specific cardiomyopathy dataset (MYL2 hits are studies using it as a cardiomyocyte marker; HCM hits are unstratified or other genes), and adding a generic HCM dataset would be the named-entity substitution the dataset guidance warns about. Recorded as a KNOWLEDGE_GAP discussion instead. The report's De Bortoli D166H figures (AF 62%, restrictive filling 38%, LOD 5.35) are not curated: the paper is a research letter whose PubMed record carries no abstract, so those numbers have no verifiable snippet in the cache. Mavacamten's therapeutic_agent is left unbound following the precedent and reasoning already recorded in Hypertrophic_Cardiomyopathy_8.

    Self-review found that the apical-hypertrophy phenotype's core claim was carried only by its source's title (PMID:30796699 is abstract-only), which is not quotable. Rather than leave it thinly supported it was reframed as a non-septal distribution phenotype and re-evidenced from PMID:22091967, which states mid-ventricular obstruction for the MYL2 A13T allele. That paper also supplied the poison-peptide mechanism and the observation that A13T raises isometric force where R58Q lowers it, both of which were added to the dominant-mechanism discussion, plus an A13T variant record.

    Validation: just validate passes (79/79 snippets verified against cached references); just validate-terms passes; check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-environmental-evidence all pass; just validate-disorders run over the changed file.

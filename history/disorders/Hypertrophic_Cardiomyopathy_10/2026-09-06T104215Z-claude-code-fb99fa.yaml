  details: |
    The re-review approved commit 9787db92d and left one non-blocking observation that was worth acting on: the explanatory comment above has_subtypes, added in that same commit to document the subtype discriminator rule, enumerated which records currently carry which tag. That roster is the same rot-prone repository-state prose the commit had just finished removing from the Septal Reduction Therapy treatment, so the fix reintroduced a milder instance of the defect it was fixing. It was accurate when written and would have gone wrong the first time anyone added or retagged a phenotype.

    Rewritten to state the rule and the test to apply, with no roster: whether removing the arm would remove the record's evidence. A heterozygous-missense cohort or pedigree gives AD missense, the biallelic infantile pedigrees give AR biallelic LOF, and a claim that survives either way stays unassigned. The comment now says explicitly that no enumeration is kept and that the tags in the file are the answer, so a future curator does not helpfully add one back.


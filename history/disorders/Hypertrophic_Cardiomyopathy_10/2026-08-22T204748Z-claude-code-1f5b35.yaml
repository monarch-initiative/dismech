  details: |
    Curated CMH10 (MYL2, ventricular regulatory myosin light chain; MONDO:0012112), a ClinGen-definitive HCM gene, conforming to cardiomyopathy_maladaptive_remodeling. Mechanism: impaired lever-arm function with reduced maximal force and increased myofilament calcium sensitivity. Two inheritance modes curated: dominant missense (R58Q) and severe recessive infantile cardioskeletal form (IVS6-1). Deleted stub; added to FHCM grouping. All snippets verified; full validation passes.

  summary: 'Create: GNAT2-Related Retinopathy'
  details: |
    New autosomal recessive cone photoreceptor disorder entry (MONDO:0800392, GNAT2 cone transducin alpha). Deep research via claude_code (preflight-dr PASS, 53 GNAT2 mentions, OMIM 613856). Pathophysiology is a chain conforming to phototransduction_cascade_dysfunction via its stationary arm (cascade component defect -> light-response activation failure -> congenital non-progressive cone dysfunction), contrasting with PDE6C which takes the degenerative arm. Evidence from the GNAT2 gene-discovery paper (PMID:12077706), the ACHM4 locus mapping (PMID:12205108), a GNAT2 cone-dystrophy family (PMID:14609822), a Tunisian founder-mutation pedigree (PMID:21107338), preclinical AAV cone gene therapy in the Gnat2 mouse (PMID:17515894), the ClinGen Retina GCEP Definitive validity curation, and the GeneReviews Achromatopsia chapter (PMID:20301591). Validated with validate-disorders (0 issues), 23/23 snippets verified, 6/6 phenotypes causally connected, gene-validity clean. Closes #16297.

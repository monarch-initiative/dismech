  summary: Correct GNAT2 molecular function to G protein activity and type gene record
  details: |
    GNAT2 Cone Transducin Deficiency: molecular function changed from GO:0003924 GTPase activity to GO:0003925 G protein activity (DECREASED), the reviewed GNAT2 core function. The node claims loss of the coupling step from opsin to PDE6; intrinsic GTPase activity terminates that signal, so a loss of GTPase activity would prolong signalling rather than abolish it. Process refined from GO:0007603 phototransduction, visible light to GO:0141190 transducin-mediated opsin signaling pathway (DECREASED), still under the module's GO:0007602. A genetic_context was added (germline, LOSS_OF_FUNCTION), supported by the ClinGen statement already on the node that the mechanism is biallelic loss of function. Genetic record: variant_origin GERMLINE added; relationship_type CAUSATIVE and the ClinGen Definitive assertion were already recorded. Validated with just validate, validate-terms, count-verified-snippets (35/35), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments, check-enum-values and list-gene-term-mismatches.

  summary: 'Review round 1: GNAT2-Related Retinopathy'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #16301. Mined GeneReviews (PMID:20301591) for clinical characteristics (nystagmus onset, acuity range), diagnosis criterion, recurrence risk and surveillance; added Hypermetropia (HP:0000540) and central scotoma (HP:0000603). Rebound the cone ERG phenotype from broad HP:0000512 to HP:0030465 (undetectable light-adapted ERG). Converted free-text epidemiology to structured prevalence (ACHM ~1/30000, quote_role BACKGROUND) and added case_fractions 1.7% from Felden 2019 (PMID:31058429). Added stationary-arm evidence (preserved cone mosaic PMID:32203983; Gnat2 KO loss-without-degeneration PMID:29518352), a Gnat2 cpfl3 animal model (PMID:17065522) with modeled_mechanisms, GTPase molecular function (GO:0003924), and incomplete-ACHM/oligocone evidence (PMID:15557429). validate-disorders 0 issues, 35/35 snippets, model-scale clean.

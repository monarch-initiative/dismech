  summary: 'Create: Cataract_3_Multiple_Types'
  details: |
    New entry for CRYBB2 (betaB2-crystallin) autosomal dominant cataract, MONDO:0011104. Kept the numbered OMIM/MONDO series name, consistent with the sibling Cataract_N_Multiple_Types entries, since no established gene-related name exists; the MONDO label and gene-based names are synonyms. One OpenScientist deep research report was run and committed with its citations sidecar and artifacts; preflight-dr returned PASS (CRYBB2 named 53 times, OMIM 601547 matches), 31/31 references resolved, and its suggested CL:0000199 for lens fiber cell was not used because that CURIE is mechanoreceptor cell. The entry was built mainly from primary literature found by PubMed search: founding cerulean and Coppock-like Q155X families, gene conversion reports, missense families, recombinant protein and cell studies, Crybb2 mouse alleles, a zebrafish model, patient iPSC lentoid bodies, and a 2026 eight-family series for microcornea and microphthalmia. The pathograph runs variant to protein destabilization and impaired oligomer assembly to intracellular aggregation (with a lens epithelial stress and apoptosis branch shown only in transfected cells) to loss of lens transparency and the cataract morphologies. Knowledge gaps recorded: why Q155X is dominant when a recessive fusion carrying the same stop codon spares heterozygotes, what modifies morphology for one allele, and how a crystallin variant changes globe size. No GeneReviews chapter exists and no ClinGen CGGV record for CRYBB2 is cached, so gene_disease_validity is omitted. PMID:11424921 (sutural cerulean Q155X family) cached with no quotable text and is named only in notes. Validation: validate, validate-terms, count-verified-snippets 86/86, and the per-file and whole-tree gate checks listed in the PR.

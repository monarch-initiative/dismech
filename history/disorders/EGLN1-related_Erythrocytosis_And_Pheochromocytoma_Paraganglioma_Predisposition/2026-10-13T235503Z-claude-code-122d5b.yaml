  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR 14063. (1) Elevated circulating erythropoietin (HP:0033644) now frequency OCCASIONAL, cited to the PMID:27034858 sentence giving 21 normal / 4 elevated / 2 low EPO among reported carriers; entry description and node text now say EPO is generally inappropriately normal, occasionally elevated, rarely low. (2) Surgical resection evidence replaced with the PMID:36013579 surgery and alpha-blocker sentences. (3) Added a diagnosis section: germline NGS panel (PMID:34309460, moved out of treatments; NCIT:C15709), serum EPO measurement (NCIT:C74855; PMID:27034858), plasma/urinary metanephrines (NCIT:C116198; PMID:36013579); treatments keeps only a tumor-surveillance item (PMID:37317877). (4) Belzutifan: the May 2025 FDA approval for patients aged 12 or older with advanced PPGL is sourced to an exact quote in the review PMID:41301064 and efficacy (26% objective response) to the LITESPARK-015 NEJM report PMID:41124218, which names NCT04924075; the registry record itself (cached) states only the study scope, not the approval. Added NCT04924075 to clinical_trials (PHASE_II, RECRUITING per the ClinicalTrials.gov API on 2026-10-13). Regraded the PMID:39426935 belzutifan quote to HUMAN_CLINICAL with REVIEW_SYNTHESIS. Suggestions: split the bundled EPO/erythroid node into Inappropriate Erythropoietin Drive and Erythroid Progenitor Expansion (GO:0071456 on the former; no GO term for erythropoietin production exists, searched OLS for 'erythropoietin'); hematocrit and polycythemia now cite the PMID:37317877 sentence that names the high hematocrit; dropped the unsupported VERY_FREQUENT. Declined hypertension (not in any cached source text). Deleted stubs/Erythrocytosis_Familial_3.yaml (MONDO:0012353, the narrowMatch term) since the reviewer agreed with the lump.

  summary: 'Create: EGLN1-related Erythrocytosis and Pheochromocytoma/Paraganglioma
    Predisposition'
  details: |
    Created the germline EGLN1/PHD2 oxygen-sensing predisposition entry (MONDO:1060184). Mechanism: heterozygous germline EGLN1 loss-of-function -> reduced HIF prolyl hydroxylase activity -> pseudohypoxic HIF-2-alpha stabilization -> EPO-driven secondary erythrocytosis (haploinsufficiency, no second hit) and, via a somatic second hit (LOH demonstrated in tumor, PMID:19092153), cluster-1 pseudohypoxic pheochromocytoma/paraganglioma. entry_type DISEASE. Lump/split surfaced: curated at MONDO:1060184 following ClinGen's (CGGV Definitive, SOP11) explicit lumping of ECYT3 (OMIM:609820) and PPGL (OMIM:171300); ECYT3 (MONDO:0012353) recorded as skos:narrowMatch. Germline vs somatic kept distinct; no mosaic arm sourced so HP:0001442 not bound. Two pathophysiology nodes conform to germline_two_hit_tumor_predisposition (first-hit / second-hit). Two mouse models wired (Phd2 P294R knock-in erythrocytosis RECAPITULATES; adrenal-medulla Phd2-cKO pseudohypoxic PPGL PARTIALLY_RECAPITULATES). KNOWLEDGE_GAP discussion on PPGL penetrance. One falcon/Edison deep-research report was run and used only as a lead (14/14 refs resolved, no confabulation); all claims verified against primary sources and the CGGV record. Validated with just validate, validate-terms, count-verified-snippets (29/29), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-genereviews (NO_CHAPTER), list-gene-term-mismatches (0), check-block-scalar-comments, gene-activity-grounding, and validate-disorders. Gaps: no per-age onset distribution for EGLN1 specifically; no GeneReviews chapter covers EGLN1-related erythrocytosis (PFCE chapter is EPOR primary erythrocytosis; Hereditary PGL-Pheo chapter is SDHx).

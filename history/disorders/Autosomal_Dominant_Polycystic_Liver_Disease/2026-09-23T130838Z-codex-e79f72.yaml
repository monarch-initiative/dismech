  summary: Review ADPLD gene validity, cyst mechanisms and symptom-directed care against full texts
  details: |
    Reviewed the full disorder entry, its prior EDIT history and the complete manual source-curation fallback report and citation notes. No REVIEW existed. This is an inherited disorder, within the narrowed scope; infection is a cyst complication and estrogen is a modifier, neither makes ADPLD an infectious or environmental disease. No genuine provider exploration or GeneReviews chapter was found; the fallback is not represented as a provider-completed report.

    Used generated reference caches throughout. Refreshed abstract-only sources with the fetcher, recovering full text for PMID:24886261, PMID:29038287, PMID:36246085 and PMID:38097330. Read relevant clinical/genetic sections and tables, with full scientific main text for the 2014 clinical review and the 2022 prognosis study. The latter is an 80-patient retrospective tertiary cohort (68 families), heavily enriched for severe disease; 60 had diagnostic variants, while some subgroup analyses additionally included VUS. Most patients lacked longitudinal imaging. Age-adjusted volume predictions therefore do not establish measured individual growth or general-population risk. Corrected review evidence grades rather than treating their summaries as primary human or mouse experiments.

    Read full scientific main text and methods of PMID:28375157, its corrigendum PMID:28862642, PMID:29243290, PMID:21685914 and PMID:23209713. The JCI gene-discovery study used 102 PRKCSH/SEC63-unexplained probands out of 159 total cases, burden analyses with different thresholds, and knockout/rescue assays in immortalized mouse renal epithelial cells carrying tagged Pkd1. ALG8, GANAB and SEC61B affect PC1 quantity, glycosylation and trafficking differently; SEC61B had only two clinical probands. PKHD1 carriers had an enriched liver-cyst phenotype, but Pkhd1-null cells retained PC1 processing/localization. Do not force that gene through the ER maturation mechanism. The corrigendum corrects Pkd1 primer sequences, not the main conclusions. Added missing GANAB, SEC61B and monoallelic PKHD1 genetic context; preserved distinction from biallelic congenital glycosylation disease and ARPKD.

    The GANAB family carries NM_198335.3:c.2791+4_2791+12delAGTGACCAA outside canonical splice dinucleotides. Five affected siblings share the variant; minigene assays in HEK cells and healthy-donor cholangiocytes show exon 24 skipping and predicted frameshift. This is not patient RNA or evidence for a separate enhancer target. That paper challenges attribution of the earlier LRP5 pedigree because linked GANAB variation could have been missed; it does not demonstrate GANAB variation in the original LRP5 family. Read the original LRP5 abstract (PMID:24706814); full-text retrieval was unsuccessful from PMC and publisher PDF routes. Its Wnt activity was reduced, unlike high-bone-mass LRP5 gain of function. Changed LRP5 to DISPUTED, retained the historical catalog subtype and explicit uncertainty, and added a knowledge gap. OLS searches found specific ALG8, LRP5 and SEC61B liver subtype terms; ontology membership does not settle gene causality.

    Human PRKCSH evidence (PMID:21856269 abstract, full text unavailable through the standard fetcher) is 54/71 cyst epithelia with LOH in eight surgical patients, with additional mutations in 2/12 non-LOH cysts tested. SEC63 full text found LOH in 1/14 cysts from the only patient with a convincing truncating allele. The other two patients shared an in-frame deletion not enriched over controls; formalin fixation limited additional sequencing in the truncating-allele case. Neither result is universal carrier penetrance or direct observation of initiation. Conditional mouse liver cysts and Pkd1 rescue in PMID:21685914 strengthen dosage causality; male liver experiments and kidney-specific timing limit transfer. PC1 trafficking defects were shown separately in cell assays. Proteasome inhibitor benefit was chiefly a mouse renal-cyst experiment, not human ADPLD treatment efficacy.

    Split mechanisms into somatic inactivation, ER biogenesis, PC1 maturation, effective PC1 dosage, PKHD1-associated susceptibility, cAMP signaling, proliferation, fluid secretion, cyst expansion, hepatic mass effect, vascular compression, biliary compression and reduced intake. Added portal hypertension, ascites, malnutrition and skeletal muscle atrophy with guideline evidence. Kept catalog-associated renal, respiratory, vascular, valve, pancreatic and hemorrhage findings without unsupported causal links. Laboratory enzyme readouts are not asserted to measure growth severity. SOURCE_UNSPECIFIED records that the pancreatic catalog term is uncharacterized. Corrected percentage units while preserving the reported prevalence band and qualifying ascertainment. Do not transfer ADPKD vascular screening or renal-failure prognosis to isolated ADPLD.

    Recovered and read the PLD-specific diagnosis, screening, follow-up, symptoms, nutrition, hormone, treatment, transplant and reproductive counseling sections of the full 2022 EASL guideline, fetched as a PDF from a gastroenterology society mirror. The generated cache title is the URL and reference_title matches it. The guideline's general >10 hepatic-cyst criterion is distinguished from family-based lower thresholds and prognostic volumetry. Negative genetic testing does not exclude disease; VUS do not confirm it. Added PLD-Q/POLCA assessment and differential diagnoses. The guideline contains differing symptomatic proportions and a likely resolved/unresolved typographical error; those statements are not propagated as precise population estimates.

    Read all scientific main text and tables of the 2026 ERN Rare-Liver SSA position statement (PMID:41328663). Its consensus recommendations favor symptom-directed treatment of diffuse disease, PROMs plus consistent volumetry, reassessment at 6–12 months and ongoing benefit/risk review. Proposed numerical treatment thresholds are not validated predictors. Long-term benefit can persist on treatment; withdrawal can produce rebound. Glucose, gastrointestinal, gallstone, injection and infection risks matter, as do pregnancy and advanced kidney disease. No hard liver-endpoint or renal-function benefit is inferred. Added nutritional rehabilitation, estrogen and reproductive counseling, supportive pain/complication care, and procedure selection by cyst distribution. Transplantation now inhibits mass effect rather than restoring the pathological process.

    Read the full main text and methods/results of the 186-patient resection/fenestration series (PMID:27016902): 170 ADPKD and only 16 ADPLD, one expert center, 21% major complications, 2.7% 90-day mortality and durable median 61% volume reduction with incomplete follow-up imaging. Avoided internally inconsistent subgroup imaging counts and a likely follow-up denominator typo. Background mechanistic/clinical statements are graded as background. Selection, morbidity and absence of randomized transplant comparison are explicit.

    Fetched primary SSA trials PMID:19646443 and PMID:20431041. The lanreotide abstract reports 54 patients, six months and mixed-etiology post-hoc subgroup analysis. Recovered the octreotide full text via a separately fetched PMC URL and read all scientific main text, tables and methods. Forty-two were randomized 28/14; only eight had ADPLD. Total liver volume fell 4.95% versus a 0.92% increase; broad HRQoL benefit was not uniform and improved subdomains were within-group comparisons. Dose reductions, persistent steatorrhea, injection effects, bradycardia and glucose changes qualify the abstract tolerability statement. The full text contains inconsistent ADPLD arm counts in methods versus results, so only the consistent total of eight is used. Registry NCT00426153 is completed, phase 2/3; the schema has no combined phase value, so the phase is recorded in prose.

    Verified NCT05281328 (POSITANO) against the live API, including posted results and extension status. Contrary to the earlier position statement's awaiting-results wording, results were posted June 2026, while the extension remains ACTIVE_NOT_RECRUITING. Seventy-one randomized, 67 with baseline MRI; the primary registry analysis compares combined CAM2029 arms with placebo, with -0.7% versus +3.9% change and -4.3% relative difference (95% CI -8.4 to -0.1; P=0.0443). These are registry results in mixed PLD, not an ADPLD-specific published effect or evidence of licensing. Cached both the summary and live result record via the fetcher.

    Completeness assessment: mechanisms/genetics adequate after gene additions, evidence separation and causal uncertainty; phenotypes adequate with severe nutritional/vascular complications and catalog caveats; diagnosis and differentials adequate after criteria, assay limits and symptom measures; treatments and trials adequate after guideline and primary-trial review. Remaining LRP5 validity, precise penetrance, progression-model validation and experimental therapies are explicit nonblocking uncertainties. Final validation and independent review are recorded in the PR. No dataset accessions were newly curated and the frozen shared accession file was not accessed.

    Independent review follow-up: named the EASL guideline/DOI and POSITANO record in publication findings while preserving fetcher titles; renamed the PKHD1 node to biliary cyst formation, retaining causality with incomplete penetrance and unresolved mechanism; added peptide modality and OLS-verified octreotide/lanreotide agents. Added three secondary cyst complications with specific unbound phenotype descriptors after documented OLS searches, and qualified predisposing causal edges rather than asserting growth alone causes infection. Replaced broken PDF words with intact equivalent recommendation passages from the guideline summary; shortened the PKHD1 quote at its biological assertion. Removed deprecated prevalence percentage and explained why abdominal-pain clinical prominence is compatible with the catalog frequency. Updated the node-class example to the renamed ER-biogenesis node after CI identified the stale reference.

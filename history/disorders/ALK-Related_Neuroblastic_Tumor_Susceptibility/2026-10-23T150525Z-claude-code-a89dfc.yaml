  summary: 'Create: ALK-Related Neuroblastic Tumor Susceptibility'
  details: |
    New entry for MONDO:0013083, the ALK germline neuroblastoma predisposition,
    curated from a committed Claude Code deep-research report that passed
    `just preflight-dr` against that MONDO ID (canonical gene ALK; ALK named 232
    times; report reference validation 60/61 resolved, 0 unresolved; term
    validation 104/105 resolved, 0 unresolved).

    Scope. Curated as a Disease rather than argued out as an abstract
    susceptibility term: the entity carries a complete causal chain from a
    named germline lesion through a defined developmental cell population to a
    tumor, including the branch point that explains its own incomplete
    penetrance. Kept separate from Neuroblastoma and Ganglioneuroblastoma,
    both of which already record in prose that MONDO files the numbered
    susceptibility classes under hereditary neoplastic syndrome rather than
    under neuroblastoma. No other entry holds MONDO:0013083 as a disease_term.

    What was curated. Seven pathophysiology nodes: the germline kinase-domain
    variant, constitutive ligand-independent kinase activation, sustained
    RAS-MAPK and PI3K-AKT-mTOR signalling, sympathoadrenal neuroblast
    hyperplasia with delayed differentiation (the permissive state), somatic
    MYCN amplification as the cooperating lesion, the block of developmentally
    timed neuroblast apoptosis where the two converge, and a separate branch
    for disrupted brainstem development. Seven phenotypes, five of them
    causally connected; the two urinary catecholamine metabolites are wired as
    `reports_on` readouts of the neuroblastoma node rather than as causal
    consequences, because they report a secreting tumor rather than being
    produced by the germline state. Genetic records for ALK (CAUSATIVE,
    germline, with the ClinGen Definitive assertion for this exact MONDO
    disease copied rather than assigned) and MYCN (COOPERATING, somatic).
    Disease-level autosomal dominant inheritance. Two diagnosis rows, the
    molecular definition and the surveillance protocol. Four treatments.
    Three animal models and three clinical trials. Two discussions.

    Terms. Every CURIE was read from `cache/<prefix>/terms.csv` or, for the
    three that were uncached (HP:0006747, GO:0048485, UBERON:0001806), from
    OLS in the same step it was written. One binding the report proposed was
    rejected on inspection: it offered HP:0012747 `Abnormal brainstem MRI
    signal intensity` for a source that describes an abnormal brainstem
    *shape* on MRI, which is a sibling concept rather than the same one, so
    the phenotype is bound to HP:0002363 `Abnormal brainstem morphology`
    instead. Two reference titles that had been written from the report rather
    than copied from the cache frontmatter were corrected against the cache
    before commit.

    Leads left out rather than curated down, each because the report marked it
    unverified: the G1128A variant-specific penetrance figure (reached the
    report only through a search-engine rendering of GeneReviews body text);
    the F1174V and F1245V residue assignments in the congenital encephalopathy
    cases (the retrieved abstract does not name them); the RET upregulation
    arm and the Alk R1279Q and F1178L knock-in mouse models (quotes from a
    secondary summary, not retrieved primary text); and a 2026 preprint on
    Schwann cell precursor expansion (content unread). PMID:40294355, the
    single-kindred adult-onset report, has `content_type: unavailable` in the
    reference cache, so it is listed under `references:` and discussed in the
    surveillance knowledge gap but is never quoted as evidence.

    Stubs. `stubs/Neuroblastoma_Susceptibility_To_3.yaml` is deleted by this
    PR. The two siblings get recorded decisions: NBLST2 (MONDO:0700041,
    PHOX2B) is set to DISEASE with a note that ClinGen curates PHOX2B against
    Haddad syndrome and CCHS1 rather than against the serial-numbered term, so
    the eventual entry may belong on one of those; NBLST1 (MONDO:0009741,
    KIF1B) is deliberately left UNDECIDED with a note recording what was
    checked (ClinGen has no KIF1B-neuroblastoma curation at all) and why the
    call was deferred rather than guessed.

    Validation. `just validate-disorders` passes: schema clean, term
    validation clean, 75 snippets checked and 72 titles checked with 0 issues.
    Also clean: check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-block-scalar-comments,
    check-snippet-grading, check-snippet-length, check-title-snippets,
    check-reference-titles, check-retired-support-prose, check-folded-hyphens,
    check-folded-yaml, check-coarse-phenotypes, check-shared-disease-terms,
    check-environmental-evidence, check-case-collisions, check-delivery-system,
    check-stubs, validate-stubs, check-genereviews (chapter tagged, EXACT) and
    check-gene-activity-grounding against origin/main. `just
    model-scale-audit` reports 4 links, all MODEL_ABOVE_TARGET.

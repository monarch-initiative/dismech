  summary: Review round 1 on PR 15346
  details: |
    The blocking finding was a genuine claim-evidence mismatch I introduced. The edge from 'Sustained RAS-MAPK and PI3K-AKT-mTOR Signaling' to 'Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation', and the node's own evidence, both quoted a PMID:22439933 sentence that names MYCN as the cause of the hyperplasia. The entry also contradicted itself: the MYCN genetic notes said MYCN supplies the hyperplasia, while the graph had no MYCN-to-hyperplasia edge.

    The fix did not need the edge dropped, because the primary source the research report had flagged as secondhand turns out to be cached. PMID:24811913 is Cazes 2014, its abstract is in references_cache, and it reports 'A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5 to birth.' That is an activating Alk allele at the endogenous locus with no MYCN transgene, which is exactly what the ALK-to-hyperplasia edge asserts. So: the edge is re-sourced on that quote, the MYCN node gains its own DIRECT edge into the hyperplasia node carrying the PMID:22439933 sentence, and the node's evidence now leads with the ALK-only observation and keeps the MYCN one with an explanation saying which cause each supports.

    The same discovery made the Alk knock-in model curatable, and review_notes had said it was held back only because its text was unread, so leaving that note would have been a false justification. The model is added with two links: RECAPITULATES the hyperplasia node at HIGH fidelity (one activating allele at physiological dosage, no cooperating transgene) and RECAPITULATES the somatic MYCN node at MODERATE (the cooperation is real but MYCN arrives as a transgene rather than as an acquired amplification). Its limitations record the mouse-to-human residue offset, F1178L/R1279Q against F1174L/R1275Q, which is a trap for automated cross-species annotation. The RET upregulation arm is stated in the same abstract and is still left out, with the reason rewritten: it is a parallel effector arm rather than part of the germline-to-tumor chain this entry models.

    The 'involutes' claim in the hyperplasia node description is removed. The cited GeneReviews sentence gives penetrance and an age gradient, not the fate of a hyperplastic pool in a human carrier, and no study follows sympathoadrenal tissue in carriers. The description now states the penetrance and the gradient and says that what becomes of the pool is unreported.

    Three suggestions taken. The ALK kinase-domain knockout mouse loses its FAILS_TO_RECAPITULATE link: it is an inverse model cited for the safety fact that losing ALK kinase activity is survivable, and that label would have read as a disease model failing, which misstates what it was built for. Its description now says why it declares no modeled_mechanisms. NCT00939770 gains a notes line explaining why PHASE_I is recorded against a phase 1/2 registration. The diagnosis description no longer asserts what a commercial panel contains; it now says which three genes this entry's own sources establish.

    Both stub notes are rewritten without the session framing the review flagged - no 'while curating the sibling term', no 'not gathered in that session' - keeping the ClinGen findings and the open MONDO-label question, which are the facts a curator needs.

    Re-run after the edits: just validate-disorders (80 snippets, 77 titles, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-shared-disease-terms, check-case-collisions, check-gene-activity-grounding against origin/main, validate-stubs and check-stubs, all clean. just model-scale-audit now reports 5 links, all MODEL_ABOVE_TARGET.


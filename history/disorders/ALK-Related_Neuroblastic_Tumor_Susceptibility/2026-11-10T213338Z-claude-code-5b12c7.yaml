  details: |
    PHOX2B-Related_Neuroblastic_Tumor_Susceptibility names this entry as a differential diagnosis; this entry had no differential diagnoses. A new differential_diagnoses section now carries one row that points back, bound to MONDO:0700041.

    The row rests on one review, PMID:29589100, already cached and already cited by the PHOX2B and Neuroblastoma entries. Three quoted items: PHOX2B was found as a predisposition gene through familial neuroblastoma in children who also had neurocristopathies such as Hirschsprung disease and congenital central hypoventilation syndrome; PHOX2B mutations account for about 10% of heritable disease; and germline testing of both ALK and PHOX2B is recommended for children with a family history of neuroblastoma or with multiple primary tumours. The row lists two distinguishing features, the gene that carries the variant and the neural crest comorbidity. The sentences keep the grading they have in the other entries (REVIEW_SYNTHESIS, HUMAN_CLINICAL).

    Nothing else in the entry is changed: the treatment and clinical-trial rows are untouched, and the new row carries no drug or trial content. The row does not claim that carriers of ALK variants never have these neural crest diseases, which the review does not say.


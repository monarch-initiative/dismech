  summary: Add prostate-volume evidence and mechanism link for 5-ARIs
  details: |
    Follow-up to the review of PR 15186. On the 5-Alpha Reductase Inhibitors treatment: added PMID:12350480 (Roehrborn et al. 2002, pooled 24-month placebo-controlled dutasteride trials in 4325 men with BPH) quoting the 25.7% and 20.4% reductions in total prostate and transition zone volume, as evidence for the claim that 5-ARIs shrink the prostate; and added a target_mechanisms link (INHIBITS) to the Androgen-Dependent Growth pathophysiology node, citing the same paper's conclusion linking DHT suppression to reduced prostate volume. Validated with just validate, count-verified-snippets (24/24), validate-terms, check-entity-refs and check-causal-targets.

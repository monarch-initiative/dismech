  summary: Review and enrich Osteogenesis_Imperfecta_Type_X
  details: >-
    Reviewed and enriched Osteogenesis_Imperfecta_Type_X (MONDO:0013459): added synonyms and scope note distinguishing recessive SERPINH1-related OI type X from the COL1A1/COL1A2 GeneReviews chapter (PMID:20301472); populated classifications (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE, collagenopathy, 2023 ISDS osteogenesis_imperfecta_and_bone_fragility PMID:36779427) and structured ULTRA_RARE CASES_IN_LITERATURE prevalence (PMID:29520608); added germline SERPINH1 lesion node grounded with GO molecular functions (GO:0005518, GO:0044183), preserved protected pathograph node name, and wired bone matrix fragility to present phenotypes with cached abstract evidence; structured SERPINH1 HGVS variants, added DXA/skeletal radiography diagnosis and bisphosphonate treatment terms/targets, curated Dachshund (PMID:19629171) and Serpinh1 knockout mouse (PMID:30541925) models, and populated top-level references.

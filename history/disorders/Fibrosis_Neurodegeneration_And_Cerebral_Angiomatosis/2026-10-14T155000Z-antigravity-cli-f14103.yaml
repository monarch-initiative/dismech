  summary: Curate fibrosis, neurodegeneration, and cerebral angiomatosis (MONDO:0032651) and address PR #14115 review
  details: |
    Curated comprehensive dismech disorder entry for fibrosis, neurodegeneration,
    and cerebral angiomatosis (FINCA syndrome; MONDO:0032651) for issue #14103
    and addressed all PR #14115 review items:
    - Grounded initial NHLRC2 pathophysiology node with molecular_functions
      (GO:0005515 protein binding DECREASED).
    - Split composite pathophysiology nodes into atomic mechanisms (Enhanced
      Fibroblast-to-Myofibroblast Differentiation, Pulmonary Interstitial
      Fibrosis, Hepatic Steatosis and Fibrosis, Neuronal Vesicular Trafficking
      Dysfunction, Neuronal hnRNP C2 Accumulation and RNA Metabolism Perturbation,
      Cerebral Angiomatosis, White Matter Myelin Loss and Gliosis, and Vacuolar
      Neurodegeneration and Neuronal Depletion) and connected 100% of phenotypes
      (23/23) to upstream pathophysiology nodes.
    - Scoped ROS/caspase-8 apoptosis to GO:0006915 (apoptotic process) and
      registered ros_caspase8_apoptosis_hypothesis under mechanistic_hypotheses
      (EMERGING).
    - Added animal_models for Nhlrc2^FINCA/- compound heterozygous mice and
      Nhlrc2-/- knockout mice with modeled_mechanisms links.
    - Added histopathology finding (Granuloma-Like Growth Pattern, NCIT:C36059)
      and five additional HPO-grounded phenotypes (Spasticity, Chronic hemolytic
      anemia, Hepatic steatosis, Hepatic fibrosis, Malabsorption).
    - Updated prevalence to measure_type: CASES_IN_LITERATURE and
      prevalence_class: ULTRA_RARE, added quote_role: BACKGROUND to restatement
      quotes, enriched Systemic Corticosteroid Therapy (CHEBI:50858) and added
      Antibiotic Prophylaxis (NCIT:C51993).

  summary: Initial curation of fibrosis, neurodegeneration, and cerebral angiomatosis (MONDO:0032651)
  details: |
    Created comprehensive dismech disorder entry for fibrosis, neurodegeneration,
    and cerebral angiomatosis (FINCA syndrome; MONDO:0032651) from stub for issue #14103.
    Curated biallelic NHLRC2 (hgnc:24731) genetics, structural destabilization of the
    N-terminal thioredoxin-like domain (p.Asp148Tyr) and dosage-dependent pulmonary
    phenotype correlation, downstream cytoskeletal/RhoA/p190RhoGAP and vesicular
    trafficking dysregulation, enhanced fibroblast-to-myofibroblast differentiation,
    neuronal hnRNP C2 accumulation, ROS/caspase-8 apoptotic susceptibility, macrophage
    phagocytosis defect, bone marrow dyserythropoiesis with multinucleated erythroblasts,
    18 HPO-grounded phenotypes across nervous, respiratory, hematologic, immune, growth,
    and hepatic systems, biochemical markers (NHLRC2 protein level, serum KL-6,
    immunoglobulins), diagnostic workup (WES, chest CT, brain MRI, bone marrow
    aspiration), differential diagnoses (CDA type II, NKX2-1 surfactant dysfunction),
    and treatments (systemic corticosteroids, PRBC transfusion, IVIG).

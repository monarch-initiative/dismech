  summary: Review APMR1 clinical and mechanistic evidence
  details: |
    Comprehensive review of all baseline references and available full texts, matching deep research, and GeneReviews baseline. Recovered the full original linkage report and AHSG-null infant report; used full APMR review and general ID guidance. Separated linkage-family clinical findings from AHSG association; removed unsupported prevalence and obligatory frequency bands; distinguished protein migration from predicted function; retained an explicitly optional hair-cycle hypothesis without an unsupported neurocortical causal chain. Corrected false negative interpretations of untested hair/cognition in null models and the infant follow-up. Added scoped experimental models, evidence-backed general supportive care, differential evidence and cautious molecular interpretation. Authoritative schema/live terms and all 72 evidence snippets pass. All 25 repository quality gates pass, including the corrected minimum-length ClinVar quotation; node-class validation resolves 101 classes and 2192 examples. Independent bounded audits checked the graph/null-model interpretation and clinical/genetic/care scope. The primary 2017 AHSG paper remains abstract-only after attempted full-text recovery; the available 2021 review supplies the table IQ summary, with that secondary scope stated. No dedicated GeneReviews or StatPearls chapter exists. All reference caches were generated with just fetch-reference; failed CAPTCHA content was excluded.

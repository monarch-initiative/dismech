  summary: 'Create: Alopecia-Intellectual Disability Syndrome 1 (APMR1, AHSG)'
  details: |
    Curated APMR1 (MONDO:0021035, AHSG / fetuin-A) de novo, using Edison (falcon) deep research on Alopecia-Intellectual_Disability_Syndrome_1 (613 s, 19 citations).

    Scope decision. Issue #8364 targeted the APMR root MONDO:0008756 as CURATE_ROOT_WITH_SUBTYPES. That was not followed literally: the four numbered APMR forms have different causal genes on different chromosomes, so has_subtypes would assert a single-gene severity spectrum that does not exist. The root is modelled as kb/groupings/Alopecia-Intellectual_Disability_Syndromes.yaml over APMR1 and APMR4, which is what the existing APMR4 entry's own modelling note asked for once a second member existed. APMR1 is that member. The issue body's gene hints (APMR1 = LSS/HR locus, APMR3 = LSS) are wrong and were not used; the primary-source trace is recorded in the apmr1_locus_series_confusion discussion.

    NEC preflight. just preflight-dr returned SKIP because MONDO records no RO:0004003 causal gene for MONDO:0021035, so the gene-identity check could not discriminate. Fell back to the manual OMIM/synonym check: the report's gene frequencies are AHSG=28 vs LSS=3, and OMIM 203650 matches the intended entity. No NEC failure. Note that the report's frontmatter records confabulation_rate 0.5, but all three unresolved references are the same extractor bug (a markdown link swallowed into the DOI, e.g. DOI:10.1007/s00439-016-1756-5](https://doi.org/...); all three DOIs resolve normally.

    What Edison added beyond the issue's research comment: the Demetriou 1996 TGF-beta/BMP type-II-receptor-mimic mechanism (PMID:8662721), and, decisively, that a homozygous AHSG nonsense allele with ELISA-confirmed complete fetuin-A deficiency causes Caffey disease rather than APMR1 (PMID:31288248). The latter is curated as the strongest constraint on the mechanism model: a human AHSG null gives a skeletal phenotype, so the APMR1 missense is unlikely to act by simple absence of protein.

    Evidence discipline. The gene-disease assertion rests on one consanguineous family, one predicted-pathogenic missense, and no functional rescue, so the trigger node is mechanism_confidence PROVISIONAL, the variant is LIKELY_PATHOGENIC rather than PATHOGENIC, and every node downstream is HYPOTHETICAL under the EMERGING fetuin_tgfb_antagonism_model hypothesis group. Two open discussions record the gene-validity gap and the human/mouse null mismatch, with two proposed experiments. One evidence item was dropped rather than quoted around a PDF hyphenation defect in the cached full text of PMID:17451405 (chromo-some).

    Validation: just validate, just validate-disorders, count-verified-snippets (42/42 for the disorder, 8/8 for the grouping), check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, validate-grouping, check-groupings (both members SATISFIED), and pytest -k "entity_ref or grouping or subtype or model_readout or failure_to_recapitulate" (14831 passed).

    Scope note. The grouping's CURATION_TODO discussion initially carried attaches_to: [members#], which needed a members prefix added to entity_refs.SECTION_KEYS - that map covers Disease sections only, so entity references in kb/groupings have no resolvable anchor. CI's curation-scope guard correctly rejected src/ and tests/ changes in a kb/ PR, so the source change was reverted and the anchor dropped from the discussion. The SECTION_KEYS gap is reported as a separate infrastructure issue rather than folded into this curation PR or waved through with a scope-override label.

  summary: 'Create: microcytic anemia with liver iron overload'
  details: |
    Created de novo entry for microcytic anemia with liver iron overload (AHMIO1, MONDO:0008787), caused by biallelic SLC11A2/DMT1 (hgnc:10908) loss of function. Curated the paradoxical mechanism: DMT1 loss blocks release of transferrin-cycle iron in erythroid precursors (hypochromic microcytic anemia) while liver iron uptake, being DMT1-independent (NTBI via ZIP14), continues to load hepatic iron. Pathophysiology modeled as a chain (SLC11A2/DMT1 loss -> impaired erythroid transferrin-cycle iron use -> microcytic anemia; parallel duodenal absorption defect; DMT1-independent hepatic overload -> elevated hepatic iron). Phenotypes: microcytic anemia (congenital onset), elevated hepatic iron concentration, high serum iron, elevated transferrin saturation; biochemical low ferritin despite iron stores and raised sTfR. Treatments: recombinant erythropoietin (treatment of choice) and avoidance of iron/transfusion (counterproductive). Evidence from primary case reports (Mims 2005 PMID:15459009, Iolascon 2006 PMID:16160008, Lam-Yuk-Tseung R416C PMID:16584902, Lam-Yuk-Tseung E399D PMID:16023393, Bardou-Jacquet PMID:21871825) and reviews (Iolascon 2009 PMID:19786204, Romero-Cortadellas 2022 PMID:35457224). No GeneReviews chapter exists (negative recorded). Validated: just validate passed, 27/27 snippets verified, terms/dupkeys/entity-refs/causal-targets clean.

  summary: 'Address review: narrow to MONDO-accurate has_subtypes, fix ADHD evidence,
    wire pathograph, expand RTH-beta content'
  details: |
    Addressed CHANGES_REQUESTED review on PR 9690. CRITICAL 1: has_subtypes previously listed RTH-alpha THRA MONDO:0034216, MCT8/SLC16A2 MONDO:0010354, and SECISBP2 MONDO:0800046 as subtypes of MONDO:0009043, but runoak confirmed only MONDO:0008569 (autosomal dominant RTH-beta) is actually a MONDO child of MONDO:0009043 -- the other three sit under unrelated MONDO branches (thyroid hormone resistance syndrome sibling, X-linked syndromic intellectual disability, peripheral hypothyroidism respectively) and MCT8/SECISBP2 already have standalone entries, so keeping them as subtypes here would have double-claimed MONDO coverage. Narrowed has_subtypes to MONDO:0008569 only and moved the other three into a notes: cross-reference paragraph explaining the MONDO mismatch with the originating issue's suggested subtype list. CRITICAL 2: the ADHD phenotype's evidence was the paper's opening disease-definition sentence, which said nothing about attention/behavior; replaced with a real quote from PMID:33868182 (Pappa and Refetoff, Resistance to Thyroid Hormone Beta: A Focused Review) stating ADHD is reported in 48-83% of RTHβ individuals. IMPORTANT fixes: swapped generic Goiter/Tachycardia snippets for exact supporting sentences already in the full-text caches (PMID:33176840, PMID:33868182); removed the RTH-alpha-specific Growth Delay/Constipation/Elevated-CK/Macrocytic-Anemia phenotypes entirely since RTH-alpha is out of this entry's scope (the Macrocytic Anemia HP:0001972 over-specification concern is moot with removal); fixed the free T3 biochemical notes that claimed an HP:0011788 binding not actually present in the file by adding a real reference_ranges/interpretation_bands block with that binding; wired the previously-orphaned pathophysiology chain to its phenotypes via downstream edges from the terminal Tissue-Selective Mixed Hypothyroid/Thyrotoxic Phenotype node (Goiter, Resting Tachycardia, Attention Deficit Hyperactivity Disorder, new Thyroid Nodules phenotype) and removed the disconnected THRA pathophysiology node (out of scope); added prevalence (birth-prevalence 1:19,000-1:40,000, PMID:33868182), diagnosis (THRB genetic testing, serum TSH determination), differential_diagnoses (TSH-secreting pituitary adenoma MONDO:0019611), clinical_trials (NCT06307990 ADAM-THAD and NCT00001159 NIH natural-history study, both independently verified RECRUITING/observational via the ClinicalTrials.gov API; excluded NCT06566066 DEEPTYPE after reading its cache and finding it is MCT8/THRA-specific, out of this entry's scope), a top-level references: tag for the Endotext chapter PMID:25905294 (Impaired Sensitivity to Thyroid Hormone, the baseline actually consulted -- corrected from an earlier claim of no GeneReviews baseline), and two new treatments (beta-adrenergic blockade with atenolol for tachycardia, and supraphysiologic intermittent liothyronine plus avoidance of ablative radioiodine/surgical therapy), all backed by real snippet-verified evidence from PMID:33176840 and PMID:33868182. Fixed the TRIAC free-T4 evidence to add the 'nadir FT4 fell within reference interval' quote so the explanation no longer understates the source's own 'normalized' language. Aligned the free T4/TSH reference-range bounds and honest non-fabricated-citation notes to the existing Allan-Herndon-Dudley_Syndrome convention (10.0-25.0 pmol/L free T4 via LOINC:14920-3, 0.4-4.0 mU/L TSH), fixing the earlier unattributed cut-points and a LOINC unit mismatch. Deliberately deferred for lack of RTH-beta-specific verified evidence within this pass (documented in the entry's notes and in the PR comment): hearing impairment, atrial fibrillation, hepatic steatosis/dyslipidemia phenotypes, and a structured animal_models: entry for the TRβ knockout mouse literature. Re-validated: just validate (36/36 snippets verified), just count-verified-snippets, just validate-terms, just validate-disorders (full batched sweep), just check-duplicate-keys (whole KB), just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-environmental-evidence, just check-entity-refs (confirms the new downstream phenotype edges resolve), and just check-not4curation, all clean.

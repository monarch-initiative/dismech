  summary: 'Create: Generalized Resistance to Thyroid Hormone'
  details: |
    Created a new root-with-subtypes entry for generalized resistance to thyroid hormone MONDO:0009043, tracked by issue #8968. Modeled has_subtypes for RTH-beta THRB MONDO:0008569, RTH-alpha THRA MONDO:0034216, MCT8/SLC16A2 transporter defect cross-referenced to the existing Allan-Herndon-Dudley_Syndrome entry, and SECISBP2 metabolism defect cross-referenced to the existing SECISBP2_Deficiency entry. The RTH-beta pathophysiology chain models the dominant-negative corepressor mechanism precisely per the issue: THRB Dominant-Negative Receptor Formation genetic_context.functional_impact_category=DOMINANT_NEGATIVE, not modifier -> Impaired Corepressor Release at Thyroid Hormone Response Elements -> Dominant-Negative Inhibition of Wild-Type Receptor Transcription -> Pituitary Thyrotroph Resistance to Feedback / Tissue-Selective Peripheral Resistance -> Elevated Thyroid Hormone with Non-Suppressed TSH -> Tissue-Selective Mixed Hypothyroid/Thyrotoxic Phenotype. A parallel THRA node captures RTH-alpha tissue-selective, near-normal-TFT mechanism. Captured the paradoxical elevated free T4/T3 with non-suppressed TSH biochemical signature via biochemical entries with reference_ranges/interpretation_bands HP:0033075 Inappropriately normal TSH, HP:0033077 Increased free T4. Cross-referenced Congenital_Hypothyroidism and the hypothyroidism_thyroid_hormone_deficiency module in a top-level notes block as the contrasting resistance-vs-deficiency entity, deliberately NOT using conforms_to since the mechanism is the inverse of hormone deficiency. All 8 cited PMIDs 15988389, 16228000, 31588528, 32349464, 32559475, 33176840, 41131705, 9647743 were fetched with just fetch-reference and every snippet independently verified as an exact substring of the cached abstract before use, not hand-authored. Ran just research-disorder falcon research/Generalized_Resistance_to_Thyroid_Hormone-deep-research-falcon.md, 20 citations, 4 checked, 4 resolved, 2 on-topic per its own reference-validation pass as the required deep-research query per the initiate-new-disorder-creation skill, but built the entry primarily from independently PubMed-verified primary/review literature rather than the DR synthesis, per the DR-as-leads-not-ground-truth SOP. No GeneReviews chapter exists for generalized RTH; a PubMed search for the disease name plus GeneReviews returned no hits, so no GeneReviews baseline was available. Validated with just validate, just count-verified-snippets 30/30 verified, just validate-terms, and just validate-disorders the full CI-equivalent batched sweep, plus just check-duplicate-keys and just normalize-cache.

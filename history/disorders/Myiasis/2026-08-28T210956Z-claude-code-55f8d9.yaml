  summary: 'Address CHANGES_REQUESTED review on PR #9761'
  details: |
    Reviewer ai4c-reviewer requested changes with four IMPORTANT completeness gaps and five non-blocking suggestions; all nine addressed.

    (1) Bound all nine has_subtypes to MONDO via subtype_term: furuncular MONDO:0018941, creeping MONDO:0018857, wound MONDO:0015622, ophthalmomyiasis MONDO:0000301, and the five cavity forms (nasopharyngeal, oral, aural, intestinal, urogenital) to MONDO:0015623 cavitary myiasis, whose own definition enumerates exactly those sites. Recorded in notes that MONDO:0000301 is agent-defined rather than site-defined, and that MONDO's is_a hierarchy is not parallel to the clinical classification.

    (2) Added the missing Creeping (migratory) cutaneous subtype, which the entry's own definitions block already quoted PMID:20883399 as naming.

    (3) Added an animal_models section with four models and modeled_mechanisms links, giving the myiasis_protease_mechanism_human_evidence HUMAN_MODEL_MISMATCH discussion a structural counterpart: ovine/caprine Oestrus ovis, Bactrian camel Wohlfahrtia magnifica, and ovine Lucilia cuprina (all PARTIALLY_RECAPITULATES with per-link fidelity and limitations), plus a BALB/c mouse Clogmia albipunctata gavage model as FAILS_TO_RECAPITULATE with the required limitations and evidence.

    (4) Modelled Pain (HP:0012531) with three human-clinical snippets; frequency deliberately omitted for lack of quantitative evidence.

    Suggestions: added Aural (Otalgia HP:0030766, Otorrhea left unbound with a note, Secondary otitis media HP:0000371) and Urogenital (Pruritus vulvae HP:0032004, vulvar erythema) phenotypes; added three imaging_findings from the cached PMID:22232372 review (ultrasound echogenic focus with distal shadowing, definitive real-time larval movement, dermoscopic punctum with barb-like spines) while declining CT/MRI because the deep-research report asserts them without a citation; named Wohlfahrtiimonas chitiniclastica at the superinfection node; gave the travel exposure an influences_mechanisms PREDISPOSES link into the deposition node; cited three previously uncited caches and deleted five that had cached with an empty Content section.


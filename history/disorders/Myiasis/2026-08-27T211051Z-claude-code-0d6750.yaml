  summary: 'Create: Myiasis (MONDO:0019147)'
  details: |
    New Disease entry for human myiasis, curated from a Falcon deep-research report plus 37 independently fetched references.

    Concept decision: single Disease entry with anatomical has_subtypes (Furuncular, Wound, Ophthalmic, Nasopharyngeal, Oral, Aural, Intestinal, Urogenital), not a Grouping. MONDO:0019147 carries the disease_grouping and ordo_group_of_disorders subsets, but a dismech Grouping is an explicit union over Disease entries that already exist independently, and no myiasis clinical form is separately curated in kb/disorders. The forms share one mechanism and differ by colonized site and by the degree of parasitism of the implicated fly, which is what has_subtypes encodes. The rationale is recorded in the entry notes so a later conversion to a Grouping remains auditable.

    Mechanism curated as direct larval tissue invasion rather than a classical immune or infectious cascade: larval deposition, mechanical penetration and burrowing, excretory-secretory serine protease release, proteolytic digestion of host tissue, tissue necrosis and cavity formation, secondary bacterial superinfection, host inflammatory and eosinophilic response, larval modulation of the host immune response, systemic sepsis, and larval emergence as the self-limiting endpoint.

    Eight causative dipteran species bound to NCBITaxon: Dermatobia hominis, Cordylobia anthropophaga, Cochliomyia hominivorax, Oestrus ovis, Chrysomya bezziana, Wohlfahrtia magnifica, Lucilia sericata, Sarcophaga haemorrhoidalis.

    A HUMAN_MODEL_MISMATCH discussion records that the entire molecular arm (larval serine proteases, immunoglobulin and complement cleavage, lymphocyte suppression) rests on veterinary and in-vitro evidence from sheep, goats, and camels rather than human tissue, and that the characterized species are not the ones dominating human disease. Two further discussions record the absent global burden estimate and the maggot-debridement duality of Lucilia sericata.

    NEC preflight: just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0019147. The manual CLAUDE.md section 2b checks were run instead: the MONDO definition and its RO:0014001 NCBITaxon:7147 Diptera relationship match the report subject, no OMIM xref applies, and the synonym list does not collide with another MONDO entity. The report's Oestrus ovis livestock prevalence material was treated as veterinary context, not human evidence. The report's own reference validation flagged DOI:10.1590/S1984-29612024020 as unresolved; that identifier is not cited in the entry.

    Validation: just validate passed for schema and terms; just count-verified-snippets reported 139/150 snippets verified against cached references with 11 skipped by DOI prefix; just check-duplicate-keys clean; just validate-disorders run over the changed files before opening the PR.

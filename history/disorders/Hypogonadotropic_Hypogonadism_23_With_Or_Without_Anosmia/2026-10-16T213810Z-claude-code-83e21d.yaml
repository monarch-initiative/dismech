  summary: 'Review round: ground LHB molecular function, replace off-target deep research'
  details: |
    Response to review of PR 14570. The LHB trigger node now binds GO:0005179 hormone activity (DECREASED), so the gene lands on a molecular function; the existing Pasqualini syndrome review sentence on biologically inactive LH is added as its evidence. The notes paragraph about the deep-research report was removed and replaced with a caveat that the synonym fertile eunuch syndrome is also used for partial GnRH deficiency. The first openscientist report produced for this term was about SMCHD1 and Bosma arhinia microphthalmia syndrome and never mentioned LHB. Its local deep-research cache entry was deleted and openscientist was run once more; the second report is about LHB and is committed under its dated filename, and the off-target report and its artifacts are removed from the branch. From the new report's leads, PMID:19890128 (a man with a hypomorphic LHB allele and complete spermatogenesis) was fetched and added: supporting evidence for azoospermia and Leydig cell hypoplasia in men with LHB mutations, a REFUTE item on the impaired spermatogenesis node for that allele, and the authors' attribution to residual LH activity. The report's citation of PMID:14709845 (Trp8Arg plus Ile15Thr) was not used, and PMID:1727547 (Weiss 1992) is still not cited because its cached record has no abstract. Validated with just validate, count-verified-snippets (74/74), validate-terms, validate-disorders, check_gene_activity_grounding, and the whole-KB CI gates.

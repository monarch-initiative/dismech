  summary: 'Create: Hypogonadotropic_Hypogonadism_23_With_Or_Without_Anosmia'
  details: |
    New entry for LHB-related selective luteinizing hormone deficiency (HH23, MONDO:0009223), curated as a single-gene autosomal recessive Disease. The pathograph runs from biallelic LHB loss-of-function variants to loss of bioactive LH secretion, then branches by sex: Leydig cell hypoplasia with testosterone deficiency and impaired spermatogenesis in males, and failed ovulation and luteinization in females. Phenotypes carry sex-specific phenotype_contexts. Treatments: hCG in males, testosterone replacement, and LH/hCG ovulation induction in females; the Lhb knockout mouse is recorded as an animal model. Evidence comes from PubMed abstracts fetched with just fetch-reference (human case reports, a 2023 systematic review, two reviews, mouse knockout papers). One openscientist deep-research report was run; it is about the wrong disease (it attributes HH23 to SMCHD1 and describes Bosma arhinia microphthalmia syndrome, never mentioning LHB), so nothing in the entry was drawn from it. It is committed and flagged in the entry notes, following the precedent of dismech issue 10495. just preflight-dr could not run because it requires the local MONDO build. Validated with just validate, count-verified-snippets (68/68), validate-terms and validate-disorders.

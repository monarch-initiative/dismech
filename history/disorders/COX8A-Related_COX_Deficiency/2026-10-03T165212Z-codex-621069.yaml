  summary: Review COX8A splicing, complex IV stability and clinical evidence
  details: |
    Reviewed the original COX8A entry and EDIT-only history after rebasing onto fresh main e6eea7c0b973b04eee5135e04053e534fd091cf2. The refreshed open-PR file index contained no COX8A disease/history overlap. This Mendelian disorder is eligible under the infectious/environmental disease exclusions. No matching deep-research artifact exists. Offline GeneReviews title matching returned NO_CHAPTER, but the broader Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview does contain a COX8A row and was actively consumed.

    Read the cached Hallmann2016 abstract (PMID26685157), the full 2024 ClinGen case and experimental-evidence report and generated structured assertion, the Rotko2021 abstract and publisher preview (PMID33705280), and the relevant full-text sections of the author's institutional thesis. The thesis sections6.4,7.2,7.3,8 and cellular-model/RNAseq methods separate patient fibroblasts from engineered HEK293T clones and unrelated astrocytoma/carbon-monoxide experiments. Read the full GeneReviews clinical, diagnostic, management, surveillance, avoidance and genetic-counseling sections, plus the COX8A-specific table row. Unrelated gene-specific table entries and therapies were not attributed to COX8A. Generated caches were obtained with sanctioned fetch/rebuild commands; none were hand-created or edited.

    Repeated legitimate Hallmann full-text routes (canonical OUP page and stable PDF, public author page and indexed publisher PDF) returned403/400 or only an abstract. The indexed PDF was not read. Therefore additional clinical manifestations and allele notation are explicitly attributed to the cached ClinGen abstraction, rather than presented as direct primary-full-text quotations. GeneReviews canonical HTML/PDF routes returned CAPTCHA; the /sites/books route returned the actual full chapter and is the cited cache. Rotko publisher full text was unavailable, but the author's institutional thesis was fully usable for the relevant experiments. ClinGen's stated engineered-cell percentages differ from the thesis table and abstract; those unverified percentages were not propagated. No public RNAseq accession was established; no dataset accession was invented or retired shared cache used.

    Replaced the bundled ATP-collapse/oxidative-stress narrative with six atomic steps: intronic SNV, altered splicing, reduced transcript, loss of normal subunit function, loss of stable free complex IV, and reduced enzyme activity. The 49-nucleotide deletion is an RNA consequence, not a genomic deletion. Nonsense-mediated decay is not asserted as directly demonstrated. Supercomplex-associated residual enzyme and negative mtUPR/ISR transcriptional findings constrain interpretation. The HEK293T clones are not complete knockouts: each retains an in-frame mitochondrial-targeting-sequence lesion on one allele. Patient-cell BK-alpha protein findings from the thesis remain in the experimental-model description with uncertain clinical significance; astrocytoma pharmacology does not become a COX8A treatment.

    Completeness assessment: twelve phenotypes, a splice-acceptor variant, Limited ClinGen gene validity with broader MONDO0044970 scope/date, four diagnostic records, two biochemical records, muscle histochemistry, seven care entries and two cellular models. No unsupported phenotype frequencies, penetrance estimates or severity subtypes were added. Clinical phenotype lists are quoted with ellipses across intervening HTML markup. General Leigh-spectrum care, surveillance, medication/perioperative precautions and conditional AR counseling are explicitly scoped; no COX8A-specific efficacy or POLG-specific absolute contraindication is inferred. The focal grouping-member summary was synchronized with the structural-stability mechanism and clinical evidence limits. All new references/evidence carry cache-matched titles. Validation results are recorded in the PR.

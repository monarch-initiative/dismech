  summary: 'Create: Congenital_Factor_XII_Deficiency'
  details: |
    Created the F12 entry (MONDO:0009315, Hageman trait). The pathograph runs from F12 loss of function through impaired secretion of the mutant protein (COS7 expression, PMID:39385199) to plasma deficiency, contact activation failure, and from there to the prolonged aPTT, the loss of polyphosphate-driven thrombus propagation, and reduced kallikrein-kinin output. Preserved tissue-factor-initiated hemostasis is modelled as a node with no inbound causal edge, bound to GO:0007598 extrinsic pathway with preferred_term marked unaffected, because the sources assert independence from the lesion rather than causation by it. Venous thrombosis and recurrent pregnancy loss are deliberately excluded from phenotypes and recorded as two KNOWLEDGE_GAP discussions: pooled and population-based studies find no association, biobank carriers are protected, and for pregnancy loss the largest study found none and showed lupus anticoagulant depresses measured factor XII. Abnormal bleeding carries both SUPPORT and REFUTE evidence with the cohort asymmetry stated: the positive cohort enrolled patients below 60% activity, including eight homozygous for the 46C>T hypomorph, while the negative series studied homozygous patients. Deep research: OpenScientist (40/40 references resolved, 3 off topic, 1 unsupported quote; preflight-dr PASS with F12 mentioned 32 times). An internal fresh-context review before the PR found two blocking claim-evidence mismatches, both fixed: a PMID:39385199 sentence whose antecedent is genetic counselling rather than hemostatic prophylaxis, and the non-causal preservation edge. The withheld-prophylaxis treatment is left unbound after NCIT searches that were run and reported; NCIT:C15722 Patient Observation was tried and rejected by validate-terms as outside TreatmentActionTerm.

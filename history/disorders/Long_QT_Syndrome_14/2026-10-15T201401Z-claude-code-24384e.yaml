  summary: 'Recheck against deep research: Long_QT_Syndrome_14'
  details: |
    Rechecked the entry against research/Long_QT_Syndrome_14-deep-research-claude_code.md (preflight-dr PASS, CALM1 mentioned 26 times). The report was used as a list of leads only; every addition was sourced from a fetched primary paper. Fetched PMID:26969752 (Boczek et al. 2016, exome study of genetically elusive LQTS). Added: (1) CALM1 p.Glu141Gly (E141G) variant, de novo, c.422A>G, with two evidence items; (2) E141G functional evidence (11-fold lower calcium affinity, dominant loss of Cav1.2 inactivation, no RyR2 effect) on the impaired calcium-dependent inactivation node; (3) the Boczek recommendation to test CALM1-3 in LQTS with early cardiac arrest and extreme QT prolongation, on the genetic-testing diagnosis row; (4) a Late-Onset Peaked T Wave phenotype bound to HP:0005135 Abnormal T-wave (HPO has no narrower term; OLS searched for peaked, tall and hyperacute T wave and the children of HP:0005135 listed), from the pooled CALM1-3 registry (PMID:31170290, 19/23), with no upstream edge; (5) pooled registry 10-year cumulative mortality (27%) and 10 sudden cardiac deaths, as evidence on the Sudden Cardiac Death phenotype, labelled pooled; (6) a residue-numbering note on p.Asn53Ile and p.Asn97Ser: the 2012 report numbers without the initiator methionine, so p.Asn97Ser is the registry's p.Asn98Ser (N98S). Deliberate omissions: the report's 15.4% calmodulin yield (results section, 6/39) disagrees with the same paper's abstract (13.2%, 5/38) and pools CALM1 and CALM2, so no yield figure was added; registry structural heart abnormalities, ranolazine, nicorandil and pacemaker counts are pooled across CALM1-3 with no CALM1 breakdown and very small numbers; avoidance of QT-prolonging drugs, fever and electrolyte modifiers, and cascade testing are marked unverified in the report and no calmodulin-specific source was found; no prevalence figure exists; Orphanet and ICD codes were not found by the report; animal models were not researched by the report; the F142L iPSC model is already cited as IN_VITRO evidence; PanelApp ratings are not a ClinGen tier and the ClinGen CALM1 assertions are against broader MONDO terms, as the notes already explain. No contradiction with the entry was found other than the variant-numbering difference, which is now explained. Validated with just validate, validate-terms, count-verified-snippets, the offline check-* gates and validate-disorders.

  summary: 'Strengthen: Long_QT_Syndrome_14'
  details: |
    Strengthened the existing CALM1/LQT14 calmodulinopathy entry against the primary literature now cached. Added CALM1-specific phenotypes 2:1 atrioventricular block (HP:0034305), T-wave alternans (HP:0012266), neurodevelopmental delay (HP:0012758), seizure (HP:0001250) and autism (HP:0000717), with frequencies given only as counts over the three CALM1 carriers (D130G twice, F142L) tabulated in Crotti et al. 2013 (PMID:23388215, founding report). Wired 2:1 block and T-wave alternans from the prolonged-ventricular-action-potential node through ventricular refractoriness, cited INDIRECT from general long-QT studies PMID:1918714 and PMID:1889452 plus the registry's 'functional' description (PMID:31170290); drew neurodevelopmental delay and seizure as sequelae of cardiac arrest and left autism unconnected (arrest-independent registry cases, no mechanism). Strengthened the impaired-CDI mechanism edges with CALM1 F142L patient iPSC-cardiomyocytes (PMID:28158429) and CALM1 D130G/F142L guinea-pig myocytes (PMID:24816216), replacing reliance on INDIRECT review statements. Added variants p.Asp130Gly and p.Phe142Leu, de novo inheritance evidence, per-gene registry event rates (CALM1 88% any event, 65% MAE; PMID:37528649), and treatment-response items for beta-blocker/LCSD failure, mexiletine, verapamil (with target_mechanisms link to the CDI node) and flecainide. No new references fetched; all seven primary sources were already cached. Validated with just validate, validate-terms, validate-disorders (201 snippets over both files, 0 issues), check-causal-targets, check-entity-refs, check-duplicate-keys, and the snippet/enum/coarse gates.

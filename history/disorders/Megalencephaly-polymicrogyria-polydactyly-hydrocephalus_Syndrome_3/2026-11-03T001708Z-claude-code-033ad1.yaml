  summary: 'Create: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus Syndrome
    3 (CCND2)'
  details: |
    New entry for MPPH3 (MONDO:0014408), claimed in issue 16329, with the stub deleted. Deep research was requested from falcon via the fallback option; falcon was not configured, so OpenScientist produced the report (research/Megalencephaly-polymicrogyria-polydactyly-hydrocephalus_Syndrome_3-deep-research-openscientist.md; 12/12 references resolved, 9/9 quotes valid). just preflight-dr returned WARN only because 'D2' (cyclin D2) was counted as a second gene; the report is about CCND2 and MPPH3. The phenotype baseline is the GeneReviews MPPH Syndrome chapter (PMID:27854409), whose frequencies are pooled across AKT3, CCND2 and PIK3R2 and are labelled as MPPH-wide. The causal chain (distal CCND2 variant -> cyclin D2 escapes proteasomal degradation -> expansion of cortical progenitors -> megalencephaly, and a hypothesized link to polymicrogyria) is sourced from Mirzaa et al. 2014 (PMID:24705253), whose cache was upgraded from abstract to full text for the Thr280 mutation-cluster quotes. Hydrocephalus, polydactyly, epilepsy and the other phenotypes are left without incoming edges because no source read states their mechanism. The report's statement that polydactyly is often absent in CCND2 cases was not used: it rests on a single case and contradicts Mirzaa 2014. Not cited: PMID:38008077 (an AKT3 case), PMIDs 10101126 and 12591240 (Ccnd2 knockout mice, the loss-of-function direction), and PMIDs 31957131, 33634562 and 29642246 (no abstract available). ClinGen rates CCND2 Definitive (AD) for this disease. A pre-PR review by a separate agent led to these changes: a diagnosis section (brain MRI with the GeneReviews surveillance schedule, and molecular testing); GeneReviews recurrence-risk and parental-mosaicism evidence on the inheritance block; phenotypes from the PMID:39395260 CCND2 case (infantile spasms, global developmental delay, hypotonia, absent speech); oromotor dysfunction rebound from HP:0007301 to HP:0011968 to match AKT3-Related_Overgrowth_Spectrum; a CCND2-specific hypoglycaemia sentence; quote_role BACKGROUND on two restated findings; the full-text 'pathological stabilization of cyclin D2' sentence on both outgoing edges of the progenitor node; the Pax6 result supporting the radial glial binding; and removal of the unsupported GO:0016538 kinase-regulator binding (and its cache rows). A notes line records why the remaining GeneReviews features (medulloblastoma, vision, cardiac, thyroid and renal anomalies) are not entered as phenotypes. Validated with just validate, validate-terms, count-verified-snippets (47/47), check-genereviews (tagged), model-scale-audit and the offline KB gates.

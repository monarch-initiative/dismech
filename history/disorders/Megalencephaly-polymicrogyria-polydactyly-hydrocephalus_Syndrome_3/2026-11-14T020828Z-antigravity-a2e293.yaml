  summary: 'Review and enhance: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus
    Syndrome 3'
  details: |
    Added NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE classifications, PMID:24705253 top-level reference, and ULTRA_RARE prevalence from the 12-patient founding cohort (PMID:24705253). Kept the two molecular CCND2 pathophysiology nodes scoped to Thr280 phosphodegron disruption and proteasomal degradation resistance while retaining cortical neural progenitor/radial glial cell types, UBERON:0000956 cerebral cortex, and GO:0061351 neural precursor cell proliferation on the downstream progenitor-expansion node. Added GeneReviews-backed sequelae from Bilateral Perisylvian Polymicrogyria to Oromotor Dysfunction, Intellectual Disability, and Epilepsy, plus an indirect Ventriculomegaly-to-Hydrocephalus progression link caveated as frequency-based. Split general Antiseizure Therapy (backed by GeneReviews PMID:27854409) from the case-specific Topiramate treatment for Infantile Spasms (CHEBI:63631, PMID:39395260), added BYPASSES target_mechanisms on Ventricular Shunting, and added Genetic Counseling (NCIT:C15240).

  summary: Bind a molecular function on the ACBD5 gene node
  details: |
    CI's gene-activity grounding gate flagged ACBD5 as wired into the pathograph without a molecular function. Bound GO:0000062 fatty-acyl-CoA binding (DECREASED) on the ACBD5 Loss of Function node, citing PMID:27899449 ("ACBD5 preferentially binds very-long-chain fatty acyl-CoAs"). GO has no very-long-chain-specific acyl-CoA binding term; its long-chain term (GO:0036042) covers shorter chains, so the parent was bound.

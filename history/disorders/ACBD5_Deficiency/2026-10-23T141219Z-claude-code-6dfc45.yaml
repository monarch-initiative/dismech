  details: |
    New entry for ACBD5 deficiency (retinal dystrophy with leukodystrophy). Disease term MONDO:0100112, the ClinGen-classified term (Definitive, AR); MONDO:0030026 (OMIM:618863 import) mapped as skos:exactMatch because ClinGen states it lumped the two into MONDO:0100112. Both queued stubs deleted. Deep research: claude_code report (research/ACBD5_Deficiency-deep-research-claude_code.md; 15/15 references resolved, 0 off topic, 5/5 terms resolved, no quotes checked). A falcon run was attempted and failed with an Edison authentication error, so no falcon report exists. The report was thin, and most claims are anchored directly in primary papers fetched for this entry: patient reports PMID:23105016, 27799409, 33427402, 34668366, 37789430, 38841324, 42343915; mechanism PMID:27899449, 28108524, 28108526, 37414147, 42118293, 28849344; mouse models PMID:33244184, 38066620, 41324649; ClinGen CGGV record. PMID:37414147 shows the tether is not strictly required for VLCFA oxidation, so the VLCFA-capture and tether functions are separate branches, with a knowledge-gap discussion and a separation-of-function experiment. Contact-site nodes conform to membrane_contact_site_dysfunction (PR 15328); the Purkinje node conforms to cerebellar_purkinje_degeneration. PMID:36699790 (heterozygous VUS, father and daughter) was read and not used as disease evidence. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets 59/59, check-entity-refs and check-causal-targets pass; 12/15 phenotypes causally connected.

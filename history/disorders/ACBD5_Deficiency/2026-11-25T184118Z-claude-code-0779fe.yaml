  summary: 'Gene-family review: ACBD5'
  details: |
    The ACBD5 node described two separable activities, very-long-chain acyl-CoA capture and the peroxisome-ER tether, but bound only fatty-acyl-CoA binding (GO:0000062). It now also binds peroxisome-endoplasmic reticulum membrane tether activity (GO:0160229, DECREASED), citing PMID:28108526, where depletion of ACBD5 or VAP frees peroxisomes from the ER. The tether branch already continued through the downstream contact-site node. The genetic record already carries the ClinGen Definitive classification.

  details: |
    Folded in the completed Edison Falcon deep-research report (research/Hereditary_Spastic_Paraplegia_11-deep-research-falcon.md, 17 citations, 1 artifact) requested via just research-disorder falcon with EDISON_API_KEY. Added three new pathophysiology nodes with independently verified primary-literature evidence: AP-5/Spastacsin/Spastizin Complex Disruption, the 1:1:1:1:1:1 stoichiometric AP-5/SPG11/SPG15 endolysosomal sorting complex, Hirst et al 2013 Mol Biol Cell PMID:23825025; Cortical Neurite Outgrowth and Survival Deficit, SPG11-patient and CRISPR knockout iPSC cortical neuron neurite pathology rescued by the GSK3beta inhibitor tideglusib, Pozner et al 2018 Front Neurosci PMID:30574063; and Neuroinflammatory Microglial Activation, the 2024 postmortem/iPSC-microglia finding of IFN-gamma STAT1-driven microgliosis as a novel disease mechanism, Krumm et al 2024 Acta Neuropathologica PMID:38305941. Added two new phenotypes with clinical-cohort evidence, Ears of the Lynx Sign, HP:0002518, and Overweight, HP:0025502, from Kang et al 2023 Front Neurol PMID:37396771. Added a genetic note on a recurrent SPG11 founder variant, c.2146C>T p.Gln716*, in a Pakistani cohort, Azeem et al 2024 BMC Neurology PMID:39304850. Added a clinical_trials block for the two completed investigational trials targeting the ganglioside-accumulation mechanism: miglustat substrate-reduction safety trial NCT04768166 and the observational trehalose trial NCT04912609, both independently cross-checked against the ClinicalTrials.gov API for phase and status rather than trusting the deep-research summary. All new PMIDs and NCT records were fetched via just fetch-reference and independently spot-checked against the deep-research report per the anti-hallucination SOP; the ears-of-the-lynx HPO mapping and the Chojdak-Lukasiewicz 2023 IJMS PMID:38139357 prevalence figures cited only in the deep-research report full text, not retrievable in the cached abstract, were deliberately left out rather than cited without a verifiable snippet. Re-validated after every edit via the pre-write schema/term validation hook plus just validate, just validate-terms, and just validate-references, all passing; just compliance now reports 87.1 percent global / 87.6 percent weighted.

  summary: Address Round 1 PR review feedback on Hereditary Spastic Paraplegia 11
  details: >-
    Separated corpus callosum and peripheral nervous system pathology out of
    Dying-Back Corticospinal Axon Degeneration into dedicated TISSUE-scale nodes
    (Corpus Callosum Thinning and Interhemispheric Axonopathy and Peripheral
    Motor and Sensory Axonopathy conformed to

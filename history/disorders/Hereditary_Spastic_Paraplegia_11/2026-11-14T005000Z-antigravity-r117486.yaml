    weak generic GO molecular_functions (GO:0005515 and GO:0030674) and regraded
    PMID:37871017 and PMID:25365221 complex-isolation background evidence to
    IN_VITRO on Spatacsin Loss of Function; removed GO:0016042 (lipid catabolic
    process), added UBERON:0000956 (cerebral cortex), softened untested human
    cellular claims on Parkinsonism and Retinal degeneration, and attached
    directness: INDIRECT evidence across downstream phenotype edges.

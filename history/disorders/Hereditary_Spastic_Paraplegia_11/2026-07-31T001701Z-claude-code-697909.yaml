  summary: 'Create: Hereditary Spastic Paraplegia 11 (SPG11)'
  details: |
    Created standalone kb/disorders/Hereditary_Spastic_Paraplegia_11.yaml (MONDO:0011445, gene SPG11/hgnc:11226), a deep-dive companion to the umbrella Hereditary_Spastic_Paraplegia.yaml and Complex_Hereditary_Spastic_Paraplegia.yaml entries (which cover SPG11 only as a brief has_subtypes block), following the standalone-numbered-SPG precedent set by Hereditary_Spastic_Paraplegia_48.yaml. Baselined phenotypes against the GeneReviews chapter (PMID:20301389, Stevanin G) per the SOP: progressive spastic paraplegia, thin corpus callosum, mild intellectual disability/progressive cognitive decline, peripheral neuropathy, pseudobulbar signs, hyperreflexia, and the less-frequent cerebellar/retinal/skeletal/parkinsonism findings, each with an exact-quote evidence snippet. Built a 4-node pathophysiology causal chain (SPG11/spatacsin loss of function -> autophagic lysosome reformation (ALR) defect, conforms_to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation -> lysosomal lipid/ganglioside accumulation -> corticospinal and long-tract axonal degeneration), grounded in the primary mechanism literature: Stevanin et al 2007 Nat Genet (PMID:17322883, original SPG11 gene identification, loss-of-function mutations), Chang et al 2014 JCI (PMID:25365221, spastizin/spatacsin mediate ALR), Varga et al 2015 PLoS Genet (PMID:26284655, in vivo Spg11 knockout mouse lysosome depletion), Branchu et al 2017 Neurobiol Dis (PMID:28237315, Spg11 knockout mouse motor/cognitive phenotype and lipid clearance defect), and Boutry et al 2018 Cell Reports (PMID:29949766, spatacsin-dependent ganglioside clearance mechanism). Deep research was requested via the Edison/FutureHouse Falcon provider (EDISON_API_KEY, just research-disorder falcon) but the run is long (20+ min) and had not completed at the time of this commit; its findings will be folded in via a follow-up EDIT history entry. Validated with just validate (schema+terms+references, all pass) and just compliance (90.7% global / 91.6% weighted).

  summary: 'Create: Hereditary Spastic Paraplegia 11 (SPG11, spatacsin)'
  details: |
    Created a new entry for hereditary spastic paraplegia 11 (MONDO:0011445), the commonest autosomal recessive HSP, curated alongside the new corticospinal_tract_axonopathy module. Five pathophysiology nodes; three conform to that module (spatacsin loss of function as the long-axon maintenance machinery defect, dying-back corticospinal axon degeneration as the central effector, and progressive complicated spastic paraplegia as the consequence). The two intermediate nodes covering failure of autophagic lysosome reformation and accumulation of undegraded autolysosomal material are deliberately not routed to lysosomal_substrate_accumulation: spatacsin-null cells preserve cathepsin D processing and lysosomal pH and lose lysosome number rather than lysosome competence, so this is a disorder of lysosome supply and not a lysosomal storage disease. The proposed causal chain from lysosome depletion to selective neuronal death is attributed in the node text to its authors, since it rests on a knockout mouse rather than human tissue. Validation run: linkml-validate reported no issues, linkml-term-validator passed, and just count-verified-snippets reported 25/25 evidence snippets verified against cached references. The corresponding stub was deleted.

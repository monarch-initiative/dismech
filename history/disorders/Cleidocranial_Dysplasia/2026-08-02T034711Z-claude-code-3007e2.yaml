  summary: Source COMPLETE penetrance; scope frequency-row evidence on causal edges
  details: |
    Acts on finding 6 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    penetrance: COMPLETE carried no supporting evidence; the cited snippet established autosomal dominant inheritance only. Added PMID:30123273, which states complete penetrance with widely variable expressivity directly, and extended the inheritance description to record the variable expressivity that accompanies it.

    The eight downstream edges from RUNX2 Haploinsufficiency each carried only an Orphanet frequency row as evidence. Such a row supports the phenotype and its frequency band but says nothing about a causal edge. Rather than drop the edges or fabricate mechanistic citations, each explanation now states explicitly that the row does not establish the causal link and that the edge is typed UNKNOWN accordingly, so the epistemic status is visible to a reader. The same evidence remains appropriate and unchanged in the phenotypes block.

    Validated: schema, reference and term validation all pass.

  summary: Connect risk mechanisms and restore trauma and mortality evidence
  details: |
    Addressed the independent review by adding explicitly uncertain edges from familial liability to cognitive-behavioral risk and from neural circuit differences to binge eating, plus a laxative-withdrawal constipation edge. Restored childhood trauma and abuse as nonspecific observational risk associations using the full rapid-review section. Added BN-specific all-cause and suicide mortality estimates from the 2026 meta-analysis, retaining its observational and population limitations. Changed the classification of the lisdexamfetamine weight-loss item as support for the safety caveat and marked two limitation statements indirect. The new history record links the PR; no deprecated update timestamp was introduced.

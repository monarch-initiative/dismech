  summary: Review bulimia nervosa using full-text studies and current clinical guidance
  details: |
    Rebuilt behavioral and purging-related mechanisms without inferring a primary serotonin lesion from treatment response. Expanded clinical complications with setting-specific electrolyte denominators, clarified sialadenosis and pseudo-Bartter physiology, and replaced the genetic preprint with the published register study while distinguishing broad binge-eating GWAS findings. Full text resolves the reversed affect abstract, adolescent trial denominators and follow-up, selected stimulant feasibility cohort, and long-term recovery attrition. Updated CBT, family treatment, fluoxetine, off-label topiramate, acute and dental care, bupropion avoidance and conditional digital guidance; stimulants remain investigational. Verified eight registry records against a paginated search and qualified two animal component models. Cross-checked both research reports across phenotypes, mechanisms, treatments, genetics, diagnosis, prognosis and models; exploratory immune/microbiome leads and historical diagnostic subtypes were not promoted to established BN biology. MONDO synonyms verified; no GeneReviews chapter, and StatPearls was tagged and read in full. Exact source quotes, ontology and shared-cache validation accompany the review.

  summary: Complete Bulimia nervosa evidence model
  details: |
    Reviewed bulimia nervosa for ontology terms, causal graph integrity, phenotype completeness, complex genetic-liability semantics, treatment mechanisms, and evidence granularity. Added evidence to all 16 causal edges, connected all nine retained phenotypes, marked the non-gene complex-liability assertion UNKNOWN so it is not misread as a causal gene, and added evidence-backed fluoxetine and SSRI targets. Folded the disease-specific work from overlapping PR 7117, including reward and inhibitory-control dysregulation, hypochloremia, anxiety, impulsivity, prevalence, stronger CBT and fluoxetine evidence, and explicitly low-certainty off-label psychostimulant evidence. Schema, terms, references, D2P, connectivity, and compliance checks passed. Weighted compliance improved from 83.6% to 100.0%.

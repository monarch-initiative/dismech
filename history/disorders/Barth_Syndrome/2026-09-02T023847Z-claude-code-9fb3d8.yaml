  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Added classifications.iuis_category: phagocyte defect to the existing classifications block (harrisons_chapter + mechanistic_category).

    IUIS 2022 Table 5, section 1 (Congenital Neutropenias), cache lines 2957-2958: 'Barth Syndrome (3-Methylglutaconic aciduria type II) TAZ XL 300394', affected cells N+L Mel, affected function mitochondrial function, associated features cardiomyopathy, myopathy, growth retardation and neutropenia.

    Two things recorded in notes so they do not read as errors later. First, the paper prints the legacy gene symbol TAZ while this entry binds the current HGNC symbol TAFAZZIN (hgnc:11577) - the same gene. The quoted snippet keeps the published symbol because the quote belongs to the source. Second, iuis_category is single-valued, so the notes state that the tag records Barth syndrome occupying a Table 5 row rather than asserting the disorder is primarily an inborn error of immunity; neutropenia is one feature of a cardiolipin-remodeling mitochondrial disorder led by cardiomyopathy and skeletal myopathy, which is why the IUIS affected-function cell reads 'mitochondrial function'.

    Evidence cites PMID:35748970 with the row quoted verbatim across the printed line break.


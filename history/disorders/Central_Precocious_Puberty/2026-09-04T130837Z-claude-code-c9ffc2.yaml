  details: |
    PR Shepherd review round on PR #8797.

    (1) Added the missing top-level inheritance: block, the single blocking item in the ai4c-reviewer CHANGES_REQUESTED review. Bound to HP:0012275 "Autosomal dominant inheritance with maternal imprinting", not HP:0012274, which is the inverse (paternal silencing, maternal transmission). MKRN3 and DLK1 are maternally silenced and paternally transmitted, so maternal imprinting is the correct term. Supported by the two transmission snippets already verified in this file (PMID:23738509 for MKRN3, PMID:28324015 for DLK1), reused verbatim including their hard-wrap newline escapes; no new references were fetched. The description records that idiopathic CPP, the majority of cases in girls, has no Mendelian pattern.

    (2) Migrated the two remaining supports: PARTIAL evidence items to SUPPORT. PARTIAL was retired from EvidenceSupportEnum by issue #10003 after this branch was cut, so those values are no longer schema-valid and would have failed check-enum-values once merged; the reviewer's praise for the PARTIAL downgrades predates that narrowing. The honest reading they recorded is preserved in the explanation prose, which now says the support is indirect rather than partial. directness: INDIRECT was not added, because this branch's schema predates that slot and the pre-edit validation gate rejects it.

    (3) Took the reviewer's non-blocking suggestion to encode the childhood scoping of Tall stature as onset.onset_category: CHILDHOOD rather than leaving it only in the phenotype name.

    Validation: just validate passes (schema, terms, references); just count-verified-snippets reports 25/25, up from 23/23; just validate-terms passes; check-duplicate-keys clean. Incidental references_cache frontmatter rewrites produced by this stale branch's validator tooling were reverted rather than committed.

    Not done: the reviewer's other two suggestions (re-sourcing the Idiopathic subtype and the Precocious puberty phenotype to PMID:33745030, and finding a gonadotroph-desensitization snippet for the target_mechanisms edge) were left for the PR author, since re-pointing already-verified evidence is a curation judgement rather than a review fix.

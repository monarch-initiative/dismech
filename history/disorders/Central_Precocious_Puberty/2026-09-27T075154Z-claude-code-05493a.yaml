  summary: 'Genetics pass: bind subtype terms, genes and inheritance; wire all four
    causal genes into the pathograph'
  details: |
    Genetics pass for issue #12272 (d2g series-065). Anchor check first: disease_term MONDO:0019165 central precocious puberty is the entry's own concept, not a broader class, so the two checklist rows were nominated because the entry's subtype rows carried no bindings rather than because of an over-broad anchor.

    Curated. All four has_subtypes rows gained bindings, and the KISS1_KISS1R row was split so each MONDO class could be anchored exactly. MKRN3 row bound to MONDO:0014137 with genes hgnc:7114 and HP:0012275 (autosomal dominant with maternal imprinting, i.e. paternal expression); new KISS1R row bound to MONDO:0008302 with genes hgnc:4510 and HP:0000006; new KISS1 row with genes hgnc:6341 and an inheritance block that records the mixed heterozygous/homozygous reporting and deliberately asserts no mode; DLK1 row with genes hgnc:2907 and HP:0012275; Idiopathic row bound to MONDO:0015713. The two genetic rows that pointed at KISS1_KISS1R were repointed, and all four genetic rows gained relationship_type CAUSATIVE.

    Pathograph wiring. Before this pass none of the four causal genes reached any pathophysiology node. Two upstream nodes were added, each carrying the genes that act at it: Loss of Paternally Expressed Imprinted Restraint on the GnRH Pulse Generator (MKRN3, DLK1, arcuate nucleus of hypothalamus UBERON:0001932, biological_scale MOLECULAR) and Enhanced Kisspeptin-KISS1R Drive on GnRH Secretion (KISS1, KISS1R, GO:0004930 INCREASED, biological_scale CELLULAR). Both flow into the pre-existing Premature Reactivation of Pulsatile GnRH Secretion node. All four genes are now WIRED_DIRECT under subtype-usage-audit.

    Defect found and corrected. The MKRN3 row was labelled CPPB1 and the DLK1 row CPPB2. MONDO:0008302 (OMIM:176400) carries the synonyms CPPB1 and "central precocious puberty caused by mutation in KISS1R" with OWL axiom hgnc:4510; MONDO:0014137 (OMIM:615346) carries CPPB2 and "central precocious puberty caused by mutation in MKRN3" with axiom hgnc:7114. So CPPB1 belongs to KISS1R and CPPB2 to MKRN3. The MKRN3 row was corrected to CPPB2 and the designation removed from the DLK1 row rather than renumbered: MONDO has no DLK1 class (searched DLK1, the approved gene name, and central precocious puberty 3, all zero hits, plus the full child list of MONDO:0019165), and MedGen's central precocious puberty series stops at 2.

    No new reference caches were needed; every snippet was quotable from caches already committed. 41 snippets verified before the self-review pass and 46 after it.

    Self-review against the caches changed eight passages of the first draft. The largest was a node named Loss of Imprinted Paternal Restraint, which reads as the paternal allele being imprinted when the genes are paternally expressed and maternally imprinted. Also removed: an unsourced "years early", a KISS1R description clause about GnRH neurons that this row's own evidence does not name, and a kisspeptin node name asserting a cellular target its cited sentence does not state. Two DLK1 citations were added where the description had run ahead of the evidence.

  summary: 'Review: Autosomal Dominant Striatal Neurodegeneration'
  details: |
    Re-reviewed the ultra-rare PDE8B disorder against the original mapping and
    molecular reports plus literature through 2026-07-21. Qualified the
    cAMP/dopamine model as a plausible but unresolved bridge to selective
    striatal injury, removed an unsupported medium-spiny-neuron assertion, and
    made every causal edge evidence-complete. Added a later PDE8B variant report,
    tremor without parkinsonism as a case-level phenotype expansion, a
    Parkinson-disease differential, exact MONDO mapping, and explicit mechanism
    and phenotype-boundary gaps. Removed redundant legacy reference findings
    whose claims are now represented as structured evidence. Fully paginated
    ClinicalTrials.gov and NCBI GEO/DataSets searches found no disease-specific
    studies or datasets, so empty sections were retained rather than populated
    with indirect records. Validation reached 100% weighted compliance (99.2%
    unweighted solely because no dataset exists), 11/11 phenotype connectivity,
    1/1 gene wiring, and 57/57 exact cached evidence checks; schema, ontology,
    causal-graph, folded-hyphen, and CX2 checks passed.

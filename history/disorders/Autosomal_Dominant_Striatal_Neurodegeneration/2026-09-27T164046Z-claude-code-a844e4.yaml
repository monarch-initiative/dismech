  summary: 'Genetics pass: re-anchor disease_term to the PDE8B class, route the PDE10A
    sibling to a stub'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0012205 ADSD type 1 / PDE8B and MONDO:0014835 striatal degeneration,
    autosomal dominant 2 / PDE10A). Neither CURIE appeared anywhere in kb/ before
    this change.

    Anchor finding, and the substantive change here. The entry was bound to
    MONDO:0000211, the two-member series parent, while its description, synonyms and
    every phenotype describe the PDE8B disease. MONDO:0012205 is the PDE8B leaf: it
    carries hgnc:8794 in its logical axioms, lists "ADSD", "ADSD1" and "striatal
    degeneration, autosomal dominant caused by mutation in PDE8B" among its synonyms,
    and xrefs OMIM:609161, the OMIM entry that ORPHA:228169 - cited throughout this
    record for phenotype frequencies - maps to as an exact match. MONDO:0000211 xrefs
    the phenotypic series OMIMPS:609161 instead. `disease_term` was rebound to
    MONDO:0012205 and MONDO:0000211 recorded as `skos:broadMatch`.

    Rows. The rebinding curates MONDO:0012205. MONDO:0014835 is declined and routed
    to a new curation stub, stubs/Striatal_Degeneration_Autosomal_Dominant_2.yaml.
    Its founding report (PMID:27058447) describes childhood-onset chorea with
    symmetrical bilateral striatal lesions in three unrelated individuals carrying de
    novo heterozygous substitutions in the regulatory GAF-B domain, which that report
    shows leave basal PDE10A activity intact while disrupting cAMP-mediated
    stimulation. Both the age of onset and the movement phenotype differ from the
    adult-onset parkinsonian picture here, and the molecular lesion is regulatory
    rather than an abolition of activity, so extending this entry to cover it would
    attribute a parkinsonian phenotype set to a chorea syndrome.

    Wiring. Gene-to-mechanism coverage was already 1/1 and phenotype causal inlink
    already 11/11; both are unchanged. No wiring work was needed on this entry.

    One new reference cache is committed, PMID_27058447.md, cited in the stub's
    reasoning. Validation on the committed tree: `just validate` clean,
    `just validate-terms` clean, 57 snippets verified in this file, within a 643/643
    verification across the ten files this PR touches.

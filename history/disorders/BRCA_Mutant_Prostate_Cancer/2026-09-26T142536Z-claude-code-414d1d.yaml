  summary: Repoint over-broad disease_term to a broadMatch cross-reference; add subtype
    foreign keys
  details: |
    Anchor repair for issue #12260 (d2g series-053). The issue attributed four
    hereditary prostate cancer MONDO classes to this entry - prostate cancer
    hereditary 1 (RNASEL), 2 (ELAC2), 9 (HOXB13) and 12 (EHBP1) - none of which is a
    BRCA-related disease. They landed here because the entry bound MONDO:0008315
    prostate cancer as its disease_term, asserting that a BRCA-defined molecular
    stratum is identical to the whole prostate cancer class.

    CLAUDE.md's cancer granularity ladder forbids exactly this: a biomarker stratum
    promoted to its own entry anchors to the parent term through mappings, never by
    bare parent-term reuse. The histologic entity beneath that class is curated
    separately as Prostate_Adenocarcinoma, bound to MONDO:0005082, so the two entries
    were making incompatible claims about the same branch.

    Searches run before dropping the binding, synonym-inclusive against
    ols:mondo: "BRCA prostate", "BRCA2 prostate cancer", "homologous recombination
    deficient prostate" and "hereditary prostate cancer". The only BRCA-related class
    returned is MONDO:0700269 BRCA2-related cancer predisposition, a germline
    predisposition class spanning breast, ovarian, pancreatic and prostate cancer;
    this entry also covers somatic BRCA alterations, so that class does not denote it
    either. The fourth query returned the numbered HPC susceptibility loci, confirming
    what the broad class subsumes.

    First attempt at the change, corrected in review round 1 below: disease_term was
    made a free-text preferred term with no binding, and MONDO:0008315 recorded in a
    new mappings.mondo_mappings block as skos:broadMatch with the searches in the
    justification, on the reasoning that broadMatch keeps the class in the curation
    queue where exactMatch or narrowMatch would retire it, and following the
    ANK2_Related_Complex_Neurodevelopmental_Disorder precedent.

    Also added: subtype foreign keys on the two gene records, BRCA2 to
    BRCA2-Mutant Prostate Cancer and BRCA1 to BRCA1-Mutant Prostate Cancer, taking
    subtype foreign-key coverage from 0 to 2/2. No subtype_term is bound on either
    row because the searches above found no MONDO class for a BRCA1- or
    BRCA2-specific prostate tumour.

    No genetics curation beyond that: the four checklist genes are declined
    structurally as distinct gene-defined diseases belonging to their own entries, and
    their gene-disease claims were deliberately not researched, since working backward
    from a checklist row to a citation is what this campaign forbids.

    Validation: just validate, validate-terms pass; 175/175 snippets verified across
    the three files in this pull request.

    Review round 1 (PR #12907, ai4c-reviewer, CHANGES_REQUESTED). The reviewer read the
    broadMatch form as departing from design decision 3a without saying so, and was
    right: 3a's L4 row prescribes anchoring disease_term to the parent term, recording
    skos:narrowMatch with a justification, and seeking a MONDO new-term request. The
    entry now follows 3a: disease_term is MONDO:0008315 again, and the mapping is
    skos:narrowMatch with the searches and the no-class-exists finding in the
    justification. The ANK2 precedent I cited first is not a cancer stratum, so 3a did
    not reach it.

    Two further 3a L4 obligations are deliberately left for a follow-up rather than
    done here, because each touches a file outside this pull request: (c) a covering
    Grouping, of which none exists for prostate cancer strata, and (d) a pointer
    subtype on the histologic parent Prostate_Adenocarcinoma. The MONDO new-term
    request under (a) is reported to the maintainer rather than filed, per the
    campaign's instruction not to open upstream issues unilaterally.

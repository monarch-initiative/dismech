  details: |
    LOINC tranche F batch 4. This entry's only biochemical row is PSA (Prostate-Specific Antigen), the generic prostate-cancer monitoring marker, not a test specific to the BRCA-mutant stratum. There is no diagnosis: section, and genetic: (the BRCA1/BRCA2 descriptors) is not a valid loinc_term host in the schema. A combined BRCA1+BRCA2 molecular test code genuinely exists and resolves cleanly (LOINC:50995-0, BRCA1+BRCA2 gene targeted mutation analysis in Blood or Tissue by Molecular genetics method -- verified live and bound on Triple_Negative_Breast_Cancer in this same batch), so this is not a LOINC coverage gap: the entry simply never writes a diagnostic-test row for the biomarker that defines its own stratum. This is the exact structural finding tranche F's §3a diagnostic-pathway check exists to surface. PSA was not bound: it is not stratum-specific, and binding it would not make the BRCA-defining pathway checkable, which is the point of this tranche. No files changed.

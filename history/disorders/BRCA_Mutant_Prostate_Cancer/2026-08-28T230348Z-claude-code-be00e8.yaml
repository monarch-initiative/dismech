  summary: 'Detailed evidence review: BRCA-Mutant Prostate Cancer'
  details: |
    Re-read all 85 pre-existing evidence items and all 74 unique cited references (57 PMIDs, 17 DOIs) against their references_cache entries. Every snippet was verified as an exact substring of the cached reference body: PMID-backed snippets via the mechanical snippet audit, and the 20 DOI-prefixed snippets (skipped by the auditor) checked manually with whitespace-normalized matching. Semantic support, supports grading, evidence_source classification, and disease/entity identity (Named Entity Confusion) were checked item by item. Defects found and fixed: (1) the Genomic Instability to Prostate Cancer causal edge cited only a PMID:40063046 epidemiology sentence (adenocarcinoma at least 99 percent, median age 67) that does not address BRCA-driven causation; regraded that item to PARTIAL with a clarified explanation and added two directly supporting items from already-cached references: PMID:19188187 (human case-control, increased prostate cancer risk and OR 3.2 for Gleason 7-10 in BRCA2 founder-mutation carriers, HUMAN_CLINICAL) and PMID:20585617 (prostate-specific Brca2 knockout mouse showing Brca2 acts as tumour suppressor in the prostate, MODEL_ORGANISM). (2) evidence_source corrections: PMID:40063046 OTHER to HUMAN_CLINICAL in both uses (JAMA review reporting human clinical and epidemiologic data); references-block PMID:20585617 OTHER to MODEL_ORGANISM (mouse genetic study); PMID:28835508 COMPUTATIONAL to OTHER (journal commentary with no computational content); PMID:38182487 COMPUTATIONAL to HUMAN_CLINICAL (genomic profiling of a 200-patient cohort with survival analysis); DOI:10.3390/cells13080673 HUMAN_CLINICAL to MODEL_ORGANISM (patient-derived xenograft mouse model paper); DOI:10.1158/2767-9764.crc-23-0554 HUMAN_CLINICAL to IN_VITRO (preclinical cell-line, organoid and PDX drug study with no treated patients). Observations recorded but deliberately not churned: many deep-research references-block items grade primary human cohort papers as OTHER (a conservative understatement rather than a misleading overstatement), and a few bibliography references are tangential to prostate cancer (PMID:19064968 pancreatic adenocarcinoma, PMID:40795806 breast cancer, PMID:41690056 spinal metastases); their finding statements accurately quote the papers, so they were flagged in the review report rather than removed. All other core-section claims (symptom-burden phenotypes from PMID:29111175, histopathology PMID:36081403, BRCA reversion resistance PMID:36243543 and PMID:39577422, PARP-AR co-dependency and combination-therapy treatments from TALAPRO-2, MAGNITUDE and the FDA approval summary) matched their cited sources. Post-edit validation: just validate passed and the snippet audit reports 67/87 verified with 20 DOI snippets skipped by prefix, all 20 additionally hand-verified as exact.

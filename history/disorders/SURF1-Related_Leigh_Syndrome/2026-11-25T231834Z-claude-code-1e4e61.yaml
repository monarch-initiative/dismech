  summary: 'Gene-family review: SURF1'
  details: |
    The SURF1 genetic record now carries record-level evidence (PMID:9837813, the founding identification of SURF1 in COX-deficient Leigh syndrome), its recessive inheritance block is bound to HP:0000007, and a note records ClinGen's Definitive tiers for Leigh syndrome and mitochondrial disease, neither being this entry's MONDO:0700250. CAUSATIVE is kept. The SURF1 node keeps its complex IV assembly process and no molecular function: GO has only an electronic cytochrome-c oxidase activity annotation for SURF1, which an assembly factor does not have, and heme a binding has been shown only for bacterial Surf1 homologs.

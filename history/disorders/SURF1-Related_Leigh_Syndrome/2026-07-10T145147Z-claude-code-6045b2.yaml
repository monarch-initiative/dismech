  details: |
    Up-to-date augment pass. Added 8 SURF1-specific phenotypes with frequencies from the Wedatilake 2013 multi-centre natural history study (PMID:23829769): failure to thrive (95%), feeding difficulties (89%), central respiratory failure (78%, leading cause of death), movement disorder/dystonia (52%), ophthalmoparesis/oculomotor involvement (52%), hypertrichosis (41%, SURF1-suggestive), optic atrophy (23%), seizures (14%). Added a classifications block (Harrison's GENETICS_ENVIRONMENT_DISEASE; mechanistic mitochondrial disease; ICIMD complex_iv_subunits_and_assembly_factors). Added structured prevalence fields (PERIOD_PREVALENCE, RARE) with an honest note that no SURF1-specific per-100,000 rate is established. Added a HUMAN_MODEL_MISMATCH discussion documenting the Surf1(-/-) mouse mild-COX-defect vs severe human Leigh syndrome discrepancy (PMID:26804654), with a proposed iPSC-neuron experiment. Added Wedatilake and Kovarova to top-level references. Deep research provider: claude_code. NEC preflight confirmed MONDO:0700250 = SURF1/OMIM:220110. All new PMIDs fetched via just fetch-reference; all 24 snippets manually verified as whitespace-normalized exact substrings of cached abstracts; schema+term validation pass.

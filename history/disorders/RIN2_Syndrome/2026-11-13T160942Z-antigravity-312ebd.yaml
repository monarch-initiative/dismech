  details: |
    Added MONDO exact synonyms, top-level disease description, Harrison's Part classifications (GENETICS_ENVIRONMENT_DISEASE, DERMATOLOGY, IMMUNE_RHEUMATOLOGIC), Orphanet and literature case-count prevalence, RIN2 endocytic/Rab5 GEF cellular and molecular grounding (CL:0000057 fibroblast, GO:0005085, GO:0006897), downstream connective-tissue matrix disorganization and redundant skin nodes wired to 12 clinical phenotypes, diagnostic testing (skin biopsy ultrastructure, neuroimaging, molecular genetic testing), cutis laxa/EDS differential diagnoses (MONDO:0009161, MONDO:0016002), and targeted supportive treatments.

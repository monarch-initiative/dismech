  summary: 'Create: RIN2 Syndrome'
  details: |
    De-novo curation of RIN2 syndrome (MACS syndrome, MONDO:0013115, gene RIN2, hgnc:18750). Autosomal recessive connective-tissue disorder. Built a 5-node pathograph (RIN2 loss of function via NMD -> dysregulated Rab5-dependent endosomal trafficking -> fibroblast secretory-pathway dysfunction + fibulin-5/dermal-microfibril deficiency -> abnormal dermal connective-tissue matrix -> cutis laxa/hyperextensible skin) and 13 phenotypes, each with an exact-quote evidence snippet from one of five RIN2-specific PMIDs (19631308 Basel-Vanagaite 2009 foundational MACS description; 20424861 Syx 2010 ultrastructure/NMD; 27277385 Rosato 2016 phenotype expansion; 30769224 Kameli 2020 leukoencephalopathy; 24449201 Aslanger 2014 bronchiectasis/hypergonadotropic hypogonadism). ClinGen Definitive (AR, Lysosomal Diseases GCEP) gene-disease validity recorded and sourced to CGGV:assertion_7427a25e. No GeneReviews chapter exists (confirmed offline+online). Deep research: requested falcon per default, but the Edison/falcon backend (agentapi) was unavailable in this environment, so the run fell back to openscientist (recorded in report provenance via --fallback). Validated: just validate (24/24 snippets), validate-terms, check-entity-refs, check-causal-targets, check-gene-validity, check-gene-activity-grounding, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-qualifier-terms all pass.

  details: |
    Applied changes recommended by the three OpenScientist hypothesis assessments (kb/hypotheses/MYH7-Related_Skeletal_Myopathy/*/assessments/). Added an edge Coiled-Coil Destabilization of the Myosin Rod -> Loss of Myosin Head Sequestration (PMID:37788100), so the assembly and energetics models share one upstream cause. Added two proposed experiments to the assembly_versus_energetics controversy: a relaxed-state stabiliser rescue measured against aggregate burden, and 31P-MRS in genotyped carriers. On shared_rod_mechanism_across_isoforms, recorded that the mantATP SRX assay (PMID:38103642) and the IHM-SRX equivalence (PMID:40727670) are disputed and that recessive MYH2 disease is type 2A fibre loss (PMID:32578970), outside the rod-variant question. On myosin_inhibitor_transfer, added that aficamten does not sequester heads unlike mavacamten (PMID:40463178), and mavacamten's skeletal-muscle engagement plus a background safety caution (PMID:41144950, journal version rather than the bioRxiv preprint). All hypotheses stay EMERGING. Validation: validate-disorders, 137/137 snippets.

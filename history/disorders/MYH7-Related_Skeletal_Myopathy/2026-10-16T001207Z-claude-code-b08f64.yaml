  details: |
    Applied an internal pre-PR review. Each suggested CURIE was checked in OLS before binding. Rebound: hyaline bodies to HP:0100306, hanging great toe to HP:0002601 (weakness, not amyotrophy), cores to HP:0003787, cervical rigidity to HP:0005997, slow-fibre cell type to CL:0002211 type I muscle cell. Neck flexor weakness frequency lowered to FREQUENT. Background quotes from a mouse paper and an iPSC paper regraded by the quoted text with quote_role BACKGROUND. Split the ATP/fatigue node into Increased Basal Myosin ATP Turnover (MOLECULAR) and Slow Fibre Fatigue and Weakness (CELLULAR); renamed the regional node to Selective Pattern of Muscle Involvement and made its incoming edge INDIRECT_UNKNOWN_INTERMEDIATES; added PMID:37788100 edge evidence for rod variant -> head sequestration. Added hypertrophic cardiomyopathy, type 1 fibre predominance, abnormal mitochondria, talipes cavus equinovarus and orbicularis oculi weakness; added a Brace qualifier on the orthosis treatment; fixed subtype evidence; notes now name the OLS queries run. Not taken: an UBERON term for extensor hallucis longus (OLS l~extensor hallucis longus returned nothing). validate-disorders: 124 snippets, 0 issues.

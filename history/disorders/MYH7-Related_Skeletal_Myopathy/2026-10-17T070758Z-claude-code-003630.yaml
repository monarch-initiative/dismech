  summary: Ground MYH7 molecular functions; take review suggestions
  details: |
    CI failed the 'Check for newly ungrounded genes' gate: MYH7 reached four pathophysiology nodes, none with molecular_functions. Bound GO:0008307 structural constituent of muscle (ABNORMAL) on the MYH7 Rod Domain Variant and Coiled-Coil Destabilization nodes, and GO:0016887 ATP hydrolysis activity (INCREASED) on Increased Basal Myosin ATP Turnover, matching the PMID:37788100 finding that basal myosin ATP consumption is increased. The source-defect report contradicted the non-invasive ventilation explanation (the PMID:39448255 abstract does report NIV use), so that item now quotes the sentence reporting nocturnal NIV in 6 of 14 patients and is no longer graded INDIRECT. Also took the optional suggestions from the round-1 review: ptosis (3/21), pes cavus and hammertoe (7/21) and club foot (2/21) from the Italian cohort PMID:27387980; the GeneReviews 50% sibling-risk sentence on the inheritance block; GeneReviews surveillance (annual neurologic exam, scoliosis checks during growth) on spinal stabilization; and a description on the cores phenotype saying the minicore term covers minicores only (central cores are HP:0030230, found with runoak -i ols:hp search l~core).

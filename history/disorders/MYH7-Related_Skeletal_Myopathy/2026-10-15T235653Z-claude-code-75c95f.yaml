  summary: 'Create: MYH7-Related Skeletal Myopathy'
  details: |
    New entry for MONDO:0008050 using ClinGen's lumped name, covering Laing distal myopathy, autosomal dominant myosin storage myopathy (bound to MONDO:0008409 as a subtype, following ClinGen's lumping), scapuloperoneal and axial presentations. Recessive myosin storage myopathy (MONDO:0009708) is left to its existing stub.

    Deep research: falcon was requested by default but failed Edison authentication twice (503 'Failed to authenticate'); the documented --fallback flag is not implemented in this checkout, so openscientist and claude_code were run directly instead. openscientist: 24/24 references resolved, 2 quotes unsupported (PMID:35854315, PMID:31068177; neither quote was used), HPO label mismatches are table-column artifacts. claude_code: 3 web searches, one PMID, mostly flagged unverified; used only to locate the 2016 proline report and the French cohort (PMID:39448255). Most evidence comes from PubMed searches and the GeneReviews chapter (PMID:20301606, tagged), the ClinGen CGGV record and Orphanet ORPHA:59135.

    Pathophysiology chain: rod variant -> coiled-coil destabilization -> defective thick-filament assembly -> myosin aggregation / type 1 fibre remodelling -> anterior leg and axial involvement, with a parallel branch rod variant -> loss of super-relaxed head sequestration -> raised ATP use and fatigue (PMID:38690726, PMID:37788100; the two disagree on whether contractility rises, recorded in the node description), and a cardiac branch. One edge (energetic stress -> fibre remodelling) is marked INDIRECT_UNKNOWN_INTERMEDIATES and uncited because no source demonstrates it.

    Validation: just validate-disorders passed (115 snippets, 110 titles, 0 issues); validate-terms, check-entity-refs, check-causal-targets, check-genereviews (TAGGED), check-snippet-length and the other offline gates pass. Uncited reference caches fetched during research were pruned and count-verified-snippets re-run afterwards.

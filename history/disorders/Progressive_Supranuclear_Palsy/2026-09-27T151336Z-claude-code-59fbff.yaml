  summary: Bind the PSP-RS and PSP-P subtype terms and wire the four MDS clinical
    domains
  details: |
    series-064 genetics pass. Both checklist classes were already curated here as has_subtypes rows and simply carried no binding: MONDO:0010997 is classical PSP / Richardson syndrome, which is the PSP-RS row, and MONDO:0009839 is PSP-parkinsonism, which is the PSP-P row. Both are now bound. They reached a genetics gap list because MONDO asserts RO:0004003 MAPT on both, which the new entry notes flag rather than copy: this entry types MAPT as RISK_FACTOR because what the common sporadic disease carries is the H1 haplotype and a 4R splicing imbalance, and the Mendelian arm is held in the separate Inherited PSP (MAPT) row. Phenotype inlink 0/15 to 4/15: one edge from the terminal neurodegeneration node to a representative of each of the four MDS clinical domains, typed INDIRECT_KNOWN_INTERMEDIATES because the step from convergent tau toxicity to a particular feature runs through which nuclei degenerate and the entry does not model that node by node. The other eleven phenotypes are left unwired rather than attached to the same node on weaker grounds.

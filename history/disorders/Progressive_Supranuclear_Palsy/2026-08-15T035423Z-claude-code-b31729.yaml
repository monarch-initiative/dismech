  summary: Correct ChiCTR trial identifier and cite its WHO ICTRP record
  details: |
    Renamed the FMT trial from the nonexistent 'ChiCTR-2100045397' to the canonical 'ChiCTR2100045397' and added an ICTRP:ChiCTR2100045397 evidence item quoting the registration record's sponsor row. The hyphenated identifier was transcribed faithfully from PMID:36969340, whose abstract prints 'Clinicaltrials.gov identifier: ChiCTR-2100045397' - wrong twice over (ChiCTR is not ClinicalTrials.gov; the canonical form carries no hyphen). ICTRP returns its not-found shell for the hyphenated form. Added a notes: block recording the identity match (sponsor, investigators Liu H / Teng J, FMT intervention, 2021-04-14 registration) AND the unresolved discrepancy: the registered record describes a single-arm phase 0 study of 'movement disorders' with a healthy control group and a 79+79 target, while the paper reports a randomised placebo-controlled phase 2 trial confined to PSP-RS. Phase/status follow the publication. Validated: linkml-validate (no issues), linkml-term-validator (passed), linkml-reference-validator batch run with --no-full-text (passed, 112/112 snippets verified across this file and Ectopic_Pregnancy).

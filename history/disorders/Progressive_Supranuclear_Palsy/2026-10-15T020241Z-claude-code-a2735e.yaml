  details: |
    Addressed the PR 14111 review. Renamed the node to Remote Cortical Network Effect of Subcortical Tau so it names the mechanism only (the source uses a healthy-control normative connectome, so neither 'disruption' nor 'dysfunction' is measured in patients). Removed the unsupported cell_types neuron binding. Typed both new edges INDIRECT_UNKNOWN_INTERMEDIATES with descriptions and edge-level evidence. The edge to Cognitive Impairment now states the association is with the Frontal Assessment Battery and carries a SUPPORT item (FAB sentence) and a separate REFUTE item (no association with MMSE), since the phenotype's own evidence is an MMSE result. Noted the PSP-RS-only cohort (n = 37) and added quote_role PRIMARY_RESULT. Fixed the earlier history record's PR and issue links. Retargeting to Executive Dysfunction was not taken because that phenotype is scoped to PSP-cortical while this cohort was PSP-RS.

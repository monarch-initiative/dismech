  summary: 'Review round on PR 13022: source the four domain edges'' intermediates'
  details: |
    Review round 1 on PR #13022. The four MDS-domain edges named specific anatomy in intermediate_mechanisms - dorsal midbrain oculomotor nuclei, subthalamic nucleus and globus pallidus, frontal cortex and its subcortical connections - that no cited source stated; all four rested on the same MDS criteria domain sentence, which names no region. Searched Europe PMC for a PSP neuropathology source. PMID:39478416 lists NFTs in the globus pallidus and subthalamic nucleus, but that sentence describes two autopsied cases carrying Bassoon mutations, so citing it for sporadic PSP would repeat the overreach at a smaller scale; it was not used that way. The same abstract opens with a general statement - PSP is neuropathologically defined by neuronal loss in the basal ganglia and brainstem with widespread neurofibrillary tangles and phosphorylated tau accumulation - which is the level at which the intermediates can be sourced. Three intermediates are now 'region-specific neuronal loss in the basal ganglia and brainstem' and the cognitive one, which that anatomy does not cover, is 'region-specific neuronal loss with widespread neurofibrillary tangle formation'. That definitional sentence is attached to all four edges as a SUPPORT item with directness INDIRECT and quote_role BACKGROUND, with an explanation stating that it does not identify which nucleus produces the individual feature. Validation: just validate and just validate-terms pass, count-verified-snippets 269/269.

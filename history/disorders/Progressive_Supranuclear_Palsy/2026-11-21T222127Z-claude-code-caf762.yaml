  summary: Bind EIF2AK3 on the stress-response node; add PROSPER and PRESERVE trials
  details: |
    Bound EIF2AK3 (hgnc:3255, PERK) on Integrated Stress Response Activation, which bound no gene, with two items from the PSP GWAS PMID:21685912: the EIF2AK3 risk signal and its assignment to the endoplasmic reticulum unfolded protein response. Added clinical_trials rows NCT06355531 (PROSPER, FNP-223, PHASE_II, COMPLETED) and NCT07498426 (PRESERVE, NIO752, PHASE_III, RECRUITING); status and phase from the ClinicalTrials.gov API on 2026-11-21. FNP-223 is identified as the OGA inhibitor ASN90 by PMID:41239890, which also names the PROSPER registration. No publication describes NIO752; its antisense identity is from the intervention listing of its phase 1 registration NCT04539041, stated in the row description rather than cited. Leads came from the OpenScientist assessments in experiments/biomni_lead_exploration/psp/ (PR #18718). A further lead, STX6 and PLEKHM1 as autophagosome-lysosome fusion genes, was dropped because the cited review's abstract lists them as risk genes without stating that function. Validated with just validate.

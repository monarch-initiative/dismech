  summary: 'Review round 3: bruising, leukocytosis, anaemia and thrombocytopenia phenotypes'
  details: |
    Addressed both IMPORTANT findings from the third ai4c-reviewer round. (1) Added Bruising susceptibility (HP:0000978), citing the same PMID:31201888 sentence the Epistaxis phenotype already quotes, wired downstream of Mild Bleeding Diathesis of Unresolved Mechanism. No frequency band, consistent with the entry's practice of not banding a four-patient kindred. (2) Added the three haematological findings from the 2025 case (PMID:41026272): Increased total leukocyte count (HP:0001974 - note the canonical HPO label is not 'Leukocytosis'), Anemia (HP:0001903) and Thrombocytopenia (HP:0001873). The leukocytosis is wired downstream of Hyperinflammatory Response to Bacterial Stimuli with edge-level evidence quoting the authors' own conclusion that it reflected infection and the inflammatory response rather than leukaemia, typed INDIRECT_UNKNOWN_INTERMEDIATES to preserve their hedge. Anaemia and thrombocytopenia are deliberately left unwired with notes saying why: no cited source proposes a mechanism, and attaching them downstream of the inflammatory node would assert an anaemia of inflammation nothing states. Their CBC values are recorded in a source table that the reference cache flattens into run-together digits, so the quoted snippets are the flattened rows and the explanations state the figures. Also taken from the optional list: narrowed the genetic association over-claim (PMID:41026272 localizes p.Arg211Trp to exon 2 only and does not place it in the DNA-binding domain, so 'Biallelic missense variants in the DNA-binding domain' became 'the characterized allele lies in the DNA-binding domain', with the reasoning and the source's competing autosomal-recessive-SGD framing recorded in genetic notes); added two quotes for the previously unquoted GO:0034341 type II interferon binding; and recorded the authors' 'deficiency in specific granule function' conclusion on the chemotaxis node, with a note on Preserved Neutrophil Granule Content distinguishing preserved granule content from granule function. Validation: just validate, validate-terms, validate-disorders all pass; count-verified-snippets 67/69 with 2 skipped by prefix, and 69/69 when re-run with --unskip-prefix DOI; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms clean; whole-KB check-title-snippets, check-snippet-length, check-snippet-grading report no new findings. Empty orphan list; the only unwired phenotypes are the two deliberate ones above.

  summary: 'Create: Pelger-Huet-like Anomaly and Episodic Fever with Abdominal Pain
    (CEBPE p.Arg219His)'
  details: |
    De-novo curation of MONDO:0009842 (OMIM 260570, now titled 'immunodeficiency 108 with autoinflammation') as a standalone Disease entry. Identity was resolved from the MONDO xrefs as the issue directed: OMIM:260570, and the annotation source PMID:31201888 (Goos et al. 2019), which identifies homozygous CEBPE p.Arg219His in the Finnish index kindred and names the entity CAIN. Nine pathophysiology nodes trace variant -> loss of transcriptional-repressor association -> ~3x increased chromatin occupancy at an unchanged motif -> 464-gene transcriptional dysregulation -> constitutive caspase-5 and noncanonical inflammasome priming -> hyperinflammatory attacks, with parallel branches for chemotaxis, nuclear hyposegmentation, preserved granule content (a negative node with no downstream edge, and the discriminator against specific granule deficiency) and an unresolved bleeding diathesis. Twelve phenotypes, all wired, no frequency bands (denominator is three genotyped members of one kindred plus one unrelated child). Pre-2019 literature curated as evidence rather than discarded: PMID:477034 (neutrophil motility, 1979) and PMID:3678479 (clinical syndrome plus the depressed delta-aminolevulinic acid synthase finding, 1987), both cited by the 2019 paper as prior reports of the same family; the 1987 heme-depletion hypothesis is recorded as a knowledge gap rather than dropped. PMID:4831644 (1974, names the syndrome) is listed in references only because no abstract or full text is available to quote. PMID:41026272 (2025) supplies a second homozygous allele (p.Arg211Trp), the AML-mimicry diagnostic pitfall, and the only durable reported treatment (baricitinib). Recorded in the entry notes: MONDO's second parent 'hereditary disorder of connective tissue' is unsupported by any cited source and looks like an artifact of the Pelger-Huet label. Validated: just validate (51/51 snippets verified, all PMID references, no DOI citations), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, plus whole-KB check-title-snippets, check-snippet-length, check-snippet-grading and check-folded-hyphens. A Falcon (Edison Scientific Literature) deep-research run was attempted and discarded. It correctly identified the 1974 and 1987 reports and correctly warned against conflating the entity with LBR-related classic Pelger-Huet anomaly or NBAS-related SOPH syndrome, but it never mentions CEBPE and concludes that no causal gene, pathogenic variant, validated mechanism or treatment trial was found - a false negative about a disease solved in 2019 with a published treatment response in 2025. `just preflight-dr` returns SKIP rather than FAIL for this term because MONDO records no causal gene, so the manual OMIM/synonym fallback is what caught it. No research artifact is committed and none of its content was used.

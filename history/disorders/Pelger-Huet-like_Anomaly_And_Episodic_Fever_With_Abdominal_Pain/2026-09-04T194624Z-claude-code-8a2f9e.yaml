  details: |
    Addressed the CHANGES_REQUESTED review on PR #10992. Added the omitted intra-abdominal granuloma phenotype (HP:0032252 Granuloma, site kept in preferred_term because HPO has no abdominal-site granuloma term) wired downstream of Hyperinflammatory Response to Bacterial Stimuli with INDIRECT_UNKNOWN_INTERMEDIATES, and split Osteomyelitis (HP:0002754) out of Recurrent abscess formation, wired downstream of Impaired Neutrophil Chemotaxis with Reduced CD66b. Added GO:0034340 response to type I interferon with two supporting evidence items quantifying the IFN-alpha2b arm. Moved GO:0003682 chromatin binding from the repressor-loss node to Increased C/EBP-epsilon Chromatin Occupancy and annotated the repressor-loss node with GO:0001221 transcription coregulator binding, modifier DECREASED. Added a classifications block with harrisons_chapter IMMUNE_RHEUMATOLOGIC and GENETICS_ENVIRONMENT_DISEASE, leaving iuis_category empty because the slot is single-valued and the disease is both a phagocyte defect and an autoinflammatory disorder. Added a histopathology record for the marrow monocytoid predominance with dim cytoplasmic MPO and absent CD34/CD117/HLA-DR. Discovered that the 1974 founding report, recorded as unquotable because PubMed carries no abstract for PMID:4831644, does have an abstract under DOI:10.1182/blood.V43.6.871.871; fetched that cache and cited it on the recurrent-fever and abdominal-pain phenotypes. Re-ran the Falcon deep-research recipe: the provider response is cached and reproduces the earlier false negative (zero mentions of CEBPE, C/EBP, baricitinib or OMIM 260570; LBR 40, NBAS 35; preflight-dr SKIP with report OMIM anchors 169400 and 614800). The report was not committed under research/ because it asserts that no causal gene exists for a disease solved in 2019 and files there are mined as curation inputs; the reproduction command and counts are recorded in the entry notes instead. Validation: just validate passed, 60/60 snippets verified with --unskip-prefix DOI, validate-terms passed, validate-disorders passed, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-title-snippets, check-snippet-length, check-snippet-grading and check-folded-hyphens all clean. All 14 phenotypes wired; no orphan pathograph targets.

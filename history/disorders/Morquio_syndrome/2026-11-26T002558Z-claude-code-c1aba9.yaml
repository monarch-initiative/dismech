  summary: 'Gene-family review: GLB1; record ClinGen tiers for both subtypes'
  details: |
    Reviewed GLB1 (and the co-resident GALNS) modelling. Both records already cited ClinGen Definitive assertions for their own subtype diseases, mucopolysaccharidosis type 4A (MONDO:0009659, Type A) and type 4B (MONDO:0009660, Type B); the tiers are now recorded in gene_disease_validity with subtype set. The Type B node binds beta-galactosidase activity (GO:0004565) as decreased and now also keratan sulfate proteoglycan catabolic process (GO:0042340) as decreased, the process the node's own description and its PMID:12559848 evidence (Morquio B mutant enzymes lose affinity for the keratan sulfate analog Gal-beta1-4GlcNAc) are about. The two advisory reference-validation errors on DOI-cited references[] findings predate this change.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. Removed 2 deep-research reference finding(s) whose statement and supporting text were only the reference title, on references cached without retrievable text; the reference entries stay.

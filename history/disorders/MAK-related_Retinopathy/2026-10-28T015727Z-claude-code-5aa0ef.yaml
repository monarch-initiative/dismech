  summary: 'Create: MAK-related_Retinopathy'
  details: |
    New entry for MAK-related retinopathy (MONDO:0700229), autosomal recessive
    non-syndromic retinitis pigmentosa caused by biallelic MAK (hgnc:6816)
    variants. Retinitis pigmentosa 62 (MONDO:0013611), MONDO's only child of
    the spectrum term, is recorded as a has_subtypes row.

    Deep research: claude_code provider
    (research/MAK-related_Retinopathy-deep-research-claude_code.md). Reference
    validation: 25/25 references resolved; 28 of 29 quotes found. The failed
    quote attributed to the review PMID:40636449 a sentence that is in
    PMID:39293864; the review is not cited. PMID:20301590 (GeneReviews
    nonsyndromic RP overview) and PMID:29655266 (C. elegans) were flagged off
    topic; neither is cited, the first because its PubMed record carries only
    a statement of purpose, the second because it is invertebrate work. Term
    validation could not complete: the recipe timed out reaching OLS for
    MedGen:481672, both during the run and on a retry with
    just validate-research-terms. No CURIE was taken from the report; every
    term was looked up in OLS4 and passed just validate. The report's own
    remark that no population prevalence figure is published is wrong: the
    full text of PMID:22110072 states the 1 in 12,000 expected frequency,
    which is quoted. PMID:23991284 and PMID:33542393 were fetched while
    screening and are not cited (USH2A iPSC paper; a NIR-FAF study with one
    MAK patient whose findings are not specific to MAK).

    GeneReviews: just check-genereviews --online reports NO_CHAPTER.

    Sources: the three 2011 discovery papers, the Stone 2011 Ashkenazi cohort
    (full text), van Huet 2015, Kimchi 2018, Bujakowska 2015 founder screen,
    the 2025 EZ outcome cohort, the 2018 OCTA/AOSLO study (full text),
    single-patient reports, the ClinGen Definitive assertion, and mechanism
    papers in Mak-null mice (Omori 2010; Ccrk-Mak/Ick 2024), zebrafish mak
    mutants (2024), the AAV5 gene-augmentation vector paper and CRISPR
    correction in patient iPSCs.

    Pathograph: MAK loss of function (molecular) -> impaired retrograde IFT
    at the ciliary tip, loss of cilium length control, opsin mislocalization,
    defective outer segment formation (cellular) -> rod then cone
    degeneration (cellular) -> outer retinal thinning (tissue) -> clinical
    phenotypes. The cilium-length node carries two REFUTE items (adult
    patient OCT; zebrafish lack axonemes) and a HUMAN_MODEL_MISMATCH
    discussion. Uncited edges carry a description saying they are inferred.
    Cystoid macular edema and bull's eye maculopathy are left unconnected
    because no source gives a mechanism.

    Conformance: photoreceptor_degeneration#Photoreceptor Gene Defect,
    #Rod Photoreceptor Apoptosis and #Secondary Cone Degeneration and Outer
    Retinal Thinning (with a note that MAK is expressed in cones, so
    non-cell-autonomy is not established); ciliopathy_dysfunction#Photoreceptor
    Connecting Cilium Degeneration. Rejected: ciliopathy_dysfunction#Basal Body
    and Transition Zone Dysfunction (MAK is a ciliary-tip kinase, not a basal
    body, transition zone or IFT structural component, and the node's Hedgehog
    and PCP branches do not apply to a non-syndromic disease);
    photoreceptor_degeneration#Photoreceptor Metabolic and Oxidative Stress
    (no MAK-specific evidence); phototransduction_cascade_dysfunction (MAK is
    not a cascade component); bbsome_trafficking (not a BBSome gene);
    retinoid_visual_cycle_disruption (RPE visual cycle).

    Validation: just validate passed; count-verified-snippets all verified;
    entity refs, causal targets, logical rules, coarse phenotypes, enum
    values, duplicate keys, block-scalar comments passed; just
    validate-disorders passed.

    Review response (optional findings). The PMID:34518651 sentence about
    paving the way for a phase 1 trial was removed from the gene-therapy
    treatment: it is a forward-looking statement, not a model-organism
    observation. The same paper's restatement of the authors' earlier Alu
    finding now carries quote_role BACKGROUND.

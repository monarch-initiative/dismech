  details: |
    Addressed automated review CHANGES_REQUESTED on PR #8804 (https://github.com/monarch-initiative/dismech/pull/8804#issuecomment-5323697718). BLOCKING fixes: 1) the Idebenone treatment's evidence item quoted PMID:40190371 about corticosteroids, not idebenone; replaced with the correct PMID:20301353 (GeneReviews) quote about EMA approval and visual benefit, kept supports: PARTIAL since the benefit is established for LHON generally rather than LDYT specifically. 2) added a top-level references: block tagging PMID:20301353 as GeneReviews (following the sibling Leber_Hereditary_Optic_Neuropathy.yaml pattern) and mined all four GR sections into the entry: clinical characteristics (movement-disorder sentence added as PARTIAL supplementary evidence on the Ataxia phenotype), management (idebenone fix above), agents-to-avoid (used to build the new environmental: block), and genetic counseling (maternal-transmission sentence added to the inheritance evidence list). IMPORTANT fixes: 3) added a diagnosis: section with two entries (targeted-then-complete mtDNA sequencing with heteroplasmy quantification across tissues, evidenced by PMID:28503604's blood/urine-sediment/buccal/fibroblast heteroplasmy data; and targeted testing for the three common LHON variants first, evidenced by PMID:36317462). 4) added an environmental: section (Tobacco Smoking, Heavy Alcohol Intake) using influences_mechanisms with environmental_effect: EXACERBATES targeting the Tissue-Selective Neuronal Bioenergetic Vulnerability pathophysiology node, evidenced by the GeneReviews agents-to-avoid sentence, honestly marked PARTIAL/extrapolated since no LDYT-specific penetrance-modifier study exists (unlike classical LHON's quantified smoking study). Applied cheap, well-evidenced SUGGESTIONS: added a biochemical: Lactate entry (readout of the Oxidative Phosphorylation Deficiency and Redox Imbalance node, evidenced by PMID:31776719's quantified venous lactate/pyruvate and PMID:14735585's basal-ganglia-lucencies-with-lactic-acidosis quote); added a prevalence: entry (CASES_IN_LITERATURE / RARE, evidenced by PMID:31776719's explicit 'is also rare' statement, with notes explaining no population-based estimate exists); added a Fatal Leigh-like Encephalomyopathy phenotype (no HP term exists for Leigh syndrome as a finding rather than a disease, so left deliberately unbound per dismech-terms guidance, evidenced by PMID:28503604's report of fatal Leigh syndrome in homoplasmic siblings) to back the claim already present in the top-level description; and two additional treatments, an Oral Dystonia Pharmacotherapy Trial entry honestly documenting non-response to L-dopa/baclofen/tizanidine (PMID:40190371) and a Visual Aids and Occupational Rehabilitation entry (GeneReviews supportive-care sentence, PARTIAL/extrapolated). Did NOT add clinical_trials: since the reviewer noted the surfaced NCT identifiers are LHON-general rather than LDYT-specific and called this genuinely optional; did not invent any new evidence to close a gap. Validated: just validate (schema+terms+references, all pass, 64/64 snippets verified), uv run python scripts/check_folded_hyphens.py (found and fixed 3 new folded-scalar hyphen splits introduced by this session's edits, then clean), just validate-disorders (batched pre-PR sweep, all pass), just check-duplicate-keys (clean). Compliance 97.6% global / 98.1% weighted.

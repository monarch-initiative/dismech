  summary: 'Create: Leber Optic Atrophy and Dystonia'
  details: |
    De-novo curation of MONDO:0010772 (LDYT, Leber's plus dystonia; OMIM:500001), resolving issue #8745. Used falcon (Edison Scientific) deep research plus independent PubMed literature search: original m.14459G>A description Jun et al 1994 PMID:8016139; confirmatory pedigrees Shoffner et al 1995 PMID:7654063; cybrid biochemistry Jun et al 1996 PMID:8622678; variable-expressivity family Gropman et al 2004 PMID:14735585; de novo cases Kurt et al 2016 PMID:28503604; Korean striatal-necrosis family Kim et al 2010 PMID:20052369; double-mutation case Berardo et al 2020 PMID:31776719; Chinese rare-mutation cohort Cui et al 2020 PMID:32045392; 2025 case report/review Thaller et al PMID:40190371; HON diagnostic-cohort context Rocatcher et al 2023 PMID:36317462; and Yu-Wai-Man et al 2009 PMID:19001017, already cached from the Leber_Hereditary_Optic_Neuropathy.yaml entry. NEC risk was high per the issue since the Leber eponym collides with Leber congenital amaurosis and LHON. Ran just preflight-dr, which returned SKIP because MONDO records no RO:0004003 causal gene for this mtDNA-encoded entity, so performed the manual OMIM/gene/synonym checks instead. MONDO:0010772 OBO record confirms xref OMIM:500001 exactly, and is_a MONDO:0010788 LHON and MONDO:0020478 Leber plus disease. Multiple independent primary-literature sources, Berardo 2020 and Thaller 2025, explicitly state Leber's hereditary optic neuropathy and dystonia LDYT OMIM 500001, confirming the OMIM match. MT-ND6 m.14459G>A is the dominant causal variant across all 9 independently fetched primary papers, matching the falcon report's own conclusion, which itself flagged and rejected TIMM8A/Mohr-Tranebjaerg syndrome as a candidate NEC confusion. Cross-referenced kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml for house style; parents set to Leber Hereditary Optic Neuropathy plus Mitochondrial Disease; description explicitly distinguishes LDYT from isolated LHON, Leber congenital amaurosis, and TIMM8A/Mohr-Tranebjaerg syndrome. Curated description, synonyms, a mitochondrial inheritance block covering heteroplasmy/homoplasmy, incomplete penetrance, and de novo occurrence; two has_subtypes entries, the primary MT-ND6 m.14459G>A variant and a grouped Other Complex I Loci subtype for ND1/ND3/ND4/second-ND6-site allelic heterogeneity; an 8-node pathophysiology chain from the mtDNA lesion through the complex I/coenzyme-Q-binding defect, oxidative phosphorylation deficiency, tissue-selective RGC/medium-spiny-neuron vulnerability, to the two parallel clinical endpoints of optic atrophy and striatal necrosis/dystonia; 14 phenotypes including dystonia, basal ganglia lesions/necrosis, dysarthria, spasticity, contractures, gait disturbance, ataxia, mild intellectual disability, optic atrophy, central scotoma, dyschromatopsia, ptosis, and short stature; a genetic block; classifications for Harrison's NEUROLOGIC and mitochondrial disease; and three treatments, idebenone, botulinum toxin, and GPi deep brain stimulation. Validated with just validate, schema plus terms plus references all pass; just count-verified-snippets, 49 of 49 verified; just validate-disorders, batched pre-PR sweep, all pass; and just check-duplicate-keys, clean. Compliance is 97.7 percent global and 98.5 percent weighted; the only gaps are datasets, none found or curated for this ultra-rare entity, consistent with the flagship LHON entry, and classifications evidence, also absent on LHON, a known repo-wide gap.

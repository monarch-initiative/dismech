  summary: 'Review: Leber_Optic_Atrophy_and_Dystonia'
  details: |
    Evidence-claim mismatch review and pathograph wiring pass, using only the existing reference cache (PubMed was unreachable). Description: replaced the claim that m.14459G>A is essentially never found in isolated Leigh syndrome (contradicted by the entry's own fatal Leigh-like phenotype and by PMID:40190371/28503604) with the narrower statement that the variant was absent from the LHON, Leigh disease and complex-dystonia groups screened early on, with rare isolated-LHON and Leigh/Leigh-like carriers reported since. Evidence repairs: Ataxia now cites the PMID:40190371 review of a heteroplasmic m.14459G>A series with juvenile truncal ataxia instead of a GeneReviews sentence about LHON movement disorders that never mentions ataxia. Mild intellectual disability: replaced a truncated 'mild mental retar' fragment with the PMID:20052369 review sentence and its Table 2 row (impaired intelligence in 10 of 23 described cases), changed frequency OCCASIONAL to FREQUENT accordingly, and regraded the cognitively intact de novo cases (PMID:28503604) from SUPPORT to REFUTE. The edge from the MT-ND6 lesion to the complex I defect now cites the cybrid 39% complex I reduction (PMID:8622678) rather than a sentence restating the amino-acid change; the RGC-degeneration to optic-atrophy edge now cites OCT retinal nerve fibre layer thinning in an LDYT patient (PMID:40190371) instead of a diagnostic-yield statistic for common LHON variants (PMID:36317462) that did not bear on the edge; the oxphos-to-selective-vulnerability snippet was extended to a full clause and marked INDIRECT. Eight explanations that argued for the retired PARTIAL grade were rewritten, with directness INDIRECT recorded where the GeneReviews/cohort evidence is LHON-general. quote_role BACKGROUND/REVIEW_SYNTHESIS added where quotes come from an introduction or literature review. Added a heteroplasmy-dependence item (ophthalmopathy 6/9 heteroplasmic vs 3/17 homoplasmic, PMID:20052369) to the tissue-selective vulnerability node. Pathograph: phenotypes causally connected rose from 2/16 to 10/16 via new evidenced edges striatal degeneration -> bilateral basal ganglia lesions, bilateral striatal necrosis, spasticity, joint contractures (PMID:14735585, 20052369); RGC degeneration -> visual loss, central scotoma (PMID:31776719, INDIRECT, LHON background); and generalized dystonia sequelae -> dysarthria (PMID:40190371) and gait disturbance (PMID:20052369). Left unconnected for lack of a mechanistic source in the cache: dyschromatopsia, ataxia, mild intellectual disability, ptosis, short stature, fatal Leigh-like encephalomyopathy. Inheritance stays bound to HP:0001427 Mitochondrial inheritance; no ClinGen CGGV record exists for this disease. Validated with just validate, validate-terms, count-verified-snippets (81/81), check-entity-refs, check-causal-targets, the global snippet gates, and validate-disorders.

  details: |
    Addressed round-2 automated review findings on PR #8804. Finding 1 (IMPORTANT): GeneReviews DIAGNOSIS/TESTING sentence was tagged but not mined; added it as PARTIAL supplementary evidence on the existing 'Targeted mtDNA Testing for the Three Common LHON Variants First' diagnosis entry. Finding 2 (IMPORTANT): fixed a dangling pathophysiology downstream target ('Optic Atrophy and Central Vision Loss') that did not match any modeled node or phenotype name, breaking the optic branch of the pathograph; retargeted to the actual phenotype name 'Optic Atrophy' so the PMID:36317462 evidence on that edge lands in the graph. Finding 3: added a new Visual Loss phenotype bound to HP:0000572, since the entry previously curated optic atrophy/central scotoma/dyschromatopsia but not vision loss itself, the presenting complaint in essentially every LDYT patient; primary evidence is PMID:40190371's direct account of acute visual loss in a genetically confirmed m.14459G>A patient, plus PARTIAL secondary evidence from PMID:32045392's cohort-level visual-acuity aggregate, deliberately without a frequency: qualifier per the reviewer's caution that DR's cohort statistics span multiple rare mtDNA variants and must not be read as m.14459G>A/LDYT-specific frequencies. Finding 4: rebound Dyschromatopsia from its parent term HP:0000551 (Color vision defect) to the more specific child term HP:0007641 (Dyschromatopsia), verified to exist and be is_a HP:0000551 via OAK. Applied cheap well-evidenced SUGGESTIONS from the same review: added a third environmental: entry for mitochondrial-toxic drug exposure using ECTO:9001785 (exposure to mitochondrial NADH:ubiquinone reductase inhibitor, a precise mechanistic fit for this complex I disease, verified via OAK ECTO search) evidenced by the GeneReviews agents-to-avoid sentence; and added a Multidisciplinary Management of Extraocular Neurologic Features treatment entry covering both the GR multidisciplinary-approach recommendation (SUPPORT, directly on point since LDYT is defined by extraocular features) and cardiology referral for EKG pre-excitation (PARTIAL, general-LHON extrapolation). Did not add a datasets: entry per the reviewer's own note that an empty result is the expected outcome for this ultra-rare mtDNA disorder. During this pass, a YAML syntax bug was introduced and caught before commit: a Python heredoc's escaped \n characters were interpreted as literal newlines when writing a multi-line evidence snippet, producing an invalid indented continuation that broke yaml.safe_load; fixed by flattening to a single-line string (whitespace normalization in the snippet matcher handles matching against the cache file's own multi-line source text, as already relied on for the round-1 idebenone fix). A second YAML bug (an unquoted 'frequency:' substring inside a plain-scalar explanation: value, parsed as a nested mapping key) was caught by the same validation pass and fixed by rewording. Validated: just validate (schema+terms+references, all pass, 71/71 snippets verified, up from 64), uv run python scripts/check_folded_hyphens.py (clean, no new splits), just count-verified-snippets (71/71), just validate-disorders (batched pre-PR sweep, pass), just check-duplicate-keys (clean).

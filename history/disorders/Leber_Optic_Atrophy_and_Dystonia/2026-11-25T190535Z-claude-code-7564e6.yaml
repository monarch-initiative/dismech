  summary: 'Gene-family review: MT-ND1, MT-ND3, MT-ND4, MT-ND6'
  details: |
    The node for the canonical MT-ND6 m.14459G>A lesion also carried MT-ND1 and MT-ND4, which tied those genes to cybrid findings (a changed coenzyme Q-binding site, 39% loss of complex I-specific activity) reported only for m.14459G>A (PMID:8622678). MT-ND1 and MT-ND4 were removed from that node, and the rare alternate loci (MT-ND1 m.3697, MT-ND3 m.10197, MT-ND4 m.11696 and the second MT-ND6 site m.14596) now sit on their own node, Rare Alternate Complex I mtDNA Missense Variants, bound to the holoenzyme activity the membrane-arm subunits contribute to (NADH dehydrogenase (ubiquinone) activity, decreased) and linked to the oxidative phosphorylation node. MT-ND1, MT-ND3 and MT-ND4 previously appeared only on the Other Complex I Loci subtype; each now has a genetic record (germline, subtype Other Complex I Loci) typed UNKNOWN, because the LDYT association rests on isolated pedigrees and no external body has graded it. Evidence: PMID:31776719, which lists the five single mtDNA variants associated with LDYT and reports a patient with MT-ND4 m.11778G>A plus MT-ND6 m.14484T>C and an LHON-plus phenotype with dystonia.

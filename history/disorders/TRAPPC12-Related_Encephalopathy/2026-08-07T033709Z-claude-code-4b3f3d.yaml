  details: |
    PR shepherd follow-up on the ai4c-reviewer CHANGES_REQUESTED review for PR #8087, addressing its three blocking items. (1) Retagged the Delayed myelination evidence from PMID:38439956 as evidence_source OTHER: the quoted sentence is that abstract's background citation of prior work, and Ma et al. 2024 reports CG4/OPC cell-culture plus Mea6/cTAGE5 conditional-knockout mouse data with no human clinical cohort of its own. The primary-source swap the reviewer suggested as the preferred fix was not available - the PMID:28777934 abstract contains no quotable white-matter or myelination sentence, so the retag was taken instead. (2) Split the over-specified HP:0000253 Progressive microcephaly into a primary HP:0000252 Microcephaly entry, which covers all three individuals of the founding cohort (congenital in two, acquired in one), plus a separate HP:0000253 entry scoped to the progressive/postnatal subset. Added PMID:32369837 evidence documenting an affected individual without microcephaly, recording the feature as typical but not obligate. (3) Added a diagnosis section with three entries - exome sequencing (NCIT:C101295), Sanger confirmation (NCIT:C15709), and brain MRI (NCIT:C16809) - each snippet-evidenced from the cached PMID:32369837 abstract. Validation: just validate passes schema, term, and reference validation, with 38/38 snippets verified against cached references, up from 32/32. No new ontology terms were introduced beyond CURIEs already present in the committed term and enum caches, so no cache churn accompanies this change.

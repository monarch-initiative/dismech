  summary: 'Create: TRAPPC12-Related Encephalopathy'
  details: |
    Created new ultra-rare disorder entry for TRAPPC12-related encephalopathy, PEBAS; MONDO:0044696, ORPHA:500144, OMIM:617669. NEC preflight via MONDO RO:0004003 confirmed the causal gene is TRAPPC12 HGNC:24284, not the phenotypically similar PRUNE1/NMIHBA. Curated a 6-node membrane-trafficking mechanism chain: TRAPPC12 loss of function to TRAPP/Rab-GEF deficiency to Golgi fragmentation and delayed ER-to-Golgi transport to oligodendrocyte maturation failure and hypomyelination to progressive brain atrophy and pontine hypoplasia to progressive encephalopathy; plus 10 ontology-bound phenotypes, autosomal-recessive inheritance, prevalence, genetics, and supportive treatments. Evidence anchored on PMID:28777934 seminal Milev 2017, PMID:32369837 Aslanger 2020 expanding phenotype, PMID:38439956 oligodendrocyte/white-matter mechanism, PMID:34018214 TRAPPIII cryo-EM/Rab1 GEF. No GeneReviews article exists. Deep research falcon in progress for phenotype-spectrum enrichment in a follow-up. Validated: schema and terms pass, 26/26 snippets verified, weighted compliance 88 percent.

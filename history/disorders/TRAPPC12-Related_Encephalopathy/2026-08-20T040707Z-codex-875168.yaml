  summary: 'Review: TRAPPC12-related encephalopathy publication readiness'
  details: |
    Completed a publication-readiness and current-literature review through
    2026-08-19. Reconfirmed the disease identity as MONDO:0044696 / OMIM:617669 /
    ORPHA:500144, with autosomal-recessive TRAPPC12 (HGNC:24284) causation, and
    retained recurrent fetal hydrocephalus as a cautiously described presentation
    within the same biallelic spectrum.

    Rebuilt the causal account as eight atomic nodes. Separated Golgi
    fragmentation from delayed ER-to-Golgi transport so wild-type rescue is
    attributed only to Golgi morphology; replaced a broad trafficking node with
    the measured reduction in COPII outer-coat assembly; grounded absent or
    reduced full-length protein in affected-person cells; and represented
    prolonged mitotic progression as a provisional patient-cell finding whose
    neural relevance is unknown. Replaced the patient phenotype claim of delayed
    myelination with the observed cerebral white-matter T2 hyperintensity and
    preserved the oligodendrocyte pathway as a human-model mismatch rather than
    an established disease mechanism.

    Expanded and semantically rechecked the clinical spectrum to 29 phenotypes,
    including infantile spasms, cerebral visual impairment, the combined
    dysphagia/reflux signal, neurogenic bladder, and the founding imaging pattern
    of extra-axial-space widening, simplified frontal gyri, callosal
    agenesis/hypoplasia, cerebellar hypoplasia, and a small optic chiasm. Cohort
    counts from three people remain counts rather than population-frequency
    enums, disjunctive table rows are PARTIAL for their individual terms, and
    optic, hearing, epilepsy, microcephaly, and fetal-hydrocephalus claims are
    explicitly bounded to the evidence actually reported.

    Curated five distinct experimental systems: founding affected-person
    fibroblasts; the single-person homozygous Phe227Val fibroblast study; a human
    TRAPPC12-deletion COPII cell-line model; rat CG4 CRISPR-knockout cells; and
    primary mouse OPC shRNA cultures. The Mea6 conditional-knockout mouse remains
    a low-fidelity interacting-pathway model, not a TRAPPC12 animal model. No
    public disease dataset, patient-derived neural model, GeneReviews chapter,
    disease-specific guideline, clinical trial, or TRAPPC12 whole-animal model
    was found; treatments therefore remain supportive extrapolations.

    Every new reference cache was generated with just fetch-reference. Final
    validation passed schema, ontology-term, reference, graph-integrity, and
    formatting checks; all 107 evidence snippets matched sanctioned caches;
    phenotype connectivity was 29/29 and causal-gene wiring 1/1; and 62 focused
    graph, QC, and snippet-audit tests passed. A separate claim-by-claim audit
    approved the exact pre-history target blob

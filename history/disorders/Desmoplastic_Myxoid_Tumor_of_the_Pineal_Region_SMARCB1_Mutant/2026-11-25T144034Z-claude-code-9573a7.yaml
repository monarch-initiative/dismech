  summary: 'Desmoplastic myxoid tumour, SMARCB1-mutant: differential diagnoses'
  details: >-
    Added a differential_diagnoses section with nine rows, each bound to MONDO and each with what
    tells it apart from DMT: atypical teratoid/rhabdoid tumour (age, behaviour and grade, with DMT's
    variable behaviour and unassigned grade; the 2020 series' three deaths, which a 2026 letter
    counts again among 12 patients, its table listing all three among the 2020 cases, with its
    suggestion that the tumour's location, rather than an intrinsic malignancy, may explain them;
    AT/RT's occurrence mostly in infants; DMT's defining absence of histological signs of
    malignancy; and the DNA methylation reading: DMT forms its own group, close to but distinct from
    AT/RT, from the 2020 series' and a 2021 case's own data, with two reviews that generated no data
    of their own differing in emphasis), poorly differentiated chordoma (age and course, against
    DMT's pooled average onset of 39 years, and the separate methylation cluster; the
    brachyury-negative DMTs are recorded in the description as an observation, since no cited source
    states the chordoma's own brachyury status), pineoblastoma (its nature and age, a median of
    about 6 years by the 2026 review, against DMT's absence in infants and young children;
    dissemination at 25 to 33% at diagnosis by a 2026 review and CSF seeding at 15% at diagnosis and
    up to 45% later by a 2022 review, against spread beyond the pineal region in three DMTs: the
    2021 case, whose CSF cells its authors could not verify as tumour, and one each in a 2026 case
    report (PMID:42467229) and a 2026 letter; and separate methylation groups), pineocytoma
    (separate methylation clusters as the distinguishing feature; its typically slow growth confined
    to the pineal region, and its WHO grade 1 against no grade defined for DMT in a 2022 review's
    table, recorded in the description as context), pineal parenchymal tumour of intermediate
    differentiation (KBTBD4 insertions, from the 2026 review, against SMARCB1 loss, from the 2022
    review's table, and separate methylation groups), papillary tumour of the pineal region
    (papillary architecture against DMT's desmoplasia and myxoid changes from its essential
    diagnostic criteria, and separate methylation groups), pineal region germinoma (sex, germ cell
    tumours being mostly in male patients while DMT shows no male predominance, with an early count
    of ten cases finding no sex difference and a 2026 letter a female-to-male ratio of 2; and the
    first biopsy without germ cell tumour in one DMT patient, beside the general statement that
    diagnosis of pineal region tumours rests ultimately on tumour markers and histology; that
    patient's normal serum and CSF tumour markers are context in the description, and the review's
    statements about germ cell tumours as a group are graded INDIRECT for germinoma), intracranial
    mesenchymal tumour, FET::CREB fusion-positive (excluded in one case by fusion testing), and
    intracranial extraskeletal myxoid chondrosarcoma (EWSR1 rearrangements, described in that
    tumour, not detected in two DMTs, as a 2026 review reports). Also, as the review of PR 18814
    suggested, a biological process on the SMARCB1 Inactivation node: GO:0006338 chromatin
    remodeling, DECREASED, beside DNA binding, as a modelling choice resting on two quoted sentences
    (PMID:35195707, PMID:39586083) that name SMARCB1 a core subunit of the SWI/SNF
    chromatin-remodelling complex and on a general statement in a 2026 review of pineal tumours,
    graded INDIRECT and evidence_source OTHER like the two subunit sentences, that loss of SMARCB1
    inactivates that complex; an OLS search of GO for 'ATP-dependent chromatin remodeling' returned
    no narrower process term, and GO:0043044, of that name, is obsolete and replaced by GO:0006338;
    its notes say why decreased rather than absent. 56 new evidence items (55 in the section, 1 on
    the node), all from sources the entry already cites (PMID:39586083, PMID:37969088,
    PMID:42058762, PMID:35954310, PMID:37284622, PMID:38527786, PMID:32901946, PMID:41259279,
    PMID:31732806, PMID:42445896, PMID:35195707, PMID:42467229); quotes already in the entry keep
    their evidence_source and quote_role, and directness is set for each claim. The entry-level
    notes no longer say the differential diagnosis is not curated. They now list, among the other
    tumours the cited sources name beside DMT that are not rows: meningioma, since a 2026 letter
    (PMID:42445896) suggests, from their similar morphology and immunophenotype, that DMT and
    metaplastic, myxoid or chordoid meningioma of the pineal region may be the same entity rather
    than two tumours to tell apart; lymphoma, which a 2022 review (PMID:35954310) lists among
    uncommon pineal region tumours and one report names in its statement that a first biopsy found
    neither a germ cell tumour nor a lymphoma, with no feature in the cited sources, beyond that
    same negative first biopsy, telling it apart from DMT; and SMARCB1-deficient tumours as a class
    beyond atypical teratoid/rhabdoid tumour and poorly differentiated chordoma. Solitary fibrous
    tumour appears in none of the cited sources. The notes' PRC2 (EZH2) clause now names the
    epigenetic imbalance (PRC2 dependency and H3K27 trimethylation) that the 2026 review states in
    general terms, and the EZH2-targeted therapy it extrapolates. A literature digest sub-agent
    listed candidate quotes; every quote was checked against its source with the reference
    validator's own normaliser. just validate, validate-terms and count-verified-snippets pass.

  summary: 'Desmoplastic myxoid tumour, SMARCB1-mutant: NCIT code, later outcomes and
    imaging'
  details: >-
    Added an NCIT code, a classification, later outcomes, imaging detail and single surgical
    cases. Mappings: NCIT:C178507 Desmoplastic Myxoid Tumor of the Pineal Region, SMARCB1-Mutant
    (exactMatch; MONDO's cross-reference and exactMatch for the entry's term, MONDO:1060253; NCIT
    places among its ancestors Central Nervous System SMARCB1/INI1-Deficient Tumor and Pineal Region
    Neoplasm). Classifications: Harrison's oncology and haematology part; its notes say no ICD-O
    morphology classification accompanies it because the cell of origin is undetermined. Onset:
    another 2024 case report's pooled demographics over the same ten earlier cases and its own
    (PMID:38527786), the citation span bridged. Outcome: the 2026 letter's table rows for its seven
    cases published after the 2020 series (PMID:42445896): four alive at 3 to 22 months and three, a
    2024 case and two further cases, without follow-up; for one 33-year-old man, the 2026 table's 3
    months and gross total resection alone, the 2022 letter's table's 12 months (PMID:35195707) and
    a 2024 table's radiotherapy and 12 months (PMID:39586083), both matched by author, age and sex,
    and the 2022 letter's text reporting a previously reported patient disease-free at 12 months
    after gross total resection and radiotherapy, which by its 12 months is very likely this man, so
    the 3 months is likely the earlier figure and the 2022 letter's table and text disagree on
    radiotherapy (the three matched items INDIRECT); the note that four of the seven are in the
    pooled outcome figures and five in the 2022 and two 2024 pooled onset figures, the 2026 letter's
    table listing all seven; the 2026 review's statement that no metastatic dissemination has been
    documented among the 7 cases described to date, quoted with its scope sentence, which by its
    figures are the 2020 series (PMID:42058762); and a 2024 report's statement that prognosis
    remains uncertain (BACKGROUND). Brain imaging: sizes from about 2 cm to 6.6 cm (PMID:37284622,
    PMID:39586083, PMID:38527786), the 24-year-old woman's tumour (2021) and its relation to the
    deep cerebral veins, CT density hypodense in two reports and hyperdense matter in the pineal
    region in one (PMID:42445896, PMID:39586083), no diffusion restriction in two, and a negative
    spinal MRI beside the atypical CSF cytology recorded on the Dissemination node; the 2026
    letter's calcification is not quoted, since the entry's notes leave calcification on imaging
    out. Surgical resection: the 24-year-old woman (2021), one of the four subtotal resections among
    the first ten, whose tumour could not be completely resected where it adhered to the deep veins
    and the pulvinar; the same 2024 patient as the row's existing item, whose complete resection was
    done with lateral ventricular puncture and drainage and was followed by relief of the
    hydrocephalus; and surgery for diagnosis and debulking without clear residual tumour in another
    2024 patient (a bridged snippet). The later case counts overlap with the pooled reviews already
    cited, as the entry's onset text says. 24 new evidence items, all from sources the entry already
    cites; NCIT cache rows for C178507. Left out: responses to chemotherapy or radiosurgery (no
    cached source reports a response to either), recorded gaps beyond the statements quoted (the
    entry already records that the cell of origin is unknown), and codes other than NCIT, which no
    cached source gives. A literature digest sub-agent listed candidate quotes, and every quote was
    checked against its source with the reference validator's own normaliser. just validate,
    validate-terms and count-verified-snippets pass.

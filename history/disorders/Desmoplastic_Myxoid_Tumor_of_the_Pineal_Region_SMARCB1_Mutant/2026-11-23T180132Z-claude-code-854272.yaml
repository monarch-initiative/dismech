  summary: 'Create: Desmoplastic Myxoid Tumor of the Pineal Region, SMARCB1-Mutant'
  details: |
    New entry for desmoplastic myxoid tumor of the pineal region, SMARCB1-mutant (MONDO:1060253), with 133 evidence items from 15 cached sources: the 2020 series of seven tumours that proposed the tumour type, a 2022 clinical-management letter with a pooled review of the first ten cases, seven case reports and one letter reporting a case (2021 to 2026), and five reviews. It records the case count as cases in the literature; onset in adolescents and adults (15 to 61 years) and the outcomes reported; three pathophysiology nodes (SMARCB1 inactivation, with DNA binding as the molecular function lost, tumour growth in the pineal region, and dissemination beyond the pineal region) with edges to four of its five phenotypes (obstructive hydrocephalus, upgaze palsy, headache, nausea and vomiting; blurred vision has no edge, because no cited text gives a cause of the blurred vision reported in this tumour, and the review's list of signs of raised intracranial pressure does not name it; the visual dysfunction that review attributes to dorsal midbrain compression is recorded by the upgaze palsy edge); six histopathology rows, two bound to NCIT stromal findings and four left unbound (the tumour cells' morphology, because NCIT's neoplastic spindle and epithelioid cell terms sit outside the finding enum and each names one of the two shapes; SMARCB1 loss and CD34 staining because NCIT's expression findings sit outside the finding enum, with no NCIT term found for EMA positivity; and the low proliferation index because NCIT's Ki-67 term names the measurement, not a low value); SMARCB1 graded a somatic driver, as a 2026 review files the alterations under somatic alterations, with no variant origin because no cited text reports germline testing; three diagnosis rows (immunohistochemistry; DNA methylation profiling, giving the 2020 series' similarity to ATRT-MYC beside a 2026 review that, summarising published analyses, describes a cluster of its own; and imaging); and six treatment rows (resection, radiotherapy, craniospinal irradiation, endoscopic third ventriculostomy, ventriculoperitoneal shunt, chemotherapy, with the four cytotoxic drugs of the one course whose drugs a cited source names bound to ChEBI and bevacizumab, a monoclonal antibody, named but left unbound because the row's single modality value records the cytotoxic drugs). Quotes describing tumours that lack a row's or node's finding, or the lesion a node records, are graded REFUTE and named in its description; quotes from which a claim follows only by inference are graded INDIRECT. No node binds a cell type, because no cell of origin has been identified. A provider research report was run for the entry and used for leads only; every quote was taken from a cached source. Pooled reviews and case reports count some patients more than once, and the entry notes say so. Validated with just validate, just validate-terms, just validate-disorders, just count-verified-snippets, just check-snippet-grading and the other whole-repo gates CI runs.

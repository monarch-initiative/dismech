  summary: Add investigational FMN riboswitch target node conforming to bacterial_riboswitch_targeting
  details: |
    Added one pathophysiology node, 'Klebsiella FMN Riboswitch-Gated Riboflavin Supply (Investigational Target)', role therapeutic_vulnerability, conforming to bacterial_riboswitch_targeting#Riboswitch-Gated Essential Gene Expression (Riboswitch Target). This is the first conformer of that module.

    The node records an organism vulnerability, not a mechanism of disease and not a treatment option. Its description says so explicitly and states the three limits that matter: the compound series is entirely preclinical with no clinical development, the evidence is in vitro susceptibility of multidrug-resistant clinical isolates rather than any patient outcome, and target-site resistance was selected in K. pneumoniae at a frequency comparable to E. coli. No treatment entry was added, because no riboswitch-targeting compound is a therapy for this disease.

    K. pneumoniae was chosen as the module's conformer because the vulnerability is genus-specific and this organism is on the reachable side of it: its FMN riboswitch aptamer is 90 percent identical to the E. coli element, against 61 percent for A. baumannii, and the compound series is active against Enterobacteriaceae but not against A. baumannii or P. aeruginosa. Three evidence items, all from PMID:32432858, cover the clinical-isolate panel, the conservation figures, and the resistance selection. Snippets and reference titles verified exact by linkml-reference-validator (31 snippets in the file, 0 issues); linkml-validate and the per-file duplicate-key, entity-ref, causal-target and qualifier-term gates pass.

    No existing node was edited and no name was renamed, so no bare-name pathograph target or entity reference in this file was disturbed.

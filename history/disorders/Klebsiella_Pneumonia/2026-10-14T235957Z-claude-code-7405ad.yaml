  details: |
    Coordinator review: this entry has three diagnosis rows, and the original rejection generalized from row 1 (MALDI-TOF species identification, where the organism is an answer value on a generic code) to the whole entry without separately assessing row 2. Row 2, Blood-culture molecular pathogen and KPC detection, is an exact match: LOINC:93395-2 (Klebsiella pneumoniae DNA [Presence] by NAA with probe detection in Positive blood culture) names both the organism and the specimen ('positive blood culture') the row is about, and LOINC:49617-4 (Carbapenem resistance blaKPC gene [Presence] by Molecular method) names the resistance gene the row names. Both confirmed by direct Monarch KG entity lookup (api-v3.monarchinitiative.org/v3/api/entity/LOINC:<code>). Row 1 (MALDI-TOF) is declined deliberately rather than bound: the only MALDI-TOF codes found (LOINC:75756-7 'Bacteria identified...', 76346-6 'Microorganism identified...') name only the broad target class, with the organism as an answer value rather than the measurement's own component -- a materially weaker claim than the genus-level bindings made elsewhere in this tranche (Mycobacterium sp, Listeria sp, Borrelia sp all at least name a genus), and this tranche is specifically pathogen-specific assays. Row 3 (MALDIxin colistin-resistance) remains unbound; no code was found for it and none was searched further this round. No cross-branch collision against any open loinc-*-batch* branch for either new code. New cache/loinc/terms.csv rows for both, confirmed absent from origin/main before seeding.

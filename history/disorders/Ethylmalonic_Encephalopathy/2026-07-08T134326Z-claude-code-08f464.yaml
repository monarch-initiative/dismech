  summary: 'Create: Ethylmalonic Encephalopathy ETHE1'
  details: |
    New disorder entry for Ethylmalonic Encephalopathy MONDO:0011229 / OMIM:602473 / ORPHA:51188; gene ETHE1 hgnc:23287, curated for metabolic package WP-002 row 1.5.1.01 sulfur-containing amino acid and hydrogen sulfide metabolism. Debundled pathograph: ETHE1 sulfur dioxygenase deficiency to H2S and thiosulfate accumulation to cytochrome c oxidase complex IV inhibition and degradation, short-chain fatty acid oxidation inhibition yielding ethylmalonic aciduria and C4/C5 acylcarnitines, microvascular endothelial toxicity yielding petechiae and orthostatic acrocyanosis, colonic H2S yielding chronic diarrhea, and neurodevelopmental regression/encephalopathy with basal ganglia lesions. Treatment metronidazole plus N-acetylcysteine and liver transplantation. Evidence from 5 PMIDs: 14732903 Tiranti 2004 gene ID; 19136963 Tiranti 2009 H2S mechanism; 20812865 Di Meo 2011 COX degradation; 20657580 Viscomi 2010 treatment; 37458841 Platt 2023 clinical review. Model-organism vs human-clinical evidence_source split applied. All 40 snippets verified as exact substrings of fetched abstracts; schema, terms, and references validation pass.

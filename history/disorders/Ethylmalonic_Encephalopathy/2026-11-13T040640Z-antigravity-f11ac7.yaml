  summary: Review and enrich Ethylmalonic Encephalopathy
  details: |
    Fetched, mined, and tagged GeneReviews chapter PMID:28933811 (NBK453432) in top-level references; added Harrisons ENDOCRINOLOGY_METABOLISM/GENETICS_ENVIRONMENT_DISEASE/NEUROLOGIC and mitochondrial disease classifications; added progression, biological_scale, metabolic_intoxication_decompensation conformances, CL/UBERON/GO bindings, and causal edges connecting all 17 phenotypes (adding Intellectual disability, Dystonia, Bilateral tonic-clonic seizure, Dysphagia, Delayed speech and language development, Inability to walk, and Vomiting, with full-denominator MRI snippet on Abnormal basal ganglia morphology); added Blood lactate biomarker with READOUT_OF link to Cytochrome c oxidase deficiency, 3 NCIT-bound diagnostic procedures, Intercurrent infectious illness environmental modifier linked via EXACERBATES to Neurodevelopmental regression and encephalopathy, and supportive/physical-therapy/dietary/CRRT treatments with target_mechanisms.

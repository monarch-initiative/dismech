  summary: 'Review round 1: remove impossible frequency bands, regrade the ClinVar
    item, add respiratory insufficiency'
  details: |
    Answered the first review round on PR 11431. Blocking finding accepted in full. Six phenotypes carried frequency VERY_RARE used to mean reported in one patient. FrequencyEnum.VERY_RARE is bound to HP:0040284 and defined as under 5 percent of patients, but the whole reported disease is three individuals, so one patient is roughly 33 percent and no phenotype in this disease can be VERY_RARE. The reviewer offered either resetting to FREQUENT or omitting the band, and preferred omission at this denominator. The bands were removed, because with three patients the smallest resolvable proportion is 33 percent and any band asserts more precision than the literature supports. The per-patient caveat already lived in each description and stays there. Lactic Acidosis at FREQUENT and the two OBLIGATE annotations were already correct and were not touched. Suggestion accepted: the ClinVar assertion evidence item was graded HUMAN_CLINICAL although the sentence restates a database classification rather than reporting a clinical observation, so it is regraded OTHER, matching how this entry already grades registration documents and ontology-edge rows, with the reasoning added to its explanation. Suggestion accepted: a Respiratory Insufficiency phenotype bound to HP:0002093 was added, citing the intubation sentence that was already quoted elsewhere in the file. It is curated separately from the presenting tachypnoea because escalation to mechanical ventilation is a materially different clinical event, and it carries no frequency band for the same reason the others no longer do. Suggestion accepted: the SCO2 differential asserted that SCO2 is a copper metallochaperone building the CuA centre, which is well established in the wider literature but is not what the cited snippet carries, since that source hedges with thought to function as a copper chaperone. The prose was softened to the source's own wording and a sentence records that the hedge is deliberate. Suggestion declined with the reason recorded in notes: one evidence sentence reports selective MTCO2 depletion in patient fibroblasts and in a skeletal muscle biopsy in one breath, mixing in-vitro and human material. It is not split, because check-snippet-grading keys on the quoted sentence so two copies in one file must carry the same grade, and both uses make the same claim about CIV-specific subunit loss rather than two separable claims. Splitting would manufacture a second claim to justify a second grade. Validation after the edits: just validate passed with 54 of 54 snippets verified, up from 53; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values clean; just validate-disorders passed as the authoritative batched gate. check-snippet-grading reports one finding, in MPI-Congenital_Disorder_of_Glycosylation.yaml, which this branch does not touch; the identical single finding reproduces with these changes stashed. just qc was not run because it exceeds the available tool timeout.

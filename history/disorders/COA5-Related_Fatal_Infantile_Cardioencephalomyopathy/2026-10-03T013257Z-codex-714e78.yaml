  details: |
    Addressed four nonblocking suggestions following independent approval of the first review head. Renamed the muscle diagnostic procedure to histochemistry/immunofluorescence, replaced the citrate-synthase marker with the actual muscle measurements, and added the muscle immunofluorescence quote. Figure 2C and the methods do mention citrate synthase, contrary to one sentence in the review, but Fig 2C describes fibroblasts, so its normalization did not belong in the muscle item. Removed the supportive-care-to-remodeling link because inotropes support function rather than directly modifying hypertrophy. Recorded the unresolved clinical consequence of supercomplex reorganization and added neonatal HCM onset with a background-role quote summarizing the founding siblings. Final validation: 73 snippets and 79 titles, targeted data and reference checks, history validation and hooks.

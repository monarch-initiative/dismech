  summary: 'Create: COA5-Related Fatal Infantile Cardioencephalomyopathy (CEMCOX3/MC4DN9)'
  details: |
    De novo curation of MONDO:0014667 (CEMCOX3 / MC4DN9), the COA5 (hgnc:33848) nuclear-type isolated complex IV deficiency, against the entire human literature for the gene: Huigsloot et al. 2011 (PMID:21457908, abstract only) and Tang et al. 2025 (PMID:39779219, PMC full text), plus Nyvltova et al. 2022 (PMID:35750769) for the metallochaperone-module role and Khalimonchuk et al. 2008 (PMID:18503002) for the yeast orthologue Pet191, cited only where the yeast/human difference is itself the point.

    Lump/split: curated as a standalone Disease. MONDO:0014667 is a gene-defined disease_series_by_gene leaf with one causal gene and no descendants; its parent MONDO:0015487 is the gene-agnostic umbrella that issue #5060 / PR #5064 decided not to curate as a Disease, redirecting content into the Mitochondrial_Complex_IV_Deficiency grouping.

    Grouping: added as a member of kb/groupings/Mitochondrial_Complex_IV_Deficiency.yaml; the evaluator reports the NECESSARY_AND_SUFFICIENT module-conformance criterion SATISFIED. Recorded in a separate history record for the grouping.

    Pathograph: four nodes conforming to complex_iv_assembly_deficiency (Complex IV Biogenesis Failure, Impaired Terminal Electron Transfer and ATP Synthesis, Lactic Acidosis and Metabolic Decompensation, High-Energy Tissue Dysfunction), with bare-name downstream targets.

    Key curation decisions. (1) No encephalopathy phenotype is curated despite the disease name: the founding abstract describes fatal neonatal cardiomyopathy, the OMIM summary describes neonatal hypertrophic cardiomyopathy, and neuroimaging was normal in the only patient with imaging reported. A KNOWLEDGE_GAP discussion records the discrepancy and cites the normal-neuroimaging sentence as REFUTE evidence. (2) penetrance and expressivity are UNKNOWN: three patients, two families, one allele, no unaffected homozygote and no genotype contrast. (3) HP:0031320 (cardiomyocyte mitochondrial proliferation), listed for this concept in MedGen, is deliberately not curated - searching every occurrence of proliferat/ultrastruct/electron microscop across all four cached references returns nothing about cardiomyocyte mitochondria. (4) The founder-allele question is an OPEN_QUESTION, not an assertion; the authors hedge and no haplotype study exists. (5) HP:0001522 (Death in infancy) is a clinical modifier and not reachable from HP:0000118, so the fatal course is carried in a progression block rather than as a phenotype.

    Deep research: claude_code provider, 3/3 references verified, 20/23 terms verified. Two report errors were caught and not curated - it proposed hgnc:24704 for COA5 (that CURIE is LARP1B; the correct one is hgnc:33848) and HP:0005633, which does not resolve (the correct septal-hypertrophy term is HP:0005144). GO:0005751 was also rejected as obsolete in favour of GO:0045277.

    Validation run to completion: just validate (schema, terms, references) passed with 53/53 snippets verified; validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-source-defect-claims all clean for this file; validate-disorders run last as the authoritative gate. Every snippet was extracted programmatically from references_cache and re-verified as an exact substring.

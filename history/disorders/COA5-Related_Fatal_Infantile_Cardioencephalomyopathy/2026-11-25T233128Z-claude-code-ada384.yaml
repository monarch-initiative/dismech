  summary: 'Gene-family review: COA5'
  details: |
    COA5 genetic record typed UNKNOWN, with a note: three children from two families, all homozygous for p.Ala53Pro (PMID:21457908, PMID:39779219), and ClinGen rates COA5 Limited (AR) only for mitochondrial disease (MONDO:0044970), so CAUSATIVE (Definitive/Strong) is not used and no tier is recorded. The COA5 node still binds no molecular function: the 2025 complexome study places COA5 between COX1 maturation and COX2 incorporation without defining a molecular activity, and GO records none.

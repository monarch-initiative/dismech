  summary: 'NF2-related schwannomatosis: four GEO datasets'
  details: |
    Added a datasets section with four human GEO records, each found by
    just discover-datasets NF2-Related_Schwannomatosis and checked by hand against its GEO
    summary for relevance to this syndrome: GSE292071, a single-cell atlas of schwannomas from
    patients with NF2-related schwannomatosis, non-NF2-related schwannomatosis or sporadic
    tumours (151 samples, PMID:40217315); GSE141801, gene-expression arrays of NF2-associated
    and sporadic vestibular schwannomas, irradiated and not (74 samples in GEO, listed under
    laboratory identifiers only; its summary describes 57 tumours; PMID:31936793); and GSE138344
    and GSE138346, the [set1] and [set2] series of an RNA-sequencing study of painful and
    non-painful schwannomas from patients with NF2 (11 and 7 samples, PMID:34053190), which GEO
    groups under the SuperSeries GSE138347; the SuperSeries is not added, since both of its
    series are. Titles, sample counts and organisms are GEO's own values, and the sample counts,
    organisms and PubMed links were checked against GEO's E-utilities summaries on 2026-11-21;
    the descriptions summarise what each GEO summary says, with the sample totals and the
    SuperSeries grouping taken from those E-utilities summaries. just verify-datasets resolved
    all four accessions and wrote the three GEO caches that were not already on main. Left out:
    GSE307286 and GSE232528, which fall under topics this curation series leaves out; GSE144601,
    which is about NF1; the mouse datasets GSE292315 and GSE61528, left for a separate PR on the
    entry's animal models; GSE167560 (ChIP of BRD4 in cell lines), GSE54934 (schwannomas and
    meningiomas whose GEO summary does not say whether any come from patients with NF2) and
    GSE315579 (a vestibular schwannoma model). Validated with just validate, verify-datasets and
    check-reference-titles.

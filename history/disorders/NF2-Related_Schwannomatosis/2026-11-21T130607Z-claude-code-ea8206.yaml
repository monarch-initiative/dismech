  summary: The 2022 diagnostic criteria item by item, the earlier criteria, and the
    criteria row corrected
  details: |
    Added a definitions section with two records. The first sets out the 2022 international
    consensus criteria criterion by criterion, in four sets: the three routes to a diagnosis,
    any one of which is enough (bilateral vestibular schwannomas; an identical NF2 pathogenic
    variant in two or more anatomically distinct NF2-related tumours; two major criteria, or one
    major and two minor); the four major criteria; the minor criteria that can count more than
    once, with the dermal-schwannoma rule as a structured condition on them; and those that
    count only once. Each set's description says how its items combine, and a criterion that is
    a finding is bound to HPO (HP:0009589, HP:0009590, HP:0033714, HP:0002858, HP:0002888,
    HP:0100008, HP:0001118, HP:0009594, HP:0100014). It also records the absence of an age limit for
    vestibular schwannomas and the reason given for it, a review's advice to rule out an LZTR1
    variant first in a unilateral vestibular schwannoma with other non-intradermal schwannomas,
    and the consensus's own expectation that the criteria will need refinement. The consensus
    paper is cached as its abstract only (a forced re-fetch returned the abstract again), so
    each criteria set is quoted from one or more of three reviews' copies of the consensus table
    and graded REVIEW_SYNTHESIS; the record's notes list where the copies differ and which
    wording the items follow.

    The second record describes the earlier criteria the 2022 set replaced (NIH 1987 and 1990,
    Manchester 1992, NNFF 1997, Baser 2011, revised Manchester 2019) and their reported
    performance, from one review, with its dates. Its notes say why the sets are described
    rather than itemised: one review's item-by-item tables are supplementary and not cached, and
    another review's cached tables are flattened and partly contradict both reviews' prose. It
    also records the older names bilateral acoustic and central neurofibromatosis; central
    neurofibromatosis, an exact synonym of MONDO:0007039 in the local MONDO build, is added to
    the synonyms.

    The criteria row's description no longer says the 2022 revision first put molecular data
    beside clinical features, since the 2011 Baser criteria and the 2019 revised Manchester
    criteria already used genetic testing, and the row now quotes the Baser criteria's molecular
    route and mosaic definition for that; one explanation no longer says the earlier criteria
    did not cover mosaic disease. The row's old notes said the criteria table was not
    transcribed because quoting it row by row would transcribe a copyrighted scheme. Other
    entries record diagnostic criteria item by item in definitions records, with evidence from
    the sources that state them, and the repository's related rules cover the items of
    LOINC-coded instruments, quotation from Harrison's textbook and the fair-use limits that
    apply to signed full-text excerpts, none of which applies to quotes from the cached
    open-access reviews, so this record follows them, naming each criterion briefly, in the
    table's own terms where those are short, and quoting each criteria set from one or two of
    the reviews' copies. The row's notes add that the review dating the criteria to 2023 gives
    2022 in its abstract as the year the disease was delineated as a schwannomatosis. The row
    also quotes one review on the weight the 2022 revision gave to genetic criteria, and another
    on the 2019 revision's molecular criteria.

    Validated with just validate, just validate-terms and just count-verified-snippets.
    Criteria-item terms are not checked by the term validator; HP:0009590 and HP:0033714 were
    looked up in HPO through OLS, and the other seven are in the committed HP label cache with the
    labels used. HP:0033714 Multiple meningiomas, a child of HP:0002858 Meningioma, binds the
    major criterion of two or more meningiomas, so that it and the single-meningioma minor
    criterion carry different terms.

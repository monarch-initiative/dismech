  summary: 'NF2-related schwannomatosis: tumour angiogenesis, bevacizumab outcomes
    and two trial records'
  details: |
    Added a pathophysiology node, Tumour Angiogenesis (angiogenesis GO:0001525, increased;
    blood vessel endothelial cell CL:0000071; tissue scale), with edges from
    Schwannoma Formation and to Tumour Mass Effect on the Eighth Nerve, beside the existing
    direct edge between those two nodes. Its four items come from the 2009 bevacizumab series
    and are all graded INDIRECT: VEGF in every vestibular schwannoma examined, with VEGFR-2
    on 32% of tumour vessels, which the authors call reduced expression; the tumour cells'
    VEGF and neuropilin pattern similar to normal nerve, so the data show presence rather
    than overexpression; and more and wider vessels than normal nerve, from which new-vessel
    formation is inferred. Both new edges are INDIRECT_UNKNOWN_INTERMEDIATES and their items
    INDIRECT. The edge from Schwannoma Formation records the semaphorin route that a
    cell-line and mouse study proposes from merlin loss, the semaphorin loss the 2009 tissue
    series found, and the 2009 authors' caveat that VEGF signalling may be more complex in
    schwannomas; no cited source tests the route in human tumours. The edge to the mass
    effect notes that a fall in volume of 20% or more at some point came in under half of
    target tumours in the two prospective trials (14% in the first when the fall had to hold)
    but in six of ten patients in the 2009 series, where nine of ten tumours shrank.
    Bevacizumab gains a link to the new node with ten items: in culture it had no notable
    effect on signalling in the murine Nf2-null cells, and neither cell line expressed
    VEGFR-1 or VEGFR-2, from which the authors suggest it acts on the endothelium in their
    mouse models, where it was given to mice carrying the human HEI193 line; in the mice it
    narrowed the vessels and lowered their permeability, leaving the number of vessels
    unchanged in the cranial model and lowering vessel density in the sciatic-nerve model; in
    patients the evidence is mainly imaging, including DCE-MRI in one patient; and the 2009
    series and the 2016 trial both suggest that hearing improves partly through reduced
    oedema. The existing link from Bevacizumab to the mass effect now says the drug is taken
    to act on the tumour's vasculature. The Bevacizumab row gains 29 items: the second
    meta-analysis (14 studies; radiographic response 30%, hearing response 32%); the hearing
    and tumour responses of the 2016 and 2019 phase II trials, with the 2016 trial's response
    definitions, its Table 2 row for hearing, its confirmed tumour response (14%), and the
    absence of a significant correlation between hearing and tumour response in both trials;
    the 2019 trial's post hoc comparison of pediatric participants (under 21) and adults
    (P = .08 for hearing and P = .05 for tumour response) and a 17-child multicentre series;
    durability off drug (the 2016 trial; a single-centre cohort; England's national cohort,
    where breaks of three months or more were associated with growth; and the child series,
    where seven of eight patients had tumour progression or worse hearing on cessation of
    treatment); the same trial's open-label maintenance phase (reported in 2023), including
    more progression in pediatric participants in a post hoc analysis; and toxicity (the UK
    cohort and what predicted hypertension in it, a single-institution cohort with its
    definitions and its finding that cumulative dose went with blood pressure but not
    proteinuria, the maintenance trial's comparison with a meta-analysis, menstrual
    irregularity, and toxicity as the usual reason for stopping in one cohort, with its
    counts). Its description now gives these figures, separating a confirmed hearing response
    from any improvement, and its notes no longer say benefit is not maintained after
    stopping, which the 2016 trial contradicts; they give the durability findings, the
    maintenance result and what each study relates the hypertension rate to instead. A new
    clinical_trials section records NCT01767792 and NCT01207687, each with its registry
    record quoted; just clinicaltrials-status-audit confirms both as phase II and completed
    on ClinicalTrials.gov. The two published phases of NCT01767792 are cited; the published
    trial whose schedule matches NCT01207687 gives no registry number of its own in its
    cached text, so the two are not linked. Of the 16 references fetched, the 12 now cited
    are committed and four uncited ones were removed. Validated with just validate,
    validate-terms, count-verified-snippets, check-snippet-grading, check-causal-targets,
    check-entity-refs, check-name-collisions and check-logical-rules.

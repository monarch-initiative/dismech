  summary: 'NF2-related schwannomatosis: conformance to the germline two-hit module'
  details: |
    Declared conforms_to on the two lesion nodes so that the entry meets the NECESSARY criterion
    of kb/groupings/Two-Hit_Tumor_Suppressor_Cancer_Predisposition_Syndromes.yaml, which this
    change adds it to: Germline NF2 Inactivation conforms to
    germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation,
    and Somatic Loss of the Remaining NF2 Allele to
    germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele.
    The entry already models the germline first hit and the somatic second hit as these two
    nodes with an edge between them, which is the module's own first edge, so no node was added.
    That edge's description had applied a figure for schwannomas in general, biallelic NF2 loss
    in about 60% of patients with schwannomas, to this syndrome and concluded that the second
    hit is usual rather than universal, and it said the cited sources stated the two-hit
    requirement, which neither of the edge's quotes did. The description now gives that
    requirement from a review of this syndrome, quoted in a new item (PMID:38897938, a sentence
    the entry already cites on the meningioma edge), says that no cited source shows the second
    hit in a tumour of this syndrome or reports how often it is found, and calls the 60% figure
    a statement about schwannomas in general. The PMID:32960816 item carrying that figure is
    graded INDIRECT, and its explanation now says the figure comes from the background of a
    mouse study, where it is given as a caveat; the PMID:38967126 item's explanation now keeps
    to its quote. just check-conformance-content reports process_absent for both links: the
    first-hit module node binds negative regulation of cell population proliferation and the
    second-hit node mitotic recombination, while both entry nodes bind
    GO:0035591 signaling adaptor activity, a molecular function, and no biological process.
    Validated with just validate and just validate-grouping-batch, whose strict audit reports
    the entry as satisfying the grouping's criterion.

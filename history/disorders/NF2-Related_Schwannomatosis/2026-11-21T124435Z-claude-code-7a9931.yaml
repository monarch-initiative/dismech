  summary: 'The mosaic form in depth: a subtype row, transmission, testing and the
    grouping'
  details: |
    Curated the mosaic form of NF2-related schwannomatosis from five sources the entry already
    cites, all cached: PMID:41160189, PMID:38897938 and PMID:39786185 (full text), and
    PMID:20301380 and PMID:31425178 (abstracts). No new reference was added.

    has_subtypes: a new row, Mosaic NF2-SWN, bound to MONDO:0859764 mosaic NF2-related
    schwannomatosis, with eleven evidence items: what the form is (a variant arising after
    conception and carried by a small proportion of cells) and how often it is found among
    patients with a unilateral against a bilateral vestibular schwannoma (roughly 60% against
    33%); the two routes to the diagnosis under the 2022 criteria (with the clinical features,
    an allele fraction clearly below 50% in blood or saliva, or, when no variant is found there,
    a variant shared by two or more anatomically unrelated tumours), from a review's account of
    the testing algorithm rather than from the criteria table; the milder, asymmetrical or
    segmental presentation and its limit; the later onset; the best overall course on average,
    shared with missense variants, and the caveat that a severe course still occurs; and the
    share of living patients in a UK study (45%), which is the row's subtype_frequency. MONDO
    release 2026-09-01 places the term under MONDO:0859008, not under this entry's
    MONDO:0007039, and lists full NF2 and nonmosaic NF2-related schwannomatosis among
    MONDO:0007039's exact synonyms; the row's review_notes say why the row is kept here.

    inheritance (Mosaic block): four items - the current estimate that close to 60% of de novo
    cases are mosaic once tumours are tested, the reason transmission is less likely (no
    germ-cell variant in some patients), the more severe disease of a child who inherits the
    variant, and that a mosaic proband has no affected parent. The description now states each
    of these. Beyond GeneReviews' upper bound of less than 50%, no cached source states a
    numeric transmission risk; the Manchester protocol's estimates are not in its cached
    abstract.

    genetic: the notes said GERMLINE_AND_SOMATIC was not chosen because two classes of patient
    exist; they now say the value covers both the somatic second hit and the post-zygotic first
    hit of mosaic patients. pathophysiology: the germline node's description now says that it,
    like its variant_origin GERMLINE, describes the constitutional form, and points to the
    subtype and the Mosaic block for mosaic patients. diagnosis: the tumour-testing row's
    description said blood testing misses most mosaic patients, which no snippet stated; it now
    gives the cited sensitivities (as few as 37% of sporadic cases against about 95% in later
    generations) and the need for methods that detect low-level mosaicism, with three items.
    treatments: two treatment-edge descriptions no longer say the first NF2 hit is in every
    cell. review_notes: the last paragraph, which said Neurofibromatosis.yaml still needed a
    curated_in pointer to this entry, is deleted; that file now has the pointer. notes: the
    scope sentence now names the germline or post-zygotic first hit. review_notes: the list of
    preserved source typos adds th UK, and the subtype row's own review_notes say that the KGX
    export states a subclass edge that MONDO does not assert.

    The entry is also added to kb/groupings/Somatic_Mosaic_Disorders.yaml, which has its own
    history record for this change. The stub stubs/Mosaic_NF2-related_Schwannomatosis.yaml,
    which nominated MONDO:0859764 as a disease without coverage, is deleted: the concept is
    curated here as a subtype of this entry.

    Left out: sentences in the cited reviews that name a chromosome region or a copy-number
    change. Validated with just validate, just validate-terms (which added MONDO:0859764 to the
    label and enum caches) and just count-verified-snippets.

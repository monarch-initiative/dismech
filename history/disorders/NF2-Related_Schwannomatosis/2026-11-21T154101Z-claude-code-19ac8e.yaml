  summary: 'NF2-related schwannomatosis: five differential diagnoses'
  details: |
    Added a differential_diagnoses section with five rows, each bound to MONDO
    and carrying its distinguishing features and its own evidence, 35 items in
    all, from sources that are already cached and, apart from the GeneReviews
    chapter on LZTR1- and SMARCB1-related schwannomatosis and a study and a
    systematic review of sporadic vestibular schwannomas (PMID:28710469 and
    PMID:34464224), already cited by the entry. LZTR1-related schwannomatosis
    (MONDO:0014299): multiple non-intradermal schwannomas; it can include a
    unilateral vestibular schwannoma, and early reports found carriers who met
    the older Manchester criteria for NF2-related schwannomatosis; bilateral
    vestibular schwannomas exclude it; one review gives the absence of other
    NF2-related tumours and eye findings as what distinguishes the non-NF2
    schwannomatoses as a group, graded INDIRECT for each form, though intradermal
    schwannomas have been documented in LZTR1 carriers; and one review advises
    ruling out an LZTR1 variant first in a unilateral vestibular schwannoma with
    other non-intradermal schwannomas. SMARCB1-related schwannomatosis
    (MONDO:0024517): the absence of vestibular schwannomas in one review's
    comparison table, meningiomas with an incidence of 5%, beside the review's
    lifetime risk approaching 80% for NF2-related schwannomatosis, and an
    increased propensity of its schwannomas to malignant transformation, which
    the review's comparison table sets against rare malignancy in
    NF2-related schwannomatosis, where it may be seen with radiation treatment,
    especially in childhood. Sporadic vestibular schwannoma (MONDO:0001569,
    acoustic neuroma, since the searches found no MONDO term for the sporadic
    tumour): unilateral; later onset, with NF2-related tumours starting in the
    third decade on average and one study giving the fourth to sixth decades for
    most sporadic vestibular schwannomas and a systematic review the highest
    incidence at age 70 and over, beside the two reviews' figures for sporadic
    schwannomas generally and for vestibular schwannoma patients as a whole; and
    the low yield of blood testing in isolated bilateral tumours after age 70,
    which the consensus still counts as possible NF2-related schwannomatosis. The
    sporadic row's notes record the searches of the local MONDO build that found
    no term for the sporadic tumour. Familial multiple meningioma
    (MONDO:0016995): the absence of schwannomas, the genetic associations of
    multiple meningiomas without schwannomas that a gene panel can test, and the
    caution that NF2-related schwannomatosis can present with meningiomas years
    before its vestibular schwannomas. Its notes say that the review's list of
    associations concerns multiple meningiomas without schwannomas in general and
    the Finnish figures individual patients with multiple tumours whose kinds the
    review does not give, with nothing on affected relatives, so both items are
    graded INDIRECT for this row, as are the other quotes in the section stated
    for a wider group: the sixth decade for sporadic schwannomas generally, the
    share of unilateral tumours and of bilateral disease and the age at
    presentation among vestibular schwannomas as a whole, and the GeneReviews
    chapter's two sentences on LZTR1- and SMARCB1-related schwannomatosis
    together, the first of them quoted in both rows. Neurofibromatosis type 1
    (MONDO:0018975): neurofibromas, few cafe-au-lait macules, in 1% to 2% of
    NF2-related schwannomatosis in one review, which does not say how many
    macules its figure counts, and, as another recounts, stressed as scarce by
    earlier reports in families with bilateral vestibular schwannomas, subtler
    skin findings, and vestibular schwannoma not a feature of NF1. The
    GeneReviews chapter PMID:29517885 is added at the head of references with the
    GeneReviews tag. validate-terms added MONDO:0016995 to the label cache and
    three of the five terms to the disease-term enum cache. Left out: sentences
    in the cited sources that name a chromosome region or a copy-number change;
    any claim that meningiomas occur, or do not occur, only in one of the LZTR1-
    and SMARCB1-related forms, since a cached source the entry does not cite
    disagrees with the cited ones; and prior radiation as a cause of multiple
    meningiomas, which falls outside the bound term. Validated with just
    validate, validate-terms, count-verified-snippets, check-snippet-grading and
    check-genereviews --strict.

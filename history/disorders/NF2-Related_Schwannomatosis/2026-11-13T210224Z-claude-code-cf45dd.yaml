  summary: 'Create: NF2-Related Schwannomatosis'
  details: >-
    New entry for NF2-related schwannomatosis (MONDO:0007039), curated by hand from twenty publications
    and one ClinGen gene-disease validity record. References cached for the literature digest but
    not quoted are not committed. There is no stub to delete.


    The name follows the 2022 international consensus, which retired neurofibromatosis type 2
    because this syndrome produces schwannomas and not neurofibromas, so the old name named the
    wrong tumour. MONDO has already updated its own label to match, which is what the disease_term
    binds; the retired names are kept as synonyms. A preparation note written before this entry
    recorded MONDO's label as the old one, read from a local build; the binding here is read from
    the term cache instead.


    The chain is germline NF2 inactivation, a somatic second hit, loss of merlin-dependent
    restraint, YAP and TAZ activation, schwannoma formation, and mass effect on the eighth nerve.
    Seven of ten phenotypes hang off it. The three that do not - the cataract, the retinal hamartoma
    and the neuropathy - are left unconnected on purpose, because no cited source says what produces
    them and an edge from the merlin node to a lens opacity would assert a mechanism nothing here
    supports.


    The mechanism below merlin is contested rather than unknown, and that is a CONTROVERSY
    discussion rather than a smoothed-over summary. One cited full-text paper shows merlin binding
    LATS and recruiting it to the plasma membrane, in flies and in mammalian cells, and calls that
    an evolutionarily conserved function. Another states the question as open and concludes that
    merlin acts largely if not exclusively in the nucleus, by repressing a ubiquitin ligase that
    inhibits LATS there - and says so against the membrane model by name. A third cites both as
    parallel routes without deciding. The entry's edge from merlin loss to YAP activation is
    INDIRECT_KNOWN_INTERMEDIATES for exactly that reason: the intermediates are known and their
    order is not.


    Two further discussions. A KNOWLEDGE_GAP on cell-type specificity, which is the question the entry's own chain cannot answer:
    one NF2 allele is inactivated in every cell, so every lineage is one somatic event from losing
    merlin, yet the tumours are Schwann, arachnoid and ependymal, and the cited review says the
    mechanism in those cell types, while sparing others, remains unclear. And a HUMAN_MODEL_MISMATCH carrying two specific caveats stated
    by the papers that use the models - the human schwannoma line most of this literature runs on
    retains partial merlin function, which its own users say may make it a poor model for most
    patient tumours, and the mouse that establishes the Hippo arm genetically produces a tumour
    syndrome its authors say is beyond the scope of human schwannomatosis. A third mismatch sits
    inside that mouse work: deleting YAP alone did not impair schwannoma growth, which is why this
    entry's node is YAP and TAZ rather than YAP.


    Mosaicism is a second inheritance block rather than a footnote. A large minority of patients are
    mosaic - about sixty per cent of de novo cases on the current estimate - their disease is
    milder, later and more asymmetrical, and their transmission risk is below the dominant one. A
    diagnosis row records what follows practically: blood testing misses most of them, two
    anatomically distinct tumours have to be tested, and at least nine per cent of schwannomatosis
    diagnoses are mosaic NF2-related schwannomatosis.


    Three quantities in this entry move with ascertainment rather than with the disease, and the
    entry says so where it gives them: the diagnostic point prevalence went from 1 in 200,000 in
    1992 to 1 in 50,500 in 2018 in the same region; the mosaic proportion rose as sequencing
    improved; and survival has improved since 1990 for reasons the reviews attribute to specialist
    centres and bevacizumab.


    Two things are recorded and not settled. kb/disorders/Schwannomatosis.yaml is bound to
    MONDO:0008075, which MONDO's current release makes the parent of this entry's term, but that
    entry is written as the non-NF2 disease; the two will then make incompatible claims about what
    the parent class covers, and the fix is that curator's to choose. And Neurofibromatosis.yaml
    carries an NF2 subtype row whose description says the entity is uncurated as a standalone entry,
    which becomes false on merge and needs a curated_in pointer in a separate PR.


    Several source typographical errors are preserved inside snippets rather than corrected, because
    a snippet is a quotation: intrasmedullary for intramedullary, "as many of 60%", and a sentence
    that runs two statements together without a full stop. Several snippets stop before a citation
    bracket or bridge one with an ellipsis, because the reference validator strips a bracketed span
    and requires the text either side of it to match the source exactly.


    Two adversarial verification passes ran before the push, split by axis, each given the entry and its sources but not the reasoning behind them. Between them they found five claims that every automated gate accepted. Four were negative-existence statements the sources or the ontologies refute: the entry said HPO had no ependymoma and no bilateral vestibular schwannoma term when it has both, said NCIT's clinical-action tree had no term for deciding not to act when NCIT:C25598 Observation Activity sits inside it and a sibling entry already uses it, and said no ClinGen assertion for this pair was cached when ClinGen has graded it Definitive against this entry's own MONDO term. The fifth said no cited source measured how often the second hit occurs, which a cited paper does, at about 60% of patients' schwannomas. All five are repaired, the three ontology terms rebound, the ClinGen tier recorded as a gene_disease_validity block, and the GeneReviews chapter that UNTAGGED_CHAPTER named is now cited for the phenotype baseline and tagged.


    Also corrected: a prevalence band an order of magnitude out against its own rate, a VERY_FREQUENT frequency band on hearing impairment that no cited source supports, a stated source count of thirty-seven against an actual nineteen, two mouse results graded DIRECT for an edge neither quote names, a protocol paper's own data graded REVIEW_SYNTHESIS, a Drosophila-and-mammalian result graded IN_VITRO, a preferred_term broader than the term it was bound to, and three explanations claiming more than their quotes said.


    Validation: just validate passes with 93 snippets and 94 titles verified and no issues; just list-disconnected-phenotypes reports 7 of 10 connected; the yamlfix hook is a no-op.

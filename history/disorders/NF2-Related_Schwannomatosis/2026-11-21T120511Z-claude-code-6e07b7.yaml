  summary: 'NF2-related schwannomatosis: the Orphanet ORPHA:637 record, mappings and
    classifications'
  details: |
    Transcribes Orphanet's record ORPHA:637, Full NF2-related schwannomatosis (the non-mosaic
    form), into the entry: its 47-row phenotype table and its four epidemiology rows. It also
    adds mappings, from MONDO's cross-references, and Harrison's classifications read from
    Orphanet's definition.

    Eight of the table's rows match existing phenotypes and now carry Orphanet's row as evidence.
    Orphanet's class sets the band on two that had none, sensorineural hearing impairment (frequent)
    and retinal hamartoma (occasional), whose descriptions and explanations say where the band comes
    from. Two rows keep their own reading against Orphanet's: bilateral vestibular schwannoma stays
    very frequent, from the cited reviews (vestibular schwannomas in 95%, typically bilateral, and
    bilateral tumours in almost all by age 30), and tinnitus carries no band, since a review of this
    syndrome names it among the most frequent manifestations where Orphanet classes it occasional.
    The bilateral row's description now gives the 95% to vestibular schwannomas generally, and the
    tinnitus edge's explanation defers to the tinnitus row on why it has no band. The vertigo edge's
    description said the cited review attributes balance disturbance to larger tumours rather than
    to the vestibular nerve's involvement, which the review does not say; it now gives the review's
    own reading, likely secondary to the bilateral vestibular schwannomas. The cutaneous schwannoma
    row, which named intradermal schwannoma but bound the generic HP:0100008 Schwannoma (an ancestor
    of the bilateral vestibular schwannoma term, with a lower band), now binds HP:0009593 Peripheral
    schwannoma, and Orphanet's peripheral schwannoma row is merged into it; an OLS search of HPO
    found no term for intradermal, cutaneous or dermal schwannoma.

    The other 39 rows are added as phenotypes with Orphanet's row as their only source, and
    their descriptions say the table is for the full, non-mosaic form. Each carries its
    frequency class except three broader rows: glioma, neoplasm of the skin and somatic sensory
    dysfunction carry no band, because a narrower finding that HPO places under them is classed
    higher in the same table, or a cited source gives a higher figure. Abnormality of the eye is
    a coarse term and carries SOURCE_UNSPECIFIED, and the postural instability and unsteady gait
    rows say why a review's broader phrase balance dysfunction does not override their class.
    The review notes say the 39 rows are not wired, because Orphanet gives a frequency class and
    not a mechanism, and name the ones that sources the entry already cites could connect. The
    entry's notes now count Orphanet's and ClinGen's records among the cited sources.

    The four epidemiology rows, each in the 1 to 9 per 100,000 band, are added as prevalence
    records for Europe, Finland and the United Kingdom (point prevalence and prevalence at
    birth), with the band as low and high rates and no point value. The Europe row's notes
    explain its PMID:2012 source token as the repository's prevalence source audit flags it, a
    suspected year left for a person to resolve, and its snippet stops before that token. The
    United Kingdom rows say that the study Orphanet cites draws on Manchester-region registers
    and is cited by the entry directly. The existing pooled worldwide birth-prevalence record
    now carries its range as low and high rates instead of a midpoint.

    New mappings record MONDO's cross-references to ICD-10-CM Q85.02, ICD-11 Foundation 14808714 and
    NCIT:C3274, each of which MONDO marks as an equivalence. OMIM:101000 is not added: the mappings
    block takes only OMIM phenotypic series, and the individual OMIM record belongs in
    external_assertions, which this change does not touch. Harrison's classifications are three
    parts, neurologic disorders, oncology and hematology, and genes, the environment, and disease,
    each read from Orphanet's definition and graded INDIRECT. The ICD-10-CM and NCIT hierarchy
    caches gain the ancestor paths of the two new codes, from just build-hierarchy-cache. Validated
    with just validate, validate-terms, count-verified-snippets and check-coarse-phenotypes.

  summary: Correct Yaws independent-audit overstatements
  details: |
    Independent audit corrected evidence-scope and conformance overstatements. Four PMC citations now use the canonical url:https:// identity that matches the tool-generated cache. The cartilage claim is limited to later-stage involvement, with destructive bone disease retained separately. The resistance chain now ends at five localized active-yaws treatment failures without assigning them to secondary stage or generalizing them to community-wide re-emergence. Ribosomal Target Resistance conformance now includes role adaptive_escape and GO:0046677, alongside the existing translation-to-resistance edge. The 1.2-million-unit BPG dose is explicitly limited to participants aged 10-15 years in the cited Ghana trial. This append-only record corrects the preceding REVIEW record overstatements that cartilage destruction had direct evidence and that module conformance was complete. The curation loop passed schema validation, 102/105 cache-backed snippet checks with the same three configured DOI-prefix skips, and ontology-term validation.

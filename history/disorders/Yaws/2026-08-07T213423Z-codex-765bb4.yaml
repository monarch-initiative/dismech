  summary: Final Yaws evidence audit fixes
  details: |
    Corrected benzathine benzylpenicillin mapping to CHEBI:51352 and limited generic beta-lactam transpeptidation to partial class-level evidence. Added primary papilloma, specific secondary osteoarticular phenotypes, and late destructive bone/cartilage phenotypes with pathograph edges. Scoped resistance and trial prevalence claims, added PMID:29428183 and PMID:34986286 evidence for localized clinical failure, A2059G, re-emergence, repeated MDA, latent surveillance, and antimicrobial-resistance monitoring. Reclassified natural NHP observations as MODEL_ORGANISM evidence for infection and potential reservoir status only, with spillover unproven. Replaced title-like mined findings with factual claims.

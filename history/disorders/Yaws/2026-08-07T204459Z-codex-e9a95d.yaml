  summary: 'Review: Yaws completeness and evidence alignment'
  details: |
    Audited the Yaws entry against its Falcon deep-research report and citation
    sidecar. The completeness checklist found the original entry under-consumed:
    it contained the infectious agent, contact transmission, one antibiotic
    target, one phenotype, and azithromycin, but omitted the central clinical
    stages, disseminated and destructive disease, bone involvement, diagnostic
    workflow and ulcer differentials, benzathine penicillin, macrolide resistance,
    and the nonhuman-primate reservoir caveat.

    Expanded those central themes using exact, cache-backed PubMed abstract
    snippets. Removed the unsupported FREQUENT qualifier from skin ulcer because
    the cited sentence established association but not a quantitative frequency.
    Converted seven DOI-only deep-research findings to their PubMed identifiers
    so their snippets are checked, and repaired the whitespace-corrupted TPE
    causation quote exposed by that conversion. The two remaining DOI findings
    are medRxiv reports without PubMed identifiers and remain explicit skipped-
    prefix items.

    Claim-level review kept the reservoir wording narrower than zoonotic
    transmission: the study demonstrates naturally infected nonhuman primates
    with genomically indistinguishable TPE, while explicitly reporting that
    evidence for current spillover is missing. Host-immune/cytokine mechanisms
    suggested only inferentially by the research report were not added. No human
    genetic section or experimental-model section was warranted for this
    infectious disease, and the research surfaced no clinical trial identifiers.

    The exact batched pre-PR command used by CI, `just validate-disorders
    kb/disorders/Yaws.yaml`, passed schema, authoritative ontology-term, and
    no-full-text reference validation. Its cache audit verified 42 of 44 snippets;
    the only two skipped items were the explicitly retained medRxiv DOI findings.

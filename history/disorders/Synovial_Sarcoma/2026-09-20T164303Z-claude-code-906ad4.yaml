  summary: 'Genetics pass: bind SS18, SSX1, SSX2 and SSX4 for the t(X;18) fusion'
  details: |
    Genetics pass for issue 12206. The genetic block had two records, neither carrying a gene_term, so no gene edge was exportable and gene-to-mechanism wiring was 0/2. Added four SOMATIC_DRIVER records with variant_origin SOMATIC - SS18 (hgnc:11340, the 5-prime partner, formerly SYT), SSX1 (hgnc:11335), SSX2 (hgnc:11336) and SSX4 (hgnc:11338) - each evidenced by the entry's already-cached PMID:15208645 sentence naming all four partners. Bound the same four as genes: descriptors on the SS18-SSX Fusion Oncogene node; wiring now 4/6, the two unwired records being the generic fusion record and Low Mutational Burden, neither of which is a single-gene assertion. Also replaced an unsourced prose figure: the fusion notes claimed approximately 65 percent SS18-SSX1 and 35 percent SS18-SSX2 with no citation, and now quote the largest series (PMID:11782370, 147 of 243 tumours at 61 percent and 91 at 37 percent) with a new evidence item, and state that no series reports an SSX4 frequency. Checked and corrected a gene identity before binding: SSX4 is hgnc:11338, not hgnc:11339 which is SSX5 - verified against the HGNC REST API. MONDO reconciliation: SSX1 was absent and is now present.

  summary: 'Review round 1: Sulfide_Quinone_Oxidoreductase_Deficiency'
  details: |
    Addressed the automated review on PR 13700 in one push. Blocking item: added seven phenotypes reported in the cached full text of PMID:32160317 and wired each causally into the existing graph: Tonic seizures (HP:0032792) and Neurostorming from Leigh-like Brain Injury; Multiorgan failure, Hepatic failure (HP:0001399), Shock (HP:0031273) and Elevated creatine kinase (HP:0003236) from Lactate Overproduction and Metabolic Decompensation; Elevated brain lactate by MRS (HP:0012707) from Impaired Terminal Electron Transfer and ATP Synthesis. Every CURIE was looked up in OLS rather than copied from the review table. Neurostorming and Multiorgan failure are left unbound with the HP searches recorded in the descriptor description: no HP term exists for paroxysmal sympathetic hyperactivity or for multiorgan failure, and the only autonomic hit (HP:0012332) is a coarse organ-system term. No frequencies were added. The full-text snippets were confirmed by both count-verified-snippets and validate-disorders. Optional suggestions, all taken: (1) added the full-text sentences that both family B children are homozygous for c.446delT and that two siblings remained asymptomatic as direct incomplete-penetrance evidence; (2) added an environmental entry for intercurrent infection and fasting, EXACERBATES Hydrogen Sulfide Accumulation, with entry-level evidence and an INDIRECT link citing the authors' catabolism hypothesis; exposure_term left unbound because the only ECTO fasting term (ECTO:2000118) denotes a deliberate fasting intervention and ECTO infection terms are pathogen-specific; (3) marked the PMID:34035265 item on the H2S-to-brain edge directness INDIRECT and rewrote its explanation to state that the model is hypoxic brain injury, not Leigh-like disease. Phenotype count rose from 7 to 14, all causally connected. Validated with validate, validate-terms, count-verified-snippets (85/85), entity-ref, causal-target, duplicate-key, qualifier-term and gene-activity-grounding checks, the whole-KB gates and the batched validate-disorders.

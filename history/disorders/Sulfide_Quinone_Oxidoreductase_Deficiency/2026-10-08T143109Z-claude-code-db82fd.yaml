  summary: 'Create: Sulfide_Quinone_Oxidoreductase_Deficiency'
  details: |
    Curated de novo for claim issue #13688 (work-package #5557, disorders of sulfur-containing amino acid and H2S metabolism). Autosomal recessive SQOR (hgnc:20390, previously SQRDL) deficiency: loss of the first mitochondrial step of H2S oxidation, with intermittent H2S accumulation inhibiting cytochrome c oxidase (complex IV), producing episodic Leigh-like encephalopathy and lactic acidosis with isolated functional complex IV deficiency (normal complex IV assembly). Pathograph is a connected chain SQOR deficiency -> H2S accumulation -> complex IV inhibition -> impaired OXPHOS -> lactate overproduction and Leigh-like brain injury, with two complex-IV/lactate nodes conforming to the complex_iv_assembly_deficiency module (Biogenesis Failure node deliberately not used because assembly is normal). Cross-referenced against the existing Ethylmalonic_Encephalopathy (ETHE1) entry, which is the downstream pathway sibling; curated it as a differential and did NOT copy the ETHE1 biochemical signature (ethylmalonic aciduria, thiosulfate, petechiae) because SQOR case reports do not show it. An OpenScientist deep-research report was used (research/Sulfide_Quinone_Oxidoreductase_Deficiency-deep-research-openscientist.md); its validation block reported reference_validation 7/7 verified, 0 not_found, confabulation_rate 0.0, and term_validation 39/42 resolved with needs_review true for two mislabelled HP terms (HP:0032263 given as Multiorgan failure but is Increased blood pressure; HP:0012719 given as Neurostorming/dysautonomia but is Functional abnormality of the GI tract); neither of those two terms was bound. preflight-dr returned PASS (SQOR mentioned 58 times, OMIM 619221 matches). Primary clinical source is PMID:32160317 (Friederich 2020, two families, three symptomatic children); PMID:36306676 (sulfur-metabolite study) supports incomplete penetrance and the ETHE1 distinction; PMID:38870029 (SqorDeltaN/DeltaN mouse) and PMID:40526718 (gut-epithelium-specific knockout) are the animal models; PMID:26318450 (enzyme kinetics) and PMID:39719173 (review) support the molecular steps. PMID:38870029 and PMID:39719173 were found via PubMed rather than the report. Report citations PMID:40563372 (an ETHE1 mtUPR paper) and PMID:41638445 (Schistosoma SQOR enzymology) were dropped as not about this disease/gene mechanism. No ClinGen validity record exists for SQOR against MONDO:0030982 (ClinGen rates SQOR against the broader Leigh syndrome MONDO:0009723 as Limited, a different pair), so gene_disease_validity is left absent with a note. No GeneReviews chapter (offline check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (67/67), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse/snippet/title/folded/reference-title/environmental/snippet-grading/retired-support/case-collision/enum-value/delivery-system/gene-activity-grounding gates, and the batched just validate-disorders (passed). list-disconnected-phenotypes reports all 7 phenotypes causally connected.

  summary: 'Gene-family review: MYC (with ODC1 and OTC)'
  details: |
    Bound DNA-binding transcription factor activity, RNA polymerase II-specific, modifier INCREASED, on 'MYC Protein Accumulation'. The 'Ornithine Transcarbamylase Suppression' node carried ODC1 beside OTC, although the tumour raises ornithine decarboxylase and lowers ornithine transcarbamylase (PMID:36788919). ODC1 now has its own node, 'Ornithine Decarboxylase Upregulation', binding ornithine decarboxylase activity INCREASED with the tumour-tissue expression evidence; the MYC edge now points at it, and it points on to the OTC node, using the source's own sentence that OTC dysfunction was suggested to result from c-Myc-induced ODC activity. The OTC node now carries only OTC and binds ornithine carbamoyltransferase activity DECREASED. Requested by the lysosomal/polyamine family review and checked against the cached source.

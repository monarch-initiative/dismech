    WHY THIS DISEASE EARNED ITS OWN ENTRY
    The promotion argument is the entry's spine and is evidenced rather than
    asserted. Whole-genome sequencing of ten tumours found the mutations,
    pathways and structural variants distinct from hepatocellular carcinoma and
    concluded it is "a distinct carcinoma". The driver is absent from 25
    conventional HCCs, 25 cholangiocarcinomas, 25 adenomas and 5 hepatoblastomas
    tested alongside it. The patient population does not overlap. And the
    treatment path diverges: surgery is the only modality with a measurable
    effect.

    THE CAUSAL CHAIN
    13 nodes, no orphans. A ~400 kb chromosome 19 deletion fuses DNAJB1 to
    PRKACA; the chimera is expressed ~10-fold over wild-type PRKACA and raises
    cAMP-stimulated PKA activity with unchanged Km, so the excess is abundance
    rather than altered catalysis. From there the chain forks into four
    evidenced arms -- an acquired Hsp70/AKAP-Lbc scaffolding function feeding
    ERK-biased MAPK signalling, SIK inactivation releasing CRTC2-p300
    transcription, an AURKA/GSK3 route to MYC protein, and Wnt/beta-catenin
    cooperation -- converging on hepatocyte transformation.

    The node that carries the most weight is the neomorphic claim. Overexpressing
    wild-type PRKACA does not reproduce the fusion's oncogenic activity, and the
    fusion recruits Hsp70, which wild-type PKA cannot. Together those make this a
    structurally novel kinase rather than simply more PKA, and the entry says so
    on the evidence rather than by assertion.

    A separate arm reaches hyperammonemic encephalopathy: raised AURKA and c-MYC
    drive ornithine decarboxylase up and ornithine transcarbamylase down, so the
    tumour phenocopies a urea cycle disorder in a patient whose non-tumour liver
    is working. The source frames the c-Myc-to-ODC step as a proposal, and the
    edge evidence quotes it as a proposal rather than upgrading it.

    TWO NEGATIVE FINDINGS CURATED AS NEGATIVES
    - Normal alpha-fetoprotein is bound to HP:0006254, which names *elevated*
      AFP, with supports: REFUTE. The discriminating observation in this disease
      is that the value is normal; grading the evidence REFUTE against the term
      records that, where omitting the phenotype would lose it and grading it
      SUPPORT would invert it.
    - Cytotoxic chemotherapy carries a REFUTE item. It is given to roughly half
      of SEER patients and does not affect outcome. A treatment that does not
      work is worth curating as such.

    JUDGMENT CALLS
    - The parent's has_subtypes row was kept, not deleted, and rewritten to point
      at the new entry. Deleting it would assert the WHO-5 separation more
      strongly but leaves a reader at Hepatocellular_Carcinoma with no signal
      that the entity exists.
    - `parents` follows MONDO (hepatocellular carcinoma) even though the curated
      evidence argues for separation. The disagreement is recorded as an
      INTERPRETATION discussion rather than resolved unilaterally: this entry
      should not silently re-parent a MONDO term.
    - Two survival figures are kept apart. SEER gives 32.9% five-year
      cause-specific across all stages; a 2024 review gives under 10% five-year
      overall in advanced disease. Different populations, different endpoints;
      curated as separate progression phases with the populations stated.
    - The lamellar stroma -- the feature the disease is named for -- is curated
      with an INDIRECT_UNKNOWN_INTERMEDIATES edge and no evidence, because the
      TGF-beta route in the literature is correlative. A KNOWLEDGE_GAP records
      this rather than the edge implying more than is known.


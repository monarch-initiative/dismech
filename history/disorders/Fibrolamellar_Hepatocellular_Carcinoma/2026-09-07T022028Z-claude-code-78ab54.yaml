  summary: 'Review round 1: address six IMPORTANT findings on PR #11281'
  details: |
    Review round on PR #11281 (ai4c-reviewer, CHANGES_REQUESTED, six IMPORTANT
    findings and seven suggestions). All six blocking findings addressed plus every
    suggestion that could be grounded in a fetched, exact-quote-verifiable source.
    Bundled into a single push because `main` has `dismiss_stale_reviews` enabled.

    Finding 1 - AURKA (hgnc:11393) was bound to `Acquired Hsp70 Scaffolding
    Function`, a node about the J-domain/Hsp70/AKAP-Lbc complex. Verified against
    the file and moved to the Aurora node created by the finding-4 split.

    Finding 2 - the PMID:33370777 evidence quoted the abstract's opening background
    sentence, which mentions neither Hsp70 nor scaffolding. Replaced with a measured
    result ("The J-domain also alters several biochemical properties of the RIIbeta
    holoenzyme: It is easier to activate with cAMP, and the cooperativity is
    reduced.") and regraded COMPUTATIONAL -> IN_VITRO. The regrade was checked
    against the cache frontmatter, whose MeSH terms include Cryoelectron Microscopy,
    Scattering Small Angle, and X-Ray Diffraction alongside Molecular Dynamics
    Simulation; molecular dynamics is one component of a wet-lab structural paper.

    Finding 3 - the PMID:28923495 histopathology snippet ended mid-word and its
    explanation claimed the cached abstract truncates there. It does not. Verified
    with an encoding-safe read (plain grep reports the file as binary), extended the
    snippet to the sentence end, and deleted the false claim. This is a prose claim
    about repository state that the cache contradicts - the same defect class that
    recurred four times in the Blastic_Plasmacytoid_Dendritic_Cell_Neoplasm review.

    Finding 4 - split both bundled nodes:
      SIK Inactivation and CRTC2-p300 Transcriptional Reprogramming
        -> SIK Inactivation -> CRTC2-p300 Transcriptional Reprogramming
      AURKA-GSK3 Signalling and MYC Protein Accumulation
        -> AURKA-GSK3 Sub-Network Activation -> MYC Protein Accumulation
    Each new node carries its own evidence and the connecting edge carries the
    sentence that establishes the ordering. Upstream edges out of `Elevated
    cAMP-Stimulated PKA Activity` were retargeted. Pathograph re-audited: 15 nodes,
    no unresolved targets, no orphans.

    Finding 5 - added `clinical_trials:` with NCT04248569 (the vaccine trial),
    NCT02234986, NCT04380545, NCT06620302, each with its registry record cached and
    a quoted snippet. Trial registration documents are graded OTHER, since a
    registration is not itself study evidence.

    Finding 6 - added the 2025 Nature Medicine phase 1 of the fusion-neoantigen
    peptide vaccine (PMID:41286513, four evidence items covering rationale, T-cell
    endpoint, disease control, and grade 3 toxicity), liver transplantation
    (PMID:41178855 pooled series plus PMID:29633928 as a single illustrative case),
    and regional lymph node sampling. Also added three `conforms_to` bindings to
    `sustaining_proliferative_signaling` - Oncogenic Growth-Signal Lesion,
    Constitutive Mitogenic Pathway Activation, Growth-Factor-Independent
    Proliferation - which reproduce the module's own two-edge chain with FLC-specific
    substitutions in between.

    Two places the review's framing was not followed, both because the source says
    otherwise:
    - Lymphadenectomy. The research report claimed nodal dissection improves
      survival. PMID:35398630 finds the opposite - LN sampling carried no
      independent survival benefit - while also finding that this histology
      independently predicts node positivity. Curated as two items on one treatment,
      a SUPPORT for the staging rationale and a REFUTE for the survival claim.
    - Imaging frequencies. The report gave central scar >80% and calcification
      33-68%. Neither cited source says that: PMID:29948061 reports 73% (24/33) and
      88% (21/24) within a scar, and PMID:41178855 reports 65-70% and 40-68%. Both
      are curated with their own populations rather than merged.

    Suggestions taken: fusion specificity caveat (PMID:31676785, curated as a REFUTE
    item on the fusion-detection diagnosis rather than as prose, so the claim carries
    evidence); phenotypes jaundice HP:0000952, abdominal distension HP:0003270 and
    gynecomastia HP:0000771 - added without frequency tags, because the source gives
    qualitative framing only and the report's ~20%/~44% figures trace to nothing
    fetched; imaging and CK7/CD68 diagnostics; focal nodular hyperplasia
    differential; a recurrence-after-resection progression phase; a `biochemical:`
    record for serum unsaturated vitamin B12 binding capacity (PMID:6288165);
    patient-derived organoids (PMID:35803261) and the zebrafish model (PMID:32102783),
    the latter with two typed `divergences`.

    Not done: no `conforms_to` on `Lamellar Fibrous Stroma Formation`. The
    `fibrotic_response` module chain begins with tissue injury and inflammatory
    recruitment, and this entry's own knowledge-gap discussion records that the route
    from transformed hepatocyte to lamellar collagen is not established. Declaring
    conformance would assert a chain the entry says it cannot support. There is also
    no cancer "deregulated transcription" module to bind the CRTC2-p300 node to;
    `epigenetic_alterations` is an aging-hallmark module and does not fit.

    Validation: `just validate` clean, 83/83 snippets verified, term validation
    passed, entity refs / causal targets / duplicate keys / enum values / qualifier
    terms all OK, pathograph re-audited. Every `reference_title` was derived
    programmatically from `references_cache` frontmatter rather than typed.

  summary: Add MCOPCB13 (MONDO:0975809) as the IHH-Enhancer-MCOPCB13 subtype
  details: |
    Curated microphthalmia/coloboma 13 (MONDO:0975809, OMIM 620968) after deciding it is a subtype of this entry rather than a new Disease entry. The stub named NHEJ1 (hgnc:25737) as the causal gene; the primary report (PMID:37580330, Wormser et al. 2023, npj Genomic Medicine, PMC full text) states the homozygous founder allele NM_024782.2:c.588+18131A>G is not predicted to affect NHEJ1 and lies inside 'i8', a conserved enhancer of the neighbouring gene IHH (hgnc:5956, verified against the HGNC REST API and cache/hgnc/terms.csv; the deep-research report offered HGNC:5384 for IHH, which is wrong and was not used). Recorded IHH as the causal gene with NHEJ1 as the host gene of the affected region, using the noncoding-variant-impact pattern: Variant.gene NHEJ1, regulatory_target_gene IHH, variant_type single nucleotide variant, genomic_contexts intron, regulatory_category mLOE, functional_effects regulatory_element_type ENHANCER, and affected_regions 'IHH enhancer i8' with within_gene NHEJ1. Added two pathophysiology nodes joining the existing 'Failure of optic fissure closure' and 'Disrupted optic-cup and globe morphogenesis' nodes, three subtype-scoped phenotypes from Table 1 of PMID:37580330, one animal model (canine Collie eye anomaly, PMID:17916641) carrying REFUTE evidence for its own limitations (PMID:26732749, PMID:28702949), and a HUMAN_MODEL_MISMATCH discussion recording that every step from variant to reduced IHH output rests on mouse and chicken assays with no human tissue measurement and no second unrelated family. Checked ClinGen directly by downloading the live gene-validity CSV on 2026-09-24: NHEJ1 has one assertion (Cernunnos-XLF deficiency, MONDO:0012650, AR, Definitive) and IHH has none, so no ClinGen assertion covers this phenotype; cited the NHEJ1 row as supports NO_EVIDENCE. Deep research: falcon requested, returned HTTP 402 (out of credits), claude_code produced the report under fallback; preflight-dr returned WARN because IHH is mentioned more often than NHEJ1, which is the expected signal for this disease rather than a wrong-disease report. Report reference validation 10/10 resolved, 0 off topic; term validation flagged UBERON:0000384 as non-existent and UBERON:0001789/UBERON:0001786 as mislabelled, none of which were bound. Validated under linkml-reference-validator 0.3.0rc1 in a dedicated venv: just validate (58/58 snippets, 36 titles, 0 issues), count-verified-snippets, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-case-collisions, pytest tests/test_data.py -k Microphthalmia, and validate-disorders.

  summary: 'Review round 1: MCOPCB13 subtype fixes'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #12704, all within the IHH-Enhancer-MCOPCB13 subtype content. The Collie eye anomaly animal-model link was retargeted from 'IHH i8 enhancer disruption' to 'Failure of optic fissure closure': the canine 7.8 kb deletion removes enhancer i9, not the i8 element carrying the human variant, so the dog reports on the morphogenetic outcome rather than on i8 activity. model_scale moved MOLECULAR -> TISSUE to match what the canine eye examination observes. The i9-vs-i8 divergence was retyped SPECIES_MISMATCH -> CAUSE_UNREPRESENTED (the MCOPCB13 allele is not encoded in the model) and a separate SPECIES_MISMATCH divergence added for the canine-vs-human differences in fundus anatomy and phenotype distribution. The animal model's genes: IHH binding was removed, because the link's own limitations state that IHH has not been shown to be the canine target; the IHH connection survives in the model description, where it is attributed to the human report's liftover. The PMID:37580330 evidence item on that link was regraded HUMAN_CLINICAL -> COMPUTATIONAL (it quotes a UCSC-browser liftover of the canine deletion onto hg19) and its snippet extended so the quote itself names the i9 element. A downstream edge was added from 'Failure of optic fissure closure' to the 'Optic disc coloboma' phenotype, which had been left disconnected from the pathograph. A subtype-scoped Strabismus phenotype (HP:0000486) was added on the reviewer's suggestion, with two verified Table 1 snippets covering the 2 of 8 tabulated individuals. High myopia and Nystagmus were deliberately left unconnected, since no source states their mechanism.

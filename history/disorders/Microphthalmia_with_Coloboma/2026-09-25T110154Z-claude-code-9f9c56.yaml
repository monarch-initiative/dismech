  summary: 'Genetics pass: curate MCOPCB7/9/10/11 and bind every gene record into
    the pathograph'
  details: |
    Genetics pass for issue 12247 (d2g series-040). This entry is not one of the
    three parents the issue names, but it is the declared home of the numbered
    MCOPCB coloboma series, and five of the nine genes in the issue's
    Isolated_Anophthalmia-Microphthalmia_Syndrome checklist belong here rather than
    on that parent. Enumerated the twelve hierarchical descendants of MONDO:0000170
    through OLS4 and curated the gene-bearing ones.

    Added gene-bound has_subtypes rows with their own evidence and matching genetic
    records for MCOPCB7 (MONDO:0013783, ABCB6, OMIM:614497), MCOPCB9
    (MONDO:0014059, TENM3, OMIM:615145) and MCOPCB10 (MONDO:0014635, RBP4,
    OMIM:616428), and bound MONDO:0958239 (MCOPCB11, OMIM:620731) with FZD5 on the
    pre-existing FZD5-Coloboma row, which previously carried neither a MONDO term
    nor a gene nor evidence.

    The larger change is gene reach into the pathograph. Before this pass only IHH
    reached a pathophysiology node; the other seven gene records were list entries
    the causal graph could not see. Bound ABCB6 on "Failure of optic fissure
    closure"; SOX2, OTX2, PAX6, MAB21L2, FOXE3, TENM3 and ALDH1A3 on "Disrupted
    optic-cup and globe morphogenesis"; RBP4 on "Retinoic acid signaling
    disruption"; FZD5 on "Wnt/FZD5 signaling disruption"; and MAB21L2 with OTX2 on
    "Non-coding regulatory variant pathogenesis". Each binding is backed by an
    evidence item on the node itself naming the gene, added where the node did not
    already carry one. All seven pre-existing gene records also gained subtype
    foreign keys to their has_subtypes rows.

    Two of the curated relationships are weak and are labelled rather than asserted.
    ClinGen rates ABCB6 for MCOPCB7 Limited (General Inborn Errors of Metabolism
    expert panel, 2024-04-26), quoted from the newly built CGGV record. TENM3 rests
    on one consanguineous pedigree and has no ClinGen assertion under either its
    current symbol or ODZ3.

    MCOPCB5 (MONDO:0012709, SHH) was deliberately not duplicated here: the KB
    already anchors that term as a skos:closeMatch on SHH_Holoprosencephaly_Spectrum,
    whose Microform HPE subtype covers microphthalmia with coloboma as the mild end
    of the SHH spectrum, and the report OMIM indexes for the locus describes iris
    and uveoretinal colobomas without microphthalmia. The remaining six descendants
    carry no causal gene edge in MONDO.

    RBP4's recessive phenotype, in which serum RBP4 is undetectable and the result
    is a progressive retinal dystrophy rather than a malformation, stays in
    Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect; the note on the
    new row says so.

    Every CURIE, HGNC symbol and OMIM number was read from a live OLS4 or HGNC REST
    lookup in the same step it was written. Every new snippet was checked against
    the cited paper's PubMed abstract, not only the cached body.

  summary: Link ocular teratogen exposures into the pathograph
  details: |
    Backfill for issue #8085. Retinoid pathway teratogens are TRIGGERS/DIRECT into the 'Retinoic acid signaling disruption' node, the one case in this tranche where the exposure acts on precisely the pathway a node names, so no intermediate is needed. Thalidomide and other ocular teratogens is a heterogeneous entry grouping gestational infection and maternal vitamin A deficiency alongside drug teratogens, so it is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the optic fissure closure node: the common feature is raised risk of closure failure, not a shared mechanism. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged. PR review found the retinoid link's citation did not mention retinoids at all: PMID:39296666 supports only a generic claim that some medications alter eye morphogenesis, which cannot carry a TRIGGERS and DIRECT grading onto a node named for retinoic acid signalling. The link now cites PMID:3162101, the Lammer New England Journal of Medicine retinoic acid embryopathy cohort, quoting the malformation pattern that includes retinal or optic-nerve abnormalities; isotretinoin is a retinoic acid analogue acting as a receptor ligand, so DIRECT is carried by the evidence. That reference was fetched with just fetch-reference and its cache file is committed. The same review noted the original snippet was truncated mid-phrase, so both occurrences, including the pre-existing entry-level item, were completed to read 'during embryonic development'. Re-validated: 35 of 35 snippets verified.

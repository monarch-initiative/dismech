  summary: Cross-reference the MAB21L2 syndromic oculo-skeletal entry
  details: |
    Group-15 review side-effect. The MAB21L2-MAC subtype description now points at Colobomatous_Microphthalmia-Rhizomelic_Dysplasia_Syndrome, the syndromic oculo-skeletal disorder caused by the recurrent p.Arg51Cys allele and listed in ISDS Nosology 2023 group 15, and states that this entry stays scoped to the isolated MAC presentation and so carries no ISDS assignment. The point of the edit is to stop a later curator assigning a skeletal-nosology group to a non-syndromic eye entry on the strength of a shared gene. No mechanism or evidence content changed.

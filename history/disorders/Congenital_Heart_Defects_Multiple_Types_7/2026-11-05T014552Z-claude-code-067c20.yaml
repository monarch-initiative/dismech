  summary: 'Create: Congenital_Heart_Defects_Multiple_Types_7'
  details: |
    New entry for the FLT4-defined disease (MONDO:0032913, OMIM:618780), curated from an OpenScientist deep-research report treated as leads. just preflight-dr returned PASS (FLT4 named 81 times; OMIM 618780 matches MONDO). The report's reference validation resolved 24/24 citations with two flagged off topic (PMID:27443814 secondhand smoke and PMID:22745786 VEGFR3-PI3K lymphangiogenesis); neither is cited. Its term validation flagged HP:0001656 and HP:0010449 as nonexistent and HP:0010316 as Ebstein anomaly rather than absent pulmonary valve; none of these is used, and absent pulmonary valve is bound to HP:0005134 after an OLS search. Added sources beyond the report: the ClinGen Definitive record for this pair (CGGV assertion 03e5cbf0, which also supplies the pulmonary-atresia phenotype and the mouse summary) and Jin et al. 2017 (PMID:28991257), the first FLT4 series, for incomplete penetrance and phenotype. Scope is kept to FLT4: general tetralogy of Fallot prognosis, post-repair sequelae, and general congenital heart disease environmental risk factors from the report were not curated, because none is shown for FLT4 carriers and the Tetralogy_of_Fallot entry covers them; the one treatment (surgical repair) is explicitly cited from general tetralogy data. Name kept as the MONDO label, since no established gene-related name exists (MONDO has no exact synonyms; no GeneReviews chapter); CHTD7 added as a synonym. Validation: just validate, count-verified-snippets 39/39, validate-terms, the per-file whole-repo gates, and validate-disorders.

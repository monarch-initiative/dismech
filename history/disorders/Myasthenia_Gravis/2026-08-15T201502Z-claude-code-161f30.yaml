  summary: Cite 3 of 4 evidence-free environmental exposures and narrow two notes,
    issue 8296 tranche 5
  details: |
    Three of the four environmental exposures cited; one left deliberately uncited.

    Infections: PMID:9153452 quantifies infection as the leading identified precipitant
    of myasthenic crisis at 38 percent of episodes, and PMID:29372387 supports both
    trigger and exacerbation while recording the negative finding that no specific
    pathogen has been established. The note now carries that negative finding, which is
    the reason the entry is not narrowed to a named organism.

    Medications: the prior note named aminoglycosides and beta-blockers. Both are
    long-standing clinical convention, but no source was found whose abstract states
    either association directly. Rather than cite something approximately relevant, the
    note now leads with the agent class that IS evidenced -- fluoroquinolones, via
    PMID:21879778, an FDA adverse-event-reporting analysis of 37 cases. The rechallenge
    finding was quoted in preference to the raw case count, because recurrence on
    reintroduction is what distinguishes a drug effect from coincident deterioration in
    a relapsing disease. A review_notes entry records that dropping the two named drug
    classes is an evidence gap and not a judgement that the association is wrong, and
    that they should be reinstated when a citable source is found.

    Stress: left deliberately uncited after targeted searches returned nothing whose
    abstract states the claim. The breadcrumb also records a relevant contrary datum --
    the crisis-precipitant series cited on the Infections entry attributes 30 percent of
    episodes to no obvious cause rather than to stress.

    Pregnancy: PMID:42127347, a population study of 176 pregnancies, sharpens "variable
    effects on disease course" into a direction. Gestation itself was not associated
    with more MG hospitalization; the postpartum period carried roughly a fivefold
    increase in prolonged admissions, sustained across the first year.

    Validation: just validate, just count-verified-snippets, the batched
    just validate-disorders sweep, just check-title-snippets.

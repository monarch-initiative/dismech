  summary: 'Create: Neurooculocardiogenitourinary_Syndrome'
  details: |
    New entry for NOCGUS (MONDO:0032850, WDR37), curated from the founding reports (PMID:31327510, PMID:31327508), later case series and reports (PMID:32530092, PMID:34642815, PMID:38044197, PMID:42546896), PACS-axis reviews (PMID:33369122, PMID:37064331, PMID:42794636, PMID:40869285), model and structural studies (PMID:33630350, PMID:39031646, PMID:41279321), ClinGen CGGV (Definitive AD) and ORPHA:684305. The OpenScientist report was used as a lead only. Its two unsupported quotes were re-checked: the PMID:41279321 and PMID:39031646 quotes elided text with an ellipsis, so they were not verbatim; the entry quotes the sentences whole from the cached abstract. The report's claim that N-terminal variant proteins are expressed at reduced levels was not taken: Reis 2019 reports similar levels; reduced levels apply to the C-terminal cluster (Sorokina 2021). PMID:36077045 (PACS1 review) and the livestock GWAS papers were not cited as they do not concern NOCGUS. Variant mechanism left open (CONTROVERSY discussion) because ClinGen (dominant negative), Orphanet (loss of function) and Sorokina 2021 (not established) disagree. N- and C-terminal clusters lumped as one disease, no subtypes. No treatments section: no management source found. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), entity-ref, causal-target, coarse-phenotype, name-collision, enum, duplicate-key, gene-activity-grounding and GeneReviews checks, and the batched validate-disorders gate, run on the file. WDR37 molecular function bound as protein homodimerization activity (the only activity shown, Sorokina 2021) without a modifier.

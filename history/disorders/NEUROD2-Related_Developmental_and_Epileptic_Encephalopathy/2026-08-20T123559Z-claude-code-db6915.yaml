  summary: 'Create: NEUROD2-Related DEE (DEE72)'
  details: |
    New entry for DEE72 (MONDO:0032710, OMIM 618374, NEUROD2 hgnc:7763), curated from a claude_code deep-research run. NEC preflight PASS: NEUROD2 at 48 mentions and OMIM 618374 matching the MONDO xref exactly, with no needs_review flag on the report. All ontology terms proposed by the report verified correct against OAK, which is the first time in this series that has happened. Two bindings I introduced myself were wrong and were corrected: NCIT:C15734 is Prevention of Gastric Cancer rather than vagus nerve stimulation, and no NCIT term for implanted vagus nerve stimulation exists, so that descriptor is deliberately left unbound with an NTR note rather than bound to NCIT:C203750 Transcutaneous Auricular Vagus Nerve Stimulation, which is a different and non-implanted modality. A nomenclature hazard originating in the published literature rather than in the research tool was found and resolved. The Xenopus laevis CRISPR paper, PMID:38788202, repeatedly designates this disorder DEE75. That number belongs to a different disease: DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2. NEUROD2 is DEE72, confirmed by the OMIM xref and the EIEE72 exact synonym on MONDO:0032710. The paper is cited for its findings, which concern NEUROD2 and are sound, but its DEE number is not carried into the entry, and both genetic.notes and the top-level notes record the discrepancy so a future curator does not correct DEE72 to DEE75 on its authority. Two snippets initially failed verification and were fixed against the cached text rather than guessed at: one because the cache renders TGF-beta with a Greek beta, and one because it quoted the paper's title, which was replaced with the abstract sentence reporting the measured EEG response. Five references cited, four with full text mined beyond the abstract. The entry curates developmental delay rather than seizures as the constant feature, because a reported carrier has developmental delay without epilepsy, and carries two HUMAN_MODEL_MISMATCH discussions: the blood-brain-barrier arm rests entirely on tadpole data despite pointing at an approved drug, and the principal in vivo model is lissencephalic and unlayered while the proposed human mechanism runs through inside-out radial migration into a six-layered cortex. Validation: just validate passed with 29 of 29 snippets verified; validate-terms, check-duplicate-keys, check_folded_hyphens, check_environmental_evidence, check-title-snippets and check_snippet_length all pass.

  details: |
    Addresses both CRITICAL findings, both IMPORTANT findings and both suggestions in the ai4c-reviewer CHANGES_REQUESTED review of PR #9093. The review's diagnosis was correct: PMID:34188164 was cited three times, all as MODEL_ORGANISM, and its eleven-patient human cohort was entirely unconsumed.

    CRITICAL 1 - core phenotypes. Added autistic behavior (HP:0000729), intellectual disability (HP:0001249), delayed speech and language development (HP:0000750) as the three core features named by the cohort paper, plus ADHD (HP:0007018) at FREQUENT from the counted 5/7. The three core features are banded VERY_FREQUENT rather than OBLIGATE deliberately: the source names them core but gives no per-patient count for them, while it does count the two features it calls non-fully-penetrant. Claiming OBLIGATE would assert a count the source withholds.

    CRITICAL 2 - human cohort unconsumed. PMID:34188164 now carries HUMAN_CLINICAL evidence in the phenotypes, the genetic section and the prevalence record, alongside its existing MODEL_ORGANISM use. The seizure phenotype gained a FREQUENT band from the counted 3/7 and a PARTIAL evidence item recording that the source classes epilepsy as non-fully-penetrant.

    IMPORTANT 1 - genetic section. Added the bHLH clustering with named residues: p.Glu130Gln, p.Met134Thr and p.Arg129Trp in the conserved DNA-binding basic region of the first helix, p.Leu163Pro in the second helix, and p.Glu130Gln recurrent across families. Added the haploinsufficiency evidence.

    The review asked that haploinsufficiency be reconciled with the entry's hypomorphic framing rather than leaving both live. They are not competing claims and the notes now say so: haploinsufficiency is a statement about gene DOSAGE in mouse (one wild-type copy is insufficient), hypomorphism is a statement about the patient ALLELE (partial residual activity in a neuron-induction assay). A haploinsufficient gene carrying a partially active allele is the expected architecture for a dominant disorder. What is NOT established by any available source is dominant-negative action against the wild-type copy, and the note says that too.

    IMPORTANT 2 - mouse models. Added two. The Neurod2 KO/HET constitutive model covers three nodes: cortical over-migration and lamination (RECAPITULATES, HIGH, with a genotype-matched heterozygote readout), layer 5 intrinsic excitability (RECAPITULATES, HIGH), and spontaneous seizures (PARTIALLY_RECAPITULATES, MODERATE - the source says 'occasionally' and gives no count, so the readout and both evidence items are PARTIAL). The Emx1-IRES-Cre conditional knockout is curated as PERTURBS rather than RECAPITULATES because what it contributes is causal attribution to forebrain excitatory neurons, not phenotype reproduction.

    SUGGESTIONS. Added a CASES_IN_LITERATURE prevalence record. Added a second terminal pathophysiology node, Neurodevelopmental Syndrome with Autistic Features, fed by the migration/lamination node in parallel with the hyperexcitability arm - the review was right that a pathograph terminating only in Seizures states this disorder backwards when epilepsy is present in 3 of 7 patients.

    Validation: just validate passed, snippets 50/50 verified (was 29/29); just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean. No new references were needed - every addition came from PMID:34188164, already committed in this PR.

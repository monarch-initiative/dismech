  summary: 'Review: Asbestosis publication readiness'
  details: |
    Independent publication-readiness review completed against literature current through 2026-08-05 and all available deep-research/cached evidence. Corrected claim polarity and source typing, made mechanistic claims atomic, added biological scales and evidence-backed pathograph edges, refined ontology terms, and added structured epidemiology, natural history/prognosis, diagnostics, differentials, pirfenidone evidence, trial metadata, experimental models, and limitations.

    D2P recommendations were explicitly dispositioned as follows. Accepted and implemented: interstitial lung disease morphology received direct evidence; dyspnea was refined to exertional dyspnea; crackles and digital clubbing were refined to exact HPO terms with evidence; decreased DLCO, reduced FVC, and respiratory failure were added with evidence; and defensible pathograph links were added for pulmonary fibrosis, interstitial morphology, exertional dyspnea, inspiratory crackles, restrictive ventilatory defect, decreased DLCO, reduced FVC, and respiratory failure. Removed: nonproductive cough, because the available cited cohort recorded a symptom questionnaire but did not supply an exact disease-manifestation claim. Rejected or deferred for lack of exact disease-specific evidence, excessive nonspecificity, or comorbidity ambiguity: abnormal sputum, atelectasis, chest pain, chest tightness, cyanosis, edema, exercise intolerance, ground-glass opacification, hepatojugular reflux, hypoxemia, mediastinal lymphadenopathy, myocardial fibrosis, oxygen desaturation on exertion, wheezing, cor pulmonale, and right ventricular failure. Rejected as separate asbestos-related diseases or lesions rather than asbestosis phenotypes: lung adenocarcinoma, malignant mesothelioma, and pleural thickening. Diffuse reticular or finely nodular infiltrations, subpleural honeycombing, and interlobular septal thickening were not added as redundant phenotype assertions: the broader evidence-backed interstitial morphology plus structured HRCT diagnostic detail preserves the supported granularity. Reduced vital capacity was not duplicated because the evidence supports and the record now uses the more exact reduced FVC term. ORDO frequency bands were not imported because the audit exposed no source evidence refs supporting those exact frequencies. Digital clubbing remains intentionally unlinked because it is an evidence-backed clinical/prognostic sign but no defensible causal edge was established. GSTM1 remains intentionally unwired because the susceptibility evidence is conflicting and does not justify a causal mechanistic edge. No edge was invented merely to improve connectivity.

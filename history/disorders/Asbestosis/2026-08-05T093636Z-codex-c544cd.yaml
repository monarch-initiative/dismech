  summary: 'Review response: Asbestosis automated findings'
  details: |
    Disposition of exact-head automated review on PR 8004. Required item 1 accepted: corrected the in-vitro model cell source from unsupported human macrophages to murine macrophages, matching PMID:37894824. Required item 2 accepted: removed the unsupported 22-patient, 40-participant, and 2023 verification details while retaining only claims present in cached records. Required item 3 accepted: removed the redundant broad HP:0006530 causal edge and then removed the redundant broad top-level phenotype, retaining the specific evidence-backed HP:0550005 phenotype and edge.

    Nonblocking suggestion 4 partially accepted through repository tooling: the pinned ORPHA:2302 snapshot rebuilt successfully and supplies exact evidence for dry cough, exertional dyspnea, and inspiratory crackles, so nonproductive cough was restored and the two refined terms received direct ORPHA evidence. Exact ORDO frequency bands remain deferred because the generated cache contains no phenotype-frequency rows; refresh-orphadata was not used to bypass its checksum mismatch. Suggestion 5 accepted through that direct ORPHA evidence. Suggestion 6 not expanded: PMID:464386 explicitly calls the listed findings previously identified manifestations of asbestosis; adding outcome/predictor studies as though they independently established cross-sectional manifestations would not improve exact alignment. Suggestion 7 deferred: the local MONDO cache has no bindable entries for mixed-dust pneumoconiosis or smoking-related respiratory bronchiolitis, and an unsupported ontology binding was not invented. Suggestion 8 accepted by renaming the progression phase to Long-term outcome. Suggestion 9 declined: no incidence band or rate was derived from a global case-count denominator because that would combine heterogeneous modeled quantities and overstate precision. Suggestion 10 accepted in part by removing reviewer-facing diagnostic commentary from the smoking-cessation clinical description; the functional-decline clause remains omitted because the cited interaction study does not establish longitudinal acceleration. Suggestion 11 deferred: the nine pre-existing mechanism-chain edges have node-level evidence, but the current evidence artifact does not provide exact edge-specific snippets for every transition; evidence was not copied mechanically merely to raise compliance. Root datasets were not added because no dataset accession underlies this literature-curation record.

    Revised D2P disposition: ORPHA:2302 now supports the restored nonproductive cough, exertional dyspnea, and inspiratory crackles. Cough and digital clubbing remain intentionally unlinked because they are supported clinical signs without a defensible causal edge. All other rejected/deferred source phenotypes retain their earlier scope and exact-evidence dispositions; ORPHA metadata in the audit alone does not substitute for a matching quotable claim in the generated cache.

  details: |
    De-novo curation of Asbestosis (MONDO:0016466), an occupational/environmental interstitial pulmonary fibrosis from inhaled asbestos fibers. Deep-research provider: claude_code (research/Asbestosis-deep-research-claude_code.md). Modeled a fully debundled ten-node pathophysiology cascade (each node a single mechanistic event, wired by downstream causal edges): biopersistent fiber deposition -> frustrated phagocytosis -> iron-catalyzed ROS -> NLRP3 inflammasome activation -> chronic sterile alveolitis -> pro-fibrotic mediator release -> myofibroblast differentiation -> excessive ECM deposition -> interstitial fibrosis/architectural distortion -> restrictive ventilatory failure. Five of the ten nodes conform (one each) to the fibrotic_response module (Tissue Injury, Inflammatory Recruitment, Mesenchymal Cell Activation, Excessive ECM, Architectural Distortion); the other five are asbestos-specific detail nodes. Seven phenotypes, histopathology (asbestos/ferruginous bodies), four supportive treatments. Nineteen evidence items; all snippets verified as exact substrings of cached abstracts (PMIDs 29772681, 36630203, 38577971, 38192052, 37569765, 37894824, 21800904, 32553000, 12444030). Scope explicitly distinguishes asbestosis from asbestos-related pleural disease, lung cancer, and mesothelioma. just validate passed (schema+terms+references); compliance ~81%. MONDO enum cache seeded via a local sqlite:obo:mondo run. A fresh-context red-team review verified evidence integrity and prompted the debundling.

  summary: 'Create: Spermatogenic Failure 40 (CFAP65)'
  details: |
    New entry for spermatogenic failure 40 (MONDO:0032859), CFAP65-related MMAF with acrosome hypoplasia. Deep research with the claude_code provider (research/Spermatogenic_Failure_40-deep-research-claude_code.md); just preflight-dr returned PASS for CFAP65. Snippets taken from references_cache only. Chain: loss of CFAP65 (structural molecule activity, decreased; C2a projection of the central apparatus) -> central apparatus disintegration -> axoneme and mitochondrial sheath disorganization -> MMAF; a separate branch for acrosome biogenesis and head shaping (manchette). Respiratory involvement recorded both ways: two of three probands in PMID:31413122 had PCD-like histories without ciliary testing (REFUTE items on the respiratory-sparing hypothesis and SUPPORT on a Recurrent respiratory infections phenotype), while later patients and knockout mice show no respiratory disease (SUPPORT/REFUTE respectively); mouse hydrocephalus kept in the animal model only. ICSI recorded with mostly REFUTE outcome evidence. ClinGen has no CFAP65 curation and no GeneReviews chapter exists. Stub stubs/Spermatogenic_Failure_40.yaml deleted. Validated with the full gate list and validate-disorders.

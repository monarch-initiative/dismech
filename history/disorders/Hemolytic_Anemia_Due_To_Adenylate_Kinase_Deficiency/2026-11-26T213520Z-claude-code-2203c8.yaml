  summary: 'Create: Hemolytic_Anemia_Due_To_Adenylate_Kinase_Deficiency'
  details: |
    Created from the stub for MONDO:0012967 (entry_type decided as DISEASE: one causal gene, AK1, no MONDO descendants, one pathograph). The entry is built around loss of AK1 adenylate kinase activity. Thirteen published alleles were recomputed on the MANE Select transcript NM_000476.3, whose coding sequence was confirmed to translate to UniProt P00568; this reconciled Asp140del with ClinVar Asp141del, delG138 with c.139del (p.Val47SerfsTer45), and gave p.Val173Gly for the allele published as c.518T>G. Each variant residue was placed on PDB 1Z83 and 2C95 and the AlphaFold model AF-P00568-F1 (distance to the bound bisubstrate analog, relative solvent accessibility, side-chain contacts) and checked for conservation against pig, cow, mouse, rat, chicken and carp AK1 and E. coli and yeast adenylate kinase; ClinVar and gnomAD v4.1 were queried on 2026-11-26. Literature was found by PubMed search. An OpenScientist disorder run was started first and timed out after one hour without a report; a second disorder run timed out after 7000 seconds, and a hypothesis run on additional_defect_required_for_hemolysis was stopped after about two hours without output, so no OpenScientist report was produced. An Asta literature-retrieval run then completed (research/Hemolytic_Anemia_Due_To_Adenylate_Kinase_Deficiency-deep-research-asta.md): of its 16 papers only one, PMID:40016400, concerns AK1 deficiency and it was already cited; the rest concern pyruvate kinase deficiency, G6PD deficiency or anemia in general (preflight-dr: WARN, AK1 named once against PKLR 19 times), so the report added no content. After review, two background quotes stating the human clinical picture were regraded from IN_VITRO to HUMAN_CLINICAL, and the Compensatory Erythropoiesis node was rebound from GO:0034101 to GO:0030218 erythrocyte differentiation. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). PMID:28211224 and PMID:37782390 have no abstract and are named in descriptions without evidence items. Validation: just validate, validate-terms, count-verified-snippets (77/77), check-gene-namespaces-online and the offline whole-repo gates. Curated alongside a review of AK1 in ai4curation/ai-gene-review.

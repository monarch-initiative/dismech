  summary: 'Create: SEMD Guo-Campeau type (ERI1)'
  details: |
    De novo curation from an OpenScientist deep-research report. The report scored 6 of 6 references resolved with zero confabulation and 14 of 14 quotes valid, but only 2 of 6 on topic - and that ratio was load-bearing rather than cosmetic. One of the off-topic four, PMID:41549465, is a case series of Dyggve-Melchior-Clausen syndrome, a different recessive spondyloepimetaphyseal dysplasia. Quoting it would have been Named Entity Confusion that passed snippet validation cleanly, because the quote would have been exact and the paper real. Only the two on-topic primaries are cited and the near-miss is recorded in the entry notes. Gene identifier verified independently against HGNC before use: ERI1 is hgnc:23994 and the report was correct this time, which matters because the SPG81 report in the same batch gave a wrong identifier for its causal gene. Verification is now reflexive rather than triggered by suspicion. The scope call is the substantive one. MONDO:0958006 is the missense-driven skeletal disease; biallelic null ERI1 genotypes produce a separate milder entity with mild intellectual disability and digital anomalies, which is deliberately not curated here. Collapsing them into one variably expressive disease would erase the finding that defines both - within one recessive gene, missense alleles are more severe than null alleles. Pathograph runs from the abolished exoribonuclease activity through the two RNA-metabolic consequences to impaired chondrogenesis in patient iPSCs and then the skeletal syndrome. The animal model is entered as FAILS_TO_RECAPITULATE with LOW fidelity, and its limitations argue that the failure is informative: a knockout removes the protein while the disease needs a missense allele keeping a catalytically dead protein in place, so under a dominant-negative or neomorphic mechanism the knockout cannot reproduce it in principle. The practical consequence recorded there is that no existing animal model can test a therapy. Two knowledge gaps: the missense-versus-null mechanism, with its therapeutic consequences spelled out, and the tissue-restriction question of why loss of a ubiquitous RNA activity produces a skeletal phenotype. Four phenotypes are graded PARTIAL because the cached abstract names the diagnosis rather than each radiographic sign; that is stated in each explanation rather than the grade being inflated to SUPPORT. No frequencies: five skeletal-phenotype patients give no denominator. Validation: just validate passes, 15 of 15 snippets verified, entity refs and duplicate keys clean, reachability audit shows one root, no dangling targets and every phenotype reached.

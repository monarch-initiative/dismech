  summary: 'Review round 1: split the RNA arms, complete the disease name'
  details: |
    Four review items, all correct. Items 1 and 2 together: the node bundling defective 5.8S rRNA trimming with impaired histone mRNA degradation is now two sibling nodes, and the reviewer's argument for splitting was better than a general anti-bundling rule - the entry's own tissue-restriction knowledge gap proposes chondrocyte histone supply as a candidate explanation, and a hypothesis needs a node to attach to. The histone arm is grounded with GO:0071044, which validated as histone mRNA catabolic process. The bundled node had also been evidenced by a quote describing ERI1's normal function rather than the defect; the sentence that actually evidences the defect was already in the file one node upstream and legitimately serves both new nodes, since one lost activity produces both consequences. Item 3: epiphyseal dysplasia HP:0002656 and metaphyseal dysplasia HP:0100255 added, so all three components of the disease name are queryable rather than only platyspondyly. Same PARTIAL grade and same explanation pattern, because the cited abstract names the diagnosis rather than each radiographic sign. Item 4: the survival range is recorded in notes and deliberately not as a phenotype with an evidence item. Deaths in infancy and early childhood in three families against survival into adulthood in the founding family is the most clinically consequential fact about this disease, and the cached abstract does not state it; manufacturing an evidence item for a figure the source does not carry is the failure this project's rules exist to prevent. Also recorded in notes: the report proposes HP:0003417 for irregular vertebral endplates, and HP:0003417 is Coronal cleft vertebrae. The report's term-validation pass scored it verified, which it correctly is - the term exists - so validation confirmed the identifier while the label attached to it was wrong. That is the same shape as the gene-identifier errors in two other reports in this batch: existence checking cannot detect a wrong mapping. Validation: just validate passes, 19 of 19 snippets verified, entity refs clean, five nodes, one root, no dangling targets, every phenotype reached.

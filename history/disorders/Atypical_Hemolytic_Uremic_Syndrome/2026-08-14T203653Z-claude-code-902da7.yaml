  summary: Add MATUCIP real-world complement-inhibitor evidence and the empiric-treatment
    knowledge gap
  details: |
    Curation-scanner high_effort run for issue #6428 (preprint scan, PPR:PPR1274254 - Spanish MATUCIP pediatric ICU registry of complement inhibitor therapy in thrombotic microangiopathy). Two additions to kb/disorders/Atypical_Hemolytic_Uremic_Syndrome.yaml: (1) a real-world supporting evidence item on the existing Eculizumab treatment recording that eculizumab was the agent used in 82.5% of cases with a median 3-day time from diagnosis to initiation, explicitly framed as corroboration and not sole support since the source is a non-peer-reviewed preprint; (2) a new discussions block carrying a KNOWLEDGE_GAP (gap_ahus_empiric_complement_inhibition_window) attached to the Alternative Complement Pathway Dysregulation and Renal Microvascular Thrombosis pathophysiology nodes, recording that complement inhibition is initiated on suspicion before the curated mechanism can be confirmed, that half of real-world pediatric TMA complement-inhibitor use is off-label, and that non-CM-HUS patients start therapy later; it carries a proposed experiment for a same-day alternative-pathway activation readout. The MATUCIP mixed-TMA aggregate outcomes (72.5 percent kidney replacement therapy, 5 percent mortality) were deliberately NOT curated as aHUS-specific phenotype frequencies and are recorded only in the discussion notes. Validation run: just validate (passed), just count-verified-snippets (68/68 verified), just validate-terms (passed), just check-title-snippets (no new title-quoting snippets), pytest -k 'discussion or attaches or experiment' (3905 passed), plus the batched just validate-disorders pre-PR sweep.

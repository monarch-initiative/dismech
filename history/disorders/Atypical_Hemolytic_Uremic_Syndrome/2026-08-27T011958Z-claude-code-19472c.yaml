  summary: Align conformance target and injury-node GO granularity with module
  details: |
    Addresses two Cursor Bugbot findings on PR #8872, both verified before acting.

    1. Conformance target moved from the amplifier to the trigger node. "Alternative Complement Pathway Dysregulation" conformed to complement_dysregulation#Unrestrained Alternative Pathway Amplification, but the module notes list aHUS as a trigger-node substitution (germline regulator loss, or C3/CFB gain-of-function), and the parallel alternative-pathway conformer, Paroxysmal_Nocturnal_Hemoglobinuria, attaches at #Loss of Complement Regulatory Control. Decisive point: the two disorder nodes carry an identical term set (GO:0030449 DECREASED plus GO:0006957 INCREASED) yet pointed at different module nodes, so one of them had to be wrong by inspection. The node description leads with loss of regulation and names CFH, MCP/CD46 and CFI, which is the regulator lesion the trigger node models, so the trigger is correct and the two alternative-pathway conformers are now parallel.

    2. Injury-node GO granularity. "MAC-Mediated Endothelial Activation" conforms to the module's effector node, which binds GO:0097278 complement-dependent cytotoxicity, but bound the parent GO:0006956 complement activation. Rebound to GO:0097278 INCREASED with the GO:0005579 membrane attack complex cellular_component, matching both the module node and the already-correct PNH counterpart. The node description ("generates membrane attack complex (MAC/C5b-9) on endothelial cells, causing direct cell injury") already asserted both, so this records an existing claim rather than adding one. The CL:0002188 glomerular endothelial cell substitution for the module's generic endothelial cell is unchanged.

    No cache row was written; all terms were already label- and enum-cached.


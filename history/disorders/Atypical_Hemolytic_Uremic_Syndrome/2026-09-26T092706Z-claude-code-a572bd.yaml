  summary: 'Genetics pass: wire complement/DGKE genes into pathograph, bind subtype
    terms, regrade THBD as DISPUTED'
  details: |
    Genetics pass under the d2g gap campaign (issue #12255, series-048). Anchor check first: MONDO:0016244 atypical hemolytic-uremic syndrome is the class this entry models, so the disease_term binding was left as it stands.

    Wired all causal genes into the pathograph, which was the measured gap: gene_mechanism_wiring_coverage moved from 0/8 to 7/7 (THBD excluded from the denominator as DISPUTED). Rather than bolting one flat gene list onto the existing convergence node, three mechanism-specific upstream nodes were added and the genes distributed across them by what they actually do. Loss of Surface Complement Regulation carries CFH, CFI, CD46, CFHR1 and CFHR3 and binds GO:0045957 negative regulation of complement activation, alternative pathway as DECREASED. Gain-of-Function C3 Convertase Activity carries CFB and C3 and binds GO:0006957 as INCREASED, reflecting that those two variants act on the convertase rather than on its regulators. DGKE Loss and Prothrombotic Endothelial Signaling carries DGKE, binds GO:0004143 as DECREASED, and feeds the platelet-aggregation node directly rather than the complement node, because the mechanism is not complement-mediated. The first two feed the pre-existing Alternative Complement Pathway Dysregulation node, which remains the convergence point and stays gene-free.

    Subtype series completed. All six existing has_subtypes rows gained a bound subtype_term, a genes descriptor and an inheritance block; a seventh row was added for DGKE-aHUS (MONDO:0018159). Reciprocal genetic[].subtype foreign keys now cover every causative record, so subtype-usage-audit reports 7/7 subtypes referenced and 8 WIRED_DIRECT subtype genes. Per-gene case_fractions were added for CFH (30%), CD46 (10%), CFI (10%, range 5-15%) and C3 (10%) from the abstract of PMID:21376430; CFB is stated there only as "rarely" so no numeric fraction was recorded for it.

    THBD is the substantive disagreement with MONDO. MONDO records THBD as the causal gene of MONDO:0013044 atypical hemolytic-uremic syndrome with thrombomodulin anomaly. ClinGen's Complement-Mediated Kidney Diseases expert panel classified THBD-aHUS as Disputed in June 2024, excluding every reported THBD variant from scoring after large cohorts and two enrichment analyses failed to reproduce the original 2009 finding. One of those enrichment analyses, PMID:30377230, is cited in this entry and its enriched-gene list omits THBD. The record was therefore regraded relationship_type DISPUTED rather than deleted, because the disputing panel's own summary says more evidence is needed either to support or to refute the gene's role, and no has_subtypes row was created for MONDO:0013044. The GeneReviews chapter still lists THBD among aHUS genes; that disagreement is recorded as evidence on the record rather than suppressed.

    Repaired a pre-existing evidence defect on the same record: its only evidence item quoted two generic Global aHUS Registry sentences that do not mention THBD, under an explanation asserting that 851 patients were screened for THBD. Both the snippet and that claim were replaced with the ClinGen dispute evidence and the PMID:30377230 enrichment result.

    Repaired the entry's GeneReviews baseline. PMID:20301541 Genetic Atypical Hemolytic-Uremic Syndrome was the mandatory baseline chapter and was not cited; check-genereviews reported it as CANDIDATE_CHAPTER. Its committed cache file held a connection-refused JSON error blob rather than the chapter, so a re-fetch was a strict repair rather than a destructive refresh, and it now carries the full chapter summary. The chapter was added to the references block with the GeneReviews tag, and its inheritance paragraph now sources the autosomal dominant with reduced penetrance modes on the five complement subtypes and the autosomal recessive modes on the DGKE and CFHR3/CFHR1-deletion subtypes. Its statement that eculizumab may not benefit DGKE-variant patients was added to the DGKE record as the therapeutic corollary of the non-complement mechanism.

    Four ClinGen gene-validity cache files were generated for assertions not previously cached: C3-aHUS (Definitive), CFB-aHUS (Moderate), DGKE-aHUS (Definitive) and THBD-aHUS (Disputed). The pinned ClinGen snapshot in data/clingen/MANIFEST.yaml has drifted from the current release (tracked in dismech#10426), so the CSV these were built from was downloaded fresh; the generated files therefore carry the manifest's pinned snapshot date in their Source line rather than the download's. No repin was made.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and validate-disorders all pass. Every snippet was independently confirmed to be an exact normalized substring of its cached reference and, for newly authored snippets, to sit inside the abstract region rather than the full-text body. list-gene-term-mismatches --resolve compared all 29 gene bindings across the two entries against live HGNC with no mismatch and no uncached row.

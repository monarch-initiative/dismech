  details: |
    Backfilled the missing reference_title on the PMID 42169153 leptospirosis case report evidence item under Plasma Exchange. Re-verified all existing evidence snippets as exact substrings and confirmed semantic support with no Named Entity Confusion. Mined newly available full text and added verified evidence: UK Global aHUS Registry PMID 40764536 supports gastrointestinal involvement as the most common extra-renal manifestation at 22.2 percent on the Systemic TMA node and the Diarrhea phenotype, and worse ESKD-free survival with CFH C3 or CFI variants on the CFH genetic node. Added kidney-transplant recurrence evidence PMID 41368132 to the Renal Transplantation treatment with a PARTIAL item noting poor late-presentation outcomes. Added autoimmune-associated TMA trigger evidence PMID 36642429 to the environmental triggers node. Added Belgian cohort prevalence and female-preponderance and UK registry genetic-yield and relapse findings to top-level references. All schema, term, and reference validation pass.

  summary: 'Review round 1: retype CFHR1/CFHR3 deletion as RISK_FACTOR; cite GeneReviews
    clinical characteristics'
  details: |
    Review round 1 on PR #12896, addressing both blocking findings and two of three optional suggestions.

    The CFHR1/CFHR3 deletion record was retyped from relationship_type CAUSATIVE to RISK_FACTOR. The record's own features field describes the homozygous deletion as predisposing to anti-factor H autoantibody development rather than as causing disease, and the GeneReviews chapter frames it the same way, warning that predictive testing on a predisposing factor is problematic because it is only one of several risk factors required for aHUS. The deletion is a common polymorphism that is neither necessary nor sufficient for aHUS, which is the schema's definition of RISK_FACTOR. A notes field records why RISK_FACTOR was chosen over the equally defensible SUSCEPTIBILITY: the claim is about an inherited structural variant raising risk with the autoantibody as the proximate lesion, not about a susceptibility locus mapped by association. The autosomal recessive inheritance is retained on both the record and the Anti-FH subtype row, because it describes transmission of the biallelic deletion itself rather than the penetrance of aHUS. RISK_FACTOR is not among the relationship types that graph.py excludes from mechanism-edge inference, so the record remains wired to the surface-regulation node and gene wiring stays at 7/7.

    Tagging the GeneReviews chapter in the previous round brought the four-section baseline into force, and the CLINICAL CHARACTERISTICS section was the one not yet cited. Its statement that 60% of genetic aHUS progresses to end-stage renal disease was added to the Acute Kidney Injury phenotype, beside the French nationwide series already cited there. The explanation records that the two figures use different denominators - GeneReviews reports the eventual outcome for genetic aHUS, the French series reports progression after the first episode stratified by age - so a reader does not mistake 60% against 46% and 16% for a contradiction. The quote was taken from the repaired cache body rather than from any earlier note of its contents.

    Two suggestions were taken. The GeneReviews agents-to-avoid sentence now sources the precipitating medications the environmental entry already named in prose: the calcineurin inhibitors appear there as cyclosporin and tacrolimus among the immunotherapeutic agents, and oral contraceptives are listed by name. And the surface-regulation node carries a notes field recording the three GeneReviews aHUS genes deliberately not curated - CFHR4, CFHR5 and VTN - with the reason and the exact searches behind the absence claim: synonym-inclusive MONDO searches for VTN, vitronectin, CFHR5 and CFHR4 return no aHUS class, the only disease hit across all four being MONDO:0013892 C3 glomerulonephritis for CFHR5, with the remaining hits being HGNC gene records rather than MONDO classes.

    One suggestion was declined, in agreement with the reviewer's own reading: the PMID:17517971 statement of factor H function is left at evidence_source OTHER with quote_role BACKGROUND, because the sentence states established protein identity rather than reporting a measurement, and HUMAN_CLINICAL would assert a study type the sentence does not describe.

    The branch was rebased onto main before this round, which raised the linkml-reference-validator floor to 0.3.0rc3; the gates below were run under that version. Validation after the round: validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading and validate-disorders all pass. Both new snippets were independently confirmed to be exact normalized substrings of the cached chapter and to sit in its abstract region, and every snippet in the entry was rechecked against its cache.

  summary: 'Create: Mitochondrial Spastic Paraplegia (SPGM, MT-TV m.1661A>G)'
  details: |
    Created SPGM from a blank stub. The name was suspected of naming a grouping (many HSP loci are mitochondrial); it does not. MONDO:0975951 is equivalent to OMIM:500018, an entry in OMIM's mitochondrial-DNA phenotype series created for one family and one variant, m.1661A>G in MT-TV, so the defining feature is mitochondrial inheritance rather than a mitochondrial mechanism. mim2gene_medgen returns GeneID '-' for OMIM:500018, but unlike the DFNB46 case that blank reflects the 5-series being outside the nuclear gene map, not an unidentified gene; the gene is named in the defining paper. kb/ searched for MT-TV, m.1661 and mitochondrial spastic paraplegia and found no coverage. Three references cited: PMID:39468830 (Shi 2025 Mov Disord, the defining family), PMID:21986556 and PMID:24691472 (MT-TV as an established locus, and the heteroplasmy threshold that makes homoplasmy here notable). Pathograph: homoplasmic MT-TV variant -> upregulated mitochondrial autophagy gene expression -> reduced mtDNA copy number -> peripheral nerve myelin/mitochondrial ultrastructural abnormality and length-dependent corticospinal degeneration -> two wired phenotypes. Conforms to mitochondrial_dysfunction at two nodes and corticospinal_tract_axonopathy at one; all three anchors verified against the module files. genetic_context.zygosity and functional_impact_category are deliberately empty (no ZygosityEnum value describes homoplasmy; no functional consequence has been demonstrated for this allele). No deep-research run: a 2025 singleton entity with one disease-level paper carries a substitution risk and has no literature to synthesise. Validated: just validate clean first pass, 23/23 snippets verified, plus check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading all OK.

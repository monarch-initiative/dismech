  details: |
    Addressed the IMPORTANT finding and the suggestion from the automated review in one push. (1) The 'Reduced Mitochondrial DNA Copy Number' node bound GO:0006264 mitochondrial DNA replication with a DECREASED modifier. Nothing about replication rate was measured, and more seriously it asserted a second independent lesion in mtDNA synthesis while the entry's own causal model is increased removal through mitophagy. Rebound to GO:0032042 mitochondrial DNA metabolic process, which is the binding the corpus already uses for depletion without a replication lesion (Pearson, Kearns-Sayre, Behr) as against GO:0006264 for replication-machinery genes (POLG, TWNK, TYMP). The node notes now cover both inferred modifiers symmetrically and record the reasoning for the split, so the binding is not re-flipped later. (2) Node 1's description said the variant-to-translational-defect step is a gap that no node asserts, while node 3 binds mitochondrial translation DECREASED; added a forward-pointing clause in node 1 so a reader meeting it first does not read the entry as self-contradictory. No cache change: GO:0032042 was already present. The reviewer explicitly accepted the no-deep-research decision as a signalled scoping call and read the bioenergetic conformance caveat as the right disclosure, so neither was changed. Revalidated: just validate clean, 23/23 snippets verified, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values all OK.

  summary: Add ICIMD, Harrison's and mechanistic classifications
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter GENETICS_ENVIRONMENT_DISEASE + ENDOCRINOLOGY_METABOLISM + NEUROLOGIC, icimd_category 'complex_iv_subunits_and_assembly_factors' (ICIMD group under category 'Disorders of nuclear-encoded oxidative phosphorylation'; Ferreira et al. 2021, PMID:33340416), and mechanistic_category 'mitochondrial disease'. The notes record why the nuclear-encoded OXPHOS category is correct rather than 'Mitochondrial DNA related disorders': PET100 (formerly C19orf79) is a nuclear-encoded Complex IV biogenesis chaperone, even though the destabilized COX subunits include mtDNA-encoded ones. NEUROLOGIC was added because the Lebanese founder cohort presents as Leigh syndrome, which the entry already documents with cited evidence. Classified identically at the ICIMD/mechanistic level to COX18-Related_COX_Deficiency, curated in the same sweep, so the two nuclear complex IV assembly disorders are consistent. No evidence changes were needed - this entry already quotes result-stating sentences throughout. Validated with 'just validate' - schema, term and reference validation all passed, 33/33 snippets verified.

  summary: 'Gene-family review: PET100'
  details: |
    The PET100 node now binds a molecular function, GO:0044183 protein folding chaperone (DECREASED), described as a non-catalytic complex IV assembly chaperone; GO's protein folding includes assembly of multisubunit complexes. Support: PET100 forms a ~300 kDa inner-membrane subcomplex with complex IV subunits (PMID:24462369) and is one of the conserved PET100/PET117 chaperones assisting complex IV biogenesis (PMID:28199844, newly cited). The inheritance block on the genetic record is bound to HP:0000007. CAUSATIVE is kept: ClinGen rates PET100 Definitive for mitochondrial disease and Moderate for Leigh syndrome, both broader than this entry's MONDO:0033646.

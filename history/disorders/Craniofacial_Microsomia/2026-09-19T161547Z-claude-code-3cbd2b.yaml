  summary: 'Genetics pass: wire SF3B2/FOXI3/EDNRB into the pathograph, add GBX2 and
    SHROOM3'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12194, epic #12189). The
    genetic section was re-derived from the primary literature before the issue's
    MONDO reconciliation checklist was opened. SF3B2 and FOXI3, the two genes MONDO
    records for craniofacial microsomia 1 and 2, were already curated with evidence
    but reached no pathophysiology node; both are now bound as gene descriptors on
    the "Monogenic and Copy-Number Contributions in a Minority of Cases" node, and
    EDNRB is bound on the trigger node where its GWAS evidence already sat. Two
    genes were added from the fresh search: GBX2 (CAUSATIVE, PMID:41867955 - three
    co-segregating pedigrees from a 201-family exome cohort, with transactivation
    and zebrafish support) and SHROOM3 (SUSCEPTIBILITY, PMID:39875538 and
    PMID:40234029 - rare-variant enrichment in Chinese cohorts under dominant
    inheritance with incomplete penetrance modified by SHROOM3 expression
    haplotypes). HOXA2, FBLN2 and PUF60 were read and deliberately not curated here;
    the reasons are recorded in the entry's notes. Gene-to-mechanism wiring for this
    entry went from 0/3 to 5/5. tag-references added top-level tagged entries for
    the already-cited Treacher Collins GeneReviews chapter and the Goldenhar
    StatPearls chapter. Validated with just validate, validate-terms,
    count-verified-snippets (112/112), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches, and validate-disorders.

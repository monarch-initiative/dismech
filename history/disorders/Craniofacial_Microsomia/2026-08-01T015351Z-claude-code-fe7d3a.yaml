  summary: 'Review response (PR #7497): fix term/frequency mismatches, add CNS phenotype'
  details: |
    Addressed the three IMPORTANT findings and most suggestions from the automated review of PR #7497.

    Term-vs-frequency precision (the review's central theme -- an HPO term narrower than the frequency figure it carries):
    (1) 'Renal Anomalies' carried HP:0000104 Renal agenesis with frequency OCCASIONAL sourced from 'urogenital tract 11%'. The 11% denominator is all urogenital anomalies, so the entry was renamed 'Urogenital Anomalies' (category Renal -> Genitourinary) and retargeted to HP:0000119 Abnormality of the genitourinary system. Added a second PMID:30878275 full-text evidence item ('Mainly, renal aplasia, undescended testis, and hydronephrosis were observed.') that demonstrates the breadth of the denominator.
    (2) 'Limb Anomalies' carried HP:0002984 Hypoplasia of the radius with the 18.2% 'at least one upper and/or lower limb anomaly' figure. Retargeted to HP:0040064 Abnormality of limbs and added a supporting snippet on non-association with OMENS score and laterality. Split out a new 'Radial Ray Hypoplasia' phenotype bound to HP:0002984 at 13.3% (OCCASIONAL), anchored on the PMID:12410187 snippet '13.3% (4) had limb defects (all radial ray hypoplasia)' already present in the file -- the only quoted figure that genuinely supports a radius-specific term.
    (3) Added the missing 'Central Nervous System Anomalies' phenotype (HP:0002011 Morphological central nervous system abnormality, OCCASIONAL) for the 'central nervous system 11%' figure that was already quoted twice in the file. Three PMID:30878275 evidence items: the abstract tract-prevalence sentence, the full-text lesion breakdown (hydrocephaly, ventriculomegaly, intracranial cysts, Arnold Chiari), and the spinal-cord/vertebral co-occurrence statistic.

    Suggestions applied: Cleft Lip and Palate retargeted HP:0000204 Cleft upper lip -> HP:0000202 Orofacial cleft (the evidence says 'cleft lip and/or palate'); Soft Tissue Deficiency retargeted HP:0011332 Hemifacial hypoplasia -> HP:0011799 Abnormality of facial soft tissue, removing the overlap with the separate Facial Asymmetry phenotype; the unsupported OCCASIONAL band on Macrostomia was dropped per docs/frequency-evidence-guidelines.md with the reason recorded in the description; the uncited 'conotruncal lesions over-represented' claim on Cardiac Anomalies was removed and replaced with the cohort's actual lesion distribution plus a supporting PMID:30878275 full-text snippet; two MODEL_ORGANISM evidence items were added to the FOXI3 genetic entry from the PMID:37041148 triple-mutant knock-in mouse (underdeveloped mandible with absent pinna replaced by preauricular tags; truncated mandible with syngnathia and ear-ossicle anomalies), tying the mouse to the arch dorsoventral-identity arm of the module; a new clinical_trials block captures the two completed ADRC-supplemented fat-grafting RCTs (NCT01674439 Phase II n=29; NCT03806361 not-applicable phase, paediatric, n=30) together with a matching 'Autologous Fat Grafting for Facial Soft Tissue Augmentation' treatment bound to NCIT:C126279 Autologous Fat Graft.

    Pathograph: three downstream edges were added or renamed on 'Asymmetric Hypoplasia of First- and Second-Arch Derivatives' (Central Nervous System Anomalies, Radial Ray Hypoplasia, and Renal Anomalies -> Urogenital Anomalies) so that all 20 phenotypes retain an incoming edge and the 7 pathophysiology nodes remain a single connected component (verified programmatically).

    Every ontology ID proposed by the reviewer was independently OAK-verified before use; all six were correct this time (HP:0000119, HP:0012210, HP:0040064, HP:0002011, HP:0000202, HP:0011799). HPO has no dedicated 'radial ray hypoplasia' class, so HP:0002984 remains the correct binding for the split-out phenotype.

    Validation: just validate (schema + terms + references) passes with 103/103 snippets verified against cached references, up from 91; just validate-terms passes; scripts/check_folded_hyphens.py reports no new folded-scalar hyphen splits. Two new clinicaltrials caches were fetched with just fetch-reference; the mass references_cache/ rewrite triggered by the validator was reverted again, and only additive cache/hp, cache/ncit and cache/enums rows for HP:0011799 and NCIT:C126279 are included.

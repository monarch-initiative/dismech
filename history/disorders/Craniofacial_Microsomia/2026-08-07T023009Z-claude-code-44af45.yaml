  summary: Link maternal and vascular exposures into the pathograph
  details: |
    Backfill for issue #8085. Maternal diabetes mellitus and higher parity target the entry's dedicated 'Teratogenic and Maternal-Environmental Disruption' node as PREDISPOSES. Vasoactive medication and perfusion-related maternal factors deliberately target a different node, 'Stapedial Artery Haemorrhage and Vascular Disruption', because the proposed action of those exposures is specifically on embryonic perfusion, which is the arm that node models; routing them to the generic teratogen node would have lost that distinction. All three are INDIRECT_UNKNOWN_INTERMEDIATES. Note the 'Higher Parity' entry carries a second evidence item about vitamin A consumption being associated with lower risk, which is a protective finding sitting under a risk-factor entry; the link cites only the parity odds ratio, and the mismatch is left for a curator rather than silently reinterpreted. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged.

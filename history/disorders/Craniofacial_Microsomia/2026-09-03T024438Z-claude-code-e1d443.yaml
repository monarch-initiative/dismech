  summary: Add narrowMatch mondo_mappings for MONDO's SF3B2/FOXI3-numbered strata
  details: |
    Issue #9868 asked that the numbered MONDO IDs folded by PR #9855's stub cleanup (Craniofacial_Microsomia_1/2) be re-bound so seed-stubs cannot re-nominate them. This entry's has_subtypes (HFM, Goldenhar, Bilateral CFM, Isolated Microtia) encode the clinical OMENS-plus severity/laterality spectrum, not the gene-specific split the folded stubs named: MONDO:0958175 'craniofacial microsomia 1' is the SF3B2-caused stratum and MONDO:0958194 'craniofacial microsomia 2' is the FOXI3-caused stratum (both genes already carried in this entry's genetic: block). Binding these onto has_subtypes[].subtype_term would have conflated two different classification axes, so instead added disease-level mappings.mondo_mappings entries (skos:narrowMatch, read by the MONDO coverage index in src/dismech/compare/mondo_priority.py) for both, with mapping_justification explaining the axis distinction. Validated with just validate, just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-enum-values, the batched just validate-disorders sweep (269/269 snippets verified across the 3-file tranche), and pytest -k Craniofacial.

  summary: 'Create: Craniofacial_Microsomia'
  details: |
    Created a new dismech entry for craniofacial microsomia (MONDO:0015397), the second most common congenital craniofacial anomaly after orofacial clefting. NEC preflight: confirmed MONDO:0015397 label, OMIMPS:164210 xref and the hemifacial microsomia / oculo-auriculo-vertebral spectrum / Goldenhar synonym set with OAK before using any deep-research output, guarding against drift into Treacher Collins, Nager or isolated microtia. Deep research: Edison/FutureHouse falcon via 'just research-disorder falcon Craniofacial_Microsomia' (694s, 23 citations, 1 artifact); the report was treated as leads only. Falcon supplied three findings that materially improved the entry (SF3B2 haploinsufficiency as a spliceosomopathy cause, the Renkema n=991 extracraniofacial cohort, and the Zhang GWAS), and one hallucination that was caught and rejected: it proposed HP:0000182 for macrostomia, which is actually 'Movement abnormality of the tongue'. Curated a seven-node pathograph with four parallel aetiological arms (vascular/stapedial-artery disruption, teratogenic and maternal-metabolic exposure, monogenic/copy-number, and the heterogeneous trigger) converging on a shared neural-crest-derived skeletogenic mesenchyme effector node and an asymmetric arch-derivative consequence node, plus an airway/feeding consequence node. Declared module conformance to pharyngeal_arch_patterning_serial_homology at three nodes, including the key target 'Serially Homologous Craniofacial Malformation Across Arch Derivatives', and curated the Treacher Collins contrast (symmetric monogenic ribosomopathy vs asymmetric sporadic multifactorial) both in the consequence node and as a differential_diagnoses entry. Validation: just validate, just validate-terms and scripts/check_folded_hyphens.py all pass. Because linkml-reference-validator reported 'Total checks: 0' locally, all 91 evidence snippets across 17 distinct references were additionally verified by script as exact whitespace-normalised substrings of their cached abstracts, and every reference_title was checked against the cache frontmatter. Pathograph connectivity was verified programmatically: 7 nodes in a single connected component, no dangling edge targets, all 18 phenotypes reached by at least one edge. Note: CLAUDE.md documents MAXO terms for treatment_term, but the TreatmentActionTerm dynamic enum is rooted only at NCIT:C25218 and no other KB entry uses MAXO there, so treatments were bound to validated NCIT terms instead.

  summary: Add citations for uncited treatments/phenotypes; drop tangential DR reference
    (issue 6307)
  details: |
    Closed the Familial_Adenomatous_Polyposis short-entry checklist item from issue #6307's cancer-predisposition evidence-integrity review. All four treatments (Prophylactic Colectomy, Endoscopic Surveillance, Genetic Counseling, Chemoprevention) were previously uncited; added evidence citing GeneReviews PMID:20301519 (APC-Associated Polyposis Conditions), which contains verbatim management/surveillance/genetic-counseling language covering each. Added evidence for the previously-uncited Osteomas and CHRPE phenotypes from the same GeneReviews extracolonic-manifestations sentence. Reworded the Duodenal Adenomas phenotype description to drop the unquotable 80-90 percent figure and cited DOI:10.1055/a-2011-1933 (European FAP Consortium surveillance strategy) instead, which states duodenal adenomas develop in nearly all FAP patients and that duodenal cancer is one of the most common FAP-related causes of death, both already-asserted claims now backed by exact quotes. Dropped the DOI:10.6004/jnccn.2024.0061 bibliography entry, which the issue flagged as tangential since its quoted finding is about endometrial cancer detection, not FAP. Validated with just validate, just validate-references, and pytest tests/test_data.py; all FAP-relevant tests pass, and the one unrelated pre-existing failure is in Babesiosis.yaml. Left the remaining items from issue 6307 untouched for follow-up curation passes: Classic_FAP two-hit/hepatoblastoma nodes, MEN2, Pheo/Para, NBS, AT, FA, SUFU-NBCCS, Cowden/Retinoblastoma. Issue stays open for those.

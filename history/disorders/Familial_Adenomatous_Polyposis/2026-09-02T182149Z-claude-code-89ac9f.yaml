  summary: 'Integrate assessed OpenScientist findings: APC destruction complex, just-right
    selection, CIN arm, LGR5 origin'
  details: |
    Assessed the OpenScientist hypothesis-search report for canonical_apc_wnt_betacatenin_polyp_carcinoma_model (verdict SUPPORTED; sidecar at kb/hypotheses/Familial_Adenomatous_Polyposis/canonical_apc_wnt_betacatenin_polyp_carcinoma_model/assessments/openscientist-assessment-by-claude-opus-5.yaml, 14 claims) and integrated only the RETAINED and QUALIFIED claims whose citations were absent from the entry. Added to mechanistic_hypotheses: destruction-complex reconstitution (PMID:34352208, two items), the just-right second-hit selection model (PMID:12045208), the Wnt-independent chromosomal-instability arm (PMID:11283620), and a REFUTE item for the APC/nuclear beta-catenin discordance (PMID:36586069). Rewrote the notes sentence that read 'ClinGen formally curated APC-FAP as DEFINITIVE': the report's cited source (PMID:37800450) describes a Variant Curation Expert Panel, which is variant classification, not gene-disease validity; the notes now separate the two and both are cited on the genetic entry, the gene-disease half against the ClinGen record CGGV:assertion_cdf062b6-6abf-49f6-a2dc-43b0e535f1b6-2022-06-20T170000.000Z. New pathophysiology node 'APC-Driven Chromosomal Instability' (biological_scale CELLULAR, GO:0007059 modifier ABNORMAL) with an incoming edge from APC Tumor Suppressor Loss and an outgoing edge to Colorectal Cancer Progression. Annotated the initiating node with CL:0002250 intestinal crypt stem cell plus both arms of the Barker lineage-tracing experiment (PMID:19092804). Substantiated previously uncited genotype-phenotype prose with PMID:18433509, added APC somatic mosaicism to the genetic notes with PMID:40237877, and qualified the 'CRC by age 40' phenotype description with the genotype-dependent timing from PMID:37853284. Three KNOWLEDGE_GAP discussions added with proposed experiments: the APC/nuclear beta-catenin discordance, the unquantified Wnt-versus-CIN contribution, and unidentified human polyp-burden modifiers. Deliberately not integrated: tankyrase inhibitors (PMID:35849876, PMID:36873622) and the serrated neoplasia pathway (PMID:27661107, PMID:22654442), both marked NEEDS_VERIFICATION in the sidecar and, in the serrated case, out of scope for a FAP entry; the R-spondin/LGR5 feed-forward node, whose sources were not verified here; and hypothesis status, which the report itself recommends leaving at CANONICAL. Report-level defects recorded in the sidecar: the Mom1/Pla2g2a attribution for the mouse modifier effect contradicts the cited paper's own conclusion, PMID:34352208 is misattributed to 'Faux et al.', and the report's four figure artifacts were never produced.

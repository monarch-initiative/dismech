  summary: "Evidence review: UBA5-related developmental and epileptic encephalopathy"
  details: |
    Performed an evidence-driven REVIEW of the existing DEE44 entry, starting from
    authoritative origin/main commit 1107b13910c1c7a5af9dcf3b9c7eaf3b8c3092b2.
    The pre-review target blob was d272475c6ea1894f970c3a46bbb6889fa96078a9
    (SHA-256 c4e65b68fc9f868c9fb30c0aeaf3fa13124095982a6d6481138849bf0bc14fea).
    Read-only eligibility checks resolved every history target through
    superseded_by.path/path and found no effective REVIEW event. An exhaustive stable
    explicit-page scan of all 221 open pull requests reconciled 17,303 changed-file
    records, including immutable base/head fallback for the one REST-cap anomaly, and
    found no filename or previous_filename collision with this target. The target existed
    at exactly one case-correct path; the proposed branch and worktree were absent under
    remote/local guards before the isolated review worktree was created.

    Evidence was reconciled against the repository-generated caches for PMID:27545674,
    PMID:27545681, PMID:28360427, PMID:28965491, PMID:33811063, PMID:37130202,
    PMID:38046095, PMID:38079206, PMID:40217280 and PMID:40333994. Existing caches were
    sufficient, so no reference was fetched or edited. The review distinguished direct
    human observations, in-vitro/biochemical or organoid work, in-vivo model results, and
    secondary literature synthesis; synthesis-only items from PMID:38079206 and
    PMID:38046095 are tagged OTHER rather than HUMAN_CLINICAL.

    Changes made:
    - Calibrated the disease identity and allelic model: DEE44 remains separate from
      UBA5-related SCAR24 and severe congenital-neuropathy presentations; most reported
      DEE44 genotypes pair a mild/partial-function allele (often p.Ala371Thr) with a severe
      allele, but partial-plus-partial exceptions mean residual activity contributes to,
      rather than uniquely determines, clinical severity. Added direct evidence for
      asymptomatic p.Ala371Thr homozygotes and structured the hypomorphic variant evidence
      by human and biochemical modality.
    - Added explicit UBA5 gene-to-mechanism wiring and separated adenylation/thioester
      formation, UFM1 transfer to UFC1, and reduced conjugation. Corrected the zebrafish
      free-Ufm1 contradiction by retaining conjugate loss and treating the free pool as
      assay-condition dependent. Replaced a fragmentary mitochondrial quote with direct
      ultrastructural observations and limited PINK1 to accumulation consistent with a
      damage response; no mitophagy-flux claim or GO mitophagy node remains.
    - Kept ER/UPR abnormality, GABAergic-interneuron development, aberrant organoid firing,
      organoid growth, and mitochondrial damage at the level demonstrated by their sources.
      No ER-to-interneuron or interneuron-to-firing causal edge is curated, and no
      excitation/inhibition directional module conformance is asserted. The firing
      direction and relationships among these cellular findings remain explicit knowledge
      gaps.
    - Expanded and recalibrated clinical coverage with reported epileptic spasms,
      hypsarrhythmia, multifocal epileptiform discharges, spasticity, respiratory failure
      in one child, cerebellar atrophy, and poor visual fixation. Imaging and EEG language
      was softened to the observed cases or clearly labeled synthesis; unsupported
      universals, burst suppression and unvalidated report percentages were not imported.
    - Refined sequencing and EEG diagnosis text and added differentials for other
      UFMylation-pathway disorders and the non-DEE44 UBA5 clinical presentations.
    - Re-scoped treatment evidence: antiseizure medications record transient vigabatrin
      response and later limited multidrug response; combined ACTH plus magnesium sulfate
      is a separate unsuccessful n=1 observation, not a refutation of antiseizure therapy;
      carbidopa-levodopa is inconclusive; and GPi deep-brain stimulation is limited to one
      case with four months of follow-up. No efficacy, standard-of-care or durable response
      rate is inferred.
    - Added a humanized UBA5 allelic-series Drosophila model and qualitative
      patient-derived organoid modeled mechanisms. Retained zebrafish findings with the
      relevant assay and human-tissue limitations. A germline-null mouse was considered
      only as a genotype-mismatch discussion because no directly cached original model
      source justified a structured entry.

    Considered but not added: unvalidated deep-research frequency estimates, a durable
    levodopa benefit, burst-suppression EEG, increased mitophagic flux, causal links from
    the organoid lineage defect to firing, a claim that no active trials exist, structured
    trial/dataset records without direct sources, and unsupported germline-null mouse or
    UBA5-spectrum lumping. Fourteen clinical phenotypes remain intentionally without
    mechanistic edges where the evidence establishes observation but not causality.

    The final content was independently audited, repaired, re-audited and approved at
    target blob cc1ce0b307ec478276f63e1bdb6755908d727f53 with SHA-256
    f4bad2ac6398b64e72f0284a8078e9e30e5d7ad411c964a861c31cbfd1dfc757.
    Target validation passed schema, ontology terms and references with 72/72 snippets;
    strict snippet boundaries also passed 72/72. Duplicate-key, source-defect-claim and
    diff-whitespace checks passed. The causal graph has 37 nodes, 24 edges, zero orphan
    targets and zero integrity issues. Phenotype connectivity is 5/19 (26.3%), with the
    remaining observations deliberately floating as noted above; causal gene connectivity
    is 1/1 (100%). Term/enum normalization changed zero cache files, and no
    references_cache or ontology-cache file was created or edited.

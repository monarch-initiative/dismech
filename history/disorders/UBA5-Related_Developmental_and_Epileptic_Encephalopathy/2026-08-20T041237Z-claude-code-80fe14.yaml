  summary: 'Create: UBA5-Related DEE (DEE44)'
  details: |
    New entry for DEE44 (MONDO:0014933, OMIM 617132, UBA5 hgnc:23230), curated from a claude_code deep-research run. NEC preflight PASS: UBA5 dominates at 58 mentions, UFM1/UFC1/CDK5RAP3 appear as pathway partners rather than rival entities, and the reported OMIM 617132 matches the MONDO xref. The report's own validator set needs_review true for one unsupported quote from PMC:PMC8208045; that quote was not curated, and the entry instead uses the real source sentence the validator surfaced as closest. Three ontology bindings proposed by the report were wrong and were corrected against OAK before use: HP:0002540 is Inability to walk, not appendicular hypertonia, so HP:0002509 Limb hypertonia was used; HP:0011451 is Primary microcephaly, not drug-resistant epilepsy, so the established KB convention HP:0020174 Refractory drug response was used. Separately GO:0071569 protein ufmylation is a biological process and is not valid in molecular_functions, where GO:0071566 UFM1 activating enzyme activity was used instead. No GeneReviews chapter exists for UBA5, verified with a query form validated against SCN1A as a positive control. Eleven references cited, seven of them with full text that was mined beyond the abstract. Pathophysiology is 12 atomic nodes with the ER-stress and mitochondrial arms placed in parallel rather than in series, because no source establishes precedence between them. Validation: just validate passed with 42 of 42 snippets verified; validate-terms, check-duplicate-keys, check_folded_hyphens, check_environmental_evidence, check-title-snippets and check_snippet_length all pass.

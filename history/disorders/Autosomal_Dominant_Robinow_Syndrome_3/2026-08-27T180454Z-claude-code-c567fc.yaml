  summary: 'Create: Autosomal Dominant Robinow Syndrome 3 (DVL3)'
  details: |
    Split out of the lumped Robinow_Syndrome entry, covering row NOS 15-0070. Deliberately leaner than the DVL1 entry because the literature is: the entity rests on five unrelated individuals, and the functional dissection that exists for the DVL1 frameshift has not been repeated for DVL3. The central node therefore claims only that Dishevelled-mediated transduction is altered, not a direction, and the dvl3_frameshift_mode_of_action discussion records the DVL1 analogy as a hypothesis rather than importing its conclusions. The DVL1-specific osteosclerotic variant is explicitly excluded. Both connectivity metrics 100 percent.

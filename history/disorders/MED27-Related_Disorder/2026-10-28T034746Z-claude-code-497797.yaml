  summary: 'Answer review of #15512: restore the correct disease name in the description'
  details: |
    The top-level description opened with the name of intellectual developmental disorder, autosomal recessive 74 (MONDO:0014951, the APC2 disorder) and an unsourced abbreviation, NEDDCHS. Restored the parenthetical to NEDSCAC, which matches the disease_term MONDO:0859137 and the synonyms. Removed two uncited statements: the synonym Ponto-cerebello-lental degeneration, which no cached source or the MONDO record carries, and the prevalence note that later international cohorts expanded the case count. Narrowed the Distal spasticity edge description to distal spasticity now that axial hypotonia has its own edge, and set the Axial hypotonia phenotype category to Clinical to match its siblings.

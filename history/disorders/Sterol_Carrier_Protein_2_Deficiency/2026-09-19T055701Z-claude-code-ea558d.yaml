  summary: 'Create: Sterol Carrier Protein 2 Deficiency (MONDO:0013391, SCP2)'
  details: |
    Created kb/disorders/Sterol_Carrier_Protein_2_Deficiency.yaml (MONDO:0013391, SCP2 /
    hgnc:10606), the peroxisomal SCPx thiolase deficiency also called SCPx deficiency or
    leukoencephalopathy with dystonia and motor neuropathy (LKDMN). Deleted the matching stub.

    Lump/split. Curated as a standalone Disease entry. MONDO:0013391 is a leaf (runoak descendants
    returns only itself) with one causal gene, and the knowledge base already curates each
    single-enzyme peroxisomal beta-oxidation defect separately (ACOX1, HSD17B4, AMACR, ABCD3).
    Every kb/ file matching "peroxisom" was checked; none is the right parent. The SCP2 string
    match in Congenital_Bile_Acid_Synthesis_Defect_5 is incidental - a fibroblast enzyme-panel
    line recording SCPx activity as normal in that patient, not a binding.

    Evidence base. Four human reports: PMID:16685654 (index patient, proven enzyme deficiency),
    PMID:26497993 (second patient, cached content_type unavailable so never quoted),
    PMID:37905191 (third patient, full text with a three-patient comparison table), and
    PMID:35996156 (a heterozygous variant-of-uncertain-significance case that PMID:38693715
    declines to accept, recorded in a discussion and not curated as a phenotype source).
    PMID:37236006 supplies the ClinGen Peroxisomal GCEP Moderate classification (6 GE, 4 EE) and
    the rename from the LKDMN phenotype label. Three mouse models: PMID:9553048, PMID:17068117,
    PMID:15574183.

    Sections curated: description, disease_term, mappings, parents, references, classifications,
    inheritance, genetic (3 variants), pathophysiology (5 nodes), phenotypes (18), biochemical
    (5), prevalence, progression, diagnosis (3), treatments (2), clinical_burden, animal_models
    (3), discussions (4), notes, review_notes.

    Deliberate omissions, all recorded in notes: no prevalence rate, no phenotype frequencies, no
    histopathology, no environmental section, and no curation of the disputed heterozygous
    patient's organ findings. 13 of 18 phenotypes are left causally unwired, each with the reason
    in its own description, because no reported work connects the metabolic block to a specific
    motor, psychiatric or sensory pathway. Module conformance is at
    peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect only, not at the
    module's central effector node, because that node asserts ether-lipid deficiency alongside
    substrate accumulation and this disease has only the accumulation half.

    Discussions include a HUMAN_MODEL_MISMATCH: the widely used Scp2 knockout deletes both gene
    products where the human disease leaves SCP2 transcribed from its own promoter, and it
    accumulates phytanic rather than pristanic acid. A proposed experiment (brain phenotyping of
    the SCPx-selective knockout) is attached.


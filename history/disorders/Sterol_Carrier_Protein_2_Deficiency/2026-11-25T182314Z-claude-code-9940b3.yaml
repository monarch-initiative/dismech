  summary: 'Gene-family review: SCP2'
  details: |
    The SCPx thiolase activity on 'SCPx Loss of Function' (GO:0050632, the 3-oxopristanoyl-CoA thiolysis reaction) carried modifier LOSS_OF_FUNCTION, the schema's qualitative value for activity driven outside its regulation by a non-genetic cause. It is now DECREASED, the quantitative reading that matches the deficient thiolytic activity and absent protein measured in patient fibroblasts (PMID:16685654); the variant consequence stays recorded as LOSS_OF_FUNCTION in genetic_context. The genetic record already carries the ClinGen Definitive classification.

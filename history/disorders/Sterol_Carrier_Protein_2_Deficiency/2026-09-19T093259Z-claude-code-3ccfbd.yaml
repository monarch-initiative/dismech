  details: |
    Review round 1 on PR #12290. The ai4c-reviewer bot submitted CHANGES_REQUESTED with two
    blocking items and three suggestions. All five were addressed in a single push; nothing was
    deferred and nothing was conceded that the entry had got right.

    Blocking item 1 - no deep-research artifact for a new entry. Accepted and run.
    `just research-disorder claude_code Sterol_Carrier_Protein_2_Deficiency` produced
    research/Sterol_Carrier_Protein_2_Deficiency-deep-research-claude_code.md plus its
    .citations.md sidecar, both committed. No _artifacts/ directory was produced by this
    provider for this run. The report was generated AFTER the entry was written and verified,
    and is recorded in notes and review_notes as a post-hoc cross-check rather than a source:
    no claim in the entry derives from it. Its value is what it converged on. It cites 11 PMIDs
    and they are the same 11 the entry already cited - zero new references - and it proposed no
    ontology term the entry did not already bind. just preflight-dr against MONDO:0013391
    returns PASS with SCP2 as canonical gene, mentioned 29 times. That is the evidence the
    reviewer asked for: the entry is narrow because the literature is narrow.

    Three claims in the report were refused and the refusals recorded in review_notes: patient 1
    "reported at 45" and patient 3 as a "young adult" are ages in no cached source, and the
    second contradicts the cited report, which describes a 48-year-old; and an "Orphanet-style
    class would be <1/1,000,000", which the report itself notes has never been published.
    prevalence_class stays NOT_YET_DOCUMENTED with measure_type CASES_IN_LITERATURE. The
    report's own reference validation flags one unsupported quote attributed to PMID:15574183,
    an ellipsis-elided paraphrase; the entry's own quote from that paper was copied from the
    cache independently and verifies exactly.

    Blocking item 2 - generic Pharmacotherapy binding with no therapeutic_agent. Accepted and
    fixed. The reviewer's three suggested CHEBI CURIEs were verified independently before use,
    against cache/chebi/terms.csv and with runoak, rather than pasted: CHEBI:7735 olanzapine,
    CHEBI:8707 quetiapine, CHEBI:49575 diazepam all resolve with matching labels. A second
    evidence item was added for the diazepam arm, which the previous single snippet did not
    cover.

    Suggestion 3 - uncaptured in-vitro rescue in PMID:35996156. Accepted. Added a treatment
    "Pharmacological Upregulation of SCPx (preclinical)" following the KB's existing convention
    for preclinical leads, with two IN_VITRO evidence items and two caveats carried in the
    description: the fibroblasts came from the one patient whose diagnosis this entry declines
    to accept, and upregulation is logically restricted to alleles that still make protein,
    where the first reported patient had no detectable SCPx at all. therapeutic_agent binds
    CHEBI:5001 fenofibrate and CHEBI:231618 4-hydroxytamoxifen. CHEBI:44616 afimoxifene was
    inspected and rejected: it is the better-classified entry but is specifically the Z-isomer,
    and the cited paper says only "4-hydroxytamoxifen", so binding it would have manufactured a
    narrower match than the source supports. Neither candidate is obsolete.

    Suggestion 4 - presence: MILDLY INCREASED was a one-off string. Accepted; changed to
    INCREASED, with the "raised only mildly" nuance already carried in the adjacent notes.

    Suggestion 5 - causal connectivity 5/18. Noted by the reviewer for the record only, with no
    change requested; none made. The 13 unwired phenotypes each state their reason.

    One fact was added from the report's phenotype section after independent verification: all
    three reported patients are male, quoted from the gender row of the PMID:37905191
    comparison table. It is recorded as an observation with an explicit statement that nothing
    is inferred from it, since SCP2 is autosomal and carrier parents are documented.

    Validation after the round: just validate and just validate-disorders both pass with 76/76
    snippets verified against cached references, up from 72/72. check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-case-collisions, check-stubs, check-genereviews and
    list-gene-term-mismatches (0 findings) all pass. just validate-research-reference on the new
    report reproduces the single upstream unsupported-quote warning described above.

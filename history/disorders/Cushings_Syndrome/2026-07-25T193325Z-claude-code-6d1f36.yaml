  summary: 'Review: myopathy evidence over-claim, unsupported osteoporosis, metadata
    gaps'
  details: |
    Correctness review. The entry is sourced entirely from one JAMA review (PMID:37432427). Proximal Muscle Weakness cited the snippet 'hyperglycemia, protein catabolism, immunosuppression...' as SUPPORT, but that sentence never mentions muscle weakness or myopathy - it supports only the catabolic mechanism. Regraded to PARTIAL with a corrected explanation. Osteoporosis is listed as a phenotype and in the disease description, but the cited abstract does not mention bone loss anywhere; rather than stretch an unrelated snippet, a note records the gap and points at the osteoporosis_bone_resorption module. Added evidence_source: HUMAN_CLINICAL to all 13 evidence items (all were absent). Added the missing classifications block (ENDOCRINOLOGY_METABOLISM). Removed a dangling empty 'datasets:' key. Follow-up needed: dedicated citations for glucocorticoid myopathy and glucocorticoid-induced osteoporosis, and a therapeutic_agent binding for the named steroidogenesis inhibitors and mifepristone.

  summary: 'Create: Transient Neonatal Hyperparathyroidism'
  details: |
    Created the entry for TRPV6-related transient neonatal hyperparathyroidism (MONDO:0032591) from a Falcon deep-research report (research/Transient_Neonatal_Hyperparathyroidism-deep-research-falcon.md) used as a lead source, with every claim re-sourced to the cached primary literature: the 2018 AJHG gene-discovery series (PMID:29861107), the 2026 fourteen-case literature review (PMID:41951207), the individual case and functional reports (PMID:30144375, 30820485, 32206464, 32228492, 32646367, 34884497, 41437274, 41522666, 41820796, 41885138), the Trpv6 mouse placental-transport and offspring-bone studies (PMID:18348695, 30786075, 33352987) and the human trophoblast stem cell-derived syncytiotrophoblast study (PMID:42685659). The pathograph runs TRPV6 channel loss of function -> impaired transplacental calcium transport -> fetal hypocalcaemia -> secondary fetal hyperparathyroidism -> PTH-driven bone resorption -> skeletal undermineralisation -> thoracic insufficiency, with a provisional placental protease/matrix node and a provisional postnatal enteral-compensation node that explains the transient course; 14 of 17 phenotypes are causally wired (the vitamin D deficiency modifier, polyhydramnios and the single-case cataract are deliberately left unwired). Inheritance is recorded as autosomal recessive with a separate single-case dominant-negative (p.Val625Glu) block; five characterised variants are recorded. Two mouse models and one human in-vitro system are linked through modeled_mechanisms with readouts and typed divergences; a KNOWLEDGE_GAP and a HUMAN_MODEL_MISMATCH discussion record the unmeasured postnatal recovery mechanism. No GeneReviews chapter, ORPHA record or ClinGen assertion exists for this disease, so none is cited. Therapeutic agents for the oral and intravenous calcium treatments are bound at the level the sources name (calcium, phosphate, vitamin D) rather than to a specific salt or vitamin D form, with a notes line on each treatment recording why. V
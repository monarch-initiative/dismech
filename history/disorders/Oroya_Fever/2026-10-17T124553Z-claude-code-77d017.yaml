  summary: Bind LOINC Bartonella smear and B. bacilliformis/16S PCR codes
  details: |
    LOINC tranche B batch 27. The thin blood smear row takes LOINC:13325-6 (Bartonella sp identified in Blood by Light microscopy), which matches specimen and method exactly and is genus-level as the row's own claim is. The direct blood PCR row takes two codes, one per primer set the row names: LOINC:105637-3 for the B. bacilliformis-specific assay and LOINC:76575-0 for the universal 16S arm, which is deliberately not organism-specific and therefore cannot be carried by any Bartonella code.

    LOINC has no B. bacilliformis code qualified to blood, so the species-specific code is bound at specimen level rather than substituting the genus-level blood code; keeping the species was preferred over keeping the specimen because the row's claim is about identifying B. bacilliformis. That genus-level blood code is also being introduced by another open branch, which is a second reason not to reach for it here.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

  summary: 'Create: Sideroblastic Anemia 3 (GLRX5)'
  details: |
    De novo curation of GLRX5-related sideroblastic anemia (MONDO:0014804) from a Perplexity sonar-deep-research report used as leads only; evidence rebuilt from PubMed. NEC preflight returned WARN on OMIM only (report cited 609588, the GLRX5 gene MIM; MONDO xrefs 616860, the SIDBA3 disease MIM) with GLRX5 dominating gene mentions 308 to 34, so this was a gene-vs-disease MIM mismatch rather than entity confusion. Scope decision recorded explicitly: GLRX5 causes two allele-dependent phenotypes, and this entry covers the isolated sideroblastic anemia phenotype only; the p.Lys51del neurological phenotype with variant non-ketotic hyperglycinemia is named as a boundary but left for a separate entry. Curated the zebrafish shiraz model as a structured animal_models entry with two RESTORED readouts capturing the reciprocal rescue experiments that make the IRP1-ALAS2 link causal rather than correlative, plus a HUMAN_MODEL_MISMATCH discussion for the severity divergence (embryonic lethality in fish vs middle-age presentation in humans, and absence of the iron-overload phenotype in fish). A second KNOWLEDGE_GAP records that the IRP2 arm is proposed rather than demonstrated, which matters because the proposed mechanism of the only beneficial treatment runs through it. Four snippets initially failed verification because the reference validator strips bracketed chemical cluster notation ([2Fe-2S], [Fe-S], [2Fe2S]) as if it were a citation marker; the quotes were verbatim, so they were requoted around the brackets rather than altered, and the tooling gap was filed separately. Validation: schema clean; 32/32 snippets verified; term validation passed after correcting a ring-sideroblast HP term to HP:0004864; folded-hyphen split found and reflowed; all five ungated CI gates clean; model-readout foreign-key tests passed.

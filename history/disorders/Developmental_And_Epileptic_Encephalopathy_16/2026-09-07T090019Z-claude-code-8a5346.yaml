  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED verdict on PR #11321. One blocking finding and one optional suggestion; both taken, with one correction to each.

    Blocking finding, accepted. The reviewer showed the entry was internally inconsistent about pan-spectrum data. It drew Global developmental delay (39/48), Cerebral atrophy (16/48), Cerebellar atrophy (11/48), Delayed myelination (5/48) and the multifocal EEG phenotype (35/48) from the pooled 48-patient TBC1D24 cohort, and quoted hypotonia from the very sentence that also reports ataxia and extrapyramidal counts, while omitting four associated findings from that same cohort. Visual impairment at 13/48 is commoner than cerebellar atrophy at 11/48, which was included. That is under-consumption, not a scoping decision, and the notes block's sourcing rule did not cover it.

    Added Visual impairment (HP:0000505, 13/48), Ataxia (HP:0001251, 7/48), Extrapyramidal signs (8/48) and Sensorineural hearing impairment (HP:0000407, 3/48 in non-DOORS patients). All four quote sentences already in the committed cache and carry no frequency, because the only counts available are pan-spectrum; each records that reason in its own notes. Ataxia is linked downstream of the cerebellar atrophy node and extrapyramidal signs downstream of the cortical circuit node, both INDIRECT_UNKNOWN_INTERMEDIATES since no source connects them to a specific step.

    Correction to the reviewer on one term. The review proposed HP:0001332 Dystonia for extrapyramidal signs. The source reports the category rather than a specific movement phenotype, so Dystonia over-specifies; bound HP:0002071 Abnormality of extrapyramidal motor function instead. The other three terms were used as proposed.

    The reviewer offered two remedies, the phenotypes or a scoping rationale. Both were done rather than one: the notes block now states that a pan-spectrum-only count is a reason to omit frequency, never a reason to drop the finding.

    Optional suggestion, accepted with a factual correction. The review described HP:0020174 Refractory drug response as sitting outside the phenotype hierarchy and suggested it only as a qualifier. OAK ancestors show it under HP:0000118 Phenotypic abnormality via HP:0020169 Abnormal drug response, so it is a phenotypic abnormality. Added as a qualifiers predicate-value pair on the Drug-resistant epilepsy phenotype, with NCIT:C102626 Drug Resistance Status as predicate. HP:0001250 Seizure remains the bound term, per the Ontology Term Contract, with the specificity in preferred_term. This is the predicate-value pattern CLAUDE.md reserves qualifiers for.

    Because qualifier terms sit in the validation blind spot documented in CLAUDE.md and are invisible to just validate-terms, just check-qualifier-terms-online was run specifically for this change; it resolved the uncached CURIE against OAK and both labels match.

    Validation: just validate-disorders passes, 105/105 snippets verified (up from 101). just test-kb passes, 3195 tests. check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-qualifier-terms-online, check-snippet-grading, check-folded-hyphens, check-title-snippets and check-snippet-length all clean for this file. The entry now carries 21 phenotypes.

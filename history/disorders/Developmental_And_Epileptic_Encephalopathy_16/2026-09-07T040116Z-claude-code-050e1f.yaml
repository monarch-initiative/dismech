  summary: 'Create: Developmental And Epileptic Encephalopathy 16 (TBC1D24)'
  details: |
    De novo curation of DEE16 (MONDO:0014133, OMIM:615338, biallelic TBC1D24).

    Deep research: falcon (Edison Scientific), 731s, report at research/Developmental_And_Epileptic_Encephalopathy_16-deep-research-falcon.md plus citations sidecar and one markdown artifact. The run's own validation reported 11/11 references resolved (confabulation_rate 0.0), 28/28 CURIEs resolved, 0 off-topic. Its needs_review flag was set by a single mislabelled-term entry naming MONDO:0014133 'if available' -- that is the research template's literal '(MONDO ID) (if available)' text being parsed as a label, not a bad binding, and was disregarded on that basis. The report carried no PMIDs (falcon cites by author-year key), so its 12 DOIs were swept from the body and converted via the PMC ID converter; all resolved except the Nature Reviews primer and a PhD thesis, and 10.1093/brain/awz175 turned out to be a paper already cited (PMID:31257402).

    Literature: 16 cited references, all PMID-keyed and cached. Core clinical basis is the GeneReviews TBC1D24 chapter (PMID:25719194, tagged GeneReviews in top-level references) plus the 48-patient pan-TBC1D24 cohort (PMID:27281533), the index MMPSI family report (PMID:23526554), and an independent drug-resistant series (PMID:27502353). Mechanism rests on the ARF6 interaction (PMID:20727515, PMID:24469796), the Skywalker phosphoinositide pocket (PMID:27669036), growth-cone and axonal work including patient iPSC neurons (PMID:30858606), presynaptic endocytosis in mouse (PMID:30335140, PMID:30602030), postsynaptic spine maintenance (PMID:32004315), and the TLDc domain (PMID:26668325, PMID:31257402, PMID:39214300).

    Curation decisions worth recording. Spectrum conflation is the main risk for this gene, so every pooled cohort figure is attributed to the pan-TBC1D24 series rather than to DEE16, and where PMID:27281533 reports its loss-of-function subgroup separately that subgroup is cited instead. Prevalence was left absent: no DEE16-specific denominator exists. The falcon artifact table offered a DEE16-specific onset figure (28 of 30 cases by 3 months) that could not be traced to a resolvable citation, so it was not used.

    Two evidence items are deliberately REFUTE. PMID:27281533's neurite-outgrowth result contradicts a simple residual-function model of the genotype-phenotype correlation, and PMID:39214300 reports no V-ATPase interaction for the TBC1D24 TLDc domain, contradicting read-across from OXR1/NCOA7. A third REFUTE on PMID:30335140 records that heterozygous carriers have been reported with seizures, against the GeneReviews statement that carriers are typically asymptomatic; both are cited on the inheritance block rather than one being suppressed.

    Death in childhood is curated with an unbound preferred_term. HP:0003819 and HP:0001522 both sit under Clinical modifier rather than Phenotypic abnormality, so they fall outside the PhenotypeTerm dynamic enum; the reason is recorded in the phenotype's notes. This follows existing KB practice.

    Conformance: three nodes declare conforms_to against synaptic_vesicle_cycle (Synaptic Vesicle Cycle Protein Deficiency, Impaired Synaptic Vesicle Endocytosis and Recycling) and epilepsy_excitation_inhibition_imbalance (Neuronal Hyperexcitability and Hypersynchrony).

    Validation: just validate-disorders passed (schema, terms, references; 85/85 snippets verified against cached references). Also green: check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-title-snippets, check-snippet-length, check-snippet-grading, check-folded-hyphens, check-stubs. Two self-inflicted gate failures were found and fixed before commit: line-ending hyphens in the folded description scalar, and one PMID:23526554 quote graded both HUMAN_CLINICAL and IN_VITRO, resolved by splitting the snippet so the human-genetics sentence and the functional-assay sentence are separate items. reference_title backfilled with just backfill-reference-titles.

    Side effects: fetching refreshed three existing cache files (PMID_25719194, PMID_30602030 cosmetically; PMID_39758816 upgraded from abstract to full text). Content was only added, and DOORS_Syndrome, the other entry citing PMID:39758816, was re-validated and still passes 34/34. The stub stubs/Developmental_And_Epileptic_Encephalopathy_16.yaml was deleted.

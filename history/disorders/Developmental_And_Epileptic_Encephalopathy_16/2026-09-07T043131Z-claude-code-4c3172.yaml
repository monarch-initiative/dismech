  summary: 'Review round: correct v-ATPase claim, microcephaly binding, and pan-spectrum
    frequencies'
  details: |
    Pre-PR adversarial self-review of the CREATE round, run in a fresh-context subagent against the dismech-pr-review protocol. It returned REQUEST_CHANGES with five blocking findings; all five are fixed here, along with the improvement items, in one push since any push drops an approval. Each finding was independently re-verified against the cached sources before acting on it.

    Correction to the CREATE record in this directory. That record states the falcon artifact's DEE16-specific onset figure (28 of 30 cases by 3 months) 'could not be traced to a resolvable citation, so it was not used'. That is wrong. The source is PMID:35350397, which the entry already cited twice, and which carries a 30-patient TBC1D24-DEE literature compilation. The earlier record is left as written because history is append-only; this record supersedes it on that point.

    Blocking fixes.

    1. v-ATPase. The TLDc node asserted, in its description, in a REFUTE evidence item, and in a discussion rationale, that no TBC1D24-v-ATPase interaction exists. The quoted sentence is background from the introduction of PMID:39214300 relaying an older purified-domain negative, not that paper's own result, and it is superseded by PMID:39758816, which demonstrates the interaction in mammalian brain. That cache file was upgraded from abstract to full text during the CREATE round, so the refuting primary was in hand and unused. Worse, kb/disorders/DOORS_Syndrome.yaml already models this as a pathophysiology node for the same gene, so the entry contradicted a sibling entry. Removed the REFUTE item, rewrote the description and rationale to present the purified-domain negative as superseded rather than settled, and added the missing mechanism as a new node, Impaired v-ATPase Assembly and Organellar Acidification, feeding the vesicle-recycling node.

    2. Progressive microcephaly was factually wrong. PMID:27502353 describes every patient as normocephalic with a falling centile, and its own table calls this head-circumference regression; 'microcephal' appears zero times across all three clinical references. Renamed to Decelerating head growth and unbound. HP:0004485 and HP:0040195 both assert more than the source does for a normocephalic child, so no term is bound and the reasoning is recorded in notes. An HPO new-term request is the right route.

    3. Pan-spectrum figures where a DEE-restricted source existed. PMID:35350397's 30-patient DEE compilation now drives onset (28/30 within 3 months, 6/30 in the first week), mortality (13/30, replacing the 19% spectrum figure that understated it by half), migrating focal seizures (17/30, the commonest type, now FREQUENT), myoclonic seizures (9/30, against the 60% spectrum figure inflated by the mild myoclonic phenotypes), and universal drug resistance. Where both figures are cited the pan-spectrum one is kept for contrast and its explanation says why the two disagree. The entry notes block was rewritten to state this precedence rule.

    4. Hypotonia carried frequency FREQUENT justified only by 'the most frequent neurologic sign', which gives no count; the same paragraph counts lower-ranked signs at 7/48 and 8/48, so the ranking is compatible with OCCASIONAL. Frequency dropped, reasoning recorded.

    5. Developmental regression cited a background sentence defining the syndrome class, and its own explanation conceded the snippet did not evidence regression. Replaced with a patient-level observation of motor and language regression from PMID:27502353.

    Improvements in the same push. evidence_source on PMID:30335140 corrected from HUMAN_CLINICAL to MODEL_ORGANISM (the publication is a mouse and cellular study; the carrier sentence is background) with directness INDIRECT. directness INDIRECT added to the PMID:20727515 hyperexcitability conclusion, which is an author inference from linkage genetics plus neurite assays in a mild-phenotype family, and is the sole evidence on the entry's central effector node. directness INDIRECT added to the TLDc edge item, whose in vivo demonstration uses an Oxr1 mutant. The ARF6-to-axon edge downgraded from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES because its snippet says 'was accompanied by', which is association. Three floating phenotypes (hypotonia, drug-resistant epilepsy, decelerating head growth) and the micro-exon root node connected to the graph. preferred_term on drug-resistant epilepsy changed from 'Seizure' to 'Drug-resistant epilepsy' so the display name keeps the distinction that separates DEE16 from the drug-responsive phenotypes. Cell types rebound from CL:0000540 to CL:0002608 hippocampal neuron and CL:0010012 cerebral cortex neuron. The bundled node 'Axonal Specification and Growth-Cone Endocytosis Failure' split into Growth-Cone Endocytosis Failure and Axonal Specification Failure with an edge between them, and the iPSC model link retargeted to the axon node it actually measures. A four-item diagnosis section added (molecular confirmation with phase, video EEG, brain MRI with its no-prognostic-value caveat, audiology). Ambiguous entity ref animal_models#Mouse disambiguated to the S324Tfs*3 model. therapeutic_agent added for zonisamide, topiramate, valproate and phenobarbital, each CHEBI-verified with OAK. Ketogenic diet gained the second DEE-restricted case, which recurred, and the description no longer implies durable benefit. The last-exon NMD-escape exception added to the truncating-variant description.

    Validation after changes: just validate-disorders passes, 101/101 snippets verified (up from 85). check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-snippet-grading, check-folded-hyphens, check-title-snippets and check-snippet-length all green. One gate caught a fix in progress: an abbreviated 3-word myoclonic snippet failed check-snippet-length and was replaced with the full sentence. Entry is now 14 pathophysiology nodes, 38 causal edges, 17 phenotypes, 4 diagnosis items; compliance 84.1%.

    Not done, and left for separate PRs: membership in the Early_Infantile_Developmental_and_Epileptic_Encephalopathies and Synaptic_Vesicle_Cycle_Disorders groupings, both of which this entry appears to qualify for.

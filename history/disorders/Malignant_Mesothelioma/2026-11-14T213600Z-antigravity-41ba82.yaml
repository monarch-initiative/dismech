  summary: 'Address PR #17572 review feedback: split proliferation and invasion nodes, add Cough, CheckMate 743, germline testing, and mesothelin evidence'
  details: |
    Corrected the Chest Pain explanation for the 77% palliative radiotherapy figure (DOI:10.5603/ocp.100725) and added direct symptom presentation evidence (PMID:8897628). Split Malignant Mesothelial Proliferation and Serosal Invasion into two atomic TISSUE nodes (Malignant Mesothelial Proliferation and Local Serosal and Chest Wall Invasion) with direct pleural/chest-wall invasion evidence (PMID:8897628). Added Cough (HP:0012735), added presentation evidence to Dyspnea, and marked Dyspnea, Pleural Effusion, Chest Pain, and Cough as pleural-predominant. Clarified MPM-only scope in prevalence notes, softened the NF2/Merlin Inactivation description to match PMID:23677068, aligned the asbestos association explanation and added PMID:21412769 carcinogenesis evidence, added PMID:19522163 evidence to the Mesothelin biochemical biomarker, added Germline Cancer Predisposition Testing (NCIT:C15709) under diagnosis, and added CheckMate 743 (NCT02899299, PMID:33485464) under clinical_trials and Immune Checkpoint Inhibition.

  summary: 'Migrate ILO assignment to split axis slot: Malignant_Mesothelioma'
  details: |
    Follow-up to the same-day session that added the occupational classification enums. On review it was decided that the ILO List of Occupational Diseases, being biaxial, should be modelled as two enums reached by two slots rather than one multivalued slot over a single enum: two slots sharing one enum would look like they enforce the axis while enforcing nothing.

    ILOOccupationalDiseaseEnum was therefore split into ILOCausativeAgentEnum (sections 1 and 3, 84 values) and ILODiseaseCategoryEnum (sections 2 and 4, 34 values), reached by ilo_agent_category and ilo_disease_category, which share a presentational LinkML slot_group with eu_occupational_category. Each axis enum declares in_subset so the axis is machine-readable.

    This entry's assignment moved from ilo_occupational_category to ilo_agent_category, because item 3.1.1 (cancer caused by asbestos) is a section-3 item, which dismech places on the causative-agent axis since section 3.1 is itself titled 'Cancer caused by the following agents'. The assigned value and its notes are unchanged.

    Provenance identifiers also moved out of prose and into LinkML metaslots in the same change (schema- and enum-level source/see_also), which does not affect this entry's content.

    Validated with linkml-validate against the Disease class (No issues found) and tests/test_occupational_classifications.py.

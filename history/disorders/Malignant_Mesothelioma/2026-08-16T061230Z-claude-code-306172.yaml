  summary: 'Add occupational/exposure classifications: Malignant_Mesothelioma'
  details: |
    Added disease-level occupational nosology assignments and, where applicable, agent-level exposure classifications, as worked examples for the new ILOOccupationalDiseaseEnum / EUOccupationalScheduleEnum classification slots and the ExposureClassifications container on Environmental.

    ILO List of Occupational Diseases (revised 2010): item 3.1.1 (cancer caused by asbestos), under the occupational-cancer section
    European schedule of occupational diseases (Rec. 2003/670/EC as amended): Annex I item 301.22 (Mesothelioma following the inhalation of asbestos dust)

    Deliberately paired with Asbestosis to demonstrate the orthogonality of ILO sections 2 and 3: the same asbestos exposure routes the non-malignant outcome to the target-organ-system section and the malignancy to the cancer section.

    No evidence blocks were added: a nosology placement is a definitional taxonomy mapping rather than an empirical disease claim, so provenance is recorded in per-assignment notes (revision, item number, annex), following the convention already used for ICIMD and ISDS assignments. No new PMIDs cited and no reference-cache changes.

    Validated with linkml-validate against the Disease class (No issues found), plus tests/test_occupational_classifications.py and the full tests/test_data.py suite.

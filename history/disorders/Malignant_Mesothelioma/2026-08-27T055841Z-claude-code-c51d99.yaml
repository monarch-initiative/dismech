  details: |
    Corrected classifications.icdo_morphology from 'Carcinoma' to 'Mesothelial Neoplasm'. Part of the ICD-O morphology enum completeness review recorded in docs/reports/icdo-morphology-enum-review-2026-08-27.md. The enum's original ten values all carried an ICD-O behaviour digit of /3, so it was a malignant-only histogenetic vocabulary; thirteen morphology families were added and the values that had been forced into a wrong bucket were corrected. Only classifications.icdo_morphology was touched in this entry; no mechanism, evidence or phenotype content was changed. The assignment carries a notes line recording the NCIT ancestry it rests on, verified against the NCI EVS REST API on 2026-08-27. Validated with linkml-validate against the Disease class, plus just check-duplicate-keys and just check-entity-refs.

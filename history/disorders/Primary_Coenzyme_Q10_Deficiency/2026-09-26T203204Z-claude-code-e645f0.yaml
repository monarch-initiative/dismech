  summary: 'Genetics pass: subtype MONDO bindings, genetic section, pathway-step nodes'
  details: |
    Genetics pass on the primary CoQ10 deficiency umbrella, recovering work that was
    deferred from issue #12255 and left behind when that issue closed (context in
    #12931). The entry had nine gene-defined has_subtypes rows, none of them bound to
    a MONDO class and none referenced by a subtype foreign key, and no genetic:
    section at all.

    Anchor. MONDO:0018151 was re-checked rather than inherited. Its exact synonyms
    include "coenzyme Q10 deficiency, primary" and "CoQ10 deficiency, primary"; its
    nine children are the primary numbered forms COQ10D1 to COQ10D9, each asserting
    one causal gene in its OWL axioms (COQ2, COQ8A, COQ6, PDSS1, PDSS2, COQ9, COQ4,
    COQ7, COQ5 respectively). Searches for a secondary class or a separate primary
    umbrella returned nothing. The binding is confirmed, not overturned.

    Curated. A subtype_term on all ten has_subtypes rows; a new COQ5 row
    (MONDO:0033615, COQ10D9), which the previous notes had deferred for want of
    citable gene-specific evidence that ClinGen's 2024 Moderate assertion and the
    2018 index report now supply; a ten-row genetic: section with reciprocal subtype
    foreign keys, CAUSATIVE relationship types, autosomal recessive inheritance and
    per-gene evidence; three mechanism-specific pathophysiology nodes splitting the
    pathway by the step each gene acts at (side-chain assembly and attachment for
    PDSS1/PDSS2/COQ2, benzoquinone head-group modification for COQ4/COQ5/COQ6/COQ7/COQ9,
    COQ8 kinase support for COQ8A/COQ8B), each feeding the pre-existing convergence
    node; four gene-stratified phenotype rows (COQ5 ataxia, COQ7 progressive
    neuropathy, COQ9 renal tubular dysfunction, PDSS1 optic atrophy); and three
    sourced causal edges from the multisystem-injury node to encephalopathy, seizures
    and nephrotic syndrome.

    Declined. HPDL gets no subtype row: MONDO files its disease as MONDO:0033614
    spastic paraplegia 83 under hereditary spastic paraplegia, and ClinGen's only
    HPDL assertion is Moderate against Leigh syndrome. COQ3, COQ10A and COQ10B were
    not added; no source consulted names them as human disease genes for this
    condition. No further phenotype edges were wired, because no cited abstract states
    the mechanism-to-phenotype step for the remaining nine.

    Observations recorded in notes. MONDO files the COQ8B disease outside this
    umbrella as MONDO:0014257 nephrotic syndrome type 9, so the COQ8B row's
    subtype_term is that renal class. The committed ClinGen gene_validity.csv row for
    COQ6 gives its disease as MONDO:0014754 "primary coenzyme Q10 deficiency 8",
    which is the COQ7 form; that row is not cited here.

    Also corrected: one evidence item in this entry graded a rat COQ6 localisation
    study HUMAN_CLINICAL; it is now MODEL_ORGANISM, matching the same quote in
    COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome.

    Validation. just validate 0 issues, 79 snippets checked, 70 titles checked;
    validate-terms passed; list-gene-term-mismatches-online 40/40 compared against
    HGNC with 0 findings; subtype foreign-key usage 0/9 to 10/10; phenotype causal
    connectivity 0/12 to 3/12; check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-case-collisions, check-environmental-evidence and
    check-coarse-phenotypes all clean.

    Orphanet could not be consulted: only records already cited from kb/ are present
    in references_cache, and just fetch-reference ORPHA:254886 returns "No source
    found for reference type".

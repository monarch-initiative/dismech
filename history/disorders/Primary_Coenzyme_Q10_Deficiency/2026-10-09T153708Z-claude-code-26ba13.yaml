  summary: Align CoQ10 head-group and COQ8 nodes with gene function; add variant_origin
  details: |
    Gene bindings for all ten genes re-checked (40 HGNC bindings, 0 mismatches; ClinGen tiers only for broader MONDO diseases, so not copied). Added variant_origin GERMLINE to the ten CAUSATIVE genetic records. Head-group modification node: replaced GO:0008682 (quinol, generic donor) with GO:0160224 for COQ7 (NADH-dependent), and added the catalytic activities of COQ4 (GO:0120539 C1 decarboxylase), COQ6 (GO:0106364) and COQ5 (GO:0008425), evidenced from PMID:38295803 and PMID:38425362 (newly cached). COQ8 node: added GO:0016887 ATP hydrolysis activity with PMID:27499294 abstract evidence (COQ8 lacks canonical protein kinase activity). COQ4 genetic notes updated to reflect its catalytic role. Validated with just validate, count-verified-snippets (86/86) and validate-terms.

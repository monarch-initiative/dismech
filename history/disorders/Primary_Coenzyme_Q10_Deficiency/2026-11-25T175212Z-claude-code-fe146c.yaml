  summary: 'Gene-family review: PDSS1, PDSS2, COQ2, COQ4, COQ5, COQ6, COQ7, COQ8A,
    COQ8B, COQ9'
  details: |
    Re-reviewed the ten CoQ biosynthesis genes against the 2024 COQ metabolon reconstitution (PMID:38425362) and the COQ4 oxidative-decarboxylation study (PMID:38295803). The side-chain (PDSS1/PDSS2 decaprenyl diphosphate synthase, COQ2 polyprenyltransferase), head-group (COQ4 C1 decarboxylase, COQ5 C-methyltransferase, COQ6 ferredoxin-dependent C5 oxygenase, COQ7 NADH-dependent hydroxylase) and COQ8 ATPase bindings were confirmed. COQ9 sat on the head-group node with no activity of its own; added lipid binding (GO:0008289) for it, supported by the COQ9 lipid-binding and COQ7-presentation work already cited on the node (PMID:25339443). ClinGen assertions for COQ5, COQ8B, COQ9, PDSS1 and PDSS2 are filed against lumped mitochondrial disease or Leigh syndrome and remain uncopied. COQ3 was checked and has no reported human disease, so it is not added.

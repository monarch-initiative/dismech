  summary: 'OI type XXI: add model-derived KDELR2 WNT arm plus HUMAN_MODEL_MISMATCH'
  details: |
    Second-pass enrichment for issue #5079 items 1-2, on the thinnest of the OI IX-XXIII entries. Added pathophysiology node 'Impaired GSK3-beta/Beta-Catenin Osteoblast Differentiation Signaling' capturing Wu et al. 2024 (PMID:38470494, newly fetched via just fetch-reference): lentiviral KDELR2 knockdown/overexpression bidirectionally controls mBMSC osteogenic differentiation, with active beta-catenin and phospho-GSK3-beta Ser9 tracking KDELR2 dose, plus mouse fracture-model healing. Evidence tagged IN_VITRO for the cell-culture readouts and MODEL_ORGANISM for the in vivo fracture model; the arm is curated as explicitly model-derived and wired as a parallel edge off the KDELR2-loss node, NOT as an established human mechanism. Added discussion gap_oi21_kdelr2_wnt_arm_human_translation, kind HUMAN_MODEL_MISMATCH per CLAUDE.md because the evidence exists but only in mouse while the human defining study PMID:33053334 localizes the lesion to failed HSP47 release, with two proposed experiments separating the WNT arm from the HSP47-collagen arm. Validated with just validate, just validate-terms, just validate-graphs, and a manual whitespace-normalized substring check of all 20 evidence snippets against references_cache.

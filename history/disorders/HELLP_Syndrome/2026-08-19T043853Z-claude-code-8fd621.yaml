  summary: 'Create: HELLP Syndrome (MONDO:0008585)'
  details: |
    New Disease entry for HELLP syndrome (MONDO:0008585), closing a real obstetrics gap (issue #8760; contributes to #7837). MONDO:0008585 previously appeared in kb/ only as a differential-diagnosis disease_term inside Antiphospholipid_Syndrome.yaml and Acquired_Thrombotic_Thrombocytopenic_Purpura.yaml, and as a has_subtypes entry on Preeclampsia.yaml; none of those is a curated entry.

    Scope decisions. The shared placental upstream with preeclampsia is represented by a single compressed trigger node rather than duplicated; the trophoblast-invasion and sFlt-1/VEGF detail stays on kb/disorders/Preeclampsia.yaml, which was deliberately NOT modified. A CONTROVERSY discussion (hellp_distinct_entity_or_pe_variant) records why that boundary is contestable, citing the 2026 French CONCEPTION cohort (PMID:42502666) for divergent risk factors and outcomes.

    Module conformance is node-qualified and partial. Three conforms_to assertions: "Microangiopathic Erythrocyte Fragmentation and Destruction" to hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction (the module explicitly admits mechanical/microangiopathic insults); "Platelet Activation and Consumptive Thrombocytopenia" to thrombogenesis#Platelet Adhesion, Activation, and Aggregation; "Hepatic Sinusoidal Microthrombosis and Fibrin Deposition" to thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation. The thrombogenesis module places VWF-platelet microangiopathy out of scope unless a distinct conventional thrombin/fibrin branch is explicitly evidenced; that condition is met by PMID:31877439 (sinusoidal microthrombi and fibrin deposition) and PMID:11924711 (autopsy-confirmed intrahepatic fibrin network). No conformance is claimed to the module's Virchow-triad, occlusion/ischemia, or embolization nodes.

    Hypotheses. Three mechanistic_hypotheses with honest status: shared_placental_antiangiogenic (CANONICAL), complement_two_hit (EMERGING, not CANONICAL - single case-control study PMID:29563339, mHam is a functional surrogate, eculizumab evidence is uncontrolled case reports plus a phase-1 trial NCT04103489), fetal_fao_defect_maternal_liver (ALTERNATIVE, allele-specific to HADHA Glu474Gln, PMID:10352164). Eculizumab is curated as investigational only, with a KNOWLEDGE_GAP discussion on complement causality and two proposed experiments. The fetal fatty-acid-oxidation entries (Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency, Mitochondrial_Trifunctional_Protein_Deficiency, Carnitine_Palmitoyltransferase_1A_Deficiency) were cited but NOT modified.

    Tennessee and Mississippi classification systems are curated as two separate definitions entries (DIAGNOSTIC_CRITERIA / ESTABLISHED_CRITERIA), with a note that they answer different questions (inclusion versus severity) and that the source review's prose and Table 1 disagree on the Tennessee platelet operator.

    Deep research. A falcon run was used (research/HELLP_Syndrome-deep-research-falcon.md; 719s, 17 citations, 5/5 references resolved, confabulation_rate 0.0). "just preflight-dr" against MONDO:0008585 returned SKIP - MONDO records no causal gene for HELLP - so the manual NEC checks in CLAUDE.md section 2b were applied: MONDO:0008585 has no OMIM xref (no OMIM disagreement possible); the report's top genes (CFH, CFI, CD46, CFHR1, ADAMTS13) are the expected complement/TMA susceptibility set, not a rival entity; the MONDO RELATED synonyms "PEE1" and "PREECLAMPSIA/eclampsia 1" are OMIM susceptibility-locus labels and were deliberately not used as search terms. The falcon report was used only as leads: every PMID was independently fetched with "just fetch-reference" and every snippet verified against the cached text. Two PMIDs recalled from memory during scoping (30089718, 10362824) turned out to belong to unrelated papers and were discarded before use - a reminder that recalled identifiers are not evidence.

    Validation. "just validate": schema and term validation pass. "just count-verified-snippets": 110/110 verified against cached references, 0 skipped by prefix. "just check-duplicate-keys": clean. "just check-title-snippets": no new title-quoting snippets. "just verify-datasets": geo:GSE66273 OK - a DIRECT candidate, manually triaged because the GEO series summary states the placentas came from women with severe preterm preeclampsia with or without HELLP syndrome; the GENE_ONLY HADHA candidates returned by the same search (cardiomyocyte and murine Treg series) were rejected as Named Entity Confusion. "just validate-disorders" was run as the pre-PR sweep. A selection of tests/test_data.py covering conforms_to references, subtype foreign keys, and unique names passed (6231 passed). Compliance 93.0% global, 93.3% weighted.

  summary: 'Review response: address reviewer findings and fix folded-hyphen CI failure'
  details: |
    Review-response session for PR #8882. Addresses the ai4c-reviewer CHANGES_REQUESTED verdict (1 critical, 5 important, 5 suggestions) and the failing `test (3.13)` CI job. Beyond the two additions in items 8 and 9 below, this session introduces no new claims; the bulk of it replaces snippets with better quotes already present in the same cached source.

    CI failure root cause. The failing job was NOT pytest. Two separate ungated checks failed in sequence, the second masked by the first. (a) "Check for folded-scalar hyphen splits" (scripts/check_folded_hyphens.py). Two lines inside YAML folded (>) scalars ended in a hyphen ("complement-" in the hemolytic uremic syndrome differential, "maternal-" in the NCT01138839 description), so folding would have inserted a space mid-compound. Both were reflowed so the compound word stays on one physical line; no wording changed. (b) With that fixed, "Check for new short evidence snippets" (scripts/check_snippet_length.py) then failed on eight snippets under its five-word minimum - six of them the very table rows quoted in response to review item 2, plus two pre-existing ones inherited from the original commit that the earlier failure had prevented CI from ever reaching. See the snippet-length paragraph below.

    Snippet-length guard versus review item 2. The two guards pull in opposite directions on this source. Review item 2 asked for the complete Table 3 row so the figure is not clipped; check_snippet_length.py rejects any snippet under five words, which most of those rows are. They cannot be joined either: each row ends in a numeric citation bracket, and conf/reference_validator_config.yaml strips bracketed spans from the snippet but not from the cached text, so a two-row quote never matches. Resolved case by case rather than uniformly. Eclampsia is quoted with the table's own header row ("Maternal complications Occurrence (%) References Eclampsia 4-9 [56]"), which is contiguous, clears the floor, and is better evidence than the bare row because it establishes that 4-9 is an occurrence percentage; the OCCASIONAL band is kept. Fetal growth restriction moves off the table entirely onto a quantitative prose sentence from the CONCEPTION cohort (PMID:42502666, 51.2% small for gestational age after PE-HELLP), which is stronger evidence than the review's agreeing 38-61% row; FREQUENT is kept. For placental abruption, pulmonary edema and severe ascites no prose figure exists in any cited source, so per CLAUDE.md ("when in doubt, omit frequency rather than fabricate justification") the band is dropped rather than hung on a quote that does not state it. Each cites the review's prose sentence naming it among the severe maternal complications that indicate immediate delivery, keeps the numeric range in the description, and carries a notes line recording the Table 3 figure, why it is not quotable, and what the band would have been. This partially walks back review items 4 and 6, which asked for OCCASIONAL on pulmonary edema and ascites; the reasoning is set out in a PR comment. The two pre-existing short snippets were extended to their full sentences.

    Review item 1 (critical) - prevalence class. prevalence_class on the meta-analysis record was BAND_1_5_PER_10000 (10-50 per 100,000) while rate_per_100000 was 390 with a 160-720 CI. Corrected to ABOVE_1_IN_1000, matching the two sibling records in the same block, and the incorrect notes sentence claiming the CI "crosses into" that band was replaced.

    Review item 2 - truncated snippets. Four snippets from PMID:19245695 had been clipped at the point where the figure they were cited for begins, even though the full figure sits on the same physical cache line. Replaced with the complete rows, copying the source's en dash verbatim: "Eclampsia 4" -> "Eclampsia 4-9" (both occurrences, phenotype and progression), "Abruptio placentae 9" -> "9-20", "Severe ascites 4" -> "4-11", and "class 3 requires only LDH > 600 U/L and AST" -> the same clause continued through ">= 40 U/L in" (all three occurrences). The last was the most serious: the clipped threshold was the entire content of the Mississippi class-3 definition.

    Review item 3 - LDH OBLIGATE. Elevated lactate dehydrogenase carried frequency OBLIGATE on a snippet about how intravascular haemolysis is diagnosed that never mentions LDH. Swapped for the Tennessee-criteria sentence already quoted elsewhere in the entry, which names LDH > 600 U/L as a required criterion and is the direct support for the band. The haemolysis-diagnosis quote remains where it legitimately belongs, on the Tennessee definitions entry.

    Review item 4 - pulmonary edema. Was cited to a mid-word fragment about GI bleeding and renal failure with supports PARTIAL and no frequency. The mid-word fragment is gone and supports is upgraded to SUPPORT; the reviewer's suggested table row could not survive the snippet-length guard, so the citation is the review's prose sentence naming pulmonary oedema among the complications indicating immediate delivery, and no frequency band is asserted (see the snippet-length paragraph).

    Review item 5 - headache. The FREQUENT band was backed by a snippet containing "about 20%", a different and lower figure mapping to OCCASIONAL. Replaced with "Up to 30-60% of women", the actual basis for the band. The cached source is a hard-wrapped PDF extraction and the clause continues onto the next physical line, so the sentence cannot be quoted whole; the explanation now states this explicitly rather than leaving a reader to wonder why the quote stops mid-clause.

    Review item 6 - ascites. VERY_RARE (1-4%) for a published 4-11% range, anchored on the single lower endpoint. The lower-endpoint anchoring was indeed wrong, but the replacement is no band rather than OCCASIONAL, because the 4-11% table row cannot be quoted under the snippet-length guard. The note is kept and rewritten to record the figure, that OCCASIONAL is what it would map to, and why no band is asserted.

    Review item 7 - preterm birth. VERY_FREQUENT rested on an onset-timing quote ("About 70% of the cases develop before delivery, the majority between the 27th and 37th gestational weeks"), which states when HELLP begins, not how often delivery is preterm. Replaced with a directly reported preterm-delivery rate, "Preterm delivery4 70 (15% < 28 gestational weeks)" (the trailing 4 is the source table's footnote marker), and the band corrected to FREQUENT. Fetal growth restriction likewise gained a direct figure and frequency FREQUENT; it previously had no frequency and no quantitative source. Its citation is the CONCEPTION cohort's 51.2% small-for-gestational-age sentence rather than the review's 38-61% table row, for the snippet-length reason above.

    Review item 8 - hepatic subcapsular hematoma / liver rupture. Added as a Hepatic phenotype, frequency VERY_RARE, grounded on HP:6000998 (Liver rupture) with two rows of the complication table as evidence (0.9% to under 2% for hematoma, about 1.8% for rupture). HPO defines HP:6000998 explicitly in terms of subcapsular hematoma formation beneath the liver capsule, so one term covers both; a notes line records that decision, and the preferred_term names both so the entry does not read as covering only the rupture endpoint. It had previously existed only inside a pathophysiology description.

    Review item 9 - untermed histopathology finding. "Glomerular endothelial swelling with bloodless glomeruli" has no finding_term; a notes line now records that this is a deliberate "no term beats a bad one" call rather than an oversight, and says what the candidate terms would have dropped.

    Review item 10 - low-dose aspirin. Deliberately NOT curated, with the reasoning recorded as scope note (5). Guideline-based aspirin is offered on preeclampsia risk and is not a HELLP-specific preventive - the deep-research report says so explicitly - so recording it here would import a preeclampsia-level preventive as though it were HELLP-directed, contradicting the boundary drawn in scope note (1). kb/disorders/Preeclampsia.yaml remains unmodified.

    Review item 11 - no change required, as the reviewer stated. The remaining hyphenated word-wrap fragments are unavoidable artifacts of the PDF cache and do carry their claims.

    Second review round. A re-review raised two further items. (a) The eclampsia band had been kept by quoting Table 3 with its header row prepended; the reviewer rejected that as padding a word counter while leaving exactly the unverifiable-table-cell citation the guard exists to prevent (issue #7450), and they are right. The evidence was repointed to prose from the CONCEPTION cohort (PMID:42502666) stating a 6.5% eclampsia rate among women with PE-HELLP, which states the figure in a sentence, needs no padding, and removes the band-straddle caveat because it is a single population rather than a pooled range. Both the phenotype and the magnesium-sulfate treatment evidence were repointed. (b) A cluster of ten snippets passed the word count but were not readable propositions - three ended mid-word at a hyphenated PDF line break, four ended on a dangling preposition, and the rest started or stopped mid-sentence. Whitespace is collapsed before matching, so a quote may cross a plain line break, but there is no de-hyphenation, so quotes at a hyphenated break were ended before the broken word rather than extended through it. All ten now read as complete statements: the Mississippi class-3 criterion runs through "in addition to the specific PLT count"; the headache quote now includes "have headache", so it states the phenotype and not only the percentage; the class 1/2 criterion, the platelet-transfusion trial result, the AFLP-overlap sentence, the HELLP-mimic list, and the hypertension/proteinuria absence figure were each closed off at a sentence or clause boundary.

    Reviewer suggestions also taken. The microangiopathic-hemolysis node dropped CL:0000235 (splenic red-pulp macrophage) and GO:0034102 (erythrocyte clearance): the cited evidence establishes mechanical fragmentation within the affected microvessels and says nothing about splenic macrophage-mediated clearance, so both were unsupported annotations on an otherwise well-evidenced node. Epigastric pain and nausea/vomiting rested on the same sentence but carried different bands; both are now VERY_FREQUENT via Pattern C ("typical") of docs/frequency-evidence-guidelines.md, with the shared basis stated in each explanation, and the snippet extended from a mid-phrase fragment to the whole sentence. The clinical_burden evidence explanation referred to a "SEVERE burden level"; ClinicalBurdenLevelEnum has no such value (LOW/MODERATE/HIGH/VARIABLE), so the wording was corrected to HIGH, which is what the entry already asserted. The suggestion to add a model-systems section was deferred, as the reviewer proposed, since no published model reproduces the complete human triad with gestational timing and postpartum resolution and only a FAILS_TO_RECAPITULATE or PARTIALLY_RECAPITULATES framing would be defensible.

    Not changed. kb/disorders/Preeclampsia.yaml and the three fetal fatty-acid-oxidation entries remain untouched, as in the original session.

    Validation. just validate: schema and term validation pass. just count-verified-snippets: 113/113 verified against cached references, 0 skipped by prefix. scripts/check_snippet_length.py: OK, no new snippets under 5 words. just validate-terms: pass. just validate-disorders (the batched pre-PR sweep CI runs): all checks pass, 113/113 snippets. just check-duplicate-keys: clean across 2334 files. just check-title-snippets: no new title-quoting snippets. scripts/check_folded_hyphens.py: OK, no new splits - the previously failing check. uv run pytest tests/test_data.py: full suite passed (exit 0); the foreign-key, unique-name and history selection was re-run after each round. The only cache rows added are HP:6000998 in cache/hp/terms.csv and the corresponding phenotypeterm enum cache row, both written by linkml-term-validator, not by hand.

  summary: 'Review fixes: MAVS node, IL-17A/IL-17RA split, phenotype edges'
  details: |
    Addressed the three blocking findings and one suggestion from the ai4c-reviewer CHANGES_REQUESTED review on PR 9209.

    (1) Removed the un-evidenced "Cardiac Fibroblast Infection -> Restrained Cardiac Type I Interferon Response" edge, whose description narrated the protective interferon response while its target was the restrained one, contradicting PMID:37537212. Added a "MAVS-Dependent Innate Sensing Failure" node (GO:0002753, DECREASED, PROVISIONAL) carrying the MAVS snippet, with an evidenced outgoing edge to the restraint node. The node is deliberately left without an incoming edge from infection: the source produces the MAVS deficiency genetically, not virally, so the reviewer-suggested route from infection to sensing failure would have reintroduced an un-evidenced edge.

    (2) Split the bundled "IL-17A Production and IL-17RA Signalling in Infected Heart Tissue" node into "IL-17A Production in Infected Heart Tissue" (GO:0032620) and "IL-17RA Signalling in Cardiac Tissue" (GO:0097400), joined by an evidenced downstream edge. Both are PROVISIONAL because cardiac localisation of IL-17A rests solely on PPR:PPR1294570; the serum measurement from PMID:35254128 is downgraded to PARTIAL on the production node because it cannot localise the cytokine to the heart. Repointed both discussions' attaches_to at the IL-17RA node. Dropped the cross-compartment IL-17A -> joint/muscle edge, since the peer-reviewed Il17a-null result is about joint and muscle tissue while the new nodes are explicitly cardiac; that result is retained as node-level evidence on the joint/muscle node.

    (3) Added downstream edges from "Cardiac Inflammation and Myocardial Injury" to the Myocarditis phenotype and from "Joint and Muscle Inflammation with Neutrophil Infiltration" to Arthralgia, both with verified evidence, so the pathograph now reaches distal clinical events.

    Also split the mixed-source HUMAN_MODEL_MISMATCH evidence item into a MODEL_ORGANISM mouse item and an IN_VITRO human-cardiac-fibroblast item, per the CLAUDE.md single-evidence_source rule.

    Validation: just validate passes schema, terms and references with "Snippets checked: 35/47 verified against cached references (12 skipped by prefix)" - the 12 skips are the legacy DOI rows in the pre-existing references block. just validate-terms clean with "Files updated: 0" (no cache churn). check-duplicate-keys, check-folded-hyphens, check-snippet-length and check-title-snippets all clean. check-environmental-evidence is clean against the branch base commit; its 5 findings against origin/main are pre-existing entries in Heart_Failure, Lyme_Disease and Merkel_Cell_Carcinoma that main has since fixed, i.e. a stale-branch artifact rather than anything this change introduces. 19562 targeted tests/test_data.py tests pass.

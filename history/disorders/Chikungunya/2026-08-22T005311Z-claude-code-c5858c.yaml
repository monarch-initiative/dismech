  summary: Add cardiac pathophysiology arm and IL-17A interferon-restraint hypothesis
  details: |
    Chikungunya had no pathophysiology section at all. Added a seven-node chain rooted on CHIKV replication in fibroblast-lineage target cells [PMID:18282093], branching into a cardiac arm - cardiac fibroblast infection, restrained local type I interferon response, persistent cardiac infection, myocardial inflammation and injury [PMID:37537212] - and a musculoskeletal arm of IL-17A-dependent joint and muscle inflammation with neutrophil infiltration [PMID:35254128]. Added a Myocarditis phenotype grounded to HP:0012819 with human systematic-review evidence [PMID:28503297] and deliberately no frequency band. Added one EMERGING mechanistic_hypotheses group, il17a_interferon_restraint, carried by a single causal edge and sourced to the preprint PPR:PPR1294570 that issue 8480 reports. Added a HUMAN_MODEL_MISMATCH discussion recording that the preprint interferon claim is made in a heterozygous interferon-receptor-deficient mouse, and a KNOWLEDGE_GAP discussion recording why IL-17RA blockade with brodalumab was deliberately NOT curated as a treatment. Validation: just validate passes schema, terms and references; snippets 30/42 verified against cached references with 12 skipped by DOI prefix; check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys all clean; a 2276-test selection of tests/test_data.py passed. All five new references fetched with just fetch-reference; no cache file hand-edited; no cache CSV churn.

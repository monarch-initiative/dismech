  summary: Drop target_phenotypes from the MONITORING surveillance action
  details: |
    test_non_therapeutic_actions_do_not_use_treatment_targets failed on treatments[0] 'Digestive surveillance for 10q deletion carriers', which declares action_category: MONITORING while also carrying a target_phenotypes link to HP:0004390 Hamartomatous polyposis. The schema's MedicalActionCategoryEnum states explicitly that MONITORING (like SCREENING and COUNSELING_INFORMATIONAL) actions must not use target_mechanisms or target_phenotypes, because those slots render as 'treats' edges in the pathograph and surveillance detects a manifestation rather than treating it. Removed the target_phenotypes block. Nothing is lost: HP:0004390 is already curated as a full phenotypes[] entry in this same file, with its own evidence (PMID:31561016) and a note restricting it to the contiguous-deletion subtype. Extended the action's description to name the surveilled manifestation and to state why the link is deliberately absent, so a later curator does not re-add it. This matches how other MONITORING entries in the KB are curated (Myofibrillar_Myopathy, Bosch-Boonstra-Schaaf_Optic_Atrophy_Syndrome, Wolf-Hirschhorn_Syndrome), which all carry the surveillance object in prose and no target slots. Validation: linkml-validate no issues; linkml-term-validator --labels passed; dismech.reference_snippet_audit clean over the file.

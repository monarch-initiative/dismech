  details: |
    Curation-scanner (high_effort) pass addressing the 2026-08-04 re-review of PR #7730.

    Item A (blocking) - banded the 10q Deletion subtype phenotypes from the delineating study's own cohorts rather than from Orphanet: Mild Facial Dysmorphism OCCASIONAL (8/41, 20%) and Congenital Cardiac Defect OCCASIONAL (5/41, 12%) from the 41-carrier rCNV cohort, both marked PARTIAL because the counts are reported at the HPO parent term and so bound the specific feature from above; a new Atypical Behavior (10q Deletion) aggregate at OCCASIONAL (5/41), with Autism and Hyperactivity left deliberately unbanded and annotated as to why (an aggregate count cannot be apportioned between them); and a new Talipes Equinovarus (10q Deletion) at OCCASIONAL (6/27) from the 27-case literature-review cohort. Both denominators are quoted as their own evidence items so the arithmetic is auditable.

    Item B (blocking) - added the Neurological Abnormality aggregate on the WAPL Variant subtype (HP:0000707, FREQUENT, 14/25 = 56%), mirroring how Behavioral Abnormality was already curated as an aggregate, with the figure-legend "about half of subjects" quote as independent corroboration of the band.

    Item C (standing gap across three reviews) - added research/WAPL-Related_Developmental_Disorder-claude-code-literature-sweep.md, a seven-query PubMed sweep run directly against NCBI E-utilities. It records the queries and hit counts, the four references incorporated, the findings deliberately excluded and why, and the residual gaps. It also records why "just preflight-dr" is not meaningfully applicable here (the entry carries no disease_term, and MONDO:0012830 is the contiguous-gene entity, so a FAIL there would be a true negative about the ontology mapping rather than an NEC signal), and flags the real distinct-entity risk the sweep surfaced: 10q23 deletion literature is dominated by a different, PTEN-containing interval, so an unconstrained DR query would plausibly return a coherent report about PTEN.

    Item D - added Hypotonia (OCCASIONAL, 4/25) and Decreased Head Circumference (OCCASIONAL, 2/25). HP:0040195 was used rather than HP:0000252 Microcephaly because the source reports a small head circumference without asserting a standard-deviation threshold. Both counts straddle a page-layout line break in the preprint, so each is supported by two single-line snippets rather than one cross-line quote.

    Item E - added the Deletion-Specific Malformation node (ORGANISM scale, PROVISIONAL) downstream of Contiguous Loss of Neighbouring Genes, so the WAPL-independent arm terminates at organism scale as the WAPL arm does. The preprint's equivalent-prevalence sentence is cited as PARTIAL, for the constraint it places on the node (shared features are deliberately NOT curated there) rather than as support.

    Item F - rewrote the wapl_pds5a_pds5b_validity rationale. The full text has arrived and does not resolve the question but does sharpen it: every PDS5A/PDS5B subject had neurodevelopmental and/or neurological features, so the negative result is a failure to coalesce into a syndrome rather than an absence of phenotype; and PDS5A/PDS5B truncating variants were pooled with WAPL in the one episignature analysis that succeeded, so that positive cannot be apportioned to them. relationship_type UNKNOWN is unchanged.

    Item G - the truncated episignature snippet is now paired with its continuation as a second evidence item rather than left mid-phrase.

    Also updated the wapl_10q_deletion_orphanet_phenotypes rationale so it no longer implies the deletion arm has no citable frequency data, and narrowed it to the feature-list gap it actually is (hypertelorism, cleft palate, joint hyperlaxity and the rest). Removed "club feet" from that list, since clubfoot is now curated on the subtype.

    New content surfaced by the literature sweep, all fetched with "just fetch-reference" and snippet-verified:

    - PMID:31561016 - Hamartomatous Polyposis (HP:0004390) on the 10q Deletion subtype. BMPR1A sits in the deleted interval; the reported adult had severe juvenile polyposis requiring preventive colectomy at 25 and died of gastric adenocarcinoma at 32, and the paper recommends active digestive surveillance. This is the entry's only cancer-predisposition and only actionable-surveillance content. Frequency deliberately omitted: a single case, plus the paper's own explicit ascertainment argument for under-reporting, is not a frequency estimate. The same PMID also strengthens the Contiguous Loss of Neighbouring Genes node, where BMPR1A had previously been only a putative cardiac candidate.
    - PMID:36449618 - added to Transcriptional Dysregulation (MODEL_ORGANISM) and to the Cornelia de Lange differential. Wapl-heterozygous mouse brain shows >1000 dysregulated genes with patterns highly similar to Nipbl+/-, published four years before the clinical delineation and explicitly predicting that WAPL would prove a human disease gene, so it is a non-circular prior for the entry's central chain. It also shows that lowering Wapl dosage partially corrects the CdLS model, which makes the two disorders antagonistic rather than merely adjacent.
    - PMID:33318687 - added to Transcriptional Dysregulation (IN_VITRO). Supplies the missing step between the folding defect and the transcriptional one, and corrects an intuition the loop-extension model invites: WAPL ablation depletes cohesin from cell-type-specific regulatory sites and loses promoter-enhancer loops, rather than simply leaving cohesin in place.
    - PMID:34070827 - added to wapl_pds5a_pds5b_validity as REFUTE (MODEL_ORGANISM). Pds5 knockout mice have cardiac, palatal and skeletal defects but no reported brain phenotype, unlike Wapl heterozygotes - the strongest available counterweight to PDS5A/PDS5B being neurodevelopmental disease genes. Recorded with the caveat that the two published Pds5 mouse models disagree with each other on redundancy and embryonic lethality, so this is not a settled negative.

    Validation: "just validate" passes on schema, terms and references. 65/91 snippets verified by the validator; the 26 skipped are DOI-prefixed preprint quotes that the validator skips by prefix, and these were hand-verified with a strict single-line substring check that rejects cross-line joins (0 failures). "just check-term-cache-integrity" OK. pytest tests/test_data.py subset: 1844 passed. Compliance 88.2% global / 88.6% weighted, up from 85.6 / 86.0. The repo-wide references_cache frontmatter churn that the validators produce was reverted; only the 4 genuinely new cache files are committed.

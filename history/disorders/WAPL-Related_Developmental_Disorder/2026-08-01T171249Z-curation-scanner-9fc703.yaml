  summary: 'Create: WAPL-Related Developmental Disorder (cohesin release factor; 10q22.3q23.2
    driver)'
  details: |
    New entry created in response to issue #6367 ([lit-scan:new] WAPL-Related
    Developmental Disorder), selected by the high-effort curation scanner as the
    oldest unassigned candidate in the queue.

    Scope. Curated the monogenic WAPL entity, with the recurrent LCR3-4-mediated
    10q22.3q23.2 contiguous-gene deletion modelled as a subtype rather than a
    separate page, following PMID:42431198's nomination of WAPL as the phenotypic
    driver within that interval. Phenotypes that the deletion literature
    attributes to other genes in the interval (breast aplasia -> NRG3, cardiac
    defects -> BMPR1A/GRID1) are curated on the deletion subtype and explicitly
    not attributed to WAPL.

    Mechanism graph. Eight pathophysiology nodes: heterozygous damaging WAPL
    variation and the recurrent 10q deletion both converge on impaired cohesin
    release from chromatin (GO:0140670 cohesin unloader activity, DECREASED) ->
    extended chromatin loops and altered genome folding (GO:0140588) ->
    transcriptional dysregulation (GO:0006357) -> impaired neurodevelopment ->
    developmental delay and intellectual disability, plus a model-organism
    dosage-liability-threshold node.

    NEC preflight. `runoak -i sqlite:obo:mondo search "l~WAPL"` returns no hits,
    so `disease_term` is deliberately omitted. MONDO:0012830 (chromosome 10q23
    deletion syndrome) was checked with `runoak info -O obo` and is used ONLY as
    a `skos:relatedMatch` mapping and as the deletion-subtype grounding, never as
    the disease_term, since it denotes the contiguous-gene entity. MONDO:0017180
    (the reciprocal duplication) is recorded as a differential.

    Evidence discipline. Six references, all fetched with `just fetch-reference`:
    PMID:42431198 (defining paper, abstract-only cache), PMID:17113138,
    PMID:28475897, PMID:29217591, PMID:17436248, PMID:21248748. All 44 snippets
    verified. No phenotype `frequency:` bands are asserted, because the defining
    paper is abstract-only and reports no per-feature counts. No treatments are
    curated. PDS5A and PDS5B are recorded with `relationship_type: UNKNOWN`
    because the source explicitly declines to associate them with specific
    phenotypes.

    Validation run in this session:
      just validate kb/disorders/WAPL-Related_Developmental_Disorder.yaml -> pass
      just validate-terms kb/disorders/WAPL-Related_Developmental_Disorder.yaml -> pass
      just validate-references kb/disorders/WAPL-Related_Developmental_Disorder.yaml
        -> pass, 44/44 snippets verified

    Outcome is `needs_followup` because four discussions remain open, the most
    important being full-text re-curation of PMID:42431198 once it is deposited
    in PMC (variants, per-feature frequencies, any methylation episignature).

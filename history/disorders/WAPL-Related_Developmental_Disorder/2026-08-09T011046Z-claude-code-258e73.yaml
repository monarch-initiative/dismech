  summary: 'Resolve duplicate-entry collision with #6378 and final review fix'
  details: |
    Merged origin/main into the PR branch. main had meanwhile gained an independently curated 322-line WAPL-Related_Developmental_Disorder.yaml from PR #6378 (dragon-ai-agent, merged 2026-08-07), colliding add/add with this branch's 2205-line entry.

    Resolved in favour of this branch's entry, which is a strict superset in coverage: 11 pathophysiology nodes vs 3, 20 phenotypes vs 2, 3 genetic records vs 1, plus subtypes, prevalence, animal and experimental models, diagnosis routes, differential diagnoses, 5 discussions and a references block that main's version has none of. main's version was read in full first and checked for unique content; two items were found and folded in: the "syndromic intellectual disability" parent term (used by 9 other entries including Cornelia de Lange), and main's earlier creation_date 2026-07-12T21:00:00Z, preserved so the entry's first-creation timestamp stays stable per the metadata-dates rule. main's PDS5A/PDS5B KNOWLEDGE_GAP discussion was already covered by this branch's equivalent discussion, and main's 3 pathophysiology nodes are all present here as a finer-grained chain.

    Other conflicts: references_cache/PMID_42431198.md resolved to main's copy (both were tool-generated; main's is the whitespace-normalized form) and cache/hgnc/terms.csv resolved to main's row for hgnc:23293. The PDS5A/PDS5B rows dropped by that resolution were re-derived by linkml-term-validator via just validate, not hand-written.

    Addressed the one remaining review item from review round 4: dropped "frequency: FREQUENT" from the HP:0000707 Neurological Abnormality phenotype. HP:0000707 is a strict ancestor of HP:0001263 global developmental delay, which is annotated VERY_FREQUENT (84%) disease-wide, and under HPO frequency propagation an ancestor term cannot be rarer than its descendant, so the 56% band was machine-readably false. The source's 14/25 count is kept in the description prose, and the constituents the source names (hypotonia 4/25, decreased head circumference 2/25) keep their own bands.

    Also fixed the red check_folded_hyphens CI finding (a line ending in "equivalent-" inside a folded scalar in the congenital-cardiac-defect explanation), and added YAML frontmatter to the research artifact so scripts/index_research_artifacts.py resolves its provider instead of recording None.

    Validation run: just validate (schema + terms + references) passed; just count-verified-snippets reports 65/91 snippets verified against cached references with 26 skipped by DOI prefix; just check-term-cache-integrity OK; scripts/check_folded_hyphens.py OK.

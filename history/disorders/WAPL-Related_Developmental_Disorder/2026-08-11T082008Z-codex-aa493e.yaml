  summary: Review WAPL-related developmental disorder evidence and scope
  details: |
    Reviewed the monogenic WAPL entity and the deliberately separated
    WAPL-containing recurrent-deletion subtype claim by claim. Fixed the
    pre-existing animal-model schema failure by naming the mouse dosage series.
    Narrowed sequence-variant mechanism language so engineered truncating
    haploinsufficiency is not generalized to every predicted damaging missense
    allele. Rebuilt the pathograph as nine mechanism nodes and ten evidenced
    edges: all edges now carry claim-level evidence, candidate neighbouring-gene
    routes remain explicitly emerging, and the folding-to-transcription and
    transcription-to-neurodevelopment routes are hypothesis-scoped rather than
    asserted as direct established causation. Removed the mouse-only dosage
    threshold from the human causal graph while retaining it in the animal model
    and HUMAN_MODEL_MISMATCH discussion.

    Corrected frequency/ontology alignment by binding the 41-carrier facial and
    cardiovascular counts to the same broad HPO parents used by the source,
    instead of using superclass counts to assign frequencies to narrower
    structural phenotypes. Narrowed diagnosis language to what the studies
    actually demonstrate, made the small-cohort episignature investigational,
    and added the source-recommended digestive surveillance only for the
    BMPR1A-containing deletion subtype. Preserved explicit open gaps for
    case-level variants, a monogenic MONDO term, and the uncached Orphanet tail.

    Final focused validation passed disorder schema, ontology terms, reference
    checks, graph target integrity, history schema, all-history validation,
    reference-cache and term-cache contracts, folded-hyphen guard, and the
    new-short-snippet guard. The standard validator verified 77/103 evidence
    snippets and skipped 26 DOI-prefixed preprint snippets by policy; all 26
    skipped snippets were independently normalized and verified against the
    tool-generated cached full text, yielding 103/103 total matches. All 10/10
    causal edges have edge evidence. D2P correctly skipped phenotype comparison
    because no monogenic MONDO term exists and reported no generated issues.

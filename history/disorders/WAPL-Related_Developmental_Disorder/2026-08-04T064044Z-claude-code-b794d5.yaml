  summary: 'Address PR #7730 review: curate from medRxiv preprint full text'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #7730 and resolved the merge conflict with main.

    Review item 3 (IMPORTANT): rebound the Hyperactivity phenotype from HP:0007018 (Attention deficit hyperactivity disorder) to HP:0000752 (Hyperactivity), an exact match for the reported feature, and restored supports: SUPPORT from the PARTIAL hedge.

    Review item 2 (IMPORTANT): fetched the medRxiv preprint of the defining study (DOI:10.64898/2026.02.23.26346364) with `just fetch-reference`. It returned full text (164853 characters), refuting the premise of the wapl_full_text_curation discussion that the detail had to wait for the PMC deposit. From that full text: added VERY_FREQUENT frequency bands with mild-to-moderate severity to Global Developmental Delay and Intellectual Disability (21 of 25 phenotyped individuals); added four new WAPL Variant subtype phenotypes with bands - Craniofacial Dysmorphism HP:0001999 FREQUENT (15/25), Behavioral Abnormality HP:0000708 FREQUENT (11/25), Talipes Equinovarus HP:0001762 OCCASIONAL (4/25), Congenital Cardiac Defect HP:0001627 OCCASIONAL (7/25); and added a DNA methylation episignature diagnosis entry recording both the positive result (a cohesin-release-factor-deficiency episignature, specific against the CdLS pattern) and the bounding negative result (no signature for WAPL SNVs alone, 0 of 8 LOOCV iterations), so the entry does not overstate the assay's diagnostic use. The discussion was rewritten rather than closed: case-level tables are redacted per medRxiv guidelines, so a variants block and facial-gestalt detail remain genuinely blocked on the peer-reviewed full text.

    Review item 4 (IMPORTANT): partially addressed. ORPHA:276413 could not be mined because `just refresh-orphadata` fails with a checksum mismatch on en_product1.xml against the pin in data/orphadata/MANIFEST.yaml; re-pinning the snapshot would rebuild every committed ORPHA_*.md file and is out of scope for a single disorder entry. Narrowed the overbroad notes claim that no ORPHA record could be cited, and opened the wapl_10q_deletion_orphanet_phenotypes discussion recording the blocker and the exact features to mine once unblocked.

    Review item 5 (SUGGESTION): added the Kueng PMID:17113138 sister-chromatid sentence as a third evidence item on Impaired Cohesin Release from Chromatin, which had carried a sister chromatid cohesion ABNORMAL descriptor with no snippet backing.

    Review item 7 (SUGGESTION): added a Cytoband coordinates paragraph to notes reconciling 10q22.3q23.2 with 10q22.3q23.3 as source-inherited labels for the same interval rather than competing claims.

    Review item 6 (SUGGESTION): added a "Contiguous Loss of Neighbouring Genes" pathophysiology node (NRG3, BMPR1A, GRID1) downstream of "Recurrent 10q22.3q23.2 Deletion", at PROVISIONAL mechanism confidence since the source proposes these as putative candidates. This makes the "explicitly NOT attributed to WAPL" decision structural rather than prose-only and keeps the pathograph a single connected component.

    Review item 1 (deep-research artifact) is not addressed in this pass and is called out explicitly in the PR comment.

    Validation: `just validate` passes (schema, terms, references). The reference validator skips DOI:-prefixed references (51/61 checked, 10 skipped by prefix), so all 10 preprint snippets were additionally verified by hand as whitespace-normalized substrings of references_cache/DOI_10.64898_2026.02.23.26346364.md - 0 failures. Focused pytest selection: 3660 passed. check_snippet_length.py reports 2 findings, both pre-existing on main in unrelated files (COA3-Related_COX_Deficiency, FG_Syndrome_1) and deliberately left alone. Weighted compliance 85.9%, up from 85.1%.

  details: |
    Review round on PR 9016 (Angelman syndrome fNIRS neurovascular biomarker). Removed both new phenotype entries, which bound HP:0001250 Seizure to an amplified and to a temporally altered cortical hemodynamic response - a false ontology match that also triple-asserted the entry's genuine seizure phenotype - and which carried an unsupported VERY_FREQUENT band and a novel free-text category Neuroimaging. The imaging_findings entry already carries the finding, so collapsing into it loses nothing. Corrected evidence_source on that entry: the human fNIRS cohort item is HUMAN_CLINICAL rather than IN_VITRO, and the UBE3A-restoration item is MODEL_ORGANISM because in the abstract that sentence sits inside the mouse intrinsic-optical-signal paragraph, before the human arm is introduced. Removed the species overclaim from the description, since treatment responsiveness is a mouse result. Added located_in visual cortex UBERON:0000411, modifier INCREASED for the amplitude component, and a notes block recording that the sole support is a preprint and that amplitude and timing come from one unreplicated cohort. Wired the mouse arm into the pathograph as suggested: the Ube3a maternal-deletion mouse now carries modeled_mechanisms against the node Cortical network hyperexcitability with abnormal EEG background as PARTIALLY_RECAPITULATES at MODERATE fidelity, with limitations recording that the readout is visually evoked hemodynamic amplitude rather than the epileptiform EEG the node names, plus two readouts - INCREASED intrinsic optical signal amplitude, and RESTORED response after UBE3A reactivation - each with its own evidence, so the biomarker connects to the rugonersen UBE3A-ATS treatment instead of sitting as a leaf. Validation: just validate, just validate-terms, just count-verified-snippets at 210 of 216 with 6 skipped by prefix, and check-duplicate-keys all pass, with no cache or references_cache churn included.

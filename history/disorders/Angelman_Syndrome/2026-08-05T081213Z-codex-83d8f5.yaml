  summary: 'Publication-readiness review: Angelman Syndrome'
  details: |
    Full publication-readiness review through 2026-08-05. Added structured prevalence, cohort-supported dysphagia and happy demeanor, human MRI white-matter volume findings, mouse and pig models, current rugonersen phase 1 and preclinical evidence, REVEAL phase 3, current qEEG biomarker evidence, and explicit translational, efficacy, and gastrointestinal-mechanism gaps. Removed unsupported autonomic/enteric and broad signaling mechanism nodes, tempered deletion-associated GABA-A cluster causality, and qualified symptomatic-treatment mechanisms. Verified all eight trial statuses against ClinicalTrials.gov. D2P disposition: accepted dysphagia and happy demeanor and represented human brain imaging as an imaging finding. Rejected absent speech in favor of directly supported severe speech impairment. Did not import delayed myelination as a human phenotype because the direct human evidence supports white-matter volume reduction while delay was demonstrated in mice. Retained broader seizure, EEG, feeding, gait, microcephaly, sleep, and strabismus terms where suggestions were redundant child terms. Did not import generic or occasional craniofacial, ophthalmic, behavioral, endocrine, motor, or gastrointestinal suggestions without claim-level evidence and pathograph value. The remaining connectivity warning treats a chromosomal-region genetic mechanism as a gene label. All 35 phenotype nodes are connected and UBE3A is wired to the mechanism graph.

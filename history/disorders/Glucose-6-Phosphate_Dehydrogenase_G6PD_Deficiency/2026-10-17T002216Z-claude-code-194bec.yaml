  summary: Bind G6PD enzyme activity LOINC Part code on the biochemical marker
  details: |
    LOINC tranche H batch 3. This disease has no diagnosis: section, so the LOINC binding goes on the existing 'G6PD Enzyme Activity' biochemical marker's loinc_term rather than on a measurements list, since this disease is itself the enzyme deficiency and the activity assay is its own diagnostic test. Searched the gene-symbol abbreviation 'G6PD' (surfaces only sequencing/mutation-analysis codes) and the spelled-out enzyme name 'glucose-6-phosphate dehydrogenase' qualified with blood/erythrocytes (surfaces the full clinical family: a method-free Part code, nine quantitative activity codes differing by unit and method, a second Part code for the phenotype concept, and two [Interpretation] codes). Bound the Part code, LOINC:LP15601-5 'Glucose-6-Phosphate dehydrogenase', per the within-family order of preference established on Drug-Induced_Methemoglobinemia (Part code, then quantitative assay, then never the interpretation or comment field). Confirmed LP15601-5 absent from origin/main before seeding, and label verified fresh from the Monarch KG entity endpoint.

  summary: 'Create: Spermatogenic_Failure_100'
  details: |
    New entry for MONDO:0978302 (DNAH12-related SPGF100), curated from the open stub. Evidence comes from the full texts of PMID:40146200 and PMID:39071892 and the abstracts of PMID:42321500 and PMID:42522280, all fetched with just fetch-reference. PMID:34089056 is mentioned only as a historical candidate report. The causal chain runs from DNAH12 protein loss, to failed recruitment of DNAH1 and DNALI1, to loss of the inner dynein arm and central pair, to MMAF and the phenotypes. A flagellum-specific requirement hypothesis is recorded as EMERGING. The knockout mouse link records a sperm-count difference from the human cohort. The sperm head phenotype is deliberately left unconnected because its mechanism is unknown. A falcon research-disorder run failed because the recipe requires an existing KB file, so this entry uses no deep-research report. The companion ai-gene-review DNAH12 gene review was written in the same session. Validated with just validate (25/25 snippets), count-verified-snippets, check-genereviews --online (NO_CHAPTER), check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values.

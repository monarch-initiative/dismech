  summary: 'Genetics pass: bind all five MONDO subtype classes on two axes; wire FGFR2
    into the pathograph'
  details: |
    Genetics pass for issue #12272 (d2g series-065). Anchor check first: disease_term MONDO:0007043 Pfeiffer syndrome is the entry's own concept and its own description says the entry covers the whole disease, both loci and all three subtypes, so the checklist rows were nominated because the subtype rows carried no bindings rather than because of an over-broad anchor. The reciprocal check also passes: every subtype_term written here is a child of MONDO:0007043.

    Curated. MONDO has five children of MONDO:0007043 on two axes, and all five are now accounted for. The three pre-existing clinical severity rows were bound: Type 1 to MONDO:0019659, Type 2 to MONDO:0019660, Type 3 to MONDO:0019661, each with an inheritance block - autosomal dominant with penetrance COMPLETE and expressivity VARIABLE for type 1, HP:0003745 Sporadic for types 2 and 3. Two gene-defined rows were added for the checklist classes: FGFR1-related bound to MONDO:1060146 with genes hgnc:3688, and FGFR2-related bound to MONDO:1060147 with genes hgnc:3689, both autosomal dominant. Both genetic rows gained relationship_type CAUSATIVE.

    The two axes are non-disjoint and both rows say so in their descriptions. No source found supports a one-to-one gene-to-type mapping, and one counterexample is cited: PMID:40620881 reports an FGFR2 variant in a patient classified as the mild type 1, alongside PMID:33074973's series of twelve patients with severe FGFR2-associated disease. The Europe PMC queries are recorded in the FGFR1 genetic row notes.

    Pathograph wiring. FGFR2 reached no pathophysiology node before this pass, although FGFR1 did. A parallel FGFR2 gain-of-function signaling in cranial sutures node was added, conforming to the same module node as the FGFR1 one (fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation), with GO:0004714 and GO:0008543 both INCREASED and downstream edges to Accelerated cranial suture osteogenesis and Limb and Digital Skeletal Patterning Abnormality. Both genes are now WIRED_DIRECT under subtype-usage-audit.

    Defect found and corrected. The FGFR1 genetic row's notes asserted that FGFR2 "can cause all three types". That claim was not supported by any source consulted, and the note was rewritten to the two claims that are - FGFR1 as the minority locus with a mild-associated recurrent allele, FGFR2 as the majority locus - with the searches named. Two new abstract-only caches were fetched and both are cited: PMID:40620881 and PMID:33074973. PMID:7874169 (the primary FGFR1 report) and PMID:25251565 (the p.Pro252Arg family) were already committed and uncited, and now carry the FGFR1 row.

    GeneReviews baseline: no chapter is titled for this disease, but FGFR Craniosynostosis Syndromes Overview (PMID:20301628, NBK1455) is the covering chapter and is already cached; its cached body is the chapter's purpose statement only, so it carries no quotable gene-to-type content and primary literature was cited instead. ClinGen's FGFR1-Pfeiffer grade could not be read: the committed CGGV caches hold the FGFR2 assertion only and the gene-validity CSV is not in the repository. Orphanet has no cached record for Pfeiffer syndrome.

    Self-review against the caches changed five passages of the first draft: an unsourced "almost a single-allele entity", a "23-year craniofacial-unit series" whose methods sentence was not among the quoted snippets, an "Unlike the FGFR1 form" comparison that implied an unchecked negative about FGFR1, a "the one ClinGen grades as definitive" that implied the same, and a node description asserting cranial suture mesenchyme that this node's own evidence does not name. Two citations were added where descriptions had run ahead of the evidence.

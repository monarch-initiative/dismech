  summary: 'Review: resolve scope mismatch and add the three clinical subtypes'
  details: |
    The entry asserted disease_term MONDO:0007043 - Pfeiffer syndrome as a whole - while its description restricted it to "FGFR1-related Pfeiffer syndrome specifically", stating FGFR2 cases "are not covered here". That contradicted the entry's own genetic block, which already curated FGFR2 with ClinGen Definitive evidence. A scope contradiction, not merely a stale sentence.

    Resolved in favour of the whole disease, which is what the disease_term claims. The description now covers both loci (FGFR1 on chromosome 8, FGFR2 on 10q25, the latter accounting for the majority) and all three clinical subtypes, and states plainly what the previous scope was and why it changed.

    Added has_subtypes for the three Cohen 1993 subtypes (PMID:8434615), which the entry's own prose already referenced without curating: Type 1 (classic, normal intelligence, good outcome, the dominantly inherited form), Type 2 (cloverleaf skull with elbow ankylosis, sporadic, poor outcome), Type 3 (as type 2 without cloverleaf skull, severe proptosis, short anterior cranial base). Cohen's own caveat is preserved in the description - the three subtypes do not have status as separate entities - and the type 3 entry records why recognizing it matters diagnostically.

    Added two-locus evidence to the FGFR2 genetic block (PMID:7795583), including that an identical FGFR2 allele is reported in both Pfeiffer and Crouzon syndrome, so genotype does not separate them - the digital features do. Broadened parents from "FGFR1-related disorder" to "FGFR-related disorder" to match.

    Not done: per-subtype phenotype assignment. The phenotypes are currently unsubtyped and assigning them needs per-feature evidence rather than inference from the subtype definitions.

    Validation: just validate PASS; just validate-terms PASS; just validate-disorders (batched) PASS; snippets 37/37 verified.

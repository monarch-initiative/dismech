  summary: 'Review: record the posterior ischaemic optic neuropathy complication of
    repeat midface advancement'
  details: |
    Pfeiffer was the lowest-compliance member of the FGFR-Related Skeletal Dysplasias grouping (72.9%). Added evidence to the Midface advancement surgery treatment recording the first reported paediatric case of bilateral posterior ischaemic optic neuropathy after craniofacial surgery, in a 13-year-old with Pfeiffer syndrome undergoing Le Fort II advancement (PMID:42153645). The attributed mechanism - bicoronal flap tightness from scarring left by prior Le Fort III surgery, combined with intraoperative permissive hypotension and anaemia - is specific to the repeatedly operated syndromic craniosynostosis patient, which is the population this entry describes.

    Both evidence items are marked PARTIAL and the description states that this is a single case establishing a mechanism, not a rate. No frequency or risk claim is made.

    Not addressed in this pass, and left as open gaps for a future curation: this entry still has no prevalence records, no has_subtypes (the entry is deliberately scoped to the FGFR1-related form, so adding the standard clinical Types 1-3 would need a scope decision first), and no discussions.


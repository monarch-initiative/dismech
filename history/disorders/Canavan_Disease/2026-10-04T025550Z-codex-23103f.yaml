  summary: Review Canavan clinical spectrum, competing mechanisms, intronic ASPA insertion
    and gene-therapy evidence
  details: |
    Review of Canavan disease without prior REVIEW history; genetic disease is eligible under the infectious/environmental/poisoning exclusions. Rebased review/astra-canavan onto origin/main (0954be8567e28f60bf89c336603394b30af52a31) before review; no open KB/history overlap at selection.

    Cross-checked the full scientific body and citation list of the Falcon research report. Phenotype, subtype, genetics, diagnostic biomarkers, treatment/trials, and models now cover the central themes. Added typical/atypical presentation records, corrected hearing/optic-atrophy/age-dependent seizure interpretations, and distinguished experimental mechanistic hypotheses from observed abnormalities. No independent phenotype record or mechanism was inferred from animal-only clinical signs.

    GeneReviews PMID:20301412 is tagged and all four baseline domains are supported: clinical features, diagnosis, management, genetic counseling. The full June 23, 2026 chapter was obtained with just fetch-reference via https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/ after ordinary Bookshelf paths returned CAPTCHA pages. Used diagnosis, typical/atypical clinical description, genotype/phenotype, differential diagnosis, management/surveillance, counseling and molecular-pathogenesis sections. CAPTCHA responses are not evidence and are not included in the PR.

    Used full text of PMID:34011350 (23-patient natural history; pooled survival n=82), PMID:28101991 (patient phenotypes and HEK293 functional assays; Ile170Thr uncertainty), PMID:20637282 and PMID:22617649 (model myelination/energetics), PMID:38582917 (mechanistic synthesis), PMID:25712859 and PMID:26511242 (Nat8l perturbation and survival limits), PMID:29456021 (Nat8l suppression), PMID:37601414 (single-patient AAV9 report), PMID:38538326 (rat histology and negative neurological/neuron-count findings), and PMID:40995055 (deep intronic insertion and fibroblast RNA). Read the 2025 phase 1/2 gene-therapy full-text PDF, cache-fetched from the sponsor-hosted copy of the published article, alongside PMID:40957959. Retained procedure-related SAEs and nonsignificant GMFM-88 results; biochemical response is not established functional or survival efficacy.

    The intronic insertion is separated from aberrant splicing and RNA degradation. No unsupported all-tissue expression category is assigned. The insertion paper makes genomic data available on request through data-sharing agreements; no public GEO dataset accession was reported. No retired dataset-accessions file was used.

    Current registry API checks on 2026-10-04: NCT04998396 RECRUITING (last posted update 2026-04-17), NCT04833907 ENROLLING_BY_INVITATION (2025-11-14), NCT05317780 NO_LONGER_AVAILABLE (2023-08-23; expanded access, retained in case-treatment context rather than misclassified as an active trial). Distinct phase-1/2 studies retain PHASE_I with explanatory notes because the schema takes one phase.

    Bound ASPA activity to specific GO:0019807 after runoak search; verified clinical HPO bindings using OAK and authoritative term validation. Retained the existing node-class reference. Full-text caches were generated only by just fetch-reference and normalized by repository tooling. No manual cache editing.

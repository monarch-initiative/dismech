  summary: Review Tay-Sachs model, clinical continuum, experimental mechanisms and OpenScientist report
  details: >-
    Reviewed the full disease YAML, complete OpenScientist report/citation sidecar, matching Falcon research, all 33 provider-cited sources, primary clinical/model follow-up literature, GeneReviews clinical/diagnostic/genetic/management sections, and live ClinicalTrials.gov records. Identity preflight passed. Checklist: corrected proximal HexA/GM2 hydrolysis and residual-activity continuum; reviewed every pathograph node/edge and removed unsupported retinal-to-blindness causality; qualified myelin formation versus loss and model-to-human transfer; checked subtype onset/progression, phenotype frequencies and denominators, motor/cognitive/psychiatric/peripheral and sphincter findings, enzyme versus DNA diagnosis, pseudodeficiency/B1 assay pitfalls, inheritance and variant effects, differentials, clinical management and treatment evidence. Added source-qualified ER calcium/PERK/CHOP perturbation, autophagy/lysosomal-integrity, prenatal developmental findings, explicit gaps, four animal and three cellular/organoid models. Reviewed gene-therapy, HSCT, miglustat, pyrimethamine, venglustat, N-acetyl-L-leucine and nizubaglustat evidence and nine trial records. Separated CSF target engagement from clinical surrogacy and plasma diagnostic discrimination. Corrected missed 2022/2025 human AAV results, juvenile dystonia, 2023 fetal transcriptomics and AMETHIST biomarker/clinical dissociation. Created a 27-claim authoritative Codex assessment with exact report anchors, retained/qualified/rejected dispositions, data provenance and five unexecuted proposed tests. All three GEO accessions verified using sanctioned reference-cache retrieval; regional libraries distinguished from donors. No raw-data reanalysis or claim of exhaustive literature completeness. References generated exclusively by sanctioned fetch-reference; no hand-editing of caches or frozen dataset accession blob. Validation: schema, ontology terms and exact evidence snippets; assessment/history schemas and semantics; duplicate keys, entity references, causal targets, enum/qualifier, folded-hyphen, title/snippet/source classification, reference titles and term-cache integrity gates; pre-commit checks. Final scoped diff reviewed before PR. Remaining mechanistic uncertainty is explicitly retained rather than fabricated connectivity.

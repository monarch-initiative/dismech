  summary: Add hexosaminidase A/B panel measurements binding (tranche D batch 1)
  details: |
    LOINC tranche D batch 1 (enzyme activity and metabolite assays). Added measurements: to the existing 'Combined enzyme and molecular diagnosis' diagnosis[] row, binding LOINC:21328-0 (Beta-N-acetylhexosaminidase A and B [Interpretation] in Blood). No specimen-generic Part code exists for hexosaminidase A alone (NLM Clinical Table LOINC search for 'Hexosaminidase A' returns only specimen- and method-specific codes, no LP-prefixed Part, confirmed by direct query at write time). Bound the HexA-and-HexB interpretation panel instead of a single-analyte code because the diagnostic claim both this entry's cited GeneReviews chapter and its own description make is the HexA-versus-HexB comparison, not a single analyte reading; GeneReviews (PMID:20301397) also states the assay is performed 'in the serum, white blood cells, or other tissues', so no single specimen-specific code would represent the claim, and the panel code is specimen-generic at the Blood level. No reference_ranges band: the source states 'absent to near-absent' HexA activity qualitatively, with no numeric cut-off. LOINC:21328-0 confirmed against the Monarch KG API in the step written, then seeded; no third-party copyright notice required. No collision with this code on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

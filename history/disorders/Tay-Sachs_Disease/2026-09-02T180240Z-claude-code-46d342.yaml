  details: |
    Assessed kb/hypotheses/Tay-Sachs_Disease/canonical_hexa_gm2_ganglioside_neuronal_storage_model/openscientist.md (verdict SUPPORTED; sidecar openscientist-assessment-by-claude-opus-5.yaml, 15 claims) and integrated its RETAINED/QUALIFIED findings.

    CORRECTED: the hypothesis description asserted that a Hexa/Hexb double knockout recapitulates the human phenotype. PMID:8896570 shows that genotype adds mucopolysaccharidosis features absent from Tay-Sachs and Sandhoff model mice and from human patients; the infantile-phenotype model is the Hexa/Neu3 double knockout (PMID:41819452), because the mouse sialidase Neu3 bypasses the HexA block (PMID:28442549). Added a REFUTE item for the old claim and a SUPPORT item for the corrected one. Also corrected the hypothesis notes, which asserted that no human gene-therapy data exist: PMID:35145305 (already cited under Gene Therapy) reports first-in-human safety and proof-of-concept, and PMID:36700853 with geo:GSE224860 (already curated) is human fetal Tay-Sachs brain transcriptomics, so two of the report's six declared knowledge gaps were checked and rejected rather than adopted.

    ADDED: structural-specificity evidence on Hexosaminidase A deficiency (PMID:16698036, alpha-subunit-only GM2 hydrolysis); two pathophysiology nodes downstream of GM2 storage, "Impaired autophagic flux and lysosomal permeabilization" (PMID:34831346) and "PERK-mediated unfolded protein response activation" (PMID:37108372), both marked in notes as cellular-model evidence without in vivo Tay-Sachs validation, with edges from GM2 ganglioside accumulation in neurons and to Neuron death; storage-before-inflammation ordering evidence on Neuroinflammation and Astrogliosis (PMID:12615653); a REFUTE item on Substrate Reduction Therapy recording that miglustat did not arrest neurological deterioration in two infantile patients despite adequate CSF levels (PMID:16434676); a new animal_models section with four pathograph-linked models (Hexa knockout PARTIALLY_RECAPITULATES with the regional-restriction limitation, Hexa/Neu3 double knockout RECAPITULATES, Hexa Gly269Ser knock-in FAILS_TO_RECAPITULATE the residual-activity node, Jacob sheep RECAPITULATES with the AAV rescue as a RESTORED readout); and three discussions covering late-onset selective neuronal vulnerability, downstream-cascade ordering (both KNOWLEDGE_GAP with proposed experiments), and the Gly269Ser knock-in mouse (HUMAN_MODEL_MISMATCH).

    NOT INTEGRATED: the report's central thesis and dose-response, already curated; secondary GM2 accumulation in Niemann-Pick and mucopolysaccharidosis disorders (PMID:32272755), which is about other diseases; the skeletal and bone-remodeling branch (PMID:39514043), which is mouse-only for the mechanism and would put model-organism evidence behind a human phenotype claim; the Sandhoff cerebral organoid result (PMID:29358305), superseded here by human fetal data; and the report's proposed ontology CURIEs, none adopted on the report's word. The report's G269S knock-in curation lead was inverted before use: it omits that survival and behaviour did not differ between the knock-in and knockout arms (PMID:40916664), so the model is curated as a negative result.

    Verified: validate-hypothesis-assessment pass; count-verified-snippets 114/114; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens and check-snippet-length all pass on the target file.

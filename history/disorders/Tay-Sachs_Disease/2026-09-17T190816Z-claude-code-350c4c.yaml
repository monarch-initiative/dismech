  summary: Re-apply outstanding OpenScientist findings
  details: |
    Batch-2 re-application of the OpenScientist assessment sweep onto current main, which had been independently re-curated in parallel. Four citations the earlier sweep added were still absent and all four were re-applied against main's current structure, with every snippet re-derived from the on-disk reference cache (PMID:37108372 now has full text where the sweep had only an abstract). PMID:41819452 (Basirli & Seyrantepe 2026) was added to the existing 'Hexa/Neu3 double-knockout mouse' animal model as a second modeled_mechanisms link targeting GM2 ganglioside accumulation in neurons, which main's entry lacked: PARTIALLY_RECAPITULATES / MODERATE to match main's calibration for this genotype, plus a brain GM2 content readout quoting the thin-layer chromatography and mass spectrometry result. PMID:37108372 (ursodeoxycholic acid binds PERK) was added to pathophysiology 'CHOP-associated neuronal injury' as a second, independent pharmacological perturbation moving neurite atrophy and CHOP induction together; main previously supported that node from PMID:30389374 alone. PMID:9073025 (four late-onset siblings) was added to the 'selective_vulnerability' knowledge-gap discussion, where within-genotype phenotypic homogeneity bears directly on the regional-selectivity question. PMID:8896570 (Hexa/Hexb double knockout) could not be re-applied as the earlier sweep used it, because the claim it refuted -- that a Hexa/Hexb double knockout recapitulates human Tay-Sachs disease -- no longer appears anywhere on main; it was instead placed as SUPPORT on the 'cross_disorder_lipid_cascades' discussion, where its finding that glycosaminoglycan storage is absent from Tay-Sachs mice and patients directly supports that discussion's caution against importing mucopolysaccharidosis biochemistry. Both prose corrections the earlier sweep made were already fixed on main independently: the canonical hypothesis description no longer asserts a Hexa/Hexb recapitulation and now records the murine neuraminidase bypass, and its notes already state that the report missed the published human AAV gene-therapy results and the fetal-brain transcriptomics. The Gly269Ser knock-in inversion is likewise already applied on main, as PARTIALLY_RECAPITULATES / LOW with the survival-and-behaviour limitation quoted, so main's relationship grading was left alone rather than being changed to FAILS_TO_RECAPITULATE. The miglustat refutation (PMID:16434676) was already present. The missing openscientist-assessment-by-claude-opus-5.yaml sidecar was copied across verbatim, together with the openscientist-assessment-by-claude-opus-5.md artifact it declares in its artifacts field; both were checksum-verified against the source branch and sit alongside main's existing codex assessment of the same report. Verification: linkml-validate clean; 240/240 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens and check-snippet-grading all clean.

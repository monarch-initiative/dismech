  summary: 'Evidence-claim mismatch review: Tay-Sachs disease'
  details: |
    Reviewed the 16 whole-claim MISMATCH findings in the Jev evidence_claim_match assessments. Fixed 11: removed a fetal-transcriptome developmental snippet from the Hexosaminidase A deficiency node (already carried by the Prenatal neurodevelopmental perturbation node); removed a GeneReviews residual-activity-continuum snippet from Neuronal injury; replaced the AMETHIST venglustat-decrease snippet on CSF GM2 concentration (presence INCREASED) with Kaye 1992 (PMID:1461381) reporting increased CSF GM2 in GM2 gangliosidosis patients, keeping AMETHIST on the pharmacodynamic readout; replaced the CCAS count snippet on Cognitive decline (phenotype and late-onset edge) with the conclusion linking CCAS to the cognitive disorder; replaced the juvenile-TSD fall-avoidance GeneReviews snippet on the late-onset Frequent falls phenotype and edge with patient-reported falling in late-onset GM2 (PMID:32295606); replaced two aim statements from PMID:40019557 with its primary result; replaced the sheep survival snippet on GM2 accumulation -> Neuronal injury with the same paper's storage-to-neurodegeneration statement (HUMAN_CLINICAL, quote_role BACKGROUND); moved the Neu3-storage snippet from the Hexa/Neu3 inflammation link to its GM2-storage link; extended six 'Both processes...' PERK/CHOP snippets with their antecedent sentence; added the psychiatric-drug caution to the Supportive Care description; clarified the explanation on the cross-disorder lipid knowledge gap. Retained with reasons: the Orphanet occasional-frequency startle row (supports presence, explanation already notes frequency difference), the Sandhoff organoid link (LOW fidelity, limitations stated), the macrocephaly case report on the selective_vulnerability gap (attaches_to names Macrocephaly), and the MPS-absence snippet on the lipid-cascade gap (directly supports the caution).

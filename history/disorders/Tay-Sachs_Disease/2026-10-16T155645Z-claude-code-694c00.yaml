  summary: Correct HexA binding to the Part code (PR 14481 review round)
  details: |
    Review round on PR 14481. The first pass searched the NLM Clinical Table LOINC search service for 'Hexosaminidase A', found only specimen- and method-specific codes, concluded no Part code existed, and bound LOINC:21328-0 (the HexA-and-HexB interpretation panel) instead. The reviewer flagged this as wrong and could not itself query the Monarch KG to check; the coordinator did and found LOINC:LP14296-5 (Beta-N-acetylhexosaminidase.A) exists. The root cause: the NLM Clinical Table indexes LOINC terms, not Parts, and LOINC's own component name is 'Beta-N-acetylhexosaminidase A', not 'Hexosaminidase A' -- the same shape as an earlier 'local anaesthetic' search miss, an honest query against the wrong noun. LOINC:21328-0 was also the wrong shape for the claim independent of the naming issue: it is an [Interpretation] result (a narrative conclusion, not an activity measurement) in Blood, a different System value from the Serum/Plasma this entry's GeneReviews source (PMID:20301397) describes testing in. Rebound to LOINC:LP14296-5, confirmed against the Monarch KG API directly before writing it. This also sharpens the Sandhoff/Tay-Sachs distinction rather than disturbing it: Sandhoff (HEXB-deficient, both HexA and HexB low) correctly keeps the plain-total Part code LOINC:LP14022-5 on its own entry, while Tay-Sachs (HexA alone deficient, HexB normal or raised) now takes the HexA-specific Part code -- Part-code-to-Part-code for both, cleaner than sharing the interpretation panel ever was. The orphan LOINC:21328-0 cache row (nothing else in kb/ binds it) was removed from cache/loinc/terms.csv rather than left as residue, per the standing cache-hygiene rule. No collision with LOINC:LP14296-5 on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

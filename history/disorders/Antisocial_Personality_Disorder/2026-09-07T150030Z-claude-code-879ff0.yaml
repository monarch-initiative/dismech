  summary: 'Create: Antisocial Personality Disorder'
  details: |
    Created kb/disorders/Antisocial_Personality_Disorder.yaml (MONDO:0001164), claimed via issue #11336.

    Coverage preflight: confirmed uncovered at origin/main eedf9251c. MONDO:0001164 appeared in kb/ only inside differential_diagnoses blocks of Conduct_Disorder and Borderline_Personality_Disorder, never as a disease_term, has_subtypes term, or mondo_mappings entry. The MONDO parent MONDO:0002028 (personality disorder) is likewise uncurated; Borderline_Personality_Disorder anchors its own specific term, not the parent. No stub, no other open claim issue among the 151 checked.

    Deep research: a claude_code run produced a report whose five cited PMIDs all resolve and are on topic (NESARC-III epidemiology, the Cochrane psychological-interventions review, the ASPD GWAS, and two Fast Track prevention papers). Each was nonetheless re-verified through the PubMed E-utilities API and every snippet checked against the local cache; all ontology terms were resolved independently through OLS.

    Content: a developmental causal chain, since DSM-5 uniquely requires conduct disorder with onset before age 15 for an ASPD diagnosis. Polygenic susceptibility (SLCO3A1, via rs9806493) and MAOA-moderated sensitivity to maltreatment feed a childhood-onset conduct disorder node, which is modeled as diagnostically required rather than as a mere risk factor, and from there into the persistent adult antisocial behavior pattern. One environmental entry (childhood maltreatment) is pathograph-linked with environmental_effect: PREDISPOSES. Four phenotypes, two genetic entries, four differential diagnoses, two treatments.

    Two deliberate omissions, both recorded in the entry notes. First, no prefrontal or amygdala imaging node: searches returned structural and functional findings in psychopathy, conduct disorder and violent-offender samples, which are overlapping but distinct constructs, and importing them under an ASPD label would be entity confusion. Second, psychopathy is not curated as a subtype despite appearing among the MONDO synonyms, because it is a dimensional construct with its own measurement tradition rather than a DSM-5 ASPD specifier.

    The treatment section deliberately records a negative result. The Cochrane review evidence item quoting 'No intervention reported compelling evidence of change in antisocial behaviour' is graded supports: REFUTE against the implicit efficacy claim, alongside a SUPPORT item for the sparseness of the evidence base, rather than presenting psychotherapy as established. The Fast Track prevention treatment carries directness: INDIRECT because its measured outcomes are childhood externalizing diagnoses, not adult ASPD.

    ECTO was searched for a childhood-maltreatment or child-abuse exposure term and none exists, so the environmental exposure_term carries a free-text preferred_term with no binding and the search is recorded in that entry's notes rather than a poor-fitting term being substituted.

    Validation: just validate passes, 19/19 snippets verified against cached references, just validate-terms passes, check-environmental-evidence passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

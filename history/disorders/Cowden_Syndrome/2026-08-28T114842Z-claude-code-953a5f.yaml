  summary: Recurate Cowden Syndrome with OpenScientist deep research
  details: |
    Recuration of an entry first curated in March 2026 without deep research. Note that unlike its sibling Gilbert's Syndrome entry, this one has been enhanced by five later sessions, so the pathophysiology, phenotype and treatment sections were already substantial. This session targeted what those sessions had not reached.

    Deep research: one OpenScientist report, research/Cowden_Syndrome-deep-research-openscientist.md. 30 references, all resolved, none off topic. One quoted claim was flagged as not found in source; inspection shows the flagged quote and the "closest text in source" are byte-identical, and the failure is the reference validator stripping the square-bracketed confidence interval before matching. That is a validator artifact, not a confabulation. just preflight-dr SKIPped because MONDO:0016063 records no causal RO:0004003 gene; the manual fallback passes - the report's OMIM 158350 corresponds to Cowden syndrome 1 and PTEN dominates its gene mentions at 84 against 16 for the next gene.

    The entry had no model systems at all, which was the largest gap. Added three, each wired into the pathograph through modeled_mechanisms rather than left as list entries: epithelial-specific Pten deletion in mouse (RECAPITULATES Hamartoma Formation at HIGH fidelity; it is the model that showed epithelial PTEN loss alone is sufficient for juvenile polyps and stromal loss is not a prerequisite), neuronal Pten deletion (RECAPITULATES Neurodevelopmental Cortical Dysfunction at MODERATE), and the PTEN-mutant iPSC forebrain organoid as an experimental_models entry. The organoid work was already cited as evidence on the neurodevelopmental node but was not modelled as a system, so the node carried its conclusion without its fidelity or limitations.

    Added a biochemical section, which the entry lacked entirely: elevated plasma succinate, reported in 62% of PTEN/SDHB/SDHD carriers against 16% of controls. Added the accompanying EMERGING mechanistic hypothesis that PTEN loss and SDHx variants converge on reduced succinate dehydrogenase activity, which is the only proposed account tying the entry's PTEN-positive and PTEN-negative arms together. Both are explicit that this is one small single-centre study with 21 carriers and no independent replication.

    Added a top-level inheritance block (autosomal dominant, INCOMPLETE penetrance, VARIABLE expressivity) and three discussions: the ERN GENTURIS guideline's own statement that surveillance effectiveness needs prospective evaluation, which matters because surveillance is this entry's strongest treatment recommendation; whether the negative everolimus trial refutes mTOR inhibition or only refutes it against a neurocognitive endpoint; and whether the reported PTEN variant-class to organ-risk correlations are replicated well enough to stratify surveillance by.

    Two snippets required character-level correction before they verified. One cited paper's full text uses non-breaking hyphens (U+2011) where the visible text shows ordinary hyphens; the other snippet had been truncated mid-sentence at a comma. Both were caught before commit by checking every snippet against the local cache.

    Validation: just validate, validate-terms, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all pass. 84 of 84 snippets verify against the local reference cache.

    Review round 1 on the sibling PR #9830 found two structural defects that this entry had too, so they were fixed here proactively rather than waiting for the same review.

    First, the pten_sdhx_succinate_convergence hypothesis group was orphaned: it was declared in mechanistic_hypotheses but no causal edge opted into it, so it rendered as a disconnected assertion. Fixing it properly required a node, because the hypothesis is about a step the pathograph did not contain. Added a "Reduced Succinate Dehydrogenase Activity" node with causal_link_type UNKNOWN on the edge into it, labelled with the hypothesis group. The node is deliberately a leaf: nothing is drawn downstream of it because what accumulated succinate would then do in Cowden syndrome has not been shown.

    Second, no treatment carried target_mechanisms, so nothing in the treatments section joined the pathograph. Added join points for mTOR Inhibitor Therapy (INHIBITS the PI3K/AKT/mTOR node, with the edge recording what the drug does rather than that it works), Enhanced Cancer Surveillance (MODULATES Increased Cancer Risk, acting on detection timing rather than incidence) and Prophylactic Mastectomy (INHIBITS, by removing the substrate tissue). Genetic Counseling deliberately has none: it does not act on a disease mechanism.

  summary: 'Gene-family review: PTEN'
  details: |
    Typed the PTEN record (CS1) CAUSATIVE with variant_origin GERMLINE: Cowden syndrome is defined by germline PTEN loss-of-function variants (PMID:21194675). ClinGen's Definitive PTEN classification is filed under PTEN hamartoma tumor syndrome (MONDO:0017623), not this entry's disease term, so it is noted rather than copied. Bound phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity DECREASED (PTEN), 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity INCREASED (PIK3CA, Cowden-like) and protein serine/threonine kinase activity INCREASED (AKT1, Cowden-like) on 'PTEN Loss and PI3K/AKT/mTOR Pathway Activation', one per gene the node carries.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. The PMID:20301661 finding's supporting_text was prose about the chapter, not a quote; it now quotes the chapter's diagnosis/testing sentence. The finding on the GeneReviews printable-page URL, also prose, is removed.

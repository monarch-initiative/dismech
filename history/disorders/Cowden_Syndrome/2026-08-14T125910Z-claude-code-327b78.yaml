  summary: Fix uncited DD/ID ~42% figure with citable 66% pediatric chart-review statistic
  details: |
    Follow-up sub-item from issue #6307 (cancer-predisposition evidence review). The Developmental Delay and Intellectual Disability phenotype node's description asserted 'approximately 42% of patients' for DD/ID prevalence in pediatric PHTS cohorts, but neither cited PMID (17526800, 33509259) supports that figure -- the only '42%' string found in either cached abstract is an unrelated statistic (42% of male participants meeting Cowden diagnostic criteria in PMID:17526800, not a DD/ID prevalence figure). Searched PubMed for a genuine citable pediatric PHTS DD/ID/ASD prevalence statistic and found PMID:28526761 (Hansen-Kiss et al. 2017, J Med Genet, 47-patient pediatric PTEN chart-review cohort), which reports macrocephaly with developmental delay, ID, and/or ASD as the most common presenting finding in 66% of patients. Reworded the description to cite this bundled DD/ID/ASD figure instead of the unsupported isolated 42% DD/ID claim, and added the PMID as a new evidence item with an exact-quote snippet. Fetched and cached PMID:28526761 via just fetch-reference. Validation: just validate (69/69 snippets verified), just count-verified-snippets (69/69), pytest tests/test_data.py -k Cowden (16 passed), just validate-disorders (full pre-PR sweep, all passed).

  summary: Renumber Cowden subtypes to OMIM/MONDO, bind all seven subtype terms and
    genes, wire genes into the pathograph
  details: |
    Genetics pass under dismech#12257 (d2g series-050), Cowden syndrome parent.

    Anchor: disease_term MONDO:0016063 Cowden disease is kept. The term is the direct
    MONDO parent of Cowden syndrome 1 through 7, and the entry models that whole class,
    so it is not the over-broad anchor pattern of dismech#12184.

    Principal repair: three of the four has_subtypes rows carried the wrong OMIM/MONDO
    type number. MONDO and OMIM number the subtypes CS1 PTEN (158350), CS2 SDHB
    (612359), CS3 SDHD (615106), CS4 KLLN (615107), CS5 PIK3CA (615108), CS6 AKT1
    (615109), CS7 SEC23B (616858); the entry named KLLN as CS2, PIK3CA as CS3 and SDHB
    as CS4. Rows were renumbered, a subtype_term bound to each, genes bound, and the
    same renumbering applied to the eight prose strings elsewhere in the entry that
    named a type number.

    Added CS3 (SDHD), CS6 (AKT1) and CS7 (SEC23B) as new rows with new genetic records,
    so all seven MONDO subtype concepts now have a home and a reciprocal
    genetic[].subtype foreign key.

    Pathograph wiring: no pathophysiology node carried a genes descriptor before this
    pass. PTEN is now bound on five nodes, PIK3CA and AKT1 on the PI3K/AKT/mTOR node
    with their own evidence item, and SDHB plus SDHD on the succinate dehydrogenase node
    whose own cited snippet already named both. Two new nodes were added so the
    remaining two genes reach the graph by the mechanism they actually act through
    rather than by being appended to the PI3K node: KLLN promoter hypermethylation and
    KILLIN silencing (GO:0045814), and SEC23B-associated endoplasmic reticulum stress
    (GO:0006888, GO:0034976). All seven genes now reach the pathograph.

    Evidence-strength qualifications recorded from sources read in this pass: ClinGen
    grades PTEN/PTEN hamartoma tumor syndrome Definitive and AKT1/Cowden syndrome 6
    Limited, and has no assertion for KLLN, PIK3CA, SDHB, SDHD or SEC23B against Cowden
    syndrome. Both ClinGen records were cached with just clingen-rebuild.

    Two prose corrections. The SDHB record attributed the 13.5% SDHx carrier rate to
    SDHB alone; the source reports three SDHB and seven SDHD carriers among ten, so the
    figure is the combined SDHx share. The same record asserted pseudohypoxia via
    HIF-1alpha stabilization, which neither of the entry's two cited SDH references
    mentions; it was replaced with the phospho-AKT and phospho-MAPK readout those
    references do report.

    stubs/Cowden_Syndrome_1.yaml deleted: MONDO:0008021 is now the CS1 subtype_term.

    Validation: just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values,
    check-qualifier-terms, list-gene-term-mismatches --resolve, and validate-disorders,
    under linkml-reference-validator 0.3.0rc3. Every new snippet was checked to be an
    exact substring of its cached reference and to sit in the abstract paragraph.

  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 1 (MC1DN1, NDUFS4)'
  details: |
    New Disease entry for MONDO:0100224 (MC1DN1, biallelic NDUFS4), curated from primary literature plus a falcon deep-research run (preflight PASS: NDUFS4=55 mentions, next gene 5, OMIM 252010 matching MONDO exactly).

    entry_type decision: DISEASE, and this was the substantive question. It points both ways and both precedents were read.

    Toward SUBTYPE, as in the VWM5 case (PR #10424): Leigh_Syndrome.yaml genuinely BINDS NDUFS4 - hgnc:7711 in genetic: with an association, its own HP:0000007 inheritance block and cited evidence, plus again in a pathophysiology[].genes list. So this is not the cblA pattern (PR #10260) of a gene named in prose with nothing behind it. ClinGen agrees: its Mitochondrial Diseases GCEP curates NDUFS4 against Leigh syndrome (MONDO:0009723), not against MONDO:0100224.

    Toward DISEASE, which is what was done, four reasons.
    1. MONDO does not place MC1DN1 under Leigh syndrome - its parents are 'mitochondrial complex I deficiency, nuclear type' (MONDO:0100223) and 'inborn mitochondrial myopathy' (MONDO:0009637). This is the structural difference from VWM5, where MONDO:0957873 IS a direct child of the umbrella's own term.
    2. VWM5 turned on two large cohorts showing subunit identity does not predict phenotype, so no gene-specific pathograph existed. The complex I literature says the opposite: a review comparing 22 NDUFS4 patients against 198 patients with 24 other complex I gene defects found NDUFS4 uniformly early-onset and severe, while sibling genes already curated here span Leigh syndrome to isolated optic atrophy.
    3. There IS a gene-specific mechanism and Leigh does not carry it. Leigh's node is a generic 'Complex I deficiency' shared with NDUFV1 and MT-ND5. Nothing there covers NDUFS4 as an accessory subunit at the N-Q module interface, the CI-830 subcomplex, the reciprocal loss of NDUFA12 with retention of NDUFAF2, or the diagnostic constancy of the native-gel profile.
    4. Seven MC1DN entries already exist (types 2, 6, 12, 23, 24, 31, 34), most presenting as Leigh syndrome, all coexisting with Leigh_Syndrome; type 23 even lists Leigh Syndrome in its parents:. Type 1 would be the single exception.

    Leigh_Syndrome.yaml was NOT modified. The ClinGen assertion is recorded in external_assertions with an explicit note that it was curated against Leigh syndrome rather than against this MONDO term, rather than quietly re-labelling it. The stub was deleted.

    Named Entity Confusion: preflight passes but is insufficient here, since NDUFS4's literature is largely Leigh syndrome and largely mouse. Two traps were checked. NDUFS4 has a large cancer literature (gastric, glioma, prostate) - not cited. And PMID:39858433 (NADH reductive stress) has a human fibroblast cohort of 22 mitochondrial disease patients whose complex I cases are NDUFA1, MT-ND3, MT-ND5 and ACAD9 - NDUFS4 is not among them - so its human arm is not this disease and it is not cited at all.

    Frequencies: every band comes from one denominator, the 22-patient/18-family NDUFS4 compilation quoted in PMID:34849584, with the numerator stated in each phenotype description. Nothing is banded from a broader Leigh series. Seizures are OCCASIONAL (4/22 = 18%) not FREQUENT; microcephaly is VERY_RARE (1/22 = 4.5%); complex I deficiency in muscle is VERY_FREQUENT (18/22 = 82%). No prevalence record at all, because the available figures (Leigh incidence 1 in 40,000; the 116-participant Leigh registry) are a different disease's numbers.

    Death in infancy is curated under progression: rather than phenotypes:, because HP:0001522 sits in the HPO Mortality/Aging branch and is not in the PhenotypeTerm dynamic enum - following the decision already recorded in Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome. The 2016 'invariably fatal' claim is quoted as the authors' conclusion and immediately balanced by two later survivors (alive at 7, and 8 years old), which is also the subject of a KNOWLEDGE_GAP.

    A HUMAN_MODEL_MISMATCH discussion records that the Ndufs4 KO mouse matches the human biochemistry closely (the review says whole-body deletion is a genetically valid strategy because human alleles abolish the protein and the disease is recessive) but not the neuropathological distribution - mouse lesions centre on the vestibular nuclei, olfactory bulb and cerebellum where the human disease is brainstem and basal ganglia. Every therapeutic lead in this disease was validated against the mouse lesion set.

    Two references were fetched and not used because their caches have no quotable content: PMID:28371352 and PMID:30937725, both Finsterer correspondence letters. This is recorded in notes so it is not rediscovered.

    Ontology note: GO:0005747 (mitochondrial respiratory chain complex I) is obsolete; GO:0045271 (respiratory chain complex I) was used instead.

    Follow-up pass in the same session, auditing prose numbers against the caches rather than against memory. Three fixes. A differential-diagnosis sentence said Leigh syndrome is produced by 'more than seventy-five genes'; no cached source supports that number, so it now says more than thirty-five with an evidence item quoting PMID:27671926, and the notes record that higher counts appear in the review literature. The rapamycin treatment description said the drug 'more than doubled median survival', which was arithmetic I did rather than a quotable claim; it now gives both figures (untreated median 50 days, treated 114 and 111 days) with an evidence item for each. And one evidence snippet had been truncated mid-phrase at 'associated with partial' to avoid a non-ASCII symbol in the source; it was replaced with the propositional tail of the same sentence, which quotes the ROS, NAD(P)H, calcium/ATP and morphology findings in full.


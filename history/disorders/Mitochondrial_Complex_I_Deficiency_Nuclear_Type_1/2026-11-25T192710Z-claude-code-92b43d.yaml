  summary: 'Gene-family review: NDUFS4'
  details: |
    The NDUFS4 lesion node had no molecular function. NDUFS4 is an accessory N-module subunit with no catalytic role, and its loss is accompanied by an almost complete loss of assembled complex I (PMID:12944388), so the node now binds structural molecule activity, decreased, as the activity lost. The genetic record lacked a variant origin and is now germline. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

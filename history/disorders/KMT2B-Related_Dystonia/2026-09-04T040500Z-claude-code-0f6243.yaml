  summary: 'Create: KMT2B-Related Dystonia'
  details: |
    New kb/disorders/ entry for KMT2B-related dystonia (DYT-KMT2B / dystonia 28, MONDO:0015004), claimed via issue #10875. Deep research: requested falcon, which is not configured in this environment; ran with --fallback so the run recorded the substitution, and the report was produced by claude_code (research/KMT2B-Related_Dystonia-deep-research-claude_code.md, fell_back: true, requested_provider: falcon). The report's own validation flagged needs_review on both axes and I acted on it: its one unsupported quote (DOI:10.1186/s13148-021-01145-y, 'indicating a general repression of transcriptional activity') was not reused; the three obsolete GO terms it suggested (GO:0051568, GO:0034968, GO:0006306) were not bound; and its mislabelled HP:0001608 (called 'Dysphonia', HPO calls it 'Abnormality of the voice') was not used. The report cited almost entirely by URL rather than PMID, so the seven primary references were recovered by PubMed lookup on title/author and fetched fresh. GeneReviews baseline: PMID:29697234 (KMT2B-Related Disorders) fetched, tagged GeneReviews in the top-level references block, and every phenotype in its Clinical Characteristics paragraph either curated or, for the KMT2B-related non-dystonic NDD, left out as outside this entry's MONDO scope and recorded as an open question instead. Pathophysiology is a six-node chain from KMT2B haploinsufficiency through reduced H3K4 methylation and promoter DNA hypermethylation to transcriptional repression, striatal/pallidal circuit dysfunction and caudocranial generalization; the hypermethylation node is the one step measured directly in patients (PMID:34380541) and the step to circuit dysfunction is marked INDIRECT_UNKNOWN_INTERMEDIATES because no cell-type-resolved patient data connect them. Two phenotypes (status dystonicus, endocrinopathy) and the adult-onset subtype are deliberately left unbound with notes explaining why no accurate term exists. Poor laryngeal and gait response to GPi-DBS is curated as a REFUTE evidence item rather than omitted. Validation: just validate passed (schema, terms, 63/63 snippets verified); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence all clean; just compliance 89.1% weighted; pytest -k KMT2B 22 passed.

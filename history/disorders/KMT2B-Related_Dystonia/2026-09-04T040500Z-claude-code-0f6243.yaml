  summary: 'Create: KMT2B-Related Dystonia'
  details: |
    New kb/disorders/ entry for KMT2B-related dystonia (DYT-KMT2B / dystonia 28, MONDO:0015004), claimed via issue #10875. Deep research: requested falcon, which is not configured in this environment; ran with --fallback so the run recorded the substitution, and the report was produced by claude_code (research/KMT2B-Related_Dystonia-deep-research-claude_code.md, fell_back: true, requested_provider: falcon). The report's own validation flagged needs_review on both axes and I acted on it: its one unsupported quote (DOI:10.1186/s13148-021-01145-y, 'indicating a general repression of transcriptional activity') was not reused; the three obsolete GO terms it suggested (GO:0051568, GO:0034968, GO:0006306) were not bound; and its mislabelled HP:0001608 (called 'Dysphonia', HPO calls it 'Abnormality of the voice') was not used. The report cited almost entirely by URL rather than PMID, so the seven primary references were recovered by PubMed lookup on title/author and fetched fresh. GeneReviews baseline: PMID:29697234 (KMT2B-Related Disorders) fetched, tagged GeneReviews in the top-level references block, and every phenotype in its Clinical Characteristics paragraph either curated or, for the KMT2B-related non-dystonic NDD, left out as outside this entry's MONDO scope and recorded as an open question instead. Pathophysiology is a six-node chain from KMT2B haploinsufficiency through reduced H3K4 methylation and promoter DNA hypermethylation to transcriptional repression, striatal/pallidal circuit dysfunction and caudocranial generalization; the hypermethylation node is the one step measured directly in patients (PMID:34380541) and the step to circuit dysfunction is marked INDIRECT_UNKNOWN_INTERMEDIATES because no cell-type-resolved patient data connect them. Status dystonicus and the adult-onset subtype are deliberately left unbound with notes explaining why no accurate term exists. Poor laryngeal and gait response to GPi-DBS is curated as a REFUTE evidence item rather than omitted.

    A pre-PR adversarial self-review was then run against the dismech-pr-review skill and its findings were applied in a second pass. Two were substantive. First, the adult-onset subtype description asserted that those cases carry the KMT2B episignature; PMID:36483457 reports the opposite -- they cluster with controls against the early-onset signature and their distinguishing probes do not overlap it, which the authors read as a different molecular mechanism. The description was rewritten to say that, the two supporting quotes were added, the authors' own segregation caveat on p.S640T and p.R2339Q was recorded, and the entry no longer claims its causal chain applies to the subtype. Second, the pivot pathophysiology node asserted transcriptional repression with modifier DECREASED, but neither attached quote gives a direction -- the claim traced back to the same sentence the report's validator could not verify. The node was renamed to Transcriptional Dysregulation at KMT2B Target Loci, the modifier changed to ABNORMAL, the misapplied diagnostic-utility quote removed, and the top-level description corrected; a note records that repression is the usual reading but that no patient transcriptomic data exist for this disorder. Also in that pass: four uncited prose assertions imported from the deep-research narrative were removed or attributed (CXXC/PHD missense clustering, which came from a KMT2A paralog argument; the DNMT/Polycomb repulsion step, which is mouse embryonic stem cell work and is now recorded in notes as such rather than asserted as human mechanism; an imaging claim no cited reference makes; and a genotype-does-not-predict-DBS-response negative absent from the cached abstract). The DNA hypermethylation edge was re-parented from the reduced-H3K4 node onto haploinsufficiency, because the barrier function is reported to be catalysis-independent. The striatal half of the circuit node and its CL:1001474 medium spiny neuron binding were dropped, since the localization rests entirely on DBS response and reaches only the pallidum. Eleven frequency bands inferred from qualitative words such as 'prominent' or 'in some' were removed, and the one quantified figure available (dystonia in >80% of cases, PMID:38425714) was cited for the band that remains. HP:0031959 Leg dystonia replaced HP:0002451 Limb dystonia, which includes the arm; endocrinopathy was bound to HP:0000818; microcephaly was added from PMID:38425714. NCIT:C21024 Deep Brain Stimulation replaced the generic NCIT:C15329 Surgical Procedure, and therapeutic_agent was added to both pharmacotherapies (CHEBI:9720 trihexyphenidyl, CHEBI:15765 L-dopa). Botulinum toxin was added as a treatment with its agent left unbound and the reason recorded: the source names no serotype, CHEBI codes only type A, and NCIT's generic term is not reachable from the ChemicalEntityTerm roots. The levodopa evidence item was split into a SUPPORT for the recommendation and a REFUTE for sustained efficacy; the in-silico loss-of-function prediction was regraded COMPUTATIONAL. Three nodes now declare conforms_to against epigenetic_machinery_neurodevelopmental_dysregulation, matching the KMT2A paralog entry Wiedemann-Steiner Syndrome. Pathograph connectivity went from 5 of 26 phenotypes reachable to 25 of 27; the two that remain unreachable are the initiating lower-limb feature, which has an outgoing edge, and sensorineural hearing loss, left unlinked because the reporting authors call the association possibly coincidental. Three further references already fetched but uncited were brought in (PMID:38425714 episignature/pre-symptomatic diagnosis, PMID:41738007 Austrian long-term DBS cohort, both also used to add a prevalence record and a misdiagnosis-as-cerebral-palsy diagnosis entry).

    One reviewer suggestion was not taken: adding OMIM 617284/619934 to a mappings block, because the DiseaseMappings class admits only ICD10CM, ICD11F, MONDO and NCIT. The OMIM codes are recorded in the entry's notes instead.

    Validation after both passes: just validate and just validate-disorders passed (schema, terms, 74/74 snippets verified); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence all clean; pytest -k KMT2B 22 passed. just compliance fell from 89.1% to 80.5% across the review pass. That is the expected cost of the corrections rather than a regression: the score rewards filled slots, and the pass removed eleven unsourced frequency bands, a cell-type binding and a process annotation that the evidence did not support. 

    A third pass then addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #10919. Its one blocking finding was correct: the entry carried no neuroimaging content, and the external-globus-pallidus MRI sign is quotable from PMID:41738007, a reference the entry already cited. The earlier removal of an imaging claim on the grounds that no cited reference made one had overshot, because that reference's cache was upgraded from abstract-only to PMC full text during the same run. Added an imaging_findings block bound to HP:0002453 and UBERON:0002476, using the purpose-built slot rather than the diagnosis section the reviewer suggested. Curated with the negative the reviewer's excerpt omitted: the same cohort reporting the ~27% literature figure saw no indicative MRI abnormality in any of its own nine patients and attributes that to age-dependency, so that sentence is carried as a REFUTE item and the notes state that a normal MRI argues nothing. Also recorded that the streaks sit in the external pallidal segment while deep brain stimulation targets the internal segment, so the imaging corroborates pallidal involvement without confirming the segment. The over-absolute clause in the Pallidal Motor Circuit Dysfunction node -- that the whole localization rests on DBS response -- was rewritten to name both lines of evidence and their disagreement on segment.

    Five of the six suggestions were taken: GeneReviews genetic-counseling content (50% transmission risk, prenatal and preimplantation testing availability) added to inheritance; a diagnosis entry for molecular genetic testing, noting that a deletion carrier is missed by sequence-only testing; freezing of gait as a second post-DBS complication; epilepsy as a phenotype together with the cohort's own statement that the literature under-reports it; and a progression record for the seventh-decade life-expectancy observation, framed as the absence of survival data that it is. The stale repression wording in the kmt2b_effector_genes rationale, left over from the node rename, was corrected. The sixth suggestion, that the PR body said nine references when there are eleven, had already been fixed in the body before the review was submitted.

    Validation after the third pass: just validate and just validate-disorders pass, 82/82 snippets verified; all ten offline gates clean; pytest -k KMT2B 22 passed; compliance 81.9%.
    A fourth pass followed the ai4c-reviewer APPROVE on PR #10919 and was forced by a merge conflict rather than chosen. Curation PRs merging into main in the interim added rows to cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv at the same insertion point as this entry's MONDO:0015004 rows, and GitHub's merge queue dropped the PR without a stated reason once the branch stopped being mergeable. Both conflicts were pure additions on each side (MONDO:0015003 from main, MONDO:0015004 from this branch) and were resolved as a union in canonical CURIE order rather than by hand-writing any label or timestamp; check-term-cache-integrity and check-cache-order both pass on the result. Since resolving the conflict costs the approval regardless, the four non-blocking suggestions left over from the approving review were bundled into the same push rather than deferred to a further round.

    The mouse embryonic stem cell work that the Promoter DNA Hypermethylation node's notes decline to assert as human mechanism is now an experimental_models entry. The primary source was located by PubMed search and fetched fresh: PMID:23358417 (Ladopoulos et al., Mol Cell Biol 2013), a conditional Mll2 knockout embryonic stem cell line in which KMT2B depletion is followed by loss of the active chromatin marks and then rapid methylation of the MagohB CpG island promoter, with re-expression of the enzyme reinstating an active promoter. It is linked to that node as PARTIALLY_RECAPITULATES with fidelity LOW and model_scale MOLECULAR, carrying two readouts (methylation after depletion, INCREASED; promoter reactivation after rescue, RESTORED) and three typed divergences: SPECIES_MISMATCH, BOUNDARY_OMISSION and POPULATION_MISMATCH, the last because the model applies complete conditional loss where the disease is heterozygous. Note that this corrects the deep-research report's framing as well as making the caveat structural: the report attributed a PRC2-and-DNMT repulsion mechanism to this literature, and the paper measures protection from DNA methylation without naming PRC2, so the model notes say so explicitly and the wider claim is still not asserted.

    The absence of any whole-organism model is now a KNOWLEDGE_GAP discussion (kmt2b_no_in_vivo_model) attached to the empty animal_models section and to the Pallidal Motor Circuit Dysfunction node, recording that the search found no published Kmt2b animal model of the dystonic phenotype, that the contrast with TOR1A/DYT1 is what makes the absence notable, and that the consequence is that the epigenetic-lesion-to-pallidal-dysfunction step has no system in which it can be tested. A classifications block was added with harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE; no mechanistic_category value fits, since the mechanistic nosology enum has no chromatinopathy or epigenetic-machinery value. The deep brain stimulation description now names freezing of gait alongside mild parkinsonism as a post-operative complication, matching the evidence already beneath it. The imaging_findings frequency slot is still empty, but the notes now say that this is deliberate: a single band would flatten the conflict between the ~27% literature figure and the zero-of-nine cohort result that the record exists to preserve.

    Validation after the fourth pass: just validate passes with 85/85 snippets verified; just validate-terms passes; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean; check-term-cache-integrity and check-cache-order clean after the conflict resolution; pytest -k KMT2B 22 passed.

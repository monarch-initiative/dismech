  summary: 'Create: Alopecia-Intellectual Disability Syndrome 4 (APMR4, LSS)'
  details: |
    Curated APMR4 (LSS-related alopecia-intellectual disability syndrome; MONDO:0030009; OMIM 618840) as one flagship member Disease of the APMR group (MONDO:0008756), per the modeling guidance in issue 8727: a multi-gene family should be a kb/groupings/ Grouping over separate member Disease entries, not an umbrella Disease with has_subtypes. Chose APMR4 as the best-characterized member (strongest, most recent LSS gene-disease evidence). Corrected the NEC-confused gene attributions in the issue body/dashboard: APMR1=AHSG (not LSS), APMR3 is locus-only (NOT C3orf52, which causes an unrelated non-syndromic hypotrichosis). Only APMR1 and APMR4 are molecularly characterized. Evidence anchored on primary literature: Besnard 2019 PMID:30723320, Elaraby 2022 PMID:36251212, Elbendary 2023 PMID:37157980, Kang 2024 PMID:38800572, Muzammal 2021 review PMID:33881165. Validated: just validate schema pass with 35/35 snippets; just validate-terms pass; count-verified-snippets 35/35; check-title-snippets OK. A grouping is deferred until a second member (e.g. AHSG/APMR1) is curated.

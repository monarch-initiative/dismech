  summary: 'Create: Mandibuloacral Dysplasia Associated to MTX2 (MDPS)'
  details: |
    New entry for MONDO:0030880 (MTX2), from claim #16964. Deep research: one OpenScientist report (research/Mandibuloacral_Dysplasia_Progeroid_Syndrome-deep-research-openscientist.md). Its reference validation resolved 15/15 references with 12/12 quotes found. Its term validation first timed out on the EBI OLS service and succeeded on retry; that check lists six CURIEs the report names wrongly (HP:0012864, HP:0004944, HP:0000095, NCIT:C15339, NCIT:C265, NCIT:C566), and none of them is used. preflight-dr: MTX2 dominant; MTX1 mentions are the binding partner, not another disease. Beyond the report, the ClinGen Definitive AR assertion (CGGV) and its cited podocyte paper PMID:38250156 (Li et al. 2024, two further patients plus a podocyte-specific Mtx2 knockout mouse) were added; the report had missed that paper. Orphanet ORPHA:647667 was cached for the definition and prevalence class. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Name chosen per the entry-naming skill: the MONDO label could describe the LMNA/ZMPSTE24 progeroid MAD forms too, so the entry uses the original authors' name, which is also the Orphanet label and a MONDO exact synonym; the file slug is unchanged. MTX2 has only a 'protein binding' (IPI) GO molecular-function annotation, so the MTX2 node carries no molecular_functions and a single line was added to tests/gene_activity_grounding_baseline.txt. Validation: just validate-disorders passed (93/93 snippets, terms, schema); entity-ref, causal-target, name-collision, coarse-phenotype, qualifier, duplicate-key, block-scalar, enum, logical-rule, snippet-length, title-snippet, reference-title, snippet-grading and gene-activity checks all OK.

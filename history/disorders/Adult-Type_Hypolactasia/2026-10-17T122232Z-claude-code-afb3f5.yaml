    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Bound LOINC:50584-2 (Lactose challenge hydrogen breath test panel) as the measurement identity of the hydrogen breath test diagnosis row, and LOINC:33471-4 (exhaled hydrogen volume fraction post unspecified challenge) as the loinc_term of the breath-hydrogen biochemical marker. Both codes were new to cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; labels were copied from the resulting cache rows and never typed. Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml (sha256 verified against the pin), fully enumerated: 4 lactose-challenge-named codes, of which two are active hydrogen panels (50584-2 from release 2.22, 105751-2 from 2.78), one is the methane panel and one an interpretation code excluded by campaign rule. No reference-range band was added: the guideline criterion is a rise of at least 20 ppm above baseline and all 96 exhaled-gas hydrogen codes in 2.83 are absolute readings (88 volume fractions, 5 panels, 3 interpretation codes), so no code exists for a baseline-corrected value. Validation: just validate-disorders over all six batch files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed.

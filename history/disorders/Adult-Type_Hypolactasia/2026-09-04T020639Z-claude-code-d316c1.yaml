  summary: 'Create: Adult-Type Hypolactasia'
  details: |
    Curated a new Disease entry for adult-type hypolactasia / lactase non-persistence (MONDO:0006065) from the stub queue, resolving entry_type as DISEASE. Four pathophysiology nodes run from failure to sustain LCT transcription after weaning, through declining brush-border lactase activity and luminal retention of unhydrolysed lactose, to osmotic water influx plus colonic fermentation. Two nodes declare conforms_to against diet_induced_osmotic_diarrhea, substituting lactose for the generic malabsorbed substrate, alongside the existing conformers Congenital_Lactase_Deficiency, Congenital_Sucrase-Isomaltase_Deficiency, Trehalase_Deficiency and Glucose-Galactose_Malabsorption. The causal gene is annotated as MCM6 rather than LCT because the variants are cis-regulatory and sit in an MCM6 intron; the notes record that the controlled gene is LCT. Three structured prevalence records capture the global estimate and its regional extremes. Named Entity Confusion guardrail recorded in notes: this is deliberately distinct from the already-curated Congenital_Lactase_Deficiency, which is an LCT coding lesion presenting neonatally, and the two must not share evidence. Notes also record the inheritance inversion, since hypolactasia is recessive while the derived lactase-persistence trait is dominant. All 22 evidence snippets verified against the local reference cache; schema and term validation pass.

  details: |
    Response to the round-1 PR review on #10850.

    Blocking item 1 (retracted source). PMID:28690131 (Storhaug 2017) is flagged Retracted Publication by PubMed and was the sole support for all three prevalence records and for the description's two-thirds claim. It is removed from references: and from all evidence. Prevalence is rebuilt on two unretracted records: a worldwide 57-65% range from PMID:33887513, and a qualitative geographic record from PMID:20144208 (Itan 2010) describing where lactase persistence is rare or absent. The second carries no rate, because inverting a prose statement about the reciprocal trait into a number would manufacture precision the source does not have. Both the entry notes and the first record's notes state that the widely quoted 68% figure traces to a retracted analysis, and that PMID:33887513 labels its range 'lactose intolerance' when at that magnitude it is the malabsorption trait. The retracted paper's cache file is kept so that retraction claim remains checkable in-repo, but nothing cites it.

    Blocking item 2 (no deep-research artifact, entry too thin). No deep-research run was performed. Instead the entry was deepened directly from primary literature, adding seven references and five sections: biochemical (breath hydrogen readouts against the genotype reference standard), environmental (dietary lactose as the obligate dose-graded exposure), differential_diagnoses (IBS, where 79.9% of IBS patients in the cited cohort were breath-test positive), three further diagnosis methods, two further genetic entries, and a discussions KNOWLEDGE_GAP on why only a minority of malabsorbers are symptomatic.

    Item 3: conforms_to moved off the transcription-regulation node onto Declining Intestinal Lactase Activity, which carries GO:0000016 lactase activity and is the true analogue of the module's brush-border node; that node's biological_scale changed TISSUE -> MOLECULAR to match the module.

    Item 4: 'Osmotic Water Influx and Colonic Fermentation' split into two nodes, each conforming to its own module node, with phenotypes rewired so diarrhoea tracks the osmotic arm and flatulence and pain the fermentative arm. Module coverage rises from 2/5 to 4/5.

    Item 5: PMID:12915462's background sentence regraded HUMAN_CLINICAL -> OTHER; it is the paper's framing assertion, not a finding of its Caco-2 and EMSA experiments.

    Item 6: diagnosis_term bound on three of four methods (NCIT:C116515 Breath Test, NCIT:C15709 Genetic Testing, NCIT:C15189 Biopsy Procedure). The lactose tolerance test is deliberately left unbound: NCIT has no C25218-reachable term for it and binding a post-load blood glucose measurement to Breath Test would assert the wrong specimen and analyte.

    Suggestions taken: environmental block (7), biological_scale reconciliation (8), LCT added to genetic (10), prevalence_class rationale recorded (11). Suggestion 9 (extra-intestinal risk) not taken: 'various extra-intestinal diseases, including cancers' is too vague to seed a comorbidity.

    Two snippets from PMID:32600320 contain U+2009 thin spaces and a trademark sign inside the figures, so they were extracted programmatically from the cache rather than retyped.

    Validation at this head: linkml-validate clean; snippets 46/46 verified (was 22/22); term validation passed; duplicate-key, enum, entity-ref, causal-target, qualifier-term, snippet-grading, snippet-length, title-snippet and folded-hyphen gates all OK. Cache diff is exactly two new rows (ECTO:9000240, GO:0005990) plus their enum memberships.

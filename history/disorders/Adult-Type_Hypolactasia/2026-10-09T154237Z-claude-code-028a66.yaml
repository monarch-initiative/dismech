  summary: Remodel LCT-MCM6 regulatory genetics
  details: |
    Applied the noncoding-variant-impact conventions. The two regulatory genetic records no longer bind MCM6 as a causal gene_term; the enhancer is recorded as an affected region within MCM6 intron 13, and the C/T-13910 (rs4988235) variant is recorded with MCM6 as host gene and LCT as regulatory_target_gene, with variant_origin GERMLINE. The regulatory-haplotype node replaces gene: MCM6 with a genetic_context carrying the same affected region. The LCT transcription node now uses GO:0006366 transcription by RNA polymerase II DECREASED instead of regulation of transcription DECREASED. The lactase-activity node is bound to LCT and to brush border membrane. New snippets come from PMID:27159559 and PMID:17159977 and verify against the cache.

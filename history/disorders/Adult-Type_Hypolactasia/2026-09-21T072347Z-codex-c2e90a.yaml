  details: |
    Full review of the existing entry after fresh parsed history and fully paginated open-PR/claim overlap checks. Corrected the unsupported global prevalence midpoint, symptom frequency bands, population-wide genotype claims and perfect-test generalization. Distinguished lactase deficiency, malabsorption and symptomatic intolerance. Read the original sources and recovered full primary papers, clinical guidelines and the broader StatPearls chapter; no matching deep-research report was found and exact-title GeneReviews/StatPearls lookup returned NO_CHAPTER. Added qualified intestinal epigenetic regulation, 10 atomic mechanism nodes, 7 specific phenotypes, 4 cell models and one mouse model. Genetic, regulatory-deletion and methylation evidence remain distinct. Added clinical assessment, symptom-linked breath testing, individualized dietary and nutritional care, and the two completed Bi-07 trials with primary gas endpoints, negative symptom findings, adverse nausea and study limitations. Registry status, phase and enrollment were checked against the live API on 2026-09-21.

    Independent bounded source audits covered epigenetic mechanisms and the diagnostic comparison study. A final topology pass prompted removal of an unsupported sensory-sensitivity edge to objective distension. Schema, live ontology terms and all 106 exact evidence snippets pass; all 20 repository guards including whole-KB node classes pass, and dataset verification found no accessions. All reference caches were regenerated with just fetch-reference; no cache source text was manually edited. No frozen dataset-accession file was accessed. Pre-commit and history validation are run before publication.

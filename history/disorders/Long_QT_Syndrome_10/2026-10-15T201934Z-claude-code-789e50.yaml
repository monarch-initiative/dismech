  summary: 'Recheck against deep research: Long_QT_Syndrome_10'
  details: |
    Rechecked the entry against research/Long_QT_Syndrome_10-deep-research-claude_code.md. preflight-dr returned WARN (SCN4B 17 mentions, SCN5A 7). The SCN5A mentions were read: the HEK293 assay co-expressing SCN4B L179F with SCN5A-encoded Nav1.5 is in scope and already in the entry; the Adler 2020 list of definitive genes and the LQT3 differential are context only; the Remme 2009 mouse strain study (PMID:19407241) proposes Scn4b as a modifier of conduction disease in an SCN5A mouse model, which is a different disease and was excluded. Added: a prevalence record (CASES_IN_LITERATURE, NOT_YET_DOCUMENTED) citing the primary report's negative 262-patient screen (PMID:17592081) and the 2020 reappraisal's statement that no further literature exists (PMID:31983240); both references were already cached. Deliberate omissions: (1) 4-generation family, sudden death in the family, incomplete penetrance and sinus bradycardia, which the report took from secondary summaries; the cached primary abstract says a 3-generation pedigree in which L179F cosegregated properly, PMC holds no full-text body for the paper, and a PubMed search for SCN4B with bradycardia returns nothing, so these were not added and the 3-generation wording stays. (2) Syncope, which the report itself marks unconfirmed for this family. (3) Incomplete penetrance HP:0003829, for the same reason as item 1. (4) Treatments (beta-blockers, mexiletine, LCSD, ICD) and QT-prolonging drug or electrolyte triggers, which the report says have no LQT10-specific source. (5) SCN4B in atrial fibrillation (ATFB17) and SIDS, which are different diseases; S206L remains only as indirect support for one edge. (6) Grieco 2005 resurgent current, a neuronal study. (7) The report's HP:0001678 for AV block; the entry keeps the more specific HP:0011706. (8) ventricular cardiac muscle cell CL:0002129, since the functional data are from HEK293 cells. ClinGen Disputed status, the DISPUTED genetic typing and the knowledge gap were kept unchanged. No contradiction changed the entry: the report's 'limited or disputed' for Adler 2020 matches the cached ClinGen row (Disputed).

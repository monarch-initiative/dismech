  summary: Add SCN4B late-sodium-current hypothesis group, tag its edges, OpenScientist
    review
  details: |
    Added mechanistic_hypotheses entry scn4b_late_sodium_current (status EMERGING) for the LQT3-like model in which SCN4B L179F raises late Nav1.5 current. Tagged the two causal edges that depend on it (variant -> increased late sodium current; late sodium current -> prolonged action potential duration) with hypothesis_groups; the downstream action potential -> QT edge is general physiology and left untagged. Attached the existing knowledge gap lqt10_scn4b_causality_unestablished to the new hypothesis group. Ran OpenScientist on the hypothesis (kb/hypotheses/Long_QT_Syndrome_10/scn4b_late_sodium_current/openscientist.md, job 453b7b37-8c88-4266-9a28-a4e15ccf0aa0) and assessed it (assessments/openscientist-assessment-by-claude-code.yaml, verdict WEAKLY_SUPPORTED_UNRESOLVED). The report confirms the dispute is not resolved: one family and one HEK293 experiment, no second family or cardiomyocyte replication found. New checkable facts it adds: gnomAD v4.1 AC=1 of 152,122 for L179F, ClinVar VUS, SCN4B LoF-tolerant (pLI ~0, LOEUF 1.48); these were reproduced by an independent gnomAD query. The status stays EMERGING and the knowledge gap stays open. Its suggested cell-type lead CL:0002129 was rejected (it is an atrial cardiomyocyte). Validated with just validate, check-entity-refs, check-hypothesis-links and validate-hypothesis-assessment.

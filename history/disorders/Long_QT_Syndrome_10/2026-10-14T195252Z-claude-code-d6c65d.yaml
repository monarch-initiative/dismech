  summary: 'Strengthen: Long_QT_Syndrome_10'
  details: |
    Re-sourced the entry from the primary report, Medeiros-Domingo et al. 2007 (PMID:17592081, newly fetched): the L179F (c.535C>T) variant, its cosegregation in a three-generation pedigree and absence from 800 reference alleles, the index phenotype (21-month-old girl, QTc 712 ms, intermittent 2:1 AV block), the negative screen of 262 genotype-negative LQTS patients, and the heterologous-expression result (8-fold / 3-fold increase in late sodium current). The mechanism node was renamed from 'Increased Cardiac Sodium Window Current' to 'Increased Cardiac Late Sodium Current' to match the primary abstract; the Crotti 2008 review's window-current statement is kept as secondary evidence and the notes say so. Added Tan et al. 2010 (PMID:20226894, fetched) as indirect in vitro support for the late-current to action-potential edge (SCN4B S206L, a sudden infant death variant, prolongs APD in rat ventricular myocytes). Wired 2:1 AV block from the prolonged action potential node using two LQTS sources stating the functional mechanism (Rosenbaum and Acunzo 1991, PMID:1918714; Saoudi et al. 1991, PMID:1889452, both fetched), marked INDIRECT because the index case was not studied electrophysiologically. PubMed searches for further SCN4B-LQTS reports found none; atrial fibrillation, Brugada and SIDS SCN4B reports concern other diseases and were not added beyond the S206L functional item. ClinGen Disputed typing and the KNOWLEDGE_GAP discussion are retained. Validated with just validate, validate-terms, count-verified-snippets (25/25), entity-ref, causal-target, duplicate-key, qualifier and gene-term checks, and validate-disorders (0 issues).

  summary: 'Create: Long_QT_Syndrome_10'
  details: |
    Created a standalone entry for long QT syndrome 10 (MONDO:0012737), the SCN4B (Nav beta-4 subunit) LQTS designation, previously only a has_subtypes row in Long_QT_Syndrome. Modelled the proposed mechanism as SCN4B L179F variant -> increased Nav1.5 sodium window current -> prolonged ventricular action potential duration -> prolonged QT interval, citing the Crotti et al. 2008 review (PMID:18606002) for the index child's QT prolongation and 2:1 AV block and for the window-current finding; the action-potential edge rests on the review's LQT3 statement and is marked INDIRECT. The SCN4B genetic record is relationship_type DISPUTED with the ClinGen CGGV row and the panel's stated grounds plus Adler et al. 2020 (PMID:31983240) as evidence. gene_disease_validity was left empty because the ClinGen assertion is against MONDO:0002442 long QT syndrome, not MONDO:0012737; this is explained in notes. Added a KNOWLEDGE_GAP discussion on the single-family, no-segregation evidence base. Literature was limited to the existing reference cache because PubMed was unreachable, so the primary Medeiros-Domingo report is not cited. Validated with just validate (schema), count-verified-snippets (17/17), reference validation in validate-disorders (0 issues), entity-ref, causal-target, duplicate-key and gene-term checks; ontology term validation could not complete because DiseaseTerm membership of MONDO:0012737 needs the unreachable OLS service.

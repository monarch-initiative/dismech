  summary: 'Review round 1: add clinical sections, fix phenotype evidence'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on #13503. The first version was mechanism-only and under-consumed its own full-text anchor (Thebaud 2019 NRDP primer, PMID:31727986). Added treatments (caffeine/CAP, postnatal corticosteroids/PREMILOC, surfactant replacement/LISA), prevalence (ELGAN 35%, 80% at 22-24 weeks, BIRTH_PREVALENCE/LIVE_BIRTHS), diagnosis (36-week-PMA clinical definition), genetic susceptibility (twin heritability, no causative gene bound), environmental (supplemental oxygen -> hyperoxia node, mechanical ventilation -> VILI node, both TRIGGERS via influences_mechanisms with their own evidence), histopathology (heterogeneous lung pathology), and progression (acute neonatal injury; chronic airway/pulmonary vascular disease into adulthood). Fixed three mis-supporting phenotype evidence items: Respiratory failure now quotes the grade-3A definition, Hypoxemia now quotes the supplemental-oxygen-at-36-weeks definition, and dropped the Respiratory distress phenotype (the primer's 'respiratory distress' names RDS, a distinct entity). Corrected quote_role on the PH frequency item from PRIMARY_RESULT to REVIEW_SYNTHESIS. Added Wheezing (HP:0030828) and Chronic pulmonary obstruction (HP:0006510) phenotypes. Split 'Disrupted VEGF Signaling and Impaired Microvascular Growth' into two atomic nodes (VEGF signaling GO:0038084 DECREASED carrying the anti-sFlt-1 rescue; microvascular growth carrying the vascular-hypothesis quote). Dropped unsupported bindings (apoptotic process on hyperoxia; fibroblast on septation). Dropped the duplicate angiogenesis GO on the PH node and added a notes line that BPD-PH is clinically group 3, not group 1 PAH. Replaced the preterm-node evidence (6-14% preterm-birth figure) with the AT2/surfactant sentence that actually supports the surfactant-deficiency claim. All 36 snippets verified against cache; all terms validated. Left animal_models/modeled_mechanisms as a follow-up to keep this round reviewable; the two model papers remain cited inline on their nodes.

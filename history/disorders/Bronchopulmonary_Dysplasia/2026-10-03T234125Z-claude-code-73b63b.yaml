  summary: 'Create: Bronchopulmonary Dysplasia'
  details: |
    New complex-disorder entry for BPD (chronic lung disease of prematurity), MONDO:0019091. Modeled the multifactorial injury cascade: preterm saccular-stage surfactant-deficient lung plus antenatal inflammation (chorioamnionitis) as triggers; hyperoxic oxidative injury and ventilator-induced lung injury as amplifiers; pulmonary inflammation as the shared central effector converging on disrupted VEGF signaling/impaired microvascular growth and arrested alveolar septation (the 'new BPD' lesion), yielding reduced gas-exchange surface area and, in a subset, pulmonary hypertension. Four phenotypes (respiratory distress, chronic hypoxemia, respiratory failure, pulmonary arterial hypertension), all causally connected. 18 snippets verified against cache; all ontology terms (HP/GO/CL/UBERON/MONDO) confirmed by lookup. Evidence anchored on the Thebaud 2019 NRDP primer (PMID:31727986, graded REVIEW_SYNTHESIS), the chorioamnionitis debate piece (PMID:24128984), the anti-sFlt-1 rat rescue study (PMID:29268623, MODEL_ORGANISM) and the preterm-sheep ventilation-injury study (PMID:19816239, MODEL_ORGANISM). GeneReviews NO_CHAPTER (multifactorial, not Mendelian). The thin claude_code fallback DR report was used as a lead only; its single body PMID was off-topic and not cited.

  summary: 'Create: Linear Skin Defects with Multiple Congenital Anomalies 1 (MLS/MIDAS,
    HCCS)'
  details: |
    De novo curation of MLS1 (HCCS, MONDO:0024552) from a Perplexity sonar-deep-research report used as leads only; evidence rebuilt from PubMed. NEC preflight returned WARN with a substantive finding rather than a nuisance one: NDUFB11 was mentioned at 54 percent of the HCCS rate and COX7B at 46 percent, because MLS is genetically heterogeneous and much of the clinical literature treats all three genes as one syndrome. Acted on the warning as the tool directs - every mechanistic claim in this entry is anchored on an HCCS-specific source, and the GeneReviews chapter is cited only for gene-agnostic clinical description and management. The MLS2/NDUFB11 and MLS3/COX7B arms are named as out-of-scope boundaries in notes, preserving from the other side the separation the existing Histiocytoid_Cardiomyopathy entry already records. OMIM matched (309801). Curated the apoptosis-to-necrosis switch honestly as a proposal, not a mechanism: the source says 'We hypothesize' and 'may push', so the evidence item is PARTIAL and the causal edge is INDIRECT_UNKNOWN_INTERMEDIATES, with a KNOWLEDGE_GAP recording that it has stood unresolved since 2006 and naming the experiment that would settle it. The necrosis limb is deliberately left without a GO annotation: GO has obsoleted every term for unregulated necrosis, and the only current term asserts a regulated death programme the source does not claim, so the node carries only the evidenced arm (decreased apoptotic process) and the reasoning is recorded inline. Frequency bands follow counted cohort fractions rather than the syndrome name - microphthalmia and corneal involvement were present in 6/6 patients while the eponymous linear skin defects were present in 4/6. Validation: schema clean; 29/29 snippets verified; term validation passed after replacing the obsolete GO term; all five ungated CI gates clean.

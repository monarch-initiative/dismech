  summary: 'Address review: BAFF-R evidence and Ig-replacement cornerstone citation'
  details: |
    PR-shepherd follow-up addressing two blocking items from the ai4c-reviewer CHANGES_REQUESTED review. 1. The BAFF-R TNFRSF13C genetic entry no longer carries a NO EVIDENCE IS CURATED placeholder note. Attached the primary source, Warnatz et al. PNAS 2009 PMID:19666484, with two evidence items: a SUPPORT item for the gene-disease link (homozygous BAFF-R deletion identified in two siblings by screening a CVID cohort, with B-cell development arrested at the transitional stage) and a PARTIAL item carrying the reduced-penetrance caveat (BAFF-R deletion does not necessarily lead to clinically manifest immunodeficiency), which is what justifies retaining the SUSCEPTIBILITY rather than CAUSATIVE typing. NOTE: the review suggested PMID:19880762 as the citable source; that PMID is in fact a cardiac-hypertrophy ras-effector-peptide paper with no relation to BAFF-R, so it was NOT used. 2. The immunoglobulin replacement cornerstone claim, left uncarried after the correct PARTIAL downgrade of the COVID-19-scoped DOI:10.3390/jcm13061717 item, is now carried by a general CVID review, PMID:41045774, quoting that infections improve significantly after initiation of immunoglobulin replacement therapy. Validated with just validate and just validate-terms; all pass.

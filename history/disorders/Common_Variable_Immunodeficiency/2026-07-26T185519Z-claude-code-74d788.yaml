  summary: 'Review: CVID - fix IgRT evidence mismatch, bind gene terms, align typing
    to ClinGen strength'
  details: |
    Manual expert claim-evidence review.
    Fixed: (1) 'Immunoglobulin Replacement Therapy' was described as the lifelong cornerstone of CVID management but its only evidence was a COVID-19 prophylaxis sentence - relabelled PARTIAL/OTHER with an explicit note that a general management guideline is still needed. (2) Six genetic entries (TNFRSF13B, ICOS, NFKB1, CTLA4, LRBA, TNFRSF13C) had no gene_term binding - bound all six to HGNC (verified via OAK). (3) association values were a mix of PREDISPOSING / CAUSATIVE / 'Pathogenic Variants' - normalized and paired with relationship_type. (4) TNFRSF13B (TACI) retyped SUSCEPTIBILITY: C104R/A181E are risk alleles found in healthy relatives, not fully penetrant causes. (5) 'BAFF-R (TNFRSF13C) Mutations' asserted CAUSATIVE with zero evidence attached - downgraded to SUSCEPTIBILITY with a note that it should be removed if no citable source is found. (6) CTNNBL1, TNFSF12 and TNFSF13 are ClinGen LIMITED assertions but were being typed CAUSATIVE, silently upgrading the ClinGen strength - retyped SUSCEPTIBILITY with notes. (7) Merged the duplicate ICOS entries (one prose, one ClinGen stub). (8) Removed dangling empty datasets key.

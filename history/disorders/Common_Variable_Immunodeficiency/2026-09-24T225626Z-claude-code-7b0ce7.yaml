  summary: 'Genetics pass: twelve CVID MONDO subtypes curated and genes wired to the
    pathograph'
  details: |
    Genetics pass for issue #12239 (d2g series-032). Verified the parent anchor first: MONDO:0015517 common variable immunodeficiency resolves in OLS with that exact label and is the umbrella class this entry models, so the subtype series is not an anchor artefact. Added twelve has_subtypes rows, each bound to the MONDO child term and carrying its gene: CVID1 (ICOS), CVID2 (TNFRSF13B), CVID3 (CD19), CVID4 (TNFRSF13C), CVID5 (MS4A1), CVID6 (CD81), CVID7 (CR2), CVID10 (NFKB2), CVID11 (IL21), CVID12 (NFKB1), CVID13 (IKZF1) and CVID-APRIL (TNFSF13). Added seven new genetic records (CD19, CD81, CR2, MS4A1, NFKB2, IKZF1, IL21) and reciprocal subtype foreign keys on the five pre-existing records whose gene MONDO numbers. Relationship typing follows the ClinGen expert-panel classification rather than the presence of a MONDO term: CAUSATIVE where ClinGen returns Definitive, UNKNOWN for the three pairs it returns Limited (CD81, MS4A1, IL21), and the pre-existing SUSCEPTIBILITY typing left in place for TNFRSF13B and TNFRSF13C with the reason now stated. Fifteen of the seventeen genes reach the pathograph. Three new molecular nodes decompose what the B-cell differentiation node already named as its three upstream arms: B Cell Coreceptor Complex Failure (CD19, CD81, CR2, MS4A1; GO:0050853), BAFF/APRIL Receptor Signaling Deficiency (TNFRSF13C, TNFRSF13B, TNFSF13; GO:0033209) and NF-kB Pathway Signaling Deficiency (NFKB1, NFKB2; GO:0007249 and GO:0038061), each with a downstream edge into that node. ICOS and IL21 were bound on the existing T Cell Dysregulation node, which also gained the downstream edge it previously lacked, and CTLA4, LRBA and IKZF1 on the Immune Dysregulation and Autoimmunity node. CTNNBL1 and TNFSF12 are left unwired on purpose: both are ClinGen Limited, neither is on the MONDO gap list, and this entry holds no source placing either on a mechanism. Two MONDO label mismatches are recorded in the affected rows rather than worked around: MONDO:0014810 carries CVID13 only as a synonym under the primary label pancytopenia due to IKZF1 mutations, and MONDO:0014338 carries CVID11 only as a synonym under IL21-related infantile inflammatory bowel disease. Validation: validate-disorders clean over both changed files under linkml-reference-validator 0.3.0rc1, 173 of 173 snippets verified offline against the committed caches, and the per-file schema, term, duplicate-key, entity-ref, causal-target, qualifier-term, enum-value and gene-term-identity checks all passed.

  summary: 'Review round 1: rewire IKZF1 to a B-cell development node; add CVID14
    and CVID15'
  details: |
    Review round 1 response for PR #12737, plus two subtypes found in self-review. The reviewer objected that IKZF1 was bound only to the Immune Dysregulation and Autoimmunity node, which presented autoimmune haemolytic anaemia in one case as the reason IKAROS belongs to CVID when the defining lesion is loss of the B-cell compartment. The IKAROS discovery series was fetched (PMID:26981933, 29 affected people in six families) and a new node, Early B Cell Lymphopoiesis Failure, now carries IKZF1 with CL:0000817 precursor B cell and GO:0030183 B cell differentiation bound decreased, and a downstream edge to Hypogammaglobulinemia. A separate node rather than the existing differentiation-and-class-switch node, because the series reports markedly decreased early B-cell precursors with plasma cells still present, which places the lesion upstream of the germinal-centre failure that node describes. IKZF1 stays on the autoimmunity node as a second placement, with that node's description rewritten to say so. The reviewer also asked for the mixed CD19 evidence item to be split; the in-vitro B-cell-receptor stimulation clause and the rabies vaccination clause are now two items graded IN_VITRO and HUMAN_CLINICAL. The two skos:narrowMatch mondo_mappings for CVID1 and CVID12 were removed at the reviewer's suggestion, since both terms are now has_subtypes rows; the mappings block is empty and has been dropped. Separately, enumerating the MONDO descendants of MONDO:0015517 turned up two members of the numbered series the gap list did not contain, because MONDO records no causal gene edge on either: CVID14 (MONDO:0054691, IRF2BP2) and CVID15 (MONDO:0958013, SEC61A1). Both are now subtype rows with genetic records and are wired to the B-cell differentiation node. IRF2BP2 is typed CAUSATIVE against ClinGen's 2021 Limited classification, on the grounds that the classification predates a 34-subject, 18-family cohort with functional confirmation; the disagreement is stated in the record's notes and ClinGen's row is cited beside it. For SEC61A1, re-running the search the first draft of its note claimed showed that note to be wrong: ClinGen does curate this gene, as Moderate, against MONDO:0100337 SEC61A1 deficiency rather than against the CVID15 term, and the note and evidence now say so. Snippet verification after all changes: 191 of 191 across both files in the PR.

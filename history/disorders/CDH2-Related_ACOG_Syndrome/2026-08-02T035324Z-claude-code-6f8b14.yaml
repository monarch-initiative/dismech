  summary: Fix adversarial-verifier findings on CDH2-Related ACOG Syndrome
  details: |
    Post-review fix pass against an independent adversarial verification of the initial curation.

    Fixed:
    - CI gate scripts/check_snippet_length.py flagged two new sub-5-word snippets. Both extended to the full source sentence and re-verified verbatim: the Pulmonary hypertension evidence (PMID:41997214) and the Micropenis evidence (PMID:35708058).
    - Pulmonary hypertension was bound to HP:0002092 "Pulmonary arterial hypertension" while its own description said it must not assert the pre-capillary category. OAK confirms HP:0002092 is a descendant of HP:0033578 "Pre-capillary pulmonary hypertension". Rebound to HP:0004890 "Elevated pulmonary artery pressure", the unqualified ancestor; the false claim that HP:0002092 was the only unqualified term available was removed.
    - The Mowat-Wilson distinguishing feature asserted epilepsy is not a feature of ACOGS, contradicting this entry's own Seizure phenotype (HP:0001250, OCCASIONAL) and the HPO annotations for OMIM:618929 (infantile spasms 1/8, focal impaired awareness seizure 1/8). The epilepsy clause was rewritten; the Hirschsprung contrast was kept.
    - PMID:21300292 was over-read. The cached full text says ectodomain curvature "is likely to be somewhat variable despite rigidification by interdomain calcium binding", citing unpublished data. The "fixes the curvature" claim was dropped, the node description now reports what the source actually says, the snippet was widened to include the variability clause, and the evidence item was downgraded SUPPORT to PARTIAL. The disease-level description claim that the EC domains "are rigidified by" calcium was weakened to "separated by calcium-binding interdomain linkers", which PMID:31585109 states directly.
    - "Three Cdh2 mouse models exist and none of them models this disease" overstated a curatorial scope statement as a literature statement; rephrased to the three curated here, with an explicit acknowledgement of the brain-specific conditional-knockout literature. Related: "the strongest experimental support" for the neuroepithelial adherens-junction node was softened to "the experimental support cited here".
    - The antimorphic hypothesis asserted "heterozygous N-cadherin-null mice are normal"; the cached PMID:9015265 is abstract-only and discusses homozygotes. Weakened to "not reported as abnormal", with an explicit statement that this rests on an absence of report.
    - "Global developmental delay and intellectual disability are the constant neurodevelopmental features" contradicted the founding report's "and/or" and the HPO fractions (GDD 6/8, ID 4/8). Rewritten with the fractions stated.
    - Mowat-Wilson contrasts not backed by kb/disorders/Mowat-Wilson_syndrome.yaml (hypospadias; the uplifted-earlobe/prominent-chin gestalt detail) were removed; the notes now say which contrasts trace to that entry and that the unsourced ones were dropped.
    - The unverifiable "Orphanet has no entry in the cached Orphadata snapshot" claim (data/orphadata holds only MANIFEST.yaml; the bulk XML is gitignored) was replaced with two checkable statements: MONDO:0030065 has no Orphanet xref (OAK, 2026-08-01) and references_cache/ holds no ORPHA record for it.
    - The GeneReviews claim was rephrased from "No GeneReviews chapter exists" to a statement about two named PubMed searches on a named date.
    - Removed cross-curation meta-commentary about an earlier PPP2R3C curation from notes.
    - The notes enumeration of other CDH2 claims in dismech omitted kb/modules/reelin_terminal_translocation_lamination_failure.yaml; added as item (4).

    Rejected:
    - "DCC disease is usually familial and transmitted with reduced penetrance" and "Intellectual disability is not a consistent feature of DCC-related disease" are backed by kb/disorders/Familial_Congenital_Mirror_Movements.yaml, the entry the notes already name as the cross-reference source (described as "typically autosomal dominant"; DCC penetrance "incomplete (~68%, higher in males)"; "Intelligence and life expectancy are typically normal in isolated CMM"). Kept, with the provenance now spelled out in the notes.
    - "Most isolated Duane retraction syndrome is sporadic and non-Mendelian" is backed by kb/disorders/Duane_Retraction_Syndrome.yaml, which describes DRS as mostly sporadic with roughly 10% familial and cites GeneReviews for the autosomal dominant Mendelian forms. Kept, with the provenance spelled out.

    Validation: just validate (schema, terms, references: 85/85 snippets verified), just validate-terms, check_snippets_verbatim (85 verified, 0 failed), check_folded_hyphens --check, check_snippet_length --against-ref origin/main (no new findings), pytest tests/test_data.py (0 failed). references_cache/ churn written by the validator was reverted; no cache/*.csv change was needed because HP:0004890 was already cached.

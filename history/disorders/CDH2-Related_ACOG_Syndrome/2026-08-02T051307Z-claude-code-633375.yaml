  summary: 'Address PR #7848 review: NCIT diagnosis bindings, GDD frequency band'
  details: |
    Post-review pass on PR #7848 (reviewer comment 5155377455).

    IMPORTANT-2 (diagnosis section carried no NCIT bindings) - fixed. All four diagnosis entries now carry diagnosis_term:
    - Exome or genome sequencing -> NCIT:C101293 Next Generation Sequencing, with a has-participant (RO:0000057) qualifier for hgnc:1759 CDH2. C101293 was chosen over NCIT:C101295 Whole Exome Sequencing because the entry covers exome OR genome sequencing; runoak confirms C101293 is the common parent of both C101295 and C101294 Whole Genome Sequencing.
    - Brain MRI -> NCIT:C16809 Magnetic Resonance Imaging with a has-participant qualifier for UBERON:0000955 brain. Checked for a finer term: the only brain-specific descendants of C16809 are contrast-qualified (C137874 without contrast, C137913 with and without contrast; runoak descendants -p i on sqlite:obo:ncit, 2026-08-01), and no cached source states whether contrast was given, so the unqualified parent plus a UBERON site qualifier is the accurate binding. This reasoning is recorded inline in the entry's Brain MRI notes.
    - Echocardiography -> NCIT:C16525 Echocardiography Test. Finer descendants exist (C80404 transthoracic, C80405 transesophageal, C38634 Doppler) but no source specifies the modality.
    - Ophthalmological assessment -> NCIT:C38060 Eye Examination. Searched for an ocular-motility-specific term: runoak search "l~ocular motility" and "l~extraocular movement" return nothing usable, and the descendants of C38060 are individual instruments such as C123467 Snellen Eye Chart rather than whole assessments.
    All four terms were confirmed reachable from NCIT:C25218 with runoak ancestors -p i, and all four were already present in cache/ncit/terms.csv, so no cache rows were added.

    SUGGESTION-5 (Global developmental delay banded VERY_FREQUENT at 6/8) - accepted. Band lowered to FREQUENT, which is where 75% falls in the HPO bands (30-79%). The previous entry set VERY_FREQUENT deliberately, on the argument that the founding report makes "developmental delay and/or intellectual disability" a defining criterion; that argument survives in prose but no longer overrides the arithmetic, since no cached source gives a combined delay-or-disability numerator. The old justification also described the HP:0001263 and HP:0001249 annotations as partitioning one cohort, which cannot be right (6/8 + 4/8 = 10 > 8); the description now says only that intellectual disability is annotated separately at 4 of 8.

    SUGGESTION-3 (no treatments section) - rejected, using the reviewer's own escape hatch. Grepped all three human-clinical cached abstracts (PMID:31585109, PMID:35708058, PMID:41997214) for surgery/management/therapy/follow-up terms; the only hits are author affiliations ("Department of Neurology and Neurosurgery, McGill University"). Nothing citable about management exists in the cached sources, so the existing notes justification stands.

    SUGGESTION-4 (GeneReviews absence not independently confirmed) - no change. The entry already frames the absence as the result of two named PubMed searches on a named date rather than as a fact about the catalogue, which the reviewer accepted as the right epistemic form.

    IMPORTANT-1 (no deep-research artifact) - out of scope for this pass; handled at the batch level.

    Validation: just validate (85/85 snippets verified), just validate-terms, scripts/check_snippets_verbatim.py (85 verbatim, 0 failed), scripts/check_folded_hyphens.py --check, scripts/check_snippet_length.py --against-ref origin/main, and tests/test_data.py all pass. references_cache/ churn from just validate (issue #7507) was reverted; cache/*.csv is unchanged.

  summary: Add deep-research artifact and curate PMID:31650526 Peters anomaly cohort
  details: |
    Ran the deep-research pipeline promised in the PR description, closing the
    reviewer's outstanding finding on the missing research/ artifact:

      just research-disorder claude_code CDH2-Related_ACOG_Syndrome

    Unlike the other entries in this batch, reconciliation of the sweep against
    the entry surfaced a genuine gap, which was curated rather than merely
    reported.

    PMID:31650526 (Reis et al., Clin Genet 2020;97(3):502-508, "Novel variants in
    CDH2 are associated with a new syndrome including Peters anomaly") was absent
    from the entry. It is a second, independently ascertained CDH2 cohort: 145
    probands with developmental ocular conditions plus one syndromic-PA trio were
    exome sequenced, identifying a de novo splicing variant and three novel
    missense variants in four individuals with Peters anomaly, three of whom
    carried ACOGS-defining cardiac and callosal features. The ascertainment runs
    opposite to the founding report (PMID:31585109), which makes it independent
    confirmation of the CDH2-Peters association rather than a restatement.

    Fetched with just fetch-reference PMID:31650526; all snippets quoted verbatim
    from the resulting cache file.

    Changes:
    - phenotypes / Peters anomaly: added two SUPPORT evidence items from
      PMID:31650526. The pre-existing evidence was PARTIAL against a snippet whose
      own explanation conceded it "does not name Peters anomaly", leaving the term
      resting on the HPO annotation set alone. That explanation was updated rather
      than deleted, and the PARTIAL item retained, since it still carries the
      2-of-9 frequency fraction. Description now records the second cohort.
    - pathophysiology / "Adhesion Failure in Ocular and Genital Primordia": added
      a MODEL_ORGANISM PARTIAL evidence item for the mouse embryonic eye
      immunostaining that localises N-cadherin to the lens stalk at the moment of
      separation from the future cornea. mechanism_confidence deliberately left at
      HYPOTHETICAL: this is wild-type expression localisation, not a functional
      test and not a model of the human alleles, so every absence the node
      enumerates survives. The node description was rewritten to state both the
      new support and precisely why it does not raise the confidence.
    - references: added PMID:31650526.

    Validation: just validate PASS (schema "No issues found", terms
    "Validation passed", references 88/88 snippets verified, up from 85).
    check_snippets_verbatim.py 88 verified / 0 failed. check_folded_hyphens.py
    --check OK. check_snippet_length.py --against-ref origin/main OK, no new
    snippets under 5 words. The ~7,600-file references_cache churn (#7507) from
    just validate was reverted with git checkout; only the genuinely new
    PMID_31650526.md cache file is committed.

    Note for future runs: check_snippet_length.py reported 219 spurious "new
    findings" until origin/main was fetched - the worktree's ref was stale, and
    grandfathering is silently unavailable when the ref cannot resolve. Fetching
    origin/main restored the 1497-snippet baseline and the gate passed.

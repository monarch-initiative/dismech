  summary: 'Create: CDH2-Related ACOG Syndrome (MONDO:0030065)'
  details: |
    Deep curation of ACOGS (agenesis of corpus callosum, cardiac, ocular and genital syndrome), MONDO:0030065 / OMIM:618929, caused by de novo heterozygous CDH2 (hgnc:1759) variants.

    NEC preflight: runoak on MONDO:0030065 returns the OMIM:618929 xref, the ACOGS synonym, and exactly one causal gene relationship, RO:0004003 to HGNC:1759 CDH2. All three ACOGS clinical papers (PMID:31585109, PMID:35708058, PMID:41997214) name CDH2 as the sole causal gene; no competing gene appears in any of them, so no source was discarded on NEC grounds.

    Eight pathophysiology nodes run from the proximal molecular lesion (loss of calcium coordination at the N-cadherin EC4-EC5 interdomain site) through failure of trans homophilic adhesion with dominant-negative interference, then to midline axon pathfinding failure, neuroepithelial adherens-junction and neuronal-migration failure, myocardial cohesion failure during cardiac morphogenesis, and ocular/genital primordium involvement, converging on three organism-level outcome nodes. A separate PROVISIONAL node holds the truncating-allele class. 26 phenotypes bound to OAK-verified HPO terms.

    Frequency provenance: only abstracts were cacheable (PMID:31585109 caches as abstract_only despite a full-text attempt), so every per-feature count derives from the HPO annotation set for OMIM:618929 retrieved 2026-08-01. Features named in a cached abstract carry SUPPORT evidence; HPOA-only features carry PARTIAL evidence whose snippet supports only the cohort denominator or the organ-system statement, with the explanation stating plainly that the count is not in the cached text. One band (global developmental delay, VERY_FREQUENT against a raw 6/8) deliberately departs from its fraction and is flagged in both the phenotype and the entry notes.

    Three open discussions: acogs_truncating_allele_mechanism (dominant-negative vs haploinsufficiency), acogs_organ_level_stochasticity (discordant monozygotic twins sharing one variant), and acogs_no_model_of_the_human_allele (HUMAN_MODEL_MISMATCH; no model system carries an ACOGS allele).

    Scoping: the CDH2 arrhythmogenic right ventricular cardiomyopathy and dilated cardiomyopathy claims (both ClinGen validity Limited) are curated only as explicit contrast in differential_diagnoses and animal_models. kb/disorders/Arrhythmogenic_Right_Ventricular_Cardiomyopathy.yaml, kb/disorders/Dilated_Cardiomyopathy.yaml and kb/disorders/Chronic_Myeloid_Leukemia.yaml were not modified. The autosomal recessive CDH2 ADHD entity (p.H150Y, prodomain furin cleavage motif) is curated as an allelic differential, not as part of this disease. No treatments section: no ACOGS-specific management is attested in any cached reference.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS (85/85 snippets verified); scripts/check_snippets_verbatim.py PASS (85 verbatim, 0 failed); scripts/check_folded_hyphens.py --check PASS (no new splits); uv run pytest tests/test_data.py 16782 passed, 0 failed.

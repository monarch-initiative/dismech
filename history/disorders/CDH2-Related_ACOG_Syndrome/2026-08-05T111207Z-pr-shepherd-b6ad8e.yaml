  summary: Rebind cerebellar vermis phenotype to HP:0007068 (inferior vermis)
  details: |
    PR Shepherd pass addressing the single remaining IMPORTANT finding from the ai4c-reviewer review of 1cfefe7.

    The phenotype added in the previous shepherd pass was bound to HP:0001320 'Cerebellar vermis hypoplasia' while its preferred_term and description both specified the *inferior* vermis, and the source is equally specific: references_cache/PMID_31650526.md carries 'hypoplasia of the inferior cerebellar vermis in both patients'. The binding therefore under-specified what the source establishes, and the preferred_term claimed a granularity the term id did not carry.

    Verified HP:0007068 with OAK before editing: runoak -i sqlite:obo:hp info HP:0007068 -O obo returns name 'Inferior cerebellar vermis hypoplasia', def 'Underdevelopment of the inferior portion of the vermis of cerebellum', is_a HP:0001320. Rebound term.id and term.label to HP:0007068 and set preferred_term to the canonical label per CLAUDE.md, which prefers the ontology label as preferred_term for clarity. Renamed the phenotype entry to match; confirmed by grep that the phenotype name is not a foreign-key target anywhere in the entry.

    Note this is the reviewer's own correction of a term choice they had suggested in an earlier pass. The specificity is in the source verbatim here, so the CLAUDE.md rule to always link to the most specific available ontology term applies straightforwardly.

    Validation on the branch: linkml schema validation passed; term validation passed; reference validation 90/90 snippets verified against cached references; check-term-cache-integrity OK for 17 term and 24 enum files; check-cache-order OK. validate-terms derived exactly one new row in cache/hp/terms.csv and one in cache/enums/phenotypeterm_939f99dde0f5.csv, both inserted in sorted position rather than appended at end-of-file. No references_cache file was created or hand-edited; the cosmetic requoting churn the validator produces was discarded with git restore. The 2 snippet-length findings reported by check_snippet_length.py are in COA3-Related_COX_Deficiency.yaml and FG_Syndrome_1.yaml, both byte-identical to origin/main and unrelated to this PR.

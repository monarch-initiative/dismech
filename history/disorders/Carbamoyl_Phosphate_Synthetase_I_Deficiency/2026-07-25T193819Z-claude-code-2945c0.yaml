  summary: 'Review: remove unsupported outcome figure, structure prevalence and progression,
    add module conformance'
  details: |
    Review of the third-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Unsupported outcome statistic removed (the principal finding). The
    description asserted that the Spanish UCD registry reports "neurological
    impairment in approximately 58% of cases" for CPS1D. The cited registry
    (PMID:40218931) reports neurological impairment in 44% of UCD patients
    overall and explicitly names argininosuccinate lyase deficiency, arginase 1
    deficiency and HHH - not CPS1D - as the subtypes with worse neurological
    outcomes. The 58% figure traces to a deep-research report reading a
    full-text table (7/12 CPS1D patients); the paper is abstract-only in the
    cache and attempts to fetch full text via both PMID and DOI returned
    abstract-only, so it is unverifiable. Replaced with the two figures the
    abstract does support: CPS1D mortality 36.8% (the highest of any UCD)
    against a global UCD mortality of 14.9%, and 44% neurological impairment
    across UCDs, correctly attributed. The 36.8% mortality and the Spanish
    1:36,063 all-UCD incidence, both previously uncited, are now evidenced.

    Prevalence rebuilt. The section was a single record with no population, no
    measure_type, no prevalence_class and no evidence at all - three uncited
    quantitative claims in a free-text note. One of those claims was also a
    category error: the 1:36,063 Spanish figure is the incidence of ALL urea
    cycle disorders, not of CPS1D, and recording it as a CPS1D prevalence would
    have overstated the disorder by more than an order of magnitude. It is now
    stated as context in the disease notes rather than as a prevalence record.
    Four structured records replace it: worldwide, United States and Japan
    birth-prevalence classes quoting Orphanet ORPHA:147 epidemiology rows, plus
    the published worldwide incidence range of 1/62,000 to 1/1,300,000
    (PMID:39174957 full text). That range is recorded separately rather than
    reconciled with the Orphanet bands, because the twenty-fold spread reflects
    genuine ascertainment differences rather than a resolvable discrepancy.

    Progression rebuilt. The section was a single phase with no phase name and
    no evidence - a paragraph of prose. Split into three evidenced phases:
    neonatal-onset (severe), late-onset, and long-term outcome, quoting the
    Orphanet two-stratum definition, an adult-onset case unmasked by
    corticosteroid treatment for polymyositis (PMID:40125546), the >90%
    late-onset survival rate versus poorer neonatal-onset prognosis
    (PMID:39174957), and the registry mortality and newborn-screening benefit
    (PMID:40218931).

    Module conformance. The entry had none. Added three conforms_to edges to
    metabolic_intoxication_decompensation - Enzymatic Block in Intermediary
    Metabolism on the CPS1 node, Toxic Metabolite Accumulation and Energy
    Deficit on the impaired-ureagenesis node, and Acute Metabolic
    Encephalopathy on the hyperammonemia-driven neurotoxicity node, which maps
    the module's astrocyte glutamine-osmole swelling mechanism exactly - plus
    biological_scale tags.

    Phenotype frequencies. Seizure and Hypotonia are both Orphanet very
    frequent (99-80%) but carried no frequency; both backfilled with the
    Orphanet row as supporting evidence. All seven Orphanet-listed phenotypes
    were already present, and all seven treatments already carried evidence, so
    no additions were needed there.

    Reference cache. Committed validator-fetched full text for five references
    (PMID:25875215, 36937980, 37365635, 37480106, 39174957); the PMID:39174957
    full text is what supplied the worldwide incidence range and the
    late-onset survival figure above.

    Validation. Schema, term and reference validation all pass.

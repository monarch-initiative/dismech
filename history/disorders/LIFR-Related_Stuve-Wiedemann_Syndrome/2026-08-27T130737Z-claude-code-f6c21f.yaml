  summary: Remove a cross-reference left dangling by the schema-note revert
  details: |
    Review finding 2 on PR #9617, and a defect I introduced.

    The entry's NAMING note ended with 'See the naming note in src/dismech/schema/classifications/isds_skeletal_nosology.yaml.' That note was dropped in 22fe32b09 when the out-of-scope schema file was reverted to clear the curation-scope guard. A curator following the pointer would land on the unmodified text, which says ISDS dyadic naming is 'deliberately NOT imported into dismech entry naming here' -- reading as a contradiction of the rename the note exists to justify.

    Fixed by stating the rule inline instead of pointing at a file: the gene anchor is disambiguation applied only where one phenotypic label names more than one dismech entry, not adoption of the ISDS 2023 dyadic naming system. This is self-contained and does not depend on a schema change landing.

    This was the only reference to that file anywhere in kb/; grep confirms none remain.

  summary: Point lump/split note at the new STWS2 entry; re-verify ISDS row against
    2023 table
  details: |
    Updated as the counterpart of the new Stuve_Wiedemann_Syndrome_2 entry.

    The entry's LUMP/SPLIT note said the IL6ST form "remains a separate stub"; it now points at kb/disorders/Stuve_Wiedemann_Syndrome_2.yaml. The substantive argument in that note - that gp130 is the shared co-receptor for many IL-6-family cytokines, so complete IL6ST loss is not the same lesion as LIFR-selective loss - is unchanged and was the basis for curating STWS2 separately rather than folding it in.

    The isds_skeletal_category note was re-verified against the 2023 table: it now carries the entry number NOS 20-0020 and the exact row wording "Stuve-Wiedemann syndrome, LIFR-related" (the previous "Stuve-Wiedemann dysplasia (LIFR)" is the 2019 wording), plus the row's comment "Includes former neonatal Schwartz-Jampel syndrome or SJS type 2", which is the committee endorsing both the historical synonymy this entry records and its split from HSPG2 Schwartz-Jampel syndrome. It also records that the 2023 table lists IL6ST separately as NOS 20-0030. No change to the classification value.

    The existing Stuve-Wiedemann syndrome 2 differential is now bound to MONDO:0030756 so it resolves to the new entry.

    Part of a completeness and consistency pass over ISDS 2023 nosology group 20.

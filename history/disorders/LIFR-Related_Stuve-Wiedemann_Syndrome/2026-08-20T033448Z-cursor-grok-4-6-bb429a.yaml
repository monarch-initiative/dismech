  details: |
    De-novo curation of Stuve-Wiedemann Syndrome 1 (MONDO:0800043, LIFR)
    from Falcon deep research
    (research/Stuve_Wiedemann_Syndrome_1-deep-research-falcon.md; 7 of 7
    references resolved, 0 unresolved). Agent model grok-4.6 via Cursor.

    just preflight-dr vs MONDO:0800043: WARN, not FAIL. Canonical gene LIFR
    dominates (34 mentions). The tool flagged PAH (13) as a rival gene; that
    token is pulmonary arterial hypertension in the Warnier systematic review,
    not phenylalanine hydroxylase. IL6ST (11) is discussed only as the STWS2
    / extended-SWS differential (PMID:31914175) and was not merged. Report
    OMIM 610559 is the known Mikelonis abstract typo; MONDO and Warnier use
    601559.

    Lump/split: Disease-only for LIFR/STWS1 (option 2). IL6ST STWS2 left in
    stubs/Stuve-Wiedemann_Syndrome_2.yaml because gp130 loss abolishes a
    broader cytokine set. Not folded into Schwartz-Jampel_Syndrome (HSPG2);
    that file was not edited. Deleted stubs/Stuve-Wiedemann_Syndrome_1.yaml.

    No GeneReviews chapter. Orphanet ORPHA:3206 cache could not be rebuilt
    (en_product1.xml absent); prevalence from Warnier 69 published cases.


  summary: Cite the tobacco smoking exposure to clear check-environmental-evidence
  details: |
    CI fix. `test (3.13)` on PR #8163 was failing at
    `just check-environmental-evidence`, which is ungated and whole-KB:

        kb/disorders/Periodontitis.yaml:environmental[0]: 'Tobacco smoking'

    The entry was not uncited in the ordinary sense -- its
    `influences_mechanisms` link already carried evidence. What was missing is the
    entry-level `evidence:` block, which is a separate claim: the link asserts that
    the exposure acts on a particular mechanism node, while the entry asserts that
    the exposure bears on the disease at all. The check looks at the latter, and
    CLAUDE.md is explicit that the two are distinct.

    Both clauses of the existing description are covered by snippets already
    exact-verified elsewhere in this same file, so nothing new was fetched:

    - PMID:28805207 (the Nat Rev Dis Primers primer) for smoking as a modifiable
      environmental determinant of periodontal disease severity. The explanation
      records that the primer names smoking as the *exemplar* modifiable factor and
      does not rank the modifiable factors, so it does not by itself carry the word
      "principal" in the description. Left the description alone rather than
      weakening it -- the ranking is standard in the field -- but the gap is written
      down instead of being implied to be covered.
    - PMID:32383274 (the EFP S3 guideline) for risk-factor control being the first
      named intervention category, which is what makes this exposure a therapeutic
      target rather than only a descriptive risk factor.

    Both are graded HUMAN_CLINICAL, matching how the same two sentences are already
    graded in this file, so `check-snippet-grading` stays clean -- a quoted sentence
    must not change `evidence_source` because it was reused in another slot.

    No waiver was used. A `review_notes:` waiver records a search that found
    nothing quotable; here the sources were already in the cache.

    Validation: `just validate` passes; 50/50 snippets verified.
    `check-environmental-evidence` now reports OK. `validate-terms`,
    `check-entity-refs`, `check-duplicate-keys`, `check-causal-targets`,
    `check-qualifier-terms`, `check-enum-values`, `check-folded-hyphens`,
    `check-snippet-length`, `check-case-collisions`, `validate-history` all clean.

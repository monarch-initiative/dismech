  summary: 'Create: Periodontitis (MONDO:0005076) including the oral-to-gut translocation
    arm'
  details: |
    New disease entry created in response to the #6098 oral-gut-axis scoping handoff.

    Scoping decision. Assessed the proposed "oral-gut axis dysregulation" module against
    the existing module set and concluded a three-dimensional barrier/metabolism/immunity
    module would largely duplicate intestinal_barrier_dysfunction,
    epithelial_barrier_dysfunction, gut_dysbiosis and molecular_mimicry_autoimmunity. The
    non-redundant kernel is the DIRECTIONAL oral-to-gut pathobiont route, which had no home
    in the KB because Periodontitis itself was absent - it appeared only as a phenotype
    inside Acatalasia and as free text in a Rheumatoid_Arthritis node note. Curated the
    anchor disease instead, modelling the oral-to-gut arm as explicit pathophysiology nodes,
    and recorded an oral_gut_axis_module_scope CURATION_TODO stating the condition under
    which a module would become justified (a second conformer, most plausibly
    Inflammatory_Bowel_Disease or Rheumatoid_Arthritis).

    Content. Eleven pathophysiology nodes: dysbiotic subgingival biofilm ->
    keystone-pathogen remodelling and complement subversion -> Th17/neutrophil
    immunopathology -> osteoclast-mediated alveolar bone resorption (conforms_to
    osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption) -> attachment loss
    and pocket formation; then three downstream arms - haematogenous dissemination; oral
    pathobiont expansion and ingestion -> ectopic intestinal colonisation plus gut-homing
    oral-pathobiont-reactive T cells; and Aggregatibacter actinomycetemcomitans leukotoxin-A
    neutrophil hypercitrullination - converging on a chronic systemic inflammatory burden
    node. Three mechanistic_hypotheses (keystone-pathogen CANONICAL; oral-to-gut
    translocation EMERGING; periodontal citrullination EMERGING). Seven phenotypes, two
    structured prevalence records (GBD severe-periodontitis point prevalence and annual
    incidence, kept as separate measure_type records), ITGB2/LAD-I as the monogenic entry
    point, tobacco smoking as an environmental factor wired in via influences_mechanisms,
    and six treatments with target_mechanisms on the biofilm, breakdown and comorbidity
    nodes.

    Epistemic guardrails. A HUMAN_MODEL_MISMATCH discussion records that every step of the
    oral-to-gut chain rests on murine and gnotobiotic models, with three structured
    proposed_experiments to resolve it. A KNOWLEDGE_GAP records that the
    periodontal-systemic interventional evidence base is surrogate-marker-based. The
    P. gingivalis / Alzheimer citation is deliberately scoped to the dissemination step only
    and flagged in node notes. The RANKL/OPG mechanism is deliberately NOT asserted on the
    bone-resorption node because no verified quotable snippet was available.

    Evidence discipline. Eighteen references fetched via `just fetch-reference`; no cache
    file was hand-written. Eight further PMIDs recalled from memory turned out on fetch to
    point at unrelated papers (orthopaedic surgical training, mycobacterial zinc efflux,
    hepatic gluconeogenesis, checkpoint colitis) and were discarded rather than used - the
    corrected identifiers were resolved via PubMed esearch and re-fetched. Unused fetched
    cache files were removed rather than committed.

    Validation actually run and read: `just validate` PASS; `just validate-terms` PASS;
    `just count-verified-snippets` reported 48/48 snippets verified against cached
    references; `just check-term-cache-integrity` OK; `just check-reference-cache-frontmatter`
    OK. The slow batched `just validate-disorders` sweep was run over the changed file before
    opening the PR.

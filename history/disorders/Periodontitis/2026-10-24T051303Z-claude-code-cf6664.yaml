  summary: Add sex-dependent inflammasome bone-loss node
  details: |
    Added PMID:41144672 (Inflammasome targeting for periodontitis prevention is sex dependent). New pathophysiology node Inflammasome-Dependent IL-1 Beta Release, feeding the existing osteoclast bone-resorption node; an EMERGING hypothesis sex_dependent_inflammasome_bone_loss; and a HUMAN_MODEL_MISMATCH discussion asking whether the male-restricted inflammasome dependence shown in the ligature mouse model holds in humans. Human evidence is correlational (higher crevicular IL-1 beta in men); the causal and sex-restricted steps are murine (Il1b/caspase-1-11/Asc knockouts, caspase-1/4 inhibitor). No gene bound on the node since the dependence is not shown in humans. Validated: validate, validate-terms, check-entity-refs, 56/56 snippets. Review round 1 (PR 15476): corrected the female result from "no effect" to the sex-opposite finding (Il1b deletion no effect; caspase-1/11 or Asc deletion worsens disease), added that full-text sentence as evidence on the edge and the discussion, bound macrophage as the IL-1-beta cell type, changed the osteoclast edge to INDIRECT_KNOWN_INTERMEDIATES (RANK/RANKL), and recorded the knockouts in the node notes.

  summary: Add sex-dependent inflammasome bone-loss node
  details: |
    Added PMID:41144672 (Inflammasome targeting for periodontitis prevention is sex dependent). New pathophysiology node Inflammasome-Dependent IL-1 Beta Release, feeding the existing osteoclast bone-resorption node; an EMERGING hypothesis sex_dependent_inflammasome_bone_loss; and a HUMAN_MODEL_MISMATCH discussion asking whether the male-restricted inflammasome dependence shown in the ligature mouse model holds in humans. Human evidence is correlational (higher crevicular IL-1 beta in men); the causal and sex-restricted steps are murine (Il1b/caspase-1-11/Asc knockouts, caspase-1/4 inhibitor). No gene bound on the node since the dependence is not shown in humans. Validated: validate, validate-terms, check-entity-refs, 56/56 snippets.

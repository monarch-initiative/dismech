  summary: Record that inflammaging does not apply to Multiple_Sclerosis
  details: |
    Added a top-level notes entry recording that the entry does not conform to the inflammaging module: that module describes chronic, low-grade, age-driven sterile systemic inflammation, while MS inflammation is autoimmune and antigen-driven. The note points to the existing Th1/Th17-Mediated Neuroinflammation node and to the glial senescence node, which already carries the age-related biology. This closes the inflammaging item of #14173 for MS so the module is not proposed for this entry again.

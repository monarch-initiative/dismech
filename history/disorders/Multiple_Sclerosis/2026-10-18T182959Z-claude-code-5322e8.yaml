  summary: Add human myelin microphysiological system experimental model
  details: |
    Added an experimental_models record for the human myelin microphysiological system from preprint PPR:PPR1322929 (Tian et al. 2026): neural organoids on 3D-printed microfiber devices co-cultured with oligodendrocyte progenitor cells, then with T cells and monocytes from MS patients or healthy donors. Linked to Demyelination (PARTIALLY_RECAPITULATES, MODERATE, TISSUE scale, two readouts) and Th1/Th17-Mediated Neuroinflammation (MEASURES, LOW, with a PROXY_QUANTITY divergence because the abstract does not name Th1 or Th17 lineages). Typed BOUNDARY_OMISSION and TEMPORAL_SCOPE divergences on the demyelination link. The limitations record that increased myelin uptake by patient monocytes/macrophages here contrasts with the reduced myelin phagocytosis by MS patient monocyte-derived macrophages reported in PMID:29379818. The responder and nonresponder profiles for prednisone, glatiramer acetate, interferon beta-1a and dimethyl fumarate are recorded on the model only, not on the treatments, because a single unreviewed predictive-platform study does not establish how those drugs act. No peer-reviewed source for this platform was found in PubMed beyond the bioRxiv record of the same preprint (PMID:42779865).

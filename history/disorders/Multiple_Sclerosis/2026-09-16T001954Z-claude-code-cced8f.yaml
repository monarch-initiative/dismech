  details: |
    Addressed two IMPORTANT findings and three of the suggestions from the automated PR review on #11912 (monarch-initiative/dismech#11912). (1) The 'Oligodendrocyte Precursor and Microglial Autophagic-Mitophagic Dysregulation' node was an orphan with no incoming downstream edge; added one from 'Th1/Th17-Mediated Neuroinflammation', citing the PMID:34099564 sentence stating the dysregulated-autophagy models were 'induced by proinflammatory cytokines' -- Th1/Th17 is the node in this entry that specifically names proinflammatory cytokine production, a more precise fit than the reviewer's suggested Compartmentalized CNS Inflammation. (2) That same PMID:34099564 sentence spans both in vitro and in vivo MS models in one clause and cannot be cleanly split per the evidence_source-per-source-type rule; both its occurrences (node-level and the new edge) were changed from MODEL_ORGANISM to OTHER, with the explanation noting why. (3) Changed modifier ABNORMAL to the more precise DYSREGULATED (a valid ModifierEnum value) on the macroautophagy biological_process. (4) Added NLRP3, PYCARD, and CASP1 gene bindings to the 'Microglial NLRP3 Inflammasome Activation' node -- all three are named in its own evidence snippets and its stroke sibling node already binds its analogous driver gene (TRIM62). Did not add edge-level evidence to the three structural edges the reviewer flagged as uncited (MS Compartmentalized CNS Inflammation->NLRP3, MS NLRP3->Axonal Damage, stroke Neurovascular inflammation->NLRP3) since the reviewer marked this optional and no further citable primary source was found for those specific structural claims; did not touch the incidental hgnc:30766 TRAF3IP3 cache row from an earlier lookup typo since the reviewer called it harmless and cache rows should not be hand-edited. Re-validated with just validate-disorders, just check-entity-refs, just check-causal-targets (0 new dangling targets), and just check-snippet-grading after the evidence_source changes.

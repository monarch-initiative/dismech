  details: |
    Landed the part of the earlier OpenScientist sweep (PR #12010 lane) that never merged for this entry, re-derived against current main rather than merged from the old branch. Added the assessment sidecar for the canonical_autoimmune_demyelination_neurodegeneration_model hypothesis (openscientist-assessment-by-claude-opus-5.yaml, PARTIALLY_SUPPORTED over seventeen source-checked claims); it was absent from main while the sibling chronic-active-lesion hypothesis already had one. Twelve citations from the old sweep were still absent; eleven were re-applied and one (PMID:41961242) was never an evidence reference. On the canonical hypothesis, whose notes asserted all three pillars against only the seed review: PMID:35025605 for the EBV-then-neuroaxonal-injury ordering, PMID:41284953 for the PIRA qualification, PMID:39711984 for therapy resistance of smouldering inflammation. The OpenScientist report attributed that last sentence to PMID:41961242 and marked it verified; the cached full text of PMID:41961242 does not contain it, so the claim is curated against the correct paper and the misattribution recorded as a rejected claim in the sidecar. On the chronic-active-lesion hypothesis, PMID:40897401 sources the slowly-expanding-lesion half of the biomarker arm that the notes assert but had cited only for paramagnetic rims. New MOLECULAR pathophysiology node EBNA1-GlialCAM Molecular Mimicry (PMID:35073561 IN_VITRO for the mimicry, PMID:40063790 twice for independent confirmation and the HLA-DRB1*15:01 interaction) with a downstream edge into the existing Inflammatory Lesions node carried by mouse EAE immunization and graded MODEL_ORGANISM. PMID:34293193 sources the meningeal compartment on Compartmentalized CNS Inflammation, which asserted it uncited. PMID:35025605 also goes on the environmental Epstein-Barr Virus Infection entry, whose evidence had rested on reviews reporting the cohort second-hand. PMID:21555250 on Anti-CD20 B-cell Depletion Therapy says which B-cell function the response implicates, which the six efficacy-trial items do not. PMID:41666922 adds choroid plexus enlargement as a third candidate substrate on the existing controversy_ms_pira_anatomical_substrate discussion. New controversy_ms_inside_out_versus_outside_in discussion (PMID:34156169, PMID:35285112 twice) records the inside-out alternative, noting that the report treated myelin blistering as observed to precede immune infiltration when its cited review does not time the two events. All ontology bindings (CL:0000236, CL:0000980, GO:0042113, GO:0002455, UBERON:0001017) were confirmed present in the repo label and dynamic-enum caches before use. Every snippet was re-derived from references_cache records fetched fresh with just fetch-reference, not copied from the old branch; nine of the twelve came back as full text rather than abstract only. Nothing was skipped as already covered: main had none of the twelve, and no node the old sweep targeted had been renamed away. Verified: linkml-validate clean, 208/208 snippets verified, duplicate-key, entity-ref, causal-target, enum-value and folded-hyphen gates all OK, and the sidecar passes validate-hypothesis-assessment.

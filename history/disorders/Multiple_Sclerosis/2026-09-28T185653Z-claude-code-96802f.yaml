  summary: Add mitochondrial respiratory deficiency node conforming to mitochondrial_dysfunction
  details: |
    Added the pathophysiology node Neuronal and Axonal Mitochondrial Respiratory Deficiency, conforming to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress. This fills the mitochondrial_dysfunction target named in #11902 and #11948 that the autophagy/senescence/inflammasome curation did not wire.

    The node rests on post-mortem human brain studies: reduced complex I and III activity and neuron-specific loss of mitochondrial gene expression in motor cortex (PMID:16392116); an excess of complex IV-deficient neurons over aged controls in secondary progressive MS (PMID:21446022); reduced neuronal PGC-1alpha with reduced oxidative phosphorylation subunits (PMID:23073717); complex IV defects restricted to Pattern III acute lesions (PMID:18515320); and complex IV loss in cerebellar Purkinje cells (PMID:40523174). A downstream edge to Axonal Damage cites the calcium-mediated degeneration interpretation (PMID:16392116) and the correlation of PGC-1alpha loss with neuronal loss (PMID:23073717).

    Two REFUTE items are recorded. PMID:18286391 found no excess of mitochondrial DNA deletions in MS brain, which contradicts the mtDNA-deletion origin reported in PMID:21446022. PMID:19591199 found complex IV activity increased, not decreased, inside white-matter lesions. The same paper's statement that lesional mitochondrial changes coincide with raised oxidative stress supports the reactive oxygen species arm.

    All seven references were fetched into references_cache. Only the human post-mortem findings are cited; EAE mouse results in PMID:40523174 are not. One snippet from PMID:18515320 uses an ellipsis in place of a bracketed span that the validator strips. Schema, snippet, term, entity-ref, causal-target and duplicate-key checks pass.

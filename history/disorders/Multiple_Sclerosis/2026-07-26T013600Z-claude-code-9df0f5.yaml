  summary: Fix PMID:28757204 snippet case mismatch found by strict re-check
  details: |
    Follow-up to the neuroimmune claim-evidence audit, prompted by the ai4c-reviewer finding on PR #6962.

    The reviewer caught that a snippet this audit introduced in Neurosarcoidosis (PMID:32404428) used ASCII straight quotes where the cached source has typographic quotes, and correctly identified the cause: the audit's own substring checker folded Unicode punctuation and case, whereas linkml-reference-validator requires an exact substring. That fix was applied by the PR shepherd in d0b92881.

    Re-running the check in STRICT mode (whitespace-collapse only, no Unicode folding, no case folding) across all ten audited entries surfaced a second failure the reviewer did not flag, in this file: the environmental > Vitamin D Deficiency evidence item for PMID:28757204 begins 'We showed that heterozygote carriers...' where the abstract reads '...we showed that heterozygote carriers...' -- a capitalized W that the case-folding checker accepted. This snippet predates the audit; it was masked, not introduced, by it.

    Fixed by extending the snippet leftward to the true sentence start ('By analyzing 8,711 individuals, we showed that...'), which is an exact substring and also supplies the cohort size, rather than lowercasing a sentence-initial word.

    Strict re-check now reports 0 failures across all ten entries (668 evidence items). The audit report's Method section has been corrected to record the checker's blind spot and both masked failures, so the report does not overstate what was verified.

    Validation: linkml-validate (Disease) passes; strict substring check clean.

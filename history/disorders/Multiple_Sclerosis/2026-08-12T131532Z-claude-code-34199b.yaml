  summary: Link EBV and vitamin D deficiency to the neuroinflammation node
  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the Th1/Th17 neuroinflammation node, the most upstream immunopathology node this entry offers, and Epstein-Barr virus is graded above vitamin D deficiency on evidence rather than preference. The viral exposure has a quantified hazard, roughly fifteen-fold after childhood infection and thirty-fold after adolescent or later infection, is described by its source as the strongest known risk factor for the disease, and is argued in a second item to be necessary though not sufficient. The vitamin D link rests on a genetic-instrument argument, a low-frequency coding variant that raises the risk of vitamin D insufficiency also raising the odds of this disease, which is harder to confound than an observational association but still measured against disease risk. Both links leave the intermediates unknown, because no cited sentence follows either exposure to myelin-reactive T cells; for the virus in particular the route from infection to this node is exactly what the field is still arguing about. Two evidence items available on these exposures were deliberately not used, because their snippet is simply the title of the paper rather than a sentence from its abstract, which records that a question was examined rather than what was found. Where a real abstract sentence existed it was used instead. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 155 of 158 with 3 pre-existing DOI-prefix skips, one of which is on an item cited here and was checked by hand.

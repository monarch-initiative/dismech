  summary: Split mtDNA-deletion evidence onto its own node; rename and widen the respiratory
    deficiency node
  details: |
    Review round on PR #14179.

    Added the node Clonally Expanded Neuronal mtDNA Deletions, conforming to mitochondrial_dysfunction#Mitochondrial Damage and mtDNA Mutation, with a direct edge to the respiratory deficiency node. The SUPPORT item from PMID:21446022 on clonally expanded deletions and the REFUTE item from PMID:18286391 moved from the deficiency node to this node, because both concern the cause of the deficit rather than the deficit. Added a second PMID:21446022 item on deletions throughout gray matter and an edge item quoting that deletions explained the defect in most respiratory-deficient neurons. The node binds GO:0009060 aerobic respiration (DECREASED), reusing the module node's binding; GO:0000002 mitochondrial genome maintenance was checked in OLS and is obsolete.

    Renamed Neuronal and Axonal Mitochondrial Respiratory Deficiency to CNS Mitochondrial Respiratory Deficiency, since the node also binds oligodendrocytes and astrocytes, and rewrote its description to separate the Pattern III lesion finding. Added cerebellar cortex (UBERON:0002129) and white matter (UBERON:0002316) to its locations to match the Purkinje cell and lesion evidence.

    Added an edge from Demyelination to the deficiency node with causal_link_type UNKNOWN and directness INDIRECT, quoting the hypothesis sentence in PMID:19591199; the description says the link is proposed, not demonstrated.

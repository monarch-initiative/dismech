  summary: 'Claim-evidence audit: retire PRMS course, drop 14 NO_EVIDENCE items'
  details: |
    Claim-evidence correctness audit of 10 neuroimmune entries.

    Removed the 'Progressive-Relapsing' progression phase: PRMS was retired as a clinical-course descriptor by the 2013 Lublin revision (PMID:24871874), and all five of its evidence items were tagged NO_EVIDENCE with explanations stating the reference did not address PRMS. The historical context was folded into the Primary Progressive notes and backed by two verified quotes from PMID:24871874.

    Removed 9 further NO_EVIDENCE evidence items whose cited papers did not support the attached claim; five of them carried explanations asserting support, most egregiously PMID:10073279 (an interferon beta paper) attached to the Corticosteroids treatment. Per CLAUDE.md the fix for an unsupportable claim is removal, not re-tagging. No claim lost its last remaining support: every affected block retains verified SUPPORT/PARTIAL evidence.

    Set evidence_source: MODEL_ORGANISM on PMID:35963325 (EAE preclinical model) under diagnosis > Evoked Potentials, which previously defaulted to HUMAN_CLINICAL, and rewrote its explanation to state the finding is from the animal model.

    Repaired seven snippets that failed substring validation because a mid-sentence truncation appended a terminal period, plus PMID:24314688 where curly double quotes had been replaced with straight single quotes.

    Validation: linkml-validate (Disease) passes; linkml-term-validator --labels passes; all 144 remaining evidence snippets verified as exact substrings of their references_cache entries.

  summary: Add immune semaphorin mechanisms to Multiple Sclerosis
  details: |
    Added two pathophysiology nodes and their supporting evidence for issue #14241. SEMA4A-Driven Th1/Th17 Skewing is wired downstream to the existing Th1/Th17-Mediated Neuroinflammation node, with human dendritic-cell and serum data (PMID:22491253), mouse loss-of-function (PMID:15780988) and EAE gain-of-function (PMID:24439904). Semaphorin-Impaired Oligodendrocyte Precursor Recruitment is wired downstream to Demyelination, with MS tissue expression (PMID:17855378), class 3 semaphorin gain/loss of function in an adult demyelination model (PMID:21421691), and the Sema4D arm from antibody blockade in vitro and in vivo (PMID:25461192) plus the plexin-B1 receptor assignment (PMID:20038643). Added the anti-SEMA4D antibody pepinemab as a treatment targeting that node, recording target engagement only in humans, with the phase 1 trial NCT01764737 and its report (PMID:28642891). Added a CONTROVERSY discussion for the conflicting serum Sema4A direction, since a 2026 treatment-naive case-control study (PMID:42524290) found serum Sema4A lower rather than higher; that result is also recorded as a REFUTE evidence item on the node. The 2021 review named in the issue (PMID:33756227) is not cited: every claim is taken from a primary source instead. Validated with just validate, just validate-terms, just count-verified-snippets (250/250), check-entity-refs, check-causal-targets, check-logical-rules, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-delivery-system and check-snippet-grading.

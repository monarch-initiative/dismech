  summary: 'Integrate assessed OpenScientist findings: EBV mimicry, PIRA, CALs, inside-out'
  details: |
    Reviewed both OpenScientist hypothesis-exploration reports for this entry and integrated the claims that survived source checking.

    Wrote a new assessment sidecar for canonical_autoimmune_demyelination_neurodegeneration_model (assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict PARTIALLY_SUPPORTED, 17 claims). Every load-bearing PMID in that report resolves to a real paper, but three statements failed source checking: the smouldering/DMT-resistance sentence is attributed to PMID:41961242 and is actually from PMID:39711984 (the cached full text of 41961242 does not contain the word 'resistant'), the EBNA1-GlialCAM epitope-spreading result is reported as demonstrated where its source says 'suggest', and the NfL-versus-GFAP dissociation is uncited and sits beside a paper that links sNfL to PIRA risk. Four of the report's seven 'confirmed findings' restate the seed hypothesis verbatim, so the verdict is not independent corroboration. Used the existing claude-code assessment for chronic_active_lesion_smouldering_inflammation_pira rather than writing a second.

    Integrated into kb/disorders/Multiple_Sclerosis.yaml:
    - canonical mechanistic_hypotheses: three evidence items for claims its notes already asserted without citation - PMID:35025605 (serum NfL rose only after EBV seroconversion, so the exposure precedes measurable CNS injury), PMID:41284953 (PIRA the main disability-accrual mechanism in all four latent-class phenotypes of 2,563 untreated patients), PMID:39711984 (smouldering neuroinflammation relatively resistant to existing DMTs, cited to the correct paper).
    - chronic_active_lesion_smouldering_inflammation_pira: PMID:40897401, the slowly-expanding-lesion diffusion-MRI cohort that corroborates the biomarker arm through a second, mechanistically distinct chronic-active-lesion marker. This was the only uncited candidate in the existing assessment.
    - New pathophysiology node 'EBNA1-GlialCAM Molecular Mimicry' (biological_scale MOLECULAR, B cell / plasmablast, GO B-cell activation and circulating-immunoglobulin humoral response), with a downstream edge to Inflammatory Lesions carried by mouse EAE perturbation evidence and marked INDIRECT_UNKNOWN_INTERMEDIATES. Evidence from PMID:35073561 (structural/biochemical demonstration, IN_VITRO) and PMID:40063790 (blocking-experiment confirmation in 650 cases vs 661 controls, plus the HLA-DRB1*15:01 interaction). The entry previously carried the EBNA1-GlialCAM proteomics dataset but no mechanism for it.
    - environmental Epstein-Barr Virus Infection: PMID:35025605, the primary >10M-person military cohort behind the risk estimate the entry previously carried only through reviews.
    - Compartmentalized CNS Inflammation: PMID:34293193 for the meningeal compartment (ectopic lymphoid follicles in ~40% of progressive post-mortem brains).
    - Anti-CD20 B-cell Depletion Therapy: PMID:21555250 for the non-antibody B-cell functions the plasma-cell-sparing efficacy implicates - the mechanistic half of the anti-CD20 story the trial evidence does not supply.
    - controversy_ms_pira_anatomical_substrate: PMID:41666922 adds choroid plexus enlargement as a third candidate PIRA substrate, recorded as a prognostic association with the report's 'CSF-mediated inflammation' gloss dropped.
    - New discussion controversy_ms_inside_out_versus_outside_in (CONTROVERSY, OPEN) with PMID:34156169 and PMID:35285112.

    Deliberately not changed: hypothesis status stays CANONICAL, as the report itself recommends; the anti-CD20 efficacy numbers, already curated at primary-trial grade (OPERA/ORATORIO/ASCLEPIOS), so the report's review-level citations add nothing; the polygenic-architecture claim, already covered by the HLA-DRB1/IL7R/IL2RA/CD40/TYK2/STAT3/CD28 genetic entries; the NfL-versus-GFAP dissociation, left out as an uncited generalization; the misattributed 41961242 snippet; and no BTK-inhibitor treatment entry was created, since PMID:40202696 is already curated on the sibling hypothesis and a treatment entry is a separate curation-completeness question.

    Verified: just validate-hypothesis-assessment (passed), count-verified-snippets 192/195 with 3 skipped by prefix and no failures, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-snippet-grading all OK.

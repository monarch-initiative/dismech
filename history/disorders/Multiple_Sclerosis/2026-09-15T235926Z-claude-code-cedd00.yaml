  summary: Add autophagy/senescence/inflammasome pathophysiology nodes
  details: |
    Addressed issue #11902 (leftover from #6189/#5847, PMID:42419491 Ellappan et al. 2026 axis handoff). Added three new pathophysiology nodes evidenced with primary literature (not the review, which is background-only): (1) Oligodendrocyte Precursor and Microglial Autophagic-Mitophagic Dysregulation, conforms_to disabled_macroautophagy#Failure of Cytoplasmic Quality Control, cited to PMID:34099564 (human MS biofluid autophagy/mitophagy marker elevation + in vitro/in vivo model rescue by autophagy inhibitors) and PMID:38363533 (EAE model + OPC myelin-debris engulfment, BECN1 dysregulation); (2) Chronic Inflammation-Induced Oligodendroglial and Glial Senescence, conforms_to cellular_senescence#Senescent Cell Accumulation, cited to PMID:39891488 (post-mortem P-MS histopathology, p16+/53BP1+ senescent cells in demyelinated lesions correlating with faster disability) and PMID:38722375 (human converted-oligodendrocyte senescence induced by pro-inflammatory microglial supernatant); (3) Microglial NLRP3 Inflammasome Activation, conforms_to nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation, cited to PMID:41687275 (post-mortem brain white matter + PBMC NLRP3/IL1B/IL18/CASP1/PYCARD elevation specific to chronic active lesions in PPMS). All three nodes are wired into the existing pathograph via new downstream edges from/to Compartmentalized CNS Inflammation, Demyelination, and Axonal Damage, most with their own edge-level evidence distinct from node-level evidence. Researched via manual PubMed E-utilities search (NCBI esearch/efetch), not a just research-disorder deep-research run, since this was a targeted literature search for three specific mechanisms rather than a full disease research pass. Validated with just validate-disorders (schema+terms+references, 189/192 snippets verified, 3 skipped by prefix), just check-entity-refs, just check-causal-targets (0 new dangling targets), just check-duplicate-keys, just check-qualifier-terms, just check-enum-values, and just list-gene-term-mismatches (0 mismatches).

  summary: Add computational models for multiple sclerosis
  details: |
    Added three evidence-backed computational models: the UISS-MS agent-based immune/treatment simulator, the repository-backed 2024 Virtual Multiple Sclerosis Patient whole-brain model, and its 2025 lesion-aware paper-only successor. Linked models only to exact pathophysiology nodes and recorded relationship, fidelity, readouts, validation scope, repository licensing, and reproducibility limitations. Excluded newer finite-element, normative-imaging, and preprint candidates because their outputs did not map cleanly to current pathophysiology nodes or lacked curation-ready validation. A bounded OpenScientist run with one iteration and hypotheses enabled produced redundant disease-level hypotheses, two unsupported exact quotes, and no new computational-model lead; its generated report, artifacts, and unused caches were removed.

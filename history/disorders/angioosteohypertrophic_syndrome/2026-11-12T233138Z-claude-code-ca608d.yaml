  summary: Reviewed angioosteohypertrophic syndrome (KTS), grounded somatic PIK3CA
    kinase activity, mined PROS GeneReviews and StatPearls chapters, and expanded
    phenotypes and targeted therapies
  details: |
    Repaired gene_activity_grounding_baseline defect on Somatic PIK3CA activation in malformed tissue by adding GO:0046934 molecular function (INCREASED) and SOMATIC/HETEROZYGOUS/GAIN_OF_FUNCTION genetic_context while preserving HP:0001442 somatic mosaicism inheritance for Somatic_Mosaic_Disorders grouping; added evidenced classifications, ORPHA:90308 prevalence, and tagged PMID:23946963 (GeneReviews) and PMID:32644415 (StatPearls); expanded phenotypes from 4 to 11 HPO-bound entries (100% causally connected); enriched treatments with CHEBI-bound alpelisib (CHEBI:231324) and sirolimus/everolimus (CHEBI:9168, CHEBI:68478), sclerotherapy, and venous/overgrowth surgery with bare-name target_mechanisms; evidenced clinical, affected-tissue somatic PIK3CA, and radiographic/ultrasound/MRI surveillance diagnosis entries and Parkes Weber differential diagnosis; removed empty list blocks.

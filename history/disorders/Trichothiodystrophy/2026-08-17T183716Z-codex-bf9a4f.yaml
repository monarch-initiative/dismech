  summary: 'Publication-readiness review: Trichothiodystrophy'
  details: |
    Deep publication-readiness review retained MONDO:0018053 as the heterogeneous
    trichothiodystrophy umbrella and made its lump/split decision explicit with
    photosensitive/non-photosensitive facets plus 11 causal genes and 13
    gene-defined or clinical subtypes. RNF113A remains X-linked recessive; the
    other established branches are predominantly autosomal recessive.

    Replaced the over-unified baseline with 26 atomic, evidence-calibrated
    pathophysiology nodes spanning TFIIH/NER, ERCC2 transcription, R-loop,
    beta-globin, and B-cell branches, conditional GTF2E2 transcription and
    erythropoiesis, MPLKIP-DBR1 lariat/splicing, RNF113A, and aminoacyl-tRNA
    synthetase mechanisms. Expanded the clinical record to 26 causally connected
    phenotypes, evidence-bounded diagnosis and differentials, supportive
    management, two animal models, four experimental models, and three explicit
    knowledge/model-fidelity discussions.

    Added and verified ArrayExpress E-MTAB-10567 and GEO GSE262217; no dedicated
    TTD GeneReviews chapter was identified. Added 33 reference caches generated
    only with `just fetch-reference` (32 PMID and one official Orphadata API URL).
    The configured targeted pre-commit trailing-whitespace hook mechanically
    normalized `PMID_32152280.md` and `PMID_39055713.md`, and the configured
    end-of-file hook normalized the endings of all 32 generated PMID caches. No
    cache was manually edited and no validator churn was retained.

    At target SHA-256
    0e065426217c9351ea44b9801b73d55b22f38a2bd602bd72fbc8728d1d8caaec,
    schema, duplicate-key, ontology-label, graph, diff,
    reference-cache-frontmatter, and focused target tests passed; 203/203
    snippets matched cached sources, phenotype connectivity was 26/26,
    causal-gene wiring was 11/11, and all 16 exact `test_data.py` node IDs
    passed. The only reference-validator message was the expected non-blocking
    unsupported-source warning for ArrayExpress.

    A broad `just test` run on the immediately preceding content completed with
    3,521 passed, 35 skipped, and two failures. One target-local folded-scalar
    formatting failure was corrected without changing YAML semantics, and its
    focused gate then passed 3/3. The remaining failure is the unrelated
    case-insensitive-filesystem hard-link fixture on macOS; this record does not
    claim that the broad suite passed globally.

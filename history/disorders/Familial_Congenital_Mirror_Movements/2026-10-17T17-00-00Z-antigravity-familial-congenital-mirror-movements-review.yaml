  details: 'Added MONDO exact synonyms, Harrison''s chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE),
    fetched and mined GeneReviews Congenital Mirror Movements (PMID:25763452, NBK279760) across phenotypes,
    inheritance (reduced penetrance and 50% autosomal dominant transmission risk), progression, diagnosis,
    treatments (school accommodations, occupational/handwriting adaptation, avoidance of repetitive bimanual
    hand activity, genetic counseling, and prenatal/preimplantation testing), and top-level references[]
    (tagged GeneReviews), added infantile/early-childhood onset progression grounded in PMID:29068161
    and PMID:25763452, a hedged DNAL4 pathophysiology node for cytoplasmic dynein retrograde transport
    (PMID:25098561, directness: INDIRECT) so all 5 genetic[] genes are wired into pathophysiology, GO
    molecular_functions on DCC, NTN1, and ARHGEF7 pathophysiology nodes, corrected NTN1 genetic[] mechanism
    notes to intracellular retention/loss of secreted function (PMID:28945198), added structured measure_type:
    UNKNOWN and prevalence_class: RARE to prevalence, therapeutic_modality: BEHAVIORAL on occupational
    therapy, and differential_diagnoses covering allelic Developmental split-brain syndrome (PMID:29068161).'

  summary: 'Create: Sheehan_Syndrome'
  details: |
    De novo curation of Sheehan syndrome (MONDO:0019618) as a DISEASE entry, closing claim issue #11164 and retiring stubs/Sheehan_Syndrome.yaml.

    Deep research: 'just research-disorder falcon Sheehan_Syndrome' (Edison/Falcon, 814 s, 23 citations). Its own reference validation reported 9/9 identifiers verified with confabulation_rate 0.0. Its term_validation set needs_review true, but the single mislabelled term is an artifact of the prompt template: the report echoed the literal string 'if available' from the '**MONDO ID:** MONDO:0019618 (if available)' template line as the label for MONDO:0019618. No term was bound from the report on that basis. 'just preflight-dr research/Sheehan_Syndrome-deep-research-falcon.md MONDO:0019618' returned SKIP because MONDO records no causal gene (RO:0004003) for this non-genetic disease, so disease identity was checked manually against the MONDO record: label 'Sheehan syndrome', synonyms 'postpartum hypopituitarism' / 'postpartum pituitary necrosis', xrefs Orphanet:91355 and NCIT:C35300, no OMIM entry. The report is unambiguously about postpartum pituitary necrosis and matched that identity.

    Sources: 17 PMIDs, all fetched with 'just fetch-reference' and committed to references_cache/. Backbone sources are the Nature Reviews Disease Primers review (PMID:28004764), the 114-patient Erciyes series (PMID:24917653), the 2025 Karaca/Kelestimur review (PMID:39863703), the cardiometabolic-comorbidity review (PMID:36742387) and the 60-patient PGIMER cohort (PMID:36243797). The report cited its sources by author-year key rather than PMID, so its DOIs were resolved to PMIDs through the PMC ID Converter before use; the three report-derived papers used here are PMID:39863703, PMID:28615049 and PMID:37772209.

    Content: 13 pathophysiology nodes forming one connected chain from oestrogen-driven lactotroph hyperplasia, through the portal/fixed-sella perfusion constraint and postpartum haemorrhage, to anterior-lobe infarction, ordered loss of the five trophic axes, and empty sella. Two nodes declare conforms_to against hypothyroidism_thyroid_hormone_deficiency (#Impaired Thyroid Hormone Synthesis and #Reduced Thyroid Hormone Action at Peripheral Sites), which that module's description explicitly invites for central hypothyroidism. 15 phenotypes, 5 treatments, 2 imaging findings, 2 diagnosis items, 2 differential diagnoses, 5 progression phases and 82 evidence items.

    Deliberate curation decisions. (1) The autoimmune contribution is NOT modelled as a causal edge. It is a discussions entry, kind KNOWLEDGE_GAP, attached to the infarction and trophic-hormone-loss nodes, carrying both the positive antibody data (PMID:18230820) and a REFUTE item quoting a prospective cohort in which post-haemorrhage hypopituitarism developed with no detectable pituitary antibodies (PMID:39863703). (2) The posterior-pituitary node carries one REFUTE item: water-deprivation testing shows measurable neurohypophyseal impairment (PMID:17468192), so the claim curated is relative clinical sparing, not absolute sparing. (3) The glucocorticoid-before-levothyroxine rule is curated on the glucocorticoid treatment entry with an exact quote from PMID:42175518 stating the sequencing rule and the harm it prevents. (4) No datasets block: 'just discover-datasets Sheehan_Syndrome' returned no GEO candidates. (5) No animal/experimental/computational model sections, because no model reproducing the disease sequence was found; recorded in notes rather than populated with surrogates.

    Validation, all run and read: 'just validate' (schema clean, 82/82 snippets verified), 'just validate-terms' (passed), 'just check-entity-refs', 'just check-causal-targets', 'just check-duplicate-keys', 'just check-enum-values', 'just check-qualifier-terms-online', 'just check-snippet-length', 'just check-title-snippets', 'just check-snippet-grading', 'just check-folded-hyphens', 'just check-reference-titles' (all OK), 'uv run pytest tests/test_data.py -k "conform or entity_ref or subtype or unique or causal"' (16961 passed), and the authoritative gate 'just validate-disorders kb/disorders/Sheehan_Syndrome.yaml' (schema, terms and references all passed, 82/82 snippets). Weighted compliance 90.3%.

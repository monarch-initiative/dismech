  summary: 'Review round 1: cardiometabolic and bone phenotypes'
  details: |
    Review round 1 on PR #11182, responding to the ai4c-reviewer CHANGES_REQUESTED review. Everything below is in a single commit so the review gate is only spent once.

    Blocking finding (cardiometabolic phenotypes missing). The entry cited PMID:36742387 nine times and quoted its epidemiology and burden sentences, but modelled none of the metabolic morbidity that the same cached full text documents. Added six phenotypes, all quoting that cached text or the cached Karaca/Kelestimur review:

    - Metabolic Syndrome, FREQUENT, bound to MONDO:0000816 (abdominal obesity-metabolic syndrome; MONDO carries "metabolic syndrome" as an EXACT synonym and the plain MONDO:0004955 is obsolete, while HPO has no metabolic-syndrome term). The band comes from "The prevalence of MS in SS is around 50%...". PhenotypeTerm admits MONDO explicitly for complications and comorbidities, and 24 other disorder entries already bind a MONDO term in this slot.
    - Increased Body Fat with Abdominal Predominance, HP:0012743 Abdominal obesity. No frequency, because the source states none for Sheehan syndrome specifically; the "half had BMI >= 30" figure is for hypopituitary patients generally and was not borrowed.
    - Atherogenic Dyslipidemia, HP:0003119 Abnormal circulating lipid concentration. Bound at that level deliberately: the quoted claim spans raised TC/LDL-C/TG together with low HDL-C, and no narrower HPO term covers movement in both directions. The reason is recorded in the phenotype description.
    - Insulin Resistance, HP:0000855, from the HOMA-IR sentence. No frequency stated, so none given.
    - Diabetes Mellitus, HP:0000819, OCCASIONAL from "Around one fourth of patients with SS had diabetes mellitus" (25% falls in the 5-29% band). Reached from Insulin Resistance as a sequela rather than hung directly off the GH node, because the source attributes diabetes to the insulin-resistant state and not to somatotroph loss.
    - Osteoporosis, HP:0000939, FREQUENT from the 60-patient cohort reporting osteoporosis in 35.0% with BMD significantly below matched controls.

    Pathograph. Four new edges from Growth Hormone Deficiency (to abdominal obesity, dyslipidemia, insulin resistance and metabolic syndrome), joining the existing Hepatic Steatosis edge on the same node, and one from Gonadotropin Deficiency to Osteoporosis. All six are INDIRECT_KNOWN_INTERMEDIATES, and each explanation says why: the sources name several joint contributors (GHD, glucocorticoid therapy, hypogonadism) rather than a single cause, and the insulin-resistance sentence is about hypopituitary subjects generally rather than Sheehan syndrome specifically. Diabetes Mellitus is reached through the Insulin Resistance sequela, so all six new phenotypes are connected to the graph.

    Reviewer suggestion, osteoporosis. Taken rather than waived. The reviewer could not find a quotable Sheehan-specific bone sentence; PMID:39863703, already cached and cited five times in this entry, carries a dedicated bone-loss paragraph with two usable sentences, so no notes-only waiver was needed.

    Reviewer suggestion, CL:0000438 on the gonadotroph node. Fixed. CL:0000437 "gonadtroph" (the canonical label carries that typo, which is not corrected here) is a child of CL:0000438 and is defined as secreting both FSH and LH, so it matches the node's claim of combined gonadotropin loss exactly. No description caveat is needed now.

    Reviewer suggestion, treatment term specificity. Declined, with reason. NCIT has no Glucocorticoid Replacement Therapy, Thyroid Hormone Replacement Therapy or Growth Hormone Replacement Therapy term; the closest hit, NCIT:C15599 Hormone Replacement Therapy, is defined as postmenopausal estrogen or estrogen/progesterone therapy and does not describe any of these three. The generic NCIT:C15986 Pharmacotherapy plus therapeutic_agent binding is kept.

    Reviewer note, Adrenal Crisis on HP:0000846. Left unchanged as the reviewer asked; the ACUTE + SEVERE post-composition stands.

    Also linked the Growth Hormone Replacement treatment to the new phenotypes: two target_phenotypes (abnormal circulating lipid concentration, abdominal obesity) and a second cited sentence, so its existing "improves their cardiometabolic profile" evidence now attaches to modelled phenotypes.

    Evidence discipline. Thirteen new snippets, every one checked as an exact substring of its cached reference before writing, using references_cache/PMID_36742387.md and PMID_39863703.md. No reference was fetched, since both were already cached and cited. All new items are SUPPORT / evidence_source: OTHER, matching how both reviews are graded elsewhere in this file.

    Validation. just validate passed. just validate-disorders passed with 95/95 snippets verified, up from 82/82. just validate-terms, check-entity-refs, check-causal-targets (no new dangling targets), check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens and check-environmental-evidence all passed. pytest tests/test_data.py -k "entity_ref or subtype_foreign or unique_name" reported 8486 passed. The whole-KB check-snippet-length, check-title-snippets and check-snippet-grading gates exit non-zero against origin/main, but none of their findings is in this file; they are in CRX_Related_Retinopathy, Ewing_Sarcoma, Glutaryl-CoA_Dehydrogenase_Deficiency, MPI-Congenital_Disorder_of_Glycosylation, Tangier_Disease, ZNF407-Related_Neurodevelopmental_Disorder, AIPL1-Related_Retinopathy, Congenital_Glaucoma and EYS_Related_Retinitis_Pigmentosa, and are pre-existing on main.

    Cache. Two derived rows added by validate-terms, both for MONDO:0000816 (cache/mondo/terms.csv and the phenotypeterm enum cache). Every other new CURIE was already cached. just normalize-cache reported no reordering.

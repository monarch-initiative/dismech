  summary: Bind basal prolactin before TRH; record that no timing-agnostic post-TRH
    code exists
  details: |
    LOINC Diagnostics tranche G, batch 28, the closing batch. Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the five changed files reported 0 issues across 793 titles; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:1620-4 (serum prolactin pre dose TRH IV) to the dynamic prolactin testing row. Only the basal limb is bound, because LOINC has no timing-unqualified post-TRH prolactin code: of 44 challenge-qualified prolactin codes in the release, those naming TRH all fix a sampling point between 10 minutes and 2.5 hours and several also fix a 200 microgram dose, while this row names neither a schedule nor a dose, so binding one would assert a protocol it leaves open. The KG, paginated to its stated total of 108 prolactin records, offers four Parts - the plain component plus monomeric, dimeric and isoform-pattern forms - and none is bound, since a Part carries no challenge and could not distinguish this test from a random prolactin. No reference range was added: the cited cohort reports sensitivity and specificity, which is performance rather than a cut-off.

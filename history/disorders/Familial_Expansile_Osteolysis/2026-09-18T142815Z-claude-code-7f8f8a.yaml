  summary: 'Create: Familial Expansile Osteolysis (MONDO:0008275)'
  details: |
    New entry curated from the Edison Falcon deep-research report research/Familial_Expansile_Osteolysis-deep-research-falcon.md with report DOIs resolved to PMIDs through PubMed and all snippets quoted from cached abstracts; the report's one unresolved DOI was not cited. No GeneReviews chapter exists. Eight-node pathograph: TNFRSF11A exon 1 signal-peptide tandem duplication, failure of RANK signal-peptide cleavage with endoplasmic reticulum retention, ligand-independent RANK signalling and NF-kappaB activation (modifier GAIN_OF_FUNCTION, the qualitative outside-regulatory-control case), constitutive osteoclast formation, survival and activation, generalized accelerated bone remodelling, focal expansile osteolysis with medullary expansion and cortical thinning, middle-ear ossicular resorption, and external root resorption of permanent teeth. Lump/split: the 18-bp duplication disorder only; the allelic TNFRSF11A signal-peptide disorders (early-onset familial Paget disease of bone PDB2, expansile skeletal hyperphosphatasia, juvenile Paget disease 2, panostotic expansile bone disease) are described in notes and the genetic block and their evidence is used only where it bears on the shared mechanism, marked directness INDIRECT. Juvenile Paget disease (TNFRSF11B) and classic Paget disease of bone (SQSTM1) are cross-referenced as different genes. Two nodes conform to osteoporosis_bone_resorption with the substitution that a constitutively mis-signalling RANK receptor replaces a raised RANKL/OPG ratio as the driver. The unresolved question whether the phenotype arises from membrane gain-of-function or from misfolded-protein accumulation (Hughes 2000 versus Crockett 2011) is recorded as a KNOWLEDGE_GAP. Biochemical block covers alkaline phosphatase and bone turnover markers; treatments cover bisphosphonates, denosumab, surgical stabilisation, hearing and dental management. Validated: just validate passed; count-verified-snippets 121/121; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys passed; pytest -k Familial_Expansile_Osteolysis passed. A first attempt at this curation was cut off by a session limit before writing; this record describes the completed second pass.

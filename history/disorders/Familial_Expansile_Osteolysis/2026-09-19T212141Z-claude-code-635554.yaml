  summary: 'Address second review: bind histopathology term, add progression'
  details: |
    Addressed the automated review's second round. Blocking item: the first histopathology finding said NCIT had no morphologic-finding term for increased osteoclasts; that was wrong. Bound finding_term to NCIT:C147498 (Increased Osteoclasts), which validate-terms confirms is in the HistopathologyFindingTerm enum, and removed the false justification. The second finding's note was narrowed to the true claim: NCIT:C36212 (Bone Marrow Fibrosis) is in the branch but names only the fibrous stage, and no term covers the fibrous-to-fatty sequence, so the composite finding stays unbound with that reason recorded. Regraded the PMID:21472776 histopathology quote from OTHER to HUMAN_CLINICAL with quote_role BACKGROUND, since the sentence is the introduction's summary of published human histology rather than the paper's in vitro result. Suggestion taken: removed the duplicated PMID:32075714 genetic-testing trigger evidence from the Dental Surveillance and Prosthodontic Care treatment (it remains in diagnosis) and reworded the treatment description to point at the diagnosis section. Suggestion taken: added a three-phase progression block (early-onset hearing loss from age 4, external root resorption with premature tooth loss, progressive focal expansile osteolysis of the appendicular skeleton from early adulthood) quoting the cached Crone and Wallace 1990 abstract (PMID:2353208) and Hughes 2000 (PMID:10615125); the mm-per-year advance rates and fracture counts are full-text only and are noted as not curated. Not taken: historical calcitonin treatment, because no cached source states it. Validation: just validate, count-verified-snippets, validate-terms, normalize-cache, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, snippet-length, snippet-grading and title-snippet gates, and validate-disorders, all run on the new head.

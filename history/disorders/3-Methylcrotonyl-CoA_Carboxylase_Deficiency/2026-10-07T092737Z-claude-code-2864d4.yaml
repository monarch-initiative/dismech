  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing C5OH newborn-screening diagnosis row: diagnosis_term changed from NCIT:C15419 Disease Screening to the narrower NCIT:C81178 Newborn Screening (reason recorded in the row notes; the other three diagnosis rows keep their terms), measurement LOINC:50106-4 for C5-OH in DBS, and one reference range from the Shanghai programme, cut-off 0.6 umol/L abnormal high (PMID:25190158). The IBEM-IS registry full text (PMID:27033733, already cited) is quoted with quote_role BACKGROUND for its statement that each US state programme uses its own C5OH cut-off and that 0.73 uM is commonly used; that second-hand figure was not banded. Diagnosis-row evidence from the Dutch 17-year C5-OH evaluation (PMID:40937535) records that the marker is shared with HMG-CoA lyase and holocarboxylase synthetase deficiency. No ratio code bound. loinc_term LOINC:LP19309-1 added on the Elevated C5OH acylcarnitine marker. A bracketed snippet from PMID:25190158 was dropped after the validator stripped it as a citation marker.

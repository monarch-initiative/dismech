  summary: 'Review round 1: Hearing Loss Autosomal Dominant 75'
  details: |
    First review round on PR 10930, in response to the ai4c-reviewer CHANGES_REQUESTED review. All three blocking items and two of the three suggestions addressed in one push. Blocking item 1 was a genuine error on my part and is worth recording plainly: the entry asserted twice in curated prose that HPO has no term for absent otoacoustic emissions, and HP:6000182 Absent otoacoustic emissions exists and is already bound in Hearing_Loss_Autosomal_Recessive_120.yaml, a file used as the template for this entry and present in this PR's own base. I made an ontology-coverage claim without checking it, and then restructured a phenotype node around the false premise, bundling the otoacoustic emission and auditory brainstem response measurements into one node so that a single generic evoked-potentials term could cover both. That mattered beyond tidiness: the DPOAE result is the load-bearing datum for this entry's cochlear-versus-retrocochlear knowledge gap, and the generic binding threw away the outer hair cell signal. The node is now split into Absent otoacoustic emissions bound to HP:6000182 and Abnormal auditory brainstem response bound to HP:0006958, each with its own snippet, the pathograph edge now has two targets, and both false prose sentences are deleted. Blocking item 2: the high-frequency phenotype was rebound from HP:0005101 High-frequency hearing impairment to the strictly more specific HP:0001757 High-frequency sensorineural hearing impairment, which matches the node name, the description and every cited snippet. Blocking item 3: the excluded phenotype used severity absent, which is the only occurrence of that pattern in the knowledge base and is invisible to check-enum-values because severity is Any-typed. It now follows the house convention, frequency EXCLUDED plus modifier ABSENT plus supports SUPPORT, and is rebound from HP:0002321 Vertigo to HP:0001751 Abnormal vestibular function to match what the snippet says was examined. A notes block records why, including the HPOA export regression documented in Adult-Onset_Autosomal_Dominant_Demyelinating_Leukodystrophy.yaml: without EXCLUDED the NOT qualifier rests on the single REFUTE grading, so a later SUPPORT-graded item would silently flip the export into asserting that DFNA75 features vestibular dysfunction. Suggestions taken: PMID:24675885 and PMID:36618986 are now cited in the gene-disease-validity discussion, which gains a paragraph explaining that germline Trrap deletion is embryonically lethal in the mouse so a knockout cannot be audiometrically phenotyped, making the absence of mammalian in vivo support a real experimental constraint rather than an unasked question; and the inheritance block now states the 50 percent transmission risk, deliberately without an evidence item because neither reported paper gives a recurrence risk and the cached GeneReviews record carries only a statement of purpose, together with the note that penetrance is what two pedigrees cannot establish. The structured onset suggestion was not taken and no sibling DFNA entry carries it. On the reviewer's answer to the question raised in the PR body, all 16 reference caches are kept, because the committed report's Reference Validation section is only reproducible against them. Validation after the round: just validate passed with 34/34 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-enum-values all clean.

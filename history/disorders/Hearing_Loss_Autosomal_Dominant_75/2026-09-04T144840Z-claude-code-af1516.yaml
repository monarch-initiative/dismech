  summary: 'Pre-emptive fixes from the DFNA83 review: Hearing Loss Autosomal Dominant
    75'
  details: |
    Applied to this entry, before its own review ran, the four findings from the ai4c-reviewer review of the sibling PR 10936 that transfer to it. First and most substantive: the phenotype node named for absent distortion product otoacoustic emissions was bound to HP:0006958 Abnormal auditory evoked potentials, and otoacoustic emissions are not evoked potentials, so the term did not describe the node. The node is renamed to Absent otoacoustic emissions with abnormal auditory brainstem response, which is what the Hungarian family's workup actually showed, and a second evidence item quoting the absent and barely definable wave V now supports the half of the node the HPO term names. The downstream edge target was updated with the rename. Second, a prevalence record was added as CASES_IN_LITERATURE ULTRA_RARE, using the reporting authors' statement that four disease-causing variants had been reported and only in Chinese patients. Third, a diagnosis block was added covering exome sequencing with Sanger confirmation and segregation testing as the route in both families, the risk that an older targeted panel does not carry TRRAP, and the role of tympanometry and inner ear MRI as adjuncts rather than diagnostics. Fourth, PMID:20301607 Genetic Hearing Loss Overview is tagged as GeneReviews in the references block, tag only with no evidence items, matching the convention in the sibling DFNA entries. No claim in the entry changed direction; this round adds structure the reviewer had asked for on the sibling and corrects one ontology binding. Validation: just validate passed with 32/32 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-snippet-grading and check-enum-values all clean.

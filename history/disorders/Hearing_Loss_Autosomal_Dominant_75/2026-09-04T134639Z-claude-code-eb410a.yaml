  summary: 'Create: Hearing Loss Autosomal Dominant 75 (DFNA75, TRRAP)'
  details: |
    De novo curation of DFNA75 (MONDO:0032911, OMIM:618778, TRRAP). Deep research: one OpenScientist run, committed as research/Hearing_Loss_Autosomal_Dominant_75-deep-research-openscientist.md. That run was invoked with --validate-references and --validate-terms but emitted neither a frontmatter block nor a report section; both were added afterwards with just validate-research-reference and just validate-research-terms. Retro-fitted reference validation: 16/16 identifiers resolved, 23/23 quoted claims found in source, one reference (PMID:41699244, cochlear implant complications) flagged as possibly off topic and not used. Retro-fitted term validation flagged three bad bindings in the report which were consequently not used: CL:0002218 offered as inner ear hair cell (it is immature dendritic epithelial T cell precursor), NCIT:C50072 offered as Hearing Aid (it is Modem Device), and obsolete GO:0016573. Entry content is built on the two primary human reports (PMID:31231791 Xia 2019, PMID:40004049 Nagy 2025) plus PMID:30827496 for the allelic neurodevelopmental disorder, and two references surfaced by the deep-research run (PMID:41952423 for the DEDDFA 1031-1159 cluster, PMID:34830324 for TRRAP scaffold biology). The HAT-recruitment mechanism is carried as an EMERGING mechanistic_hypotheses group with UNKNOWN causal_link_type edges and HYPOTHETICAL mechanism_confidence nodes, because no functional assay has been run on any DFNA75 allele. Three knowledge-gap discussions record the DFNA75/DEDDFA allele-series split, the gene-disease validity limits (two families, the second variant a VUS by the authors' own ACMG assessment), and the unresolved cochlear versus retrocochlear localisation. Validation: just validate passed with 28/28 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all clean. check-qualifier-terms-online caught a fabricated NCIT:C50075 binding for hearing aid (actually EKG or ECG Monitor Device) that the offline gate had passed; corrected to NCIT:C183182.

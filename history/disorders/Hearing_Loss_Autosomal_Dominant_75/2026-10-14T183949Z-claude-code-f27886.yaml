  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing exome-sequencing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: the loss starts in the 2-8 kHz range and only later involves speech and lower frequencies, producing a ski-slope rather than flat audiogram, and progression is open-ended rather than fixed (the one quantified case deteriorated only slightly over years, with the source noting this may continue for decades).

  summary: 'Create: Thanatophoric Dysplasia root entry (MONDO:0017042)'
  details: 'Created the root Disease entry for thanatophoric dysplasia (MONDO:0017042), resolving issue
    #8889.


    Design decision (recorded in the entry''s `discussions` block, id `td_root_disease_vs_grouping`, and
    in the PR body): curated as a root `Disease` with `has_subtypes` for TD1 (MONDO:0008546) and TD2 (MONDO:0008547)
    rather than as a `Grouping` over the two existing standalone subtype entries. Three grounds. Tooling:
    `build_coverage_index()` in src/dismech/compare/mondo_priority.py calls `iter_disease_files()`, which
    globs kb/disorders/*.yaml only and never reads kb/groupings/, so a Grouping alone could never retire
    MONDO:0017042 from the MONDO priority queue; verified by reading the source. Redundancy: kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml
    already unions TD1 and TD2 with nine other FGFR members under a NECESSARY_AND_SUFFICIENT CONFORMS_TO_MODULE
    criterion, so a TD1+TD2 grouping would duplicate that machinery. Substance: TD-level birth prevalence,
    the single molecular assay covering 99 percent of both subtypes, and the GeneReviews "features common
    to type 1 and type 2" list are all reported for TD as a whole and have no natural home on either subtype.


    Kept deliberately thin. Three pathophysiology nodes; two are conforms_to anchors on fgfr_gain_of_function_skeletal_dysplasia
    (Constitutive FGFR Activation; Impaired Endochondral Ossification and Chondrodysplasia). Receptor
    biology and the growth-plate cascade are not re-derived - they are held in the module and in the two
    1500-line subtype entries. Original root-only content: TD-level birth prevalence in three populations;
    the prenatal-ultrasound / radiographic / molecular-confirmation diagnostic pathway; the allelic-series
    framing (TD alleles activate FGFR3 more strongly than the achondroplasia G380R allele, PMID:8640234);
    the TD1/TD2 discriminator; and the TD-specific thoracic-insufficiency lethality node, which is deliberately
    NOT module-anchored because achondroplasia and hypochondroplasia share every upstream node without
    reaching it (flagged as an OPEN_QUESTION discussion).


    Sections curated: description, disease_term, synonyms, parents, classifications, inheritance, has_subtypes,
    prevalence, progression, pathophysiology, phenotypes, histopathology, diagnosis, differential_diagnoses,
    genetic, treatments, discussions, notes, references.


    Deep research: none run. The maintainer deprioritised DR for this queue; six pre-existing TD1/TD2
    DR reports under research/ were available as leads only. No DR report drives any claim, so `just preflight-dr`
    is not applicable. NEC discipline was applied manually - every cited abstract was read and confirmed
    to concern FGFR3 thanatophoric dysplasia rather than another lethal skeletal dysplasia or a milder
    FGFR3 allelic sibling.


    Evidence: 51 snippets across 8 PMIDs, all exact substrings of the cached references. New references
    fetched with `just fetch-reference`: PMID:8640234, PMID:42547059, PMID:39357670, PMID:41078071, PMID:39778871.
    Already cached: PMID:20301540 (GeneReviews, tagged), PMID:7773297, PMID:18698630. Two reference_title
    values were corrected to the real cached titles after the reference validator flagged mismatches.


    Curation judgement calls. Perinatal lethality is curated under `progression` rather than `phenotypes`
    because HP:0003811 and HP:0001522 sit in the HPO clinical-modifier/mortality branch and are not members
    of the PhenotypeTerm dynamic enum - the same convention already used in Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome
    and Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome. The vosoritide treatment is recorded with
    supports PARTIAL and explicit n equals 1 off-label framing, and is deliberately not given a target_mechanisms
    edge. Platyspondyly carries no frequency band because the source lists features without per-feature
    counts.


    Not usable: Orphanet ORPHA:2655 could not be cached because `just refresh-orphadata` fails on a sha256
    mismatch against the pinned data/orphadata/MANIFEST.yaml (upstream drift); re-pinning would rebuild
    every references_cache/ORPHA_*.md and is out of scope. No ClinGen Gene-Disease Validity assertion
    exists for FGFR3-thanatophoric dysplasia in the cached ClinGen set.


    Validation run and read: `just validate` (schema, terms, references) - all passed, Snippets checked
    51/51; `just count-verified-snippets` - 51/51; `just validate-terms` - passed; `just check-duplicate-keys`
    - OK across 2342 files; `just check-title-snippets` - no new title-quoting snippets; `just check-term-cache-integrity`
    and `just check-cache-order` - OK; `just validate-disorders` on the changed file; pytest subset over
    conforms_to, unique-name, subtype foreign key and environmental-mechanism tests.


    Scope discipline: pre-existing defects in neighbouring files (Achondroplasia not conforming to the
    FGFR grouping''s defining node; divergent TD1/TD2 module node sets; open review issue #3576 against
    TD1; TD1''s deprecated free-text prevalence `percentage` field) were flagged in the PR body and deliberately
    left unfixed.


  summary: Record a citable LOINC absence for FGFR3 cell-free DNA prenatal diagnosis
  details: |
    LOINC tranche K batch 2. The 'Non-invasive prenatal diagnosis on maternal plasma cell-free DNA' row describes sequencing FGFR3 hotspots in maternal plasma cfDNA -- a diagnostic, not a screening, use of the technology per the entry's own framing ('cell-free DNA sequencing of FGFR3 is accurate enough for diagnostic use'). Searched 'FGFR3 cell-free DNA' directly (zero LOINC entities, total=0) and the full 'FGFR3' search (277 total, all read): the only FGFR3 molecular-testing LOINC codes specify Blood or Tissue (postnatal) or Amniotic fluid/Chorionic villus sample (the invasive route this test exists to avoid) as the specimen -- none names maternal plasma cell-free DNA. Binding one of those codes would misstate the specimen, so no measurement was bound; the absence and both searches are recorded in a note on the row.

  summary: 'Re-curate: Thanatophoric Dysplasia'
  details: |
    Re-curation of the root TD entry. Added curated_in pointers on the TD1/TD2 subtypes. Recorded the ClinGen Definitive FGFR3 assertion, which ClinGen curated at the lumped TD level (the previous note saying no assertion existed was wrong). Added birth-prevalence records from Argentina (RENAC, PMID:30572171), Japan (nationwide survey, PMID:31247124) and the Orphanet Europe class (ORPHA:2655, now cached). Added a long-term survival progression phase from the Japanese survey and survivor cohort (PMID:34597445). Added a temporal-lobe cortical malformation node (autopsy series PMID:23323754, TD1 vs TD2 neuropathology PMID:11965423, FGFR3 K650E neuronal mouse PMID:33116259) and phenotypes for pulmonary hypoplasia, short-limb short stature, temporal lobe dysplasia, seizure, developmental delay, small foramen magnum, acanthosis nigricans and polyhydramnios. Wired phenotypes to pathophysiology nodes (0/10 to 14/18 connected), using fetal X-ray/histology correlation (PMID:24859745). Added non-invasive prenatal diagnosis on maternal cell-free DNA (PMID:25728633, PMID:30048571), a genetic counselling treatment and a clinical_burden block. Replaced explanations that argued for the retired PARTIAL grade with directness: INDIRECT. Deep research: perplexity report generated and passed preflight-dr; falcon failed with an Edison authentication error. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

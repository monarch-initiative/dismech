  summary: 'Create: Multiple Mitochondrial Dysfunctions Syndrome 3'
  details: |
    Created the IBA57 entry (MONDO:0014132). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true; the report passed just preflight-dr (IBA57 mentioned 68 times, OMIM 615330 matching MONDO). No GeneReviews chapter exists for IBA57; the phenotype baseline is the published case series. The pathophysiology is an unbundled chain of twelve nodes from the variant through proteolytic degradation of IBA57, loss of the [2Fe-2S]-bridged ISCA2-IBA57 complex, failure of reductive cluster fusion (the central effector), and secondary NFU1 depletion, to three separately evidenced client branches. SPG74, the allelic disorder, is deliberately excluded and its papers are cited only for mechanism. Three discussion sections cover the NFU1 dependency direction, the white-matter selectivity and plateau, and the residual-protein severity gradient, each with a proposed experiment. Six nodes conform to the new mitochondrial_iron_sulfur_cluster_assembly_failure module. Two HGNC ids written from memory were caught by just validate-terms and corrected from sqlite:obo:hgnc; nine snippets failed because the validator strips square brackets from cluster nomenclature and were replaced with bracket-free spans from the same sentences. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues), just check-entity-refs and just check-causal-targets.

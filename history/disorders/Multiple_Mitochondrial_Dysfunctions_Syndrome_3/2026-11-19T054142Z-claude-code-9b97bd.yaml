  summary: 'Create: Multiple Mitochondrial Dysfunctions Syndrome 3'
  details: |
    Created the IBA57 entry (MONDO:0014132). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true; the report passed just preflight-dr (IBA57 mentioned 68 times, OMIM 615330 matching MONDO). No GeneReviews chapter exists for IBA57; the phenotype baseline is the published case series. The pathophysiology is an unbundled chain of twelve nodes from the variant through proteolytic degradation of IBA57, loss of the [2Fe-2S]-bridged ISCA2-IBA57 complex, failure of reductive cluster fusion (the central effector), and secondary NFU1 depletion, to three separately evidenced client branches. SPG74, the allelic disorder, is deliberately excluded and its papers are cited only for mechanism. Three discussion sections cover the NFU1 dependency direction, the white-matter selectivity and plateau, and the residual-protein severity gradient, each with a proposed experiment. Six nodes conform to the new mitochondrial_iron_sulfur_cluster_assembly_failure module. Two HGNC ids written from memory were caught by just validate-terms and corrected from sqlite:obo:hgnc; nine snippets failed because the validator strips square brackets from cluster nomenclature and were replaced with bracket-free spans from the same sentences.  Review round 1 added the three onset-band subtypes the 2024 pooled analysis proposes (neonatal, infantile, childhood) with their cohort sizes, six phenotypes that analysis reports and the entry lacked (pyramidal signs, dysphagia, visual impairment stratified to the childhood subtype, seizures, polyhydramnios, ventriculomegaly), a treatments section (antiepileptic pharmacotherapy naming levetiracetam and topiramate, and genetic counseling), and an environmental entry for the infection or vaccination trigger reported in 6 of 19 patients, linked to the white-matter node as EXACERBATES. HP:0002376 Developmental regression was rebound to HP:0033044 Motor regression to match its snippet. The six conforms_to anchors were removed, because conforms_to is a hard foreign key and the module is not yet on main; the wiring is deferred to a follow-up PR. One reference title had been written from the research report's wording rather than the cache and was corrected from the cached title: frontmatter. Review round 2 corrected two phenotype rows added in round 1 whose quotes did not carry their claims, which is the same defect round 1 was fixing elsewhere in the batch. A polyhydramnios row asserted a finding that appears in none of the three cached sources; it is replaced with intrauterine growth restriction, which the pooled analysis states for four of the seven neonatal-subtype patients. Ventriculomegaly was quoted with a sentence about periventricular white-matter lesions and now quotes the sentence naming ventricular dilatation directly, with a frequency from the pooled table. The round also took the remaining suggestions: subtype frequencies for hypotonia and seizures from that table, directness INDIRECT on the genetic-counseling evidence, and an explanation noting that the antiepileptic snippet stops at 'or' because of a page break in the cached PDF rather than because the claim was trimmed. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues), just check-entity-refs and just check-causal-targets.

  summary: Enriched Herpes Zoster with classifications, neurological phenotypes, antiviral and neuropathic pain treatments, and pathograph wiring.
  details: Added Harrison's chapter classifications (INFECTIOUS_DISEASES, NEUROLOGIC, DERMATOLOGY) with verbatim evidence snippets. Enriched pathophysiology nodes with cell types (keratinocyte), biological processes (defense response to virus, neuroinflammatory response, sensory perception of pain), and downstream links to newly curated phenotypes (Hyperesthesia, Myelitis, Meningitis). Expanded diagnosis with presence and results fields and added Antiviral Therapy (Valacyclovir) and Neuropathic Pain Pharmacotherapy (Gabapentin and Topical Lidocaine) under treatments.

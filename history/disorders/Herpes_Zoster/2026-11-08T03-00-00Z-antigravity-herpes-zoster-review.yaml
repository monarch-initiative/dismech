  summary: Enriched Herpes Zoster with Harrison's classifications, five atomic pathophysiology nodes, neurological phenotypes including Viral encephalitis, and agent-bound antiviral and neuropathic pain treatments.
  details: Added Harrison's chapter classifications (INFECTIOUS_DISEASES, NEUROLOGIC, DERMATOLOGY) with verbatim evidence snippets. Replaced GO:0051607 with T cell mediated immunity (GO:0002456, DECREASED) backed by PMID:23794213 on the ganglionic reactivation node, and decomposed the bundled downstream node into four atomic mechanisms (Sensory Ganglionitis and Neuroinflammation, Epidermal Keratinocyte Infection, Sensory Neuron Injury and Nociceptor Sensitization, and Central Nervous System Extension of VZV) backed by PMID:27188665, PMID:14726820, PMID:37632006, and PMID:37435162. Added Hyperesthesia, Myelitis, Meningitis (scoped to meningeal involvement), and Viral encephalitis (HP:0033993) without unsupported frequency values. Bound ChEBI therapeutic agents on Nucleoside Analog Antiviral Therapy (acyclovir CHEBI:2453, valacyclovir CHEBI:35854) and Neuropathic Pain Pharmacotherapy (gabapentin CHEBI:42797, pregabalin CHEBI:64356, lidocaine CHEBI:6456), backed by guideline/review and structured indication records (PMID:8827537, PMID:23794213, NCIT:C1108).

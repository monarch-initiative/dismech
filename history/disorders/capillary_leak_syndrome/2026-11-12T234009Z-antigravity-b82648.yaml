  summary: 'Review and enrich capillary_leak_syndrome: remove process narration, expand
    leak/post-leak pathophysiology, wire 9 phenotypes, and add IVIG prophylaxis, diagnosis,
    and differentials'
  details: |
    Audited all claims, snippets, evidence_source, and quote_role in capillary_leak_syndrome.yaml and removed process narration from Intravascular volume depletion notes. Expanded synonyms and classifications (CARDIOVASCULAR, IMMUNE_RHEUMATOLOGIC, CRITICAL_CARE), built a 6-node scale-typed pathophysiology cascade covering episodic VEGF/Ang-2 surge, VE-cadherin endothelial barrier dysfunction (PMID:22411873), plasma extravasation, intravascular volume depletion, generalized edema, and post-leak fluid mobilization/volume overload (PMID:28012935), and wired all 9 phenotypes (adding Hypovolemic shock, Rhabdomyolysis, Acute kidney injury, Oliguria, Pulmonary edema). Bound NCIT:C80829 Human Immunoglobulin G on Monoclonal IgG paraprotein, added serum protein electrophoresis/immunofixation diagnosis and 3 differential diagnoses (Sepsis, Hereditary angioedema, Polycythemia vera), and added first-line monthly IVIG prophylaxis (PMID:28602874 EurêClark registry) and post-leak diuretic therapy with bare-name target_mechanisms.

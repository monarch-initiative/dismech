  summary: Ground mediator surge claims and IN_VITRO tag, support Oliguria frequency,
    add Venous thrombosis and Pericardial effusion phenotypes, add viral trigger and
    terbutaline prophylaxis, and tighten NCIT bindings
  details: |
    Clarified idiopathic Clarkson disease scope on MONDO:0001956 in top-level notes (removing session re-verification date) and added Classical Acute and Chronic Systemic Capillary Leak Syndrome subtypes (PMID:28012935). On Episodic Humoral Mediator Surge (VEGF and Angiopoietin-2), changed PMID:29360169 ex vivo monocyte/EC stimulation evidence_source from HUMAN_CLINICAL to IN_VITRO and added PMID:28012935 acute-sera CXCL10/CCL2/IL-6 and ~3/4 viral-prodrome snippets. Added PMID:28012935 ("Short-lived oliguria is common...") to Oliguria, added Venous thrombosis (HP:0004936) and Pericardial effusion (HP:0001698) phenotypes wired from Intravascular volume depletion, Plasma extravasation, and Hemoconcentration sequelae (plus Rhabdomyolysis to Acute kidney injury sequelae), dropped duplicate GO:0043114 on Generalized edema, and tagged PMID:29732372 background quotes with quote_role: BACKGROUND. Added Preceding Viral-Like Upper Respiratory Infection (ECTO:3000001) in environmental, expanded Theophylline prophylaxis to Theophylline and Terbutaline Prophylaxis with terbutaline (CHEBI:9449) and EurêClark/Mayo survival and cohort evidence (PMID:28602874, PMID:28012935), and upgraded Monoclonal IgG paraprotein to NCIT:C17788 (M Protein) and Serum protein electrophoresis and immunofixation to NCIT:C92291 (Monoclonal Protein Measurement).

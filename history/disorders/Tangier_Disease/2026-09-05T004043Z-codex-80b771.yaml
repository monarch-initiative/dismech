  summary: Qualify experimental inflammation and PMP22 mechanisms
  details: |
    Assigned PROVISIONAL confidence to myeloid inflammasome activation, amplified myeloid inflammatory signaling, and abnormal PMP22 processing. Rechecked PMID:29588315 and PMID:31061090 alongside existing ABCA1 macrophage evidence: experimental perturbations and patient cytokines support these leads, but combined-transporter hyperlipidemic models and Abca1-null nerves do not establish their quantitative contribution to human Tangier atherosclerosis or neuropathy. PROVISIONAL reflects demonstrated experimental support; HYPOTHETICAL would understate that evidence. Targeted Disease schema and causal-target validation passed; references and graph edges are unchanged.

  details: |
    Batch-2 re-application of the earlier OpenScientist sweep (branch os-review-fable) onto current main, which a parallel codex-assessed curation effort had already largely covered. Applied: one discussions entry, td_compound_heterozygote_penetrance_gap (KNOWLEDGE_GAP, attaches_to genetic#Biallelic ABCA1 Pathogenic Variants), carrying two PMID:15019541 evidence items re-derived from the on-disk full-text cache record - the two compound heterozygotes without overt Tangier manifestations, and the survey's own selection-bias conclusion. Main already records variable clinical expression from GeneReviews, but had no documented biallelic genotype without overt disease and no statement of the unmeasured residual-activity threshold, so the gap is additive rather than duplicative. Skipped: PMID:25404125. The old sweep never cited it as evidence - it appeared only inside the hypothesis notes as a correction of the report's claim of a 67 percent cardiovascular risk reduction per standard deviation of efflux capacity, which the Dallas Heart Study reports for highest versus lowest quartile. Main's entry never makes that claim, and main's codex assessment sidecar already records the same correction against the same PMID, so there is nothing to correct in the entry and nothing to add. The sweep's Dallas Heart Study reasoning also still holds: a general-population cohort with no Tangier participants does not belong in this entry's evidence. Also skipped as superseded: the sweep's miglustat omission and its td_no_interventional_trial_evidence_gap discussion - main now curates miglustat as a treatment and the MUSTANG n-of-1 trial (PMID:41212481, ISRCTN17945917) as clinical trials, so the 'no interventional trial located' premise is false. The sweep's other additions (Myeloid Inflammasome Activation and Platelet Dense-Granule Maturation Defect nodes, platelet phenotypes, hypothesis-notes qualifications) are already present on main under the parallel effort. Copied the missing assessment sidecar verbatim: openscientist-assessment-by-claude-opus-5.yaml plus its declared artifact openscientist-assessment-by-claude-opus-5.md, alongside main's existing codex assessment of the same report. The narrative .md describes the sweep's own branch state (six discussions, miglustat withheld) rather than current main; it is dated 2026-09-02 provenance and was left unedited as instructed. Verified: linkml-validate clean, 173/173 snippets verified, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-length and validate-hypothesis-assessment all pass.

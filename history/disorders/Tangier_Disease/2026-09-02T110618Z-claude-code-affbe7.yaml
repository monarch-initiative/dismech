  details: |
    Reviewed kb/hypotheses/Tangier_Disease/canonical_abca1_hdl_efflux_model/openscientist.md and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml (verdict PARTIALLY_SUPPORTED, 15 claims, 4 data sources, 2 analyses, both REPORTED_ONLY/UNVERIFIABLE) plus a narrative .md sidecar. Integrated only RETAINED/QUALIFIED claims whose snippets re-derive from references_cache. Added pathophysiology node 'Myeloid Inflammasome Activation' (CL:0000235, CL:0000775; GO:0044546, GO:0032611, GO:0140645) with an incoming DIRECT edge from Cholesteryl Ester Tissue Storage and an INDIRECT_KNOWN_INTERMEDIATES edge to Accelerated atherosclerosis; human evidence PMID:29588315 graded HUMAN_CLINICAL, downstream limbs graded MODEL_ORGANISM/IN_VITRO (PMID:36537208, PMID:18552351) so the mouse-human boundary stays explicit. Added pathophysiology node 'Platelet Dense Granule Maturation Defect' (CL:0000233) downstream of ABCA1 Dysfunction, feeding two new phenotypes, Reduced platelet dense granules (HP:0033535) and Abnormal platelet function (HP:0011869), all from PMID:15163665; the node description records that the same study measured cholesterol and phosphatidylserine redistribution and found it unaltered, contradicting the mechanism the report proposed. Added the entry's first discussions block, six entries covering genotype-to-neuropathy-subtype mapping, S1P contribution, HSPC myeloproliferation (HUMAN_MODEL_MISMATCH), inflammasome-NETosis human translation (HUMAN_MODEL_MISMATCH), compound-heterozygote penetrance, and absent interventional trial evidence, three carrying proposed_experiments. Qualified the mechanistic_hypotheses notes block, which previously recited the report's eight qualifications uncritically. Deliberately not changed: status stays CANONICAL; no new mechanistic_hypotheses entries for the three proposed sub-hypotheses; PMID:25404125 not added (general-population cohort, and the report misquantifies it as per-SD when the paper reports highest-versus-lowest quartile); miglustat not curated as a treatment (n=1, off-target indication, unknown mechanism) but recorded in the trials gap; report-suggested CURIEs GO:0097530 and CL:0000556 rejected as mislabelled and GO:0034375 skipped as uncached. Validated: 140/140 snippets verified, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-snippet-length, check-title-snippets all pass.

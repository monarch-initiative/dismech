  summary: Review Tangier pathograph and assess OpenScientist findings
  details: |
    Reviewed the entire Tangier YAML, complete OpenScientist report and 35-reference citation sidecar, the fallback research provenance and its baseline papers, GeneReviews, and additional primary clinical/mechanistic literature. The fallback report documents failed provider attempts rather than a new research narrative; ABCA1, MONDO:0008783 and disease identities were checked directly. Read the report as literature synthesis, with no executable provider analyses or figure artifacts present.

    Pathograph review: separated cellular lipid-export failure from systemic HDL biogenesis and tissue storage; removed duplicated causal links to biochemical readouts; replaced the abstract vascular-risk node with macrophage foam-cell atherogenesis; separated nerve dysfunction from bulk tissue storage; removed arrows based only on dermatologic/clinical co-occurrence. The syringomyelia-like peripheral neuropathy pattern no longer asserts an anatomical syrinx. Added evidence-qualified membrane cholesterol signaling, inflammasome/cytokine amplification, platelet granule and activation defects, insulin-secretion impairment, and experimental PMP22 processing. The combined Abca1/Abcg1 hyperlipidemic mouse context is explicit. Human sphingolipid depletion and untested S1P/HSPC clinical mediation are separated.

    Content-completeness checklist: clinical phenotype coverage reviewed against GeneReviews and Orphanet, with reticulocytosis, stomatocytosis, hemolytic anemia, bleeding and glucose-intolerance findings added. Neuropathy patterns are described as clinical heterogeneity rather than unsupported molecular subtypes; selected-series proportions are not population frequencies. Genetics distinguishes pathogenic variants from VUS and common population alleles. Diagnosis includes acquired and inherited low-HDL differentials. All four GeneReviews sections were checked: clinical characteristics, diagnosis/testing, management/surveillance/agents to avoid, and genetic counseling. Conditional 25/50/25 recurrence is stated; the detailed GeneReviews counseling section resolves the typo in its summary saying the first 25% is unaffected. No checked baseline manifestation with an established >10% frequency was knowingly omitted.

    Treatments and models: added the omitted MUSTANG nonrandomized n-of-1 trial (PMID:41212481; ISRCTN17945917), preserving failure to meet prespecified clinical-difference thresholds despite later extension improvement. Added its sanctioned ICTRP cache and the terminated NCT01782027 tracer-method study, without interpreting registry inclusion as therapeutic efficacy. Added explicit mouse and cellular model links and limitations. No disease-modifying treatment effect is inferred from the nine-carrier acute apoA-I infusion study.

    OpenScientist assessment: 22 exact report-anchored claims, overall PARTIALLY_SUPPORTED while the canonical ABCA1 mechanism remains CANONICAL. Corrected highest-versus-lowest-quartile efflux risk reduction reported as per-SD, DMPC plasma-versus-cell inference, human NLRP3/NETosis and S1P overstatements, VUS overinterpretation in the early-CAD case, review-versus-primary scope, and false no-trial/no-GenCC assertions. Existing G2P Definitive and Labcorp Strong assertions were checked on the primary GenCC gene page; these are not a ClinGen GCEP verdict. Recorded cited cohort/model provenance and proposed analyses without claiming raw-data access or computation.

    Validation: disorder schema/ontology/reference validation, assessment structure and quote anchors, history validation, duplicate/entity/causal/enum/qualifier checks and offline content/cache gates. New evidence titles are copied from fetched source metadata. Reference caches generated through just fetch-reference (including ICTRP); ontology caches only through validators. Sparse checkout excludes the frozen dataset-accession file; no schema or application-code edits.

  summary: 'Gene-family review: ABCA1'
  details: |
    Typed the ABCA1 record CAUSATIVE with germline origin (it carried only the free-text association) and bound its autosomal recessive inheritance item to HP:0000007. Corrected the ABCA1 node's molecular functions, which had no modifier and used the generic ATPase-coupled transmembrane transporter term: ABCA1 is a phospholipid floppase that moves phosphatidylcholine, phosphatidylserine and sphingomyelin to the outer leaflet, and Tangier alleles reduce that activity (PMID:24097981), so the node now binds ATPase-coupled intramembrane lipid carrier activity and apolipoprotein A-I binding (PMID:14660648), both decreased. Moved the gene from the single-valued gene slot to the genes list. Corrected the entry name, which read 'Tangier_Disease' with the file-stem underscore, to 'Tangier Disease'.

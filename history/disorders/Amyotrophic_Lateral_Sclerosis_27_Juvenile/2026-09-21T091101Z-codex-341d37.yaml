  summary: Review ALS27 source scope, causal mechanisms, clinical course and care
  details: |
    Comprehensive source review completed; full coverage and limitations are recorded in review_notes. Replaced bundled mechanisms with ten atomic nodes, corrected case ascertainment and survival statistic, separated variant-dependent splicing and feedback mechanisms, repaired engineered-cell and mouse model provenance, and added general ALS care plus the adult-only LTX-002 trial. Full source audit and independent model/family peer review completed. All 187 source snippets and schema/ontology validation pass. No reference cache was hand-edited and the frozen accession blob was not accessed.
    Full scientific bodies consumed: PMID34059824, 34459874, 35900868,
    36801857, 37497262, 35627278, 38788085 and 37308477. Independent full-source
    peer review consumed PMID39666121 and 42392979, with local claim checks and
    a final integrated model/family audit finding no material residual issue.
    PMID36204986 and 37348646 were available as abstracts. Refreshed generated
    34459874 and 36801857 caches recovered clinical and survival table rows.
    Read the complete ALS GeneReviews chapter and EAN 2024 guideline, and the
    current full NCT07660614 API. General ALS care is distinguished from ALS27
    pediatric evidence; this recruiting adult trial has no posted results.
    Corrected the 512-month statistic from median/IQR to censored mean/95% CI;
    removed unsupported phenotype frequencies and fixed the engineered WTC11
    monoallelic versus compound genotype distinction. Mouse lethality is not
    interpreted as proof of loss of function, and steady-state lipids are not
    described as flux. Preserved uncertain cognition and tissue-specific mosaicism
    limits. Updated the node-class example to the renamed initiating node.

  summary: 'Create: Amyotrophic Lateral Sclerosis 27, Juvenile (SPTLC1/ALS27)'
  details: |
    De novo curation of ALS27 (MONDO:0859529, OMIM 620285, causal gene SPTLC1/hgnc:11277) from primary literature plus one falcon deep-research report.

    Identity anchoring (NEC risk is high for the numbered ALS1..ALS27 series): MONDO looked up with OAK, confirming RO:0004003 SPTLC1 and OMIM:620285. `just preflight-dr research/Amyotrophic_Lateral_Sclerosis_27_Juvenile-deep-research-falcon.md MONDO:0859529` returned PASS (SPTLC1 mentioned 41 times; nearest rival SPTLC2 at 5).

    Deep research: falcon (Edison), 712 s, 11 citations. Its own reference-validation block reported needs_review: true with one unresolved identifier, "DOI:10.3233/JND-240014-current". I re-checked that identifier: the failure was a formatting artifact (an em-dash and the word "current" concatenated onto the DOI in the report text). The clean DOI 10.3233/JND-240014 resolves via the PMC ID converter to PMID:38788085 (Mohassel, Abdullah, Eichler, J Neuromuscul Dis 2024), which was fetched with `just fetch-reference` and cited. No other report identifier was unresolved. The report was used as leads only; every cited PMID was fetched independently and every snippet checked against its own cache file.

    Key correction the deep research surfaced, and the most safety-relevant content in the entry: the JAMA Neurology index paper (PMID:34459874) describes an ALS27 patient given high-dose oral L-serine on a compassionate basis. Read alone that looks like a candidate therapy. The 2024 authoritative review (PMID:38788085) states that in SPT-related motor neuron disease, which is caused by unrestrained SPT activity, serine supplementation is predicted to EXACERBATE sphingolipid overproduction, and that serine supplementation of iPSC-derived motor neurons carrying SPTLC1 p.Phe40_Ser41del accentuated the consequences of SPT overactivity. The treatment entry is therefore titled "predicted harmful", carries REFUTE evidence, and records both the observed weight gain and the absence of neurological improvement so the n-of-1 exposure is neither hidden nor overstated. The HSAN1 rationale (where L-serine IS therapeutic) is explicitly marked as not transferable.

    Mechanistic model curated as a chained pathograph: SPTLC1 transmembrane-domain gain-of-function variant -> impaired ORMDL-mediated feedback inhibition of serine palmitoyltransferase (GO:0004758 GAIN_OF_FUNCTION and GO:0090155 LOSS_OF_FUNCTION on the same node, plus GO:0017059 SPT complex and GO:0005783 ER) -> unrestrained de novo sphingolipid synthesis (GO:0030148 INCREASED; CHEBI sphingolipid/sphinganine/ceramide INCREASED) -> upper and lower motor neuron degeneration -> progressive denervation and neurogenic muscle atrophy -> loss of ambulation and respiratory insufficiency. The step from lipid excess to motor neuron death is marked INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence, because it is genuinely not established.

    Three discussions recorded rather than papered over: a KNOWLEDGE_GAP on why motor and sensory neurons are selectively vulnerable to different sphingolipid abnormalities (stated as unresolved by both the 2021 Nature Medicine paper and the 2024 review); a HUMAN_MODEL_MISMATCH noting that no faithful in vivo ALS27 model exists (the 2026 Sptlc1 exon-2-deletion knock-in is curated as FAILS_TO_RECAPITULATE, since heterozygotes show neither motor deficits nor ALS-like neuropathology while homozygotes die, i.e. the allele behaves as loss-of-function in mouse rather than the human gain-of-function); and an OPEN_QUESTION on whether SPTLC1-related ALS and HSAN1 are discrete entities or a continuum, given the p.Ser331 hybrid cases and the serine-limitation experiment that shifted an ALS lipid signature toward an HSAN1-like one within one pedigree.

    Cognitive impairment is curated with the disagreement visible: the 2024 review says cognitive dysfunction has not been reported in SPTLC1-ALS, while the JAMA Neurology cohort documented mild cognitive dysfunction in one patient and measured attentional/executive impairment in another. Neither side was suppressed.

    Scope: SPTLC2-related juvenile ALS (ALS28) and SPTSSA-related complicated HSP are recorded as differential diagnoses only, not curated here. Deliberately NOT curated: datasets (no relevant repository accession identified; dataset search keyed on a causal gene is a known Named Entity Confusion route for an ultra-rare disease and was not worth the risk), prevalence (no reliable population estimate exists in the literature), and clinical_trials (no ALS27-specific registered trial found).

    GeneReviews baseline: PubMed searched for a GeneReviews chapter on ALS27 / SPTLC1-related ALS on 2026-08-19; none exists, so that step does not apply. Recorded in the entry notes.

    Relationship to the existing broad kb/disorders/Amyotrophic_Lateral_Sclerosis.yaml entry: that entry is a Complex-category entity whose curated mechanism is TDP-43 proteinopathy and convergent proteostatic failure, and it contains no SPTLC1 content at all. ALS27 is a Mendelian primary metabolic disease with a disjoint mechanism, its own MONDO term, and distinct treatment logic, so it is curated as a standalone entry with parents: Amyotrophic Lateral Sclerosis rather than as a has_subtypes entry on the broad file.


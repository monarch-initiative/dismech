  summary: 'Create: familial digital arthropathy-brachydactyly'
  details: |
    Created the familial digital arthropathy-brachydactyly entry (MONDO:0011732), an autosomal dominant TRPV4 channelopathy. The curation decision that matters here is the direction of the causal chain: the brachydactyly is a consequence of joint destruction, not a primary growth-plate dysplasia, so the pathograph runs from ankyrin-repeat-domain gain-of-function variants through increased channel activity and chondrocyte injury to articular cartilage destruction and only then to digital shortening. This is what separates the entry from the TRPV4 skeletal dysplasias and neuropathies already curated. Every evidence snippet was verified as an exact substring of a fetched reference cache file; all offline gates pass.

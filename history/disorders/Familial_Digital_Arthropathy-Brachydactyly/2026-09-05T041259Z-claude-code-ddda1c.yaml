  summary: 'Create: familial digital arthropathy-brachydactyly'
  details: |
    Created the familial digital arthropathy-brachydactyly entry (MONDO:0011732), an autosomal dominant TRPV4 channelopathy. The curation decision that matters here is the direction of the causal chain: the brachydactyly is a consequence of joint destruction, not a primary growth-plate dysplasia, so the pathograph runs from the ankyrin-repeat-domain variants through impaired cell-surface trafficking and reduced channel responsiveness to loss of articular cartilage homeostasis, subchondral destruction, and only then to digital shortening. This is what separates the entry from the TRPV4 skeletal dysplasias and neuropathies already curated. The functional direction of the FDAB alleles is contested and the entry records it as such: functional_impact_category is LOSS_OF_FUNCTION, following the only study that assayed these alleles, with the opposing gain-of-function reading captured in disc_fdab_channel_direction rather than resolved. An earlier version of this record described the chain as running through gain-of-function variants, increased channel activity and a chondrocyte-injury node; that was wrong on all three counts and contradicted the entry it documents. Every evidence snippet was verified as an exact substring of a fetched reference cache file; all offline gates pass. No deep-research provider report was generated for this entry: the drafting run was cut short, and the reference set was assembled directly from PubMed. FDAB's disease-specific literature is about seven papers and the entry cites all of them.

  summary: 'Review: GTN - overreaching metastasis evidence, missing hCG-to-hyperthyroidism
    edge'
  details: |
    Manual claim-evidence review. This entry is one of the stronger ones reviewed; the imprinting logic (CDKN1C maternally expressed, silenced in the androgenetic complete mole) is stated correctly throughout. Fixed: (1) the Pulmonary Metastasis phenotype was labelled SUPPORT on a FIGO staging snippet that never names the lung - the explanation supplied the lung fact from outside the quote; downgraded to PARTIAL with the limitation stated; (2) the hCG Hypersecretion node's description explains hCG/TSH-receptor cross-reactivity but the node had no downstream edge to the Hyperthyroidism phenotype it produces - edge added.
    Remaining gaps not fixed: no prevalence block (GTN incidence varies markedly by geography); the Tumor Suppressor and Apoptosis Dysregulation and PD-1/PD-L1 nodes are orphans with no downstream edges.

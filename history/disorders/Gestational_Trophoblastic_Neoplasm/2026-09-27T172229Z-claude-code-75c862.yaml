  details: |
    Review round 1 on PR #13022. The edge from Persistent Trophoblastic Proliferation to Abnormal Vaginal Bleeding cited PMID:38098552 with the snippet 'It manifests as vaginal bleeding, accompanied by high levels of beta-human chorionic gonadotropin'. Checked the cached full text: the antecedent of 'It' is 'Molar pregnancy is the most common type of gestational trophoblastic disease', and the sentence sits under that case report's INTRODUCTION AND IMPORTANCE heading. So the quote was about molar pregnancy, not about the neoplasia this entry covers - the same entity confusion the PR handles carefully elsewhere in routing HYDM1 and HYDM2 to Hydatidiform_Mole. Neither cached GTN review (PMID:20739008, PMID:20673583) contains the word bleeding, so no substitute existed in the cached set. Fetched PMID:42058518, whose introduction states 'Most patients with GTN present with abnormal vaginal bleeding but they can also present with bleeding from metastatic sites' - about GTN itself - and added it with quote_role BACKGROUND, since it frames a case report rather than reporting that report's own series. The same paragraph also states that in the majority of GTNs the disease is limited to the uterus where abnormal trophoblast proliferation and localized hCG production may lead to focal vascular changes; that sentence was added to the bleeding edge as the mechanism and also replaced the Elevated hCG edge's previous quote, which was the fragment 'the use of human chorionic gonadotropin as a biomarker' and did not say the trophoblast produces the hormone. PMID:38098552 remains cited three times elsewhere in the entry on claims it does support. Validation on the committed tree: just validate and just validate-terms pass, count-verified-snippets 269/269 across this round's four files.

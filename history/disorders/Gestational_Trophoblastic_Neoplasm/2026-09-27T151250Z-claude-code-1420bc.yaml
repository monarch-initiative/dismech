  summary: Route the recurrent-mole classes to Hydatidiform_Mole, wire HFM1 and four
    phenotypes
  details: |
    series-064 genetics pass. Both checklist classes are declined here and routed to Hydatidiform_Mole, where NLRP7 and KHDC3L were already curated: familial biparental recurrent mole is a recessive maternal-effect predisposition of the oocyte, not a trophoblastic tumour, and every has_subtypes row in this entry is an NCIT neoplasm morphology. The ruling is recorded in new entry notes. What this entry does carry is the separate meiosis-I predisposition set, anchored on HFM1, which was listed but reached no node; HFM1 is now bound on the androgenetic-origin node with the founding report's own gene-naming sentence, taking gene wiring 0/2 to 1/2. Phenotype inlink 1/5 to 5/5: uterine neoplasm and pulmonary metastasis from the invasion node, abnormal vaginal bleeding from the hyperproliferation node, and a causal edge from the hCG node to the elevated-hCG phenotype that is distinct from the reports_on readout link already there. The pulmonary-metastasis edge supplies the site-specific citation that phenotype's own explanation asked for. The remaining unwired genetic record, Androgenetic Diploid Genome, carries no gene_term at all and so cannot be wired by gene matching; it describes a genome-wide state rather than a gene.

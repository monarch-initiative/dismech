  summary: 'Create: SQSTM1-related_Multisystem_Proteinopathy'
  details: |
    New gene-level entry for heterozygous, autosomal dominant SQSTM1 disease (MONDO:0800464), lumped with its three MONDO descendants as has_subtypes rows: PDB3 (MONDO:0008176), FTDALS3 (MONDO:0014640) and DMRV (MONDO:0014945). The ClinGen ALS GCEP curation of SQSTM1 (Moderate, CGGV assertion dae3327f) makes the same lump and splits off the recessive childhood-onset disease, which stays in SQSTM1-Related_Childhood-Onset_Neurodegeneration. PDB3 is also a subtype row of Paget_Disease_of_Bone; it is kept as an ordinary subtype here rather than a curated_in pointer, since no entry curates PDB3 in full. The pathograph has one shared variant node branching into a selective-autophagy arm (LIR/UBA cargo-receptor defect, p62/TDP-43 inclusions, motor neuron, frontotemporal and myofibre degeneration), a KEAP1-NRF2 arm restricted to FTDALS3, a stress-granule node carrying the TIA1 p.Asn357Ser digenic modifier for DMRV, and an osteoclast RANKL/NF-kB arm for PDB3. The contested sufficiency of the P394L knock-in for pagetic lesions is recorded with SUPPORT (PMID:21515589) and REFUTE (PMID:24339057) evidence and a KNOWLEDGE_GAP discussion. Key PMIDs: 11992264, 12374763, 22084127, 24042580, 22972638, 26208961, 29457785, 39142003, 38016875, 27158844, 31362587, 27554286, 24642144, 21515589, 24339057, 38123339 (ZiPP trial), 32176830. One openscientist deep-research report was used: 25/25 references resolved, 0 off topic; term validation needs_review with 6 mislabelled CURIEs, none of which were bound. The report wrongly calls the disease MSP3 with OMIM 616887; MSP4 was used per PMID:26208961 and PMID:36861178. just preflight-dr could not run because the local MONDO build is absent and was not downloaded; a manual check found the report about SQSTM1 throughout (69 SQSTM1 mentions, 4 VCP). Validation: just validate passes with 93/93 snippets verified; entity-ref, causal-target, duplicate-key, enum, snippet, title, gene-activity-grounding and coarse-phenotype gates pass; 20 of 21 phenotypes are causally connected (fracture susceptibility deliberately unconnected because most fractures occur in unaffected bone).

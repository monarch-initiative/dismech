  summary: 'Review round 1: TPP2_Deficiency'
  details: |
    Changes from the first review of PR 18302. Removed three pointers to a discussions section that the entry does not have (TPP2 gene notes, Impaired Effector Cytokine Production, CNS demyelination). Removed the CNS demyelination phenotype: it rested entirely on the single adult family with MS-like sterile brain inflammation (PMID:30533531), which has reduced TPP2 protein but normal activity, no cytopenias, and is not in the ClinGen proband count; the family is now mentioned only in the gene notes with its PMID. Added evidence to the uncited edge from Impaired Effector Cytokine Production to recurrent lower respiratory tract infections (Lu et al. sentence attributing broad pathogen susceptibility to poor cytokine production, IN_VITRO, INDIRECT). Added therapeutic agents to the IVIG and corticosteroid treatment (NCIT:C80829 Human Immunoglobulin G, CHEBI:50858 corticosteroid). Added a second-line immunosuppression treatment (cyclosporin A, mycophenolate mofetil, rituximab) with a REFUTE item quoting their failure in the Stepensky index patient. Not changed: no discussions section; no frequency band on developmental delay, because only one cohort gives a denominator; no combined-immunodeficiency phenotype, because no cached source describes the disease in those words. Validation: validate, validate-terms, 86/86 snippets, entity refs, causal targets, gene-activity grounding, reference titles and snippet grading pass.

  details: |
    New entry for TPP2 deficiency (immunodeficiency 78 with autoimmunity and developmental delay, MONDO:0030971), curated from the claude_code deep-research report research/TPP2_Deficiency-deep-research-claude_code.md and the cited primary literature. Covers autosomal recessive inheritance, TPP2 with its ClinGen Definitive AR classification copied from the CGGV record, a pathophysiology chain from TPP2 loss of function through impaired amino-acid recycling, compensatory lysosomal expansion, hexokinase-2 degradation and reduced lymphocyte glycolysis to premature lymphocyte senescence and age-associated B-cell expansion, the phenotypes reported across published families, diagnosis, treatments (HSCT, IVIG with corticosteroids, sirolimus, eltrombopag), and the TPPII knockout and gene-trap mouse models. The entry has no discussions section; two open questions (opposite IFN-gamma findings in different T-cell populations, and whether the reported MS-like family with reduced TPP2 protein but normal activity belongs to this disease) are not recorded as KNOWLEDGE_GAP discussions. Validation: just validate, validate-terms, 86/86 snippets verified against cached references, entity refs, causal targets, gene-activity grounding and reference-title gates all pass.

  details: |
    Answers the five non-blocking suggestions on PR #11494 in one push. (1) The Bilateral Early-Onset Cataract description mentioned only the Girelli newborn, while two of the three evidence items this PR added document a different patient - Serra's paediatric proband, who had no lenticular opacities at all at diagnosis and was placed under surveillance rather than treated. That distinction is the whole point of the PR and it was in notes but not in the description the evidence hangs off. The description now names both children and says what separates them: the newborn's opacities were delayed, the proband's were absent at presentation. (2 and 3) Marked directness: INDIRECT on the two Serra-derived items. Both quote the 2025 paper's account of a case reported by someone else; the primary report is not in the reference cache, so the inference step is from a secondary summary to the case it describes. The explanations already said this in prose - the slot makes it machine-readable, which is what the reviewer asked for. (4) Regraded the third item from HUMAN_CLINICAL to OTHER. The publication is a case report, so HUMAN_CLINICAL was defensible, but this particular sentence is the paper's review-style framing of what the literature does and does not establish about genotype-phenotype correlation, not an observation of its own patient - and the same shape of sentence is graded OTHER on the venesection-harm node from PMID:30678075. The explanation now records the reasoning so a later curator does not have to re-derive it. check-snippet-grading is keyed on the quoted sentence rather than the PMID, so nothing fired either way; this is a consistency fix, not a gate fix. (5) Filled the earlier history record's empty links block with the PR its prose already named, and reflowed the two over-long lines in the notes folded scalar where this PR spliced its new sentences in. No claim was widened and no new reference was fetched.

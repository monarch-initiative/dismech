  summary: 'Follow-up to #11174 review: cite the paediatric no-cataract case, drop
    orphan cache, fix title mismatches'
  details: |
    Follow-up to the approved review on PR #11174, taking the three non-blocking suggestions that were accepted in the reply and deferred rather than pushed onto the approved head.

    THE INTERESTING ONE. The reviewer asked me to attribute the notes: claim that 'one 2025 paediatric case had hyperferritinaemia with no cataract at all' by citing PMID:41281144. Fetching that paper showed the claim as written is wrong, and citing it as asked would have propagated the error under a real reference.

    PMID:41281144 (Hemanna and Sidlow 2025) is titled 'A Pediatric Case Without Congenital Cataract'. Without a CONGENITAL cataract is a weaker claim than without any cataract. The case with no lens opacity at all is a different, earlier one: the 2025 paper's own text says it 'reported on a pediatric case of HHCS that did not present with cataracts; this case, unlike our case, involved exclusively maternal relatives of the male proband harboring a different variant (A37C) in FTL', and its comparison table attributes that to Serra et al. 2011, recording that 'At diagnosis, the child had no visual deficits or lenticular opacities'.

    So the entry had conflated two cases and two claims. The notes sentence is rewritten to distinguish them and says so explicitly, and three evidence items are added to the Bilateral Early-Onset Cataract phenotype: the prior-case sentence, the Serra table row, and the paper's statement that the determinants of ocular-phenotype variability remain poorly understood. The Serra row is quoted from the 2025 paper rather than from Serra directly, and its explanation says so, because the primary report is not in the reference cache.

    ORPHAN CACHE. references_cache/PMID_15183095.md removed. The entry's own notes: already explained why that reference is deliberately uncited (abstract-only cache, the useful HHCS passage is full-text-only), so keeping a committed cache for it served nothing. The notes sentence now records the removal so the reasoning survives without the file.

    TITLE MISMATCHES. Both cosmetic mismatches the reviewer flagged turned out to be repeated across every citation of their PMIDs rather than isolated: 11 occurrences of 'Worldwide' where PMID:20511138's cached title has lowercase 'worldwide', and 10 occurrences where the U+2009 THIN SPACE characters around the '>' in PMID:29269865's 'Ghent +49A > G' had been normalised to ordinary spaces. Both restored to match the cache byte-for-byte. The thin-space case was confirmed by codepoint comparison rather than by eye, since the two render identically.

    Validation: schema, terms and references pass, 98/98 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-environmental-evidence all clean.

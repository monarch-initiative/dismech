  details: |
    Added three phenotypes from cached full texts: Cortical Lens Opacities (HP:0100019; PMID:20511138, 26849797, 41281144), Sutural Lens Opacities (HP:0010695; PMID:20511138, 26849797, 41281144) and Reduced Contrast Sensitivity (HP:0032036; PMID:26849797). Enriched Bilateral Early-Onset Cataract (childhood onset category with age range notes; surgery age 14-57 in one family; slow progression over 18 years; fifth-decade onset case), Nuclear Cataract, Visual Impairment (opacity location, asymptomatic carriers, glare) and Persistent Hyperferritinemia (values over 6000 microgram/L). Wired Nuclear, Cortical and Sutural opacities from the crystalline-deposition node and Reduced Contrast Sensitivity as a sequela of the cataract. Single-family lens findings (blue-dot opacities, subcapsular vacuoles) and glare recorded in notes as leads. PubMed, Europe PMC, OLS and Orphadata were blocked by the session proxy, so all evidence comes from references already in references_cache. Validation: validate, validate-terms, validate-disorders, count-verified-snippets (116/116), check-causal-targets, check-coarse-phenotypes, check-name-collisions, check_snippet_length all pass.

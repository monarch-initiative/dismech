  details: |
    Created kb/disorders/Hereditary_Hyperferritinemia_With_Congenital_Cataracts.yaml (MONDO:0010952,
    FTL / hgnc:3999, autosomal dominant) de novo, and deleted the corresponding curation stub.

    DEEP RESEARCH THAT ACTUALLY RAN. Two providers, both successfully, no fallback.
    (1) asta - research/Hereditary_Hyperferritinemia_With_Congenital_Cataracts-deep-research-asta.md,
    retrieval-only, 16 papers / 20 snippets, reference_validation 30/30 resolved, 0 unresolved,
    0 off-topic, term_validation found no CURIEs to check. `just preflight-dr` returned WARN on this
    report: rival gene HFE at 26% of FTL mentions. That WARN was inspected and dismissed on reading -
    the HFE mentions are the misdiagnosis-as-haemochromatosis discussion that is the clinical core of
    this disease, and the CRYGD/BFSP2/MIP mentions come from five generic congenital-cataract papers
    Asta retrieved as topical noise (items 4, 7, 8, 11, 14). None of those five is cited in the entry.
    (2) falcon (Edison) - research/...-deep-research-falcon.md, 615 s, 59 citations, one artifact.
    `just preflight-dr` returned PASS (FTL 29 mentions, OMIM 600886 in both the report and MONDO).
    Its reference_validation flagged one unresolved identifier, DOI:10.1007/s00439-017-1835-3, given
    for Van de Sompele et al. 2017; it is not cited. Its term_validation flagged MONDO:0010952 as
    "mislabelled" against the reported label "if available", which is a template placeholder leaking
    into the report rather than a real term error - the CURIE and its label were confirmed
    independently against ols:mondo.

    GENEREVIEWS. There is no GeneReviews chapter for this disease. Searched PubMed two ways -
    `hyperferritinemia cataract GeneReviews[All Fields]` and
    `(hyperferritinemia[TI] AND cataract[TI]) AND GeneReviews[BOOK]` - both returned zero records.
    Per the skill, absence needs no workaround; the phenotype baseline was built instead from the two
    largest clinical series (PMID:15280904, 49 individuals across seven British kindreds; PMID:11703332,
    62 patients in 14 families) plus the 2010 worldwide mutation-and-phenotype review (PMID:20511138)
    and the 2023/2025 reviews (PMID:36768886, PMID:41300832).

    MECHANISM MODEL AND WHY. An eight-node causal chain, MOLECULAR -> ORGANISM, with a branch:
    FTL Iron-Responsive Element Disruption -> Loss of Iron-Regulatory Protein Binding to the FTL IRE
    -> Constitutive Derepression of L-Ferritin Translation -> L-Ferritin Overproduction and
    Intracellular Accumulation, which then branches to (a) Serum Hyperferritinemia Uncoupled from Body
    Iron Stores and (b) Lens Fibre Cell L-Ferritin Accumulation -> Crystalline L-Ferritin Deposition
    and Lens Light Scattering. Every edge except two carries its own cited evidence separate from the
    node evidence.

    JUDGEMENT CALLS A REVIEWER SHOULD SEE.
    1. The iatrogenic arm is modelled inside the pathograph, not left as prose. Serum Hyperferritinemia
       -> Iatrogenic Iron Depletion from Misdirected Venesection and Chelation is typed
       INDIRECT_KNOWN_INTERMEDIATES with the intermediate recorded explicitly as
       "Misattribution of isolated hyperferritinaemia to hereditary haemochromatosis", because the
       intervening step is interpretive rather than biological. That is a deliberate choice and it is
       argued in the node description. The harm is the clinically dominant fact about this disease
       (PMID:7492760, PMID:20511138, PMID:33221470, PMID:41769540, PMID:30678075) and it also drives a
       treatment entry (Avoidance of Venesection, Iron Chelation and Liver Biopsy) and the
       hereditary-haemochromatosis differential.
    2. Modifier grading. GO:0006413 translational initiation is tagged GAIN_OF_FUNCTION and
       GO:0045947 negative regulation of translational initiation LOSS_OF_FUNCTION, rather than the
       default INCREASED/DECREASED, because the change is qualitative in exactly the sense CLAUDE.md
       reserves those values for: PMID:9596665 shows L-ferritin in patient cells is "not affected by
       iron supplementation or chelation", i.e. the process has left its regulatory circuit rather
       than merely running faster. By contrast GO:0030350 iron-responsive element binding is tagged
       DECREASED, which is quantitative and correct - PMID:29269865 measures a 5-fold affinity loss
       that does not abolish binding.
    3. functional_impact_category is deliberately NOT set on the pathophysiology genetic_context, and
       the reason is written into the block. Every value in FunctionalImpactEnum describes the activity
       of a gene product; an IRE variant leaves the L-ferritin protein untouched and changes only how
       much is made. The variant-level claim is carried by regulatory_category: GOE on the four
       genetic.variants entries instead. GOE is itself imperfect - the enum titles it "gain of ectopic
       expression" and HHCS derepression is regulatory, not spatially ectopic - but its description
       explicitly lists repressor-site disruption as a route, it is the only gain-of-expression value
       available, and the mismatch is flagged in the entry notes rather than hidden.
    4. Module conformance is declared around, not through, the cataract module. Two nodes conform to
       cataract_lens_opacification: Lens Fibre Cell L-Ferritin Accumulation -> "#Lens Homeostasis
       Insult", and Crystalline L-Ferritin Deposition and Lens Light Scattering -> "#Loss of Lens
       Refractive Transparency and Light Scattering". The module's two intermediate nodes are
       crystallin-centred (loss of crystallin solubility, then crystallin aggregate deposition) and
       HHCS largely bypasses them: the deposits are crystals of an overproduced non-crystallin protein.
       The caveat is recorded in that node's notes, and whether the crystallins are involved at all is
       the untested Levi hypothesis (PMID:9596665), captured as a knowledge-gap discussion.
    5. HP:6000642 Sunflower cataract was considered and REJECTED even though PMID:15280904 calls the
       HHCS morphology "sunflower". HPO defines that term as an anterior subcapsular copper deposit
       "almost only seen in Wilson disease" - a different lesion in a different lens layer sharing a
       floral metaphor. HP:0010693 Pulverulent cataract (punctate dust-like opacities of the fetal
       nucleus) was bound instead. Reasoning is recorded on the phenotype and in the entry notes.
    6. The MONDO label says "congenital cataracts" and the cataract is often not congenital
       (PMID:11703332 followed a variant-carrying newborn with no opacity at birth or one year). The
       MONDO name is kept for name/disease_term as the ontology anchor; the phenotype descriptions
       carry the accurate "early-onset" framing. Explained in notes.
    7. Two reference_ranges are curated on serum ferritin (sex-stratified, PMID:29269865) and one on
       transferrin saturation (PMID:21936912), each with a citable evidence item rather than a
       free-text source, against LOINC:2276-4 and LOINC:2502-3. Both LOINC codes were looked up in the
       NLM Clinical Table Search Service, not written from memory. No interpretation_bands: HHCS has no
       graded severity tiers for ferritin, and the entry states explicitly that the value does not
       index cataract severity.

    REFERENCES CONSIDERED AND REJECTED.
    - PMID:15183095 (Hejtmancik and Kantorow, molecular genetics of age-related cataract) was fetched
      because Asta surfaced a good HHCS mechanism paragraph from it. That paragraph is full text only;
      the cached record is abstract-only and contains nothing about HHCS. Dropped rather than cited
      from text the cache cannot verify.
    - NCIT:C74736 was very nearly bound as "Transferrin Saturation" from memory. It is in fact
      "C-peptide Measurement". Caught by checking cache/ncit/terms.csv before validating; corrected to
      NCIT:C98792 Transferrin Saturation Measurement. Recorded here because the near-miss is exactly
      the failure mode the term contract exists for.
    - GO:0070288 ferritin complex was first used as the serum-ferritin biomarker_term; BiomarkerTerm is
      NCIT-only, so it was replaced with NCIT:C224202 Serum Ferritin.
    - ORPHA:163 is the Orphanet identifier for this disease but `just fetch-reference ORPHA:163` has no
      source; generating it needs a bulk Orphadata rebuild, which was out of scope for this session, so
      no ORPHA evidence is cited.
    - The five generic congenital-cataract papers in the Asta report (CRYGD, Cat-Map, WES cohorts) were
      read and not used: they are about cataract genetics in general, not this disease.

    NOT DONE.
    - No `datasets:` block. FTL dataset search is a textbook Named Entity Confusion trap - the gene's
      transcriptomic literature is dominated by neurodegeneration and by ferritin as an inflammatory
      marker, and this ultra-rare non-coding disorder has no omics corpus of its own (the falcon report
      independently reports finding no single-cell, spatial, proteomic, metabolomic or multi-omics HHCS
      study). Rather than attach accessions that resolve but are not about this disease, the block is
      omitted. This is the main reason global compliance is 94.5% and not higher.
    - No `animal_models:`, `experimental_models:` or `computational_models:`. No animal model of HHCS
      has been published; the falcon report reaches the same conclusion. The in-vitro work that exists
      (patient lymphoblastoid lines, recombinant IRP1 EMSA) is curated as evidence on the mechanism
      nodes rather than invented as model records.
    - No `clinical_trials:`. The only registered study the falcon report found (NCT05659017,
      "Candidate Gene for Hyperferritinemia") is observational with unknown status and is not an HHCS
      treatment trial; not curated.
    - classifications.harrisons_chapter and .icimd_category carry notes but no evidence items, matching
      the convention in kb/disorders/Methylmalonic_Aciduria_cblA_Type.yaml and IRIDA_Syndrome.yaml.


  summary: 'Create: Enhanced S-Cone Syndrome NR2E3'
  details: |
    New autosomal recessive ESCS entry MONDO:0100288 from lit-scan issue 6079. Modeled NR2E3 loss of function leading to derepression of the S-cone program and photoreceptor cell-fate mis-specification with excess S cones and rod deficiency, then progressive retinal degeneration and maculopathy. Captures the paradoxical gain of function of a photoreceptor subtype that distinguishes ESCS from rod-first RP. conforms_to photoreceptor_degeneration at the gene-defect and progressive-degeneration nodes. Evidence from PMID:10655056, PMID:11773633, PMID:19718767, the anchor case report PMID:42427056, and trial NCT02338973. Added MONDO:0100288 to the DiseaseTerm enum cache, warmed via the local sqlite MONDO adapter because the OLS adapter cannot expand hierarchy. All snippets verified against fetched abstracts; schema, term, reference, and graph validation pass.

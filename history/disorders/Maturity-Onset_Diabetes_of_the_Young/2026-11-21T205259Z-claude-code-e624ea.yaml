  summary: Create from the Diabetes_Mellitus umbrella's MODY catalogue
  details: |
    Part of retiring the Diabetes_Mellitus umbrella Disease entry (step 5 of docs/curation-notes/diabetes-mellitus-grouping-refactor.md). Subtype rows (MODY 1-4, 6, 8, 10, 12, 13, renal cysts and diabetes) and gene rows moved as unchanged blocks with their evidence; only umbrella-relative wording in notes was reworded. MODY 7, 9, 11 and 14 were not carried as subtypes, because CLAUDE.md forbids a subtype row for a disputed locus; KLF11, PAX4, BLK and APPL1 stay as DISPUTED genetic rows with their refuting evidence. The HNF1A and HNF4A ClinGen assertions are scoped to monogenic diabetes (MONDO:0015967), broader than MODY, so they are quoted as evidence rather than recorded as validity tiers. New content: autosomal dominant inheritance; four mechanism nodes (transcription factor deficiency, glucokinase threshold, K-ATP channel, insulin gene) each stating the lost GO molecular function, plus a node conforming to diabetic_vascular_complications#Chronic Hyperglycemia; four phenotypes; sulfonylurea therapy. New snippets come from PMID:29931562 (full text) and were checked against the cache before writing. CEL is recorded but not wired, its primary lesion being exocrine.

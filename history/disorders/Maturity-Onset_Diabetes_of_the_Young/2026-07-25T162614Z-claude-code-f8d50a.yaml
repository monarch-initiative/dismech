  summary: 'Create: Maturity-Onset Diabetes of the Young (MODY)'
  details: |
    Created standalone MODY Disease entry (MONDO:0018911), promoting monogenic MODY out of the Diabetes_Mellitus umbrella has_subtypes catalog into its own mechanism-focused entry. Modeled the autosomal-dominant monogenic beta-cell-dysfunction mechanism with four clinically actionable subtypes (GCK-MODY/MODY2, HNF1A-MODY/MODY3, HNF4A-MODY/MODY1, HNF1B-MODY/MODY5-RCAD). Flagship treatment-response mechanism: GCK-MODY needs no pharmacotherapy (stable complication-free raised glucose set point) vs sulfonylurea-sensitive HNF1A/HNF4A-MODY. Node 'Chronic Hyperglycemia and Vascular Complication Risk' conforms_to diabetic_vascular_complications#Chronic Hyperglycemia (scoped to transcription-factor forms; GCK exception noted). Added as 4th member of the Diabetes_Mellitus grouping. All evidence sourced from already-cached PMID:29931562 (Sanyoura 2018); all 24 snippets verified as exact substrings. Added MONDO:0018911 to the DiseaseTerm enum cache via scripts/refresh_disease_enum_cache.py. Schema, term, and reference validation all pass.

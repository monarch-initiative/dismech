  details: |
    Addresses the non-blocking suggestions from the approving ai4c-reviewer round on PR #10842. The entry was approved; these are quality fixes taken on top rather than blockers.

    Curation narration had leaked into three slots that should describe the disease rather than the edit. The disease-level notes opened 'Audiological management is now curated above' and went on to argue for its own curation decision; it now simply states that management follows general practice for autosomal dominant nonsyndromic sensorineural hearing loss and that no genotype-specific outcome data have been reported. The Hearing Amplification description ended '...it is curated because it is the actual management and because omitting it leaves the entry silent on what happens to these patients'; that rationale is removed and the clinical statement kept. The first pathophysiology node's description said 'This node describes the splice-site route specifically'; the same content is now stated as a fact about the disease - the splice-site route is not the only one reported, since a heterozygous missense allele would not disrupt a splicing signal at all.

    The Genetic Counseling evidence explanation said the cited sentence bears on 'prognosis and counseling'. The sentence says 'diagnosis, prognosis, and treatment'. The explanation now tracks the words actually quoted.

    Nothing was added or removed - no new claims, terms, references or edges. Validation: validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys clean; 22/22 snippets still verified.

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 37 (COL11A1, DFNA37)'
  details: |
    New Disease entry for MONDO:0032802 (hearing loss, autosomal dominant 37 / DFNA37).

    Naming: used the repository's established convention for this cluster, Autosomal_Dominant_Nonsyndromic_Hearing_Loss_37, matching the 14 existing Autosomal_(Dominant|Recessive)_Nonsyndromic_Hearing_Loss_N entries rather than the MONDO label form. The MONDO label and DFNA37 are kept as synonyms.

    Deep research: 'just research-disorder claude_code Autosomal_Dominant_Nonsyndromic_Hearing_Loss_37' (report and citations sidecar committed). Validation was clean - 9/9 references resolved, 1/1 quoted claim verified, confabulation_rate 0.0, 23/24 terms resolved. The single flagged naming artifact (UBERON:0001846 given as 'confirm', which is a text-extraction artifact rather than a real mislabel) concerns a term not bound in this entry.

    GeneReviews baseline: no GeneReviews chapter exists for DFNA37. A Stickler Syndrome chapter does exist (PMID:20301479) and was fetched during the search, but it covers the syndromic COL11A1/COL2A1 disorders rather than this nonsyndromic entity, so it is not the phenotype baseline for DFNA37 and is not cited; it was removed from the diff rather than cited loosely.

    Mechanism is curated as a chain: COL11A1 Canonical Splice-Site Disruption -> Aberrant Collagen XI Alpha-1 Transcript Processing -> Deficient Collagen XI in the Cochlear Extracellular Matrix -> Prelingual sensorineural hearing impairment. The final edge is typed INDIRECT_UNKNOWN_INTERMEDIATES, and the cochlear node's description says explicitly that the localisation is inferred from collagen XI's established auditory role rather than demonstrated in DFNA37 cochlear tissue, which is not obtainable.

    Central hypothesis (splice_specific_nonsyndromic_restriction, EMERGING): every reported DFNA37 lesion is splice-altering, and two independent families carry variants at the same intron 4 canonical acceptor as the index kindred while producing different splicing outcomes. This suggests the restriction to a nonsyndromic phenotype is tied to the splicing mechanism rather than to general COL11A1 loss of function - but no mechanism explaining the separation has been demonstrated, the candidate accounts (tissue-tolerated transcript consequence, tissue-specific isoform usage) are untested, and the alternative reading that mild syndromic features were missed in small families is not excluded. EMERGING rather than CANONICAL for those reasons, stated in the hypothesis description.

    PMID:30531810 ('Lessons learned from the DFNA37 gene discovery odyssey') was fetched but its cache entry has no abstract text, so it is not cited and was removed from the diff rather than cited without a verifiable snippet.

    Severity is deliberately not asserted as uniform: the index family had mild progressive loss with flat/U-shaped audiograms, while an independent case report describes bilateral moderate-to-severe down-sloping loss. Both are cited on the progressive-hearing-impairment phenotype and the description says severity is not uniform across reported families.

    A top-level note records that audiological management (hearing aids, cochlear implantation) follows general ADNSHL practice and that no DFNA37-specific outcome data were found, so none is asserted.

    Validation: 'just validate' passed with 20/20 snippets verified; 'just validate-terms' passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean. Three references fetched and committed (PMID:30245514, PMID:33169910, PMID:33605226). Incidental references fetched by the deep-research validator but not cited were removed from the diff.

  summary: Review DFNA37 splice evidence, clinical variability and current validity
  details: |
    Reviewed the complete DFNA37 entry, four prior history records and the matching Claude Code deep-research report (scientific narrative, bibliography, validation appendix and citation sidecar). No prior REVIEW and no overlapping PR among 124 open PRs at origin/main 2cce588e0a3. This genetic disorder is within the narrowed scope; infectious diseases and environmental diseases/poisonings remain excluded. Named-entity preflight passed for COL11A1, MONDO:0032802 and OMIM:618533.

    Regenerated PMID:30245514 as full XML and read the methods, results, discussion and relevant figure legends. Read the full PMID:33169910 paper through the publisher's web-readable page (https://onlinelibrary.wiley.com/doi/full/10.1002/humu.24136), including family phenotypes, minigene products, clone counts and discussion; PMID/DOI and full/epdf cache retrievals returned an abstract or 403. Its cached abstract is retained with explicit qualification of its de novo wording. Read full PMID:30531810 PDF, full PMID:38410152 XML including case 8 and Tables 1/2, full PMID:39443691 HTML methods/results/discussion and its primary supplementary Table S2 workbook, and the complete PMID:33605226 paper recovered from the University of Trieste repository. The nominal full_text_html PMID:33605226 cache contains only abstract/citation material; it was not mistaken for full text. The separate generated repository-PDF cache supplies actual full-paper quotes. Its generated title is the URL, so the publication identity is given in evidence explanations. Read PMID:32427345, 12527136 and 15141750 abstracts after full-text retrieval attempts, and checked the earlier cho-mouse abstract PMID:1952599 against the later negative auditory study. Did not import the research report's inaccurate claim that heterozygous cho mice have hearing loss.

    Read the live ClinGen assertion approved 2025-06-18 (SOP v11), including summary, evidence rows and non-scorable evidence. The panel manually changed calculated Strong to Moderate. It includes eight variants (three splice, three frameshift, two missense) in six publications; its count of 33 reported patients is not a uniform set of confirmed molecular diagnoses or a prevalence estimate. The pathogenic mechanism remains unclear. The assertion is cached through its public URL because direct CGGV retrieval was unsupported. All bibliographic titles were checked against generated cache metadata and publication content; generic URL titles are retained without hand-editing caches.

    Full-text findings materially change the entry. The original 48 subjects were genotyped relatives, not 48 affected carriers. Clinically postlingual loss and an age-zero regression intercept suggesting a congenital component are distinct observations. Raw cross-sectional deterioration was 0.2–0.8 dB/year, but only 0.25–1 kHz showed significant progression after presbyacusis adjustment; these are family-specific estimates. The later splice-site families include stable loss and one suspected de novo variant without confirmed paternity. The donor variant c.4338+2T>C (NM_080629.2) is c.4302+2T>C on the ClinGen NM_001854.4 transcript. One German acceptor family, not both German families, shares the intron-4 splice site with the original kindred.

    Separated physical intronic substitutions, minigene RNA effects, a hypothetical collagen-organization step and the organismal auditory endpoint. c.652-2A>C retains normal splicing alongside exon-5 skipping; c.652-1G>C uses cryptic acceptors with four/five-residue deletions; the donor variant mainly skips exon 57 with minor intron-retention products. These are expression-system results, not patient cochlear transcript proportions or measured protein abundance. Removed the asserted quantitative collagen deficiency/direct assembly edge and unsupported DECREASED function annotation. Used the verified specific collagen type XI trimer term. The proposed deleted residues 218–260 do not include the cited heparan-sulfate motif at 147–152; altered folding or binding remains hypothetical. Syndromic variants also commonly alter splicing, so splice class alone cannot explain nonsyndromic restriction. A missense annotation alone does not exclude a splice effect. The cho/+ functional-null model failed to reproduce the auditory endpoint on C57BL/6 at 2–10 months; this limits a simple dosage account without establishing dominant negativity for DFNA37. Developmental mouse cochlear expression is indirect anatomical support, not a patient matrix assay.

    The recovered Ciorba paper identifies p.His165Leu and segregation in four sequenced affected relatives, with no functional test. Twins had early hearing loss and received aids, while older relatives had postlingual loss; treatment use is not an outcome study. Ali et al. explicitly classified p.Pro1077Thr as VUS, with no maternal sample to establish origin; cochlear implantation at age four was reported without a variant-specific outcome. The Hao Table S2 XLSX was downloaded from the publisher's actual supplementary link and read without editing or exporting it (stdlib ZIP/XML extraction). Sheet Table S2, row 19 (case 12, c.3287delG/p.Gly1096Valfs*102) and row 28 (case 19, c.1191delT/p.Asn398Metfs*19) both have diagnostic audiometry NA, despite abnormal OAE/AABR screens; follow-up ages are 37 and 25 months. This agrees with the main text's nine confirmed cases, which exclude 12 and 19. Recorded those cases as screening observations, not confirmed congenital DFNA37 or penetrance data. Supplement: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41431-024-01711-x/MediaObjects/41431_2024_1711_MOESM3_ESM.xlsx . No supplemental table quote was fabricated into a reference cache.

    Mined the full Genetic Hearing Loss Overview (NBK1434) for clinical hearing-type definitions, diagnostic interpretation/VUS limits, habilitation, implantation, serial follow-up, noise precautions and reproductive counseling. General care is explicitly distinguished from DFNA37 efficacy. Replaced an unconditional 50% recurrence statement with allele transmission and family-specific counseling. Added the syndromic COL11A1 differential without importing its systemic manifestations as obligatory DFNA37 phenotypes. The Talebizadeh historical full paper explains a polymorphic poly-T deletion masking the original splice variant during forward Sanger sequencing, despite COL11A1 already being a candidate. Its retrospective cDNA observation is data not shown and is not treated as quantified cochlear RNA evidence. ClinicalTrials.gov API searches for DFNA37 and COL11A1 AND hearing loss returned zero studies on 2026-09-23; a parallel web search surfaced no disease-specific intervention. This is a bounded negative search, not a claim that future trials cannot exist.

    Eight-dimension research cross-check: phenotypes adequate with prelingual/postlingual and progressive/stable variation, no fabricated frequency or penetrance; subtypes N/A because no supported subdivision requires separate entities; pathophysiology adequate with atomic RNA/structure/clinical steps and an explicit unresolved mechanism; treatments/trials adequate with evidence-backed general care and no disease-specific intervention found; genetics adequate with current Moderate validity, splice outcomes, additional variant classes and differing case certainty; diagnostics/biomarkers adequate with age-appropriate audiology, broad testing, VUS interpretation, syndromic assessment and technical false-negative context, without inventing a biomarker; references adequate with primary-source follow-through and meaningful full-text use; overall consumption adequate, correcting the research report where primary evidence differs and retaining uncertainty instead of promoting predictions to results.

    Every reference cache was generated with just fetch-reference. No reference-cache Markdown was hand-authored and the frozen dataset-accessions JSON was not accessed. An unrelated DOI fetched during source discovery was identified by its title, never cited and excluded from staging, along with unused DOI/CAPTCHA caches. Schema/ontology, exact quotations, causal/entity links, qualifier terms, GeneReviews tagging, snippet boundaries, ratchets and staged hooks are being checked before PR creation. The PR history link will be added after the initial independent review completes. Formal author COMMENT, independent review and CI remain separate readiness gates.

    Final local validation passed: schema, ontology, 50/50 exact quotations, history, causal/entity links, qualifier terms, GeneReviews tagging/coverage, snippet boundaries, source-defect check and length/title/grading/reference-title ratchets. Staged hooks normalized YAML and generated-cache whitespace; the second run passed.

    Independent review round: changed three genetic caveats (unconfirmed newborn screening observations, the p.Pro1077Thr VUS classification and missing maternal testing) from SUPPORT to NO_EVIDENCE. Deep-copied the genetic evidence so the diagnostic screening-versus-confirmation evidence retains SUPPORT. Replaced the matrix-to-auditory edge's phenotype-only quotation with the ClinGen statement that pathogenic mechanism is unclear, tagged NO_EVIDENCE. Retained the Ciorba repository-PDF citation because PMID retrieval produced only abstract content and the generated PDF cache contains the actual quoted full text. Added the PR link in the same round.

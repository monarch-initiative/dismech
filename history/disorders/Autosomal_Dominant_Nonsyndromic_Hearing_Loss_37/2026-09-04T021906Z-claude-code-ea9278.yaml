  summary: Address PR review on DFNA37 (#10842) - correct an unsupported splice-only
    claim
  details: |
    Addressed both CRITICAL findings and three of four IMPORTANT findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #10842.

    CRITICAL 1 - the headline claim was wrong, and this is a curation error on my part, not a framing quibble. The hypothesis asserted 'Every reported DFNA37 lesion to date is splice-altering'. PMID:33605226, which this entry itself cites twice, reports a heterozygous COL11A1 missense variant attributed to DFNA37. The deep-research report had flagged it and I did not act on it. Corrected in all four places the premise appeared: the top-level description, pathophysiology[0].description, genetic[0].notes, and the hypothesis. The hypothesis_label was softened from an assertion to a possibility, and the missense case is now cited on the hypothesis as a supports: REFUTE evidence item with an explanation stating what follows if the attribution holds (the nonsyndromic restriction cannot be a property of splice-altering lesions as such) and the one reason it might not (the report does not characterise the variant functionally). The pathophysiology node now says explicitly that it describes the splice-site route and that the missense case does not pass through it. The earlier history record for this entry is append-only and was not rewritten; it records the claim as it stood, and this record supersedes it.

    CRITICAL 2 - just check-snippet-grading failed: the PMID:33169910 splicing-outcome sentence was graded IN_VITRO on the pathophysiology node and HUMAN_CLINICAL on the hypothesis. Unified to IN_VITRO in both places, since the quoted sentence reports a molecular characterisation result rather than a clinical observation. Root cause worth recording: check-snippet-grading is an ungated whole-KB CI step listed in CLAUDE.md and I did not run it before opening any of the five PRs in this run. It is now run for this file and is clean.

    IMPORTANT 3 - tagged PMID:20301607 'Genetic Hearing Loss Overview' in references: with tags: [GeneReviews]. The cache is a PubMed book stub with no quotable clinical text, so it is tagged rather than cited on any claim.

    IMPORTANT 4 - added a diagnosis: section and moved genetic testing into it from treatments:, where it did not belong. Two entries: COL11A1 on nonsyndromic deafness panels, and audiometric characterisation. Note a near-miss caught during this work: NCIT:C38048 looked like the audiometry term and is actually 'Vasovagal'. The correct binding is NCIT:C38036 Audiometric Test, which sibling hearing-loss entries already use. This is exactly the Named Entity Confusion the term contract warns about, and it was caught by verifying the CURIE rather than trusting the name.

    IMPORTANT 6 - added Hearing Amplification and Cochlear Implantation treatments, both therapeutic_modality DEVICE, using the device-qualifier pattern CLAUDE.md documents (bind the clinical action, carry the device as an NCIT:C16830 predicate-value qualifier) and matching Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104. Each carries an explicit caveat that no DFNA37-specific outcome data exist and a target_mechanisms link to the progressive hearing impairment phenotype. The blanket notes: line that previously justified omitting them was rewritten rather than deleted, so the reasoning is still visible.

    IMPORTANT 5 not addressed this round - model-organism evidence (Col11a2-KO tectorial membrane fibrils, cho/+ mice, PMID:15141750 cochlear expression). The reviewer correctly notes each PMID must be verified before citing and that the research itself flagged one as unresolved. That verification was not done in this round; adding the citations without it would repeat the mistake that caused CRITICAL 1. Left for a follow-up.

    Suggestions not taken this round: connecting the two remaining disconnected phenotypes, the leaky-splice-site genotype-severity model, the treatments[1] explanation over-read, and a mappings: block.

    Validation after changes: 'just validate' passes with 22/22 snippets verified; 'just validate-terms' passes; 'just validate-disorders' passes; 'just check-snippet-grading' reports no findings for this file; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values clean; check-qualifier-terms and check-qualifier-terms-online both confirm the four new device qualifier terms.

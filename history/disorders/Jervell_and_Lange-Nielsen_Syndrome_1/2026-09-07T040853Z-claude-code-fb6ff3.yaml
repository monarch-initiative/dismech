  summary: Correct LQT2 paper mislabelled as LQT1 in reference-accounting note
  details: |
    Post-approval correction of a factual error I introduced in the previous round. The top-level notes paragraph dispositioning the nineteen uncited reference caches grouped PMID:40794559 with PMID:20660394 and PMID:31245483 as 'heterozygous-LQT1' papers. PMID:40794559 is an LQT2 study (docosahexaenoyl glycine, an I_Ks activator, in long QT syndrome type 2); the other two are genuinely LQT1, PMID:20660394 on KCNQ1-mediated I_Ks and PMID:31245483 on a KCNQ1 M437V patient, both verified against their cached abstracts before rewording. Caught by the ai4c-reviewer on re-review, which flagged it as non-blocking and offered to let it stand. Fixed anyway: it is prose asserting a fact about a source, in committed content, and the substantive point it introduces about I_Ks activators and negative inotropy is a lead a future curator will act on, so the subtype label should not be wrong. The reword separates the LQT2 paper from the LQT1 pair and states explicitly that its relevance does not rest on its subtype. The push costs the standing approval, but the deterministic auto-merge sweep gates on age from PR creation rather than approval recency, so the cost is one re-review cycle and not merge delay. No evidence, binding, or curated claim changed; validation unchanged at 140/140 snippets verified.

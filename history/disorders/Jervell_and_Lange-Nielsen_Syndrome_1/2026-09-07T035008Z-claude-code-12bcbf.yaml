  summary: 'Review response: gene dosage, founder allele, discussions, two treatments'
  details: |
    Response to the ai4c-reviewer changes-requested review on PR #11285: one
    blocking finding and five suggestions, all taken, in one push.

    Blocking: gene-dosage and founder-allele genetics. The entry described
    which gene causes JLNS but not what dosage does, which is the axis that
    most defines a recessive channelopathy whose heterozygotes have their own
    named dominant disease. Added to the KCNQ1 genetic entry: a gene-dosage
    notes paragraph, the Swedish founder-allele contrast within a single
    variant (QTc 576 +/- 61 ms in homozygotes against 462 +/- 34 ms in
    heterozygotes, cumulative aborted cardiac arrest 47% against 1%,
    PMID:24552659), and the counterintuitive half from a 789-carrier series
    (PMID:38825991): heterozygous carriers of JLNS-causing alleles have LOWER
    cardiac-event risk than other LQT1 heterozygotes, hazard ratio 0.34. That
    second result is what recessiveness means at the channel level and is the
    basis for counselling a proband's carrier parents. Also added a Variant
    record for p.Arg518Ter (c.1552C>T) with the Swedish founder genealogy,
    shared haplotype across 17 of 19 families, and ~1:2000-4000 heterozygote
    prevalence.

    The reviewer observed that the Swedish gastric cohort (PMID:22805636) is
    very likely the same founder population as the R518X families. Neither
    paper states the overlap, so it is not asserted; it is recorded in the
    gene-level notes as a reason to read the gastric findings as
    characterized in a largely single-allele population.

    Suggestion 1, NOS1AP modifier (PMID:32061134). Added as
    relationship_type: MODIFIER with both evidence items graded INDIRECT and
    a notes paragraph stating the limitation plainly: the hiPSC cells carried
    a heterozygous LQT1 KCNQ1 A341V genotype and the complementary work used
    guinea-pig cardiomyocytes with pharmacologically mimicked LQT1. No NOS1AP
    effect has been shown in a JLNS patient. Curated as a lead for the
    variable arrhythmic expressivity JLNS shows at fixed genotype, not as an
    established determinant.

    Suggestion 2, KCNQ1 suppression-and-replacement gene therapy
    (PMID:33504163). Added as a treatment with therapeutic_modality:
    GENE_THERAPY, target_mechanisms RESTORES against the I_Ks-loss node, and
    heavy hedging: notes open "Not a therapy." Every cell line tested was
    heterozygous LQT1, so restoration was shown against one residual
    wild-type allele and not against the biallelic null state. Two things
    named as prerequisites before it means anything for JLNS: efficacy on a
    biallelic-null background, and in vivo ventricular delivery.

    Suggestion 3, discussions. Added the section, which the entry lacked.
    kind: HUMAN_MODEL_MISMATCH for the murine QT phenotype being
    extracardiac-dependent, attaching to both cardiac nodes and the mouse
    model, with two proposed_experiments (cross-species isolated-heart
    optical mapping; engineered heart tissue from the existing JLNS hiPSC
    lines). The rationale states the asymmetry the entry could not otherwise
    express: the same mouse is strong evidence for the cochlear arm and weak
    for the cardiac one. A second discussion, kind: KNOWLEDGE_GAP, records
    that the whole gastric arm rests on one 14-patient cohort with
    per-analyte denominators of nine and seven, and singles out the 9/9
    faecal calprotectin as unexplained by the parietal-cell mechanism.

    Suggestion 4, atrial pacing with beta-blockade (PMID:27451284). Added as
    a DEVICE treatment. The JLNS-specific detail that matters is preserved:
    six patients with atrial leads survived event-free at mean 6.9 years
    while the one patient given a ventricular lead died, which is what makes
    this an argument for atrial pacing specifically. Notes record that the
    series is nine patients, uncontrolled, that the lead-position comparison
    rests on a single patient, and that the paper's own title ends in a
    question mark.

    Suggestion 5, uncited reference caches. Added a notes paragraph
    dispositioning all nineteen by group: five overlapping cochlear-implant
    and deafness-screening series superseded by PMID:26205899, five
    potassium-cycling reviews superseded by PMID:20012478 and PMID:19491250
    (one of which, PMID:11223304, is a Kcne1 study and so JLNS2 territory),
    the non-English duplicate record of the cited Schwartz cohort, two
    single-family case reports, three heterozygous-LQT1 electrophysiology
    papers, and two LQTS-wide series covered by PMID:35331422. PMID:40794559
    is flagged as a live lead for a future round: it reports deleterious
    negative inotropic effects of I_Ks activation, which bears on whether
    channel activators could ever help a biallelic-null patient.

    Caught while responding, not raised by the reviewer: I had invented
    NCIT:C50097 as "Pacemaker Device" for the atrial-pacing device
    qualifier. It is Printed Circuit Board Device. `just
    check-qualifier-terms-online` caught it, which is exactly the blind spot
    dismech#10197 documents, since linkml-term-validator does not reach
    inside qualifiers and the offline gate only sees CURIEs cached from
    elsewhere. Corrected to NCIT:C94198 (Cardiac Pacemaker), and the
    treatment_term was upgraded from the generic NCIT:C15329 (Surgical
    Procedure) to NCIT:C80434 (Pacemaker Placement), found in the same
    lookup. Worth recording that the failure mode this entry's notes
    describe for the deep-research provider's suggestions is one I also
    committed by hand.

    Also corrected during this round: the uncited-reference count, which was
    written as twenty and became nineteen once PMID:29925535 was cited on the
    HUMAN_MODEL_MISMATCH discussion and its engineered-heart-tissue
    experiment. That paper argues the general form of the mismatch directly,
    that hiPSC-CMs help overcome animal-model limitations rooted in species
    differences in repolarization reserve.

    Not changed. The reviewer's cosmetic note about a `K+-diffusion` snippet
    where the source has `K(+)-diffusion` is pre-existing on main, the newly
    added copy is correct, and the reference validator accepts both, so it is
    left alone rather than mixed into a review response.

    Validation: just validate-disorders passes with 140/140 snippets
    verified. All offline gates pass, plus check-qualifier-terms-online and
    model-scale-audit --strict. 2915 targeted pytest cases pass. Compliance
    97.0%, down from 98.9% because the new sections add scored slots faster
    than they fill them; the remaining unfilled ones are datasets
    (deliberate), proposed-experiment datasets (future experiments have
    none), and divergence-level evidence, which is left empty rather than
    padded since a divergence is an argument about a model and not an
    empirical claim.

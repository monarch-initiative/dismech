  summary: 'Self-review corrections: Jervell and Lange-Nielsen Syndrome 1'
  details: |
    Adversarial self-review of the augmentation round in the preceding history
    record, run before opening a PR, and the corrections it produced. Fifteen
    findings, all content rather than validator findings: every gate was
    already green when the review started.

    Four were blocking, and one of them was a real defect rather than a
    grading quibble.

    1. On the I_Ks-loss to prolonged-QTc edge, the PMID:11226272 snippet had
    been cut one clause short, immediately before "but not in isolated hearts.
    These changes are indicative of cardiac repolarization defects that appear
    to be induced by extracardiac signals." The truncation removed the source
    contradicting the causal step being asserted, and the same file already
    curates that exact caveat in its animal_models block, where the link is
    graded PARTIALLY_RECAPITULATES. The snippet now runs through the caveat,
    the item is regraded INDIRECT, and the explanation says why and points at
    the hiPSC-cardiomyocyte model as the cell-autonomous evidence.

    2. PMID:41147441 on the variant-to-I_Ks edge was graded IN_VITRO on a
    sentence reporting a structural simulation, and the quote began
    mid-sentence, dropping "Although many variants exhibited normal cell
    surface expression consistent with protein stability", which scopes the
    finding to a subset. Regraded COMPUTATIONAL per the CLAUDE.md rule that in
    silico results are COMPUTATIONAL, snippet restored to the full sentence,
    explanation rewritten to say it covers the normally-trafficked subset and
    that the paper's wet-lab headline finding is cited on the trigger node.

    3. The PMID:15891643 conclusion sentence ("KCNQ1 channel dysfunction can
    lead to congenital deafness") supports the endpoints of the whole cochlear
    arm, not the spiral-ganglion-to-deafness link it was attached to as
    DIRECT. Regraded INDIRECT with the scope stated.

    4. An explanation read "associated with, and secondary to" where the
    abstract says only "associated". In a global knockout both structures see
    the same endolymphatic collapse, so co-occurrence is equally consistent
    with parallel loss. The "secondary to" was the curator's and is removed;
    the item is INDIRECT and now says the quote is consistent with the
    deafferentation account rather than establishing it.

    Systematic: seven mouse-derived edge items were graded directness: DIRECT
    while two other mouse items and one human item in the same round were
    INDIRECT, so the file graded human evidence as less direct than mouse
    evidence in adjacent blocks. CLAUDE.md puts a result from a non-human
    model system at INDIRECT. All MODEL_ORGANISM edge items are now INDIRECT;
    the four remaining DIRECT items are review or GeneReviews statements
    asserting the causal step about human JLNS.

    Six prose overstatements, each corrected against the source: "38 implanted
    JLNS children" became the nine reports that actually recorded an outcome;
    the LCSD QTc-below-500 biomarker was scoped to the 45-patient subgroup it
    was established in; both PMID:35331422 items were graded INDIRECT because
    the cohort is LQTS-wide with no JLNS subgroup, and the explanation now
    names the inference that places JLNS patients in the very-high-risk
    stratum; "the most severe variant" became "a most severe variant", which
    is what the abstract says; the claim that the hiPSC allele-class result
    explains heterozygous carrier Romano-Ward phenotypes is now marked as an
    extension the paper does not test; and the AAV rescue description now
    acknowledges the paper's reported ectopic expression rather than implying
    marginal-cell specificity.

    Three notes: corrections. One was outright false: the entry claimed seven
    suggested CURIEs named different concepts and that none was used, but the
    seventh is MONDO:0024540, whose reported mismatch is the report echoing
    the template placeholder "if available" as a label, and that CURIE is the
    entry's own disease_term. Now says six, and explains the seventh. The
    reference-validation summary paired "25 of 25 resolved" with "none off
    topic" without noting that only 16 of 25 were affirmatively on topic; the
    count is now given. The channelopathy_category note said no enum value
    covers a multi-organ epithelial-and-cardiac channelopathy, which is true
    but omitted that ChannelopathyOrganSystemEnum does offer `epithelial
    channelopathy` and that the strial and parietal-cell mechanisms are
    epithelial transport defects. The note now names that alternative and says
    why cardiac was chosen.

    Two placement corrections. The fourth progression phase, "Risk
    stratification within the syndrome", is not a temporal stage;
    ProgressionInfo.phase is, and the corpus convention is short stage labels.
    Its content and both evidence items moved to the ICD treatment, where the
    stratification actually drives the decision to implant early. The
    remaining three phase labels were shortened. The new prevalence record
    mixed two quantities: rate_per_100000 was one center's yield while
    rate_low/rate_high were the cross-series literature range, which put
    rate_low: 0.0 under prevalence_class: ABOVE_1_IN_1000. The bounds are
    removed, and the notes explain that no confidence interval is reported for
    the point estimate and that the 0 to 2.6% range describes spread between
    centers.

    The OBLIGATE call on Prolonged QTc was defensible but justified by the
    wrong thing: a mean of 557 +/- 65 ms describes severity, not penetrance,
    and GeneReviews itself hedges with "usually >500 msec". The note now cites
    the diagnostic criterion, which is the actual reason.

    Content gaps the review surfaced, now curated. PMID:22805636 had been
    mined only for anemia and gastrin: its title finding, mucosal
    hyperplasia/dysplasia in three of five endoscoped patients with coeliac
    and inflammatory bowel disease excluded, is added to the gastric node, and
    a new biochemical: block records the three measured analytes (gastrin 7/9,
    pepsinogen 6/7, faecal calprotectin 9/9) bound to NCIT:C74858,
    NCIT:C100122 and NCIT:C82005. The entry previously had no biochemical
    block at all. Calprotectin is recorded as an unexplained finding, since
    neutrophilic intestinal inflammation is not predicted by the
    parietal-cell mechanism and the cohort offers none. PMID:26205899 supplied
    two further items: its recommendation that all congenitally deaf patients
    get an ECG, added to the relative-screening diagnosis entry, which the
    prevalence note had been calling the argument for screening without
    citing it there; and its observation that auditory stimuli are a specific
    arrhythmia trigger, so implant processor activation should be done under
    cardiac monitoring, added to trigger avoidance. That last one is a trigger
    specific to this disease and to its own treatment.

    Not changed. The experimental_models block survived review intact -
    model_scale correct on all three links, the upward-extrapolating link's
    limitations substantive, both divergences genuine and specifically argued.
    The OBLIGATE call on hearing loss stands. The gene-therapy theme in the
    committed report (suppression-and-replacement, and the point that I_Ks
    activators cannot rescue a null channel) was not curated this round; the
    AAV1-Kcnq1 mouse already sits in animal_models, and this is left as the
    largest identified remaining gap.

    Validation after corrections: just validate-disorders passes with 126/126
    snippets verified. All offline gates re-run and pass, including
    check-term-cache-integrity and check-cache-order after three NCIT
    biomarker terms entered the cache. Compliance 98.9%.

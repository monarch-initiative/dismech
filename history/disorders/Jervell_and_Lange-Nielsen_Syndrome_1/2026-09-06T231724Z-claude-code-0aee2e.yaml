  summary: 'Augment: Jervell and Lange-Nielsen Syndrome 1'
  details: |
    Augmentation round on an existing, already-merged entry (created 2026-08-17
    from a falcon deep-research report). Compliance moved from 94.1% to 98.8%.

    Deep research. A falcon report for this disease already existed and had been
    consumed by the original curation; re-running falcon writes to the same path
    and would have overwritten that provenance, so a second provider
    (openscientist) was run instead. Two concurrent invocations of that run
    raced and the later one overwrote the earlier at the same path. Only the
    later report is committed, and both its Reference Validation and Term
    Validation sections were regenerated against its own body after the
    overwrite was discovered, so the committed sections describe the committed
    text. Consequence worth stating plainly: PMID:25453094, PMID:35331422 and
    PMID:26205899 were surfaced by the overwritten run and are not in the
    committed report; PMID:22805636 is in both. All four were independently
    fetched from PubMed, cached, and exact-quote verified here, so the evidence
    rests on the primary records rather than on the report, but the committed
    report is not a complete provenance trail for this round. This is recorded
    in the entry's notes as well.

    Report validation results, read before use. The committed openscientist
    report resolves 25/25 references, 20/20 quoted claims found in source, none
    off topic. Its term suggestions were largely unusable and none was taken:
    seven CURIEs name entirely different concepts (UBERON:0002215 offered for
    stria vascularis is synchondrosis; UBERON:0002228 for spiral ganglion is
    rib; CL:0000710 for strial marginal cell is neurecto-epithelial cell;
    UBERON:0007499 for endolymph is epithelial sac; HP:0011473 for achlorhydria
    is Villous atrophy; HP:0003637 for hypergastrinemia). The overwritten run
    additionally offered NCIT:C2438 for beta-blockers (RAS Peptide Cancer
    Vaccine) and NCIT:C50072 for an ICD (Modem Device). preflight-dr returned
    WARN on both runs for the same benign reason the entry already documents
    (KCNE1/JLNS2 is reviewed alongside KCNQ1 throughout this literature); the
    committed run's OMIM citation matches MONDO:0024540's 220400.

    What was curated.

    1. Causal-edge evidence. All ten pathophysiology downstream edges were
    uncited (downstream[].evidence was 0/10 in the compliance report). Each now
    carries causal_link_type and evidence chosen to support the edge rather
    than either node: the Kcnq1-null mouse for gene-to-endolymph and for
    I_Ks-to-QT ("gross morphological anomalies because of the drastic reduction
    in the volume of endolymph"), PMID:15891643 for the cochlear chain,
    PMID:19491250 for the gastric chain, GeneReviews for QTc-to-tachyarrhythmia
    and tachyarrhythmia-to-death. Rescue results (PMID:26084842) are marked
    directness: INDIRECT because they support the edge in the reverse
    direction.

    2. classifications: added. CARDIOVASCULAR + DISORDER_OF_EAR +
    GENETICS_ENVIRONMENT_DISEASE, each with its own evidence, plus
    channelopathy_category: cardiac channelopathy. mechanistic_category was
    deliberately left empty - no MechanisticCategoryEnum value fits a
    channelopathy, and the skill says to omit rather than force one. The
    channelopathy slot is single-valued and JLNS1 is not confined to the heart,
    so the note records that the assignment is the clinical classification, not
    the extent of the channel defect.

    3. Phenotype frequency on three phenotypes. Congenital deafness and
    prolonged QTc are OBLIGATE because GeneReviews makes both required
    diagnostic criteria; biallelic KCNQ1 genotypes that spare hearing are
    recessive LQT1, not JLNS, which is what makes the deafness obligate within
    this entry rather than merely very frequent. Sudden cardiac death is
    FREQUENT from ">half of untreated children die before 15". Torsade de
    pointes, ventricular fibrillation, bradycardia, seizure-like episodes and
    achlorhydria were left without a frequency: no source states one, and
    guessing is worse than absence.

    4. progression: added (4 phases) - early-childhood onset, adrenergic
    trigger dependence, untreated childhood mortality, and within-syndrome risk
    stratification (QTc >550 ms, first-year syncope, sex, with effect sizes).

    5. clinical_burden: HIGH, with the argument that the two burdens interact
    rather than merely coexist: cochlear implantation requires general
    anesthesia in a child with a markedly prolonged QT, and PMID:32508908
    records a life-threatening arrhythmia at exactly that point.

    6. experimental_models: added - the entry previously had animal_models but
    no non-animal model. The hiPSC-cardiomyocyte JLNS panel (PMID:25453094) is
    the only place the cardiac lesion is observed in human cells. Three
    modeled_mechanisms links: MOLECULAR (allele-class resolution, amorphic vs
    dosage-dependent), CELLULAR (I_Ks loss, scale-aligned), and a deliberate
    upward extrapolation to the TISSUE-scale arrhythmogenic substrate node,
    which carries limitations plus typed SCALE_EXTRAPOLATION and
    BOUNDARY_OMISSION divergences. just model-scale-audit --strict passes.

    7. Primary sources replacing or backing summary ones. The gastric arm was
    GeneReviews-only; PMID:22805636 is the complete Swedish
    double-KCNQ1-mutation cohort and states the causal claim in humans
    ("secondary iron-deficiency anaemia owing to hypochlorhydria on the basis
    of KCNQ1 mutations"). Iron-deficiency anemia was left at FREQUENT rather
    than raised to VERY_FREQUENT on 12/14, because that is a single
    14-patient series and the only cohort ever screened for it; the reasoning
    is in the phenotype notes. LCSD gained PMID:35331422, where the
    JLNS-relevant number is not the headline 86% event-rate reduction but the
    very-high-risk subgroup, of whom only 17% became asymptomatic. Cochlear
    implantation gained PMID:26205899, which balances the single adverse case
    already cited with 38 pooled implanted JLNS children and uneventful
    surgery under precautions. That paper also supplied a second prevalence
    record: 0.79% among 503 congenitally deaf implant candidates, curated
    separately from the worldwide estimate with a note that the two are not
    comparable, since that three-orders-of-magnitude enrichment is the whole
    argument for ECG screening of deaf children.

    8. Removed a stale "(partial)" in an Achlorhydria explanation - a leftover
    reference to the retired PARTIAL evidence grade (dismech#10003 prose rot).

    No datasets: block. This is a deliberate omission, not an oversight, and
    is the one slot still at 0% compliance. GEO has nothing on JLNS: the
    string "Jervell" returns zero hits in gds, and just discover-datasets
    returned only GENE_ONLY KCNQ1 hits about unrelated biology - GSE168245
    (beta-cell development), GSE161051 (placental imprinting in hybrid mice),
    GSE121578 (a heterozygous LQTS/Beckwith-Wiedemann imprinting case, n=2).
    All resolve and none is about this disease; that is the Named Entity
    Confusion pattern CLAUDE.md warns about reaching through gene-based
    dataset search. Curating one to move a compliance number would have been
    the failure mode, so none was.

    Validation. just validate passes with 120/120 snippets verified against
    cached references. just validate-disorders (the batched gate CI runs)
    passes. check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence and model-scale-audit --strict all pass.
    check-source-defect-claims flags nothing in this file.

  summary: 'Follow-up #9787: correct notes left asserting the old Rehabilitation binding'
  details: |
    Third pass on the cochlear-implantation term sweep, after the second review of PR #9917.

    The term swaps in the previous commit landed but two accompanying notes were not updated, so they asserted the binding was deliberately NCIT:C15315 Rehabilitation while the block visibly bound NCIT:C15329 Surgical Procedure. That is structurally the same defect this PR opened to fix - descriptor and binding disagreeing inside one block - moved from preferred_term into notes, and worse in one respect: the original mismatch let a reader see both halves and infer which was wrong, whereas a note claiming the term is deliberate leads a reader to conclude the term is the error and revert it. The two also propped each other up, since ARNSHL_104's note cited Jervell_and_Lange-Nielsen_Syndrome_1 as the convention while that entry's note was stale too.

    Both rewritten on the corrected Dominant_Deafness-Onychodystrophy_Syndrome wording: keep the NCIT:C157820 device-versus-action paragraph, state that the bound action is the surgical one, and record what the earlier version bound rather than silently deleting the claim.

    Swept the whole KB for the same shape afterwards rather than trusting the two reported. The only other file whose notes mention a generic Rehabilitation action is AFG2A-Related_Encephalopathy, where the note is accurate - it binds NCIT:C15315 for a hearing habilitation treatment, which genuinely is rehabilitation. No further instances.

    Non-blocking suggestion taken, and it improved the fix: Labyrinthitis and Otofacial_Neurodevelopmental_Syndrome already attach the device as a qualifiers predicate-value pair (NCIT:C16830 Medical Device as predicate, NCIT:C157820 Cochlear Implant as value) alongside the surgical action term. That validates today and keeps the device concept queryable, which a free-text preferred_term cannot. Added to both entries here, and named in CLAUDE.md as the higher-fidelity option rather than only mentioning preferred_term. Also softened the CLAUDE.md wording from 'fails validation' to 'cannot be the term: of a TreatmentTerm', which is the precise claim.

    Non-blocking suggestion taken: MERRF_Syndrome now records in notes why it keeps NCIT:C49236 - the treatment covers amplification or implantation and leads with the non-surgical option, so a surgical term would misdescribe half of it. Previously that reasoning existed only in a history record, where the next sweep would not see it, which the new CLAUDE.md rule specifically asks against.

  summary: 'Follow-up #9787: finish the cochlear-implantation term sweep after review'
  details: |
    Second pass on the cochlear-implantation term sweep, after review of PR #9917 showed the first census undercounted by more than half.

    The first census used a grep over top-level treatments only and reported seventeen cochlear-implantation treatments. Walking the YAML properly - treatments plus has_subtypes[].treatments - gives forty-four with 'cochlear' in the treatment name: NCIT:C15329 x33, NCIT:C15315 x5, NCIT:C15747 x3, NCIT:C49236 x1, and two with no treatment_term at all. Three instances of the exact defect the first pass called 'the only clear defect' were left standing, all named plainly Cochlear Implantation and all bound to NCIT:C15315 Rehabilitation.

    Fixed to NCIT:C15329 with preferred_term 'cochlear device implantation': Charcot-Marie-Tooth_Disease_Type_X (which had both traps - the term said Rehabilitation and the preferred_term echoed it), Dominant_Deafness-Onychodystrophy_Syndrome, and Jervell_and_Lange-Nielsen_Syndrome_1.

    DDOD's notes additionally cited a precedent that does the opposite: it justified Rehabilitation as 'following the pattern already used in Jervell_and_Lange-Nielsen_Syndrome_1 and CAPOS_Syndrome', but CAPOS binds NCIT:C15329. Rewritten to keep the correct NCIT:C157820 reasoning while dropping the wrong precedent claim.

    Renal_Tubular_Acidosis_Distal_2: preferred_term 'supportive care' to 'hearing amplification and cochlear implantation'. Same shape as the Aminoglycoside-Induced_Hearing_Loss fix in the first pass - the bundle leads with non-surgical amplification so NCIT:C15747 stands, but the preferred_term was carrying no information.

    CAPOS_Syndrome: preferred_term 'surgical procedure' to 'cochlear device implantation'. The term was already right; the preferred_term echoed its label, which is the second trap the CLAUDE.md rule names.

    Examined and deliberately left: MERRF_Syndrome binds NCIT:C49236 for 'Hearing aids or cochlear implantation', where the preferred_term is already specific and the bundle leads with aids. Keratoderma_Hereditarium_Mutilans and Mandibulofacial_Dysostosis_with_Microcephaly have no treatment_term at all - a different defect (absence rather than wrongness), out of scope for this sweep and reported in the PR body rather than silently skipped.

    CLAUDE.md corrections from the same review: the new cross-reference pointed at a heading that does not exist in this repo, retargeted to the real 'Ontology Term Contract' section; and the preferred_term rule as first written ('must not just echo the ontology label') contradicted .claude/skills/dismech-terms/SKILL.md, which recommends the canonical label when no extra nuance is needed. Narrowed to the claim the evidence actually supports - that echoing loses information when the binding is broader than the treatment - with the Pharmacotherapy case named explicitly as correct.

    Worth noting for the next curator: the NCIT:C157820 reasoning has now been found independently re-derived in five separate entries, CAPOS_Syndrome's treatment description among them. That is what the CLAUDE.md rule is for.

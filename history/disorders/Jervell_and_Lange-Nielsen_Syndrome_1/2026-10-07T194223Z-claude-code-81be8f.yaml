  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    On the resting ECG row, bound LOINC:8636-3 Q-T interval corrected and recorded the JLNS risk-stratification cut-off of 550 ms as a reference range, cited to Schwartz et al. 2006 (PMID:16461811, QTc above 550 ms an independent predictor of cardiac arrest or sudden death) and Goldenberg et al. 2006 (PMID:16911578, baseline QTc at or above 550 msec); the inclusive/exclusive difference is stated in the range notes. No JLNS diagnostic QTc cut-off is recorded: GeneReviews gives usually above 500 msec as a description, and the LQTS guideline cut-off belongs to Long_QT_Syndrome. Added a Pure-Tone Audiometry row (NCIT:C38036) binding LOINC:89015-2 without bands, cited to GeneReviews PMID:20301579 and Niaz et al. 2011 (PMID:22830134).

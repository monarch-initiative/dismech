  summary: 'Create: Jervell and Lange-Nielsen Syndrome 1 (KCNQ1)'
  details: |
    Created new disorder entry for Jervell and Lange-Nielsen syndrome 1 (MONDO:0024540, OMIM:220400, KCNQ1), the biallelic-KCNQ1 subtype of JLNS, resolving issue #8743. Deep research performed via 'just research-disorder falcon Jervell_and_Lange-Nielsen_Syndrome_1' (research/Jervell_and_Lange-Nielsen_Syndrome_1-deep-research-falcon.md); reference validation in the report showed 8/8 references resolved, 0 unresolved, confabulation_rate 0.0. Ran 'just preflight-dr' against MONDO:0024540: verdict WARN because KCNE1 (JLNS2's causal gene) is discussed alongside KCNQ1 throughout the shared JLNS literature (both genes cause the same clinical syndrome and are reviewed together in GeneReviews and the Schwartz 2006 187-patient cohort); the report itself explicitly scopes JLNS1/KCNQ1 vs JLNS2/KCNE1, and only KCNQ1-attributed genetic/mechanistic claims were curated -- documented as a note on the entry. GeneReviews baseline used (PMID:20301579, tagged in top-level references). Pathophysiology models a KCNQ1 loss-of-function trigger branching into three chains: cardiac I_Ks loss -> prolonged QTc/arrhythmogenic substrate -> torsades/VF -> syncope/SCD (conforms_to cardiac_ion_channel_repolarization module nodes); stria vascularis K+-secretion loss -> organ of Corti hair-cell degeneration -> spiral ganglion degeneration -> congenital profound SNHL (conforms_to sensorineural_hair_cell_loss module nodes); and gastric parietal-cell K+-recycling loss -> achlorhydria/hypergastrinemia/iron-deficiency anemia (no existing module target). Added 10 phenotypes, genetic (KCNQ1, CAUSATIVE, ~90 percent case-fraction of JLNS), autosomal-recessive inheritance block, structured prevalence (1 in 1,000,000 to 1 in 200,000 worldwide), 6 treatments (beta-blocker, ICD, LCSD, cochlear implantation with the documented NCIT Cochlear-Implant-is-a-device gap workaround, QT-drug/trigger avoidance, genetic counseling), and 2 animal models (Casimiro 2001 Kcnq1-null mouse; Chang 2015 AAV1-Kcnq1 gene-therapy-rescue mouse) with modeled_mechanisms/readouts. Key PMIDs: 9020846 (Neyroud 1997, original KCNQ1-JLNS discovery), 16461811 (Schwartz 2006, 187-patient natural history), 33498651 (Oertli 2021, residual-function/gene-dosage mechanism), 41147441 (Pan 2025, variant functional characterization), 19491250 (Song 2009, KCNQ1 gastric K+ recycling), 11226272 (Casimiro 2001, Kcnq1-null mouse model), 26084842 (Chang 2015, AAV gene-therapy rescue), 15891643 (Rivas and Francis 2005, inner-ear histopathology), 29037160 (Uysal 2017, case series with bradycardia and seizure phenotypes), 32508908 (Qiu 2020, prevalence and anesthesia-trigger case), 37872640 (Josephs 2023, CardiacG2P structured gene-disease curation). Validated: just validate (schema plus terms plus references, 57/57 snippets verified), just count-verified-snippets, just check-duplicate-keys, just validate-disorders (full pre-PR batched sweep, passed clean), and targeted pytest -k selection (4160 passed) covering module conformance and foreign-key tests.

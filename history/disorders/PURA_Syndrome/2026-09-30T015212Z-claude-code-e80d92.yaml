  summary: 'Create: PURA_Syndrome'
  details: |
    New entry for PURA-related neurodevelopmental disorders under MONDO:1060108 (synonym PURA syndrome), with the intragenic-variant form (MONDO:0014512, MRD31) and the 5q31.3 microdeletion form (MONDO:0017811) as subtypes. No prior entry, stub, claim issue or PR existed for any of the three terms.

    Deep research: falcon was requested but failed authentication (HTTP 403), and the recipe's --fallback produced research/PURA_Syndrome-deep-research-openscientist.md. That report's 15 references all resolved. Its term section flags mislabelled CURIEs, including HP:0100585 offered for hiccups (it is Telangiectasia of the skin) and MONDO:0014601 offered as PURA syndrome (it is an unrelated ataxia); neither was used. just preflight-dr returned SKIP against MONDO:1060108 because the grouping term records no causal gene, and PASS against the child MONDO:0014512 (PURA, OMIM:616158).

    The GeneReviews chapter (PMID:28448108) is the phenotype baseline and is tagged; its clinical-characteristics features are all represented. Phenotype frequencies come mainly from the 54-patient Reijnders 2018 cohort (PMID:29097605), the 142-patient Johannesen 2021 epilepsy cohort (PMID:34790866) and the 230-patient 2025 systematic review (PMID:39824548). The causal chain runs from PURA haploinsufficiency to P-body loss, transcriptional dysregulation, impaired postnatal neuronal development (knockout-mouse evidence) and a neuromuscular junction component; the NMJ-directed pyridostigmine and salbutamol reports are recorded with their mixed results. The two independent Pura-null mouse lines disagree on precursor proliferation (PMID:12972605 absent, PMID:22010047 prolonged); both are recorded, the latter as REFUTE.

    An independent review pass found and led to fixes for: a knockout citation that contradicted its node, a walking snippet that argued against its phenotype (moved to Delayed ability to walk), missing dysmorphism, delayed myelination, dysphagia and delayed puberty phenotypes, a missing diagnosis block, over-broad RNS and diet terms, a mixed-source evidence item, and uncited causal edges.

    Validation: just validate, validate-terms, count-verified-snippets (97/97), check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading, check-coarse-phenotypes, check-folded-hyphens and check-genereviews (TAGGED) all pass. Background from the PURA Syndrome Foundation FAQ (purasyndrome.org) was read for coverage but is not cited, as it carries no citable identifier.

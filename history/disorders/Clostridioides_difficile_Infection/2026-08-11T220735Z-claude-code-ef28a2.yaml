  details: |
    Backfill for issue #8085. Two links, both PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, and in both cases the grade reflects a gap in this entry's graph rather than weak evidence. Healthcare facility exposure points at the spore adherence node because that is where this pathograph begins; the entry models what spores do once they arrive and not how they arrive, so the step between a contaminated surface and the epithelium is real but unmodelled. Proton pump inhibitor and other host risk factors point at loss of colonisation resistance as the nearest available node, and the link description states the mismatch rather than hiding it: that node models resistance conferred by the microbiome through nutrient competition and bacteriocins, whereas gastric acid is a different barrier, and the cited sentence is a risk-factor enumeration containing no mechanism at all. Both gaps are the same shape as the scope mismatches recorded in issue #8302: the environmental block naming something the pathophysiology block does not model. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 73 of 80 with 7 pre-existing DOI-prefix skips, none on items added here.

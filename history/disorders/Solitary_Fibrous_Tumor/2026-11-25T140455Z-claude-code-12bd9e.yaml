  summary: 'Solitary_Fibrous_Tumor: add perineurioma as a differential diagnosis'
  details: >-
    Added soft tissue perineurioma as a differential diagnosis of solitary fibrous tumor, bound to
    MONDO:0015031 extraneural perineurioma, with seven evidence items: from the STAT6 study
    (PMID:24030747), soft tissue perineurioma named among the benign tumors SFT may resemble, CD34
    common in both, EMA in 20 to 30% of SFTs, nuclear STAT6 in 59 of 60 SFTs, the one STAT6-negative
    SFT (malignant, with a NAB2-STAT6 fusion), and none of 10 soft tissue perineuriomas positive;
    and, from the 81-case soft tissue series (PMID:15958848), EMA in all tumors of the series. It
    parallels the Solitary fibrous tumour row of the Perineurioma entry, with the same grading for
    shared quotes, and adds three items: the resemblance sentence, the STAT6-negative SFT and the
    EMA figure for perineurioma; the new prose uses this entry's spelling and key order. One row
    added to the disease-term enum cache; no new reference cache files. just validate,
    validate-terms and count-verified-snippets pass.

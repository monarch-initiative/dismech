  summary: >-
    Reviewed Solitary_Fibrous_Tumor: added synonyms and harrisons_chapter
    classification, grounded fusion and malignant pathophysiology nodes with
    genes and molecular functions, added downstream edges to Soft Tissue Mass,
    Hypoglycemia, and Distant Metastasis, added the Distant Metastasis
    phenotype, added TERT and TP53 genetic entries and Meningioma differential,
    expanded evidence on Soft Tissue Mass, Hypoglycemia, and Big-IGF-II, and
    tagged background quotes with quote_role: BACKGROUND.
  details: >-
    1. Added top-level synonyms and classifications.harrisons_chapter
    (ONCOLOGY_HEMATOLOGY) backed by PMID:23313954. 2. Added NAB2 and STAT6
    genes and GO:0003700 (DNA-binding transcription factor activity,
    GAIN_OF_FUNCTION) to NAB2-STAT6 Fusion Oncogene; added TERT and TP53 genes,
    GO:0003720 (telomerase activity, INCREASED) molecular function, and
    TERT-promoter mutation evidence (PMID:31321477) on Malignant Transformation
    via TP53/TERT. 3. Added downstream causal edges to Soft Tissue Mass, Hypoglycemia, and Distant Metastasis (PMID:40354004), and
    added the Distant Metastasis phenotype (HP:0002664, NO_HPO_TERM) scoped to
    Malignant SFT. 4. Added extra evidence on Soft Tissue Mass, Hypoglycemia,
    and Big-IGF-II (PMID:38441351), and tagged background quotes with
    quote_role: BACKGROUND. 5. Added TERT promoter mutation and TP53 mutation
    entries to genetic (PMID:31321477) and added the Meningioma differential
    diagnosis entry backed by PMID:40354004 and PMID:26722515.

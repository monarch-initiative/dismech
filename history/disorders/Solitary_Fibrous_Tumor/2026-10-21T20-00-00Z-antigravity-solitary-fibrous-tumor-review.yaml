  summary: Reviewed Solitary_Fibrous_Tumor, added literature-backed evidence to classifications, refined pathophysiology and genetic driver links, connected Malignant Transformation via TP53/TERT to Distant Metastasis, added treatment target_mechanisms, and aligned snippets and differential diagnosis claims with cached references.
  details: 1. Added literature-backed evidence (PMID:23313954) to classifications.harrisons_chapter (ONCOLOGY_HEMATOLOGY). 2. Added NAB2 and STAT6 genes and GAIN_OF_FUNCTION modifier on GO:0003700 to NAB2-STAT6 Fusion Oncogene; added TERT and TP53 genes, TERT-promoter mutation evidence (PMID:31321477), and a downstream edge to Distant Metastasis (PMID:40354004) on Malignant Transformation via TP53/TERT. 3. Added the Distant Metastasis phenotype (PMID:40354004) and replaced the unsupported PMID:42149317 evidence on Dyspnea with explanatory notes. 4. Added a separate NAB2 (hgnc:7627) somatic fusion partner entry in genetic and corrected verbatim snippets on CD34 Expression (PMID:26722515), Big-IGF-II (PMID:38441351), and TERT promoter mutation (PMID:31321477). 5. Calibrated the Meningioma differential diagnosis description and distinguishing_features to match PMID:40354004 and PMID:26722515. 6. Added target_mechanisms to Antiangiogenic Therapy (Fibroblastic Proliferation) and Somatostatin Analogue Therapy (Paraneoplastic Big-IGF-II Secretion (Doege-Potter Syndrome)).

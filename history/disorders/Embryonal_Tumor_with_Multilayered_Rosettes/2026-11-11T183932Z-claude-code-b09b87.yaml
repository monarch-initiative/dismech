  details: |
    Two rounds of findings, from the repository reviewer and from an adversarial source re-verification run before the push. The reviewer's two critical items are fixed. The let-7 convergence node had no cached source mentioning let-7 at all; PMID:24311633 is now fetched and cited, giving both the state and the LIN28 knockdown. A treatment section is added - resection, adjuvant chemoradiotherapy, the P-HIT carboplatin/etoposide regimen with tandem high-dose chemotherapy, and two preclinical strategies - and the notes paragraph that justified its absence by calling the cached sources molecular and diagnostic was false and is gone. LIN28A immunohistochemistry is added to diagnosis. The re-verification found a systematic defect the reviewer had not reached: the entry's most specific cell-biology claims rested on the deep-research report rather than on any cached source. None of the words primate, placenta, apical, ventricular zone, radial glia, hierarchy, truncating, hotspot, RNase III, cortical or grade 4 occurs in any of the eight cached files. All of those claims are removed. The cell of origin is rebound from CL:0000681 radial glial cell to CL:0011020 neural progenitor cell, which the nestin result supports, and the cell of origin still derives from the single somatic genetic_context. The node named for an arrest of apical radial glial progenitors is renamed Entrapment of an Early Neural Lineage Network, which is what its source says, and every bare target naming it was updated. Four causal edges that cited an existence quote while graded DIRECT are regraded or requoted, the let-7 node now records the authors' own strength - consistent with a functional Lin28/let-7 axis - rather than asserting causality the experiment does not test, two evidence_source values are corrected, and the mixed human/in-vitro/xenograft sentence is graded OTHER in all three places it appears.

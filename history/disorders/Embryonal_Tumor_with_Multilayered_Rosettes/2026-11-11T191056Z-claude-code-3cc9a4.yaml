  details: |
    The repository reviewer's two critical items plus 29 findings from two adversarial source re-verification passes, split by axis. The reviewer: the let-7 convergence node had no cached source mentioning let-7, so PMID:24311633 was fetched and now carries both the state and the LIN28 knockdown; a treatment section was added and the notes paragraph calling the cached sources molecular and diagnostic was false and is gone; LIN28A immunohistochemistry was added to diagnosis. The evidence pass found three claims this entry's own review_notes said had been removed and which were still in the file - WHO grade 4, the pseudostratified neuroepithelium, and the truncating/RNase IIIb allele architecture - so the note was false about the file it sits in; all three are now gone and the note no longer enumerates removed words, which had kept them greppable. It also found four causal edges citing an existence quote while graded DIRECT, two wrong evidence_source values, a sentence summarising primary-tumour data graded IN_VITRO, two items graded IN_VITRO on a sentence naming no experimental system, an unhedged mechanism the paper hedges, and a series described as molecularly confirmed when it was histopathologically confirmed with molecular confirmation in 20 of 35. The bindings pass found the TTYH1 promoter claim unsourced - no cached source says TTYH1 supplies the promoter or that any promoter is active in neural progenitors - a preferred_term asserting the causal placement its own node disclaims, the entrapment node's bindings naming a population its description says is unknown, relationship_type RISK_FACTOR on a biallelic inactivation where the schema defines that value as neither necessary nor sufficient, an unsourced silencing claim, an unsourced frequency ranking, an age claim stronger than any source, an unsourced mechanism gloss on the BET row, a CURIE in prose that no gate reaches and no local build can resolve, session narration in notes and explanations, and the ambiguity of the phrase the cached series between two cached cohorts. All fixed. The derived cell of origin is now stated honestly as resting on a tumour-cell marker rather than on any cell-of-origin claim. Coverage taken from the same passes: an incidence record, a metastasis-at-diagnosis progression phase, the location distribution, and the other cohort's tested null on radiotherapy, which points the other way from the first cohort's association and is recorded beside it rather than reconciled. Left for a follow-up and stated in the PR: an experimental_models record for the BT183 line, and an RBL2 node with its gene binding.

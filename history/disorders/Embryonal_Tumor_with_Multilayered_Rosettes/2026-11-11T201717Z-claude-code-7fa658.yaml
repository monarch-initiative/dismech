  summary: 'Review round 2: histopathology, the ETMR trial, named chemotherapy agents'
  details: |
    Round 2 of review on #17065. The three items the reviewer asked for, plus both suggestions, in one push. (A) A histopathology section with three findings - the ependymoblastic multilayered rosettes, high mitotic activity and tumour necrosis - each quoting PMID:41664204, and the two treatment-row snippets trimmed to their first sentence, since the histology half of that run-on sentence never supported the surgery or radiotherapy claims and now has its own graded home. (B) PNOC031 added to clinical_trials as NCT06861244, with the registry summary quoted and its phase and recruitment status read from the ClinicalTrials.gov record rather than from the cached summary, which carries neither. (C) Carboplatin and etoposide named as CHEBI therapeutic agents on the chemotherapy row. The median overall survival of 19 months added as a second progression record, and the DICER1 to R-loop edge regraded from HUMAN_CLINICAL to OTHER because inducing instability by removing DICER1 function is an experiment and the cached abstract names no system for it. Two read-only verifiers were run in parallel against the diff, split by axis, and between them found six things, all corrected before the push. The rosette finding was first bound to HP:0031925 Rosette under a note claiming no ontology had a term for a multilayered rosette; that note was false, because the NCIT search it cited was read through head -12 and the C359xx morphology family sorts after the C1xxxxx disease terms. NCIT:C35946 Multilayered Rosette Formation exists, sits under both source nodes of the HistopathologyFindingTerm enum, and is what Ependymoma and Ewing_Sarcoma already use from that family, so the finding is bound to it and the note is gone. The trial description called the P-HIT cohort retrospective, where its own abstract contrasts it with retrospective cohorts and the entry repeats the word prospective in six other places. The review_notes said eight cached references where there are now nine, and did not carry the one exception to its own rule. The necrosis evidence item was graded DIRECT on a quote that establishes only that necrosis was prognostically adverse, so it is now INDIRECT; the mitotic row keeps DIRECT because it has a second quote that asserts the finding itself. Two descriptions read the source's word consistently as a universal and now do not. One limitation is stated rather than papered over: none of the three histopathology findings reaches the pathograph, because findings decorate nodes by name or term match and no node name matches.

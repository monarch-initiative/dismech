  details: |
    New entry on MONDO:0958119, built from a fresh claude_code report run with --no-cache after the user lifted this row's hold; nothing from the stopped run was reused. The pathograph follows the three driver lesions to their convergence: C19MC amplification fused to TTYH1 places a placenta-restricted microRNA cluster under a neural-progenitor promoter, which de-represses an embryonic DNMT3B isoform on one branch and feeds the C19MC-LIN28A-MYCN circuit on the other, and both the C19MC and the DICER1 arms end at let-7 depletion. MIR17HG is recorded as the third arm. The somatic genetic_context sits on the C19MC node alone, so the derived cell of origin is the apical radial glial progenitor bound there. The entry deliberately records three gaps in its own notes: no hydrocephalus, macrocephaly or papilledema phenotype, no motor-deficit phenotype, and no treatment section, in each case because no cached source carries the claim and the research report's figures come from tables not present in the cached abstracts. The report is unusual and the review_notes say so: its own session had no network, so it flags every CURIE in it as an unverified lead. None was copied; every identifier was looked up against the local HGNC and MONDO builds, the committed HP/GO/CL caches, or OLS, in the step it was written. The report's reference validation resolved 50 of 50 citations with no confabulation. 15 snippets, all verified; phenotype connectivity 3/3.

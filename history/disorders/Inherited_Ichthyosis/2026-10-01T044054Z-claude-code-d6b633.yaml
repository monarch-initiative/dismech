  details: |
    Genetics pass for dismech#12256 (d2g series-049), inherited ichthyosis.

    Anchor. disease_term MONDO:0015947 inherited ichthyosis is this entry's own concept and was left alone. All five pre-existing has_subtypes rows bind a direct child of it, and so does the row added here, so the entry's row level is MONDO's direct children of its anchor. That is what decides four of the five issue rows.

    One row added. MONDO:0957783 ichthyosis with erythrokeratoderma is a direct child of MONDO:0015947 with an empty description, no synonyms and hgnc:6359 KLK11 in its OWL axioms; nothing in kb/ or stubs/ mentioned the CURIE or the gene. Curated as a new row with KLK11 bound, a new genetic record, and a new pathophysiology node "Reduced Kallikrein-11 Proteolysis and Delayed Desquamation" wired to Hyperkeratosis and Ichthyosis. The founding report (PMID:36689511) was located through Europe PMC and fetched with just fetch-reference. gene_mechanism_wiring_coverage goes 11/11 to 12/12.

    Four rows declined, each on granularity grounds and recorded in the file. MONDO:0007810 autosomal dominant ichthyosis vulgaris is the only child of MONDO:0024304, which the Ichthyosis Vulgaris row already binds, and it carries hgnc:3748 FLG, the gene already bound on that row. MONDO:0012208 congenital reticular ichthyosiform erythroderma (KRT10) is a direct child of MONDO:0017266, which the Keratinopathic Ichthyosis row binds, and Epidermolytic_Hyperkeratosis_2.yaml already rules in its notes that it needs its own entry; that ruling is not reopened. MONDO:0007808 ichthyosis hystrix of Curth-Macklin is already a has_subtypes row of KRT1_Keratinopathies.yaml with its MONDO term bound, so it was a spurious row. MONDO:0007809 ichthyosis histrix, Lambert type sits under MONDO:0859383 ichthyosis hystrix, a different direct child of MONDO:0015947 that this entry does not carry as a row; its sibling in that group, Curth-Macklin, is curated with its keratin gene at KRT1_Keratinopathies, which is where that group is handled in this KB. stubs/Autosomal_Dominant_Ichthyosis_Vulgaris.yaml is kept rather than deleted, with entry_type set to SUBTYPE and the reasoning in its notes, because its MONDO term is not bound anywhere in kb/.

    Phenotype connectivity. causal_inlink_coverage was 4/9. Two edges were added from the Epidermal Lipid Metabolism Defect node, to Palmoplantar keratoderma and to Alopecia, each citing the sentence of PMID:38588653 that associates the feature with genes bound on that node (NIPAL4 for striated keratoderma, TGM1 and ABCA12 for alopecia). The new KLK11 node adds two more edges. Now 6/9. Pruritus, Hypohidrosis and Heat Intolerance are left unconnected: all three carry no evidence of their own in this entry, which is a pre-existing gap, and wiring them would mean asserting a mechanism nothing here sources.

    Validation on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 342 snippets checked, 0 issues; just count-verified-snippets reports 342/342 after reverting the whitespace churn. A search of the approved symbol KLK11 across the 718 committed CGGV_*.md records returns no row, re-run before committing, so the KLK11 genetic record records that no expert panel has graded this relationship in the records available here.

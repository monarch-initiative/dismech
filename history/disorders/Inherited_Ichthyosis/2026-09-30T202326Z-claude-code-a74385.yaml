  summary: Point Ichthyosis Vulgaris subtype at its own entry
  details: |
    The Ichthyosis Vulgaris subtype row now carries curated_in: Ichthyosis_Vulgaris, since the disease has its own entry. Its subtype_term was changed from MONDO:0024304 (ichthyosis vulgaris, which MONDO defines to include acquired ichthyosis vulgaris) to MONDO:0007810 (autosomal dominant ichthyosis vulgaris), the heritable FLG-related form the row and the new entry describe. just check-granularity had reported POINTER_TERM_MISMATCH before the change and reports none after. As a consequence MONDO:0024304 is no longer bound anywhere in kb/.

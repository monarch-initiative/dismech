  summary: 'Genetics pass: fix STS evidence, wire FLG and STS, add ARCI and keratin
    gene records'
  details: |
    Genetics pass under the genetics-gap campaign (issue #12200, epic #12189). Gene-to-mechanism wiring went from 3/5 to 11/11.

    The MONDO checklist item is STS for MONDO:0010622 (recessive X-linked ichthyosis). STS was present as a gene record but reached no pathophysiology node, and its only evidence was a cohort sentence that counted X-linked ichthyosis patients without naming STS -- the explanation conceded as much, calling STS "the canonical steroid-sulfatase gene for this subtype". The gene assertion now rests on a source that states it; the original item is retained for the cohort context it does establish and regraded directness: INDIRECT, with the history of the change recorded in the record's notes. STS is wired to the epidermal lipid node, whose description now explains the route: steroid sulfatase hydrolyses cholesterol sulfate, and its loss lets cholesterol sulfate accumulate in the stratum corneum and degrade the barrier. FLG was likewise unwired and is now on the keratinocyte differentiation and cornification node, evidenced from the filaggrin gene-discovery report rather than only from the cohort paper.

    Added gene records for the three recurrent ARCI genes that were already bound on the lipid node but had no gene-level assertion (CYP4F22, ALOXE3, NIPAL4), and for the keratinopathic genes KRT1, KRT10 and KRT2. KRT1 does have a dedicated entry, kb/disorders/KRT1_Keratinopathies.yaml, which models the dominant-negative filament collapse; the record added here is the umbrella's subtype-level gene assertion, on the same policy applied to the ARCI genes. KRT10 and KRT2 have no dedicated entry anywhere in kb/disorders/, so this entry is currently their only home. Case fractions from the 74-patient Italian ARCI cohort added to all six ARCI gene records. Gene bindings added to every has_subtypes row.

    Two lump/split dispositions recorded in review_notes rather than acted on. SPINK5 is bound on the Netherton subtype row but deliberately gets no gene record or pathophysiology node here, because the unopposed-kallikrein mechanism is a third chain this umbrella does not model and is curated in kb/disorders/Netherton_Syndrome.yaml. The rare ARCI tail (CERS3, PNPLA1, SDR9C7, one patient each in the cited cohort) is likewise left to kb/disorders/Autosomal_Recessive_Congenital_Ichthyosis.yaml, which carries a "Rare ARCI genes" record for it.

    The X-linked ichthyosis prevalence record previously carried a range attributed to a deep-research extraction with no citation, and described the denominator as male newborns. It now has a source, structured measure_type, band and normalized rates, and a note saying that the source states only "in males" and does not say whether the figure is birth or point prevalence.

    Not done, and deliberately: five phenotypes (palmoplantar keratoderma, pruritus, hypohidrosis, heat intolerance, alopecia) remain causally unconnected. They are downstream sequelae of barrier failure rather than genetics, and wiring them needs sources this pass did not gather.


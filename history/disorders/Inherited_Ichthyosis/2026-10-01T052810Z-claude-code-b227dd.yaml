  details: |
    Review round 1 on dismech#13279, one CI gate.

    scripts/check_gene_activity_grounding.py failed on this branch with KLK11 newly wired to a node carrying no molecular_functions. endopeptidase activity DECREASED was added to the "Reduced Kallikrein-11 Proteolysis and Delayed Desquamation" node. The term is supported by evidence already on the node: the patients' stratum corneum shows significantly decreased trypsin-like and chymotrypsin-like proteolytic activity, and the normal role quoted there is decomposing corneodesmosomes. A narrower serine-type endopeptidase term was considered and not used, because the cached abstract never states the catalytic class; it reports trypsin-like and chymotrypsin-like activity, which supports endopeptidase activity and not more than that.

    The gate now reports no newly ungrounded genes, and no baseline was touched. The eleven pre-existing ichthyosis genes that reach nodes with no molecular function are untouched and remain grandfathered; they are a separate gap from this change.

    Validation after the round, on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 349 snippets checked, 364 titles checked, 0 issues; just count-verified-snippets reports 349/349 after reverting the 18 reference-cache files the validator renormalised. gene_mechanism_wiring_coverage stays 12/12 and causal_inlink_coverage 6/9.

  summary: 'Cite the weak diet associations at node level: Gout'
  details: |
    Linked all four purine and fructose exposures (red/organ meat, shellfish, beer, fructose-sweetened soft drink) to the Hyperuricemia node. These were the four the disposition report withheld because their cited cohorts measured incident gout rather than serum urate, so no quote reached the node. Replaced that reasoning with evidence that measures the node itself: PMID:15641075 (NHANES III, 14,809 participants) reports serum uric acid rising with total meat and seafood intake, covering the meat and shellfish edges; PMID:36930152 (78,153 participants, intake standardised to 20 g ethanol per drink) reports higher serum urate with beer specifically and none with sake at matched ethanol, covering beer; PMID:32683776 (meta-analysis of five studies) reports 0.18 mg/dL higher serum uric acid in the highest sugar-sweetened-beverage intake category, covering fructose-sweetened soft drinks. All four links are EXACERBATES / DIRECT with evidence directness DIRECT, since each quote asserts the node quantity rather than disease risk. Also rewrote the shellfish entry-level explanation, which still argued for the retired supports: PARTIAL value; the claim it was making is kept, without naming a value the schema no longer has.

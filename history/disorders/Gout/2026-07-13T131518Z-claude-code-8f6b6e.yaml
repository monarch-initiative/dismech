  summary: Wire minimal urate homeostasis model for perturbation analysis
  details: |
    Added a KINETIC computational_models entry to Gout.yaml binding a single-compartment serum-urate homeostasis model authored in Antimony (models/urate_homeostasis.ant, exported to urate_homeostasis.xml SBML) and wired for dismech-perturb. Serum urate = production (purine load P processed by xanthine oxidase XO) minus elimination (fractional excretion f_exc plus uricase k_uricase); calibrated to normal ~5 mg/dL with the ~6.8 mg/dL MSU solubility limit as the Hyperuricemia threshold. Variable Serum_Urate with HP mappings (Hyperuricemia HP:0002149 above, Hypouricemia HP:0003537 below), five gene perturbations (HPRT1/PRPS1 -> production; ABCG2/SLC2A9/SLC22A12 -> fractional excretion), modeled_mechanisms, and COMPUTATIONAL evidence citing Benn et al. Physiology of Hyperuricemia and Urate-Lowering Treatments (PMID:29904633) with verified snippets including the 6.8 mg/dL solubility limit. Config sidecar uses f_exc as the disease-severity dial (baseline 1.0); disease scenarios (underexcretion/overproduction) and three urate-lowering treatment classes on distinct nodes: allopurinol/febuxostat (XO down), probenecid (f_exc up), pegloticase (k_uricase up), plus a combination. URAT1/GLUT9 loss are correctly protective (renal hypouricemia). Activated Hyperuricemia traces the full downstream gout pathogenesis (Crystal Deposition -> Inflammasome -> Acute Arthritis). Fourth fully-perturbable disorder. Schema/term/reference validation pass; 43 perturb tests pass.

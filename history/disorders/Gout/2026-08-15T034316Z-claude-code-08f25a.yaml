  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 tranche 1. Sources were located by PubMed search, cached with `just fetch-reference`, and every snippet was verified as an exact quote from the cached abstract. Added an EvidenceItem to five of the six `environmental:` exposures (Red Meat and Organ Meat Intake, Shellfish Intake, Beer Intake, Fructose-Sweetened Soft Drink Intake, Diuretics). Two deliberate deviations. First, Dehydration is left uncited: targeted searches for fluid intake and recurrent gout attacks, dehydration and serum urate, and hydration status and hyperuricemia returned no abstract stating the claim, so per the evidence SOP it stays a note, and a `review_notes` entry records the failed search so the next curator does not repeat it. Second, the Beer Intake note previously asserted a mechanism (impairs urate excretion, contributes purine load) that the citable UK Biobank cohort (PMID:39196557) does not state; the note now records what that study does show, the strongest per-drink association with incident gout of any beverage. Shellfish is graded PARTIAL because the cohort measured incident gout rather than precipitation of flares in established disease. Validated with `just validate`, `just count-verified-snippets` and the batched `just validate-disorders` sweep.

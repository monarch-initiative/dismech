  details: |
    Created new Infectious Disease entry for Cyclosporiasis [Cyclospora cayetanensis, MONDO:0005725]. Deep research attempted with falcon and openai but both failed on credentials; used the claude_code provider as the deep-research source. All evidence was independently verified against PubMed abstracts via fetch-reference and validate-references. Key PMIDs: 20065331, 1928575, 9772334, 9395371, 11049789, 7885125, 10836915, 8588145, 15200870. Covers agent, foodborne/waterborne transmission, sporulation/invasion/villous-atrophy pathophysiology, phenotypes, jejunal histopathology, modified acid-fast diagnosis, cryptosporidiosis/isosporiasis differentials, TMP-SMX first-line plus ciprofloxacin alternative, and a KNOWLEDGE_GAP on infectious dose. Validated with just validate, validate-terms, validate-references; compliance 100 percent.

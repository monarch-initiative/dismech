  summary: Review COX4I1 deficiency using clinical and mechanistic full texts
  details: |
    Reviewed the original entry and EDIT-only history against cached primary literature, including full texts of Abu-Libdeh 2017, Pillai 2019, Douiev 2018/2021/2022, Cunatova 2021, Liu 2025 and Ugarteburu 2026, plus the full nuclear-encoded Leigh syndrome GeneReviews chapter. Separated assembly, activity, ATP, conditional ROS, DNA repair/replication, isoform compensation and model-specific translation/complex-I mechanisms. Corrected the founding complex allele; added deletion and deep-intronic/nonsense genotypes with clinical and experimental evidence separated. Expanded patient-specific phenotypes, diagnostics, supportive care, experimental models and verified transcriptomic/proteomic resources. Removed unsupported universal lactic acidosis, ROS-to-DNA causality and process notes. Broad COX deficiency Falcon research and citation artifacts were considered; other-gene mechanisms/therapies were not transferred. Completeness: phenotype, mechanism, genetic, diagnostic, treatment and reference coverage expanded; no validated molecular subtypes or disease-specific trial established in the reviewed sources. Full-text-only findings now cite generated repository/PDF caches. Validation results are recorded in the PR.

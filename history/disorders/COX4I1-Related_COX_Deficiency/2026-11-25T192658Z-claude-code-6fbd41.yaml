  summary: 'Gene-family review: COX4I1, COX4I2'
  details: |
    COX4I1 genetic record typed: relationship_type UNKNOWN, variant_origin GERMLINE, and the autosomal recessive inheritance block bound to HP:0000007. Four families are reported (PMID:28766551; the two p.Pro152Thr siblings; PMID:40095452; PMID:41203052, the nonsense/deep-intronic case cited here through its author manuscript). ClinGen rates COX4I1 Limited (AR) for Leigh syndrome (MONDO:0009723) and mitochondrial disease (MONDO:0044970), neither being this entry's MONDO:0033651, so no tier is recorded and CAUSATIVE (Definitive/Strong) is not used; a note on the record says so. The COX4I1 and COX4I2 nodes already bind GO:0004129 as the holoenzyme activity each non-catalytic subunit contributes to, and were left unchanged.

  summary: 'Create: NEMMLAS (WARS2)'
  details: |
    New entry for NEMMLAS (MONDO:0060578), the autosomal recessive neurodevelopmental mitochondrial disease caused by biallelic WARS2 variants. The GeneReviews chapter WARS2 Deficiency (PMID:37824696) is the phenotype baseline and is tagged in references; it covers a spectrum that MONDO splits into this disease and childhood-onset parkinsonism-dystonia 3 (MONDO:0030676), which is recorded as a differential, not a subtype. MONDO lists WARS2 deficiency and WARS2-related disorder as broad synonyms, so the MONDO label is used as the name. WARS2 is typed CAUSATIVE (several families, uncharged tRNA-Trp and reduced enzyme and mitochondrial translation in patient cells, yeast and fly models); ClinGen Definitive for mitochondrial disease is noted only. Pathograph follows the mitochondrial_translation_deficiency module to neuronal and hepatocyte energy failure, with a REFUTE item for normal muscle and fibroblast respiration. Treatments: supportive care with valproate avoidance, oral tryptophan supplementation (small uncontrolled series) and levodopa (SUPPORT from GeneReviews, REFUTE from a non-responding NEMMLAS patient). Environmental: sodium valproate (ECTO:9002607) exacerbating hepatocyte energy failure. Models: patient iPSC-derived neuroepithelial stem cells, the Wars2 V117L mouse and Drosophila WARS2 RNAi, with typed divergences. Validated with linkml-validate, OLS-backed term validation, the reference validator (79 snippets, 0 issues), count-verified-snippets, check-genereviews and the section-5 check recipes; the stub was deleted.

  summary: 'Create: GABA_Aminotransaminase_Deficiency'
  details: |
    New Disease entry for GABA aminotransaminase deficiency (MONDO:0013166),
    curated from the stub; entry_type decided as DISEASE (single causal gene
    ABAT, no MONDO descendants). The entry is built around loss of ABAT
    4-aminobutyrate:2-oxoglutarate transaminase activity, with two upstream
    missense classes (fold destabilization; impaired catalysis and dimer
    assembly), GABA accumulation, and edges to phenotypes.

    Structural placement of variants: UniProt P80404 was aligned to pig
    P80147 (94.8% identity) and residues were mapped onto PDB 1OHV chains A
    and B (crystal numbering = human precursor numbering minus 28). Minimum
    heavy-atom distances to the cofactor, the iron-sulfur cluster and the
    partner chain, and Shrake-Rupley relative solvent accessibility in the
    monomer and the dimer, were computed with Biopython; AlphaFold
    AF-P80404-F1 v6 pLDDT and AlphaMissense scores were read from the
    AlphaFold database; conservation was checked by pairwise alignment to
    mouse, rat, zebrafish, Xenopus, Drosophila, C. elegans, yeast UGA1 and
    E. coli GabT. ClinVar (926 ABAT records), gnomAD v4 constraint and
    variant counts, and the Ensembl exon structure of ENST00000268251 were
    queried on 2026-11-28. These results were reconciled with the
    independent ABAT review in ai4curation/ai-gene-review (branch
    claude/abat-gabatd-co-review); the two agree on mechanism, variant
    classes and the three caveats below.

    Findings that shaped the entry: (1) the variant published as p.Arg497His
    in two adult siblings (PMID:30644311) is synonymous (c.1431G>A,
    p.Thr477=) on the canonical transcript and that family has no biochemical
    confirmation, so it is not used as evidence of adult survival; (2)
    p.Gly106Ser (c.316G>A) is the last base of an exon and is treated as a
    splice allele; (3) the UniProt interchain disulfide at Cys321 is not
    supported by the crystal structure; (4) the proposed role of ABAT in
    mitochondrial nucleoside salvage is recorded as an EMERGING hypothesis.
    ClinGen has curated ABAT only for developmental and epileptic
    encephalopathy (MONDO:0100062, Moderate), a different MONDO disease, so
    no validity tier was copied.

    Deep research: an Asta retrieval run is committed; most of its hits were
    off topic and no evidence was taken from it that was not found
    independently through PubMed. An OpenScientist disorder report is also
    committed (the first run timed out at 3600 s and was cancelled; the
    second, with a 7200 s limit, completed). just preflight-dr passes on it
    (ABAT named 91 times, OMIM 613163). It arrived after the entry was
    written and agrees with it on recessive loss of function, the three
    functional classes of missense variant and their relation to distance
    from the cofactor, the biomarkers and flumazenil. No evidence item was
    taken from it. Four of its statements were checked and not adopted: it
    presents mitochondrial dNTP failure as an established second arm of the
    mechanism (kept here as an EMERGING hypothesis; the report's own
    limitations say the two arms have never been dissociated); it counts the
    PMID:30644311 siblings as survivors to 22 years without noting that
    their variant is synonymous on the canonical transcript; it uses 106
    high-confidence loss-of-function variants, a count that includes
    non-canonical transcripts (81 on ENST00000268251); and it says no
    structural variants cause the disease, although exon deletions are
    reported (PMID:20052547) and present in ClinVar. Its term-validation
    section lists several mislabelled CURIEs (for example HP:0045048 offered
    as raised growth hormone); none was used. Two OpenScientist hypothesis
    runs (mitochondrial nucleoside salvage; depolarizing GABA and seizures)
    were still running when this record was written. PMID:30617166 and
    PMID:42809624 have no abstract in PubMed and are not cited. No
    GeneReviews chapter exists (just check-genereviews: NO_CHAPTER).

    A fresh-context review pass before the PR removed unsupported frequency
    values, a REFUTE item that was really a not-obligate observation, and
    several uncited statements. Validation: just validate-schema, just
    validate-terms, just count-verified-snippets (108/108) and just
    validate-disorders pass. The automated PR review approved the entry; its
    optional suggestions (a note that Tall stature approximates accelerated
    linear growth, and an INCREASED modifier on the growth hormone process)
    were taken.

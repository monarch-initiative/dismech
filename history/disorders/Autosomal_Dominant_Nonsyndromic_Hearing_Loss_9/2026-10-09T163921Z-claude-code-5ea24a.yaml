  details: |
    Coch G88E knock-in mouse gene rebound from hgnc:2180 to NCBIGene:12810 (mouse Coch); the intracochlear conditioned-medium model gains UniProtKB:Q62507 (mouse cochlin, the murine G90E protein the cited study (PMC2865277) expressed in 293T cells and injected); the inducible human COCH minigene cells gain hgnc:2180. The Cochlin overexpression cell-assay model was left without genes because its two cited studies express different species' cochlin: PMID:20228067 murine cochlin, PMID:34529116 COCH constructs carrying human variants such as p.Phe230Leu. One genes list would be half wrong for either. All NCBIGene IDs were resolved through NCBI E-utilities esummary by just check-gene-namespaces-online and cached in cache/ncbigene/terms.csv; the UniProtKB label was checked by the term validator.

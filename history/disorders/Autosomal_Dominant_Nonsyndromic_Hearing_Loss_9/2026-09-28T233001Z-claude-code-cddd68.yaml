  summary: 'Create: Autosomal_Dominant_Nonsyndromic_Hearing_Loss_9'
  details: |
    De novo curation of DFNA9 (MONDO:0011058; COCH, hgnc:2180 confirmed against the HGNC REST record) from the Perplexity deep-research report research/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_9-deep-research-perplexity.md. just preflight-dr returned PASS (COCH mentioned 97 times, OMIM 601369 matches). The report was used as a lead only: its 8 resolved references were mostly OMIM, MedGen, PanelApp and ClinVar pages; of those with PubMed records, PMID:34369416, 34529116, 21046548, 22610276 and 31493294 are cited. PMID:21825995 (general vestibular-genetics review) and PMID:29375286 (cognition review) were read but not cited because their abstracts carry no DFNA9-specific finding the entry needed; DOI:10.1007/s00415-015-7988-9 cached with no quotable text. The report's blood-labyrinth barrier MRI claim (its citation 16, an unresolved institutional PDF) was dropped as unverifiable. Report terms rejected: HGNC:2189 (wrong gene id), HP:0000398, HP:0001752, HP:0001390, HP:0008618 (nonexistent), obsolete CL:0000004 and GO:0062023, and its NCIT suggestions. The remaining 36 PMIDs came from PubMed searches (esearch COCH[ti] AND DFNA9 and related). Pathograph: germline COCH variant -> domain misfolding -> (intracellular retention, allele-dependent) or (defective ECM incorporation) -> cochlin aggregate deposition -> fibrocyte loss, spiral ganglion dendrite degeneration, vestibular end-organ dysfunction -> 12 of 13 phenotypes; tinnitus left unconnected because no DFNA9-specific mechanism is sourced. just check-genereviews --online: NO_CHAPTER. Validation: just validate-disorders passed (87/87 snippets, schema and terms clean); count-verified-snippets 87/87; entity-refs, causal-targets, duplicate-keys, coarse-phenotypes, qualifier-terms, snippet-length, title-snippets, snippet-grading, reference-titles and folded-hyphens all OK (the baseline-diff checks were run with TMPDIR on /dev/shm because the root filesystem was full).

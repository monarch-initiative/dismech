  details: |
    The CI gate 'Check for newly ungrounded genes' failed because COCH was wired to the initiating pathophysiology node without a molecular function. Bound GO:0005518 collagen binding (no modifier) on that node, sourced from PMID:21052762, whose sentence restates earlier work showing the cochlin vWFA2 domain binds collagen (quote_role BACKGROUND, directness INDIRECT). No modifier is set because PMID:22610276 reports that the p.Phe527Cys vWFA2 variant does not change collagen affinity. Also took three optional review suggestions from PR 13112: Episodic vertigo rebound from HP:0002321 Vertigo to HP:0010532 Paroxysmal vertigo, PMID:32939038 regraded from IN_VITRO to HUMAN_CLINICAL (the quoted counselling conclusion rests on human families), and a lost line wrap in the description restored. The suggestion to add evidence to four uncited downstream edges was not taken: no source in hand states those specific causal steps, and a node-level quote would not establish the edge. Re-validated: just validate passed, 88/88 snippets verified, gene-grounding and snippet-grading gates clean.

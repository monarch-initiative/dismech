  summary: Record ClinGen Definitive validity for COCH
  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for COCH (Definitive, autosomal dominant, 2018-01-05), filed under MONDO:0019497, which the entry now maps as skos:broadMatch. Set relationship_type CAUSATIVE and variant_origin GERMLINE on the COCH record, which carried only the free-text association. The mechanism chain was compared with a review of the COCH GO annotations and agrees; the innate-immunity role of the cleaved LCCL fragment remains outside the entry, as the entry itself states. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

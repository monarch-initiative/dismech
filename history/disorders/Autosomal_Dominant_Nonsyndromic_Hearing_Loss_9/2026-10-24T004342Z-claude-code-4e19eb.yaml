  summary: 'Genetics pass: repair DFNA9 pathograph dead-ends and phenotype connectivity'
  details: |
    Genetics pass over the 55 MONDO rows that issues #12209, #12210 and #12211 attribute to MYO6_Hearing_Loss. All 55 were verified against OLS4 as hierarchical descendants of MONDO:0019497 nonsyndromic genetic hearing loss, which MYO6_Hearing_Loss carried as its disease_term until PR #12870 retired that binding; none of the 55 is a MYO6 disease. DFNA9 is one of four rows in the three lists that already has its own curated Disease entry, and COCH was already bound and wired (gene_mechanism_wiring_coverage 1/1 before and after).

    What changed in this entry is the causal graph. Before: 12 pathophysiology nodes, 4 with no outgoing downstream edge, and 10 of 15 phenotypes with a causal inlink. After: 2 dead-end nodes and 11 of 15 phenotypes connected.

    Added a downstream edge from Cochlin Domain Misfolding to Abnormal Cochlin Dimerization and Oligomerization, INDIRECT_UNKNOWN_INTERMEDIATES, on the PMID:34529116 sentence that places misfolding and dimerization in one causal claim for LCCL-domain variants. The same sentence reports no trafficking or secretion defect for those variants, which is recorded on the edge as the reason no edge runs from misfolding to intracellular retention.

    Added a downstream edge from Abnormal Cochlin Dimerization and Oligomerization to Intracellular Retention of Mutant Cochlin, carrying both a SUPPORT item (PMID:25230692, the retained intracellular species was the dimer for three LCCL-domain alleles) and a REFUTE item (PMID:34529116, dimerization without a trafficking or secretion defect). The two published results conflict for LCCL-domain variants and the edge says so rather than choosing a side.

    Added a sequelae edge from Adult-onset progressive sensorineural hearing loss to Profound hearing loss in late disease on PMID:14501450.

    Two dead-end nodes remain and both are deliberate. Loss of Spiral Ligament and Spiral Limbus Fibrocytes already recorded that the functional consequence of fibrocyte loss has not been measured. Impaired Cochlin Proteolytic Processing did not say why it had no outgoing edge, so its description now records that impaired cleavage and aggregate formation are reported as joint domain-dependent features of the vWFA2-domain variants rather than one causing the other, with the PMID:34529116 sentence that makes that assignment added as node evidence.

    Four phenotypes are still without a causal inlink and are left that way. Tinnitus already recorded that no DFNA9-specific mechanism has been described. For Childhood or prelingual sensorineural hearing loss, High-frequency predominant hearing loss and Impaired speech discrimination, no source cited in this entry links the presentation or the audiometric configuration to a specific inner-ear lesion, and the speech-discrimination phenotype's own description states that the cohort study did not establish a synaptic or cognitive mechanism.

    Self-review caught one fabricated string in the first draft: the reference_title written for PMID:14501450 on the new sequelae edge was composed rather than copied, and did not match the title: frontmatter of references_cache/PMID_14501450.md. It was replaced with the cached title, and all 145 reference_title values in the file were then compared against their cache frontmatter with no remaining mismatch.

    Validation: just validate passed, 157 titles checked, 0 issues.

    Review round 1 correction. The misfolding edge's description said no edge is drawn from that node to intracellular retention, which the two new edges had made false: misfolding now reaches retention transitively through the dimerization node. The sentence now says no direct edge runs between them and that the transitive path holds only for the LCCL-domain alleles in which retained dimers were detected.

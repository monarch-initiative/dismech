  summary: Review DFNA9 using primary full text; separate allele-specific cochlin mechanisms and update
    clinical research
  details: >-
    Reviewed the complete entry, existing CREATE/EDIT history, Perplexity scientific report and citation sidecar,
    all 41 baseline PMID caches, and additional primary studies and registries. Preflight confirmed MONDO:0011058
    and COCH. GeneReviews/StatPearls check returned NO_CHAPTER against the 2026-09-10 index. Read all available
    scientific text for the key mechanistic, temporal-bone, clinical, mouse and antisense studies, upgrading four
    abstract caches to full text. PMID:12843317 remains an abstract/PDF-pointer HTML record despite refetching;
    full-paper access was not claimed. PMID:20228067 full text was recovered through an automatically generated
    PMC URL cache because the PMID route remained abstract-only. No reference-cache files were hand-authored.


    The main error was attribution of Phe230Leu cytotoxicity to retention: PMID:34529116 shows normal secretion/cleavage
    and reduced NIH3T3 viability after conditioned-medium exposure. Separate oligomerization, retention, proteolytic
    processing and cytotoxicity nodes. PMID:20228067 directly shows mutant recruitment of wild-type cochlin into
    stable complexes, with distinct cell and acute mouse assays; neither these assays nor the knock-in recapitulate
    every human tissue feature. Domain misfolding is not universal: construct Trp91Arg equals full-length Trp117Arg
    and folded normally. Phe527Cys monomer is secreted while large covalent complexes are retained; collagen binding
    persists with heterogeneous affinities, so replace secondary background MF support with the primary binding
    experiment without a uniform modifier. Add the terminal Asp544Valfs*3 abnormal-protein allele without calling
    all frameshifts dominant or assuming NMD; omit unverified normalized cDNA notation. Intronic ASO haplotype markers
    are not pathogenic regulatory variants. No immune/autoimmune pathway is inferred from normal cochlin biology.


    Human histology correction: PMID:27023102 describes bilateral bones from one Leu114Pro patient, with quantitative
    ganglion counts, extensive cochlear and vestibular distal dendritic degeneration and no subjective vestibular
    symptoms. Record the single-patient/postmortem/treatment limitations. Remove unsupported neural-to-high-frequency/profound
    edges, qualify correlated tissue transitions, and remove organ-level equilibrioception GO. Add histopathology
    and experimental-model joins while retaining gaps where no specific ontology term fits.


    Clinical corrections: adult onset is usual, not universal; the French Phe121Ser family includes childhood and
    two prelingual cases. Gln410Arg in a biallelic-GJB2 proband is not imported as independent proof of congenital
    COCH disease; novel frameshift predictions are not treated as measured loss of function. Add speech discrimination
    based on the 101-carrier cohort, without assuming auditory synaptopathy or cognitive disease. Water and air
    caloric thresholds are not interchangeable; modeled onset and implant-candidacy ages are not individual clinical
    rules. Correct CT denominator to 23 tested ears and MRI to 38 in the 45-person cohort; the later implant cohort
    was not entirely P51S, and 43/44 imaged subjects had canal abnormalities. Do not assert a consistently predominant
    canal. Resolve the report's previously unverified delayed-contrast MRI claim with PMID:31390618; contrast absent
    hydrops in four patients with unilateral utricular hydrops in the later single case PMID:42270086. Barrier leakage
    and saccular rupture remain interpretations. Corneal striae, night blindness, memory loss, nonspecific white-matter
    lesions and fatigue are not promoted to established disease features. Recessive DFNB110 is distinguished by
    molecular mechanism and inheritance rather than an absolute age or vestibular boundary.


    Treatment/model review: auditory implants have outcome data, but associations with preoperative performance
    do not prove an earlier-treatment causal benefit. Add directly reported vertigo drugs with minimal success,
    bounded mixed-cohort rehabilitation/environmental adaptations, and investigational vestibulocochlear implantation:
    all three DFNA9 cases received electrodes, but one lacked measurable vestibulo-ocular reflex responses. ASO reduction of mutant
    RNA is dose- and expression-dependent; 25 nM selectivity does not establish safety, protein rescue or hearing
    rescue. Heterozygous null auditory preservation does not establish vestibular haplosufficiency. G88E mice reproduce
    functional and middle-ear findings but lack human-like inner-ear deposits; the acute conditioned-medium exposure
    model is separate. Cell-line models are not patient-derived tissue.


    Live ClinicalTrials.gov API checks on 2026-09-30: NCT03716908 and NCT04070937 RECRUITING (old registry updates),
    NCT04331015 and NCT07091071 COMPLETED, NCT04066270 UNKNOWN, NCT04918745 ACTIVE_NOT_RECRUITING. Record observational/device
    purpose and dates; no COCH disease-modifying human efficacy is inferred. Withdrawn NCT03707756 was a literature-review
    protocol and is not modeled as an active treatment trial. Other search hits were unrelated conditions. PMID:39666779
    referral yield is not population prevalence; PMID:38610765 overlaps earlier YUHL cases. Recent sources were
    assessed without duplicating overlapping participants or creating unsupported phenotypes.


    Eight-dimension research cross-check: phenotype coverage adequate after early-onset/speech additions and frequency/denominator
    repair; subtype coverage adequate with DFNB110 differential and no invented domain subtypes; pathophysiology
    adequate with 12 atomic nodes and qualified causal links; treatments/trials adequate with eight management/research
    entries and six scoped registry records; genetics adequate with six representative alleles and abnormal-protein
    versus inactivation distinctions; biomarkers/diagnostics adequate with functional testing and bounded MRI findings;
    references adequate after primary full-text mining, title/quote checks and explicit access limits; overall report
    consumption adequate, with speculative immune/cognitive mechanisms and weak syndromic associations intentionally
    excluded. No unresolved blocking curation omission identified.


    Validation: schema, live ontology terms and references passed with 150/150 quotations, 152 titles, zero unavailable
    or skipped snippets. Additional deterministic content/history checks and precommit hooks run before publication.

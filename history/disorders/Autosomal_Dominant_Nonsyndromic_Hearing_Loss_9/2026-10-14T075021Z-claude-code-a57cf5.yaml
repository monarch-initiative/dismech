  summary: 'LOINC tranche G: audiometry measurement, no generic band'
  details: |
    Bound LOINC:89015-2 (panel) plus the 500/1000/2000/4000 Hz per-ear threshold codes to the existing Pure-tone and speech audiometry row. No reference range is recorded: the entry's own cited cross-sectional study (PMID:34369416) compares each carrier's thresholds against age-specific ISO 7029 presbyacusis percentile curves, not a fixed severity grade, so the same dB value means something different at different carrier ages -- a static WHO/GBD better-ear-average band would misrepresent that age-referenced comparison. Part of LOINC tranche G batch 15 (projects/LOINC_DIAGNOSTICS.md).

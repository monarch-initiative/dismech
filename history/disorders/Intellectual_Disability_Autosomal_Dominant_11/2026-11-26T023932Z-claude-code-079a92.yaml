  summary: Add phenotypes from second reported patient
  details: |
    Searched for further EPB41L1 patients. No GeneReviews chapter exists (check-genereviews: NO_CHAPTER). Found a 2024 case report (DOI:10.4103/ajpn.ajpn_20_24) of a second patient with de novo p.Glu619Asp, cached as abstract only. Added eight phenotypes quoted from that abstract, each bound to an HPO term looked up through OLS. Kidney and electrolyte findings are not wired into the pathograph because no source links them to a mechanism. Updated the description and notes that said only one patient was known.
    Review round 1: corrected the Severe Intellectual Disability description and explanation, the genetic association text and the single-patient knowledge-gap discussion, which still said only one patient and variant were known. Added a variant record for p.Glu619Asp quoting the abstract's trio exome sentence, marked hypomagnesemia and metabolic alkalosis as mild, added the second patient's normal brain MRI to the neuroimaging row, and noted in the notes that the nonsyndromic synonyms describe the first patient. A forced re-fetch of the case report still returns only the abstract. Two further literature searches found no additional EPB41L1 patients.

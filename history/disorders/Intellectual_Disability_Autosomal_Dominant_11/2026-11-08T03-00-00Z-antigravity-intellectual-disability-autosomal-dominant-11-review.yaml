  summary: Enriched Intellectual Disability, Autosomal Dominant 11 with Harrison's classifications, synaptic pathophysiology groundings, and clinical/molecular diagnostic procedures.
  details: Added Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) supported by verbatim quotes from PMID:21376300. Enriched EPB41L1/4.1N pathophysiology nodes with explicit gene list grounding, ionotropic glutamate receptor binding molecular function, postsynaptic cellular components, neuronal cell types, and hippocampal/dentate gyrus anatomical locations. Marked severe intellectual disability as diagnostic and added diagnostic entries for standardized developmental/IQ testing, synaptic gene trio sequencing, and brain neuroimaging.

  details: |
    New entry for MRD11 (MONDO:0013658, EPB41L1), requested by the user and claimed in issue #13094. The association is deliberately curated as provisional: it rests on one patient with a de novo EPB41L1 p.(Pro854Ser) variant (PMID:21376300), GenCC submitters rate it Limited, and PanelApp carries the OMIM '?' provisional notation (both checked on the live sites in September 2026 and recorded in notes with their source). Deep research was requested from falcon; no Edison key was configured, so the run used dr_fallback and the report was produced by claude_code. Report validation: 12/13 identifiers resolved; PMID:25572454 failed to resolve (it exists in PubMed, so this looks like a transport error, but it is not cited), and the report's quote from PMID:11050113 was a paraphrase, so the actual source sentence was used instead. preflight-dr returned WARN only because the report cites the gene MIM 602879 alongside the phenotype MIM 614257 that MONDO cross-references; EPB41L1 dominates the gene mentions (26). Only severe intellectual disability is curated as a phenotype; hypotonia, no seizures and normal MRI are in OMIM but not in the primary paper's text. check-genereviews --online (with synonyms): NO_CHAPTER.
    A fresh-context red-team review (7 important, 7 minor, no critical findings) led to these changes: the 19503082 LTP evidence was regraded MODEL_ORGANISM (in vivo lentiviral knockdown) and restated as impaired LTP maintenance with basal transmission unchanged, using the late-phase sentence; the synapse node description was narrowed accordingly; the 19225127 and 37845032 REFUTE items were moved from the synapse node onto the surface-GluA1-to-synapse edge, with directness INDIRECT and a note that 37845032 tested basal DG synapses only; the rodent-mismatch discussion now gives the authors' own explanations (age and developmental compensation; very low 4.1N in CA1); the FERM/CTD wording was corrected (CTD dispensable, FERM needed for synaptic AMPA receptors); CL terms were changed to CL:0002608 hippocampal neuron, CL:0000679 glutamatergic neuron and CL:2000089 dentate gyrus granule cell; GO:0072659 was replaced by GO:0098877 neurotransmitter receptor transport to plasma membrane; the variant data are now described as reduced surface GluA1 rather than insertion; the 11050113 in vivo co-IP was regraded MODEL_ORGANISM and its heterologous-disruption sentence added on the surface node; two background sentences were given quote_role BACKGROUND; 'no second variant' became 'no second de novo variant'; and the notes now attribute the GenCC and PanelApp facts to their source and date, with process narration removed and the pLI remark dropped. The reviewer's suggestion to add supportive-care treatments was not taken because no citable source describes care for this patient. Validation: just validate 24/24 snippets; check-entity-refs, check-causal-targets and check-duplicate-keys OK. Stub stubs/Intellectual_Disability_Autosomal_Dominant_11.yaml deleted.

  summary: Deepen Camurati-Engelmann_Disease curation with grounded TGFB1 pathophysiology, specific HPO bindings, diagnosis, and differential diagnoses.
  details: >-
    Added MONDO exact synonyms, Harrison's classifications, literature case
    prevalence (>300 cases) and 1 in 1,000,000 population prevalence,
    childhood-to-young-adulthood onset progression, explicit pathophysiology
    roles and intermediate Osteoclast Activation and Uncoupled Bone Turnover
    node, specific HPO bindings (Limb pain HP:0009763, Exophthalmos HP:0000520,
    Hyperostosis of the internal acoustic canal HP:0004462, Anemia HP:0001903),
    cranial nerve palsies (HP:0006824), losartan target_mechanisms, diagnosis
    entries (Skeletal Radiography, Cranial CT, TGFB1 Molecular Genetic Testing),
    and differential diagnoses (Ribbing Disease, Craniodiaphyseal Dysplasia,
    Kenny-Caffey Syndrome, Worth Autosomal Dominant Osteosclerosis).

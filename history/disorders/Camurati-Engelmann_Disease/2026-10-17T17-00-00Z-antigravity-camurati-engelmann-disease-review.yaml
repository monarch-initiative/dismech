    (GO:0008083 growth factor activity INCREASED, GO:0050431 transforming
    growth factor beta binding DECREASED) while aligning its description with
    increased TGF-beta1 bioavailability, bound gene_term (hgnc:11766) on TGFB1
    Mutations in genetic, and backfilled evidence_source across inheritance,
    pathophysiology, phenotypes, genetic, and treatments.

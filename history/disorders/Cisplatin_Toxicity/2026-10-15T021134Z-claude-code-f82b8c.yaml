  summary: Fix magnesium note's false claim; re-cite a quote naming magnesium
  details: |
    The Serum magnesium marker's notes claimed the cited source (PMID:18272962) 'supports renal magnesium wasting as the mechanism', while the same evidence item's own explanation correctly said the cited sentence does not name magnesium specifically -- the two statements contradicted each other, and the note's claim was the false one: the snippet is a general statement about nephrotoxicity limiting cisplatin's use, naming neither magnesium nor a decrease. Replaced the evidence item with a different quote from PMID:37530867 (already cached and cited elsewhere in this entry), 'Several possible interventions such as magnesium supplementation may prevent CIN', which does name magnesium, graded directness: INDIRECT since it supports magnesium supplementation as a candidate intervention rather than stating magnesium is the measured marker. Rewrote the note to match. Also added directness: INDIRECT to the Serum creatinine marker's evidence item, since its snippet gives the nephrotoxicity endpoint's incidence and 'creatinine is the measurement behind it' follows by inference rather than being stated directly. This weakness in the magnesium evidence is inherited from the pre-existing Hypomagnesemia phenotype, which carries the identical reference/snippet/evidence_source with the same caveat in its own explanation; that phenotype's evidence base was not touched here, since copying the quote unchanged was correct and only this new note's claim needed correcting.

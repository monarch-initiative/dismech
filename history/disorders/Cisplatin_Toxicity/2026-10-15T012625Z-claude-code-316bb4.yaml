  summary: 'LOINC tranche I: bind serum creatinine and magnesium codes'
  details: |
    Added a new biochemical section with two markers that did not previously exist on this entry: Serum creatinine (LOINC:2160-0), keyed to the entry's own prevalence note stating that nephrotoxicity incidence varies with the creatinine threshold used to define it, and Serum magnesium (LOINC:2601-3), keyed to the existing Hypomagnesemia phenotype's renal-wasting mechanism. No reference_ranges bands were added: neither cited source states a numeric threshold. Deliberately did not add a transaminase/AST/ALT marker -- this entry's own content does not name hepatotoxicity, only nephrotoxicity, ototoxicity, neurotoxicity and myelosuppression as its dose-limiting toxicities.

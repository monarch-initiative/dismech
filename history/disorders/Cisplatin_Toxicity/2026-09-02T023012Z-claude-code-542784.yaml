  summary: 'Create: Cisplatin Toxicity'
  details: |
    New entry for cisplatin toxicity (MONDO:0027664), curated as a four-arm
    treatment-toxicity entry. One lesion - platinum-DNA crosslinking - reaching four
    organs, where what decides the target is transporter-mediated uptake and what
    decides the prognosis is whether the dead cell can be replaced.

    Pathograph: 13 nodes, fully connected apart from the uptake trigger. Shared
    upstream chain (transporter uptake, adduct formation, oxidative and mitochondrial
    injury, apoptosis) branching into renal, cochlear, neural and marrow arms.
    Eleven conforms_to declarations across four modules: drug_induced_nephrotoxicity
    (4 nodes), sensorineural_hair_cell_loss (2), peripheral_axonal_degeneration (3),
    myelosuppression (2).

    Two conformances deliberately withheld, with the reasons recorded in notes:

    - NOT peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination.
      Cisplatin neuropathy is a sensory neuronopathy - platinum accumulates in and
      kills the dorsal root ganglion cell body. Symptoms beginning distally is a
      different claim from the lesion being distal, and no cited source reports
      demyelination.
    - On the module's Axonal Transport Impairment and Mitochondrial Dysfunction node,
      only the mitochondrial half is conformed. The axonal-transport mechanism in
      chemotherapy-induced neuropathy is established for the microtubule-targeting
      agents (taxanes, vinca alkaloids); PMID:38660386 states it in those terms, and
      cisplatin is not a microtubule poison. The mechanism was not transferred.

    Similarly, the sensorineural_hair_cell_loss conformance covers the death half of
    its module node; no mechanotransduction measurement is reported by the sources
    cited here.

    Evidence: 67 items over 14 references, every snippet pre-verified against the
    local cache before the YAML was written. Anchors are a 2024 multi-toxicity review
    (PMID:39423903), the SIOPEL 6 randomised phase 3 otoprotection trial
    (PMID:29924955, full text cached), a 2023 ototoxicity review (PMID:36455457), the
    Kidney International nephrotoxicity review (PMID:18272962), transporter studies
    for OCT2 (PMID:16242669) and Ctr1 (PMID:19144690), the DRG mitochondrial-DNA
    study (PMID:21145397), and a 368-patient paediatric audiology cohort
    (PMID:34490624).

    Frequency discipline: no frequency band is asserted on any phenotype. For hearing
    loss this is deliberate rather than incidental - the cumulative incidence is 75
    percent under age five against 48 percent over five in the same cohort, so a
    single band would misrepresent a strongly age-dependent risk, and the explanation
    says so.

    Claims deliberately not made: no hair-cell-regeneration claim (the usual
    explanation for the permanence, but absent from the cited sources - the
    irreversibility itself is sourced); no erythropoietin mechanism for the anaemia;
    no hydration-specific evidence for the renoprotective treatment, whose cited
    review discusses renoprotection at the level of strategy and states plainly that
    protection is mostly partial.

    Self-audit before commit found three overclaims in my own prose, all corrected:
    "in every cell it enters", "behaving completely differently", and an unsourced
    statement that mammalian cochlear hair cells are not replaced doing load-bearing
    work in a causal edge description.

    Validation: just validate-disorders (the batched sweep CI runs) passed; 67/67
    snippets verified; check-folded-hyphens, check-duplicate-keys,
    check-title-snippets and check-entity-refs all clean; 20 structural tests pass;
    all 11 conformance anchors resolve to real module nodes. All reference_title
    values generated programmatically from the cache files, never typed.

    Deep research: just research-disorder claude_code produced a 96 KB report;
    32/32 references resolved, 0 unresolved, 13/13 quoted claims found in source.
    NEC preflight returned SKIP (MONDO records no causal gene for a drug
    toxicity) and was cleared manually - the report's top gene mentions are ACYP2,
    TPMT, COMT and SLC22A2, which are the cisplatin ototoxicity susceptibility
    loci plus OCT2.

    The report was used as leads only; no snippet was taken from it unverified.
    It contributed two things the draft lacked, both then fetched and checked
    independently:

    - A genetic: section. PMID:37726872, the Canadian Pharmacogenomics Network for
      Drug Safety 2022 update, graded 40 reports across 47 populations and 24
      genes and placed only ACYP2 and TPMT in the strong-and-replicated tier.
      Those two are curated SUSCEPTIBILITY. COMT is curated DISPUTED on purpose:
      it is a frequently cited candidate locus that the grading review assigns to
      the further-research tier, and recording it at the same strength as the
      other two would misstate the evidence. The report flagged that trap
      explicitly and it was verified against the source before curating.
    - PMID:37530867, which supplied the hydration-specific evidence the draft had
      recorded as missing: a meta-analysis of 11 retrospective studies giving
      OR 0.22 (95% CI 0.14-0.35) for magnesium supplementation against
      cisplatin-induced nephrotoxicity, plus the "up to 20% of patients" clinical
      proportion for the renal arm. The retrospective design of the pooled studies
      is recorded as a limit, and the same review's statement that the best
      prevention method remains uncertain is curated alongside it.

    The ACYP2 HGNC identifier was resolved from the ontology rather than taken
    from the report's gene table.

    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised eight items. All
    eight addressed.

    1. CL:1000838 was the wrong proximal tubule cell type. It sits under
       CL:0002584 renal CORTICAL epithelial cell, so it excludes the S3 straight
       segment where cisplatin injury is maximal, and this entry's own node
       description says distal segments are affected too. Verified against the
       ontology and replaced with CL:0002306, which is what all five nodes of the
       conformed module use. This is the id-and-label-agree-but-meaning-is-wrong
       failure: nothing in validation could have caught it.
    2. PMID:16242669 was graded IN_VITRO. The quoted conclusion rests on the in
       vivo rat arm - sex differences in renal uptake clearance, urinary NAG, the
       castrated-male comparison - and the record carries the Animals keyword.
       Regraded MODEL_ORGANISM with the reason stated.
    3. All eight phenotypes were disconnected from the pathograph. A survey of 400
       KB entries found 233 wire phenotypes as downstream targets, so this is
       established practice and the entry was the outlier. All phenotypes now hang
       off the terminal node of their arm.
    4. Added the second randomised phase 3 otoprotection trial (ACCL0431,
       PMID:27914822, OR 0.31) alongside SIOPEL 6, and duloxetine for established
       painful CIPN (PMID:32663120). Two ASCO negatives are curated rather than
       omitted: acetyl-L-carnitine as a REFUTE item, and the finding that no agent
       prevents CIPN as the bound on duloxetine's claim.
    5. clinical_trials block for NCT00652132 and NCT00716976, both fetched.
    6. Four prevalence records, one per endpoint, each carrying the definitional
       caveat that makes the figures non-comparable: an age stratum for hearing
       loss, an upper bound for nephrotoxicity, a background statement for
       neuropathy, and an untreated-population rate for emesis.
    7. Added an Emetogenic Response node with nausea and vomiting. The receptor
       mechanism (5-HT3, NK1) is NOT asserted - the cited source describes the
       antiemetic classes, not the biology producing the emesis - and the edge
       into this node is INDIRECT_UNKNOWN_INTERMEDIATES because this arm is not
       established here as running through the transporter uptake that gates the
       four injury arms.
    8. therapeutic_agent rebound from CHEBI:26977 thiosulfate to NCIT:C1230 Sodium
       Thiosulfate. The old notes justified the looser term on the better one
       being absent from the term cache; that was not a real constraint, since the
       cache is populated by validation. The corrected reasoning is recorded in
       place rather than the old rationale quietly deleted.

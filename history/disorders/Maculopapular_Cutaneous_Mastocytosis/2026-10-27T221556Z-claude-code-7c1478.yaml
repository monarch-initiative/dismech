  summary: Bind the missing H2 agent and wire the H1 half to the H1 receptor antagonism
    module
  details: |
    The H1 and H2 Antihistamines treatment named both classes in its name and description but bound only the H1 agent, so the H2 half of its own claim was not machine-readable. NCIT:C29702 Histamine-2 Receptor Antagonist is now bound alongside it, supported by the treatment's existing citation, whose snippet reads 'Treatment with H1 and H2 histamine receptor blockers on demand'. No split was needed or made.

    An Antihistamine Occupancy of H1 Receptors node was added as a therapeutic_vulnerability conforming to h1_receptor_antagonism, and the treatment reaches it through target_mechanisms with treatment_effect ACTIVATES. This node is bound to the dermis, unlike the ones added to the systemic mast cell entries in the same pass, because this disease is skin-limited and the pruritus and flushing the H1 antihistamine addresses are cutaneous. It carries no downstream edge, since the relation between an antagonist and the mediator signalling it blocks is inhibitory.

    The H2 half is deliberately not wired. The h2_receptor_antagonism module is scoped to gastric acid secretion, and this entry's citation establishes that H2 blockers are used on demand without establishing the parietal-cell acid pathway that module describes.

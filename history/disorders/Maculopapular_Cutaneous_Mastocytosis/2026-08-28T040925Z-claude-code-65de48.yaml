  details: |
    Added molecular_functions: GO:0004714 (transmembrane receptor protein tyrosine kinase activity), modifier INCREASED, to the pathophysiology node "Constitutive KIT Activation in Skin Mast Cells" -- the node the KIT genetic entry lands on in the pathograph.

    Targeted from the genetic[].mechanism_activity_grounding QC metric (dismech.qc_plugins): the gene reached the mechanism graph but the node it landed on named no molecular function, so the pathograph stated what the cell could no longer do without stating what the protein could no longer do. Part of a 134-entry tranche.

    Term selection was not automated end to end. GO molecular-function annotations for the gene were pulled from MyGene.info as candidates, then chosen by hand against what the node actually claims -- the highest-ranked annotation is frequently wrong for this purpose (TP53's is copper ion binding, STAT3's is nuclear receptor activity), and generic terms such as protein binding say nothing about the gene product. Nodes whose gene has no clean characteristic activity (scaffolds, adaptors, complex members) were left ungrounded rather than bound to something vague. Every chosen CURIE was verified against OLS as a live, non-obsolete molecular_function before binding.

    Validated with linkml-validate (Disease) and just validate-terms (canonical labels plus MolecularFunctionTerm enum membership), both passing, along with check-duplicate-keys and the term-cache integrity and ordering checks. No other slot touched, no evidence added or changed.

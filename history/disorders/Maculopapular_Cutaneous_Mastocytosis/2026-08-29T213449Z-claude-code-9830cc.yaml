  summary: 'Review: Maculopapular Cutaneous Mastocytosis evidence re-read against
    cached sources'
  details: |
    Re-read all 11 cached references and re-verified all 37 evidence items. Every snippet is
    an exact substring of its cache. No fabricated quotes, no title-as-snippet, no missing
    caches. The main Named Entity Confusion risk for this disease - adult-vs-pediatric and
    cutaneous-vs-systemic mastocytosis - is handled unusually well: the pediatric
    non-codon-816 KIT spectrum and the adult/systemic D816V dominance are each backed by exact
    quotes, and the entry cross-points to the separate Systemic Mastocytosis entry rather than
    borrowing its evidence. No defects.

    Recorded for follow-up:
    - pathophysiology[Constitutive KIT Activation in Skin Mast Cells] asserts downstream MAPK
      and PI3K/AKT signaling and binds GO:0000165 and GO:0043491, but no cited abstract in the
      entry mentions either pathway.
    - The D816V imatinib-resistance claim appears in three places (pathophysiology
      description, genetic notes, treatment description, the last also naming midostaurin and
      avapritinib) and is cited nowhere.
    - phenotypes[Elevated Serum Tryptase] is graded SUPPORT on a quote about MPCM-large
      lesions having significantly *lower* tryptase; it supports the stratification sentence,
      not the phenotype, and the >20 ng/mL systemic-mastocytosis criterion is uncited.
    - PMID:19865100's "constitutive activation" claim rests partly on in-vitro functional
      characterization (COS cells), so the single HUMAN_CLINICAL grade is a mixed-source call.
    - prevalence omits measure_type, prevalence_class and rate_per_100000.

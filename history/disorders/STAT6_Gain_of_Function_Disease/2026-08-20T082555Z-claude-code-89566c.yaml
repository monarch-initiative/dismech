  summary: Correct IUIS table assignment to Table 2 with evidence
  details: |
    IEI grouping review. classifications.iuis_category corrected from 'immune dysregulation' (IUIS Table 4) to 'combined immunodeficiency with syndromic features' (Table 2). The IUIS 2024 update (PMID:41608114) enumerates STAT6 (AD GOF) among the ten gene defects new to Table 2, subtable 1, grouping it with the hyper-IgE-like syndromic entities rather than with the Table 4 dysregulation disorders; the previous assignment had read the disease's dominant allergic/type-2 phenotype as a Table 4 signal and carried no evidence at all. Added a verified evidence item quoting the IUIS enumeration. No phenotype, pathophysiology or treatment content changed. Consequently moved from the Immune Dysregulation IEIs grouping to Combined Immunodeficiency with Syndromic Features IEIs. Validated: count-verified-snippets 67/67 verified, validate, validate-terms, check-duplicate-keys.

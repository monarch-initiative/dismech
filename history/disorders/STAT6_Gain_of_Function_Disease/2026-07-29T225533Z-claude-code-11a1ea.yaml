  summary: Augment STAT6 GOF disease with openscientist deep-research findings
  details: |
    Integrated verified findings from an openscientist deep-research run (27 min, 5 iterations, 10 citations). Independently verified every DR-sourced PMID and snippet against fetched abstracts per the DR-as-leads SOP. Added: ligand/phosphorylation-independent D419N mechanism and two independent constitutively-active mouse models [PMID:40603028 knock-in D419N MODEL_ORGANISM+IN_VITRO; PMID:28653395 Stat6VT MODEL_ORGANISM] to the Constitutive STAT6 signaling node; two additional germline variants [PMID:37316763 D419H kindred; PMID:40502541 D519N] to the genetic node; ruxolitinib pharmacodynamic IN_VITRO evidence [PMID:37316763] and an independent dupilumab response [PMID:40502541] to treatments; and an independent lymphoma-association kindred [PMID:37316763] to the B-cell lymphoma predisposition node. Rejected DR errors: the report misstated STAT6 as HGNC:11364/OMIM:601512 [correct is hgnc:11368; MONDO:0957807 asserts it] and overstated PARP14 as a driver [PMID:28653395 title shows PARP14 LIMITS allergic skin disease], so PARP14 was not modeled as a driver. Falcon and the first openscientist attempt failed on proxy connection resets; openscientist succeeded on retry. Validated: schema/terms/references all pass; weighted compliance 96.4%.

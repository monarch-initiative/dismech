  summary: 'Create: STAT6 Gain-of-Function Disease'
  details: |
    Created new entry for STAT6 gain-of-function disease [HIES6, MONDO:0957807, OMIM:620532]. Curated from founding primary literature: Sharma et al. JEM 2023 [PMID:36884218], Baris et al. JACI 2023 [PMID:36758835], Suratannon et al. JACI 2023 [PMID:36216080], and the STAT6 GOF International Consortium review [PMID:38238227]. Pathograph: STAT6 GOF variant -> constitutive IL-4/IL-13/STAT6 signaling -> TH2 skewing with TH1/TH17 suppression -> IgE class switching + hypereosinophilia -> multisystem allergic disease. Phenotypes: atopic dermatitis, elevated IgE, eosinophilia, food allergy, asthma, eosinophilic GI disease, anaphylaxis, recurrent infections. Treatments: dupilumab and ruxolitinib, linked via target_mechanisms. Deep research: falcon run initiated, integration pending. No GeneReviews article exists as disease was first described in 2023. Validated with just validate; reference_title backfilled.

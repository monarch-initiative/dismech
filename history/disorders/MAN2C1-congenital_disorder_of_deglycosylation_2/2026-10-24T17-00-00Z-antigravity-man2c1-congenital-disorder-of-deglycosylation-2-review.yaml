  summary: Added Harrison's chapter classifications, enriched pathophysiology nodes with cellular components,
    locations, cell types, biological processes, and downstream phenotype links, expanded short snippets
    to full verbatim sentences, added phenotypes, and added diagnosis and treatments sections.
  details: 1. Added `classifications.harrisons_chapter` (`GENETICS_ENVIRONMENT_DISEASE`, `NEUROLOGIC`,
    `ENDOCRINOLOGY_METABOLISM`) with evidence from PMID:35045343. 2. Enriched pathophysiology nodes with
    `biological_scale`, `cellular_components` (`GO:0005829` cytosol), `locations` (`UBERON:0000955` brain,
    `UBERON:0001890` forebrain, `UBERON:0002336` corpus callosum), `cell_types` (`CL:0000540` neuron),
    `biological_processes` (`GO:0006517` protein deglycosylation, `GO:0007399` nervous system development,
    `GO:0021537` telencephalon development), and `downstream` edges to the phenotypes. 3. Expanded 3 short
    phenotype snippets (`< 6 words`) and short snippets in `inheritance` and `genetic` to full verbatim
    sentences from PMID:35045343 and PMID:37486637, added `category` and `frequency` to existing phenotypes,
    and added `Cerebellar vermis hypoplasia` (`HP:0001320`) and `Facial dysmorphism` (`HP:0001999`). 4.
    Added `inheritance` and `features` to `genetic`. 5. Added `diagnosis` (`Brain Magnetic Resonance Imaging`
    `NCIT:C16809` and `Whole Exome Sequencing` `NCIT:C101295`) and `treatments` (`Ventriculoperitoneal
    Shunt Placement` `NCIT:C168483` and `Multidisciplinary Supportive Care` `NCIT:C15747`).

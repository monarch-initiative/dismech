  details: |
    Answered the 2026-10-24 review. Removed the five unsourced phenotype frequency values: the founding cohort abstract names features without counts. Removed the brain location from the trigger and free-oligosaccharide accumulation nodes, because accumulation was measured only in proband-derived and HAP1 cells; also removed the generic neuron cell type from the malformation node. Added Tongue hamartoma (HP:0011802), Interhemispheric cyst (HP:0032327), Hypothalamic hamartoma (HP:0002444) and Brainstem hypoplasia (HP:0002365), quoting the PMID:35045343 cohort sentence, and wired the last three from the malformation node. Added a Hydrocephalus (HP:0000238) phenotype from PMID:41623318, noting that proband's 15q24.1q24.3 microdeletion, wired it from the malformation node, and retargeted the VP shunt to it. Added the exome-sequencing sentence and a CDDG2-specific MRI sentence from PMID:41623318 to the diagnosis rows, and rewrote the supportive-care explanation to say its snippet concerns contiguous-gene microdeletion syndromes. Validated with just validate (0 issues), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes and check-enum-values.

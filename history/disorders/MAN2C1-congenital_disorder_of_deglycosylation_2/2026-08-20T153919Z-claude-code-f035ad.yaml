  summary: Second-source MAN2C1-CDDG2 and add causality knowledge gap
  details: |
    The entry was built entirely on PMID:35045343. Added PMID:41623318, the only patient reported since the founding cohort (a novel pathogenic MAN2C1 variant in trans with a 15q24.1q24.3 microdeletion), and PMID:37486637, which recovered MAN2C1 independently as a novel polymicrogyria gene in a 275-family exome cohort. Both cited on the nodes and phenotypes they actually support rather than blanket-added.

    Added a KNOWLEDGE_GAP asking whether free-oligosaccharide accumulation is causal or a marker: the founding cohort establishes both ends of the chain independently but nothing links them, no accumulation measurement is in a neural cell type, and no dose-response is reported. The entry's own INDIRECT_UNKNOWN_INTERMEDIATES edge already admitted this; it is now explicit with two proposed experiments.

    Notes record that the 2026 case is a compound genotype whose phenotype should not be attributed wholly to MAN2C1, since the microdeletion spans other genes.

    Wired to the new cytosolic_deglycosylation module at three nodes.


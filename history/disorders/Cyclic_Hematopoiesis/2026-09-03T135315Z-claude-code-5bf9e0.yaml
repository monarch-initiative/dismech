  summary: 'Review round 1: phenotype connectivity, GeneReviews tag and counseling
    section, marrow claim-evidence match, floating node moved to progression'
  details: |
    Response to review round 1 on PR #10695. All four blocking items, plus five of the six suggestions.

    Item 3, phenotype connectivity, was the substantive one and is a repeat of a finding made on PR #10532 the same day: the mechanistic spine terminated at a pathophysiology node and never reached the clinical layer, leaving all eight phenotypes as orphan nodes. Oscillatory Granulopoiesis now has edges to the two haematologic phenotypes, Recurrent Infection and Mucosal Inflammation has edges to the six clinical ones, and the antimicrobial treatment declares target_mechanisms. Periodontitis is graded INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT, since it is cumulative destruction across repeated episodes rather than a single-nadir event. The lesson to carry forward is that a pathograph is not finished when the mechanism chain is complete; it is finished when the clinical layer is attached to it.

    Item 4 was a genuine claim-evidence mismatch. HP:0410254 asserts impaired proliferation and maturation of myeloid progenitors, but the only evidence cited reported a decreased marrow granulocyte count, which is a different statement. PMID:32083314, already cached and cited elsewhere in the file, says the thing the term asserts: BM HSPCs produced fewer granulocyte colony-forming unit colonies at the ANC peak. That is now the lead evidence, with the cytology finding retained as the individual-patient correlate.

    Item 1, the GeneReviews tag on PMID:20301705, and item 2, the unmined GENETIC COUNSELING section, were both cases of using a large structured source for the sections that answered the question in front of me and not reading the rest. The inheritance block now carries the transmission-risk statement and the de novo variant statement alongside the existing gonadal-mosaicism evidence. This is the same under-consumption pattern flagged on the desmoid entry, in a different form: there the source was full-text and read selectively, here it was a sectioned GeneReviews chapter and three sections were mined while a fourth was not.

    Suggestion 8 was accepted after initially arguing the other way. Absence of Leukaemic Transformation Risk was modelled as a pathophysiology node to make the point emphatically, but the reviewer is right that a negative clinical observation with no cell types, no processes and no edges is not a mechanism and renders as a floating node. It moved to progression as a Long-term outcome phase with all three evidence items intact, joined by Childhood and adolescence and Adulthood phases. The argument survives; it is simply no longer asserted as a mechanism. The relocation is recorded in notes rather than made silently.

    Also taken: the stub was deleted (5); the ELANE detection rate moved from prose epidemiology to a structured case_fractions record with cohort_size 51 (6); dental hygiene and periodontal maintenance added as a treatment with a target_mechanisms link, which matters here because periodontitis and gingivitis are both modelled as phenotypes and nothing previously addressed them (7); and the canine model publication slot repointed from the 1987 review to PMID:35904319, which is the source that can actually establish the AP3B1 genotype recorded on the same object (10).

    Not taken: suggestion 9, splitting ELANE Mutation and Neutrophil Elastase Misfolding into two nodes. The mutation and the misfolding it produces are one molecular event with no intervening step that any cited source distinguishes, and splitting would create an edge no evidence speaks to.

    Validation: 60/60 snippets verified (was 43/43), term validation passes, weighted compliance 100.0 percent, all content gates clean including check-causal-targets and validate-graphs.

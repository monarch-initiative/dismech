  summary: 'Create: Cyclic Hematopoiesis MONDO:0008090'
  details: |
    Created from PubMed literature directly. Both configured deep-research providers remain unavailable: openscientist.io returns a CloudFront 403 on POST and 401 on authenticated GET, and the cyberian backend returns 500. Candidate PMIDs were found by NCBI esearch, fetched with just fetch-reference, and read in full before any YAML was written.

    The pathograph is a loop rather than a chain, which is the point of the disease. ELANE mutation gives misfolded neutrophil elastase, which provokes ER stress and an unfolded protein response in granulocytic progenitors, which kills them; progenitor depletion then raises G-CSF, driving compensatory proliferation that repopulates the compartment until the UPR overtakes it again. The oscillation is the mechanism, not a symptom of it.

    Three deliberate modelling choices. First, Absence of Leukaemic Transformation Risk is recorded as its own node rather than as prose, because the naive inference from the gene shared with severe congenital neutropenia is wrong and is worth contradicting explicitly: SCN carries a 15-25 percent risk of MDS or AML after fifteen years of G-CSF and cyclic neutropenia carries none, with the divergence attributed to disease severity rather than to ELANE.

    Second, PMID:32299910 is attached to the UPR node with supports REFUTE. An inducible expression system showed impaired granulocytic differentiation without any UPR induction. It does not transfer straightforwardly, because the allele studied (p.G185R) is an SCN allele rather than a cyclic one, and that caveat is stated in the evidence explanation rather than left for a reader to infer.

    Third, the G193X Elane mouse carries one FAILS_TO_RECAPITULATE link. These mice do not become neutropenic - basal and stress granulopoiesis are normal - so the model fails at the defining phenotype. Recorded as a negative result because a model that fails at the key phenotype constrains the mechanism more informatively than one that succeeds.

    A quoting note worth flagging for future readers: the snippet from PMID:21285438 reads "G913X" where the paper means G193X. The typo is in the source abstract, quoted verbatim because snippets must match the cache exactly, and flagged in that evidence item's explanation and in notes.

    The canine model was checked rather than assumed. The 1989 review predates the molecular work, so PMID:35904319 was fetched to confirm the gene: canine cyclic hematopoiesis is a homozygous recessive AP3B1 frameshift with a 11-14 day period, not an ELANE disorder. The model link is graded PARTIALLY_RECAPITULATES with that stated as its limitation.

    Ontology notes. HPO has an exact term for the defining phenotype (HP:0040289 Cyclically decreased total neutrophil count) and a child adding the marrow finding (HP:0410254), so no generic neutropenia parent was needed. Filgrastim has no CHEBI term, so NCIT:C1474 is used as the therapeutic agent under NCIT:C15515 Colony-Stimulating Factor Therapy.

    Validation: 43/43 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean. Top-level references generated programmatically from cache frontmatter rather than typed.

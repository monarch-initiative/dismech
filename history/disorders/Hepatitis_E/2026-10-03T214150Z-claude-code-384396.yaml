  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for hepatitis E virus, organised around the two cycles the genotype decides. Hosts: Homo sapiens (NCBITaxon:9606, host of all four human genotypes and sole host of the human-restricted genotypes 1 and 2), Sus scrofa domesticus (NCBITaxon:9825, domestic pig) and Sus scrofa (NCBITaxon:9823, wild boar) as the principal reservoirs of genotypes 3 and 4, and deer bound at family level to NCBITaxon:9850 (Cervidae) because the cited sources say deer without naming a species. No vectors: HEV has no arthropod vector. Three stages: asymptomatic carriage in the porcine and wildlife reservoir (PMID:28944602 for pig and wild boar as most important reservoirs and for subclinical carriage; PMID:37376687 for deer among the infected mammals), zoonotic foodborne transmission to humans (PMID:37376687, the transplant-recipient survey naming undercooked pig, deer and boar; graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS because the review reports it), and the human-restricted waterborne cycle of genotypes 1 and 2 (PMID:28944602; plus the entry's existing waterborne snippet copied with its OTHER grading unchanged). One new reference fetched: PMID:28944602. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

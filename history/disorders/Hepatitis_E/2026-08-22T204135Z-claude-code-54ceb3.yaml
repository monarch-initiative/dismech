  summary: 'Review fix: add chronic HEV treatments; correct ''no treatment'' claim'
  details: |
    Addresses a CRITICAL review finding on PR #9260. The entry previously curated no treatment against the chronic-infection node and asserted in a discussion that the absence was deliberate. That conflated 'no licensed therapy' with 'no therapy' and contradicted a source the entry already cited: PMID:37376687 states that the first-line treatment is ribavirin after reduction of immunosuppressive therapy. Added three treatments wired to the relevant nodes - reduction of immunosuppressive therapy (ACTIVATES the host-immune-response central effector), off-label ribavirin (INHIBITS the chronic-infection node), and pegylated interferon-alpha as salvage - and rewrote the KNOWLEDGE_GAP so it records the real gap, which is licensing and randomized-trial evidence rather than a therapeutic void. Also fixed two further review findings in this file: the orphan 'Extrahepatic Manifestations' node is now wired to the host-immune-response node with an INDIRECT_UNKNOWN_INTERMEDIATES edge, and GO:0006954 (inflammatory response) on the immune-control node was a false match, replaced by GO:0002250 (adaptive immune response) and GO:0009615 (response to virus). Description now qualifies that Hecolin is licensed only in China. Validation: schema, terms and snippets all clean.

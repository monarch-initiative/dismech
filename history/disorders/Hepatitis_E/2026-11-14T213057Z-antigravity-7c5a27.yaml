  summary: Review and enrich Hepatitis_E
  details: >-
    Audited Hepatitis E (MONDO:0005788) and repaired its check_genereviews_baseline missing-synonyms defect and retired_support_prose defect. Added exact MONDO synonyms, classifications (INFECTIOUS_DISEASES, GASTROINTESTINAL backed by PMID:39039260), structured prevalence (global 12.5% anti-HEV IgG seropositivity and 6.1% US genotype 3 seroprevalence from PMID:37376687), and two-phase progression (acute self-limited vs chronic immunocompromised disease). Enriched pathophysiology nodes with GO biological_processes (GO:0019079 viral genome replication, GO:0006954 inflammatory response), UBERON:0002107 liver locations, and sourced causal edges to five newly curated HPO phenotypes (Jaundice, Chronic Hepatitis, Acute Hepatic Failure, Cryoglobulinemia, Autoimmune Hemolytic Anemia). Grounded HEV RNA NAAT diagnosis to NCIT:C20055, grounded Pegylated Interferon Alpha salvage therapy to CHEBI:753470 and therapeutic_modality OTHER, replaced retired Marked PARTIAL prose on Ribavirin with directness INDIRECT, and removed self-referential revision prose.

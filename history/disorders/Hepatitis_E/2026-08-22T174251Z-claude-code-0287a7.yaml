  summary: 'Create: Hepatitis E'
  details: |
    New entry completing the viral hepatitis series. Modelled around the genotype split rather than as a single disease: genotypes 1/2 are human-restricted and waterborne, genotypes 3/4 zoonotic and foodborne, and the genotype is curated as a property of the infectious agent because it determines the clinical entity. Five nodes with the host immune response as the central_effector, since the literature identifies host immunity interacting with genotype - not viral virulence - as the determinant of outcome. Two host states break the usual course in opposite directions and are curated as separate consequence nodes: immunosuppression permitting chronic genotype 3 infection and cirrhosis (the only chronic arm of hepatitis E), and pregnancy carrying up to 30% mortality. Extrahepatic manifestations are curated as their own arm because they occur where hepatitis is mild or absent. Two KNOWLEDGE_GAPs record the unexplained pregnancy case fatality and the fact that no treatment is approved for chronic infection - the absence of a treatment against that node is the finding, not an omission. Validation: linkml-validate clean; linkml-term-validator passed; 14/14 evidence snippets verified against cached references.

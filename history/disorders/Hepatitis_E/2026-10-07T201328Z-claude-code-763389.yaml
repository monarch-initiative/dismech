  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). The entry had no diagnosis block; added one row for anti-HEV IgM and IgG serology and HEV RNA testing, cited to the review already used throughout the entry (PMID:37376687, full text): antibody diagnosis of acute infection, RNA as the marker of active infection and the test for immunocompromised patients, RNA persistence for chronic infection, RNA for treatment monitoring, and EBV and CMV cross-reactivity of antibody assays. Measurements: LOINC:14212-5 (IgM), LOINC:14211-7 (IgG) and the method-less HEV RNA panel LOINC:95207-7. The review gives two chronic-infection durations (three months and greater than 6 months); both are disclosed in the row notes. No band: no diagnostic threshold is stated in the cited source. The EASL 2018 HEV guideline has only a non-diagnostic PubMed abstract and was not cited.

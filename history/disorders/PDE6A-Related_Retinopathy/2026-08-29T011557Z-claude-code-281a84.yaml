  details: |
    # Fixes: PDE6A-Related Retinopathy

    File: `/home/user/dismech/kb/disorders/PDE6A-Related_Retinopathy.yaml`
    Review: `reviews/PDE6A-Related_Retinopathy.md` (2 MAJOR + 7 MINOR + 1 informational)

    ## Findings fixed

    ### 1. MAJOR — plasma cGMP presented as confirming the retinal mechanism in humans (fixed)
    `pathophysiology` → *cGMP Accumulation and CNG Channel Constitutive Opening*:
    - Node `description` rewritten. The claim is now "plasma cGMP was about twice control
      levels in one PDE6A family", explicitly labelled a candidate biomarker observation
      rather than a measurement of retinal cGMP, and it names the three limits the entry had
      omitted: a single pedigree (seven homozygous siblings), the co-segregating ABCA4 variant
      in seven family members, and the absence of any cited route by which photoreceptor cGMP
      would raise plasma levels. "Confirming ... applies in vivo in humans" is gone.
    - The PMID:27820873 item is regraded `SUPPORT` → `PARTIAL` with a rewritten explanation.
    - Added a second PMID:27820873 item quoting the authors' own conclusion verbatim
      ("indicating a possible role for cGMP measurements ... after further investigations"),
      so the source's hedge is in the data, not just in the curator's prose. Same
      `HUMAN_CLINICAL` grading as the sibling item — no grading divergence introduced.

    ### 2. MAJOR — both `progression` items rested on content-free snippets (fixed)
    - **Phase 0** *Presentation with established visual impairment*: the fragment "from 44
      families were included" is replaced by three propositional items —
      (a) PMID:39218074 "The mean age (± standard deviation, range) was 34.8 years
      (± 17.4, 12-76) at baseline, with a mean follow-up time of 4.8 years." for the baseline
      age; (b) PMID:33057649 "Thirty patients were homozygous ... Twenty-seven patients were
      heterozygous for 2 different PDE6A variants each." for the cohort size, with the
      arithmetic (30 + 27 = 57) in the explanation; (c) PMID:33057649 "disease was highly
      symmetrical ... mild or moderate in 90% of patients ..." for the symmetry and severity
      claims in `notes`.
      - **"the largest reported" is deleted** — no cited source makes that comparative claim.
      - `age_range` "Adulthood (cohort mean age 35-40 years)" → "Adulthood (cohort mean
        baseline age approximately 35 years)", matching the quotable 34.8-year figure; `notes`
        updated to match.
      - Note on why the obvious quote could not be used: the abstract sentence "Fifty-seven
        patients (32 female patients [56%]; mean [SD], 40 [14] years) from 44 families were
        included." fails snippet validation because `conf/reference_validator_config.yaml`
        strips purely numeric bracketed spans (`[14]`) from the snippet while the cached text
        keeps them, so a verbatim quote spanning that SD cannot match. I did not touch the
        config. The count is instead sourced from the bracket-free homozygous/heterozygous
        breakdown, and the reason is recorded in that item's explanation.
    - **Phase 1** *Slow progressive decline*: "This study highlights the natural history of
      PDE6A-retinopathy." replaced by "There were statistically significant changes during the
      follow-up period in terms of BCVA, hyperautofluorescent ring area, and the EZW." (the
      three progression measures asserted in `notes`), plus the mean-age/4.8-year follow-up
      sentence, plus the conclusion sentence "Most patients in this cohort had mild BCVA loss,
      and slowly progressive disease, based on FAF and OCT measurements." for the "slowly
      progressive" characterization.

    ### 3. MINOR — edge snippet was a subjectless fragment (fixed)
    `pathophysiology[1].downstream[0]`, PMID:31207907. The report suggested extending the
    quote to "The discovery of disease-causing mutations in the PDE6 α and β genes [17,18]
    provided an explanation for excessive photoreceptor cGMP levels." — that sentence spans an
    inline numeric citation marker and so cannot be snippet-verified (same stripping rule as
    above; confirmed by running the audit). I substituted a bracket-free, propositional
    sentence from the same review that supports the edge directly: "PDE6, which is located to
    the membranous disks within photoreceptor OS, hydrolyses cGMP, leading to the closure of
    CNGC and a hyperpolarization of the OS due to continued activity of NCKX." The explanation
    records what the citation-marker sentence says and why it is not quoted.

    ### 4. MINOR — CNG-channel/ion-influx clause unsupported by either snippet (fixed)
    Added a PMID:31207907 item to the node quoting "The CNGC opening allows for an influx of
    Na+ and Ca2+ into the OS, yet, at the same time K+ and Ca2+ ions are constantly extruded
    via the Na+/Ca2+/K+ exchanger (NCKX)." (the immediately preceding cGMP-binds-and-opens
    sentence again spans `[13]` and is paraphrased in the explanation instead of quoted).
    The node description now also states that protein kinase G is the other proposed
    extra-phototransduction target of excess cGMP and that this entry models the CNG-channel
    arm only — the commitment the review flagged as silent.

    ### 5. MINOR — "likely disrupts" hardened to "directly disrupting" (fixed)
    *PDE6 Alpha Subunit Loss-of-Function* description now says the variants "are therefore
    inferred to disrupt" catalytic function and names the basis (domain location, not a
    functional assay). The PMID:7493036 explanation says the same. Grading left as `OTHER`,
    which the review called defensible.

    ### 6. MINOR — `VERY_FREQUENT` not carried by the quoted sentence (fixed)
    *Reduced visual acuity*: description rewritten to state the severity distribution and the
    cohort mean acuity rather than "present in nearly all patients"; the existing explanation
    now says the 90% sentence gives severity, not frequency; and the mean-BCVA sentence
    ("0.43 (0.48) logMAR (Snellen equivalent, 20/50)") is added as the basis for the band,
    labelled a clinical estimate per `docs/frequency-evidence-guidelines.md`. Band kept at
    `VERY_FREQUENT`.

    ### 7. MINOR — `FREQUENT` field constriction generalized from one family (fixed)
    *Constriction of peripheral visual field*: the single-family explanation now says so
    explicitly (seven homozygous siblings, seven also carrying an ABCA4 variant) and that it
    supports the association only. Added the cohort-scale item from PMID:33057649 ("The median
    visual field area with object III4e was 660 square degrees ...") as the band's basis,
    with the explanation stating that the cohort reports no proportion, so `FREQUENT` remains
    a clinical estimate. Band kept.

    ### 8. MINOR — uncited AIPL1 gene-therapy comparison, stated twice (fixed)
    Both instances removed. The top-level `description` now reports the PDE6A trial outcome on
    its own terms ("more cautionary ... than those preclinical results predicted") and points
    to `AIPL1-Related_Retinopathy` as the chaperone-defect counterpart while stating that this
    entry cites no AIPL1 trial and makes no claim about its outcome. The treatment description
    drops "a materially different translational story than the contemporaneous AIPL1 gene
    therapy trial, which showed clear benefit". I did not add an AIPL1 trial citation:
    sourcing another disease's trial outcome is out of scope for a defect fix, and the
    contrast is not load-bearing for anything in this entry.

    ### 9. MINOR — FDA/regulatory claim not covered by either snippet (fixed)
    Added a third PMID:33809319 item to *Avoidance of PDE5 Inhibitors* quoting the full
    regulatory sentence ("Important regulatory agencies such as the U.S. Food and Drug
    Administration ... warn about the lack of controlled clinical data on the safety of
    sildenafil in patients with retinitis pigmentosa or with a family history of the
    disease."). Existing two items untouched; description unchanged, since it is now sourced.

    ### 10. INFORMATIONAL — left alone as instructed
    The `notes` PDE6A/PDE6B (rd1) disambiguation, the deliberate omission of nyctalopia and
    bone-spicule pigmentation for lack of gene-specific citations, the honest reporting of the
    negative human trial, and the `MODEL_ORGANISM` gradings were all left exactly as they were.

    ## Intentionally skipped

    Nothing in the report was skipped outright. Two adjustments differ from the report's
    literal suggestion, both because of the numeric-bracket stripping rule (findings 2 and 3);
    each is documented in the affected evidence item's explanation so the next curator does
    not re-attempt the un-quotable sentence.

    ## References

    No new references fetched, and no cache file touched. Every added evidence item quotes a
    paper already cited in this entry and already present in `references_cache/`
    (PMID:33057649, PMID:39218074, PMID:31207907, PMID:27820873, PMID:33809319).


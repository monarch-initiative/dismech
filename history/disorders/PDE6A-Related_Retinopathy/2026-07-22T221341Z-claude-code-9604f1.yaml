  summary: 'Create: PDE6A-Related Retinopathy'
  details: |
    Fresh curation of PDE6A-related retinopathy (MONDO:0700224, historically RP43), continuing the long-tail single-gene retinopathy list from issue #4008 after RDH5 (PR #6816), RLBP1 (PR #6822), and AIPL1 (PR #6825). Deliberately picked as the direct mechanistic pair to AIPL1: PDE6A encodes the alpha catalytic subunit of the very PDE6 holoenzyme that AIPL1 chaperones -- this entry models the client-protein side, with a 4-node pathophysiology chain (PDE6A catalytic loss-of-function -> secondary destabilization of the whole PDE6A/PDE6B/PDE6G heterotetramer -> cGMP accumulation and CNG channel constitutive opening, with direct human plasma-cGMP biomarker evidence -- not just animal models -> rod photoreceptor apoptosis, conforms_to photoreceptor_degeneration#Rod Photoreceptor Apoptosis). 14 PMIDs independently fetched and verified. Found and fixed 2 real snippet errors before commit: a Greek alpha/beta character quote (same known Windows encoding risk as prior sessions) and a PDF/abstract-text line-wrap crossing a bracketed statistic -- both replaced with clean ASCII single-line substrings. Made one deliberate evidence-scope decision worth flagging: no PDE6A-specific citable source was found for nyctalopia or spicular/bone-spicule fundus pigmentation despite both being classic RP-class hallmarks -- rather than support them with a non-gene-specific citation, they are omitted; documented this explicitly in the entry's notes field. Also explicitly caution in notes against conflating PDE6A with the classic rd1 mouse model, which is actually a PDE6B (not PDE6A) defect -- verified this distinction directly from the primary 1990 Nature paper (PMID:1977087) rather than assuming. Includes a genuinely important negative-result contrast to AIPL1's successful trial: a completed PDE6A AAV8.hPDE6A Phase I/IIa gene therapy trial (PMID:40825661, published 2026) did NOT improve visual function and showed a safety signal (central retinal thinning), despite favorable mouse (Schon 2017) and canine (Mowat 2017) preclinical data -- modeled honestly as a cautionary translational story rather than glossing over the negative outcome. Also added a treatment-caution entry for PDE5-inhibitor (sildenafil/vardenafil) cross-reactivity with retinal PDE6, citing the FDA's own explicit warning for RP patients/families. New MONDO:0700224 enum value manually appended in sorted order to cache/enums/diseaseterm_f618932bb23f.csv. Full validation suite (schema, references, terms) passes clean.

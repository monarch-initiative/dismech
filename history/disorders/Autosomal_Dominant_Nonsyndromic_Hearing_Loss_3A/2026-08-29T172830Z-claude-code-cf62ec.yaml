  summary: 'Review round 1: address DFNA3A review items'
  details: |
    Addressed all four blocking items and five of the seven suggestions from the automated review on PR 10075. Blockers: rebound audiometry from NCIT:C25294 Laboratory Procedure to NCIT:C38036 Audiometric Test; downgraded Failure of Organ of Corti Maturation and Secondary Sensory Hair Cell Degeneration from ESTABLISHED to PROVISIONAL, with the reason stated in the node descriptions, namely that the three supporting papers share authorship, one transgenic line and one allele at a non-physiological expression ratio with no human histopathology, so convergence within a lab is not independence; added two HUMAN_CLINICAL evidence items to the OBLIGATE defining phenotype so it no longer rests solely on the background sentence of an oocyte study; and added a top-level references block with the GeneReviews tag on PMID:20301449. Suggestions taken: removed the uncited assertion that dominant alleles cluster in the E1 parahelix, replacing it with the specific alleles this entry curates and a note that the deep-research report's lead citation for the general rule is the one reference its own relevance check flagged off topic; softened the uncited cochlear implant outcome claim to state the rationale and record that no DFNA3A-specific outcome study exists; rebound the calcium term from GO:0006874 intracellular calcium ion homeostasis to GO:0019722 calcium-mediated signaling, which matches what the quoted intercellular signalling result says; made bilaterality and onset structural by rebinding the defining phenotype to HP:0008619 and adding a CONGENITAL onset descriptor with a note that no age-of-onset series exists; split the device treatment into hearing aid amplification and cochlear implantation; and added a MODIFIER genetic entry for a trans loss-of-function allele. Two suggestions could not be taken as proposed and the reasons are recorded. The suggested NCIT device terms C183182 Hearing Aid and C157820 Cochlear Implant are not reachable from NCIT:C25218 and so fail the TreatmentActionTerm dynamic enum; both split treatments are bound to NCIT:C49236 with the device distinction carried by therapeutic_modality, and the reason is written into the entry. The suggested OMIM mapping cannot be expressed at all: the DiseaseMappings class carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings, with no OMIM slot, which is a schema gap rather than a curation omission. Revalidated: just validate with all snippets verified, just validate-terms, just check-entity-refs, and scripts/check_reference_titles.py.

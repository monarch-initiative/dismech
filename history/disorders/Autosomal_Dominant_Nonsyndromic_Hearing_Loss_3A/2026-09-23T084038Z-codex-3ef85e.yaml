  summary: Review DFNA3A variant scope, cochlear mechanisms and experimental therapy
    evidence
  details: |
    Reviewed the entire DFNA3A entry, its CREATE/EDIT history and the matching OpenScientist deep-research report, including scientific findings, bibliography and citation sidecar. No prior REVIEW and no overlapping PR among 125 open PRs at origin/main 4e698c6909d. GJB2-associated genetic hearing loss is within scope; infectious diseases and environmental diseases/poisonings remain excluded. Named-entity preflight passed MONDO:0011103, GJB2 and OMIM:601544. The report's incorrect MONDO/PHGDH material was not imported.

    Read the cached full texts of PMID:21484990 (family audiograms, ascertainment, haplotypes and discussion), 31160754 (expert-panel variant interpretation, case-control methods/results, clinical course and limitations), 33443819 (syndromic p.Met34Lys, mosaic parent, trans c.35delG and rat keratinocyte localization), 31705875 (KID p.Asp50Asn patient keratinocytes, siRNA selectivity, functional assays, transcriptome and skin-graft limitations), 25625422 (KID connexin interactions, channel assays and discussion), and 40059830 (editing, HeLa dye transfer, newborn explants, adult delivery, histology and auditory-efficacy limitations). Refreshed the original human/functional/model abstracts through just fetch-reference, including 9139825, 9529365, 12064630, 12700168, 16009703, 18793701, 19712724, 20858605, 22547955, 22695344 and 12768774. Read additional primary abstracts 11354642, 17462767 and 29575629. Full-text retrieval was attempted; an unavailable letter (9620796) and a failed 9856479 lookup were not quoted as evidence. PMID:12522692 and the older GeneReviews abstract were read as contextual sources, not imported as current testing guidance.

    The historical M34T/101T>C dominant attribution in PMID:9139825 was still being used positively for inheritance, genotype, the auditory endpoint and profound severity, despite the entry acknowledging its refutation. Removed that use. Retained the paper's actual cochlear-expression observation only as anatomical context with NO_EVIDENCE for reduced coupling. PMID:9529365 challenged dominant attribution; the later ClinGen consensus PMID:31160754 classifies p.Met34Thr and p.Val37Ile as pathogenic for recessive hearing loss with incomplete penetrance and variable expressivity. This is not a claim that M34T is benign or that GJB2 lacks a dominant association. The consensus also illustrates why in-vitro inhibition alone cannot assign inheritance.

    Human observations replace the disputed founding pedigree. The p.Asp46Asn families share a village and haplotype consistent with a founder; they are not independent variant events. Most evaluated members had postlingual first-decade onset, with two prelingual cases and severe-to-profound progression in one. The original study did not functionally test D46N. PMID:11354642 reports isolated profound loss with de novo R75W and recognizes the same allele with keratoderma. ClinGen's dated Definitive dominant GJB2 assertion lumps hearing loss with or without skin findings; this is not a DFNA3A-only assessment. Removed invented frequency estimates and an unbound absence-of-systemic-features phenotype. Added prelingual, postlingual and progressive findings with verified HPO terms and family-specific scope.

    Replaced 'assembly competent' as a universal initiating requirement and 'degradation' as the channel mechanism. W44C and R75W co-expression support functional inhibition; neither protein degradation nor an exclusive physical docking mechanism is established by the quoted assays. Retained the W77R recessive comparator. A historical c.299_300delAT dominant-family report does not establish dominant truncation pathogenicity or haploinsufficiency. The syndromic M34K trafficking experiment and proposed trans c.35delG severity effect belong to the allelic differential, not an established DFNA3A modifier. The broader KID experiments do not establish a universal syndromic/nonsyndromic gain/loss-of-function dichotomy.

    Corrected the Gjb6 T5M comparator: homozygotes had mild approximately 15-dB hearing loss, normal electrical coupling in developing cochlea, impaired biochemical coupling and reduced connexin levels. This does not isolate biochemical coupling as the sole cause or establish the DFNA3A tissue mechanism. The original R75W study established two independent transgenic lines; subsequent work extends that allele/model system. Preserved P5–P12 sensory-cell development and isolated outer-hair-cell physiology support a supporting-cell contribution, but absent DPOAEs are not direct evidence of cell death. Normal endolymphatic resting potential does not measure cortilymph potassium or prove all endolymph homeostasis normal. Marked cortilymph potassium disruption HYPOTHETICAL, qualified indirect causal edges, and removed the model's incorrect FAILS_TO_RECAPITULATE link to a different compartment. The measured normal potential is retained as a model feature and NO_EVIDENCE for the cortilymph hypothesis.

    The full 2025 base-editing paper separates functional HeLa rescue from cochlear plaque morphology. HeLa on-target editing of 46.8% includes bystanders; WT-only repair was 28.03%. Newborn P0 explants were treated ex vivo. Live mice were adults aged 9–30 weeks, with histology two weeks after semicircular-canal delivery. Baseline ABR characterized the model; no post-treatment hearing-rescue result was reported, and the authors explicitly require larger/longer experiments. Neither hearing failure nor hearing rescue is inferred from missing follow-up data. Bystander plaque appearance does not establish comprehensive editing safety.

    Recovered the overlooked primary RNAi study PMID:15857852. The cached abstract reports more than 70% knockdown and hearing protection. Read the author-uploaded full article through ResearchGate (https://www.researchgate.net/publication/7879947_In_vitro_and_in_vivo_suppression_of_GJB2_expression_by_RNA_interference), including results, discussion, methods and figure legends. The publisher PDF returned 403, CiteSeer PDF returned 404, ResearchGate cache retrieval returned 403 and its download link failed, so only the generated PMID abstract is committed. The full text shows concomitant R75W plasmid/siRNA round-window administration in adult mice and ABR at 72 hours. In-vivo selectivity depended on two human/mouse mismatches; endogenous human GJB2 was silenced in cell culture. This is acute prevention in a transfection model, not human mutant-versus-wild-type discrimination or reversal of the inherited developmental lesion. The 2019 KID study is a separate allele-specific keratinocyte result. Removed claims that DFNA3A-related alleles and cochlear delivery had never been attempted.

    Read current ClinicalTrials.gov API records. The GJB2 query returned eight records; DFNA3A returned two via expanded matching: NCT07627971 and NCT05402813. SONIX is a recruiting phase 1/2 SKY-GJB2 trial (last posted update 2026-08-27), requiring biallelic pathogenic/likely pathogenic GJB2 variants and explicitly excluding dominant nonsyndromic GJB2 loss. The ordinary NCT cache lacked eligibility, so generated a separate API-URL cache for the exact exclusion. The Otoconex observational study's official title is recessive DFNB1A/DFNB9; its broad public eligibility does not establish a dedicated DFNA3A cohort. Neither record is represented as an available DFNA3A intervention. Corrected the broad no-human-GJB2-trial statement without claiming a DFNA3A trial exists.

    Used the full Genetic Hearing Loss Overview (NBK1434) across clinical hearing definitions, diagnostic panel/genomic testing and VUS limits, hearing habilitation, serial follow-up, noise protection and dominant transmission counseling. The full GJB2 recessive chapter (NBK1272) informs the allelic differential and confirms the outdated nature of universal first-line single-gene testing. Recessive outcome estimates and unconditional intact-auditory-nerve claims are not transferred to DFNA3A. Added device qualifiers to specific rehabilitation/surgical actions and removed internal enum commentary from clinical treatment text. Transmission of a dominant allele is distinguished from severity, age of onset and cutaneous expression.

    Research completeness cross-check: clinical phenotypes and family natural history are represented without fabricated frequencies; no supported additional disease subtype requires creation; mechanisms retain measured allele-specific data and explicit uncertain tissue steps; treatment/trial coverage includes current registry scope and the previously omitted early RNAi result; genetics distinguishes dominant, recessive and syndromic interpretation; diagnostics use current broad testing and no unvalidated biomarker; references were checked against titles and full content where available; overall consumption corrects several report claims rather than copying them. The report's POU4F3 modifier claim was investigated in full PMID:39809934: a DFNA15 family and 293T regulatory experiments propose GJB2/STRC/CDC14A effects on POU4F3 disease, not an established POU4F3 modifier of DFNA3A. This and generic newborn screening, OTOF trials and syndromic trans-allele severity are not blocking missing DFNA3A mechanisms. PMID:29575629 extends dominant syndromic/nonsyndromic variation but does not establish all of its alleles as nonsyndromic from the abstract alone.

    All caches were generated with just fetch-reference; no cache Markdown was hand-created/edited and the frozen dataset-accessions JSON was not accessed. New evidence titles were taken from and checked against generated metadata and source content. The primary mechanistic source quotes were checked for claim alignment as well as exact match. Final schema, terms, quotations, history, causal/entity links, qualifier terms, GeneReviews coverage, source-defect/snippet-boundary checks and snippet/title/grading ratchets are being completed. The PR link will be recorded after initial independent review, batching it with any feedback. Author COMMENT, independent approval and green CI are separate gates.

    Final local validation passed: schema, ontology, 54/54 exact quotations, history, causal/entity links, four qualifier labels, both GeneReviews identities, snippet boundaries, source-defect check and all length/title/grading/reference-title ratchets. Staged hooks normalized generated-cache whitespace and then passed; the post-hook quotation check also passed.

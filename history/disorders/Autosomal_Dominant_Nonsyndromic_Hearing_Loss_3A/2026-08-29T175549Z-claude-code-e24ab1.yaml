  details: |
    Second review round. The blocking item was a CI failure I introduced: two folded scalars ended a line with 'keratitis-', so YAML folding rendered 'keratitis- ichthyosis-deafness syndrome' with a space inside the compound. Reflowed both so the compound stays on one line, rather than baselining them - the baseline exists to admit pre-existing findings, not new ones. Three non-blocking items also taken. Moved the NCIT-enum rationale out of the Hearing Aid Amplification description and into notes, since description renders as clinical content on the disorder page and that text is curation-process reasoning; kept the reasoning because it stops the next curator re-proposing NCIT:C183182 and NCIT:C157820, which are in the label cache but not in the treatmentactionterm enum cache. Rewrote the Cochlear Implantation description, which still read as the merged treatment covering both devices after the split. Withdrew onset_category CONGENITAL on the obligate hearing-loss phenotype: the entry's own note said no age-of-onset series exists and that dominant GJB2 pedigrees with later progressive loss are reported, so the enum asserted more than the evidence carries, and a consumer filtering on onset_category would never see the qualification. The onset block keeps the note explaining why the slot is unset. Revalidated: just validate 46/46 snippets, check-folded-hyphens, check-entity-refs, check-duplicate-keys.

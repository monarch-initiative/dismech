    Rebound the bilateral sensorineural phenotype to HP:0000407 Sensorineural hearing impairment because no cached DFNA3A source states laterality, replacing its onset snippet with the PMID:21484990 sentence that establishes the sensorineural type and adding the no-syndromic-features sentence. Added Congenital sensorineural hearing impairment (HP:0008527) and High-frequency sensorineural hearing impairment (HP:0001757) from the DFNA3A row and text of the 2023 DFNA narrative review (PMID:37371710). Enriched the progressive and postlingual phenotypes with the same table row and recorded CHILDHOOD onset on the postlingual phenotype. Wired both new phenotypes from Sensorineural Auditory Dysfunction and updated the renamed downstream target. Updated description, notes (uncached phenotype leads: OMIM 601544 synopsis, retired GeneReviews NBK1536, the original W44C/W44S/C202F/R184Q/D179N family reports) and the references list. PubMed, Europe PMC, Orphadata and OLS were unreachable from the curation environment, so only already-cached references were used. Validation: just validate, count-verified-snippets (61/61), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions all passed. After CI's check-snippet-length gate flagged a four-word snippet on the high-frequency phenotype, it was replaced by the full review sentence it came from.

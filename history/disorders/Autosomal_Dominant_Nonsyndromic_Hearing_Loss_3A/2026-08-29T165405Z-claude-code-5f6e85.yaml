  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 3A'
  details: |
    Created the DFNA3A entry, the dominant nonsyndromic GJB2 hearing loss, as the mechanistic counterpart of the recessive DFNB1 disease at the same locus. Deep research: openscientist, research/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_3A-deep-research-openscientist.md. The report materially changed the entry rather than confirming it. The first draft modelled the cochlear step as endolymphatic potassium recycling and loss of the endocochlear potential, which is the standard account of GJB2 deafness. The report surfaced the R75W dominant-negative transgenic mouse work showing that the endocochlear potential is normally sustained and the stria vascularis is structurally intact, while the organ of Corti fails to form its tunnel and extracellular spaces. The pathophysiology was rewritten: the primary lesion is now a developmental failure of the supporting-cell scaffold, the potassium node was relocated to cortilymph, hair cell loss is downstream, and the normal endocochlear potential is curated as a REFUTE item against the endolymph account. The report also supplied the R75W hemichannel-versus-gap-junction dissociation, the connexin 30 T5M knock-in showing biochemical coupling can fail while electrical coupling is normal, the D46N Iranian founder families, the M34K endoplasmic reticulum retention mechanism, and the AAV adenine base editing result that replaced a weaker allele-specific siRNA citation as the lead therapeutic entry. Claims from the report that were NOT adopted: its suggested MONDO:0011152 for the disease, which resolves to PHGDH deficiency; CL:0002355 for a supporting cell lineage, which resolves to primitive red blood cell; NCIT:C50071 for hearing aid, which resolves to Mixer Device; NCIT:C15845 for cochlear implant, which resolves to a nutrition research concept; and NCIT:C16410 for gene therapy, which resolves to Centrifugation. Eight of nineteen labelled terms in that report were mislabelled. A curator error was also caught and fixed during this session: the reference_title for PMID:25625422 was written from memory and did not match the cached title. A disagreement in the literature about whether the R75W allele is syndromic or nonsyndromic is recorded in the entry notes and in the animal model description rather than resolved. Validated with just validate, 42 of 42 snippets verified, plus just validate-terms and just check-entity-refs.

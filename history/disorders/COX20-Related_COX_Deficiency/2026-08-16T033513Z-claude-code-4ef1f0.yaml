  details: |
    Weekly compliance sweep focused on taxonomies/classification for metabolic disorders. Added a classifications block: harrisons_chapter GENETICS_ENVIRONMENT_DISEASE, ENDOCRINOLOGY_METABOLISM and NEUROLOGIC, mechanistic_category 'mitochondrial disease', icimd_category complex_iv_subunits_and_assembly_factors. NEUROLOGIC is added here and not on the sibling COX assembly entries because COX20-related disease uniquely presents as a slowly progressive cerebellar and extrapyramidal syndrome with sensory axonal neuropathy rather than a fatal infantile encephalo-cardio-myopathy. Added evidence to all seven previously unsupported causal edges using already-cached PMID:23125284, PMID:30656193 and PMID:31079202. Validated with just validate for schema, terms and references, just count-verified-snippets reported 21/21 verified, and just check-title-snippets is clean. Weighted compliance moved from 81.8 to 89.3 percent.

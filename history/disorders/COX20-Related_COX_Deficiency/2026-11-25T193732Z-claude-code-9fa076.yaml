  summary: 'Gene-family review: COX20'
  details: |
    Bound the COX20 genetic record's autosomal recessive inheritance block to HP:0000007. COX20 stays CAUSATIVE: ClinGen rates it Definitive (AR) for mitochondrial disease (MONDO:0044970), recorded in the note rather than as gene_disease_validity because that concept is broader than this entry's MONDO:0033645. The COX20 activity node keeps GO:0030674 protein-macromolecule adaptor activity, matching COX20's role in stabilising newly synthesised MT-CO2 and presenting it to SCO1/SCO2 (PMID:24403053).

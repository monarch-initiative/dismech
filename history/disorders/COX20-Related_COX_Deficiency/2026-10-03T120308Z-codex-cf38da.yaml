  summary: Review COX20 deficiency against full-text clinical and mechanistic evidence
  details: |
    Reviewed the original entry, both EDIT histories, all relevant cached primary sources, and public full text where available. Corrected bundled mechanisms, cultured-cell evidence grading, universal ATP-collapse and cerebellar-localization claims, and the claim that all four Otero patients had dystonia. Added splice/protein-instability pathways, tissue- and assay-dependent findings, clinical spectrum and descriptive subgroups, diagnostics, individual treatment responses, cellular/yeast models, reproductive counseling and verified public sequencing runs.

    Read the complete cached Bourens 2014, Otero 2019, Dong 2021, Ban 2022, Li 2022, Chen 2023, Kuchina 2025 and Su 2025 scientific texts, plus the Turkish 2020 case and COX20-specific material in the mixed-gene sensory-neuropathy cohort. Dong and Ban full texts were fetched from the public Oxford silverchair pages when PMID/DOI routes did not provide them. Founding, Doss and Xu reports remained abstract-only after publisher/DOI attempts. The 2025 ten-family sensory-neuropathy abstract supplies no additional COX20-specific phenotype or mechanism; mixed-gene results were not transferred.

    Content-completeness assessment: phenotypes, descriptive subgroups, atomic mechanisms, treatment response variability, variant mechanisms, biomarkers/diagnostics and high-value references are covered. Population prevalence, penetrance, validated genotype-prognosis relations and COX20-specific clinical-trial efficacy were not established. The broad Cytochrome_c_Oxidase_Deficiency Falcon report, citation companion and artifact were screened/read; it has no COX20/FAM36A-specific section. Copper rescue in other assembly-factor disorders, SCO1 electrochemical diagnostics and broad myopathy trial subgroup findings are not evidence of COX20 efficacy or diagnostic performance. General mitochondrial GeneReviews and MMS guidance were mined for clinical context, molecular diagnosis, normal-lactate limitations, surveillance, emergency/anesthesia precautions and recessive counseling. Broader chapter phenotype frequencies and maternal inheritance were not applied to this nuclear-gene disease.

    ClinGen's Definitive assertion is under broader MONDO:0044970 and is therefore cited as context without asserting an exact disease-level mapping. Reported c.2T>C start-loss expression consequences remain computational. c.41A>G splice effects are distinguished from protein-only K14R constructs; linked Gly114Ser is not assigned causality. No LOE/mLOE classification is inferred from one tissue. Normal COX2 abundance and normal OXPHOS assays in some patient cultures are retained. Published subtype mean/median inconsistencies, variant-notation typos and arithmetic errors in pooled percentages were not propagated. Levodopa's transient benefit and nonresponse cases are separate; supplementation stability is not called efficacy.

    Both SRA:SRR18749879 and SRA:SRR18749880 resolved through verify-datasets. ENA experiment titles were checked directly; the WGS library-strategy metadata conflicts with the paper/experiment-title exome description and is noted. The node-class example now resolves to Reduced Complex IV Assembly after atomization. Schema, ontology and reference validation passed with 137/137 snippets and 153 titles; further repository gates and rendered-page checks accompany this PR.

  summary: Restore Xu findings and correct COX20 evidence and phenotype categories
  details: |
    Restored the Xu 2019 primary report (PMID:31079202): static encephalopathy, the original Lys14Arg/Trp74Cys compound-heterozygous family, abnormal sural-nerve mitochondrial morphology and reduced COX20 protein in patient blood leucocytes. The blood and nerve findings are human tissue evidence, distinct from cultured-fibroblast experiments. Looked up HP:0001298 Encephalopathy and HP:0003394 Muscle spasm; the stable course qualifier applies only to encephalopathy.

    Corrected non-neurological phenotype categories. Added painful muscle spasms and retargeted baclofen to the symptom actually treated, without claiming efficacy. Reclassified the introductory microcephaly quote as BACKGROUND. Separated muscle clinical assays from normal fibroblast OXPHOS evidence, classified the latter IN_VITRO and REFUTE for universally reduced activity, and retained variable assay findings. Added evidence-backed phenotype contexts for all three descriptive presentation clusters.

    Compared all ten unique Dong 2021 publisher-URL quotations against the PMID:33751098 abstract: none occurs there. PMID citations already cover the abstract findings; full-text-only quotations retain their fetched publisher URLs and cache-derived titles. The PMID:31079202 cache normalization was generated by validation and verified to change trailing whitespace only.

    Schema, ontology and reference validation passed: 148 snippets and 165 titles, no skipped or unavailable snippets. Both targeted data tests, entity references, causal targets and revised-page rendering passed. The initial 28 repository-wide gates and initial remote CI passed; this revision is submitted for fresh independent review.

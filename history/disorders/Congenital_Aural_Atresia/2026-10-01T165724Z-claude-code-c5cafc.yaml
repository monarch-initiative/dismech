  summary: 'Create: Congenital_Aural_Atresia'
  details: |
    Created the TSHZ1-related congenital aural atresia entry (MONDO:0011921, OMIM 607842) from the primary literature: Feenstra 2011 (PMID:22152683, full text) for the human genetics, phenotypes, inheritance and reduced penetrance; Ragancokova 2014 (PMID:24487590) for hyposmia and the TSHZ1-PROKR2-olfactory bulb chain; Core 2007 (PMID:17586487) for the Tshz1 null mouse middle-ear defect; Mallo and Gridley 1996 (PMID:8565828) for the tympanic ring-to-meatus inductive link, recorded as an inferred edge. Treatment evidence uses two reviews of congenital aural atresia of any cause (PMID:24005171, PMID:25912684), labelled as such. Deep research: OpenScientist (research/Congenital_Aural_Atresia-deep-research-openscientist.md; 39/39 references resolved, 1 off topic). preflight-dr returned WARN because the report treats congenital aural atresia generically (HOXA2, TCOF1 and microtia genetics outweigh TSHZ1), so only its scoping-review citation (PMID:39624921) was taken into the entry. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). An internal fresh-context review before the PR led to recording mouse-only causal edges as INDIRECT, adding a human-evidence edge from TSHZ1 haploinsufficiency to the canal defect, narrowing the GO binding to outer ear morphogenesis, and adding a diagnosis section. Validated with just validate, validate-terms, count-verified-snippets (39/39) and the offline qc gates.

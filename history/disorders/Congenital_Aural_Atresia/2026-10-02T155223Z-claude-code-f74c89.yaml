  summary: Bind TSHZ1 molecular function for CI gene-grounding gate
  details: |
    CI's check_gene_activity_grounding gate failed because TSHZ1 reached the TSHZ1 Haploinsufficiency node with no molecular function bound. Added GO:0003700 DNA-binding transcription factor activity (modifier LOSS_OF_FUNCTION), supported by the ChIP and expression evidence in PMID:24487590 that TSHZ1 binds and regulates the PROKR2 gene (mouse, marked INDIRECT). A repressor-specific term was not used because the cached sources do not establish the direction of regulation.

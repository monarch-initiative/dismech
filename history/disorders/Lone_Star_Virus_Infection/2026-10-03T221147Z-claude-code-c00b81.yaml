  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for Lone Star virus, recording deliberately little because little is reported. Hosts: Amblyomma americanum (NCBITaxon:6943, the tick the virus was isolated from and named for, described in the literature as a putative vector), Homo sapiens (NCBITaxon:9606, incidental host in the two reported fatal meningoencephalitis cases). Vector string marks the tick as putative. NO reservoir host is recorded: searches of both cited sources found no reported vertebrate reservoir, and a notes paragraph says so explicitly rather than inferring one from the tick's host range. Two stages: isolation from and association with the lone star tick (PMID:23637969 for the isolation, and for the tick feeding on a wide assortment of wild animal hosts, which is why no single reservoir follows from the tick association) and putative tick-borne transmission to humans (PMID:39983710, whose own wording hedges the vector assignment). Both snippets are copied from the entry's existing infectious_agent and transmission blocks with their OTHER grading unchanged. Block evidence PMID:39983710 frames the virus as tick-associated. No new references needed. The pre-existing NO_PROGRESSION finding is out of scope for this change. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders.

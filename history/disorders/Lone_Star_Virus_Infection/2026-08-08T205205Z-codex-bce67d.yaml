  summary: Create evidence-bounded Lone Star Virus Infection entry
  details: |
    Created a deliberately minimal bibliographic and ontological curation for issue #6521. Bound the agent to NCBITaxon:1219465, whose live NCBI Taxonomy record identifies Lone Star virus within Bandavirus amblyommae, and omitted disease_term because no exact MONDO concept was found. Restricted human content to the single published immunocompromised index case, represented the discordant confirmation as SUPPORT/REFUTE evidence, and kept etiologic attribution EMERGING with an OPEN interpretation discussion. Verified through Europe PMC that PPR:PPR1272399 is a bioRxiv preprint posted 2026-07-07 and retained it as bibliographic provenance only; no human phenotype, causal, transmission, treatment, diagnostic, or experimental-model claim relies on it. A constrained Claude Code deep-research run was limited to taxonomy, human-observation count, discordant causality, and publication status; the structured entry itself relies only on the peer-reviewed human case report and authoritative taxonomy identity.

  summary: 'Create: ZFP36L2-related Oocyte Maturation Defect (MONDO:0859330)'
  details: |
    New standalone entry for oocyte maturation defect 13, autosomal-recessive female infertility from biallelic ZFP36L2 variants. Lump/split: curated as its own DISEASE entry (one MONDO term, one gene), parallel to TUBB8- and CDC20-related oocyte maturation defect entries. Sources: four human reports (PMID:34611029, PMID:37211617, PMID:38829516, PMID:39178021; all abstract-only in the cache) and three mouse papers (PMID:29408237 and PMID:24830504 with full text, PMID:15342461). Pathograph: biallelic ZFP36L2 variants (partial loss of AU-rich mRNA binding and CCR4-NOT binding) -> impaired maternal mRNA clearance -> failed oocyte H3K4/H3K9 methylation and transcriptional silencing (mainly mouse-derived) -> oocyte maturation arrest and embryo developmental arrest -> female infertility. The ovarian LH-receptor mRNA route from the hypomorphic mouse is recorded on the animal model only, not as a disease node. Mouse Zfp36l2 MGI identifiers were not bound because MGI was unreachable from this session. Two snippets from PMID:39178021 were replaced because bracketed variant names are stripped before matching. No deep-research report was generated.

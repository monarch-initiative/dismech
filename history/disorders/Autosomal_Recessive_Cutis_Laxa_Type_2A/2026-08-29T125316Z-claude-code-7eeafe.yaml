  summary: 'Review round 1: GeneReviews mined, eleven phenotypes added, diagnosis
    section'
  details: |
    Addressed the automated reviewer's CHANGES_REQUESTED on PR 10042, including one blocking finding. The blocking item was a genuine process failure: PMID:20301755, the GeneReviews chapter ATP6V0A2-Related Cutis Laxa, was absent from the entry. The deep-research report did not surface it and no GeneReviews-specific search was run to compensate, so the entry asserted that counted frequency data did not exist while a source giving them went unread. The chapter is now tagged and mined across all four of its sections. Three frequency bands moved upward on its evidence: seizures and global developmental delay from FREQUENT to VERY_FREQUENT on nearly all affected individuals, and cortical gyration abnormality from OCCASIONAL to FREQUENT on most but not all. Eleven phenotypes were added: neurologic regression, cerebellar malformation, neonatal hypotonia, large fontanelles, coarse hair, high myopia, congenital hip dislocation, inguinal hernia, and easy bruising. Neurologic regression mattered most because the entry had described the disease as attenuating with age, which is true of the skin and the opposite of true for the brain. Added a diagnosis section covering combined transferrin and apolipoprotein C-III isoelectric focusing, molecular confirmation, and the surveillance schedule, and moved the ophthalmological surveillance entry there from treatments where it had been misfiled against its own description. Added anti-seizure medication and early developmental intervention as treatments, and recurrence risks and reproductive options to inheritance. Refined the cortical neuron cell type from CL:0000540 to CL:0010012. Recorded why no histopathology section is curated. Snippets 80/80 verified; full gate battery re-run clean.

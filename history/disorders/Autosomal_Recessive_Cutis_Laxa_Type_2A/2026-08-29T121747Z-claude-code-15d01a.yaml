  summary: 'Create: Autosomal Recessive Cutis Laxa Type 2A'
  details: |
    De novo curation of ARCL2A (biallelic ATP6V0A2 loss of function) from primary literature, with an OpenScientist deep-research report run alongside and committed under research/. Seven-node pathograph rooted on a single physical variable: loss of the trans-Golgi V-ATPase a2 subunit raises Golgi luminal pH, which forks into a combined N-/O-glycosylation defect and a Golgi trafficking defect; the trafficking arm blocks tropoelastin secretion and gives the deficient dermal elastic fibre network, and the glycosylation arm reaches aberrant cortical neuron migration via reduced alpha-dystroglycan O-mannosylation. Wrinkly skin syndrome curated as a has_subtypes entry rather than a separate disease. Eight references, all fetched via 'just fetch-reference'; 58/58 snippets verified. Four references were leads the deep-research report surfaced and were independently verified on PubMed before use. Three of the report's own suggestions were rejected: an obsolete GO term its own validation flagged, a mislabelled HP identifier (HP:0002269 given as 'Abnormal cortical gyration'; the entry uses HP:0002536), and a wrong HGNC identifier for ATP6V0A2. Two discussions: why a 78 percent null-allele spectrum shows no genotype-phenotype correlation and what severity is actually tracking, and a HUMAN_MODEL_MISMATCH on mouse globozoospermia never having been looked for in human patients. Validated with validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys and validate-disorders.

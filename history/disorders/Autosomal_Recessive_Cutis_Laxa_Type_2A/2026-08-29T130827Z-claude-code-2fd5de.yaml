  details: |
    Addressed the reviewer's round-2 CHANGES_REQUESTED, whose single IMPORTANT finding was a defect introduced by the round-1 fix. The Anti-Seizure Medication treatment carried a target_mechanisms edge to the Aberrant Cortical Neuron Migration node graded MODULATES, while its own description said the drug works without affecting the migration defect. The edge asserted what the prose beside it denied, and target_mechanisms is not inert - it draws a treatment-to-node arrow in the pathograph and carries into the export layer where the qualifying sentence does not travel. Re-slotted to target_phenotypes pointing at the Seizure phenotype, which is what the link's own evidence sentence supports, with a note recording why the distinction matters. That also restores the truth of the neighbouring note stating no treatment acts on any node in this pathograph. Three suggestions applied. Split Easy Bruising and Atrophic Scarring into two phenotypes so name and ontology binding agree, the second bound to HP:0001075. Moved the GeneReviews sentence about skin findings decreasing with age off the neurologic regression phenotype, where it was not evidence for regression, onto the cutis laxa phenotype where it is evidence, with the contrast made in prose instead. Attached the two GeneReviews facial-feature statements to Facial Dysmorphism, which previously rested only on an age-at-ascertainment p value. Recorded that GeneReviews does not mention the palate at all, so the High or Cleft Palate band still rests on the association data and remains a coarse literature reading. Snippets 82/82 verified; full gate battery clean.

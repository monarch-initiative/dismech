  details: |
    Added a variable Dental Abnormalities phenotype HP:0000164 Abnormality of the dentition to Osteogenesis Imperfecta Type XIV TMEM38B/TRIC-B, completing the scleral/dental hallmark phenotype-coverage audit requested in issue 5079 item 2. The entry already modeled blue sclerae as a variable finding from the same systematic review PMID:41465594 Zoller et al 2025 n=56 patients whose abstract lists variable features like blue sclerae or dental abnormalities: blue sclerae was captured but dental abnormalities was not. Reused the already-validated PMID:41465594 snippet. Generic dentition term used because the review reports dental abnormalities without specifying dentinogenesis imperfecta. Validated with just validate, just validate-references, and just validate-terms all pass.

  summary: 'Review round 1 on PR #12652: address ai4c-reviewer findings'
  details: |
    Review round 1 on PR #12652, addressing ai4c-reviewer findings.

    Taken:
    - Added a Hearing Aids and Cochlear Implantation treatment. The reviewer was
      right that the entry had nothing treating its defining feature. IMPORTANT: the
      snippet the reviewer supplied ("Hearing loss is managed with hearing aids and
      cochlear implants, which has made a significant improvement in quality of life
      for patients.") does NOT appear in PMID:32995707 - the word "managed" does not
      occur in the cached record at all. Two real sentences were used instead, both
      from the review's own Usher 3 section, which are better scoped than the
      suggested generic one: the amplification-then-implantation sequence, and the
      implantation outcomes measured in type-3 patients with their late mean age at
      implantation. This is the CLAUDE.md rule that a quote offered in a review
      comment is a lead, not a checked binding.
    - Regraded both PMID:31625146 items from HUMAN_CLINICAL to IN_VITRO. The
      reviewer is correct: RNAscope in situ hybridization on retinal tissue sections
      plus scRNA-seq is ex vivo tissue work, not patient or cohort data, and the
      quoted sentence covers mouse and human together. Both occurrences changed
      together, since check-snippet-grading keys on the sentence.
    - Added Night Blindness and Constricted Visual Fields phenotypes with causal
      edges from Photoreceptor Degeneration.
    - Added a notes block on the Investigational Gene-Directed Therapy row recording
      that NCIT:C15238 is narrower than the row's description, which also covers
      antisense oligonucleotides and small molecules, and that no NCIT
      clinical-action term spans all four.

    Validated: linkml-validate, term validator --labels, reference validator
    (34/34 snippets), plus the offline gates.

  summary: 'Review round 2 on PR #12652: widen the hearing-treatment preferred_term'
  details: |
    Review round 2 on PR #12652. One optional finding, taken.

    The Hearing Aids and Cochlear Implantation row carried
    `treatment_term.preferred_term: hearing aid usage`, which named only half of what
    the row covers. Widened to "hearing amplification and cochlear device
    implantation". `treatment_term` here has no `term:` binding - CLAUDE.md records
    that the former hearing-aid usage term has no NCIT clinical-action equivalent -
    so `preferred_term` is the only place the row's scope is stated, which is why the
    imprecision mattered.

    Type 2's row keeps "hearing aid usage" because that row genuinely is
    amplification only: the type-2 sloping loss leaves useful low-frequency hearing.
    The difference between the two rows is the point, not an inconsistency.

    The row is deliberately NOT split into separate amplification and implantation
    treatments. The two belong together for this entity because the sequencing is the
    claim: the type-3 deficit is a progressive postnatal hair cell loss, so
    amplification works while hair cells remain and implantation becomes indicated as
    the loss advances. Splitting them would lose that ordering, which is what
    distinguishes type-3 management from types 1 and 2.

    This push also re-triggers CI. The previous head failed the curation-scope guard
    on a CLAUDE.md edit; the `scope-override` label that fixes it was applied but the
    job could not be re-run from this session (403), and the guard reads labels at
    job runtime. Carrying a real change was the way to get the check re-evaluated
    without an empty commit.

    Validated: linkml-validate, term validator --labels, reference validator
    (34/34 snippets).

  summary: 'Create: Usher Syndrome Type 3 (clarin-1 / Muller glia entity, split from
    lumped Usher_Syndrome)'
  details: |
    Created by splitting kb/disorders/Usher_Syndrome.yaml into four mechanism
    entities plus kb/groupings/Usher_Syndrome.yaml, per the decision recorded on
    issue #10822.

    This is the entity the lumped entry served worst. Clarin-1 belongs to neither
    Usher complex, so the shared root node named an assembly it is not part of;
    and clarin-1 is expressed in Müller glia rather than photoreceptors, so the
    shared retinal node named a cell type it is not in. Both nodes were replaced
    rather than renamed.

    The root node names the loss of a protein rather than the disruption of a
    named complex, deliberately: clarin-1 has no assigned biochemical activity and
    belongs to no Usher assembly.

    The retinal causal direction (glia to photoreceptor) rests on a cell-specific
    rescue experiment in zebrafish, curated as an animal model with a RESCUES link
    and a RESTORED readout. Müller glial re-expression prevents light-induced
    photoreceptor death; rod- or cone-specific re-expression does not, and both
    arms are cited. Human cell-type attribution is from RNAscope and single-cell
    RNA-seq on adult human retina.

    The Clrn1 knockout mouse carries a FAILS_TO_RECAPITULATE link for the retinal
    arm with limitations and evidence, as the schema requires. That negative
    result is the observation that redirected the field to Müller glia, so it is
    recorded structurally rather than left as prose.

    ClinGen's CLRN1-type 3 Definitive assertion is NOT cited: it predates the CGGV
    identifier scheme and its CGGCIEX identifier is not in the repository's ClinGen
    index. This was checked by attempting the cache build, not assumed, and the
    gene entry records it. The HARS1 Refuted assertion does have a CGGV identifier
    and is cited as a REFUTE item.

    Evidence: 28 snippets, all verified. Four references fetched for this entry
    (PMID:19680541, PMID:31625146, PMID:40067805, PMID:15521980). The published
    PLoS Genetics version is cited rather than the bioRxiv preprint the issue
    thread originally referenced.

    Validated: linkml-validate (Disease), linkml-term-validator --labels,
    linkml-reference-validator (28/28 snippets verified).

  summary: Bind CLRN1 into the pathograph, map MONDO:0010170, withdraw the HARS1 subtype
    claim
  details: |
    Genetics pass for the d2g series-035 gap list (issue #12242), re-homed onto Usher Syndrome
    Type 3 after #12652 replaced the lumped Usher entry the issue named.

    Added. CLRN1 is bound to the clarin-1 loss-of-function node, the cochlear hair-bundle
    disorganization node and the Mueller glial support node, each of which cites a reference
    naming CLRN1 or Clrn1 directly. A structured case_fraction from a 684-patient meta-analysis
    was added to the CLRN1 record. A mappings.mondo_mappings entry records MONDO:0010170 Usher
    syndrome type 3A as a skos:narrowMatch, which is how the gap list's type-3A term is covered
    without adding a one-row subtype list that would restate the whole entry.

    The gap list's other type-3 term, MONDO:0013788 Usher syndrome type 3B, is deliberately NOT
    mapped. An earlier draft of this work curated it as a HARS1 subtype on the strength of
    PMID:28632987, which reports the Y454S biochemistry. #12652 had already curated HARS1 on
    this entry as DISPUTED against ClinGen's 2018 Refuted assertion from the Hearing Loss Gene
    Curation Expert Panel, which is stronger evidence and settles it: the HARS1 subtype claim
    was withdrawn and the mapping justification records why mapping the term would imply
    coverage of a relationship this entry rejects. MONDO still records HARS1 as the causal gene
    of MONDO:0013788, which is an upstream disagreement.

    Not changed. The entry's pre-existing GeneReviews state is CITED_UNTAGGED because its
    review_notes names the type I and type II chapter PMIDs while explaining why neither is
    cited for a type-3 claim. That is correct content and the check's detection is by PMID
    identity anywhere in the file; it predates this change and was left alone.

    Review round 1 (PR #12741). Two of the ten uncited caches the reviewer found belong to
    this entry. PMID:12080385 is now cited on the CLRN1 record as the report establishing that
    the USH3A transcript encodes clarin-1, which is the assignment behind the MONDO:0010170
    narrowMatch in the mappings block. PMID:28632987 is cited on the DISPUTED HARS1 record as
    what the refuted USH3B claim rested on, rather than deleted: one item records that the
    proposal existed and the other records the thermal-instability argument offered for it,
    and both explanations state explicitly that they are not support for HARS1 causing type 3
    and that ClinGen's Refuted classification is the verdict this record follows. Both
    snippets are from the abstract; PMID:28632987's cache is content_type full_text_xml, and
    both quoted sentences were confirmed to sit inside its abstract paragraph rather than the
    body.

    Augmented the pre-existing merged Migraine with aura entry. Added a genetic section: KCNK18/TRESK causative in typical MA per PMID:20871611 with split HUMAN_CLINICAL pedigree and IN_VITRO functional evidence, and MTHFR C677T MA-specific susceptibility per PMID:35125689 meta-analysis. Added a polygenic inheritance block bound to HP:0010982 per PMID:31226929. Added a CADASIL differential diagnosis MONDO:0000914 NOTCH3 hereditary small-vessel disease per PMID:40169951. Added a classifications block Harrison NEUROLOGIC, biological_scale tags on all four pathophysiology nodes, and removed a deprecated percentage field from prevalence. Deep research: Edison/Falcon was requested but blocked by a 402 Payment Required due to account credits; used existing committed Asta Migraine-with-aura and Falcon Migraine reports (a fresh OpenScientist run was attempted but timed out after ~1h in the server-side queue and produced no report), with all snippets independently verified as exact PubMed abstract substrings. Validated with just validate schema+terms+references green and a fresh-context red-team review with APPROVE verdict.
- type: REVIEW
  outcome: changed

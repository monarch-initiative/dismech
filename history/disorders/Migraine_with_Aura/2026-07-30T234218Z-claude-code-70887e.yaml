  summary: 'Address PR #7244 automated review (REQUEST_CHANGES)'
  details: |
    Responded to the ai4c-reviewer[bot] review on PR #7244. IMPORTANT 1: reframed the KCNK18/TRESK notes and evidence to reflect that the 2010 dominant-negative-on-TRESK model was superseded (the F139WfsX24 frameshift creates an in-frame alternative start codon that downregulates TREK1/TREK2, explaining why the also-dominant-negative C110R variant is not migraine-associated) and corrected the site of action to trigeminal/DRG sensory neurons rather than cortex; added a third evidence item citing the already-cached PMID:31226929. IMPORTANT 2: wired the new genetics into the pathograph with two atomic nodes — 'K2P potassium channel (TRESK/TREK1/TREK2) dysfunction' (MOLECULAR) downstream to Trigeminovascular nociceptor activation, and 'Homocysteine elevation and endothelial dysfunction' (ORGANISM) downstream to Trigeminovascular nociceptor activation and to the previously disconnected Retinal microvascular perfusion abnormality node. Suggestions: acknowledged the CADASIL point-counterpoint debate in the differential description, resolved the inheritance scope-wording tension, and recorded the PR link. All new snippets verified as exact PubMed abstract substrings; just validate green.

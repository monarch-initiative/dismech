  summary: Address PR #17348 review feedback on TET2/ASXL1 evidence, cytogenetics diagnosis, Phase III treatments, pathograph structure, CMML differential, and clinical trials
  details: |
    Replaced generic driver-sequencing quotes on TET2 and ASXL1 pathophysiology and genetic rows with gene-specific human MDS and functional evidence (PMID:19474426, PMID:28823558, PMID:21714648, PMID:24218140); replaced the TP53 allelic-imbalance snippet on Bone Marrow Cytogenetic Analysis with cytogenetics workup and IPSS-R evidence (PMID:36718105, PMID:22740453); added Erythropoiesis-Stimulating Agents (epoetin alfa, darbepoetin alfa), Imetelstat (IMerge Phase III), Ivosidenib (IDH1-mutant R/R MDS), Iron Chelation Therapy (deferasirox), and frontline COMMANDS luspatercept evidence; replaced the circular founder-lesion hub by splitting Somatic SF3B1 Spliceosome Mutation from Somatic SRSF2 and U2AF1 Spliceosome Mutations and routing spliceosome and epigenetic founder lesions into Clonal Hematopoietic Stem Cell Transformation plus downstream Aberrant Pre-mRNA Splicing and Aberrant DNA Methylation and Chromatin Dysregulation (targeted by azacitidine and decitabine); added sustained monocytosis diagnostic evidence (PMID:38450850) to the CMML differential; and added a clinical_trials block covering COMMANDS (NCT03682536), IMerge (NCT02598661), MEDALIST (NCT02631070), and AZA-001 (NCT00071799).

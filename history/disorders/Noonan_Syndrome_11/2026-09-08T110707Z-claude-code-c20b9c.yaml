  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11078 (one IMPORTANT finding, two SUGGESTIONs). All three applied; nothing declined.

    IMPORTANT - PMID:42610277 (rigosertib) cached but never consumed. The reviewer is right, and the finding lands on a real inconsistency in the previous session's own reasoning rather than on a judgement call. That session read the paper, recorded it in the history record as deliberately not cited because its evidence is a Drosophila panel plus Raf1L613V/+ knock-in mice with no MRAS data, and in the same session added PMID:36184070 - a RIT1 patient case report - to the MEK inhibition treatment as SUPPORT with directness INDIRECT. Both are cross-gene RASopathy evidence for a treatment claim about an MRAS entry. Accepting one and refusing the other on the ground of being cross-gene is not a coherent position, and the rigosertib paper is if anything the better fit: this entry's node is named "RAS-MAPK and PI3K-AKT Pathway Hyperactivation", MEK inhibition addresses the MAPK arm alone, and rigosertib is a dual RAS/MAPK and PI3K/AKT inhibitor, so it is the one reported agent whose target profile matches both arms the entry actually models.

    Added as a treatments entry, "Dual RAS-MAPK and PI3K-AKT inhibition with rigosertib": treatment_term NCIT:C93352 Targeted Therapy, therapeutic_agent CHEBI:145417 rigosertib, therapeutic_modality SMALL_MOLECULE, target_mechanisms INHIBITS against the pathway-hyperactivation node. Three evidence items, all MODEL_ORGANISM with directness INDIRECT and the RAF1-not-MRAS inference step named in each explanation: the dual-target-profile sentence on the mechanism link, the Raf1L613V/+ six-week reversal of established hypertrophy, and the Drosophila comparison in which it outperformed trametinib. The description states in its first clause that this is preclinical only and that no MRAS model or patient has been treated with it.

    SUGGESTION - MEK inhibition had no therapeutic_agent despite its own snippet naming trametinib. Added CHEBI:75998 trametinib, which was already in the term cache.

    SUGGESTION - cite the rigosertib mouse work in ns11_no_whole_organism_model. Added, with the rationale extended to say what the neighbouring-gene result settles and what it leaves open: the Raf1 work answers the reversal half of the gap's proposed experiment, leaving the MRAS-specific half and the prevention half untestable for want of a model. The evidence item is marked INDIRECT and its explanation says it is cited to size the gap, not to fill it.

    Term selection: CHEBI was preferred over NCIT for both agents per the CLAUDE.md rule that CHEBI is preferred for specific small-molecule drugs. CHEBI:145417 was resolved with `uv run runoak -i sqlite:obo:chebi search "rigosertib"`; NCIT:C152216 Rigosertib and NCIT:C71355 Rigosertib Sodium also exist and were not used. The CHEBI:145417 row that appears in cache/chebi/terms.csv and the chemicalentityterm enum cache was generated by the validators, not hand-written; `just check-term-cache-integrity` passes.


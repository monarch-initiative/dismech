  summary: 'Augment: NS11 mechanistic hypotheses, druggability and in vivo model gaps'
  details: |
    Augmentation of the existing NS11 entry (created 2026-08-18, three prior history records). The entry was already at 97.9% weighted compliance with 82/82 snippets verified, so this session looked for content gaps rather than compliance gaps, and the two remaining compliance gaps turned out to be recorded deliberate omissions rather than work.

    DEEP RESEARCH. Two new provider runs, both consulted only after their preflight verdict. `just research-disorder` derives disease_name from the YAML `name:` field, and plain "Noonan Syndrome 11" is the string that resolved to LZTR1-related disease in the August session, so both runs passed a disambiguating override naming MRAS, OMIM 618499 and MONDO:0032786. That override cannot be passed through `just` normally: `{{ args }}` is textual interpolation, so a multi-word `--var` value is word-split and the run fails. Passing the whole flag as one already-quoted argument works. Three runs were lost to this before it did.

    - claude_code: preflight PASS (MRAS=92, next rival SHOC2=14, report OMIM 618499 matching the MONDO xref). Reference validation 21/21 resolved, 0 unresolved, 0 off topic. Term validation flagged HP:0001692 (report calls it "Left ventricular outflow tract obstruction"; HPO calls it Atrial arrhythmia) and UBERON:0002012; neither was bound. Its substantive contribution was section 15, which establishes that no germline MRAS knock-in mouse, zebrafish or other whole-organism model has been published.
    - openscientist: preflight WARN, SHOC2 at 39% of MRAS mentions. Read and judged a false positive - SHOC2 is the obligate scaffold of the MRAS-SHOC2-PP1 holophosphatase, not a second disease entity, and the second OMIM number it carries (608435) is the MRAS gene MIM rather than a rival disorder. Reference validation 16/16 resolved. Nothing was curated from its prose. It independently reached the same two gaps found from primary literature (no in vivo model; MEK efficacy documented in RIT1/RAF1/PTPN11 but not MRAS), which is why it is committed.
    - The pre-existing falcon report was NOT re-run. `just research-disorder falcon` writes to the same path and would have overwritten a preflight-PASSed committed artifact with a run made under the confusable plain name. It was instead retro-fitted with `just validate-research-terms`, which it lacked; that section now records six HP identifiers the report names by category label rather than by term name.

    WHAT WAS ADDED.
    1. mechanistic_hypotheses (new section). Two groups covering the M-Ras activation question, with the contested pathophysiology edge opting into both via downstream[].hypothesis_groups. ns11_constitutive_gtp_loading (CANONICAL) is the impaired-GTPase account already implicit in the entry. ns11_complex_stabilized_activation (EMERGING) records the molecular-dynamics finding that GTP-bound wild-type M-Ras predominantly occupies the inactive state I conformation and that the effector-competent state II is stabilized allosterically within the holophosphatase (PMID:41340891).
    2. discussions: two new KNOWLEDGE_GAP entries. ns11_smp_complex_druggability records that MRTX1133 and RMC-6236 block the canonical SKP complex but do not bind M-Ras, so they are not a route into the NS11 lesion (PMID:41519889). ns11_no_whole_organism_model records the absence of any germline MRAS animal model, cites the Lztr1 knock-in mice as the contrast showing the approach works for a Noonan gene (PMID:39352760, INDIRECT), and explains why the entry has no animal_models section. Both carry proposed_experiments wired into the pathograph via would_support.
    3. pathophysiology: PMID:41519889 added to the holophosphatase node, establishing M-Ras as the high-affinity isoform partner.
    4. treatments: the MEK inhibition entry previously rested on a single "emerging targeted therapies ... offer potential" sentence. Added the RIT1 trametinib case with complete remission of cardiac hypertrophy (PMID:36184070) and the RASopathy-HCM repurposing review (PMID:38432396). Both are marked directness: INDIRECT with the cross-gene inference step named in the explanation; neither establishes efficacy in NS11.
    5. notes: three curation decisions recorded so they are not re-litigated - the tested datasets omission, the module-conformance decision, and (in the hypothesis notes) the provenance of the Q71R affinity figure.

    DECISIONS RECORDED RATHER THAN CHANGES MADE.
    - No conforms_to against cardiomyopathy_maladaptive_remodeling, although 14 of 16 Hypertrophic_Cardiomyopathy_* entries do conform. That module runs insult, then neurohormonal activation, then ventricular remodeling, then progressive contractile dysfunction. NS11 hypertrophy is driven directly by RAS-MAPK signalling and is present at or near birth, and no MRAS patient has a reported chronic contractile-dysfunction or dilated phase, so there is no downstream node to conform at either. This follows the reasoning PRKAG2_Cardiac_Syndrome already records for its own hypertrophy node.
    - No datasets block. `just discover-datasets Noonan_Syndrome_11` was actually run this session rather than the August reasoning being inherited: it returns exactly one candidate, geo:GSE270298, a GENE_ONLY match to a KAT7/colorectal-cancer study. That is Named Entity Confusion reached through dataset search.
    - PMID:42610277 (rigosertib reverses HCM in Noonan syndrome, 2026) was read and deliberately not cited. It is a genuine and recent result, but its evidence is a Drosophila panel plus Raf1L613V/+ knock-in mice, with no MRAS data, and adding it to a treatments section would imply a therapy that has never been tested against this gene.

    RED-TEAM REVIEW AND A CORRECTION. A subagent review of the draft found a real defect. The EMERGING hypothesis had been written from the abstract of PMID:41340891 and framed the substitution as acting "by raising affinity for the holophosphatase rather than by locking in GTP". The paper's body says the opposite: "In contrast, M-RasQ71R is primarily GTP-loaded", Q71R raises the stable GTP-bound population to 58%, and the paper likens Q71R to the canonical RAS Q61 oncogenic mutants. The paper is a refinement of the canonical model, not a rival to it. The block was rewritten around what the source supports, the group renamed from ns11_holophosphatase_affinity to ns11_complex_stabilized_activation, and both snippets replaced with quotes from the results text. The review also established that the Q71R affinity figure is cited prior surface-plasmon-resonance work rather than this paper's own measurement, which the hypothesis notes now say. Six further review findings were applied: module chain order, the overstated "no downstream node" claim, an overreaching explanation on the PMID:41519889 item (now directness: INDIRECT), an overstated RASopathy-uniqueness claim, the upstream causal edge left untagged, and missing would_support on the proposed experiments.

    VALIDATION ACTUALLY RUN, naming only checks whose output was read.
    - just validate: schema, terms and references all passed; "Snippets checked: 91/91 verified against cached references" (82/82 before this session, 9 new evidence items).
    - just validate-terms: passed. just check-entity-refs: OK. just check-duplicate-keys: OK. just check-causal-targets: OK, no new breakage. just check-enum-values: OK. just check-qualifier-terms: OK.
    - just check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading: all OK, no new baseline entries.
    - just discover-datasets and just preflight-dr on both new reports, as described above.
    - just compliance: 96.2% weighted, down from 97.9%. This is the metric artifact, not a regression: 12 more slots score OK and 4 more are MISSING, all four being datasets/evidence on the two new proposed_experiments - the same recommended-slot gap the two pre-existing proposed_experiments already carry, for the same reason, that a proposed and unperformed experiment has no results to cite.
    - The full tests/test_data.py suite was NOT run in this session.

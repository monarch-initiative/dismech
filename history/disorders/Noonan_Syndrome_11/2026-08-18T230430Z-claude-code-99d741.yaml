  summary: 'Review response: address CHANGES_REQUESTED on PR 8863'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #8863 (2 IMPORTANT, 7 SUGGESTION).

    Blocking items addressed:
    - inheritance[]: added the GeneReviews (PMID:20301303) GENETIC COUNSELING transmission-risk evidence item ("Each child of an individual with autosomal dominant NS has a 50% chance of inheriting the pathogenic variant"). The risk follows from the autosomal dominant mode of inheritance rather than from the causal gene, so it is in scope for NS11 even though every reported MRAS proband has been de novo.
    - phenotypes[]: added Hypotonia (HP:0001252) and Joint Hypermobility (HP:0001382), both from the p.Thr68Ile examination sentence in PMID:28289718 that the existing Pectus Excavatum snippet truncated. The cached full text splits "hyperexten-/sibility" across a line break, so the joint-hypermobility snippet transcribes that line-break hyphenation verbatim and its explanation records why.

    Non-blocking suggestions applied:
    - notes: recorded that the GeneReviews frequency bands (general-Noonan figures) were deliberately not inherited by this entry, and that pulmonary valve stenosis and the prenatal lymphatic findings are curated here because they are directly documented in the reported MRAS patients themselves. This is the consistency pass the reviewer asked for on the scope note.
    - diagnosis[]: the GeneReviews diagnostic-criteria quote is now also cited in diagnosis[], where diagnostic criteria belong. The genetic[] citation was retained because it supports a different claim there (that MRAS is among the genes in which a heterozygous variant is diagnostic).
    - prevalence[]: reworded the explanation, which described PMID:41866303 as a systematic literature review; the paper states that a targeted narrative review was considered more appropriate than a PRISMA systematic review.
    - phenotypes[]: added Hydrops Fetalis (HP:0001789) from the antenatally diagnosed eighth patient (PMID:41866303).
    - progression[]: added the case-series mortality figure (37.5%, three of eight individuals) to the severe early-cardiac phase, explicitly flagged as a case-series figure rather than a population survival estimate.
    - histopathology[]: new section carrying the single published NS11 autopsy (HCM, obliterative portal venopathy, pulmonary lymphangiectasia), with a note that one autopsy is a description and not a frequency claim.

    Declined, with reasons:
    - Adding NS11 as a member of kb/groupings/RASopathies.yaml. That grouping's own notes hold open the question of whether it admits subtype-level entries (NF1 Microdeletion Syndrome is held as a candidate on exactly that ground), and NS11 nests under the already-listed member Noonan Syndrome. Adding it would make the union partly nested and would also require revising the grouping's MONDO consistency block. The reviewer marked this as follow-up-PR material.
    - Adding beta-blocker / disopyramide medical management of obstructive HCM. No reference in this entry's citation set states it: the cached MEKinRAS trial record (NCT06555237) does not mention either drug, and the GeneReviews abstract does not either. Adding it would mean introducing a new, RASopathy-wide reference for a claim with no MRAS-specific evidence.
    - Adding evidence/datasets to discussions[].proposed_experiments[]. These are proposed, unperformed experiments; there are no results to cite.


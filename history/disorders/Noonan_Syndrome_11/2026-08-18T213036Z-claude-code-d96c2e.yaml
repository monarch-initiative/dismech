  summary: 'Create: Noonan Syndrome 11 - MRAS, MONDO:0032786'
  details: |
    New disorder entry for Noonan syndrome 11 (NS11), the MRAS-related form of Noonan syndrome (MONDO:0032786, OMIM:618499).

    IDENTITY ANCHORING. MONDO:0032786 carries no definition text, so identity was anchored on the OAK record and OMIM. `uv run runoak -i sqlite:obo:mondo info MONDO:0032786 -O obo` returns xref OMIM:618499 and relationship RO:0004003 HGNC:7227 (MRAS), is_a MONDO:0018997 (Noonan syndrome). MRAS is the verified causal gene.

    DEEP RESEARCH AND NAMED ENTITY CONFUSION. The first falcon run (disease_name "Noonan Syndrome 11", 2026-08-18T09:23-09:33) resolved the label to autosomal dominant LZTR1-related Noonan syndrome and said so in its own scope warning. `just preflight-dr` returned WARN: MRAS mentioned 5 times against LZTR1 61 times (1220%), and the report cited OMIM 605275/616564 against the MONDO xref 618499. Per CLAUDE.md section 2b that report was discarded entirely and NOT cherry-picked; it is not committed. Falcon was re-run with a disambiguating disease name naming MRAS, OMIM 618499 and MONDO:0032786 and explicitly excluding LZTR1. The second report (09:43-09:52) returned preflight PASS: MRAS mentioned 86 times, top rival SHOC2 at 11, report OMIM 618499 matching the MONDO xref. Its own reference-validation block reports 6/6 references resolved, 0 unresolved, 0 off topic. That report is committed and was consulted only after the PASS verdict; the pathophysiology chain had already been built independently from primary literature.

    CONTENT. Six-node pathophysiology chain: MRAS activating missense variant (hotspot codons Gly23/Thr68/Gln71) then constitutive M-Ras GTP loading via impaired GTPase activity, then enhanced MRAS-SHOC2-PP1 holophosphatase assembly, then RAF S259 dephosphorylation and RAF activation, then RAS-MAPK and PI3K-AKT hyperactivation, then cardiomyocyte hypertrophy with abnormal calcium handling, then hypertrophic cardiomyopathy with outflow tract obstruction. Twenty phenotypes with HPO terms. Genetic block with MRAS (hgnc:7227), CAUSATIVE, DE_NOVO, citing the ClinGen RASopathy GCEP Moderate assertion. Two iPSC experimental models with modeled_mechanisms, readouts and limitations. Two KNOWLEDGE_GAP discussions (cancer risk; intra-genotype cardiac severity variability for p.Thr68Ile). MEKinRAS trial NCT06555237 recorded with supports PARTIAL because eligibility is RAS/MAPK-pathway-level, not MRAS-specific.

    DELIBERATE OMISSIONS. HP:0003811 (Neonatal death) was tried for the mortality phenotype and rejected: it sits under HP:0040006 Mortality/Aging, not reachable from HP:0000118, so it is not a legal PhenotypeTerm value. This matches the recorded finding in PRKAG2_Cardiac_Syndrome. The neonatal and infant deaths are instead carried in the progression phases and the HCM node description. No datasets block: MRAS is a well-known coronary-artery-disease GWAS locus, so a gene-only dataset search would surface CAD studies rather than NS11 data, which is the Named Entity Confusion risk CLAUDE.md warns about for dataset discovery. Features shared with the wider Noonan spectrum are left on the parent entry Noonan_Syndrome rather than duplicated; that file was not modified.


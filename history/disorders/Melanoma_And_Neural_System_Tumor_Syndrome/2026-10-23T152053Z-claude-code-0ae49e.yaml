  summary: 'Create: Melanoma and Neural System Tumor Syndrome'
  details: |
    De-novo curation of melanoma-astrocytoma syndrome (MONDO:0007967, CDKN2A), claim issue #14050. Mechanism modeled as the two CDKN2A arms: p16INK4A loss -> CDK4/6-cyclin D -> RB inactivation, and p14ARF loss -> MDM2-mediated p53 degradation -> impaired p53 suppression, converging on escape from senescence and clonal expansion in melanocytes and astrocytes. Evidence from GeneReviews CDKN2A Cancer Predisposition (PMID:40674536, tagged GeneReviews baseline), the original family description (Kaufman 1993, PMID:8414022), the INK4-locus germline deletion study (Bahuau 1998, PMID:9622062), the p14ARF-restricted deletion family (Randerson-Moor 2001, PMID:11136714), and the INK4a/ARF mechanism review (PMID:15878778). Deep research: falcon requested but unavailable (403 auth), fell back to openscientist (research/Melanoma_And_Neural_System_Tumor_Syndrome-deep-research-openscientist.md; 39/39 refs resolved, 0 off-topic; preflight-dr confirmed CDKN2A-dominant, OMIM 155755). Validated with just validate, validate-terms, count-verified-snippets (22/22), check-entity-refs, check-causal-targets. Includes a HUMAN knowledge-gap discussion on p14ARF-specific vs contiguous-deletion causation.

  details: |
    Addressed ai4c-reviewer changes_requested on PR #15409. Added Schwannoma (HP:0100008), MPNST (HP:0100697), and Cutaneous neurofibroma (HP:0001067) phenotypes with Sargen 2023 frequencies (PMID:37585199); added a somatic second-hit pathophysiology node (variant_origin SOMATIC, PMID:28699883 + PMID:12019208) conforming to germline_two_hit_tumor_predisposition, with the germline node conforming to the first-hit module node; added evidence to the five previously bare mechanism nodes (PMID:15460900 p16-RB, PMID:29665672 ARF-MDM2-p53, PMID:27872202 p16-senescent nevi, PMID:21200141 p53/p14ARF in glioma); fixed the Glioblastoma and Nervous System Neoplasm evidence to sentences that support them (PMID:37585199, PMID:28699883); set melanoma/glioblastoma/schwannoma/MPNST/neurofibroma frequencies to Sargen-cited bands and dropped the unsupported FREQUENT on astrocytoma; added two POINT_PREVALENCE records (Sargen UK Biobank 1:39,149 and Geisinger MyCode 1:170,503); added an environmental UV entry (ECTO:0000006) with influences_mechanisms PREDISPOSES on melanoma and an MC1R MODIFIER genetic row (PMID:16462187); added melanoma-pancreatic cancer syndrome (MONDO:0011713) and NF1 (MONDO:0018975) differentials recording pancreatic-cancer scope and the NF1 mimic; rebound the CDK4/6 node to GO:0004693 kinase activity INCREASED; cited exon-1B lesions (PMID:35904890, PMID:15937071). Corrected seven reference_title values to the exact cache titles (initial draft had composed titles). Re-validated: validate-disorders 44/44 snippets 0 issues, validate-terms, check-entity-refs, check-causal-targets, gene-term mismatches 0, GeneReviews TAGGED.

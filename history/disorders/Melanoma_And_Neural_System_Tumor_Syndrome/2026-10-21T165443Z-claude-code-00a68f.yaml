  summary: 'Create: Melanoma and Neural System Tumor Syndrome (CDKN2A)'
  details: |
    De-novo curation of melanoma-astrocytoma syndrome (MONDO:0007967, CDKN2A, closes #14050). Germline two-hit predisposition with dual p16INK4A-CDK4/6-RB and p14ARF-MDM2-p53 axes; 5-node connected pathograph conforming to germline_two_hit_tumor_predisposition and evading_growth_suppressors modules; 9 phenotypes (melanoma, astrocytoma, glioblastoma, nevi, pancreatic, peripheral nerve sheath spectrum), genetics, prevalence, diagnosis, 4 treatments, OPEN_QUESTION discussion on the p14ARF NST determinant. GeneReviews baseline (PMID:40674536) tagged and cross-referenced; evidence from Bahuau 1998 (PMID:9622062), Randerson-Moor 2001 (PMID:11136714), and the 2023 prevalence/spectrum cohort (PMID:37585199). Deep research: claude_code provider (Falcon unavailable this run due to an Edison auth 403) corroborated the mechanism and phenotype set; found_in provenance recorded. Frequency bands omitted where no quantitative snippet supports them. Validated with just validate (schema+terms+references), check-folded-hyphens, check-block-scalar-comments; compliance ~91%.

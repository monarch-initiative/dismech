  summary: 'Review response: ADEAF (PR 7981, rounds 1-3)'
  details: |
    Append-only record of three review rounds on PR 7981. The CREATE record describes the entry as first written (41/41 snippets); this record describes what it became.

    Added: focal-to-bilateral tonic-clonic and interictal EEG abnormality phenotypes; an EEG diagnosis entry, which was the notable omission given that MRI is normal by definition here; carbamazepine as therapeutic_agent, flagged inline as a class representative rather than an ADEAF-specific indication; and, in genetic, the family-restricted LGI1 yield of roughly 50 percent alongside pooled penetrance of 67 percent (95 percent CI 55 to 77) with the negative finding that penetrance does not vary by mutation type or location, which matters because it means the two variant classes differ molecularly but not in how reliably they cause disease.

    Balance corrections. The benign framing was one-sided; PMID:29464704 reports only 34.1 percent terminal remission over a median 11 years, now recorded with the distinction spelled out that good control on medication and freedom from seizures off medication are different outcomes. Four PMID:30346486 evidence items were retagged IN_VITRO to OTHER, since the paper is a mouse IgG-infusion study and the quoted sentences are human-disease background.

    Two frequency-band errors of mine were caught and fixed. The auditory aura carried VERY_FREQUENT justified by the circular claim that auditory symptoms are definitional for the syndrome, which reasons from the syndrome's name back onto its own phenotype table; the measured figures are 57 percent in LGI1 and 71 percent in RELN families, so it is FREQUENT. That correction surfaced a clinically meaningful asymmetry now stated in the description: the syndrome's defining feature is less common than its presenting one, tonic-clonic seizures at around 90 percent, which is a plausible part of why it goes underrecognized. Separately the EEG abnormality carried VERY_FREQUENT on an 80 percent figure that is the RELN cohort, when EEG is precisely the axis the source carves out as differing between genotypes; the entry quoted that carve-out two blocks earlier to license generalizing other frequencies and then generalized this one anyway. LGI1 normal recordings at 42 percent implies roughly 58 percent abnormal, so FREQUENT, and the left-temporal predominance is a RELN feature.

    Module conformance was restructured after I incorrectly declined the module's #Excitation-Inhibition Imbalance node as GABAergic-specific; its description reads through increased excitation, decreased inhibition, or both, which is what losing the LGI1-ADAM22 bridge does on the glutamatergic side. Four of five nodes now conform, and the notes record the corrected reasoning rather than the stale justification. Pathograph scoping to the LGI1 route only, with RELN and MICAL1 left unmodelled, is likewise explained in notes rather than silently assumed.

    Final state: just validate passes with 50/50 snippets verified. Reviewer verdict APPROVE.

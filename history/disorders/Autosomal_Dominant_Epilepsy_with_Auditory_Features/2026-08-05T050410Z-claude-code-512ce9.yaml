  summary: 'Create: Autosomal Dominant Epilepsy with Auditory Features (MONDO:0010898)'
  details: |
    De-novo curation of autosomal dominant epilepsy with auditory features (ADEAF / ADLTE / ADPEAF), previously absent from dismech.

    GeneReviews baseline: PMID:20301709 was located, fetched, cited throughout, and tagged GeneReviews in the top-level references block, per the mandatory Mendelian-disorder step. Every phenotype in its Clinical Characteristics section is represented in the entry (auditory aura simple and complex, ictal receptive aphasia, other sensory/motor/psychic/autonomic auras), and the Management drug-safety guidance on pregnancy planning is captured on the antiseizure-medication treatment.

    Deep research: claude_code provider launched for this disorder; the entry was built primarily from directly-fetched primary literature and the GeneReviews chapter. Every PMID independently fetched and every snippet verified as an exact substring of the cached abstract.

    Model: a five-node chain from LGI1 loss of function through the disrupted LGI1-ADAM22 trans-synaptic complex to dysregulated AMPA receptor clustering, lateral temporal cortical hyperexcitability, and focal seizures with auditory features. Three nodes conform to epilepsy_excitation_inhibition_imbalance. The LGI1 node explicitly models the two-class variant division (secretion-defective versus secretion-competent but binding-defective), which is what makes this a conformational disease and what determines whether a chemical chaperone could work.

    Three discussions: (1) KNOWLEDGE_GAP on the low genetic yield, with the ascertainment caveat that the 8 percent figure comes from a largely sporadic cohort and understates the yield in true autosomal dominant families; (2) HUMAN_MODEL_MISMATCH on heterozygous Lgi1 mice not developing seizures while heterozygous humans do, and the homozygous mouse producing a lethal myoclonic phenotype unlike human ADEAF; (3) OPEN_QUESTION on why inherited LGI1 loss gives a benign auditory focal epilepsy while anti-LGI1 autoantibodies give a severe amnestic limbic encephalitis.

    Cache note: MONDO:0010898 and GO:0097113 were new to dismech and live OLS lookups timed out. Both were seeded by one-off validate runs against the local sqlite adapters; conf/oak_config.yaml was restored afterwards and is unmodified in this branch.

    Validation: just validate passes (schema, terms, references) with 41/41 snippets verified against cached references. Compliance 82.2 percent global.

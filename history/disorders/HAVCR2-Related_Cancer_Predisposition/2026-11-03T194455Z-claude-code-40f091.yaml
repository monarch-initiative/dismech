  summary: 'Create: HAVCR2-Related Cancer Predisposition'
  details: |
    Created the germline HAVCR2 (TIM-3) predisposition entry for MONDO:1060169 from the stub, kept separate from the somatic Subcutaneous_Panniculitis-like_T-cell_Lymphoma entry per design decisions 3a (that entry was read for consistency and not edited). The deep-research input was a claude_code fallback report because the requested Edison/falcon provider returned HTTP 403 (fell_back: true recorded in the report frontmatter); it was used as leads only, and every claim was re-sourced to a cached PubMed abstract or full text, or to the cached ClinGen record (Moderate, AR, 2025-06-10), which is copied into gene_disease_validity. Five-node causal chain from germline HAVCR2 loss of function through TIM-3 misfolding and immune activation to an HLH branch and a subcutaneous T-cell infiltration/SPTCL branch, with all 12 phenotypes causally connected; the HAVCR2 node binds GO:0004888 transmembrane signaling receptor activity (DECREASED) to satisfy check-gene-activity-grounding. relationship_type is SUSCEPTIBILITY because the schema ties CAUSATIVE to ClinGen Definitive/Strong. HPO has no generic cytopenia term, so that phenotype carries a coarse binding with coarse_binding_basis NO_HPO_TERM. PMID:34398505 was fetched but has no abstract and was not cited. Validated with just validate, count-verified-snippets, validate-terms and the per-file and whole-tree check recipes, then validate-disorders.

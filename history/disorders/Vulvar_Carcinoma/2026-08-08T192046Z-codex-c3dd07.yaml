  summary: 'Remediate independent review: Vulvar Carcinoma'
  details: |
    Addressed the independent review and live requested-changes review on PR #8215. Split generic VIN into HPV-associated HSIL/uVIN and differentiated VIN with WHO-supported precursor-specific natural history, morphology, p16/p53 associations, and progression. Retargeted vulvar lump, pruritus, and pain to vulvar-specific HPO terms and added direct disease-presentation evidence and SCC-to-phenotype edges. Broadened the infectious-agent binding from HPV16 to human papillomavirus to match high-risk HPV evidence. Replaced the bundled risk context with an ECTO cigarette-smoking exposure and calibrated PREDISPOSES edge. Split mixed VCC1 organotypic/xenograft evidence into IN_VITRO and MODEL_ORGANISM items, connected biomarkers and treatments, narrowed sentinel-node radiotherapy, added separately caveated very-low-certainty adjuvant node-positive radiotherapy, calibrated platinum and molecular-subtyping wording, strengthened HPV-vaccine prevention, and added epidemiology, nodal prognosis, lichen-sclerosus surveillance, and a model-fidelity knowledge gap with a subtype-stratified organoid/CAF experiment. Follow-up removed the deprecated free-text prevalence percentage and moved precursor/risk-context labels from progression subtype foreign keys into phase text, because they are not disease subtypes. Validation passed schema, ontology terms, cached references, target graph integrity, D2P completeness, 36/36 rendered node anchors with no duplicate IDs, and focused tests; validator-generated cache churn was restored.

  details: |
    Review response on PR #10011, addressing four IMPORTANT items, the reviewer's request for an end-to-end consistency read, and two suggestions.

    Item 1, two notes blocks narrated this pull request's own revision history. Both were deleted. notes renders on the public disorder page as clinical content, and a reader there is asking about the disease rather than about the review thread. Both narratives are already recorded in full in the history record for the previous round, so nothing was lost. The reviewer's non-blocking aside about the same voice appearing in two descriptions was also taken: prose justifying a schema field choice to a reviewer was removed from the somatic-hit edge description and from the sarcoma node.

    Item 2, a comparative-genomics finding was graded HUMAN_CLINICAL. The retroviral-integration sentence reports sequence and phylogenetic analysis across primate genomes with no patient, cohort or clinical observation behind it. Both occurrences were regraded COMPUTATIONAL together, since check-snippet-grading keys on the quoted sentence rather than the reference and changing one alone would have traded the finding for a gate failure. The first occurrence also lacked a directness value and was given DIRECT to match its sibling.

    Item 3, metaphyseal striations was missing. It is the fourth component of the cortical-growth phenotype described in a sentence already in the reference cache, it has an exact HPO term, and nothing needed fetching. Added as HP:0031367. The same sentence was also added as a second evidence item on Bone Infarction, because it localises the infarctions to the bone marrow and therefore narrows what the broader Avascular necrosis binding is standing in for. The quote begins after the word phenotype to avoid the mid-hyphen wrap at bone-dysplasia that the reviewer warned about.

    Item 4, the metabolic node asserted modifier DECREASED on L-methionine salvage and purine ribonucleoside salvage while its own description said flux through those pathways has not been measured. Both modifiers were dropped, with a descriptor description on each recording that the direction is inferred from the enzymology rather than measured. The modifier on S-methyl-5-thioadenosine phosphorylase activity was kept, because the MTA accumulation measurement earns it.

    The reviewer observed this was the third consecutive round where a claim in the entry contradicted another claim in the same entry, and asked for one end-to-end read looking for the pattern rather than a fix to the single instance. That read was done by extracting every prose field in the file and flagging every absence or negation claim for manual review. Thirteen were found. Twelve are accurate and mutually consistent as written. One was stale: an explanation on the metabolic knowledge gap still said the mechanism remains unmapped, which reads as contradicting the rewritten rationale stating that both endpoints are now measured. It was narrowed to say the route between the measured endpoints remains unmapped.

    Two suggestions were taken. The Mtap(lacZ) heterozygous mouse, deferred across three rounds, is now curated. It is a FAILS_TO_RECAPITULATE link at LOW fidelity against the sarcoma node: losing one allele does predispose to malignancy, which supports the tumour-suppressor mechanism, but the tumour is T-cell lymphoma and the animals have no bone dysplasia. Its limitations record that this is a null allele rather than the human lesion, that the retroviral-derived exons have no mouse counterpart so the isoform-balance effect is absent entirely, and that nothing distinguishes whether the tissue mismatch follows from that or from species differences in lineage vulnerability. Its readout is graded REFUTE. As the reviewer noted, this partly answers the entry's own single-laboratory knowledge gap, and that gap was updated to say which strand is now corroborated from outside the discovery laboratory and which remains single-source.

    A PRMT5 knowledge gap was added. The exclusion of PRMT5 inhibition from treatments stands and is unchanged, but the question is better posed than the exclusion implies: serum MTA accumulates in patients and the tumour does lose the wild-type allele, so whether these tumours reach the MTA-high PRMT5-dependent state has never been measured. The discussion notes state explicitly that nothing here supports offering PRMT5 inhibition to a patient.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (43/43), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading and just check-folded-hyphens. Compliance 92.9 percent.

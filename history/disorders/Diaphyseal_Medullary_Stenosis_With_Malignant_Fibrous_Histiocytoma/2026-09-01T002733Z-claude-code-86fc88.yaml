  summary: 'Review response: substantiate the failure link, regrade the readout evidence'
  details: |
    Review response on PR #10011 addressing one CRITICAL and two IMPORTANT items.

    The CRITICAL item was a genuine test failure that this pull request's continuous integration could not see. The FAILS_TO_RECAPITULATE link added in the previous round carried limitations but no link-level evidence, which CLAUDE.md makes mandatory for that relationship because asserting that a model does not reproduce a human mechanism is a substantive negative claim. Evidence on the parent model and evidence on the readout are different objects and neither satisfies the check. test_failure_to_recapitulate_links_are_substantiated was failing. It was invisible here because continuous integration selects pytest by changed path and a kb-only pull request matches neither the python nor the schema filter, so the entry would have merged green and turned main red afterwards. Evidence was added at link level, and the full KB data lane was run locally rather than trusted to the gated one: 47,112 tests pass.

    The second item was an inverted evidence grading. The readout evidence was marked REFUTE, which asserts that the cited sentence contradicts the claim it is attached to. That is backwards: the quoted observation is what the readout is made of, so it supports the readout's own claim. The negative meaning was already carried twice over, by the relationship value FAILS_TO_RECAPITULATE and by direction ALTERED. Regraded SUPPORT with an explanation recording why the evidence direction is not the place to express model infidelity. Nothing gates this, since check-snippet-grading deliberately leaves supports alone as claim-relative.

    The third item was PR narration reintroduced into a description in the same commit that removed it from two notes blocks. The clause naming what the entry had previously omitted was trimmed.

    Two suggestions were taken. The single-laboratory knowledge gap now states explicitly which strand the independently made mouse corroborates, MTAP as a tumour suppressor independent of CDKN2A and ARF, and which it cannot touch, the retroviral-exon splicing mechanism, since the mouse carries a null allele and those exons do not exist in its genome. The sarcoma phenotype was given a FREQUENT band with a notes paragraph recording that the 35 percent figure is a within-pedigree proportion from kindreds ascertained because they had sarcoma, so it describes the families that came to attention rather than the lifetime risk of a carrier found another way.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (44/44), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading, just check-folded-hyphens, and the full tests/test_data.py lane.

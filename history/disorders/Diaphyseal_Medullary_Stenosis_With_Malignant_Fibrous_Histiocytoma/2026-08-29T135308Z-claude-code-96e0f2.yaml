  summary: 'Review response: MTA is measured; regrade node, split phenotype, add diagnosis'
  details: |
    Review response on PR #10011, addressing one CRITICAL and four IMPORTANT items, plus a CI failure.

    The CRITICAL item is the fourth instance in this session of the same defect: asserting that the literature contains no measurement of something, and being wrong. This time the measurement is in the paper the entry is built on, in a Results section, in the cache file this PR itself commits. PMID:22464254 reports serum methylthioadenosine levels in a blinded assay: undetectable in all three unaffected individuals, accumulating in both affected individuals. MTA is the direct substrate of MTAP and a by-product of polyamine synthesis, so this is a direct in-vivo demonstration that the enzyme step is impaired in patients.

    Three consequences were applied. The prose was corrected in both places that made the false claim. mechanism_confidence on the metabolic node was raised from HYPOTHETICAL to ESTABLISHED, because the stated reason for HYPOTHETICAL was the absence of any patient measurement and that premise is gone; the small sample is recorded in notes rather than used to justify a weaker grade, since n does not change what kind of evidence it is. The result sentence was added as SUPPORT and HUMAN_CLINICAL alongside the existing background item, together with the baseline sentence establishing that MTA is not normally present in human serum. The genuinely unmapped step, metabolite to bone, survives intact and its knowledge gap was rewritten to say so accurately.

    The presenile cataract note asserted that HPO has no presenile-cataract term. HP:0007819 Presenile cataracts exists. Rebound, and the note now records that the earlier claim was written without being checked.

    Following the reviewer's suggestion to re-check the other no-term-exists judgements by the same route, an audit was run across all five entries authored in this session. It found two further false claims, both in Hyperostosis_Cranialis_Interna and both fixed in the companion commit: HPO does carry graded olfactory terms, so Anosmia was rebound to HP:0004409 Hyposmia, which is also the honest match for a source reporting a disturbance rather than an abolition of smell; and HP:0031912 Trigeminal anesthesia does exist, so the note claiming no trigeminal term was corrected, while the preference for the general Hypoesthesia survives on the narrower and still-valid ground that anesthesia denotes complete loss and the source reports impairment. The cheek-pad and facial-gestalt claims in the other entries were checked and hold.

    The eponymous phenotype had been bundled under the generic HP:0003103 Abnormal cortical bone morphology. It was split into HP:0100254 Stenosis of the medullary cavity of the long bones and HP:0005045 Diaphyseal cortical sclerosis, and bone pain was added as HP:0002653.

    The two causal variants were curated with their functional difference, which the entry's own myopathy knowledge gap turns on: c.885A>G reduces all exon-9 isoforms by about 70 percent with no effect on archetype MTAP, and both variants raise MTAP_v3 and _v6 expression to the same degree, so the shared effect is a shift in isoform balance rather than a common loss.

    Diagnosis and treatments sections were added, which the entry had lacked entirely while arguing that surveillance is the reasonable posture. Radiographic screening of relatives from puberty is the one explicit published recommendation and is now curated, with thallium scanning distinguished as the tumour-directed rather than dysplasia-directed modality. A molecular testing entry records the exon-9 caveat: the causal exon lies roughly 65 kb downstream of the canonical termination site and is not covered by standard exome or panel designs, so a negative panel is uninformative. The variant-numbering trap against GenBank AK309365 rather than NM_002451 is recorded in the same place. The MTAP-PRMT5 synthetic-lethality axis is explicitly excluded from treatments with the reason stated, since that strategy targets homozygous-deletion tumours with absent protein while this syndrome retains archetype MTAP.

    A CI failure was also fixed. check-snippet-length rejected a four-word prevalence snippet that had been trimmed to avoid an fi ligature in the source. The fragment carried no propositional content and the check was right; it was replaced with two complete sentences documenting the cohort composition. A second ligature-truncation was hit while adding the variant evidence and resolved the same way.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (33/33), just check-entity-refs, just check-duplicate-keys, just check-snippet-length and just check-folded-hyphens. Compliance 93.2 percent.

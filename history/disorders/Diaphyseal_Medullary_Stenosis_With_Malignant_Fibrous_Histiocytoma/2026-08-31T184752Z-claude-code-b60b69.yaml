  details: |
    Review response on PR #10011 addressing two IMPORTANT findings and five suggestions, plus a rebase and the supports/directness schema migration.

    Finding 1 is the same failure mode as the previous round, in the other half of the disease. Three places in the entry stated that the tumour-suppressive mechanism had not been characterised, that whether the sarcoma risk is direct loss of MTAP function or mediated by the abnormal bone environment was unresolved, and that no mechanism had been implicated in the sarcoma. The paper this PR caches characterises it: in an osteosarcoma from an affected individual carrying c.885A>G, direct sequencing showed tumour homozygosity for the mutation, and loss-of-heterozygosity analysis across the 2.9 Mb critical region showed complete loss of the wild-type allele from the unaffected chromosome. That is Knudson's two hits, and it answers the question in the direction of direct loss of MTAP function.

    A Somatic Loss of the Wild-Type MTAP Allele node was added between the germline mutation and the sarcoma node, graded ESTABLISHED. Its incoming edge is typed INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT, because a second independent somatic event stands between the inherited allele and the tumour: the germline lesion predisposes to the second hit rather than causing the tumour directly. The three false or overstated passages were corrected, with the genuinely open parts preserved: what the biallelic metabolic state does to permit transformation, and whether the abnormal bone environment additionally contributes, are still unresolved and still recorded as such.

    Finding 2, the tumour spectrum, is now curated at histology. The entry carried one neoplastic phenotype bound to the general HP:0100242 Sarcoma. HP:0002669 Osteosarcoma and HP:0100244 Fibrosarcoma were added, both with direct quotable support in the cache. This matters because the reclassification is the clinically consequential part of the paper: the tumours were reported as malignant fibrous histiocytoma or bone fibrosarcoma, and re-review found osteoid, which makes at least one of them histology-proven osteosarcoma. The general term is retained as the anchor, since HPO has no bone-sarcoma term.

    The fibrosarcoma snippet is truncated at a line break where a superscript reference marker separates MFH from the words bone fibrosarcoma in the extracted text. The explanation records that, and gives the full sentence, rather than quoting across a break that no exact-substring match can span.

    Five suggestions were taken. The explanation on the PMID:10612808 loss-of-heterozygosity item was corrected to include the hereditary specimen, which the previous wording had dropped and which changes what the quote is being used to say. Surveillance and Symptomatic Management was retyped from therapeutic_modality BEHAVIORAL to OTHER, since radiographic surveillance is not a behavioural intervention and the CLAUDE.md backfill table deliberately excludes generic supportive-care terms. The myopathy phenotype now records the limb-girdle and facioscapulohumeral-like distribution in a descriptor description while keeping the general term, because two families are not enough to bind a distribution term. A residual sentence describing the first step after the splicing defect as inference was corrected, since the MTA measurement made it a measurement.

    The remaining optional items were not taken: the Mtap mouse as FAILS_TO_RECAPITULATE with a HUMAN_MODEL_MISMATCH discussion, NCT00007046, serum MTA as a biochemical record, and two further HPO terms all require references to be fetched and verified first.

    Separately, the branch was rebased onto current main, 120 commits ahead, and the five PARTIAL evidence items were migrated to the new supports and directness schema from PR #10003. Each was mapped individually rather than swept.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (37/37), just check-entity-refs, just check-duplicate-keys, just check-snippet-length, just check-snippet-grading and just check-folded-hyphens. Compliance 93.9 percent.

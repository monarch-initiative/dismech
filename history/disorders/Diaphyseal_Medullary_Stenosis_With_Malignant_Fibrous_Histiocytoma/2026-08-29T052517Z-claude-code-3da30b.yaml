  details: |
    Created kb/disorders/Diaphyseal_Medullary_Stenosis_With_Malignant_Fibrous_Histiocytoma.yaml (MONDO:0007205, MTAP).

    Deep research was requested from falcon, which is not configured here, so the run used --fallback and claude_code produced the report. It was clean: 19 of 19 references verified, 0.0 confabulation rate, both checked quotes valid, no not-found and no obsolete terms. Its four flagged label mismatches are artifacts of source names and prose appearing in the label column of the report's own tables rather than wrong bindings.

    The entry was drafted from primary literature first and the report then contributed real content. It supplied the pedigree-level distribution of myopathy, presenile cataracts, and the observation that fewer than six families have been reported, each of which was then verified against the primary full text before use.

    Two facts from the full text materially changed the entry and neither was in the abstract. First, one of the two reported mutations is synonymous, c.885A>G, changing no amino acid. That is the most informative single fact about this lesion: a synonymous change cannot act by altering the protein sequence, so the splicing mechanism is the explanation rather than one candidate among several, and the entry now says so in the description and cites it. Second, myopathy was not present in the three originally described families and entered the phenotype when two further families with facioscapulohumeral-like muscular disease were characterised. The phenotype is retained, since the defining report names it as one of three components, but its description and a knowledge gap now record that it is a feature of the syndrome as defined rather than of every pedigree, and that the two myopathic families carry different mutations so a simple allele correlation does not explain it.

    A Named Entity Confusion warning is recorded in the entry notes. MTAP is far better known as a somatic passenger deletion adjacent to CDKN2A at 9p21, and MTAP-deleted tumours are an active PRMT5 target; that literature concerns homozygous somatic deletion in tumour cells and is not about this syndrome, whose lesion is a germline splicing mutation in a retroviral-derived exon. A gene-symbol search returns overwhelmingly the former. The one genuine connection, loss of heterozygosity across the same 9p21-22 interval in five of seven informative sporadic bone malignant fibrous histiocytoma specimens, is curated with its own evidence in the genetic block.

    Per the granularity ladder in the design-decision register this is a germline predisposition syndrome and follows the plain Mendelian rules, staying separate from the somatic sarcoma entries it predisposes to.

    Three knowledge gaps are recorded: the entirely unmapped route from the splicing defect to bone infarction, cortical dysplasia and sarcoma, including the structural reason no conventional mouse model can exist since the causal exons are primate-specific retroviral insertions; the dependence of the whole molecular understanding on a single laboratory, which matters more than usual for a claim this unusual; and the unexplained variability of myopathy across families.

    Nomenclature is deliberately historical. Malignant fibrous histiocytoma is the term used throughout the primary literature and is retained in the disease name and quoted snippets; the description notes the entity was later reclassified as undifferentiated pleomorphic sarcoma.

    One snippet begins mid-sentence because the preceding word in the cached PDF text is set with an fi ligature, which no exact-substring quote can span; the explanation records why.

    Validated with just validate-disorders, just validate-terms, just count-verified-snippets (23/23), just check-entity-refs, just check-duplicate-keys and just check-folded-hyphens. Compliance 91.2 percent.

  summary: 'Review response: reparent the second-hit edge, fix the contradicting rationale'
  details: |
    Review response on PR #10011, addressing two IMPORTANT findings and one suggestion.

    Finding 2 was a genuine graph error introduced by the previous commit. The Somatic Loss of the Wild-Type MTAP Allele edge was placed in the downstream list of Impaired Polyamine and Methionine Salvage Metabolism, so the pathograph asserted that impaired polyamine and methionine salvage causes the second somatic hit. Nothing supports that, and the edge's own description named a different subject: the germline lesion. The evidence is tumour homozygosity for the germline allele, a genetic observation with no metabolic content. The edge was moved to MTAP Retroviral-Exon Splicing Mutation, three nodes upstream, which makes the graph the Knudson chain the prose describes: germline first hit, then somatic loss of the remaining copy, then sarcoma. The metabolic node now correctly feeds only the dysplasia, and the graph remains a single connected component.

    The reviewer also flagged that causal_link_type read oddly once the parent changed, without offering a confident answer. It was changed from INDIRECT_KNOWN_INTERMEDIATES to INDIRECT_UNKNOWN_INTERMEDIATES. The reasoning is that the germline allele does not cause the second hit at all: loss of the remaining wild-type copy is a stochastic somatic event, and what the inherited allele supplies is the vulnerability that makes that loss consequential. No mechanism linking the germline lesion to the occurrence of the somatic event has been established, which is what unknown intermediates records, whereas known intermediates would assert steps in between that nobody has described.

    Finding 1 was a rationale contradicting the entry in two places, and the previous fix had stopped partway through the sentence, leaving an orphaned line wrap that the reviewer correctly read as the signature of an incomplete edit. The claim that the first step after the splicing defect is inference from what the enzyme is known to do contradicts the same file's statement, thirty lines earlier, that substrate accumulation in vivo is a direct demonstration and not an inference from what the enzyme is known to do. The claim that no mechanism has been implicated in either the dysplasia or the sarcoma became false in the same commit that added the somatic second-hit node graded ESTABLISHED. The rationale was rewritten to say what is now true: both endpoints are measured, substrate accumulation showing the enzymatic step is perturbed and somatic allele loss showing how the tumour arises, while the road between them is not, with the dysplasia half of the original claim preserved because it remains correct.

    One suggestion was taken. Serum methylthioadenosine is now a biochemical record bound to CHEBI:17509, reusing the same verified quotes, so the measurement is findable as a candidate diagnostic analyte rather than existing only as pathophysiology prose. The record states plainly that it is a candidate rather than an established test: five people is the entire dataset, there is no reference interval, no assay is in clinical use, and nothing is reported about whether the level tracks disease activity or sarcoma risk. The duplication with the pathophysiology node is deliberate and is explained in the notes, since the node needs the evidence to justify its ESTABLISHED grade while this record answers a different question.

    Biochemical has no description slot, so the prose was folded into notes after an initial attempt failed validation.

    The remaining optional items were not taken: the Mtap mouse as a FAILS_TO_RECAPITULATE model with a HUMAN_MODEL_MISMATCH discussion, NCT00007046, and HP:0005010, all of which need references fetched and verified first.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (39/39), just check-entity-refs, just check-snippet-grading and just check-folded-hyphens. Compliance 94.1 percent.

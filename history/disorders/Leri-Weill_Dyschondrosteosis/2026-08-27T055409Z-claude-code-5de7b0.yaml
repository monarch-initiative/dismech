  summary: Wire the pathograph and add adult quality-of-life burden
  details: |
    Final-pass review. Phenotype causal-inlink went from 2/14 to 14/14: the SHOX haploinsufficiency node now names the growth phenotypes it explains and the estrogen node names the wrist consequences of the Madelung geometry, with scoliosis and high arched palate marked INDIRECT_UNKNOWN_INTERMEDIATES since no route from the growth plate lesion has been described. Added a clinical_burden block from PMID:42392998, a Norwegian cross-sectional study of adults: near-universal current pain, 42 percent with a prior psychiatric diagnosis, and mental health scoring below adults with other skeletal dysplasias rather than merely below population norms. Recorded the responder-bias caveat in notes. Added PMID:41078317 to the genetic section for SHOX-region duplications and their reduced upstream CpG methylation, marked PARTIAL because only one of two islands reached significance and causation is not established. All 65 snippets verify.

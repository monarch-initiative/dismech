  details: |
    Responded to the ai4c-reviewer CHANGES_REQUESTED review. Blocking finding: PMID:38504427 carried a paraphrased reference_title in two evidence items of Autosomal_Recessive_Robinow_Syndrome; replaced with the cached title verbatim. Added 14 missing reference_title values under animal_models modeled_mechanisms and readouts across four entries. Wired every therapeutic treatment across the touched entries into its pathograph via target_mechanisms, with descriptions stating what each acts on; genetic counseling left deliberately unwired and tagged action_category COUNSELING_INFORMATIONAL per the schema, which excludes counseling, screening and monitoring actions from target_mechanisms. Applied four of six suggestions: removed a backwards causal edge in Langer, where the zeugopod-restricted SHOX expression domain is a precondition rather than a consequence and now feeds the growth-plate node; moved the Global developmental delay edge in Omodysplasia off the dominant FZD2 branch onto the recessive GPC6 node, matching the phenotype own OMOD1 subtype scoping; split a mixed human/mouse snippet in Kantaputra into HUMAN_CLINICAL and MODEL_ORGANISM items; added somatropin as therapeutic_agent on both growth hormone therapies. Two suggestions argued rather than applied and explained on the PR. Also reverted the isds_skeletal_nosology.yaml description rewrite that the curation-scope guard rejected, since it is separable and belongs in its own PR. Validation: 442 of 442 snippets verified, 14 files pass validate-disorders, and check-reference-titles, check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-stubs all clean.

  summary: Tag KATP gating edges as hypothesis; assess OpenScientist run
  details: |
    Opted the eight pathophysiology edges running from the ABCC9 C-terminal catalytic-domain variant through the SUR2A ATP cycle, Kir6.2 mis-gating, failed metabolic decoding, calcium overload and calcineurin remodeling to left ventricular dilation into hypothesis_groups: [katp_metabolic_gating_failure], so the pathograph marks which edges belong to the proposed model rather than to established mechanism. Attached the existing knowledge gap abcc9_dcm_gene_disease_validity to mechanistic_hypotheses#katp_metabolic_gating_failure. Ran an OpenScientist hypothesis exploration on the gating model (job 2a29b55d-1b26-4de1-9bc4-600efa583abb) and committed the report, its checksummed gnomAD/ClinVar artifact bundle and an assessment sidecar. The run verdict is PARTIALLY_SUPPORTED and the hypothesis stays EMERGING: the molecular arm is recombinant-only, the myocardial arm rests on a Kir6.2/KCNJ11 knockout rather than an ABCC9 allele, and nothing joins them in a heart. Verified the provider's figures by replaying its committed gnomAD constraint query (identical to full precision) and reproducing the p.Ala1513Thr allele counts and the absence of any expert-panel ABCC9 ClinVar record. Rejected two of its claims: the pairing of VCV 856369 with p.Ala1513Thr, which its own derived artifact contradicts, and GO:0008282 offered as a channel activity when it is the Kir6.x/SURx complex. Validated with just validate, check-entity-refs, check-causal-targets and validate-hypothesis-assessment.

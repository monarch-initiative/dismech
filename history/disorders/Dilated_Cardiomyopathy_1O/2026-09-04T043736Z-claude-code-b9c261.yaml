  details: |
    Created kb/disorders/Dilated_Cardiomyopathy_1O.yaml (CMD1O, MONDO:0012062, ABCC9/hgnc:60) from the Edison/falcon deep-research report research/Dilated_Cardiomyopathy_1O-deep-research-falcon.md, used as leads only. Curated as a channelopathy route into dilated cardiomyopathy rather than a structural one: a 10-node causal chain runs from a heterozygous exon-38 C-terminal ABCC9 catalytic-domain variant, through a displaced SUR2A ATP hydrolytic cycle (GO:0016887, DYSREGULATED) and defective catalysis-mediated Kir6.2 pore gating (GO:0015272, LOSS_OF_FUNCTION), to failed metabolic-electrical stress adaptation, cytosolic calcium overload, calcineurin-dependent remodeling, and the dilated/arrhythmic ventricle; five phenotypes hang off it and all are reachable. Three nodes conform to cardiomyopathy_maladaptive_remodeling; the entry deliberately does NOT conform to cardiac_ion_channel_repolarization, whose scope is arrhythmia syndromes in structurally normal hearts. The gene-disease relationship is curated as DISPUTED throughout (ClinGen DCM GCEP: Limited, 2024-11-15, SOP10), with a REFUTE-typed ClinGen evidence item, a KNOWLEDGE_GAP discussion, and matching prose in diagnosis, treatments and genetic counseling. Separation from the two other ABCC9 diseases is stated explicitly in the description and curated as differential_diagnoses entries: recessive biallelic AIMS (a separate existing dismech entry, not edited here) and gain-of-function Cantu syndrome. Three report defects were found and corrected. (1) The report attributes the ClinGen Limited classification to Micolonghi 2024 (PMID:39337275); the word Limited does not appear anywhere in that paper's cached full text, which instead says ABCC9 mutations are directly associated with DCM. The classification is cited from ClinGen itself (CGGV:assertion_8be22ebc-f0f5-4de5-9c2a-382ebd02c533-2024-11-15T170000.000Z). (2) The report cites zero PMIDs and only DOIs; all 14 references used were resolved to PMIDs via the PMC ID converter or PubMed so nothing sits on the DOI: prefix that the gating validator skips. (3) Its frontmatter carries mondo_id: '' (dismech#10335), so just preflight-dr was run by hand against MONDO:0012062 and PASSed (ABCC9 mentioned 37 times, no competing gene). No report-proposed CURIE needed correcting - it offered only UBERON:0000948 for heart, which resolves and is unused here - but one term I selected myself was wrong and was caught by validate-terms: NCIT:C38048 is Vasovagal, not Ambulatory Electrocardiography; replaced with NCIT:C38064 Holter Monitoring. Every HP, GO, CL and NCIT term was independently re-derived against OLS. Ejection fraction is bound to the ungraded HP:0012664 rather than the severe grade HP:0012666 because the grade would rest on numbers only in the paywalled 2004 full text. Specific EF values, chamber dimensions, ages, and the 500-control panel size were deliberately not carried over for the same reason, and the omission is recorded in notes. No clinical_trials block: ClinicalTrials.gov was searched directly for five term variants and the only ABCC9-named study is NCT04120766, a nicorandil trial in hippocampal sclerosis; the absence is recorded as a KNOWLEDGE_GAP. No environmental, datasets, or ORPHA blocks, each with a stated reason in notes. Validation run to completion: just validate PASS (68/68 snippets verified, schema and term validation clean); validate-terms PASS; validate-disorders PASS (batched, the CI gate); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all OK on the file; check-qualifier-terms-online resolved the one uncached device CURIE and matched; whole-KB check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-not4curation and check-term-cache-integrity all report no new defects and no baseline was modified. kb/groupings/Familial_Dilated_Cardiomyopathy.yaml was deliberately NOT edited to avoid conflicting with sibling curation PRs on its members list; left for a batched maintainer pass.

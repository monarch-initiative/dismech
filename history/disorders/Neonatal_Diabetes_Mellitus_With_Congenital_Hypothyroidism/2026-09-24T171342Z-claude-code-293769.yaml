  details: |
    Addressed CHANGES_REQUESTED on PR #12694. Rebound Congenital Glaucoma from HP:0008007 Primary congenital glaucoma to HP:0001087 Developmental glaucoma (verified via OLS: HP:0008007 is-a child of HP:0001087, and HP:0001087 is the syndromic/childhood glaucoma parent), keeping preferred_term Congenital glaucoma. Qualified the thyroid node: the mTORC1 follicular-proliferation claim (global knockout PMID:29083325) is now scoped, because the thyroid-specific Glis3-Pax8Cre knockout (PMID:37461635) keeps proliferation normal while biosynthesis genes stay suppressed, added as SUPPORT plus the Pax8Cre model as a fourth animal_models entry (biosynthesis RECAPITULATES). Moved the GO:0097730/GO:0072372 substitution note out of the Renal Cystogenesis description into notes:. Added four VERY_RARE phenotypes from PMID:26259131 (craniosynostosis HP:0001363, hiatus hernia HP:0002036, atrial septal defect HP:0001631, choanal atresia HP:0000453) sharing one exact new-presenting-features quote; all HP terms verified. Added an experimental_models entry for the HUES8 hESC CRISPR GLIS3 knockout (PMID:27133796), FAILS_TO_RECAPITULATE against Impaired Endocrine Pancreas Differentiation with two exact quotes, an honest negative human-model result. Added a sulfonylurea-non-response note on Insulin Therapy sourced to PMID:34093443 (insulin vs sulfonylurea molecular-diagnosis sentence). Snippets now 88/88 verified; validate, validate-terms, all offline gates and validate-disorders pass.

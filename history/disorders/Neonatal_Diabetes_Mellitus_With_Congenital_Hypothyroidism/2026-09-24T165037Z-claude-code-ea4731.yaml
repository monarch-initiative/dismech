  summary: 'Create: Neonatal_Diabetes_Mellitus_With_Congenital_Hypothyroidism'
  details: |
    New entry for GLIS3-related neonatal diabetes with congenital hypothyroidism (MONDO:0012436), claim issue #12681. Curated from PubMed primary literature: the 2003 index family (Taha et al.), the 2006 gene discovery (Senee et al.), the Dimitri et al. 2011 and 2015 case series and 2016 facial-phenotype report, later case reports, the liver transplant/bile duct paucity report, and mouse and cell studies of GLIS3 in Neurog3 transactivation, insulin promoter regulation, TSH-dependent thyroid hormone biosynthesis, primary cilium/renal cysts and osteoblast differentiation. Ten pathophysiology nodes, 21 phenotypes (15 causally connected; hearing loss, developmental delay and four facial features left unconnected because no mechanism is sourced), three mouse models. Deep research: an OpenScientist run completed (exit 0), reference validation 25/25 resolved with 25/25 quotes found, term validation needs_review for paraphrased labels only, preflight-dr PASS. Its leads added PMID:37461635 (thyroid-specific Glis3 knockout, dyshormonogenesis rather than dysgenesis) and PMID:40583116 (high hyperopia with congenital glaucoma, and juvenile hypothyroidism in heterozygous carriers), each re-read from the fetched abstract. GLIS3 GWAS susceptibility for type 1 and type 2 diabetes is recorded in notes only. GO:0072372 primary cilium failed the CellularComponentTerm enum, so the node binds GO:0097730 non-motile cilium. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validation: validate, validate-terms, count-verified-snippets 77/77, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-folded-hyphens, check-reference-titles, check-qualifier-terms and validate-disorders all passed.

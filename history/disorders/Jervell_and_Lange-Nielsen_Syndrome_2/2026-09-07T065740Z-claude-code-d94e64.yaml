  summary: Align the hearing-loss frequency rationale with the VERY_FREQUENT band
  details: |
    The re-review on PR #11275 approved and raised one non-blocking suggestion: the notes added to the Congenital Profound Bilateral Sensorineural Hearing Loss phenotype in the previous round argued the feature is 'present in essentially all ascertained patients', which is FrequencyEnum.OBLIGATE's own description (HP:0040280, present in all cases), while the value set was VERY_FREQUENT (HP:0040281, 80-99%). Read literally the band asserts that up to a fifth of patients lack the feature, which the note denied. The value and its stated reason pointed at different enum members.

    The band is kept and the rationale is corrected, which is the conservative of the two fixes the reviewer offered. The distinction is in the qualifier rather than in the feature: congenital sensorineural deafness as such is definitional, since GeneReviews characterises JLNS by it and the diagnosis requires it, and on that alone OBLIGATE would be defensible. What this phenotype asserts is the profound bilateral form named in its own title, and severity is not uniform across reported patients, so the lower band avoids over-claiming on a qualifier no cited source quantifies. Choosing OBLIGATE instead would have attached a 100% claim to profundity rather than to deafness, which GeneReviews does not support. The note now says this, so the choice of band follows from the argument given for it.

    The second paragraph of that note is retained and sharpened: this remains a different kind of claim from the undenominated GeneReviews word 'frequent' that was rejected as a frequency source for the iron-deficiency anemia and hypergastrinemia phenotypes two rounds ago, because those carry no numerator, no denominator and no definitional standing, whereas this one is bounded below by a diagnostic criterion.

    The reviewer noted this was not worth a re-review cycle on its own and suggested folding it in only if the file were touched again. It is pushed anyway: the defect is a self-contradiction between a curated value and the prose justifying it, in a knowledge base whose value rests on that prose being checkable, and the PR does not merge for three days under the auto-merge age guard, so a fresh review cycle costs schedule nothing. The push does dismiss the standing approval, which is the accepted cost.

    No other change. Validation: just validate passes (schema, terms, references); snippet audit 103/104 with one skipped by prefix, unchanged because no snippet text was touched; check-enum-values clean.

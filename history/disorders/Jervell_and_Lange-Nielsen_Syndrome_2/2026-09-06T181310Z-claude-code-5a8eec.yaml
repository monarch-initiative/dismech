  summary: 'Self-review round: ontology corrections, overstated-claim fixes, frequency
    removal, cochlear experiment retarget'
  details: |
    Self-review round on the augmentation committed in 1cc6aab94, before any PR was opened. An independent reviewer subagent was run against the uncommitted diff following .claude/skills/dismech-pr-review; it confirmed the KCNE1-versus-JLNS1 scope discipline held and that all new snippets were exact, and raised twelve findings plus several minor ones. Each was checked against the ontologies and cached sources before acting; eleven were accepted, one was accepted in part, and the reasoning for the partial is recorded below.

    Ontology corrections. Gross motor developmental delay was bound to HP:0001270 (Motor delay), the parent, when HP:0002194 (Delayed gross motor development) exists, is already in the phenotypeterm enum cache, and has KB precedent; the preferred_term had also been downgraded to echo the broader label, which is backwards under the ontology-term contract. Rebound to HP:0002194 with a matching preferred_term. The atrial-pacing treatment was bound to the generic NCIT:C15329 (Surgical Procedure) when NCIT:C80434 (Pacemaker Placement) exists, is cached, is reachable from NCIT:C25218 via C15329, and is the exact sibling of the NCIT:C80435 already used for ICD placement in this entry; rebound to C80434. The gastrin biomarker was bound to NCIT:C193574 (Gastrin [Mass/Volume] in Serum or Plasma), which asserts a units convention no source states; rebound to NCIT:C74858 (Gastrin Measurement), matching the unit-agnostic "X Measurement" pattern its sibling hemoglobin record already used.

    Claims that outran their evidence. The Bradycardia phenotype description said bradycardia is "often the finding that prompts cardiologic referral", and the first progression phase said bradycardia "brings the child to cardiology". The source sentence says the opposite in its second clause: presentation to cardiology is attributed to prolonged QT intervals and T-wave alternans. Both were rewritten to state what the source states, with bradycardia kept as the earliest detectable manifestation. The ICD evidence explanation called a non-randomised within-registry comparison "the strongest published support" for device therapy; reworded to name the design and to carry the authors' own hedge. The Iranian case_fractions record presented 0.0 beside the Egyptian 1/52 as if comparable, when the study never states how many of its 14 patients were solved, so the denominator is patients screened rather than cases explained; the notes now say so and the explanation now says the zero rests on the study's silence about KCNE1 rather than on an explicit negative statement.

    frequency: FREQUENT was removed from the iron-deficiency anemia and hypergastrinemia phenotypes. It had been assigned from the GeneReviews clause "frequent features of JLNS", but FrequencyEnum.FREQUENT asserts the 30-79% HPO band, "frequent" is not in the prose-to-enum mapping table, and the statement is syndrome-level rather than KCNE1-stratified, so the band would have been a guess on two counts. Both phenotypes now carry notes recording the qualitative source wording and why the slot is left empty, per the skill's "omit rather than guess" rule.

    The top-level note claimed "Each such record says so in its own notes" for every section resting on syndrome-level sources, but the anesthesia environmental entry and the new ICD evidence did not. Both now carry that sentence, so the note describes the file as it is.

    The knowledge-gap discussion's proposed experiment targeted hiPSC-derived inner hair cells for its cochlear arm, which contradicts this entry's own scope note that the primary JLNS2 cochlear lesion is a stria vascularis marginal-cell ionic defect and that hair cell degeneration is downstream of endocochlear potential collapse. The cochlear arm now targets strial marginal cells and measures apical potassium secretion and transepithelial potential, would_support and would_refute both gained the stria vascularis pathophysiology node with matching outcomes, and the cited quote's explanation now states explicitly that the source's "iPS-IHC models are lacking" concerns hair cells rather than the initiating strial lesion.

    evidence_source on PMID:42389506 was regraded from HUMAN_CLINICAL to OTHER on the four items quoting sentences that are the review's citation-backed synthesis of other groups' work (the fetal bradycardia sentence, the half-by-three/ninety-by-eighteen sentence, and the arrhythmia-trigger list) rather than its own patient series. check-snippet-grading keys on the quoted sentence, not the PMID, so it did not fire on the split; the regrade was made because the slot classifies the cited study's evidence type.

    Partially accepted. The reviewer proposed changing the atrial-pacing therapeutic_modality from DEVICE to SURGERY for consistency with cochlear implantation. Declined: the ICD placement treatment in this same file already uses DEVICE, and it is the nearer analogue of a pacemaker implant than a cochlear implant is, so switching would trade one inconsistency for another. The choice and its reasoning are now recorded in that treatment's notes. The reviewer's related point that the treatment bundles a device with a small molecule and carried no agent for the beta-blocker half was accepted, and NCIT:C29576 (Beta-Adrenergic Antagonist) was added as a therapeutic_agent.

    Also applied: validator mechanics were moved out of a progression explanation into that phase's notes, where the mean-age and QTc figures they concern already lived; an age_range slot on the KCNE1 progression phase that held a description of a follow-up window rather than an age range was removed; a cochlear-implantation note saying "the two evidence items below" was corrected to "two of the three evidence items on this treatment"; and a missing blank line before the DATASETS paragraph of the top-level folded note was added so it does not run into the preceding sentence.

    Not acted on. The reviewer noted that NCIT:C210688 (Iron Supplement) remains as an orphan row in cache/ncit/terms.csv after the iron agent was rebound to CHEBI:18248. Cache rows are derived, authority-backed artifacts that CLAUDE.md says never to hand-edit outside the documented recovery procedure, and the row correctly records that the CURIE exists with that label, so it was left in place. The reviewer also suggested dropping the 115 KB openscientist final_report.pdf as a duplicate of the committed .md and .html; it is part of the provider's own artifact bundle, is well under any size concern, and was kept. The observation that just check-qualifier-terms-online should be run had already been done in the original session and was repeated after the NCIT:C80434 rebinding.

    Validation after this round: just validate and just validate-disorders pass; 103/104 snippets verified with one skipped by prefix, and 104/104 with just count-verified-snippets --unskip-prefix DOI; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean; model-scale-audit --strict exits 0; the file's pytest cases pass. cache/ncit/terms.csv gained one row for NCIT:C74858, added by the validator rather than by hand.

  summary: 'LOINC tranche G: QTc risk band and audiometry measurement'
  details: |
    Bound LOINC:8636-3 (QTc) as a diagnosis measurement on the existing ECG row, with the same 550 ms JLNS risk-stratification band already bound on Jervell_and_Lange-Nielsen_Syndrome_1.yaml (PMID:16461811, PMID:16911578), but with notes flagging that the Schwartz et al. cohort establishing it was 90.5% KCNQ1 (JLNS1) and that same cohort reports the KCNE1 (JLNS2) subgroup runs a more benign course, so the band is not treated as a JLNS2-specific risk estimate. Added a new Pure-Tone Audiometry diagnosis row (LOINC:89015-2 panel plus the eight per-ear frequency codes), mirroring JLNS1's audiometry row with no severity band, since the cited source states no JLNS2-specific audiometric cut-off. Part of LOINC tranche G batch 9 (projects/LOINC_DIAGNOSTICS.md).

  summary: 'Augment JLNS2: classifications, progression, biochemical, models, new
    phenotypes and treatments'
  details: |
    Augmentation pass over the existing JLNS2 (KCNE1) entry created in PR #8811. Deep research: two fresh runs this session, falcon (Edison, 23 citations, 7/7 references verified, confabulation_rate 0.0) and openscientist (19 citations, 19/19 verified). Both reports' Reference Validation and Term Validation sections were read before any content was taken. Neither reported an unresolved reference or an unresolved CURIE. Falcon's single "mislabelled term" is the template placeholder string "(if available)" being parsed as a label for MONDO:0012871, not a real term error. OpenScientist reported two genuine mislabels - it calls UBERON:0002282 "organ of Corti" (actually stria vascularis of cochlear duct) and UBERON:0002295 "stria vascularis" (actually scala media) - so neither CURIE was taken from that report; the entry's pre-existing UBERON:0002282 binding was checked and is correct. The prior falcon report (18 citations, 4 references) was overwritten by the fresh run; the previous version remains in git history.

    Sections added: classifications (harrisons_chapter CARDIOVASCULAR + DISORDER_OF_EAR + GENETICS_ENVIRONMENT_DISEASE, each separately cited; channelopathy_category "cardiac channelopathy", with a note recording that the enum is single-valued and that the cochlear lesion is an epithelial transport defect that would otherwise take a second value); progression (4 phases - fetal/neonatal recognition, childhood arrhythmic onset, untreated natural history, and a KCNE1-genotype-specific phase); biochemical (serum gastrin, hemoglobin); three phenotypes (Bradycardia HP:0001662, T-Wave Alternans HP:0012266, Gross Motor Developmental Delay HP:0001270); frequency: FREQUENT on Iron-Deficiency Anemia and Elevated Serum Gastrin per the GeneReviews "frequent features" sentence; an environmental entry for general anesthesia (ECTO:2000059) with a TRIGGERS mechanism link to the arrhythmogenic substrate node; two treatments (Iron Repletion for Iron-Deficiency Anemia; Atrial Pacing with Beta-Blockade); experimental_models (the CHO-K1 heterologous KCNQ1/KCNE1 automated-voltage-clamp platform, with a modeled_mechanisms link carrying model_scale MOLECULAR, a readout, and two typed divergences); a KNOWLEDGE_GAP discussion recording that no KCNE1-specific human cellular model exists; and case_fractions on the KCNE1 genetic entry. New evidence was also added to existing records: the IKs repolarization-reserve mechanism on the cardiac node (PMID:33963564), the Schwartz/Goldenberg JLNS registry natural history on progression and on the ICD treatment (PMID:16911578), and documented perioperative arrhythmia plus the precaution protocol on cochlear implantation (PMID:31846911).

    New references cached and cited: PMID:16911578, PMID:33963564, PMID:27451284, PMID:31846911, PMID:30942114, PMID:25453094, PPR:PPR1109906. PMID:25453094 (the landmark JLNS hiPSC-cardiomyocyte series) is cited only as evidence for the model gap, because both of its variants are in KCNQ1 and it therefore models JLNS1. PMID:30942114 is a negative result - no pathogenic KCNE1 variant in 14 Iranian JLNS families, only the common c.112G>A polymorphism - recorded as a 0% case fraction with the caveat that the Sanger-only screen would miss a CNV and that the cohort is too small for zero to exclude a low single-digit share. PPR:PPR1109906 is cited by its Europe PMC preprint identifier rather than its DOI so that its snippets are gate-validated; it gives 1/52 (2%) KCNE1 in an Egyptian JLNS cohort, which is a contemporary refinement of the historical ~10% figure the entry previously carried alone. Two candidate references were deliberately not used: PMID:34308870 (deaf-school ECG screening) genotyped its cases to KCNQ1, and PMID:32508908 is a KCNQ1 compound-heterozygote family; citing either here would be Named Entity Confusion.

    Scope discipline: most of the newly added clinical content is syndrome-level (KCNQ1 and KCNE1 pooled) because no KCNE1-stratified data for those features exist. Every such record says so in its own notes, and a paragraph was added to the top-level notes stating which sections rest on syndrome-level sources. The only genotype-specific natural-history record is the KCNE1 phase of progression, from the 19-patient JLNS2 cohort. The atrial-pacing treatment's mechanism description was rewritten during self-review to state the observed outcome and to name the rate-shortens-QT rationale explicitly as standard long-QT reasoning that the cited Norwegian series does not test; that series is also described as genetically confirmed JLNS without breaking out the gene, and Norwegian JLNS is predominantly KCNQ1, so no KCNE1-specific efficacy is claimed. datasets: was left empty: just discover-datasets returned no GEO candidates, and the falcon report independently reports that no validated JLNS2-specific organoid, iPSC series, CRISPR screen, or omics dataset was found; the reasoning is recorded in the top-level notes so the empty section is not mistaken for an unchecked one.

    Term work: an initial binding of NCIT:C210688 (Iron Supplement) failed dynamic-enum validation because it is outside ChemicalEntityTerm, and was replaced with CHEBI:18248 (iron atom), which also avoids over-specifying a salt that GeneReviews does not name. A first draft of the atrial-pacing device qualifier used NCIT:C62273, which is "Mixed Neoplastic Glandular and Squamous Cell Population"; this was caught before commit and corrected to NCIT:C94198 (Cardiac Pacemaker). All 14 newly added CURIEs were re-verified label-exact against OAK, and just check-qualifier-terms-online resolved the two device qualifier terms against the ontology since a qualifier-only CURIE is never cached by anything else.

    Validation: just validate (schema + terms + references) passes; just validate-disorders (the batched pre-PR gate CI runs) passes; snippet audit reports 103/104 verified with 1 skipped by prefix, and just count-verified-snippets --unskip-prefix DOI reports 104/104 with the pre-existing DOI-keyed item included. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-qualifier-terms-online, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean. One snippet from PMID:16911578 initially failed because the validator strips bracketed spans and the source sentence carries [+/-SD]; it was shortened to a bracket-free substring and the dropped mean-age and QTc figures were moved into the phase notes. Compliance 96.8% global / 97.2% weighted before the last two additions; the remaining reported gaps are the deliberately empty datasets section and evidence on proposed_experiments, which are proposals rather than performed work.

  details: |
    Created new dismech entry for Jervell and Lange-Nielsen syndrome 2 (MONDO:0012871, OMIM:612347, KCNE1), resolving issue #8744. Used the falcon (Edison Scientific) deep-research provider (research/Jervell_and_Lange-Nielsen_Syndrome_2-deep-research-falcon.md); ran just preflight-dr against MONDO:0012871 (verdict SKIP because the automated lookup found no MONDO RO:0004003 gene assertion, but manual OMIM cross-check confirmed an exact match on 612347 and KCNE1 dominated report gene mentions 33:17 over KCNQ1). GeneReviews baseline fetched (PMID:20301579, a shared article covering both JLNS1 and JLNS2). Curated pathophysiology as two branches from a shared KCNE1 loss-of-function trigger node: a cardiac branch conforming to cardiac_ion_channel_repolarization (Cardiac Ion-Channel or Calcium-Handling Variant -> Altered Action Potential and Calcium Handling -> Ventricular Tachyarrhythmia -> Syncope and Sudden Cardiac Death) and a cochlear branch conforming to sensorineural_hair_cell_loss starting at Cochlear Ionic Homeostasis Disruption and Oxidative Stress (through Hair Cell Mechanotransduction Failure and Death to Progressive Sensorineural Hearing Loss); the module-conformance-scope rationale is recorded in the entry notes. Carefully avoided importing JLNS1 (KCNQ1)-specific severity/prevalence/vestibular data per issue guidance: cited a JLNS2-specific arrhythmic event rate (10.5%, 2/19 genotype-confirmed patients, PMID:31941373) rather than a higher JLNS1 figure, and recorded a HUMAN_MODEL_MISMATCH discussion noting that the only quantitative human JLNS vestibular study (PMID:25471708) genotyped exclusively KCNQ1 (JLNS1) cases even though Kcne1-/- mice show clear vestibular involvement (PMID:33514733). Added a mechanistic_hypotheses entry reconciling an apparent tension between a 2025 KCNE1 functional screen (PMID:41200805, no dominant-negative effect on the variant panel tested) and an earlier report of dominant-negative KCNE1 missense alleles causing Romano-Ward syndrome (PMID:30461122). Added one animal model (Kcne1-/- mouse, PMID:33514733) with modeled_mechanisms and two quantitative readouts. Validation: just validate (schema+terms+references) passed; just count-verified-snippets reported 47/47 verified; just compliance reported 97.6% global / 98.3% weighted; all 16 file-specific pytest cases in tests/test_data.py (including module-conformance and animal-model-target tests) passed.

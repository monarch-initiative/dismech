  details: |
    Addressed the 5 IMPORTANT findings from the automated PR review on #8811: (1) added a top-level references: block tagging PMID:20301579 with tags: [GeneReviews]; (2) added a diagnosis: section (Combined Clinical and Molecular Diagnostic Criteria citing GeneReviews PMID:20301579, Molecular Genetic Testing citing PMID:30461122, and Resting Electrocardiography with QTc Assessment citing the previously-cached-but-unused Balestra 2024 review DOI:10.3390/children11050582, verified by eye since DOI: is a skip_prefix); (3) extended two PMID:31941373 snippets through the literal substring '(10.5%' so the explanation's quantitative claim is fully backed by the quoted text, rather than softening the explanation; (4) added a clinical_trials: entry for NCT06534671 (Diltiazem in Jervell and Lange-Nielsen Syndrome, PHASE_IV/COMPLETED), explicitly noting the trial's genotype (KCNQ1 vs KCNE1) is unspecified so it is JLNS-wide, not confirmed JLNS2-specific, evidence; (5) added a Left Cardiac Sympathetic Denervation treatment citing PMID:42389506, reusing the snippet already quoted elsewhere in the file. Also applied several of the 6 SUGGESTIONS: swapped the generic NCIT:C15329 Surgical Procedure term on the catheter-ablation treatment for the specific NCIT:C170884 Cardiac Radiofrequency Ablation (found via a fresh OAK search; no more-specific term exists for cochlear implantation, so that one is unchanged); mined additional GeneReviews MANAGEMENT sub-items (beta-blocker dose reassessment cadence, periodic ICD interrogation, CPR training/AED availability) into existing treatment notes and evidence; added the verbatim GeneReviews 25%/50%/25% transmission-risk sentence to the inheritance evidence; and added one structured environmental: entry (Exertion, Emotional Stress, or Sudden Fright) bound to ECTO:6000031 exposure to strenuous exercise with influences_mechanisms pointing at the Arrhythmogenic Substrate and Ventricular Tachyarrhythmia node. Declined the seizure-like-episodes phe
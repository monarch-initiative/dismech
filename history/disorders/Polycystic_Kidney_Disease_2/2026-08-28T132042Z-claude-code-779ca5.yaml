  summary: 'Review round 1: PKD2 evidence corrections and completeness'
  details: |
    Worked the ai4c-reviewer changes-requested review on PR 9841. Blocking CI gate: check-snippet-length failed on two 4-word snippets; both now quote the full sentence. That gate was not run before the first push, which is the root cause. Evidence corrections the reviewer was right about: the 'Preclinical studies indicated that vasopressin V2-receptor antagonists' quote is from the TEMPO 3:4 background and reports animal work, so all three copies are regraded MODEL_ORGANISM from HUMAN_CLINICAL; the Decreased glomerular filtration rate phenotype was evidenced by an unrelated sentence about sex differences and now cites the 81.4 percent preserved-eGFR sentence, with frequency lowered from FREQUENT to OCCASIONAL because that sentence describes preserved rather than reduced function; the cAMP node now cites PMID:23736843, which measures the thing the node asserts, rather than resting on a downstream drug effect. Completeness additions: a diagnosis section built on PMID:18945943, whose finding that the older criteria performed suboptimally in PKD2 through reduced sensitivity is the most PKD2-specific diagnostic fact available; GeneReviews genetic-counselling 50 percent transmission risk, agents-to-avoid and surveillance schedule now cited; an ACE inhibitor and ARB treatment entry; clinical_trials for TEMPO 3:4 and REPRISE; urinary tract infection and nephrolithiasis phenotypes; a progression section including the 44 percent concomitant-nephropathy finding among early-ESRD patients; an animal_models entry for the Pkd2 conditional knockout and an experimental_models entry for patient-derived renal organoids, both with modeled_mechanisms links. The tolvaptan knowledge gap now carries the PKD2-specific datum that only 25 of 293 Genkyst patients met rapid-progression criteria. Two reviewer-suggested quotes could not be used verbatim: the Hateboer odds-ratio sentence is broken by the reference validator stripping bare bracketed spans such as 0.31-0.83, so the snippet stops before them and the values are given in the description, with the reason recorded in each explanation. Suggestions applied: three clipped clauses completed, cytoband corrected from 4q21 to 4q22.1, HP:0012330 Pyelonephritis dropped for cyst infection since it names a different clinical entity, leftover PARTIAL wording removed. Validated with just validate at 63/63 snippets verified, plus check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-entity-refs and check-duplicate-keys all clean.

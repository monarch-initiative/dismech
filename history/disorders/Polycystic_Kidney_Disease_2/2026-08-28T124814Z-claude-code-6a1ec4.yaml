  summary: 'Create: Polycystic Kidney Disease 2 / PKD2'
  details: |
    De novo curation of PKD2-related ADPKD, MONDO:0013131, as a distinct kb/disorders entry. The parent entry kb/disorders/Autosomal_Dominant_Polycystic_Kidney_Disease.yaml is bound to MONDO:0004691 and carries no has_subtypes block, so PKD2 was not previously covered anywhere in the KB. Deep research: one openscientist report, research/Polycystic_Kidney_Disease_2-deep-research-openscientist.md, 47 citations. That report shipped with NO reference_validation block despite the run passing --validate-references; validation was retro-fitted with just validate-research-reference and returned 47/47 resolved, 1/1 quotes valid, 46/47 on topic. just preflight-dr against MONDO:0013131 returned WARN for rival gene PKD1 at 41 percent of PKD2 mentions; assessed as a false positive, since PKD2 is defined clinically by contrast with PKD1 and that comparison is the point of the entry. Pathograph conforms to the renal_cystogenesis module at four nodes and adds a somatic second-hit node sourced to the two-hit review. Evidence discipline: PKD2-specific cohort numbers were used in preference to ADPKD-wide figures wherever they exist; the two claims that could only be sourced ADPKD-wide, intracranial aneurysm frequency and tolvaptan efficacy, are graded PARTIAL with the reason stated in each explanation. Validated with just validate at 38/38 snippets verified, just check-entity-refs, just check-duplicate-keys.

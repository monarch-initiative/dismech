  details: |
    Split the pathophysiology node 'Progressive cyst expansion and nephron loss' into 'Progressive cyst expansion and kidney enlargement' and 'Nephron loss and progressive kidney function decline', each with one conforms_to target in renal_cystogenesis; the one incoming edge was retargeted and no other reference to the old name existed in kb/. Added causal edges into the phenotype layer: expansion to Renal cysts and to Flank pain, nephron loss to Decreased glomerular filtration rate, and a sequela from Decreased glomerular filtration rate to Stage 5 chronic kidney disease, each with snippet evidence (PMID:28356211, PMID:40126492, PMID:26877954). Phenotype connectivity for the entry went from 0/11 to 4/11; the remaining phenotypes have no mechanism stated in the entry's sources. Fixed the Decreased glomerular filtration rate explanation that described the at-diagnosis figure as the basis of the FREQUENT grade, and added the age-stratified eGFR snippet that the description relies on. Split Kidney replacement therapy into Dialysis (NCIT:C15221, DEVICE) and Kidney transplantation (NCIT:C15265, SURGERY), each with a BYPASSES link to the nephron-loss node. Recorded in notes why LVH and cardiac valvular abnormalities are not curated (ADPKD-wide sources only). Replaced explanations that named the retired supports value PARTIAL with directness INDIRECT where the text describes an inference step.

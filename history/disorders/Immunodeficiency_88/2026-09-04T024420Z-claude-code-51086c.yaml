  summary: Add type-2 biologic treatments (anti-IL-5/IL-5Ra, dupilumab, omalizumab)
    for the Th2 arm
  details: |
    Added three mechanism-based, class-level treatments to close the type-2 arm's treatment gap flagged in #10746: Anti-IL-5/IL-5Ra Biologic Therapy (mepolizumab + benralizumab), Dupilumab (Anti-IL-4Ra) Therapy, and Omalizumab (Anti-IgE) Therapy, all wired via target_mechanisms to the existing 'Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells' pathophysiology node (not the population-level Asthma phenotype, per the issue's guidance). Fetched five new PMID references (41357247, 37727514, 38761995, 35273610, 40662429); only three (41357247, 37727514, 38761995) yielded usable exact-quote evidence. NCIT P302 edge rebuild found an Accepted_Therapeutic_Use_For row only for benralizumab (NCIT:C88594, already cached); mepolizumab/dupilumab/omalizumab returned no edge, so those rely on literature evidence only. Every treatment description and notes block states plainly this is a mechanism-based indication extrapolated from other genotypes (chiefly STAT3 loss-of-function and a genotype-diverse IEI cohort), not an observed response in a TBX21-deficient patient, and never cites PMID:34160550 or the STAT3-section biologic-panel sentence as if it were T-bet-specific evidence. Added a new KNOWLEDGE_GAP discussion (tbx21_type2_biologics_untested) attached to the Th2 node and all three new treatments recording that no type-2 biologic has been reported in this genotype, alongside the existing tbx21_ifng_therapy_untested gap for the other arm. Did not touch the IFN-gamma arm or issue #10688 (closed, unrelated claim).

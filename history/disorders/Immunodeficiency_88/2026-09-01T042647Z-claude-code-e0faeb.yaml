  summary: 'Create: Immunodeficiency 88 (TBX21/T-bet deficiency MSMD)'
  details: |
    New Disease entry for MONDO:0030483, the TBX21 (T-bet) etiology of Mendelian susceptibility to mycobacterial disease. Deep research: falcon was requested but is not configured in this environment; the run used the documented --fallback flag and was served by claude_code, recorded in the report frontmatter as fell_back: true with requested_provider: falcon (research/Immunodeficiency_88-deep-research-claude_code.md). The report had no reference- or term-validation sections on generation, so both were retro-fitted with just validate-research-reference and just validate-research-terms: 22/22 references resolved with 0 unresolved and 0 off topic; 107 terms checked with 0 unresolved and 2 mislabelled (UBERON:0002439 and UBERON:0003950, both in the report's anatomy section, neither used here). The report attributed a verbatim quote to PMID:35909394; on checking, PMID:35909394 is a near-verbatim Qatar Med J republication of the PMID:34160550 JEM abstract and the sentence appears in both, so the attribution was defensible. The primary JEM paper is cited here. Pathograph is a three-arm chain from one root node (TBX21 loss of function): a type-1 arm through failed NK/iNKT/MAIT/Vdelta2 lineage development to IFN-gamma deficiency, failed macrophage activation and uncontrolled mycobacterial replication, including an explicit node for the failure of the spared purely adaptive CD8+/TH1-star compartment to compensate; a type-2 arm through loss of T-bet repression of the Th2 program to CD4+ Th2 cytokine excess, eosinophilia and upper airway inflammation; and a B-cell arm through loss of the CD11c-high CD21-low subset to IgG1/IgG4/IgE-skewed, IgG2-reduced class switching. Sources are the three papers on the single index patient (PMID:33296702 Cell 2020, PMID:34160550 JEM 2021, PMID:35867801 Sci Immunol 2022) plus MSMD class-level literature (PMID:38341181, PMID:38025345, PMID:36630059, PMID:30264912) and PMID:11786643 for the Tbx21-null mouse. One animal model is linked with PARTIALLY_RECAPITULATES and a stated fidelity limitation: the mouse phenotype is lower-airway asthma against the patient's upper airway inflammation, and the mouse is a null allele where the patient's variant abolishes DNA binding without abolishing protein expression. One dataset, geo:GSE174804, was triaged manually out of a TBX21 gene-only search that otherwise returned unrelated mouse and cancer datasets; it is the scRNA-seq from the companion study of this patient and verifies with just verify-datasets. Two KNOWLEDGE_GAP discussions record what the single-patient evidence cannot separate. Claims borrowed from the MSMD population rather than from TBX21-deficient patients are marked as such in their explanations; recombinant IFN-gamma is recorded as a class-level mechanistic indication and explicitly not as an administered treatment. Validation: just validate passes with 55/55 snippets verified; just validate-terms passes; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-enum-values all pass. check-snippet-grading caught one real defect during drafting: a single quoted sentence in PMID:34160550 mixing an in vitro result with a plasma measurement was graded IN_VITRO in one block and HUMAN_CLINICAL in another; it was split into two evidence items each quoting its own clause. Compliance 89.3 percent. Acting on the automated second opinion on issue #10343: the macrophage-activation node now declares conforms_to granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation, matching Immunodeficiency_69; a HUMAN_MODEL_MISMATCH discussion records the documented mouse-versus-human disagreement in the B cell compartment (Tbx21-null mice have impaired humoral immunity, the patient does not), with both sides quoted; and Immunodeficiency 88 was added as a member of kb/groupings/Intrinsic_and_Innate_Immunity_Defect_IEIs.yaml, whose NECESSARY membership criterion it satisfies per just check-groupings. The same comment noted that Immunodeficiency 69 also satisfies that criterion and is not listed; that omission predates this work and is left for a separate pull request. The comment also suggested splitting the depleted lymphocyte compartments into one pathophysiology node each; they are kept as one node carrying five CL bindings, because the source treats the developmental failure as a single event and five nodes would carry identical evidence. A pre-PR adversarial self-review then found five blocking defects, all fixed before opening: (1) HP:0011274 Recurrent mycobacterial infections was curated although the only patient explicitly lacks recurrence - replaced with a class-level susceptibility phenotype plus a REFUTE evidence item quoting the remission sentence from PMID:35867801, and HP:0011274 is now deliberately not bound; (2) the MSMD-wide prevalence record carried rate_per_100000 and prevalence_class, machine-queryable slots that would have asserted a 1-in-10,000 population rate for a one-patient disease regardless of the prose disclaimer - both slots removed, and the competing 1-in-50,000 estimate from PMID:36326697 added alongside rather than reconciled; (3) a treatment duration, a vaccination-schedule attribution and a pyrazinamide-resistance claim had been promoted to entry fact from an explicitly uncited inference section of the deep-research report - all removed, and the quotable remission sentence cited instead; (4) the antimycobacterial treatment had no evidence that it is a treatment at all, only a mortality statistic - the in-addition-to-antibiotics sentence from PMID:36630059 added; (5) two misidentified reference-cache files fetched in error by the research run (PMID:11934957 on musculoskeletal sonography, PMID:15308104 on IL-22) and four DOI-alias duplicates of papers already cached by PMID were deleted rather than committed. The same review also drove: rebinding iNKT from CL:0000814 to the specific CL:0000921 type I NK T cell; connecting four orphaned immunologic phenotypes to the lineage-failure node; adding allele_type INDEL and the exon-1 localisation from PMID:36630059; unbinding HP:0002257 Chronic rhinitis from the upper-airway phenotype, since that term is defined on nasal mucosa and the source says only upper airway inflammation - left as free text with the search recorded; hedging the animal-model limitation, which had asserted an anatomical species divergence that is actually an absence of published human data; correcting a genetic.features gloss that said protein expression was not abolished where the cited source reports it diminished; adding a diagnosis block (whole-blood IL-12/IFN-gamma activation test, WES with Sanger confirmation, NBT/DHR exclusion of chronic granulomatous disease); adding two further Tbx21-null mouse models supplying model support for the two central type-1 nodes (PMID:11786644 for the CD4/NK-versus-CD8 asymmetry, PMID:15084276 for the stem-cell-intrinsic NK/NKT developmental defect); adding a non-typhoidal salmonellosis phenotype so the MSMD-class inclusion rule is applied consistently with lymphadenopathy; and a notes caution that PMID:36630059 and PMID:41209815 almost certainly report the same individual and must not be counted as two cases. Repairing the phenotype rename in item (1) dangled a bare-name pathograph edge, which check-causal-targets caught and which was fixed before commit. Final state: just validate-disorders passes with 68/68 snippets verified and every offline gate green; compliance 86.0 percent, the fall from 91 percent reflecting a larger denominator after the added sections rather than lost evidence. Review round on PR #10345 (ai4c-reviewer, CHANGES_REQUESTED, two IMPORTANT items, no CRITICAL): (a) a supports: REFUTE evidence item was attached to a phenotype whose claim is class-level susceptibility, not recurrence, so the REFUTE contradicted something the phenotype never asserted - changed to NO_EVIDENCE per the CLAUDE.md rule for a quote that is true and worth citing but not about this claim, with the explanation kept and a pointer to progression, where the same sentence is cited as evidence of course; (b) the chromatin-accessibility step through which T-bet governs CD11c-high CD21-low differentiation was absent, so the graph jumped from lesion to cellular outcome - added a MOLECULAR node bound to GO:0006338 chromatin remodeling with modifier DECREASED, carrying the mechanism sentence and the quantified 89-percent-of-2478 loci result from PMID:35867801, and rerouted the root node's B cell branch through it. Three reviewer suggestions were also taken: the bundled 'Susceptibility to environmental mycobacteria and severe tuberculosis' phenotype was split into two atomic phenotypes now bound to HP:5210115 Non-tuberculous mycobacterial infection and HP:5210111 Tuberculosis infection, and salmonellosis bound to HP:5210093 Unusual Salmonella infection - all three are IEI-context HPO terms whose definitions were read before binding, and HP:5210111's definition names MSMD explicitly; the cached-but-uncited PMID:16177104 became a fourth Tbx21-null mouse model supplying the only model evidence for the organism-level containment-failure node; and an extended innate and innate-like lymphocyte immunophenotyping entry was added to diagnosis. Two reviewer suggestions were declined with reasons: HP:0002099 Asthma and HP:0003593 Infantile onset are reported in the deep-research summary as HPO annotations of OMIM:619630 but neither word appears in any cached abstract, so neither is quotable and both are left out. Splitting the phenotype dangled a bare-name pathograph edge again, caught by check-causal-targets and fixed. Final state: just validate-disorders passes with 74/74 snippets verified, every offline gate green, compliance 86.3 percent. Second review round on PR #10345 (one IMPORTANT item): the entry imported lymphadenopathy at 45.5 percent from the PMID:38341181 MSMD cohort table as syndromic context but omitted fever at 30.2 percent and organomegaly at 24.8 percent from the same table, which is a selective rather than a scoped omission - both added with the same MSMD-wide framing, bound to HP:0001945 and HP:0001433. Asthma was also added, bound to HP:0002099 and sourced to an MSMD-population figure of 13 percent in PMID:41209815 rather than to the index patient; this sidesteps the upper-versus-lower-airway question the single patient cannot settle, and gives the Th2 de-repression branch an HPO-bound distal terminus it previously lacked. The reviewer also found that the root-node edge into the new chromatin node was supported by a snippet about the B-cell developmental requirement rather than about chromatin accessibility - the quote was swapped for the accessibility sentence. Reusing that sentence on two edges then tripped check-snippet-grading, because the copied item kept the HUMAN_CLINICAL grading of the item it replaced while the chromatin node graded the same sentence IN_VITRO; IN_VITRO is correct for an accessibility assay and both now carry it. This is the second time check-snippet-grading caught a real defect on this branch and the third time a gate did. Also: stale grouping prose saying 'both members' updated to reflect three; and CL:0000814 mature NK T cell, which this branch added before the iNKT binding was moved to the more specific CL:0000921, was removed from cache/cl/terms.csv and the celltypeterm enum cache since nothing in kb/ uses it - just validate-terms and just check-term-cache-integrity both re-run clean afterwards, and check-cache-order reports canonical order. Final state: 77/77 snippets verified, every offline gate green.

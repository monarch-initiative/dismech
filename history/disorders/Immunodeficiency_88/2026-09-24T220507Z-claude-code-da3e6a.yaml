  summary: Correct false ECTO-gap claim in BCG vaccination exposure note
  details: |
    The environmental entry's notes claimed ECTO has no vaccination, vaccine, BCG or Mycobacterium exposure class at all, citing the same search recorded for Immunodeficiency_69. Re-running the OAK searches shows ECTO does carry a generic vaccination class (ECTO:2000129) and several species-level Mycobacterium exposure classes, but none specific to BCG or Mycobacterium bovis. In review it turned out the generic vaccination term is bindable: ECTO:2000129 is in cache/ecto/terms.csv and the ExposureTerm enum cache on main, the sibling ISG15 MSMD entry already binds it, and just validate-terms passes here. So the exposure_term now binds ECTO:2000129 exposure to vaccination, with the BCG vaccine identity carried in preferred_term, and the note records the ECTO searches that justify the broader binding (l~BCG, l~Calmette and l~bacille return nothing; l~mycobacter returns only M. tuberculosis and M. avium pathogen classes and antimycobacterial-drug exposures).

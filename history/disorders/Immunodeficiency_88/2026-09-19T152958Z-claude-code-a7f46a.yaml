  summary: 'Review round 3: omalizumab IgE predicate and review quote_role'
  details: |
    Third review round on PR #10863. Re-typed the omalizumab target_mechanisms link to 'Increased circulating IgE concentration' from INHIBITS to MODULATES: the node is a total-plasma-IgE phenotype (HP:0003212), and omalizumab lowers free IgE by over 95% while raising total circulating IgE severalfold because the drug-IgE complexes clear slowly, so INHIBITS asserted the opposite of the effect on the quantity the node names. Extended the link description with the free-versus-total split and the consequence that total IgE cannot be read as a measure of response. Added quote_role: REVIEW_SYNTHESIS to the six evidence items carrying the four quotes taken from the two review articles (PMID:37727514, PMID:38761995, both publication_types Journal Article/Review); evidence_source stays HUMAN_CLINICAL, which grades the evidence each sentence describes. Kept the duplicated omalizumab class-level quote on both the link and the treatment: its treatment-level explanation already records why it is repeated, and dropping the link-level copy would leave the mechanism link unevidenced. Validation: just validate clean with 88/88 snippets verified, plus check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values and check-qualifier-terms.

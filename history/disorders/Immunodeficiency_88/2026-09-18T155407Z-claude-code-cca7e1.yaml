  summary: Add three type-2-targeting biologic treatments (mepolizumab, dupilumab,
    omalizumab)
  details: |
    Added mepolizumab, dupilumab, and omalizumab as mechanism-based, class-level treatment candidates for the type-2 (Th2/eosinophilic) arm of TBX21 deficiency, which previously had zero treatment content despite being fully modelled in pathophysiology and phenotypes (issue #10746). Each treatment is wired via target_mechanisms: mepolizumab and dupilumab to 'Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells' (the node producing the measured IL-5/IL-13 excess), and omalizumab to the 'Increased circulating IgE concentration' phenotype (the class-switch product, a more precise target than the cytokine-production node). All evidence is drawn from newly fetched general-population pivotal trials (PMID:25199059 MENSA for mepolizumab in severe eosinophilic asthma, PMID:29782217 QUEST for dupilumab in uncontrolled asthma, PMID:15679715 INNOVATE for omalizumab in severe allergic asthma) rather than from TBX21-deficient-patient literature, per the issue's explicit warning that no biologic has ever been given to a TBX21-deficient patient and that at least one deep-research citation (PMID:34160550) had been misattributed as a treatment source when it only establishes the cytokine elevation. Each treatment's notes and a new discussions entry (tbx21_type2_biologics_untested, KNOWLEDGE_GAP) state plainly that these are mechanism-based extrapolations, not administered treatments, mirroring the existing Recombinant Interferon Gamma treatment's documentation pattern. One candidate PMID surfaced during research (16236135, believed to be the omalizumab INNOVATE trial) turned out on fetch to be an unrelated epithelial-biology paper and was discarded before use; the correct INNOVATE PMID (15679715) was found and verified separately. Validated with just validate-disorders, just count-verified-snippets (85/85), just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-enum-values, and the relevant tests/test_data.py cases, all passing.

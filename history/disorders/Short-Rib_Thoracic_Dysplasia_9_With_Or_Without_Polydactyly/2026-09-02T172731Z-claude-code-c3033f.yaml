  summary: 'Create: Short-Rib Thoracic Dysplasia 9 With or Without Polydactyly'
  details: |
    Created the entry for the IFT140 skeletal ciliopathy (Mainzer-Saldino / conorenal syndrome). Deep research was run with falcon; the report resolved 11/11 references but cited only DOIs, so each was converted to a PMID and cited as a PMID. Primary sources are Perrault et al. 2012 (PMID:22503633), which established IFT140 as the Mainzer-Saldino gene and showed altered ciliary abundance and anterograde IFT localisation in patient fibroblasts; Schmidts et al. 2013 (PMID:23418020), the JATD/MSS cohort giving mild chest narrowing, universal end-stage renal failure under 13 years and retinal dystrophy; the Cauli Ift140 ENU mouse (PMID:24009529), curated as an animal_models entry with modeled_mechanisms linked to the Hedgehog node; and Senum et al. 2022 (PMID:34890546) for the biallelic-versus-monoallelic boundary. No GeneReviews chapter exists for this entity (PubMed searches for short-rib thoracic dysplasia GeneReviews and IFT140 GeneReviews returned no matching chapter), so no GeneReviews baseline was applied. Two curation judgements: the Hedgehog node is not curated as the exclusive downstream route because the mouse paper itself says other signalling systems are likely involved, and the animal model's limitations field records that homozygous lethality with neural tube and cardiac defects means it cannot report on the postnatal renal and retinal course. An INTERPRETATION discussion records the scope boundary against the monoallelic IFT140 ADPKD phenotype, which shares the gene but is a different disease. Validated with just validate (20/20 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms.

  summary: 'Review round 1 fixes: Spondylometaphyseal Dysplasia, Schmidt Type'
  details: |
    Removed the patient nationality for the 2023 case (PMID:38162154) from prevalence notes and top-level notes; the cached abstract states no nationality for that patient, so it is now described as a fourth sporadic case reported in 2023. Added an eighth top-level note recording why cervical-spine surveillance is not a treatment record: recommendation 14 of the type II collagen best-practice guideline (PMID:30696995) restricts routine cervical imaging to SEDC and Kniest dysplasia, and the one patient in PMID:23653587 whose cervical spine was assessed had no C1/C2 instability. Merged origin/main into the branch; the only conflict was the HP:0000185 row in cache/hp/terms.csv, present on both sides with the same label, resolved to main's row.

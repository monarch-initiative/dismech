  summary: 'Create: Spondylometaphyseal Dysplasia, Schmidt Type (MONDO:0008478, COL2A1)'
  details: |
    New standalone entry for MONDO:0008478, resolved through its cross-references to OMIM 184253 and ORPHA 93316. The gene is COL2A1, confirmed by the stub's MONDO genes block and independently by the two molecularly solved case reports (PMID:23653587 Gly861Val, PMID:38162154 Gly1092Asp). Decided DISEASE rather than SUBTYPE or GROUPING: MONDO, OMIM and Orphanet all keep the concept distinct, dismech curates five other spondylometaphyseal dysplasias by eponym, and the closest COL2A1 precedent is Multiple_Epiphyseal_Dysplasia_Beighton_Type curated standalone in #10987. The strongest counter-argument, the 2013 paper's conclusion that this entity should be lumped with spondyloepimetaphyseal dysplasia Strudwick type, is recorded in notes rather than acted on, and the nosologically load-bearing observation behind it (proximal femoral epiphyseal ossification that improved with age) is curated as its own phenotype. Seven pathophysiology nodes, sixteen phenotypes, all wired except Cleft Soft Palate which is deliberately unwired with its reason in its own notes. No frequency bands anywhere: the literature is one Algerian family of five plus three sporadic cases. All treatment and surveillance records are class-level from the type II collagen disorders best-practice guideline PMID:30696995 and are graded evidence_source OTHER with directness INDIRECT. Deep research: the first falcon run used a disambiguated disease_name inlining OMIM 184253, ORPHA 93316, COL2A1 and explicit exclusions for Schmidt syndrome and the TRPV4-related Kozlowski type; it returned the right disease. Validated with just validate, validate-terms, count-verified-snippets 43/43, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, validate-disorders and the whole-KB snippet checks.

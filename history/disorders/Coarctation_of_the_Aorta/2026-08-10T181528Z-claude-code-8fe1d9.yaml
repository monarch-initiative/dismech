  summary: Substantiate the model-mechanism links; correct a prior test claim
  details: |
    Fixed a CI-blocking failure of test_failure_to_recapitulate_links_are_substantiated. The FAILS_TO_RECAPITULATE link on the diffuse arteriopathy node carried limitations but no evidence, and that link type requires evidence rather than merely recommending it because it makes a substantive negative claim. Attached evidence to all three modeled_mechanisms links rather than only the failing one, so each link is self-describing: SUPPORT on the renin link quoting the renal-hypoperfusion to renin-angiotensin sequence, PARTIAL on the fixed-obstruction link since the pressure distribution matches while the lesion does not, and NO_EVIDENCE on the negative link. NO_EVIDENCE rather than REFUTE is deliberate: the paper does not test for a developmental arteriopathy at all, and absence of a finding in a study that never looked is not a refutation. Also correcting the record: the history entry for commit 9208374d claimed 6161 foreign-key and animal-model tests passing, but the pytest -k selector used did not match test_failure_to_recapitulate_links_are_substantiated, so that claim described the failing test as covered when it was not. The count was accurate; the characterisation was not. Verified this round with the CI-equivalent batched recipe (schema OK, terms OK, 64/64 snippets), both lints clean, and a pytest selection that explicitly includes the previously-failing test (6142 passed).

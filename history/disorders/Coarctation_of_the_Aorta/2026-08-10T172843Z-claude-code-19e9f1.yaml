  summary: 'Wire rat model into the pathograph after schema #8199'
  details: |
    Merged current main, which landed schema PR 8199 making name required on AnimalModel and adding the modeled_mechanisms pathograph link that the approving review noted was missing. Added the required name and publication fields and three modeled_mechanisms links: RECAPITULATES on the renin node with HIGH fidelity, PARTIALLY_RECAPITULATES on the fixed obstruction with limitations recording that the band is surgical and abdominal rather than juxtaductal, and FAILS_TO_RECAPITULATE on the diffuse arteriopathy node with LOW fidelity. The negative link is deliberate: an acutely banded normal aorta has no developmental arteriopathy, so the model cannot address this entry's central claim, and recording that in the graph prevents the model being read as validating more than it does. Validated with the CI-equivalent batched recipe: schema OK, terms OK, 61/61 snippets verified, and 6161 foreign-key and animal-model tests passing.

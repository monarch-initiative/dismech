  details: |
    Addressed all five blocking findings from the automated review. Added a diagnosis block (four-limb blood pressure gradient, transthoracic echocardiography, CT angiography), a structured prevalence record (3.62 per 10,000 live births from a population-based registry, BIRTH_PREVALENCE, BAND_1_5_PER_10000), and an inheritance block typed as polygenic, anchored on the left-sided obstructive lesion review reporting high sibling recurrence with only 10 to 20 percent of patients explained by accepted genes. Fixed the Collateral Arterial Development orphan node by giving it an inbound edge from the fixed obstruction, three evidence items, and an outbound edge to persistent hypertension via delayed diagnosis. Added a rat suprarenal aortic banding animal model attached to the renin node, with its limits stated explicitly. DECLINED the suggested Notch1 haploinsufficient mouse: that paper is about ascending aortic aneurysm and contains no mention of coarctation, so citing it as a coarctation model would be a misattribution. Also removed an unevidenced OCCASIONAL frequency band from the cerebral berry aneurysm phenotype per the project frequency-evidence guidance. Validated: schema OK, terms OK, snippet-length and folded-hyphen lints clean, 58/58 snippets verified against cached references.

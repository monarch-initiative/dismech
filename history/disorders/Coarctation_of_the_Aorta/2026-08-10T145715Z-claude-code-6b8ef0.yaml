  summary: 'Create: Coarctation of the Aorta'
  details: |
    New Disease entry for coarctation of the aorta, organised so that the post-repair arm is not a complication of treatment but the natural history that treatment fails to interrupt. Twelve pathophysiology nodes run from two competing morphogenetic triggers through the fixed gradient, renin-angiotensin activation, collateral development, ductal-dependent neonatal physiology, and ventricular hypertrophy to the diffuse arteriopathy, persistent post-repair hypertension, and accelerated atherosclerosis. Two mechanistic_hypotheses with edge-level opt-in: ductal_tissue_migration (CANONICAL) and reduced_fetal_flow (ALTERNATIVE), both anchored on the 1982 angiographic study that proposes them together as a two-component account. Three discussions: the morphogenesis CONTROVERSY, a KNOWLEDGE_GAP on whether the arteriopathy is intrinsic or acquired, and a CURATION_TODO recording why atherogenesis module conformance was NOT declared despite being mechanistically plausible - the available source is a prevalence review, and declaring conformance would assert mechanism from epidemiology. Validated: just validate (schema OK), just validate-terms (OK), and reference validation with 48/48 snippets verified against cached references.

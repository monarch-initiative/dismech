  summary: Correct an overstated explanation on the familial-recurrence evidence
  details: |
    The reviewer identified that the 9 percent figure quoted from PMID:33432820 measures the prevalence of any congenital heart defect among first-degree relatives of a coarctation proband, not recurrence of coarctation itself, and that my explanation calling it a coarctation-specific familial recurrence figure read stronger than the source supports. Widened the snippet to include the leading clause so the measured outcome is visible in the quotation rather than inferable only from the surrounding text, and rewrote the explanation to state the distinction plainly and note why it matters: a familial excess of heterogeneous left-sided lesions is what a shared developmental program predicts, and is weaker support for a coarctation-specific recurrence risk than the bare number suggests. Validated with the CI-equivalent batched recipe: schema OK, terms OK, lints clean, 61/61 snippets verified.

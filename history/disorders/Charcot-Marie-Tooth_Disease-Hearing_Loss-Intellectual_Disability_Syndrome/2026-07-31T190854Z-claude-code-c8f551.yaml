  summary: 'Create: CMT-hearing loss-intellectual disability syndrome (HMSN-ADM, OMIM
    214370)'
  details: |
    De-novo curation of MONDO:0008960 / OMIM:214370 (HMSN with deafness, intellectual disability, and absence of large myelinated fibers; HMSN-ADM), a rare presumed-autosomal-recessive demyelinating/neuronopathic HMSN, distinct from the separately-curated CMTX4/Cowchock (MONDO:0010689/AIFM1). Built entirely from verified primary literature: Mancardi 1992 PMID:1506851 (original description), Sabatelli 1998 PMID:9475604 (confirmation of entity + AR inheritance), Santoro 1998 PMID:9591228 (second family), Muller 2000 PMID:11442171 (autopsy: absence of large neurons in DRG and anterior horns; SMN1 and PMP22 excluded). Causal gene remains unidentified; captured as a KNOWLEDGE_GAP discussion. Deep-research provenance: Edison/falcon attempted first per user request but returned HTTP 402 Payment Required (no usable credits); OpenScientist fallback run completed but exhibited Named Entity Confusion (NEC) - it resolved the disease name to Cowchock/CMTX4 (OMIM 310490, AIFM1, X-linked) instead of OMIM 214370, producing a coherent but wrong-disease report. Per the CLAUDE.md NEC protocol the OpenScientist report was discarded entirely (not cherry-picked) and its output files were not committed; the entry was rebuilt/kept from primary literature anchored on the verified OMIM 214370 identity. Validation: schema+terms pass, 13/13 evidence snippets verified.

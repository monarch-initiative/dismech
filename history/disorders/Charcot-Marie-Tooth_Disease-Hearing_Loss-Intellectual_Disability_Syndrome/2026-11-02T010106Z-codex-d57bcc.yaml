  summary: Review HMSN-ADM evidence, phenotype estimates, and causal limits
  details: |
    Reviewed all sections against the three primary clinical abstracts (PMID:1506851, 9475604, 11442171), the disease-specific ORPHA:90103 record, and the full cached GeneReviews NBK1358 management chapter. Forced refetches did not recover primary full text; PMID:9591228 has no retrievable abstract or full text and remains bibliography-only. The earlier off-entity AIFM1 research report was not reused; no matching retained research artifact exists. Preserved MONDO:0008960 / OMIM:214370 identity and presumed recessive inheritance. Limited anatomical claims to the single autopsy, removed a peripheral-to-dentate causal edge and unproven GO development assertions, refined dorsal-root-ganglion cell binding, and retained the developmental hypothesis as unproven. Removed unsupported seizure and broad weakness/hearing frequencies; replaced obligate neuropathy/large-fiber claims with explicitly sourced Orphanet estimates. Added 11 disease-specific phenotype annotations and separate electrophysiology support. Corrected report age versus onset, negative gene-test scope, and biopsy diagnostic wording. Added evidence and explicit indirect applicability to supportive care, hearing assessment and counseling. No molecular cause, disease-specific treatment efficacy, founder claim, or CNS mechanism was inferred from absent evidence. All original abstract findings survived cache regeneration; source metadata and empty-content classification were corrected by the sanctioned fetcher.

  summary: Type OPN1LW gene record origin
  details: |
    Added variant_origin GERMLINE to the OPN1LW genetic record (the Xq28 array rearrangements arise in maternal meiosis and are constitutional in affected males); relationship_type CAUSATIVE was already set and ClinGen holds no record for this pair. The mechanism node Absence of an Expressed L-Class Opsin Gene already carries OPN1LW and GO:0008020 G protein-coupled photoreceptor activity, matching the reviewed OPN1LW core function; its ABNORMAL modifier was kept because 5'L-3'M hybrid products retain photoreceptor activity of the M spectral class, so the activity is altered rather than simply lost. Validated with just validate, validate-terms, count-verified-snippets (65/65), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments, check-enum-values and list-gene-term-mismatches.

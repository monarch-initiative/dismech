  summary: 'Create: Protan Color Vision Deficiency'
  details: |
    New entry for MONDO:0010565 (red color blindness; OMIM:303900 protan series) with OPN1LW as the causal gene, X-linked recessive (HP:0001419). Lump/split: protanopia and protanomaly are has_subtypes rows (OLS searches of MONDO and ORDO found no separate disease terms; HPO phenotype terms HP:0011522 and HP:0200018 are bound on the phenotypes). Deutan (MONDO:0010564) and tritan (MONDO:0008610) defects keep their own stubs; blue cone monochromacy has its own entry; OPN1LW exon 3 haplotype disease with high myopia (MONDO:0010446, Bornholm eye disease) is a differential diagnosis. Pathograph: unequal recombination in the Xq28 L/M array, absence of an expressed L-class opsin gene, L cones filled with M-class pigment, then loss of the L-versus-M opponent signal (to Protanopia, Protanomaly, Red-green dyschromatopsia) and reduced long-wavelength luminous sensitivity; all three phenotypes are causally connected. Prevalence from a 2025 meta-analysis, an Irish school survey and the Korean KNHANES survey. Treatments: colour-enhancing filter glasses (EnChroma and ChromaGen studies recorded as REFUTE, the VINO CAD result as SUPPORT), occupational and genetic counselling, and preclinical L-opsin gene addition in squirrel monkeys (also recorded as an animal model). Deep research: one OpenScientist report (19/19 references resolved; 1 quote flagged, a truncated prevalence quote from PMID:40769301 whose own text matches the abstract; term validation flagged CL:0000573 used for L cones). just preflight-dr returned WARN only because OPN1MW, the array partner gene, is mentioned; the report is about the protan defect. The report misstates the OPN1LW HGNC id as HGNC:4206 (that is OPN1MW; the entry binds hgnc:9936 from the HGNC REST lookup) and maps HP:0011519 (Anomalous trichromacy) to protanomaly; neither was used. Report citations used: 27622081, 9822760, 22472762, 40769301, 23322568, 41806157, 30443703, 10413401. Not used: 22349213 (vertebrate LWS spectral tuning, not human disease), 35103751 (protan share of cases only, no protan prevalence figure), 24702753, 33955536, 38396435 (not protan-specific), 29386880, 26603570 (mouse and promoter gene-therapy work not specific to protan defects), 12678637 (normal L:M ratio). Additional primary sources found by PubMed search include Nathans 1986 (3485310, 2937147), Merbs and Nathans 1992, Sharpe 1998, Deeb reviews, Neitz reviews (21167193, 34440353), cone-resolved optoretinography (33544131), reflectometry and ERG replacement studies, red-signal sensitivity and traffic-light studies, and the Mancuso 2009 squirrel monkey gene therapy. PMID:39354153 (EnChroma prospective study) was not used because its cache has no quotable text. No GeneReviews chapter exists. Validation: just validate, validate-terms, count-verified-snippets (65/65), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and validate-disorders all pass.

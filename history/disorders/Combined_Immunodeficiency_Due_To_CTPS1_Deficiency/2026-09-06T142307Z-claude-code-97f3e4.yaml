  summary: Restore a dropped source hedge and correct a false trim justification
  details: |-
    Found by auditing all five entries in this curation batch after a sibling PR's reviewer
    caught two fabricated snippet-trim justifications. This entry had a third, and it is the
    worst of the set because the trim also changed what the source claims.

    The T-independent B-cell snippet began mid-sentence at "patients and account for the low
    titers", justified in the explanation by saying the preceding clause ended in an
    abbreviation the snippet matcher would split on. That justification is false: the full
    sentence verifies exactly, tested by writing it out and running the validator (40/40,
    unchanged).

    The trim also dropped the source's hedge. The full sentence reads "This may directly
    participate to the susceptibility to encapsulated bacterial infections seen in
    CTPS1-deficient patients and account for the low titers of S. pneumoniae antibodies as it
    is a T-independent B-cell response." Starting at "patients and account for" turns a hedged
    proposal into a flat assertion. The round-1 reviewer flagged the dropped hedge as
    non-blocking and I left it, recording it as retrospective material; what I did not do was
    check whether the reason I had given for dropping it was true.

    Both are corrected here and the correction is recorded in the explanation rather than the
    text being quietly rewritten. This PR was approved before this push, and the approval is
    spent knowingly: an evidence item that presents a hedged claim as unhedged misrepresents
    the paper, and an explanation that states something false about the tooling is the same
    defect class this batch has spent the day correcting.

    Validated: just validate-disorders 40/40, just validate-terms,
    pytest tests/test_data.py -k CTPS1 (2 passed), and the offline gates: snippet length, title
    snippets, snippet grading, folded hyphens, enum values, duplicate keys, entity refs, causal
    targets, qualifier terms.

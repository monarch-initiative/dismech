  summary: 'Create: Combined Immunodeficiency Due to CTPS1 Deficiency'
  details: |
    De novo curation of CTPS1 deficiency, a combined immunodeficiency of nucleotide supply rather than of signalling. One openscientist deep-research run was performed (research/Combined_Immunodeficiency_Due_To_CTPS1_Deficiency-deep-research-openscientist.md; 18/18 references verified, confabulation_rate 0.0, 14 of 18 on topic, 39 of 42 terms verified). The report converged independently on the same key papers found by direct PubMed search, and supplied one lead the search had missed, PMID:29884857 (the HSCT series), which was verified before use. Two curation decisions are worth flagging for review. First, the entry records a CONTROVERSY: PMID:29884857 states the founder allele gives complete absence of protein and PMID:32161190 measured 10-20 percent residual protein with normal per-molecule catalytic activity. Both are curated, the second as SUPPORT and the first as REFUTE against the PARTIAL_LOSS_OF_FUNCTION assignment, so the disagreement stays visible rather than being silently resolved; the mouse embryonic lethality is the tiebreaker argument. Second, PMID:29884857 is an abstract-less Bone Marrow Transplantation letter whose cached body is an author accepted manuscript embedded in a RIS export, with manuscript line numbers bled inline into the text. Snippets were chosen to avoid the damaged spans and notes records this, because a snippet spanning one would pass exact-match validation while misquoting the published article. Three ontology bindings were caught wrong by the term validator before commit: HP:0011840 is Abnormal T cell physiology not Abnormal lymphocyte physiology, HP:0410385 is a memory CD8 term not an NK count term, and CL:0000940 needed its canonical label. Validated: schema, terms, 36/36 snippets, entity refs, causal targets, history.

  summary: 'Review round 1: bacterial arm modelled, pathograph connected'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review in one push. Finding 1: recurrent encapsulated bacterial infection existed only as a prose clause inside the herpesvirus phenotype description. It is now its own phenotype bound to HP:0002718 with OBLIGATE frequency, evidenced from PMID:24870241 and PMID:32161190. The reviewer also identified a mechanistic loss rather than only a phenotype one, and that was the more valuable half: the entry's pathograph ran entirely through failed T-cell expansion, which cannot explain a T-independent antibody response. Added an Impaired T-Independent B-Cell Response to Polysaccharide Antigen node hanging off the same central effector, evidenced with the paper's own statement that the low S. pneumoniae titres reflect a T-independent B-cell response, plus the normal-or-elevated total IgG observation that makes the node necessary. Finding 2: all five downstream edges pointed at other pathophysiology nodes, so the entry rendered as two disconnected components. Added five edges joining the mechanism chain to the phenotypes. On the duplicated EBV concept, I linked the pathophysiology node to the phenotype rather than collapsing the pair, because the flat node namespace would merge them into one node if either were renamed to match. Also added a notes paragraph recording the apparent tension the reviewer flagged between the founding paper's statement that no patient had extra-haematopoietic manifestations and the transplant series reporting chronic diarrhoea in five of eleven; the two most likely scope the phrase differently and neither paper reconciles them, so the entry records it rather than resolving it. The reviewer endorsed the null-versus-hypomorph CONTROVERSY call and its REFUTE grading, so that is unchanged. Validated: schema, terms, 40/40 snippets, entity refs, causal targets.

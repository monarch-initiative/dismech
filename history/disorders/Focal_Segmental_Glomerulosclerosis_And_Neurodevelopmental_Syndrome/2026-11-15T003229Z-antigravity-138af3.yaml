  summary: Bind GO molecular functions on gene-bearing pathophysiology nodes, connect
    remaining phenotypes, and add progression and differential diagnoses
  details: |
    Added GO molecular_functions to TRIM8 Mislocalization from Nuclear Bodies (GO:0061630 ubiquitin protein ligase activity) and Renal SOCS1 Accumulation (GO:0005126 cytokine receptor binding), and assigned explicit roles across all pathophysiology nodes. Connected remaining disconnected phenotypes (Diffuse Mesangial Sclerosis from Podocyte Injury; Hypotonia and Neurogenic Bladder from TRIM8 Mislocalization from Nuclear Bodies) for 11/11 phenotype connectivity. Added progression phases (infantile neurological onset and childhood proteinuria progressing to ESKD in 67-68% of cases; PMID:30244534, PMID:39416667, PMID:35903163) and differential_diagnoses for isolated focal segmental glomerulosclerosis (MONDO:0100313; PMID:39669799, PMID:33508234).

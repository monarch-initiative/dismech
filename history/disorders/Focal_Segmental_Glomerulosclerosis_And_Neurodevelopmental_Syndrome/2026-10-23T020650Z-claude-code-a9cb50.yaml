  summary: 'Create: Focal Segmental Glomerulosclerosis and Neurodevelopmental Syndrome
    (TRIM8)'
  details: |
    New entry for the TRIM8 neuro-renal syndrome (MONDO:0100111, claim issue #15279). Curated from the discovery cohort (PMID:33508234), the ClinGen Definitive AD assertion and its narrative, and nine case reports, plus the 2025 TRIM8 condensate preprint (PMID:40034645, cited as not peer reviewed), all cached via fetch-reference. A claude_code deep-research report was used as leads only. Pathograph: last-exon TRIM8 truncation (ubiquitin protein ligase activity, modifier ABNORMAL because loss vs gain of function is unresolved) to nuclear-body mislocalization to podocyte injury, FSGS and proteinuria; mislocalization to seizures, developmental delay and intellectual disability as indirect edges; renal SOCS1 accumulation recorded without an onward edge. A KNOWLEDGE_GAP discussion records the loss-vs-gain question. Validated with validate, validate-terms and count-verified-snippets (54/54) and validate-disorders. A standalone entry rather than a subtype row on Focal_Segmental_Glomerulosclerosis because the disease is syndromic and MONDO does not place it under the FSGS series.

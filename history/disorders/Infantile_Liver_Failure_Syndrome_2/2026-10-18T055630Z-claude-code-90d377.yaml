  summary: 'Create: Infantile Liver Failure Syndrome 2'
  details: |
    Created from the Perplexity sonar-deep-research report (run with --param reasoning_effort=low, because default-effort requests were dropped by the network after about 5 minutes) plus targeted PubMed lookups and reference fetches.

    Report validation: 14/14 references resolved, confabulation_rate 0.0, 1 off topic (PMC:PMC8296689 / PMID:34289807, "Disease ontologies for knowledge graphs" - a general ontology paper, not cited). Term validation 59/64 resolved, 1 obsolete (GO:0099022, not used), ORPHA/MGI unchecked. Labels were checked for only 5 terms, and several report CURIEs name different terms: HP:0004440 is Coronal craniosynostosis (report: Pelger-Huet anomaly; bound HP:0011447 instead), HP:0005403 is Decreased total T cell count (report: NK cells; bound HP:0012177 instead). The report's ORPHA:391677 maps to SOPH syndrome in MONDO, not ILFS2. The report's bracketed citation numbers do not match its .citations.md sidecar, so every PMID was looked up by PubMed esearch (DOI or title) rather than taken from the bracket numbers.

    preflight-dr: PASS (NBAS mentioned 76 times; top genes NBAS, RINT1, SCYL1). GeneReviews: check-genereviews --online reports NO_CHAPTER; PubMed esearch NBAS AND genereviews[book] also empty.

    Scope: bound to MONDO:0014659 (OMIM 616483). SOPH syndrome (MONDO:0013889, OMIM 614800) has its own MONDO term and an existing stub (stubs/Short_Stature-optic_atrophy-Pelger-Huet_Anomaly_Syndrome.yaml), so it is a differential, not a subtype. The beta-propeller combined phenotype has no MONDO term; its extrahepatic features are recorded as phenotypes without frequencies. No has_subtypes. No module conforms (er_protein_storage_disease models a storage gain-of-function cascade, not this lesion).

    Pathophysiology chain: biallelic NBAS variants -> reduced NBAS/p31 -> thermal instability of the syntaxin 18 complex and impaired Golgi-to-ER tethering -> ER stress -> ROS -> apoptosis -> hepatocytolysis -> ALF, transaminases, necrosis, loss of synthetic/detox function -> INR, ammonia, bilirubin, encephalopathy. The ER stress/ROS/apoptosis steps are fibroblast data (PMID:42358045); the step to hepatocytes rests on a review and is flagged in a KNOWLEDGE_GAP discussion. Anterograde secretion and ER-NMD nodes are HYPOTHETICAL.

    Frequencies are set only from ILFS2-subgroup figures in PMID:40433928 (ALF 44/48, HE 89.7%, hepatomegaly 20/22). Whole-cohort biopsy and IgG figures are quoted without frequency. Several cited cohorts overlap in patients (26541327, 31761904, 40433928 and case reports) and are noted as non-independent where they support the same claim.

    NCIT:C2575 Fat Emulsion was rejected by the ChemicalEntityTerm enum, so the lipid agent is unbound with a note. Fetched but not cited: PMID:20577004 (SOPH discovery), PMID:36843433 (Yakut SOPH), PMID:36594124 (Chinese three-patient transplant series; covered by the larger cohort), PMID:39429260 (HLH case with two VUS; not used for NK claims).

    Validation: just validate, validate-terms, count-verified-snippets (87/87), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-qualifier-terms, check-genereviews --online, and validate-disorders passed. Per-file phenotype connectivity is 9/19 (47%); the unconnected phenotypes (steatosis, fibrosis, lactate, and the extrahepatic features) have no sourced mechanistic edge in the cited literature, so none was invented.

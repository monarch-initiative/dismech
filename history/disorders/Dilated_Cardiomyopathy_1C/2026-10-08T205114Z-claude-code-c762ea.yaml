  details: |
    Full entry for dilated cardiomyopathy 1C (MONDO:0011094, LDB3), replacing the skeleton (claim issue #13733). The MONDO concept covers three allelic presentations, recorded as has_subtypes rows without separate terms: CMD1C (dilated, with or without noncompaction), LVNC3 and CMH24. Deep research: provider claude_code (falcon fallback); 31/31 references resolved. Key PMIDs: 14662268 (Vatta, 6 of 100 probands), 14660611 (Arimura, D626N, 1 family of 96), 16427346 (Xing, D626N, 4 members of 2 LVNC families), 17097056 (Theis, 6 LDB3 of 239 HCM), 19377068 and 14660611 (binding changes), 20852297 (S196L transgenic mouse), 11696561/19028670/21303826 (knockout mice), 36253531 (recessive CMD2L, differential only), 26419279 (D117N fails segregation), 33949037 (oligogenic case). Gene validity: ClinGen LDB3 AD Limited for MONDO:0011094 (CGGV assertion 7756e3c0, 2026-03-04), matching the committed ClinGen ingest table kb/genes/ingest/clingen_gene_validity.tsv (cache files built with just clingen-rebuild --csv-only; manifest not repinned); relationship_type left unset. ClinGen HCM Disputed and CMD2L AR Strong records also rebuilt and cited. The DR report said PMID:39113806 used human stem-cell cardiomyocytes; the cached text describes mice, and it is curated as mouse evidence. Walsh 2017 (PMID:27532257) has no LDB3-specific text and is not cited. Validation: just validate clean, 91/91 snippets verified, entity refs, causal targets, enum values, duplicate keys, gene validity all OK; 7/7 phenotypes connected.
    Review fixes (round 1): moved the ClinGen HCM Disputed REFUTE from the mechanism edge to the CMH24 subtype row; removed the D117N REFUTE from genetic#LDB3; rewrote the GeneReviews note (TAGGED / StatPearls NO_CHAPTER; the url: PDF is the chapter's full text); penetrance now cites the healthy T350I-carrier father (PMID:17394203); added the Arimura edge evidence and the GeneReviews systolic-dysfunction definition; swapped GO:0003300 for GO:0055007 with Lyu 2024 maturation evidence; D117N stated as an 11/210 allele frequency; onset wording softened; progression scoped to CMD1C; subtype term rationale added; Vatta evidence on LVNC3; Zhao ICD-storm context on the ICD treatment; the ARVC ClinGen Disputed record (8ebdc3e8, in the committed ingest TSV) cached and cited; ClinGen notes now cite the committed ingest table. 98/98 snippets verified after fixes.

  details: |
    Correction round on PR #9668 in response to review. All nine blocking findings addressed or answered.

    Finding 1 (reference_title) was already fixed before the review ran - commit 8043efe5a landed after the reviewed commit ca0a2fb08.

    Finding 9 first, because it determined the scope of everything else. The reviewer could not verify my claim that no GeneReviews chapter exists for SRTD6 and asked for a re-check. I ran four PubMed E-utilities searches: GeneReviews[Book] with "short rib", with NEK1, with thoracic dysplasia/Jeune/chondrodysplasia/ciliopathy in the title, and a free-text search for the exact chapter title the reviewer named. The only NEK1 hit in the GeneReviews book is the Amyotrophic Lateral Sclerosis Overview. There is an Ellis-van Creveld chapter and a Cranioectodermal Dysplasia chapter, but nothing for the SRTD group. The original claim stands and the searches are recorded here so the next reviewer does not have to repeat them.

    Finding 3 was correct and is resolved by removal rather than by citation. The Impaired Growth Plate Chondrogenesis node carried a smoothened signaling pathway descriptor with modifier: DECREASED. Reduced Hedgehog output downstream of ciliary failure is well established in the skeletal ciliopathies generally, but no reference cached for this entry measures or states it for NEK1, so it was an unevidenced annotation sitting among evidence-backed ones. The descriptor is gone, the inference stays in the description where it reads as reasoning, and a node-level note says what a source would need to report to restore it. That node is no longer thin: finding 4's paper now supplies the growth-plate histology it lacked.

    Finding 4, PMID:24854045 is now cited twice in a new histopathology: section - the expanded and irregular femoral hypertrophic zone, and the cortico-medullary renal cysts with portal fibrosis. The growth-plate lesion is the direct tissue-level evidence for the chondrogenesis node, which previously rested only on a proposed genotype-severity correlation.

    Finding 2, the bundled node is split into Thoracic Constriction (TISSUE, bound to UBERON:0002224) and Pulmonary Hypoplasia (ORGANISM, bound to UBERON:0002048), with a DIRECT edge between them. Both now carry ontology grounding, which the bundled node had none of. The group-level SRP type I-IV definitional sentence is kept on the constriction node but its explanation now says explicitly that it supports the rib lesion and not the mechanical consequence. The mechanical claim is evidenced on the hypoplasia node from the Jeune literature, graded PARTIAL and labelled as a cross-disease citation.

    Finding 5, DYNC2H1 added to genetic: with relationship_type: COOPERATING and the reasoning recorded in notes. The choice is not obvious and is worth stating: DYNC2H1 has its own biallelic Majewski cases, which would make it causative for those patients, but this entry is keyed to MONDO:0009894, the NEK1-defined disorder. What earns it a place here is the digenic observation, which the disease-level inheritance block asserts and which the genetic section previously did not know about. While writing it I found that the digenic snippet belongs to PMID:21211617, not PMID:22499340 as I first copied it; the two papers report the same double-heterozygous family, and both are now cited with that stated.

    Finding 6, both kat2J MEF culture items regraded MODEL_ORGANISM to IN_VITRO. The adjacent whole-animal PKD claim keeps MODEL_ORGANISM.

    Finding 7, treatments: added with three entries and honest boundaries on each. Perinatal palliative care carries no evidence item at all, because no cached reference reports a palliative protocol for this disorder and a quote that does not say what the entry claims would be worse than none. Genetic counselling is load-bearing rather than routine here: recurrence risk is not simply 25% in every family given the proposed digenic mechanism, and a negative NEK1 result does not exclude the diagnosis. Thoracic expansion surgery is curated with an explicit boundary - it is a Jeune syndrome intervention in two patients, and no Majewski-type patient survives to be a candidate. It is included because the surgical target is the same pathograph node and a reader asking whether anything can be done for the chest should find the answer with its limits attached.

    Finding 8, the lump/split reconciliation is done in the sibling file. Short-Rib_Polydactyly_Syndrome.yaml's Type II (Majewski) row now carries subtype_term bound to MONDO:0009894 and a note pointing to this entry for the full curation. The note also records that the two concepts are not co-extensive: MONDO:0009894 is the NEK1-defined disorder, while type II as a clinical class also covers the DYNC2H1 cases and the cases where neither gene is found.

    Bugbot's tibia finding was correct. Absent Tibia was VERY_FREQUENT on the strength of "short ovoid tibiae or tibial agenesis" - a disjunction in which only the second limb is absence. Regraded FREQUENT, with a note saying the HP term covers part of what the source describes and that the short-ovoid form has no separate frequency figure in any cached reference.

    The ALS pleiotropy note was uncited prose and is now grounded in two of the three cached ALS papers, both graded NO_EVIDENCE because they say nothing about the skeletal disease. They are quoted to make the separation concrete: the ALS association is a heterozygous risk effect including a specific missense variant, against biallelic loss of function here.

    Also dropped references_cache/DOI_10.1186_s12929-014-0063-5.md, a duplicate of PMID_25030234.md that nothing cited.

    Not done, with reasons. prevalence: - the 1:100,000-1:130,000 figure for the SRTD group appears only in the deep-research report, and no cached reference in this PR states it, so there is no quotable source. mappings: for OMIM 263520 - the OMIM number appears inside quoted sentences but no cached record establishes the mapping itself. The additional phenotypes the reviewer lists (trident acetabular roof, intestinal malrotation, congenital heart defects, IUGR) are in the research report rather than in any cached abstract; only IUGR is quotable, from PMID:24854045, and one phenotype is not worth a partial answer to that finding - fetching the sources is the right fix and is a separate round.

    Validation: just validate-disorders passes on both files, 49/49 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens.

  summary: Cite the Nek1 inhibitor phenocopy and ground the ALS separation
  details: |
    Cited two references that had been fetched into the cache and left unused.

    PMID:35081715 reports a potent selective Nek1 inhibitor and shows that administering it
    to zebrafish embryos produces cystic proximal convoluted tubules. Added to the Polycystic
    Kidney Dysplasia phenotype as a third, independent line: acute chemical inhibition in a
    third species reproduces the renal phenotype, so it does not rest on a developmental
    compensation or strain background the way the kat mouse and the human genetics
    respectively might.

    PMID:29929116 grounds the NEK1/ALS separation the gene notes already asserted without a
    citation. Two items: that NEK1 is multifunctional and involved in mitotic checkpoint
    control and the DNA damage response, and the authors' own conclusion that NEK1 mutations
    converge on a pathomechanism shared with other ALS genes. Together they establish that
    the ALS role runs through DDR rather than through the ciliary route this entry curates,
    which is what makes the two disease associations distinct rather than one mechanism seen
    twice.

    One thing deliberately not done. The abstract's opening sentence - that heterozygous NEK1
    loss-of-function mutations cause ALS - would have been the neat citation for the zygosity
    contrast in the notes, but it is that paper reciting other groups' human genetics in its
    introduction, and grading a background recitation as HUMAN_CLINICAL is the mis-sourcing
    failure mode. The zygosity statement stays as unsourced notes prose rather than being
    sourced badly; sourcing it properly needs the primary ALS genetics papers, which are not
    in this entry's scope.

    Left uncited deliberately: PMID:20607029 and PMID:22876582 are pre-molecular SRPS type II
    case reports diagnosed on imaging and autopsy. They describe this disease's phenotype
    accurately but carry no genotype, and the entry already supports every phenotype from
    NEK1-confirmed cases, so adding them would trade specificity for volume.


  summary: Remove the false-negative model link; rebind the tibia phenotype
  details: |
    Second correction round on PR #9668, addressing the two Cursor Bugbot findings that the re-review confirmed and that the previous round left alone.

    The FAILS_TO_RECAPITULATE link on the kat2J mouse is removed. Bugbot and the reviewer were both right, and the problem was mine to see: the link's own limitations field said plainly that the skeleton was never assessed, while the structured relationship slot asserted that the model fails to reproduce the mechanism. FAILS_TO_RECAPITULATE is a substantive negative claim and it is what exports consume, so encoding "nobody looked" as "the model fails" put a claim into the graph that the prose directly underneath it denied making. The prose was carrying the correct distinction and the schema was not.

    Removing rather than downgrading was the right move here. There is no relationship value that means "this model has not been assessed for this node", and inventing one by using MEASURES or PERTURBS would assert an experimental relationship that also does not exist. An absent link is the accurate encoding of an unassessed question, and the nek1_srtd6_no_skeletal_model discussion already records the gap, which is where an open question belongs. The animal model now carries a notes block stating that the omission is deliberate and naming what evidence a FAILS_TO_RECAPITULATE link would need - a study that assays the kat2J skeleton and finds it normal.

    The tibia phenotype is rebound. It was "Absent Tibia" / HP:0009556 / VERY_FREQUENT; the previous round fixed the frequency to FREQUENT but left the term. Both were wrong for the same reason. The source sentence is "short ovoid tibiae or tibial agenesis", a disjunction in which only the second limb is absence, so HP:0009556 encoded the severe end of a range as though it were the whole finding. Now named Abnormal Tibia Morphology and bound to HP:0002992, the most specific term that accurately covers the disjunction. Splitting into Short tibia (HP:0005736) and Absent tibia (HP:0009556) would be better still and is deliberately not done: no cached reference gives separate frequencies for the two forms, so the split would require inventing a distribution.


  summary: 'Create: Short-Rib Thoracic Dysplasia 6 With or Without Polydactyly (MONDO:0009894,
    NEK1)'
  details: |
    De novo curation of NEK1-related short-rib thoracic dysplasia 6 (MONDO:0009894) from the claim in issue #9623.

    Lump/split decision: curated as a standalone DISEASE rather than as a has_subtypes row. kb/disorders/Short-Rib_Polydactyly_Syndrome.yaml already carries a "Type II (Majewski)" subtype attributed to NEK1, and a digenic NEK1/DYNC2H1 inheritance block, so the overlap is real and a reviewer should weigh it. The reasoning for a separate entry: that subtype row carries no MONDO binding and sits inside a concept (MONDO:0015461, the lethal SRPS grouping) that is narrower than SRTD6, which spans "with or without polydactyly" and lists both Jeune syndrome and SRPS-Majewski as MONDO parents. The modern SRTD numbering is per-gene, which matches the KB's existing per-locus practice for DCM and HSP. If reviewers prefer the subtype route, the change is straightforward: bind MONDO:0009894 to the existing Type II row and delete this entry.

    DEEP RESEARCH QUALITY - flagged deliberately. The claude_code report resolved 14/14 references but validated only 1 of 3 quotes, listing PMID:21211617 and PMID:22876582 as carrying unsupported quotes, and scored only 5/14 references on topic. PMID:21211617 is a reference this entry cites heavily. No quoted material was taken from the report for any evidence item; every snippet in this entry was read directly from the cached abstract or full text and all 37 verify against the cache. The report was used only for orientation. Falcon/Edison was unavailable (HTTP 402, key out of credit).

    No GeneReviews chapter for SRTD6 specifically.

    Five-node pathograph: NEK1 loss of function to defective ciliogenesis to impaired growth plate chondrogenesis to thoracic constriction and pulmonary hypoplasia.

    Judgement calls:
    - Two inheritance blocks. The digenic diallelic NEK1/DYNC2H1 mode is curated but both its evidence items are graded PARTIAL, because it rests on individual families rather than a systematic two-locus screen. The prenatal case with a single paternal NEK1 allele and no second hit is included with an explanation stating plainly that it is consistent with either an unfound second allele or a non-classical mechanism and distinguishes neither.
    - The kat2J mouse carries a FAILS_TO_RECAPITULATE link for the growth-plate node, and a HUMAN_MODEL_MISMATCH discussion explains why: the line predates the human skeletal association by decades and was characterised as a PKD model, so the organ system carrying all the human mortality has no reported model phenotype. The limitations field states explicitly that this is an absence of reported skeletal assessment, not a documented normal skeleton.
    - The model's ciliary readouts are recorded in both directions - reduced cilium number in fibroblasts, but abnormally long and supernumerary cilia in cyst-lining cells. The limitations field notes this is length and number dysregulation rather than failure to ciliate, so it is not a clean quantitative match to the reduced ciliation in patient material.
    - A second KNOWLEDGE_GAP covers the 3 of 12 Majewski-type cases with neither NEK1 nor DYNC2H1, and the reported clinical correlate (holoprosencephaly and polymicrogyria in the mutation-negative group) that suggests they may be a different entity rather than unexplained instances of this one.
    - genetic[] notes that NEK1 is separately an ALS risk gene and that the two roles must not be conflated.

    Two self-inflicted defects were caught and fixed before commit: an evidence item left with an NO_EVIDENCE_PLACEHOLDER explanation and a title-only snippet (removed entirely), and a typo in a discussion attaches_to reference ("Chongrogenesis"), caught by just check-entity-refs.

    Validation: just validate-disorders passes (schema, terms, references), 37/37 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

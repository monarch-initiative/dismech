  summary: 'Round-3 review: fix drifted title, ground the pulmonary node on real sources'
  details: |
    Addressed both blocking findings from the round-3 review on PR #9668, plus the
    curation-changelog suggestion. One finding was correct as reported; the other had a
    correct diagnosis and a proposed fix that does not exist.

    Finding 1 (reference_title mismatch for PMID:35081715) - confirmed and fixed. The YAML
    read "...Its Effects on the Zebrafish Embryo." and the cache frontmatter reads "...Its
    Effects on the Embryonic Zebrafish Pronephros." Copied verbatim. This is the same defect
    the reviewer raised on PR #9678 in the same round, and both came from writing the title
    from the sense of the paper instead of copying it out of the cache.

    Finding 2 (Pulmonary Hypoplasia node under-supported) - the diagnosis is right, the
    proposed replacement text is not in the file. The node asserted three things and its only
    snippet, which never mentions the lungs, supported none of them. The review directed me to
    three sentences at references_cache/PMID_37822322.md line 42. That file is 34 lines long,
    and none of the three sentences appear anywhere in it: grepping the cache for "pulmonary
    development", "respiratory distress is caused" and "lung hypoplasia" all return zero. I
    then swept every one of the 12 cached references for this entry for any sentence mentioning
    lungs, pulmonary, respiratory or asphyxiation, and the only hit was the BACKGROUND sentence
    already quoted. So the review's own conclusion - that no disease-specific statement of
    pulmonary hypoplasia was available to cite - was correct, and its suggested fix was not
    available either.

    Fetched two real references instead. PMID:23985472 (Jeune management review) gives
    "Children with JS present with variable degrees of respiratory distress, frequently lethal
    in the neonatal period", and PMID:19610081 (13-patient series) gives "respiratory distress
    was observed in eight patients and proved lethal in six". Both are graded PARTIAL for the
    same cross-disease reason as the existing citation. Kept PMID:37822322 but re-scoped its
    explanation to the thoracic premise only, which is what it actually states.

    Also narrowed the node description. It had asserted that the lungs are intrinsically
    normal and the limitation is purely mechanical. Nothing available states that, so the
    description now marks it as the standard account of the disease group rather than a
    measured finding, and a node-level note records that a NEK1-specific or Majewski-specific
    lung measurement is what would let these items be graded SUPPORT.

    Rephrased the two remaining curation-changelog notes (growth-plate node, tibia phenotype)
    as standing statements about the biology and the term choice. They render on the public
    disorder page, so a note that reads as a reply to review feedback is addressed to the wrong
    audience. The reasoning is preserved in both.

    Not done: adding a Pulmonary Hypoplasia phenotype bound to HP:0002089. The new references
    support respiratory distress and its lethality, not a measured lung hypoplasia, so an
    HP-coded hypoplasia phenotype would assert more than the sources carry. The mechanism node
    covers it.

    Validation: just validate (53/53 snippets verified), check-entity-refs,
    check-duplicate-keys, validate-terms, tests/test_reference_titles.py (38 passed),
    check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens,
    check-term-cache-integrity all pass.

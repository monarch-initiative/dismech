  summary: Commit the full-text caches; re-ground the pulmonary node on them
  details: |
    Corrects a mistake of mine and re-grounds the Pulmonary Hypoplasia node on evidence that
    was available all along.

    In the previous round I reported that three sentences the reviewer quoted from
    references_cache/PMID_37822322.md did not exist, and said so on the PR. They do exist. The
    file committed in this PR was the 34-line abstract-only fetch; the paper has full text via
    PMC, 159 lines, and all three sentences are on line 42 exactly as described. Verified by
    re-fetching and grepping each one.

    The cause was mine. After each `just validate` run the reference cache expands where PMC
    now serves full text, and I had been running `git checkout -- references_cache/` to discard
    what I treated as unrelated churn and keep the PR narrow. PMID_37822322.md was in one of
    those discard lists. I threw away the full-text expansion of the file and then concluded,
    from the abstract-only version I had just restored, that the quotes were fabricated. The
    habit of discarding cache churn is what produced a false public accusation, and the fix is
    to stop treating a cache expansion as noise.

    Committed the expanded caches rather than discarding them again. Five files changed:
    PMID:37822322, PMID:37585529 and PMID:38986433 gained full text (34 to 159, 43 to 185, and
    37 to 115 lines); PMID:24854045 and PMID:29929116 gained only a full_text_attempted flag.
    All existing snippets still verify.

    Re-grounded the node on the newly available text. It previously rested on two cross-disease
    references establishing the respiratory outcome, with PMID:37822322 carrying only the
    thoracic premise and an explanation stating the paper does not make the pulmonary claim -
    which was true of the abstract and false of the paper. It now cites three sentences that
    reach the claim directly: the thoracic insufficiency syndrome definition (the chest cannot
    support normal pulmonary development, which is the mechanical claim), the causal direction
    (respiratory distress caused by thoracic morphology), and lung hypoplasia named outright.
    The description no longer hedges the mechanical account as an unmeasured standard reading,
    because it is now cited. All three stay PARTIAL: they describe Jeune syndrome and thoracic
    insufficiency syndrome as a group rather than NEK1 or Majewski disease specifically, which
    the node notes still record.

    Added the Pulmonary Hypoplasia phenotype bound to HP:0002089, which was suggested in the
    previous round and declined for want of a quote naming hypoplasia. That quote now exists.
    It deliberately carries no frequency: the statement is qualitative, applies to the group,
    and "highly symptomatic patients" is not a denominator.

    Not done: mining PMID:37585529 and PMID:38986433, which also gained full text. Their
    existing snippets still verify and nothing in the review points at them; they are available
    for a future pass.

    Validation: just validate (56/56 snippets verified), check-entity-refs,
    check-duplicate-keys, validate-terms, tests/test_reference_titles.py (38 passed),
    check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens all
    pass.

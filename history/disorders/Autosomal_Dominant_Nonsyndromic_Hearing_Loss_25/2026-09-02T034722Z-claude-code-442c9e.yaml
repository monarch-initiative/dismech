  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 25 (DFNA25, SLC17A8/VGLUT3)'
  details: |
    New Disease entry for MONDO:0011568 (DFNA25), curated from primary literature plus a falcon deep-research run (preflight WARN, exit 0; the 'ABR' rival-gene warning is the auditory brainstem response acronym, a false positive).

    entry_type decision: DISEASE. MONDO:0011568 was bound nowhere in kb/, DFNA25 has its own OMIM phenotype entry, DFNA locus number and a ClinGen Definitive gene-disease assertion, and no existing entry binds SLC17A8, so there was no coverage to duplicate. The stub was deleted.

    Relationship to the two neighbouring entries, which was the substantive question on the issue. DFNA25 is NOT recorded as a subtype of Auditory_Neuropathy. The defining physiological signature of that class - preserved otoacoustic emissions with an abnormal auditory brainstem response - is demonstrated only in the Slc17a8-null and A224V knock-in mice and has never been measured in a DFNA25 patient. The Auditory_Neuropathy has_subtypes list is populated by entities whose classification rests on a human clinical finding (OTOF, DIAPH3, ATP11A, AIFM1, TMEM43). The contrast with Autosomal_Recessive_Nonsyndromic_Hearing_Loss_93 (CABP2) is recorded explicitly in a differential_diagnoses entry and in notes: DFNB93 has a published human emissions observation and therefore states its synaptopathy classification in its pathophysiology, while DFNA25 states the dissociation for the mouse only and carries the human question as an open KNOWLEDGE_GAP.

    Two mechanistic_hypotheses groups are curated rather than one, because the two mouse models disagree. The Slc17a8 null (presynaptic_glutamate_loading_failure, CANONICAL) shows empty-vesicle release with normal exocytosis. The allele-matched VGLUT3 A224V knock-in (a211v_mechanotransduction_first, EMERGING) reports inner hair cell stereocilia collapse and a reduced summating potential first, with ribbon changes later, and its authors conclude DFNA25 begins in mechanotransduction.

    A HUMAN_MODEL_MISMATCH discussion records the genetics problem: heterozygous Slc17a8 knockout mice hear normally while heterozygous human p.A211V carriers go deaf, so neither model matches the patients' genotype and the choice between gene addition and allele-selective knockdown is unresolved. functional_impact_category is deliberately left empty on the trigger node for the same reason.

    Correction made later in the same session, after the entry was first written. The full text of PMID:34783032 was searched for the heterozygous-mouse phenotype and turned up something more important: otoacoustic emissions are reported ABSENT in p.A211V patients - the opposite of both mouse models - and that paper concludes on that basis that DFNA25 is more likely a progressive hearing loss than an auditory neuropathy. The first draft of this entry asserted that patient emissions had never been measured, which was wrong. The correction strengthens the disposition rather than changing it: DFNA25 stays out of the Auditory_Neuropathy has_subtypes list, now for a positive cited reason rather than for absence of evidence. Added an 'Absent Otoacoustic Emissions' phenotype (HP:6000182) carrying the finding, the authors' classification conclusion, and their untested alternative explanation (lifetime noise exposure) as a NO_EVIDENCE item; added a REFUTE evidence item against the preserved-amplification pathophysiology node; and replaced the lesion-site knowledge gap with two better ones - why patient emissions are absent, and how a vesicular transporter variant collapses a stereocilia bundle it is not present in.

    The same full-text search also replaced an unsourced prose claim. The first draft said heterozygous Slc17a8 KNOCKOUT mice hear normally, which could not be quoted from any cached reference. The citable fact is better: heterozygous A224V KNOCK-IN mice - the genotype that matches a patient - show only mild impairment, which the authors themselves say contrasts with the dominant transmission in the human families. The HUMAN_MODEL_MISMATCH was rewritten around that and its proposed experiment changed, because the experiment the first draft proposed had already been done.

    Deliberately absent: no prevalence (nine probands worldwide), no phenotype frequency bands (no denominator that is DFNA25), no progression, no clinical_trials, no datasets.

    Ontology note: the deep-research report proposed HP:0012715 as 'Bilateral hearing impairment' (it is Profound hearing impairment) and HP:0002066 as 'Hearing impairment' (it is Gait ataxia). Both were caught by resolving through OLS and were not used.


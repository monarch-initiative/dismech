  summary: Add SPRY4/HH17 subtype; bind MONDO terms to the whole has_subtypes section
  details: |
    Claim #10790 (hypogonadotropic hypogonadism 17 with or without anosmia, MONDO:0014102, SPRY4). Recorded entry_type SUBTYPE and curated it as a has_subtypes entry on Kallmann_Syndrome rather than a standalone kb/disorders/ entry.

    Why SUBTYPE. MONDO classifies MONDO:0014102 as a direct child of MONDO:0018800 (Kallmann syndrome), which is this entry's disease_term. Downstream of the FGF/ERK node there is no distinct pathograph: the existing node 'Defective GnRH neuron and olfactory axon migration' already carries GO:0008543 fibroblast growth factor receptor signaling pathway with modifier DECREASED, which is exactly where the SPRY4 lesion lands. Gene-disease validity is also weak - no ClinGen assertion, GenCC Limited to Moderate, PanelApp amber on both HH panels - so asserting a disease-level identity would overstate the evidence.

    What was added:
    - has_subtypes SPRY4 (MONDO:0014102), with genes hgnc:15533, a subtype-level Oligogenic inheritance block bound to HP:0010983, and four evidence items.
    - genetic 'SPRY4 variants' with relationship_type SUSCEPTIBILITY and subtype: SPRY4, carrying the mechanism note.
    - A HUMAN_MODEL_MISMATCH discussion recording that the gain-of-inhibition functional work is in fibroblast/osteosarcoma/lung-cancer lines, not GnRH neurons.

    Inheritance: HP:0010983 (oligogenic), not HP:0010984 (digenic). The published combinations are two- and three-locus (PROKR2/SPRY4/NSMF), and the founding cohort frames FGF-pathway genes as contributors to an architecture rather than as a defined two-locus requirement. The counter-case (PMID:31781046, a SPRY4 variant as the only finding across a 28-gene panel) is curated alongside so the oligogenic framing is not overstated.

    Mechanism, and the sign problem. Sprouty4 antagonises FGF/RAS-ERK, so naive loss of function would raise FGF signalling - the wrong direction for a DECREASED-FGFR1-signalling disease. PMID:40806483 resolves it: the Kallmann-associated K177R substitution is a hyperactive inhibitor, lowering serum-induced pERK where wild-type Sprouty4 does not. Gain of inhibitory function in the antagonist converges on the same decreased-FGFR1 node as FGFR1 and FGF8 loss of function.

    Section-wide binding, following #9911/#10610/#10780: the other five subtypes were also unbound, so all were bound rather than leaving a half-bound section - ANOS1 -> MONDO:0010635, FGFR1 -> MONDO:0007844, FGF8 -> MONDO:0012988, CHD7 -> MONDO:0012880. PROKR2_PROK2 is the #10780 case: one dismech subtype spanning two MONDO leaves (HH3 PROKR2, HH4 PROK2) with a single-valued subtype_term, so both are declared as disease-level skos:narrowMatch mappings and the subtype carries a review_notes explaining the deliberate omission. Every CURIE resolved through OLS4 with the label copied from the response and the OMIM xref checked against the standard HH-series number.

    The five existing genetic entries were keyed to their subtypes with subtype:, which makes the subtype names load-bearing rather than descriptive.

    Retires three stubs: HH17 (the claim), plus the previously unclaimed HH3 and HH5, both now covered. Confirmed with just tidy-stubs, which reports all three as already_curated by this file.

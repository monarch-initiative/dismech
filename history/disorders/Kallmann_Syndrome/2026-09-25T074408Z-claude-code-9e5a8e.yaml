  summary: 'Genetics pass: Kallmann_Syndrome (d2g series-039)'
  details: |
    Genetics pass for series-039 (issue #12246). Enumerated all 18 MONDO descendants of MONDO:0018800 through the OLS4 API and read each term's gene edges from the Monarch association API, rather than working from the issue's nine-row gap list. Added seven gene-defined has_subtypes rows with subtype_term bound to the MONDO leaf, plus a matching genetic: record each: WDR11 (HH14), HS6ST1 (HH15), SEMA3A (HH16), DUSP6 (HH19), FGF17 (HH20), FEZF1 (HH22), NSMF (HH9). WDR11, HS6ST1, SEMA3A and FEZF1 are typed CAUSATIVE and bound as genes: descriptors on the "Defective GnRH neuron and olfactory axon migration" pathophysiology node, each with its own evidence item at that node stating the migration-relevant function. DUSP6, FGF17 and NSMF are typed SUSCEPTIBILITY and deliberately not bound at that node, following the rule the node's own notes already set for SPRY4 and FLRT3. Declined KISS1R (HH8) and TACR3 (HH11) on mechanism: both act on the central control of GnRH secretion rather than on GnRH-neuron and olfactory-axon co-migration, which is the only mechanism this entry models. The ruling, its sources and the MONDO classification problem behind it are recorded in the new entry-level notes.

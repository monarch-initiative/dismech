  summary: Add HH25 (NDNF) subtype to Kallmann_Syndrome
  details: |
    Reconciled MONDO:0030010 (hypogonadotropic hypogonadism 25 with anosmia, NDNF) onto Kallmann_Syndrome as an NDNF has_subtypes row instead of a new entry, following the house pattern for numbered HH leaves. Added subtype-level autosomal dominant and autosomal recessive inheritance blocks, a CAUSATIVE NDNF genetic record, NDNF bound at the GnRH neuron and olfactory axon migration node with mouse and zebrafish evidence, and an entry-level note explaining why this MONDO class (filed by MONDO under MONDO:0018555) is curated under Kallmann syndrome. Sources: PMID:31883645, PMID:36454653, PMID:40788466, PMID:33531459. Validated with just validate, count-verified-snippets (all verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments.

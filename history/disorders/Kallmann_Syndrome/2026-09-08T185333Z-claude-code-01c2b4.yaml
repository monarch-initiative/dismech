  summary: Add FLRT3 / HH21 subtype (MONDO:0014107)
  details: |
    Resolution of claim issue #11475, hypogonadotropic hypogonadism 21 with or without
    anosmia (MONDO:0014107, FLRT3).

    Scope decision: SUBTYPE, not a standalone disease entry. MONDO:0014107 is bound as a
    has_subtypes[].subtype_term on Kallmann_Syndrome, and a matching genetic block is added
    with relationship_type SUSCEPTIBILITY. Because the MONDO ID is now bound in kb/, the
    stub is deleted.

    The decision was made on evidence, not by pattern-matching, because the precedent in
    this knowledge base is genuinely mixed - FGFR1 and (on an open pull request) IL17RD/HH18
    are standalone entries while SPRY4/HH17 is a subtype row. Five things settled it:

    1. FLRT3 entered the CHH literature in the 2013 FGF-pathway candidate screen
       (PMID:23643382) with the smallest yield of the five genes reported - variants in 3 of
       386 unrelated individuals, against 14 for SPRY4.
    2. That paper's own conclusion is that the FGF-pathway genes act primarily as
       contributors to an oligogenic architecture rather than as self-sufficient causes.
    3. No ClinGen gene-disease validity assertion exists for FLRT3. Checked directly against
       the ClinGen gene-validity download of 2026-09-08; GTPBP3, curated in the same
       session, does appear there, so the absence is a real negative rather than a missing
       file.
    4. Every later cohort that reports FLRT3 does so as a rare variant or a variant of
       uncertain significance, usually alongside a second locus: the 130-patient Brazilian
       cohort (PMID:31200363), a five-patient Italian series where the FLRT3 allele sits
       beside PROK2 and CHD7 findings (PMID:37108593), and a 16-patient Turkish cohort where
       it is one of four heterozygous VUSs (PMID:36700485). A PubMed search on 2026-09-08 for
       FLRT3 with hypogonadism, Kallmann, puberty or GnRH returned no report stronger than
       these.
    5. The internal comparison is decisive: SPRY4 is the stronger gene from the same paper
       and is curated here as a subtype. Curating FLRT3 standalone would be inconsistent with
       that. IL17RD was promoted to a standalone entry on the strength of a distinguishing
       phenotype (hearing loss in 6 of 8 in the founding cohort), a larger series and a
       dedicated review literature; FLRT3 has none of the three.

    Mechanism. FLRT3 needs no separate pathograph: it converges on the node this entry
    already carries, defective co-migration of GnRH neurons and olfactory axons. Two
    documented activities point there - it interacts with FGFR1 and is induced by FGF
    signalling (PMID:16872596), and it is an axon-guidance and neuronal-migration receptor,
    a Robo1 coreceptor whose absence makes thalamic axons insensitive to Netrin-1
    (PMID:24560577) and a partner of FLRT2 in controlling the tangential migratory streams of
    cortical interneurons through Unc5 receptors (PMID:34301831).

    What the block declines to say. The direction of effect is not asserted. FLRT3 reads as a
    positive modulator of FGF signalling, so losing it would lower FGFR1 output and converge
    on the same decreased-signalling node as ANOS1, FGFR1 and FGF8 - but no functional study
    of a CHH-associated FLRT3 variant has been published. The founding paper did in vitro work
    on the FGF17 and IL17RD variants and not on the FLRT3 ones, and all three mechanistic
    citations here are mouse or knockout systems rather than patient alleles, so each carries
    directness: INDIRECT. No phenotype is asserted as FLRT3-specific.

    Diff hygiene. The change is purely additive - 189 insertions, 0 deletions - and touches
    only has_subtypes and genetic. An earlier pass ran a snippet-exactifying helper over the
    whole file and silently rewrote five pre-existing snippets belonging to other subtypes;
    that was caught in the diff, the file was reverted, and the helper was re-run against the
    two new blocks in isolation before insertion. No existing curation was modified.

    Validation run: just validate (schema, terms, references) on Kallmann_Syndrome,
    count-verified-snippets (55/55, none skipped by prefix), check-entity-refs,
    check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms,
    check-stubs, plus the whole-KB snippet ratchets and validate-disorders. A cosmetic
    frontmatter rewrite of references_cache/PMID_21497178.md produced by the validator was
    reverted rather than committed.

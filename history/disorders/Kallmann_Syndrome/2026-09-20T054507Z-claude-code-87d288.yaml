  summary: Bind PROK2, split the PROKR2/PROK2 record, and wire six genes into the
    pathograph
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    The finding here is a gene named in prose but bound to nothing. One `genetic:`
    record was titled "PROKR2 / PROK2 variants" and its notes discussed both genes,
    but `gene_term` is single-valued and held PROKR2 alone - so PROK2, one of the
    five genes the reconciliation checklist names, had no HGNC identifier anywhere in
    the entry and was invisible to any machine reading of it. The record is now split
    into two, `PROKR2 variants` and `PROK2 variants`, both keyed to the single
    `PROKR2_PROK2` subtype row, which itself now lists both genes.

    Also: the founding cohort's zygosity result was added as evidence, because a
    first draft of the PROK2 note asserted the cohort had reported both mono-allelic
    and bi-allelic PROK2 findings and the paper says the opposite - every PROK2
    mutation in that series was heterozygous, and it was PROKR2 that was found
    heterozygous, homozygous and compound heterozygous. The note now records that,
    and records that ClinGen's semidominant grading for PROK2 cannot be read off this
    paper.

    Pathograph wiring: no gene reached any pathophysiology node before this pass. The
    `Defective GnRH neuron and olfactory axon migration` node's own description names
    ANOS1, FGFR1, FGF8, PROKR2 and PROK2 as acting there; all five are now bound as
    `genes:`, along with CHD7, and evidence covering the FGF8 ligand step, the
    prokineticin axis and CHD7's expression in the relevant tissues was added to the
    node so each binding is supported there rather than only in the gene record.
    CHD7's evidence is marked INDIRECT: it establishes expression in the right
    tissues at the right stage, not an observed migration arrest. SPRY4 and FLRT3 are
    deliberately not bound at that node - both are typed SUSCEPTIBILITY and FLRT3's
    direction of effect is explicitly not asserted by its own record.

    New evidence: ClinGen definitive assertions for ANOS1 (HH1), PROKR2 (HH3) and
    PROK2 (HH4); a `case_fractions` entry for CHD7 quoting the founding screen's own
    6% figure. ClinGen has no assertion for CHD7 against any hypogonadotropic
    hypogonadism class - its only CHD7 row is CHARGE syndrome - and the notes say so
    and name the download date rather than leaving the absence unexplained.

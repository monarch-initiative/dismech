  summary: 'Review: Peeling Skin Syndrome evidence re-read against cached sources'
  details: |
    Re-read all 11 cached PMIDs and re-verified all 35 evidence items. Every snippet is an
    exact substring of its cache, including a Greek-letter quote and a reproduced source typo
    ("tranglutaminase 5 gene"). No fabricated quotes.

    Fixed in this pass:
    - has_subtypes[APSS-TGM5]: the description asserted "A recurrent European founder variant,
      c.763T>C p.(Trp255Arg), is described." No evidence item supports it, no cached reference
      anywhere in the repository mentions c.763T>C, Trp255Arg or W255R, and the allele reported
      in the literature as the recurrent European founder in acral PSS is a different one. This
      is a fabricated-variant pattern rather than a sourcing gap, so the sentence was removed
      rather than replaced with another unverifiable allele.

    Recorded for follow-up (the causal-direction finding is the important one):
    - pathophysiology[0] "Defective corneodesmosome-mediated corneodesmosome cohesion" has a
      downstream edge to "Loss of corneodesmosin and epidermal barrier breakdown" whose
      description asserts that defective cohesion "progresses to complete loss of
      corneodesmosin". The cited PMID:20691404 asserts the opposite direction: a homozygous
      CDSN nonsense mutation "leads to a complete loss of corneodesmosin", and lack of
      corneodesmosin causes the barrier defect. As written the pathograph makes a claim no
      cited source supports; the edge should be reversed or the downstream node renamed to its
      actual consequence.
    - Five PMID:30032785 items are graded HUMAN_CLINICAL; the cache marks it a single-author
      commentary with no patients of its own (OTHER, per repo precedent in
      kb/modules/epidermal_cornification_failure.yaml).
    - Four title-only snippets, three over caches holding only a title block.
    - relationship_type: DISPUTED for CHST8 rests on an uncited "questioned in later work".

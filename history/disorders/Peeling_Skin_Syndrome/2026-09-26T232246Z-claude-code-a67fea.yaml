  summary: Wire FLG2 into the pathograph and source the CHST8 dispute
  details: |
    Residual genetics wiring recovered after PR #12896 deferred it (issue #12255, closed). Measured first: subtype FK coverage was already 7/7, and one subtype gene (FLG2) reached no pathophysiology node. Added a mechanism-specific node, Filaggrin-2 deficiency with secondary corneodesmosin reduction, bound to FLG2 (hgnc:33276), keratinocyte (CL:0000312), cell-cell adhesion (GO:0098609, DECREASED) and stratum corneum of epidermis (UBERON:0002027), with four abstract-sourced evidence items from PMID:29758285 and an INDIRECT_KNOWN_INTERMEDIATES edge to the shared corneodesmosome cohesion node, the intermediate being reduced corneodesmosin. Added the same paper's whole-exome cosegregation sentence to the FLG2 genetic record and a note on the PSS type A versus generalized-ichthyotic naming split between the two 2018 reports, plus MONDO's own FLG2 class. Sourced the previously uncited CHST8 disputed claim with two REFUTE evidence items from PMID:28204496, whose functional characterisation finds the R77W enzyme equivalent to wild type and finds keratinocytes do not express CHST8; the DISPUTED relationship_type is unchanged and now carries its reason. Disease anchor MONDO:0019347 checked and kept: the entry models the peeling skin syndrome umbrella and all five gene-defined MONDO descendants carrying a causal gene (CSTA, TGM5, SERPINB8, CDSN, FLG2) are curated here. Also wired the phenotype layer, which measurement showed was entirely detached: six edges from existing cached sources now connect the shared cohesion node to skin peeling, the CDSN node to ichthyosiform erythroderma, pruritus, food allergy and elevated IgE, and the TGM5 node to palmoplantar peeling. The PLACK features, ichthyosis and post-inflammatory hyperpigmentation were left unwired: no cited source states that leukonychia, cheilitis or knuckle pads arise through desquamation, and the remaining two rest on a title snippet and on a paper whose cache carries no abstract. After: 6 WIRED_DIRECT subtype genes, 1 GENETIC_NONCAUSAL (CHST8, disputed), no unwired rows; causal genes wired to a mechanism 5 of 6 to 6 of 6; phenotype causal inlink coverage 0 of 11 to 6 of 11. Validation under linkml-reference-validator 0.3.0rc3: validate and validate-terms pass; 50 of 50 snippets verified; entity refs, causal targets, duplicate keys, enum values, qualifier terms all clean; 37 of 37 gene bindings resolved against HGNC with no mismatch.

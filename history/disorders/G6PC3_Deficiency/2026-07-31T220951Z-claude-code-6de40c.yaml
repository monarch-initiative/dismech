  summary: Apply reviewer pre-merge G-CSF modality correction
  details: |
    Follow-up to PR #7379, which merged before the reviewer's requested one-line change was applied. Changed the G-CSF treatment's therapeutic_modality from PROTEIN_REPLACEMENT to OTHER: that enum value is bound to meaning NCIT:C16221 Protein Replacement Therapy, so tagging G-CSF with it asserted a replacement relationship NCIT does not support. G6PC3 patients are not G-CSF deficient; G-CSF acts as a supraphysiological growth-factor stimulus to residual granulopoiesis. An earlier draft of this record claimed repo precedent showed PROTEIN_REPLACEMENT was reserved for rhGH/IGF-1 hormone-deficiency states; that was wrong and was corrected after review. Checking all 34 files that use the value shows the dominant use is enzyme replacement (Maroteaux-Lamy, Sly, Niemann-Pick A/B, Cholesteryl Ester Storage, Aspartylglucosaminuria, Glycoprotein Storage), plus immunoglobulin, insulin and C1-INH replacement, and that non-replacement biologics (anakinra, etanercept, luspatercept) are already tagged with it. The NCIT:C16221 definition argument stands on its own; the enum gap is filed as issue #7457. Updated the treatment notes to record the reasoning and the underlying enum gap. Also applied the reviewer's optional nit: the echocardiography and renal/pelvic ultrasound diagnosis record's diagnosis_term moved from generic NCIT:C18020 Diagnostic Procedure to NCIT:C17369 Imaging Procedure, verified with OAK and matching repo convention in Moyamoya_Disease and others. The serial-ANC record correctly keeps NCIT:C18020. Validated with just validate: schema clean, terms passed, 69/69 snippets verified.

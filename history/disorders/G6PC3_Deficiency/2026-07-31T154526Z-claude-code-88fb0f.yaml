  summary: 'Augment: G6PC3 deficiency (SCN4) - re-anchor MONDO, add mechanism chain,
    treatments, prevalence'
  details: |
    Augmentation of the pre-existing G6PC3_Deficiency entry for epic issue #1079 (autosomal recessive severe congenital neutropenia due to G6PC3 deficiency, MONDO:0012930). Pre-existing content was retained and not rewritten. Corrected: disease_term was anchored to MONDO:0023124 (Dursun syndrome, Orphanet:178503), a NARROWER G6PC3 entity limited to the PAH/leukopenia/ASD presentation; re-anchored to MONDO:0012930 (SCN4; OMIM:612541, Orphanet:331176, RO:0004003 to HGNC:24861), with MONDO:0023124 retained as a skos:narrowMatch in a new mappings block. Added: IUIS classification (phagocyte defect, Table 5) and Harrisons chapters; three new pathophysiology nodes completing the mechanism chain (neutrophil glycolytic block and energy deficit; ER stress and increased myeloid apoptosis; ubiquitous G6PC3 loss in non-haematopoietic tissues) plus biological_scale tags on all nodes; four new phenotypes (atrial septal defect, Crohn disease, intellectual disability, pulmonary arterial hypertension) and evidence-backed frequency bands; absolute neutrophil count biochemical marker with a LOINC:751-8 reference range and four interpretation bands; plasma 1,5-anhydroglucitol as a pharmacodynamic readout; four treatments (G-CSF, empagliflozin SGLT2-inhibitor substrate reduction with target_mechanisms on the 1,5-AG6P node, allogeneic HSCT, antibacterial prophylaxis); two structured prevalence records; three discussions with structured proposed experiments. NEC preflight run against MONDO:0012930 confirming gene G6PC3/HGNC:24861 and OMIM:612541, explicitly distinguishing G6PC1 (GSD Ia) and SLC37A4/G6PT (GSD Ib). Validated with just validate, just validate-terms and just validate-references: 61/61 snippets verified against cached references; all 9 new PMIDs cached via just fetch-reference.

  summary: 'Create: glycogen storage disease type 0a'
  details: |
    Created the glycogen storage disease type 0a entry (MONDO:0009414), autosomal recessive hepatic glycogen synthase deficiency. The mechanism curated here is the inverse of the other glycogenoses: GYS2 loss means the liver cannot synthesize glycogen, so there is neither hepatomegaly nor stored glycogen. Modelled the diagnostic diurnal swing explicitly, from fasting ketotic hypoglycemia with low lactate to postprandial hyperglycemia with lactic acidemia as ingested glucose is shunted to glycolysis. Distinguished carefully from GYS1 muscle glycogen synthase deficiency, which is a different disease. Every evidence snippet was verified as an exact substring of a fetched reference cache file; all offline gates pass.

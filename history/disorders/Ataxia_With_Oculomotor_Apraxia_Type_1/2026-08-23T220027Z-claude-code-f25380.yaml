  summary: 'Create: Ataxia With Oculomotor Apraxia Type 1 MONDO:0008842'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report that passed 'just preflight-dr' against MONDO:0008842 with a PASS verdict: canonical gene APTX mentioned 75 times, report OMIM 208920 matching the MONDO xref. The report's citations file carried only two PubMed links, so four of the six references here were found by PubMed query and every abstract was read before use. The pathograph is built on the specific enzymology rather than on generic DNA-repair failure: aprataxin removes the adenylate group that an aborted DNA ligase leaves covalently attached to a 5'-phosphate terminus, so the enzyme repairs the repair machinery's own mistakes rather than repairing DNA. Frequency bands are all taken from one quantitative sentence in the French series - ataxia, cerebellar atrophy and neuropathy present in all patients hence OBLIGATE, oculomotor apraxia 86% and hypoalbuminaemia 83% hence VERY_FREQUENT, hypercholesterolaemia 75% and chorea 79% hence FREQUENT - rather than estimated. Three discussions record what the sources do not settle: the hypoalbuminaemia named in the disease's own MONDO label has no mechanism in any reference read, two large series disagree about genotype-phenotype correlation, and measured coenzyme Q10 was normal in five of six patients which keeps a mitochondrial node out of the graph. Module conformance is claimed at four nodes and deliberately stops short of cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration because no AOA1 neuropathological study was found and MRI atrophy does not identify the neuron lost. No treatments curated: all six references grepped for therapy content, none found. Validation: 'just validate' passed with 36 of 36 snippets verified, 'just validate-terms' passed, the conforms_to foreign-key test passed, and all five ungated CI gates are clean - check-folded-hyphens caught one real defect, a line break inside 'Alpha-fetoprotein' that would have rendered as 'Alpha- fetoprotein', which was reflowed before commit.

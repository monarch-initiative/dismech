  details: |
    Addresses the non-blocking suggestion on the approving review of PR #9332. Two description: fields narrated the review process rather than the disease, and description: renders on the public disorder page.

    The EMG diagnosis entry said the investigation was 'the single highest-yield investigation in this disease and, until this round, absent from the entry'. 'This round' is meaningless to anyone opening the page without the PR in view. The clause is removed; the substantive claim - 100% yield, so a normal EMG is strong evidence against the diagnosis - is unchanged.

    The No Disease-Modifying Therapy treatment opened with 'Curated positively rather than by omission, because an empty treatments section reads as an unfinished entry rather than as a finding'. That is an argument addressed to a curator about how to read the file, not information about the disease. Rewritten to state the finding first and keep the point about it being a finding rather than an omission, without the editorial framing.

    Neither change touches evidence, terms, or any structured value. The curation reasoning itself is preserved in the history records for this entry, which is where round-by-round narrative belongs.


  summary: 'Review round 2: mine GeneReviews diagnosis and genetic counseling'
  details: |
    Addressed three blocking findings from review round 2 of PR #9332, all in the GeneReviews chapter PMID:20301629 that round 1 had added as a reference but only partially mined.

    1. Tagged the reference. PMID:20301629 in references: now carries tags: [GeneReviews], which is what makes the baseline-chapter convention machine-visible rather than a fact about which PMID happens to be present.

    2. Mined DIAGNOSIS/TESTING. Added two diagnosis entries the chapter supports and the entry lacked. Electromyography and Nerve Conduction Study carries the 100%-yield axonal neuropathy finding, which is the highest-yield investigation in this disease and makes a normal EMG strong evidence against the diagnosis - the reviewer called its absence the biggest single miss. Brain MRI carries universal cerebellar atrophy, agreeing with the 14/14 French series already cited. Both are bound with diagnosis_term (NCIT:C38056 Electromyography, NCIT:C16809 Magnetic Resonance Imaging). Note the slot: Diagnosis takes diagnosis_term, not treatment_term - both have range TreatmentDescriptor, so the wrong one is a schema error rather than a silent mis-binding. Also added the chapter's APTX-only-gene sentence to the existing sequencing entry (it explains why one-gene sequencing is definitive rather than a first step) and its AT-exclusion sentence to the differentiation entry (exclusion of ataxia-telangiectasia is part of how the diagnosis is defined, not merely a differential to consider).

    3. Mined GENETIC COUNSELING. The entry previously stated recurrence risk nowhere. The Autosomal recessive inheritance block now carries the 25/50/25 figures with the chapter's own sentence, and the carrier/prenatal testing availability. Added two treatments: Genetic Counselling with Carrier and Prenatal Testing (NCIT:C15240) and Educational Support (NCIT:C15747).

    Validation: just validate passed with 60/60 snippets verified against cached references (up from 53/53); just validate-terms passed; all five ungated CI gates run and clean (check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-duplicate-keys). Every snippet added this round was confirmed as an exact substring of references_cache/PMID_20301629.md before being written, and every NCIT term was confirmed present in cache/ncit/terms.csv with a matching label.

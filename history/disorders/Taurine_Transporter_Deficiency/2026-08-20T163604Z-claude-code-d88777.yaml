  details: |
    Round-4 review fix on PR #8897, addressing the single blocking finding from the ai4c-reviewer CHANGES_REQUESTED review at commit 45e04f3cd.

    Two evidence items citing PMID:41343195 quoted bench-assay sentences while carrying evidence_source: HUMAN_CLINICAL. Both are now IN_VITRO:

    - pathophysiology[0] "SLC6A6 Loss of Function", the item quoting "Functional studies demonstrated that both missense variants are associated with complete loss of taurine transport in HEK-293 cells and patient-derived fibroblasts."
    - diagnosis[2] "Molecular genetic testing of SLC6A6", the item quoting "In vitro and ex vivo taurine transport and membrane trafficking assays in human embryonic kidney (HEK)-293 cells, as well as patient-derived fibroblasts, were also performed."

    Rationale: CLAUDE.md classifies cultured cells and ex vivo assays as IN_VITRO regardless of whether the cells were derived from a patient, and instructs splitting a mixed-methods paper so each item carries a single evidence_source. PMID:41343195 is such a paper; the entry already split it correctly elsewhere and these two items were the leftovers. This is the in-vitro twin of the murine mislabel fixed in the previous round (record 2026-08-20T084152Z). No claim is weakened: pathophysiology[0].evidence[0] retains direct human measurement (plasma, skeletal muscle and brain taurine) and diagnosis[2].evidence[0] retains the segregation result, so both nodes keep genuinely human-clinical support. The change is a queryability fix, not a content change.

    Deliberately NOT changed, per the reviewer's explicit do-not-over-fix instruction: pathophysiology[0].evidence[0] (3H-taurine uptake in PBMCs plus direct tissue taurine measurement) and pathophysiology[0].evidence[1] (the p.A78E membrane-localization sentence). No snippet, explanation, pathophysiology node, causal edge, phenotype, treatment or reference was added, removed or altered; the diff is two enum values.


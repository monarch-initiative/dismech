  details: |
    Addressed the blocking IMPORTANT finding in the ai4c-reviewer CHANGES_REQUESTED review of
    2026-08-20T01:37Z on PR #8897, plus two of its four non-blocking suggestions.

    BLOCKING FIX (evidence_source mislabel, plus an unsupported node claim).
    The pathophysiology node "Cellular Oxidative Stress and RNA Oxidation" carried two evidence
    items from PMID:31345061, both tagged HUMAN_CLINICAL:

    (a) the "Compatible with taurine's indispensability ... mice develop multisystemic
    dysfunctions (hearing loss; liver fibrosis; and behavioral, heart, and skeletal muscle
    abnormalities) later on." sentence, whose main clause is explicitly about mice. Tagging it
    HUMAN_CLINICAL contradicted this entry's own notes register, which declares hearing loss,
    liver fibrosis and the behavioural phenotypes as deliberately NOT curated as human findings.
    Retagged MODEL_ORGANISM - the same abstract is already handled that way in the
    HUMAN_MODEL_MISMATCH discussion - and the explanation now states why.

    (b) the five-word snippet "Extraocular dysfunctions were not yet detected", which truncated
    before the clause carrying the actual finding, leaving the node's load-bearing claim
    (increased urinary 8-oxo-7,8-dihydroguanosine, literally the node name) with no supporting
    snippet. Replaced with the full human sentence already used verbatim elsewhere in this file,
    retaining HUMAN_CLINICAL.

    Net effect on the node: one HUMAN_CLINICAL item that now actually states the human
    RNA-oxidation measurement, and one MODEL_ORGANISM item for the murine framing. No
    pathophysiology node, causal edge, phenotype or treatment was added or removed.

    SUGGESTIONS ACCEPTED (notes only, no content change).
    Suggestion 1: added a do-not-re-add note recording why the deep-research artifact's finer
    retinal descriptors (macular atrophy HP:0007401, clumped pigmentary degeneration, nyctalopia
    HP:0000662, strabismus, colour-vision defect) are omitted. Verified against
    research/Taurine_Transporter_Deficiency-deep-research-falcon.md: the artifact reports them as
    individual-patient findings or in an unquantified symptom list, so no frequency band could be
    honestly justified, and all are subsumed by the curated HP:0000510 / HP:0000546 pair.

    Suggestion 3: added a note recording that taurine's calcium-handling and
    proteostasis/apoptosis roles are not modeled as pathophysiology nodes. Verified in the same
    artifact that calcium handling is cited only to the preprints.org preprint
    (doi:10.20944/preprints202510.1439.v1) and proteostasis only to a review
    (baliou2020significanceoftaurine); neither measures them in SLC6A6-deficient human tissue.

    SUGGESTIONS NOT ACTIONED, with reasons.
    Suggestion 2 (break p.Ala294Thr out as a third variants entry) and suggestion 4 (model OCT and
    fundus autofluorescence in diagnosis) both require new evidence items with fetched references
    and verified snippets. They are additive scope beyond the blocking finding and are left for a
    follow-up touch rather than bundled into a review-fix round.


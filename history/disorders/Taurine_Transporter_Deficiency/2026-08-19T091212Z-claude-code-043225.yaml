  details: |
    New kb/disorders entry for IEMbase WP-004 row 1.11.13.01, SLC6A6-related taurine
    transporter deficiency, anchored to MONDO:0007777 (RO:0004003 HGNC:11052,
    xref OMIM:145350). Identity was checked against MONDO before curation; the
    IEMbase seed row cites OMIM 186854, which is the SLC6A6 gene entry rather than
    the disease entry.

    Content: ten pathophysiology nodes debundled from the SLC6A6 transport lesion
    through systemic hypotaurinemia to the retinal, cardiac and skeletal-muscle
    arms; three nodes conform to photoreceptor_degeneration and one to
    cardiomyopathy_maladaptive_remodeling. Two mechanistic_hypotheses - a CANONICAL
    osmolyte/cytoprotection model, and an EMERGING mitochondrial taurine
    import/translation model whose only evidence is IN_VITRO cancer-cell work.
    Three discussions: a KNOWLEDGE_GAP on the discordant cardiac penetrance between
    pedigrees, a HUMAN_MODEL_MISMATCH on the murine multisystem phenotype that has
    no human counterpart, and a KNOWLEDGE_GAP on the unvalidated mitochondrial arm.
    Nine phenotypes, one biochemical marker, four diagnosis entries, the oral
    taurine supplementation treatment with a RESTORES target_mechanisms link, and
    two annotated animal models with per-node readouts.

    Eight PMIDs were fetched with `just fetch-reference`; no reference cache file
    was hand-written or hand-edited.


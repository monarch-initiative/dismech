  summary: 'Review response: Persistent Truncus Arteriosus'
  details: |
    Review-response session on PR 8274. Addressed both blocking findings from the
    ai4c-reviewer review.

    Evidence padding, the first and sharper finding. Twenty-five evidence items whose
    snippets were methods, objective, or prevalence sentences have been removed. The
    clearest case was the sentence "TA accounts for 4 percent of all critical
    congenital heart diseases", a prevalence statement used eight times to support
    cyanosis, pulmonary vascular obstructive disease, coronary anomaly, and fetal
    progression; it now appears once, in the prevalence record where it belongs.
    Several of the removed items carried explanations that had conceded the mismatch
    in writing, which should have been the signal to drop the citation rather than to
    hedge it with PARTIAL.

    Where a real source exists it was substituted rather than dropped. The coronary
    ostial anomaly node and phenotype now cite a thirty-heart autopsy series,
    including a counted thirty-two percent figure that grounds the FREQUENT band in a
    denominator rather than a review estimate. Truncal valve morphology cites the
    same series. Where no source exists the description is kept and the evidence
    block omitted, per the evidence SOP; the affected items are listed explicitly in
    the entry notes so the absence is visible rather than merely missing. Compliance
    falls from 95.2 to 82.7 percent as a direct result, which is the correct trade.

    Research under-consumption, the second finding. Added environmental for maternal
    pregestational diabetes, the one modifiable risk factor for this malformation.
    Added experimental_models for the Splotch mutant mouse and the Tbx1 conditional
    null with beta-catenin dosage rescue. Added inheritance distinguishing the
    dominant 22q11.2 route from the recessive TMEM260 and NKX2-6 routes, which give
    opposite recurrence counselling. Set classifications to CARDIOVASCULAR.

    Five references fetched and verified: PMID 837493 the coronary origin autopsy
    series, PMID 32198970 the second biallelic NKX2-6 report, PMID 2619088 the
    Splotch mouse, PMID 28346476 the Tbx1 conditional null with rescue, PMID 31454511
    the National Birth Defects Prevention Study analysis of maternal diabetes.

    The NKX2-6 mouse and human discrepancy discussion was strengthened with the
    replication, which also supplies the fact that NKX2-6 is a downstream target of
    TBX1 and therefore places the recessive and dominant routes on one pathway.

    Not done: the truncal valve stenosis, right aortic arch, and coarctation
    phenotypes. Their frequencies come from the deep-research narrative and no cached
    source states them in a quotable sentence, so adding them would reintroduce the
    problem this session fixed.

    Validation: schema, ontology terms, and references all pass. Snippets checked 70
    of 70 verified against cached references.

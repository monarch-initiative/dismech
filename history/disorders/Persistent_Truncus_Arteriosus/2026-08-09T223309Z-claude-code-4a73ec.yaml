  summary: 'Create: Persistent Truncus Arteriosus'
  details: |
    New disorder entry for persistent truncus arteriosus, MONDO:0018072, curated from
    a claude_code deep-research report treated as leads only.

    Content: 11 pathophysiology nodes running from cardiac neural crest and second
    heart field program disruption through failure of aorticopulmonary septation to
    the single arterial trunk, then splitting into the obligatory mixing arm, the
    unobstructed pulmonary flow arm ending in fixed pulmonary vascular obstructive
    disease, the truncal valve arm, and the coronary anomaly arm. Also 12 phenotypes,
    4 progression phases, 4 diagnostic modalities, 4 treatments, 5 genes, 2 prevalence
    records, 3 differential diagnoses, clinical burden, and 4 discussions. One node
    declares conformance to pulmonary_vascular_remodeling at the obstructive
    remodelling node only.

    Discussions: the deletion-positive survival paradox CONTROVERSY, the NKX2-6 mouse
    and human discrepancy HUMAN_MODEL_MISMATCH, population-specific genetic
    architecture OPEN_QUESTION, and the genetically unexplained majority
    KNOWLEDGE_GAP. Each carries a proposed experiment with an explicit decision
    criterion.

    Deliberate curation decisions: NOTCH1 is curated relationship_type UNKNOWN because
    the source itself hedges the variant classification; the extracorporeal membrane
    oxygenation mortality association is recorded as directionally uninterpretable
    because of confounding by indication; anatomic subtypes are not curated as
    has_subtypes because the mechanism is shared across them; truncal valve
    regurgitation is bound to HP:0001659 aortic regurgitation with the looser binding
    stated explicitly.

    Provider error correction: five provider-suggested identifiers were verified
    against OAK and found to point at unrelated concepts, HP:0001719 double outlet
    right ventricle rather than truncus arteriosus, CL:0002350 endocardial cell rather
    than cardiac neural crest cell, UBERON:0004151 cardiac chamber rather than outflow
    tract, hgnc:2673 DAP3 rather than NKX2-6, and hgnc:26160 THNSL1 rather than
    TMEM260. All corrected before curation and recorded in the entry notes. The report
    itself correctly warned against curating OMIM 226000 against this entity.

    Validation: just validate passed on schema, ontology terms, and references.
    Snippets checked 76/76 verified against cached references. just validate-disorders
    passed in a batched run over this and two sibling entries, 258/258 snippets.
    Compliance 95.2 percent global, 95.7 percent weighted.

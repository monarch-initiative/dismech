  summary: Backfill infectious_agent and transmission (#10115, R25)
  details: |
    Added three genus-level NCBITaxon-bound infectious_agent records (Streptococcus NCBITaxon:1301; Staphylococcus NCBITaxon:1279; Bacteroides NCBITaxon:816) and two transmission records (contiguous spread from an odontogenic focus; non-odontogenic portals into the floor of the mouth). Genus level is what the sources support: the 63-case culture series PMID:36738888 reports 'Streptococci contributed 71.26% of the cultured bacteria' without resolving species, and PMID:39296495 names staphylococcus, streptococcus and Bacteroides. Fusobacterium and Peptostreptococcus, which the entry description names, are deliberately NOT bound: a real PubMed search for Ludwig's-angina-specific microbiology naming those genera returned only pre-1990 papers with nothing quotable, so no evidence item could be written for them, and the Bacteroides description records that. Transmission evidence PMID:36738888 (87.3% odontogenic aetiology) and PMID:38106765. No new reference caches needed - every citation was already cited by the entry. just validate clean (59/59 snippets, 69 titles) after correcting one reference_title read off references_cache/PMID_38106765.md rather than written from memory. No other section touched.

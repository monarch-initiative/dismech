  details: |
    Created the White-Sutton syndrome entry (intellectual disability-microcephaly-strabismus-behavioral abnormalities syndrome; MONDO:0014606; OMIM 616364; POGZ) for issue #7216. Deep research provider falcon/Edison. NEC preflight passed - the MONDO definition names POGZ and the OMIM:616364 xref matches. Scope was policed away from generic autism and chromatin-gene exome-discovery literature in which POGZ appears only as one candidate among many, and away from the unrelated POGZ DNA-repair and cancer literature; that decision is documented in notes. GeneReviews chapter PMID:34529370 fetched and tagged, with all four abstract sections mined. Curated 5 pathophysiology nodes including two parallel and partly contradictory mouse-derived arms (cortical excitability and cerebellar Purkinje cell dysfunction), 21 phenotypes with HPO terms, two structured prevalence records, genetics including the NMD-escape severity gradient, diagnosis, 5 treatments, 2 animal models and a HUMAN_MODEL_MISMATCH discussion on whether the mouse excitability reversal translates. No conforms_to declared - epilepsy_excitation_inhibition_imbalance was evaluated and declined because the mouse excitability finding concerns social behaviour rather than a curated seizure-generation chain. Validation: just validate PASS, just validate-terms PASS, programmatic snippet check 73 of 73 exact whitespace-normalised substrings with 0 mismatches, 0 dangling refs and 0 orphan nodes.

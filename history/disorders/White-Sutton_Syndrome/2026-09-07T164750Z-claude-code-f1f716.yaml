  summary: 'Phenotype review: White-Sutton_Syndrome'
  details: |
    Full phenotype review of all 27 phenotypes against cached sources (three questions: snippet-claim consistency, HPO term optimality, pathograph explanation). Snippet audit: all pre-existing snippets verified as exact substrings and consistent with whole-paper context; all cited papers are WHSUS/POGZ-specific (no Named Entity Confusion). Fixes: seizure onset_category INFANTILE->CHILDHOOD (source range 1-4y corresponds to HP:0011463, not HP:0003593); hypotonia gained the 17/17 (100%) quantitative evidence item from the Batzir cohort full text; Structural Brain Malformation and its mirror imaging finding raised OCCASIONAL->FREQUENT on the 10/15 (67%) abnormal head-imaging numerator; two stale 'partial support' explanation phrasings reworded (supports enum no longer has PARTIAL). Pathograph: added 8 evidenced/summary causal edges - Global Developmental Delay, Speech and Language Delay, Motor Delay, Hypotonia, Behavioral Problems and Gait Abnormality (with cohort evidence attributing gait to spasticity/hypotonia/discoordination) from Impaired Cortical Neuronal Development; Sleep Disturbance from Disrupted POGZ-Dependent Transcriptional Regulation (COMPUTATIONAL circadian-pathway-enrichment evidence, PMID:38350721, directness INDIRECT); Gastrointestinal Involvement from Pathogenic POGZ Variant Dysfunction (cohort authors' explicit POGZ-intestinal-pathogenesis suggestion, directness INDIRECT); Microcephaly from Premature Cell-Cycle Exit in Cortical Progenitors (mouse small-brain correspondence quote, MODEL_ORGANISM, INDIRECT). Connectivity 5/27 -> 13/27. The 14 remaining unexplained phenotypes (sensory, OSA, GI sub-symptoms, weight, GU, craniofacial, CHD) were deliberately NOT wired - no organ-specific mechanism is demonstrated (CHD review states POGZ role in cardiac development is functionally unverified) - and are recorded in a new KNOWLEDGE_GAP discussion (whsus_extraneural_phenotype_mechanisms) with evidence and a proposed organ-specific Pogz requirement-mapping experiment. All gates pass: validate, 112/112 snippets, validate-terms, duplicate-keys, entity-refs, snippet-length, title-snippets, folded-hyphens, validate-disorders.

  summary: 'Review round 2: connect the retinal node, correct a REFUTE grading, correct
    a false negative'
  details: |
    Addresses the second REQUEST_CHANGES review of a4b0f498 (run 35171038093). All three IMPORTANT items were defects introduced by my own round-1 commit.

    Finding 1: the retinal node I added in round 1 had no incoming edge, so the pathograph was two components and the renderer would have drawn the retinal branch as a separate island whose root reads as a primary lesion. That is a stronger claim than the node's own description makes, since the description names the upstream respiratory-chain lesion and then did not draw it. Added incoming edges from both Respiratory Chain Electron Transfer Failure and Loss of Membrane Antioxidant Capacity with INDIRECT_UNKNOWN_INTERMEDIATES, matching how the podocyte and neuronal branches are wired and matching the node's own outgoing edges. Note check-causal-targets cannot see this class of defect: it asks whether a declared target resolves, and an absent edge is not a broken one.

    Finding 2: the serum-CoQ10 evidence item was graded REFUTE on a record it agrees with. The record asserts two things, that tissue CoQ10 is the diagnostic measurement and that serum is not a substitute for it, and the quoted sentence supports both. Exported as REFUTE it would have read as the paper refuting muscle CoQ10 as a marker of COQ2 deficiency, which is false. Now SUPPORT, with the explanation rewritten to say what the sentence establishes.

    Finding 3: the sensorineural hearing impairment description asserted that no COQ2-specific audiological measurement was located. The same round-1 commit refetched PMID:42410653 from abstract_only to full_text_xml, and that full text reports bilateral elevated ABR wave V thresholds in a patient with two confirmed COQ2 variants. The sentence became false inside the commit that fetched the contradicting bytes. The measurement is now curated as a second evidence item, graded INDIRECT because the authors call it possible mild hearing loss for follow-up rather than a diagnosis and because an elevated ABR threshold does not by itself separate sensorineural from conductive loss. The description now says no confirmed sensorineural loss has been documented and explains what the binding rests on.

    Suggestions taken:
    - 5: bound the two empty descriptor slots. biomarker_term to NCIT:C147321 Ubiquinone 10 Measurement, which is the measurement term for coenzyme Q10 since ubiquinone-10 is coenzyme Q10; diagnosis_term to NCIT:C101295 Whole Exome Sequencing. Both were resolved by OAK search against OLS and checked for membership in the treatmentactionterm enum cache before use, not recalled. NCIT:C101293, the example in CLAUDE.md's hallucination table, is indeed Next Generation Sequencing and was not used.
    - 6: rebound the cardiac phenotype from HP:0001639 Hypertrophic cardiomyopathy to HP:0001638 Cardiomyopathy. The only gene-specific measurement is left ventricular dilation, which is not hypertrophy, so the broader term carries the claim the evidence supports and the detail moved to preferred_term.
    - 7: added CL:0000740 retinal ganglion cell beside the photoreceptor cell type, covering the optic-nerve half of the node's own name.

    Suggestion 4 declined, with the reason recorded in notes. Wiring the cardiac and muscle phenotypes to Respiratory Chain Electron Transfer Failure is an argument from the general physiology of mitochondrial disease rather than a claim any located source makes about COQ2. The retinal node is wired because a COQ2-specific ophthalmological workup exists and the gene-specificity of retinopathy is stated in the literature; for heart and muscle there is only one echocardiographic finding and one muscle histology in a single neonate.

    Validation: just validate passed with 61/61 snippets verified, up from 60/60. One new cache row, NCIT:C147321. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-genereviews (TAGGED), check-term-cache-integrity, check-snippet-length, check-title-snippets and check-snippet-grading all OK.

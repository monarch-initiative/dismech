  summary: 'Review round 1: add ocular, cardiac, muscle and hearing phenotypes, diagnosis
    and biochemical sections'
  details: |
    Addresses the REQUEST_CHANGES review of 6524438b (run 35152527647).

    Blocking finding: the entry had no ocular phenotypes although this PR had already cached PMID:36420660, and retinopathy in primary CoQ10 deficiency is reported only with COQ2 variants, making it the most gene-discriminating feature of the entry. Added a Retinal and Optic Nerve Bioenergetic Failure pathophysiology node (photoreceptor cell CL:0000210, retina UBERON:0000966) feeding two new phenotypes.

    Two of the CURIEs the review suggested were wrong and were not used. HP:0000510 is Rod-cone dystrophy, which is the opposite pattern to the cone-greater-than-rod dysfunction the paper reports on electroretinography; the correct term is HP:0000548 Cone/cone-rod dystrophy. HP:0003560 is Muscular dystrophy rather than myopathy, a more specific claim than muscle weakness; used HP:0001324 Muscle weakness. UBERON:0001476 has no row in the committed cache and was not used. Every CURIE written here was read from cache/hp, cache/cl, cache/uberon or cache/go at the moment of writing.

    Also from the review:
    - Cardiac involvement, muscle weakness and sensorineural hearing impairment added. Each carries the disease-group background sentence, and the first two additionally carry gene-specific findings from PMID:25564041, a COQ2 neonate with left ventricular dilation on echocardiography and lipid accumulation on muscle histology.
    - New biochemical section for muscle CoQ10, carrying a REFUTE item on serum CoQ10 as a diagnostic measure. That negative is clinically load-bearing and the authors' own patient had a normal serum value.
    - New diagnosis section for exome or genome sequencing, including the panel-negative then exome-positive sequence.
    - Three of the seven cached-but-uncited references are now cited: PMID:36420660, PMID:25564041, PMID:23343605, PMID:42410653. PMID:23343605 supplies the sharpest evidence for the organ-selectivity knowledge gap, a COQ2 patient with fatal infantile multisystem disease and no renal involvement at all, in a disease whose hallmark is nephrotic syndrome. It is attached as evidence on that discussion rather than described in prose.

    GeneReviews: deliberately left unquoted, with the reason now stated in notes. The cached record is a purpose statement, a table of contents, with no clinical finding in it. The only quotable sentence announces what the chapter covers rather than what is true of the disease, so quoting it would put a non-propositional snippet behind a treatment claim two primary sources already support.

    The bare-identifier suggestion did not work as proposed. Rewriting PMID:20301317 as NBK1138 moved the check-genereviews false positive rather than removing it: the checker matches chapter identifiers in either form anywhere in the file, including in a sentence explaining that the chapter is not cited. The chapter is now named by title only and the checker reports TAGGED.

    Validation: just validate passed with 60/60 snippets verified, up from 43/43. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-genereviews, check-snippet-length, check-title-snippets and check-snippet-grading all OK.

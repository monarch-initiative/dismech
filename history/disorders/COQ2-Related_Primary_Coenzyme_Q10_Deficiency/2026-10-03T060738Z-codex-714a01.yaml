  summary: Review COQ2 deficiency against full clinical and mechanistic sources
  details: |
    Reviewed the complete pre-existing entry against its COQ2 Perplexity research report and citation inventory, available cached references, and newly retrieved primary and GeneReviews full texts. The entry had no previous REVIEW event. Infectious and environmental causes are outside this Mendelian entry's scope.

    Corrected blanket claims that CoQ10 never improves neurological disease, that retinopathy is exclusive to COQ2, that confirmed COQ2 hearing loss has not been described, and that renal involvement invariably comes first. Replaced unsupported disease-wide frequency bands with informative denominators from the COQ2 subgroup of the renal-enriched cohort. Distinguished the 251-person mixed-treatment cohort from untreated natural history and pooled treatment associations from the nonsignificant COQ2-only matched survival comparison. Added hypertension, edema, myopathy, liver dysfunction, FSGS and adult rod-cone dystrophy. Bound hypertrophic cardiomyopathy to its specific HPO term using the gene-specific neonatal report.

    Rebuilt the graph around the specific COQ2 enzymatic activity, CoQ biosynthesis, respiratory impairment, filtration-barrier injury and separate retinal/optic-nerve degeneration. Added provisional oxidative-stress, pyrimidine-synthesis and cerebral/glial mechanisms with their actual cell or animal evidence types. Unknown human intermediates remain explicit. Corrected the homozygous-only genetic context, added source-specific variant names and separated uncertain alleles from established pathogenicity. The 2026 Yue report's detailed results contain a VUS and residual proteinuria despite stronger abstract language; the entry preserves those limitations.

    Expanded treatment, biochemical diagnosis, surveillance and genetic counseling from the full GeneReviews chapter. Kept 4-HBA as an uncontrolled compassionate-use observation with six-month safety and nine-month ongoing-treatment statements, corrected cointervention sequencing, and distinguished prenatal mouse prevention from symptomatic human treatment. Added named ACE inhibitor use and transplant outcomes. Repaired model readout directions and the mouse/human homologous allele description. Removed a proposed experiment that the full Brain paper had already performed. Removed the prior process diary from the disease notes.

    Research-completeness assessment: phenotypes adequate across central organ systems, with cohort ascertainment and composite findings preserved; subtypes adequate as overlapping presentations without unjustified molecular splitting; pathophysiology adequate with gene-specific experimental mechanisms and qualified clinical links; treatments/trials adequate, including CoQ10, experimental 4-HBA, ACE inhibitors, renal replacement and supportive care, with no registration identifier invented; genetics adequate for allelic configurations, source nomenclature and prognostic uncertainty; biomarkers/diagnostics adequate for molecular confirmation, tissue-test limitations and surveillance; references adequate after full-text recovery and exact-quote/title checks; overall central report themes consumed, while generic speculative pathways and findings from other CoQ genes were not transferred.

    Source consumption: fully read the clinical GeneReviews chapter and the cached scientific bodies of PMID:40929079, PMID:36420660, PMID:42410653 and PMID:17332895. Recovered and read both Drovandi 2022 full papers through the DiRROS institutional repository (PMID:35483523 and PMID:35643375), including gene-specific outcome tables. URL caches retain the generator's URL title fallback; reference findings identify each publication and DOI. The original PMID:25564041 cache is marked full_text_html but contains the abstract and bibliography rather than the complete scientific article; its claims are limited to the available text. Other original and added primary abstracts were read. Additional PMC and EuropePMC routes returned challenge pages or errors; the 2016 genotype paper's publisher routes failed and its institutional copy is restricted. These retrieval limits are retained rather than claiming unavailable full texts were reviewed. All reference cache files were generated through the repository fetcher.

    GeneReviews baseline is tagged and mined for clinical manifestations, diagnosis, management, surveillance, recurrence risks and prenatal/preimplantation testing. No separate COQ2-specific chapter is asserted. Validation results and the independent PR verdict are recorded in the PR thread; this REVIEW event records the curation performed before independent review.

  details: |
    Response to the automated review on PR #9228. Every finding was verified against the cached full texts before acting; all of them held.

    The critical correction. The entry asserted that no unrelated family had been reported since the 2019 discovery paper. That is contradicted by PMID:40936361, which the entry itself cites for its mechanism: its limitations paragraph reports an unrelated child with a pathogenic TOM1 variant (Baxter et al. 2022). The claim had propagated into the description, the notes, the genetic association text and the gap_single_family_causality discussion. Located and fetched the second paper (PMID:33864888, J Allergy Clin Immunol) and confirmed at first hand that patient S15 carries a heterozygous TOM1 splice variant producing a stable product lacking the vesicular trafficking domain, in a cohort of FOXP3-negative IPEX-like disease. Rewrote all four sites around the distinction the sources actually support: the gene now has two unrelated families, while p.Gly307Asp itself is still reported in one. Both papers are cited as evidence on the discussion.

    This is the fifth instance in this batch of one defect class - a false assertion in free text where no gate can see it - and the first where the contradicting sentence was in a paper the entry already cited. Filed as issue #9226.

    Mechanism corrections. GO:0032266 (phosphatidylinositol-3-phosphate binding) was annotated on the TOM1 variant node, attributing to TOM1 a binding that PMID:40936361 explicitly shows it does not have: neither TOM1 nor TOM1 G307D binds PtdIns3P-containing liposomes. The binding is TOLLIP's, and TOM1's role is to restrain it. Split the trigger node into 'TOM1 GAT-Domain Variant' and 'Loss of TOM1 Restraint on TOLLIP Phosphoinositide Binding', moved the molecular function to the latter with modifier INCREASED (TOLLIP remains committed to membrane PtdIns3P rather than being released), and curated the negative-control quote so the attribution is fixed in evidence rather than in prose. Added the reduced TOM1 G307D-myosin VI interaction as a second, TOLLIP-independent edge from the variant to the fusion-failure node.

    Treatments. Added mTOR inhibitor therapy, documented as harmful in both papers and previously absent: everolimus was given on the 2019 model of the disease (a defect in autophagosome formation) and caused flares of eczema and respiratory distress that settled on dechallenge, with rapamycin failing to raise autophagosome numbers in patient lymphocytes in vitro. The 2025 relocation of the defect to autophagosome-lysosome fusion explains why. Wired to the central effector with treatment_effect: MODULATES - deliberately not ACTIVATES or RESTORES, since the drug acts upstream of the fusion block and the observed effect at that node was aggravation. Added the author-proposed IL-1 antagonism / JAK inhibition option with supports: PARTIAL and an explicit statement that no patient has received either. Added immunoglobulin replacement as supportive care with no target_mechanisms.

    Transplant. Reframed gap_why_hsct_failed. The 2025 authors do advance the tissue-autonomous explanation - impaired innate-immunity regulation in fibroblasts driving a vicious circle with the replaced immune cells - at hypothesis strength, so the gap now states it as theirs with the quotes attached rather than saying nothing establishes it. Added allograft rejection as a competing explanation: the 2019 paper records that the patient rejected the graft within six months and the disease returned, which is documented rather than inferred and accounts for relapse on its own. The two sources also give different intervals to death (one year in 2019, six months post-HSCT in 2025); the entry now quotes both and names the discrepancy instead of asserting six months in four places.

    Phenotypes. Added eight, all quotable from text already cached: autoimmune enteropathy, chronic diarrhea, lymphocytic interstitial pneumonitis, persistent EBV viremia, and four Cellular phenotypes (reduced NK count, decreased dendritic cell count, decreased class-switched memory B cells, impaired regulatory T cell function). Each is wired to the arm that produces it. Three are deliberately left unbound and say why: HPO has no autoimmune enteropathy term, and its class-switched memory B cell and regulatory T cell terms code proportion where the source reports counts and suppressive function respectively. Binding a proportion term to a count claim would assert a measurement that was not made - the same error as the HP:0034323 binding removed from the growth hormone entry earlier in this batch. Dendritic cell count uses the parent term HP:0020178 with modifier DECREASED, since HPO has no directional child.

    Also added a negative result to the trafficking node: CTLA4, IL-1 receptor and IL-6 receptor expression were tested in patient lymphocytes and were normal, which is what leaves the defect at the level of degradative flux rather than receptor display.

    Deep research. The review noted no deep-research artifact. Ran the claude_code provider (8 web searches, 13 turns, 209s). Its own reference validation reports 6/6 identifiers resolved, zero unresolved, zero off topic. It is corroborative rather than additive - same causal chain, same treatment history, and it independently records the graft rejection and the one-year interval. It did not surface the second family, and it cited only three PMIDs, two already curated. Its one useful contribution was the CTLA4/IL-1R/IL-6R negative result. Recorded in notes at that strength.

    Validation after the changes: just validate passed with 51/51 snippets verified against cached references; just validate-terms passed; check-duplicate-keys OK; the folded-hyphen, snippet-length, title-snippet and environmental-evidence gates were run over the whole KB. Pathograph verified programmatically as one connected component over 6 pathophysiology nodes, 14 phenotypes and 21 edges, with no dangling downstream, target_mechanisms or attaches_to references, and cited references reconciling with the references block in both directions.

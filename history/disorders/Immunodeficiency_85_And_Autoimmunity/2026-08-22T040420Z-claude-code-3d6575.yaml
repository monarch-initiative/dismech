  summary: 'Create: Immunodeficiency 85 and Autoimmunity'
  details: |
    New entry for the OMIM 619510 / MONDO:0030428 entity, an inborn error of immunity caused by heterozygous TOM1 p.Gly307Asp.

    MONDO records no causal gene for this term and carries no definition, so the gene was established from literature rather than from the ontology: PMID:31263572 is the discovery paper and PMID:40936361 the 2025 mechanistic follow-up on the same variant. Both are full text in the cache.

    The organising claim is that one lesion produces immunodeficiency and autoimmunity together. TOM1 is not an immune-pathway gene - it is an endosomal adaptor that routes ubiquitinated cargo to lysosomal degradation and helps autophagosomes fuse with lysosomes. The entry curates a single central effector (autophagosome-lysosome fusion failure, measured directly in patient cells) with two downstream arms: excessive inflammatory pathway activation on the autoimmune side, and impaired lymphocyte effector function and antibody production on the immunodeficiency side. That single-effector structure is a claim and the entry says so; the edge to the immunodeficiency arm is INDIRECT_UNKNOWN_INTERMEDIATES because the connecting steps are not demonstrated, which is the least understood part of the disease.

    Five pathophysiology nodes and six phenotypes, joined by ten downstream edges into one connected component. Every phenotype is attached to the arm that produces it rather than left as an orphan - the autoimmune manifestations hang off the inflammatory node, the infectious and humoral ones off the effector-function node. This was done at first draft rather than after review, applying the finding raised on PR #9211 in the previous batch.

    The evidence base is one family, and the entry is built so that limitation travels with the claims rather than sitting only in notes. The discovery paper's own sentence saying unrelated cases are needed before causality is firm is curated as a PARTIAL evidence item on the gene entry itself, and a KNOWLEDGE_GAP separates what the functional work does establish (the variant has a specific reproducible molecular effect) from what it does not (that this effect is this disease, given a mother and son share far more than one variant).

    The treatment is curated as a failure. Haematopoietic stem cell transplantation was attempted in the severely affected patient after immunomodulation failed; he died six months later of lung fibrosis. It carries supports: REFUTE, which is a statement about this disease and not about HSCT in inborn errors of immunity generally. A second KNOWLEDGE_GAP asks why it failed and deliberately declines to answer: TOM1 is ubiquitous, the signalling deficit was demonstrated in fibroblasts (a lineage transplant does not replace), and the fatal organ was affected before transplant - but post-transplant fibrosis is a recognised complication in its own right, one patient is not a series, and nothing cited shows the lung disease is cell-autonomous.

    No GeneReviews chapter exists. The All Fields search returned chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase deficiency and AIP familial isolated pituitary adenomas - none of them this disease. That false-positive pattern is recorded in notes rather than the absence simply asserted.

    Validation: just validate clean; just validate-terms clean; 24/24 evidence snippets verified against the local reference cache on the first run; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-cache-order all clean. Pathograph verified as one connected component with no dangling downstream targets, and all four discussion attaches_to references resolve.

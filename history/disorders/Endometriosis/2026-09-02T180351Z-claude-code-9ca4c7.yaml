  summary: Integrate assessed OpenScientist neuroimmune pain findings
  details: |
    Integrated the RETAINED and QUALIFIED claims from the assessment of kb/hypotheses/Endometriosis/neuroimmune_pain_sensitization_model/openscientist.md (sidecar: assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict PARTIALLY_SUPPORTED). Added: PMID:16950827 primary human histology (SP/CGRP fibre density, perilesional NGF/NGFRp75) to Lesion-Peritoneal Neuroangiogenesis, which previously rested only on two reviews; PMID:25029427 as two items (HUMAN_CLINICAL peritoneal TRPV1/TRPA1/SCN11A upregulation; IN_VITRO estradiol induction of TRPV1 in sensory neurons) and PMID:39969583 as two items (MODEL_ORGANISM IL-33/ST2 macrophage hyperalgesia; IN_VITRO TNF-alpha via TNFR1/p38 MAPK raising neuronal TRPV1) to Peripheral Nociceptor Sensitization, plus a description refresh and two new intermediate_mechanisms on the Chronic Inflammation edge into that node; PMID:26456676 insula Glx and connectivity to Central Sensitization and Nociplastic Pain, with the caveat that the same study found no difference in endometriosis without pain and its authors read the change as pain-linked rather than disease-linked; PMID:36914876 (two items: NGF among pain-perception genes at GWAS loci; genetic correlation with 11 pain conditions) and PMID:41338448 (rASRM stage-independent pain intensity, with the qualifier that chronic pelvic pain frequency does rise with stage) to the mechanistic_hypotheses entry, whose notes now record the assessment. Added discussion gap_endometriosis_neuroimmune_circuit_subtype_scope (KNOWLEDGE_GAP) carrying the immune-hot versus immune-cold subtype tension (PMID:42010552) against nociplastic pain features in ovarian endometriosis (PMID:41890200), with a within-patient subtype-matched profiling experiment. Deliberately not integrated: the report's inference that the circuit is restricted to peritoneal and deep infiltrating disease (its source has no neural readout, so this is the gap above rather than a scope limit); the spinal microglial M1 mouse mechanism (PMID:41791308), which would extend the human-anchored central node past its evidence; the anti-NGF trial absence, an absence claim resting on PubMed searches when a registry sweep would be required; and the asymptomatic-prevalence argument (PMID:28526518), where the report's word confirms overstates an indirect cross-sectional series. Status left EMERGING. Checks: count-verified-snippets 70/73 (3 skipped by prefix, 0 failures), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens all OK.

  summary: Add 2026 GBMI multiancestry GWAS (PMID:43064779)
  details: |
    Added a polygenic inheritance block (HP:0010982) citing the abstract of the 2026 Global Biobank Meta-analysis Initiative endometriosis GWAS (PMID:43064779): 58 associated regions, 27 previously unreported, with loci unique to African and admixed American ancestry. Only the abstract of that paper is cached, so gene-level and heritability results read from the full text are recorded in entry-level notes and the GREB1 notes without evidence items. Gave the VEZT and GREB1 rows their first evidence item, reusing the sentence of the 2023 GWAS meta-analysis (PMID:36914876) already quoted for WNT4. Validated with just validate, count-verified-snippets (78/78) and validate-terms.

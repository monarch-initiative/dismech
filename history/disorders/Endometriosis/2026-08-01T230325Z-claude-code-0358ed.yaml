  details: |
    PR #7476 blocking-review fix (item 2).

    Two PMID:37844487 evidence items added by this PR were tagged evidence_source: OTHER because
    the publication is a review. Publication format is not the discriminator; evidence_source
    classifies the kind of evidence the paper reports. The quoted sentence ("It affects around
    6-10% of reproductive-age women in the world and causes debilitating pain, heavy menstrual
    bleeding, pain during penetrative sex, and infertility") is human epidemiological and
    clinical observation, so both items (the worldwide prevalence record and the Infertility
    phenotype item quoting the same sentence) are retagged HUMAN_CLINICAL. The pre-existing
    PMID:37844487 item about the four-stage classification was not touched.


  summary: Add gene rows from the 2026 GBMI GWAS (PMID:43064779)
  details: |
    Added fifteen risk-factor gene rows from the 2026 Global Biobank Meta-analysis Initiative endometriosis GWAS: ESR1, SYNE1, FSHR, VCL, KDR, RHOD, TIMD4, EEFSEC, ADK, BSCL2, CHD6, TCF19, AP3M1, KCTD13 and TCEA2. Neither the paper's abstract nor its preprint's names a gene, so each row carries the finding in notes, attributed to the full text, with no evidence item from that paper. ESR1 and SYNE1 take an evidence item from the 2023 GWAS meta-analysis (PMID:36914876), which names the ESR1/SYNE1 locus. HGNC identifiers were read from the HGNC REST service and checked by validate-terms; seven new rows were added to cache/hgnc/terms.csv by validation. Validated with just validate, count-verified-snippets (80/80), validate-terms and the offline gates.

  summary: Cite evidence for 4 bare exposures (#8296 tranche 12)
  details: |
    Added PMID-cited, snippet-verified evidence to the four previously evidence-free environmental exposures (Early Menarche, Short Menstrual Cycles, Nulliparity, Low BMI), all supported by a single epidemiologic review (PMID:30017581) whose summary sentence names early age at menarche, short menstrual cycle length, and lean body size as characteristics robustly associated with greater endometriosis risk, and greater parity as associated with lower risk (the inverse of nulliparity). Part of the #8296 evidence-free-exposures backfill campaign, tranche 12.

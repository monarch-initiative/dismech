  summary: 'Review: Endometriosis - claim-evidence audit and fixes'
  details: |
    Manual (non-tool-assisted) claim-evidence review as part of a 10-entry women's-health sweep.
    Fixed: (1) the Immune Dysfunction node carried supports: NO_EVIDENCE on a PMID:16166933 snippet that in fact directly states increased peritoneal macrophages and decreased T/NK cytotoxicity causing inadequate clearance of ectopic cells - relabelled SUPPORT with a matching explanation; (2) the Infertility phenotype cited a cytokine/lesion-growth snippet that never mentions infertility - downgraded SUPPORT to PARTIAL with an honest explanation and a note that a fertility-outcome citation is still needed; (3) the Painful Bowel Movements phenotype was bound to HP:0002027 Abdominal pain - rebound to HP:6000222 Painful defecation; (4) the Pelvic Pain phenotype was bound to HP:0012532 Chronic pain, losing the anatomical site - rebound to HP:0034267 Pelvic pain with temporality: CHRONIC per the descriptor-qualifier convention; (5) added HGNC gene_term bindings to the four uncurated genetic risk-factor entries (WNT4, VEZT, GREB1, ID4) with notes flagging their missing evidence.
    Not changed: the entry has no prevalence block; the biochemical CA-125/estradiol entries have no evidence.

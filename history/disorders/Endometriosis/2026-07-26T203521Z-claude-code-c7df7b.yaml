  summary: Add Warburg metabolic reprogramming, dichloroacetate and cabergoline threads
  details: |
    Second curation pass extending the owlposting.com-derived enhancement. Added a Warburg-like Metabolic Reprogramming pathophysiology node (TGF-beta1-driven glycolytic switch in peritoneal mesothelium; HIF1A/PDK1/LDHA/SLC2A1 upregulation and lactate secretion) citing Young 2014 JCEM PMID:24796928 and Horne 2019 PNAS DOI:10.1073/pnas.1916144116, with a downstream edge to Hypoxia and Angiogenesis. Added two investigational treatments with target_mechanisms links: Dichloroacetate (PDK inhibitor/PDH activator INHIBITS the Warburg node; Horne 2019 preclinical + EPiC feasibility trial PMID:33712086) and Cabergoline (dopamine D2 agonist INHIBITS the angiogenesis node via VEGFR-2; Novella-Maestre 2009 PMID:19189995). Added a completed Phase II cabergoline clinical trial entry (NCT03928288). All PMIDs/DOI/NCT fetched and verified; snippets are exact substrings; evidence_source split by study type (HUMAN_CLINICAL/IN_VITRO/MODEL_ORGANISM). Schema, reference, and term validation all pass.

  summary: 'Genetics pass: bind FHL2-FHL5 MONDO subtype terms, add subtype genes and
    inheritance, wire all 8 genes and 5 phenotypes into the pathograph'
  details: |
    Genetics pass for series-055 (issue #12262). Bound the four MONDO familial-HLH
    subtype concepts on the existing has_subtypes rows (FHL2 MONDO:0011337 / PRF1,
    FHL3 MONDO:0012146 / UNC13D, FHL4 MONDO:0011336 / STX11, FHL5 MONDO:0013135 /
    STXBP2), and added a genes descriptor plus an inheritance block with a bound HPO
    mode-of-inheritance term to all eight subtype rows. The four syndromic rows
    (Griscelli type 2, Chediak-Higashi, XLP1, XLP2) deliberately received no
    subtype_term: each of those concepts is curated as its own Disease entry
    (Griscelli_Syndrome_Type_2, Chediak-Higashi_Syndrome,
    X-linked_Lymphoproliferative_Disease_Due_To_SH2D1A_Deficiency,
    X-linked_Lymphoproliferative_Disease_Due_To_XIAP_Deficiency), so binding the term
    here would make a second primary claim on it.

    Wired the pathograph. Before this pass the three pathophysiology nodes carried no
    genes descriptors and no downstream edges at all, so every gene and every
    phenotype was disconnected (gene_mechanism_wiring_coverage 0/8,
    causal_inlink_coverage 0/11). Added genes descriptors to the existing nodes (PRF1
    on Impaired Lymphocyte Cytotoxicity; UNC13D, STX11, STXBP2 and RAB27A on
    Defective Cytotoxic Granule Exocytosis), two new nodes for the routes that are
    not cytotoxic-granule defects (Lysosome-Related Organelle Biogenesis Failure for
    LYST; NKT-Cell Deficiency and Dysregulated Lymphocyte Survival for SH2D1A and
    XIAP, wired together because PMID:17080092 reports the NKT deficit in both), and
    a causal chain from the granule-exocytosis lesion through impaired cytotoxicity
    to the cytokine-storm node and on to five phenotypes. Coverage after the pass is
    8/8 genes and 5/11 phenotypes.

    Six phenotypes were left unconnected because no source consulted states the
    mechanistic step: Fever, Hyperferritinemia, Hypertriglyceridemia,
    Hypofibrinogenemia, Skin Rash, Lymphadenopathy. The five that were wired rest on
    two explicitly causal sentences - GeneReviews PMID:20301617 on T-lymphocyte and
    macrophage overactivation "leading to infiltration and damage of organs including
    the bone marrow, liver, spleen, and brain", and PMID:10835631 naming the
    uncontrolled activation state as the haemophagocytic syndrome itself.

    One evidence_source was changed: the Munc13-4 granule-exocytosis sentence quoted
    on the new causal edge was graded IN_VITRO in the first draft, which diverged from
    the HUMAN_CLINICAL grading the same sentence already carries on the FHL3 subtype
    row. check-snippet-grading keys on the sentence, so the new item was matched to
    the existing grading rather than regrading pre-existing content in a genetics PR.

    Deleted stubs/Familial_Hemophagocytic_Lymphohistiocytosis_5.yaml, whose
    MONDO:0013135 is now bound on the FHL5 row.

    Validation: just validate, just validate-terms, just check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values
    all pass; 93 snippets verified against the cached references; 8 gene bindings
    compared against HGNC with no findings and no uncached rows. No new reference
    cache files were needed for this entry.

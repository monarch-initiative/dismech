  details: |
    Manual expert claim-evidence review.
    Fixed: (1) No inheritance block existed although this is a Mendelian entry - added Autosomal recessive (HP:0000007) and X-linked recessive (HP:0001419) blocks with evidence, replacing what was previously only prose in notes and genetic[].features. (2) No prevalence block - added the Swedish population-based figure (PMID:2058392, 1 per 50,000 live births; 1.2/1,000,000 children/year) with the authors' own underdiagnosis caveat. (3) The Harrison's genetics and IUIS classification claims cited PMID:35748970 snippets ('There are now a total of 485 inborn errors of immunity' / 'We report the updated classification') that never mention HLH - added HLH-specific primary evidence as the SUPPORT items and downgraded the generic IUIS quotes to PARTIAL. (4) No phenotype carried a frequency band - added evidence-backed bands from the same Swedish cohort for Fever (91%), Hepatosplenomegaly (splenomegaly 84%/hepatomegaly 90%) and Neurologic Involvement (47%).

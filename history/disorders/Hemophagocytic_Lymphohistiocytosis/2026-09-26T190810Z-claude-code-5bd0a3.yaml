  summary: 'Review round 1: split the NKT node, correct the EBV attribution'
  details: |
    Blocking finding on PR 12918. The node NKT-Cell Deficiency and Dysregulated Lymphocyte Survival carried two distinct lesions: the NKT-cell deficit shared by SH2D1A and XIAP, and the increased activation-induced lymphocyte apoptosis that is XIAP-specific, as the node's own description acknowledged. Split into NKT-Cell Deficiency (SH2D1A and XIAP, GO:0001865 DECREASED) and Enhanced Lymphocyte Apoptosis (XIAP only, GO:0070227 INCREASED), each with its own downstream edge to the cytokine-storm node and each carrying the PMID:17080092 sentence that establishes it. Both GO CURIEs were read from cache/go/terms.csv rather than from the relayed review text. The old node name was checked for incoming bare-name targets before the rename and had none, so no edge dangled; check-causal-targets confirms no new breakage. Separately the node description asserted that loss of either gene leaves the response to Epstein-Barr virus unregulated, which contradicts this entry's own XLP2 subtype row recording that XIAP deficiency predisposes to recurrent HLH often without EBV. The description now attributes the EBV-triggered picture to SAP deficiency and XLP in general and states the XLP2 exception explicitly, cross-referring to that row. The edge to the cytokine storm was DIRECT on a GeneReviews snippet that links XLP to HLH without establishing NKT depletion as the causal step, which remains debated; both new edges are INDIRECT_UNKNOWN_INTERMEDIATES and their explanations say what the cited sentence does and does not establish.

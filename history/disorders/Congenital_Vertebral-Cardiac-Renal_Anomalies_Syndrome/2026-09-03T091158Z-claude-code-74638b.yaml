  summary: Reapply lost self-review fixes; address ai4c-reviewer changes-requested
  details: |
    Two things happened here, and the first one matters more.

    A batch of the fixes claimed in the preceding REVIEW record was never
    written to disk. The edits were applied by a Python script that asserted on
    each expected match before writing; two assertions failed on strings whose
    formatting had changed under a reference-title backfill, and the script
    exited before its single write call. The remaining edits in that batch went
    with it. Validation was re-run afterwards and passed, which proved the file
    was well-formed, not that the intended edits were present, so the loss went
    unnoticed and the record asserted fixes that did not exist. The lesson is
    the obvious one: an all-or-nothing batch edit needs a post-write check that
    the intended strings are actually gone, not just that the file still
    validates.

    Reapplied and verified on disk this time: removal of the monoallelic-VUS
    PMID:34681008 item from genetic[NADSYN1]; the 3-hydroxyanthranilic acid
    biomarker reframed as predicted (presence unset, notes rewritten, evidence
    marked directness: INDIRECT); removal of the quinolinate DECREASED
    descriptor that is false for VCRL3; the corrected step count; the two
    murine-result hedges on VCRL3 vitamer specificity and on
    timing-determines-defect; the VCRL3 spectrum re-citation; and the
    somitogenesis background sentence regraded OTHER with its en-dash
    normalised.

    The REVIEW record that preceded this one is left as written. History is
    append-only, and it accurately records what that session intended and
    believed; this record is the correction.

    Second, the ai4c-reviewer review on PR #10680 (CHANGES_REQUESTED, two
    IMPORTANT items and three suggestions). Both IMPORTANT items were checked
    against the file before acting.

    Item A is correct and is a defect this session introduced. PMID:32015132 is
    a mouse publication; its sentence naming humans is background about prior
    work, not its own human data. The preceding session regraded that item to
    HUMAN_CLINICAL to satisfy the rule that model-organism evidence should not
    be the sole support for a human phenotype, which fixed one rule by breaking
    another. The reviewer's remedy is better and was taken: the item is back to
    MODEL_ORGANISM with the reason stated in its explanation, and a genuinely
    human second item was added (PMID:41170824, altered NAD-pathway metabolites
    in women with recurrent miscarriage, directness: INDIRECT since the cohort
    is recurrent miscarriage generally rather than CNDD). Note the reviewer's
    supporting claim that the same sentence is graded MODEL_ORGANISM elsewhere
    in the file is not accurate - the other PMID:32015132 items quote different
    sentences, which is why check-snippet-grading did not fire. The finding
    stands on the publication-type rule alone.

    Item B and suggestion C were both already correct in intent and are now
    correct in the file, via the reapplication above rather than as new work.
    The reviewer was reading the state that the lost batch should have changed.

    Suggestion E taken: directness: INDIRECT added to the GeneReviews
    management-list snippet on Ptosis, matching the four sibling phenotypes that
    quote the same kind of sentence.

    Suggestion D not taken, and not because it was judged wrong. HP:0004211 does
    not resolve in HPO (`runoak info` returns no label), so there is no term to
    move to. HP:0004383 (Hypoplastic left ventricle) remains, with
    preferred_term carrying the more specific "hypoplastic left heart syndrome",
    which is the documented pattern for a preferred_term narrower than its
    binding.

    Also corrected while in the file: the differential_diagnoses text for
    congenital vertebral malformation said NADSYN1 variants "accounted for a
    minority of cases". The cited cohort found heterozygous variants of
    uncertain significance, so the sentence now says that.

    Not taken from the reviewer's non-blocking list: hydroxykynureninuria as an
    allelic KYNU condition, and the monoallelic-NADSYN1 hypothesis as a
    discussions entry. Both would need sources beyond the current cache, and the
    second is in tension with removing the VUS evidence item above; adding it
    now would reintroduce as a hypothesis the claim just removed as evidence,
    without new support.

    Validation: `just validate` 115/115 snippets; `just validate-disorders`
    passes; check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence all pass. Compliance 94.9% (95.2% weighted).

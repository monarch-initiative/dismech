  summary: 'Create: Congenital Vertebral-Cardiac-Renal Anomalies Syndrome (CNDD; VCRL1/2/3)'
  details: |
    Requested as "curate vertebral, cardiac, renal, and limb defects syndrome 1"
    (VCRL1, MONDO:0060554). Curated as a parent-level entry instead of a
    standalone VCRL1 file, following the decision recorded when issue #8549 was
    closed: LUMP_INTO_PARENT, with VCRL1 (HAAO), VCRL2 (KYNU) and VCRL3
    (NADSYN1) as has_subtypes under MONDO:0020831. GeneReviews independently
    treats the three genes as one disorder, "congenital NAD deficiency
    disorder" (PMID:37499065), which supports that shape. The VCRL1 stub
    (stubs/Vertebral_Cardiac_Renal_And_Limb_Defects_Syndrome_1.yaml) is deleted
    by this change; no stubs existed for VCRL2 or VCRL3.

    Deep research. falcon was requested (the /curate default) and failed
    authentication with a 403 on both attempts, so the run was re-issued with
    dr_fallback='--fallback' rather than substituting a provider by hand. That
    run fell back to openscientist and its report records fell_back: true,
    requested_provider: falcon and both provider attempts in frontmatter. A
    claude_code run was executed in parallel while openscientist was queued.
    Both reports were used and both are committed.

    research/...-deep-research-openscientist.md: 9/9 references resolved, 0
    unresolved, 9/9 on topic; 27/28 terms resolved with one obsolete
    (GO:0043420, not used here) and three benign label variants. Its causal
    chain independently matches the one curated here. Its claim of a
    "homozygous HAAO exon-5 deletion" is a report error - PMID:34200361
    describes a KYNU exon-5 deletion - and was not propagated.

    research/...-deep-research-claude_code.md: 16 web searches, 22 turns, 24
    citations. Its reference-validation section was added retroactively with
    `just validate-research-reference`: 15/15 references resolved, 0
    unresolved, 0 off topic.

    Term validation of that report (`just validate-research-terms`) flagged real
    problems, and none of its suggested CURIEs were copied across unchecked.
    The report proposed HP:0004392 for hypoplastic left heart; HP:0004392 is
    "Prune belly". It labelled GO:0034354 as "NAD biosynthesis via nicotinamide
    riboside salvage pathway" when that term is the de novo route from
    tryptophan, and UBERON:0002298 as "vertebral column" when it is brainstem.
    It also offered two obsolete terms (HP:0001180, GO:0043420). Every binding
    in the entry was resolved independently with OAK and validated by
    `just validate-terms`.

    GeneReviews baseline (Step 3b). PMID:37499065 "Congenital NAD Deficiency
    Disorder" was found, fetched, tagged GeneReviews in the top-level
    references block, and used as the phenotype baseline. Every phenotype named
    in its Clinical Characteristics section is captured: congenital heart
    defects, short stature with disproportionately shortened limbs, vertebral
    anomalies (hemivertebrae, vertebral fusion) with rib anomalies, renal
    dysplasia/hypoplasia/agenesis, developmental delay/intellectual disability,
    and each of the less common features (cleft palate, eye anomalies,
    sensorineural hearing loss, tracheoesophageal fistula, polysplenia,
    anteriorly displaced anus, tethered spinal cord, cystic hygroma, epilepsy,
    hypothyroidism, hypoparathyroidism). Its Agents/Circumstances to Avoid item
    (avoid nephrotoxic medications with a solitary or impaired kidney) is
    recorded in the supportive-care treatment description with the GeneReviews
    quote as evidence.

    Mechanism. Built as a causal chain rather than a list: enzymatic block ->
    embryonic NAD deficiency -> per-organ morphogenesis nodes -> the
    corresponding phenotypes, with maternal NAD precursor provision entering as
    a second, independent input to the same convergence node. That shape is the
    substantive claim of the literature (PMID:32015132 shows the malformations
    arise in genetically normal embryos on a restricted maternal diet), and it
    is what lets the environmental and treatment blocks attach to a single node
    instead of duplicating the pathology.

    Human/mouse boundary. All prevention evidence is murine. The antenatal
    supplementation treatment is described as mechanistically motivated rather
    than established and carries the authors' own statement that clinical
    trials are still needed (PMID:38357931); a KNOWLEDGE_GAP discussion records
    the absent human evidence, and a HUMAN_MODEL_MISMATCH discussion records
    that every mouse phenotype is conditional on a B3-restricted maternal diet
    while human patients are ascertained without documented maternal deficiency.

    Deliberate omissions. No conforms_to against
    axial_segmentation_serial_homology: that module is built on the Notch
    segmentation clock, and there is no evidence NAD deficiency acts through
    that oscillator, so the relationship is recorded in notes rather than
    asserted as conformance (this follows the guidance left on issue #8549).
    No datasets block: `just discover-datasets` returned one GEO candidate
    (geo:GSE243441), a bladder-cancer RNA-seq study matched on the NADSYN1 gene
    symbol alone, which is a gene-only false positive and was rejected; the
    reason is recorded in the entry's review_notes. The "Pregnancy loss"
    phenotype is left unbound because HPO codes the concept under Pregnancy
    history and Prenatal death, neither reachable from the Phenotypic
    abnormality root the PhenotypeTerm enum expands from; the reason is in that
    phenotype's notes. The maternal dietary insufficiency exposure is likewise
    unbound: ECTO models exposure to substances, not their absence, and its
    niacin terms assert the opposite claim.

    Citations used but not from the report: the GeneReviews chapter, the
    NADSYN1 cohort papers (PMID:34681008, PMID:36951206), the KYNU/UPD2 case
    (PMID:34200361), the gene-environment mouse work (PMID:32015132,
    PMID:36374036) and the timing/yolk-sac studies (PMID:40689776,
    PMID:41630685) were found by direct PubMed search. PMID:36649848 (the
    30-year-old NADSYN1 patient: renal sparing, and a ~25% NAD pool rise on
    nicotinamide) came from the openscientist report and is the only human
    measurement of a response to supplementation in the entry. Preference was given to
    PMIDs over DOIs throughout, so every evidence item is snippet-checked by
    the gating validator.

    Validation. `just validate` passes with 97/97 snippets verified against the
    reference cache. The batched pre-PR gate
    `just validate-disorders kb/disorders/Congenital_Vertebral-Cardiac-Renal_Anomalies_Syndrome.yaml`
    passes schema, term and reference validation. Also run and passing:
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence. `just compliance` reports 95.5% global
    (weighted 95.8%).

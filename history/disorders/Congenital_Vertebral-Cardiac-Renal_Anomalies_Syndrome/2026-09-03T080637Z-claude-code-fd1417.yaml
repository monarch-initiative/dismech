  summary: 'Self-review fixes: claim-evidence mismatches, missing limb and postnatal
    phenotypes'
  details: |
    Adversarial self-review of the entry created in the preceding session record,
    run in a fresh context against the dismech-pr-review skill. It returned
    REQUEST_CHANGES with six blocking findings; all six were verified against the
    cached source text before acting, and all six were real. Fixes below.

    Claim-evidence mismatches (blocking).

    PMID:34681008 was cited on genetic[NADSYN1] as CAUSATIVE evidence. The paper
    reports "eight rare NADSYN1 heterozygous nonsynonymous variants" classified
    "as VUS" in a congenital vertebral malformation cohort. Monoallelic variants
    of uncertain significance do not evidence a causative biallelic gene-disease
    relationship, and the item contradicted the entry's own quoted framing that
    every CNDD case arises from biallelic loss of function. The item was removed
    from genetic; its correct use in differential_diagnoses is unchanged.

    biochemical[Elevated circulating 3-hydroxyanthranilic acid] asserted
    presence: PRESENT on a snippet that says only that metabolites were measured,
    naming neither the analyte nor a direction. No cached source reports the
    elevation in a HAAO-deficient patient. presence removed, notes rewritten to
    state the record is a prediction from the position of the enzymatic block,
    and the evidence item marked directness: INDIRECT.

    treatments[Postnatal amidated NAD precursor supplementation] rested on a case
    of "NA supplementation" in a HAAO patient. In that paper NA is nicotinic
    acid, which is not an amidated precursor, in the subtype where the
    Preiss-Handler route is intact, so the evidence did not support the claim it
    was attached to. Re-explained as evidence for postnatal supplementation in
    general, and the paper's actual amidated-precursor human data added: a 115%
    rise in blood NAD on nicotinamide, and prevention of life-threatening
    NADSYN1-dependent pellagra-like dermatitis.

    Omissions (blocking).

    No limb phenotype existed, despite limb anomalies being the L of VCRL, named
    in the GeneReviews sentence already quoted twice in the entry, and affecting
    8 of 12 in the largest genotyped series - ahead of the kidneys. The
    Disrupted Limb Morphogenesis node was asserting a phenotype the entry never
    recorded. Added, with the 8-of-12 snippet, and wired as a downstream target.

    Pellagra-like dermatitis was absent. It is the only postnatal manifestation
    in the cited literature that supplementation has been shown to prevent, and
    the strongest human indication for postnatal treatment. Added as a VCRL3
    phenotype.

    PMID:34748060, a meta-analysis of 14 case-control studies (35,743 women)
    associating insufficient maternal niacin intake with congenital anomalies,
    was fetched into this PR's cache and cited nowhere. That left the
    environmental exposure entry, marked PRESENT on a human disease, supported
    only by MODEL_ORGANISM evidence, which CLAUDE.md forbids. Worse, the
    antenatal-prevention discussion asserted "the human evidence is entirely
    absent" while that paper sat uncited in the same PR. Now cited on the
    exposure with directness: INDIRECT, and the discussion narrowed to say no
    trial has tested supplementation in an at-risk pregnancy and the only human
    data are population-level.

    Human/mouse boundary. Three places stated murine results as general fact and
    were hedged: the VCRL3 vitamer-specificity claim (a Nadsyn1-null mouse
    result, untested in humans, and stated flatly in both the subtype
    description and the antenatal treatment), and the timing-determines-defect
    claim on Embryonic NAD Deficiency.

    Other corrections. The quinolinate-biosynthesis DECREASED descriptor was
    removed: it is false for VCRL3, where the NADSYN1 block sits downstream of
    quinolinate, so a node-scoped tag was wrong for a third of the disorder; the
    reason is recorded in the node's notes and two chemical entities replace it.
    "Two steps upstream of NAD" was wrong (there are several). Two unsourced
    comparative claims (a spondylocostal-dysostosis contrast, a neural-crest
    cardiopathy contrast) were cut rather than left as authoritative-sounding
    assertions with nothing behind them. The Haao-null RESCUES link pointed at
    maternal provision rather than at the NAD deficit it corrects. The VCRL3
    "unaffected adults" claim was re-cited to the paper that actually says
    "complete absence of malformation". Four evidence_source grades were fixed,
    including a MODEL_ORGANISM grade that was the sole support for a human
    phenotype. Two en-dash-to-hyphen snippet drifts were normalised so the quotes
    are literal substrings, not merely dash-normalised matches.

    Additions. A KNOWLEDGE_GAP discussion recording that the effector layer
    between NAD loss and organ failure is unestablished, and that this leaves the
    pathograph explaining that NAD deficiency causes the malformations but not
    how, nor why these organs. A zebrafish ATDA model (PMID:39829932) as a second
    species with a nicotinamide rescue. Molecular genetic testing split out as
    its own diagnosis entry from the metabolome adjunct, with the copy-number
    caveat that a KYNU exon deletion and a UPD2 both produced biallelic loss.
    Facial dysmorphism, microcephaly, strabismus, pyloric stenosis and laryngeal
    web phenotypes. GeneReviews recurrence-risk figures and reproductive testing
    options quoted rather than paraphrased.

    Not done. No disease-level prevalence record: the GeneReviews cohort count
    (27 individuals from 25 families) appears in the deep-research reading of the
    full chapter but not in the cached abstract, and no other cached source gives
    a disease-level figure, so it is left as a gap rather than asserted from an
    unquotable source. The prevalence record remains VCRL3-scoped and says so.

    Validation after fixes: `just validate` 115/115 snippets verified;
    `just validate-disorders` passes. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-environmental-evidence all pass. Compliance
    94.9% global (95.2% weighted) over a larger denominator than before.

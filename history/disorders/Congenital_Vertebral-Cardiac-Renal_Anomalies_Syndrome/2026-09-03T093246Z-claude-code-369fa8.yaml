  summary: Drop unsupported zygosity claim from hydroxykynureninuria differential
  details: |
    The hydroxykynureninuria differential's description opened 'Biallelic KYNU
    variants'. The cited review (PMID:34200361) says only 'two brothers with a
    missense variant in KYNU' and reports no zygosity, so the claim was not
    supported by the source behind it.

    Raised by the approving review as a nit it judged not worth another round.
    Fixed anyway: it is the same class of defect as the PMID:34681008 finding
    earlier in this PR, where a heterozygous-VUS cohort was cited as evidence of a
    biallelic causative relationship. A KB whose value is claim precision should not
    carry a known zygosity overstatement because correcting it costs a CI cycle.

    The description now states the mechanistic claim the source does support,
    residual enzyme activity rather than allele configuration, and records that the
    cited review does not report zygosity. Hydroxykynureninuria is autosomal
    recessive, so biallelic involvement is very likely correct; it is simply not what
    this citation establishes, and the primary Christensen report is not in the cache.

    Validation: 117/117 snippets, just validate-disorders passes.

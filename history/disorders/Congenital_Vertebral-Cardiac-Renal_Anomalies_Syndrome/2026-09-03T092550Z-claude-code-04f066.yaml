  summary: 'Close reviewer''s non-blocking gaps: NaAD binding, allelic KYNU differential'
  details: |
    Closes the two non-blocking items the approving review deferred to a future pass.

    The Kynurenine Pathway Intermediate Accumulation node described a gene-specific
    accumulation pattern across all three subtypes but bound CHEBI entities for only
    two of them, so the VCRL3 arm was prose-only. CHEBI:18304 (deamido-NAD(+)), the
    NADSYN1 substrate, is now bound and named in the description instead of 'the
    terminal precursor', which makes the three-way contrast machine-readable.

    Added hydroxykynureninuria without malformation as a differential. Biallelic KYNU
    variants leaving residual kynureninase produce the biochemical picture of this
    disorder in individuals with no congenital malformations (PMID:34200361, citing
    Christensen et al.), with residual activity keeping plasma NAD high enough as the
    proposed basis for the split. This matters clinically rather than taxonomically:
    it is why a raised xanthurenic acid on its own does not establish CNDD, which the
    entry otherwise presents as a diagnostic pointer.

    Still not taken: the monoallelic-NADSYN1 hypothesis as a discussions entry. It
    would reintroduce as a hypothesis the claim removed as evidence when the
    heterozygous-VUS item was deleted, without new support behind it.


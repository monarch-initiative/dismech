  summary: Review and enrich Hand-Foot-Genital_Syndrome
  details: |
    Fetched and tagged the Hand-Foot-Genital Syndrome GeneReviews chapter (PMID:20301596, annotated with quote_role: REVIEW_SYNTHESIS) and Innis et al. 2004 (PMID:15385446), added MONDO-verified synonyms, enriched classifications (harrisons_chapter + ISDS 2019 group 38 / 2023 group 19 provenance), migrated prevalence to CASES_IN_LITERATURE/ULTRA_RARE, split HOXA13 molecular pathophysiology into atomic haploinsufficiency/homeodomain and polyalanine-expansion reduced steady-state protein abundance nodes (backed by PMID:15385446) and separated ureterovesical/bladder-outlet patterning from ventral urethral closure across 6 multi-scale nodes, added missing cardinal phenotypes (Short Middle Phalanx of the 5th Finger, Carpal Synostosis, Delayed Carpal Ossification, Tarsal Synostosis, Uterus Didelphys, Longitudinal Vaginal Septum, Chronic Pyelonephritis, and Premature Birth), added Pre-Pregnancy Reproductive Tract Evaluation in treatments and the Hoxa13(ALA28) knock-in mouse animal model, consolidated HOXA13 genetic validity (ClinGen Definitive), and added NCIT-grounded diagnosis and treatment entries.

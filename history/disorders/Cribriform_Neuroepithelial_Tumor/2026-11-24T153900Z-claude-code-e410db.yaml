  summary: 'Edit: Cribriform_Neuroepithelial_Tumor — a distinct entity or a variant
    of AT/RT'
  details: >-
    Adds a discussion, crinet_entity_or_variant (OPEN_QUESTION, open), on whether the tumour is a
    distinct entity or a variant of AT/RT, specifically of the TYR group the 2017 series' tumours
    clustered with. It carries fifteen evidence items from cached sources and attaches to the
    disease, the Outcome phase, the methylation diagnosis row, two histopathology rows and the
    Biallelic SMARCB1 Inactivation node. Six of the quotes are already quoted on other rows, with
    the same evidence_source and quote_role; the WHO summary sentence is DIRECT here and, on the
    histopathology row, INDIRECT for the histology, which the summary does not describe. A review's
    two sentences, the second of which names the tumour among paediatric tumours with complete
    SMARCB1 loss after the first notes tumours described outside the MRT-AT/RT spectrum, are new as
    a pair; the second is quoted alone on the SMARCB1 node's edge, with the same grading. The
    sources: a 2022 summary of the WHO classification of paediatric tumours, which calls the tumour
    a provisional entity, biologically distinct from AT/RT (PMID:34921008, REVIEW_SYNTHESIS); a 2018
    review with that pair and with the caveat that most, not all, malignant rhabdoid tumours contain
    rhabdoid cells (PMID:29280680, REVIEW_SYNTHESIS, both INDIRECT); a 2022 letter that lists the
    tumour in passing as benign, beside malignant AT/RT (PMID:35195707, BACKGROUND, DIRECT for that
    listing); a 2023 case report and literature review calling the tumour a provisional category
    sharing similarities with AT/RT (PMID:36884098, BACKGROUND); and from the 2017 series
    (PMID:27380723) the question as its abstract poses it (BACKGROUND), its conclusion, its much
    better outcome despite highly similar profiles, its call for future work on the prognostic role
    of AT/RT's molecular groups (INDIRECT, no quote_role), methylation clustering within AT/RT TYR,
    tyrosinase staining as in that group, a SMARCB1 mutation distribution that seems quite similar,
    with the Figure 3 legend that states it without the hedge and gives ten AT/RTs per group, its
    comparison with desmoplastic medulloblastoma (INDIRECT, an analogy) and its finding of no exon 1
    mutations or mosaic staining together with its statement that it cannot entirely exclude a
    truncated SMARCB1 protein with some residual function as the cause of the less aggressive
    behaviour (INDIRECT, no quote_role). The rationale says no cited source settles the question,
    though the classification leans to the distinct reading, provisionally, and a review places the
    tumour, by inference, outside the spectrum of malignant rhabdoid tumour and AT/RT. The entry's
    notes point to the discussion and, with its description, now speak of a distinct entity or a
    variant. Validated with just validate-disorders, just validate, just validate-terms, just
    count-verified-snippets, just check-snippet-grading, just check-entity-refs and the other
    whole-repo gates CI runs.

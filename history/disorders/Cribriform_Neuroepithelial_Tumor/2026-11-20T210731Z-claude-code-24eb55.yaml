  summary: 'Review round 1 on PR 18666: commit the deep-research report'
  details: |
    Answers the automated review of PR 18666. The deep-research report the entry drew on
    (research/Cribriform_Neuroepithelial_Tumor-deep-research-claude_code.md, with its citations
    sidecar) is committed unchanged, as the review asked; the entry still curates none of its
    chromosome-level content. The obstructive hydrocephalus edge keeps causal_link_type DIRECT:
    a mass in the fourth ventricle blocks the flow of cerebrospinal fluid directly, and the
    edge's single case report quote stays INDIRECT because it states the mass and the
    hydrocephalus together without saying that one caused the other. A differential diagnosis
    section and named treatment protocols are left to later PRs of this series. Validated with
    just validate-disorders, count-verified-snippets and the rest of the repository's gate set.

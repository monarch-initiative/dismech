  summary: 'Create: Cribriform_Neuroepithelial_Tumor'
  details: |
    New entry for cribriform neuroepithelial tumour (CRINET, MONDO:1060254), a rare
    SMARCB1-deficient tumour in and around the ventricles of young children. Curated by hand
    from cached sources: the largest cited series, of ten children (full text) and published in
    2017, the only cited study to compare the tumours with the three molecular groups of
    atypical teratoid/rhabdoid tumour (AT/RT); the first two-case report (2009); single-case
    reports; a three-tumour genomic study; a review of SMARCB1-deficient tumours; and a summary
    of the WHO classification of paediatric tumours. The question whether the tumour is its own
    disease or a pattern of the AT/RT TYR group is stated in the description, with the evidence
    for each side on its rows: methylation clustering inside the TYR group, tyrosinase staining
    and the shared SMARCB1 hits on one side, the histology without rhabdoid cells and the much
    longer survival on the other. The entry treats it as its own disease, as MONDO does. The
    pathophysiology is a short chain: biallelic SMARCB1 inactivation, marked as the origin node
    with no cell bound because no source names the cell of origin, leading to the tumour, which
    leads to obstructive hydrocephalus, raised intracranial pressure and gait imbalance (each
    quoted from a single child, so no frequency is set). Rows also cover the SMARCB1 gene
    (somatic, with two germline cases), four histology findings, methylation profiling and MRI,
    resection and chemotherapy linked to the tumour node, the outcome, and a cases-in-literature
    row graded ultra-rare. The GeneReviews chapter on SMARCB1-related schwannomatosis is not
    cited, since it concerns schwannomatosis. The deep-research report generated for this entry
    was used as a lead and is not committed. Validated with just validate,
    count-verified-snippets (44 of 44) and the pre-PR gates.

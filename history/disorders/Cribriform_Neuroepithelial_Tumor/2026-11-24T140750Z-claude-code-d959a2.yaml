  summary: 'Cribriform neuroepithelial tumour: differential diagnoses, imaging, classification
    and NCIT mapping'
  details: >-
    Adds differential diagnoses, imaging, classification and an NCIT mapping, with 19 new evidence
    items from cached sources. A new differential_diagnoses section has four rows bound to MONDO
    terms. Atypical teratoid/rhabdoid tumour (eight items): the 2017 series (PMID:27380723) on the
    shared genetic and epigenetic profile with the AT/RT TYR group, CRINET's much better outcome and
    its mean overall survival (125 against 53 months),
    its histology without rhabdoid cells, the tyrosinase staining shared with AT/RT TYR, and its
    conclusion; and a review (PMID:29280680, REVIEW_SYNTHESIS) that most but not all malignant
    rhabdoid tumours contain rhabdoid cells, that they lose SMARCB1 nuclear expression and that most
    follow an aggressive and ultimately lethal course (all three INDIRECT, since they speak of
    malignant rhabdoid tumours as a whole); its notes say which features are shared, that read for
    AT/RT the absence of rhabdoid cells alone may not exclude it, and
    why outcome is not listed as a distinguishing feature. Choroid plexus tumours (bound to MONDO:0016717 choroid plexus neoplasm,
    because two of its sources speak of choroid plexus tumours of any grade; five items): the 2017
    series' 6 of 10 children in whom a choroid plexus tumour was considered first, a 2023 case first
    taken for a carcinoma (PMID:36884098) and what led to its CRINET diagnosis (INDIRECT, since it does not say what excluded a carcinoma), SNP array profiles
    that contributed to the diagnosis of two difficult SMARCB1-negative tumours (PMID:24478045), and
    a trial's central review that excluded one screened tumour as CRINET (PMID:34997889, INDIRECT,
    since its local diagnosis is not given); its notes say SMARCB1 loss alone does not separate the
    two. Ependymoma
    (two items: two tumours in a previously described family first reported as anaplastic ependymomas, INDIRECT
    since the series does not call them CRINETs, and a 2022 case report's diagnosis at presentation
    (PMID:35673730, in Chinese)) and medulloblastoma (one item, the same diagnosis at presentation). No
    row is added for embryonal tumour with multilayered rosettes, because no cached source contrasts
    it with CRINET. A new imaging_findings row, Mass in or beside the cerebral ventricles, has three
    items from three case reports (PMID:22239490, PMID:23495723, PMID:35673730, the second INDIRECT
    for the MRI modality), with notes recording the NCIT and HPO searches for a finding term, the
    location binding and the modality. A new classifications block records Harrison's oncology part and the ICD-O morphology
    value Embryonal Neoplasm, following the 2021 WHO placement among the other CNS embryonal tumours
    (Table 7 of DOI:10.1007/s00701-022-05301-y). A new mappings block maps NCIT:C121963 as an exact
    match, cross-referenced by MONDO:1060254. The NCIT term is added to the term caches. Validated
    with just validate-disorders, just validate, just validate-terms, just count-verified-snippets,
    just check-snippet-grading and the other whole-repo gates CI runs.

  summary: 'Create: Immunodeficiency 70 / IVNS1ABP haploinsufficiency (MONDO:0033542)'
  details: |
    De-novo curation from claim issue #11714. The entry is written around the thinness of its evidence base rather than around a mechanism it cannot support: one cohort, three sporadic patients, a reported posterior probability of association of 0.33, no ClinGen gene-disease validity assertion and no Orphanet record. The PPA is quoted verbatim in an evidence snippet rather than paraphrased, because a reader weighing the entry needs the number. Declined to curate lymphopenia: the source says low/normal CD4+ T cell and B cell counts, and the abnormality is the surface phenotype (raised CD127 and PD-1 on naive T cells) rather than the counts. The claim issue had described lymphopenia from memory and has been corrected in a comment. Both causal edges out of the haploinsufficiency node are typed INDIRECT_UNKNOWN_INTERMEDIATES because no experiment connects reduced NS1-BP dose to either the immunophenotype or the HPV susceptibility; the two NS1-BP molecular-function references are graded NO_EVIDENCE with respect to the gene-disease claim, since they are influenza cell biology and marking them SUPPORT would imply a mechanistic link nobody has shown. One ontology limitation recorded in place: raised CD127/PD-1 on naive T cells has no HPO term, so it is bound to the broader HP:0031392 with the mismatch stated in that phenotype's notes. Validated: linkml-validate, linkml-term-validator, 14/14 snippets verified, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms.

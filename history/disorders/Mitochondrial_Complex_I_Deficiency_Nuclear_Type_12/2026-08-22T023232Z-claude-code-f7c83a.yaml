  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 12 (NDUFA1)'
  details: |
    New Disease entry for mitochondrial complex I deficiency, nuclear type 12 (MONDO:0026720), claimed via issue #9220.

    Lump/split decision: DISEASE. One causal gene (hgnc:7683 NDUFA1), no MONDO descendants, no existing entry covering the term. Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml served as the shape precedent for a nuclear-type entry. There is no Mitochondrial_Complex_I_Deficiency grouping in the KB; noted in the entry as a natural future home.

    Mechanism curated as a four-node chain plus one modifier: NDUFA1 loss of function -> complex I assembly and stability failure -> impaired NADH-ubiquinone oxidoreduction and OXPHOS deficit -> mitochondrial encephalomyopathy, with skewed X-inactivation in heterozygous females as a role: modifier node feeding the assembly node.

    Two features distinguish this entity and are preserved deliberately. First, NDUFA1 is one of only two X-chromosomal nuclear genes among the 58 controlling complex I biogenesis, making this an X-linked disorder inside a predominantly autosomal recessive series; the male preponderance of earlier complex I cohorts is what led investigators to the X chromosome. Second, MWFE is an accessory rather than catalytic subunit, so the lesion reduces the amount of assembled enzyme rather than poisoning an active site.

    The absent-subcomplex finding is treated as load-bearing and is flagged in notes: blue native electrophoresis showed reduced intact complex I with NO accumulation of lower-molecular-weight subcomplexes, which is why assembly failure and holoenzyme destabilization cannot be distinguished on current data. The node wording preserves that rather than asserting a simple assembly block.

    Curated the Ndufa1 S55A knock-in mouse in animal_models using the ModelMechanismLink pattern, with two links at different fidelity: RECAPITULATES/MODERATE against the OXPHOS node (two readouts: ~50% residual complex I activity; reduced respiratory exchange ratio and body heat) and PARTIALLY_RECAPITULATES/LOW against the encephalomyopathy node (readout: age-dependent Purkinje neuron loss), with limitations recording that S55A is an engineered rather than patient allele and that late cerebellar degeneration does not match infantile Leigh syndrome. A HUMAN_MODEL_MISMATCH discussion carries that translational question.

    Two further open KNOWLEDGE_GAPs: whether assembly/stability severity explains the allele-specific phenotype split (Leigh syndrome vs myoclonic epilepsy), and how often heterozygous female carriers manifest -- the latter with a concrete counselling consequence, since X-inactivation skew is tissue-specific and was measured in muscle, not blood.

    No treatments block: nothing disease-modifying is established.


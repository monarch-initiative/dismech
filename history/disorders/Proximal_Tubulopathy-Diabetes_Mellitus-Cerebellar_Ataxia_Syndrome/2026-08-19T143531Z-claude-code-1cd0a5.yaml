  details: |
    Second PR Shepherd pass on PR #8859, addressing the findings left open by the
    c57baa8 commit. Findings 3, 5 and 7 are now done; 4 and 8 remain open.

    Finding 7 - FIXED, but NOT as the review specified, because two of the three
    requested edges are schema-impossible as written. The review asked for
    "downstream edges" from Renal Fanconi syndrome and from Mitochondrial myopathy,
    but both of those are phenotypes, and the Phenotype class has no downstream slot
    - only Pathophysiology does. The phenotype-to-phenotype causal slot is
    sequelae, which carries the same CausalEdge range. So:
      - Renal Fanconi syndrome -> Recurrent dehydration and salt-wasting crises,
        modelled as sequelae, DIRECT. No snippet: the entry itself records that this
        link comes from the OMIM/Orphanet synthesis and the full clinical report
        rather than the index-family abstract, and that disclosure is repeated on the
        edge instead of attaching a quote that does not exist.
      - Mitochondrial myopathy -> Ragged-red muscle fibers, modelled as sequelae,
        DIRECT, evidenced by the index report's own phrase "mitochondrial myopathy
        with ragged-red fibers".
      - Proximal Tubular Bioenergetic Failure -> Osteoporosis, modelled as
        downstream (this one is a pathophysiology node, so downstream is correct),
        typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT because the
        intermediate steps are not measured in the index family and the bone
        phenotype itself comes from the OMIM/Orphanet synthesis.

    Finding 3 - FIXED. Added a genetic: section with MT-CYB (hgnc:7427) and MT-ATP6
    (hgnc:7414), both CAUSATIVE/GERMLINE, following the structure of
    kb/disorders/Histiocytoid_Cardiomyopathy.yaml. Both CURIEs were confirmed in
    cache/hgnc/terms.csv before use, so the section validates offline. Per the
    review's explicit refinement, the lesion is described in features: as a
    heteroplasmic large-scale (~26 kb) partial duplication whose single abnormal
    junction lies between the two genes - NOT as a point mutation. The MT-CYB block
    records that gene-level causation here is positional and biochemical (cytochrome
    b is the only mitochondrially encoded complex III subunit, and the family had a
    complex III deficiency) rather than a demonstrated coding change, which is what
    the original report actually supports. The MT-ATP6 block states explicitly that
    no ATPase 6 point mutation was reported and no complex V defect was shown, so
    the entry does not imply more than the source does.

    Finding 5 - PARTIALLY FIXED. Added evidence to Electrolyte and Alkali
    Replacement from the already-cached PMID:24386581. The explanation is explicit
    that this is a mitochondrial de Toni-Debre-Fanconi case with a complex I
    deficiency, not this syndrome's complex III defect, so it is cited for the
    supportive replacement approach in mitochondrial proximal tubulopathy generally
    rather than as a report of treatment in this disease. Insulin Therapy and
    Genetic Counseling still carry no evidence and were left alone.

    Findings 4 and 8 - NOT ACTIONED. Consuming the remaining uncited references
    (PMID:40445405, PMID:33030289, PMID:34349672, DOI:10.1007/BF01799607) and
    attaching evidence to the four synthesis-sourced phenotypes both require reading
    those papers and judging whether they support the specific claims. That is
    curation judgement rather than a mechanical fix, and each of those four
    phenotypes already carries an honest note saying the source is an
    OMIM/Orphanet synthesis.

    A correction made during this session, recorded because it nearly shipped: the
    first draft of the PMID:24386581 evidence blocks carried a fabricated
    reference_title built from a sentence in the abstract body rather than the
    paper's actual title. It was caught by diffing against the cached frontmatter
    and corrected to the real title, "Successful Medical Therapy for
    Hypophosphatemic Rickets due to Mitochondrial Complex I Deficiency Induced de
    Toni-Debre-Fanconi Syndrome." Nothing in the validation stack checks
    reference_title against the cache, so this class of error is invisible to
    just validate, just validate-terms and just count-verified-snippets alike.

    Validation on the resulting file: just validate passed; just validate-terms
    passed; just count-verified-snippets reported 22/22 verified against cached
    references, up from 16/16; just check-duplicate-keys clean; just
    check-title-snippets reported no new title-quoting snippets. The full
    pytest tests/test_data.py run has one failure, in Travelers_Diarrhea.yaml
    (bare https:// URLs used as evidence references); it reproduces on a clean
    main checkout, is unrelated to this entry, and is being reported separately.

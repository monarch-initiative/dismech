    (4) a Genetic Counseling treatment (NCIT:C15240) and therapeutic_modality
    PROTEIN_REPLACEMENT plus a metformin-avoidance note on Insulin Therapy.
    Softened the duplication-junction -> cytochrome b / complex III causal claim to
    inference language in both the description and the downstream edge, since a
    duplication retains an intact cytochrome b copy and the source does not
    formally establish junction-mediated disruption. Insulin therapeutic_agent was
    intentionally omitted (NCIT:C2271 is outside the ChemicalEntityTerm enum root).

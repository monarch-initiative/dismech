  summary: Create Proximal tubulopathy-diabetes mellitus-cerebellar ataxia syndrome
  details: |
    De-novo entry for MONDO:0010798 (OMIM:560000, ORPHA:3390), an ultra-rare
    maternally-inherited mitochondrial-DNA-duplication multisystem syndrome, in
    response to curation issue #8849.

    Deep research: the skill default (falcon) and openai providers were both
    unavailable this run — the Edison/falcon API returned 402 Payment Required
    and the OpenAI key returned 401 invalid — so the claude_code provider was
    used. Its report validated clean (7/7 references verified, confabulation_rate
    0.0). The report also correctly surfaced the near-miss entities to keep
    distinct (RRM2B mtDNA-depletion with renal tubulopathy, BCS1L/GRACILE complex
    III, Wolfram, MIDD), matching the NEC caution flagged on the issue.

    Evidence is anchored on the defining single-family paper PMID:1531167 (Rotig
    et al. 1992, Am J Hum Genet) plus two mechanism reviews, PMID:9226223 (Renal
    failure from mitochondrial cytopathies, with Rotig as co-author) and
    PMID:38012047 (Mitochondrial Dysfunction in Kidney Tubulopathies). A causal
    pathograph was modeled: heteroplasmic partial mtDNA duplication at the
    ATPase6/cytochrome-b junction -> respiratory-chain complex III
    (ubiquinol-cytochrome c reductase) deficiency -> proximal tubular
    bioenergetic failure, pancreatic beta-cell dysfunction, and cerebellar/muscle
    energy failure -> renal Fanconi syndrome, mitochondrial diabetes, cerebellar
    ataxia, and ragged-red-fiber myopathy. The complex III localization is
    mechanistically coherent: the duplication junction disrupts cytochrome b, the
    only mtDNA-encoded complex III subunit.

    Honest-scope decisions: deafness, visual failure/blindness, and osteoporosis
    are recognized features in the OMIM/Orphanet clinical synthesis but are not
    stated in the index-family abstract, and the ORPHA:3390 structured-cache
    could not be built (Orphadata pinned-checksum drift on en_product1.xml), so
    those three phenotypes are curated description-only with no fabricated primary
    snippet. No nuclear-gene `genetic:` block was added because the lesion is a
    structural mtDNA rearrangement, not a point mutation.

    Validation: just validate (schema) passed; just validate-terms passed; just
    count-verified-snippets reported 13/13 verified against cached references; the
    batched just validate-disorders sweep (the CI check, --no-full-text) passed;
    check-duplicate-keys clean. Compliance 74.1% (weighted 74.5%).

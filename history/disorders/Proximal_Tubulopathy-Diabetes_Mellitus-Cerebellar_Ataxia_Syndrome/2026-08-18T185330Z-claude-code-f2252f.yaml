  summary: Apply pre-PR red-team review fixes
  details: |
    Applied fixes from an in-session fresh-context red-team review (dismech-pr-review
    skill), which found no integrity/NEC issues but flagged completeness gaps.
    Added: (1) a diagnosis section with two entries backed by existing verified
    PMID:1531167 snippets — skeletal muscle biopsy with respiratory-chain analysis

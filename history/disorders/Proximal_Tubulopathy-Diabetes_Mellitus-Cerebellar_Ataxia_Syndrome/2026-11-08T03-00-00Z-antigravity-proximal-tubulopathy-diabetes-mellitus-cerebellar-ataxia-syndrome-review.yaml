  summary: Enriched Proximal Tubulopathy-Diabetes Mellitus-Cerebellar Ataxia Syndrome with classifications, molecular function grounding on mtDNA duplication, phenotype categories, and treatment/diagnosis details.
  details: Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, KIDNEY_URINARY_TRACT, ENDOCRINOLOGY_METABOLISM, NEUROLOGIC) and mechanistic_category (mitochondrial disease) backed by PMID:1531167. Grounded Large-Scale Mitochondrial DNA Duplication with unmodified boundary-gene molecular functions (quinol-cytochrome-c reductase activity, proton-transporting ATP synthase activity) and restricted locations/cell types on the duplication and complex III nodes to directly assayed tissues (skeletal muscle and blood/lymphocytes). Added phenotype categories and refined diagnostic flags, enriched treatments with BYPASSES target mechanisms and consensus mitochondrial diabetes evidence (PMID:28749475), and completed diagnostic results.

  summary: Enriched Proximal Tubulopathy-Diabetes Mellitus-Cerebellar Ataxia Syndrome with classifications, molecular function grounding on mtDNA duplication, phenotype categories, and treatment/diagnosis details.
  details: Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, KIDNEY_URINARY_TRACT, ENDOCRINOLOGY_METABOLISM, NEUROLOGIC) and mechanistic_category (mitochondrial disease) backed by PMID:1531167. Grounded Large-Scale Mitochondrial DNA Duplication and downstream pathophysiology nodes with molecular functions (quinol-cytochrome-c reductase activity, proton-transporting ATP synthase activity), cellular components, cell types, and anatomical locations. Added phenotype categories and diagnostic flags, enriched treatments with action categories and target mechanisms, and completed diagnostic results.

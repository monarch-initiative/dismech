  summary: 'Create: Hypokalemic Tubulopathy and Deafness'
  details: |
    Curated a new Disease entry for hypokalemic tubulopathy and deafness (MONDO:0859167, KCNJ16) from the stub queue, resolving entry_type as DISEASE. Five pathophysiology nodes run from Kir5.1 loss of function, through failure of basolateral potassium recycling, to three parallel arms: disturbed proximal bicarbonate handling, impaired distal salt reabsorption, and cochlear potassium homeostasis failure. The structure follows the biology of an obligate partner subunit: Kir5.1 forms no homomeric channel, so its loss is expressed through the different heteromers it completes in each nephron segment, Kir4.2 proximally and Kir4.1 distally, which is why one gene produces a tubulopathy spanning two segments. Named Entity Confusion was the dominant risk and is recorded in notes. EAST_Syndrome is already curated and is caused by KCNJ10/Kir4.1, the obligate partner of the very channel disrupted here, so the entries necessarily resemble each other. The cited review states the discriminating differences directly: hearing loss and hypokalemia are shared, but KCNJ16 disease produces acidosis rather than the alkalosis of EAST/SeSAME, and the CNS is spared. No evidence was borrowed from the KCNJ10 literature. A second trap is recorded for the mouse model: the Kcnj16 knockout was published in 2011, a decade before the human entity was delineated in 2021, so its authors compared their acidotic mice against EAST/SeSAME and called the phenotype the opposite of it; read against the human disease now known, it anticipates rather than contradicts it. The animal_models block reports what the paper measured without attributing a comparison the authors could not have made, and carries typed SPECIES_MISMATCH and TEMPORAL_SCOPE divergences. Treatment is deliberately recorded without a target_mechanisms link because management is symptomatic electrolyte replacement, and the murine thiazide responsiveness is model data not human evidence. All 19 evidence snippets verified against the local reference cache; schema and term validation pass.

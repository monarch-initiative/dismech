  summary: Conform the cochlear ionic node to sensorineural_hair_cell_loss
  details: |
    Added conforms_to on the node modelling cochlear potassium or endolymph homeostasis failure, pointing at: sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress. This entry was surfaced by a census of GO:0071805 potassium ion transmembrane transport, which 28 non-conforming pathophysiology nodes bind with no module covering it. A generic potassium-transport module was considered and rejected: the binders span cortical neurons, cardiomyocytes, skeletal muscle membrane, renal tubule and stria vascularis with unrelated downstream chains, which fails the create-module bar that a module be one conserved mechanism with a single rate-limiting node. The cochlear subset does meet that bar, and the existing sensorineural_hair_cell_loss module already carries a node for it (Cochlear Ionic Homeostasis Disruption and Oxidative Stress, bound to GO:0055075 potassium ion homeostasis and naming the connexin potassium-recycling pathway), so these entries are wired to it rather than to a new and redundant module. No node content, evidence or edges changed.

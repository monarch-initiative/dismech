  summary: Fix cochlear anatomy error; add negative-result model
  details: |
    Acted on the REQUEST_CHANGES review on PR 10861. The blocking finding was a real scientific error and the reviewer was right: the cochlear node bound UBERON:0002282 stria vascularis and claimed Kir5.1 maintains the endocochlear potential there, but the review this entry itself cites assigns the stria vascularis and the endocochlear potential to Kir4.1 and places Kir5.1 in the root and spindle cells of the spiral ligament. That is precisely the KCNJ10 for KCNJ16 substitution the entry notes block was written to prevent, committed inside the entry whose whole point is that guardrail. Rebound to UBERON:0006725 spiral ligament, rewrote the description to state the Kir5.1 cochlear role as proposed rather than established, recorded the earlier error in the node description so it is not silently reintroduced, and added three evidence items quoting the compartment assignments and the proposed hedge. Fixed two evidence_source misgrades: the homomeric-channel statement is oocyte-derived so IN_VITRO, and the inner-ear expression statement rests on rodent immunohistochemistry so MODEL_ORGANISM. Mined the under-consumed cached review: the acid load test finding of preserved urinary acidification with absent ammonium rise now supports both the diagnosis block and the proximal node, since it is what separates this disease from a distal RTA; hearing loss carries childhood onset and the high-frequency pattern; the one reported alkalotic patient supports acidosis being FREQUENT rather than obligate; and the greater severity with Kir4.2 coexpression is recorded in genetic notes as the likely reason the proximal arm is prominent. Added a second animal model for the Lv et al. Kcnj16 knockout with normal hearing as FAILS_TO_RECAPITULATE against Sensorineural Hearing Loss with an INVALIDATING SPECIES_MISMATCH divergence, plus a HUMAN_MODEL_MISMATCH discussion, since evidence exists on both sides and disagrees rather than being absent. Added a notes line explaining the treatment is deliberately uncited because no cached source carries a management statement, and bound potassium chloride and sodium bicarbonate as therapeutic agents. All 33 snippets verified; schema, term, grading, length and offline gates pass.

  summary: Review X-linked Ohdo syndrome against primary clinical and mechanistic sources
  details: |-
    Read the complete original entry and CREATE history, the scientific deep-research report and citation list, all seven original reference caches, and additional primary and review sources. Consumed the original 2013 institutional full PDF, the relevant 2017 full-paper results and methods around the Ohdo assays and their allele-specific contexts, the full 2021 case report, the 2021 mechanistic review, the accepted 2022 neonatal manuscript, and the 2025 neural-model study. Mined the XLOS, diagnosis, inheritance, management, surveillance and variant sections of the full GeneReviews chapter. The two 2021 probands and maternal uncle constitute one extended family; inconsistent table entries were not substituted for case narratives. The 2013 HEK293 experiment establishes deficient REST-target repression with retained protein, Mediator incorporation and G9a binding; impaired recruitment at RE1 was proposed, not measured for the Ohdo variants. The 2017 Ohdo lymphoblastoid FOS/EGR1 result is separated from the extensive p.Arg1295His fibroblast experiments. The main text reports supplementary Figure S7; a separate supplement was not obtained. Recorded the 2025 Figure5A correction without implying a corrected Ohdo S7 result. Added two experimental models and scoped the single-donor differential-X-inactivation neural study in a knowledge-gap discussion. Removed male-only inheritance and unsupported population prevalence/frequency assertions; added documented heterozygous female expression, specific clinical findings, molecular diagnosis, care and differential diagnoses. ClinGen validity remains explicitly broader than the MKB subtype. One of 31 phenotypes has a causal graph link, through unknown intermediates; the other clinical manifestations have no established cellular-to-organ causal route in the consumed sources and are not assigned speculative edges. Live ClinicalTrials.gov registry verification identifies the observational adult GROW UR GENES study, which lists Ohdo syndrome without molecular subtype; recruitment status is dated and no efficacy or MKB-specific enrollment is inferred. Completeness assessment: phenotypes, genetics, mechanisms, diagnostics, care and references adequate; no established MKB subtypes. Broader MED12 findings and an unrelated methylation paper were not transferred to this entity. All cited titles were read and assessed for claim relevance. Source types reflect the quoted evidence, and review/background provenance is retained separately. Generated reference caches were obtained only with the repository fetcher; no cache was manually authored or edited.

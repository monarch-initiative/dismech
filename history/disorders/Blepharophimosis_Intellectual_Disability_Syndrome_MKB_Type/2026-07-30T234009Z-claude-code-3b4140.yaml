  summary: 'Create: Blepharophimosis-Intellectual Disability Syndrome, MKB Type'
  details: |
    Created a new de-novo entry for X-linked Ohdo syndrome / blepharophimosis-intellectual disability syndrome, Maat-Kievit-Brunner (MKB) type (MONDO:0010477, OMIM:300895), caused by hemizygous MED12 missense variants at Xq13.1. Duplicate preflight confirmed the entity was absent from origin/main: the existing Blepharophimosis_Ptosis_and_Epicanthus_Inversus_Syndrome entry is the distinct FOXL2 BPES disorder, and Mediator_Complex_Neurodevelopmental_Disorder covers FG/Opitz-Kaveggia but not the Ohdo/MKB form; no prior PRs or issues were found. An NEC preflight was performed against the MONDO record: causal gene MED12 was confirmed via the MONDO is_a MED12-related intellectual disability syndrome and the OMIM:300895 xref, distinguishing this entity from FOXL2-BPES and the KAT6B SBBYSS Ohdo type. GeneReviews baseline: PMID:20301719 MED12-Related Disorders was fetched, cached, and tagged in the top-level references block; its XLOS Clinical Characteristics of intellectual disability, blepharophimosis, and facial coarsening, plus the management and surveillance items covering hearing loss, dental anomalies, congenital heart defects, and genitourinary anomalies, were cross-referenced into the phenotypes and treatments sections. Deep research was run with the falcon Edison provider. Mechanism was curated as two pathophysiology nodes: MED12 missense disruption of the CDK8 kinase module of Mediator at MOLECULAR scale, and dysregulated immediate-early-gene and REST-dependent neuronal transcription with Wnt and SHH/GLI3 involvement at CELLULAR scale, sourced from PMID:33925166 and PMID:28369444. Gene-disease validity was additionally cited from the ClinGen Definitive X-linked assertion via CGGV, whose cache was built with just clingen-rebuild. Validated with just validate covering schema, term, and reference validation, all passing, and just compliance at 98.4 percent global and 100 percent weighted.

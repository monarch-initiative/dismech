  summary: 'Create: Blepharophimosis-Intellectual Disability Syndrome, MKB Type'
  details: |
    Created a new de-novo entry for X-linked Ohdo syndrome / blepharophimosis-intellectual disability syndrome, Maat-Kievit-Brunner (MKB) type (MONDO:0010477, OMIM:300895), caused by hemizygous MED12 missense variants at Xq13.1. Duplicate preflight confirmed the entity was absent from origin/main: the existing Blepharophimosis_Ptosis_and_Epicanthus_Inversus_Syndrome entry is the distinct FOXL2 BPES disorder, and Mediator_Complex_Neurodevelopmental_Disorder covers FG/Opitz-Kaveggia but not the Ohdo/MKB form; no prior PRs or issues were found. An NEC preflight was performed against the MONDO record: causal gene MED12 was confirmed via the MONDO is_a MED12-related intellectual disability syndrome and the OMIM:300895 xref, distinguishing this entity from FOXL2-BPES and the KAT6B SBBYSS Ohdo type. GeneReviews baseline: PMID:20301719 MED12-Related Disorders was fetched, cached, and tagged in the top-level references block; its XLOS Clinical Characteristics of intellectual disability, blepharophimosis, and facial coarsening, plus the management and surveillance items covering hearing loss, dental anomalies, congenital heart defects, and genitourinary anomalies, were cross-referenced into the phenotypes and treatments sections. Deep research was run with the falcon Edison provider. Mechanism was curated as two pathophysiology nodes: MED12 missense disruption of the CDK8 kinase module of Mediator at MOLECULAR scale, and dysregulated immediate-early-gene and REST-dependent neuronal transcription with Wnt and SHH/GLI3 involvement at CELLULAR scale, sourced from PMID:33925166 and PMID:28369444. Gene-disease validity was additionally cited from the ClinGen Definitive X-linked assertion via CGGV, whose cache was built with just clingen-rebuild. Validated with just validate covering schema, term, and reference validation, all passing, and just compliance at 98.4 percent global and 100 percent weighted.
    Post-drafting refinement after an internal red-team review (dismech-pr-review skill, run before opening a PR). The falcon Edison deep-research report (741s, 21 citations, 1 artifact) surfaced the Rocchetti two-family series (PMID:34573309), which supplies X-linked-Ohdo-SPECIFIC evidence for the facial gestalt and replaced a weaker keyword-inferred ptosis citation. Review findings addressed: (1) the ptosis evidence item, which originally leaned on a snippet that did not mention ptosis, was re-cited to PMID:34573309 and PMID:34670449, both of which state ptosis explicitly; (2) the hearing impairment, congenital heart defect, and genital-system phenotypes rest only on a GeneReviews MANAGEMENT list that pools manifestations across ALL MED12-related disorders rather than XLOS specifically, so each was downgraded from SUPPORT to PARTIAL and given an explicit scope-caveat note recording that GeneReviews characterizes XLOS narrowly as intellectual disability, blepharophimosis, and facial coarsening; (3) a diagnosis block was added from the previously unmined GeneReviews DIAGNOSIS/TESTING section plus the exome-sequencing route from PMID:34573309; (4) the two pathophysiology nodes were connected with downstream causal edges (CDK8-module disruption to transcriptional dysregulation to intellectual disability), making the pathograph a connected component; the edge to the cognitive phenotype is marked PARTIAL since it is inferred from cell-based work. Additional ocular and craniofacial phenotypes (downslanted palpebral fissures, hypertelorism, strabismus, narrow mouth) were curated from PMID:34670449 and PMID:34573309. All 31 evidence snippets were additionally verified by hand as exact whitespace-normalized substrings of their cached references, because the reference validator reported zero checks on this file. Final state: just validate passes (schema, term, and reference validation), compliance 98.8 percent global and 100 percent weighted.

    Known open item deliberately not resolved: the cited ClinGen assertion lumps X-linked Ohdo with FG and Lujan-Fryns under MONDO:0100000, whereas this entry keeps the MKB type split out as MONDO:0010477. The split follows MONDO/OMIM, which recognize the entity separately, and the shared kinase-module pathophysiology is acknowledged in the entry description; flagging here for curator adjudication rather than silently resolving.

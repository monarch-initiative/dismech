  summary: Review and enrich FBXO11-Related Neurodevelopmental Disorder
  details: 'Audited all claims and snippets and enriched FBXO11-Related Neurodevelopmental Disorder (MONDO:0060760).
    Moved affected-individual counts from uncited top-level description into evidence-backed ULTRA_RARE
    prevalence (>75 reported individuals, PMID:40114442; discovery cohorts of 20 and 24, PMID:30057029,
    PMID:30679813), added familial mother-and-daughters evidence to inheritance (PMID:32902151), and
    added categories, classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE), and references block.
    Enriched pathophysiology nodes with nuclear localization (GO:0005634), brain location (UBERON:0000955),
    neural progenitor cell type (CL:0011020), IN_VITRO biochemical evidence grading, and downstream causal
    links connecting all 19 phenotypes (including pooled Orofacial cleft HP:0000202 carrying the 3/20
    OCCASIONAL rate and Minor skeletal anomalies HP:0011842 with SOURCE_UNSPECIFIED). Added diagnostic
    testing entries (Whole Exome Sequencing NCIT:C101295, Array-based Comparative Genomic Hybridization
    NCIT:C198497), Genetic counseling (NCIT:C15240), treatment_effect BYPASSES on investigational proteasome
    activation, and hgnc:13590, CL:0011020, and primary evidence on experimental_models and animal_models.


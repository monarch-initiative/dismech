  summary: 'Create: FBXO11-Related Neurodevelopmental Disorder'
  details: |
    De novo curation of FBXO11-related neurodevelopmental disorder (IDDFBA, MONDO:0060760, OMIM 618089), claim issue #16137. Built a causal pathograph (FBXO11 haploinsufficiency -> decreased SCF(FBXO11) ubiquitin-ligase activity -> impaired SCF-dependent substrate degradation -> impaired neuronal proliferation/differentiation/migration -> disrupted neurodevelopment -> developmental delay/ID). Phenotypes, genetic block (AD, de novo, LOF), inheritance (de novo plus one documented AD-transmitted family), iPSC-neuron experimental model and Drosophila animal model, and treatments (supportive care; investigational proteasome-activating agents / verapamil). Primary sources: PMID:30057029 (Gregor 2018, defining 20-individual cohort), PMID:30679813 (Jansen 2019 cohort), PMID:29796876 (2018 cohort), PMID:32902151 (first AD-inherited family), PMID:40114442 (2025 iPSC/Drosophila model and proteasome-activation rescue). OpenScientist deep research was run (falcon unavailable: no EDISON/FUTUREHOUSE key); content was built primarily from the primary literature above and cross-checked. No GeneReviews chapter exists (just check-genereviews NO_CHAPTER; confirmed by PubMed genereviews[book] search on FBXO11 and the disease name). Validated: just validate, count-verified-snippets 27/27, validate-disorders, plus offline gates (entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, delivery-system, enum-values, duplicate-keys, logical-rules, gene-activity-grounding).

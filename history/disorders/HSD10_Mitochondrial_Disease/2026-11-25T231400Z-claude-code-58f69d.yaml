  summary: 'Gene-family review: HSD17B10'
  details: |
    HSD17B10 was on its variant node only, which binds no molecular function; the RNase P and isoleucine nodes carried the activities but not the gene. The gene now sits on both. The RNase P node binds ribonuclease P activity (GO:0004526) DECREASED, supported by its existing evidence that p.K212E impairs SDR5C1-dependent RNase P activities (PMID:26950678). The isoleucine node's (3S)-3-hydroxyacyl-CoA dehydrogenase term is replaced by the specific 3-hydroxy-2-methylbutyryl-CoA dehydrogenase activity (GO:0047015), the MHBD step the node describes (PMID:12696021). The genetic record, previously untyped, is CAUSATIVE with variant_origin GERMLINE, and ClinGen's Definitive classification for HSD10 mitochondrial disease (X-linked) is recorded in gene_disease_validity.

  summary: 'Create: Choroideremia-Deafness-Obesity Syndrome (Ayazi syndrome, MONDO:0010558)'
  details: |
    Created a new de-novo entry for choroideremia-deafness-obesity syndrome (Ayazi syndrome, MONDO:0010558), a rare X-linked Xq21 contiguous gene deletion syndrome. Modeled the Xq21 deletion resolving into three gene-loss arms: CHM/REP1 to progressive chorioretinal degeneration (choroideremia); POU3F4/DFN3 to congenital mixed hearing impairment (stapes fixation/perilymphatic gusher); and MRX-region genes (RPS6KA6/RSK4, ZNF711) to intellectual disability. 7 phenotypes, 4 genes, X-linked recessive inheritance, SNP-array/CMA diagnosis, ultra-rare prevalence, supportive treatments. Evidence: 6 primary references (Ayazi 1981 PMID:7258279; Nussbaum 1987 PMID:3476958; Merry 1989 PMID:2491012; Yntema 1999 PMID:10644430; Liang 2017 PMID:28630650; GeneReviews Choroideremia PMID:20301511), 26/26 snippets verified as exact substrings. NEC preflight confirmed the Xq21 contiguous-deletion entity OMIM:303110, distinct from isolated choroideremia OMIM:303100/MONDO:0010557, via the MONDO record plus all abstracts. Deep research: OpenScientist (requested) failed 3 consecutive full-length runs on persistent HTTP 522 gateway timeouts at its status endpoint; Edison/Falcon unavailable (EDISON_API_KEY rejected 403). Fell back to keyless claude_code provider, which produced a NEC-clean corroborating report (25 citations, 10 web searches) surfacing no new verifiable primary PMIDs beyond those cited. just validate passes (schema + terms + references). Pre-PR red-team review (dismech-pr-review subagent) addressed: generalized ID phenotype to HP:0001249 (severity varies moderate-severe), connected the ID pathograph arm, strengthened CHM causation snippet, added diagnosis section.

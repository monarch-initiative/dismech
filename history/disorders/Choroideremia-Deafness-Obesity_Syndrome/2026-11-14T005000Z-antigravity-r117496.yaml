  summary: Address Round 1 PR review feedback on Choroideremia-Deafness-Obesity Syndrome
  details: >-
    Split bundled MRX-Region Kinase and Transcriptional Dysregulation into separate
    RPS6KA6 (RSK4) Deficiency (hgnc:10435, GO:0004674 protein serine/threonine kinase
    activity, backed by PMID:10644430 with neuronal-development quote marked INDIRECT)
    and ZNF711 Deficiency (hgnc:13128, GO:0003712 transcription coregulator activity
    and GO:0003700 DNA-binding transcription factor activity, backed by abstract quotes
    from PMID:28630650, PMID:19377476, and PMID:20346720), dropping unsupported
    CL:0011020 and GO:0030182 bindings. Added ORPHA:1435 evidence on the Loss of
    Additional Xq21 Genes to Obesity edge, documented unresolved primary chorioretinal
    degeneration site on Progressive Chorioretinal Degeneration with PMID:30627697, and
    tightened the NEUROLOGIC classification explanation.

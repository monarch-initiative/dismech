  details: |
    Addressed PR #6695 review. Added SLC2A1/GLUT1 to genetic as the treatable must-exclude MAE subset (~4-5%), evidenced by Mullen 2011 (PMID:21555602, 4/84 MAE probands had SLC2A1 mutation) with a note on why the ketogenic diet works for this energy-metabolism branch. Added GABRG2 (hgnc:4087, the OMIM 616421 MAE-assigned GABA-A gamma-2 gene) as a structured SUSCEPTIBILITY entry. Added an ADHD comorbidity phenotype (HP:0007018) evidenced by the cohort paper (PMID:41523187, ADHD most common comorbidity 24/60 40%). Note: DR-suggested GABRG2 HGNC:4402 was a bad ID (GNG10); used verified hgnc:4087. All snippets verified exact; schema + term validation pass.

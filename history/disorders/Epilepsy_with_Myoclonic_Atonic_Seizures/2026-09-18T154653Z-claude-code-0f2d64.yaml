  details: |
    Weekly compliance pass. Weighted compliance 65.8% -> 88.7%; phenotype causal_inlink 0/7 -> 6/7. Added evidence to all five pathophysiology nodes that had none and all five downstream edges. Added six new downstream edges from the Myoclonic-Atonic and Generalized Seizures node to its phenotypes, which previously left every phenotype in the entry disconnected from the pathograph. Added evidence to the SCN1A genetic entry, the Valproate and Antiseizure Medication treatments, and two discussions. New references: PMID:19966779 (Cope 2009, enhanced tonic GABAA inhibition in absence models) supplies the GAT-1 loss-of-function paradox resolution the doose-gat1-lof-paradox discussion asks about; PMID:35840120 (Mermer 2022, astrocytic GAT-1 deficit, SLC6A1 knock-in mouse) supplies the thalamocortical and spike-wave steps; PMID:20301494 (SCN1A GeneReviews) supports MAE within the SCN1A spectrum. Deliberately left uncited: GABRG2 and SCN1B genetic entries (no MAE-specific quotable source found), the sodium-channel-blocker aggravation claim, and the prevalence rate. Validated with just validate (36/36 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-grading, check-title-snippets, check-snippet-length.

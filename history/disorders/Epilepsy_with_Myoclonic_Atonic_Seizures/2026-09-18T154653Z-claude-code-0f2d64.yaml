  details: |
    Weekly compliance pass. Weighted compliance 65.8% -> 88.7%; phenotype causal_inlink 0/7 -> 6/7. Added evidence to all five pathophysiology nodes that had none and all five downstream edges. Added six new downstream edges from the Myoclonic-Atonic and Generalized Seizures node to its phenotypes, which previously left every phenotype in the entry disconnected from the pathograph. Added evidence to the SCN1A genetic entry, the Valproate and Antiseizure Medication treatments, and two discussions. New references: PMID:19966779 (Cope 2009, enhanced tonic GABAA inhibition in absence models) supplies the GAT-1 loss-of-function paradox resolution the doose-gat1-lof-paradox discussion asks about; PMID:35840120 (Mermer 2022, astrocytic GAT-1 deficit, SLC6A1 knock-in mouse) supplies the thalamocortical and spike-wave steps; PMID:20301494 (SCN1A GeneReviews) supports MAE within the SCN1A spectrum. Deliberately left uncited: GABRG2 and SCN1B genetic entries (no MAE-specific quotable source found), the sodium-channel-blocker aggravation claim, and the prevalence rate. Review round 1 (#12139): the GeneReviews chapter PMID:20301494 was cited in the SCN1A genetic evidence but not tagged, so check-genereviews reported CITED_UNTAGGED; just tag-references added the top-level references: block and it now reports TAGGED. The four PMID:19966779 items were regraded directness DIRECT -> INDIRECT, because two inference steps separate that paper from this entry's claims: it measures rats and mice rather than humans, and it studies typical absence epilepsy, which it never relates to myoclonic-atonic epilepsy. The PMID:35840120 knock-in-mouse spike-wave item was regraded for the shorter version of the same reason, murine measurement of an MAE-derived allele. Each explanation now names the extrapolation rather than leaving it to the grade. The PMID:25865495 snippet quoted in two places was extended from "...reduced GABA re-uptake from the" to a complete clause ending "from the synapse"; the cache is hard-wrapped at that point and the validator normalizes the wrap, so both occurrences still verify. Validated with just validate (36/36 snippets verified), validate-terms, check-genereviews, check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-grading, check-title-snippets, check-snippet-length, check-enum-values.

  summary: 'Create: Epilepsy with Myoclonic-Atonic Seizures (Doose)'
  details: |
    De-novo curation of epilepsy with myoclonic-atonic seizures (EMAtS / Doose syndrome, MONDO:0014633), a pediatric-epilepsy gap entry. Granular unbundled pathophysiology: genetic susceptibility (SLC6A1 GAT-1, GEFS+-spectrum SCN1A/SCN1B) -> impaired GABA transporter (GAT-1) function -> disrupted GABAergic inhibitory balance -> thalamocortical hyperexcitability (conforms module) -> generalized spike-wave -> myoclonic-atonic and generalized seizures (conforms). Evidence: Carvill 2015 (PMID:25865495, SLC6A1/GAT-1 LoF in MAE, 4% of unsolved cases), Lancet Neurol review (PMID:40120618, ketogenic diet + variable outcome), outcomes cohort (PMID:41523187, 61.7% seizure-free). Treatments: ketogenic diet (notably effective), valproate, AEDs with sodium-channel-blocker caution. Three KNOWLEDGE_GAP discussions: GAT-1 loss-of-function epileptogenic paradox, genetic heterogeneity/prognosis, ketogenic-diet mechanism/outcome. claude_code deep research used as leads; NEC clean (SLC6A1/MAE, MONDO:0014633 OAK-verified, distinct from SCN1A-Dravet). All snippets verified exact; schema + term validation pass.

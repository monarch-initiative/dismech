  summary: Add ILAE classification, phenotype evidence, and reference titles
  details: |
    Weekly compliance pass, classifications focus. Added a classifications block with a single harrisons_chapter NEUROLOGIC assignment backed by the ILAE Task Force on Nosology and Definitions childhood-onset syndromes position paper (PMID:35503717), which lists epilepsy with myoclonic-atonic seizures among the childhood-onset developmental and/or epileptic encephalopathies. A notes line records why no GENETICS_ENVIRONMENT_DISEASE Part was added: EMAtS is genetically heterogeneous and SLC6A1 explains only about 4 percent of otherwise unsolved cases. Added evidence to the five previously unevidenced seizure phenotypes from the 2025 Lancet Neurology review (PMID:40120618, already cached). Backfilled reference_title on all nine PMID-backed evidence items via scripts/add_pmid_titles.py. Validated with just validate: snippets checked 15/15 verified. Weighted compliance 43.1 to 65.8 percent.

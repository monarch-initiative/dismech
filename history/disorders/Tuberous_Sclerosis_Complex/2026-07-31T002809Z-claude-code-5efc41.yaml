  summary: Deep curation of TSC1 subtype (tuberous sclerosis 1)
  details: |
    Deep curation focused on the TSC1 subtype ("tuberous sclerosis 1") of the existing Tuberous Sclerosis Complex entry.

    Deep research provider: the requested Edison/Falcon provider could not be used. The EDISON_API_KEY present in the session environment was rejected with HTTP 403 Forbidden by Edison's auth endpoint (api.platform.edisonscientific.com/auth/login), reproduced by direct curl outside the client to rule out a proxy/TLS issue. A key update was made in the cloud-environment config, but per that dialog such changes apply only to new sessions and did not reach this already-running session. Deep research was therefore run with the claude_code provider instead (research/Tuberous_Sclerosis_1-deep-research-claude_code.md; 14 web searches, 16 turns, ~6 min). The report was treated as leads only, not ground truth.

    Ontology work: discovered and bound the dedicated MONDO subtype term MONDO:0008612 "tuberous sclerosis 1" (is_a MONDO:0001734 tuberous sclerosis; xref OMIM:191100; RO:0004003 to HGNC:12362 TSC1) as has_subtypes[TSC1].subtype_term, verified via OAK. Added the TSC1 gene descriptor (hgnc:12362) to the subtype.

    Content added, anchored on two verified landmark genotype-phenotype cohorts newly fetched and cached for this session (PMID:11112665 Dabora 2001, n=224; PMID:10205261 Jones 1999, n=150 families):
    - Expanded the TSC1 subtype description: milder phenotype across seizures, intellectual disability, subependymal nodule and cortical tuber burden, kidney involvement, and facial angiofibroma; uniformly truncating variant spectrum versus TSC2's missense-inclusive spectrum; significant enrichment in familial versus sporadic TSC.
    - Added 5 evidence items to the TSC1 subtype.
    - Added structured Genetic.case_fractions for TSC1 across three independent cohorts (15.1 percent Dabora, 18.3 percent Jones, 17.0 percent Dufner-Almeida) with cohort sizes and per-estimate evidence, complementing the coarse free-text range. Updated the TSC1 genetic notes and added 2 evidence items covering the truncating-variant spectrum and familial enrichment.
    - Added TSC1-versus-TSC2 genotype qualifiers plus supporting evidence to four phenotypes where these cohorts report TSC1-specific rarity, absence, or reduced severity: Retinal Hamartoma, Fibrous Cephalic Plaque, Renal Cyst, and Renal Angiomyolipoma.

    Deliberately NOT done: no separate kb/disorders/ file was created for TSC1. It is a subtype of the existing Tuberous_Sclerosis_Complex entry (has_subtypes), and MONDO:0008612 is_a MONDO:0001734, so splitting it out would duplicate the shared mTORC1 pathograph. The TSC2/PKD1 contiguous deletion phenomenon was explicitly kept scoped to TSC2; the deep-research report flagged the risk of conflating it with TSC1.

    Validation: just validate passes for the entry (schema, term, and reference validation). All 8 new and reused snippets were independently confirmed as exact whitespace-normalized substrings of their cached abstracts. The reference validator was additionally negative-tested with a deliberately fabricated snippet to confirm it was actively checking rather than silently passing; it correctly reported an error at the right location.

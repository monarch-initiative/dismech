  summary: Deep curation of the TSC2 (tuberous sclerosis 2) subtype
  details: |
    TSC2-focused deep curation of the existing Tuberous Sclerosis Complex entry.

    Scope decision: "Tuberous sclerosis 2" (MONDO:0013199) is the gene-specific
    Mendelian subtype of tuberous sclerosis (MONDO:0001734) and was already modelled
    as a has_subtypes entry in this file. Per the design-decision register (separate
    file only for a distinct MONDO identity AND a substantially independent
    mechanism), TSC2 shares the TSC1/TSC2-RHEB-mTORC1 mechanism, so it was deepened
    in place as a subtype rather than split into a new disorder file.

    Deep research: Edison Scientific (falcon provider) via deep-research-client
    --provider falcon, disease_name="Tuberous Sclerosis 2", mondo_id=MONDO:0013199.
    Output: research/Tuberous_Sclerosis_2-deep-research-falcon.md (700s runtime, 34
    citations, 1 artifact). NEC preflight passed: TSC2 mentioned 86x vs TSC1 26x, and
    OMIM:613254 present matching the MONDO:0013199 xref. The Edison report cites by
    DOI rather than PMID, so DOIs were resolved to PMIDs via the PMC ID Converter and
    each cited abstract was fetched with `just fetch-reference` before any snippet was
    written; report content was treated as leads only, never as ground truth.

    GeneReviews baseline (mandatory step): PMID:20301399 (Northrup/Koenig/Pearson/Au,
    updated 2024-08-01) fetched, cached, and tagged GeneReviews in the top-level
    references block. Clinical Characteristics were cross-referenced against the
    existing phenotypes list; two documented manifestations were absent and have been
    added - renal oncocytoma (HP:0011798) and multifocal micronodular pneumocyte
    hyperplasia (HP:0033328). The GeneReviews "Agents/circumstances to avoid"
    (smoking, estrogen use, nephrectomy) is now captured on the Renal AML
    Embolization or Nephrectomy treatment.

    Changes:
    - has_subtypes: bound subtype_term for TSC2 to MONDO:0013199 and TSC1 to
      MONDO:0008612; both were previously unbound.
    - pathophysiology: new MOLECULAR-scale node "TSC2 GAP Domain Catalytic Loss
      (Structural Basis of Genotype Severity)", subtype-tagged to TSC2, giving the
      structural rationale for the TSC2-over-TSC1 severity gradient - cryo-EM shows
      only TSC2 contributes the catalytic GAP domain, with an asparagine thumb N1643
      driving RHEB GTP hydrolysis while TSC1 acts as scaffold (PMID:33436626). Wired
      as a downstream edge from the germline first-hit node.
    - pathophysiology: added independent-second-hit evidence (PMID:25432535) to the
      Somatic Second Hit node; TSC1-vs-TSC2 LAM cyst-burden evidence (PMID:19419980);
      and cardiac rhabdomyoma genotype-regression evidence (PMID:41361250).
    - genetic: added structured case_fractions for both TSC1 and TSC2 across two
      cohorts - the 106-case molecularly-solved series at 17%/83%, and the
      2093-patient TOSCA registry at 19.7%/63.3%. The two use different denominators
      (solved cases vs molecularly tested patients) and this is stated explicitly in
      each record's notes. Also added TSC2 intragenic variant-class severity
      stratification (PMID:22189265).
    - phenotypes: TOSCA SEGA genotype evidence (bilateral 34% vs 18%, growing 16% vs
      4.5% for TSC2 vs TSC1, PMID:28057044); RCC frequency and onset with TSC2
      p.R905Q second-hit context; plus the two new GeneReviews phenotypes above.

    Validation: `just validate` (schema + term + reference) passes. The reference
    validator was adversarially spot-checked by substituting a fabricated snippet,
    which correctly errored - confirming snippet checking was actually exercised
    rather than silently skipped by its pass-through caching. Note the validator
    strips square brackets, so GeneReviews quotes were chosen bracket-free.

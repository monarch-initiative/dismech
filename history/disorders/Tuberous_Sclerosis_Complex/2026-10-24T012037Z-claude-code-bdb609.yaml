  summary: 'Genetics pass: reconnect the retinal lesion node, wire four phenotypes,
    remove three stale PARTIAL claims'
  details: |
    Genetics pass for issue 12278 (series-071), one of four parents deferred from PR 13315.

    Measured before and after with dismech.qc_plugins: phenotype causal inlink
    24/38 to 28/38; pathophysiology nodes with no incoming causal edge 2 to 1, the
    remaining one being the germline first hit, which is correctly a root. Genes
    wired 2/3 unchanged; the third genetic record is Somatic Mosaicism, which binds
    no gene_term and so cannot wire.

    The checklist row was already curated before this pass, and the mechanism is
    worth recording because it is one of the ways a CURIE grep returns a
    misleading answer: MONDO:0008612 is the subtype_term of the TSC1 has_subtypes
    row, which binds hgnc:12362 and carries nine evidence items, and it is also
    discussed by CURIE inside the deep-research audit paragraph of the entry's
    notes. Both children of this entry's MONDO:0001734 are bound as rows, so the
    anchor passes the reciprocal test exactly. No gene or subtype content was
    needed.

    The defect the pass actually found is one neither wiring metric nor
    check-causal-targets reports. Retinal Hamartoma Formation was the only lesion
    node in the entry with no incoming causal edge: the mTOR-Driven Multisystem
    Hamartoma Growth node reaches its five siblings and skipped it, so that node
    and the Retinal Hamartoma phenotype below it were a disconnected island, and
    the node carried no evidence of any kind. Both are fixed. The evidence is a
    population-based paediatric cohort (PMID:37991117, fetched for this pass)
    reporting retinal astrocytic hamartomas and achromatic patches at 34% each,
    which is what the node already asserted without a citation.

    Four phenotypes that nothing pointed at are now wired: focal-onset seizures
    from the cortical dysplasia node, whose existing edge to Epileptic Seizures
    already said focal-onset in its own description without reaching the focal
    phenotype; fibrous cephalic plaque from the cutaneous hamartoma node, which
    already reaches five of the six cutaneous lesions GeneReviews lists together;
    multifocal micronodular pneumocyte hyperplasia as the second pulmonary lesion
    rather than a consequence of LAM; and chronic kidney disease from the renal
    angiomyolipoma node.

    Ten phenotypes are left with no incoming causal edge on purpose, each for the
    same recorded reason: the entry's sources establish that the feature occurs in
    TSC without placing it downstream of a mechanism modelled here. Cardiac
    arrhythmia is the case most tempting to wire and is recorded in full, because
    both available sources co-locate arrhythmia with rhabdomyoma as the cardiac
    manifestations without asserting a direction, and the consensus text pairs
    echocardiogram with rhabdomyoma and ECG with arrhythmia as two separate
    assessments. Renal cell carcinoma and renal oncocytoma are neoplasms rather
    than hamartomas and the entry has no renal-neoplasia node to put them under.

    Three evidence explanations described their own item as PARTIAL, the supports
    value retired in issue 10003, while the items read SUPPORT; that is prose making
    a false statement about the entry's own data. Each one's substantive
    qualification was kept and the reference to the retired grade removed. The only
    remaining occurrences of that string in the file are the unrelated
    PARTIALLY_RECAPITULATES model-link enum and the notes sentence describing this
    fix.

    Validation on the final tree: just validate, just validate-terms and
    just count-verified-snippets clean; 197/197 snippets verified after reverting
    the validator's reference-cache renormalisation.

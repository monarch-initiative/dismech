  summary: Map Tuberous sclerosis to OMIMPS:191100
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS191100 contains TSC1-related tuberous sclerosis 1 (OMIM:191100) and TSC2-related tuberous sclerosis 2 (OMIM:613254), matching the two children of MONDO:0001734 and the two gene-defined forms curated here. Loss of the TSC complex and increased mTORC1 signaling support one multisystem Disease, with gene-associated severity differences retained internally. The clinical syndrome scope includes the TSC component of TSC2-PKD1 deletions and mosaic or molecularly unresolved presentations already discussed in the entry; it does not attribute their additional PKD1 effects to TSC2. The mapping is not a synonym for all mTORopathies, isolated sporadic TSC-mutant tumors, or polycystic kidney disease.

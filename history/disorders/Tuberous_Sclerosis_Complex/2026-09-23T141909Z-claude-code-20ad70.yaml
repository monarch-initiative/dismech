  details: |
    Reviewer read the full text of PMID:35084981 and found two errors: the limitations line said the cerebral organoids were not patient-derived (they are iPSC-derived from TSC2 patients with isogenic controls), and the spheroid link to Somatic Second Hit at TSC Locus was graded HIGH while the same paper reports wild-type TSC2 in over 98% of giant cells and concludes bi-allelic inactivation is dispensable for disease initiation. Fixed the prose, lowered the spheroid link to MODERATE with a CONTESTED_ASSUMPTION divergence, and added a FAILS_TO_RECAPITULATE link from the cerebral organoid model to the second-hit node with a full-text snippet, so the disagreement between the two human models is now recorded structurally.

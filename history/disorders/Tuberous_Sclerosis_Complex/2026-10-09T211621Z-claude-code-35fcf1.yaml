  summary: 'Review round: narrow the CYP3A5 pharmacology claim on sirolimus'
  details: |
    Review of PR #13676 found the description asserting that sirolimus elimination is primarily mediated by CYP3A5, sourced only to PPR:PPR1307616 and narrower than that preprint's own body text, which names CYP3A5 and CYP3A4 as the core functional isoenzymes. The description now states CYP3A metabolism with CYP3A5 as the polymorphic determinant of exposure, and carries the developmental qualifier that explains the reported case: CYP3A4 activity is negligible in the neonatal period, so neonatal clearance depends almost entirely on CYP3A5. The contested quote was replaced by three evidence items, each citing the sentence that carries its own claim - the CYP3A route (REVIEW_SYNTHESIS, from the preprint's pharmacology review), the loss-of-function variant effect on exposure, and the neonatal CYP3A4 sentence - so the developmental claim no longer rests on the single case report. A treatment notes line records why the genotype effect is not an effect_modifiers row (one neonate, no comparator stratum, no interaction test) and where a cohort source would go.

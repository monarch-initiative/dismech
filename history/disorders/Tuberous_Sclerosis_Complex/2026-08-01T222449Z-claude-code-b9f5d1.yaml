  summary: 'Enrich TSC entry from verified subset of Falcon TSC1 deep-research report
    (PR #7301)'
  details: |
    Acted on @cmungall's change request on PR #7301 ('incorportate deep research into main yaml'). Mined research/Tuberous_Sclerosis_1-deep-research-falcon.md and added only what survived independent verification against freshly fetched references_cache entries.

    NEC preflight: report subject entity is TSC1-related TSC (MONDO:0008612, hgnc:12362), the TSC1 subtype of this entry's MONDO:0001734. TSC2 content in the report is expected partner-gene context, not drift. No named-entity confusion.

    Provenance of report citations: the report cites sources by DOI only (no PMIDs). Resolved 13 DOIs via NCBI esearch; 11 resolved to real PubMed records whose author lists matched the report. Seven were new to this entry and were fetched with 'just fetch-reference': PMID:33041968 (TOSCA renal), PMID:32982929 (TOSCA QoL), PMID:40579409 (Sicilian TSC1/TSC2 cohort), PMID:33041976 (mTOR gliopathy review), PMID:38783199 (iPSC neurovascular-unit BBB), PMID:32555378 (Danish mutational analysis), PMID:37041855 (treatment-resistant TSC epilepsy). Two cited sources have no PubMed record and were not used (a bioRxiv preprint and a doctoral dissertation the report mislabels as ArXiv). All 6 NCT IDs were verified against the ClinicalTrials.gov v2 API and all matched.

    Added: 4 TSC1-vs-TSC2 genotype-phenotype evidence items on the TSC1 subtype (TOSCA renal genotype effect incl. the by-age-40 convergence, and three Sicilian-cohort findings); a new clinical_burden block (TOSCA QoL, 3 evidence items, with a notes block correcting the abstract's unstated denominators); a new pathophysiology node 'mTOR-Driven Gliopathy and Neurovascular Unit Dysfunction' (5 cell types, 3 GO processes, 4 evidence items, 3 downstream edges); 6 new phenotypes (Focal-Onset Seizures, Cerebral Hypomyelination, Depression, Aggressive Behavior, Sleep disturbance, Chronic Kidney Disease); 2 TOSCA evidence items on renal angiomyolipoma onset/peak; 4 everolimus tolerability evidence items plus a notes block; 2 early-treatment-rationale evidence items on the vigabatrin node; 2 new genetic case_fractions (Danish 25%, Sicilian 38.3% with an ascertainment caveat) and 2 TSC1 gene/functional-assay evidence items; a new experimental_models block for the iPSC BBB chip; 5 new clinical trials; and a Falcon report audit in top-level notes.

    Rejected and recorded in notes: the report's LAM 30-40%/pneumothorax 70% figures attributed to PMID:32982929 (that paper contains zero occurrences of either term); the ~90% TAND figure attributed to PMID:37041855 (absent from the abstract); the 'cortical tubers 67.8% / SEN 51.6%' rates from PMID:40579409 (the paper reports proportions with MORE THAN 5 lesions, not presence rates); and all quantitative claims sourced to full-text page ranges of PMID:34399110, whose cached record is abstract-only. Pneumothorax was not added as a phenotype after searching ORPHA:805 and PMIDs 38991206, 39334956, 20301399, 33041968, 38042867 on 2026-08-01 and finding no supporting text.

    No frequency band was taken from report prose. All new bands come from Orphanet's curated HPO annotations for ORPHA:805, which state their own percentage ranges. Cerebral Hypomyelination carries no frequency and says why. Caught and corrected one ontology label drift: Orphanet renders HP:0002360 as 'Sleep abnormality'; the canonical HPO label is 'Sleep disturbance'.

    Validation: just validate PASS, just validate-terms PASS, just validate-references 153/153, scripts/check_snippets_verbatim.py 153 verified 0 failed (118 before), check_folded_hyphens --check OK, validate-history-all PASS.

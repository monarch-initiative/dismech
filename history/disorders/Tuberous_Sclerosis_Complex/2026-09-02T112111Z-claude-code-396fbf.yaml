  summary: 'Integrate assessed OpenScientist findings: mTORC1 boundary conditions'
  details: |
    Assessed the OpenScientist hypothesis-search report for
    canonical_tsc1_tsc2_mtorc1_hyperactivation_model and integrated its
    RETAINED and QUALIFIED claims into this entry. Assessment sidecar:
    kb/hypotheses/Tuberous_Sclerosis_Complex/canonical_tsc1_tsc2_mtorc1_hyperactivation_model/assessments/openscientist-assessment-by-claude-opus-5.yaml
    (verdict PARTIALLY_SUPPORTED, 15 claims). Every snippet below was copied
    from the local reference cache after `just fetch-reference`, never from the
    report, which quotes full text and paraphrases.

    The entry's mechanistic_hypotheses notes already narrated the report's
    "seven qualifications" in prose, but carried a single citation. The work
    here was to attach that prose to sources and to place each qualification on
    the node it actually bears on.

    Added (16 new evidence items, all snippet-verified; 154 -> 170):
    - mechanistic_hypotheses (canonical model): PMID:31217257 REFUTE - the
      Class I randomised trial showing everolimus does not improve IQ, autism,
      or neuropsychological function in children 4-17, which refutes the
      pharmacologic-validation corollary for the neuropsychiatric arm only;
      PMID:26837766 REFUTE - mTOR pathway not activated in half of human
      mesenchymal tumours, refuting "nearly every organ system".
    - pathophysiology#Somatic Second Hit at TSC Locus: PMID:27494029 SUPPORT
      (biallelic loss in 30/32 angiomyolipoma/LAM samples, median 4 other
      somatic coding mutations) and PMID:26837766 REFUTE (haploinsufficiency
      alone initiates and sustains mesenchymal tumorigenesis in TSC2+/- mice).
      Description amended to scope the two-hit requirement to the classic
      hamartoma classes.
    - pathophysiology#Pulmonary Lymphangioleiomyomatosis Growth: PMID:24395886
      SUPPORT (estradiol-driven COX-2 induction unaffected by rapamycin,
      reduced by Torin 1 and Rictor knockdown). Description amended to record
      the mTORC2-dependent arm.
    - pathophysiology#mTOR-Driven Gliopathy and Neurovascular Unit Dysfunction:
      PMID:26003087 SUPPORT (IL-1beta and CXCL10 elevated at 2 weeks, before
      seizure onset, in Tsc1-GFAP CKO mice) and PMID:24948799 SUPPORT
      (oligodendrocyte-specific TSC1 ablation is sufficient for
      hypomyelination; myelination needs balanced, not merely reduced, mTORC1).
    - pathophysiology#Neuroglial Dysplasia and Cortical Network Disorganization:
      PMID:38714540 SUPPORT (SST+ interneurons immature in TSC patient tissue,
      abnormal NKCC1/KCC2 ratio).
    - phenotypes#Cerebral Hypomyelination: PMID:32954437 SUPPORT (n=46 resected
      tubers; reduced oligodendroglia associated with lower IQ, lower MOBP with
      ASD) - the human correlate the description previously asserted without a
      source.
    - treatments#Vigabatrin for Infantile Spasms: PMID:41061327 and
      PMID:32705817 both REFUTE, against the entry's own prevention rationale;
      plus a notes block recording that the rationale has now been tested twice
      and failed twice, and that the infantile-spasms indication is unaffected.
    - treatments#mTOR Inhibitor Therapy (Everolimus): PMID:30192751 SUPPORT for
      the previously uncited "cytostatic rather than curative" note, quoting
      the sentence that also carries the authors' own limit ("no evidence of
      rapid regrowth").
    - inheritance#Somatic Mosaicism: PMID:39352229 SUPPORT (72% yield, 10/13
      mosaic, multi-tissue deep sequencing), upgrading the notes from
      "postulated" to a measured result.

    Added a new discussions block with two KNOWLEDGE_GAP entries:
    gap_tsc_tand_not_reversible_by_mtorc1_inhibition (why the one causal edge
    in this entry that no drug has moved is unresolved between "edge is wrong",
    "window has closed", and "parallel mechanisms", with a pre-emptive-infant
    trial as the discriminating experiment) and gap_tsc_mtorc1_independent_arms
    (RHOA, HMGA2, and mTORC2-estradiol arms, with a lesion-class attribution
    experiment).

    Deliberately NOT integrated:
    - The report's Phase III trial table, which mislabels its citations:
      PMID:24729041 is the angiomyolipoma subgroup of EXIST-1 (NCT00789828),
      not EXIST-2 (NCT00790400); PMID:23325902 is the extension of phase 1-2
      trial NCT00411619, not EXIST-1; and the 35%-vs-0% figure is quoted from a
      drug-profile review, PMID:23231513, not a trial report. The numbers are
      accurate to their real sources, so nothing is fabricated, but citing
      "EXIST-2" from that table would cite the wrong study. Recorded as the
      REJECTED claim exist-trial-citation-misattribution.
    - The report's attribution of rapalogue cytostasis to "paradoxical
      autophagy induction", which no cited source supports.
    - PMID:41789478 (DEPDC5 mosaic organoids). Real and as described, but it is
      focal cortical dysplasia, not TSC; the report's promotion of it to
      cross-disease validation of the TSC model is provider inference.
    - The report's proposed ontology terms. CL:0000254 was suggested for SST+
      interneurons and does not denote one; no new CURIE was bound anywhere in
      this edit, and the SST+ finding is carried as evidence prose instead.
    - Status change: none. The report itself recommends retaining CANONICAL,
      and the qualifications narrow the model's scope rather than displacing it.

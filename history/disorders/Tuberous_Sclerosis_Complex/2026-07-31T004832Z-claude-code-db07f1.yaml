  summary: Address red-team review findings on the TSC2 deep curation
  details: |
    Follow-up to the TSC2 deep curation in the preceding history record, addressing
    findings from an internal pre-PR red-team review of that change.

    Corrections to factual/claim-evidence accuracy:
    - The cryo-EM description of the TSC complex contained two errors, both checked
      against PMID:33436626 full text and corrected. It previously said "two TSC1
      coiled-coil dimers", which implies four TSC1 molecules and contradicts the
      2:2:1 stoichiometry stated in the same sentence; the paper describes TSC1a and
      TSC1b coiled coils interwinding in parallel as a single two-helix bundle. It
      also said TBC1D7 helps "cradle" the TSC2 dimer, whereas the paper states
      TBC1D7 "has no direct contact with TSC2" and is "positioned far away from the
      central core". What is cradled is the two TSC2 GAP domains, by the TSC2
      dimerization domain plus the TSC1 central coiled-coil. A second evidence item
      quoting the TBC1D7 sentence was added to anchor the correction.
    - The claim that TSC2 supplying the catalytic subunit provides "a structural
      rationale for why TSC2-related disease is on average more severe" was not
      supported by either cited source and is mechanistically incomplete (TSC1 loss
      also destabilizes TSC2 and abolishes complex GAP activity in vivo). It is now
      framed as a candidate structural contribution, with the other established
      contributors named: TSC2's larger mutational target size, higher truncating
      allele burden, rarity of pathogenic TSC1 missense variants, and ascertainment.
      The PMID:38540392 evidence item was downgraded SUPPORT to PARTIAL, since it
      supports only the within-complex domain claim, not the between-gene gradient.
    - Two explanations overstated PMID:25432535. "A distinct, independent second-hit
      TSC2 mutation in nearly every tumor" and "each of their multiple renal tumors
      harboured an independent somatic TSC2 second hit" are both contradicted by the
      abstract: the yield was 5/5 sequenced tumors in patient 1 but only 1/2 in
      patient 2, and only 1 of 11 further available tumors from patient 1 carried an
      identified second hit. Both now scope the claim to the sequenced subset and
      state the counts.

    Caveats added where sample size did not support the framing:
    - The TOSCA SEGA genotype comparison now states the denominator is the 207
      genotyped SEGA patients (not 2,093), notes the TSC1 arm is n=22 vs n=185 so
      "4.5% growing" is a single patient, and records that TOSCA reports no
      significance test for the comparison.
    - The cardiac rhabdomyoma genotype-regression explanation now notes the authors
      describe it as a trend requiring confirmation in larger prospective studies.

    Placement/sourcing fix:
    - The GeneReviews "smoking; estrogen use" avoidance items had been written into
      the description of a renal AML embolization/nephrectomy treatment, with an
      unsourced rationale sentence. They are moved to the sirolimus/LAM treatment
      where they are clinically relevant, with the GeneReviews evidence item
      attached; the nephrectomy item stays on the renal treatment. The unsourced
      "principally because they aggravate lymphangioleiomyomatosis" phrasing is gone.

    Graph and naming:
    - The new pathophysiology node was a dead end (incoming edge only). It now emits
      a downstream edge to Constitutive mTORC1 Hyperactivation, whose description
      notes that full constitutive activation in a lesion clone additionally
      requires biallelic loss via a somatic second hit.
    - The node was renamed from "TSC2 GAP Domain Catalytic Loss (Structural Basis of
      Genotype Severity)" to "TSC2 GAP Domain Catalytic Loss" to match the
      event-name convention used by sibling nodes; the referring edge target was
      updated in lockstep and the foreign key re-verified.

    GeneReviews mining completed (the prior record used only 2 of 4 abstract
    sections):
    - New inheritance block bound to HP:0000006, penetrance COMPLETE, expressivity
      VARIABLE, citing the GeneReviews genetic-counseling text for the autosomal
      dominant mode, the one-third inherited / two-thirds de novo split, and the 50%
      offspring recurrence risk, plus PMID:41361250 for near-complete penetrance
      with marked intrafamilial variability. The entry previously had no inheritance
      block at all.
    - New diagnosis block bound to MAXO:0000533 molecular genetic testing, citing
      the GeneReviews DIAGNOSIS/TESTING text and noting that molecular testing
      complements rather than replaces the clinical criteria.

    Validation: just validate (schema + term + reference) passes. Pathograph
    connectivity and subtype foreign keys re-checked programmatically after the
    rename.

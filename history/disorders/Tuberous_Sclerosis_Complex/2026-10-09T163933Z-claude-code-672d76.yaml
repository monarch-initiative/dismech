  details: |
    ClinGen unpublished its 2019 Definitive gene-disease validity assertions for TSC1 (CGGV:assertion_61b07bb0-...) and TSC2 (CGGV:assertion_0b0a33ff-...): on 2026-10-09 both report ids returned ClinGen's invalid-identifier page, both rows were absent from the gene-validity export, and the TSC1 and TSC2 gene pages listed no validity curation. The two evidence items quoting those rows were replaced by Orphanet's gene-disease rows from ORPHA:805 (already cited by the entry), with the withdrawal recorded in each explanation; the two orphaned CGGV cache files were removed. No other content changed. Validated with just validate-disorders, count-verified-snippets, check-reference-titles, check-entity-refs and check-duplicate-keys. Found by the CGGV currency census in dismech issue 13576.

  summary: 'Create: Acute Ackee Fruit Intoxication'
  details: |
    New entry for acute ackee fruit intoxication (MONDO:0019140), Jamaican vomiting
    sickness. Selected from a shared Toxicologic Phenocopy Atlas of 48 exposure-gene
    pairs as the one case that could actually be curated here: it has a specific
    MONDO term, it was absent from the KB, and both of its Mendelian mimics were
    already curated (MCAD_Deficiency, Multiple_Acyl-CoA_Dehydrogenase_Deficiency), so
    the differentials resolve rather than dangle.

    Mechanism: hypoglycin A is a protoxin. Metabolism converts it to
    methylenecyclopropylacetyl-CoA, which is a suicide substrate that covalently
    modifies the flavin of acyl-CoA dehydrogenases and takes activity below 2
    percent. Beta-oxidation stops, ketogenesis and gluconeogenesis fail together, and
    the hypoglycaemia that follows is profound and recurrent.

    Pathograph: 8 nodes, fully connected, all five phenotypes wired. 4 conforms_to
    against metabolic_intoxication_decompensation.

    THE ATLAS CLAIM WAS NOT CURATED AS GIVEN. The atlas calls this a Tier 1 phenocopy
    of MCAD deficiency and states the shared lesion as MCPA-CoA inhibiting the
    MEDIUM-chain acyl-CoA dehydrogenase. The two primary enzyme papers say the
    opposite for that substrate: PMID:1247597 found octanoyl-CoA and palmitoyl-CoA
    activity unaffected in hypoglycin-dosed rat liver mitochondria while butyryl-CoA
    activity was drastically reduced, and PMID:7275979 found octanoyl-CoA affords
    strong protection against the inactivation. Octanoyl-CoA is MCAD's substrate.

    What the clinical and veterinary literature supports is the broader claim, and it
    has a name: PMID:23167695 calls hypoglycin A a cause of ACQUIRED multiple
    acyl-CoA dehydrogenase deficiency, with acylcarnitine and organic acid profiles
    typical for MADD. This entry therefore curates a multi-enzyme block, names MADD
    as the closer phenocopy, and keeps MCAD deficiency as a differential with the
    octanoyl-CoA evidence attached to explain why the resemblance is clinical rather
    than enzyme-level. The node notes state the disagreement, name the 1976 and 1981
    dates and species, and say plainly that those results are enough to decline
    naming the medium-chain enzyme but not enough to settle it.

    The phenocopy is more precise than the atlas allows in one further respect.
    Genetic MADD is ETFDH, ETFA and ETFB, which is the electron acceptor. Hypoglycin
    destroys the dehydrogenases that feed it. The lesions sit one rung apart on the
    same electron path and the downstream biochemistry does not separate them, which
    is recorded in the MADD differential.

    Reye syndrome is curated as a third differential, with the sentence from
    PMID:940578 that historically separated them.

    Evidence: 43 items over 9 references, every snippet pre-verified against the local
    cache before writing. Human anchors are PMID:28613753 (clinical syndrome),
    PMID:940578 (MCPA in the urine of two patients, dicarboxylic acids 70 to 1000
    times normal, and the Reye distinction), PMID:8185109 (canned-product case
    outside the endemic area) and PMID:30056267. Enzyme mechanism from PMID:1247597
    and PMID:7275979. The acquired-MADD framing from PMID:23167695 and PMID:23773055,
    both equine, cited for the toxin rather than for the species and graded
    MODEL_ORGANISM.

    FOODON:03301360 akee (raw) bound on the environmental food_source slot, following
    the pattern already used in Gout and Celiac_Disease. Raw rather than canned
    because the toxin is in unripe fruit; the canned route is documented in the
    Toledo case and noted, and the slot takes a single term.

    Deep research: three falcon reports via Edison. Two were the same trajectory
    returned twice and the duplicate was deleted rather than committed. The third
    (c8f13af1) differed substantively and is the reason this entry has a knowledge
    gap. Run one named MCAD and IVD among the inhibited enzymes; run three said
    "multiple acyl-CoA dehydrogenases" and named neither. Two runs of the same
    provider on the same question disagreeing on exactly the disputed point is better
    support for declining to name the enzyme than either run alone.

    Run three also presented a dual-target mechanism as established for this disease:
    hypoglycin A to MCPA-CoA blocking the dehydrogenases at step one, and MCPG to
    MCPF-CoA blocking the enoyl-CoA hydratases at step two. The framework is real and
    PMID:34765670 states it for the maple toxins in a foal. For ackee it is not
    established. PMID:30056267 says outright that MCPG exposure has not been
    evaluated in cases of Jamaican vomiting sickness. It is curated as a
    KNOWLEDGE_GAP discussion attached to the central node, with two proposed
    experiments, and the discussion notes record that the report did not carry the
    distinction.

    PMID:30056267 also closed two gaps this entry had recorded against itself: the
    unripe-fruit claim and the US import regulation behind the canned route.

    NEC preflight returned SKIP (MONDO records no causal gene for a poisoning) and
    was cleared manually: top gene mentions were MADD, ACADM and IVD.

    Falcon token note: two token copies on disk (dismech and deep-research-client)
    both returned 403 on a live probe; a replacement provided during the session
    authenticated. The plain `providers` listing reports Available on presence of the
    variable alone, so `providers --check` is the one that tells the truth.

    Validation: just validate-disorders (the batched sweep CI runs) passed; 43/43
    snippets verified; check-folded-hyphens, check-duplicate-keys,
    check-title-snippets, check-environmental-evidence and check-entity-refs all
    clean. All reference_title values generated programmatically from the cache.

    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised four items. All four
    addressed. The reviewer confirmed the MCAD/MADD refusal and the MCPG
    quarantine as correct; the items were coverage gaps rather than errors.

    1. No biochemical: section, and it carried the entry's own thesis. The
       description leads with the dicarboxylic aciduria and the MADD-like
       acylcarnitine profile, and both were prose only. Four biochemical entries
       added with readouts joining them to the mechanism nodes, following the
       pattern in Multiple_Acyl-CoA_Dehydrogenase_Deficiency.yaml: urinary
       dicarboxylic acids with the named analytes, urinary short-chain fatty
       acids, the MADD-typical acylcarnitine profile, and MCPA-carnitine. Two
       carry notes recording that the acylcarnitine profile and the carnitine
       conjugate are demonstrated in horses while the human evidence is the
       urinary organic acids.
    2. Coma was in a snippet already quoted twice and never modelled. Added as a
       phenotype with a downstream edge from the encephalopathy node.
    3. THE ONE THAT MATTERS. The Reye differential asserted that both diseases
       "show microvesicular steatosis on biopsy" while the entry curated no
       histology and the attached snippet supports only generic "clinical and
       histologic similarities". This is the same defect the reviewer caught on
       the isoniazid entry, where prose asserted what the evidence did not carry,
       and where I said I would read description against evidence before pushing.
       I did not extend that check to differential_diagnoses prose. The claim is
       removed; the resemblance is now stated at the level the source states it,
       with the entry saying plainly that it does not curate the histology.
    4. No animal_models: despite three mechanistic claims resting on equine data.
       Equine atypical myopathy added with modeled_mechanisms on the activation
       node (RECAPITULATES, HIGH) and the beta-oxidation node
       (PARTIALLY_RECAPITULATES, MODERATE), the limitations line carrying the
       muscle-versus-CNS divergence, and readouts on both. The foal hydratase
       paper is deliberately left in the knowledge-gap discussion rather than
       moved here, since a single animal with a suspected additional sensitivity
       is not a property of the model.

    Two suggestions taken: dextrose bound to CHEBI:17234 as therapeutic_agent, and
    the PMID:1247597 whole-study conclusion regraded from IN_VITRO to OTHER
    because it spans both the rat and the enzyme-preparation arms.

    One suggestion declined with reason: HP:0001985 Hypoketotic hypoglycemia is
    the more specific binding and would strengthen the phenocopy claim, but the
    cited source says only "profound hypoglycemia". The binding stays at
    HP:0001943 until a source supports the hypoketotic qualifier.

  summary: Add bounded zebrafish toxin-screening model after review
  details: |
    Addressed the optional 2024 zebrafish-model completeness finding in PR 12412 after generating PMID:39459322 with just fetch-reference and reading the entire cached scientific body, including Results, Discussion and Methods. Added a shared-toxin embryo/larval screening model with HGA-to-MCPA-carnitine and acylcarnitine-profile readouts. Both links are indirect, low-fidelity proxies: the active CoA ester, individual activating/inhibited enzymes and fatty-acid flux were not directly measured. Pooled whole-body metabolomics and locomotor experiments each had one experimental replicate; toxicity assays used biological triplicates. Immersion beginning at 24 hpf differs from human ingestion and does not establish human hypoglycemia, reduced ketogenesis or clinical antidote efficacy.

    Recorded reduced 72-hour mortality with simultaneous glycine/carnitine co-treatment and no riboflavin protection in this protocol, with residual cardiac abnormalities among survivors. This is not delayed rescue of established poisoning. The MCPrG-negative exposure result is qualified by unresolved absorption/activation and does not imply mammalian safety. Avoided inconsistent LC50/EC50 numerical summaries and the Discussion's broader low-concentration behavioral claim; retained only the measured pattern and explicit experimental limits. Added the missing StatPearls reference tag using the sanctioned tagger. Hepatic steatosis remains a qualified pathology observation from the confounded case, and the fatal transplant outcome was already represented in both clinical findings and supportive care.

    An independent full-source model audit found no causal-scope blocker and refined the timing description: high MCPA exposure caused effects within hours, whereas HGA toxicity appeared later. Authoritative schema, live terms and all 143 snippets pass. Structural/source/history checks and commit hooks are run before publication. No reference cache was hand-edited and frozen dataset-accession data were never accessed.

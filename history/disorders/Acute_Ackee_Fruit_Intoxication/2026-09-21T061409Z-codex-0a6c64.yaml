  summary: Review ackee poisoning mechanism, human evidence and supportive care
  details: |
    Comprehensive review of the original entry, matching deep-research narrative and citation sidecar, every original cited abstract and every available actual cached full body. Corrected the mistaken inference that substrate protection spares MCAD: purified-enzyme evidence supports selective irreversible SCAD/MCAD/isovaleryl-CoA inhibition, with isoform and assay differences. Replaced bundled mechanisms with 12 atomic nodes and explicit indirect human translation. Separated hypoglycin transamination, MCPA-CoA generation, dehydrogenase inhibition, fatty-acid oxidation, acetyl-CoA, ATP, estimated PC flux, endogenous glucose production, ketogenesis, cerebral injury and hepatic injury. Rat intravenous MCPA bypasses oral exposure and transamination; quantitative changes are protocol-specific. Removed universal CoA depletion, increased peripheral glucose clearance, fixed residual enzyme activity and indistinguishable inherited-MADD claims.

    Fourteen clinical findings, clinical diagnosis, human versus veterinary exposure biomarkers, six supportive/preventive care approaches, progression and outbreak ascertainment are covered. Vomiting and hypoglycemia are not obligatory. Preserved the severe hepatic case with positive pathology/laboratory/outcome quotes and unconfirmed exposure plus sickling-related ischemic confounding. No toxin-specific transplant success rate, vitamin/antidote efficacy, mandatory negative inherited-disease sequencing, universal human hypoketosis or fatal-cohort case-fatality estimate is inferred. Human plasma and urine analytical validation are not diagnostic sensitivity estimates; one-volunteer exposure and maple-poisoned horse values are not clinical ackee cutoffs.

    Read complete cached bodies for the analytical papers PMID30056267 and 26328472, sibling series26324727, metabolic rat study29483297, hepatic case23259140, comparative foal34765670, the 2017 diabetic case PDF, full updated NBK431101 chapter and final FDA2014 food guidance. The chapter was consumed across clinical characteristics, diagnosis, management and prevention; no disease-specific GeneReviews chapter applies to this acquired intoxication. Read all original and newly recovered abstracts, including2331485,10028981,16749544,21324617,21410289,33233889,6488562,3030285 and518564. Historical enzyme full text7275979 was independently read from a public author display, but its generated cache remains abstract-only after publisher retrieval failures. Other unrecovered historical full methods are not claimed as consumed. Three animal and two experimental models retain species, dose, preparation, measured endpoint and causal-rescue limits.

    Independent peer audits checked enzyme selectivity and clinical/care evidence. The tracked modern PMC HTML fallback is included as a separate prerequisite commit for reproducible generation of the sibling full-text cache; generated cache contents were never hand-edited. Frozen dataset-accession data were never accessed. The final entry passes authoritative schema, live ontology and 135 exact-snippet validations; local integrity guards and full node-class resolution are documented in the PR. The review leaves uncertainties explicit in knowledge gaps instead of treating speculative MCPG contribution, maternal transfer or human modifier genotypes as established.

  summary: 'Create: SHILCA_Syndrome'
  details: |
    New entry for SHILCA syndrome (MONDO:0031007), the syndromic NMNAT1 disorder that Leber_Congenital_Amaurosis_9 explicitly excludes. Curated as a separate Disease because its multisystem phenotype reflects a deeper NMNAT1 dosage loss than LCA9. Phenotypes, inheritance and variants come from the only two SHILCA reports: Bedoni 2020 (PMID:32533184, abstract only) and Abad-Morales 2021 (PMID:33668384, PMC full text). Mechanism nodes use NMNAT1 mouse and human iPSC evidence (PMID:34878972, 33107823, 39446354, 22842230), marked INDIRECT where applied to SHILCA by inference; NAD+ has not been measured in SHILCA patients. Deep research was requested from falcon, which is not configured here; the run used --fallback and openscientist produced research/SHILCA_Syndrome-deep-research-openscientist.md (18/18 references resolved; one unsupported quote, PMID:41922335, not cited here). just preflight-dr returned SKIP because MONDO records no causal gene for the term; manual check found the report is about NMNAT1/SHILCA (OMIM 619260; the report's OMIM 608553 is the NMNAT1 gene record). The report's Orphanet-derived features (ORPHA:611207, e.g. platyspondyly, dental findings) were not added because Orphadata could not be downloaded through the network proxy, so the record could not be cached and quoted. The report's NMNAT1-LCA natural-history paper (PMID:39710161) was not used because it concerns LCA9, not SHILCA. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (44/44), check-entity-refs, check-causal-targets and validate-disorders. A fresh-context self-review before the PR led to: the extra-retinal NAD+ edges grouped under an EMERGING mechanistic hypothesis with a KNOWLEDGE_GAP discussion (NAD+ unmeasured in patients); fibroblast RNA-seq regraded IN_VITRO; GO:0006915 replaced by GO:0008219 cell death, since NMNAT1 loss kills photoreceptors by several pathways; single-patient features marked as such in description and notes; scoliosis and biconcave vertebral bodies added from the second report's comparison with the index cases; additional retinal and skeletal edges wired.

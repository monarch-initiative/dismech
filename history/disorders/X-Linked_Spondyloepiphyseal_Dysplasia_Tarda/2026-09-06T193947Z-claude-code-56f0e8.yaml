  summary: 'Create: X-Linked Spondyloepiphyseal Dysplasia Tarda'
  details: |
    De novo curation of X-linked SEDT (MONDO:0010737, TRAPPC2/sedlin). An openscientist deep-research report was generated, passed the Named Entity Confusion preflight, and was used as leads; every PMID taken from it was independently verified against PubMed and all resolved correctly. Six pathophysiology nodes trace loss of sedlin through impaired Sar1 cycling to failure of COPII megacarrier formation, procollagen retention in dilated rough ER (the one step observed in human cartilage), defective growth-plate chondrogenesis and secondary mechanical osteoarthritis. Two KNOWLEDGE_GAP discussions record the unexplained tissue restriction of a ubiquitous TRAPP defect and the anomalous D47Y allele, which is expressed and correctly folded. Report-cited arthroplasty outcome papers were not curated because they are about spondyloepiphyseal dysplasia generally rather than SEDT. Validated: just validate (36/36 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys all pass.

  summary: Map lymphatic malformation 4 (MONDO:0014393) onto the existing VEGFC lymphedema
    entry
  details: |
    Claim #15938 asked for a new entry for lymphatic malformation 4 (MONDO:0014393, OMIM:615907, hereditary lymphedema 1D), defined in MONDO as hereditary lymphedema caused by VEGFC mutation. This entry already curates exactly that disease (heterozygous VEGFC loss of function, Milroy-like lower-limb lymphedema, Chy-3 and Vegfc+/- mouse models, Milroy disease differential) under the Orphanet-derived sibling class MONDO:0035500 (Orphanet:569821). A second entry would duplicate it, so MONDO:0014393 is recorded as a skos:exactMatch mondo_mapping, LMPHM4 synonyms are added, and the lump/split note is corrected: it said MONDO:0035500 is gene-defined, but its MONDO definition is clinical and the gene-defined class is MONDO:0014393. Both MONDO terms were read from EBI OLS (labels, definitions, xrefs, parents: both sit directly under MONDO:0019313 lymphatic malformation with no subsumption). The stub stubs/Lymphatic_Malformation_4.yaml is deleted as curated by mapping. Checked with just validate, validate-terms, count-verified-snippets and the offline gates.

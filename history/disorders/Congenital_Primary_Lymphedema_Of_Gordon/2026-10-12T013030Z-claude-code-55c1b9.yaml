  summary: 'Review round 1: add diagnosis and missing splice alleles'
  details: |
    Response to the first review of PR 13902. Added a diagnosis section with two rows. Molecular testing of VEGFC and FLT4 is bound to NCIT:C15709 Genetic Testing and quotes PMID:24744435 and PMID:30071673. Lymphoscintigraphy is bound to NCIT:C67262 Lymphoscintigraphy and quotes PMID:33407666 and PMID:30071673. Both NCIT terms were looked up with runoak via ols:ncit. Added the two splice alleles c.148-3_148-2delCA and c.552G>A as separate variants. Both are quoted from the summary of earlier families in the PMID:30071673 full text, marked quote_role REVIEW_SYNTHESIS, because the original Fastre 2018 letter has no abstract. Regraded the evidence on the haploinsufficiency to VEGFR3 edge from OTHER to HUMAN_CLINICAL with directness INDIRECT. Added evidence to the hypoplasia to lymphoscintigraphy edge. Hydrocele and hand-edema edges stay unevidenced because no source sentence states the causal link. Added a Cellulitis phenotype (HP:0100658), explicitly marked as extrapolated from primary lymphedema in general (PNDS, PMID:33407666): it has no frequency and is linked by an INDIRECT_UNKNOWN_INTERMEDIATES edge. Clarified that the PMID:24744435 family was fully penetrant while penetrance overall is incomplete. Shortened the GeneReviews note. Re-ran validate, validate-terms, count-verified-snippets (54/54), the offline gates, check-gene-activity-grounding, compliance-connectivity, check-coarse-phenotypes and validate-disorders.

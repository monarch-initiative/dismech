  summary: 'Create: Congenital_Primary_Lymphedema_Of_Gordon'
  details: 'New entry for MONDO:0035500 (VEGFC-related congenital primary lymphedema), anchored on the
    MONDO label and its RO:0004003 causal gene hgnc:12682 VEGFC.


    Lump/split: a standalone gene-defined Disease. FLT4-related Milroy disease (MONDO:0007919) is a differential
    diagnosis, not a subtype; the KB has no Milroy entry.


    Sources. First curated from PubMed: the founding family (PMID:23410910), a stop-gain family (PMID:24744435),
    a splice-site family whose full text pools phenotypes across five families (PMID:30071673), a biallelic
    case (PMID:32592340), the Vegfc+/- and Chy-3 mouse models (PMID:14634646, PMID:17584866), a lymphatic-anomaly
    review (PMID:35817543) and an Italian panel cohort with no VEGFC findings (PMID:29906362). A falcon
    deep-research report (research/Congenital_Primary_Lymphedema_Of_Gordon-deep-research-falcon.md) was
    then generated: 11/11 references resolved, with no off-topic or unresolved references. Its only term-validation
    flag is a template artifact, the MONDO ID labelled ''if available''. just preflight-dr could not run:
    it requires the ~1.3 GB local MONDO build, which was not downloaded because disk space was limited.
    Named-entity confusion was checked by hand instead. The report is about VEGFC/Gordon throughout (VEGFC
    50 mentions, FLT4 6, only as the Milroy differential), and every source it cites is a VEGFC or general-lymphedema
    paper. Reconciled from the report, all quoted from fetched caches: the secretion defect of the c.571_572insTT
    protein, quoted from the PMID:30071673 full text and marked quote_role BACKGROUND; ADAMTS3-CCBE1 proteolytic
    activation of VEGFC (PMID:27159393); the p.Ser65Arg variant and its processing defect (PMID:32592340);
    and two primary-lymphedema management sources for compression therapy (PMID:33407666 French national
    protocol, PMID:33502936). Not taken from the report: generic primary-lymphedema complications such
    as cellulitis and fibroadipose change, which are not documented in VEGFC cases, and the Lymfactin
    trials, which tested secondary lymphedema only. Fastre et al. 2018 (PMID:29542815) is a letter with
    no abstract and was not cited.


    Pathophysiology is a four-node chain: VEGFC haploinsufficiency -> reduced VEGFR3 signaling -> dermal
    lymphatic hypoplasia -> impaired lower-limb drainage. It is wired to the lymphedema, hydrocele, hand
    edema, toenail and lymphoscintigraphy phenotypes. Prominent superficial veins are left unconnected
    because no mechanism has been reported. Frequencies come from the pooled counts in PMID:30071673.
    There is no ClinGen CGGV record and no GeneReviews chapter (check-genereviews --online: NO_CHAPTER).


    Validated with just validate, validate-terms, count-verified-snippets (44/44), check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets,
    check-gene-activity-grounding (against origin/main), compliance-connectivity, check-coarse-phenotypes
    and validate-disorders.'

  summary: 'Publication-readiness review: Alsahan-Harris Syndrome'
  details: |
    Independently reviewed the complete TBC1D32-related Alsahan-Harris syndrome
    entry for publication readiness. Re-anchored inheritance, gene-disease,
    diagnosis, and hypopituitarism claims to the dedicated biallelic
    loss-of-function series; added the original OFD-IX discovery report and the
    2025 spectrum expansion; and expanded the core human phenotype set with
    exact-quote evidence.

    Repaired module-conformance and causal-edge semantics, added biological
    scales and edge-level evidence, documented the Xenopus model and closest
    molecular differential, and made the absence of supported treatments,
    disease-specific trials, reusable datasets, and computational models
    explicit. Added open limitations for cross-tissue model fidelity and the
    penetrance of newly proposed hearing and ocular-motility findings.

    Generated new reference caches only with `just fetch-reference`. Validated
    schema conformance, ontology identifiers and canonical labels, all evidence
    snippets, causal and history foreign keys, and targeted repository tests.
    Restored all unrelated validator-generated reference-cache churn.

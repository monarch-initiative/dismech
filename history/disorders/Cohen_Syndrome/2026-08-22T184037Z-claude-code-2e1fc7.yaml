  summary: 'Create: Cohen syndrome (VPS13B, MONDO:0008999)'
  details: |
    Curated de novo while reviewing Mendelian intellectual disability coverage; absent from kb/disorders despite being one of the better-known recessive ID syndromes. Deliberately curated in the same pass as the chromatinopathy work as a non-chromatin counterexample - Cohen syndrome does NOT conform to the epigenetic_machinery_neurodevelopmental_dysregulation module and should not be wired to it. Five-node pathophysiology built on intracellular membrane biology rather than chromatin: VPS13B loss of function -> impaired Golgi membrane expansion and integrity (central_effector) -> two parallel effector branches, defective glycosylation and secretory output, and adipocyte insulin-response dysregulation -> multisystem developmental and haematologic phenotype. The adipocyte branch is the substantive curation decision: GeneReviews states the teenage truncal weight gain occurs without any change in appetite, food intake or activity, and cell work in two independent models shows accelerated insulin-driven adipogenesis with subsequent AKT2 insulin resistance, so the obesity is curated as a cell-intrinsic adipocyte phenotype rather than an appetite phenotype. That non-hyperphagic character is also the discriminator carried in the Prader-Willi differential. The Golgi-expansion mechanism is curated with the source authors' own hedging preserved in the evidence explanation - they write raise the possibility and may - so the node reads as a well-supported model rather than a settled mechanism. A hypomorphic exon-31-skipping allele producing attenuated disease without microcephaly or characteristic facies is recorded so absence of those features does not exclude the diagnosis. Prevalence deliberately not curated as a numeric rate: the disorder is enriched in Finland through a founder variant, so a single worldwide band would misrepresent it. The described cheerful and friendly disposition is kept as prose and intentionally not bound to an HP term, being a gestalt impression rather than a measurable finding. Validation: linkml-validate clean; linkml-term-validator passed (VPS13B hgnc:2183 confirmed against OAK rather than assumed); 28 of 28 snippets verified against cached references.

  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Added classifications.iuis_category: phagocyte defect to the existing classifications block (harrisons_chapter: NEUROLOGIC only).

    IUIS 2022 Table 5, section 1 (Congenital Neutropenias), cache line 2963: 'Cohen syndrome VPS13B AR 607817', affected cells N, affected function myeloid differentiation, associated features dysmorphism, mental retardation, obesity, deafness and neutropenia.

    The classification is not orphaned: this entry already carries a Neutropenia phenotype, describing the mild-to-moderate neutropenia present in almost all affected individuals. The notes point at it, and repeat that phenotype's own caveat that the mechanism linking VPS13B loss to the neutropenia is not established. Because iuis_category is single-valued, the notes also record that the tag says Cohen syndrome occupies a Table 5 row rather than that it is primarily an inborn error of immunity - the entry is otherwise curated as a Golgi-membrane intellectual-disability syndrome.

    Evidence cites PMID:35748970 with the row quoted verbatim, stopping at the line end so as not to cross the fused affected-cells/affected-function column boundary on the following line ('NM yeloid').


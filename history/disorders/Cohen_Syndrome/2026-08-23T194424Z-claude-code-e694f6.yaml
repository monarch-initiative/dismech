  summary: 'Review: drop unevidenced cell-type binding; trim evidence overreach'
  details: |
    Adversarial pathograph and evidence-claim review of the entry created earlier in this branch. Two repairs. (1) The 'Defective Glycosylation and Secretory Output' node carried a neutrophil cell-type binding, but neither cited source establishes any mechanism linking VPS13B or Golgi dysfunction to the neutrophil lineage - the binding asserted a mechanistic claim the evidence does not make. Removed, and the node description now records the gap explicitly: no cell type is bound because the route from Golgi dysfunction to the near-universal neutropenia is not established, so neutropenia stays curated as a phenotype rather than as a mechanistic claim. (2) An evidence explanation on the adipocyte node reached past its snippet to the increased type 2 diabetes risk; rewritten to stay within the quote and to preserve the source's own hedge, which says decreased AKT2 phosphorylation 'suggests' insulin resistance.

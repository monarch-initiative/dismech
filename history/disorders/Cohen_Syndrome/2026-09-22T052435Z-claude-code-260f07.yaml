  summary: 'Review: connect Cohen syndrome''s twelve detached phenotypes (IUIS Table
    5)'
  details: |
    All twelve phenotypes were detached from a chain that already converged on a multisystem node. All twelve now attach there.

    The neutropenia edge states what the classification rests on: it is usually intermittent and rarely severe, but it is the immunological basis for this disease appearing in the IUIS phagocyte table at all. Truncal obesity is drawn as INDIRECT_KNOWN_INTERMEDIATES because the entry models an adipocyte insulin-response arm upstream; the musculoskeletal features are INDIRECT_UNKNOWN because no cited source traces the route from a Golgi defect to joint laxity or spinal deformity.

  summary: 'Create: PANDAS, with the PR #7458 review round folded in'
  details: |
    Creation of the PANDAS entry, plus the review round on PR #7458. One record, because no history record was ever added for the original creation (blocking item 6 of the review).

    Original curation: Falcon deep-research-sourced, MONDO:0019020, curated as the streptococcus-defined subset of PANS with the boundary held consistently across both entries and the grouping.

    Item 4, a node whose snippet did not carry its claim. The node "Post-streptococcal molecular mimicry" rested on a quote reading only "are clinical conditions characterized by the sudden onset of obsessive-compulsive disorder and/or tics" - which mentions neither mimicry, nor antibodies, nor cross-reactivity, and whose explanation bridged the gap with the curator's own inference. Replaced with two snippets that state the claim directly: the molecular-mimicry result from PMID:39325550, where microbial antigens were sufficient to compete away autoantibody reactivity with D1R and D2R, and the cross-reactivity statement from PMID:26657857. The original definitional sentence is retained on the same node in its untruncated form.

    Item 3, a mid-clause truncation. That same quote began after the sentence's subject and stopped before the trailing "in a group of children with streptococcal infection", dropping both the entity being defined and the streptococcal association. Replaced with the complete sentence from PMID:34778136.

    Item 5, a dangling causal edge. The target "Acute-onset OCD and tics" matched no node or phenotype name. Split into four resolving edges - obsessive-compulsive behavior, tics, anxiety, emotional lability - each INDIRECT_UNKNOWN_INTERMEDIATES.

    Item 2, no treatments block. Added three records sourced from the cached full text of the 2024 Delphi consensus PMID:39512340: anti-streptococcal antibiotic therapy (with a target_mechanisms link to the mimicry node, since eradicating the antigen is where the drug meets this entry's mechanism), antibiotic prophylaxis as a separate record because the consensus is explicit that acute-phase effectiveness and prophylactic effectiveness are different questions and the latter is unestablished, and CBT with SSRIs. All snippets extracted programmatically from the cache, which is a PDF-derived text with ligature corruption in places.

    Two references that the review found listed but never used turned out to be unusable, and were repaired rather than consumed as suggested. DOI:10.1038/npp.2012.56 (rat model of Sydenham chorea) and DOI:10.1172/JCI80792 (GAS intranasal infection, Th17 CNS infiltration) both cache with content_type unavailable and an empty body - nothing could have been quoted from either, which is the likely reason they were left uncited in the first place. Both resolve to PubMed records carrying full text, PMID:22534626 and PMID:26657857, and both are now consumed:

    - PMID:22534626 became an animal_models entry, the GAS-antigen-exposed male Lewis rat, with a modeled_mechanisms link to the antibody node (RECAPITULATES, MODERATE fidelity, model_scale ORGANISM) and three MODEL_ORGANISM evidence items covering the antibody deposition, the behavioural readout, and the pharmacological rescue. Its limitations record that immunisation with antigen plus adjuvant is not natural infection, that induced grooming is an analogue of compulsion rather than OCD, and that the model was built for Sydenham chorea, which shares the mechanism but not the PANDAS criteria. This is the entry's first MODEL_ORGANISM evidence, which the review noted neither entry had.
    - PMID:26657857 became a new pathophysiology node, "Th17-mediated CNS entry and blood-brain barrier breakdown", wired upstream of the antibody node. The humoral arm alone does not explain how cross-reactive antibodies reach neurons, and this is the only cited account of that step. The node's notes record that it is entirely mouse-derived and that no human demonstration exists, which is why its downstream edge is indirect with unstated intermediates.

    Suggestions taken: temporality RECURRENT on the OCD and tic phenotypes, capturing the episodic relapsing-remitting course the description already mentioned in prose; evidence added to the previously uncited Tics, Anxiety and Emotional lability phenotypes; NCIT:C124351 Clinical Evaluation in place of NCIT:C15220; differential_diagnoses for Sydenham chorea, Tourette syndrome and PANS itself; a CONTROVERSY discussion rather than a KNOWLEDGE_GAP, because the open question here is whether the construct picks out a disease entity at all rather than a missing measurement; biological_scale on all three nodes.

    Enuresis is deliberately unwired for the same reason as in the PANS entry, recorded on the phenotype.

    Validation: just validate passes with 19/19 snippets verified, up from 5/5.

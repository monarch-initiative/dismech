  summary: Enriched PANDAS with Harrison's classifications, basal ganglia and Th17 neuroimmune groundings, Enuresis evidence, streptococcal serological diagnosis, and treatment mechanism targets.
  details: >-
    Added Harrison's chapter classifications (NEUROLOGIC, IMMUNE_RHEUMATOLOGIC,
    INFECTIOUS_DISEASES) backed by PMID:34778136 and PMID:39325550. Enriched all
    three pathophysiology nodes with CL cell types (B cell, dopaminergic neuron,
    cholinergic neuron, T-helper 17 cell, microglial cell, brain microvascular
    endothelial cell), GO biological processes and molecular functions (CaMKII
    activity, transmembrane signaling receptor activity, antigen binding), and
    UBERON locations (collection of basal ganglia, striatum, blood brain
    barrier, olfactory bulb). Added phenotype categories, frequencies, and
    verbatim evidence for Enuresis from PMID:34778136, added throat swab/ASO and
    anti-DNase B serological diagnosis, and completed treatment target_mechanisms.

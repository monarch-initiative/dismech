  summary: Enriched PANDAS with synonyms, Harrison's classifications, striatal medium spiny and Th17 neuroimmune groundings, Enuresis evidence, streptococcal serological diagnosis, and treatment mechanism targets.
  details: >-
    Added PANDAS synonyms and Harrison's chapter classifications (NEUROLOGIC,
    IMMUNE_RHEUMATOLOGIC, INFECTIOUS_DISEASES) backed by PMID:34778136 and
    PMID:39325550 (with BACKGROUND quote_role on prior-knowledge framing).
    Enriched all three pathophysiology nodes with CL cell types (B cell,
    striatal medium spiny neuron CL:1001474, cholinergic neuron, T-helper 17
    cell, microglial cell, brain microvascular endothelial cell), GO biological
    processes and molecular functions (CaMKII activity, dopamine GPCR activity
    GO:0004930, antigen binding), UBERON locations (collection of basal ganglia,
    striatum, blood brain barrier, olfactory bulb), and split/re-graded review
    synthesis evidence items for in vitro CaMKII activation and striatal CIN
    IgG binding. Added phenotype categories, VERY_FREQUENT frequency on the
    cardinal OCD and tic phenotypes, PANS-criterion-G evidence for Enuresis
    from PMID:34778136, throat swab and ASO/anti-DNase B serological diagnosis,
    and treatment target_mechanisms.

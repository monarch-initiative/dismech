  summary: 'Wire LGS pathograph: connect mechanism chain to phenotype nodes'
  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Problem: Lennox-Gastaut_Syndrome carried a fully built pathophysiology chain
    (etiologic insult -> thalamocortical network dysfunction -> excitation/inhibition
    imbalance -> discharge-generation nodes) but had zero causal edges reaching any of
    its 10 phenotype nodes. Every phenotype floated disconnected in the rendered
    pathograph (0/10 on the phenotypes[].causal_inlink QC metric from
    dismech.qc_plugins).

    Change: added downstream CausalEdges from the existing terminal mechanism nodes to
    the phenotypes they explain -
      - Slow Spike-and-Wave Discharge Generation -> Atypical Absence Seizures,
        Nonconvulsive Status Epilepticus
      - Generalized Paroxysmal Fast Activity and Tonic Seizure Generation -> Tonic Seizures
      - Atonic Drop Attack Generation -> Atonic Seizures (Drop Attacks)
      - Cortical Excitation-Inhibition Imbalance -> Myoclonic Seizures,
        Generalized Tonic-Clonic Seizures
      - Interictal Epileptiform Activity-Driven Cognitive Impairment -> Epileptic Encephalopathy
      - Cognitive Impairment and Developmental Plateau -> Intellectual Disability,
        Behavioral Abnormalities
      - Heterogeneous Etiologic Brain Insult -> Global Developmental Delay (routed from the
        insult rather than the seizure-driven plateau, because delay frequently precedes
        seizure onset)

    No new ontology terms, evidence items, or PMIDs were introduced; the edits are causal
    edges with descriptive text and causal_link_type only.

    Validation: just validate kb/disorders/Lennox-Gastaut_Syndrome.yaml passed (schema +
    terms + references; "Snippets checked: 7/7 verified against cached references").
    just validate-graphs reports no dangling targets for this file. Phenotype connectivity
    recomputed at 10/10.

    Not changed: gene-to-mechanism wiring remains 0/1. The single genetic entry is a
    deliberate catch-all ("Genetically heterogeneous developmental and epileptic
    encephalopathy genes") with no gene_term, because LGS has no single causative locus;
    wiring it would require asserting gene descriptors the entry intentionally avoids.

  summary: 'Create: Lennox-Gastaut Syndrome'
  details: |
    De-novo curation of Lennox-Gastaut syndrome (MONDO:0016532) as a granular, unbundled developmental and epileptic encephalopathy entry: 10 single-concept pathophysiology nodes (heterogeneous insult -> age-dependent evolution from infantile spasms -> diffuse thalamocortical network dysfunction -> cortical excitation-inhibition imbalance -> slow spike-and-wave generation / generalized paroxysmal fast activity + tonic seizures -> atonic drop attacks -> multiple drug-resistant seizure types; parallel interictal-epileptiform-activity -> cognitive-impairment arm), with two conforms_to links to the epilepsy_excitation_inhibition_imbalance module. Deep research provider: claude_code (research/Lennox-Gastaut_Syndrome-deep-research-claude_code.md; 10 web searches, 13 citations). Evidence uses snippet-verified PMIDs: 24902608 (secondary network epilepsies), 23934111 (Epi4K de novo, GABRB3/ALG13), 29768152 (cannabidiol GWPCARE3 RCT). Added a discussions section with 4 items: convergent-syndrome-vs-disease controversy, tonic-seizure/GPFA circuit knowledge gap, epileptic-encephalopathy cognition-reversibility knowledge gap, and an animal-model human-fidelity mismatch. No GeneReviews article exists (heterogeneous syndrome). All snippets manually confirmed as exact substrings; schema/term/reference validation and folded-hyphen check pass.

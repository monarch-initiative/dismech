  summary: 'Edit: record no genotype difference in long-term cannabidiol drop-seizure
    response'
  details: |
    Added a GENOTYPE effect_modifiers record to the LGS-Indicated Adjunctive Antiseizure Agents treatment, scoped to cannabidiol, from PMID:42968542 (Na et al. 2026, CNS Neurosci Ther). In a single-centre retrospective cohort of 46 patients with at least 24 months on cannabidiol (20 with a pathogenic or likely pathogenic variant on whole-exome sequencing, 26 without), drop-seizure reduction did not differ between groups at 6, 12, 18 or 24 months. Recorded as effect_in_stratum NO_DIFFERENCE with modification_analysis CROSS_STRATUM_COMPARISON, because all patients were treated and there was no untreated control. interaction_tested is left unset: the paper compares groups with Mann-Whitney tests at fixed time points and does not report a treatment-by-genotype interaction test. The description and evidence carry the authors' limits: exploratory, not powered for modest subgroup differences, and exclusion of patients who stopped cannabidiol before 24 months (retention bias). The 76.1% sustained-responder figure was not added as general treatment evidence, because the analysed cohort excludes early discontinuers and would overstate durability. The CLCN4 observation (3 of 3 patients drop-seizure free) was not recorded, because three patients cannot support a gene-level claim. The reference was cached with just fetch-reference (full text from PMC). Validated with just validate-disorders (159 snippets checked, 0 issues), count-verified-snippets (159/159), and the duplicate-key, block-scalar, enum, entity-ref, snippet-grading, snippet-length, title-snippet and reference-title gates.

  details: |
    Review round on PR #9644; ai4c-reviewer requested changes on three evidence gradings.

    The reviewer asked for all three to be regraded to PARTIAL. That value no longer exists: issue #7439 retired PARTIAL and WRONG_STATEMENT and #10003 migrated the KB, both after this branch was cut. CLAUDE.md's replacement grade is SUPPORT with directness: INDIRECT, and this branch's vendored schema predates the directness slot, so it could not be used either. Each finding was therefore resolved structurally rather than by relabelling, which in all three cases was the reviewer's own stated alternative and is better curation than a softer grade would have been.

    Finding 1, GPFA and Tonic Seizure Generation -> Multiple Drug-Resistant Seizure Types. The quote "Most LGS patients continued with refractory seizures" attests a property of the target node, not the causal step, as the explanation itself conceded. Took the reviewer's second option and moved the item onto the Multiple Drug-Resistant Seizure Types node, which previously carried no evidence at all and where drug resistance over long follow-up is exactly the defining property asserted. Also fixed the edge description that caused the problem: it read "Fast-activity discharges manifest clinically as tonic seizures", describing a different target, which is the root cause the reviewer identified in their non-blocking notes. The edge now describes the multi-type drug-resistant endpoint and records that it is intentionally uncited.

    Findings 2 and 3, Cortical Excitation-Inhibition Imbalance -> Myoclonic Seizures and -> Generalized Tonic-Clonic Seizures. Both cited PMID:30764523, and the two snippets were the two halves of one abstract sentence, so a single review sentence was doing duty as two independent supports for two edges it does not distinguish. Consolidated: the sentence is quoted whole on the Cortical Excitation-Inhibition Imbalance node, where it directly states the imbalance principle the node asserts, and removed from both edges. Both edges keep INDIRECT_UNKNOWN_INTERMEDIATES and now say in their descriptions that they carry no citation on purpose, because nothing found establishes which seizure type a given hyperexcitable network produces. The reviewer explicitly endorsed declining to attach a citation whose text does not say what the edge says.

    Also migrated the one branch-added supports: PARTIAL on network dysfunction -> E/I imbalance to SUPPORT, moving the qualification into explanation prose.

    Snippet count moved 22 -> 21, which is the expected arithmetic: three items removed, two added.

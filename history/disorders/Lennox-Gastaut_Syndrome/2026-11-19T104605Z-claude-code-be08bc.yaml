  summary: 'Edit: add the 2019 and 2024 versions of the REST-LGS screening instrument'
  details: |
    Added two OTHER-type definitions for the Refractory Epilepsy Screening Tool for LGS. The 2019 version (PMID:30537670, abstract cached) records the eight items as major and minor criteria sets, quoted from the 2024 paper's restatement, with the design, interrater agreement and observed criteria pattern quoted from the 2019 abstract. Details only in the 2019 full text (records from patients over 12, 50 LGS and 50 localization-related drug-resistant epilepsy records per center, helmet/injury kappa 0.138 and 0.367, post hoc Cronbach alpha) are in unquoted notes, from a user-supplied copy. The 2024 weighted score (PMID:38726917, full text cached) records the 3-point and 1-point weights, the categories 0-7, 8-11 and 12-16, the two New York facilities, single-reviewer design, and both directions of the Figure 5 result (42 of 74 without a prior diagnosis and 14 of 26 with one screened possible or likely). Both definitions carry validation_status UNVALIDATED with a rationale stating that no sensitivity, specificity or reference-standard comparison was reported. Added a short paragraph on missing childhood history to the adult phase of progression. Built on the branch of PR 18456. Validated with just validate (163 snippets, 0 issues) and the KB structural gates.

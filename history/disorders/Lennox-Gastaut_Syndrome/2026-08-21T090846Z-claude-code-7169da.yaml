  summary: 'Compliance: add evidence to pathophysiology, phenotypes, treatments'
  details: |
    Weekly compliance sweep. Weighted compliance was the lowest in the KB (47.75% by
    the repo-wide weighted calculation; 42.0% as reported by `just compliance` on the
    file). Terms were already at 89.7% and cell types / phenotype terms at 100%, so
    the gap was almost entirely missing evidence: pathophysiology[].evidence 1/10,
    phenotypes[].evidence 0/10, treatments[].evidence 1/5.

    Added 22 evidence items across 9 pathophysiology nodes, 10 phenotypes and 4
    treatments, each with a verified PMID, an exact-quote snippet from the cached
    abstract, and a reference_title. New references fetched and read before use:
    PMID:14725841, 25400619, 29124439, 33188523, 33764203, 33871716, 34798494,
    35989160, 36114808, 38976954, 39854828, 41283772. PMID:23934111 was reused from
    the existing genetic block.

    Three PMIDs reached for from recall turned out to be entirely unrelated papers -
    a school physical-activity trial, a cervical-screening study, and a
    status-epilepticus review - so every citation here was instead selected by
    PubMed search and read from the fetched abstract before use.

    Five items are deliberately PARTIAL rather than SUPPORT, recording specific
    tensions rather than overstating. The GABRB3 genetic evidence supports the
    excitation-inhibition node only via a monogenic subset. The SSW/GPFA correlation
    in PMID:38976954 does not match this entry's one-to-one
    generator-to-seizure-type assignment, which the explanation says explicitly. The
    interictal-activity/cognition association is correlational and cannot separate
    activity-driven from fixed etiologic injury, the open question already recorded
    in the attached KNOWLEDGE_GAP discussion. The systematic review reports
    non-convulsive status epilepticus in 7.0%, lower than the "large fraction" in
    the phenotype description. The callosotomy-versus-ketogenic-diet comparison is
    indirect, with non-equivalent baseline cohorts.

    Validation: `just validate` passed; `just count-verified-snippets` reported
    40/40 snippets verified against cached references; `just validate-terms` passed;
    all five ungated CI gates - folded-hyphens, snippet-length, title-snippets,
    environmental-evidence, duplicate-keys - passed; `just validate-disorders` run
    as the pre-PR sweep.

    Weighted compliance 42.0% -> 71.0%; pathophysiology[].evidence 10% -> 100%.

    Remaining gaps not addressed: datasets is empty;
    pathophysiology[].downstream[].evidence is 0/21 causal-edge evidence; and the
    discussions[].proposed_experiments[] sub-fields (experiment_type.term, and the
    per-experiment datasets / evidence / readouts / controls evidence) are unfilled.

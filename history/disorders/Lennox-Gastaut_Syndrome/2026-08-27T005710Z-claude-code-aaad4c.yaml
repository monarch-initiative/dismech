  summary: Add phenotype-level evidence to Lennox-Gastaut syndrome
  details: |
    Weekly compliance sweep. All 10 phenotypes had HPO term bindings but no evidence items (phenotypes[].evidence 0/10). Added 15 EvidenceItem entries citing PMID:21790560 (Camfield, LGS definition and natural history), PMID:29124439 (LGS clinical review), PMID:29126048 (long-term follow-up of 38 adults with LGS, seizure-type prevalences), PMID:25616450 (68-patient long-term prognosis cohort), PMID:11071139 (101-patient multicentre study of NCSE as a risk factor), plus the already-cached PMID:29768152 (GWPCARE3 cannabidiol trial) for drop seizures. Also softened the nonconvulsive status epilepticus description, which asserted an unevidenced large-fraction-of-patients frequency, to the association actually supported by PMID:11071139. Verified with just validate, just validate-terms, and just count-verified-snippets (22/22 verified).

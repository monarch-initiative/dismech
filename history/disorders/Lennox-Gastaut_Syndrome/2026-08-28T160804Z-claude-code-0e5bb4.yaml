  summary: 'Edit: Lennox-Gastaut Syndrome - evidence for pathophysiology and treatments;
    add prevalence, progression, trials, differential'
  details: |
    Closed the evidence gaps in this entry. Before this session, 9 of 10 pathophysiology nodes and 4 of 5 treatments carried no evidence at all, and snippet coverage was 22 verified items. It is now 77.

    Pathophysiology. Added cited, snippet-verified evidence to every node. Key additions: PMID:21275978 (EEG-fMRI in 11 children with LGS) for both the convergence premise on the etiologic-insult node and the centromedian/anterior thalamic and brainstem localisation on the thalamocortical-network node; PMID:26950270 for the excitation-inhibition node, where patch-clamp work shows the de novo GABRB3 variants found in LGS probands reduce GABA-A receptor current (graded IN_VITRO, with the explanation stating that this covers the monogenic GABA-A subset only); PMID:25400619 and PMID:20149600 for the slow spike-and-wave and generalized-paroxysmal-fast-activity nodes, including the sleep persistence of diffuse fast rhythms in all 27 adults; PMID:26945476 and PMID:28295228 for the epileptic-encephalopathy node, the latter giving the directional pre/post-surgical evidence.

    Two claims were qualified rather than merely supported. The age-dependent-evolution node asserted that "roughly a fifth to a third" of patients evolve from infantile spasms; no source was found for a fraction measured from the LGS side, so the description now reads "a substantial subset" and the node is evidenced from the infantile-spasms side (PMID:10368073) plus prior West syndrome as an independent prognostic factor in an LGS cohort (PMID:11071139). The drop-attack node carries PMID:40937826 as PARTIAL: video-EEG-EMG work shows drop attacks are rarely pure atonic seizures, which supports the increased-tone half of the node while qualifying its atonic framing.

    Treatments. Evidence added to all five, plus therapeutic_modality on each (SMALL_MOLECULE, BEHAVIORAL, SURGERY, DEVICE). The broad-spectrum entry's avoidance clause is now cited (PMID:9593229 on carbamazepine and vigabatrin aggravating absence and myoclonic seizures). Two PARTIAL items deliberately qualify claims the entry made flatly: PMID:37212330 records that drop-seizure reduction across the LGS-indicated adjuncts ranges from 68.3 percent (high-dose clobazam) to 14.8 percent (topiramate), so listing them together is not a claim of equivalence; PMID:25616450 records that ketogenic-diet seizure freedom was largely not maintained on a modified Atkins diet.

    New sections. prevalence: one population-based record, the cumulative incidence of 13.2 per 100,000 children through age 16 (PMID:36581463). The commonly quoted 1-2 percent of all epilepsy and 3 percent of childhood epilepsy figures were deliberately kept out of prevalence, because their denominator is the epilepsy population rather than the general population and a rate_per_100000 there would be misread by any downstream aggregation; they went into epidemiology instead, with the denominator named in each description. progression: onset, established childhood phase, and adult persistence, the last carrying the finding that waking EEG may normalize in adults while sleep tonic seizures persist in all. clinical_trials: NCT02224560 (GWPCARE3 cannabidiol) and NCT03355209 (fenfluramine), each with the registry record and the published result. differential_diagnoses: pseudo-Lennox syndrome / atypical benign partial epilepsy, distinguished by the absence of tonic seizures and fast spike series and by its remitting prognosis.

    No ontology term bindings were changed. NCIT was searched for implanted vagus nerve stimulation and for corpus callosotomy; neither has a clinical-action term, so both treatments keep NCIT:C15329 (Surgical Procedure) and the platform distinction is carried by therapeutic_modality instead.

    Validation. `just validate-disorders` passed schema, term, and reference validation with 77/77 snippets verified. check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-duplicate-keys and check-entity-refs all pass. 18 new reference cache files were generated with `just fetch-reference`.

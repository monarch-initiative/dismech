  summary: Merge main; address review findings 1-6 and migrate retired PARTIAL grades
  details: |
    Review round on PR #9152, plus a conflict repair against four weeks of main. Main had roughly doubled this entry (43 to 103 evidence references), producing 27 conflict regions. Resolved by keeping main's side of every region and appending only the evidence items this PR contributes that main does not already carry: 25 items across 10 PMIDs, of which four (PMID:41283772, PMID:38976954, PMID:33871716, PMID:14725841) are new to the entry. Three PR items were dropped as duplicates of references main already cites (PMID:23934111, PMID:25400619, PMID:39854828). The add/add conflict on references_cache/PMID_39854828.md was resolved to main's copy, which is the canonical one the rest of the KB validates against; the cache file was not hand-edited. Net diff against main is +1128/-2. Review finding 4 (the NCSE term HP:0002133 to HP:0031475) had already been applied on main and is preserved. Finding 1: the explanation on the PMID:38976954 NCSE item referred to a 'large fraction' in the phenotype description that main has since rewritten away; reworded to contrast cross-sectional pooled prevalence with the cumulative lifetime series cited alongside it. Finding 2: added a notes block on the Slow Spike-and-Wave node recording that PMID:38976954's pooled cross-study correlations invert the entry's generator-to-seizure assignment for tonic, atonic and myoclonic seizures, and why the edge set is left unchanged. Finding 3: the Behavioral Abnormalities description claimed hyperactivity and aggression, which the sole cited source attributes to Dravet and Landau-Kleffner syndromes respectively, not to LGS; narrowed to the autistic features and sluggish behaviour the source does attribute to LGS. Suggestion 5: trimmed the PMID:36114808 explanation, which asserted non-REM predominance the quote does not establish. Suggestion 6: trimmed the PMID:33871716 explanation, which read efficacy out of a study-count sentence. Separately, the three supports: PARTIAL grades this PR was written with became invalid when #10003 retired the value; migrated to SUPPORT with directness INDIRECT (correlational association, indirect comparison) or DIRECT, and rewrote every explanation sentence that named the retired grade. Validation: just validate clean with 125/125 snippets verified, plus check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading and check-title-snippets.

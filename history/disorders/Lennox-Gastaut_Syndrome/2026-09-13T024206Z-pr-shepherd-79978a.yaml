  summary: Merge main, resolve 10 conflicts by union, take remaining review suggestions
  details: |
    Merged origin/main into the PR branch and addressed the remaining review feedback on #8422.

    Conflict resolution (10 hunks in kb/disorders/Lennox-Gastaut_Syndrome.yaml, plus one
    add/add on references_cache/PMID_29124439.md):

    main had received a substantial independent curation of this entry while the PR was open
    - prevalence, epidemiology, progression, ncit_mappings, therapeutic_modality on all five
    treatments, and a much larger evidence base. Every content hunk was resolved as a union
    rather than by picking a side, per the CLAUDE.md guidance that each side of a merge
    conflict is somebody's curation: main's evidence items and structural additions are kept,
    and this branch's distinct verified snippets are appended to the same lists. No evidence
    item from either side was dropped. The one prose-only divergence (an explanation on the
    Epileptic Encephalopathy phenotype) takes main's wording, which is the later and more
    precise of the two. The classifications block this PR exists to add was re-inserted at its
    correct top-level position, after the mappings section, since the conflict had placed it
    against main's ncit_mappings continuation.

    The references_cache add/add conflict was resolved by regenerating the file with
    just fetch-reference PMID:29124439 rather than by hand-merging it, as CLAUDE.md requires.
    The regenerated file is byte-identical to main's committed version.

    Review feedback:

    - Blocking item (ILAE nosology evidence graded OTHER rather than HUMAN_CLINICAL) was
      already fixed in commit 048f229 before this round; verified still in place after the
      merge.
    - Optional regrade taken. Six evidence items quoting a panel recommendation, a
      nosological definition, or a regulatory fact are now OTHER rather than HUMAN_CLINICAL:
      the PMID:39700524 valproate first-line recommendation, its three nonpharmacological-
      approaches recommendations, its "must include tonic seizures" definitional sentence,
      and the PMID:39854828 FDA-approval enumeration. This is the same reasoning the blocking
      fix applied to the ILAE statement. The PMID:39854828 clinical-characterisation snippet
      and the PMID:29124439 triad snippets stay HUMAN_CLINICAL, as the reviewer noted they
      should.
    - Suggestion 1 taken: Nonconvulsive Status Epilepticus rebound from the parent term
      HP:0002133 to the precise HP:0031475 Status epilepticus without prominent motor symptoms.
    - Suggestion 3 taken: the LGS-Indicated Adjunctive Antiseizure Agents description listed
      six agents where its own snippet enumerates eight. It now names all eight and records
      that the FDA-indicated set and the set with randomized double-blind trial support are
      different lists.
    - Suggestions 2 and 4 were already satisfied by main's curation, which this merge brings
      in: therapeutic_modality is set on all five treatments (SMALL_MOLECULE, BEHAVIORAL,
      SURGERY, DEVICE) and the excitation-inhibition node binds CL:0000617 GABAergic neuron.
    - Suggestion 5 was already addressed in commit 048f229; the existing history record
      carries the PR link.

    Validation after the merge: just validate passes with 100/100 snippets verified against
    the reference cache; just validate-terms, just check-entity-refs, just check-duplicate-keys,
    just check-snippet-grading and just check-title-snippets all pass with no new divergences
    against origin/main.

  summary: 'Edit: ILAE diagnostic criteria, EEG phenotypes, drop attacks and frequency
    bands'
  details: |
    Added the ILAE diagnostic criteria as a DIAGNOSTIC_CRITERIA definition, cited to the ILAE EpilepsyDiagnosis.org criteria, overview and EEG pages, because the cached ILAE 2022 position paper (PMID:35503717) is abstract only and neither a forced PMID refetch nor a DOI fetch retrieved its full text. Revised the description and the onset phase to separate the age of the first seizure from the age at which the syndrome emerges (18 months to 8 years, peak 3-5), with the ILAE mandatory onset before 18 and the alert after 8. Added the historical-EEG point to the adult phase. Added two EEG phenotypes: generalized slow spike-wave (HP:0010847) and generalized paroxysmal fast activity (GPFA) in sleep (HP:0011198, which fits only generalized fast activity with coarse_binding_basis NO_HPO_TERM; OLS searches of HPO found no fast-activity term). Separated epileptic drop attacks from atonic seizures: renamed the pathophysiology node to Epileptic Drop Attack Generation, removed its edge asserting that drop attacks are atonic seizures, added an Epileptic Drop Attacks phenotype bound to HP:0002527 Falls, moved the cannabidiol drop-seizure count off the atonic phenotype, and cited the fenfluramine trial's per-protocol drop-seizure definition (PMID:35499850). Added tonic seizures to the fenfluramine trial's target phenotypes. Set frequency bands: tonic seizures, slow spike-wave and GPFA OBLIGATE (definitional, ILAE mandatory criteria); atonic, atypical absence, myoclonic and bilateral tonic-clonic FREQUENT; intellectual disability VERY_FREQUENT. The tonic-clonic band rests on an adult-only count (17/38, PMID:29126048) because the pooled review's 'generalized' category is undefined in its abstract. Left nonconvulsive status epilepticus, global developmental delay, epileptic encephalopathy and behavioral abnormality without bands. Read Table 9 of the published position paper from a user-supplied copy and added its exclusionary criterion and the prior-EEG qualifier to the definition, as unquoted notes. Validated with just validate, count-verified-snippets, validate-terms and the KB structural gates.

  details: |
    Weekly compliance sweep, edge-evidence focus. This was the lowest-scoring file in the KB at 42.0 percent weighted compliance, with all 21 pathophysiology downstream causal edges carrying a description but no evidence. Added 16 EvidenceItems covering 14 edges. Etiologic insult -> network dysfunction cites PMID:28346953 for etiologic convergence and PMID:24902608 for the lesionectomy result that makes the link causal. The infantile-spasms route and the seizures-drive-cognition claim cite PMID:30255934, a prospective community cohort with full text cached. The two discharge-generation edges cite the separate PFA and SSW EEG-fMRI results in PMID:24902608, which keeps the two arms of the pathograph distinguishable. The epileptic-encephalopathy edges cite PMID:26778176. Cognitive plateau -> intellectual disability cites PMID:34798494. Two generic excitation-inhibition edges cite PMID:30764523, the same review the conformed module uses. Network dysfunction -> cortical E/I imbalance is graded PARTIAL because EEG-fMRI localizes network instability without measuring excitatory/inhibitory balance. Fetched PMID:28346953, PMID:26778176, PMID:30255934 and PMID:34798494 into references_cache; PMID:21669559 was fetched and discarded uncommitted as it carries no statement specific enough to support an edge. Seven edges remain unsourced and are listed in the PR: insult -> global developmental delay, SSW -> atypical absence seizures, SSW -> nonconvulsive status epilepticus, GPFA -> atonic drop attack generation, GPFA -> tonic seizures, atonic drop attack generation -> both its targets, and cognitive impairment -> behavioral abnormalities. All 22 snippets verified; just validate-disorders passes. Weighted compliance 42.0 percent -> 59.1 percent.

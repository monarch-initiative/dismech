  summary: 'Create: Charcot-Marie-Tooth Disease Type 4K'
  details: |
    Curated MONDO:0014733 as a standalone Disease entry. Primary evidence is PMID:24027061 (three patients, two families), with PMID:36599233 cited only for contrast against the SURF1-Leigh spectrum. All 13 snippets verified as exact substrings of cached abstracts; term validation passed.

    Lump/split call recorded explicitly as a discussion. dismech handles CMT4A-4J as has_subtypes entries on Charcot-Marie-Tooth_Disease_Type_4, and MONDO gives CMT4K that same parent, so a subtype entry was the obvious default. It is curated separately because CMT4K's pathograph is complex IV assembly failure while the CMT4 entry's pathophysiology nodes describe Schwann-cell myelin-gene loss; MONDO's second parent for this term is mitochondrial oxidative phosphorylation disorder. Flagged for reviewers as a decision they may reverse.

    Two ontology terms were corrected during validation: HP:0007182 (Peripheral hypomyelination) was wrong for demyelinating peripheral neuropathy and was replaced with HP:0007108, and GO:0033617's canonical label differs from the one first written. A stale HP:0007182 cache row from the failed attempt was reverted so the PR carries only the MONDO:0014733 row this entry actually introduces.

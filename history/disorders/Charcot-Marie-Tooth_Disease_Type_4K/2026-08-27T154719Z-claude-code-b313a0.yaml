  summary: Address round-2 review findings on PR 9666
  details: |
    Round-2 review asked for the cardinal CMT phenotypes, a prevalence block, and complex IV deficiency as a measurable finding.

    Added distal muscle weakness (HP:0002460), distal muscle atrophy (HP:0003202) and distal sensory impairment (HP:0002936), all graded PARTIAL against the class-level CMT citation PMID:11157804, because neither CMT4K source enumerates them: PMID:24027061 is abstract-only and states only severe childhood-onset neuropathy, and PMID:23829769's phenotype columns are Leigh-spectrum. The parent CMT4 entry carries the same phenotypes on the same class-level citation, so this follows existing precedent rather than inventing one. Areflexia is deliberately left out: it is in Orphanet's definition but is not stated in the class-level source either, so there is nothing to cite at all.

    Three of the four HP CURIEs the reviewer proposed were wrong terms and were not used: HP:0003551 is Difficulty climbing stairs, HP:0002521 is Hypsarrhythmia, and HP:0002850 is Decreased circulating total IgM. Only HP:0003202 and HP:0001284 were correct. The substantive point behind the finding was right and is addressed with the correct terms.

    Added a biochemical block for complex IV activity (reduced but not abolished, the pivot of this entry's whole argument) and serum lactate, plus a diagnosis block carrying the authors' SURF1 screening recommendation, which is where that sentence belongs after it was evicted from the lactic acidosis node last round.

    No prevalence block. The Orphanet class the reviewer pointed to cannot be verified: just refresh-orphadata fails on a stale manifest pin (2025-12-09 pinned, 2026-06-23 served). Filed as issue 9687. Rather than repeat the pattern the reviewer flagged, every negative claim in notes now names the sources actually checked.

    24/24 snippets verified; all gates pass; no new cache rows.

  details: |
    Item 9 of issue #9753 (deferred at the time because PR #9666, which created this file, was still open; #9666 has since merged so this file now exists on main and the item is directly actionable). PMID:24027061's functional analysis (complex IV activity in muscle/fibroblasts) is scoped to the c.107-2A>G variant carried by the 2 patients from the consanguineous index family; the third reported CMT4K patient in the same paper carries two additional, different SURF1 mutations and complex IV activity is not separately reported for that patient. The evidence explanation previously said the VERY_FREQUENT tag rested on a '3/3 observation in this series', which the quoted sentence does not support -- it is 2/2 for the assayed variant. Reworded the explanation to state the correct 2/2 denominator and to ground the VERY_FREQUENT tag in the entry's own description of isolated complex IV deficiency as the defining CMT4K laboratory finding, rather than in a cohort-wide count. Item 10 (mappings for OMIM 616684 + valproate agents-to-avoid) was not attempted: the DiseaseMappings schema class (icd10cm_mappings/icd11f_mappings/mondo_mappings/ncit_mappings) has no OMIM mapping slot, so the suggestion as written does not map cleanly onto the schema, and the valproate/agents-to-avoid claim needs a new Leigh-specific literature citation that was not sourced in this session -- both need a human or a follow-up session with more research budget.

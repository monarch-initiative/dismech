  summary: Review CMT4K against primary full text, clinical sources and experimental
    models
  details: |
    Reviewed the complete CMT4K entry against the existing Perplexity research and citation artifacts, the original 2013 primary article full text, cached SURF1 natural-history and assembly studies, full GeneReviews chapters and a generated Orphanet record. The primary PMID cache remains abstract-only; a supported URL fetch supplies the full article. Research preflight identified an incorrect HGNC identifier in the report; MONDO/HGNC identity was independently verified rather than copied.
    Corrected the biochemical denominator to one assayed patient, distinguished enzyme activity from assembled-complex abundance, and removed the false claim that residual COX distinguishes CMT4K from Leigh syndrome. Replaced an unmeasured Schwann-cell ATP mechanism with observed pathology and explicitly unresolved intermediates. Split variant/splicing/protein/assembly/activity nodes. Corrected MRI versus ataxia attribution and exact 25 m/s conduction value. Added directly reported areflexia, nystagmus, hearing loss and kyphoscoliosis; strengthened distal atrophy/sensory evidence and removed unsupported population frequency bands. Documented nonuniform prior screening in the 2/41 family fraction and Orphanet point-prevalence band.
    Added allele-specific variant records, patient fibroblast models, distinct early and viable mouse models, species/context limitations, and 2025 preclinical gene-addition evidence including rat toxicity and the nonsignificant lactate comparison. General CMT GeneReviews supplies clinical, testing, supportive-care, medication-risk and recessive-counseling evidence. The adult SURF1 case first presented at SFNP was checked against its final 2026 Leigh publication and retained as differential/spectrum context, not counted as another childhood demyelinating case.
    Research completeness: phenotype, genetic, diagnostic/biomarker, core molecular mechanism and model themes are covered. No validated CMT4K subtypes or stages were established by these sources. Speculative ROS, Schwann-cell ATP failure and compensatory determinants of human tissue selectivity are not asserted as facts. Broader Leigh phenotype frequencies, survival and nonspecific mitochondrial treatments are not transferred to the neuropathy presentation. Gene-therapy results are preclinical, not human treatment efficacy. The source review identifies remaining mechanistic and translational gaps in discussions.
    The refreshed shared Leigh GeneReviews cache uses its current extracted title; six other consuming entries receive citation-title compatibility edits only, each with a separate EDIT record. They are not additional disorder reviews. All reference caches were generated by supported fetchers; no manual cache construction.

  summary: Ground complex IV deficiency to HP:0008347; correct a false no-term claim
  details: |
    Round-5 review found that a notes paragraph added in the previous commit asserted something false: that HPO has no term for decreased cytochrome c oxidase activity. HP:0008347, "Decreased activity of mitochondrial complex IV", exists, was already in cache/hp/terms.csv, and is already bound by five KB entries — two of them COX-deficiency entries this file cites as precedent for its own lump/split decision.

    Added the phenotype, following the COA3-Related_COX_Deficiency pattern: category Biochemical, bound to HP:0008347, tagged VERY_FREQUENT on the 3/3 observation in PMID:24027061, the same denominator as this entry's other CMT4K-specific phenotypes. Isolated complex IV deficiency is the defining laboratory criterion for CMT4K and the pivot of the entry's whole mechanistic argument, so it not being ontology-grounded anywhere was a real gap rather than a formality.

    Rewrote the notes paragraph. biomarker_term is still unbound, but for a schema reason rather than an ontology one: BiomarkerDescriptor binds BiomarkerTerm, rooted at NCIT:C16342, so an HP CURIE cannot go in that slot whatever its label. The peer SURF1-Related_Leigh_Syndrome entry leaves its own complex IV record unbound the same way.

    The paragraph also records how the false claim arrived, because the chain is instructive. The deep-research report twice named HP:0002850 as "Cytochrome c oxidase deficiency"; that CURIE is Decreased circulating IgM concentration. Review repeated the report's pairing without checking. This entry caught the wrong label but then searched HPO for "cytochrome c oxidase" and, finding only the stain finding HP:0003688, concluded no term existed — while the right term sat in the cache filed under complex IV, the vocabulary this entry uses in the record's own name and in every pathophysiology node. Four steps, and a single label lookup would have ended it at any of them.

    A bare "no term exists" in notes is a load-bearing negative claim, exactly as this entry's own notes already argue about natural history and prevalence. This one would have sent the next curator away from a term that was already cached.

    Validated with just validate, count-verified-snippets at 25 of 25, check-entity-refs and check-duplicate-keys, all clean. No cache churn: HP:0008347 was already present.

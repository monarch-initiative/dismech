  summary: Address review findings 1-6 on PR 9666
  details: |
    Addressed all six blocking findings from the ai4c-reviewer review.

    The reviewer was right on the two factual points and both are corrected rather than argued. First, the recorded lump/split rationale claimed CMT4's pathophysiology nodes are uniformly Schwann-cell myelin-gene loss; CMT4's first node is GDAP1 Mitochondrial Dynamics Defect and its architecture is per-gene upstream nodes converging on a shared demyelination terminal node, so a SURF1 node would have fitted. The discussion now records the mistake and replaces it with the real argument (gene-level standalone precedent for SURF1/SCO1/SCO2/PET100/PET117/TACO1/COX8A/FASTKD5, plus lactic acidosis and basal-ganglia lesions putting CMT4K outside the CMT4 clinical envelope). Second, the notes claimed no natural-history data were found; that was true of CMT4K as a named entity but false of SURF1 deficiency, for which PMID:23829769 is a 44-patient cohort.

    Added PMID:23829769 (peripheral neuropathy in 13/16, 81 percent) and PMID:26804654 (tissue- and species-specific COX assembly), both already cached and both missed on the first pass. The 81 percent figure is curated with an explicit caveat that it is the neuropathy frequency in SURF1 deficiency generally, not of the CMT4K presentation, which no cohort has quantified.

    Added a Delayed Basal Ganglia and Brainstem Injury node so cerebellar ataxia and the putaminal/periaqueductal lesions reach the pathograph; they were previously orphaned. Fixed the claim-evidence mismatch on the childhood-onset neuropathy node and the weak snippet on lactic acidosis, both by substituting the RESULTS sentence for a conclusions/screening sentence. Added a references block with both GeneReviews overviews tagged, phenotype frequency values, supportive treatments, and corrected parents to the peer convention Mitochondrial Disease.

    Also edited two neighbouring entries so CMT4K is reachable from both: differential_diagnoses entries on Charcot-Marie-Tooth_Disease_Type_4 and SURF1-Related_Leigh_Syndrome. This widens the PR beyond one file, which the review explicitly asked for.

    18/18 snippets verified in this entry, 69/69 across all three changed files; schema, term, entity-ref and duplicate-key checks pass on all three.

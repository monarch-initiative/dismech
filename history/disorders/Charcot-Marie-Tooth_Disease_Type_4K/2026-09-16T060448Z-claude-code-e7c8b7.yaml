  details: |
    Review round follow-up on #11600, finding 4, applied by the PR Shepherd agent.

    The VERY_FREQUENT justification on Decreased Complex IV Activity was circular: it grounded the frequency qualifier in "this entry's own description above", which is curator prose. The tag is defensible on the merits, so the fix is to state the merits rather than to change the tag. The explanation now grounds it in two things outside the entry: SURF1 is a complex IV assembly factor, so a complex IV assembly defect is close to definitional for a SURF1-related disorder, and it was measured directly in 2 of the 2 patients assayed in the cited series.

    The existing and correct caveat is kept: no larger cohort has measured complex IV activity in the CMT4K presentation specifically, and this paper's functional analysis is scoped to c.107-2A>G, making the quote a 2/2 observation for the assayed variant rather than 3/3 across the series.


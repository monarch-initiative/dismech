  summary: Map galactose-deficient IgA1 to the Tn antigen
  details: |
    Mapped the Gd-IgA1 biomarker to the protein-bound Tn antigen CHEBI:53604 (O-(N-acetyl-alpha-D-galactosaminyl)-L-serine residue), added a readout to Galactose-deficient IgA1 overproduction, and synonyms. The existing PMID:22904352 snippet (terminal GalNAc exposed in the hinge region) supports the mapping. A candidate snippet from PMID:36306365 was not used because the Tn(+)/galactose-deficient equivalence sits in square brackets, which the reference validator strips. Part of the bGSL pilot in projects/COMMONFUND/GLYGEN.md.

  summary: 'Re-curate: CATSHL Syndrome'
  details: |
    Re-curation audit of an already extensive entry. Inheritance (AD Arg621His/Arg621Cys; AR homozygous Thr546Lys with subtly affected heterozygous parents), all published families, mechanism nodes, animal models and the ClinGen Moderate validity assertion were checked and left as curated. Changes: (1) wired the Endochondral Bone and Vertebral Overgrowth node to Tibial Bowing, and gave its Scoliosis edge evidence, both from the Fgfr3-null mouse report of long-bone curvature, kyphosis and scoliosis (PMID:8630492), graded INDIRECT because the human deformities are linked by analogy; (2) added a Tibial Bowing -> Loss of Ambulation sequela and primary evidence for the tibial deformity from the homozygous Thr546Lys report (PMID:24864036), which previously rested only on the ClinGen abstraction; (3) cited the primary familial tall stature study (PMID:38307035) behind the Ala514Asp and Asn653Lys records, graded INDIRECT because its abstract neither names the allele nor reports the CATSHL triad. Remaining disconnected phenotypes (camptodactyly, chest-wall, neurodevelopmental, dental, renal and minor dysmorphic findings) were left unconnected because no source establishes a mechanism for them. New deep research could not be obtained: Falcon failed on provider authentication and Perplexity disconnected twice without a response, so the existing claude_code report and direct PubMed searches were the literature basis.

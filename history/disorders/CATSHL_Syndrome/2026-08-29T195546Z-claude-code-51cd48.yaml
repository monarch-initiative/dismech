  summary: 'Create: CATSHL Syndrome'
  details: |
    Created kb/disorders/CATSHL_Syndrome.yaml for camptodactyly-tall stature-scoliosis-hearing loss syndrome, MONDO:0012504. Deep research run with the claude_code provider; the report passed preflight-dr against MONDO:0012504 with FGFR3 mentioned 44 times and matching OMIM 610474. Reference validation of the report flagged one unresolved identifier, a markdown-mangled DOI for the PLOS Genetics chondroma paper; the underlying DOI 10.1371/journal.pgen.1005214 was resolved independently through the PMC ID converter to PMID:26091072 and that PMID was cited instead. Term validation of the report flagged four CURIEs the ontology names as something else entirely, CL:0002261, UBERON:0002391, UBERON:0004674 and UBERON:0002228; none was bound, and the correct terms were looked up directly through OLS. Six references cited, all cached; 58 of 58 snippets verified against the cache. Modelled as an FGFR3 loss-of-function chain with a skeletal arm and a separate cochlear arm branching at the receptor, four animal models including the naturally occurring ovine spider lamb syndrome, and three discussions covering the mouse craniofacial mismatch, the untested dominant-negative mechanism and the bidirectional cochlear failure. No conforms_to against the FGFR gain-of-function module, which is scoped to activating alleles; the reasoning is recorded in notes.

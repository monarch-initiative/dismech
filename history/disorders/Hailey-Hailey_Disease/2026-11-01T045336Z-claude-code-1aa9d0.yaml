  summary: 'Augment: type 2 cytokine expression node and knowledge gap'
  details: |
    Added a TISSUE-scale pathophysiology node for raised epidermal IL-4 and dermal IL-13 in lesional skin, from PMID:42410304 (retrospective IHC, n=7 HHD vs 6 AD vs 4 healthy). Recorded no causal edges because the study shows association only. Added a KNOWLEDGE_GAP discussion on whether the type 2 signal contributes to acantholysis. Did not add dupilumab or JAK-inhibitor treatment entries: the abstract proposes them but the study does not test them, and they need a separately verified therapeutic-agent binding. Did not add biomarkers: an IHC tissue density is not a clinical assay. Snippets 29/29 verified; term validation passes.

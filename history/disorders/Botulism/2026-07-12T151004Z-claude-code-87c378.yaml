  summary: 'Expand Botulism: SNARE mechanism nodes, new phenotypes, infectious agent
    block'
  details: |
    Added three upstream pathophysiology nodes forming the full BoNT intoxication
    cascade: (1) Presynaptic Cholinergic Nerve Terminal Targeting and Endocytosis
    (SV2/synaptotagmin receptor binding; CL:0000108, GO:0006898; evidence:
    PMID:23621114, DOI:10.1111/jnc.70187); (2) Light Chain Endosomal Translocation
    (pH-dependent HC channel formation; evidence: PMID:17666397); (3) SNARE Protein
    Proteolytic Cleavage (serotype-specific LC zinc-endopeptidase cleavage of SNAP-25,
    VAMP, or syntaxin; evidence: PMID:1331807, PMID:35333944, DOI:10.3390/ijms26020777).
    All three connect via causal downstream edges through the existing Acetylcholine
    Release Inhibition node to Botulinum Neurotoxin-Mediated Neuromuscular Blockade.
    Added six new evidenced phenotypes: Dysphagia (VERY_FREQUENT, 100% in outbreak
    cohort), Dysarthria (FREQUENT, 88%), Diplopia (FREQUENT), Ptosis (FREQUENT),
    Respiratory Failure (OCCASIONAL), Nausea and Vomiting (FREQUENT). All phenotype
    evidence drawn from PMID:31157190 (full clinical case text) and
    DOI:10.1007/s44197-024-00255-z (Saudi Arabia outbreak). Added infectious_agent
    block for Clostridium botulinum. Added second treatment (supportive care /
    mechanical ventilation; MAXO:0000950). Removed deprecated updated_date field.
    All schema, term, and reference validations pass; folded-hyphen check passes.

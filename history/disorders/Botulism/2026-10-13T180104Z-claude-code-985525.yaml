  summary: Bind the Clostridium botulinum toxin test as a LOINC measurement
  details: |
    Added measurements: LOINC:33708-9 (Clostridium botulinum toxin [Presence] in Specimen) to the Public-health toxin detection and toxigenic-organism testing row, whose evidence specifically describes toxin detection in serum/stool/gastric fluid. The code is serotype- and method-unspecified, matching the row's generic 'detection of toxin in an appropriate specimen' framing rather than committing to a specific serotype (A/B/E/F) or assay (mouse bioassay, immunoassay, Endopep-MS). Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch11 (LOINC_DIAGNOSTICS.md tranche B).

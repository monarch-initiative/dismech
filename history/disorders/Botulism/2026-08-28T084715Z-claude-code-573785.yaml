  summary: Wire Botulism into the neuromuscular_transmission_failure module (#9005)
  details: |
    Declared conforms_to against the new kb/modules/neuromuscular_transmission_failure.yaml trunk created for epic #9005. No other content changed: no evidence, terms, phenotypes or treatments were added or altered in this entry.

    Two nodes wired: Presynaptic acetylcholine release blockade -> #Reduced Quantal Acetylcholine Release; Somatic neuromuscular transmission failure -> #Loss of the Safety Factor of Neuromuscular Transmission (key conformance target). The bulbar, respiratory and autonomic transmission-failure nodes were left unwired because the module is scoped to the neuromuscular endplate; botulism's autonomic cholinergic involvement is outside it. The entry's downstream nodes were also not wired to #Intermittent Endplate Transmission Block or #Fatigable Muscle Weakness, because botulinum paralysis is sustained rather than fatigable and those two module nodes would misdescribe it.


  summary: 'Create: TFRC-related Combined Immunodeficiency'
  details: |
    De-novo curation of MONDO:0014760 (immunodeficiency 46), claimed via issue #10380.

    Deep research: one openscientist run (research/TFRC-Related_Combined_Immunodeficiency-deep-research-openscientist.md, 21 min, 9/9 references verified, confabulation_rate 0.0, needs_review true because 8/9 were scored on topic). The report was used as leads, not copied. just preflight-dr flagged STEAP3 at 37 percent of TFRC mentions as a possible second entity; inspected and rejected as a false positive, since STEAP3 is the proposed accessory-endocytosis mechanism for the erythroid sparing in this same disease rather than a rival gene-disease pair. The OMIM 190010 the preflight also surfaced is the TFRC gene MIM, not a rival disorder.

    The entry was drafted from the primary literature first (PMID:26642240 founding report, PMID:32851577 eight-patient cohort, PMID:38270687 second allele) and the report then contributed four things that were added: the HSCT outcome series PMID:33096268, the Treg-restricted CD71 conditional mouse PMID:38954474, the YTRF motif naming, and two more precise HPO bindings (HP:0005425 recurrent sinopulmonary infections in place of HP:0002205, HP:0004854 intermittent thrombocytopenia in place of HP:0001873) that match the JAX-curated annotation set for this disease.

    Pathograph is built around the internalization block rather than around iron deficiency generally, because several disease features follow from that distinction: raised surface and soluble TfR1, anaemia resistant to iron supplementation, and the erythroid sparing. The erythroid sparing is modelled as its own node. Two discussions are recorded: the STEAP3 accessory-signal hypothesis, whose supporting rescue was done in fibroblasts rather than erythroid cells, and the pre-transplant dysmyelopoiesis and single clonal cytogenetic abnormality from the transplant series.

    Deliberately not asserted: no mechanism edge is drawn to the non-haematological features (optic atrophy, developmental delay, goitre, vitiligo), since no cited source traces one. No datasets or clinical trials.

    Validation: just validate passed (schema, terms, 53/53 snippets verified against cached references); check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all OK.

  summary: 'Address review on PR #10386: TFRC-related Combined Immunodeficiency'
  details: |
    Response to the automated CHANGES_REQUESTED review on PR #10386. All seven IMPORTANT items were accepted and acted on; no item was argued down.

    Item 1, two snippets truncated mid-sentence with an explanation blaming the cache. The reviewer was right and my explanation was wrong. The cached full text of PMID:26642240 contains both sentences whole; my earlier extraction had split them on the period inside p.Tyr20His. Both snippets now run to the end of the sentence and the false cache-defect clause is gone.

    Item 2, the cohort paper PMID:32851577 is cached as full text and I had drawn almost only on its abstract. Added seven phenotypes from the per-patient table: impaired T cell function 8/8 (HP:0011840), recurrent epistaxis and petechiae 7/8, bronchiectasis 3/8, skin abscesses 2/8, meningitis and multinodular goitre 1/8 each. HLH-like presentation and Evans syndrome are deliberately handled in a discussion rather than bound to a single HPO term, and hepatitis B is not curated; notes says so explicitly.

    Item 3, genetic section was prose where the schema has slots. Added a variants list for both alleles with rsIDs, ClinVar accessions, type, clinical_significance and functional_effects; added STEAP3 as a MODIFIER genetic entry; set Inheritance.penetrance COMPLETE with its evidence and the ascertainment caveat; added the consanguinity quote.

    Item 4, IVIG was folded into generic supportive care. It is now its own treatment bound to NCIT:C121331 Intravenous Immunoglobulin Therapy with therapeutic_agent NCIT:C2701 and therapeutic_modality PROTEIN_REPLACEMENT. Note the reviewer suggested a specific immunoglobulin-therapy NCIT term and C121331 does validate as a treatment_term, so no fallback to a generic action term was needed.

    Item 5, added a biochemical block for surface and soluble TfR1 with a READOUT_OF link to the endocytosis node, which puts the entry's headline diagnostic marker into the pathograph.

    Item 6, connectivity. Added a new pathophysiology node, Impaired Iron Supply to Proliferating Marrow Progenitors, so the neutropenia and thrombocytopenia are no longer floating, and added edges to Increased circulating IgM level and Impaired T cell function. The marrow node records a discrepancy rather than hiding it: the Tfr1 HSC-knockout mouse it rests on spares thrombocytes, which does not match the patients' thrombocytopenia, so that edge is marked INDIRECT_UNKNOWN_INTERMEDIATES.

    Item 7, all four previously uncited cached references are now cited: PMID:32284314 and PMID:7957580 as independent confirmation of the CD71-iron dependency in healthy human T cells and thymocytes, PMID:31601687 for the marrow progenitor node, PMID:41714512 as the 2026 review.

    Suggestions also taken: Erythroid Sparing via STEAP3 rescaled from CELLULAR to TISSUE; a HUMAN_MODEL_MISMATCH discussion added for the Treg conditional knockout, whose autoimmune phenotype points opposite to the human immunodeficiency; a notes line on whether the 1/8 optic nerve atrophy is disease-attributable.

    Not done: no datasets were added. GeneReviews - the reviewer could not check for a chapter because its runner has no network egress; I did not find one either and none of the 25 papers in the deep-research run cites one.

    Validation after the changes: just validate passes with 82/82 snippets verified, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens are all clean.

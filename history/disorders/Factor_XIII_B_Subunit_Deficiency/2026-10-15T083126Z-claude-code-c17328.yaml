  summary: Take the four optional suggestions from the approving review
  details: |
    The round-1 review approved the entry and left four suggestions. Two of them are content defects rather than style, which is why they were taken even though taking them costs the approval.

    1. The inheritance description said heterozygotes have bleeding 'only after trauma or surgery'. No cited snippet supported that, and the statement is made in the literature for heterozygous FXIII deficiency in general rather than for F13B heterozygotes. Narrowed to what PMID:39613144 actually says, 'heterozygotes are generally asymptomatic', added that item, and recorded in the description why the provoked-bleeding clause is not asserted.

    2. The cardiac fibrosis readout was attached to 'Impaired Fibrin Cross-Linking', a node it does not measure: haemosiderin-laden myocardial fibrosis is a tissue consequence of repeated small bleeds, not a cross-linking assay. Moved it to its own ModelMechanismLink targeting 'Abnormal bleeding' with relationship PARTIALLY_RECAPITULATES, fidelity LOW, model_scale ORGANISM, its own evidence, and limitations recording that the finding is sex-specific, confined to aged males, and unreported in patients. check_model_readout_targets_match_link requires the readout's target to repeat its link's, which the previous arrangement satisfied only because the readout had been put under the wrong link.

    3. Added a KNOWLEDGE_GAP discussion, f13b_phenotype_extrapolation_gap, recording why the entry carries no intracranial-haemorrhage, umbilical-stump-bleeding, wound-healing or pregnancy-loss phenotypes. Every published frequency for those comes from cohorts dominated by A-subunit disease, which is roughly 95% of congenital FXIII deficiency, so importing them would assert a risk profile nobody has measured in B-subunit disease. The decision previously lived only in the PR body and the creation history record, where a later curator would not find it.

    4. Bound LOINC codes on the two FXIII measurements: LOINC:27815-0 on factor XIII activity and LOINC:3238-3 on the B subunit antigen. The second is the generic factor XIII antigen measurement because LOINC does not code the B-subunit antigen separately; that is recorded in the marker notes rather than left for a reader to infer. Both labels are copied from cache/loinc/terms.csv and neither code carries a third-party copyright notice.

    Validation: just validate clean (54 snippets, 56 titles, 0 issues); validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check_gene_activity_grounding pass; model-scale-audit reports 3 links, 1 ALIGNED, 1 MODEL_ABOVE_TARGET, 1 UNDETERMINED, with no upward extrapolation. Two unrelated references_cache frontmatter diffs (extractor_version added, full_text_attempted removed) produced by a re-fetch were reverted rather than committed.

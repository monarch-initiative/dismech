  details: |
    A fifth suggestion from #14300's approving review, which I did not see until the notification backlog was read after that PR had already merged.

    The differential_diagnoses entry for Factor XIII A subunit deficiency said the two forms are separated by subunit antigen measurement, 'in A-subunit deficiency FXIII-A antigen is absent while FXIII-B antigen is normal, and here the reverse'. 'The reverse' asserts that FXIII-A antigen is normal in B-subunit deficiency. The entry's own Plasma factor XIII B subunit antigen marker notes say the opposite: 'Plasma FXIII-A antigen is also low, but secondarily; measuring both subunits is what separates B-subunit from A-subunit deficiency.'

    So the two passages contradicted each other, and the differential was the one that was wrong. Rewritten to say that the patterns are not mirror images, and that here FXIII-B antigen is absent while FXIII-A antigen is secondarily reduced rather than normal. That also makes the sentence agree with its own next clause about why measuring both subunits is the discriminator.

    No evidence was added or regraded: the claim is already carried by the marker's own cited evidence, and the differential_diagnoses description is prose rather than an evidence-bearing slot.

    This is the same defect class as the round-3 finding on the MEHMO entry in #14302: prose describing the entry that the entry's own content does not support, passing every gate because no check compares two prose passages with each other.

    Not taken: the review's optional suggestion to give a more exact model identifier in the history record. The value used is the one CLAUDE.md's own documented 'just new-history' example carries, and this session's operating instructions direct that model identifiers not be expanded in artifacts pushed to a repository, so the field stays as the repo's convention has it.


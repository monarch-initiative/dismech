  details: |
    Review round 1 on PR #14300, which had been approved before CI finished and then went red.

    CI fix. The test job failed on check_gene_activity_grounding: F13B was wired into the pathograph on a node carrying no molecular function. Bound GO:0070051 fibrinogen binding with modifier LOSS_OF_FUNCTION on the lesion node, which is the function the entry already cites two sources for. Gate re-run clean.

    Two defects found by an adversarial self-review rather than by the reviewer. First, the activity node and the cross-linking node it causes carried byte-identical ontology annotation (both GO:0018149 peptide cross-linking with the same preferred_term), so the annotation could not tell an enzyme-activity claim from the outcome it produces. Moved the activity claim to molecular_functions with GO:0003810 protein-glutamine gamma-glutamyltransferase activity, matching how the sibling A-subunit entry handles the same pair, and gave the downstream node a differentiated preferred_term. Second, the alpha-2-antiplasmin arm was missing. That is not A-subunit-specific, which was this entry's stated scoping rationale: it follows from the reduced FXIIIa activity the entry already asserts. Added two nodes, Impaired Alpha-2-Antiplasmin Ligation to Fibrin and Accelerated Fibrinolysis of the Formed Clot, citing PMID:25652913, which was already fetched into the worktree and unused. The second node's evidence is marked INDIRECT because the review states the normal mechanism and the inference to accelerated lysis in this disease is ours; no fibrinolysis measurement in a B-subunit-deficient patient was found, and the node says so.

    Evidence grading corrections. PMID:39613144 was graded HUMAN_CLINICAL in one place and OTHER in another for two sentences of the same kind from the same review; both are now OTHER, matching how every other quote from that review is graded here. PMID:41176274's assay-technology sentence was HUMAN_CLINICAL and is now OTHER: nothing in it is a human clinical observation. Added the missing quote_role BACKGROUND to two framing sentences (PMID:26247044, PMID:20331752), which is the #10262 shape.

    Prevalence notes had two uncited numbers. The 95% A-subunit share is now cited to PMID:41583548, and the ten-cases count to PMID:23407795; the word severe was dropped from that count because the source does not qualify the ten by severity, and the record now says so.

    Added differential_diagnoses: the A-subunit form and acquired FXIII deficiency. The entry's whole clinical point is telling those apart and it had no differential block.

    Validation: just validate-disorders (51/51 snippets, 53 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check_gene_activity_grounding against origin/main, list-disconnected-phenotypes 3/3 connected.

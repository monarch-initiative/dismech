  summary: 'Create: Factor XIII B Subunit Deficiency'
  details: |
    Created kb/disorders/Factor_XIII_B_Subunit_Deficiency.yaml for MONDO:0013190, the F13B sibling of the existing Factor_XIII_A_Subunit_Deficiency entry, whose scope statement already excluded isolated B-subunit disease.

    Deep research: one OpenScientist run (research/Factor_XIII_B_Subunit_Deficiency-deep-research-openscientist.md). Its own validation blocks reported 21/21 references resolved, 25/25 quotes valid, and 29/32 terms resolved with 7 label mismatches, of which the dangerous one was HP:0008222 reported as 'Recurrent spontaneous abortion' when HPO calls it Female infertility; that term is not bound in this entry. just preflight-dr returned PASS (F13B mentioned 29 times, OMIM 613235 matching MONDO's xref). Two citations were taken from the report after reading them: PMID:20880254 for the ten-sushi-domain architecture, the fibrinogen gamma-prime tether and the normal activation sequence, and PMID:24286209 for the subunit antigen panel that discriminates A- from B-subunit disease. The rest of the entry was built from a separate PubMed sweep run before the report completed.

    Pathograph: the two mechanistic routes are modelled separately rather than merged, because the literature separates them. Loss of the carrier accelerates FXIII-A clearance (rescued by recombinant FXIII-B in F13b knockout mice, PMID:18224415), and loss of the fibrinogen tether slows thrombin activation of whatever FXIII-A remains (shown with FXIII-A held at a physiological level, PMID:25809477). Both converge on impaired fibrin cross-linking.

    Deliberately not asserted: no phenotype frequencies are banded, because the severe phenotype is known from roughly eleven reported patients and the one well-described case had concurrent thrombocytopenia. The OpenScientist report's own limitations section makes the same point, that most B-subunit phenotype data is extrapolated from the commoner A-subunit form, so nothing A-subunit-specific was imported. Prevalence is recorded as CASES_IN_LITERATURE with the one-in-two-million figure cited only as the denominator for congenital FXIII deficiency as a whole.

    Validation: just validate, just validate-disorders (47/47 snippets, 49 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-genereviews (NO_CHAPTER, which is what the entry's notes record).

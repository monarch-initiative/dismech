  summary: 'Create: Optic Atrophy 3 (MONDO:0008133, OPA3, dominant ADOAC)'
  details: |
    De-novo curation of optic atrophy 3, the autosomal dominant OPA3 optic-atrophy-and-cataract entity (ADOAC).

    Lump/split decision. Curated as its own kb/disorders entry. MONDO:0008133 is a leaf with no descendants, one causal gene, and neither the term nor the label appeared anywhere in kb/ or in an open PR at the time of the claim.

    The dominant question here was not granularity but entity identity. OPA3 causes two diseases: this dominant optic-atrophy-plus-cataract disorder from heterozygous, predominantly missense variants, and recessive Costeff syndrome (3-methylglutaconic aciduria type III) from biallelic, predominantly loss-of-function variants. They differ in onset, systemic features, and a urinary organic-acid marker. Every claim in this entry was traced back to a heterozygous pedigree; Costeff content appears only in the differential-diagnoses block, labelled as such.

    Curation inputs. One Perplexity deep-research run (research/Optic_Atrophy_3-deep-research-perplexity.md, committed alongside) plus independent PubMed E-utilities searching. The report was used for orientation only, for two reasons recorded here because they generalise.

    First, it is titled "OPA3-Associated Optic Atrophy and Organic Aciduria" and interleaves the two OPA3 diseases throughout - exactly the entity confusion this entry exists to keep out. Its statements about chorea, spastic paraparesis and organic aciduria are true of the recessive disease and false of this one.

    Second, its evidence metadata is thin in a way worth noting for the provider generally. Frontmatter reports citation_count 18, but reference validation checked only 4 references and reported 4 of 4 verified, zero confabulations, all on topic. The gap is that the report contains no PMID and no DOI anywhere in its body: it cites bracketed numbers resolving to web pages (MedlinePlus, Orphanet, GARD, NCBI Gene). A clean reference-validation panel here therefore means "the four URL-embedded identifiers we could parse resolved", not "the report is well sourced". Its term validation was more informative and flagged two obsolete terms; independent checking also found a confident mislabel it did not catch, HP:0001103 offered as "optic disc pallor" when HPO calls that term Abnormal macular morphology. This entry uses HP:0000543 for optic disc pallor.

    A reference that could not be quoted. PMID:15342707 (Reynier 2004), the paper that established OPA3 as an ADOAC locus, has no abstract or full text retrievable into references_cache; the cached record is metadata only. It is listed in the top-level references block as the founding citation, but no evidence item quotes it, and the claims it would have carried are sourced instead from PMID:15924081 (the 2005 Rev Neurol report on the same French family, followed for 40 years) and from later series. This is stated in the entry's genetic notes and trailing notes so a reader does not conclude the founding paper was overlooked.

    Structure. Four pathophysiology nodes: heterozygous OPA3 missense variant, reduced OPA3 steady-state levels with mitochondrial network fragmentation, retinal ganglion cell degeneration, and lens fibre mitochondrial dysfunction. The chain deliberately stops at network morphology rather than naming a biochemical step, because OPA3's normal function is not established well enough to support one.

    Two nodes carry qualifications rather than reinforcement. The fragmentation node cites a second family whose fibroblasts showed enlarged mitochondria with slightly fragmented cristae - morphologically abnormal in the same sense, but not in the same direction - and the explanation says so. The lens node is PROVISIONAL because its only functional support is a mouse modelling the recessive disease and no human lens tissue has been examined.

    Animal model recorded as a negative. The Opa3 L122P ENU mouse is entered with relationship FAILS_TO_RECAPITULATE against retinal ganglion cell degeneration, with its own limitations and evidence. The heterozygote - the genotype matching human dominant disease - is unaffected; every retinal and optic-nerve finding in that mouse is a homozygote finding and belongs to Costeff syndrome.

    Discussions. Three, all OPEN: the dominant-versus-recessive evidence-provenance problem (KNOWLEDGE_GAP); the absence of any in vivo model of the dominant disease (HUMAN_MODEL_MISMATCH, with a proposed p.Q105E knock-in experiment); and the unexplained lens mechanism (KNOWLEDGE_GAP).

    Evidence grading. Several items are SUPPORT with directness INDIRECT rather than DIRECT, because the source describes dominant optic atrophy as a class and not OPA3 carriers specifically - the Orphanet review is the main such source, used for prevalence, fundoscopic signs, colour vision and management advice. One evidence item is graded REFUTE: the 2025 family with a segregating OPA3 missense allele and no optic atrophy refutes optic atrophy as an obligate feature, which is why that phenotype is VERY_FREQUENT rather than obligate.

    What the report did contribute. Resolving its citations pulled two papers into references_cache that the independent PubMed searches had missed: PMID:20372962 (OPA3 localised to the mitochondrial outer membrane; overexpression fragments the network and knockdown elongates it; a familial mutant induces spontaneous apoptosis, proposed as gain of function) and PMID:21613372 (Opa3 ocular and lens expression in the L122P mouse). Both are now cited in the pathophysiology, and the first materially improved the mechanism node. The yield came from the citation-resolution step rather than the prose.

    A grading decision that follows from it. The gain-of-function proposal rests on transient overexpression of a single allele in a cell line, so the biological-process annotations on the fragmentation node stay quantitative (modifier INCREASED) rather than being written as GAIN_OF_FUNCTION, and the evidence item carries directness INDIRECT with the reason stated in place.

    Validation. Schema validation passes; 48 of 48 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

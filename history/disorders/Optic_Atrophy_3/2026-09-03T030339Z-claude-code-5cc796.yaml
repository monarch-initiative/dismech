  details: |
    Review round 3. The ADOAC+ series in PMID:31119193 is twelve individuals - one family of seven, one sporadic case, and a second family of four - and the entry prose said eleven twice. Gastrointestinal dysmotility was described as eight of eleven when the source gives eight in the first group plus three in the second family, so eleven of twelve; the band moved OCCASIONAL to VERY_FREQUENT to match, with a note recording that the probands were referred for peripheral neuropathy so 11/12 is an upper bound from an ascertained cohort rather than a population frequency. Autonomic dysfunction corrected to three of twelve. Cataract prose separated the seven-of-eight sub-cohort from the nine-of-twelve series figure. Also folded in two deferred items: the second toxin-avoidance evidence item regraded HUMAN_CLINICAL to OTHER for consistency with its sibling, and the uncached ORPHA:67036 claim hedged. Snippets unchanged and still 50/50; all gates pass.

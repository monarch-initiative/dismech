  summary: 'Review round 1: phenotype coverage and pathograph connectivity'
  details: |
    Response to the automated review on PR #10095 (ai4c-reviewer, CHANGES_REQUESTED). All six findings addressed - both IMPORTANT and all four suggestions.

    IMPORTANT 1, phenotypes omitted from a sentence already quoted. Correct finding, and the reviewer's framing of it is the right one: the defect was not the omission but the inconsistency. PMID:31119193 contains one sentence enumerating three less-common features - autonomic dysfunction (n=3), hearing loss (n=3), recurrent pancreatitis (n=1). The entry curated the hearing loss at n=3 and curated a different paper's n=1 lipodystrophy, while dropping the other two from the same sentence. Added Autonomic Dysfunction (HP:0012332, OCCASIONAL) and Recurrent Pancreatitis (HP:0001733, temporality RECURRENT, VERY_RARE), both quoting that sentence. The pancreatitis description states explicitly why an n=1 finding is included: to keep the inclusion threshold consistent within one source.

    IMPORTANT 2, extrapyramidal signs neither curated nor scoped out. Also correct, and the more interesting of the two. I attempted the structured fix first rather than going straight to a scoping note. ORPHA:67036 (autosomal dominant optic atrophy and cataract) is the source that carries tremor and extrapyramidal rigidity as coded phenotypes, and this repository's ORPHA structured source would make them quotable. It is not among the 347 ORPHA records cached here, and `just refresh-orphadata` fails on a checksum mismatch - en_product1.xml now downloads with sha256 df8d562a... against fb2fbe8c... pinned in data/orphadata/MANIFEST.yaml. Regenerating the pin is not a curation PR's business, so the fetch was abandoned.

    What went in instead is a scoping note that states the position rather than the absence: the feature is real, this entry does not dispute it, and it is missing for want of a quotable source rather than for want of evidence. It names all three unusable sources and why each is unusable - PMID:15924081's body offers only "neurological symptoms" while the specific claim is in its title, which check-title-snippets correctly bars; PMID:22797356 resolves but has no abstract or full text (its cache file is committed so a reader can verify that rather than take it on trust); ORPHA:67036 is uncached and currently unfetchable. It also names the concrete fix and what a future curator should add.

    The reviewer also caught a consequence I had not seen: the description contrasted this disease against Costeff chorea and spastic paraparesis in a way that read as an implicit claim of no movement features, contradicted by the entry's own cited title. Rewritten to say the two syndromes' defining features differ, which is what the evidence supports, and to point at the note.

    SUGGESTION 3, orphan pathograph nodes. Optic Disc Pallor and Colour Vision Defect had no incoming edges. Added two downstream edges from Retinal Ganglion Cell Degeneration, each with a description drawn from material already in the file - the pallor snippet's own "related to the RGC death", and the papillomacular-bundle topography. The graph is now one connected component.

    SUGGESTION 4, cataract frequency. Raised FREQUENT to VERY_FREQUENT. The reviewer is right on the numbers - 7/7 and 7/8 in the ADOAC+ series, congenital in the 2025 family, and the feature is in the entity's name. The description now states the band and the one case against it, the age-38 carrier of the recurrent allele with no lens opacities, so the choice is legible rather than implicit.

    SUGGESTION 5, evidence_source on the toxin-avoidance snippet. Changed HUMAN_CLINICAL to OTHER. The sentence reports expert consensus practice, not a clinical observation, which is what OTHER is for. The pre-existing directness INDIRECT is retained and the explanation now gives both reasons separately.

    SUGGESTION 6, duplicate treatment term. Avoidance of Mitochondrial Toxins reused NCIT:C15747 Supportive Care, already used by the low-vision entry. Rebound to NCIT:C15843 Preventive Intervention, which is reachable from NCIT:C25218 and passes the treatmentterm enum check.

    Validation after the round: schema validation passes; 50 of 50 evidence snippets verified, up from 48; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

    Nothing in this round was disputed. The one thing worth recording as a disagreement-that-wasn't: the reviewer allowed that IMPORTANT 2 might have no quotable sentence and that a scoping note would then be the right fix. It does not, and that is what was done - but the note goes further than "not available" and names the cache gap and the failing refresh recipe, because that is the actionable part.

  summary: 'Review round 1: ground HEPACAM on a molecular function, status epilepticus
    frequency, seizure onset, gap junction hypothesis'
  details: |
    Review round on PR #15053.

    CI gate "Check for newly ungrounded genes" was failing on HEPACAM: the gene reached only two pathophysiology
    nodes, "Biallelic HEPACAM Loss of Function" (a pure variant node) and "Disrupted MLC1-GlialCAM-ClC-2 Junctional
    Complex" (three genes with three different activities), neither carrying molecular_functions. Rather than
    grandfather it in tests/gene_activity_grounding_baseline.txt, the gene descriptor was added to the node that is
    actually about the GlialCAM protein's own molecular behaviour, "Failure of GlialCAM Trafficking to Astrocyte
    Junctions", and that node was bound to GO:0042802 identical protein binding with modifier DECREASED. The node
    already carried the evidence for it: PMID:31960914 reports that MLC2A mutants p.R98C and p.R92Q show a reduced
    ability to interact with wild-type GlialCAM, which is reduced homo-complex formation. The CURIE and label were
    read from ols:go and the EBI OLS record in the same step the line was written; the namespace is molecular_function
    and the definition is "Binding to an identical protein or proteins". The narrower child GO:0042803 protein
    homodimerization activity was rejected because the sources say homo-complex and homo-oligomerization rather than
    dimer. QuickGO was checked first: human HEPACAM (UniProtKB:Q14CZ8) carries no molecular function annotation at all
    today, only GO:0150105 and cellular components, so GO's own silence was a reason to bind the node's evidenced
    binding activity rather than to invent a channel-regulator or chaperone term for GlialCAM.

    Reviewer suggestions taken. Status Epilepticus now carries frequency OCCASIONAL: the 17 percent figure was checked
    in references_cache/PMID_29466841.md, where it appears twice, and the cohort is 141 recessive MLC1 plus 17
    recessive GLIALCAM patients, so the pooled caveat is recorded in the evidence explanation alongside the band. The
    band is unchanged whether the denominator is all patients or only those with seizures, which the explanation also
    says. The untested gap junction coupling to potassium edge is now opted into a disease-level mechanistic_hypotheses
    record, gap_junction_coupling_potassium_buffering, status EMERGING, via hypothesis_groups on the edge; the edge
    keeps its existing "Hypothesis." prose and the record restates only what the node already said, citing the two
    PMIDs already on that node. Seizure gained a structured onset of CHILDHOOD, supported by a new evidence item
    quoting the same paper's median age of 3 years and mode of 2 years, which is inside the HPO childhood band of 1 to
    5 years; the reported range from infancy to 56 years is noted in the explanation.

    Reviewer suggestion declined. No onset was added to Mental Deterioration. The only onset category that matches the
    word "late" is LATE, which means HP:0003584 Late onset, and in HPO that is onset after 60 years, which is false for
    this disease. Neither PMID:29661901 nor the GeneReviews chapter states an age for the start of cognitive decline in
    the cached text; PMID:29661901 reports only that the age did not differ between MLC1 and MLC2A, with no figure. The
    phenotype description already records that the decline is delayed in onset and usually mild.

    No change for PRIMARY_CELL_CULTURE on the mixed HeLa and primary astrocyte study, which the reviewer accepted, and
    no MLC grouping was created here.

    Validation: check_gene_activity_grounding against origin/main exits 0, and the gene grounding pytest with
    GENE_ACTIVITY_BASELINE_REF=origin/main passes. just validate, validate-terms (cache rows added for GO:0042802 in
    cache/go/terms.csv and the molecularfunctionterm enum), normalize-cache, count-verified-snippets at 98/98,
    check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments,
    check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens,
    check-retired-support-prose, check-reference-titles, pytest tests/test_data.py -k Megalencephalic and
    validate-disorders all pass.

  summary: 'Create: Megalencephalic_Leukoencephalopathy_With_Subcortical_Cysts_2A'
  details: |
    New entry for autosomal recessive HEPACAM (GlialCAM) megalencephalic leukoencephalopathy with subcortical cysts (MLC2A, MONDO:0013490), replacing the curation stub.

    Scope: recessive HEPACAM disease only. Dominant HEPACAM disease (MLC2B, MONDO:0013491) has its own MONDO term and a remitting course, so it appears only as a differential diagnosis, as does MLC1. Node names for the shared GlialCAM-MLC1-ClC-2 complex and its downstream astrocyte and myelin steps reuse the names in the MLC1 entry so the two pathographs can be compared. No module conformance was declared: MLC is an astrocytopathy, and cns_myelin_failure scopes itself to primary oligodendrocyte or myelin defects; the MLC1 entry also declares none.

    Mechanism: biallelic HEPACAM loss of function, failure of GlialCAM trafficking to astrocyte junctions, disrupted MLC1-GlialCAM-ClC-2 junctional complex, impaired astrocyte regulatory volume decrease, endfoot swelling, intramyelinic edema, and a potassium and network hyperexcitability branch to seizures. A separate GlialCAM-specific node records reduced astrocyte gap junction coupling, with only a hypothesis edge, because its contribution to disease is untested. No patient brain tissue has been studied for this form, so all tissue nodes rest on Glialcam-null and compound heterozygous knock-in mice; a KNOWLEDGE_GAP discussion records this. Clinical frequencies come mainly from the 2018 international cohort (17 MLC2A patients) and the 2018 seizure inventory (17 recessive GLIALCAM patients); pooled MLC1 plus MLC2A figures are labelled as such. ClinGen gene-disease validity (Definitive, AR, for MONDO:0013490) was copied from the cached CGGV record.

    Deep research: an OpenScientist report was generated and used as a lead list; two papers it surfaced (PMID:40443195, Glialcam-null astrocytes in situ; PMID:22405205, GlialCAM as ClC-2 subunit) were fetched and cited. Not used from it: its OMIM number (it gives 613926, which is MLC2B; MLC2A is 613925), its HGNC identifier (HGNC:4974 is not HEPACAM; the entry binds hgnc:26361), its unresolved HP:0002116 and mislabelled HP:0002451, the claim that about 25 percent of MLC is HEPACAM-related (GeneReviews gives about 22 percent including dominant cases, which the entry does not restate), and the AAV-MLC1 gene therapy results, which are in Mlc1 knockout mice and do not bear on HEPACAM disease. just preflight-dr could not run without a local MONDO build; identity was checked by hand (the report is about HEPACAM and MLC2A).

    Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-retired-support-prose, check-reference-titles, check-environmental-evidence, check-genereviews and validate-disorders all passed.

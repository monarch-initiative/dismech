  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11989, answered in one push. Three blocking content gaps, all research-backed, plus the three suggestions.

    Blocking 1, peripheral neuropathy. Added as a Neurological phenotype bound to HP:0009830, with three human evidence items rather than one: PMID:35346091 for its presence and for the fact that it varies between siblings carrying the same variant, the same paper's EMG characterization (mild axonal sensorimotor), and PMID:37529812 for the independent axonal-plus-demyelinating picture and the point that EMG contributes to the diagnosis. The variability is curated deliberately, because it is what makes the phenotype's absence uninformative. Wired inbound from Neuronal Lysosomal Storage and Intracellular Inclusions with INDIRECT_UNKNOWN_INTERMEDIATES and a description saying the route from lysosomal storage to peripheral nerve is not established in AMRF; the shared upstream lesion is the reason for the edge, not a demonstrated mechanism.

    Blocking 2, C1q nephropathy. Added a histopathology section rather than folding it into an existing node, which also let suggestion 5 be answered in the same structure. The C1q finding is quoted from PMID:18424452, already cited elsewhere in this entry, so no fetch was needed. The description states explicitly that C1q deposition sits beside rather than instead of the collapsing FSGS already curated under phenotypes: they are reported in different families, and the entry does not assert either is the invariable renal histology.

    Blocking 3, the genotype-phenotype modifier. PMID:35346091 was fetched by this PR and cited nowhere. The genetic notes now record that variant type does not predict the clinical course while C-terminal localization is significantly associated with age at onset, and the evidence item quotes the sentence carrying both halves. quote_role is REVIEW_SYNTHESIS because that finding is the paper's synthesis across previously reported cases, not a result from its own index family.

    Suggestion 4, electrophysiology. PMID:33343627 is now cited on the diagnosis record for the two EEG patterns it proposes as characteristic, fixation-off phenomenon and REM-only parasagittal spikes, quoted with the authors' own hedge intact. Giant somatosensory evoked potentials were NOT added: they are named in the deep-research report but no reference cached here states them for AMRF in quotable text. That gap is recorded in the entry notes rather than papered over, which matters in this batch because the MFF entry in the same PR set had to be corrected for making a false claim about what a cached abstract contains.

    Suggestion 5, histopathology. Covered by the same new section: the extraneuronal pigment accumulation on brain autopsy from PMID:15364701. Its description says why the extraneuronal location is the observation rather than incidental detail, since AMRF is not the intraneuronal inclusion picture of the other progressive myoclonic epilepsies.

    Suggestion 6, uncited caches. Three of the five are now consumed. The remaining two are left uncited with the reason recorded in the entry notes rather than pruned: PMID:17485520 is the primary source for the cardiac intercalated-disc role that this entry deliberately excludes, kept in case that exclusion is revisited, and PMID:33772352 is a further case report whose novel splice-site variant is already covered by the curated allelic spectrum.

    Validation: just validate clean, 54/54 snippets verified (up from 47/47), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean.

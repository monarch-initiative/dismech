  summary: 'Review round 3: correct two false prose claims about this PR''s own caches'
  details: |
    Round-3 review on #11989 raised two IMPORTANT findings, both the same shape: curated prose contradicted by a reference cache this PR itself committed. Both verified against references_cache/PMID_35346091.md before editing.

    Finding 1. The trailing notes block claimed no cached reference stated giant somatosensory evoked potentials for AMRF in quotable text. PMID:35346091 states it at line 55 for individual II.8, a confirmed SCARB2 c.134delA p.N45MfsX88 homozygote: 'Long latency reflexes and giant somatosensory evoked potentials (SEP) were recorded.' The finding is now curated as an evidence item on the molecular-diagnosis record, with an explanation recording that the same paper's Table 1 lists II.10 and II.12 as having normal SEP, so absence of the finding does not argue against the diagnosis. The notes paragraph is rewritten as an explicit correction rather than deleted, on the same reasoning used in #11984: a false claim about repository state tells the next curator not to look, so removing it silently would destroy the only trace.

    Finding 2. The C1q histopathology description asserted that C1q deposition and collapsing FSGS are reported in different families. Line 67 of the same cache reports both in one patient, II.13: 'He underwent a renal biopsy, and it showed FSGS. Immunofluorescence microscopy showed deposition of one positive C1q, C3, and IgM in capillary loops.' The description now states the co-occurrence and keeps the narrower hedge the source supports: that biopsy is reported as FSGS without the collapsing qualifier, so what co-occurs is C1q with FSGS rather than specifically with the collapsing variant. The sentence is also now backed by its own evidence item, which gives C1q a second independent family.

    Note on provenance of the error: the finding-1 claim was written in the round-2 push, the same push whose commit message cited the sibling MFF PR (#11984) as the reason to be careful about asserting something false about a cached source. The lesson was stated and not applied.

    Validation on the edited file: just validate clean, schema and terms pass, 56/56 snippets verified against cached references, up from 54/54.

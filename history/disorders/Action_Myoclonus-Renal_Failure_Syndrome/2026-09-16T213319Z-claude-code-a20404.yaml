  summary: 'Create: Action Myoclonus-Renal Failure Syndrome'
  details: |
    Created kb/disorders/Action_Myoclonus-Renal_Failure_Syndrome.yaml from claim issue #11960. Deep research: openscientist (17 citations, 17/17 resolved, 0 unresolved, 0 off topic, 12 of 17 weighed on topic). As with three of the other four runs in this batch, the run's term-validation step aborted on an EBI network timeout and the report carried no validation frontmatter; the ## Reference Validation section was added afterwards with just validate-research-reference. GeneReviews baseline: PMID:26677510 SCARB2-Related Action Myoclonus - Renal Failure Syndrome, found by just check-genereviews and tagged in references:. Pathograph: 6 nodes from LIMP-2 loss through failed beta-glucocerebrosidase lysosomal targeting into a neurological arm and a parallel renal arm that progresses independently. The renal arm's upstream edge is INDIRECT_UNKNOWN_INTERMEDIATES and the node is marked mechanism_confidence PROVISIONAL, because no published step joins reduced GCase delivery to podocyte injury and the two arms can dissociate entirely. The deep-research report added substantially: the 15-patient clinical series (PMID:15364701) giving onset ages, the proteinuria-to-renal-failure interval and collapsing glomerulopathy histology; miglustat substrate reduction therapy (PMID:34337151, PMID:21782476), which is the only mechanism-directed treatment and which the first draft lacked entirely; renal replacement therapy and its explicit failure to affect the neurological arm; and the primary Limp2-knockout paper (PMID:12620969), which changed the animal-model assessment. Reading that paper forwards rather than backwards shows the mouse's own characterized phenotype is ureteropelvic junction obstruction, deafness and peripheral demyelinating neuropathy, with its authors pointing it at a different class of human disease; the AMRF-relevant findings emerged only on reanalysis. The model therefore carries a FAILS_TO_RECAPITULATE link against the neurological node in addition to its partial renal one. One HGNC CURIE (hgnc:1664, SCARB1) and one NCIT CURIE (NCIT:C50083, None Device) were written from memory, were wrong, and were caught by just validate-terms and just check-qualifier-terms-online respectively; the NCIT device term was dropped rather than replaced because no implanted-VNS term exists in NCIT, with the reason recorded in the treatment notes. Validation: just validate and just validate-disorders pass (47/47 snippets verified); duplicate-key, entity-ref, causal-target, enum-value, qualifier-term gates clean; list-gene-term-mismatches clean.

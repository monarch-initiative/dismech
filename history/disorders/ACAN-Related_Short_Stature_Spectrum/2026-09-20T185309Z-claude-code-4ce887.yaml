  summary: 'Create: ACAN-Related Short Stature Spectrum (MONDO:1060149)'
  details: |
    New entry curated for the ISDS group 7 (proteoglycan core protein disorders) coverage gap tracked in #7867, closing the two remaining ACAN rows of that group's checklist as one spectrum entry. Anchored to MONDO:1060149 (ACAN-related short stature spectrum) with SED Kimberley type (MONDO:0012019) and SSOAOD (MONDO:0100462) as has_subtypes; the third MONDO child, the recessive SEMD aggrecan type (MONDO:0013014), is already a separate dismech entry and is deliberately not absorbed. Seven pathophysiology nodes spanning MOLECULAR to TISSUE with a deliberate two-arm structure (growth plate and articular/disc cartilage) and two allele-class routes (truncating vs G3 C-type lectin missense) converging on matrix aggrecan deficiency; one node conforms_to osteoarthritis_cartilage_degradation. 11 phenotypes, 4 treatments with target_mechanisms, one patient iPSC/BM-MSC chondrocyte experimental model with modeled_mechanisms and two readouts, 5 differential diagnoses, 5 discussions (two CONTROVERSY, one HUMAN_MODEL_MISMATCH, one KNOWLEDGE_GAP, one OPEN_QUESTION). Validation: just validate passed with 76/76 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all clean. Nine references newly fetched into references_cache via just fetch-reference. The stub for MONDO:0100462 is deleted by the same change.

  summary: 'Create: ACAN-Related Short Stature Spectrum (MONDO:1060149)'
  details: |
    New entry curated for the ISDS group 7 (proteoglycan core protein disorders) coverage gap tracked in #7867, closing the two remaining ACAN rows of that group's checklist as one spectrum entry. Anchored to MONDO:1060149 (ACAN-related short stature spectrum) with SED Kimberley type (MONDO:0012019) and SSOAOD (MONDO:0100462) as has_subtypes; the third MONDO child, the recessive SEMD aggrecan type (MONDO:0013014), is already a separate dismech entry and is deliberately not absorbed. Seven pathophysiology nodes spanning MOLECULAR to TISSUE with a deliberate two-arm structure (growth plate and articular/disc cartilage) and two allele-class routes (truncating vs G3 C-type lectin missense) converging on matrix aggrecan deficiency; one node conforms_to osteoarthritis_cartilage_degradation. 11 phenotypes, 4 treatments with target_mechanisms, one patient iPSC/BM-MSC chondrocyte experimental model with modeled_mechanisms and two readouts, 5 differential diagnoses, 5 discussions (two CONTROVERSY, one HUMAN_MODEL_MISMATCH, one KNOWLEDGE_GAP, one OPEN_QUESTION). Validation: just validate passed with 76/76 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all clean. Nine references newly fetched into references_cache via just fetch-reference. The stub for MONDO:0100462 is deleted by the same change. Review follow-up: the bone age radiograph is rebound from NCIT:C17369 Imaging Procedure, which equally covers MRI, CT, ultrasound and nuclear medicine, to NCIT:C137876 Bone Radiography, four levels more specific and reachable from the TreatmentActionTerm root NCIT:C25218 via C128940, C16502, C17369 and C18020. The justifying note is rewritten: the previous one recorded a search for "Bone Age Determination" returning nothing and concluded no term existed, which is the named-query-not-re-run failure CLAUDE.md warns about. The broader `l~bone age` search returns both C137876 and NCIT:C181502 Greulich and Pyle Bone Age Estimation, the exact method the description names; C181502 is rejected on positive grounds rather than absent ones, its ancestors being C81307 Estimation Method and C16847 Technique with no path to C25218, so it names the reading method rather than the clinical action. Both CURIEs and labels were looked up against OLS in the same step as writing them, and both were already present in cache/ncit/terms.csv and the treatmentactionterm enum cache, so validation stays offline. Also fixed a dropped capital and stray article in review_notes, added a notes line on Frontal bossing recording that it and Midface retrusion are deliberately left with no causal inlink because the entry models no craniofacial mechanism node, and gave the Orthopaedic Management BYPASSES link its own evidence item. 77/77 snippets verified after the round. The deep-research artifact requested by the review is NOT in this round: no deep-research provider is reachable from the shepherd runner (claude_code reports loggedIn false and no other provider is configured), and hand-writing a research/ file would fabricate the provenance metadata that frontmatter carries. That finding remains open.

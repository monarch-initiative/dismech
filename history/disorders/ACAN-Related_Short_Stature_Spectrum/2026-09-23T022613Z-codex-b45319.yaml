  summary: Review ACAN spectrum mechanisms and growth-treatment evidence against full
    sources
  details: |
    Reviewed the complete dominant ACAN spectrum entry against its cached
    references, including substantive full text for PMIDs 20137779, 24762113,
    27870580, 35338222, and 36387899. Regenerated the 2010 cache with
    just fetch-reference to recover full text. Added and read the full-text
    three-year growth-hormone study (39502477) and extended-family follow-up
    (41211650), plus the abstracts of the Dutch cohort (38232712) and recent
    retrospective growth-treatment cohort (42498135). The repository page
    cached for 38232712 repeats the abstract despite its full_text_html flag;
    it was not treated as substantive full text. Attempts to retrieve the
    2016 SEDK report (27388238) did not yield readable full text, so its
    claims remain limited to the cached abstract.

    Split G3 secretion defects from matrix-ligand binding defects and corrected
    the direction of the ER-retention/secretion relationship. Distinguished
    ligand-specific assay results and construct dependence; corrected the
    tenascin-C partner binding. The 2022 cartilage-explant pilot examined one
    previously described p.V2455M carrier, not the newly reported families.
    Retained both that protein-content result and the limitations of the 2010
    proteoglycan comparison with osteoarthritis controls. Qualified the
    proposed dosage convergence and growth-plate hypertrophy model rather
    than asserting universal haploinsufficiency or directly demonstrated
    premature human chondrocyte maturation. Separated epiphyseal fusion from
    the hypothesized cellular maturation event and corrected causal links.

    Removed phenotype-frequency assertions based on counts of families,
    obligatory short stature, and unsupported prevalence or survival claims.
    Preserved the individual-level bone-age denominator and clearly labeled
    the VUS-containing brachydactyly cohort. Qualified penetrance and
    truncating-versus-missense comparisons. Replaced straw-man REFUTE evidence
    with evidence supporting the actual qualified claim. Retained the scoped
    dominant SEDK/SSOAOD spectrum and distinguished recessive SEMD.

    Added three-year growth-hormone outcomes without equating childhood height
    gain with final adult height; described IGF-I dose reductions and the
    uncertainty around osteochondritis events. Separated GnRH analogues from
    aromatase inhibition, retained the limitations of combination treatment,
    and added completed trial NCT03288103 after checking the registry. Broadened
    the sequencing procedure binding to match Sanger, panel, and exome testing.
    Added evidence to model-to-mechanism links and checked new reference titles
    against their caches for identity and relevance.

    No matching deep-research report exists for this dominant-spectrum entry;
    the adjacent recessive aggrecan-SEMD report describes a distinct disease.
    The GeneReviews baseline check reports NO_CHAPTER. Coverage review included
    phenotypes, subtypes, mechanisms, treatments/trials, genetics, diagnostics,
    and reference consumption; no central cache-supported omission remains.

    Validation: schema, ontology terms, references, entity references, and causal
    targets passed; all 104 evidence snippets verified against the caches.
    Repository evidence hygiene checks passed, including snippet length,
    title snippets, snippet grading, reference titles, environmental evidence,
    folded hyphens, and reference-cache frontmatter. The source-defect scan
    remains advisory and reports unrelated pre-existing findings.

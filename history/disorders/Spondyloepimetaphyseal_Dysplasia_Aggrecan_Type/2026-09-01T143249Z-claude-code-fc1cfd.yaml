  summary: 'Create: Spondyloepimetaphyseal Dysplasia Aggrecan Type (MONDO:0013014)'
  details: |
    De-novo curation of SEMD aggrecan type from a Perplexity deep-research report (research/Spondyloepimetaphyseal_Dysplasia_Aggrecan_Type-deep-research-perplexity.md, sonar-deep-research, 19 citations). The report's reference_validation could check 6 of those 19, all resolved with 4 judged on topic; its term_validation reported 8 of 33 checked labels naming a different term than the report claimed, so no CURIE was reused and every binding was resolved through OAK. References were resolved to PMIDs from the report's PMC URLs via the NCBI ID converter, fetched with just fetch-reference, and quoted from the fetched text. The central curation decision is to model the mechanism as a matrix-anchoring defect rather than as aggrecan deficiency. The founding study (PMID:19110214) showed the p.D2267N mutant G3 domain traffics and is secreted normally while surface plasmon resonance showed altered binding and kinetics against tenascin-C, so the negative secretion result is given its own pathophysiology node because it is what excludes the mechanism a reader would otherwise assume. Tenascin-C is named as the binding partner because it is the one measured, not because the other G3 lectin-domain partners were excluded, and a KNOWLEDGE_GAP discussion records that distinction. A second discussion records the unexplained severity difference between the two reported families (66-71 cm in the original siblings versus 118.3 cm in the second patient). The entry is scoped to the recessive aggrecan-type SEMD and relates rather than absorbs the dominant ACAN disorders (SED Kimberley type, familial osteochondritis dissecans). Growth hormone is deliberately not listed as a treatment because nothing in the sources evaluates it in this disease and importing it would extrapolate across a different allele class. One snippet failed reference validation during curation because it stitched two non-contiguous sentences from the source; it was split into two evidence items rather than paraphrased. Validated with just validate (schema, terms, references: 26/26 snippets verified after the fix) plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values, all clean.

  summary: 'Publication-readiness review: ZTTK syndrome'
  details: |
    Expanded the entry from a sparse outline to a representative multisystem phenotype set. Added autosomal dominant/de novo inheritance, recurrence and reproductive-testing counseling, the central SON-dependent spliceopathy and renal mechanism, evidence for every causal edge and phenotype, molecular diagnostic criteria, supportive management, and explicit renal, audiologic, ophthalmologic, and endocrine surveillance. Added GeneReviews tagging, the organ-system manifestations it reports, and queryable facial and renal HPO findings. Replaced weak or indirect claim support with exact snippets from primary human cohorts, functional studies, and GeneReviews. Connected every phenotype using direct edges only for established outcomes and partial indirect edges where intermediates remain unresolved. Kept datasets empty rather than adding a non-informative record solely to maximize compliance.

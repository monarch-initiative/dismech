  summary: 'Create: VAPB-Related Proximal Spinal Muscular Atrophy'
  details: |
    New disease entry for issue #1079 (Neurodegenerative category, priority-diseases epic). VAPB-Related Proximal Spinal Muscular Atrophy (MONDO:0008453, Finkel-type SMA/SMAFK) is caused by the dominant VAPB P56S mutation, a founder variant traced to Portuguese colonization of Brazil, which also produces ALS8 in the same kindreds. Curated a 4-node pathophysiology chain (P56S misfolding/aggregation -> ER-mitochondria uncoupling/ISR activation -> autophagy blockade + RBP mislocalization -> anterior horn motor neuron degeneration) plus a KNOWLEDGE_GAP discussion on aggregation burden vs cell-autonomous stress. Deep-research performed via claude_code provider (research/VAPB-Related_Proximal_Spinal_Muscular_Atrophy-deep-research-claude_code.md). All 8 PMIDs independently fetched and verified against cached abstracts (just fetch-reference); one natural-history reference cited via DOI (not yet PubMed-indexed). Ontology terms verified via OAK (2 term-ID corrections made after initial term-validator run: CL:0011001 spinal cord motor neuron, MAXO:0000533 molecular genetic testing, MAXO:0035091 electromyography procedure).

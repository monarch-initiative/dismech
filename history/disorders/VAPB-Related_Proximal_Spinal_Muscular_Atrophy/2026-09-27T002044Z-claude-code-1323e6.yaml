  summary: Address three rounds of review findings
  details: |
    Addresses the ai4c-reviewer findings from 2026-07-28, 2026-08-01 and 2026-09-07, none of which had been actioned. Merged origin/main (no rebase - not my branch), resolving seven derived-cache conflicts by taking main's canonical copies. BLOCKING 1 (retired enum): supports: PARTIAL migrated to SUPPORT + directness: INDIRECT on the PMID:23281774 negative mouse result, per the CLAUDE.md retired-value table. BLOCKING 2 (uncommitted DOI cache): fetched DOI:10.1080/21678421.2026.2674020; it caches content_type: unavailable (Taylor & Francis HTTP 403 on the PDF for both a plain fetch and a --force retry, no abstract), so nothing in it can be an evidence snippet. Removed the unverifiable progression evidence item AND its figures from the notes prose rather than relocating them, listed the paper under references as a lead, and recorded the reason in the entry notes. Bundling: split 'Disrupted ER-Mitochondria Coupling and Integrated Stress Response' into ER-Mitochondria Uncoupling (new evidence: the ER MAM disruption sentence from PMID:40764463) and Integrated Stress Response Activation (the ATF4 sentence), and split 'Autophagy Blockade and RNA-Binding Protein Mislocalization' into two nodes, each keeping the one PMID:33972508 evidence item that belongs to it (the two carried different evidence_source values, which was the signal). GO annotation: added GO:0034976, GO:0034620 (ISR node), GO:0016236, GO:0000045 (autophagy node), GO:0034063 (RBP node), all labels read from cache/go/terms.csv. Dropped the redundant CL:0000100 beside CL:0011001. Phenotypes: added PMID:18523548 evidence to Fasciculations, Muscle cramps and Postural tremor, graded HUMAN_CLINICAL + quote_role BACKGROUND because the quoted sentence is that Drosophila paper's introduction restating the established human ALS8 picture; dropped the VERY_FREQUENT band from Proximal muscle weakness because its 94% support is only in the unavailable DOI. Wired the degeneration node to seven lower-motor-neuron phenotypes, taking connectivity from 0/9 to 7/9 (UMN signs and postural tremor deliberately left unwired - corticospinal and unclear mechanism respectively). Fixed the inheritance/treatments penetrance inconsistency. Recorded the GeneReviews NO_CHAPTER determination. NOT done, deliberately: T46I/V234I variants and the ClinGen Definitive VAPB-ALS8 classification have no quotable sentence in any cached reference and no cached CGGV assertion, so they are declined rather than written from the research report. Validated: schema 0 issues, terms, 14/14 snippets, causal-targets, entity-refs.

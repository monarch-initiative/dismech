  summary: 'Create: PLPBP-Related_Pyridoxine-Dependent_Epilepsy'
  details: |
    New entry for MONDO:0015005 (PLPBP deficiency, OMIM:617290), the second gene-defined child of pyridoxine-dependent epilepsy (MONDO:0009945). Named with the gene-phenotype dyad scheme agreed in dismech issue 14963, so the stubs/Epilepsy_Early-onset_Vitamin_B6-dependent.yaml stub is deleted. Deep research was requested from falcon with --fallback; falcon (403) and openai (401) failed authentication and the report was produced by openscientist (research/PLPBP-Related_Pyridoxine-Dependent_Epilepsy-deep-research-openscientist.md; 19/19 references resolved, 1/7 quotes unmatched, a paraphrase of the PMID:27912044 title that was not used). The GeneReviews chapter PLPBP Deficiency (PMID:36795901) is the phenotype baseline and is tagged; every phenotype in its abstract is captured (neonatal seizures, ASM resistance with PN/PLP response, neurodevelopmental impairment, speech delay, hypotonia), and its agents to avoid are recorded on the vitamin B6 treatment. Further evidence from the founding study (PMID:27912044), the 2019 cohort and zebrafish model (PMID:30668673), the 2026 systematic review of 54 individuals (PMID:41671913), cell studies (PMID:37451483), protein studies (PMID:29689137), case series (PMID:28391250, 30525118, 31741821, 33977028, 36577449, 42563912) and E. coli PNP studies (PMID:31677193, 34978460). Fibroblast PLP accumulation (PMID:27912044) is recorded as REFUTE against the direction of the cellular PLP change; normal intellect and normocephaly in one mild series (PMID:28391250) are recorded as NO_EVIDENCE, since they show variable expression rather than contradicting that the features occur. The glycine cleavage branch rests on E. coli data (PMID:31677193) and is worded as a candidate mechanism. Validated with just validate, count-verified-snippets (53/53), check-entity-refs, check-causal-targets and check-genereviews.

  summary: 'Create: immunodeficiency 81 (LCP2)'
  details: |
    Curated de novo from primary literature (no deep-research recipe). LCP2/SLP-76 deficiency (IMD81, MONDO:0030302), autosomal recessive combined immunodeficiency from biallelic loss of the SLP-76 TCR-signalosome adaptor. Pathophysiology chain: LCP2 biallelic LOF -> loss of SLP-76 adaptor function -> impaired proximal TCR signaling (reduced PLCgamma1/Ca2+/ERK) -> impaired thymic T-cell development (mouse Slp76 KO, graded MODEL_ORGANISM) and defective T-cell activation -> combined T/B immunodeficiency, with parallel neutrophil and platelet signaling arms and EBV-driven lymphoproliferation. Evidence from human patient reports PMID:33231617 (index SCID), PMID:37211057 (compound-het CID/autoimmunity), PMID:36474126 (homozygous frameshift, EBV DLBCL; in-vitro Jurkat readouts graded IN_VITRO) and the founding mouse knockout PMID:9695951 (graded MODEL_ORGANISM, directness INDIRECT). Validated: just validate, validate-terms, count-verified-snippets 26/26, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, validate-disorders all pass.

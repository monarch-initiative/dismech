  details: |
    Curated IEMbase WP-006 row 2.1.01.01 (GCLC-related gamma-glutamylcysteine synthetase deficiency) as a new standalone disorder entry anchored to MONDO:0009259. NEC preflight against MONDO:0009259 passed on both identity anchors the term carries: RO:0004003 -> HGNC:4311 (GCLC) and xref OMIM:230450, matching the seed row's gene and OMIM. Pathograph: destabilized GCLC-GCLM holoenzyme -> reduced glutamate-cysteine ligase activity -> cellular glutathione depletion -> oxidative erythrocyte injury -> premature erythrocyte destruction -> chronic non-spherocytic hemolytic anemia, with four nodes conforming to the hemolytic_anemia_erythrocyte_destruction module. The neurological arm is modelled as an INDIRECT_UNKNOWN_INTERMEDIATES edge plus a KNOWLEDGE_GAP discussion rather than conformance to a neurodegeneration module, because the literature reports the association without a mechanism and explicitly records no genotype-phenotype correlation. Validation: just validate PASS (schema + terms + references), 55/55 evidence snippets verified against cached references; all 10 PMIDs fetched with just fetch-reference and no cache file hand-written; check-title-snippets and check-duplicate-keys pass.

  summary: 'Create: ROSAH_Syndrome'
  details: |
    New entry for ROSAH syndrome (MONDO:0013999; ALPK1 gain-of-function autoinflammatory disease), claim issue #14873. Deep research was requested from falcon; Edison returned 403 (authentication), so the run fell back and research/ROSAH_Syndrome-deep-research-openscientist.md (openscientist) is the report used. Its 24 references all resolved; the one flagged off topic (PMID:31075211, H. pylori ADP-heptose) was not cited; preflight-dr warnings were TIFA (the pathway substrate, same disease) and OMIM 607347 (the ALPK1 gene MIM), both benign. GeneReviews chapter PMID:38935811 (abstract only) is tagged and used as baseline for phenotypes, diagnosis, management, surveillance and counseling. Primary sources: Kozycki 2022 (PMID:35868845), Williams 2019 (PMID:30967659), Tantravahi 2012 (PMID:22307799), Huryn 2023 ophthalmic cohort (PMID:36332842), Snelling 2023 and 2024 (PMID:38060563, 39626775), plus case series. Optic disc elevation bound to HP:0012795 rather than Papilledema (defined by raised CSF pressure). PMID:38251500 was cached with no quotable text and is not cited. A fresh-context red-team review (dismech-pr-review) was run before the PR and its important findings fixed (diagnosis section, GI/malaise phenotypes, ciliary evidence_source, IFN-gamma loop direction, animal models, Cogan wording). Validated with just validate (111/111 snippets verified, terms and schema clean), check-entity-refs, check-genereviews and validate-disorders.

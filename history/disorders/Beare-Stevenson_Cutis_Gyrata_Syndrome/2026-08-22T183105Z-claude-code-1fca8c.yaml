  summary: 'Create: Beare-Stevenson Cutis Gyrata Syndrome (MONDO:0007412)'
  details: |
    Curated de novo from primary literature, filling the last unfilled seat in the FGFR-Related Skeletal Dysplasias grouping identified during its completeness review. BSS was the only member of the classical FGFR2 craniosynostosis series (Apert, Crouzon, Pfeiffer, Jackson-Weiss) with no dismech entry, and was absent from the stub queue entirely until that review added it.

    Structure: 7 pathophysiology nodes, 19 phenotypes, 2 progression phases, 3 treatments, 3 discussions, 65 evidence items across 12 references spanning 1992-2026.

    Mechanism. The chain runs FGFR2 cysteine-creating variant -> ligand-independent disulfide-mediated receptor dimerization -> sustained signaling with p38 MAPK activation, then branches to the suture arm (osteogenic acceleration -> premature fusion and cloverleaf skull) and the skin arm (epidermal hyperplasia and cutis gyrata). Four nodes carry conforms_to anchors on fgfr_gain_of_function_skeletal_dysplasia: #Constitutive FGFR Activation, #Sustained MAPK/STAT Signaling, #Cranial Suture Osteogenic Acceleration and #Premature Suture Fusion and Craniosynostosis.

    Two nodes deliberately carry NO module anchor, and the reason is stated in each node description rather than left implicit. (1) Epidermal Hyperplasia and Cutis Gyrata: the module's consequence nodes cover growth plate and cranial suture only, so there is no epidermal arm to conform to; forcing an anchor would assert membership in a node that does not describe it. If a second FGFR disorder with a keratinocyte arm is curated - Crouzon syndrome with acanthosis nigricans already has one - an epidermal consequence node in the module is worth proposing. (2) Tracheal Cartilaginous Sleeve and Airway Compromise: modeled because it is the most actionable finding in the syndrome (about 90% risk of death by two years without tracheostomy), but its causal link to the FGFR2 variant is explicitly NOT asserted - the node description and gap_bss_tracheal_sleeve_frequency_and_causation both say so.

    Why this member matters to the grouping: its recurrent alleles are cysteine-creating substitutions driving ligand-independent dimerization, the same activation class as the extracellular-cysteine alleles of thanatophoric dysplasia type 1 in the opposite (FGFR3 chondrodysplasia) arm. It is therefore the member that joins the two arms at the level of receptor activation rather than tissue, which is now stated in the grouping notes.

    Discussions: gap_bss_p38_inhibition_translation (HUMAN_MODEL_MISMATCH - p38 inhibition rescues the skin phenotype in the Fgfr2 Y394C mouse, but the demonstrated reversal is cutaneous, human craniosynostosis is established at birth, and nothing links p38 to the airway lesion that actually kills; explicitly says this must not be curated as an emerging treatment); gap_bss_tracheal_sleeve_frequency_and_causation; gap_bss_versus_crouzon_prenatal_discrimination.

    Evidence discipline. No frequency bands were assigned to any phenotype: the entire evidence base is fewer than 30 published cases, which is curated as a CASES_IN_LITERATURE prevalence record with the authors' own caveat. The Przylepa 1996 allele snippet is quoted verbatim including the published abstract's own typographical errors (sporatic, Ty375Cys, Iglll), noted in its explanation so a later reader does not 'correct' a quote. PMID:38265560 (mosaic FGFR2 p.Asn549Lys neurocutaneous syndrome) was reviewed and deliberately not cited - different postzygotic disorder, differential-diagnosis consideration rather than BSS evidence. PMID:31373082 is the most on-topic paper for the airway arm but caches with content_type unavailable, so sleeve evidence is drawn from PMID:25706251 rather than quoting a title. One placeholder snippet caught in self-review and replaced with the real finding sentence before commit.

    Validation: pre-edit hook PASS (after correcting progression phase/age_range/notes shape, removing phenotype_term from a Pathophysiology node, and CAUSAL -> CAUSATIVE on genetic relationship_type); just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 65/65 verified against cached references. Added as the 14th member of kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml (check-groupings: all 14 SATISFIED) and stubs/Beare-Stevenson_Cutis_Gyrata_Syndrome.yaml deleted.

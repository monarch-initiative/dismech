  summary: Review Beare-Stevenson mechanisms, clinical spectrum and care against
    cached full texts
  details: |
    Reviewed the entire entry and all evidence associations against the reference caches, including full texts where available. Eligibility: the entry had CREATE history but no REVIEW; a fresh audit of all files and histories in 108 open PRs found no overlap. It is a Mendelian FGFR2 disorder, within the campaign excluding infectious and environmental diseases/poisonings. The worktree began at main 5947c9dc90fd48d8716fb119c75e07642676d674.

    Sources: read all cited clinical abstracts; regenerated and read the complete PMID:22585574 mouse paper; read the complete PMID:9539778 biochemical study, PMID:41775672 prenatal case, PMID:41882888 autopsy report including tables, PMID:19610084 deletion case including Table I, PMID:32886384 comparative mouse-airway study including methods and tables, and PMID:41112086 longitudinal human-airway case. Recovered and read GeneReviews NBK1455 clinical descriptions, diagnostic strategy, management, risk assessment and Tables 1-6. The reader URL retained HTML markup, so quotations cite the complete PDF generated through the /sites/books/ route. Standard /books/ URLs returned CAPTCHA pages and were excluded. The PDF cache title is its URL; it is the same FGFR Craniosynostosis Syndromes Overview indexed under PMID:20301628. PMID:31373082 remained unavailable on retry; no title-only evidence was used. The grouped FGFR2 manual research note was reviewed for identity and scope: it explicitly covers multiple Mendelian and somatic diseases, with the correct BSS OMIM 123790 and causal gene. Its cross-disease material was not treated as BSS evidence; all retained BSS assertions were checked in primary sources or GeneReviews. A single-disease automated identity verdict was not represented as applying to this grouped report.

    Mechanisms: the 1998 disulfide-bond paper explicitly did not test the BSS substitutions. Replaced the asserted directly demonstrated BSS dimerization step with ligand-independent FGFR2 activation supported by Y375C-transfected RCS cells and Y394C mouse keratinocytes; retained the proposed disulfide explanation with its limitation. Corrected the tissue-specific signaling picture: p38 is activated in epidermis and skull, while ERK1/2 also rises in skull. Osteogenic proliferation decreases as differentiation increases; epidermal proliferation increases. The full p38 study reports slight suture improvement in a minority of pups, no significant quantitative skull-shape improvement, and no survival benefit under the tested regimen. The prior skin-only efficacy claim was incorrect. The tracheal sleeve experiment had already been performed: no sleeve in five newborn Y394C whole-mount specimens, despite sleeves in C342Y mice. Added the resulting human-model mismatch, with sample-size, age and background caveats, and replaced the unperformed-experiment premise. Tracheostomy does not remove fused cartilage or eliminate tube-malposition risk. Removed unsupported causal edges attributing every associated craniofacial and neurologic finding to restricted cranial volume, and the claim that tracheostomy inhibits cartilage fusion.

    Clinical completeness: 19 to 66 phenotypes, 3 to 16 care entries, two diagnoses, two differential diagnoses, two human autopsy histopathology findings, one animal model and two cell models. Added missing BSS-specific GeneReviews findings and explicitly case-scoped prenatal, airway, deletion-associated and autopsy observations. No frequency band or population prevalence was inferred from selected case counts. Craniosynostosis was present in four of six original cases, not universally. The 90% airway mortality figure is a historical cross-syndrome observation rather than a prospective BSS-specific risk. The deletion-associated Beare-Stevenson-like patient had normal later neurodevelopment, limiting universal impairment claims across the broader spectrum. The short intestine and visceral findings in one severely ill autopsy case do not establish a universal primary FGFR2 mechanism or explain poor growth conclusively. Prenatal suspected esophageal/choanal atresia, uncertain digital contractures and unconfirmed anorectal findings were not promoted to definite phenotypes. No independently supported intradisease subtype, biochemical diagnostic biomarker, or BSS-directed human therapeutic trial was identified in the consumed sources. Experimental p38 inhibition remains in the model/discussion context rather than human care.

    Genetics: structured the recurrent Y375C and S372C variants, de novo likely-pathogenic Phe276Cys case, and the reported c.859del63 deletion in a BSS-like presentation. The deletion's proposed splicing mechanism is unproven. The 2015 PMID and DOI abstracts both say Ser372Tyr, while a later case compilation says Ser372Cys; primary full text was not recovered, so this remains a documented nomenclature discrepancy rather than a confirmed non-cysteine mechanism. Transcript context is retained for c.1124A>G/p.Tyr375Cys; mouse Y394C numbering is not silently substituted into the human variant. Counts across overlapping case reports were not summed into prevalence estimates.

    GeneReviews baseline: BSS clinical findings and usual neonatal cutaneous onset are quoted. Diagnostic confirmation, broader genetic-testing options, inheritance transmission and residual parental-mosaic recurrence risk, prenatal/preimplantation testing, infant airway assessment, continued tracheostomy precautions, sleep/vision/hearing/developmental surveillance, feeding, dental care, cranial surgery, CSF diversion, cervical-positioning precautions, eye protection, delivery planning and psychosocial care are represented. Surveillance intervals have direct Table 6 evidence. Shared FGFR recommendations remain identified as such; Apert-only findings or therapy were not imported. Split cranial expansion from ventriculoperitoneal shunting. Added Crouzon/Pfeiffer overlap without claiming cutis gyrata is an absolute discriminator.

    Ontology: OLS searches supported specific pelvic kidney, posterior cranial fossa, broad toe and prominent umbilicus bindings. The umbilical finding now uses HP:0001544 instead of the broader HP:0001551. The source-unspecified posterior-fossa and hippocampal findings carry SOURCE_UNSPECIFIED. Relative prognathism was not equated with an elongated mandible. Rugated labia and prominent labial raphe remain unbound after searches returned no matching term. The autopsy short-intestine finding was not bound to a specifically congenital term because congenital origin was not demonstrated. Generated HPO label and enum rows are included; cache markdown was generated exclusively through just fetch-reference.

    Validation before formatting/rebase: authoritative validate-disorders passed 174 snippets and 176 titles, with none skipped or unavailable. Schema and ontology pass. Causal targets, entity references, coarse binding basis, qualifier terms, duplicate keys, knowledge-gap targets, source-defect claims and snippet boundaries pass. GeneReviews is TAGGED. Term-cache integrity passes. The advisory prose-figure audit flagged the inheritance 50% figure; the adjacent GeneReviews quotation explicitly supports it. Broader snippet/title/grading/format gates are checked separately before commit.

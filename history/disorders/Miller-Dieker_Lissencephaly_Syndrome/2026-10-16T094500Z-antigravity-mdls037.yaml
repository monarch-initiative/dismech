  summary: Enhance Miller-Dieker Lissencephaly Syndrome with classifications, diagnosis, differential_diagnoses,
    complete references, structured prevalence, and pathophysiology gene and molecular_function bindings.
  details: '1. Added classifications.harrisons_chapter (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC).

    2. Completed top-level references list with all 11 cited PMIDs, exact cached titles, and findings:
    [].

    3. Bound inheritance_term (HP:0001466 Contiguous gene syndrome) on the De novo 17p13.3 deletion inheritance
    entry.

    4. Replaced an ellipsis snippet in 17p13.3 Contiguous-Gene Deletion with a contiguous verbatim abstract
    quote (PMID:29628935), added PAFAH1B1 (hgnc:8574) and YWHAE (hgnc:12851) gene bindings plus GO molecular_functions
    (GO:0008569, GO:0008017, GO:0050815) on PAFAH1B1 (LIS1) Haploinsufficiency and YWHAE Contribution
    to Severity, and added multi-omics translation/migration and METTL16 rescue evidence (PMID:39508990)
    to mTOR Pathway Hypoactivity.

    5. Added structured prevalence fields (population, measure_type: BIRTH_PREVALENCE, prevalence_class:
    BAND_1_9_PER_100000, rate_per_100000: 1.0, rate_denominator: LIVE_BIRTHS).

    6. Added diagnosis section covering Array Comparative Genomic Hybridization (NCIT:C198497), Fluorescence
    In Situ Hybridization and Molecular Genetic Testing (NCIT:C17563), and Prenatal Fetal Ultrasound Imaging
    (NCIT:C222238) backed by PMID:24055730 and PMID:20301752.

    7. Added differential_diagnoses section covering Isolated Lissencephaly Sequence (MONDO:0011830),
    Distal 17p13.3 Microdeletion Syndrome (YWHAE-Included, PAFAH1B1-Sparing), and Chromosome 17p13.3 Microduplication
    Syndrome (with class I and class II phenotypic distinctions) backed by PMID:29628935, PMID:12796778,
    and PMID:36433683.

    8. Added target_mechanisms links on symptomatic treatments (Seizures, Infantile spasms, Feeding difficulties,
    Growth failure, Spasticity).

    '

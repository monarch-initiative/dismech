  summary: 'Create: Mitral Valve Prolapse'
  details: |
    New Disease entry for non-syndromic mitral valve prolapse, organised around the reconciliation of two facts that look contradictory: prolapse is present in 2.4 percent of a community population and is benign in nearly all of them, yet accounts for 7 percent of sudden cardiac deaths under age 40 and 13 percent in young women. The entry models two mechanistically distinct routes of injury from one echocardiographic finding. The haemodynamic route runs through regurgitation and ventricular volume overload, graded by effective regurgitant orifice area. The mechanical route runs through mitral annular disjunction and systolic curling, which convert leaflet excursion into repetitive traction on the papillary muscles and inferobasal wall, producing the regional fibrosis that is the arrhythmic substrate; this operates in patients with no or trivial regurgitation. Ten pathophysiology nodes. One conforms_to on the myocardial fibrosis node targeting fibrotic_response#Excessive ECM Deposition, with mechanical traction substituted for the module's usual chemical or inflammatory tissue injury. Deliberate non-conformance to cardiac_ion_channel_repolarization is recorded in notes: that module is scoped to structurally normal hearts, and the entire point of the arrhythmic MVP literature is that these hearts carry demonstrable regional fibrosis. One CANONICAL mechanistic hypothesis, mechanical_traction_arrhythmogenesis, with edge-level opt-in. Two discussions: a KNOWLEDGE_GAP on arrhythmic risk stratification with two proposed experiments, and an OPEN_QUESTION on whether haemodynamic and arrhythmic prolapse are one disease or two. Validated: just validate (schema OK), just validate-terms (OK), and reference validation with 42/42 snippets verified against cached references.

  summary: 'Address PR 8318 review: frequency bands, CL specificity, treatment evidence'
  details: |
    PR Shepherd follow-up addressing the six blocking items in the ai4c-reviewer
    review of PR #8318. No new references were introduced, so no reference-cache
    files were fetched or modified.

    CRITICAL 1 - Removed the PMID:26258302 evidence item from the "Mitral Valve
    Repair" treatment. Three defects were stacked in one item: the snippet quotes
    Dchs1 heterozygous *mouse* MVICs while the item was tagged HUMAN_CLINICAL;
    the explanation rested on a different sentence of the abstract than the one
    quoted; and even repaired it would not have supported the treatment, since
    "MVICs are obtainable during repair surgery" is a claim about cell sourcing,
    not about mitral valve repair as an intervention. The treatment retains its
    PMID:42525396 survival evidence, which does the actual work. PMID:26258302
    remains cited four times elsewhere in the entry where it is on-claim.

    CRITICAL 2 - Removed "frequency: OCCASIONAL" from the Sudden Cardiac Death
    phenotype. OCCASIONAL is defined as 5-29% of patients, so on this phenotype
    it asserted that 5-29% of people with mitral valve prolapse die suddenly -
    roughly two orders of magnitude off. The cited snippet supports no proportion
    at all, and the 7%/13% figures elsewhere in the entry carry the *inverse*
    denominator: the share of sudden deaths attributable to MVP, not the share of
    MVP patients who die. The entry's own notes already state that no absolute
    arrhythmic-risk claim is made here; the frequency band was making that claim
    anyway, in the one field a machine reads. Per the frequency-evidence SOP,
    omission is correct when the band cannot be sourced.

    IMPORTANT 3 - Syncope OCCASIONAL -> VERY_RARE. The phenotype's own cited
    Framingham snippet reports "three (3.6 percent) had syncope", which sits
    below the 5% OCCASIONAL floor and inside VERY_RARE.

    IMPORTANT 4 - Congestive Heart Failure OCCASIONAL -> VERY_RARE. The cited
    snippet reports that none of the 84 community subjects with prolapse had a
    history of heart failure. The explanation was rewritten to state that
    denominator and to attribute the cases that do occur to the
    severe-regurgitation minority rather than to the community phenotype this
    cohort samples.

    IMPORTANT 5 - Replaced the generic CL:0000057 fibroblast, which had been used
    for two different cell populations, with precise terms: CL:4030032 valve
    interstitial cell on the Myxomatous Leaflet Remodeling node, and CL:0002548
    fibroblast of cardiac tissue on the Regional Left Ventricular Fibrosis node.
    This is more than a granularity improvement: sharing one CURIE collapsed the
    valve interstitial cell and the cardiac fibroblast into the same graph node,
    erasing the leaflet-lesion versus myocardial-lesion distinction the entry is
    built to draw. The obsolete CL:0008023 was deliberately not used. Both chosen
    CURIEs were already present in cache/cl/terms.csv and in the celltypeterm
    enum membership cache with these exact labels, so no cache rows changed.

    IMPORTANT 6 - Removed "frequency: FREQUENT" from Mitral Regurgitation. The
    cited snippet establishes that regurgitation is greater in prolapse than
    without it and that it is usually trace or mild, but reports no proportion of
    affected patients, leaving the 30-79% band unsourced. The explanation was
    rewritten to say what the snippet does and does not support.

    Non-blocking suggestions 7-13 in the review (absent deep-research artifact,
    two snippets truncated mid-figure, missing inheritance block, missing
    role: trigger tag, absent edge-level evidence, missing Framingham comparator
    phenotypes, and the category: Acquired question) were deliberately left for
    the entry author rather than guessed at.

    Validation: "just validate kb/disorders/Mitral_Valve_Prolapse.yaml" passed
    across schema, term, and reference validation; "just validate-terms" passed
    independently, confirming the two new CL bindings; "just
    count-verified-snippets" reports 41/41 verified against cached references,
    down from 42 by exactly the one removed evidence item. Working tree shows
    only the disorder YAML and this history record changed - no cache churn and
    no derived files.

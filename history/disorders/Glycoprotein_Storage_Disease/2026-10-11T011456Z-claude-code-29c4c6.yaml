  summary: Bind FUCA1 and AGA molecular functions on the glycosidase-deficiency node
  details: |
    The node 'Lysosomal Glycosidase Deficiency and Impaired Glycoprotein Catabolism' names FUCA1 and AGA but carried no molecular function for them, which the gene-activity grounding gate flags. Added GO:0004560 alpha-L-fucosidase activity (FUCA1) and GO:0003948 N4-(beta-N-acetylglucosaminyl)-L-asparaginase activity (AGA), both DECREASED, matching the core functions in the ai-gene-review FUCA1 and AGA reviews and the lysosomal_glycoprotein_degradation module. Labels taken from the GO term cache; validate, validate-terms and check_gene_activity_grounding --against-ref origin/main pass.

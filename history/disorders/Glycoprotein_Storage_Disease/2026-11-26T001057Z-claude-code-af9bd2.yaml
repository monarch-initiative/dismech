  summary: 'Gene-family review: add missing glycoproteinosis genes MANBA, NEU1, NAGA,
    CTSA'
  details: |
    The entry's description and diagnosis section name seven member genes (FUCA1, MAN2B1, MANBA, AGA, NEU1, CTSA, NAGA) but only FUCA1, AGA and MAN2B1 had genetic records or sat on the shared glycosidase-deficiency node. Added CAUSATIVE germline genetic records for MANBA (beta-mannosidosis; GeneReviews PMID:42160655), NEU1 (sialidosis; PMID:29693572), NAGA (Schindler/Kanzaki disease; PMID:2243144) and CTSA (galactosialidosis; PMID:23915561). Each of the four is ClinGen Definitive for its own member disease, but those assertions are for the member diseases rather than for MONDO:0009296, so no tier was copied into gene_disease_validity. On the node 'Lysosomal Glycosidase Deficiency and Impaired Glycoprotein Catabolism' the three glycosidases were added with their GO molecular functions marked decreased (beta-mannosidase activity, exo-alpha-sialidase activity, alpha-N-acetylgalactosaminidase activity), and CTSA with enzyme activator activity, because galactosialidosis is a secondary deficiency of neuraminidase 1 and beta-galactosidase caused by loss of the protective protein that activates and stabilizes them; the node description now says so. Evidence for each addition reuses quotes already verified in the member entries.

  summary: Add ICIMD, Harrison's and lysosomal storage classifications
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + GENETICS_ENVIRONMENT_DISEASE, icimd_category 'glycoprotein_degradation' (ICIMD group 'Disorders of glycoprotein degradation' under category 'Disorders of complex molecule degradation'; Ferreira et al. 2021, PMID:33340416), and lysosomal_storage_category 'glycoproteinosis' with a real evidence block quoting PMID:39796208. This entry is the class-level parent of the ICIMD group rather than an individual disorder, and the notes record that plus the deliberate contrast with the ICIMD category 'Congenital disorders of glycosylation' - CDG covers failures to build glycans, the oligosaccharidoses failures to degrade them. Classified consistently with NAGA_Deficiency_Type_3, a member disorder classified in the same sweep. Validated with 'just validate' - schema, term and reference validation all passed, 16/16 snippets verified.

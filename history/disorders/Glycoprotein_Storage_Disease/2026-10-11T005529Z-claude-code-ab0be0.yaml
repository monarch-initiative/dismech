  summary: Name FUCA1 and AGA on the glycosidase-deficiency node
  details: |
    Added FUCA1 (hgnc:4006) and AGA (hgnc:318), the two member genes the entry already types in genetic[], as genes on the node 'Lysosomal Glycosidase Deficiency and Impaired Glycoprotein Catabolism', so the class node is wired to its genetic records. Added one evidence item (PMID:27906067, AGA deficiency blocks glycoasparagine degradation) beside the existing fucosidosis exemplar. The node's process, glycoprotein catabolic process (GO:0006516, DECREASED), is a core process of both genes in their ai-gene-review reviews. Other member genes (MAN2B1, MANBA, NEU1, CTSA, NAGA) are not in this entry's genetic[] and were not added.

  summary: Enriched umbrella glycoproteinosis entry with MAN2B1/molecular grounding,
    module-conforming GO bindings, phenotypes, diagnostic pathway, and ERT/HSCT treatments
  details: |
    Added MONDO synonym, autosomal recessive inheritance (HP:0000007), and classifications evidence (REVIEW_SYNTHESIS). Grounded all three pathophysiology nodes (preserving protected node Neuroinflammation and Neurodegeneration) with biological_scale, MAN2B1 (hgnc:6826) and alpha-mannosidase activity (GO:0004559), lysosome (GO:0005764), lysosomal_substrate_accumulation module-conforming GO biological processes, macrophage and neuron cell types, UBERON locations, and bare-name downstream edges to all 11 phenotypes. Expanded phenotypes from 7 to 11 (adding Growth delay, Hearing impairment, Recurrent infections, Angiokeratoma, and diagnostic flag on Oligosacchariduria), added MAN2B1 to genetic, added structured urinary oligosaccharide, enzyme assay, and molecular genetic diagnosis entries, and added Supportive Care, Velmanase Alfa ERT, Hematopoietic Cell Transplantation, and Genetic Counseling treatments with target_mechanisms.

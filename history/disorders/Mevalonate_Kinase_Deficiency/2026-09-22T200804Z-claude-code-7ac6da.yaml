  summary: 'Review: connect eighteen phenotypes across the MKD severity spectrum (IUIS
    Table 7)'
  details: |
    All eighteen phenotypes were detached. The wiring follows the disease's own severity spectrum rather than putting everything on one node.

    Twelve attack-associated features attach to the systemic autoinflammation node. Four neurological and dysmorphic features attach to the enzyme-deficiency node instead - developmental delay, cerebellar ataxia, cataract and the facial gestalt - because those belong to mevalonic aciduria, the severe end, and severity tracks residual enzyme activity rather than attack frequency. Putting them on the autoinflammation node would have asserted that they follow from attacks, which the entry's own descriptions contradict.

    Two confirmatory assays are reports_on readouts of the enzyme node: reduced mevalonate kinase activity, and elevated urinary mevalonic acid, which accumulates upstream of the blocked step. Elevated serum IgD is NOT modelled that way - it is a downstream consequence of the inflammation, and the entry is explicit that it is a biomarker rather than the driver.

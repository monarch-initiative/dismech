  summary: Annotate HP:6000253 necrotizing vasculitis (grouping member)
  details: |
    Added a Histopathologic phenotype node bound to HP:6000253 "Necrotizing vasculitis" as part of creating the Necrotizing Vasculitides grouping (kb/groupings/Necrotizing_Vasculitides.yaml, issue #8754). Before this change no entry anywhere in the KB used HP:6000253, so the grouping's NECESSARY membership criterion had nothing to evaluate against and just check-groupings reported every listed member as a contradiction; annotating the defining lesion on each member is what makes the grouping auditable rather than aspirational. Every snippet is an exact quote from an abstract already cached by just fetch-reference. Validation actually run over this file: just count-verified-snippets (no unverified snippets) and the batched pre-PR sweep just validate-disorders across all eight edited entries, which passed schema, ontology-term and reference validation ("Files validated: 8 ... All validations passed", "Snippets checked: 386/401 verified against cached references (15 skipped by prefix)"). Evidence: PMID:39257888, which states GPA is characterized by granulomatous inflammation of the respiratory tract and necrotizing vasculitis of small and medium vessels. The pre-existing generic HP:0002633 Vasculitis node was left untouched - it makes a different, broader claim.

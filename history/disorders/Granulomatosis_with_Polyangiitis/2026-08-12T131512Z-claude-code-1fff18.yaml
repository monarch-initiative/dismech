  summary: Link silica and staphylococcal carriage to the ANCA node
  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the B cell autoreactivity and ANCA production node, which is where an environmental risk factor enters this disease and the most upstream immune node the entry offers. They are graded identically because they rest on the same sentence of the same clinical practice review, which lists silica dust, farming and chronic nasal staphylococcal carriage together as associated with increased risk of developing the vasculitis. The silica exposure carries a second, weaker item that is doubly hedged as evidence having grown for a possible relationship, which is why it is PARTIAL. One discrepancy is recorded rather than silently inherited: this entry's notes for the staphylococcal exposure claim an association with disease relapse as well as with onset, but no cited sentence mentions relapse, so the link records onset risk only and its description says so. Both narrative reviews cited on these links are tagged OTHER, matching how the other reviews in this tranche are tagged; they had inherited HUMAN_CLINICAL from the exposure block, which split the convention across a single tranche. A duplicate history record for this entry, created when a timed-out command was retried, was removed before merge. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 104 of 104 verified.

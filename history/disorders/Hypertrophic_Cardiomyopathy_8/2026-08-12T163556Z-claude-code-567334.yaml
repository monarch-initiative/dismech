  summary: 'Address PR #7829 review: consume unmined deep-research content'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7829. The review found no
    CRITICAL issues and confirmed the entry was accurate; the blocker was content-completeness,
    specifically that the YAML under-consumed the deep-research report committed alongside it
    (research/Hypertrophic_Cardiomyopathy_8-deep-research-claude_code.md). All seven IMPORTANT
    items and most of the SUGGESTIONS are addressed below.

    IMPORTANT item 1 - no diagnosis section. Added a diagnosis block with four entries drawn
    from DR section 10: cardiac MRI with late gadolinium enhancement (NCIT:C16809), transthoracic
    echocardiography with attention to mid-ventricular segments (NCIT:C16525), ambulatory Holter
    monitoring (NCIT:C38064), and multigene HCM panel testing (NCIT:C15709). Each is written to
    the genotype-specific point rather than as boilerplate: CMR is the study that finds the
    apical aneurysm and mid-cavity obliteration echo misses, and the echo entry states that
    absent outflow-tract obstruction is not reassurance in this genotype. The panel entry also
    records what is deliberately NOT indicated (CMA, karyotype, FISH, mtDNA, repeat expansion -
    no CNV or repeat mechanism, ClinGen dosage score 0). Evidence: PMID:35288424 (already cached),
    PMID:30681346 and PMID:33288880 (already cited elsewhere in the entry).

    IMPORTANT item 2 - septal reduction therapy missing. Added "Extended Mid-Ventricular Septal
    Myectomy" (NCIT:C51591 Myectomy, therapeutic_modality SURGERY), stating that mid-cavitary
    rather than subaortic obstruction requires an extended mid-ventricular myectomy with
    papillary muscle reorientation, and that alcohol septal ablation is generally unsuitable
    because the septal perforator territory does not supply the mid-ventricular hypertrophy.
    Both evidence items are PARTIAL by design and the notes say why: PMID:12021217 and
    PMID:35288424 attest the mid-cavitary ANATOMY, not the operation. No MYL3 patient in the
    literature has undergone myectomy, so no MYL3 surgical-outcome claim is made.

    IMPORTANT item 3 - heart transplantation missing. Added "Heart Transplantation"
    (NCIT:C15246, SURGERY) citing PMID:33288880 for the homozygous p.Glu36Ter proband
    transplanted at age 6. Flagged in notes as a single case.

    IMPORTANT item 4 - aficamten absent, no clinical_trials block. Added aficamten as a second
    therapeutic_agent on the existing Cardiac Myosin Inhibition treatment (CHEBI:747213, verified
    reachable from CHEBI:24431) with SEQUOIA-HCM evidence (PMID:38739079), plus EXPLORER-HCM
    evidence for mavacamten (PMID:32871100). Added a clinical_trials block with NCT03470545
    (EXPLORER-HCM), NCT04349072 (VALOR-HCM) and NCT05186818 (SEQUOIA-HCM), each fetched with
    'just fetch-reference' and each carrying an explicit note that enrolment was by phenotype
    and not stratified by MYL3 genotype. The VALOR-HCM and SEQUOIA-HCM notes go further and
    record that both trials selected for outflow-tract obstruction or guideline SRT eligibility
    written around subaortic anatomy - i.e. not the mid-cavity pattern MYL3 produces - so the
    extrapolation to this entry is mechanistic, not empirical.

    MAVACAMTEN TERM - deliberate non-change, now documented so it is not re-litigated. The
    reviewer endorsed leaving mavacamten term-less; this session verified WHY and recorded it in
    the treatment notes. NCIT:C174901 Mavacamten exists but its ancestors are Inotropic Support /
    Agent / Conceptual Entity, so it is NOT reachable from NCIT:C1909 Pharmacologic Substance and
    would fail the ChemicalEntityTerm enum; CHEBI has no mavacamten term (searched). Aficamten,
    by contrast, is reachable via both NCIT:C179072 and CHEBI:747213, and CHEBI was chosen per
    the CLAUDE.md preference for small molecules.

    IMPORTANT item 5 - AF, thromboembolic stroke and anticoagulation unmodeled. Added a
    pathophysiology node "Atrial Remodeling and Intracavitary Stasis" (ORGANISM scale,
    mechanism_confidence PROVISIONAL) fed by the existing Diastolic Dysfunction node and
    draining to two new phenotypes, Atrial Fibrillation (HP:0005110) and Cardioembolic Stroke
    (HP:0001297). The node deliberately models TWO stasis routes - the dilated fibrillating
    atrium and the akinetic apical aneurysm - because in this genotype the aneurysm arm is the
    genotype-specific one. Added the "Oral Anticoagulation" treatment with a target_mechanisms
    INHIBITS edge onto that node, therapeutic_agent bound at class level (NCIT:C263 Anticoagulant
    Agent) because the cited case does not name the drug. The anticoagulation entry also carries
    the harm: the extra-axial haemorrhage attributed to it, curated PARTIAL because the source
    itself hedges ("potentially secondary to"). Frequency is omitted throughout this arm and the
    node notes say why - one genotyped case, no MYL3 series reporting AF or stroke rates.
    Cardioembolic Stroke uses the general HP:0001297 Stroke term with a narrower preferred_term,
    following the same convention the entry already uses for non-sustained VT.

    IMPORTANT item 6 - over-generic ICD treatment term. Changed treatment_term from NCIT:C15329
    Surgical Procedure to NCIT:C80435 Implantable Cardioverter-Defibrillator Placement (verified
    present in the treatmentactionterm enum membership cache). Also added the risk-marker
    evidence item from PMID:35288424, with notes clarifying that it documents general criteria
    being applied to a MYL3 carrier, not a MYL3-specific indication.

    IMPORTANT item 7 - penetrance under-consumed, gap rationale overstated. Both PMIDs flagged
    by the reviewer were fetched fresh with 'just fetch-reference' and read before use, as the
    reviewer required for DR-sourced citations. PMID:37929589 (Circulation 2024 meta-analysis)
    and PMID:26443374 (Kanazawa WES, MYL3 p.R94H) are both real and both say what the DR report
    claimed. Added penetrance: INCOMPLETE, penetrance_percentage: "32-88" and expressivity:
    VARIABLE to the Autosomal Dominant inheritance block, with four evidence items. The
    description explicitly warns the three figures are not interchangeable and must not be
    averaged: ~32% is a pooled cross-study estimate for cascade-screened nonproband relatives
    (benchmarked against a 57% all-gene average, quoted as a second evidence item so the
    ascertainment context travels with the number), whereas 40% (p.V79I) and 88% (p.R94H) are
    single-pedigree allele-specific values whose spread is itself the finding, and both are
    age-confounded. Softened the myl3_natural_history_gap rationale accordingly: it no longer
    claims penetrance was estimated in "exactly one pedigree", and instead states that penetrance
    is now bounded but only by a pooled figure plus two pedigrees with no prospective MYL3 cohort,
    while the rest of the natural history - survival, arrhythmia rate, AF incidence, stroke rate,
    sudden-death denominator - remains genuinely unmeasured.

    SUGGESTIONS addressed. (a) GeneReviews PMID:20301725 tagged but unmined - the reviewer asked
    for a one-line note so this is not re-opened. PublicationReference has no notes slot, so the
    record went into a new top-level notes: block instead, stating that the PubMed record is a
    purpose statement with no minable clinical text and that this is a recorded scoping decision.
    (b) Prevalence - added a second, explicitly DERIVED point-prevalence record
    (BAND_1_9_PER_100000, rate 1.0-2.0/100,000) whose notes spell out the derivation from HCM
    prevalence ~1 in 500 and the ~1% myosin-light-chain share, with both inputs cited PARTIAL
    (PMID:25814232, PMID:12404107) because neither states a MYL3 prevalence. The original record
    with its deliberate numeric omission is retained unchanged. (c) Histopathology - added a
    modest block for sarcomeric ultrastructural disruption with interstitial fibrosis
    (NCIT:C3044), grounded on the mouse evidence (PMID:28371863, MODEL_ORGANISM) plus a PARTIAL
    human item (PMID:23594557). Myofiber disarray was deliberately NOT curated and the notes say
    why: HP:0031318 is real but is not reachable from the HistopathologyFindingTerm enum roots
    (its ancestors are HP:0001637 Abnormal myocardium morphology, not HP:0025461), and more
    importantly no cached MYL3 source describes disarray - the PMID:23594557 abstract states
    histopathological findings were obtained without describing them, so asserting disarray would
    have required either an unsourced claim or a snippet quoted from a non-MYL3 paper.
    (d) Classifications - added harrisons_chapter CARDIOVASCULAR and GENETICS_ENVIRONMENT_DISEASE,
    matching the parent Hypertrophic_Cardiomyopathy entry.

    SUGGESTIONS deliberately not actioned. Node 4 bundling (Cardiomyocyte Hypertrophy, Myocardial
    Stiffness and Fibrosis) was left intact - the reviewer noted splitting would complicate its
    clean mapping onto a single cardiomyopathy_maladaptive_remodeling module node and was noting
    rather than requesting. The penetrance-as-phenotype entry was left in place: it now reads as
    the allele-specific p.V79I pedigree observation, complementary to rather than duplicating the
    gene-level penetrance data newly added to the inheritance block.

    EVIDENCE DISCIPLINE. Every new PMID was fetched with 'just fetch-reference' and its abstract
    read before any snippet was written; no references_cache file was hand-created or hand-edited.
    All new NCIT, HP and CHEBI identifiers were verified with OAK against local sqlite:obo
    adapters before use (NCIT:C80435, C51591, C15246, C15709, C16525, C16809, C38064, C263,
    C179072; HP:0005110, HP:0001297, HP:0031318, HP:0001907; CHEBI:747213), and enum reachability
    was checked with 'runoak ancestors' for the terms not already present in the
    cache/enums/ membership caches. Three PMIDs were fetched during research and then NOT cited
    (PMID:37639243 VALOR-HCM week 56, PMID:38718139 the 2024 AHA/ACC guideline, PMID:30297972
    SHaRe); their cache files were removed rather than committed, since uncited cache files are
    not needed for deterministic validation.

    A large incidental churn was reverted, not committed: running the reference validator
    re-normalizes YAML quoting across the whole references_cache tree and left 7,632 tracked
    files modified with no content change. Those were restored with 'git checkout -- references_cache/'
    so the PR diff contains only the four newly cited cache files and the three trial records.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_8.yaml' - the
    batched pre-PR sweep CI itself runs, with --no-full-text - passed in full: schema "No issues
    found", term validation "Validation passed", reference validation "All validations passed"
    with "Snippets checked: 82/82 verified against cached references" (up from 53/53 before this
    session). Term-cache additions from this run are in-order single-line insertions
    (CHEBI:747213 aficamten, HP:6000144 Left ventricular aneurysm, plus their enum membership
    rows) written by linkml-term-validator, not by hand.

  summary: 'Create: Hypertrophic Cardiomyopathy 8 (MYL3)'
  details: |
    Created kb/disorders/Hypertrophic_Cardiomyopathy_8.yaml for MONDO:0012111 (CMH8, MYL3, OMIM:608751, hgnc:7584). NEC preflight run twice against sqlite:obo:mondo (gene MYL3, OMIM 608751, synonym CMH8 all confirmed) and again over the DR report body (MYL3 mentioned 128x vs MYL2 5x; only OMIM 608751 and MONDO:0012111 asserted), deliberately guarding against the MYL2/HCM10 adjacent-entity confusion. DEEP-RESEARCH PROVIDER SUBSTITUTION: falcon was requested but is unavailable in this environment (no EDISON_API_KEY/FUTUREHOUSE_API_KEY set; deep-research-client reports 'Available: claude_code'), so claude_code was substituted as the DR provider and the report is committed at research/Hypertrophic_Cardiomyopathy_8-deep-research-claude_code.md. DR output was treated as leads only: every cited PMID was fetched with 'just fetch-reference' and every snippet was verified as an exact substring of the cached abstract; no references_cache file was hand-created. Primary references used: PMID:8673105 (Poetter founding ELC paper), PMID:12021217 (recessive E143K, mid-cavitary hypertrophy with restrictive physiology), PMID:22957257 (p.V79I, late onset, 40 percent age-dependent penetrance), PMID:23594557 (infantile-onset), PMID:12404107 (186-proband screen finding no MYL3 variant; light chains about 1 percent of HCM), PMID:33288880 (biallelic nonsense and splice-acceptor loss-of-function, zebrafish rescue failure, sudden cardiac death, explicitly negative skeletal muscle examination), PMID:35288424 (mid-cavity obstruction with left ventricular apical aneurysm and non-sustained VT), PMID:42372158 (thick filament molecular interface mapping), PMID:34014247 and PMID:32034976 (super-relaxed state), PMID:23748425, PMID:21885653, PMID:36509720 and PMID:28371863 (cross-bridge kinetics, calcium sensitivity, fibrosis), PMID:30681346 (ClinGen definitive gene), plus the CGGV MYL3 definitive assertion and GeneReviews PMID:20301725 tagged in the top-level references block. Declares conforms_to against cardiomyopathy_maladaptive_remodeling at Primary Cardiomyocyte Insult, Ventricular Remodeling and Progressive Contractile Dysfunction. The MYL3 literature is genuinely thin, so four discussions were recorded rather than padding weakly-sourced claims: a KNOWLEDGE_GAP on MYL3 natural history, penetrance and the absent sudden-death denominator; a CONTROVERSY on loss-of-function versus myosin hypercontractility; a HUMAN_MODEL_MISMATCH on Tg-A57G eccentric hypertrophy versus human concentric HCM; and a KNOWLEDGE_GAP on whether skeletal myopathy generalises beyond the original Poetter kindreds. Treatments are explicitly flagged as extrapolated from general HCM because no MYL3-stratified outcome or trial data exist. Validation: just validate passed, just validate-references verified 53 of 53 snippets, just validate-terms passed.

  summary: 'Create: IMPG1-related Recessive Retinopathy'
  details: |
    New entry for MONDO:1040037. Entry type decided as DISEASE: the ClinGen Retina GCEP curation (CGGV assertion d638e88c, Definitive, AR) lumps recessive IMPG1 vitelliform macular dystrophy and recessive IMPG1 retinitis pigmentosa into one entity on a shared mechanism, biallelic loss of IMPG1 function, and splits the dominant IMPG1 disease off because carriers in recessive families are only subclinically affected; the founding report (PMID:23993198) likewise contrasts a dominant-acting missense allele with recessive null alleles. The pathograph runs from biallelic loss of function through interphotoreceptor matrix disorganization, outer-segment disorganization and apical RPE dysfunction to subretinal autofluorescent deposits and photoreceptor degeneration, using the Impg1 knockout mouse (PMID:36140676), the discordant earlier knockout (PMID:32265257), medaka knockdown and retinal organoid blockade. Relation to Adult_Onset_Foveomacular_Vitelliform_Dystrophy: that entry binds MONDO:0014508 (VMD4) as its dominant IMPG1-related subtype; this entry does not bind VMD4 as a subtype term and instead maps its recessive vitelliform subtype to VMD4 with skos:broadMatch, stated in notes. Deep research: one OpenScientist report, no fallback. All 16 citations resolved. Errors in the report that were not carried over: it states that Impg1 knockout mice have a normal retina and does not mention the later knockout with a late-onset phenotype; it pools onset and imaging data from heterozygous (dominant) cases into the recessive phenotype; it attributes Spacrcan (IMPG2) hyaluronan binding (PMID:15044457) to SPACR; it labels HP:0011505 as macular dystrophy (it is Cystoid macular edema) and HP:0007663 as progressive macular degeneration (it is Reduced visual acuity), neither caught by the report's term validation, which checked one label. Uncited references fetched while reading (heterozygous case reports and cohorts) are not committed. Validation: just validate, validate-terms, count-verified-snippets (45/45), the per-file offline gates, snippet grading/length/title/reference-title gates, list-gene-term-mismatches, check-genereviews (no chapter), and validate-disorders.

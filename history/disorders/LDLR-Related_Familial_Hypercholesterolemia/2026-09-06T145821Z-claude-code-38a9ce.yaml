  summary: 'Review response: correct sourcing and factual errors in the FH1 augmentation'
  details: |
    Self-review round on the augmentation recorded earlier today, run with the dismech-pr-review skill before opening a PR. Fourteen findings; all substantive ones verified against the caches before acting, and all fixed in this push.

    Factual errors corrected:

    - The J.D. fibroblast strain was named and described as homozygous FH. J.D. is a compound heterozygote (maternal exon 13-15 deletion, paternal Y807C), and the proof is in PMID:22653811, a cache this same change adds. The 1976 'FH homozygote' wording is a pre-molecular clinical-phenotype label. Renamed and corrected, and the limitations now record that the strain reports Y807C in the absence of a second functional receptor rather than a Class 4 allele in isolation.
    - 'Smoking does not raise LDL cholesterol' was stated as an absolute and is false; smokers show higher LDL-C in meta-analysis. Restated as the defensible claim, that smoking's contribution in FH runs predominantly through the arterial wall.
    - 'Cessation is disproportionately valuable here compared with the general population' was contradicted by the paper cited on the same exposure: PMID:35294538 reports no significant interaction between carrier status and lifestyle (OR 1.2, 95% CI 0.6-2.5, P=.62) and concludes carriers benefit similarly to the general population. Restated as an absolute-risk argument, and the no-interaction conclusion is now cited on that exposure rather than left out.
    - The JD iPSC statin link asserted the block is at receptor induction. The source reports the opposite: induction of LDLR mRNA was similar regardless of genotype. Restated so the gating sits in the function of the induced receptor, with that quote added as its own evidence item.
    - The J.D. readout direction was ABOLISHED, which contradicts this entry's own Class 4 node ('enters the cell slowly', PMID:3955657). Changed to DECREASED with the discrepancy explained in the interpretation.

    Sourcing corrected:

    - The saturated-fat exposure's only quantitative citation was PMID:35294538, whose cached full text says the lifestyle score 'was only minimally associated with LDL cholesterol concentrations' - a source cutting against the diet-to-LDL edge it was attached to. Added PMID:32827219 (Cochrane, reduction in saturated fat intake), which actually measures the exposure against that node and reports the effect as small, plus its dose-response sentence. The minimally-associated sentence is now recorded on the same exposure as a directness: INDIRECT qualifier so the tension is visible rather than dropped, and the entry description no longer claims this is 'the one modifiable exposure that acts on the lipid node'.
    - Removed the claim that PMID:34167030 assigns alleles to receptor classes; it reports function, and the class call is PMID:25386756's, already cited on the diagnosis item. Recorded why this paper anchors the model rather than the larger PMID:34906454 effort the entry cites elsewhere.
    - Restored the 'at least some of which' hedge that PMID:42677454 puts on its repeat-5 gain-of-function cluster.
    - Dropped unsourced specificity from two cell_source values ('immortalized', a named line) that neither abstract nor GEO record states.

    Other fixes: added the missing reference_title on the GEO:GSE329001 evidence item (it was the only evidence item in the file without one); replaced two dataset notes that misstated the dataset-curation SOP, which forbids bulk-generated evidence but permits a curated item quoting a cached GEO summary, and added those evidence items; removed repository meta-commentary from the Class 4 explanation and qualified its coated-pit attribution, which PMID:189940 does not show; unstaged references_cache/PMID_38338916.md, which nothing cites and which duplicates the already-tracked DOI_10.3390_ijms25031637.md.

    Added rather than dropped: PMID:22653811's headline result, roughly eight-fold oversecretion of lipidated apolipoprotein B-100, is now a findings entry on that model. It is deliberately not a pathophysiology node - the entry models impaired clearance only, and the finding records that scope limit explicitly instead of leaving the model's own paper contradicted in silence.

    Not changed: the falcon report was regenerated in place rather than added as a new file. The superseded 2026-08-19 run remains in git history, its citations are cached under references_cache, and no entry claim depends on it, since entry claims cite PMIDs whose caches are untouched.

    Validation after fixes: just validate-disorders passes, 153/153 snippets verified; verify-datasets 3/3; model-scale-audit --strict exits 0; folded-hyphen, snippet-length, title-snippet, snippet-grading, environmental-evidence, enum-value, entity-ref, causal-target, duplicate-key and qualifier-term gates all pass; 2912 pytest checks pass. Compliance 93.8 percent (347/370), up from 92.8 percent before the review round.

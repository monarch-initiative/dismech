  summary: 'Create: LDLR-Related Familial Hypercholesterolemia (MONDO:0007750, FH1)'
  details: |
    Curated hypercholesterolemia, familial, 1 (MONDO:0007750; OMIM:143890) as a
    standalone Disease entry - the LDLR/receptor-side member of the dominant FH
    trio.

    Scope decision (the crux of issue #8765). Curated separately rather than folded
    into kb/disorders/Familial_Hypercholesterolemia.yaml (MONDO:0005439), for four
    reasons: (1) MONDO models MONDO:0007750 as a distinct is_a child of
    MONDO:0005439, anchored on OMIM:143890 and the synonym "LDL receptor disorder";
    (2) the umbrella entry's has_subtypes axis is zygosity (heterozygous /
    homozygous), not gene, so a gene-defined entity cannot be attached there without
    mixing two orthogonal axes; (3) the two other dominant FH genes already have
    sibling entries curated on exactly this rationale -
    Familial_Defective_Apolipoprotein_B-100 (MONDO:0007751, APOB) and
    Autosomal_Dominant_Hypercholesterolemia_3 (MONDO:0011369, PCSK9) - so leaving
    the receptor-side form unmodelled would make the set incoherent; and (4) the
    mechanism graph curated here is the LDLR receptor itinerary (synthesis, ER-to-
    Golgi export, surface ligand binding, clathrin-pit clustering, endosomal release
    and recycling) with the classical mutation classes mapped onto the step each
    breaks, plus the residual-activity-gates-receptor-dependent-therapy relation.
    The umbrella entry does not model any of that. The entry states this explicitly
    in its notes: block so the added value over MONDO:0005439 is on the record.

    NEC check. 'just preflight-dr' returned SKIP: MONDO records no RO:0004003 causal
    gene for this term, so the automated gene-identity check cannot discriminate and
    the manual OMIM/gene/synonym preflight was used instead. The report's OMIM
    (143890) matches the MONDO OMIM xref; LDLR dominates the report's gene mentions
    (LDLR=70 vs PCSK9=19, APOB=3); and the MONDO synonym list ("LDL receptor
    disorder", FHCL1, "hyperlipoproteinemia, type 2A") is uniformly receptor-side.
    Identity confirmed as the LDLR form, not ADH2 (APOB) or ADH3 (PCSK9).

    Deep research. Provider: falcon. The report's own reference-validation pass
    resolved 7/7 extracted identifiers with 0 unresolved, 0 unverifiable, and 0
    off-topic, so nothing was curated from an unresolved citation.

    GeneReviews baseline. PMID:24404629 (Familial Hypercholesterolemia) fetched,
    cached, tagged GeneReviews in the top-level references: block, and mined into
    structured findings covering clinical characteristics, diagnosis/testing,
    management, agents and circumstances to avoid, and genetic counselling. The
    chapter is class-level across LDLR/APOB/PCSK9 and is cited as such rather than
    as LDLR-specific evidence.

    Validation actually run and read. 'just validate' passed end to end - schema
    validation, term validation, and reference validation with "Snippets checked:
    106/106 verified against cached references". 'just validate-disorders' (the
    batched pre-PR sweep CI runs, --no-full-text) passed on this file.
    'just check-duplicate-keys' clean. 'just check-title-snippets --against-ref
    origin/main' reported no new title-quoting snippets. tests/test_data.py passed
    for this file (16 scoped tests; the one suite-wide failure is a pre-existing bare
    -URL reference issue in Travelers_Diarrhea.yaml, untouched by this branch).
    Weighted compliance 92.3 percent.

    Pre-PR self-review round (red-team pass before opening the PR). A reviewer
    agent run against the draft returned REQUEST_CHANGES; every finding was acted
    on rather than argued away:

    - CRITICAL, fixed. The draft asserted in three places that statins "fail in
      receptor-negative (null-null) homozygotes". The only genotype-stratified
      evidence in the entry is an 8-patient trial of a PCSK9 antibody
      (PMID:24014831), whose two receptor-negative patients were already on stable
      statin therapy at enrolment - and the entry's own cited review reports statins
      helping both homozygous and heterozygous patients. The claim was restricted to
      the agent actually tested, and the untested statin arm was added to the
      residual_ldlr_activity_response_threshold KNOWLEDGE_GAP, which is its proper
      home.
    - Six evidence items quoted methods, aims, or boilerplate rather than findings
      (the #8352 failure family). Four were replaced with the actual result
      sentences, which were already present in the cached references - notably
      substituting "16 of the 132 cell strains (12%) synthesized no immunodetectable
      LDL receptor protein" for the immunoprecipitation methods sentence.
    - The class 3 (binding-defective) node's lead snippet was a proportion claim
      about the EGF-precursor domain, which in context supports the class 2 and
      class 5 nodes rather than class 3. Replaced with the binding-specific finding
      ("similar expression to wt LDLR but demonstrated deficient LDL binding").
    - Four treatments every sibling entry curates were missing and are now added:
      ezetimibe, bempedoic acid, inclisiran, and liver transplantation. Three are
      load-bearing for this entry's thesis rather than incidental - ezetimibe and
      bempedoic acid both lower LDL-C by upregulating LDL receptor, so they attach
      to the receptor-dependent gating node, and liver transplantation is the
      limiting case of supplying receptor and attaches directly to the receptor-
      activity node. Note this entry deliberately does NOT follow the umbrella
      entry's characterization of ezetimibe as "independent of LDLR"; the cited
      review states it works through a compensatory increase in LDL receptor, and
      the divergence is recorded in that treatment's notes.
    - Added a differential_diagnoses block (APOB / PCSK9 / LDLRAP1 recessive /
      polygenic / Lp(a)-mimicry / sitosterolemia-dysbetalipoproteinemia-CESD),
      which for an entry whose whole rationale is separating the receptor-side form
      from its siblings was the highest-value structured gap.
    - Added the on-thesis trial NCT06597006 (inclisiran in children with documented
      biallelic null LDLR mutations, excluding poor prior PCSK9-antibody
      responders), whose enrolment criteria operationalize the gating relation.
    - Softened the lomitapide genotype claim: unlike the evinacumab trial, the
      pivotal lomitapide study was single-arm and not genotype-stratified.
    - Added plasma apolipoprotein B as a biochemical marker, and replaced the
      lipoprotein(a) biomarker term with the neutral HP:0430148 so it no longer
      reads as "variably elevated-Lp(a)". NOTE: the reviewer proposed HP:0012185 for
      apolipoprotein B; OAK shows HP:0012185 is "Constrictive median neuropathy",
      so that suggestion was discarded and HP:0031798 verified and used instead -
      reviewer suggestions were term-checked rather than trusted.
    - Documented, rather than flattened, the mixed evidence_source values against
      the GeneReviews PMID: Clinical Characteristics/Diagnosis/Genetic Counseling
      statements are HUMAN_CLINICAL observations, Management and
      Agents-to-Avoid statements are expert recommendations and are OTHER.

    Post-review validation (all re-run and read after the changes): just
    validate-disorders passed with "Snippets checked: 123/123 verified against
    cached references"; just validate-terms passed; check-duplicate-keys clean;
    check-title-snippets reports no new title-quoting snippets; 16 scoped
    tests/test_data.py tests pass. Weighted compliance rose from 92.3 to 93.4
    percent.

    Known gaps left open deliberately: the two discussions: entries (a KNOWLEDGE_GAP
    on what residual-receptor-activity threshold separates responders from non-
    responders to receptor-directed therapy, and a HUMAN_MODEL_MISMATCH on whether
    any LDLR-deficient animal model reproduces the human arterial course well enough
    for event-endpoint studies) carry proposed_experiments but no evidence, which is
    correct for open questions.

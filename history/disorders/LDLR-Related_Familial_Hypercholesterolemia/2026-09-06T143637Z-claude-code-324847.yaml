  summary: 'Augment: LDLR-Related Familial Hypercholesterolemia (MONDO:0007750)'
  details: |
    Augmentation of the existing FH1 entry, requested as 'hypercholesterolemia, familial, 1'. Duplicate preflight found MONDO:0007750 already curated here (created by PR #8971); no open PR or issue covered it, so this edits the existing entry rather than creating a new one.

    Deep research: fresh falcon (Edison) run, 2026-09-06, 682s, 51 citations, replacing the 2026-08-19 report in place. Its own validation reports 16/16 references resolved, confabulation_rate 0.0, 2/2 checkable quotes valid, 0 off topic; 32/33 terms resolved with 0 unresolved. needs_review is true for one item only: the report writes 'if available' and 'association score 0.877' beside MONDO:0007750, a table-parsing artifact rather than a mis-binding, and the CURIE is the correct one for this entry. The report's single unverifiable quote (DOI:10.1056/NEJMoa1816454, no abstract exposed) was resolved by fetching the PubMed record instead: PMID:31618540 carries the sentence verbatim, and that PMID is what is cited here.

    just preflight-dr returns SKIP because MONDO records no RO:0004003 causal gene for MONDO:0007750, as the entry's notes already record. Manual fallback confirms the entity: OMIM 143890 on both sides, and gene mentions LDLR=99 against PCSK9=21 and APOB=7, so the report is receptor-side FH1 and not a sibling entry.

    Added, chosen to bring this entry to parity with its closest sibling Autosomal_Dominant_Hypercholesterolemia_3 and to serve the entry's allelic-series thesis:

    - experimental_models (4, new section). The J.D. fibroblast strain (PMID:189940), which is where the receptor classes were defined and which the entry's Class 4 variant description already named without citing; JD iPSC-derived hepatocytes (PMID:22653811), the same patient genotype moved into the cell type that clears plasma LDL, carrying the lovastatin non-response that reads out the residual-activity gating node; the CHO-ldlA7 heterologous assay (PMID:34167030), which is the assay behind the entry's existing Functional Characterization of LDLR Variants diagnosis item; and the activity-normalized prime-editing saturation screen of 5,184 coding variants (PMID:42677454).
    - datasets (3, new section, previously 0 percent). geo:GSE329001 (the prime-editing screen, LDLR-specific), geo:GSE126352 and geo:GSE178126. All three relevance-triaged by hand; the two clinical cohorts are recorded in their descriptions as class-level because neither series reports LDLR genotypes. Verified with just verify-datasets (3/3 OK) and the GEO_*.md cache files are committed.
    - environmental (2, new section). Saturated/trans fat and tobacco smoking, both linked into the pathograph, attached to the nodes they actually act on: diet to Lifelong Elevation of Plasma LDL Cholesterol, smoking to Endothelial Dysfunction and Subendothelial LDL Retention, since smoking does not raise LDL. Substantiated from GeneReviews (PMID:24404629) plus the UK Biobank lifestyle-interaction study (PMID:35294538), whose explanation records that its 4-point score bundles four exposures and pools carriers across LDLR, APOB and PCSK9.
    - treatments. Two evidence items on statin therapy from the 20-year paediatric follow-up (PMID:31618540), including the residual burden the same study reports (mean LDL-C fell 32 percent, 20 percent reached goal), so the outcome claim is not read as corrected receptor function.

    Also corrected three pieces of stale prose that named supports: PARTIAL, an enum value retired in #10003 and no longer present anywhere in this file's data. The four new GeneReviews evidence items were re-graded from HUMAN_CLINICAL to OTHER to follow the evidence_source convention this entry documents in its own notes for the chapter's Management and Agents-to-Avoid sections; check-snippet-grading was what surfaced the divergence.

    Deliberately not added: model-level evidence on the four experimental models, matching this file's existing animal_models, which carry their evidence on the links and readouts where the claims actually sit.

    Validation: just validate passes (schema, terms, 144/144 snippets verified); just validate-disorders (the batched gate CI runs) passes; just verify-datasets 3/3; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-enum-values all pass. Compliance 92.5 percent (333/360), up from 285/306 in absolute terms; the percentage is flat because dataset records carry no evidence block by the dataset-curation SOP.

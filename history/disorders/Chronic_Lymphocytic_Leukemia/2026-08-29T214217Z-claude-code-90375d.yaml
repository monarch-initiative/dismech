  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of 28 evidence items against 17 cached references (6 PMIDs, ORPHA:67038, 10 DOIs), re-reading each cited publication; DOI-backed snippets hand-verified since the validator skips them by prefix. Five defects fixed: (1) the main integrity failure - the Venetoclax plus Obinutuzumab treatment, described as fixed-duration therapy for treatment-naive CLL, was evidenced solely by MURANO (venetoclax plus rituximab, relapsed/refractory); added two exact CLL14 quotes (DOI:10.1038/s41467-023-37648-w) supporting the actual regimen and population, downgraded the MURANO item to PARTIAL naming both mismatches, and attributed the two trials separately in the description; (2) a histopathology snippet truncated mid-sentence replaced with the complete sentence naming the CD19+CD23+CD5+ immunophenotype; (3) an epidemiology item's provenance (background statement in a five-patient dermatology series) made explicit; (4) an IL-9 conditioned-media/culture study regraded HUMAN_CLINICAL to IN_VITRO; (5) a microbiome paper's generic non-CLL sentence tagged MODEL_ORGANISM replaced by the study's patient-cohort result (HUMAN_CLINICAL) with the mouse result split into a second MODEL_ORGANISM item per the split-mixed-sources rule. Left unfixed: four pathophysiology nodes, all genetic entries and several phenotypes/treatments carry no evidence at all (coverage gap requiring new sources); deep-research bibliography stubs quote background sentences but say so honestly; a Watch-and-Wait treatment_term bound to NCIT Cancer Screening flagged as a term-selection question, out of scope. Assessment: cache-backed clinical evidence sound and correctly graded, but the entry is thin - the mechanism chain is unevidenced prose - and the venetoclax regimen mismatch was exactly the trial-fame-attached-to-wrong-regimen failure mode. Validation: just validate and strict snippet audit pass.

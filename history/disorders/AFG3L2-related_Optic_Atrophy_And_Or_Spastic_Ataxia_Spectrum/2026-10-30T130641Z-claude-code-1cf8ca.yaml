  details: |
    Curated de novo from the Perplexity deep-research report (research/AFG3L2-related_Optic_Atrophy_And_Or_Spastic_Ataxia_Spectrum-deep-research-perplexity.md; reasoning_effort=low). Modelled MONDO:0700372 as one semidominant AFG3L2/m-AAA-protease spectrum with three has_subtypes rows: SCA28 (MONDO:0012450, dominant proteolytic-domain), OPA12 (MONDO:0033549, dominant ATPase-domain optic atrophy), SPAX5 (MONDO:0013776, recessive severe). SPAX5 is already modelled in depth in kb/disorders/Spasticity-Ataxia-Gait_Anomalies_Syndrome.yaml; this entry's SPAX5 row is kept lightweight and cross-references it via curated_in and notes. Shared pathophysiology chain: AFG3L2 m-AAA loss of function (per-subtype genetic_context functional_impact_category: LOSS_OF_FUNCTION for OPA12/SPAX5, DOMINANT_NEGATIVE for SCA28) to impaired inner-membrane proteostasis, branching to OPA1 overprocessing/fragmentation, OMA1-DELE1-HRI integrated stress response (protective), MCU calcium overload and respiratory-chain failure, converging on retinal ganglion cell and Purkinje/corticospinal degeneration. GeneReviews chapter PMID:21595125 (AFG3L2-Related Neurologic Disorders) tagged as baseline. Malformed report DOI:10.1093/brain/awad340/7296494 avoided; used PMID:37804316 (same Brain paper). Terms all from live OLS/runoak lookups. Validation: just validate, validate-terms, count-verified-snippets (47/47), validate-disorders all pass; entity-refs, causal-targets, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, block-scalar-comments, snippet-grading, subtype FK tests, GeneReviews check all clean.

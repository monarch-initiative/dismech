  details: |
    De-novo curation of MONDO:0011252 (DDRGK1 loss of function, autosomal recessive, OMIM:602557) from the Falcon deep-research report (research/Spondyloepimetaphyseal_Dysplasia_Shohat_Type-deep-research-falcon.md) and nine primary references read from references_cache. Pathograph: DDRGK1 loss of function at the root, a canonical SOX9-ubiquitination branch (increased SOX9 degradation, reduced SOX9/COL2A1, failed chondrogenic condensation and differentiation) and an alternative IRE1-alpha UFMylation / ER-stress / PERK-CHOP apoptosis branch, converging on growth-plate disorganisation and a disc/endplate node, with edges to the radiographic and stature phenotypes marked INDIRECT where the human step is inferred from mouse models. 27 phenotypes from the 1993, 1994, 2017, 2022 case reports; founder c.408+1G>A and Moroccan missense alleles; three cell systems and seven mouse/zebrafish models linked through modeled_mechanisms with readouts and typed divergences; three discussions (mouse erythropoiesis lethality mismatch, airway cartilage gap, SOX9 versus IRE1-alpha branches). No ORPHA record could be cited (no references_cache/ORPHA_93352.md; repinning Orphadata is out of scope) and ClinGen has no DDRGK1 assertion. Validated with just validate-disorders (139/139 snippets, 148 titles, 0 issues), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, validate-stubs, check-genereviews --online (NO_CHAPTER) and compliance (91.6 percent). Finishing session fixed a YAML syntax error, moved clinical_course onto the phenotype descriptor, regraded two BACKGROUND items off OTHER, and removed session narration from notes.

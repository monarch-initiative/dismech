  details: |
    Revision session addressing all findings from the ai4c-reviewer review of PR #8688. The CREATE record for this entry is 2026-08-17T020957Z-claude-code-e84695.yaml; this record covers the review-response work only.

    Round 1 (seven findings, all resolved):
    1. Removed the `Disrupted Craniofacial and Limb Patterning` -> `Neurodevelopmental Impairment` causal edge. Its own description said the findings "co-segregate ... rather than causing it", so the edge asserted what its annotation denied. Deleted rather than re-typed; a `notes:` field records why no edge is drawn and that connectivity is preserved through `Dysregulated Developmental Gene Transcription`.
    2. Connected all three animal models to the pathograph with five `modeled_mechanisms` links, each carrying its own evidence. Two are deliberately not RECAPITULATES: the zebrafish is PARTIALLY_RECAPITULATES for the microcephaly node (larval head size in a complete-LOF crispant does not capture the postnatal timing or the somatic growth arm), and the constitutive null is PERTURBS with fidelity LOW (a homozygous embryonic lethal demonstrates gene essentiality, not the consequences of half dosage).
    3. Rebound two group-level phenotypes whose frequency denominators were broader than the bound term: Distal Limb Anomalies HP:0010621 -> HP:0011297 Abnormal digit morphology, and Ophthalmologic Abnormalities HP:0000486 -> HP:0000478 Abnormality of the eye. Also corrected Distal Limb Anomalies from VERY_FREQUENT to FREQUENT after rechecking the whole-cohort denominator (13/26, 50%) against the pooled table's partial one.
    4. Added a `diagnosis:` section: trio exome/genome sequencing (NCIT:C101295), chromosomal microarray for 17q24.2 copy-number variants (NCIT:C18084), and ACMG/AMP interpretation with parental testing (NCIT:C15709). Recorded the explicit negatives in notes: no consensus diagnostic criteria, no biochemical or imaging biomarker, no validated functional assay and no DNA-methylation episignature (a notable gap for a chromatinopathy), no newborn or population screening.
    5. Replaced a snippet that had been truncated mid-list; superseded by the round-2 fix below.
    6. Aligned `preferred_term` with the CL:0000008 label (migratory cranial neural crest cell). The ontology label was the more specific of the two, so the deviation lost information rather than adding it.
    7. Changed `variant_origin` from DE_NOVO to GERMLINE. DE_NOVO contradicted the inherited arm documented in three other places in the same entry. GERMLINE is unconditionally true of both arms; the de novo/inherited split is preserved at higher resolution as cited evidence (14 de novo, 4 inherited) rather than compressed into the enum. A separate GeneticContext was considered and rejected because that class hangs off Pathophysiology, not Genetic, and would fragment one gene-disease relationship across two records differing only in origin.

    Round 2 (one IMPORTANT, three suggestions, all resolved):
    8. Wired the pathograph to the phenotype list. Previously 0 of 8 downstream edges reached a phenotype, leaving mechanism and clinical picture as two disconnected components; now 13 of 21 edges do, across four nodes. Phenotypes with no established mechanistic route (cyclical vomiting, the ophthalmologic group, scoliosis and delayed bone age) were deliberately left unwired, with a notes block explaining that wiring them would manufacture causal claims the evidence does not carry.
    9. Extended the truncated diagnosis snippet to a complete sentence, copying the non-ASCII U+2010 hyphen in "next-generation" verbatim from the cached record. That character was the original reason for the truncation.
    10. Added `readouts` to all five modeled_mechanisms links (progenitor cell cycle length, progenitor cell death, deep-layer neuron proportion, Ctip2 fate acquisition, larval head size, ceratohyal angle, post-implantation survival), each repeating its link target and carrying a direction and interpretation.
    11. This record.

    Validation after the revisions: `just validate` passes schema, terms and references; 92/92 snippets verified (up from 80/80 at CREATE, reflecting the new diagnosis and modeled_mechanisms evidence); `just validate-terms` passes; `check_title_snippets.py` clean; pytest -k model_readout 2103 passed and -k BPTF 16 passed; CI `test (3.13)` green on the pushed branch.

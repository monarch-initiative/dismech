  summary: 'Create: BPTF-Related Neurodevelopmental Disorder (NEDDFL)'
  details: |
    New Mendelian entry for neurodevelopmental disorder with dysmorphic facies and distal limb anomalies (NEDDFL; MONDO:0060596, OMIM:617755, BPTF hgnc:3581), resolving issue #8533.

    NEC preflight (mandatory for this high-risk numbered NDD series): `runoak -i sqlite:obo:mondo info MONDO:0060596 -O obo` returned relationship RO:0004003 HGNC:3581 ! BPTF and xref OMIM:617755, confirming gene and OMIM identity before any deep-research content was used. Three confusable neighbours are recorded as differential_diagnoses: MONDO:0032855 (NEDDFSA, ZMIZ1 - a one-word label difference), MONDO:0044319 (IDDFSDA, OTUD6B - autosomal recessive; the reciprocal guardrail in that entry is honoured and no OTUD6B-specific citation is used anywhere here), and Silver-Russell syndrome (clinical phenocopy). PMID:33522091 is used extensively here; the OTUD6B entry deliberately excludes it precisely because it describes this BPTF entity.

    Deep research: Falcon (Edison Scientific) run, 21 citations, 5/5 references verified, 0 percent provider-reported confabulation rate. It agreed with the primary literature read independently and introduced no PMID not already cited, so it was used as corroboration only. No GeneReviews chapter exists for BPTF or NEDDFL (PubMed searched), so that baseline step does not apply.

    Mechanism: eight pathophysiology nodes, each tagged with biological_scale, running BPTF haploinsufficiency (MOLECULAR) -> impaired NURF chromatin remodeling (MOLECULAR) -> dysregulated developmental gene transcription (MOLECULAR) -> neural progenitor cell-cycle prolongation and apoptosis (CELLULAR) -> cortical hypoplasia and disrupted lamination (TISSUE), with a parallel PROVISIONAL craniofacial/limb patterning node (TISSUE) and two ORGANISM outputs (postnatal microcephaly with growth restriction; neurodevelopmental impairment).

    Two discussions record the open problems honestly: a KNOWLEDGE_GAP on why BPTF loss causes microcephaly while loss of Smarca1, its NURF ATPase partner, causes brain overgrowth; and a HUMAN_MODEL_MISMATCH on the principal mouse model being a homozygous conditional null while the human disease is heterozygous haploinsufficiency with near-silent heterozygous mice.

    Frequency discipline: bands are sourced from PMID:33522091 (26-individual expansion cohort) with verbatim quoted fractions. The larger pooled 38-case table in PMID:36153657 is recorded in prose only and is NOT used as an evidence snippet, because the reference validator can verify only that paper's abstract and the table is in the article body; the single band resting on that paper (short stature, 35 percent) uses a sentence that is in its abstract. Bands were omitted wherever no usable denominator exists.

    Term binding: the supportive-care and genetic-counseling treatments use NCIT:C15747 and NCIT:C15240 rather than the MAXO terms suggested in CLAUDE.md (MAXO:0000950, MAXO:0000079), because MAXO is not reachable from the NCIT:C25218 root of the TreatmentActionTerm dynamic enum and fails term validation. The same substitution is documented in the Progressive_Familial_Intrahepatic_Cholestasis entry, and a term-binding note in this entry warns reviewers not to revert it.

    Validation, run from inside the curation worktree: `just validate` passes all three stages (schema, terms, references); `just validate-references` reports 80/80 snippets verified against cached references; `just validate-terms` passes. Ten references were fetched with `just fetch-reference` (PMIDs 28942966, 33522091, 30633344, 35604347, 36153657, 38936258, 40614698, 40415676, 16728976, 18974875). PMID:30633344 has no retrievable abstract, so it is cited in prose only with no evidence snippet attached.

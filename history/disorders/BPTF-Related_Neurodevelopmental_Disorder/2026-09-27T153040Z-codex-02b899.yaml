  summary: Clarify BPTF evidence limitations and microcephaly connections
  details: |
    Follow-up to the independent APPROVE review on PR 13021 (head 5d973a47ee7). Replaced six stale PARTIAL explanations with the actual evidence limitations, retaining SUPPORT and valid PARTIALLY_RECAPITULATES relationship values. Made the general Microcephaly phenotype explicitly encompass congenital and postnatal presentations, with Postnatal Microcephaly as its timing-specific subset. Added Reduced Brain Growth -> Postnatal Microcephaly and Somatic Growth Impairment -> Decreased Body Weight, using indirect links and preserving uncertainty about the human cellular or nutritional/endocrine route.

    Did not add the optional suggested causal links from chromatin-patterning or general neurodevelopmental nodes to each facial/digital phenotype, autism or ADHD: the available studies document those clinical findings but do not resolve their specific causal routes. The existing provisional aggregate links remain explicitly qualified. Unconnected phenotypes are preferable to unsupported causal assertions. No evidence snippets, frequency bands or variant classifications changed. Full entry schema/term/reference validation and causal-target checks were rerun; independent approval and CI must be reconfirmed on the follow-up commit.

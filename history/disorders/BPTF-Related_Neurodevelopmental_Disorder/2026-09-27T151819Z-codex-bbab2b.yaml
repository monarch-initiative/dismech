  summary: Review BPTF clinical evidence, NURF mechanisms and experimental models
  details: |
    Reviewed the existing BPTF/NEDDFL entry against its Falcon research narrative, summary table and citation sidecar, both prior history records, and the cited clinical and experimental literature. No prior REVIEW record was present. Mendelian disease is eligible for the review campaign; infectious and environmental/poisoning entries remain excluded. Rebased onto origin/main before curation and again onto 2c89547dd18 during the review.

    Content-completeness assessment:
    1. Phenotypes: adequate after adding specific facial, limb, eye, growth, behavioral and gastrointestinal findings from the 2021 full-text table. Seizure versus EEG-only cases are separated. Composite DD/ID, microcephaly timing and growth denominators are kept distinct; the pooled motor-delay arithmetic error is not propagated. Named eye findings replace the generic eye record.
    2. Subtypes: no established mechanistic subtypes were identified; none invented.
    3. Pathophysiology: separated delayed progenitor cycle exit, postmitotic neuronal apoptosis, neuronal marker/fate changes, cortical hypoplasia, and brain versus somatic growth. Complete-loss mouse and cell findings remain provisional for heterozygous human disease. The 2025 NURF paper distinguishes internally truncated Smarca1 from true-null alleles and cerebellar CERF compensation from inferred cortical NURF compensation. Removed the tissue-patterning GO binding from the molecular transcription node.
    4. Treatments/trials: retained observational rhGH and antiseizure/CVS drug evidence; added gastrostomy, bracing and VNS use without unsupported efficacy. The two GH-treated boys had deficient stimulation responses. VNS outcome cannot be separated from medication. Exact bracing/VNS intervention-term gaps are documented rather than binding an analgesia or auricular-stimulation procedure. ClinicalTrials.gov API condition search for BPTF, NEDDFL and the expanded disease name returned zero studies on 2026-09-27; this is a bounded registry search, not a universal negative.
    5. Genetics: variant classes and inheritance retained; five transcript-specific variant records added. The 2025 splice variant is source-classified pathogenic, whereas both missense variants are VUS. Source-classified likely pathogenic 2023 variants retain their segregation and functional-assay limitations. No exact 50% protein decrease, quantified penetrance or class-specific severity is assumed.
    6. Diagnostics/biomarkers: exome/panel/copy-number ascertainment distinguished from diagnostic yield or consensus guidance; balanced rearrangements are not excluded by normal microarray. Imaging and isolated EEG findings remain distinct. No validated BPTF episignature is inferred from SMARCA1.
    7. References/data: full cached scientific content and tables consumed for PMID:33522091, PMID:36153657, PMID:40415676 and PMID:18974875. The latter includes experimental methods and supplemental figure captions. Recovered the 2022 mouse paper through the generated PMC9558838 URL cache and read the scientific body, figures and methods. BPTF-relevant genetic and biochemical comparisons in PMID:41213919 were read; its SMARCA1 patient phenotypes are not imported. Added verified GEO GSE154700 (16 mouse forebrain RNA-seq samples, E13.5 and birth) and two cell-model records with rescue and negative controls. The original 2017 paper and PMID:16728976 remained abstract-only after available fetch routes; 2017 PMC/publisher routes returned captcha or access failures. PMID:38936258 and PMID:40614698 caches contain abstracts plus repository landing pages despite full-text metadata; claims remain within their abstracts. Their repository pages were inaccessible on retry. No reference cache was hand-written. Failed DOI/captcha caches are excluded from the PR.
    8. Overall: central research themes are covered and source-level overstatements corrected. Research ontology suggestions were independently checked rather than copied. Individual incidental findings and unsupported mechanistic speculation were not promoted to defining disease features. GeneReviews check: NO_CHAPTER in the 2026-09-10 snapshot.

    Validation: schema, ontology terms and cached-reference matching passed for 148 snippets and 154 titles, with zero skipped/unavailable snippets. Entity references, causal targets, coarse phenotype bindings, source-defect assertions and snippet boundaries passed. Scoped model readout-target, model-target and extrapolation checks passed. Snippet-length, grading, reference-title and title-snippet ratchets passed. The formatter's two hash-character snippet mutations were caught by parsed-data comparison and repaired with quoted scalars; subsequent formatting preserves parsed data. Independent PR review and CI are subsequent gates, not author self-approval.

  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 25 (MARS2)'
  details: |
    New entry for COXPD25 (MONDO:0014636), caused by biallelic MARS2 single-nucleotide variants; the stub stubs/Combined_Oxidative_Phosphorylation_Defect_Type_25.yaml is deleted. Two families are reported: two brothers with developmental delay, hypotonia, poor growth with growth hormone deficiency, sensorineural hearing loss with a conductive component, pectus carinatum, ventricular dilatation and white matter change, with reduced MARS2 protein, reduced complex I and IV subunits and activities, and rescue of the subunits by wild-type MARS2 (PMID:25754315); and a Japanese girl with failure to thrive, psychomotor delay, hyperlactatemia and platyspondyly with vertebral beaking, normal fibroblast respiratory chain (recorded as a REFUTE item) and improvement on vitamin and cofactor supplementation (PMID:39995633). Mechanism: methionine-tRNA ligase activity (GO:0004825) and mitochondrial methionyl-tRNA aminoacylation (GO:0070155) DECREASED, mitochondrial translation, combined respiratory chain deficiency, systemic energy failure. ARSAL decision: spastic ataxia 3 (MONDO:0012664), caused by MARS2 copy number rearrangements (PMID:22448145), is a separate MONDO disease and not a child of this term, so it is recorded as a differential_diagnoses row with its MONDO term rather than as a subtype, and its own stub (stubs/Spastic_Ataxia_3.yaml) is left in place. relationship_type UNKNOWN: two families, and ClinGen's Definitive rating is for mitochondrial disease (MONDO:0044970). No GeneReviews chapter covers MARS2 (offline and online checks). Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (32 snippets, 0 issues), count-verified-snippets 32/32, and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype and folded-hyphen checks all pass.

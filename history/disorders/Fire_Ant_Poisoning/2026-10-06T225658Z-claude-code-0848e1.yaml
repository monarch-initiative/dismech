  summary: 'Create: Fire Ant Poisoning'
  details: |
    New Disease entry for fire ant poisoning (MONDO:0100341), curated as two has_subtypes because one sting drives two mechanistically separate diseases: a direct alkaloid cytotoxic injury (Local Sting Reaction) and an IgE-mediated systemic allergy (Fire Ant Venom Anaphylaxis).

    Deep research: Edison Falcon (research/Fire_Ant_Poisoning-deep-research-falcon.md, 11/11 references verified, confabulation_rate 0.0). Its needs_review flag was set only for a label variant on the supplied MONDO term, not a content defect. The report was used as a lead set; all citations were re-fetched and snippet-verified and all CURIEs were looked up in OAK while writing. The report earned its keep twice: it caught an arithmetic discrepancy in the abstract of its own key source (projected systemic-allergy cases given as 526,000 in the abstract versus 0.0526 million = 52,600 in that paper's results), and it warned against importing solenopsin cancer-cell signalling-pathway claims (Wnt/MAPK/mTOR) into clinical envenomation. Both warnings were acted on: no projected national totals from that paper are cited anywhere in the entry, and no such pathway is asserted.

    Pathograph: 7 nodes, one connected component, no orphans, single root entered via environmental influences_mechanisms. Alkaloid branch: sting and venom deposition -> piperidine alkaloid cytotoxic injury -> neutrophilic dermal infiltration with collagen degeneration -> sterile subepidermal pustule. Protein branch, in parallel from the same node: venom protein antigen presentation and type 2 sensitization -> venom-specific IgE production and mast cell arming -> IgE-mediated mast cell activation on re-exposure -> urticaria, venom-induced anaphylaxis, laryngeal edema, anaphylactic shock.

    Two prevalence records for the anaphylactic subtype from a Tricare beneficiary study: 0.048% general population and 0.085% in the 14 colonized states, both BAND_1_5_PER_10000 with rate_per_100000 and POPULATION denominator.

    Deliberate decisions, all recorded in the entry's notes: (1) Frequency bands are taken from one 8,749-case series and the entry records the three ascertainment limits its own authors state (overlapping categories with shock nested in systemic allergy, underreporting of mild cases, unrecorded serious symptoms counted as absent). (2) No frequency band on venom-induced anaphylaxis, because three sources give 7.52%, ~2% and 0.5-2% and the disagreement is not resolvable here; all are recorded rather than averaged. (3) The speech-impediment phenotype is omitted because the source describes it both as a speech impediment and as temporary loss of voice, which map to different HPO terms, and binding either would assert unsupported specificity. (4) No genetic section: mastocytosis is a host modifier and KIT p.D816V belongs to the mast cell neoplasm, not to this disease; Sol i 1-4 are ant proteins, not human gene symbols. (5) Three edges carry directness: INDIRECT where the source establishes a treatment or exposure relationship by implication rather than measurement.

    Ontology note: no ECTO class binds a sting or venom exposure. Eight searches of the local ECTO build are named verbatim in the environmental entry's notes along with what each returned, and ECTO:0000537 exposure to toxin is bound as the nearest true parent with the specificity in preferred_term, following the convention already used by Scorpion_Envenomation and Black_Widow_Spider_Envenomation.

    Two errors were caught and fixed during curation, both worth recording. A pre-write hook block caught an unquoted colon inside a differential_diagnoses distinguishing_features list item, which YAML had parsed as a mapping. And a programmatic title audit against references_cache caught a fabricated reference_title for PMID:42302087 that I had written from memory: it appeared 32 times and read entirely plausibly. It was replaced from the cache file's own title line by script, and a re-run confirmed 7/7 titles now match.

    Validation run and read: just validate (0 issues), just validate-terms (passed), just count-verified-snippets (75/75), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), just check-qualifier-terms (1 label matches; 1 RO term unvalidatable), just check-coarse-phenotypes (no new unexplained bindings), just check-term-cache-integrity (OK), and the authoritative just validate-disorders batch (75 snippets, 82 titles, 0 issues). New terms were seeded by pointing conf/oak_config.yaml at local sqlite adapters for the validator run and then restoring it; conf/ is unmodified in the diff.

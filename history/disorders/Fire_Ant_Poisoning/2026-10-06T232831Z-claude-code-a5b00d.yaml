  summary: 'Review round 1: Fire Ant Poisoning'
  details: |
    Addressed the ai4c-reviewer round on PR #13632 in one push.

    CRITICAL (item 1), confirmed and root-caused. references_cache/PMID_42302087.md was genuinely not committed, and CI proved the consequence: it re-fetched the reference, got abstract-only where the local cache holds full text, and 30 snippets failed. The PR body's '75/75 verified' was true locally and false on a fresh checkout, which is exactly the silent-network-fetch failure CLAUDE.md warns about.

    The cause was a shell bug worth recording because it was not specific to this entry: the staging loop was 'while read r; do git add ...; done < cited.txt' over a list written with "\n".join(...) and no trailing newline. 'read' returns false on an unterminated final line, so the loop body never ran for it and git add was never called, silently. The dropped file was the alphabetically last cited PMID in each of three PRs opened in the same session (#13631 PMID_988568, #13632 PMID_42302087, #13633 PMID_40913680). All three are being corrected. Staging is now verified with 'git ls-files --error-unmatch' per cited reference rather than trusted.

    IMPORTANT (item 2), accepted in full. Four snippets taken from the Introduction of PMID:30258210 were graded MODEL_ORGANISM although none is a result of the mouse experiments. All four now carry quote_role: BACKGROUND with evidence_source regraded from what the quoted sentence describes: the >95%-alkaloid sentence, the stereotypical-second-exposure sentence and the life-threatening-anaphylaxis sentence are HUMAN_CLINICAL + BACKGROUND, and the Th2/IL-4 clonal-expansion sentence is OTHER + BACKGROUND as general immunology. The reviewer's further point that the Th2/IL-4 snippet never mentions IgE was also taken: the IgE class-switching edge now leads with the figure-legend sentence naming IgE-secretory plasma cells and mast-cell binding, graded directness: INDIRECT because it is the authors' hypothesized scheme rather than a measurement, with the IL-4 sentence retained behind it as explicitly INDIRECT context. The paper's genuine results (footpad swelling, eosinophil recruitment with eotaxin, MHCII/CD86 upregulation, the abstract conclusion) now carry quote_role: PRIMARY_RESULT, since they have been assessed.

    Suggestion 3 taken: the bundled 'Venom-specific IgE production and mast cell arming' node is split into 'Venom-specific IgE class switching' (MOLECULAR, B cell, immunoglobulin production) and 'Mast cell arming by venom-specific IgE' (CELLULAR, mast cell). This removes the scale/cell-type inconsistency the reviewer identified rather than only picking one scale. The immunotherapy target_mechanisms link was retargeted onto the arming node, which is the state it acts on.

    Suggestion 4 taken: the process narration was removed from the cytotoxicity node's notes, keeping the substantive claim (murine BMDC origin of the figure, no Wnt/MAPK/mTOR lesion asserted, isolated-solenopsin cancer-cell data do not transfer) and dropping the reference to the deep-research report.

    Suggestion 6 taken: quote_role: REVIEW_SYNTHESIS added to the four PMID:37624246 items.

    Suggestion 5 partly taken. Death is added as a progression phase (3/8,749, 0.03%) together with the source's own attribution of most fatalities to delayed or inadequate treatment, which connects it to the documented undertreatment with epinephrine. A diagnosis: block is added with three entries: venom skin testing (NCIT:C17137), venom-specific IgE measurement (NCIT:C81970) and basal serum tryptase for mastocytosis screening (NCIT:C92292), all reachable from NCIT:C25218 and evidenced from references already cached in this PR. Symptomatic local care, rhabdomyolysis and acute kidney injury after mass stinging, and secondary infection are NOT added: no quotable statement for any of them exists in the seven references cached here, and adding them would mean either an unevidenced claim or a further reference round. They are left for a follow-up rather than asserted.

    One self-inflicted error caught during this round: inserting the new progression phase introduced a second top-level 'progression:' key, which just check-duplicate-keys flagged. The blocks were merged into the existing one; the gate now passes.

    Validation after the fixes, run to completion and read: just validate-disorders (85 snippets, 92 titles, 0 issues), just validate-terms (passed), just count-verified-snippets (85/85), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK after the merge), just check-snippet-grading (no new divergences). Every cited reference's cache file was then verified staged with git ls-files --error-unmatch. conf/ is unmodified.

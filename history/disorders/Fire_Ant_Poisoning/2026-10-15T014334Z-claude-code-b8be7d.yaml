  details: |
    Bound LOINC:6117-6 (Red Imported Fire Ant IgE Ab, Serum), LOINC:2462-0 (total IgE, Serum), and LOINC:21582-2 (Tryptase, Serum or Plasma) as measurements on the Serum venom-specific IgE measurement diagnosis row, which explicitly describes all three being measured together. Also bound LOINC:21582-2 separately on the Basal serum tryptase for mastocytosis screening row, a distinct diagnostic use of the same analyte. The species-specific IgE code matches this entry's own scope: 'red imported fire ant envenomation' is among its listed synonyms and its cited sources are specific to that species, so the Black Imported Fire Ant variant (LOINC:7086-2) was not bound.

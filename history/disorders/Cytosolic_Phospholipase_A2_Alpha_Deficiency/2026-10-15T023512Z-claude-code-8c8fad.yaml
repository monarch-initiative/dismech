  summary: 'Create: Cytosolic_Phospholipase_A2_Alpha_Deficiency'
  details: |
    New entry for MONDO:0018794 (PLA2G4A). The falcon deep-research provider failed authentication, so no deep-research report was produced; literature was gathered directly from PubMed. Core sources: Adler 2008/2009 (first compound-heterozygous proband), Reed 2011 (enzymology of the patient alleles), Brooke 2014 (homozygous splice deletion in CMUSE siblings), Faioni 2014 (homozygous p.Asp575His twins with bleeding and gastroduodenal ulcers), Kirkby 2015 (eicosanoid profiling of homozygous patients), and the 2026 Ruan review of prostaglandin-pathway enteropathies for the pooled seven-patient table and treatment experience. Pathograph runs from biallelic variants through loss of enzyme and arachidonate release to two arms: platelet thromboxane loss (conforming to primary_hemostatic_plug_failure) and mucosal prostaglandin loss leading to ulceration and stricturing. CMUSE (MONDO:0018765) has no KB entry and is recorded as skos:relatedMatch because PLA2G4A is one cause of it, not the only one. Kirkby 2015 is cited as REFUTE against the review's claim of absolute PGE2 deficiency, since urinary PGE2 metabolites were near normal. Two Chinese case reports attributing ulcers to a common SNP or a single heterozygous variant were not used. Validated with just validate, validate-terms, count-verified-snippets (58/58), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

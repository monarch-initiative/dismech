  details: |
    New entry for MONDO:0018794 (PLA2G4A). The falcon deep-research provider failed authentication. An Asta report was generated but its retrieved papers were almost all about other diseases, so it was not committed. An OpenScientist report was then generated and is committed (research/Cytosolic_Phospholipase_A2_Alpha_Deficiency-deep-research-openscientist.md; 16/16 references resolved, 0 off topic). Its term-validation section flags several wrong CURIEs (for example HP:0005263 offered as gastrointestinal ulceration is Gastritis; NCIT:C62042 offered as misoprostol is Leuprolide); none of its CURIEs were copied, and every binding in the entry was looked up separately. Cross-checking the report against the draft added a Pla2g4a knockout mouse model (PMID:12432909). Report claims not taken up: protein-losing enteropathy and edema (its supporting citation, PMID:24035666, is a general CMUSE paper rather than a PLA2G4A patient); NSAID avoidance (stated by the report as an expectation, with no quotable source); misoprostol rescue in mouse cardiac injury (not about this disease's phenotypes); Zulueta 2015 (PMID:25904158) has no abstract text to quote. The report counts fewer than five probands where the 2026 review tabulates seven; the entry follows the review. just preflight-dr was not run because it requires a local MONDO database that cannot be downloaded in this environment (disk limits). Most evidence was gathered directly from PubMed before the report arrived. Core sources: Adler 2008/2009 (first compound-heterozygous proband), Reed 2011 (enzymology of the patient alleles), Brooke 2014 (homozygous splice deletion in CMUSE siblings), Faioni 2014 (homozygous p.Asp575His twins with bleeding and gastroduodenal ulcers), Kirkby 2015 (eicosanoid profiling of homozygous patients), and the 2026 Ruan review of prostaglandin-pathway enteropathies for the pooled seven-patient table and treatment experience. Pathograph runs from biallelic variants through loss of enzyme and arachidonate release to two arms: platelet thromboxane loss (conforming to primary_hemostatic_plug_failure) and mucosal prostaglandin loss leading to ulceration and stricturing. CMUSE (MONDO:0018765) has no KB entry and is recorded as skos:relatedMatch because PLA2G4A is one cause of it, not the only one. Kirkby 2015 is cited as REFUTE against the review's claim of absolute PGE2 deficiency, since urinary PGE2 metabolites were near normal. Two Chinese case reports attributing ulcers to a common SNP or a single heterozygous variant were not used. Validated with just validate, validate-terms, count-verified-snippets (60/60), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

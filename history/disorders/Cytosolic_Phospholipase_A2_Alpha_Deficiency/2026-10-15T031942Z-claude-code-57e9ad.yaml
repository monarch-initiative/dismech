  details: |
    Addressed the first automated review and a CI gene-grounding failure. Bound GO:0004623 (A2-type glycerophospholipase activity, DECREASED) as a molecular function on the PLA2G4A trigger node so the gene lands on a molecular function. Reworded every pooled patient count taken from Table 4 of PMID:42046811: that table's seven patients include two Chinese cases the entry does not accept, so descriptions now count over the five accepted patients (ileum 3/5, anaemia 3/5, perforation 2/5) and explanations of the review's pooled sentences state the denominator. Added Intestinal Volvulus (HP:0002580, both Serbian siblings) and Abdominal Pain (HP:0002027, first proband) from their table rows, wired from the stricturing and ulceration nodes. Dropped genetic_context.zygosity because the trigger node covers both homozygous and compound heterozygous patients. Regraded the review's patient-level pooled sentences from OTHER to HUMAN_CLINICAL. Not taken: replacing the review sentence for the bleeding phenotypes with a Faioni 2014 primary quote, because only the abstract is cached and it says only 'early-onset bleeding diathesis'; an inflammation node from Kirkby 2015, because the finding is an ex vivo cellular response with no clinical phenotype to attach.

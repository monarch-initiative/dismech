  summary: 'Create: Tuberculous_Salpingitis'
  details: |
    Created the entry for tuberculous salpingitis (MONDO:0000271) from the stub, which was deleted. Seeded from research/Tuberculous_Salpingitis-deep-research-claude_code.md (second claude_code run; the first run was marked unsuccessful and discarded) and PubMed searches. Every quote was checked against the cached reference. Scope is the tubal disease and its direct consequences; tuberculous endometritis is modelled as a downstream extension because the sources describe it as usually secondary to tubal disease and dismech has no separate entry for it, while tuberculous oophoritis, tuberculous peritonitis and urogenital tuberculosis keep their own stubs. Most sources are about female genital tuberculosis as a whole, mostly infertile Indian cohorts, which is recorded in notes. OLS shows MONDO asserting tuberculous salpingitis as a parent of meningeal tuberculosis; this is recorded in notes as a likely MONDO misclassification, with no upstream report filed. Validated with just validate, count-verified-snippets, validate-terms, the whole-repo gates and validate-disorders.

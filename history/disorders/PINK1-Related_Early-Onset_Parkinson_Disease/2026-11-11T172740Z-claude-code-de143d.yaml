  summary: 'Create: PINK1-Related Early-Onset Parkinson Disease'
  details: |
    Promoted PARK6 (MONDO:0011613) from a has_subtypes row on Parkinsons_Disease to its own Disease entry, the second of the planned per-gene Mendelian Parkinson entries beside PRKN-Related_Juvenile_Parkinson_Disease. Name follows design decision 18: the dyad is not a MONDO synonym or the GeneReviews title (PINK1 Type of Young-Onset Parkinson Disease), so it rests on recurring literature use (PubMed phrase search 2026-11-11: 13 records for the exact phrase, 30 for PINK1-related Parkinson); the MONDO label, GeneReviews title and PARK-PINK1 are kept in synonyms. Deep research: falcon was requested and failed on authentication (403), so the run fell back to openscientist (fell_back: true in the report frontmatter); 40/40 citations resolved, 4/27 quotes not found (two typography, two misattributed, none used). just validate-research-terms could not be added to the report because OLS timed out on every attempt. just preflight-dr returned WARN: HGNC:14581 written beside PTEN in the report; no identifier was copied from it. Content: 13-node pathograph from biallelic PINK1 loss of function through voltage-dependent PINK1 stabilization, Ser65 phosphorylation of ubiquitin and parkin, parkin recruitment and activation, OMM substrate ubiquitination, mitophagy, accumulated dysfunctional mitochondria (conforms to the parkinsonism module), a provisional calcium-overload/ROS node, Lewy body pathology (conforms to the module alpha-synuclein node; 3 of 4 autopsies), nigral neuron loss, striatal dopamine deficiency and parkinsonism; 11 phenotypes from the GeneReviews baseline (PMID:20301792, tagged); prevalence RARE/UNKNOWN with PINK1 case fractions (3.7% pooled EOPD, 4.4% Italian sporadic, 3.7% Malaysian); founder variants p.A217D and p.L347P; nine treatments from the GeneReviews management section; Lewy-positive histopathology contrasted with PRKN; DaT-SPECT imaging; a HUMAN_MODEL_MISMATCH discussion on the PINK1-null mouse (no nigral loss) and a KNOWLEDGE_GAP on heterozygous-variant risk (G411S association vs the 13,708-case negative assessment); Drosophila (FB:FBgn0029891) and mouse (MGI:1916193) models with typed divergences and readouts. The ClinGen Definitive assertion is quoted but not recorded in gene_disease_validity because it is made against MONDO:0005180. The cGAS-STING arm is omitted because its primary mouse source was retracted. Validation: just validate, count-verified-snippets 147/147 against abstracts only, validate-terms, check-gene-namespaces-online (MGI and FB rows added to cache), check-genereviews (TAGGED), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-logical-rules, check-enum-values, check-name-collisions, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-delivery-system, check-folded-yaml, check-folded-hyphens, check-shared-disease-terms, check-gene-activity-grounding, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-cache-order, check-term-cache-integrity, model-scale-audit (4 links aligned, 4 typed divergences) all pass; list-gene-validity reports the ClinGen assertion as other_disease by design; list-disconnected-phenotypes leaves Hyperreflexia, Psychiatric Manifestations, Relative Cognitive Sparing and Levodopa-Induced Dyskinesia unwired on purpose, each with the reason in its description.

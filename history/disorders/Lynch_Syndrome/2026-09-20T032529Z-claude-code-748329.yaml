  details: |
    Genetics pass for the d2g wiring-013 gap job (issue #12202). Research first: GeneReviews baseline (NBK1211, already tagged), ClinGen gene-disease validity (all six genes already cited), MONDO subtype records, and the entry's own existing evidence.

    Changes:
    - Bound MLH1, MSH2, MSH6 and PMS2 as genes descriptors on the DNA Mismatch Repair Deficiency pathophysiology node, which previously reached no gene at all, and gave it a germline loss-of-function genetic_context.
    - Added a new upstream pathophysiology node, EPCAM 3' Deletion Silencing MSH2, carrying EPCAM and MSH2, with a downstream edge into DNA Mismatch Repair Deficiency. EPCAM was previously listed in genetic: as though it were a fifth MMR gene; the node now models the actual lesion (loss of the EPCAM polyadenylation signal, transcriptional read-through, MSH2 promoter hypermethylation) and its confinement to EPCAM-expressing lineages.
    - Bound each gene on its has_subtypes row.
    - Gave the EPCAM Deletion row its MONDO anchor, MONDO:0013196 Lynch syndrome 8, which MONDO records with an asserted RO:0004003 to EPCAM and which the entry previously left unbound.
    - Added per-gene case_fractions for MLH1/MSH2/MSH6/PMS2 from the Israeli 113-family series (PMID:25430799), with the authors' own caveat that the distribution is unusual, plus a second MSH6 fraction (10-20%) from PMID:20028993 tagged quote_role BACKGROUND.
    - Set relationship_type CAUSATIVE and variant_origin GERMLINE on the five causative genes.
    - Left RPS20 without a relationship_type, with a review_notes explaining why: ClinGen grades it Limited, which is neither CAUSATIVE nor DISPUTED.

    Validation: just validate (131/131 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, list-gene-term-mismatches all clean.

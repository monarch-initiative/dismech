  summary: 'Create: Amniotic Fluid Embolism entry'
  details: |
    New entry for amniotic fluid embolism MONDO:0850046, curated against the obstetric coverage-gap issue 7837. Fifteen pathophysiology nodes organised around two curated mechanistic_hypotheses: CANONICAL anaphylactoid_immune_response, an abnormal maternal humoral response to fetal antigen exposure, and ALTERNATIVE mechanical_embolic_obstruction, physical obstruction of the maternal pulmonary microvasculature. The two converge on one shared node, Pulmonary Vasoconstriction and Acute Pulmonary Hypertension, which is why the haemodynamic sequence is identical under either account. That sequence - raised pulmonary vascular resistance to right ventricular failure to left ventricular dysfunction - is curated as three atomic nodes because its ordering is what makes bedside echocardiography change management. The coagulopathy is split into Coagulation Activation and Fibrinogen Consumption and Hyperfibrinolysis Uncoupled from Coagulation Activation, the latter resting on a direct comparison against severe placental abruption in PMID:38168649. Module conformance is claimed at the thrombogenesis coagulation-cascade node only; the thrombus-formation node is deliberately not claimed because the fibrin formed is lysed as fast as it forms and the clinical expression is haemorrhage, not occlusion, with the rationale recorded as an INTERPRETATION discussion. Two supports REFUTE evidence items are retained rather than omitted: the negative tryptase and urinary histamine series against the mast cell node, and Clark's counter-position on risk factors. Validation run: just validate-disorders passed schema, terms and references, reporting Snippets checked 110/110 verified against cached references; just check-title-snippets and just check-duplicate-keys both clean.

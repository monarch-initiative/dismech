  summary: 'Create: Symphalangism_Proximal_1B'
  details: |
    New entry for GDF5-caused proximal symphalangism 1B (MONDO:0014125), claim issue #15200. Deep research: one Perplexity report (research/Symphalangism_Proximal_1B-deep-research-perplexity.md), run with a GDF5 identity anchor taken from a temporary genetic row in the skeleton, because the stub carried the gene only in source_tags and the anchor fallback did not read it. The report's validation flagged one unresolved DOI, one unsupported quote and three mislabelled terms. On inspection the unresolved DOI (10.1371/journal.pgen.1000747) resolves once the '&type=printable' URL suffix is removed (PMID:19956691); that paper concerns noggin-resistant N445 variants in multiple synostoses syndrome and is mentioned in notes only. The unsupported quote for PMID:29371961 differs from the abstract only by markdown italics around Gdf5. The report's HP:0025233 (Sleep paralysis) for foot pain and HP:0006191 (Deep palmar crease) for absent flexion creases were wrong and were replaced with HP:0025238 and HP:0006077 after OLS lookup; its GO:0061317 is obsolete and was not used. All evidence comes from six PubMed records (three family reports, the Seemann 2005 family and functional study, the Zhang 2017 knock-in mouse and the Hecht 2008 review), each fetched with just fetch-reference; 34 of 34 snippets verified. Carpal coalition and conductive hearing loss were left out because no GDF5 family documents them. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets and validate-disorders.

  details: |
    PR-shepherd pass addressing the two blocking findings of the 2026-08-18T20:09 review. Both were no-fetch: every snippet used was already present in references_cache.

    Finding 1 (treatments). The "Antiseizure medication" entry asserted "No CUL3-specific efficacy or drug-selection data exist" and carried no evidence block at all, while PMID:37026922 -- a paper this entry already cites twice -- reports a patient who remained seizure-free on levetiracetam. Added that observation as supports: PARTIAL / evidence_source: HUMAN_CLINICAL, and softened the categorical negative to "No controlled or drug-selection data exist." The adjacent "Growth hormone therapy" description claimed GH was "the only reported pharmacological intervention with a described benefit specific to this population", which the same observation contradicts; that clause was removed and replaced with an explicit cross-reference. The n=1, uncontrolled, short-follow-up limits are stated in the evidence explanation rather than hedged away.

    Finding 2 (genetic / diagnosis / inheritance). The "whole-gene deletion" variant class asserted on the trigger node and repeated in genetic_context had no supporting evidence anywhere in the file. Added the PMID:39501558 variant-class sentence, which documents one of 26 individuals carrying a deletion encompassing multiple genes including CUL3. Because that is a contiguous multigene CNV rather than a CUL3-only deletion, the genetic_context description now records that distinction. A multigene deletion is precisely the lesion trio exome sequencing can miss, so a "Chromosomal microarray" diagnosis entry was added -- NCIT:C18477 Microarray Analysis, already enum-valid in treatmentactionterm and present in the NCIT label cache -- evidenced by the same paper's statement that ascertainment used exome sequencing, genome sequencing and chromosomal microarray. Also added penetrance: INCOMPLETE to the inheritance block with the PMID:39301775 "variable penetrance" snippet; penetrance_percentage is deliberately omitted because no quantitative estimate is reported.

    Deliberately NOT done, following the review's explicit instructions: no gnomAD pLI/LOEUF evidence item was manufactured, since no cited reference carries those numbers; no EEG evidence item was manufactured; no bare Microcephaly HP term was added. The source misspelling "particpant" is quoted verbatim, matching this entry's existing handling of the "food-hand" typo.


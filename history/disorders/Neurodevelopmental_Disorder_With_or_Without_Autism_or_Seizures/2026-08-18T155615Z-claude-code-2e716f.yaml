  summary: 'Create: Neurodevelopmental Disorder With or Without Autism or Seizures'
  details: |-
    New de novo entry for NEDAUS / CUL3-related neurodevelopmental disorder
    (MONDO:0030994, OMIM 619239, causal gene CUL3 / hgnc:2553).

    Duplicate preflight: no MONDO:0030994, NEDAUS or CUL3-NDD entry exists on
    origin/main under kb/; GitHub PR and issue searches for the MONDO ID, the
    disease name, NEDAUS and CUL3 returned no prior or in-flight curation. CUL3
    appears elsewhere in the KB only as a component of other mechanisms
    (KLHL24-related cardiomyopathy, epidermolysis bullosa simplex, esophageal
    carcinoma), never as the subject of an entry.

    Deep research: falcon (Edison) was attempted first, per the default, and failed
    with HTTP 402 Payment Required - the key has no credit - so no falcon report
    exists for this entry. Two providers were run instead, claude_code and
    openscientist. Both passed `just preflight-dr` against MONDO:0030994 with
    verdict PASS (CUL3 dominant at 61 and 53 gene mentions respectively; the only
    rival OMIM appearing in either report is 614496, the allelic
    pseudohypoaldosteronism type IIE disorder, which is expected and is curated here
    as a differential diagnosis rather than being mistaken for the target entity).
    Each report resolved 16/16 of its own citations with confabulation_rate 0.0. The
    openscientist report carries needs_review: true because its validator judged two
    references off topic (PMID:42609138, PMID:42446772); neither is cited in this
    entry. Both reports were used as leads only - every PMID was independently
    fetched from PubMed with `just fetch-reference` and every snippet was taken from
    the resulting cache file rather than from a report.

    GeneReviews baseline: PubMed was searched for a GeneReviews chapter covering
    this disease. The only CUL3 hit is PMID:22073419, the Pseudohypoaldosteronism
    Type II chapter, which covers the other CUL3 disease and contains no
    neurodevelopmental content. It is deliberately not cited, and the absence of a
    GeneReviews chapter is recorded in the entry notes so a later curator does not
    repeat the search.

    Content curated: eight pathophysiology nodes running from the heterozygous
    loss-of-function trigger through cullin-3 haploinsufficiency and failed CRL3
    substrate degradation, then branching into a cap-dependent translation arm
    (4E-BP1/EIF4EBP1 shown to escape degradation in patient-derived T cells, eIF4G1
    identified proteomically) and a cytoskeletal arm (RhoA, presented by the BTB
    adaptors BACURD1/KCTD13 and BACURD2/TNFAIP1, plus plastin-3), converging on
    excitation-inhibition imbalance in cortico-striatal circuits and the syndromic
    organismal outcome. Also curated: 27 phenotypes, 4 named variants, 5 animal
    models and 2 experimental models with modeled_mechanisms links and readouts, 2
    competing mechanistic_hypotheses (translational vs cytoskeletal), 6 treatments,
    2 diagnostic modalities including the DNA methylation episignature, 1 dataset,
    and 3 discussions. (Correction: an earlier draft of this record and the first
    commit message on this branch said nine pathophysiology nodes and 25
    phenotypes; the file actually holds eight and 27. The counts were miscounted
    when writing the summary, not changed in the entry.)

    Self-review before opening the PR found and fixed four issues, recorded here
    because the intended adversarial subagent review could not run (it died on an
    account spend limit, so no independent review informed this entry): the
    intellectual-disability descriptor carried severity MILD while its own source
    reports a mild-to-severe range, and the qualifier was removed; the
    hand-and-foot bundle was bound to HP:0001167 Abnormal finger morphology
    although half its constituent findings are in the foot, and was rebound to
    HP:0040064 Abnormality of limbs; the dystonia phenotype claimed SUPPORT from a
    count that pools tremor and dystonia, and was downgraded to PARTIAL with the
    bound made explicit; and the trio-sequencing diagnosis entry rested on a
    Methods sentence about multicentre collaboration that did not actually
    establish the diagnostic route, replaced by two case reports that demonstrate
    it. A separate earlier fix rebound the learning-disorder phenotype from
    HP:0001328 Specific learning disability - which asserts impairment despite
    normal intelligence, a claim the source does not make - to HP:0100543
    Cognitive impairment.

    Curation judgements a reviewer should look at directly. First, seizure frequency
    is deliberately left unbanded. The founding series reported infantile spasms in
    two of three patients, while the 37-patient cohort states that epilepsy was not
    observed as a recurrent feature of that cohort. Rather than average these, the
    discordance is curated as KNOWLEDGE_GAP cul3_seizure_frequency_discordance with
    a REFUTE evidence item retained on the seizure phenotype and a proposed
    experiment that breaks the ascertainment circularity. Second, phenotypes whose
    only published figures are stratified by episignature status - intrauterine
    growth restriction, feeding problems, ADHD, cardiac and MRI abnormalities -
    carry PARTIAL evidence and no frequency band, because a subgroup figure is not a
    cohort figure. Third, dataset curation required manual relevance triage: a CUL3
    gene-symbol search over GEO returns lung adenocarcinoma, pulmonary fibrosis,
    yeast deletion and 16p11.2/KCTD13 rat series that share the gene but not the
    disease, and all were rejected, leaving only geo:GSE144046, the
    Cul3-haploinsufficient mouse brain series behind PMID:33727673.

    Validation performed and read: `just validate` passes all three stages (schema,
    terms, references). The reference validator reports 137/137 snippets verified
    against cached references. `just validate-disorders` - the batched, no-full-text
    sweep that CI runs on changed disorder files - passed. `just
    check-title-snippets` passes with no new title-quoting snippets; two initial
    snippets that quoted the PMID:32341456 title were replaced with a body sentence
    from PMID:37575562 that states the infantile-spasms count directly, rather than
    attempting to grandfather them. `just check-duplicate-keys`, `just
    check-term-cache-integrity` and `just check-reference-cache-frontmatter` all
    pass. `just verify-datasets` reports 1/1 OK. Compliance is 96.9 percent global
    and 96.9 percent weighted. No reference cache file or term cache row was written
    by hand.

    A later pass ran the three ungated CI ratchets that had not been run before
    the first push, and two of them failed on this entry. check_snippet_length
    flagged three evidence snippets under the five-word floor - all fragments of
    one list sentence in PMID:39501558 - which now quote that sentence in full,
    so each figure carries its "among the total cohort" denominator rather than
    standing as a bare parenthetical. check_folded_hyphens flagged a
    folded-scalar line ending on "mild-to-", which would fold with an unwanted
    space mid-compound; it was reflowed. Both were fixed rather than
    grandfathered. check_environmental_evidence passed. Separately, `uvx ruff
    check .` reports 15 pre-existing E402 errors that reproduce identically on
    origin/main; this branch changes no Python files. Final compliance 97.0
    percent global, 96.9 percent weighted, with 138/138 snippets verified.

    Note on the full pytest suite: it was NOT run to completion, and this entry
    should not be read as claiming otherwise. CI gates tests/test_data.py on
    changes to src/ or tests/, which this branch does not touch, so that guard
    does not run for this PR. Two local full runs were attempted; both were
    killed before finishing, stalling around 86 percent in the network-bound
    test_synthesis_provider_references_resolve region, which is unrelated to
    this entry. What did pass: the targeted subset covering this file (6308
    tests), and an -x run over the whole file that stopped only at a
    pre-existing failure in Travelers_Diarrhea.yaml, a file untouched here.

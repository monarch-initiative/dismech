  summary: 'Create: KDM6B-Related Neurodevelopmental Disorder (NEDCFSA, MONDO:0032790)'
  details: |
    De novo curation of KDM6B-related neurodevelopmental disorder (OMIM:618505 /
    MONDO:0032790 "neurodevelopmental disorder with coarse facies and mild distal
    skeletal abnormalities" / NEDCFSA / Stolerman syndrome), resolving issue #8532.

    NEC preflight was run before any deep-research content was used:
    `runoak -i sqlite:obo:mondo info MONDO:0032790 -O obo` confirmed the causal gene
    KDM6B (HGNC:29012) and OMIM:618505, and `just preflight-dr` on the Falcon report
    returned PASS (KDM6B mentioned 55 times and the top gene by frequency; the
    report's OMIM id matched the MONDO OMIM xref). This target sits in a
    high-NEC-risk class (a long series of near-identically named
    "neurodevelopmental disorder with ..." OMIM entities, plus the "Stolerman
    syndrome" eponym), so the check was mandatory. KDM6B claims in the existing
    Weaver_Syndrome and Chordoma entries were deliberately not imported.

    Deep research: Falcon
    (research/KDM6B-Related_Neurodevelopmental_Disorder-deep-research-falcon.md,
    plus citations sidecar and one artifact). Treated strictly as leads: every PMID
    was fetched with `just fetch-reference` and every snippet verified as an exact
    substring of the cached abstract. Falcon-reported per-feature cohort
    percentages from the Rots et al. full text were deliberately NOT converted into
    frequency bands, because the publisher blocks full-text download and only the
    abstract is in the reference cache.

    Pathophysiology is a seven-node causal chain, each node tagged with
    biological_scale: KDM6B haploinsufficiency and catalytic impairment (MOLECULAR)
    -> failure to remove repressive H3K27me3 (MOLECULAR) -> unopposed PRC2-mediated
    Polycomb repression (MOLECULAR) -> dysregulated neurodevelopmental gene
    expression (CELLULAR) -> impaired neural commitment and neurogenesis (CELLULAR)
    -> altered synaptic transmission and plasticity (CELLULAR) -> neurodevelopmental
    and behavioral phenotype (ORGANISM). A HYPOTHETICAL TISSUE-scale branch,
    "Disrupted Craniofacial and Distal Skeletal Patterning", carries the
    patterning_hox_dysmorphology mechanistic hypothesis (status EMERGING) for the
    minority dysmorphic phenotype.

    Frequency discipline (docs/frequency-evidence-guidelines.md): only the
    near-universal cognitive-deficit claim carries a FrequencyEnum band
    (VERY_FREQUENT), justified by the Rots et al. abstract sentence "Cognitive
    deficits are seen consistently in all individuals". Psychosis, hypotonia, coarse
    facies, broad hands, syndactyly, and seizures carry no band because the
    retrievable evidence is qualitative. The psychosis record documents the
    distinctive post-age-12 onset and the discordance between the OMIM
    characterisation and the cohort's "unexpectedly common" phrasing, and the open
    question is tracked as the kdm6b_psychosis_frequency KNOWLEDGE_GAP discussion.

    Naming: the entry uses the gene-anchored clinical name because Rots et al. 2023
    state explicitly that the OMIM description is "inaccurate and potentially
    misleading" (coarse facies and distal skeletal anomalies are uncommon in the
    85-individual cohort). disease_term binds MONDO:0032790 and the OMIM-derived
    label, NEDCFSA, Stolerman syndrome, and KDM6B-related NDD are all retained as
    synonyms so the entity is unambiguous. The naming question itself is recorded
    as the kdm6b_omim_name_mismatch CONTROVERSY discussion rather than silently
    resolved.

    Also curated: autosomal dominant inheritance bound to HP:0000006 with
    predominantly de novo occurrence and VARIABLE expressivity; KDM6B as CAUSATIVE
    gene with two variant classes (truncating; JmjC/Zn-domain missense and in-frame
    indels); 15 HPO-bound phenotypes; molecular diagnosis entry; five differential
    diagnoses curating the H3K27 writer/eraser contrast explicitly (Weaver/EZH2,
    Cohen-Gibson/EED, Sotos/NSD1, Kabuki/KDM6A-KMT2D) plus mucopolysaccharidosis for
    the coarse-facies mimic; three treatments; the Simons Searchlight registry
    (NCT01238250, marked PARTIAL because the cached record does not name KDM6B);
    three animal models and one human stem-cell experimental model with
    modeled_mechanisms links; and four discussions (CONTROVERSY, two KNOWLEDGE_GAP,
    one HUMAN_MODEL_MISMATCH).

    No GeneReviews chapter exists for KDM6B or NEDCFSA (PubMed searched for
    "KDM6B GeneReviews" - zero records), so the Rots et al. cohort abstract serves
    as the phenotype baseline in its place. Treatment action terms use NCIT
    (NCIT:C15747, NCIT:C15240, NCIT:C15986) rather than MAXO, because the
    TreatmentActionTerm dynamic enum is reachable only from NCIT:C25218 and rejects
    MAXO identifiers (dismech issue #7524).

    Validation: `just validate`, `just validate-references` (62/62 snippets verified
    against cached references), and `just validate-terms` all pass. Weighted
    compliance 80.9%. tests/test_data.py passes.

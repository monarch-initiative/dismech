  summary: 'Address ai4c-reviewer review on PR #8687'
  details: |
    Response to the ai4c-reviewer review on PR #8687 (REQUEST_CHANGES: four IMPORTANT
    items, four SUGGESTIONS). All eight points addressed; nothing deferred silently.

    IMPORTANT 1 - evidence_source on the Rots Drosophila assay. Retagged all four
    `IN_VITRO` occurrences (genetic, variants, pathophysiology trigger node,
    diagnosis) to `MODEL_ORGANISM`; a fly is a whole organism and the entry had
    contradicted itself against the correctly tagged fifth occurrence. The
    explanation now also flags that the same sentence bundles a computational 3D
    structure analysis which is not separately curated.

    IMPORTANT 2 - mouse-paper background sentence. PMID:35711692's ASD-risk-gene
    sentence retagged `HUMAN_CLINICAL` -> `OTHER`. The reviewer's preferred fix
    (substitute the primary human sequencing study) was attempted and rejected on
    evidence grounds: Satterstrom et al. (PMID:31981491) does not name KDM6B in its
    abstract, so no exact-quote human-genetic snippet was available. The explanation
    records that.

    IMPORTANT 3 - missing >10% phenotypes. Added 11 phenotypes, all HPO-bound and
    all evidenced by exact quotes from the PMID:31124279 full text: feeding
    difficulties (HP:0011968), gastroesophageal reflux (HP:0002020), constipation
    (HP:0002019), scoliosis (HP:0002650), patent foramen ovale (HP:0001655),
    cryptorchidism (HP:0000028), clinodactyly of the 5th finger (HP:0004209), joint
    hypermobility (HP:0001382), macrotia (HP:0000400), prominent forehead
    (HP:0011220), mandibular prognathia (HP:0000303). No frequency bands were added:
    the denominators the reviewer cited live in the Rots full text, which the
    publisher blocks from the reference cache (PMID fetch yields abstract-only and
    PMCID:PMC10257005 is not fetchable through any configured source), so quoting
    them would violate the exact-quote rule. Macrocephaly/overgrowth and sleep
    disturbance could not be curated at all for the same reason - no cacheable
    source documents either in this disorder. Both gaps, and the reviewer's point
    that macrocephaly is the phenotypic hinge against the Weaver/Sotos/Cohen-Gibson
    differentials, are recorded in a new CURATION_TODO discussion
    (kdm6b_uncacheable_cohort_frequencies) with a proposed ingest route.

    IMPORTANT 4 - Gil et al. 2024 NSC mechanism. Added pathophysiology node
    "Precocious Neural Stem Cell Differentiation and Pool Depletion" (CELLULAR,
    PROVISIONAL because the source is a bioRxiv preprint), fed by the
    gene-expression node and feeding the organism-level node, with four
    MODEL_ORGANISM evidence items quoting DOI:10.1101/2024.02.20.581302. This node
    is deliberately distinct from "Impaired Neural Commitment and Neurogenesis":
    one is a differentiation block, the other premature differentiation exhausting
    the progenitor reserve. Rather than paper over the contradiction, a new
    OPEN_QUESTION discussion (kdm6b_commitment_direction_paradox) states it, lists
    candidate reconciliations (regional specialisation, developmental timing, KDM6A
    compensation, partial vs complete loss), cites both arms, and proposes two
    discriminating experiments including a catalytically-dead rescue for the
    catalytic-independence strand the reviewer raised.

    IMPORTANT 5 - under-consumed caches. Added an explicit scoping paragraph to the
    entry `notes` accounting for every uncited cache: PMID:39767643 is excluded on
    mechanism grounds (bi-allelic variant, inconsistent with the heterozygous
    dominant model), PMID:41110445 is the content-free erratum, and the remaining
    DOI caches are general chromatin background superseded by primary KDM6B
    literature. DOI:10.1101/2024.02.20.581302 is now cited.

    SUGGESTIONS. GO scale mismatch fixed: GO:0007611 (learning or memory) removed
    from the CELLULAR synaptic node, replaced with GO:0060291 (long-term synaptic
    potentiation), and the behavioural process moved to the ORGANISM-scale node.
    Truncated PMID:35840288 snippet trimmed to end on a complete word. Weaver
    differential re-evidenced with PMID:38015625, which defines Weaver as the EZH2
    H3K27-writer disorder with overgrowth and advanced bone age and shows that
    inhibiting KDM6A/KDM6B reverses the Ezh2 mutant phenotype - the writer/eraser
    opposition demonstrated rather than inferred from an oncology sentence; the same
    paper's "writers and erasers exist in a fine balance" statement was added to the
    PRC2 node. Genetic section extended with a third variant class (copy-number
    deletions encompassing KDM6B, UNCERTAIN_SIGNIFICANCE, PARTIAL evidence, because
    all reported deletions also remove neighbouring genes) and a COMPUTATIONAL
    gnomAD-constraint evidence item for haploinsufficiency intolerance.

    Also in this push: rebased onto current origin/main. The `test (3.13)` CI
    failure was not caused by this entry - the branch was 101 commits stale, so the
    "evidence-free environmental exposures" gate compared old copies of four
    unrelated disorder files against a baseline recomputed from newer main. Post
    rebase the gate passes locally (87/87 grandfathered) and
    `git diff --name-status origin/main...HEAD` shows only this entry's files with
    zero deletions.

    Validation after changes: `just validate`, `just validate-references`
    (78/83 snippets verified; the 5 skipped are DOI-prefixed and were each manually
    confirmed as exact whitespace-normalized substrings of
    references_cache/DOI_10.1101_2024.02.20.581302.md), `just validate-terms`, the
    environmental-evidence gate, and the term-cache integrity gate all pass.
    Weighted compliance rose from 80.9% to 82.0%.

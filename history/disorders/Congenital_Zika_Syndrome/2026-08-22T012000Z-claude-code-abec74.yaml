  summary: 'Edit: CZS tunneling-nanotube transplacental spread and placental injury
    nodes (PMID:42627154)'
  details: |
    Used PMID:42627154 (Michita, Tran, Jose & Mysorekar, mBio 2026, "Tunneling nanotubes
    contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo") as
    the nucleus for this session. The paper is an in vivo mouse pregnancy-model study of
    how ZIKV crosses the placenta, so it is material for updating the existing Congenital
    Zika Syndrome entry rather than a new disorder page. Only the abstract is available
    in the cache (content_type: abstract_only), so every snippet is drawn from it.

    Gap addressed: the entry's opening pathophysiology node bundled "the virus crosses the
    placental barrier" together with neurotropic entry into fetal neural progenitors. The
    placenta appeared nowhere else in the pathograph — no placental node, no trophoblast
    cell type, no UBERON placenta location, and no mechanism for the crossing step itself.

    Changes made:

    - pathophysiology: added "Tunneling Nanotube-Mediated Intercellular Viral Spread"
      (biological_scale CELLULAR). TNTs are actin-rich membrane-bounded intercellular
      conduits carrying viral components directly between cells; TNT-forming capacity maps
      to NS1 residues 40-52, and the engineered TNT-deficient mutant ZIKV-delta-TNT
      disseminates markedly less to maternal and fetal tissues. Terms: GO:0120031 plasma
      membrane bounded cell projection assembly (INCREASED, preferred_term "tunneling
      nanotube formation"), GO:0042783 symbiont-mediated evasion of host immune response
      (INCREASED), GO:0038196 type III interferon-mediated signaling pathway. Four
      MODEL_ORGANISM evidence items.

    - pathophysiology: added "Placental Infection and Architectural Disruption"
      (biological_scale TISSUE; trophoblast cell CL:0000351; placenta UBERON:0001987;
      GO:0001890 placenta development with modifier ABNORMAL). Two MODEL_ORGANISM evidence
      items covering placental pathology, altered junctional-to-labyrinth architecture,
      placental efficiency, and fetal growth restriction, established causally by the
      contrast with the TNT-deficient mutant.

    - Both nodes are wired upstream of the existing "Maternal-Fetal Transmission and
      Neurotropic Viral Entry" node, so the placental arm now precedes fetal neurotropism
      in the pathograph rather than being implicit in a description sentence.

    - discussions: added two records. mismatch_czs_tnt_placental_transmission
      (HUMAN_MODEL_MISMATCH, OPEN) records two separate translational problems: TNTs have
      not been shown to carry ZIKV between cells in human placental tissue in vivo, and the
      junctional zone and labyrinth are rodent placental compartments with no direct human
      homolog, so the junctional-to-labyrinth readout cannot be restated as a human finding.
      It carries a proposed_experiment (human placental explant imaging with the NS1
      40-52 mutant as negative control). gap_czs_ns1_tnt_therapeutic_target
      (KNOWLEDGE_GAP, OPEN) records the NS1 TNT determinant as an untested target
      hypothesis addressing the transmission step rather than the downstream progenitor
      cytopathy, and explicitly warns against propagating the authors' speculative
      cross-pathogen generalization onto other disease entries.

    Ontology gap recorded, not papered over: GO, CL and UBERON have no term for the
    tunneling nanotube. Rather than force-bind cytoneme (GO:0035230) or intercellular
    bridge (GO:0045171), which name different structures, the TNT concept is carried as a
    free-text preferred_term over the closest available parent process, with the gap noted
    on the node.

    Deliberately NOT curated: fetal growth restriction was not added to phenotypes:.
    CLAUDE.md holds that model-organism evidence should not be the sole support for a human
    phenotype, and this paper's FGR result is mouse only. It is curated on the placental
    pathophysiology node, where MODEL_ORGANISM evidence is appropriate, with a note saying
    why the phenotype is absent. No animal_models entry was added either: the abstract says
    "complementary pregnancy models" without naming species, strain, or genotype, and
    AnimalModel requires those to be stated rather than guessed.

    Validation run and read: just validate (schema, passed); just validate-terms (passed);
    just count-verified-snippets (29/29 verified against cached references); just
    validate-disorders on the changed file, the batched pre-PR sweep CI runs (schema,
    terms and references all passed, 29/29 snippets); just check-duplicate-keys,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-environmental-evidence, check-not4curation (all passed, no new findings);
    pytest tests/test_data.py -k Congenital_Zika_Syndrome.yaml (16 passed) plus
    test_all_disorders_have_unique_names, test_disorder_count, test_schema_validity,
    test_discussion_knowledge_gap_proposed_experiment_validates (4 passed).

    Cache changes committed with this work: cache/go/terms.csv and
    cache/enums/biologicalprocessterm_dd47231dca51.csv each gained exactly the two new GO
    CURIEs (GO:0038196, GO:0120031), written by linkml-term-validator and sorted by

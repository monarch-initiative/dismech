  summary: 'Review and refresh: Congenital Zika Syndrome (split maternal-fetal transmission
    node; add spinal/arthrogryposis arm)'
  details: |
    Full review and refresh of the entry, taking issue #9215 (split the bundled
    maternal-fetal transmission node) as the starting point rather than the whole
    scope.

    Node split
    ----------
    `Maternal-Fetal Transmission and Neurotropic Viral Entry` bundled two
    mechanistic claims at two different biological scales, so it could not carry a
    single `biological_scale` tag. It is replaced by:

    - `Transplacental Viral Transfer to the Fetal Compartment` (TISSUE) --
      Hofbauer cell (CL:3000001) and cytotrophoblast (CL:0000523) permissiveness,
      type III interferon production (GO:0034343), located to placenta
      (UBERON:0001987). Seven evidence items.
    - `Neurotropic Entry into Fetal Neural Progenitors` (CELLULAR) -- radial glia
      (CL:0000681) and neural progenitor (CL:0011020) infection via AXL-associated
      entry (GO:0046718, GO:0019079).

    `conforms_to: viral_neural_progenitor_cytopathy#Fetal Brain Viral Exposure and
    Progenitor Infection` stays on the *entry* half, which is what the module node
    describes.

    Anchor dispositions
    -------------------
    Seven references pointed at the bundled node. Each was repointed by asking what
    the referring claim actually measures, not by a mechanical rule:

    - transmission-linked treatment/notes anchors -> `Transplacental Viral Transfer`
      (one as `causal_link_type: INDIRECT_KNOWN_INTERMEDIATES`, since its evidence
      measures fetal dissemination rather than the placental step itself)
    - placental-infection anchor -> `Transplacental Viral Transfer` (DIRECT)
    - `gap_czs_human_model_translatability.attaches_to` -> BOTH halves (the slot is
      multivalued and the gap spans both)
    - `perturbations[].target`, `readouts[].target`, `would_support` -> the ENTRY
      half. This diverges from the guess in issue #9215, which expected the
      placental half: the investigation's `model_systems` are cortical organoids and
      fetal cortical tissue, with no placental system, so the placental half is not
      what those readouts measure.

    New pathophysiology arm
    -----------------------
    Arthrogryposis was a listed phenotype with no mechanism behind it. Added
    `Spinal Anterior Horn Motor Neuron Loss` (TISSUE; CL:2000048, UBERON:0002257)
    -> `Fetal Akinesia` (ORGANISM), citing the neuropathology series that
    demonstrated germinal-matrix progenitor infection alongside anterior horn cell
    loss, and the arthrogryposis case series reporting normal joint ultrasound with
    cord thinning and reduced ventral roots -- i.e. a neurogenic rather than
    articular origin.

    Other changes
    -------------
    - `biological_scale` added to the four previously untagged nodes.
    - Phenotypes 4 -> 10: arthrogryposis, sensorineural hearing loss (OCCASIONAL),
      chorioretinal abnormalities, cerebellar hypoplasia, ventriculomegaly, small
      for gestational age.
    - New sections: synonyms, notes, prevalence (two records), diagnosis (two
      entries, including the 14.0x first-trimester risk ratio), histopathology,
      differential_diagnoses (TORCH; genetic primary microcephaly), animal_models
      (dengue-immune cynomolgus macaque with two readouts), references (21).
    - Fifth discussion `gap_czs_dengue_immunity_enhancement`, HUMAN_MODEL_MISMATCH.
    - PMID:30252119 is graded `NO_EVIDENCE`, not SUPPORT: its title implies
      sensorineural hearing loss but the study is a negative result.

    Validation
    ----------
    `just validate` clean, 65/65 snippets verified. All ungated CI gates clean
    (duplicate-keys, entity-refs, snippet-length, title-snippets, snippet-grading,
    folded-hyphens, reference-titles). The foreign-key and conformance pytest lanes
    pass (15810 passed).

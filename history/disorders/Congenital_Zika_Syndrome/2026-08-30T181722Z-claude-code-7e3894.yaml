  summary: 'Review response: add seizures, spastic hypertonia, dysphagia and global
    developmental delay'
  details: |
    Response to the blocking review on PR #10164.

    The reviewer found four high-frequency phenotypes that the entry's own prose
    already asserted but that were never curated. That was a real gap, not a
    difference of scope: the description names seizures and global developmental
    delay, and the treatments section names seizures and spasticity, so the entry
    was internally inconsistent.

    Added
    -----
    - `Seizures` (HP:0001250, FREQUENT, infantile onset on the descriptor) --
      five evidence items covering pooled frequency, timing, semiology, treatment
      response, and independent systematic-review corroboration.
    - `Spastic Hypertonia` (HP:0001276, VERY_FREQUENT, PROGRESSIVE) -- including
      the cohorts' case definition with its >3-month age threshold, which is what
      keeps this distinct from the congenital arthrogryposis curated separately.
    - `Dysphagia` (HP:0002015, FREQUENT) -- pooled frequency, the much higher rate
      in the arthrogryposis series, and the aspiration mechanism that makes it a
      mortality driver.
    - `Global Developmental Delay` (HP:0001263) -- deliberately with NO frequency
      band. The published pooled neurodevelopmental-delay prevalences (6.5%
      non-language cognitive, 29.7% language, 11.5% motor) are for ZIKV-exposed
      infants who were normocephalic and unaffected at birth, which is a different
      population from CZS; carrying them across would have understated the delay
      badly. The CZS-specific series are small and selected for severity, so they
      establish severity without supporting a percentage. The reasoning is recorded
      in the phenotype `description` so a later curator does not "fix" the omission
      by importing the wrong population's numbers.

    Also from the review
    --------------------
    - `animal_models#Cynomolgus macaque` -> `animal_models#Dengue-immune cynomolgus
      macaque ZIKV pregnancy model`. The old form resolved only through the
      `species` fallback in `entity_refs.py`; the `name` key is stable.
    - Frequency bands and their supporting cohort evidence backfilled onto
      Intracranial Calcification and Ventriculomegaly (both VERY_FREQUENT, ~80%).

    Three references added and cached: PMID:41460891 (843-child, 12-cohort IPD
    meta-analysis), PMID:32065676 (Epilepsia early-epilepsy cohort, n=91),
    PMID:39082517 (clinical-spectrum review).

    Validation
    ----------
    `just validate` clean, 79/79 snippets verified (was 65/65). All ungated gates
    clean. `pytest -k "entity_ref or subtype_foreign or phenotype"` -- 7852 passed.

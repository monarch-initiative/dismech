  summary: 'Review response: split the bundled placental node and apply suggestions
    on PR #9213'
  details: |
    Response to the ai4c-reviewer review on PR #9213, which requested changes on one IMPORTANT finding and offered six suggestions. The blocking finding was correct and is fixed; five suggestions applied; one is out of scope and is being tracked separately.

    BLOCKING FINDING 1 - node bundling. Fixed. 'Placental Infection and Architectural Disruption' collapsed a four-step causal chain into one node, and the tell the reviewer identified is decisive: the node was tagged biological_scale TISSUE while describing fetal growth restriction, which is an ORGANISM-scale outcome. CLAUDE.md's single-value discipline names exactly that situation as the signal to split. The node is now three atomic nodes wired as a chain:
      Placental Infection (TISSUE; trophoblast CL:0000351, placenta UBERON:0001987)
        -> Placental Architectural and Functional Disruption (TISSUE; GO:0001890 ABNORMAL, placenta UBERON:0001987)
          -> Fetal Growth Restriction (ORGANISM)
    The Tunneling Nanotube node now points at Placental Infection, and Placental Infection retains the edge to Maternal-Fetal Transmission and Neurotropic Viral Entry. No new snippets were invented: the two existing PMID:42627154 quotes were redistributed across the three nodes, each with an explanation naming the specific clause it supports. Splitting also gave fetal growth restriction its own node, which is where a mouse-only outcome belongs, and is consistent with keeping it out of phenotypes:.

    SUGGESTION 2 - inferred architectural direction. Applied. The abstract reports only that the TNT-deficient condition showed 'altered junctional-to-labyrinth architecture', with no stated direction and no statement that TNT-competent virus distorts anything. The original description asserted that it 'distorts the relative architecture'. The new Placental Architectural and Functional Disruption description now says explicitly that the architectural readout is reported as altered without a direction, so no directional claim is made here, while the efficiency change (improved in the mutant) does have a direction and is stated as such. Placental damage by TNT-competent virus remains directly evidenced by the IMPORTANCE snippet, so nothing was lost.

    SUGGESTION 3 - trophoblast not in the source. Applied. CL:0000351 never appears in PMID:42627154, whose placental readouts are the rodent junctional zone and labyrinth. Rather than drop a biologically correct cell type or hunt a citation of convenience, the Placental Infection node's notes now record that the cell type is supplied from general placental biology as the resident parenchymal cell type of the infected organ, and is not asserted by this reference.

    SUGGESTION 4 - host process on a viral-activity node. Applied. GO:0038196 (type III interferon-mediated signaling pathway) carried preferred_term 'maternal type III interferon (IFN-lambda) response' with no modifier, which could be misread as the virus inducing the pathway. The preferred_term is now 'viral persistence despite an intact maternal type III interferon (IFN-lambda) response', which makes the shielded-escape framing explicit while keeping the grounded term queryable. Kept rather than dropped, because the maternal IFN-lambda response is the specific host arm the persistence claim is made against.

    SUGGESTION 5 - uncited literature claim in the mismatch rationale. Applied, and upgraded from a hedge to a citation. The claim about human placentas showing viral antigen in Hofbauer cells without anatomic defects traced to GSE139181, already curated in this entry's datasets block; its publication is PMID:31709049. That reference was fetched with just fetch-reference and is now cited in the mismatch discussion with a verified exact snippet, supports: PARTIAL, evidence_source: HUMAN_CLINICAL, and the rationale names it as a small series that is not a test of the TNT mechanism.

    SUGGESTION 6 - module conformance considered and declined. Applied. The Placental Infection node's notes now record that innate_antiviral_interferon_response#Viral Interferon Antagonism and Innate Immune Evasion was checked and declined: its process is GO:0039502, symbiont-mediated suppression of interferon signalling, which is pathway antagonism, whereas the TNT mechanism is physical shielding from the extracellular compartment. Recorded so a future curator does not re-litigate it.

    SUGGESTION 7 - the pre-existing Maternal-Fetal Transmission and Neurotropic Viral Entry bundle. Out of scope for this PR, as the reviewer noted, and left untouched. Being raised as a separate issue rather than silently dropped.

    Also updated: the mismatch discussion's attaches_to now lists all three split nodes instead of the removed bundled node, so the anchors continue to resolve.

    Not actioned here: the reviewer asked for a GO new-term request for the tunneling nanotube. That belongs to geneontology/go-ontology, which is outside this session's repository scope, so it is flagged on the PR for a maintainer rather than filed.

    Validation re-run after the edits: just validate (passed); just validate-terms (passed); just count-verified-snippets (33/33 verified, up from 29/29 with the added PMID:31709049 item); just validate-disorders on the changed file (schema, terms, references all passed, 33/33); just check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets (all passed, no new findings); pytest tests/test_data.py -k Congenital_Zika_Syndrome.yaml (16 passed). One YAML scanner error was introduced and fixed during editing (an unquoted explanation containing a colon); it never left the working tree. No term-cache changes; five unrelated references_cache files rewritten by just validate were reverted.

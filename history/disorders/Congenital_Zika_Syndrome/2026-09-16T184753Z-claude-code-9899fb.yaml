  summary: 'Salvage four references and the pigmentary retinal mottling phenotype
    from closed PR #8883'
  details: |
    PR #8883 was closed as superseded: all five phenotypes it added had been curated independently on main, and its conflicts were the same phenotypes curated twice. Four of its references were not on main in any form, and this record covers moving them onto the current entry.

    Added a Focal Pigmentary Retinal Mottling phenotype (HP:0007814, Retinal pigment epithelial mottling) with two evidence items from PMID:27812690 (Moore et al.), which names focal pigmentary retinal mottling among the five features rarely seen in or unique to congenital Zika virus infection, and locates the lesion to the macular region. Kept separate from the existing Chorioretinal Abnormalities phenotype because the two co-occur but are distinct lesions and the mottling carries the discriminating value.

    Added PMID:26865554 (de Paula Freitas et al., 29-infant ocular case series) to Chorioretinal Abnormalities. The denominator is infants with microcephaly, which the explanation records, so no frequency band was derived from it.

    Added PMID:33778951 (Maia et al., epilepsy meta-analysis, 903 patients over 14 studies, pooled 60 percent, 95 percent CI 0.51 to 0.68) to Seizures. The existing FREQUENT band is unchanged: the point estimate and the whole interval sit inside 30 to 79 percent, so this is a tighter basis for the band than the 30 to 80 percent range already cited.

    Added PMID:32369180 (Wheeler et al., BSID-III, 121 children) to Global Developmental Delay. That cohort was also recruited at a specialized rehabilitation center, so the explanation states it establishes severity and supports no frequency band, matching the entry's existing reasoning for omitting one.

    Validation: just validate passed with 84/84 snippets verified against cached references; just validate-terms, check-duplicate-keys, check-term-cache-integrity, check-entity-refs, check-title-snippets, check-snippet-length, check-folded-hyphens and check-empty-snippets all passed; pytest tests/test_data.py -k zika passed 2. The four reference cache files were fetched with just fetch-reference and are committed. Incidental frontmatter churn that just validate wrote into four unrelated cache files was reverted.

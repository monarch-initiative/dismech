  details: |
    Added 5 phenotype entries named in the entry's own description but never curated as structured phenotypes, closing part of the Section A 'Congenital_Zika_Syndrome' gap in issue #6433 (viral disorder review): Chorioretinal Atrophy (HP:0000533, PMID:26865554 ocular case series), Arthrogryposis (HP:0002804, PMID:27509902 arthrogryposis case series), Sensorineural Hearing Loss (HP:0000407, PMID:27585248 hearing-screening cohort, frequency OCCASIONAL per the 5.8% prevalence reported), Seizures (HP:0001250, PMID:33778951 epilepsy meta-analysis, frequency VERY_FREQUENT per the pooled 60% rate), and Global Developmental Delay (HP:0001263, PMID:32369180 BSID-III cohort study). All PMIDs fetched fresh via just fetch-reference; all quoted snippets are exact substrings of the cached abstracts/full text (24/24 verified via just count-verified-snippets). Ran just validate (schema+terms+references all pass), just check-duplicate-keys, just check-title-snippets, just check-term-cache-integrity, and pytest -k Congenital_Zika (16 passed). Structured prevalence/gestational-age-risk data (also named in the issue) was not found in a quotable form during this pass and is left for a follow-up; issue #6433 should stay open.

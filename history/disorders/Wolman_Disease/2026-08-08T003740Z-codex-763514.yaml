  summary: 'Review: Wolman Disease publication readiness'
  details: |
    Performed a full evidence and publication-readiness review using the 2026 GeneReviews update, current clinical recommendations and registry outcomes, the existing deep-research artifact, the five-infant ERT/diet/HCT cohort, adrenal imaging and cultured-cell studies, a patient-fibroblast rescue study, and the Lipa-null mouse AAV study. Added a Harrison metabolic classification, bounded ultra-rare prevalence, treatment-altered natural history, recurrence and family-testing guidance, biochemical and molecular diagnosis, steatorrhea, abdominal distention, malnutrition, systemic inflammation, characteristic adrenal CT findings, ERT modality/safety/immunogenicity, nutritional supplementation, selected-patient HCT, supportive surveillance, experimental models, and explicit adrenal-mechanism and AAV-translation knowledge gaps. Conformed the proximal deficiency and storage nodes to the lysosomal-substrate-accumulation module; added biological scales; removed causal arrows to biochemical readouts and the unsupported hepatic-storage-to-anemia shortcut; and bounded the adrenal calcification edge as an in-vitro hypothesis with unknown intermediates. D2P and connectivity review prompted evidence-backed wiring of steatorrhea, abdominal distention, and malnutrition. Anemia and systemic inflammation remain deliberately unlinked because the reviewed sources establish their occurrence but not a defensible causal intermediate. Other D2P suggestions were not added where exact Wolman-specific evidence was absent, where a broader local phenotype already covered the claim, or where treated GeneReviews natural history cautioned against an unqualified developmental-delay assertion. Targeted schema, term, reference, history, graph, D2P, connectivity, and batched disorder validation passed; 100/100 evidence snippets matched their local caches, and compliance reached 99.6% globally and 100% weighted. The repository-wide graph command still reports pre-existing integrity issues in other disorders, but the Wolman file passes targeted graph validation.

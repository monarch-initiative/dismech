  summary: Add phenopacket-store cohort records recovered by disease-label identity
  details: |
    Added phenopacket-store record(s) via scripts/discover_phenopackets.py. Most were recovered by a new DISEASE_LABEL_MATCH tier: MONDO frequently lacks xrefs to numbered-subtype OMIM entries, so a cohort coded 'Bardet-Biedl syndrome 1' failed the xref test against an entry bound to generic Bardet-Biedl syndrome. Where the cohort's own coded disease LABEL names this entry's disease, identity is established on the label instead, using the same word-boundary phrases and sibling-qualifier veto as title matching. Gene agreement alone remains insufficient. Records are scoped to the MATCHED disease: title and sample_count reflect that disease's own cases, not the gene-keyed cohort total, because one gene can carry several distinct diseases. Every accession resolved against the pinned phenopacket-store release before commit.

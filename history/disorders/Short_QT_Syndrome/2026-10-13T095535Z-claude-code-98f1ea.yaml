  summary: 'LOINC tranche G: new diagnosis section with two-tier QTc criteria'
  details: |
    The entry had no diagnosis: section. Added a Resting 12-Lead Electrocardiography row with LOINC:8636-3 (QTc) as a measurement and two reference-range bands implementing the current expert-consensus SQTS criteria (PMID:30571592): QTc <330 ms diagnostic stand-alone, QTc <360 ms a possible diagnosis only combined with family history or a pathogenic mutation, and >=360 ms not meeting the current criteria. Notes record the earlier, broader Gollob <370 ms cutoff the source states has been superseded, and that the half-open bands place 330 and 360 themselves in the next higher band to match the source's strict inequalities. Part of LOINC tranche G batch 10 (projects/LOINC_DIAGNOSTICS.md).

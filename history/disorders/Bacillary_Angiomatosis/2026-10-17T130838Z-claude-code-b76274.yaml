  summary: Bind LOINC Warthin-Starry stain and B. henselae/quintana tissue PCR codes
  details: |
    LOINC tranche B batch 28. The histopathology row takes LOINC:6679-5 (Microscopic observation in Tissue by Warthin-Starry stain), matching specimen and method; the code names the stain rather than an organism, which is faithful, because the stain demonstrates bacilli morphologically and cannot speciate them. The tissue PCR row takes LOINC:33985-3 and LOINC:89592-0, one per species the entry names as an agent, which is what carries that row's speciation claim; a genus-level tissue code would confirm Bartonella without distinguishing B. henselae from B. quintana, and distinguishing them is the row's stated purpose.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status and deprecation checked per code, so each result set is complete rather than a ranked page; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

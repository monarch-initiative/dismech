  summary: 'Edit: Dilated Cardiomyopathy 1Z — PR review response'
  details: |
    Review-response session on PR #7882, following an APPROVE review with three non-blocking suggestions. Supersedes the snippet and compliance figures in the CREATE record for this slug (that record described the session as it ran and is left untouched, per the append-only rule).

    Accepted (suggestion 1): added two distinct DEVICE treatments that were previously only visible inside other entries' prose or evidence. Cardiac Resynchronization Therapy (NCIT:C80436) is supported by the existing verified PMID:31073128 snippet that names CRT explicitly. Mechanical Circulatory Support (NCIT:C172327, Left Ventricular Assist Device Insertion) required a new source: rather than attach a generic single-centre LVAD-outcomes paper, PMID:28190577 (Lancet DCM seminar) was fetched for a disease-anchored statement that medically refractory patients may benefit from mechanical circulatory support and heart transplantation.

    Declined with evidence (suggestion 2): the reviewer asked for a biventricular/right-ventricular phenotype, citing the deep-research report. That assertion traces to OMIM clinical-synopsis content the DR run could not fetch — the report itself records a 403 and flags the section as triangulated from search-engine summaries pending confirmation. No cited primary source supports it, and the one report that explicitly followed the right ventricle (PMID:32038292) found it normal throughout despite severe progressive left-sided disease. That contrary observation was added to the organ-level node as supports: PARTIAL (n=1 constrains the node's scope without establishing RV sparing as a disease-level property), and the node remains scoped to left ventricular involvement.

    Declined (suggestion 3): cardiomegaly has no human support in the available sources. The only evidence is the increased heart-weight-to-body-weight ratio in the D73N knock-in mouse, and model-organism evidence should not be the sole support for a human phenotype; that finding is already cited on the Adverse Ventricular Remodeling node as MODEL_ORGANISM.

    Also in this session: expanded the Heart Transplantation evidence snippet from the four-word fragment '6 underwent cardiac transplantation' to the full sentence from PMID:15542288, after CI's check_snippet_length gate rejected it — this gate is not part of just validate, so it only surfaced in CI. The branch was also rebased onto main to resolve conflicts in the shared sorted cache CSVs (MONDO:0012745 against the newly merged MONDO:0012762, plus a same-CURIE timestamp clash on GO:0005509), resolved as union plus just normalize-cache with no duplicate CURIEs introduced.

    Note on event vocabulary: the review suggested --event UPDATE, but HistoryEventTypeEnum admits only GENERAL, CREATE, EDIT, REVIEW and AUDIT, so this record uses EDIT.

    Validation: just validate passes; 98/98 snippets verified against cached references; check_snippet_length, check_folded_hyphens and term_cache_integrity all pass; compliance 88.7% global / 89.0% weighted.

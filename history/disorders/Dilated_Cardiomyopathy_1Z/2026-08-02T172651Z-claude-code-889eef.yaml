  summary: 'Create: Dilated Cardiomyopathy 1Z (TNNC1)'
  details: |
    De novo curation of MONDO:0012745 (dilated cardiomyopathy 1Z), the TNNC1-related node of familial isolated dilated cardiomyopathy.

    NEC preflight: MONDO:0012745 was verified with OAK before curation. Its definition names TNNC1 as the causal gene, the OMIM xref is OMIM:611879, the HGNC relationship is RO:0004003 HGNC:11943, and CMD1Z is an exact synonym. Every curated citation concerns TNNC1.

    Deep research: falcon (Edison) was attempted first per the /curate default and returned HTTP 402 Payment Required; openscientist returned HTTP 401 Unauthorized; the claude_code provider ran successfully (16 web searches, 17 citations) and its report is committed at research/Dilated_Cardiomyopathy_1Z-deep-research-claude_code.md. Every DR-sourced PMID, snippet and ontology term was independently re-fetched and verified per the DR-verification SOP. That process caught two identifier errors in the DR report: it asserted HGNC:11940 for TNNC1 (that identifier is TNK1; correct is hgnc:11943) and suggested HP:0025168 for reduced ejection fraction (HP:0025168 is Left ventricular diastolic dysfunction; correct is HP:0012664).

    Curated: 9 pathophysiology nodes conforming to the cardiomyopathy_maladaptive_remodeling module at 5 nodes; 3 competing mechanistic_hypotheses groups (thin-filament calcium-desensitization CANONICAL, troponin-phosphorylation-uncoupling ALTERNATIVE, slowed-activation-kinetics EMERGING) because the literature genuinely disagrees on the direction of effect for the founding G159D variant; a REFUTE-tagged evidence item is deliberately retained on the desensitization node to preserve the contradicting explanted-myocardium measurement. Three discussions: a CONTROVERSY on the reconstituted-versus-native-tissue direction conflict, a HUMAN_MODEL_MISMATCH on the D73N knock-in mouse (an allele the authors state is not known to cause human disease), and a KNOWLEDGE_GAP on genotype-directed myofilament therapy, each with structured proposed_experiments. Also 8 phenotypes, 5 TNNC1 variants, 4 diagnostics, 3 differential diagnoses, 3 progression phases, 4 treatments, 4 experimental models.

    GeneReviews baseline: no TNNC1-specific chapter exists, so the disease-level Dilated Cardiomyopathy Overview (PMID:20301486) is tagged GeneReviews in top-level references and its two verbatim-quotable clauses are cited.

    Validation: just validate passes (schema, term and reference validation); 95/95 snippets verified against cached references; compliance 88.4% global / 88.7% weighted (sibling entry Dilated_Cardiomyopathy_1AA is 75.8%).

  summary: 'Review round 1: Aplasia_of_Lacrimal_and_Salivary_Glands'
  details: |
    Review round 1 on PR 13699. Added reference_title to all 93 evidence items, copied by script from the title frontmatter of each references_cache/PMID file. Added two supportive treatments sourced from PMID:30697385: saliva substitutes (targets Xerostomia) and artificial tears (targets Decreased lacrimation and Dry eye), both bound to NCIT:C15747 Supportive Care with therapeutic_modality OTHER and no therapeutic_agent, because the source names no single product; an OLS search of NCIT for artificial tears, lubricant eye and saliva substitute returned only specific branded or formulation products. Added the oral hygiene and high-fluoride toothpaste sentence to Preventive Dental Care, and target_mechanisms edges on every treatment. Sourced the Sjogren differential clause on minor salivary gland histology from the same paper (normal minor salivary gland histology excluded Sjogren syndrome in the reported ALSG patient; earlier onset and serology also cited). Added the sublingual gland (UBERON:0001832, looked up in OLS; UBERON:0001833 suggested in the review is lip) to the salivary branching node with PMID:19102732, whose second affected brother had total sublingual aplasia while the proband's sublingual glands were present. Not added: ocular surface sequelae (corneal erosion, keratopathy), because the only source is a child with congenital alacrimia of unknown genetic cause; a separate ERK1/2 node, because the only evidence is from submandibular explants and it is already cited on the signaling-to-branching edge. All new snippets are from cached full text and verified with count-verified-snippets and validate-disorders.

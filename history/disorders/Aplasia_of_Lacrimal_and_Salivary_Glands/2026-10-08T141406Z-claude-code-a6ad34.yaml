  summary: 'Create: Aplasia_of_Lacrimal_and_Salivary_Glands'
  details: |
    New entry for aplasia of lacrimal and salivary glands (MONDO:0008397, OMIM 180920), autosomal dominant FGF10 haploinsufficiency (hgnc:3666). Curated from primary literature found by PubMed search and from one OpenScientist deep-research report (research/Aplasia_of_Lacrimal_and_Salivary_Glands-deep-research-openscientist.md). The report's reference validation resolved 17 of 17 citations with 0 off topic (8 of 17 scored on topic, the other 9 not called either way); its term validation set needs_review: HP:0000562 was unresolved, GO:0005615 obsolete, and eight CURIEs were labelled as different terms (for example HP:0009746 offered for salivary gland morphology is Thick nasal septum, UBERON:0001833 offered for sublingual gland is lip). The report also gives FGF10 as HGNC:3853, which the local HGNC build resolves to FRA13D; the entry binds hgnc:3666 from the MONDO stub and term validation. No term was copied from the report; every binding was looked up in OLS or the committed caches. just preflight-dr returned WARN only because the report also cites OMIM 149730, which it names as the allelic LADD syndrome; FGF10 is mentioned 68 times and the report is about ALSG. References taken from the report and verified: 26955834, 37615310, 16501574, 32715658, 10821755, 15716343, 38081329, 41533940, 41409311, 41791508, 38537898. Not used as ALSG phenotype evidence: 41791508, 22339588 and 11340723 describe congenital salivary gland agenesis without an FGF10 diagnosis, so the report's 80 percent xerostomia and 100 percent caries frequencies are not ALSG frequencies and no frequency was recorded; 41791508 is cited only for the Sjogren differential and scintigraphy, and 38537898 (minor salivary gland transplant for congenital alacrimia of unknown cause) only as an INDIRECT treatment item. 23924632, 26565022, 17959718 and 37685309 concern Fgf10 limb and lung rescue, Cx43, heparanase and ultrasound and were not needed for any claim. The report's statement that the non-penetrant carrier was an obligate carrier is not in the cited abstract and was not repeated. A Bzdega 2022 review and an Ikeda 2026 mouse study suggested on the claim issue were used. Orphadata refresh failed on a checksum mismatch, so ORPHA:86815 is recorded as an external assertion only and the manifest was not repinned. No GeneReviews chapter exists (just check-genereviews NO_CHAPTER, also with --online). Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, list-disconnected-phenotypes (11 of 11 phenotypes connected) and validate-disorders.

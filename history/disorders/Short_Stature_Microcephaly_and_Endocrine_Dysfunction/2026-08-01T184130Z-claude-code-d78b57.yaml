  summary: 'Create: Short Stature, Microcephaly, and Endocrine Dysfunction (SSMED)'
  details: |
    De-novo curation of SSMED [MONDO:0014686, OMIM:616541], XRCC4-related microcephalic primordial dwarfism. NEC preflight confirmed XRCC4/HGNC:12831 identity via MONDO obo record. Deep research via Edison/Falcon (run in progress at commit time; cross-check to follow). All citations verified against cached PubMed abstracts. Evidence: PMID:25728776 biallelic XRCC4 in five families / MPD; PMID:25839420 NHEJ mechanism, genomic instability, primary microcephaly + short stature + facial dysmorphism; PMID:25742519 gonadal failure + early-onset metabolic syndrome + possible tumor predisposition; PMID:27169690 XRCC4 essential for NHEJ and the characteristic absence of overt immunodeficiency. No GeneReviews article exists. Validated: schema PASS, terms PASS, references 15/15 snippets verified.

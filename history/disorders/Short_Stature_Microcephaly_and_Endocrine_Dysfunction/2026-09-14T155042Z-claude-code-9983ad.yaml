  details: |
    Unblocking round on PR #8796. The blocking review finding (the XRCC4 edge snippet quoting the source node rather than reaching the target node) was already fixed on this branch in commit 8701a1d on 2026-09-04, but no review has run since and the branch had gone into conflict with main, so the PR sat stuck. This round resolves that conflict; the snippet fix is unchanged and verifies.

    Three conflicts, all resolved by keeping both sides rather than choosing one.

    First, the downstream list on the Impaired Non-Homologous End Joining node. This branch added causal_link_type: DIRECT plus two edge-evidence items to the 'Genomic Instability and Impaired Cell Proliferation' edge, which is the reviewer's requested fix; main had independently added a separate second edge, 'Increased cellular sensitivity to ionizing radiation', with a description. Git presented these as alternatives because they are adjacent, but they are two different causal edges, so both are retained.

    Second, supports: PARTIAL on the neoplasm phenotype evidence conflicted with main's supports: SUPPORT. Main is correct because #10003 retired PARTIAL. Took SUPPORT and also reworded the explanation immediately below, which still read 'hence PARTIAL support' - the retired-value prose problem CLAUDE.md records under Retired Enum Values, where the migration moved the values but not the prose arguing for them. No directness value was added: the limitation being described is that the observation rests on a single reported case, and CLAUDE.md states directness is not a strength or quality grade and explicitly allows a DIRECT item from a single case report. The prose now states the limitation, that the evidence establishes occurrence rather than a predisposition rate, without naming a value the schema no longer has.

    Third, and not reported by git as a conflict at all, the merge produced a duplicate top-level classifications key. This is the exact merge-shaped failure CLAUDE.md documents: two curation streams each adding a classifications block at a different point in one entry, merging without a textual conflict, invisible to PyYAML-based tooling but fatal to the ruamel-based reference validator. It was caught by just check-duplicate-keys, which failed while just validate's own schema pass had already gone red on the unparsable file. Main's block carries isds_skeletal_category (the ISDS 2023 nosology row) and this branch's carries harrisons_chapter (ENDOCRINOLOGY_METABOLISM primary plus GENETICS_ENVIRONMENT_DISEASE secondary). The sub-keys do not overlap, so the two were folded into the single block at the canonical position ahead of prevalence, per the guidance to merge the blocks rather than delete one.

    Verified after resolution that both sides' content survives: main's second downstream edge and its ISDS row are present, and this branch's extended snippet and Harrisons rows are present. Delta against main is 3 files, +117/-2.

    Validated: just validate (20/20 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens, and validate-history.

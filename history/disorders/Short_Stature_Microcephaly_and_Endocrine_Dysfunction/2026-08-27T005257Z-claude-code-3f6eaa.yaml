  summary: Assign ISDS nosology group 21 (primordial dwarfism and slender bone dysplasias)
  details: |
    Added the missing classifications.isds_skeletal_category assignment. The ISDS 2023 Table 1 lists this entity at NOS 21-0190 as 'Microcephalic osteodysplastic primordial dwarfism, XRCC4-related' against OMIM 616541; the dyadic renaming means neither 'SSMED' nor 'XRCC4 deficiency' appears in the table, so the OMIM number is what identifies the row. OMIM:616541 was confirmed equivalent to MONDO:0014686 (this entry's disease_term) via the EBI OLS4 API. The assignment is 1:1 - the nosology lists exactly one XRCC4 row. A whole-table gene search confirmed LIG4 is absent from the 2023 table, so the note records that the sibling NHEJ disorder's absence is not an oversight. Schema validation, folded-hyphen, duplicate-key and entity-ref checks all pass.

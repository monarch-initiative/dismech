  summary: Wire phenotypes into the pathograph (10/10 connected)
  details: |
    Pathograph-connectivity pass over ISDS group 21. The dismech QC plugin dismech.qc_plugins scores phenotype causal-inlink coverage: whether each phenotype node is reached by a causal edge from the mechanism graph. Across the group the baseline was 3/192 (1.6%) - the pathophysiology chains ended at organism-level consequence nodes and never reached the phenotype nodes, so almost every phenotype rendered as a disconnected node. Wired every phenotype off the genomic-instability node, with radiosensitivity off the NHEJ node as its direct assay readout. Also fixed the gene wiring: XRCC4 was not listed on any pathophysiology node, so the causal gene floated disconnected from the mechanism it causes. Every added edge carries a description; where the route is inferred rather than demonstrated the description says so, and several carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES. Validation: just validate-disorders passes across all 15 group-21 files, 567/568 snippets verified.

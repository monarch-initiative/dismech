  summary: 'Create: Visceral_Heterotaxy_7 (HTX7, MMP21)'
  details: |
    New standalone entry for MONDO:0014762 (HTX7), autosomal recessive heterotaxy caused by biallelic MMP21 loss of function. Deep research: claude_code provider (research/Visceral_Heterotaxy_7-deep-research-claude_code.md); 14/14 citations resolved, none off topic; the report is about MMP21 (31 mentions) so it is not a named-entity confusion. Its one unverified citation (PMID:25807483, Li 2015) was not used. just preflight-dr was not run because no local MONDO build is available. Evidence drawn from the gene-discovery papers (PMID:26437028, PMID:26437029, PMID:26429889), later case and functional reports (PMID:33240936, PMID:39858609, PMID:40679208), MMP21 domain characterization (PMID:12490321) and the organizer gene-module paper (PMID:39753129). Pathograph: MMP21 metalloendopeptidase loss (GO:0004222, inferred from domain structure) -> organizer signaling failure downstream of intact cilia -> lateral plate mesoderm Nodal randomization -> abnormal cardiac looping -> cardiac and visceral laterality phenotypes; a single-study Notch dysregulation branch is recorded as a proposed link. Lump/split: standalone, following Visceral_Heterotaxy_9. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validated with just validate, validate-terms and count-verified-snippets (47/47).

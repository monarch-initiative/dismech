  details: |
    Addressed the CHANGES_REQUESTED review on PR 14376. Added eight phenotypes from Table 2 of PMID:39858609 and from PMID:33240936: ventricular septal defect (FREQUENT, 10 of 26 tabulated patients), interrupted IVC with azygos continuation, right and left atrial isomerism, partial and total anomalous pulmonary venous return, single ventricle, and right-sided stomach (bound to HP:0100802 Malposition of the stomach; no right-sided-stomach HP term was found by OLS search). The reviewer's suggested CURIEs were looked up in OLS and the HP cache before binding; each phenotype is wired downstream of Abnormal Cardiac Looping or the lateral plate node. Added a diagnosis section: prenatal ultrasound (NCIT:C222238), exome sequencing (NCIT:C101295) with structural-variant analysis, and exclusion of PCD (left unbound after NCIT searches). Dropped the unsupported VERY_FREQUENT on Heterotaxy. Recast the Notch branch as an EMERGING mechanistic_hypotheses entry (mmp21_notch_restraint) carried on both Notch edges, and gave the Notch-to-lateral-plate edge an INDIRECT evidence item. Added the total cavopulmonary connection evidence (PMID:33240936) to staged cardiac surgery and broadened its target phenotypes to single ventricle and TGA. Validated: validate, validate-terms, count-verified-snippets 66/66.

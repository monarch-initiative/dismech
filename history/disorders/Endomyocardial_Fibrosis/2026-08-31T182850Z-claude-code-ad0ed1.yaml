  details: |
    The ai4c-reviewer review of PR 10258 raised two prose findings against the same PARTIAL-residue work: that substituting the word 'bounded' for the retired grade reintroduces an undefined, ungreppable grading token in a field no gate checks, and that an explanation must not deny the supports value its own item carries. Both apply here and are fixed before a reviewer has to find them twice. Three items said their evidence 'constrains rather than supports the claim', 'qualifies rather than supports the efficacy claim', or was 'Bounded for that reason' while carrying supports: SUPPORT. That construction only parsed while a third enum value existed; after the migration it flatly asserts the evidence does not support the claim it is attached to. Each is rewritten to state what the item does do: it constrains how much causal weight eosinophilia can carry, which is why the eosinophil arm is curated as necessary-but-not-sufficient; it bounds how much the negative result can be read to exclude rather than measuring efficacy itself; it records the elevation together with the authors' own hedge, which is why no directional claim is made. No directness added to any of the three - their caveats are about strength rather than directness, which is the distinction this tranche already applies. No supports value, snippet, reference, evidence_source or ontology term changed. Validated with just validate-disorders: 192/192 snippets verified, consistency check zero in both directions.

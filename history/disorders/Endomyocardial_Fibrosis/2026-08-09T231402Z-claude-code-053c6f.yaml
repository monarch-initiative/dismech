  summary: 'Review response: Endomyocardial Fibrosis'
  details: |
    Review-response session on PR 8273. Addressed four blocking findings from the
    ai4c-reviewer round-one review, plus most suggestions, and one banding error the
    round-two review caught.

    Added: environmental with four exposures - cassava with protein deprivation,
    geochemical cerium and thorium, poverty and barefoot farming, and chronic
    helminth and malarial infection - each linked by influences_mechanisms to the
    trigger node. experimental_models with the Sezi cassava primate model, the
    refuted plantain and serotonin models, and the fibroblast coculture.
    histopathology with four findings. classifications set to CARDIOVASCULAR. A
    prednisolone treatment carrying REFUTE evidence on its primary endpoint. Three
    plasma cytokine biochemical entries. Orthopnoea, sudden cardiac death, and
    hepatosplenomegaly phenotypes. Frequency bands for atrial fibrillation,
    thromboembolism, eosinophilia, and sudden cardiac death. Diuretic and
    antiarrhythmic therapeutic_agent bindings.

    Three references fetched and verified: PMID 26666319 the prednisolone randomised
    trial, PMID 25303100 the plasma cytokine study, PMID 8756020 the Sezi cassava
    feeding experiment in Cercopithecus aethiops.

    Deliberate curation decisions. The cerium exposure carries a NO_EVIDENCE item
    quoting the systematic review's own verdict that no empirical study supports it,
    because recording a refuted hypothesis with its refutation is more useful than
    omitting it. The helminth exposure carries a REFUTE item on parasite load not
    differing between cases and controls, which is what demotes eosinophilia from
    initiator to amplifier. The Sezi model is written around the banana control
    rather than the cassava arm, since the banana diet was also protein-free and the
    control is therefore the load-bearing result. Several inferences previously
    carried only by hypereosinophilic-syndrome sources were re-grounded in
    endomyocardial-fibrosis-specific ones from the Cureus review full text.

    Corrections made in this session. The thromboembolism frequency band was set to
    FREQUENT when its own snippet reads 15 to 20 percent, which FrequencyEnum places
    in OCCASIONAL; corrected, along with the explanation string that stated the wrong
    mapping outright. The reviewer suggested NCIT C265 for the antiarrhythmic agent;
    that identifier is Antidepressant Agent, and NCIT C47793 was used instead after
    checking with OAK.

    Two term bindings are deliberately absent and documented in the entry notes. No
    ECTO term exists for cassava, cerium, thorium, or monazite exposure, and the
    broader available terms either assert a mechanism the sources do not establish or
    assert almost nothing. The HistopathologyFindingTerm enum is restricted to the
    NCIT histopathology-result branch and contains no cardiac or endocardial fibrosis
    morphologic concept.

    Validation: schema, ontology terms, and references all pass. Snippets checked
    127 of 127 verified against cached references, up from 86 of 86 at creation.
    Compliance 95.1 percent global, 95.4 percent weighted.

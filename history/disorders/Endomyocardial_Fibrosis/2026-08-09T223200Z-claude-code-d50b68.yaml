  summary: 'Create: Endomyocardial Fibrosis'
  details: |
    New disorder entry for endomyocardial fibrosis, MONDO:0006746, curated from a
    claude_code deep-research report treated as leads only.

    Content: 13 pathophysiology nodes following the Davies three-stage model from a
    chronic antigenic or toxic stimulus through eosinophilia, eosinophil degranulation
    and endocardial injury, mural thrombosis, fibroblast activation, and dense
    endocardial scar, to restrictive physiology, atrioventricular valve regurgitation
    and congestive heart failure. Also 13 phenotypes, 4 progression phases, 3
    diagnostic modalities, 5 treatments, 2 HLA susceptibility loci, 1 biochemical
    marker, 2 prevalence records, 3 differential diagnoses, clinical burden, and 5
    discussions. Five nodes declare conformance to the fibrotic_response module.

    Discussions: eosinophil hypothesis untestable in the endemic setting
    KNOWLEDGE_GAP, unexplained geographic distribution KNOWLEDGE_GAP, natural history
    of screen-detected disease OPEN_QUESTION, autoimmunity cause or consequence
    OPEN_QUESTION, and research neglect as a disease feature CURATION_TODO. Four carry
    proposed experiments with explicit decision criteria.

    Deliberate curation decisions: the eosinophil mechanism is evidenced chiefly from
    hypereosinophilic syndrome literature rather than from tropical endomyocardial
    fibrosis itself, and every such citation is marked PARTIAL with the limitation
    discussed rather than glossed; the anti-myocardial autoantibody response is curated
    as a parallel amplifying arm rather than a step in the main chain because direction
    of causation is unresolved; the entry is deliberately not merged with Loeffler
    endocarditis; OMIM 226000 endocardial fibroelastosis is explicitly excluded as a
    distinct disease.

    Provider error correction: three provider-suggested ontology identifiers were
    verified against OAK and found to point at unrelated concepts, HP:0012765 widened
    cerebellar subarachnoid space rather than orthopnea, HP:0005177 premature
    arteriosclerosis rather than tricuspid regurgitation, and UBERON:0002348 epicardium
    rather than endocardium. Two provider-suggested references for the eosinophil
    granule mechanism were fetched and found to be correspondence items without
    abstracts, so they are not cited. All recorded in the entry notes.

    Validation: just validate passed on schema, ontology terms, and references.
    Snippets checked 86/86 verified against cached references. just validate-disorders
    passed in a batched run over this and two sibling entries, 258/258 snippets.
    Compliance 95.7 percent global, 96.1 percent weighted.

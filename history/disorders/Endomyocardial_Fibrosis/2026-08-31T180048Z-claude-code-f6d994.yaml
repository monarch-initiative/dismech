  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place, so this entry explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim, restated in terms of the current enum, following the pattern set by PR 10120 and continued in PR 10258. Where the reason IS an inference step - the quote reaches the claim through a broader statement, an adjacent subject, a proxy system or a different population - directness: INDIRECT is added, because that is the slot the reason was always describing. Where the reason is something else, the token is dropped without asserting a directness nobody assessed. A consistency check enforces both directions: no explanation claims INDIRECT without the item carrying the slot, and no item carries the slot without the explanation saying why; both are zero. No supports value, snippet, reference, evidence_source or ontology term changed. Unlike Otofacial_Neurodevelopmental_Syndrome, curated in the same tranche, this entry is genuinely mixed and all 23 were read individually rather than pattern-matched. Sixteen are inference steps and gain the slot: a quote about biopsy yield standing in for the degranulation mechanism, a co-occurrence sentence standing in for a causal link, findings not named in the abstract (ascites, hepatomegaly, dyspnoea, atrial dilatation, the specific rhythm), a trial rationale standing in for a result, an organ-on-chip system described as a mechanistic proxy rather than disease recapitulation, and two differential-diagnosis items whose comparator is not the one named in the source. Seven do NOT gain the slot because their caveat is about strength rather than directness: the source's own hedge about a prevalence estimate resting on limited regional data, authors explicitly stopping short of asserting causation, a proposal labelled speculation, and an item that qualifies rather than supports the efficacy claim it sits on. Asserting INDIRECT on those would manufacture an appraisal no curator made, which is exactly what #10003 declined to do at scale. Validated with just validate-disorders across the tranche: 192/192 snippets verified.

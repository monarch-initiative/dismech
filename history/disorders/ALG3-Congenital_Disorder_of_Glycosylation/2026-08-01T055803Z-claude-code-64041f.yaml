  summary: 'Create: ALG3-congenital disorder of glycosylation'
  details: |
    De novo creation of the ALG3-CDG (formerly CDG-Id) entry, joining nine existing CDG entries in the KB. Curated a six-node pathograph from the ALG3 alpha-1,3-mannosyltransferase deficiency through the truncated Man5GlcNAc2 lipid-linked precursor to protein hypoglycosylation and multisystem glycoprotein dysfunction, plus a separate retinal ganglion cell node for the neuroretinal ocular phenotype. Three nodes declare conforms_to against the congenital_disorder_of_glycosylation module (ER Lipid-Linked Oligosaccharide Assembly Defect, Protein Hypoglycosylation, Multisystem Glycoprotein Dysfunction); notably the sibling ALG1 and ALG9 CDG entries carry no conforms_to at all, so this is the first CDG entry to wire itself into the module and could serve as the pattern for backfilling them. The substitution recorded at the upstream node is that the module's generic assembly defect is here a single positionally defined missing sugar, the sixth mannose, whose block yields an N-glycan signature reported to be unique among the CDGs. Seven HPO-bound phenotypes, one gene, prevalence as CASES_IN_LITERATURE (about 40 reported individuals), three diagnosis modes, one treatment (baseline multisystem surveillance; no disease-modifying therapy exists), two KNOWLEDGE_GAP discussions (whether the truncated glycan is actively harmful versus merely insufficient; whether the glycan signature could serve as a severity or trial surrogate endpoint). Diagnosis terms reuse NCIT:C18020 Diagnostic Procedure as used by the sibling CDG entries, after NCIT electrophoresis and mass spectrometry terms failed the TreatmentActionTerm enum. Validation: just validate passes, 22/22 snippets verified; compliance 84.5 percent global, 85.3 percent weighted.

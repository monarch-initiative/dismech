  summary: Review DFNB97 gene validity, variant evidence, strial mechanism and care
  details: |
    Reviewed the entire disorder entry and prior CREATE/EDIT history against its Falcon research report and citation list. The entry is a Mendelian hearing-loss candidate association and is within the sweep; infectious and environmental disorders are excluded. No earlier REVIEW or overlapping open disease PR was found at selection.

    Source consumption: read the complete cached founding study PMID:25941349, including clinical examinations, segregation, the linked-regulatory-variant caveat, prediction disagreement, exon trapping, and the explicitly speculative receptor mechanism. Read the complete ClinGen record and current generated ClinVar condition records RCV000202585.7 and RCV002490458.8. Read the cached abstracts for PMID:27488639, PMID:32152201, PMID:31801140, PMID:19576567 and PMID:27717089. Used the full-text cache for PMID:31506927 and read its HGF/MET discussion and relevant tables, including the syndromic p.Phe1186Cys report and distinctions from GAB1 modifier evidence. Read GeneReviews NBK1434 diagnostic, habilitation and counseling sections.

    The 2016 mouse article's public full-text excerpts were also inspected through indexed PMC results: conditional mouse lines, intermediate-cell markers, hair-cell development and later degeneration, auditory results and the discussion of incorporation versus approach/adhesion. These support distinguishing neural-crest and epithelial Met deletions and reject an assumption that sensory cells remain structurally intact. Whole-article cache recovery failed: PMC HTML routes returned browser challenges, the correct PDF returned a download preparation page, publisher routes returned 403, Europe PMC fullTextXML returned 500, BioC returned no result, and NCBI efetch explicitly supplied metadata without full text. These failed/interstitial caches are not committed. Quotes from the cached abstract remain limited to what that abstract states. The qualitative later-degeneration observation is identified in the model description as a full-text result, without attaching an unrelated abstract quote as its proof.

    The Moroccan study remained abstract-only through PMID and DOI fetches; its HAL record has metadata but no deposited file. Research-report claims about implantation at four years, imaging and detailed population frequencies were not promoted to KB facts without a quotable primary source. General implant guidance is represented separately, without a disease-specific outcome claim. The full-text source limitation does not resolve the conflicting variant interpretations; those are preserved using the available primary abstract and current ClinVar record.

    Genetics: removed the unconditional CAUSATIVE classification, which the schema defines as Strong/Definitive-level evidence. Retained a candidate association with the explicit ClinGen Limited assertion. Distinguished the segregating p.Phe841Val candidate from the original p.Ile316Met pathogenic claim and later single-submitter likely benign classification for multiple conditions including DFNB97. The p.Phe841Val pathogenic condition assertion is literature-only and does not upgrade gene-disease validity. Added representative variants without pretending the disputed allele has established pathogenic significance. The syndromic p.Phe1186Cys report is kept outside the DFNB97 phenotype spectrum.

    Mechanisms: qualified the human receptor defect and cochlear lesion as proposed, separated strial ion homeostasis from reduced endocochlear potential, and represented Hgf del10 as an indirect pathway comparator rather than a MET model. Corrected the mouse hearing-threshold direction to INCREASED. Added the previously omitted exon-trap model: 63 of 65 mutant-derived clones matched wild type and the two aberrant products may be artifacts. No loss-of-function category is inferred from missense status or computational predictions.

    Clinical findings: retained severe prelingual hearing loss without unsupported OBLIGATE frequencies and added delayed speech development. Preserved the ambient-noise audiometry limitation. Normal vestibular bedside testing does not establish strial localization. Normal laboratory and funduscopic findings were documented in only two affected children; no lifelong absence of systemic disease or cancer is inferred. The negative screen of 100 additional selected families is not population prevalence.

    Care and diagnosis: added four general hearing-loss care options with GeneReviews evidence, distinguishing these from MET-specific efficacy. Counseling makes recessive recurrence estimates conditional on an established molecular diagnosis. Broad genetic testing and careful variant interpretation replace a mandatory sequential-exclusion workflow. Removed the oncology condition as a misleading hearing-loss differential and retained the HGF comparison without comparing differently ascertained family counts as population frequencies.

    Completeness assessment: phenotypes adequate for the supported nonsyndromic observations; no established separate subtype; six mechanism nodes with explicit human/model limits; genetics and allele interpretation adequate; diagnostics and general care supported; references consumed beyond abstracts where accessible. The research report overstates causality and misses the later gene-validity qualification. No supported MET-targeted therapy was identified. ClinicalTrials.gov searches for DFNB97 expanded into MET oncology, while the full disease phrase returned zero; mixed MET/hearing-loss hits concerned unrelated indications or middle-ear devices and were not added as DFNB97 trials. No disease-specific dataset was identified in the consumed evidence.

    Remaining scientific gaps include receptor signaling for the human candidate alleles, exclusion of linked regulatory causes, human cochlear pathology, longitudinal audiology and genotype-specific treatment outcomes. Full primary text for the Moroccan case and an independently quotable cache of the mouse article would support future additions; these limitations are not treated as negative experimental results.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 97 (DFNB97, MET)'
  details: |
    De novo curation of DFNB97 from MONDO:0014739. entry_type DISEASE: two published families, a conserved developmental pathograph running from a biallelic MET missense allele through failed neural-crest melanocyte incorporation into the stria vascularis to endolymphatic potassium failure and severe prelingual hearing loss, and its own OMIM and DFNB identity. ClinGen Hearing Loss GCEP rates MET-nonsyndromic hearing loss Limited; recorded as an external_assertion with the panel's own explanation of why only one of three reported variants scored. The gene is typed CAUSATIVE rather than DISPUTED because Limited means insufficient rather than contradicted, and the uncertainty is carried by a knowledge gap instead of being double-counted in the relationship type. Named entity handling for an oncogene: preflight flagged HGF at 33 percent of MET mentions in the deep-research report, so every citation was checked individually for whether it concerns the deafness phenotype. Nothing from the oncology literature is curated; hereditary papillary renal cell carcinoma appears only under differential_diagnoses, and the family's screened absence of tumours and organ disease is curated as a phenotype. HGF/DFNB39 separation: it is a separate differential entity with a different variant class, and the single place HGF evidence supports a DFNB97 node - the endocochlear potential, which has only ever been measured in the Hgf arm - is graded PARTIAL, labelled in the node description, and carries its own HUMAN_MODEL_MISMATCH discussion. Two examined-and-absent findings, preserved vestibular function and absence of neoplasia, are curated with the HP term for the absent thing and evidence graded REFUTE, because Phenotype has no presence slot and FrequencyEnum has no EXCLUDED value; the workaround is flagged in notes. functional_impact_category is deliberately omitted from the genetic_context because neither missense allele has been functionally assayed - that absence is the subject of the second knowledge gap. No treatments curated, since management is generic habilitation with no DFNB97-specific evidence. Validated: just validate exit 0, just validate-terms exit 0, validate-disorders exit 0 with 36/36 snippets verified.

  details: |
    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000 Hz per ear) to the existing Audiometry and clinical assessment diagnosis row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not the vestibular, laboratory or funduscopic examinations also described in that row. No reference range is bound: the founding family's own pure-tone average (500-4000 Hz, 74-89 dB HL) straddles the WHO/GBD Severe (65-<80 dB) and Profound (80-<95 dB) boundary at 80 dB, so neither grade alone would represent the reported range.

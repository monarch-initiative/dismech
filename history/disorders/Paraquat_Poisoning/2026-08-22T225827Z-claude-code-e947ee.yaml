  summary: 'PR #9279 review round 1: cite primary studies, add diagnosis and cardiac arms, connect phenotypes'
  details: |
    Response to review round 1 on PR #9279 (REQUEST CHANGES, six IMPORTANT items, no
    blockers). Every finding was checked before acting. Five accepted and fixed; one
    accepted in substance but implemented differently, with the reason below.

    Two fixes I had CLAIMED in an earlier commit had silently not landed. This is the
    most important thing in this record.

    The previous commit message and history record stated that
    `therapeutic_modality: BEHAVIORAL` had been removed from Supportive Care and that
    "diffuse alveolar damage" had been softened to "alveolar damage". Neither
    edit applied: both were python str.replace() calls whose anchor text did not match
    the file, and I did not re-read the file afterwards to confirm. The reviewer found
    the BEHAVIORAL slot still present at line 969 - and, worse, sitting in direct
    contradiction with a note elsewhere in the same file saying it had been omitted.
    The lesson is narrow and mechanical: a replace() that silently no-ops leaves the
    file valid, so validation cannot catch it; only grepping for the string afterwards
    can. Both are now fixed and verified by grep rather than asserted.

    The reviewer's central point was right: the PR fetched 28 reference caches and
    cited 9. That is dims 7 and 8 of the completeness checklist, and it was the root
    of four of the six findings. Resolved by consuming the ones that carry real
    content and deleting the rest.

    Consumed, all read directly rather than taken from the deep-research report:

    - PMID:24475310, a nationwide retrospective cohort of 1811 hemoperfused patients,
      now carries the immunosuppression claim that previously rested on a secondary
      editorial. The entry's own explanation had conceded the weakness ("reported
      second-hand in an editorial rather than read here in the primary trials"),
      which was honest but was not a resolution when the primary study was sitting
      uncited in the same PR. The editorial item is retained beside it as the record
      of what the trial literature claims, and the new explanation notes the effect
      is modest in absolute terms (24.3% to 29.3% against 26.4% overall survival).
    - PMID:33050540 does something more useful than corroborate: it REFUTES the claim
      the haemoperfusion treatment was built on. A multi-centre study of 213
      SIPP-stratified patients found no 60-day survival benefit from haemoperfusion,
      and specifically none from EARLY haemoperfusion - contradicting the
      four-to-six-hour window this entry had curated from the editorial. Added with
      supports: REFUTE. The treatment is retained because it remains in use, not
      because the evidence supports it, and the entry now says so.
    - PMID:28881652 and PMID:33050540 support a new diagnosis: section built around
      the Severity Index of Paraquat Poisoning. SIPP earns its place because its two
      inputs - plasma concentration and hours elapsed - are exactly the two variables
      this entry's mechanism section argues govern outcome. The semiquantitative
      urine dithionite test is curated with its false-negative failure mode, tied to
      the occult inhalational route already in the entry, and an admission
      mortality-prediction nomogram (DOI:10.1038/s41598-023-50722-z) is curated as
      PARTIAL because its own authors say it needs external validation.
    - PMID:37812357 adds ferroptosis, Keap1 upregulation and Nrf2 degradation as a
      second death programme on the alveolar-injury node, tagged MODEL_ORGANISM.

    Deleted: fourteen reference caches this entry does not cite. They were fetched by
    the deep-research generation resolving its own citations, not by deliberate
    curation. Note this is the OPPOSITE decision to the one taken on PR #9251, where
    33 DR-resolved caches were kept so that report's reference-validation section
    stayed reproducible. Both are defensible and the repo has no stated convention;
    this PR follows the reviewer's explicit request, and the divergence is flagged on
    the PR so a maintainer can settle it rather than have it drift case by case.

    Finding 5, phenotype connectivity: five phenotypes were unreachable from any
    pathophysiology node - Severe Mucositis, Vomiting, Diarrhea, Subcutaneous
    Emphysema and Dyspnea. All five now have edges. Note Subcutaneous Emphysema could
    not be attached where the reviewer suggested, "via the Pneumomediastinum route",
    because Pneumomediastinum is a phenotype and phenotypes carry no downstream slot;
    it hangs off the caustic-injury node instead, with the air-tracking route in the
    edge description.

    Finding 6, the cardiac arm: accepted in substance, implemented differently, and
    this is the one worth reading.

    The reviewer asked for a cardiac arm on the grounds that the DR report calls
    cardiogenic collapse "the dominant fatal mechanism in the fulminant form". A
    cardiac arm is added - but that claim is NOT curated, and the node is deliberately
    not placed on a fatal path. No source located for this entry supports it. The one
    human source that addresses the question directly, PMID:38204158, says the
    opposite: "little to no evidence exists on the hemodynamic and cardiac
    electromechanical effects of acute paraquat poisoning". So the node carries what
    is actually evidenced - dose-dependent cardiac depression in anaesthetised rodents
    (MODEL_ORGANISM) and severe bradycardia refractory to anticholinergics reported as
    unusual - plus a new KNOWLEDGE_GAP recording that the mechanism of death in
    fulminant high-dose poisoning is, on this entry's evidence, unaccounted for. That
    is a more useful thing to record than a borrowed assertion, and the node notes
    name the DR claim explicitly so the next curator does not re-import it.

    This is the second time in this entry that a DR assertion has been declined on
    verification, after the CL:0002062/CL:0002063 swap. Treating DR output as leads
    rather than evidence is doing real work here, not just ceremony.

    Not done: no genetic: susceptibility section, no animal_models:, no NF-kB/JNK-p38
    arm, and the additional phenotypes (hypoxemia, metabolic acidosis, abdominal
    pain) - all 4 BLUE suggestions. Their supporting caches were among those deleted;
    they are named on the PR as follow-up rather than half-implemented.

    Validation: validate and validate-terms passed; 77/78 snippets verified with 1
    skipped by prefix (the DOI, which conf/reference_validator_config.yaml excludes
    from snippet checking - stated rather than reported as 78/78);
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence and check-not4curation all
    clean; pytest -k Paraquat 16 passed. Pathograph re-checked programmatically: 11
    nodes, 15 phenotypes, 27 edges, no dangling targets and no island phenotypes.
    Incidental references_cache frontmatter churn from just validate was reverted.

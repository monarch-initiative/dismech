  summary: 'LOINC tranche I: bind plasma and urine paraquat codes'
  details: |
    Bound LOINC:5709-1 (Paraquat, Mass/volume, Serum or Plasma) as measurements on both the SIPP (Severity Index of Paraquat Poisoning) row and the admission mortality-prediction nomogram row, and LOINC:52961-0 (Paraquat, Presence, Urine) on the semiquantitative urine dithionite test row. No reference_ranges band was added for either plasma-paraquat row: SIPP is a plasma-concentration-by-time index and the nomogram is a multivariable model with plasma paraquat as one of several inputs, neither a single threshold concentration -- the same reasoning already applied to Methotrexate_Toxicity's time-indexed nomogram.

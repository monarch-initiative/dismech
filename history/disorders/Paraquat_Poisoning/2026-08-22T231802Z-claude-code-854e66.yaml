  summary: Apply the three non-blocking suggestions from the approving review
  details: |
    The re-review of 99e581374 approved the PR with three non-blocking SUGGESTIONs.
    All three were verified against the sources and applied, because each was cheap
    and each was substantively right rather than stylistic.

    1. One orphan reference cache remained. Having deleted fourteen uncited caches in
    the previous round, I missed PMID:41647033, which the reviewer spotted. It is now
    cited on the Lung Transplantation treatment - and it earns its place by
    qualifying that treatment rather than endorsing it: the same report documents
    failed extubation from respiratory muscle weakness after a technically successful
    transplant, so graft function is not the whole outcome, and it notes that a review
    of previously reported paraquat-related transplant cases found only fifteen, which
    bounds how much experience exists. The uncited-cache count is now zero, verified
    programmatically rather than asserted.

    2. The bradycardia phenotype was bound to HP:0001662 Bradycardia while its own
    preferred_term read "Severe sinus bradycardia" and the cited abstract states the
    ECG showed sinus bradycardia. Rebound to the more specific HP:0001688 Sinus
    bradycardia, with the ECG sentence added as evidence so the narrower term is
    licensed by a quote rather than by the preferred_term's wording. That sentence
    also reports a normal echocardiogram, which is worth having on the record: it is
    why this entry does not claim structural cardiac injury.

    3. Cardiac Involvement was a disconnected component. The reviewer's point is a
    distinction I had elided: keeping the node off the FATAL path, which was the
    deliberate decision, does not require keeping it off the pathograph entirely. It
    now has an incoming edge from the redox-cycling node marked
    INDIRECT_UNKNOWN_INTERMEDIATES, with the edge description stating that no human
    study localises cardiac injury to redox cycling - so the node is connected
    without asserting the mechanism the accompanying KNOWLEDGE_GAP says is
    unestablished. The declined deep-research claim about cardiogenic collapse being
    the dominant fatal mechanism remains declined and remains recorded in the node
    notes.

    Still absent, and named rather than half-implemented: genetic: susceptibility and
    animal_models: sections. The rodent evidence currently lives inside evidence items
    rather than in a structured animal_models: block with modeled_mechanisms; that is
    the natural follow-up the reviewer identifies, and it needs references that were
    among those deleted, so it would mean re-fetching.

    Validation: validate and validate-terms passed; 79/80 snippets verified with 1
    skipped by prefix (the DOI, which conf/reference_validator_config.yaml excludes
    from snippet checking); check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-environmental-evidence and
    check-not4curation all clean; pytest -k Paraquat 16 passed. Pathograph re-checked
    programmatically: 11 nodes, 15 phenotypes, 28 edges, no dangling targets, no
    island phenotypes, and now no orphan nodes.

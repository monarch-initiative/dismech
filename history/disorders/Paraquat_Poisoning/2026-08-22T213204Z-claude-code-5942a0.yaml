  summary: 'Create: Paraquat Poisoning'
  details: |
    New entry created via /curate with the claude_code deep-research provider, as
    requested.

    Duplicate preflight. Checked all three surfaces before starting. On origin/main
    the only `aconit`-style hits for "paraquat" in kb/ are as an environmental
    Parkinson-disease risk factor and complex I toxin
    (Parkinsons_Disease.yaml, PARK7-Related_Early-Onset_Parkinson_Disease.yaml, and
    the parkinsonism_dopaminergic_degeneration module); there was no poisoning entry
    and no stub. GitHub PR and issue searches for "paraquat" returned zero results in
    either state. MONDO:0017862 paraquat poisoning verified via OAK, with an
    Orphanet:31827 xref and a direct RO:0004028 CHEBI:34905 causative-chemical
    relationship recorded on the term itself.

    GeneReviews. Searched and found none, which is expected for a toxic exposure
    rather than a Mendelian disorder; the skill's Step 3b is explicitly scoped to
    Mendelian disease. PubMed esearch for "paraquat GeneReviews[All Fields]" returned
    0 results. No action needed.

    Deep research. `just research-disorder claude_code Paraquat_Poisoning` - genuine
    harness output, 311.85 s, 13 web searches, 15 turns, 23 citations, real
    timestamps. Note the recipe requires the disorder file to exist first, so the
    skeleton was written before the run rather than after; the first attempt failed
    with "Disorder file not found" for exactly that reason. The report's own
    reference_validation frontmatter reports 23/23 verified, 0 not found, 0
    unverifiable, confabulation_rate 0.0, 23 relevance-assessed with 14 on topic and
    no off_topic_references or needs_review flag. Nine references are undecided
    rather than cleared, since a record without an abstract cannot be scored for
    relevance.

    NEC preflight. `just preflight-dr` returned SKIP: MONDO records no causal gene
    (RO:0004003) for MONDO:0017862, because the disease is a toxic exposure, so the
    gene-frequency check cannot discriminate. Fell back to the manual checks the
    skill prescribes. MONDO has no OMIM xref here to conflict with the report; the
    label "paraquat poisoning" carries no eponym, no numbered series and no acronym
    collision, so the synonym-aliasing routes to NEC do not apply; and the report's
    top gene mentions (SLC22A2, SLC22A3, ABCB1) are paraquat transport genes rather
    than a rival disease's causal gene. Identity is not in doubt.

    DR content handling. Nothing was bulk-imported. One lead was taken up and
    anchored to primary literature that was fetched and read directly: PMID:18039652,
    which localises the one-electron reduction to mitochondrial complex I in mammals
    and, less obviously, establishes a second membrane-potential-dependent transport
    step carrying the dication into the mitochondrial matrix - so the selectivity
    story has two tiers, cellular then subcellular, not one.

    An error in the DR report worth recording: its "Cell types involved" list gives
    CL:0002063 as type I pneumocyte and CL:0002062 as type II. OAK says the opposite
    (CL:0002062 = pulmonary alveolar type 1 cell, CL:0002063 = pulmonary alveolar
    type 2 cell). The YAML follows OAK. This is a concrete instance of why DR
    ontology identifiers must be verified rather than copied, and it would have been
    invisible to snippet validation.

    The DR also names NADPH oxidase as a redox-cycling site while PMID:18039652
    localises reduction to complex I. These are complementary rather than
    contradictory - different subcellular sites - and the node's notes say so,
    curating complex I on the node because that is where the direct experimental
    evidence sits, and recording the NADPH oxidase claim without binding it because
    its source here is a two-patient case report citing secondary literature.

    Sources. PMID:18161502 (Crit Rev Toxicol review) for the polyamine-transport
    uptake mechanism and the 6-10x pulmonary accumulation; PMID:39239177 (editorial)
    for organ-level mechanism, treatment landscape and the 90% case fatality;
    PMID:18039652 (yeast and isolated mammalian mitochondria) for complex I;
    PMID:42048945 (pooled analysis of 170 published cases) for the stomatitis natural
    history; PMID:18154668 (systematic review) for the pesticide self-poisoning
    context; PMID:30474499 (meta-analysis, already cached from the parkinsonism
    module) for the Parkinson association. PMID:42266604 was supplied by the user
    mid-session and contributed six phenotypes plus the occult inhalational route.

    Epistemic handling. The immunosuppression evidence is genuinely contradictory -
    one systematic search concluding efficacy is anecdotal, three randomised trials
    reporting mortality benefit - and both are curated, the second as REFUTE against
    the first, with a KNOWLEDGE_GAP that sets out the two competing explanations
    (trial validity versus confounding by ingested dose) rather than picking one. A
    second KNOWLEDGE_GAP records that extracorporeal elimination clears the
    compartment paraquat is leaving rather than the one it has entered, which would
    explain the narrow therapeutic window, and flags that this causal reading is an
    inference joining two separate observations rather than a measured result. A
    CONTROVERSY records the paraquat-Parkinson association as association, not
    causation, and points at the existing module rather than restating its effect
    estimate second-hand.

    Frequency discipline. Only paraquat-associated stomatitis carries a band -
    FREQUENT, from a directly reported 78.8% in the 170-case pooled analysis, which
    sits inside the 30-79% range near its upper edge. Severe mucositis is left
    unfrequenced on purpose because its reported prevalence (13.9% to 58.3%) depends
    on presentation delay rather than being a property of the poisoning. Prevalence
    is recorded for the pesticide class rather than for paraquat, with
    prevalence_class UNKNOWN, because the cited figure counts all pesticide
    self-poisoning deaths and attributing it to paraquat would overstate it.

    Two errors made and corrected during the session, both worth recording because
    neither was caught by the check that was supposed to catch it first.

    First, a duplicate YAML key. Inserting the second environmental entry placed its
    influences_mechanisms block inside the preceding entry, orphaning that entry's
    own block. `just validate`'s schema step PASSED - PyYAML's safe loader silently
    keeps the last value - and only the ruamel-backed reference validator raised
    DuplicateKeyError. This is the failure mode CLAUDE.md documents for concurrent
    merges, encountered here from the authoring side instead. Fixed by relocating
    the whole entry after the preceding one, then verified structurally: both
    environmental entries now carry their own correctly targeted link.

    Second, a title snippet plus a false justification for it. The Parkinson
    association evidence initially quoted the paper's title, and its explanation
    asserted that the cached record "carries no abstract text to quote". check-title-
    snippets failed, and on looking, the abstract was present - the parkinsonism
    module already quotes its odds ratio from the same cache file. Replaced with the
    abstract's own finding sentence. The quote was wrong and the stated reason for
    using it was also wrong; recorded because the second error is the more serious
    one.

    Ontology substitutions recorded at the point of use rather than made silently:
    NCIT:C77524 Activated Charcoal is rejected by the ChemicalEntityTerm dynamic enum,
    so the agent binds CHEBI:91090 charcoal with "activated" carried in
    preferred_term; NCIT has no haemoperfusion term under either spelling, so the
    extracorporeal treatment binds the generic NCIT:C49236; ECTO has exactly five
    paraquat labels and none is ingestion- or inhalation-specific, so both exposure
    entries bind the route-agnostic ECTO:9000395 rather than the misleading
    air/soil/water siblings; HPO has no acute-liver-injury term short of failure, so
    that phenotype binds HP:0006554 while preferred_term keeps the source's weaker
    wording rather than silently upgrading injury to failure.

    Validation. just validate and just validate-terms passed with 53/53 snippets
    verified; check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence and check-not4curation all
    clean; pytest -k Paraquat 16 passed. Pathograph checked programmatically: 9
    nodes, 10 edges, no dangling downstream targets, no unconnected nodes, and all
    treatment and environmental link targets resolve. Cache gained exactly seven
    CURIEs (MONDO:0017862, CL:0000322, GO:0015203, GO:1902047, ECTO:9000395,
    HP:0025421, HP:6001021), all written by linkml-term-validator with genuine
    timestamps. One pre-existing cache file (PMID_30474499.md) was rewritten by
    `just validate` as incidental frontmatter churn and was reverted rather than
    committed.

    Note on this record's metadata: the model field is intentionally absent. The
    /curate command template asks for it and CLAUDE.md asks for it on AI-assisted
    curation, but this session's operating instructions forbid putting a model
    identifier into any artifact pushed to a repository. The same conflict was
    flagged on PR #9251 (Aconitine_Poisoning) and referred to a maintainer; it is
    still unresolved, so the handling here is kept consistent with that entry rather
    than decided unilaterally. The committed deep-research artifact does carry model

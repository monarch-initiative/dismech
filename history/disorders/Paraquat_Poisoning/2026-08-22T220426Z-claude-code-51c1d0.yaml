  summary: 'Pre-PR red-team review round: fix NADPH/NADH node-name error, connect phenotypes, add missing treatments and mechanisms'
  details: |
    Response to a pre-PR red-team review (skill Step 7), run in fresh context by a
    subagent using the dismech-pr-review skill against commit 4fedd3636. Every
    finding was checked against primary sources before acting on it; two of the
    reviewer's own claims did not survive that check and are recorded below.

    The one factual error. The central node was named "NADPH-Dependent Redox Cycling
    and Superoxide Generation" while the mechanism curated on it is mitochondrial
    complex I. Complex I is NADH:ubiquinone oxidoreductase - verified directly as
    GO:0008137 "NADH dehydrogenase (ubiquinone) activity" - and the cited abstract
    puts NADPH on the yeast side of the very sentence quoted on the node: "reduced by
    complex I (mammals) or by NADPH dehydrogenases (yeast)". So the name asserted the
    one cofactor this entry deliberately declines to curate and mislabelled the one
    it does. Renamed to "Redox Cycling and Catalytic Superoxide Generation", which is
    cofactor-agnostic and matches the evidence; four references to the old name were
    updated (the node definition, one inbound downstream edge, one target_mechanisms
    link, one attaches_to). The description now names NADH at complex I explicitly,
    and the node notes record the error so it is not reintroduced. Note the reviewer
    said five foreign keys; the actual count is four - three of the node's edges are
    outbound, not inbound.

    Two reviewer claims that did not check out, both caught by verifying rather than
    trusting.

    First, the proposed evidence snippet for the inhalation route was two
    non-adjacent sentences joined with an ellipsis; as supplied it is not a substring
    of the cached file and would have failed validation. The real passage also
    undercuts the accompanying argument: the reviewer proposed retargeting the link
    on the grounds that inhalation BYPASSES the active-transport route, but the
    source says absorption proceeds "through epithelial active transport mechanisms
    directly into the pulmonary capillary bloodstream". The link was retargeted from
    the pulmonary-accumulation node to the alveolar-injury node, which is right for a
    different reason - immediate epithelial destruction at the site of deposition -
    and the description now says explicitly that this is a shortcut in delivery, not
    a bypass of transport. Two exact sentences from the cache carry it.

    Second, the reviewer's oxygen quote was correct but my first search for it failed
    on a non-ASCII hyphen; the claim was real. That is the third time this session
    that retyping a snippet rather than extracting it programmatically produced a
    mismatch (thin spaces, micro sign, Greek alpha and beta). Snippets are now
    extracted from the cache by regex rather than transcribed.

    Blocking findings accepted and fixed.

    The entry had committed 26 reference caches (fetched by the deep-research
    reference-validation pass) and cited five. The unused ones were not incidental -
    they were the papers filling the entry's gaps, already fetched and verified. Four
    are now consumed:

    - Lung transplantation was absent entirely, despite being the only intervention
      that addresses the lesion that kills survivors, and despite the entry's own
      cited full text recording that it was "abandoned due to financial constraints"
      in one case. Added as a treatment (NCIT:C15289, SURGERY) with treatment_effect
      BYPASSES on the fibrosis node - the one place in this entry where BYPASSES is
      the accurate enum, since a graft supplies gas exchange by an entirely different
      route rather than modifying the fibrotic process. Evidenced from PMID:36626514,
      a completed double-lung transplant on ECMO 34 days after ingestion. Both cited
      cases record cost, not medical eligibility, as the limiting factor, and that is
      curated rather than smoothed over.
    - The oxygen-restriction caveat was absent. It is the clearest clinical corollary
      of this entry's own redox node - supplemental oxygen is the substrate that
      reoxidises the paraquat radical - and it was quotable from an already-cached
      file. Added as a treatment with INHIBITS on the redox node, the only
      intervention here acting on the mechanism rather than its consequences, and
      curated as the genuine trade-off the source describes rather than as a blanket
      prohibition.
    - The renal arm had no ontology grounding at all while the lung arm had a full
      transporter story. PMID:17495125 was committed and unread: hOCT2 (but not hOCT1
      or hOCT3) and hMATE1 both carry paraquat, and expressing either raises uptake
      and cytotoxicity by roughly an order of magnitude. The node now carries
      CL:1000838 and a transport process term, and the description records the
      three-way significance of renal handling - organ injury, elimination route, and
      the fact that the transporters clearing paraquat are what load the tubular cell
      with it.
    - The fibrosis node jumped from epithelial injury straight to ECM organisation
      with no cellular effector. Added a TGF-beta-driven mesenchymal transition node
      from PMID:25799450, which is the mechanistically interesting part: short
      high-dose paraquat kills alveolar epithelium, whereas prolonged low-dose
      exposure transforms it into mesenchymal-like cells that resist death and secrete
      matrix, TGF-beta1-dependently (abolished by SB431542). That dose-and-duration
      split is what explains the biphasic clinical course this entry curates. The node
      is in-vitro (A549, NHBE) and is nonetheless wired into the human chain, with the
      notes stating the judgement and inviting a curator who disagrees to detach the
      edge rather than delete the node.

    Structural findings accepted and fixed.

    All 13 phenotypes were disconnected from the pathograph. I verified the
    convention rather than taking the reviewer's sample on trust: 108 of the first
    120 disorder entries have pathophysiology->phenotype downstream edges, so this
    entry was the outlier. Nine such edges added. The commit message's claim of "no
    unconnected nodes" had been true only within pathophysiology:, which is a
    narrower claim than it read as.

    The caustic-injury node was a dead end while its own description and a verified
    snippet asserted a link to systemic complications. Edge added to the renal node
    with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, because the evidence is an
    association across pooled cases and the shared driver is most likely ingested
    dose rather than one organ acting on the other.

    Module conformance added: the entry curated a textbook fibrotic_response chain
    with the middle removed. With the mesenchymal node in place it now declares
    conforms_to on fibrotic_response#Mesenchymal Cell Activation and
    #Excessive ECM Deposition; both anchors verified against the module file.

    The Immunosuppression and Antioxidant Therapy treatment bundled two drug classes
    that act on different nodes: its therapeutic_agent bound the immunosuppressants
    while its single target_mechanisms link described the antioxidants, and its own
    KNOWLEDGE_GAP attached to nodes the link did not point at. Split into
    Immunosuppressive Therapy (targeting alveolar injury, matching the gap) and
    Antioxidant Therapy (targeting the redox node). Antioxidant agents are
    deliberately left unbound with a note: the sources name them only as a bundle, so
    per-agent CHEBI bindings would imply a specificity the evidence lacks.

    The apoptosis claim on the alveolar-injury node was evidenced one node away, on
    the redox node. The snippet is now repeated on the node whose description and
    GO:0008631 binding rest on it, and "diffuse alveolar damage" was softened to
    "alveolar damage" to match the source. The Respiratory Failure phenotype was
    effectively unevidenced - its only snippet spoke to overall mortality and its own
    explanation conceded it did not support the phenotype - and now carries a
    case-level statement of fatal progressive respiratory failure.

    therapeutic_modality: BEHAVIORAL was removed from ICU supportive care. CLAUDE.md
    scopes BEHAVIORAL to behavioural, physical, dietary or lifestyle intervention and
    explicitly places NCIT:C15747 outside the mechanical-inference table; mechanical
    ventilation and organ support are not a lifestyle intervention.

    The prevalence record was a category error. It reported 258,234 annual deaths
    from ALL pesticide self-poisoning while sitting on a paraquat entry, with the
    measure's scope written into the population field that CLAUDE.md reserves for
    cohort and geography. Honest notes did not fix it: tooling and export would read
    it as paraquat's occurrence. The prevalence block is removed and the class-level
    figure moved to entry notes as context, with a pointer to Orphanet:31827 - xrefed
    from MONDO:0017862 but not present in references_cache/ - as the right source for
    a paraquat-specific prevalence class.

    Vomiting and Diarrhoea named two findings under one HP:0002013 binding; split
    into separate phenotypes.

    One ontology limitation worth flagging for a maintainer. GO:0015695 organic
    cation transport is live and is a descendant of GO:0006810 transport, but is
    rejected by the BiologicalProcessTerm dynamic enum - it is absent from
    cache/enums/biologicalprocessterm_*, as is GO:0006810 itself. That looks like a
    gap in the membership cache rather than a statement about the ontology, so the
    broader-but-valid GO:0055085 is bound with a specific preferred_term and the node
    notes record that GO:0015695 is worth re-testing once the enum cache is
    refreshed. Per the cache guardrails the CSV was not hand-edited.

    Not done, deliberately. No diagnosis: or biochemical: section (the dithionite
    test, plasma nomogram and SIPP score are named in a proposed_experiments block
    where they belong for now); no cardiac arm; no Orphanet rebuild. These are
    genuine gaps, recorded here rather than half-filled.

    Validation after the changes: validate and validate-terms passed with 66/66
    snippets verified (up from 53; every addition is new evidence);
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence and check-not4curation all
    clean; pytest -k Paraquat 16 passed and the full conforms_to suite 2293 passed.
    Pathograph re-checked programmatically: 10 nodes, 14 phenotypes, 21 edges of
    which 9 reach phenotypes, no dangling targets, and the only dead end is the
    terminal Multiorgan Failure and Death node. All treatment target_mechanisms
    resolve.

  summary: Bind molecular function on gene landing node
  details: |
    Bound a molecular function on the pathophysiology node a wired gene lands on, so the gene-activity grounding gate no longer reports it: "DNA2 Nuclease-Helicase Deficiency" gains GO:0017108 5'-flap endonuclease activity, modifier DECREASED; "DNA2 Nuclease-Helicase Deficiency" gains GO:0043139 5'-3' DNA helicase activity, modifier DECREASED. The node's own description already states this activity. The term was chosen from the gene product's QuickGO molecular-function annotations with experimental, phylogenetic or curated (non-electronic) evidence, preferring the most specific term the node's text supports; label copied from QuickGO. Validated with linkml-validate and the online term validator.

  summary: 'Genetics pass: bind all four RTS MONDO subtype terms, add CRIPT and DNA2
    subtypes and genetic records, wire genes and six phenotypes into the pathograph'
  details: |
    Genetics pass for series-055 (issue #12262). The entry curated two molecular
    types; MONDO records four. Bound all four subtype concepts on has_subtypes rows -
    Type 1 MONDO:0016368 / ANAPC1 and Type 2 MONDO:0016369 / RECQL4 on the rows that
    already existed, plus new Type 3 MONDO:0014347 / CRIPT and Type 4 MONDO:0970950 /
    DNA2 rows - and gave every row a genes descriptor and an inheritance block bound
    to HP:0000007. Added the reciprocal genetic[].subtype foreign keys, which were
    absent on both pre-existing gene records, and new CRIPT and DNA2 genetic records.

    Research order. GeneReviews (PMID:20301415, cached copy last updated 2020 Jun 4)
    names only ANAPC1 and RECQL4, so the two newer genes were researched from primary
    literature: PMID:37013901 (Genet Med 2023) for CRIPT and PMID:37055165 (J Med
    Genet 2023) for DNA2, with PMID:38021400 (Front Aging 2023) as the review that
    counts all four as RTS genes. All three cache files were fetched for this pass and
    are committed with it. Both primary reports describe their entity as RTS-like or
    reminiscent of RTS rather than as RTS proper; the entry follows MONDO's placement
    and records the distinction in the subtype descriptions and in notes.

    Pathograph. Added three nodes - CRIPT Loss of Function, Premature Cellular
    Senescence, and DNA2 Nuclease-Helicase Deficiency - and four new edges from
    pre-existing nodes: RECQL4 to the senescence node, ANAPC1 to Juvenile Cataracts,
    Osteosarcoma Predisposition to Osteosarcoma, and DNA2 into the existing Impaired
    DNA Replication and Repair node. causal_inlink_coverage was 0/15 before the pass
    and is 6/17 after it; gene_mechanism_wiring_coverage was 2/2 and is 4/4.

    Two phenotypes were added with subtype: Type 3, Neurodevelopmental Delay
    (HP:0012758) and Seizures (HP:0001250), both wired from the CRIPT node, since they
    are the features that separate the CRIPT-related form from the other three.

    A negative result is recorded rather than smoothed over. PMID:37013901 reports
    that RECQL4- and CRIPT-deficient fibroblasts had unremarkable mitotic progression
    and no more than mild sensitivity to five genotoxic agents. That sentence is
    curated as a REFUTE item on the Premature Cellular Senescence node, and no edge
    runs from that node to Genomic Instability and Chromosomal Rearrangements, because
    the source would contradict it. The three edges whose intermediate steps are not
    established (ANAPC1 to cataracts, CRIPT to the two neurological phenotypes, DNA2
    to short stature, senescence to poikiloderma) carry
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES.

    Stale prose corrected. The entry description said "Two molecularly defined types
    are recognized" and notes said the DNA2 and CRIPT entities "were not curated as
    RTS subtypes in this entry"; both statements are made false by this diff and were
    rewritten.

    Deleted stubs/Rothmund-Thomson_Syndrome_Type_2.yaml, whose MONDO:0016369 is now
    bound on the Type 2 row.

    Validation: just validate, just validate-terms, just check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values
    all pass; 74 snippets verified against the cached references; 28 gene bindings
    compared against HGNC with no findings and no uncached rows. CRIPT (hgnc:14312)
    and DNA2 (hgnc:2939) symbols and approved names were read live from
    rest.genenames.org during this pass.

  summary: 'Review round 1: re-file the genotoxic-sensitivity result as SUPPORT'
  details: |
    Blocking finding on PR 12918. The PMID:37013901 sentence reporting unremarkable mitotic progression and no or only mild genotoxic sensitivity in RECQL4- and CRIPT-deficient fibroblasts was filed as REFUTE under the Premature Cellular Senescence node. That node asserts increased cellular senescence, and the sentence does not bear against it; it bears against a different claim, that the senescence follows from measurable genome instability. Filed as REFUTE it rendered and counted as evidence against senescence itself, the opposite of what the paper reports. Regraded SUPPORT, with the explanation now tied to what the node's description actually states - that the senescent phenotype is present without measurable genotoxic sensitivity or mitotic error in the same cells - and saying explicitly that this is the reason no edge is drawn to the genomic instability node. The decision not to draw that edge is unchanged and was endorsed by the reviewer; only the supports value was wrong. Verified by parsing HEAD and the working tree that the node still carries exactly two evidence items, both with explanations, and that only the supports value changed.

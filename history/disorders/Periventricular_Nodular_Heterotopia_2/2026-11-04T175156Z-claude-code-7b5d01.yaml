  summary: 'Create: Periventricular Nodular Heterotopia 2'
  details: |
    Created de-novo entry for Periventricular nodular heterotopia 2 (PVNH2 / OMIM 608097), MONDO:0011966, the autosomal recessive ARFGEF2 (hgnc:15853) form of periventricular nodular heterotopia with microcephaly - distinct from the existing FLNA X-linked Periventricular_Nodular_Heterotopia entry (MONDO:0010233) and paralleling the Periventricular_Nodular_Heterotopia_8 sibling. Picked from the HIGH-priority stub queue (just next-unclaimed; ClinGen Definitive AR, Brain Malformations GCEP). Pathophysiology chain: ARFGEF2/BIG2 loss of function -> impaired Golgi vesicle trafficking in radial glia -> (reduced neural precursor proliferation -> microcephaly) and (failed neuronal migration -> periventricular nodular heterotopia) -> cortical malformation/hyperexcitability -> seizures, developmental delay, intellectual disability. Evidence anchored on the seminal Sheen et al. 2004 linkage/mechanism paper (PMID:14647276, already cached from the FLNA entry) and a 2026 ARFGEF2-PVNH case report + literature review (PMID:42200925), with the 26126837 phenotypic-spectrum paper also fetched. Microcephaly bound as Progressive microcephaly (HP:0000253), the review's stated distinguishing feature. GeneReviews: NO_CHAPTER, confirmed by name+synonym and gene-side (ARFGEF2[TIAB]) and PVNH title searches against genereviews[book] - no chapter exists, recorded here. Deep research with the claude_code provider was in progress at commit time and its screened citations/preflight-dr will be folded in a follow-up. Validation: just validate + validate-disorders pass, 7/7 snippets verified, check-granularity/entity-refs/causal-targets/name-collisions/logical-rules/coarse-phenotypes/duplicate-keys/qualifier-terms all clean, 5/5 phenotypes causally connected.

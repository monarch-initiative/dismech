  summary: 'Create: Periventricular Nodular Heterotopia 2'
  details: |
    Created de-novo entry for Periventricular nodular heterotopia 2 (PVNH2 / OMIM 608097), MONDO:0011966, the autosomal recessive ARFGEF2 (hgnc:15853) form of periventricular nodular heterotopia with microcephaly - distinct from the existing FLNA X-linked Periventricular_Nodular_Heterotopia entry (MONDO:0010233) and paralleling the Periventricular_Nodular_Heterotopia_8 sibling. Picked from the HIGH-priority stub queue (just next-unclaimed; ClinGen Definitive AR, Brain Malformations GCEP). Pathophysiology chain: ARFGEF2/BIG2 loss of function -> impaired Golgi vesicle trafficking in radial glia -> (reduced neural precursor proliferation -> microcephaly) and (failed neuronal migration -> periventricular nodular heterotopia) -> cortical malformation/hyperexcitability -> seizures, developmental delay, intellectual disability. Evidence anchored on the seminal Sheen et al. 2004 linkage/mechanism paper (PMID:14647276, already cached from the FLNA entry) and a 2026 ARFGEF2-PVNH case report + literature review (PMID:42200925), with the 26126837 phenotypic-spectrum paper also fetched. Microcephaly bound as Progressive microcephaly (HP:0000253), the review's stated distinguishing feature. GeneReviews: NO_CHAPTER, confirmed by name+synonym and gene-side (ARFGEF2[TIAB]) and PVNH title searches against genereviews[book] - no chapter exists, recorded here. Deep research with the claude_code provider (research/Periventricular_Nodular_Heterotopia_2-deep-research-claude_code.md) completed clean: 21/21 references resolved, 0 off-topic, no confabulations (the single flagged quote is a real ellipsis match in PMID:42200925); term validation 65/67 resolved with no obsolete terms, and its mislabelled-term flags are the report's own suggestions, none of which this entry binds. just preflight-dr returned WARN only - canonical gene ARFGEF2 is mentioned 30x and OMIM 608097 matches; the "second gene CDC" flag is the acronym CDC from citations, not a gene (the same heuristic false positive seen on the arbovirus entries), so there is no Named Entity Confusion. The entry's evidence was already drawn from the strongest sources the report cites. Pre-PR red-team round (dismech-pr-review via fresh-context subagent): added the high-frequency phenotypes the cached full-text review (PMID:42200925) documents - hypotonia, spastic tetraparesis, feeding difficulties and corpus-callosum hypoplasia; joined the previously orphan "Cortical Malformation and Hyperexcitability" node by adding a downstream edge from "Failure of Neuronal Migration" and wiring the motor/feeding phenotypes to it; added a representative homozygous loss-of-function variant (c.5126G>A p.Trp1709*, PMID:26126837) to the genetic section; added a prevalence record (CASES_IN_LITERATURE / ULTRA_RARE, 20/21 consanguineous); and regraded the progressive-microcephaly quote_role from REVIEW_SYNTHESIS to PRIMARY_RESULT (it is the case report's own conclusion). 15/15 snippets verified after the round. Deliberately left Involuntary movements (basal-ganglia) and LVNC cardiomyopathy (extra-CNS) unwired from the cortical chain; animal-model links (Arfgef2-null mouse) and an expanded treatment/diagnosis section are noted as follow-ons. Validation: just validate + validate-disorders pass, 7/7 snippets verified, check-granularity/entity-refs/causal-targets/name-collisions/logical-rules/coarse-phenotypes/duplicate-keys/qualifier-terms all clean, 5/5 phenotypes causally connected.

  summary: 'Create: Periventricular Nodular Heterotopia 2'
  details: |
    Created de-novo entry for Periventricular nodular heterotopia 2 (PVNH2 / OMIM 608097), MONDO:0011966, the autosomal recessive ARFGEF2 (hgnc:15853) form of periventricular nodular heterotopia with microcephaly - distinct from the existing FLNA X-linked Periventricular_Nodular_Heterotopia entry (MONDO:0010233) and paralleling the Periventricular_Nodular_Heterotopia_8 sibling. Picked from the HIGH-priority stub queue (just next-unclaimed; ClinGen Definitive AR, Brain Malformations GCEP). Pathophysiology chain: ARFGEF2/BIG2 loss of function -> impaired Golgi vesicle trafficking in radial glia -> (reduced neural precursor proliferation -> microcephaly) and (failed neuronal migration -> periventricular nodular heterotopia) -> cortical malformation/hyperexcitability -> seizures, developmental delay, intellectual disability. Evidence anchored on the seminal Sheen et al. 2004 linkage/mechanism paper (PMID:14647276, already cached from the FLNA entry) and a 2026 ARFGEF2-PVNH case report + literature review (PMID:42200925), with the 26126837 phenotypic-spectrum paper also fetched. Microcephaly bound as Progressive microcephaly (HP:0000253), the review's stated distinguishing feature. GeneReviews: NO_CHAPTER, confirmed by name+synonym and gene-side (ARFGEF2[TIAB]) and PVNH title searches against genereviews[book] - no chapter exists, recorded here. Deep research with the claude_code provider (research/Periventricular_Nodular_Heterotopia_2-deep-research-claude_code.md) completed clean: 21/21 references resolved, 0 off-topic, no confabulations (the single flagged quote is a real ellipsis match in PMID:42200925); term validation 65/67 resolved with no obsolete terms, and its mislabelled-term flags are the report's own suggestions, none of which this entry binds. just preflight-dr returned WARN only - canonical gene ARFGEF2 is mentioned 30x and OMIM 608097 matches; the "second gene CDC" flag is the acronym CDC from citations, not a gene (the same heuristic false positive seen on the arbovirus entries), so there is no Named Entity Confusion. The entry's evidence was already drawn from the strongest sources the report cites. Pre-PR red-team round (dismech-pr-review via fresh-context subagent): added the high-frequency phenotypes the cached full-text review (PMID:42200925) documents - hypotonia, spastic tetraparesis, feeding difficulties and corpus-callosum hypoplasia; joined the previously orphan "Cortical Malformation and Hyperexcitability" node by adding a downstream edge from "Failure of Neuronal Migration" and wiring the motor/feeding phenotypes to it; added a representative homozygous loss-of-function variant (c.5126G>A p.Trp1709*, PMID:26126837) to the genetic section; added a prevalence record (CASES_IN_LITERATURE / ULTRA_RARE, 20/21 consanguineous); and regraded the progressive-microcephaly quote_role from REVIEW_SYNTHESIS to PRIMARY_RESULT (it is the case report's own conclusion). 15/15 snippets verified after the round. Deliberately left Involuntary movements (basal-ganglia) and LVNC cardiomyopathy (extra-CNS) unwired from the cortical chain. PR review round (ai4c-reviewer CHANGES_REQUESTED on #16492), all additive from already-cached sources: regraded the two Sheen framing quotes to quote_role BACKGROUND and added the in-vitro ARFGEF2 results (BIG2 required for trans-Golgi trafficking; dominant-negative/BFA decreases proliferation); inserted a new mechanism node "Mislocalization of Adhesion Molecules" (E-cadherin/beta-catenin fail to reach the surface) between trafficking and migration failure; added the missing >10% phenotypes (cerebral atrophy, growth impairment, recurrent respiratory infections) and frequency values on every phenotype; dropped the unevidenced Intellectual disability node (the sources frame it as developmental delay); added a diagnosis section (MRI gestalt + ARFGEF2 testing + cardiomyopathy screening), antiseizure pharmacotherapy (vigabatrin) and gastrostomy to treatments; added the variant-class/homozygosity evidence on the genetic entry; and added two animal_models (Arfgef2-null mouse PARTIALLY_RECAPITULATES migration, microcephaly not reproduced; gene-trap FAILS_TO_RECAPITULATE, embryonic-lethal), both PMIDs fetched (22956851, 20857375). Set Failure of Neuronal Migration scale to CELLULAR and added connectivity evidence to the cortical node. 33/33 snippets verified after the round. Name initially set to the OMIM-title numbered form (PVNH2). PR review round 2 (ai4c-reviewer CHANGES_REQUESTED, 4 items): renamed to the gene-dyad "ARFGEF2-Related Periventricular Nodular Heterotopia" (entry-naming rule 2 / design decisions section 18 have no sibling-consistency exception, and the dyad is established by literature use), keeping PVNH2 and the numbered form in synonyms (file slug unchanged pending dismech#15894); repointed the gene-trap mouse FAILS_TO_RECAPITULATE link from the LoF node to Failure of Neuronal Migration (the mouse reproduces BIG2 loss but dies before cortical development) and replaced its evidence with the embryonic-lethality results; added the basal-ganglia MRI phenotype (HP:0012751, deep grey matter hyperintensities 9/21); added cohort-count frequency evidence (all-cases / 13/21 / 10/21) to developmental delay, seizures and the movement disorder; kept Involuntary movements (HP:0004305) with a note that Table 1's dystonia is not a sentence-level quote; rebound the adhesion node to GO:0072659. Also resolved a cross-file snippet-grading conflict the whole-tree gate surfaced: the Sheen BIG2/trans-Golgi sentence (PMID:14647276) was graded HUMAN_CLINICAL in the existing Periventricular_Nodular_Heterotopia (FLNA) entry and the apical_neuroependyma_integrity_failure module but IN_VITRO here; it states a molecular function, so both of those were corrected to IN_VITRO (root-cause fix in the files not under curation, per the cross-file rule). Completing the same review round: added a Dystonia phenotype (HP:0001332, FREQUENT) as the predominant movement-disorder type, quoting the review's Table 1 movement-disorder row, and rewrote the Involuntary-movements note to point at it rather than claiming dystonia was unquotable; connected Cerebral atrophy into the pathograph as a downstream edge of Reduced Neural Progenitor Proliferation (IN_VITRO BIG2-inhibition / reduced-brain-growth evidence); and added a progression "Outcome and mortality" record quoting the Table 1 age-at-death row (four deaths, 5 y 11 m to 13 y), with a note on why HP:0003819 Death in childhood is a Clinical modifier and so belongs here rather than as a phenotype. Growth impairment and recurrent respiratory infections were left unconnected: both are systemic/secondary features with no citable mechanistic edge, and an unevidenced edge is worse than none. 40/40 snippets verified; check-snippet-grading and the length gate both clean. Validation at the final state: just validate + validate-disorders pass, 40/40 snippets verified, check-granularity/entity-refs/causal-targets/name-collisions/logical-rules/coarse-phenotypes/duplicate-keys/qualifier-terms all clean, and 8/15 phenotypes causally connected (the remainder are extra-CNS or secondary features with no citable mechanistic edge).

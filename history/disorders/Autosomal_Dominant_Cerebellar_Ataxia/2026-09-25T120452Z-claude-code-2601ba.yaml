  summary: 'Genetics pass: add SCA10/44/50/51/52 subtype rows and six causal-gene
    records'
  details: |
    Genetics pass for issue #12249 (d2g series-042). Enumerated all 64 hierarchical descendants of MONDO:0020380 through the OLS4 hierarchicalDescendants endpoint and read each target term's parent set and Monarch gene edges, then placed subtypes by parentage rather than by label. Adopted an explicit placement rule, recorded in notes: a numbered molecular SCA is carried on this family entry only when MONDO parents it directly on MONDO:0020380, or on a Harding class for which no dismech entry exists. Added five molecular has_subtypes rows on that basis - SCA44 (MONDO:0033479, GRM1), SCA50 (MONDO:0859334, NPTX1), SCA51 (MONDO:0975800, THAP11), SCA52 (MONDO:0981162, RAB3A) and SCA10 (MONDO:0011330, ATXN10) - each with subtype_term, genes and abstract-sourced evidence, and bound ATXN7 on the pre-existing ADCA-II row, which was already anchored to the SCA7 term but carried no gene. Added six per-gene causal records with gene_term and a subtype foreign key; the entry's genetic section previously held two grouped records with no gene binding at all.

    Wired each new gene to the node whose mechanism it acts at rather than listing them together. THAP11 went to the coding polyglutamine node because the discovery report is a CAG expansion, not a conventional variant. ATXN10 went to the noncoding-repeat node as a second, independent expansion class - a pentanucleotide in an intron, beside the FGF14 trinucleotide GAA. GRM1, NPTX1 and RAB3A went to the conventional-variant node. Each gene's evidence item was added at the node it was bound on.

    Two nomenclature hazards were resolved through identifiers rather than labels and are recorded in notes. MONDO:0859334 spinocerebellar ataxia 50 was resolved through its OMIM:620158 cross-reference: the SCA50 designation has also been applied in the literature to GAA-FGF14 disease, which dismech curates as Spinocerebellar_Ataxia_27B. THAP11 is hgnc:23194, verified against a live HGNC fetch in the same step the CURIE was written; hgnc:20856 is THAP1, the DYT6 dystonia gene.

    Recorded the replication position on SCA51 honestly rather than omitting it: a population survey of Genomics England, a UCL neurology cohort and UK Biobank concluded the expansion is rare in the British population, which qualifies the expected testing yield without contradicting the gene-disease association. Fixed a duplicate explanation key introduced by the scripted edit to the noncoding-repeat node's evidence list, caught by check-duplicate-keys and confirmed by reparsing the file.

    Gates: validate, validate-terms, count-verified-snippets (176/176), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches and validate-disorders all clean under linkml-reference-validator 0.3.0rc1.

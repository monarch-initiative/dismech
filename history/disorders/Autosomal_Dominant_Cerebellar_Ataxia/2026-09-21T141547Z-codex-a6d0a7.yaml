  summary: Review dominant cerebellar ataxia scope, mechanisms and care
  details: 'Reviewed the complete entry and all three original citations at actual available depth. Read
    the full Aomori cohort PDF and full polyglutamine review, including methods, tables and discussion;
    renewed Singapore retrieval remained abstract-only. The Singapore estimate counts families, not people.
    The Aomori subtype denominator is 76 classified cases among 80 enrolled; the prose/table inconsistency
    and unproven founder explanation are explicit.


    Read the complete current GeneReviews hereditary-ataxia overview across clinical, genetic, diagnostic,
    care and counseling domains, the 2025 testing consensus and the progressive-ataxia care guideline.
    Related Harding-I manual and Harding-III synthesis/provider reports and citation lists were checked
    for family-level completeness. Their specific molecular pathways and putative neuroprotective interventions
    were not generalized across ADCA. Added current repeat-aware testing, supportive multidisciplinary
    care and subtype-specific drug evidence; genetic transmission, penetrance, anticipation, onset and
    prognosis remain locus-dependent.


    Replaced bundled mechanisms with twelve atomic nodes distinguishing coding expansions, expanded proteins,
    misfolding, inclusions, transcriptional changes, firing, degeneration, network dysfunction, noncoding
    expansions, conventional variants and the SCA7 retinal branch. Visible inclusions are not assumed
    to cause death. Human SCA3 cortical sparing precludes a universal Purkinje-loss mechanism or module
    conformance. Seventeen phenotypes, three mapped historical subtypes, thirteen care entries and four
    diagnostic records preserve molecular and cohort scope.


    Read the full FGF14 clinical study and SCA2 antisense body/methods/available extended captions, separating
    retrospective and four-person post hoc drug responses, early motor versus delayed ex-vivo firing rescue,
    nested mouse counts, and non-allele-selective fibroblast transcript lowering. Read the FDA November
    2025 troriluzole assessment, complete ATRIL abstract and two rehabilitation studies: the full seven-person
    uncontrolled SCA6/SCA31 report and recovered full 62-person randomized mixed-ataxia trial. Functional
    improvement and observational stability do not establish subtype-specific neuroprotection. Missing
    main ASO captions/supplement, abstract-only sources and clinical trial limitations are documented.


    Independent peers checked all twelve nodes and three model records, and all care/diagnosis records.
    The final revisions strengthened atrophy evidence, distinguished extracerebellar dysfunction from
    inferred neuron loss, and corrected communication targets and evidence grades. Reference caches were
    generated only with fetch-reference. The renamed node-class example is updated. Authoritative schema,
    live terms and exact snippets, shared-reference consumer checks and additional quality gates are recorded
    in the PR; independent approval remains a separate requirement.

    '

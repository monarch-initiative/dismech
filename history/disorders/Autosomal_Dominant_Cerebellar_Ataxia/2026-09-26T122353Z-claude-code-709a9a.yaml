  summary: Re-anchor fragile url:PMC clinical-trial reference to stable PMID:40946705
  details: |
    CI test(3.13) failed on the branch after the main-merge: validate-disorders live-refetched the url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12434599/ reference and PMC served a reCAPTCHA interstitial instead of the article, breaking the 7 snippets quoting it (title mismatch 'Checking your browser - reCAPTCHA'). The committed url cache held the correct full text and the content was green at merge-queue enqueue, so this was an intermittent external block, not a content defect -- the #12672 class of destructive url: re-fetch. Durable fix: re-anchored all 7 evidence references (treatments, target_mechanisms, two clinical_trials evidence items, and the references[] entry) from the url: form to PMID:40946705 (JAMA Neurol 2025, DOI 10.1001/jamaneurol.2025.3421; PMC12434599). Confirmed via NCBI idconv, and just fetch-reference PMID:40946705 caches full_text_html (30546 chars) carrying all four distinct snippets exactly, so no evidence was lost or weakened. CI's PMID refresh is non-destructive (keeps the cached full_text entry when a refresh returns abstract_only), unlike the url: path that overwrites, so this is CI-stable. Updated reference_title/title from the ' - PMC' web-page suffix to the PubMed title, removed the now-orphaned url cache file, and corrected the stale references[] findings sentence that claimed the canonical PMID fetch was abstract-only. validate-disorders passes (0 issues, 190 titles). Requested by maintainer @caufieldjh.

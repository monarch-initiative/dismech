  summary: Address ADCA independent review of care and trial records
  details: |
    Addressed both requested changes in the independent review: bound speech-language and nutritional care to specific NCIT terms, and moved the dated FDA troriluzole regulatory assessment into an investigational small-molecule treatment with a validated specific drug binding. Added registry-verified trial phase metadata, consistent recommendation grading, subtype-specific Harding excerpts, the MONDO ADCA-II mapping rationale, all six polyglutamine genes and a contextual Aomori prevalence excerpt that retains the published denominator discrepancy. Added an occupational-therapy compensatory target; did not infer a molecular effect from cognitive support or add therapeutic edges to monitoring and counseling. This append-only follow-up links the review to PR 12456.

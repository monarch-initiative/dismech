  summary: Add Xiphophorus Gordon-Kosswig-Anders backcross hybrid melanoma model
  details: |
    Added the Xiphophorus platyfish/swordtail backcross hybrid as a fourth animal model, linked via modeled_mechanisms to the 'Sustained MEK-ERK Signaling' node as PARTIALLY_RECAPITULATES (fidelity MODERATE). Rationale: the Xmrk oncogene is a constitutively active EGFR paralogue whose dominant downstream arm is Ras/Raf/MAPK, so the model reproduces the MEK-ERK node while entering the cascade upstream of RAF; Schartl & Lu (PMID:38299666) record that this system identified RTK/Ras/Raf/MAPK as the critical melanoma driver about a decade before human confirmation. Limitations recorded explicitly: no BRAF codon-600 mutation is present, so the model cannot report on RAF-inhibitor binding, paradoxical RAF activation, or codon-600 allele biology, and Xmrk additionally engages STAT5 and PI3K-AKT branches. Two readouts added (MAPK as dominant Xmrk effector; oncogene expression versus tumour malignancy grade). Evidence from PMID:2797166 (Wittbrodt et al. 1989, Nature) and PMID:38299666. All snippets verified as exact substrings of the local reference cache. An initial description sentence asserting an unsourced '25% of backcross progeny' figure was replaced with the Mendelian segregation statement actually supported by PMID:38299666. Validation: linkml-validate clean, term validation passed, duplicate-key and entity-ref checks clean, snippet audit reported no failures, and the folded-hyphen, snippet-length, title-snippet and snippet-grading baseline gates reported no new defects.

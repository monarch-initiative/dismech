  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled two missing reference_title values on inline PMID:33256089 evidence items and corrected four existing reference_title values on the same PMID that mislabeled it as Molecular Mechanisms of Melanoma Pathogenesis and Progression when the authoritative PubMed cache title is Overcoming Immune Evasion in Melanoma. Re-verified all evidence snippets as exact substrings of their cached sources via validate-references. Pulled full text where available and mined it for additional well-supported findings: added a direct-support evidence item from PMID:39961465 to the BRAF V600 Oncogenic Mutation node establishing the constitutively active kinase domain that signals independently of extracellular stimuli; added two evidence items to the previously unsupported Acquired MAPK Reactivation and Bypass Resistance node, namely PMID:23569304 human serial-biopsy evidence for MAPK reactivation with secondary NRAS and MEK1 mutations and PMID:24610826 for the oxidative phosphorylation metabolic-adaptation arm. Kept only this diseases own reference caches and reverted the repo-wide reference_id requoting churn.

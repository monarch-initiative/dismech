  summary: 'Respond to review: name Jp163A as the classical-cross parent line'
  details: |
    Follow-up to the ai4c-reviewer approval on PR 9714, suggestion 3. The Xiphophorus animal model's background read 'X. maculatus (Jp 163 A/B) x X. hellerii', which is looser than the source supports. PMID:38299666 states that three of the alternative hybrid melanoma models use the Jp163B spotted-side (Sp) strain 'instead of the Jp163A spotted-dorsal (Sd) strain', establishing Jp163A as the parent line of the classical Gordon-Kosswig-Anders cross and Jp163B as the line used by the separate UVB-inducible models. Background now names Jp163A (Sd) explicitly and records what Jp163B is actually used for, so the YAML no longer contradicts the survey report's own stock-line table. Also tightened species from the genus-plus-parenthetical 'Xiphophorus (platyfish-swordtail hybrid)' to the actual cross, 'Xiphophorus maculatus x Xiphophorus hellerii'. No evidence items were added or changed. Validation after the edit: linkml-validate clean, term validation passed, duplicate-key and entity-ref checks clean, snippet audit reported no failures, and the folded-hyphen, snippet-length, title-snippet and snippet-grading baseline gates reported no new defects.

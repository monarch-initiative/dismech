  summary: Bind LOINC codes for BRAF V600 genotyping and VE1 IHC (tranche F batch
    1)
  details: |
    LOINC tranche F batch 1. This entry's diagnosis section carries two genuinely different tests with different allele specificity: the molecular genotyping row says to 'identify the exact tumor BRAF allele' (not V600E-specific, since class-II/III non-V600 alleles must be distinguished), while the VE1 immunohistochemistry row is explicitly V600E-only by antibody design and is marked COMPLEMENTARY to, not a substitute for, molecular testing. Bound LOINC:97025-1 (BRAF gene V600 mutations [Identifier] in Tissue by Molecular genetics method Nominal), codon-600-generic, on the genotyping row; LOINC:85299-6 (BRAF V600E mutant protein [Presence] in Cancer specimen by Immune stain), the VE1 antibody's own LOINC identity, on the IHC row. Both codes newly seeded. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

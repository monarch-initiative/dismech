  summary: 'Re-review follow-up: source the Jp163B/UVB-model claim to PMID:21143485'
  details: |
    Follow-up to the ai4c-reviewer re-review of f9b1107. The reviewer noted that the background clause 'the sibling Jp163B spotted-side (Sp) line is the Tu-carrying parent of the separate UVB-inducible models' went one inferential step beyond PMID:38299666, which says three of the alternative hybrid models use Jp163B but does not itself join that to the UVB-inducible models. The observation is correct about that source. The claim is nonetheless supported, by a different cached reference: PMID:21143485 names 'the primary Xiphophorus UVR melanoma model, Sp-couchianus' and states its mating scheme as 'F1 (X. couchianus x X. maculatus 163B) hybrid females bred to X. couchianus males'. Rather than softening and losing the information, the background now tracks PMID:38299666 exactly for the three-alternative-models fact, then names Sp-couchianus specifically as the primary UVB-inducible model with an inline PMID:21143485 attribution, so a reader can see which source carries which half. background is free text and not snippet-validated, so the inline PMID is an attribution aid rather than a validated citation. No evidence items were added or changed. Validation: linkml-validate clean, term validation passed, entity-ref and duplicate-key checks clean, snippet audit 109/109 verified, and the snippet-grading, folded-hyphen and environmental-evidence gates reported no new defects.

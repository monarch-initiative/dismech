  summary: Re-review BRAF V600-mutant melanoma scope, graph, and treatment evidence
  details: |
    Replaced the noisy auto-import with a bounded molecular-subtype record centered on somatic class-I BRAF V600 signaling, oncogene-induced melanocytic growth arrest, PTEN/PI3K cooperation, metastatic progression, immune context, and heterogeneous acquired resistance. Distinguished V600E/K registration evidence from the thinner rare-V600 evidence base and added evidence-backed epidemiology, environmental context, histopathology, phenotypes, molecular diagnosis, differential diagnoses, progression, systemic treatments, six current trial records, three animal models, one experimental model, the TCGA-SKCM dataset, and four explicit knowledge gaps. Curated an exact 30-source bibliography supporting 102 evidence items, fully connected all three phenotypes and four causal genetic entries, and documented the single generated-cache overlap with draft PR #6849.

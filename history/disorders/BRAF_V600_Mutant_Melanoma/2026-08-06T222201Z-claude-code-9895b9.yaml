  summary: Link intermittent ultraviolet context as a predisposing factor
  details: |
    Backfill for issue #8085. Deliberately PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES rather than TRIGGERS. Intermittent sun exposure is associated with this tumour type by odds ratio, but this entry's own evidence notes that BRAF V600E arises in anatomically sun-shielded naevi, so ultraviolet light is a risk context rather than the mutational cause, and the mutation does not carry a UV signature. Recording it as TRIGGERS would contradict evidence already present in the entry. Validated with linkml-validate and just validate-terms; integrity issue count unchanged.

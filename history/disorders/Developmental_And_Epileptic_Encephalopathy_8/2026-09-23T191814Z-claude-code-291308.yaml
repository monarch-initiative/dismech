  summary: 'Review round 1: Developmental_And_Epileptic_Encephalopathy_8'
  details: |
    Addressed review 5294618223 on PR 12591. (1) glycinergic_hyperekplexia hypothesis: replaced the PMID:15215304 abstract sentence (GABA-A only) with the full-text sentence naming the expected glycine receptor trafficking deficit; kept IN_VITRO. (2) Added a diagnosis section: chromosomal microarray first line (NCIT:C198497 Array-based Comparative Genomic Hybridization) and gene panel or exome second tier (NCIT:C15709 Genetic Testing), both quoting the PMID:28589176 recommendation, plus Electroencephalography (NCIT:C38054) with existing EEG snippets. NCIT CURIEs and labels were read from cache/ncit/terms.csv and confirmed in the TreatmentActionTerm enum cache and by runoak ols:ncit where OLS responded. (3) Moved the clonazepam REFUTE item off Antiseizure medication into a new Clonazepam treatment (CHEBI:3756 from cache/chebi/terms.csv) targeting HP:0002267. (4) Added evidence (PMID:35638461) to the Network Hyperexcitability to Epileptic encephalopathy edge. Also added phenotypes reported at over 10% in the 18-patient series (fifth-finger clinodactyly, pectus excavatum, fetal finger and toe pads, each 2 of 18); pigmentation abnormalities (2 of 18) left out as too nonspecific to bind. Ran just backfill-reference-titles (6 titles added, ORPHA and CGGV items) and just tag-references (no GeneReviews chapter to tag). No recurrence-risk figure is stated in the entry, so none was added.

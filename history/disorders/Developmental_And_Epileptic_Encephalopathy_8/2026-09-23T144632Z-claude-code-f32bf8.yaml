  details: |
    New entry for DEE8 (MONDO:0010375), ARHGEF9/collybistin. Lump call: the whole ARHGEF9 spectrum (hyperekplexia-epilepsy, DEE, ID with milder epilepsy, ID without epilepsy from PH-domain missense alleles) is curated under the single MONDO term, reasoning in notes. Deep research: falcon was requested with --fallback; falcon returned HTTP 402 (account out of credits) and openscientist produced the report (research/Developmental_And_Epileptic_Encephalopathy_8-deep-research-openscientist.md). Report reference validation: 16/16 resolved, 14/14 quotes found, 0 off topic; needs_review true only from term-label mismatches that are table-column parse artifacts. preflight-dr: PASS. The report's claim that affected females consistently show skewed X-inactivation was not adopted; three primary reports (PMIDs 33600053, 32939676, 30048823) describe random blood X-inactivation. Its gnomAD constraint and ClinVar count figures were not used (no citable source checked). Structured sources: ClinGen CGGV assertion (Definitive, against MONDO:0100148) and ORPHA:163985 cached via the structured-source CLI. GeneReviews: check-genereviews --online reports NO_CHAPTER. Mouse data (constitutive knockout, G55A knock-in, Gabra2-1) recorded as MODEL_ORGANISM; the glycinergic explanation for hyperekplexia is recorded as an ALTERNATIVE hypothesis with SUPPORT and REFUTE evidence plus a HUMAN_MODEL_MISMATCH discussion. Validated with just validate, count-verified-snippets, validate-terms, the offline gates listed in the PR, and validate-disorders.

  summary: 'Gene-family review: GRHPR'
  details: |
    GRHPR modelling re-reviewed and found correct: the trigger node binds glyoxylate reductase (NADPH) activity (GO:0030267) and hydroxypyruvate reductase [NAD(P)H] activity (GO:0016618), both decreased, matching the paired urinary oxalate and L-glycerate excess. The GRHPR genetic record gains a record-level autosomal recessive inheritance block (GeneReviews PMID:20301742) and evidence from the OxalEurope registry cohort of 101 genetically confirmed PH2 patients, which added 18 novel GRHPR variants and found renal outcome uncorrelated with genotype (PMID:31685312). The ClinGen gene-validity export of 2026-11-22 still has no GRHPR assertion, so gene_disease_validity stays absent.

  summary: Review Usher Syndrome evidence, mechanisms, diagnosis, and trials
  details: |
    Re-reviewed the full Usher Syndrome entry against cached GeneReviews, primary literature, and current ClinicalTrials.gov records. Separated auditory hair-bundle and retinal periciliary mechanisms, removed unsupported cross-tissue and delayed-walking causal claims, attached evidence to all eight retained causal edges, narrowed phenotype and gene prose to what cited snippets support, and removed the misleading single prevalence band for a range spanning two bands. Added evidence-backed clinical and molecular diagnosis, communication/low-vision support, surveillance and risk-reduction management, two current interventional trials, and a primary zebrafish PDZD7 interaction model. Updated ultevursen from the historical Sirius framing to the Phase 2b LUNA registry record. Validation passed for schema, ontology terms, graph integrity, cache-backed references, and 62/62 exact snippets; three pre-existing EGA fetch warnings remain because the validator has no EGA source adapter.

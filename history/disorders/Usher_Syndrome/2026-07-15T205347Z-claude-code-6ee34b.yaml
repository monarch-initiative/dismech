  summary: Add ultevursen (QR-421a) USH2A exon-13-skipping ASO treatment
  details: |
    Closes the USH2A/Usher-syndrome-type-2 gap in the ASO-therapy intersection with issue #4008 that was previously identified (see the issue #4008 comment thread cross-referencing issue #3341). Audited the 4 ASO-retinopathy intersections flagged there: RHO/QR-1123 already had a full aso_details treatment block in RHO-Related_Retinopathy.yaml; CEP290/sepofarsen already had a full aso_details treatment block in Leber_Congenital_Amaurosis_10.yaml; ABCA4/Stargardt preclinical-only, no action needed. USH2A/ultevursen (QR-421a) was the only one still missing a structured ASO treatment block -- Usher_Syndrome.yaml already existed and modeled USH2A, but its treatments section only had a generic 'Gene Therapy' entry vaguely mentioning ASOs. Added a proper Ultevursen (QR-421a) treatment entry: therapeutic_modality ANTISENSE_OLIGONUCLEOTIDE, aso_details (SPLICE_MODULATION_EXON_SKIPPING, USH2A hgnc:12601, target_exon exon 13, TWO_PRIME_O_METHOXYETHYL chemistry), target_mechanisms linking to the existing 'Photoreceptor Connecting Cilium Dysfunction' pathophysiology node, and evidence from the landmark preclinical paper (PMID:33895329, zebrafish + iPSC-photoreceptor-precursor proof of concept establishing USH2A exon 13 as the site of the two most common pathogenic variants) plus the Sirius Phase 2 clinical trial registry record (clinicaltrials:NCT05158296) confirming clinical-stage development and intravitreal route. Independently verified 'ultevursen' as the real INN for QR-421a via web search (AdisInsight, MedChemExpress, and the ClinicalTrials.gov study title itself) before use, since the ASO INN stem convention (-ersen) made the name worth double-checking. Did not add a conforms_to declaration to the antisense_oligonucleotide_therapy module, for consistency with the sibling RHO and LCA10 entries, which also have full ASO treatment blocks but no conforms_to yet -- that backfill (mentioned as a follow-up in the original issue #4008 ASO comment) is a separate, not-yet-started effort across the whole KB. Schema, term, reference, and causal-graph validation all pass.

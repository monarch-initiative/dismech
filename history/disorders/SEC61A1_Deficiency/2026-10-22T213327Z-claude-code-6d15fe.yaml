  summary: 'Review round 1: SCN11 subtype binding, evidence-less edges removed'
  details: |
    Addressed review 5621001241 on PR 15265 and the failing check_gene_activity_grounding CI gate. Renamed the neutropenia subtype to SCN11 and bound it to MONDO:0958017 'neutropenia, severe congenital, 11, autosomal dominant' (label read from OLS), removing the claim that MONDO had no term; subtype foreign keys updated. Removed five causal edges that carried no evidence: translocation defect to cleft palate, intrauterine growth retardation, seizure and microcephaly, and kidney injury to postnatal growth retardation, plus the kidney injury to hypomagnesemia edge, which rested on the same single case; those phenotypes are now left unconnected because no source states a mechanism. Added a translocation defect to ER stress edge citing PMID:28782633 and PMID:32325141. Removed the direct renin-node edges to hyperkalemia and hypotension, keeping the route through decreased aldosterone, and moved the hypotension evidence onto that sequela. Bound GO:0008320 transmembrane protein transporter activity (DECREASED) on the variant node, the UniProt P61619 molecular function annotation, to satisfy check_gene_activity_grounding. Kept therapeutic_modality PROTEIN_REPLACEMENT for filgrastim because the enum defines it as recombinant protein therapy, and kept the PMID_21499241 cache because the committed research report cites it.

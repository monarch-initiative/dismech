  summary: 'Create: SEC61A1_Deficiency'
  details: |
    New entry for SEC61A1 deficiency (MONDO:0100337). Lump/split decision: one Disease with three has_subtypes (ADTKD-SEC61A1 bound to MONDO:0014891, CVID15 bound to MONDO:0958013, and SEC61A1-related severe congenital neutropenia with no MONDO term), following ClinGen's Antibody Deficiencies GCEP lumping of these presentations into one autosomal dominant entity (Moderate). The polycystic liver disease family (p.Arg236Cys) is a phenotype, not a subtype. Pathograph: heterozygous variants lead to defective cotranslational translocation and increased ER calcium leak, then ER stress and terminal UPR, which branch to impaired plasma cell differentiation and granulocytic maturation arrest; translocation also feeds impaired renin biosynthesis and the tubulointerstitial and glomerulocystic kidney injury. All 29 phenotypes are causally connected. Deep research: one OpenScientist report (research/SEC61A1_Deficiency-deep-research-openscientist.md), 14/14 references resolved, one off-topic reference (PMID:21499241, a bacterial SecYEG structure) not used; just preflight-dr PASS. Literature found independently via PubMed and the ClinGen CGGV record. HP:0002850 is bound with the cached label 'Decreased circulating total IgM' because the committed HP cache predates HPO's relabel to 'Decreased circulating IgM concentration'. Validation: just validate passed (102/102 snippets), validate-terms, check-entity-refs, check-causal-targets, check-gene-validity, check-snippet-grading and the other offline gates passed.

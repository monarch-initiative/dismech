  summary: 'Review fixes: Lipoprotein Glomerulopathy evidence'
  details: |
    Removed a PMID:42417997 evidence item on Glucocorticoids (ineffective) whose quote records discontinuation of prednisolone rather than a failed response; the remaining REFUTE item quoting 'Immunosuppressive therapy is ineffective' carries the claim. Regraded the PMID:31874799 review quote on the proteotoxic disease mechanistic classification from HUMAN_CLINICAL to IN_VITRO, since it summarises biophysical destabilisation and aggregation studies, and added the primary PMID:30309894 in vitro result as a second item. Added a PMID:31874799 quote naming apoE2 homozygote glomerulopathy to the APOE molecular genetic testing row and reworded its description to call it another apoE-related glomerular disorder rather than a histologic mimic.

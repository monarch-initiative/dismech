  summary: 'Create: Lipoprotein Glomerulopathy'
  details: |
    New entry for lipoprotein glomerulopathy (MONDO:0012725), APOE. Pathograph: APOE variants near the LDL-receptor-binding region -> thermodynamic destabilisation and aggregation of variant apoE -> aberrant unstable apoE-rich lipoprotein particles -> glomerular lipoprotein thrombi in dilated capillaries -> glomerular injury and progressive kidney damage -> renal phenotypes; lipid phenotypes hang off the lipoprotein node. Inheritance recorded as autosomal dominant plus incomplete penetrance, with a homozygous infantile case noted. Treatments: fibrates (fenofibrate, bezafibrate, pemafibrate), RAAS blockade, statins, kidney transplantation (recurs in graft), and glucocorticoids recorded with REFUTE evidence. Two adenoviral Apoe-deficient mouse models (Sendai, Kyoto). One OpenScientist deep-research report: built-in validation completed, 33/33 references resolved and 24/24 quotes valid; preflight-dr PASS. The report's NCIT drug suggestions (fenofibrate, losartan, HMG-CoA reductase inhibitor) resolve to unrelated concepts and were not used; agents bound to CHEBI. No GeneReviews chapter exists. Validated with just validate-disorders and the offline CI gates.

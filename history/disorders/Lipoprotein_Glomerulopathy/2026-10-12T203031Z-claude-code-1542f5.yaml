  summary: 'Review round 1: Lipoprotein Glomerulopathy'
  details: |
    Addressed the first automated review and the failing CI gate on PR 13967. CI failed check-gene-activity-grounding because APOE landed on a node with no molecular function; bound GO:0050750 low-density lipoprotein particle receptor binding (modifier ABNORMAL) on the APOE variant node, citing PMID:24570178 that most LPG variants sit in the receptor-binding domain; ABNORMAL rather than DECREASED because reduced binding has not been measured for every variant. Replaced the APOE Kyoto mouse aim-statement snippet with two result sentences from PMID:33663537. Split the barrier-injury/progression node into Glomerular Filtration Barrier Injury (proteinuria, nephrotic syndrome, haematuria, oedema) and Progressive Loss of Kidney Function (CKD, hypertension, anaemia, enlarged kidneys), with an edge between them citing PMID:32441489. Added quote_role REVIEW_SYNTHESIS to PMID:16431249, PMID:24149835 and PMID:24570178 items, edge evidence on the fibrate target_mechanisms link, and a numbering note (mature versus precursor) in the APOE notes and the Kyoto mouse genotype. Backfilled reference_title on all evidence items.

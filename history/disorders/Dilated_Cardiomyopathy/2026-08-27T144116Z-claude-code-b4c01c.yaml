  summary: 'Add experimental_models NAM record: iPSC cardiomyocyte model'
  details: |
    Recorded the patient-specific TNNT2 R173W iPSC-derived cardiomyocyte model (PMID:22517884, Sun/Wu Stanford) as a structured experimental_models entry. Two links: Sarcomeric and Cytoskeletal Dysfunction (PARTIALLY_RECAPITULATES, carrying the authors' own 'to some extent' qualifier through to the relationship value) with three readouts - INCREASED punctate alpha-actinin, DECREASED contractility, and a RESTORED readout for the beta-blocker/SERCA2a rescue arm; and Neurohormonal Activation (PERTURBS, LOW fidelity) for the beta-adrenergic agonist stress experiment. The LOW fidelity is deliberate: an acute pharmacological stimulus on isolated cardiomyocytes reproduces the receptor-level consequence of sympathetic drive but not neurohormonal activation as a disease process, with no RAAS, no natriuretic counter-regulation and no feedback loop. Limitations also record cardiomyocyte immaturity and the single-family, single-allele cohort. Schema, term, entity-ref, duplicate-key and snippet gates all pass.

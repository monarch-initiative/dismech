  summary: 'Post-review cleanup: drop coined namo_type, split two-direction readout,
    record directness'
  details: |
    Follow-up to PR #9665, addressing three of the reviewer's non-blocking observations plus one consequence of the #10003 schema migration. (1) namo_type: the record carried namo:InducedPluripotentStemCellDerivedModel, which I coined. Checked against the NAMO schema (monarch-initiative/namo, 56 classes): namo:Organoid, namo:OrganOnChip, namo:TwoDCellCulture, namo:CoCulture and namo:CellLineModel all exist, but there is no iPSC-derived class, and the namo:CellularSystem parent is abstract so it cannot be bound either. namo:CellLineModel is scoped to immortalized lines and namo:ThreeDCellCulture would misdescribe cardiomyocytes assayed as dissociated cells and clusters, so per the no-term-beats-a-bad-one rule the slot is now absent, with experimental_model_type: IPSC_DERIVED_MODEL carrying the distinction and notes recording the reasoning. Nothing validates namo_type, which is why the coined CURIE passed every gate. (2) The beta-adrenergic readout carried direction: DECREASED over a sentence reporting both decreases (beating rate, contraction) and an increase (cells with abnormal alpha-actinin); split into two readouts since direction is single-valued. (3) The #10003 migration converted this record's two supports: PARTIAL gradings to plain SUPPORT with no directness, losing the nuance PARTIAL carried; assessed and recorded directness: DIRECT on the sarcomeric link (the quote asserts partial recapitulation itself) and INDIRECT on the neurohormonal link (an acute receptor-level pharmacology result, from which the neurohormonal-axis claim follows by an inference step).

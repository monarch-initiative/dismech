  summary: 'Genetics pass: wire the gene panel to mechanism nodes; add C10orf71, CAP2,
    PPCS, EMD'
  details: |
    Genetics pass for issue #12233 (d2g series-026), Dilated_Cardiomyopathy half.

    Ruling on granularity. The numbered CMD/DCM loci named in the gap list sit two
    MONDO levels below MONDO:0005021, under familial dilated cardiomyopathy or
    familial isolated dilated cardiomyopathy, and this knowledge base already
    curates that level as 32 standalone Disease entries with 13 more queued in
    stubs/. They were therefore not added as has_subtypes rows on the umbrella.
    What belongs on the umbrella is the gene panel, with each gene wired to the
    mechanism step it acts at.

    Content added. Four gene records with no prior binding on this entry:
    C10orf71, CAP2, PPCS and EMD. Four pathophysiology nodes grouping genes by the
    step they act at: cardiomyocyte calcium handling and electrical instability
    (JPH2, RYR2, SCN5A, ABCC9, TNNI3K); cardiomyocyte proteostasis failure (BAG5,
    FBXO32, GET3, PLEKHM2, RPL3L); cardiac transcriptional and developmental
    program dysregulation (TBX20, PRDM16, GATAD1, MIB1); and coenzyme A
    biosynthesis deficiency (PPCS). Gene reach into the pathograph moved from 33 of
    48 causal genes to 51 of 52.

    Genes dispositioned rather than added. CSRP3: the committed ClinGen cache
    carries a single CSRP3 assertion, Definitive for hypertrophic cardiomyopathy,
    and the 2008 linkage study states the earlier dilated association lacked
    comprehensive genetic evidence for causation, so the gene stays bound on
    Hypertrophic_Cardiomyopathy. RAF1: Definitive for Noonan syndrome, and the
    dilated concept MONDO names has its own entry, Dilated_Cardiomyopathy_1NN.
    CTF1: left listed and unwired because two recorded PubMed searches returned no
    source tying a CTF1 variant to a specific myocardial mechanism.

    Review of the inherited draft. Two prose claims were corrected against their
    sources: the ClinGen snapshot date was given as 2026-01-24 where
    data/clingen/MANIFEST.yaml pins 2026-08-13 (2025-01-24 is the assertion date),
    and the CTF1 note has been rewritten to state both search strings verbatim so
    the negative claim is re-runnable. The LMNA-Related Dilated Cardiomyopathy
    GeneReviews chapter was mentioned in notes but not tagged, which
    check-genereviews reported as CITED_UNTAGGED; it is now tagged in references
    with the note explaining why it is not this umbrella's baseline chapter.

    Review round 1. The node originally added as "Cardiomyocyte Calcium
    Handling and Electrical Instability" bundled two mechanisms and was split
    into Cardiomyocyte Calcium Release Dysregulation (JPH2, RYR2, bound to
    GO:0010880 with modifier DYSREGULATED, feeding systolic dysfunction) and
    Cardiomyocyte Excitability and Conduction Instability (SCN5A, ABCC9,
    TNNI3K, bound to GO:0086001, feeding arrhythmia and systolic dysfunction),
    with each downstream edge given evidence for the genes on its own node. The
    old node's cardiac muscle contraction DECREASED binding was dropped: the
    RyR2 quote reports increased fractional calcium release and a lowered
    termination threshold, not a measured reduction in contraction. GO:0042254
    ribosome biogenesis was added to the proteostasis node for RPL3L, with a
    second evidence item quoting the paper's finding that the variants
    destabilize RPL3L binding to the 60S subunit, and GO:0007219 Notch
    signaling pathway was added to the transcriptional node for MIB1, which the
    node's existing MIB1 evidence already states. A GO term for GET3 was
    declined: the only match, GO:0071816, is specific to the ER membrane, and
    the ASNA1 paper cited on the node says only "post-translational membrane
    insertion of tail-anchored proteins" without naming the compartment.

    Validation. just validate, validate-terms, count-verified-snippets (129
    snippets), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches (offline and against live HGNC), and
    validate-disorders under linkml-reference-validator 0.3.0rc1 all pass. Four
    cited caches are full_text_html and are refused as stale by that version; every
    snippet taken from them sits in the abstract, so all verify against the
    abstract fallback.

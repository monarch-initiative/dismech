  summary: 'Review round 1: consume Table 1 and the human marrow findings'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (0 critical, 8 important, 4 suggestions). Same root cause as the four sibling PRs: the two richest caches committed by this PR were its two least-used.

    1. Added human bone-marrow megakaryocyte findings from PMID:39225097 to the proplatelet-formation node, which previously rested on mouse data alone, and narrowed BOTH discussions that overstated the absence. The HUMAN_MODEL_MISMATCH rationale and the sibling thc11_gof_causes_a_deficit rationale each claimed the mechanism has not been shown in human megakaryocytes; marrow biopsy and smear in a variant carrier show maturation defects, granular hypoplasia and rare hypolobed megakaryocytes. What is genuinely unobserved is narrower - proplatelet formation itself has never been measured in a human megakaryocyte carrying a hotspot variant. Recorded that hypolobation is a maturation phenotype and so mildly favours a maturation lesion rather than the formation lesion the node asserts.

    2. Added twelve phenotypes from the PMID:35451551 Table 1 per-patient rows, each quoting its own row: lymphopenia and leucopenia (3/3), abnormal brain imaging (3/3), anemia, frequent infections, hypotonia, congenital heart defect, renal hypoplasia/agenesis, short stature, dental abnormality, brachydactyly, feeding difficulties (all 2/3). Lymphopenia was the most consequential omission - it is 3/3 and the immunodeficiency node depends on it.

    3. Added romiplostim and platelet transfusion as treatments. Romiplostim is curated with a REFUTE evidence item recording the documented non-response, which is informative rather than absent evidence: a TPO-receptor agonist drives megakaryocyte production, so failure is consistent with a defect downstream of that signal.

    5. Added a biochemical section with platelet RAP1B protein level (35% decrease, recovering after HSCT) and platelet ultrastructure (round rather than discoid). The RAP1B measurement is the strongest human molecular evidence in the entry and the transplant reversal ties the treatment block to the pathograph. Noted that it sits awkwardly beside the gain-of-function characterisation - less protein, more signalling.

    6. Added a Disproportionate Bleeding Tendency phenotype as a downstream target of the integrin node, which previously reached only the immunodeficiency phenotype. This connects the two halves of the pathograph.

    7. Cited PMID:30315159 as a new ACTB-related differential rather than dropping the cache; it overlaps this entity on developmental disability, microcephaly and thrombocytopenia.

    8. Corrected the microcephaly REFUTE to SUPPORT. Table 1 scores postnatal microcephaly 2/3, and the third patient's cell reads 'History of microcephaly earlier in life, but OFC not available. No microcephaly currently' - resolved and unmeasured, not a documented normal. The previous curation quoted that patient's current head circumference and read it as refuting the association, which overstated the source.

    Not done, and left for follow-up: no diagnosis section (finding 4), onset_category on the postnatal features, the aortopathy attribution caveat, the OMIM 620654 mapping, and a conforms_to pass. All additive rather than corrective.

    Validator behaviour encountered twice: inline bracketed content such as [BMI 34.2 kg/m 2 ] and a parenthesised p-value are normalized out of cached text, so a snippet spanning one cannot match. Quoted bracket-free spans and recorded why in the explanations.

    Gates: validate, validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 19/19 to 39/39 verified.

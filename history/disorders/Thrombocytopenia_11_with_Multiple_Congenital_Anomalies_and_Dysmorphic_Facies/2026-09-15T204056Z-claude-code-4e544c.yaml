  summary: 'Create: Thrombocytopenia 11 with Multiple Congenital Anomalies and Dysmorphic
    Facies (MONDO:0958000)'
  details: |
    De novo curation of RAP1B-related syndromic thrombocytopenia (THC11). Nothing in kb/ previously mentioned RAP1B.

    The mechanistic call the entry has to make is how a gain-of-function variant in an integrin-activating switch yields a platelet deficit rather than a hyperactive phenotype. PMID:39225097 establishes the direction experimentally for all three recurrent variants (G12V, G12E, G60R): increased RAP1B activation, talin recruitment and integrin activation. The resolution curated is that RAP1 signalling is separately required for megakaryocyte proplatelet formation (PMID:30131434), so a constitutively active switch disturbs production. That half rests on a mouse megakaryocyte double knockout and is carried with a HUMAN_MODEL_MISMATCH discussion plus a proposed iPSC-megakaryocyte experiment, because the mouse lesion is null rather than activating, homozygous rather than monoallelic, and covers both isoforms.

    The same mouse paper is curated as a REFUTE item on that node: Rap1b-null mice have a normal platelet count. It does not contradict the human disease, whose lesion is activating, but it does contradict reading the mouse as a model of the node.

    A second REFUTE item sits on the microcephaly phenotype, quoting the third patient's normal head circumference, because microcephaly is reported in two of three individually described patients and is not universal.

    molecular_functions on the first node is GTPase activity DECREASED while genetic_context is GAIN_OF_FUNCTION. These are consistent: losing hydrolysis is what makes the switch constitutive. GO:0007264 (small GTPase-mediated signal transduction) was tried first and correctly rejected by the MolecularFunctionTerm dynamic enum, since it is a biological process rather than a molecular function.

    No prevalence record and no HPO frequency bands: the whole published series is five or six people.

    RAP1B's separate Kabuki-like loss-of-function association (PMID:26280580) is deliberately kept out of this entity and carried as a differential diagnosis.

    The Perplexity report preflights WARN because it cites OMIM 179530 where MONDO:0958000 xrefs 620654. 179530 is the RAP1B gene MIM and 620654 the phenotype MIM, so this is a gene-versus-phenotype confusion rather than a wrong disease; identity was checked manually against the primary reports. The same preflight reports a rival gene 'HP' at 16 mentions, which is the HPO CURIE prefix being counted as the haptoglobin gene symbol.

    Validation: 19 snippets verified; schema, term, duplicate-key, entity-ref, causal-target and qualifier-term gates pass.

  summary: 'Review round 2: repair notes prose that rotted when microcephaly flipped'
  details: |
    One important finding in round 2, and it is the same defect class that hit #11885 in its round 2 and that I had written a warning about in #11889 the same night.

    The notes block said microcephaly is 'carried as a REFUTE evidence item quoting the third patient's normal head circumference'. I flipped that item to SUPPORT in round 1 and left the paragraph describing the old state. The reviewer also caught the subtler half: the following paragraph says 'Two REFUTE items appear' and the count is still coincidentally 2, because romiplostim became the second one - so the sentence reads as correct while describing the wrong pair. Rewrote both paragraphs to describe the current state, and added the explanation the romiplostim grading deserves: a REFUTE against an intervention's efficacy rather than against a mechanism is unusual, and the reason to curate a documented non-response rather than bury it in a description is that a failed TPO-receptor agonist is mechanistically informative here. Recorded the correction itself rather than silently overwriting it.

    Suggestion 1 taken: added the missing explanation to the PMID:30131434 REFUTE item, which was the one item of 45 without one and the one whose grading is least self-evident.

    Suggestion 2 taken: the top-level description said the proplatelet half of the mechanism 'rests on a mouse megakaryocyte double knockout, not on human megakaryocytes'. That predated the human marrow findings added in round 1 and read harder than the discussion it summarises. It now distinguishes what is unobserved (proplatelet formation in a human megakaryocyte carrying a hotspot variant) from what is observed (an abnormal human megakaryocyte compartment), and notes that the observed findings are maturation phenotypes that point upstream of the step the resolution names.

    Not done, both still optional: onset_category on the postnatal features, and the conforms_to pass.

    Gates: validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-snippet-grading all pass. Snippets 45/45.

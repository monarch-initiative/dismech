  summary: Add direct human SOREMP evidence to the REM-dissociation node
  details: |
    Applies an optional suggestion from the approving review of PR #9434, which noted that the human evidence on the REM-dissociation node was a step removed from what the node models. Adds PMID:29069490, a direct polysomnographic measurement (sleep-onset REM periods in 95% of narcolepsy-with-cataplexy patients against 1-9% in Parkinson disease and sleep-disordered-breathing comparators), together with a PARTIAL item recording that 52% of insufficient-sleep-syndrome patients also meet the criterion - so the readout is characteristic without being specific, which is why the orexin module places its conformance bar at the trigger rather than at this readout.

  summary: 'Bind LOINC: CSF orexin-A; declined interpretation_bands'
  details: |
    Added loinc_term LOINC:91670-0 (Orexin-A [Mass/volume] in Cerebral spinal fluid) to the existing CSF Orexin/Hypocretin-1 marker, plus a new evidence item from PMID:12374492 (Mignot et al. 2002, already cited elsewhere in this entry) quoting the diagnostic (<110 pg/mL) and normal (>200 pg/mL) CSF hypocretin-1 thresholds established by signal-detection analysis. No interpretation_bands were added: the schema's interpretation-band convention is a half-open interval with an inclusive lower bound and an exclusive upper bound, and the cited criterion states a strict 'below'/'above' inequality at each boundary for a continuous immunoassay value, so the exact boundary value sits on the side the convention would exclude rather than include, in opposite directions for the diagnostic and normal tiers. A notes: sentence on the marker records this. Checked the Narcolepsy-Cataplexy_Syndrome entry separately (not edited): its own description identifies it as narcolepsy type 1, and it is not cross-referenced to Narcolepsy's own Narcolepsy Type 1 has_subtypes row or mondo_mappings, which looks like an unresolved lump/split duplication rather than a distinct disease needing its own LOINC binding. LOINC:91670-0 was newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

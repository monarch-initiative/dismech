  summary: Add human evidence to the two new pathophysiology nodes (review follow-up)
  details: |
    Addresses finding 3 of the ai4c-reviewer review of PR #9434: the Sleep-Wake State Instability and Dissociated Intrusion of REM Sleep Components nodes rested exclusively on model-organism evidence despite being the entry's rate-limiting and defining human nodes. Adds HUMAN_CLINICAL evidence to each from the postmortem orexin neuron count (PMID:11055430) and the CSF hypocretin-1 diagnostic series (PMID:12374492), including a PARTIAL item recording that the sleep-onset-REM readout is not universally present even in hypocretin-deficient patients.

  summary: Cite 3 evidence-free environmental exposures, issue 8296 tranche 4
  details: |
    Attached verified evidence to the three previously uncited environmental exposures.

    H1N1 Infection: PMID:21866560, a retrospective Beijing series of 629 patients in which
    pandemic vaccination was rare -- only 8 of 142 patients recalled being vaccinated. Chosen
    deliberately so that the infection exposure is evidenced independently of the vaccine
    exposure curated on the next entry.

    Pandemrix Vaccine: PMID:29855798 for the risk magnitude, paired with PMID:26379011 as
    PARTIAL. The second is a critical appraisal by epidemiologists of the same observational
    studies the first summarises. It is cited on purpose: a vaccine-safety claim curated
    one-sidedly would be worse than one left uncited, and the note now says the magnitude
    comes from studies whose methodological limitations are themselves documented.

    Streptococcal Infection: PMID:19725248, whose conclusion hedges to "probably a significant
    environmental trigger", matching the note's "possible trigger in some cases" rather than
    overstating it.

    Notes were extended to state what the cited studies actually establish.


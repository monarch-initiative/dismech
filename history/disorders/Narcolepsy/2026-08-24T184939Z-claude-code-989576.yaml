  summary: 'Review: Narcolepsy (sleep-disorders sweep)'
  details: |
    Review as part of a sleep-disorders sweep. The entry had two pathophysiology nodes and no causal edges. Added roles and edges, and added the two missing downstream nodes the disorder turns on - Sleep-Wake State Instability and Dissociated Intrusion of REM Sleep Components - so the entry now explains why patients are both sleepy by day and poor sleepers by night. Wired to orexin_arousal_instability, with the orexin-deficiency trigger scoped by the subtype foreign key to Narcolepsy Type 1, since CSF hypocretin-1 is normal or intermediate in most Type 2 patients. Corrected two evidence snippets that had dropped the leading 'Narcolepsy Type I (' from the quoted sentence.

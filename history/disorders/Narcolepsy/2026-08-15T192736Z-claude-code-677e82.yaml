  summary: 'Review response: disclose the manufacturer affiliation behind the PMID:26379011
    counterweight, issue 8296 tranche 4'
  details: |
    Review on PR 8558 flagged that the Pandemrix counterweight citation was
    described neutrally as epidemiologists reviewing the same signal, when the
    authors are manufacturer-affiliated.

    Checked the author affiliations at the source, since the cached record carries
    none. Confirmed: Cohet, Bauchau and Shinde are at GSK Vaccines, Dos Santos is a
    GSK Vaccines contractor, Ferreira holds a dual affiliation including GSK
    Vaccines, and Verstraeten and Bollaerts are at P95, a pharmacovigilance
    consultancy. GSK is the manufacturer of Pandemrix. The explanation now says so
    rather than letting the critique read as independent scrutiny.

    The citation is kept. Its methodological points stand on their own merits and
    PARTIAL remains the right classification; the fix is disclosure, not removal.

    The explanation also now records that the two cited sources genuinely disagree.
    PMID:29855798 concedes in the same abstract that confounding and diagnostic bias
    may influence some studies, but judges it unlikely they explain the increased
    incidence across every country where Pandemrix was used. Previously the entry
    presented an unresolved dispute as a settled caveat. The dispute is now recorded
    rather than resolved in either direction.

    Only the note and one explanation changed. No snippet, reference, supports or
    evidence_source value was altered.

    Revalidated: just validate, just count-verified-snippets.

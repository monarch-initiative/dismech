  summary: 'Address review findings on PR #9381'
  details: |
    Addressing the ai4c-reviewer REQUEST_CHANGES review on PR #9381. See the per-entry detail in the commit message; the substantive item for this tranche was finding 3, the GeneReviews check.

    Finding 3 was not a formality. A dedicated GeneReviews chapter for HSAN2 exists (PMID:21089229) and had been missed, even though MONDO cross-references that exact PMID on MONDO:0019941 - it was in a record read at the very start of this work and not followed up. Mining it produced three substantive changes beyond the citation itself: a fourth causative gene (SCN9A), two missing phenotypes (osteomyelitis, painless fractures), and a correction to a distribution claim the entry had asserted.

    The correction matters most. The entry claimed the sensory deficit was 'universal rather than distally graded'. GeneReviews states it is predominantly distal with the lower limbs more severely affected, and PMID:21820098 - already cited in the entry - describes 'severe distal sensory loss'. The claim was wrong. It had also been load-bearing: a prior revision used it to justify declining conformance to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination. The conformance is still declined but the argument is rebuilt on the primary lesion, DRG cell-body loss versus dying-back axonopathy, and notes now records that a curator who reads the distal gradient as decisive could reasonably disagree.

    For CHN the same check found no chapter: congenital hypomyelinating neuropathy[TI] GeneReviews[TI], CNTNAP1 AND GeneReviews[Book] and Dejerine-Sottas AND GeneReviews[Book] all return zero, the CMT1/CMT2/CMT4 chapters are RETIRED, and Hypomyelination and Congenital Cataract is a different CNS disease. That negative result is recorded in notes so the check is not repeated.

    Validation: schema clean, term validation clean, snippets verified against cached references, offline gates clean.

  summary: 'Create: Hereditary Sensory and Autonomic Neuropathy Type 2'
  details: |
    New entry for HSAN2, MONDO:0019941, curating stubs/Hereditary_Sensory_And_Autonomic_Neuropathy_Type_2.yaml and stubs/Neuropathy_Hereditary_Sensory_And_Autonomic_Type_2B.yaml, both deleted in this change. The KB held a general Hereditary_Sensory_and_Autonomic_Neuropathy entry and Congenital_Insensitivity_to_Pain (HSAN4/5) but not HSAN2.

    Chain: loss-of-function variant in a sensory neuron maintenance gene -> impaired axonal transport and Golgi homeostasis in sensory neurons -> loss of peripheral sensory neurons -> universal multimodal sensory loss and autonomic dysfunction -> painless injury and acral mutilation.

    The three genes are lumped into one entry on a mechanistic argument stated in notes, not on nosology alone: KIF1A physically binds the domain encoded by the HSN2 exon of WNK1 (yeast two-hybrid, PMID:21820098) and RETREG1/FAM134B maintains the cis-Golgi those cargoes traverse (PMID:19838196), so the three converge on the intracellular logistics of a very long sensory axon.

    The central node is curated explicitly as a NEURONOPATHY - dorsal root ganglion cell bodies lost - not a length-dependent dying-back axonopathy, which is why the sensory loss is universal and covers large and small fibres. That distinction drives the differential against HSAN4/5, where pain loss is selective and touch and vibration are preserved.

    Diagnostic note records that two of the three loci are alternatively spliced exons that transcript-based analysis may not cover, so exon coverage should be confirmed before accepting a negative result.

    Term corrections during validation: RETREG1 is hgnc:25964, not hgnc:28797 (which is TMEM184A); anhidrosis bound to HP:0000970 rather than the sweat-gland-morphology term. A gene-symbol note records that the founding paper uses the previous approved symbol PRKWNK1, which is why that string appears in a quoted snippet.

    Validation: linkml-validate clean; linkml-term-validator clean; 27/27 snippets verified against cached references.

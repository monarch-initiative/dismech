  summary: 'Genetics pass: gene wiring (#12198)'
  details: |
    Genetics pass for issue #12198 (d2g wiring-009). All three MONDO-recorded genes were present, plus
    SCN9A, which MONDO does not list for the three subtype terms but which the cited GeneReviews
    chapter names as the fourth HSAN2 gene. The gap was reach and subtype scoping only; no new
    literature was needed and no new reference was fetched.

    Added genes: descriptors to the three has_subtypes rows (HSAN2A WNK1, HSAN2B RETREG1, HSAN2C
    KIF1A), added the matching subtype: values to the three genetic records, and bound WNK1, RETREG1
    and KIF1A onto "Loss-of-Function Variant in a Sensory Neuron Maintenance Gene", the node whose
    description already enumerates exactly those three genes.

    SCN9A was deliberately excluded from that node binding and left without a subtype: value. The
    entry's own SCN9A record already explains that its arm is a channelopathy of nociceptor
    excitability rather than a defect of sensory neuron maintenance, and that this entry's
    pathophysiology chain does not model it; binding it to the maintenance node would contradict that.
    For the subtype, MONDO does carry a term for the fourth clinical subtype, MONDO:0800304
    "neuropathy, hereditary sensory and autonomic, type IId" with synonym HSAN2D, queried at OLS on
    2026-09-20 - but that record carries no causal-gene relationship and no OMIM cross-reference, only
    GARD, MedGen and UMLS ones, so binding SCN9A to it would assert a gene-subtype correspondence
    neither MONDO nor GeneReviews states. Recorded that reasoning in review_notes on the SCN9A record.

    Noted for follow-up rather than acted on: SCN9A overlaps the allelic series behind congenital
    insensitivity to pain, and kb/disorders/Congenital_Insensitivity_to_Pain.yaml was being edited
    concurrently on another branch, so it was not touched here. Validated with just validate,
    validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches,
    check-genereviews and validate-disorders.

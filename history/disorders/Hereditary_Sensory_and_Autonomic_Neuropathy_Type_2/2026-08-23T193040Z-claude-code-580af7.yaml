  summary: 'Review: remove self-contradicting module conformance'
  details: |
    Coherency and evidence review pass over the entry as created earlier in this branch.

    REMOVED the conforms_to on the central effector node. It declared conformance to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination while the same node's description states that HSAN2 is a neuronopathy in which dorsal root ganglion cell bodies are lost and specifically NOT a length-dependent dying-back axonopathy. The module node is defined by distal, length-dependent axonal degeneration, so the entry was asserting conformance to a node whose defining property it simultaneously denied. The two assertions could not both be true. A notes stanza now records the non-conformance and its reasoning, so the link is not re-added on the surface similarity of 'peripheral neuropathy'.

    Removed the FREQUENT band on Skin ulcer: the snippet lists what can complicate trauma in these patients (ulcers, mutilations, acral amputations) and establishes no proportion. Added a notes stanza explaining that bands are confined to the two sensory modalities the sources state as definitional.

    Added pathophysiology-to-phenotype edges so every phenotype is reachable from the mechanism graph, each hanging off the node that asserts it.

    Validation after the pass: linkml-validate clean; term validation clean; validate-disorders clean.

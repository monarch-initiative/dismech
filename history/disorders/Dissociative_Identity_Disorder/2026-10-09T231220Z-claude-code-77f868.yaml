  summary: Add competing etiological hypotheses and wire the self-state phenotype
  details: |
    Added three mechanistic_hypotheses: posttraumatic model (CANONICAL, the framing the entry was already built on), sociocognitive model (ALTERNATIVE), and the 2022 transtheoretical model (EMERGING). Each carries SUPPORT and REFUTE evidence quoted from PubMed abstracts: Lilienfeld 1999 and Lynn 2019/2022 for the sociocognitive side, and the Reinders/Vissia/Schlumpf/Dimitrova simulation and fantasy-proneness studies against it. Tagged the five existing edges from Posttraumatic Developmental Dissociation with the posttraumatic_model group, and added an edge to Dissociative Self-States grounded in the 2014 perfusion study (directness INDIRECT). Added a KNOWLEDGE_GAP discussion recording that the experimental tests are small and share investigators. Depersonalization and Derealization were left unwired because no source read supports a specific upstream node. Validated with just validate, validate-terms, count-verified-snippets (36/36), the offline gates, and validate-disorders. Session initiated by @kltm; content drafted by the agent.
    Review round 1 (ai4c-reviewer): PMID:32082509 reanalyses the PMID:27225185 cohort (same 17/16/16 groups, per its Methods), so two explanations and the knowledge-gap rationale were corrected to stop presenting it as an independent sample.

  summary: 'Review round: frequencies, dermatosis, joint swelling, treatments, biochemical'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review of 2026-09-09. The branch was also rebased onto main; the only conflict was cache/hgnc/terms.csv, where main's P2RX3 row and this branch's P2RX7 row were both kept.

    Findings addressed:
    1. PMID:36877799 tagged GeneReviews in references. just check-genereviews reports TAGGED=1.
    2. Osteomyelitis and Microcytic Anemia moved from OBLIGATE to VERY_FREQUENT, citing Table 2 of PMID:41113563 (CRMO 33/35, CDA 29/34) and the 91% figure in PMID:33670882. Recurrent Fever and Failure to Thrive now cite their Table 2 rows; Failure to Thrive gained FREQUENT.
    3. Neutrophilic Dermatosis added, bound to HP:0031234, OCCASIONAL (2 of 24 in PMID:33670882). It is wired from the LPIN2 lesion with an INDIRECT_UNKNOWN_INTERMEDIATES edge quoting PMID:23087183. The notes sentence saying no HPO term existed was removed, and the searches actually run are recorded instead. Description changed from "in many patients" to "in a minority of patients".
    4. Joint Swelling added (HP:0001386, VERY_FREQUENT, 19/22), wired from Sterile Multifocal Bone Inflammation.
    5. GeneReviews genetic counseling (25/50/25 sib risk) added to inheritance; drug-of-choice, dosing and the live-attenuated vaccine precaution added to IL-1 blockade; methotrexate pregnancy restriction and physical/occupational therapy added.
    6. Treatments added: Corticosteroids (with the refractory report as REFUTE), NSAIDs, Methotrexate, Bisphosphonates (pamidronate, alendronate; the osteoclast target is graded INDIRECT because the source statement is about CNO generally), Physical and Occupational Therapy. TNF blockade gained adalimumab, the partial-response case, and the 2025 review's statement that anti-TNF agents have been effective, and its description now reads as little or partial benefit.
    7. biochemical block added: CRP, ESR, IL-6, TNF-alpha, IL-17A, each with the case report's laboratory reference interval. LOINC codes were checked against the NLM clinical-tables service because LOINC has no OAK validation here.

    Suggestions taken: hotspot alleles in genetic; MRI bone marrow oedema in diagnosis; marrow cytology on the Dyserythropoiesis node; structured prevalence as CASES_IN_LITERATURE; classifications (Harrison's chapters and IUIS autoinflammatory); the three wrong HPO CURIEs in the deep-research report named in notes; the Pstpip2 cmo mouse caveat rewritten.

    Suggestion not taken: the deep-research _artifacts directory and citations sidecar. They are not present on the machine that ran this round, so there is nothing to commit.

    The IUIS classification carries no evidence item. The LPIN2 row (section 3, Non-Inflammasome Related Conditions, Table 7) exists in the committed PDF extraction of PMID:35748970, but linkml-reference-validator 0.3.0rc1 re-extracts that cache from PMC XML without its tables during just validate, and the quoted row then fails. The placement is recorded in the classification notes and the entry notes.


  summary: 'Create: Majeed Syndrome MONDO:0012316'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check, launched before writing so it ran in parallel.

    The load-bearing evidence in this entry is a therapeutic dissociation rather than a biochemical measurement. These patients have measurably elevated TNF-alpha, and TNF blockade with etanercept produced no improvement, while IL-1 blockade by two independent agents produced dramatic improvement in corticosteroid-refractory disease. A second, later case treated as juvenile idiopathic arthritis with adalimumab also improved only partially. The failed TNF treatment is therefore recorded as its own treatment entry with REFUTE evidence rather than omitted, because an elevated biomarker is not a demonstrated driver and the negative result is what makes the IL-1 response mechanistically informative.

    An apparent contradiction in the literature was resolved by reading a full sentence rather than a truncated one. A 2023 report classifies the disease as non-inflammasome, while the mechanistic work and the major review place it among the NLRP3 inflammasomopathies. The reconciliation is inside the review's own sentence, which the first draft had quoted only up to the word "critica": the macrophage and osteoclast arm controls growth-plate homeostasis in an inflammasome-independent manner. So systemic inflammation is inflammasome driven and the bone arm is not. That changed the graph: both arms now branch directly from the LPIN2 lesion and converge on bone inflammation, rather than the bone arm sitting downstream of IL-1 beta. The dissenting characterisation is kept as REFUTE evidence on the inflammasome node so a reader meeting it can find what it does and does not contradict.

    The final check battery, run after the report was folded in, caught four defects that reading had not: three snippets cut mid-word, a stranded second root, and three orphan phenotypes. One of those truncations was the sentence that resolved the inflammasome question, so extending it changed the entry's structure rather than merely tidying a quote. This is the second consecutive entry where running the battery last was decisive.

    A CURIE error in the deep-research report was caught by resolving identifiers rather than copying them. The report gave HGNC:14100 for LPIN2; that identifier does not resolve and the correct one is hgnc:14450, which the entry already used. Recorded in notes because it is the specific failure mode these reports are prone to.

    Other report contributions, each verified against the cited paper before use: an updated case count of 31 individuals from 18 families in 2023 against 24 from 10 families in 2021, with both retained because the growth explains the widening phenotype; and the overlap with juvenile idiopathic arthritis as a cause of diagnostic delay.

    A phenotype mapping compromise is recorded in notes. HPO has no term for congenital dyserythropoietic anaemia of the microcytic type; its only dyserythropoietic term is macrocytic and therefore wrong here. The phenotype binds HP:0001935 Microcytic anemia with the dyserythropoietic character carried in the description and in a dedicated pathophysiology node.

    Process. Content_type was checked on all ten caches before writing; six were full text. Validation: 46/46 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, no truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets.

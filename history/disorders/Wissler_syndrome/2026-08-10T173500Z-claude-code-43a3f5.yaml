  summary: 'Address the seven optional polish items left open by the #8180 review'
  details: |
    Follow-up to the #8180 review of Wissler syndrome, which was approved with seven optional (blue) items unaddressed. Each item was re-verified against the reference cache before editing.

    1. Truncated EULAR quote (3 sites): the snippet stopped mid-parenthetical. Extended all three to the source's complete sentence, through '...short duration glucocorticoid (GC).'. The unbalanced parenthesis is present in the published abstract of PMID:39317417 itself, so it is reproduced verbatim and each explanation now says so, to stop the dangling paren being re-flagged as a transcription slip.

    2. therapeutic_modality on the conditional IL-1 inhibition treatment: recorded as OTHER. The slot is single-valued but the treatment's agents span two platforms (anakinra, a recombinant IL-1 receptor antagonist protein; canakinumab, an anti-IL-1-beta monoclonal antibody). Neither SMALL_MOLECULE nor MONOCLONAL_ANTIBODY is accurate for the pair, and the entry models IL-1 blockade as a strategy rather than a single agent, so the treatment was not split. The platform distinction is carried in description and the modeling choice in notes.

    3. Stronger nosology quote: added the EULAR/PReS consensus statement 'sJIA and AOSD are one disease, to be designated by one name, Still's disease.' to the still_spectrum_extrapolation hypothesis. Graded PARTIAL because it establishes the Still-disease spectrum being extrapolated from but does not place Wissler syndrome inside it.

    4. evidence_source: PMID:36090971 (narrative review of monocyte/macrophage activation mechanisms, 6 citations) and PMID:39317417 (EULAR/PReS consensus recommendations, 4 citations including the new one) were all tagged HUMAN_CLINICAL. Neither publication reports primary data of any of the four typed kinds, so all ten are now OTHER. All six PMID:36090971 snippets were checked individually and every one is a mechanism statement rather than a clinical observation.

    5. Frequency consistency: removed frequency: VERY_RARE from Microscopic hematuria and Congestive heart failure. Both bands rested on the circular justification that a single case report exists, which per docs/frequency-evidence-guidelines.md does not support a population band. They now match the four other single-case findings (Arthritis, Pericardial effusion, Vasculitis in the skin, Anemia), which carry no band and a notes line. Pericarditis and Myocarditis intentionally keep OCCASIONAL: their snippet is a general-course statement ('sometimes complicated by pericardo-myocarditis'), and 'sometimes' is an explicit qualitative-term mapping to OCCASIONAL in the guidelines.

    6. Restored the historical/geographic notes block dropped by #8180, corrected against its actual source. The prior text named Germany, France and Italy and said the disease was 'not recognized' in English-language literature; PMID:27843372 (2016) supports French and German only, and says 'only a very few in English (none of them recent)'. The restored note is anchored to that 2016 report so it does not drift.

    7. APS-1 co-occurrence: PMID:2233764 was correctly removed from differential_diagnoses (it documents co-occurrence, not a diagnostic mimic) but had no home. Added a discussions entry (kind OPEN_QUESTION) asking whether the co-occurrence reflects shared autoimmune mechanism or coincidence, citing both the co-occurrence clause and the paper's nine-year follow-up without rheumatoid symptoms, plus a proposed APS-1 registry screen. Recorded as an open question rather than a comorbidity because a single case report cannot establish an association. Also added the missing classifications block (harrisons_chapter IMMUNE_RHEUMATOLOGIC), evidenced by the PMID:3092775 characterization of the syndrome as a systemic inflammatory disease.

    Validation: just validate passes (schema, terms, references); 89/89 snippets verified against cached references; all references are PMID so none were skipped by prefix.

  summary: 'Review: Wissler syndrome evidence, mechanism, and nosology'
  details: |
    Completed a source-level completeness and evidence-claim review. No matching
    deep-research artifact or GeneReviews chapter was available, so the review
    used the cached Wissler-Fanconi case literature, historical abstracts, and
    clearly separated AOSD reviews and recommendations.

    Replaced the unsupported assertion that Wissler syndrome is established as
    an autoinflammatory Still-spectrum disorder with two explicit alternative
    nosologic hypotheses: conditional Still-spectrum extrapolation and a
    distinct historical syndrome of unknown origin. Simplified the causal graph,
    labeled AOSD-derived monocyte/macrophage and NLRP3-IL-1/IL-18 mechanisms as
    HYPOTHETICAL, supplied evidence on every retained causal edge, separated
    pericardial from myocardial inflammation, and represented ESR, CRP,
    ferritin, and neutrophilia as readouts rather than causal descendants.

    Added qualitative rare prevalence, exclusionary diagnosis, ferritin testing,
    an expanded evidence-backed differential, explicit nosology controversy,
    and prospective validation experiments. Frequency statements now follow the
    qualitative mapping: the four "typical" defining features are VERY_FREQUENT,
    "sometimes" reported pericardo-myocarditis is OCCASIONAL, and isolated case
    complications are frequency-omitted or VERY_RARE. Removed anti-TNF therapy,
    which the cited patient received for rheumatoid arthritis after
    reclassification, and removed autoimmune polyendocrine syndrome type 1 as a
    differential because the source described co-occurrence instead.

    At review time, all 83 evidence snippets verified strictly against the
    sanctioned reference cache and weighted completeness compliance was 97.2%.
    The batched disorder validator and all-history validator passed. The target
    causal graph contained 30 nodes and 20 edges with no integrity issues; the
    repository-wide graph check continued to report 73 unrelated baseline
    disorders and did not report Wissler syndrome.

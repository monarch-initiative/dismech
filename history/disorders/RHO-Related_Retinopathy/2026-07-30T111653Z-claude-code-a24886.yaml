  details: |
    Review follow-up on PR #6963. (1) The CSNBAD1 subtype description asserted 'without retinal degeneration' while PMID:33669941 — newly cited elsewhere in the same file — reports 53.3% of p.G90D carriers developing classic RP. Added a qualifying clause to the description AND a cited PARTIAL evidence item quoting the paper's caution against diagnosing CSNB in p.G90D without long follow-up, rather than leaving the caveat as uncited prose or parking it in review_notes. Note: Subtype has no 'notes' slot (only review_notes) — a reviewer suggestion to use one was schema-invalid and linkml-validate caught it. (2) Refined the PMID:33669941 night-blindness explanation to state which denominator the VERY_FREQUENT band rests on (3/3 within the CSNBAD1 scope; the quoted sentence covers all 15 p.G90D carriers). (3) Refined the PMID:9888392 explanation to record that the paper's constitutive-transducin-activation mechanism comes from computer modelling, not observation, so the HUMAN_CLINICAL grade attaches to the segregation finding only. Validation: linkml-validate clean; term validator passed; 136 snippets across the six edited entries re-verified as exact whitespace-normalized substrings of references_cache with zero mismatches; reference validator control-tested live (corrupting one snippet yields 'Text part not found as substring' and Total checks: 1, versus Total checks: 0 on a clean run — the count reports only failures, which is recorded in the report).

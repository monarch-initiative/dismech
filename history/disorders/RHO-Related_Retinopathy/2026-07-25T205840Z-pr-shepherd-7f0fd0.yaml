  details: |
    PR #6963 re-review follow-up (ai4c-reviewer item A on commit 9a3333dc). The Riggs-type electroretinogram phenotype (CSNBAD1) rested on two evidence items, neither of which sourced the disease-level step for RHO: PMID:30051303 is a GNAT1 family report establishing only the class-level ERG dichotomy, and the companion PMID:38743626 item quoted a generic definitional sentence about CSNB - the 'generic definitional snippet doing disease-specific work' anti-pattern this PR's own report names for this file. The same cached abstract already contained the RHO-specific bridging sentence, so swapped the PMID:38743626 snippet to 'One well-studied rhodopsin point mutant, G90D-Rho, is thought to cause CSNB because of its constitutive activity in darkness causing rod desensitization.' and rewrote the explanation to say it now sources the RHO gain-of-function to constitutive dark activity to rod desensitization chain directly rather than by inference, leaving PMID:30051303 to carry only the class-level dichotomy it genuinely establishes. Both items can now defensibly stay at SUPPORT; no new source and no grade change was needed. Snippet verified offline as an exact whitespace-normalised substring of references_cache/PMID_38743626.md. linkml-validate passes.

  summary: 'Review: correct CSNBAD1 ERG waveform (negative -> Riggs-type)'
  details: |
    Claim-evidence correctness review of 10 eye-disorder entries.

    Corrected a factual error in the CSNBAD1 electroretinogram phenotype. The node
    asserted a 'negative' ERG waveform (preserved a-wave with reduced b-wave)
    attributed to inner-retinal signal disruption. That is the Schubert-Bornschein
    pattern, which arises from photoreceptor-to-bipolar-cell TRANSMISSION defects
    (NYX, CACNA1F). Gain-of-function RHO CSNB (G90D, T94I) is a PHOTOTRANSDUCTION
    lesion -- constitutive activation desensitizes the rods themselves -- and
    therefore produces a Riggs-type ERG with loss of the rod a-wave as well as the
    b-wave. The entry contradicted the mechanism of its own upstream pathophysiology
    node ('Constitutive Rhodopsin Activation in Darkness').

    Changes: renamed the phenotype to 'Riggs-type electroretinogram'; rewrote the
    description to state the Riggs/Schubert-Bornschein dichotomy explicitly; updated
    reports_on.interpretation to localize the readout to the photoreceptor level;
    added PMID:30051303 (Marmor & Zeitz, Doc Ophthalmol 2018) as primary evidence
    with a verified snippet; re-explained the existing PMID:38743626 G90D mouse
    citation to support phototransduction-level localization rather than the
    incorrect inner-retinal attribution.

    Note that the pre-existing snippet was a correct, validator-passing quote -- the
    wrong claim lived entirely in the description and explanation fields, which no
    validator inspects.

    Validation: linkml-validate, linkml-term-validator, and
    linkml-reference-validator all pass. PMID:30051303 fetched via
    linkml-reference-validator cache reference (never hand-written).

    Not changed (reported for follow-up in the review report): reuse of a generic
    RP-definition snippet as SUPPORT for bone-spicule pigmentation, night blindness,
    and rod-cone dystrophy classification; the orphan snippet fragment at
    pathophysiology[2].downstream[1] for the 72-year acuity figure; and the ERG
    phenotype at phenotypes[5] citing a BCVA/visual-field snippet.

    Full review: docs/reports/eye-disorder-claim-evidence-review-2026-07-25.md

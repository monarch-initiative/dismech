  summary: Align RHO gene record and mechanism nodes with rhodopsin function
  details: |
    Genetic record: added relationship_type CAUSATIVE and variant_origin GERMLINE (ClinGen's Definitive RHO assertion is for the broader inherited retinal dystrophy, MONDO:0019118, so it was not copied as gene_disease_validity). Rhodopsin Misfolding and ER Stress: gene moved to genes:, the DECREASED gene modifier removed because the dominant misfolding alleles act by gain of function and/or dominant-negative interference rather than loss of activity, and a germline genetic_context added describing that; no molecular function bound because the node's claim is about folding and trafficking, not photoreceptor activity. Constitutive Rhodopsin Activation in Darkness: gene moved to genes:, genetic_context added (germline, heterozygous, GAIN_OF_FUNCTION), the GO:0008020 G protein-coupled photoreceptor activity modifier changed from INCREASED to GAIN_OF_FUNCTION because the cited evidence describes activity in darkness outside normal light control, and the process refined from GO:0016056 to its descendant GO:0141190 transducin-mediated opsin signaling pathway, matching the reviewed core function. Validated with just validate, validate-terms, count-verified-snippets (42/42), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments, check-enum-values and list-gene-term-mismatches.

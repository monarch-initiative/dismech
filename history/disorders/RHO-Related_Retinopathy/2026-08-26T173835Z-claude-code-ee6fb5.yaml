  summary: 'Migrate ASO/siRNA treatment detail to oligonucleotide_details: RHO-Related_Retinopathy'
  details: |
    Migrated this entry's ASO treatment blocks to the generalized oligonucleotide_details slot, part of the schema change that merged the ASO-only detail class with siRNA. Keys renamed in place: aso_details -> oligonucleotide_details, aso_mechanism -> oligonucleotide_mechanism, aso_chemistry -> oligonucleotide_chemistry. No values changed; no claims added or removed. Also added delivery_platform, derived mechanically from the conjugation value already present (UNCONJUGATED -> UNFORMULATED, any ligand -> CONJUGATE). That rule is sound for antisense oligonucleotides specifically because no approved ASO is delivered in a nanoparticle; it must not be reused for siRNA, where an unconjugated drug may still be lipid-nanoparticle formulated. Validated with just validate.

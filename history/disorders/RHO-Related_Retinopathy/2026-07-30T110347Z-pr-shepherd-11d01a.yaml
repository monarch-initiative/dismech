  summary: Source CSNBAD1 branch with human RHO evidence; regrade generic CSNB snippet
  details: |
    PR shepherd run addressing ai4c-reviewer findings on PR #6963.

    IMPORTANT 1 (human-phenotype evidence discipline): the CSNBAD1 branch previously rested on
    PMID:38743626, a G90D knock-in mouse study, for two human phenotypes. Fetched PMID:33669941
    (Kobal et al. 2021, Int J Mol Sci; full_text_xml) via `just fetch-reference` and added two
    HUMAN_CLINICAL evidence items to the Riggs-type electroretinogram phenotype: the paper states
    directly that RHO-related CSNB is of the Riggs type with loss of rod-specific ERG activity, a
    reduced dark-adapted a-wave and a low b-wave with largely preserved cone responses, and that all
    three of its CSNB patients showed those features (3/3, which also sources the VERY_FREQUENT band).
    Added a HUMAN_CLINICAL item to the Congenital night blindness phenotype quoting that all patients
    had lifelong non-worsening night vision problems (15/15, sourcing that VERY_FREQUENT band). Also
    fetched PMID:9888392 (al-Jandal et al. 1999) and attached it to the CSNBAD1 subtype as the human
    genetic source for the T94I half of the subtype description.

    IMPORTANT 2 (generic-snippet anti-pattern): regraded the PMID:38743626 item on Congenital night
    blindness from SUPPORT to PARTIAL. Its snippet is a class-level definitional statement about CSNB
    in general, the same sentence removed from the sibling Riggs node earlier in this PR for exactly
    that reason. The RHO-specific human step is now carried by PMID:33669941.

    Added a notes caveat recording that the largest p.G90D cohort to date classified only 20% as CSNB
    with 53.3% developing classic RP, and cautioned against diagnosing CSNB in p.G90D carriers without
    long follow-up. Softened the phenotype description accordingly. The subtype-level description was
    left as the nosological definition of CSNBAD1.

    Validation: just validate, just validate-references and just validate-terms all pass. The
    reference validator was control-tested by deliberately corrupting the new PMID:33669941 snippet,
    which produced the expected "Text part not found as substring" ERROR, confirming the pass is not a
    silent no-op. Reference caches were created with just fetch-reference, never hand-written, and
    just check-reference-cache-frontmatter passes.

    Not changed: the docs/reports Tier 2 narrative still describes these items as open. Syncing that
    prose is outside the shepherd curation-file scope and is flagged on the PR for the author.

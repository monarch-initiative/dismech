  summary: Review and enrich Proliferative Vitreoretinopathy evidence grading, fibrotic
    cascade, diagnosis, and methotrexate RCT
  details: |
    Audited all snippets, reference titles, and evidence_source/quote_role grades (reclassifying review and consensus papers PMID:26562474, PMID:30585928, PMID:1867299 to OTHER with REVIEW_SYNTHESIS and tagging background quotes). Added NEUROLOGIC classification, expanded pathophysiology to five fibrotic_response-conforming nodes incorporating human PVR membrane single-cell imaging mass cytometry and bulk RNA-seq (PMID:35579905, GEO:GSE179603) while retaining CL:0002586 retinal pigment epithelial cell on RPE Epithelial-Mesenchymal Transition, wired all five phenotypes including Visual impairment (HP:0000505), enriched diagnosis with Retinal Examination and Optical Coherence Tomography, and added Adjuvant Intraocular Methotrexate (CHEBI:44185) supported by the 2024 multicenter Grade C PVR randomized trial (PMID:39572739).

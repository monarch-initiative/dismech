  summary: 'Create: Proliferative Vitreoretinopathy'
  details: |
    Curated new dismech entry for Proliferative Vitreoretinopathy (MONDO:0700115), the next acquired/mechanistic retinopathy from issue #4008 worklist. Modeled the pathophysiology cascade: retinal break -> RPE dispersion -> RPE epithelial-mesenchymal transition -> contractile fibrocellular membrane formation -> tractional redetachment, with the EMT node declaring conforms_to fibrotic_response#Mesenchymal Cell Activation. Cited 11 PMIDs (fetched via just fetch-reference, snippets verified against cached abstracts/full text): PMID:12101449 and PMID:26562474 for RPE dispersion/EMT mechanism; PMID:2708527 and PMID:10067974 for TGF-beta2/cytokine-driven membrane formation; PMID:1867299 and PMID:40311677 for Retina Society clinical staging and OCT correlation; PMID:30585928 for surgery-only treatment; PMID:11425671, PMID:15582080, PMID:35680097 for adjuvant 5-FU/LMWH evidence, which is intentionally mixed (early single-center prevention trial SUPPORT vs established-PVR and larger multicenter PRIVENT trials REFUTE, reflecting real controversy in the literature). Verified MONDO:0700115 and all CL/HP/GO/UBERON/MAXO/NCIT/CHEBI terms via OAK before use; added MONDO:0700115 and new HP/UBERON terms to enum caches via scripts/refresh_disease_enum_cache.py. Full just validate passes.

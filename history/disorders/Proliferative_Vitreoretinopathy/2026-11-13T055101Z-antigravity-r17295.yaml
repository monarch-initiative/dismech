  summary: Source Grade A vitreous haze to PMID:27429798, move HGF/CTGF stromal evidence
    to cytokine amplification node, reclassify surgical-cohort prevalence, and trim
    methotrexate design snippets
  details: |
    Fetched PMID:27429798 (Di Lauro et al., 2016) reproducing the updated 1991 Retina Society Grade A criterion (vitreous haze, pigment clumps, and pigment clusters on inferior retina) to support both the Vitreous haze causal edge (alongside PMID:39572739 RPE dispersion evidence) and the Vitreous haze phenotype, replacing the non-specific PMID:1867299 abstract quote. Moved the PMID:12101449 stromal HGF/CTGF immunohistochemical evidence from Retinal Break and RPE Cell Dispersion into Vitreous to Intraocular Cytokine and Macrophage Amplification. Reclassified surgical-cohort postoperative ~10% occurrence from population POINT_PREVALENCE (rate_per_100000: 10000) to PERIOD_PREVALENCE without a population rate, and removed study-design/dosing and duplicate secondary-outcome items from Adjuvant Intraocular Methotrexate treatment-level evidence.

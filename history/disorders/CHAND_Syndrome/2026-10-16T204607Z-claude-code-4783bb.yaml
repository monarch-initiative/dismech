  summary: 'Create: CHAND_Syndrome'
  details: |
    New entry for CHAND syndrome (MONDO:0008959), autosomal recessive ectodermal dysplasia caused by biallelic RIPK4 variants (hgnc:496). Curated inheritance (1979 revision from dominant to recessive; segregation of homozygous p.Glu284Lys), the RIPK4 causal record with the shared p.Glu284Lys variant, a five-node pathograph (RIPK4 kinase signaling deficiency, p63-RIPK4-IRF6 differentiation signaling, keratinocyte differentiation defect, periderm defect with epithelial fusion, hair follicle and appendage dysplasia) wired to ankyloblepharon, curly hair, sparse hair and nail dysplasia, an absent orofacial cleft as a diagnostic negative, diagnosis, surgical separation of ankyloblepharon, the Ripk4 knockout mouse, and a KNOWLEDGE_GAP discussion on whether CHAND is distinct from the RIPK4 Bartsocas-Papas spectrum. Decision: Bartsocas-Papas syndrome 1 (MONDO:0009901) was not added as a has_subtypes row, because MONDO/OMIM/Orphanet keep it distinct, it carries mechanisms not true of CHAND (pterygia, synechiae, limb and genital malformation, lethality), and nesting it under the milder disease would invert the relationship; the allelic relationship is recorded in notes and the discussion, and its stub is left for separate curation. One openscientist deep-research report was run and used as leads; 23/23 references resolved and 12/12 quotes matched. Two report errors were not carried over: it gives RIPK4 as HGNC:3772 (RIPK4 is HGNC:496), and it states that the severe BPS fetus in PMID:28940926 carried p.Glu284Lys, which the abstract does not say. just preflight-dr was not run because it requires the local MONDO build. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with just validate-disorders (37 snippets verified, terms pass), entity-ref, causal-target, duplicate-key, coarse-phenotype, snippet and gene-term checks.

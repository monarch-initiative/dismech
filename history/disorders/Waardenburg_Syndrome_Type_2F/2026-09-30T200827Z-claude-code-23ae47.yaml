  summary: 'Create: Waardenburg Syndrome Type 2F'
  details: |
    New entry for MONDO:0030983 (WS2F, OMIM:619947, KITLG hgnc:6343), plus a member row for it in kb/groupings/Neural_Crest_Melanocyte_Deficiency_Disorders.yaml (description, rationale and notes updated to mention the KITLG axis). The stub stubs/Waardenburg_Syndrome_IIa_2F.yaml was deleted; entry_type decided as DISEASE and the existing slug kept.

    Scope: the HPO annotation for OMIM:619947 records autosomal recessive inheritance (sources PMID:28504826 and PMID:35543077), so the entry is built on the Vona et al. 2022 biallelic case series (six homozygous individuals) and treats heterozygous KITLG isolated hearing loss (MONDO:0014738, still a stub) and gain-of-function familial progressive hyperpigmentation (MONDO:0007771) as allelic differentials. The one heterozygous WS2 family of Zazo Seco et al. 2015 (p.Leu104Val) is recorded as a second, single-family autosomal dominant inheritance block. The MONDO label in the skeleton (Waardenburg syndrome, IIa 2F) was corrected to the current OLS label, Waardenburg syndrome 2F.

    Deep research: OpenScientist (research/Waardenburg_Syndrome_Type_2F-deep-research-openscientist.md). Reference validation 14/14 resolved, 0 unresolved, 0 off topic; term validation needs_review only for a label paraphrase of HP:0000407 and an unresolvable ORPHA prefix. The report describes WS2F as autosomal dominant heterozygous KITLG loss of function and does not cite the biallelic case series; it conflates WS2F with the heterozygous hearing-loss phenotype. The entry follows the HPO/MONDO definition instead. From the report the entry uses PMID:26522471 and PMID:41450428 (cochlear implantation outcomes); its other citations are Waardenburg-general or about common pigmentation variation and were not needed. just preflight-dr returned WARN: KITLG 65 mentions, OMIM 619947 matching MONDO, with KIT at 43% of KITLG. KIT is the KITLG receptor and the report's KIT passages concern that receptor, not a second disease, so the warning does not indicate Named Entity Confusion.

    Ogawa et al. 2017 (PMID:28504826) has no abstract; a forced refetch returned no quotable text, so it is not cited as evidence. Mechanism nodes conform to all four neural_crest_melanocyte_deficiency nodes; the cochlear chain rests on steel (Sl/Sld) and Kit mouse evidence, cited with quote_role BACKGROUND where quoted from the discussion of a human genetics paper, and on Xiao et al. 2026 (PMID:41584853, named in the claim issue's triage comment), a CRISPR heterozygous Kitlg frameshift mouse. That study adds MODEL_ORGANISM evidence for reduced KIT phosphorylation and MITF (molecular node), reduced strial melanin with intermediate cells present but abnormal, normal cochlear structure and a proposed FXYD6 contribution (strial node), and unilateral or asymmetric hearing loss (edge to the unilateral phenotype); it is also a second animal model. Because it finds intermediate cells present, it is cited as REFUTE on the melanoblast-colonization to strial edge and as SUPPORT on a new direct edge from the KITLG node to the strial node (impaired maturation); the notes record that the Sl/Sld and heterozygous Kitlg models disagree on this and that the model is heterozygous while WS2F is recessive. just check-genereviews: NO_CHAPTER for GeneReviews; the StatPearls chapter is tagged. Validation: validate, validate-terms, count-verified-snippets (61/61), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms (and -online), check-coarse-phenotypes, check-snippet-length, check-folded-hyphens, check-environmental-evidence, validate-grouping, check-groupings and validate-disorders all pass. check-title-snippets, check-snippet-grading and model-scale-audit --strict pass (the first two had earlier failed with ENOSPC while the container disk was full; re-run after space was freed). The cached copies of PMID:35543077 and PMID:38391765 were refreshed to full text by the reference fetcher; snippets in the other entries that cite them still verify.

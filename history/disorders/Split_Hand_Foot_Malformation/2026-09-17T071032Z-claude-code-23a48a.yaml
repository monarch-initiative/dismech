  summary: Wire subtype genes (TP63, DLX5, DLX6, DYNC1I1, WNT10B, BHLHA9, BTRC, FBXW4,
    SOX3) into the pathograph
  details: |
    Wired the per-locus subtype genes into the pathograph. Added genes: descriptors (TP63, DLX5, DLX6, DYNC1I1, WNT10B, BHLHA9, BTRC, FBXW4, SOX3, PRDM1, HOXD13) to the two mechanism nodes, each supported by an evidence item on the same node: the convergent gene list (PMID:30101460) already present, plus newly added items for DYNC1I1 as the DLX5/DLX6 limb-enhancer host (PMID:24459211), the SHFM3 10q24 ectopic-AER mechanism covering BTRC/FBXW4 (PMID:36928426), PRDM1 in limb development (PMID:37083955), and HOXD-cluster haploinsufficiency for HOXD13 (PMID:22140379). DLX1 and DLX2 are deliberately left unwired and a review_notes on the SHFM5 subtype records why: this entry's own evidence excludes them as the cause of the limb phenotype. Flagged by just subtype-usage-audit. Validated with linkml-validate, linkml-term-validator, reference_snippet_audit (all new snippets verified against references_cache), check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets and check-qualifier-terms.

  details: |
    # Evidence review: Hirschsprung_Disease.yaml

    ## Stats
    75 evidence items checked (all snippet-bearing `reference:` blocks); 69 distinct cached references read (all PMID); 75/75 snippets verified against cache after edits (`just count-verified-snippets`); ~52 items verified clean with no change; 17 items edited; 8 additional observations reported only.

    ## Findings
    1. has_subtypes / Short-Segment HD (PMID:22985835) — snippet was the vague fragment "Moreover, it reviews current outcomes to find consensus on management.", which says nothing about short-segment anatomy; explanation claimed subtype content the quote lacked. Severity: DEFECT. ACTION fixed: replaced with exact quote "differences between TCA and the more frequently encountered rectosigmoid (or short-segment) expression" from the same cache, and rewrote explanation.
    2. prevalence / General Population (PMID:25066220) — graded REFUTE against the deprecated free-text `percentage: 0.0001-0.001`, but the quote (1.09 per 10,000 births) exactly matches the structured record it now sits on (rate_per_100000: 10.9, BAND_1_5_PER_10000), so REFUTE misdescribed the record. Severity: DEFECT. ACTION fixed: supports → SUPPORT; explanation rewritten to connect the quote to the structured rate while preserving the note that the legacy percentage range is inconsistent if read as a percent.
    3. progression / Onset (PMID:4060039) — snippet is a one-sentence review scope statement with no onset content; graded SUPPORT; the cache abstract contains nothing about neonatal onset. Severity: DEFECT. ACTION fixed: supports → NO_EVIDENCE; explanation corrected. (Cache has no better quotable passage.)
    4. progression / Onset (PMID:25066220) — "congenital gut motility disorder" quote supports neonatal onset only indirectly (as the original explanation itself conceded); SUPPORT overstated. Severity: MINOR. ACTION fixed: supports → PARTIAL.
    5. pathophysiology / Disrupted ENS Development (PMID:20610192) — snippet began with the author email artifact "simon.kenny@liv.ac.uk " scraped from the cache. Severity: MINOR. ACTION fixed: trimmed to the clean exact substring; claim support unchanged.
    6. phenotypes / Chronic Constipation (PMID:37403154) — quoted sentence was about aganglionic segment length and surgical treatment, not constipation. Severity: DEFECT. ACTION fixed: replaced with the exact conclusion sentence linking chronic childhood constipation to Hirschsprung disease from the same cache; explanation rewritten.
    7. phenotypes / Abdominal Distension (PMID:23001136) — quote states HSCR causes intestinal obstruction; it never mentions distension (snippet supported the neighboring Intestinal Obstruction claim). Severity: MINOR. ACTION fixed: supports → PARTIAL; explanation now states the inferential step.
    8. phenotypes / Failure to Thrive #1 (PMID:35690467) — quote about parental counseling contains nothing on growth; PARTIAL grade and explanation ("implies potential issues with growth") were overreach. Severity: DEFECT. ACTION fixed: supports → NO_EVIDENCE; explanation corrected. Cache abstract has no growth content to substitute.
    9. phenotypes / Enterocolitis (PMID:30602191) — snippet ("There is no standardized definition for HAEC...") was about scoring methodology, not enterocolitis occurrence. Severity: MINOR. ACTION fixed: replaced with the exact cohort statistic "21/93 (22.6%) patients with Hirschsprung's disease presented 50 HAEC episodes" from the same cache, which also supports frequency OCCASIONAL; explanation rewritten.
    10. phenotypes / Failure to Thrive #2 (PMID:21253751) — quote concerns mortality/severity correlates, no growth or nutrition content. Severity: DEFECT. ACTION fixed: supports PARTIAL → NO_EVIDENCE; explanation corrected.
    11. diagnosis / Anorectal Manometry (PMID:11329578) — cited study is on internal anal sphincter achalasia with Hirschsprung explicitly excluded by biopsy; SUPPORT overstated for an HD diagnostic claim. Severity: MINOR. ACTION fixed: supports → PARTIAL; explanation now names the condition mismatch while noting the shared manometric principle.
    12. diagnosis / Anorectal Manometry (PMID:7845407) — Named Entity Confusion: paper and quote are about Parkinson's disease anorectal function ("impaired squeeze response ... in Parkinson's disease"); irrelevant to HD RAIR testing yet graded SUPPORT. Severity: DEFECT. ACTION fixed: supports → NO_EVIDENCE; explanation corrected. Reference arguably should be removed entirely — left in place per conservative policy for a curator to decide.
    13. diagnosis / Anorectal Manometry (PMID:6666366) — snippet was the "theoretical alternative" methods sentence; the same abstract contains a direct result (sphincter relaxations recorded in all controls but only two patients). Severity: MINOR. ACTION fixed: replaced snippet with that exact result sentence; explanation rewritten; SUPPORT retained.
    14. genetic / SOX10 (PMID:9425902) — Dom mouse-model study; `evidence_source` was absent, defaulting to HUMAN_CLINICAL. Severity: DEFECT. ACTION fixed: added `evidence_source: MODEL_ORGANISM`.
    15. treatments / Surgical Resection (PMID:35343667) — quote describes per-rectal endoscopic myotomy, which opens rather than removes the aganglionic segment; SUPPORT for "removal of the aganglionic segment" overstated. Severity: MINOR. ACTION fixed: supports → PARTIAL; explanation corrected.
    16. treatments / Ostomy (PMID:29607805) — quote reports colorectal-cancer stoma statistics; nothing about HD. Severity: DEFECT. ACTION fixed: supports → NO_EVIDENCE; explanation corrected.
    17. treatments / Ostomy (PMID:29722891) — quote is about fecal diversion in refractory IBD (Crohn's), not HD; supports the temporary-vs-permanent concept only. Severity: MINOR. ACTION fixed: supports → PARTIAL; explanation corrected.
    18. has_subtypes / Long-Segment HD (PMID:22985835) — the quoted TCA definition describes total colonic aganglionosis, which this file models as a separate subtype; evidence arguably attached to the neighboring claim. TCA is the extreme of the long-segment spectrum, so SUPPORT is defensible. Severity: NOTE. ACTION reported only: judgment call; second reference (PMID:1514906) directly supports the claim.
    19. phenotypes — two distinct "Failure to Thrive" phenotype entries (category Systemic, FREQUENT) duplicate the same HP:0001508 concept with different descriptions. Severity: MINOR. ACTION reported only: merging entries is restructuring, outside the conservative fix policy.
    20. pathophysiology / Failure of Enteric Ganglion Cell Migration (PMID:8660047) — quote advances the "abnormal microenvironment" hypothesis (normal NCCs confronting a hostile colon environment), a nuance in tension with intrinsic "defective migration"; the explanation already flags this. SUPPORT vs PARTIAL is a judgment call. Severity: NOTE. ACTION reported only.
    21. genetic / GDNF (PMID:8852660 and PMID:36564622) — two references graded NO_EVIDENCE whose quotes concern EDNRB and KIF26A respectively; the grades are honest, but the references contribute nothing to the GDNF claim and could be removed by a curator. Severity: NOTE. ACTION reported only (removal is beyond minimal-fix policy).
    22. phenotypes / Enterocolitis (PMID:30594740) — Gfra1 hypomorphic mouse paper with no `evidence_source` (defaults HUMAN_CLINICAL); the quoted sentence, however, reports human background epidemiology ("The leading cause of mortality in HSCR is HAEC"), so the default is defensible under the judge-by-quoted-sentence rule. Severity: NOTE. ACTION reported only.
    23. treatments / Surgical Resection (PMID:20301612) — GeneReviews chapter (retired) cited with default HUMAN_CLINICAL; OTHER (expert consensus resource) may classify it better. Severity: NOTE. ACTION reported only; not clearly wrong.
    24. phenotypes / Developmental Delay (PMID:35975334, PMID:35690460) — both PARTIAL grades rest on undernutrition/malnutrition quotes that support the causal premise in the claim description but never mention developmental delay; PARTIAL is defensible, borderline NO_EVIDENCE. Severity: NOTE. ACTION reported only.
    25. Most evidence items in this file omit `evidence_source` (defaulting to HUMAN_CLINICAL); besides item 14, the remaining defaults checked were acceptable for the quoted content. Severity: NOTE. ACTION reported only.

    ## Sections reviewed
    has_subtypes, prevalence, progression, pathophysiology, phenotypes, diagnosis, inheritance, genetic, environmental, treatments, references, datasets

    ## Verdict
    Snippet fidelity is mechanically excellent (75/75 exact substrings), but a substantial minority of items paired verbatim quotes with claims they do not support: off-topic references (Parkinson's manometry, colorectal-cancer and Crohn's ostomy papers), vague scope-sentence snippets, and several optimistic SUPPORT/PARTIAL grades. After 17 minimal fixes (regrades, exact-quote replacements from the same caches, one evidence_source correction), the core pathophysiology, subtype, genetic, and treatment evidence is solid and well-sourced; residual issues are structural (duplicate FTT phenotype, NO_EVIDENCE placeholders under GDNF) and flagged for curator follow-up.

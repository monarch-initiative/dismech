  summary: Bind the anorectal manometry study code
  details: |
    LOINC Diagnostics tranche G, batch 28, the closing batch. Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the five changed files reported 0 issues across 793 titles; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:98859-2 (anorectal manometry study) to the anorectal manometry row. It is the only anorectal manometry record in either source, one in the release table and one in the KG, which holds no Part for it. LOINC codes this as a study whose result is a report rather than as a pressure value, which fits what the row reports: presence or absence of the rectoanal inhibitory reflex is a finding, not a number. No reference range was added, there being no threshold on a continuous quantity here and no anorectal pressure measurement in the release to key one to.

  summary: 'Create: Microvillus Inclusion Disease'
  details: |
    New entry for the flagship gap in the KB's congenital diarrhea and enteropathy (CODE) coverage.

    MONDO:0009635, causal gene MYO5B (hgnc:7603) confirmed against the MONDO RO:0004003 relationship before curation. Note the OAK label search for MYO5B returns the pseudogene MYO5BP1 (hgnc:38495) first; the correct id was confirmed by direct lookup.

    Four-node intestinal chain plus a separate hepatic arm: MYO5B loss and failure of apical recycling-endosome traffic (trigger) -> brush-border loss and intracellular microvillus inclusion formation (central_effector) -> loss of apical absorptive and ion-transport capacity (effector) -> intractable secretory diarrhea and lifelong intestinal failure (consequence). The MYO5B canalicular/PFIC10 cholestasis arm is curated as a parallel effector because the same motor organises apical traffic in the hepatocyte.

    Deliberately does NOT conform to diet_induced_osmotic_diarrhea: MVID has villous atrophy and feeding-independent diarrhea, whereas that module requires a normal villus-to-crypt ratio and substrate-dependent remission. The notes record this and the reasoning for not yet factoring an apical-trafficking module (only one curated conformer exists).

    Evidence honesty: the hepatic arm and the cholestasis phenotype are curated at lower depth and carry explicit notes saying no snippet-verified primary reference for the hepatic phenotype is cited yet, and warning against citing the MVID gene-discovery paper for it. The cohort liver-fibrosis figure (20/22) is attributed to parenteral nutrition and deliberately not used as evidence for the MYO5B cholestasis phenotype.

    Validation: linkml-validate clean (after removing functional_impact_category/zygosity, which belong to GeneticContext not Genetic); linkml-term-validator clean; 18/18 snippets verified against cached abstracts.

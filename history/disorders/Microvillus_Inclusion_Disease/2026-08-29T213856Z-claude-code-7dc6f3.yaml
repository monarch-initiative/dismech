    # Evidence review — Microvillus_Inclusion_Disease.yaml

    ## Stats
    - 21 evidence items checked (inheritance, genetic, pathophysiology nodes, phenotypes, diagnosis, treatment target_mechanisms).
    - 6 references read in full from cache: PMID:21407114, PMID:18724368, PMID:35769957, PMID:29654747 (full text), PMID:33374714 (full text), PMID:27532546.
    - 17 verified fully clean; 3 fixed (one shared defect pattern); 1 graded borderline (reported only). All snippets are exact substrings of their cache bodies; no cache files missing; 21/21 machine-verified.

    ## Findings
    1. Location: pathophysiology / "Loss of Apical Absorptive and Ion-Transport Capacity" (line 261) — reference PMID:29654747. Problem: `evidence_source: OTHER` with explanation "Evidence source is OTHER because this is a review". Per CLAUDE.md, evidence_source classifies the evidence the quoted sentence reports, and for a review mixing sources the item is judged by the quoted sentence; this sentence ("diminution of brush-border microvillar markers, including ezrin, villin, phospho-ERM, NHE3, and DPP-IV") summarizes human patient biopsy immunostaining findings, not consensus-without-data. Severity: DEFECT (misclassified evidence_source). ACTION: fixed — changed to HUMAN_CLINICAL and replaced the contradicting explanation sentence.
    2. Location: phenotypes / Villous Atrophy (line 436) — reference PMID:29654747. Problem: same pattern; the quoted sentence ("Other pathological hallmarks of the disease include villus atrophy, abnormal subapical periodic acid-Schiff/CD10 staining in enterocytes, inclusion staining...") reports human histopathology findings in MVID patients. Severity: DEFECT. ACTION: fixed — OTHER → HUMAN_CLINICAL (explanation already accurate, unchanged).
    3. Location: phenotypes / Dehydration (line 462) — reference PMID:29654747. Problem: same pattern; the quoted sentence ("Patients with MVID present with severe watery, electrolyte transport-related diarrhea and dehydration with failure to thrive beginning in the first days or weeks of life.") reports the clinical presentation of human patients. Severity: DEFECT. ACTION: fixed — OTHER → HUMAN_CLINICAL and replaced the contradicting explanation sentence. (Each fixed sentence occurs exactly once in the file, so check-snippet-grading same-sentence consistency is preserved. Two other PMID:29654747 quotes were deliberately left as OTHER: the whole-exome-sequencing item is a methodological recommendation, and the PMID:33374714 CODE-classification quote is a nosology statement — OTHER is correct for both.)
    4. Location: inheritance / Autosomal recessive inheritance (line 52) — reference PMID:21407114. Problem: the quote ("Almost half of the children were from consanguineous families from the Mediterranean area.") supports consanguinity enrichment, which is consistent with but does not directly state AR inheritance (HP:0000007); the block description's "typically homozygous for a founder or private MYO5B variant" is likewise not carried by the quote. The explanation is honest about the indirection ("consanguinity enrichment expected of a recessive disorder"). Severity: MINOR. ACTION: reported only — SUPPORT vs PARTIAL is judgment-call territory here, and AR inheritance for MYO5B-MVID is independently entailed by the biallelic-variant gene-discovery evidence in the genetic section; not plainly wrong.
    5. Location: treatments / Total Parenteral Nutrition target_mechanisms (line 577) — reference PMID:21407114. Problem: the quote "PN in MVID is difficult to manage and requires expertise." supports the expertise-dependence claim but only weakly the BYPASSES link itself; the stronger cohort sentence ("All of the patients completely depended on PN.") is already used on the intestinal-failure pathophysiology node, and reusing it here would be duplicative. Severity: NOTE. ACTION: reported only.
    6. Location: phenotypes / Cholestasis (line 494). Problem: no evidence block at all — but the `notes` field explicitly and correctly documents why (the cohort's 20/22 liver-fibrosis figure is PN-attributable and deliberately not used; no frequency band asserted), and the mechanism node "Canalicular Trafficking Failure..." carries the two well-chosen PMID:27532546 quotes. Severity: NOTE (exemplary handling, flagged only for completeness). ACTION: none.

    ## Sections reviewed
    inheritance, genetic, pathophysiology (incl. downstream edges and node notes), phenotypes, diagnosis, treatments (incl. target_mechanisms)

    ## Verdict
    An unusually disciplined entry: quotes are exact and precisely scoped to their claims, the hepatic-arm evidence carefully separates the trafficking mechanism (PMID:18724368) from the cholestasis phenotype and its dissociation from intestinal disease (PMID:27532546), and the file even carries explicit anti-conflation notes (PN-associated liver disease vs MYO5B cholestasis). The only systematic defect was a mistaken "OTHER because this is a review" evidence_source convention on three PMID:29654747 items, now corrected to HUMAN_CLINICAL per the judge-by-quoted-sentence rule; post-fix validation and snippet verification pass 21/21.

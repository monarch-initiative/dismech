  summary: Address automated review on PR 7490 (DORV)
  details: |
    Response to the automated review on PR #7490.

    IMPORTANT 1 (fixed): replaced the contentless 42-character discussions snippet
    ("The pathological mechanisms by which speci", truncated mid-word at a PDF
    ligature) with the contiguous, semantically complete span from the same cached
    source (PMID:37818164): "genetic anomalies or environmental exposures result in
    the development of DORV from normal structural cardiac anatomy are unknown".

    IMPORTANT 2 (fixed): added a dedicated "Cardiovascular magnetic resonance"
    diagnosis entry covering preoperative VSD-to-arterial-root spatial delineation
    for baffle planning, 4D flow, and postoperative late-complication surveillance.
    The reviewer proposed sourcing this from PMID:37818164, but that cache mentions
    MRI only twice and only as the comparator CT is preferred over; it carries no
    positive CMR-role claim. Three references were therefore fetched instead:
    PMID:33689734 (Vigil 2021, DORV-specific CMR-based virtual baffle planning, full
    text in cache), PMID:38652290 (Singh 2024, TOF/DORV multimodal imaging review),
    and PMID:39062326 (Moscatelli 2024, the CMR-in-CHD narrative review the research
    artifact was keyed on, now resolved from DOI 10.3390/children11070878). A
    companion "Cardiac catheterisation and angiography" diagnosis entry was added
    from PMID:37818164, addressing the reviewer's parenthetical that catheterisation
    was also only incidental.

    Suggestions applied: extended the truncated CHD7/CHARGE snippet past "75%" to
    include "of the patients with CHARGE association including DORV"; removed
    GO:0008015 blood circulation from the intracardiac-mixing node and replaced it
    with UBERON locations (interventricular septum, heart right ventricle, heart
    left ventricle) per the organ-level-physiology rule in the review skill; added
    CHEBI:47426 furosemide as therapeutic_agent on diuretic therapy, matching the
    PGE1 pattern; upgraded six surgical treatments from NCIT:C15329 Surgical
    Procedure to NCIT:C157806 Cardiac Surgery and the palliative flow-control entry
    from NCIT:C49236 Therapeutic Procedure to NCIT:C80430 Cardiac Therapeutic
    Procedure (both verified reachable from NCIT:C25218); added the Feeding
    difficulties phenotype (HP:0011968) with a notes-only provenance block matching
    the adjacent failure-to-thrive precedent, plus an incoming causal edge from the
    pulmonary-overcirculation node so the pathograph stays connected; added
    clinical_trials NCT00972608 (observational, completed, n=66, sole registered
    condition Double Outlet Right Ventricle); added a top-level references block
    covering all 18 sources; added review_notes to three subtypes recording the
    MONDO limitations (MONDO:0018498 lumps subaortic and doubly committed;
    MONDO:0020388 carries a mislabelled "subpulmonary" qualifier on the
    non-committed class).

    Suggestions declined, with reasons: therapeutic_modality backfill was already
    complete on all ten treatments before this round, so the finding was incorrect.
    Per-operation NCIT terms for Fontan, arterial switch, Rastelli, Nikaidoh,
    Kawashima, pulmonary artery banding, atrial septostomy and cavopulmonary
    anastomosis do not exist in NCIT; each was searched via the OLS4 NCIT index and
    returned no match, so NCIT:C157806 Cardiac Surgery is the most specific
    reachable TreatmentActionTerm available. Heart murmur (HP:0030148) and Pulmonary
    artery atresia (HP:0004935) were not added because no quotable snippet for
    either exists anywhere in the reference set; the only atresia mention in
    PMID:37818164 is a truncated morphologic aside, and asserting it would repeat
    the exact defect flagged in IMPORTANT 1.

    Reviewer ontology-label errors found and corrected: HP:0030148 is "Heart
    murmur", not "cardiac murmur"; HP:0004935 is "Pulmonary artery atresia", not
    "pulmonary atresia". Neither term was ultimately used, but the labels are
    recorded here so the corrected forms are on file.

    Rebase note: a parallel review-response commit (2c5878f6, biological_scale/role
    plus TOF and d-TGA differentials) landed on the branch concurrently and included
    its own "Cardiac magnetic resonance imaging and patient-specific 3D modelling"
    diagnosis entry sourced from PMID:38391276. The two CMR entries were merged into
    the single "Cardiovascular magnetic resonance" entry during rebase, keeping both
    sets of evidence (PMID:33689734 / PMID:38652290 / PMID:39062326 plus the two
    PMID:38391276 3D/virtual-reality modelling items) rather than leaving duplicates.

    Validation: just validate (schema + term + reference) passed with 153/153
    snippets verified against cached references; just validate-terms passed;
    scripts/check_folded_hyphens.py reported no new folded-scalar hyphen splits. The
    spurious reference_id frontmatter churn across ~7600 unrelated cache files was
    reverted with git restore before staging; only the four genuinely new cache
    files were added.

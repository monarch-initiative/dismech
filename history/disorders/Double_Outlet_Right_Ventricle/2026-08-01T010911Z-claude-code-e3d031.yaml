  details: |
    Independent red-team verification of PR #7490 using the dismech-pr-review skill, plus four fixes.

    Verification performed: all 134 pre-existing evidence snippets confirmed to be whitespace-normalized exact substrings of their cached references, with zero character substitution required (no ligature, NBSP or en-dash drift); all HP, UBERON, CL, GO, MONDO, HGNC, NCIT and CHEBI terms pass term validation and were additionally reviewed for semantic fit to the claim they annotate; the pathograph was confirmed to be a single connected component (10 of 10 nodes reached, 27 edges, zero dangling downstream targets, every phenotype with an incoming edge); all treatment target_mechanisms and discussion attaches_to references resolve to real pathophysiology nodes; the falcon deep-research report was confirmed genuine (433 seconds, 21 citations, roughly 11300 words, 1 artifact) and cross-checked against the entry for under-consumption.

    Fixes applied: added the biological_scale tag to all 10 pathophysiology nodes (CELLULAR for the neural-crest and second-heart-field node, TISSUE for the seven morphogenetic and structural nodes, ORGANISM for the two haemodynamic nodes). Added the role tag to all 10 nodes using the established repository vocabulary (trigger, mediator, effector, central_effector, consequence, outcome). Added a differential_diagnoses block modelling the two contested nosological boundaries that were previously captured only in prose: tetralogy of Fallot (MONDO:0008542, shared second-heart-field and neural-crest origin, the aortic override threshold as a conventional rather than mechanistic discriminator, and complete overlap in tetralogy with pulmonary atresia) and dextro-looped transposition of the great arteries (MONDO:0019443, discordant versus concordant pulmonary connection, the greater-than-50-per-cent pulmonary override rule, and pulmonary-to-mitral continuity as the Taussig-Bing discriminator). Added a cardiac magnetic resonance imaging and patient-specific 3D and virtual-reality modelling diagnosis entry, a central deep-research theme that was previously unmodelled, tied explicitly to the biventricular versus univentricular decision.

    Seven new evidence items were added, all with snippets verified against already-cached references (PMID:37818164, PMID:38391276, PMID:38884738). No new reference cache files were required.

    Validation after changes: just validate passed for schema, term and reference validation; just validate-references verified 141 of 141 snippets; just compliance reported 91.4 per cent global and 91.6 per cent weighted, improved from 91.0 and 91.3. Validator-induced reformatting of roughly 7600 unrelated references_cache files was reverted and not committed.

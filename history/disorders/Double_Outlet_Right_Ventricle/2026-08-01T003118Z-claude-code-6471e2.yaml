  summary: 'Create: Double_Outlet_Right_Ventricle'
  details: |
    Created the greenfield dismech entry for double outlet right ventricle (MONDO:0018089), resolving issue #7472.

    NEC preflight: ran `runoak -i sqlite:obo:mondo info MONDO:0018089 -O obo` and confirmed the MONDO definition (Orphanet:3426, ICD10CM Q20.1, is_a conotruncal heart malformations), synonyms (DORV) and xrefs match the intended entity before using any deep-research output. DORV sits adjacent to d-TGA and tetralogy of Fallot, a known NEC-risk class; the falcon report was checked for drift into those entities and was DORV-correct throughout.

    Deep research: `just research-disorder falcon Double_Outlet_Right_Ventricle` (Edison Scientific, EDISON_API_KEY), 433 s, 21 citations, 1 artifact. Report and citations sidecar committed under research/. The report was treated as leads only: its three key mechanistic leads (FOXJ1 motile-cilia laterality, SHROOM3 planar cell polarity, Moscatelli 2024 prevalence) were independently resolved from DOI to PMID via the PMC ID Converter and fetched with `just fetch-reference`. The Moscatelli prevalence figure was NOT usable because only the abstract is cached and the 3-9/100,000 claim lives in the full text, so prevalence was instead sourced from PMID:37818164 (open-access full text) and PMID:18456715.

    Modelling: five has_subtypes keyed on VSD position (subaortic/VSD type, DORV-Fallot, subpulmonary/Taussig-Bing, doubly committed, non-committed) because VSD position rather than the DORV label determines physiology and repair. Ten pathophysiology nodes forming a single connected component: cardiac neural crest and second heart field disruption plus a parallel left-right patterning/looping route, converging on failed outflow tract rotation, persistence of the subaortic conus with loss of aorto-mitral fibrous continuity, the double outlet ventriculo-arterial connection, outlet-septum attachment determining VSD commitment, obligatory intracardiac mixing with VSD-dependent streaming, outlet-septum malalignment producing outflow obstruction, pulmonary overcirculation, and left ventricular hypoplasia as the biventricular-repair hinge. Sixteen phenotypes, all with an incoming causal edge; 27 causal edges, 10 carrying their own evidence. Genetics covers chromosomal burden (>40 per cent), TBX1/22q11.2, ZIC3, CFC1, NKX2-5, GATA4, MEF2C, TBX20, FOXJ1 and SHROOM3; FOXJ1 and SHROOM3 deliberately carry no HGNC binding because the human evidence is single-proband/candidate-level. Treatments cover PGE1, diuresis, intraventricular baffle, arterial switch with VSD-to-pulmonary-root baffle, Rastelli/REV, Nikaidoh root translocation, single-ventricle palliation and genetic counselling, with target_mechanisms links into the pathograph.

    No module conformance was declared: kb/modules/ has no outflow-tract/conotruncal module, and the pulmonary_vascular_remodeling module was considered but not asserted because the entry has no DORV-specific evidence for the PASMC-proliferation node it would need to conform at.

    A pre-PR red-team review (dismech-pr-review skill, fresh-context subagent) was run before opening the PR and its findings were applied: two evidence items whose truncated snippets did not support their claims (Failure to thrive, Pulmonary arterial hypertension) were removed and replaced with notes; three unjustified frequency bands (Interrupted aortic arch, Heterotaxy, Complete atrioventricular canal defect) were dropped; the top-level description was corrected because the entry's own sources state that the DORV form WITH arterial-to-atrioventricular valvar fibrous continuity is the more common type, so persistence of the subaortic conus is characteristic but not obligatory (a REFUTE evidence item now records this and the corresponding causal edge was downgraded to INDIRECT_KNOWN_INTERMEDIATES); MONDO subtype_term bindings were added to all five subtypes; ZIC3 and TBX20 were retyped SUSCEPTIBILITY to match their own papers' conclusions; HGNC bindings were added to FOXJ1 and SHROOM3; the pulmonary push evidence was downgraded to PARTIAL because the source frames it as a postulate; the CHD-population fraction prevalence record no longer asserts a misleading rate_per_100000; and the left-ventricular-hypoplasia edge was re-parented to the VSD-commitment node since it is a fetal rather than postnatal consequence. Sections added in response: inheritance (multifactorial plus AD and X-linked), diagnosis (fetal echo, TTE, cardiac CT, cytogenomic testing), CHD7/CHARGE and LRP1 genetics, palliative flow-control and Kawashima treatments, and a KNOWLEDGE_GAP discussion with three proposed experiments recording that the mechanism linking a specific genetic lesion to a specific DORV subtype is unknown.

    Validation: `just validate` passes (schema clean, term validation clean, 134/134 snippets verified against cached references); scripts/check_folded_hyphens.py clean; `just check-reference-cache-frontmatter` OK; pathograph connectivity verified programmatically (10/10 nodes in one component, 0 dangling edge targets, 0 phenotypes without an incoming edge, 16/27 causal edges carrying their own evidence); compliance 91.0 per cent global / 91.3 per cent weighted. Unused fetched reference caches were removed and the spurious reference_id frontmatter churn across ~7600 unrelated cache files was reverted so only the 15 genuinely new PMID caches are staged.

  summary: 'Create: Colobomatous Microphthalmia-Rhizomelic Dysplasia Syndrome'
  details: |
    De-novo curation of row NOS 15-0170 of ISDS Nosology 2023 group 15, the MAB21L2-related oculo-skeletal syndrome. Scoped deliberately against the existing Microphthalmia_with_Coloboma entry, which covers the isolated non-syndromic MAC spectrum and carries MAB21L2 as a subtype: the two are different concepts sharing a gene, and the entry notes state that the isolated-MAC entry must not take this ISDS assignment. The pathograph runs from the recurrent p.Arg51Cys allele through reduced chondrocyte proliferation in the proximal limb bud to rhizomelic shortening, using the Prx1-cre conditional knockout, whose limitations are recorded explicitly: it is a null and the human allele is a missense, and the limb-restricted driver says nothing about the ocular or cognitive components. Two KNOWLEDGE_GAP discussions record the allele-specificity puzzle, where biallelic variants give less phenotype than one particular heterozygous substitution, and the unidentified non-autonomous signal by which a distally expressed gene controls proximal proliferation. All 18 evidence snippets verified; schema, term and reference validation pass.

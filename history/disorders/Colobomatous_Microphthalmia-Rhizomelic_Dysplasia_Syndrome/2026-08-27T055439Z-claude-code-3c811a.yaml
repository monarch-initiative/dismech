  summary: Add the ocular mechanism node and wire the pathograph
  details: |
    Final-pass review. Phenotype causal-inlink went from 1/4 to 4/4. The terminal pathophysiology node shared a name with the rhizomelia phenotype, which collapsed them into one graph node; it was renamed to Shortened Proximal Limb Cartilage Template, which is also the more accurate description of what the mouse work measures, and now emits the phenotype edge. Added a Disrupted Optic Cup and Fissure Morphogenesis node so the ocular half of the syndrome is represented rather than implied, with anophthalmia and microphthalmia/coloboma as its graded outputs. Intellectual disability is wired from the substitution node as INDIRECT_UNKNOWN_INTERMEDIATES with a note that it is absent from isolated MAB21L2 eye disease, so it belongs to this allele rather than the gene.

  summary: Address review findings on PR 17995
  details: |
    Answered the 2026-11-15 review. Replaced the unsourced nucleotidyltransferase activity (GO:0016779) and protein binding (GO:0005515) bindings on the p.Arg51Cys node with single-stranded RNA binding (GO:0003727, DECREASED), sourced from Rainger et al. 2014 (PMID:24906020), which shows wild-type MAB21L2 binds ssRNA, all tested variants lose it, and no nucleotidyltransferase activity is detectable. Removed the Supportive Care evidence item that did not support management and recorded in notes that no management guidance is published. Cut the Genetic Counseling description to the de novo heterozygous finding, dropping the unsourced recurrence-risk and germline-mosaicism statements. Removed the differential-diagnosis evidence item that did not state the distinguishing feature, leaving it as curator prose. Recorded ClinGen's Definitive autosomal dominant assertion as gene_disease_validity, quoting the cached CGGV row.

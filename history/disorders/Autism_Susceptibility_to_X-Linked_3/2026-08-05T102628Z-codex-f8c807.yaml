  summary: 'Review: Autism susceptibility to X-linked 3 publication readiness'
  details: |
    PR review disposition: addressed the blocking management-scope finding by documenting why generic phenotype-directed support is retained while GeneReviews risperidone, melatonin, and QT-avoidance guidance is not promoted to AUTSX3 without an AUTSX3-specific indication. Adopted nonblocking suggestions to preserve PMID:17486179 only as non-specific limitation evidence, replace two mixed/model-source citations, encode the common-variant XWAS as REFUTE, document deliberate orphan phenotypes in-entry, and remove unsupported cortex localization. Declined the suggested causal links for intellectual disability and absent speech because both remain single-carrier observations with uncertain variant causality; adding edges would overstate evidence.

    Independent publication-readiness review through 2026-08-05. Confirmed MONDO:0010342 / OMIM:300496 identity and MECP2 relationship; cross-checked the Falcon deep-research report, citation sidecar, artifact metadata, all cited reference caches, and newer PubMed literature. Reframed AUTSX3 as a historical susceptibility label rather than a delineated Mendelian or Rett-spectrum syndrome; separated association, variant-specific, model-organism, and established MECP2-disorder evidence; removed unsupported disease-level frequency, natural-history, diagnostic, treatment, prognosis, and causal claims; added explicit knowledge gaps and a human-model mismatch experiment. Added current evidence from PMID:39706197, PMID:40546018, PMID:42032772, and PMID:42146591 using just fetch-reference only. D2P disposition ledger: HP:0000758 abnormal nonverbal communicative behavior — not added, subsumed by the defining autism term and lacking exact AUTSX3-specific cached evidence; HP:0005324 disturbance of facial expression — not added for the same reason; HP:0002353 EEG abnormality — not added because the source frequency could not be supported as AUTSX3-specific; HP:0003144 increased serum serotonin — not added because the source frequency could not be supported as AUTSX3-specific; HP:0000732 inflexible adherence to routines — not added, a generic autism component without exact entry-specific evidence; HP:0002332 lack of peer relationships — not added for the same reason; HP:0000721 lack of spontaneous play — not added for the same reason; HP:0000733 motor stereotypy — not added because available direct evidence does not establish it as an AUTSX3 disease-level feature; HP:0000723 restrictive behavior — not added, subsumed by autism and lacking exact entry-specific evidence; HP:0001250 seizure — not added because frequent seizure is characteristic of other MECP2 disorders and is not established for AUTSX3; HP:0001249 intellectual disability — retained as a PARTIAL single-carrier observation but intentionally left unlinked because variant causality is uncertain; HP:0001344 absent speech — retained as a PARTIAL observation in the same carrier and intentionally left unlinked for the same reason. No unsupported edges were added to improve connectivity. Target validation passed schema, terms, references, and 36/36 snippets; target graph integrity passed. Repository-wide graph validation still reports unrelated baseline issues in 74 other disorders.

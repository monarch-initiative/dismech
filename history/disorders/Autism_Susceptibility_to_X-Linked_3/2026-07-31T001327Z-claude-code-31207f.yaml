  summary: Augment AUTSX3 with falcon deep research + nosologic knowledge gap
  details: |
    Incorporated falcon (Edison) deep-research output. Falcon synthesis confirmed AUTSX3 is a legacy/historical nosologic label within the continuous MECP2-related disorder spectrum and warned against transferring Rett syndrome prevalence/survival/treatment data to AUTSX3 — the existing entry already framed AUTSX3 as the non-lethal autism-predominant end of the MECP2 spectrum. Added a KNOWLEDGE_GAP discussion (gap_autsx3_nosologic_status) capturing this nosologic uncertainty, anchored on GeneReviews PMID:20301670 and Coutinho PMID:17427193. Falcon citations were recent general MECP2/Rett reviews (DOIs) rather than new AUTSX3-specific primary literature, so no new primary evidence items were added beyond the existing verified AUTSX3 papers. Committed the falcon report + citations + artifacts. Re-validated: schema, term, and reference validators all pass.

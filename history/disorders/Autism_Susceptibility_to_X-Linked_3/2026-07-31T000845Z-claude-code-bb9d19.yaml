  summary: 'Create: Autism, Susceptibility to, X-Linked 3 (AUTSX3, MECP2)'
  details: |
    Created new AUTSX3 (MONDO:0010342, OMIM 300496, MECP2) susceptibility entry. Modeled MECP2 dosage-sensitivity mechanism below the Rett threshold: MECP2 coding/3'-UTR/regulatory variation and epigenetic promoter hypermethylation -> reduced/dysregulated MeCP2 dosage -> dysregulated neuronal gene expression -> impaired synaptic maturation -> autistic behavior. Evidence from Carney 2003 (PMID:12770674), Shibayama 2004 (PMID:15211631), Coutinho 2007 (PMID:17427193), Nagarajan 2006 (PMID:17486179), Loat 2008 (PMID:19125863), plus MeCP2 mechanism PMIDs 10508514/18511691. GeneReviews baseline PMID:20301670 (tagged, QT drug-safety warning captured). Deep research: falcon (Edison) run initiated. Validated with linkml-validate, term validator, and reference validator (all pass); compliance 91.5% global / 92.9% weighted.

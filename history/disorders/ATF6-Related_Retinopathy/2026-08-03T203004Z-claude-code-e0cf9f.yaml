  summary: 'Create: ATF6-Related Retinopathy (MONDO:0100447)'
  details: |
    Fresh curation of ATF6-Related Retinopathy (MONDO:0100447), the next long-tail gene target in issue #4008's retinopathy list after AIPL1/CERKL. ATF6 causes achromatopsia type 7 (ACHM7) via an unfolded-protein-response developmental mechanism distinct from the phototransduction-cascade defects of the other five achromatopsia genes; also causes cone-rod dystrophy and macular dystrophy in a minority of patients (PMID:28812650), so this gene-centric entry models a broader phenotypic spectrum than the ACHM7 subtype already captured in Achromatopsia.yaml. Sourced from 8 independently verified PMIDs (26029869, 26063662, 28028229, 32271167, 31237654, 20301591 GeneReviews, 39273686, 28812650) plus one PMID (38419580) that was fetched but ultimately not used after its cached abstract contradicted an earlier web-summarized claim (a hallucinated 'pigment mottling' finding not present in the real abstract -- the pigment-mottling phenotype block and a numeric ATF6 case-fraction claim citing text absent from the abstract-only PMID:26029869 cache were both dropped/corrected during just validate-references iteration). GeneReviews citations use the url: reference type (matching Achromatopsia.yaml's established convention) since the live book chapter has substantially more content than the short PMID abstract; several snippets needed shortening to avoid inline HTML tag breaks (e.g. italic gene-name markup) in the raw cached page. just validate passes clean: schema, terms, and 33/33 reference snippets verified.

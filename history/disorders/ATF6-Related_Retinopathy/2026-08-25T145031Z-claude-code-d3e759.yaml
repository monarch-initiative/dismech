  summary: 'Resolve 7 blocking review items: macular evidence, pathograph wiring,
    frequency/term fixes, UPR GO term, GeneReviews tag, Cone-Rod Dystrophy subtype
    content'
  details: |
    Follow-up curation pass resolving all 7 IMPORTANT items flagged in the
    2026-08-14 re-review of this entry (originally created 2026-08-03).

    1. Unmodeled "macular dystrophy" claim: the history record and
       description/notes had attributed a macular-dystrophy presentation to
       PMID:28812650, whose cached abstract contains zero occurrences of
       "macular dystrophy". Reworded description/notes to the accurate,
       sourced claim (macular involvement -- a yellow macular lesion with
       reduced fundus autofluorescence, PMID:38419580) instead of removing
       the claim outright.
    2. Mined references_cache/PMID_38419580.md (fetched previously but never
       cited): added real evidence citing its macular lesion, FAF
       hypofluorescence, cone-selective ERG, foveal-pit-loss, and splice-variant
       content across two new phenotypes (Yellow Macular Lesion HP:0030500,
       Abnormal Fundus Autofluorescence HP:0030602), three additional
       evidence items on existing pathophysiology/phenotype/genetic nodes, and
       one subtype description addition.
    3. Pathograph connectivity: wired the previously orphan "Age- and
       Genotype-Dependent Rod Involvement" node with an in-edge from "ATF6
       Unfolded Protein Response Impairment" and an out-edge to a new
       "Decreased Rod Response" phenotype (subtype: Cone-Rod Dystrophy). Wired
       "Foveal Hypoplasia and Near-Absent Cone Structure" downstream to Foveal
       Hypoplasia, Abnormal Cone Electroretinogram, Photophobia, and Nystagmus
       (previously in-edge-less phenotypes), each with its own evidence.
    4. Frequency/term correction: swapped Foveal Hypoplasia to OBLIGATE
       (evidence: "observed in all subjects") and downgraded Abnormal Cone
       Electroretinogram to VERY_FREQUENT (only generic, non-ATF6-specific
       GeneReviews evidence backed OBLIGATE) -- though a new ATF6-specific
       PMID:38419580 evidence item was also added to that phenotype. Swapped
       its phenotype_term from generic HP:0000512 (Abnormal electroretinogram)
       to the specific HP:0008275 (Abnormal light-adapted electroretinogram).
    5. Added biological_processes GO:0036500 (canonical label
       "ATF6-mediated unfolded protein response", NOT the generic "unfolded
       protein response" -- verified via web search since local runoak GO
       build timed out) with modifier: DYSREGULATED (not the invalid
       ABERRANT) to the "ATF6 Unfolded Protein Response Impairment" node.
    6. Added the missing top-level references: block entry tagging
       PMID:20301591 (GeneReviews Achromatopsia chapter) with
       tags: [GeneReviews]. Note: scripts/tag_references.py produced a
       false-positive tag on PMID:28812650 (its own bibliography cites the
       GeneReviews chapter by name, tripping the script's substring check) --
       that output was discarded and the correct entry added by hand instead.
       Also newly cites PMID:20301591 directly (not just via the existing
       url: GeneReviews citations) for two new pathophysiology-edge evidence
       items (Photophobia, Nystagmus), both verified against the cached
       abstract.
    7. Cone-Rod Dystrophy subtype: added subtype_term MONDO:0014677
       (achromatopsia 7) to the Classic Achromatopsia subtype and
       MONDO:0015993 (cone-rod dystrophy) to the Cone-Rod Dystrophy subtype.
       No ATF6-specific numbered CORD OMIM/MONDO entry exists (confirmed via
       OMIM/MONDO web search) -- ATF6's only disease-specific identifier is
       ACHM7 -- so the Cone-Rod Dystrophy subtype is deliberately bound to the
       generic cone-rod-dystrophy disease-series term, documented in the
       subtype description. Gave the subtype real content: two new
       subtype-scoped phenotypes (Decreased Rod Response HP:0030469 and a
       Cone-Rod-Dystrophy-scoped Color Vision Defect documenting residual
       color discrimination vs. classic achromatopsia's complete color
       blindness), both wired into the pathograph.

    Minor fixes also applied: restored the "Atf6(-/-)" parentheses that were
    missing from two snippets quoting PMID:26029869 (an exact-substring
    mismatch that either failed silently or was masked); swapped the generic
    Nystagmus term (HP:0000639) for the more specific Pendular nystagmus
    (HP:0012043), matching the existing description text; changed
    "Impaired Cone Photoreceptor Development" biological_scale from TISSUE to
    CELLULAR. PMID:39273686 (flagged as an uncached, uncited leftover) was
    already absent from the file -- no action needed. This record's own
    `links.prs` is populated, addressing the suggestion to populate history
    links going forward.

    Merged origin/main first (branch was ~647 commits behind); the merge
    itself touched only two append-only cache files
    (cache/mondo/terms.csv, cache/enums/diseaseterm_*.csv), resolved by
    keeping both sides' additions in sorted order.

    Validation: `just validate` passes clean -- schema (no issues), term
    validation (all terms verified), and reference validation
    (47/47 snippets verified against cached references, up from 33/33 at
    creation). `just check-term-cache-integrity` also passes. Ran with
    PYTHONUTF8=1 after discovering the term-cache normalization step mangles
    pre-existing non-ASCII characters in cache/mondo/terms.csv on this
    Windows environment when run without it (mojibake on rows like
    "Schöpf-Schulz-Passarge syndrome"); that corruption was caught via git
    diff and reverted before committing, and is worth a follow-up issue
    against the cache-normalization tooling's encoding handling on Windows.

  summary: 'Create: Spermatogenic_Failure_47'
  details: |
    New entry for MONDO:0030844 (DZIP1-related SPGF47), curated from the open stub. Human evidence comes from the full text of the only clinical report, PMID:32051257 (two homozygous probands plus a Dzip1 knockout mouse). The basal-body step is supported indirectly by mouse fibroblast data (PMID:23955340) and Drosophila germ-cell data (PMID:31821146), both marked directness INDIRECT. The causal chain runs from DZIP1 protein loss, to defective basal body maturation and docking with centriole-number defects and IFT mislocalization, to arrest of axoneme outgrowth, to absent and short flagella, immotility and infertility. Oligozoospermia is deliberately left unconnected because its mechanism is not established. No treatment is recorded because no ICSI outcome has been reported for a DZIP1 patient; a knowledge-gap discussion records the centriole concern for ICSI. The allelic dominant mitral valve prolapse phenotype (PMID:31118289) is noted but kept out of this entry. Validated with just validate (22/22 snippets), count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, list-gene-term-mismatches and check-genereviews (NO_CHAPTER).

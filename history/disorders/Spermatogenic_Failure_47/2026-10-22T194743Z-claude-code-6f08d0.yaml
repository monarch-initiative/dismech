  summary: 'Review round 1: immotile-sperm binding, MF grounding, deep research'
  details: |
    Addressed the first automated review. The motility phenotype is now bound to HP:0012208 Immotile sperm instead of the broader HP:0012207, matching the 0-2.1% total and 0% progressive motility in both probands; the node was renamed and its pathograph target updated. Oligozoospermia carries a note that it is left unwired because the source does not explain the low count. To pass the gene-activity grounding gate, the DZIP1-loss node now binds GO:0060090 molecular adaptor activity (the GO annotation DZIP1 carries for assembling the BBSome-DZIP1-PCM1 complex), evidenced by DZIP1 binding CEP164 and IFT88 (PMID:23955340). A claude_code deep-research report was run and committed; it found no further human SPGF47 reports beyond PMID:32051257 and added no new content. Its HPO suggestions were mislabelled and were not used. Re-validated with just validate (23/23 snippets), validate-terms, check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values.

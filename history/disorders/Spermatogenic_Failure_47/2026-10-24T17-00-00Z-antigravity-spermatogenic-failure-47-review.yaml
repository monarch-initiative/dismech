  details: '- Added `classifications` section with Harrison''s chapters (`ENDOCRINOLOGY_METABOLISM`, `GENETICS_ENVIRONMENT_DISEASE`)
    and mechanistic category (`ciliopathy`) backed by PMID:32051257.

    - Enriched `pathophysiology` nodes with anatomical locations (`UBERON:0000473` testis), cell types
    (`CL:0000018` spermatid, `CL:0000019` sperm), cellular components (`GO:0005813` centrosome, `GO:0005814`
    centriole), and biological processes (`GO:0098534` centriole assembly).

    - Marked core MMAF sperm morphology and motility phenotypes (`Absent sperm flagella`, `Short sperm
    flagella`, `Immotile sperm`) with `diagnostic: true`.

    - Added `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` to the `DZIP1` genetic entry.

    - Added `diagnosis` section covering light microscopic sperm morphology analysis, transmission electron
    microscopy of spermatozoa, and whole-exome sequencing identifying homozygous `DZIP1` variants with
    verbatim snippets from PMID:32051257.


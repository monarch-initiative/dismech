    Created de-novo Rubella MONDO:0004656 entry. Deep research via just research-disorder claude_code; evidence independently verified against PubMed abstracts. Curated respiratory/lymphatic replication, viremic maculopapular exanthem, arthropathy PMID:10685808, and transplacental transmission with congenital rubella syndrome CRS driven by rubella-induced apoptosis and capsid-p32 mitochondrial disruption PMID:16051872 PMID:37327049. Postnatal phenotypes: rash, lymphadenopathy, fever, arthralgia. CRS phenotypes: cataract PMID:12463994 PMID:19249974, sensorineural hearing loss, PDA and branch pulmonary artery stenosis PMID:19697432, microcephaly. Lancet seminar PMID:35367004 clinical baseline. Delayed CRS manifestations noted PMID:4001724. All 25 snippets verified as exact substrings; schema and term validation pass.

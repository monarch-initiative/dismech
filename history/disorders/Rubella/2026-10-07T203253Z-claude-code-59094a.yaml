  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added three diagnosis rows (the entry had none): rubella IgM bound to LOINC:31616-6 (method-less serum presence), rubella IgG bound to LOINC:8014-3 (method-less quantitative serum code), and rubella IgG avidity bound to LOINC:34421-8 (method-less serum avidity ratio). Evidence from PMID:28412379 (WHO European laboratory review), PMID:33316569 (French national reference laboratory series in pregnancy), PMID:9316732 and PMID:2723615 (avidity studies). No low-avidity band: the only numeric cut-offs found (an avidity index below 40 percent and above 60 percent in PMID:9316732) belong to one diethylamine-eluted ELISA, and a PubMed search returned no guideline or consensus threshold. No IgG band either: seroconversion is a change between two results, and an immunity level is not a diagnostic threshold for the disease.

  summary: 'Add postnatal thrombocytopenic purpura/encephalitis and CRS phenotypes:
    hepatosplenomegaly, blueberry-muffin lesions, delayed diabetes/glaucoma'
  details: |
    Curated 6 previously-missing Rubella phenotypes flagged in issue #6433 section A. Two postnatal acute-illness complications, Thrombocytopenic purpura (HP:0000979) and Encephalitis (HP:0033993), reuse the already-cached PMID:35367004 sentence: 'Complications include arthralgia, arthritis, thrombocytopenic purpura, and encephalitis.' Four congenital rubella syndrome (CRS) features were added: Hepatosplenomegaly (HP:0001433) reusing the already-cited PMID:35367004 CRS presenting-signs sentence; 'Blueberry muffin' skin lesions (HP:0001978, Extramedullary hematopoiesis) newly sourced from PMID:25654000, a case report fetched and cached this session, quoting 'The baby had blueberry muffin skin lesions, long bone metaphysitis and congenital heart defects.'; and two delayed-onset CRS manifestations, Diabetes mellitus (HP:0000819) and Glaucoma (HP:0000501), both from the already-cached PMID:4001724 review of delayed CRS manifestations. Validated with just validate, just validate-terms, just count-verified-snippets (31/31 verified), and pytest tests/test_data.py -k Rubella (16 passed). Left open per issue #6433: Dengue, Hepatitis_C, Measles otitis/ADEM/SSPE, HPV, Congenital_Zika_Syndrome, CMV_Retinitis, Viral_Encephalitis, and Postpoliomyelitis/Paralytic_Poliomyelitis content gaps.

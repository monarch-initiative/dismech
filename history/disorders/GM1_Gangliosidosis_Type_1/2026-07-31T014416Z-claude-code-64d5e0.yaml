  summary: 'Augment: GM1 Gangliosidosis Type 1'
  details: |
    Augmented the existing infantile GM1 gangliosidosis entry (GLB1 deficiency,
    MONDO:0009260) using the falcon deep-research report
    (research/GM1_Gangliosidosis_Type_1-deep-research-falcon.md) as leads, with the
    GLB1-Related Disorders GeneReviews chapter (PMID:24156116) as the mandatory
    phenotype baseline.

    Additions:
    - classifications: sphingolipidosis (lysosomal_storage_category) + Harrison's
      ENDOCRINOLOGY_METABOLISM chapter.
    - pathophysiology: new "Neuronal Apoptosis" node inserted in the causal chain;
      biological_scale tags added to all nodes; enriched substrate detail
      (GA1/oligosaccharides/keratan sulfate) and residual-activity severity gradient.
    - phenotypes: added hypotonia, global developmental delay, seizures, cardiomyopathy,
      spasticity, blindness, hearing impairment, feeding difficulties, Mongolian blue
      spot, nonimmune hydrops fetalis, and IUGR, with FrequencyEnum bands where the
      cited snippet supports them (VERY_FREQUENT for near-universal features, FREQUENT
      for "frequently"-qualified somatic features, OCCASIONAL for seizures).
    - prevalence: structured birth-prevalence block (reported incidence 1:100,000-200,000
      live births; BAND_1_9_PER_1000000).
    - genetic: enriched with GLB1 variant spectrum (261 pathogenic variants, p.R59H).
    - progression: natural-history timing (mean onset 2.8mo, diagnosis 8.7mo, death
      18.9mo; RETRIEVE median survival 19mo).
    - biochemical: beta-galactosidase deficiency, H3N2b pentasaccharide pharmacodynamic
      biomarker, and screening abnormalities (ASAT, chitotriosidase, urinary
      oligosaccharides).
    - clinical_trials: NCT03952637 (AAV9-GLB1 IV), NCT04713475 (PBGM01), NCT04273269
      (LYS-GM101, terminated), NCT02030015 (Syner-G/miglustat SRT).
    - treatments: added investigational substrate reduction therapy; tagged
      therapeutic_modality on all treatments.

    New references fetched and cited: PMID:24156116 (GeneReviews, tagged), PMID:31761138
    (Arash-Kaps), PMID:37267847 (Kell, H3N2b), PMID:39639297 (Heron RETRIEVE).

    Deep-research provider: falcon (Edison). GeneReviews cross-referenced for clinical
    characteristics coverage. Validation: `just validate` passes (schema + terms +
    references); all 51 evidence snippets independently confirmed as exact
    whitespace-normalized substrings of their cached references; 27 pytest data tests
    pass; weighted compliance 83.6%.

    Follow-up (red-team review response, same session): mined the GeneReviews chapter's
    Management and Genetic Counseling sections (previously unused) — added a
    "Multidisciplinary Surveillance and Symptom Management" treatment with the GR annual
    surveillance schedule and agents-to-avoid (psychotropic medications) evidence, and a
    GR 25%-recurrence-risk evidence item on the inheritance block. Softened the Neuronal
    Apoptosis node description so the model-derived UPR/mitochondrial-Ca2+ cascade is not
    asserted as a human-established mechanism (evidence remains the Lang human-review
    "cellular apoptosis" statement). Dropped the seizure OCCASIONAL frequency band (the 9%
    figure is only in the Lang Table-1 artifact, not the citable cache text). Wired the
    seven previously-unconnected distal phenotypes (spasticity, blindness, hearing
    impairment, feeding difficulties, Mongolian blue spot, hydrops fetalis, IUGR) into the
    pathograph as downstream edges. Re-validated: just validate passes; all 54 snippets
    confirmed as exact substrings.

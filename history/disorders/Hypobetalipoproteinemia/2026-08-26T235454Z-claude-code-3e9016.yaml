  summary: 'Create: Hypobetalipoproteinemia'
  details: |
    New root entry (MONDO:0017774) with has_subtypes covering APOB truncating variants (FHBL1, heterozygous vs homozygous/compound-heterozygous severity gradient), PCSK9 loss-of-function, and ANGPTL3-related familial combined hypolipidemia (FHBL2). Modeled three mechanistically distinct convergent routes to the shared low-apoB/LDL-C phenotype: APOB is production-limited (impaired hepatic/intestinal apoB assembly and secretion, with hepatic steatosis from failed triglyceride export), while PCSK9 and ANGPTL3 are clearance-enhanced (increased hepatic LDL-receptor recycling; de-repressed lipoprotein/endothelial lipase), explicitly not associated with hepatic steatosis. Curated the explicit mechanistic contrast against kb/disorders/Abetalipoproteinemia.yaml (MTTP lipidation defect on normal apoB alleles vs apoB-dosage/clearance defects here) via notes and a differential_diagnoses block, and cross-referenced kb/disorders/Familial_Defective_Apolipoprotein_B-100.yaml (opposite hyper- axis). Curated evolocumab and evinacumab as the human-genetics-validated therapeutic reproduction of the PCSK9/ANGPTL3 loss-of-function mechanisms (target_mechanisms, therapeutic_modality MONOCLONAL_ANTIBODY), explicitly noting these are not treatments for hypobetalipoproteinemia itself. Added one mouse Apob-truncation knock-in animal model (modeled_mechanisms, RECAPITULATES) and a KNOWLEDGE_GAP discussion on molecularly uncharacterized non-APOB/PCSK9/ANGPTL3 FHBL loci (chromosome 3p21-linked and others). Deep research: falcon (Edison Scientific), research/Hypobetalipoproteinemia-deep-research-falcon.md; just preflight-dr returned SKIP (MONDO records no single causal gene for this grouping term, expected fallback) with gene-mention distribution APOB=42, PCSK9=9, ANGPTL3=8, MTTP=8, SAR1B=3 matching the intended multi-gene scope, no NEC concern identified on manual review. Falcon report own reference_validation: 7/7 resolved, 0 confabulation rate, 0 off-topic. Validation actually run and observed: just validate (schema+terms+refs, 72/72 snippets verified against cached references), just count-verified-snippets (72/72), just validate-terms (pass), just check-duplicate-keys (pass), just validate-disorders (batched pre-PR sweep matching CI, pass).

  summary: 'Address PR #9554 review: fix prevalence classes, evidence_source mistag,
    add diagnosis/phenotype/prevalence/modifier content'
  details: |
    Addressed reviewer CHANGES_REQUESTED on PR #9554 (2 CRITICAL, 5 IMPORTANT, 8 SUGGESTION). CRITICAL 1: fixed three prevalence records whose prevalence_class (BAND_1_5_PER_10000 / NOT_YET_DOCUMENTED) contradicted their own rate_per_100000 (2600, 3200, 9400) - all corrected to ABOVE_1_IN_1000. CRITICAL 2: the animal_models entry mistagged human data (hepatic-fat three-fold increase; ~25% of normal apoB rate) as evidence_source MODEL_ORGANISM. Replaced the entry entirely with a properly-sourced mouse model (Apob-38.9 heterozygous mice, PMID:13130124, Chen et al 2004 J Lipid Res) carrying a genuinely murine in-vivo readout (80% reduction in hepatic apoB-100 secretion vs the 50% gene-dosage expectation) tagged MODEL_ORGANISM, plus the papers own human background sentence correctly tagged HUMAN_CLINICAL. IMPORTANT 3: added missing reference_title on 6 evidence items (partially done by coordinator, verified correct). IMPORTANT 4: added a diagnosis: section (plasma lipid/apoB thresholds incl. the <15 mg/dL severe-disease criterion from a newly fetched 2024 review PMID:38710625; APOB molecular testing; blood smear). IMPORTANT 5: added Steatorrhea (HP:0002570, corrected from the reviewers suggested HP:0002595 which is actually Ileus) as VERY_FREQUENT with proper GeneReviews support, and downgraded Fat malabsorption to omit frequency and use PARTIAL support since its only prior evidence was a management sentence. IMPORTANT 6: added two new prevalence records for APOB-FHBL1 itself (heterozygous ~1:1,000-1:3,000 / ABOVE_1_IN_1000; biallelic <1 per million / BELOW_1_IN_1000000) from a newly fetched 2025 review PMID:41473260. IMPORTANT 7: added Elevated circulating hepatic transaminase concentration (HP:0002910) and Hyperbilirubinemia (HP:0002904) phenotypes from the GeneReviews sentence already quoted for acanthocytosis. Suggestions addressed: liver transplantation and pregnancy vitamin-A-halving treatment detail, a biallelic-disease multisystem surveillance treatment entry, Peripheral neuropathy phenotype (PARTIAL support), a biochemical: section with the <15 mg/dL thresholds, a PNPLA3 hepatic-fibrosis MODIFIER genetic entry (GCKR skipped - no citable primary-source quote available), and the Lebanese APOB p.(Arg490Trp) founder-allele variant (71% of probands, PMID:34564380). Also fixed the empty links: field on the original CREATE history record (added issue #9548 and PR #9554). Suggestions not addressed: Nyctalopia phenotype (no direct GeneReviews textual support for FHBL1 specifically, unlike abetalipoproteinemia) and GCKR modifier (falcon report mentions it but no independently verified/cached primary-source quote was found). Validation actually run and observed after all changes: just validate (91/91 snippets verified against cached references, schema+terms pass), just count-verified-snippets (91/91), just validate-terms (pass), just check-duplicate-keys (pass), just validate-disorders (batched pre-PR sweep, pass), plus the two CI-only gates not in the just ladder: uv run python scripts/check_snippet_length.py --against-ref origin/main (OK, no new snippets under 5 words) and uv run python scripts/check_folded_hyphens.py (OK, no new folded-scalar hyphen splits).

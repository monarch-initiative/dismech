  details: |
    Corrected the PCSK9 loss-of-function genetic context, which said these variants abolish PCSK9 protease activity: PCSK9's catalytic activity is needed only for its own autocatalytic maturation, and the activity loss-of-function alleles remove is binding of the LDL receptor and routing it to degradation (PMID:17608623); the node already binds LDLR binding, decreased. Grounded the APOB truncating-variant record by adding apoB's lipid carrier activity, decreased, to the hepatic and intestinal assembly node. ANGPTL3 (lipase inhibitor activity decreased, ClinGen Definitive for FHBL2) and the remaining APOB modelling were reviewed and left unchanged.

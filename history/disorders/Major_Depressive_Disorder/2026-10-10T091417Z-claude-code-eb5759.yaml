  summary: Bind validated instruments and their severity bands as LOINC measurements
  details: |
    Added a diagnosis section with three instrument rows. PHQ-9: panel LOINC:44249-1 bound as the measurement; total score LOINC:44261-6 carries severity bands 0-4, 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe, cited to the Kroenke 2001 validation study (PMID:11556941, full text). BDI-II: panel LOINC:89210-9; total LOINC:89209-1 carries two schemes, the original severity specifiers 0-13/14-19/20-28/29-63 as restated by the Wang and Gorenstein 2013 review (PMID:24402217; the manual is not PubMed-indexed) and the Turkish-population cut-offs 0-12/13-18/19-28/29-63 (PMID:17876817). GDS: 30-item panel LOINC:48542-5 bound without bands because no cached source states a GDS cut-off; development paper PMID:7183759 and reviews PMID:17087788, PMID:19800132 and PMID:31881393 report accuracy without naming a cut-off. Diagnosis term NCIT:C15419 Disease Screening. Pfizer and NCS Pearson LOINC copyright notices copied verbatim into the row notes. No instrument items are quoted. Validated with just validate, loinc-seed-cache, count-verified-snippets, validate-terms and the LOINC schema tests.

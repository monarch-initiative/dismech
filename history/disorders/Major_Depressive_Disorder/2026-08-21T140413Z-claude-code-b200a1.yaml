  summary: Add stalled adult hippocampal neurogenesis mechanism from Nature Medicine
    multiomic hippocampus study
  details: |
    Curated from the Nature Medicine article "Dysregulated adult hippocampal neurogenesis in major depressive disorders" (DOI:10.1038/s41591-026-04571-8), supplied as a PDF. The article had no PubMed record at curation time (esearch by title and by DOI both returned zero hits on 2026-08-21), so it is cited by DOI; the cache entry was created with `just fetch-reference DOI:10.1038/s41591-026-04571-8` and resolves to metadata only.

    Added: a `stalled_adult_hippocampal_neurogenesis_model` mechanistic hypothesis (EMERGING); four pathophysiology nodes -- Stalled Adult Hippocampal Neurogenesis, Neurogenic Niche Interferon Signaling Activation, Stress-Responsive Transcription Factor Reprogramming, and PENK+ GABAergic Interneuron Activation -- wired into the existing Neuroplasticity Deficits, Neuroinflammation and Excitation-Inhibition Imbalance nodes; a Memory Impairment phenotype (HP:0002354, no frequency asserted); three new evidence items on the existing Excitation-Inhibition Imbalance and Neuroplasticity Deficits nodes; and a KNOWLEDGE_GAP discussion with three proposed experiments covering causal direction, the MDD/suicide confound (40 of 55 MDD decedents died by suicide, no controls did), and the contested existence of adult human hippocampal neurogenesis.

    Deliberately not added: a datasets record for the study's Zenodo deposit (no `zenodo` prefix is supported by the dataset-accession guard), any treatment (the study identifies candidate targets but tests none), and any module conformance (no adult-neurogenesis module exists).

    Evidence discipline: because DOI is in the validator's skip_prefixes, snippet validation is a no-op for this reference. All 24 snippets were therefore verified by hand against text extracted from the supplied PDF, using a whitespace- and hyphenation-insensitive substring check to absorb PDF line-break artifacts; 24/24 matched. Snippets that would have spanned a superscript reference marker were trimmed rather than transcribed with the marker inline.

    Validation run: `just validate` (passed), `just validate-terms` (passed), `just count-verified-snippets` (76/101 verified, 25 skipped by prefix), `just check-duplicate-keys`, `just check-folded-hyphens`, `just check-snippet-length`, `just check-title-snippets`, `just check-environmental-evidence`, `just check-not4curation` (all passed), and `pytest tests/test_data.py -k Major_Depressive` (22 passed).

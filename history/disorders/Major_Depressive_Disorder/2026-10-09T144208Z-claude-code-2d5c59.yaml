  details: |
    Response to the ai4c-reviewer suggestions on PR #13755. (1) The SSRI target_mechanisms link to Monoamine Deficiency carried evidence only for the transporter-independent caveat and none for the primary reuptake claim. Added one HUMAN_CLINICAL, DIRECT, PRIMARY_RESULT item from PMID:15121647 (Meyer 2004, [11C]DASB PET in 77 subjects), quoting the finding that five SSRIs occupy about 80% of striatal serotonin transporters at minimum therapeutic doses. It sits first in the list so the reuptake mechanism is supported before the nematode qualifications. Reference cached with just fetch-reference. (2) Removed the updated_date line the previous commit added; CLAUDE.md deprecates the field and this entry did not carry it before. (3) The suggestion to move the SER-7 and ACh/GABA/glutamate items onto a separate node is deferred to the follow-up PRs under #13749, where a receptor-level node may be added. Validated with just validate-disorders, count-verified-snippets and check-entity-refs.

  summary: Add IL1B C-511T variant as severity/treatment-response modifier
  details: |
    Added the IL1B gene entry to the genetic section of Major Depressive Disorder, covering the C-511T (rs16944) promoter variant, sourced from the Gontijo et al. 2026 systematic review (PMID:42450240). Also expanded the Inflammatory Markers biochemical context from "IL-6, CRP, TNF-alpha" to include IL-1beta and IL-18, which the already-cited PMID:38474387 snippet names explicitly.

    Review follow-up (PR #7132, ai4c-reviewer CHANGES_REQUESTED), all three blocking items:

    1. The original entry used association "Risk Factor", which overstated the source. The review's own conclusion is that the CC severity and TT treatment-response findings "should not be considered equivalent in terms of susceptibility to disease onset", and that other studies found no significant association at all. Recurated with relationship_type MODIFIER, matching the enum definition (modifies severity, age of onset, or expressivity without being a primary driver). The free-text association slot now states the severity/response split and the non-equivalence caveat explicitly, and notes records the non-replication plus the review's call for further study. Two additional supports PARTIAL evidence items were added quoting the non-equivalence sentence and the null-findings sentence, so the counterweight is curated rather than left implicit.

    2. The biochemical explanation on the PMID:38474387 evidence item asserted that IL-1beta is implicated in "regulation of mood-related processes", a clause that comes from PMID:42450240 and not from the quoted snippet. The explanation is now scoped to what its own snippet supports (elevated cytokines linked to neuroinflammatory and peripheral inflammatory processes), and the mood-regulation claim was moved to its own evidence item citing PMID:42450240 with an exact quote. That item is tagged evidence_source OTHER because it is the review's background characterization of IL-1beta biology, not a study result.

    3. Added this history record, which was missing.

    Also addressed the two optional suggestions: rs16944 is now structured under the variants slot with identifiers dbSNP:rs16944, making it machine-queryable, and reference_title was added to every PMID:42450240 evidence item for consistency with the rest of the file.

    The branch was merged with origin/main to pick up the MAXO to NCIT treatment-term remap, without which the entry no longer passed term validation.

    Verification: all four PMID:42450240 snippets and the PMID:38474387 snippet were confirmed as exact substrings of the cached abstracts (71/72 snippets verified across the whole entry, 1 skipped by prefix).

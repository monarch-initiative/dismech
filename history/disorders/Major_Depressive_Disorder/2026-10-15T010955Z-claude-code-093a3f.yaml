  summary: 'Add knowledge gap: ketamine antidepressant mechanism unresolved'
  details: |
    Added KNOWLEDGE_GAP gap_mdd_ketamine_therapeutic_mechanism attached to the Ketamine/Esketamine treatment and its Excitation-Inhibition Imbalance target. Leads came from an OpenScientist report (research/drug_mechanism/Major_Depressive_Disorder-drug-mechanism-ketamine-deep-research-openscientist.md, 24/24 references resolved); every quote was re-checked against references_cache. Evidence: memantine failure (PMID:16390905), NMDAR-independent metabolite action in mice (PMID:27144355), BDNF not tracking response (PMID:42462931), naltrexone dissociation (PMID:30153752), and an explicit statement that the mechanism is unclear (PMID:39360294). A report claim that later trials failed to replicate the naltrexone result was not carried over: the cited study (PMID:41922981) concerns blood flow, not antidepressant response. The edge itself is unchanged.

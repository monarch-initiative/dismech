  summary: 'MDD: address review on Excitation-Inhibition Imbalance node'
  details: |
    PR Shepherd addressed the CHANGES_REQUESTED review (ai4c-agent) on the new
    "Excitation-Inhibition Imbalance" pathophysiology node added to MDD:
    1. Removed the GABRA1/GRIN1 genes block. Those genes are not mentioned in the
       cited paper PMID:42372880, which operates at the neurochemical-systems /
       neuroimaging level rather than the gene level. Rather than fabricate
       gene-specific citations, the unsupported genes block was dropped.
    2. Corrected the second evidence explanation to match its snippet. The snippet
       names GABAergic, opioidergic, serotonergic systems and synaptic density; the
       explanation previously claimed "GABAergic and glutamatergic" neurotransmission.
       It now reads GABAergic, opioidergic, and serotonergic neurotransmission and
       synaptic density.
    3. Added modifier: DYSREGULATED to the GABA Signaling, Glutamate Signaling, and
       Synaptic Plasticity biological_processes so the node carries the directional /
       regulatory claim the description makes, without overstating a specific up/down
       direction the imaging evidence does not establish. This mirrors the
       modifier usage in the epilepsy_excitation_inhibition_imbalance module.
    Validated with `just validate`, `just validate-terms`, and
    `just validate-references` (all pass).

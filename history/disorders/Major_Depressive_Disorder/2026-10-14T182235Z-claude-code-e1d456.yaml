  summary: Promote four already-cited mouse studies to animal_models
  details: |
    Added four mouse animal_models records built only from papers the entry already cited as evidence: serotonergic-neuron p38alpha MAPK conditional knockout under social defeat (PMID:21835346), linked to Monoamine Deficiency as PERTURBS; astrocyte-specific Fgf13 knockout and overexpression (PMID:42421017), Gsdmd/Casp1/astrocytic Nlrp3 knockouts under chronic mild stress (PMID:34877938), and microglial P2rx7/Il6 and astrocytic Il6ra knockdowns under chronic social defeat (PMID:39888279), each linked to Neuroinflammation as PARTIALLY_RECAPITULATES. All links are LOW fidelity with typed divergences, readouts and evidence quoted from the cached abstracts. The Fgf13 model now attaches to the FGF13 human-model mismatch discussion and the p38alpha model to the MAPK14 vitiligo knowledge gap. Two other cited rodent papers were not promoted: astrocytic Fgf2 (PMID:41545369) acts through a blood-brain-barrier route and FGF9 (PMID:26351673) through hippocampal FGF9, and neither has a matching pathophysiology node in this entry. A male-only population divergence was considered for the Fgf13 model and dropped because the cached text does not state the sex of the mice. Stress paradigms are recorded in prose because AnimalModel has no non-genetic perturbation slot (#13768). Validated with just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-duplicate-keys, check-enum-values, model-scale-audit and the snippet ratchets.

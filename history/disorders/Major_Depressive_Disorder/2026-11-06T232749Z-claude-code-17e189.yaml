  summary: Add combined chronotherapy treatment from PPR:PPR1317510 (narrative synthesis)
  details: |
    Added a treatment entry for combined chronotherapy (sleep deprivation plus light therapy) from the 2026 narrative review PPR:PPR1317510 (issue #12143). Two SUPPORT evidence items quote the review's abstract and are marked quote_role REVIEW_SYNTHESIS because the review synthesises trials it did not run. Treatment term NCIT:C49236 is the generic therapeutic-procedure class; NCIT:C174524 Bright White Light Therapy and NCIT:C15301 Phototherapy exist but cover only the light component, so the generic term was kept. Validated with validate-disorders, count-verified-snippets (211/211) and validate-terms.

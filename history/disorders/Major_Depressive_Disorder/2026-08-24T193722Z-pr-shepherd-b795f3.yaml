  details: |
    Addresses the three IMPORTANT findings in the ai4c-reviewer CHANGES_REQUESTED review of PR #9377, all on the "Stalled Adult Hippocampal Neurogenesis" pathophysiology node.

    1. "Neural stem cell quiescence" was bound to GO:0019827 stem cell population maintenance / INCREASED, which names the wrong concept - the node's own evidence reports "impaired neurogenic progression rather than depletion of stem-like cells", i.e. accumulation at a quiescent state, not harder-running stem-cell maintenance. The binding is removed and the descriptor left as free text with an NTR note in its description. The concept-exact GO:0044838 cell quiescence, which the reviewer proposed, was checked and rejected: it is a GO biological-phase term whose own comment states it "should not be used for direct annotation". GO has no neural-stem-cell quiescence term. The modifier INCREASED is retained on the now-unbound descriptor. GO:0007405 neuroblast proliferation / DECREASED continues to carry the load-bearing half of the claim.

    2. GO:0010001 glial cell differentiation / INCREASED outran its snippet. The quoted sentence is subject-less generic SOX9 biology with no MDD-versus-control comparison. The study's finding of SOX9 elevation in MDD intermediate neural progenitors could not be added as a second quote, because the cached record for DOI:10.1038/s41591-026-04571-8 is metadata-only with content_type unavailable - fabricating a snippet is not an option. Took the reviewer's stated alternative: the evidence item is downgraded from SUPPORT to PARTIAL with a rewritten explanation, and the annotation is softened by dropping the INCREASED modifier so the descriptor makes no directional claim.

    3. The cell_types entry "Intermediate neural progenitor / neuroblast" bundled the two lineage stages between which the mechanism stalls. Split into "Intermediate neural progenitor" bound to CL:0011020 neural progenitor cell, unchanged, and "Neuroblast" bound to CL:0000031 neuroblast sensu Vertebrata. CL:0000031 was already present in cache/cl/terms.csv; validation added its row to cache/enums/celltypeterm_a43e4ab67bda.csv.

    Validation run on this branch: just validate passed for schema and ontology terms; count-verified-snippets reported 76/101 verified with 25 skipped by prefix, unchanged from before this edit, since all DOI-referenced snippets are skip-prefixed as the previous review noted; check-duplicate-keys, check-folded-hyphens, check-snippet-length and check-title-snippets are all clean. check-environmental-evidence reports 5 findings when diffed against the tip of origin/main, all in Heart_Failure, Lyme_Disease and Merkel_Cell_Carcinoma - files this PR does not touch - and is clean when diffed against the merge base, so those are branch-staleness artifacts rather than regressions.

    Reference caches that the validator opportunistically enriched with full text during this run were reverted as out-of-scope churn.

    The reviewer's non-blocking items were left for the PR author: the node name versus description mismatch on "Neurogenic Niche Interferon Signaling Activation", the variant context that belongs in notes, and the missing cell_types block on "Stress-Responsive TF Reprogramming".

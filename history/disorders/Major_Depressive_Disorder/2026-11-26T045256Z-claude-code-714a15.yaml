  summary: 'Gene-family review: BDNF'
  details: |
    The BDNF Val66Met record carried only 'Risk Factor' and no evidence. Typed it DISPUTED with germline origin: a 2023 meta-analysis of 24 case-control studies found no overall association with MDD and an association only in the White-ancestry subgroup (PMID:37415688), while a gene-environment meta-analysis of 22 studies supports the Met allele moderating the effect of stressful life events (PMID:24433458). Both directions are cited.

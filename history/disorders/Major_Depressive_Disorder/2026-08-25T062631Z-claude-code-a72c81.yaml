  summary: Add psilocybin-assisted therapy treatment
  details: |
    Added a Psilocybin-Assisted Therapy treatment to Major Depressive Disorder citing PMID:42562964 (Rucker et al., Nat Med 2026), a single-site NHS feasibility RCT of single-dose 25-mg psilocybin with psychological support. Bound therapeutic_agent to CHEBI:8614 (psilocybin) alongside the generic NCIT:C15986 Pharmacotherapy action term. Calibrated prose to what a feasibility trial establishes: the description and evidence explanations now state that primary outcomes were recruitment, retention and MADRS variance estimation, so the week-3 between-group MADRS difference of -10.41 (Cohen's d = -1.70) is an effect-size estimate rather than a powered efficacy endpoint. The target_mechanisms link to Neuroplasticity Deficits is labelled a hypothesis because the cited trial reports no mechanistic data. Added a notes field recording investigational status and EudraCT 2018-003573-97, plus a PARTIAL evidence item for the nonserious adverse-event counts. Validated with just validate, just validate-terms and just count-verified-snippets.

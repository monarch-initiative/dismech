  details: |
    Added KNOWLEDGE_GAP discussion gap_mdd_risk_gene_function_without_liability_node attached to genetic#SLC6A4, genetic#HTR2A and pathophysiology#Reference Point Dysregulation. It records Sall 2021 (PMID:34335334) as a conservation and network analysis of MDD GWAS risk genes, and Ajayi 2024 (PMID:38362034) and Dustin and Dwyer 2026 (PMID:41986315) as foraging-immobility panels of suicidality-related risk genes. None of the entry's five genetic-block genes is in either panel, so the panels were deliberately not curated as AnimalModel records. One proposed experiment names the worm orthologs of the entry's own serotonin genes for the same assay. Seven evidence items, all exact quotes from fetched references, including a table footnote that lithium exacerbated the phenotype in some strains. No deep-research provider was used for this change. Validated with just validate-disorders, count-verified-snippets and check-entity-refs.

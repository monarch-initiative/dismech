  summary: 'Definitions: DSM-5 diagnostic rule as criteria sets'
  details: |
    Added a DIAGNOSTIC_CRITERIA definition encoding the DSM-5 rule stated in the StatPearls MDD chapter (PMID:32644504): a core set (at least 1 of depressed mood or anhedonia) and a symptom-count set (at least 5 of the nine symptoms, with social or occupational impairment, excluding a history of manic or hypomanic episodes). Both sets are required, as the description states. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

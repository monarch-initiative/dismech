  summary: 'Phenotypes: DSM-5 symptom evidence and three new HPO-bound symptoms'
  details: |
    Added Feelings of Worthlessness (HP:0031469 Low self-esteem, exact synonym Worthlessness), Excessive Guilt (HP:6000011) and Suicidal Ideation (HP:0031589). Concentration Difficulties was rebound from HP:0100543 Cognitive impairment to HP:0031987 Diminished ability to concentrate. The seven existing DSM-5 symptom phenotypes, which had no evidence, now cite the StatPearls Major Depressive Disorder chapter (PMID:32644504, newly cached, tagged StatPearls in references), whose abstract lists the nine DSM-5 symptoms in one sentence; explanations state that the source does not support the frequency bands. The Psychomotor Changes note that psychomotor retardation has no live HPO term was re-checked against HPO 2026-09-01: HP:0025356 Psychomotor retardation is obsolete and the remaining psychomotor-retardation synonyms belong to developmental-delay terms. Validated with just validate-disorders (all snippets verified).

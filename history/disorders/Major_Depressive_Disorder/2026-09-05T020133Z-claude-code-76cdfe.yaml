  summary: 'Integrate assessed OpenScientist findings: parallel FGF9 route in the
    FGF13-JIP2-JNK gap'
  details: |
    Reviewed the OpenScientist hypothesis report for astrocytic_fgf13_jip2_jnk_cell_death_model against the existing codex assessment sidecar (openscientist-assessment-by-codex.yaml, verdict PARTIALLY_SUPPORTED); no second assessment was written. Worked the assessment's RETAINED and QUALIFIED claims one by one against the entry. bidirectional-mouse-model-evidence, jip2-jnk-biochemical-conflict, fgf2-parallel-mechanism, human-fgf13-context and curation-disposition were already curated (PMID:42421017, PMID:12244047, PMID:41545369, PMID:32341540, PMID:15483108 all cited; status EMERGING retained; the HUMAN_MODEL_MISMATCH discussion gap_mdd_fgf13_jip2_jnk_human_validity already records the p38delta-versus-JNK conflict and the sex/region restrictions). The one uncurated claim was fgf9-evidence-context. Integrated it into that discussion: two evidence items from PMID:26351673, split by evidence_source because the paper mixes a postmortem human series (hippocampal FGF9 transcript elevated in MDD and reciprocal to FGF2) with bidirectional rodent manipulation of hippocampal FGF9 that moves anxiety- and depression-like behavior, plus one rationale sentence recording that FGF-family change in MDD is directionally family-member-specific and so is not settled by an FGF13 loss model. Deliberately not integrated: PMID:37705188, listed as an uncited lead, because it is a progressive-multiple-sclerosis neurodegeneration study whose only MDD sentence is a background premise drawn from earlier work rather than a finding of its own; the assessment QUALIFIED the report's use of it for exactly that reason. Also not integrated: the report's female-null prediction and its search-verified genetic-absence claim, both REJECTED by the assessment, and its proposed new pathophysiology nodes or FGF13-directed treatment, which the assessment's curation-disposition claim rules out. No status change, no new pathophysiology node or causal edge.

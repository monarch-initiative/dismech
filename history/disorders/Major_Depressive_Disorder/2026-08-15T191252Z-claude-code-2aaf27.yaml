  summary: Cite 3 evidence-free environmental exposures, issue 8296 tranche 4
  details: |
    Attached verified evidence to the three previously uncited environmental exposures.
    Chronic Stress already carried evidence and was left alone.

    Childhood Trauma: PMID:27908895, a meta-analysis of 184 studies. The note was extended
    beyond "strong risk factor" to record what the source additionally establishes -- earlier
    onset and a more chronic or treatment-resistant course.

    Social Isolation: the note claimed "risk factor and consequence", which is two directional
    claims, so both are evidenced. PMID:35583561 is a systematic review of 32 longitudinal
    general-population studies for the risk direction; PMID:39036816 is a random-intercept
    cross-lagged panel analysis that shows the reverse path as well. The explanation records
    that the second is a university cohort in emerging adulthood and so is not a
    general-population estimate.

    Substance Abuse: PMID:22987574, a twelve-year national cohort, evidences both directions
    but only for alcohol dependence -- non-dependent drinking, including binge drinking, did
    not predict depressive episodes. The note was qualified accordingly rather than left as a
    blanket claim about substance use. PMID:24246605 adds the developmental staging.

    Validation: just validate, just count-verified-snippets with every new snippet verified
    against its cached abstract, the batched just validate-disorders sweep, and
    just check-title-snippets.

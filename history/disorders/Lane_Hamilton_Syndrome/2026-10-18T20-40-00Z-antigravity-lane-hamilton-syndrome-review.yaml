  summary: Curate and review Lane Hamilton Syndrome across pathophysiology, phenotypes, biochemical, environmental, treatments, differential_diagnoses, synonyms, classifications, prevalence, progression, diagnosis.
  details: 'updated `pathophysiology` (4 -> 4 entries) — added: Alveolar hemorrhage, Type II pneumocyte hyperplasia — enriched/updated: Gluten-triggered intestinal autoimmunity in celiac disease, Immune-mediated increase in pulmonary capillary permeability — removed: Alveolar hemorrhage and hemosiderin accumulation, Iron and heme-driven oxidative injury and chronic remodeling

    updated `phenotypes` (6 -> 7 entries) — added: Pulmonary fibrosis — enriched/updated: Diffuse alveolar hemorrhage, Hemoptysis, Iron-deficiency anemia, Dyspnea, Ground-glass opacities on chest imaging, Malabsorption

    updated `biochemical` (6 -> 5 entries) — added: Tissue Transglutaminase (tTG) and Celiac Autoantibodies — enriched/updated: Serum Iron, Serum Ferritin, Hemoglobin/Hematocrit, Hemosiderin-laden Macrophages — removed: Tissue Transglutaminase (tTG) Antibodies, Anti-endomysial Antibodies

    populated `environmental` (1 entries: Dietary Gluten Exposure)

    updated `treatments` (3 -> 3 entries) — enriched/updated: Gluten-free diet, Corticosteroids, Immunosuppressive therapy

    updated `differential_diagnoses` (5 -> 3 entries) — enriched/updated: Idiopathic pulmonary hemosiderosis (IPH) without celiac disease, Vasculitis-associated pulmonary hemorrhage (ANCA-associated vasculitis), Goodpasture syndrome (anti-glomerular basement membrane disease) — removed: Immunoglobulin A (IgA) nephropathy with pulmonary involvement, Acute leukemia with leukostasis and pulmonary hemorrhage

    populated `synonyms` (2 entries: LHS, Celiac disease-idiopathic pulmonary hemosiderosis syndrome)

    populated `classifications` (harrisons_chapter=[{''classification_value'': ''RESPIRATORY'', ''evidence'': [{''reference'': ''PMID:35912848'', ''reference_title'': ''Celiac disease and idiopathic pulmonary hemosiderosis: a literature review of the Lane-Hamilton syndrome.'', ''supports'': ''SUPPORT'', ''evidence_source'': ''HUMAN_CLINICAL'', ''snippet'': ''Lane-Hamilton syndrome (LHS) presents a medical emergency, with 14% mortality due to Idiopathic Pulmonary Hemosiderosis (IPH) in acute phase.'', ''explanation'': ''Establishes Lane-Hamilton syndrome as a pulmonary hemosiderosis disorder.''}]}, {''classification_value'': ''GASTROINTESTINAL'', ''evidence'': [{''reference'': ''PMID:35912848'', ''reference_title'': ''Celiac disease and idiopathic pulmonary hemosiderosis: a literature review of the Lane-Hamilton syndrome.'', ''supports'': ''SUPPORT'', ''evidence_source'': ''HUMAN_CLINICAL'', ''snippet'': ''Celiac disease (CD) and IPH diagnosis was made concurrently in 46 patients, whereas in 21 patients, the diagnosis of LHS was delayed for 2.5y (3 months-11 years).'', ''explanation'': ''Establishes celiac disease as the core gastrointestinal component of Lane-Hamilton syndrome.''}]},
    {''classification_value'': ''IMMUNE_RHEUMATOLOGIC'', ''evidence'': [{''reference'': ''PMID:35088581'', ''reference_title'': ''Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years.'', ''supports'': ''SUPPORT'', ''evidence_source'': ''HUMAN_CLINICAL'', ''snippet'': ''Nearly one-third of pediatric patients with IPH test positive for Celiac disease (CD) serology. Several hypothetical mechanisms have been proposed to unify the coexistence of these two entities, also referred to as Lane-Hamilton syndrome (LHS).'', ''explanation'': ''Supports autoimmune/immunologic classification of Lane-Hamilton syndrome.''}]}])

    populated `prevalence` (1 entries: Published cases (1971-2020 literature review))

    populated `progression` (2 entries: Pediatric or young adult onset, Chronic recurrent hemorrhage and fibrotic progression if untreated)

    populated `diagnosis` (3 entries: Bronchoscopy with Bronchoalveolar Lavage, Celiac Disease Serologic Testing, Duodenal Endoscopic Biopsy)


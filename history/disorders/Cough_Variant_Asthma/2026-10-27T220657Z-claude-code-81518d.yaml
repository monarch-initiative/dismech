  summary: Refine the bronchodilator agent to a beta-2 agonist and wire the treatment
    to the beta2 module
  details: |
    The Bronchodilator Therapy treatment bound the generic NCIT:C319 Bronchodilator agent, which spans beta-2 agonists and muscarinic antagonists alike. This entry was initially assumed to be a bundle of the two classes, like the COPD treatment changed in the same pass, and it is not: the treatment's own description says 'Short-acting beta-2 agonists provide symptomatic relief' and its evidence snippet says cough is 'responsive to bronchodilators such as beta-agonists in CVA'. The treatment was already single-class in its own text; only the agent binding was less specific than the text it sat on. So this is a refinement of one binding, not a split, and the treatment is otherwise untouched.

    Rebound to NCIT:C48149 Beta-Adrenergic Agonist with preferred_term 'short-acting beta-2 agonist'. No beta-2 selective class term exists in NCIT or CHEBI, so the general class is the most specific accurate term and the selectivity is carried in preferred_term.

    The treatment name, Bronchodilator Therapy, is left as it is. It reads as under-specific beside the new agent binding, but the entry's point is that bronchodilator responsiveness of the cough is what distinguishes CVA from non-asthmatic eosinophilic bronchitis, so the name is carrying the diagnostic framing rather than naming the drug class. Renaming it would also be editing another curator's choice for no gain in correctness.

    A Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors node was added as a therapeutic_vulnerability conforming to beta2_adrenergic_receptor_agonism, and the treatment reaches it through target_mechanisms with treatment_effect ACTIVATES. The node carries no downstream edge, since its relation to airway hyperresponsiveness is reversal rather than causation. Its description records that in CVA the reversal is diagnostic as well as therapeutic.


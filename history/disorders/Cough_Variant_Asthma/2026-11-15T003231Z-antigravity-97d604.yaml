  summary: Add synonyms, wire pathophysiology causal chain to all phenotypes, and
    enrich progression, prevalence, treatments, diagnosis, and differential diagnoses
  details: |
    Added synonyms (cough-variant asthma, CVA, Corrao syndrome) resolving check-genereviews strict validation, and added evidence_source: HUMAN_CLINICAL to has_subtypes. Wired causal downstream edges across Eosinophilic Airway Inflammation, Airway Hyperresponsiveness, Cough Reflex Hypersensitivity, and Small Airway Dysfunction to all four phenotypes (Chronic Dry Cough, Nonproductive Cough, Abnormal Laryngopharyngeal Sensations, Wheezing) using cached clinical evidence (PMID:34164212, PMID:35127763, PMID:39534772, PMID:39557293). Added progression block documenting the 30-40% progression rate to classic asthma, enriched prevalence with measure_type and prevalence_class, bound therapeutic_modality, CHEBI agents (budesonide CHEBI:3207, montelukast CHEBI:50730), and target_mechanisms on treatments, bound NCIT:C38081 on Methacholine Bronchial Provocation Test, and added differential_diagnoses for Non-Asthmatic Eosinophilic Bronchitis and Refractory Chronic Cough.

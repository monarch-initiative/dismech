  summary: Delayed Puberty frequency band; subtype dosing and infection rate
  details: |
    Acted on the round-three review of PR 10849. The blocking item was a self-inconsistency: Delayed Puberty was left at FREQUENT while the description directly beneath it stated that the systematic series counts delayed puberty inside the same 16 of 103 hypogonadism figure. I had corrected the sibling Hypogonadotropic Hypogonadism band in the previous round and missed its dependent, which is the failure mode of correcting one member of a pair. Now OCCASIONAL, carrying the same age caveat: unobservable before pubertal age since the cohort is mostly small children in whom puberty cannot yet be late, and effectively obligate after, since all 12 adult patients showed hypogonadism. Also took two non-blocking suggestions, both verbatim from the already-cached full text. The Classical subtype now records the standard metreleptin starting dose of 0.03 mg per kg lean body weight, which makes concrete the contrast with the antagonistic subtype that requires higher initial doses. The Bioinactive subtype now records that recurrent or severe infection is significantly more common there than in classical deficiency at 45 percent versus 16 percent, the one comorbidity reported to differ significantly between subtypes, with a note that the entry-level infection frequency therefore understates risk for those patients. Both snippets were extracted programmatically from the cache rather than retyped, because one contains a four-per-em space inside the dose figure and the other contains the source own signicantly typo, and an exact-substring match required reproducing both. Snippets went from 48 to 50, all verified; schema, term, grading, length, folded-hyphen, duplicate-key, enum, entity-ref and causal-target checks all pass.

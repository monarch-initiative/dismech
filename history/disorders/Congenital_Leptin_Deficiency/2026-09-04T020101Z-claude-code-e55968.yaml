  summary: 'Create: Congenital Leptin Deficiency'
  details: |
    Curated a new Disease entry for congenital leptin deficiency (MONDO:0013991) from the stub queue, resolving entry_type as DISEASE rather than folding it into Obesity_Due_to_MC4R_Pathway_Disruption. That umbrella entry is explicitly mechanism-based, binds the broad MONDO:0011122 obesity disorder term, and its LEP subtype carries a one-line description with no MONDO binding and no pathograph; the LEP-specific chain, the reproductive and immune arms, and the metreleptin mechanism are not properties of the umbrella. Five pathophysiology nodes: absent or bioinactive leptin, failure of hypothalamic leptin signaling, unopposed orexigenic drive, starvation-pattern neuroendocrine suppression, and impaired T cell number and function. Six phenotypes, a LEP genetic block covering both the null and bioinactive allele classes, autosomal recessive inheritance, and metreleptin with four target_mechanisms links. All 28 evidence snippets verified against the local reference cache; schema and term validation pass. Recalled PMIDs were deliberately not trusted: every reference was resolved through a PubMed lookup and its cached title checked before use, after an initially recalled identifier turned out to name an unrelated paper.

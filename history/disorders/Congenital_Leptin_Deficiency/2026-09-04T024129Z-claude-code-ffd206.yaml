  summary: Connect Hyperinsulinemia; add prevalence and diagnosis
  details: |
    Applied proactively the class of findings the reviewer raised on the sibling PR 10852, after auditing all five entries from this curation run for the same defects. Hyperinsulinemia was an orphan node in the pathograph; it is now a sequela of Severe Early-Onset Obesity with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, since it follows from adipose expansion and insulin resistance rather than directly from absent leptin signalling. Added a CASES_IN_LITERATURE prevalence record at ULTRA_RARE quoting the fewer-than-20-carriers figure, with a note that bioinactive-variant cases present with normal or high measured leptin and so are likely undercounted. Added a diagnosis block for circulating leptin measurement plus LEP sequencing; this carries the LEP versus LEPR discriminator, undetectable versus extremely elevated leptin, which is the entry's main Named Entity Confusion guardrail expressed as a clinical test, together with the caveat that detectable leptin does not exclude the diagnosis. Both sections use quotes already in the local reference cache; no new references were fetched. All 31 snippets verified; schema, term and offline gates pass.

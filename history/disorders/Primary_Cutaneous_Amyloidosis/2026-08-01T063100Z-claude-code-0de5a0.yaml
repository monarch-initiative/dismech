  summary: 'Create: Primary Cutaneous Amyloidosis (MONDO:0015301)'
  details: |
    Created the primary cutaneous amyloidosis (PLCA) entry as a CURATE_ROOT_WITH_SUBTYPES target and as a conformer of the amyloidogenesis mechanism module. Seven subtypes modelled via has_subtypes with MONDO subtype_term bindings: lichen (MONDO:0018856), macular (MONDO:0015303), biphasic, nodular (MONDO:0015302), amyloidosis cutis dyschromica (MONDO:0017906, GPNMB/AR), familial PLCA (MONDO:0007101, OSMR/IL31RA/AD), and MEN2A-associated cutaneous lichen amyloidosis (RET). Nine pathophysiology nodes; five declare conforms_to against amyloidogenesis, substituting keratinocyte-derived keratin 5/14 for the generic circulating precursor and the papillary dermis for the systemic deposition site. Disease-specific additions beyond the module: the itch-scratch-friction feedback loop (no module equivalent), the OSM/IL-31 receptor signalling-failure genetic entry point, a separate AL/plasma-cell trigger for nodular disease, and a GPNMB route. Two discussions recorded: a KNOWLEDGE_GAP on whether the small-fibre neuropathy causes or follows the pruritus (conflicting innervation literature), and a HUMAN_MODEL_MISMATCH on the Osmr-null mouse reproducing the keratinocyte but not the amyloid phenotype, each with structured proposed_experiments. Deep research: the falcon/Edison provider named in issue #7579 was unavailable (no EDISON_API_KEY or FUTUREHOUSE_API_KEY; deep-research-client reported claude_code as the only available provider), so claude_code was used and this deviation is recorded in the entry notes. All DR output was treated as leads only: every PMID was fetched with just fetch-reference and every snippet verified against the cached abstract. This caught two real errors: a DR-suggested NCIT term set that OAK resolved to wrong labels (corrected to CHEBI:50858 corticosteroid, NCIT:C162455 Dupilumab, NCIT:C15419 Disease Screening), and one snippet of my own that had been stitched across a sentence boundary in PMID:26748444. Validation: just validate passes (schema, terms, references), 76 of 76 snippets verified against cached references, weighted compliance 90.0 percent, and the 1726 conformance and foreign-key tests in tests/test_data.py pass.

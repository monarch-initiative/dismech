  summary: 'Address PR #7619 review: diagnosis section, treatment gaps, notes fix'
  details: |
    Addressed all six IMPORTANT findings and all five SUGGESTIONS from the automated review of PR #7619. IMPORTANT: (1) removed the unsupported 'limited systemic sclerosis' association from top-level notes and aligned its Sjogren wording with the calibrated language already used in the Nodular Amyloidosis subtype - I had fixed the subtype in my pre-PR red-team pass but missed the notes block, and my PR description wrongly claimed otherwise; (2) added the missing HP:0032347 Cutaneous macular amyloidosis phenotype, so all three subtype signs (lichen HP:0032346, macular HP:0032347, nodular HP:0032348) are now present; (3) added a new diagnosis section with six entries - Congo red skin biopsy, proteomic/IHC amyloid typing, dermoscopy, systemic AL screening, RET cascade testing, and OSMR/IL31RA genetic testing; (4) moved 'Systemic Amyloidosis Screening in Nodular Disease' out of treatments into diagnosis where it belongs as a diagnostic procedure; (5) gave the RET/MEN2A cascade real evidence - near-100 percent MTC penetrance quoted from PMID:30085596 and the CLA-precedes-MTC ordering from PMID:42194535 - on both the subtype and a dedicated cascade-testing diagnosis entry, deliberately NOT asserting the 'precedes by a decade' lead time because the cited case report supports precedence but not a typical interval; (6) treatments - swapped generic NCIT:C20401 for the specific NCIT:C170211 Nemolizumab, and added phototherapy (NCIT:C15301), laser/procedural therapy (NCIT:C15466), and friction avoidance/supportive care (NCIT:C15747), the last targeting both the itch-scratch-friction node and the keratinocyte-damage node so the treatment-to-pathograph join is now complete. SUGGESTIONS: closed the pathograph loop with a deposition-to-pruritus edge for the OSMR-wildtype sporadic majority; split the bundled 'GPNMB Loss and Melanocyte Depletion' node into a MOLECULAR 'GPNMB Loss of Function' trigger and a CELLULAR 'Melanocyte Depletion' consequence that now connects to the Hypopigmented Macules phenotype instead of dead-ending; added a progression section with genotype-stratified onset (median 32y heterozygous, 20y homozygous, prepubertal in ACD) and nodular systemic-progression surveillance; added sex-ratio content as a prevalence record (9:1 female:male in an Iranian macular cohort, with the authors' own caveat that this is an outlier) plus the OSMR-genotype-dependent sex skew on the gene entry. Four new references fetched and verified: PMID:41389140, PMID:39957318, PMID:28342017, PMID:39119323. Every new NCIT and HP term verified with OAK before use. Validation: just validate, validate-terms and validate-references all pass, 103/103 snippets verified (up from 78), check-folded-hyphens clean, weighted compliance 89.9 percent, 3568 conformance and foreign-key tests pass.

  summary: 'Create: BBOX1-Related Carnitine Biosynthesis Deficiency'
  details: |
    New entry for the fourth and final step defect of endogenous L-carnitine biosynthesis (IEMbase WP-010 row 4.1.06.01), unblocked by the 2025 first clinical report (PMID:41022783, npj Genomic Medicine; three patients from two unrelated families).

    Pathograph: BBOX1 loss of function -> blocked terminal biosynthetic step -> gamma-butyrobetaine accumulation and systemic L-carnitine deficiency -> reduced carnitine shuttle flux and impaired fatty acid beta-oxidation -> skeletal muscle energy deficit. A separate EMERGING hypothesis group, gamma_butyrobetaine_toxicity, carries the proposed independent substrate-toxicity / carnitine-transport-competition arm, whose supporting data are invertebrate and whose mechanism the authors label presumed.

    Two C. elegans gbh-1 models are wired in through modeled_mechanisms with readouts, including a FAILS_TO_RECAPITULATE link recording that the worm equivalent of the family 1 compound-heterozygous genotype is phenotypically normal. Three discussions: two KNOWLEDGE_GAP (penetrance, against the 2014 homozygous-deletion patient in PMID:24986124 and gnomAD homozygous truncating alleles; and attribution of the neurodevelopmental/psychiatric features) plus one HUMAN_MODEL_MISMATCH with a proposed human muscle fatty-acid-oxidation-flux experiment.

    Left deliberately without a top-level disease_term: no MONDO class and no OMIM phenotype entry exist yet (OMIM 603312 is the gene record), and the nearest MONDO terms are either a sibling concept (MONDO:0017716, carnitine cycle and transport) or the SLC22A5 disorder this entry is explicitly distinguished from (MONDO:0008919). A ready-to-file MONDO NTR is posted on issue #5565 for a curator to forward upstream.

    Validation: just validate PASS, just validate-terms PASS, 52/52 evidence snippets verified against the reference cache, and check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean. All three reference cache files were created by just fetch-reference and never hand-edited.

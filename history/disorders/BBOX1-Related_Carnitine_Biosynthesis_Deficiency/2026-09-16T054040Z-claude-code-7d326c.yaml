  details: |
    PR Shepherd review round for #10206. All four blocking items came from inside the single cited paper (PMID:41022783), already cached, so no new reference was fetched.

    1. Mild cardiomyopathy was absent from phenotypes. Added, bound to HP:0001638, with the index patient's resolution by age 18 in the description. Also wired into the pathograph: the beta-oxidation node now has a downstream edge to it, on the strength of the same sentence that node already quotes, which names cardiac alongside skeletal muscle energy metabolism as carnitine-dependent.

    2. Fasting intolerance and the infantile episodes were absent, and the pathograph terminated in muscle only. Added a pathophysiology node 'Impaired Hepatic Ketogenesis During Fasting' (GO:0046951, DECREASED) downstream of the beta-oxidation node, with two phenotypes downstream of it: 'Fasting Intolerance' and 'Episodic Infantile Lethargy and Irritability'. The node description states what was not shown - ketones were never measured during the episodes - so it reads as an inference from carnitine's established role plus a fasting-responsive clinical picture, not a measured ketogenic defect.

    The paper's internal disagreement is curated rather than resolved. The prose says hypoglycemia was not documented in patient 1; Table 1 marks hypoglycemia '+' in his column. The prose side is a REFUTE evidence item on Fasting Intolerance. The Table 1 side is recorded in notes rather than quoted: its columns are separated by em spaces (U+2003) and a single cell is not a propositional sentence - check-snippet-length rejected the cell snippet on exactly that ground, and it was right to.

    Fasting Intolerance is deliberately left unbound. HPO's only 'fasting' term is HP:0003162 Fasting hypoglycemia, and binding it would assert the one thing the report contradicts itself about. Episodic Infantile Lethargy and Irritability is bound to HP:0000737 Irritability, which covers half the episode; HP:0011973 Paroxysmal lethargy covers the other half. Neither covers the compound episode and the slot takes one term, so the preferred_term carries the full description. Both choices are recorded in the phenotypes' own notes.

    3. Co-occurring FAO variants were not curated as confounders. Added to the bbox1_genotype_phenotype_penetrance discussion as a fourth line of the penetrance argument, with three evidence items: patient 3's homozygous CPT1A p.Pro479Leu (a mild CPT1 deficiency allele, ~11% allele frequency in the Indigenous Background Variant Library, which bounds a rarity-based pathogenicity argument in that population), the authors' own counter-argument that patient 3's symptoms have not been associated with it (carried as REFUTE so both sides are recorded), and patient 1's heterozygous ACADL frameshift and RYR1 VUS.

    4. No deep-research artifact. Recorded as a scoped decision in entry-level notes rather than manufacturing one: the disease had no published clinical description before 2025, the whole literature is the three cached references, and the review's findings were misses from inside the cited paper rather than missing literature, which a DR run would not have caught.

    Non-blocking suggestion taken: six single-patient findings banded OCCASIONAL were re-banded FREQUENT. One of three patients is 33%, which is inside FrequencyEnum's FREQUENT band (30-79%), not OCCASIONAL (5-29%). Entry-level notes now record that every band here is a three-patient denominator artifact and will need redoing against a real cohort.

    Merge with origin/main: conflicts were confined to two sorted cache CSVs (cache/enums/molecularfunctionterm and cache/hgnc/terms). Resolved by taking the union of both sides and re-running just normalize-cache for canonical ordering; no row was hand-written. The KB file itself merged cleanly.

    Validation: just validate passed with 61/61 snippets verified (up from 52/52); validate-terms passed; check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-term-cache-integrity, check-folded-hyphens, check-snippet-grading, check-title-snippets and check-snippet-length all clean.

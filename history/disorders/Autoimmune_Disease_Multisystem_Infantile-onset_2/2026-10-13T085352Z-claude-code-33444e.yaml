  summary: 'Pre-PR review round: correct two claim/source contradictions and wire
    the immunodeficiency arm'
  details: |
    Two independent pre-PR reviews (one red-team against the dismech-pr-review skill, one using the repository reviewer's own prompt) each found the same substantive problems; both were verified against the cached sources before changing anything. First, the entry argued that homozygosity for the hypomorphic allele produces immunodeficiency 'not this autoimmune syndrome' and called that direct evidence that the activating allele is required for autoimmunity, while the snippet pinned to that claim says those patients had immunodeficiency AND autoimmunity in the absence of activating mutations; the comparison is now scoped to the antibody-defined constellation and the paper's own open question ('it remains unclear as to how these mutations lead to autoimmunity') is cited beside it. Second, notes claimed the primary report contradicted a decreased pneumococcal antibody response, but its Table 1 shows three of four serotypes below the protective threshold printed in the same rows; that phenotype is now curated from the table, the false justification is replaced by a paragraph on the narrative-versus-table discrepancy, and the PHA description no longer calls a 2.4 percent response against a 49.9 percent floor a partial defect. Added phenotypes for low IgM, raised IgE and linear basement-membrane IgG deposition; wired the immunodeficiency arm of the causal chain (hypomorphic allele to CD8 count and to mitogen response) and completed the renal chain, raising phenotype connectivity from 62.5 to 80 percent; regraded four evidence items from HUMAN_CLINICAL or IN_VITRO to COMPUTATIONAL or IN_VITRO where the quoted text describes structural modelling or an ex vivo assay; added quote_role REVIEW_SYNTHESIS to review-sourced items; added onset descriptors, a corticosteroid therapeutic_agent, evidence on five previously bare edges, and IUIS's own sentence that ZAP70 has two entries and thus two different disorders. Mined the GeneReviews tag on the ZAP70-deficiency differential where its subject is correct, and added MONDO:0014861 to that differential row in ZAP70_Deficiency.yaml so the pair is navigable. HP:0002850 carries HPO's older cached label because re-deriving the row would break the ten other entries using it; reported on issue 11750. Removed four passages of process narration from notes. just validate-disorders passes over both files (206 snippets, terms clean); compliance 93.9 percent.

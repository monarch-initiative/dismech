  summary: 'Create: Autoimmune Disease, Multisystem, Infantile-Onset, 2 (ADMIO2)'
  details: |
    Curated de novo from the OpenScientist deep-research report (research/Autoimmune_Disease_Multisystem_Infantile-onset_2-deep-research-openscientist.md; 19/19 citations resolved, needs_review set for term-label mismatches, just preflight-dr PASS against MONDO:0014861 with ZAP70 mentioned 61 times). Entry-type decision: DISEASE, a separate entry rather than a has_subtypes row on ZAP70_Deficiency, because IUIS lists the two as distinct rows with distinct OMIM numbers (617006 vs 269840) and the mechanisms are opposite; ZAP70_Deficiency already holds this entity in differential_diagnoses for the same reason. Curation drew on the primary report (PMID:26783323), the R360P knock-in mouse (PMID:33531381), the Ashouri review (PMID:34923645), IUIS 2024 (PMID:41608114) and the homozygous-R192W immunodeficiency series (PMID:37313400). Validated with just validate-disorders (79/79 snippets, terms clean), just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-coarse-phenotypes, just check-genereviews --online (no chapter for this entity; the gene chapter PMID:20301777 is tagged and the absence is recorded in notes), and the whole-KB offline gates. Compliance 92.4 percent. Two report-proposed annotations were refused: a decreased pneumococcal antibody response that the primary report contradicts, and HP:0031540 whose canonical label names the immunofluorescence finding rather than the diagnosis. No gene_disease_validity recorded because ClinGen classifies ZAP70 only for MONDO:0010023. The curation stub was deleted.

  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11205.

    Fixed: the CRITICAL finding was real and was mine. pathophysiology[0].molecular_functions bound GO:0006457 (protein folding), which is a GO biological process and is absent from cache/enums/molecularfunctionterm_305077eac108.csv. The previous history record claimed every bound term was checked against the dynamic-enum cache; that claim was wrong for this one term, because the term-validation run that would have caught it aborted on MONDO:0008025 before reaching it and I did not check GO:0006457 against the molecular-function enum by hand. Rebound to GO:0044183 (protein folding chaperone), which is in the molecular-function enum cache. Deliberately NOT the reviewer's suggested GO:0140662 (ATP-dependent protein folding chaperone): HSPB8 is a small heat shock protein and small heat shock proteins are ATP-independent holdases, so that term would assert an activity HSPB8 does not have. GO:0044183 is the parent that carries no ATP-dependence claim.

    Fixed: modifier changed from LOSS_OF_FUNCTION to GAIN_OF_FUNCTION, and a genetic_context block added to the same node with functional_impact_category: GAIN_OF_FUNCTION, zygosity HETEROZYGOUS, variant_origin GERMLINE. The reviewer's argument is right and the original value was wrong - increased HSPB1 binding and aggregate formation are acquired behaviours that a null allele would not produce. Note the reviewer suggested putting functional_impact_category on genetic[].variants; the Variant class has no such slot, and Pathophysiology.genetic_context does, so it went there instead.

    Fixed: added conforms_to on three nodes - disabled_macroautophagy#Failure of Cytoplasmic Quality Control on the CASA node (plus GO:0006914, the process that module node expects), loss_of_proteostasis#Misfolded-Protein Aggregation on the aggregate node, and peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination on the axon node, matching all three sibling dHMN entries. The description records that the module node's myelination and Schwann-cell annotations are not copied, because dHMN2A is a pure motor axonopathy.

    Fixed: completed the split in kb/disorders/Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant.yaml, which had been left asserting the same disease twice. Removed the dHMN2A has_subtypes row, the HSPB8 genetic block that keyed to it, and the OMIM:158590 external assertion, and added a description paragraph recording the split - the same treatment that entry already gives WARS1/dHMN9.

    NOT fixed, and still blocked: PMID:20538880, PMID:26718575 and PMID:39972648 were retried in this session and eutils.ncbi.nlm.nih.gov still returns 403 through this environment's egress proxy. The reviewer fetched them from a GitHub Actions runner, so the block is environment-specific as they say, but it is not lifted here. Citing the Irobi 2010 neurite-degeneration edge requires a snippet verified against a cache file this environment cannot create, so the aggregate-to-axon-degeneration edge stays uncited.

    NOT fixed for the same reason: cache/mondo/terms.csv and cache/enums/diseaseterm rows for MONDO:0008025 (OLS, purl.obolibrary.org and semanticsql.berkeleybop.io are all 403 here); the knock-in mouse animal_models entry (needs PMC:5756276); a diagnosis section; and the CMT2L / myofibrillar-myopathy-13 allelic subtypes (need PMID:26718575).

    NOT fixed on evidence grounds rather than access: pes cavus. The reviewer is right that it belongs in the entry, but the only pes cavus text in the local cache is PMID:36445400, where both mentions are gene-specific - one describes ATP7A-related HMN and the other GARS-associated neuronopathy. Quoting either for an HSPB8 entry would be Named Entity Confusion. The reviewer's own source for it, Rashed 2025, is a PMC id that cannot be fetched here. Same for treatment evidence: no cached source states dHMN management, so the three treatments still carry none.

    Validation after these changes: just validate schema-clean on both files; term validation passes outright on the umbrella entry (all its terms cached) and still aborts on MONDO:0008025 for the new entry; 48/48 snippets verified across both files; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all clean.

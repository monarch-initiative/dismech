  summary: Re-source the Hspb8 K141N knock-in model against its own paper
  details: |
    Review round (#11502) addressed three blocking items in the animal_models block. (1) The genotype carried 'c.421A>G (p.Lys141Asn)', which is internally inconsistent: c.421A>G changes codon 141 AAG->GAG, i.e. K141E, the other founding allele. Dropped the cDNA coordinate rather than substituting one, since the published coordinate is human numbering and this is a mouse allele; the genotype now reads Hspb8K141N/K141N in the model paper's own notation. (2) The gain-of-function explanation said 'heterozygous K141N knockin model' while the same commit's model block said homozygous. The homozygous reading is correct - Bouhy et al. report that heterozygous Hspb8K141N/+ mice do not differ from wild type - so the word was removed and the 'knockour' typo fixed. (3) The model's claims were attached to PMID:39972648, an RNAi therapeutic trial whose only mention of the model is a methods sentence; that sentence supported neither RECAPITULATES nor the zygosity limitation, leaving both uncited. Fetched the model's own paper (PMID:28780615, Bouhy et al., Acta Neuropathol 2018) via just fetch-reference, made it the model publication, and cited it for both claims: the abstract's knock-in/knock-out contrast for the model overall, and two body sentences for RECAPITULATES and for the heterozygote-silence limitation. PMID:39972648 is kept as a second item quoting its actual finding rather than its methods line. Also took three suggestions: description no longer calls a targeted knock-in 'transgenic'; the cell-type-selectivity explanation no longer claims length-dependence, which that paper does not measure; and the zygosity mismatch is now a typed POPULATION_MISMATCH divergence with model_scale ORGANISM. PMID:26718575 was left in place - it was orphaned when the review was written, but main has since acquired a byte-identical copy via #11480, so removing it would create a spurious deletion. just validate passes with 36/36 snippets verified.

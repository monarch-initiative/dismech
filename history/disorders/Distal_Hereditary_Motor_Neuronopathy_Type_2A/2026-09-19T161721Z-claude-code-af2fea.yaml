  summary: Qualify heterozygote claim on Hspb8 K141N knock-in model
  details: |
    Review round 2 blocker: the model description said heterozygous Hspb8K141N/+ mice are 'indistinguishable from wild type', and the POPULATION_MISMATCH divergence said only homozygotes 'develop the phenotype'. PMID:28780615 reports heterozygous distal sciatic nerve pathology (regenerative clusters, macrophage infiltration, axoplasmic accumulation) to a lesser extent, so the prose generalized past its attached snippet, which covers behavioural performance only. Qualified the description to behaviourally indistinguishable with no myelinated-axon loss at 12 months but milder ultrastructural change; scoped the divergence to the overt behavioural/electrophysiological phenotype and recorded why it stays QUALIFYING rather than INVALIDATING; added an evidence item quoting the heterozygote ultrastructure sentence so the new claim is sourced rather than asserted. Validated: just validate (39/39 snippets), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

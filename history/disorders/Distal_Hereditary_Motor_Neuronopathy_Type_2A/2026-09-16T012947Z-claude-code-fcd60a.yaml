  summary: 'Review round 2: re-evidence animal model link, correct overstated explanations'
  details: |
    Addressed PR #11365 review items 1-5 plus accepted suggestions.

    Item 1 - the animal_models modeled_mechanisms link asserted RECAPITULATES on a methods sentence ('We used human induced pluripotent stem cells and the Hspb8 knock-in mouse model'), which establishes only that the model was used. Added the result sentence from the same abstract ('Mice expressing mutant Hspb8 (Lys141Asn) mimic the human disease, whereas mice lacking Hspb8 show no overt phenotype', PMID:39972648, MODEL_ORGANISM) as the link's primary evidence and kept the methods sentence as a secondary model-exists attestation.

    Item 2 - the link description said 'Transgenic mice expressing the human K141N mutation', contradicting its own genotype field (Hspb8 knock-in) and the abstract. Reworded to knock-in at the endogenous mouse locus, and stated why endogenous-locus expression is what makes the model bear on the gain-of-function argument.

    Item 3 - 'Directly demonstrates the aggregate-driven degeneration consequence' (PMID:20538880) claimed an intervening step the paper does not measure, and contradicted the edge's own INDIRECT_UNKNOWN_INTERMEDIATES marker. Reworded to the degeneration consequence of the mutant allele with aggregation named as the curated but unmeasured intermediate, and graded the item directness: INDIRECT.

    Item 4 - dropped the 'since motor neurons have the longest axons' argument from the evidence explanation; the paper's conclusion is cell-type selectivity, not length-dependence, and sensory neurons were only mildly affected. The length-dependent distal distribution is now attributed in the edge description as explicit curator inference from the clinical pattern. Also added the paper's apoptosis negative ('We did not detect any signs of apoptosis in motor neurons...') as a third item constraining the node to neurite degeneration rather than neuronal death.

    Item 5 - this record.

    Suggestions taken: PMID:26718575 was fetched but cited nowhere, so it is now used rather than dropped - added the P173SfsX43 frameshift to the HSPB8 variant list with the RESULTS sentence naming it beside K141E, recording the allelic axis within the gene. Added model_scale: ORGANISM to the link (target node is TISSUE, so no upward extrapolation to caveat). Added PMID:20538880 to the top-level references, since it now carries the central causal edge.

    Validation on the branch: just validate clean (schema, terms, 36/36 snippets verified); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK. check-snippet-grading and check-title-snippets report findings only in unrelated entries (ZNF407, MPI-CDG, Wilsons_Disease) from the shallow-clone baseline; zero in this file.

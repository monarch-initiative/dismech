  summary: 'Create: Distal Hereditary Motor Neuronopathy Type 2A (HSPB8)'
  details: |
    New Mendelian entry for the HSPB8 (K141N/K141E) form of distal hereditary motor neuronopathy, split out from the Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant umbrella entry where it had been a has_subtypes row only. Deletes stubs/Neuronopathy_Distal_Hereditary_Motor_Type_2A.yaml.

    Deep research: the requested provider (falcon/Edison) could not run in this session - this environment's egress policy returns 403 for api.platform.edisonscientific.com, and --fallback did not reroute because an authentication failure is not classified fallback-worthy. The report used is research/Distal_Hereditary_Motor_Neuronopathy_Type_2A-deep-research-claude_code.md (claude_code provider, 24 web searches, 28 turns, 11 citations). It carries no reference-validation or term-validation section because those checks resolve identifiers against NCBI and OLS, both of which are also blocked here.

    Two errors in that report were caught and NOT carried into the entry: it gives HGNC:5254 as the HSPB8 gene CURIE (the correct one, hgnc:30171, is in cache/hgnc/terms.csv and in the deleted stub), and it labels HP:0009053 'Distal muscle weakness' (HPO calls that HP:0002460; HP:0009053 is Distal lower limb muscle weakness). The entry uses hgnc:30171 and HP:0002460.

    Evidence: all 20 snippets are exact quotes from references already present in references_cache/ and verify 20/20 with 'just count-verified-snippets'. No new reference could be fetched - 'just fetch-reference' fails with 403 against eutils.ncbi.nlm.nih.gov for any uncached identifier. Three papers the report cites and that would have strengthened the entry were therefore left out rather than quoted unverified: PMID:20538880 (Irobi 2010, motor-neuron-selective neurite degeneration independent of apoptosis - this would have supplied the currently uncited aggregate-to-axon-degeneration edge), PMID:26718575 (Ghaoui 2016, HSPB8 C-terminal frameshift myopathy), and PMID:39972648.

    Term validation could not be run: cache/mondo/terms.csv and cache/enums/diseaseterm_*.csv do not contain MONDO:0008025, and the online adapters (www.ebi.ac.uk OLS, purl.obolibrary.org, semanticsql.berkeleybop.io) all return 403 through this session's proxy, so the CURIE could not be resolved or added to the cache. Every other term the entry binds - HP:0000006, HP:0002460, HP:0003693, HP:0007002, HP:0002936, GO:0006457, GO:0061684, GO:0016567, GO:0034605, GO:0030424, CL:0011001, NCIT:C15747, NCIT:C15302, NCIT:C15240, hgnc:30171 - was checked to be present in both the label cache and, where applicable, the dynamic-enum membership cache. The MONDO CURIE and its label are taken verbatim from the committed stub, which scripts/enrich_curation_stubs.py generated from the MONDO release pinned in data/mondo/MANIFEST.yaml (2026-05-05). This binding still needs 'just validate-terms' run against a reachable ontology service before merge.

    Also validated: 'just validate' schema pass, 'just check-entity-refs', 'just check-causal-targets', 'just check-duplicate-keys', 'just check-enum-values', 'just check-qualifier-terms', and the whole-KB 'just check-folded-hyphens', 'check-snippet-length', 'check-title-snippets', 'check-snippet-grading' - all clean with no baseline changes. 'just validate-disorders' was not run because it network-fetches. Compliance 85.5% weighted; treatments carry no evidence because no cached source states dHMN management, and that is left as a gap rather than filled with a stretched quote.

    Model identifier omitted from this record under this session's policy against writing model identifiers into repository artifacts.

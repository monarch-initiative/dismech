  summary: 'Create: STT3B-Congenital Disorder of Glycosylation'
  details: |
    Created from the curation stub for MONDO:0014271. Two patients are reported, both homozygous and from consanguineous families: the intronic c.1539+20G>T with absent STT3B mRNA, hypoglycosylated STT3B-specific substrates and correction by STT3B cDNA in fibroblasts (PMID:23842455), and the missense c.38C>G p.Ser13Trp with no functional data (PMID:32253875). STT3B is typed relationship_type UNKNOWN because the evidence is two patients. ClinGen rates STT3B Limited only under the broad CDG concept MONDO:0015286, so no tier is recorded in gene_disease_validity. The pathograph runs from STT3B loss of function through impaired post-translational N-glycosylation to the two congenital_disorder_of_glycosylation module nodes and on to ten phenotypes. The MONDO/Orphanet features not stated in the cached sources (IUGR, microcephaly, optic atrophy, genital anomalies) are named in notes and not curated. Validated with linkml-validate, the term validator, the reference validator (28/28 snippets), and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, gene-term, snippet-grading, GeneReviews and folded-hyphen checks.

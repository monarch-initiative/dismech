  summary: 'Address review feedback on PR #10014'
  details: |
    Addressed the four IMPORTANT items from the automated review on PR #10014. Added Nephrotic Syndrome (HP:0000100) and Edema (HP:0000969) phenotypes, both quantified from the cached full text of PMID:39417966 and both bounded against the sub-nephrotic AApoAI presentation reported in PMID:35502644. Added a biochemical section (cholestatic alkaline phosphatase and gamma-glutamyltransferase elevation, NCIT:C61016 and NCIT:C64847), which is the diagnostic entry point for the Italian AApoAI cohort in PMID:15131802. Added a histopathology section with Congo red birefringence and the glomerulus-restricted AFib deposition pattern. Extended the FGA genetic block with the sex difference in age at onset and the pooled post-transplant amyloid recurrence rate, and explained in the association prose why allele class bears on the isolated-kidney versus combined liver-kidney transplant decision. Added an AFib prevalence record carrying the 87 of 5100 UK national amyloidosis figure and softened the prevalence note, which had overstated the evidence gap. Added the 7 of 46 AL misdiagnosis rate with documented renal deterioration to the AL amyloidosis differential. Added an OPEN_QUESTION discussion for the homozygous APOA1 p.Leu202Arg case that has been proposed as a recessive exception, without changing the inheritance block, since one consanguineous family cannot establish recessive inheritance. Refined three HPO bindings after self-review: hepatic amyloid now binds HP:0012280 rather than the generic HP:0011034, cardiac involvement binds HP:0030843 Cardiac amyloidosis rather than HP:0001638 Cardiomyopathy, and the gastrointestinal phenotype was split into an amyloid-deposition entry and a separate Gastrointestinal inflammation entry (HP:0004386), because the cited evidence describes amyloid lesions and IBD-like colitis and says nothing about the hemorrhage the earlier binding claimed. Deliberately not curated, with reasons recorded in the entry notes: the AFib allele-class onset gradient and the 22 versus 83 percent recurrence contrast, because neither number appears in any cached reference and the deep-research report is a lead rather than a citation; and an animal_models entry for the transgenic APOA2 Stop78Ser mouse, whose cache has content_type unavailable. Also rewrapped one over-long notes line in the grouping. Validation: just validate passed, 83 of 85 snippets verified with 2 skipped by DOI prefix and both checked by hand against the cache, just validate-disorders passed, and all offline gates pass including check-folded-hyphens after fixing one split introduced by this change.

  summary: 'Create: Familial Visceral Amyloidosis (MONDO:0007099)'
  details: |
    Curated MONDO:0007099 (familial visceral amyloidosis, Ostertag type) as a Disease root carrying its four MONDO children as has_subtypes: AApoAI (APOA1, MONDO:0019731), AApoAII (APOA2, MONDO:0016533), AFib (FGA, MONDO:0019733) and ALys (LYZ, MONDO:0019732). Concept decision recorded in the entry notes: the four forms share one conserved pathograph (variant hepatically synthesised plasma protein, then destabilisation and beta-sheet conversion, cross-beta fibril formation, visceral deposition, cumulative accumulation, and progressive renal excretory failure), one diagnostic pathway and one disease-modifying treatment, differing at a single explicitly curated node (Precursor-Determined Visceral Organ Tropism), so a Disease root with subtypes was preferred to a memberless grouping. Six pathophysiology nodes, five of which declare conforms_to against kb/modules/amyloidogenesis.yaml. A CONTROVERSY discussion records the disagreement between the Gillmore prospective cohort (PMID:19073821, AFib essentially kidney-restricted) and the Stangou transplant-assessment series (PMID:19633201, AFib systemic with vascular, cardiac and neurologic amyloid). Deep research: one falcon (Edison) run, 773 seconds, 21 citations, reference validation 11 of 11 resolved with a 0.0 confabulation rate; its recommendation to treat the MONDO class as a legacy umbrella pointing at precursor-defined subtypes is what the has_subtypes structure implements. No GeneReviews chapter exists for any of the four precursor forms (PubMed searched 2026-08-28), so the phenotype baseline came from the UK National Amyloidosis Centre cohort series instead. Hereditary B2M D76N amyloidosis was proposed by the deep-research report as a fifth precursor form and was deliberately not curated as a subtype, because it is not a MONDO child of this class; the reasoning is recorded in the entry notes. Also added this entry as a DISEASE member of kb/groupings/Hereditary_Systemic_Amyloidoses.yaml, which had listed the four precursor forms as intended TODO members. Validation: just validate passed (schema, terms and references), 68 of 68 snippets verified against cached references, check-duplicate-keys OK, check-entity-refs OK, check_reference_titles OK against origin/main, and just check-groupings shows no regression on the edited grouping.

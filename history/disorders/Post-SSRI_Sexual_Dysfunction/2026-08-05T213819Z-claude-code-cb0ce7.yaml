  summary: 'Review fixes: PSSD ontology bindings and sex-scope caveat'
  details: |
    Addressed three blocking items from the PR #7991 review. (1) Rebound the Persistent Transcriptional Reprogramming node's biological_process from GO:0040029 epigenetic regulation of gene expression to GO:0010468 regulation of gene expression: the node's only evidence (PMID:39495228) reports differential-expression counts in the rat nucleus accumbens, not chromatin or methylation data, so the epigenetic class was not supported by the cited evidence. The epigenetic_reward_circuit_model hypothesis label is unchanged - it has its own separate evidence naming epigenetic gene expression as a proposed theory. (2) Removed GO:0043084 penile erection from the Suppression of Central Sexual Arousal and Reward Signaling node: organ-level, male-specific physiology on a CNS node, duplicating the HP:0100639 phenotype. No replacement GO term was substituted because GO has no molecular or cellular class for central sexual arousal or reward-signalling capacity; the gap is recorded in notes rather than papered over with an inaccurate term. (3) Added a pssd_male_skewed_evidence_base KNOWLEDGE_GAP discussion plus a sex-scope paragraph in notes, acknowledging that the human evidence base is overwhelmingly male (the Ben-Sheetrit cohort excluded females by design; peripheral-nerve and neuromodulation reports are male case material) while the condition affects both sexes, and that the sex difference in presenting complaint makes erectile-anchored case finding under-detect women. Three exact-quote snippets from the already-cached PMID:39289881 support it. Also added the missing issue and PR links to the CREATE history record for this entry. Not addressed: the review's request for a research/ deep-research artifact - no deep-research provider is available to this session, so the entry remains curated directly from primary literature. Validation: schema PASS, term validation PASS, 77/77 snippets verified against cached references.

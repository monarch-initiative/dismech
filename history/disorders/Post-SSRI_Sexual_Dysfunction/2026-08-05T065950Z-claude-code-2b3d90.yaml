  details: |
    New disease entry for issue #6405 (lit-scan:new, PMID:42430418). Modeled the enduring post-drug syndrome with 9 pathophysiology nodes and five explicit mechanistic_hypotheses (serotonergic 5-HT1A CANONICAL; neurosteroid and epigenetic/transcriptional ALTERNATIVE; peripheral small-fibre EMERGING; residual-depression DEPRECATED) rather than a single settled chain, because the mechanism is genuinely unresolved. Recorded a HUMAN_MODEL_MISMATCH discussion because the neurosteroid and transcriptomic arms rest entirely on one laboratory's paroxetine-treated male-rat model with no human measurement; a CONTROVERSY discussion on causal attribution (no prospective RCTs vs EMA recognition and a confounding-adjusted retrospective cohort); and a KNOWLEDGE_GAP on the three-orders-of-magnitude spread in occurrence estimates. 18 PMIDs fetched with just fetch-reference. Validation: schema PASS, 74/74 snippets verified against cached abstracts, term validation PASS.

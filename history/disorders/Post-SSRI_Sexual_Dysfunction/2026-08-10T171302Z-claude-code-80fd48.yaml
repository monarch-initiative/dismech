  summary: Link the drug exposure, developmental window, and host factors
  details: |
    Backfill for issue #8085. Three links on a wide spread. The drug exposure is TRIGGERS with DIRECT into the transporter blockade node, and is the clearest direct link in this tranche because the exposure and the node are the same event described from two sides: the node is blockade during treatment and the exposure is the drug producing it. Worth noting that the node is the antecedent state rather than the disease, since the syndrome is anchored to cessation rather than initiation. Pre-natal or pre-teen exposure is MODULATES rather than TRIGGERS, and points at the enduring-dysfunction node rather than the molecular one, because it is not a separate cause; it is the same drug exposure occurring in a developmental window, and what it changes is the form the enduring state takes, a form the consensus criteria give its own name. Its rodent item is deliberately paired with the human criteria item rather than carried alone, since model-organism evidence should not stand by itself behind a human claim. Predisposing host factors is graded lowest at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, and the exposure's own description states the reason better than a grade can: none of the listed factors is established, they are recorded as the published candidate set, and no susceptibility gene has been identified, which is why this entry carries no genetic section. The link is drawn because the candidate set is a real claim about who develops the enduring state, not because any member of it is evidenced. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 82 of 82 verified.

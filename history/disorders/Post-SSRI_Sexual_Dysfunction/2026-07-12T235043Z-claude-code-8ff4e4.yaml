  summary: 'Create: Post-SSRI Sexual Dysfunction (PSSD)'
  details: |
    Initial draft entry for PSSD (issue #6405), a persistent iatrogenic sexual dysfunction syndrome that continues or emerges after SSRI cessation. No MONDO term exists (OLS confirms none; nearest neighbor MONDO:0017213 postorgasmic illness syndrome is distinct), so curated without disease_term, following the Chemotherapy_Induced_Nausea_and_Vomiting iatrogenic precedent. All claims anchored to review PMID:42430418 with exact-quote snippets: 5 phenotypes (genital anesthesia [diagnostic], sexual anhedonia, erectile dysfunction, decreased libido, anorgasmia), 3 hypothesized pathophysiology nodes (5-HT1A desensitization; allopregnanolone depletion via 5-alpha-reductase inhibition; epigenetic silencing of dopaminergic reward circuits), prevalence (up to 74% persistence beyond 6 months), two off-label treatments (dopamine agonists, low-power laser therapy), and a KNOWLEDGE_GAP discussion on the unresolved dominant mechanism and biomarker gap. Validated with just validate, just validate-terms, just validate-references (all pass). Opened as draft given the single-review evidence base and missing MONDO.

  summary: 'Address PR #7813 review: consume DR content, resolve conflicts'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7813, which found no
    correctness problems (all three validators passed, 80/80 snippets verified) but requested
    content-completeness work against the committed deep-research report, plus resolution of a
    merge conflict. All eight IMPORTANT items and all three SUGGESTIONS are addressed. Three of
    them are addressed by NOT doing what was asked, for reasons recorded in the file and set out
    below - in each case the requested content turned out to be unsupported by the source cited
    for it.

    MERGE CONFLICT. The PR was CONFLICTING against main. Conflicts were confined to five
    generated cache CSVs (cache/go/terms.csv, cache/hp/terms.csv, cache/ncit/terms.csv, and the
    biologicalprocessterm/cellularcomponentterm enum caches) where this branch and main had each
    inserted rows into the same sorted files. Resolved by rebasing onto origin/main, taking
    main's side for every conflicted cache file, and then re-deriving this entry's rows with
    'just validate-terms' rather than hand-merging - so every committed cache row is
    tool-generated, per the never-hand-write-the-term-cache rule. Post-resolution the cache diff
    against main is purely additive (10 insertions, 0 deletions), and HP:0001670 / NCIT:C174901
    needed no re-adding because main already carried them.

    IMPORTANT item 1 - SRX/DRX absent while both drugs were wired to the cross-bridge node.
    Added a new MOLECULAR pathophysiology node, "Myosin Shift from the Super-Relaxed to the
    Disordered-Relaxed State", between the cMyBP-C depletion node and the cross-bridge node, and
    retargeted both mavacamten and aficamten target_mechanisms onto it. Five evidence items
    across the three PMIDs the review named: PMID:28658286 (human myectomy tissue, SRX loss
    specific to MYBPC3-mutation-positive hearts and absent from sarcomere-mutation-negative HCM,
    plus the positive correlation between residual cMyBP-C and SRX fraction - the molecular form
    of this entry's dose gradient), PMID:27021517 (homozygous knockout mouse confirmation, with
    the heterozygous-negative result quoted rather than omitted), and PMID:30674652 (the
    SRX-to-DRX shift on stepwise depletion, and MYK-461/mavacamten rescuing relaxation in
    MYBPC3-mutant cardiomyocytes - the quote that justifies the retarget).

    IMPORTANT item 2 - missing human evidence for the entry's own haploinsufficiency thesis.
    Added PMID:19574547 (two items) to the genetic block: quantified myofibrillar MyBP-C in
    genotyped myectomy specimens versus donor hearts, no detectable truncated peptide, and the
    explicit conclusion that haploinsufficiency is sufficient to cause disease. Added
    PMID:32841044 (two items) and replaced the free-text "frequency: about half of identified HCM
    mutations" with the quantified 91%-truncating figure plus the locus-independence argument and
    the C10 finding showing a subset of non-truncating variants also converge on loss of function.
    PMID:38258577, the promoter-deletion report the review called the cleanest proof, is a
    research letter whose cached PubMed record contains title and authors only - no abstract body
    - so no quotable snippet exists. Rather than quote a title as though it were evidence, it is
    carried in the top-level references block and the same claim is evidenced from PMID:19574547,
    with the reason recorded in the entry notes.

    IMPORTANT item 3 - no discussions block. Added four. (a) CONTROVERSY
    mybpc3_haploinsufficiency_sufficiency, attached to the depletion node and the genetic block,
    carrying PMID:36946992 (Barefield) and PMID:31877118 (Helms), with a proposed experiment to
    measure myofibrillar cMyBP-C in genotype-positive phenotype-negative myocardium - the
    measurement that would settle it. Curated as CONTROVERSY rather than KNOWLEDGE_GAP because
    the evidence is not absent; two bodies of evidence point different ways. (b) KNOWLEDGE_GAP
    mybpc3_penetrance_ascertainment_discrepancy on the biobank-versus-family penetrance gap.
    (c) HUMAN_MODEL_MISMATCH mybpc3_heterozygous_mouse_phenotype_negative, now supportable with
    two independent negative heterozygous results (PMID:37844837 echo/histology, PMID:27021517
    SRX). (d) HUMAN_MODEL_MISMATCH mybpc3_disarray_and_obstruction_not_modeled, covering both
    disarray and dynamic outflow obstruction. Note that (d) deliberately makes no claim that
    disarray was tested-and-not-found in mice - no cached source says that. It states instead what
    is verifiable: the cited characterisation reports echo, histology and contractility without
    reporting disarray, and engineered tissue has no ventricular architecture in which disarray
    could be defined.

    IMPORTANT item 4 - missing high-frequency phenotypes. Added Atrial Fibrillation (HP:0005110)
    and Syncope (HP:0001279), both scoped to Monoallelic CMH4. Frequency bands are deliberately
    omitted from both, with the omission explained inline: the ~20%/~60%-by-60 figures the review
    quoted trace to the GeneReviews overview, whose PubMed record is a purpose statement with no
    quotable clinical text, and no cached source carries a MYBPC3-specific denominator for either.
    AF is evidenced as an adverse outcome in the genotyped SHaRe MYBPC3 cohort (PMID:32841044);
    both carry a PARTIAL narrative-review item (PMID:38406555). Chest pain and palpitations were
    NOT added - no cached source supports them even qualitatively, and adding two more unsourced
    phenotypes to raise a count is not an improvement.

    IMPORTANT item 5 - myocyte disarray missing from histopathology. Added, with two evidence
    items from PMID:19151713 (septal myocardium of a genotyped MYBPC3 homozygote: swirling of
    hypertrophied myofibres amid connective tissue disarray). The finding_term binds only to the
    generic NCIT:C35867 Morphologic Finding parent, and the notes explain why: NCIT has no
    myofibre-disarray term, and HP:0031318 - the precise term, and the one the review suggested -
    is NOT reachable from the HistopathologyFindingTerm enum roots, because its ancestors run
    through HP:0001637 Abnormal myocardium morphology rather than HP:0025461 Abnormal cell
    morphology. Verified with 'runoak ancestors'. Flagged as a candidate NTR.

    IMPORTANT item 6 - no biochemical block. Added NT-proBNP (HP:0031185), scoped to
    heart-failure severity and treatment response, evidenced from the SEQUOIA-HCM full text (0.20
    versus 1.00 geometric mean proportional change at week 24). The review asked for this citing
    PMID:31877118 for elevation in genotype-positive/LVH-negative carriers. That paper does not
    support the claim: it is an iPSC-cardiomyocyte study of protein-level compensation and reports
    no patient biomarker data whatsoever. The claim is therefore NOT curated, the reason is
    recorded in the biochemical notes, and PMID:31877118 is cited where it does belong - in the
    haploinsufficiency-sufficiency controversy, where its compensation finding is central.
    Separately, the HP label supplied for NT-proBNP in the research report was wrong; term
    validation rejected "Increased circulating brain natriuretic peptide concentration" and the
    canonical label is "Elevated circulating NT-proBNP concentration".

    IMPORTANT item 7 - no clinical_trials block, and the TN-201 clinical hold. Added all six
    trials (NCT05836259, NCT03470545, NCT05186818, NCT04349072, NCT05767346, NCT01912534), each
    fetched with 'just fetch-reference', each with a snippet from its cached registry summary, and
    each noting it is not genotype-stratified except MyPEAK-1. Phases and statuses were taken from
    the live ClinicalTrials.gov API, not from the research report. The "FDA clinical hold of 7 Nov
    2025" - which the review called the most consequential omission - is deliberately NOT curated,
    and the trial notes record why. The registry's version history shows 16 versions with only two
    statuses ever recorded, NOT_YET_RECRUITING then RECRUITING, including versions posted both
    before (2025-07-10) and after (2026-03-18) the alleged hold date; there is no whyStopped
    field; and the research report that raised it states in its own gap table that the matter is
    "not yet in the peer-reviewed literature". Curating an active hold would contradict the
    registry and rest on no citable source. The trial is recorded as RECRUITING per the registry,
    status verified 2026-03-18, and the discrepancy is documented so a future curator can resolve
    it if a source appears.

    IMPORTANT item 8 - missing treatments. Added Heart Transplantation (NCIT:C15246) with two
    PARTIAL evidence items and a note that no MYBPC3 transplant series exists, so the reasoning is
    from documented natural history plus the absence of any alternative at the biallelic pole.
    Added Anticoagulation for Atrial Fibrillation (NCIT:C15986 + NCIT:C263 at class level, since
    DOAC-versus-warfarin is not genotype-determined), with the guideline basis and the absence of
    a quotable snippet stated in the notes. Added Agents to Avoid in Obstructive Physiology as a
    deliberately term-less, evidence-less prose entry, with the reason recorded: there is no NCIT
    action term for a class of agents to avoid, and the 2024 AHA/ACC guideline record carries only
    AIM/METHODS/STRUCTURE text - but omitting what actively harms, in a disease where vasodilators
    and aggressive diuresis worsen the gradient, would be misleading by omission.

    SUGGESTIONS. (a) Retried both therapeutic_agent terms with OAK as asked. Aficamten resolves:
    CHEBI:747213, verified reachable from CHEBI:24431, now curated. Mavacamten does not:
    NCIT:C174901 exists but its ancestors run Inotropic Support / Agent / Conceptual Entity and it
    is not reachable from NCIT:C1909 Pharmacologic Substance, so it fails the ChemicalEntityTerm
    enum, and CHEBI has no mavacamten term. The original omission was correct; the reason is now
    recorded on the treatment so it is not re-litigated a third time. (b) Endomyocardial
    Fibroelastosis no longer shares NCIT:C178564 Cardiac Fibrosis with the Myocardial Fibrosis
    entry - term: removed, unbound preferred_term retained, NTR note added, exactly as the review
    preferred. (c) The knock-in mouse was not given a "more specific enum value": ExperimentalModel
    has no animal value in its type enum, because whole-organism animal models belong in
    animal_models, and experimental_model_type: OTHER is the documented pre-#8199 workaround for
    reaching the pathograph before AnimalModel gained modeled_mechanisms. The model was therefore
    MOVED to animal_models with species/genotype, per-link relationship and fidelity
    (RECAPITULATES/MODERATE for the dose gradient; PARTIALLY_RECAPITULATES/MODERATE for the tissue
    node, with the disarray limitation stated), and per-link evidence.

    ALSO ADDED, from the review's completeness table rather than its numbered items: a
    Cell-Autonomous Cardiac Fibroblast Activation node (PMID:36357371, base-edited R495Q pig plus
    NIH3T3 fibroblasts), curated at mechanism_confidence PROVISIONAL as a parallel arm feeding the
    fibrosis node, with a note stating plainly that there is no human confirmation and that human
    disease is predominantly truncating whereas the model is missense.

    LUMPING/SPLITTING. The review escalated the gene-specific-entry question to @cmungall. That is
    a human decision; nothing in this session presumes an answer either way, and the entry's
    existing scope note is unchanged.

    EVIDENCE DISCIPLINE. All 15 new references (9 PMIDs, 6 NCTs) were fetched with
    'just fetch-reference' and read before any snippet was written; no cache file was hand-created
    or hand-edited. New ontology terms were verified with OAK before use, including enum-root
    reachability checks with 'runoak ancestors' for CHEBI:747213, NCIT:C174901, HP:0031318 and
    NCIT:C35867. Three claims proposed during review were rejected after inspecting their own
    cited sources (the NT-proBNP carrier claim, the TN-201 clinical hold, and HP:0031318 as a
    finding_term), and each rejection is documented in the entry rather than left silent.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_4.yaml' - the
    batched pre-PR sweep CI runs, with --no-full-text - passed in full: schema "No issues found",
    terms "Validation passed", references "All validations passed" with "Snippets checked: 114/114
    verified against cached references", up from 80/80 before this session.

  summary: 'Create: Hypertrophic Cardiomyopathy 4 (MYBPC3)'
  details: |
    Created the gene-specific MYBPC3 entity (MONDO:0007268, OMIM:115197, CMH4) as a standalone entry under the Hypertrophic Cardiomyopathy umbrella (MONDO:0005045), which was NOT edited. NEC preflight passed: the MONDO definition gene MYBPC3 and OMIM 115197 were both confirmed against sqlite:obo:mondo, and the deep-research report named MYBPC3 150 times versus MYH7 8 and TNNT2 6, with OMIM 115197 the only asserted phenotype MIM.

    Central modeling decision: CMH4 is curated as a gene-dosage disease with two explicit subtypes - Monoallelic CMH4 (cMyBP-C haploinsufficiency, autosomal dominant, incomplete age- and sex-dependent penetrance, discrete hypertrophy, preserved ejection fraction, low event rate) and Biallelic CMH4 (cMyBP-C effectively absent, severe neonatal cardiomyopathy with left ventricular noncompaction features and septal defects, death within months) - with separate Inheritance blocks bound to HP:0000006 and HP:0000007 and separately sourced evidence for each. This resolves the conflation in the MONDO definition, which calls the entity autosomal dominant while characterizing it by severe neonatal HCM.

    Six-node pathograph: MYBPC3 truncating variant and premature termination codon generation -> cMyBP-C depletion by nonsense-mediated decay and proteasomal degradation -> loss of the cMyBP-C brake on actin-myosin cross-bridge cycling -> gene-dosage-dependent severity gradient -> ventricular hypertrophy, disarray and fibrosis -> diastolic dysfunction, heart failure and arrhythmic risk. Three nodes declare conforms_to against cardiomyopathy_maladaptive_remodeling (Primary Cardiomyocyte Insult, Ventricular Remodeling, Structural Cardiac Impairment and Heart Failure).

    Also curated: 13 phenotypes, 2 histopathology findings, 3 founder/risk variants (Dutch c.2373dup, Amish/Swiss c.3330+2T>G, South Asian 25-bp deletion), 2 diagnosis entries, 2 differential diagnoses, 7 treatments (mavacamten and aficamten both linked via target_mechanisms INHIBITS to the cross-bridge node, septal reduction therapy, ICD, genetic counseling, exercise counseling, and investigational AAV9 MYBPC3 gene therapy), and 2 experimental models (isogenic MYBPC3 +/- and -/- human iPSC engineered cardiac tissue; Mybpc3 c.2373InsG knock-in mouse allelic series).

    Deep research: the requested falcon (Edison) provider is not registered in this environment - no EDISON_API_KEY or FUTUREHOUSE_API_KEY is set and just research-disorder reports only claude_code as available - so the deep-research step used the claude_code provider (17 web searches, 47 turns, 69 citations, 22 minutes). DR output was treated strictly as leads: every PMID was independently fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract.

    Validation: just validate, just validate-terms and just validate-references all pass, with 80/80 snippets verified against cached references. Term fixes applied during curation: HP:0003811 Neonatal death is not reachable from HP:0000118 so that phenotype was dropped and the fatality is carried in progression and the subtype description instead; histopathology finding terms were rebound from HP to NCIT:C178564 Cardiac Fibrosis because HistopathologyFindingTerm is NCIT-rooted; and the mavacamten and aficamten therapeutic_agent entries were left as free text because NCIT:C174901 sits under NCIT:C1708 Agent and is not reachable from the ChemicalEntityTerm roots.

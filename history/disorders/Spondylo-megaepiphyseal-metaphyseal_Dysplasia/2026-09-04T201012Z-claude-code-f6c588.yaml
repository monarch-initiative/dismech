  summary: 'Review round 1 on PR #10999: ontology precision, and two sources I dropped
    on misread validator flags'
  details: |
    All six blocking findings fixed plus all three suggestions, in one push. Two of the six are
    worth recording as a category of mistake I had not made before in this batch.

    ITEMS 5 AND 6 - I TREATED THE REPORT'S OWN ADVISORY FLAGS AS VERDICTS. The PR body listed
    PMID:17310243 as "off-topic" and PMID:10572046 as carrying an "unsupported quote", citing the
    report's validation sections. Both dispositions were wrong, and wrong in the same way.

    The report's relevance section says, in the paragraph immediately above the off-topic flag:
    "That is a clue and not a verdict - a paper can be relevant in ways its title and abstract do
    not spell out - so read them before deciding." I did not read them. PMID:17310243 is
    "Constitutive RelA activation mediated by Nkx3.2 controls chondrocyte viability" - squarely
    about this gene in these cells, flagged only because it predates and does not share the
    report's SMMD-specific vocabulary. PMID:10572046's "unsupported quote" differs from the source
    by a single "&agr;" HTML entity where the quote has an alpha character; the report printed the
    supporting text directly beneath the flag.

    This is the inverse of the errors elsewhere in this batch. On #10995 I asserted an ontology
    absence I had not checked - too much trust in my own assumption. Here I discarded two good
    sources on automated flags the tool itself labelled as advisory - too much trust in the flag.
    Both are failures to read the primary text.

    What they cost: the entry was missing Branch B entirely. NKX3-2 is a dual-function node - a
    brake on chondrocyte maturation AND a survival signal for the cells being braked, via
    ligand-independent constitutive RelA activation. That is now a Loss of Chondrocyte Survival
    Signalling node, marked PROVISIONAL because the mechanism is established in chick and mouse
    chondrocytes and has not been shown in an SMMD patient. The Bapx1-null mouse paper is also now
    cited directly on the animal model rather than through the human-genetics paper that summarised
    it, and it supplies the dissociation that justifies modelling the two arms separately: losing
    the gene raises apoptosis while leaving cell cycling rates unaltered.

    ITEM 1 - GO:0002062 chondrocyte differentiation was bound to a node named for and evidenced by
    increased PROLIFERATION. In the growth plate those are opposing states, so the binding asserted
    the opposite of the node above it. Rebound to GO:0035988 chondrocyte proliferation.

    ITEM 2 - modifier DECREASED on "Deranged Endochondral Ossification" contradicted the node's own
    description and the entry's whole thesis, which is that the lesion is deranged rather than
    deficient. DYSREGULATED is the ModifierEnum value the prose was asking for.

    ITEM 3 - HP:0005930 Abnormal epiphysis morphology was a parent grouping term carrying three
    distinct findings. Split into Enlarged epiphyses (HP:0010580), Thick growth plates (HP:0025369)
    and Pseudoepiphyses of hand bones (HP:0004288). The last one is the sharp part of the finding:
    I correctly rejected the report's HP:0006262 for pseudoepiphyses, because it is really
    Aplasia/Hypoplasia of the 5th finger - and then dropped the concept instead of searching for
    the right term, which exists. Rejecting a wrong binding is only half the job. Thick growth
    plates also gives the entry its only metaphyseal finding; the "metaphyseal" third of the
    disease name previously had no phenotype behind it.

    ITEM 4 - "pubis, and ischia" was carried inside the vertebral-ossification snippet and never
    curated. Now its own phenotype (HP:0008788), with independent confirmation from the six-patient
    series where it is a constant feature rather than a finding of the severe end.

    SUGGESTIONS ALL TAKEN. Scoliosis loses its FREQUENT band - no source counts it, and phenotype
    support is not frequency support - and its evidence_source drops from HUMAN_CLINICAL to OTHER,
    since the zebrafish paper presents no human data and that sentence is its background
    characterisation. Supernumerary distal limb joints and coronal cleft vertebrae added. NKX3-1
    added as a MODIFIER with both halves of the murine result: the double null is worse than the
    Bapx1 single null, and the Nkx3.1 single null has no skeletal phenotype at all, which is what
    makes it a modifier rather than a second disease gene.

    DECLINED, with the reason recorded in the genetic notes: the gnomAD constraint metrics (pLI
    0.0009, LOEUF 1.07, o/e 0.67). They are a database lookup with no citable publication behind
    them in the report and could not be verified from this environment, so they are recorded as a
    lead rather than asserted as evidence.

    ORPHAN CHECK. Adding phenotypes created three new pathograph orphans - the exact defect #10995
    was pulled up on. Pubic ossification and coronal clefts are now wired DIRECT from the
    ossification node. Supernumerary distal limb joints is deliberately left unwired with the
    reason recorded: the joint-proliferation node is the tempting target and both concern joints,
    but that is a shared anatomical locus rather than a stated mechanism, and an edge drawn on the
    word "joint" appearing in both would be the unsupported inference this entry declines elsewhere.

    One self-inflicted error caught by validation during the round: I wrote a reference_title from
    memory for PMID:29704686 instead of copying it from the cache, and linkml-reference-validator
    rejected it. Fixed from the cache.

    Validation after the round: 51/51 snippets verified, up from 39/39. All gates clean.

  summary: 'Create: Spondylo-megaepiphyseal-metaphyseal Dysplasia (MONDO:0013228,
    NKX3-2)'
  details: |
    New entry for SMMD (MONDO:0013228), the NKX3-2-related skeletal dysplasia. Five references,
    39/39 snippets verified.

    The pathograph runs from NKX3-2 loss of function through derepression of the chondrocyte
    maturation program to a deranged - not simply deficient - endochondral ossification: axial
    ossification is delayed or absent while appendicular epiphyses are enlarged, which is the
    combination that gives the disease its name. A second, later-acting arm from the adult viable
    zebrafish mutant accounts for the overgrowth component.

    THE CERVICAL FINDING, and how it was nearly missed. The first draft of this entry covered
    cervical cord compression only in the perinatally lethal neonate, as a single-case
    observation. The deep-research report surfaced PMID:22791571, a six-patient series devoted to
    exactly this, in which FIVE OF SIX patients suffered cervical cord injury manifesting as limb
    spasticity. That is the survivors' dominant morbidity and the single point in this disease
    where an intervention changes the outcome: the upstream lesion is an embryonic
    transcription-factor failure and is not accessible after birth, while cervical instability is
    detectable and stabilisable before the cord is injured.

    Added as a consequence: a Cervical Spine Instability and Cord Injury pathophysiology node
    wired off the ossification defect, Cervical instability (HP:0008462) and Spasticity
    (HP:0001257) phenotypes, a Prophylactic Cervical Spine Stabilization treatment linked to that
    node, and a cervical spine surveillance diagnosis entry.

    This was mined BEFORE opening the PR rather than after, which is the direct lesson from the
    two concurrent PRs in this batch: #10995 was pulled up for mining a 1,095-line full text only
    for its abstract, and #10998 for using 7 of 40 verified references while its own notes
    complained the evidence base was thin. The general defect is treating a source as consumed
    once anything has been taken from it.

    EVIDENCE DISCIPLINE ON THE NEW MATERIAL. Both new frequency bands are stated with their
    fragility rather than only their number: 5/6 is 83% and sits in VERY_FREQUENT, but on six
    patients from the only series that has looked, and the authors flag the small denominator
    themselves. The treatment is recorded as a proposal, not a demonstration - the source says
    stabilization "might prevent" the complications, and no series has reported outcomes in
    prophylactically stabilised patients. The snippet preserves the authors' own grammatical slip
    ("might prevent of the neurologic complications"), since a snippet does not correct its source.

    DELIBERATELY NOT DONE:
    - Duodenal atresia remains the one phenotype not wired into the pathograph. It is a
      single-patient observation with no sourced mechanistic link to the skeletal lesion, and the
      reason is recorded in its description. An unsupported edge is worse than an unconnected
      phenotype.
    - No conforms_to module link. defective_skeletal_mineralization was checked and does not fit:
      it scopes to rickets, a mineralization failure of otherwise normal cartilage, whereas the
      lesion here is a transcriptional failure of the chondrocyte maturation program.
    - The report's obsolete GO:0051092 and mislabelled HP:0006262 (reported as "Pseudoepiphyses of
      the hand bones", actually "Aplasia/Hypoplasia of the 5th finger") were not bound. Its
      off-topic PMID:17310243 and its one unsupported quote (PMID:10572046) were not used.

    REPORT IDENTITY. This is the only one of the three openscientist reports in this batch to
    state a correct MONDO ID: MONDO:0013228, matching the entry and the stub, with OMIM 613330
    agreeing on both sides. just preflight-dr returns WARN because RUNX2 is mentioned at 28% of
    NKX3-2's rate, but that is expected rather than a second disease entity - NKX3-2 represses
    RUNX2, and that repression is the entry's second pathophysiology node.

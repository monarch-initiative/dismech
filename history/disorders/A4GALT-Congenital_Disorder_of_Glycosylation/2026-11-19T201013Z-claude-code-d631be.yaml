  summary: 'Create: A4GALT-Congenital Disorder of Glycosylation'
  details: |
    De novo curation of MONDO:0100587 from a claude_code deep-research report (research/A4GALT-Congenital_Disorder_of_Glycosylation-deep-research-claude_code.md), after four OpenScientist runs failed: all four were cancelled at the deep-research client's 3600s default, and a solo rerun at the provider's 7200s maximum (the cap enforced by OpenScientistParams.timeout) produced no report in two hours. preflight-dr returned WARN with confabulation_rate 0.015; the flagged second gene 'P1' is the P1PK blood-group antigen, this disease's own biology rather than a second entity. Every snippet was re-verified against the local reference cache rather than taken from the report: 20 snippets checked, 0 issues. Primary sources cached and cited: PMID:39511480 (2024 Gb3/CD77 synthase review, full text), PMID:41368234 (Indian p-phenotype series, full text), PMID:8139629 (parvovirus B19 resistance), PMID:10747952, PMID:10993874, PMID:18067504, PMID:12823750 (founder and null alleles), PMID:33326620 (anti-PP1Pk in pregnancy), PMID:22965229 (NOR split), PMID:23927681, plus the ClinGen CDG GCEP Definitive assertion. GeneReviews absence recorded as a verified negative: check-genereviews returns NO_CHAPTER with the full synonym list present. Three adjacent entities deliberately excluded and documented in notes: NOR polyagglutination syndrome (p.Gln211Glu, split by ClinGen), Fabry disease (GLA, Gb3 catabolism), and Shiga toxin-associated HUS (A4GALT as receptor synthase, not disease gene). Recurrent spontaneous abortion left ontology-unbound because HP:0200067 is outside the PhenotypeTerm enum, following the precedent in Uterine_Leiomyoma and Ventriculomegaly_and_Arthrogryposis. Validated with just validate (schema, terms, references) plus check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-snippet-grading, check-gene-namespaces, check-shared-disease-terms, check-logical-rules, check-snippet-length and check-reference-titles.

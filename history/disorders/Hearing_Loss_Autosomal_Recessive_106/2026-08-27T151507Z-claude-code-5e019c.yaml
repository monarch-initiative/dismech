  details: |
    De novo curation of EPS8L2-related hearing loss, DFNB106 (MONDO:0033198), from the claim in issue #9625.

    Deep research: claude_code provider, clean this time - 10/10 references resolved, 1/1 quotes valid, 10/10 on topic, needs_review not set. That is a contrast with the two preceding entries in this session (#9623, #9624), where the same provider failed quote validation. Falcon/Edison remained unavailable (HTTP 402). No GeneReviews chapter for DFNB106.

    Four-node pathograph: EPS8L2 loss of function to failure of stereocilia actin core maintenance to progressive hair bundle disorganisation to loss of mechanotransduction.

    The organising mechanistic point is the division of labour within the EPS8 family. EPS8 handles initial stereocilia elongation and its loss causes congenital deafness (DFNB102); EPS8L2 handles maintenance in adult hair cells and its loss causes late-onset progressive loss. That timing difference is what predicts the clinical difference, and the mouse work shows it is row-selective - the tall stereocilia row shortens while middle and small rows are spared.

    Two animal models curated with modeled_mechanisms:
    - The Eps8l2 null mouse (PMID:23918390), graded RECAPITULATES / HIGH. Worth noting in provenance: this model was published in 2013, two years before the human gene association, and the founding human paper cites the mouse phenotype as the reason EPS8L2 was a candidate. Its limitations field records that mouse onset is "late-onset" while human onset runs prelingual to about six years, so the two are not on a matched timescale.
    - The Rhodesian Ridgeback early onset adult deafness model (PMID:35385474), graded PARTIALLY_RECAPITULATES / MODERATE. Its limitations field states three things explicitly: the evidence is genetic and audiometric with no cochlear histology reported, the allele is a 12-bp in-frame deletion rather than a truncating variant so residual function is plausible, and the authors themselves describe it only as a strong candidate causal mutation. The corresponding evidence item is graded PARTIAL to match that hedging.

    A KNOWLEDGE_GAP discussion covers the therapeutic window. The 2026 series argues explicitly that the progressive course leaves surviving hair cells during a period when intervention could act, and identifies natural history as the missing preclinical piece. The discussion states the pessimistic reading too: because EPS8L2 maintains rather than elongates stereocilia, restoring it late may be unable to rebuild what has degraded. That is framed as the open question rather than assumed either way, with the inducible-rescue experiment that would answer it.

    Judgement calls:
    - The high-frequency phenotype carries a second evidence item graded PARTIAL, quoting the U-shaped audiograms found with an Iranian founder variant. It qualifies rather than supports the high-frequency pattern, and grading it SUPPORT would have misrepresented it.
    - The diagnosis section leads with the newborn-screening failure rather than with sequencing technology, because a passed newborn screen is the trap this disease sets and it follows directly from the maintenance mechanism.
    - The de novo allele in trans with an inherited one (PMID:41578500) is called out in inheritance, since it breaks the usual assumption in a recessive disease that both parents are carriers.

    One snippet was re-quoted after the snippet audit rejected it: the reference validator strips bracketed spans such as "[left]" and "[right]" before matching, so the audiometric quote was truncated before the per-ear figures. The explanation field records why.


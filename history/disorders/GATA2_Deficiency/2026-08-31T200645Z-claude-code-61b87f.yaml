  summary: 'Create: GATA2 Deficiency'
  details: |
    Created kb/disorders/GATA2_Deficiency.yaml for MONDO:0042982, the parent GATA2 deficiency entity. The already-curated Deafness-Lymphedema-Leukemia_Syndrome — Emberger, MONDO:0013540 — describes itself as a presentation within this spectrum, so the parent entry was the gap. Six pathophysiology nodes: GATA2 haploinsufficiency, HSPC depletion, mononuclear cytopenia, impaired antimycobacterial and antiviral immunity, clonal evolution to myeloid malignancy, lymphatic vascular development defect. Eleven phenotypes, one genetic block, allogeneic HSCT as treatment. Deep research: falcon was requested but returned HTTP 403 for an invalid EDISON_API_KEY; the run fell back to claude_code via --fallback-provider, recorded in the report frontmatter as fell_back, requested_provider and provider_attempts. Report references validated 14 of 14 resolved, confabulation_rate 0.0. The report Term Validation section flagged five mislabelled HP CURIEs — for example it called HP:0005506 bone marrow hypocellularity when that ID is Chronic myelogenous leukemia — so no CURIE was taken from the report. All HP and HGNC bindings were resolved independently from cache/hp/terms.csv, cache/hgnc/terms.csv and exact-match OLS queries. Validated with just validate covering schema, terms and references, 22 of 22 snippets verified, plus check-duplicate-keys and check-entity-refs.

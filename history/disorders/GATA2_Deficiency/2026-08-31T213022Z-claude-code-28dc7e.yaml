  details: |
    Third review response on PR 10285, addressing the two remaining blocking items. Item A: both evidence items on PMID:31582413 were graded IN_VITRO, but that paper is a mixed mouse and human-primary-cell study and the quoted sentences were the in vivo half. Valve development and vessel patterning are organismal readouts established in mice and embryos, so the grade understated the species caveat on what is the sole mechanistic support for the lymphatic node. Regraded to MODEL_ORGANISM, added the miR-126 knockout embryo sentence as a second in vivo item, and added the HLEC sentence as a genuinely in vitro item so each grade reflects the work that produced it. This follows the CLAUDE.md rule to split a mixed-source paper by source rather than assigning one grade across both halves. Item B: the HSCT treatment description asserted that transplant before evolution to monosomy 7 or advanced MDS gives markedly better outcomes, and none of its three evidence items bore on timing. This is an actionable clinical claim that a reader could act on from the rendered page, so it should not have been the uncited sentence in the block. Now cited from PMID:34244664, the EWOG-MDS registry series of 65 transplanted children and adolescents, which was fetched for this PR and unused: worse outcome with advanced disease and monosomy 7, and the conclusion supporting early transplant. Also softened the Alveolar Macrophage Depletion description, which asserted the lesion is upstream of GM-CSF receptor signalling when neither of that node's snippets addresses GM-CSF; the description now states the macrophage-supply contrast and says plainly that the cited sources establish the monocyte link rather than the GM-CSF comparison. The reviewer withdrew its own item 4 after checking that a top-level references block is a 67 percent convention rather than a universal one, and downgraded items 7 and 9 to completeness; those and the GeneReviews baseline are deferred to a follow-up PR by mutual agreement. Verification method: per-node and per-treatment evidence coverage confirmed by parsing the YAML and printing counts, after an earlier commit on the sibling RTPS branch claimed coverage that string replacements had silently failed to apply. Validated with just validate, 42 of 42 snippets verified, plus check-snippet-grading, check-duplicate-keys, check-entity-refs, check-folded-hyphens and a scripted reference_title audit.

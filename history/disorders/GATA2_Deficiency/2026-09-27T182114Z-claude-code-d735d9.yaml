  summary: 'Genetics pass: MonoMAC subtype row and phenotype wiring'
  details: |
    Genetics pass for the d2g gap list in issue 12280. The issue's single row for this parent
    was MONDO:0013607 monocytopenia with susceptibility to infections, whose MONDO OWL axiom
    records hgnc:4171 GATA2 as the causal gene.

    Anchor audit first. The entry binds MONDO:0042982 GATA2 deficiency with susceptibility to
    MDS/AML. Read live from OLS4: that class has exactly two children, MONDO:0013540
    deafness-lymphedema-leukemia syndrome and MONDO:0013607, and its own definition states that
    MonoMAC, Emberger syndrome and familial MDS/AML "appear to be part of a broader disease
    entity" given the shared haploinsufficiency mechanism. The anchor is therefore neither
    over-broad nor inflating: both children are GATA2 presentations this entry already names in
    its description and synonyms. No re-anchoring needed.

    Row disposition. MONDO:0013607 is curated as a has_subtypes row named MonoMAC, with
    subtype_term bound to that CURIE, genes GATA2 read live from rest.genenames.org in the same
    step (hgnc:4171, approved symbol GATA2, no previous symbols), and one exact-quote evidence
    item from PMID:24227816. Not promoted to its own entry: the mechanism, the pathophysiology
    nodes and the treatment are those already modelled here, so a separate entry would duplicate
    this one. The corresponding stub, stubs/Monocytopenia_With_Susceptibility_To_Infections.yaml,
    is deleted by this change.

    Pathograph wiring, which is where the real gap was. Before this change no phenotype in the
    entry had an incoming causal edge and four of the seven pathophysiology nodes had no outgoing
    edge, so the chain stopped at the pathophysiology layer and the eighteen phenotypes rendered
    as a disconnected island. Six downstream blocks and one phenotype sequela were added, every
    edge description restating a claim the source node's own description and cited snippets
    already carry. No new reference was fetched for this entry.

    Measured with dismech.qc_plugins on the committed tree, before and after:
      phenotypes[].causal_inlink       0/18 -> 13/18
      genetic[].mechanism_outlink      1/1  -> 1/1 (unchanged)
      pathophysiology nodes with no downstream edge  4 -> 0

    Five phenotypes are deliberately left unwired because no node in the entry explains them:
    sensorineural hearing loss, pulmonary arterial hypertension, panniculitis, venous thrombosis
    and hypothyroidism. All five are recorded associations from the 57-patient NIH cohort with no
    mechanism curated here, and an edge added to clear a report would assert one.

    Phenotypes were not stratified with subtype: MonoMAC. The entry's position, and MONDO's, is
    that these presentations overlap within individuals, so tagging monocytopenia or mycobacterial
    infection as MonoMAC-only would assert an exclusivity neither source supports.

    Validation on the committed tree: just validate, just validate-terms and just validate-disorders
    all pass; 43/43 snippets verified by just count-verified-snippets after reverting the 15
    reference caches that fix-references-cache renormalised during the run. just check-genereviews
    reports NO_CHAPTER, confirmed against cache/bookshelf/genereviews.csv, which holds no GATA2
    chapter. Neither ClinGen nor Orphanet could be consulted: data/clingen and data/orphadata hold
    only MANIFEST.yaml in a fresh worktree, and no CGGV cache among the 673 committed mentions
    GATA2.

    One lump/split question is left for a maintainer rather than settled here. The sibling
    presentation Emberger syndrome is curated as its own Disease entry,
    kb/disorders/Deafness-Lymphedema-Leukemia_Syndrome.yaml bound to MONDO:0013540, while MonoMAC
    is now a subtype row of this entry. Both are children of this entry's anchor, so the knowledge
    base now treats two siblings asymmetrically.

  details: |
    Addressed the IMPORTANT finding from the automated PR review on #11912 (monarch-initiative/dismech#11912): three evidence items were graded MODEL_ORGANISM but their quoted sentences describe oxygen-glucose-deprivation (OGD) experiments on cultured cells, which CLAUDE.md classifies as IN_VITRO. Changed to IN_VITRO: the two PMID:32450052 items on the 'Post-Ischemic Autophagic-Lysosomal Dysfunction -> Excitotoxic and oxidative neuronal injury' edge (quoting 'OGD-exposed neurons' and lentiviral CTSD restoration in OGD-treated neurons -- that paper's own abstract confirms the OGD arm used mouse cortical neuron culture, distinct from its separate MCAO in vivo arm), and the PMID:37324944 item on the 'Astrocyte and Cerebral Endothelial Cell Senescence -> Neurovascular inflammation and barrier disruption' edge (quoting SASP factors observed in 'oxygen-glucose deprivation-treated astrocytes and CECs'). Left as MODEL_ORGANISM: the node-level PMID:32450052 item (its snippet spans the in vivo MCAO-mouse-brain result) and the PMID:37324944 items quoting the ABT-263/lenti-INK-ATTAC results, which were obtained in MCAO mice. Also fixed a folded-scalar YAML hyphen split (CI's check_folded_hyphens.py gate) introduced in the same original commit. Re-validated with just validate-disorders (schema+terms+references) and just check-snippet-grading.

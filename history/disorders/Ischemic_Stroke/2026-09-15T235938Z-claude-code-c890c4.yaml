  summary: Add autophagy/senescence/inflammasome pathophysiology nodes
  details: |
    Addressed issue #11902 (leftover from #6189/#5847, PMID:42419491 Ellappan et al. 2026 axis handoff). Added three new pathophysiology nodes evidenced with primary literature (not the review, which is background-only): (1) Post-Ischemic Autophagic-Lysosomal Dysfunction, conforms_to disabled_macroautophagy#Failure of Cytoplasmic Quality Control, cited to PMID:33974897 (mouse tMCAO time-course showing Beclin-1/LC3B induction then decline) and PMID:32450052 (mouse MCAO+OGD, cathepsin D/lysosomal-function loss aggravates and restoration rescues neuronal death); (2) Astrocyte and Cerebral Endothelial Cell Senescence, conforms_to cellular_senescence#Senescent Cell Accumulation, cited to PMID:37324944 (mouse MCAO, p16INK4a/SASP induction in astrocytes and cerebral endothelial cells, senolytic and localized senescent-cell clearance both neuroprotective) and PMID:42479998 (human clinical cohort, blood senescence gene-expression signature associated with worse 90-day mRS outcome); (3) Microglial NLRP3 Inflammasome Activation in the Ischemic Penumbra, conforms_to nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation, cited to PMID:32703402 (mouse MCAO, NLRP3 dramatically activated in the peri-infarct/penumbral area, TRIM62 knockout suppresses it and improves outcome). All three nodes are wired into the existing pathograph via new downstream edges from Cerebral arterial occlusion / Ischemic penumbra and energy failure / Neurovascular inflammation and barrier disruption, and downstream to Excitotoxic and oxidative neuronal injury or back into Neurovascular inflammation and barrier disruption, most with their own edge-level evidence distinct from node-level evidence. Researched via manual PubMed E-utilities search (NCBI esearch/efetch), not a just research-disorder deep-research run, since this was a targeted literature search for three specific mechanisms rather than a full disease research pass. Validated with just validate-disorders (schema+terms+references, 33/33 snippets verified), just check-entity-refs, just check-causal-targets (0 new dangling targets), just check-duplicate-keys, just check-qualifier-terms, just check-enum-values, and just list-gene-term-mismatches (0 mismatches).

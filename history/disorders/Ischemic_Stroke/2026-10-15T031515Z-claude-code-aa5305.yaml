  summary: Extend the post-ischemic mitochondrial dysfunction node with focal-ischemia,
    succinate and NLRP3 evidence
  details: |
    Extended the Post-Ischemic Mitochondrial Dysfunction node added in #14195 with evidence curated separately for #14173. Added to the node: two PMID:10461911 items showing loss of mitochondrial respiration in the ischemic focus during rat middle cerebral artery occlusion and its persistence into reperfusion after longer ischemia, and a PMID:25383517 item on reperfusion ROS from succinate re-oxidation by reverse electron transport at complex I. Added cerebral cortex and striatum locations. Added edge evidence: PMID:25383517 on the edge from Ischemic penumbra and energy failure; on the edge to Excitotoxic and oxidative neuronal injury, a PMID:25383517 SUPPORT item (succinate inhibition reduces injury in a mouse stroke model) and a PMID:10461911 REFUTE item (infarction despite respiration recovering after 2 h of ischemia). Added a new edge to Microglial NLRP3 Inflammasome Activation in the Ischemic Penumbra citing PMID:30153825, split into an IN_VITRO and a MODEL_ORGANISM item. The existing evidence from #14195 is unchanged; its PMID:8571432 item already notes that study used global ischemia.

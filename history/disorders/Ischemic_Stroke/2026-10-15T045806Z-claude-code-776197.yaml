  summary: Add chronic low-grade systemic inflammation node conforming to inflammaging
  details: |
    Added the node Chronic Low-Grade Systemic Inflammation, conforming to inflammaging#Chronic Low-Grade Sterile Inflammation, upstream of Cerebral arterial occlusion and Neurovascular inflammation and barrier disruption.

    Evidence: pooled prospective CRP data (PMID:20031199) and pooled post-stroke IL-6/CRP recurrence data (PMID:37026458) on the node; IL-6 signaling Mendelian randomization (PMID:32397738), including the large-artery and small-vessel restriction, on the edge to arterial occlusion, with the null CHANCE-3 colchicine trial (PMID:38925803) as an INDIRECT REFUTE item; and the aged-mouse atypical-neutrophil study (PMID:37188941), with its elderly-patient finding as a separate HUMAN_CLINICAL item, on the edge to neurovascular inflammation.

    The description states that most human evidence concerns inflammation generally rather than age-driven inflammation. Considered and not used: CANTOS (PMID:28845751) reports stroke only within a composite endpoint; PMID:25932801 is a letter with no quotable abstract; PMID:37188943 is a commentary on PMID:37188941.

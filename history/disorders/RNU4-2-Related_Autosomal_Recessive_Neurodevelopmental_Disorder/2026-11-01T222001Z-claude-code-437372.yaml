  summary: 'Create: RNU4-2-Related Autosomal Recessive Neurodevelopmental Disorder'
  details: |
    Promoted the recessive RNU4-2 subtype row of ReNU_Syndrome to its own Disease entry. Primary source PMID:41951959 (Rius et al., 38 individuals with biallelic RNU4-2 variants, cached full text), with the companion saturation genome editing paper PMID:41951737 and an independent Japanese cohort PMID:41408479 found by a PubMed search for RNU4-2 with biallelic, recessive or homozygous. PMID:42353806 was fetched during the search, concerned a ReNU case, and its cache file was deleted. MONDO has no class: OLS4 MONDO searches for RNU4-2, U4 snRNA, recessive neurodevelopmental white matter snRNA and RNU4-2 recessive were re-run on 2026-11-01, so disease_term is unbound and MONDO:0100500 Mendelian neurodevelopmental disorder (the parent of the ReNU syndrome class) is a broadMatch. The name follows the GeneReviews sibling chapter RNU4-2-Related Autosomal Dominant Neurodevelopmental Disorder. The variant node conforms to spliceosome_component_dysfunction#Germline Spliceosome Component Variant; no other node conforms because no splicing defect was detected in patient blood, which is recorded as a knowledge gap. RNU4-2 is a non-coding gene, so one line was added to tests/gene_activity_grounding_baseline.txt. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified) and the KB gates.

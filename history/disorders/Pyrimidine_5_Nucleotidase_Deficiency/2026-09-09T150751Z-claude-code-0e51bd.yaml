  summary: 'Review round 1 on PR #11529: cholelithiasis, modifier genes, variants,
    biochemical, splenectomy harm'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11529. All four important findings accepted; four of five suggestions taken; the fifth could not be completed and produced a filed tooling issue instead.

    Finding 1 accepted: Cholelithiasis added as a phenotype (HP:0001081, FREQUENT), cited to PMID:25153905, which reports gallstones in both members of a father-and-daughter pair and severe intrahepatic cholestasis in the father after stone removal. That is the evidence behind the biliary-surveillance recommendation the entry already made in prose.

    Finding 2 accepted: UGT1A1 and HBB added to genetic: as relationship_type: MODIFIER entries. UGT1A1 modifies the hyperbilirubinemia rather than the enzymopathy. HBB carries the hemoglobin E interaction, and the notes make the point that the interaction is not additive: in the reported family, single homozygotes for either condition were asymptomatic or mild while the double homozygote had severe hemolysis.

    Finding 3 accepted, and it improved the entry more than expected. PMID:16522554 carries 'No correlation has been found between residual activity and degree of hemolysis' verbatim. That is now cited on the Shortened Erythrocyte Survival node and folded into the knowledge-gap discussion, because it is the strongest single reason that node is HYPOTHETICAL rather than merely unmeasured: if the amount of enzyme lost does not predict the amount of destruction, the intervening step is not a dose-response.

    Finding 4 could not be resolved as asked, and the reason is a tooling gap now filed as issue #11530. The uncited 'Chinese cases' claim rests on PMID:34547876, which this PR caches. It is a Chinese-language paper whose cached record holds no English body text. Every possible snippet from it fails a gate: check-snippet-length tokenises on whitespace and requires an ASCII character per token, so a Chinese sentence of any length counts as one word or zero, and the only English string in the record is the title, which check-title-snippets rejects. Three Chinese-language evidence items were written, validated against the reference cache, and then removed when check-snippet-length rejected them. The claim was rewritten to rest on PMID:25153905, which reports the same UGT1A1 co-inheritance in English; the Chinese report's findings are recorded in prose with the PMID named, in the UGT1A1 genetic notes and in a variants record, and the entry notes explain the tooling reason. Issue #11530 proposes counting CJK codepoints as words, which leaves every Latin-script snippet unchanged.

    Suggestions. Four variant records added (the three Chinese alleles as one record, p.R56G Campinas, and IVS8+1-2delGT). A biochemical block was added covering the enzyme assay - including the reticulocyte correction and the activity/severity dissociation - and the nucleotide-pool composition with the ultraviolet screening shift. The splenectomy harm signal from PMID:24287477 was added with supports: REFUTE, since sustained extreme thrombocytosis with portosplenomesenteric vein thrombosis is evidence of harm rather than of absent benefit; the treatment description now says the balance is unfavourable rather than open. Iron overload was not added: the cited source describes intrahepatic cholestasis after stone surgery rather than siderosis, and asserting iron overload from it would overstate what it says.

    Validation after the round: just validate-disorders passes, 48/48 snippets verified against cached references; check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-environmental-evidence, check-snippet-grading and check-snippet-length all pass.

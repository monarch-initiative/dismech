  summary: 'Create: Pyrimidine 5-Nucleotidase Deficiency (NT5C3A, MONDO:0009946)'
  details: |
    De novo curation of pyrimidine 5'-nucleotidase deficiency, claimed on issue #11521.

    Deep research: one OpenScientist run (research/Pyrimidine_5_Nucleotidase_Deficiency-deep-research-openscientist.md, 59 min, 18 citations). The report had no reference_validation or term_validation frontmatter, so both were retro-fitted with just validate-research-reference and just validate-research-terms and are committed with it. References: 20/20 resolved, 0 unresolved, 0 unverifiable, 0 off topic, 1/1 quoted claim found in source. Terms: 34 checked, 32 resolved, 0 unresolved, 0 obsolete.

    The report proposed one wrong ontology binding and it is the important finding of this curation. It offered HP:0011273 as 'basophilic stippling of erythrocytes'. HPO calls HP:0011273 Anisocytosis, defined as abnormally increased variability in erythrocyte size, which is a different phenotype. The report's own term-validation section flagged it under 'Terms the report names something else', and it was not used. This matters because basophilic stippling is the diagnostic hallmark of this disease and HPO has no term for it: I had already bound the parent HP:0020080 Erythrocyte inclusion bodies with an explicit preferred_term and filed a CURATION_TODO discussion about the gap. The report independently demonstrated that a missing term does not stay missing - something plausible gets bound in its place. The discussion now records the incident.

    Note also that HP:0020081 Pappenheimer bodies is a second inviting wrong answer here: its HPO definition contains the words 'basophilic stippling', but Pappenheimer bodies are iron-containing siderotic granules, a different entity. It was deliberately not used.

    What the report contributed. A candidate mechanism for the one step this entry marks HYPOTHETICAL: inhibition of hexose monophosphate shunt activity in young erythrocytes as a second contributor to the hemolysis, beyond the nucleotide load. PMID:8839873 was fetched and cited for it, graded directness: INDIRECT because the observation is about hemoglobin E instability in enzyme-deficient cells rather than about hemolysis in the isolated disorder, and quoted with the source's own 'increasing evidence' and 'it is likely'. The node description also records the unresolved tension with the raised reduced glutathione, which points the other way and which no cited source reconciles. Splenomegaly was added as a phenotype from PMID:6254919.

    Fifteen report-only PMIDs were fetched into references_cache; they are committed because the report cites them.

    GeneReviews baseline: none exists. PubMed searched for "pyrimidine 5'-nucleotidase deficiency GeneReviews[All Fields]" with no results. The phenotype baseline is the 1974 primary description (PMID:4372252), the 2000 twenty-five-year review (PMID:10916681), and recent case reports.

    Naming decisions worth recording. The entry name and filename drop the prime from 'pyrimidine 5'-nucleotidase' because an apostrophe in a KB filename has broken this repository's shell tooling before; the primed form is carried in disease_term.preferred_term, in synonyms, and in every quoted snippet. The historical names 'high ATP syndrome' and 'ribose phosphate pyrophosphokinase deficiency' are recorded as synonyms because both were wrong and the older literature is filed under them.

    Two hedged mechanism nodes carry mechanism_confidence: the rRNA-degradation node is PROVISIONAL (its source says 'It is postulated that'), and the hemolysis node is HYPOTHETICAL.

    Validation run in this worktree: just validate passes, 35/35 snippets verified against cached references.

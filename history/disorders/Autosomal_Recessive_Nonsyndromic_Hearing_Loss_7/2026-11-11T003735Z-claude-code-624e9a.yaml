  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 7 (DFNB7/11, TMC1,
    MONDO:0010967)'
  details: |
    Replaced the 31-line placeholder with a full entry for biallelic TMC1 hearing loss, from the cached claude_code deep-research report research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_7-deep-research-claude_code.md (2026-11-10; just preflight-dr returns PASS, TMC1 named 62 times).

    Pathograph: 7 debundled nodes, one mechanistic claim and one biological_scale each, running TMC1 biallelic loss of function -> loss of the TMC1 pore subunit from the stereociliary MET complex -> absent hair-cell mechanoelectrical transduction current -> failed hair-cell functional maturation -> cochlear hair cell degeneration -> loss of sound-evoked cochlear output -> the six phenotypes, plus a separate hypomorphic-allele lesion node wired to moderate hearing impairment. All 6 phenotypes carry a causal inlink and the TMC1 gene lands on a molecular function node (GO:0008381), so this file does not appear in just compliance-connectivity --list-unconnected. just check-entity-refs passes.

    Module conformance: 2 links to sensorineural_hair_cell_loss (Cochlear Sensory Epithelium Insult; Hair Cell Mechanotransduction Failure and Death). just check-conformance-content reports both links sharing at least one GO term with their module node, with no cell_type_absent or edges_absent findings. The three module nodes deliberately not conformed to, and why, are recorded in notes.

    GeneReviews: just check-genereviews --online reports TAGGED_OVERVIEW. The only chapter is PMID:20301607 Genetic Hearing Loss Overview (NBK1434), Overview-format and marked [purpose statement only], so it is not a phenotype baseline. It is tagged GeneReviews in top-level references, and notes records that the phenotype baseline came from PMID:34523024, PMID:33352559, PMID:31854501, PMID:35407445 and PMID:26879195 instead.

    ClinGen: the Definitive AR assertion for TMC1 carries the pre-CGGV identifier CGGCIEX:assertion_5658. just clingen-rebuild --id CGGCIEX:assertion_5658 --csv-only was run and answered 'not found in ClinGen index', writing no cache file, so the classification is stated in the TMC1 genetic row's features rather than as a structured gene_disease_validity assertion, following the Usher_Syndrome_Type_3 precedent. just check-gene-validity reports zero findings in every class.

    Re-checked identifier: the report's reference_validation lists PMID:34523024 as unresolved with one unverifiable quote. It was re-checked rather than dropped: references_cache/PMID_34523024.md holds the record as full_text_xml (Nishio & Usami, Hum Genet 2022), so the report's lookup failed rather than the identifier being fabricated, and every snippet taken from it verifies against that cached text. The report's two mislabelled terms (DOID:0110520, UBERON:0001844) do not affect any binding here.

    Scope: DFNA36 (dominant TMC1, MONDO:0011708) is excluded throughout; the Beethoven mouse is recorded with FAILS_TO_RECAPITULATE and the allele-specific RNAi/Cas9 papers are cited only to mark what does not transfer. Duplicate surfaces checked: no kb/ entry carries MONDO:0010967, MYO6_Hearing_Loss.yaml carries only DFNA22 and DFNB37 as has_subtypes, and just preflight-claim-conflict MONDO:0010967 reported no competing claim. The per-locus-versus-per-gene lumping question is cross-referenced to dismech#9863 in a CURATION_TODO discussion.

    7 discussions: what kills the hair cells (KNOWLEDGE_GAP), human vestibular evidence (HUMAN_MODEL_MISMATCH), Beethoven allele scope (INTERPRETATION), AAV TMC1 translational distance (KNOWLEDGE_GAP), cochlear implant outcome variability (CONTROVERSY), unexplained locus linkage (OPEN_QUESTION), per-locus entry scope (CURATION_TODO).

    Red-team review before commit: the entry was reviewed in a separate fresh-context pass against the dismech-pr-review rubric, which returned REQUEST_CHANGES with three blocking and eleven important findings; all were addressed before this record was finalised. The blocking three: a maturation-potassium-current readout evidenced by a gene-expression sentence (replaced with the K+ current sentence from the same abstract, PMID:16627570); a vestibular claim that the human literature was silent, when PMID:34744965's cached full-text Table 2 records the single TMC1 child as having an abnormal rotary chair and peripheral vestibular loss (the diagnosis row, the HUMAN_MODEL_MISMATCH discussion and notes now carry that finding, with the real limitation being that the child's recessive-versus-dominant genotype class is in supplementary material the cache does not hold); and the claim that effective gene-therapy injections were neonatal in every successful study, refuted by PMID:33212302 (Baringo, later-stage treatment), PMID:30686588 (first adult-mouse study) and the sentence immediately after the quoted one in PMID:34523024 (rescue in 2- to 8-week-old mice).

    Other review fixes: structural-normality of hair bundles restricted to the Tmc1/Tmc2 double null; three model-row evidence items changed from background opening sentences to result sentences; "most genotypes are truncating" softened to "spans" with a note that missense was the largest class in the one cohort reporting variant classes; the back-computed "seven of thirteen families" denominator replaced with the source's own wording; p.Arg34Ter added to the less-than-profound allele list, which is the sharpest argument against reading severity from allele class; the Saudi five-allele count qualified as four recessive plus the dominant p.Asp572Asn; GO:0032420 stereocilium replaced with GO:0032426 stereocilium tip; the hypomorphic node routed into the main chain so the pathograph is one connected component; the hearing-aid treatment effect changed from BYPASSES to MODULATES; NCIT:C38036 Audiometric Test dropped from the vestibular diagnosis row, with the NCI EVS and cache queries that found no vestibular term recorded in the row's notes; the deprecated prevalence percentage slot left unset, with the cohort shares carried as case_fractions instead.

    Added in response to the review: a differential_diagnoses section (DFNA36, GJB2/DFNB1, OTOF/DFNB9 with preserved OAEs, SLC26A4/DFNB4-Pendred with inner-ear malformation, and panel-level heterogeneity), a temporal-bone imaging diagnosis row, the Baringo mouse model row, the per-gene TMC1 figure from the Iowa series' cached full-text table (10/440 diagnoses, 2.3%, 8 recessive) as a third case fraction, the combined DFNA36+DFNB7/11 burden estimate of about 2% of genetic hearing loss, a second cited allele (p.Asp684His) with its founder haplotype evidence, and PMID:30108254's explicit statement that TMC1 provides a function TMC2 does not. Four references were fetched for these: PMID:33256196, PMID:20301640, PMID:15605408, PMID:29533536.

    Validation after the fixes: just validate passes; just validate-terms passes; just count-verified-snippets reports 135/135 verified; just validate-disorders reports 135 snippets and 137 titles checked with 0 issues; just compliance 86.2% global / 86.4% weighted; just check-entity-refs, just check-conformance-content (2 links, both sharing a GO term) and just compliance-connectivity (all phenotypes wired, gene activity-grounded) all clean; the repo-wide CI gate list in scripts/run_ci_gates.sh was run locally against origin/main.

  details: |
    Created the MRXS99F (MONDO:0010502, OMIM:300968, USP9X/hgnc:12632) disorder entry end to end. Preflight: 'uv run runoak -i sqlite:obo:mondo info MONDO:0010502 -O obo' confirmed relationship RO:0004003 HGNC:12632 ! USP9X before any writing. Deep research provider: claude_code via 'just research-disorder claude_code' (24m49s, 106 turns, 24 citations, report committed under research/). GeneReviews baseline: searched PubMed three ways (USP9X GeneReviews[All Fields]; USP9X[All Fields] AND GeneReviews[Book]; USP9X-related neurodevelopmental disorder GeneReviews) - all zero hits, no GeneReviews chapter exists for USP9X, documented in notes:. Named-entity-confusion handling: this entry is scoped to the FEMALE-RESTRICTED entity only and explicitly separates it from the male USP9X entity MRX99 (MONDO:0010487, OMIM:300919) via a scope note in description:, a dedicated differential_diagnoses entry with six distinguishing features, an entity-boundary paragraph in genetic.notes, and per-evidence labelling wherever a male-cohort paper is cited. Inheritance is modelled as X-linked with female-restricted expression using the neutral HP:0001417 term rather than X-linked dominant or recessive, because USP9X escapes X-inactivation (so heterozygotes sustain a true dosage reduction, not a mosaic) and because male hemizygous nulls are non-viable (a survivorship filter, not a dominance relationship); the published Turner-syndrome counterargument to the plain haploinsufficiency model is recorded as evidence and as a discussion rather than suppressed. Content: 17 pathophysiology nodes forming one connected DAG with the single root 'USP9X Loss-of-Function Allele' (verified programmatically: no dangling targets, no unreachable nodes), 27 phenotypes with HPO terms, frequency bands asserted only where a quotable numeric or qualitative statement exists and omitted otherwise, genetic + 5 variants, prevalence, diagnosis incl. prenatal exome, 3 differential diagnoses, 8 treatments, 1 observational clinical trial, and 5 discussions (4 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH). Validation: 'just validate' clean (schema no issues, term validation passed, 147/147 snippets verified against cached references); 'just validate-terms' passed; 'just validate-references' 147/147; 'just compliance' 88.6 percent global / 88.8 percent weighted. All 22 PMIDs were fetched with 'just fetch-reference' and every snippet re-verified as a byte-exact substring; deep-research items flagged as paraphrase were discarded rather than repaired. Also recorded two upstream data issues (an apparently un-merged MONDO:0018821 duplicate, and ClinGen lumping the male and female entities under MONDO:0020119 with a conflicting recessive MOI label) and one OMIM digit error in PMID:35253988.

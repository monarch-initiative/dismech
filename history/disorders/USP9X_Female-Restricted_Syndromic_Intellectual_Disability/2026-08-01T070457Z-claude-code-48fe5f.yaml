  summary: 'Address review items: USP9X_Female-Restricted_Syndromic_Intellectual_Disability'
  details: |
    Closes the two blocking items from the PR #7602 review.

    BLOCKING 1 - ClinGen structured sources now cited. Generated references_cache/CGDS_HGNC_12632.md (just clingen-dosage-rebuild --id CGDS:HGNC_12632) and references_cache/CGGV_assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z.md (just clingen-rebuild --id ...), and added six snippet-verified evidence items: CGDS haploinsufficiency score 3 on pathophysiology#Female USP9X Haploinsufficiency; the CGDS narrative male-lethality sentence (PARTIAL) on pathophysiology#Hemizygous Male Lethality of Null Alleles; the CGGV Definitive gene-disease validity row plus the female-null/male-missense mechanism sentence on genetic#USP9X; the CGGV XCI-escape sentence (PARTIAL) on the inheritance block; and the CGGV male-versus-female contrast on the MRX99 differential. Every ClinGen citation carries an explanation stating that ClinGen lumps the male and female entities under MONDO:0020119 and labels MOI simply XL, neither of which this entry adopts, so the records are cited for the gene-disease relationship and mechanism only. The notes: lump-vs-split paragraph, which previously argued about ClinGen without citing it, now names both record ids. Both records added to references:.

    BLOCKING 2 - management entries added for curated phenotypes: Anorectal Malformation Repair (NCIT:C15329, SURGERY, HP:0004378), Cleft Palate Repair (NCIT:C15329, SURGERY, HP:0000175 + HP:0000193), Postaxial Polydactyly Excision (NCIT:C16186, SURGERY, HP:0100259), Antiseizure Pharmacotherapy (NCIT:C15986, SMALL_MOLECULE, HP:0001250), Behavioural Intervention for Autism, Anxiety and Aggression (NCIT:C181743, BEHAVIORAL, HP:0000729/HP:0000739/HP:0000718), and Ophthalmological Assessment and Surveillance (NCIT:C38060, HP:0000648). All new treatment evidence is marked PARTIAL because it evidences the target phenotype, not the intervention; no disorder-specific intervention evidence exists and none was invented. The antiseizure entry additionally records PMID:25763846 (newly fetched) as supports: NO_EVIDENCE, a direction-of-effect caution: USP9X INHIBITION suppresses seizures in prickle-mutant flies, the opposite dosage direction from this haploinsufficiency disorder, and must not be read as a therapeutic suggestion.

    Non-blocking review items also addressed: stale Short Stature explanation reworded to scope the FREQUENT band to the null-allele cohort rather than claiming the band is omitted; p.Arg215Ter evidence split into two quotes so the allele name and inherited origin are covered (a single continuous quote is impossible because the source hyphenates across a line break at follow-ing, which the reference validator does not join); NCIT:C15747 Supportive Care replaced with NCIT:C16525 Echocardiography Test on the cardiac entry and NCIT:C38036 Audiometric Test on the audiology entry, with descriptions adjusted to say the surveillance action is the disorder-specific component; therapeutic_modality added to Genetic Counselling (BEHAVIORAL) and Multidisciplinary Supportive Care (OTHER); the ciliary discussion rationale now says HYPOTHETICAL to match the mechanism_confidence enum on the node it attaches to.

    Deliberately NOT done: the suggested just structured-rebuild-orphanet --id 480880. The pinned Orphadata bulk files no longer match the sha256 values in data/orphadata/MANIFEST.yaml (upstream re-release), so generating ORPHA_480880.md would require a manifest pin bump that nominally stale-dates all 8,823 existing ORPHA cache files, and the resulting HPO frequency rows could not be shown to match the pinned 2025-12-09 snapshot. The six >30% phenotypes it would unlock therefore remain uncurated rather than being added on an unverifiable source. The same drift affects the ClinGen pins, but there the specific records used carry curation dates (2024-11-27 dosage, 2021-11-17 validity) that predate the pinned snapshot dates, so their rows are unchanged from the pinned snapshots; the manifests were left untouched.

    Unchanged by design: the male/female entity separation and per-evidence male-cohort labelling, the neutral HP:0001417 inheritance term, the PROVISIONAL marking and HUMAN_MODEL_MISMATCH discussion on the TGF-beta arm, and the pathograph structure (17 nodes, single-root DAG).

    Validation: just validate clean (schema, terms, references; 163/163 snippets verified); scripts/check_snippets_verbatim.py from PR #7592 reports 163 verified / 0 failed; just compliance 89.7 percent global. references_cache/ churn from the validator (issue #7507) was reverted with git checkout and only the three genuinely new cache files staged; cache/*.csv unchanged.

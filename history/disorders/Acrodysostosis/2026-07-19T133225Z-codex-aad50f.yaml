  summary: 'Review: restore common phenotypes and endocrine treatment links'
  details: |
    Added Small for Gestational Age (HP:0001518) and Obesity (HP:0001513) for both PRKAR1A- and PDE4D-related subtypes. The international consensus explicitly reports most gene-defined cases as born SGA and identifies obesity in acrodysostosis, including both subtype columns. Added variable type 1 Hypocalcemia (HP:0002901) and Hypothyroidism (HP:0000821), typed evidence-backed edges from End-Organ Hormone Resistance, and treatment target links for active vitamin D/calcium and levothyroxine. Restored the prior PMID:34599290 rAAV9 mouse-rescue result as explicitly preclinical evidence for growth-plate chondrocyte dysfunction, without presenting gene therapy as a clinical treatment. Ontology terms were resolved and definitions checked with OAK; evidence snippets are exact cache substrings. The source does not establish causal intermediates for SGA or obesity, so those two remain intentionally unconnected rather than adding unsupported pathophysiology edges.

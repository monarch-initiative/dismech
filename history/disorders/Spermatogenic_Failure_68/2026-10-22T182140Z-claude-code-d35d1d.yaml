  summary: 'Create: Spermatogenic Failure 68'
  details: |
    New entry for SPGF68 (MONDO:0030721, CATSPERT/C2CD6), claimed in issue 15242. Human evidence is one homozygous C2-domain missense variant (VUS) in a man with partial globozoospermia (PMID:31985809). Mechanism nodes (CatSper tau flagellar targeting, nanodomain disruption, reduced calcium entry, failed hyperactivation) come from two independent mouse knockouts (PMID:34998468, PMID:34919125), whose sperm have normal morphology; that discordance is recorded as a HUMAN_MODEL_MISMATCH discussion and a FAILS_TO_RECAPITULATE model link. hgnc:14438 is bound with the build's label C2CD6 because the term validator's HGNC build predates the CATSPERT rename. Snippets verified against the reference cache; validate-disorders run before push.

  summary: Wire GSD type I to the hepatic gluconeogenesis failure module
  details: |
    Declared conformance on one node: Impaired glucose-6-phosphate hydrolysis and fasting hypoglycemia -> hepatic_gluconeogenesis_failure#Failure of Hepatic De Novo Glucose Production. The node already binds GO:0006094 gluconeogenesis DECREASED and CL:0000182 hepatocyte, matching the module node, and carries a downstream edge. The module node is the gene-agnostic convergence and is written to cover the G6PC route explicitly: PC, PEPCK and FBP1 fail to build free glucose-6-phosphate while G6PC fails to dephosphorylate it, and both routes abolish net de novo glucose production. Only one conformance link was added even though this node also spans the enzyme block and the resulting hypoglycemia, because the convergence node is the single honest anchor for it. No evidence, terms or bindings were changed.

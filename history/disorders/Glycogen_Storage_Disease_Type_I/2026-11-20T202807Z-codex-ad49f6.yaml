  summary: Map Glycogen Storage Disease Type I to OMIMPS:232200
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS232200 is the general glycogen storage disease series, including Ia (OMIM:232200), Ib (OMIM:232220), the historical Ic record (OMIM:232240), and numerous non-type-I glycogenoses. This entry covers the G6PC1 and SLC37A4 glucose-6-phosphatase-system disorders, so the whole series is a broader target. Neither the shared numeric identifier 232200 nor the series label makes the entire series equivalent to von Gierke disease. The Ia/Ib mechanisms and additional neutrophil phenotype of Ib remain internal distinctions.

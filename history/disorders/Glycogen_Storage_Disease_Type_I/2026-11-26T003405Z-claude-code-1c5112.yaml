  summary: 'Gene-family review: G6PC1, SLC37A4'
  details: |
    SLC37A4's activity was bound as the generic glucose-6-phosphate transmembrane transporter activity on both nodes that carry it. G6PT is a phosphate-linked antiporter that exchanges glucose-6-phosphate for inorganic phosphate, and a GSD Ib variant abolishes both uptake activities in proteoliposomes (PMID:18337460), so both nodes now bind glucose 6-phosphate:phosphate antiporter activity (GO:0061513), DECREASED, with that evidence on the hepatic node. G6PC1 (glucose-6-phosphatase activity, DECREASED; ClinGen Definitive) was correct and unchanged.

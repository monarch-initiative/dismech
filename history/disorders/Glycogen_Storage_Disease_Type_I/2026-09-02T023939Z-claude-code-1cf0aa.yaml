  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Created a classifications block; the entry previously had none. Added harrisons_chapter (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) and iuis_category: phagocyte defect.

    IUIS 2022 Table 5, section 1 (Congenital Neutropenias), cache line 2936: 'Glycogen storage disease type 1b G6PT1 AR 602671', affected cells N + M, affected function myeloid differentiation, chemotaxis and superoxide production, associated features fasting hypoglycemia, lactic acidosis, hyperlipidemia and hepatomegaly.

    PARTIAL SCOPE, recorded in notes. IUIS lists only type 1b. This is a combined Ia+Ib entry, and its GSD Ia subtype states explicitly that neutropenia is not a feature of Ia. Because iuis_category is single-valued and cannot be scoped to a has_subtypes member, the restriction to the Ib subtype is prose in the notes. The notes point at the existing 'Neutropenia and neutrophil dysfunction in GSD Ib' pathophysiology node as the supporting content, so the tag is not orphaned.

    Gene-symbol drift recorded: the paper prints the legacy symbol G6PT1; the current HGNC symbol is SLC37A4 (hgnc:4061), which is what this entry binds - the same gene.

    Evidence cites PMID:35748970 with the row quoted verbatim; the explanation notes that the row naming type 1b specifically is what bounds the classification.


  summary: 'Review round 1: address PR #7630 reviewer and pre-PR red-team findings'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #7630 plus a pre-PR adversarial red-team pass.

    CRITICAL (red-team). Three evidence items cited PMID:23913001 subjects 1555-1 and 1444-1, who are de novo GERMLINE CACNA1D (PASNA) cases; the cached text states 'CT scan showed no adrenal abnormality' for one of them, so they are not adenoma patients at all and the entry's own CACNA1D notes declare PASNA out of scope. Removed all of them: (a) the Metabolic Alkalosis phenotype and its causal edge were deleted outright, since no adenoma-specific citable source for alkalosis was found — the omission is now recorded explicitly in notes rather than papered over; (b) the sole SUPPORT-grade evidence for Mineralocorticoid Receptor Antagonist Therapy (a case vignette, 'She was treated with clonidine, and later spironolactone') was replaced with the Endocrine Society primary aldosteronism guideline recommendation (PMID:26934393, newly fetched); (c) the aldosterone-to-renin-ratio worked example was replaced with the same guideline's case-detection recommendation.

    IMPORTANT. Left ventricular hypertrophy was marked PARTIAL with an explanation asserting the Monticone abstract does not report the effect size — factually wrong; it reports 'left ventricular hypertrophy (2.29, 1.65-3.17)'. Corrected to SUPPORT with the real sentence in both the phenotype and the causal edge. Vertebral Fracture was rebound from HP:0005625 (Osteoporosis of vertebrae, a bone-density state that also duplicated the separate Osteoporosis phenotype) to HP:0002953 (Vertebral compression fracture); the note claiming HPO lacks such a term was wrong and has been corrected. Steroidogenesis Inhibitor Therapy carried target_mechanisms INHIBITS but its only evidence never mentioned metyrapone; replaced with PMID:35769081, which states the 11-beta-hydroxylase target directly. GNAS evidence was over-read (the cited sentence continues 'in patients with McCune-Albright syndrome or macronodular hyperplasia' and that study excluded somatic-GNAS cases) — downgraded to PARTIAL with an honest explanation, and the uncited GNAS/MACS-enrichment claim was deleted. Two GO terms sat on ORGANISM-scale nodes describing organ-level physiology rather than the annotated process (GO:0006704 on Chronic Glucocorticoid Excess, GO:0035932 on Renin-Independent Mineralocorticoid Excess); both dropped, the correct upstream annotations already exist. The top-level description wrongly said CTNNB1 converges with the ion-channel drivers on membrane depolarisation; beta-catenin is a transcriptional driver and is now described separately.

    ADDITIONS. Hyperlipidemia (HP:0003077), Coronary Artery Disease (HP:0001677) and Heart Failure (HP:0001635) phenotypes with quantified evidence and inbound causal edges — all three were named in existing node descriptions but not modelled. Adrenal Metastasis differential (MONDO:0024883) — the leading non-adenoma incidentaloma in patients with known malignancy. A new diagnosis section with Adrenal Vein Sampling and Adrenal CT for Subtype Testing, closing a gap the entry itself had flagged for later. A causal edge from Constitutive cAMP-PKA Signalling to Clonal Adrenocortical Proliferation, so the cortisol arm feeds the shared proliferation trunk as the aldosterone and Wnt arms already did. Evidence that PRKACA mutation is absent in subclinical hypercortisolism, which constrains the driver-to-subtype mapping.

    MINOR. Removed 'adrenal incidentaloma' from synonyms (it is a radiologic presentation category spanning several diseases, as the entry's own differentials argue). 'the majority' corrected to 'the largest single group' (EURINE-ACT gives 49.7% non-functioning, a plurality). MACS prevalence changed from PERIOD_PREVALENCE/COMMON to POINT_PREVALENCE/ABOVE_1_IN_1000 (the source is cross-sectional, and the band now matches the numeric convention used in the other record). Uncited 'KCNJ5-mutant APA enriched in younger women' removed from three places — the quote a reviewer suggested for it is not in the cached text, so the claim was dropped rather than mis-cited. KCNJ5 germline wording loosened from 'identical changes' to 'variants at the same residues'. evidence_source made consistent for one sentence used twice. Elevated-aldosterone-with-suppressed-renin first item downgraded to PARTIAL (it says nothing about renin). The indeterminate-mass imaging finding lost its diagnostic:true flag, which read as 'diagnostic of adenoma' when it argues the opposite. PRKACA variant numbering split so c.617A>C is no longer grouped under mature-protein numbering.

    Deliberately NOT done, recorded in notes: bilateral adrenal hyperplasia as a structured differential (MONDO has no term distinct from primary aldosteronism); conforms_to osteoporosis_bone_resorption; clinical_trials section (the six surfaced NCTs are observational/diagnostic).

    Validation after fixes: validate PASS, validate-terms PASS, validate-references PASS (142/142 snippets), compliance 97.4% global / 97.7% weighted, compliance-connectivity no gaps, 144 reference_title values audited against cached titles with zero mismatches.

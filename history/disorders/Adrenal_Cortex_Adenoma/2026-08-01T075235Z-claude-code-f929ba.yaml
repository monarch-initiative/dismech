  summary: 'Create: Adrenal Cortex Adenoma (MONDO:0003924)'
  details: |
    De-novo creation of the adrenal cortex adenoma entry (MONDO:0003924), organised on the AUTONOMOUS-SECRETION functional axis rather than histology or size.

    Subtypes (has_subtypes): Cortisol-Producing (overt Cushing; PRKACA/GNAS), MACS (mild autonomous cortisol secretion), Aldosterone-Producing (APA/Conn; KCNJ5, CACNA1D, ATP1A1, ATP2B3, CTNNB1), Non-Functioning (CTNNB1).

    Pathophysiology: 13 nodes, all carrying both biological_scale and role, forming three convergent chains plus a shared clonal-proliferation trunk. Cortisol arm: PRKACA/GNAS driver -> constitutive cAMP-PKA -> ACTH-independent cortisol hypersecretion -> (a) chronic glucocorticoid excess, (b) MACS, (c) HPA suppression/contralateral atrophy -> postoperative adrenal insufficiency. Aldosterone arm: ion channel/pump driver -> zona glomerulosa depolarisation -> calcium influx (explicitly modelled as the FINAL COMMON PATHWAY, and feeding back into proliferation) -> CYP11B2 induction -> renin-independent mineralocorticoid excess -> target organ damage disproportionate to blood pressure. Wnt/beta-catenin arm feeds the proliferation trunk.

    MACS reclassification is modelled as a first-class node and subtype, not as mild Cushing syndrome, carrying the Deutschbein NAPACA mortality data (PMID:35533704), the Prete EURINE-ACT cardiometabolic data (PMID:34978855), the Pal fracture meta-analysis (PMID:38703381) and the 2023 ESE guideline that formalised the term (PMID:37318239).

    Boundaries: adrenal cortex carcinoma (MONDO:0006639), bilateral macronodular adrenal hyperplasia (MONDO:0009049, ARMC5) and primary pigmented nodular adrenocortical disease (MONDO:0015999, PRKAR1A/Carney) are modelled as structured differential_diagnoses with bound disease_terms, NOT as subtypes; pheochromocytoma and adrenal myelolipoma complete the incidentaloma differential. Cushings_Syndrome and Familial_Hyperaldosteronism* are cross-referenced in notes rather than duplicated.

    Deep research: Edison/Falcon via 'just research-disorder falcon' (412 s, 33 citations, 1 artifact). Report treated as leads only. Falcon emitted several semantically wrong or obsolete ontology IDs that were caught and discarded during OAK verification: HP:0001578 (does not exist), HP:0000848 labelled 'Hyperaldosteronism' but actually 'Increased circulating renin concentration' (opposite of primary aldosteronism), GO:0019933 and GO:0010737 (obsolete), GO:0071372 labelled 'cellular response to mineralocorticoid stimulus' but actually 'cellular response to follicle-stimulating hormone stimulus', GO:0030007 and HP:0000978 label mismatches, plus non-existent CL 'adrenal cortex cell' and NCIT 'Laparoscopic Adrenalectomy'. Falcon supplied no PMIDs (it declined to invent them); its DOIs were resolved via the PMC ID Converter and fetched with 'just fetch-reference'.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS (131/131 snippets verified); just compliance 97.3% global / 97.6% weighted; just compliance-connectivity reports no gaps for this file (100% phenotype connectivity, all genes wired). A scripted audit confirmed all 133 reference_title values match their cached paper titles exactly (issue #7536 class of defect). LOINC codes for the 1 mg DST, the aldosterone-to-renin ratio and late-night salivary cortisol were verified against the NLM clinical-tables LOINC service because LOINC is not covered by the repo OAK config; no numeric interval was asserted for ARR or salivary cortisol since both are assay-dependent.

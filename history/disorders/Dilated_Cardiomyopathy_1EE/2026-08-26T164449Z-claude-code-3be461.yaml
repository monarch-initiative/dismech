  summary: 'Create: Dilated Cardiomyopathy 1EE'
  details: |
    New entry for MYH6-related dilated cardiomyopathy (MONDO:0013198), curated around the ClinGen Dilated Cardiomyopathy GCEP 'Limited' classification (March 2025), cited via the repository's CGGV structured source. Five pathophysiology nodes form a single connected component from the heterozygous missense variant through altered sarcomere contractile output to congestive heart failure, with a Preserved Calcium Handling node recording the negative functional result. The GeneReviews Overview chapter (PMID:20301486) is tagged and mined for the Diagnosis and Management sections present in its abstract; the absence of a Clinical Characteristics section is documented in notes rather than papered over. MYH6-related sick sinus syndrome and left-sided congenital heart defects are curated as differential diagnoses. Validated with just validate (21/21 snippets), term validation, duplicate-key, entity-ref, folded-hyphen and snippet-length gates.

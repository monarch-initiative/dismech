  summary: 'Edit: FSHD - community-sourced phenotypes, natural history, and treatments'
  details: |
    Augmented the existing FSHD umbrella entry (MONDO:0001347) rather than creating a separate FSHD1 entry, at curator direction. Goal was to capture phenotypes, treatments, and natural history that patient/family communities and advocacy organizations describe but the primary clinical literature under-represents.

    Community sources mined: the FSHD Society patient-education pages (symptoms, early-onset FSHD, online communities) and the public r/FSHD subreddit, all cached as url: references via `just fetch-reference`. Facebook was attempted but its public Page returns a login/CSS wall with no quotable content, so it was discarded rather than cited. reddit.com is bot-walled but old.reddit.com serves usable server-rendered HTML.

    Every community signal was bridged to citable evidence rather than curated on social-media assertion alone. Key bridging references: GeneReviews (PMID:20301616, tagged), PRISM-FSHD patient-reported outcomes (PMID:31409737), a patient-led psychosocial narrative review (PMID:42485801), fatigue qualitative study (PMID:27762634), fatigue AET/CBT RCT (PMID:25339206), long-term respiratory follow-up (PMID:35147730), sleep-disordered breathing (PMID:31025273), cardiac involvement (PMID:34108930), retinal vasculopathy (PMID:23573590, PMID:36900126).

    Added 13 phenotypes: Fatigue (VERY_FREQUENT, 93.8 percent), Abdominal wall muscle weakness, Foot dorsiflexor weakness, Falls, Lagophthalmos, Lumbar hyperlordosis, Scoliosis, Pectus excavatum, Restrictive ventilatory defect (FREQUENT), Arrhythmia (OCCASIONAL), Retinal telangiectasia (FREQUENT), Obstructive sleep apnea, Nocturnal hypoventilation. Frequencies were set only where a quantitative source existed; omitted otherwise.

    Added 4 treatments: CBT for chronic fatigue (NCIT:C64345, RCT-backed), ankle-foot orthoses (term omitted, no reachable NCIT clinical-action term), ocular surface protection, respiratory surveillance and ventilatory support. Added 2 progression phases: loss of ambulation in about 20 percent, and respiratory decline confined to an at-risk subgroup.

    Added 2 discussions: a KNOWLEDGE_GAP recording that the pathograph does not explain the fatigue/pain/sleep "invisible symptom" burden patients rank highest, and an OPEN_QUESTION recording community-raised signals with no clinical evidence base (migraine, fasciculations, low aldolase) as explicitly unvalidated leads, with the nocturnal-hypoventilation morning-headache hypothesis noted. Social-media content was deliberately NOT promoted to curated phenotypes.

    Privacy note: only aggregate community discussion topics and thread titles were quoted; no individual patient's personal health narrative was reproduced.

    Deep research: falcon failed (Edison API 402 Payment Required); the claude_code provider run completed and is committed. Existing asta report reused. Three DR-suggested HPO IDs were wrong on verification (HP:0003707 is calf pseudohypertrophy, HP:0025637 is vasospasm) and were replaced with OAK-verified terms.

    Validation: just validate passes (schema + terms + references), 71/71 snippets verified against cached references; compliance 88.1 percent weighted.

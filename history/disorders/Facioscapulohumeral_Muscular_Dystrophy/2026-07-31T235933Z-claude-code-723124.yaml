  summary: 'Edit: FSHD - registry natural history; community headache signal validated'
  details: |
    Second curation round on FSHD, following the community-source sweep. Two tracks: national patient-registry literature, and a deeper sweep of the r/FSHD subreddit.

    KEY RESULT - a community signal was adjudicated and promoted. The first round recorded "Migraines" from r/FSHD as an explicitly unvalidated lead because no FSHD headache literature was found. The Dutch FSHD Registry (PMID:38016873, 373 participants) reports pain in the head and shoulder region in 52% of patients. Head-region pain is therefore a genuine, frequent FSHD manifestation and is now curated as a Headache phenotype (HP:0002315, FREQUENT). Two candidate mechanisms are recorded and left open: postural strain from cervical/axial weakness, versus morning headache from nocturnal hypoventilation (PMID:31025273), the latter being directly treatable with ventilatory support. The community term "migraine" remains broader than what the registry documents, so a primary-migraine association is still unestablished; the evidence item is marked PARTIAL.

    The corresponding discussion (fshd_community_reported_unvalidated_signals) was rewritten to separate the RESOLVED lead (head pain, now a phenotype) from the two still-UNVALIDATED leads (fasciculations, low serum aldolase), and now documents the intended workflow explicitly: community sources generate candidates, literature adjudicates, only adjudicated signals become phenotypes.

    Registry/natural-history additions:
    - Facial weakness strengthened with orofacial muscle ultrasound (PMID:39297366): 92% of 107 participants, supporting the VERY_FREQUENT band, plus muscle-level resolution (zygomaticus minor most affected) absent from standard facial-weakness scoring.
    - New progression phase "Slow progression with a deteriorating minority": function largely static over 12 months (PMID:38189531); only ~16% show clinically important deterioration over 6.5 years, all with moderate-to-severe baseline disease (PMID:40781929). Also records the methodological caveat that compensation may cause patient-reported outcome measures to under-detect real progression - relevant to interpreting the patient-reported evidence used throughout this entry.
    - Added Dutch registry and orofacial ultrasound studies to top-level references.

    Reddit deeper sweep (new/ and top/ listings in addition to the front page): SATURATED. Only two topics appeared beyond the first sweep, both administrative/logistical rather than clinical. r/FSHD is a small subreddit and its full public surface has now been reviewed; it yielded no further phenotype signal. Reddit's contribution across both rounds is one phenotype lead that literature subsequently validated (head pain) and two that it did not.

    Facebook remains inaccessible and was not pursued: mbasic.facebook.com redirects to login.php and the public Page returns only CSS. Private family groups additionally raise a consent problem - members disclosing health information to a closed group have not agreed to public aggregation - so they were deliberately excluded rather than merely blocked. National patient registries were used as the consented substitute.

    Validation: just validate passes (schema + terms + references), 80/80 snippets verified; 9 FSHD tests pass; compliance 87.4% weighted (denominator grew with the added content).

  summary: Add FSHD4 (MONDO:0030355) as a subtype of Facioscapulohumeral Muscular
    Dystrophy
  details: |
    Curation of MONDO:0030355 (facioscapulohumeral muscular dystrophy 4, digenic; OMIM 619478). Lump/split call: curated as a has_subtypes entry named FSHD4 on the existing Facioscapulohumeral_Muscular_Dystrophy entry rather than as a standalone kb/disorders file, because the pathograph (D4Z4 derepression -> DUX4 misexpression in skeletal muscle -> myofiber loss) is the one already curated there, reached through DNMT3B instead of SMCHD1, and PMID:34711481 reports no clinical difference between contraction-independent FSHD and FSHD1. Added: the FSHD4 subtype bound to MONDO:0030355 with genes DNMT3B and DUX4 and a subtype-level Inheritance block bound to HP:0010984 Digenic inheritance, penetrance INCOMPLETE; two new pathophysiology nodes keeping the two required lesions separate (DNMT3B-Dependent D4Z4 Methylation Failure, and Permissive 4qA Polyadenylation Signal) with causal edges into the existing derepression and DUX4-misexpression nodes; a COOPERATING genetic row for the permissive 4qA haplotype; retargeting of the existing DNMT3B genetic row from subtype FSHD2 to FSHD4 with a note explaining that GeneReviews classifies these patients as FSHD2 by methylation while OMIM/MONDO number by gene; and the D4Z4-2.5/Dnmt3bMommeD14 mouse with a FAILS_TO_RECAPITULATE link to the skeletal-muscle node. Deep research: falcon requested, returned HTTP 402 (out of credits); claude_code produced the report (research/Facioscapulohumeral_Muscular_Dystrophy_4_Digenic-deep-research-claude_code.md). just preflight-dr returned WARN, not FAIL: the report covers FSHD broadly and cites OMIM 158900/158901 rather than 619478, which is consistent with the entity being a subtype of the parent disease. Report content was treated as leads; every snippet committed here was read from references_cache. Evidence gaps recorded in notes: no phenotype is scoped to FSHD4 because no DNMT3B-specific clinical series exists, and no penetrance rate is given because the two original families are too small. Also repaired pre-existing drift in the NCT06131983 clinical trial record, whose registry title and summary now name SRP-1001; the refreshed cache file is committed with the updated title and snippet. Two further pre-existing title mismatches on old.reddit.com url references were left alone: they reproduce identically against the unmodified file at HEAD and appear to be a fetcher block rather than a content error. Validated with linkml-reference-validator 0.3.0rc1.

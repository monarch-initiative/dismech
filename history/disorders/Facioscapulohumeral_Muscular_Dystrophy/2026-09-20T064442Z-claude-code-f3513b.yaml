  summary: 'Genetics pass: curate DNMT3B and LRIF1; bind the FSHD2 chromatin modifiers'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: the GeneReviews chapter (PMID:20301616) is already cited and tagged here and
    was re-read as the baseline. Its FSHD2 diagnostic criterion names three chromatin-modifier
    loci - SMCHD1, DNMT3B and LRIF1 - of which only SMCHD1 was curated; the other two appeared
    only in the `diagnosis:` prose and were never bound. That is the named-but-unbound pattern
    this campaign measures.

    Both checklist genes were already curated. SMCHD1 (hgnc:29090) carries a `genetic:` record
    with a `subtype: FSHD2` foreign key; DUX4 (hgnc:50800) carries one with `subtype: FSHD1` and
    is bound as a `genes:` descriptor on the DUX4 Misexpression node. The knowledge-graph gap is
    an export artefact: the checklist keys on MONDO:0008031 (FSHD2), a `has_subtypes` term here,
    while the exporter emits gene edges only against `disease_term` (MONDO:0001347). See
    dismech#12316.

    The FSHD1 lesion modelling was checked and left alone, as it was already right: the causal
    event is a D4Z4 repeat-array contraction on a permissive 4qA haplotype derepressing DUX4,
    not a coding mutation, and the `genetic:` record is named for the contraction while binding
    DUX4 as the gene it derepresses. The FSHD2 digenic inheritance block (HP:0010984, citing the
    SMCHD1-plus-permissive-allele study) is the worked exemplar CLAUDE.md points at and was not
    touched.

    What changed:
    - New `genetic:` record for DNMT3B (hgnc:2979), `subtype: FSHD2`, CAUSATIVE, with the
      defining AJHG report and the GeneReviews criterion as evidence. The note records that the
      defining study frames the effect as derepression with low-level DUX4 expression and
      increased penetrance rather than as an SMCHD1 equivalent, and that the recessive
      DNMT3B disease (ICF1) is a different entity curated separately.
    - New `genetic:` record for LRIF1 (hgnc:30299), `subtype: FSHD2`, CAUSATIVE, with the single
      homozygous proband, the supporting D4Z4-binding and knockdown work, and the GeneReviews
      criterion. The note states plainly that the human evidence is one proband and that LRIF1 is
      the only one of the three loci requiring a biallelic state.
    - `genes:` lists on both `has_subtypes` rows: DUX4 on FSHD1; SMCHD1, DNMT3B, LRIF1 and DUX4
      on FSHD2.
    - All four chromatin/derepression genes bound on the "D4Z4 Epigenetic Derepression" node.
    - `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` on the two pre-existing
      `genetic:` records.

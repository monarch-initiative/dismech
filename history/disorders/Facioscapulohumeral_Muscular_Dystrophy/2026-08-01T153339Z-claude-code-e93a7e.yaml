  summary: 'Review: address PR #7674 reviewer findings; correct headache over-read
    and saturation claim'
  details: |
    Round 3: addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #7674 (three IMPORTANT issues plus suggestions). All three were valid; two were genuine errors on my part.

    IMPORTANT 1 - headache frequency over-read (my error, and it was the PR's headline claim). The Headache phenotype carried frequency: FREQUENT on the snippet "Pain was experienced most often in the head and shoulder region (193, 52%)". That is ONE COMBINED anatomical category, not head alone, and my explanation asserted "one of the two most frequent pain locations", which the sentence does not say. Given FSHD's scapular dominance an unknown and plausibly majority share of that 52% is shoulder pain, so head-specific prevalence is unrecoverable and could fall below the 30% FREQUENT floor. Fixed: removed frequency:, downgraded the evidence item to PARTIAL, rewrote the explanation to state the combined-category limitation explicitly, and softened the matching claim in the fshd_community_reported_unvalidated_signals discussion rationale from "RESOLVED / genuine and frequent" to "PARTLY resolved / no frequency band asserted".

    IMPORTANT 2 - GeneReviews only partially mined. Added a new diagnosis: section with five entries (FSHD1 D4Z4-contraction molecular diagnosis, FSHD2 hypomethylation plus SMCHD1/DNMT3B/LRIF1 chromatin-modifier testing, risk-stratified hypoventilation/pulmonary assessment, audiologic surveillance, ophthalmologic surveillance), all GeneReviews-sourced. Added genetic-counseling evidence to the autosomal dominant inheritance block (50% offspring recurrence risk; 70-90% inherited; 10-30% de novo constitutional or mosaic) and populated the de_novo_rate slot. Added two further GeneReviews management treatments (occupational/speech therapy in infantile onset; standard treatment of sensorineural hearing loss, which now has a management counterpart to the existing phenotype).

    IMPORTANT 3 - over-general arrhythmia term. Replaced HP:0011675 Arrhythmia with HP:0005110 Atrial fibrillation and HP:0004749 Atrial flutter (the latter PARTIAL, since the source reports the two as a combined 5% category), and curated the previously-dropped RBBB finding as HP:0011712 Complete right bundle branch block at 7%.

    SUGGESTIONS addressed:
    - "Recurring" wording softened to single-snapshot observation in all four places it appeared.
    - Uncited reddit caches resolved. The reviewer was right that url_..._r_FSHD_top_.md captured an empty listing (past-24-hours default, 0 titles); it and the duplicate new/ listing were removed from the repo.
    - CORRECTION to a claim in the round-2 history record and PR description: r/FSHD was NOT saturated. Re-fetching with ?t=all succeeded and surfaced 21 topics absent from the front-page and new-post listings. The corrected finding is qualitative rather than exhaustive: the community's highest-engagement content is dominated by therapeutic-pipeline news, psychosocial coping, and reproductive planning, not by undocumented phenotypes. That listing is now cited and the top-level reference records the correction.
    - Reproductive planning (PGT-M/IVF), which recurs across the all-time top discussions, is now curated as a Genetic Counseling and Reproductive Options treatment backed by the GeneReviews PGT sentence - a community-priority concern that the entry previously omitted.
    - Split surveillance out of treatment: "Respiratory Surveillance and Ventilatory Support" is now "Ventilatory Support" (with first-night NIV gas-exchange evidence), and the screening protocol moved to diagnosis:.
    - Ocular surface protection term: searched NCIT for ocular/lubricant/artificial-tear/corneal clinical-action terms. None reachable from NCIT:C25218 exists, and NCIT:C1585 Lubricant is rejected by the ChemicalEntityTerm dynamic enum, so generic Supportive Care is retained deliberately with the search documented in notes:.

    Two term errors were caught by the pre-edit validation hook during this round and corrected before commit: NCIT:C1585 is not a valid ChemicalEntityTerm, and NCIT:C159273's canonical label is "Speech Language Therapy" not "Speech Therapy".

    Deferred as explicitly out of scope (reviewer agreed these are non-blocking): the losmapimod REACH Phase 3 failure and ACE-083 discontinuation, and genotype-phenotype depth (D4Z4 repeat size correlation, SMCHD1 as an FSHD1 modifier, mosaicism, the 8-11 unit grey zone).

    Validation: just validate passes; 96/96 snippets verified (up from 80); 9 FSHD tests pass; compliance 88.2% weighted.

  summary: 'Edit: openscientist deep research; hearing-loss frequency, retinal nuance,
    losmapimod outcome'
  details: |
    Round 4: second deep-research provider (openscientist) at curator request, replacing the unavailable falcon.

    Provider run: openscientist, autonomous investigation mode, 5 iterations, 28.7 minutes, 32 citations, plus HTML/PDF artifacts. Report and citations committed under research/.

    DR VERIFICATION - one of three checked snippets failed. The report quoted "Hearing Loss (13%; n = 71) was the most frequently reported comorbidity, followed by retinal abnormalities (3.6%; n = 20) and seizures (2.0%; n = 11)" from PMID:40879179. That is NOT an exact substring of the cached abstract: the real text is lower-case "Hearing loss", and the quote continues past where the cached abstract wraps. Corrected to a verified substring before use. The other two checked snippets (PMID:40580827, PMID:38631764) verified as written. This is the fourth distinct DR error class encountered in this curation (after three hallucinated HPO IDs from the claude_code run) and reinforces treating DR output as leads.

    Additions, all independently verified:

    1. Sensorineural hearing impairment gained its first QUANTITATIVE frequency evidence. The phenotype already carried frequency: OCCASIONAL but with no supporting numeric source. Population-based MD STARnet surveillance (PMID:40879179, n=548) gives clinically diagnosed hearing loss at 13%, confirming the OCCASIONAL band (5-29%) and establishing it as the most common extra-muscular comorbidity of FSHD.

    2. Retinal telangiectasia gained an important interpretive nuance. MD STARnet records clinically diagnosed retinal abnormality in only 3.6%, against the 49% detected by dedicated fluorescein angiography that underpins the FREQUENT band. These are not in conflict - they measure subclinical angiographic telangiectasia versus a retinal diagnosis recorded in routine care - and the roughly order-of-magnitude gap is exactly the argument for targeted ophthalmologic surveillance. Added as PARTIAL with the distinction explained rather than silently reconciling the numbers or changing the band.

    3. Losmapimod trial outcome curated, closing the reviewer-flagged high-value gap. The existing NCT05397470 phase 3 entry recorded only "Terminated" status with no outcome. Added two REFUTE evidence items: the preceding phase 2b ReDUX4 trial (PMID:38631764) missed its primary endpoint, with no significant change in DUX4-driven gene expression versus placebo; and the phase 3 (PMID:40580827) failed to demonstrate clear clinical benefit. Recorded as REFUTE so the entry does not leave a terminated program looking merely incomplete - the p38/DUX4-suppression strategy was tested and did not succeed.

    One snippet required correction for typography: the ReDUX4 abstract uses middle-dot decimal separators (0.83 rendered as 0<middot>83), so a numeral-free substring was used instead.

    Still deferred as agreed with the reviewer: genotype-phenotype depth (D4Z4 repeat size correlation, SMCHD1 as an FSHD1 modifier, mosaicism, the 8-11 unit grey zone) and ACE-083. The openscientist report supplies good material for these (notably PMID:30211448: familial factors explain 50% of severity variance versus only ~10% for repeat size) and they remain a clean follow-up.

    Validation: just validate passes; 100/100 snippets verified; 9 FSHD tests pass; compliance 87.6% weighted (denominator grew again with added content).

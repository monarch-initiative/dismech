  details: |
    Brought into line with design decision 6d, recorded in PR 9654 after PR 7674 had merged this entry. Removed the three citations of the r/FSHD subreddit (one evidence item on the Genetic Counseling and Reproductive Options treatment, two top-level references) and deleted their two cached pages, which carried forum usernames. The treatment keeps its GeneReviews PGT evidence; its description no longer asserts community salience, since that claim rested only on the removed forum citation. Two discussion notes that said the forum listing was recorded under references were rewritten to say the forum is named as the origin of a lead and is not cited. Tagged the three FSHD Society top-level references PatientOrganization; every evidence block citing the Society symptoms page also carries a non-community reference, so check-community-evidence passes. Validated with just validate, count-verified-snippets (124/124), check-social-media-references, check-community-evidence, check-entity-refs and check-causal-targets.

  summary: 'Address PR #7674 round-2 review: bind NCIT diagnosis terms, drop unsupported
    flutter frequency, soften PGT-M recurrence claim'
  details: |
    Automated PR Shepherd fix commit addressing the three blocking items in the round-2 ai4c-reviewer review.

    (1) Removed two diagnosis notes asserting that no NCIT clinical-action term exists for audiometry or ophthalmoscopy. Both terms do exist and both reach NCIT:C25218 (verified with 'runoak -i sqlite:obo:ncit ancestors -p i'), so diagnosis_term is now bound to NCIT:C38036 (Audiometric Test) and NCIT:C120698 (Ophthalmoscopy). A documented-negative note is worse than a plain missing binding because a future curator trusts it instead of re-searching.

    (2) Dropped 'frequency: OCCASIONAL' from the Atrial flutter phenotype. The sole quantitative source (PMID:34108930) reports 5 percent for atrial fibrillation OR flutter combined, which bounds the flutter-specific rate at 5 percent or less but may fall below the OCCASIONAL (5-29 percent) floor. Rationale recorded in the node description instead of a fabricated band.

    (3) Softened the PGT-M/IVF 'appears repeatedly' over-read in three places: the treatment description, the reddit evidence explanation, and the references finding. The cached all-time top listing contains 25 titles of which exactly one concerns reproductive planning, so the source supports salience but not recurrence. The treatment itself remains founded on the GeneReviews PGT sentence.

    Validation: 'just validate' (schema green, 100/100 snippets verified), 'just validate-terms' (passed), 'just validate-references' (100/100), 'just check-cache-order' (OK). Only NCIT:C120698 needed adding to the term caches; NCIT:C38036 was already present. Unrelated whole-tree references_cache reformatting churn emitted by the validator was reverted and is not part of this commit.

  details: |
    Merge of main into PR #7674 (branch claude/curate-fshd1-2up9oc) after the branch fell into conflict, plus a refresh of the entry to the schema as it stands on main.

    Conflicts resolved (all additive placement conflicts; both sides kept):
    - kb/disorders/Facioscapulohumeral_Muscular_Dystrophy.yaml: two hunks. Hunk 1: the branch's phenotype additions against main's new "Retinal vasculopathy" phenotype (from #9719). Hunk 2: the branch's treatment additions against main's new animal_models block (Xenopus frg1 vascular model, #9719). Concatenated, branch side first, then main side.
    - cache/ncit/terms.csv and cache/enums/treatmentactionterm_b7dcb86faf99.csv: both sides added rows; kept both and re-sorted with `just normalize-cache`.

    Schema refresh (#7439 / #10003 retired `supports: PARTIAL`):
    - The six PARTIAL items authored on this branch (Abdominal wall muscle weakness x1, Atrial flutter x1, Retinal telangiectasia x1, Headache x2, OPEN_QUESTION discussion x1) become `supports: SUPPORT` + `directness: INDIRECT`. Each had an explanation that already stated the inference step (broader patient-reported theme, combined AF-or-flutter figure, clinical-detection rather than imaging rate, combined head-and-shoulder pain category, morning headache as a sleep-lab referral symptom), so the directness assessment is the curator's own, restated without the retired value. The "classified PARTIAL because" phrases were rewritten to say the support is indirect. No other item was given a directness tag; per CLAUDE.md, absent means unassessed.

    Reconciliation the merge forced:
    - The merge put the branch's "Retinal telangiectasia" (HP:0007763, FREQUENT, 49% on fluorescein angiography, PMID:23573590) beside main's "Retinal vasculopathy" (HP:0008046, OCCASIONAL, Coats-like, PMID:30923442). Same organ, two bands, and main's OCCASIONAL had no quantitative evidence behind it. Both nodes are kept because they denote different things: the asymptomatic angiographic finding versus the rare symptomatic Coats-like form. Main's node moves to VERY_RARE on a third item quoted from the full text of its own cited review (Tawil et al.: 0.6% symptomatic retinal disease; the same review cites 1.7% in a Dutch survey and 0.8% in FSHD1), tagged directness DIRECT and quote_role REVIEW_SYNTHESIS. Cross-referencing `notes:` added to both nodes. The animal-model target "Retinal vasculopathy" is unchanged.

    Housekeeping:
    - Removed the eight stale FSHD rows this branch had added to tests/snippet_length_baseline.txt (reviewer round-8 suggestion; the shepherd could not edit tests/). `check_snippet_length.py --check` and `--against-ref origin/main` both report no FSHD findings without them.


  summary: Add general-population prevalence with ascertainment caveat
  details: |
    Added the estimated general-population prevalence of 2 cases per million, normalised to 0.2 per 100,000. The snippet is quoted together with the founder-effect cluster the source reports in the same sentence, and the notes record that the figure should be treated as an order-of-magnitude estimate because the syndrome's commonest features rarely prompt genetic evaluation, so ascertainment-based estimates run low. GeneReviews abstracts for all eight entries in this PR were checked first and carry no prevalence figures, which is why an external source was needed.

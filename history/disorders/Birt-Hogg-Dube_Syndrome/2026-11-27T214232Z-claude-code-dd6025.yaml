  summary: 'Curate phenotypes: Birt-Hogg-Dube Syndrome'
  details: |
    Added ten phenotypes (trichodiscoma, acrochordons, angiofibromas, oral mucosal papules, cutaneous collagenoma, epidermal cyst, renal cyst, and chromophobe, clear cell and papillary renal cell carcinoma) from GeneReviews (PMID:20301695), the Schmidt and Linehan review full text (PMID:26334087), the Pavlovich renal pathology series (PMID:12459621) and a case report (PMID:36258004). Enriched fibrofolliculoma, pulmonary cysts, spontaneous pneumothorax, renal neoplasm and renal oncocytoma with onset, recurrence and further frequency evidence, and fixed a stale fibrofolliculoma explanation that referred to a retired PARTIAL value and to a missing frequency band. Wired chromophobe and clear cell carcinoma and trichodiscoma from the tumor-spectrum node. Updated the entry and node descriptions so they no longer present clear cell histology as absent. Uncertain associations (lipoma, parathyroid adenoma, thyroid nodules, parotid oncocytoma, colorectal neoplasia) are recorded in notes as leads. New references could not be fetched in this session because NCBI and EBI were unreachable, so only already-cached sources were used; HP labels for two new terms were checked against the HPO 2026-09-01 release file. Validation: validate-disorders, count-verified-snippets (86/86), check-causal-targets, check-coarse-phenotypes and check-name-collisions all pass.

  summary: Add the FLCN-FNIP RagC/D GAP to TFEB/TFE3 mechanism and phenotype frequencies
    from a claude_managed deep-research report
  details: |
    Source: research/Birt-Hogg-Dube_Syndrome-deep-research-claude_managed.md (deep-research-client claude_managed provider: Opus coordinator, Haiku retrievers, grader-checked outcome). Preflight-dr WARN, checked by hand: MONDO records no causal gene; the report's top gene is FLCN, and its flagged HGNC:27310 is attached to FLCN, not FNIP2. Report references resolved 133/133.

    Pathophysiology: the chain previously ran from biallelic FLCN loss to a generic FNIP1-AMPK-mTOR node straight to tumour development. Added two atomic nodes between them, Loss of FLCN-FNIP RagC/D GAP Activity (PMID:24095279 GAP activity; PMID:31672913 structure of the lysosomal folliculin complex) and Constitutive TFEB/TFE3 Nuclear Activation (PMID:24081491; PMID:32612235 mouse model, where TFEB depletion rescues the kidney phenotype and normalizes mTORC1), with edge evidence for the GAP-to-TFE3 step. The existing FNIP1-AMPK-mTOR node and its evidence are unchanged; its downstream edge now points to the GAP node.

    Phenotypes: added frequencies, each with a Pattern A quantitative snippet: Fibrofolliculoma VERY_FREQUENT (PMID:26334087, >85% over age 25), Pulmonary cyst VERY_FREQUENT (PMID:28248571, 85%), Spontaneous pneumothorax OCCASIONAL (PMID:17322109, 48/198). Renal neoplasm frequency deliberately not set: the ERN guideline's 15-30% lifetime RCC risk straddles the OCCASIONAL/FREQUENT boundary and covers RCC only.

    Not taken from the report: chromophobe RCC and hybrid oncocytic tumour as separate phenotypes (no HPO term; Renal Neoplasm covers them), colorectal polyps (the ERN guideline calls them unconfirmed). Every snippet was copied from references_cache fetched with just fetch-reference; validate-disorders passed (44 snippets, 45 titles).

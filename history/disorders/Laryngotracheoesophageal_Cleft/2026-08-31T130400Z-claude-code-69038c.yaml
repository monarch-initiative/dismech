  summary: 'Repair wrong ontology bindings in qualifiers: Laryngotracheoesophageal_Cleft'
  details: |
    Repaired 2 ontology binding(s) nested inside `qualifiers` whose CURIE and label named different concepts. `linkml-term-validator` validates slots whose range is bound to an ontology-backed dynamic enum; `Qualifier.predicate` and `Qualifier.value` are plain Descriptors with no such binding, so their `term:` blocks were never checked and these wrong codes passed every gate in the stack (issue #10197). Each replacement was resolved against the authoritative ontology through OLS and cross-checked against OLS's own API rather than only through the OAK adapter. `preferred_term` was left as curated throughout -- the Ontology Term Contract permits it to be more specific than the bound label -- so only `term.id`/`term.label` changed. The new `just check-qualifier-terms` gate, and its `--resolve` mode, prevent recurrence.

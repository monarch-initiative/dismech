  summary: 'Fix bare PMC URL references to use the url: prefix'
  details: |
    test_evidence_items_have_references failed on 17 evidence items (plus one references[] entry) citing the bare URL https://pmc.ncbi.nlm.nih.gov/articles/PMC12539477/, which carries none of the allowed reference prefixes. The cached record for this article already exists as references_cache/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC12539477_.md with reference_id 'url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12539477/', so the YAML had simply dropped the url: prefix the cache was keyed under. Added the prefix to all 18 occurrences; no snippet, explanation, or claim was changed. Rejected the alternative of remapping these to PMID:40845419 (the same article, already cited twice in this entry): that cache is content_type abstract_only and none of the 17 snippets appear in the abstract, so the remap would have silently invalidated every one of them. Verified with dismech.reference_snippet_audit: 20/54 snippets verified, 34 skipped by prefix (DOI), 0 unverified. Confirmed the url: snippets are genuinely being checked rather than skipped by corrupting one snippet as a negative control, which correctly dropped the verified count to 19 and named the offending path. Also ran linkml-validate (no issues) and linkml-term-validator --labels (passed).

  summary: Conform to the H1 receptor antagonism module
  details: |
    Added one pathophysiology node with role therapeutic_vulnerability, conforming at the H1 receptor antagonism module trigger, and routed the entry's existing antihistamine treatment to it through target_mechanisms with treatment_effect ACTIVATES. The node carries no downstream edge: the relation between an antagonist and the histamine signalling it blocks is inhibitory, and a downstream edge would assert that the drug drives that signalling. Node evidence is disease-specific, paired with the class-level item that names the receptor. This entry's treatment already carried two target_mechanisms links, to the cutaneous vasodilation and the sensory-signalling nodes, both deliberately MODULATES with a recorded reason for not claiming reduced mediator release. Those are left exactly as they were and the occupancy link was merged into the same list rather than added as a second block; the three links now describe one action at two removes, which the new link's description says explicitly so the weaker joins are not read as redundant. Edits were made as text insertions, not by a YAML round-trip, so comments and formatting are untouched.

  summary: 'Compliance: Urticaria reference_title backfill and ciclosporin mechanism
    link'
  details: |
    Weekly compliance pass focused on immune-disease treatments. Urticaria's treatments were already well bound and evidenced, so the gap here was almost entirely reference_title, missing on 38 of 60 evidence items - concentrated on the 35 DOI-cited items from the CSACI Urticaria review. All 38 titles were read programmatically from the title field of the committed references_cache files (both PMID_ and DOI_ records), not retyped or recalled. One correctness point worth recording: the first pass of the backfill also inserted reference_title into the top-level references list, whose Reference class takes title rather than reference_title. The pre-edit validation hook caught it, and the four spurious lines were removed before any commit; only EvidenceItem entries carry reference_title now. Treatment curation: Ciclosporin for Refractory CSU was the only treatment with no target_mechanisms link, so it was unwired from the pathograph. Added an INHIBITS link to Inflammatory Mediator Release with its own evidence (PMID:40845419), which states ciclosporin's dual action - T-cell immunosuppression blocking IL-2/IL-3/IL-4/TNF production plus direct inhibition of mast-cell and basophil mediator release. The mediator-release node was chosen deliberately over any single upstream activation node because ciclosporin is used across both the IgE-dependent and autoimmune endotypes and acts downstream of both. Validated with just validate: 23 of 57 snippets verified against cached references, 34 skipped by prefix. The 34 skips are the DOI-prefixed items, which conf/reference_validator_config.yaml lists under skip_prefixes - a pre-existing property of DOI citations in this repo, not a regression from this change, and unchanged in count by it. Weighted compliance 72.2 to 99.2. The single remaining recommended-field gap is datasets[0].evidence, which bulk-generated dataset records intentionally omit.

  summary: 'Review: Urticaria'
  details: |
    Reviewed the MONDO urticaria umbrella entry for completeness and claim-evidence alignment. Removed the self-parent and added dermatologic/inflammatory parents; distinguished acute, chronic spontaneous, and chronic inducible subtypes with exact source-backed definitions; restricted autoimmune IgG/IgE mechanisms to a supported subset of CSU; replaced the single bundled mechanism with an atomic, edge-evidenced mast-cell-degranulation to mediator-release to vascular-leakage graph; added evidence-backed wheals, pruritus, angioedema, and lifetime prevalence; expanded the guideline-concordant treatment sequence with second-generation H1 antihistamines and fourfold updosing, omalizumab, ciclosporin, and brief corticosteroid rescue; and added clinical diagnosis, inducible provocation testing, and key differentials. Preserved and reverified the GEO dataset. Deliberately excluded bradykinin as a causal edge because its cited study says clinical relevance remains debated, left pruritus unwired because the retained source did not justify an edge-level causal statement, and did not infer a causal gene, representative animal model, or registry assertion for this heterogeneous umbrella entity. Reviewed the D2P comparison but did not mechanically import its syndromic and differential-diagnosis phenotypes. Validation: disorder schema, ontology terms, built-in PMID reference checks, 29/29 DOI snippets independently verified after whitespace normalization, causal graph rendering and targets, and dataset accession 1/1.

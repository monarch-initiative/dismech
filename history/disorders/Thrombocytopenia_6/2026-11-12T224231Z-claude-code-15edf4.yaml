  summary: 'Create: Thrombocytopenia 6 (SRC p.E527K)'
  details: |
    New entry for thrombocytopenia 6 (MONDO:0014837), the germline SRC p.E527K gain-of-function platelet disorder, curated from one OpenScientist deep-research report (reference validation 10/10 resolved) plus the three primary family reports and the full text of the discovery paper PMID:26936507. The pathograph runs from constitutive SRC kinase activity through megakaryocyte podosome excess and actin disorganisation to a proplatelet-formation block, with separate branches for collagen hyporeactivity, expanded myeloid and megakaryocyte progenitor output, constitutive BTK and PLCG2 signalling, and altered bone remodelling. Added in this session: diagnosis (blood count and indices, blood film, platelet electron microscopy, aggregometry, marrow biopsy, molecular testing), four differential diagnoses (immune thrombocytopenia, gray platelet syndrome, congenital amegakaryocytic thrombocytopenia, other inherited thrombocytopenias), six treatments, three animal models (zebrafish E525K mRNA, Src knockout mouse, Hck/Src double knockout), three experimental models, Harrison chapter, clinical burden and four discussions. ClinGen rates SRC Moderate for this disease; that tier is copied into gene_disease_validity and relationship_type CAUSATIVE is justified in genetic[].notes rather than silently assumed. The two mouse models are recorded as FAILS_TO_RECAPITULATE because they are loss of function with an inverted bone phenotype, and the zebrafish link to proplatelet formation is likewise FAILS_TO_RECAPITULATE because zebrafish have no proplatelet formation. Three evidence items inherited from the earlier partial draft were re-quoted so that each cites its own claim rather than a sentence mixing human marrow findings with in vitro colony assays, and the osteoporosis phenotype was re-quoted from a mouse-contrast sentence to the pedigree's own bone findings. Validated with just validate, validate-terms, count-verified-snippets (91/91), check-genereviews --online (NO_CHAPTER for both GeneReviews and StatPearls), the whole-repo offline gates including snippet-grading, snippet-length, title-snippets, reference-titles, retired-support-prose, causal-targets, name-collisions, coarse-phenotypes, qualifier-terms, enum-values, delivery-system, logical-rules, cache-order, shared-disease-terms, gene-activity-grounding, duplicate-keys, block-scalar-comments, entity-refs and case-collisions, and finally just validate-disorders (91 snippets, 91 titles, 0 issues).

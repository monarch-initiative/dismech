  summary: 'Review round 1: model-organism gene IDs, snippet re-attribution, quote_role'
  details: |
    Addresses the four non-blocking suggestions on the approving review of PR 17243 in one push. (1) The three animal models were bound to human hgnc:11283; they now carry their own species' MOD identifier per CLAUDE.md 'Naming Genes in a Model's Own Species' - zebrafish src ZFIN:ZDB-GENE-030131-3809, mouse Src MGI:98397, mouse Hck MGI:96052 - with the orthology to human SRC stated in each model description. Every identifier was read from NCBI Gene's own Gene-ref_db and AllianceGenome cross-references (mouse Src NCBI 20779, mouse Hck NCBI 15162, zebrafish src NCBI 325084) rather than written from memory, because no adapter routes MGI or ZFIN and the term validator therefore cannot check these labels. just check-gene-namespaces-online then resolved all three through the Alliance API and confirmed each label is the official symbol, adding 2 rows to cache/mgi/terms.csv and 1 to cache/zfin/terms.csv. (2) The downstream edge from Expanded Myeloid and Megakaryocyte Progenitor Output to Bone marrow hypercellularity quoted a sentence about trilineage dysplasia and dysplastic megakaryocyte features, which does not state hypercellularity; it now quotes 'Patients with myelofibrosis have hypercellular bone marrow with trilineage dysplasia' from the same paper, and the explanation records that the sentence reports hypercellularity in the patients with myelofibrosis rather than in every carrier. (3) Three evidence items quoting PMID:31204551 'These patients have fewer and heterogeneous-sized platelets that are hyporeactive to collagen.' now carry quote_role BACKGROUND. The paper's own framing was checked first: the sentence follows 'was previously found to cause ... in nine patients of a single pedigree' and precedes 'We now report a 5-year-old girl', so 'These patients' is the earlier founding pedigree and not the de novo case this paper contributes. (4) Evidence on the Src knockout mouse model link changed from supports REFUTE to SUPPORT, matching the sibling Hck/Src link: evidence on a link attests that the model is informative for the node, and the negative claim is carried by the FAILS_TO_RECAPITULATE relationship. Its explanation was rewritten to say so rather than reading as a refutation. The REFUTE item on the splenectomy treatment is unrelated and stands. CI test (3.13) on the pre-push head completed successfully, so no CI fix was bundled. Re-validated with just validate, validate-terms, count-verified-snippets (91/91), find_missing_reference_titles (0), check-gene-namespaces-online, the whole-repo offline gates and just validate-disorders.

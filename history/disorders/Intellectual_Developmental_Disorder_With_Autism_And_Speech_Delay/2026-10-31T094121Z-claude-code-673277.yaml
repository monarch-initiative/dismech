  summary: 'Create: Intellectual_Developmental_Disorder_With_Autism_And_Speech_Delay'
  details: |
    New entry for MONDO:0011627 (OMIM 606053), the TBR1 monogenic neurodevelopmental disorder, named TBR1-Related Neurodevelopmental Disorder under the entry-naming dyadic rule; the MONDO label, IDDAUS and the AUTS5 susceptibility synonyms are kept as synonyms. Lump/split: curated as one Disease entry; larger 2q24 contiguous deletions are a differential, not a subtype. Deep research: one OpenScientist report (research/Intellectual_Developmental_Disorder_With_Autism_And_Speech_Delay-deep-research-openscientist.md), 20/20 references resolved, 0 unresolved, 1/1 quotes valid; term validation flagged UBERON:0001885 named as amygdala (it is dentate gyrus) and UBERON:0005390 named as layer 6 (it is cortical layer I); neither was used. just preflight-dr returned PASS (TBR1 mentioned 64 times, OMIM 606053). The report was used as leads; every snippet comes from a reference cached with just fetch-reference, and further primary papers were added from a PubMed search (Nambot 2020 cohort, pachygyria report, 2q24.2 deletions, patient knock-in mice, layer 6 conditional mice, LiCl and zinc rescue). No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). ClinGen classifies TBR1 as Definitive only for the broader complex neurodevelopmental disorder (MONDO:0100038), so no gene_disease_validity assertion was recorded; the CGGV record is cited for inheritance, mechanism and the OMIM link. Report citations not used: 26578866 (review), 38850535 (multi-gene ChIP-seq and CRISPRi, not TBR1-specific enough for a node), 39012916 and 41329641 (further preclinical rescues), 25972180, 31680851, 40498232. A re-fetch of PMID:25232744 added only formatting lines and was reverted; all snippets verify against the committed version. Validation: just validate, count-verified-snippets (77/77), validate-terms, causal-target, entity-ref, coarse-phenotype, enum, duplicate-key, logical-rule and whole-KB snippet gates all pass.

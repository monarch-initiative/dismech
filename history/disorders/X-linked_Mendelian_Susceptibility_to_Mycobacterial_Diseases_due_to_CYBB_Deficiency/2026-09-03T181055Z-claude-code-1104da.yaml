  summary: 'Review round 1: treatment coverage, tuberculosis term, evidence alignment'
  details: |
    Responded to the first automated review on PR #10740 (REQUEST_CHANGES, four IMPORTANT items, no critical defects).

    1. Tuberculosis phenotype rebound from HP:0011274 (Recurrent mycobacterial infections) to HP:5210111 (Tuberculosis infection). HP:0011274 was carried by two distinct phenotypes, so the machine-readable layer could not tell recurrent mycobacterial disease apart from tuberculosis in an unvaccinated patient, which is the whole point of that phenotype. HP:0011274 now appears exactly once.

    2. Added an Antimycobacterial Therapy treatment (NCIT:C15986 Pharmacotherapy; therapeutic_agent NCIT:C280 Antitubercular Agent, CHEBI:28077 rifampicin, CHEBI:6030 isoniazide; therapeutic_modality SMALL_MOLECULE), targeting Failure to Restrict Intramacrophage Mycobacterial Growth with treatment_effect INHIBITS. The entry previously curated only IFN-gamma and BCG avoidance, omitting the mainstay of MSMD management. No regimen or duration is asserted. Two PMID:38341181 quotes, both graded directness INDIRECT because the review is MSMD-wide across 21 genotypes and reports no CYBB-specific outcome.

    3. Added Hematopoietic Stem Cell Transplantation (NCIT:C15431, CELL_THERAPY, RESTORES on Cell-Type-Restricted Failure of NADPH Oxidase Assembly). Curated as an option with an explicit caveat rather than a recommendation: no CYBB-MSMD transplant outcome is reported in any source curated here, and the risk-benefit calculation is not obviously that of a global phagocyte defect, since these patients have normal neutrophil function and a mycobacteria-restricted phenotype.

    4. IFN-gamma therapy gained therapeutic_agent NCIT:C100089 (Interferon Gamma-1b) and treatment_effect RESTORES on its existing mechanism link.

    5. BCG avoidance gained the PMID:38341181 contraindication sentence. The two pre-existing quotes established the premise (BCG disease as presenting illness) but never stated the recommendation.

    Validation: schema OK, term validation passed, 42/42 snippets verified (was 38/38). Offline gates all green: duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, snippet-length, snippet-grading, title-snippets, reference-titles, folded-hyphens, environmental-evidence. All four reviewer-supplied quotes were verified verbatim against references_cache/PMID_38341181.md before use, and every claim in this record was grepped out of the committed file rather than taken from the edit script's own success output.

  summary: 'Create: X-linked MSMD due to CYBB Deficiency'
  details: |
    De novo curation of X-linked MSMD due to CYBB deficiency (MONDO:0010389) as a Disease entry, separate from the X-linked CYBB subtype already carried on kb/disorders/Chronic_Granulomatous_Disease.yaml. The split rests on cell-type restriction rather than severity: the Q231P and T178P alleles abolish the respiratory burst in monocyte-derived macrophages while leaving it intact in blood neutrophils and monocytes, so the phenotype is narrower than CGD rather than milder, with no staphylococcal disease even in affected adults of advanced age. Precedent for per-genotype MSMD entries at this granularity exists (Mendelian_Susceptibility_To_Mycobacterial_Diseases_Due_To_Complete_IL12B_Deficiency).

    Deep research: one openscientist run (research/X-linked_MSMD_due_to_CYBB_Deficiency-deep-research-openscientist.md). Like the 17q12 run in the same batch, it shipped with no reference_validation and no term_validation block because term validation aborted on a 5-second EBI OLS read timeout on HP:0002716 -- a CURIE that is in cache/hp/terms.csv. This is dismech#10396 and I commented there with the reproduction across five runs. The reference section was retro-fitted with just validate-research-reference and flagged PMID:1531037 as resolving but off topic (a 1992 paper on signal transduction regulating NADPH oxidase component gene expression in polymorphonuclear leukocytes); it was not used.

    Used from the report: PMID:38341181 (systematic review of 830 MSMD patients, giving lymphadenopathy 45.5% multifocal in 35.1%, fever 30.2%, and the genotype distribution in which IL12RB1 and IFNGR1 account for 61%) and PMID:30264912 (MSMD 2014-2018 update, cited for the definition of MSMD as inborn errors of IFN-gamma immunity that this disorder is the effector-level exception to). All three additions are graded directness INDIRECT with the reason stated in each explanation: the cohort spans 21 MSMD genotypes and none of the figures can be attributed to CYBB deficiency, for which there are seven reported patients and no genotype-specific frequency.

    Two evidence items are deliberately non-SUPPORT and neither is an accident. On the EBV-transformed B cell node, PMID:21278736 is graded NO_EVIDENCE, quoting the authors' own statement that the cellular phenotype is irrelevant to pathogenesis and was used as an accessible surrogate; the node carries no downstream edges for the same reason. On interferon-gamma therapy, the same paper is graded REFUTE against the stronger claim that interferon-gamma corrects the oxidase defect, because Q231P macrophages still failed to mount the burst under interferon-gamma; the growth-control benefit recorded on the target_mechanisms link therefore cannot be attributed to burst restoration.

    A HUMAN_MODEL_MISMATCH discussion records the load-bearing limitation of the whole account: every measurement is in macrophages differentiated in vitro from blood monocytes, and the authors state they could not test the patients' macrophages in vivo or ex vivo. Since the defining feature of the disorder is that one allele behaves differently in different cell states, a model whose fidelity turns on the cell state is the wrong place for an untested assumption. A proposed experiment specifies the ex vivo tissue-macrophage assay with an internal neutrophil control, and both supporting and refuting outcomes.

    A MECHANISTIC_HYPOTHESIS definition records the diagnostic consequence: the standard CGD screens (dihydrorhodamine and nitroblue tetrazolium on peripheral neutrophils) are normal here by the very mechanism that makes patients ill, so a normal CGD screen does not exclude this disorder. Marked UNVALIDATED because no diagnostic accuracy study exists.

    BCG vaccination is curated as an environmental exposure with influences_mechanisms TRIGGERS, supported from both directions: BCG disease in every patient of kindred B, and unaffected obligate male carriers in earlier generations who lived before routine childhood BCG vaccination.

    Validation: just validate passes; 36/36 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading, check-title-snippets and check-environmental-evidence all pass. No exposure_term is bound on the BCG vaccination exposure, and the reason is recorded in its review_notes rather than asserted here. I initially wrote that no ECTO term existed, then checked: ECTO:2000129 "exposure to vaccination" does exist and is on target, but it is a label-less dangling node in the sqlite:obo:ecto build the term validator reads (runoak returns "ECTO:2000129 ! None") and is not reachable from the ExposureTerm enum roots, so binding it fails validation. Nothing for BCG or Mycobacterium bovis exists in ECTO at all. Filed as dismech#10738, which also reports that just environmental-term-audit recommends ECTO:2000129 as a reuse candidate despite the validator rejecting it.

  summary: 'Review round 1: venous phenotypes, asplenia management, frequencies'
  details: |
    Addressed review 5593808614 on PR 15077. Added Systemic venous anomalies (HP:0005345 Abnormal vena cava morphology, 7/9) and Pulmonary venous anomalies (HP:0011718 Abnormality of the pulmonary veins, 4/6) from the pooled PKD1L1 counts in PMID:42630107, wired downstream of the cardiac laterality node; the narrower vena cava and anomalous pulmonary venous return terms suggested by the reviewer were not used because the cached text gives no per-case vein type for any PKD1L1 patient. Added antibiotic prophylaxis (NCIT:C51993) and vaccination (NCIT:C15346) treatments for asplenia from heterotaxy and congenital asplenia sources (PMID:26557043, PMID:27425254, PMID:28741863), with a REFUTE item from PMID:27679871 (prophylaxis status not associated with bacteremia risk in an isomerism cohort); no therapeutic_agent is bound because none of the fetched heterotaxy sources names the antibiotic. Added frequencies for atrial situs ambiguous (7/10), polysplenia (8/14) and asplenia (2/14) from the same review; the gastrointestinal 13/13 figure was not applied because it lumps several phenotypes. Moved the stomach-position snippet from PMID:27272319 off the cardiac node onto Situs inversus totalis, and recorded the HPO searches behind HP:0100802 on the right-sided stomach phenotype. Atrial flutter was not added: one adult patient after cardiac surgery, with no mechanism in the entry to connect it to. Re-ran validate, validate-terms, count-verified-snippets (91/91), the offline gates and validate-disorders.

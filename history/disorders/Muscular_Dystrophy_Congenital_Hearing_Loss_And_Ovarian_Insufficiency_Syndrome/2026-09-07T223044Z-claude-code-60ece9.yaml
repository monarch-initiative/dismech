  summary: 'Review round 1: add nine phenotypes and four suggestions (PR #11399)'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES verdict on PR #11399. Blocking fix: added the four missing above-threshold phenotypes the reviewer identified, all from one already-cached sentence in PMID:35869884 - skeletal muscle atrophy (12/12 examined), hyporeflexia/areflexia (12/12), hypotonia (10/13) and short stature (8/13). Also took the reviewer's non-blocking extras from the same sentence, calf muscle hypertrophy (4/12) and myalgia (6/10), and the congenital presenting signs from PMID:32403198 (decreased fetal movement, weak cry, poor suck). Nine phenotypes in total. TWO CORRECTIONS TO THE REVIEWER'S SUGGESTED BINDINGS, both found by checking the cache before binding. First, HP:0003202's canonical label is 'Skeletal muscle atrophy', not 'Muscular atrophy' as the review wrote, so the term block uses the canonical string with the reviewer's wording carried in preferred_term. Second, the reviewer's phrasing implied a calf hypertrophy binding; the source says only 'calf hypertrophy', so the entry binds HP:0008981 Calf muscle hypertrophy rather than HP:0003707 Calf muscle pseudohypertrophy, which would assert a fatty-fibrous histology nobody reported. Frequency bands: 12/12 examined is recorded VERY_FREQUENT rather than OBLIGATE because the denominator is those examined (12) and not the enrolled cohort (13), and the descriptions state the denominators. Short stature is curated as its own phenotype rather than left inside the Failure to Thrive prose because the founding cohort hedged that it is 'potentially suggestive of further endocrinologic involvement', which is an open question in a disease that already has a defined endocrine arm. Suggestions taken: temporality RECURRENT plus the diarrhoeal-trigger evidence on the creatine kinase phenotype (suggestion 1); the diagnostically useful relative-sparing quote on the muscle MRI diagnosis record, preserving the authors' own 'may be' hedge and the three-patient denominator (suggestion 2); the congenital presenting signs (suggestion 3); a fifth discussion on unexamined male reproductive involvement (suggestion 5), recorded as a KNOWLEDGE_GAP rather than a phenotype because the founding cohort reports that none of five adult males has had children while stating in the same breath that no andrological examination was obtained, so childlessness cannot presently distinguish an unrecognised gonadal arm from five men who have not tried; and the presence: styling fix at the coenzyme Q10 biochemical record (suggestion 6). Suggestion 4 (p.Val285Gly) is declined: the research report lists it as ClinVar Pathogenic but no cached source supports it, and curating a variant on a report's unverified assertion is the fabrication risk the evidence SOP exists to prevent. No new references_cache files and no new term cache rows were needed - all ten HP CURIEs were already in cache/hp/terms.csv and the phenotype enum cache. Validation after the change: just validate passed with 112/112 snippets verified (was 101/101), just validate-terms passed, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-folded-hyphens and check-snippet-length are all clean.

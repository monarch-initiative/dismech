  summary: 'Create: Muscular_Dystrophy_Congenital_Hearing_Loss_And_Ovarian_Insufficiency_Syndrome'
  details: |
    New entry for MONDO:0859189 (OMIM:619518), GGPS1-related muscular dystrophy / congenital hearing loss / ovarian insufficiency syndrome.

    LUMP/SPLIT: curated as its own disease rather than as a Perrault syndrome subtype, and the decision is argued explicitly in the entry notes and in a Perrault differential that carries the counter-evidence. Reasons for splitting: the discovery paper states Perrault syndrome manifests with hearing loss and ovarian insufficiency but without muscle involvement; later cohorts invert the Perrault definition here, with muscular dystrophy constant and hearing loss present in only 46 percent of one cohort; the mechanism is isoprenoid/prenylation rather than mitochondrial gene expression; and MONDO/OMIM assign a separate identity not placed under Perrault syndrome. The lumping case (Tucker 2020 nominating GGPS1 from a Perrault cohort, and a 2026 Perrault review listing GGPS1 among fifteen Perrault genes) is curated as evidence rather than omitted. The existing kb/disorders/Perrault_Syndrome.yaml keeps GGPS1 as a gene whose phenotype overlaps Perrault syndrome; the two entries cross-reference each other and were deliberately not merged.

    SECOND GGPS1 ASSOCIATION: monoallelic GGPS1 (p.Asp188Tyr) and bisphosphonate-related atypical femoral fracture is a heterozygous drug-response susceptibility with no MONDO term, not a dominant Mendelian disease. It is curated as a differential and explicitly not merged.

    CONSISTENCY WITH LGMDR28: this entry does not contradict kb/disorders/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_28.yaml. That entry argues from mouse geranylgeraniol-rescue data that the HMGCR myopathy is caused by depletion of the geranylgeranyl branch rather than of sterol; this disease is a lesion placed directly in that branch, and PMID:42323079 is cited in both entries for the same claim. The LGMDR28 differential states the relation and the therapeutic asymmetry (mevalonolactone bypasses an HMGCR block but not a GGPS1 one).

    DEEP RESEARCH: 'just dr_fallback=--fallback research-disorder falcon ...' was run; falcon returned HTTP 402 (Edison account out of credits) and the run fell back to openscientist, recorded in the report frontmatter (fell_back: true, requested_provider: falcon) and reflected in the report filename. The report carries needs_review: true on both validation blocks: 15/15 references resolved with none unresolved, 11/12 quotes matched (the failure is the report's own ellipsis-joined splice of two real sentences from PMID:35869884), one reference flagged off topic (PMID:31427080, a bacterial GGPP-synthase structure, not cited here), and 47/49 CURIEs resolved with none unresolved. just preflight-dr returns PASS. The report contributed one lead used here (PMID:26112408, muscle GGPPS setting RhoA geranylgeranylation, cited with its context stated). Two of its claims were checked and rejected: it wrongly states the Y259C knock-in mouse recapitulates dystrophic muscle histology (those findings are human biopsies; the homozygous mouse dies before E13.5), and it recommends hormone replacement therapy with NCIT CURIEs that no GGPS1 source supports. Both rejections are recorded in the entry notes.

    EVIDENCE: every snippet was extracted programmatically from the reference cache rather than retyped, because the cached full text contains non-breaking hyphens and thin spaces. Two nodes carry REFUTE evidence for negative results that the mechanism predicts and the sources do not show: the discovery paper found no consistent prenylome change in patient cells, and muscle coenzyme Q10 was normal with an empirical CoQ10 trial producing no benefit. mechanism_confidence marks the inferred nodes PROVISIONAL/HYPOTHETICAL accordingly.

    MODULE CONFORMANCE considered and declined: sensorineural_hair_cell_loss would assert hair-cell mechanotransduction failure and spiral ganglion degeneration, none of which has been observed in GGPS1 disease. Recorded as a knowledge gap instead.

    VALIDATION: just validate-disorders passed (schema, terms, references); 101/101 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (offline and online), check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-reference-titles, normalize-cache and check-term-cache-integrity all clean.

  summary: 'Add biochemical and diagnosis sections (PR #12040)'
  details: |
    Two findings from the reviews on the sibling PRs in this batch (#12041 CEDNIK, #12042 SPG5A) transfer to this entry, and are applied here rather than waiting to be told the same thing a third time.

    The first is the CEDNIK review's observation that an entry can under-read a sentence it already quotes. The Cuchet-Lourenco abstract sentence 'They had immunodeficiency with lymphopenia and altered production of various cytokines revealed by whole-blood assays' was already quoted in this entry for the lymphopenia, and its other half - a named laboratory assay with an abnormal result - was not curated anywhere. Added a biochemical section carrying the whole-blood cytokine production assay with two readouts: READOUT_OF the signalling node, and PHARMACODYNAMIC_MARKER_OF the differentiation node, because the same measurement normalised after transplantation. That second readout is the entry's only functional measurement shown to respond to an intervention.

    The second is the SPG5A review's finding that a Mendelian entry should carry a diagnosis section when its cached references support one. Added three entries - RIPK1 sequencing, whole-blood cytokine production assay, lymphocyte count - all from references already in the file, no new fetches.

    The sequencing entry states why zygosity is part of the diagnostic step rather than incidental: a heterozygous RIPK1 variant at the caspase-8 cleavage site Asp324 indicates the dominant hyperinflammatory disease rather than a milder form of this one, so a report that stops at 'RIPK1 variant found' is not a diagnosis.

    Direction discipline on the cytokine readout: the sources say 'altered' production, and the in-vitro work shows impaired secretion. The biochemical notes say explicitly that this entry does not collapse that into a single direction, because no located source gives per-cytokine directions.

    Also noted for the record, having applied the CEDNIK lesson about bindings narrower than their sources: the Colitis binding on the inflammatory bowel disease phenotype was re-examined and left as is. HPO has no term for inflammatory bowel disease; the alternatives are Inflammation of the large intestine, Enterocolitis and Ulcerative colitis, each of which over- or under-commits in a different direction. The entry curates Gastritis separately so the upper tract is not dropped, and the phenotype description records that HPO lacks the concept.

    Separately: the claude-review check on this PR failed at 14:44Z with 'Failed to authenticate. API Error: 401 Invalid bearer token' after 2 seconds and 1 turn, before any review was posted. That is a credential failure in the review workflow, not a finding about this diff - the same workflow succeeded on #12041 and #12042 minutes later. Re-running is not available to this session: both actions/runs/<id>/rerun-failed-jobs and a workflow_dispatch of claude-code-review.yml return 403 Resource not accessible by integration. Recorded in a PR comment.

    Validation: just validate passed; 35/35 snippets verified (up from 28/28); just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK.

  summary: 'Review round 1: gastritis evidence, phenotype split, Table 1 cohort mining'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #12040 in one push. All three
    IMPORTANT findings and both optional suggestions.

    IMPORTANT 1 - Gastritis was evidenced by a PMID:30591564 sentence about intestinal
    inflammation, and the explanation field conceded it. Requoted against PMID:34163478 Table 1
    rows for P5, P8 and P13, the three recessive patients whose Others column names gastritis
    explicitly. evidence_source OTHER, quote_role REVIEW_SYNTHESIS, matching how that review is
    cited elsewhere in the entry. Frequency set OCCASIONAL from the 3/14 tabulation.

    IMPORTANT 2 - The unbound 'Motor and cognitive delay' phenotype carried a rationale its own
    snippet contradicted: the sentence reports severe motor delay and mild intellectual disability
    separately. Split into Motor delay (HP:0001270, severity SEVERE) and Mild intellectual
    disability (HP:0001256), both quoting the same sentence, and the false rationale removed.

    IMPORTANT 3 - Mined PMID:34163478 Table 1, the 14-patient recessive cohort that was cited only
    for mechanism. Added six phenotypes with per-patient row snippets: Oral ulcers (HP:0000155,
    6/14), Perianal disease (deliberately unbound - HPO has perianal abscess, anal fistula and
    perianal dermatitis but no term for the aggregate the source reports, 8/14), Esophagitis
    (HP:0100633, 4/14), Hepatomegaly (HP:0002240, 4/14), Splenomegaly (HP:0001744, 4/14) and
    Pneumonia (HP:0002090, 8/14). Every count is stated in the description as a tabulation of a
    named column rather than as a quoted figure.

    Added a progression phase for outcome: 6/14 died, 7 alive, 1 not reported, with the review's
    own 'severe and potentially lethal' characterisation plus the P1 and P7 rows. P1 and P2 are
    brothers with the same genotype and the same transplant and opposite outcomes, which is
    recorded because it is the table's clearest statement that genotype does not determine
    outcome.

    Expanded treatments from one to seven: immunoglobulin replacement (NCIT:C62710), systemic
    corticosteroid therapy (NCIT:C122080), azathioprine plus infliximab (NCIT:C15986 with
    NCIT:C290 and NCIT:C1789 agents), antibiotic therapy (NCIT:C15620), antifungal therapy
    (NCIT:C15704) and interleukin-1 inhibition (proposed only, target_mechanisms onto the
    inflammasome node). The existing HSCT entry gained the review's own statement of what
    transplantation resolved, and the P2 row, since three of the four transplanted patients died
    and the entry should not read as if transplantation were established therapy.

    Suggestions taken: GO:0044546 'NLRP3 inflammasome complex assembly' (modifier INCREASED) bound
    on the Increased Inflammasome Activity node with two supporting quotes, and a new
    Necroptosis Susceptibility -> Increased Inflammasome Activity edge
    (INDIRECT_KNOWN_INTERMEDIATES) justified by the result that inhibiting MLKL, like inhibiting
    NLRP3, reduces IL-1 beta secretion in RIPK1-deficient cells. That is the second join the
    review asked for, and it rests on a pharmacological result rather than on co-occurrence.

    New KNOWLEDGE_GAP discussion ripk1_extraintestinal_features, attached to the four phenotypes
    left with no incoming edge. The located mechanism places the cell-death defect in intestinal
    epithelial cells, and esophagitis, perianal disease and hepatosplenomegaly are not intestinal
    epithelium. Rather than attach them to the nearest plausible node, the entry records that the
    mechanism does not reach them and names the three candidate explanations.

    Validation: linkml-validate clean, linkml-term-validator clean, 68/68 snippets verified (was
    35/35), check-entity-refs / causal-targets / duplicate-keys / qualifier-terms / enum-values /
    case-collisions / snippet-grading / title-snippets / snippet-length / folded-hyphens /
    reference-titles all OK, validate-disorders clean. Phenotype causal connectivity 7/14 (50.0%);
    the seven unconnected are the four covered by the new knowledge gap plus gastritis-adjacent
    oral ulcers and the two neurological single-case features.

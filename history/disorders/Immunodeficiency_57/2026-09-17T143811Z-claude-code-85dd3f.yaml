  summary: 'Create: Immunodeficiency 57 (RIPK1 deficiency)'
  details: |
    De-novo curation of immunodeficiency 57 (MONDO:0020849), biallelic RIPK1 loss of function, from a Perplexity sonar-deep-research run (research/Immunodeficiency_57-deep-research-perplexity.md, 366s, 19 citations).

    The report was used as a lead only. Two things made it unusable as a citation source directly. Its .citations.md sidecar lists web URLs (OMIM, MalaCards, PanelApp, ZFIN, publisher pages) rather than PMIDs, and only three PMID strings appear anywhere in the body, so the report's own reference-validation block (7 checked, 7 resolved) covers a small minority of its actual sourcing. Its ontology suggestions were worse: the run's Term Validation section records 9 of 37 named terms resolving to a different term than the report calls them, including HP:0002597 offered as 'Inflammatory bowel disease' (HPO: Abnormality of the vasculature) and HP:0012404 offered as 'Early-onset inflammatory bowel disease' (HPO: Abnormal urine citrate concentration), plus HP:0003479 which does not exist. No CURIE was taken from the report. Every term in this entry was looked up against OLS in the same step it was written, and hgnc:10019 was read from the repository's own cache/hgnc/terms.csv.

    References were sourced independently via PubMed esearch and cached with just fetch-reference: PMID:30026316 (Cuchet-Lourenco, Science 2018, founding cohort), PMID:30591564 (Li, PNAS 2019, second series), PMID:31213653 (Uchiyama, single case adding motor and cognitive delay), PMID:34163478 (Zhang/Aksentijevich review, domain architecture and the CRIA contrast).

    Curation judgements worth recording. The inflammasome edge is typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT: the cited sentence establishes that inflammasome activity rises but says nothing about the route, and the proposed non-canonical TLR4-TRIF-RIPK1-FADD-caspase-8 axis appears only in review, so it is recorded as a KNOWLEDGE_GAP discussion instead of asserted. The arthritis edge is typed the same way for the same reason and carries its own gap. 'Motor and cognitive delay' is left without an HP binding because the single source names two distinct features in one sentence and binding either alone would misrepresent it. No frequency in this entry comes from a published denominator, because none exists for this disease; each band states in its own description what it is reasoned from.

    Validation: just validate passed; 28/28 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK; 6 of 7 phenotypes causally connected (85.7%). just check-genereviews reports NO_CHAPTER, which the entry's notes record.

  summary: 'Review round 2: remove the contradictory gastritis edge, split azathioprine/infliximab'
  details: |
    Second review round on PR #12040. One IMPORTANT finding and the two actionable suggestions.

    IMPORTANT - the entry contradicted itself about gastritis. Round 1 added a knowledge gap saying
    the intestinal-epithelium mechanism does not reach gastritis, and left in place a bare DIRECT
    edge from Intestinal Epithelial Injury and Inflammation to Gastritis that had been there since
    the entry was created. Both statements cannot be true. The edge is removed, phenotypes#Gastritis
    is added to the ripk1_extraintestinal_features attaches_to list beside its anatomical sibling
    Esophagitis, and the gap rationale now records that the edge existed and why it was wrong: the
    node binds CL:0002563 intestinal epithelial cell and the stomach is not that cell type.

    The edge predates this round and survived it because round 1 changed the gastritis phenotype's
    evidence, not its incoming edge, and nothing compares a causal edge against prose written about
    the same node. That is the same class of defect as the round-1 finding where a phenotype
    description contradicted the snippet directly beneath it.

    Suggestion - therapeutic_modality. Added SMALL_MOLECULE to systemic corticosteroid therapy,
    antibiotic therapy and antifungal therapy. The reviewer also suggested it for HSCT, which
    already carried CELL_THERAPY. The combined azathioprine-and-infliximab treatment is split into
    two treatments, because the slot is single-valued and the two agents have different modalities:
    azathioprine SMALL_MOLECULE, infliximab MONOCLONAL_ANTIBODY. Both carry the same two Table 1
    rows, and each description says the split is a schema consequence rather than something the
    source does. Interleukin-1 inhibition is deliberately left without a modality: the review names
    no agent, and IL-1 inhibitors in use span a receptor-antagonist protein and a monoclonal
    antibody, so any value would be a guess about which drug was meant.

    Suggestion - structural disposition for the neurological features. New KNOWLEDGE_GAP
    ripk1_neurodevelopmental_features attached to Motor delay and Mild intellectual disability. It
    records the real problem, which is not that the mechanism is unknown but that one patient is
    not a phenotype, and that in an infant with severe infection and chronic enteropathy
    developmental delay has several ordinary explanations unrelated to RIPK1.


  summary: 'Create: familial episodic pain syndrome 3 (SCN11A)'
  details: |
    Curated FEPS3 from an OpenScientist deep-research report plus 11 cited PubMed abstracts. Six-node pathograph from a heterozygous SCN11A gain-of-function missense variant through hyperpolarized NaV1.9 activation with an enlarged window current, a depolarized resting membrane potential in small-diameter dorsal root ganglion neurons, and nociceptor hyperexcitability that is retained at cold temperatures, to ectopic nociceptive signalling from distal limb afferents, with a variant-dependent myenteric branch. Scope was the first decision and is recorded in the entry notes: the disease name does not pick a gene, the report itself flags in its limitations that FEPS2 (SCN10A) also causes distal lower-limb episodic pain, and the preflight check reported SCN10A at 43 percent of the SCN11A mention rate. MONDO:0014247 carries OMIM 615552, which is FEPS3 and therefore SCN11A, so the entry is SCN11A only and FEPS1, FEPS2 and FEPS4 are curated as differentials. Included the NaV1.9-null mouse as a deliberately inverted model with relationship PERTURBS, limitations stating it carries the opposite lesion, and its readout graded directness INDIRECT, since it establishes necessity where the knock-ins establish sufficiency. Two open knowledge gaps: what quantitative degree of gain of function separates episodic pain from congenital insensitivity to pain at the same residue, and why episodes remit around adolescence when the variant is lifelong. This report's suggested identifiers were unusually unreliable and none was adopted. Its own term validation flagged five naming a different concept, including HP:0025277 for episodic pain which is Gustatory sweating and UBERON:0001132 for trigeminal ganglion which is parathyroid gland; a sixth, CL:0011103 for enteric neuron, is sympathetic neuron. Beyond those, all four NCIT identifiers it proposed for treatments are wrong and none was caught by its own validation, which does not check NCIT: C15272 offered for Supportive Care is Lobectomy, C376 for Carbamazepine is Cisplatin, C198 for NSAID is Acetaminophen, and C15311 for Genetic Counseling is Quality Control. Every identifier bound here was checked against its ontology first, and HP:0032148 Episodic pain, which the report never proposed, is the exact term for the defining phenotype. Declined to curate any pharmacotherapy: the only paper cited for carbamazepine concerns a NaV1.8 channel in diabetic neuropathy, and the PRMT7 and cholesterol findings are preclinical mechanism studies rather than treatments. Five references fetched by the research run were read, set aside and their caches not shipped. The cached abstract of PMID:30549873 carries line-break hyphenation artifacts from its source and quotes spanning them reproduce the artifact exactly rather than silently repairing it. Neither environmental trigger is bound to an ECTO term; both searches are recorded in review_notes. Validation: schema, terms and references clean with 62/62 snippets verified; all offline gates green.

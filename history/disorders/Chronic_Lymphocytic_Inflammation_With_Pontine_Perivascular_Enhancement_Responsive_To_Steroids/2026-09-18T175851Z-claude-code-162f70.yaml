  summary: 'Create: CLIPPERS'
  details: |
    De novo curation of CLIPPERS (MONDO:0017297) from an openscientist deep-research report plus independent PubMed reference work.

    Deep research: just research-disorder openscientist, report committed at research/Chronic_Lymphocytic_Inflammation_With_Pontine_Perivascular_Enhancement_Responsive_To_Steroids-deep-research-openscientist.md. Its frontmatter records reference_validation 25/25 verified, confabulation_rate 0.0, no unresolved references. Its term_validation reports labels_mismatched 7 with labels_matching 0; those are a parsing artifact, not wrong bindings - the report presents CURIEs in a table whose next column is a frequency word, and the validator read the frequency column (Common, Occasional, Frequent) as the term label. Each of the seven CURIEs is correct for what the report means. No binding in this entry was taken from that list without independent lookup.

    The entry was first built from the primary literature (Pittock 2010 PMID:20639547, Tobin 2017 diagnostic criteria PMID:29050399, the lymphoma-mimic reports PMID:23649857 and PMID:35126669), then substantially augmented from the report, which supplied content the first pass had missed: the Al-Chalabi systematic review of 140 patients (PMID:36029706) giving relapse rate 59.2 percent, overall mortality 10 percent and 30 percent with associated malignancy - which moved clinical_burden from MODERATE to HIGH - and the Taieb cohort (PMID:33658321) showing biallelic PRF1 or UNC13D mutations in 4 of 12 tested adult patients, replicated for UNC13D in PMID:41781714. That finding added a genetic section, a HYPOTHETICAL pathophysiology node for impaired cytotoxic granule-mediated killing, and an EMERGING mechanistic_hypotheses group that the corresponding causal edge opts into.

    Modelling decisions worth recording. The pathograph deliberately begins at a tissue-level observation (perivascular T-lymphocytic infiltration) because no upstream trigger is established; a KNOWLEDGE_GAP records that rather than supplying a plausible node. PRF1 and UNC13D are relationship_type SUSCEPTIBILITY, not CAUSATIVE, because it is unsettled whether those patients have CLIPPERS with a genetic modifier or a distinct HLH-spectrum disease presenting as CLIPPERS - three of the four mutated patients later showed atypical findings. EBV is environmental_effect MODULATES, not TRIGGERS, because the evidence is a single co-occurrence case. A second KNOWLEDGE_GAP records the unresolved entity-versus-syndrome question.

    Validation: just validate passes with 37/37 snippets verified against cached references; validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys and check-enum-values all pass. GeneReviews baseline: NO_CHAPTER for both Bookshelf collections, expected for a non-Mendelian syndrome named in 2010; recorded in the entry notes.

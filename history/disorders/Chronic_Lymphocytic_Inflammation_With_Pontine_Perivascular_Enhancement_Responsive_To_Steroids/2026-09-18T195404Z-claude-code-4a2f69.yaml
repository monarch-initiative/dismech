  details: |
    Addressed review round 1 on PR #12161. All four findings and both optional items, in one push.

    BLOCKING. Dysarthria was missing. CLIPPERS is defined by a brainstem-cerebellar picture whose canonical three symptoms are diplopia, gait ataxia and cerebellar dysarthria, and the entry modelled the first two. Added as a phenotype bound to HP:0001260 with the cerebellar qualifier in preferred_term, cited from the systematic review's framing sentence (quote_role REVIEW_SYNTHESIS, as the reviewer asked; the first draft used BACKGROUND, which is defensible for an introduction sentence, but the citing publication is itself a systematic review and the repo's worked example applies REVIEW_SYNTHESIS on document type) and from the six-patient series that lists dysarthria among the common manifestations. Wired downstream of Brainstem and Cerebellar Dysfunction, so connectivity stays 7/7.

    FREQUENCY GRADES. The reviewer was right that four bands rested on one PMID:29050399 sentence that lists the symptoms and states only that they do not discriminate CLIPPERS from its mimics, which carries no frequency information at all. Each band now has its own anchor and a notes line saying what kind of claim it is:
    - Gait ataxia FREQUENT, from 'Ataxia was the most common presenting symptom' in the 140-patient review. A ranking, not a rate.
    - Diplopia FREQUENT, from the French nationwide series describing relapses as manifesting frequent cerebellar ataxia and diplopia.
    - Facial paraesthesia FREQUENT, from the six-patient series calling it a common manifestation.
    - Cognitive impairment left at OCCASIONAL rather than raised. The only source calling it common is that same six-patient series; the larger cohorts list it without a frequency and the systematic review ranks only ataxia. Raising a band on six patients would assert more than the literature supports, and the notes say so.
    No source anywhere reports a percentage for any individual symptom, so every band here is qualitative by necessity rather than by shortcut.

    DIAGNOSIS. Two entries added. Cerebrospinal fluid examination, from the nationwide series' inconstant-oligoclonal-bands and raised CD4:CD8 sentence, with the description making the point that the word inconstant is why this test neither confirms nor excludes. Screening for occult malignancy, from the systematic review's explicit recommendation plus the mortality figures behind it (10% overall, 30% with an associated malignancy). The second is the practical consequence of the entity-versus-syndrome discussion already in the entry.

    TREATMENT. Added the systematic review's steroid-duration finding to the chronic immunosuppression treatment: relapse tracked with a shorter acute course (mean 6.19 vs 10.14 days, P = 0.04) and not with the dose, plus the authors' ten-day recommendation. The explanation records that this is an observational comparison across pooled case reports and cannot separate a short course causing relapse from a milder illness being treated briefly.

    NOT CHANGED, with reason. HP:0012747 Abnormal brainstem MRI signal intensity stays on the enhancement phenotype. Searching cache/hp/terms.csv for enhancement terms returns HP:0032070 Leptomeningeal enhancement and HP:4000004 Myocardial late gadolinium enhancement; neither describes punctate parenchymal brainstem enhancement. The binding is broader than the finding, which is the documented no-term-beats-a-bad-one case.

    Validation: just validate 59/59 snippets verified (was 48/48). list-disconnected-phenotypes 7/7 connected. check-folded-hyphens, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-reference-titles, check-snippet-length, check-title-snippets, check-snippet-grading and full pytest run before push.

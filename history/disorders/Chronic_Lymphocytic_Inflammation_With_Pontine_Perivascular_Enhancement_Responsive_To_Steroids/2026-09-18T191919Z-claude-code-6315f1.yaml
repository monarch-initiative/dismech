  details: |
    Self-audit against the content-completeness standard the automated reviewer applied to the sibling PRs in this run (#12164, #12167). The review run on this PR was cancelled by CI rather than completed, so this round is the author's own pass over the same checklist, not a response to findings.

    The trigger was the ratio the #12164 review keyed on: this PR committed 27 reference caches and cited 10. Reading the uncited ones surfaced three things the entry should carry.

    1. Contested infiltrate lineage. The entry's central pathophysiology node is named for a perivascular CD3-positive T-lymphocytic infiltrate, which is what the founding cohort (PMID:20639547), the criteria cohort (PMID:29050399) and the French nationwide series (PMID:22777259) report. PMID:33498046, committed by this PR and uncited, reports the opposite in a six-patient series: of four patients with an infiltrate, one was CD3-dominant and three CD20-dominant, and the authors generalise it. Added two REFUTE evidence items on the node, a paragraph in the node description saying the lineage is the majority finding rather than a settled one, and a KNOWLEDGE_GAP discussion (clippers_infiltrate_lineage_contested) carrying both sides with the T-cell papers graded REFUTE against the B-cell claim so the disagreement is legible from either direction. The node keeps its name because the larger cohorts support it and nothing downstream depends on the lineage.

    2. progression: section added, from PMID:22777259. Two phases: Relapse (mean 2.5 months, mean EDSS 4, residual 1.9 after pulse steroids) and Long-term course (relapsing-remitting with no progressive form; long-term disability correlated with prior relapse severity; brainstem and spinal cord atrophy in the four patients with residual EDSS at or above 4; the single untreated patient reached EDSS 10 at death). This matters for how the entry reads: disability accrues stepwise from relapses rather than from a progressive phase, which is what makes delayed treatment the determinant of outcome.

    3. Intravenous immunoglobulin added as a treatment with REFUTE evidence, from PMID:36938308. IVIg was given for a relapse with no clinical improvement while the same patient responded promptly to intravenous methylprednisolone each time. A documented failure of a plausible therapy is more useful than its absence. therapeutic_modality is OTHER rather than PROTEIN_REPLACEMENT, recorded in notes, because pooled IgG is an immunomodulator here and the patient had no immunoglobulin deficit.

    Not done, deliberately: the remaining uncited committed caches (pediatric series, SLIPPERS supratentorial variant, several single-case mimics) are the screening set for this entry. They are left committed rather than pruned because on #12164 exactly such caches were what let the reviewer locate real content gaps.

    Validation: just validate 48/48 snippets verified (was 37/37). check-folded-hyphens, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values clean; list-disconnected-phenotypes reports 6/6 phenotypes causally connected.

  summary: 'Treatment-centred review and enrichment: Adult-Onset Still Disease'
  details: |
    Treatment-centred review. Sources were a PubMed and ClinicalTrials.gov sweep read against the cached primary records: the randomized trials of anakinra (PMID:22859346), canakinumab (PMID:32404342) and tocilizumab (PMID:30279267 and its cytokine sub-analysis PMID:40516928), the tadekinig alfa phase 2 study (PMID:29472362), the emapalumab MAS trial (PMID:37001971) and its PK/PD model (PMID:39943917), the 2024 EULAR/PReS recommendations and their two systematic reviews (PMID:39317417, 39317415, 39317414), JAK inhibitor series (PMID:32079571, 38870881), methotrexate series (PMID:9972972, 37517110), NET and biomarker studies, and Orphanet ORPHA:829 for phenotype frequencies. An OpenScientist deep-research run was launched twice; the first was stopped at the one-hour background limit with no report and the second had not returned when this record was written, so no content in this change comes from it.

    Pathograph: added six nodes so each drug target is explicit (Neutrophil Extracellular Trap Release, IL-1 Receptor Signaling, IL-6 Receptor Signaling, Free IL-18 Excess, Interferon-gamma Signaling, JAK-STAT Cytokine Signal Transduction), with HGNC genes, GO processes and evidenced edges; existing node names were kept because kb/node_classes cites two of them. Two conforms_to links added (nlrp3_inflammasome_activation, il6_hypercytokinemia). Treatments: every existing treatment re-read against its sources and re-linked from the lumped cytokine node to the specific target node; primary trial results added, including the unmet primary endpoints of the canakinumab and tocilizumab trials; rilonacept, ciclosporin for MAS, TNF inhibitors, JAK inhibitor therapy, emapalumab for MAS and tadekinig alfa added; anakinra modality corrected from OTHER to PROTEIN_REPLACEMENT; dosing intervals recorded where a source states them. No effect_modifiers were recorded: the only subgroup signal (higher baseline interferon-gamma in tocilizumab non-responders) compares cytokines between response groups, not response between strata, so it is kept as treatment evidence. Phenotypes: Orphanet frequencies added to all ten existing phenotypes; lymphadenopathy, elevated liver enzymes and pleuritis added and wired. Biomarkers: serum IL-18, S100A8/A9 and CXCL9 added with readouts; ferritin bound to NCIT and LOINC. No regulatory_endpoint_refs: the FDA surrogate endpoint table has no Still disease row. Seven clinical trials added (six NCT, one UMIN via ICTRP). One knowledge-gap discussion added on choosing the cytokine target.

    Validation: just validate (schema and terms) passed; count-verified-snippets 165/165; check-causal-targets, check-entity-refs, check-logical-rules, check-gene-activity-grounding and check-conformance-content clean; all 13 phenotypes causally connected.

    Review round 1 (PR 19073). The reviewer found that a note on the Free IL-18 Excess node wrongly said GO has no interleukin-18-mediated signaling pathway term. The OLS search endpoint had returned no rows for that query; a direct lookup of GO:0035655 returns the term, so the note was removed and GO:0035655 was bound beside interleukin-18 production. Evidence grading made consistent: the unmet primary endpoints of the canakinumab and tocilizumab trials are graded REFUTE against the efficacy claim, and statements that support what the description says (marginal efficacy of methotrexate, no randomized trial of TNF or JAK inhibitors) are graded SUPPORT. Rilonacept modality changed from OTHER to MONOCLONAL_ANTIBODY to match etanercept, with a note that it is an Fc-fusion protein. A note records that the tadekinig alfa interval of 2.33 days is derived as 7/3.

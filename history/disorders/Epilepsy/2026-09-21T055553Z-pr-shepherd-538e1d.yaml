  summary: 'Review round: evidence discipline on the MAM dysfunction node'
  details: |
    Addresses all eight blocking findings from the 2026-09-20 review on PR #12353. Every finding was on the evidence side; the ontology work was already sound.

    1. references_cache/PMID_42665778.md was genuinely missing - confirmed the file absent on this branch before fetching. Regenerated with 'just fetch-reference PMID:42665778' and committed it. CI had gone green only because validate-disorders silently network-fetched the record.
    2. Added reference_title to the retained evidence item, copied verbatim from the cache frontmatter.
    3. Added PMID:42665778 to the top-level references: block.
    4. Dropped two of the three snippets as scope statements rather than findings. The opening sentence ('This review examines the potential role ... We systematically analyze how ...') states what the review sets out to do and hedges with 'may contribute'; the closing sentence on small-molecule, nanodelivery and neuromodulation strategies is about therapeutics and supports nothing about this pathophysiology node. Only 'we identify MAMs as a critical hub in epilepsy' is a review conclusion, and it is what the node now rests on.
    5. Added quote_role: REVIEW_SYNTHESIS. The cached record's publication_types include Review. evidence_source stays OTHER, graded from the quoted text: the sentence consolidates molecular and genetic evidence spanning study types (the record is MeSH-indexed for both Humans and Animals) rather than reporting one, and quote_role now says why it lands on OTHER instead of leaving that unstated.
    6. Changed the autophagy modifier from DECREASED to DYSREGULATED, matching the three sibling processes. The abstract says only that MAMs regulate autophagy and that dysregulation may contribute; it makes no directional claim.
    7. Both downstream edges asserted specific mechanistic steps - mitochondrial calcium sequestration, ion-channel gating, lipid peroxidation - that the cited abstract never mentions. Softened both to state explicitly that they are proposed rather than demonstrated, and named what the source does not measure. Softened the node description the same way, which also addresses the non-blocking note that it narrated a chain.
    8. This record.

    Recorded the reviewer's closing point in the node notes rather than padding around it: after dropping the two scope statements the node rests on one sentence from one review, which is the honest state of the evidence for an emerging mechanism. The notes also name the two rejected sentences and why, so a future curator does not re-add them.

    Not addressed (agreed with the review): kb/modules/mitochondrial_dysfunction.yaml is not a viable conforms_to target, being scoped to hallmarks-of-aging biology. The node having no incoming edges is left as is - MAM dysfunction is usually secondary to a genetic or acquired insult, but naming that upstream insult needs a source this PR does not have.

    Validation: just validate (113/113 snippets), just validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets all pass with no new baseline entries.

  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 2. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. Cited all five previously evidence-free `environmental:` exposures (Traumatic Brain Injury, CNS Infections, Stroke, Brain Tumors, Perinatal Injury). All five are acquired-epilepsy causes and each now carries a quantified cohort or review citation: nationwide matched cohorts for TBI (PMID:38903174) and brain infection (PMID:32989110), an HIE-specific neonatal cohort for perinatal injury (PMID:30642234), and reviews for the stroke and tumor claims. Notes were left unchanged -- each was already an accurate summary of what the citation shows. Validated with `just validate`, `just count-verified-snippets` and the batched `just validate-disorders` sweep.

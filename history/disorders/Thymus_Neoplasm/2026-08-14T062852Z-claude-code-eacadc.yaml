  summary: Create root Thymus Neoplasm with subtypes
  details: |
    De-novo CURATE_ROOT_WITH_SUBTYPES root entry for thymus neoplasm MONDO:0005197, issue #8457. Organizes the three existing family-level dismech entries Thymoma, Thymic Carcinoma and Thymic Neuroendocrine Carcinoma as has_subtypes facets, with the five WHO thymoma histotypes A/AB/B1/B2/B3 listed as children of the Thymoma subtype. Root carries only the shared thymic-epithelial-origin node and the thymoma central-tolerance-failure arm producing paraneoplastic autoimmunity such as myasthenia gravis and pure red cell aplasia; detailed oncogenic mechanism graphs stay in the dedicated subtype pages and are not duplicated. Evidence reuses snippets verbatim from the validated sibling entries and re-verified 21/21 with count-verified-snippets. See PR body for the note on the three MONDO terms that could not be validated offline due to policy-blocked ontology hosts.

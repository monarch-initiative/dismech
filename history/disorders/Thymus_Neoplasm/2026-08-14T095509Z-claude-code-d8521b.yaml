  details: |
    PR Shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review on #8461. (1) Rebound the 'Thymic neuroendocrine tumors' facet from NCIT:C171031 (Thymus Neuroendocrine Carcinoma, poorly differentiated NEC only) to MONDO:0019964 'thymic neuroendocrine tumor', the family-level parent whose label matches the preferred_term and which is already curated as the skos:broadMatch in Thymic_Neuroendocrine_Carcinoma.yaml. (2) Split 'Systemic therapy for advanced or unresectable disease' into two treatments so each treatment term matches its own evidence: 'Platinum-based chemotherapy for advanced or unresectable disease' (NCIT:C15632 Chemotherapy plus CHEBI carboplatin/paclitaxel, evidenced by PMID:21502559) and 'Lenvatinib' (NCIT:C15986 Pharmacotherapy plus CHEBI:85994 lenvatinib, evidenced by REMORA PMID:32502444); both carry therapeutic_modality SMALL_MOLECULE, mirroring Thymic_Carcinoma.yaml. (3) Connected the orphan 'Anterior mediastinal mass' phenotype by adding a downstream edge from 'Neoplastic transformation of thymic epithelium', evidenced by the PMID:38264756 snippet already in the file. Also reflowed two folded scalars whose lines ended in a hyphen, which was failing scripts/check_folded_hyphens.py in CI, and committed the MONDO term and enum cache rows written by validate-terms with network. Validated: check_folded_hyphens OK; just validate kb/disorders/Thymus_Neoplasm.yaml passed with Snippets checked 23/23 verified; check_title_snippets OK.

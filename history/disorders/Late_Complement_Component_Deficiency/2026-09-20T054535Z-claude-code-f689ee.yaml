  summary: Bind C8A and split the C8 subtype by chain
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    The checklist asks for two chain-specific MONDO classes - MONDO:0013422 (type I,
    C8A) and MONDO:0013421 (type II, C8B). C8B was bound; C8A was not, although the
    entry's own prose named it and its HGNC identifier already appeared in the
    pathophysiology node's `genes:` list. That is the campaign's characteristic gap:
    present to a reader, absent to a query.

    The C8 row is now a parent spanning both chains with two child rows beneath it,
    each bound to its MONDO leaf and its gene, and the `genetic:` block carries a new
    `C8 Alpha Chain Deficiency` record keyed to the alpha-gamma row. The evidence is
    the molecular study of two unrelated Japanese subjects that screened all 11 exons
    of C8A and all 7 of C8G and found the lesion in C8A with no C8G variant - which is
    why the alpha-gamma form binds C8A alone and no C8G record exists. The
    `mondo_mappings` comment was rewritten because it described an arrangement that no
    longer holds; both leaves are kept there as narrowMatch entries, since they remain
    narrower than this entry's own MONDO:0015700 anchor whichever route reaches them.

    Every single-gene subtype row (C5, C6, C7, C9) now carries its gene.

    Pathograph: the genes were already bound at the shared loss-of-function node. They
    are now also bound at `Impaired Membrane Attack Complex Assembly`, whose
    description already walked each component's step in the sequence. A note there
    records why this is one node and not six - the successor state is the same
    whichever terminal component is missing - and names the one exception, C5, whose
    loss additionally abolishes C5a generation.

  details: |
    PR-shepherd follow-up addressing the third blocking item from the ai4c-reviewer CHANGES_REQUESTED review, on the disease-level autosomal recessive inheritance block. 1. The PMID:35084692 evidence item previously quoted "Twenty-one (52 percent) were asymptomatic and diagnosed based on family history", which is an ascertainment statement and does not evidence recessive inheritance. Replaced with the quote reporting that two-thirds of the UK cohort were from consanguineous Asian families and 80 percent had an affected family member, which is the expected pattern for a recessive trait. 2. The PMID:32670577 explanation described the C6 pedigree as consanguineous; the source abstract explicitly states the family was nonconsanguineous, and compound heterozygosity is inconsistent with consanguinity. Corrected the wording. 3. Added a second PMID:32670577 evidence item quoting that monoallelic carriers in the same pedigree had intermediate C6 levels but preserved CH50/AH50 activity, which evidences the unaffected half-normal carrier state asserted in the block description. Validated with just validate and just validate-terms; all pass, 38/38 snippets verified.

  summary: 'Review: terminal complement deficiency publication-completeness deep review
    (IUIS Table 8)'
  details: |
    The entry carried no biochemical section, although CH50 is the test that finds this disease and an undetectable CH50 with undetectable AP50 is its diagnostic signature.

    Added CH50 and AP50 records with the operative laboratory definition from the 212-patient French cohort - terminal pathway deficiency defined by both activities below 10% of normal - plus the total-versus-subtotal distinction, which matters because a low but detectable CH50 in C5, C6 or C7 subtotal deficiency does not exclude the diagnosis. The AP50 record explains the pairing: the two assays share only the terminal components, so simultaneous loss localizes the lesion at or below C5, whereas an isolated CH50 fall with preserved AP50 points at an early classical defect such as C2 deficiency.

    PMID:31440263 was already cached from the C2 entry and had not been cited here. One snippet begins mid-sentence because the PDF extraction splits the preceding word as 'tota l'; it is cut before the corruption rather than repaired inside a quotation. 41/41 snippets verify.

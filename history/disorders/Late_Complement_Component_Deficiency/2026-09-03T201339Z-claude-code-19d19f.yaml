  summary: Bind subtype_term on the C5/C6/C7/C9 subtypes; C5 deficiency resolved as
    SUBTYPE
  details: |
    Resolved claim #10777 (complement component 5 deficiency, MONDO:0012295) as a
    SUBTYPE of the existing umbrella entry rather than a new standalone disorder file.

    Decision. The umbrella Late_Complement_Component_Deficiency entry (MONDO:0015700)
    already carries C5 Deficiency in its has_subtypes block, and C5 deficiency shares
    that entry's pathograph end to end: biallelic loss-of-function in a terminal
    component -> failure of sequential C5b-9 assembly -> no membrane attack complex ->
    loss of serum bactericidal activity against Neisseria -> recurrent invasive
    meningococcal and disseminated gonococcal infection. MONDO:0012295 is a direct
    child of MONDO:0015700. The one mechanism genuinely specific to C5 -- loss of the
    C5a anaphylatoxin, which C6-C9 deficiencies retain because their block is
    downstream of C5 cleavage -- is a single node's worth of difference and does not
    constitute a separate conserved pathograph in the sense of #8727. A standalone
    entry would therefore have duplicated the umbrella. This follows #10610
    (oculocutaneous albinism) and #10424 (VWM5) rather than #10260 (cblA), where the
    standalone call rested on a distinct upstream mechanism.

    What was bound. None of the five terminal-component subtypes carried a
    subtype_term, so tidy-stubs and the MONDO coverage index saw no coverage for any
    of them. Rather than binding only the subtype with a stub, all four subtypes that
    have a single MONDO leaf class were bound: C5 MONDO:0012295, C6 MONDO:0012908,
    C7 MONDO:0012412, C9 MONDO:0013445. Each CURIE was resolved through the OLS API
    (ontologies/mondo/terms), its canonical label copied from the response, and its
    is_obsolete flag and hierarchicalParents checked; all four are direct children of
    MONDO:0015700.

    C8. MONDO has no single 'complement component 8 deficiency' class. It splits the
    concept by which chain of the C8 heterotrimer is lost -- MONDO:0013422 (type I,
    C8A/C8G alpha-gamma, OMIM 613790) and MONDO:0013421 (type II, C8B beta,
    OMIM 613789) -- whereas this subtype spans both chains. Binding it to either leaf
    alone would have misstated its scope, so its subtype_term is deliberately absent
    and a review_notes records that. Both leaf classes are declared instead as
    skos:narrowMatch entries in a new top-level mappings block, following the
    Loeys-Dietz LDS1/LDS2 precedent (#8866, PR #9523); subtype-level mappings would
    not have worked, because iter_covered_mondo_ids reads mondo_mappings only at the
    disease level.

    Not changed. No other part of the umbrella entry was touched -- no new evidence,
    phenotypes, treatments, or pathophysiology nodes. There are no C6/C7/C8/C9 stubs
    in the queue, so this retires exactly one stub
    (stubs/Complement_Component_5_Deficiency.yaml) while closing the coverage gap for
    all five terminal components.

    Validation. just validate, just validate-terms, just validate-stubs,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-stubs and
    validate-history all pass; reference validation reports 38/38 snippets verified.
    Term-cache rows for the six new MONDO CURIEs were derived by just validate-terms
    and normalized with just normalize-cache -- none were hand-written.

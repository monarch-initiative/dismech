  summary: 'Create: Staphylococcal Toxic Shock Syndrome'
  details: |
    Created a standalone Staphylococcal Toxic Shock Syndrome child entry from research/Staphylococcal_Toxic_Shock_Syndrome-deep-research-openscientist.md. Curated the toxigenic Staphylococcus aureus agent, menstrual-TSS incidence, low/absent anti-TSST-1 antibody susceptibility, the staphylococcal superantigen to MHC-II/TCR to T-cell to cytokine-storm cascade, endothelial capillary leak and shock, TSST-1 vaccine trial metadata, HLA-DRB1/HLA-DQB1 susceptibility modifiers, CDC case-definition phenotypes, culture-based diagnosis, source control, bactericidal anti-staphylococcal therapy, and adjunctive clindamycin/linezolid toxin-suppression therapy. Avoided OpenScientist leads that were extrapolated primarily from streptococcal TSS or carried bad provider-suggested terms such as CHEBI:63591 for linezolid.

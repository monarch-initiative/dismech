  summary: 'Create: MOS-related Oocyte Zygote Embryo Maturation Arrest'
  details: |
    New entry for MONDO:0957278 (MOS, hgnc:7199), deciding the stub's
    entry_type as DISEASE: a single-gene leaf term (no MONDO descendants)
    with one conserved mechanism, MOS loss of function inactivating the
    oocyte MEK-ERK1/2 cascade. Curated from the five patient reports
    (PMID:34779126, 34997960, 35670744, 36403623, 42109071), the 2021
    commentary (PMID:34806827), and the two 1994 Mos-null mouse papers
    (PMID:8015609, 8015610).

    The pathograph runs from the loss-of-function trigger to ERK1/2
    inactivation, which branches to failed metaphase II arrest
    (parthenogenetic activation), cortical actin and spindle defects (large
    first polar body, and embryo fragmentation as an authors' hypothesis),
    and impaired maternal mRNA clearance leading to mitochondrial
    dysfunction (embryo arrest, indirect). Mitochondrial dysfunction is
    shown only in ERK-inhibited human oocytes and Erk1/2-knockout mouse
    oocytes, and is described that way.

    HPO has no term for embryo fragmentation, large polar body, or
    parthenogenetic activation; each is bound to its HP parent, with the
    OLS searches recorded in the phenotype description. Mos-null ovarian
    teratoma is mentioned in notes but not listed as a phenotype, because no
    affected woman has one.

    Validated with just validate, count-verified-snippets (39/39),
    validate-terms, and the whole-repo check-* gates.

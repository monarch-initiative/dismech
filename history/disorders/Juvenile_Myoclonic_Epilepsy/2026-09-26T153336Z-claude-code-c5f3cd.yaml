  summary: 'Weekly compliance: evidence on causal edges'
  details: |
    Added exact-quote evidence to all six pathophysiology downstream causal edges, which previously carried none. Genetic susceptibility to impaired GABAergic inhibition: GABRA1 A322D reduces GABA-activated currents in vitro (PMID:11992121). Genetic susceptibility to EFHC1 dysregulation: JME EFHC1 mutations reverse R-type Ca2+ current enhancement (PMID:15258581). Impaired inhibition to hyperexcitability: review of paired-pulse TMS showing defective GABA-A intracortical inhibition (PMID:23756477, review synthesis) and Gabra1 heterozygous mice with EEG discharges (PMID:22812724). EFHC1 dysregulation to hyperexcitability: reduced PTZ seizure threshold in Efhc1-deficient mice (PMID:19147686). Hyperexcitability to polyspike-wave discharges: EEG-fMRI thalamocortical activation in a JME patient (PMID:17899736) and in an IGE cohort (PMID:16217042). Discharges to seizures: myoclonic jerks accompany generalized polyspike-wave discharges (PMID:23756477). Explanations record caveats (model-organism or in vitro data, single-patient or IGE-wide cohorts, review synthesis). No edge left unsupported.

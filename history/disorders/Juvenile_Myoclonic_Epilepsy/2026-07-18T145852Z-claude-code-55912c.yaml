  summary: 'Create: Juvenile Myoclonic Epilepsy'
  details: |
    De-novo curation of juvenile myoclonic epilepsy (JME, MONDO:0009696), the most common genetic generalized epilepsy and a pediatric/adolescent-epilepsy gap entry. Granular unbundled pathophysiology: genetic susceptibility (GABRA1/GABRD, EFHC1, CACNB4) -> impaired GABAergic cortical inhibition + EFHC1-related neuronal dysregulation (R-type Ca) -> cortical/thalamocortical (motor-system) hyperexcitability (conforms epilepsy module) -> generalized polyspike-wave -> myoclonic jerks on awakening + GTCS + absence (conforms). Evidence: Cossette GABRA1 (PMID:11992121, GABA current LoF + JME family), Suzuki EFHC1 (PMID:15258581, R-type Ca + cosegregation), ACMG reanalysis (PMID:27467453), Norway prevalence (PMID:27861775), comparative-effectiveness (PMID:31440723), and JME RCT (PMID:35974938 levetiracetam vs valproate). Three discussions: valproate-vs-alternatives in women (KNOWLEDGE_GAP), lifelong-vs-remission/withdrawal (KNOWLEDGE_GAP), EFHC1 mechanism/model fidelity (HUMAN_MODEL_MISMATCH). claude_code deep research used as leads; NEC preflight cleared (GABRA1/EFHC1/CACNB4, OMIM #254770, distinct from infantile/adult ME). All snippets verified exact; schema + term validation pass.

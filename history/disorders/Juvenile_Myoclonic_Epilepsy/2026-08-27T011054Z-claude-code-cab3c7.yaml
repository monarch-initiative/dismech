  summary: Add phenotype evidence to juvenile myoclonic epilepsy
  details: |
    Weekly compliance sweep. All 5 phenotypes had HPO bindings but no evidence (phenotypes[].evidence 0/5). Added 11 evidence items citing PMID:23756476 (chronodependency and provocative factors in JME), PMID:27082040 (modern management of JME), PMID:18539564 (photosensitivity across 566 paediatric epilepsy patients), the already-cited PMID:35503716 (ILAE IGE position statement), and three rows from the cached ORPHA:307 structured record for Orphanet frequency bands. Also corrected the Typical Absence Seizures description, which claimed roughly a third of patients; Orphanet places absences in the occasional band of 5-29 percent and the cited review calls them less frequent than the other seizure types, so the description now says a minority. Left the Myoclonic Jerks on Awakening binding on HP:0002123 Generalized myoclonic seizure rather than HP:0007000 Morning myoclonic jerks: HP:0007000 captures the timing but sits under Myoclonus rather than Seizure, and the node is explicitly a seizure type. Verified with just validate, just validate-terms, just validate-disorders, and just count-verified-snippets (22/22 verified).

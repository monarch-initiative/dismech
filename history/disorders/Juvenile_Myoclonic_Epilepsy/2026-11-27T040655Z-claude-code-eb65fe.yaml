  details: |
    Split CACNB4 out of the EFHC1 node into a new MOLECULAR node, CACNB4 Calcium Channel Beta-4 Subunit Dysfunction, carrying the CACNB4 gene, GO:0005246 and the PMID:10762541 in-vitro item, with an incoming edge from Genetic Susceptibility to JME and an outgoing edge to Cortical and Thalamocortical Hyperexcitability; the EFHC1 node description now covers EFHC1 only. Marked the GABRD genetic evidence (PMID:15115768) directness INDIRECT and stated that its cohort was GEFS+ and general-population alleles, not JME. Added a Sleep Deprivation environmental entry bound to XCO:0001069 sleep restriction (ECTO searches for sleep, sleep deprivation and deprivation returned no exposure term) with a TRIGGERS link to Myoclonic and Generalized Seizures, cited to PMID:22875125 and PMID:23756476. Cited the 30% focal EEG figure to PMID:22875125. Removed the unsourced statement that CACNB4 monogenic causality was disputed and the unsourced claim that lamotrigine aggravates myoclonus. Corrected the levetiracetam SV2A mechanism text. Added quote_role REVIEW_SYNTHESIS to evidence citing the reviews PMID:22875125 and PMID:27082040.

  summary: Re-curate evidence against collagenous-sprue-specific literature (#10630)
  details: |
    Full re-curation of the evidence layer in response to issue #10630, which reported that only 9 of 35 evidence items substantively supported the claim they were attached to. The remaining items quoted real papers about collagenous gastritis (PMID:40911031), collagenous colitis (PMID:37554741), microscopic colitis (DOI:10.1093/ecco-jcc/jjab123 = PMID:34272945) or ARB-induced gastritis (PMID:35945664) and asserted the finding for collagenous sprue. No snippet was fabricated; the failure was snippet-to-claim relevance reached through sibling diseases.

    New collagenous-sprue-specific sources fetched with 'just fetch-reference' and cached: PMID:41854086 (2026 five-decade systematic review, 99 pooled patients), PMID:27620860 (21-patient CS vs celiac vs collagenous colitis comparison), PMID:27486523 (four-patient thioguanine series, full text), PMID:19641452 (12-case clinicopathologic study), PMID:21631278, PMID:21523258, PMID:20082473 (CS reviews), PMID:26997446 (olmesartan sprue-like enteropathy systematic review). Reference-list-only additions: PMID:22728033, PMID:19764099, PMID:25514205.

    Changes: (1) every evidence item now carries evidence_source, and directness and quote_role where assessed; (2) all six DOI:10.1093/ecco-jcc/jjab123 items and the PMID:34272945 duplicate of that same microscopic colitis review were removed, so the split between a gate-covered PMID form and a skip_prefixes DOI form no longer exists; (3) PMID:40911031 (collagenous gastritis) is gone entirely; (4) five gene records asserting directional molecular claims with no molecular evidence (TGFB1, MMP1, MMP9, TIMP1, TJP1) were removed and the open question recorded as the fibrogenic_mediators_uncharacterized KNOWLEDGE_GAP discussion; (5) HLA-DQA1 was recast with both a SUPPORT item (the celiac association) and two REFUTE items (uniformly HLA-DQ2/DQ8-negative CS patients), plus an hla_association_is_inherited_from_celiac CONTROVERSY discussion; (6) the Pulmonary hemosiderosis differential was removed as a mistaken import, with the reasoning kept in a RESOLVED CURATION_TODO discussion so the concept is not re-nominated; (7) the 'Epithelial barrier dysfunction and tight junction disruption' pathophysiology node was renamed 'Epithelial detachment and villous atrophy' because no CS study examines tight junctions; (8) a Serum iron biochemical record whose quote reported neither iron nor a deficiency was replaced by Serum potassium, which the pooled series measures; (9) the 'Proton Pump Inhibitors and NSAIDs' environmental record became 'NSAIDs and clofazimine' — PPIs are described in the same literature as an attempted treatment, not a trigger; (10) a Gluten-free diet treatment was added; (11) the references: list was trimmed from seven entries, two of which duplicated cited evidence and one of which was a general gut-fibrosis review, to five CS-specific PMIDs.

    One sibling-disease citation is deliberately retained: PMID:35945664 on medication withdrawal, graded INDIRECT, with the gastric-versus-duodenal limitation stated in its explanation, because 11 of 13 patients in that cohort had duodenal involvement including collagenous sprue.

    Validation: just validate-disorders passed; 63/63 snippets verified against the local cache; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms (offline and --resolve), check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean with no new baseline entries.

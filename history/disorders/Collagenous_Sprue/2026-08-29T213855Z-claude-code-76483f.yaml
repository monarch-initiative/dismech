    # Evidence review — Collagenous_Sprue

    File: `kb/disorders/Collagenous_Sprue.yaml` (797 lines)

    ## Stats
    - Evidence items checked: 35
    - References read (full cache bodies): 10 (DOI:10.1093/ecco-jcc/jjab123, PMID:34272945, PMID:37070112, PMID:37554741, PMID:40911031, PMID:39606500, PMID:41341547, PMID:19855376, PMID:35945664, PMID:39046809)
    - Verified clean: 9 of 35 (every snippet is an exact substring of its cache, but only 9 substantively support the specific claim they are attached to; 6 items cite a `DOI:` reference and are therefore never snippet-checked by CI)
    - Edits made: none — the defects here are not minimal-fix shaped (see Fix-policy note)

    ## Findings

    1. **Wrong-disease evidence throughout: PMID:40911031 is a collagenous *gastritis* review** (133 CG patients, stomach), cited 6 times as if it reported collagenous sprue. Affected: `phenotypes#Abdominal pain` (L193-199), `phenotypes#Anemia` (L261-267), `biochemical#Hemoglobin/Hematocrit` (L311-317), `genetic#HLA-DQA1` (L352-359), `genetic#TIMP1` (L430-437), `treatments#Anti-TNF-α Therapy` (L555-561). The recurring snippet "The most common presenting symptoms were abdominal pain and chronic anaemia" is the CG cohort's presentation, but three of the explanations assert it "in collagenous sprue". Severity: DEFECT (Named Entity Confusion). ACTION: reported only — the cache contains no sentence about sprue frequencies, so no same-source substitution exists; these need re-sourcing to a collagenous-sprue series (e.g. PMID:19855376, already in the file) or removal.

    2. **`treatments#Anti-TNF-α Therapy` (L555-561) has no treatment evidence at all.** The snippet is the abdominal-pain/anaemia sentence from the CG review; nothing in PMID:40911031 addresses infliximab or any anti-TNF agent, and the explanation ("TNF-α inhibitors target systemic inflammation characteristic of collagenous disorders") is the curator's reasoning, not the source's. Severity: DEFECT. ACTION: reported only — needs a real citation or the treatment should be demoted to an unevidenced description.

    3. **`genetic#TIMP1` (L430-437), `genetic#MMP1` (L396-402), `genetic#MMP9` (L412-419), `genetic#TJP1` (L448-455): four molecular claims, zero molecular evidence.** The snippets are histology sentences — collagen band thickness in CG (PMID:40911031), "Glandular atrophy, intra-epithelial lymphocytosis and/or subepithelial collagen thickening were also present in some cases", "Duodenal involvement... was identified in 11 of 13 cases", "Gastric biopsies commonly showed a full-thickness active chronic gastritis with surface epithelial injury" (all PMID:35945664, an ARB-induced *gastritis* case series). None mentions TIMP1, MMP1, MMP9, TJP1/ZO-1, or any expression or activity measurement; the explanations assert the molecular mechanism and then present the histology as its confirmation. Severity: DEFECT (claim far stronger than quote; the four gene entries are effectively unevidenced). ACTION: reported only — no substitute quote exists in either cache; these need genuine molecular references or removal of the gene entries.

    4. **`genetic#HLA-DQA1` first item (L352-359), PMID:40911031.** Snippet "Key gaps in pathogenesis, including the roles of environmental and genetic factors, are also reviewed" is a review-structure fragment that names no gene, no haplotype and no disease association, graded `SUPPORT` for an HLA-DQ2/DQ8 susceptibility claim. Severity: DEFECT (vague fragment used as a finding). ACTION: reported only. The second item on the same gene (L360-367, PMID:19855376, "Seventeen (89%) had celiac disease and two had unclassified sprue") is real evidence for the celiac association, though it evidences celiac comorbidity rather than an HLA genotype per se.

    5. **`treatments#Corticosteroids (Budesonide)` (L492-499), DOI:10.1093/ecco-jcc/jjab123.** The snippet is the microscopic-colitis pathogenesis conclusion; it says nothing about budesonide, corticosteroids, or any treatment, and the paper is about the colon, not the small bowel. Severity: DEFECT. ACTION: reported only — budesonide as first-line therapy for collagenous sprue is a well-supported clinical claim that simply needs a real citation.

    6. **`treatments#Thiopurines (Azathioprine/6-Thioguanine)` (L532-538), PMID:39606500.** Snippet "This case report highlights the diagnostic challenges and clinical features of CS in a 74-year-old woman" — the cited case is an olmesartan-withdrawal case, and the abstract does not mention thiopurines. Severity: DEFECT (snippet supports nothing about the treatment). ACTION: reported only.

    7. **`biochemical#Tissue transglutaminase (tTG) antibodies` = `Negative` (L334-341), PMID:41341547.** Snippet is about villous atrophy not responding to gluten exclusion; it does not report serology, so it cannot support tTG negativity. Severity: DEFECT. ACTION: reported only.

    8. **`phenotypes#Hypoalbuminemia` (L279-286), PMID:41341547.** The snippet is the paper's definition of collagenous sprue (villous atrophy + thick subepithelial collagen band); albumin, protein loss and hypoalbuminemia are absent from it. Severity: DEFECT. ACTION: reported only.

    9. **`biochemical#Serum iron` = `Decreased` (L322-328), PMID:37070112.** Snippet "Collagenous sprue is a rare and unrecognized cause of diarrhea and weight loss" says nothing about iron. Severity: DEFECT. Same pattern in **`treatments#Nutritional support`** (L630-637): "Treatment should be initiated as soon as the diagnosis is established, so as to prevent the progression of fibrosis" is a general treat-early statement, not support for micronutrient repletion. ACTION: reported only.

    10. **`phenotypes#Protein-losing enteropathy` (L232-240), PMID:39606500.** The quote covers malabsorption, weight loss and nutrient deficiencies; protein-losing enteropathy is not stated. Severity: MINOR-to-DEFECT (overreach). ACTION: reported only.

    11. **`differential_diagnoses#Pulmonary hemosiderosis` (L677-704), PMID:37554741.** Both the differential itself and its evidence are unsound: the snippet ("a close linkage with other forms of microscopic colitis and its association with celiac and other immune-mediated diseases") concerns collagenous colitis, and nothing in the source mentions pulmonary hemosiderosis. The entry's own `description` concedes the two diseases share no presenting features, which makes it a poor differential for a malabsorptive small-bowel disorder. Severity: DEFECT (content-level; likely an artifact of confusing the celiac–idiopathic pulmonary hemosiderosis "Lane-Hamilton" association with sprue). ACTION: reported only — removing a differential-diagnosis block is a curation decision, not an evidence fix.

    12. **`pathophysiology` nodes rest on adjacent diseases.** Node 1 "Mucosal immune activation with intraepithelial lymphocytosis" (L66-74) is supported only by the microscopic-colitis systematic review; node 2 "Epithelial barrier dysfunction and tight junction disruption" (L94-100) is supported by a collagen-deposition sentence that says nothing about tight junctions or ZO-1; node 3 "Subepithelial collagen deposition" (L138-144) quotes a collagenous *colitis* description. Node 3 is the closest to defensible (the explanation says "collagenous diseases including sprue"), and PMID:37070112 in the same file carries a directly on-point sentence ("The histological features are fundamentally characterized by the deposition of collagen beneath the basement membrane of gut mucosa") that would serve node 3 better than the colitis quote. Severity: DEFECT for nodes 1-2, MINOR for node 3. ACTION: reported only.

    13. **No `evidence_source` on any of the 35 evidence items.** The field is optional and defaults to HUMAN_CLINICAL, but the sources here are a mix of case reports, retrospective series and systematic reviews, and the field is populated on both sibling entries reviewed in this batch. Severity: MINOR (completeness). ACTION: reported only — bulk-adding 35 fields is outside the conservative fix policy.

    14. **Same paper cited under two identifiers.** DOI:10.1093/ecco-jcc/jjab123 (6 items) and PMID:34272945 (1 item, `biochemical#Serum albumin`, L298-305) are the same Zabana microscopic-colitis systematic review. The `DOI:` form is in `skip_prefixes`, so those 6 items are never snippet-checked by `validate-references`/`count-verified-snippets` (I verified all 6 by hand against `references_cache/DOI_10.1093_ecco-jcc_jjab123.md` — the strings do match). Severity: MINOR. ACTION: reported only — consolidating on the PMID would put those six items under CI's snippet check. Also note `DOI:10.1093/ecco-jcc/jjab123` is cited in evidence but absent from the entry's top-level `references:` list, while all seven entries that *are* in that list are cited by no evidence item.

    15. **`genetic#TGFB1` (L378-385), DOI:10.1093/ecco-jcc/jjab123.** Snippet "extracellular matrix alterations, all contributing by varied mechanisms to watery diarrhoea" is a clause naming ECM alterations in microscopic colitis; TGF-β is not mentioned. Severity: DEFECT. ACTION: reported only.

    Correctly evidenced items, for balance: `environmental#Medications (Angiotensin II Receptor Blockers)` (L461-469, PMID:39606500 — olmesartan cessation resolved symptoms); `treatments#Medication discontinuation` (L609-617, PMID:35945664 — "symptomatic improvement occurred in all 11 cases... histological resolution in five of eight"); `treatments#Calcineurin Inhibitors (Tacrolimus)` (L582-591, PMID:39046809 — an on-point collagenous sprue tacrolimus case); `differential_diagnoses#Celiac disease` (L669-676) and `#Refractory celiac disease` (L755-771, PMID:19855376 — 89% celiac, 53% refractory); `environmental#Medications (PPIs and NSAIDs)` (L473-481), which is honestly graded `PARTIAL` given the snippet is about ARBs; and `phenotypes#Chronic watery diarrhea` (L154-161), where the microscopic-colitis quote at least ends on "watery diarrhoea".

    ## Fix-policy note
    I made no edits to this file. The conservative policy allows substituting a better exact quote **from the same cached reference** — but in every defect above the cited paper contains no sentence that supports the claim, because the paper is about a different disease (collagenous gastritis, collagenous colitis, microscopic colitis, ARB-induced gastritis) or a different topic (histology vs. the asserted molecular mechanism). Repairing these requires new references, which the policy excludes, and re-grading ten `SUPPORT` items to `NO_EVIDENCE` would preserve the appearance of citation without the substance. This entry needs re-curation rather than patching.

    ## Sections reviewed
    pathophysiology, phenotypes, biochemical, genetic, environmental, treatments, differential_diagnoses, references, datasets (empty), has_subtypes (empty)

    ## Verdict
    The weakest of the three entries by a wide margin: roughly three-quarters of its evidence items cite a paper about a neighbouring collagenous or microscopic disorder (collagenous gastritis, collagenous colitis, microscopic colitis, ARB-induced gastritis) and then assert the finding for collagenous sprue, and the five molecular gene entries (TGFB1, MMP1, MMP9, TIMP1, TJP1) are supported entirely by histology sentences that mention none of those genes. Every snippet is a genuine substring of a genuine paper — this is not fabrication — but snippet-to-claim relevance has broken down systematically, and six of the items sit behind a `DOI:` prefix that CI never snippet-checks. The entry should be re-curated against collagenous-sprue-specific literature (PMID:19855376 and PMID:37070112, already present, are the honest core) before it is treated as a reliable record.

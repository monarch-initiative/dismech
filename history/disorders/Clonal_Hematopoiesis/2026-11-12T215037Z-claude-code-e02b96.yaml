  details: |
    Answers review item 1 on PR 16993. The bundled node 'Somatic Driver Mutation in a Hematopoietic Stem Cell' no longer binds genes: DNMT3A, TET2, ASXL1, SRSF2 and SF3B1 share no single molecular function and stay on their genetic rows with variant_origin SOMATIC. The five gene-activity baseline rows added in the previous round are removed. TET2 is wired through a new node 'Loss of TET2 Methylcytosine Dioxygenase Activity' (GO:0070579, DECREASED), which leads to 'TET2-Deficient Macrophage Inflammatory Gene Expression' (CL:0000235; GO:0032611 and GO:0032602 INCREASED) and on to Coronary artery atherosclerosis, using mouse evidence from the cached full text of PMID:28636844 graded MODEL_ORGANISM. Ischemic stroke (HP:0002140) added as a phenotype with an association edge from clonal expansion, from PMID:25426837. Deep-research input, a diagnosis section and the MDS progression link (review item 2) remain open for the author; no deep-research provider was available in this run. Validated with just validate (42/42 snippets), check-gene-activity-grounding, check-causal-targets, check-entity-refs, check-logical-rules and check-name-collisions.

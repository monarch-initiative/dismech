  summary: 'Work in an OpenScientist deep-research pass: NLRP3 mechanism, heart failure,
    stroke, JAK2/TP53/PPM1D, exposures and management'
  details: |
    Added the OpenScientist deep-research report research/Clonal_Hematopoiesis-deep-research-openscientist.md (36 references, all resolved, none flagged as confabulated) and worked its central findings into the entry. Every new claim cites the primary paper or review with a snippet from the cached abstract, not the report.

    Pathophysiology: new node NLRP3 Inflammasome Activation in TET2-Deficient Macrophages (GO:0044546, macrophage). It is linked from Loss of TET2 Methylcytosine Dioxygenase Activity through Dusp10 promoter methylation and JNK1 (PMID:37781816, in vitro), with edges to coronary atherosclerosis (BRCC3 inhibition reverses Tet2 CH atherosclerosis in mice) and to heart failure (hematopoietic Tet2 loss worsens heart failure in two mouse models and an NLRP3 inhibitor removes the difference, PMID:29471939). Mouse edges are marked INDIRECT.

    Phenotypes: Heart failure (HP:0001635) from the human association stated in PMID:40702883; ischemic stroke gains the 800,160-person meta-analysis (PMID:41948817).

    Genetics: DNMT3A gains its weaker stroke association and a review statement that its cardiovascular associations are more modest than those of TET2. The report gave no primary source for a DNMT3A-specific mechanism, so none is curated. New JAK2, TP53 and PPM1D rows.

    Environmental: tobacco smoking (ECTO:6000029, PMID:42570703) and cytotoxic chemotherapy (ECTO:9001737, PMID:41508691), both PREDISPOSES because the sources report association or selection, not a mechanism.

    Treatments: surveillance and comorbidity management (no approved CH therapy, PMID:42735000), left without an NCIT term because NCIT:C15719 Surveillance is outside the treatment-action enum; colchicine and canakinumab recorded as investigational from exploratory LoDoCo2 and CANTOS analyses.

    The report suggested NCIT CURIEs for statin, canakinumab, ascorbic acid and colchicine that name unrelated concepts (NCIT:C1947, NCIT:C82426, NCIT:C1697, NCIT:C375). None was used; every term here was looked up in the term caches or OLS.

  details: |
    Rebound Serious bacterial infection from HP:5210000 Unusual bacterial infection to HP:0032169 Severe infection, since the outcome is ordinary sepsis and bacterial pneumonia from common organisms. Removed GO:0002244 from Altered Hematopoietic Progenitor Signalling here and in com_Clonal_Hematopoiesis__Sepsis, because the source measured plasma FLT3LG/FLT3 abundance and not progenitor differentiation; OLS GO searches for 'FLT3 signaling pathway', 'FLT3' and 'fms-like tyrosine kinase 3 signaling' returned no FLT3 signalling process, recorded in node notes. Added direct snippets from PMID:42982834 for NRAS G12 (cytopenia-excluded HR 3.60) and TET2 co-mutation with SRSF2 P95. Grandfathered the five driver genes on the multi-gene Somatic Driver Mutation node in tests/gene_activity_grounding_baseline.txt, since DNMT3A, TET2, ASXL1, SRSF2 and SF3B1 share no single molecular function. Deep-research input and the wider CH content (inflammatory mechanism, CHIP diagnosis, MDS link) remain open for the author. Validated with just validate, validate-comorbidity, count-verified-snippets and check_gene_activity_grounding.

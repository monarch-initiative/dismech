  summary: Add diagnosis, MDS differential, progression and mortality
  details: |
    Review round 3 on PR #16993 (shepherd). Addressed the reviewer's content gaps that do not depend on a deep-research report. Added a diagnosis section giving the CHIP working definition (malignancy-associated somatic mutation, VAF >=2% in peripheral blood, no other criteria for a hematological malignancy) quoted from Steensma et al. 2015 (PMID:25931582, fetched with just fetch-reference, full text). Added a myelodysplastic syndrome differential (MONDO:0018881) separating CHIP, CCUS and MDS by cytopenia and dysplasia. Added a progression section: 0.5-1% per year progression to hematological neoplasia (PMID:25931582) and all-cause mortality HR 1.4 with cardiovascular rather than cancer deaths (PMID:25426837, already cached). The Hematological neoplasm phenotype description now names the Myelodysplastic_Syndrome entry and CCUS. Validated with just validate (50/50 snippets), check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys and check-block-scalar-comments. Still open: no deep-research report; that needs the author or a maintainer.

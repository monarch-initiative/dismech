  summary: 'Create: Clonal Hematopoiesis'
  details: |
    New entry anchored on MONDO:0100542, with CHIP (MONDO:0100543) and age-related CH (MONDO:0100544) as subtypes. Motivated by Fewings et al. 2026 (PMID:42982834), which reports a gene- and clone-size-dependent risk of serious bacterial infection (sepsis, bacterial pneumonia) in 590,537 biobank participants. Pathograph: somatic driver mutation in an HSC -> clonal expansion -> hematological neoplasm, coronary artery atherosclerosis, serious bacterial infection, and an altered progenitor-signalling node (FLT3/FLT3LG proteomics) carried under an EMERGING hypothesis group, because the source presents it as a correlate only. Per-gene and per-hotspot absolute infection risks are recorded on the genetic rows. Somatic mosaicism recorded with HP:0001442. Background prevalence and the coronary association cite Jaiswal 2014 (PMID:25426837); the selective-advantage edge cites Jaiswal 2017 (PMID:28636844). A KNOWLEDGE_GAP records that the infection mechanism is unknown and that the risk is bacterial-specific. Validated with just validate (33 snippets verified) and the offline entity, causal-target, coarse-phenotype, name-collision, enum, duplicate-key, block-scalar and logical-rule gates.

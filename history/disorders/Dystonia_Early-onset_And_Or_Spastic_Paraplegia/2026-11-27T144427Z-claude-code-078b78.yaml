  summary: 'Create: Dystonia, Early-Onset, and/or Spastic Paraplegia (ATP5MC3)'
  details: |
    New entry for MONDO:0859215 (OMIM 619681), the dominant disorder of ATP5MC3 (hgnc:843), one of three genes for ATP synthase subunit c; gene-family gap fill, replacing stubs/Dystonia_Early-onset_And_Or_Spastic_Paraplegia.yaml. Evidence: the founding family (PMID:34636445, abstract): p.Asn106Lys cosegregating with autosomal dominant spastic paraplegia or dystonia, a de novo carrier with upper-limb dystonia, impaired complex V activity, ATP generation and respiration in fibroblasts, and reduced mobility in Drosophila with orthologous mutations; three de novo patients including two further variants (p.Pro107Ala, p.Gly79Val) and functional data (PMID:34954817); onset-dependent phenotype and anticipation from the 2024 systematic review (PMID:39016153); c-ring function from PMID:24564666 and PMID:33917760. Molecular function GO:0015078 proton transmembrane transporter activity (the GO annotation for ATP5MC3); functional_impact_category UNKNOWN because the dominant mechanism is untested. relationship_type UNKNOWN: ClinGen rates ATP5MC3 Limited (AD) for the lumped mitochondrial disease term. Naming: the MONDO/OMIM label is broader than this single-gene entry but no gene-specific name is established, so the label is kept per design decision 18; reported as a candidate for the MONDO label-scope issue. The 2023 review PMID:37964479 was fetched but cached without content and is not cited. No GeneReviews chapter. Validation: linkml-validate, OLS term validation, reference validator (34 snippets, 0 issues), count-verified-snippets 34/34, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, list-gene-term-mismatches, check-genereviews and check-snippet-grading all passed.

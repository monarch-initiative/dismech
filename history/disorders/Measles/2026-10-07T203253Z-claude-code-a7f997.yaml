  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added three diagnosis rows (the entry had none): measles IgM bound to LOINC:21503-8 (method-less serum presence); measles RNA bound to LOINC:48508-6 (by NAA with probe detection, unspecified specimen; every measles RNA presence code in the Monarch KG is by NAA with probe detection); measles IgG on paired sera bound to LOINC:7962-4 (method-less quantitative serum code). Evidence from PMID:28412379 (WHO European laboratory review), PMID:21116802 (methods chapter), PMID:1551971 (Quebec epidemic IgM evaluation) and PMID:38065047 (Brazil outbreak surveillance). No reference_ranges: IgM and RNA results are qualitative and IgG seroconversion is a change between two results. The row records seroconversion only; PubMed searches for a fourfold or significant IgG rise criterion returned no source stating one.

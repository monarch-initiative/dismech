  summary: Fix SSPE phenotype/pathophysiology name collision flagged in review
  details: |
    Renamed the new SSPE phenotype node from "Subacute sclerosing panencephalitis (SSPE)" to "Subacute sclerosing panencephalitis" to remove an exact-name collision with the pre-existing pathophysiology node of the same name. build_causal_graph keys graph.nodes by exact name string and processes phenotypes after pathophysiology, so the identical name was silently overwriting the pathophysiology node (with its CL/UBERON annotations and evidence) in every derived graph artifact.

    Added a downstream edge from the pathophysiology node to the renamed phenotype node so the previously orphaned mechanism node is now connected to its phenotypic consequence. Dropped the now-redundant "Modeled mechanistically as the ... pathophysiology node" sentence from the phenotype description since the structural edge now expresses that link.

    Also sentence-cased the ADEM node name to match sibling phenotype naming conventions, per a non-blocking reviewer suggestion; confirmed no other section referenced the old name before renaming.

    This addresses the second CHANGES_REQUESTED review round on PR #9127 (tracker issue #6433), which itself was caused by an earlier reviewer suggestion to case-match the SSPE names -- that suggestion is what created the collision. Verified locally via build_causal_graph() that the pathophysiology and phenotype nodes are now two distinct nodes connected by an edge.

    Validation run: just validate kb/disorders/Measles.yaml (schema, terms, references all pass; 32/32 snippets verified against cached references), just check-not4curation, just check-duplicate-keys, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-environmental-evidence -- all pass with no new findings.

  summary: Drop unsupported frequency band from Pneumonia phenotype
  details: |
    Addressed item from issue #6433 section B (unsupported frequency bands).

    Removed frequency: OCCASIONAL from the Pneumonia phenotype. The backing
    snippet "Complications of measles affect most organ systems, with pneumonia
    accounting for most measles-associated morbidity and mortality" describes
    importance, not occurrence frequency. Per frequency evidence guidelines,
    "accounting for most morbidity" does not map to OCCASIONAL (5-29%); omit
    rather than fabricate justification.

  summary: 'Create: RD3-Related Retinopathy (LCA12)'
  details: |
    New gene-level entry for RD3-related retinopathy (MONDO:0700235), with Leber congenital amaurosis 12 (MONDO:0012525) as its only has_subtypes row. Deletes stubs/RD3-related_Retinopathy.yaml.

    Deep research: one OpenScientist report, research/RD3-Related_Retinopathy-deep-research-openscientist.md. Reference validation 22/22 resolved, 0 not found; term validation flagged only paraphrased labels and one obsolete NCIT treatment term (NCIT:C15368), none of which were used. just preflight-dr passed (RD3 mentioned 76 times). The report attributes PMID:30090012 to an RD3 case of maternal UPD6; that paper reports a TULP1 variant (RD3 is on chromosome 1q32.3), so the claim and its c.524dupC variant were not used. The report's suggested Deeply set eye phenotype (HP:0000490) has no RD3 source and was not used, and its statement that the ERG is extinguished in RD3 patients is uncited; no cited source reports patient ERG results, so no ERG phenotype is recorded.

    Pathograph: two branches from RD3 loss of function. (1) Failure of guanylyl cyclase export from the ER to the outer segment, then deficient cGMP synthesis, then failure of rod and cone phototransduction (Azadi 2010, Molday 2013, Olshevskaya 2026). (2) Loss of RD3 inhibition of the cyclase in the inner segment, then aberrant GCAP-stimulated cyclase activity, then ER stress and mitochondrial swelling, then rapid photoreceptor degeneration (Peshenko 2011, Dizhoor 2019 and 2021, Plana-Bonamaiso 2020). Low intracellular calcium links the two. The degenerative branch is rd3-mouse evidence and is labelled as such.

    Phenotypes come from Perrault 2013 (11 patients), Preising 2012 and Dikkaya 2020; the GeneReviews LCA/EOSRD overview (PMID:30285347) is tagged but its abstract lists no clinical findings. Frequencies were set from the per-patient Table 2 of Perrault 2013 rather than its summary sentence, which calls several findings consistent that the table records in only 2 of 11 patients (eye poking, absent pursuit); those two carry no frequency. Also recorded: ClinGen Definitive (CGGV assertion 67c894eb, Retina GCEP), the p.Arg38Ter founder allele, a single RP family with homozygous p.Lys87Glu (PMID:24516651, in-silico support only), rd3 mouse and rcd2 collie models, preclinical AAV gene augmentation, genetic counselling, and molecular diagnosis guidance.

    An independent pre-PR review found an edge citing a sentence about degeneration rather than cGMP, a REFUTE item pointing at the wrong claim, a visual-acuity binding to HP:0001141 where the cited acuities fall in HP:0032123 Ultra-low vision, overstated frequencies, and an unsupported rods-and-cones-together claim. All were corrected before the PR.

    Validation: just validate passes (78/78 snippets, terms, schema); check-entity-refs, check-causal-targets, check-gene-validity, check-snippet-length/grading/title, check-coarse-phenotypes, check-genereviews (TAGGED) pass. 14 of 19 phenotypes are causally connected.

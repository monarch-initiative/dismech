  details: |
    Reviewed the 2026 openscientist hypothesis-search report for canonical_autoimmune_thyrocyte_destruction_model and wrote the assessment sidecar kb/hypotheses/Hashimotos_Thyroiditis/canonical_autoimmune_thyrocyte_destruction_model/assessments/openscientist-assessment-by-claude-opus-5.yaml (verdict SUPPORTED, 15 assessed claims, plus a narrative .md). None of the report's 41 PMIDs was previously cited in this entry; 16 were fetched and read against references_cache before use. Integrated: (1) two evidence items on the canonical mechanistic_hypotheses entry (PMID:41748903 418 independent GWAS signals in 81,718 autoimmune hypothyroidism cases; PMID:29931474 5.4821% variance explained by a seven-variable candidate-SNP model), substantiating a polygenicity qualification that the notes had asserted in prose only, with an explicit caveat that the two numbers are not one result; (2) a new pathophysiology node Th17/Treg Imbalance (CL:0000899, CL:0000815, GO:0072539 INCREASED, GO:0045066 DECREASED) with four evidence items from PMID:25771887 and PMID:41243116, an incoming edge from Loss of Immune Tolerance to Thyroid Antigens and an outgoing edge to Lymphocytic Infiltration; (3) a new pathophysiology node Cytokine-Sensitized Fas-Mediated Thyrocyte Apoptosis (CL:0002258, GO:0008625) with evidence from PMID:15563545 and PMID:11716038, edged in from Lymphocytic Infiltration and out to Autoimmune Thyroid Destruction; (4) two germinal-centre/RAG evidence items from PMID:11549579 plus GO:0002467 on Lymphocytic Infiltration; (5) one evidence item and a notes block on Autoimmune Thyroid Destruction recording PMID:37445704 together with that study's own conclusion that checkpoint-inhibitor thyroid disease has distinct pathways and upstream regulators, correcting the report's claim of validation via the exact canonical pathways; (6) a new discussions block (the entry had none) with five entries covering the tolerance-breaking initiating event, the seronegative effector mechanism, IgG4 thyroiditis entity status, sex-biased CXCL13-CXCR5 plasma B cell homing, and the absence of disease-modifying therapy. Deliberately not integrated: no status change (report recommends retaining CANONICAL); no has_subtypes for IgG4 or seronegative disease, since the proportions come from one surgical and one paediatric cohort and the entity question is what the discussions record; no gut-thyroid axis, NETosis, epigenetic-interface or SARS-CoV-2 node, all review-level or single-case in this run; no JAK inhibitor treatment entry (n=1, source claims only possible reversal), recorded as a lead inside the therapy knowledge gap; nothing from the undocumented GenCC/ClinGen negative. The report's proposed CURIEs were not used as given; every bound term was checked against this repository's caches. Checks run: validate-hypothesis-assessment (pass), count-verified-snippets 84/85 with the single skip a DOI prefix, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-length, check-reference-titles all clean for this file.

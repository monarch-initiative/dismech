  summary: Ground deficiency intermediates to HP terms; make viral factor HCV-specific
  details: |
    Follow-up to the intermediate-node expansion, addressing curator review. (1) Selenium and vitamin D deficiencies are genuine phenotype/disease entities, so they are now grounded nodes: added phenotype 'Vitamin D Deficiency' (HP:0100512; MONDO:0100471 noted) and 'Selenium Deficiency' (HP:0033192), each category Nutritional, carrying association evidence and a sequelae edge into its mechanism pathophysiology node. Because the schema cannot bind HP/MONDO to a pathophysiology node, the grounded state lives in phenotypes while the GO/CHEBI mechanism stays a pathophysiology node. Renamed the environmental entries to the true exposures (Low Dietary Selenium Intake; Low Vitamin D Intake and Cutaneous Synthesis) and re-pointed them with environmental_effect TRIGGERS onto the deficiency phenotypes, so the exposure->state edge is a counted causal inlink and avoids a phenotype-connectivity regression. (2) The viral factor is now HCV-specific: environmental 'Hepatitis C Virus Infection' and pathophysiology 'Hepatitis C Virus-Associated Thyroid Immune Activation' (chronic HCV, MONDO:0005354 noted), with other candidate viruses (EBV, HTLV-1, parvovirus B19, enteroviruses, SARS-CoV-2) listed as unverified in notes rather than asserted. Reverse-causation (vitamin D) and IFN-confounding (HCV) caveats preserved. Validated: just validate passes (schema, terms including newly-cached HP:0033192, references); 65/66 snippets verified (1 DOI skipped); graph build reports 0 orphan targets.

  summary: 'Review: Hashimoto thyroiditis - truncated hypothesis snippet, unsupported
    frequency band, treatment annotation'
  details: |
    Manual claim-evidence review. Fixed: (1) the CANONICAL hypothesis's sole evidence item carried a truncated mid-sentence snippet ('...is generally characterized by the presence') that asserted nothing - restored the full sentence (already used verbatim elsewhere in the file) and downgraded SUPPORT to PARTIAL, since it evidences only the autoantibody/lymphocytic-infiltration core and not the Th1/Th17, CD8, tertiary-lymphoid-structure or susceptibility-locus claims; (2) the Depression phenotype asserted frequency: OCCASIONAL (5-29%) while its only citation lists depression among the 'most common presenting symptoms' - removed the band per the frequency-evidence guidelines and documented why; (3) Levothyroxine and Selenium Supplementation had no treatment_term or therapeutic_agent - added MAXO:0000284 + CHEBI:18332 and MAXO:0000088 + CHEBI:27568 respectively; (4) added HGNC gene_term bindings and relationship_type: SUSCEPTIBILITY to the CTLA4 and PTPN22 entries.
    Verified as correct, no change: the CCDC77 'Protective' and SLC45A3 'Risk Factor' directions match the NOD-mouse knockdown results in PMID:42283571.
    Remaining gaps not fixed: no prevalence block; HLA-DR3/DR4 entries have no gene_term (they are serotypes, not genes - would need HLA-DRB1 modelling).

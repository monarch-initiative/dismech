  summary: Rebind deficiency phenotypes to HP via direction-aware exporter
  details: |
    Follow-up enabled by a direction-aware export layer. The KGX phenotype_to_edge and HPOA hpoa_rows_for_disorder now detect an upstream risk-state phenotype (one carrying a sequelae edge into a pathophysiology node) and export it as a direction-neutral MONDO:0007699 biolink:associated_with HP:xxxx (KGX) or skip it from phenotype.hpoa (HPOA), instead of asserting disease has_phenotype (which would invert the curated causal direction). With that in place, restored the HP bindings the prior ai4c-reviewer fix had removed/worked-around: Selenium Deficiency rebound to HP:0033192 (was left ontology-unbound because MONDO has no human selenium-deficiency class), and Vitamin D Deficiency rebound from MONDO:0100471 to HP:0100512 (the MONDO workaround is superseded). Both deficiency nodes now carry a correct HP phenotype_term, so the dismech pathograph JSON emits meta.term_id for both and the Monarch app anchors both to their HP chip. Shared helper phenotype_is_upstream_risk_state added in export/utils.py; blast radius is exactly these two nodes KB-wide. Validated: just validate passes (65/66 snippets, 1 DOI skipped); 101 kgx+hpoa exporter tests pass including new direction-aware tests; end-to-end export check confirms associated_with (not has_phenotype) for both and no HPOA rows.

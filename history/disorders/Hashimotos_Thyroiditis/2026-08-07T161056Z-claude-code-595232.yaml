  summary: Separate the one mechanistic trigger from three susceptibility factors
  details: |
    Backfill for issue #8085. All four entries target the loss of immune tolerance node but only one earns TRIGGERS. Iodine excess is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES because its cited evidence names the intermediate: excess iodine raises thyroglobulin iodination and the more heavily iodinated protein is more immunogenic, which is why iodine supplementation programmes are followed by rising autoimmune thyroiditis. The other three are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES. Selenium deficiency is supported by seroconversion rates rather than by the selenoprotein-protection route it plausibly acts through. Viral infection rests on an association with chronic hepatitis C, confounded by interferon treatment being itself thyrotoxic, and the description records that. Vitamin D deficiency is the weakest, its cited finding being a cross-sectional comparison showing lower levels in people who already have the disease, which cannot be separated from chronic illness lowering vitamin D; the description states the reverse-causation problem explicitly. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 57 of 58 with 1 pre-existing DOI-prefix skip; integrity issue count unchanged from origin/main.

  summary: 'Augment: exosome-mediated immune dysregulation, diagnostics and therapeutic
    gap'
  details: |
    Added three evidence items from PMID:42631765 (Mol Biol Rep 2026 review) to existing pathophysiology nodes: exosomal HSP60 cross-reacting with TPO/TG onto Loss of Immune Tolerance to Thyroid Antigens; T-cell-derived miR-142-3p exosomes suppressing Treg function onto Th17/Treg Imbalance; and patient-derived exosomes activating dendritic cells via TLR2/3 onto NF-kappaB-IL-6 Signaling Pathway Activation. No new pathophysiology nodes.

    Review round 1 (PR #12110) findings addressed. Finding 1: the diagnostic and therapeutic half of the cited paper, named by issue #9956, had been dropped. Added a Circulating Exosomal Proteomic Signature biochemical entry (HGFL/FAK1/PTN12, framed as emerging, deliberately carrying no readouts and no biomarker_term because the source gives no assay, cut-off or replication cohort), and a KNOWLEDGE_GAP discussion gap_ht_exosome_release_inhibition_translation covering exosome-release inhibition (GW4869) and engineered MSC-derived exosomes. GW4869 is deliberately NOT curated as a treatment: it is a preclinical tool compound with no clinical indication and no NCIT clinical-intervention identity in this disease. Finding 2: this history record.

    Suggestions also taken. quote_role: REVIEW_SYNTHESIS added to all items quoting PMID:42631765, which is a Journal Article/Review synthesizing work it did not perform; evidence_source is unchanged and still grades the study type the quoted text describes. Added CL:0000451 dendritic cell to the NF-kappaB node cell_types, since the new evidence names dendritic cells as the NF-kappaB-activating cell. Reworded the NF-kappaB explanation, which had closed with Th17/Treg language describing a different node.

    Suggestion 6 (a standalone exosome-signalling pathophysiology node) deferred with rationale recorded in the new discussion's notes: the cited review is a single secondary source, and a discrete causal node should rest on the primary studies.

    Validation: just validate clean (schema, terms, references; 90/90 snippets verified, up from 88). check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms all OK.

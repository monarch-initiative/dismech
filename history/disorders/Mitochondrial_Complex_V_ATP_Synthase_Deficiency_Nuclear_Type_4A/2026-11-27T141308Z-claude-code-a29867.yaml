  summary: 'Create: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type
    4A (dominant ATP5F1A)'
  details: |
    New entry for MC5DN4A (MONDO:0957254, OMIM 620358), the dominant ATP5F1A (hgnc:823) disorder; gene-family gap fill for complex V, replacing stubs/Mitochondrial_Complex_V_ATP_Synthase_Deficiency_Nuclear_Type_4A.yaml. Kept separate from the recessive MC5DN4B (MONDO:0014091), with skos:relatedMatch mappings both ways. Evidence: recurrent de novo p.Arg207His with a remitting neonatal crisis (PMID:34483339, PMID:34954817) and its first inherited family with an asymptomatic mother (PMID:42520343, which also reviews the allelic series); six probands with de novo interface missense variants acting as dominant negatives in C. elegans and uncoupling OXPHOS in fibroblasts (PMID:40859057); a heterozygous frameshift with reduced mRNA and p.Gly418Arg in a hereditary spastic paraplegia-like presentation, mother to daughter (PMID:40276935, PMID:41743395, PMID:41053757); residual ATPase activity of dominant lines (PMID:41124875). Pathophysiology splits the lesion by variant class (DOMINANT_NEGATIVE interface missense; UNKNOWN for p.Arg207His and p.Gly418Arg; LOSS_OF_FUNCTION frameshift) because the papers disagree on haploinsufficiency (pLI 0.29 argument in PMID:40859057 versus the frameshift study); that disagreement is recorded as a KNOWLEDGE_GAP discussion. Features seen only in the 2026 family's children who also carry an NDUFA12 deletion are left out of phenotypes and described in notes. L-citrulline supplementation recorded as a treatment of the urea cycle intermediate depletion (PMID:42520343). relationship_type CAUSATIVE (many unrelated de novo cases, two segregating families, functional data); ClinGen has no ATP5F1A record. Validation: linkml-validate, OLS term validation, reference validator (63 snippets, 0 issues), count-verified-snippets 63/63, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, list-gene-term-mismatches, check-genereviews and check-snippet-grading all passed.

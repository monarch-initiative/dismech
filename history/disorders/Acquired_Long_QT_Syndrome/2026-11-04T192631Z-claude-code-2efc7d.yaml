  details: |
    De-novo curation of Acquired Long QT Syndrome (MONDO:1060292), the reversible drug/metabolic-induced ventricular repolarization disorder, curated distinct from Familial_Long_QT_Syndrome (which explicitly separates the acquired form). Deep research: openscientist (falcon unavailable - no EDISON/FUTUREHOUSE key; user chose openscientist fallback); report reference_validation 37/37 verified, confab 0.0, quotes 3/3; preflight-dr SKIP (no single MONDO causal gene, expected for a complex disorder; top genes KCNH2/KCNE1/SCN5A/KCNQ1 confirm on-topic). Pathophysiology curated as a causal chain (IKr pore blockade + parallel hERG trafficking disruption -> prolonged ventricular repolarization -> early afterdepolarizations -> Torsades de Pointes Arrhythmia -> Torsade de pointes phenotype/syncope/sudden cardiac death), conforming to the xenobiotic_cardiac_channel_perturbation module. Genetic susceptibility: KCNH2/KCNQ1/SCN5A (latent cLQTS variants, SUSCEPTIBILITY) and KCNE1 D85N (MODIFIER, OR 9.0). Added an iPSC engineered-heart-tissue NAM model (PMID:41727060). All 4 phenotypes causally connected. Validated with just validate-disorders (26/26 snippets verified), terms, entity-refs, causal-targets, name-collisions, snippet-grading, model-scale-audit, environmental-evidence; GeneReviews NO_CHAPTER (acquired condition).

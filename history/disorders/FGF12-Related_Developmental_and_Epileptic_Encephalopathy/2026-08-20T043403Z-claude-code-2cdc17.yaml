  summary: 'Create: FGF12-Related DEE (DEE47)'
  details: |
    New entry for DEE47 (MONDO:0014949, OMIM 617166, FGF12/FHF1 hgnc:3668), curated from a claude_code deep-research run. NEC preflight PASS: FGF12 at 65 mentions with SCN2A and SCN8A appearing as channel partners rather than rival entities, and OMIM 617166 matching the MONDO xref exactly. The report's validator set needs_review true for three unsupported quotes. All three cited PMIDs were checked and are real, on-topic papers, including two 2026 papers whose unusually high PMIDs initially looked suspect. The most consequential flag was a quote about amenability to precision treatment with sodium channel blockers, attributed to two papers; inspection showed one of those papers explicitly reports the opposite, stating it found no clear correlation between sodium channel blocker treatment, its timing, and neurodevelopmental outcome. That disagreement is now curated as the entry's central CONTROVERSY, with the supporting cohort as SUPPORT and the null cohort as REFUTE on the same treatment. Three ontology bindings proposed by the report were wrong and corrected against OAK: GO:1902480 is protein localization to mitotic spindle rather than sodium channel regulation, so GO:0017080 sodium channel regulator activity and GO:1902305 regulation of sodium ion transmembrane transport were used; CL:0001031 is cerebellar granule cell rather than Purkinje cell, so that cell type was not curated; and GO:0086010 lacks the cardiac qualifier the report gave it, so GO:0086006 was used for the cardiac channel node. GeneReviews: the only chapter returned by an FGF12 search is the Brugada Syndrome chapter, in which FGF12 is a mentioned minor gene rather than the subject, so it is not the baseline for this disorder and was deliberately not tagged; this is recorded in the entry notes because tagging it would have been a category error. A title-quoting snippet was replaced with an abstract sentence stating the same finding. Five references cited, four with full text. Validation: just validate passed with 27 of 27 snippets verified; validate-terms, check-duplicate-keys, check_folded_hyphens, check_environmental_evidence, check-title-snippets and check_snippet_length all pass.

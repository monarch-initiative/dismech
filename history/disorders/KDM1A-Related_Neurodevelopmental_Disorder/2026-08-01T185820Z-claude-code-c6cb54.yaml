  summary: 'Create: KDM1A-Related Neurodevelopmental Disorder / CPRF, MONDO:0014751'
  details: |
    De-novo curation of MONDO:0014751 - palatal anomalies-widely spaced teeth-facial dysmorphism-developmental delay syndrome, curated under the gene-anchored preferred name KDM1A-Related Neurodevelopmental Disorder. NEC preflight passed: the MONDO label is purely descriptive with no gene handle, so identity was anchored first via runoak on MONDO:0014751, which yields three concordant anchors - RO:0004003 to HGNC:29079 KDM1A, xref OMIM:616728 which is CPRF, and the RELATED synonym CPRF. Established gene is KDM1A / LSD1. Duplicate preflight on origin/main plus all PRs and issues by MONDO ID, label, and gene found no existing coverage. Deep research: Edison/falcon, 646 s, 21 citations; it independently converged on KDM1A and OMIM 616728 so it passed the gene-frequency check, and it supplied two mechanistic sources - PMID:38453932 forebrain conditional-knockout mouse and PMID:41351445 kdm1a-knockout zebrafish. The DR did NOT return either delineating clinical paper; PMID:26656649 and PMID:24838796 were found independently via the PubMed E-utilities API and supply most of the phenotype evidence. No GeneReviews chapter exists for KDM1A, confirmed by PubMed search, so the GeneReviews baseline step does not apply. Entry is deliberately sized to a four-proband literature: 5-node pathograph from amine-oxidase-domain missense variants through partial catalytic impairment and reduced protein half-life, a separate non-catalytic transcription-factor-engagement arm, loss of LSD1-CoREST repression, and dysregulated neurodevelopmental and craniofacial gene programs; 13 phenotypes; 3 differential diagnoses; 2 animal models; 2 uncited supportive treatments explicitly flagged as such; and 2 discussions - a KNOWLEDGE_GAP on loss versus gain versus dominant-negative and a HUMAN_MODEL_MISMATCH on the heterozygous-null mouse being normal while the homozygous null is embryonic-lethal. Orphanet-listed features such as hypertelorism, short stature and digital anomalies were deliberately omitted because ORPHA:477993 is not in references_cache and refresh-orphadata currently fails a manifest checksum, so no quotable snippet exists; this is recorded in the entry notes. Validation: just validate passes all three stages - schema no issues, term validation passed, reference validation 46/46 snippets verified against cached references.

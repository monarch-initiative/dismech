  summary: Add reverse differential diagnosis to TK2 myopathic MDS
  details: |
    Added a differential_diagnoses record for mitochondrial DNA depletion syndrome, myopathic form (MONDO:0012301, TK2 deficiency), the pyrimidine-arm counterpart of DGUOK deficiency in the same mitochondrial deoxyribonucleoside salvage pathway. This is the reverse pointer for the new Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form entry created in the same PR; nothing else in this entry was changed. The record names the substrate-arm split (TK2 pyrimidines vs dGK purines), the organ split (skeletal muscle vs liver), the therapeutic split (nucleoside substitution vs liver transplantation), and points at the separate entry by slug. Its two evidence items quote PMID:12765840 (organ sparing in TK2 deficiency, HUMAN_CLINICAL) and PMID:18467430 (the TK2/DGUOK organ split, MODEL_ORGANISM with quote_role BACKGROUND, since that sentence is the mouse paper's framing of the human clinical picture rather than its own result). Both references were fetched with just fetch-reference and quoted from the cache file. MONDO:0012301 was verified with runoak against the local MONDO build, returning OMIM:609560 and RO:0004003 HGNC:11831 TK2. just validate passed on this file with 143 snippets checked and 0 issues.

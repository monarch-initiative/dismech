  summary: 'Review round 1: add missing >10% phenotypes, muscle node, edge evidence'
  details: |
    Response to ai4c-reviewer review 5293016984 (CHANGES_REQUESTED) on PR #12599.

    Blocking item: added phenotypes over 10% from PMID:38756539 (already cached): Ascites (HP:0001541, 16.3% at onset), Metabolic Acidosis (HP:0001942, 52.5% whole cohort, 68% hepatocerebral), Feeding Difficulties (HP:0011968, 30.8%), Brain MRI Abnormalities (HP:0012443, 38.5% of imaged; not in the coarse-term set, so no coarse_binding_basis), and Muscle Weakness (HP:0001324) and Ptosis (HP:0000508) scoped subtype Hepatomyocerebral without frequency, because the cohort percentages include adult isolated-myopathy cases outside this entry. Every HP ID was looked up with runoak (ols:hp) before binding. Added a Skeletal Muscle mtDNA Depletion and Mitochondrial Myopathy node (muscle depletion 20/30, COX-deficient fibres 19/45) fed from the purine-supply node and leading to weakness and ptosis. Metabolic acidosis is wired from the respiratory chain node with causal_link_type UNKNOWN and an explicit inference note; MRI abnormalities from the CNS node; ascites and steatosis from the liver-injury node. Feeding difficulties left unwired: no cited source attributes them to a mechanism.

    Optional items taken: nystagmus rebound from HP:0001583 Rotary nystagmus to HP:0000639 Nystagmus because the quoted 32.6%/40.9% count any nystagmus (rotary kept in preferred_term and description, and the now-unused HP:0001583 cache rows removed); Lactic Acidosis edge given evidence (PMID:34026460 lactate/pyruvate ratio in DGUOK-mutant vs isogenic-corrected iPSC hepatocytes, IN_VITRO; PMID:38756539 MRS lactate peak 6/8); PMID:29137425 opsoclonus quote_role changed to BACKGROUND; GeneReviews 25% recurrence snippet added; Hepatic Steatosis added as a phenotype (HP:0001397); pulmonary hypertension as the leading post-transplant cause of death (4/13) added to the Liver Transplantation description with its snippet. None declined. No inline review threads existed.


  summary: 'Create: Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type'
  details: |
    New entry for MONDO:0009636 (DGUOK deficiency, infantile hepatocerebral mtDNA depletion syndrome), curated on behalf of @bpow.

    Lump/split: isolated hepatic and hepatomyocerebral forms are subtypes; the allelic DGUOK disorders with their own MONDO terms (noncirrhotic portal hypertension 1, MONDO:8000013; adult-onset PEO with multiple mtDNA deletions AR4, MONDO:0014899, curated in open PR #11549) are differential diagnoses only. ClinGen lumps all DGUOK phenotypes into one 'mitochondrial disease' assertion (Definitive); the entry records that disagreement in notes.

    Sources: GeneReviews chapter PMID:20301766 (tagged; all abstract features captured), ClinGen CGGV assertion dd4c3ef2 (cache built from a same-day ClinGen CSV download; the worktree data/clingen MANIFEST was not repinned, so the cache file records the pinned 2026-08-13 snapshot date), Orphanet ORPHA:279934 (built from a same-day Orphadata download, manifest not repinned). Primary literature: discovery paper PMID:11687800, 2008 series PMID:18205204, 2024 international cohort PMID:38756539 (full text), 2024 natural-history collation PMID:39079226, transplant-outcome papers PMID:18825706, 24478274, HCC case reports PMID:16908739, 30589726, islet hyperplasia/hyperinsulinism PMID:21107780, 38027095, models PMID:31127938 (mouse), 30428046 (zebrafish), 26773591 and 33368311 (rat), 34026460 (iPSC hepatocytes, ferroptosis).

    Deep research: exactly one report. Requested falcon (HTTP 402, out of credits). A first run with generic --fallback moved on to openscientist and was stopped before producing output when the coordinator directed claude_code as the fallback; the report that exists is research/Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type-deep-research-claude_code.md (fell_back: true). Its reference validation: 22/23 resolved, needs_review true; the unresolved PMID:34167177 failed on an NCBI HTTP 429 and was seen to resolve (esummary title: The clinical variations and diagnostic challenges of deoxyguanosine kinase deficiency: a descriptive case series) during an earlier search, but it is not cited in the entry. One quote attributed to PMC11043827 was not found in the abstract; not used. Term validation flagged the report binding GO:0004137 (deoxycytidine kinase activity) as deoxyguanosine kinase activity; the entry uses GO:0004138. just preflight-dr PASS (DGUOK 68 mentions, OMIM 251880 matches). The report's lead on ferroptosis (PMID:34026460) was checked against the paper and added as an in-vitro node.

    Most of the entry was built from primary literature found by PubMed search rather than from the report. Gaps recorded in the entry: no brain mtDNA data (CNS mechanism knowledge gap), no HCC incidence, hepatic contribution to hypoglycaemia is an uncited inferred edge, failure to thrive and renal involvement are not wired to a mechanism. Validation: just validate, count-verified-snippets (123/123), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, list-gene-term-mismatches, check-genereviews --online, validate-disorders.

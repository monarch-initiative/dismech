  summary: 'Genetics pass: wire KCNA1 and CACNA1A into the pathograph; add the GeneReviews
    EA1 baseline'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: `just check-genereviews` surfaced an uncited GeneReviews chapter for this
    entry - PMID:20301785, "Episodic Ataxia Type 1" - which was then fetched and read as the
    baseline before the reconciliation checklist was opened. The EA2 chapter (PMID:20301674) is
    marked retired in the Bookshelf index and was not cited.

    The one checklist gene, KCNA1 (hgnc:6218), was already curated with a `gene_term`, a
    `subtype:` foreign key and its founding primary reference - but it reached no pathophysiology
    node, which is the gap this campaign exists to close. The knowledge-graph gap is separately
    an export artefact: the checklist keys on MONDO:0008047, the EA1 `has_subtypes` term, while
    the exporter emits gene edges only against `disease_term` (MONDO:0016227). See dismech#12316.

    What changed:
    - KCNA1 bound as a `genes:` descriptor on all three EA1 pathophysiology nodes (Kv1.1
      Loss-of-Function, Cerebellar Basket Cell Hyperexcitability, Peripheral Motor Nerve
      Hyperexcitability), each of which already described Kv1.1 loss in its own text.
    - CACNA1A (hgnc:1388) bound on both EA2 nodes (Cav2.1 P/Q Channel Loss-of-Function,
      Purkinje Cell Pacemaking Imprecision) for the same reason.
    - `genes:` lists added to the EA1 and EA2 `has_subtypes` rows.
    - `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` on both `genetic:` records.
    - The GeneReviews EA1 chapter added as two evidence items on the KCNA1 record (the molecular
      diagnostic criterion and the autosomal dominant inheritance statement) and registered in a
      new `references:` block with a `GeneReviews` tag.

    Scope note: this entry deliberately models only EA1 and EA2 of the eight-plus described
    episodic ataxia subtypes, as its own description states. That scoping was not revisited.

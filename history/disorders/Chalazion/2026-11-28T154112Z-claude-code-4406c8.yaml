  details: |
    New entry for chalazion (MONDO:0005844). Deep research: research/Chalazion-deep-research-claude_code.md (claude_code, first attempt succeeded); used as leads only, with every quote and CURIE re-verified against fetched references and OLS. MONDO places chalazion under internal hordeolum and therefore in the bacterial and staphylococcal infection subtree, but the cited literature describes a sterile lipogranuloma from noninfectious meibomian duct obstruction, and cultures of chalazion contents grew nothing (PMID:40194825). The entry therefore has no infectious_agent or transmission block and uses category Complex; Demodex, smoking and low vitamin A are environmental associations with PREDISPOSES links. Pathograph: lid-margin disease to duct obstruction to retained meibum (conforms to granuloma_formation Persistent Indigestible Stimulus) to lipogranulomatous inflammation (conforms to Organized Granuloma Assembly) to the nodule, swelling, tenderness, ptosis and corneal compression with astigmatism, amblyopia and blurred vision. Treatments: warm compresses, intralesional triamcinolone with its depigmentation and fat-atrophy caveats, incision and curettage, tea tree oil scrubs for Demodex-associated recurrence, and a row recording that antibiotics show no benefit. Validated with just validate, count-verified-snippets, validate-terms and validate-disorders.

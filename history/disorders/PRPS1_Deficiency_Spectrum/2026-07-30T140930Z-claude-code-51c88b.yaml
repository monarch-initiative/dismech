  summary: Anchor top-level disease_term to MONDO:0100061
  details: |
    Re-audit for dismech#3691 (entries lacking a top-level disease_term). The entry deliberately models the GeneReviews PRS-I deficiency continuum rather than a clinical leaf, and its note said so as the reason no disease_term was set. MONDO:0100061 (PRPS1 deficiency disorder) is exactly that continuum class: ClinGen-sourced, gene-anchored to PRPS1 via RO:0004003 HGNC:9462, and defined as presenting a range of peripheral neuropathies that can include features of Charcot-Marie Tooth syndrome, Arts syndrome, or nonsyndromic hearing loss - matching this entry's three curated subtypes (Arts Syndrome, CMTX5, DFN2). Added the top-level disease_term and extended the note to record the anchor plus the explicit exclusion of PRPP synthetase superactivity (MONDO:0010395), a distinct gain-of-function entity. Verified with runoak -i sqlite:obo:mondo info MONDO:0100061 -O obo. Validated with just validate and just validate-terms, both passing. Subtype terms and the separate Arts_syndrome.yaml entry are unchanged.

  summary: Split root immune-susceptibility and T-cell nodes, calibrate finger vs
    toe dactylitis frequencies, replace imaging methods-list snippets, and add PsA
    prevalence, environmental triggers, IBD phenotypes, and modern bDMARD/tsDMARDs
  details: |
    Split Immune-Mediated Inflammatory Arthritis into MOLECULAR MHC Class I and IL-23/Th17 Susceptibility Variants (unmodified GO molecular_functions) and CELLULAR CD8+ and Th17 Lymphocyte Activation, removing duplicate direct root-to-phenotype edges and retargeting Gut Dysbiosis and Conventional Synthetic DMARD Therapy. Recalibrated Dactylitis (finger) to OCCASIONAL and retained Dactylitis (toe) at FREQUENT using site-specific hand vs foot dactylitis proportions from PMID:15271771, added Crohn's Disease (HP:0100280) and Ulcerative Colitis (HP:0100279) phenotypes, and added direct nail-pitting evidence (PMID:26555117) on Nail psoriasis. Replaced PMID:25837448 methods-list imaging snippets with substantive PsA imaging evidence from PMID:39421802 and split Ultrasound Imaging (NCIT:C17230) from Magnetic Resonance Imaging (NCIT:C16809). Added structured prevalence records (PMID:29398124 and PMID:29928910), environmental entries for Obesity (PMID:22586165) and Mechanical Stress and Physical Trauma (PMID:32159793, PMID:21715249), and expanded treatments with ixekizumab (PMID:27553214), bimekizumab (NCIT:C171829, PMID:36493791), risankizumab (NCIT:C152227, PMID:34911706), ustekinumab trial data (PMID:23769296), upadacitinib (NCIT:C152802, PMID:33789011), apremilast (CHEBI:78540, PMID:24595547), and therapeutic_modality: OTHER on TNF Inhibitor Biologic Therapy.

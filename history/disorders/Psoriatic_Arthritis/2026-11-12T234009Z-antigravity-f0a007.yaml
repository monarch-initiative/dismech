  summary: 'Review and enrich Psoriatic_Arthritis: audit evidence grading, bind all
    phenotypes, add GWAS genetics, CASPAR/imaging diagnosis, and targeted bDMARD/tsDMARD
    therapies'
  details: |
    Audited all existing claims, snippets, evidence_source, and quote_role across Psoriatic_Arthritis.yaml while preserving protected pathograph node Disordered Bone Remodeling. Added synonyms, DERMATOLOGY classification, biological_scale/locations/cell_types/molecular_functions/conforms_to across all 6 pathophysiology nodes, and bare-name downstream edges connecting all 10 phenotypes. Resolved unbound Dactylitis by consolidating cohort data (PMID:23818708) into Dactylitis (finger) HP:0031090 and Dactylitis (toe) HP:0031091 and adding Psoriasiform dermatitis (HP:0003765) and Osteolysis (HP:0002797). Added 6 GWAS susceptibility loci (HLA-B, HLA-C, IL23R, TRAF3IP2, TYK2, IL12B from PMID:25651891), 3 diagnosis procedures (CASPAR criteria PMID:16871531, radiography PMID:20796300/PMID:25837448, musculoskeletal ultrasound/MRI PMID:25837448), and expanded treatments to 5 modal classes (methotrexate, anti-TNF, anti-IL-17A secukinumab/ixekizumab PMID:26135703, anti-IL-23 guselkumab/ustekinumab PMID:32178765, tofacitinib JAKi) with therapeutic_modality, therapeutic_agent, and target_mechanisms.

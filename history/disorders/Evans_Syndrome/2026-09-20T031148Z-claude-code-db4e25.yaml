  summary: Add bleeding, infection and DNT phenotypes in response to review
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #11598 (review 5259188772). Blocking finding: the phenotype section described what Evans syndrome is rather than what it does, omitting bleeding and infection while progression already named both as leading causes of death. Added three phenotypes, all quotable from references already cached in the PR. Mucocutaneous Bleeding bound to HP:0001892 Abnormal bleeding, wired as an INDIRECT_KNOWN_INTERMEDIATES downstream edge from Antibody-Mediated Platelet Destruction with the thrombocytopenia as the named intermediate, which closes the arm asymmetry the review identified (the erythrocyte arm terminated in Jaundice, the platelet arm in nothing). The review suggested HP:0000967/HP:0000421/HP:0000225/HP:0002239; those resolve but each is narrower than the claim, which spans four manifestations named in one sentence, so the broader accurate term was bound and the narrower candidates recorded in notes. runoak searches for mucocutaneous bleeding and mucosal hemorrhage return nothing; HP:0011889 Bleeding with minor or no trauma was rejected because no source states the trauma context. Severe and Recurrent Infections bound to HP:0002719, left deliberately unwired because both causes the sources give, chronic immunosuppressive therapy and the underlying immune deficit, sit outside this pathograph. Increased Double-Negative T Cells bound to HP:0002851 (found by runoak search, not offered in the review), also unwired, taking review suggestion 1. Phenotype connectivity therefore moves from 5/5 to 6/8 by design rather than by omission. Also tightened the notes sentence on haematopoietic stem cell transplantation per review suggestion 2: the cached review does report it as successful in unresponsive cases, so the old wording understated the source, but there is no cohort, denominator or response rate, so it is still not curated as a treatment. One self-caught defect worth recording: the PMID:33440924 reference_title was first written from composition rather than copied from the cache frontmatter, and was corrected before commit; an en-dash in the 58-percent complications snippet was likewise initially transcribed as a hyphen. Validation: just validate-disorders passes, 90/90 snippets verified (was 83/83), terms pass, prose-figure-audit clean, gene wiring 6/6, folded-hyphens, entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, reference-titles, snippet-grading, title-snippets and snippet-length all pass.

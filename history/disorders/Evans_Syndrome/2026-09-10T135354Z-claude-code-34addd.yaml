  summary: 'Create: Evans Syndrome MONDO:0016030'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check. The job ran 908 seconds and returned nine findings across seventeen citations.

    Finding the gap took three attempts, which is worth recording because naive name matching keeps failing on this repository. Castleman disease looked like a gap on a label match and is in fact covered by three entries plus an open issue. The reliable method is subclass-closure of curated MONDO identifiers plus a filename check plus an open-issue scan, and Evans syndrome passes all three: MONDO:0016030 has an empty subclass tree, no curated entry references it, and no filename collides.

    The central curation decision is what to do with a disease defined by co-occurrence rather than by mechanism. Evans syndrome is any two of immune thrombocytopenia, autoimmune haemolytic anaemia and autoimmune neutropenia, which raises the question of whether it is one disease or two sharing a patient. The pathograph takes a position: a single root, loss of lymphocyte self-tolerance, above two separate destruction pathways, one per lineage, each with its own antibody. The tolerance failure is shared; the effector mechanisms are not.

    That structure makes a prediction, and three independent observations bear it out. After splenectomy, thrombocytopenia recurred in 42.8 percent while autoimmune anaemia recurred in none of the same seven patients. At ten years in the French paediatric cohort, sustained complete remission was 54.5 percent for the thrombocytopenia and 78.4 percent for the haemolytic anaemia. And rituximab relapse-free survival is higher in isolated haemolytic anaemia than in Evans syndrome. None is decisive alone; together they are the reason the entry does not model one process acting on two cell types.

    What distinguishes this syndrome from its components is not response but what follows it. Steroids work initially in about 80 percent of children; splenectomy gives an 85.7 percent initial response against 90.9 percent for isolated immune thrombocytopenia in the same series; rituximab gives 75 percent. Then the curves separate: median survival 7.2 years, 1.7 years where secondary, a 22-fold hazard ratio for death in children against matched controls, and 24 percent dead at a mean 4.8 years in the largest adult series. The entry says this in the description, in progression and in notes, because a reader who takes the response rates at face value will draw the wrong conclusion.

    The reduced CD4 to CD8 ratio is deliberately not treated as mechanism. The literature lists it alongside CTLA-4, LRBA and TPP2 deficiency as a molecular theory, but those are different kinds of claim: a germline deficiency in a regulatory protein is a candidate cause, while a shifted cell ratio in patients undergoing chronic cell destruction is something chronic antigenic stimulation would also produce. The node is PROVISIONAL and the alternative reading is recorded as an ALTERNATIVE mechanistic hypothesis rather than buried.

    Six genes are curated and the differences between them are kept visible, because the syndrome is a convergent endpoint rather than a pathway. CTLA-4 haploinsufficiency removes a regulatory brake directly; LRBA deficiency removes the same brake indirectly by failing to rescue endocytosed CTLA-4 from degradation, so the two converge without sharing a gene. STAT3 acts by gain of function, the opposite direction. TPP2 works through immunosenescence rather than regulatory failure. FAS causes failure of lymphocyte apoptosis and is the one lesion with a treatment attached, since children with that diagnosis are directed to sirolimus rather than rituximab. KRAS is grouped with the germline lesions in the source but its variants here are somatic, which changes what a negative germline panel means.

    The deep-research job earned its place. Seven of its PMIDs were not in the draft, and each was verified against PubMed and fetched before use. Two of its quoted sentences did not match the cached text and were replaced with the real wording rather than trusted; that is the second time in this series that verification has caught a report quote that did not survive contact with the source. Its most valuable contribution was progression to systemic lupus, which no source in the original draft mentioned: 45 percent of antinuclear-antibody-positive paediatric Evans syndrome progressed to lupus, against 20 and 19 percent for the isolated cytopenias, and no ANA-negative patient did. The band is scoped to the ANA-positive subgroup and the description says so rather than letting the number stand unqualified.

    The genetic evaluation recommendation is scoped by age on the evidence rather than by assumption. A prospective paediatric cohort found evidence of an inborn error of immunity in half of autoimmune cytopenia patients and a monogenic cause in a quarter; an adult cohort screened on a broad panel found no fully penetrant case. That negative is carried as REFUTE evidence on the diagnosis entry, because it is what stops the paediatric recommendation being extended to adults.

    No subtypes are declared. MONDO:0016030 has an empty subclass tree, and the distinctions that matter clinically - primary versus secondary, paediatric versus adult onset - are strata rather than ontology subtypes, so they are carried in epidemiology, progression and the hypotheses instead of being invented as has_subtypes entries.

    Validation: 80/80 snippets verified, term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent. Seventeen references, seven of them full text, content_type checked on every cache before writing.

  summary: 'Gene-family review: KRAS'
  details: |
    The KRAS record was typed CAUSATIVE with variant_origin SOMATIC on one review sentence. The variants are acquired in a hematopoietic clone and cause Ras-associated autoimmune leukoproliferative disorder (RALD), which reaches an Evans syndrome presentation through autoimmune cytopenia; a 2021 literature review found 27 RALD patients, 16 with somatic KRAS mutations and autoimmune cytopenia in 15 of 16 assessed (PMID:33011939). Retyped SOMATIC_DRIVER, added both PMID:33011939 sentences as evidence and a note explaining the route.

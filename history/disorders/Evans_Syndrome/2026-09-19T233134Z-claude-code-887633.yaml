  summary: Wire causal genes into the pathograph; source the survival figure in diagnosis
  details: |
    Follow-up round on PR #11598. Merged origin/main to clear a conflict in cache/hgnc/terms.csv and cache/ncit/terms.csv; both were additive derived rows (kept TPP2 and TPSAB1 side by side; kept main's Fostamatinib row, which differed only in timestamp). Content changes: all six causal genes were listed in genetic: but none reached the pathograph, so gene-to-mechanism wiring measured 0/6. Added a genes: descriptor for CTLA4, LRBA, STAT3, KRAS and FAS on 'Loss of Lymphocyte Self-Tolerance' and for TPP2 on 'Autoreactive B Cell Activation and Multi-Lineage Autoantibody Production', placing each lesion where its own cited sentence puts it rather than all at the root. Added two node-level evidence items from the already-cached full text of PMID:30349415 to source the FAS and TPP2 placements, and a second evidence item on diagnosis[0] citing PMID:31292991 for the 5-year survival figure its description quotes, which just prose-figure-audit had flagged as unsourced at the point of claim. Validation after the edits: just validate-disorders passes, 83/83 snippets verified, term validation passes, gene-to-mechanism wiring 6/6 and phenotype connectivity 5/5, list-gene-term-mismatches reports 0 findings over 12 HGNC bindings, and prose-figure-audit is clean. check-genereviews reports NO_CHAPTER for GeneReviews (Evans syndrome is not Mendelian) and an untagged StatPearls chapter, which is never a baseline and was left alone.

  summary: Add typed divergences to the C19DMap Boolean model links
  details: |
    Eight typed divergences across the three links. Enhanced Viral Replication and Tissue Pathology carries an INVALIDATING PROXY_QUANTITY: viral replication there is one of four Boolean output nodes used to cluster stable states of a host-signalling network, indexing whether host restriction is relieved rather than reporting viral titre, and nothing in the model reports alveolar injury. Plus SCALE_EXTRAPOLATION, BOUNDARY_OMISSION (tissue scale reached only via a separate multiscale simulator) and TEMPORAL_SCOPE. Both interferon links, which are ALIGNED on scale, carry CALIBRATION_PROVENANCE (CaSQ topology inference with no kinetic parameterisation or fitting) and TEMPORAL_SCOPE (qualitative reachability, or stable states, rather than the induction kinetics that distinguish a controlling from a damaging response).

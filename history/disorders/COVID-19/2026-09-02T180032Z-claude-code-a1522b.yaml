  summary: 'Integrate assessed OpenScientist findings: Mac1 allosteric pivot model'
  details: |
    Assessed kb/hypotheses/COVID-19/mac1_allosteric_pivot_model/openscientist.md (verdict PARTIALLY_SUPPORTED, 15 claims) and integrated its verified findings. Added five evidence items to the mac1_allosteric_pivot_model hypothesis: PMID:40736256 and PMID:30918076 (SUPPORT, separable binding vs hydrolysis functions and macrodomain-PLP2 proteasomal destabilization, both in mouse hepatitis virus); PMID:39229055 (SUPPORT, potent orthosteric inhibitors raise ADP-ribosylation without antiviral activity); PMID:41258893 (REFUTE, AVI-4206 gives in vivo proof of concept for active-site inhibition, contradicting the premise that active-site inhibition alone may not suffice); PMID:41565251 (REFUTE, CACHE #3 hits converged on canonical adenine-mimetic orthosteric chemotypes rather than conformational-pivot chemistry). Added PMID:37607224 and PMID:41279050 to the Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure node for direct SARS-CoV-2 reverse-genetics validation and for the broader candidate interactome. Extended the gap_covid_macrodomain_allosteric_pivot discussion rationale to state both chemical-matter absences explicitly and the raised comparator bar, with PMID:40407321 and PMID:41565251 as evidence. Added a new discussion gap_covid_mac1_therapy_interferon_competence on whether Mac1-directed therapy retains efficacy in interferon-deficient patients (PMID:37196358, PMID:41258893, PMID:40407321). Left out deliberately: the report anchors its allosteric precedent to PDB 5RSE, which the RCSB API shows is a 2020 SARS-CoV-2 Mac1 fragment structure and not the 2017 PARP14 MD2 GeA-69 co-crystal, so the identifier and the topological-equivalence argument built on it were rejected; the B-factor coupling analysis over residues 155-169 has no committed code or output and was not integrated; the report's count of three independent groups showing antiviral activity does not hold, because PMID:41820535 is a PARP15-foci assay with no antiviral readout and PMID:39554145 and PMID:40407321 are one study; and the report's Gap 5 claim that no Mac1 resistance data exist is contradicted by PMID:40407321, which it cites. Hypothesis status left at EMERGING. Snippets 62/62 verified.

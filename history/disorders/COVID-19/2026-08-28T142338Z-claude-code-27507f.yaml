  summary: Add COVID-19 Disease Map Boolean models to computational_models
  details: |
    Added the first computational_models block for this entry, with two Boolean models from the COVID-19 Disease Map programme. First, the C19DMap SBML-qual model collection (PMID:34664389, FAIRDOMHub model 714), whose CaSQ translation retains the source diagrams' references, annotations and layout. Second, the type 1 interferon signalling Boolean model (PMID:38414974), simulated in Cell Collective, yielding 128 stable states clustered by four output nodes (viral replication, antiviral response, inflammation, IFNA1 secretion), with single-node knockouts used for drug-target nomination. Links: RNA Virus-Induced Interferon and PARP Activation from both models; Enhanced Viral Replication and Tissue Pathology as PARTIALLY_RECAPITULATES/LOW, since viral replication is a Boolean output node of a host-signalling network rather than a tissue-pathology model. Validation as for the sibling entries in this tranche.

  summary: Add preclinical ACE2-targeted IL-27 gene therapy treatment
  details: |
    Added one preclinical treatment (ACE2-targeted IL-27 stromal-cell conditioned-media gene therapy) from PMID:42435246, an in vitro SARS-CoV-2 spike pseudotyped lentivirus study. Bound treatment term NCIT:C15238 (Gene Therapy) and linked it to the spike entry node with INHIBITS, directness INDIRECT. The snippet is the study's own statement that the trend was not statistically significant, quoted verbatim, and the explanation keeps that caveat. Review round 1 added a second, opposite-direction evidence item on the same mechanism link: the study's Discussion reports that the only statistically significant entry effect for IL-27ACE2pep was an increase at very high concentration in the treatment regimen, and summarizes the construct as showing limited inhibition with unexpected concentration-dependent effects. That sentence is quoted as a REFUTE item rather than folded into the existing SUPPORT item, and the link description was extended so it no longer reports only the non-significant decrease. Validated with validate-disorders, count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets and check-snippet-grading.

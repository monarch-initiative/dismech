  details: |
    Work items 2 and 3 of issue #10115. Neither block existed despite the entry being one of the largest in the KB.

    Added one infectious_agent record for SARS-CoV-2 bound to NCBITaxon:2697049 (already in the term cache), evidenced by PMID:31986264 (Huang et al., the first Wuhan clinical case series attributing the cluster to a novel betacoronavirus; HUMAN_CLINICAL) and PMID:32393804, whose framing sentence names the virus as the cause of COVID-19 - graded HUMAN_CLINICAL with quote_role BACKGROUND, since the sentence frames the study rather than reporting its result.

    Added two transmission records: person-to-person transmission among close contacts from PMID:31995857 (Li et al., first 425 confirmed cases; HUMAN_CLINICAL), and household transmission from PMID:32283139 (30% secondary attack among household contacts of 85 confirmed cases; HUMAN_CLINICAL). Both were newly fetched. No separate aerosol block was written: no reviewed source gave a crisp, quotable abstract sentence asserting the aerosol route for SARS-CoV-2, and a block resting on an inferential quote would overstate the evidence.

    No other section was touched; in particular mechanistic_hypotheses, pathophysiology, phenotypes and computational_models are unchanged. Validated with just validate and just validate-disorders; 74/74 snippets verified.

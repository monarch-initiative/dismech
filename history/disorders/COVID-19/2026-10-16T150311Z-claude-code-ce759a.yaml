  summary: 'Review round 2: MODULATES link predicate, reference titles'
  details: |
    Review round 2 on PR #14219, pushed as one commit. Two findings. The mechanism link asserted treatment_effect INHIBITS while carrying a REFUTE item reporting that the only statistically significant entry effect for IL-27ACE2pep was an increase, so the structured predicate contradicted the link's own evidence; it is now MODULATES, which TreatmentEffectEnum defines as altering the mechanism without a clear unidirectional effect and which matches the authors' own summary of limited inhibition with unexpected concentration-dependent effects. The link description and the REFUTE explanation were reworded to name MODULATES rather than INHIBITS. Both evidence items now carry reference_title, copied from the title: frontmatter of references_cache/PMID_42435246.md rather than retyped, which is the file's convention for 75 of its 85 evidence references. The reviewer's suggestion to bind IL-27 as a therapeutic_agent was investigated and declined on stated grounds, recorded in the treatment's notes: an OLS NCIT search for Interleukin-27 returns NCIT:C118114, whose only hierarchical ancestors are NCIT:C21176 Protein or Riboprotein Complex and NCIT:C26548 Gene Product, so it is outside the ChemicalEntityTerm enum's NCIT:C1909 Pharmacologic Substance root. Validated with just validate (85 snippets, 77 titles, 0 issues), check-enum-values, check-entity-refs, check-duplicate-keys, check-causal-targets and validate-history.

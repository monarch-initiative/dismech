  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added three diagnosis rows (the entry had none): SARS-CoV-2 NAAT bound to LOINC:105909-6 (method-less RNA presence, unspecified specimen); antigen test bound to LOINC:105066-5 (method-less antigen presence; LOINC codes these assays as SARS-CoV+SARS-CoV-2, and no method-less SARS-CoV-2-only antigen code exists in the Monarch KG); serology bound to two measurements, anti-nucleocapsid IgG LOINC:99596-9 and anti-spike IgG LOINC:99597-7, the only N- and S-protein antibody codes in the KG (both by immunoassay). Evidence from the three IDSA COVID-19 diagnosis guidelines (PMID:38112284 molecular, PMID:36702617 antigen, PMID:38489670 serology). No cut-offs: the molecular guideline declines to interpret cycle threshold values, so no Ct band, and the serology guideline abstract states no antibody concentration threshold. Labels validated against the Monarch KG with loinc-seed-cache; all snippets verified.

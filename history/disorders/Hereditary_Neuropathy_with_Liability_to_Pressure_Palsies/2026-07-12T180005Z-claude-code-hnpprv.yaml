  summary: Manual evidence review of HNPP (allelic PMP22-deletion neuropathy); no claim errors found
  details: |
    Manual, no-scripting review of HNPP as the allelic (PMP22-deletion)
    counterpart of CMT1A in the CMT-family review. Verified every evidence snippet
    is an exact substring of its cached source and supports its claim: PMP22
    underexpression as the initiating lesion (PMID:8422677), the junctional-myelin
    permeability mechanism from PMP22-deficient nerves (PMID:24339129), autosomal
    dominant inheritance and tomacula on biopsy (PMID:8393091), the
    compression-sensitive focal-conduction phenotype and neuropathic pain
    (GeneReviews PMID:20301566, review PMID:30989370), diagnostic electrophysiology
    and genetics (PMID:12827539), the 1.5-Mb recurrent deletion vs sequence-variant
    split (80%/20%), and all ORPHA:640 phenotype-frequency rows and the ClinGen
    PMP22 definitive assertion. No hallucinated PMIDs, misquoted snippets, or
    unsupported claims were found; this is a complete, well-curated entry.

    No fixes required and no follow-up issues specific to HNPP. Entry left unchanged.

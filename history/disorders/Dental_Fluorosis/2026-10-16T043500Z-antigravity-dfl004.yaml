  summary: 'Addressed PR #14478 review feedback across biochemical, treatments, clinical_trials, phenotypes,
    pathophysiology, genetic, environmental, and prevalence sections.'
  details: Split serum BALP, MMP-2, and MMP-9 into individual biochemical entries and added decreased
    serum osteocalcin (OC) and parathyroid hormone (PTH) from PMID:39876909. Separated preclinical Calcium
    and vitamin D supplementation (NCIT:C15425, CHEBI:29108, CHEBI:27300, PMID:33057951) from public-health
    Drinking water defluoridation and water source improvement (PMID:33333408). Replaced coarse HP:0000682
    with HP:0006286 (Yellow-brown discoloration of the teeth) and added direct human clinical/review fluorosis
    evidence (PMID:36583212, PMID:38135514, PMID:41623091) to Enamel hypomineralization and opacity and
    all three phenotypes, framing PMID:41294875 as indirect review background on maturation-stage ion
    transport. Split early-life fluoridated toothpaste ingestion and short exclusive breastfeeding duration
    (<6 months) into separate environmental entries. Restored hedged KLK4 wording and the Ameloblast iron
    storage and ferritin deficiency node name, added KLK4 (hgnc:6365) with GO:0004252 (serine-type endopeptidase
    activity, DECREASED) and FTH1 (hgnc:3976) with GO:0008199 (ferric iron binding, DECREASED) molecular function
    grounding and ameloblast (CL:0000059) cell-type binding, added Ameloblast endoplasmic reticulum stress and
    oxidative stress (GO:0034976, GO:0006979) and Ameloblast apoptosis (GO:0006915) pathophysiology nodes
    (DOI:10.3389/fcell.2023.1168215), added individual candidate genetic susceptibility entries for GSTP1, VDR,
    KL, BMP2, ALOX15 (PMID:36583212), and COL1A2 (DOI:10.1186/s12903-024-04086-z), added Remineralization with
    CPP-ACFP (MI Paste Plus) treatment and top-level clinical_trials entries (NCT01733888, NCT05204277,
    NCT05051748) wired to conservative esthetic treatments, and documented endemic northern Tanzania prevalence
    (82.5%) and 100% co-occurrence with skeletal fluorosis (PMID:38135514; cross-referencing
    kb/disorders/Skeletal_Fluorosis.yaml).

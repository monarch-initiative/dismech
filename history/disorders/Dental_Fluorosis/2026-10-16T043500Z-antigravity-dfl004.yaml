  summary: Reviewed and expanded Dental Fluorosis with multi-stage amelogenesis mechanisms, connected
    all phenotypes to the pathograph, populated missing sections, and removed deprecated prevalence percentage
    fields.
  details: Connected Enamel hypomineralization and opacity downstream to all three phenotypes (Enamel
    hypomineralization, Yellow-brown tooth discoloration, Post-eruptive enamel surface breakdown) to achieve
    100% phenotype connectivity. Expanded pathophysiology with Ameloblast iron storage and ferritin deficiency
    (PMID:31329045) and structured GO/CL/UBERON annotations. Added classifications, progression, environmental
    (drinking water, brick tea, indoor coal burning, early-life fluoridated toothpaste, and short exclusive
    breastfeeding), diagnosis (Thylstrup-Fejerskov/Dean indices and urinary fluoride), biochemical (urinary
    fluoride and serum BALP, MMP-2, MMP-9, OC, and PTH), and differential_diagnoses (amelogenesis imperfecta,
    molar-incisor hypomineralization/enamel hypoplasia, celiac disease-related enamel defects). Removed
    deprecated percentage fields from prevalence records and added endemic cohort prevalence and drinking
    water defluoridation interventions.
- type: REVIEW

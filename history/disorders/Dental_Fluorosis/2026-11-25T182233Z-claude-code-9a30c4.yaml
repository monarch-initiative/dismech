  summary: 'Gene-family review: VDR retyped DISPUTED; unsupported KL record removed'
  details: |
    VDR and KL were both typed SUSCEPTIBILITY on the strength of one review of brick tea-type fluorosis (PMID:36583212). That review's sources for both genes concern skeletal fluorosis: VDR-FokI CT/TT genotypes appeared protective for brick tea-type skeletal fluorosis (PMID:28170338), and serum soluble Klotho, a protein level rather than a KL genotype, was proposed as a mediator of skeletal fluorosis. The one dental fluorosis study that tested VDR polymorphisms (71 cases, 61 controls, West Bengal) found no association for any SNP (PMID:35066749). VDR is now typed DISPUTED, with the skeletal study as NO_EVIDENCE and the dental study as REFUTE. No study of KL genetic variation in dental fluorosis was found (Europe PMC: fluorosis or fluoride with klotho; skeletal fluorosis with klotho), so the KL genetic record, which asserted a genetic susceptibility the cited source does not make, was removed. The other brick tea fluorosis candidate genes in this entry (GSTP1, PRL, MMP2, FRZB, BMP2, ALOX15) rest on the same review and were not reviewed here.

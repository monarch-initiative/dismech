  details: |
    PR Shepherd repair for review round 3 on PR 14478. Set environmental_effect on all five influences_mechanisms links (TRIGGERS for drinking water, brick tea, indoor coal burning and fluoridated toothpaste; PREDISPOSES for short exclusive breastfeeding) and gave each link its own evidence item, copied from the exposure's existing evidence. Changed the toothpaste exposure's chemical from sodium fluoride to fluoride, as the source says only fluoridated toothpaste. Removed the twin-study evidence item and heritability sentence from GSTP1, since that study does not mention GSTP1; heritability is already recorded at disease level. Removed the ion-transport target from calcium and vitamin D supplementation, which PMID:33057951 does not address. Restored the KLK4 hedge (reduced KLK4 expression is consistent with impaired matrix clearance) and dropped the inferred serine-type endopeptidase activity DECREASED term. Dropped ferric iron binding DECREASED from the FTH1 node, keeping intracellular iron ion homeostasis. Added a sentence to each trial-registration evidence explanation on a treatment saying the registration shows the treatment was trialled, not its outcome. Validated with just validate, count-verified-snippets (86/86), check-entity-refs, check-causal-targets, check-duplicate-keys and check-environmental-evidence.

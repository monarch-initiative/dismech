  summary: 'Gene-family review: PHKA2, PHKB, PHKG2'
  details: |
    The three phosphorylase kinase subunit records were untyped with no origin and unbound inheritance blocks. All are typed CAUSATIVE (germline); PHKA2's inheritance binds HP:0001419 X-linked recessive, PHKB's and PHKG2's bind HP:0000007. ClinGen's Definitive AR classifications are copied for PHKB (GSD IXb, MONDO:0009868, subtype IXb) and PHKG2 (GSD IXc, MONDO:0013091, subtype IXc); ClinGen has no PHKA2 classification. The shared node binds phosphorylase kinase activity (DECREASED), the holoenzyme activity to which the regulatory alpha and beta subunits and the catalytic gamma subunit all contribute; it was not changed.

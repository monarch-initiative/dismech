  summary: 'Create: Glycogen Storage Disease Type IX (MONDO:0700291)'
  details: |
    New Disease entry for GSD IX (phosphorylase kinase deficiency), covering IEMbase metabolic WP-008 rows 3.4.1.01 (PHKA2), 3.4.11.01 (PHKB), 3.4.12.01 (PHKG2) and 3.4.13.01 (PHKA1). Curated as one entry on MONDO:0700291 with five gene-anchored has_subtypes (IXa1 MONDO:0010598, IXa2 MONDO:0100439, IXb MONDO:0009868, IXc MONDO:0013091, IXd MONDO:0010362) rather than four separate disease files, because the subtypes share one enzymatic lesion and are not clinically separable; subtype identity does change hepatic surveillance, so it is recorded structurally rather than in prose. Eight pathophysiology nodes: the PhK subunit lesion, failure to activate glycogen phosphorylase, the hepatic glycogenolysis block, hepatocellular glycogen accumulation, the fasting glucose-output deficit with intact gluconeogenesis, compensatory ketogenesis, hepatocellular injury and fibrosis, and the separate skeletal-muscle branch. Phenotype frequency bands come from the 52-patient multicentre cohort PMID:41732189, with the reported percentage inside each snippet. Two KNOWLEDGE_GAP discussions: the absent genotype-phenotype correlation, and whether nutritional therapy prevents hepatic as opposed to acute metabolic complications. Notes record that MONDO does not assert MONDO:0010362 as a subclass of MONDO:0700291 even though the group definition includes muscle PhK deficiency, and that historical cardiac phosphorylase kinase deficiency belongs to PRKAG2_Cardiac_Syndrome, not here. Validation: just validate passed schema, terms and references with 107/107 snippets verified against cached references; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-not4curation all clean. No deep-research provider report was used; every reference was found by PubMed search and cached with just fetch-reference. Five stubs deleted.

    4. New biochemical section for aberrant apolipoprotein C-III glycosylation, the one >10%-frequency biomarker finding from the entry's flagship cohort paper that the entry did not consume. Bound to NCIT:C117099 (Apolipoprotein C-III); BiomarkerTerm carries no hierarchy constraint, so only existence and label match are required, and the label matches the cached NCIT row exactly. Two evidence items: a SUPPORT item quoting the direction of the isoform shift and the 31/39 denominator, and a PARTIAL item for the authors' UDP-GalNAc hypothesis, marked PARTIAL because it is a stated hypothesis rather than a measured result. frequency: FREQUENT is taken from the reported 31/39 = 79.5%, which falls one half-point below the VERY_FREQUENT floor; the abstract's rounded "80%" would cross it, and notes records the choice so it is not read as a downgrade error. subtype: IXa1 records that the measurement was made only in males with GSD IXa and has not been shown for the PHKB, PHKG2 or PHKA1 subtypes.


  details: |
    Automated curation-scanner run addressing the three blocking (yellow) items in the ai4c-reviewer REQUEST_CHANGES review on PR #9154, plus a merge conflict that had left the branch DIRTY.

    1. Branch refresh. GitHub's update-branch API refused with HTTP 422 ("merge conflict between base and head"), so origin/main was merged in locally (a merge, not a rebase, per repo policy). The single conflict was in cache/mondo/terms.csv, where this branch and main had each appended one adjacent row. Resolved as the union of both rows in canonical CURIE order: MONDO:0009868 (glycogen storage disease IXb, from this branch) and MONDO:0009876 (isolated growth hormone deficiency type IA, from main). Confirmed with check-cache-order and check-term-cache-integrity. The post-merge diff against origin/main contains only this PR's intended additions and the five stub deletions, with no unrelated reversions.


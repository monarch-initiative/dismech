  summary: Add guideline-derived extra-intestinal cancer surveillance to Peutz-Jeghers
    syndrome
  details: |
    Mined the Peutz-Jeghers syndrome clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2). The entry already covered GI endoscopic surveillance/polypectomy, genetic counseling, and investigational chemoprevention (celecoxib, sirolimus); the guidelines' distinctive contribution is the extra-intestinal cancer surveillance that PJS management centers on. Added 1 treatment: Extra-Intestinal Cancer Surveillance (MAXO:0001492 surveillance for malignancies; lifelong multi-organ screening of breast, pancreatic, gynecologic, and testicular sites). Evidence from the US Multi-Society Task Force hamartomatous polyposis guideline (PMID:35487765), ACOG Committee Opinion 793 (PMID:31764758), and NCCN Genetic/Familial High-Risk Assessment (PMID:39689429), each snippet-verified against fetched abstracts. Fetched but did not cite the BSG hereditary CRC guideline (PMID:31780574, full-text PDF) or the AGA duodenal-lesions update (PMID:39545885). Schema and term validation pass; all 4 new snippets confirmed as exact substrings (validate-references reports 0 checks, the known false-pass).

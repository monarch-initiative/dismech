  summary: 'Create: Hemicrania Continua (MONDO:0018615)'
  details: |
    New entry from an Edison Falcon deep-research report. Three pathophysiology nodes at systems scale: trigeminal autonomic reflex activation, continuous unilateral head pain with exacerbations, and ipsilateral cranial autonomic activation. The mechanism is pitched as inferred rather than demonstrated, preserving the source's own hedge that the pathophysiology is likely rooted in hypothalamic dysfunction, because there is no molecular proof. The organising feature of the entry is a definitional peculiarity that distorts how its evidence must be read: absolute indomethacin response is part of the diagnostic criteria, so every diagnosed patient is a responder by construction and the literature reporting near-universal efficacy is describing the definition rather than measuring an effect. That is stated in the treatment description, in the notes, and in an OPEN_QUESTION asking where patients with an otherwise identical syndrome who do not respond actually go, with a proposed study of exactly those excluded patients, who by definition appear in no hemicrania continua cohort. A second KNOWLEDGE_GAP asks why indomethacin works when other NSAIDs do not, which is the most direct available probe of a mechanism that is otherwise inaccessible. Curated the 8 per cent of patients with side-alternating rather than side-locked pain, because side-locking is often treated as definitional and a strict reading would misclassify roughly one patient in twelve. Neuroimaging is curated as a diagnosis record rather than a footnote, with the reasoning that a significant proportion of trigeminal autonomic cephalalgia presentations are secondary and the indomethacin response does not exclude that, since a structural lesion disturbing the same circuitry may respond too. No genetic section: no causal gene, inheritance pattern, biomarker, omics signature or accepted animal model exists, and the absence is recorded in notes rather than papered over. Prevalence recorded as a tertiary-referral proportion with an explicit caveat that it is not a population rate and is likely an undercount given the documented misdiagnosis. Three Falcon runs failed before succeeding, twice on concurrent-session authentication and once on connect timeouts; the report was obtained on a serial retry. Validated: just validate passed; count-verified-snippets 17/17; title audit 17 citations 0 mismatches; check_folded_hyphens and check-title-snippets OK; pytest -k Hemicrania 16 passed.

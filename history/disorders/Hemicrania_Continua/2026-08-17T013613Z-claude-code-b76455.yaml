  summary: Correct a fabricated prevalence figure and a mis-encoded referral proportion
  details: |
    CRITICAL review finding, and the error was mine in three separate ways. First, the entry asserted 1.8 per cent as the clinic-based frequency. The cited source says 1.7 per cent, twice. The number 1.8 appears in that same cached file as the female-to-male ratio of 1.8 to 1, which is almost certainly where I took it from; nothing in the PR supports 1.8 per cent as a frequency. Corrected to 1.7 per cent with the range 1.3 to 2.3, quoted directly. Second, a referral-clinic proportion was encoded in the structured prevalence slots as POINT_PREVALENCE with rate_per_100000 1800, which asserts a general-population rate roughly twenty times the community estimate. The caveat that this was a clinic proportion lived only in notes prose, and the reviewer's point is decisive: downstream tooling reads the slots, not the prose, so a caveat in prose does not prevent the misuse. The record now carries measure_type UNKNOWN and no rate at all, with the reasoning stated. The source deep-research report warns against exactly this transformation twice, and I did it anyway. Third, the notes claimed that general-population prevalence was not identified, which is contradicted by the Vaga community study sitting in the same cached reference: 18 of 1838 parishioners, 1.0 per cent. That is now its own prevalence record, curated PARTIAL because the study found clinical features RESEMBLING the disease rather than confirmed cases; confirmation would have required demonstrating an absolute indomethacin response in each person, which a community survey does not do. That limitation is itself a consequence of the entry's central theme, a disease whose diagnosis requires a therapeutic trial, and the record carries the source's own sentence saying it is hard to establish prevalence of definite HC in any general population. Validated: just validate passed; count-verified-snippets 20/20 (was 17/17); pytest -k Hemicrania 16 passed; hyphen gate OK.

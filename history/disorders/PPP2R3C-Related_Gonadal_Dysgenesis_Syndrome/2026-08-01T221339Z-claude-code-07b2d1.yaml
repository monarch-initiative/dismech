  summary: Add deep-research artifact and n=1 immunophenotype (commit e6d41ba)
  details: |
    Retroactive history record for commit e6d41ba, which the original CREATE record (2026-08-01T211047Z-claude-code-7b6c6a) predates and does not describe. The deep-research run reported as hung when the CREATE record was written subsequently completed (exit 0, stop_reason end_turn, duration_seconds 1525.8, citation_count 14) and produced research/PPP2R3C-Related_Gonadal_Dysgenesis_Syndrome-deep-research-claude_code.md plus a 465-line .citations.md sidecar; both were committed. NEC gate was applied to the report BEFORE any of it was used: PPP2R3C named 136 times vs MAP3K1 32 and SOX9 40 (both legitimate partners in the curated mechanism), NR5A1 8, SRY 10; OMIM:618419 dominant with 9 occurrences; OMIM:600908 (4) is the merged legacy 46,XY agonadism entry that MONDO:0032738 also xrefs; OMIM:618420 (3) is the known allelic SPGF36 carrier entity; OMIM:615902 (1) was read in context and is the PPP2R3C *gene* record, not a competing disease; MONDO:0032738 is the only MONDO disease id in the report (7 occurrences). Gate passes. The report independently reproduced the Zhang 2022 n=16 tabulation already used for the frequency bands, corroborating them. It contributed exactly one item that primary triage had missed: a single-patient lymphocyte-subset abnormality in PMID:35812758 (already cached) - reduced CD19+ B cells (1.6%, ref 8.5-14.5%) and CD4+ T cells (21.5%, ref 30.0-46.0%). Added as HP:0010976 Decreased total B cell count and HP:0032218 Decreased CD4+ T cell proportion with NO frequency band, explicit n=1 framing in each description, and an OPEN KNOWLEDGE_GAP discussion (ppp2r3c_immunodeficiency_n_of_1) attaching to both phenotypes and carrying two proposed experiments. The gap's evidence item quotes the same patient's normal routine haematology, which is the reason an n=1 subset finding cannot be promoted to a syndrome feature. KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH was chosen because the issue is absent evidence at n>1, not model-to-human translation. The count-vs-proportion mismatch for HP:0010976 (the paper says decreased number but reports a percentage) is stated in the phenotype description rather than papered over. The report also confirmed two prior omissions were correct: no germ-cell tumour has been reported in any PPP2R3C patient, so no tumour-risk figure is asserted. Post-change validation at that commit: 51/51 snippets verified by both validate-references and scripts/check_snippets_verbatim.py; just validate, validate-terms, check_folded_hyphens and validate-history-all all passed; diff vs origin/main remained additive with no protected paths; references_cache churn from just validate was reverted before staging.

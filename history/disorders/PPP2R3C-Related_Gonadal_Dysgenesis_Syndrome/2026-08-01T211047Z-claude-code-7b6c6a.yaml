  details: |
    Created kb/disorders/PPP2R3C-Related_Gonadal_Dysgenesis_Syndrome.yaml for MONDO:0032738 (OMIM:618419, GDRM / Kennerknecht / myo-ectodermo-gonadal dysgenesis syndrome), causal gene PPP2R3C (hgnc:17485). NEC preflight: runoak confirmed MONDO:0032738 RO:0004003 HGNC:17485 (PPP2R3C) and the OMIM:618419 xref; PMID:34750818 independently asserts 'GDRM, MIM# 618419'. Both named differentials were OAK-verified rather than typed from memory: MONDO:0010765 (46,XY complete gonadal dysgenesis) and MONDO:0013410 (46,XY sex reversal 6, MAP3K1/HGNC:6848); neither is a superclass of MONDO:0032738, whose only asserted parent is MONDO:0003847 hereditary disease. Curated 4 pathophysiology nodes (PP2A B''gamma regulatory subunit loss; reduced gonadal SOX9 phospho-signaling; the PPP2R3C-MAP3K1 centriolar module, marked emerging and IN_VITRO; and organism-level hypergonadotropic hypogonadism), 21 phenotypes, a Ppp2r3c knockout mouse model, and two differential diagnoses. Contested-criteria discipline: Altunoglu et al. (PMID:34750818) explicitly did not support ocular or muscular involvement as major criteria, and did not observe carrier infertility; those are curated as supports=REFUTE evidence items alongside the supporting Guran et al. (PMID:30893644) items rather than silently reconciled. All frequency bands derive from a single pooled tabulation with an explicit denominator of 16 published individuals (PMID:35812758); facial dysmorphism observed 16/16 was banded VERY_FREQUENT rather than OBLIGATE because the facial gestalt is itself the ascertainment trigger. Added a PPP2R3C case fraction of 1 proband in a 70-patient Chinese 46,XY DSD series (PMID:37147882), stated as resolving to 1.4%. Documented negatives with literal search strings and date (2026-08-01): no GeneReviews chapter ('Kennerknecht syndrome GeneReviews[All Fields]' and 'PPP2R3C GeneReviews[All Fields]' both 0 hits); no HPO term for ovarian dysgenesis or teratozoospermia, with the candidate term lists audited and the rejected alternatives named. ORPHA evidence unavailable due to the known orphadata sha256 blocker (#7234/#7539/#7199/#7522); the manifest was not touched. Deliberately kept separate from kb/disorders/46_XY_complete_gonadal_dysgenesis.yaml, whose scoping note names PPP2R3C-related disease as out of scope; no content duplicated from it. Validated with just validate, validate-terms, validate-references (48/48 snippets), scripts/check_snippets_verbatim.py (48 verbatim), check_folded_hyphens.py, and validate-history-all. references_cache churn from just validate was reverted; only the 7 newly fetched PMID caches are staged.

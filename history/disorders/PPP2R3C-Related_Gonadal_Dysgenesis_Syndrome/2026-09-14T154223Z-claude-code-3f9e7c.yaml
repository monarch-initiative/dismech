  summary: 'Review round 3: replace retired-PARTIAL prose with directness: INDIRECT'
  details: |
    Responds to the third-round review on PR #8795. #10003 retired the PARTIAL evidence grade and migrated the values, but not the explanation prose that argued for them, so five evidence items in this file named a grade the schema no longer has while carrying supports: SUPPORT. CLAUDE.md records this failure mode under Retired Enum Values: prose naming a retired value is not caught by any gate, which is why every deterministic check was green.

    Blocking finding, the two items added by this PR: the JNK/B-cell downstream edge (PMID:35812758), where the quoted sentence is a review's hedged restatement of a mouse conditional-knockout result cited for a human edge; and the centrosomal to gonadal-dysgenesis edge (PMID:39317195), where the quote is a proposal advanced from cultured human cells cited for a human in-vivo edge. Both now carry directness: INDIRECT with explanations stating the inference step rather than the word partial. The standing caution against populating directness speculatively does not apply here because the assessment was already written out in the explanations themselves.

    Reviewer suggestion 2 taken: the SOX9 to gonadal-dysgenesis edge (PMID:30893644) quotes the authors' 'suggesting' inference clause rather than the measurement, so it is recorded INDIRECT as well. The sibling edge, where reduced SOX9 phosphorylation was measured directly in patient gonadal tissue, is left DIRECT.

    Two of the three #10003 backlog instances inherited from main were cleared in the same pass, since each push costs a full review cycle: the shared-cause proposal evidence on the JNK cascade node (PMID:39317195) and the growth-hormone height-gain treatment evidence (PMID:35812758), both now INDIRECT. The third instance, the 'lymphocyte counts were normal' item, had its retired-value wording removed but its grade deliberately left unchanged and raised as a question on the PR: whether a normal total lymphocyte count refutes an impaired-B-cell-survival node, or merely fails to bear on it, is a curation judgment rather than a mechanical substitution, and total counts can be normal while a B-cell subset is affected.

    Reviewer suggestion 1 (causal_link_type DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES on the centrosomal edge) was explicitly offered as a judgment call and is declined with reasoning recorded on the PR: DIRECT is defined at the current graph granularity, this entry's chain is coarse, and the epistemic hedge the reviewer is reaching for is now carried by directness: INDIRECT on that same edge.

    origin/main was merged forward again during this round. That was not cosmetic: check-snippet-grading, check-title-snippets and check-snippet-length grandfather their baselines against origin/main, so at 724 commits behind they failed on unrelated files (AIPL1, CRX, Congenital_Glaucoma, EYS, MPI-CDG, Tay-Sachs). Confirmed pre-existing by stashing the edits and re-running at clean branch HEAD, and confirmed unrelated by grepping each failure list for this entry (zero matches). All three pass after the merge.

    Validated: just validate, just validate-disorders (79/79 snippets verified), check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-grading, check-title-snippets, check-snippet-length, and validate-history.

  details: |
    Third session on this entry, responding to the ai4c-reviewer re-review of commit e6d41ba. Four IMPORTANT items were raised; all four are addressed here.

    (1) TREATMENTS - section added, three treatments, all from PMID:35812758, a PPP2R3C case report already cached in this PR. Bilateral Gonadectomy (NCIT:C15329 Surgical Procedure, SURGERY, targets HP:0025733) quoting the stated indication 'Considering the risk of gonadal malignancy, she underwent' and the procedure line. Post-Gonadectomy Estrogen-Progestin Replacement (NCIT:C15599 Hormone Replacement Therapy, SMALL_MOLECULE, therapeutic_agent CHEBI:23965 estradiol + CHEBI:31527 dydrogesterone, targets HP:0000815). Growth Hormone Therapy (NCIT:C15986 Pharmacotherapy, PROTEIN_REPLACEMENT, therapeutic_agent NCIT:C837 Somatropin, targets HP:0004322); the 2.5 cm height-gain quote is recorded as supports=PARTIAL because an uncontrolled gain over two years after a three-month course cannot be attributed to the drug. No quantified germ-cell-tumour risk is asserted anywhere: quoting a treating team's stated indication is a different claim from asserting an incidence, and the deep-research report confirms no tumour has been reported in any PPP2R3C patient. The generic DSD care the DR report enumerates (testosterone, calcium/vitamin D, psychosexual support, therapies, cochlear implantation) is still excluded because none of it is attested for any PPP2R3C patient in the cached references.

    ONTOLOGY DUE DILIGENCE ON THE TREATMENT TERMS. NCIT has no gonadectomy clinical-action term. Searched 2026-08-01 with runoak against sqlite:obo:ncit: 'l^Gonadectomy' 0 results, 'l~gonadectomy' 0 results, 'l~Gonad Excision' 0 results; 't~gonadectomy' returned exactly one hit, NCIT:C15288 Orchiectomy, audited and rejected because its definition is 'Surgical removal of one or both testicles' and this patient had streak gonads, not testes. NCIT:C15329 is therefore used with preferred_term 'bilateral gonadectomy'. The deep-research report proposed NCIT:C51642 as a possible Gonadectomy term 'if verified'; OAK shows NCIT:C51642 is 'Biopsy of Bile Duct', so it was NOT used - a concrete instance of why reviewer- and DR-suggested identifiers are re-verified rather than trusted. Reachability from NCIT:C25218 was confirmed with runoak ancestors for C15329, C15599 and C15986.

    (2) THREE MISSING PHENOTYPES ADDED, plus a fourth. Short stature HP:0004322 (snippet '148 cm tall (-3SD) at 18 years old and was diagnosed / with short stature'), Hypoplasia of the uterus HP:0000013 (two snippets, the 11-of-13 pooled statement and the ultrasound/laparoscopy statement), Limited elbow extension HP:0001377 (snippet 'bone age, and limited elbow extension also are common'). None carries a frequency band, and each description states why: short stature and limited elbow extension are not counted against the 16-individual denominator that every other band in this entry derives from, and the hypoplastic-uterus 11/13 figure is the 46,XY subset, a different denominator. Additionally added Streak gonad HP:0025733, which resolves the unconsumed :379 operative finding the reviewer flagged.

    (3) STREAK-OVARY NOTE RESCOPED, NOT DELETED. The clause previously read as an unqualified claim that the reports describe non-visualized rather than streak gonads. The note now says so explicitly, states that the rejection holds only for the 46,XX arm (PMID:34750818 'nonvisualized gonads', quoted), states that it does NOT hold for the 46,XY arm (PMID:35812758 'streak gonads and bilateral oviducts were found during the operation'), and records that HP:0025733 Streak gonad is now used for that patient. Search string, date and rejected candidate recorded: 't~streak' run 2026-08-01 against sqlite:obo:hp returned 14 terms including both HP:0010464 Streak ovary and HP:0025733 Streak gonad; HP:0025733 was chosen because the patient is 46,XY and the operative note says streak gonads.

    (4) HISTORY - a separate append-only record was added for the e6d41ba deep-research session (2026-08-01T221339Z-claude-code-07b2d1), and links.issues/links.prs were populated on the original CREATE record.

    SUGGESTIONS ALSO WORKED. GO:0007254 JNK cascade on the centriolar node now carries its own snippet from PMID:39317195. A new CELLULAR pathophysiology node 'Impaired JNK-Mediated B Cell Survival' (CL:0001201 B cell CD19-positive; GO:0001783 B cell apoptotic process INCREASED; GO:0001782 B cell homeostasis DECREASED) hangs off the molecular node and gives the two immunophenotypes a mechanistic arm; its third evidence item is supports=PARTIAL quoting 'lymphocyte counts were normal' so the node cannot be read as asserting a syndrome-level immunodeficiency. The KNOWLEDGE_GAP discussion gained the stronger prior-normals quote. A histopathology section was added for the oviduct-like gonadectomy material. PMID:42445464 is no longer single-use: it now also supports Gonadal dysgenesis (the 46,XX sibling with ovarian dysgenesis, the strongest support for the sex-chromosome-independent claim), renal agenesis, hearing loss and congenital heart defect. The MONDO:0032738 'agonadism, 46,XY, with intellectual disability, short stature, retarded bone age, and multiple extragenital malformations' synonym was added to synonyms.

    DECLINED. The 'mental retardation' variant of that MONDO synonym was not added - outdated terminology, identical denotation. The extragonadal SOX9/chondrogenesis pathophysiology bridge was not built: the source hedges it as 'might be related to', which is speculation about a mechanism rather than a finding, and this entry already keeps in-vitro/proposal-level content clearly demarcated. No diagnosis section was added: the two quotable sentences are about the diagnostic value of gestalt recognition and WES reanalysis, which is already stated in the description and carried by the diagnostic:true flags, and a Diagnosis block would restate it without adding criteria.


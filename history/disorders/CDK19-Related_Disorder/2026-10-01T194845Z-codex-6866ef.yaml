  summary: Review CDK19 clinical spectrum and allele-dependent kinase and mitochondrial
    mechanisms
  details: |
    Reviewed the complete entry and shared Mediator research report and citations; there is no dedicated CDK19 report. Read primary full texts for the 2010 inversion, 2020 founding series and CSF case, 2021 Thr31Asn case and cohort PDF, 2024 cytoplasmic mitochondrial study and 2026 patient-variant fly study. Corrected unsupported population prevalence, seizure-versus-encephalopathy frequency, cohort denominators, uniform kinase loss and added the variable diet responses. Added qualified phenotype coverage, allele records, G2P Strong assertion, diagnostics/differentials, atomic mechanisms, seven treatments, six animal models, three cell/biochemical models, one structural prediction and four interpretive gaps. Coverage is adequate for clinical findings, genetics, mechanisms, management and diagnostics; no established subtypes or patient histopathology were identified. Shared research themes centered on other Mediator genes were not transferred. Preserved nonprogressive MRI, negative and partial treatment/model results, experimental NACA scope and uncertainty of dominant-negative and human mitochondrial mechanisms. No GeneReviews or StatPearls chapter in the dated index; current CDK19 trial search returned no studies. No directly relevant public omics accession surfaced. All 145 quotations and 154 titles verify; shared-cache consumers verify 416/416 quotations. All caches generated through fetch-reference.

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding LOINC:55909-6 Alpha-L-iduronidase [Enzymatic activity/volume] in DBS plus the second-tier glycosaminoglycan codes LOINC:90233-8 Dermatan sulfate and LOINC:90235-3 Heparan sulfate [Moles/volume] in DBS. One reference range on the IDUA code from a pilot study that established cut-offs on 3000 dried blood spots (PMID:38135922, IDUA above 1.33 umol/L/h negative), with the population stating it is a pilot and the one-point half-open discrepancy noted; no operating programme's absolute IDUA cut-off was found in a PubMed abstract, and the search is written in the range notes. The North Carolina programme's 15 percent of daily mean rule (PMID:31133280) and the percentile-based GAG second-tier rule (PMID:41970633) are quoted as evidence, not banded. Bound LOINC Parts LP14016-7, LP15532-2 and LP15629-6 on the IDUA activity, dermatan sulfate and heparan sulfate markers, which name no specimen. The Urinary glycosaminoglycans marker was left unbound: it is a confirmatory urine test, not the screen analyte. Validated with the per-file gates, validate-disorders and the KB-wide snippet-grading gate.

  details: |
    Addressed the review of PR 14949. Added reference_title 'Hurler syndrome' to the five new ORPHA:93473 evidence items. Added causal edges: CNS glycosaminoglycan storage injury to Intellectual disability (PMID:28595941 review sentence; GeneReviews PMID:20301341 HSCT-cognition sentence, INDIRECT) and to Hydrocephalus (PMID:33517895 pre-HSCT hydrocephalus in a Hurler cohort; GeneReviews HSCT-prevents-hydrocephalus sentence, INDIRECT); Progressive skeletal and multisystem organ injury to Cardiomyopathy (PMID:30442189 myocardial GAG deposition and ERT response, both INDIRECT). No edge was added to Hypotonia: none of the cited caches has a sentence connecting storage to hypotonia. Hydrocephalus description now says Hurler syndrome rather than MPS I. All snippets come from already-cached references.

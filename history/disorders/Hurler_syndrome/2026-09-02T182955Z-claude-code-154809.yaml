  summary: Integrate assessed OpenScientist findings for the canonical IDUA/GAG hypothesis
  details: |
    Reviewed kb/hypotheses/Hurler_syndrome/canonical_idua_deficiency_gag_lysosomal_storage_model/openscientist.md and wrote the assessment sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml (overall_verdict SUPPORTED; 17 claims; 5 data_sources; 1 analysis, REPORTED_ONLY/UNVERIFIABLE). Integrated only RETAINED and QUALIFIED claims, each with a snippet re-derived from the local reference cache rather than copied from the report.

    Added evidence: PMID:23786846 (residual alpha-L-iduronidase activity gradient across MPS I subtypes) and PMID:39559959 (1,803 homozygous IDUA pseudodeficiency adults show no excess of MPS I features) on the mechanistic_hypotheses entry, which previously carried those quantitative claims in notes with no citation; PMID:31194252 (MPS I Registry genotype-phenotype gradient) on the IDUA genetic entry; PMID:8907377 (corneal clouding arises from stromal keratocyte storage, not endothelial dysfunction) plus a matching description sentence on the Corneal opacity phenotype; PMID:41966056 (first-in-human intracisternal RGX-111) on the AAV-IDUA gene therapy treatment, which asserted that case in prose without a reference; PMID:32713717 (restrictive lung disease in all treated MPS I patients) plus a description sentence on hematopoietic stem cell transplantation; PMID:41163043 (laronidase phase IV, urinary GAG reduction) on the enzyme replacement therapy target_mechanisms link.

    Added two discussions. mismatch_hurler_immune_requirement_for_aortic_disease (HUMAN_MODEL_MISMATCH) records that immunocompetent but not immunodeficient MPS I mice develop aortic dilation at equal urinary GAG (PMID:35165009), with a proposed experiment profiling explanted human valve and aortic tissue; the mouse result was not promoted to a pathophysiology node because the study is small, tissue GAG was never quantified, the strains differ in background, and no human test exists. gap_hurler_residual_disease_after_enzyme_restoration (KNOWLEDGE_GAP) records that persistent post-transplant burden (PMID:33517895) does not discriminate self-sustaining secondary cascades from irreversible pre-treatment damage plus poor enzyme delivery.

    Corrected the hypothesis notes, which attributed the immune co-factor to mast-cell activation in valves and myocardium (no cited source says this; the finding is inflammasome upregulation with macrophage and T-cell infiltration of the aorta), gave a pseudodeficiency cut-off of >1.8% residual activity (neither source supplies it), and asserted IDUA deficiency was both necessary and sufficient while also asserting GAG accumulation was not sufficient.

    Deliberately not integrated: the report's 0-2% pathogenic activity window (provider arithmetic across two incommensurable assays), its claim that dermatan sulfate is primarily responsible for corneal clouding (built on the false premise that MPS II lacks clouding), cathepsin B as an established cardiovascular driver (PMID:29366749 has no retrievable abstract, and PMID:35165009 found Ctsb upregulated in mice without aortic dilation), and every candidate ontology binding: HP:0000501 is Glaucoma not corneal clouding, HP:0001376 is Limitation of joint mobility not joint contracture, and GO:0072559 is NLRP3 inflammasome complex not inflammasome complex assembly. Status left CANONICAL, as the report itself recommends.

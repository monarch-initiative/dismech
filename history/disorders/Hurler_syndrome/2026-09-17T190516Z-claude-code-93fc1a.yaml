  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist assessment sweep (PR #12010 lane) that never merged, rebased onto current main rather than merged from the old branch.

    Nine citations added, each snippet re-derived and verified against a freshly fetched references_cache record (all nine records were absent from main and were fetched with just fetch-reference; five came back as full text where the original sweep had only abstracts). mechanistic_hypotheses: PMID:23786846 (fibroblast residual-activity gradient 0.18/0.27/0.79 percent) and PMID:39559959 (1,803 adults homozygous for IDUA pseudodeficiency alleles, no excess MPS I features) now source two numbers the notes already asserted uncited. phenotypes#Corneal opacity: PMID:8907377. genetic#IDUA: PMID:31194252 (538-patient registry genotype-phenotype). treatments#AAV-IDUA gene therapy: PMID:41966056, the single RGX-111 patient the description already asserted with no reference. treatments#Hematopoietic stem cell transplantation: PMID:32713717 (restrictive lung disease in all tested). treatments#Enzyme replacement therapy target_mechanisms: PMID:41163043 (laronidase -64.61 percent urinary GAG at week 26), giving the INHIBITS link a magnitude. Two new discussions carry PMID:35165009 (HUMAN_MODEL_MISMATCH, immune requirement for murine aortic dilation) and PMID:33517895 (KNOWLEDGE_GAP, residual burden after enzyme restoration).

    Nothing was skipped as already covered: none of the nine PMIDs appeared anywhere in main, and each attaches to a node that still exists under the same name.

    Three prose corrections were still needed against main current text and were applied. The hypothesis notes called IDUA deficiency necessary and sufficient two sentences before saying GAG accumulation is not sufficient; it now reads as the necessary upstream cause. The notes attributed the cardiovascular immune co-factor to mast-cell activation in valves and myocardium, which appears in no cited source and not even in the provider report; it now states the actual mouse finding (inflammasome upregulation with medial macrophage and adventitial T-cell infiltration of the ascending aorta, immunocompetent but not immunodeficient animals) and flags the human counterpart as untested. The unsourced greater-than-1.8-percent pseudodeficiency residual-activity cut-off was removed as provider arithmetic over two incommensurable assays. Beyond the sweep, the notes growth-factor pathway list read FGF/IGF/BMP; the provider report mentions neither IGF nor BMP anywhere (FGF 8 hits, Wnt 7, IGF 0, BMP 0), so it now reads FGF and Wnt. The Corneal opacity description gained the stromal-keratocyte localization, phrased as maintains corneal dehydration per the source rather than the sweep's stroma wording. The HSCT description gained the disease-modifying-not-curative qualification that PMID:32713717 and PMID:33517895 support.

    No ontology identifiers were added. Every candidate the report proposed denotes something else (HP:0000501 is Glaucoma, offered for corneal clouding; HP:0001376 is Limitation of joint mobility, offered for joint contracture), matching the original sweep's rejection.

    Assessment sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml copied across byte-identical (sha256 804ef721...).


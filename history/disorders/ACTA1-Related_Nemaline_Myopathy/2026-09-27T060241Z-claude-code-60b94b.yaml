  summary: 'Review round 1: split bundled nodes, regrade background quotes'
  details: |
    Single bundled response to the CHANGES_REQUESTED review on PR #12958 (review 5328694844).

    Pathophysiology. 'Defective Actin-Tropomyosin Interaction and Sarcomeric Disorganisation' was split into 'Defective Actin-Tropomyosin Regulation' (MOLECULAR, tropomyosin binding GO:0005523 DYSREGULATED) and 'Sarcomeric Disorganisation' (CELLULAR, sarcomere organization GO:0045214 DECREASED). The separability is now evidenced rather than asserted: PMID:17387733 reports the CFTD variants carrying the actin-tropomyosin defect with normal sarcomeric structure on electron microscopy, and concludes weakness there follows from disrupted sarcomere function rather than structure. The two nodes are parallel consequences of mutant-actin incorporation, not a chain, because that is what the dissociation shows. The recessive null route no longer passes through the regulatory node - a null allele produces no mutant actin to mis-regulate tropomyosin - and points straight at reduced force generation with PMID:25182138 evidence, where the edge previously had none. 'Nuclear Envelope Disruption and Intranuclear Rods' became 'Nuclear Envelope and LINC Complex Disruption' and lost its near-circular edge into rod formation, which rested on a co-occurrence snippet; intranuclear rods stay on the rod node.

    A 'Mitochondrial Dysfunction in ACTA1-Mutant Myofibres' node (CELLULAR; ATP metabolic process GO:0046034 DECREASED, regulation of mitochondrial membrane potential GO:0051881 DYSREGULATED) was added from PMID:36796746, and the H40Y iPSC model now RECAPITULATES it at MODERATE fidelity with two readouts, instead of PARTIALLY_RECAPITULATES on a force node it does not observe. The PROXY_QUANTITY and SCALE_EXTRAPOLATION divergences are gone because they no longer apply; BOUNDARY_OMISSION (no rods) stays and POPULATION_MISMATCH (single dominant allele) was added.

    Evidence grading. Three PMID:23736297 background sentences were regraded off MODEL_ORGANISM: the poison-peptide statement (two sites) to HUMAN_CLINICAL + quote_role BACKGROUND, and the cardiac/skeletal isoform identity fact to OTHER + BACKGROUND. The paper's own knockout and survival results keep MODEL_ORGANISM. All four PMID:22825594 items carry quote_role REVIEW_SYNTHESIS.

    Subtypes. The 'subtype: Dominant' tags on Neonatal Respiratory Distress and Arthrogryposis Multiplex Congenita were removed: recessive ACTA1 genotypes reported to 2014 all produced severe weakness from birth, so the tags told a reader recessive patients do not get those features. No replacement subtype-scoped phenotype was added, because no clinical feature in the entry is supported as dominant- or recessive-specific by its own source; the note records that.

    References. PMID:20301436, the retired congenital fibre-type disproportion chapter cited in the malignant-hyperthermia note, is now in the top-level references with tags [GeneReviews] and a finding, and its counselling statement that ACTA1 variants are often de novo dominant is cited on the Genetic Counseling treatment. check-genereviews now reports TAGGED for both chapters and no CITED_UNTAGGED.

    Also: tirasemtiv bound to CHEBI:755074 as therapeutic_agent (OAK lookup, not memory); Nutritional Support moved off therapeutic_modality BEHAVIORAL to OTHER; directness INDIRECT recorded on the speculative incorporation-to-rod edge and on the two other inferential edges added here.

    Declined: a cardiomyopathy phenotype. The ~5% figure is a deep-research claim attributed to PMID:40661861, whose cached abstract does not contain it, it spans all ACTA1 phenotypes rather than nemaline myopathy, and ACTA1-related dilated cardiomyopathy is a separate out-of-scope entity. The gap is recorded in notes instead.

  summary: 'Create: ACTA1-Related_Nemaline_Myopathy'
  details: |
    Created a gene-defined entry for ACTA1-related nemaline myopathy, anchored on MONDO:0008070 (CMYO2A / NEM3), which was bound nowhere in kb/ before this change. The lump/split call is recorded in the entry's notes: MONDO:0008070 is defined by its gene and is filed by MONDO beneath four severity bands of nemaline myopathy at once, so it cannot be added as a has_subtypes row to kb/disorders/Nemaline_Myopathy.yaml, which splits on severity. Orphanet corroborates the crossing: ORPHA:171430 and ORPHA:171436 both list OMIM:161800 as a Broader cross-reference. A narrowMatch-only mapping on the parent entry, proposed in the claim issue thread by an automated second opinion, was rejected because it would retire the concept from the curation queue without adding an ACTA1-specific pathograph. Nemaline_Myopathy.yaml was not edited. Scope is ACTA1 nemaline myopathy; the non-nemaline ACTA1 histologies sit under MONDO:0100084 alpha-actinopathy, recorded as a broadMatch, and are stated out of scope in notes and differential_diagnoses. Deep research: falcon was requested and returned HTTP 402 (out of credits), so the run fell back to claude_code; the report is committed with fell_back true in its frontmatter. Its reference_validation reports 25/25 references resolved, 7/9 quotes valid and needs_review true; just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0008070, and the manual check passed (report OMIM 161800 matches MONDO's, top gene ACTA1=90). No content was taken from the report without checking the primary source; the two references carrying unsupported quotes (PMC:PMC3447773, PMID:15236405) are not cited in the entry. Evidence gaps recorded in notes: no ACTA1-specific population prevalence figure could be sourced, so no prevalence block was written; several phenotype frequencies come from mixed-genotype nemaline myopathy cohorts and each such evidence item says so. The GeneReviews nemaline myopathy chapter (PMID:20301465) is retired, which is recorded as a Finding on the top-level references block and tagged GeneReviews. Validation: just validate passed with 93/93 snippets verified and 1 title checked; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values and list-gene-term-mismatches all clean; check-genereviews reports TAGGED with no CITED_UNTAGGED. Noted for the repository: the deep-research run's own reference validation rewrote two committed references_cache files (PMID_35810298, PMID_36960434), downgrading PMID_35810298 from full text to abstract; both were reverted before commit.

  summary: Review CACT deficiency using full-text clinical and mechanistic evidence
  details: |
    Comprehensive review against the Falcon report/citation sidecar, cached disease-specific literature, and the full GeneReviews PDF (clinical description, diagnosis, molecular genetics, counseling, treatment, surveillance and precautions). Replaced bundled mechanisms with 13 atomic nodes; distinguished established energetic deficiency from proposed lipid toxicity and NAG/CPS1 effects. Corrected unsupported frequency bands and historical/population denominator extrapolations. Added ventricular tachycardia, reduced ejection fraction, CK/acidosis, cognitive and renal manifestations. Separated hepatic NCIT microvesicular steatosis from extrahepatic findings and recorded the autopsy VUS limitation. Merged SLC25A20 entries with ClinGen-attributed Definitive validity, variant classes and conditional recurrence counseling. Added screening/confirmation/CPT2 differential and at-risk sibling testing. Replaced CACT treatment-effect claims from a zero-CACT mixed cohort with uncontrolled CACT-specific triheptanoin cases; included MCT chain-length limitations, carnitine controversy, mixed carglumic response, investigational ketones, feeding/rehabilitation and surveillance. Added the NCT03773770 expanded-access record, preserving AVAILABLE in notes because the enum lacks that status. Added the SLC25A20 structural/dynamics model with explicit proxy and disease-lesion limitations.
    Completeness: phenotype coverage adequate; clinical severity spectrum represented without separate mechanistic subtypes; proximal and downstream mechanisms covered with uncertainty preserved; treatments/access programs covered; gene/allele depth and external validity covered; biomarkers and diagnostic limitations covered; verified high-value references consumed; overall deep-research coverage adequate. No central dataset accession was identified in the reviewed sources. Full text obtained and read for PMID25614308,33024728,36835358,37305732,38628283,39203843,39375714,27590926 and GeneReviews. PMID33634872 and28689308 full-text retrieval remained unavailable; claims use cached abstracts where appropriate, without importing unverified details. PMID39375714 contains no CACT patients. A CAPTCHA response from PMC5953892 is excluded. ClinGen current export checked October4 retains the cited Definitive assertion. DR preflight CPT2 warning resolved as differential/shuttle/mixed-cohort context; unresolved DOI10.22037/ghfbb.v17i4.2960 not used. Independent PR review remains a separate gate.

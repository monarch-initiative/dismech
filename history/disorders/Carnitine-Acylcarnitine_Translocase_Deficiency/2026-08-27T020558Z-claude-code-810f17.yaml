    Added molecular_functions: GO:0015227 (O-acyl-L-carnitine transmembrane transporter activity), modifier DECREASED, to the pathophysiology node "SLC25A20 transporter molecular function deficiency" -- the node a genetic: entry lands on in the pathograph. The node was literally named a molecular function deficiency and its description already asserted reduced translocase activity, with only GO:0015879 carnitine transport bound.

    Targeted from the genetic[].mechanism_activity_grounding QC metric (dismech.qc_plugins): the gene reached the mechanism graph but the node it landed on named no molecular function, so the pathograph stated what the cell could no longer do without stating what the protein could no longer do. GO term verified against OLS as a live molecular_function before binding; preferred_term carries the gene-specific reading, term.label the canonical GO label. Validated with linkml-validate (Disease) and just validate-terms (labels + MolecularFunctionTerm enum membership, both passing); the entry now scores 100% on mechanism_activity_grounding. No other slot touched, no evidence added or changed.

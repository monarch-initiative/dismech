  details: >-
    Reviewed and refined Sarcoma_Of_Cervix_Uteri: (1) Added top-level category:
    Cancer and added uterine cervix (UBERON:0000002) locations to cervical
    pathophysiology nodes (while keeping the pleiotropic germline DICER1
    Syndrome Predisposition node without a cervix-restricted location). (2) Added
    GO molecular_functions with DECREASED modifiers to DICER1 Loss of Function
    and miRNA Dysregulation (GO:0004525 ribonuclease III activity) and Tumor
    Suppressor Loss and Genomic Complexity (GO:0003700 DNA-binding transcription
    factor activity, GO:0140658 ATP-dependent chromatin remodeler activity), and
    added RB1 (hgnc:9884) and PTEN (hgnc:9588) to genes on Tumor Suppressor Loss
    and Genomic Complexity, while keeping DICER1 and GO:0004525 off Sarcomatous
    Overgrowth in Adenosarcoma. (3) Added diagnosis entries (DICER1 Genetic
    Testing backed by PMID:31900434 findings on excluding ERMS when wild-type
    and germline prevalence, and Expert Histopathologic and Molecular Review
    backed by PMID:36114030). (4) Added quote_role: REVIEW_SYNTHESIS to
    PMID:36114030 and PMID:33135284 review-synthesis evidence items, added
    therapeutic_modality on Multi-Agent Chemotherapy (SMALL_MOLECULE) and
    Genetic Counseling (OTHER), updated classifications.icdo_morphology
    evidence, and added mappings.mondo_mappings (MONDO:0016280 skos:exactMatch).

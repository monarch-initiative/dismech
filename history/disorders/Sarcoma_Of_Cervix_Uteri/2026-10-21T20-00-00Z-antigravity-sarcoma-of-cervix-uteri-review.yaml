  summary: >-
    Reviewed Sarcoma_Of_Cervix_Uteri: grounded pathophysiology nodes with
    molecular_functions (with DECREASED modifiers) and tumor-suppressor genes,
    removed DICER1/GO:0004525 from Sarcomatous Overgrowth in Adenosarcoma and

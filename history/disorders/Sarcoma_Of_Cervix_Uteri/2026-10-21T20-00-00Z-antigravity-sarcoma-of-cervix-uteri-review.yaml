    replaced mismatched treatment evidence with notes, and updated
    icdo_morphology evidence.
  details: >-
    Reviewed and refined Sarcoma_Of_Cervix_Uteri: (1) Added GO
    molecular_functions with DECREASED modifiers to DICER1 Loss of Function and
    miRNA Dysregulation (GO:0004525 ribonuclease III activity) and Tumor
    Suppressor Loss and Genomic Complexity (GO:0003700 DNA-binding transcription
    factor activity, GO:0140658 ATP-dependent chromatin remodeler activity), and
    added RB1 (hgnc:9884) and PTEN (hgnc:9588) to genes on Tumor Suppressor Loss
    and Genomic Complexity. (2) Removed DICER1 and GO:0004525 from Sarcomatous
    Overgrowth in Adenosarcoma (since DICER1 alterations occur in only a subset
    of adenosarcomas) and removed UBERON:0000002 (uterine cervix) from the
    pleiotropic germline DICER1 Syndrome Predisposition node. (3) Added
    diagnosis entries (DICER1 Genetic Testing backed by PMID:31900434 findings on
    excluding ERMS when wild-type and germline prevalence, and Expert
    Histopathologic and Molecular Review backed by PMID:36114030). (4) Added
    quote_role: REVIEW_SYNTHESIS to PMID:36114030 evidence items, replaced
    mismatched treatment snippets on Surgical Resection and Multi-Agent
    Chemotherapy with explanatory notes, and updated classifications.icdo_morphology
    evidence.

  summary: 'Create: Spondylo-ocular_Syndrome'
  details: |
    New entry for spondylo-ocular syndrome (MONDO:0011604), an autosomal recessive linkeropathy caused by biallelic XYLT2 variants. A Perplexity deep-research report (research/Spondylo-ocular_Syndrome-deep-research-perplexity.md) was used as a lead list only. Its reference validation resolved all 6 extracted references; its term validation flagged GO:0030205 and CL:0000201 as obsolete and GO:0005578 as mislabelled, and none of these were used. just preflight-dr passed (XYLT2 mentioned 133 times; OMIM 259770 appears only as the osteoporosis-pseudoglioma differential). Report claims that were not adopted: HGNC:13454 for XYLT2 (the correct identifier is hgnc:15517); attribution of the first XT-II activity study to 'Munteanu' with an unverified quotation (the cited PMID:17194707 is Voglmeir et al.; the entry quotes its abstract directly); cardiomyopathy attributed to PMID:29136277, whose abstract does not report it; 80-90% phenotype frequencies with no source (frequencies were instead taken from the 22-patient literature tally in PMID:34925453); and the statement that no Xylt2 mouse model exists (Xylt2-/- mice are described in PMID:17517600, PMID:30778123 and PMID:32965647 and are curated here with limitations). Primary literature was found by PubMed search for XYLT2 and spondyloocular syndrome and fetched with just fetch-reference. The causal chain runs XT-II deficiency -> impaired glycosaminoglycan chain initiation -> tissue nodes for bone, lens/retina, inner ear and heart -> 16 of 17 phenotypes; facial dysmorphism is left unconnected because no mechanism is reported. just check-genereviews reported no GeneReviews chapter. Validated with just validate, validate-terms, count-verified-snippets (78/78), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, the whole-KB snippet/title/grading/hyphen/coarse/reference-title gates, and validate-disorders.

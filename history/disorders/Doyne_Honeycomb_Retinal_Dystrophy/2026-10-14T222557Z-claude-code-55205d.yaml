  summary: 'Review round: dark adaptation term, EFEMP1 molecular function'
  details: |
    Delayed dark adaptation is now bound to HP:0030513 Difficulty adjusting from light to dark instead of HP:0000662 Nyctalopia. The source (PMID:11913893) describes difficulty passing from light to dark, which HP:0030513 names directly, while nyctalopia is a different symptom. The phenotype description no longer claims that HPO has no dark-adaptation term: an OLS search for l~dark returns HP:0030513. The Fibulin-3 R345W Misfolding and Impaired Secretion node now binds GO:0005201 extracellular matrix structural constituent with modifier ABNORMAL. That is EFEMP1's UniProt molecular function annotation (Q12805), and ABNORMAL rather than DECREASED because the variant is a toxic gain of function. This clears the gene-activity grounding CI gate. The anti-VEGF treatment description now says its MONOCLONAL_ANTIBODY modality covers bevacizumab and ranibizumab, and that aflibercept is a receptor-Fc fusion protein. Its target_mechanisms description now says the agents neutralise secreted VEGF rather than lowering VEGF expression. The photoreceptor dysfunction node gains a model-only evidence item from PMID:35943778 reporting decreased mitochondrial function in the neural retina of the knock-in mouse. No GO process was added to the RPE lysosomal dysfunction node: the cited study reports lysosomal dysfunction and reduced TFEB transcripts, and no single GO process term was measured.

  summary: 'Create: Doyne_Honeycomb_Retinal_Dystrophy'
  details: |
    New entry for Doyne honeycomb retinal dystrophy / malattia leventinese
    (MONDO:0007471), scoped to the EFEMP1 c.1033C>T p.(Arg345Trp) disease that
    MONDO and ClinGen (Definitive, AD) describe. The stub
    stubs/Doyne_Honeycomb_Retinal_Dystrophy.yaml is deleted.

    Content: 11 pathophysiology nodes forming one causal graph from fibulin-3
    misfolding and impaired secretion through RPE ER stress, VEGF induction,
    abnormal Bruch's membrane ECM, alternative complement activation, NLRP3
    inflammasome activation, impaired RPE cholesterol efflux and lysosomal
    dysfunction, to sub-RPE deposit and drusen formation, photoreceptor
    dysfunction over deposits, and RPE degeneration. 15 HPO-bound phenotypes,
    all causally connected. Genetic record with the R345W variant, ClinGen
    validity assertion, autosomal dominant inheritance with incomplete
    penetrance and variable expressivity, two diagnosis rows, four treatments
    (anti-VEGF for CNV, low-energy laser, genetic counseling, a preclinical
    allele-specific ASO), the Efemp1 R345W knock-in and Efemp1 knockout mouse
    models (the knockout as a FAILS_TO_RECAPITULATE link), and a patient iPSC-RPE
    experimental model. 126 snippets from 37 PubMed records plus the ClinGen
    and Orphanet records, all verified against the cache.

    Deep research: research/Doyne_Honeycomb_Retinal_Dystrophy-deep-research-openscientist.md.
    Reference validation: 16/16 references resolved, 0 off topic.
    Term validation flagged six mislabelled CURIEs (for example UBERON:0002423
    given for macula, HP:0011506 given for macular drusen); none of the
    report's term suggestions were used, and all bindings were looked up
    independently. just preflight-dr returned WARN only because the
    abbreviation RPE (retinal pigment epithelium) was counted as a gene symbol;
    the report names EFEMP1 30 times and cites OMIM 126600, matching MONDO.
    Report citations not used: PMID:39464028 (bioRxiv preprint of the
    published PMID:41198612, which is cited instead), PMID:17659362 (general
    AMD review, not specific to this disease), and PMID:32911658 (review whose
    gain-of-function point is covered by primary data).

    Scope decisions recorded in notes: Orphanet ORPHA:75376 is a broader
    autosomal dominant drusen concept that includes CFH and CFI; EFEMP1
    juvenile open-angle glaucoma and the p.Arg140Trp peripheral
    chorioretinal degeneration are separate diseases. No GeneReviews chapter
    exists (check-genereviews --online: NO_CHAPTER). A ClinicalTrials.gov search
    found no disease-specific trial; NCT03011541 (a broad stem cell study) was
    not included. Orphanet phenotype frequencies were not used because they
    describe the broader Orphanet concept.

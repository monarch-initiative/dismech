  summary: 'Create: peroxisome biogenesis disorder 6A (Zellweger) (MONDO:0013936,
    PEX10)'
  details: |
    De-novo curation of MONDO:0013936 as a DISEASE entry, following the committed 1B/2B/3A/4A/4B/11A/11B per-PEX-gene precedent rather than folding into a parent. PBD6B is kept out as a differential on the 4A/4B analogy, and the PEX10 ataxic form is carried as a third differential. Pathograph: biallelic severe PEX10 genotype, loss of the C-terminal RING ligase, failure of peroxisomal matrix protein import with membrane import intact, loss of peroxisomal metabolic function. Two knowledge gaps, one of which is the point of the entry: the functional complementation assay behind every residual-activity claim about PEX10 was described by its own authors as seriously flawed after returning near-normal activity for alleles deleting most of the protein. That caveat is carried in the quoted snippet (kept whole rather than trimmed to its supportive clause), in the explanation, and as its own KNOWLEDGE_GAP, because EvidenceItem has no slot for a method caveat. Validated: just validate (33/33 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass.

  summary: Fix a folded-scalar hyphen split that turned CI red
  details: |
    check_folded_hyphens went red on the approved head. An explanation string wrapped after 'Zellweger-', so YAML folding would have inserted a space mid-compound and produced 'Zellweger- phenotype' in the rendered text. Reflowed so the compound stays on one line. No content change: the same words, the same evidence, the same claim.

    Pushed on its own despite the approval it costs, because a red head is not a state a PR waits in. Nothing else was outstanding on this PR to bundle with it: all five blocking findings and all three optional ones from the review were resolved in the previous push.

    Worth noting for the record why this reached CI at all. I ran the per-file gates after that push (just validate, entity refs, causal targets, duplicate keys, enum values, qualifier terms) but not check-folded-hyphens, which takes no file argument and sweeps the whole KB, so it sits outside the fast per-file loop and is easy to skip. The 45 of 45 snippet verification does not catch it either: the hyphen split is in an explanation, not a snippet.

    Validation after the fix: check-folded-hyphens clean, schema clean, terms clean, 45 of 45 snippets verified, entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

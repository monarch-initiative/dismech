  details: |
    Response to ai4c-reviewer changes-requested on PR #11621. Every quoted sentence in the review was verified against the cache before acting; all eight verified. Blocking: (1) tags GeneReviews added to PMID:20301621 per the 4A convention; (2) inheritance now quotes the 25/50/25 transmission-risk sentence rather than the diagnostic-strategy one, which supported a different claim from the one it was attached to; (3) progression section added with first-year mortality and absence of developmental progress, the prognostic fact that defines the severe band; (4) PMID:12794690 cited, correcting this entry's own prevalence framing - it reported eleven severe-band PEX10 patients on a shared founder 2-bp deletion plus a Japanese population rate, while the entry said four patients was the scale it was curated at, and the founder allele is now in genetic with the note that Japanese severe-band genotypes are not an independent sample; (5) a Failure of PEX5 Receptor Recycling node added, typed PROVISIONAL. On (5) the review's own suggested source, PMID:20679226, is Arabidopsis and its abstract does not in fact make the PEX5-ubiquitination claim, so PMID:19687296 was fetched instead - it demonstrates ligase activity for Pex10 specifically, in yeast, and is cited MODEL_ORGANISM/INDIRECT with the description rewritten to say the human step is inferred from conserved architecture rather than demonstrated. Optional items also taken: polymicrogyria/pachygyria phenotype from PMID:18415699 with HP:0002126 verified against the cache; supportive-care modality BEHAVIORAL changed to OTHER since the row spans gastrostomy, surgery and vitamins; oral cholic acid added as its own treatment; PMID:19127411 added to the assay-reliability gap as a second independent failure mode (a real PEX10 defect with entirely normal fibroblast studies); PMID:28784167 added to the PBD6B differential. Re-validated: 45/45 snippets verified (was 33/33), terms, entity-refs, duplicate-keys, causal-targets, enum-values, qualifier-terms all pass.

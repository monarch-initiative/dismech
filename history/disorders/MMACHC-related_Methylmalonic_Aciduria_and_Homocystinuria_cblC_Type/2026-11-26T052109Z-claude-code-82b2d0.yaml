  summary: 'Gene-family review: MMACHC'
  details: |
    MMACHC's processing node bound the generic GO:0016491 oxidoreductase activity beside cobalamin binding. MMACHC's two catalytic activities on incoming cobalamins are flavin-dependent reductive decyanation of cyanocobalamin (PMID:18779575) and glutathione-dependent dealkylation of methyl- and adenosylcobalamin, which is impaired in cblC (PMID:19801555); the node now binds GO:0033787 cyanocobalamin reductase (cyanide-eliminating) (NADP+) activity and GO:0016765 in place of the generic term, both DECREASED, keeping GO:0031419 cobalamin binding, and cites both papers. The node description already named decyanation and dealkylation. The genetic record's inheritance block is now bound to HP:0000007; the CAUSATIVE typing and ClinGen Definitive tier were already correct.

  summary: Enhanced cblC disorder entry with classifications, inheritance, prevalence, progression, differential
    diagnoses, expanded phenotypes, diagnostic workup, treatments, and MMACHC variant and mechanistic
    annotations
  details: 'Added Harrison''s chapter and ICIMD cobalamin_metabolism classifications; autosomal recessive
    inheritance (HP:0000007) with variable expressivity and sibling recurrence risk (PMID:20301503); GO:0031419
    (cobalamin binding, DECREASED), GO:0016491 (oxidoreductase activity, DECREASED), and germline loss-of-function
    genetic context on the root MMACHC pathophysiology node; additional retinopathy and pulmonary hypertension
    mechanistic/phenotypic evidence (PMID:18454408, PMID:40468431, PMID:41728752); Megaloblastic anemia
    (HP:0001889) wired downstream of Impaired methionine synthase-dependent remethylation via methylfolate
    trapping (directness: INDIRECT); seven additional phenotypes (Spastic paraparesis HP:0002313, Atypical
    behavior HP:0000708, Microcephaly HP:0000252, Feeding difficulties HP:0011968, Global developmental
    delay HP:0001263, Encephalopathy HP:0001298, Hemolytic-uremic syndrome HP:0005575) wired into pathophysiology;
    biochemical and MMACHC molecular diagnostic entries, hydroxocobalamin/betaine/surveillance GeneReviews
    citations, and avoidance of dietary methionine/protein restriction and nitrous oxide/catabolic triggers
    in treatments (PMID:20301503); ClinGen DEFINITIVE gene-disease validity and additional pathogenic
    variants (c.482G>A, c.158T>C, c.80A>G); differential diagnoses distinguishing other intracellular
    cobalamin defects and nutritional B12 deficiency; global rare prevalence and China MMA proportion
    (PMID:37770946); early-onset vs late-onset progression phases; and a complete top-level references
    list.'

  summary: Reviewed MMACHC-related methylmalonic aciduria and homocystinuria, cblC type entry for clinical completeness and ontology coverage
  details: >-
    Audited the existing cblC entry against cached primary literature and ClinGen gene-disease
    validity records. Identified missing top-level blocks (classifications, inheritance,
    differential_diagnoses, prevalence, progression, references), missing molecular function
    and genetic context annotations on the root MMACHC pathophysiology node, missing hematologic
    phenotype coverage (megaloblastic anemia), and additional recurrent late-onset/cardiopulmonary
    MMACHC variant annotations.
- type: EDIT
  outcome: changed
  sections:

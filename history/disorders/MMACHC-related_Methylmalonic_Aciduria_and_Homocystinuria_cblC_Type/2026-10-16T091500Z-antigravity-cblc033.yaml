  - progression
  - references
  summary: Enhanced cblC disorder entry with classifications, inheritance, prevalence, progression, differential diagnoses, megaloblastic anemia phenotype, and expanded MMACHC variant and mechanistic annotations
  details: >-
    Added Harrison's chapter and ICIMD cobalamin_metabolism classifications; autosomal recessive
    inheritance (HP:0000007) with variable expressivity; GO:0031419 (cobalamin binding, DECREASED)
    and germline loss-of-function genetic context on the root MMACHC pathophysiology node;
    additional retinopathy and pulmonary hypertension mechanistic/phenotypic evidence (PMID:18454408,
    PMID:40468431, PMID:41728752); Megaloblastic anemia (HP:0001889) linked to combined
    methylmalonic acidemia and homocystinuria injury; ClinGen DEFINITIVE gene-disease validity
    and additional pathogenic variants (c.482G>A, c.158T>C, c.80A>G); differential diagnoses
    distinguishing other intracellular cobalamin defects and nutritional B12 deficiency; global
    rare prevalence and newborn screening data; early-onset vs late-onset progression phases;
    and a complete top-level references list.

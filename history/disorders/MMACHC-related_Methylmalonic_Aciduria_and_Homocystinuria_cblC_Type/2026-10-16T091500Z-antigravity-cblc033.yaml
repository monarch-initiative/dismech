  summary: Reviewed MMACHC-related methylmalonic aciduria and homocystinuria, cblC type entry for clinical
    completeness and ontology coverage
  details: Audited the existing cblC entry against cached primary literature and ClinGen gene-disease
    validity records. Identified missing top-level blocks (classifications, inheritance, differential_diagnoses,

  summary: Separate the folate-mechanism and folate-rescue claims on the valproate
    factor
  details: |
    The valproate factor asserted that the risk is 'distinct from folate status' and that neuropore closure fails 'independent of maternal folate status'. Neither cited snippet supports an independence-from-folate mechanism: PMID:27189655 enumerates anticonvulsant therapy among non-genetic maternal risk factors, and PMID:23790957 states the HDAC activity without excluding the folate branch. Reworded both to keep the epidemiological independence and drop the mechanistic claim, naming the two drug-target steps curated in Fetal_Valproate_Syndrome. Separately added PMID:20680999, the spina-bifida-specific case-control study, as a REFUTE item bounding the folic acid factor's protective claim to the antiepileptic-unexposed stratum, with the authors' power caveat recorded in the explanation. Validated with just validate, count-verified-snippets (113/113 across both entries), check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys.

  summary: Add BMP-antagonism DLHP-failure mechanistic hypothesis
  details: |
    Added an EMERGING mechanistic hypothesis (bmp_antagonism_dlhp_failure): loss of dorsal BMP antagonism (Noggin, downstream of Zic2) prevents dorsolateral hinge point bending and leaves the spinal neural folds open. Evidence is mouse embryo work (PMID:17693602, PMID:16712836; the latter attributes the Noggin-null spinal defect to somite malformation rather than to DLHP failure, recorded in the explanation) and the Berkhout et al. 2025 cellular Potts agent-based model (PMID:40034255, BioStudies S-ONTX34). The hypothesis is the target of simulation runs of that model.
- type: EDIT
  outcome: changed
  sections:
  - pathophysiology
  - mechanistic_hypotheses
  - evidence
  summary: Wire the hypothesis into the pathograph and split the Stottmann evidence
  details: |
    Added the pathophysiology node Failed Dorsolateral Hinge Point Formation (GO:0021504 neural fold hinge point formation and GO:0030514 negative regulation of BMP signaling pathway, both DECREASED; UBERON:0005062 neural fold), with a DIRECT downstream edge to Failed Posterior Neuropore Closure carrying hypothesis_groups [bmp_antagonism_dlhp_failure] and its own PMID:17693602 evidence. Split the PMID:16712836 item into a SUPPORT item (Noggin-null pups have lumbar spina bifida) and a REFUTE item quoting the abstract's attribution of the spinal lesion to somite malformation under excess BMP4, and noted the competing route in the hypothesis description. Added reference_title to every new evidence item. Validated with just validate, validate-terms, count-verified-snippets (64/64), check-entity-refs, check-causal-targets and check-reference-titles.

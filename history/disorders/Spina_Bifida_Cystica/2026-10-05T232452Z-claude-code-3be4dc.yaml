  summary: Add BMP-antagonism DLHP-failure mechanistic hypothesis
  details: |
    Added an EMERGING mechanistic hypothesis (bmp_antagonism_dlhp_failure): loss of dorsal BMP antagonism (Noggin, downstream of Zic2) prevents dorsolateral hinge point bending and leaves the spinal neural folds open. Evidence is mouse embryo work (PMID:17693602, PMID:16712836; the latter attributes the Noggin-null spinal defect to somite malformation rather than to DLHP failure, recorded in the explanation) and the Berkhout et al. 2025 cellular Potts agent-based model (PMID:40034255, BioStudies S-ONTX34). The hypothesis is the target of a simulation run of that model through OpenScientist using the new templates/hypothesis_model_simulation.md template. Validated with just validate and count-verified-snippets (61/61).

  summary: Bind maternal serum and amniotic fluid AFP panel LOINC codes to the existing
    screening row
  details: |
    LOINC tranche K batch 1. The existing Maternal Serum and Amniotic Fluid Alpha-Fetoprotein Screening diagnosis row already carried an NCIT diagnosis_term (NCIT:C74732 Alpha-fetoprotein Measurement) but no LOINC measurement, and already covers both specimens as one declining-secondary-screening claim rather than two separable claims, so both panel codes were added to that single existing row rather than splitting it: LOINC:48802-3 (Alpha-1-Fetoprotein panel - Serum or Plasma) and LOINC:58735-2 (Alpha-1-Fetoprotein panel - Amniotic fluid), the same codes bound to Anencephaly in this same batch. The entry makes no mention of acetylcholinesterase (confirmed by a grep of the file), so no AChE code was added here, unlike Anencephaly. Both codes were already seeded in cache/loinc/terms.csv from the Anencephaly edit earlier in this same PR; both were verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main.

  summary: 'Create: Spina Bifida Cystica'
  details: |
    New root Disease entry (MONDO:0017069) with has_subtypes for Meningocele (MONDO:0017076 posterior meningocele) and Myelomeningocele (MONDO:0019773). Deep research via falcon (Edison Scientific); frontmatter reference_validation reported 11/11 references resolved, 0 confabulations, 3 off-topic flags reviewed by hand and confirmed as genuine (low-vocabulary-overlap) myelomeningocele outcome papers, not NEC. just preflight-dr returned SKIP (MONDO records no single causal gene for this complex/multifactorial disorder, as expected) -- manual MONDO synonym/definition check confirmed no entity confusion. Pathophysiology chain: MTHFR-mediated impaired folate/one-carbon metabolism and VANGL1/VANGL2-mediated planar-cell-polarity/convergent-extension disruption (both trigger nodes) leading to Failed Posterior Neuropore Closure, then subtype-specific branches: Open Neural Placode Exposure and Secondary Injury (the Heffez et al. 1990 two-hit hypothesis, PMID:2362676) for Myelomeningocele, versus Skin-Covered Meningeal Herniation for Meningocele. The Myelomeningocele branch continues to Chiari II Hindbrain Herniation (cross-referencing, not duplicating, kb/disorders/Congenital_Hydrocephalus.yaml's more detailed CSF-dynamics mechanism per that entry's own scope-boundary note) and Segmental Motor/Sensory Neuron Loss. Folate modeled as an environmental entry with influences_mechanisms using environmental_effect PROTECTS_AGAINST (MRC Vitamin Study RCT PMID:1677062, plus mouse gene-environment evidence from the 2024 Vong et al. Science 22q11.2/CRKL paper PMID:38696583); the link carries its own evidence separate from the environmental entry's top-level evidence. Also curated the 2024 Vong et al. 22q11.2 deletion/CRKL finding as an additional high-confidence genetic driver beyond the issue's named VANGL1/VANGL2/MTHFR genes, since it is a major, well-validated recent addition to spina bifida cystica genetics. Treatments: postnatal surgical closure, prenatal (fetal) MOMS-trial repair (PMID:21306277, PMID:31980545 school-age follow-up), clean intermittent catheterization for neurogenic bladder, and orthopedic management. Validation observed: schema pass; 38/38 snippets verified against cached references (just count-verified-snippets); validate-terms pass; check-duplicate-keys pass (whole-KB, 4394 files); check-environmental-evidence pass; just validate-disorders (batched pre-PR sweep, the same check CI runs) pass with 0 issues. No DOI references used -- all citations are PMID-keyed and snippet-verified.

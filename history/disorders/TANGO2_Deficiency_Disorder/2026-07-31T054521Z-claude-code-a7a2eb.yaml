  details: |
    Created the TANGO2 Deficiency Disorder entry (MONDO:0018820, TANGO2/hgnc:25439) for issue #7209, building on an interrupted prior session that had left a 51-line skeleton, a completed Falcon deep-research report, and 31 newly fetched references_cache files. NEC preflight passed: runoak confirmed MONDO:0018820 carries RO:0004003 HGNC:25439 (TANGO2) and the Falcon report is genuinely about TANGO2 deficiency disorder, not 22q11.2 deletion syndrome as a whole nor a different rhabdomyolysis disorder. Duplicate preflight passed: no standalone TDD entry or PR exists on origin/main; TANGO2 mentions there are confined to the 22q11.2_Deletion_Syndrome entry as a second-diagnosis red flag. The Falcon report cited DOIs rather than PMIDs, so it was treated strictly as leads: every PMID was independently resolved and fetched with just fetch-reference, and several of the strongest sources used (73-patient natural history PMID:36473599, TRPM4/QT mechanism PMID:42389941, acyl-CoA-binding PMID:40015245, CRYAB/desminopathy PMID:40480980, oligodendroglial mouse PMID:42522778) post-dated or were absent from the report. Content: 13 pathophysiology nodes forming a connected pathograph from catabolic stress exposure and TANGO2 loss of function through lipid/acyl-CoA homeostasis failure, impaired mitochondrial fatty-acid oxidation, catabolic-stress metabolic decompensation, and three effector arms (skeletal myofiber necrosis, acute metabolic encephalopathy, and cardiomyocyte ATP depletion leading to arrhythmogenic substrate and ventricular tachyarrhythmia), plus a parallel oligodendroglial myelin arm; 26 phenotypes with OAK-verified HPO terms; 2 genetic blocks including the 22q11.2-deletion-in-trans unmasking route; structured prevalence (BAND_1_9_PER_1000000 and ULTRA_RARE) using the structured slots rather than the deprecated percentage field; a 4-phase progression; 10 treatments; 1 clinical trial (NCT05374616); 2 diagnosis blocks and 4 differential diagnoses; 3 animal models and 2 experimental models. Module conformance declared on six nodes: metabolic_intoxication_decompensation at Toxic Metabolite Accumulation and Energy Deficit, Acute Metabolic Decompensation, and Acute Metabolic Encephalopathy; cardiac_ion_channel_repolarization at Altered Action Potential and Calcium Handling, Arrhythmogenic Substrate and Triggered Activity, and Ventricular Tachyarrhythmia. Both module trigger nodes were deliberately NOT claimed and the reasons are recorded in the entry notes: TANGO2 is a lipid-binding protein rather than a metabolic enzyme, and TDD reaches the arrhythmogenic substrate via metabolic ATP depletion and secondary TRPM4 upregulation rather than an inherited ion-channel variant. B-vitamin supplementation is curated at the evidence strength the literature actually supports rather than as established standard of care: the treatment description states explicitly that no randomized trial exists, and PARTIAL evidence items record the source authors' own hedges plus the sustained-supplementation safety caveat. Frequency bands were assigned only where a source supplies a whole-cohort numerator and denominator (developmental delay 17/20 VERY_FREQUENT, hypothyroidism 12/20 FREQUENT, metabolic crisis 46/71 FREQUENT); crisis-conditional proportions such as 100 percent QTc prolongation, 78 percent VT, and 74 percent cardiac arrest were left unbanded with an explicit context note so that no band contradicts its own quoted number. Validation: just validate passed (schema plus reference checks), just validate-terms passed, just compliance reported 93.9 percent global and 94.1 percent weighted. A programmatic whitespace-normalised substring check of all 152 evidence snippets against their references_cache bodies found 0 mismatches and 0 missing cache files. Graph integrity was checked programmatically: 0 dangling downstream targets, 0 orphaned pathophysiology nodes, all 6 conforms_to references resolve to real module node names, and all treatment target_mechanisms resolve. The roughly 7300 references_cache files dirtied by just validate were reverted; only the 29 cited new cache files, the 11 legitimately updated cache term CSVs, the KB entry, the research artifacts, and this history record are staged. The single Falcon artifact is a markdown summary table rather than an image, so no evidence item carries an images attachment.

    Self-review pass. The entry was re-reviewed in fresh context with the dismech-pr-review skill before pushing, and every finding was fixed. Blocking: added the missing top-level references block tagging PMID:29369572 as GeneReviews, and mined the previously unmined GeneReviews GENETIC COUNSELING section (25 percent recurrence risk, carrier/prenatal/preimplantation testing, and evaluation of at-risk relatives) onto the inheritance and Genetic Counseling blocks. High: retagged six evidence items from HUMAN_CLINICAL to OTHER where the quoted sentence was a background or framing statement in an in vitro, Drosophila, or iPSC-cardiomyocyte paper rather than that paper's own clinical observation, and added genuine clinical support alongside them (PMID:31339582 for lactic acidosis, PMID:39641377 for regression); removed two claims that no cited abstract supports (cardiolipin fall, smaller myofibers); reattributed the mitochondria-lipid-droplet-ER contact-site localization from PMID:40015245 to PMID:36961129 and added that snippet; corrected a numerical overstatement (about two-thirds of those who have a metabolic crisis progress to a cardiac crisis, which is 42 percent of all affected individuals, not two-thirds of all affected individuals). Medium: downgraded the PMID:38855866 B-complex item to PARTIAL and removed the false claim that it was an independent cohort (it reports the same Baylor natural history as PMID:36473599); split two mixed-source snippets so each evidence item carries a single evidence_source; sourced the magnesium greater-than-2.2 mg/dL target and the crisis monitoring panel from GeneReviews. Low: cited PMID:42420940 on the 22q11.2-in-trans genetic block so the two entries share a source; changed the nonstandard parent string Inherited Neurodegenerative Disorder to the established Neurodegenerative Disease; downgraded two surveillance-only phenotype evidence items to PARTIAL; added Delayed speech and language development (HP:0000750) and Spasticity (HP:0001257) phenotypes; added a clinical_trials block for NCT05374616. Post-fix validation: just validate passed, just validate-terms passed, 152 of 152 snippets verified as exact whitespace-normalised substrings with 0 mismatches, compliance 93.9 percent global and 94.1 percent weighted, graph integrity re-verified clean.

  summary: 'Phenotype review: TANGO2_Deficiency_Disorder'
  details: |
    Reviewed all 26 phenotypes for snippet-claim consistency, HPO term optimality, and pathograph explanation. All 154 pre-existing snippets verified as exact substrings and read in whole-abstract context; none were wrong-disease, negated, or title-as-snippet, and no evidence_source was miscoded. Substantive changes: rebound Cerebral Atrophy (HP:0002059) to Global brain atrophy (HP:0002283) and renamed the phenotype to match, because the sole supporting quote and the entry description both say global brain atrophy, which HPO codes separately. Converted three leftover free-text 'recorded as PARTIAL' evidence explanations on phenotypes to the schema's directness: INDIRECT slot (PARTIAL was removed from the supports enum in #7439). Added five new HUMAN_CLINICAL evidence items from PMID:30245509 and PMID:39665114 that replace management-recommendation and surveillance-recommendation inferences with direct cohort observations, for Torsade de Pointes, Feeding Difficulties, Hypotonia (baseline as well as spell-associated), Seizures, and Muscle Weakness (acute rhabdomyolysis-associated). Assigned frequency bands to Seizures (FREQUENT, 10/14) and Feeding Difficulties (FREQUENT, 8/14) now that cohort denominators are cited. Pathograph: the entry had 12 well-evidenced pathophysiology nodes but zero edges reaching any phenotype, so phenotype connectivity was 0/26. Added 19 downstream edges from existing nodes only, no new pathophysiology nodes: the decompensation node to Hypoglycemia and Lactic Acidosis; the myofiber necrosis node to Rhabdomyolysis, Elevated Creatine Kinase, Myoglobinuria and Muscle Weakness; the encephalopathy node to Acute Metabolic Crisis with Encephalopathy and Seizures; the cardiomyocyte ATP node to Cardiomyopathy; the arrhythmogenic substrate node to QT Prolongation; the tachyarrhythmia node to Ventricular Tachycardia, Torsade de Pointes and Cardiac Arrest; the oligodendroglial node to Ataxia; and the neurodegeneration node to Global Brain Atrophy, Intellectual Disability, Developmental Regression, Spasticity and Global Developmental Delay. Connectivity is now 19/26 (73%). Three edges that required an inference step carry their own evidence and causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES: seizures from crisis physiology, ataxia from the mouse oligodendroglial finding (evidence marked directness INDIRECT as a model-organism result), and global developmental delay from the progressive course. Deliberately left seven phenotypes unconnected rather than manufacturing edges, and recorded three KNOWLEDGE_GAP discussions explaining why: TANGO2 spells have no published neurophysiological mechanism at all; hypothyroidism affects 12/20 patients with no mechanistic account in any source; and the chronic motor and bulbar features (dystonia, dysarthria, hypotonia, speech delay, feeding difficulty) cannot be attributed to the oligodendroglial cerebellar-myelin arm, whose published finding is specifically motor coordination. Validation: just validate, count-verified-snippets (165/165), validate-terms, check-duplicate-keys, check-entity-refs, snippet-length/title-snippet/folded-hyphen ratchets, and validate-disorders all passed.

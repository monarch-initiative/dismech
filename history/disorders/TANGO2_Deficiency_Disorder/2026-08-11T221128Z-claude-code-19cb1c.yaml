  summary: Link catabolic stress and anaesthetic exposure, flagging a node-scope gap
  details: |
    Backfill for issue #8085. Catabolic stress is TRIGGERS with DIRECT into the node named for it, which describes this disorder as stress-unmasked: the genotype is present from conception and the acute phenotype requires an extrinsic catabolic challenge, so exposure and node are the same thing and the cited GeneReviews chapter enumerates exactly the precipitants the node lists. Anaesthetic exposure is deliberately pointed elsewhere, at the metabolic decompensation node rather than at the catabolic stress node, and the link description states why rather than leaving it implicit: an anaesthetic is not obviously a catabolic challenge, and the upstream node is defined by catabolism, so routing this trigger through it would misdescribe the exposure. That is a real gap in the graph, which wants a general trigger node rather than a catabolism-specific one. The anaesthetic link is graded INDIRECT_UNKNOWN_INTERMEDIATES with supports PARTIAL because the authors hedge the finding themselves and identify neither the responsible agents nor a mechanism, which is also why the entry's practical recommendation is perioperative planning rather than a blanket contraindication. Validated with linkml-validate and just validate-terms.

  summary: 'Create: Rhabdoid Tumor Predisposition Syndrome 1'
  details: |
    Created kb/disorders/Rhabdoid_Tumor_Predisposition_Syndrome_1.yaml for MONDO:0012252, the germline SMARCB1 predisposition. The KB already curated Atypical_Teratoid_Rhabdoid_Tumor and Rhabdoid_Tumor on the somatic side, both referring to germline predisposition in prose with no entry behind it; design decisions section 3a asks for the germline syndrome to be separate. Five pathophysiology nodes follow the two-hit chain from the germline allele through somatic second hit, BAF complex destabilisation, failure of enhancer-mediated differentiation, and tumorigenesis. Six phenotypes including the schwannomatosis allelic presentation, a genetic block, two treatments, and one animal model with modeled_mechanisms. The conditional Smarcb1/Nf2 mouse is recorded as RECAPITULATES with MODERATE fidelity and explicit limitations, since its tumours arise in cranial nerves and meninges rather than the infratentorial sites typical of human ATRT and it uses conditional somatic deletion rather than a constitutional allele. Two independent lines explain why one gene gives two syndromes: allele position and truncation status from the schwannomatosis cohort, and developmental timing of loss from the mouse model. There was no stub for RTPS1; none was created since the curation supersedes it. Deep research: falcon returned HTTP 403 for an invalid EDISON_API_KEY and the run fell back to claude_code via --fallback-provider, recorded in the report frontmatter. Report references resolved 16 of 16, confabulation_rate 0.0, no off-topic or unresolved identifiers. One snippet initially quoted the ACNS0333 trial title and was replaced with the primary endpoint and survival results. All bindings resolved independently from committed caches and exact-match OLS queries. Validated with just validate, 21 of 21 snippets verified, plus check-duplicate-keys, check-entity-refs, validate-terms, check-title-snippets and check-snippet-grading.

  summary: 'Address review: GeneReviews baseline, site-specific evidence, diagnosis
    and surveillance'
  details: |
    Second review response on PR 10287. Located the GeneReviews chapter for both RTPS types by PubMed search rather than trusting an asserted number: PMID:29215836, identified by its absent journal source and 1993 book date, matching NBK469816. Added a references block tagged GeneReviews to each entry and mined the chapter across all four domains. Clinical characteristics supplied the fix for the reviewer's item 9: the generic one-third germline proportion quote had been attached to two site-specific phenotypes it does not mention, and is now replaced by the CNS site distribution sentence on the ATRT phenotype and the anatomical location list on the renal one, with the greater-than-70-percent synchronous presentation sentence on the multifocal phenotype. Diagnosis supplied a new diagnosis section in each entry carrying the molecular criterion. Management supplied an age-stratified surveillance treatment for RTPS1 and, for RTPS2, the risk-reducing bilateral salpingo-oophorectomy discussion and the six-monthly pelvic ultrasound that extends its surveillance window beyond the RTPS1 schedule. The salpingo-oophorectomy entry preserves the GeneReviews hedge that this is a discussion requiring interdisciplinary counselling rather than a standing recommendation. Genetic counseling supplied the penetrance contrast that had been removed in the previous commit for lack of support and is now restored with two direct quotes: most RTPS1 probands carry a de novo variant with very high penetrance, whereas most reported RTPS2 probands inherited from a clinically unaffected parent and penetrance appears incomplete. One validation detail worth recording: a references block keyed on a PMID has its title field checked against the cache, unlike a url-keyed one, so the title must be the exact cached title. Validated end to end on both files with just validate, check-entity-refs, check-duplicate-keys, check-folded-hyphens, and a scripted audit confirming every reference_title matches its cache.

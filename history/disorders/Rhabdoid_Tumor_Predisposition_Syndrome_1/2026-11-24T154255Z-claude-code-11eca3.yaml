  summary: 'Edit: Rhabdoid_Tumor_Predisposition_Syndrome_1 — cribriform neuroepithelial
    tumor in two germline carriers from one series'
  details: >-
    Adds a Neoplastic phenotype row, Cribriform Neuroepithelial Tumor, a tumor reported in two
    germline SMARCB1 carriers, with four evidence items from the 2017 series of ten children with
    that tumor (PMID:27380723): that in two patients a SMARCB1 mutation was also present in the
    germline; that one boy's germline exon 6 duplication was inherited from his apparently healthy
    mother and grandmother (both DIRECT for carrier status only); the series' conclusion that the
    tumor is SMARCB1-deficient and non-rhabdoid (INDIRECT, since it does not speak to germline
    carriers); and where the tumors were (INDIRECT, since it describes all ten tumors). All four
    sentences are also quoted in the Cribriform_Neuroepithelial_Tumor entry, with the same
    evidence_source and quote_role; the conclusion and location items are DIRECT there and INDIRECT
    here, because this row's claim is about carriers. HPO has no term for the tumor; the row binds
    HP:0030063 Neuroepithelial neoplasm, and its notes record the HPO searches, the trade-off
    against HP:0030692 Brain neoplasm, that the series does not call these carriers' families
    rhabdoid tumor predisposition syndrome and likens the boy's family to a Dutch family with
    unaffected carrier fathers, why the row sits in this entry and that its path from the germline
    loss-of-function node is an assumption, that under the diagnosis row's results the carriers'
    status turns on whether their variants are pathogenic, and why it is wired as it is. A causal
    edge from Somatic Inactivation of the Second SMARCB1 Allele to the row carries three items, all
    INDIRECT: loss of SMARCB1 protein expression on immunohistochemistry in all ten tumors (with the
    series' caveat that a truncated protein with some residual function cannot be entirely
    excluded), the two germline carriers, and the series' Figure 3 legend on second-allele hits. The
    first two of these sentences are also quoted in the Cribriform_Neuroepithelial_Tumor entry,
    DIRECT there and INDIRECT here, with the same evidence_source and quote_role. Validated with
    just validate-disorders, just validate, just validate-terms, just count-verified-snippets, just
    check-snippet-grading, just check-coarse-phenotypes, just check-causal-targets and the other
    whole-repo gates CI runs.

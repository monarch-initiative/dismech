  summary: 'Create: Trichodysplasia Spinulosa'
  details: |
    De-novo curation of trichodysplasia spinulosa (MONDO:0016455), a TSPyV (NCBITaxon:862909) folliculocentric skin disease of the immunosuppressed. Chain: loss of immune control -> productive TSPyV infection of inner root sheath keratinocytes -> T-antigen-driven hyperproliferation (LT-pRB, mT-PP2A/MEK-ERK) -> dysplastic follicle and keratin spicule formation. Phenotypes: follicular papules with spicules, alopecia, leonine facies, pruritus. Two-phase progression; treatments: reduce immunosuppression, topical cidofovir, oral valganciclovir. Not a module conformer (polyomavirus; dysplasia not neoplasm). 22 snippets exact-matched; all gates clean. Deep research claude_code.

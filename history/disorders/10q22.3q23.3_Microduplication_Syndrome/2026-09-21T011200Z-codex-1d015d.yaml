  summary: Review regional duplication evidence and recover full-text phenotype coverage
  details: |
    Reviewed the whole entry, all existing evidence, and the matching Falcon
    deep-research report and citations. Independently checked claim-to-source
    alignment and phenotype specificity. The entry had no prior REVIEW event.

    Source coverage: PMID:21248748 previously claimed full-text availability but
    contained the abstract and publisher landing-page material without the
    Results, tables or Discussion. Regenerated it with just fetch-reference
    after adapting the ignored local PMC provider to the modern PMC article
    container and HTML fallback. The resulting cache includes the actual article,
    Table 2 and Figure 3 captions; Figure 2 was also inspected for gene position.
    No reference cache was hand-edited. PMID:26383923 and the Siggberg 2010 DOI
    cache were read as abstracts; their unavailable full text was not treated as
    verified evidence. The latter abstract does not establish its reported
    individual 10q case and adds no independently quotable disease-specific claim.

    Corrected deletion-to-duplication extrapolation: GRID1 and NRG3 candidate
    assignments came from deletion-side findings, and PTEN is outside the
    recurrent interval shown in Figure 2. Retained BMPR1A only as the hypothesis
    proposed independently in the 2015 duplication case. Separated the proposed
    NAHR event from increased DNA dosage, removed unsupported expression and
    developmental-process assertions, and used unknown-intermediate clinical
    links. Individual facial findings no longer arise causally from a facial
    gestalt node. Findings confined to atypical or additionally confounded
    individuals are retained as observations without an asserted causal edge.

    Added 13 specific phenotypes from the full-text table, figure caption and
    Discussion, removed the redundant facial gestalt, and broadened mild
    intellectual disability to the severity range actually documented. The
    table represents four individuals because two siblings share a column;
    neither column counts nor the report's 3/3 estimates are population
    frequencies. Patient 12 has an additional 16p13.11 deletion, and the table
    and Discussion disagree about that patient's speech delay. Small intragenic
    NRG3 duplications considered likely nonpathogenic by the authors are not
    used to attribute tetralogy of Fallot or genital anomalies to this syndrome.

    Content-completeness checklist:
    - Phenotypes: adequate for the verifiable regional-duplication evidence;
      23 specific observations cover the major supported organ-system themes.
      No frequency estimates were inferred from the ascertained case series.
    - Subtypes: adequate scope distinction between recurrent and overlapping
      gains; no independently established mapped subtypes were identified.
    - Pathophysiology: adequate for available evidence. More detailed neural,
      cardiac and chromatin mechanisms in the report remain hypotheses without
      duplication-specific experimental support; no invented GO bindings added.
    - Treatments/trials: no trial-supported treatment surfaced. The report's
      supportive-care suggestions are explicitly expert-practice inference and
      are not stated in the cited primary text. This is a non-blocking evidence
      gap; unsupported treatment snippets were not manufactured.
    - Genetics: adequate CNV and inheritance scope, reduced penetrance and
      candidate-gene qualification. No verified modifier or expression study.
    - Diagnostics/biomarkers: array-based diagnosis backed by Methods and the
      2015 SNP-array case. No validated biochemical biomarker was identified.
    - References: the principal full-text source is now actively mined across
      clinical, inheritance, mechanistic and diagnostic findings. All 33
      evidence items have source-consistent titles and exact cached snippets.
    - Overall consumption: central verifiable findings are represented; the
      report's denominator mistakes and reciprocal-deletion extrapolations
      were corrected against the primary source rather than imported.

    Identity preflight: the automated gene-based check skips this multigene CNV;
    manual review confirmed MONDO:0017180 and its synonyms, ORPHA:276422,
    GARD:21052 and MEDGEN:1682781 against the disease concept. GeneReviews and
    StatPearls checks found no chapter in the 2026-09-10 Bookshelf snapshot.
    Live HPO lookup supported HP:0410018 for recurrent ear infections without
    assuming otitis media; the obsolete impaired-social-interaction term was
    replaced by its current HP:0012760 mapping. Existing coarse cardiac binding
    remains appropriate because the accessible abstract specifies only a defect.

    Validation: schema, ontology terms and all 33/33 cached snippets pass.
    Causal targets, entity references, duplicate keys and coarse phenotype
    checks pass. An independent peer review checked table denominators,
    confounding, ontology specificity and the revised mechanistic claims.

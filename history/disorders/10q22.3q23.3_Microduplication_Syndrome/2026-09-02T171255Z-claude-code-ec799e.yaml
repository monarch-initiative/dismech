  summary: 'Create: 10q22.3q23.3 Microduplication Syndrome'
  details: |
    Created the entry for the recurrent LCR3-LCR4 duplication at 10q22.3q23.3, the reciprocal of the better-characterised microdeletion. Deep research was run with falcon; that report cited only two sources (no PMIDs, two DOIs), so the evidence base was built by direct PubMed search instead. Primary sources are van Bon et al. 2011 (PMID:21248748), the cohort describing six duplications and the duplication facial gestalt, speech/motor delay and reduced penetrance, and Tang et al. 2015 (PMID:26383923), the duplication case report adding microcephaly, cardiac defect and mild intellectual disability. The pathograph is modelled as NAHR between LCR3/LCR4 -> increased dosage of the interval -> phenotypes, with edges to the case-report phenotypes marked INDIRECT_UNKNOWN_INTERMEDIATES because no interval gene has been established as the driver; BMPR1A and GRID1 are recorded as candidates in the sources' own hypothetical terms. Hypotonia and behavioural difficulty were dropped from the initial draft because no cited source supported them. The cytoband convention conflict (10q22.3q23.2 vs 10q22.3q23.3 for the same rearrangement) is recorded in the entry description. Validated with just validate (17/17 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms.

  summary: Make recovered PMC full text reproducible from repository code
  details: |
    Addressed the sole automated-review blocker: the original full-text cache
    depended on an ignored local upstream provider adaptation. The repository
    patch now prefers PMC XML but recovers the canonical modern PMC HTML article
    when XML has no body or raises an external service/parser exception. It
    preserves table cells, captions and inline token boundaries, and rejects
    challenge pages and long abstract/reference-only responses. The existing
    XML preference, snippet matcher and validation configuration are unchanged.

    A fresh uv-synced virtual environment with unmodified upstream dependencies
    successfully regenerated the full article using just fetch-reference and
    the canonical public PMC URL. PMC intermittently returned challenge pages
    on subsequent requests. After the final abstract-only guard and inline-table
    refinements, the cache was regenerated again with just fetch-reference while
    replaying the earlier unmodified HTTP article response at the requests.get
    boundary. No cache text was created or edited manually. The response replay
    only substitutes network transport; extraction and cache serialization use
    the committed repository code and the fresh dependency environment.

    Independent peer review identified the abstract-only and inline-table cases;
    both now have regression coverage. All 45 targeted provider/frontmatter/
    network-patch tests pass. The final generated cache verifies all 33 snippets
    in this disorder and all 103 in the other cache consumer, WAPL-related
    developmental disorder. Schema, ontology and reference validation pass for
    both entries; the follow-up history record also validates. No additional
    disease-content changes were requested by the automated reviewer.

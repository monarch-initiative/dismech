  summary: 'Create: Autosomal_Recessive_STAT1_Deficiency'
  details: |
    New entry for autosomal recessive STAT1 deficiency (MONDO:0013427, immunodeficiency 31B; OMIM 613796), caused by biallelic loss-of-function STAT1 variants. Modelled as two subtypes, Complete (null alleles, infantile onset, usually fatal without HSCT) and Partial (hypomorphic alleles, milder and curable). The pathophysiology runs from biallelic STAT1 loss into three branches: loss of IFN-gamma GAF signalling leading to failed macrophage activation and uncontrolled mycobacterial infection; loss of type I and III interferon ISGF3 signalling leading to a failed antiviral state and severe herpesvirus and live-vaccine virus disease (both ISGF3 nodes conform to innate_antiviral_interferon_response); and loss of IL-27 signalling, linked to the mycobacterial node with causal_link_type UNKNOWN because the source says only 'possibly contributing'. Both infection branches lead to hemophagocytic syndrome with unknown intermediates. Phenotype frequencies come from the 32-patient Le Voyer 2021 cohort (PMID:34183371), which is the phenotype baseline because no GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). ClinGen Definitive AR tier copied from the CGGV record. IUIS 2024 places the AR form in Table 6 section 3 (predisposition to severe viral infection), not in the MSMD section the deep-research report suggested. AD STAT1 LOF (IMD31A) and STAT1 GOF (CMC) are excluded and named in the description only. Two discussions: HLH mechanism without IFN-gamma signalling (KNOWLEDGE_GAP), and whether persisting non-hematopoietic STAT1 deficiency causes post-HSCT lung disease (HUMAN_MODEL_MISMATCH). Source: research/Autosomal_Recessive_STAT1_Deficiency-deep-research-claude_code.md (23/23 references resolved, none off topic). Validation: validate, validate-terms, count-verified-snippets (75/75), entity-ref, causal-target, duplicate-key and block-scalar checks pass.

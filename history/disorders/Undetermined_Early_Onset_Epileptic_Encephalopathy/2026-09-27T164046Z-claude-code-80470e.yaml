  summary: 'Genetics pass: add DEE33 and DEE45 subtype rows with EEF1A2 and GABRB1,
    wire four phenotypes'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0014625 DEE33 / EEF1A2 and MONDO:0014942 DEE45 / GABRB1). Neither CURIE
    appeared anywhere in kb/ before this change, and neither gene had a dismech entry.

    Anchor test. MONDO:0018614 is correct and unchanged. It carries no gene axiom of
    its own, all five pre-existing `has_subtypes` rows resolve to children of it, and
    both issue rows are children too, so neither the over-broad nor the reciprocal
    test finds anything.

    Rows. Both are now `has_subtypes` rows following the DEE21 pattern already
    established here for a child class with no dedicated entry: the row binds the
    gene, and a `genetic` record scoped to the row carries the mechanism. DEE33
    (EEF1A2) cites PMID:32196822, a cohort of 14 further individuals that functionally
    validated the variants and concluded they act by haploinsufficiency. DEE45
    (GABRB1) cites PMID:40472023, whose voltage-clamp work splits the reported variant
    set into eight gain-of-function missense variants, seen only in severe early-onset
    disease, and one loss-of-function variant in a milder febrile-seizure family; the
    row is explicitly scoped to the gain-of-function end of that split.

    Wiring. Gene-to-mechanism coverage went 5/5 to 7/7 - both new genes were bound as
    `genes:` descriptors on the Early developmental brain network dysfunction node,
    which is the entry's declared convergence point for its child classes and already
    carried four gene bindings in exactly this form. Phenotype causal inlink went 3/7
    to 6/7: Abnormal EEG wired from the network node, Intellectual disability from the
    Developmental encephalopathy node, and Drug-resistant epilepsy as a `sequelae` of
    Early-onset epileptic seizures carrying the 24-month cohort outcome. Hypotonia is
    left unwired and now carries a `notes:` field saying why - it has no evidence item
    of its own and nothing in the entry's sources attaches it to a mechanism.

    Three sentences elsewhere in the entry asserted that DEE21 was the only child
    class without a dedicated dismech entry. That is false once DEE33 and DEE45 are
    added, so all three were rewritten, and the entry's `notes:` now also enumerates
    the nine further children of the anchor that this pass identified but did not
    rule on, since they are outside the issue's row list.

    Two new reference caches are committed, PMID_32196822.md and PMID_40472023.md.
    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, 51 snippets verified in this file, within a 643/643 verification across the
    ten files this PR touches.

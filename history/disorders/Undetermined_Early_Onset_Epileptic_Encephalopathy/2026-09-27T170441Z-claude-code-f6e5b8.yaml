  details: |
    Review round 1 on PR #13028. Two changes. First, two sentences in the top-level notes described the curation session rather than the disease: one said standalone entries for DEE21/DEE33/DEE45 were 'recorded here as follow-ups rather than done in this pass', and one said the nine uncurated MONDO:0018614 children 'were enumerated during the d2g pass for dismech#12274 but are outside that issue's row list'. Both were rewritten to state the repository fact instead - that no entry exists for the three, and that none of the nine is dispositioned - keeping the enumerated lists, which are useful to a curator, and dropping the reference to which pass produced them. CLAUDE.md asks that notes hold facts checkable independently of who wrote them or when. Second, the first PMID:32196822 item on the EEF1A2 genetic record quotes 'have previously been described in association with intellectual disability and epilepsy but never functionally validated', which reports work published before this paper; it now carries quote_role BACKGROUND, with the explanation saying so. The second item from the same paper, quoting the haploinsufficiency mechanism the report itself established, is unchanged and remains IN_VITRO. Validation: just validate passed, count-verified-snippets 280/280 across this round's three files.

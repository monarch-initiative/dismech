  summary: 'Genetics pass: subtype-scoped genes, NECAP1 mechanism, four genes moved
    to differential diagnoses'
  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189). This was
    the judgement call of the tranche, so the reasoning is recorded at length.

    What the anchor is. MONDO:0018614 takes its definition from Orphanet:442835 and
    names the residual category: early-onset epileptic encephalopathy before a
    specific gene-defined subtype has been assigned. MONDO nevertheless gives it
    sixteen is_a children, every one a numbered developmental and epileptic
    encephalopathy defined by a causal gene under the disease_series_by_gene
    pattern. This entry declares five of them as has_subtypes rows: DEE13, DEE21,
    DEE24, DEE25, DEE26.

    Rule applied. A gene is recorded in this entry only when the gene-defined MONDO
    class it causes is a child of MONDO:0018614, and it is then scoped to that
    child's has_subtypes row rather than asserted of the anchor. A flat gene list on
    a class whose definition is "undetermined" would contradict what the entry is
    for, which is the umbrella hazard the campaign brief warns about.

    Changes:
    - Bound the defining gene on each of the five subtype rows, each with its own
      evidence: DEE13 to SCN8A (hgnc:10596), DEE21 to NECAP1 (hgnc:24539), DEE24 to
      HCN1 (hgnc:4845), DEE25 to SLC13A5 (hgnc:23089), DEE26 to KCNB1 (hgnc:6231).
      The rows previously carried the placeholder description "A MONDO child subtype
      of undetermined early-onset epileptic encephalopathy" and named no gene at all.
    - Replaced the genetic section. It previously held SCN1A, KCNQ2, STXBP1 and
      CDKL5, unscoped. None of the MONDO classes those genes cause is a descendant
      of MONDO:0018614 (Dravet syndrome MONDO:0100135, DEE7 MONDO:0013387, DEE4
      MONDO:0012812, CDKL5 disorder MONDO:0100039), each already has a dedicated
      dismech entry, and the evidence attached to each supported the gene as a cause
      of developmental and epileptic encephalopathy in general rather than of this
      residual class. The section now holds the five subtype-scoped genes instead.
    - Moved those four genes to a new differential_diagnoses section, disease_term
      bound to the MONDO class each causes, carrying their original evidence items
      unchanged. For a residual category the entities to exclude before
      "undetermined" applies are real content, so nothing was discarded: every
      citation and snippet from the removed genetic records survives the move.
    - Added one pathophysiology node, NECAP1 loss of function in clathrin-mediated
      synaptic endocytosis, wired downstream to the existing shared node. DEE21 is
      the only one of the five children with no dedicated dismech entry, so it is
      the only gene whose mechanism belongs in this file. Evidence is the founding
      multiplex consanguineous family (PMID:24399846), the independent second family
      carrying the same founder allele (PMID:30525121), and a third family with a
      homozygous missense allele (PMID:35638367).
    - Bound SCN8A, HCN1, SLC13A5 and KCNB1 on the existing shared node, Early
      developmental brain network dysfunction, with descriptor descriptions stating
      exactly what the binding claims: convergence on this node, not a claim about
      the gene's own molecular biology, which stays curated in each dedicated entry.
      Gene mechanism wiring for this entry goes from 0/4 to 5/5.
    - Gave the Developmental encephalopathy node two downstream edges, to Global
      developmental delay and Developmental regression, using references already
      cited in the entry. The node previously had no downstream at all. This is
      adjacent to the genetics job rather than part of it; the entry's remaining
      phenotypes are still unwired.
    - Added a discussions record for the anchor's two ontology problems and a notes
      block stating the scope rule above.

    MONDO reconciliation: MONDO:0014360 NECAP1 is present, bound on the DEE21 row,
    with a genetic record and a curated mechanism node. The four genes removed from
    the genetic section are dispositioned to their own dismech entries and recorded
    here as differential diagnoses.

    Disagreement with MONDO, reported for the PR and not acted on here: MONDO:0018614
    is asserted is_a MONDO:0019216 "inborn disorder of amino acid transport"
    (Orphanet:79166), which propagates to all sixteen numbered DEE children, so
    SCN8A-, HCN1-, KCNB1- and NECAP1-related encephalopathy all come out as inborn
    errors of amino acid metabolism. Verified twice: the local MONDO build via runoak
    and the live EBI OLS4 parents endpoint for MONDO:0018614 on 2026-09-19. The
    separate tension between an "undetermined" definition and sixteen gene-defined
    children is recorded in the same discussion.

    Follow-up not done here: a standalone NECAP1-related DEE entry anchored on
    MONDO:0014360 would match how the other four children are handled. That is a new
    disease curation with its own claim-issue protocol, so it is recorded rather than
    done in a wiring pass.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (44/44), just check-entity-refs, just check-causal-targets,
    just list-gene-term-mismatches, and the offline gates all pass.

  summary: 'Create: Chondrocalcinosis 2'
  details: |
    Created the Chondrocalcinosis 2 (MONDO:0007319; familial CPPD, OMIM 118600) entry from the Falcon deep-research report (research/Chondrocalcinosis_2-deep-research-falcon.md) and the primary literature it pointed to. The pathograph runs from the heterozygous ANKH gain-of-function variant (genetic_context GAIN_OF_FUNCTION, with the published loss-of-function postulate carried as a CONTROVERSY discussion) through increased chondrocyte pyrophosphate export and cartilage PPi excess to CPPD crystal deposition, which then branches into NLRP3 inflammasome activation and neutrophilic crystal synovitis (acute CPP crystal arthritis, joint swelling, arthralgia) and into crystal-driven cartilage degradation (osteoarthritis-like chronic arthropathy); chondrocalcinosis and intervertebral disk calcification hang directly off the deposition node. Six ANKH variants (M48T, c.-11C>T, P5L, P5T, P5S, E490del) are recorded with their family reports and functional assays. Treatments are NCIT-bound with CHEBI/NCIT therapeutic agents (intra-articular and systemic glucocorticoid, colchicine, NSAIDs, anakinra targeting the inflammasome node, probenecid targeting the export node, joint replacement). Two ClinicalTrials.gov records (NCT03128905, NCT02243631) and two mouse models are linked; the Ank-null mouse is recorded as FAILS_TO_RECAPITULATE with a PROXY_QUANTITY divergence because it deposits hydroxyapatite under low PPi, and the crystal-injection model PARTIALLY_RECAPITULATES the synovitis node with a BOUNDARY_OMISSION divergence. The allelic loss-of-function disorder is cross-referenced to Craniometaphyseal_Dysplasia rather than duplicated; sporadic CPPD and CCAL1 are declared out of scope. No ORPHA, CGGV or GeneReviews source exists for the familial form (check-genereviews: NO_CHAPTER). Phenotype frequency bands were left off the two arthritis phenotypes because no series quantifies them among ANKH carriers. A GO molecular_functions binding (GO:0022857 transmembrane transporter activity, INCREASED, with the recorded OLS search showing GO has no inorganic-pyrophosphate transporter activity term) was added on the ANKH variant node to satisfy the check-gene-activity-grounding ratchet. Validated with just validate-disorders (schema, terms, 102/102 snippets exact against the reference cache, 108 titles), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, validate-stubs and compliance.

  summary: 'Bind LOINC: CSF protein and CSF cell count (albuminocytologic dissociation)'
  details: |
    Added loinc_term: LOINC:2880-3 (Protein [Mass/volume] in Cerebral spinal fluid) to the existing CSF Protein biochemical marker, which already carried context: Without pleocytosis with no second measurement stating the normal cell count side of the dissociation. Added a new CSF Cell Count marker with loinc_term LOINC:26465-5 (Leukocytes [#/volume] in Cerebral spinal fluid), presence Normal, so the albuminocytologic dissociation pattern (elevated protein plus normal cell count) is captured by two separate measurements rather than one. New evidence for both from PMID:9102806, a paired CSF study of 16 AIDP and 16 CIDP patients: elevated CSF protein reached 94% of cases, and cell count was elevated in 3 of 16 (19%) AIDP patients and normal in CIDP patients. Reference cached via just fetch-reference; LOINC:2880-3 seeded via just loinc-seed-cache and cache normalized. just validate-disorders passed with 0 issues.

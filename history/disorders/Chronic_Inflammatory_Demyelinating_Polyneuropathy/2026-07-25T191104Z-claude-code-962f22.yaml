  details: |
    Claim-evidence correctness audit of 10 neuroimmune entries.

    PMID:38330421 under phenotypes > Sensory Loss announced 'two inclusion criteria' and then supplied only the first, replacing the source's semicolon with a period. Restored the second criterion ('definite electrophysiological and/or biopsy evidence of demyelinating neuropathy') so the quoted definition is complete, and rewrote the explanation to name both criteria.

    PMID:36645654 on 'Macrophage-Mediated Myelin Stripping' was truncated at 'downregulation of macrophage activation.' where the source reads 'macrophage activation or co-stimulatory and adhesion molecules', which made macrophage downregulation look like the terminal IVIg mechanism. Restored the full clause and rewrote the explanation to state that macrophage downregulation is one of several proposed IVIg mechanisms, so the review does not establish macrophage stripping as the pathogenic mechanism.

    Set evidence_source: IN_VITRO on PMID:36346134 ('cytotoxic effects in vitro'), previously defaulting to HUMAN_CLINICAL.

    Added conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination on the macrophage myelin-stripping node.

    Validation: linkml-validate (Disease) passes; all 20 evidence snippets verified as exact substrings.

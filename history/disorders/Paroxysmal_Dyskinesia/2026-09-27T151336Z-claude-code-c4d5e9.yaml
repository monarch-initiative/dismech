  summary: Narrow the PNKD row to PNKD1 and add the TMEM151A-defined EKD3 row
  details: |
    series-064 genetics pass, two subtype-anchor corrections. The PNKD row bound MONDO:0700088, the paroxysmal nonkinesigenic dyskinesia umbrella, while describing only the PNKD/MR-1 gene and its recurrent N-terminal alleles; that umbrella also contains MONDO:0012629 PNKD2, which the row does not cover, so the row over-claimed and now binds MONDO:0700089 paroxysmal nonkinesigenic dyskinesia 1, the class MONDO attributes to PNKD. This is the reciprocal anchor test applied at subtype level. Added an EKD3 row bound to MONDO:0859380 for the TMEM151A locus and repointed the TMEM151A genetic record's subtype key to it. The PKD row keeps the umbrella MONDO:0044202, which is correct because it holds two genes and cannot be narrowed to one, and keeps both genes in its genes list because the clinical syndrome is produced by either. Gene wiring and phenotype inlink were already complete at 6/6 and 11/11 and are unchanged. While drafting the EKD3 row I wrote a PMID from memory for the TMEM151A founding report; the lookup returned no such record, so the row cites the review the entry already had cached instead.

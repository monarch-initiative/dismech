  summary: Link the three attack precipitants to the convergence and mechanism nodes
  details: |
    Backfill for issue #8085. This entry carries an explicit convergence node, described in its own text as the point where a trigger breaches the motor network attack threshold, so every precipitant points there. Two of the three also point at their subtype-specific mechanism node, giving five links across three exposures. Caffeine and alcohol reach both the PNKD MR-1 methylglyoxal node and the attack node from a single study: the same sentence identifies the causal gene product as an enzyme in the methylglyoxal detoxification pathway and names coffee and alcoholic beverages as dietary sources of that compound, then proposes them as precipitants of attacks. Prolonged exertion and fasting reach both the corticostriatal energy failure node, which names exertion and fasting in its own title, and the attack node one step further on; the edge into the attack node is INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT precisely because the energy-failure node sits between them and is drawn explicitly in this graph. All five links are TRIGGERS, which differs from the free-text effect field on these exposures reading EXACERBATES. The divergence is deliberate and stated in the first link description: at the level of the disease these are aggravating factors, but the links point at the attack, which they initiate within seconds. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 113 of 113 verified with no skips.

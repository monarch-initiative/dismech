  summary: 'Create: Paroxysmal Dyskinesia (MONDO:0015427)'
  details: |
    De novo curation of the paroxysmal dyskinesia umbrella entry (MONDO:0015427) for issue #7566. Deep research via Edison/Falcon (research/Paroxysmal_Dyskinesia-deep-research-falcon.md, 37 citations across ~10 distinct sources, 414s runtime); all DR leads treated as leads only and independently re-verified against PubMed E-utilities. Structure is organised on the trigger-gene-treatment axis: PKD (sudden movement / PRRT2, TMEM151A / low-dose carbamazepine-oxcarbazepine), PNKD (alcohol, caffeine, stress / PNKD MR-1 / trigger avoidance), PED (sustained exertion, fasting / SLC2A1-GLUT1 / ketogenic diet, flagged by hypoglycorrhachia and a low CSF:blood glucose ratio), plus PNKD3 (KCNMA1 BK gain of function), ICCA (PRRT2 pleiotropy) and a secondary-acquired arm. PRRT2 age-dependent pleiotropy (benign familial infantile epilepsy to kinesigenic dyskinesia) is modelled as a dedicated pathophysiology node rather than as comorbidity. Historical paroxysmal hypnogenic dyskinesia is curated honestly as a largely reclassified category (sleep-related hypermotor epilepsy per the 2016 consensus) with the dissenting PRRT2-PHD evidence recorded in a CONTROVERSY discussion rather than suppressed. Module conformance: the PKD presynaptic node declares epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction; the SLC2A1 arm explicitly declines conformance because its lesion is metabolic substrate transport, not a channel or synaptic defect. Validation: just validate passed (schema, terms, 90/90 snippets verified); just validate-terms passed; compliance 82.4 percent global, 82.8 percent weighted; compliance-connectivity 11/11 phenotypes causally connected and 6/6 causal genes wired to mechanism. Four MONDO IDs recalled from memory were caught as valid-but-semantically-wrong by the pre-edit term-validation hook and replaced with OAK-resolved IDs (sleep-related hypermotor epilepsy MONDO:0100631, conversion disorder MONDO:0002104, dystonic disorder MONDO:0003441, hypoparathyroidism MONDO:0001220). Cross-references rather than duplicates GLUT1_Deficiency_Syndrome, Benign_Familial_Infantile_Epilepsy, Familial_Sleep_Related_Hypermotor_Epilepsy and Episodic_Ataxia. Post-curation red-team review against .claude/skills/dismech-pr-review/SKILL.md (run as an independent subagent) raised and this commit resolves: GeneReviews baseline was unmined (added PMID:20301400 familial PNKD and PMID:20301603 GLUT1DS, both tagged GeneReviews, with snippets mined into subtypes, diagnosis, treatments and counselling); the KCNMA1/PNKD3 arm rested on mouse-only evidence (added the human kindred paper PMID:15937479 Du 2005 to the subtype, the absence-seizure phenotype, the genetic node and the mechanism node, plus PMID:35819138 for the p.Asn999Ser gain-of-function and p.His444Gln loss-of-function alleles that were previously asserted uncited); the trigger-avoidance treatment_term was misleadingly bound to NCIT:C15302 Physical Therapy and is now NCIT:C15900 Lifestyle Therapy, whose definition explicitly covers behavioural and dietary modification, stress management and addiction control (MAXO:0000053 is the semantically exact term but was empirically confirmed to be rejected by the TreatmentActionTerm enum, dismech issue #7524); seven frequency bands lacked documented justification and were either dropped with an explicit notes rationale, remapped (sensory aura FREQUENT to VERY_FREQUENT, matching the source term 'very common'), or corrected (ICCA infantile seizures to OBLIGATE, since they are definitionally required by MONDO:0011178 at subtype scope); PMID:38091244 is a review and its evidence_source was normalised to OTHER in all eight places (it had been typed two different ways for the same paper); a ketogenic-diet evidence item asserting SUPPORT on a snippet that never mentions the diet was downgraded to PARTIAL and backed with the GeneReviews targeted-therapy statement; the orphan cerebellar_origin_of_pkd hypothesis group is now opted into by two causal edges; a clinical_trials block was added (NCT04023656 Korean PKD prognosis registry, NCT06701851 TRIGGER striatum-cerebellum imaging study); the PHD historical subtype was removed because listing it under has_subtypes asserted the membership the entry argues against, with the content retained in differential_diagnoses and the CONTROVERSY discussion; an ADCY5 subtype (MONDO:0800028) was added so that gene arm follows the same pattern as the others; two mixed-source evidence items were split so each carries a single evidence_source (MR-1 sequence homology to COMPUTATIONAL/PARTIAL, Xenopus oocyte uptake to IN_VITRO); and explicit notes were added for the ICCA overlap with Benign_Familial_Infantile_Epilepsy, the channelopathy classification over-reach across the PNKD/SLC2A1/ADCY5 arms, the paradoxical caffeine benefit in ADCY5 disease, and the NCIT:C21024 electroanalgesia definitional mismatch for pallidal DBS. Post-fix validation: schema, term and reference validation all pass with 108/108 snippets verified; compliance 83.3 percent global and 83.7 percent weighted; connectivity 11/11 phenotypes and 6/6 genes.

  summary: 'Bind LOINC: CSF:blood glucose ratio on the PED/GLUT1DS2 subtype marker'
  details: |
    Added loinc_term LOINC:2352-3 (Glucose in CSF/Glucose plas) to the existing subtype:PED-scoped 'Hypoglycorrhachia' marker, grounded in two genetically-confirmed PED cohort studies already cited reporting the CSF:blood glucose ratio directly (median 0.52, normal >0.60; and 0.54, normal >0.59). Unlike Childhood_Absence_Epilepsy, where the same ratio is the GLUT1-deficiency differential's own test, here the ratio is this entry's own diagnostic test for its PED/GLUT1DS2 subtype, described in the marker's own notes as 'the single most important bedside test for the treatable cause of paroxysmal dyskinesia'. No absolute CSF glucose code was added since only the ratio is quantified in this entry's evidence. The entry's one CSF pleocytosis mention is a differential-exclusion caveat (ruling out meningitis), not a PED finding with a value, so no cell-count code was bound either. LOINC:2352-3 was newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

  summary: 'Create: Immune_Dysregulation_Neurodevelopmental_Defects_And_Colitis'
  details: |
    New entry for immune dysregulation, neurodevelopmental defects, and colitis (OMIM 621375), the autosomal recessive ITGAV deficiency. Phenotype, alleles and patient-cell mechanism come from the defining report (PMID:39526957, full text: two patients and four fetuses in three families, plus an itgav knockout zebrafish). Mouse literature supplies the mechanistic links: integrin activation of latent TGF-beta1 (PMID:17353357), myeloid and dendritic-cell alphaV loss causing colitis via reduced colonic regulatory T cells (PMID:17895374, 17694047), glial alphaV and neuroepithelial alphaVbeta8 in brain and retinal vascular development (PMID:15576410, 22279205, 26586223), alphaVbeta8 in microglial maturation (PMID:30846482), alphaV restraint of TLR signaling in B cells (PMID:26965188), and the alphaV-null mouse (PMID:9827803). A 2022 report of homozygous ITGAV and FN1 variants in twins with early onset IBD (PMID:35692981) is recorded as a knowledge gap, not a case. Brain malformations (polymicrogyria, Dandy-Walker, callosal agenesis) are left without causal edges, with a knowledge-gap discussion. The OpenScientist report (first run timed out in the provider queue and was relaunched with a 7200 s timeout) resolved 11/11 references; preflight-dr WARN only for SMAD3, the pathway readout, with OMIM 621375 matching. Two of its citations (PMID:26965188, 26586223) were added as primary evidence. GO:0050431 is bound on the ITGAV node for the gene-activity grounding gate. Validation: just validate, validate-terms, count-verified-snippets 59/59, check-reference-titles, check-entity-refs, check-causal-targets, check-gene-activity-grounding, check-genereviews --online (NO_CHAPTER), validate-disorders.

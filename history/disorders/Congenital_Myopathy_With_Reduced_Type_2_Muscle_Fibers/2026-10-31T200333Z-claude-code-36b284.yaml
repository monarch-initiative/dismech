  summary: 'Create: MYL1-Related Congenital Myopathy (MYL1)'
  details: |
    De-novo curation of MYL1-related congenital myopathy (CMYP14/CMYO14, MONDO:0034109, OMIM 618414), named per design decision §18 (gene-dyad name; MONDO label kept as a synonym). Deep research: claude_code (falcon unavailable - no EDISON/FUTUREHOUSE key) plus openscientist; both reports committed. Primary literature: PMID:30215711 (Ravenscroft 2018, foundational bi-allelic MYL1 + zebrafish), PMID:40488356 (2025 clinical/genetic/pathological insights, floret pattern, four-patient Table 1), PMID:41568526 (2026 expanded phenotype, CMYO14 AR), PMID:8413589 (Lowey 1993, in-vitro light-chain motility mechanism).

    A 5-node pathophysiology chain (MYL1 LOF -> fast ELC deficiency -> impaired fast-fiber myosin function -> type 2 fiber paucity/atrophy -> congenital weakness) grounded with a GO molecular function on the lesion node, wired to the clinical phenotypes. 11 phenotypes with Table 1 frequencies (hypotonia, generalized + facial weakness, respiratory insufficiency, dysphagia/feeding, reduced fetal movement, polyhydramnios, type 2 fiber atrophy, bone fracture, death in infancy, craniofacial anomalies), 5 MYL1 LOF variants, a diagnosis section (muscle biopsy + molecular/RNA testing), an upper-limb-sparing knowledge-gap discussion, zebrafish animal model, supportive-care treatment, ultra-rare prevalence. No GeneReviews chapter (verified offline + online); no cardiomyopathy noted.

    Incorporates red-team (subagent) fixes and automated review round 1 (reference_title on every evidence item; Table 1 phenotypes + frequencies; additional variants; diagnosis section; §18 rename; gene grounding fixing the CI ungrounded-gene gate). Validated: just validate-disorders (32/32 snippets), validate-terms, reference-title presence + mismatch, gene-activity-grounding, snippet-grading, entity-refs, causal-targets, coarse-phenotypes, logical-rules, enum/duplicate/block-scalar gates, model-scale-audit; connectivity 9/11.

  details: |
    De-novo curation of MYL1-related congenital myopathy (CMYP14/CMYO14, MONDO:0034109, OMIM 618414). Deep research: claude_code (falcon unavailable - no EDISON/FUTUREHOUSE key; openscientist run also launched). Primary literature: PMID:30215711 (Ravenscroft 2018, foundational bi-allelic MYL1 + zebrafish), PMID:40488356 (2025 clinical/pathological insights, floret pattern), PMID:41568526 (2026 expanded phenotype, CMYO14 AR). Built a 5-node pathophysiology chain (MYL1 LOF -> ELC deficiency -> impaired fast-fiber myosin -> type 2 fiber paucity -> congenital weakness) wired to 5 phenotypes; 6 phenotypes, zebrafish animal model, supportive-care treatment, ultra-rare prevalence. No GeneReviews chapter (verified offline + online). Validated: just validate, validate-disorders, 18/18 snippets verified, all check-* gates, model-scale-audit.

  summary: 'Review and enrich: MYL1-Related Congenital Myopathy'
  details: |
    Added top-level disease description, parent grouping, and Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) with verbatim literature quotes. Grounded MYL1 (hgnc:7582) and added node-level and downstream causal-edge evidence across all five pathophysiology nodes. Added Areflexia (HP:0001284) and wired Bone fracture from Congenital Skeletal Muscle Weakness. Added Electromyography (NCIT:C38056) to diagnosis, expanded respiratory, nutritional, and supportive treatments (Mechanical Ventilation NCIT:C70909, Enteral Tube Feeding NCIT:C93322, Supportive Care NCIT:C15747), and added model-level evidence on the myl1 morphant zebrafish model.

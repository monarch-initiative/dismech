  summary: Address PR 17334 review feedback by removing intravasation module conformance
    from Diffuse Infiltrative Growth, moving SOMATIC origin onto somatic lesion nodes,
    restoring the EGFR downstream signaling caveat, and cleaning up the US CBTRUS
    incidence row
  details: |
    Removed conforms_to invasion_and_metastasis#Local Invasion and Intravasation from Diffuse Infiltrative Growth because diffuse gliomas infiltrate brain parenchyma along white-matter and perivascular routes rather than intravasating for hematogenous metastasis. Removed variant_origin: SOMATIC from the non-lesion Glial-Lineage Neoplastic Transformation node, reworded its downstream driver-lesion edge descriptions, and added variant_origin: SOMATIC with CL:0000125 (glial cell) to the TERT promoter mutation and EGFR amplification lesion nodes alongside IDH1/2. Replaced unsupported neuroinflammation wording on the Diffuse Infiltrative Growth -> Fatigue edge with parenchymal tumor burden, mass effect, and peritumoral edema, restored the explicit caveat noting that EGFR downstream RAS-MAPK/PI3K-AKT signaling still needs a dedicated glioma source, and removed the all-malignant CNS rate_per_100000: 6.89 from the US CBTRUS row while quoting both CBTRUS 2017-2021 sentences as INDIRECT evidence for BAND_1_9_PER_100000.

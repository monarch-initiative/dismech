  summary: 'Create: PTPA-Related Early-Onset Parkinsonism with Intellectual Disability
    (PARK25)'
  details: |
    Created standalone per-gene entry PTPA-Related Early-Onset Parkinsonism with Intellectual Disability (PARK25, MONDO:0957576), the final split from the Parkinsons_Disease basket. Distinct PP2A/serine-threonine-phosphatase arm: biallelic missense PTPA (PPP2R4) variants destabilise PTPA and lower PP2A complex levels/activation (GO:0004722 DECREASED) -> inferred striatal dopamine deficiency (conforms parkinsonism_dopaminergic_degeneration striatal anchor, PROVISIONAL, dopaminergic step inferred from a levodopa-reversible Drosophila ptpa knock-down and patient levodopa response) -> parkinsonism/tremor/rigidity; PP2A failure also -> intellectual disability. Phenotypes: parkinsonism, intellectual disability, tremor, rigidity. Treatments: levodopa (with severe levodopa-induced dyskinesias), subthalamic DBS (NCIT:C21024), genetic counseling. Variants: p.Met298Arg, p.Ala171Asp (PMID:36073231), p.Met329Val (PMID:37046398). Top-level inheritance block (HP:0000007). All evidence from the discovery report PMID:36073231 and cross-ethnic replication PMID:37046398, every snippet verified exact against references_cache (lifted from the already-verified basket PP2A node plus new cached full-text snippets). No GeneReviews chapter (check-genereviews NO_CHAPTER). claude_code deep-research run used as a lead only. Validated with validate-disorders (24/24 snippets, terms pass) plus the offline gate list. Basket trimmed: PARK25 subtype row gained curated_in + pointer, PTPA genetic row gained a pointer; nothing removed.

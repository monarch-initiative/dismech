  summary: Bind LOINC broad-range 16S identification code
  details: |
    LOINC tranche B batch 27. The 16S ribosomal RNA PCR row takes LOINC:66885-5 (Bacteria identified based on 16S rRNA gene [Identifier] in Specimen by Sequencing).

    The choice is deliberate and runs against the obvious one. LOINC has two S. moniliformis-specific nucleic acid codes, but this row describes a broad-range bacterial 16S assay, not a targeted probe assay, so an organism-specific code would misstate what is run. Of the broad-range 16S codes, the identification one was chosen over the one reporting presence alone, because identifying the organism is what this row is for.

    The blood culture row is left unbound: no S. moniliformis culture code exists in the table, which carries only antibody and nucleic acid codes for the organism. That is a real gap rather than a search miss.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

  details: |
    ai4c-reviewer round 2 on PR 12819. Removed the uncited ingestion/Haverhill-fever route from the top-level description, the inoculation node, and the transmission block (and its name, now 'Rodent Bite and Body-Fluid Exposure'); Haverhill fever is kept as a synonym with a note that the foodborne variant is recognized but not separately cited. Renamed 'Septic Seeding of Joints, Valves, and Bone' -> 'Septic Seeding of Joints and Cardiac Valves' (nothing below it is bone; osteomyelitis was deliberately excluded), updated the bacteremia downstream target, and replaced the node's mortality evidence with the direct septic-arthritis (PMID:16858964) and endocarditis (PMID:15029568) snippets. Fixed the two phenotype explanations that named S. moniliformis (neither abstract does) to say 'rat-bite fever'. validate-disorders clean, all gates green, no churn.

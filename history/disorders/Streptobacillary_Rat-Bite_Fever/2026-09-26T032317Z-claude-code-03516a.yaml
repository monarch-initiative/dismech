  summary: 'Review round: pathograph build-out, complications, diagnosis, agent'
  details: |
    ai4c-reviewer round on PR 12819. Split the two-node pathograph into inoculation -> bacteremia -> {systemic dissemination, septic seeding of joints and valves}, adding a culture-positive bacteremia node (PMID:34323361 blood culture) and a septic-seeding node (PMID:16858964). Wired the antibiotic treatment into the graph via target_mechanisms -> bacteremia and bound penicillin (CHEBI:17334) as therapeutic_agent (PMID:34672901). Added complication phenotypes Septic arthritis (HP:0003095, PMID:16858964) and Bacterial endocarditis (HP:0006689, PMID:15029568), plus Chills/rigors (HP:0025143). Added a diagnosis section (blood culture NCIT:C25300, 16S rRNA PCR NCIT:C17003; PMID:34672901, PMID:17223620) and a prevalence entry with the pediatric predominance (PMID:11724672). Recorded ~10% untreated mortality and the S. notomytis osteomyelitis species-boundary caveat in notes rather than binding a cross-species phenotype. Regraded the PMID:17223620 review snippet OTHER -> HUMAN_CLINICAL + quote_role REVIEW_SYNTHESIS consistently across all four uses. Fixed inoculation biological_scale TISSUE->ORGANISM. validate-disorders clean, all gates green.

  summary: Enriched BNAH2 with Harrison's classification, pathophysiology cell/location/process annotations, genetic inheritance grounding, diagnostic procedures, and treatment phenotype targets.
  details: Added GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classification supported by PMID:24781087. Enriched PTPRF pathophysiology nodes with epithelial cell type (CL:0000066), plasma membrane and adherens junction cellular components, cell-cell adhesion mediated by cadherin (GO:0044331) and canonical Wnt signaling pathway (GO:0060070) biological processes, and nipple/areola anatomical locations. Added autosomal recessive inheritance to the PTPRF genetic record, genetic and physical examination diagnostic entries, diagnostic flag on Athelia, and target_phenotypes links (Athelia, Hypothelia, Amastia) on reconstructive mammoplasty.

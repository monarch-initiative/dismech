  summary: 'Create: Breasts and Nipples Aplasia or Hypoplasia 2 (PTPRF, MONDO:0014450)'
  details: |
    New Disease entry for BNAH2 (MONDO:0014450, OMIM 616001), caused by biallelic PTPRF loss of function. Scope: kept as a Disease entry; MONDO places it under isolated congenital breast hypoplasia/aplasia and no existing entry covers it.

    Evidence base is thin and the entry says so: one consanguineous family with three homozygous children (PMID:24781087, abstract only) plus one woman with syndromic amastia and a PTPRF-disrupting balanced translocation whose second allele was not resolved (PMID:21453473, full text). The Ptprf phosphatase-domain knockout mouse (PMID:9245518) is recorded as an animal model with a lactation defect, linked to the nipple-development node as PARTIALLY_RECAPITULATES with LOW fidelity.

    Pathophysiology is a three-node chain (PTPRF loss of function, a hypothesised adherens-junction signaling defect, defective nipple-areola development) with the uncertain links typed causal_link_type UNKNOWN and mechanism_confidence PROVISIONAL or HYPOTHETICAL. Phenotypes: athelia, hypothelia, amastia (single translocation case only) and an unspecified characteristic eyebrow shape (HP:0000534, coarse_binding_basis SOURCE_UNSPECIFIED). Treatment (reconstructive surgery, NCIT:C15354) is extrapolated from a congenital breast anomaly systematic review and marked directness INDIRECT.

    Deep research: one openscientist report (research/Breasts_and_Nipples_Aplasia_or_Hypoplasia_2-deep-research-openscientist.md); 14/14 references resolved; term validation needs_review only for a paraphrased HP:0002561 label. just preflight-dr returned WARN because TP63 is mentioned in the differential-diagnosis section; that section was read and concerns differentials, not a second disease. Claims from the report not taken: breast aplasia or hypoplasia in the homozygous family (not in the cited abstract) and gnomAD constraint figures (no cached source). The report did not find PMID:21453473, which was added from a PubMed search. The report run also refetched three existing references_cache files (PMID_30550377, PMID_33930582, PMID_39320041); those rewrites were reverted to the committed versions.

    No GeneReviews chapter (check-genereviews --online NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (25/25), the offline gates and validate-disorders.

  details: 'Added MONDO synonyms (Lissencephaly 4 (with microcephaly), LIS4, NDE1-related microlissencephaly,
    Microhydranencephaly, NDE1-related), Harrison''s chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE),
    top-level autosomal recessive inheritance (HP:0000007), ultra-rare literature prevalence, antenatal/congenital
    progression, diagnostic modalities (brain MRI NCIT:C16809, DNA sequencing NCIT:C153598, chromosomal
    microarray NCIT:C18477, fetal ultrasound NCIT:C222238), differential diagnoses (autosomal recessive
    primary microcephaly MONDO:0016660, LIS1-related lissencephaly MONDO:0011830, Miller-Dieker syndrome
    MONDO:0009532 with quote_role: BACKGROUND on framing quotes), GO molecular function annotations for
    dynein intermediate chain binding (GO:0045505) and microtubule binding (GO:0008017) with NDE1 gene
    links on pathophysiology nodes, and evidenced downstream causal edges from Progenitor Pool Depletion
    and Microlissencephaly and Cortical Dyslamination and Lissencephaly to all 8 phenotypes.'

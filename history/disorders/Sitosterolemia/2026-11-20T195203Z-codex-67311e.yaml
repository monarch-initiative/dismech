  summary: Map Sitosterolemia to OMIMPS:210250
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS210250 contains ABCG8-related sitosterolemia 1 (OMIM:210250) and ABCG5-related sitosterolemia 2 (OMIM:618666), matching the two gene-defined children of MONDO:0008863 and the causes curated in this Disease. The two half-transporters form the obligate G5G8 sterol-efflux complex, so loss of either converges on the same plant-sterol accumulation disorder. This aligns the syndrome-level concept across both genes rather than only the first numbered record. It does not merge familial hypercholesterolemia, isolated lipid measurements, or all ABC transporter disorders.

  summary: 'Review response: address ai4c-reviewer feedback (PR #7101)'
  details: |
    Addressed two rounds of automated ai4c-reviewer feedback on PR #7101. Round 1 (commit 3f751e82): corrected a CRITICAL factual inversion (the bone-marrow-transplant crossover in PMID:18156627 shows the phenotype tracks the recipient, so the megakaryocyte defect is extrinsic/host-plasma-sterol-driven, not cell-intrinsic) and anchored it to the crossover-result quote; split the bundled 'Defective Megakaryopoiesis and Macrothrombocytopenia' node into two atomic nodes by biological scale (Megakaryocyte Demarcation Membrane System Defect [CELLULAR] -> Macrothrombocytopenia [ORGANISM]); mined the GeneReviews Surveillance subsection into a monitoring entry; added hepatic involvement (HP:0002910 elevated transaminases + the GeneReviews 'idiopathic liver disease' quote); enriched ABCG8 genetics with the recurrent W361X allele; and addressed suggestions (tuberous xanthoma, stigmasterol, human sGPIbA correlation split, splenomegaly band support, childhood onset, statin non-response REFUTE treatment). Round 2 (commit 296da0bf): matched the top-level references title to the cached PubMed title to fix a reference-validation title mismatch. Round 3 (this change): flipped the discussion's PMID:23926302 sGPIbA human-correlation evidence to HUMAN_CLINICAL (it quotes human patient data); changed the surveillance therapeutic_modality to OTHER; added a stigmasterol GeneReviews evidence item; added 25-35% band-specific frequency support to hemolytic anemia and giant platelets and dropped the unsupported band on stomatocytosis; added evidence to the new DMS->macrothrombocytopenia edge; and removed curation meta-commentary from the ABCG8 notes (recorded here instead). Curation decision recorded per reviewer request: the DR-surfaced founder-allele carrier frequencies (Old Order Amish p.Gly574Arg ~4%, Hutterite p.Ser107Ter ~8%, Kosrae ~13%) were NOT asserted in the entry because they could not be verified against a cached primary-source quote (the GeneReviews bookshelf abstract does not contain them and PubMed searches did not surface a clean quotable source); only the verifiable recurrent W361X ABCG8 allele (PMID:16029460) was added, per the anti-hallucination SOP. Validated: schema, term validation (--labels), 67/67 snippets exact, folded-hyphen, pathograph fully connected (10 nodes).

  details: |
    Bound LOINC:75741-9 (Beta sitosterol [Mass/volume] in Serum or Plasma) to the Plasma sitosterol and campesterol biochemical record, as part of dismech LOINC Diagnostics tranche N (regulatory surrogate endpoints). The record's readout already carried endpoint_context: REGULATORY_SURROGATE paired with regulatory_endpoint_refs: [FDA-SE-adult-noncancer-037, FDA-SE-pediatric-noncancer-026] before this session; nothing there was added or changed. This record bundles two analytes (sitosterol and campesterol) jointly; no joint plant-sterol panel code exists in the Monarch KG (searched 'plant sterol panel', zero results), so loinc_term (single-valued) carries beta-sitosterol, the disease's namesake analyte, with campesterol's own code (LOINC:75738-5) recorded in notes as not reachable from this slot. Confirmed LOINC:75741-9 absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding; LOINC:19870-5 (used on Systemic_Sclerosis in this same batch) and LOINC:3084-1 (used on Gout) were both already cached on origin/main, confirmed before seeding. All labels verified against the Monarch KG entity API in the same step they were written.

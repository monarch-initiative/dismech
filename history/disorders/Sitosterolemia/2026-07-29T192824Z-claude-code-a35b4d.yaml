  summary: 'Create: Sitosterolemia (ABCG5/ABCG8 / G5G8 sterol-efflux deficiency)'
  details: |
    New de-novo entry for sitosterolemia (phytosterolemia; MONDO:0008863), the autosomal recessive ABCG5/ABCG8 (G5G8) sterol-efflux transporter deficiency. Deep research via the claude_code provider (research/Sitosterolemia-deep-research-claude_code.md; no GeneReviews TI article exists, confirmed by PubMed esearch). Nine atomic (unbundled) pathophysiology nodes model G5G8 transporter deficiency -> intestinal xenosterol hyperabsorption + reduced biliary sterol excretion -> plasma/tissue plant-sterol accumulation, branching into three arms: xanthoma formation, accelerated atherosclerosis, and a mechanistically detailed hematologic arm (sterol intercalation into blood-cell membranes -> defective megakaryopoiesis/macrothrombocytopenia and stomatocytic hemolysis). 10 phenotypes, ABCG5/ABCG8 genetics with ancestry skew, AR inheritance, biochemical plasma sitosterol/campesterol readout wired to the two FDA surrogate-endpoint rows (FDA-SE-adult-noncancer-037, FDA-SE-pediatric-noncancer-026, updated NEEDS_CURATION -> CURATED_DISMECH_MAPPING), two diagnostics (GC-MS plant-sterol assay, ABCG5/ABCG8 sequencing), treatments (ezetimibe with target_mechanisms, dietary sterol restriction, bile acid sequestrant), unknown-prevalence record, ENDOCRINOLOGY_METABOLISM + GENETICS_ENVIRONMENT_DISEASE classification, and a discussions section (KNOWLEDGE_GAP on phenotypic heterogeneity; INTERPRETATION on FH/ITP misdiagnosis pitfall and statin non-response; HUMAN_MODEL_MISMATCH on the murine platelet-passivation mechanism with proposed_experiments). Note: this disorder file was lost when PR #2585 merged only into an abandoned codex feature branch, leaving the two FDA rows dangling as NEEDS_CURATION on main; this entry restores the disease and resolves those rows. Validated: linkml schema, term validation (--labels), all 47 evidence snippets verified as exact substrings, folded-hyphen check, pathograph fully connected, regulatory-endpoint + FDA surrogate tests pass, compliance 93.5%.

  summary: Bind ER/PR/HER2/PD-L1/BRCA1-2 codes, reusing breast-specimen identities
    (tranche F batch 4)
  details: |
    LOINC tranche F batch 4. No diagnosis: section exists; used biochemical[].loinc_term. This entry is defined by ER-negative, PR-negative and HER2-negative status, so the same test identities apply as on the positive-stratum entries: a LOINC code names the measurement performed, not the result. Split the bundled 'Hormone Receptor and HER2 Testing' row (which named ER IHC, PR IHC, HER2 IHC/FISH, and PD-L1 testing together) into five rows: ER IHC bound to LOINC:85337-4 (reused from ER_Positive_Breast_Cancer, tranche F batch 3), PR IHC to LOINC:85339-0 (same source), HER2 IHC to LOINC:85319-2 (reused from HER2_Positive_Breast_Cancer, tranche F batch 2) -- correctly the breast-cancer-specimen-specific code here since this entry is breast cancer, unlike the gastric/colorectal HER2 entries in tranche F batch 4 where the same code would misstate the specimen -- HER2 FISH to LOINC:49683-6 (tissue-generic, reused across the batch), and PD-L1 testing as a separate, genuine immunotherapy-stratification test bound to LOINC:105302-4 (clone-agnostic scoring-method code, matching this row's own 'CPS or SP142' phrasing). Bound the separate 'BRCA1/2 Testing' row to LOINC:50995-0 (BRCA1+BRCA2 gene targeted mutation analysis in Blood or Tissue by Molecular genetics method), matching its combined-gene, specimen-generic (germline blood + somatic tissue) framing -- this is the same working code BRCA_Mutant_Prostate_Cancer in this same batch was found to lack any row for at all. One code (PD-L1) and one code (BRCA1/2) newly seeded; the four breast-specimen/tissue-generic codes were reused from sibling batches and also newly seeded on this branch. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

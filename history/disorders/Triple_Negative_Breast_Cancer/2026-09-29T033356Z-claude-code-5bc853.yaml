  summary: Record why no estrogen receptor gene is bound on the estrogen-annotated
    node
  details: |
    Third tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists this entry's estrogen-annotated node among fourteen that
    bind GO:0030520 while naming no gene, as candidates for an ESR1 descriptor.
    Read against the node's own claim and sources, ESR1 is not the gene this
    node is about, so the node carries a recorded reason instead of a binding.
    The issue treats that as a closed task rather than an avoided one.

    This is the one node of the four whose own text names ESR1, and the issue
    already flags it as a loss-of-signalling claim. The receptor absent here is
    the ESR1 product, but the mechanism is loss of expression rather than an
    alteration in the gene: ESR1 is not among the entry's causal genes and no
    source cited in the entry reports an ESR1 variant in triple-negative
    disease.

    A source was sought for a gene-level claim before deciding. PMID:22362381
    was fetched and read: it measures ESR1 promoter methylation in 98 Indian
    breast tumors and finds a minority of triple-negative tumors methylated at
    its stringent cutoff. That supports promoter hypermethylation as one route
    to lost expression in some tumors, not a gene-level claim for the subtype,
    and the sentence in it that names ESR1 is a methods statement rather than a
    result. It is cited in the node notes as the source for that limit and
    carries no evidence item. Its cache file is committed.

    The absence is carried by the ABSENT modifier on the pathway term, which
    states the fact without asserting that the gene participates in the
    mechanism.

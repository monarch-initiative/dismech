  summary: Add the CXCL9 / cytotoxic-T-cell-exclusion arm downstream of macrophage
    immune suppression
  details: |
    Extends the immune arm that PR #9543 opened. That PR added Macrophage-Mediated Immune Suppression (APOC2/KLHL1 -> M1 polarization) with a single bare edge to Aggressive Tumor Behavior; this adds the chain that connects macrophage immunosuppression to the entry's clinical problem, and evidences that bare edge.

    New nodes: Intratumoral CXCL9 Deficiency (TISSUE) and Cytotoxic T Lymphocyte Exclusion (TISSUE). Chain is Macrophage-Mediated Immune Suppression -> Intratumoral CXCL9 Deficiency -> Cytotoxic T Lymphocyte Exclusion -> Aggressive Tumor Behavior, with every edge carrying its own evidence rather than borrowing a node's.

    The entry previously had no immune pathophysiology beyond #9543's node, despite carrying an Immunomodulatory subtype and pembrolizumab as a treatment. The exclusion node is what makes that treatment's limited benefit legible: a drug that releases a brake on T cells does little where the T cells are not present.

    Three references, all newly cached. PMID:42726873 (Chen et al., Sci Adv 2026) is the TREM2-targeted mRNA-LNP paper the user supplied as a PDF; its PMID was confirmed against the DOI 10.1126/sciadv.aed9568 and first author before use, and only its abstract is cached, so the paper's human CXCL9/CD8A correlation (r=0.8191) and Kaplan-Meier data are deliberately not cited - they are in the Results, which the cache does not carry. PMID:42168200 supplies the macrophage-CXCL9-CD8 mechanism. PMID:41588017 supplies the human TNBC anchor (TCGA-BRCA and Kim cohorts) and the statement of limited infiltration in TNBC.

    Evidence grading is deliberately mixed and mostly not DIRECT: two items are therapeutic-rescue arguments (restoring CXCL9 improves CTL infiltration; reprogramming the immune landscape suppresses growth), which are INDIRECT per the directness rule - the claim follows from the intervention working rather than being asserted. The human cohort item is INDIRECT too, because a positive CXCL9-infiltration correlation is the deficiency claim read backwards. The TNBC infiltration statement is graded OTHER because it is that paper's background framing, not a result it reports.

    Ontology: CL:4047053 TREM2-positive macrophage and CL:0000625 CD8-positive, alpha-beta T cell were both looked up and label-verified against OLS before binding (CL:4047053 is new to the KB; its two cache rows are the only cache change). CL:0000235, GO:0070098, GO:0010818, hgnc:7098 and hgnc:17761 came from the committed caches. No CURIE was written from memory.

    Two deep-research reports exist for this entry and neither supports this axis: the committed openscientist report mentions CXCL9, TREM2, TAMs and CD8 zero times, and the falcon report states in its own limitations that myeloid and site-specific immunosuppression papers were not directly accessible in its evidence set. Sources were therefore found by PubMed search from the supplied paper outward, and that is recorded here rather than left implicit. The openscientist report also mislabels HP:0031416 and HP:0030075 and carries one unsupported quote (PMID:42373230); none of those were used.

    A notes field on the CXCL9 node records that the human evidence is expression-correlative and the interventional evidence is murine, so the node claims a microenvironmental deficiency rather than a measured patient-tissue CXCL9 concentration, which no cited study reports.

    Validated: just validate (schema + 27/27 snippets verified, up from 19/19), just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, plus the batched just validate-disorders and the whole-KB snippet gates.

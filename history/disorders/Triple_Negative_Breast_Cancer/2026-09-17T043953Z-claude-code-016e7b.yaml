  summary: 'Review round 1 on TNBC: regrade the TREM2 background quote'
  details: |
    Took the ai4c-reviewer suggestion to move the PMID:42726873 TREM2
    snippet off evidence_source: MODEL_ORGANISM on the Intratumoral CXCL9
    Deficiency node.

    The quoted sentence -- 'targets the protein triggering receptor expressed on
    myeloid cells 2 (TREM2) expressed by tumor-associated macrophages (TAMs)' --
    states the premise the paper's targeting strategy rests on. The paper's own
    experiments are murine, so MODEL_ORGANISM asserted that a mouse experiment
    established TREM2 as a TAM marker, which this sentence does not report.

    Graded OTHER rather than MODEL_ORGANISM, with quote_role: BACKGROUND recording
    that the citing paper is restating established biology rather than reporting
    its own result. Bare OTHER would have thrown away the provenance fact, which is
    the defect #10262 was filed about; the pair keeps both. directness stays DIRECT
    -- the sentence does assert TREM2 on TAMs, which is what the CL:4047053 binding
    on this node claims.

    A second TNBC item was regraded in the same round: the PMID:41588017 snippet
    "Due to limited tumor immune infiltration in TNBC, the effectiveness of
    immunotherapy is constrained" on the Cytotoxic T Lymphocyte Exclusion node. It
    was already evidence_source: OTHER with an explanation calling it the paper's
    background framing, so it gained quote_role: BACKGROUND to say that in the
    structured record rather than only in prose. The entry's two other PMID:41588017
    items were left alone: the TCGA-BRCA/Kim cohort analysis and the murine growth
    result are both that paper's own findings.

    Validation: schema clean, 27/27 snippets verified, enum-value and duplicate-key
    gates clean, check-snippet-grading / check-title-snippets / check-snippet-length
    clean against origin/main.

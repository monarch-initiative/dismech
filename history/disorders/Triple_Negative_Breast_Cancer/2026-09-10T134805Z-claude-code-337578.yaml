  summary: Add APOC2/KLHL1 macrophage immune suppression node
  details: |
    Added the Macrophage-Mediated Immune Suppression pathophysiology node to Triple_Negative_Breast_Cancer, covering APOC2 upregulation, its inverse correlation with M1 macrophage infiltration, and KLHL1-mediated APOC2 degradation restoring M1 polarization, with a downstream edge to Aggressive Tumor Behavior. All evidence cites PMID:42600954, cached at references_cache/PMID_42600954.md via just fetch-reference. The PR 9543 review round corrected the evidence grading and the term bindings. The tissue-expression quote was regraded from MODEL_ORGANISM to HUMAN_CLINICAL and the KLHL1 mechanism quote to IN_VITRO, because neither sentence reports in vivo animal data; the study xenograft sentence was added as a third evidence item, where MODEL_ORGANISM is the correct grade, and the explanation that had attributed the cell-based quote to murine models was corrected. The node description had asserted M2 skewing and a direct APOC2 effect on macrophages, neither of which the cited paper measures, so it now states only what that study supports and a notes field records that curating M2 polarization needs its own reference. The cell type binding moved from CL:0000235 macrophage to CL:0000863 M1 macrophage, and the biological process from GO:0042116 macrophage activation, the parent of both classical and alternative activation and so in contradiction with the node prose, to GO:0002281 macrophage activation involved in immune response. Validated with just validate at 19/19 snippets verified, just validate-terms, just check-entity-refs and just check-duplicate-keys.

  details: |
    Review on PR #14642 found that the PD-L1 row bound LOINC:105302-4 ('Immune stain PD-L1 scoring method - Tissue'), which names the scoring method used, not the PD-L1 result -- metadata about the test, not the test. Re-ran the Monarch KG search API: q=PD-L1 expression (category=biolink:ClinicalMeasurement) returns 0, so no clone-agnostic PD-L1 presence/interpretation code resolves; q=PD-L1 under the same category returns 12, fully enumerated, all presence/interpretation codes among them clone-specific. Split the single row into two, one per clone named in the row's own 'CPS or SP142' phrasing: LOINC:83052-1 (PD-L1 by clone 22C3, the CPS/pembrolizumab companion diagnostic) and LOINC:83057-0 (PD-L1 by clone SP142, the IC/atezolizumab companion diagnostic). Also dropped a sentence duplicated from the HER2 row's notes onto the ER row (the gastric/colorectal cross-reference), and moved the PD-L1-recommendation sentence off the ER row onto the new PD-L1 rows. Seeded cache/loinc/terms.csv for the two new codes via just loinc-seed-cache and just normalize-cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

  summary: 'Review: TNBC - dangling causal edge, misused inheritance slot, placeholder
    HPO bindings'
  details: |
    Manual claim-evidence review. Fixed: (1) the DNA Repair Deficiency node had a downstream edge to 'Genomic Instability', which did not exist as a pathophysiology node or a phenotype - a dangling internal reference; added the missing node with conforms_to genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, evidence, and an onward edge to Aggressive Tumor Behavior; (2) the DNA Repair Deficiency node had no evidence at all despite asserting a ~20% BRCA1/2 figure - added a PARTIAL evidence item that explicitly states it does not cover the prevalence figure; (3) three genetic entries used a nested inheritance block with name 'Somatic'/'Autosomal Dominant' instead of the dedicated variant_origin slot - migrated to variant_origin plus relationship_type; (4) the description said 10-20% of breast cancers while its own citation (PMID:35987766) says 10-15% - aligned to the source; (5) the 'Triple-Negative Phenotype' and 'Early Visceral Metastases' phenotypes are bound to the uninformative HP:0002664 Neoplasm - HPO has no generic metastasis term and receptor status is not an HPO abnormality, so the bindings were kept but annotated as placeholders that do not represent the stated claim.

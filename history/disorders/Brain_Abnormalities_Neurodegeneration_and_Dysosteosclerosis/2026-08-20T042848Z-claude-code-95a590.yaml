  summary: 'Create: BANDDOS (biallelic CSF1R)'
  details: |
    De-novo curation of Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
    (BANDDOS; MONDO:0032772; OMIM 618476), the autosomal recessive biallelic CSF1R
    disorder. Deliberately kept distinct from the existing adult-onset monoallelic
    entry Hereditary_Diffuse_Leukoencephalopathy_with_Spheroids (CSF1R-ALSP/HDLS);
    the two are cross-referenced as differential diagnoses rather than merged.

    Deep research provider: falcon (Edison), report at
    research/Brain_Abnormalities_Neurodegeneration_and_Dysosteosclerosis-deep-research-falcon.md.
    The report's own reference validation was clean (6/6 references resolved, 0
    unresolved, 0 off topic, confabulation_rate 0.0).

    NEC preflight: `just preflight-dr <report> MONDO:0032772` returned SKIP, because
    MONDO records no RO:0004003 causal gene for this term, so the automated
    gene-identity check cannot discriminate. The manual fallback checks were run and
    passed: CSF1R overwhelmingly dominates the report's gene mentions (CSF1R=40 vs
    SLC29A3=2 and TNFRSF11A=2, which are the genuine dysosteosclerosis differential
    rather than a rival identity), and the report's OMIM (618476) matches the MONDO
    OMIM xref exactly. The MONDO synonym list carries only BANDDOS.

    Caught DR ontology hallucination: the falcon report repeatedly suggested
    "HP:0000938 Osteosclerosis". OLS confirms HP:0000938 is actually Osteopenia - the
    opposite finding. The suggestion was rejected and HP:0011002 Osteopetrosis used
    instead. Every HP/GO/CL/NCIT/HGNC term in the entry was taken from the local
    cache or verified against OLS rather than from the report.

    Curation is anchored on primary literature, not on the report: Guo et al. 2019
    AJHG (PMID:30982609, the defining biallelic report), Oosterhof et al. 2019 AJHG
    (PMID:30982608, congenital absence of microglia plus the zebrafish csf1rDM
    model), Dulski et al. 2023 systematic review of all 19 published cases
    (PMID:37349768, the source of nearly all cohort frequencies), plus PMID:33749994,
    PMID:32464672, PMID:38934054, PMID:34135456, PMID:37839910, PMID:28383543, and
    the rodent-model literature PMID:33450391, PMID:34081701, PMID:39869647.

    GeneReviews baseline: PMID:22934315 (CSF1R-Related Disorder) was fetched, tagged
    under GeneReviews in the top-level references block, and cross-referenced against
    the YAML. Its early-onset Clinical Characteristics (hypotonia, delayed milestones,
    non-neurologic skeletal manifestations, end-stage bedridden state), its
    Agents/Circumstances to Avoid guidance (cautious use of sedatives, antipsychotics,
    and other alertness-reducing drugs in patients with gait problems and cognitive
    decline), and its autosomal recessive genetic-counselling content are all
    reflected in the entry.

    Structure: seven pathophysiology nodes model the two CSF1R-dependent lineages
    separately - biallelic CSF1R loss of function branches to microglial deficiency
    (which in turn drives both the congenital malformation arm and the progressive
    leukoencephalopathy arm) and to osteoclast deficiency (the sclerosing skeletal
    dysplasia arm), with both arms converging on progressive neurological decline.
    Also curated: 19 phenotypes with cohort-derived frequency bands, imaging findings
    (MRI/CT/XRAY), histopathology from the single published autopsy, genetic and
    inheritance blocks, two animal models with modeled_mechanisms links, four
    treatments, two differential diagnoses, and three discussions.

    Notable epistemic content: a HUMAN_MODEL_MISMATCH discussion records that Csf1rko
    rats lack microglia just as completely as BANDDOS patients yet undergo essentially
    normal brain development (the authors conclude CSF1R haploinsufficiency is
    unlikely to cause leukoencephalopathy, which contradicts the human monoallelic
    disorder). This is paired with a FAILS_TO_RECAPITULATE modeled_mechanisms link on
    the rat model carrying its own limitations and a negative (UNCHANGED) readout. Two
    KNOWLEDGE_GAP discussions cover the absence of any HSCT outcome data in
    genetically confirmed BANDDOS, and the unexplained sparing of peripheral immune
    function despite profound CSF1R deficiency.

    Evidence discipline: HSCT is recorded as investigational with PARTIAL evidence
    only, because the rationale is extrapolation from CSF1R-ALSP plus a rat rescue
    experiment, not human BANDDOS outcome data; the entry says so explicitly in the
    treatment description and notes. No frequency band was asserted for the Erlenmeyer
    flask deformity because no cohort-level figure is reported for that specific sign.

    A pre-PR red-team review was run in a separate fresh-context agent against the
    dismech-pr-review conventions before the PR was opened. It re-verified all evidence
    snippets and all ontology term/label pairs independently and found no errors there,
    but returned REQUEST_CHANGES on content completeness. All of its findings were
    addressed: a `diagnosis:` block was added (the GeneReviews DIAGNOSIS/TESTING section
    had been left unmined, alongside brain MRI, non-contrast head CT for calcification,
    and skeletal survey); three cached but unconsumed references were brought in
    (PMID:37431483 Daghagh 2022, an independent BANDDOS family with prenatal testing;
    PMID:38897209 Chadarevian 2024, iPSC-derived microglia transplantation, now a
    fifth treatment entry marked preclinical and ALSP-model-only; PMID:34145972 Chitu
    2022, the Csf1r-model review, which also supplied a Csf1r-null mouse animal_model,
    the cerebellar-atrophy phenotype, the optic-canal-narrowing skeletal detail, and an
    allele-dose alternative explanation inside the HUMAN_MODEL_MISMATCH discussion). The
    HSCT target_mechanisms predicate was corrected from INHIBITS to RESTORES (INHIBITS
    on a deficiency node is a double negative). Three frequency bands were corrected:
    Leukoencephalopathy VERY_FREQUENT -> OBLIGATE (19/19, 100%); the speech phenotype was
    split so that the 87% VERY_FREQUENT figure attaches to speech disturbance as a whole
    (HP:0002167) and dysarthria specifically carries FREQUENT ("more than half"); and the
    frequency was dropped from Osteopetrosis, because the 76% figure covers the whole
    dysosteosclerosis-Pyle spectrum rather than the sclerotic pole. Also: a mixed
    human-plus-zebrafish quote was trimmed to its human clause, an unevidenced
    oligodendrocyte ABNORMAL modifier and an organism-scale GO:0150076 annotation were
    removed, a generic neuron/ABNORMAL descriptor was specialised to CUX1-positive
    upper-layer neurons/DECREASED, the SLC29A3 and TNFRSF11A differential gained real
    supporting citations (PMID:33837634, PMID:33402699), Nasu-Hakola disease
    (TREM2/TYROBP, PMID:20301376, a second GeneReviews-tagged reference) was added as
    the most instructive mimic, gray-matter heterotopia was curated, and several prose
    overstatements about malformation universality and onset were softened to match the
    counts. Two further ontology label errors were caught by `just validate-terms` during
    this pass and fixed (HP:0002167 is "Abnormal speech pattern", not "Abnormality of
    speech or vocalization"; NCIT:C15445 is Hormone Therapy, not Cell Therapy - the
    correct cellular-therapy term is NCIT:C70601).

    Validation performed and read: `just validate` passed all three stages (schema,
    terms, references) and the wrapper reported "Snippets checked: 115/115 verified
    against cached references". `just count-verified-snippets` independently reported
    115/115. `just check-duplicate-keys` clean. `scripts/check_title_snippets.py --all`
    reports no title-snippet findings for this file. `just validate-disorders` was run on
    the file as the batched pre-PR sweep and passed. A targeted `pytest tests/test_data.py`
    selection covering the unique-name, conforms_to-node-reference, model-readout-target,
    FAILS_TO_RECAPITULATE-substantiation, subtype-foreign-key, environmental-target, and
    committed-history-layout guards passed. `just compliance` reports 94.9% global /
    95.3% weighted.

  summary: 'Phenotype review: Brain_Abnormalities_Neurodegeneration_and_Dysosteosclerosis'
  details: |
    Campaign phenotype review (snippet consistency, HPO term optimality, pathograph connectivity) of all 22 phenotypes. Snippets: all 115 pre-existing evidence snippets verified as exact substrings and checked in whole-paper context against the cached sources (PMID:37349768 full text, PMID:34145972 full text, plus abstract-only case reports); no wrong-disease, negation, or out-of-context quotes found; frequency bands all match their quoted denominators. Term rebinds: Intracranial calcification HP:0002514 (Cerebral calcification) -> HP:0430048 (Intracranial calcification) because the counted calcifications are periventricular AND brainstem; Cortical malformation HP:0002536 (Abnormal cortical gyration) -> HP:0002538 (Abnormal cerebral cortex morphology) because the source counts cortical abnormalities including heterotopia, not gyration only; Metaphyseal widening HP:0004975 (Erlenmeyer flask deformity of the femurs) -> HP:0003016 (Metaphyseal widening) because no source localises the modelling defect to the femurs. Connectivity: entry had 0/22 phenotypes causally connected; added 19 manifestation/summary downstream edges from the four existing arm nodes (Disrupted Brain Development -> 8 congenital/early phenotypes; Progressive White Matter Degeneration -> Leukoencephalopathy + Intracranial calcification; Progressive Neurological Decline -> 7 clinical signs; Sclerosing Skeletal Dysplasia -> Osteopetrosis + Metaphyseal widening), with edge evidence where the link is itself a claim. Also wired CSF1R into the pathograph via genes: on the Biallelic CSF1R Loss of Function node (gene-wiring metric 0/1 -> 1/1). Left Optic atrophy, Cerebellar atrophy, and Dysmorphic features unexplained on purpose - mechanism not established in the literature - and recorded three KNOWLEDGE_GAP discussions with candidate mechanisms and proposed experiments instead of manufacturing edges. All validation gates pass (125/125 snippets verified).

  summary: 'Create: PACS2-Related Developmental and Epileptic Encephalopathy (DEE66)'
  details: |
    New entry for PACS2-related DEE66 (MONDO:0054845), curated from a claude_code deep-research report. NEC preflight PASS: PACS2 mentioned 60 times against PACS1 at 12, and the report OMIM 618067 matches the MONDO xref exactly. The report's own reference validation flagged needs_review with two unresolved DOIs and two off-topic references; the unresolved entries were markdown-link parsing artifacts rather than fabricated papers, and neither they nor the off-topic references are cited here. Three ontology term labels suggested by the report were wrong and were corrected against OAK before use: HP:0002324 is Hydranencephaly not Cerebellar vermis hypoplasia, the correct term being HP:0001320; HP:0006955 is Olivopontocerebellar hypoplasia not mega cisterna magna; and HP:0000582 is Upslanted palpebral fissure, the opposite direction from the downslanted fissures the report described. HP:0000146 was also initially used for autosomal dominant inheritance and rejected by validation, corrected to HP:0000006. No GeneReviews chapter exists for PACS2. Pathophysiology is 9 atomic nodes tracing one recurrent missense variant through separable molecular consequences: autoregulatory-domain impairment and slowed protein turnover are kept as distinct arms because they were established by different experiments, and the 14-3-3-epsilon association and the apoptosis susceptibility it produces are separate nodes. The conditional framing of the apoptosis result is preserved throughout, since the source measures increased susceptibility under an applied stressor rather than constitutive death. A deliberate scope decision is recorded in the genetic notes and in a dedicated discussion: PACS2's role at mitochondria-associated ER membranes is widely invoked for this disorder but no source verified for this entry measures a MAM-integrity defect for the E209K variant, so no MAM node is curated. Three discussions: a HUMAN_MODEL_MISMATCH on the entire mechanism resting on transfected HCT116 and 293T cells rather than neurons, with the causal edge to cerebellar dysgenesis typed as having unknown intermediates for that reason; a KNOWLEDGE_GAP on why the epilepsy improves with age, which distinguishes DEE66 from most developmental and epileptic encephalopathies and has no mechanistic account; and a KNOWLEDGE_GAP on the unmeasured MAM claim. Validation: just validate passed with 37 of 37 snippets verified against cached references, term validation passed, no duplicate keys, no new title-quoting or under-length snippets, and 6570 tests passed.

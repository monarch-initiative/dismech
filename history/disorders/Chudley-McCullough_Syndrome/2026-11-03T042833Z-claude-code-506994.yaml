  summary: 'Review round 1: Chudley-McCullough_Syndrome'
  details: |
    Answered the first automated review on PR 16349. Added auditory neuropathy spectrum disorder as a phenotype (4 of 6 patients diagnosed or suspected, PMID:41503747), left unbound because OLS HP searches for 'auditory neuropathy', 'auditory neuropathy spectrum disorder', 'auditory neuropathy spectrum' and 'neural hearing impairment' returned no auditory neuropathy term; it stays unconnected because a neural or synaptic deficit is not explained by the hair-bundle chain. Marked the hearing loss clinical_course PROGRESSIVE (PMID:41503747). Wired ventriculomegaly and arachnoid cyst as downstream of the cortical malformation node, whose own PMID:22578326 quote names them, and speech delay as a sequela of the hearing loss (PMID:33016209, INDIRECT). Recorded in notes why hydrocephalus and seizures stay unconnected. Suggestions taken: vestibular hair cell (CL:0000609) on the stereocilia node; directness INDIRECT on the GPSM2+SAPCD2 double-knockout evidence (PMID:41637507); cochlear implant device qualifier (NCIT:C16830 / NCIT:C157820, checked with check-qualifier-terms-online); IN_VITRO tip-complex condensate evidence (PMID:35687681); prenatal MRI evidence on the MRI diagnosis row (PMID:27312216). Not added: PMID:38567212 (bilateral cochlear implantation), since PMID:41503747 already supports the treatment. Validation: just validate passed, 44/44 snippets verified, just validate-terms passed, entity-ref, causal-target, coarse-phenotype, enum, duplicate-key, logical-rule and qualifier-term checks clean, 0 missing reference titles.

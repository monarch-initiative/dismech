  summary: 'Create: Chudley-McCullough_Syndrome'
  details: |
    New entry for Chudley-McCullough syndrome (MONDO:0011411, GPSM2), claimed in issue #16325. Pathograph: GPSM2 loss of function -> loss of the GPSM2-GNAI tip complex on the tallest stereocilia -> defective stereocilia elongation and hair bundle morphogenesis -> sensorineural hearing loss (mouse evidence, PMID:28387217, 30827920, 26662512); a second arm runs GPSM2 loss -> defective mitotic spindle orientation in neural progenitors -> malformation of cortical and callosal development, marked INDIRECT because the link is inferred from GPSM2 function (PMID:22578326) and a mouse study (PMID:41637507) rather than shown in patient brain; a growth-cone actin node records the mouse finding without a downstream edge. DFNB82 is recorded as a synonym (MONDO lists it as one, and PMID:22578326 found the brain malformations in the original DFNB82 families). ClinGen Definitive (AR) recorded from the CGGV record. No GeneReviews chapter is specific to this disorder; the Genetic Hearing Loss Overview (PMID:20301607) is tagged. Evidence was gathered from PubMed directly. The deep-research run was requested from falcon, which reported no usable key; it fell back to openscientist, which had not finished at commit time. Validation: just validate-disorders passed (40 snippets, 41 titles, 0 issues); just validate-terms passed; entity-ref, causal-target, coarse-phenotype, enum, duplicate-key and logical-rule checks clean.

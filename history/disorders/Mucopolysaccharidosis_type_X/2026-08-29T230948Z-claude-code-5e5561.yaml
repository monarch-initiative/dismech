  summary: 'Address review: fix truncated snippet, split bundled node'
  details: |
    Addresses the blocking snippet finding on PR 10082. The snippet 'both children had normal serum levels of galactose' was cut mid-enzyme-name and read as a normal serum sugar level rather than two normal enzyme assays, so it no longer supported its own explanation or the Morquio differential. I had truncated it to avoid the U+2010 hyphens in 'galactose-6-sulfatase'; the correct fix was to quote the whole sentence including those characters, which verifies fine. Notably this defect passed count-verified-snippets, because a truncation that remains a valid substring is exactly what substring matching cannot catch. Also split the bundled 'Cardiac valve and ocular connective-tissue involvement' node into separate cardiac and ocular nodes, so the refuting evidence from the series that found normal eye examinations is unambiguous about which arm it refutes, and recorded in the enzyme-deficiency node description why GO:0008484 is deliberately bound as a broad parent rather than a manufactured narrow match.

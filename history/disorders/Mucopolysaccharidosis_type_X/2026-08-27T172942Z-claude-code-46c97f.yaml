  summary: 'Create: Mucopolysaccharidosis type X (ARSK)'
  details: |
    New entry for MPS X (MONDO:0030524, ARSK / glucuronate 2-sulfatase deficiency), the most recently defined mucopolysaccharidosis and a gap found by diffing MONDO's mucopolysaccharidosis descendants against kb/disorders. Curated from the four primary human reports (PMID:34916232 index families, PMID:35959767 phenotypic expansion, PMID:38292179 fourth allele, PMID:38634625 Turkish series) plus the 2025 review (PMID:40742107) and the Arsk-knockout mouse (PMID:32856704). Pathograph runs enzyme deficiency to 2-O-sulfoglucuronate-capped GAG fragment storage to chondro-osseous dysplasia, with a variable cardiac and ocular arm. Records a FAILS_TO_RECAPITULATE animal-model link (the mouse has the biochemistry without the skeletal disease) and a HUMAN_MODEL_MISMATCH discussion for it. All 60 snippets verified against the reference cache; term validation passes.

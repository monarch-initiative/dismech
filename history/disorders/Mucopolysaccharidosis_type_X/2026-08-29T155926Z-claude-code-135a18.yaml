  summary: Curate excluded phenotypes; migrate retired supports values
  details: |
    Two changes after rebasing onto the evidence-enum split (#7439). First, migrated three retired 'supports: PARTIAL' items to the new direction-plus-directness model: the variable-DS-excretion quote became SUPPORT/INDIRECT (it reports urinary excretion, from which lysosomal storage follows by inference); the normal-eye-examination quote became REFUTE/DIRECT, since it directly asserts absence of the ocular finding the node claims; and the absent-coarse-facies quote became SUPPORT/INDIRECT rather than REFUTE, because the curated claim is age-dependent OCCASIONAL frequency rather than presence in any given patient. That last grading was checked against the HPOA exporter: REFUTE there produced an incoherent NOT-qualified row carrying an Occasional frequency, which SUPPORT/INDIRECT avoids. Second, added four excluded phenotypes using the established frequency EXCLUDED plus modifier ABSENT convention: dysostosis multiplex, hepatosplenomegaly, intellectual disability, and hearing impairment. These are the absences that define MPS X clinically and explain why it is not recognised as a mucopolysaccharidosis at the bedside. Verified that the HPOA exporter emits seven NOT-qualified rows with empty frequency columns, and that check-groupings still reports the entry SATISFIED against the Mucopolysaccharidoses NECESSARY criterion.

  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing molecular-testing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000/8000 Hz per ear) matching the frequency range the index proband's audiogram is reported over. No reference range is bound: the index proband's audiogram is markedly asymmetric (left ear severe sloping to profound with no response at 4 and 8 kHz, right ear moderate to moderately severe), so a single WHO/GBD better-ear average would misrepresent one ear or the other rather than describe the reported pattern. Two new LOINC cache rows (LOINC:89028-5, LOINC:89029-3, the 8000 Hz per-ear codes) were seeded via scripts/seed_loinc_cache.sh after verifying no row for them existed on origin/main.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 115 (DFNB115, SPNS2)'
  details: |
    Created DFNB115 from a blank stub (no causal gene in MONDO). Identity resolved OMIM:618457 via the MONDO xref, then NCBI mim2gene_medgen -> GeneID 124976 (SPNS2, 17p13.2); kb/ searched for SPNS2 and DFNB115 first and found no existing coverage. Six references fetched and cited: PMID:30973865 (Ingham 2019 mouse screen, index human proband), PMID:36494063 (Mardani 2023 second proband), PMID:25356849 (Chen 2014 Spns2 mouse cochlear mechanism), PMID:37552762 (Martelletti 2023 gene-reactivation rescue), PMID:39820269 (SPNS2 transport structure), PMID:32996353 (African NSHI targeted screen, negative). Pathograph: SPNS2 biallelic LOF -> failure of S1P export -> stria vascularis disorganization -> endocochlear potential collapse -> secondary hair cell degeneration -> three wired phenotypes. All mechanism nodes below the gene carry MODEL_ORGANISM evidence and say so; no human cochlear tissue or EP measurement exists. OMIM provisional (mim2gene_medgen 'question' comment) recorded in genetic.notes and the description. Validated: just validate (schema, terms, references) clean, 39/39 snippets verified, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading all OK.

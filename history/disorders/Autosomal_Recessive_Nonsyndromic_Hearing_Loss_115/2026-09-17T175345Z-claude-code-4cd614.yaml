  details: |
    Addressed both IMPORTANT findings from the automated review plus two of the four optional ones, in one push. (1) The 'Progressive Sensory Hair Cell Degeneration' node bound GO:1905584 outer hair cell apoptotic process; neither cited paper measures apoptosis and the cached text of PMID:25356849 contains no apoptosis/TUNEL/caspase mention, and the node covers inner as well as outer hair cells, so the term over-claimed on two axes. Rebound to GO:0008219 cell death with a node notes: recording the reasoning. (2) The PMID:39820269 evidence item was graded evidence_source OTHER with quote_role REVIEW_SYNTHESIS; that paper is a primary structural study restating other groups' in vivo work in its introduction, so it is now MODEL_ORGANISM + BACKGROUND, which is what the two axes are for. (3) The retinal OCT readout in the HUMAN_MODEL_MISMATCH discussion pointed at the hearing phenotype; retargeted to disease#Autosomal Recessive Nonsyndromic Hearing Loss 115. (4) Added onset.onset_category CHILDHOOD to the bilateral SNHL phenotype descriptor, keeping the separate onset phenotype which carries the evidence and the causal edge. Declined with reasons in the PR reply: the deep-research artifact (six-paper literature, all mined; provider substitution risk on a two-proband entity) and the GO:0007605 scale point (the reviewer explicitly did not request a change and 28 other entries share the convention). Revalidated: just validate clean, 39/39 snippets verified, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading all OK.

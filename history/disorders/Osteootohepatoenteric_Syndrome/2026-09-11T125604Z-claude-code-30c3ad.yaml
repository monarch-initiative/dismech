  summary: 'Create: Osteootohepatoenteric_Syndrome'
  details: |
    De novo curation of osteootohepatoenteric syndrome (MONDO:0859164, UNC45A).

    DEEP-RESEARCH PROVIDER: the brief asked for perplexity. The Perplexity account's quota was exhausted mid-run (HTTP 401 insufficient_quota) after two of five reports had been produced. Rather than substituting a provider by hand, the run was re-issued with just dr_fallback='--fallback', which recorded the handover in the report's own frontmatter: requested_provider perplexity, fell_back true, provider_attempts listing perplexity (ProviderNotConfiguredError), falcon (ProviderAuthError 403) and claude_code (succeeded). The report is research/Osteootohepatoenteric_Syndrome-deep-research-claude_code.md (claude_code, 270.4 s, 20 citations), correctly renamed by the alignment step.

    Note on the fallback trigger: --fallback did NOT fire while PERPLEXITY_API_KEY was still set, because the configuration gate only checks that a key is present, not that it has quota. The run failed outright instead of handing over. Unsetting the key made the gate trip and the documented chain then worked as designed.

    The report changed the entry rather than confirming it, which is worth recording because the counterfactual is a materially worse record. Working from PubMed relevance-sorted search alone I had (a) no mechanism for the cholestasis and (b) all alleles modelled as loss of function. The report surfaced 2025 literature that supplies both corrections: PMID:41861679 shows reduced UNC45A with reduced and mislocalised bile salt export pump in a patient liver biopsy, giving the hepatic arm an observation of its own; and PMID:40125554 shows the recurrent p.Leu237Pro allele RETAINS chaperone activity and fails by forming atypically stable oligomers that will not release the folded myosin. That allele is therefore curated as a separate NEOMORPHIC pathophysiology node, not folded into the loss-of-function node.

    Report validation: reference_validation 12/12 resolved but quotes_valid 0 of 1 (PMC:PMC9868473 quote unsupported) and needs_review true; that reference is not cited here. term_validation 28/30 verified with 0 mislabelled and 2 obsolete (GO:0051082, GO:0032313) - markedly better than the two perplexity reports in this run, which mislabelled 13 of 31 and 13 of 47 respectively. No CURIE was taken from any report; all bindings were looked up against OLS in the same step they were written, and re-checked in bulk with a per-file id/label comparison before validation.

    Evidence: 34 snippets across 8 PMIDs, all exact-quote verified. One pathophysiology node conforms to enterocyte_polarity_trafficking_failure, entering through the trafficking arm (#Loss of Apical Delivery Machinery) and not the adhesion arm as that module's description requires; a second conforms to cholestatic_liver_injury#Impaired Bile Formation and Secretion.

    MYO5B is recorded in the genetic section with relationship_type COOPERATING and a note saying explicitly that it is the UNC45A client carrying the enteropathy and NOT a second disease gene or modifier - the original series excluded MYO5B, STX3 and STXBP2 before landing on UNC45A. Also recorded: UNC45A is allelic to Aagenaes syndrome via a 5'-UTR variant, which is a different disease.

    Two mistakes caught by validation: onset_category CONGENITAL_ONSET is not a permissible value (CONGENITAL is), and NCIT:C15189 was written with the label 'Biopsy' from recall rather than from a lookup - its canonical label is 'Biopsy Procedure'. The second is the failure mode CLAUDE.md warns about and is the second instance of it in this run; a bulk id/label checker was added to the loop afterwards.

    Validated with just validate (schema, terms, 34/34 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values.

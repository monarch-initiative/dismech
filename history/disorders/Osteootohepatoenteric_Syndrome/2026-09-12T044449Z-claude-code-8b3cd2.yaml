  summary: 'Review round: consume PMID:41081434, add premature birth, unbind a contradictory
    GO term'
  details: |
    All three blocking findings taken, plus three of the four suggestions.

    Blocking 1 - PMID:41081434 was committed to references_cache and cited zero times, while prevalence.notes asserted 'twelve patients counted in the literature as of 2025' that both evidence items on that record contradict (they say ten). The entry stated a number it could not show. The 2025 count is now a third evidence item on the prevalence record, and its explanation records that the figure had been asserted without backing. This is the same defect the self-review round found on this batch's other entries in a different form: a reference fetched and then not consumed.

    Blocking 2 - Premature birth added, bound to HP:0001622, FREQUENT, on 'Among the 12 published cases, four were premature...'. The explanation separates what the entry claims (the association) from what the authors additionally suggest (that UNC45A loss may contribute causally to preterm birth), which is theirs and stays theirs.

    Blocking 3 - the reviewer is right that GO:0017022 myosin binding with modifier DECREASED asserts the opposite of the node it annotated. On Altered Chaperone-Myosin Complex Dissociation the whole point is that binding persists abnormally and release fails; what falls is the supply of released, usable myosin. GO has no term for that fraction, so the molecular function is now unbound with a notes block saying why - no term beats a term pointing the wrong way. On the sibling node the same CURIE was carrying 'myosin VB motor function', which is a different concept again; that is rebound to GO:0000146 microfilament motor activity.

    Suggestions taken:
    - A severe-tail progression phase, because recording only the remission phase overcorrected. Complete enterectomy and two early deaths in the p.Leu237Pro series, and a patient still symptomatic at 33 with relapsing cholestatic pruritus. Both references were already cited elsewhere in the entry.
    - The congenital chloride diarrhoea differential in diagnosis. The 2025 case was worked up as CCD twice, prenatally and after birth, and the paper states the misdiagnosis and its cause directly.
    - NHE3/DRA mislocalization with preserved CFTR on the Apical Trafficking node. This is the mechanistic account of why the diarrhoea is secretory rather than only malabsorptive, and it also explains why CCD is a plausible misdiagnosis rather than a coincidence - the two additions reinforce each other.

    Not taken: nothing was declined outright. The fourth item in the review was an agreement note on NEOMORPHIC versus DOMINANT_NEGATIVE for p.Leu237Pro, which required no change.

    Validation: just validate-disorders (schema, terms, 51/51 snippets, was 45/45); all eleven offline gates clean; bulk OLS id/label comparison over 29 pairs, 0 mismatches. No cache rows added.

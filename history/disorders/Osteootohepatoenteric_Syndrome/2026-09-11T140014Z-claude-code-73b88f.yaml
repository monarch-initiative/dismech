  summary: 'Self-review: consume PMID:36699472, frequency anchors, UDCA, band correction'
  details: |
    Self-review round performed while claude-review was unavailable (shared Claude account usage limit, resets 2026-09-12T20:00Z). I applied the two finding shapes the automated reviewer had raised on my other two PRs in this batch - an under-consumed deep-research source, and unquantified frequency bands - to this entry, and both were present.

    PMID:36699472 (Wang 2022, Front Genet) was named in the research report's source list and never cited. It is a case report with an eleven-patient literature review, and consuming it produced one correction and several additions.

    Correction:
    - Sensorineural hearing impairment was FREQUENCY VERY_FREQUENT on the strength of the feature appearing in the syndrome name, with no denominator. The review counts deafness in 4 of 10 patients, which is FREQUENT. Changed, with a second evidence item recording that two patients were diagnosed at 5 years and in the teens, so 4/10 is a floor rather than a penetrance estimate.

    Additions from the same source:
    - Quantitative frequency anchors for chronic diarrhoea (9/10), intrahepatic cholestasis (8/10) and pathologic fracture (6/10).
    - Ursodeoxycholic acid as a treatment - absent entirely, and the only agent in the entry with a documented clinical response. Deliberately given no target_mechanisms link, since it acts on none of the trafficking or folding nodes modelled here.
    - Parenteral nutrition had a note saying no cited paper stated a nutritional recommendation quotably. That was true only because the paper that states it had not been cited. Real evidence added and the note rewritten to say what the quote does and does not establish.
    - A progression block recording that the hepatic and intestinal features can remit in infancy, which the entry previously did not convey.
    - The negative genotype-phenotype result (15 variants, no correlation) on the UNC45A genetic record.
    - A family denominator on prevalence: ten patients from eight families.
    - The extraintestinal_mechanism_unknown discussion now names MYO15A as the one published candidate mechanism for the deafness, cited and graded OTHER, with an explanation of why it is cited in the gap rather than drawn as a pathograph edge: it is an inference in a case report's discussion, and none of the three UNC45A papers in this entry mentions MYO15A.

    Separate defect found by check-snippet-grading and fixed: one background sentence from PMID:35421597 was graded IN_VITRO in a pathophysiology node and HUMAN_CLINICAL in a phenotype. The grading unit is the passage, not the paper's overall design; the sentence is the paper's opening background statement, so the surviving use is graded OTHER to match its sibling quote, and the phenotype use was dropped as redundant.

    Validation: just validate-disorders (schema, terms, 45/45 snippets); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-environmental-evidence, check-reference-titles, check-title-snippets, check-snippet-length, check-snippet-grading, check-folded-hyphens all clean; bulk OLS id/label comparison over 27 pairs, 0 mismatches.

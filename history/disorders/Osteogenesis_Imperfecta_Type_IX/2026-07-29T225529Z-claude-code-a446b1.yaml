  summary: 'OI type IX: verify disease_term MONDO ID, reject hallucinated DR alternative'
  details: |
    Resolves issue #5079 item 3, which asked whether the curated MONDO:0009805 or the deep-research-suggested MONDO:0012978 is the correct disease_term for OI type IX. Verified with uv run runoak -i sqlite:obo:mondo info MONDO:0009805 MONDO:0012978 -O obo. MONDO:0009805 is correct: MONDO defines it as any osteogenesis imperfecta caused by mutation in the PPIB gene, it carries relationship RO:0004003 HGNC:9255 (PPIB) and xref OMIM:259440, and its synonyms include 'OI type IX'. MONDO:0012978 is primary ciliary dyskinesia 11 (RSPH4A, OMIM:612649), an entirely unrelated disorder, so the deep-research suggestion was an ontology-identifier hallucination of the kind CLAUDE.md warns about. No change to the disease_term was required; the verification and rejection are recorded in the entry's notes field so the discrepancy is not re-litigated. Validated with just validate and just validate-terms.

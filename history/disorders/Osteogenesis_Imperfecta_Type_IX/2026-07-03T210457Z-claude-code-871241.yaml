  details: |
    Second-pass phenotype enrichment for OI type IX (PPIB), follow-up to issue #5079. Added four HUMAN_CLINICAL exact-quote-verified phenotypes from the two founding molecularly-confirmed PPIB cohorts: Respiratory insufficiency HP:0002093 [PMID:27625864], Triangular face HP:0000325 [PMID:20089953], Motor delay HP:0001270 [PMID:20089953], Hypotonia HP:0001252 [PMID:20089953]. Resolved issue item 3: current disease_term MONDO:0009805 osteogenesis imperfecta type 9 PPIB OMIM:259440 is correct; the DR-suggested MONDO:0012978 is primary ciliary dyskinesia 11 RSPH4A, an unrelated NEC-style misattribution, no change made. Blue sclerae HP:0000592 and dentinogenesis imperfecta HP:0000703 intentionally NOT added: PMID:20089953 states the moderate PPIB siblings had white sclerae and normal dentition. Validated with just validate, validate-terms, validate-references, all pass.

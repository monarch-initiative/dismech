  summary: 'Review: EDARADD-Related Hypohidrotic Ectodermal Dysplasia'
  details: |
    Conducted a comprehensive staleness review and expansion of kb/disorders/EDARADD_Hypohidrotic_Ectodermal_Dysplasia.yaml:
    - Added classifications (harrisons_chapter: hereditary syndrome and/or malformation, physiological system: dermatological disorder; mechanistic_taxonomy: developmental pathway defect), inheritance (Autosomal Recessive HP:0000007 and Autosomal Dominant HP:0000006), prevalence (RARE, citing PMID:20222921, PMID:34573371, PMID:41645317), progression (Infancy and Childhood to Adulthood phases), diagnosis (Clinical Diagnosis After Infancy NCIT:C18020 and Molecular Genetic Testing of EDARADD NCIT:C19770), differential_diagnoses (MONDO:0010585, MONDO:0016535, MONDO:0100162), and animal_models (mouse crinkled Edaradd mutant, PMID:11780064).
    - Expanded genetic block with ClinGen Definitive validity (CGGV:assertion_81893c11-1102-4fc7-a52f-e9214bd1d691-2023-03-01) and three structured variant sub-entries (Autosomal Recessive Death Domain Missense Variants, Autosomal Dominant Dominant-Negative Death Domain Variants, and Autosomal Recessive Truncating and Frameshift Variants) with GeneticContext annotations (GERMLINE, LOSS_OF_FUNCTION, DOMINANT_NEGATIVE).
    - Grounded EDARADD Adapter Protein Loss of Function with gene_activities (EDARADD DECREASED, LOSS_OF_FUNCTION), molecular_functions (GO:0035591 signaling adaptor activity, GO:0005125 cytokine activity), cellular_components (GO:0005829 cytosol), cell_types (CL:0000066 epithelial cell, CL:0000312 keratinocyte), and biological_processes (GO:0038092 nodal signaling pathway, GO:0007249 I-kappaB kinase/NF-kappaB signaling).
    - Split downstream appendage morphogenesis defects into three organ-specific pathophysiology nodes (Impaired Eccrine Sweat Gland Morphogenesis, Impaired Hair Follicle Morphogenesis, and Impaired Tooth Morphogenesis and Odontogenesis) plus Defective Exocrine and Mucosal Gland Development, wiring all 13 phenotypes into the causal pathograph (100% phenotype connectivity, 0 floating phenotypes).
    - Added 5 missing clinically significant phenotypes (Sparse Eyebrows HP:0045075, Sparse Eyelashes HP:0000653, Nail Dystrophy HP:0008404, Keratoconjunctivitis Sicca HP:0001097, and Recurrent Respiratory Infections HP:0002205) and added Skin, Ocular, Nasal, and Respiratory Supportive Care treatment.
    - Updated stale GeneReviews (PMID:20301291) snippets so all 57/57 evidence snippets verify against cached references.

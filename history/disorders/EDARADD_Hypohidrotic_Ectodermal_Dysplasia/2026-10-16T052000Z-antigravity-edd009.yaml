  summary: Reviewed EDARADD-Related Hypohidrotic Ectodermal Dysplasia, preserving main's intermediate
    appendage-development nodes, facial/mucosal phenotypes, treatments, diagnosis, differential diagnoses,
    and crinkled mouse model while adding AR/AD subtype MONDO bindings, recurrence risks, prevalence,
    progression, TRAF6/TAB2/TAK1-NF-κB mechanism grounding, and reconciled isoform A/B variant numbering.
  details: Added synonyms and subtype_term bindings for autosomal recessive (AR, MONDO:0013983, ECTD11B)
    and autosomal dominant (AD, MONDO:0013982, ECTD11A) forms; expanded inheritance with GeneReviews sibling
    and offspring recurrence risks (PMID:20301291); added HED cohort prevalence and EDARADD mutation frequency
    statistics (PMID:20222921, PMID:20979233, PMID:41645317); added Infancy and Childhood to Adulthood
    progression phases; preserved main's Disrupted EDA-EDAR-EDARADD-NF-κB Signaling and downstream Impaired
    Sweat Gland Development, Impaired Hair Follicle Development, and Impaired Tooth Development nodes
    while adding keratinocyte (CL:0000312), developmental GO processes, UBERON anatomical locations, and
    TRAF6/TAB2/TAK1 dominant-negative evidence (PMID:17354266, PMID:34219261); preserved main's cardinal
    and facial/mucosal phenotypes (Hypohidrosis, Sparse Scalp Hair, Hypodontia, Conical Teeth, Heat Intolerance,
    Dry Skin, Sparse Eyebrow, Sparse Eyelashes, Periorbital Wrinkles, Prominent Forehead, Keratoconjunctivitis
    Sicca, Recurrent Respiratory Infections) with added EDARADD-specific sibling evidence (PMID:38840186)
    and removed unsupported Nail Dystrophy (HP:0008404); retained main's AR genetic variants (including
    c.402-407del [p.Thr135-Val136del]), added AD variants, reconciled 205-aa isoform A vs. 215-aa isoform B numbering
    and added HED case fractions; preserved and refined main's diagnosis, differential diagnoses, treatments,
    and crinkled (cr) mouse model (PMID:11780064); and documented the MONDO:0013983 disease_term rationale,
    Nail Dystrophy removal, isoform A/B 10-amino-acid offset, and why upstream recombinant Fc-EDA1 (ER004)
    replacement cannot bypass an intracellular EDARADD defect in top-level notes.

  summary: Expand EDARADD-Related Hypohidrotic Ectodermal Dysplasia with AR and AD subtypes, dominant
    inheritance and recurrence risks, prevalence, life-course progression, TRAF6/TAB2/TAK1-NF-κB mechanism
    and anatomical/cellular grounding, additional dermatologic phenotypes, subtype-stratified genetic
    variants with reconciled isoform A/B numbering and case fractions, diagnosis, differential diagnoses,
    treatments, crinkled mouse model, and isoform/therapeutic notes.
  details: Added synonyms and has_subtypes for autosomal recessive (AR, MONDO:0016619, ECTD11B) and autosomal
    dominant (AD, MONDO:0015884, ECTD11A) forms; expanded inheritance with Autosomal Dominant (HP:0000006)
    and GeneReviews sibling/offspring recurrence risks; added HED cohort prevalence and EDARADD mutation
    frequency statistics (PMID:20222921, PMID:20979233, PMID:41645317); added Infancy and Childhood to
    Adulthood progression phases; expanded Disrupted EDA-EDAR-EDARADD-NF-κB Signaling with keratinocyte
    (CL:0000312), developmental GO processes, UBERON anatomical locations, and TRAF6/TAB2/TAK1 dominant-negative
    evidence (PMID:17354266, PMID:34219261); preserved the five pre-existing cardinal phenotypes (Hypohidrosis,
    Sparse Scalp Hair, Oligodontia, Conical Teeth, Heat Intolerance) with added EDARADD-specific sibling
    evidence (PMID:38840186) and added three new phenotypes (Dry Skin, Sparse Eyebrow, Sparse Eyelashes);
    stratified genetic into AR (c.424G>A [p.Glu142Lys / p.Glu152Lys], c.402-407del [p.Thr135-Val136del],
    c.322_323insCGGGC [p.Arg108ProfsTer7], and HED case fractions) and AD (c.335T>G [p.Leu112Arg / p.Leu122Arg],
    c.358G>T [p.Asp120Tyr], and c.367G>A [p.Asp123Asn]) entries with explicit 205-aa isoform A vs. 215-aa
    isoform B numbering reconciliation; added clinical and molecular genetic diagnostic criteria; added
    differential diagnoses against EDA-related X-linked HED, EDAR-related HED, and WNT10A-related odonto-onycho-dermal
    dysplasia; added treatments (Environmental Thermoregulation, Dental Rehabilitation, Supportive Care
    for Xerosis and Mucosal Dryness, and Genetic Counseling); added the crinkled (cr) mouse model (PMID:11780064)
    with modeled_mechanisms; and documented the isoform A/B 10-amino-acid offset and why upstream recombinant
    Fc-EDA1 (ER004) replacement cannot bypass an intracellular EDARADD defect in top-level notes.

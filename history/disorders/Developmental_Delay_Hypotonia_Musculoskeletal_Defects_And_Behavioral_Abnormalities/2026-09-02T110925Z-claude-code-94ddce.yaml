  summary: 'Create: DEHMBA (SRCAP non-FLHS neurodevelopmental disorder)'
  details: |
    De novo curation of DEHMBA (MONDO:0859202) from primary literature plus a claude_code deep-research report (falcon was requested but returned HTTP 402, so the run fell back and the report is named for claude_code; its reference and term validation sections were read - 4/4 references resolved, and the report's suggested GO:0043486 histone exchange was flagged obsolete and was not used; GO:0140849 and GO:0000812 were bound instead after OLS lookup). Pathophysiology is built as a causal chain from the non-hotspot SRCAP null allele through SRCAP complex haploinsufficiency, deficient H2A.Z deposition, dysregulated neurodevelopmental transcription, reduced Satb2, parvalbumin interneuron deficits, to impaired neurodevelopment, with the blood DNA-methylation episignature as a parallel branch. The mouse-only portion of the chain is recorded as a HUMAN_MODEL_MISMATCH discussion rather than presented as human mechanism, and the unexplained musculoskeletal branch as a KNOWLEDGE_GAP. Validated with just validate (schema, terms, 49/49 snippets verified against cached references), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and its online variant, check-enum-values, and the whole-KB folded-hyphen, snippet-length, title-snippet, snippet-grading and environmental-evidence gates.

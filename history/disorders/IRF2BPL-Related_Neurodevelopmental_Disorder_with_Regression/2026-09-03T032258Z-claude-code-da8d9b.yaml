  summary: 'Create: IRF2BPL-Related Neurodevelopmental Disorder with Regression (NEDAMSS)'
  details: |
    Created NEDAMSS (MONDO:0060759, IRF2BPL) as a standalone DISEASE entry.

    NO DEEP-RESEARCH PROVIDER REPORT WAS OBTAINED. Edison/falcon returned HTTP 402 (account out of credits). Two attempts at the documented claude_code fallback - 'just research-disorder claude_code ...' and the same with dr_fallback='--fallback' - both failed with 'WARNING - agentapi not found in PATH' followed by 'ERROR - Claude Code exited with code 1: <no stderr>'. No file was produced under research/ and none was hand-written. The entry was curated entirely from literature retrieved directly via PubMed E-utilities, with all nine references fetched through 'just fetch-reference'.

    Verified the issue's claims rather than assuming them. MONDO:0060759 and hgnc:14282 both confirmed via OAK (labels exact). The 'absent from kb/' claim is true: the only IRF2BPL hits on origin/main are microarray probe rows in kb/hypotheses/Wilsons_Disease/cuproptosis_model/biomni_artifacts/*.tsv, which are not a causal genetic binding - confirming this is one of the false #1079 ticks that #7780 flags.

    Lump/split: DISEASE. Both MONDO parents (syndromic disease, Mendelian neurodevelopmental disorder) are broad groupings with no curated dismech counterpart, so there is no parent for a has_subtypes entry.

    The pathograph models progression rather than a static symptom list, as the issue asked: de novo truncating variant -> NMD escape (the gene is intronless, so the mutant transcript is expressed ~1:1 with wild type) -> cytoplasmic sequestration of wild-type IRF2BPL -> loss of transcriptional repression -> excess Wnt signaling, plus parallel astrocyte mitochondrial failure and polyQ inclusion arms -> progressive neuronal and axonal loss -> loss of previously acquired milestones. functional_impact_category DOMINANT_NEGATIVE is carried on the initiating node's genetic_context (Genetic has no such slot).

    Deliberate omissions, all recorded in entry notes: keratoconus is not curated because PMID:32291157 returned no retrievable content to quote; CuATSM is not curated as a treatment because there is no human trial - it is recorded as RESCUES links on the Drosophila and patient-derived-cell models where the evidence actually sits.

    Two errors caught during curation and fixed: GO:0070997 'neuron death' is obsolete (replaced with GO:1990535 neuron projection maintenance), and an initial binding of NCIT:C159273 Speech Language Therapy to the developmental-support treatment was an over-claim - GeneReviews never mentions speech therapy, so it was rebound to NCIT:C17874 Educational Intervention.

    Validation, all run and passing: just validate (schema + terms + references, 61/61 snippets verified; 63 after the treatment fix), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (0 qualifier terms used), check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, and validate-disorders.

  details: |
    Addressed the CHANGES_REQUESTED review on PR 10658. Added a top-level references block with cache-verbatim titles and tags: [GeneReviews] on PMID:39571061. Mined the committed full texts for published denominators and rewrote the notes paragraph that wrongly said the sources were only qualitative: FREQUENT bands for epilepsy (21/28), spasticity (14/28), dystonia (12/28), ocular disturbance (12/28) and ataxia (10/28), OCCASIONAL for dysmorphic features (5/28), dysphagia (3/11), dysarthria (2/11) and nystagmus (2/11). Added dysphagia, dysarthria, nystagmus, mild dysmorphic features and delayed puberty as phenotypes. Split the bundled astrocyte node into Astrocyte Mitochondrial Respiratory Dysfunction and Loss of Astrocytic Trophic Support for Neurons, re-pointing the CuATSM RESTORED readout at the mitochondrial step and adding the patient muscle ETC deficiency evidence there. Regraded the intronless-gene NMD-escape evidence from HUMAN_CLINICAL to COMPUTATIONAL. Added prevalence (CASES_IN_LITERATURE), a two-phase progression block, the OMIM:618088 mapping, glycogen inclusions on the aggregate node, the coiled-coil variant clustering in genetic notes, and the unmined GeneReviews management items (ophthalmology, endocrine, gastric dysmotility, family and social work support). Replaced the Loss of speech evidence item that quoted the syndrome acronym expansion. Validated: just validate, validate-terms, count-verified-snippets (92/92), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-reference-titles, and validate-disorders.

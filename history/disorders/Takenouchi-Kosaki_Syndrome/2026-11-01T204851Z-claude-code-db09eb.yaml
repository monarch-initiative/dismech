  summary: 'Create: Takenouchi-Kosaki Syndrome (CDC42; MONDO:0014757)'
  details: |
    New entry for Takenouchi-Kosaki syndrome, bound to MONDO:0014757 (current MONDO label is the eponym; the older phenotype-list label is kept as a synonym). Curated from primary literature first (Takenouchi 2015/2016, Motokawa 2018, Martinelli 2018, Uehara 2019 EM and C. elegans study, Daimon 2021 MEG-01, Thanasegaran 2023 iPSC model, neuronal studies 2020 and 2026, hair-cell study 2026, immune case reports) and ClinGen CGGV Definitive AD. Scope: group I switch II variants (p.Tyr64Cys, p.Arg66Gly, p.Arg68Gln) as classical TKS; Martinelli group II and III variants recorded as has_subtypes because OMIM and later case reports use the same name. The C-terminal p.Arg186Cys autoinflammatory disorder (NOCARH) is excluded and listed as a differential. One openscientist deep-research report was used as leads only: preflight-dr PASS (CDC42 mentioned 49 times, OMIM 616737 matches); 33/33 references resolved, 2 quotes not found verbatim (paraphrases of PMID:34624555 and PMID:34504210, neither reused). The report contributed the KLHL23 degradation-escape finding (PMID:40846997), added after verifying the abstract. The report misplaces p.Glu171Lys in a nucleotide-binding/switch class; Martinelli 2018 places it in the CRIB-surface group III, which the entry follows. No GeneReviews chapter exists (check-genereviews --online NO_CHAPTER; PubMed CDC42 AND genereviews[book] returned 0). Orphanet ORPHA:487796 was not cited because the Orphadata bulk files are not present locally. Validated with just validate, validate-terms, count-verified-snippets (94/94), validate-disorders, and the whole-repo gates.

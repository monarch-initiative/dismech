  summary: Review and enrich Mitochondrial DNA Depletion Syndrome 17
  details: |
    Added top-level autosomal recessive inheritance, Harrison's/mechanistic/ICIMD classifications, mitochondrial_translation_deficiency conforms_to links, hgnc:16352 gene context on Biallelic MRM2 Loss of Function, skeletal muscle tissue location (UBERON:0001134) on Combined OXPHOS Deficiency, expanded noun-phrase snippet to full sentence, wired evidenced stroke-like episode sequelae (cerebellar atrophy, status epilepticus, spastic tetraparesis, epilepsia partialis continua), set germline variant_origin on MRM2, and added structured diagnosis (WES, muscle biopsy, brain MRI, MRS) and clinical treatment records. In PR #17357 review round 1, kept Combined OXPHOS Deficiency restricted to skeletal muscle fiber/tissue where respiratory chain deficiency was assayed, removed eight un-evidenced downstream edges from Combined OXPHOS Deficiency, clarified that the Spastic tetraparesis and Epilepsia partialis continua sequelae rest on temporal association following the acute stroke-like episode, narrowed the Supportive Intensive Care target_mechanisms description on Status epilepticus to pharmacological coma with accompanying airway/nutritional support, removed deprecated updated_date, and corrected the gene name and PR link in this history record.

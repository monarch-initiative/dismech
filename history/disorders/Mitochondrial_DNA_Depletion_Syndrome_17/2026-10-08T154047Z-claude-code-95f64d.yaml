  summary: 'Create: Mitochondrial_DNA_Depletion_Syndrome_17'
  details: |
    New entry for MTDPS17 (MONDO:0032815, MRM2). Curated directly from PubMed; no deep-research provider was run. The literature is two clinical reports (PMID:28973171, index MELAS-like patient with homozygous p.Gly189Arg; PMID:36002240, two further families with dystonia or a neurodevelopmental disorder) plus three functional papers on MRM2 (PMID:25074936 U1369 site assignment; PMID:25009282 MRM2 knockdown impairs mt-LSU assembly and mitochondrial translation; PMID:32652011 MRM2 in late mt-LSU maturation with GTPBP5). The pathophysiology chain runs MRM2 loss of function -> loss of 16S rRNA U1369 2'-O-methylation -> defective large-subunit assembly -> impaired mitochondrial translation -> combined OXPHOS deficiency, with edges to the respiratory chain, encephalopathy and stroke-like phenotypes. The mtDNA-depletion label rests on a single 40% residual copy-number value in muscle, which the original authors note is above the 30% depletion threshold; this is stated in notes and the copy-number phenotype is left unwired. Movement-disorder and developmental phenotypes are not wired because no source links them to a specific mechanism. No treatment section: no disease-specific therapy is reported. No GeneReviews chapter and no ClinGen validity record were found. The HP:0003572 cache row carried a superseded label (Low plasma citrulline); it was removed and re-derived from OLS as Decreased circulating citrulline concentration. Ornithine_Carbamoyltransferase_Deficiency still uses the old label. Validation: just validate, validate-terms, count-verified-snippets (27/27), duplicate-key, entity-ref, causal-target, enum-value, snippet-length and title-snippet gates, and validate-disorders.

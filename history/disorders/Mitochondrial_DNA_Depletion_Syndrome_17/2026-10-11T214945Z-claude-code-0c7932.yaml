  summary: 'Review round: falcon report, MRM2 assembly role, sequela edge'
  details: |
    Ran a falcon deep-research report (research/Mitochondrial_DNA_Depletion_Syndrome_17-deep-research-falcon.md, with citations sidecar and artifacts). Its reference validation resolved 11/11 references. Its term validation flagged only the template placeholder 'if available' against MONDO:0032815. just preflight-dr returned WARN: MRM2 is the dominant gene (70 mentions), and the report quotes OMIM 606906, which is the MRM2 gene record, where MONDO cross-references the phenotype record OMIM 618567. The report is about the right disease. It found no MRM2 families beyond the two papers already cited (PMID:28973171, PMID:36002240). It did surface PMID:35177605 (Rebelo-Guiomar et al. 2022), which shows that MRM2 is a late large-subunit assembly factor and that assembly does not depend on its methyltransferase activity. The pathograph was corrected to match. The edge from loss of U1369 methylation to defective assembly was removed; MRM2 loss of function now leads directly to the assembly defect, and the methylation node stays as a parallel consequence with no downstream edge. The MRM2 node now binds GO:0008650, so the gene reaches a molecular function. Added a fly-orthologue evidence item, a Stroke-like episodes -> Cerebral atrophy sequela (temporal sequence, marked INDIRECT), an Acidosis phenotype for the mixed acidosis, and a HUMAN_MODEL_MISMATCH discussion: patient fibroblasts did not reproduce the defect seen in knockdown cells. Rebound spastic quadriparesis from Spastic tetraplegia (HP:0002510) to Spastic tetraparesis (HP:0001285), since paresis is the source's word. The OXPHOS -> stroke-like edge is left without evidence because no sentence in the cited sources ties the two causally for MRM2. All snippets verified against cached references.

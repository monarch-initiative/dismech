  summary: 'Review: AKT3-Related Overgrowth Spectrum pre-PR red-team fixes'
  details: |
    Pre-PR red-team review by a fresh-context subagent following the dismech-pr-review skill. No critical findings; scope, subtype split and grouping row judged sound.

    Changes made:
    - Megalencephaly, Polymicrogyria and Hypoglycemia were scoped to MPPH2 only. PMID:40032969 Table 2 shows megalencephaly in 14/16 and polymicrogyria in 6/16 mosaic p.E17K cases, and hypoglycemia in 1/16, so the subtype restriction was removed and the E17K table row cited.
    - Series frequencies from PMID:40032969 Table 2 added: hypoglycemia 7/61 (OCCASIONAL), hypotonia 28/61 (FREQUENT), DD/ID 38/61 (FREQUENT), epileptic spasms 9/38 with epilepsy (OCCASIONAL). Each number was checked against the cached full text before use.
    - GeneReviews oromotor-dysfunction and intellectual-disability figures are now described as statements about bilateral perisylvian polymicrogyria in general, not AKT3. A false claim that HPO has no oromotor term was replaced with the reasons HP:0007301 and HP:0200136 were not used.
    - The unsourced Brain Overgrowth -> Cortical Malformation edge was removed. An unsourced hemiparesis clause in the surgery description was removed.
    - Antiseizure medication evidence re-graded REFUTE; the aims-statement snippet on the pathway-inhibitor treatment was dropped.
    - GO bindings: GO:0061351 neural precursor cell proliferation; kinase activity modifier INCREASED instead of GAIN_OF_FUNCTION.
    - A mixed human/mouse PMID:22500628 evidence item was split into HUMAN_CLINICAL and MODEL_ORGANISM items. quote_role REVIEW_SYNTHESIS added to the PMID:31441589 review snippets.
    - The Nmf350 mouse link now cites the seizure-threshold sentence. ClinGen statements in notes now point to kb/genes/ingest/clingen_gene_validity.tsv. A note explains the growth hormone binding.

    Not taken: a surgery outcome figure (7/13 seizure-free) attributed to PMID:40032969 could not be found in the cached text, so it was not added. The single-case glucose-utilization node was left as is because its description already states that it is a hypothesis.

    Validation after fixes: just validate passes (86/86 snippets verified); the snippet-length, snippet-grading, folded-hyphen, title-snippet, entity-ref, causal-target, block-scalar and duplicate-key gates all pass.

  summary: 'Create: AKT3-Related Overgrowth Spectrum'
  details: |
    New entry for MONDO:0800485 (AKT3-related overgrowth spectrum), curated from the stubs/ queue (stub deleted in this change).

    Deep research: falcon was requested but failed authentication (Edison 503 "Failed to authenticate") twice, including with dr_fallback=--fallback, which did not trigger a fallback for an auth error. The report used is research/AKT3-Related_Overgrowth_Spectrum-deep-research-claude_code.md, run explicitly with the claude_code provider. Its reference validation was clean (8/8 resolved) and term validation clean (5/5), but the report is thin and partly from recall; one recall error (it attributes CCND2 to Riviere 2012, PMID:22729224, which reported AKT3, PIK3R2 and PIK3CA) was not carried into the entry. just preflight-dr returned PASS (AKT3 mentioned 34 times). All claims are anchored in fetched abstracts or PMC full text, mostly found by direct PubMed search rather than taken from the report.

    GeneReviews baseline: the MPPH Syndrome chapter (PMID:27854409) is tagged and its clinical-characteristics phenotypes are captured; its frequencies are pooled across AKT3, CCND2 and PIK3R2 and are labelled as such. No AKT3-specific chapter exists.

    Structure: two subtypes (constitutional MPPH2, MONDO:0014407; mosaic AKT3 hemimegalencephaly/focal cortical dysplasia, no MONDO term), autosomal dominant plus HP:0001442 inheritance blocks, separate DE_NOVO and SOMATIC genetic rows. Pathophysiology chain conforms to pi3k_akt_mtor_cortical_overgrowth. AKT3 loss-of-function microcephaly is excluded in notes. ClinGen's Definitive AKT3 assertion is for the lumped MONDO:0100283, so no gene_disease_validity was recorded. Added the entry to the Somatic_Mosaic_Disorders grouping as a mosaic-arm-of-germline member.

    Validation: just validate passes (schema, terms, references; 80/80 snippets verified); check-entity-refs, check-causal-targets, check-folded-hyphens, check-genereviews (TAGGED) and check-groupings --strict on Somatic_Mosaic_Disorders all pass.

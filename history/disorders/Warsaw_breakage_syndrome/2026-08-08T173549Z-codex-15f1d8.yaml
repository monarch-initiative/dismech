  summary: 'Review: expand and evidence-calibrate Warsaw breakage syndrome'
  details: |
    Re-reviewed the disorder against the updated 2025 GeneReviews chapter and primary clinical and mechanistic literature through 2026. Rebuilt the causal graph to distinguish established replication-coupled sister-chromatid cohesion failure from variable cross-link-induced chromosome breakage; retained the rDNA/ribosome-biogenesis route as provisional. Added current clinical spectrum, prenatal and childhood natural history, literature-count prevalence caveats, autosomal-recessive counseling, molecular and supportive cytogenetic diagnosis, differentials, supportive management and surveillance, patient-cell and engineered-cell systems, zebrafish and mouse models, and explicit knowledge gaps. All new evidence quotations were verified against caches generated with just fetch-reference. No claim of disease-modifying therapy or consensus tumor screening was added.

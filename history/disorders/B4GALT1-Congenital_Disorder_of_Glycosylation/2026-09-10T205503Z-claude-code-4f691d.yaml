  details: |
    Follow-up push after the approving re-review on PR #11644, taking four of the five non-blocking suggestions. Two of the four are defects rather than nits, and one of those is a defect this same round introduced.

    THE ONE THAT MATTERS. The Elevated circulating creatine kinase concentration phenotype was banded FREQUENT on the strength of a single quote from PMID:11901181, which covers one patient. FREQUENT means 30-79 percent; one patient of six is 17 percent. The band was defensible only against Table 1 of PMID:32157688, which the block did not cite. That is the same defect I spent an approval correcting on the sibling PR #11639 an hour earlier - a frequency band whose adjacent evidence does not carry it - and being inconsistent about it in the very next entry would be indefensible. The whole laboratory row of Table 1 is now quoted as a second evidence item, showing all six patient columns with elevated creatine kinase in two of them, and the founding-paper item's explanation says outright that it covers one patient only. The band is unchanged because it is now actually supported.

    THE ONE THIS ROUND INTRODUCED. Macrocephaly was added in the previous push with a description saying it is "secondary to the hydrocephalus", while nothing in the graph encoded that and its cited snippet - vacuum extraction needed at birth - does not carry the claim. So the entry asserted a causal relation in prose that the pathograph contradicted by omission. That is the same shape as the Dandy-Walker note this PR was opened to fix, reintroduced two hundred lines away in the act of fixing it. Hydrocephalus now carries a DIRECT sequela edge to Macrocephaly citing the 2020 table clause "Macrocephaly due to hydrocephalus.", which was already quoted elsewhere in the file.

    Elevated creatine kinase was also a pathograph orphan and now carries reports_on: Myopathy with relationship READOUT_OF, which is what the phenotype's own description already said it was.

    TWO SMALLER ONES. Platelet transfusion now lists Pancytopenia alongside the coagulopathy in target_phenotypes, matching its description, which says it addresses the platelet side of a bleeding tendency with two contributions. Prolonged activated partial thromboplastin time is added as a biochemical marker bound to HP:0003645, quoting the founding paper's laboratory sentence; the coagulopathy phenotype covered it only coarsely and this is the specific assay a screening panel would flag.

    NOT TAKEN. The CDG grouping membership question, for this entry and MOGS-CDG together. It is a membership decision for whoever owns kb/groupings/Congenital_Disorders_of_Glycosylation.yaml rather than a defect in this entry, and both entries would need adding in one change. I searched for an existing issue and found none; not filing one unilaterally.

    A CORRECTION THE REVIEWER MADE TO THEMSELVES, worth recording because it changes what the sequela edge cites. Their round-1 review said the 2020 table cell states the hydrocephalus is due to the malformation. It does not - the "due to" there links macrocephaly to hydrocephalus. They accepted the correction in round 2 and confirmed the causal claim comes from the founding paper, which they had not looked in. The Dandy-Walker sequela edge cites that paper for exactly this reason.

    VALIDATION. just validate passes with 60/60 snippets verified, up from 57/57. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-title-snippets all pass.

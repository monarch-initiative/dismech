  summary: 'Create: B4GALT1-Congenital Disorder of Glycosylation (MONDO:0011772)'
  details: |
    De novo curation of B4GALT1-CDG (CDG-IId). Deep research: one Perplexity sonar-deep-research report, committed; it carries no reference_validation or term_validation block and cites URLs rather than identifiers, so it was used for orientation only and every reference was located independently via PubMed and cached. Evidence: PMID:11901181 (original CDG-IId description), PMID:32157688 (phenotypic and molecular spectrum expansion), PMID:31800099 (CETP glycosylation and activity). Three curation choices are flagged in the entry notes. First, the transferrin biomarker carries two evidence items of opposite direction from the same paper - a SUPPORT for the type 2 pattern being a shared feature and a REFUTE for its consistency, quoting the sentence reporting two patients with normal transferrin - following the CLAUDE.md rule that a source supporting one part of a claim and contradicting another is two items rather than one graded item; presence is VARIABLE for the same reason. This is clinically consequential: a normal transferrin screen does not exclude the disease, and would have missed two of the six patients in the literature. Second, Systemic Glycoprotein Dysfunction is graded HYPOTHETICAL while the parallel CETP arm is not, because only the CETP arm has a named substrate with measured glycosylation and activity changes; marking the contrast shows which half of the disease is mechanistically understood. Third, two biochemical markers are deliberately left unbound because no ontology term was found for a type 2 transferrin isoform pattern or for the Man3GlcNAc4Fuc1 glycan species. Dandy-Walker malformation was mentioned in the claim issue before the primary literature was read; none of the three cited papers reports it, so it is not curated and the notes record that it was considered and dropped for lack of a source. No GeneReviews chapter exists. Validation: just validate passed, 35/35 snippets verified, just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

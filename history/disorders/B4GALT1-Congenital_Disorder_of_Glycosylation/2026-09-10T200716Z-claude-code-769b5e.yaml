  summary: 'Review round 1: curate Dandy-Walker and eight more phenotypes from cached
    full text, correct two frequency bands, add treatments'
  details: |
    Review round 1 on PR #11644, answering the ai4c-reviewer CHANGES_REQUESTED verdict in a single push.

    CORRECTION TO THE PRECEDING RECORD IN THIS DIRECTORY. That record states the deep-research report "carries no reference_validation or term_validation block". That is false; the committed report carries both, with 5/5 references verified, 80 terms and a 0.0 confabulation rate. History records are append-only, so the earlier record stands as written and this one supersedes the claim. The same false claim was made in all five PR descriptions of this batch and in five history records. It originated in reading the report frontmatter seconds after the provider returned, before the recipe appends the validation blocks, and then repeating that stale observation four more times without re-reading.

    THE CRITICAL FINDING, AND IT WAS WORSE THAN THE REVIEW SAID. The entry's notes claimed Dandy-Walker malformation "is sometimes associated with B4GALT1-CDG in secondary sources" and that "none of the three papers cited here reports it". The reviewer found it in the 2020 review's literature table. It is also, and more damningly, in the founding paper PMID:11901181 - already cited six times in this entry - twice in its own prose: "a hydrocephalus due to a Dandy-Walker malformation", and again describing the cystoperitoneal shunt inserted at four months for hydrocephalus "caused by a Dandy-Walker malformation". So the note was not merely wrong about a table cell; it asserted the absence of a finding that the entry's primary source states outright.

    Curated as a phenotype bound to HP:0001305, OCCASIONAL at one of six published patients, with a sequela edge to Hydrocephalus typed DIRECT. The DIRECT typing rests on the source stating the causal direction in its own words, not on the general association between posterior fossa malformation and CSF obstruction. Worth noting for a future reviewer: the review's quoted table cell, "Macrocephaly due to hydrocephalus. Dandy-Walker malformation.", does NOT itself state that the hydrocephalus is due to the malformation - the "due to" there links macrocephaly to hydrocephalus. The causal claim comes from the founding paper, which is why that is what the edge cites.

    ROOT CAUSE, which produced four omissions rather than one. Both sentences sit in the body of a content_type: full_text_xml cache file rather than in its abstract. Reading the abstract and stopping is what also lost the refractory epilepsy, the transient cholestasis and hepatosplenomegaly, and the true frequency of the pulmonary hypertension.

    PHENOTYPES ADDED, nine in total. Dandy-Walker malformation (HP:0001305, OCCASIONAL). Macrocephaly (HP:0000256, OCCASIONAL) - in the founding paper's prose, severe enough at birth to require vacuum extraction. Seizure (HP:0001250, FREQUENT) with preferred_term "refractory epilepsy" - onset 13 months to 2 years in all three 2020 patients, all on three antiepileptic drugs. Cholestasis (HP:0001396, FREQUENT, temporality TRANSIENT) with a second evidence item carrying the source's own negative finding that none of these patients had hepatocellular disease at any point, so the cholestasis is not read as progressive liver injury. Hepatosplenomegaly (HP:0001433, FREQUENT). Elevated circulating creatine kinase concentration (HP:0003236, FREQUENT). Choreoathetosis (HP:0001266) and Dystonia (HP:0001332), both OCCASIONAL, curated separately because HPO treats dystonia as a distinct movement disorder from the choreoathetoid pair. Gait ataxia (HP:0002066, OCCASIONAL).

    TWO FREQUENCY BANDS CORRECTED, in opposite directions, by the same recount. Pulmonary arterial hypertension moves OCCASIONAL to FREQUENT: the earlier band read the abstract's word "novel" as a claim about rarity, when the paper's own discussion says PPHN "has not been described so far as part of other glycosylation defects" - novel to the CDG phenotype, not rare among patients, and present in three of six. Its preferred_term is now "persistent pulmonary hypertension of the newborn" with temporality TRANSIENT, because it resolved within the first month in every case and the unqualified HPO term suggests something chronic; HPO has no PPHN term. Hydrocephalus moves FREQUENT to OCCASIONAL: the original single-patient description names it as one of three defining features, which is how it came to be banded high, but across six published patients it appears in one. The band follows the patient count, not the emphasis of the first report. The reviewer asked for the first of these; the second follows from applying the same method consistently and was not requested.

    TREATMENTS. The section did not exist. Five added, all quoted from the cached full text: colony-stimulating factor therapy for the neutropenia, romiplostim for the thrombocytopenia (with dosing_interval weekly / dosing_interval_days 7), ursodeoxycholic acid for the cholestasis, platelet transfusion for acute bleeding, and the cystoperitoneal shunt for the hydrocephalus. The shunt is bound to the generic NCIT:C15329 rather than NCIT:C168483 (Ventriculoperitoneal Shunt Placement), which is a different operation - the source says cystoperitoneal, draining the posterior fossa cyst. therapeutic_modality is left unset on the two recombinant-protein treatments; neither PROTEIN_REPLACEMENT nor PEPTIDE states what a G-CSF or a peptibody given pharmacologically is.

    CONNECTIVITY. Systemic Glycoprotein Dysfunction now emits fifteen edges rather than four, covering every phenotype the node's own evidence names. Its description is widened to cardiovascular and renal, and two further evidence items are added to license that - the 2020 statement of the disease's organ range and the abstract sentence naming pulmonary hypertension and nephrotic syndrome. The direct edge to Hydrocephalus is replaced by an edge to Dandy-Walker malformation, so the hydrocephalus is now reached through the malformation the source names as its cause.

    CLASSIFICATIONS AND MAPPINGS, both suggestions, both taken. icimd_category n_linked_protein_glycosylation, with a caveat the single-category assignment cannot express: beta-1,4-galactosyltransferase 1 transfers galactose onto terminal GlcNAc wherever it occurs, so O-linked glycans and glycolipids are substrates too, and the N-linked assignment names where the defect is diagnosed rather than the enzyme's full reach. mappings icd10cm E77.8 as a broadMatch, matching the sibling MOGS-CDG entry.

    GENEREVIEWS, stated precisely. The earlier note said "No GeneReviews chapter exists for B4GALT1-CDG; a PubMed search returned nothing." There is no B4GALT1-specific chapter, but the nearest thing does exist and is cached in this repository: PMID:20301507, the multi-pathway N-linked glycosylation overview, which is a retired chapter for historical reference only and contains zero B4GALT1 or CDG-IId content. It is deliberately neither tagged GeneReviews nor cited, and the note now says that rather than implying nothing was found.

    VALIDATION. just validate passes with 57/57 snippets verified, up from 35/35. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-title-snippets all pass.

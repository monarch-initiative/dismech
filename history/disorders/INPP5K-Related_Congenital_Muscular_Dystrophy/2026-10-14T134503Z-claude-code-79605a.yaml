  summary: 'Create: INPP5K-Related Congenital Muscular Dystrophy'
  details: |
    New entry for MONDO:0024607 (INPP5K, autosomal recessive), replacing stub Congenital_Muscular_Dystrophy_With_Cataracts_And_Intellectual_Disability. Lump/split: one DISEASE entry; the cataract-predominant Pakistani family (PMID:28940338) carries the same p.Ile50Thr allele as the first discovery families and is treated as variable expressivity, not a separate allelic disorder; kept separate from Marinesco-Sjogren syndrome (SIL1) and recorded as a differential, with Dystroglycanopathy and 3-phosphoglycerate dehydrogenase deficiency. No grouping fits. Pathograph: INPP5K 5-phosphatase deficiency -> impaired PI(4,5)P2 to PI(4)P conversion on autolysosomes -> defective autophagic lysosome reformation -> lysosome depletion and autophagic flux inhibition (conforms_to disabled_macroautophagy#Failure of Cytoplasmic Quality Control) -> skeletal myofiber degeneration -> muscle phenotypes, mainly from the muscle-specific knockout mouse (PMID:33119550, PMID:33879025), with the negative human fibroblast flux result (PMID:28190456) recorded as REFUTE and as a HUMAN_MODEL_MISMATCH discussion. Lens, neuronal differentiation, PHGDH, ER tubule/sheet and secondary alpha-dystroglycan hypoglycosylation nodes are branch nodes with zebrafish, cell-line or proteomic support. AKT hyperactivation is recorded in notes as a rejected mechanism (AKT inhibition did not rescue). Two animal models (Inpp5k fl/fl MCK-Cre mouse; inpp5ka morphant zebrafish) with modeled_mechanisms. Treatments: cataract surgery; L-serine marked preclinical (zebrafish only). Prevalence from ORPHA:662184 (below 1 in 1,000,000), fetched via just fetch-reference, which downloaded the drifted Orphadata release without changing the manifest pin. Deep research: one OpenScientist report (research/INPP5K-Related_Congenital_Muscular_Dystrophy-deep-research-openscientist.md). Reference validation 15/15 resolved, 0 unresolved, 0 off topic; term validation needs_review (HP:0001251 label, obsolete GO:0006486). just preflight-dr returned WARN: the report cites OMIM 616827, which MONDO maps to LGMD R 2W (MONDO:0014788); INPP5K is mentioned 63 times and no rival gene is discussed, so the WARN is an identifier error, not a wrong-disease report. The report also gives HGNC:21940 for INPP5K (not resolvable at HGNC REST; correct id hgnc:33882) and states no mouse model exists (contradicted by PMID:33119550); no identifiers were taken from the report. Report citations used: 28190456, 28190459, 33193651, 28940338, 33792664, 33060052, 38559586, 39133882, 42467360. Report citations not used: 19250614, 19272022, 20336382, 22403078, 22682687, 26170120 (insulin/AKT signalling, porcine SKIP expression, generic 5-phosphatase reviews and a tumour-suppressor locus study; not about the disease mechanism). Additional references found by PubMed search: 33119550, 33879025, 30087126, 37184573, 31630891. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER); no ClinGen validity row for INPP5K. Validation: just validate, validate-terms, count-verified-snippets (84/84), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, check-retired-support-prose, check-folded-hyphens and validate-disorders all passed.

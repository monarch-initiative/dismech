  summary: 'Create: Chronic_Pyelonephritis'
  details: |
    New entry for chronic pyelonephritis (MONDO:0001110) with reflux-associated and obstructive subtypes, plus a pointer subtype (curated_in) to Xanthogranulomatous_Pyelonephritis, which MONDO and its own entry place under chronic pyelonephritis. The causal chain runs from reflux or obstruction through recurrent upper-tract infection, tubulointerstitial inflammation, myofibroblast activation (conforming to fibrotic_response) and corticomedullary scarring to nephron loss and scar-associated hypertension, ending in proteinuria, FSGS, CKD and kidney failure. The debate over whether infection is required is recorded in notes and in a KNOWLEDGE_GAP discussion. Phenotype frequencies were deliberately left unset because the quantitative sources are selected cohorts whose figures disagree. Leads came from the claude_code deep-research report research/Chronic_Pyelonephritis-deep-research-claude_code.md; every snippet was re-verified against cached references. Validated with just validate, validate-terms, count-verified-snippets and the whole-repo gates.

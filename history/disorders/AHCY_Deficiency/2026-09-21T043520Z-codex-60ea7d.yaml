  summary: Review AHCY clinical spectrum, methylation evidence and experimental models
  details: |
    Reviewed the matching deep-research report and citation audit against generated primary references and consensus guidance. Replaced bundled mechanisms with 14 atomic nodes; expanded 15 phenotypes to 38 and added seven care interventions, four diagnostic procedures, three animal and two experimental models. Distinguished variable blood DNA hypermethylation from hypothesized non-DNA methyltransferase inhibition, and identified the DNMT/PRMT percentages as discussion citations rather than primary assays. Corrected cross-sectional muscle imaging, short-term transplant outcomes, allele-versus-carrier frequencies and the age of HCC diagnosis. Qualified the newer AHCY/PITX3 dual-diagnosis case and removed any implication of carrier HCC risk. Primary zebrafish, worm and recombinant studies now constrain model claims by tissue, stage and assay. Independent peer audit confirmed methylation, recombinant and SW480 scope. Schema, live terms and all draft evidence snippets passed; final guards and history validation recorded in the PR. Included the reviewed tracked PMC adapter for reproducible full-text recovery, without ignored environment modifications. All reference changes were generated by just fetch-reference; no reference caches were hand-edited and the frozen dataset accession file was not accessed.

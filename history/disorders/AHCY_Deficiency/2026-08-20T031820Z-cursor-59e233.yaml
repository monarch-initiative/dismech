  details: |
    De-novo Disease curation of S-adenosylhomocysteine hydrolase (AHCY)
    deficiency (MONDO:0013404) as kb/disorders/AHCY_Deficiency.yaml.

    Lump/split: curated as a standalone Disease (single-enzyme methionine-cycle
    hydrolase block). Not a grouping, not a subtype of Adenosine Kinase
    Deficiency, and not added to
    kb/groupings/Intoxication-Type_Inborn_Errors_of_Metabolism.yaml — classic
    AHCY is developmental/hepatic/myopathic rather than an intoxication-type
    acute decompensation. Sibling MAT1A/GNMT/ADK/CBS disorders remain separate.
    Duplicate preflight found AHCY only as a biochemical differential inside
    Adenosine_Kinase_Deficiency.yaml; ADK was left untouched.

    Deep research: just research-disorder falcon AHCY_Deficiency (Edison,
    ~11 min). Report is about AHCY, not ADK/MAT1A/CBS as the primary disease.
    just preflight-dr research/AHCY_Deficiency-deep-research-falcon.md
    MONDO:0013404 -> WARN: canonical gene AHCY mentioned 27 times (PASS-level
    gene signal) but the report cites gene OMIM 180960 while MONDO xrefs
    disease OMIM 613752. Not NEC. Report reference validation: 12/12 resolved,
    0 unresolved, 0 off-topic.

    GeneReviews: PubMed searches for this disease and for isolated
    hypermethioninemia returned no GeneReviews chapter.

    Evidence: PMIDs 15024124, 16435181, 19177456, 20852937, 26527160, 26974671,
    27671891, 31957987, 33869213, 35463910, 39512434 fetched via
    just fetch-reference. ClinGen gene-disease validity rebuilt as
    CGGV:assertion_d9b3a56b-b188-44d1-9983-a059895c0ba1-2024-12-13T170000.000Z
    (Definitive, AR). Snippets are exact abstract/cache quotes. Curation-loop
    count-verified-snippets: 54/54 verified against cached references. No
    enzyme-replacement invented. No conforms_to
    metabolic_intoxication_decompensation. Orphanet ORPHA:88618 noted in
    prevalence notes; local Orphadata XML was not present so no ORPHA cache
    row is cited.

    Issue 5557 is a metabolic WP-002 package, not a claim on this disease;
    this work closes claim issue 9019 only.

  summary: 'Rung-3 review: split RV-C, record the RV-A/RV-B lump; add transmission'
  details: |
    Applied the rung-3 lump/split test of the infectious-disease granularity ladder (design decisions section 3e, rules R6 to R16) plus the rule R25 transmission requirement.

    Decision: MIXED, and deliberately so. One has_subtypes row was added for rhinovirus C with classification etiologic_species, and a deliberate lump was recorded in review_notes for rhinovirus A and rhinovirus B.

    RV-C clears rule R7 on diagnosis, which is uncontested: the Jacobs review (PMID:23297263) states that HRV-C strains do not grow in standard cell culture, which is why the species was not recognised until molecular methods arrived, and Bochkov's receptor study (PMID:25848009) shows that expressing CDHR3 is what makes otherwise unsusceptible cells support RV-C binding and replication. It also has a presentation signal, a higher frequency of wheezing and asthma exacerbation, reported by Bizzintino (PMID:20693244, higher asthma severity scores than RV-A or RV-B only, p = 0.018) and Erkkola (PMID:31876616). That signal is contested, so the row carries the contrary evidence beside it as two REFUTE items: the Jacobs review reports well-designed studies in which RV-A and RV-C lower-respiratory illness appear similar, and the Amman cohort (PMID:35918790) that found more wheezing with RV-C concluded that neither codetection nor species affected most clinical outcomes. Recording both is the honest state of the axis.

    RV-A and RV-B were kept together because nothing separated them on any of the six axes. Management is identical and supportive with no approved antiviral, clinical detection is a pan-rhinovirus molecular assay so species typing is a research and surveillance step, transmission is contact and aerosol for all three, and the review reports similar seasonality for groups A and B. Three PubMed searches, named verbatim in the review_notes paragraph so they can be re-run, returned no hits; a fourth returned the two paediatric cohorts already cited on the RV-C row. The only comparative figure found, viremia in 3 percent of RV-A against 0 percent of RV-B infections, is a single-study laboratory finding and is not curated as an axis. Rule R10 makes the split additive if a series later separates them.

    MISSING_TRANSMISSION was fixed with two routes: contact and fomite transmission with self-inoculation, from Gwaltney's volunteer experiment (PMID:205151) in which the hand route initiated infection far more often than either aerosol route and from the review's statement that infection is efficiently initiated by intranasal and conjunctival but not oral inoculation; and aerosol transmission, recorded as the secondary route for the same reason.

    The three infectious_agent records previously carried receptor and severity claims with no evidence at all. Each now carries cited evidence, and the RV-B and RV-C descriptions were reworded so they state the comparative severity claim with the hedging the sources actually use. Nothing else was touched: disease_term, pathophysiology, phenotypes, treatments and datasets are unchanged, and no progression block was added. The cache for PMID:23297263 was refetched and came back as full text where it had been abstract only, so that cache file is part of this change. Validation: just validate-disorders over the four entries in this tranche reported 248 snippets checked and 0 issues; just check-granularity on this file no longer reports TAXON_LUMP or MISSING_TRANSMISSION.

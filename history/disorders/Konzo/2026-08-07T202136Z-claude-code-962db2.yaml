  summary: Link cassava, protein deficit, and drought to the toxic chain
  details: |
    Backfill for issue #8085. This entry models konzo as a two-factor poisoning and the three exposures divide accordingly. Insufficiently processed bitter cassava overconsumption is TRIGGERS with DIRECT into the linamarin and cyanide exposure node, because the exposure and the node are the same event seen from either side of the mouth. Protein malnutrition with low sulfur amino acid intake is TRIGGERS with DIRECT into the impaired detoxification node for the same structural reason: detoxifying cyanide to thiocyanate consumes a sulfur donor supplied by dietary methionine and cysteine, so the shortfall at the node is the dietary shortfall itself. Its two evidence items quantify wasting and stunting in konzo patients and conclude malnutrition may be a key factor, which establishes the nutritional deficit and its association with disease rather than the sulfurtransferase step; the description says so. Drought and food shortage is graded below both at PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES, because drought contains no cyanide and reaches the node only through forced dependence on bitter cassava and shortcuts in processing it, both of which the cited snippet names. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 37 of 37 verified.

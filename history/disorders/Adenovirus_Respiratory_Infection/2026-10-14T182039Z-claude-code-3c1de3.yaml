  summary: 'Review fix: swap to the method-less adenovirus DNA LOINC code'
  details: |
    Reviewer correction: the original binding, LOINC:96503-8 (Adenovirus DNA [Presence] in Respiratory system specimen by NAA with probe detection), was method- and specimen-specific, based on an unverified claim that no method-less code existed. Re-searched the Monarch KG: LOINC:105887-4 (Adenovirus DNA [Presence] in Specimen) is method-less and specimen-generic. A further search for an organism-level code with no detection-target commitment (parallel to the Streptococcus pyogenes [Presence] in Specimen code used elsewhere) returned only antigen- or culture-qualified adenovirus codes, none target- and method-less at once, so 105887-4 remains the closest available identity-level code and is bound in its place. Reworded the row's notes to state this search explicitly. Removed the now-unused 96503-8 row from cache/loinc/terms.csv and seeded 105887-4 after confirming it was absent from origin/main.

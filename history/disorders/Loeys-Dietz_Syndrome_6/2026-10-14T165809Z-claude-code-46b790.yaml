  summary: 'Review: Loeys-Dietz_Syndrome_6'
  details: |
    Evidence-claim review of the full entry; literature was limited to the local reference cache because PubMed was unreachable, and all 91 snippets verify against it. (1) Backfilled gene_disease_validity on SMAD2 from the cached ClinGen record CGGV:assertion_c32835d3-af61-4b05-902c-d17b406beef6-2025-08-01T160000.000Z (Definitive, AD, MONDO:0030500 = this disease_term), with the table row as evidence; added a gene note that ClinGen lumps LDS6 with familial TAAD and treats the congenital-heart-disease presentation (OMIM:619657) as a separate disease, so the Definitive tier attests the vascular arm only. Entry scope and disease_term unchanged. (2) Added two ClinGen evidence items: the lump/split sentence to discussion smad2_two_phenotype_split, and the panel's statement that the SMAD2 aortic signalling mechanism is unclear to discussion smad2_aortic_tgfb_paradox_untested. (3) Removed six explanations arguing for the retired PARTIAL grade; the items were regraded with directness INDIRECT (TGF-beta paradox demonstrated in other LDS genes, allele-class hypothesis, iPSC heterotaxy link, CHD-cohort carrier rate) or quote_role BACKGROUND/REVIEW_SYNTHESIS (PMID:40028843 prior-variant summary, PMID:42380922 review). (4) Wired Hypertelorism and Marfanoid Habitus from the SMAD2 variant node as INDIRECT_UNKNOWN_INTERMEDIATES edges, each with a PMID:29967133 family-level snippet; causally connected phenotypes went from 7/13 to 9/13. Developmental delay, seizure, short stature and dysmorphic features were left unwired: they are reported in two probands with complex congenital heart disease and no source attributes them to a mechanism node. Validated with the full per-file and KB-wide gate list and validate-disorders.

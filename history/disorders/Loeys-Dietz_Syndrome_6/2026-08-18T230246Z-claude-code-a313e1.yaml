  summary: 'Review response on PR #8864: evidence the comparative dissection-threshold
    claim and add TGF-beta paradox lineage nuance'
  details: |
    Addressed the single blocking finding on PR #8864.

    The Prophylactic Aortic Surgery treatment asserted that Marfan operative diameter thresholds are not transferable because Loeys-Dietz dissection occurs at smaller diameters, but its only snippet ("aneurysms are amenable to early and aggressive surgical intervention") supported early surgery and said nothing about the comparative threshold. Added two evidence items: the GeneReviews sentence that states the comparison directly ("aortic dissection can occur at smaller aortic diameters and at younger ages than observed in Marfan syndrome", PMID:20301312), and the Velchev/Dietz/Loeys review natural-history sentence (PMID:34807423), which this PR had cached but cited zero times.

    Extended the smad2_aortic_tgfb_paradox_untested KNOWLEDGE_GAP with the Velchev generic paradox statement (recorded as PARTIAL: it generalises over the whole LDS gene set including SMAD2 without a SMAD2-specific aortic tissue series behind it, which is the unexamined generalisation this gap flags rather than a resolution of it) and with the MacFarlane 2019 lineage-specificity result (PMID:30614814, newly fetched with just fetch-reference). Second-heart-field-derived aortic-root VSMCs show impaired ligand-induced Smad2/3 activation while neighbouring cardiac-neural-crest-derived VSMCs retain signalling potential and show increased Smad2/3 phosphorylation in vivo, and CNC- but not SHF-specific Smad2 deletion was protective. The rationale now explains that a bulk aortic pSMAD2 readout can average two opposite lineage-level effects, and the proposed experiment requires the SMAD2 readout to be resolved by lineage rather than reported as a bulk value.

    Substituted CL:0002539 (aortic smooth muscle cell) for CL:0000359 on the aorta-specific "Aortic Medial Degeneration and Wall Weakening" node - the organ-specific-substitution pattern that mechanism modules expect, and which gives the previously consumer-less cache rows a consumer without hand-editing cache/.

    Recorded in the prevalence notes that the deep-research "SMAD2/LDS6 is roughly 1-5% of LDS" figure was seen and deliberately not curated (review-sourced, no denominator-bearing cohort, and a fraction-of-LDS share cannot be converted to an LDS6 population prevalence without an LDS prevalence that is itself unestablished).

    Deliberately not done: no diagnosis: section (TTE/CTA/CMR-MRA content is already curated as the Whole-Arterial-Tree Imaging Surveillance MONITORING treatment plus the GeneReviews diagnostic statement in definitions:, so a diagnosis: block would duplicate rather than add); no clinical_trials: (no registered trial enrolled SMAD2-positive participants - I-LoDiS enrolled TGFBR1/2 only and GenTAC reports no LDS6 subgroup); no edit to kb/disorders/Loeys-Dietz_Syndrome.yaml, whose has_subtypes: block is concurrently being edited by PRs #8861 and #8862 - filed issue #8866 to reconcile once all three land.

    Validation actually run and read: just validate (passed), just count-verified-snippets (86/86 verified against cached references, up from 81), just validate-terms (passed), just check-duplicate-keys (no duplicates), just validate-disorders kb/disorders/Loeys-Dietz_Syndrome_6.yaml (schema, terms and references all passed; 86/86). just check-title-snippets reported 4 findings, all in the unrelated Juvenile_Neuronal_Ceroid_Lipofuscinosis.yaml, none in this entry.

  summary: 'Create: Loeys-Dietz Syndrome 6 (SMAD2, MONDO:0030500)'
  details: |
    New Mendelian disorder entry for Loeys-Dietz syndrome 6 (SMAD2-related), MONDO:0030500 / OMIM:619656.

    Disease identity. MONDO carries no definition text for MONDO:0030500 and the Loeys-Dietz numbered series is a high Named-Entity-Confusion-risk class, so identity was anchored on OAK rather than on any narrative source. "uv run runoak -i sqlite:obo:mondo info MONDO:0030500 -O obo" returned: xref OMIM:619656; exact synonym "LDS6" attributed to OMIM:619656; is_a MONDO:0018954 Loeys-Dietz syndrome; relationship RO:0004003 HGNC:6768 SMAD2. That RO:0004003 assertion plus the OMIM cross-reference is what establishes SMAD2 as the LDS6 gene here.

    Deep research. falcon (Edison Scientific), report at research/Loeys-Dietz_Syndrome_6-deep-research-falcon.md. NEC preflight "just preflight-dr research/Loeys-Dietz_Syndrome_6-deep-research-falcon.md MONDO:0030500" returned PASS: canonical gene SMAD2 mentioned 63 times against TGFBR1=9, TGFBR2=8, SMAD3=5, TGFB3=4; MONDO OMIM 619656. The report's own reference validation (linkml-reference-validator 0.2.1) reported 7 references checked, 7 resolved, 0 unresolved, 0 off topic, confabulation_rate 0.0; no unresolved_references list and no needs_review flag. Correction: an earlier draft of this record quoted SMAD2=86 and 6-of-6 references. Those figures came from a first falcon run whose report file was overwritten when the run was relaunched after a session interruption; the figures above are from a preflight re-run against the report file actually committed in this branch. The verdict was PASS in both runs. Two claims the report carried were deliberately NOT curated because they could not be verified against the local cache: the Micha 2015 fibroblast pSMAD2/pSMAD3 functional result (full-text-only, not in the cached record) and the Schepers Table 5 SMAD2 feature list (extracted by the tool from a figure image, absent from the cached full text).

    Content curated. Seven-node pathophysiology chain from the heterozygous SMAD2 loss-of-function variant through impaired canonical TGF-beta/SMAD2 signal transduction, a disrupted SMAD2-dependent transcriptional programme, aortic medial degeneration, progressive dilation and arterial dissection, with a parallel NODAL/SMAD2 cardiac-morphogenesis and left-right-specification arm. Four nodes declare conforms_to against aortopathy_tgfbeta_dysregulation (TGF-beta Signaling Dysregulation, Aortic Medial Degeneration and Wall Weakening, Progressive Aortic Dilation and Aneurysm, Aortic Dissection and Rupture). Thirteen phenotypes covering both the late-onset vascular presentation (aortic aneurysm, aortic root aneurysm, aortic and coronary dissection, arterial tortuosity, hypertelorism, marfanoid habitus) and the congenital presentation (complex congenital heart disease, heterotaxy, developmental delay, seizure, short stature, facial dysmorphism). SMAD2 genetic section documenting the MH2-domain clustering of the reported missense alleles. Four discussions: three KNOWLEDGE_GAP (LDS6 unplaced in the LDS severity ranking; the unexplained two-phenotype split and whether allele class predicts it; the aortic TGF-beta paradox never tested in SMAD2-variant tissue) and one HUMAN_MODEL_MISMATCH (Smad2-null mouse embryos die before E8.5 from defective egg-cylinder elongation, so aortic size cannot be examined and no in vivo LDS6 aortopathy model exists). Seven treatments, progression across three phases, and a prevalence record.

    Deliberate omissions. datasets left empty: SMAD2 is a heavily studied cancer and TGF-beta gene, so a gene-only accession search would surface wrong-disease datasets - the Named Entity Confusion risk CLAUDE.md warns about for dataset curation. kb/disorders/Loeys-Dietz_Syndrome.yaml was not edited at all: sibling agents are concurrently curating LDS2 (issue 8749) and LDS4 (issue 8750) in that file, so this entry cross-references the umbrella and the module in prose instead of adding a subtype there.

    Pre-PR red-team review. A subagent review against the dismech-pr-review skill re-verified every snippet, ontology term and cross-reference and raised six substantive findings, all addressed before opening the PR: (1) the MH2-domain clustering claim was stated unqualified but is a property of the aneurysm literature only - the congenital-heart-disease cohort's missense variants concentrate in exon 4 and the modelled p.Arg114Cys allele is in MH1 - so the claim is now scoped and carries two qualifying evidence items; (2) the NODAL-SMAD2 laterality mechanism was asserted three times with no citation and in the wrong direction, and is now rewritten to the evidenced mechanism (SMAD2 haploinsufficiency reduces NODAL/LEFTY1/LEFTY2 expression) with IN_VITRO evidence attached to the node, the causal edge and the heterotaxy phenotype; (3) all thirteen phenotypes were orphaned from the pathograph, and seven pathophysiology-to-phenotype downstream edges were added; (4) no phenotype cited the GeneReviews Clinical Characteristics section, now fixed on Hypertelorism; (5) the GeneReviews diagnosis snippet was truncated before its clinical qualifier and is now quoted in full, with the working sufficiency criterion added as a second evidence item; (6) the iPSC system was discussed but not modeled, and is now an experimental_models entry with two modeled_mechanisms links and three readouts. Minor findings also applied: the Orphanet gene row was removed from a phenotype where it evidenced nothing, cell-type preferred_terms were aligned to the CL label used, two bare-fragment snippets were requoted with their SMAD2 attribution intact, the genetic-counselling entry moved to action_category COUNSELING_INFORMATIONAL, an ISDS skeletal classification was added for consistency with the sibling subtype entries, and the 2026 preclinical-modeling review was cited in the model-gap discussion.

    Validation actually run, with output read. just validate: passed. just count-verified-snippets: 81/81 verified against cached references after the review fixes (70/70 before them). just validate-terms: passed. just check-duplicate-keys: passed. just compliance: 87.4 percent global, 87.7 percent weighted after the review fixes; it read 90.3/90.7 before them, the experimental_models block having added recommended slots to the denominator faster than it filled them. just validate-disorders (the batched pre-PR sweep CI runs): all validations passed. Also run: just check-title-snippets (no new title-quoting snippets) and the pytest data suite (6192 passed).

  summary: 'Review round 1: curate omitted phenotypes, correct a false omission note
    and a frequency band'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #11582.

    Important finding, first half. The notes: block claimed renal and gastrointestinal anomalies, cleft palate, preauricular pits and seizures had no quotable source in the fetched set. Verified against references_cache/PMID_33643973.md directly: false for renal, gastrointestinal and epilepsy, which that paper states in both its abstract and its introduction. Curated all three as phenotypes (HP:0000077, HP:0011024, HP:0001250). Preauricular pits curated from PMID:31428485's literature summary of the pure distal 3p phenotype (HP:0004467), graded INDIRECT because the source hedges with 'possibly' and the paper's own case is a different rearrangement. Cleft palate confirmed genuinely unsourceable across every cached reference in the PR; the nearest statement is a high-arched palate, a different HPO concept. Rewrote the note to say this per feature.

    Second half. Ear anomalies were absent entirely and not in the omission list. Added Low-set ears (HP:0000369) and Abnormal pinna morphology (HP:0000377), both verified with OAK, sourced from PMID:33643973 and PMID:2178418.

    Suggestions. Took GO:0007155 -> GO:0007158 (neuron cell-cell adhesion), verified with OAK; it is more specific and matches the preferred_term already written. Added a Loss of BRPF1-Dependent Histone Acetylation pathophysiology node wired from the 3p25.3 region node and downstream to Ptosis and Intellectual disability, with every edge graded INDIRECT and INDIRECT_UNKNOWN_INTERMEDIATES to match the source's 'may lead to' / 'can cause' hedging, plus the source's own per-patient bound excluding the hearing, renal and GI features.

    Declined the hearing frequency change, with argument: PMID:33643973 reports 29 percent, which is the top of OCCASIONAL (5-29 percent) and does not reach FREQUENT, which begins at 30 percent. Band unchanged; the figure is now cited on the phenotype so the arithmetic is visible.

    Found a band error the review did not: the same paper reports 43 percent for congenital heart disease and PMID:19760623 says 'about a third', both FREQUENT, while the entry recorded AVSD as OCCASIONAL and its explanation named that band explicitly. Corrected to FREQUENT with the second source added.

    Caught one self-inflicted defect during the round: GO:0043966 was written from memory for the BRPF1 node and OAK reports it obsolete. Replaced with GO:0043994 (histone H3K23 acetyltransferase activity), which also matches the source's H3K23 claim exactly and belongs in molecular_functions rather than biological_processes.

    Validation: just validate (96/96 snippets, up from 82), just validate-disorders (gate, passed), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-qualifier-terms-online, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-term-cache-integrity, check-cache-order, list-gene-term-mismatches (13 genes, 0 findings). All pass.

  summary: 'Review round 2: correct the motor-delay frequency derivation'
  details: |
    Second review round on PR #11593. The reviewer caught a misreading introduced by the previous round: motor delay had been downgraded VERY_FREQUENT to FREQUENT on the stated ground that PMID:33643973 reports mental and motor developmental disability in 19 of 29 pooled cases (66 per cent). That sentence is about age at onset — 'A total of 29 well-documented cases were found in the literature, of which 19 cases had an onset within 1 year of birth' — not about how many patients carry the phenotype. The same paper's Table 3 carries the per-case answer: the Motor development retardation row is marked + in 27 of 29 cells and - in 2, which is 93 per cent and the VERY_FREQUENT band. Restored VERY_FREQUENT, added the Table 3 row as an evidence item quoting it verbatim, and rewrote the explanation on the definitional item so it no longer asserts the 66 per cent arithmetic. Also removed the mondo_mappings entry, which mapped MONDO:0013424 to itself: the entry's disease_term is already that identifier, so the mapping added no concept and would have double-counted the term in MONDO coverage tooling. Orphanet's agreement on the identifier is still recorded in external_assertions. Verified against the cached reference before editing rather than taking the review on trust. Re-ran and read: just validate (152/152 snippets), just validate-disorders (passed, 152/152), check-entity-refs, check-enum-values, check-duplicate-keys, check-snippet-grading, check-snippet-length, check-title-snippets — all clean, no baseline touched.

  summary: 'Review round 1: Orphanet-sourced phenotypes, mappings, motor-delay frequency
    anchor'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11593 in one push.

    Finding 1 (Motor delay frequency). The frequency qualifier was anchored to
    PMID:41384039, a two-half-sibling case report whose subjects also carry a
    48.86 Mb 8q22.1-q24.3 duplication spanning 193 genes. Re-anchored to
    PMID:33643973, the pooled 29-case literature review, quoting its statement that
    the syndrome is "characterized by ... motor developmental delay" as distinct
    from its "other rarer symptoms". Downgraded VERY_FREQUENT to FREQUENT, because
    that review's own arithmetic is 19 of 29 published cases (66 per cent) with
    mental and motor developmental disability, which sits in the FREQUENT band and
    not the VERY_FREQUENT one. PMID:41384039 is retained as phenotype support only,
    with its explanation rewritten to name the 8q duplication and say the motor
    finding in those two individuals cannot be attributed to the 3p loss alone.

    Finding 2 (missing research-backed phenotypes). Cached the Orphanet record
    ORPHA:1620 (references_cache/ORPHA_1620.md, generated by
    just structured-rebuild-orphanet, committed with this change) and added eight
    phenotypes graded against its HPO annotation table, each with an exact row
    quote: Hypertelorism (HP:0000316, VERY_FREQUENT), Downslanted palpebral
    fissures (HP:0000494, no frequency, quoted from the narrative definition rather
    than the table), Epicanthus (HP:0000286, FREQUENT), Brachycephaly (HP:0000248,
    FREQUENT), High palate (HP:0000218, FREQUENT), Cleft palate (HP:0000175,
    FREQUENT), Sacral dimple (HP:0000960, OCCASIONAL) and Cryptorchidism
    (HP:0000028, FREQUENT). Epicanthus, brachycephaly and high palate were not on
    the reviewer's list but clear the same >10 per cent bar and cost one quoted row
    each. Every HP label was read from cache/hp/terms.csv rather than written from
    memory, which is how HP:0000494 is bound as "Downslanted palpebral fissures"
    and not as the report's phrasing.

    Two of the reviewer's named features were declined, for different reasons, both
    recorded in notes. Synophrys is an evidence gap: Orphanet does not annotate it
    and it appears in none of the thirty cited caches. Hypertrichosis is quotable
    from PMID:41384039 but that paper attributes it to the 50 pathologically
    significant genes of the 8q duplication, not to the 14 genes of the 3p
    deletion, so curating it here would assign this syndrome a feature its only
    source assigns to a co-occurring lesion.

    Finding 3 (no mappings block). Added mappings with icd10cm_mappings
    (ICD10CM:Q87.8, label read from sqlite:obo:icd10cm) and mondo_mappings
    (MONDO:0013424), both sourced and consistency-checked against the Orphanet
    cross-reference rows. OMIM 613792 and ORPHA:1620 could not go in that block:
    DiseaseMappings has slots only for ICD-10-CM, ICD-11 Foundation, MONDO and
    NCIT. Both are recorded as external_assertions instead, with the Orphanet
    cross-reference row "OMIM:613792 | Exact" as the verification for the OMIM
    identifier.

    The ICD-10-CM predicate is skos:broadMatch, not the skos:narrowMatch that
    Alagille_syndrome and Noonan_Syndrome use for the same Orphanet relation.
    Orphanet's "Narrower" label means the ORPHAcode is narrower than the target
    code, so read outwards from this entry Q87.8 is the broader term. The reasoning
    is written into mapping_justification rather than left implicit, and the
    verbatim Orphanet row is kept in consistency.notes. Fifteen entries in kb/
    already use broadMatch for this shape.

    Both SUGGESTION items were taken. The Physical Therapy REFUTE snippet now uses
    the typographic apostrophe the source has (U+2019 in "sibling's"), verified by
    od against references_cache/PMID_41384039.md, and its explanation carries the
    same 8q duplication caveat as finding 1.

    Notes updated in three places: the "frequency source that could not be used"
    paragraph now records that Orphanet supplies quotable bands for most of what
    the Korean series was wanted for, and that the two sources disagree on cleft
    palate (Orphanet 30-79 per cent, Korean series 7.8 per cent) with the
    disagreement recorded rather than averaged; a new paragraph records how
    ORPHA_1620.md was built; and the declined-phenotype reasoning above.

    Provenance caveat worth flagging. data/orphadata/MANIFEST.yaml was deliberately
    NOT repinned. Orphanet has published a new release behind the same unversioned
    URL since the pinned 2025-12-09 snapshot, so just refresh-orphadata fails on a
    checksum mismatch for all five bulk files. ORPHA_1620.md was therefore built
    from the current upstream release while the manifest still pins the older one,
    which means the snapshot date the file prints in its Source section names the
    pin rather than the bytes it was built from. Repinning rebuilds all 8,823 ORPHA
    cache files and belongs in its own change. This is recorded in the entry notes
    so the next full rebuild is not mistaken for drift.

    Validation. just validate, just validate-terms, just check-entity-refs, just
    check-causal-targets (123 dangling grandfathered, none new), just
    check-duplicate-keys, just check-enum-values, just check-qualifier-terms (2
    labels match) and just validate-disorders all pass; snippets 151/151 verified,
    up from 140/140. just normalize-cache reported no files updated, just
    check-term-cache-integrity and just check-cache-order both OK. Whole-KB ratchet
    gates check-snippet-grading, check-snippet-length, check-title-snippets,
    check-reference-titles, check-folded-hyphens and check-environmental-evidence
    all report no new findings; no baseline was modified. just
    list-gene-term-mismatches reports 0 findings across 11 HGNC bindings.
    check-source-defect-claims surfaces nothing in this entry. Cache CSV changes are
    two additive rows, both for ICD10CM:Q87.8.

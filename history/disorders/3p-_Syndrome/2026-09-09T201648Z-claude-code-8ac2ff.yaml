  details: |
    New leaf Disease entry for 3p- syndrome (MONDO:0013424, OMIM 613792, ORPHA:1620), curated de novo from primary literature. Provider: Perplexity sonar-deep-research (research/3p-_Syndrome-deep-research-perplexity.md). The report cites no PMIDs or DOIs at all -- its own Reference Validation section records 'No PMID or DOI references were found in this report', and its fifteen citations are web pages (MedlinePlus, OMIM, Orphanet, NORD, Wikipedia, ClinVar). Every one of the 24 references cited in the entry was therefore located independently via PubMed E-utilities; the report was used for orientation only. just preflight-dr returned SKIP because MONDO records no RO:0004003 causal gene for this contiguous-gene syndrome; disease identity was confirmed manually -- OMIM 613792 matches between MONDO and the report, and the report's top genes (VHL, CHL1, BRPF1, ATP2B2) all lie in the 3p25-pter interval. Report corrections applied: HP:0001243 and HP:0001715 do not exist and were not bound; obsolete GO:0016573 was replaced with GO:0043994 and obsolete GO:0055114 was dropped as unsupported; CL:0000203 (offered as 'cochlear hair cell', actually gravity sensitive cell) was replaced with CL:0000589 and CL:0000601; CL:0002319 (offered as 'cranial neural crest cell', actually neural cell) was replaced with CL:0011012. Two further report CURIEs, GO:0007155 and GO:1990034, are biological processes offered where a molecular function was needed and were rejected only by the MolecularFunctionTerm dynamic enum; GO:0098631 and GO:0005388 are used instead. Two substantive report claims were rejected on the evidence: that VHL disease has never been clinically expressed in a distal 3p deletion patient (PMID:26365017 reports a resected cerebellar hemangioblastoma, now curated as a VERY_RARE phenotype), and that ATP2B2 loss causes the septal defects (PMID:10922384 explicitly excludes ATP2B2 from the refined cardiac critical interval). The report omits SETD5 and the SLC6A1/SLC6A11 epilepsy branch entirely; both were added from primary literature (PMID:23613140, PMID:25138099, PMID:39923323, PMID:40517887). The DOI-keyed Korean case series DOI:10.5734/JGM.2014.11.1.36 was deliberately not cited: it has no PubMed record (confirmed against the PMC ID converter) and its cached record has content_type unavailable with an empty body, so no snippet could be verified; comparable frequencies were taken from PMID:33643973 instead. No GeneReviews chapter exists (PubMed searched, zero hits). Validation run and read: just validate passed with 135/135 snippets verified; just validate-terms passed; just check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all OK; just check-qualifier-terms-online resolved 102 uncached CURIEs and reported all 388 qualifier labels matching; just list-gene-term-mismatches examined 11 HGNC bindings with 0 findings; just validate-disorders and the whole-KB snippet/title gates were run as the final sweep.

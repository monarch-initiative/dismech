  summary: 'Finish and validate: 3p- Syndrome'
  details: |
    Second session on this entry. The first session (2026-09-09T201648Z) wrote the entry and was interrupted by a rate limit part-way through its validation sweep; this session re-ran the whole gate set from scratch on the committed tree and made four content additions.

    Additions. (1) A differential_diagnoses entry for Hearing_Loss_Autosomal_Dominant_82 / DFNA82 (MONDO:0030719), the ATP2B2 single-gene deafness entity already curated in this KB. The entry already cross-referenced the other two single-gene KB entries for genes in the interval -- SETD5_Haploinsufficiency_Syndrome (MONDO:0014336) and BRPF1-Related_Intellectual_Disability (MONDO:0015022) -- and DFNA82 was the missing third. (2) PMID:30535804 (Smits 2019) added as a third evidence item on genetic#ATP2B2, graded SUPPORT with directness INDIRECT: heterozygous truncating and splice-site ATP2B2 alleles alone cause deafness in humans, which bears on this syndrome by inference because the alleles are point variants rather than a contiguous deletion. (3) The atp2b2_sufficiency_for_hearing_loss CONTROVERSY discussion gained a paragraph and an evidence item for the same paper. That discussion previously set Fagerheim's 1.38 Mb hearing-loss locus (PMID:17208398) against the negative series (PMID:17696125) and left the dispute open; the DFNA82 result is a third line of evidence unavailable to either, and it supplies a concrete reason both could stand as reported, since in DFNA82 newborn screening is passed and the loss appears only at about three to six years, so deleted patients audiometered early enough would be recorded as hearing normally. The discussion still records the dispute rather than resolving it, because a whole-gene deletion in a contiguous-gene syndrome is not the same allele in the same context as a truncating point variant. (4) An Epiphora phenotype (HP:0009926), from PMID:36374187, which reports proximal lacrimal drainage anomalies in this syndrome and states that none had been reported before. It was added because the entry already carried a Lacrimal Drainage Surgery treatment with no target_mechanisms, so the treatment was a disconnected list item; the treatment now targets it. No frequency is recorded and no causal edge is drawn from the craniofacial node, because one case gives no denominator and no paper tests the mechanism.

    (5) A second evidence item on the Loss of the 3p25 Cardiac Septation Locus node quoting PMID:10922384 directly -- "Candidate 3p25 CHD genes, such as PMCA2 (ATP2B2), fibulin 2, TIMP4, and Sec13R, were shown to map outside the target interval." The node's description already stated that exclusion and the notes block already recorded it as a rejected deep-research claim, but nothing quoted the sentence, so the rejection rested on prose. It is now an auditable evidence item.

    Verifications requested and their outcomes. The Korean case series DOI:10.5734/JGM.2014.11.1.36 is not cited by the entry; the notes block records why, and that account was checked and is accurate -- the cached record has content_type unavailable with an empty body, so no snippet could be verified. just count-verified-snippets --unskip-prefix DOI was run anyway and reported 140/140, confirming there is no DOI-keyed evidence item hiding behind skip_prefixes. The premise that no VHL-associated tumour has ever been reported in a 3p- patient is false as of 2016: PMID:26365017 reports a cerebellar hemangioblastoma resected at age 16 from a woman with a de novo 3p deletion. The entry's handling was left as it stands -- the tumour is a VERY_RARE phenotype backed by that case report, and the surveillance question is separately a KNOWLEDGE_GAP discussion attached to the VHL node, the gene and the phenotype -- because the case report is direct evidence for the phenotype and the gap is about the absence of a risk estimate, which is a different claim.

    Validation, all run and read in this session on the final file. just validate: schema, term and reference validation passed, 140/140 snippets verified. just validate-terms: passed. just validate-disorders (batched, authoritative): passed, 140/140. just check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values: all OK. just check-qualifier-terms: OK, 2 labels matched; just check-qualifier-terms-online: OK, 388 labels matched with 102 resolved online, and it noted 113 KB-wide qualifier terms under PR and RO that no tooling can validate. just list-gene-term-mismatches: 11 HGNC bindings examined, 11 compared against HGNC, 0 findings and 0 uncached. just normalize-cache, check-term-cache-integrity and check-cache-order: clean. Whole-KB ratchet gates check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens, check-environmental-evidence and check-reference-titles: all OK with no new entries against any baseline, and no baseline file was modified. reference_title values were additionally cross-checked by script against the title: line of every cached reference: 140 evidence items, 29 distinct PMIDs, zero mismatches and zero items missing a title.

  summary: 'Create: 3p- Syndrome'
  details: |
    Created kb/disorders/3p-_Syndrome.yaml (MONDO:0013424) and deleted stubs/3p-_Syndrome.yaml.

    Lump/split: curated as a single DISEASE entry, not a grouping. Co-deleted genes jointly producing one recognisable phenotype is the single-entry case per issue #8727; a grouping is for genuinely distinct diseases converging downstream. Shape follows the existing contiguous-deletion entries (Cri-du-Chat_Syndrome, Chromosome_1p36_Deletion_Syndrome, 22q11.2_Deletion_Syndrome). Boundary against SETD5_Haploinsufficiency_Syndrome (MONDO:0014336) mirrored from that entry's own scope statement rather than duplicating its mechanism content; BRPF1-Related_Intellectual_Disability recorded as the adjacent-gene differential. MONDO:0018564 (3p25.3 microdeletion syndrome) is a different concept and is a differential, not a synonym.

    Deep research: one Perplexity run, research/3p-_Syndrome-deep-research-perplexity.md. The provider default model sonar-deep-research failed three times with 'Server disconnected without sending a response' at a reproducible 5m05s, which is an infrastructure cut on the long-running request rather than an API fault; --fallback does not cover a runtime failure. Re-ran with --model sonar-pro, which completed in 115s. Still a Perplexity report, so no fallback was recorded.

    Report validation. Reference validation clean: 19/19 identifiers resolved, confabulation_rate 0.0, 15/19 judged on topic, no unresolved references. Term validation NOT clean: needs_review true, 8 of 55 checked labels named a different term than the report claimed and 14 more were flagged as worth a second look. No CURIE was copied from the report; every binding in the entry was re-derived with OAK (ols:hp, ols:go, ols:cl, ols:mondo, ols:ncit, sqlite:obo:hgnc) at the time it was written. Two of the report's errors would otherwise have been silent: HP:0000263 offered for trigonocephaly is Oxycephaly (correct term HP:0000243), and CL:0000182 offered for cardiac muscle cell is hepatocyte.

    Citation sweep: every PMID resolvable from the report's citation sidecar is either cited as evidence in the entry or named in notes with a stated reason for exclusion. Three declined for being about a different entity (proximal 3p deletions PMID:17125947 and PMID:29928177; renal-cancer mouse model PMID:37217526), one for having no abstract in PubMed at all (PMID:18553547, content_type unavailable, so nothing quotable), one for being an inverted-duplication rearrangement (PMID:31428485), two as case reports adding nothing (PMID:20101686, PMID:623063).

    Structured sources attempted and not used: Orphanet ORPHA:1620 and ClinGen dosage sensitivity both failed on upstream release drift against their pinned manifest checksums. Repinning either would rewrite a corpus-wide cache inside a single-disease curation PR, so both were left alone and the reason recorded in notes.

    Modelling decisions worth review: the entry deliberately names no single driver gene, keeping three separable branches (3p25.3 SETD5/SRGAP3 core, distal 3p26.3 IgCAM cluster, separately mapped 3p25.3 cardiac interval), with the unresolved attribution recorded as three discussions including one HUMAN_MODEL_MISMATCH. CAV3 is typed SUSCEPTIBILITY rather than CAUSATIVE and is not bound on the cardiac pathophysiology node, because the sources reach it by positional candidacy and one cited deletion contains it without a heart defect. Two evidence items are graded REFUTE against the claims they sit under, deliberately.

    Validation run to completion: just validate (schema + terms + references, 82/82 snippets verified), just validate-terms (passed), just count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-stubs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, check-environmental-evidence, and the batched just validate-disorders.

  summary: Review 3p- syndrome against full clinical tables and mechanistic studies
  details: |
    Reviewed the complete disorder YAML, matching Perplexity research output and citation sidecar, every cited source, and available full bodies, tables and experimental methods. The entry had CREATE and EDIT provenance but no REVIEW event; a fully paginated open-PR overlap check was clear before work. GeneReviews and StatPearls checks found no disease-specific chapter.

    Corrected the unsupported AVSD frequency inferred from all-CHD rates, and removed syndrome-wide phenotype bands inferred from qualitative wording or selected case series. Independently audited PMID:33643973 Table 3: 29 columns include the index patient; CHD is 10 positive/14 negative/5 undescribed, hearing 4/16/9, and the first row measures motor development rather than linear growth. The narrative percentages do not consistently reproduce these rows. Failed hearing screens and reflux in the index case also constrain interpretation of its negative table cells. Unknowns were not counted as absent and no recalculated fractions were promoted to population frequencies.

    Recovered canonical PMC article bodies for PMID:25138099 and PMID:27939639 with the tracked modern-HTML fallback, and the full author manuscript of PMID:30455454 from its institutional repository with just fetch-reference. The latter PMID cache remains abstract-only; the separately generated URL cache supplies the full manuscript. No reference cache was hand-written. The committed adapter retains XML preference and verifies substantive article bodies; its 45 focused tests pass.

    Expanded to 13 atomic mechanism nodes, 44 phenotypes and two explicitly bounded mouse models. SETD5 and BRPF1 contributions now reflect primary human genetic and functional comparisons; SRGAP3 remains a candidate. Separate nodes distinguish gene dosage, SRGAP3 activity/Rac signaling, BRPF1 complex assembly/H3K23 acetylation, SETD5 transcription and neurite development. BRPF1 is a scaffold; transfected-cell H3K23 defects are distinguished from non-significant patient-fibroblast results. The 94 kb overlap is scoped to the later SETD5 study. Deliu's cell-culture interaction/Pol II assays are separated from living-mouse phenotypes, preserved Hdac3 activity, normal gross neuroanatomy and enhanced rather than globally reduced potentiation. Existing Chl1/Cntn6 compound mouse findings replace the false claim that no compound model had been reported; Cntn4 behavioral negatives remain endpoint-specific.

    Corrected CAV3 placement outside the conditional 200 kb cardiac interval, lack of molecular breakpoints in the HLHS infant, CRBN cytoband, same-deletion familial variability, and the CHL1 family's additional 1q44 duplication. Added source-supported cleft palate, high palate, reflux, specific cardiac lesions, short stature, speech delay, craniofacial findings, scoliosis, compulsive behavior, cystic hygroma, clinodactyly and intestinal malrotation. Cleft palate was already present in cached full text despite the prior omission note. Cardiac surgery now records the actual neonatal intervention and death without asserting survival benefit. Rehabilitation uses the reported uncontrolled intervention/outcome rather than a diagnostic quote. Single-gene differentials no longer treat polydactyly or cardiac defects as deletion-exclusive.

    Independent peer checks covered the Table 3 arithmetic, primary mechanism/full-manuscript evidence and clinical/care claims. The clinical peer identified a VHL-related tumor lead. PMID:26365017 was fetched with the reference generator and supports a histologically confirmed cerebellar hemangioblastoma at age 16 in a woman with a 3p deletion spanning the VHL locus, surgery and an author recommendation for repeat imaging. Added a deletion-qualified VHL branch, tumor phenotype, genetic susceptibility, imaging follow-up and surgical treatment without asserting a tumor second hit, population frequency or surveillance schedule. The inaccessible no-abstract follow-up PMID:35441425 was not used for unsupported findings. Incorporated separate SRGAP3 dosage and activity nodes, indirect evidence grades for functional-to-clinical extrapolation, and explicit IN_VITRO labeling for ESC/NPC molecular assays.

    Research completeness checklist: phenotype coverage adequate after expansion; subtype scope adequate for variable terminal/interstitial deletions with overlapping molecular differentials; pathophysiology adequate with candidate status and experimental limits retained; treatment/trial coverage adequate for verified rehabilitation, cardiac intervention and counseling, with no verified trial surfaced; genetics adequate for gene content, incomplete penetrance and modifiers; diagnostics adequate for microarray resolution and karyotype limits; high-value citations consumed including newly recovered full texts; overall consumption adequate, with untraceable frequencies, incorrect ontology labels, off-entity proximal deletions and renal-cancer work excluded. OXTR and SEC13 suggestions remain nonblocking case-level hypotheses without a demonstrated disease-specific causal chain, not omitted established mechanisms.

    Validation: authoritative schema, ontology-label and reference validation passed; 139/139 snippets verified. All 366 snippets in the two other entries consuming regenerated PMID caches remained verified. Twenty general quality gates passed, plus model-scale, Not4Curation and cache-order checks; 45 focused reference-provider tests passed. Corpus connectivity passed at 54.8% phenotype inlinks and 56.3% causal-gene wiring; individual unexplained clinical findings and the unconfirmed CAV3 candidate are not assigned invented causal edges to raise the per-entry score. Unrelated derived term-cache pruning from validation was restored from the committed baseline; the live ontology result was retained as validation evidence. The frozen dataset-accession file was not accessed. A formal PR review and independent automated review/CI will follow publication.

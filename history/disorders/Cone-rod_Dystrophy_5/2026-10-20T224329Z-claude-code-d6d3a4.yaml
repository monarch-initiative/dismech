  summary: 'Create: Cone-rod_Dystrophy_5'
  details: |
    New entry for cone-rod dystrophy 5 (MONDO:0010969, PITPNM3), curated from the stub queue under claim issue #15064.

    Sources: a PubMed search for PITPNM3 in retinal disease returned 11 records; the four that bear on CORD5 are cited (PMID:17377520 defining families, PMID:22405330 phenotype of 35 carriers, PMID:20590364 multinational screen, PMID:41148841 V367M knock-in mouse). No deep-research provider was run. Older Nir/rdgB papers (PMID:10022914, PMID:12037004) were read but not cited, because no source in hand states that PITPNM3 is the Nir1 protein those papers characterise.

    Content: the phenotype is recorded as a cone dystrophy with rods and RPE spared, as the phenotype paper states. The mechanism chain runs from the heterozygous p.Gln626His variant in the PYK2-interacting C-terminus, through cone dysfunction, to macular thinning; both edges are INDIRECT_UNKNOWN_INTERMEDIATES because no functional study of the variant exists. Phosphatidylinositol transfer activity is not bound, since the defining paper notes PITPNM3 lacks the PIT domain. The knock-in mouse carries p.Val367Met rather than p.Gln626His and is recorded as PARTIALLY_RECAPITULATES (cone ERG) and FAILS_TO_RECAPITULATE (structure). No ClinGen record and no GeneReviews chapter (just check-genereviews: NO_CHAPTER).

    Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys and the snippet ratchets passed; validate-disorders run before the PR.

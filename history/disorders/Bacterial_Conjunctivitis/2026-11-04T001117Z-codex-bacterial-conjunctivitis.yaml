  summary: Create Bacterial Conjunctivitis curation
  details: |
    Created a MONDO:0006668 Bacterial Conjunctivitis parent entry from the September 2026 OpenScientist report after duplicate preflight found only adjacent inclusion- and gonococcal-conjunctivitis mentions in ignored-inclusive local searches and no all-state GitHub PRs or issues for the MONDO ID.

    The entry deliberately lumps routine extracellular acute bacterial conjunctivitis while leaving gonococcal, inclusion, and trachoma entries as pointer subtypes to their existing full entries. It adds the main H. influenzae, S. pneumoniae, M. catarrhalis, and S. aureus agent set; direct ocular inoculation; a conjunctival inoculation-to-epithelial-response-to-purulent-inflammation pathograph; HPO-backed hyperemia and purulent eye discharge phenotypes; an acute self-limited progression row; the Rietveld clinical prediction rule; and topical-antibiotic therapy with a delayed-prescribing stewardship note.

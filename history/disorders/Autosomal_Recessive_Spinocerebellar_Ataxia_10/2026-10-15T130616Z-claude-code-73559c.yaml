  summary: 'Create: Autosomal_Recessive_Spinocerebellar_Ataxia_10'
  details: |
    New entry for SCAR10 (ANO10/TMEM16K). Started from the Perplexity deep-research report (research/Autosomal_Recessive_Spinocerebellar_Ataxia_10-deep-research-perplexity.md), used as a lead list only; its suggested HPO/GO CURIEs were not reused where its term-validation section flagged them, and every term was looked up in cache or OLS. Evidence comes from 23 PubMed records found via the report and NCBI esearch (gene discovery, Romani founder allele, French/Italian/MDSGene cohorts, case reports, TMEM16K scramblase structure and endosomal-sorting knockout mouse, Ano10-null calcium signalling, SH-SY5Y proteomics, ANO10 review) plus the Orphanet record ORPHA:284289 for phenotype frequencies. Pathograph: ANO10 loss of function -> ER scramblase loss, endosomal retrograde sorting defect, deranged calcium signalling, candidate proteome changes and secondary CoQ10 deficiency -> cerebellar cortical degeneration (conforms to cerebellar_purkinje_degeneration) -> loss of cerebellar output -> ataxia phenotypes; separate corticospinal, lower motor neuron, brainstem and cerebral cortical branches. Purkinje-cell involvement is recorded as proposed/inferred because no neuropathology or neuronal calcium data exist. Contested points carry REFUTE items: the plasma-membrane chloride-channel model (whole-cell recordings), CoQ10 supplementation benefit. All 33 phenotypes are causally connected. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-folded-hyphens, check-coarse-phenotypes and validate-disorders pass; 137/137 snippets verified. check-genereviews reports no GeneReviews chapter.

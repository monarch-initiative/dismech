  summary: Grounded AAGAB Haploinsufficiency in AP-2 adaptor complex binding (GO:0035612, DECREASED), added a conservatively scoped COL14A1 Loss-of-Function Association in Type 1B Disease node with a KNOWLEDGE_GAP discussion, and added NCIT diagnosis_term bindings and classifications.
  details: Bound AAGAB Haploinsufficiency to AP-2 adaptor complex binding (GO:0035612, modifier DECREASED) based on p34 co-localization with AP-2 (PMID:23000146, PMID:23743648) after removing GO:0035615, added COL14A1 Loss-of-Function Association in Type 1B Disease grounded in GO:0005201 (modifier DECREASED) with an open KNOWLEDGE_GAP discussion (PMID:36793812), added Physical Examination (NCIT:C20989) and Genetic Testing (NCIT:C15709) diagnosis bindings, and added DERMATOLOGY and GENETICS_ENVIRONMENT_DISEASE classifications.

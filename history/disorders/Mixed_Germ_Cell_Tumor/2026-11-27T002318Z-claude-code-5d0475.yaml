  summary: 'Address review: split platinum node, fix scope of tumor-mass phenotype
    and prevalence'
  details: |
    Split the node that asserted both increased and impaired apoptosis into Cisplatin-Induced Apoptotic Hypersensitivity (apoptotic process INCREASED, DNA repair DECREASED; PMID:37891379, PMID:36860862; targeted by BEP and the EP/VIP/TIP regimens) and Acquired Platinum Resistance (resisting_cell_death conformance, TP53 with DNA-binding transcription factor activity DECREASED, apoptotic process DECREASED; PMID:41384700, PMID:36860862; edge to the tumor mass). Renamed the testis-bound phenotype Gonadal or Extragonadal Tumor Mass to Testicular Mass so the name matches HP:0010788, repointed its two bare targets, and added a Mediastinal Mass phenotype (HP:0033823, PMID:35554637) wired from Invasive Growth and Metastasis. Removed the testicular germ cell tumor overall incidence record (3.0/100,000), which described the parent group rather than mixed germ cell tumor. Removed a PMID:39779499 snippet that did not support multilineage differentiation. Replaced the LDH phenotype snippet, which argued LDH is non-specific, with the PMID:40723290 serum-panel sentence and the PMID:38958901 S1 staging row. Removed unevidenced germ cell migration INCREASED from the KIT/RAS node. Replaced the unsourced 10% torsion figure on Ovarian Mass with PMID:40275685 wording on torsion or rupture, and removed the unsourced claim that embryonal carcinoma predominance predicts lymphovascular invasion.

  summary: 'Compliance: cite and bind the endocrine-disrupting chemicals exposure'
  details: |
    Weekly compliance pass focused on environmental exposure evidence. The Endocrine-Disrupting Chemicals entry had no evidence, no exposure_term, and no influences_mechanisms, so it was a free-text assertion disconnected from the pathograph. Bound ECTO:9001630 (exposure to endocrine disruptor), added a PREDISPOSES link to Primordial Germ Cell Maldifferentiation and GCNIS matching how cryptorchidism is already wired, and cited it from the Servicemen's Testicular Tumor Environmental and Endocrine Determinants study. PMID:18445826 supports the organochlorine pesticide claim with prediagnostic serum p,p'-DDE (highest versus lowest quartile OR 1.71). Recorded PMID:19223531 as REFUTE: the same cohort found PCBs associated with decreased rather than increased risk, which contradicts the entry's original class-wide claim. Rewrote the description accordingly so the entry no longer asserts PCBs, and noted that diethylstilbestrol remains uncited because no reference meeting the snippet standard was located. All 24 snippets verify. Weighted compliance 69.3 percent to 71.7 percent.

  summary: Link cryptorchidism; leave a genetic and an unevidenced exposure unlinked
  details: |
    Backfill for issue #8085. Cryptorchidism is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the primordial germ cell maldifferentiation and GCNIS node, because the testicular dysgenesis model treats undescended testis and the tumour as shared consequences of a disturbed fetal gonadal programme, which is what that node holds. It is graded PARTIAL for a reason stated in the link description: the only sentence available names cryptorchidism as an independent risk factor in a subordinate clause of a sentence whose actual subject is how a polygenic risk score might guide screening. It confirms the risk factor in passing and quantifies nothing about it, while the exposure's own description claims a four to eightfold increased risk that no cited sentence supports. Two exposures were deliberately not linked. Family history and heritable susceptibility is a genetic rather than an environmental factor and its evidence is a heritability estimate; it sits in the environmental block but is not an exposure, which is the modelling question recorded in issue #8185 and resolved for Metastatic_HCC's cirrhosis entry in PR #8195. Endocrine-disrupting chemicals is a genuine environmental exposure and a good candidate for a link, but it carries no evidence items at all, which is the gap recorded in issue #8296. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 20 of 20 verified.

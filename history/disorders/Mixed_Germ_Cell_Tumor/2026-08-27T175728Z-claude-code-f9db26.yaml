  summary: Cite endocrine disruptors; split the claim by agent
  details: |
    Added evidence to the Endocrine-Disrupting Chemicals environmental entry and rewrote its description. The previous description asserted one association covering diethylstilbestrol, organochlorine pesticides and PCBs together; the evidence separates sharply. DES is supported by a meta-analysis of six studies with a summary odds ratio of 2.98 (PMID:31555759). Organochlorines and PCBs are not: a nested case-control study measuring seven pesticides and thirteen PCB congeners directly in biobanked maternal pregnancy serum found no association (PMID:40056550, recorded as REFUTE). The description now states the split rather than the combined claim. Part of #8296.

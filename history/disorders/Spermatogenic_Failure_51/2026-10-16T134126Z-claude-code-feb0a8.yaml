  summary: 'Create: Spermatogenic_Failure_51'
  details: |
    Created the SPGF51 entry for CFAP91 (MAATS1)-related male infertility (MONDO:0030926). Sources: a claude_code deep-research report (research/Spermatogenic_Failure_51-deep-research-claude_code.md, preflight PASS) used as leads only, plus PubMed searches. Human evidence is thin: the primary report (Martinez 2020, six homozygous men) is cached as abstract only, and a French ICSI series (2021) lists MAATS1 among its causes without per-genotype outcomes, so ICSI evidence is marked directness INDIRECT. Mechanistic evidence comes from the Cfap91 knockout mouse with BioID2 proximity labelling (Wang 2025, refetched as full text), Tetrahymena Cfap91 knockout (2022) and the Chlamydomonas CSC paper (Dymek and Smith 2007). Pathograph mirrors SPGF33/SPGF84: Loss of CFAP91 (GO:0005200 DECREASED) -> loss of the CSC -> sperm axonemal disorganization -> MMAF -> phenotypes. Individual flagellar shape phenotypes are not recorded because no gene-specific human quote was available; teratozoospermia is bound to HP:0012864. An EMERGING hypothesis records that motile-cilia involvement is unresolved (normal mouse airway cilia vs strain-dependent early death and Tetrahymena beat defects). Mouse model carries SPECIES_MISMATCH and OTHER divergences. ClinGen has not classified the pair and there is no GeneReviews chapter. All validation recipes passed, including validate-disorders. Stub deleted.

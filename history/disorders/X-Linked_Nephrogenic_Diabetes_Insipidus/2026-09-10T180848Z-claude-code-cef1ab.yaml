  summary: 'Create: X-Linked Nephrogenic Diabetes Insipidus'
  details: |
    New Disease entry for X-linked nephrogenic diabetes insipidus (MONDO:0010581), AVPR2 (hgnc:897) at Xq28. Curated as a single DISEASE: one gene, one receptor, one conserved mechanistic chain, no has_subtypes.

    Pathograph: nine nodes in one chain with a branch at the lesion. AVPR2 loss-of-function variant branches into (a) ER retention of the misfolded V2 receptor, the majority route, and (b) a signalling-incompetent cell-surface receptor, the minority route; both converge on loss of vasopressin-stimulated cAMP/PKA signalling, then failure of aquaporin-2 phosphorylation and apical insertion, collecting duct water impermeability, failure of medullary countercurrent urine concentration, obligatory hypotonic free water loss, and sustained high urinary tract flow. biological_scale set on every node. CL:1001431 bound on four nodes; GO biological processes, molecular functions and cellular components bound throughout; UBERON:0000362 and UBERON:0014388 for locations. PDB 7KH0 (cryo-EM AVP-V2R-Gs) attached to the cascade node. The lesion node carries genetic_context with GERMLINE/HEMIZYGOUS/LOSS_OF_FUNCTION plus a modifier on its receptor-activity descriptor; the deliberate co-occurrence of the two slots is flagged in notes per CLAUDE.md.

    Deep research provenance. falcon was requested and returned HTTP 402 twice (Edison account out of credits). The second attempt was re-issued with --fallback, which escalated to openscientist; that job (55dbaa47-e508-4202-898f-a85d997f02b6) timed out after 3600s and was cancelled, ending the fallback chain with no report. claude_code was then run directly and is the provider of record; research/X-Linked_Nephrogenic_Diabetes_Insipidus-deep-research-claude_code.md and its .citations.md are committed. Report reference validation: 14/14 resolved, confabulation_rate 0.0, needs_review true on one possibly-off-topic flag (PMC:PMC11095762) which on reading is on topic. Term validation: 17/18 resolved, 5/5 labels correct, 0 naming a different term. just preflight-dr returns WARN (AQP2 mentioned 35x vs AVPR2 55x, OMIM 125800 alongside 304800) which is expected because the report discusses AQP2 as the contrasting locus; no AQP2 content was curated as AVPR2 disease. Three figures the report attributed to abstracts do not appear in them (a 36% gastrostomy rate ascribed to PMID:32039113; a 58-year-old patient with eGFR 25, 3.1 L post-void residual and secondary hyperparathyroidism ascribed to PMID:39644399) and were deliberately not curated; this is recorded in the entry notes.

    Term discipline. Every CURIE was read from a lookup in the same step it was written. hgnc:897 was not in cache/hgnc/terms.csv beforehand; it was resolved from the HGNC REST API and independently confirmed against the OBO hgnc build, and the symbol AVPR2 was checked against the CURIE. One binding was corrected during review: GO:0031896 (V2 vasopressin receptor binding) was initially used for the receptor's own recognition of vasopressin, which inverts the term's meaning; replaced with GO:0017046 (peptide hormone binding) plus GO:0005000 (vasopressin receptor activity). No cell_types binding was placed on the MDCK experimental model because CL does not represent cell lines and binding the canine line to the human principal-cell term would overstate it.

    Validators run and results. just validate: pass (schema, terms, references). just validate-disorders (authoritative batched gate): pass. Snippets: 138/138 verified against committed references_cache files. just validate-terms: pass. just check-duplicate-keys, check-entity-refs, check-causal-targets (no new dangling targets), check-qualifier-terms (0 qualifier terms), check-enum-values: all pass. Whole-KB text checks all pass with no new findings: check-folded-hyphens (two findings introduced and fixed by reflowing, not baselined), check-snippet-length (two short snippets introduced and replaced with full propositions, not baselined), check-title-snippets, check-snippet-grading, check-environmental-evidence. just normalize-cache, check-term-cache-integrity, check-cache-order: pass. just list-gene-term-mismatches: 2 gene bindings examined, both name the gene they bind, 0 findings. just compliance: 93.7% global, 94.0% weighted.

    Evidence: 138 items across 30 PMIDs plus clinicaltrials:NCT07525960.

    Deliberate omissions, all recorded in the entry notes: no conforms_to (er_protein_storage_disease, loss_of_proteostasis and renal_cystogenesis were each read in full and each misfits; a GPCR ER-retention trafficking module would be a legitimate future proposal); no reference_ranges on the biochemical block (no citable normal interval found); no datasets block (no accession specific to AVPR2 disease verified, and a gene-name search would return other AVPR2 biology); no environmental block (the precipitants act on established disease); Vomiting, Fever and Constipation left unwired to the pathograph because no cited source states the causal step.

    Boundaries checked and recorded: Neurohypophyseal_Diabetes_Insipidus exists and is the central AVP form - pathograph built independently, nothing copied, and the superficial shared ER-retention node is explicitly distinguished in notes. The AQP2 form is a separate locus and disease, not a subtype; dismech has no AQP2 entry, so a kb/groupings Grouping over nephrogenic diabetes insipidus is flagged as follow-up rather than created here.

    Open item for a human: the neurodevelopmental attribution. Intellectual disability is curated with a sequela edge from Hypernatremia and an attached KNOWLEDGE_GAP discussion, on a hedged review sentence plus a 2025 cohort finding neurodevelopmental disorders in six of eight treated patients with normalised serum sodium, against GeneReviews' position that intelligence is usually normal with early treatment. The contradiction is recorded rather than resolved.

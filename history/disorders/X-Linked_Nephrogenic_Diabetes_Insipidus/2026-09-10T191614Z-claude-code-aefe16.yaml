  details: |
    Response to review round 1 on PR #11634 (REQUEST_CHANGES, three yellow and five blue). All eight items worked in one push.

    YELLOW 1, Type I variants had no route through the pathograph. Took the reviewer's option one: added a new pathophysiology node 'Absent or Truncated V2 Receptor Protein' (MOLECULAR, CL:1001431, GO:0005000 with modifier ABSENT) and a third downstream edge from the lesion node to it with causal_link_type DIRECT. Chose this over merely softening the edge descriptions because the gap was load-bearing rather than cosmetic: the entry's flagship animal model, the V2R Glu242stop knock-in (PMID:11104789), carries a nonsense allele and so belongs to exactly the class the graph omitted, and its modeled_mechanisms link entered at the cAMP/PKA node instead. The mouse now carries an additional RECAPITULATES link to the new node at model_scale MOLECULAR, with a limitation recording that the class assignment rests on the nature of the allele rather than on a Western blot in these mice. Evidence for the node is PMID:11389590, which is the direct in vitro demonstration: mRNA was produced for every mutant construct while the 804delG frameshift allele gave no detectable receptor protein, so the failing step is after transcription. Also reworded the two pre-existing edges so they no longer read as a partition: 'majority route' became 'the commonest route, and the one with a therapeutic handle' and 'minority route' became 'the functional route'. The three routes now correspond one-to-one to the three classes PMID:32138955 names and all three converge on the cascade node.

    YELLOW 2, water-deprivation safety caveat. The reviewer's quoted sentence WAS in the cache: references_cache/PMID_40922895.md has content_type full_text_xml, not abstract-only, and carries the contraindication in two places. I quoted from the cache rather than from the review comment, and verified the snippets against the strict --no-full-text gate before building on them (they pass; --no-full-text suppresses new full-text fetching, it does not restrict matching to abstracts). Added a new diagnosis entry 'Water deprivation test' carrying three snippets from that paper: the contraindication above serum sodium 145 mmol/L and its stated reason, the operational rule including the plasma osmolality 295 mOsm/kg limb and the substitution of desmopressin challenge alone, and the statement that the diagnosis can be established without water restriction where sodium is high or high-normal with inappropriately dilute urine. The entry description makes the clinical point the reviewer raised: the median presenting serum sodium in this same cohort is 160.5 mmol/L, so the typical patient presents already past the threshold at which the test is unsafe.

    YELLOW 3, copeptin. Curated qualitatively, cutoff declined. The 21.4 pmol/L figure could not be verified: the consensus statement was fetched both ways, and DOI:10.1038/s41581-024-00897-z came back with content_type unavailable and an empty body while the PMID version (PMID:39438674, fetched this round, full_text_html) does not mention copeptin at all. That is a fourth unsupported figure from the same deep-research report, recorded in notes alongside the three found in round one. What is curated is the substantive claim, from two independent reviews (PMID:32374887 and PMID:32387127) stating it in those terms: unstimulated basal copeptin reliably diagnoses nephrogenic diabetes insipidus while separating central diabetes insipidus from primary polydipsia needs a stimulation test. New diagnosis entry 'Basal plasma copeptin', which also records why that asymmetry suits this disease and that no cutoff is curated.

    BLUE 1, nomenclature. Added three synonyms (arginine vasopressin resistance, AVP-R, X-linked arginine vasopressin resistance) and a notes paragraph on the renaming, cited to PMID:39438674 whose own title and first sentence both carry the new name. The entry name keeps the older form because that is what MONDO:0010581 and the cited cohorts use. PMID:39438674 also added to the top-level references block and attached as real evidence on the genetic-counselling treatment, whose scope it explicitly covers.

    BLUE 2, rebound Nocturnal enuresis from HP:0000805 (Enuresis) to HP:0010677 (Enuresis nocturna), which matches the preferred_term exactly. Confirmed by lookup through ols:hp and confirmed already present in both cache/hp/terms.csv and the phenotypeterm enum cache, so enum membership was established before rebinding rather than assumed.

    BLUE 3, GO binding on Obligatory Hypotonic Free Water Loss. Searched GO for renal water excretion, diuresis, urine, water homeostasis and body-fluid terms. Replaced the broad GO:0007588 (excretion) with GO:0035809 (regulation of urine volume) and GO:0050891 (multicellular organismal-level water homeostasis), both modifier ABNORMAL. Recorded the search in notes so the absence of a single exact term is visible rather than inferred.

    BLUE 4, variant-class composition. Added to the genetic notes: the variant types represented, the three functional classes and their correspondence to the three pathograph routes, and more than 200 reported AVPR2 variants (PMID:33664408). Two things deliberately not asserted and said so: no proportion for which class is commonest, because the widely circulated 70 per cent figure for the ER-retention class appears in the deep-research report but no cited source measures it and the strongest citable statement is the weaker one in PMID:17516711 that the function of most mutant receptors is not itself disturbed; and no proportion per sequence-variant type. Added PMID:17516711 and PMID:32138955 as evidence in genetic.

    BLUE 5, indomethacin rationale. Cited the mechanism (PMID:10710543) but DECLINED the suggested upgrade from MODULATES, because reading the source argues against it. PGE2 was shown to reverse vasopressin-INDUCED translocation of aquaporin-2 without decreasing its phosphorylation; that process does not occur in a V2 receptor-null kidney, so the demonstrated mechanism presupposes the signalling this disease lacks. And in the same experiments PGE2 alone altered neither aquaporin-2 phosphorylation nor its distribution, which argues against a standing PGE2 brake that an NSAID could release in the absence of vasopressin action. Recorded as a SUPPORT item with directness INDIRECT plus a REFUTE item quoting the PGE2-alone result, with the reasoning in the target_mechanisms description. The treatment description now states that the clinical benefit is real and well attested while the route through this node is not established by anything cited.

    Also recorded: PMID:10710543 shows aquaporin-2 phosphorylation and apical retention are separably regulated and that dephosphorylation is not a prerequisite for internalization, which complicates the bundled naming of the node 'Failure of Aquaporin-2 Phosphorylation and Apical Insertion'. The node was NOT renamed, because its name is a foreign key for bare-name pathograph targets and three model links and because in this disease both limbs fail together downstream of the same absent PKA signal. Recorded in notes rather than acted on.

    Built on the coordinator's commit 8803affcb correcting the stale slot-co-occurrence precedent claim; that text was not reverted.

    Validators re-run after these changes, all pass. just validate and just validate-disorders both pass with 155/155 snippets verified against committed references_cache files (up from 138). validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets (no new dangling targets, confirmed after adding a node and four edges), check-qualifier-terms (0 qualifier terms), check-enum-values all pass. Whole-KB text checks all pass with no new findings: check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence. normalize-cache, check-term-cache-integrity, check-cache-order pass. list-gene-term-mismatches 0 findings. compliance 94.5 per cent global, up from 93.7. No baseline file was modified. Cache diff is strictly additive: one new row (GO:0035809) across two files; GO:0050891 and HP:0010677 were already cached from other entries. Separately re-verified every reference_title against its cache frontmatter: 34 pairs checked, the only difference the known cosmetic U+2029 in PubMed's stored title for PMID:29162216.

    Five new references this round: PMID:39438674, PMID:32374887, PMID:32387127, PMID:10710543, and the clinicaltrials record was already present. 35 distinct references total.

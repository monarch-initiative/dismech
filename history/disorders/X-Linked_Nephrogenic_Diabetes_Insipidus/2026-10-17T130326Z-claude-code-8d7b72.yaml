  summary: Rebind basal copeptin from the immunoassay observation code to the Provasopressin.C-terminal
    Part
  details: |
    Correction round on the tranche G batch 25 binding. The basal plasma copeptin row's measurement was rebound from LOINC:78987-5, the serum-or-plasma immunoassay observation code, to LOINC:LP200145-3, the Provasopressin.C-terminal Part, which carries no method or specimen qualifier. The measurements slot names a test's identity, and the preference there is a Part or panel code over a method- or specimen-qualified one, so pinning a basal plasma measurement to a single assay method over-specified it. The note was rewritten at the same time, for a second reason: it had said the immunoassay code was the only code the release has, which is true of the observation codes in the pinned LOINC 2.83 export but not of the Monarch KG, where the Part also exists. The two sources answer different questions - the export has no LP or LG rows at all - and the note now says which source answered which. The underlying absence claim is unchanged and is now enumerated in full rather than from a first page: paginated to its stated total, the KG returns zero records for copeptin and zero for the abbreviation CT-proAVP, and exactly two for the formal analyte name, this Part and that one observation code. No new cache row was needed; LOINC:LP200145-3 was already committed in cache/loinc/terms.csv on main, and its label was copied from that row. The 78987-5 row this branch added is kept because the rewritten note cites that code in prose. Re-validated after the change: just validate-disorders over all six batch files reported 526 snippets and 587 titles checked with 0 issues; validate-terms passed cache-first and offline for this file; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed.

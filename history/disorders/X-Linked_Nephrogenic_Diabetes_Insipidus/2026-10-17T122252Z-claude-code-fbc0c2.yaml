  summary: Bind LOINC water-deprivation, desmopressin-challenge, copeptin and urine-osmolality
    codes
  details: |
    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin, and every candidate set was fully enumerated rather than read off a ranked search page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:94129-4 (water deprivation challenge panel) to the water deprivation test row; LOINC:94005-6 and LOINC:94014-8 (urine osmolality at 1 and 2 hours post dose vasopressin) to the desmopressin non-response row, these being the only two vasopressin-qualified urine osmolality codes in the release; LOINC:78987-5 (Provasopressin C-terminal by immunoassay) to the basal copeptin row; and LOINC:2695-5 (Osmolality of Urine, already cached on origin/main) as the loinc_term of the urine osmolality marker. Two near-miss traps were recorded rather than taken. Copeptin as a string returns nothing in LOINC 2.83 or in the Monarch KG, which would read as absence, but the assay exists under the formal component name provasopressin C-terminal, short name CT-proAVP, matching exactly one code. And the Part that looks like a urine-osmolality identity, LOINC:LP69215-9 Osmolality.urine, is the numerator component of the urine-to-serum ratio code LOINC:48149-9, not a specimen-level identity. The release's only vasopressin-challenge panel, LOINC:94128-6, was declined because it is scoped to a challenge given after water deprivation, which this entry states is contraindicated in most patients here. No reference-range bands were added: the serum sodium above 145 mmol/L and plasma osmolality above 295 mOsm/kg limits are strict inequalities that an inclusive lower bound cannot state, and the 200 mosmol/kg urine osmolality figure is a measured ceiling in three patients stated as a value not exceeded, which an exclusive upper bound cannot state.

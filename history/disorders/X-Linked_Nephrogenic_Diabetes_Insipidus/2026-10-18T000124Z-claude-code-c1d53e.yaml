  summary: Correct the copeptin abbreviation claim and record why the codes name vasopressin
  details: |
    Review round 1. Two sourcing claims were re-checked against the Tuva export pinned in data/loinc/MANIFEST.yaml (LOINC 2.83, snapshot 2026-10-07, sha256 448bc5a5 verified on download), which is authoritative for absence; it carries 112,405 rows and no LP Part rows, so Part questions remain the Monarch KG's. First, the basal copeptin note said the abbreviation CT-proAVP returns nothing in release 2.83. That is wrong: CT-proAVP is the short_name of LOINC:78987-5 ('CT-proAVP SerPl IA-sCnc'), one hit across the release. The string copeptin does return nothing, in any of code name, short name or component. The note now separates the two and says the abbreviation reaches the code through a short name rather than a code name. Second, the desmopressin row's bound codes name the stimulus vasopressin; the strings desmopressin, DDAVP and dDAVP match nothing anywhere in the release, so LOINC does not carry the analogue's name and these are its codes too. That is now one clause of the note. The enumerability claim already in the note was confirmed: exactly two urine osmolality codes are qualified by vasopressin, 94005-6 at one hour and 94014-8 at two. A sentence narrating which sources were consulted was cut. No binding, snippet or evidence item changed.

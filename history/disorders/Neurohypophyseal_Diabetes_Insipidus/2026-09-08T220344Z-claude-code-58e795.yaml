  details: |
    Follow-up to the ai4c-reviewer round on PR #11176, which approved the entry with two non-blocking suggestions. Both were accepted in the reply and deferred to this PR rather than pushed onto the approved head, because dismiss_stale_reviews would have dropped the approval.

    1. PMID:10085151 (Ito & Jameson) was cited only in the entry's notes: paragraph, as the justification for functional_impact_category: DOMINANT_NEGATIVE on the Mutant Prepro-Vasopressin Misfolding node. It now carries two evidence items on that node's genetic_context claim, quoting the cross-linking result (homo- and heterodimer formation between wild-type and mutant precursors, and impaired ER-to-Golgi trafficking of the wild-type protein) and the authors' own conclusion. The second quote keeps the source's hedging intact - 'suggests', 'may also contribute' - because the entry layers a dominant-negative consequence on a toxic gain rather than substituting one for the other, and flattening the hedge would overstate what the paper claims. Graded IN_VITRO: this is transfected-cell work, not a patient study.

    2. Arginine-stimulated copeptin added to diagnosis:. Recorded deliberately as an alternative rather than an equivalent - the review it comes from says arginine stimulation 'was put forward as alternative test procedure' on grounds of simplicity, while it is hypertonic saline stimulation that 'was confirmed to reliably and safely improve the diagnostic accuracy'. Both sentences are quoted so the relative standing of the two tests is legible from the evidence rather than asserted in prose.

    One error caught before validation: I wrote a plausible-looking reference_title for PMID:38087160 from memory ('Diagnosis of AVP deficiency (central diabetes insipidus): the influence of the copeptin era.') instead of copying it from the cache. The real title is 'New insights on diagnosis and treatment of AVP deficiency.' Corrected in both new evidence items before running the validator. Worth recording because it is the same failure mode as the prose defects issue #11456 is about - asserting something checkable without checking it - and because the reference validator would have caught it, but only after a wasted cycle.

    Validation: schema, terms and references pass, 101/101 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-cache-order and check-term-cache-integrity all clean.

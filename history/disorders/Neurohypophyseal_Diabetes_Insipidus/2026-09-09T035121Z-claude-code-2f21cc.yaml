  summary: Quote the test comparison via an ellipsis bridge; scope the grading claim
  details: |
    Corrects two things from the previous round, both of which were claims of mine rather than curation defects. (1) The previous round asserted that the review's one-sentence comparison of the two copeptin stimulation tests could not be quoted, because it carries two inline numeric citation markers and the validator strips them from the snippet but not from the cached text. The mechanism is right and the reviewer reproduced it independently, but the conclusion was wrong: dismech#10734 documents an ellipsis bridge over each marker, which verifies. Confirmed here - the full comparison sentence now validates at 104/104. It replaces the hypertonic-saline-only quote, which is what the first review asked for and which I had declined on a false premise. The explanation records the convention and cites the issue, since the convention is absent from the dismech-references skill, which is why it was missed. (2) The previous round stated a grading rule for PMID:38087160 as though it described the file: study results HUMAN_CLINICAL, review framing OTHER. The rule describes the items added in this PR, but several pre-existing items on the same reference are review narrative graded HUMAN_CLINICAL from an earlier round, so as written the sentence contradicted the file it sits in - the defect class in issue #11456, in the prose I had just added to close a different instance of it. The claim is now scoped to the items it governs and says the older items diverge. Those items are not regraded here: they are merged content, the call is genuinely arguable for a review article, and regrading seven-odd items is not in scope for a PR about one diagnostic test. Also normalized the earlier history record's links block to the URL form used by the record added alongside it. No claim, band, ontology binding, or evidence_source on any pre-existing item changed.

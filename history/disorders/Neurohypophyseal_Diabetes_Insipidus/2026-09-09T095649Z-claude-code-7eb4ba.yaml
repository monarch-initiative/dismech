  summary: Correct a within-cohort claim that contradicted its own preceding clause
  details: |
    Blocking finding, and it is the seventh instance of the same defect class on this entry with the worst placement yet: inside a single sentence. The notes block added last round said 'Only the 100% against 93% pair is a within-cohort comparison'. The 141-patient trial's 96.5% against 76.6% is also a within-cohort comparison - it is a paired analysis of one cohort reported with a P-value, and the sibling entry's own description calls it a head-to-head comparison. The preceding clause of my own sentence had already said the trial compared the two tests, so the sentence contradicted itself one clause later, in a notes block written specifically to stop readers confusing these figures. What is true is narrower and is now what it says: the 100/93 pair is the only within-cohort comparison between the two copeptin stimulation tests, and the point that matters is that the two comparisons cannot be chained because 100% and 96.5% are the same test in different cohorts. Also addressed: the reading guide accounted for four of the five diagnostic-accuracy figures in the section, omitting the 70-77% on the water deprivation entry, which comes from two other prospective studies rather than from the 141-patient trial that supplies the 76.6% - now covered; the opening was scoped to diagnostic-accuracy figures so the MRI entry's 70% and 39%, which are sign frequencies in two groups rather than accuracies, are visibly out of scope. The sixty-patient overlap the whole within-cohort argument rests on was carried only by prose, since the head-to-head quote says 'these patients' without naming them; it is now quoted, using the ellipsis bridge over the same two citation markers, and validates at 107/107. The mechanism item lost its directness value: the reason given for INDIRECT was that 'Likely' marks the authors' hedge, but that is the source's confidence rather than an inference step between quote and claim, and the quote asserts the claim it is cited for. Process note. The whole-block check was run again and this time mechanically rather than by reading: every percentage in the diagnosis section was enumerated with its entry and whether it appears in a snippet or in prose. That is what surfaced the fifth figure and confirmed the MRI pair was a different measure. Reading the block was not enough last round; extracting the figures was.

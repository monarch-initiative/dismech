  summary: 'Review round: arginine test operating point, nausea caveat, grading rationale'
  details: |
    Answers the five non-blocking suggestions on PR #11493 in one push. (1) The arginine-stimulated copeptin entry described a test without giving its operating point, so a reader could not apply it. Added the cutoff sentence from the already-cited PMID:38087160 - copeptin at 60 minutes, 3.8 pmol/L, 93% diagnostic accuracy - and put the same parameters in the description beside the sibling hypertonic-saline entry, which already gave its 4.9 pmol/L threshold. No new reference was fetched; the sentence was already in the cache. (2) The description listed only the test's advantages. Added the nausea caveat with two evidence items: the 48% mild-nausea rate in the study cohort, and the review's instruction that a result obtained during severe nausea or vomiting is interpretable only if copeptin stayed low. This matters mechanistically rather than only practically, since nausea and vomiting are themselves strong non-osmotic AVP and copeptin stimuli, so a symptomatic patient confounds the analyte the test measures; the description now says so. (3 and 4) The reviewer proposed replacing the positioning quote with the review's one-sentence direct comparison of the two tests. That sentence cannot be quoted: it carries two inline numeric citation markers, and the reference validator strips such markers from the snippet without stripping them from the cached text, so every span crossing one fails as a non-substring. Verified by trying it - the failure message itself states the snippet would match if the markers were kept. The original quote is retained and its explanation now records both that constraint and why the item is graded OTHER. The evidence_source split on this reference is now stated in each explanation rather than left for a later curator to re-derive: sentences reporting the prospective study's results are HUMAN_CLINICAL, sentences carrying the review's own framing, recommendation or cross-study synthesis are OTHER. (5) Filled the earlier history record's empty links block with the PR and issue its prose already named, and removed the stray blank line in the diagnosis block. Validation: schema, terms, 104/104 snippets, duplicate keys, entity refs, causal targets, enum values, qualifier terms, folded hyphens, and both history records.

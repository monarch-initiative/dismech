  summary: Narrow a claim from paper scope to the scope actually verified
  details: |
    Both items fixed here were introduced by me in the immediately preceding push, the one I had told the reviewer would be my last. That statement carried an exception for a factual error, and the first of these is one, so the push is consistent with what I said rather than a reversal of it. (1) The clause added last round said PMID:30067922 'gives 96.5% and carries no 97% figure at all'. The cached record has content_type abstract_only, so what was actually checked is that the cached abstract carries no 97%. The sentence asserted it of the whole paper. This is the class of defect this PR has spent eight rounds closing, in its subtlest form yet: not a claim contradicted by adjacent state, but a claim stated one scope wider than the artifact that was checked. The rounding reading is still the right one and nothing downstream changes, because 96.5% is the only hypertonic-saline accuracy the trial reports at that cutoff, but the sentence now says that explicitly and names the abstract-only limitation instead of implying a full-text search. (2) The hinge sentence 'Two things about this quote need the diagnosis section to read correctly' parses two ways - the quote needing the section, or the section needing to be read correctly. Rewritten to 'only make sense against the diagnosis section'. Process, extended again. The file-wide figure census was joined by a scope-of-verification audit: every PMID named in prose outside a reference: or snippet: line, checked against that record's content_type. That is what surfaced this one, and it also surfaced PMID:20301356, named in a GeneReviews search-provenance note with no cache file - pre-existing merged content that explicitly says the reference is not cited, so no evidence depends on it and it is out of scope here. The generalisable rule: when prose makes a negative-existence claim about a source, state the artifact the claim was checked against, because the cache is often the abstract and the claim is usually written as though it were the paper.

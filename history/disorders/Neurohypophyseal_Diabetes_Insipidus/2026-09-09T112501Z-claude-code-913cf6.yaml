  summary: Correct a factual error about which studies supply the 70-77% range
  details: |
    CORRECTION TO THE PRECEDING HISTORY RECORD. The record 2026-09-09T095649Z-claude-code-7eb4ba.yaml states that the 70-77% on the water deprivation entry comes from two other prospective studies rather than from the 141-patient trial that supplies the 76.6%. That is wrong, and so was the clause it describes. History records are append-only and that one accurately describes the session as it ran, so it is not edited; this record carries the correction so a reader reconstructing the reasoning from history/ does not inherit the error. Verified independently rather than taken from the review: the cached sentence carries the markers [4, 40], and the review identifies [4] as 'the so far largest prospective study including 156 patients with AVP-D or primary polydipsia', as the confirmation study whose hypertonic saline protocol and 4.9 pmol/L cutoff match, and as the hypertonic saline arm of the sixty-patient overlap. PMID:30067922 recruited 156 and analysed 141. Same trial. So the 141-patient trial is one of the two prospective studies supplying the range, and 76.6% sits inside 70-77% rather than beside it. The clause now says that. Also corrected in the same block, found by my own check rather than by review: the sentence said 100% and 96.5% are the same test measured in different cohorts. The sixty patients are those who took part in both stimulation studies, so they are an overlap drawn from the trial rather than an independent cohort, and the point is that the 100% is not a separate estimate of the same quantity. Also added the missing grading rationale to the participant-count evidence item, so all three items in that run argue their evidence_source rather than two of three. Process. The reviewer diagnosed the method failure exactly: last round's enumeration established which figures exist but not which study each came from, and the remaining error lived in that gap. This round enumerated each figure with its citing reference AND traced the underlying study behind it, which is a different thing - 70-77% is cited to the review but sourced to [4, 40]. That distinction between citing reference and source of record is what the check was missing.

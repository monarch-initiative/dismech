  summary: Restore the between-tests scope the previous fix dropped
  details: |
    The previous round replaced a description verb borrowed from a deleted snippet, and in tracking the surviving quote's wording it dropped the scope that keeps the claim honest. The description read 'the hypertonic saline test is the one shown to give the highest diagnostic accuracy' three lines above a quoted snippet reading 'copeptin measured 60 min after the start of the infusion using the cut-off level 3.8 pmol/L had the highest diagnostic accuracy of 93%' - which is about arginine. Both are faithful to the source, because the review's synthesis sentence ranks the tests against each other while the arginine sentence ranks cutoffs and timepoints within the arginine test, but the entry no longer carried that distinction, so a reader who does not open the reference sees the same superlative asserted of one test and quoted for the other with nothing reconciling them. The description now carries the scope the source states in its own first clause, 'of the copeptin stimulation tests currently available', and says explicitly that the 93% figure is a within-test ranking and the two are not comparable. This is the fifth instance in this session of prose that is individually defensible but does not survive being read against adjacent state, and the third introduced while correcting an earlier one. Recording that because the recurrence is the finding: each fix was checked against its own source and none was checked against the sentence three lines away. No claim, evidence item, snippet, grading or ontology binding changed.

  details: |
    De novo creation of kb/disorders/Neurohypophyseal_Diabetes_Insipidus.yaml (MONDO:0007450, AVP / hgnc:894), the first diabetes insipidus entry of any kind in the KB. 2049 lines, 97 evidence snippets, all 97 verified as exact substrings of cached references.

    DEEP RESEARCH. Two providers ran, both successfully.
    - asta (research/Neurohypophyseal_Diabetes_Insipidus-deep-research-asta.md, 4.6 s): 37/37 references resolved, 0 unresolved, 0 ontology CURIEs proposed. Retrieval quality for this disease was poor - of the 20 papers returned, the majority were about diabetes mellitus and its complications (diabetic nephropathy, diabetic cardiomyopathy, network-pharmacology studies of BPH) rather than diabetes insipidus. Three were on topic; PMID:10085151 (Ito 1999, dominant-negative dimerisation) is the one that ended up cited.
    - falcon (research/Neurohypophyseal_Diabetes_Insipidus-deep-research-falcon.md, 708 s / ~12 min, plus one text artifact): 18/20 references resolved, 2 unverifiable, 1 flagged possibly off topic (DOI:10.1055/a-2198-7207), needs_review true. Its term_validation needs_review is a false alarm: the "mislabelled" MONDO:0007450 is the template's own literal "(if available)" echoed back, not a term error. The report is scoped more broadly than this entry (it covers acquired central DI) and cites by author-year key with no PMIDs anywhere in the body, so nothing was quoted from it. Its independently-derived ordered causal chain matches the model built here step for step, including the caution that neuronal death is not required for early disease. Three leads from it were located in PubMed and cited: PMID:28920920 (Sel1L-Hrd1 ERAD mouse), PMID:24121282 (AVP mRNA poly(A) tail shortening under ER stress), PMID:9756087 (Brattleboro rat, as a model to be careful with). Its prevalence figure of 1 in 25,000 was NOT used - it is keyed to unresolvable author-year citations and is a figure for AVP deficiency overall, which is overwhelmingly acquired.
    The bulk of the entry came from a systematic PubMed E-utilities sweep, not from either report.

    GENEREVIEWS. No chapter exists for this disease. Searched three ways: disease name x GeneReviews[All Fields]; GeneReviews[Book] AND (vasopressin OR neurohypophyseal OR "central diabetes insipidus"); "AVP"[TI] AND GeneReviews. The only diabetes insipidus chapter in GeneReviews is Hereditary Nephrogenic Diabetes Insipidus (PMID:20301356), a different disease, which is not cited. WFS1 Spectrum Disorder (PMID:20301750) also surfaced and is likewise a different entity. The mandatory GeneReviews phenotype baseline therefore could not be applied and the phenotype set was built from primary clinical literature instead; this is recorded in the entry notes.

    MECHANISM MODEL AND THE JUDGEMENT CALLS.
    1. Two-arm consequence, not one. The cascade is: mutant prepro-AVP misfolding -> ER retention and disulfide-linked fibrillar aggregation (ERAD saturated, wild-type precursor trapped) -> ER stress and autophagy induction -> {vasopressin neuron secretory dysfunction} and {magnocellular neuron loss} -> progressive AVP deficiency -> impaired renal free water reabsorption -> polyuria / polydipsia / hypernatremic dehydration. Secretory dysfunction and neuron loss are separate nodes on purpose. PMID:19297548 counted AVP-mRNA-positive cells in the knock-in mouse and found polyuria advancing substantially with the cell count intact, concluding cell death is not the primary cause of the polyuria; PMID:31785344 says the same for the transgenic models. Collapsing them into one neurodegeneration node would assert that the polyuria is a consequence of cell death, which the literature specifically denies.
    2. Two routes into secretory failure, modelled as two edges: direct interference with the regulated secretory pathway, and an ER-stress-driven shortening of the AVP mRNA poly(A) tail with reduced expression (PMID:24121282, which demonstrates the direction by applying ER stressors to wild-type explants).
    3. Variant consequence slot. functional_impact_category: DOMINANT_NEGATIVE on the trigger node's genetic_context, not modifier: GAIN_OF_FUNCTION on a process descriptor. Per the CLAUDE.md decision table, functional_impact_category is the slot for a variant consequence and this is one. DOMINANT_NEGATIVE was chosen over NEOMORPHIC because it is what the primary literature demonstrates: PMID:10085151 shows mutant precursors heterodimerise with wild-type and block its ER-to-Golgi transit, and PMID:31785344 records wild-type precursor trapped in the aggregates. The broader "toxic gain" framing is carried in prose rather than forced into a single-valued enum.
    4. Module conformance. Two nodes conform to loss_of_proteostasis (#Misfolded-Protein Aggregation and #Proteotoxic Cell Dysfunction and Neurodegeneration). That module is tagged AGING and this is a paediatric Mendelian disease, but conformance is per-node, the module's description invites disease-specific substitution, and nine other Mendelian entries already conform to it. The module's upstream "Proteostasis Network Decline" node is deliberately NOT conformed to: the network is normal here and the client protein is not. amyloidogenesis was considered and rejected (it scopes to extracellular deposits; these are intra-ER). er_protein_storage_disease was considered and rejected (explicitly hepatocellular, ending in stellate-cell fibrosis; its node is named "Hepatic Protein Aggregation").
    5. Recessive subtype as a contrast, not a milder variant. has_subtypes carries AD FNDI and AR P26L, and AR P26L gets its own pathophysiology node ("Secreted Weakly Active Vasopressin") that enters the graph at the renal step, bypassing every ER node. Basis: PMID:15356057 ran dominant Y21H and recessive P26L side by side and found the first in the ER and the second in secretory granules; PMID:10369876 measured serum Leu-AVP up to 30x normal with ~30-fold reduced V2 binding; PMID:19897608 reports neonatal presentation and reads that timing as an argument against gradual neuronal destruction in that form.
    6. Animal models: four, two of them qualified or negative. The FNDI knock-in mouse carries RECAPITULATES for aggregation and secretory dysfunction, PARTIALLY_RECAPITULATES for neuron loss (loss only under sustained osmotic demand: 30-40% at 12 weeks water deprivation), and a RESCUES link for 4-phenylbutyrate. The Cys67stop transgenic rat carries the autophagy link. The Sel1L-Hrd1 ERAD-deficient mouse is included because it has no AVP mutation at all and still develops the disease, which is the cleanest evidence that ERAD capacity is what the mechanism turns on. The Brattleboro rat carries an explicit FAILS_TO_RECAPITULATE against the neuron-loss node: recessive frameshift, preserved magnocellular neurons, no neurotoxicity, and its own authors say results from it are only partially applicable to human hereditary CDI. It is the workhorse of vasopressin physiology and it would have been easy to list it as "the" model of this disease; it is not one.

    WHAT WAS DELIBERATELY LEFT OUT OR DOWNGRADED.
    - Prevalence carries measure_type UNKNOWN and prevalence_class RARE with no rate_per_100000. No population-based estimate for the hereditary form was found in any cached source. The two things that are citable - that the familial disease is rare, and that most central DI is acquired - are what the record asserts. The commonly repeated 1-in-25,000 figure was rejected (see above).
    - Scope. Nephrogenic DI and acquired central DI are excluded. PMID:29421628 is a nephrogenic DI review cited only for the normal AVP -> V2 -> AQP2 collecting-duct physiology, with directness: INDIRECT on both of its evidence items to record that it is not about this disease.
    - The absent posterior pituitary bright spot is modelled under diagnosis, not as a phenotype, because PMID:38087160 reports it absent in only 70% of AVP-D patients and also in 39% of primary polydipsia, and it disappears with age in healthy people.
    - 4-phenylbutyrate is a rescue arm on the mouse model, not a treatment entry - it is preclinical with no human trial in this disease.
    - No datasets and no clinical_trials: none specific to the hereditary entity were found.

    QUOTING NOTES. Four cached sources contain errors reproduced verbatim in snippets, each flagged in its own evidence explanation: PMID:10443701 prints "Ala(- 1)Thr" with a stray space; PMID:38087160 gives the copeptin cut-off unit as mmol/L where the primary trial (PMID:30067922) reports pmol per litre, and contains a garbled sentence beginning "Patients were urinary osmolality stays"; PMID:28920920 prints the gene as "Se1L" for Sel1L.

    REFERENCES REJECTED. asta's PMID:29421628 was kept only for background physiology (see above) rather than as disease evidence. asta's remaining 17 papers were about diabetes mellitus, diabetic nephropathy/cardiomyopathy, hydrocephalus, congenital hyperinsulinism and benign prostatic hyperplasia, and were not used. The Tocci 2021 adFNDI signal-peptide paper that asta returned (DOI:10.3390/ENDOCRINES2010004) has no PubMed record and was not cited, since equivalent signal-peptide evidence was available with PMIDs (PMID:10443701, PMID:33433888). falcon's DOI:10.1055/a-2198-7207 was flagged possibly off topic by the report's own validator and was not used.


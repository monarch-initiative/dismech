  summary: Fix a miscount inside the explanation rewritten to remove the same defect
  details: |
    Two prose corrections, both found by review. (1) The explanation rewritten last round to remove a false claim contained a smaller false claim of its own: it said the synthesis quote is distinguished from 'the two adverse-effect items, which report the study's own numbers'. Only one of the two does. The other quotes the review's instruction that a result obtained during severe nausea is interpretable only if copeptin stayed low, which this same PR grades OTHER precisely because it is a recommendation and not a measurement - so the sentence cited an OTHER-graded item as an example of the HUMAN_CLINICAL side of the distinction it was drawing. Now names the 48% nausea item alone. This is the fourth instance in one night of prose asserting something checkable about adjacent state that the adjacent state does not bear out, the defect class in issue #11456, and the second of those written inside a correction of an earlier one. (2) The arginine entry's description described hypertonic saline as 'the one confirmed to improve diagnostic accuracy'. That verb was borrowed from a snippet this PR removed and which now occurs nowhere in the file. The claim is still supported, by the new synthesis quote and by the head-to-head trial item, but the wording no longer traced to anything in the entry; it now reads 'the one shown to give the highest diagnostic accuracy', which tracks the surviving evidence. Separately confirmed a reviewer finding worth recording outside this entry: scripts/check_snippets_verbatim.py applies deartifact() to both the cache body and the snippet, while linkml-reference-validator strips the query side only. Verified by calling contains() directly - the marker-bearing form of the comparison sentence returns True in the fast checker while failing the gate. So just count-verified-snippets can green-light a snippet just validate-disorders rejects, which contradicts conf/reference_validator_config.yaml's own claim that the fast and slow checks stay in agreement. Reported on dismech#10734; not fixed here, since it is a tooling change with KB-wide blast radius.

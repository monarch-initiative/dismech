  details: |
    Two non-blocking items from an approving review, taken because the first is the same defect class this PR has been closing and the last confusable pair left in the entry. (1) The biochemical copeptin marker quotes the review's 'diagnostic accuracy of 97%', while the diagnosis section reports the same measurement as 96.5% - same trial, same test, same 4.9 cutoff. Verified rather than assumed: PMID:30067922 reports 96.5% and contains no 97% figure anywhere, so the review is rounding rather than describing a second analysis. A reader meeting both numbers in different cards had no way to tell. The biochemical explanation already cross-referenced the diagnosis section for a unit discrepancy in the same quote, so the accuracy cross-reference goes in the same place, which is where a reader is already looking. (2) A grading sentence said several pre-existing items carry HUMAN_CLINICAL 'from an earlier round'. The KB diff against origin/main is +152/-0 with zero deletions, so every one of those items is merged content from earlier curation, not from an earlier review round of this PR. In a file whose recent history is seven correction rounds that reads the wrong way, and the sentence's whole job is to scope a claim precisely. Now says 'from earlier curation'. Process. The extraction check was widened from the diagnosis section to the whole entry, because the missed figure was in a different section - the previous runs would never have found it. Enumerating every quoted percentage file-wide with its section, entry and citing reference confirms the 97/96.5 pair was the only confusable accuracy duplication: the MRI 70% and 39% are sign frequencies, the 48% is an adverse-effect rate, the 50% is a urine-osmolality response threshold, and the two 30-40% figures are the same neuron-loss statistic from one source quoted in two sections. Scope the extraction to the file, not to the block being edited.

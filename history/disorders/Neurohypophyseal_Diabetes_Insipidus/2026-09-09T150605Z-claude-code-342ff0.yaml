  summary: Correct a uniqueness claim; record that scope and quantifier are separate
    axes
  details: |
    CORRECTION TO THE PRECEDING HISTORY RECORD. The record 2026-09-09T135624Z-claude-code-aa610b.yaml says the reading rests on '96.5% being the only hypertonic-saline accuracy the trial reports at that cutoff'. That is wrong, and so was the clause it describes. Records are append-only so that one is not edited; this record carries the retraction. Verified by enumerating every percentage in the cached abstract with its context: PMID:30067922 reports TWO hypertonic-saline accuracies at the >4.9 pmol/L cutoff - 96.5% overall in 136 of 141 patients, and 95.2% for the partial-central-DI-versus-primary-polydipsia subgroup in 99 of 104. So 'sole' was false, and false at abstract scope, not merely at paper scope. The clause also said 'the trial reports', which is paper scope, in the sentence that had just been narrowed from paper scope to artifact scope. The reading survives unchanged - 97 is a rounding of 96.5 and not of 95.2 - but the premise offered in support of it was wrong, and the competing figure had been quoted verbatim in the review being answered, so it was in front of the edit rather than buried. The clause now names both figures and rests the reading on 96.5% being the only figure in the cached record that 97% could round from. THE CHECK GAINS A FIFTH REVISION, and this one is the reviewer's observation rather than mine. A scope-of-verification audit answers WHICH ARTIFACT a claim was checked against. It does not answer IS THIS THE ONLY ONE. Those are separate axes, and 'no 97% in the record' and '96.5% is the only accuracy in the record' are both negative-existence claims - the first was audited and the second was written in the same breath as its remedy. A uniqueness claim needs its own enumeration of the candidate set. Ran that here: of the claims this PR adds, the only uniqueness-about-a-source claim is the one corrected above; the rest are restrictive modifiers or claims about the entry's own state, which hold. Pre-existing uniqueness claims in merged content, including the GeneReviews search note and the prevalence no-estimate-found note, are out of scope for a follow-up about one diagnostic test.

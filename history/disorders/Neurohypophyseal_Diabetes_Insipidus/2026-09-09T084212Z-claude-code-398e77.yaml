  summary: Quote the within-cohort head-to-head so the ranking carries a number, not
    a caveat
  details: |
    The reviewer found the way out of a loop this entry had been in for three rounds, and also found that the previous round's caveat was wrong on the natural reading. Both are addressed here. (1) The caveat said the between-test ranking and the 93% figure were 'not comparable'. That is true of the two rankings and false of the two figures: the same cached reference carries a post-hoc head-to-head in the sixty patients who took part in both stimulation studies, giving 100% for hypertonic saline against 93% for arginine. What is genuinely not comparable is the 93% against the 96.5% the sibling entry quotes, because those come from different trials. A reader arriving at 93% three lines below 96.5% would have taken the caveat as being about the numbers and been misled. (2) The sentence the caveat was working around is quotable as written - exact, single occurrence, no inline citation markers, so no ellipsis bridge needed. It is now a fifth evidence item, graded HUMAN_CLINICAL because it reports an analysis of patient data even though that analysis is post-hoc, together with the review's proposed mechanism for the gap ('Likely, hypertonic saline infusion provides a stronger copeptin stimulus') as a sixth item graded OTHER and INDIRECT, since 'Likely' marks it as the authors' inference rather than a measurement. The description now states the trade-off with a within-cohort number and drops the caveat entirely, and the cross-trial reading point moved to the Diagnosis notes slot, which is what that slot is for and leaves description describing the test. Process note, because it is the point of this round: the recurring defect in this PR has been prose that is defensible against its own source and wrong against a sentence a few lines away, and the remedy is not more care but a different check. Before pushing, every figure-bearing line in the whole diagnosis block was read together rather than only the lines being edited. That check caught a fresh instance in this round's own new text - a notes sentence saying 'the three accuracy figures in this section', where the block carries four, since the sibling snippet also quotes 76.6% for the water deprivation test. It was corrected before commit rather than after review.

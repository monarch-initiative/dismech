  summary: Modernize Acne Vulgaris as a noninfectious, multifactorial pilosebaceous disorder
  details: |
    Rebuilt the entry after independent source, schema/ontology, and scientific
    audits. Removed the infectious-agent assertion for commensal Cutibacterium
    acnes, deprecated prevalence percentages, weak candidate-gene records,
    misleading circulating biochemical assertions, conflated procedures, and
    treatment mechanisms that were inferred only from clinical outcomes.

    Replaced the linear sebum-to-bacterium-to-inflammation account with an
    evidence-qualified graph of interacting follicular differentiation,
    lesion-dependent sebaceous states, retention hyperkeratosis, strain/community
    immune signaling, early inflammation, and deep-lesion repair. Added a
    canonical interaction model and an emerging follicular-lineage hypothesis,
    with an explicit open controversy about causal ordering.

    Added polygenic inheritance, ascertainment-aware prevalence records, clinical
    diagnosis, practical differentials, three contextualized human datasets, and
    a guideline-aligned pharmacologic treatment core. Narrowed the phenotype set
    to clinically supported lesions and sequelae. Added edge-level evidence and a
    closed top-level catalog for every retained reference.

    Validation reached 100% global and weighted compliance, 6/6 causal phenotype
    connectivity, valid graph integrity, exact reference-catalog closure, and
    passing schema, ontology-term, and reference-snippet checks.

  summary: Link diet and stress exposures to the sebaceous and inflammation nodes
  details: |
    Backfill for issue #8085. All three exposures are EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES, which matches an entry that is careful throughout not to claim diet or stress causes acne. High glycemic load and dairy both target the lesion-context-dependent sebaceous lipid dysregulation node and are graded identically, because both are proposed to act through insulin to IGF-1 signalling, and IGF-1 is the half of that the node names, alongside androgen. The link descriptions say so explicitly rather than claiming the node names insulin, which it does not. The glycemic-load link deliberately carries the entry's REFUTE item, a 2005 systematic review finding no clear evidence that dietary components increase acne risk, at its existing grade. That is the point of putting it there: the contrary evidence travels with the claim in the pathograph rather than sitting apart from it in the exposure block. Psychological stress targets the early and sustained pilosebaceous inflammation node rather than the sebaceous one. That is an inference and the description says so: cutaneous neurogenic mediators are inflammatory signalling and this is the earliest inflammatory node in the graph, but the cited sentence names a pathogenic cascade without saying where in it the mediators enter, which is why the intermediates are recorded as unknown and the item stays PARTIAL. No evidence grade or evidence_source was changed; all five items were reused verbatim with their existing PARTIAL, REFUTE, and OTHER values. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 59 of 72 verified with 13 pre-existing DOI-prefix skips, none of them on items added by this change.

  summary: 'Create: DIP2C-related Developmental Disorder With Speech Delay'
  details: |
    New entry for MONDO:0700356 (claim #14589). Phenotypes and frequencies come from the 23-patient defining cohort (PMID:38421105, full text), with the childhood apraxia of speech report (PMID:36117209), the focal epilepsy splice-variant case (PMID:34617658), a Swedish developmental language disorder cohort (PMID:38300321) and hemiplegic cerebral palsy CNV cases (PMID:28771244). Mechanism nodes beyond haploinsufficiency rest on Dip2c mouse knockouts (PMID:41054236, PMID:32707302), zebrafish dip2ca knockdown (PMID:40915331) and DIP2-family lipid work (PMID:35766356). All are marked indirect, and a HUMAN_MODEL_MISMATCH discussion records the gap. Phenotypes from 10p15.3 microdeletions were not attributed to DIP2C, because those deletions usually include ZMYND11. Deep research: falcon was requested and failed authentication (403), so the run used --fallback and openscientist produced the report (19/19 references verified, 3 flagged off topic, none of which are cited here). just preflight-dr passed (DIP2C mentioned 60 times). No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). A fresh-context review before the PR corrected the apraxia child's variant (a splice-acceptor variant; the same child is cohort patient 14), recorded the cerebral palsy deletions as mosaic with a confounding infarct, recorded the mouse RNA-seq as homozygous, rebound developmental delay to HP:0012758, added 11 cohort phenotypes, and removed two edges with no supporting source. Validated with just validate (schema, terms, 54/54 snippets) and the offline gates (entity refs, causal targets, duplicate keys, enum values, gene-term mismatches, snippet length/title/grading, coarse phenotypes).

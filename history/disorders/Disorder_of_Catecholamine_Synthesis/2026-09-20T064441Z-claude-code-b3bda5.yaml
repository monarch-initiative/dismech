  summary: 'Genetics pass: bind subtype genes; all three MONDO genes already curated'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: GeneReviews baseline checked with `just check-genereviews` (no GeneReviews
    chapter indexed for this umbrella term), then the entry's own cited BH4-pathway and
    monoamine-synthesis literature was re-read before opening the reconciliation checklist.

    All three checklist genes - GCH1 (hgnc:4193), SPR (hgnc:11257) and DNAJC12 (hgnc:28908) -
    were already curated: each carries a `genetic:` record with a `gene_term`, a `subtype:`
    foreign key, `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE`, and each is
    already bound as a `genes:` descriptor on the pathophysiology node it acts at (BH4 Cofactor
    Deficiency for GCH1 and SPR, DNAJC12 Co-chaperone Dysfunction for DNAJC12). The knowledge-graph
    gap is an export artefact, not a curation gap: the checklist keys on MONDO:0100184,
    MONDO:0012994 and MONDO:0044304, which are `has_subtypes` terms here, while the KGX exporter
    emits gene edges only against the entry's own `disease_term` (MONDO:0017759). See dismech#12316.

    What changed: each of the five `has_subtypes` rows now carries a `genes:` list
    (DDC, TH, GCH1, SPR, DNAJC12), so the gene-defined subtypes are machine-readable at the
    subtype row as well as through the `genetic[].subtype` foreign key.

    Observed and deliberately not changed: PTS, QDPR and PCBD1 carry `genetic:` records with no
    `subtype:` foreign key, because this entry has no subtype rows for 6-pyruvoyl-tetrahydropterin
    synthase, dihydropteridine reductase or pterin-4-alpha-carbinolamine dehydratase deficiency.
    Adding them would need MONDO terms and evidence of their own and is outside this pass.

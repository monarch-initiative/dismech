  summary: 'Review round 2 suggestions: quote_role BACKGROUND, pyramidal-sign frequency'
  details: |
    Took the ai4c-reviewer round-2 suggestions (the one blocking item, the GeneReviews tag, was already fixed in the prior push ec2086d). (1) Changed quote_role from REVIEW_SYNTHESIS to BACKGROUND on all 12 PMID:33002721 evidence items: those sentences are from a case report's introduction summarising prior reports, which is BACKGROUND, not a review/commentary synthesis; the two systematic reviews (Genes 2026 DOI:10.3390/genes17070764 and MDSGene PMID:34396589) keep REVIEW_SYNTHESIS, and the Genes 2026 family sentence keeps PRIMARY_RESULT. (2) Added the Genes 2026 pooled pyramidal-sign frequency (~60%) as a second evidence item on the Hyperreflexia, Babinski Sign and Spasticity phenotypes and noted in their descriptions that pyramidal signs are present in about 60% of pooled cases and absent in a subset, so the diagnostic:true rows are not read as universal. Declined, with reason, the levodopa-induced-dyskinesia/amantadine suggestion: the citable Genes 2026 abstract does not mention dyskinesia and no other cached source does. Re-validated: validate-disorders (0 issues, 64/64 snippets), validate-terms, check-snippet-grading, check-folded-hyphens, and the rest of the gate list.

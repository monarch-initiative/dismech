  summary: 'Create: FBXO7-Related Parkinsonian-Pyramidal Syndrome (PARK15)'
  details: |
    Split FBXO7/PARK15 (MONDO:0009830) out of the Parkinsons_Disease basket as a standalone autosomal-recessive per-gene entry (Closes #18434). Mechanism curated around current evidence: proteasome branch (Vingill 2016 PMID:27497298, FBXO7-SCF ubiquitinates PSMA2; KO mice with reduced proteasome activity) as the ESTABLISHED in-vivo route; mitophagy branch (Burchell 2013 PMID:23933751) marked PROVISIONAL and carrying the refuting Kraus 2023 PMID:37334901 REFUTE evidence; RPL23-MDM2-p53 nigral-degeneration mechanism and striatal dopamine loss from the Stott 2019 conditional-KO mouse PMID:31144295; first locus/R378G from Shojaee 2008 PMID:18513678; naming+discovery from Di Fonzo 2009 PMID:19038853; isoform-1 LOF from Zhao 2011 PMID:21347293; MDSGene PMID:34396589. claude_code deep research used as a lead only (it flagged the mitophagy contestation); every snippet verified as an exact references_cache substring. No ClinGen FBXO7 assertion and no dedicated GeneReviews chapter (Monogenic PD Overview NBK1223 only). Validated: validate-disorders (0 issues), 45/45 verified snippets, validate-terms, and the full gate list including check-snippet-grading, check-folded-hyphens, conformance-content and model-scale-audit.

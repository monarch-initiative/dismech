  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (3 findings), each verified against the actual cache first. (1) Phenotypes expanded from 2 to 11: added Bradykinesia and Postural Instability (Genes 2026 systematic review, DOI:10.3390/genes17070764, 83.3%/87.5%), the specific pyramidal signs Hyperreflexia/Babinski sign/Spasticity (replacing the coarse HP:0002493, from PMID:33002721's PPS enumerating sentence), and Dystonia/Cognitive decline/Dysarthria/Dysphagia/Psychiatric symptoms; the pyramidal node now wires to the three specific signs, the motor-syndrome node to bradykinesia/postural instability, and the striatal node to dystonia. Fetched the reviewer leads (PMID:20669327, 26010069, 33002721, and the Genes 2026 review by DOI) and used only snippets that verify exactly. (2) Three model divergences mis-typed SPECIES_MISMATCH rectified: proteostasis KO link -> PROXY_QUANTITY (null proxies the hypomorphic allele); nigral and motor-syndrome links -> INCOMPLETE_PHENOTYPE; the IMMATERIAL striatal one left as the reviewer accepted. (3) Removed GO:0051402 neuron apoptotic process from the Pyramidal System Degeneration node (no cited evidence shows apoptosis there); it keeps the corticospinal-tract location. Progression now gives the 2nd-3rd decade onset (PMID:33002721) and the later loss of levodopa responsiveness (PMID:20669327); diagnosis cites Paisan-Ruiz for panel testing. Re-validated: validate-disorders (0 issues, 61/61 snippets), validate-terms, and the full gate list including check-snippet-grading, check-folded-hyphens, coarse-phenotypes, entity-refs, causal-targets and model-scale-audit.

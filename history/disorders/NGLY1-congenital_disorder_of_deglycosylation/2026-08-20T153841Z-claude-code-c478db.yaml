  summary: 'Rebuild NGLY1-CDDG: Nrf1/ENGase mechanism, gene therapy, models, natural
    history'
  details: |
    The entry cited five references, none newer than 2019, and carried no treatments, trials, models, prevalence, progression or discussions. 365 -> 1614 lines.

    Pathophysiology: added two nodes. ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation captures the bypass route - with the amidase absent there is no other way to cut the GlcNAc-Asn bond, ENGase cleaves elsewhere and leaves a single GlcNAc, and the aggregation-prone product yields the GNA biomarker. Failed NFE2L1 sequence editing and proteasome bounce-back failure captures the activation function: NGLY1 edits glycosylated Asn to Asp in Nrf1, and only the edited protein binds HCF-C1/OGT, reaches chromatin and drives proteasome-subunit expression (PMID:41468431). Patient variants including Arg401* misprocess NFE2L1 (PMID:40643555), so this is a lesion of the human disease. All three existing nodes wired to the new cytosolic_deglycosylation module.

    Phenotypes: nine added with frequency bands derived from the 2026 multicenter cohort's own numerators - seizures 9/15, abnormal EEG 10/15, reduced deep tendon reflexes 6/15, feeding difficulties 9/15, scoliosis 7/13, constipation 6/15, hypocholesterolemia 7/10, low HDL 5/10, dysmorphic facies 15/15 (OBLIGATE).

    Biochemical: GlcNAc-Asn (GNA) added as a structured readout of the ENGase node, superseding the bare aspartylglycosamine entry in coverage though both are retained.

    Treatments and trials: GS-100 AAV9 gene replacement with target_mechanisms on both the trigger and the ENGase node, and GlcNAc supplementation for alacrima. Three trials: NCT06199531 (first-in-human GS-100), NCT05402345 (GlcNAc phase II), NCT06122766 (movement-disorder natural history).

    Animal models: Ngly1-/- rat (RECAPITULATES, three readouts including the 2026 aging study's survival and histopathology); Ngly1-null mouse with the Engase double knockout (FAILS_TO_RECAPITULATE on the human phenotype because it is embryonically lethal, plus RESCUES on the ENGase node); inducible iNgly1 mouse (PARTIALLY_RECAPITULATES).

    Prevalence: birth prevalence ~1 in 4 million (US) plus a worldwide case count. Progression: the prospective natural history's specific finding - individual measurements mostly stable over one year while age-equivalent scores diverge, so the gap widens through failure to keep pace rather than through loss.

    Discussions: three. A KNOWLEDGE_GAP on which substrate explains the phenotype, which records that the ERAD account is under direct challenge (PMID:40773511 states loss of NGLY1 has little effect on ERAD). A HUMAN_MODEL_MISMATCH on the mouse/rat/human severity spread and its background-modifier explanation. A KNOWLEDGE_GAP on gene therapy's partial rescue - AAV9-hNGLY1 suppressed convulsions but did not correct EEG or sleep (PMID:41176936), a dissociation the trial's co-primary endpoints would not detect.

    Datasets: geo:GSE301626 and geo:GSE295078, both verified by just verify-datasets.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 78/78; included in a just validate-disorders batch of 10 files that passed with 728/728 snippets verified.

  summary: 'Review round 2: fix snippet-grading divergence, correct a wrong claim
    about the cache'
  details: |
    Round 2 of review on PR #11619. Two blocking items and one suggestion, in one push.

    CRITICAL, check-snippet-grading. The same PMID:31578471 sentence was graded HUMAN_CLINICAL at prevalence[0] and OTHER at two pathophysiology sites. The reviewer is right that evidence_source classifies the cited publication and so cannot change because the quote moved. Both occurrences are now HUMAN_CLINICAL. The inference nuance the OTHER grade was reaching for is already carried by directness: INDIRECT on both items, which is the axis for it, so nothing is lost. The gate now exits clean.

    IMPORTANT, a wrong claim about repository state. The notes: section asserted that the sentence 'There is currently no treatment for LSS' is not in the cached text of PMID:40163633. It is, at the end of that abstract. The assertion was wrong and is removed. The sentence is now curated as evidence on a new no_disease_modifying_therapy KNOWLEDGE_GAP attached to treatments#, which is a better home than prose: the treatments section holds one adverse-reaction row and a reader should be able to see that the thinness is a fact about the field. The correction is recorded in notes rather than silently deleted, because a committed sentence claiming a source is defective outlives the session that wrote it and check-source-defect-claims did not fire on this phrasing.

    While curating that evidence item I wrote its reference_title from having read the abstract rather than copying the cache frontmatter, and produced 'Colobomas and Lens Subluxation as Possible Additional Ophthalmic Manifestations of Lamb-Shaffer Syndrome' for a paper actually titled 'Bilateral Iris and Chorioretinal Colobomas in a Child With Suspected Lamb-Shaffer Syndrome'. The reference validator caught it. This is the exact failure CLAUDE.md documents for citation strings and it is worth recording that it recurred inside the very edit that was correcting a different claim about the same file.

    SUGGESTION taken: hypermetropia added as its own ophthalmologic phenotype, from the second finding sitting inside the pain-insensitivity sentence. It is kept separate from the strabismus and optic-atrophy rows because it is a refractive rather than structural finding and its frequency claim rests on a weaker basis, which the explanation says.

    SUGGESTION declined: gnomAD constraint metrics. They appear in the deep-research report but no cached reference carries them as a quotable sentence, and CLAUDE.md forbids writing numbers from a report rather than from a source. A ClinGen dosage-sensitivity record for SOX5 would be the right citable substitute, but just clingen-dosage-refresh currently fails on a checksum drift against the unversioned upstream file, and repinning a manifest belongs in its own PR with its cache diff rather than inside a curation change.

    SUGGESTION declined: renaming discussion_id no_model_system. The reviewer agreed the rename costs an entity-ref sweep for no functional gain.

    Validation: schema clean, terms clean, 47 of 47 snippets verified, and check-snippet-grading, entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

  details: |
    Response to ai4c-reviewer changes-requested on PR #11619. The blocking finding was correct: the first version cited 3 of the 20 references its own deep-research run had fetched and committed, and several uncited ones bore directly on the entry's open questions. Changes: (1) cite PMID:23220431, whose smallest-deletion critical region contains SOX5 alone and settles the single-gene claim from the deletion side, on the root node and the entity_is_gene_not_region discussion; (2) cite PMID:22290657, the founding series and eponym source; (3) add an animal_models entry for the Sox5 null mouse (PMID:18215621) with modeled_mechanisms, two readouts, and typed SPECIES_MISMATCH and SCALE_EXTRAPOLATION divergences, move the transcriptional-program node from HYPOTHETICAL to PROVISIONAL, and retype the no_model_system gap to HUMAN_MODEL_MISMATCH since the mouse is a homozygous null against a human heterozygous lesion, which is a mismatch rather than an absence; (4) add seven phenotypes with cached evidence: ophthalmic involvement (~57%), refraction, optic atrophy, seizures (21/95), facial dysmorphism, pain insensitivity; (5) correct an overstatement of my own, that point variants outnumber deletions, generalised from a 16-patient series, against the 83-variant cumulative 47/53 split; (6) update prevalence to 111 reported patients; (7) add the risperidone paradoxical-agitation case as a hedged treatment row with its own limited-data qualifier as a separate evidence item; (8) genetic review_notes moved to notes. NOT adopted: the review attributed 'There is currently no treatment for LSS' to PMID:40163633 and that sentence is not in the cached text; stated in prose instead. Re-validated: 45/45 snippets verified (was 25/25), terms, entity-refs, duplicate-keys, causal-targets, enum-values, qualifier-terms all pass.

  summary: 'Create: 12p12.1 microdeletion syndrome (MONDO:0017781, SOX5)'
  details: |
    De-novo curation of MONDO:0017781 as a DISEASE entry, curated as SOX5 haploinsufficiency (Lamb-Shaffer syndrome) with the 12p12.1 deletion as one mutational class among four, rather than as a copy-number lesion. The decisive observation is a patient with a balanced translocation whose breakpoint falls in SOX5 intron 4 and no copy-number change at all, plus a contemporary series in which point variants outnumber deletions 9 to 7. The mismatch between that model and MONDO's region-based label is recorded as its own knowledge gap rather than resolved. The Disrupted Neurodevelopmental Transcriptional Program node is marked HYPOTHETICAL deliberately: the pathograph is well supported from allele to DNA binding and from clinic to phenotypes, and nothing joins them, since no patient-derived neural model is reported. Two further gaps: absent genotype-phenotype correlation, and the unreplicated microcephaly signal in point-variant patients. Validated: just validate (25/25 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass.

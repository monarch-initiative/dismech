  details: |
    Review round 1 on PR #9824 (ai4c-reviewer, CHANGES_REQUESTED). Three CRITICAL findings, all correct, all caused by the same process error.

    The root cause, stated plainly because it is the most useful thing in this record: I read the ABSTRACT of PMID:34623332 and treated it as the paper. The cache file contains 1497 lines of full text. The deep-research report had surfaced the paper and I correctly used it to fix the transcriptional node - and then stopped, never reading the clinical or genetic sections. Three of the entry's factual claims were contradicted by text sitting in the PR's own cache.

    CRITICAL 1 - allele count. The entry said two REL alleles are published and framed the whole genetic section around "two alleles reaching the same endpoint by different routes". There are three. Patient 2 carries c.395-1G>A in the essential ACCEPTOR splice site of exon 5, common to both known REL isoforms, producing a frameshift and a premature stop at codon 134. It is the mirror of the index allele (donor side of the same exon, in-frame 18-residue deletion), and the contrast is more informative than the original framing was. Fixed in both the pathophysiology node description and genetic[REL].notes, with two new evidence items.

    CRITICAL 2 - live vaccines. The entry asserted in four places that live BCG, poliovirus and measles vaccines were tolerated without sequelae, generalising from the index patient. Patient 2 developed DISSEMINATED BCG disease from the vaccine, with bone, lung and lymph node involvement. This was the most clinically consequential error in the batch: an entry a clinician might consult on live-vaccine safety presented only the reassuring case. Rewritten as a two-patient dissociation across the description, the pathophysiology node, the evidence explanations and the discussion. The discussion is renamed imd92_bcg_dissociation and reframed around the observed variance, which is a stronger argument for the graded-defect thesis than the original single-patient inference. Added a BCGosis phenotype (HP:0020087). The entry now states explicitly that nothing supports treating live vaccines as safe in this disease.

    CRITICAL 3 - HSCT. The entry said no transplanted IMD92 patient has been published and there is no outcome evidence whatsoever. Patient 2 was transplanted in 2017 and her infectious phenotypes were cured. Corrected, and the cure is now recorded for what it is beyond a treatment outcome: because HSCT replaces only the haematopoietic compartment, simultaneous correction of the immunological and infectious phenotypes is a rescue result establishing the disease as leukocyte-intrinsic - direct support for the whole pathograph.

    IMPORTANT 4 - patient 2's clinical phenotype was essentially unrepresented. Added four phenotypes: disseminated BCG disease, chronic mucocutaneous candidiasis, severe CMV infection, recurrent viral infections. The CMC entry follows the reviewer's mechanistic thread - CMC is the canonical IL-17-axis phenotype and the paper measures poor Th17 cytokine production, so the fungal susceptibility runs down the same promoter list as the mycobacterial one. Also added the antigen-specific proliferation failure (tuberculin, candidin, tetanus toxoid, CMV antigens) to the T-cell node, which had rested only on the index patient's PHA result.

    IMPORTANT 5 - sclerosing cholangitis had replicated and the note said it had not. Both fully described patients had cryptosporidial cholangitis. Upgraded from PARTIAL to SUPPORT with the second patient's evidence added; it is now one of the better-replicated features in the entry.

    IMPORTANT 6 - frequency: VERY_FREQUENT on Chronic Diarrhea broke the entry's own stated policy against frequency bands at n=3, and 2/3 is FREQUENT anyway. Band removed with a note explaining why.

    IMPORTANT 7 - immunoglobulin replacement was therapeutic_modality: OTHER; peer entries use PROTEIN_REPLACEMENT. Fixed, and took the suggestion to split the bundled "Immunoglobulin Replacement and Antimicrobial Prophylaxis" treatment into two entries so each has its own term and target_mechanisms.

    A note on snippet selection: the cached full text is PDF-extracted and hyphenates words across line breaks (chol-/angitis, hematopoiet -/ic, stim-/uli). Snippets were chosen to avoid crossing those breaks; where that was not possible the snippet stops short and the explanation says why. Multi-line quotes without hyphenation validate fine - the validator normalises whitespace.

    Validation after fixes: 51/51 snippets verified (up from 37/37); check-snippet-length, check-snippet-grading and check-title-snippets all pass against origin/main; schema, terms, validate-disorders, entity-refs and duplicate-key checks pass.

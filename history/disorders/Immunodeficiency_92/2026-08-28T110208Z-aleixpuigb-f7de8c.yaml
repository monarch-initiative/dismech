  summary: 'Create: Immunodeficiency 92 (REL / c-Rel deficiency)'
  details: |
    De-novo curation of MONDO:0030498 (c-Rel deficiency, immunodeficiency 92).

    Deep research: one openscientist run (research/Immunodeficiency_92-deep-research-openscientist.md). Its reference_validation reported 13/13 references resolved, confabulation_rate 0.0, 0 off-topic.

    The DR run produced the largest single correction of this curation batch. The initial draft was built from the two patients my own PubMed searches found (PMID:31103457, PMID:42117340) and recorded a KNOWLEDGE_GAP asking whether IL-12, IFN-gamma or IL-21 transcription had ever been measured in c-Rel-deficient patient cells, with a proposed experiment to do so. The report surfaced PMID:34623332 (J Clin Invest 2021), the second patient, in which exactly that work had already been done: abolished IL-12 and IL-23 production by cDC1s and monocytes but NOT cDC2s, loss of CD86 induction on conventional dendritic cells, reduced IL-2 production by naive T cells, and impaired MYC and BCL2L1 induction in naive B cells.

    Consequences for the entry: the transcriptional node moved from PROVISIONAL to ESTABLISHED with direct measurements attached; a new pathophysiology node (Myeloid Antigen-Presenting Cell Failure) was added for the cDC1-selective defect, which the draft had missed entirely; the B-cell node gained its intrinsic transcriptional targets; a new phenotype records the selective reduction of NK, Temra CD8, memory CD4/Th1, Treg and memory B compartments; and the incorrect knowledge gap was replaced by a genuine one - why cDC1 fails while cDC2 is spared.

    Also added the classical c-Rel mouse models (PMID:7649478, PMID:8622948) as animal_models entries, including the IL-2 rescue readout that dissects the lineage-specific requirement, and the finding that c-Rel acts as a REPRESSOR in LPS-stimulated macrophages - recorded as PARTIAL because it complicates rather than supports the entry's transcriptional node.

    The entry is deliberately written to keep the evidence base visible. Three patients exist in total, only two in curatable detail, and the strongest evidence in the entry is n=1 with an extensive mechanistic workup - a distinction the schema has no slot for and which is carried in prose in each evidence explanation. Craniosynostosis, language delay and epilepsy from the third patient are recorded as PARTIAL with an explicit note that a second recessive condition in a consanguineous family is a live alternative explanation.

    One error was caught by term validation and fixed before commit: HP:0030374's canonical label is "Decreased memory B cell proportion", not the synonym OAK's prefix search had matched.

    Validation: just validate passes - schema, terms, and 37/37 snippets verified against cached references; just validate-disorders, just check-entity-refs and just check-duplicate-keys pass.

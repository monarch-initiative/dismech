  details: |
    Comprehensively reviewed ACAD9 deficiency. Reframed the dual ACAD9 molecular states and distinguished the defining complex I assembly defect from tissue-dependent fatty-acid-oxidation impairment as a severity modifier. Corrected prevalence and cohort-denominator claims. Added structured inheritance, progression, causal graph, phenotype, biochemical, diagnosis, differential, treatment, genetic, discussion, and dataset context. Tempered riboflavin efficacy and mechanism claims, added the experimental bezafibrate plus nicotinamide-riboside case, generated four new reference caches with the approved fetch command, and opened issue 6618 for the unresolved riboflavin response question. Independent literature, evidence, and schema reviews informed the revision.

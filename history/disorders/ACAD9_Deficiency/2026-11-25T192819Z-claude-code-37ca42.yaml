  summary: 'Gene-family review: ACAD9'
  details: |
    ClinGen's Fatty Acid Oxidation Disorders GCEP classifies ACAD9 for acyl-CoA dehydrogenase 9 deficiency (MONDO:0012624, this entry's own disease term) as Definitive, autosomal recessive, but the entry did not record it; the tier is now copied into gene_disease_validity with the CGGV row quoted. On the fatty-acid-oxidation node the generic acyl-CoA dehydrogenase activity term was narrowed to long-chain fatty acyl-CoA dehydrogenase activity, which matches the node's description and its knockout-and-rescue evidence for long-chain fatty acid oxidation (PMID:25721401). The complex I assembly node, where ACAD9 acts in the MCIA complex without a demonstrated molecular function of its own, was left with its assembly process term.

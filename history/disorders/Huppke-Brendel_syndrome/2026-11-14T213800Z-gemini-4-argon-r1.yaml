  summary: Address Round 1 PR review comments on Huppke-Brendel syndrome
  details: |
    Removed subtype from both prevalence entries and changed the worldwide point-prevalence class to BELOW_1_IN_1000000 while keeping ULTRA_RARE on the CASES_IN_LITERATURE entry. Removed icimd_category from classifications to restore the prior decision to leave icimd_category unset until a primary ICIMD table is cached, since the cached Ferreira et al. 2021 text (PMID:33340416) does not enumerate individual disorders per group and low serum copper is secondary to reduced ceruloplasmin secretion from ER acetyl-CoA transporter (AT-1) deficiency. Added the GeneReviews 25% sibling recurrence-risk quote (PMID:31194315) to inheritance and Genetic Counseling, added the gross motor severity quote to Severe global developmental delay, set frequency: OBLIGATE on Hypotonia, added a Multidisciplinary Surveillance and At-Risk Sibling Evaluation supportive care entry, added Nystagmus (HP:0000639) cited to ORPHA:300313 with a downstream causal edge from Cerebral and cerebellar developmental injury, and clarified the Cerebellar atrophy downstream edge description.

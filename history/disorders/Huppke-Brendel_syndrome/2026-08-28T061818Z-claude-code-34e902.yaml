  details: |
    Added biological_scale tags to the six pathophysiology nodes. Deliberately did not add an icimd copper_metabolism classification: the proximal lesion is the ER acetyl-CoA transporter AT-1, and the entry itself frames low serum copper as secondary to reduced ceruloplasmin secretion, so its ICIMD placement between the acetylation/CDG and copper groups is genuinely ambiguous and left for a curator decision. Validated with validate-disorders.

  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11688. Seven IMPORTANT items, single bundled push. Most were fixable from caches already on the branch, as the reviewer said.

    EVIDENCE THAT DID NOT REACH ITS CLAIM (findings 1, 2, 5).
    - Oxidative Injury of Erythroblasts and Erythrocytes asserted GO:0006979 on a heme-binding snippet whose own explanation conceded it established 'heme binding and protease resistance, not the downstream oxidative chemistry'. An explanation that says the snippet does not support the claim is a request for a better snippet, and the reviewer is right to treat it as blocking. Added PMID:29180398, cached and unused, which states the oxidative stress in the erythroblast directly.
    - Ineffective Erythropoiesis rested on Heinz-body ultrastructure, which does not measure erythropoietic efficiency. Same reference carries the erythroblast-apoptosis sentence that does.
    - The AHSP saturation claim in Excess Unpaired Alpha-Globin was uncited while the second knowledge gap was built on it. Cited PMID:25724329, and the explanation states precisely what the snippet does and does not establish: AHSP's protective function, not that the chaperone is saturated in this disorder. The saturation step remains the inference the knowledge gap is about.

    TREATMENTS (findings 3, 4, 6).
    - Split the bundled 'Supportive transfusion and iron chelation' into Red blood cell transfusion (NCIT:C15192) and Iron chelation therapy (NCIT:C15986 with a deferasirox CHEBI agent), matching how Beta_Thalassemia models them. The off-claim PMID:8184583 snippet is gone: it described phenotypic variability across families and never mentioned either intervention. Both now cite GeneReviews for the management framework they actually come from.
    - therapeutic_modality corrected. The bundled entry was BEHAVIORAL, which is wrong for both halves. Chelation is SMALL_MOLECULE; transfusion is recorded as OTHER, since the enum has no transfusion-appropriate value and CELL_THERAPY would misdescribe it.
    - Splenectomy rebound from the generic NCIT:C15329 Surgical Procedure to NCIT:C15328 Splenectomy, matching five other KB entries.
    - Added allogeneic HSCT, luspatercept/mitapivat, and hydroxyurea HbF induction, each cited to the GeneReviews sentence that names it. The HSCT description carries the dominant-specific argument the reviewer identified as the most valuable thing here: gene addition corrects chain imbalance but cannot remove a dominant toxic allele, so allogeneic replacement and allele-directed editing address this subtype in a way beti-cel/exa-cel structurally cannot.

    PHENOTYPES (finding 7).
    - Added Reticulocytosis (HP:0001923), quoting the PMID:7693620 sentence that reports it in the two heterozygotes, and Secondary iron overload (HP:0011031, Abnormality of iron homeostasis), quoting the GeneReviews sentence on transfusion-independent absorption.
    - Jaundice NOT added, against the review. No cited source supports it for this disorder. The only jaundice sentence in any cited cache describes beta-thalassemia major presenting between six and 24 months with pallor, poor weight gain and hepatosplenomegaly, which is a different severity band and a different age group. Quoting it here would be quoting a true sentence for a claim it does not make.

    GENEREVIEWS (finding 8).
    - PMID:20301599 fetched with just fetch-reference, added to references with tags: [GeneReviews], and mined for five evidence items across treatments and phenotypes. Every one is graded INDIRECT, because the chapter describes recessive beta-thalassemia throughout and, for several sentences, prescribes for a severity band rather than for this genotype. The inheritance section still models HP:0000006 and does not cite the chapter's autosomal-recessive sentence.

    ERRORS MADE AND CORRECTED DURING THIS ROUND.
    - An HSCT evidence snippet was written from memory rather than copied from the cache; grep showed no such sentence exists and it was replaced with the real one, which prescribes for beta-thalassemia major and is graded accordingly.
    - HP:0011031 was labelled 'Abnormal circulating iron concentration' from memory; the cached label is 'Abnormality of iron homeostasis'.
    - CHEBI:44423 was labelled 'hydroxycarbamide' from memory; the cached label is 'hydroxyurea'.
    All three were caught before commit by checking the source rather than by a gate.

    NOT TAKEN (suggestions).
    - Heat-instability testing, an HbA2/HbF biochemical section, and BCL11A/HBS1L-MYB modifier loci are all real and all quotable, but each needs its own framing and this push is already large. Left for a following round rather than rushed.
    - The cache/citation ratio improved from 6 cited of 31 to 11 of 31 as a side effect of the above; no pruning was done, deliberately, since the remaining caches are cited by the committed deep-research report.

    Validation: 36/36 snippets verified, up from 27/27; schema, terms, entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, snippet-grading and reference-titles all pass.

  summary: 'Create: Dominant Beta-Thalassemia'
  details: |
    De novo curation of dominant (inclusion body) beta-thalassemia (MONDO:0011381, HBB) from one openscientist deep-research report plus direct reading of every cited reference.

    preflight-dr returned WARN on two counts, both investigated before use. (1) AHSP flagged as a rival gene at 36% of HBB mentions - inspection showed every mention is the alpha-globin chaperone in the mechanism or a listed modifier gene, not a second disease. This is the same false-positive shape as the MDM2 flag on the HLD27 report: the heuristic counts a pathway gene as a rival disease gene. (2) The report cites OMIM 141900 while MONDO:0011381 xrefs OMIM 603902. 141900 is the HBB gene entry rather than the phenotype entry; runoak confirmed MONDO:0011381 carries RO:0004003 HGNC:4827 HBB, is_a beta thalassemia, and the synonym 'inclusion body beta-thalassemia', so identity is correct and the discrepancy is recorded in the entry notes rather than propagated.

    Lump/split: curated separately from the existing Beta_Thalassemia entry because the pathographs differ at the first step - a quantitative deficit with a near-silent heterozygote versus a translated hyperunstable chain that aggregates and poisons the erythroblast. functional_impact_category DOMINANT_NEGATIVE. The two converge downstream and both conform to hemolytic_anemia_erythrocyte_destruction (Oxidative and Membrane Injury, Premature Erythrocyte Destruction).

    Evidence: the dominant-specific steps rest on small human family studies, several decades old, curated HUMAN_CLINICAL without a directness qualifier. Everything downstream of aggregation carries directness: INDIRECT because it comes either from murine recessive beta-thalassemia or from a single patient with a different unstable haemoglobin. Two knowledge gaps record the consequences: unexplained within-family variability (with the authors' own negative result - they checked alpha genes and the beta promoter and found nothing), and the fact that the proteostasis mechanism was characterised for free alpha-globin in the recessive disease rather than for the unstable beta chain that defines this one.

    One evidence item curates a negative result deliberately: the authors' failure to explain phenotypic deviation within families.

    Errors caught by the gates: one reference_title was completed from memory after a truncated terminal read and named the wrong codons; corrected from cache frontmatter. One snippet failed exact matching because the source writes the haemoglobin variant in square brackets, which the matcher strips from the snippet but not the source; re-quoted from a bracket-free span.

    Validation: just validate-disorders clean with 27/27 snippets verified; schema, terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, reference-titles all OK; conforms_to anchors resolve.

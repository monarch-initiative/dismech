  summary: 'Create: Anauxetic dysplasia'
  details: |
    De novo creation of the anauxetic dysplasia entry, the severe end of the cartilage-hair hypoplasia to anauxetic dysplasia (CHH-AD) ribosomopathy spectrum. GeneReviews baseline applied: PMID:22420014 fetched, tagged and mined for clinical characteristics, diagnosis, and management including the AD-specific cervical instability and anaesthesia guidance and the varicella acyclovir instruction. Curated a seven-node pathograph whose organising idea is a two-substrate dissociation of one enzyme: RNase MRP cleaves both rRNA and mRNA, loss of rRNA cleavage tracks the degree of bone dysplasia while loss of mRNA cleavage tracks hair hypoplasia, immunodeficiency, haematological abnormality and cancer risk (PMID:17701897 in vitro correlation). Three genes curated across the RNase MRP complex: RMRP (non-coding RNA component), POP1 (protein subunit, AD2) and NEPRO/C3orf17 (interacting nucleolar partner). NEPRO carries preferred_term only without an HGNC binding because the symbol did not resolve against the HGNC REST API at curation time; this is stated in the gene notes rather than left silent. Seven HPO-bound phenotypes, two diagnosis modes, three treatments, two KNOWLEDGE_GAP discussions (how one enzyme partitions its two substrates; why the growth plate is hit hardest by a ubiquitous ribosome defect). Note: no cartilage-hair hypoplasia entry exists in the KB either, so the CHH-AD spectrum is referenced rather than cross-linked. Validation: just validate passes, 27/27 snippets verified; compliance 82.0 percent global, 82.6 percent weighted.

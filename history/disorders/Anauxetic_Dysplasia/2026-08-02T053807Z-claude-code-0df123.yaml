  summary: 'Edit: Anauxetic dysplasia review response'
  details: |
    Response to three rounds of automated review on PR #7585.

    Round 1 (nine findings): committed the falcon deep-research artifact after an NEC preflight against MONDO:0011773; mined the GeneReviews GENETIC COUNSELING section for the 25/50/25 recurrence risk plus carrier and prenatal/PGT testing; curated the live-vaccine avoidance instruction for individuals with abnormal immunologic function or SCID; added haematopoietic stem cell transplantation as CELL_THERAPY (NCIT:C15431) with a target_mechanisms link to the haematopoietic node; added six phenotypes; bound NEPRO to hgnc:24496 and removed the notes sentence claiming the symbol did not resolve, which checked the HGNC REST API rather than the OAK sqlite:obo:hgnc adapter dismech actually validates against; modelled AD1/AD2/AD3 as has_subtypes with verified MONDO terms and dropped the inaccurate 'anauxetic dysplasia 1' synonym from a lumped entry; cited the two previously orphaned cached PMIDs at the nodes they bear on; and converted the cached ribosomopathy counter-evidence into gap_anauxetic_is_it_really_a_ribosomopathy.

    Rounds 2 and 3 (three findings, addressed here): extraskeletal phenotypes are now explicitly labelled SPECTRUM-LEVEL rather than presented as flat anauxetic features. Immunodeficiency, Anemia, Malabsorption, Aganglionic megacolon and Neoplasm each carry a description stating that the association is documented for the CHH-AD spectrum as a whole and concentrates at the cartilage-hair-hypoplasia end, and each evidence item is downgraded from SUPPORT to PARTIAL with an explanation naming the scope mismatch. The Malabsorption claim that the gut is a genuine target organ is removed. A disease-level attribution rule states the policy once. The Hypodontia phenotype, whose evidence snippet did not mention teeth, is replaced by Dental anomalies (HP:0000164) sourced to Remmelzwaal 2023 (DOI:10.1002/ajmg.a.63316), newly fetched and cached, which documents dental anomalies directly; the same source adds Craniosynostosis (HP:0001363) and NEPRO-specific corroboration of atlantoaxial subluxation. The references block now lists all six PMIDs plus the new DOI rather than two of six.

    Short-snippet lint: CI runs check_snippet_length.py with --against-ref origin/main, where grandfathering is unavailable, so a file that is new relative to main has every short snippet flagged rather than baselined. Two were caught, both bare terms lifted from a single GeneReviews sentence: 'fine, silky hair' (Fine hair) and 'increased risk for malignancy' (Neoplasm). Both, plus the six-word Immunodeficiency snippet that passed the lint, are replaced by the full sentence they were cut from: 'Other findings include joint hypermobility, fine, silky hair, immunodeficiency, anemia, increased risk for malignancy, gastrointestinal dysfunction, and impaired spermatogenesis.' This reinforces the spectrum-level attribution work above, because the full sentence carries the source's own framing of these as findings of the CHH-AD spectrum disorders, which the bare terms hid.

    Validation: schema clean, term validation passed, 49/53 snippets verified by the default reference validator and 53/53 with --unskip-prefix DOI (the four DOI snippets are skipped by prefix in the default configuration and were verified by whitespace-normalised substring match against the cached abstract).

  details: |
    Removed HP:0005406 (Recurrent bacterial skin infections) from Secondary bacterial skin infection and retained preferred_term with documented live HPO OLS4/OAK lookup results showing no HPO term for non-recurrent secondary bacterial skin coinfection without adding unverified recurrence, unusual pathogen, or subtype claims. Removed CL:0000545 (T-helper 1 cell) from Th2/Treg-Skewed Immune Response with PD-1/PD-L1 Upregulation and relocated the experimental Fonsecaea pedrosoi NLRP3/caspase-1/IL-18 study (DOI:10.1371/journal.pone.0322127) from Melanin-Mediated Resistance to Macrophage Killing onto the Th2/Treg exhaustion node as contrasting INDIRECT MODEL_ORGANISM evidence. Added INDIRECT IN_VITRO evidence from PMID:1543672 correlating ergosterol biosynthesis inhibition with growth arrest across pathogenic fungi to the causal edge from Chromoblastomycosis Ergosterol-Dependent Plasma-Membrane Organization to Dimorphic Transformation into Melanin-Rich Muriform (Sclerotic) Bodies.

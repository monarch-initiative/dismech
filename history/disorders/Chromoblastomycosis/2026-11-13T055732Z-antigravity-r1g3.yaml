  summary: Address PR 17277 review feedback by splitting compound pathophysiology
    nodes, rebinding histopathology to NCIT:C35978, repairing background grading,
    and expanding agents and complication phenotypes
  details: |
    Split Epidermal Hyperplasia and Progressive Dermal Fibrosis into Pseudoepitheliomatous Epidermal Hyperplasia (CL:0000312, UBERON:0001003, GO:0008283) and Dermal and Subcutaneous Fibrosis (CL:0000057, UBERON:0002067/UBERON:0002072, GO:0030198, granuloma_formation conformance), and split Ineffective Macrophage Clearance and Th2/PD-1 Immune Persistence into Melanin-Mediated Resistance to Macrophage Killing and Th2/Treg-Skewed Immune Response with PD-1/PD-L1 Upregulation (adding direct IL-10 and Th2/Treg quotes from DOI:10.3390/jof9121172 and removing the unsupported DECREASED Th1 modifier). Connected Chromoblastomycosis Ergosterol-Dependent Plasma-Membrane Organization to muriform persistence so the pathograph forms one connected component. Rebound Suppurative Granulomatous Dermal Infiltrate with Muriform Bodies from neoplastic NCIT:C36059 to non-neoplastic NCIT:C35978 (Inflammatory Infiltrate, reachable within HistopathologyFindingTerm whereas NCIT:C3064 sits outside NCIT:C83490), repaired HUMAN_CLINICAL background grading on DOI:10.1371/journal.pone.0322127 and DOI:10.3390/jof9020224 while adding PMID:20711281 biopsy evidence to Cutaneous granuloma, added Fonsecaea monophora, Fonsecaea nubica, Phialophora verrucosa, and Rhinocladiella aquaspersa to infectious_agent, added Squamous cell carcinoma (HP:0002860) and Secondary bacterial skin infection (HP:0005406) phenotypes, adjusted Pruritus to FREQUENT (10/13 = 77%), changed Cryosurgery modality to SURGERY, and noted salvage modalities in notes.

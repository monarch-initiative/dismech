  summary: 'Create: Hereditary_Folate_Malabsorption'
  details: |
    New entry for hereditary folate malabsorption (MONDO:0009238, SLC46A1/PCFT),
    taken from the stub queue (stub deleted in this change; nominated by the
    genetics-gap scan in issue 12282).

    Deep research: one claude_code report
    (research/Hereditary_Folate_Malabsorption-deep-research-claude_code.md).
    Its reference validation resolved 40/40 identifiers; one reference,
    PMID:28687492, was flagged off topic with an unsupported quote (the report
    itself notes the intended paper is PMID:28685492). PMID:28687492 is not
    cited; PMID:28685492 was fetched and read directly. The two term-validation
    "mislabelled" rows are the report writing the prefix (MONDO, DOID) as the
    label, not wrong bindings. preflight-dr returned WARN only for FOLR1
    mentions, which are the FRalpha-PCFT choroid plexus interaction and the
    FOLR1-CFTD differential, not a second disease.

    Baseline: the GeneReviews chapter (PMID:20301716) is tagged and its
    clinical characteristics, diagnostic criteria, agents to avoid (folic
    acid, phenytoin, valproate) and sib-testing advice are all carried. The
    Zhao/Aluri/Goldman 2017 review (PMID:27664775, PMC full text) supplies the
    mechanism chain (intestinal and choroid plexus transport defects, dual
    BBB/CSF brain folate deficiency, B- and T-cell immune defect).
    Frequencies come from a 2016 literature review (PMID:27938595); it counts
    37 reported cases, but its percentages are multiples of 1/11 or 1/22, so
    far fewer cases had data per feature and the figures are imprecise.

    Pathograph: SLC46A1 loss of function branches to impaired intestinal
    absorption (to systemic folate deficiency, then impaired one-carbon
    metabolism, then megaloblastic ineffective hematopoiesis and combined
    immune dysfunction) and to impaired choroid plexus transport; both feed
    cerebral folate deficiency. 22 of 28 phenotypes are causally connected;
    serum and CSF folate are modelled as readouts of their nodes rather than
    as caused phenotypes.
    Edges carry their own evidence where a source states the causal step;
    the one-carbon to marrow and immune edges are left uncited because the
    supporting quotes are background statements of folate biochemistry.
    The Pcft knockout mouse (PMID:21346251) is linked to the hematopoiesis
    and absorption nodes.

    Validation: just validate passed (schema, terms, 100 snippets);
    count-verified-snippets all verified; check-genereviews TAGGED;
    entity-refs, causal-targets, logical-rules, coarse-phenotypes,
    snippet-length, title-snippets, reference-titles, snippet-grading,
    enum-values and duplicate-keys clean. Two reference_title strings were
    first written from truncated PubMed esummary output and caught by the
    validator; both were replaced with the cached titles.

    Pre-PR red-team review (fresh-context subagent) found nothing blocking.
    Changes made in response: phenotype frequencies no longer described as
    coming from 37 cases; the respiratory-infection frequency rebound from
    HP:0002719 Recurrent infections to HP:0011947 Respiratory tract
    infection, which is what the quoted figure measures; human evidence added
    to the marrow node and edge so the mouse is not the only support; IgA
    deficiency recorded separately because low IgA persisted after folate
    repletion in PMID:19740703; folate lab values moved to reports_on;
    feeding difficulties, selective IgA deficiency and GeneReviews pregnancy
    guidance added; the folinic-acid-to-CNS mechanism softened to
    "incompletely understood", since no source states the route.

    PR review response (automated reviewer, changes requested): the
    systemic-folate-deficiency edge to Feeding difficulties was removed. It had
    been inserted between the Stomatitis edge and that edge's evidence, so the
    stomatitis quote was sitting on the wrong edge; no source states poor
    feeding as a direct consequence of folate deficiency. Added the GeneReviews
    sibling recurrence-risk sentence to the inheritance block, a neutropenia
    phenotype (PMID:36045837) linked from the marrow node, and
    therapeutic_modality on the anti-seizure treatment. Not added: a sequela
    edge from thrombocytopenia to pulmonary hemorrhage, because PMID:35773682
    states the cause of the hemorrhage could not be confirmed.

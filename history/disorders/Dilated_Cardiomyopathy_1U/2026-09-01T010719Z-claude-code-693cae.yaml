  summary: 'Create: Dilated Cardiomyopathy 1U (MONDO:0013371, PSEN1) curated as a
    ClinGen-Disputed locus'
  details: |
    New standalone Disease entry for the OMIM/MONDO locus CMD1U, curated explicitly as contested.

    Lump/split decision: DISEASE. The KB already holds fifteen numbered dilated-cardiomyopathy loci as standalone entries, and Dilated_Cardiomyopathy_1EE is direct precedent for curating one whose ClinGen classification is weak. OUT_OF_SCOPE was rejected because deleting the stub would delete the dispute and leave MONDO:0013371 for the next curator to take at face value.

    Gene-disease validity is the headline. ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel classifies PSEN1 - dilated cardiomyopathy 1U (curated against this exact MONDO term) as Disputed: first evaluated 2020, re-evaluated under SOP10 in May 2025 with no change, report dated 2026-03-04. genetic[].relationship_type is DISPUTED rather than CAUSATIVE, and the classification is recorded both there and in an external_assertions block following the GJB3 / Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2B pattern. The panel's own 'does not provide convincing human genetic evidence in support of or refuting' sentence is quoted so the verdict is not read as a refutation.

    The ClinGen CSV pin in data/clingen/MANIFEST.yaml is stale, so 'just clingen-refresh' aborts on a checksum mismatch (issue #10081, expected drift). Worked around by downloading the current CSV to data/clingen/gene_validity.csv (gitignored) and running the rebuild directly, which does not verify the pin. Only the one PSEN1 cache file was generated.

    Named entity confusion. PSEN1 carries an overwhelming neuronal amyloid literature and dismech already curates it in four other diseases, none of them this one. preflight-dr PASSed (68 PSEN1 mentions, correct OMIM). Every citation was then checked by hand to be about heart tissue, heart cells, or a cardiomyopathy cohort. Three decoy classes were identified and excluded: APP/PS1 double-transgenic cardiac studies (Alzheimer models, diastolic phenotype), AD-CVD shared-genetics and Mendelian-randomisation literature, and neuronal gamma-secretase mechanism work. Two in-heart negative results are curated to keep the amyloid cascade out: no amyloid-beta difference in idiopathic dilated cardiomyopathy myocardium versus controls, and no Abeta42/Abeta40 shift from D333G in HEK293 cells. PMID:33500337 was fetched in error (a Lactobacillus paper, not Jordan 2021) and deleted rather than cited.

    Mechanism discipline. The entire causal chain is held inside one ALTERNATIVE mechanistic hypothesis, psen1_calcium_handling_dcm, because both of its supports come from the wrong cell or the wrong genotype: carrier calcium signalling was measured in skin fibroblasts, and the presenilin-1/SERCA2a co-immunoprecipitation came from idiopathic cases carrying promoter variants. Recorded as a HUMAN_MODEL_MISMATCH discussion with an isogenic iPSC-cardiomyocyte experiment that would settle it. The murine Psen1 conditional knockout is curated in animal_models with PARTIALLY_RECAPITULATES / LOW fidelity, and its limitations state the three gaps explicitly, including that its functional phenotype is diastolic dysfunction with reduced ventricular volume - the opposite direction from the human entity.

    Controlled values were left absent rather than forced in four places: no functional_impact_category on the D333G genetic_context (neither loss nor gain of function has been shown in cardiac tissue), no modifier direction on the calcium node beyond DYSREGULATED (the sources say altered), no FrequencyEnum band on either phenotype (the HPO annotations for this MONDO term all derive from three relatives in one paper), and no penetrance_percentage on inheritance.

    gnomAD v4 was queried directly to check ClinGen's population-frequency argument: p.Asp333Gly sits at 2.1e-05 exome / 2.3e-04 genome allele frequency, corroborating the panel. Recorded in notes as a database lookup, not cited as evidence.

    Validation: just validate, validate-terms, check-entity-refs and check-duplicate-keys all exit 0; 41/41 snippets verified against the cached references.

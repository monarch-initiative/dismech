  summary: 'Address ai4c-reviewer findings on PR #10327: evidence_source regrading,
    three unused references consumed, GeneReviews snippet reuse'
  details: |
    Response to the automated review on PR #10327. All five IMPORTANT findings were checked against the sources before acting; all five were correct and all five were fixed.

    1. evidence_source regrading. Four items graded HUMAN_CLINICAL were measurements in cultured cells or biochemical assays: the Li 2006 skin-fibroblast calcium result (two instances), the Gianni PS1/SERCA2a co-immunoprecipitation, and the applied-oligomer myocyte experiment. All four are now IN_VITRO per the CLAUDE.md classification rules, and the explanations say why. The reviewer's observation that this was internally contradictory is right: the HUMAN_MODEL_MISMATCH discussion argued at length that the fibroblast result is a surrogate readout while the grading called it clinical evidence. Both fibroblast instances were regraded together, so check-snippet-grading stays green.

    2. PMID:21524270 consumed. The Drosophila dPsn cardiac study was fetched and cited nowhere, and the reviewer is right that it is the strongest independent support for this entry's own hypothesis. Added as an animal_models entry with modeled_mechanisms targeting the calcium node, PARTIALLY_RECAPITULATES / LOW fidelity, two readouts: dSERCA and dIP3R transcript abundance (direction ALTERED, since the two move in opposite directions) and end-diastolic vertical dimension (INCREASED). It is the only in vivo system where the calcium arm and a dilating heart were observed together, and the only place in the presenilin cardiac literature giving the dilated direction the mouse knockout does not. Limitations state the four gaps: a tubular fly heart is not a ventricle, the manipulation is knockdown/overexpression rather than the missense allele and the two directions give opposite effects, the calcium finding is transcript abundance rather than pump activity, and dSERCA is not SERCA2a.

    3. PMID:21656036 cited. Two notes blocks recited this study's exact statistics without a reference attached. It is now an evidence item on the gene-validity discussion, graded HUMAN_CLINICAL / INDIRECT, and the notes were rewritten to explain the curation decision rather than to restate figures. It remains out of the genetic section: a single unreplicated candidate-gene association at P = 0.039 is a different claim from a monogenic locus.

    4. GeneReviews snippet reuse. The purpose-item-3 fragment appeared on a pathophysiology node, a diagnosis entry and a treatment. It stays on the diagnosis entry, where it fits. The treatment now cites purpose item 4, which is actually about surveillance of at-risk relatives. The pathophysiology node now cites the Sorella guideline systematic review for cross-guideline consensus on the disease definition and imaging, marked INDIRECT.

    5. DOI:10.1093/ehjqcco/qcae109 consumed, plus the treatment gaps it exposed. Added a diagnosis entry for natriuretic peptide, troponin and multimodality imaging, and an Implantable Cardioverter-Defibrillator treatment (therapeutic_modality DEVICE, NCIT:C80435) framed around the review's own finding that prophylactic defibrillator criteria are an area of variation between guidelines. therapeutic_agent added to the guideline-directed pharmacotherapy: ACE inhibitor, angiotensin receptor-neprilysin inhibitor and SGLT2 inhibitor, with the treatment now citing the 2022 AHA/ACC/HFSA heart failure guideline. Beta-blockers are named in the description but deliberately not given a therapeutic_agent, because the configured NCIT build has no verifiable drug-class term for them - a wrong CURIE would be worse than an absent one.

    Suggestion 8 chased and found: PMID:38851626, PSEN1 delta-exon-9 patient iPSC-derived cardiomyocytes against isogenic controls, showing an SR calcium leak resistant to ryanodine- and IP3-receptor blockade. Added as an experimental_models entry (IPSC_DERIVED_MODEL) with two readouts including the UNCHANGED electrophysiology negative, and cross-referenced from the tissue-mismatch discussion. The discussion now says explicitly that this narrows the mismatch without resolving it, because delta-exon-9 is an Alzheimer allele and the donors were dementia patients.

    Suggestions declined, with reasons recorded in the PR reply: the NCIT surveillance binding stays NCIT:C15747, because searching the configured NCIT build surfaced no clinical-action term for cardiac surveillance and the alternatives are epidemiological-programme concepts; and HP:0012664 and HP:0003115 are still not curated, because the Li 2006 abstract - the only cached text, the publisher blocking full text - mentions neither ejection fraction nor electrocardiography, so neither phenotype has a quotable source. The notes now give that narrower reason rather than the frequency-data one the reviewer correctly said did not exclude them.

    One snippet had to be replaced for a tooling reason rather than a content one: the sentence describing the calcium leak's functional consequence contains bracketed calcium notation, which the reference validator strips before matching, so it cannot be snippet-verified. The claim is stated in prose and a bracket-free conclusion sentence is quoted instead.

    Validation after the changes: just validate, validate-terms, check-entity-refs, check-duplicate-keys and validate-disorders all exit 0; 51 of 54 snippets verified, the 3 skipped being DOI-prefixed and hand-checked against the cache. All five whole-KB gates exit 0, and the model-readout, entity-ref and conforms_to pytest lanes pass.

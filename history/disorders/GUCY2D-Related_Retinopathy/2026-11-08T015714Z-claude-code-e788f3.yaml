  summary: Cite current GeneReviews LCA/EOSRD Overview; record why the retired chapter
    stays
  details: |
    Issue #16018 worklist named PMID:30285347 (Nonsyndromic Leber Congenital Amaurosis / Early-Onset Severe Retinal Dystrophy Overview) as the title-matched replacement for the retired Leber Congenital Amaurosis chapter (PMID:20301475), which this entry quotes in four phenotype blocks. Fetching PMID:30285347 shows it is an Overview-format chapter: PubMed publishes only its six-point statement of purpose, so the cache holds no clinical characteristics and no sentence that could support a phenotype claim (the #11848 case). The replacement named in the worklist therefore cannot carry the four snippets. Resolution: cite and tag the current chapter in references so the entry is no longer on a retired-only GeneReviews baseline, keep the four snippets on the retired chapter, and record the reasoning in the entry notes. check-genereviews moves from TAGGED_RETIRED to TAGGED_OVERVIEW, which is accurate and non-gating. Also added a current non-retired source for the nystagmus phenotype (PMID:38278208, quoted from its LCA/EOSRD section), reducing that block's sole dependence on the retired chapter; the quote was checked against the same paper's achromatopsia section, which carries a near-identical nystagmus sentence, to avoid citing the wrong disease.

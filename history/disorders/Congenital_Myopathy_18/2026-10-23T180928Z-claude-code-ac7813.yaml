  summary: 'Create: Congenital_Myopathy_18'
  details: |
    New entry for congenital myopathy 18 (MONDO:0859514, OMIM 620246 by the
    MONDO cross-reference), the CACNA1S (Cav1.1, DHPR alpha1S) congenital
    myopathy, curated as a single DISEASE entry from the stub. Both autosomal
    recessive and autosomal dominant (including de novo) inheritance are
    recorded with separate evidence; no subtypes, because MONDO has none and
    the sources describe one severity continuum rather than named forms.

    The pathograph runs from reduced Cav1.1 protein to impaired
    depolarization-induced sarcoplasmic reticulum calcium release, reduced
    contractile force, and three organism-level nodes (congenital generalized
    weakness, fetal hypokinesia, respiratory muscle weakness), with a
    structural branch (triad and SR abnormality, myofibrillar disorganization)
    and a nonspecific myopathic-remodeling node feeding the biopsy phenotypes.
    24 of 25 phenotypes are reached by a causal edge; episodic flaccid
    weakness (one family) is left unconnected because no source explains it.
    Frequencies come from the 2023 systematic review of 24 patients
    (PMID:37510268).

    Primary sources: Schartner et al. 2017 (PMID:28012042), the Turkish
    homozygous family (PMID:31227654), Hunter et al. 2015 (PMID:26247046),
    the Ravenscroft et al. fetal akinesia cohort (PMID:33060286), the prenatal
    FADS case (PMID:38111203), the Jordanian sisters (PMID:38426167), the
    Iranian homozygous siblings (PMID:39104734), the zebrafish models
    (PMID:37930228), the Holstein calf reports (PMID:39551494, PMID:42411118)
    and the iPSC lines (PMID:40885023). Literature was gathered by PubMed
    search and cross-checked against an OpenScientist deep-research report
    (research/Congenital_Myopathy_18-deep-research-openscientist.md: 17/17
    references resolved, 3 mislabelled terms, none of which were bound;
    preflight-dr PASS with CACNA1S mentioned 62 times and OMIM 620246
    matching). From the report, PMID:29193480 (p.Arg528Leu rhabdomyolysis)
    and PMID:40018084 (exertional myalgia) were read and kept out of scope as
    later-onset allelic phenotypes; the malignant hyperthermia references
    (PMID:42189464, PMID:41300733) were not used because they concern MHS
    genetics generally, not reactions in this cohort.

    Schartner's "decrease in protein level" clause is graded IN_VITRO in
    Centronuclear_Myopathy, and the abstract does not say where protein was
    measured, so the reduced-protein claim here is cited to the 2023 review's
    synthesis sentence instead.

    No GeneReviews chapter (check-genereviews NO_CHAPTER) and no ClinGen
    validity record for this disease. Validated with just validate,
    count-verified-snippets (all verified), check-entity-refs,
    check-causal-targets, check-snippet-grading and validate-disorders.

  summary: 'Review round 1: Congenital_Myopathy_18'
  details: |
    Bound GO:0008331 high voltage-gated calcium channel activity (modifier DECREASED) as the molecular function on the Reduced Cav1.1 Protein in Skeletal Muscle node, following the CACNA1S binding in Hypokalemic_Periodic_Paralysis, with a background evidence item from PMID:37510268 describing Cav1.1 as a voltage-gated calcium channel and voltage sensor for SR calcium release; this clears the gene activity grounding gate without a baseline entry. Added quote_role REVIEW_SYNTHESIS to the PMID:37510268 type 1 fiber predominance item, which summarizes another group's patients. The neonatal hypotonia explanations now say that the VERY_FREQUENT frequency rests on the founding cohort (PMID:28012042, perinatal hypotonia in all 11 patients) and that the review's 20 of 24 figure is onset age, not hypotonia. Added a notes sentence that CACNA1S is the MHS5 susceptibility gene, that no malignant hyperthermia reaction is reported in this patient group, and that the cited sources give no myopathy-specific anaesthesia guidance.

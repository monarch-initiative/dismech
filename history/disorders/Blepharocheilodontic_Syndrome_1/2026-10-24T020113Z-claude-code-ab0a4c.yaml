  summary: 'Create: Blepharocheilodontic Syndrome 1'
  details: |
    New entry for blepharocheilodontic syndrome 1 (MONDO:0054740), the CDH1-associated form of BCD syndrome, replacing its curation stub. A first pass was built from PubMed (E-utilities search for blepharocheilodontic, CDH1 cleft and CDH1 mechanism papers) and then reconciled against the openscientist deep-research report research/Blepharocheilodontic_Syndrome_1-deep-research-openscientist.md. That report resolved 27 of 27 references; two of its quotes did not match the cited abstracts (PMID:11476703, where the report joined two abstract sections into one quote, and PMID:26123647, where the validator's closest-match text reads identically, so the difference is probably the non-ASCII theta), and two references were flagged off topic (PMID:38132417, an oligodontia syndrome review, and PMID:25010141, a hair follicle placode paper); none of those quotes was reused, PMID:26123647 is cited with different, verified snippets, and neither off-topic paper is cited. Its term suggestions were not used: it gave HP:0100660 (Dyskinesia) for euryblepharon, HP:0100698 (Subcutaneous neurofibroma) for lagophthalmos and HP:0002225 (Sparse pubic hair) for distichiasis; the entry binds HP:0012905, HP:0030001 and HP:0009743 instead, looked up in OLS. The report's Orphanet prevalence figure (below 1 in 1,000,000, ORPHA:1997) was not used because the ORPHA prefix was unresolved and no Orphanet record was cached, and its beta-catenin and Wnt branch was not encoded because the report itself describes it as inferred from cancer biology. PMID:32483297, which the report cites as confirming cancer risk, cached with no quotable text and is recorded in notes as a lead rather than cited. just preflight-dr could not run because the local MONDO build is absent (exit 2, by design); disease identity was checked by hand instead: the MONDO record (OLS) carries OMIM:119580 and synonyms naming CDH1, and the report names CDH1 throughout and cites OMIM 119580. Skeleton synonyms were checked against MONDO: Elschnig syndrome is a synonym of the parent MONDO:0007339, not of BCDS1, and blepharo-cheilo-dontic syndrome 1 is not a MONDO synonym, so both were dropped; MONDO's two descriptive synonyms were added, and CDH1-related blepharocheilodontic syndrome was kept because it is the wording of the PMID:32302040 title. just check-genereviews --online reports NO_CHAPTER for GeneReviews and StatPearls. No ClinGen gene-disease validity record exists for CDH1 and BCDS1, so gene_disease_validity is absent. Validation: just validate, just validate-terms, just count-verified-snippets (89/89), check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-reference-titles and the validate-disorders gate all passed.

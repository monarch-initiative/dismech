  summary: Add metformin mTOR-targeted chemoprevention for oral premalignant lesions
  details: |
    Added a Metformin mTOR-Targeted Chemoprevention treatment for oral premalignant lesions, motivated by the NCI TACPAD meeting report (Miller & Mohammed, J Cancer Prev 2023;28:24-28, DOI 10.15430/JCP.2023.28.1.24) used as a lead source only. Evidence taken from the PRIMARY trial Gutkind et al., JCI Insight 2021 PMID:34255745 NCT02581137, a single-arm phase IIa trial of metformin in oral premalignant lesions. Treatment carries therapeutic_modality SMALL_MOLECULE, therapeutic_agent metformin CHEBI:6801, and two target_mechanisms edges: INHIBITS PI3K-AKT-mTOR Pathway Activation and INHIBITS Field Cancerization and Premalignant Progression, each with a verified snippet. Validated with just validate, just validate-terms, and the batched just validate-disorders sweep 40/40 snippets over both files. No causal snippet was drawn from the secondary meeting report.

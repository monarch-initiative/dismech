  summary: 'Fix: Rename Alcohol Consumption to Ethanol Exposure (ECTO:9000027 retained)'
  details: |
    Renamed the 'Alcohol Consumption' environmental entry to 'Ethanol Exposure', retaining
    its ECTO:9000027 (exposure to ethanol) binding, as part of resolving the duplicate-name
    CURIE conflict in issue #8469.

    The conflict was that six entries shared the name 'Alcohol Consumption' across two
    CURIEs, so the binding was no longer derivable from the curated text and no audit could
    distinguish a deliberate distinction from a mistake. The fix makes one name-based rule
    govern both the smoking and alcohol pairs: bind the term the entry's own name states.

    This entry's curated mechanism is explicitly chemical -- 'Ethanol is metabolized to
    acetaldehyde, a Group 1 carcinogen that damages DNA and impairs repair' -- so the
    chemical term (ECTO:9000027, which involves CHEBI ethanol) is correct and the name
    was brought into line with it rather than the binding being changed. Binding
    rationale recorded in the entry's notes slot.

    No CURIE change, and no evidence items were added, removed, or re-quoted.

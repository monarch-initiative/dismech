  summary: 'Compliance: cite and pathograph-link all three environmental exposures'
  details: |
    Weekly compliance pass focused on environmental exposure evidence. Tobacco Use and Ethanol Exposure were both bound to ECTO terms but carried no evidence at all, and none of the three environmental entries had influences_mechanisms, so every exposure in this cancer entry sat outside the pathograph. Cited tobacco and ethanol from PMID:19190158 (INHANCE pooled analysis, 17 studies, 11221 cases: population attributable risk 33 percent tobacco alone versus 4 percent alcohol alone; greater-than-multiplicative joint effect psi 2.15; oral cavity subsite PAR 64 percent, recorded as PARTIAL because it also shows about a third of oral cavity cancers are attributable to neither). Cited the ethanol entry's acetaldehyde mechanism claim from PMID:29303995 using the ALDH2 natural experiment, which separates acetaldehyde from ethanol as the operative carcinogen. Added influences_mechanisms links from all three exposures to Field Cancerization and Premalignant Progression, with different causal_link_type and environmental_effect values reflecting how each acts: tobacco TRIGGERS via unknown intermediates, ethanol EXACERBATES, areca nut TRIGGERS via the known intermediate of oral submucous fibrosis. All 28 snippets verify. Weighted compliance 72.3 percent to 76.2 percent.

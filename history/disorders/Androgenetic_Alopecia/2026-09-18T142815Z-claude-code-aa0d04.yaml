  summary: 'Create: Androgenetic Alopecia (MONDO:0005339)'
  details: |
    New entry curated from the Edison Falcon deep-research report research/Androgenetic_Alopecia-deep-research-falcon.md (16/16 references and 14/14 terms resolved; preflight-dr returned SKIP because MONDO records no causal gene, so disease identity was checked by hand), with report DOIs resolved to PMIDs through the PMC ID converter and all snippets quoted from cached abstracts. Eleven-node pathograph: polygenic susceptibility at the AR/EDA2R locus and autosomal risk loci, regional androgen sensitivity of frontal and vertex follicles, testosterone-to-DHT conversion in the dermal papilla, DHT-androgen receptor signalling, androgen-driven paracrine inhibitory output (TGF-beta, DKK1, IL-6), prostaglandin D2 elevation, Wnt/beta-catenin inhibition with impaired progenitor conversion, premature dermal papilla senescence, anagen shortening, progressive follicular miniaturization, and perifollicular microinflammation and fibrosis. Lump/split: one disease with two sex-patterned presentations as has_subtypes; male pattern hair loss bound to MONDO:0800201, female pattern hair loss left unbound because MONDO has no term (searched female pattern hair loss and female androgenetic alopecia). The claim was keyed on the OMIM locus term MONDO:0007184 (AGA1), which is mapped as a narrowMatch under mappings rather than curated as a separate disease, so the stub is retired by this entry. No module conformance: the hair-follicle modules describe developmental or adhesion mechanisms, and cellular_senescence was considered for the dermal papilla senescence node but rejected because that finding is an in vitro observation. AR recorded as SUSCEPTIBILITY with polygenic inheritance. Treatments (minoxidil, finasteride, dutasteride, spironolactone, low-level laser, platelet-rich plasma, transplantation) are linked into the pathograph with target_mechanisms. Animal models recorded with their limitations. No GeneReviews chapter exists. Validated: just validate passed; count-verified-snippets 157/157; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys passed; pytest -k Androgenetic_Alopecia passed. A first attempt at this curation was cut off by a session limit before writing; this record describes the completed second pass.

  summary: 'Create: Arthrogryposis, Cleft Palate, Craniosynostosis, and Impaired Intellectual
    Development (ACCIID, PPP3CA gain of function)'
  details: |
    New Mendelian entry for MONDO:0032642 (ACCIID), kept separate from CN_Related_DEE (DEE91) because MONDO, OMIM and Orphanet split them and the defining study (PMID:29432562) shows opposite functional effects in yeast. Deep research: claude_code provider (research/Arthrogryposis_Cleft_Palate_Craniosynostosis_And_Impaired_Intellectual_Development-deep-research-claude_code.md); all 11 report references resolved; the one off-topic reference (PMID:33338510, osteoclast phosphatase review) was not cited. Evidence comes from the Mizuguchi 2018 abstract, the Orphanet ORPHA:565858 record (fetched with just fetch-reference), the Rydzanicz 2019 full text (PMID:30254215) and the Castiglioni 2024 full text (PMID:39707491). Phenotypes listed only in the HPO annotation file (hydrops, hydronephrosis, vesicoureteral reflux, trigonocephaly) were not added because no cached source quotes them; the Orphanet 'renal abnormalities' row is bound to HP:0000077 with coarse_binding_basis SOURCE_UNSPECIFIED. Pathograph: PPP3CA AI-domain gain of function (GO:0033192 calmodulin-dependent protein phosphatase activity, INCREASED) to increased calcineurin-mediated signaling (GO:0097720) to each phenotype. just preflight-dr was not run because no local MONDO build is available. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validated with validate, validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-snippet-length, check-title-snippets and check_gene_activity_grounding --against-ref origin/main.

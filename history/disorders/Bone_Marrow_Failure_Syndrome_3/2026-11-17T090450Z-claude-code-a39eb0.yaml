  summary: 'Create: Bone Marrow Failure Syndrome 3 (DNAJC21)'
  details: |
    New entry for bone marrow failure syndrome 3 (MONDO:0014887), the DNAJC21 ribosomopathy of the Shwachman-Diamond spectrum.

    Deep research: one openscientist run, research/Bone_Marrow_Failure_Syndrome_3-deep-research-openscientist.md. Its reference_validation reports 15/15 references resolved and 19/19 quotes valid, confabulation_rate 0.0. Its term_validation set needs_review with sixteen mislabelled CURIEs. Twelve are an artefact of the report putting a frequency word ('Common', 'Core', 'Variable') where the label belongs, and those HP identifiers are correct. Four are wrong codes naming unrelated concepts: NCIT:C15360 offered as Blood Transfusion is Adjuvant Chemotherapy, NCIT:C1512 offered as Granulocyte Colony-Stimulating Factor is Immunoconjugate, NCIT:C92216 offered as Enzyme Replacement Therapy is Seminal Vesicle/Coagulating Gland, and NCIT:C15280 offered as Antibiotic Therapy is Breast Conservation Treatment. None of the four was bound; every term in the entry was looked up in OLS.

    The name is a serial number that does not say which gene, which is the case CLAUDE.md warns about for this disease class. The notes state plainly that this entry is the DNAJC21 disease and carry the gene-named synonyms.

    GeneReviews: the only hit for DNAJC21[TIAB] AND genereviews[book] is PMID:20301722, the Shwachman-Diamond Syndrome chapter. It is a gene-scoped candidate rather than a baseline: its cached abstract does not mention DNAJC21 anywhere, so there is nothing in it to cross-reference or quote for this disease. The phenotype baseline is the phenotype-refinement series (PMID:29700810) and the founding cohort (PMID:27346687). The chapter is nonetheless tagged GeneReviews in references, because the tag records the source type and the chapter genuinely is one for a gene of this spectrum; no claim is cited to it. My first draft left it untagged and said so in notes, which check-genereviews reported as CITED_UNTAGGED, since it keys on the identifier appearing in the file rather than on the prose explaining it. That behaviour is dismech#12329, where I added this case as a data point.

    Treatments are deliberately sparse: only the surveillance checklist the phenotype-refinement series actually provides is recorded. The supportive measures the deep-research report lists (transfusion, G-CSF, pancreatic enzyme replacement, infection prophylaxis, transplantation) are the standard management of inherited bone marrow failure in general, with no BMFS3 source behind them, so recording them would assert more than the literature supports. The notes say so.

    NCIT has no clinical-action term for surveillance. NCIT:C15719 Surveillance is a study type under Clinical Study and is not reachable from NCIT:C25218; Patient Monitoring (NCIT:C53607) and Follow-Up Care (NCIT:C116570) are not either, which I confirmed by walking each one's hierarchicalAncestors in OLS. NCIT:C15419 Disease Screening is the nearest action term that is reachable, and is bound with the specific activity in preferred_term. My first attempt used NCIT:C25637 written from memory, which is Reaction; the term validator caught it.

    Four mechanism edges rest on the zebrafish model rather than on patients and carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT: the nucleotide-metabolism finding, the neutrophil arm of the cytopenia, and the route to myeloid neoplasia, which in the model required a deliberately introduced biallelic tp53 mutation rather than arising on its own. A HUMAN_MODEL_MISMATCH discussion records that the nucleoside rescue is the only reported intervention that corrects any DNAJC21 phenotype and that no nucleotide measurement has been published from a patient, with a proposed organoid measurement against it.

    The zebrafish gene binding was wrong in the first draft and was caught by the gate rather than by me: I wrote ZFIN:ZDB-GENE-040426-1716 from memory, which check-gene-namespaces-online resolved to rps19. The correct identifier, ZFIN:ZDB-GENE-030131-8928, was taken from NCBI Gene 336984's ZFIN cross-reference and the gate now passes.

    Validation: just validate passes (40/40 snippets), check-gene-namespaces-online passes, and the per-file and whole-tree gates pass. GO:0003723 RNA binding was bound on the lesion node for check-gene-activity-grounding, taken from DNAJC21's own GO annotations and matching the entry's statement that the protein associates with rRNA.

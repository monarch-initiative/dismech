  summary: Fix an unsupported snippet, an over-claiming binding and an unsourced tier
  details: |
    First review round on PR #18335. All three blocking findings and all five suggestions, in one push.

    Blocking 1. The Neutropenia phenotype quoted a sentence that says only that DNAJC21 is a Shwachman-Diamond gene, and nothing about neutrophils. The reviewer found the sentence in the same cached paper that does state it, and it is now quoted: 'Dnajc21 loss accurately recapitulated the neutropenia, anemia, and reduced growth seen in SDS patients with DNAJC21 mutations'. The grading needs explaining, because the sentence does two things at once. Its own assertion is the zebrafish result, which would be MODEL_ORGANISM and PRIMARY_RESULT; the clause this entry relies on is 'seen in SDS patients with DNAJC21 mutations', which is a statement about patients that the paper treats as the established comparator for its model. So evidence_source is HUMAN_CLINICAL for that clause and quote_role is BACKGROUND, which is the pairing CLAUDE.md documents for exactly this shape.

    The reviewer also asked for a patient source for the FREQUENT band if one exists. There is none. Searching all six cached references for neutropenia and neutrophil returns patient-level statements only in PMID:37226705, which are about Shwachman-Diamond syndrome as a whole and therefore mostly about SBDS, and in PMID:39138265, which is the comparator clause above. A notes field now says the band is a qualitative reading of the cytopenia being the presenting haematological problem across the series, and that no cached source states a rate. The same is now recorded for Thrombocytopenia, whose only isolating source is the single adult case report.

    Blocking 2 is the one worth recording, because the defect was in the justification rather than only in the binding. Ectodermal Abnormalities was bound to HP:0000164 Abnormality of the dentition at VERY_FREQUENT, on a source that says every patient has 'skin, teeth or hair abnormalities'. That is a disjunction, so it supports none of the three individually at that frequency, and a dental binding asserts that every patient has a dental abnormality, which the sentence does not say. My notes made it worse by calling the dental term 'the most specific of the three that the sentence supports for the group', which reads as a considered choice and is simply wrong about what a disjunction supports.

    The term is now absent, with the two candidates searched and rejected on stated grounds rather than dismissed. HP:0000968 Ectodermal dysplasia exists and is a diagnostic concept these reports do not apply to their patients. HP:0001574 Abnormality of the integument covers skin, hair and nails but not teeth, so it would drop the dental arm while still claiming universality. HPO has no term spanning integument and dentition together. Both searches are named in the notes so a reviewer can re-run them, which is what CLAUDE.md asks of a negative-existence claim and what my previous note did not do. preferred_term now names all three components.

    Blocking 3. gene_disease_validity carried DEFINITIVE and CLINGEN with no external_id, the unsourced class. The reviewer supplied the assertion id; I verified it against the committed cache/clingen/gene_validity.csv before fetching rather than taking it on trust, and the row is DNAJC21, HGNC:27030, bone marrow failure syndrome 3, MONDO:0014887, AR, Definitive, Childhood Adolescent and Young Adult Cancer Predisposition GCEP. The MONDO term is this entry's own disease_term. external_id is set, the record is cached, the validity row is quoted, and list-gene-validity now reports 0 in every class for this file. As on every CGGV fetch this run, the committed ClinGen CSV no longer matches its manifest pin, so the cache file carries the file's own date.

    Suggestions taken.

    zygosity: HOMOZYGOUS is dropped. It contradicted the same genetic_context's own description, 'Germline and biallelic, homozygous or compound heterozygous', and ZygosityEnum has no biallelic value, so there is nothing correct to put there. The description already carries the fact.

    The TP53 claim is softened. The Ribosomal Stress node said ribosomal stress 'activates TP53-dependent pathways' and no evidence on the node supported it. The node now says so explicitly and records what the model actually shows: a tp53 mutation had to be introduced deliberately to produce myelodysplastic features, which tests tp53's role in transformation and not in the baseline cytopenia.

    Two suggestions needed new sources, and both turned out to be supportable, so both are added rather than deferred.

    A variants entry for c.983+1G>A (NM_001012339.3), homozygous, from PMID:38408162. Worth having because the splice consequence is measured rather than predicted: RNA sequencing showed exon 7 skipped with an 88-nucleotide deletion, and both facts are quoted.

    A Haematopoietic Stem Cell Transplantation treatment, from PMID:37491781. The reviewer's condition was whether that abstract names DNAJC21, and it does: one DNAJC21 patient among nine with deleterious mutations in a 32-child cohort of acquired severe aplastic anaemia and non-Fanconi IBMFS. So transplantation is no longer general IBMFS management with no disease-specific source. It is recorded carefully: directness INDIRECT, and the description says the record is for that patient's inclusion and not for an outcome, because the 93% event-free and 95% overall survival are cohort figures across all 32 children and say nothing about the DNAJC21 patient individually. Both abstracts were read before caching, so neither cache file is uncited.

    Re-verified on this head: just validate passes with 44/44 snippets, up from 40, and 0 issues. check-gene-activity-grounding, check-gene-namespaces, check-gene-validity, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-logical-rules, check-duplicate-keys, check-snippet-length, check-snippet-grading, check-title-snippets, check-reference-titles and check-cache-order all pass, and list-gene-validity reports zero in every class for this file.

    This round also carries the merge of origin/main that unblocked CI: the branch was mergeable_state dirty, conflicting on cache/zfin/terms.csv, my ZFIN:ZDB-GENE-030131-8928 dnajc21 row against main's ZFIN:ZDB-GENE-030131-3809 src row. Both rows were kept and just normalize-cache re-sorted the file. GitHub creates no pull_request workflow runs while it cannot build the merge commit, which is why this PR had no review at all for three and a half hours after it was opened.

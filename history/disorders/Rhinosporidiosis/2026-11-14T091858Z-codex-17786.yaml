  summary: Create Rhinosporidiosis infectious disease entry
  details: |
    Added a new Rhinosporidiosis entry for MONDO:0005946 and deleted its stub. The curation preserves the Rhinosporidium seeberi / Ichthyosporea boundary by binding the agent to NCBITaxon:90339, keeps the environmental maintenance cycle unresolved, and models human infection as an aquatic exposure-associated mucosal disease driven by endospore activation, trophocyte and sporangium development, local endospore release, and chronic granulomatous polypoid inflammation.

    The entry uses PMID:15814958, PMID:33269573, and PMID:33289469 to support the aquatic protist taxonomy, tissue forms, uncertain reservoir, freshwater association, no documented cross-infection, endemic tropical exposure setting, histopathologic confirmation, and first-line excision; PMID:35180588 and PMID:38440563 add recent surgical case evidence for pathognomonic thick-walled sporangia and coblation plus postoperative dapsone.

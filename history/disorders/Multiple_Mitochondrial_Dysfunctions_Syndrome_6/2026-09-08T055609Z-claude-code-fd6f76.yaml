  summary: 'Review round 1: MMDS6 (PMPCB) reviewer response'
  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES review on PR #11126, all five
    IMPORTANT findings plus the suggestions taken, in one bundled push.

    IMPORTANT findings:
    1. Basal-ganglia phenotype term generalized -> specific: HP:0002134
       (Abnormal basal ganglia morphology) replaced by HP:0007146 (Bilateral
       basal ganglia lesions), the Leigh-spectrum term used elsewhere in the KB
       and matching the entry's "symmetrical basal-ganglia signal abnormalities".
    2. Added the missing "Death in Childhood" phenotype (60% of the reported
       cohort) with the exact PMID:38374165 quote. Bound term left off: HP:0003819
       is an HPO clinical modifier (Age of death), not in the PhenotypeTerm enum,
       so binding fails validation; followed the KB precedent
       (Autosomal_Recessive_Spondylometaphyseal_Dysplasia_Megarbane_Type) of an
       unbound Mortality phenotype. Wired into the pathograph as a downstream of
       the neurodegeneration node.
    3. Split the bundled "Neuronal Energy Failure and Oxidative Stress" node into
       an atomic chain the cited zebrafish sentence itself orders: Mitochondrial
       Bioenergetic Failure (GO:0006119 oxidative phosphorylation DECREASED) ->
       Oxidative and ER Stress (GO:0006979 + GO:0034976 INCREASED) -> Neural Cell
       Apoptosis (GO:0006915 INCREASED) -> Basal Ganglia and Cerebellar
       Neurodegeneration. Rerouted the respiratory-chain edge to the new head node;
       removed the duplicated apoptotic-process annotation from the tissue-scale
       neurodegeneration node.
    4. Linked both animal models into the pathograph via modeled_mechanisms and
       gave each a stable name. Zebrafish pmpcb-null: RECAPITULATES the
       bioenergetic-failure and neural-apoptosis nodes (CELLULAR, no scale gap) and
       PARTIALLY_RECAPITULATES the tissue neurodegeneration node (CELLULAR->TISSUE
       upward extrapolation, caveated with limitations per the model-scale rule);
       readouts for MMP and neural-cell number. Yeast Mas1 complementation:
       RECAPITULATES the Fe-S-biogenesis node (MOLECULAR), limitations noting it
       does not model neurological features.
    5. Anticonvulsant Therapy rebound from generic NCIT:C15986 to NCIT:C64172
       (Anticonvulsant Therapy) with target_phenotypes -> Seizure (HP:0001250) and
       therapeutic_modality: SMALL_MOLECULE.

    Suggestions taken: diagnosis_term bound on three diagnoses (Genetic Testing
    NCIT:C15709, Magnetic Resonance Imaging NCIT:C16809, Molecular Analysis
    NCIT:C19770); GO:0006119 (oxidative phosphorylation) placed on the new
    bioenergetic node (respiratory-chain node keeps GO:0022900 electron transport
    chain); GO:0006915 duplication resolved by the node split; a progression: block
    added (classic early-onset vs adult-surviving splice-variant course).

    Validation: just validate-disorders green (schema + terms + 46/46 snippets
    verified, up from 33). Offline gates pass: causal-targets, entity-refs,
    duplicate-keys, enum-values, qualifier-terms, snippet-length, folded-hyphens,
    environmental-evidence; model-scale-audit --strict exit 0. pytest model-link /
    entity-ref / upward-extrapolation suite: 11395 passed. Merged origin/main to
    refresh the branch (no conflicts) so the whole-KB baselines are current.

    Not taken, with reasons: HP:0003819 not bound (clinical modifier, outside the
    enum — see finding 2); the fourth diagnosis (respiratory-chain enzyme testing)
    left without a diagnosis_term (no clean NCIT enzyme-assay term verified, and no
    term beats a bad one); Supportive Care and Genetic Counseling left without
    therapeutic_modality (generic non-platform actions).

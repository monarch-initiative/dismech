  summary: 'Review round: GeneReviews mining, prevalence class, nucleoside agents'
  details: |
    Tagged the GeneReviews chapter for DGUOK deficiency (PMID:20301766) and cited it for the 25 percent sibling recurrence risk, the confirmatory biallelic-variant test, and the infantile multisystem presentation in the DGUOK hepatocerebral differential, each marked quote_role REVIEW_SYNTHESIS. The chapter covers only the neonatal multisystem and isolated hepatic forms, which the notes now state. Changed prevalence_class from BELOW_1_IN_1000000 to NOT_YET_DOCUMENTED, since the only figure is a 5.6 percent diagnostic yield in an enriched cohort and not a population rate. Added therapeutic_agent bindings CHEBI:17172 2'-deoxyguanosine and CHEBI:17256 2'-deoxyadenosine to the nucleoside supplementation treatment. Merged main, which brought a PMC full-text cache for PMID:23043144; that file carries no extractor_version, the reference validator treats it as stale HTML and falls back to the abstract, so no full-text snippets were added from it. Updated the allelic-series notes, the hepatocerebral differential and the lumping discussion, which said the infantile form had no dismech entry; Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type now covers it. The lumping discussion also records that GeneReviews describes only the two infantile forms. Added ptosis to the list of full-text-only features in notes. Validated with just validate (49 snippets, 0 issues) and just validate-terms.

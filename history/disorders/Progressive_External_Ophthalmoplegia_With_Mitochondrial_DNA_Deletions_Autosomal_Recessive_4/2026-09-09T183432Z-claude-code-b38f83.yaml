  summary: 'Create: Progressive External Ophthalmoplegia with mtDNA Deletions, Autosomal
    Recessive 4 (MONDO:0014899, DGUOK)'
  details: |
    De novo curation of PEOB4 (MONDO:0014899), the DGUOK-related adult-onset multiple mtDNA
    deletion syndrome, as a standalone kb/disorders entry.

    The DGUOK allelic series was the decision, and it was settled deliberately. DGUOK carries
    three OMIM phenotype numbers, all recessive and all the same gene: 251880 (infantile
    hepatocerebral mtDNA depletion syndrome), 617068 (noncirrhotic portal hypertension 1) and
    617070 (this entity). Before writing I read the three entries the issue flagged.
    Alpers-Huttenlocher_Syndrome and TRMU-Related_Acute_Infantile_Liver_Failure mention DGUOK
    only as differential-diagnosis prose about the infantile hepatic phenotype, not as causal
    gene assignments. Portal_Hypertension_Noncirrhotic_2 is a GIMAP5 disease that curates
    DGUOK-related noncirrhotic portal hypertension as a named differential and says so in its
    own notes. So no dismech entry claims DGUOK causation, and there is no DGUOK entry for this
    to be a subtype of.

    entry_type DISEASE, standalone. Two things drove it: dismech curates the sibling PEOB
    series per gene, and Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1 (POLG) was
    the structural template for this file; and MONDO/OMIM both give this presentation its own
    identifier. The stub is deleted because MONDO:0014899 is now bound.

    I did NOT create an mtDNA-depletion grouping. That concept was set aside as over-broad
    earlier in the queue and nothing here needs it.

    ClinGen disagrees with the split, and the entry says so out loud. The 2024 ClinGen
    curation states that the various names given to DGUOK-related disease describe one primary
    mitochondrial disease and that the phenotype has been lumped into a single entity under
    its Lumping and Splitting Framework. That sentence is curated as an evidence item in the
    genetic block, with an explanation noting this entry takes the opposite position, and an
    OPEN_QUESTION discussion sets out both cases and names the refactor - a
    DGUOK-Related_Mitochondrial_Disease entry with this as a has_subtypes - that would
    reconcile them. Recording the disagreement as citable evidence seemed better than leaving
    a future curator to discover it.

    Evidence base. Five references. PMID:23043144 (Ronchi 2012, abstract only) is the defining
    paper: five independent adults, 5.6 percent of a multiple-deletion cohort, with impaired
    muscle DGUOK activity and protein stability. The ClinGen DGUOK assertion (Definitive) was
    built into references_cache from the committed cache/clingen fallback CSV. PMID:30428046 is
    the dguok-null zebrafish. PMID:32278775 and PMID:35114397 support the two differentials and
    the parkinsonism class-level claim.

    One reference is deliberately absent and the entry says why. PMID:29228108 (Caporali et
    al., Brain 2018) is the DGUOK-parkinsonism report and is what the Orphanet-derived MONDO
    definition's mention of parkinsonism traces to. It is a Letter to the Editor; neither
    'just fetch-reference PMID:29228108' nor the DOI route returned any retrievable text, so
    no exact quote could be taken and it is not cited. The generated cache files for both were
    deleted rather than committed empty. The Parkinsonism phenotype therefore carries only
    class-level evidence, marked INDIRECT, and its notes name the missing source so a curator
    who can obtain it knows what to replace.

    Frequency discipline. Every band carries its numerator against a denominator of five.
    Mitochondrial myopathy and multiple mtDNA deletions are 5 of 5 but by ascertainment - the
    cohort was defined by both - so they are VERY_FREQUENT rather than OBLIGATE, and the notes
    say the figure describes the ascertainment and not the penetrance. PEO is FREQUENT because
    the source says 'with or without progressive external ophthalmoplegia' without a count;
    the entry notes the resulting tension with the disease name. Rhabdomyolysis, lower motor
    neuron syndrome and cognitive impairment are each 1 of 5.

    Prevalence is the one place the entry departs from the usual shape. The only quantitative
    figure is a 5.6 percent diagnostic yield in an enriched cohort, which is not a population
    rate. The population field names that cohort rather than 'Worldwide', so the number is not
    silently reinterpreted.

    Pathograph. Eleven nodes from biallelic variant through loss of deoxyguanosine kinase
    activity, salvage-pathway failure, dNTP pool imbalance and error-prone mtDNA replication to
    muscle deletions and three tissue-level branches. A scripted diff of every downstream
    target against node and phenotype names returned zero dangling targets and zero unwired
    phenotypes.

    The animal model is honest about being the wrong model. The dguok-null zebrafish is the
    only animal model of the gene and it reproduces mtDNA depletion in liver, which is the
    infantile phenotype, not the muscle deletions that define this entity. That is stated in
    its limitations rather than left for a reader to notice. Its nucleoside-supplementation
    result is curated with both arms, including a REFUTE evidence item for the single-nucleoside
    experiment that lowered mtDNA copy number in mutants and wild-type alike.

    Validation. just validate passed with 46/46 snippets verified against cached references and
    no prefix skips. check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-folded-hyphens, check-title-snippets,
    check-snippet-length all clean.

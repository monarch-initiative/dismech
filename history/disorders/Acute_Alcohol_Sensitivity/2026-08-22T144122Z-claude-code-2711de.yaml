  summary: 'Create: Acute Alcohol Sensitivity (ALDH2)'
  details: |
    New Disease entry for acute alcohol sensitivity / the alcohol flushing response (MONDO:0012454, OMIM:610251). Four pathophysiology nodes from the inactivating ALDH2 variant through loss of tetrameric catalytic activity to acetaldehyde accumulation, which then branches to the acute symptomatic triad and to acetaldehyde genotoxicity and oesophageal squamous carcinoma risk. The acetaldehyde node is the hinge: everything upstream is constitutive genetics, everything downstream requires an ethanol exposure, which is curated as an environmental entry bound to ECTO:9000027 (the chemical term, not the drinking-behaviour term, because the mechanism curated is ethanol chemistry) with an influences_mechanisms TRIGGERS link. Two framings in the standard account are deliberately departed from and each carries a discussion: it is not only rs671 (a 2024 alcohol-challenge study found rs747096195 and rs190764869 causing flushing in non-East-Asian individuals, by different mechanisms - assembly failure and reduced Vmax rather than poisoned tetramers), and it is not benign (flushing is a usable biomarker of markedly elevated oesophageal cancer risk). The scope question is answered explicitly rather than silently: MONDO flags the term omim_susceptibility, and the entry argues for Disease status on the same grounds as the existing Dihydropyrimidine_Dehydrogenase_Deficiency entry while recording the counter-argument as an open discussion. The entry supplies a mechanism the KB was missing between two consequences it already curated - ALDH2 as a protective locus in Alcohol_Use_Disorder and as a risk factor in the oesophageal cancer entries - joined here by a Reduced heavy drinking phenotype and an Alcohol Use Disorder differential. Deep research: claude_code provider, preflight-dr PASS, but the report's own validation reported 2 of 5 quotes unsupported; none of those three references is cited here and every snippet came from an abstract read directly, and four leads from the report were re-checked against PubMed and left uncurated for want of a citable source, recorded in notes. Validation: just validate passed, 39/39 snippets verified against cached references; validate-terms passed; check-environmental-evidence and check-duplicate-keys clean.

  details: |
    Review-response session for PR #9247, superseding the CREATE record's description of the entry (four pathophysiology nodes, 39/39 snippets). Two review findings were that prose in the entry was contradicted by references cached in the same PR, and both were right. The notes claimed a search found no source establishing iodine-staining surveillance; PMID:30629674 was already in references_cache because the entry's own deep-research run resolved it, and is exactly that study - now curated as a diagnosis entry with the histology yield. The same paper supplied the flushing-history limits the diagnosis entry lacked. Sensitivity for inactive ALDH2 is now curated across three populations: 96.1 percent in general male clinic patients (PMID:9419411, which also shows the ethanol patch test performing worse at 72.4/71.4), 56.8 percent in male weekly drinkers (PMID:29707772), and 50.0 percent in alcohol-dependent women (PMID:30629674) - a monotone degradation with drinking, so the screen is least reliable where cancer risk concentrates. ADH1B added as a MODIFIER gene with a new upstream Ethanol Oxidation to Acetaldehyde by Alcohol Dehydrogenase node; the Ethanol Ingestion environmental exposure was re-targeted from the accumulation node to this production node, which is the step it literally supplies substrate to. The ESCC phenotype now carries the exposure-conditionality directly: in the 0.5-million China Kadoorie Biobank cohort, people drinking less than weekly showed no excess risk from inactive ALDH2, while rs671 GA carried HR 3.31 among male weekly consumers; and a meta-analysis across all subjects irrespective of drinking found rs671 apparently protective (OR 0.60), which the Reduced heavy drinking phenotype predicts. Both are curated as PARTIAL so neither can be quoted alone, along with that meta-analysis's negative Mendelian randomization result. Ontology corrections across two rounds: HP:0100751 to HP:0011459 Esophageal carcinoma; GO:0051289 protein homotetramerization removed from the catalytic node because DECREASED assembly states the opposite of the rs671 dominant-negative mechanism and is true only for p.Arg101Gly; and NCIT:C18020 to NCIT:C16546 Endoscopic Procedure on the new endoscopy entry, which was a generic-parent binding I introduced when the KB's established term was already cached and enum-reachable. An Aldh2 knockout mouse was added via modeled_mechanisms with the allelic mismatch stated as its limitation. Reference consumption went from 5 to 11 of the cached set. Validation: just validate-disorders passed, 61/61 snippets verified against cached references; all five ungated CI gates clean.

  summary: Systemic disease by organ, haemophagocytic syndrome, hypercalcaemia and
    deaths
  details: |
    Extends systemic disease. The Extracutaneous and systemic involvement phenotype now gives
    each series' commonest sites separately, since the series were assembled differently:
    subcutaneous soft tissue, then the central nervous system and the liver or spleen, in 36
    children, two of the authors' own and 34 from earlier reports, of whom 20 had disease at two
    or more sites and fewer than half had skin lesions (PMID:8765620); the central nervous
    system, lung and bone in ten children at one hospital (PMID:34178890), beside the systematic
    review's figures already cited; and the shares of a 174-case pathology series with a
    solitary subcutaneous or deep soft-tissue mass (16%), a solitary extracutaneous lesion
    outside soft tissue (5%) and multiple cutaneous and visceral-systemic lesions (5%)
    (PMID:12717244). The edge from histiocytic infiltration to that phenotype gains the two
    series' site sentences. Three phenotypes are added. Hemophagocytic lymphohistiocytosis is
    bound to HP:0012156 Hemophagocytosis, because HPO has no general term for the syndrome (the
    one HLH term an OLS search of HP returns, HP:5210288, is for EBV-driven disease, which no
    cited source reports); it carries the five of 17 children with systemic disease at one
    haematology centre, their features, and their younger age and more frequent skin, liver and
    spleen involvement (PMID:39177799), and a case report of the syndrome alongside disseminated
    disease in a 15-year-old being treated for leukaemia, which met the HLH-2004 criteria, among
    them haemophagocytosis in the bone marrow, and whose authors leave open whether the
    leukaemia, its treatment or an infection induced it (PMID:32719740). It has no mechanism
    edge, because no cited source gives one. Hypercalcemia (HP:0003072) carries one fatal case
    (PMID:12717244) and is unconnected for the same reason; its notes say why a 1992 case that
    presented with hypercalcaemia is not counted: every lesion in that report expressed CD1a,
    unlike the CD1a-negative panel this entry records (PMID:1379572). Hepatic failure
    (HP:0001399) carries the pathology series' two neonatal deaths and a background statement
    that disseminated disease can cause liver failure (PMID:34840207); a new edge into it from
    histiocytic infiltration cites both, with the neonatal deaths graded indirect because at
    autopsy those neonates also had giant-cell neonatal hepatitis. The systemic outcome phase
    now gives deaths by series without pooling them: two of 36, one of ten from a pulmonary
    infection, the pathology series' three, one of five with widespread congenital systemic
    disease in a 129-patient registry (PMID:15613853), and no significant survival difference
    with or without the syndrome, noting that the ten-child series and the 17-child cohort come
    from the same hospital over overlapping years. A new phase gives outcome in a collection of
    221 fetuses and neonates with histiocytoses: 11% mortality for this disease, and survival of
    every neonate whose disease was limited to the skin or subcutaneous tissue (PMID:16416419).
    The BRAF V600E record's note now says the central nervous system is the commonest site in
    the systematic review and in the ten-child series, rather than in systemic disease
    generally. Five references are cached for the first time. Validation: just validate passes,
    all 218 snippets verify, and the targeted gates pass.

  summary: 'Review round: rename the immunophenotype row and narrow statements to their sources'
  details: |
    Review round on PR 18510. The histopathology row 'Histiocytic immunophenotype: CD68 and
    factor XIIIa positive, S-100 and CD1a negative' is renamed 'Histiocytic immunophenotype:
    CD68 and factor XIIIa positive, CD1a negative, S-100 usually negative', because its notes
    now say the largest series found S-100 in 48 of 152 lesions; no entity reference or causal
    target names the row. The row gains a case report's background statement that S-100 is
    non-reactive in most cases, with weak scattered staining unlike that of Langerhans cells
    (PMID:29450403). The explanation on its quote from the 174-case series (PMID:12717244) now
    says that series stained its extracutaneous lesions and that the cells stained alike
    whatever their morphology, rather than that the panel was uniform across morphological
    variants; the same quote on the diagnosis row Skin biopsy with immunohistochemistry is
    regraded indirect for that reason, and that row gains the Kiel registry's sentence that CD1a
    and S-100 reactions were generally negative (PMID:15613853). In the Erdheim-Chester disease
    differential, the opening now says the two diseases share foamy CD68-positive, CD1a-negative
    histiocytes, which is what its source states (PMID:32107533), rather than an almost
    identical immunophenotype; and the sentence on the two studies of mostly solitary or
    localised lesions now says one tested copy number and copy-neutral loss of heterozygosity
    only and the other used a pan-NTRK immunostain, without the unsourced claim that the first
    could not detect point mutations, and names them as the two the entry's description names,
    since a third cached study of soft-tissue lesions exists. The entry-level notes on langerin
    and a pathophysiology node's note now say usual S-100 negativity and solitary rather than
    solitary cutaneous lesions. The reviewer's third suggestion, a fusion rate beside the
    staining result, is taken from the series already cached and cited on the genetic row NTRK1
    fusions (PMID:40235191, 6 of 21), which the NTRK histopathology row now cites too.
    Validation: just validate passes and all 204 snippets verify.

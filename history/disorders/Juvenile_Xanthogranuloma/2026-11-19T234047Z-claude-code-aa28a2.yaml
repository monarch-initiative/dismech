  summary: Add histological patterns, a wider immunophenotype and pan-NTRK staining
  details: |
    Adds three histopathology rows. Histological patterns: the early (early classic), classic
    and transitional patterns with combined lesions, the shares in the Kiel registry
    (PMID:15613853) and in one centre's archive of 525 patients (PMID:35378409), neither of
    which gives the denominator of its shares, and a 25-patient macrophage study's account of
    how young, maturing and regressing lesions look (PMID:35435864, quoted as background; an
    ellipsis skips a stray table footnote the cached abstract carries mid-sentence); the row
    says the sources do not map the named patterns onto those stages one to one. Immunophenotype
    in the largest series: CD68, CD163, CD4, CD11c and factor XIIIa positive and CD1a positive
    in 1 of 110, with S-100 positive in 48 of 152 lesions (PMID:35378409), and a 77-case study
    that appears to come from the same archive reporting CD11c and CD4 as sensitive markers,
    with its own S-100 (4 of 23) and CD1a (none of 18) counts (PMID:35315372). NTRK
    overexpression on pan-NTRK immunostaining: 23 of 43 localised and none of 7 disseminated
    cases in a 50-case series of juvenile and adult xanthogranuloma, with an NTRK1 fusion
    confirmed in two (PMID:37580954). The new sources made some sentences false, and they are
    narrowed: the existing immunophenotype row's notes and the skin biopsy diagnosis row now say
    S-100 is usually rather than always negative; and the entry description, a pathophysiology
    node's note and the Erdheim-Chester disease differential no longer call the copy-number
    study the one cached study of solitary lesions, since the NTRK study adds localised lesions.
    No molecular screening panel is added: the study of immunohistochemical screening for kinase
    alterations that the research report cites centres on ALK, and is left out of this change.
    No finding terms are bound, as on the existing histopathology rows. Four new caches are
    committed. Validation: just validate passes, all snippets verify, and the targeted gates
    pass.

  summary: 'Follow-up to PR 18479: the one-per-million, ten-percent and mortality figures'
  details: |
    PR 18479 was merged before its review round was pushed, so the round is carried in this
    follow-up PR. The reviewer pointed out that the prevalence notes said PMID:40666774 states
    an incidence of about one per million children without a source, while the paragraph of that
    case report ends with a citation. Read in full, the paragraph's one citation follows a later
    sentence about the lesion's cells, so the notes now say the figure is stated in a sentence
    that carries no citation and reports no measurement, which is why it is not used. The same
    caution is applied to the 2006 case report (PMID:16912017), cached as an abstract only: the
    eye-screening discussion and the explanation on its quote no longer say its 10% figure has
    no source, since only the abstract was read. The review_notes paragraph that listed claims
    of the deep-research report absent from the entry was rewritten after the imaging PR, which
    edits the same paragraph, merged first. It now lists three claims not carried as the report
    states them. For the 5 to 10 percent mortality in systemic disease, no cached source gives
    that range for this disease: the systematic review (PMID:36779547) found 10 of 159 patients
    with systemic disease (6.3%) dead of disease, which the progression section already carries,
    and the one cached 5 to 10 percent fatality range is for Rosai-Dorfman disease
    (PMID:28664935). The one-per-million incidence is stated in PMID:40666774 and the prevalence
    notes say why it is not used. The group C placement is unchanged. Two suggestions were not
    taken. The heterochromia row keeps the quote giving the second case's age (11 months),
    because it is the only quote in the row for the age the description gives. The secondary
    glaucoma row keeps HP:0000501 Glaucoma: an OLS search of HPO for secondary glaucoma returned
    no term, and the narrower Open angle glaucoma and Angle closure glaucoma terms each fit only
    one of the two routes the row covers. Validation on main after PR 18479: just validate
    passes; all snippets verify against the cache; check-entity-refs, check-folded-yaml,
    check-folded-hyphens, check-block-scalar-comments and check-retired-support-prose pass.

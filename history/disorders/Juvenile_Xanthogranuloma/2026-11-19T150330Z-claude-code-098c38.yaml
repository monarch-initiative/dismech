  summary: 'Edit: Juvenile Xanthogranuloma - imaging findings'
  details: |
    Adds the entry's first imaging_findings section: four rows, from three imaging papers.

    Ultrasound of the skin lesion binds NCIT:C208181 Hypoechoic on skin of body, from a 14-patient ultrasound series (PMID:41899058) whose conclusion calls the lesions cutaneous and whose lesions were predominantly on the head and face. A head and neck series (PMID:38832444) is quoted beside it. Its discussion summarises earlier reports as giving the same well-defined hypoechoic nodule; that sentence is quoted as BACKGROUND and graded INDIRECT, because it names no site. Its own ultrasound result, three patients with hypoechoic and two with hyperechoic lesions, is graded INDIRECT as well: by the paper's tables and figure legends the lesion examined by ultrasound was a subcutaneous mass (two patients), a sub-periosteal lesion of the skull vault (one), in the mastoid and parotid region (one) or in the temporal bone (one), never in the skin, so the result is not about the skin lesion and is quoted only for the limit the description states. Its authors' reading of their own series (a suggestive clue, not a pathognomonic one), their statement that ultrasound does not establish the diagnosis, and their statement that the diagnosis of the cutaneous lesion is strongly suggested by clinical examination and does not require imaging are quoted too. The last two of these are marked BACKGROUND, because they are general statements in the discussion and not results of the imaging series. NCIT has a second term for this appearance, NCIT:C113127 Hypoechoic Focus, defined as a region of an image with a signal lower than that of the surrounding regions and filed directly under Radiologic Finding. The row keeps NCIT:C208181 Hypoechoic, which NCIT defines as a sonographic finding and files under Echo Pattern, and carries the nodule in its name and preferred term.

    MRI of head and neck lesions binds NCIT:C28746 Gadolinium-Enhancing Lesion on the craniocervical region, from the same 11-patient series. Its methods give T1-weighted images after gadolinium injection in seven of the ten patients who had MRI, and that sentence is quoted, so the row takes the gadolinium-specific child of NCIT:C113842 Enhancing Lesion. The row also carries the seven features its authors propose as suggestive criteria and their discussion's caveat, quoted as BACKGROUND, that an iso- or hypointense T2 signal is not pathognomonic.

    MRI of central nervous system lesions binds the parent term, NCIT:C113842 Enhancing Lesion, on the central nervous system, from a 14-child series (PMID:36265894) whose cached abstract reports contrast enhancement without naming the agent. The row gives its less common patterns and its authors' conclusion about mimics. The two series differ on T2 signal. The head and neck paper's discussion restates the central nervous system series' result and sets it against earlier reports of an iso- to hypointense T2 signal; both sentences are quoted as BACKGROUND, and the row does not say that either paper compares the two series directly. The same discussion calls dural-based lesions common in intracranial disease, which the row records as a limit on reading an intra-axial mass as the only pattern.

    CT binds NCIT:C187140 Hyperattenuation, from the three head and neck patients and the four central nervous system patients who had CT. An earlier series in which lesions were hypodense in two patients, restated in the head and neck paper's discussion, is recorded as a REFUTE item. The row carries no located_in, because those seven patients' lesions lay in the face, the mastoid and parotid region, the temporal bone and the central nervous system; a row note says so.

    The two MRI rows bind an enhancement term because enhancement is the feature both series report most consistently: 7 of 7 patients in one, almost all lesions in the other. NCIT has terms for the four signal features as well, all under Imaging Finding: NCIT:C182357 Diffusion Restriction and the generic NCIT:C182326 Hypointensity, NCIT:C182328 Hyperintensity and NCIT:C28044 Isointense. It also has NCIT:C81175 Non-Enhancing Lesion, which names one of the central nervous system series' less common patterns and is not bound. A row takes one term, so those features are carried in the rows' prose and preferred terms. Two near-misses are not used: NCIT:C82346 Restricted Diffusion is a membrane-transport process, and NCIT:C182210 is T2 hypointensity of the brainstem only. An HPO search for "hypointens" returns 13 terms, each for a named brain structure.

    No row is marked diagnostic, each for its own reason. The head and neck authors say ultrasound does not establish the diagnosis. Their MRI criteria are a proposal, and the T2 signal is shared with other tumours. The central nervous system authors conclude that the appearances may mimic other diseases. The CT appearance rests on seven patients, against an earlier series in which lesions were hypodense in two.

    Three sentences elsewhere in the entry are changed to stay true with the new section and the newly cached paper. The Erdheim-Chester differential said that disease's skeletal and radiological pattern is recorded nowhere in this entry for juvenile xanthogranuloma; it now names the pattern and says none of it is among this entry's imaging findings. The review_notes sentence on where ontology identifiers were read now names the UBERON cache and says the MONDO identifiers match the local MONDO build, which was checked for all seven. And review_notes had said no cached reference places the disease in group C of the 2016 Histiocyte Society classification: the introduction of PMID:38832444 does place it in a C group, in a background sentence that gives another paper as its source, and review_notes now says so. The entry still records no such classification.

    The head and neck paper's own figures do not all agree. Its abstract and results text give low ADC in 7 of 9 patients, while its methods say ADC mapping was done in 8 of 10 and its second table has an ADC value for eight patients, seven of them low; the row follows the abstract and results, and a row note records the disagreement. On CT the abstract, the results text, the methods and the second table give three patients; the discussion's "as in our 2 cases" is said of intracranial disease and may mean the two skull-base patients among the three. Its figure legends and its second table also differ on single patients (the ADC of patient 10, the enhancement of patients 6 and 7); the rows keep the counts of the paper's abstract and results text, and the head and neck row's note says so.

    PMID:38832444 was fetched for this change, as full text, and is committed with it; the other two caches were already on main. Validated with the repository's nineteen-gate set over the changed entry, reference validation included, plus term validation for the three NCIT terms new to the caches, NCIT:C208181, NCIT:C187140 and NCIT:C28746, whose cache rows are committed in canonical order.

  summary: 'Edit: Juvenile Xanthogranuloma - eye disease: iris infiltration, glaucoma,
    red eye, heterochromia and the screening question'
  details: |
    Adds the eye disease of juvenile xanthogranuloma: a pathophysiology node for iris infiltration, three phenotype rows, a sequela on the hyphaema row, a diagnosis row for eye examination, and a controversy discussion on eye screening.

    Pathophysiology. The infiltration node's ocular edge now points to a new node, Iris Infiltration (lesional histiocyte, bound to CL:0000235 macrophage; iris, UBERON:0001769), instead of straight to the hyphaema row. The edge keeps the systematic review's organ-distribution sentence (PMID:36779547), INDIRECT as before, with its explanation now saying it counts ocular involvement as a whole; the ocular series' presenting-signs sentence (PMID:26189188) leaves this edge for the red-eye edge, and the series' conclusion takes its place. The node's evidence is the 30-patient ocular series (the iris involved in 21 of 31 eyes, nodular or diffuse, often without a skin lesion) and a case report's histology of an examined iris (PMID:29450403: histiocytes in nodular aggregates on its anterior surface). Its four edges lead to hyphaema (a case report's discussion of how iris granulomas bleed, PMID:40666774, BACKGROUND; the series' hyphaema count, INDIRECT; a case whose authors attribute hyphaema and glaucoma to the eye lesion, PMID:29450403, INDIRECT because the sentence names the eye lesion rather than the iris), to secondary glaucoma (the angle-closure route from the same discussion; the same case, INDIRECT), to red eye (causal link type UNKNOWN; the series' presenting signs, INDIRECT, a count that includes conjunctival and eyelid disease) and to heterochromia (the case report's introduction, BACKGROUND, and its own case, in which granulomas with a membrane over the iris contributed to it; a 1994 case, PMID:7933911, INDIRECT). The central nervous system edge's explanation no longer refers to the ocular edge's reason.

    Phenotypes. The hyphaema row gains a sequela to secondary glaucoma: blood blocking the trabecular meshwork (PMID:40666774, BACKGROUND), and the 1994 case in which both developed (INDIRECT). Three rows are added after it. Secondary glaucoma (HP:0000501 Glaucoma) carries background sentences on blindness and on the iris as the ocular site most often involved (PMID:8609257, PMID:29450403, PMID:16912017), Zimmerman's patterns of intraocular disease as one case report restates them, cases at 2, 4 and 7 months (PMID:16912017, PMID:29450403, PMID:7933911), and the ocular series' intraocular pressures (11 to 30 mmHg; controlled without medication in 14 of 21 patients at follow-up), the last two graded INDIRECT because they do not mention glaucoma. Red eye (HP:0025337) carries the commonest presenting sign, in 12 of 30 patients. Heterochromia iridis (HP:0001100) carries cases at 7 and 11 months; the sentence giving the second case's age is INDIRECT, since it does not mention heterochromia.

    Diagnosis and discussion. A diagnosis row, Eye examination (NCIT:C38060), carries that ocular disease is often found without a skin lesion (PMID:26189188), and the 1996 survey's risk factors and its recommendation to target screening (PMID:8609257). Whether, and which, children with skin lesions need a routine eye examination when they have no eye symptoms is a CONTROVERSY discussion, jxg_eye_screening, attached to that row; its question names three positions (all children, children at higher risk, or only children with eye symptoms), and the rationale notes that no cited source argues for examining every child. It carries the survey (431 dermatologists and 438 ophthalmologists; complications in about 0.3% of patients, 0.4% in the literature; targeted screening), the 2018 study (PMID:29488239: none of 76 children, 0.24% across published series, routine examination probably not warranted), the series of 147 Asian children (PMID:34820973: no ophthalmologic complications, routine screening not supported), two case reports' range of 0.3% to 10%, cited from earlier work (PMID:29450403, PMID:40666774), and the 2006 case report's unsourced figure of about 10% (PMID:16912017). The dispute sits in a discussion rather than in the diagnosis row's evidence, so that the low-yield sentences are not read as support for diagnosis by eye examination. The survey's sentences on who was surveyed and on what they believed are graded OTHER, and the two literature incidences REVIEW_SYNTHESIS. The sentence giving the ocular series' size is graded INDIRECT on the node, as it gives the size only.

    Prose the new caches would have made false. Two of the new case reports (PMID:40666774, PMID:29450403) record Langerin negativity, each in one patient, so the histopathology note and the entry-level note that said no cached source carries it now say that none states it for the disease as a whole. PMID:40666774 also states an incidence of about one per million children in its discussion, without a source; the prevalence row's notes now say so, and why it is not used. The review_notes sentence listing that incidence among the deep-research report's unsupported claims is left as it is: a sentence with no source or data does not support the claim, and the open imaging PR rewrites that paragraph. The review_notes count of citations of PMID:34820973, which this change would raise, is dropped, matching the open epidemiology PR's identical edit.

    Six references are newly cached and committed: PMID:8609257, PMID:29488239, PMID:16912017 and PMID:7933911 as abstracts, and PMID:29450403 and PMID:40666774 as full text. One quote from PMID:29450403 runs across a bracketed citation marker and is written with ' ... ' in its place, as the reference validator requires. New term cache rows: HP:0025337 Red eye and its phenotype-enum membership, resolved through OLS by term validation. Validated with the repository's gate set over the changed entry.

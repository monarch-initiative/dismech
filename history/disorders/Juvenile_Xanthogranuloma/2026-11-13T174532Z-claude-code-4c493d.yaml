  summary: Correct the NF1 diagnostic-criteria claim
  details: >-
    A correction round on a pushed PR, opened by a lead from a peer session and confirmed at source.
    The entry asserted, in three places, that the 2021 international consensus (PMID:34012067) added
    juvenile xanthogranuloma to the diagnostic criteria for neurofibromatosis type 1. That is false,
    and the evidence item supporting it quoted the wrong paragraph.


    What the paper says. The steering committee listed juvenile xanthogranulomas among the clinical
    features it considered. The first Delphi round then reached high consensus, median 7 to 9 out of
    10, for adding juvenile xanthogranulomas, choroidal abnormalities and dystrophic scoliosis to
    the revised criteria. The committee's own account of the outcome says the opposite: some
    possible criteria were not incorporated for insufficient data on specificity or sensitivity or
    other reasons, and the list names FASI, nevus anemicus and juvenile xanthogranuloma, the last
    because it is hard to diagnose clinically outside dermatology and is present only transiently.
    Of the three features the Delphi sentence names, only choroidal abnormalities reached the
    published criteria table.


    How the error was made. The Delphi sentence is a ballot in an intermediate round and, lifted out
    of the process, reads exactly like the final decision. This is the second time in this run a
    paper was quoted around its own conclusion; the first was a 2023 review whose next sentence
    reversed the one taken. The standing check written into the project notes is to find the
    paragraph that says what was decided before quoting any sentence that sounds like a decision.


    What changed. The single evidence item is replaced by a pair from the same paper: the sentence
    listing what was considered, graded SUPPORT and INDIRECT because the row's claim follows only by
    the inference that a finding unrelated to NF1 would not have been a candidate; and the
    not-incorporated sentence, graded NO_EVIDENCE. NO_EVIDENCE rather than SUPPORT or REFUTE because
    every reason the committee gives is about how the feature performs as a diagnostic criterion,
    and none bears on whether germline NF1 raises the risk of the lesion, which is what the row
    claims. REFUTE would have been worse than the original error: it would re-import the deleted
    claim as something to argue against. The two prose sites that repeated added now say evaluated as a candidate and not in the end
    incorporated; the record-level one also gives the committee's stated reasons.


    A second defect found by the same verification round, and the more dangerous one. The entry's
    review_notes listed PMID:37422708 among four references cached with an empty body that cannot
    support anything, and added that every statistic attributed to it is therefore uncited here.
    That reference was re-fetched in the previous round of this PR, is cached with its full text,
    and is cited twice on the very record in question; the corrected notes now lean on it. So the
    entry asserted both that the row rests on this source and that this source cannot support
    anything. The sentence now names the three references that really are empty and records that
    this one was re-fetched. This is the ninth false negative-existence claim in this project and
    the second this week that survived every automated gate.


    The germline NF1 row keeps relationship_type RISK_FACTOR. Removing the criterion sentence cost
    it rhetoric rather than support: it rests on the 2023 systematic review's opening statement that
    a subset of NF1 patients develop juvenile xanthogranulomas, The 1995 review's 30-fold to 40-fold excess is not a second statement of the same thing and is not
    used as one: its figure is for the triple association with juvenile chronic myelogenous
    leukaemia. The entry-level notes sentence that
    offered the consensus as the clincher now leads with those two and demotes the consensus to weak
    corroboration.


    Also removed: a sentence in an explanation narrating an earlier version of this entry having
    fallen into the Delphi trap. The substance is kept, stated impersonally, and the account of the
    mistake belongs here instead. And a cross-reference that named a sibling evidence item by
    position now names the source instead, since nothing keeps evidence items adjacent.


    Validation: just validate passes; just count-verified-snippets reports 65/65; just
    validate-terms, check-snippet-grading, list-background-citations (0 findings, all tiers),
    check-retired-support-prose, check-title-snippets and check-reference-titles all pass. No cache
    file and no references_cache file is modified.


    A second verification round on the corrections found two errors introduced by the first. The
    review_notes replacement said the re-fetched reference is cited three times; it is cited twice,
    which is an unchecked claim about the repository written while correcting an unchecked claim
    about a source. And the rewritten entry-level notes offered the 1995 review's 30-fold to 40-fold
    excess as a second statement that the two conditions go together, when that figure is for the
    triple association with juvenile chronic myelogenous leukaemia, which this entry says correctly
    in three other places. Both are fixed. Also fixed: the review_notes sentence narrated the review
    round rather than stating the fact, a surviving cross-reference that named a sibling evidence
    item by position rather than by source, and an overstatement that no stated reason bears on the
    record's claim when insufficient sensitivity data is simply not evidence in either direction.

  summary: 'Edit: Juvenile Xanthogranuloma - epidemiology: age distribution and sex ratio'
  details: |
    Adds the entry's first epidemiology section, with two rows: age distribution and sex ratio.

    Age distribution quotes seven series and keeps them apart: the Kiel Paediatric Tumour Registry series of 148 biopsy specimens from 129 patients (PMID:15613853: median 5 months, 34.5% of cases congenital, 71.0% of the lesions diagnosed in the first year of life, and its conclusion that the lesion is a tumour of infancy), a clinicopathologic review of 174 cases from the neonatal period to 20 years (PMID:12717244), one hospital's series of 147 children (PMID:34820973), a systematic review of systemic disease (PMID:36779547), a series of 10 patients with systemic disease (PMID:34178890), an ocular series whose ages run to 443 months (PMID:26189188) and a central nervous system imaging series of 14 children (PMID:36265894). The row's notes say the figures are not pooled, that the series measure different ages (an undefined patient age, age at presentation, age at onset, age at diagnosis and the age of the patients included), that the systematic review may count patients of the other series, and that five of the seven series were confined to patients up to about 20 years of age.

    Sex ratio quotes the six of those series that report sex. Five report more males than females, the 174-case series in every category of presentation and especially among patients with multiple cutaneous lesions; the central nervous system series had 8 girls and 6 boys, and the row says so.

    The prevalence row had carried the Kiel series' sex-ratio and age quote and its congenital-share quote as evidence for a prevalence record, which they do not support. Both move to the new section, the age quote split from the sex ratio. The prevalence row keeps the registry's relative frequency of 0.52%, and gains a sentence the entry already quotes elsewhere (PMID:28752840) calling the disorder rare, which is what its RARE tier records and which no quote on the row had stated. That item is graded INDIRECT, because the sentence speaks of the disorder in general rather than of the registry's population.

    All eight references, the seven series and PMID:28752840, were already cached and cited by the entry. The review notes had counted the entry's citations of PMID:34820973, a count this change raises from three to six; the count is dropped, so that later additions cannot make it stale. Three quotes contain a no-break or thin space in the cached text and are written with ordinary spaces, which the reference validator treats as equal. Validated with the repository's nineteen-gate set and the other whole-repo gates over the changed entry.

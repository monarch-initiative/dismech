  summary: Add differential diagnoses
  details: |
    Six differential-diagnosis rows: Langerhans cell histiocytosis (MONDO:0018310), Erdheim-Chester disease (MONDO:0018153), Rosai-Dorfman disease (MONDO:0006412), cutaneous mastocytoma (MONDO:0019314), papular xanthoma (MONDO:0015536) and Spitz naevus (MONDO:0044793). Most evidence items reuse references already committed for sibling entries; three references were newly fetched.

    The section is written around a fact that makes most marker-based differentials in this disease useless: CD1a negativity and CD68 positivity are shared by juvenile xanthogranuloma, Erdheim-Chester disease, Rosai-Dorfman disease, papular xanthoma and the mastocytoma variant below. Langerhans cell histiocytosis is the only one of the six that CD1a separates, and its row says so. The Erdheim-Chester and Rosai-Dorfman rows each quote the sentence showing the shared phenotype, so a reader cannot take those markers as discriminators; what separates Erdheim-Chester disease is its adult skeletal and radiological pattern and its MAPK mutation rate, and what separates Rosai-Dorfman disease is strong S100 positivity with emperipolesis.

    Three hedges are deliberate. The Rosai-Dorfman row says juvenile xanthogranuloma is typically rather than always S100-negative, because this entry's own cited sources say "generally negative" and scope the negative result to extracutaneous lesions. Touton giant cells are offered as a discriminator nowhere: papular xanthoma contains numerous Touton giant cells, the reported histiocyte-rich mastocytoma variant contains them, and a source this entry already cites reports that CLTC::SYK-fusion tumours generally lack them. The Erdheim-Chester row records that the intracranial and cranial form of this disease narrows the gap, quoting the authors who argue it belongs with Erdheim-Chester disease rather than with the cutaneous form.

    Benign cephalic histiocytosis and adult xanthogranuloma are deliberately not rows. A source this entry already cites calls both clinical subtypes of juvenile xanthogranuloma, so listing them as differentials would contradict it.

    81 snippets verified against the committed cache, terms validated, offline gates green. No existing row was touched.

    An adversarial pass over the draft found several claims the rows made that nothing cited carries, and the strongest of them contradicted the entry's own stated position. The Erdheim-Chester row called its MAPK mutation rate "far higher than in cutaneous juvenile xanthogranuloma"; no cited source gives a rate for the cutaneous form, and the entry's own description says that question is unsettled and that the one cached study of solitary lesions used a copy-number assay, which cannot see point mutations. The comparison is gone and the rate is now recorded as a property of Erdheim-Chester disease. The Rosai-Dorfman row claimed juvenile xanthogranuloma of the oral cavity has been reported with focal to diffuse S100 positivity; no cached reference anywhere in the repository contains both terms, and that sentence was the row's one load-bearing qualifier. It is replaced by the extranodal-emperipolesis caveat, which the cited series does state and which is now quoted. The Langerhans cell histiocytosis row claimed bone lesions for this disease and co-occurrence of the two in one child, neither sourced; the row is now scoped to the skin, and the guideline's own site distribution is quoted so a reader can see that bone is the Langerhans side.

    Four hedges were restored from the sources themselves. The Rosai-Dorfman marker figures carry their denominators, since that series stained a subset: CD68 in six cases and CD1a in nineteen of twenty-one. The mastocytoma row now carries the consensus's own statement that in young children with a typical mastocytoma the Darier's sign is often not tested, which is exactly the population the row is about. The two Langerhans cell histiocytosis sources differ on whether CD1a and CD207 are both required or either will do, and the row now says so. The Spitz row no longer attributes the name "setting sun" to this entry, which records the appearance but not that name.

    One regrade: the case report naming the clinical differentials of a solitary lesion was REVIEW_SYNTHESIS and OTHER; it is a single case report whose introduction restates established knowledge, so it is now BACKGROUND and HUMAN_CLINICAL.

    An entry-level notes sentence became false when this section landed - it said langerin appears once in the entry and is cited to no cache. It is corrected rather than left, since the diff is what made it wrong.


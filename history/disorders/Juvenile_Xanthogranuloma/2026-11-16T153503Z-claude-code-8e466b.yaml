  summary: The CLTC::SYK mTOR arm, and the first treatment-to-mechanism links
  details: |
    One new pathophysiology node, two treatment-to-mechanism links, and a controversy discussion. The entry had no `target_mechanisms` on any of its six treatment rows before this, so every drug sat beside the pathograph rather than in it.

    The new node has no incoming causal edge and renders as a second root. That is deliberate and its notes say so: the fusion node upstream would be the obvious source, but an edge from it would assert that the fusion produces the mTOR and cyclin D1 readouts, where the cited sentence only shows them co-occurring in fusion-positive tumours. The pre-existing kinase-pathway node's description used to carry the same mTOR and cyclin D1 clause; it is trimmed to the MAP kinase, PI3K and JAK/STAT convergence it still owns, and its evidence explanation now names the phospho-SYK and phospho-ERK half of the shared sentence rather than the half that moved.

    The node records the mTOR and cyclin D1 arm, scoped to the CLTC::SYK fusion-positive lesions and named that way, because the single sentence that reports those readouts scopes them to that subset. It binds GO:0004715 non-membrane spanning protein tyrosine kinase activity and GO:0031929 TOR signaling. Cyclin D1 carries no term and the node's notes say why, naming the search that establishes it: runoak -i ols:go search 'l~cyclin D1' returns exactly GO:0097128 cyclin D1-CDK4 complex and GO:0097131 cyclin D1-CDK6 complex, both cellular components and neither the claim, which is expression of the protein. A G1/S term would assert a cell-cycle consequence the source does not measure. The node's description also declines the ordering its name implies - the source reports the three readouts as co-occurring on immunofluorescence, not as a chain - and its single downstream edge to the proliferation node is INDIRECT_UNKNOWN_INTERMEDIATES for the same reason.

    The quoted sentence is the entry's third and fourth use of it, which the PR body states plainly: this change adds structure, not new evidence about the arm. The node's own item copies the grading of the two existing uses unchanged; the downstream edge's item grades the same sentence INDIRECT, because proliferation is the inference there and not the measurement.

    Dabrafenib is linked to the kinase-pathway node and sirolimus to the new node, both INHIBITS, both with INDIRECT evidence. The sirolimus link's description says explicitly that it does not claim the two reported responses were in fusion-positive lesions, whose genotype the cached abstract does not give.

    An adversarial evidence pass before the push found seven places where the prose claimed more than the sentence under it. The node's name said cyclin D1 "Activation" where the source says expression, which its own description and notes already said correctly; the node is renamed and the two references to it repointed. Its description said the readouts were found in the fusion-positive tumours "and only in those" - the source says those tumours "also demonstrated" them and does not report testing fusion-negative tumours, so the exclusivity is gone and the node now says why it is scoped rather than confined. The notes and the discussion rationale both hardened the three-case series' "suggesting" into a conclusion, and now carry the hedge. The dabrafenib link asserted the drug's pharmacology, which nothing cited states; it is rewritten to rest on the clinical response it does cite, and says that no cited source measured pathway activity before and after. The cyclin D1 downstream edge placed the expression "in the lesional cells", a cellular localisation the source does not give for that readout - it reports it at the level of the tumour.

    A new discussions block records an open controversy that this entry did not carry. A three-case series describing the same fusion found a separate cohort of classic juvenile xanthogranuloma negative for it, which its authors read as suggesting fusion-positive histiocytoma is a distinct entity; the series this entry was built on reports the same absence of Touton giant cells and reads it the other way, citing concordant methylation. Both sides are quoted, the second graded REFUTE against the distinctness claim. The fusion content stays scoped to fusion-positive lesions on either reading.

    One reference newly fetched. 72 snippets verified against the committed cache, terms validated, offline gates green. No phenotype, histopathology or diagnosis row was touched.

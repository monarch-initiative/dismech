  summary: The course of the skin lesions, and spontaneous regression as an open question
  details: |
    Adds the course of the skin lesions and records their spontaneous regression as an open
    question. The Cutaneous xanthogranuloma row gains lesion number (81.0% of cutaneous cases
    solitary in the Kiel registry; 51% with a single lesion and 26% with more than five among
    the 76 of 338 children with cutaneous disease who met one centre's inclusion criteria), the
    micronodular type (77% at that centre, the abstract not saying whether of children or of
    lesions), the head and neck as the commonest site (44.2% in 147 Asian children), and the
    colour as a series of 14 patients (yellowish-orange) and two introductions (red-brown or
    yellow; reddish or yellowish) give it, so the preferred term and the description now say
    yellow to red-brown instead of yellow-orange. A new progression phase, Course of the skin
    lesions, records documented resolution in 57.7% of patients in a series of 147 children (the
    abstract gives no denominator for the share) after a mean of 18.8 months, with no difference
    between single and multiple lesions; resolution by 3 to 6 years as one introduction states
    it; the Kiel registry's 7.0% relapse rate across all its patients, and involution after
    incomplete resection; the dermoscopic stages; the fibrotic and spindle-cell late stage; the
    neonatal review's suggestion that spontaneous regression of certain histiocytic lesions is
    commoner in neonates; and one introduction's statement that the skin lesions involute
    without sequelae, noting that no cited source describes scarring or a change in pigment. A
    knowledge-gap discussion asks why the lesions regress. It cites the reactive view two
    introductions take, the macrophage subsets of young, mature and regressing lesions, the
    rarity of genomic changes in solitary lesions, and the soft-tissue and systemic lesions with
    kinase alterations that regressed without treatment, and records that no cited source
    reports the driver of a regressing skin lesion, gives clinical criteria for when a skin
    lesion has regressed, or describes an animal or cell model of the disease. Whether
    intracranial and cranial BRAF V600E lesions belong with Langerhans cell histiocytosis and
    Erdheim-Chester disease is left to the existing discussion of that question. Also corrects
    the Age distribution row, which said the median ages in the six series that report one run
    from 5 months to 2.45 years; other cited series report medians outside that range, so it now
    refers to the six of the row's seven series that report one. All sources were already
    cached; no new references or term-cache rows. Before the first push, an evidence check and a
    bindings-and-hygiene check led to corrections: the exception in the macrophage study now
    attaches to the clustering against the epidermis, as the source says; the 57.7% no longer
    carries a denominator; the relapse rate is no longer said to follow excision; and several
    paraphrases were brought back to their sources. After the first review, as the reviewer
    suggested, the knowledge gap gains a proposed observational study: profile the driver
    alterations the entry models in partial biopsies of skin lesions that were then observed,
    record each lesion's histological pattern and macrophage subsets, and compare how often
    lesions with and without a detectable driver regressed. Validated with just validate,
    count-verified-snippets and the pre-PR gates.

  summary: Brain disease and central diabetes insipidus
  details: |
    Adds brain disease and central diabetes insipidus. The edge from Histiocytic Proliferation
    and Tissue Infiltration to Central nervous system symptoms gains how rarely the brain is
    involved across one centre's archive of 525 patients with 547 lesions (2.6%, a share the
    abstract does not tie to patients or lesions); an earlier review of 39 intracranial cases,
    as an imaging series summarises it (multiple lesions in 51%, systemic disease in 58%, and
    the lesion sites); the spinal canal and the threat to the cord; and, as indirect support for
    the causal step, a report of 36 children with systemic disease (two of the authors' own and
    34 from earlier reports) in which symptoms were usually referable to bulky or infiltrative
    disease. Every item on that edge is graded indirect, the existing lesion-sites item
    included: each establishes that lesions reach the nervous system or how often, not the step
    to symptoms. The edge's description no longer calls the review cached. The Central nervous
    system symptoms row gains a wider list of signs from that imaging series' discussion, when
    intracranial lesions are found relative to the skin lesions, and a systematic review's
    finding that permanent sequelae were mainly neurological and ocular; its first explanation
    no longer says the binding takes one of the listed features, which stopped being true when
    the row was rebound to the nervous system as a whole, and its notes drop the sentence about
    that earlier binding and now say that the CNS series' text counts only diabetes insipidus
    among the features. A new row, Central diabetes insipidus (HP:0000863), records it as a
    presenting feature, as the main permanent sequela in one series of ten children, and in 2 of
    14 children of the CNS imaging series, one at presentation and one later; in that series the
    infundibulum was involved in six children and in all three whose pituitary bright spot was
    lost, without the article's text saying whether the two with diabetes insipidus were among
    them; the row also quotes that series' statement that a lost bright spot is thought to
    reflect a lack of vasopressin-containing granules, and its authors' assumption of a
    mechanism like that in Langerhans cell histiocytosis. In the head-and-neck series two
    patients presented with polyuria and polydipsia, one with pituitary involvement and an
    absent neurohypophyseal bright signal and one with only skin lesions recorded; the row's
    notes record that the series' figure legend for the first describes a nine-month-old girl,
    against its tables and its age and sex counts. The row is left unconnected to a mechanism
    node because no cited source says which lesion produces the diabetes insipidus in this
    disease. The CNS imaging series (PMID:36265894) was re-fetched as full text for these
    findings; its abstract sentences cited elsewhere in the entry still verify. Left out: the
    outcome of central nervous system disease, on which the cited sources disagree. No new
    references or term-cache rows. Validated with just validate, count-verified-snippets and the
    pre-PR gates.

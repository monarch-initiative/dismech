  summary: 'Review round 1: the SYK binding on the mTOR node, and a reintroduced exclusivity'
  details: |
    Two blocking items on #18279, both the same over-claim the PR set out to remove.

    The new mTOR node bound GO:0004715 non-membrane spanning protein tyrosine kinase activity with modifier GAIN_OF_FUNCTION, as SYK kinase activity. The reviewer is right that it does not belong there, and the strongest of their four reasons is one this entry had not noticed: in the cited sentence the phosphorylated SYK localisation is not scoped to the fusion-positive tumours. Only the mTOR activation and cyclin D1 expression are - the sentence reads that phospho-SYK was localised to CD163-positive histiocytes, and that tumours with CLTC::SYK fusions also demonstrated the other two. So a node whose whole justification is that its readouts are reported for one subset was carrying a binding whose readout is not. Beyond that, the node's name and description are mTOR and cyclin D1 and its description says the source does not show SYK driving mTOR; SYK activity already sits upstream on Somatic Kinase Alteration in a Myeloid Precursor with GO:0004672; and the binding bundled a second claim into a node written to carry one. The block is dropped. The node keeps GO:0031929 TOR signaling, which its biological_scale MOLECULAR fits on its own, and its description now says why SYK is bound upstream and not here, so the absence reads as a decision.

    The second item is an exclusivity that came back in the wording of the fix for the first round's exclusivity. The trimmed kinase-pathway description said the readouts are a separate node because they were measured only in that subset, and the new node said the measurement was made in that subset rather than across the disease. Both assert that fusion-negative tumours were tested and were negative, which is exactly what the node's own next sentence says the source does not say. Both now read that the source reports the readouts only for that subset, which is a claim about the report rather than about the tumours.

    72 snippets re-verified unchanged. No evidence item, no edge and no other node touched.

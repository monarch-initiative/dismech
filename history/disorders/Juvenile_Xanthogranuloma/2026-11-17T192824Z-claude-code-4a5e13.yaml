  summary: 'Edit: Juvenile Xanthogranuloma - scope the BRAF evidence, and record what
    the corpus does not support'
  details: |
    This row was planned as an expansion of the two effector arms - a MEK-inhibitor treatment row, a histiocytosis basket trial, and target_mechanisms wiring on the BRAF and sirolimus rows - and a digest of the entry's 31 cached references ruled out most of it. The wiring is already on main. No cached reference names any MEK inhibitor in connection with this disease: the hits are an Erdheim-Chester review, a Rosai-Dorfman paper's discussion of two Erdheim-Chester patients treated elsewhere, and the neurofibromatosis type 1 diagnostic criteria naming selumetinib for plexiform neurofibroma. No NCT identifier appears in any of those 31 files. And the two-arm split itself is in no source, because the one sentence that reports mTOR activation, cyclin D1 and phosphorylated ERK names all three together in the same fusion-positive tumours - the mTOR node already declines to order the readouts it carries, and the ERK half of that sentence is recorded on the kinase-pathway node.

    So what the change does instead is scope and qualify what is already there.

    The BRAF V600E genetic row gains a second series, and the entity question that comes with it is recorded as a CONTROVERSY rather than as prose on the row. No cited source places a case of this variant outside the central nervous system or the cranium, and the two that give a site put every case inside one - but the third, the systemic series behind the dabrafenib response, gives no lesion site at all, so the row says that rather than asserting a universal. The three-case report argues those lesions likely differ from cutaneous juvenile xanthogranuloma in clinical features and in BRAF status and proposes classifying them with Langerhans cell histiocytosis and Erdheim-Chester disease; the other series reports its two cases as CNS-xanthogranulomas inside a juvenile xanthogranuloma cohort. Both readings go into jxg_braf_lesion_site_entity_status, the second one graded REFUTE, which is how the entry already encodes the CLTC::SYK entity question. The frequency field now names both series.

    The BRAF inhibition treatment row gains the same authors' own conclusion, which is weaker than the result sentence already quoted there - dabrafenib showed efficacy to some extent - and the explanation records that the abstract never states how many BRAF V600E patients were treated, so it is an uncounted subgroup of a 17-patient retrospective series.

    The CSF1R row gains the one child who also carried an MRC1::PDGFRB fusion. It is recorded there rather than as a PDGFRB row of its own, because the source reports it once and reports it as co-occurring.

    The lesion node now declares conforms_to against the oncogenic growth-signal lesion of the sustaining proliferative signalling module, and its notes say which of that module's four routes this disease takes. The first draft of that paragraph got the kinase families wrong, calling the CLTC::SYK, TPM3::NTRK1 and MRC1::PDGFRB fusions lesions that are not receptor lesions at all: NTRK1 and PDGFRB are both receptor tyrosine kinases, which this repository's own validated quotes say in other entries, and SYK is the one of the three that is not a receptor: the Immunodeficiency 82 With Systemic Inflammation entry places it immediately downstream of ITAM-bearing immunoreceptors and binds non-membrane spanning protein tyrosine kinase activity on it. The paragraph now reads that the disease takes two of the module's routes - a receptor tyrosine kinase lesion in CSF1R and in the two receptor fusions, and a downstream transducer substitution in BRAF V600E - plus one lesion class the module does not name, the CLTC::SYK fusion. That span, not the fusions, is why the node binds protein kinase activity rather than the module node's receptor tyrosine kinase signalling, which check-conformance-content reports as process_absent. It also no longer calls the CSF1R mutations activating, because no cached source does.

    The next node in the module's chain is deliberately not conformed to, because it asserts chronic ligand-independent flux and nothing cited establishes either property. The first draft gave a narrower reason than the sources support - that the only cached readout calls phosphorylated ERK variable - when the same sentence also reports mTOR activation and cyclin D1 expression, which this entry models as its own node. The paragraph now says that, and that none of the three readouts is measured before and after anything or reported outside the fusion-positive subset. The module's oncogene-dependence corollary is not claimed either, since the cited series report spontaneous regression in 1 of 6 children with a CLTC::SYK fusion and 2 of 7 with a CSF1R mutation.

    PDGFRB is now bound on that node's genes as hgnc:8804. Without it the paragraph named a sixth driver gene the node's own bindings did not carry, which left the gene invisible to the gene index and to anything walking those bindings.

    The entry notes record the MEK search itself, with the terms and the three off-disease hits, so the absence reads as a search result rather than an oversight. Two sentences of that paragraph were corrected: the NCT claim now says "in any of those 31 files" rather than "anywhere in the cached corpus", which references_cache/ as a whole would make false; and PMID:37736360 is described as what it is, an identifier the deep-research report cites and this entry does not, rather than as a thirty-second cited reference with no cache file, which would assert a citation that does not exist. The review_notes sentence it had appealed to was also wrong and is repaired in the same push: of the three references it names, two have no cache file at all rather than an empty body, and the third is cached as an abstract and cited three times by this entry.

    The entry is not yamlfix-stable, and was not before this change: with whitelines set to 1 the formatter would collapse a double blank line inside a folded scalar, which changes the parsed string, so the wrapper refuses and leaves the file untouched. Three values trigger it, the same three before and after. This change adds two more collapsible breaks, both inside scalars that already carried one, so it adds no newly triggering value and does not change whether the file is stable.

    A second adversarial round then found nine more, all prose and all in the rewrite rather than in the original. Eight are enumerated here; the ninth was a reference to "this knowledge base's own SYK entry", which named no entry that exists. The fusion clause said the fusions' partner genes are receptor tyrosine kinases, where this entry uses partner for the 5' non-kinase gene, so it named TPM3 and MRC1 instead of NTRK1 and PDGFRB. The flat intracranial-or-cranial universal had reappeared in the new discussion's rationale and in an evidence explanation, when the extracutaneous series says CNS, which includes the spinal cord, and never says intracranial; the entry now keeps the two sources' words apart and says which reading is its own inference. That series' two cases were described as sitting in a juvenile xanthogranuloma cohort when one is an adult in its separate adult arm. "Measured outside that subset" claimed more than the mTOR node allows. Placing the CSF1R mutations on the module's activating-receptor route restated the activating claim the paragraph had just withdrawn. And the review_notes repair itself said three references cannot support anything here while conceding that the third is cited, and gave its citation count as four where it is three. All nine are corrected.

    A third round, a reviewer read rather than a source check, found the defect that matters most in this change, and it was in the paragraph the change was proudest of. The MEK note said the omission of MEK inhibition "is a search result rather than an oversight" on the strength of a grep over the 31 references the entry already cites - a search that by construction cannot reach a paper the entry does not cite. The deep-research report behind this entry names exactly such a paper, PMID:30867592, four times, as the therapeutic-dependency evidence for the entry's central claim, and instructs a curator to carry it with directness INDIRECT. It was neither cached nor cited anywhere in kb/. So the note read an empty cache as a negative answer, which is the failure the repository's own ECTO ricin example warns about, and then told the next curator the question was closed. The omission predated this change; the foreclosure would have been new.

    The reference is now fetched and committed, and the note says what the search did and did not establish. It also records what the trial covers, which decides nothing on its own: 18 patients, Erdheim-Chester disease in 12, Langerhans cell histiocytosis in 2, Rosai-Dorfman disease in 2 and mixed histiocytosis in 2, an 89% overall response rate with responses across histiocytosis subtypes and tumour genotypes, and the word xanthogranuloma nowhere in the paper. No treatment row is added, because a treatment row asserts a treatment for this disease and the trial names no patient with it - which is the same cross-disease objection the note already makes against the other three MEK papers, and the reviewer and the report disagree with that reading. The argument is recorded in the entry so the next curator, or this repository's reviewer, can settle it rather than re-derive it.

    Five smaller things from the same round. The review_notes sentence that had been repaired twice was still narrating its own earlier drafts, which CLAUDE.md names as the thing not to put in an entry; it now states only the current position. The lesion node's description asserted an activating alteration across all six driver genes while the notes withdrew that for two of them, so the description now says which. The claim that the module has no route covering CLTC::SYK is now stated as this entry's reading rather than as the module's silence, since the downstream-transducer route names substitutions and a fusion is arguably one. Two internal cross-references were cut. And the oncogene-dependence sentence now names the cobimetinib trial as cutting the other way for the family, which is what a future conformance to that node would have to rest on.

    A fourth round found four more, and two were introduced by the third round's own fixes. The sentence saying the activating gap covers "those two" of six driver genes missed PDGFRB, which this change itself added as the sixth and for which the single cited mention reports the fusion and nothing about its effect; the node description written in the same round then put the PDGFRB fusion in the activating group outright. Both now say three of six and name which. "No cached source calls the CSF1R mutations activating" was unscoped in the way this entry had just finished criticising elsewhere: an uncited cache here, the WHO fifth-edition classification, carries in its bibliography a 2019 paper titled for activating CSF1R mutations in histiocytic neoplasms, so the claim is now scoped to what this entry cites and names that paper as the uncached candidate. The discussion rationale's "though only one of them uses those words, the other saying CNS" contradicted itself, since CNS is one of those words. And this record restated, in two earlier paragraphs, the exact formulations a later paragraph said had been corrected.

    Review round (19 Nov 2026). The reviewer asked for the MEK paragraph of the entry notes to state only facts about the disease, and for the cobimetinib trial to be cited rather than left as an uncited cache that a routine prune would delete. The question is now a knowledge gap in discussions, attached to the treatments section and citing the trial twice: its primary result, which is the sentence the reviewer suggested, and the authors' own statement that responses spanned subtypes and genotypes in a mostly Erdheim-Chester cohort of adults, with caution about applying the result to every histiocytosis. Both are graded HUMAN_CLINICAL, PRIMARY_RESULT and INDIRECT, and the gap's rationale gives the enrolment and the age criterion. No treatment row is added, for the reason given above. The notes paragraph keeps the search terms, the three off-disease hits and the scope of the search, and replaces the claim that no cited source names a trial identifier, which citing the trial would make false, with the fact that the only one is the trial's own, NCT02649972. Two statements move from the notes to this record: the trial's reference was fetched and committed for this change; and PMID:37736360, which the deep-research report cites, is not cited by this entry and has no cache file. The lesion node's conformance notes were shortened, as the reviewer suggested, to the route mapping, the reason for binding protein kinase activity and the reason for not conforming to the next node. The parts cut were the three-of-six gap in activating evidence, which the node description already states; the uncached 2019 paper on activating CSF1R mutations, which is left for a follow-up as the reviewer also suggested; the oncogene-dependence sentences; and the sentence pointing to the trial in the entry notes, which no longer hold it. Every search the notes still claim was re-run against the cited caches for this round, and the trial's text was re-read for the enrolment, the age criterion and the absence of the word xanthogranuloma.

    Two independent checks of this round, made before it was pushed, led to further corrections in the same push. The trial is now described as naming no patient with this disease, rather than as having enrolled none: it reports 18 patients, aged 18.3 to 79.5 years, and does not break down its two cases of mixed histiocytosis. The statement that no cited reference reports MEK inhibition in such a patient is limited to the cached text, most of which is abstracts. In the lesion node's notes, the gene-list caveat now matches the node's description, which calls the alteration activating for the CLTC::SYK fusion and BRAF V600E only; the conformance paragraph quotes the module's transducer route as it is written (KRAS, NRAS, HRAS, BRAF and PIK3CA) instead of calling it a route of substitutions, names the entry whose binding makes SYK a non-receptor tyrosine kinase, assigns the MAP2K1 deletion to no route, and limits the unconformed node's properties to this disease's lesions. The CSF1R row's co-occurrence item is graded INDIRECT, no longer calls the fusion a second one, and no longer says that no functional work separates the two alterations, which its abstract cannot show. In the BRAF entity controversy, the two series are described as reading the same kind of lesion rather than the same lesions, since they report different patients; the third source is described as reporting BRAF V600E patients with this disease, since the trial now cited reports others; and the REFUTE item no longer leans on its paper's title, which is about juvenile xanthogranuloma of soft tissue. One point was left as it is: two DIRECT items on genetic rows quote only that a variant was found, the pattern of those rows' existing items, and the controversy records the caveat that goes with one of them.

    Validated after those changes with the repository's nineteen-gate set over the changed entry, reference validation included, plus name collisions, qualifier terms, reference-title agreement with the caches and the logical rules. The cancer-origin derivation is not among them: that check assesses no entry here, so running it says nothing about this change.

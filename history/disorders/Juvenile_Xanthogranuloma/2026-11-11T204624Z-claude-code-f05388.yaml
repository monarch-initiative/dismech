  summary: 'Create: Juvenile Xanthogranuloma'
  details: |
    New entry for juvenile xanthogranuloma, MONDO:0015534, from 16 cached references and 48 verified snippets. A read-only literature digest read every cache in the worktree first and reported verbatim candidate quotes by section; every quote was then re-extracted from the cache body programmatically before it entered the file, so nothing was retyped. The entry is built around the 2024 kinase series, which found a targetable alteration in 16 of 16 children sequenced, because that is what makes the disease a clonal myeloid neoplasm rather than a reactive proliferation: CLTC::SYK fusion and CSF1R mutation are the two commonest drivers, with NTRK1 fusion, BRAF V600E and MAP2K1 deletion accounting for much of the rest. Three things are deliberately absent, each recorded in notes or review_notes. Langerin and CD207 negativity is not asserted anywhere, because no cached source carries it, and the CD1a and S-100 negativity that is cited twice does the same discriminating work. The chromosomal gains and losses reported by the copy-number study are left out under content fence (b); only that study's conclusion, that copy-number change is unlikely to be driving pathogenesis, is used, and it names no chromosome. All ALK content is left out under content fence (a), which cost nine candidate quotes and makes the 2026 immunohistochemistry screening paper usable only for its opening definition. The neurofibromatosis and juvenile myelomonocytic leukaemia association is recorded in notes rather than as a structured comorbidity because the cached sources disagree about it: a 1995 paper reports the triple association at 30 to 40 times the expected frequency, a 2017 case-control study of 739 neurofibromatosis patients found no increased malignancy risk, and a 2021 cohort concluded against routine screening. The one cached piece of evidence that the two diseases are clonally related is a single 2025 case report finding the same somatic PTPN11 variant in skin and blood, and it is recorded as that rather than as a frequency. Three claims the deep-research report made are named in review_notes as unsupported by any cache and are therefore absent: a 5 to 10 percent mortality for systemic disease, an incidence of about one per million, and placement in group C of the 2016 Histiocyte Society classification. The report also presents as a verbatim quotation from PMID:12717244 a sentence that is not in that cache; the real sentence is quoted instead. Four of the references the report cites are cached with an empty body and support nothing. Two Touton giant cell and foam cell NCIT terms exist but are cell terms outside both source nodes of the HistopathologyFindingTerm enum, checked with runoak ancestors against the local build, so those findings carry no finding_term and the reason is in their notes. Two read-only verifiers were then run in parallel against the entry, split by axis. The claim-truth axis found eight things, two of them hard, and all are corrected. The worst was a scope error: the kinase series the entry is built around is scoped by its own title and abstract to the rare extracutaneous form - 16 children with extracutaneous juvenile xanthogranuloma - and the description, the node and one explanation all read its 16 of 16 as a figure for the disease at large. That directly contradicted the entry's own statement that two thirds to three quarters of cases are solitary cutaneous lesions, and it is now scoped in all three places, with the one cached study of solitary lesions, which used a copy-number assay and found a clonal alteration in two of nineteen, recorded beside it as a different question rather than a contradiction. The second hard one was a false negative-existence note: a dermoscopy row carried a note saying NCIT has no dermoscopy term that is both a clinical action and inside the enum rooted at NCIT:C25218. NCIT:C116478 Dermoscopy is exactly that, two steps under C25218 via Diagnostic Procedure, and the row now binds it and the note is gone. Of the rest: an explanation claimed the same negativity on a snippet that carries only positivity, and gave 174 cases where that series has 129 patients - both are fixed and the negativity sentence from that cache is now quoted, so the two notes claiming the CD1a and S-100 negativity is cited twice are true rather than aspirational. An ocular treatment row said ocular disease is treated medically rather than surgically, where its own source reports excisional biopsy in 5 of 9 non-iris cases; it is now scoped to the iris, which is where the disease preferentially sits. The sirolimus row said a single case where its own reference title says two, and rested on a drug-class sentence and a call for further work while the one sentence reporting what sirolimus did sat uncited; that sentence is now quoted and the call for further work is graded indirect. A quote was graded REVIEW_SYNTHESIS on a paper whose publication types are Journal Article and Case Reports and whose own series the entry grades PRIMARY_RESULT elsewhere; it is BACKGROUND. Two explanations named facts their snippets did not carry, and the missing sentences are now quoted. And the smaller ones: both source nodes became all six, a plurality of 40 per cent described as usual became most common, the 2017 neurofibromatosis study's conclusion had lost its subject and now says that the xanthogranulomas do not confer the risk rather than that neurofibromatosis does not, and a cohort dated 2021 is 2022. The bindings axis found ten things in parallel. The dermoscopy note is the one both axes caught: NCIT:C116478 Dermoscopy is two steps under C25218 and already in the committed enum cache, so the row binds it. Five bindings were changed. Prednisolone was bound where the source names only a class, and is now CHEBI:50858 corticosteroid, which CLAUDE.md names as the admissible class term. Vindesine was left unbound on a note saying it has no CHEBI term in the committed cache, which read an empty cache as a negative answer rather than as silence - CHEBI:36373 vindesine exists and is now bound. CL:0000891 foam cell became CL:0000517 macrophage derived foam cell, since CL makes histiocyte an exact synonym of macrophage and the lineage-agnostic parent also covers smooth-muscle derived foam cells. CL:0000451 dendritic cell became CL:0001006 dermal dendritic cell, the term the cited source's own phrase names. And the central-nervous-system row was bound to HP:0001250 Seizure while being named for the seven features its source lists with no frequency for any; it is now a coarse binding on HP:0000707 with coarse_binding_basis VARIABLE_SPECTRUM, which is what that value is for. Two notes were corrected rather than their conclusions changed: the HistopathologyFindingTerm enum has thirteen source nodes, not six, and the reason watchful waiting is left unbound is that it has no NCIT label at all, where NCIT:C25598 Observation Activity exists but sits under Diagnostic Procedure and would assert an investigation. The cutaneous row's preferred_term was a disjunction spanning Skin nodule and Papule, which HPO makes siblings rather than a general and a specific form, so it names the nodule alone.

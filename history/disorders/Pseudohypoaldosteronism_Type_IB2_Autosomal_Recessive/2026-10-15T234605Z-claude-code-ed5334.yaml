  summary: 'Create: Pseudohypoaldosteronism Type IB2 Autosomal Recessive'
  details: |
    New entry for the SCNN1B-related systemic, autosomal recessive form of pseudohypoaldosteronism type 1 (PHA1B2, MONDO:0859317), replacing the seed file and deleting the stub.

    Curated: description, synonyms, parents, notes, inheritance (HP:0000007), prevalence (Orphanet birth-prevalence band for generalized PHA1, with the caveat that it covers all three ENaC genes), progression (neonatal presentation; chronic non-remitting course), genetic (SCNN1B, hgnc:10600, causative, germline loss of function), a pathograph of 8 pathophysiology nodes (SCNN1B loss of function, distal nephron sodium reabsorption failure, impaired distal potassium and hydrogen ion secretion, extracellular volume depletion, compensatory renin-angiotensin-aldosterone activation, sweat duct, colonic and salivary, and airway sodium absorption failure) with downstream edges into 15 of 19 phenotypes plus a Hyperkalemia to Arrhythmia sequela, diagnosis (biochemical profile, sweat test, genetic testing NCIT:C15709), treatments (sodium chloride, sodium bicarbonate, sodium polystyrene sulfonate, dialysis, and mineralocorticoid/glucocorticoid replacement recorded with REFUTE evidence for lack of effect), differential diagnoses (congenital adrenal hyperplasia, renal PHA1A, aldosterone synthase deficiency, secondary PHA) and two betaENaC mouse models linked to the pathograph.

    Deep research: one openscientist report was used. It was retrieved by re-attaching to the original OpenScientist job b68f6376-91bf-462a-aa91-1a3d3b1aa84e after a container restart; no second job was submitted. Its reference validation reported 24/24 references resolved, 0 off topic, and 1 of 1 quoted claims not found (the phrase "Pseudohypoaldosteronism Type 1B2" attributed to PMID:41457049; that quote was not reused). Its term validation flagged NCIT:C77398 as unresolved (offered for sodium chloride) and mislabelled NCIT:C29343, NCIT:C87720, CHEBI:2674 and CL:0002370; none of the report's suggested CURIEs were bound, and all bindings came from the repository caches or OLS lookups. The report also cites OMIM #264350 as the phenotype entry, whereas MONDO:0859317 cross-references OMIM:620125. Report citations taken: 41457049, 42549990, 20064610, 23426840, 31018202, 9990092, 19571553, 23641881, 22397047, 17546235, 31914462. Dropped: 16207733 (heterozygous SCNN1B variants in a cystic fibrosis-like syndrome without renal disease, a different disorder), 23416952, 33690157, 38288475, 23680607 (SCNN1A or SCNN1G cohorts and cases, so not used for SCNN1B-specific claims), 26817011, 21664233, 15958725, 11826291, 21750640, 26772908, 41275343 (background or general reviews adding nothing citable beyond the sources used), 9326675 (alphaENaC rescue mouse, not this gene). Additional primary sources were found directly in PubMed, including Chang 1996 (8589714), the betaG37S gating study (9118951), Kerem 1999 airway study (10403853), sweat duct physiology (15986094), miliaria case (17389851) and SCNN1B case reports.

    Respiratory phenotype: the human airway evidence (Kerem 1999) comes from a systemic PHA1 cohort not restricted to SCNN1B, and the betaENaC knockout mouse clears neonatal lung liquid almost normally, so the airway node carries both and the wheezing, cough and infection phenotypes note that the evidence is pan-ENaC.

    preflight-dr was not run to completion: it requires a local MONDO build (~/.data/oaklib/mondo.db, about 1.3 GB), which is absent, and it was not downloaded. A manual check instead found SCNN1B named 43 times in the report body against 20 for SCNN1A and 10 for SCNN1G, and no Liddle syndrome content, consistent with the report being about the intended disease.

    GeneReviews: just check-genereviews --online returned NO_CHAPTER for GeneReviews and StatPearls after synonyms were added.

    Artifacts: the _artifacts directory holds only final_report.html and final_report.pdf, which duplicate the markdown report, so they were not committed.

    Orphanet: ORPHA:171876 was fetched with just fetch-reference; the Orphadata files on disk had drifted from the manifest pin, so the cache file is stamped with release 2026-06-23 rather than the pinned snapshot date. The manifest was not repinned.

    Validation: just validate, validate-terms, count-verified-snippets (99/99), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-coarse-phenotypes, check-snippet-grading, check-retired-support-prose, check-reference-titles, normalize-cache, check-term-cache-integrity and validate-disorders all passed.

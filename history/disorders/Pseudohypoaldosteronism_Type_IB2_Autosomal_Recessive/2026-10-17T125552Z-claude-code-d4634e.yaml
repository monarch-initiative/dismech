  summary: Bind the sweat chloride and sodium panel to the sweat test
  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:74993-7 (chloride and sodium panel, sweat) to the sweat test row. The panel was chosen over either electrolyte alone because the row says elevated sweat electrolytes without singling one out and ENaC loss raises both. Two traps in the release were avoided: its sweat chloride codes include a toxicology-screen method pair measuring something else, and the word sweat matches about twenty questionnaire items about sweating in instruments such as PROMIS, FACIT, PCL and the PHQ, none of which is a sweat assay. A narrative code for specialist review of sweat analysis was declined as naming a result field rather than a test. The KG's 38 sweat records were paginated in full and hold one Part, LOINC:LP7618-4, which is the specimen itself; there is no measurement Part for sweat chloride or sweat sodium. No reference range was added: the row reports the test as positive and gives no concentration, and the cystic fibrosis sweat chloride thresholds are a different disease's decision limits.

  details: |
    New entry for MONDO:0011713 (germline CDKN2A, ClinGen Definitive AD), curated from the GeneReviews CDKN2A Cancer Predisposition chapter (PMID:40674536, abstract-only cache) as phenotype baseline plus primary literature. The OpenScientist deep-research report was used as a lead only; every cited PMID was re-fetched into references_cache and every snippet checked against it. Two-hit pathograph: germline CDKN2A first hit, somatic second hit (LOH evidenced in 2 of 7 carrier pancreatic tumors, PMID:14506146), somatic KRAS in pancreatic precursors, p16INK4A-CDK4/6-RB arm and p14ARF-MDM2-p53 arm; the p14ARF arm is recorded as not linked to pancreatic risk per PMID:32482799. Lump/split recorded in notes and a KNOWLEDGE_GAP discussion: entry follows MONDO's split (sibling Melanoma_And_Neural_System_Tumor_Syndrome) against the GeneReviews single-entity view. CDK4 (CMM3) kept as a differential. Validated with just validate, count-verified-snippets (72/72), validate-terms, and the offline gates.

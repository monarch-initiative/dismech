  summary: 'Create: FBXW7-Related_Neurodevelopmental_Disorder'
  details: |
    New entry for MONDO:0859280 (developmental delay, hypotonia, and impaired language; OMIM 620012), the autosomal dominant neurodevelopmental disorder caused by heterozygous germline FBXW7 variants. Deep research was requested from falcon; falcon could not run the job and the --fallback run produced an openscientist report (research/FBXW7-Related_Neurodevelopmental_Disorder-deep-research-openscientist.md; 15/15 references resolved, 0 off topic; just preflight-dr PASS with FBXW7 mentioned 71 times). Phenotype frequencies come from the founding 35-patient cohort (Stephenson 2022, PMID:35395208) as summarized in the 2026 review PMID:42111496, plus the 2026 seven-patient series PMID:42432493 and case reports. The pathophysiology chain runs from FBXW7 haploinsufficiency to impaired SCF(FBXW7) substrate degradation, then NOTCH accumulation in neural stem cells (mouse), c-Jun accumulation in cerebellar neurons (mouse), excess oligodendrocyte progenitor specification (zebrafish) and impaired neuronal function (Drosophila), converging on structural brain anomalies; a separate somatic second-hit branch explains the rare Wilms tumors. A HUMAN_MODEL_MISMATCH discussion records that the downstream mechanisms come from homozygous null models, and that the cerebellum-specific knockout mouse has a small cerebellum while patients most often show cerebellar enlargement; the mouse cerebellar node is therefore not linked to the patient imaging phenotypes. A fresh-context review before the PR led to: delay/ID/hypotonia no longer routed through structural brain anomalies (MRI is normal in a substantial share of patients); the delay frequency now cites the narrower DD-or-ID statistic; the 4q31 CNV explanation no longer claims reduced dosage (one of the two CNVs is a duplication); and added the F-box/SKP1 modelling evidence, recurrent respiratory infections, behavioral difficulties, refractive errors, polymicrogyria, lamotrigine and laxatives. The report's quote attributed to PMID:38169111 (Wilms tumor screening) is not in the cached abstract and was not used. No HPO term exists for megacerebellum, so HP:0001317 is used with the finding in the description. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Validated with just validate (schema, terms, 73/73 snippets) and the offline entity-ref, causal-target, duplicate-key, enum and coarse-phenotype gates. Closes the claim in issue 14631.

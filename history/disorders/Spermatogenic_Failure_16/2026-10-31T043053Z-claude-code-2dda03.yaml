  summary: 'Create: Spermatogenic_Failure_16'
  details: |
    New entry for spermatogenic failure 16 (MONDO:0014961, OMIM 617187), curated
    from stub Spermatogenic_Failure_16 as a DISEASE: a single-gene Mendelian
    disorder with its own MONDO and OMIM records.

    Gene identity: MONDO's causal-gene restriction, its OMIM xref and every
    primary report name SUN5 (hgnc:16252, looked up in HGNC REST). The disease
    is SUN5-related acephalic spermatozoa syndrome, not SPATA16
    globozoospermia, which is a different spermatogenic failure number. The
    name was kept as the MONDO label because no gene-related name is
    established (entry-naming procedure step 7).

    Deep research: one openscientist report
    (research/Spermatogenic_Failure_16-deep-research-openscientist.md)
    completed on the first run. Its 16 references all resolved; 4 of 13 quotes
    did not match their cited abstracts and several suggested NCIT and HP
    CURIEs were mislabelled, so no quote or CURIE was copied from it.
    just preflight-dr returned PASS (SUN5 named 100 times, OMIM 617187
    matches). The report was used as a cross-check; the entry was built from
    PubMed abstracts and PMC full texts fetched with just fetch-reference.

    Content: four pathophysiology nodes (Loss of SUN5 Protein, Disrupted SUN5
    Nuclear Envelope Anchoring Complex, Defective Sperm Head-Tail Coupling,
    Impaired Germ Cell Nuclear mRNA Export) with edge-level evidence; three
    phenotypes (male infertility, acephalic spermatozoa, abnormal sperm neck
    morphology); SUN5 genetics with case fractions from three cohorts; the
    Sun5 knockout mouse; diagnosis, differential diagnosis against SPGF26
    (TSGA10) and SPGF31 (PMFBP1); ICSI and genetic counseling. The node name
    Defective Sperm Head-Tail Coupling matches Spermatogenic_Failure_26. No
    mechanism module covers the head-tail coupling apparatus, so no
    conforms_to was declared. The mRNA export node is mouse-only and has no
    phenotype edge.

    MONDO's text definition calls this disease an azoospermia; patients make
    spermatozoa, so this is recorded in notes as a candidate upstream
    correction. No GeneReviews chapter (just check-genereviews --online:
    NO_CHAPTER) and no ClinGen assertion for SUN5.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (54/54) and just validate-disorders all passed, as did the offline
    whole-repo gates and just check-snippet-grading.

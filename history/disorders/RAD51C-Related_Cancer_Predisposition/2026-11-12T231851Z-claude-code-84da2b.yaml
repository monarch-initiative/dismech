  summary: 'Create: RAD51C-Related Cancer Predisposition'
  details: |
    De novo curation of MONDO:0700273 from one OpenScientist deep-research report (research/RAD51C-Related_Cancer_Predisposition-deep-research-openscientist.md; 31/31 references resolved, confabulation_rate 0.0) plus the ClinGen Hereditary Cancer GCEP Definitive assertion and the studies it names. Scoped to the monoallelic autosomal dominant predisposition, following ClinGen's split of Fanconi anemia complementation group O (MONDO:0013248) into a separate curation; FANCO is recorded only as a differential diagnosis, and the entry notes that ClinGen rates the recessive arm Limited rather than Definitive, so it is a weaker gene-disease claim and not merely a different one. NO ONTOLOGY IDENTIFIER WAS TAKEN FROM THE REPORT. Its own term validation reported 14 of 30 checked labels mismatched, several naming unrelated concepts: CHEBI:63631 offered for olaparib is topiramate, NCIT:C51686 for salpingo-oophorectomy is Esophageal Biopsy, NCIT:C78844 for rucaparib is Ficlatuzumab, NCIT:C97660 for niraparib is Abemaciclib, MONDO:0011705 for Fanconi anemia complementation group O is lymphangioleiomyomatosis, UBERON:0000996 for the oviduct infundibulum is vagina, and UBERON:0002367 for peritoneum is prostate gland. just preflight-dr separately returned WARN because the report writes HGNC:9820 beside the symbol RAD51, which is RAD51C's identifier rather than RAD51's (hgnc:9817). Every term in this entry was resolved against the committed term caches instead. One MGI identifier written from memory (MGI:1913292) was replaced with MGI:2150020 after resolving mouse Rad51c at the Alliance. Two claims the entry deliberately declines to make: a breast cell of origin, because none is established in the cited sources, so the second-hit node binds only the fallopian tube secretory epithelial cell; and an obligate human TP53 requirement, which the mouse Trp53 data and the TP53-mutant tubal precursor do not establish, so that node is PROVISIONAL. Validated with just validate-disorders (26/26 snippets, 26 titles, 0 issues), validate-terms, check-gene-namespaces-online, check-gene-validity, check-entity-refs, check-causal-targets, check-cancer-origin, check-coarse-phenotypes, check-enum-values, check-duplicate-keys, check-logical-rules, check-name-collisions, check-qualifier-terms and check-block-scalar-comments.

  details: |
    The round-2 review approved the entry and left two optional suggestions; both were real defects and both are taken. First, the saturation-genome-editing snippet from PMID:39299233 stopped at 'we functionally assess 9,188 unique variants, including', while its own explanation claimed the scale of the functional map available for interpreting variants of uncertain significance. The scale is entirely in the clause that was cut, so the quote did not support the explanation attached to it. It now runs through 'including >99.5% of all possible coding sequence single-nucleotide alterations'; the greater-than sign normalizes to 'gt' on both sides of the comparison, so the extended quote verifies, which the snippet count confirms. This is the same defect class as a quote stopping one word before the term it is cited for. Second, the genetic counseling and cascade testing row carried only one evidence item, the ACMG risk-reducing salpingo-oophorectomy recommendation, which supports a surgical offer rather than counselling. The reviewer suggested a counselling or cascade-testing sentence from PMID:41070818 if the resource had one; re-reading the cached record, it has several. The row now cites the resource's statement that variant reclassification and its consequences for cascade testing are themselves a counselling obligation, and its statement that a VUS in RAD51C, RAD51D and BRIP1 must not be used to guide clinical management or predictive genetic testing for family members. The salpingo-oophorectomy sentence is retained for the content of the discussion, with its explanation rewritten to say that the recommendation itself is cited on the risk-reducing surgery row. Snippets verified rose from 31 of 31 to 33 of 33. While applying these changes a reference_title was mistyped as 'American George of Medical Genetics and Genomics', which check-reference-titles would have caught; it was corrected before commit and all three occurrences of that title now match the cached title exactly.

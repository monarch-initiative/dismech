  summary: 'Review round 1: prevalence, frequencies, breast evidence, ACMG management,
    snippet fragments'
  details: |
    First review round on PR #17253, six blocking items. (1) The prevalence record contradicted itself: measure_type CARRIER_FREQUENCY with rate_per_100000 109.5 paired with prevalence_class BELOW_1_IN_1000000, when design decision §8 makes the band report the magnitude of the measure named. The 1-in-913 figure was also a frequency among breast cancer cases rather than in the population. Replaced with the population-control carrier frequency from PMID:32359370, 0.11% against 0.63% in ovarian cancer patients, banded ABOVE_1_IN_1000 at 110 per 100,000 with rate_denominator POPULATION, and notes recording both the correction and that disease occurrence is not what this measures. (2) Ovarian carcinoma was FREQUENT (30-79%) against the entry's own 11% cumulative risk; corrected to OCCASIONAL. (3) The breast relative risk of about 2 and cumulative risk of 21% were stated in prose with no evidence, and the Clonal Expansion to Breast carcinoma edge carried none at all; both figures are now quoted from PMID:32107557 on the phenotype and the relative risk on the edge, and breast frequency is set to OCCASIONAL. (4) The ACMG clinical practice resource was cited for its penetrance classification rather than its recommendation; the RRSO evidence now quotes the recommendation itself including its menopause timing, a new Enhanced breast surveillance treatment quotes the personalized-risk recommendation, and Genetic counseling and cascade testing now carries evidence. (5) Four snippets were fragments cut off before naming RAD51C, which is the #15607 pattern: 'OR = 5.59', 'strongly associated with signature 3' used twice, '9,188 unique variants, including' and an ovarian cumulative-risk quote stopping at 11%. All four extended so each names the gene and supports its claim standing alone. (6) Three tracked reference caches had been rewritten out of scope and were reverted to origin/main: PMID_30099541 and PMID_38461085 are not cited by this entry and PMID_33471991 is cited by others; the entry's snippet from PMID_33471991 still verifies against the origin/main text. Suggestion taken: no source cached for this entry reports a platinum result in RAD51C-deficient disease, so the node was renamed from 'Platinum and PARP-Inhibitor Sensitivity' to 'PARP-Inhibitor Sensitivity' and now states that platinum sensitivity is not claimed, as the sibling PALB2 entry does. One defect of my own was introduced and caught before pushing: an unquoted colon inside a plain scalar explanation broke the YAML, which validate-disorders surfaced as 'Snippets checked: 0' rather than as a pass. Re-validated: validate-disorders 31/31 snippets and 31 titles with 0 issues, plus validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-enum-values, check-logical-rules, check-name-collisions, check-qualifier-terms and check-block-scalar-comments. Note on CI: the test (3.13) gate 'Check for new short evidence snippets' fails on this branch for findings in Gaucher_Disease_Due_To_Saposin_C_Deficiency, Niemann-Pick_Disease_Type_B and Primary_Polyarteritis_Nodosa, none of which this branch touches.

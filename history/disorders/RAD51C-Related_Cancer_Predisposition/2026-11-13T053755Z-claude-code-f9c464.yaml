  details: |
    The round-3 review approved the entry and left one further suggestion, which is the third instance in this run of a single underlying mistake: choosing the clause of a sentence that states the conclusion and dropping the clause that carries the content. The counselling evidence item added in the previous round quoted PMID:41070818 from 'underscoring the importance of discussing these potential updates between clinicians and individuals during testing', while its explanation said the resource treats variant reclassification and its consequences for cascade testing as a counselling obligation. The quote contains neither 'reclassification' nor 'cascade testing'; 'these potential updates' is a back-reference that says nothing on its own, so the quote did not support the explanation attached to it. The snippet now begins at 'This reclassification, particularly if a VUS is upgraded, could change the clinical implications both for early detection and risk-reducing interventions, as well as advice on cascade testing', carrying both terms the explanation relies on. The explanation is unchanged because it was already an accurate description of the sentence; only the span quoted was wrong. Snippets verified remain 33 of 33. No reference, ontology term, binding or evidence grade changed. Worth recording for future curation: no gate catches this class. check-snippet-length passes a long quote, exact-match verification passes any true quote, and only reading a snippet against its own explanation shows that the span chosen does not contain the claim. The same defect was corrected twice earlier in this entry's review history, on the saturation-genome-editing snippet and on the EBV snippet in the sibling IKZF3 entry.

  summary: Link smoking as lung modifier and infection only as far as clustering allows
  details: |
    Backfill for issue #8085. Cigarette smoking is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES into Alveolar capillary-wall disruption. Exacerbating rather than triggering is the substantive call here: this exposure does not cause the disease, the autoantibody is already being made, and smoking decides whether the lung is involved at all. The target is the alveolar capillary wall because that is the barrier in question, and the intermediates are recorded as known on the well-mapped route in which smoke injures that barrier and permits circulating antibody to reach the alveolar basement membrane. No cited sentence states that step, so the item is PARTIAL: it reports pulmonary disease significantly associated with current smoking, which reaches the clinical expression of the node rather than the wall disruption, and as an association within a case series it cannot separate smoking as cause of lung involvement from smoking as a marker of who gets it. Infection as a possible environmental trigger is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into HLA-restricted loss of tolerance and anti-GBM IgG production, chosen because the cited sentence conditions its claim on genetic susceptibility and that node carries the HLA restriction. It is predisposing rather than triggering despite the sentence containing the word trigger, because the sentence hedges twice, saying clustering suggests environmental factors may trigger disease, and the exposure's own name calls infection possible. The intermediates are unknown in the strict sense: no organism is named and no route from infection to autoantibody production is given.

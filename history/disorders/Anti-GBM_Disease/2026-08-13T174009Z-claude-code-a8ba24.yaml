  summary: Link smoking as lung modifier and infection only as far as clustering allows
  details: |
    Backfill for issue #8085. Cigarette smoking is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES into Alveolar capillary-wall disruption. Exacerbating rather than triggering is the substantive call here: this exposure does not cause the disease, the autoantibody is already being made, and smoking decides whether the lung is involved at all. The target is the alveolar capillary wall because that is the barrier in question, and the intermediates are recorded as known on the well-mapped route in which smoke injures that barrier and permits circulating antibody to reach the alveolar basement membrane. The link originally carried a single PARTIAL item reporting pulmonary disease significantly associated with current smoking, which reaches the clinical expression of the node rather than the wall disruption. The reviewer of PR #8428 suggested the classic Donaghy and Rees Lancet 1983 series as a stronger citation and asked that the PMID be verified before use; it was confirmed as PMID:6140495 by two independent PubMed queries and fetched with just fetch-reference. Three sentences from it are now carried. All 37 cigarette smokers in that series had lung haemorrhage against 2 of 10 non-smokers. The antibody titres did not differ between smokers and non-smokers, which is the item that decides the target: smoking is not acting on the autoantibody arm at all, so the edge belongs on the alveolar capillary wall and not on the loss-of-tolerance node upstream. One patient resumed smoking and the lung haemorrhage returned, a within-patient rechallenge and the strongest causal design in this entry. The original association item is retained at PARTIAL. Infection as a possible environmental trigger is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into HLA-restricted loss of tolerance and anti-GBM IgG production, chosen because the cited sentence conditions its claim on genetic susceptibility and that node carries the HLA restriction. It is predisposing rather than triggering despite the sentence containing the word trigger, because the sentence hedges twice, saying clustering suggests environmental factors may trigger disease, and the exposure's own name calls infection possible. The intermediates are unknown in the strict sense: no organism is named and no route from infection to autoantibody production is given.

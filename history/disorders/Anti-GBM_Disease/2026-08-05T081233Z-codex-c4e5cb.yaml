  summary: 'Publication-readiness review: Anti-GBM Disease'
  details: |
    Full publication-readiness review through 2026-08-05. Corrected claim-evidence mismatches and causal direction; split renal and pulmonary outcomes; connected all retained phenotypes and both genes; added structured incidence, natural history, atypical seronegative diagnosis, current treatment evidence, experimental models, and explicit knowledge gaps. Updated GOOD-IDES-02 to TERMINATED after checking the live registry (sponsor decision, not safety; actual enrollment 50; no posted results). D2P audit disposition: retained the seven focused local phenotypes and connected all seven; did not duplicate anti-GBM/anti-MPO positivity because these are represented as biochemical markers; did not add generic autoimmunity, glomerulopathy, or vasculitis because they are redundant disease/mechanism abstractions; did not promote biopsy, BAL, imaging, or pulmonary-function findings to top-level phenotypes because they belong in diagnostic/histopathologic contexts and the cached abstracts do not support all suggested exact claims; did not import broad symptom lists from the old 29-case source because its cached abstract does not contain the surfaced percentages; rejected persistence of primary teeth and retinal detachment as unsupported/non-core source artifacts; retained broad hematuria because exact evidence did not justify macroscopic hematuria. Smoking-specific claims were removed because available cached evidence supported only a general environmental-trigger framework. No claims were added merely to fill datasets or ontology-term gaps.

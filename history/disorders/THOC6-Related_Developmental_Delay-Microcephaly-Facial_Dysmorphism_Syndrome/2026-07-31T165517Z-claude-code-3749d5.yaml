  summary: Address ai4c-reviewer REQUEST_CHANGES on PR 7229
  details: |
    Split the bundled TREX/mis-splicing pathophysiology node into three atomic nodes (Impaired TREX Tetramer Assembly -> Widespread mRNA Mis-Splicing -> Disrupted Proliferative-to-Neurogenic Transition Signaling), consuming the previously unused corticogenesis-signaling sentence from PMID:38388531. Extended the pathograph so the impaired-corticogenesis node reaches the defining phenotypes (intellectual disability, global developmental delay) in addition to microcephaly and corpus callosum agenesis. Split the mixed human+mouse mis-splicing evidence: human export-negative finding IN_VITRO, mouse-inclusive mis-splicing MODEL_ORGANISM. Added a diagnosis-adjacent renal-specificity phenotype (HP:0000122 Unilateral renal agenesis) plus HP:0000670 Carious teeth, HP:0000689 Dental malocclusion, HP:0000750 Delayed speech and language development. Split the bundled supportive-care treatment into four correctly-typed treatments (BEHAVIORAL developmental support with surveillance evidence, DEVICE gastrostomy and hearing aids, SURGERY malformation repair). Fixed cellular_components term to GO:0000346 transcription export complex for the TREX node. Added ClinGen CGGV Definitive validity assertion to genetic and a CARRIER_FREQUENCY prevalence record for the Hutterite founder variant; added biological_scale tags and radial glial cell. All snippets verified against cached abstracts; just validate passes.

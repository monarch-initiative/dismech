  details: |
    De-novo curation of Beaulieu-Boycott-Innes syndrome / THOC6 intellectual disability syndrome, MONDO:0013362. Deep research via claude_code provider after falcon/Edison returned HTTP 402. GeneReviews baseline PMID:32790266 cross-referenced for phenotypes. Pathophysiology combines the classical THO/TREX role PMID:23621916, PMID:30476144 with the 2024 mechanism refinement PMID:38388531 showing TREX-tetramer disruption and mRNA mis-splicing rather than a bulk-export defect in human neural cells. Added a HUMAN_MODEL_MISMATCH discussion contrasting mouse embryonic lethality with human survival. 20 phenotypes with HPO terms and verified GeneReviews/primary-literature snippets, an ultra-rare prevalence record, and supportive treatment. Validation: just validate schema+terms+references pass; weighted compliance 98.2 percent.

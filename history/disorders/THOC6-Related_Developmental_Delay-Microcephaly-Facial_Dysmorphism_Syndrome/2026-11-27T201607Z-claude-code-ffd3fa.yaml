  summary: Address review on PR 18151
  details: |
    Removed the five edges from the neural-progenitor node to atrial septal defect, ventricular septal defect, unilateral renal agenesis, abnormal renal morphology and short stature, because the node records only neural progenitor cell types and processes and no source gives a non-neural mechanism. Reworded the hydrocephalus edge so it no longer asserts aqueductal involvement, which no source mentions. Removed the surgery target_mechanisms link to the progenitor node; surgery repairs structural phenotypes and does not act on progenitor dynamics. Removed the unsourced GO:0005515 protein binding and GO:0003723 RNA binding molecular functions; the THOC6 gene-activity grounding finding is already in the baseline. Added NCIT:C16830 Medical Device -> NCIT:C183182 Hearing Aid as a qualifier on the hearing-aid treatment.

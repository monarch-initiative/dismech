  summary: 'Upgraded Familial Hyperaldosteronism Type I curation for issue #3582: added classifications,
    GO molecular functions on CYP11B1-CYP11B2 chimeric gene formation, edited the Preeclampsia
    phenotype and its snippet, expanded diagnosis and differential_diagnoses, and populated structured reference findings.'
  details: Added classifications (endocrine, cardiovascular, and Mendelian disease) and GO molecular_functions
    (GO:0004507 steroid 11-beta-monooxygenase activity, GO:0004497 monooxygenase activity) on CYP11B1-CYP11B2
    chimeric gene formation. Removed the Preeclampsia phenotype_term block and its explanation (HP:0100602
    was not bound; it is outside the PhenotypeTerm enum) and lengthened short ORPHA:403 table snippets
    on Preeclampsia and Caesarean section. The follow-up review round restores the Preeclampsia block and
    moves the molecular function. Expanded diagnosis to include aldosterone-to-renin ratio screening
    (NCIT:C124338) and dexamethasone suppression testing alongside CYP11B1/CYP11B2 chimeric gene molecular
    testing. Added differential diagnoses (FH-II MONDO:0011576, FH-III MONDO:0013359, FH-IV MONDO:0014875,
    sporadic primary aldosteronism MONDO:0001422, Liddle syndrome MONDO:0008323, and apparent mineralocorticoid
    excess MONDO:0009025) and structured reference entries for PMID:26934393 and PMID:35778363.

  summary: 'Address review on PR 14702: restore unbound Preeclampsia, fix Orphanet
    snippet, move and correct GO MF, bind FH-III/FH-IV'
  details: |
    Restored phenotype_term (preferred_term only) and the explanation on Preeclampsia; HP:0100602 lies outside the PhenotypeTerm dynamic enum, so it stays cited in evidence rather than bound. Replaced the Caesarean section snippet with the full ORPHA:403 row (Orphanet spells it Caesarian). Removed GO:0004507 and GO:0004497 from the chimeric gene formation node, a recombination event with no enzymatic activity, and added GO:0047783 corticosterone 18-monooxygenase activity (INCREASED) on ACTH-regulated aldosterone synthase expression, with two PMID:1731223 evidence items for the ectopic aldosterone synthase activity in zona fasciculata. Bound MONDO:0013359 and MONDO:0014875 on the FH-III and FH-IV differentials. Dropped the FH-IV 'not ACTH-regulated' distinguishing feature, which the cited sentence does not support, and added the ORPHA:403 definition row as evidence for elevated 18-oxocortisol and 18-hydroxycortisol in the dexamethasone diagnosis row. No NCIT diagnosis_term was added for dexamethasone suppression testing: an OLS NCIT search for 'dexamethasone suppression' returned no hits. Liddle syndrome and apparent mineralocorticoid excess differentials remain uncited. Provenance carried over from the notes field this PR replaced: deep-research attempts with the falcon and openai providers stalled without producing output and were terminated; curation used the structured Orphanet cache and fetched PubMed abstracts. Validated with just validate, validate-terms, count-verified-snippets (58/58), check-folded-hyphens, gene-activity grounding, retired-support-prose and snippet-length checks.

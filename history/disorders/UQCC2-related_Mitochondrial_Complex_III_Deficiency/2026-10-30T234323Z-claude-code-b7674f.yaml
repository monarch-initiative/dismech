  summary: 'Create: UQCC2-related mitochondrial complex III deficiency'
  details: |
    New entry for mitochondrial complex III deficiency nuclear type 7 (MONDO:0014356), the UQCC2 complex III assembly-factor disorder. Duplicate preflight before claiming: no kb/disorders or kb/groupings entry, claim issue, or open PR mentioned UQCC2 or the MONDO ID; the claim is issue 16095. Curated from the two published patient reports (PMID:24385928, the discovery family with full text; PMID:28804536, the second family with full text) and one mechanistic study of the COMA cytochrome b assembly complex (PMID:35977508, abstract). Pathograph: UQCC2 loss, loss of the mutually dependent UQCC1-UQCC2 complex, defective cytochrome b synthesis, complex III assembly failure, secondary complex I reduction through supercomplex loss, and impaired electron transport, wired to lactic acidosis, proximal renal tubular acidosis, seizures, intrauterine growth retardation and developmental delay. Edges from electron transport failure to tissue phenotypes are marked INDIRECT_UNKNOWN_INTERMEDIATES because neither report studies tissue mechanism. No phenotype frequencies are recorded because there are two patients. Neonatal death (HP:0003811) was dropped as a phenotype because it is outside the PhenotypeTerm enum; the death is recorded in the respiratory phenotype description. The splice-allele severity hypothesis is a KNOWLEDGE_GAP discussion. Validated with the pre-edit hook (schema and terms), 58/58 snippets verified against cached references, and the offline whole-repo gates.

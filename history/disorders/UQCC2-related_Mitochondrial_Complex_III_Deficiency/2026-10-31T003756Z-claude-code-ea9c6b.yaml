  summary: 'Review round 1: record patient search, split bundled node name'
  details: |
    Answers the automated review of PR 16111. Blocking item: the claim that only two patients are published had no recorded search. Six PubMed esearch queries were run on 2026-10-31 and are now written verbatim in notes with their record counts: UQCC2 (19), UQCC2 tiab AND patient/mutation/variant tiab (10), complex III deficiency AND UQCC2 (5), the MONDO label phrase (1, a UQCRB nuclear type 3 patient), MNF1 tiab AND complex III (1, a livestock paper), C6orf125 (0). Only PMID:24385928 and PMID:28804536 report UQCC2 patients, so the phenotype and allele sections stand. Suggestions taken: the node Loss of Complex III-Containing Supercomplexes and Secondary Complex I Deficiency was renamed to Loss of Complex III-Containing Supercomplexes, with its downstream and reports_on targets updated, since the complex I reduction is already its own phenotype; the edge from Complex III Assembly Failure to it is now DIRECT; the enzymology diagnosis row binds NCIT:C51895 Muscle Biopsy instead of NCIT:C18020 Diagnostic Procedure, with the procedure in preferred_term.

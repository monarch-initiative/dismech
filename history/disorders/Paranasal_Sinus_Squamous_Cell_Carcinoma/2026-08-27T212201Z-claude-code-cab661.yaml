  summary: Link occupational exposures into the pathograph and add nickel exposure
  details: |
    Wired the existing occupational exposures into the pathograph and added the nickel exposure the umbrella issue (9036) calls out for the squamous histology.

    Before this change the environmental entries carried ECTO exposure_terms but no influences_mechanisms, so they rendered as disconnected list entries rather than as initiating nodes of the pathograph. Both established exposures now carry an influences_mechanisms TRIGGERS edge into the Carcinogen-Induced Sinonasal Epithelial Injury node, each with its own evidence separate from the entry-level evidence.

    Added: Occupational Nickel Compound Exposure (ECTO:9000063), with a Finnish nickel-refinery cohort giving the sinonasal cancer excess in the most heavily exposed work site and an independent pooled meta-analytic estimate for nickel and chromium compounds. Expanded the wood dust description to state that the pooled association is far stronger for adenocarcinoma than for squamous carcinoma, so wood dust is not misread as the dominant driver of this histology.

    Deliberately not changed: the Tobacco Smoking exposure was left unlinked to any pathophysiology node, and a note records why. It has no pooled sinonasal-specific risk estimate in the occupational meta-analysis cited here, and the occupational-epidemiology literature treats lifestyle factors as a minor contributor to sinonasal cancer relative to the occupational carcinogens; an influences_mechanisms edge would have overstated the evidence.

    Validation: just validate passed on schema, terms and references; snippets 17/24 verified against cached references, 7 skipped by prefix (clinicaltrials NCT references, which the reference validator skips by configuration).

  summary: Review and enrich Paranasal_Sinus_Squamous_Cell_Carcinoma
  details: >-
    Added MONDO and clinical synonyms; added ICD-O Squamous Cell Carcinoma morphology, Harrison's chapters, and ILO/EU occupational wood-dust and nickel-compound cancer classifications; added structured RARE prevalence; grounded TP53 and CDKN2A somatic loss-of-function activity (GO:0003700, GO:0004861), squamous epithelial cell type (CL:0000076), paranasal sinus location (UBERON:0001825), and biological scales while preserving grouping and pathograph anchors; wired Local Invasion and Bony Destruction downstream to all eight clinical phenotypes including added Facial Paresthesia (HP:0003401) and Lymphadenopathy (HP:0002716); added SOMATIC_DRIVER and SOMATIC origin on TP53 and CDKN2A; enriched platinum-based chemotherapy (cisplatin, carboplatin, NCT05027633), treatment target_mechanisms, endoscopic biopsy NCIT binding, and p16 immunohistochemistry (NCIT:C23020).

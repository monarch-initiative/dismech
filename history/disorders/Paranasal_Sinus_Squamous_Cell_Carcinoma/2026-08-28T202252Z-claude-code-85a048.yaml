  summary: Restore entry-level evidence on the wood dust exposure (CI gate fix)
  details: |
    Response to the blocking CI failure on PR #9766.

    The influences_mechanisms restructure earlier in this PR dropped the entry-level evidence: block from the "Occupational Wood Dust Exposure" environmental entry. The exposure was left carrying only mechanism-nested evidence, which is not what scripts/check_environmental_evidence.py counts, so the gate went red with "New evidence-free environmental: exposure(s) detected". The removal was collateral damage from the restructure, not a deliberate retraction - the exposure was otherwise unchanged.

    Restored with two pooled estimates from the Binazzi meta-analysis (PMID:25885319), both previously uncited, both of which the exposure's own description already asserted: the squamous RRpooled 1.46 (95% CI 1.01-2.1) and the adenocarcinoma RRpooled 29.43 (95% CI 16.46-52.61). Taking both from one meta-analysis means the histology-dependent contrast the description draws is cited from a single comparable source rather than assembled across studies with different designs.

    Validation: just check-environmental-evidence now reports "OK: no new evidence-free environmental: exposures". just validate passes; just count-verified-snippets reports 19/26 verified, 7 skipped by prefix (the pre-existing clinicaltrials: references). Both new snippets were also confirmed by hand as exact substrings of the cached reference, including the bracketed percent spans, which the validator's literal_bracket_patterns retain rather than strip.

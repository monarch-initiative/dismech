events:
- type: EDIT
  outcome: changed
  sections:
  - biochemical
  summary: Add the plasma ornithine biochemical entry
  details: |
    PR review finding 6. Plasma ornithine is the defining diagnostic analyte, the treatment target and the trial endpoint, but was modelled only as a phenotype and a pathophysiology node, never as the measurable analyte. Added a biochemical entry with the 18-135 micromol/L reference interval, which was already quoted verbatim in an existing evidence snippet and so needed no new research, plus interpretation bands anchored on the 500 micromol/L level at which visual field decline appeared to stabilise. That threshold is explicitly recorded as a single uncontrolled observation rather than a validated target.

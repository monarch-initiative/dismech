  summary: Merge duplicate gyrate atrophy entry into this one
  details: |
    PR review found that kb/disorders/Gyrate_Atrophy_of_the_Choroid_and_Retina.yaml, added earlier in this PR, bound the same MONDO term as this entry (MONDO:0009796). Verified independently: this entry has carried 'gyrate atrophy of the choroid and retina' in its synonyms block since April, and MONDO records both names as EXACT synonyms of the one term with no separate gyrate-atrophy concept to split on, so the duplicate could not stand. Section-by-section diff showed the new file was close to a strict subset of this one - fewer pathophysiology nodes, fewer phenotypes, fewer treatments, and no diagnosis/clinical_trials/datasets/differential_diagnoses. Five items were genuinely absent here and were ported: HP:0011003 high myopia and HP:0030856 posterior staphyloma (this entry bound only the parent HP:0000545 myopia); reference_ranges on the plasma ornithine marker with a normal 18-135 micromol/L interval and three interpretation bands, where the 500 micromol/L retinal-stabilization figure is explicitly flagged as a single uncontrolled observation rather than a validated target; a KNOWLEDGE_GAP discussion on retinal tissue specificity with a proposed RPE dose-response experiment, retargeted to this entry's node names; and conforms_to photoreceptor_degeneration#Rod Photoreceptor Apoptosis on the chorioretinal degeneration node, this entry's first conformance edge. The duplicate file was removed and its three history records moved under this slug with target.superseded_by.

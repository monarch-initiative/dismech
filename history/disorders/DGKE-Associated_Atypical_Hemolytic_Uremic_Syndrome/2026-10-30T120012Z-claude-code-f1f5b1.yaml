  summary: 'Create: DGKE-Associated Atypical Hemolytic Uremic Syndrome'
  details: |
    De novo curation of DGKE-associated atypical hemolytic uremic syndrome (MONDO:0100590), a complement-independent recessive thrombotic microangiopathy. Curated as a distinct disorder rather than a subtype of the complement-scoped Atypical_Hemolytic_Uremic_Syndrome entry. Branched pathograph: DGKE loss of function -> sustained DAG/PKC signalling -> (prothrombotic glomerular endothelial phenotype -> glomerular thrombotic microangiopathy) and (podocyte injury). All eight phenotypes wired. Anchor references PMID:23542698 (Lemaire 2013, founding report, full text), PMID:23274426 (Ozaltin 2013, MPGN-like), PMID:25498910 (Bruneau 2015, complement-independent endothelial mechanism), PMID:20301541 (aHUS GeneReviews chapter, baseline), PMID:25135762 (combined DGKE+complement modifier nuance). No DGKE-specific GeneReviews chapter exists; broad aHUS chapter used as baseline. Deep research requested falcon, fell back to openscientist (no EDISON key); report corroborated the mechanism and added the combined-mutation modifier nuance, no new human patient series. preflight-dr PASS (DGKE dominant; C3 mentions are complement-context). Validated: just validate (30/30 snippets, terms, title), validate-disorders, check-entity-refs, check-causal-targets, check-snippet-grading (cross-file clean), check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-reference-titles. Weighted compliance 91.5%.

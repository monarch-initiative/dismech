  summary: 'Review round 1: add VEGFR2/PGE2 branch, animal models, diagnosis, prevalence'
  details: |
    Addressed the automated review (CHANGES_REQUESTED) on PR #16094 in one push. Added the second mechanistic branch (PI-cycle/PIP2 shortage -> impaired VEGFR2/Akt -> reduced COX-2/PGE2 -> glomerular TMA; rerouted podocyte injury off the PI-cycle node), citing PMID:33986189 and PMID:26887830 as MODEL_ORGANISM. Added animal_models (endothelial-specific and global Dgke-KO mice) with modeled_mechanisms, a diagnosis block (DGKE molecular testing; GeneReviews gene list PMID:20301541 + PMID:37994143 signature; normal C3 discriminator), prevalence (ANNUAL_INCIDENCE 0.009/million/year PMID:32386968), frequency qualifiers and two new phenotypes (hypoalbuminemia, hypercholesterolemia 6/12 from the PMID:36988693 cohort), a plasma-infusion treatment and a preclinical PGE2-analog treatment with target_mechanisms, split the complement modifier record into HGNC-bound C3/THBD records, added ACE-inhibitor/ARB therapeutic_agent, strengthened DAG/PKC node evidence, added edge evidence, and recorded the rodent WT1/CD31 localization caveat. Declined one suggestion: kept 'DGKE is found in endothelium...' and the DAG/PKC sentence as HUMAN_CLINICAL to satisfy the cross-file snippet-grading gate against Atypical_Hemolytic_Uremic_Syndrome.yaml (changing only this file would fail the gate; the other entry is out of scope). All phenotypes (10/10) causally connected. Validated: validate-disorders, validate-terms, check-snippet-grading (cross-file clean), entity-refs, causal-targets, model-scale-audit, duplicate-keys, enum-values, coarse-phenotypes, qualifier-terms, delivery-system. Weighted compliance 98.1%.

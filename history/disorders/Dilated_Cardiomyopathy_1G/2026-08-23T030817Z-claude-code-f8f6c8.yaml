  summary: 'Create: Dilated Cardiomyopathy 1G (TTN)'
  details: |
    Curated CMD1G (TTN, MONDO:0011400), the single commonest genetic cause of dilated cardiomyopathy (~25% familial, ~18% sporadic; ClinGen Definitive). Four-node pathograph: A-band TTN truncating variant -> sarcomere insufficiency and impaired mechanosensing -> ventricular dilation and systolic dysfunction -> heart failure and arrhythmic risk; conforms to cardiomyopathy_maladaptive_remodeling at trigger, remodeling and structural-impairment nodes. Positional-pathogenicity caveat preserved (TTNtv occur in the general population; A-band location determines pathogenicity) along with the unresolved A-band-elements-vs-truncated-length question (PMID:25589632) and the ascertainment caveat on penetrance. Deleted stub. 13 snippets verified; schema, terms and all offline CI gates pass.

  summary: 'Genetics pass: pharmacogenomic loci wired, over-broad MONDO anchor replaced,
    13 congenital neutropenia subtypes declined'
  details: |
    Genetics pass for the d2g series-028 gap list, and a corrected ontology anchor.

    The gap list proposed thirteen gene-defined congenital neutropenia syndromes as
    subtypes of this entry. All thirteen were declined. This entry models an
    acquired drug toxicity; those are germline Mendelian disorders of
    granulopoiesis present from birth and independent of any drug, and dismech
    already models one of them as its own Disease entry
    (Severe_Congenital_Neutropenia_1_Autosomal_Dominant, MONDO:0042490), with stubs
    open for two more.

    They reached this entry through the ontology anchor rather than through
    biology. The entry bound MONDO:0001475 neutropenia as its disease_term, and all
    thirteen are is_a descendants of that term, so the binding asserted identity
    with the general neutropenia class. This is the pattern dismech#12184
    describes. MONDO was searched for a drug-induced or chemotherapy-induced
    neutropenia class and has none, so the binding was removed and MONDO:0001475 is
    now recorded as a skos:broadMatch cross-reference with the searches written
    into the mapping justification and a MISSING consistency record. This follows
    the HHV-8-Associated_Multicentric_Castleman_Disease precedent, including the
    choice of broadMatch over narrowMatch so the general concept is not retired
    from the curation queue.

    The genetics that are real for this disease are pharmacogenomic. The entry
    previously carried one gene, UGT1A1, which reached no pathophysiology node. A
    new upstream node, Host pharmacogenetic variation in cytotoxic drug
    inactivation, now carries UGT1A1, DPYD, TPMT and NUDT15 and feeds the
    progenitor-injury trigger node. The genetic section grew from one record to
    four, each a RISK_FACTOR germline relationship with neutropenia-specific or
    myelosuppression-specific evidence: UGT1A1 gained the *6 allele and its
    meta-analysis, DPYD the grade IV neutropenia risk and the IVS14+1G>A allele,
    NUDT15 the mercaptopurine neutropenia odds ratio from an acute lymphoblastic
    leukaemia meta-analysis, and TPMT the CPIC guideline statement.

    The GeneReviews baseline check matches ELANE-Related Neutropenia against this
    entry on the word "neutropenia" alone; the entry notes record why that chapter
    is not this disease's, and there is no GeneReviews chapter for
    chemotherapy-induced neutropenia.

  summary: Model cell-cycle-dependent progenitor vulnerability; add trilaciclib myeloprotection
  details: |
    Added a pathophysiology node for the cell-cycle dependence of progenitor vulnerability, which the entry previously stated in the trigger node's prose ('rapidly proliferating') without modelling. It earns node status because it is pharmacologically addressable and separable: holding progenitors in G1 protects them from an otherwise unchanged chemotherapy exposure, which is evidence that the cycling state is a distinct causal step rather than a restatement of drug delivery.

    Added trilaciclib, the CDK4/6 inhibitor approved in the USA in February 2021 for myeloprotection in extensive-stage SCLC, with target_mechanisms INHIBITS onto that node. Gave the existing G-CSF treatment a target_mechanisms link (RESTORES) onto bone marrow granulopoietic suppression. The two drugs now attach at mechanistically distinct points, which is the substantive distinction between them: trilaciclib prevents the injury by removing progenitors from cycle beforehand, G-CSF accelerates recovery after the injury has occurred. Neither drug previously touched the pathograph.

    Tagged biological_scale on all five nodes.

    therapeutic_agent is deliberately omitted from the trilaciclib entry, with a notes line explaining why: no verified CHEBI or NCIT CURIE was available from the local caches and the ontology service was unreachable at curation time. A guessed identifier would be worse than none.

    Three defects of my own were caught by the validators during curation and are worth recording. A CL:0008001 label typed from memory as 'hematopoietic multipotent progenitor cell' instead of the canonical 'hematopoietic precursor cell'. A duplicate description key created when an edge rewrite left the original description dangling under the new edge - caught by the ruamel-based validator while yaml.safe_load silently kept the last value, which is the dismech#8623 pattern exactly. And a reference_title truncated from a search result rather than copied from the cache; the fix regenerated every title in the file programmatically from its cache file, which confirmed only that one was wrong.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (14/14), just check-duplicate-keys, and a graph build showing 7 edges, no integrity issues, and only the trigger node without an incoming edge.

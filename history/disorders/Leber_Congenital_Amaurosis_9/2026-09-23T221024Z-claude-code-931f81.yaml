  details: |
    New entry for MONDO:0012056 (NMNAT1, OMIM:608553), taken from the stub queue (stub deleted). Chosen after ruling out claimed or in-flight candidates. Also skipped: MONDO:0016101 neurolymphomatosis, because its MONDO definition describes avian Marek disease while its xrefs point at the human disease. Deep research was requested from falcon with --fallback. No Edison key was configured, so claude_code produced the report (research/Leber_Congenital_Amaurosis_9-deep-research-claude_code.md, fell_back: true). All 12 of its references resolved. One quote it attributed to PMID:22842230 was not in that paper and was not used. None of its mislabelled term suggestions were used (e.g. HP:0009466, CL:0002588). Evidence comes from the four 2012 Nature Genetics discovery papers and the 158-patient pooled cohort (PMID:34837036) for frequencies. Mouse mechanism work covers the V9M NAD+/PARP/DNA-damage papers, SARM1 conditional deletion, and gene therapy and NAC rescue. The macular lesion is bound to HP:0001116 Macular pseudocoloboma, whose definition matches the non-fissure degenerative lesion. The disagreement between V9M studies on oxidative DNA damage is recorded as a REFUTE item plus notes. SHILCA (MONDO:0031007, NMNAT1 partial duplication) is noted as allelic but not included. The GeneReviews LCA/EOSRD overview (PMID:30285347) is tagged. Validation: just validate passes, 40/40 snippets verified, and check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, coarse-phenotype and the snippet gates are OK. check-genereviews reports TAGGED. 8 of 9 phenotypes causally connected at first draft. A pre-PR red-team subagent review then led to these changes: removed the unsupported NAD-depletion->PARP and PARP->apoptosis edges (PMID:41922335 reports parthanatos not activated; now a REFUTE item) and redrew PARP as DNA-damage-driven NAD+ consumption; moved the patient red-cell NAD measurement off the retina-specific edge; downgraded the SARM1 edge to indirect (complete adult deletion only); renamed the degeneration node and added human foveal-degeneration evidence; rebound the ERG phenotype to HP:0000512 because the cohort reports extinguished or severely reduced ERGs; added hyperopia, posterior subcapsular cataract, nyctalopia and keratoconus from the discovery tables; added the genotype-phenotype spectrum (CORD/RP, missense vs truncating) to notes; retargeted gene therapy to the NMNAT1 node. Final: 53/53 snippets verified, 8 of 13 phenotypes connected.

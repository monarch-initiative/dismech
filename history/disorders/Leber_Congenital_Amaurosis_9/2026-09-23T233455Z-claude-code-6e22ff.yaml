  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 12645. The cataract phenotype is rebound from HP:0000518 to HP:0007787 Posterior subcapsular cataract, matching the source's PSCC. The ERG phenotype is rebound to HP:0030466 Abnormal full-field electroretinogram, since every cited source reports full-field ERG. Added a diagnosis section. Full-field ERG is bound to NCIT:C18020 Diagnostic Procedure, because an OLS search for electroretinography returned no NCIT term. OCT is bound to NCIT:C20828 and NMNAT1 genetic testing to NCIT:C15709. The genetic-testing item covers exome then genome sequencing, and the ARMS assay for p.Glu257Lys. On the PARP node, added the Parp1-knockout REFUTE item from PMID:33709122 and removed the feed-forward wording. The PARP to NAD+ edge got its own evidence item. Declined: supportive-care treatments, photophobia and pupillary reflex, because no cached human source mentions them (grep for low vision, genetic counsel and photophobia across the clinical caches returned 0). The pupillary finding exists only in the mouse model. Validation: just validate passes, 61/61 snippets verified, and all gates are OK.

  summary: 'Create: Immunodeficiency 93 and Hypertrophic Cardiomyopathy (FNIP1)'
  details: |
    De-novo curation of IMD93 / FNIP1 deficiency, MONDO:0030528, OMIM 619705. NEC preflight passed: OAK MONDO record confirms xref OMIM:619705 and RO:0004003 HGNC:29418 FNIP1, plus synonym IMD93; causal gene independently confirmed as FNIP1 against primary literature before any deep-research content was used. Deep research provider: Edison/falcon via just research-disorder falcon; the report was read in full and cross-checked - it named FNIP1 throughout and cited only DOIs that resolve to papers independently fetched and verified, so it passed the NEC and hallucination checks, but it had missed the three most informative human sources and it proposed HP:0005136 for ventricular preexcitation, which OAK shows is actually Mitral annular calcification, so that suggested term was rejected. Curation is therefore anchored on independently fetched primary literature: Saettini Blood 2021 PMID 32905580, Niehues Eur J Immunol 2020 PMID 32181500, Moreno-Corona J Clin Immunol 2023 PMID 37522988, Spivak Immunogenetics 2024 PMID 39537849, Ulas J Pediatr Hematol Oncol 2024 PMID 38748614, Roncareggi review 2025 PMID 40699689, Siggs PNAS 2016 PMID 27303042, Ramirez J Immunol 2019 PMID 31676673, Reyes PNAS 2015 PMID 25548157, and IUIS 2022 PMID 35748970. Modelled an eight-node pathograph running FNIP1 loss of function to dysregulated AMPK/mTORC1 nutrient sensing, then branching to a pre-B-cell metabolic checkpoint failure arm giving absent B cells, agammaglobulinemia and recurrent infection, a cardiomyocyte glycogen accumulation arm giving hypertrophic cardiomyopathy and ventricular pre-excitation as a PRKAG2 phenocopy, and a variable neutropenia arm. Twelve phenotypes, four treatments, three diagnostics, three differential diagnoses, one mouse model, and two discussions. Respected the OMIM/MONDO caveat that rare myopathic and neurologic features are not consistently part of the disorder: these are deliberately NOT curated as core phenotypes and are instead recorded as a KNOWLEDGE_GAP discussion citing the primary statement that they were seen only in consanguineous pedigrees. IUIS category set to predominantly antibody deficiency, sourced from the IUIS 2022 Table 3 row. Validation: just validate, just validate-terms and just validate-references all pass, with 68 of 68 snippets verified against cached references.

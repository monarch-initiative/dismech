  summary: 'Review round 1: Schuurs-Hoeijmakers_Syndrome'
  details: |
    Addressed the first automated review. Added Brain Malformations (HP:0012443, coarse_binding_basis VARIABLE_SPECTRUM, 12 of 16 imaged) and Microcephaly (GeneReviews) as phenotypes, and the remaining facial features of the 19/19 gestalt (ptosis, highly arched and thick eyebrows, long eyelashes, smooth philtrum, downturned corners of mouth, split from wide mouth). Split the HDAC6-to-Golgi chain into an alpha-tubulin and cortactin hypoacetylation node and a dynein transport node, each with its own edge evidence. Added the GeneReviews recurrence-risk snippet to inheritance, scoliosis surveillance and the agents-to-avoid snippet to supportive care, a CASES_IN_LITERATURE prevalence record (87 cases by 2023; the 158 figure in PMID:42794636 spans PACS1, PACS2 and WDR37 together and was not used), separate PACS1 and HDAC6 antisense rows with oligonucleotide_details (2'-MOE gapmer, RNase H), an HDAC6 inhibitor preclinical row, and a C. elegans variant knock-in model. The Drosophila PACS model (PMID:39999877) was not added because it is a loss of the single fly PACS gene, which does not model a gain-of-function allele.

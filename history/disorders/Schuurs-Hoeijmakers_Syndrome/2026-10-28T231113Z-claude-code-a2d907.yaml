  summary: 'Create: Schuurs-Hoeijmakers_Syndrome'
  details: |
    New entry for PACS1 syndrome (MONDO:0014006). Built from one OpenScientist deep-research report (26 of 26 references resolved, 23 on topic; the report is about PACS1 throughout) plus PubMed searches; the GeneReviews chapter PACS1-Related Neurodevelopmental Disorder (PMID:32672908) is the phenotype baseline and is tagged. Pathophysiology is a chain from the Arg203 gain-of-function substitution (NMR and cryo-EM structural work) through enhanced PACS1-HDAC6 interaction, microtubule hypoacetylation and dynein transport failure, Golgi fragmentation, dendrite and synapse changes, to altered cortical network activity, plus side branches for zebrafish cranial neural crest defects and fibroblast extracellular matrix changes. The mouse increase in dendritic arborization is recorded together with a REFUTE item from isogenic human iPSC neurons that showed none. A multi-exon PACS1 deletion family without the syndrome is cited against haploinsufficiency. Preprint versions (PMID:36747781, PMID:41497635) were set aside in favour of the published papers. just preflight-dr was not run to completion because the local MONDO build is absent; the entity check was done by reading. Validation: validate, validate-terms, count-verified-snippets, the whole-repo snippet and title gates, check-snippet-grading, entity-ref, causal-target, coarse-phenotype, logical-rule and enum checks, check-genereviews and validate-disorders.

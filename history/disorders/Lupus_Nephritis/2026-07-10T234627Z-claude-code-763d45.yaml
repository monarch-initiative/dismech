  summary: Augment Lupus Nephritis with pregnancy-specific management
  details: |
    Added pregnancy-specific lupus nephritis management from PMID:42420832, a narrative review in Lupus 2026: teratogenicity and first-trimester contraindication of mycophenolate mofetil; pregnancy-compatible cornerstones hydroxychloroquine and azathioprine; tacrolimus as an acceptable calcineurin inhibitor with therapeutic drug monitoring; cautious rituximab use for life-threatening disease avoiding the third trimester; voclosporin avoidance for lack of pregnancy safety data; belimumab selective use per registry data; low-dose aspirin for preeclampsia prevention. All snippets are exact quotes from the cached abstract; therapeutic_agent terms azathioprine, tacrolimus, rituximab, aspirin verified. Per PR review, evidence_source for the PMID:42420832 items set to OTHER as a narrative review rather than primary clinical data, and unrelated references_cache and cache churn was reverted so the PR is scoped to the disorder file plus its new reference cache.

  summary: 'Create: Lupus Nephritis'
  details: |
    New standalone disease entry for lupus nephritis MONDO:0005556, the immune-complex glomerulonephritis manifestation of SLE, created by the automated curation scanner high-effort tier from lit-scan issue 5981. Models the chain anti-dsDNA/anti-chromatin autoantibodies -> glomerular immune-complex deposition -> complement activation and glomerular inflammation -> graded ISN/RPS glomerular and tubulointerstitial injury as 4 pathophysiology nodes joined by DIRECT causal edges forming a connected component. Five phenotypes glomerulonephritis, nephritis, proteinuria, hypertension, progressive renal insufficiency/ESKD; polygenic inheritance HP:0010982; a period-prevalence record; and five treatments MMF/cyclophosphamide induction, glucocorticoids, belimumab BLISS-LN, voclosporin AURORA 1, hydroxychloroquine. Evidence grounded in Lech and Anders PMID:22192660 full text, the Nat Rev Dis Primers primer PMID:31974366, the BLISS-LN PMID:32937045 and AURORA 1 PMID:33971155 trials, and the trigger review PMID:42413709. NEC preflight passed against the MONDO record. All 21 evidence snippets verified as exact whitespace-normalized substrings of fetched abstracts; schema and term validators pass. An initially-cited voclosporin PMID was verified to be a wrong blood-pressure paper and corrected to the real AURORA 1 PMID:33971155.

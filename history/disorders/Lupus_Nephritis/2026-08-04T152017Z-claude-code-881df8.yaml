  summary: Add bidirectional kidney-immune crosstalk arm from Chernova 2024 (PMID:39120952)
  details: |
    Curated Chernova I, "Lupus Nephritis: Immune Cells and the Kidney Microenvironment", Kidney360 2024 (PMID:39120952) into the existing Lupus_Nephritis entry.

    The entry previously modelled lupus nephritis as a strictly unidirectional cascade (autoantibody -> immune-complex deposition -> complement/Fc/TLR activation -> glomerular and tubulointerstitial injury). That is precisely the framing this review argues is incomplete, so the pass added the reciprocal arm rather than restating the existing chain.

    Added:
    - Two mechanistic_hypotheses groups. "unidirectional_immune_injury_model" (CANONICAL) names the pre-existing chain and carries a PARTIAL-support citation to Chernova recording that the review holds the unidirectional framing to be incomplete rather than wrong. "bidirectional_kidney_immune_crosstalk" (EMERGING) captures the reciprocal model. All pre-existing and new causal edges were opted into the appropriate hypothesis_groups.
    - Two pathophysiology nodes, both biological_scale TISSUE: "Intrarenal Immune Infiltration and Proinflammatory Cytokine Milieu" (GO:0050900, GO:0001816; T cell, macrophage) and "Kidney Microenvironment Conditioning of Intrarenal Immune Cells" (GO:0071456 hypoxia, GO:0006972 hyperosmotic response, GO:0019882 antigen presentation, GO:0001816 cytokine production, GO:0045321 leukocyte activation; kidney epithelial cell, kidney tubule cell, mesangial cell, podocyte).
    - A deliberate feedback edge from the conditioning node back to the infiltration node. This closes a 2-cycle in the pathograph, which is the reciprocal arm that distinguishes the two hypothesis groups; render.py handles cycles explicitly.
    - A KNOWLEDGE_GAP discussion (gap_kidney_targeted_ln_therapy) on whether the intrarenal loop can be interrupted by kidney-targeted therapy without systemic immunosuppression, attached to both new nodes. All nine currently curated treatments act systemically; the review frames kidney-targeted therapy prospectively ("can lead to", "may represent"), so it was recorded as an open gap with a proposed paired-biopsy target-engagement experiment rather than as a curated treatment.

    Evidence discipline: the reference was cached with "just fetch-reference PMID:39120952" (abstract_only; the publisher DOI returned 403, so no full text was available and all snippets are exact abstract quotes). Because the source is a narrative review, every new evidence item is tagged evidence_source: OTHER, and node-level notes record that the individual arms rest on model-system and in-vitro work cited within the review rather than on direct human renal outcome data. The EMERGING rather than CANONICAL status of the new hypothesis group reflects the same caution.

    Validation: just validate, just validate-terms, and just validate-references all pass; 42/42 snippets verified against the cached reference.

    Incidental fix, unrelated to this paper: kb/disorders/Lupus_Nephritis.yaml did not validate on main. NCIT:C70741 (Obinutuzumab, added in PR #7116) was missing from cache/enums/chemicalentityterm_*.csv, and because conf/oak_config.yaml serves NCIT via ols:ncit (issue #5160), OAK's OLS adapter raises NotImplementedError for ancestors, so the reachable_from check can never re-derive it. The same applied to GO:0006972 and GO:0045321 under ols:go. All three were derived from the authoritative local sqlite:obo builds by running the validator with the adapter temporarily repointed, then the config was restored; no cache row was hand-written.

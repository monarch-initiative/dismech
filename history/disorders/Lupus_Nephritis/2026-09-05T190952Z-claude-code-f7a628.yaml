  details: |
    Curation for issue #6947, plus the review round that followed.

    Added the upstream innate-immune arm of lupus nephritis from PMID:42493613 (van Schaik et al., Nat Rev Nephrol), and recorded the disease-modification paradigm in review_notes.

    The review round on PR 8845 changed five things. (1) The original curation added a single node, "Impaired Nuclear Self-Antigen Clearance and Innate Immune Activation", that packed four sequential events into one description. Split into four atomic nodes chained by downstream: Impaired Nuclear Self-Antigen Clearance -> Excessive Toll-like Receptor Signaling -> Type I Interferon Pathway Upregulation -> B Cell Hyperactivation -> the pre-existing Autoantibody Production and Immune Complex Formation node. Each node carries its own process, cell type, evidence and outgoing edge. (2) GO:0006954 inflammatory response was too general for a node whose content is TLR plus type I interferon; the split nodes now use GO:0043277 apoptotic cell clearance with modifier DECREASED, GO:0002224 toll-like receptor signaling pathway, GO:0060337 type I interferon-mediated signaling pathway, and GO:0042113 B cell activation. (3) CL:0000236 B cell contradicted a node named for innate activation; the innate nodes now carry CL:0000235 macrophage and CL:0000784 plasmacytoid dendritic cell, and CL:0000236 stays only on the B Cell Hyperactivation node, where it is correct. (4) PMID:42493613 is a narrative review synthesizing largely model-system work, so all evidence drawn from it is regraded evidence_source OTHER rather than HUMAN_CLINICAL, consistent with how PMID:42413709 is already graded in this entry. (5) An explanation on the complement node claimed the quoted sentence spoke to intervention timing, which it does not; rewritten to the claim the snippet actually carries.

    Non-blocking items also taken: the B Cell Hyperactivation downstream edge now quotes through the autoantibody clause it depends on rather than stopping short of it, and every new node carries biological_scale: CELLULAR.

    Validation on the pushed tree: just validate passes with 58/58 snippets verified against cached references; just validate-terms passes; check-duplicate-keys and check-folded-hyphens clean; the causal graph reports no orphan targets, so the new bare-name downstream chain resolves.

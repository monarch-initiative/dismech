  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #8625.

    Blocking item: the pathophysiology[0] evidence item quoting PMID:37468577's
    myoblast/HEK293 silencing experiment was still tagged evidence_source:
    HUMAN_CLINICAL, inherited from when that snippet was the paper title. The
    replacement snippet quotes a cell-culture experiment (cultured patient myoblasts
    plus a HEK293 COX18-silencing arm), which is IN_VITRO per the CLAUDE.md
    classification rules. Retagged to IN_VITRO and adjusted the explanation to say
    "cultured patient myoblasts". The other two PMID:37468577 items (proband
    description, whole exome sequencing) remain correctly HUMAN_CLINICAL.

    Non-blocking suggestions, both accepted:
    - phenotypes Encephalopathy: the snippet is the study's aim sentence ("the
      likely cause of a neonatal form of mitochondrial encephalo-cardio-myopathy").
      The cached abstract's proband description reports hypertrophic cardiomyopathy,
      myopathy, axonal sensory neuropathy, and failure to thrive, but no explicit
      encephalopathy finding. The explanation now states that support rests on the
      compound disease designation rather than a reported observation, instead of
      claiming the abstract "states the finding".
    - genetic[0].inheritance Autosomal recessive: a single homozygous proband with
      no stated parental segregation is consistent with, not establishing of, AR
      inheritance. Explanation reworded and the absent segregation data noted.

    No snippets were changed; all three remain exact substrings of
    references_cache/PMID_37468577.md. No reference cache file was touched.

    Validation: just validate (schema + terms + references, 7/7 snippets verified),
    just count-verified-snippets (7/7), just check-title-snippets (OK, no new

  summary: 'Gene-family review: COX18'
  details: |
    COX18 relationship_type changed from CAUSATIVE to UNKNOWN and the recessive inheritance block bound to HP:0000007. The complex IV deficiency phenotype (MC4DN25) rests on one homozygous proband with p.Asp223His (PMID:37468577); later biallelic families present mainly with axonal neuropathy (PMID:38960055, PMID:40830826). ClinGen has not graded COX18, so CAUSATIVE (Definitive/Strong) is not used. The mechanism node keeps GO:0032977 membrane insertase activity, which matches COX18's role in translocating the MT-CO2 C-terminal tail (PMID:28330871).

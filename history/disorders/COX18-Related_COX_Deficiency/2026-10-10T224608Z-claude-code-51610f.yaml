  summary: Add COX18 insertase MF and genetic relationship fields
  details: |
    Added membrane insertase activity (GO:0032977, DECREASED) to the COX18 molecular node, with evidence from the COX18 knockout study (PMID:28330871) and a patient-lymphoblast proteinase K protection assay (PMID:40830826). The descriptor states that COX18 is an assembly factor with no cytochrome-c oxidase activity. Added relationship_type CAUSATIVE and variant_origin GERMLINE to the genetic record, with a note that ClinGen has no COX18 record and the MC4DN25 association rests on one proband. Aligns with the ai-gene-review COX18 core function.

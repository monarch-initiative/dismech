  summary: 'Create: Developmental_Delay_With_Or_Without_Dysmorphic_Facies_And_Autism'
  details: |
    De novo curation of the TRRAP-related neurodevelopmental disorder (MONDO:0032760, OMIM:618454, DEDDFA) from the defining Cogne et al. 2019 AJHG cohort (PMID:30827496, abstract-only cache) and a zebrafish trrap-knockout model (PMID:34934055). Gene binding hgnc:12347 TRRAP verified by lookup. Pathograph: 4-node chain from the HAT-complex scaffold lesion (GO:0035034) through dysregulated histone acetylation/transcription to a neurodevelopmental branch and an embryonic/craniofacial morphogenesis branch; all 16 phenotypes causally connected. Two genotype-correlated clinical spectra modeled as pathograph branches, not has_subtypes. gene_disease_validity omitted because ClinGen's Definitive TRRAP assertion is recorded against the ClinGen entity MONDO:0100465, not this OMIM-derived term. All validation gates clean: validate-disorders 34/34 snippets and 36 titles, validate-terms, gene-activity-grounding (ref origin/main), entity-refs, causal-targets, coarse-phenotypes, enum/duplicate keys. DR report used as leads only.

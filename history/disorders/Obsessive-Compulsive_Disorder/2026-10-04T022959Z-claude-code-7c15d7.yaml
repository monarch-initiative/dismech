  summary: 'Review round 1: memantine target, evidence and hypothesis wording'
  details: |
    Addressed the 2026-10-02 review of PR 13393. Retargeted the memantine target_mechanisms edge from the nonexistent 'Glutamatergic Neurotransmission Dysregulation' to the existing 'Glutamatergic Signaling Imbalance' node. Removed the effect_modifiers block: the preprint's own stratifier is SSRI non-folding, not baseline severity, and a simulation prediction is not an observed subgroup effect. Added human-clinical evidence for memantine augmentation: Farnia et al. 2018 RCT (PMID:30044966, REFUTE, null), a 2026 six-RCT meta-analysis (PMID:42484816, REFUTE, no significant pooled effect), and a 2025 refractory-OCD meta-analysis (PMID:40235251, SUPPORT). Reworded the treatment description to state the inconsistent clinical evidence and to mark the model claim as a prediction. Reworded the hypothesis description to the paper's sink/5-HT1B framing and recorded memantine as acting on the LTP source gain.

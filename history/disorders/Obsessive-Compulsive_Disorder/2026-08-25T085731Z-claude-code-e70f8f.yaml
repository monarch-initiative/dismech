  summary: Add ITIH3 / 3p21.1 shared BD-OCD susceptibility locus and effector-gene
    knowledge gap
  details: |
    Mirror of the Bipolar_Disorder edit for issue #8478 (preprint PPR:PPR1294131).

    Added a genetic[] entry ITIH3 (hgnc:6168, relationship_type SUSCEPTIBILITY) for the extended 3p21.1 region. Peer-reviewed anchor is the 2025 OCD GWAS Table 1 row (PMID:40360802: rs2564930 at 3p21.1, P = 3.41e-11, OR 0.9546, 12 genes in region, prior genome-wide-significant SCZ association); the cross-trait preprint is attached at supports: PARTIAL.

    Named-entity checks performed before writing, both recorded in the entry notes so the loci are not conflated: (1) rs2564930 (Ensembl GRCh38 chr3:52,983,291) lies ~150 kb distal to ITIH4 (ends 52,831,069), so the OCD signal is locus-level and the GWAS authors do not name an ITIH gene as effector; (2) this 3p21.1 locus is a different locus from the 3p21.31 signal behind the file's pre-existing WDR6 and DALRD3 entries - the same GWAS reports rs7626445 (3p21.31) and rs2564930 (3p21.1) as separate genome-wide-significant loci.

    Added the same KNOWLEDGE_GAP discussion gap_bip_ocd_3p21_1_effector_gene_and_h3k27ac (attaches_to genetic#ITIH3) as the Bipolar_Disorder entry, so the shared question is discoverable from either side.


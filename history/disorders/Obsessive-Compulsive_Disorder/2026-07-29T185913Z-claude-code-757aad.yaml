  summary: Add preliminary ketamine EEG mechanistic hypothesis; deliberately no treatment
    entry (PMID:42405700)
  details: |
    Addresses lit-scan issue #5832 (PMID:42405700, Int J Neuropsychopharmacol 2026, Shadli et al).

    Scope decision, made deliberately and recorded here for audit: the issue recommended documenting ketamine as a treatment option for both PTSD and OCD. That was NOT done for OCD. Reading the primary abstract rather than the issue's paraphrase shows the OCD arm is far weaker than the issue implies: n=7 (5F, 2M), explicitly described by the authors as 'Preliminary', and excluded from the study's primary ANOVA, which compared TR-PTSD with TR-MDD only. The sole OCD result is the bare qualitative statement 'TR-OCD differed qualitatively from both', reported with no direction of effect, effect size, or test statistic. Asserting a ketamine treatment indication for OCD on that basis would overstate the evidence.

    What was added instead: a third entry in the existing mechanistic_hypotheses block, hypothesis_group_id emerging_ketamine_eeg_signature, status EMERGING, carrying two evidence items (both supports: PARTIAL) - the qualitative-difference result and the sample-size/preliminary statement. The description states n=7, the preliminary characterization, and the ANOVA exclusion inline, and states explicitly that ketamine is not curated as an OCD treatment on this study's strength. Establishing that would require primary OCD efficacy evidence, which a mechanistic EEG study does not provide and which would exceed the issue's low_effort scope.

    The hypothesis is positioned as consistent with the already-curated CSTC and glutamatergic-imbalance models rather than as a competing mechanism.

    Validation: schema and term validation pass. Both PMID:42405700 snippets verified by hand as whitespace-normalized exact substrings of references_cache/PMID_42405700.md, because the local linkml-reference-validator reports 'Total checks: 0' on this machine (reproduced on unmodified files, so pre-existing). Term validation required UV_PYTHON=3.12; default resolution to Python 3.14 crashes oaklib via pyhornedowl.

  summary: 'Create: Familial_Hypocalciuric_Hypercalcemia_2'
  details: |
    New entry for FHH2 (MONDO:0007792), GNA11 loss of function, curated as a separate DISEASE sibling of the CASR-specific FHH1 entry and modelled on it. Deep research: falcon was unavailable (no working credentials); an Asta retrieval report (research/Familial_Hypocalciuric_Hypercalcemia_2-deep-research-asta.md, 36/36 references resolved) was run and committed, but it covers FHH in general and carries little GNA11-specific content, so the entry rests mainly on primary GNA11/FHH2 papers found by direct PubMed searches. An OpenScientist run was queued but had not returned when the PR was opened. Cross-checking the Asta report surfaced one candidate not added: the TRPC1 channel as a Galpha11 interactor in PTH suppression (PMID:32213715, mouse and in-vitro), left out because it is not shown in FHH2 patients; every cited PMID was cached with just fetch-reference and all 41 snippets verified against the cache. Pathograph: GNA11 variant -> reduced CaSR-coupled PLC signalling -> raised calcium set point -> non-suppressed PTH secretion and increased renal tubular calcium reabsorption -> hypercalcemia, elevated/inappropriately normal PTH, hypocalciuria, and the negative phenotype absence of nephrolithiasis. The renal node is PROVISIONAL because it is inferred from pathway and mouse data rather than measured in FHH2 patients. Mouse-only findings (FGF23 elevation and hypophosphatemia in Gna11 knockout mice) were kept in animal_models rather than asserted as human phenotypes. Incomplete penetrance and the single homozygous case are recorded as a KNOWLEDGE_GAP discussion. No GeneReviews chapter exists (check-genereviews NO_CHAPTER); no ClinGen assertion in the committed export; no calcium-sensing mechanism module exists for conforms_to. Validated with just validate, count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

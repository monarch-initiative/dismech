  summary: 'Add OpenScientist report and enamel phenotype: Familial_Hypocalciuric_Hypercalcemia_2'
  details: |
    The OpenScientist deep-research run finished after the review-round push and is now committed (research/Familial_Hypocalciuric_Hypercalcemia_2-deep-research-openscientist.md, its citations file and small artifacts). Its reference validation resolved 27/27 references and 17/17 quotes; needs_review was set only by three paraphrased term labels (MONDO:0007792 called 'MONDO', HP:0003072 called 'Laboratory abnormality', HP:0012378 called 'Symptom'), none of which were bound. The report is about GNA11/FHH2 (42 GNA11 mentions). Cross-checking it found one gap: enamel hypomineralization co-segregating with GNA11 loss-of-function hypercalcemia in two families (PMID:42670332). Added a PROVISIONAL TISSUE node 'Disrupted Enamel Mineralization' (CL:0000059 ameloblast, GO:0070166 enamel mineralization DECREASED, mouse expression and Gna11+/- enamel evidence) wired from the GNA11 variant node, and an Enamel Hypomineralization phenotype (HP:0006285) with the human co-segregation evidence; frequency omitted because the finding is new. Added the Ser18ArgfsTer2 frameshift and whole-gene deletion to the variant description. Not adopted from the report: its FHH-wide prevalence figure (1 in 78,000, PMID:11353947), which is for FHH overall rather than FHH2; and its pregnancy/neonatal management section, which is FHH-generic.

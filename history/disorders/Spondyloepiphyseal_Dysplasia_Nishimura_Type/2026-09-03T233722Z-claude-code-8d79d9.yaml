  summary: 'Create: Spondyloepiphyseal Dysplasia, Nishimura Type (MONDO:0032835, MIR140)'
  details: |
    Created kb/disorders/Spondyloepiphyseal_Dysplasia_Nishimura_Type.yaml from scratch
    (MONDO:0032835, MIR140, OMIM 618618). Scope decision: DISEASE - one gene, one
    recurrent allele, no member diseases to unite; the stub is deleted.

    Deep research: falcon (Edison), template disease_pathophysiology_research.md, run
    directly through scripts/run_deep_research_client.sh because just research-disorder
    requires an existing kb file. NEC preflight passes (MIR140 mentioned 54 times against
    10 for the next gene; report OMIM matches MONDO cross-reference). Its main
    contribution was surfacing PMID:36711926, the metabolic follow-up preprint. Two of
    its claims were rejected: ORPHA:163649, which is a different disorder, and the
    obsolete GO:0016573.

    Sources: PMID:30804514 (Nat Med 2019, full text) is the founding and near-sole
    report; PMID:36711926 (bioRxiv preprint) supplies the glycolysis/acetyl-CoA branch,
    curated as PROVISIONAL; PMID:21576357 and PMID:20466812 supply the miR-140-null
    comparator.

    miRNA modelling decisions, relative to the MIR96 entry (PR #10465): modifier is left
    absent on the acquired-target node, following that precedent; but
    functional_impact_category is set to NEOMORPHIC rather than left absent, because the
    knock-in versus null mouse comparison assigns the disease-defining epiphyseal
    features to the acquired arm and the authors use that word of this allele. The
    reasoning is written out in the genetic_context notes and the entry notes. modifier
    is also left absent on the "Abundant Production of the Mutant miR-140-5p" node, where
    the claim is that processing is unaffected and ModifierEnum has no unchanged value.
    isds_skeletal_category is deliberately omitted: the cached nosology records are
    abstract-only and contain no disease tables.

    Validation: just validate (schema + terms + references) exit 0; 80/80 snippets
    verified; check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-folded-hyphens all exit 0. Datasets geo:GSE98309
    and geo:GSE192971 verified with just verify-datasets.

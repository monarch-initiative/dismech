  summary: 'Create: PGM2L1 Deficiency'
  details: |
    Created a lean new entry for PGM2L1 deficiency (PGM2L1-related neurodevelopmental disorder), an ultra-rare autosomal recessive condition caused by bi-allelic inactivating PGM2L1 variants. Verified HGNC id (hgnc:20898) via OAK. Confirmed OMIM:611610 is the PGM2L1 gene MIM (not a distinct phenotype MIM) via the HGNC obo record xref, and confirmed via runoak mondo search that no PGM2L1-specific MONDO term exists yet; provisionally grounded disease_term to the broad parent MONDO:0700092 (neurodevelopmental disorder) and documented the gap in notes for a future MONDO NTR. Literature base: PMID:33979636 (Morava et al 2021, Am J Hum Genet, original 4-patient series with fibroblast biochemistry showing reduced glucose-1,6-bisphosphate and normal glycosylation), PMID:41776821 (Niu et al 2026, second case report, homozygous frameshift variant), and PMID:41178743 (Ercoskun et al 2026, adult phenotype in 2 siblings). All three PMIDs fetched via just fetch-reference (no hand-written cache files) and every evidence snippet verified as an exact substring of the cached abstract via just validate-references. Curated pathophysiology (PGM2L1 loss of function leading to reduced glucose-1,6-bisphosphate/sugar bisphosphate concentrations, explicitly not a glycosylation defect), 9 phenotypes reported in the original 4-patient series (developmental delay, speech delay, dysmorphic facial features, ear anomalies, high arched palate, strabismus, hypotonia, keratosis pilaris, plus OCCASIONAL-frequency obesity and seizures), genetic causality, autosomal recessive inheritance, and a biochemical marker (glucose-1,6-bisphosphate, CHEBI:17680) block. Did not include the adult-phenotype paper's additional features (scoliosis, renal anomaly, hypothyroidism, etc.) as distinct phenotype entries to keep the entry lean and avoid over-extending from a 2-sibling case report; PMID:41178743 is cited only for gene-disease association support. No treatments are documented in the literature, so the treatments section was omitted. Validated with just validate, just validate-references, and just validate-terms; all passed.

  summary: Move broad MONDO parent from disease_term to a broadMatch mapping
  details: |
    disease_term was bound to MONDO:0700092 (neurodevelopmental disorder), asserting identity with every neurodevelopmental disorder in MONDO (issue #12184). An OLS search of MONDO for PGM2L1 still returns no disease class. The term was removed from disease_term and MONDO:0700092 recorded under mappings.mondo_mappings as skos:broadMatch. skos:narrowMatch, suggested in the issue, was not used: in this repository narrowMatch means the mapped term is narrower than the entry and counts as MONDO coverage, so it would reproduce the defect. MONDO:0030503, also suggested, is PFIC7 and is unrelated. Validated with just validate-disorders.

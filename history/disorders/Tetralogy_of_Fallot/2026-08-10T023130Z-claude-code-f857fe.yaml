  summary: 'Review response and provenance retraction: Tetralogy of Fallot'
  details: |
    Review-response session on PR 8277.

    RETRACTION. The creation record for this entry, timestamped 2026-08-10T013603Z,
    states that the cached record for PMID 30582441 contains the author block where
    an abstract body would be. That is false and is retracted here. The cache holds
    the full structured abstract. The same session also labelled four snippets as
    ending mid-word because the cached abstracts were truncated; those claims are
    false as well. The cuts fell on MEDLINE 75-column wrap boundaries and were
    produced by a fixed-width extraction window in the curation script, not by
    anything in the cache. History records are append-only, so the earlier record is
    left in place and this record supersedes its provenance claims.

    All four snippets are re-quoted at sentence boundaries. The consequences were not
    cosmetic. The PMID 27329296 cut had dropped the phrase symptomatic arrhythmias,
    which was the only support for the ventricular arrhythmia node, leaving that node
    with a claim-evidence mismatch. The PMID 30582441 title-only snippet is replaced
    with real results, which also allowed NOTCH1 and NKX2-5 to gain evidence blocks
    they previously lacked.

    A second false claim is also retracted. The entry stated that the Cell Ontology
    has no cardiac neural crest cell term. CL 2000073 migratory cardiac neural crest
    cell exists, is present in the committed cache, and is already used by sibling
    entries. It is now used here, and the outflow tract myogenic progenitor is bound
    to CL 0000513 cardiac muscle myoblast rather than the generic cardiac muscle cell.

    Added: an environmental section for maternal pregestational diabetes linked to
    the trigger node, and implantable cardioverter defibrillator and catheter
    ablation treatments so the ventricular arrhythmia node is no longer a pathograph
    dead end. Those treatments are described as acting on the arrhythmia rather than
    on the substrate, which is the distinction the valve-replacement timing
    discussion turns on.

    In a follow-up within the same session, and on a suggestion from the user, PMID
    35104296 was fetched. Its full text supplies a disease-specific relative risk of
    1.41 for gestational diabetes with a confidence interval clear of one, and states
    that pre-gestational risks are higher. The pre-gestational disease-specific
    figure appears only as a forest plot and is still not asserted. The deep-research
    narrative's odds ratio of 3 to 5 remains uncited, and is notably higher than the
    figure the meta-analysis actually supports.

    Validation: schema, ontology terms, and references all pass. Snippets checked 25
    of 25 verified against cached references, up from 17 of 17.

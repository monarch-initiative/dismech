  summary: 'Create: Tetralogy of Fallot'
  details: |
    Created the Tetralogy of Fallot entry from a claude_code deep-research report
    treated as leads only.

    Mechanism model. Nine pathophysiology nodes built around the claim that the four
    cardinal features are not four defects but four geometric consequences of one,
    namely anterocephalad deviation of the outlet septum. The chain runs from second
    heart field and cardiac neural crest disruption, through that deviation, to the
    malalignment septal defect with overriding aorta and the outflow tract
    obstruction in parallel, then to a shunt-direction node that determines whether
    the child is pink or cyanotic, and finally to the postoperative arm of pulmonary
    regurgitation, right ventricular remodelling, and late arrhythmia.

    The shunt-direction node is the pivot and earns its place: it explains the pink
    versus cyanotic spectrum, the hypercyanotic spell, why squatting works, and why
    phenylephrine is a treatment. Three treatments attach to it or to the dynamic
    obstruction that feeds it.

    Deep-research provider ontology errors corrected. Three suggested identifiers
    were real CURIEs pointing at unrelated concepts and three more had labels that
    did not match the identifier. CL:0002079, suggested for cardiac neural crest
    cell, is pancreatic ductal cell. HP:0031264, suggested for heart murmur, is
    Abnormal Bowman capsule morphology, a kidney term. HP:0004943, suggested for the
    boot-shaped heart sign, is Accelerated atherosclerosis. HP:0001714 is the generic
    Ventricular hypertrophy rather than the right-sided term. HP:0004415 is Pulmonary
    artery stenosis, not infundibular pulmonic stenosis. GO:0061308 has a different
    canonical label than the one suggested. The report had explicitly asked that its
    identifiers be verified, which was warranted.

    Absent bindings documented rather than approximated. CL has no cardiac neural
    crest cell term. HPO has no term for the boot-shaped heart sign, so that finding
    is not curated as a phenotype at all. HPO has no term for the hypercyanotic spell
    as an episodic entity, so it is bound to Cyanosis with a recurrent temporality
    qualifier.

    Eleven references fetched and verified. Three were added in a second pass
    specifically because the first draft left several nodes and phenotypes
    unevidenced and compliance sat at 52 percent: the AHA scientific statement, a
    coronary anomaly meta-analysis, and a review of residual pulmonary valve
    dysfunction. One snippet is an article title rather than a body sentence, on the
    FLT4 entry, because the cached record for that reference contains the author
    block where an abstract body would be; the limitation is stated in the
    explanation rather than concealed.

    Module conformance. The late ventricular arrhythmia is deliberately not conformed
    to cardiac_ion_channel_repolarization, because the substrate is surgical scar and
    fibrosis rather than a primary channelopathy.

    Validation: schema, ontology terms, and references all pass. Snippets checked 17
    of 17 verified against cached references.

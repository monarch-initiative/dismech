  details: |
    Weekly compliance sweep. The entry's gap was almost entirely missing evidence rather than missing ontology bindings: 61 evidence slots were empty while every term binding was already present and correct. Added 17 evidence items across six pathophysiology nodes, three causal edges, and five phenotypes, drawn from two newly cached references: PMID:30657877 (Birmingham Children's Hospital morphological archive of 164 tetralogy hearts, full text) and PMID:20734579 (anatomophysiologic review). PMID:21321470 (pulmonary artery banding in infant rabbits) supplies the pressure-overload step behind the right ventricular hypertrophy node in two items that are graded differently on purpose: the item quoting the paper's own banding result is MODEL_ORGANISM and INDIRECT, because the causal step cannot be isolated in a human tetralogy heart, while the item quoting the paper's opening framing sentence is HUMAN_CLINICAL with quote_role BACKGROUND, because that sentence restates the human clinical picture rather than reporting anything a rabbit measured. Two honesty corrections followed from the sources: the hypercyanotic spell description asserted acute dynamic infundibular constriction as the cause, and the cited review states the mechanism is not clear, so the description now records the attribution as conventional rather than settled; the right ventricular hypertrophy phenotype evidence is marked BACKGROUND because the cardinal-feature enumeration is quoted from the paper's introduction. The two further PMID:30657877 quotes taken from the same introduction paragraph, the outlet-septum hallmark sentence and the aortic-override sentence, are likewise marked BACKGROUND: both restate established knowledge and attribute it to earlier papers. Weighted compliance 57.7 to 70.5 percent. All 42 snippets verified against the cache.

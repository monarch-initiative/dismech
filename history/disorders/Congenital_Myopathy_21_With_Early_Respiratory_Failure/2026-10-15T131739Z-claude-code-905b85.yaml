  details: |
    New entry for MONDO:0957224 (recessive DNAJB4 myopathy). Inputs: the Perplexity deep-research report research/Congenital_Myopathy_21_With_Early_Respiratory_Failure-deep-research-perplexity.md, used as a lead list only, plus a PubMed search for DNAJB4 myopathy. Cited sources: Weihl 2023 gene discovery (PMID:36264506), Inoue 2024 cohort (PMID:39468638, full text), independent adult replication (PMID:38127101), homozygous whole-gene deletion case (PMID:40769870), J-domain protein myopathy review (PMID:40696134), and the dominant p.Phe90Leu paper for knockout-mouse soleus selectivity (PMID:36512060). The pathograph runs from two allele classes (unstable/absent protein; stable but nonfunctional J-domain missense) to loss of co-chaperone function, Z-disc protein accumulation (conforms to loss_of_proteostasis#Misfolded-Protein Aggregation), myofibrillar disorganization, fiber atrophy, preferential involvement of high-DNAJB4 muscles, respiratory pump failure, axial involvement and a cardiac branch; all 21 phenotypes are causally connected. The dominant DNAJB4 distal myopathy is excluded as a distinct allelic disorder. Death in childhood could not be bound because HP:0003819 is outside the PhenotypeTerm enum; it is described under respiratory failure. Validation: just validate, validate-terms, validate-disorders, count-verified-snippets (102/102), check-entity-refs, check-causal-targets, list-disconnected-phenotypes (0 disconnected), check-snippet-length, check-folded-hyphens all pass; check-genereviews reports no GeneReviews chapter.

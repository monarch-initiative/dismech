  summary: 'Review response: apply reviewer suggestions 2 and 3 on PR #9210'
  details: |
    Response to the ai4c-reviewer review on PR #9210, which APPROVED the curation with five non-blocking suggestions. Applied two; declined three with reasons.

    APPLIED

    - Suggestion 2 (tighten the location term): the Hepatic Vascular Steal and Biliary Ischemia node now uses UBERON:0003704 intrahepatic bile duct instead of UBERON:0002394 bile duct. Both the cited paper and the node description are specific to the intrahepatic ducts, and UBERON:0003704 is part_of UBERON:0002107 liver, so the tighter term is both more precise and more consistent with the node's hepatic framing. Term already present in cache/uberon/terms.csv, so no cache change.

    - Suggestion 3 (promote the proposed experiment out of prose): the hht_genetically_unexplained_suspected_disease discussion now carries a structured proposed_experiments block (exp_hht_genotype_negative_cohort_sequencing) instead of stating the resolving experiment only in notes. The structured version also does work the prose did not: it specifies stratification by Curacao score as the design feature that discriminates the two competing explanations (novel pathway genes should enrich in the clinically definite stratum; a pretest-probability effect predicts no enrichment and no recurrent locus), and names 7p14 linkage as a test of whether these patients share the HHT4 locus. The notes field keeps only the source-tier caveat.

    DECLINED, with reasons

    - Suggestion 1 (node atomicity: split Hepatic Vascular Steal and Biliary Ischemia into two nodes). Declined. The reviewer argued against it in the same breath as raising it: the entry's existing nodes use the same compound style (Somatic Second-Hit Mutation and AVM Formation; Defective Endothelial Tubulogenesis and Pericyte Recruitment), both halves sit at the same TISSUE scale, so the bundling tell that a node would need two biological_scale values does not fire. Splitting one node to a stricter standard than the five nodes around it would make the entry less internally consistent, not more.

    - Suggestion 4 (the 'liver synthetic function typically remains normal' evidence item does different work from the other three). No action; the reviewer explicitly said they would leave it. It scopes the node boundary between vascular biliary injury and parenchymal liver disease, which is a claim the node description actually makes, and its explanation says so.

    - Suggestion 5 (add HP:6000846 Beaded bile ducts and HP:0033149 Intrahepatic bile duct dilatation as further phenotypes). Declined. The Ischemic Cholangiopathy phenotype is supported by a literature statement that this is a known HHT complication, not only by the index patient. Beading and duct dilatation appear solely as that one patient's MRCP description, so curating them as disease-phenotype associations would rest on n=1 alone. The imaging detail is already preserved verbatim in the existing evidence snippet on that phenotype, where it belongs.

    Validation re-run after the edits: just validate (passed); just validate-terms (passed); just count-verified-snippets (78/78 verified); just check-duplicate-keys and just check-folded-hyphens (passed); pytest tests/test_data.py -k Hereditary_Hemorrhagic_Telangiectasia.yaml (16 passed). No reference-cache or term-cache changes resulted from this edit; nine unrelated references_cache files rewritten as a side effect of running just validate were reverted, as in the original commit.

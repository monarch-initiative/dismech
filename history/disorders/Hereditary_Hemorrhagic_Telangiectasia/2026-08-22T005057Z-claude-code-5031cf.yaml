  summary: 'Edit: HHT hepatic vascular steal / biliary ischemia node and genotype-negative
    diagnostic knowledge gaps (PMID:42375883)'
  details: |
    Used PMID:42375883 (Alkhalil et al., Cureus 2026) as the nucleus for this session.
    The paper is a single-patient case report of extensive visceral and arterial
    vascular anomalies in suspected HHT with negative genetic testing, so it is
    material for updating the existing Hereditary Hemorrhagic Telangiectasia entry
    rather than a new disorder page.

    Changes made:

    - pathophysiology: added a new node "Hepatic Vascular Steal and Biliary Ischemia"
      (biological_scale TISSUE; cell type cholangiocyte CL:1000488; location bile duct
      UBERON:0002394), downstream of "Vascular Shunting Through Visceral AVMs" and
      upstream of the new Ischemic Cholangiopathy phenotype. This closes a real gap:
      biliary ischemia previously appeared only as a passing clause in the Hepatic
      Arteriovenous Malformation phenotype description, with no node and no evidence.
      Four evidence items cover the hepatic artery to hepatic vein / hepatic artery to
      portal vein steal mechanism, the exclusive arterial supply of the bile ducts, the
      progression to biliary necrosis / biloma / secondary sclerosing cholangitis, and
      the preservation of hepatic synthetic function until secondary biliary cirrhosis.

    - phenotypes: added "Ischemic Cholangiopathy" (category Hepatic) bound to
      HP:0030991 Sclerosing cholangitis, whose HPO definition explicitly covers
      ischemic ductal injury. No frequency is asserted. Also added two evidence items
      to the existing Hepatic Arteriovenous Malformation phenotype: liver vascular
      malformations on imaging in up to 70% of definite HHT, and the association with
      morbidity/mortality and female preponderance of clinically significant disease.

    - definitions: extended the Curacao clinical diagnostic criteria framework with
      three PARTIAL evidence items bounding molecular diagnostic yield (>90% of
      patients meeting three or more criteria, 4-10% of clinically definite cases
      unexplained, up to 15% negative across the broader tested population) plus a
      notes field on how the one-criterion "unlikely" threshold behaves for a patient
      whose only qualifying feature is visceral AVM disease.

    - discussions: added the entry's first discussions block, with two OPEN
      KNOWLEDGE_GAP records. hht_genetically_unexplained_suspected_disease captures
      the two competing explanations for genotype-negative suspected HHT (lower
      pretest probability vs as-yet-unidentified pathway genes) and cross-references
      the separate Hereditary_Hemorrhagic_Telangiectasia_4 7p14 locus entry as a
      worked example of the latter. hht_large_artery_involvement_spectrum asks whether
      large-artery lesions belong to the HHT spectrum at all.

    Deliberately NOT curated: type B aortic dissection and superior mesenteric artery
    branch occlusion were not added as HHT phenotypes. The evidence is a single case,
    the patient had no molecular confirmation of HHT, and the authors themselves
    describe these as features not typically associated with HHT. They are recorded as
    an open question in the discussions block instead.

    Source-tier caveat: every node and phenotype added from this citation carries a
    notes field recording that the support is a single case report summarizing the
    hepatology literature it cites, and that a primary hepatology series should
    replace it when one is curated.


  details: |
    Response to the re-review on PR #9210, which re-APPROVED the delta commit and left one non-blocking suggestion: lift the discriminating logic out of the proposed experiment's free-text description into the Experiment class's dedicated decision_criterion, would_support, and would_refute slots.

    Applied. exp_hht_genotype_negative_cohort_sequencing now carries:
    - decision_criterion: stratification by Curacao score is what discriminates the two explanations; a novel-gene explanation predicts candidate variants concentrating in the clinically definite stratum and recurring across unrelated probands, a pretest-probability explanation predicts neither.
    - would_support: recurrent rare variants in one or more novel BMP/TGF-beta pathway genes, enriched in the clinically definite stratum relative to the possible stratum.
    - would_refute: a flat distribution of private, non-recurrent variants with no enrichment in the clinically definite stratum, favoring lower pretest probability instead.
    The description is trimmed to the design itself (recruitment, sequencing modality, stratification, the 7p14 linkage test) so the discrimination logic is not duplicated across two slots.

    Schema note for future curators: decision_criterion is a single string, but would_support and would_refute are MULTIVALUED on Experiment. Writing them as folded scalars fails linkml-validate with "is not of type 'array', 'null'". Caught and fixed before commit; recorded here because the asymmetry between the three slots is not obvious from their names.

    The reviewer judged this suggestion not worth a round trip on its own. It was applied anyway, on two grounds: CLAUDE.md asks that even optional review changes be addressed when they improve quality, and the PR is gated behind the 3-day auto-merge age requirement regardless, so a re-review completing in minutes costs nothing against that clock. The approval reset by this push is the accepted cost.

    Validation re-run after the edit: just validate (passed); just validate-terms (passed); just count-verified-snippets (78/78 verified); just check-duplicate-keys and just check-folded-hyphens (passed); pytest tests/test_data.py -k Hereditary_Hemorrhagic_Telangiectasia.yaml (16 passed). No cache changes; nine unrelated references_cache files rewritten by just validate were reverted, as in the two previous commits on this branch.

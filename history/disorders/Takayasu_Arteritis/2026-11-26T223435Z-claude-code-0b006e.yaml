  summary: 'Treatment-centred review and enrichment: Takayasu Arteritis'
  details: |
    Treatment-centred review of the existing entry.

    Sources: a PubMed and ClinicalTrials.gov sweep run in this session (esearch by drug and mechanism, each reference then fetched with just fetch-reference and read in the cache). An OpenScientist deep-research run was launched twice with just research-disorder openscientist; both runs ended without a report (the first was stopped at a 60-minute limit; the second was cancelled by the client when OpenScientist job b314b260-956e-46d7-b1fb-3e70026226c2 did not finish within 3600 s), so no content here comes from OpenScientist. The existing Falcon report was not re-used; just preflight-dr on it could not run because the local MONDO build is absent and OLS timed out.

    Pathophysiology: 3 nodes became 12. New nodes for mTORC1 hyperactivity in CD4+ T cells, JAK-STAT signalling in T cells, Th1/Th17 expansion, TNF signalling, IL-6 overproduction and receptor signalling, cytotoxic lymphocyte injury, anti-EPCR/SR-BI autoantibodies, B cell/plasmablast expansion, adventitial fibroblast activation, and the systemic acute-phase response. Causal edges now reach 20 of 52 phenotypes (previously none). Two evidence items on the granulomatous inflammation node that quoted a trial objective and a treatment sentence were replaced with histology findings. conforms_to added for granuloma_formation, il6_hypercytokinemia and fibrotic_response.

    Treatments: 5 became 15. Existing entries gained therapeutic_modality, target_mechanisms with evidence, and newer trial results. Added mycophenolate mofetil, leflunomide (TACTIC RCT, primary endpoint not met), cyclophosphamide with azathioprine, tofacitinib, upadacitinib (SELECT-TAK, primary endpoint not met), secukinumab, ustekinumab (phase 3 terminated early), abatacept (negative RCT), rituximab and antiplatelet therapy. Vascular Surgery was renamed Surgical and Endovascular Revascularization. The glucocorticoid description no longer states 1 mg/kg/day, which no cited source gave.

    Also added: IL6 susceptibility locus, a renal-artery-stenosis to hypertension sequela, LOINC codes and readouts on ESR and CRP, four new biomarkers, two diagnosis rows, nine clinical trials and three knowledge-gap discussions.

    Left out: the TAKT trial registration (JapicCTI-142616) is not in the WHO ICTRP export, so TAKT has no clinical_trials row. Leflunomide, cyclophosphamide/azathioprine, abatacept and antiplatelet therapy carry no target_mechanisms link, each with the reason in notes. 32 phenotypes remain without a causal edge because no cached source supports one.

    Validation: just validate-disorders passed (schema, terms, 209/209 snippets and titles); per-file and whole-repo offline gates passed.

  summary: Enrich treatments with clinical care guidelines (#4878)
  details: |
    Mined last-10-year Practice Guideline citations for Takayasu arteritis (GitHub #4878). Added two new treatments: 'TNF Inhibitor Therapy' (biologic glucocorticoid-sparing agents infliximab NCIT:C1789 / adalimumab NCIT:C65216 for refractory/relapsing disease; treatment_term NCIT:C15986 Pharmacotherapy; target Granulomatous Vascular Inflammation INHIBITS) and 'Non-Invasive Vascular Imaging Surveillance' (MRA/CTA/FDG-PET/ultrasound monitoring; treatment_term MAXO:0000424 magnetic resonance imaging procedure). Reinforced Glucocorticoids (EULAR 2018 PMID:31270110 induction) and Methotrexate (ACR/VF 2021 PMID:34235884; Turkish TAK PMID:40658482). Imaging evidence from EULAR imaging 2023 PMID:37550004 and 2025 Chinese imaging guideline PMID:40462247. Cited guidelines: 34235884, 31270110, 37550004, 40462247, 40658482. Excluded PMID:34235871 (duplicate journal of same ACR/VF 2021 guideline; cited 34235884 instead) and PMID:38326041 (2023 Chinese TAK guideline; English abstract only high-level framing, no quotable English treatment/imaging specifics). All snippets verified as exact substrings of fetched abstracts; schema + term validation pass.

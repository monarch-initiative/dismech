  summary: Wire Primary_Sclerosing_Cholangitis to new hepatobiliary mechanism module(s)
  details: |
    The Cholangiocyte Senescence node now conforms to cholestatic_liver_injury#Bile Acid-Mediated Hepatocyte and Cholangiocyte Injury, whose description carries the cholangiocyte senescence-associated secretory phenotype explicitly. The Bile Duct Inflammation and Fibrosis node was considered for the fibrogenesis node and deliberately not wired: it annotates only a generic fibroblast and inflammatory response, without the cholangiocyte proliferation the module node expects. Part of a hepatobiliary review that created the cholestatic_liver_injury, portal_hypertension and bilirubin_conjugation_transport modules. Only conforms_to lines were added; no evidence, term, or prose changes. Validation: linkml-validate clean on the changed file.

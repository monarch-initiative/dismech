  summary: 'Compliance: PSC endoscopic/surveillance treatment evidence, HLA gene bindings,
    phenotype and pANCA evidence'
  details: |
    Weekly compliance pass focused on immune-disease treatments. Treatments: added evidence to the two previously unevidenced treatments - Endoscopic Therapy now cites the multicentre randomized DILSTENT-style trial (PMID:29803836) establishing balloon dilatation as the endoscopic modality of choice for dominant strictures, with the stent-arm serious-adverse-event signal recorded in notes; Cholangiocarcinoma Surveillance cites the Swedish nationwide prospective study of 512 patients (PMID:36410555), classified PARTIAL because it documents the standard annual MRI/MRCP plus CA19-9 protocol while showing it did not detect cancer early enough to improve survival. Added therapeutic_modality DEVICE to Endoscopic Therapy. Genetic: added HGNC gene_term bindings (HLA-DRB1 hgnc:4948, HLA-B hgnc:4932), relationship_type SUSCEPTIBILITY, and evidence from the Norwegian HLA-genotyped ANCA cohort (PMID:27558072) which names both DRB1 star 03 and HLA-B star 08 as strong PSC risk factors. Biochemical: p-ANCA evidence from the same cohort (pANCA in 70 percent of 241 patients, matching the curated 60-80 percent range). Phenotypes: evidence for Pruritus, Fatigue, and Abdominal Pain from the international PSC Partners Patient Registry (PMID:29705262). Environmental: IBD association evidence from the same registry (concurrent IBD in 67.1 percent). Deliberate epistemic caveat - the registry sentence is disjunctive and pools four symptoms into a single greater-than-50-percent rate, so all three phenotypes citing it (Pruritus, Fatigue, Abdominal Pain) are classified PARTIAL and their explanations state that the FREQUENT/VERY_FREQUENT band rests on the Pattern C wording mapping rather than on a quantified per-symptom prevalence; the Fatigue entry additionally carries a notes line saying its VERY_FREQUENT (80-99 percent) band is not directly evidenced by the cited source. GGT and Jaundice were left without evidence because no adequately specific citable source was found. Validated with just validate for schema conformance, and just count-verified-snippets reported 17 of 17 snippets verified against cached references (remaining validator output is pre-existing WARNs on metabolomics_workbench and EGA dataset accessions, untouched by this change). Weighted compliance 60.4 to 81.2.

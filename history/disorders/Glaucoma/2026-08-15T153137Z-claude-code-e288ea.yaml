  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 2. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. Cited all five previously evidence-free `environmental:` exposures (Age, Family History, African Ancestry, Myopia, Corticosteroid Use). One note was corrected: Family History claimed 4-9x risk for first-degree relatives, but the cited Utah Population Database analysis measures 3.8x for siblings, 6.3x for parents and 6.8x for children, so the note now states that range. African Ancestry is graded PARTIAL because the meta-analysis (PMID:24974815) evidences the prevalence half of the annotation and not the severity half. Note for a future curator: Age, Family History and African Ancestry are host attributes rather than environmental exposures and arguably do not belong in `environmental:` at all -- flagged rather than restructured, since this tranche is scoped to evidence. Validated with `just validate`, `just count-verified-snippets` and the batched sweep.

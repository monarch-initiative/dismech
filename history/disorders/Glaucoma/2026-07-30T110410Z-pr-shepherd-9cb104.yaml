  summary: Regrade two overstated SUPPORT items to PARTIAL; add evidence_source
  details: |
    PR shepherd run addressing ai4c-reviewer IMPORTANT 3 and suggestion d on PR #6963.

    Regraded two evidence items from SUPPORT to PARTIAL, applying the grading standard this PR's own
    report recommends:

    1. Trabecular Meshwork Dysfunction node, PMID:37217093. The node asserts the age-related change,
    oxidative stress and altered extracellular matrix route to outflow resistance, but the snippet
    describes the Mendelian MYOC misfolding gain-of-toxic-function mechanism, a different route. Now
    PARTIAL, matching the grade already carried by the companion MYOC expression item.

    2. Alpha Agonists treatment, PMID:14660453. The snippet reports that IOP reduction was similar for
    brimonidine and timolol in a 16-patient trial. That is a non-difference result, so it shows
    non-inferiority to an established agent rather than quantifying clinically meaningful IOP lowering.
    Same error class as the ROP anti-VEGF item already corrected in this PR.

    Suggestion d: filled in the previously absent evidence_source on both Trabecular Meshwork
    Dysfunction items. PMID:10617907 is in situ RNA hybridization on ex vivo human trabeculectomy and
    autopsy specimens, hence IN_VITRO per the CLAUDE.md edge-case rules. PMID:37217093 is a narrative
    review stating a consensus mechanism rather than reporting primary data, hence OTHER.

    Validation: just validate, just validate-references and just validate-terms pass.

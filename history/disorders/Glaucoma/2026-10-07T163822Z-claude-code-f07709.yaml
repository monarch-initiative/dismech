  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added loinc_term LOINC:56844-4 (Intraocular pressure of Eye) to the intraocular pressure biochemical marker and a new Tonometry diagnosis row (NCIT:C120543) with the same code as its measurement. No reference range: the 21 mmHg convention is an ocular hypertension convention rather than a glaucoma diagnostic threshold, and the cited review (PMID:24825645) reports pressures below 22 mm Hg in 25% to 50% of people with glaucoma. The Ocular Hypertension Treatment Study abstract (PMID:12049574) was read and cited for its pressure entry criteria, which are not a diagnostic cut-off. Left alone and reported: the marker context Greater than 21 mmHg in most cases, which sits uneasily with the review figure.

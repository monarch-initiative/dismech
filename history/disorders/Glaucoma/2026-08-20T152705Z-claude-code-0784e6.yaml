  details: |
    Companion edit to the de-novo curation of OPTN-related Open Angle Glaucoma
    (MONDO:0100553) for issue #9029. Two changes, both confined to the OPTN
    record in this entry's `genetic:` block.

    1. Closed an outstanding evidence gap that the record itself had recorded.
    Its note read: "The cited evidence establishes an association with primary
    open-angle glaucoma broadly and does not itself demonstrate the NTG scope
    recorded here ... a source reporting the NTG-specific association is still
    needed." PMID:16043855 (Aung et al., IOVS 2005) supplies exactly that and
    is added as a SUPPORT / HUMAN_CLINICAL evidence item: all 11 E50K-carrying
    patients in the Moorfields series had normal-tension glaucoma, with
    quantified normal presenting and peak diurnal pressures. The sentence
    asking for such a source is removed; the rest of the note, including the
    Causative-versus-Risk-Factor reasoning, is kept verbatim.

    2. Added a pointer to the new dedicated entry, and stated explicitly what
    is NOT being moved. The OPTN mechanism (OPTN-TBK1 misfolding, blocked
    autophagic flux and mitophagy in retinal ganglion cells, clinical course)
    now lives in kb/disorders/OPTN-related_Open_Angle_Glaucoma.yaml and is
    deliberately not re-derived here. This entry keeps the generic IOP-driven
    trabecular-outflow account of adult POAG - which is precisely the arm that
    does not apply to the OPTN entity, since that disease occurs at normal
    intraocular pressure.

    Nothing else in this file was touched: no pathophysiology, phenotype, or
    treatment content changed, and the existing PMID:26302410 PARTIAL item and
    its explanation are unmodified.

    VALIDATION. just validate-disorders over this file and the new entry (the
    batched --no-full-text sweep CI runs): passed, 128/128 snippets verified.
    The two reported WARN items - ega:EGAS00001000624 and
    metabolomics_workbench:ST001442 under `datasets` - are pre-existing, arise
    from those reference types having no fetcher, and are untouched by this
    change. just check-duplicate-keys: clean.

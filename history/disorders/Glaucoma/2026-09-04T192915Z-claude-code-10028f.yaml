  details: |
    Backfill for issue #8085. No pathograph link was added. This records, in the entry's own review_notes: field, that the exposure is deliberately left unlinked, and the reason specific to this entry.

    Entry dispositioned (1):
      - Family History

    Family History: A familial relative risk is a heritability estimate, not an exposure: nothing is encountered, and the four nodes here are pressure and neurodegeneration steps. This entry already carries its heritable content in the genetic section.

    The Age exposure in this file was dispositioned in an earlier revision of this change and has been withdrawn. The reason given was that the entry carries no senescence or ageing node for age to act on. That is true of the node names and false in substance: the Elevated Intraocular Pressure node already cites PMID:26497784 with the snippet 'Elevated intraocular pressure and aging, the main risk factors for glaucoma, accelerate RGC apoptosis', and Retinal Ganglion Cell Death is the next node in the file, citing that same paper. The mechanism is present and attached to the node it would act on, so Age belongs in a linking tranche rather than here. No argument for declining it survived inspection.

    Family History is unaffected by that. No Family History exposure is linked anywhere in kb/disorders, so the reason is not contradicted by the repository, and this entry does carry its heritable content in the genetic section.

    review_notes rather than notes: `notes:` is disease content and renders on the public disorder page, `review_notes:` is the curation record and renders nowhere. The waiver sentinel is a prefix match on a different sentence, so this does not trip it and the waiver count is unchanged at 4.


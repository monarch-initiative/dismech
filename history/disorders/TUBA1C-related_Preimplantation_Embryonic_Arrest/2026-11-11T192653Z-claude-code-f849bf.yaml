  details: |
    Addressed the round-1 review of PR #17072. Removed the genetic-counseling target_mechanisms edge onto Biallelic TUBA1C Truncating Variants (counseling identifies the variant, it does not modulate it) and moved its PMID:41005306 evidence to treatment level. The disease description, notes and treatment description now say that no disease-modifying treatment is reported and that the counseling evidence is cohort-wide for oocyte/embryo defects, not TUBA1C-specific. Dropped the unmodified GO:0000226 binding from the trigger node, whose evidence does not measure that process; the downstream spindle node carries the measured process. Reworded the GENETICS_ENVIRONMENT_DISEASE explanation to what the snippet says (TUBA1C identified as a genetic cause), and removed diagnostic: true from Female Infertility, which does not identify this disorder on its own.

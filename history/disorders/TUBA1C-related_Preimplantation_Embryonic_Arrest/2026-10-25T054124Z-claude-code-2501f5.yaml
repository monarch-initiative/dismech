  summary: 'Create: TUBA1C-related Preimplantation Embryonic Arrest'
  details: |
    New Mendelian entry for oocyte/zygote/embryo maturation arrest 24 (MONDO:0979232), biallelic TUBA1C loss of function causing recurrent preimplantation embryo arrest. Curated from the founding cohort abstract (PMID:39209701; full text not open access) and the oocyte/embryo-defect burden-test study (PMID:41005306, full text), whose heterozygous TUBA1C enrichment is recorded as a knowledge-gap discussion rather than as an inheritance claim. No animal model exists. Validated with just validate, validate-terms and count-verified-snippets (14/14). Deletes the stub. Closes #15586.

    Review round 1 (PR 15593): removed the oocyte cell-type binding from the spindle node, whose assay system the abstract does not state; moved the burden-test authors' spindle speculation about heterozygous carriers into the heterozygous-contribution discussion; added TUBA1C oocyte/embryo expression (PMID:41005306) as evidence on the trigger node; replaced the ClinGen note with the fact that the committed ClinGen export has no TUBA1C row; linked the claim issue and PR.

    Deep research: ran OpenScientist (research/TUBA1C-related_Preimplantation_Embryonic_Arrest-deep-research-openscientist.md). The recipe exited 3 because term validation timed out reaching EBI; just validate-research-terms was re-run afterwards. just preflight-dr returned WARN only for TUBB8 mentions, which are the beta-tubulin precedent, not a second entity. The report adds no TUBA1C-specific source beyond PMID:39209701; its other citations concern TUBB8, KIF11 and GMNN. Taken from it: the ClinVar records for both variants (VCV003901262, VCV003901263; both Pathogenic for OZEMA24), confirmed against ClinVar esummary. Not taken: an IMPC claim that Tuba1c knockout mice are fertile (record not retrieved), and donor-oocyte management (evidenced only for TUBB8/KIF11).

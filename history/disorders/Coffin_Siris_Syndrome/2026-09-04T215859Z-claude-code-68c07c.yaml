  summary: Add CSS4 (SMARCA4) subtype binding MONDO:0013821 / MRD16
  details: |
    Curation of MONDO:0013821 (intellectual disability, autosomal dominant 16 / MRD16 / OMIM 614609), claimed in issue #11015.

    entry_type decision: SUBTYPE, not a standalone kb/disorders/ entry. Three reasons, all sourced.

    First, MONDO itself defines MONDO:0013821 as 'Any Coffin-Siris syndrome in which the cause of the disease is a mutation in the SMARCA4 gene', and its synonym set includes 'Coffin-Siris syndrome 4', 'CSS4' and 'SMARCA4-related BAFopathy' alongside the MRD16 labels. It is a Coffin-Siris syndrome by definition, not a sibling of one.

    Second, GeneReviews establishes the diagnosis of Coffin-Siris syndrome by a heterozygous pathogenic variant in any one of fourteen genes including SMARCA4 (PMID:23556151). That makes the gene the subtype axis inside this disease rather than a disease boundary. ClinGen agrees from the other direction: its definitive assertion is SMARCA4 against Coffin-Siris syndrome itself, MONDO:0015452.

    Third, the repository already curates SMARCA4 inside kb/disorders/Coffin_Siris_Syndrome.yaml's genetic block with its own evidence, so a standalone entry would have duplicated the whole BAF-complex pathograph to hold a gene that is already here.

    The gene search the issue asked for was run and is what settles the boundary the other way, too. SMARCA4 appears in kb/ in Coffin_Siris_Syndrome.yaml, Rhabdoid_Tumor_Predisposition_Syndrome_2.yaml, Rhabdoid_Tumor.yaml, Atypical_Teratoid_Rhabdoid_Tumor.yaml, Small_Cell_Lung_Cancer.yaml and the epigenetic-machinery module. RTPS2 is germline loss-of-function SMARCA4 and is correctly a separate entry; Nicolaides-Baraitser syndrome (SMARCA2) likewise. Those are separate clinical entities, not gene-defined slices of Coffin-Siris syndrome, so the subtype call does not conflict with them.

    What was added: a has_subtypes entry 'CSS4' with display_name 'Coffin-Siris syndrome 4 (SMARCA4-related)', subtype_term bound to MONDO:0013821, the SMARCA4 gene, autosomal dominant inheritance, and nine evidence items.

    Content the entry carries beyond the binding. The MRD16 name is explained rather than left as an alias: a substantial share of SMARCA4 patients present as intellectual disability or autism without the classic Coffin-Siris craniofacial and digital features (PMID:34813034 - eight patients, all with moderate to severe ID, seven autistic or likely autistic, less likely than published CSS patients to show craniofacial or finger/toe anomalies). The genotype-phenotype claims are stated with the hedges their sources put on them: SMARCA4 CSS variants were originally all non-truncating (PMID:23815551), which is what separated them from the loss-of-function alleles causing RTPS2, but a 15-patient SMARCA4 registry cohort later included two nonsense variants at the mild end (PMID:32686290); and the SMARC-versus-ARID organ-severity correlation from the 208-patient registry study (PMID:34205270) is cited together with that study's own conclusion that everyone with a BAF-related condition is at risk of most of the phenotype and surveillance should be broad.

    Scope, recorded in the subtype's review_notes so the single-subtype list is not misread: Coffin-Siris syndrome has fourteen causal genes and the numbered types each have their own OMIM/MONDO identity. Only CSS4 is added here because that is the concept #11015 covers; the absence of the others reflects what has been curated, not a claim that SMARCA4 is the only subtype.

    Stub: stubs/Intellectual_Disability_Autosomal_Dominant_16.yaml is deleted, because MONDO:0013821 is now bound in kb/ as this subtype's subtype_term - which is the condition the issue set for deletion.

    Evidence and validation: 131/131 snippets verified across the whole file after the edit, of which nine are the new subtype's. No DOI-prefixed citations, so nothing skipped by prefix. just validate, validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms and check-stubs all pass, as do whole-KB check-title-snippets, check-snippet-length and check-snippet-grading. The batch validator rewrote 29 tracked references_cache files with cosmetic frontmatter changes; those were reverted with git checkout rather than committed.

    Deep research: a falcon run was launched for this concept with a disambiguating query naming SMARCA4, OMIM 614609, CSS4, and explicitly excluding SMARCA4 rhabdoid tumour predisposition and SMARCA2 Nicolaides-Baraitser syndrome. It had not returned after roughly three hours of provider time and is not part of this change. Nothing in this edit depends on it; every claim is cited to a fetched, snippet-verified reference. Reproduce with: just research-disorder falcon <slug> with that disease_name override, noting that research-disorder requires a kb/disorders/ file to exist, so a temporary skeleton was used and removed before commit.

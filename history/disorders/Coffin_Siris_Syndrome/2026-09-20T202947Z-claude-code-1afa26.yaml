  summary: Add the CSS6 (ARID2) subtype row declined from the MRD series enumeration
  details: |
    Added the CSS6 (ARID2-related Coffin-Siris syndrome, MONDO:0033492) has_subtypes row with bound subtype_term, bound ARID2 gene descriptor, inheritance, description and five exact-quote evidence items from the ClinGen ARID2 gene-validity record, plus the reciprocal genetic[].subtype foreign key on the existing ARID2 entry. The concept was encountered while enumerating gene-defined subtypes under MONDO:0015802 for issue 12226 and was declined there: MONDO's own textual definition reads "any Coffin-Siris syndrome in which the cause of the disease is a mutation in the ARID2 gene", and ClinGen curates ARID2 against Coffin-Siris syndrome (MONDO:0015452), yet MONDO asserts the class under the non-syndromic intellectual disability parent rather than under Coffin-Siris syndrome. That contradiction is recorded in the row's review_notes and reported upstream-worthy in the PR. The row also partially answers the scope note the existing CSS4 row carries about CSS1-CSS3 and CSS5 onward being absent. No other content in this entry was changed.

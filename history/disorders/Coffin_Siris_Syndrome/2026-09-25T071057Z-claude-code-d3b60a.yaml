  summary: 'Genetics pass: ten numbered subtype rows, SOX4 and SMARCD1 added (d2g
    series-038)'
  details: |
    Genetics pass over the gene-defined MONDO subtypes of Coffin-Siris syndrome (issue 12245, series-038).

    Anchor check: disease_term MONDO:0015452 verified against OLS; the label matches and the class is the disease umbrella, not an over-broad grouping. Enumerating its descendants in the local MONDO build returned eleven classes besides the root, all eleven now curated as has_subtypes rows, plus CSS6 (MONDO:0033492), which MONDO files under autosomal dominant non-syndromic intellectual disability instead.

    Ten new has_subtypes rows with HP:0000006 inheritance, hgnc gene descriptors and exact-quote evidence: CSS1, CSS2, CSS3, CSS5, CSS7, CSS8, CSS10, CSS11, CSS12 and SOX11. Nine bind the MONDO class as subtype_term. The SOX11 row deliberately does not, because MONDO:0014376 is already the disease_term of SOX11-Related_Neurodevelopmental_Disorder; that row carries the gene for the parent pathograph instead of claiming the same identifier twice. Nine existing genetic records gained subtype foreign keys, so the subtype names are now referenced rather than declared and unused.

    Two new genes. SOX4 (hgnc:11200) was already named as a gene descriptor on the SOXC limb-patterning node but had no genetic record, which is exactly the binding gap this campaign measures; it now has one. SMARCD1 (hgnc:11106) was absent entirely and was added both as a genetic record and as a gene descriptor on the BAF/SWI-SNF node, with its own evidence item on that node. SMARCC2 was also bound to that node, supported by the BAF-complex gene list sentence already cached for the ARID2 cohort paper; it previously reached no node.

    Both new genes carry a recorded phenotype caveat rather than a clean equivalence. The largest SOX4 cohort states that these patients resemble Coffin-Siris syndrome but lack its most specific features and calls the entity a fairly non-specific neurodevelopmental syndrome; the SMARCD1 founding series reports overlap with the BAF-related syndromes without their typical facial dysmorphisms. Both are curated as subtypes because the genes sit in the same developmental programmes as the rest of the series, with the distinction stated in the row and in the entry notes rather than smoothed over.

    SMARCA2 was deliberately left without a subtype row: it is retained as a genetic record because it was one of the six SWI/SNF genes in the founding 2012 series, but it principally causes Nicolaides-Baraitser syndrome, which has its own entry, and no descendant of MONDO:0015452 is defined by SMARCA2. The notes also record that MONDO's primary labels for CSS2, CSS3, CSS4 and the SOX11 class name intellectual disability rather than Coffin-Siris syndrome, and that SMARCB1 and SMARCA4 are separately tumour-predisposition genes whose somatic role belongs in the tumour entries.

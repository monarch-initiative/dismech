  summary: Bind LOINC Ebola virus antigen and RNA codes
  details: |
    LOINC tranche B batch 26. Both biochemical markers take a loinc_term. Ebola Virus Antigen takes LOINC:71768-6 (Ebola virus Ag [Presence] in Specimen by Immunoassay): the analyte is viral antigen and the method is immunoassay, matching the antigen-capture ELISA listed among the marker's assays. LOINC's other Ebola antigen code, LOINC:41637-0, is immunofluorescence, a different method, so it was not used.

    Ebola Virus RNA takes LOINC:41636-2 (Ebola virus RNA [Presence] in Specimen by NAA with probe detection), the specimen-level code rather than the blood-specific LOINC:86518-8. The marker is not restricted to a specimen and its evidence covers detection in blood and in semen, so binding the blood code would narrow the marker to one of the two.

    Enumeration basis: Monarch KG LOINC set, query Ebola, 17 results, total equalled shown so fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code present, so identity is carried at the method-qualified level.

    Both codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand.

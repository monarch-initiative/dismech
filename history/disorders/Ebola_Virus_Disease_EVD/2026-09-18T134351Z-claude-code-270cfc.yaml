  summary: 'Review round: substantiate mAb claims, bind agents, connect to pathograph'
  details: |
    Responded to review rounds 1 and 2 on PR #11586, bundled into one push. (1) mAb114's description claimed randomized-trial efficacy its only snippet did not support, and both descriptions carried an unevidenced early-administration claim; each treatment now carries a second evidence item quoting the trial-benefit sentence and the early-administration sentence from PMID:42579070, and the descriptions were softened to 'reported to substantially improve survival'. (2) Added therapeutic_agent to the bare NCIT:C15986 bindings: REGN-EB3 takes atoltivimab NCIT:C169793, maftivimab NCIT:C170146 and odesivimab NCIT:C170242 because NCIT has no combined Inmazeb term; mAb114 takes ansuvimab NCIT:C175743. All four CURIEs and labels were re-resolved against OLS in the same step as writing them rather than copied from the review, and all four are members of the ChemicalEntityTerm enum cache. (3) Replaced the mAb114 snippet that carried the raw PDF hyphenation artifact 'anti -\nbody'; the replacement quote starts after the line break, so no word is repaired inside a quotation. (4) Added this history record. Also took suggestions 5 and 7: each treatment now has a target_mechanisms edge to Immune Evasion and Viral Replication with treatment_effect INHIBITS, evidenced by the neutralize-circulating-virus sentence, and both treatments are renamed to carry trade name and INN. Validated with just validate (77/77 snippets verified, up from 73), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms and check-snippet-grading. Incidental full-text refetch churn that just validate produced across 49 unrelated references_cache files was reverted to keep the PR scoped.

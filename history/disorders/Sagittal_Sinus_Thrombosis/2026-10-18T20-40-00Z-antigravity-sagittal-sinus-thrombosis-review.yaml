  summary: Split Venous infarction and Raised intracranial pressure into separate pathophysiology nodes with evidenced causal edges to all 7 phenotypes, added environmental risk-factor entry points and subacute oral anticoagulation / antiepileptic prophylaxis treatments, and added classifications, prevalence, differential diagnosis, and references.
  details: 1. Split Venous infarction and intracranial hypertension into Venous infarction (driving Focal neurological deficits and Hemorrhagic parenchymal injury) and Raised intracranial pressure (driving Intracranial hypertension, Headache, Papilledema, and Reduced consciousness), and attached exact-quote evidence (PMID:17183977, PMID:25073867, PMID:29039017, PMID:38050259) to every downstream causal edge. 2. Added environmental risk-factor entry points (Oral contraceptives, Pregnancy and puerperium, Infection) with influences_mechanisms targeting Sagittal sinus thrombus and venous outflow obstruction (PMID:25073867), and added Subacute and secondary-prevention oral anticoagulation (warfarin or direct oral anticoagulants, PMID:25073867, PMID:39492709) and Antiepileptic seizure prophylaxis (PMID:25073867) to treatments. 3. Added NEUROLOGIC alongside CARDIOVASCULAR in classifications.harrisons_chapter, prevalence (RARE, measure_type UNKNOWN, PMID:38050259, PMID:25073867), Ischemic stroke (MONDO:1060198) in differential_diagnoses (PMID:25073867), and top-level references.

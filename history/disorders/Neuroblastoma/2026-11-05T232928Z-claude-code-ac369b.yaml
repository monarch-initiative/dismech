  summary: 'Edit: Neuroblastoma, LOINC codes for NSE, LDH, ferritin, the urinary VMA/HVA
    panel and MYCN FISH'
  details: |
    LOINC tranche for the measurement side of the entry. The entry bound three LOINC codes (the I-123 MIBG scan and the VMA and HVA Parts); it now binds six more: two already cached (the LDH and ferritin Parts) and four seeded here.

    Biochemical. The Neuron-Specific Enolase row gains loinc_term LOINC:LP14658-6 (Enolase.neuron specific, the LOINC Part) and one notes sentence on why the Part is bound. Two new rows, inserted before it so that they do not touch the end of the section that #16616 edits: Lactate Dehydrogenase (NCIT:C25184; LOINC:LP15033-1) and Ferritin (NCIT:C16577; LOINC:LP15568-6), both presence INCREASED. LDH evidence: the INRG Data Commons analysis (PMID:32472746; 5-year EFS by LDH group and independent prognostic value after adjustment for age, MYCN and stage, plus its statement of purpose, graded BACKGROUND, that LDH and ferritin have not been used in risk stratification apart from one German trial), the Pediatric Oncology Group recursive partitioning study (PMID:1514525) and the relapse-restricted cohort the entry already cites (PMID:12932669, same sentence and grading as the Catecholamine Metabolites row). Ferritin evidence: the Childrens Cancer Study Group series (PMID:3986811; elevation by stage and independent prognostic value in stages III and IV), the INRG analysis, and the stage IV versus IV-S series (PMID:7254280). No reference ranges or interpretation bands are recorded for either: the INRG groups are survival groupings from one analysis, not clinical cut-offs, and a population reference interval is not disease content.

    Diagnosis. The Urinary Catecholamine Metabolites row gains the urine panel code LOINC:90250-2 (Vanillylmandelate and Homovanillate panel - Urine) beside the two Parts, and a notes sentence on why the 24-hour panel that adds creatinine (LOINC:48644-9) is not used. A new row, MYCN Amplification Testing, binds NCIT:C17563 Fluorescence In Situ Hybridization as diagnosis_term and LOINC:93796-1 (MYCN gene amplification in Blood or Tissue by FISH) and LOINC:93797-9 (MYCN gene copy number/Chromosome 2 copy number in Tissue by FISH) as measurements. Evidence: the INRG Biology Committee consensus (PMID:19401703, OTHER and REVIEW_SYNTHESIS: MYCN status in every resected neuroblastic tumour; interphase FISH preferred; the table definitions of not amplified, 2p24 gain and amplification) and the Pediatric Oncology Group comparison of FISH with Southern blotting (PMID:11420745). The INRG categories are given in results, not as interpretation bands, because each category includes its upper bound while a band includes its lower bound, so bands would misplace a ratio of exactly 1 or 4. No 1p, 11q or 17q sentence of the INRG paper is quoted.

    Term and label sourcing. No LOINC label was typed. Labels for the four uncached codes were read from the Monarch KG entity endpoint by the build script and confirmed by just loinc-seed-cache, which wrote their rows to cache/loinc/terms.csv; just normalize-cache then sorted them. None of the six new codes is in cache/loinc/external_copyright_codes.csv. The NCIT labels come from cache/ncit/terms.csv. A Monarch KG search for MYCN among clinical measurements on 2026-11-05 returned three LOINC codes, all by FISH, which the row's notes record.

    Validation: just validate passes and 742 of 742 snippets verify; the C4 gate set passes (see the PR).

  summary: 'Edit: Neuroblastoma - polyamine/ODC1 dependence node and eflornithine
    maintenance, with the approval''s own limitations'
  details: |
    Added the polyamine axis as one pathophysiology node ('Polyamine Biosynthesis Dependence', MOLECULAR, mechanism_confidence PROVISIONAL), one edge to it from the existing MYCN-Driven Proliferation node, and one treatment record for eflornithine maintenance. 15 evidence items from 8 references, all newly fetched. The node binds hgnc:8109 ODC1 with modifier INCREASED, GO:0004586 ornithine decarboxylase activity and GO:0006596 polyamine biosynthetic process; all three CURIEs and labels were read from cache/hgnc/terms.csv and cache/go/terms.csv in the step they were written. Including the molecular_functions descriptor beside the gene is what keeps check-gene-activity-grounding clean, which it would not be for a bare genes: descriptor. Three precision decisions, each against what the plan line for this item implied. First, mechanism_confidence is PROVISIONAL rather than ESTABLISHED, and the node says why: a 2025 study found low-dose eflornithine neither extended survival in mouse models nor moved translation biomarkers, and sensitivity did not track MYCN or ODC1 copy number, so polyamine depletion is not established as the operative mechanism at the approved dose. Those two results are recorded as REFUTE items on the treatment. Second, the node does not claim ODC1 is an independent prognostic marker: the abstract's 'independent of MYCN amplification' describes a stratified analysis, and the same paper's full text states that adding ODC1 expression did not add independent significance to its own prognostic model, which the evidence item's explanation records. Third, the treatment description states the approved indication in full (maintenance to reduce relapse risk after at least a partial response to prior therapy including anti-GD2 immunotherapy) rather than 'FDA-approved for high-risk neuroblastoma', and records that approval rested on an externally controlled trial which the FDA review calls the first oncology approval to rely on that design; the reviewers' own statement that the missing randomised trial was a significant limitation is a REFUTE item rather than prose. No return edge from the polyamine node back into MYCN-Driven Proliferation: the reciprocal dependence is real but an edge would create a two-node cycle in the pathograph, so it is stated in the node description instead. Two facts are recorded in treatment notes without an evidence item because no cached publication carries them, and both are flagged as such in place: the EMA application was withdrawn in July 2025 with a provisional view that effectiveness was not demonstrated (the agency's own medicine page), and the single randomised test of eflornithine in neuroblastoma, an add-on in relapsed disease (NCT03794349), posted response rates showing no advantage. The registry record was fetched and its cached body holds only the brief summary, so those figures are genuinely unquotable; the cache file was deleted rather than committed uncited. Deliberately did not create the clinical_trials: section, which the modelling analysis recommended: that section has a designated creator PR in the project slate. Deliberately did not create a discussions: KNOWLEDGE_GAP for the dose-mechanism question either, although recommended, because another open unmerged PR creates that top-level key and two creators would merge into a duplicate key; the dose-mechanism gap is carried in the node description and treatment notes instead. MYCN-Driven Proliferation was not renamed. The node was inserted before ALK Signaling Activation and the treatment appended at the end of treatments:, both chosen to keep the hunks clear of other open PRs' edit sites. Validated with just validate (289/289 snippets, 298 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-snippet-grading, check-title-snippets, check-gene-activity-grounding --against-ref origin/main, and validate-disorders.

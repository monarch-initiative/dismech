  summary: 'Edit: Neuroblastoma, NCI Thesaurus accepted-use evidence on six treatment
    rows'
  details: |
    Added nine NCI Thesaurus accepted-therapeutic-use (NCIT:P302) items to six treatment rows. Each snippet is a row of the already-cached references_cache/NCIT_<code>.md record, read from that file rather than typed, so no reference was fetched. Risk-Adapted Chemotherapy gains etoposide (NCIT:C491), cyclophosphamide (NCIT:C405), vincristine sulfate (NCIT:C1739) and doxorubicin hydrochloride (NCIT:C1326); Anti-GD2 Immunotherapy gains dinutuximab (NCIT:C1570); Naxitamab with GM-CSF gains naxitamab (NCIT:C123428); Isotretinoin gains NCIT:C603; Eflornithine Maintenance gains eflornithine hydrochloride (NCIT:C1579); and Autologous Stem Cell Transplant gains melphalan (NCIT:C633).

    Salt forms. For vincristine, doxorubicin and eflornithine the record that names neuroblastoma is the salt's, while the rows bind the parent compound. Each explanation says so. The parent records were checked: vincristine (NCIT:C933) and eflornithine (NCIT:C226) do not name neuroblastoma, the latter listing only facial hirsutism and Trypanosoma brucei gambiense infection, so the salt records are the only accepted-use citations available.

    Two structural additions. Melphalan (CHEBI:28876) is bound as the transplant row's therapeutic agent, because every high-dose regimen the row describes contains it (single carboplatin-etoposide-melphalan, busulfan-melphalan, and the tandem arm's second transplant); without the binding the melphalan record had no row to attach to. Isotretinoin gains therapeutic_modality SMALL_MOLECULE, the one treatment row that lacked a modality.

    Left out on purpose: NCIT:C970 iobenguane I-131 (its accepted-use text names neuroendocrine tumours, not neuroblastoma); the crizotinib and lorlatinib rows (outside this project's scope for ALK-inhibitor evidence); cisplatin, carboplatin, topotecan and sargramostim (their records do not name neuroblastoma); dacarbazine (NCIT:C411), dactinomycin (NCIT:C412) and etoposide phosphate (NCIT:C1093), whose records name neuroblastoma but which the entry does not bind.

    Validation: validate-disorders passes; 732 of 732 snippets verified; the C4 gate set (duplicate keys, entity refs, causal targets, coarse phenotypes, enum values, block scalars, snippet grading, folded hyphens and YAML, snippet length, title snippets, retired prose, reference titles, environmental evidence, gene grounding, case collisions, the kb pytest lane) and check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms, validate-terms and check-delivery-system all pass. No cache rows changed.

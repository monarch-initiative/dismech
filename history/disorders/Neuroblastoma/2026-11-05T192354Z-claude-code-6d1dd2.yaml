  summary: 'Edit: Neuroblastoma, eight GEO dataset records for the reference cohorts'
  details: |
    Added eight GEO dataset records, chosen by accession from the neuroblastoma literature rather than by GEO index search, which does not surface these cohorts: GSE49710 and GSE49711 (the 498-tumour SEQC cohort, microarray and RNA-seq arms, PMID:25150839), GSE45547 (649 tumours, PMID:23579273), GSE16476 (88 samples, linked to five publications including PMID:23042116, which this entry already cites), GSE120572 (the telomere-maintenance classification study, PMID:30523111), GSE163431 (the developmental-origins study, PMID:33767450), GSE253865 (single-cell transcriptomics of neuroblastoma tumours, PMID:39368085) and GSE189743 (neuroblastoma with opsoclonus-myoclonus-ataxia syndrome, PMID:37537844).

    How the records were built: each accession was looked up with the repository's own GEO code (scripts/discover_datasets.py search and summary functions, the same Candidate construction and data-type mapping as discovery) and verified with scripts/verify_dataset_accessions.py, which wrote the eight references_cache/GEO_*.md files committed here. Records were built with build_dataset_records.candidate_to_record and spliced with its splice_datasets function under the same two checks its apply step makes (nothing but datasets changed; the count rose by exactly eight). The apply command itself could not run on Python 3.12 because it calls Path.read_text(newline=...), which needs Python 3.13. Titles, sample counts, organisms and publications are GEO's own values.

    Three of the eight are GEO SuperSeries whose own summary only points to their sub-series, so their descriptions were written from the sub-series records: GSE120572 holds two expression-array cohorts (GSE120559, 208 samples; GSE120568, 186 samples); GSE189743 holds RNA-seq (GSE189367, 64), B-cell receptor sequencing (GSE189741, 63) and T-cell receptor sequencing (GSE189742, 57), so its data type is MULTI_OMICS; and GSE163431 holds three cell-line sub-series, bulk RNA-seq of SK-N-BE(2)C with all-trans retinoic acid (GSE163428, 4), single-cell RNA-seq of IMR-5/75 with an shRNA against MYCN (GSE163429, 2) and single-cell RNA-seq of SK-N-AS (GSE163430, 16), so its data type is SINGLE_CELL_RNA_SEQ for the majority. GSE163431 contains cell-line data only, so it is not a patient or fetal adrenal atlas. GSE16476's GEO summary describes the R2 analysis platform, so its description states what GEO's design line says, 88 human neuroblastoma samples.

    Not changed: the existing GSE85047 record already binds its tissue through sample_types tissue_term, so its descriptor term was left as it is. No evidence blocks were added; each record carries publication and a provenance note, as the dataset curation guide asks for generated records.

    Validation: verify-datasets 9 of 9 OK; validate-disorders passes; 732 of 732 snippets verified; the C4 gate set including the kb pytest lane passes, as do check-cache-order, validate-terms and check-reference-titles-present.

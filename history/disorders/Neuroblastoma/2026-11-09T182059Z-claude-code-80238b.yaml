  summary: 'Review round 1: GD2 item direction, INRG and SIOPEN attachment'
  details: |
    Automated review round 1 on PR #16927. All three blocking items accepted, all four suggestions taken, one push.

    Item 1, the GD2 heterogeneity item, was graded REFUTE and is now SUPPORT. The reviewer's argument is the decisive one: supports is direction relative to the claim the entry makes, and this node's own description already says 'Expression is not uniform, and it can be absent', with the existing PMID:27654028 bone-marrow items (12.0% complete or partial negative staining) graded SUPPORT for exactly that. A whole-slide result finding 31% of tumours with fewer than 90% GD2-positive cells therefore backs the node as written. The old explanation conceded the problem in its own first clause - 'Recorded as a refutation of the uniform-expression reading this node invites rather than of the node itself' - which is grading against a reading rather than against the claim. Any consumer filtering on supports would have seen an item contradicting GD2 expression in neuroblastoma, the opposite of what the study found. The whole-slide figure (14 of 45, coexisting GD2-positive and GD2-negative populations in one lesion) is now in the node description beside the marrow 12.0%, with a sentence saying why both are kept: tissue-level heterogeneity across a section and marrow-cytology negativity are different observations.

    Item 2, the INRG consensus item on the 123I-MIBG Scintigraphy diagnosis row, quoted a sentence about image-defined risk factors and anatomic staging. The explanation itself said it established 'what imaging decides in the staging system rather than anything about MIBG scintigraphy itself, which is this row's subject' - the CLAUDE.md case of a quote that is true and worth citing but not about this claim. Swapped for the reviewer's suggested sentence from the same abstract, which names scintigraphy among the methods whose rationale and technical guidelines the consensus sets out, verified as an exact substring of references_cache/PMID_21586679.md.

    Item 3, the SIOPEN item on the MIBG-Avid Disease finding, is dropped rather than relocated. Its explanation also conceded the point ('not any fact about MIBG avidity'). The cached abstract of PMID:41823177 contains no occurrence of MIBG or metaiodobenzylguanidine at all, so there was no better sentence to swap in, and the diagnosis rows are all modality-specific (123I-MIBG scintigraphy, 18F-FDG PET/CT, urinary catecholamine metabolites, MYCN amplification testing, 18F-mFBG PET/CT) with no general imaging or staging-workup row where a statement that SIOPEN publishes consensus imaging recommendations would support stated text. Adding a claim for the purpose of hosting the evidence item would be the same defect this review is about, so the item is gone and the paper is available if such a row is ever added. Dropping it left references_cache/PMID_41823177.md uncited - the citation list was re-derived after the edit, not before - so that cache file, which this PR had added, is removed from the PR too. Every other cache the PR adds was re-checked and is still cited.

    Suggestion 1: the two 3-MT items cited facts the marker row did not state, and one explanation said so outright ('Adds a metabolite this marker row does not name ... Recorded so the lead is findable'). The row's notes now carry both facts - 3-methoxytyramine's review-level association with MYCN-related biology and unfavourable outcome, explicitly without a cohort or effect size, and the move from colorimetric and immunoassay methods to LC-MS/MS with the metrological-traceability caveat - and the explanation now points at that text instead of excusing its absence.

    Suggestion 2: the mFBG description claimed PET/CT 'is a single-day examination'. The cited meta-analysis says only that the MIBG study takes 2 days, so the sentence is rewritten to what the source supports: it avoids the two-day procedure and the low spatial resolution the same meta-analysis lists among the scintigraphic study's limitations.

    Suggestion 4: the gold-standard snippet started mid-parenthesis at 'MIBG) scintigraphy'. Re-cut to begin at 'scintigraphy' - 35 words, verified against the cache through the validator's own normalizer, since the raw substring test fails on the ± character.

    Suggestion 3 is not actionable in this session. The reviewer notes that therapeutic_agent on a diagnosis_term calls a diagnostic radiotracer therapeutic, says the pattern is acceptable for now, and suggests an issue proposing a tracer/contrast-agent slot before it spreads. Opening a new issue is outside this session's standing GitHub approvals, so it is recorded here and in the project checkpoint for the repository owner.

    Validation after the round: just validate-disorders clean (781 snippets, 798 titles, 0 issues; 782 before, the drop accounting for one), check-snippet-grading clean, and the fifteen offline KB gates pass.

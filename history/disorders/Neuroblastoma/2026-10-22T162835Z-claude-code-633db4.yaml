  summary: 'Edit: Neuroblastoma - GD2 antigen and antibody-killing nodes; correct
    and evidence the anti-GD2 treatment record'
  details: |
    Added the GD2 axis as two pathophysiology nodes and rewrote the anti-GD2 treatment record, which previously carried no evidence at all. Nodes: 'GD2 Surface Antigen Expression' (MOLECULAR, chemical_entities bound to CHEBI:28648) and 'Anti-GD2 Antibody-Mediated Tumor Cell Killing' (CELLULAR, GO:0001788 antibody-dependent cellular cytotoxicity and GO:0006958 complement activation classical pathway, both INCREASED), with one edge between them marked in its description as intervention-conditioned, following the pattern of keeping the antigen as a tumour property separate from the killing as a therapy effect. 17 evidence items from 9 references, all newly fetched. The treatment description was factually outdated rather than merely thin: it presented dinutuximab with GM-CSF and interleukin-2 as the standard regimen, which describes the 2010 ANBL0032 arm and the United States label. Two corrections follow from the randomised evidence. First, the ANBL0032 comparator arm received isotretinoin, which both arms got, so the randomised comparison is the antibody added to isotretinoin rather than immunotherapy against nothing; the quoted design sentence makes that explicit. Second, the European HR-NBL1/SIOPEN randomisation found no event-free survival benefit from adding subcutaneous interleukin-2 to dinutuximab beta and recommended the regimen without it, and the current COG frontline protocol omits it, so interleukin-2 is described but deliberately not bound as a therapeutic agent. A 2026 systematic review finding that no trial has isolated GM-CSF's own contribution is cited for why the benefit is recorded as a regimen-level effect; GM-CSF is still bound as an agent because it was part of the tested regimen. For the survival claim the five-year follow-up (PMID:33504555) is cited rather than the early overall-survival P value, which the trial report itself flags as unadjusted for interim analyses. Naxitamab was given its own treatment record rather than being folded in, because its indication (relapsed or refractory disease in bone or bone marrow), its line of therapy and its evidence strength (United States accelerated approval on single-arm response rate) all differ from the post-consolidation antibody. treatment_term is NCIT:C15490 Monoclonal Antibody Therapy with therapeutic_modality MONOCLONAL_ANTIBODY on both records; target_mechanisms on both point at the killing node with treatment_effect ACTIVATES, since the drug creates the mechanism rather than inhibiting a disease process. Every CURIE was resolved by lookup in the step it was written: CHEBI:28648 and NCIT:C15490 through ols:chebi and ols:ncit info, and NCIT:C1570 Dinutuximab and NCIT:C123428 Naxitamab through an ols:ncit label search, because the slate-review notes offered CHEBI identifiers for the antibodies that were leads rather than checked bindings. CHEBI:28648's canonical label is the full structural name and was copied exactly rather than replaced with 'ganglioside GD2', which sits in preferred_term. Deliberately left out: the mesenchymal-state-to-GD2 edge, because the node it needs is in an open unmerged PR and the edge would dangle; GD2-CAR T cells and anti-GD2 in induction, both investigational; and FCGR3A effect_modifiers, where two studies of the same trial disagree and the schema's rules would require two entries plus a knowledge-gap note. Nodes were inserted before 'Telomerase Activation' rather than appended, to keep the hunk clear of another open PR's append point at the end of pathophysiology. Validated with just validate (290/290 snippets, 299 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-snippet-grading, check-title-snippets, check-gene-activity-grounding --against-ref origin/main, check-cancer-origin, and validate-disorders.

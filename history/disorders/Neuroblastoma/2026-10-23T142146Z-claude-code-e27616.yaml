  summary: 'Relapse: RAS-MAPK and p53-pathway lesions, and a relapse progression phase'
  details: |
    Curates what is selected at relapse in neuroblastoma: three pathophysiology nodes and the entry's first progression phase.

    Nodes. 'RAS-MAPK Pathway Hyperactivation' (CELLULAR; GO:0007265 and GO:0070371 INCREASED; NRAS, KRAS, HRAS, BRAF, PTPN11, NF1, FGFR1; conforms to sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation), 'p53 Pathway Inactivation' (MOLECULAR; GO:0072331 DECREASED; TP53, MDM2, CDKN2A; conforms to evading_growth_suppressors#Tumor Suppressor Inactivation) and an unbound ORGANISM-scale 'Therapy-Resistant Relapse'. Both lesion nodes point at the relapse node; a new first item in the existing ALK Signaling Activation downstream list links the receptor to the RAS-MAPK node, which is what keeps the three from forming a disconnected component.

    The draft came from a workflow run whose scope pre-review and fix phase were both halted by a safety classifier, so none of its fifteen pre-review findings had been applied and the scope checks had never completed. All fifteen were applied by hand in this session and the scope checks re-run.

    Evidence findings applied. The RAS-MAPK node asserted pathway activity while all four of its items reported lesions or selection, so Eleveld's BRAF tandem-duplication experiment was added as an IN_VITRO item: it is the one source here that measures activation. The ALK edge's second item, a bare 'it is known that' background sentence graded IN_VITRO on the strength of an unidentifiable cited study, was dropped; the paper's own inducible-expression experiment above it carries the edge. The CHEK2 and epigenetic-modifier item, whose own explanation said it did not corroborate the node's lesions, moved with its sentence to the progression phase, where the claim is about relapse as a whole; its snippet and grading are unchanged.

    Overstatement findings applied. The p53 description said MDM2 amplification appears as CDK4/MDM2 co-amplification 'in the cohorts cited here', which is true of the SIOPEN cohort only -- the relapse series assayed MDM2 alone and its cache contains no CDK4 at all. It said MDM2 status was reported for 23 of 41 patients, which is not the source's figure: the paper says 3 of 23 of the patients whose relapse tumour was p53-wild-type. And it attributed a high-risk classification to Children's Oncology Group version 2, which the cached paper never names; both places now use the paper's own 'in most of North America' wording. CDK4 was dropped from the p53 node's genes: the cited study's own definition of a p53-pathway abnormality excludes it and files it in the ALK/RAS-MAPK panel, so it is co-amplified with MDM2 but acts in the RB arm.

    Convention findings applied. The relapse node's notes opened with a bare negative-existence claim about GO; it now gives the positive scope reason (GO covers molecular and cellular processes, this node is an organism-level clinical outcome) and rejects GO:0009410 and GO:0097327 on the same induced-response ground. The progression notes said the lesions are 'often already present, usually subclonally' at diagnosis, which nothing in the entry supports for the p53 arm; they now separate the three timings the entry's own sources give.

    biological_scale was decided from the corpus rather than from the draft. The draft tagged both lesion nodes MOLECULAR. Across kb/, the p53 anchor's conformers are 9 MOLECULAR and 4 unset with no CELLULAR, so MOLECULAR stands there; RAS-MAPK-named nodes that set the slot are 6 CELLULAR against 4 MOLECULAR, and CLAUDE.md's own example tags ERK cascade hyperactivation CELLULAR, so the RAS node is CELLULAR.

    Scope checks the halted pre-review never finished, re-run here on the diff: no 1p36, 11q, 17q or chromothripsis content; no ALK-inhibitor or ALK-at-relapse material; no treatments, genetic: records, clinical_trials, mechanistic_hypotheses, inheritance or discussions; no genetic_context or variant_origin, so the entry still derives no cancer cell of origin; MYCN-Driven Proliferation unrenamed; and the one occurrence of 'relapse-specific' is inside a quotation-adjacent explanation of the cited paper's own enrichment analysis, not a characterisation of the lesion class.

    Seven new reference caches committed; two fetched for checking and cited nowhere were deleted, and eight pre-existing caches that the validator rewrites for whitespace were restored rather than staged. No cache/ CSV rows were needed.

    Gates: just validate (449 snippets, 458 titles, 0 issues), validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-gene-activity-grounding and check-cancer-origin, all clean.
- type: REVIEW
  outcome: changed
  sections:
  - pathophysiology
  - progression
  summary: Review round 1 on PR 15336
  details: |
    One blocking finding, and it was a real leftover. The PR body said the MDM2 denominator had been corrected, and it had been - in the 'p53 Pathway Inactivation' node description - but the first PMID:20145180 evidence explanation on the same node still read 'MDM2 status is reported for just 23 of the 41 patients'. The paper reports MDM2 amplification in 3 of 23 cases among the roughly 85% of the 41 patients whose relapse tumour was p53-wild-type, so 41 was never the denominator. The explanation now uses the same wording the node description already used: assessed in only 23 of the roughly 35 patients whose relapse tumour was p53-wild-type. The conclusion it supports, that 20 of 41 is a floor, is unchanged.

    The optional suggestion was taken. The progression phase and the Therapy-Resistant Relapse node both quote the same PMID:26121087 background sentence with near-identical explanations. The phase copy is trimmed to one short explanation that points at the node, which is where the full reading of what the quote does and does not establish belongs. The grading of both items is untouched, so they remain one sentence with one evidence_source.

    Gates re-run after the edit: just validate-disorders (449 snippets, 458 titles, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens and check-folded-yaml, all clean.

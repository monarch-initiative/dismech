  summary: 'Edit: Neuroblastoma - drop an unsourced anti-GD2 regimen claim; bind dinutuximab
    beta'
  details: |
    Review round on the GD2 PR. The review found an unsourced claim in the Anti-GD2 Immunotherapy description: it said European practice and 'the current COG frontline protocol' omit interleukin-2, and nothing cited supports the COG half. The sentence now states only what the cited HR-NBL1/SIOPEN evidence supports, that the randomized comparison found no event-free survival benefit from adding subcutaneous interleukin-2 and that the trialists recommended the regimen without it, against the United States label which still lists it. The COG clause is removed rather than re-sourced, because the registry record that would support it is the frontline trial another PR in this series owns. Also bound dinutuximab beta as a second therapeutic_agent, which the description and the HR-NBL1 evidence both name and which the record did not previously carry. NCIT has no class for it: searched 2026-10-22 with l~Dinutuximab Beta, which returned nothing, and l^Dinutuximab, which returns only NCIT:C1570 Dinutuximab and NCIT:C174559 Dinutuximab/Irinotecan/Temozolomide Regimen. CHEBI carries it as CHEBI:759751, confirmed by ols:chebi search and then by just validate-terms, which accepted it into the ChemicalEntityTerm enum and wrote one row to cache/chebi/terms.csv and one to the enum cache. Dinutuximab stays on NCIT:C1570 so that it matches the naxitamab binding on the sibling record; both search queries and that reasoning are recorded in the treatment notes rather than left implicit. Interleukin-2 is named in the description but deliberately still not bound as an agent, and the notes now say why. Declined the review's third suggestion, that the two GD2 nodes form an island which a downstream edge to a tumour-burden outcome or an on-target neuropathic-pain phenotype would join up, and said so in the reply rather than deferring it: it needs a new phenotype node, which is a different theme and a new edit site in a section a concurrently running session may be using, so it belongs in a follow-up rather than in a review round here. Re-validated with just validate (290/290 snippets, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-block-scalar-comments, check-enum-values and validate-disorders, and ran tools/parallel_check.sh onhold before the push.

  summary: 'Review round 1: regrade MHC background item, trim aim-statement quote'
  details: |
    Automated review round 1 on PR #16926.

    Blocking finding, accepted. The PMID:42827984 background item on the MHC class I node was graded evidence_source: OTHER. The reviewer's reasoning is right and the correction is more than cosmetic: the explanation justified OTHER on the grounds that the sentence 'asserts the state without citing a particular study', which is true of nearly every BACKGROUND quote, so as a rule it would make BACKGROUND imply OTHER and invert the design of the two axes. The quoted sentence is about MHC class I expression in childhood tumour tissue, so it is HUMAN_CLINICAL; quote_role: BACKGROUND already carries the fact that the citing paper is a CAR/TCR T-cell study whose introduction states it. Value changed and the OTHER-justifying clause removed from the explanation.

    The reviewer separately warned against over-correcting the sibling framing quote (PMID:42691625, 'commonly explained by a developmental arrest model'). That one is left on OTHER: it reports what the field's prevailing account is, not a clinical observation, so no evidence_source value describes the evidence behind it. Checked after the edit — the file's count of evidence_source: OTHER went 100 to 99, i.e. exactly the one intended change.

    Suggestion 1, accepted. The PMID:42848963 item in the TMM discussion quoted the study's own aim ('... may improve neuroblastoma risk classification over current standard of care'), and an aim statement has no value in quote_role at all. Trimmed to the clause that genuinely is background - 'telomere maintenance mechanisms (TMM), which have been proposed as key hallmark of high-risk neuroblastoma' - which is the authors restating prior work, so BACKGROUND becomes correct rather than being dropped. The explanation was rewritten with it, because the previous wording turned on the comparison clause the trim removes.

    Suggestion 2, declined with reasons given in the PR reply. The signature-correspondence item stays HUMAN_CLINICAL rather than COMPUTATIONAL: the quoted sentence reports a correspondence observed in patient tumour transcriptomes, and the computational step is the method by which it was measured, not the kind of evidence the sentence describes.

    Suggestion 3 deferred to the repository owner: the reviewer proposed opening a follow-up issue for a pathophysiology node carrying the MYCN-imposed embryonic state with an edge from MYCN-Driven Proliferation. Opening a new issue is outside this session's standing GitHub approvals, so it is recorded here and in the project checkpoint instead of filed.

    Validation after the round: just validate-disorders clean (786 snippets, 803 titles, 0 issues), check-snippet-grading reports no new divergence either per-file or cross-file, and the fifteen offline KB gates pass.

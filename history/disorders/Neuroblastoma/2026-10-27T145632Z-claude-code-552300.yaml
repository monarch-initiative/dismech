  summary: 'c-MYC subset: no proliferation node, recorded as a human/model mismatch'
  details: |
    Closes the question the c-MYC node's own notes left open: whether a proliferation node specific to the MYC-high (MYCN-non-amplified) subset could be sourced. It cannot, and the negative is the finding.

    The proliferative phenotype exists only in model systems. Zimmerman 2018 (PMID:29284669) reports that in transgenic zebrafish the c-MYC-driven expansion of interrenal gland tissue was rapid and sustained where MYCN-driven lesions regressed after five weeks, attributed to reduced apoptosis together with a higher proliferative fraction; and that CRISPR disruption of c-MYC in SKNAS, a MYCN-non-amplified line with high c-MYC, cost viability and colony formation while leaving the MYCN-amplified line Kelly unaffected.

    The one patient-level index reported for the subset does not measure proliferation. The Children's Oncology Group series (PMID:26035700) found MYC-protein-positive tumours more likely to carry a low or intermediate mitosis-karyorrhexis index, where MYCN-protein-positive tumours were high — and then separated the two components of that index, attributing the difference to karyorrhexis rather than to mitosis (data not shown) and reading it as a functional difference between the two proteins in their apoptotic and karyorrhectic pathways.

    So the model's two-part claim is half matched and half unmeasured, which is why this is recorded as a HUMAN_MODEL_MISMATCH discussion rather than as a refutation or as a node. The reduced apoptosis the zebrafish work reports lines up with the lower karyorrhectic count in the patient tumours. The higher proliferative fraction is the part nothing in the human literature addresses: a mitotic-figure count reported only as not being the driver of the index difference is not a proliferation fraction, and neither Ki-67 nor MIB-1 appears anywhere in the COG paper. The cohorts also differ: the COG series is restricted to undifferentiated and poorly differentiated tumours with the subset defined by immunohistochemistry, while the model work follows a subset defined by expression rank.

    Added: a HUMAN_MODEL_MISMATCH discussion (nb_myc_high_subset_proliferation_model_mismatch) attached to the c-MYC node, carrying the zebrafish result and both sides of the COG index comparison as evidence, plus a proposed experiment measuring a Ki-67 or MIB-1 labelling index and a phospho-histone H3 mitotic count so the mitotic and karyorrhectic components are read separately, in a series not restricted by differentiation grade. Added an IN_VITRO evidence item for the SKNAS CRISPR result, which the node's notes previously referred to without citing. Rewrote the notes tail, whose closing sentence said a proliferation node 'would need its own sourcing and is out of scope here' and is now false in the first half and answered in the second.

    No pathophysiology node and no causal edge were added, which was the plan's other permitted outcome. Routing an edge into an existing node to close the gap was explicitly rejected: 'MYCN-Driven Proliferation' would assert a MYCN-driven mechanism of a subset this entry's own reciprocal-expression evidence shows to be MYCN-non-amplified.

    Review round 1 corrected the framing above. The first version of this entry described the patient data as pointing against proliferation and said no source separated the mitotic from the karyorrhectic component. The COG paper does separate them, in a Discussion sentence the first pass missed, and attributes the difference to karyorrhexis; that sentence and the authors' apoptotic/karyorrhectic reading of it are now both cited, and the discussion prompt, rationale and node notes were rewritten so the human data are no longer presented as contradicting the model. The same round reconciled the MYC-positive denominators, which the first version wrongly called irreconcilable: 39 is the total including the one double-positive tumour, 38 is the count the abstract reports beside it, and the index row's 38 follows from MKI having been scored in 343 of the 357 cases.

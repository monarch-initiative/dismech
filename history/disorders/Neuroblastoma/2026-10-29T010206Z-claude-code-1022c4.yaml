  summary: Add differential diagnoses for neuroblastoma's clinical and pathological
    mimics
  details: |
    Adds the entry's first differential_diagnoses section, placed after diagnosis: as in most entries, with 13 rows: Wilms tumor, neonatal adrenal hemorrhage, extralobar pulmonary sequestration, Wolman disease, infantile hepatic hemangioma, sacrococcygeal teratoma, Langerhans cell histiocytosis, acute megakaryoblastic leukemia with t(1;22), alveolar rhabdomyosarcoma, Ewing sarcoma, hepatoblastoma, pheochromocytoma and paraganglioma, and melanotic neuroectodermal tumor of infancy. Each row says why the condition is confused with neuroblastoma in a given setting and lists only distinguishing features that a quoted source states. The change is a pure addition; no existing line changed. Part of the neuroblastoma expansion series (issue 15822).

    Bindings: six rows copy the disease_term of an existing entry (Wilms tumor, Wolman disease, Langerhans cell histiocytosis, alveolar rhabdomyosarcoma, Ewing sarcoma, hepatoblastoma) and the pheochromocytoma and paraganglioma row copies MONDO:0035540 from the Pheochromocytoma and Paraganglioma entry. Melanotic neuroectodermal tumor of infancy uses MONDO:0002072; acute megakaryoblastic leukemia uses MONDO:0018436, the t(1;22) subtype term, because the cited series covers only infants with that translocation; infantile hepatic hemangioma uses MONDO:0002404 liver hemangioma; extralobar pulmonary sequestration uses MONDO:0017246; sacrococcygeal teratoma uses MONDO:0042727. Neonatal adrenal hemorrhage is left unbound because MONDO's only adrenal hemorrhage class describes adult-type bilateral bleeding. The notes on three rows record the MONDO searches behind these choices; they were re-run before commit and return what the notes say.

    PHOX2B: two immunohistochemistry series (PMID:25822764, PMID:28640941) are the discriminator in the Wilms, alveolar rhabdomyosarcoma and Ewing rows. In the pheochromocytoma and paraganglioma row the PHOX2B sources disagree (PMID:28986989, PMID:23715162, PMID:38458747), so that row rests on work-up, biochemistry and imaging differences.

    Rows shared in spirit with the reverse Neuroblastoma rows added to six entries in PR 15867 reuse the same sentences with the same evidence_source and quote_role. Left out on purpose: olfactory neuroblastoma and CNS neuroblastoma, FOXR2-activated (their own PRs are on hold), predisposition syndromes, and mimics outside the planned list. 23 new reference cache files; five fetched but uncited ones were not committed.

    Validation: just validate-disorders, validate-terms, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates that CI runs, check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

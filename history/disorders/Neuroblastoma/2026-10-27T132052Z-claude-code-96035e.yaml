  summary: Add the Aurora A-N-Myc stabilisation node, alisertib, and the amplified-benefit
    mismatch
  details: |
    Adds the Aurora A route to N-Myc protein abundance, which the entry did not model at all: before this there was no mention of Aurora A, AURKA, alisertib or N-Myc protein turnover anywhere in the file.

    New pathophysiology node, Aurora A-Mediated N-Myc Protein Stabilization (MOLECULAR, ESTABLISHED), bound to AURKA and FBXW7, to GO:1905761 SCF ubiquitin ligase complex binding as its molecular function, and to GO:0050821 protein stabilization INCREASED with GO:0043161 proteasome-mediated ubiquitin-dependent protein catabolic process DECREASED. One downstream edge to MYCN-Driven Proliferation. Five evidence items from two independent laboratories: Otto 2009 (PMID:19111882) for the interaction with N-Myc and the SCF(Fbxw7) ligase, for the cyclin B/Cdk1 and GSK3 degradation route it counteracts, and for the shRNA screen showing AURKA required in MYCN-amplified cells and largely dispensable without amplification; Gustafson 2014 (PMID:25175806) for the kinase-independence and for the conformation-specific rather than catalytic basis of N-Myc degradation.

    The node is marked ESTABLISHED rather than PROVISIONAL deliberately, and the reasoning is worth recording because the sibling polyamine node went the other way. What is established here is the molecular mechanism: two independent groups, co-immunoprecipitation, degradation assays, cocrystal structures and structure-activity relationships across multiple chemotypes. What is not established is the therapeutic corollary, and that belongs on the treatment record and in a discussion rather than being charged against the mechanism's confidence. The polyamine node is PROVISIONAL because the dependence claim itself is in question; that is a different situation.

    The molecular-function binding needed care. Gustafson shows the stabilisation is kinase-independent, so binding any kinase-activity term would have contradicted the node's own source. GO:1905761 SCF ubiquitin ligase complex binding was chosen because Otto's sentence states the interaction with the SCF(Fbxw7) ligase directly. GO:1990948 ubiquitin ligase inhibitor activity was considered and rejected: it is plausible but adds an interpretive step about whether Aurora A inhibits the ligase or shields the substrate, which neither source settles.

    New treatment record, Alisertib (Aurora A Inhibition), with a target_mechanisms link to the node and three evidence items, and a new HUMAN_MODEL_MISMATCH discussion, mismatch_nb_aurora_a_mycn_amplified_benefit, attached to both. The mismatch is the substance of this PR as much as the node is. The preclinical mechanism predicts that MYCN-amplified tumours are the ones that depend on Aurora A; the phase 2 trial of alisertib with irinotecan and temozolomide (PMID:30093449) predicted the same thing in its own introduction and found the opposite, reporting activity concentrated in MYCN non-amplified tumours and MYCN amplification associated with inferior progression-free survival. The discussion sets out three readings without choosing between them: alisertib is a catalytic-site inhibitor while the stabilisation is kinase-independent, so it may be the wrong tool; the association is exploratory and pooled across three cohorts and MYCN amplification predicts worse outcome regardless of treatment; or the cell-line dependency does not hold in patients. It names what would separate them, a conformation-disrupting compound tested with N-Myc protein measured on treatment.

    One source was deliberately not cited. Brockmann 2013 (PMID:23792191) is the third principal paper in this literature and would have been the natural citation for small-molecule Aurora-A inhibitors inducing proteasomal N-Myc degradation. It carries a published erratum, Cancer Cell 2016;30(2):357-358 (PMID:27505677), confirmed from both PubMed and Europe PMC as "Erratum in" and "Erratum for" respectively. The erratum has no abstract in either source, so what it corrected could not be established, and a claim could not be checked against it. Since Gustafson 2014 covers the same ground with structures and no erratum, the paper was dropped rather than cited with an unresolvable caveat, and its cache file was not committed. Errata were checked on all three cited papers and none has one.

    The phase 1 trial (PMID:26884555) was fetched and then dropped as well: the phase 2 paper summarises its response and survival figures, so citing both would have added a reference without adding a claim. Its cache was not committed either.


  summary: 'Edit: Neuroblastoma - 131I-MIBG therapy row and the NET/SLC6A2 transporter
    node it reaches'
  details: |
    Added one treatment row ('131I-MIBG Therapy') and the one pathophysiology node it targets ('Norepinephrine Transporter (NET/SLC6A2) Expression'), plus a second downstream edge on the existing Neural Crest Developmental Arrest node. 17 evidence items from 8 references, 7 newly fetched. The entry already carried MIBG imaging in diagnosis: and imaging_findings: but no radiopharmaceutical treatment; the pre-existing Radiation Therapy row is external-beam radiotherapy to the primary tumour bed, and NCIT:C192439 Radiopharmaceutical Therapy is a descendant of its NCIT:C15313 binding. Without the transporter node the therapy row would have had nothing in the pathograph to point at, and the uptake biology already curated on the MIBG-Avid Disease imaging row would have stayed disconnected from the treatment. Response figures are kept separate by design because they come from incomparable designs: the randomised NANT phase II rate after one course (14% MIBG alone, 14% with vincristine and irinotecan, 32% with vorinostat) is given with the trial's own pick-the-winner design statement, so the vorinostat arm is described as the arm the design selected rather than one shown superior; the 36% from a 164-patient single-arm phase II is cited with its denominator and design; and the systematic review's 0% to 75% range (mean 32%) across 25 studies is cited together with that review's statement that it identified no randomised controlled trials. Frontline use is recorded as unproven on the Cochrane review, whose 'no RCTs or CCTs' sentence is graded NO_EVIDENCE because it reports the absence of a result rather than cutting either way; its searches run to 2016. The NET-expression predictor is stated only in the direction the study found it (markers of LOWER NET and VMAT2 expression associated with higher likelihood of response in 106 patients), with the qualifier item recording that the NET H-score itself was not significantly associated with response, so the record never claims more NET predicts better response. Three deliberate structural choices. The node carries no modifier on either descriptor: NET expression is a lineage trait retained from the sympathoadrenal precursor rather than a process above its normal level or outside regulatory control, and one cited series found an MIBG-avid tumour with no NET-expressing cells. No genetic_context is set, which is what keeps the entry's derived cancer cell of origin unchanged (check-cancer-origin confirms it still reports no origin node). The treatment-to-node link omits treatment_effect because the drug uses the transporter as its route in rather than inhibiting, activating, modulating, bypassing or restoring it, and no TreatmentEffectEnum value states that; the treatment notes name the Blastic_Plasmacytoid_Dendritic_Cell_Neoplasm CD123 precedent that reads the same way and the Thymic_Neuroendocrine_Carcinoma 177Lu-DOTATATE row that chose INHIBITS by reading the cell-killing consequence instead. The incoming edge is described as retention rather than induction, with causal_link_type DIRECT and its own evidence, because the sources state lineage-linked expression; INDIRECT_UNKNOWN_INTERMEDIATES was refused because it would assert intermediates nobody posits. Two CURIEs were unresolved offline and decided by just validate-terms rather than guessed: CHEBI:135997 'iobenguane (131I)' was absent from cache/chebi/terms.csv and the chemicalentityterm enum cache, and GO:0051620 'norepinephrine uptake' from cache/go/terms.csv and the biologicalprocessterm enum cache. Both resolved and are enum members, so the preferred CHEBI small-molecule binding was kept rather than falling back to NCIT:C970 (the Pheochromocytoma_Paraganglioma precedent, named in notes), and the biological_processes descriptor was kept. GO:0015874 was deliberately not bound: it is obsolete and its label is literally 'obsolete norepinephrine transport', so a cache grep alone looks like a hit. OLS GO searches on 2026-10-22 for 'metaiodobenzylguanidine', 'iobenguane' and 'MIBG' each returned nothing, which is recorded in the node notes as the reason the bindings are to the physiological activity and process rather than to MIBG transport. The node description deliberately does not restate the NET protein, NET mRNA and VMAT2 figures already curated on the MIBG-Avid Disease imaging row, nor re-cite its three PMIDs, to avoid duplicating quotes across the same file. Deliberately excluded: no clinical_trials: section or trial records (the trials appear only inside cited evidence, and that section has a designated creator PR); no discussions: item (another open PR creates that top-level key, and two creators would merge to a duplicate key); no delivery_system: block, because NET is a transporter rather than a receptor a targeting ligand binds; no effect_modifiers:, because the NET and VMAT2 result is a predictor of response across one cohort rather than a treatment-by-subgroup interaction; no administered activity, dose level or dosing figures; no regulatory or product-availability prose. Nothing in the diagnosis:, imaging_findings: or other treatment rows was touched, and MYCN-Driven Proliferation was not renamed. Validated with just validate (290/290 snippets, 299 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-retired-support-prose, check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens, check-cancer-origin, and validate-disorders.

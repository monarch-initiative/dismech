  summary: 'Edit: Neuroblastoma - record the ALK-inhibitor subgroup findings as effect_modifiers;
    cover the amplified subset'
  details: |
    Review round on the Crizotinib/Lorlatinib split. Blocking item: both records' central clinical fact is a stratified response stated as such by its source, and both lived only in the treatment description plus an evidence item, where CLAUDE.md's Treatment Effect Differs by Subgroup section asks for a TreatmentEffectModifier. Added one to each. Crizotinib: effect_modifier_type GENOTYPE, stratum 'patients with ALK F1174L or F1174V' against comparator 'patients with ALK R1275Q', modified_outcome objective response, effect_in_stratum NO_EFFECT, modification_analysis CROSS_STRATUM_COMPARISON, carrying the two ADVL0912 evidence items that state each side of the comparison. Lorlatinib: effect_modifier_type BIOMARKER rather than GENOTYPE, because MYCN amplification is a somatic tumour feature used to stratify rather than a germline or variant genotype of the patient; stratum 'MYCN-amplified' against 'without MYCN amplification', NO_EFFECT, CROSS_STRATUM_COMPARISON, carrying the French registry item whose own snippet is already the stratified sentence. interaction_tested is left off both, because neither source reports a treatment-by-subgroup interaction test, and the schema's rule that effect_in_stratum must come from the source's own statement rather than from a curator's comparison of two numbers is satisfied in both cases: each paper reports the comparison itself. Also took the reviewer's suggestion on the ALK-amplified subset. The retired combined row named amplification alongside point mutations and neither new description did, so the Crizotinib description now states that the ALK-altered subset includes amplification, and a further evidence item on its mechanism link carries the xenograft result (complete regression in an NB1 xenograft with amplified, overexpressed wild-type ALK, MODEL_ORGANISM); its explanation records that this is preclinical only and that ADVL0912 enrolled too few amplified patients to read a clinical response. Declined one suggestion and said so in the reply rather than deferring it: the ADVL0912 enrolment sentence stays as its own SUPPORT item rather than being folded into the response-rate item's explanation, because it is a propositional statement that no patient was excluded from the response analysis, which is a separate checkable fact from the rate itself; the reviewer noted it was not worth a round on its own. The clinical_trials: deferral was confirmed correct by the review and is unchanged. Re-validated with just validate (301/301 snippets, 310 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-grading, check-title-snippets, check-retired-support-prose, check-snippet-length, and validate-disorders. Ran tools/parallel_check.sh onhold before the push: clean against the other session's branches.

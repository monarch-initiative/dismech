  summary: 'Add experimental_models: SK-N-SH subclone pair and patient-derived organoids'
  details: |
    Creates the entry's experimental_models section with two non-animal systems, each linked into the pathograph. The SK-N-SH subclone pair (SH-SY5Y N-type, SH-EP S-type) is linked to Adrenergic and Mesenchymal Cell-State Plasticity as PARTIALLY_RECAPITULATES, carrying a PROXY_QUANTITY divergence because the cited karyotype and FISH study argues the two states arise by clonal expansion of coexisting populations rather than by cell-autonomous interconversion; that paper is cited both as SUPPORT for the subclone relationship and as REFUTE for the interconversion reading. Cellosaurus accessions were read from the Cellosaurus API in the step they were written: SH-SY5Y CVCL_0019, SH-EP CVCL_0524, both with SK-N-SH CVCL_0531 as parent. SH-EP2, the name several super-enhancer papers use, is not a Cellosaurus identifier for SH-EP - the registry uses SHEP2 as a synonym of Tet2 CVCL_HF70, a tetracycline-inducible derivative two steps removed - so the two are kept apart and the notes say so. The second system is the patient-derived neuroblastoma organoid panel, linked to Low Tumor-Cell MHC Class I Expression as MEASURES with an MHC class I surface-expression readout; it is the one system in the literature that tests whether killing depends on that expression rather than only reporting the level. Cellosaurus also flags SH-SY5Y as partially contaminated, which is recorded. 5 new snippets, 860/860 verified across the file; 19/19 pre-push gates green.

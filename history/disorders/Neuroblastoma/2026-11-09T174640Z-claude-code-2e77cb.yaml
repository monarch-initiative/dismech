  summary: 'Diagnosis and biochemistry literature: an 18F-mFBG PET/CT row, GD2 heterogeneity,
    two imaging consensus documents'
  details: |
    Ten evidence items from five references, plus one new diagnosis row. Disjoint from the mechanism pass that is open in parallel on this file: that one touches pathophysiology telomere, immune and replication-stress nodes, mechanistic_hypotheses and discussions, this one touches diagnosis, imaging_findings, biochemical and the GD2 pathophysiology node.

    New diagnosis row, 18F-mFBG PET/CT, from the head-to-head meta-analysis PMID:42418017: five studies, 115 patients, 1,644 lesions. Three items, and the third is the authors' own limit, that the added value in changing clinical management is still unclear, so the row reads as a comparison and not a standard of care. The explanations note that the patient-level and lesion-level figures should be read together: 82 per cent per patient against 51.5 per cent per lesion for the comparator says the older study finds most patients with disease while missing about half their individual lesions.

    The row's binding needed care. NCIT has no procedure term for an mFBG scan. Searching NCIT through OLS for fluorobenzylguanidine, mFBG and benzylguanidine each returns exactly one term, NCIT:C120311 Florbenguane F18, which is the radiopharmaceutical rather than an imaging procedure and so cannot be the diagnosis_term; a search for positron emission tomography computed tomography returns tracer-specific procedure terms for FDG, sodium fluoride, fluciclovine, Ga-68 and PSMA but none for mFBG. The action is bound to the generic NCIT:C103512, with the tracer carried in therapeutic_agent on the diagnosis_term, which is a TreatmentDescriptor and so has that slot. just validate-terms accepted NCIT:C120311 into the chemicalentityterm enum, which is the authoritative answer on admissibility. The row's notes record the searches and that the sibling 123I-MIBG row predates this and carries its tracer in preferred_term only; that row was not changed.

    The three mFBG snippets first failed reference validation because the validator strips bracketed spans from a snippet but not from the cached text, so [18F] and [123I] left holes mid-quote. Repaired as the references skill directs: one snippet rewritten as a contiguous bracket-free span starting at mFBG, two bridged with the ASCII ellipsis. The ellipses skip only the isotope labels, never the claim - both tracer names and all the figures remain inside the quotes. 782/782 snippets verified afterwards.

    PMID:42934432 adds two items to the GD2 Surface Antigen Expression node, and the first is recorded as a REFUTE: whole-slide immunohistochemistry on 45 tumours found 14 with fewer than 90 per cent GD2-positive cells and GD2-positive and GD2-negative populations side by side in one lesion. What is refuted is the uniform-expression reading the node invites, not the node itself - the antigen is expressed, which the node's existing evidence establishes. The explanation says why that distinction matters downstream: an antigen-negative subpopulation is a route to escape that does not require losing expression. The second item names ST8SIA1 as the enzyme whose knockdown lowers surface GD2; no gene descriptor was added for it, which would be a structural change beyond a literature pass.

    The two consensus documents went where the target's own content already invokes them. PMID:21586679, the INRG imaging and staging consensus, sits on the 123I-MIBG Scintigraphy row, whose description already makes INRG staging claims. PMID:41823177, the SIOPEN imaging recommendations, sits on imaging_findings MIBG-Avid Disease. Both INDIRECT and REVIEW_SYNTHESIS, because each establishes that recommendations exist and what they cover rather than any fact about MIBG avidity or scintigraphy, and the SIOPEN authors describe theirs as expert opinions.

    PMID:42886353 was moved here from the mechanism pass, which had it on its own list. Its only neuroblastoma-specific claim is that 3-methoxytyramine is associated with MYCN-related tumour biology and unfavourable outcome, which is a biomarker association belonging in biochemical:, and the entry has no catecholamine pathophysiology node for it. Two items on the Catecholamine Metabolites marker: that association, and the assay-platform change from colorimetric and immunoassay methods to liquid chromatography-tandem mass spectrometry, which bears on reading any figure on that row. Both INDIRECT, and the first explanation says it is not used to claim a prognostic role for the row's existing analytes.

    Ten references_cache files cited by this entry carry whitespace-only changes written by just fix-references-cache, confirmed with git diff -w before staging. One row each was added to cache/ncit/terms.csv and the chemicalentityterm enum cache by just validate.

    Validated with just validate-disorders (782 snippets, 799 titles, 0 issues), the per-file and whole-tree offline gates, and just check-qualifier-terms-online.

  summary: 'Review round 1: split the immune-cold node into three'
  details: |
    Review round 1 on #15274. The reviewer asked for one blocking change: 'Immune-Cold Tumor Microenvironment' combined three separate claims (low mutation burden, low tumour-cell MHC class I, few T cells) and the new MYCN edge pointed at all three, although only the T-cell claim has MYCN evidence and Wolfl 2005 (PMID:15449039) says its own data do not support a MYCN link to loss of MHC class I.

    The node is replaced by three: 'Low Tumor Mutation Burden' (MOLECULAR, no ontology binding), 'Low Tumor-Cell MHC Class I Expression' (CELLULAR, GO:0019885 DECREASED) and 'T-Cell-Poor Tumor Microenvironment' (TISSUE, CL:0000084 DECREASED). The MYCN-Driven Proliferation edge now targets the T-cell node alone; neither of the other two takes an incoming edge, and each says in its own notes why.

    Evidence was re-read and re-placed rather than copied across. Burden node: Pugh 2013 (PMID:23334666), regraded INDIRECT to DIRECT because the quoted sentence now reports the frequency the node is named for; plus the two reviews that name low mutational burden as a checkpoint-blockade hurdle (PMID:35435953, PMID:32167865). Class I node: PMID:15449039, PMID:3902214, PMID:28270499. T-cell node: Layer 2017 (PMID:28680756) and the ADVL1412 nivolumab result (PMID:32192573), filed there because PD-1 blockade acts on T cells and the trial measured neither mutation burden nor class I. PMID:35435953 is cited on both the burden and class I nodes: its quoted two sentences name both properties, and each explanation says which clause it is cited for and where the other is carried. No snippet text changed, and the two copies carry identical grading.

    Prose updated with the rename: the Tumor-Associated Macrophage Infiltration description and notes now name the two successor nodes instead of the composite. The paragraph of the old notes that argued a split would be the better long-term shape is gone, with the facts behind it kept where they belong: the burden figure is not stratified by MYCN status, and the 2005 series states its own result does not support a MYCN/class I correlation.

    Gates run on the branch: just validate (392 snippets, 401 titles, 0 issues), validate-disorders, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-gene-activity-grounding and check-cancer-origin, all clean. Eight unrelated references_cache files that the validator's whitespace normalisation touched were reverted rather than committed.

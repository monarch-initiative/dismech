  summary: 'Gene-family review: NRAS, KRAS, HRAS, BRAF (RAS-MAPK node)'
  details: |
    Bound one molecular function per protein class on the 'RAS-MAPK Pathway Hyperactivation' node, which carries NRAS, KRAS, HRAS, BRAF, PTPN11, NF1 and FGFR1 and described their activating or inactivating lesions without naming the activities: GTPase activity DECREASED (activating RAS), protein serine/threonine kinase activity INCREASED (BRAF), transmembrane receptor protein tyrosine kinase activity INCREASED (FGFR1), protein tyrosine phosphatase activity INCREASED (gain-of-function PTPN11) and GTPase activator activity DECREASED (NF1 loss). The MYCN and MYC records and nodes were reviewed: MYCN amplification is SOMATIC_DRIVER with DNA-binding transcription factor activity INCREASED, MYC activation by enhancer hijacking or amplification is SOMATIC_DRIVER, and the germline HRAS record (RISK_FACTOR) was left as is.

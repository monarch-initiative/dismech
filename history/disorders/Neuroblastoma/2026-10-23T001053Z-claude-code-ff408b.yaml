  summary: 'Neuroblastoma: germline predisposition records for BARD1, CDKN1C, EZH2
    and HRAS; PHOX2B typed as a germline risk factor'
  details: |
    Added four germline RISK_FACTOR records directly after PHOX2B in genetic:, each with variant_origin GERMLINE and notes naming the syndrome entry that is curated separately. BARD1 (BARD1-related_Cancer_Predisposition): rare pathogenic or likely pathogenic variants enriched in neuroblastoma in 786 TARGET-profiled patients (PMID:37688579), in the 2013 TARGET exome study (PMID:23334666) and in a 2025 pan-paediatric DNA-repair case-control analysis (PMID:41066719); an Italian exome study did not replicate it (PMID:36493725, NO_EVIDENCE); the notes say the three positive results come largely from one patient set. The ClinGen Definitive classification is quoted as evidence but not copied into gene_disease_validity, because it is for BARD1-related cancer predisposition (MONDO:0700267), not MONDO:0005072. CDKN1C (Beckwith-Wiedemann_Syndrome; variants on the maternally derived allele): a 2-5% risk from the 2017 AACR review (PMID:28674118) and 4 of 126 (3.2%) in the pooled 2024 series restated by the 2024 AACR update (PMID:39320341). EZH2 (Weaver_Syndrome): neuroblastoma is the most commonly reported malignancy, with 7 reported patients and about 9% (5 of 56) from an uncited review (PMID:39320341). HRAS (Costello_Syndrome): 5 of 573 patients, standardised incidence ratio 60 (PMID:36966234), and the 2024 AACR RASopathy update (PMID:39196581), with the genotype caveat that cancer has been reported only with p.Gly12 substitutions. Syndrome-level figures are graded directness INDIRECT on the gene records. The PHOX2B record now carries relationship_type RISK_FACTOR and variant_origin GERMLINE, the 2017 AACR variant-class tumour-risk split (PMID:28674118) and the 2005 genotype-phenotype counts (PMID:15657873), and points to Congenital_Central_Hypoventilation_Syndrome. Deliberately not added: gene_disease_validity, pathophysiology links or causal edges, common GWAS variants, prognosis, and a TP53 p.R337H record (planned for the germline-spectrum PR). Validation on the rebased tree (origin/main 69bb419bf0): just validate-disorders reports no issues; 417/417 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-enum-values, check-block-scalar-comments, check-snippet-grading, check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-retired-support-prose, check-reference-titles, check-environmental-evidence, check-gene-activity-grounding --against-ref origin/main and check-case-collisions all pass; list-gene-validity reports one report-only other_disease row (BARD1, MONDO:0700267) and no conflict.

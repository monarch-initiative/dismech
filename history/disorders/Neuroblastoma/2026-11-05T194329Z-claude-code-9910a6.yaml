  summary: 'Review round 1: GEO dataset records get conditions, sample types and two
    description fixes'
  details: |
    Took all three non-blocking suggestions from the first review, in one push.

    GSE16476 description corrected. It said the first of the series' five linked publications deposited it with the R2 analysis platform. GEO's first linked publication (PMID:22367537) is a sequencing study of neuroblastoma, not the R2 platform paper, so the sentence misattributed the deposit. The description now says only what GEO states: the GEO summary for the series describes the R2 analysis platform, and GEO links the series to five publications, including the LIN28B study this entry cites. The record's publication field still carries GEO's first linked PMID, as the dataset builder does for every record.

    GSE253865 note added. The record's description is GEO's own summary, which describes an atlas of 362,991 cells from 68 patient samples, while the series has 14 samples; the note now says GEO holds 14 samples, not the 68-sample atlas, and that the summary describes the atlas as integrating seven single-cell or single-nucleus datasets before being expanded with new data.

    Conditions and sample types. All eight records now carry conditions: neuroblastoma, as the existing GSE85047 record does. Sample types were added only where GEO's own title or summary states the sample kind: primary neuroblastoma tumour tissue for GSE49710 and GSE49711, neuroblastoma tumour tissue for GSE45547 and GSE253865, and neuroblastoma cell lines (SK-N-BE(2)C, IMR-5/75, SK-N-AS) for GSE163431, which is the one record that is not patient tissue. GSE16476, GSE120572 and GSE189743 get no sample type, because their GEO metadata does not say what the samples are. No ontology term is bound on any new sample type: no tissue site is stated for the tumour cohorts, and the cell lines have no CL class.

    Validation after the changes: verify-datasets 9 of 9 OK; validate-disorders passes; the C4 gate set including the kb pytest lane and check-cache-order passes.

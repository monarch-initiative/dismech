  summary: 'Edit: Neuroblastoma - adrenergic/mesenchymal cell-state plasticity nodes
    and two controversy discussions'
  details: |
    Added the adrenergic/mesenchymal cell-state plasticity mechanism as four pathophysiology nodes plus the entry's first discussions: section. The nodes are 'Adrenergic and Mesenchymal Cell-State Plasticity' and its three downstream consequences: 'Mesenchymal-State Chemotherapy Resistance', 'ALK-Inhibitor Escape by Loss of Target Expression' and 'Mesenchymal-State Immune Activation'. One downstream edge was appended to the existing 'Neural Crest Developmental Arrest' node, locating the two identities in the blocked sympathoadrenal differentiation programme; that edge's own explanation states the limit, that the cited evidence maps the identities onto the lineage and does not show the arrest drives switching between them. 35 evidence items from 12 references, all newly fetched. The plasticity node's description keeps both naming systems the field uses (van Groningen's adrenergic/mesenchymal and Boeva's noradrenergic/NCC-like) rather than silently picking one. Two CONTROVERSY discussions record open disagreements rather than resolving them: whether the mesenchymal state carries independent prognostic weight, and whether a distinct intermediate adrenergic/mesenchymal population exists, where the second records that two groups' transitional signatures do not share their defining genes and so may be naming different populations. GO:0090677 'reversible differentiation' was bound after confirming by lookup that it resolves and is a member of the BiologicalProcessTerm dynamic enum; it was in no committed cache and used nowhere in kb/ before this, so the draft had carried a cache-verified fallback (GO:0045165 cell fate commitment) in case it failed validation. It passed, so the more precise term was kept and the fallback discarded; cache/go/terms.csv and the biologicalprocessterm enum cache gained one row each. No genetic_context.variant_origin is set on any new node, deliberately: none of them is a transforming lesion, and marking one would make it the entry's derived cancer cell of origin. Evidence came from a 20 Oct 2026 plan/finder/three-lens-verifier workflow run (wf_51668c11-f77, 97 agents, all 24 claims verified) and its drafted YAML; the quotes were treated as leads, with every reference re-fetched by just fetch-reference and every snippet re-checked by the validator before commit. Validated with just validate (308/308 snippets, 317 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs (which resolves the attaches_to anchors on the two discussions; this entry carries no proposed_experiments, so no perturbation or readout anchors were checked), check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-grading, check-gene-activity-grounding --against-ref origin/main, check-cancer-origin, and validate-disorders.

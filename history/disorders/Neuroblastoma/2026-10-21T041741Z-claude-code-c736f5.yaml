  summary: 'Edit: Neuroblastoma - synonyms, scope note, epidemiology, prevalence and
    MONDO/NCIT mappings'
  details: |
    Adds the entry's metadata sections; nothing outside them changes. New top-level keys: synonyms, notes (scope statement), epidemiology, prevalence and mappings, plus a StatPearls row at the end of references.

    Synonyms: "neuroblastoma, malignant" and "neuroblastoma (Schwannian stroma-poor)" (MONDO:0005072 exact synonyms, from NCIT:C3270) and "NB" (MONDO abbreviation). "neural crest tumor, malignant" was left out as a broader class. With synonyms present, just check-genereviews gives a proven GeneReviews NO_CHAPTER instead of an unproven one; StatPearls is TAGGED.

    Scope note: covers peripheral, sympathoadrenal neuroblastoma (INPC Schwannian stroma-poor category). It names what MONDO and NCIT file beneath their neuroblastoma classes but this entry does not cover (olfactory, cerebral incl. FOXR2-activated CNS, and retinal neuroblastoma; adrenal gland and mediastinum ganglioneuroblastoma), and lists ganglioneuroblastoma, ganglioneuroma and MONDO's seven neuroblastoma susceptibility classes (1 to 7, under hereditary neoplastic syndrome MONDO:0015356) as separate. Every CURIE in the note and the mapping justifications was looked up in OLS on 2026-10-21; MONDO's definition was taken from IAO:0000115, not the rdfs:comment.

    Prevalence: four ANNUAL_INCIDENCE records with rate_denominator POPULATION_PER_YEAR (ACCIS Europe 1988-1997, 1.09 per 100,000; Quebec and Greater Delaware Valley, 1.095; Australia 1983-2015, 0.95, a count that includes ganglioneuroblastoma; Germany 1980-2015 median of annual Segi-standardised rates, 1.32) and Orphanet's European POINT_PREVALENCE class (BAND_1_5_PER_10000, rate_low 10, rate_high 50). Bands follow scripts/migrate_prevalence.py _band_from_rate. Not encoded: Orphanet's three prevalence-at-birth rows (the European value 5.8 per 100,000 equals ACCIS's 1993-1997 infant incidence of 57.8 per million; Germany's comes from the 2002 screening study PMID:11932471; the US row cites a SEER paper with no birth prevalence) and its worldwide annual-incidence row (sourced to a French predisposition review, PMID:22796286); the GBD 2021 modelled rate (0.28 per 100,000 children, about a quarter of registry rates). The ORPHA:635 quote stops before the source column because the importer renders Orphadata's 'European Medicines Agency 2018[OTHER]' as PMID:2018 (the _clean_source defect described in issue 7518). ORPHA_635.md was generated by just fetch-reference from the 2026-06-23 Orphadata release; the manifest pin (2025-12-09) is unchanged.

    Epidemiology: proportion of childhood cancers (GBD background sentence, quote_role BACKGROUND; StatPearls REVIEW_SYNTHESIS for the rank; Canadian incidence data 1982-1991, PMID:9328197, for the infant share) and age at diagnosis (Netherlands registry 45% under 18 months; German national trial cohort median 23 to 15 months; StatPearls median 17 months). The ~90% before age 10 (StatPearls) versus before age 5 (GBD introduction) conflict was left out.

    Mappings: MONDO:0005072 and NCIT:C3270, both skos:exactMatch; MONDO records NCIT:C3270 and Orphanet:635 as exact matches. NCIT's narrower Peripheral Neuroblastoma (NCIT:C6591) was considered and not used, because MONDO's exact match is C3270 and NCIT files the disease's stage, risk-group and grade classes under C3270. The NCIT:C3270 breadcrumb row was added to cache/ncit/hierarchy.csv from just build-hierarchy-cache NCIT; three other rows the rebuild produced for mappings already on main were left out.

    Process: evidence planned, found and checked with a planning, finding and three-lens verification workflow (13 claims); composed by script with every snippet and reference_title checked against the cache; pre-reviewed by four independent lenses with two adversarial verifiers per finding, whose upheld findings were applied (seven, not three, susceptibility classes; MONDO's IAO definition; the two ganglioneuroblastoma site classes; the NCIT:C6591 note; the Australian wording; the Canadian MeSH caveat). Validation: just validate, validate-terms, count-verified-snippets 67/67, validate-disorders (67 snippets, 76 titles, 0 issues), check-genereviews, tag-references dry run, the duplicate-key, entity-ref, causal-target, qualifier-term, block-scalar, enum-value and case-collision checks, the whole-KB snippet-length, title-snippet, snippet-grading, retired-prose, reference-title, coarse-phenotype, shared-disease-term, environmental-evidence and term-cache-integrity gates, the prose-figure audit, and a page render. Part of the neuroblastoma PR series tracked in issue 14976.

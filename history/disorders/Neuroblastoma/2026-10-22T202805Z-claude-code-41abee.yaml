  summary: 'Edit: Neuroblastoma - opsoclonus-myoclonus-ataxia syndrome as a paraneoplastic
    phenotype, with its immune chain'
  details: |
    Adds opsoclonus-myoclonus-ataxia syndrome (OMAS) to Neuroblastoma as part of the neuroblastoma curation project (#14976, slate item N).

    Phenotype 'Opsoclonus-Myoclonus-Ataxia Syndrome' (after Spinal Cord Compression), bound to MONDO:0015247 opsoclonus-myoclonus syndrome because HPO has no syndrome term (searches recorded in its notes; HP:0010543 Opsoclonus names one sign only). Frequency VERY_RARE, resting on neuroblastoma-only figures: 9 of 405 (PMID:6493702, read via PMID:20149339), 21 of 675 (PMID:11344492) and a pooled 2.7% (PMID:41047153); the higher single-centre 6.3% (PMID:42497414) and the figures that pool ganglioneuroblastoma (PMID:12709798, PMID:41979173) are recorded but do not set the band. The reverse proportion (a neuroblastic tumour in roughly 40-50% of children with OMAS; PMID:35260471, PMID:28959231, PMID:41499722) is kept apart and labelled as such. Associated tumours described as mostly non-metastatic, favourable histology, without MYCN amplification, with ganglioneuroblastoma common; 'favourable genomics' and the claim that tumour presence does not predict neurological outcome are deliberately not made.

    Pathophysiology (after Reduced ATRX/DAXX Complex Abundance): 'Intratumoral Lymphoid Infiltration with Lymphoid Follicles' (TISSUE; PMID:11344493, PMID:37537844) -> 'Cerebellar and Brainstem-Directed B- and T-Cell Autoimmunity' (ORGANISM; PMID:15136676, PMID:28959231, PMID:34006622, PMID:37537844) -> the OMAS phenotype; both edges INDIRECT_UNKNOWN_INTERMEDIATES, the tumour-to-autoimmunity edge resting on the authors' proposed model and a single shared-clone case report (PMID:36125271), graded INDIRECT. Antibody-negative framing: no specific antibody, no target antigen, no mimicry, no HLA allele. The chain is left as a root by design: the cited studies do not attribute the infiltrate to any tumour mechanism modelled in the entry, and no existing node was edited.

    Not added: OMAS treatments (IVIG, steroids/ACTH, rituximab; they treat OMAS, not the tumour), clinical_trials or discussions items, separate HPO sign phenotypes, neurological-outcome detail, histopathology items, and module conformance (five candidate modules considered and rejected). The Graus 2021 criteria cache (PMID:34006622) was regenerated from abstract-only to PMC full text; its four other citing snippets in Paraneoplastic_Neurological_Syndromes and Paraneoplastic_Cerebellar_Degeneration still verify. New caches: twelve PMIDs; new term rows for MONDO:0015247. Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates.

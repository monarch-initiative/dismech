  summary: Content-correctness fixes from pediatric cancer review
  details: |
    Fixed INSS Stage 4S, which carried the INRG stage MS 18-month cutoff instead of the correct under-12-months criterion, and added the minimal-marrow (<10% of nucleated cells) requirement that distinguishes 4S from stage 4. Corrected germline ALK in familial neuroblastoma from ~50% to the majority (~75-80%) framing, citing the primary linkage study PMID:18724359. Wired the previously orphan ALK Signaling Activation node into MYCN-Driven Proliferation via an INDIRECT_UNKNOWN_INTERMEDIATES edge, and added ALK Inhibitor Therapy (crizotinib, lorlatinib) with target_mechanisms linking back to that node. Added the telomere-maintenance axis absent from the entry: TERT rearrangement (PMID:26466568) and ATRX mutation/ALT (PMID:22416102), plus PHOX2B as the second germline predisposition gene. Replaced PMID:41560679 (an iPSC-derived neural crest model) as sole support for human prognostic claims with the INRG Task Force report (PMID:19047291) and the original Brodeur series (PMID:6719137); remaining model-derived items downgraded to PARTIAL and tagged MODEL_ORGANISM. Corrected cyclophosphamide from CHEBI:4026 (cyclophosphamide hydrate) to CHEBI:4027. Source: docs/reports/pediatric-cancer-claim-evidence-review-2026-07-25.md. Validated with linkml-validate, linkml-term-validator (--labels), and linkml-reference-validator; all pass. New PMIDs were cached via the reference validator, never hand-written.

  summary: Wire the replication-stress checkpoint into the pathograph; add ADVL1312
  details: |
    Three changes, all following from #15721 having landed the Replication-Stress Checkpoint Dependence node as an island.

    An incoming causal edge from MYCN-Driven Proliferation into that node. Its evidence is the PMID:21289283 sentence already cited on the target node, reused deliberately rather than re-graded: check-snippet-grading is keyed on the quoted sentence and compares across files, so the edge carries the same IN_VITRO value the node does. directness is INDIRECT because the causal half of that sentence, inducing MYCN in retinal pigment epithelial cells, is run outside neuroblastoma. The edge names two omitted intermediates, the replication stress itself and CHK1 phosphorylation, rather than asserting an ATR step no cited sentence states.

    No outgoing edge, which is the part that needed a decision rather than a search. The node is a dependence, not a step producing a further lesion, so its consequence is what happens when it is removed. An edge into a survival or proliferation node would invert the biology: the checkpoint permits survival under replication stress rather than causing it. The therapeutic consequence is already carried in the other direction by the adavosertib record's target_mechanisms link with treatment_effect INHIBITS. The node's notes were rewritten in the same commit, because they previously stated that no incoming edge was drawn and explained the deferral, which this change makes false.

    An ADVL1312 row in clinical_trials (NCT02095132). Registry state was re-read rather than taken from the handover note: COMPLETED, phases PHASE1 and PHASE2, and 15 conditions including Recurrent and Refractory Neuroblastoma. Recorded as PHASE_I, the earliest of the two phases in the single-valued enum, with the registry's own phase list named in the description. Four other phase-1/2 trials in kb/ are curated the same way, so this follows an existing convention rather than inventing one.

    The trial row's evidence is the registry summary only, graded OTHER as a registration document. Its explanation says what that summary does not establish: it reads solid tumours and never names neuroblastoma, so the part B cohort and its three objective responses stay on the Adavosertib treatment record where they are already curated from PMID:37081608, rather than being duplicated here.

    ADVL1515 / prexasertib (PMID:33881209, NCT02808650) is deliberately excluded, recorded here so it is not re-found and re-litigated. The trial is real, and an earlier note calling it unsourceable was wrong in its reason. The actual reason is relevance: it lists five conditions, none of them neuroblastoma, and names no neuroblastoma patients, so a row in this entry would assert a relevance the trial does not have. That leaves a real asymmetry worth knowing, since CHK1 is the better-evidenced half of this node preclinically while every clinical item on it tests the WEE1 half.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present (the #15612 gate), check-logical-rules and compliance-connectivity. validate-disorders reports 670 of 670 snippets verified. Validator whitespace churn in tracked references_cache files was restored before committing.

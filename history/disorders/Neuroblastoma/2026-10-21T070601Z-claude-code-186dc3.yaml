  summary: Add INRGSS stages; restructure subtypes; resolve adrenal stub
  details: |
    Added a stages section and restructured the subtype list of the neuroblastoma entry.

    Stages. Added INRGSS Stage L1, L2, M and MS, each defined from the INRG Task Force staging report (PMID:19047290), with the report's L1 versus L2 event-free survival comparison on L2. Stage MS also records the narrower INSS stage 4S definition (PMID:30754710 Table 1; the 1993 INSS revision, PMID:8336186), the descent of the category from the 1971 Evans IV-S category, sites of spread in an Italian IV-S series (PMID:6727772), regression and the age pattern and causes of death in two infant cohorts (PMID:10653863; COG ANBL0531, PMID:30444686, including the result after its protocol amendment), outcome by MYCN status (PMID:34319759; PMID:32932540), and the contested outcome of toddlers aged 12 to 18 months (PMID:21969516; PMID:22305511; PMID:19047290).

    Subtypes. Removed the has_subtypes row 'Stage 4S Neuroblastoma' under design decisions 3a, which records stage under stages rather than as a subtype or entry. The row had no subtype_term and no evidence, and no subtype: field in kb/ named it. Its content (the under-12-month age limit, an INSS stage 1 or 2 primary, dissemination limited to skin, liver and bone marrow with under 10% marrow involvement, spontaneous regression) now sits in the INRGSS Stage MS row with evidence. Rewrote 'High-Risk Neuroblastoma' as a risk-group row (classification risk_group, subtype_term NCIT:C150281) giving the INRG 2009 and COG version 2 (2021) definitions and the SIOPEN HR-NBL1 and HR-NBL1.5 eligibility, with seven evidence items (PMID:19047291, PMID:34319759, PMID:30754710, PMID:34152804). Added classification molecular to the MYCN-Amplified row.

    Stub. Resolves stubs/Adrenal_Gland_Neuroblastoma.yaml (MONDO:0006076, adrenal gland neuroblastoma) as SUBTYPE of this entry (neuroblastoma, MONDO:0005072; MONDO places the term beneath it via retroperitoneal neuroblastoma, MONDO:0000551). It becomes the has_subtypes row 'Adrenal Gland Neuroblastoma' (classification anatomic, subtype_term MONDO:0006076, location UBERON:0002369) with INRG cohort evidence (PMID:25154816), and the stub is deleted. The stub coverage index reads has_subtypes[].subtype_term, so the term is not re-nominated.

    Not done. No invasion_and_metastasis conformance: none of the entry's three pathophysiology nodes describes metastatic spread, and a dissemination node with its own evidence is planned for a later pathophysiology PR, after the module extension in #13924. Version 2 stage MS risk rules are not stated, because the COG report gives them in its algorithm figure and data supplement rather than in its text.

    Validation: just validate, validate-terms, count-verified-snippets (79/79), validate-disorders, the offline gates, and prose-figure-audit (no new flags). Before the PR, a four-lens pre-review with two independent verifiers per finding was run, and the findings both verifiers upheld were applied.

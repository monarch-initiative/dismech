  summary: 'Edit: Neuroblastoma - record ADVL0912''s negative result in ALK-amplified
    patients rather than calling it unassessed'
  details: |
    Second review round on the Crizotinib/Lorlatinib split, correcting an error the previous round introduced. The amplification prose added last round said ADVL0912 'enrolled too few amplified patients for a clinical read', and the same reading appeared in the xenograft item's explanation. That is wrong: the trial reports a result for that stratum in three places, including 'The two patients with ALK amplification had no response.' and its own conclusion that crizotinib 'has no objective single agent activity in neuroblastomas harboring other hotspot ALK mutations or amplification'. The entry therefore read as preclinically promising and clinically untested where the source says preclinically promising and clinically negative in the two patients treated. Fixed in three places: the Crizotinib description now states the divergence between the preclinical and clinical results and says explicitly that two patients is a small denominator but a reported negative rather than an absence of data; the xenograft item's explanation now points forward to that negative instead of denying it exists; and two REFUTE items were added carrying the trial's own sentences, the two-patient result and the authors' summary conclusion. The error is the same shape as one corrected on the MIBG PR in the same session, where a Cochrane sentence reporting that no trials exist was graded NO_EVIDENCE: in both cases absence of data and evidence of absence were conflated, in opposite directions. Both are now graded from what the source states rather than from the shape of the finding. Re-validated with just validate (303/303 snippets, 312 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-block-scalar-comments, check-enum-values, check-snippet-grading, check-title-snippets and validate-disorders, and ran tools/parallel_check.sh onhold before the push.

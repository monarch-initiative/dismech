  summary: 'Mechanism literature: telomere prognosis, a postnatal-MYCN origin alternative,
    two immune routes, two replication-stress dependencies'
  details: |
    Fourteen evidence items from six new references, on six existing pathophysiology nodes plus one new mechanistic_hypotheses group and one new discussions entry. Six of the seven references the plan listed for this pass were used; the seventh was moved, see below.

    PMID:42848963 (J Clin Oncol, 366 patients) carries the telomere-maintenance prognosis. One item on each of the three telomere nodes, each quoting a different sentence, all INDIRECT with the reason stated: the paper reports figures for the three-way classification and not for any single class, and a hazard ratio does not measure the mechanism a node describes. Two further items sit on a new OPEN_QUESTION discussion, question_nb_tmm_classification_as_risk_standard, attached to the three nodes, which is where the claim that the classification should become a stratification standard belongs. The discussion's rationale states the three limits: 259 of the 366 patients were non-high-risk so the result is strongest where it was sought, the overall-survival confidence interval runs from 9.6 to 90.0, and a classification standard is adopted by cooperative groups rather than by one cohort. No risk-group mapping is asserted from the nodes.

    PMID:42691625 becomes a new mechanistic_hypotheses group, origin_mycn_imposed_embryonic_state, status ALTERNATIVE, with three items. It is deliberately not recorded as a refutation of Neural Crest Developmental Arrest, and that node is untouched: the mouse work shows that MYCN can impose an embryonic-like state on adult tyrosine hydroxylase-positive cells, which makes developmental arrest no longer the only available explanation of the tumour's embryonic features, not a demonstration that human tumours arise that way. The group carries no causal edge, and its description says why - the entry's pathophysiology models the arrest route and no node represents the reprogramming one - following the precedent of regression_epigenetic, which records the same situation. The three items are graded separately: the framing sentence about the prevailing model as OTHER/BACKGROUND, the mouse experiment as MODEL_ORGANISM/PRIMARY_RESULT, and the human signature correspondence as HUMAN_CLINICAL but INDIRECT, because a shared expression signature does not establish origin.

    PMID:42952771 adds two items to T-Cell-Poor Tumor Microenvironment: the HIF-1alpha-driven PD-L1 rise in hypoxic neuroblastoma lines, and the CD8+ T-cell exhaustion phenotype and apoptosis it causes in co-culture. Both INDIRECT, because the node's claim is how many T cells a tumour contains and the measurements are PD-L1 on cell lines and T-cell function in co-culture. The explanation says the node's existing patient evidence remains the basis for the T-cell poverty itself.

    PMID:42827984 adds two items to Low Tumor-Cell MHC Class I Expression: the background statement that the low expression is inducible by interferon gamma, and the experiment showing that raising MHC class I made the cells killable by MHC-restricted T cells. The study's own in vivo arm is described by its authors as exploratory and preliminary and is not cited.

    PMID:42896161 and PMID:42867993 add one item each to Replication-Stress Checkpoint Dependence, extending it upward to ATR and sideways to the DNA damage response genes CDK12 controls. Both INDIRECT, because each is a drug response read back as evidence for the dependence, and the elimusertib explanation quotes the authors' own description of the synergy as additive to mild rather than overstating it. Both are recorded as node evidence and not as treatments rows, which keeps this pass out of the therapy lane. Neither is described in terms of ALK inhibition, and no clinical or trial content from either was used.

    PMID:42886353 was planned for this pass and has been moved to the diagnosis and biochemistry pass instead. Its only neuroblastoma-specific claim is that 3-methoxytyramine is associated with MYCN-related tumour biology and unfavourable outcome, which is a biomarker association belonging in biochemical:. The entry has no catecholamine pathophysiology node for it to attach to, only a Catecholamine Metabolites marker, so citing it here would have meant either forcing it onto a node it does not fit or extending this pass into a section another pass declares. Its cache file is deliberately not committed, since nothing cites it.

    PMID:42954862 and PMID:42950465 stay excluded, fenced and fence-adjacent respectively.

    Ten references_cache files cited by this entry carry whitespace-only changes, written by just fix-references-cache, which just validate-disorders runs over the caches the validated file cites. Confirmed whitespace-only with git diff -w before staging.

    Validated with just validate-disorders (786 snippets, 803 titles, 0 issues; 772 to 786 snippets against main) plus the per-file and whole-tree offline gates.

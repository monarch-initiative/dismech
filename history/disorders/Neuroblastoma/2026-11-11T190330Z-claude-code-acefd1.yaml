  summary: 'Review round 1: unsourced claims out of the DSRCT row; notes and key order'
  details: |
    Round 1 of the repository review plus two adversarial source re-verification passes, split by axis. The evidence pass found four problems, all in the DSRCT row. Its distinguishing features asserted that neuroblastoma does not carry the EWSR1::WT1 fusion and that it instead carries catecholamine metabolites and the neuroblastic markers the entry's diagnosis rows describe; the first clause is supported by neither cited source - the DSRCT transcriptomics paper never mentions neuroblastoma and the Wilms chapter never mentions EWSR1 or catecholamines - and the second is unsupported and its internal pointer was half wrong, because PHOX2B sits in histopathology rather than diagnosis. One sourced feature now replaces two. The description asserted the histological overlap before its own hedge arrived and is reworded, and the DOI explanation no longer presents a DSRCT-only sentence as sourcing a claim about neuroblastoma. The bindings and hygiene pass found that the round's fixes were still uncommitted, so a push would have carried the worse version, and two smaller things: the hemangioma note called MONDO:0006267 an adult disease where MONDO describes it as usually affecting young females, and the three new rows inverted the section's key order. Both fixed. That pass also supplied a better argument for the rebind than the one in the note: the dismech Infantile_Hemangioma entry has exactly one subtype row, named Hepatic, so dismech already models hepatic infantile hemangioma inside MONDO:0011191. The note now says that, and its negative-existence claim about MONDO was independently re-run against the local build. Also removed from the note: the sentences narrating how the row had been edited, which belong in this record rather than in notes.

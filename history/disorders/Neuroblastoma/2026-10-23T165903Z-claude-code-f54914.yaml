  summary: Add the compensatory polyamine-uptake escape beside the synthesis node
  details: |
    Follow-up to the polyamine/ODC1 node and eflornithine treatment record added earlier. That pair recorded the synthesis arm of the dependence and said the step from the pathway to the approved drug's clinical effect was not established. This adds the mechanism that is the most-cited reason the step does not follow: the cell imports polyamines from its surroundings, so inhibiting synthesis does not deplete them.

    New pathophysiology node, Compensatory Polyamine Uptake from the Microenvironment (CELLULAR, PROVISIONAL), bound to SLC3A2 (hgnc:11026), polyamine transmembrane transporter activity (GO:0015203, INCREASED) and polyamine import across plasma membrane (GO:0140202, INCREASED). Six evidence items from two laboratories: DFMO is only partly effective because compensatory mechanisms raise uptake from the microenvironment; SLC3A2 is the key transporter carrying that uptake in neuroblastoma; knockdown lowers radiolabelled spermidine uptake and DFMO itself raises SLC3A2 protein, so the drug induces the route around its own target; AMXT 1501 plus DFMO prevented or delayed tumours in neuroblastoma-prone mice and extended survival in rodent models of established tumours (PMID:30700572); and from a second laboratory, compensatory uptake from the culture medium rescues the deficit DFMO creates, with the combination deepening translation inhibition even in cell lines resistant to high-dose DFMO alone (PMID:40774224).

    One new causal edge, from MYCN-Driven Proliferation to the new node, on the finding that MYCN regulates SLC3A2 along with other components of the polyamine pathway. No return edge is drawn from the uptake node, following the explicit reasoning already on the sibling synthesis edge: an edge back into the MYCN node would make a two-node cycle in the pathograph. The uptake node is therefore a leaf, as the synthesis node is.

    Marked PROVISIONAL rather than ESTABLISHED because every result is from cell lines or rodent models. Nothing cited establishes that uptake limits the approved drug's effect in patients, and the node says so.

    The molecular-function binding needed a note, because it does not come from SLC3A2's own GO annotations. On 2026-10-23 a QuickGO annotation search for UniProtKB:P08195 returned 11 molecular-function terms, amino-acid transmembrane transporter activities and protein-binding terms, and no polyamine or spermidine term in any aspect. The accession was checked in both directions before the note was written: HGNC:11026 lists uniprot_ids P08195, and UniProt P08195 is human SLC3A2, recommended name "Amino acid transporter heavy chain SLC3A2". The binding records the activity the node asserts is running, on the strength of the cited identification of SLC3A2 as the transporter carrying polyamine uptake in these cells, and the note says it should not be read as a curated GO annotation.

    One sentence in the second paper's discussion was deliberately not quoted. It reads "selective polyamine transporters like AMXT-1501 have been developed to block this rescue mechanism", which inverts the drug's role: AMXT 1501 inhibits the transporter rather than being one. The same paper's results section states the mechanism correctly, and that sentence was quoted instead.

    The DFMO plus AMXT 1501 clinical trial the second paper mentions is deliberately not curated here. Trial records belong in the separate clinical_trials: work, which creates that section.

    Validation: just validate-disorders passed (481 snippets, 490 titles, 0 issues). Also clean: validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-gene-activity-grounding, check-folded-hyphens, check-folded-yaml, check-case-collisions, check-coarse-phenotypes and check-environmental-evidence. Three derived cache rows were written by the validator (GO:0140202 into the GO and biological-process enum caches, hgnc:11026 into the HGNC cache) and are committed with the entry.

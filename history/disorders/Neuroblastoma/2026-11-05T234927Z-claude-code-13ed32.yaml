  summary: 'Edit: Neuroblastoma, ICD-10-CM and ICD-11 Foundation mappings'
  details: |
    ICD mappings for the neuroblastoma entry, which had MONDO and NCIT mappings only.

    ICD-10-CM: ICD10CM:C74.9 (Malignant neoplasm of unspecified part of adrenal gland) as skos:relatedMatch, sourced to the Orphanet record (ORPHA:635), whose cross-reference row reads "ICD-10:C74.9 | Narrower". Orphanet's Narrower is its NTBT relation (the ORPHAcode is narrower than the code used to represent it; see src/dismech/structured_sources/orphanet.py). The relation is not recorded as broader, because C74.9 is an adrenal site code that also covers other adrenal cancers while the entry also covers extra-adrenal neuroblastoma, so the consistency row records INCONSISTENT with that row quoted.

    ICD-11: Orphanet's ICD-11 rows (2A00.11 Narrower; XH85Z0 Exact) are MMS and extension codes, and the local ICD-11 Foundation build (sqlite:obo:icd11f, downloaded 2026-10-21) carries neither those codes nor any extension (morphology) classes, so they could not be resolved to Foundation IDs offline. Three Foundation classes were mapped instead, each skos:narrowMatch with mapping_source ICD-11 Foundation, labels and placement read from that build: icd11f:591280607 Neuroblastoma of adrenal gland (under Malignant neoplasms of adrenal gland; it also carries the synonym neuroblastoma NOS and a definition covering all sites, recorded in the justification), icd11f:135512034 Paraspinal neuroblastoma (under Tumours of cranial or paraspinal nerves; synonym neuroblastoma of sympathetic nervous system, also recorded), and icd11f:1822312964 Neuroblastoma of unspecified site (under Neuroblastoma of adrenal gland). Brain neuroblastoma (icd11f:1323582265) is out of scope and not mapped. All three sit under the ICD11FTerm enum root icd11f:455013390 (ICD Category).

    Not changed: the plan also proposed ICD mappings for Ganglioneuroblastoma and Ganglioneuroma. Orphanet's ganglioneuroblastoma record (ORPHA:251877) defines a peripheral tumour but cross-references ICD-10 C71.9, a brain code, and ICD-11 2A00.11; the local ICD-11 Foundation build has only brain-site ganglioneuroblastoma and ganglioneuroma classes (icd11f:1432072105, icd11f:215959075). None of these fits either entry, and no source maps them to a peripheral code, so neither entry gains an ICD mapping.

    Caches: validate-terms wrote the four term rows and enum rows; normalize-cache sorted them. just build-hierarchy-cache ICD10CM added the C74.9 breadcrumb row and six rows for ICD10CM codes other entries already map that the cache was missing.

    Validation: just validate-terms passes; the C4 gate set passes (see the PR).

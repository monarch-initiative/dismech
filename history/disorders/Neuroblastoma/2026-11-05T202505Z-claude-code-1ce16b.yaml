  summary: 'Edit: Neuroblastoma, mark the somatic MYCN amplicon as the transforming
    lesion so the cell of origin derives'
  details: |
    The entry recorded no transforming lesion, so check-cancer-origin reported NO_ORIGIN although the neural crest derived neuroblast (CL:0002676) is bound on seven nodes. The Extrachromosomal MYCN Amplicon Architecture node now carries a genetic_context (gene MYCN, variant_type copy number variation, variant_origin SOMATIC, functional_impact_category GAIN_OF_FUNCTION) and binds CL:0002676 in cell_types, so the derivation returns SOMATIC_LESION with that cell.

    This reverses an earlier, explicit deferral. The 21 October 2026 change that wired MYCN and ALK as genes (#15084) added no origin marking, on the grounds that its sources did not establish either lesion as the initiating event, and quoted the timing study (PMID:36973454) that these rearrangements cannot be timed using mutation densities. Design decision 3d's SOMATIC_LESION rule marks the transforming lesion and is not restricted to root nodes, since a second-hit or transformation lesion is still a somatic event; the derivation reads the lesion's cell, not its date. So the mark makes no claim that MYCN amplification is the first event, and the genetic_context description says so. The user agreed to the reversal on 5 November 2026.

    Supporting evidence: one item from PMID:6719137 (HUMAN_CLINICAL, PRIMARY_RESULT, DIRECT), that N-myc amplification is a common event in untreated human neuroblastomas, establishing the amplification as a tumour lesion present before therapy. It answers a reviewer's suggestion on #16616 that the somatic-driver typing of the MYCN genetic record should have a human-tumour statement beside the mouse evidence.

    Cell term: CL has no sympathoblast or sympathoadrenal progenitor class; OLS CL searches on 2026-11-05 for sympathoblast, sympathetic neuroblast and sympathoadrenal returned no term, and Schwann cell precursor (CL:0002375) names a different, upstream cell. CL:0002676 is the term the entry's developmental-arrest node already binds.

    Scope kept to one lesion: tumours without MYCN amplification have no marked lesion, and the genetic_context notes record their origin as unsettled. The ALK, TERT and ATRX nodes are not marked. biological_scale CELLULAR is added to Neural Crest Developmental Arrest and MYCN-Driven Proliferation, the two nodes that lacked it; MYCN-Driven Proliferation is not renamed.

    Validation: check-cancer-origin returns SOMATIC_LESION OK for this file; validate-disorders passes; the C4 gate set including the kb pytest lane passes, as do check-cache-order, validate-terms, check-reference-titles-present, check-logical-rules and check-name-collisions.

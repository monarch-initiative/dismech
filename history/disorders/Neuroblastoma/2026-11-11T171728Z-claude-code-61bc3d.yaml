  summary: 'Review round 1: readout cites the measurement, not the paper''s framing'
  details: |
    The organoid link's MHC class I readout was backed by the abstract's framing sentence about neuroblastoma in general rather than by any measurement made in the organoids. Replaced with the paper's own flow-cytometry result, graded PRIMARY_RESULT, which also records the split the framing sentence hid: two of six organoids expressed surface MHC class I and four had no detectable level, and one of the MHC-I-negative organoids still activated the effector cells. The readout interpretation now says DECREASED describes most of the panel rather than all of it. The link's evidence now leads with the MHC class I blockade result rather than the effector-activation count, because the blockade is what tests the dependence instead of inferring it. The missing immune and stromal compartment is now a typed BOUNDARY_OMISSION divergence rather than prose alone.

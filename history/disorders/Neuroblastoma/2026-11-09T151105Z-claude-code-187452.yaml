  details: |
    Rebased the October P-c branch (234096d966d, 1085 commits behind) onto current main as nbr-pc-germline and re-verified every claim rather than taking the draft on trust. The single conflict in kb/disorders/Neuroblastoma.yaml was where PR #15838 inserted its germline TP53 record, in the same position after PHOX2B; both sides were kept. P-c's PHOX2B record was confirmed line-by-line to be a strict superset of main's before splicing, so the resolution adds relationship_type, variant_origin, the variant-class tumour-risk paragraphs and two evidence items to PHOX2B, leaves TP53 untouched, and appends BARD1, CDKN1C, EZH2 and HRAS after it. All five gene CURIEs were re-resolved against cache/hgnc/terms.csv (hgnc:952 BARD1, hgnc:1786 CDKN1C, hgnc:3527 EZH2, hgnc:5173 HRAS, hgnc:9143 PHOX2B). The entry was held off a PR since 22 October waiting on question 2 of issue #14976, which asked whether the syndrome genes should be linked through differential_diagnoses rows carrying each syndrome's MONDO term. That half is dropped: the Neuroblastoma_Predisposition_Syndromes grouping now holds fifteen members and provides the page-to-page link the question was about, and PR #15838 has since recorded germline TP53 in this same section as a RISK_FACTOR naming Li-Fraumeni_Syndrome in its notes, which is the pattern these four records follow. ALK Mutations is deliberately left untyped: that record mixes germline predisposition with somatic mutation and needs splitting into two records, which is separate work.

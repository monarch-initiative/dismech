  summary: 'Edit: Neuroblastoma - immune-cold tumour microenvironment and tumour-associated
    macrophages'
  details: |
    Adds the immune-cold tumour microenvironment to Neuroblastoma as part of the neuroblastoma curation project (#14976, slate item Immune-cold microenvironment).

    New node 'Immune-Cold Tumor Microenvironment' (TISSUE; GO:0019885 DECREASED; CL:0000084 T cell DECREASED), placed after 'Anti-GD2 Antibody-Mediated Tumor Cell Killing', describing three patient-level axes: low somatic mutation burden (Pugh 2013, PMID:23334666), MHC class I low rather than absent on tumour cells (Wolfl 2005 PMID:15449039 and Whelan 1985 PMID:3902214 as the primary immunohistochemistry series; Melaiu 2017 PMID:28270499 quantified HLA class I density), and T-cell-poor tumours where MYCN is amplified (Layer 2017 PMID:28680756), with the ADVL1412 single-agent nivolumab result (Davis 2020, PMID:32192573) cited as patient evidence, not as a treatment claim, and reviews (Anderson 2022 PMID:35435953, Park 2020 PMID:32167865) as support. Its notes record why it does not conform to immune_checkpoint_blockade, that the GO binding is read off reduced class I surface protein, and that a split into burden, presentation and T-cell nodes is the better long-term shape.

    New node 'Tumor-Associated Macrophage Infiltration' (TISSUE, PROVISIONAL; CL:0000235) from Asgharzadeh 2012 (PMID:22927533): more CD163+ macrophages in stage 4 than locoregional tumours, and TAM genes contributing 25% of the accuracy of a 14-gene score whose low- against high-risk groups separated 5-year progression-free survival in children diagnosed at 18 months or older; no causal edge, with the reason in its notes.

    One edit to an existing node: a new first item in the downstream list of 'MYCN-Driven Proliferation' targeting the immune-cold node (INDIRECT_KNOWN_INTERMEDIATES, interferon/pro-inflammatory suppression and reduced chemokine output named), with patient (Layer 2017, Wei 2018 PMID:29784674) and cell-line evidence split by evidence_source.

    Not added: treatments rows, clinical_trials or discussions items (a knowledge gap on checkpoint-monotherapy failure is a follow-up), and anything already carried by 'Mesenchymal-State Immune Activation'. New caches: nine PMIDs; new term rows for GO:0019885. Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates.

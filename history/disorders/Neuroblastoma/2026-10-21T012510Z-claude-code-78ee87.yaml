  summary: 'Edit: Neuroblastoma - wire ALK and MYCN to their mechanism nodes'
  details: |
    Wires the entry's two causal driver genes into the pathograph. The pathophysiology node 'MYCN-Driven Proliferation' gains a genes: descriptor for MYCN (hgnc:7559) and the molecular function DNA-binding transcription factor activity (GO:0003700, INCREASED); 'ALK Signaling Activation' gains ALK (hgnc:427) and transmembrane receptor protein tyrosine kinase activity (GO:0004714, INCREASED). This follows the genes: and molecular_functions: pattern of the Ependymoma node 'MYCN Amplification in Spinal Ependymoma'. The genes: descriptors let the genetic records 'MYCN Amplification' and 'ALK Mutations' reach their mechanisms (2 of 6 causal genes wired, from 0), and the molecular functions make both landings activity-grounded, so the gene-activity grounding check passes; genes: alone would have added two ungrounded genes.

    Six evidence items: MYCN E-box binding and transcriptional control in neuroblastoma cell lines (PMID:29379199); MYCN protein tracking amplification in 78 patient tumors (PMID:31365300, graded INDIRECT as an association); ALK as a receptor tyrosine kinase (PMID:19723661, background); mutant ALK kinases with increased activity over wild type (PMID:18923524); constitutive activation of highly expressed wild-type ALK in neuroblastoma cell lines, with no activation at low wild-type expression (PMID:19723661); ALK amplification or in-gene rearrangement in 5% of sporadic primary tumors (PMID:18990089, graded INDIRECT because activation and the overlap with mutated tumors are inferred). The ALK node description now says the 8-10% mutation figure is at diagnosis and adds the wild-type high-expression route; its ALK-inhibitor sentence is unchanged.

    Deliberately not done: no new node (a pathophysiology node named 'MYCN Amplification' would share the name of the genetic record and collapse into it in the flat graph namespace); no origin marking (no genetic_context, variant_origin, role or cell type), because the cited sources do not establish either lesion as the initiating event and the patient-tumor timing study PMID:36973454 states that small structural rearrangements, the class it places MYCN amplification in, cannot be timed by mutation density; no biological_scale; no conforms_to, which no node in this entry carries yet: the ALK node holds both the receptor-kinase lesion and its MAPK output, so it would match two sustaining_proliferative_signaling nodes ('Oncogenic Growth-Signal Lesion' and 'Constitutive Mitogenic Pathway Activation'), and which is right depends on whether the MAPK output gets its own node, a structural change outside this PR; 'MYCN-Driven Proliferation' is not renamed.

    Validation: just validate, validate-terms (no new cache rows), count-verified-snippets (58/58), validate-disorders (58 snippets, 66 titles, 0 issues), check_gene_activity_grounding.py against origin/main, the duplicate-key, entity-ref, causal-target, qualifier-term, block-scalar and enum checks, the whole-KB snippet, title, grading, retired-prose, reference-title, coarse-phenotype, case-collision and term-cache gates, and node-class verification. Part of the neuroblastoma PR series tracked in issue 14976.

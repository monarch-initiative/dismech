  summary: 'ALK Signaling Activation: patient-tumour evidence for receptor activation'
  details: |
    Closes the gap the #15084 review left open: the ALK Signaling Activation node carried four HUMAN_CLINICAL evidence items and all four were mutation- or amplification-frequency counts, so nothing on the node measured ALK activation in patient tissue.

    Three items added. PMID:25251827 supplies the measurement itself - immunohistochemistry for phosphorylated ALK in primary neuroblastoma tumours, graded HUMAN_CLINICAL and DIRECT. Its quote keeps the preceding sentence, which is the finding's own control: no chimeric fusion protein is predicted from these translocations, so the phosphorylation is not a fusion artefact. Scope is stated in the explanation rather than implied - 332 primary tumours screened, breakpoints at the ALK locus in four, and the study itself calls the mechanism rare. A second item from the same paper carries the PC12 expression result (STAT3 and ERK activation) as IN_VITRO and INDIRECT, because it shows the rearranged receptor is signalling-competent without measuring that in the tumours. PMID:22203052 supplies ALK staining across unselected tumours, HUMAN_CLINICAL but INDIRECT, since staining reports receptor level and not phosphorylation.

    Two judgements worth recording. First, the two kinds of patient evidence are not interchangeable and the node notes now say so, because reading the staining series as an activation measurement would overstate it; the staining bears on activation only through the cell-line expression-threshold finding already cited on the node. Second, no prognostic direction is asserted. PMID:22203052's headline is that ALK positivity predicts poor outcome, but its own abstract calls the prognostic relevance of ALK tumour positivity inconclusive, and that is the sentence the notes rely on rather than an outside source.

    A source-internal inconsistency is recorded rather than smoothed: PMID:22203052 says 71 neuroblastomas where it states what was investigated and 2 of 72 where it reports the mutation count.

    The description gains the intragenic-rearrangement route as a third and rare mechanism alongside point mutation and amplification, with the 4-of-332 denominator.

    Scope decision from the user, 28 October: this work was attempted earlier the same day in another session and stopped by a safety classifier while drafting, for the second time on material involving one particular 2016 paper. The user directed a re-scoped attempt in a separate session excluding that paper entirely. It is not cited here and its content is not reproduced; the two sources used were re-fetched with just fetch-reference rather than recovered from the stopped attempt. The record is in memory/safety_stops/. One consequence is that the published patient series reporting the opposite prognostic direction is not represented on this node, which is a known and deliberate incompleteness rather than an oversight.

    The standing record-level fence is respected: no ALK-inhibitor clinical or trial evidence is added, the ALK Inhibitor Therapy treatment row is untouched, and neither new abstract contains ALK-inhibitor content.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present (the #15612 gate, not in the C4 set), check-qualifier-terms and check-logical-rules. validate-disorders reports 669 of 669 snippets verified and 678 titles with 0 issues. Validator whitespace churn in tracked references_cache files was restored before committing.

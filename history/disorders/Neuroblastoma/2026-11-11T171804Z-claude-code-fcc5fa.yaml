  summary: 'Review round 1: correct two Lombardo caveats the paper contradicts'
  details: |
    Two caveats on the Lombardo link were factually wrong and the review caught both against the cached full text. The limitations claimed the model carries no representation of the driving lesions; the paper models the activating ALK F1174L mutation in the network. The CALIBRATION_PROVENANCE divergence claimed generic enzyme kinetics not anchored to neuroblastoma; initial concentrations come from a paediatric neuroblastoma RNA-seq database and the Michaelis-Menten constants were fitted by linear regression against expression data. Both are rewritten to describe what the paper did, the divergence now says the parameters are anchored to this disease but to transcript levels rather than measured reaction rates, and fidelity is raised from LOW to MODERATE. Two evidence items were added to carry the corrections. Separately, two links paired an INVALIDATING divergence with fidelity MODERATE, which the schema says should pair with a low tier: the Aurora A link drops to LOW, and the MIBG boundary omission drops to QUALIFYING because a MEASURES link reading tracer handling is narrowed rather than invalidated by the transporter not being a model variable. The MIBG evidence led with an aim statement whose explanation claimed validation the sentence did not state; replaced with the quantitative validation result. The paper's inhibitor-simulation arm remains deliberately unrecorded under content fence a.

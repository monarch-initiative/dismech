  summary: 'Orphanet ORPHA:635 transcription: frequencies, birth prevalence, LMO1
    and HACE1'
  details: |
    Transcribes the committed Orphanet record for ORPHA:635 into the entry: 20 evidence items, 4 new prevalence records, 2 new genetic records and 3 frequency bands set. Touches phenotypes, prevalence, genetic and biochemical, which keeps it disjoint from the therapy pass in flight on treatments and clinical_trials.

    The frequency work turned out to be a judgement rather than a transcription, which is the main thing to know about this pass. Twelve of the entry's sixteen phenotypes have an Orphanet annotation. Three had no frequency band at all (Anemia, Thrombocytopenia, Subcutaneous Nodules) and are now set from Orphanet's class, with the quoted row as their source. Three agree with the band the entry already carried (Proptosis, Bone Pain, Spinal Cord Compression) and take the row as independent corroboration. The remaining six disagree: Orphanet classes abdominal mass, abdominal distension, fever and weight loss as frequent where the entry carries OCCASIONAL, classes hypertension as very rare where the entry carries OCCASIONAL, and classes Horner syndrome as occasional where the entry carries VERY_RARE.

    None of those six bands was overwritten. Orphanet's class is a coarse expert annotation over the whole disease and the entry's bands come from cited cohorts with denominators, so the two are not the same quantity and replacing one with the other would lose the better-specified figure. Each of the six carries the Orphanet row as an evidence item whose explanation names both bands and says why the entry's stands, so the disagreement is visible to the next curator instead of being silently resolved or silently ignored. Where a mechanism plausibly explains the gap it is stated and marked as a candidate rather than a finding: Horner syndrome follows cervical and upper thoracic primaries specifically, and catecholamine-driven hypertension is reported more often in series selected for secretory tumours.

    Four prevalence records come from the epidemiology rows the entry had not used: birth prevalence for Europe, Germany and the United States, and the worldwide annual incidence. The incidence record carries an explicit rate_denominator of POPULATION_PER_YEAR, because that measure has no fallback and Orphanet's class is per population per year over all ages, which is why it sits an order of magnitude below the childhood-cohort incidence records already in the entry rather than contradicting them. Two provenance oddities are recorded in notes rather than smoothed over: Orphanet files PMID:16919772 under European prevalence at birth although the ACCIS paper reports incidence, and Orphanet's German birth-prevalence class is an order of magnitude above its European and United States classes for the same measure.

    LMO1 (hgnc:6641) and HACE1 (hgnc:21033) get SUSCEPTIBILITY records. LMO1 was absent from the entry and HACE1 appeared only in prose and a reference title, so neither was queryable. Both records carry the gene-disease relationship and nothing else, and both notes say so explicitly: the Orphanet row states the relationship without a variant, effect size or cohort, and the association studies behind it have not been read into this entry. They are placeholders that make the genes queryable, not curated susceptibility claims. The ALK row was not touched -- it is fence-adjacent and its germline/somatic split depends on an unanswered question.

    The Ferritin and Lactate Dehydrogenase biochemical markers each take the Orphanet row for the elevated state they read out. The two laboratory phenotypes were put there rather than added as phenotype rows, because the analyte already has a home in biochemical and duplicating one concept across two sections would collide on the name.

    Deferred, with the reason: the eight laboratory and metastatic phenotypes the plan listed are not added. Wiring them is what makes them count for list-disconnected-phenotypes, and the entry has no catecholamine-secretion node to wire the four catecholamine annotations to -- 38 pathophysiology nodes and not one for the disease's defining biochemical behaviour. Creating that node is a mechanism claim needing its own evidence and its own review, so it belongs in a separate PR rather than at the end of a transcription pass. Lymphadenopathy and periorbital ecchymosis would wire to Metastatic Dissemination and are held with them so the set lands together.

    Also found and not acted on: the Orphadata pin has drifted. The manifest pins snapshot_date 2025-12-09 and the live release is 2026-06-23, so fetching any new ORPHA record now builds it from an unpinned release. ORPHA:661 was fetched for this pass and then deleted unused for that reason -- a cache file from a different release than the rest of the corpus should not enter through a curation PR. The repin plus whole-corpus rebuild is a maintenance PR of its own, which is also how the SB1 review round dispositioned the same suggestion.

    Validation: just validate clean, just validate-terms passed (one new cache row, LMO1), 792 snippets verified (772 before), and the offline KB gates pass including check-cache-order.

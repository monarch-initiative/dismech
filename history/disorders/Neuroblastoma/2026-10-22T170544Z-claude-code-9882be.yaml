  summary: 'Edit: Neuroblastoma - regrade the Cochrane frontline item on the MIBG
    row from NO_EVIDENCE to SUPPORT'
  details: |
    Review round on the 131I-MIBG PR. The review found a grading inconsistency that is a real error rather than a preference. The Cochrane sentence reporting that no randomised or controlled clinical trials compare newly diagnosed high-risk regimens with and without 131I-MIBG was graded NO_EVIDENCE, while the near-identical sentence from the systematic review two items earlier ('No randomised controlled trials (RCTs) were identified.') was graded SUPPORT. The schema defines NO_EVIDENCE as the cited reference not bearing on the claim at all, and the claim here is that the frontline role is unproven, which the absence of trials bears on directly. Regraded to SUPPORT, with the explanation rewritten to say why the sentence supports the claim rather than failing to bear on it. The two sentences are now graded consistently with each other and with the enum definition. Declined two further suggestions and said so in the reply rather than deferring them. The first was to align the four statements of MIBG-enters-via-NET biology on one evidence_source; the review itself notes none is wrong in isolation, and the four were graded from what each quoted sentence describes rather than from the kind of document it sits in, which is what the schema asks for: the lineage and tissue-of-origin statements are OTHER, the cell-level transport and storage statements are IN_VITRO, and each explanation records its own reasoning. The second was that no edge links the imaging row to the new node; ImagingFinding has no slot for that, as the review acknowledges, so nothing is actionable in this PR and the connection remains stated in prose. Re-validated with just validate (290/290 snippets, 0 issues), check-snippet-grading, check-enum-values and validate-disorders, and ran tools/parallel_check.sh onhold before the push.

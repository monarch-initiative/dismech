  summary: Review round 1 on PR 15332
  details: |
    The blocking finding was an uncited figure. The 'LIN28B Tumour Expression' notes ended with a univariate overall-survival association at P = 0.014 attributed to an unnamed separate study, so a reader could not check it. That study is PMID:22941191, already committed by this branch, and it is now a second evidence item on the record, quoting 'Low HACE1 and high LIN28B expression in diagnostic primary neuroblastomas were associated with worse overall survival' with the parenthesised P values left outside the snippet and the LIN28B P value stated in the explanation. The notes sentence now names the study instead of carrying a bare statistic. The record no longer rests on one abstract sentence.

    Three suggestions taken. GO:0070878 primary miRNA binding was grounded only on a review's extension from the paralog LIN28A; PMID:37991019, already in this branch, reports the LIN28B-pri-let-7 association itself in neuroblastoma cell lines and is added to the node, graded IN_VITRO and INDIRECT because the association is reported through its disruption. The existing explanation now says which of the two binding terms this reaches: GO:0070883 pre-miRNA binding still rests on the paralog extension, and saying so is better than leaving a reader to assume both are covered. The 'Mature let-7 abundance in tumour tissue' readout now carries its own evidence item repeating the link's PMID:23042116 measurement sentence, so the readout is self-describing, which is the reason its target is required to restate the link's. And rs17065417 is now a structured variant on the LIN28B susceptibility record with its dbSNP identifier, rather than living only in prose; clinical_significance is deliberately unset, because that enum classifies Mendelian variants and a common risk allele of this effect size is none of its values.

    One observation accepted without a change. The ceRNA sponge edge hangs off 'MYCN-Driven Proliferation' while its claim is about MYCN mRNA abundance. That node is already the file's MYCN-abundance node - its description names the overexpressed transcription factor and its TERT edge reads 'Amplified MYCN raises TERT transcription' - so the edge follows existing precedent, and splitting the node is a larger change than this PR should make. It is worth knowing if that node is ever split.

    The count of new edges in the first event's details said four and listed five; corrected to five in the same round, since the record had not yet merged.

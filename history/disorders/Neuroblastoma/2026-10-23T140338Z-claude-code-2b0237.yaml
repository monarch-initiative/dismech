  summary: Add let-7 depletion as a convergent node with LIN28B and MYCN-sponge routes
  details: |
    Curates the LIN28B/let-7 axis in Neuroblastoma, reframed around a convergent let-7 node rather than around LIN28B as a gene story. Powers 2016 (PMID:27383785) shows LIN28B is dispensable in MYCN-amplified neuroblastoma cell lines despite de-repression of let-7, so an entry whose flagship subtype is MYCN-amplified disease cannot model the LIN28B route alone.

    Two new pathophysiology nodes at the start of the section: 'LIN28B Overexpression' (MOLECULAR; hgnc:32207; GO:0070878 primary miRNA binding and GO:0070883 pre-miRNA binding, both INCREASED; GO:1903799 negative regulation of miRNA processing INCREASED; CL:0002676) and 'let-7 Depletion' (MOLECULAR; GO:0035195 DECREASED). Four new edges: LIN28B Overexpression to let-7 Depletion; let-7 Depletion to MYCN-Driven Proliferation and to Neural Crest Developmental Arrest; and, appended to the end of MYCN-Driven Proliferation's existing downstream list, MYCN-Driven Proliferation to let-7 Depletion (the MYCN-transcript sponge route) and to LIN28B Overexpression (the transcriptional arm). That closes a cycle with MYCN-Driven Proliferation, which is the biology rather than a modelling artefact; the pathograph has no acyclicity assumption and reciprocal pairs already exist in kb/.

    Two new genetic records after MYCN Amplification, because relationship_type is single-valued: 'LIN28B' (SUSCEPTIBILITY, the rs17065417 6q16 GWAS signal) and 'LIN28B Tumour Expression' (BIOMARKER, the prognostic expression claim). One new animal model at the end of animal_models: the Lin28B sympathetic-adrenergic lineage transgenic mouse, PARTIALLY_RECAPITULATES let-7 Depletion at MODERATE fidelity with model_scale ORGANISM and a let-7 readout.

    Three scope decisions. The genetic-loss route into let-7 depletion is named in the node description and its loci are not bound, because the arm-level copy-number evidence belongs with the Segmental Chromosomal Aberrations record. No genetic_context or variant_origin is recorded anywhere, so the entry still derives no cancer cell of origin. And the record never says the LIN28B expression association is independent of MYCN amplification: the source calls it an independent risk factor without naming its covariates and has no open full text, so the notes say that instead.

    The evidence-run candidate for cross-population replication was dropped. Its quoted review sentence lists UK, African American and Southern Chinese association for both 6q16 signals, which the primary GWAS does not support for rs17065417: Diskin 2012 has no UK cohort, reports only a trend in African Americans, and the Southern Chinese reports test other LIN28B variants. It is replaced by that study's own Italian replication sentence, and the notes say the entry does not extend the association further.

    Seven new reference caches committed (PMID:22941191, 23042116, 26123663, 26674877, 27383785, 37991019, 40779030); three fetched for checking and not cited were deleted. New term-cache rows for hgnc:32207, GO:0070878, GO:0070883 and GO:1903799, all resolved by just validate-terms and all enum-admitted.

    Gates run: just validate (446 snippets, 455 titles, 0 issues), validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-gene-activity-grounding, check-cancer-origin and model-scale-audit, all clean.

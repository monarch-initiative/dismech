  details: |
    Creates the entry's computational_models section with six models, each linked to a mechanism node. Two carry BioModels accessions whose names, formats and curation status were read from the BioModels search API in the step they were written: MODEL1812070002 Lombardo2018 - Expression of PDL1 in Neuroblastoma Cancer Cell and MODEL2502190001 Simon2025 - Neuroblastoma energy metabolism, both Non-curated SBML, which is recorded on each rather than implied. The other four are published models with no searchable deposit. Every link carries typed divergences rather than a prose caveat alone; the Aurora A Boolean model takes an INVALIDATING BOUNDARY_OMISSION because N-Myc is not a variable in it, so it constrains why Aurora A is high and cannot speak to the N-Myc stabilisation the node is named for. Four links are upward extrapolations and each carries a SCALE_EXTRAPOLATION divergence agreeing with its scale slots. PMID:36973453 was dropped from the planned set: it is a single-author Nature Genetics Comment with content_type unavailable in the cache, so it can carry no exact-quote snippet and is not a model paper. The MODEL1812070002 therapy-simulation arm is deliberately not recorded - network structure only. 14 new snippets, 868/868 verified across the file; 19/19 pre-push gates green.

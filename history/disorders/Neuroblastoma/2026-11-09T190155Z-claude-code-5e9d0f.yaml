  summary: 'Review round 1: the GD2-loss sentence overstated its source'
  details: |
    Automated review round 1 on PR #16933. The blocking finding was correct and the correction matters, because the sentence I wrote asserted something the cited paper's own data argue against.

    I had written that 'the target is not fixed under treatment' and that the 88% to 62% fall in GD2-positive tumour cells 'bears on whether a subsequent GD2-directed line can be assumed to have its target', citing the abstract and grading it DIRECT. The reviewer read the full text of PMID:42700735 and found three qualifications the entry left out, all three of which check out against references_cache/PMID_42700735.md:

    The abstract calls the figure a mean; the full text says median, and states the difference was not statistically significant. The before and after samples are not paired - 'Among 12 tumor tissue samples assessed, 9 were evaluable' at baseline against 'of which 18 samples (82%) were evaluable' overall - so 're-sampled tissue' overstated how paired the comparison was. And most directly against my reading, the paper reports that all four relapsing patients with an evaluable result remained GD2-positive, 'providing no evidence of preferential selection of GD2-negative clones during chemoimmunotherapy'. The authors' own conclusion is only that GD2 expression is 'dynamic and heterogeneous' and 'deserves further evaluation'.

    Three changes, all in one push. The description now says the question is unsettled rather than that the target is not fixed, gives the median rather than the mean, states the non-significance and the unpaired samples, records that relapsing patients stayed GD2-positive, and attributes the dynamic-and-heterogeneous reading to the authors instead of asserting it. The 88-to-62 item's snippet is replaced with the full-text sentence, which carries the median and the significance test that the abstract omits, and regraded INDIRECT with an explanation that says what the result cannot carry. A second item quotes the no-preferential-selection sentence, recorded beside the trend for the same reason the imprecision caveat sits beside the retinoic-acid null: it is what stops the trend being read as antigen escape. Its own explanation notes that four patients do not establish the absence of escape either.

    Both optional suggestions taken. The standalone BACKGROUND item quoting the Japanese drug-supply sentence is deleted and the fact folded into the hazard-ratio item's explanation, where it belongs - the reviewer is right that it is a fact about drug supply rather than about the row's claim, and my own explanation said as much. The stray blank line before the new references entries and the missing trailing newline are fixed.

    The net evidence count on the row is unchanged at 20, because one item was added and one removed.

    Validation: just validate-disorders clean (798 snippets, 819 titles, 0 issues), check-snippet-grading clean - worth running here because the regrade changed a directness value and replaced a snippet - and the offline gates pass.

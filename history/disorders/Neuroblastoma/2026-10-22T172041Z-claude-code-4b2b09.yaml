  summary: 'Edit: Neuroblastoma - move the ADVL0912 clinical negatives off the crizotinib
    mechanism link to treatment level'
  details: |
    Fourth and final review round on the Crizotinib/Lorlatinib split, taking the approving review's one non-blocking suggestion because it identifies a real misattribution rather than a preference. The two ADVL0912 amplification REFUTE items added in the previous round were placed on the target_mechanisms link, whose claim is that crizotinib INHIBITS ALK Signaling Activation. That trial measured tumour response, not kinase inhibition, so on that link the items read as evidence against target engagement, which is not what the source shows. Both items moved to the treatment-level evidence list, directly after the F1174 REFUTE item they belong beside, and each explanation now states why it sits there: the result bears on whether the drug works in amplified disease, not on whether it engages its target. The xenograft item's explanation, which pointed at 'the item below', now points at the treatment-level evidence instead. After the move the mechanism link carries six items and no REFUTE item, all of them about target engagement, while the treatment-level list carries nine items of which five are REFUTE, all clinical. This is the same two-layer distinction the repository draws for model-to-mechanism links, where evidence on the link attests that the model is informative for the node while evidence on a readout attests that a measurement was made. It is also the third instance in this session of one underlying error, attributing evidence to a claim it does not speak to: the other two were grading a Cochrane absence-of-trials sentence NO_EVIDENCE on the MIBG PR, and describing a reported two-patient negative as an absence of data in the previous round here. Re-validated with just validate (303/303 snippets, 312 titles, 0 issues), count-verified-snippets --strict, check-entity-refs, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-snippet-grading and validate-disorders, and ran tools/parallel_check.sh onhold before the push.

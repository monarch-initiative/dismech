  summary: Spontaneous regression as a phenomenon, with four competing hypothesis
    groups
  details: |
    Curates spontaneous regression in neuroblastoma as an established patient-level phenomenon whose mechanism is unsettled, and records the competing candidates as the entry's first mechanistic_hypotheses: section.

    Four groups, none CANONICAL: regression_trka_ngf_deprivation and regression_absent_telomere_maintenance (both ALTERNATIVE, each with a causal edge into the regression node), regression_immune_mediated and regression_epigenetic (both EMERGING, neither carrying an edge because no pathophysiology node here is annotated for an immune effector or an epigenetic state).

    Three pathophysiology nodes: 'Spontaneous Tumor Regression' (TISSUE, role outcome, CL:0002676, no process binding), 'NGF-TRKA Trophic Signaling Withdrawal' (CELLULAR, PROVISIONAL, NTRK1 and NGF, GO:0048011 DECREASED) and 'Absence of a Telomere Maintenance Mechanism' (MOLECULAR, PROVISIONAL). The two mechanism nodes each take one edge into the regression node, tagged with their hypothesis group.

    The draft came from a workflow run that a safety classifier halted mid-edit, leaving nine items its own review had raised and verified but not applied. All nine are applied here.

    The stopped edit itself was the Kawakubo item in the immune group: one evidence item carrying both an antibody titre that tracks tumour size inversely and the finding that the same antibody does not track regression. It is now two items, a SUPPORT and a REFUTE, each quoting the sentences that carry it, which is what the schema asks for when one quote cuts both ways. The supporting half also now records that the antibody had complement-dependent but not antibody-dependent cellular cytotoxicity, which the single item had described neutrally.

    Two statements in the regression node's notes were false and are corrected. The node does bind an ontology term, CL:0002676, immediately above the note; and Pathophysiology does admit NCIT bindings in two slots. The real obstacle to NCIT:C53298 is that it names a clinical course rather than a process, chemical entity, gene product or cell type, and that is what the note now says. Its four OLS searches were re-run and all four return what the note describes.

    The claim that GO:0048011 is the TrkA-specific term was wrong, and that was the one blocking finding. The term's own label names the TRK receptors as a family, so it spans TrkA, TrkB and TrkC, and GO has no TrkA-only pathway term. The binding is still right and is unchanged, as is the DECREASED modifier; only the stated reason moved, and the note now points at the NTRK1 gene descriptor as what carries the receptor identity. Congenital_Insensitivity_to_Pain carries the same term with the same modifier on its own NGF-TRKA node, which was checked rather than recalled.

    Three overstatements corrected. 'Maturation toward ganglioneuroblastoma was the usual histological course' becomes the source's own counts and its own 'common phenomenon' wording. 'Mass screening bounds the phenomenon from above rather than observing it' becomes a statement of what the overdiagnosis estimate is, plus why it neither measures nor cleanly bounds regression: it mixes tumours that would have regressed with tumours that would have stayed silent, and cannot see tumours that regressed before the screening age or after clinical diagnosis. And the telomere edge still carried the sufficient-cause wording that the group description had already dropped; it now states the absence as a proposed precondition and points at this entry's own Unlimited Replicative Potential node, which records high-risk tumours without significant telomere lengthening whose cells kept proliferating.

    Two gaps filled. The NGF-TRKA description made two claims from Brodeur 2018 with nothing cited; three evidence items now carry them, quoted from the 2018 review rather than the same author's 2014 one, which states the TrkAIII-to-TrkAI switch in the opposite direction. And the UNC5D account on the downstream edge reported only the negative tumour-tissue result; a second item now carries the same paper's positive one, UNC5D induced and nuclear in regressing tissue from a mass-screened stage 1 tumour, graded HUMAN_CLINICAL as immunostaining of patient tissue.

    Scope: no 1p36, 11q, 17q or chromothripsis evidence; no Trk-inhibitor or trial evidence; no treatments, discussions or progression content; no subtype or stage foreign keys; no edits to any existing node. The Ras-associated caspase-independent death route (Kitanaka, PMID:11880474) is named in the NGF-TRKA notes as a further candidate and deliberately not recorded as a hypothesis group; its cache is committed so the note is checkable, and every clause of it was checked against that cache.

    Thirteen new reference caches committed; five fetched for checking and cited nowhere were deleted, and eight pre-existing caches the validator rewrites for whitespace were restored rather than staged. No cache/ CSV rows were needed.

    Gates: just validate (454 snippets, 463 titles, 0 issues), validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-gene-activity-grounding and check-cancer-origin, all clean.
- type: REVIEW
  outcome: changed
  sections:
  - pathophysiology
  - evidence
  summary: Review round 1 on PR 15338
  details: |
    Two blocking findings, both real contradictions rather than disagreements.

    First, an explanation still carried the overstatement this PR says it removed. The Spontaneous Tumor Regression node description already said the German screening overdiagnosis estimate 'neither measures nor cleanly bounds regression', while the PMID:11932471 evidence explanation beneath it still ended by claiming the estimate bounds regression from above. The explanation now says what the description says, and says why: a tumour that would have stayed clinically silent counts toward the overdiagnosis estimate exactly as one that would have regressed, and the estimate cannot see tumours that regressed before the screening age or after clinical diagnosis. Nothing is bounded in either direction.

    Second, three PMID:29305654 items on NGF-TRKA Trophic Signaling Withdrawal were graded HUMAN_CLINICAL for sentences that describe normal sympathetic development, the TrkA/NGF regulation of that developmental programme, and a proposed TrkAIII-to-TrkAI isoform switch drawn from cell work. CLAUDE.md grades evidence_source from what the quoted text describes, and none of these describes a human clinical observation; the first item's own explanation already conceded that the underlying work is largely from animal systems. All three are now OTHER, which is what the same review's synthesis sentences under mechanistic_hypotheses already carry, and each explanation says why rather than leaving the value bare. The first explanation's phrase 'HUMAN_CLINICAL for the clinical picture it is applied to here' is replaced rather than left contradicting its own value.

    One suggestion taken: the node description said the Iwanaka maturation finding was 'a common phenomenon rather than the rule'. Iwanaka says only 'common phenomenon', and the observed group was 6 of 6, so the four-word gloss asserted more than the source. Dropped.

    The line-wrap suggestion is cosmetic and was left; the reflowed lines parse identically and rewrapping them would enlarge the diff for no checkable gain.

    Gates re-run after the edits: just validate-disorders (454 snippets, 463 titles, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-block-scalar-comments, check-snippet-grading, check-title-snippets, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml and check-coarse-phenotypes, all clean.


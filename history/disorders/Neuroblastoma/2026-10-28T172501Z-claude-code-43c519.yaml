  summary: Create inheritance:; add the germline TP53 p.R337H record
  details: |
    Creates the entry's inheritance: section and adds one germline predisposition gene record.

    The inheritance section has two blocks, both bound and both evidenced from one already-cited paper, PMID:21734404. Sporadic (HP:0003745) carries the fact that most neuroblastoma arises sporadically with about 1% of cases having a positive family history, which is what keeps the heritable block below in proportion. Autosomal dominant inheritance (HP:0000006) with penetrance INCOMPLETE carries the familial form: dominant ALK variants in more than half of familial cases, and about 50% penetrance among carriers in the pedigrees used to map ALK. Both snippets are from that paper's introduction restating its predecessor, so both are graded BACKGROUND rather than PRIMARY_RESULT; the segregation result itself is cited separately from PMID:18724359, graded HUMAN_CLINICAL to match that sentence's grading in ALK-Related_Neuroblastic_Tumor_Susceptibility, which cites it for the same eight families.

    The penetrance figure is the reason the block is worth stating apart from the gene records: carrier status is not a prediction of disease, and a 50% transmission probability is not a 50% risk of illness. The figure is from the specific linkage pedigrees, not a population estimate, and the explanation says so.

    A polygenic block was considered and deliberately left out. Common-variant susceptibility is real for neuroblastoma, but no cached reference in this repository states it quotably: the GWAS candidates that surfaced on a cache-wide search turned out to be Alzheimer, ALS and alcohol-use papers that merely mention neuroblastoma cell lines. Asserting polygenic inheritance without a source would have been worse than the gap, so it is left for a pass that fetches a real GWAS source.

    The TP53 record covers germline p.R337H, graded RISK_FACTOR rather than CAUSATIVE because the allele raises neuroblastoma risk without being necessary or sufficient. Its three evidence items were drafted and verified in an earlier session and are used unchanged, including their gradings, which already match the cross-file convention: the reported-cases sentence HUMAN_CLINICAL plus REVIEW_SYNTHESIS, and the surveillance recommendation OTHER plus REVIEW_SYNTHESIS, the same split Beckwith-Wiedemann_Syndrome uses for the same review's recommendation sentence. The record states its own limits rather than leaving them to a reader: the Brazilian series has no control group of its own, seven carriers, two of whom also had an adrenocortical tumour, and three genotyped in tumour tissue only.

    Scope kept clear of the held P-c branch. That branch already adds BARD1, CDKN1C, EZH2 and HRAS records and updates PHOX2B, and is withheld pending an answer on the cross-entry link pattern in #14976, so none of those five is touched here. Both branches append to the end of genetic:, so they will conflict textually; the resolution is additive, keeping both sets of records.

    One unplanned change, and the reason for it. Adding the TP53 record wired that gene into the pathograph for the first time, which made check-gene-activity-grounding fail on the node it lands on, p53 Pathway Inactivation, for naming no molecular function. The documented remedy for a many-gene bundle is a baseline row, and the three genes on that node genuinely share no function: p53 is a transcription factor, MDM2 an E3 ligase, p16INK4a a CDK inhibitor. But all three routes converge on losing one thing, p53's DNA-binding transcription factor activity, so GO:0003700 DECREASED was bound instead and no baseline was touched. The node's new notes say why one function is bound for three genes and that the ligase and kinase-inhibitor activities are deliberately not.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-logical-rules and check-qualifier-terms. validate-disorders reports 672 of 672 snippets verified and 681 titles with 0 issues. HP:0003745, HP:0000006 and GO:0003700 were each read from the committed term caches and confirmed present in their dynamic-enum caches before being written. Validator whitespace churn in tracked references_cache files was restored before committing.

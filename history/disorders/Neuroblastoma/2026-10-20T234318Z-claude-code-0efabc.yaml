  summary: 'Edit: Neuroblastoma - phenotype evidence and frequency reconciliation'
  details: |
    Adds evidence and sourced frequency bands to the phenotypes section and evidences the neuron-specific enolase (NSE) biochemical item. Before this edit six of the seven phenotypes had no evidence and none of the seven frequency bands had a quantitative source; Abdominal Mass was VERY_FREQUENT on the strength of a tumor-site figure.

    Bands are set only from all-stage diagnostic series of neuroblastoma, with the arithmetic given in the explanation. Figures from narrower cohorts are recorded as phenotype_contexts with the population named. Metastatic-site figures cited for a symptom are graded INDIRECT and carry no frequency. No band is taken from a series that mixes ganglioneuroblastoma into its denominator (docs/frequency-evidence-guidelines.md, anti-pattern 5). Every phenotype evidence item is SUPPORT, because a REFUTE on a phenotype exports to HPOA as a NOT annotation. Descriptions carry no percentages, because the HPOA exporter reads a percentage in a description as the frequency.

    Band changes: Abdominal Mass VERY_FREQUENT to OCCASIONAL (Sao Paulo all-stage series, 19%; Danish nationwide cohort, palpable mass at any site in 38 of 143); Bone Pain FREQUENT to OCCASIONAL (Sao Paulo, 19%); Diarrhea OCCASIONAL to VERY_RARE, rebound from HP:0002014 Diarrhea to HP:0005208 Secretory diarrhea with temporality CHRONIC (VIP watery-diarrhea syndrome, under 3% of patients). Hypertension stays OCCASIONAL, now sourced from the Institut Curie series, which measured blood pressure (severe hypertension at diagnosis in 10% of neuroblastomas, asymptomatic in every case); the Italian registry survey of symptomatic cases (1.8%), the Sao Paulo record (2%) and a Ugandan cohort (70.3%) are contexts. Fever, Weight Loss and Proptosis stay OCCASIONAL and are now sourced.

    New phenotypes: Abdominal Pain (HP:0002027) and Abdominal Distension (HP:0003270), OCCASIONAL from the Sao Paulo series; Horner Syndrome (HP:0002277), VERY_RARE; Spinal Cord Compression (HP:0002176), OCCASIONAL (Italian registry, 76 of 1462); Anemia (HP:0001903) and Thrombocytopenia (HP:0001873), with no band and with both the marrow-infiltration association and its absence in two Indian series recorded; Hepatomegaly (HP:0002240) and Subcutaneous Nodules (HP:0001482) as stage 4S features, recorded with phenotype_contexts rather than the Stage 4S subtype.

    NSE: bound to NCIT:C62216 Gamma-Enolase (new row in cache/ncit/terms.csv). The notes now give stage-specific serum levels and the 100 ng/ml threshold associated with poor outcome in stage III-IV and stage IV disease, and drop 'correlates with tumor burden', since stage IV-S levels are low despite extensive tumor burden.

    Not changed: pathophysiology, causal edges, discussions, subtypes, histopathology and prevalence. ORPHA:635 bands were not used: three of its four listed phenotype sources are reviews and the fourth, PMID:3030523, is an unrelated paper.

    Adds 51 evidence items from 24 newly cached PMIDs (10363850, 11134211, 12888814, 17023826, 19143025, 20149339, 25548446, 28711167, 28801367, 29995142, 3002599, 30444686, 32006485, 34612613, 36112265, 36299690, 36531507, 36562399, 37323595, 40082825, 42680795, 6135871, 6493702, 6670848); the existing Abdominal Mass item was regraded. The entry goes from 23 to 47 unique PMIDs. Evidence was found and checked by a planning, finding and three-lens verification workflow, composed per phenotype with two further checks, and pre-reviewed by four independent reviewers with two verifiers per finding. Validation: just validate, validate-terms, count-verified-snippets (103/103), validate-disorders (103 snippets, 111 titles, 0 issues), the duplicate-key, entity-ref, causal-target, qualifier-term, block-scalar and enum checks, the whole-KB snippet-length, title-snippet, snippet-grading, retired-support-prose, reference-title, coarse-phenotype, case-collision, term-cache-integrity and environmental-evidence gates, check-gene-activity-grounding against origin/main, and node-class verification. Part of the neuroblastoma PR series tracked in issue 14976.

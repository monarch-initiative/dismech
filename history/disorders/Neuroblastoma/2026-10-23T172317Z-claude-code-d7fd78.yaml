  summary: 'Neuroblastoma: evidence and agent bindings for the frontline chemotherapy,
    surgery and radiotherapy rows'
  details: |
    Added patient evidence to the three frontline treatment rows, which had none. Risk-Adapted Chemotherapy: bound vincristine (CHEBI:28445), doxorubicin (CHEBI:28748), topotecan (CHEBI:63632) and carboplatin (CHEBI:31355) beside cisplatin, etoposide and cyclophosphamide, and set therapeutic_modality SMALL_MOLECULE; the description now sources its low-risk statements (COG P9641, PMID:22529259; NB95-S/NB97, PMID:18349403) and adds intermediate-risk de-escalation (COG A3961, PMID:20879880; COG ANBL0531, PMID:31386611) and a high-risk induction regimen naming all six agents (PMID:31619207). Surgical Resection: description broadened to surgery alone in low-risk disease (P9641) and expectant observation for infants under 6 months with a small adrenal mass (COG ANBL00P2, PMID:22964741, and its 10-year report, PMID:40452136); the high-risk statement now reports what HR-NBL1/SIOPEN (PMID:32639845) and COG A3973 (PMID:27870572) show and where they disagree, with operative harms. Radiation Therapy: evidence for primary-site radiotherapy after induction, resection and transplant (COG ANBL0532 radiotherapy report, PMID:32530765; COG pilot ANBL02P1, PMID:22010014; an MSKCC series of 99 patients, PMID:11387353), and the binding narrowed from NCIT:C15313 to its child NCIT:C15751 External Beam Radiation Therapy. 23 evidence items from 12 newly cached references, all HUMAN_CLINICAL; no study is called randomized and each explanation gives its denominators. Not included on purpose: chromosome 1p/11q markers used in ANBL0531's risk assignment, regression results from Hero 2008, and any change to the transplant, anti-GD2, naxitamab, ALK-inhibitor, isotretinoin, eflornithine or MIBG-therapy rows. Validation on the tree rebased onto origin/main feb8048039: just validate-disorders reports no issues; 497/497 snippets verified; the 18 offline gates used for this series all pass; trial merges against the open PRs #15274, #15332, #15336, #15338 and #15346 are clean.

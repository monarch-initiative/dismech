  summary: 'Add diagnosis and imaging_findings: 123I-MIBG scintigraphy, FDG PET/CT,
    urinary catecholamines; MIBG-avid and MIBG-nonavid disease'
  details: |
    Added two sections the entry lacked. diagnosis: three rows. (1) 123I-MIBG Scintigraphy, bound to NCIT:C219704 Whole Body Gamma Scan (the only child of Whole-Body Scintigraphy; NCIT has no MIBG-scan procedure term) with LOINC:82136-3 in measurements; it covers the 2010 INRG MIBG guideline (dated, since a 2024 systematic review found catecholaminergic PET/CT detected more lesions in head-to-head studies), the INRG staging requirement and its reading rule for one unequivocal distant lesion, the 2017 revised INRC response rules, diagnostic accuracy in a prospective trial, labetalol interference, and in results the post-induction Curie (above 2) and SIOPEN (above 3) cut-offs, stated as scores of the post-induction scan, with the caveat that few patients in those cohorts received anti-GD2 immunotherapy and the ANBL0532 tandem-transplant result (optimal end-of-induction Curie cut point 0). (2) 18F-FDG PET/CT for MIBG-Nonavid Disease (NCIT:C137817): FDG's role comes from the 2017 response criteria, with their biopsy caveat; the 2009 INRG staging system and the 2010 INRG MIBG guideline named technetium-99m bone scintigraphy for MIBG-negative tumors and judged routine FDG-PET not justified; Cochrane 2015 and EANM 2018 context. (3) Urinary Catecholamine Metabolites (NCIT:C61044 with LOINC Parts LP15947-2 and LP15096-8): INSS diagnostic criterion, INRC exclusion from response assessment and the revision's stated aim, low sensitivity for monitoring, and an eight-metabolite panel's prognostic value at complete remission. imaging_findings: MIBG-Avid Disease (NCIT:C79553, VERY_FREQUENT) with the transporter evidence scoped by study (NET protein vs mRNA, VMAT2 protein vs mRNA, and the 2017 authors' statement that their NET mRNA result contradicts their earlier PCR study); MIBG-Nonavid Disease (no NCIT or HP term exists; preferred_term only, OCCASIONAL) with the Cochrane 10% figure, causes of false-negative scans, and the COG 343-patient cohort profile and multivariable result. Consensus-paper grading follows #15100: a paper's own criterion is PRIMARY_RESULT, a restatement or weighing of cited work is REVIEW_SYNTHESIS. Before opening the PR, a four-lens pre-review with two adversarial verifiers per finding upheld 26 of 30 findings; all upheld fixes were applied (the main ones: catecholaminergic-PET content moved off the FDG row, transporter sentences scoped, nonavid disease split into its own finding, binding narrowed from NCIT:C19565 to NCIT:C219704, search notes listing every term returned). Every NCIT, HP and Monarch KG search named in notes was re-run on 2026-10-21 immediately before commit. Validation: just validate, validate-terms, count-verified-snippets (97/97), validate-disorders (97 snippets, 105 titles, 0 issues), LOINC tests, and the whole-KB offline gates. 45 evidence items from 14 references new to the entry.

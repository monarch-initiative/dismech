  summary: Add telomere maintenance mechanism nodes and evidence
  details: |
    Added the telomere maintenance mechanism layer to the neuroblastoma entry, on top of the TERT Rearrangement and ATRX Mutation genetic records added in #7114.

    Pathophysiology. Four new nodes: Telomerase Activation (genes TERT; molecular function GO:0003720 telomerase activity, increased; GO:0007004; conforms to enabling_replicative_immortality#Telomere Maintenance Reactivation), Reduced ATRX/DAXX Complex Abundance (genes ATRX; GO:0140658 ATP-dependent chromatin remodeler activity, decreased), Alternative Lengthening of Telomeres (GO:0000722; no conformance, because the module's ALT anchor exists only in open PR #13924) and Unlimited Replicative Potential (GO:0008283, the binding of its anchor; conforms to enabling_replicative_immortality#Replicative Immortality). New edges: MYCN-Driven Proliferation -> Telomerase Activation (intermediate: increased TERT transcription driven by amplified MYCN), Telomerase Activation -> Unlimited Replicative Potential, Reduced ATRX/DAXX Complex Abundance -> Alternative Lengthening of Telomeres (intermediate: loss of ATRX/DAXX-dependent H3.3 deposition at telomeric repeats) and Alternative Lengthening of Telomeres -> Unlimited Replicative Potential. Counter-evidence is recorded as REFUTE items: Dagg 2017 (PMID:28636942; a high-risk subset without telomere lengthening activity) on Unlimited Replicative Potential, and Koneru 2020 (PMID:32291317; MYCN-amplified tumours with low TERT expression, and MYCN overexpression not overcoming TERT repression) on the MYCN edge.

    Genetic records. ATRX Mutation: notes rewritten; the unsourced 'treatment-refractory' and 'essentially absent in infants' were replaced by statements scoped to Sun 2026 (PMID:42558321), Kurihara 2014 (PMID:25487495) and Cheung 2012 (PMID:22416102), and six evidence items were added. The existing PMID:22416102 age item's explanation was corrected: whole-genome sequencing covered 40 of the 104 patients (the other 64 by PCR and Sanger), and its pointer to an adolescent/young-adult subtype framing was dropped along with the notes rewrite; directness and quote_role were added after assessment. TERT Rearrangement: the notes and the first item's explanation were reworded from 'three alternative routes to telomere maintenance' to the two-mechanism framing, with TERT rearrangement as a route into telomerase activation.

    Description and references. The telomere sentence of the top-level description now names the two mechanisms, defines the third telomerase route as high TERT expression without either alteration, and scopes the chemotherapy-response finding to large ATRX deletions and truncating mutations. In references, the bioRxiv preprint DOI:10.1101/2022.08.16.504100 was replaced by its published version, PMID:39635126; the preprint's cache file is left in place, uncited.

    Totals: 54 new evidence items; 15 PMIDs new to the entry (38 in all).

    Not done. No ALT conformance until #13924 merges (follow-up: add it and re-anchor Leiomyosarcoma's ALT node to the same anchor). No variant_origin on any new node, so the entry stays NO_ORIGIN for check-cancer-origin. No telomere-directed treatments. Phenotypes are not yet wired to these nodes.

    Validation: just validate, validate-terms, count-verified-snippets (106/106), validate-disorders, the offline gates, check_gene_activity_grounding against origin/main, node_classes --verify-kb, prose-figure-audit (no new flags). A four-lens pre-review with two independent verifiers per finding was run before the PR, and the findings both verifiers upheld were applied, including the REFUTE regrades.

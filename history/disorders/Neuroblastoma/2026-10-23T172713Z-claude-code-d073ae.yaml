  summary: 'Create clinical_trials: with the trials the curated records rest on'
  details: |
    Creates the entry's clinical_trials: section with six trials, placed after treatments: and before animal_models: to match the committed convention. Every phase and status was read from the ClinicalTrials.gov API rather than from the publications, and just clinicaltrials-status-audit reports zero drift across all six: no phase drift, no missing values, none unresolvable, and no registry status outside the dismech enum.

    Each record names which curated claim it bears on, so the section is a set of anchors rather than a list.

    NCT00567567 (ANBL0532, PHASE_III, COMPLETED) and NCT01704716 (SIOPEN High Risk Neuroblastoma Study 1, PHASE_III, UNKNOWN) are the two trials behind the Autologous Stem Cell Transplant record and the consolidation knowledge gap. Both registry identifiers come from the trials' own abstracts, quoted in the treatment work rather than recalled. NCT01704716's registry status is UNKNOWN, which is the registry's value where a sponsor has not confirmed status within the expected interval; the record says so rather than leaving a reader to infer the trial stopped.

    NCT00026312 (ANBL0032, PHASE_III, COMPLETED) is the trial that established anti-GD2 immunotherapy in maintenance, and its registered design settles a point the isotretinoin record makes: both arms received isotretinoin and the randomization was of dinutuximab, aldesleukin and sargramostim added to it. So the trial establishes what anti-GD2 adds to isotretinoin, not what isotretinoin adds in the anti-GD2 era. The registry also describes it as partially randomized, which is quoted.

    NCT02395666 (PHASE_II, COMPLETED) is the single-agent eflornithine maintenance trial; its registered schedule, twice-daily oral dosing over 27 cycles of 28 days, is the source of the dosing interval on the Eflornithine record. NCT03794349 (PHASE_II, ACTIVE_NOT_RECRUITING) is the randomized add-on test of eflornithine in relapsed or refractory disease that the Eflornithine notes name; the cached body holds only the brief summary, which is why those notes say its posted outcome figures cannot be quoted.

    NCT00033293 (PHASE_III, COMPLETED) is the randomized IVIG trial in neuroblastoma-associated opsoclonus-myoclonus-ataxia syndrome. Its three target_phenotypes, Opsoclonus (HP:0010543), Myoclonus (HP:0001336) and Ataxia (HP:0001251), are bound from the registered title, which names the syndrome; all three CURIEs were read from cache/hp/terms.csv. The record points at the Paraneoplastic Neurological Syndromes entry, where the mechanism and the immunotherapy evidence are curated, rather than duplicating them here.

    All nine evidence items are graded evidence_source: OTHER, because a registry summary is a registration document rather than study evidence. That follows the convention CLAUDE.md records for ICTRP registration records. The trials' results are cited on the treatment records from their publications, not from here. Every item carries a reference_title copied from the title: frontmatter of its cache file.

    NCT03126916 is included, and the reason it nearly was not is worth recording. A session note carried into this work said never to curate that trial. PR #15222, which split the ALK inhibitor records, says the opposite in its own body: it declined to create a clinical_trials: section because that section had a designated creator, and because trial phase and status "go stale and belong in a block the status audit can see; adding them here would put them where clinicaltrials-status-audit never looks". So the earlier PR deferred the trial to this one rather than fencing it off, and the note inverted that. The trial is now a record, which is what puts it where the status audit can read it. It anchors two already-merged records at once, 131I-MIBG Therapy and Lorlatinib, whose frontline claim had been sourced to two publications that merely name the trial.

    Validation: just validate-disorders passed (482 snippets, 483 titles, 0 issues). just clinicaltrials-status-audit reported 0 drifted and 0 other findings. Also clean: validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-case-collisions and check-coarse-phenotypes. Six new reference caches committed, all six cited; no term-cache rows were needed because every HP term was already cached.

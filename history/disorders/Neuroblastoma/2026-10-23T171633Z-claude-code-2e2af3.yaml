  summary: Source the transplant and isotretinoin records; record the consolidation
    gap
  details: |
    The consolidation and maintenance treatment records were two of the thinnest in the entry: neither carried a single evidence item, and the transplant record asserted "Tandem transplant may provide additional benefit" with nothing behind it. Both are now sourced from the randomized trials that decide them, and the disagreement between those trials is recorded as a knowledge gap rather than smoothed over.

    Autologous Stem Cell Transplant now carries five evidence items from three trials. ANBL0532 (PMID:31454045, JAMA 2019) randomized tandem transplant, thiotepa and cyclophosphamide followed by dose-reduced carboplatin-etoposide-melphalan, against a single carboplatin-etoposide-melphalan transplant: three-year event-free survival from randomization 61.6% against 48.4%. SIOPEN HR-NBL1 (PMID:28259608, Lancet Oncol 2017) randomized busulfan-melphalan against carboplatin-etoposide-melphalan as single regimens: three-year event-free survival 50% against 38%, with fewer severe adverse events but more than twice the veno-occlusive disease (22% against 9%). CCG-3891's long-term report (PMID:19171716) supplies the more basic result that myeloablative therapy with autologous rescue beats non-myeloablative chemotherapy at five years, 30% against 19%.

    The record's notes carry ANBL0532's own stated limit rather than leaving the percentage to stand alone: 355 of 652 eligible patients randomized, 207 withheld by physician or parent preference, a one-sided superiority hypothesis, and the authors' statement that the findings may not represent all patients with high-risk neuroblastoma. The notes also say not to read the two trials' absolute percentages against each other, because induction regimen, eligibility, era and the point from which event-free survival is measured all differ.

    New KNOWLEDGE_GAP discussion, gap_nb_consolidation_tandem_versus_busulfan_melphalan, attached to treatments#Autologous Stem Cell Transplant. Both trials improved on the same carboplatin-etoposide-melphalan comparator and neither tested the other's winner, so tandem CEM-based consolidation and single busulfan-melphalan have never met. The gap states what would resolve it: a randomized comparison in one induction backbone with anti-GD2 maintenance in both arms.

    Isotretinoin now carries five evidence items and a correction that materially changes what the record may claim. The original CCG-3891 report (PMID:10519894, NEJM 1999) found three-year event-free survival after the second randomization significantly better with six months of 13-cis-retinoic acid than with no further therapy, 46% against 29%. The long-term report of that same randomization (PMID:19171716) found the five-year event-free survival advantage in the same direction but not significant, 42% against 31%, and is recorded as REFUTE against reading the three-year figure as durable.

    The overall-survival claim needed care. PMID:19171716 carries a published erratum, J Clin Oncol 2014;32:1862-3, confirmed from PubMed's own CommentsCorrections record for the article, which reversed its overall-survival conclusion. The cached file holds both versions: the corrected abstract concludes that neither myeloablative therapy with autologous rescue nor cis-RA significantly improved overall survival, while the uncorrected full-text body still says cis-RA independently improved it. The corrected sentence is the one cited; the record's notes say so explicitly and tell a future curator not to cite the other. Quoting the corrected sentence required bridging an editorial bracket mid-clause with the validator's ' ... ' form, since bracketed spans are stripped before matching.

    The isotretinoin description also states, from the trial's own enrollment dates (January 1991 to April 1996) and ANBL0532's statement of current standard of care, that the randomization which established the drug ran before anti-GD2 immunotherapy entered the same maintenance phase. It stops there rather than asserting that no randomized test of the combination exists, which would be a negative-existence claim no gate can check.

    Two schema details worth recording for the next curator. Discussion.posed_date has range datetime, not date, so a bare '2026-10-23' fails linkml-validate; the committed convention across kb/ is a midnight RFC 3339 stamp. And posed_by containing an issue reference must be double-quoted, or a plain scalar truncates at the ' #'.

    Site selection was deliberate. The new-PR session's Frontline run was editing the 'Risk-Adapted Chemotherapy', 'Surgical Resection' and 'Radiation Therapy' rows of this same entry concurrently, so this work took only rows that run does not: Autologous Stem Cell Transplant, Isotretinoin, and the discussions section.


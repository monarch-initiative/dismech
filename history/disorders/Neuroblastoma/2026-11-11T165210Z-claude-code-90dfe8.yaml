  summary: Differential rows for the peripheral neuroblastic tumour family and DSRCT
  details: |
    Adds three differential_diagnoses rows and rebinds one. Ganglioneuroma and ganglioneuroblastoma are added from the INPC four-category definition, which separates them from neuroblastoma on Schwannian stroma content and so states the distinguishing feature rather than only asserting the overlap; both are bound to the MONDO terms their own dismech entries carry. Desmoplastic small round cell tumour is added on a source that names it beside neuroblastoma in the embryonal small round blue cell differential. The Infantile hepatic hemangioma row is rebound from MONDO:0002404 liver hemangioma to MONDO:0011191 capillary infantile hemangioma, the term the dismech Infantile_Hemangioma entry carries, so the row points at the entity; MONDO has no infantile-hepatic-specific term, so the localisation stays in the row name and preferred term, and the notes record that. Two rows the slate asked for are deliberately not written. Clear cell sarcoma of the kidney: no cached source names it as a differential of neuroblastoma - the closest found lists both tumours in one single-centre cohort, which is co-occurrence rather than a differential claim. Lymphoblastic lymphoma: the source names lymphoma generically, so a lymphoblastic-specific row would assert more than the quote supports. Both omissions are stated in the PR body.

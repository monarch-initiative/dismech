  summary: Add the CHK1/WEE1 replication-stress checkpoint dependency and adavosertib
  details: |
    Adds the replication-stress checkpoint as a dependency of neuroblastoma, and the WEE1 inhibitor tested against it. Before this the entry mentioned replication stress once, in passing, inside an explanation about ecDNA micronuclei; CHK1, CHEK1, WEE1 and adavosertib appeared nowhere.

    New pathophysiology node, Replication-Stress Checkpoint Dependence (CELLULAR, PROVISIONAL), binding CHEK1, WEE1 and CDK1, GO:0004672 protein kinase activity as the shared molecular function of the two checkpoint kinases, and GO:0000076 DNA replication checkpoint signaling INCREASED. Six evidence items. From the kinome screen (PMID:21289283): CHK1 was the most potent of thirty cytotoxic hits; CHK1 was constitutively phosphorylated at Ser345 and Ser296 in six of eight high-risk primary tumours and only one of eight low-risk ones, which is patient tissue rather than culture and is graded HUMAN_CLINICAL for that reason; CHK1 inhibition killed cells in S phase; and sensitivity tracked MYC(N) protein, with MYCN induction in retinal pigment epithelial cells sufficient to phosphorylate CHK1. From the ADVL1312 report (PMID:37081608), two introduction sentences give the general checkpoint biology and WEE1's role, both graded BACKGROUND and OTHER because they are textbook pathway description rather than evidence any cited study produced.

    PROVISIONAL rather than ESTABLISHED, and the contrast with the Aurora A node added alongside is deliberate. There the molecular mechanism has two independent laboratories, cocrystal structures and structure-activity work. Here the disease-specific dependency rests largely on one screen and its follow-up assays, and the clinical test has produced few responses, so the node says so.

    No causal edge was drawn from MYCN-Driven Proliferation into the node, although the evidence supports one. The node's notes record that and say the edge is left for a pass that can wire it without colliding with concurrent work on the MYCN node; the Aurora A PR inserts immediately after that node's block, so appending to its downstream list in a second branch would have been an add/add conflict of the kind that has already cost a rebase in this series.

    New treatment record, Adavosertib (WEE1 Inhibition), with a target_mechanisms link to the node and four evidence items from two trials. ADVL1312 gave three objective responses in twenty children, meeting its pre-set bar, and the record keeps the fact that those children had a median of three prior regimens and that 95% had already had irinotecan, because three responses reads differently with and without it. AcSe-ESMART Arm C gave an 11% overall response rate with two partial responses in neuroblastoma and a confidence interval including zero, and its haematologic toxicity is recorded as REFUTE against that combination specifically, with the explanation noting it does not bear against WEE1 inhibition as such, since the irinotecan combination had no dose-limiting toxicity.

    New OPEN_QUESTION discussion, question_nb_alt_status_and_wee1_inhibitor_benefit, attached to both new records and to the existing Alternative Lengthening of Telomeres node. Two of the three ADVL1312 responders had ALT tumours. The discussion records that as a question rather than a finding and says why: it is two patients, the trial analysed ALT but was not designed to test it as predictive, there is no comparison with non-ALT response rate, and the other adavosertib trial reports different candidate markers, finding benefit in seven of eight patients with homologous-recombination, replication-stress or RAS-pathway alterations. It names what would settle it.

    Errata were checked on all three cited papers before use; none has one. Term bindings: CHEK1 hgnc:1925, WEE1 hgnc:12761 and CDK1 hgnc:1722 were resolved from HGNC, adavosertib from CHEBI:91414, and GO:0004672 and GO:0000076 were confirmed as molecular function and biological process respectively before binding.

    Validation: just validate-disorders passed (651 snippets, 660 titles, 0 issues). Also clean: validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-case-collisions, check-reference-titles, check-coarse-phenotypes, check-delivery-system and check-gene-activity-grounding. Four derived cache rows were written by the validator and are committed with the entry.

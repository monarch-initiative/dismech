  summary: 'Edit: Neuroblastoma - split segmental chromosomal aberrations into per-lesion
    records; add chromothripsis'
  details: |
    Split the single combined 'Segmental Chromosomal Aberrations' genetic record into five: the umbrella record now carries the genome-wide profile claim only (segmental versus numerical copy-number pattern), and 1p36 deletion, 11q deletion, 17q gain and chromothripsis each get their own record with their own patient-level evidence. This follows the KB precedent of one record per lesion (Wilms_Tumor 1q gain and combined 1p/16q LOH; Chronic_Lymphocytic_Leukemia del(17p)/del(11q)/del(13q); Splenic_Marginal_Zone_Lymphoma del(7q)); the combined record could not be supported properly because each arm-specific quote spoke to only a third of its claim, which its own iPSC item had to disclaim in prose. All five are typed relationship_type BIOMARKER and variant_origin SOMATIC; the three arm records carry affected_regions with a plain cytoband string (1p36, 11q, 17q) and no gene_term, because each describes a chromosomal segment rather than a gene. The two pre-existing items were moved rather than rewritten: the INRG Task Force item (PMID:19047291) to the 11q record, which is the only one of the three that is part of a risk classifier, and the iPSC item (PMID:41560679) to the 17q record, with the two sentences of its explanation that referred to 1p/11q and to 'the INRG item above' dropped as no longer true of its new home. 35 evidence items added across the five records, from 17 references (15 newly fetched). Disagreement in the literature is recorded as separate REFUTE items rather than folded into notes prose: 1p36 LOH not independent in a bone-marrow-metastatic cohort (PMID:35137546), 11q status not discriminating outcome within stage 4 (PMID:16740759), no outcome difference for 17q gain in a 193-patient German FISH cohort (PMID:14581355), and 17q gain not retained in the INRG multivariate model once a segmental genomic type was included (PMID:22976801). Evidence leads came from a 15 Oct 2026 finder/verifier workflow run (wf_38e778c1-2e5), whose quotes were treated as leads only: every reference was re-fetched with just fetch-reference and all 35 snippets re-checked against the cache bodies before use. Validated with just validate (308/308 snippets, 317 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-gene-activity-grounding --against-ref origin/main, and validate-disorders. Checked that no pathophysiology or phenotype node shares a name with any of the five genetic records, since the pathograph node namespace is flat.

  details: |
    Literature pass over the treatment section, from 13 fetched references: 8 primary therapy studies and 5 guideline or consensus documents. 26 evidence items, two prose additions, one new clinical trial row, and 4 references pointers. No pathophysiology or phenotype content, which keeps the diff disjoint from the two mechanism and diagnosis passes in flight on the same entry.

    Where the items went, and why each row and not another:

    Surgical Resection gains the ANBL0532 surgical secondary analysis (PMID:42839317): the complete-versus-incomplete excision survival figures, the fact that complete excision did not cost more surgical complications, and - deliberately - the definition sentence, because complete excision there is the operating surgeon's call at a 90% volume threshold and the survival figures should not be read as margin-negative resection. All three explanations say that resection extent was not randomized in the trial, so these are within-cohort associations.

    Autologous Stem Cell Transplant gains the stratified resection-by-transplant result from the same paper, graded INDIRECT because the quoted comparison crosses both axes and does not isolate the transplant effect inside one resection group, plus the Latin American consensus statement that ASCT continues until randomized omission trials report, which records that question as open.

    Anti-GD2 Immunotherapy gains 13 items, covering three things the row did not carry. First, the relapse setting: dinutuximab beta after relapse improved OS against weighted historical controls (PMID:42908775), with the paired legacy-effect null from the same study - survival after relapse did not differ between patients who had first-line maintenance and controls who never had the antibody - which is what stops the first-line benefit being read as carrying past relapse. Second, the cytokine question the row already describes as unsettled: the Japanese randomization of dinutuximab with G-CSF and teceleukin against the ANBL0032 regimen (PMID:42490004), graded INDIRECT because 35 patients and a one-sided 70% interval cannot establish equivalence and because regimen A changed both cytokines and dropped isotretinoin at once. Third, the induction position: the ANBL17P1 feasibility and toxicity result (PMID:42976306) placed beside the consensus statement that early anti-GD2 is explicitly not recommended until controlled trials report, so the feasibility finding cannot be read as a change in standard of care.

    Two of the new items cited facts the row did not state, which is the defect the LT2 review round caught twice, so the prose was added first rather than the item hung on nothing. The description now records that the target is not fixed under treatment - GD2-positive tumour cells fell from 88% to 62% in re-sampled tissue in the TEMIRI series (PMID:42700735) - and the notes record the CD47 result (PMID:42945335) as a preclinical negative: an Fc-silent CD47 blocker raised macrophage phagocytosis in coculture but did not improve tumour control or survival in two immunocompetent chemoresistant mouse models. The in-vitro item is IN_VITRO and the in-vivo one MODEL_ORGANISM, split because they are different kinds of evidence from one paper.

    131I-MIBG Therapy gains the response figures (15% after one treatment, 21% for tandem, 35% for chemotherapy after single), the single-stem-cell-rescue engraftment result, and the myelosuppression framing sentence graded BACKGROUND with evidence_source HUMAN_CLINICAL, since the sentence states a clinical toxicity while opening a report that did not measure it.

    Isotretinoin (Retinoic Acid) gains the only direct comparison of dinutuximab beta with and without retinoic acid (PMID:42940006) together with the authors' own imprecision caveat, recorded as its own item because it is what stops the null being read as equivalence: effective sample sizes were about 10 and 15 against nominal 36 and 44, and the authors say the finding should not alone guide continuation or omission.

    clinical_trials: NCT00567567 is ANBL0532, so the resection paper is a second publication from a trial the entry already holds; its description now says so and it carries that paper as evidence. A new NCT00107289 row anchors the MIBG figures to the protocol that produced them. Its phase and status are copied from the registry API (PHASE_II, RECRUITING) rather than from the publication, which calls it a single-arm expanded access study treating patients between 2008 and 2020; the discrepancy is stated in the row's description and left visible rather than reconciled.

    Four of the five guideline documents are in references: as pointers with no evidence item. NCCN v2.2024 (PMID:39151455), the GPOH guidelines (PMID:40345224), the SFCE relapse recommendations (PMID:40713308) and the third NDDS consensus (PMID:40509548) have abstracts that describe the documents' scope and process without stating a claim about this disease's treatments, so any snippet from them would be a quote hung on a row it does not bear on. The Latin American anti-GD2 consensus (PMID:41435217) is the exception and carries four substantive statements, three of which are cited.

    The ALK fence held: no change touches Crizotinib, Lorlatinib or NCT03126916, and no ALK-inhibitor content enters the entry. The SFCE abstract mentions ALK inhibitors, which is one reason it stayed a references pointer.

    Validation: just validate-disorders clean (798 snippets, 819 titles, 0 issues; 772 before), all 26 snippets verified through the validator's own normalizer before insertion, check-snippet-grading clean, and the fifteen offline KB gates pass. The ten modified reference caches are whitespace-only normalisation from the validator's own fix pass, confirmed with git diff --ignore-all-space.

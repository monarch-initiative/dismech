  summary: 'Edit: Neuroblastoma - INPC histopathology for the stroma-poor category'
  details: |
    Replaces the histopathology item 'Neural Crest Tumor', which bound the entry's own disease concept NCIT:C3270 as a histological finding and repeated an origin claim already made by the pathophysiology node Neural Crest Developmental Arrest, with seven items for the Schwannian stroma-poor category of the International Neuroblastoma Pathology Classification (INPC): the stroma-poor histology itself (unbound; the NCIT searches behind that are recorded in its notes), the undifferentiated, poorly differentiated and differentiating subtypes (NCIT:C42046, NCIT:C42047, NCIT:C42048, with frequency bands from 4,680 tumours reviewed at the COG Neuroblastoma Pathology Reference Laboratory, 2001-2012), the mitosis-karyorrhexis index, and INPC favourable and unfavourable histology (both unbound; the NCIT Shimada terms sit outside the HistopathologyFindingTerm enum and encode the original criteria). The ganglioneuroblastoma and ganglioneuroma categories appear only as framework context, for the planned separate entry. Adds 24 evidence items from 9 PMIDs: 10421272, 10421273, 11745206, 11745303, 25207821, 32315273, 35053227, 41294259, 41612478. PMID:10985139, cited on the removed item, stays cited under Abdominal Mass. Evidence was gathered and checked with a planning, finding and three-lens verification workflow (exact quote, claim support, grading). Validation: just validate, validate-terms, count-verified-snippets --strict (75/75), duplicate-key, entity-ref, causal-target, qualifier-term, block-scalar and enum checks, the whole-KB snippet and title ratchets, check-gene-activity-grounding --against-ref origin/main, node-class verification, and validate-disorders (75 snippets, 83 titles, 0 issues). Part of the neuroblastoma PR series tracked in issue 14976.

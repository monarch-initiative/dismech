  summary: 'Edit: Neuroblastoma, five more differential diagnoses (mimics and same-name
    tumors)'
  details: |
    Adds five differential_diagnoses rows, appended after the existing thirteen; no other section changed.

    Embryonal rhabdomyosarcoma (MONDO:0009993) mirrors the reverse Neuroblastoma row in the Embryonal_Rhabdomyosarcoma entry: the same description, distinguishing features and four evidence items (PMID:38406807, 7495304, 25822764, 28640941), copied with identical snippets and grading.

    Adrenocortical tumors (MONDO:0036591 adrenal cortex neoplasm, which covers adenoma and carcinoma as the source does) rests on the GPOH-MET registry report (PMID:35784570, full text cached): ten children and adolescents with adrenocortical tumors first mistaken for neuroblastoma, two of them carcinomas that progressed fatally, only two of nine with overt steroid excess, none with urinary steroid metabolome analysis, and six diagnosed only by reference pathology. Four items, one graded BACKGROUND for the abstract's framing sentences.

    CIC-rearranged sarcoma (MONDO:0956989) rests on the PHOX2B series PMID:28640941, whose conclusion names CIC-rearranged round cell sarcoma among the mimics PHOX2B distinguishes from neuroblastoma (the same snippet and grading the entry's other three small-round-cell rows use), and on the ETV4 marker study PMID:27562494, graded INDIRECT because neuroblastoma was not among its comparison tumors.

    Olfactory neuroblastoma (MONDO:0006329) and CNS neuroblastoma, FOXR2-activated (MONDO:0859597) turn the scope note's same-name exclusions into differential rows, mirroring each entry's reverse row (PMID:36841178, 37909011; PMID:34110923) and adding a site sentence from the olfactory review, PHOX2B negativity of olfactory neuroblastoma from PMID:28640941, the methylation-defined derivation and FOXR2 rearrangement sentences from PMID:26919435, and the unfavorable-outcome sentence for FOXR2-expressing peripheral tumors from PMID:34110923. Copied snippets keep the grading they carry in the source entries.

    Not added: sarcoma with BCOR genetic alterations and round cell sarcoma with EWSR1-non-ETS fusion, both on the plan's list. PubMed searches on 2026-11-05 (BCOR[tiab] AND neuroblastoma[tiab] AND sarcoma[tiab], 9 hits; NFATC2, PATZ1 or non-ETS with neuroblastoma in title/abstract, 5 hits, and in any field, 7 hits; round cell sarcoma with neuroblastoma and BCOR or CIC, 6 hits; BCOR with infancy and neuroblastoma, 3 hits; CCNB3 or BCOR-ITD with neuroblastoma, 7 hits) found no source placing either in neuroblastoma's differential. The closest were a series of 41 Ewing-like tumors whose reclassification included two neuroblastomas, three BCOR-altered sarcomas and one possible EWSR1-NFATC2 tumor (PMID:29661713), which shows overlap with Ewing sarcoma rather than with neuroblastoma, and a case of primitive myxoid mesenchymal tumor of infancy with a BCOR internal tandem duplication misdiagnosed as neuroblastoma (PMID:39011617), a tumor the BCOR entry deliberately keeps outside its scope.

    Review round 1 (an optional suggestion on #16623): the entry-level notes, which list olfactory and CNS FOXR2-activated neuroblastoma among the tumours the MONDO and NCIT classes contain but the entry does not cover, now add that each has its own entry and a differential_diagnoses row. The rebase onto main for the ruff fix (#16622) changed nothing else.

    Validation: 741 of 741 snippets verify; validate-terms passes, including the new MONDO:0036591 binding; check-snippet-grading finds no new divergence, within the file or across files.

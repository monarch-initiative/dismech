  summary: 'Edit: Neuroblastoma, type MYCN amplification, TERT rearrangement and ATRX
    alteration as somatic drivers'
  details: |
    Three genetic records had no relationship_type. Each is now SOMATIC_DRIVER with variant_origin SOMATIC, and each gains one evidence item for the driver role, because the items already on the records spoke to frequency, stage and prognosis rather than to causation.

    MYCN Amplification: new reference PMID:9214616 (transgenic mice overexpressing MYCN in neuroectodermal cells develop neuroblastoma), MODEL_ORGANISM, PRIMARY_RESULT, INDIRECT, because a transgene is not a somatic amplification. The abstract's other sentence, on chromosomal gains and losses in the mouse tumours, was deliberately not quoted. TERT Rearrangement: the PMID:26466568 sentence that all the rearrangements induced massive TERT upregulation, copied from the Telomerase Activation node with the same evidence_source; directness is INDIRECT here, against DIRECT on the node, because the claim on this record is the driver role rather than the activation itself. ATRX Mutation: the PMID:25487495 sentence that ALT was caused by ATRX or DAXX alterations, copied from the Reduced ATRX/DAXX Complex Abundance edge with the same grading.

    Left untyped on purpose. ALK Mutations holds twelve items, about half on germline familial predisposition and half on somatic driver mutations, so one relationship_type would misfile half of it; separating the germline claim depends on how this entry should link to the predisposition entries, which is the open question in #14976. PHOX2B is typed, with its germline origin, in a pending branch for the germline records that waits on the same question, so typing it here would duplicate and conflict with that change.

    Checked and found not to need a change. The four phenotypes without frequency (anemia, thrombocytopenia, hepatomegaly, subcutaneous nodules) have no all-neuroblastoma frequency in their cited series: the anemia figure comes from a series that mixes neuroblastomas and ganglioneuroblastomas, as its own explanation records, and hepatomegaly and subcutaneous nodules are stage MS features whose figures are given within stage MS, which no phenotype slot can scope to. The seven references without tags are journal articles, and the reference tag enum has only GeneReviews and StatPearls. MIBG-Nonavid Disease already records the OLS NCIT and HP searches that found no term. The unbound INPC histology findings already carry notes on why.

    Validation: validate-disorders passes; 726 of 726 snippets verified; the C4 gate set including the kb pytest lane passes, as do check-cache-order, validate-terms, check-reference-titles-present, check-gene-validity and check-logical-rules.

  summary: 'Edit: Neuroblastoma — evidence for four unquoted figures, retired PARTIAL
    prose, ALK/MYCN HGNC bindings'
  details: |
    Evidence repairs in an existing entry: four figures that were stated without a quote, two explanations that still argued for the retired PARTIAL grade, quote_role and grading of six background citations, two prose claims next to the rewritten text, and HGNC bindings for ALK and MYCN. No new mechanisms, phenotypes or treatments.

    Figures:
    - MYCN amplification "approximately 20%": kept. Sourced to the Children's Oncology Group biology-study cohort (PMID:28696504: 845 of 4,672 patients, 18.1%; 133 more with MYCN gain) and two review statements (PMID:25345447; PMID:22936790 on the MYCN-amplified subtype). The unsourced "historical series enriched for advanced-stage disease" was replaced by the stage split in the 1984 Brodeur abstract (PMID:6719137: 0 of 15 stage 1-2 vs 24 of 48 stage 3-4).
    - ALK point mutations "8-10%": kept, without "sporadic" (the 8% cohort counts germline carriers). Sourced to PMID:25517749 (8% of 1,596 diagnostic samples) and PMID:26059187 (10% at diagnosis with hotspot deep sequencing, more than half subclonal). The unsourced "F1174L and R1275Q are the most common mutations" was replaced by the per-residue counts in PMID:25517749 (R1275 43%, F1174 30%, F1245 12%) and the germline statement in PMID:28674118 (R1275Q most frequent).
    - Germline ALK in familial neuroblastoma "75-80%": restated as the range of published estimates, about 50% to 80%: more than 50% from the group that mapped ALK (PMID:21734404), 50% (PMID:25345447), 75% (PMID:29589100) and 80% (PMID:38791942). The 75% and 80% statements are in cached full texts, not abstracts. The PMID:18724359 explanation that argued "majority (not ~50%)" was rewritten. The combined ALK+PHOX2B clause cites PMID:28674118.
    - Urinary VMA/HVA ">90%": softened. Diagnostic series give 84% (PMID:28061374) and 82.2% (PMID:31724812) for the pair, 95% with an eight-metabolite panel; >90% and 92% are review statements (PMID:15235064, PMID:8790511), and a relapse-selected cohort found 92% at diagnosis (PMID:12932669, which also supports the added caveat that markers alone do not reliably detect relapse). First evidence block for this marker.

    Grading: the six PMID:41560679 items now carry quote_role (five introduction sentences BACKGROUND, the 17q result PRIMARY_RESULT). The five background items were regraded MODEL_ORGANISM -> HUMAN_CLINICAL because the quoted sentences describe the human disease, per the CLAUDE.md quote_role guidance (#10262); the 17q result stays MODEL_ORGANISM. directness: INDIRECT on the two former PARTIAL items, with explanations giving the inference step.

    Other: PHOX2B notes corrected (it was the first neuroblastoma predisposition gene identified, not the second after ALK; PMID:29589100). genetic[ALK Mutations].gene_term hgnc:427 and genetic[MYCN Amplification].gene_term hgnc:7559 (cached; HGNC REST confirmed). Node-level genes: wiring is left for a later change, because it also needs molecular_functions (check-gene-activity-grounding).

    Method: candidate quotes came from literature-search agents (PubMed E-utilities, two search angles per figure) and were checked by independent verifier agents for exact match, support for the claim, and grading; the curator selected from the verified set, and a three-lens red-team review of the diff preceded the commit. No deep-research report was generated; research/Neuroblastoma-deep-research-falcon.md predates this change and was not used.

    Validation: just validate-disorders (52/52 snippets, 60 titles, 0 issues); count-verified-snippets --strict 52/52; offline gates pass (duplicate keys, entity refs, causal targets, qualifier terms, block-scalar comments, enum values, folded hyphens, snippet length, title snippets, snippet grading, retired-support prose, reference titles, environmental evidence, gene-activity grounding against origin/main); list-gene-term-mismatches 7/7 named, 0 mismatches.

  summary: 'Edit: Neuroblastoma, anchor the ALT node and drop a weak edge item'
  details: |
    Two changes on the Alternative Lengthening of Telomeres node. It gains conforms_to enabling_replicative_immortality#Telomere Maintenance via Recombination, the module node #13924 added for the recombination route. #15105, which added this node, left it unanchored until that module node existed, because the telomerase node would claim a mechanism ALT tumours do not use. The node already binds GO:0000722, and its edge reaches Unlimited Replicative Potential, which conforms to the module's Replicative Immortality node, so check-conformance-content reports no finding. Second, the PMID:40638875 item is removed from the edge to Unlimited Replicative Potential, as the #15105 review suggested: it quoted an introduction sentence about telomere maintenance mechanisms as a class (BACKGROUND, INDIRECT). The edge keeps the PMID:24792489 item, which names ALT and unlimited proliferation together, and the PMID:32291317 cell-line result. PMID:40638875 stays cited on the Telomerase Activation node. Validation: validate-disorders, the C4 gate set including the kb pytest lane, validate-terms, check-logical-rules, check-cache-order and check-name-collisions pass, and validate-module-batch passes for the module.

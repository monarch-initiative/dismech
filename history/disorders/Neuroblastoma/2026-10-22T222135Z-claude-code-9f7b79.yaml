  summary: 'Edit: Neuroblastoma - MYC-family activation: extrachromosomal MYCN amplicon
    architecture and the c-MYC subset'
  details: |
    Adds MYC-family activation to Neuroblastoma as part of the neuroblastoma curation project (#14976, slate item MYC-family).

    Pathophysiology (after the 'MYCN-Driven Proliferation' block): 'Extrachromosomal MYCN Amplicon Architecture' (MOLECULAR; GO:0005727 extrachromosomal circular DNA; Helmsauer 2020 PMID:33199677: copies commonly on ecDNA, two amplicon classes, more than 90% co-amplification of a 290 kb downstream region and e4 in 90% of a 240-tumour meta-dataset, and the tested null that the two classes did not differ prognostically; Koche 2020 PMID:31844324: circle-derived rearrangements associated with adverse outcome), with edges to 'MYCN-Driven Proliferation' (INDIRECT_KNOWN_INTERMEDIATES, MYCN overexpression named) and to 'ecDNA Oncogene Dosage Heterogeneity' (CELLULAR, PROVISIONAL; Montuori 2025 PMID:40773595 and Bruckner 2026 PMID:42864499, split by evidence_source; the two clinical arms point in opposite directions). 'c-MYC Activation by Enhancer Hijacking or Enhancer Amplification' (MOLECULAR, PROVISIONAL; Zimmerman 2018 PMID:29284669, with the zebrafish transgenic as a separate MODEL_ORGANISM item; Wang 2015 PMID:26035700 for the protein-level 11%) carries no downstream edge on purpose: the cited work does not connect MYC activation to any mechanism node in the entry, and routing it into 'MYCN-Driven Proliferation' would assert a MYCN-driven mechanism.

    Genetic: new 'MYC Activation' record (hgnc:7553; SOMATIC_DRIVER; affected region: distal enhancer region downstream of MYC, 8q24), placed after 'MYCN Amplification'.

    The planning notes asked for no cohort number for Koche 2020 and no patient number for Bruckner 2026, because the fact-checkers could not read them; both papers' full texts are now cached, and the explanations give the figures (93 tumours; 86 of 387 children) from those texts. Not done: no cancer-origin marking (no genetic_context), no ecDNA sentence on the existing 'MYCN Amplification' record, no telomere edges or TERT enhancer-hijacking claim, no treatments, discussions or trials, no conforms_to. New caches: six PMIDs; new term rows for GO:0005727. Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates.

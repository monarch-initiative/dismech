  summary: 'Edit: Neuroblastoma - split ALK Inhibitor Therapy into Crizotinib and
    Lorlatinib with clinical and preclinical evidence'
  details: |
    Split the single 'ALK Inhibitor Therapy' treatment row into two records, 'Crizotinib' and 'Lorlatinib', and gave each its own clinical and preclinical evidence. The row previously carried no treatment-level evidence at all; its only evidence item was an ALK mRNA knockdown experiment on the target_mechanisms link, which is a genetic manipulation rather than a drug effect and is now marked directness INDIRECT for that reason. The split is required by the evidence rather than cosmetic: the two drugs have opposite clinical stories in this disease, so a combined record would have to carry supporting and contradicting items for one claim under two therapeutic_agents, and an evidence item can only carry one drug's claim. kb/disorders/ALK_Rearranged_NSCLC.yaml already keeps separate Crizotinib and Lorlatinib records. 26 evidence items from 14 references (13 newly fetched). Crizotinib: ADVL0912 objective response rate 15% of 20 children, all three responders carrying R1275Q, with F1174L/F1174V progression recorded as a REFUTE item, plus an independent adult null series and the ACCELERATE/EMA strategy-forum conclusion; its target_mechanisms link carries the variant-dependence of target engagement in cell lines and xenografts and the ATP-affinity mechanism that explains it. Lorlatinib: NANT phase 1 response rates, activity across all three hotspots including ALK-inhibitor-pretreated patients, a 69% adult series, a French registry at 33% in which none of the eight MYCN-amplified patients responded, durable responses in a Swedish national cohort, and the frontline Children's Oncology Group phase 3 substitution; its target_mechanisms link carries the two preclinical papers that use lorlatinib's development code PF-06463922, which the explanations state explicitly. Central-nervous-system penetration is recorded with its own limit: the design rationale and a CSF-to-unbound-plasma measurement from non-small-cell lung cancer, paired with a NO_EVIDENCE item quoting the neuroblastoma trial's statement that intracranial activity could not be assessed because no patient with CNS metastases enrolled. Also corrected an overstatement in the ALK Mutations genetic record notes, which said lorlatinib was in 'current frontline cooperative-group trials' (plural) where there is one such trial; the evidence for the corrected wording sits in the new Lorlatinib record. Deliberately did not create the top-level clinical_trials: section, although the modelling analysis recommended it: that section has a designated creator PR in the project slate, so the frontline claim is sourced to two peer-reviewed sentences naming the trial instead of to a registry record. Treatment terms use NCIT:C93352 Targeted Therapy, matching the ALK_Rearranged_NSCLC sibling entry; both it and the two CHEBI agent terms were confirmed present in cache/ncit/terms.csv and the relevant enum caches rather than written from memory. Evidence leads came from a 15 Oct 2026 finder/verifier workflow run (wf_ff507998-859) and were treated as leads only: every reference was re-fetched with just fetch-reference and all 26 snippets re-checked against the cache bodies before use. Validated with just validate (297/297 snippets, 306 titles, 0 issues), count-verified-snippets --strict, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-snippet-grading and check-title-snippets (both --against-ref origin/main), check-gene-activity-grounding --against-ref origin/main, and validate-disorders.

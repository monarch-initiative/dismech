  summary: Conform the ALK node to the proliferative-signalling module; regrade five
    INPC restatements
  details: |
    Finishes by hand the Ph2b-1 draft that a safety-classifier stop left unreviewed in the new-PR session's worktree on 24 October. That session recorded it as held with an open question: finish it, re-scope it, or drop it. The decision here is to finish it whole, because every claim in it re-verifies.

    The draft was planning-stage content written by a run whose compose step was stopped, so nothing in it was taken on trust. It was lifted out as a patch without touching the holding worktree, applied to current main, which it still fits cleanly 209 commits later, and checked claim by claim.

    Two parts.

    First, the ALK Signaling Activation node gains biological_scale: MOLECULAR and conforms_to sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion, and its biological process moves from GO:0000165 MAPK cascade to GO:0007169 cell surface receptor protein tyrosine kinase signaling pathway. The module node checks out: it describes activating mutation or amplification of a receptor tyrosine kinase as a route to growth-signal autonomy, names ALK in its own list of such kinases, and binds GO:0007169 with modifier INCREASED, so the substituted term is the module's own. Dropping the MAPK cascade binding does not lose the pathway, because this entry's RAS-MAPK Pathway Hyperactivation node already conforms to the module's Constitutive Mitogenic Pathway Activation and binds GO:0007265 Ras protein signal transduction and GO:0070371 ERK1 and ERK2 cascade; both were confirmed present on current main before the term was moved.

    The node's new notes assert two negative-existence claims, which are the ones no gate can reach, so both were re-run against OLS on 27 October rather than trusted: a GO search for "anaplastic lymphoma kinase" returns numFound 0, and none of the 75 hierarchical descendants OLS lists for GO:0007169 is ALK-specific. Both hold.

    Second, five evidence items that restate International Neuroblastoma Pathology Classification criteria move from evidence_source HUMAN_CLINICAL to OTHER, four citing PMID:41612478 and one PMID:35053227, with their explanations saying why. This was the part that needed a judgement rather than a check, and three things decided it. The same review is already graded OTHER on eleven items and HUMAN_CLINICAL on only four across Neuroblastoma and Ganglioneuroblastoma, every one of the fifteen carrying quote_role REVIEW_SYNTHESIS, so the regrading brings a minority into line rather than inventing a convention. None of the five regraded sentences appears anywhere outside this entry, checked across all 4,346 other kb files, so the change creates no cross-file divergence; the consistency argument rests on the same review being graded OTHER throughout Ganglioneuroblastoma rather than on a shared sentence. An earlier draft of this record claimed a shared sentence, conflating the five regraded items with a sixth PMID:41612478 item that is shared with Ganglioneuroblastoma and was already OTHER before this change. And the split the draft drew is principled: the PMID:35053227 item it regraded quotes the MKI class boundaries, a classification rule with no patient data, while the PMID:35053227 item it left as HUMAN_CLINICAL quotes 5-year event-free and overall survival figures for the favorable and unfavorable histology groups, which is patient data. Leaving that second item alone is correct, not an oversight.

    Nothing else from the draft was carried. It arrived with five cache CSVs and eight reference caches rewritten by validators and three untracked reference caches, PMID_22203052, PMID_25251827 and PMID_26687816, that nothing cites; working from the YAML patch alone on a branch cut from current main left all of that behind. The run's compose step stopped immediately after reading PMID:26687816 and the draft never cited it, so no claim here depends on it. No new reference is cited by this change at all, which is why the snippet count is unchanged.

    Validation: just validate-disorders passed (640 snippets, 649 titles, 0 issues). Also clean: validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-folded-hyphens, check-folded-yaml, check-case-collisions, check-coarse-phenotypes, check-reference-titles and check-gene-activity-grounding.

  details: |
    Review round 1 on PR #15369. The blocking finding was right, and chasing one of the suggestions turned up a larger error in my own premise.

    Blocking: none of the eight new evidence items carried a reference_title. The repository convention is a title on every new evidence item, and this entry had 482 items with 474 titles, the eight gaps being exactly the ones added here. Titles are now on all of them, read from the title: frontmatter of each references_cache/clinicaltrials_NCT*.md rather than copied from the review comment, as the citation-string rule requires. My independent read matched the reviewer's list, including that NCT03794349's frontmatter title is double-quoted so the value is the inner string. check-reference-titles passes and the reference validator now checks 492 titles with 0 issues.

    The seventh trial. The reviewer asked why NCT03126916 was excluded, noting that "an earlier decision" is not findable by a reader of the entry and that the next curator would add the trial back. Checking the actual decision showed the exclusion rested on a mistake of mine. A session note said never to curate that trial. PR #15222, which split the ALK inhibitor records, says the opposite in its own body: it declined to create a clinical_trials: section because that section had a designated creator PR, and because trial phase and status "go stale and belong in a block the status audit can see; adding them here would put them where clinicaltrials-status-audit never looks". That is an argument for curating the trial here, not against it. The note inverted it.

    So NCT03126916 is now the seventh record: PHASE_III, RECRUITING, verified against the registry like the others. It is a good addition rather than a grudging one, because it anchors two already-merged records at once. The trial adds either 131I-MIBG or lorlatinib to intensive frontline therapy, so it bears on both the 131I-MIBG Therapy record and the Lorlatinib record. The two arms are not two halves of one randomization: the registered objectives put the 131I-MIBG question in a randomized trial, while the lorlatinib arm is compared against a contemporaneous non-ALK cohort and a historical ANBL0532 control, so that arm has no randomized comparator. The trial record's notes say so, because a reader would otherwise take the frontline lorlatinib claim to rest on a randomized comparison, whose frontline claim had been sourced only to two publications that name the trial in passing. It is recruiting, so the record claims no result.

    The NCT01704716 description is narrowed. It had said the R1 randomization "compared busulfan-melphalan with carboplatin, etoposide and melphalan". The cached registry text says only that consolidation is "BuMel MAT based on the results of the R1 randomization" and never names the comparator, so the description asserted more than its evidence item supports. The reviewer suggested pointing at the Ladenstein paper if it were already cited on the transplant record. It is not cited on this branch: PMID:28259608 appears zero times here and its cache is not present, because that citation lives on the separate transplant PR, which is unmerged. Pointing at it would have been a forward reference to work not in this branch, so the description now states only what the registry says and records that the comparison belongs where the comparison is made.

    The evidence count in the history record was wrong. It said eleven; the section had eight, and now has nine. Corrected in the record rather than only in the PR body, as the reviewer asked. The record is unmerged, so this is fixing a draft rather than rewriting committed history.

    Validation after the round: just validate passes with 0 issues over 492 titles, 483/483 snippets verify, and just clinicaltrials-status-audit reports 0 drifted and 0 other findings across all seven trials. check-reference-titles, check-duplicate-keys, check-entity-refs, check-enum-values, check-block-scalar-comments, check-title-snippets, check-snippet-length, check-snippet-grading, check-retired-support-prose, check-folded-hyphens, check-folded-yaml and check-case-collisions are all clean.

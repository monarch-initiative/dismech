  summary: Wire the clinical phenotypes to their mechanisms
  details: |
    Added three pathophysiology nodes and fourteen causal edges so that the entry's clinical phenotypes are explained by a mechanism rather than rendering as a disconnected island beside the pathograph. Phenotype causal_inlink coverage for this entry goes from 1/16 to 14/16.

    Primary Tumor Growth and Local Mass Effect (TISSUE) carries the site distribution of the primary tumour and the local signs that follow from it, with edges to Abdominal Mass, Abdominal Distension, Abdominal Pain, Horner Syndrome, Spinal Cord Compression, Hypertension and Metastatic Dissemination. Metastatic Dissemination (ORGANISM, conforming to the Metastatic Colonization node of the invasion_and_metastasis module) carries the metastatic site frequencies and edges to Bone Pain, Proptosis, Anemia, Thrombocytopenia, Hepatomegaly and Subcutaneous Nodules. Vasoactive Intestinal Peptide Hypersecretion (CELLULAR) carries the VIP watery-diarrhoea syndrome and its edge to Diarrhea.

    Three edges are deliberately recorded as contested rather than asserted, each carrying both SUPPORT and REFUTE items quoting the sentence that cuts each way. Hypertension: renal artery or parenchymal compression with a renin-mediated rise is the usual attribution (PMID:36531507, PMID:34612613), but the GICOP registry survey could not demonstrate a correlation between hypertension and renal pedicle compression (PMID:28711167) and renin was normal in all four children in whom it was measured in a single-centre series (PMID:34612613). Anemia: associated with marrow infiltration above 10% malignant cells in one series (PMID:28801367), but two series found anemia common with and without infiltration and attributed it to iron or nutritional deficiency (PMID:37323595, PMID:25548446). Thrombocytopenia: associated with infiltration in two series (PMID:28801367, PMID:37323595) and no more frequent with marrow involvement than without in a third (PMID:25548446).

    Fever and Weight Loss are left unconnected on purpose. No cited source attributes either to a mechanism this entry models, and an edge added to clear a connectivity report is worse than no edge.

    Two phenotype descriptions were corrected while wiring them: Hepatomegaly and Subcutaneous Nodules described the metastatic pattern as INSS stage 4S, where the cited sources and the INRGSS stage MS definition differ in the age limit (12 versus 18 months). Both now name INRGSS stage MS and say which cohort the cited series studied.

    The VIP node's notes record the GO and NCIT searches behind its bindings, and every claim in that note was re-run before commit: four OLS4 GO searches return only VIP receptor binding and receptor activity terms plus cross-ontology hits, none of the 16 direct children of GO:0030072 peptide hormone secretion is VIP secretion, and NCIT:C21442 Vasoactive Intestinal Peptide has NCIT:C1746 Peptide Hormone among its ancestors but not NCIT:C1909 Pharmacologic Substance, so it is outside the root the chemical-entity binding admits for NCIT. All 18 reference_title strings were compared against their references_cache frontmatter.

    Validation: just validate-disorders passed (511 snippets, 520 titles, 0 issues); validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-block-scalar-comments, check-folded-hyphens, check-folded-yaml, check-case-collisions, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-coarse-phenotypes, check-shared-disease-terms, check-environmental-evidence and check-gene-activity-grounding all clean. Seven reference caches fetched as screening leads during drafting were cited nowhere in kb/ or research/ and were pruned.

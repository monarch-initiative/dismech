  summary: Deepen TAPVR curation with developmental genetics, hemodynamic cascades, diagnosis, and differential
    diagnosis.
  details: Added Harrison's chapter classifications, inheritance modes (sporadic, autosomal dominant,
    autosomal recessive), birth prevalence, clinical progression phases, upstream developmental/laterality
    mechanisms (TBX5/TBX20, KDR/VEGFR2, MMP21), explicit hemodynamic intermediates (obligatory interatrial
    right-to-left shunting, right-heart volume overload, pulmonary venous obstruction), expanded phenotypes,
    genetic entries (TBX20, KDR, MMP21), diagnostic modalities (echocardiography, Doppler echocardiography,
    CT angiography, MR angiography), and differential diagnoses (PPHN, d-TGA, Tetralogy of Fallot, ASD).

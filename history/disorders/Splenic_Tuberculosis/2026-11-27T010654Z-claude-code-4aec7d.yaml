  summary: 'Create: Splenic_Tuberculosis'
  details: |
    Created a new entry for isolated or predominantly splenic tuberculosis (MONDO:0005967). Scope follows Hepatic_Tuberculosis and Miliary_Tuberculosis: the splenic part of miliary disease and hepatosplenic disease with liver involvement are left to those entries, and the boundary is recorded in notes. M. tuberculosis and M. bovis are lumped (review_notes waiver); micronodular, macronodular and abscess forms are subtypes. Nine pathophysiology nodes from hematogenous or contiguous seeding through granuloma (conforms to granuloma_formation), necrosis, abscess, splenomegaly, perisinusoidal fibrosis/hypersplenism, paradoxical reaction and rupture; 24 phenotypes; diagnosis rows for ultrasound, CT, CEUS, FNA, core biopsy, AFB staining, NAAT, culture, splenectomy histopathology and the systematic review's isolated-splenic-TB criteria; treatments for antituberculous chemotherapy, percutaneous drainage and splenectomy with sourced caveats. Sources are mainly case reports and small series plus one 2026 systematic review (PMID:41958487). Leads came from PubMed searches and research/Splenic_Tuberculosis-deep-research-claude_code.md (first attempt succeeded); every snippet was re-verified against the cache (154/154).

  details: |
    Review round 1 on PR 19132. Replaced the three progression phases sourced from a basic-science T3SS study introduction (catarrhal, paroxysmal, pneumonic; evidence_source OTHER) with the conventional catarrhal, paroxysmal and convalescent stages, each quoted from the abstract of the Kline et al. 2013 Am Fam Physician clinical review (PMID:24364571), graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS. Pneumonia is left as the existing Pertussis Pneumonia phenotype rather than a stage. Kilgore 2016 (PMID:27029594) was considered but its cache is abstract-only and a forced re-fetch returned no full text, so it carries no stage sentences. No durations recorded: the abstract states none.

  summary: Augment Pertussis from Falcon deep research
  details: |
    Integrated verified Falcon Edison Scientific findings. NEC preflight PASS: report unambiguously pertussis/whooping cough, B. pertussis, pertussis+adenylate-cyclase+tracheal cytotoxins, DTaP/Tdap, macrolides. Falcon cited only review DOIs, so every claim was re-anchored to real fetch-reference cached abstracts with snippets independently verified as exact whitespace-normalized substrings. Pathophysiology: added Melvin 2014 PMID:24608338 virulence-factor battery and Caulfield 2023 DOI:10.3389/fimmu.2023.1126107 ciliated-epithelium adherence to the colonization node; added new Adenylate Cyclase Toxin-Mediated Phagocyte Subversion effector node with Caulfield ACT pore-forming mechanism; added new Type III Secretion System-Mediated Immune Evasion node with First 2023 DOI:10.3389/fcimb.2023.1111502 VIP/VPAC2 manipulation and VPAC2-antagonist therapy, MODEL_ORGANISM. Phenotypes: Ernst 2022 DOI:10.3390/toxins14030187 leukocytosis-life-threatening on Leukocytosis. Treatments: Ernst antibiotics-only-if-early on azithromycin; new investigational Pertussis Toxin Inhibitors targeting PT node; new Maternal Tdap Vaccination with Regan 2023 DOI:10.1542/peds.2023-062664 cohort VE. Prevalence: 16M cases/195k deaths 2008 Kilgore 2016 PMID:27029594 plus Chamorro 2023 DOI:10.1128/cmr.00164-22 human-restricted increasing worldwide. Clinical trials: BPZE1 NCT05461131 and PRN-deficient CHIM NCT06827470. Dropped Falcon MAXO:0000260 hallucinated maternal-vaccination label and used MAXO:0001017 vaccination. Wang 2025 and Colak 2023 abstracts content-unavailable so not quoted. Schema/references/terms validations all pass.

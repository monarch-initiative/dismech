  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added three diagnosis rows (the entry had none): Bordetella pertussis PCR bound to LOINC:105875-9 (method-less DNA presence), culture bound to LOINC:549-6 (organism-specific culture, unspecified specimen), and anti-pertussis toxin IgG bound to LOINC:23831-1 (method-less quantitative serum code). All evidence is from the EU Pertstrain reference-laboratory recommendations, PMID:21069406. No anti-PT band was recorded: that source recommends a single or dual single-serum cut-off somewhere between 50 and 120 IU/ml rather than one value, lists different programme cut-offs in its Table 2, and gives an ROC-optimal range of 60 to 75 IU/ml, so any single band would assert a choice the source leaves to each country. The paired-serum criterion (at least 100 percent rise or 50 percent fall) is a ratio between two results and sits in the row description. PubMed searches for another consensus stating a single value found none.

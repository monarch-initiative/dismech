  summary: 'Create: Dystonia_24'
  details: |
    New entry for dystonia 24 (MONDO:0014019), the autosomal dominant dystonia
    caused by heterozygous ANO3 (hgnc:14004) variants, replacing the stub
    stubs/Dystonia_24.yaml.

    Content: autosomal dominant and incomplete-penetrance inheritance blocks;
    a five-node pathophysiology chain from heterozygous ANO3 variants through
    altered calcium-activated scramblase function, impaired ER calcium release
    and store-operated calcium entry, and impaired KCa3.1 activation to
    inferred striatal neuronal hyperexcitability, which is wired to the
    movement phenotypes with uncited edges because that step is not
    demonstrated; 29 phenotypes, with frequency bands only where a cohort
    figure exists (Stamelou 2014 original families, a 2026 Chinese cohort of
    16 carriers); the ANO3 genetic record typed CAUSATIVE with REFUTE items
    for the rare-variants-in-controls literature; botulinum toxin, oral
    pharmacotherapy (trihexyphenidyl) and deep brain stimulation; four
    differentials (essential tremor, DYT6, myoclonus-dystonia, sporadic
    cervical dystonia); two KNOWLEDGE_GAP discussions (direction of variant
    effect and whether ANO3 conducts ions; absence of a neuronal or animal
    model of the dystonia).

    Cervical_Dystonia already lists ANO3 as SUSCEPTIBILITY. That record was
    left unchanged and is cross-referenced from this entry's description,
    genetic notes and differential diagnoses. No kb/modules/ module covers
    dystonia or basal ganglia motor network dysfunction, so no node declares
    conforms_to. The GeneReviews Monogenic Isolated Dystonia Overview
    (PMID:20301334) is tagged in references; its cached abstract does not
    name ANO3, so it is not used as evidence. No ClinGen gene-disease
    validity record exists for ANO3 in the ClinGen download retrieved on
    2026-10-08, so no gene_disease_validity assertion was recorded.

    Deep research: one OpenScientist report
    (research/Dystonia_24-deep-research-openscientist.md). Its reference
    validation block: 32/32 references resolved, 0 not found, 0 off topic,
    21 on topic (11 undecided), no quote check recorded. Its term validation
    block set needs_review: 6 of 11 named terms mislabelled (NCIT:C66099,
    NCIT:C1005, NCIT:C38013, NCIT:C15682 and HP:0032122 name unrelated
    concepts) and GO:0016021 is obsolete. None of those CURIEs was used;
    every binding in the entry was read from the term caches or OLS.
    just preflight-dr returned PASS (ANO3 mentioned 63 times, OMIM 615034).
    The entry was drafted first from PubMed literature found independently,
    then extended from the report: Suzuki 2013 (PMID:23532839, TMEM16C
    scramblase), trihexyphenidyl response (PMID:41441972), truncal dystonia
    (PMID:39692086), and the review statement that ANO3 is an uncommon
    cause of adult cervical dystonia (PMID:24978640). Not used from the
    report: its gnomAD-constraint argument that variants act by dominant-
    negative or gain of function (the report's own computation, not a cited
    source; the question is recorded as a knowledge gap instead), ClinVar
    counts, the MDSGene sex-ratio statement (PMID:38778444; no suitable
    slot), general cervical-dystonia DBS, physiotherapy and quality-of-life
    papers (PMID:37542824, PMID:41483253, PMID:33099684) because they are
    not ANO3-specific, and PMID:39351635 (dystonia-ataxia) and
    PMID:38341631 because their caches hold no quotable text.

    Validation: just validate, validate-terms, count-verified-snippets
    (87/87), check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms, check-gene-activity-grounding --against-ref
    origin/main, check-coarse-phenotypes, check-snippet-length,
    check-title-snippets, check-folded-hyphens, check-reference-titles,
    check-environmental-evidence, check-snippet-grading,
    check-retired-support-prose, check-case-collisions,
    check-term-cache-integrity, check-cache-order and validate-disorders
    all passed. just check-genereviews reported the overview TAGGED.

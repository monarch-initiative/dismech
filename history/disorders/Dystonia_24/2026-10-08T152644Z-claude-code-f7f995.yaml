  summary: 'Review round 1: Dystonia_24'
  details: |
    Review round 1 on PR 13703.

    Blocking finding fixed: the PMID:39773217 sentence on ANO3-S116L showing only minor deviations from wild-type function in vitro, in discussion ano3_variant_effect_direction, was regraded from HUMAN_CLINICAL to IN_VITRO, keeping quote_role BACKGROUND. The sentence occurs nowhere else in the entry.

    Optional suggestions taken: (1) the duplicated GO:0017128 binding was removed from the Heterozygous ANO3 Variants node, and the ANO3 gene descriptor moved to the Altered ANO3 Calcium-Activated Scramblase Function node so the gene sits on the node carrying its molecular function, which also keeps check_gene_activity_grounding passing; (2) the fibroblast CL:0000057 binding was removed from the ER calcium node because the fibroblast is the assay system, not the cell in which the disease mechanism acts, and the node description already names the assay cells; (3) KCNN4 (hgnc:6293, looked up via the HGNC REST API and confirmed by validate-terms) was added as a genes descriptor on the KCa3.1 node; (4) a diagnosis section was added with molecular genetic testing (NCIT:C19770), brain MRI (NCIT:C16809, normal) and electromyography (NCIT:C38056), each with evidence from cached abstracts or full text; (5) the TMEM16C knockout rat (PMID:23872594) was added under animal_models, linked to Striatal Neuronal Hyperexcitability as PARTIALLY_RECAPITULATES with fidelity LOW, model_scale CELLULAR, limitations and three typed divergences (PROXY_QUANTITY, CONTESTED_ASSUMPTION, SPECIES_MISMATCH); the paper reports dorsal root ganglion hyperexcitability and altered pain sensitivity and no motor phenotype, and the ano3_no_dystonia_model discussion now attaches to it; (6) quote_role BACKGROUND was added to the PMID:24442708 inheritance item, whose sentence restates the gene-identification report.

    Validation: validate, validate-terms, count-verified-snippets (94/94), check-entity-refs, check-causal-targets, model-scale-audit --strict, check_gene_activity_grounding --against-ref origin/main and validate-disorders passed, together with the corpus-wide snippet, title, coarse-phenotype and cache gates.

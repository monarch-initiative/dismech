  summary: Add phenopacket-store cohort dataset record
  details: |
    Added a GA4GH phenopacket-store cohort as a datasets record, discovered by scripts/discover_phenopackets.py. Unlike the GEO-derived records added earlier, this match is made on disease IDENTITY rather than name: the cohort's coded disease term (OMIM/MONDO, carried by every phenopacket) was compared against the OMIM and Orphanet xrefs of this entry's own MONDO disease_term, resolved via the OLS4 API. Gene agreement alone was not sufficient and was withheld. Case count, source PMIDs and HPO breadth are computed from the pinned phenopacket-store release rather than model-generated. No evidence block generated, since an evidence item requires an exact abstract quote.

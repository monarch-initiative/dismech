  summary: Add perinatal phenotypes, FeCl3 mouse and Caco-2/INT 407 models, surgical
    source control, ECTO exposures, sapA antigenic-variation node, and phenotypic AST
    evidence
  details: |
    Addressed PR #17264 Round 1 review feedback: added Stillbirth (intentionally unbound because HP:0003826 sits under Mortality/Aging outside the HP:0000118 PhenotypeTerm enum root) and Premature birth (HP:0001622) phenotypes wired from Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding (PMID:7246658, PMID:3523697); added animal_models entry for the FeCl3-pretreated HA/ICR murine systemic infection model (PMID:2318963) with structured readouts and limitations plus experimental_models entries for Caco-2 (PMID:20600794) and INT 407 (PMID:18388970) epithelial invasion assays; added Surgical source control for endovascular infection (NCIT:C15329; PMID:40484837, PMID:7771897); added ECTO-bound environmental foodborne/waterborne (ECTO:9002126) and zoonotic reservoir (ECTO:3000000) exposure rows; split S-layer sapA antigenic variation (GO:0020033, GO:0006310, GO:0042783; PMID:7885229) out of S-layer-mediated serum resistance; added negative hippurate hydrolysis and negative TSI H2S phenotypic differentiation evidence (PMID:3175020); split prevalence into overall campylobacteriosis versus bacteremia cohorts; dropped unsupported Sepsis frequency; and moved Bacteremia to Hematological.

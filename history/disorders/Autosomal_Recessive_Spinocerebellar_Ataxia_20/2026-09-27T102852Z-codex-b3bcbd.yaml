  summary: Review SCAR20 clinical spectrum, allele-specific mechanisms and experimental evidence against cached full texts
  details: 'Reviewed the pre-existing SNX14/SCAR20 entry because it had no REVIEW history event. This is a Mendelian disorder, within the requested exclusion of infectious and environmental diseases/poisonings. Rebased onto origin/main 08caff4610a before completing the review. No overlapping review PR was present at selection.


    Major changes:

    - Replaced a universal autophagosome-fusion explanation with assay- and allele-specific findings: impaired clearance in patient neural progenitors, preserved autolysosome formation in other cells, and retained protein/function for an in-frame PX-domain allele.

    - Separated lipid handling, saturated-fatty-acid processing, ER disruption, spastin turnover, axonal transport, respiration and neuronal electrophysiology into atomic nodes. SCD1 activity was not intrinsically deficient. Regional mouse lipidomics is distinct from bulk assays, cultured Purkinje-cell droplets and human biomarkers. Ferroptosis remains an emerging hypothesis.

    - Expanded the clinical spectrum and human autopsy findings; replaced a skeletal-system root with specific findings. Preserved counterexamples to universal hypotonia and early MRI abnormality. Reconciled, without silently selecting one, the 2015 narrative/Table 1 discrepancies for seizures, nystagmus and organ enlargement. Autistic-like behavior is not treated as a formal autism diagnosis. The Korean infant''s perinatal white-matter injury is not assigned as an established SNX14 manifestation.

    - Added individual coding, canonical-splice, intronic and structural alleles with transcript effects distinguished from genomic structure, predicted decay and measured protein abundance. Kept p.Gln915Leu a VUS; the C-terminal-tag assay cannot exclude an N-terminal truncated product. Corrected the founding donor variant using its published erratum. Recurrence in Oman does not establish a founder haplotype.

    - Distinguished conditional, viable constitutive and embryonic-lethal mouse lines, stable genetic zebrafish and the natural Vizsla model. The dog study did not exclude mild hearing loss or later cognitive manifestations. Added cortical cultures, patient RNA studies and the two verified sequencing datasets.

    - Added sourced supportive rehabilitation, communication, orthopedic and antiseizure care, parental-variant-informed genetic counseling, clinical monitoring and audiologic/biochemical diagnostic context. General GeneReviews care is explicitly extrapolated; valproate, SCD1 augmentation and M1 spastin rescue are preclinical.


    Source consumption:

    The original 12 cited PMID records were read. Full scientific bodies were used for Akizu 2015 (25848753; methods, figures and Table 1), Shukla 2017 (27913285), Fenn 2016 (27566131; all main text, methods and figure captions), Datta 2019 (30765438), Maia 2020 (33193593), Zhang 2021 (34691693; main text/figures), and Zhou 2024 (38625743; main text/methods). The founding Thomas 2014 paper (25439728) was recovered as the complete UCL combined paper and supplement PDF, including supplemental figures and tables. The 2015 erratum was read in the generated PMC HTML cache. Bryant 2018 (29635513) full text was recovered through generated PMC HTML; Datta 2020 (33310904) full scientific text was read through the available HTML-derived text. Additional full sources consumed: Huang 2014 cortical physiology (24859318), Bryant 2020 comparative species models (32792680), Al-Hashmi 2018 Omani cases (30473892), Korean 2021 cases (DOI:10.5734/jgm.2021.18.2.127), Levchenko 2023 RNA diagnostics (37485342), Shao 2024 variants (38655056), and the 2026 deep-intronic case (42074495). For the broad dystonia transcriptomics paper (41623120), the general methods and discussion plus SNX14 R140 results, figure
    and table were read; unrelated gene-specific cases were scoped out. The 2025 temporal-lobe epilepsy paper (40237949) was screened at abstract level and excluded from SCAR20 therapeutic inference: SNX14 manipulation in acquired epilepsy is not a SCAR20 intervention.


    Sait 2022 (35195341) and the recent 17-person Omani series (41294032) remained abstract-only after sanctioned reference refresh. A separate DOI fetch for Sait also recovered only the abstract. Assertions are limited to accessible text. Supplementary detailed methods for the 2020 SCD1 and 2021 spastin papers were not recovered; the attempted Zhang supplemental ZIP returned HTML rather than the archive. Akizu''s individual-patient Supplemental Table 4, Shukla''s supplemental patient table, the dog candidate-variant spreadsheet and Zhou''s downloadable lipidomic spreadsheets were not independently inspected. No cell counts, assay details or data reanalyses are asserted from these unavailable/unread files. The founding UCL supplement is an exception and was read in full. Cached HTML that contained access challenges was not used as scientific evidence.


    The matching Falcon report, its citation list/sidecar and artifact-00 table were cross-checked. The image artifact was inspected: it shows Figure 5 lipid panels, not the entire Figure 6 despite the artifact caption. Primary sources supersede report mistakes: the Korean follow-up examination of the younger sibling was CT; HP:0001317 is not delayed myelination; a VUS is not a proven pathogenic missense allele; allele-specific autophagy and genetic-zebrafish negatives qualify the report''s broad pathway. The report identity preflight was consistent with MONDO:0014601/SNX14, with erroneous identifier text resolved against the intended disorder. All ontology bindings were checked with OAK/term validation, including replacement of pontine hypoplasia with the supported pontocerebellar atrophy concept.


    Eight-dimension research completeness assessment:

    1. Phenotypes: adequate. Core neurologic/developmental, hearing, facial, skeletal and storage-like manifestations are covered, including >10% cohort findings. Reported denominators are not converted to population frequencies. Rare isolated observations and mechanistic uncertainty are qualified.

    2. Subtypes: N/A. No established independently mapped SCAR20 subtypes; allele, age and model differences are not invented subtypes.

    3. Pathophysiology: adequate. Molecular, cellular and organ links cover autophagy disagreements, lipid handling, axonal transport, cortical physiology and human degeneration. Model-to-human uncertainty and unexplained systemic features are explicit discussions rather than fabricated causal edges. Ferroptosis is non-blocking, hypothesis only.

    4. Treatments/trials: adequate. General supportive care and all central preclinical rescue leads are distinguished. ClinicalTrials.gov API queries on 2026-09-27 found no SNX14 record; SCAR20 returned an unrelated burn-scar trial, and the full disease phrase returned only CoRDS NCT01793168, a broad observational rare-disease registry. No SCAR20-specific interventional trial was identified. The registry is not presented as disease-modifying therapy. ASO targeting and dietary manipulation remain proposals without demonstrated SCAR20 efficacy.

    5. Genetics: adequate. Coding truncations, missense, in-frame deletions, canonical/deep-intronic splicing and complex structural alleles are represented with segregation and functional limits. Reliable population penetrance, carrier-frequency and modifier estimates are unavailable.

    6. Diagnostics/biomarkers: adequate. Molecular confirmation, genome/RNA reanalysis, structural characterization, age-aware imaging, hearing assessment and variable metabolic findings are covered. Mouse lipidomics is not a clinical biomarker.

    7. References: adequate, with explicit access limits above. All central verified report leads were consumed; new disease-specific sources and older physiology/model papers are integrated. References were generated/refreshed using fetch-reference, never authored by hand. The 2025 epilepsy context was deliberately excluded.

    8. Overall: central research themes covered and extended using full-text primary evidence. Unresolved therapeutic translation and causal connections are scientific gaps, not missing proven mechanisms.


    Validation: schema, ontology terms and all cached evidence passed during curation; the final batched validate-disorders check, scoped structural tests, history validation and repository gates are recorded in the PR after completion. Both geo:GSE215834 and bioproject:PRJEB12339 resolved with verify-datasets. Scanning all KB files for the six refreshed PMID identifiers found only this disorder, so there are no additional shared-cache consumers to revalidate. No retired dataset-accession blob was read or restored.

    '

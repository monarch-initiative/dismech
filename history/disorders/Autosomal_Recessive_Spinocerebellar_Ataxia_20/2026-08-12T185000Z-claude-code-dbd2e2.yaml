  summary: 'Create: Autosomal Recessive Spinocerebellar Ataxia 20 (SCAR20, SNX14)'
  details: |
    Created SCAR20 (MONDO:0014601, SNX14) de novo. Deep research: falcon (Edison Scientific); NEC preflight-dr PASS (SNX14 dominant, 41 mentions, OMIM 616354 match). Foundational human evidence from Thomas 2014 (PMID:25439728) and Akizu 2015 (PMID:25848753); mechanistic ER/lipid-droplet and lysosome-autophagy evidence (Bryant 2018 PMID:29635513, Datta 2019 PMID:30765438, 2020 PMID:33310904); Purkinje-cell and mito-transport mechanism (Zhang 2021 PMID:34691693, Zhou 2024 PMID:38625743); phenotype review (Shukla 2017 PMID:27913285, Bhavani 2022 PMID:35195341); Omani cohort/founder allele (PMID:41294032); compound-het/dystonia expansion (Maia 2020 PMID:33193593). Added animal_models: natural canine Hungarian Vizsla SNX14 model (Fenn 2016 PMID:27566131) and Snx14-deficient mouse with valproate rescue framed strictly as mouse-only preclinical. Validated: schema + terms pass; count-verified-snippets 39/39; validate-disorders CI check passes; weighted compliance 88.5%. Post-creation red-team review (fresh-context subagent): applied fixes — added Skeletal abnormalities phenotype (HP:0000924, PMID:27913285); wired Axonal Mitochondrial Transport Failure into the pathograph as downstream of SNX14 Loss of Function (single connected component); corrected the ER-lipid node cell type from neuron to fibroblast to match the in-vitro evidence. Re-validated: count-verified-snippets 40/40; validate-disorders CI check passes.

  summary: Add four abstract-verifiable phenotypes; correct seizure/nystagmus prose
  details: |
    PR shepherd follow-up to the remaining blocking item on PR #8401 (six >10% phenotypes absent from phenotypes:). Added the four the reviewer could tie to an exact quote in an abstract already cached in this PR: Seizures (HP:0001250) and Nystagmus (HP:0000639) and Hepatosplenomegaly (HP:0001433) from PMID:25848753, and Hypertrichosis (HP:0000998) from PMID:27913285. Deliberately did NOT add Autistic-like behaviour or Macroglossia: their only support is the deep-research cohort table, and curating a phenotype from a DR table without a verified abstract quote is the fabrication risk the evidence SOP warns about. Omitted frequency: throughout, consistent with the rest of this entry (no phenotype carries one) and with the frequency-evidence guidance that a band is a separate quantitative claim needing its own support; the hypertrichosis evidence in particular is a single-patient sentence that supports presence only, which its explanation states. Also corrected the description prose flagged as item 1b: nystagmus moved out of 'reported in a subset' to reflect 'seen in most children', and the seizure sentence rewritten from 'a minority of patients' to the cohort's own 'developed in half by 2 years'. Validated with just validate (all validations passed, snippets 46/46 verified against cached references, up from 42/42) and just validate-terms (passed), plus pytest tests/test_data.py (9810 passed). No cache churn.

  summary: 'Compliance: environmental exposure evidence; split immobilisation from
    surgery'
  details: |
    Weekly compliance pass focused on environmental exposure evidence. Both environmental entries lacked entry-level evidence. Split the combined 'Immobilisation and surgery' entry into 'Major surgery' and 'Prolonged immobilisation', because the two act through different components of the prothrombotic context node (coagulation activation versus stasis) and because a single ECTO binding could only ever cover one of them. Bound ECTO:2000054 (exposure to surgery) on the surgery entry; left the immobilisation entry unbound with a note recording that ECTO:6000004 (exposure to sedentary lifestyle) was considered and rejected as a habitual behaviour rather than acute imposed immobility. Cited both from PMID:10737280 (Heit 2000 population-based case-control: surgery OR 21.7, hospital or nursing home confinement OR 8.0, paresis OR 3.0). Added three entry-level evidence items to the oestrogen entry: the existing PMID:11583312 oral contraceptive interaction lifted to entry level, plus PMID:30626577 (Vinogradova 2019 BMJ, 80396 cases) for the hormone replacement therapy half, including the PARTIAL transdermal null result that qualifies the exposure as route-dependent. All 54 snippets verify against the reference cache. Weighted compliance 69.8 percent to 72.9 percent.

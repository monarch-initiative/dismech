  summary: 'Review response: Pulmonary Embolism'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 8279. All five blocking items addressed additively. First, the prevalence record contradicted itself, carrying a rate of 100 per 100000 with a band of 1 to 5 per 10000. One to two per thousand is 100 to 200 per 100000, so the band is now ABOVE_1_IN_1000 and rate_low and rate_high record the range explicitly. Second, chronic thromboembolic treatments were absent while the phenotype description called the condition potentially curable by endarterectomy. Pulmonary endarterectomy with balloon pulmonary angioplasty, and riociguat, are now curated with their own evidence. Third, thromboprophylaxis is now modelled as a treatment acting on the prothrombotic context node, evidenced by the MEDENOX placebo-controlled trial including its dose-response arm. Fourth, post-pulmonary embolism syndrome is added as a phenotype, bound to Dyspnea with a CHRONIC qualifier because HPO has no term for the syndrome. Fifth, surgical embolectomy and inferior vena cava filters are added, the latter curated with its negative randomised trial as a REFUTE item since PREPIC2 found no reduction in recurrent pulmonary embolism. Validation after the changes. just count-verified-snippets reported 47 of 47 verified, and just validate-terms passed.

  details: |
    New entry for pulmonary embolism, MONDO:0005279, curated from a claude_code deep-research report treated as leads only. Ten pathophysiology nodes organised around the claim that early mortality is right-ventricular rather than pulmonary. Three nodes declare conformance to the thrombogenesis module, at the Virchow-triad context, fibrin-platelet thrombus formation, and venous thrombus embolization to pulmonary arteries nodes. Conformance to pulmonary_vascular_remodeling is deliberately NOT declared at the chronic thromboembolic node, because that module's central effector describes smooth-muscle-driven neointimal remodeling rather than organised fibrotic thromboembolic material. The reasoning is recorded in the node notes. Three deep-research ontology errors were caught and corrected. HP:0030848 is Elevated jugular venous pressure and not Pleuritic chest pain. HP:0004936 is Venous thrombosis and not Deep venous thrombosis. CHEBI:66989 is a sphinganine lipid and not apixaban. Four references were fetched and then not cited because their cached records carry no quotable abstract. Their cache files are not committed and the omission is documented in the entry notes. Validation. just validate passed for schema, terms, and references. just count-verified-snippets reported 37 of 37 verified. The pytest foreign-key and conformance selection reported 5902 passed.

  summary: 'Create: Hypomyelinating Leukodystrophy 10 (PYCR2, MONDO:0014632)'
  details: |
    De novo creation of the HLD10 (PYCR2) entry.

    DEEP RESEARCH. Two providers were run and both reports are committed under research/. falcon was attempted first per the default and failed with HTTP 402 Payment Required from the Edison API (account out of credit), so claude_code and openscientist were used instead. claude_code: 14 web searches, reference_validation reported 10/10 references resolved, 0 unresolved, 0 off topic. openscientist: 14/14 resolved, 0 unresolved. Neither report carried unresolved_references, so nothing was curated from an unresolvable identifier.

    NEC PREFLIGHT. HLD10 sits in a numbered series (HLD1-HLD13) whose members share only the numeral, so the anchor was fixed with OAK before curation: runoak -i sqlite:obo:mondo info MONDO:0014632 -O obo returns RO:0004003 HGNC:30262 PYCR2 and xref OMIM:616420. just preflight-dr returned PASS on the claude_code report (PYCR2 44 mentions vs PYCR1 6; report OMIM 616420 matches the MONDO xref) and WARN on the openscientist report. The WARN was assessed and judged a false positive of the rival-gene heuristic: the flagged rival is SHMT2 (26 mentions vs PYCR2 60), which is this disease's own downstream mechanism gene per PMID:32330411, not a second disease entity.

    IDENTIFIER ERRORS CAUGHT IN THE REPORTS. Neither report's identifiers were trusted. The claude_code report asserted PYCR2 = HGNC:23364; runoak -i sqlite:obo:hgnc info hgnc:23364 returns ST6GALNAC6, so that binding was rejected. The openscientist report gave the disease as MONDO:0014635, not this entity. The bindings used in the entry (hgnc:30262, MONDO:0014632) come from the MONDO record and were confirmed independently with OAK. Both errors are recorded in the entry notes.

    GENEREVIEWS. No GeneReviews chapter exists. PubMed esearch for 'PYCR2 GeneReviews[All Fields]' and 'hypomyelinating leukodystrophy 10 GeneReviews[All Fields]' both returned zero records, and just tag-references found 0 GeneReviews citations. The phenotype baseline was taken instead from the primary cohort literature: PMID:27130255 (14 patients / 11 families), PMID:27860360 (5 patients / 3 families) and PMID:34037307 (which also reviews all 35 patients reported to that date).

    WHAT WAS CURATED. A six-node pathophysiology chain from biallelic PYCR2 loss of function through three parallel consequences: preserved bulk proline supply by PYCR1/PYCR3 paralogue redundancy (curated as an explicit node because it rules out proline auxotrophy and any metabolite-replacement rationale), mitochondrial dysfunction with oxidative-stress apoptosis susceptibility, and SHMT2 upregulation with cerebral glycine accumulation; converging on impaired oligodendroglial differentiation with CNS hypomyelination, progressive neuronal loss with brain atrophy, and severe neurodevelopmental impairment with early mortality. Plus 17 phenotypes, 4 imaging findings including the MRS glycine peak (HP:0034893), 3 biochemical entries (two of them negative findings), the PYCR2 gene entry with its allelic spectrum and the Thai founder haplotype, PYCR1 recorded as DISPUTED/ABSENT to make the paralogue separation auditable, prevalence as CASES_IN_LITERATURE, progression, diagnosis, 2 differential diagnoses, 5 treatments including an explicit no-disease-modifying-therapy entry, 3 animal models and 2 experimental models with modeled_mechanisms links, and 3 discussions (KNOWLEDGE_GAP on what is actually lost if proline is not depleted; HUMAN_MODEL_MISMATCH on whether Pycr2-null mice reproduce hypomyelination and microcephaly at all; CONTROVERSY on leukodystrophy vs genetic leukoencephalopathy).

    FREQUENCY DISCIPLINE. Bands are asserted only where a published cohort gives an explicit numerator or percentage, and each such phenotype carries its source figure in notes. frequency is deliberately omitted for hearing loss (no denominator: audiology was performed only where available), for spastic paraplegia and intention tremor (confined to two related families with the p.Val128Ala allele, so a disease-wide band would mislead), and for the MRS glycine peak (MRS was not performed systematically in the classical cohorts).

    DATASETS. No datasets block, deliberately, and the reason is recorded in the entry notes: with about 38 published patients and no disease-specific omics resource, a gene-keyed accession search on PYCR2 returns colorectal, hepatocellular and renal-carcinoma series, which is the Named Entity Confusion reached through dataset search that the SOP warns about.

    VALIDATION. just validate passes in full: schema clean, term validation passed, and reference validation reports 104/104 snippets verified against cached references. just compliance reports 94.4 percent global / 94.8 percent weighted, the residual being the deliberately absent datasets block. reference_title values were backfilled from the local cache with scripts/add_pmid_titles.py; the five AnimalModel/ExperimentalModel publication fields that the script converted to nested objects were reverted to plain strings, since that slot takes a string. Two ontology labels initially guessed from memory were wrong and were corrected against OAK before the entry validated: MONDO:0013035 (which is orofaciodigital syndrome XI) was replaced by MONDO:0013051 for the PYCR1 cutis laxa differential, and MONDO:0010714 carries the label 'Pelizaeus-Merzbacher spectrum disorder'.

    RED-TEAM REVIEW BEFORE PR. A fresh-context review pass was run against the dismech-pr-review skill before opening any PR. It returned no CRITICAL findings and ten IMPORTANT ones, all of which were fixed, plus minors. The substantive corrections were:
    - PYCR3 had been swept into the paralogue-redundancy claim, but the cited source (PMID:33734376) scopes redundancy to Pycr1 and Pycr2 only, and its full text puts PYCR3 in the cytosol drawing P5C from ornithine. The claim was narrowed to PYCR1 in all three places and the PYCR3 distinction is now stated explicitly.
    - The PYCR1 genetic entry carried relationship_type DISPUTED, which would have exported a machine-readable PYCR1-to-HLD10 gene-disease edge that no source proposes. The entry was removed; PYCR1 remains as a differential diagnosis, and its two mechanistically real evidence items (no compensatory PYCR1 upregulation in patient cells; reciprocal PYCR1 depletion in Pycr2-null neural lineages) were relocated to the paralogue-redundancy pathophysiology node where they actually bear, the second as PARTIAL because it bounds rather than supports the claim.
    - The notes asserted PYCR1-related cutis laxa was already curated in dismech. It is not: the existing ALDH18A1_Cutis_Laxa and ALDH18A1_De_Barsy_Spectrum entries are keyed on ALDH18A1/P5CS, a different gene one step upstream. Corrected.
    - Cerebral atrophy carried VERY_FREQUENT with no numerator, contradicted by the entry's own quoted evidence that imaging severity was variable. frequency removed.
    - Axial hypotonia derived its band from the spasticity numerator. Re-derived from the hypotonia sentence itself, and the 57 percent spasticity figure moved to the sibling Spasticity entry that it belongs to.
    - Skeletal muscle atrophy cited a discussion sentence carrying no count while claiming 13/14 in notes. The actual numerator sentence was added as evidence.
    - Genetic Counseling cited a founder-allele sentence as SUPPORT; downgraded to PARTIAL, matching how the other rationale-not-efficacy treatments were already handled.
    - The hypomyelination node, the disease's namesake, had no downstream edge and was a dead end in the pathograph. An INDIRECT_KNOWN_INTERMEDIATES edge to the clinical convergence node was added, and all seven causal edges now carry their own evidence.
    - p.Glu10Ter was listed among missense alleles; it is a stop-gain. Moved. p.Val128Ala was missing from the allele list; added.
    - The HSP-only presentation was scoped as confined to one family group; PMID:32920934 independently reports spastic paraplegia as the sole symptom in two adult-onset patients with a different variant. The scoping was softened. That reference is title-only in the cache so it is cited in prose, not as an evidence snippet.

    Also added on review: a mappings.mondo_mappings block; four less-consistent phenotypes from PMID:27860360 that had been missed (cortical blindness, joint contractures, ataxic gait, irritability), each with frequency deliberately omitted since the source gives no numerator; an AGC1/SLC25A12 deficiency differential (PMID:31403263), which is the closest mechanistic analogue of this entry's own primary-versus-secondary hypomyelination controversy; and a target_mechanisms link from the no-disease-modifying-therapy entry to the glycine node, so the proposed intervention point is machine-readable without asserting a treatment.

    POST-REVIEW VALIDATION. just validate passes: schema clean, terms clean, 120/120 snippets verified. just compliance rose from 94.4 to 97.7 percent global (98.1 weighted). just check-duplicate-keys, just check-title-snippets, just check-term-cache-integrity and just check-reference-cache-frontmatter all pass. Note for reviewers: tests/test_data.py has one pre-existing unrelated failure, test_evidence_items_have_references on Travelers_Diarrhea.yaml, which carries 24 bare-URL references on origin/main and is untouched by this work.

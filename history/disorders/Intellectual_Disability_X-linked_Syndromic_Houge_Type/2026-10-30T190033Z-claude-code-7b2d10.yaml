  summary: 'Create: Intellectual_Disability_X-linked_Syndromic_Houge_Type'
  details: |
    New entry for MONDO:0030909 (OMIM 301008), the CNKSR2-related X-linked neurodevelopmental and epilepsy disorder. Lump/split: curated as a DISEASE. It is a single-gene entity; DEE_with_Spike-Wave_Activation_in_Sleep is a heterogeneous electroclinical syndrome that names CNKSR2 as one cause, and Non-Syndromic_X-Linked_Intellectual_Disability, Tonne-Kalscheuer_Syndrome and Autism_Susceptibility_to_X-Linked_3 mention CNKSR2 only in multi-gene screen snippets. None of those entries were edited. Sources: the openscientist deep-research report (committed with its sidecar and artifacts) plus PubMed searches. The report's run exited before its term-validation step finished (EBI timeout on HP:0001999), so just validate-research-terms and just validate-research-reference were run to add both sections. Reference validation: 20/20 resolved, 17/18 quotes found (the one miss, PMID:24656827, differs only by an ellipsis), PMID:10753660 flagged off topic (a MAGUIN/Raf-1 binding paper, on topic under the MAGUIN alias, not cited). Term validation: 26/27 resolved, two mislabelled mentions (HP:0002528 offered as a CSWS-related term is Granulovacuolar degeneration and was not used; HP:0031491 was bound instead). just preflight-dr returned PASS (CNKSR2 mentioned 44 times, OMIM 301008 matches). Ten further PubMed papers were added beyond the report, including the 13-family cohort (PMID:34266427), the female carrier report (PMID:31414730), the X-linked family (PMID:28098945), the ESES series (PMID:32197126), the conditional knockout (PMID:39694826) and the CYTH2 granule cell study (PMID:34800437). PMID:25754917 was not used because its cache has no abstract. The report's ESES-directed corticosteroid and high-dose diazepam citations (PMID:15607609, PMID:40095560) are not CNKSR2-specific and were not used. Mechanism: each edge is sourced; no edge is drawn from the cultured-neuron synaptic defects to network hyperexcitability because no source connects them, recorded as a KNOWLEDGE_GAP. ClinGen classifies CNKSR2 only for MONDO:0100148 (X-linked complex neurodevelopmental disorder), so no gene_disease_validity assertion was copied. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (90/90), entity-ref, causal-target, coarse-phenotype, qualifier, enum, duplicate-key, block-scalar, logical-rule, gene-term-mismatch and the whole-tree gates all passed, then just validate-disorders.

  summary: 'Review round 1: rename to CNKSR2-Related Neurodevelopmental and Epilepsy
    Disorder'
  details: |
    Applied the entry-naming rule (design decisions section 18) at the reviewer's request. The entry name changed from the MONDO-derived 'Intellectual Disability X-linked Syndromic Houge Type' to 'CNKSR2-Related Neurodevelopmental and Epilepsy Disorder', the gene-related name in the title of PMID:34266427; PMID:38443014 and PMID:32197126 use CNKSR2-related names for the sleep-activated epileptic encephalopathy. Titles were checked in references_cache. MONDO:0030909 has no gene-related label or exact synonym (checked via OLS), so recurring literature use is the basis, recorded in notes. The DEE-SWAS form was not chosen because only about 44 percent of patients with a sleep EEG show spike-wave activation in sleep. The old name, the MONDO label and the OMIM title are kept in synonyms. File slug unchanged pending dismech#15894; no other KB file references the old name. Not done: a speech and language therapy treatment (no CNKSR2-specific source; the only cached mention is a general epilepsy-aphasia statement in the introduction of a mouse paper, PMID:39694826) and an edge from dendritic spine morphogenesis to global developmental delay (the background sentence behind the intellectual disability edge speaks of cognitive function, not development, so it would not source a second edge).

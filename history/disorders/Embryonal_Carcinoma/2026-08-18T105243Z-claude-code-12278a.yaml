  summary: 'Create: Embryonal Carcinoma (MONDO:0005440) with four MONDO subtypes'
  details: |
    Created kb/disorders/Embryonal_Carcinoma.yaml resolving issue 8738 (CURATE_ROOT_WITH_SUBTYPES, MONDO:0005440).

    Subtypes follow the four real MONDO subclasses confirmed with OAK against sqlite:obo:mondo, not the three suggested in the issue body: MONDO:0006446 testicular embryonal carcinoma, MONDO:0003581 ovarian embryonal carcinoma, MONDO:0018843 embryonal carcinoma of the central nervous system, MONDO:0017328 non-central nervous system-localized embryonal carcinoma. The issue's suggested "component of mixed germ cell tumour" subtype was deliberately not created: it has no MONDO id and cross-cuts the site subclasses. That decision is recorded in the entry notes.

    Mechanistic backbone curated as an eight-node causal chain: GCNIS-derived transformation, isochromosome 12p / 12p gain with the 12p-resident NANOG/KRAS/CCND2/LDHB dosage genes, the retained OCT3-4/SOX2/NANOG/LIN28 pluripotency programme, unrestrained primitive epithelial proliferation, multilineage differentiation into other germ cell tumour histologies, lymphovascular invasion and early metastatic dissemination, intact apoptotic apparatus with limited DNA repair capacity, exceptional cisplatin chemosensitivity, and an acquired cisplatin resistance escape branch. Plus histopathology, phenotypes, biochemical immunomarkers, genetic, treatments, diagnosis and differential diagnoses.

    No conforms_to links are declared. resisting_cell_death is the mechanistic inverse of this tumour's biology, genome_instability_mutation asserts a mutator phenotype germ cell tumours do not have, and sustaining_proliferative_signaling is not evidenced because activating KRAS/KIT mutations concentrate in seminoma. The reasoning and a proposal for a dedicated module are recorded as an INTERPRETATION discussion on the entry rather than being left implicit.

    Curated from primary literature via targeted PubMed E-utilities searches; no deep-research provider report was used, so no preflight-dr NEC run applies. Named Entity Confusion was still guarded against manually: every cited paper was read from its cached abstract and confirmed to be about germ cell embryonal carcinoma, not embryonal rhabdomyosarcoma, CNS embryonal tumours, hepatoblastoma or Wilms tumour. Two PMIDs were deliberately reused from the existing Testicular_Germ_Cell_Tumor entry as directed (36835562, 37891379), plus 37175579 and 33142349 already in the cache.

    Nine new references were fetched with just fetch-reference: PMID 32205480, 41384700, 38922953, 26191277, 42115464, 29380526, 19396148, 19369635, 23625774, 36030288, 36088223, 24679874. No references_cache file was hand-written.

    Reconciled four existing KB touchpoints with minimal edits, binding previously unbound embryonal carcinoma subtype stubs: Testicular_Germ_Cell_Tumor Embryonal Carcinoma to MONDO:0006446; Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary Embryonal Carcinoma to MONDO:0003581; Mixed_Germ_Cell_Tumor Embryonal Carcinoma Component to MONDO:0005440; and added a new Central Nervous System Embryonal Carcinoma subtype bound to MONDO:0018843 to Central_Nervous_System_Germ_Cell_Tumor, which previously named the histology only in prose.

    Ontology caches were warmed from EBI OLS with a widened HTTP timeout because the bundled ols_client hardcodes a 5s default that the currently slow OLS exceeds. No cache row was hand-written; all rows were derived by linkml-term-validator from the real ontology and their labels checked against the OAK output used to pick the terms.

    Validation run to completion, with output read: just validate reported No issues found for schema, Validation passed for terms, and All validations passed with 44/44 snippets for references. just validate-terms passed. just count-verified-snippets over all five changed files reported 198/198 verified against cached references. just check-duplicate-keys reported OK for 5 files. just check-title-snippets reported no new title-quoting snippets. just validate-disorders over all five changed files passed schema, term and reference validation in one batched pass. Targeted pytest selection (conforms_to, unique, subtype_foreign, environmental_mechanism) ran 8303 tests, all passing.

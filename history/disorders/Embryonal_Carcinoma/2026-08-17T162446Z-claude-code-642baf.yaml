  summary: 'Create: Embryonal Carcinoma'
  details: |
    New Disease entry for embryonal carcinoma (MONDO:0005440), issue #8738, modelled as CURATE_ROOT_WITH_SUBTYPES: the histology across sites, with five subtypes - EC component of mixed GCT, pure testicular EC, ovarian EC, extragonadal/mediastinal EC, and CNS EC.

    Deep research. The task requested the falcon provider, but neither EDISON_API_KEY nor FUTUREHOUSE_API_KEY is present in this environment and "just research-disorder falcon Embryonal_Carcinoma" failed with "Provider 'falcon' not available. Available: claude_code". The run was therefore performed with the claude_code provider instead, producing research/Embryonal_Carcinoma-deep-research-claude_code.md (18 web searches, 20 turns, reference_validation confabulation_rate 0.038, one unresolved malformed DOI which was not cited anywhere). The report was treated as leads only: nothing was curated from it without an independently fetched PubMed abstract, and several of its suggestions proved wrong on checking - it proposed HP:0100615 for "Neoplasm of the testis" when that CURIE is actually Ovarian neoplasm, and CHEBI:4917 for etoposide when the correct term is CHEBI:4911. Most of its citations were bare PMC or publisher URLs rather than PMIDs, so the entry's reference set was re-derived from PubMed E-utilities searches rather than reused from the report.

    NEC preflight. "just preflight-dr research/Embryonal_Carcinoma-deep-research-claude_code.md MONDO:0005440" returned SKIP, because MONDO records no RO:0004003 causal gene for this term, so the manual identity check was run. Germ cell tumour nomenclature is a genuine Named Entity Confusion risk here. The report's top gene mentions were SOX2=13, KIT=12, KITLG=11, TP53=11, NANOG=11 - the germ-cell and pluripotency set - with zero mentions of PAX3, PAX7, FOXO1 or MYOD1 (embryonal rhabdomyosarcoma), zero of LIN28A, C19MC or SMARCB1 (CNS embryonal tumours), and zero of CTNNB1 or hepatoblastoma. The single "rhabdomyosarcoma" occurrence was a correct reference to somatic-type malignant transformation of residual teratoma. No entity confusion detected.

    Content. Nine pathophysiology nodes: GCNIS precursor, 12p gain and invasive transformation, retained OCT3/4-SOX2-NANOG pluripotency, CD30 surface expression, multilineage differentiation capacity, aggressive invasion and early lymphovascular spread, plus the two-arm basis of platinum sensitivity - deficient ERCC1-XPF-dependent interstrand-crosslink repair, and Oct-4-dependent constitutive NOXA priming on a wild-type TP53 background - converging on exceptional cisplatin chemosensitivity, with an acquired-resistance node downstream. Brentuximab vedotin is curated as a REFUTE-evidenced negative result rather than an available therapy, since its dedicated phase II trial produced no responses despite EC's near-uniform CD30 expression. Three KNOWLEDGE_GAP discussions record the unresolved reprogramming site and trigger, the unexplained mechanism linking 12p gain to invasiveness, and the inverted hTERT-aggressiveness direction.

    Module conformance. Only genome_instability_mutation#Mutator Phenotype and Chromosomal Instability is declared, on the 12p node, and explicitly only at that node's chromosomal-instability and aneuploidy arm, since germ cell tumours are not hypermutated and show no point-mutation mutator phenotype. dna_repair_synthetic_lethality, resisting_cell_death and enabling_replicative_immortality were each considered and rejected, with the reasons recorded in the entry's notes field.

    Reconciliation of existing stubs. Two pre-existing unbound subtype stubs described the same histology without linking to it. The Embryonal Carcinoma subtype of Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary and the Embryonal Carcinoma Component subtype of Mixed_Germ_Cell_Tumor each gained a subtype_term binding to MONDO:0005440, a pointer to the new entry, and a new verified evidence item.

    Validation, all run to completion and read. "just validate kb/disorders/Embryonal_Carcinoma.yaml" passed schema, term and reference validation. "just count-verified-snippets" over all three changed files reported 131/131 verified against cached references with none skipped by prefix. "just validate-disorders" over the same three files passed schema, term and reference validation in one batched pass, again 131/131. "just check-title-snippets" initially flagged two new title-quoting snippets in this entry; both were replaced with abstract finding sentences, the KITLG item being re-sourced to PMID:31612386, and the gate now reports no new title-quoting snippets. "just check-duplicate-keys" was clean. tests/test_data.py conforms_to_module_node selection passed. Every PMID was fetched with "just fetch-reference"; no reference_cache or term cache file was hand-written or hand-edited.

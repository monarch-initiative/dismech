  summary: 'Review fixes: subtype scope, unevidenced frequency bands, epigenetic node'
  details: |
    PR-shepherd fix commit responding to the ai4c-reviewer CHANGES_REQUESTED review on PR #8825.

    IMPORTANT 1 - MONDO:0017328 subtype description was mis-scoped. "Non-central nervous
    system-localized embryonal carcinoma" (Orphanet:289362) means EC at ANY non-CNS site, so it
    subsumes the Testicular EC (MONDO:0006446) and Ovarian EC (MONDO:0003581) subtypes listed
    alongside it. The old description restricted it to extragonadal midline sites, implying the
    four subtypes partition the space when they do not. Reworded to state the subsumption
    explicitly and to name only the sites it uniquely adds beyond the two gonadal subtypes.

    IMPORTANT 2 - four histopathology findings carried frequency bands with no supporting
    evidence: Glandular and Solid Growth Pattern (VERY_FREQUENT), Pseudopapillary Architecture
    (FREQUENT), Geographic Coagulative Necrosis (FREQUENT), High Mitotic Rate (VERY_FREQUENT).
    The reviewer offered attach-evidence or drop-the-band. The already-cached PMID:19396148 is
    an immunohistochemistry study whose abstract does not state architectural or mitotic
    frequencies, so no honest quantitative snippet was available. Per CLAUDE.md section 7
    ("When in doubt, omit frequency: rather than fabricate justification") the four bands were
    dropped. The findings themselves and their NCIT bindings are unchanged.

    IMPORTANT 3 - the epigenetic dimension was unmodeled. Added a new pathophysiology node
    "Epigenetic Regulation of the Pluripotency Driver Genes" (biological_scale MOLECULAR,
    GO:0040029 epigenetic regulation of gene expression, modifier ABNORMAL) upstream of
    "Retained Embryonic Pluripotency Program", carrying two evidence items from the
    already-cited, already-cached PMID:36835562. Note GO:0006306 "DNA methylation" was
    deliberately NOT used - it is obsolete in the current GO release. This node makes explicit
    that the EC-versus-seminoma driver-panel switch (OCT4/SOX2/LIN28/NANOG versus
    OCT4/SOX17/KLF4/MYC), which the entry already relies on diagnostically, is set
    epigenetically rather than by mutation of the driver genes themselves.

    Also resolved the merge conflict with main. Both conflicts were in tool-generated cache
    CSVs (cache/enums/histopathologyfindingterm_b0babf2f7c57.csv and cache/ncit/terms.csv) and
    were the same shape: each side had inserted a different adjacent row - NCIT:C35912
    Pseudopapillary Pattern from this branch, NCIT:C35913 Trabecular Pattern from main.
    Resolved as the union of both tool-generated rows and canonicalized with
    "just normalize-cache"; no cache row was hand-authored or retyped.
    "just check-term-cache-integrity" passes.

    Validation run: "just validate" (schema + terms + snippets) passes; "just validate-terms"
    passes; "just count-verified-snippets" over all five changed disorder files reports 200/200
    verified, up from 198 - the two snippets added here; "just check-duplicate-keys" and
    "just check-title-snippets" pass; and the batched "just validate-disorders" pre-PR sweep
    over all five changed files - the same command CI runs - passes with 200/200.

    Not addressed here: the three SUGGESTION-level items (pathograph closure into the distal
    layer, evidence_source OTHER for the textbook chapter PMID:42115464, and the history-record
    reference count that says nine but lists twelve). These are left for the entry author.

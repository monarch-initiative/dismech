  details: |
    Answered the second review of PR 13981. Both SII and SIRI rows had said the preprint reports no reference interval or cut-off; the full text in references_cache/PPR_PPR1289187.md reports optimal ROC cut-offs (SII 547: sensitivity 86.4%, specificity 60.6%, PPV 31.7%, NPV 95.5%; SIRI 1.42: sensitivity 77.3%, specificity 66.3%, PPV 32.7%, NPV 93.2%). The notes now state the cut-off for each index, that it was derived in the same 126-patient cohort without external validation, and that the low PPV and high NPV mean the index mainly rules out poor regression. No snippet was added, because the cut-off sentence breaks across a line and a figure label in the cached PDF text.

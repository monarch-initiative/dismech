  summary: 'Fix: Rename Alcohol Consumption to Ethanol Exposure (ECTO:9000027 retained)'
  details: |
    Renamed the 'Alcohol Consumption' environmental entry to 'Ethanol Exposure', retaining
    its ECTO:9000027 (exposure to ethanol) binding, as part of resolving the duplicate-name
    CURIE conflict in issue #8469.

    The curated mechanism is the chemical one: the link into 'Carcinogen-Driven Esophageal
    Epithelial Injury' rests on acetaldehyde as the toxic ethanol metabolite plus ethanol's
    own action on DNA methylation and retinoid metabolism (PMID:20224883), with a second
    PMID:20224884 item deliberately carried at PARTIAL because it measures alcohol and
    tobacco jointly. The chemical term (ECTO:9000027, which involves CHEBI ethanol) is therefore correct and the name was
    brought into line with it. Binding rationale recorded in the entry's notes slot.

    No CURIE change. No evidence items were added, removed, or re-quoted, and the existing
    SUPPORT/PARTIAL gradings are untouched.

  summary: Add ESCC patient-derived organoid NAM record and chemotherapy-resistance
    node
  details: |
    Closed the New Approach Methodology gap for esophageal squamous cell carcinoma (sub-issue of the NAMeRS 2026 symposium tracker #4873). The entry previously had no organoid, organ-chip, or iPSC-derived evidence; its only IN_VITRO item was a conventional SOX2 cell-line study, while the sibling entry Esophageal_Adenocarcinoma already carried a patient-derived organ-chip record.

    Added an experimental_models record for the 24-patient ESCC organoid (ESCCO) library of Nakagawa et al. (PMID:40169778, Commun Biol 2025), linked into the pathograph with two ModelMechanismLinks: Chemotherapy Resistance (RECAPITULATES, MODERATE fidelity, three readouts covering cisplatin/5-FU response spread, antioxidant stress response gene expression and chromatin accessibility, and fedratinib-induced death in resistant lines) and TP53 Dysfunction (RECAPITULATES, MODERATE fidelity, nuclear p53 accumulation readout against matched normal-epithelium organoids).

    Added a new Chemotherapy Resistance pathophysiology node (biological_scale CELLULAR, GO:0034599 cellular response to oxidative stress, modifier INCREASED) to receive the chemoresistance link. No causal edge is asserted into or out of it, since the source establishes that resistance segregates with an elevated antioxidant stress response but not which upstream node produces that state.

    Limitations are recorded explicitly on both links: the organoids are tumor-cell-only, so stromal, vascular and immune contributions are outside what they report, and nuclear p53 accumulation detects stabilized missense p53 but not truncating or deletion alleles.

    All six snippets were independently verified as exact whitespace-normalized substrings of the cached reference before validation. The reference was fetched with just fetch-reference and no cache file was hand-written. just validate passes schema, terms, and references (49/50 snippets verified, 1 pre-existing prefix skip).

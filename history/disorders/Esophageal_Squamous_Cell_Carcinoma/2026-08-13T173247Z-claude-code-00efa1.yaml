  summary: Link tobacco and alcohol to the carcinogen-injury node
  details: |
    Backfill for issue #8085. Both exposures are TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into Carcinogen-Driven Esophageal Epithelial Injury, a node whose own description names tobacco smoke and alcohol-derived acetaldehyde, so neither exposure is inferred onto it. The link type follows what the field knows about the route from these exposures to epithelial injury rather than the grading of any one sentence, and for tobacco the fetched sentence happens to say so in the authors' own words, that cigarette smoke contains more than 60 carcinogens and these mechanisms are well established. For alcohol the fetched sentence is metabolite-level, naming acetaldehyde as the most toxic ethanol metabolite and ethanol acting through DNA methylation and retinoid metabolism. Two items are carried at PARTIAL with the reason stated. The tobacco risk-factor sentence is graded PARTIAL on the link while this same node grades the identical sentence SUPPORT, which is deliberate: the node claims carcinogen-driven injury occurs in the disease and a risk-factor sentence supports that, whereas the link claims smoking produces that injury and the sentence only reaches it by way of the disease. The odds ratio of 50.1 is the strongest number in the entry but measures heavy smoking and heavy drinking jointly, so it sizes the combination and cannot separate the alcohol contribution the link asserts.

  summary: 'Review response: debundle pathophysiology, add diagnosis and phenotypes'
  details: |
    Round-two revision responding to the automated dismech PR review on #7352. Addressed all five IMPORTANT items and several suggestions. (1) Deep-research gap closed: ran just research-disorder claude_code, which produced research/Early-Onset_Autosomal_Dominant_Alzheimer_Disease-deep-research-claude_code.md (14 web searches, 46 citations) and its citations sidecar; the report was read and treated as leads only. Its suggested HP:0007256 label 'Progressive spastic paraparesis' was WRONG (OAK: the real label is 'Abnormal pyramidal sign'), a caught DR ontology hallucination, and every PMID it surfaced was independently fetched and snippet-verified before use. (2) Pathophysiology debundled from 10 to 14 atomic nodes: the tau node split into 'Site-Specific Soluble Tau Hyperphosphorylation' (about -21 EYO) and 'Neurofibrillary Tangle Formation' (near onset, with soluble p-tau falling as tangles form - opposite directions of change, which is why they cannot be one node); the neurodegeneration node split into 'Neuronal Loss and Cortical Atrophy' (-15 y) and 'Cerebral Glucose Hypometabolism' (-10 y); and the neuroinflammation node split into 'Microglial Activation and Neuroinflammation' and its downstream 'Synaptic Loss'. (3) Added the sibling node 'Increased APP Substrate Dosage' (subtypes: APP Duplication, conforms_to amyloidogenesis Amyloidogenic Precursor Protein) so gene-dosage disease is no longer folded into the gamma-secretase-processing node, which does not describe it; the gamma-secretase node is now scoped to the point-mutation subtypes. (4) Added the missing Seizures phenotype plus Pyramidal, Extrapyramidal, Cerebellar and Atypical Non-Amnestic Cognitive Presentation phenotypes, all evidenced from the newly fetched PMID:27777022 (Ryan et al., Lancet Neurology 2016 ADAD case series). (5) Added a four-record diagnosis section: molecular genetic testing of the three genes (with its ~29% variant-negative limitation cited as PARTIAL), the ADEOAD three-generation pedigree criterion, the CSF amyloid/tau biomarker profile, and amyloid PET. Suggestions also taken: the cerebral amyloid angiopathy node is no longer a dangling leaf (new downstream 'Vessel Wall Fragility and Intracerebral Haemorrhage' node carrying the ARIA safety readout); inferred frequency bands on Cerebral Atrophy and Neurofibrillary Tangles were REMOVED per docs/frequency-evidence-guidelines.md, while Episodic Memory Impairment's VERY_FREQUENT is now directly evidenced by quoted counts (84% PSEN1 / 97% APP amnestic presentation); reference_title colons restored. Frequency bands were deliberately omitted for myoclonus, pyramidal, extrapyramidal and cerebellar signs because the source states those percentages only inside square brackets, which the reference validator strips from snippets - the figures are recorded in notes with their PMID instead of asserting an unquotable band. Validation after the revision: just validate passed, just validate-terms passed, just validate-references passed reporting 97/97 snippets verified, 1693 targeted tests/test_data.py tests passed, and compliance rose to 90.0%.

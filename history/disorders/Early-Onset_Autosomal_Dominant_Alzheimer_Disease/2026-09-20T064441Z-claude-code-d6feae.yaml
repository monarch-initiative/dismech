  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: the entry's own lump-versus-split note and its cited primary literature
    (PSEN1 cloning, the APP V717I kindred, the APP locus duplication series, the PSEN2 Volga
    German founder variant, and the Rouen population-based ADEOAD series) were re-read before
    the reconciliation checklist was opened. The relationship to the general `Alzheimer_Disease`
    entry (MONDO:0004975) is already argued at length in this entry's `notes` and was checked
    rather than restated: that entry retains a broader "Early-Onset Alzheimer's Disease"
    clinical subtype, and this one curates only the deterministic Mendelian entity.

    The one checklist gene, APP (hgnc:620), was already curated and already wired: a `genetic:`
    record with a `gene_term`, a `subtype:` foreign key and a `case_fractions` estimate, plus
    `genes:` bindings on the root "Pathogenic APP, PSEN1, or PSEN2 Germline Variant" node and
    on the "Increased APP Substrate Dosage" node. The knowledge-graph gap is an export
    artefact: the checklist keys on MONDO:1060190, which is the `subtype_term` of the "APP
    Duplication" row, while the exporter emits gene edges only against `disease_term`
    (MONDO:0015140). See dismech#12316.

    What changed: the four `has_subtypes` rows (PSEN1, APP, APP Duplication, PSEN2) now carry
    `genes:` lists, and the three `genetic:` records gained `relationship_type: CAUSATIVE` and
    `variant_origin: GERMLINE`. The APOE record's existing `relationship_type: MODIFIER` was
    left alone.

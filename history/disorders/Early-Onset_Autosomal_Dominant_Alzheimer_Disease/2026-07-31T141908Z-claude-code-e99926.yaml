  summary: 'Create: Early-Onset Autosomal Dominant Alzheimer Disease'
  details: |
    De-novo curation of MONDO:0015140 (early-onset autosomal dominant Alzheimer disease; EOFAD / ADAD / DIAD), claimed from epic issue #1079. NEC preflight was run first: runoak MONDO info confirmed the label, the EOFAD synonym, the Orphanet:1020 xref, and is_a MONDO:0100087 familial Alzheimer disease; no existing kb file referenced MONDO:0015140. The entry is curated deliberately complementary to the existing Alzheimer_Disease.yaml (MONDO:0004975, dominated by the late-onset sporadic form): a top-level notes block records the lump-vs-split rationale and cross-references that entry instead of duplicating its content. Content curated: four genetic subtypes (PSEN1, APP point mutation, APP locus duplication, PSEN2); autosomal dominant inheritance bound to HP:0000006; structured prevalence using measure_type/prevalence_class/rate_per_100000 (Campion 1999 population-based 5.3 per 100,000, plus the approximately 1 percent share-of-AD figure); three progression records (age at onset, course to death, preclinical biomarker cascade); a genetic block with HGNC-bound APP/PSEN1/PSEN2 plus APOE as a MODIFIER locus, carrying GeneCaseFraction records for PSEN1 (56 percent) and APP (15 percent); two mechanistic_hypotheses (CANONICAL deterministic amyloid cascade, ALTERNATIVE qualitative-Abeta-profile); a ten-node pathophysiology chain with biological_scale tags and explicit downstream edges that declares genuine five-node conformance to the amyloidogenesis module (Amyloidogenic Precursor Protein, Protein Misfolding and Beta-Sheet Oligomerization, Amyloid Fibril Formation and Extracellular Deposition, Progressive Tissue Amyloid Accumulation, Organ Dysfunction); eight phenotypes with HP terms; seven biochemical markers including reference_ranges with interpretation_bands for the CSF Abeta42/40 ratio (0.0776 cutoff) and amyloid PET SUVR (1.25 cutoff); five treatments (gantenerumab, solanezumab, lecanemab, donanemab, predictive genetic testing and counselling) with therapeutic_modality, treatment_term, therapeutic_agent and target_mechanisms; two clinical trials (DIAN-TU-001 NCT01760005 and the DIAN observational cohort NCT00869817); and three KNOWLEDGE_GAP discussions with proposed experiments. Validation: just validate passed, just validate-terms passed, just validate-references passed, and all 73 evidence snippets were independently re-verified as exact whitespace-normalised substrings of their cached reference files; pytest tests/test_data.py was run. All 14 PMIDs and 2 ClinicalTrials.gov records were fetched with just fetch-reference; no cache file was hand-written or hand-edited. Deliberately omitted: myoclonus and spastic paraparesis carry no evidence item because no cached source contains a quotable ADAD-specific sentence, and this is stated in their notes rather than papered over with a fabricated citation; no loinc_term is asserted on the reference ranges because LOINC is not in conf/oak_config.yaml and the codes could not be authoritatively verified.

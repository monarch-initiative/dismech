  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for pathogenic Leptospira. Hosts: Rattus norvegicus (NCBITaxon:10116, principal urban maintenance host with chronic renal carriage and urinary shedding), Bos taurus (NCBITaxon:9913, livestock maintenance host), Canis lupus familiaris (NCBITaxon:9615, reservoir host), Homo sapiens (NCBITaxon:9606, accidental host that does not maintain the cycle). No vectors recorded: leptospirosis has no arthropod vector. Three stages: chronic renal carriage in the maintenance host (PMID:34495971 for the Norway rat reservoir role and for the study's own biofilm result in naturally infected wild rats; PMID:34784354 for the review's synthesis naming rodents and cattle as commonest reservoirs), urinary shedding into water and soil (PMID:34784354 renal-tubule-to-urine sentence naming cattle, rodents, pigs, dogs, sheep and goats), and human infection as an accidental host (PMID:29621837, snippet copied from the transmission block with its HUMAN_CLINICAL grading unchanged; PMID:24277745 for the animal-to-human direction). Block evidence PMID:34495971 frames the rodent reservoir of the agent that causes human leptospirosis. Two new references fetched: PMID:34495971 and PMID:34784354. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders.

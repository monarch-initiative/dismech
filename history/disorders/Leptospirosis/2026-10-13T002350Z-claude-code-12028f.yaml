  summary: Bind the Leptospira IgM screening serology as a LOINC measurement
  details: |
    Added measurements: LOINC:23202-5 (Leptospira sp IgM Ab [Presence] in Serum) to the existing Preliminary serologic screening diagnosis row. An earlier version of this record bound LOINC:99011-9 (Leptospira sp Ab panel - Serum by Agglutination, the microscopic agglutination test / MAT) to this row; review on PR #13974 caught that the row's only source, DOI:10.1371/journal.pntd.0012449, states the preliminary test was explicitly not MAT ("a positive preliminary IgM serological test (dual path platform (DPP) or ELISA)") and places MAT on the confirmatory side instead, so the original binding named the reference confirmatory test rather than the screening test the row actually describes. Corrected to a method-unspecified, genus-level IgM identity code (found via Monarch KG search for "Leptospira IgM"; LOINC:23202-5 "Leptospira sp IgM Ab [Presence] in Serum" covers both DPP and ELISA without asserting either method), matching what the source says the preliminary test is. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch7 (LOINC_DIAGNOSTICS.md tranche B).

  summary: Create Dry Eye Disease entry
  details: |
    Created a standalone Dry Eye Disease entry mapped to MONDO:0006733. Modeled current TFOS DEWS III multidriver tear-film and ocular-surface homeostasis mechanisms at entry level because no existing ocular-surface module fits and one entry does not justify a new generic module. Curated diagnosis and driver-directed management, and represented the issue carbon-monoxide nanoplatform strictly as a murine preclinical intervention with an explicit human-translation gap. References were fetched only with just fetch-reference; evidence snippets and ontology terms were validated proportionately.

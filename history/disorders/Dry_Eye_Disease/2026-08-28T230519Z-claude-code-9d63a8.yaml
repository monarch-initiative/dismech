    # Review: Dry Eye Disease

    - **File:** `/home/user/dismech/kb/disorders/Dry_Eye_Disease.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical snippet audit:** `dismech.reference_snippet_audit` — **75/75 snippets verified** against cached references. No unverified snippet.

    ## Verdict: MINOR_ISSUES

    No claim-fidelity or misclassification finding rises to MAJOR. This is a careful, well-hedged entry: the multidriver hypothesis framing is explicit, the TFOS DEWS III consensus reports carry the structural backbone, model-system and in-vitro evidence are correctly separated by `evidence_source`, and several `explanation` fields volunteer their own limits ("cross-sectional design prevents a stronger causal claim", "does not establish human benefit"). The findings below are snippet-selection and hedging issues, not fabrications.

    ## Findings

    ### 1. MINOR — a mouse-model *design* sentence is presented as an experimental demonstration
    - **Location:** `environmental` → "Low Ambient Humidity or Airflow" → `influences_mechanisms[target: Tear-Film Instability and Hyperosmolarity]`; `PMID:35681232`; `evidence_source: MODEL_ORGANISM`
    - **Entry claims:** node description — "controlled low-humidity mouse models **directly demonstrate** excessive tear-film evaporation"; explanation — "The controlled-environment mouse model **demonstrates** excessive tear-film evaporation as the intermediate produced by low humidity."
    - **What the paper says:** the quoted sentence sits in the *Introduction*, describing how a published model is constructed, and is itself cited to reference [27]: "To induce severe, irreversible DED, some researchers injected mice with scopolamine and housed them in a controlled environment chamber (CEC) with room temperature and relatively low humidity [27]. Administration of scopolamine reduces aqueous tear production and the low humidity environment causes excessive evaporation of the tear film. This desiccating stress (DS)-induced animal model is regarded as a mixed evaporative and aqueous tear-deficient dry eye model [27]."
    - **Why it matters:** the sentence states the premise on which a model is built, not a result measured in it. "Demonstrates" upgrades a background description (secondary to ref [27]) into experimental evidence. The IL-20 paper does report its own desiccating-stress mouse experiments, so a result sentence was available.

    ### 2. MINOR — an abstract's opening framing sentence is the only evidence on a causal edge
    - **Location:** `pathophysiology` → "Ocular-Surface Osmotic and Oxidative Stress" → `downstream[target: Ocular-Surface Innate and Adaptive Inflammation]`; `PMID:42439592`; `evidence_source: MODEL_ORGANISM`
    - **Entry claims:** "Reactive oxygen species and inflammatory signaling can reinforce one another in experimental DED."
    - **What the paper says:** the quote — "Dry eye disease (DED) is a multifactorial ocular disorder driven by a reinforcing cycle of oxidative stress, inflammation, and epithelial damage, rendering single-target therapies ineffective." — is the first sentence of the abstract, a general premise motivating the study. The murine work that follows tests a CO-releasing nanoplatform; it reports no experiment isolating the ROS→inflammation direction.
    - **Why it matters:** a background assertion is carrying a mechanistic causal edge on its own, and `MODEL_ORGANISM` attaches an animal-data label to a sentence with no animal data behind it. The explanation ("frames … as a reinforcing experimental disease circuit") is honest about the word "frames", which keeps this minor.

    ### 3. MINOR — explicitly hedged hypotheses quoted to support `INDIRECT_KNOWN_INTERMEDIATES` edges
    - **Location:** `pathophysiology` → "Blink and Lid-Closure Abnormality" → `downstream[target: Tear-Film Instability and Hyperosmolarity]`, and `environmental` → "Prolonged Digital Screen Use" → `influences_mechanisms`; both `PMID:34531649`
    - **Entry claims:** explanations call altered blinking "the **known** intermediate"; both edges are typed `INDIRECT_KNOWN_INTERMEDIATES`.
    - **What the paper says:** "A commonly accepted **hypothesis** for the relationship between digital screen use and dry eye disease is that digital screen use changes blinking dynamics, leading to ocular dryness." and "The most prevalent **hypothesis** to explain the link between digital screen use and dry eye is digital screen use influences blinking dynamics by reducing both blink rate and blink completeness, leading to increased ocular surface dryness."
    - **Why it matters:** the source twice marks this as the field's leading hypothesis, not an established intermediate. Either soften the explanations or use `INDIRECT_UNKNOWN_INTERMEDIATES`, as the entry already does elsewhere (contact lenses, medications) where the consensus does not resolve a route.

    ### 4. MINOR — prevalence range sourced from a trial's introductory citation, and `measure_type` is asserted beyond the quote
    - **Location:** `prevalence` → "Adults worldwide"; `PMID:40146145`; `evidence_source: HUMAN_CLINICAL`
    - **Entry claims:** `measure_type: POINT_PREVALENCE`, `rate_per_100000: 27500.0` (bounds 5,000–50,000).
    - **What the paper says:** "The prevalence of DED among adults worldwide ranges from 5% to 50%.[1]" — an introduction sentence in a 0.05% cyclosporine formulation-comparison RCT, itself citing another work. The trial contributes no epidemiological data, and the sentence does not say *point* prevalence.
    - **Why it matters:** `evidence_source: HUMAN_CLINICAL` is technically right for the publication type, but the quoted claim is second-hand and the measure type is a curator inference. TFOS DEWS III has a dedicated epidemiology report that would key this directly. The `notes` field is commendably explicit that the midpoint is derived, not sourced.

    ### 5. MINOR — human evidence available in the cited paper was not used for a node supported only by in-vitro/mouse quotes
    - **Location:** `pathophysiology` → "Ocular-Surface Osmotic and Oxidative Stress"; both node-level items are `PMID:34575438` (`IN_VITRO` + `MODEL_ORGANISM`)
    - **Entry claims:** oxidative injury of corneal epithelium is a contributor in human DED (node description is properly hedged: "a contributor within a heterogeneous network, not a universal single cause").
    - **What the paper says:** the same cached full text contains a human sentence one clause earlier — "elevated levels of oxidative stress have been identified in patients with dry eye disease [5,6], while hyperosmolar conditions cause oxidative stress in cultured corneal epithelial cells [7]." The entry quoted only the cultured-cell half and, separately, the mouse result.
    - **Why it matters:** the repo rule is that model/in-vitro evidence should not be the sole support for a human claim. The node is a mechanism node rather than a human phenotype, and the explanations disclose the scope limits, so this is a strengthening opportunity rather than a defect.

    ### 6. MINOR (non-evidence) — `PARTIAL` exposure terms on pathograph-linked exposures
    - **Location:** `environmental` → "Prolonged Digital Screen Use", "Low Ambient Humidity or Airflow", "Contact Lens Wear"
    - Each carries an `exposure_term` with a free-text `preferred_term` and no `term:`, while `influences_mechanisms` puts them on the pathograph. Two others in the same file *are* bound (`ECTO:8000036`, `ECTO:0000509`). This is what `just environmental-term-audit` classifies `PARTIAL`; flagged for completeness, not as an evidence-fidelity issue.

    ## Things checked and found correct (worth recording)

    - **`evidence_source` grading is consistent throughout.** No sentence is graded with two different `evidence_source` values anywhere in the file (checked programmatically). TFOS DEWS III consensus reports and narrative reviews → `OTHER`; the cyclosporine RCT and the Taiwanese NO₂ population study → `HUMAN_CLINICAL`; the murine CO study → `MODEL_ORGANISM`; `PMID:34575438` correctly split into `IN_VITRO` (cultured-cell result) and `MODEL_ORGANISM` (mouse desiccating-stress result) on two different sentences.
    - **No Named Entity Confusion.** Sjögren-associated ADDE is modeled as an etiologic DED form with the systemic disease held out as a separate `differential_diagnoses` entry, and the ORPHA:289390 definition quote is exact and correctly scoped.
    - **No title-as-finding snippets.** Every quote is a body/abstract sentence.
    - **The preclinical CO nanoplatform is correctly quarantined** — treatment name carries "(Preclinical)", the description states human safety and efficacy are unestablished, all four evidence items are `MODEL_ORGANISM`, and a `HUMAN_MODEL_MISMATCH` discussion is attached. The 84% epithelial-recovery and 5-day figures match the abstract exactly.
    - **The cyclosporine treatment description does not overstate the trial** — it says explicitly that the trial "did not compare cyclosporin with placebo or establish benefit for all DED forms", which matches a formulation-comparison design.
    - **The NO₂/humidity study's female-only Taiwanese scope is preserved** in the description, the explanation, and the effect wording.
    - **The TFOS DEWS III diagnostic cutoffs are quoted verbatim** (OSDI-6 ≥4, NIBUT <10 s, ≥308 mOsm/L or >8 mOsm/L interocular, >5 corneal / >9 conjunctival spots, lid margin ≥2 mm × ≥25%), with no numeric drift into the `results` field.


  summary: 'Create: Hereditary Multiple Osteochondromas (MONDO:0005508)'
  details: |
    New entry curated from the Edison Falcon deep-research report research/Hereditary_Multiple_Osteochondromas-deep-research-falcon.md with report DOIs resolved to PMIDs through PubMed and all snippets quoted from cached abstracts; the GeneReviews chapter PMID:20301413 is tagged and its clinical characteristics are covered. Ten-node pathograph: germline heterozygous loss-of-function in EXT1 or EXT2, reduced EXT1-EXT2 heparan sulfate copolymerase activity, systemic heparan sulfate insufficiency, somatic second hit in growth-plate chondrocytes, disrupted heparan-sulfate-dependent morphogen signalling (Indian hedgehog range, BMP and FGF handling), loss of perichondrial border function with ectopic chondrogenesis, osteochondroma formation by ectopic endochondral ossification, growth-plate tethering with disturbed longitudinal growth, mechanical impingement, and malignant transformation of the cartilage cap. Lump/split: the disease-level term MONDO:0005508 carries EXT1 (MONDO:0007585, the claim and stub key) and EXT2 (MONDO:0007586) as has_subtypes because the mechanism is identical at every node and the genes encode the two halves of one enzyme; the historical EXT3 locus is mentioned only; Langer-Giedion syndrome is a separate entry; metachondromatosis (PTPN11) is a differential and the 2024 PTPN11 finding in osteochondroma-only probands is recorded as an open question. Module conformance deliberately not declared: hedgehog_pathway_activation scopes itself to ligand-independent SMO-GLI activation in neoplasms, whereas HMO is a ligand-diffusion-range defect with intact receptor machinery. Secondary peripheral chondrosarcoma is recorded as the malignant complication with a link to the existing Chondrosarcoma entry rather than re-modelled. The palovarotene MO-Ped trial is recorded honestly as stopped. Validated: just validate passed; count-verified-snippets 127/127; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys passed; pytest -k Hereditary_Multiple_Osteochondromas passed. A first attempt at this curation was cut off by a session limit before writing; this record describes the completed second pass.

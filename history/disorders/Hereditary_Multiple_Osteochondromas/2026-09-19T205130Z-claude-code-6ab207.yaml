  details: |
    Addressed the automated review's blocking finding that the entry had no diagnosis section. Added diagnosis with four items: (1) clinical and radiographic diagnosis on the two-or-more-osteochondromas criterion, bound to NCIT:C137876 Bone Radiography and quoting the GeneReviews (PMID:20301413) statement of how the diagnosis is established plus the Bovee 2008 (PMID:18271966) two-lesion criterion and the Borovikov 2024 (PMID:40225915) restatement; (2) cross-sectional imaging (CT for complex sites, MRI for the cartilage cap, ultrasound for superficial caps) bound to NCIT:C16809 MRI, quoting the Bovee T2-weighted MRI cap-measurement sentence and the GeneReviews screening spine MRI dispute, with the ladder itself attributed to the Falcon deep-research report in the description; (3) evaluation of suspected malignant transformation, quoting Gnoli 2024 (PMID:38351015) for the 1.5-2 cm and WHO 2020 greater-than-2 cm cap thresholds and Bovee 2008 for the 1 cm lower bound, with the report's 3 cm paediatric threshold stated as unquoted; (4) EXT1/EXT2 sequencing then deletion/duplication (MLPA) analysis bound to NCIT:C15709 Genetic Testing, quoting GeneReviews, Borovikov (CNV analysis as gold standard, PTPN11 expansion), Gnoli (sequencing-then-MLPA order) and Bovee (MLPA reducing the mutation-negative fraction to under 15 percent). Added biochemical: blood heparan sulfate to chondroitin sulfate ratio (presence DECREASED) bound to NCIT:C540 Heparan Sulfate per the composite-index convention, quoting PMID:23514715, with a READOUT_OF readout link (direction NEGATIVE, endpoint_context DIAGNOSTIC) to the Systemic Heparan Sulfate Insufficiency node. Added differential_diagnoses: solitary osteochondroma (PMID:17341731; no MONDO term exists for the sporadic lesion), metachondromatosis MONDO:0007979, dysplasia epiphysealis hemimelica MONDO:0007489, Ollier disease MONDO:0008145, Maffucci syndrome MONDO:0013808, Langer-Giedion syndrome MONDO:0007874 (new reference PMID:35290978 fetched via just fetch-reference). All NCIT diagnosis terms verified via OLS and present in the TreatmentActionTerm enum cache; MONDO terms verified via OLS and added to the term and enum caches by validate-terms. Validation: just validate passed; count-verified-snippets 164/164; validate-terms passed; normalize-cache clean; check-entity-refs, check-causal-targets, check-enum-values OK; check_snippet_length, check-snippet-grading and check-title-snippets report no new findings; validate-disorders passed.

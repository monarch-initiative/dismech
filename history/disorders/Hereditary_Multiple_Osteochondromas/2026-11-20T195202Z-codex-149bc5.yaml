  summary: Map Exostoses, multiple to OMIMPS:133700
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS133700 is the hereditary multiple osteochondromas clinical concept represented by this Disease. The January 2026 OMIM snapshot contains EXT1-related type 1, EXT2-related type 2, and the historical type 3 locus record OMIM:600209; MONDO:0005508 has the same three children. The curated EXT1/EXT2 mechanisms converge on deficient heparan sulfate synthesis and ectopic growth-plate cartilage. ExactMatch aligns the syndrome concept rather than claiming that its two molecularly characterized subtypes exhaust the historical series. It does not assign the EXT1/EXT2 mechanism to the unresolved type 3 locus, identify EXT3 as a cloned gene, or include solitary osteochondroma and all disorders with exostoses.

  summary: Record explicit non-membership of the digenic grouping, with the deflating
    evidence
  details: |
    OLIDA scores the cystinuria variant combination at its maximum confidence, which would make it a mechanical import candidate for the Digenic_and_Oligogenic_Disorders grouping. Reading the primary source contradicts that: the International Cystinuria Consortium (PMID:15635077) found the digenic type AB genotype in two of 164 families and reported its contribution limited to aminoaciduria values, a partial biochemical phenotype, rather than to the stone-forming disease. Added that finding as PARTIAL evidence and extended the inheritance block description to state that no digenic term is bound and why. This entry is the worked caution cited in the grouping's OLIDA discussion: a high database confidence score rates the variant combination, not the claim that the disease requires two loci. Reference newly fetched and cached. Validated with linkml-validate and count-verified-snippets.

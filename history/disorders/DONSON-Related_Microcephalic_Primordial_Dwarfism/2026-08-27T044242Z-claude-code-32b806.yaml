  summary: 'Create: DONSON-Related Microcephalic Primordial Dwarfism'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0200 (OMIM 251230 and 617604), a row that already lumps microcephaly-micromelia syndrome and MISSLA. Bound to the MONDO spectrum term MONDO:0035534 rather than either leaf for that reason. Two mechanisms are curated as parallel downstream nodes rather than in sequence, because the literature does not order them: replication fork protection with nucleolytic collapse of stalled forks and impaired ATR signalling (PMID:28191891, 2017), and CMG helicase assembly (PMID:37781960, 2023), the latter being what makes DONSON the thirteenth Meier-Gorlin gene. A KNOWLEDGE_GAP records that the two have never been reconciled and that it is unknown which accounts for the phenotypic range. The classification note flags that dismech also curates DONSON as a Meier-Gorlin gene, and that both placements are in group 21 so nothing turns on the choice. One phenotype is curated with supports REFUTE against the neurodevelopmental-abnormality class to record normal intellect as a positive negative finding. A title-derived snippet was caught and replaced with a real abstract sentence before commit, and a reference title corrected against the cache. Validation: just validate-disorders passes, 19/19 snippets verified.

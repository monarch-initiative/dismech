  summary: Wire phenotypes into the pathograph (6/8 connected)
  details: |
    Pathograph-connectivity pass over ISDS group 21. The dismech QC plugin dismech.qc_plugins scores phenotype causal-inlink coverage: whether each phenotype node is reached by a causal edge from the mechanism graph. Across the group the baseline was 3/192 (1.6%) - the pathophysiology chains ended at organism-level consequence nodes and never reached the phenotype nodes, so almost every phenotype rendered as a disconnected node. Wired microcephaly, growth and the skeletal features off the progenitor-proliferation node. Ichthyosis (a single-case phenotype expansion) and normal intellect (a deliberate negative finding) are left unwired, correctly - a negative finding should have no causal parent. Every added edge carries a description; where the route is inferred rather than demonstrated the description says so, and several carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES. Validation: just validate-disorders passes across all 15 group-21 files, 567/568 snippets verified.

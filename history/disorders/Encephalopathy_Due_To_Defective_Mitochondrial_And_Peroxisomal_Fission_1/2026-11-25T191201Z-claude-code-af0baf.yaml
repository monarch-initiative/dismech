  summary: 'Create: Encephalopathy Due To Defective Mitochondrial And Peroxisomal
    Fission 1'
  details: |
    New entry for EMPF1 (MONDO:0013726), the DNM1L/DRP1 fission disorder and sibling of the existing MFF entry (EMPF2). DNM1L is typed CAUSATIVE (germline; autosomal dominant de novo dominant-negative missense, and rare biallelic forms). The pathograph runs from impaired DRP1 assembly and GTP-driven constriction (GO:0003924 DECREASED; PMID:29899447 for the GTP-driven ring constriction, PMID:27145208 and PMID:17460227 for the dominant-negative patient alleles) to failed mitochondrial and peroxisomal fission (GO:0000266, GO:0016559; PMID:17460227, PMID:27328748) and neuronal dysfunction, with nine HP-bound phenotypes from the founding case (PMID:17460227), the later-onset status-epilepticus presentation (PMID:27145208), the biallelic family (PMID:27328748) and an 18-patient cohort (PMID:42687971). Lactic acidaemia carries a refuting item because the biallelic family had none. ClinGen's Definitive DNM1L assertion is for the parent class MONDO:0054865 and is not recorded on this entry. The name drops the MONDO label's word lethal because the later reports describe long survivors; the MONDO label is kept as a synonym. The EMPF1 stub was removed; optic atrophy 5 (MONDO:0012543), the allelic DNM1L optic atrophy, remains a separate stub.

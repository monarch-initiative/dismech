  details: |
    Second review round on PR #12044. Two IMPORTANT findings and one suggestion, all in the
    phenotypes section, plus a branch refresh.

    IMPORTANT 1 - Thick lips carried frequency FREQUENT while its own description said the feature is
    scored positive in all six patients, and Table I reads six of six. Corrected to VERY_FREQUENT. The
    band was left behind when round 1 split the combined eyelids-and-lips phenotype in two: the
    description was rewritten and the frequency slot was not.

    IMPORTANT 2 - Frontal bossing's frequency slot read VERY_FREQUENT while an evidence explanation two
    lines below said 'Graded FREQUENT rather than VERY_FREQUENT because it is described as typical
    rather than defining, and no denominator is given.' Round 1 changed the slot and did not touch the
    prose arguing for the old value. The explanation is rewritten to say what that sentence actually
    establishes, which is that it carries no denominator.

    Both are the same defect the round-1 review found four instances of in this entry, and the round-2
    review of PR #12040 found one instance of: prose and structure disagreeing inside one file, with
    nothing that compares them. The difference here is that round 1's own fixes introduced two of them.

    Both phenotypes, and Hypertelorism which had the same thin sourcing, now carry the
    common-findings sentence and their Table I row as evidence, matching the pattern every other
    all-patient craniofacial phenotype in this entry uses. Their descriptions were also thin
    placeholders from the original entry and are rewritten.

    Suggestion taken: the Hypermyelinated retinal nerve fibers description now states which rule set its
    band. That phenotype is graded on the source's own word 'uncommon ophthalmic finding' rather than
    arithmetically, because its row has two not-done patients and the arithmetic lands in a different
    band depending on the denominator; glaucoma and keratopathy are graded arithmetically because their
    rows are scored in every patient. Stating the rule is what the review asked for.

    Branch refreshed onto origin/main. Three whole-KB gates - check-snippet-length, check-title-snippets
    and check-reference-titles - had started reporting findings in Epidermolysis_Bullosa, Meningioma,

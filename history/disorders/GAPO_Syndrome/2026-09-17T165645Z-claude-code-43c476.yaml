    exposed references') landed on main after this branch was cut and repaired exactly those snippets.
    So the branch's older copies read as new findings against an advanced baseline. Rebasing onto
    current main cleared all three. The post-refresh diff was reviewed and contains only this PR's
    fifteen files with no unrelated deletions or reversions.


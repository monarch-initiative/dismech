  summary: 'Review round 1: correct a false negative claim, fix optic atrophy frequency,
    mine TABLE I'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #12044 in one push: two CRITICAL
    findings, four IMPORTANT ones, and the suggestions. The reviewer diagnosed one root cause behind
    all of them and was right: the entry was curated from the abstract of PMID:25045128 while the PR
    committed that paper's PMC full text and TABLE I.

    CRITICAL 1 - frequency: VERY_FREQUENT on Optic atrophy was contradicted by the entry's own cited
    source. Changed to OCCASIONAL. TABLE I scores optic atrophy positive in one of six patients,
    negative in three and not done in two, and the same paper states it is not a consistent feature of
    the disorder. Both are now quoted as evidence. The supporting quote that was there before is the
    acronym expansion, which establishes that the feature is named and nothing about how often it is
    present; it is kept with an explanation that says so.

    CRITICAL 2 - the claim that no source proposes a route from matrix accumulation to optic nerve
    damage was false and was asserted in four places: the disease description, the downstream edge, the
    notes, and the gapo_optic_atrophy_mechanism rationale. The cached full text states that optic nerve
    pathologies are potentially secondary to physical compression of the nerve by accumulated
    extracellular matrix and thickening of the surrounding dura. All four places rewritten. The edge is
    now INDIRECT_KNOWN_INTERMEDIATES with that sentence as its evidence, and the knowledge gap is
    narrowed to the real problem: a compressive lesion produced by matrix that accumulates with age
    predicts a progressive and near-universal deficit, and the feature is present in one of six patients
    while glaucoma, which is not in the acronym, is present in four.

    IMPORTANT 3 - gapo_neopeptide_allele said neither protein was measured. Contradicted by the
    statement that all three originally reported alleles produce null alleles as confirmed by functional
    studies in patient fibroblasts, and by immunohistochemistry showing complete loss of the ANTXR1
    isoform. Rationale rewritten and both sentences attached as evidence. The residual question is
    narrower and is an assay question: an antibody reporting loss of the normal isoform does not
    establish that no truncated neopeptide-bearing species is made.

    IMPORTANT 4 - gapo_alopecia_route said no located source makes the dermal-matrix argument. The
    knock-out mouse's matrix excess is localised to the skin at the basal aspects of the hair follicles
    specifically. Rationale rewritten, evidence attached, and the gap restated as the step from
    peri-follicular accumulation to hair loss rather than as an absence of anyone looking.

    IMPORTANT 5 - animal model limitations claimed the source reports the recapitulation in a single
    sentence without naming the features assessed. It enumerates skin, endometrium, ovaries, periosteum,
    cranial sutures and the periodontal ligament of the incisors. Rewritten around that enumeration, the
    enumeration attached as evidence, and two typed divergences added: BOUNDARY_OMISSION (neither optic
    nerve nor hair loss is reported, which are exactly this entry's two weakest edges) and
    SPECIES_MISMATCH (mild to moderate matrix increase in the mouse against a human phenotype that
    prevents tooth eruption outright).

    IMPORTANT 6 - phenotype coverage went from 7 to 28. Added from TABLE I with per-row or
    common-findings-sentence quotes: relative macrocephaly, low-set ears, protruding ears, thickened
    eyelids, sparse eyebrows, sparse eyelashes, depressed nasal bridge, short nose, anteverted nares,
    long philtrum, micrognathia, delayed closure of the anterior fontanel, delayed bone age, breast and
    nipple hypoplasia, umbilical hernia (all VERY_FREQUENT or as scored), glaucoma 4/6, keratopathy 3/6,
    hypermyelinated retinal nerve fibers 2/6, and from the wider literature dilated cardiomyopathy,
    pulmonary hypertension and bilateral sensorineural deafness. Frontal bossing and hypertelorism moved
    from FREQUENT to VERY_FREQUENT on the six-of-six rows. New progression phase for visceral
    involvement and premature death, with the two reported deaths.

    Suggestions: Thick lips rebound from HP:0000179 (lower lip only, under a preferred term that also
    covered eyelids) to HP:0012471 Thick vermilion border, with the eyelid finding split out as its own
    phenotype. GO:0030198 modifier changed from DECREASED to DYSREGULATED on an accumulation node; the
    reviewer suggested ABERRANT, which is not a ModifierEnum value. The tooth ankylosis suggestion was
    declined: HP:0006481 is Abnormal primary tooth morphology, not tooth ankylosis (that is HP:0033791),
    and no cached reference or the deep-research report mentions ankylosis at all. A notes paragraph
    records that the absent treatments: and diagnosis: sections are an unsearched gap rather than a
    searched and empty one, because the deep-research run stopped at section 8.

    Three edges wired where a source names an intermediate: thickened eyelids and thick lips from the
    subcutaneous-accumulation-with-age sentence, and delayed fontanel closure from the mouse's cranial
    suture finding. The other 21 new phenotypes are left with no incoming edge and a fourth knowledge
    gap, gapo_craniofacial_gestalt, records why: a generalised accumulation predicts diffuse thickening
    and does not predict a reproducible pattern of proportions and positions.

    One phenotype carries a reference with no snippet, which is deliberate and explained in place.
    Dilated cardiomyopathy is named in the cached review only inside a sentence that interleaves a
    bracketed citation after every list item, and the reference validator strips bracketed spans before
    matching, so no contiguous span covers it. The primary case report PMID:19206158 was fetched and has
    no abstract in PubMed. Citing it without a snippet is better than quoting a title as a finding or
    dropping a real phenotype.

    Validation: linkml-validate clean, linkml-term-validator clean, 74/74 snippets verified (was 26/26),
    validate-disorders clean, check-entity-refs / causal-targets / duplicate-keys / qualifier-terms /
    enum-values / case-collisions / snippet-grading / title-snippets / snippet-length / folded-hyphens /
    reference-titles all OK, check-genereviews still NO_CHAPTER. Phenotype causal connectivity 7/28,
    which is lower as a percentage than the 4/7 before because the denominator is now the real one.

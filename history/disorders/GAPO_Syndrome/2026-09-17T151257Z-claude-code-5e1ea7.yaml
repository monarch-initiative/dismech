  summary: 'Create: GAPO Syndrome (ANTXR1)'
  details: |
    De-novo curation of GAPO syndrome (MONDO:0009263), biallelic ANTXR1 loss of function, from a Perplexity sonar-deep-research run (research/GAPO_Syndrome-deep-research-perplexity.md, 369s, 17 citations). The report was a lead only; all three references were sourced independently through PubMed esearch and every CURIE was looked up in the step it was written.

    One term needed a source outside the usual path: ANTXR1 has no row in the repository's cache/hgnc/terms.csv, so hgnc:21014 was read from the HGNC REST API (rest.genenames.org/fetch/symbol/ANTXR1) rather than written from memory or taken from the report.

    The entry is built around how far the founding paper's proposal actually reaches. That proposal - that GAPO is a generalized defect in extracellular-matrix homeostasis - is quoted as a proposal because that is how its authors state it, and the causal edges are typed to show its reach. It reaches furthest for pseudoanodontia, which is INDIRECT_KNOWN_INTERMEDIATES: the teeth are formed and fail to erupt, which is what a clearance defect predicts and what the Antxr1-mutant mouse reproduces alongside the matrix accumulation itself. It reaches least far for the optic atrophy, one of the four features the syndrome is named for, where no located source proposes any route from accumulated matrix to progressive optic nerve damage; that edge and the alopecia edge are INDIRECT_UNKNOWN_INTERMEDIATES and each carries a KNOWLEDGE_GAP. A third gap records that the c.1435-12A>G splice allele's 118-residue neopeptide is a different molecular event from nonsense-mediated decay and that neither protein was measured - both source words are predictions.

    Two source discrepancies are preserved rather than resolved. The founding paper calls the fourth feature 'progressive visual impairment' while later sources call it 'progressive optic atrophy'; these are not synonyms (symptom versus finding), so the HPO binding follows majority usage and the description records the difference. The case counts differ between sources (about 35 in 2014, about 30 in 2016) and both are quoted rather than averaged, because averaging would imply a precision the literature does not have.

    Two snippets had to be shortened because the reference validator strips bracketed spans before matching: the founding genotype sentence carries a bracketed protein change per variant, and the multi-system sentence interleaves per-system citation markers. In both cases the quote was trimmed to a clean substring and the dropped content moved into the explanation and into genetic[].variants, rather than the claim being dropped.

    Validation: just validate passed; 26/26 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-title-snippets all OK; 4 of 7 phenotypes causally connected (57.1%) - the three craniofacial features are deliberately left unconnected because no located source ties them to the matrix node. just check-genereviews reports NO_CHAPTER, recorded in the entry's notes.

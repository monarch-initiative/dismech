  summary: Wired the entire Progressive Muscular Atrophy causal graph across TDP-43 proteinopathy, lower
    motor neuron degeneration, and skeletal muscle denervation, added evidence to EMG Neuropathic Changes,
    and added Reduced vital capacity phenotype.
  details: Added GO:0003677 (DNA binding) molecular function to TDP-43 Proteinopathy and wired causal
    downstream edges from TDP-43 Proteinopathy to Lower Motor Neuron Degeneration, from Lower Motor Neuron
    Degeneration to Skeletal Muscle Denervation and Atrophy, Motor Neuron Atrophy, Fasciculations, Areflexia,
    Dysphagia, and Phenotypic Conversion to ALS Spectrum, and from Skeletal Muscle Denervation and Atrophy
    to Muscle Weakness, Skeletal Muscle Atrophy, EMG Neuropathic Changes, and Reduced vital capacity.
    Added PMID:19917992 evidence to the EMG Neuropathic Changes diagnostic entry and added a new Respiratory
    phenotype for Reduced vital capacity (HP:0002792) supported by PMID:17420313 and PMID:19917992.

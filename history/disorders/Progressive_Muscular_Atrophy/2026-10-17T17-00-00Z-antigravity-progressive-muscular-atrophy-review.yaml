  summary: Wired the Progressive Muscular Atrophy causal graph across TDP-43 proteinopathy, lower motor
    neuron degeneration, and skeletal muscle denervation, added GO:0003723 (RNA binding) on TDP-43 Proteinopathy,
    removed misplaced GO:0097049 from Skeletal Muscle Denervation and Atrophy, and added the Reduced vital
    capacity phenotype.
  details: Added synonym progressive spinal muscular atrophy, annotated GO:0003723 (RNA binding, LOSS_OF_FUNCTION)
    molecular function on TDP-43 Proteinopathy, removed misplaced GO:0097049 (motor neuron apoptotic process)
    from Skeletal Muscle Denervation and Atrophy, and wired causal downstream edges from TDP-43 Proteinopathy
    to Lower Motor Neuron Degeneration and Phenotypic Conversion to ALS Spectrum, from Lower Motor Neuron
    Degeneration to Skeletal Muscle Denervation and Atrophy, Motor Neuron Atrophy, Fasciculations, Areflexia,
    and Dysphagia, and from Skeletal Muscle Denervation and Atrophy to Muscle Weakness, Skeletal Muscle
    Atrophy, EMG Neuropathic Changes, and Reduced vital capacity. Added a Respiratory phenotype for Reduced
    vital capacity (HP:0002792) supported by PMID:17420313 and PMID:19917992.

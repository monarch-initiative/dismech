  summary: Create H Syndrome
  details: |
    New de-novo entry for H syndrome MONDO:0011273, SLC29A3-hENT3 autosomal recessive histiocytosis, prototype of the SLC29A3 spectrum disorder. Curated research-first from primary PubMed literature with all 40 evidence snippets verified as exact substrings of cached abstracts. Key PMIDs 18940313 founding, 20140240 SLC29A3 spectrum, 19336477 PHID insulin, 20595384 functional hENT3, 29041934 US series tocilizumab, 37638031 tocilizumab, plus review-driven additions 38263041 TLR7-interferon/baricitinib, 31270333 autophagy AMPK-mTOR-ULK stem-cell mouse mechanism, 33029882 mycophenolate mofetil. Deep research: claude_code provider report generated and consumed (research/H_Syndrome-deep-research-claude_code.md, 29 citations); OpenScientist run also submitted this session; Falcon fallback unavailable due to Edison API credit exhaustion 402. No GeneReviews chapter exists for SLC29A3 H syndrome per PubMed. Content is a 5-node pathophysiology chain (hENT3 deficiency, histiocyte activation, cutaneous fibrosis/multiorgan, lysosomal TLR7/type I interferon, impaired autophagy/adult stem-cell deficits), 13 phenotypes, SLC29A3 genetics, AR inheritance, prevalence, four treatments (corticosteroid, tocilizumab, baricitinib, mycophenolate mofetil) with target_mechanisms links, Harrison classification, and a KNOWLEDGE_GAP on the transporter-to-phenotype link. A pre-PR red-team review (dismech-pr-review) was run and its blocking items addressed. Validated with just validate PASS and weighted compliance 98 percent.

  summary: Create H Syndrome
  details: |
    New de-novo entry for H syndrome MONDO:0011273, SLC29A3-hENT3 autosomal recessive histiocytosis, prototype of the SLC29A3 spectrum disorder. Curated research-first from primary PubMed literature with all 45 evidence snippets verified as exact substrings of cached abstracts. Key PMIDs 18940313 founding-genetic, 18410979 founding-clinical/pathognomonic patch, 20140240 SLC29A3 spectrum, 19336477 PHID insulin, 20595384 functional hENT3, 29041934 US series tocilizumab, 37638031 tocilizumab, 38263041 TLR7-interferon/baricitinib/hydroxychloroquine, 31270333 autophagy AMPK-mTOR-ULK stem-cell mouse mechanism, 33029882 mycophenolate mofetil, 37738562 TLR-MAPK/MEK-inhibitor, 22174130 ENT3-null mouse efferocytosis/lysosomal-pH histiocytosis. Deep research: two providers run this session and consumed - claude_code (research/H_Syndrome-deep-research-claude_code.md, 29 citations) and OpenScientist (research/H_Syndrome-deep-research-openscientist.md, 27 citations); Falcon fallback unavailable due to Edison API credit exhaustion 402. All DR-surfaced PMIDs/snippets independently verified before use. No GeneReviews chapter exists for SLC29A3 H syndrome per PubMed. Content is a 5-node pathophysiology chain (hENT3 deficiency, histiocyte activation with defective efferocytosis, cutaneous fibrosis/multiorgan, nucleoside-sensing TLR/MAPK/interferon, impaired autophagy/adult stem-cell deficits), 14 phenotypes, SLC29A3 genetics, AR inheritance, prevalence, six treatments (corticosteroid, tocilizumab, baricitinib, mycophenolate mofetil, MEK inhibitor, hydroxychloroquine) with target_mechanisms links, Harrison classification, and a KNOWLEDGE_GAP on the transporter-to-phenotype link. A pre-PR red-team review (dismech-pr-review) was run and its blocking items addressed; OpenScientist findings integrated afterward. Validated with just validate PASS and weighted compliance 97 percent.

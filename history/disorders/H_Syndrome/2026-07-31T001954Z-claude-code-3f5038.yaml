  details: |
    New de-novo entry for H syndrome MONDO:0011273, SLC29A3-hENT3 autosomal recessive histiocytosis, prototype of the SLC29A3 spectrum disorder. Curated research-first from primary PubMed literature with all 32 evidence snippets verified as exact substrings of cached abstracts. Key PMIDs 18940313 founding, 20140240 SLC29A3 spectrum, 19336477 PHID insulin, 20595384 functional hENT3, 29041934 US series tocilizumab, 37638031 tocilizumab. Deep research provider OpenScientist run submitted this session. Falcon fallback unavailable due to Edison API credit exhaustion 402. No GeneReviews chapter exists for SLC29A3 H syndrome per PubMed. Content is a 3-node pathophysiology chain, 12 phenotypes, SLC29A3 genetics, AR inheritance, prevalence, corticosteroid and tocilizumab treatments, Harrison classification, and a KNOWLEDGE_GAP on the transporter-to-phenotype link. Validated with just validate PASS and weighted compliance 100 percent.

  summary: Address PR #7242 review (ai4c-reviewer)
  details: |
    Addressed the changes_requested review on PR #7242. Fixed the factual inversion: hypogonadism is hypergonadotropic/primary (HP:0000815, PMID:18410979 "hypergonadotropic hypogonadism with azoospermia"), not hypogonadotropic. Made the pathograph a single connected component: added downstream edges from the TLR-MAPK/interferon node to Histiocyte Activation (PMID:37738562 MEK-inhibitor resolution) and from the autophagy/stem-cell node to Cutaneous Fibrosis/Multiorgan (PMID:31270333). Split the mixed-source PMID:37738562 evidence into an IN_VITRO mechanism item and a HUMAN_CLINICAL MEK-response downstream item. Added histopathology (dermal histiocytic/mononuclear infiltrate, PMID:18410979), biochemical (elevated acute-phase reactants and type I interferon score, PMID:38263041), and diagnosis (WES/SLC29A3 sequencing, PMID:29041934) sections. Added 6 phenotypes with verified quotes: Histiocytosis HP:0100727, Cervical lymphadenopathy HP:0025289, Camptodactyly HP:0100490, Azoospermia HP:0000027, Micropenis HP:0000054, Exophthalmos HP:0000520. Enriched the genetic section with variant classes, founder alleles, gnomAD constraint, and modifier evidence (PMID:34657628 intrafamilial variability). Added methotrexate treatment with azathioprine/TNF note (PMID:29041934). Added a HUMAN_MODEL_MISMATCH discussion for the mouse-only autophagy/stem-cell node. Improved the sensorineural hearing-loss citation to PMID:18410979, scoped the IDDM evidence to the PHID pole, added a spectrum-scope note to the description, and removed a stale GO:0140723 cache row. Fetched and verified PMIDs 34657628 and 35495792. All 61 evidence snippets verified as exact substrings; just validate PASS; weighted compliance 95.2 percent.

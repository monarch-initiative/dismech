  summary: 'Review: connect H syndrome''s nineteen detached phenotypes (IUIS Table
    7)'
  details: |
    All nineteen phenotypes had no incoming causal edge. All nineteen attach to the multiorgan node the chain already converged on.

    The pathognomonic lesion is wired first because it is what the syndrome is named for - hyperpigmentation, hypertrichosis and induration co-located in a single plaque - and its three components are also curated separately because they occur outside it.

    The endocrine arm is wired as a chain rather than in parallel: hypergonadotropic hypogonadism is the lesion, and azoospermia and micropenis follow from it, which is why those two are INDIRECT_KNOWN_INTERMEDIATES while the hypogonadism itself is INDIRECT_UNKNOWN. Sensorineural hearing loss carries a note that it is the H of the name most often missed.

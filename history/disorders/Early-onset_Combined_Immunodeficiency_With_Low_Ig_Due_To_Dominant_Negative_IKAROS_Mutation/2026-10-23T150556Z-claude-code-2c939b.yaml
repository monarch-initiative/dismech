  summary: 'Self-review round: evidence re-grading, model split, datasets'
  details: |
    A self-review against the dismech-pr-review skill, run in a fresh context
    before the pull request was opened, found six substantive problems. Each was
    re-checked against the cached sources before being acted on.

    Two were over-claims. The gel-shift evidence item read the 40 to 50 percent
    reduction in the mixed mutant and wild-type condition as the first sign of
    interference with the wild-type protein. It is not: the three mutants in
    that panel include the haploinsufficient R162Q comparator, which exerts no
    dominant-negative effect and behaves the same way, and a halving when half
    the input protein is a non-binder is the dilution expectation. The
    explanation now stops at the loss of DNA binding, the node description says
    why the sentence names three mutants, and the dominant-negative claim rests
    where the paper puts it, on the foci-counting experiment. Separately, a
    differential-diagnosis row asserted full penetrance, where the founding
    paper says a highly or even fully penetrant disease and adds that it cannot
    be formally assessed; since penetrance is the axis that separates this
    class from the dimerization-defective one, that row now hedges as the
    source does.

    One animal-model record was describing two mice. The Plastic strain
    (Ikzf1 H191R, PMID:12871645) carried a RECAPITULATES link to the
    tumour-suppression node evidenced entirely by PMID:7585946, a different
    strain. The Winandy dominant DNA-binding-domain mouse now has its own
    animal_models entry and holds that link; Plastic keeps a
    PARTIALLY_RECAPITULATES link evidenced by the founding paper's own
    comparison to Plastic heterozygotes, which is the only source that connects
    that strain to leukaemia risk in this disease. The Plastic description also
    no longer claims the allele is the same lesion type as N159: the strain's
    own paper calls it recessive and niche-filling while the founding paper of
    this disease calls it dominant-negative, and the description now records
    that disagreement instead of picking a side.

    Four frequency values rested on quotes with no patient denominator.
    VERY_FREQUENT means 80 to 99 percent of patients, and "most of the
    circulating T cells had a naive phenotype" is a proportion of cells.
    The naive and memory T-cell phenotypes now also cite the 2020 review's
    "in all but one patient", which is seven of eight; eosinopenia now quotes
    "undetectable in 6 patients tested" rather than "in all patients tested";
    and the T-cell proliferation phenotype has no frequency at all, since no
    source states how many patients were tested. Sclerosing cholangitis was
    VERY_RARE on a one-in-seven finding, which is 14 percent: it is now
    OCCASIONAL, matching the two other findings in the file on the same
    denominator.

    Three claims the entry made without a citation now carry one, each from a
    sentence already in the cache: the absence of autoimmunity despite the
    regulatory T-cell deficit, the single death about a year after
    transplantation, and the normal mutant protein level in patient cells as
    distinct from transfected ones. The monocyte-to-T-cell edge quoted the
    authors' interpretation; it now quotes the add-back experiment itself, and
    the edge description records that the source leaves the absence of B cells
    open as an alternative. The two uses of a PMID:41424385 sentence that sits
    in the background-framing position of that abstract are now marked
    quote_role: BACKGROUND.

    Two further things the review surfaced. The no_n159_knock_in_model gap now
    names the two near-misses rather than leaving them for a reader to find:
    the Ikzf1 L132P zinc-finger-1 knock-in (PMID:33658297), which the review
    correctly flagged as the one dropped reference with no recorded reason, and
    whose own abstract says it acts by haploinsufficiency and gives a
    CVID-like phenotype, so it models the sibling disease; and the AIOLOS
    p.N160S knock-in at the paralogous residue, which is dominant-negative but
    in another gene. The phenotype for decreased IgE is now wired downstream of
    the B-cell arrest, with the edge description recording that no source
    orders the two and that the founding authors also name defective Th2
    polarization. The review's other wiring suggestion, an edge from the early
    T-cell arrest to the increased double-negative T cells, was declined: the
    organoid block is at the CD4 and CD8 double-negative thymocyte stage while
    the blood finding is in mature double-negative T cells, so the two share a
    marker name rather than a cell, and no source links them. Its optional
    suggestion to split the memory and activation node was also declined, since
    the sibling entry uses the same compound-node style.

    Also added in this round, not from the review: a datasets record for the
    founding cohort's exome deposit, sra:SRP136278, whose accession comes from
    the paper's data-availability statement and whose title is copied from the
    SRA study record, verified with just verify-datasets; and reference_title
    on the four Orphanet evidence items.

    Validation after the round: just validate-disorders passed with 99 of 99
    snippets verified and 102 titles checked. The offline check suite,
    check_gene_activity_grounding.py --against-ref origin/main and
    pytest tests/test_data.py for this entry are all clean.

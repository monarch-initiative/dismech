  summary: 'Review round 1: AIOLOS near-miss cited, mouse-comparison quote re-graded'
  details: |
    Round 1 of review on PR 15347. The reviewer raised one blocking finding
    and three suggestions; that finding is against the sibling entry and is
    recorded in its own history record.

    Taken. The no_n159_knock_in_model rationale named the AIOLOS p.N160S
    knock-in as the paralogous near-miss in prose while the other near-miss it
    names carried an evidence item, so the AIOLOS claim now cites
    PMID:34694366, whose cache file this pull request already carries.

    Taken, and carried slightly further than suggested. The evidence item on
    the Plastic link quoted a clause about the Plastic/+ murine phenotype and
    graded it HUMAN_CLINICAL, with the explanation arguing in prose that the
    grading tracked the patients' lymphopoiesis rather than the mice. The
    reviewer proposed adding quote_role: BACKGROUND and leaving the grading.
    Since evidence_source grades the evidence the quoted text describes, and
    the quoted clause describes only the murine result, which the founding
    paper restates from work it cites rather than having performed, the item
    is now MODEL_ORGANISM with quote_role: BACKGROUND. That is the pair
    CLAUDE.md describes for a quote whose citing paper is not where the
    finding came from, and it removes the need for the explanation to argue
    the grading.

    Declined. The suggestion to split the memory and activation node was
    raised as an observation rather than a defect, and the reviewer said so;
    the sibling entry uses the same compound-node style, so splitting one
    entry would introduce drift rather than remove it. The same suggestion
    was declined in the pre-pull-request self-review for the same reason.

    Validation: just validate-disorders over this entry and the sibling passed
    with 155 of 155 snippets verified and 158 titles checked.

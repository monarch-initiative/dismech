  summary: 'Create: Early-onset Combined Immunodeficiency With Low Ig Due To Dominant
    Negative IKAROS Mutation'
  details: |
    Created the entry for MONDO:0979316, the dominant-negative IKZF1 allele
    class, scoped to p.N159S and p.N159T. Boutboul et al. 2018 (PMID:29889099)
    is the founding cohort and carries most of the entry; it was available as
    full text, so quotes come from the body as well as the abstract. The two
    reviews (PMID:32654692, PMID:33691560) supply the case count, the
    transplant outcomes and the prophylaxis recommendation, each graded with
    quote_role: REVIEW_SYNTHESIS. PMID:41424385 supplies the N159S against
    N159K contrast and the organoid T-cell development result; PMID:7585946
    and PMID:12871645 are the two murine DNA-binding-domain alleles recorded
    as animal models; PMID:35748970 is the IUIS 2022 classification row;
    ORPHA:697414 covers prevalence, inheritance and the gene association.

    Research input: research/Combined_Immunodeficiency_Due_To_Dominant_Negative_IKAROS_Mutation-deep-research-openscientist.md,
    the OpenScientist report preserved on branch
    claude/wonderful-cerf-45m48a-ikzf1dn and cherry-picked onto this branch.
    Its reference validation reports 17 of 17 resolved, and its own term
    validation reports 10 of 24 labels mismatched, so no CURIE was taken from
    it. Every identifier in this entry was looked up through the EBI OLS API in
    the step it was written, and each label copied from what the lookup
    returned. The report's suggested NCIT:C309 and NCIT:C564 for co-trimoxazole
    and immunoglobulin therapy are Biotin and Ifosfamide, which is the defect
    its own validation block names; the entry uses NCIT:C51993 with
    CHEBI:3770, and NCIT:C62710 with NCIT:C2701. Its HP:0012335 for monocyte
    dysfunction is an obsolete folate-metabolism term, and HP:0012177 for
    dendritic cells is a natural killer cell term; monocyte dysfunction is
    carried as a pathophysiology node rather than a phenotype because HPO has
    no term for it, and the dendritic cell phenotype binds HP:0020178 with the
    myeloid subset named in preferred_term.

    What was dropped from the report, with reasons. Its PMID:22982295 (VODI,
    SP110 deficiency) was cited as an illustration of supportive care in an
    unrelated disease, and PMID:38320737 for transplantation in IKAROS
    gain-of-function disease: both are other diseases, so the treatment claims
    cite the two reviews that describe this allele class instead.
    PMID:38579942, PMID:38438084 and PMID:41380100 describe the
    gain-of-function and dimerization-defective classes and were not needed
    once the differential diagnoses cited the papers that compare the classes
    directly. PMID:21548011 and PMID:33122583 concern other DNA-binding-domain
    variants whose dominant-negative status is partial or untested.
    PMID:34155405 and PMID:34694366 are AIOLOS papers: the heterodimeric
    interference proof there is about a different gene, and the founding paper
    demonstrates the interference for IKZF1 itself, so the AIOLOS work added
    no claim this entry needed. PMID:10970879 was not cited because the
    founding paper states the NuRD and pericentromeric background directly.
    The report's own frequency table was not used: frequencies here are
    counted from the cohort denominators in the founding paper.
    PMID:30965037, the dedicated transplant series, has a title-only PubMed
    record, so it is listed under references with a title and supplies no
    snippet; PMID:28096536 is in the same state and is not cited at all.

    No gene_disease_validity: ClinGen files its IKZF1 assertion against a
    broader IKAROS-related immunodeficiency term, so under the copy-never-assign
    rule the slot stays empty.

    Two knowledge gaps recorded: no animal model carries the human N159 allele
    (PubMed searches named in the rationale, run 2026-10-23, returned no
    records), and the basis of the selective Pneumocystis susceptibility is
    unsettled, which the founding authors say themselves.

    Validation: just validate (schema, terms, references) passed with 89 of 89
    snippets verified and 88 titles checked; just validate-disorders passed as
    the final batched gate. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments,
    check-coarse-phenotypes, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-folded-hyphens, check-retired-support-prose
    and check-reference-titles all clean. check_gene_activity_grounding.py
    --against-ref origin/main reports no newly ungrounded genes.
    just check-genereviews --online reports NO_CHAPTER for both GeneReviews
    and StatPearls, after the synonyms were added. pytest tests/test_data.py
    for this entry: 4 passed. Deleted the stub.

  summary: 'Join strabismus surgery and cochlear implantation into the pathograph
    (PR #9698 suggestion)'
  details: |
    Takes the one non-blocking suggestion from the approving review on PR #9698,
    that five of six treatments carried no target_mechanisms and two more joins
    were natural.

    Added two links, which raises treatment-to-pathograph coverage from 1/6 to 3/6
    and means all three organ branches of this entry (ocular, otic, renal) now have
    a treatment joined to them:

    - Extraocular muscle surgery MODULATES "Horizontal Rectus Co-contraction and
      Globe Retraction". The description is careful about what surgery does: it
      mechanically rebalances the two horizontal recti that the aberrant oculomotor
      innervation makes fire together, but it does not stop the co-contraction,
      because the miswiring is fixed from early development. That is why it can
      improve alignment and the upshoot or downshoot while leaving abduction
      unrestored.
    - Cochlear implantation BYPASSES "Impaired MAFB-Dependent Inner Ear
      Morphogenesis". BYPASSES rather than RESTORES because an implant does not
      correct otic development; it routes around the malformed cochlea by
      stimulating the auditory nerve directly, which is why it can help even where
      the cochlea is aplastic with a common cavity.

    EVIDENCE CORRECTION worth recording. The review suggested citing PMID:40212284
    for the surgical mechanism, describing it as covering Y-splitting and
    simultaneous medial/lateral rectus recession for globe retraction and shoots.
    That cached record is abstract_only and contains none of that content; a grep
    for Y-split, medial rectus and lateral rectus recession returns zero hits. The
    suggested citation was therefore not used for the mechanism claim. The link is
    instead evidenced by the GeneReviews sentence already in this entry, which
    names upshoot and downshoot among the surgical indications, and upshoot and
    downshoot are the direct expression of the co-contracting lateral rectus
    slipping over or under the globe, which is precisely the node being targeted.
    PMID:40212284 is still cited on the link, but only for the outcome it does
    report (35 patients gained binocular vision and improved appearance), graded
    PARTIAL because it reports a clinical result in a general Duane cohort without
    measuring the co-contraction.

    The cochlear implantation link is likewise graded PARTIAL: the source records
    that bilateral implantation was performed in a MAFB variant carrier with
    cochlear aplasia, but reports no outcome, so it evidences that the route around
    the malformed cochlea was taken rather than that it succeeded.

    The three treatments still without target_mechanisms are correctly so: amblyopia
    therapy and optical correction act on phenotypes rather than on mechanism nodes,
    and ophthalmologic surveillance is a monitoring action, which its own notes
    already record.


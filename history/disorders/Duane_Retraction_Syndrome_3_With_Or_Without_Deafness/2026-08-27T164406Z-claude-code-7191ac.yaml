  details: |
    Response to the automated review on PR #9698. Both blocking items and seven of
    the eight optional suggestions were addressed; the eighth is out of scope.

    Blocking item 1: the PMID:41898877 snippet summarizing Mafb-deficient mouse
    podocyte studies was graded evidence_source: OTHER. Regraded MODEL_ORGANISM.
    The reviewer was right that the file was internally inconsistent, since the same
    paper's zebrafish summary was already MODEL_ORGANISM.

    Blocking item 2: congenital auricular anomaly was quoted in the file but had no
    phenotype entry. Added as a Head and Neck phenotype bound to HP:0000356
    (Abnormality of the outer ear), reusing the evidence already present.

    Optional items addressed:
    - The PMID:37895232 MARE-binding claim was regraded HUMAN_CLINICAL to IN_VITRO;
      the sentence sits in a clinical paragraph but the claim is biochemistry.
    - The mafba zebrafish model now cites the primary study (PMID:40162949) first,
      with the secondary description (PMID:41898877) retained because the primary
      reports the abducens-nucleus outcome in figures rather than in one quotable
      sentence, and the explanation says so.
    - PMID:22387013 was listed in references: but uncited. It is now cited on the
      MAFB genetic entry as the original report of the MCTO transactivation-domain
      mutation cluster, independently supporting the domain-specific
      genotype-phenotype split the description relies on.
    - The bundled refractive/amblyopia treatment was split into three: Amblyopia
      Therapy (BEHAVIORAL, occlusion/penalization), Optical Correction with
      Spectacles and Prisms (DEVICE), and Ophthalmologic Surveillance for Amblyopia.
      The surveillance entry deliberately carries no target_mechanisms, since
      monitoring is not a therapeutic action on a pathograph node.
    - Added phenotypes: Compensatory Head Posture (HP:0031705) and Amblyopia
      (HP:0000646).
    - Added Upshoot or Downshoot on Adduction with NO ontology binding. HPO has no
      term for it; HP:0000496 is too broad to carry the meaning and HP:0025586
      describes a different sign. The reason is recorded in the phenotype's notes
      rather than binding a term that would be wrong in the KGX export.
    - Mined the two remaining GeneReviews statements: the 50% transmission risk
      (added to inheritance evidence) and the full surveillance schedule (added as
      the surveillance treatment's evidence, quoted in full because the age
      thresholds are the operative content).
    - Hearing aids were NOT added as a separate treatment. No MAFB carrier fitted
      with amplification has been reported, so an entry would have had no evidence.
      The point is instead recorded in the cochlear implantation description.

    Not addressed, deliberately: back-referencing this entry from the umbrella
    Duane_Retraction_Syndrome.yaml. The reviewer marked it out of scope for this
    diff and it would put a second disorder file in a single-disease PR.

    Validation after the edits, run and read: just validate (passed);
    just count-verified-snippets (Snippets checked: 69/69 verified against cached
    references); just validate-terms (Validation passed); just validate-disorders
    (All validations passed; 69/69; All 1 disorder file(s) passed validation);
    just check-duplicate-keys, check_folded_hyphens, check_snippet_length
    --against-ref origin/main, just check-title-snippets, just
    check-reference-titles, just check-snippet-grading all OK. Rebased onto
    origin/main first so the diff-against-ref gates were evaluated against current
    main. No new cache rows were needed; all three added HP terms were already
    present in the committed caches.

  details: |
    Response to the third automated review on PR #9698. The one blocking item and
    all three suggestions are addressed.

    Blocking item (accepted): the clinicaltrials:NCT03059420 evidence item was the
    only one of the file's evidence items without a reference_title. Added, taken
    verbatim from the committed cache file's frontmatter rather than retyped. A
    programmatic check now confirms 0 of 76 evidence items are missing a
    reference_title.

    Suggestion 2 (accepted): added a differential_diagnoses section with five
    entries, each with structured distinguishing_features and cited evidence.
    Acquired sixth-nerve palsy is placed first because it is the differential with
    a treatable and sometimes dangerous cause behind it; the others are congenital
    fibrosis of the extraocular muscles, Moebius syndrome, horizontal gaze palsy
    with progressive scoliosis, and the genetic siblings CHN1/DURS2 and SALL4
    Okihiro. The sibling entry records the point that matters clinically: the
    ocular phenotype can be indistinguishable, and only sequencing separates them,
    but the distinction changes surveillance because only the MAFB form carries
    hearing loss and proteinuric kidney disease.

    Suggestion 3 (accepted): high-resolution cranial nerve MRI is now its own
    diagnosis entry rather than appearing only inside a phenotype description. It
    is placed first among the diagnosis entries because absent or hypoplastic CN6
    is what separates a congenital dysinnervation disorder from an acquired palsy.

    IMPORTANT CAVEAT recorded on that new entry. The supporting cohort
    (PMID:40212284, already cached on main) reports its MRI findings by "DRS1",
    "DRS2" and "DRS3", and those are the Huber CLINICAL types, not the numbered
    genetic loci. That paper's "DRS3" is Huber type III and is NOT this entity.
    This is precisely the naming trap this entry already warns about in the
    opposite direction for CMD1OO-style labels, so the explanation states it
    explicitly and frames the citation as evidence that imaging detects the lesion,
    not as a genotype-specific frequency.

    Suggestion 4 (accepted): the renin-angiotensin blockade treatment now carries
    target_mechanisms pointing at the podocyte node with treatment_effect
    MODULATES, which joins the renal branch into the pathograph as the ocular and
    otic branches already were. The description is careful that ACE inhibition does
    not restore MAFB or repair the podocyte; it lowers intraglomerular pressure
    across an already damaged barrier, so it acts on the consequences of that node
    rather than its cause. Its evidence is graded PARTIAL because it is one
    uncontrolled patient course.

    Two references were added to the top-level bibliography: PMID:40212284 for the
    MRI entry and PMID:41870107 was already present. No new reference cache files
    were needed; both were already committed on main. No new ontology terms and no
    cache rows were added by this round.


  summary: 'Create: Duane Retraction Syndrome 3 With Or Without Deafness (MAFB, MONDO:0014880)'
  details: |
    De-novo creation of the MAFB-attributed leaf entity DURS3 (MONDO:0014880, OMIM
    617041), curated as a congenital cranial dysinnervation disorder rather than an
    ocular-motility phenotype.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count (leaf)
    and a single causal gene (hgnc:6408 MAFB). Kept separate from the existing
    Duane_Retraction_Syndrome entry (MONDO:0007473) rather than folded in as a
    subtype, because the MAFB form carries mechanism and surveillance the clinical
    umbrella does not; the parent is cross-referenced via mappings.mondo_mappings
    with skos:broadMatch.

    Deep research: falcon (Edison), 450s, 13 citations. Its own reference_validation
    block reported 7/8 resolved, 0 unresolved, 1 unverifiable, 0 off-topic; nothing
    was curated from the unverifiable identifier. NEC preflight
    (just preflight-dr ... MONDO:0014880) returned PASS: MAFB mentioned 56 times
    against CHN1 twice, MONDO OMIM xref 617041. The report was used as a lead only;
    every reference curated here was independently located via PubMed E-utilities
    and fetched with just fetch-reference. Two DOI-only leads from the report were
    resolved to PMIDs (PMID:37895232, PMID:38500555) via the PMC ID converter; the
    content-free DOI_*.md stubs the DR validation pass writes were not committed.

    Pathophysiology: 7 atomic nodes, 6 edges, single root, all nodes reachable from
    it; all four biological_scale values represented. The chain is MAFB
    transcriptional output below threshold (MOLECULAR) -> rhombomere 5 patterning
    and abducens motor neuron specification failure (CELLULAR) -> abducens nerve
    hypoplasia (TISSUE) -> aberrant oculomotor reinnervation of the lateral rectus
    (TISSUE) -> horizontal rectus co-contraction and globe retraction (ORGANISM),
    with two parallel arms from the trigger node for inner-ear morphogenesis and
    podocyte differentiation.

    Scope decision recorded in the entry: the renal arm is curated even though the
    MONDO/OMIM label names only deafness, on the strength of PMID:41898877 stating
    that DRS3 may co-occur with proteinuric kidney disease, and PMID:29779709 in
    which all four affected individuals had both FSGS and the Duane anomaly. It is
    marked variable rather than defining, and an OPEN_QUESTION discussion records
    the unsettled boundary.

    A HUMAN_MODEL_MISMATCH discussion records that the dose-matched heterozygous
    Mafb p.Leu239Pro knock-in mouse stays healthy while human heterozygotes for the
    same substitution develop FSGS and DRS; this is also modelled structurally as a
    FAILS_TO_RECAPITULATE animal-model link rather than left as prose.

    No frequency: value is asserted on any phenotype. The literature on molecularly
    confirmed MAFB disease is a handful of families and no denominator exists;
    prevalence is recorded as CASES_IN_LITERATURE / NOT_YET_DOCUMENTED.

    Validation actually run and read, on this file: just validate (passed);
    just count-verified-snippets (Snippets checked: 60/60 verified against cached
    references); just validate-terms (Validation passed); just check-duplicate-keys
    (OK); scripts/check_folded_hyphens.py (OK, no new splits);
    scripts/check_snippet_length.py --against-ref origin/main (OK, no new snippets
    under 5 words); just check-title-snippets (OK, no new title-quoting snippets);
    just check-cache-order (OK); just check-term-cache-integrity (OK). The batched
    just validate-disorders sweep was run once before opening the PR. All 10

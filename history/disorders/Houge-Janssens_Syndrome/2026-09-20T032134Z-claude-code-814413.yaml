  summary: 'Genetics pass (wiring-010): split the PP2A trigger node by holoenzyme
    subunit role'
  details: |
    Genetics pass for issue #12199 (epic #12189, d2g wiring-010).

    All four MONDO-recorded genes (PPP2R5D, PPP2R1A, PPP2CA, PPP2R5C) were already
    curated and already reached the pathograph, but through a single node
    "PP2A subunit mutations" carrying all four genes flat.

    Changes:
    - Split that node into three, by holoenzyme subunit role, which is the
      distinction the entry's own cited source (PMID:40555839) draws: "PP2A B56
      Regulatory Subunit Variants" (PPP2R5D, PPP2R5C), "PP2A Scaffolding A-alpha
      Subunit Variants" (PPP2R1A), "PP2A Catalytic C-alpha Subunit Variants"
      (PPP2CA). Each carries `genes:`, `genetic_context`, `subtypes:` foreign keys
      and its own evidence; all three converge on the existing "Disrupted PP2A
      holoenzyme assembly and function" node. No other item referenced the old node
      name, so no foreign key was broken.
    - Added `genes:` to all four `has_subtypes` rows and
      `relationship_type: CAUSATIVE` + `subtype:` foreign keys to all four
      `genetic:` entries.
    - Grounded the HJS type 1 subtype row, which had no `subtype_term`, to
      MONDO:0014602 "Houge-Janssens syndrome 1" (read from `runoak -i ols:mondo`).
      The other three rows were already grounded.
    - GeneReviews baseline fix: PMID:41465181 (a journal systematic review) was
      tagged `GeneReviews`, which `just check-genereviews` reports as MISTAGGED. The
      real chapter, PMID:30676711 "PPP2R5D-Related Neurodevelopmental Disorder", was
      not cited at all. Removed the wrong tag, fetched and cited the chapter with two
      findings, and mined it for two evidence items on the PPP2R5D genetic entry.
    - Precision fix from that chapter: the entry asserted "de novo" variants
      unqualified; GeneReviews records rare inheritance from an affected heterozygous
      parent, and the PPP2R5C source records inheritance of total loss-of-function
      alleles from non-symptomatic parents. Softened to "typically but not invariably
      de novo" in the subtype description, the node description and the gene notes.

    References newly cited and cached: PMID:30676711.

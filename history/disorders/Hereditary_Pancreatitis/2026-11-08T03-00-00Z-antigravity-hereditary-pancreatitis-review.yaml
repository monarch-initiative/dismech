  summary: Grounded PRSS1/SPINK1/PRSS2 genes and molecular functions in pathophysiology, added classifications and SPINK1 evidence, and completed diagnosis and treatment links in Hereditary Pancreatitis.
  details: >-
    Added GASTROINTESTINAL and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications and primary cohort plus background evidence for SPINK1 in genetic. Wired PRSS1, SPINK1, and PRSS2 into pathophysiology nodes with GO serine-type endopeptidase and endopeptidase inhibitor molecular functions (noting inhibitor decrease applies to SPINK1 variant carriers), pancreas location, pancreatic acinar cell type, and verbatim evidence snippets (`directness: INDIRECT` on the PMID:8841182 cleavage-site inference and `quote_role: BACKGROUND`/`PRIMARY_RESULT` on PMID:16699518), and added Steatorrhea as a sequela of Exocrine pancreatic insufficiency while preserving the existing pancreatitis sequela chain. Completed diagnosis_term, presence, and results on PRSS1 molecular genetic testing and enriched treatments with therapeutic_modality, TPIAT/behavioral target_mechanisms, and GeneReviews evidence.

  summary: 'Create: Hereditary Pancreatitis (PRSS1)'
  details: |
    De novo curation of PRSS1-related hereditary (chronic) pancreatitis (MONDO:0008185) from a Perplexity sonar-deep-research report plus the PRSS1 GeneReviews chapter (PMID:22379635). Modeled the trypsin-balance chain: PRSS1 gain of function -> increased intrapancreatic trypsin activity -> pancreatic acinar autodigestion -> recurrent acute and chronic pancreatitis. Genetic block covers PRSS1 (causative GOF: R122H/R117H PMID:8841182, N29I/N21I PMID:9322498), SPINK1 (risk), and protective PRSS2 G191R (PMID:16699518). Environmental modifiers (smoking, alcohol) with entry-level and mechanism-link evidence. 21/21 snippets verified. Corrected a report citation error (PRSS2 protective paper was cited as PMID:16791195, which is an unrelated neuroscience paper; the correct Witt 2006 Nat Genet paper is PMID:16699518). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-environmental-evidence.

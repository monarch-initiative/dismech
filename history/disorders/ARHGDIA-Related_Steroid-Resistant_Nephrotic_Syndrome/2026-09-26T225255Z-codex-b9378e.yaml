  summary: Review ARHGDIA nephrotic syndrome against cached full texts and GeneReviews
  details: |
    Reviewed the existing entry and deep-research report against the Gupta, Gee, Auguste, Indian case and Iranian cohort full texts, and the remaining mechanistic abstracts. Recovered and visually checked Gee Table 1 from the publisher PDF: seven molecularly characterized patients across the cited sources and one additional affected sibling without available DNA; added seizures, cortical blindness, sensorineural hearing loss, precise onset and renal outcomes. Added the case-specific hypercholesterolemia and splice-allele table evidence. Mined the actual genetic SRNS GeneReviews chapter for clinical characteristics, diagnosis, management and counseling, distinguishing general SRNS recommendations from ARHGDIA patient evidence. Split protein abundance, GTPase activation, actin structure and migration; preserved conflicting experimental results and identified proposed cellular-to-glomerular steps as emerging hypotheses. Added experimental RAC1 inhibition, eplerenone and the fly nephrocyte assay with model limitations. Corrected research-report overstatements about extrarenal disease, zygosity and transplant recurrence rather than propagating them. Publisher attempts for the 1999 and 2008 mouse papers yielded subscription pages, and the LPS paper returned HTTP 403; their claims remain limited to available abstracts. No ARHGDIA-specific clinical trial or public dataset accession was surfaced. All eight research-completeness dimensions were assessed; major supported clinical and mechanistic themes are represented. Validation passed with 106 snippets and 109 titles, zero skipped or unavailable snippets; two scoped data tests, ontology, entity references, causal targets, snippet boundaries, title and grading checks passed.

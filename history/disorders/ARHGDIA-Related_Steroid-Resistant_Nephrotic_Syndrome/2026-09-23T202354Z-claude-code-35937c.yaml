  summary: Correct consanguinity wording and drop over-broad onset category
  details: |
    Follow-up to PR #12607, which merged before these two corrections could be pushed (the branch was locked in the merge queue). (1) Three sentences called all five reported families consanguineous. The cached sources state parental consanguinity for the Pakistani, Iranian and South Indian families only; the Ashkenazi Jewish family was mapped by homozygosity and the R120X family's origin is not given in the cached text. Wording corrected in the pathophysiology description, the genetic notes and the inheritance description. (2) The Congenital or Infantile Nephrotic Syndrome phenotype carried onset_category: CONGENITAL, which the entry's own description contradicts: the G173V siblings presented at one year or older and the G168R infant at 11 months. The onset descriptor is removed and the description now states the allele-dependent range explicitly. The ai4c-reviewer raised the onset point as a non-blocking suggestion on #12607. No evidence item changed; 76/76 snippets still verify.

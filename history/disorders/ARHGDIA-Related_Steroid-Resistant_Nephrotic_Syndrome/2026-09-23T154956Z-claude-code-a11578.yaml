  details: |
    New entry for nephrotic syndrome, type 8 (MONDO:0014099; ARHGDIA, hgnc:678), replacing stub stubs/Nephrotic_Syndrome_Type_8.yaml (deleted). Named ARHGDIA-Related Steroid-Resistant Nephrotic Syndrome to match COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome; disease_term keeps the exact MONDO label. Lump/split: single Disease entry (one gene, one mechanism, one MONDO term); no subtypes.

    Deep research: one run, falcon requested with claude_code fallback. Falcon returned HTTP 402 (out of credits); claude_code produced research/ARHGDIA-Related_Steroid-Resistant_Nephrotic_Syndrome-deep-research-claude_code.md (frontmatter records fell_back, requested_provider: falcon, provider_attempts). Reference validation 6/6 resolved, 0 off topic; term validation needs_review true (2 label variants: HP:0410280 is Pediatric onset, not Infantile onset; neither was used). just preflight-dr returned WARN only because RAC1, the downstream effector, is mentioned often; the report's gene (ARHGDIA) and OMIM (615244) match MONDO, so it was used. The report was treated as leads: it misattributes PMC4905261 (PMID:26726844, Auguste et al.) to Gupta, and its Iranian-cohort and Indian-case details were paraphrase; all claims in the entry were re-derived from cached primary text.

    Structured sources: ClinGen CGGV assertion (Moderate, Glomerulopathy GCEP 2022-05-24) cached with --cache-dir references_cache from a fresh download of the ClinGen CSV whose sha256 differs from the pin in data/clingen/MANIFEST.yaml (upstream drift); the manifest was not repinned and the cache file therefore states the pinned snapshot date. ORPHA:656 (hereditary SRNS) cached from the main-checkout Orphadata XML; Orphanet maps OMIM:615244 to it as broader, with no ARHGDIA-specific code. GeneReviews: no ARHGDIA chapter; the genetic SRNS overview PMID:34436835 is tagged and cited for the evaluation-strategy statement only, since its cached record is the purpose statement.

    Dropped for lack of a quotable source: hypercholesterolemia/hyperlipidemia (the only case-level value sits inside a parenthetical that the validator strips), per-patient neurological features beyond intellectual disability (Gee Table 1 not in cache), post-transplant recurrence (no ARHGDIA data), prevalence. The claim-issue comment suggested PMID:23934128 for Gee et al.; the correct PMID is 23867502.

    Validation: just validate, count-verified-snippets (76/76), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-reference-titles, check-genereviews --online; validate-disorders run before push.

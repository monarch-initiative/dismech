  - phenotypes
  - genetic
  - differential_diagnoses
  - treatments
  - clinical_trials
  summary: Address PR 14602 review findings by splitting upstream hemostatic mechanism nodes, adding Peripheral
    neuropathy, refining differential diagnosis bindings, and adding treatments and clinical trials
  details: 'Split Hypercoagulability and impaired fibrinolysis into two atomic trigger nodes: Impaired
    fibrinolysis (PAI-1) (SERPINE1 hgnc:8583, GO:0004867 serine-type endopeptidase inhibitor activity
    INCREASED, GO:0042730 fibrinolysis DECREASED) and Inherited or acquired thrombophilia (F5 hgnc:3542,
    GO:0008047 enzyme activator activity INCREASED, GO:0007596 blood coagulation INCREASED), both wired
    directly into Dermal microvascular thrombosis. Added Peripheral neuropathy (HP:0009830) as a neurologic
    sequela phenotype wired downstream of Dermal microvascular thrombosis via vasa nervorum thrombus formation
    (DOI:10.3389/fmed.2022.1012178). Added direct ischemic-pain evidence from Burg et al. (DOI:10.3389/fmed.2022.1012178)
    on Severe pain and its upstream edge, marked clinicaltrials:NCT00975871 as BACKGROUND on F5 alongside
    cohort prevalence evidence, refined differential diagnoses (Polyarteritis nodosa MONDO:0019170, Allergic
    cutaneous vasculitis MONDO:0001290, and Sneddon syndrome MONDO:0008436), added Danazol (CHEBI:4315),
    Hyperbaric Oxygen Therapy (NCIT:C38065), and Iloprost (CHEBI:63916) treatments with target_mechanisms,
    and added RILIVA and NCT00975871 clinical_trials entries.'

  summary: Enhance Livedoid_Vasculopathy.yaml with classifications, inheritance, prevalence, diagnosis,
    differential diagnoses, references, and full phenotype causal connectivity
  details: Added classifications (DERMATOLOGY, ONCOLOGY_HEMATOLOGY), Non-Mendelian inheritance (HP:0001426),
    structured rare prevalence, diagnostic workup entries (Histopathologic Examination NCIT:C18190, Clinical
    Evaluation NCIT:C124351, Coagulation Study NCIT:C62662), differential diagnoses (Cutaneous polyarteritis
    nodosa MONDO:0019170 and Primary inflammatory cutaneous vasculitis MONDO:0018882), and top-level references
    block. Linked SERPINE1 (hgnc:8583), F5 (hgnc:3542), and serine-type endopeptidase inhibitor activity
    (GO:0004867) on Hypercoagulability and impaired fibrinolysis, and connected all four phenotypes (Painful
    lower-extremity ulcers, Atrophie blanche, Livedo racemosa, Severe pain) downstream of Dermal microvascular
    thrombosis using abstract-verified evidence.
- type: EDIT
  outcome: changed

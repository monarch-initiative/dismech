  details: |
    Created kb/disorders/Dilated_Cardiomyopathy_1JJ.yaml for MONDO:0014095
    (OMIM #615235, LAMA4 / hgnc:6484).

    Entry-type decision: DISEASE. The MONDO record is a leaf (no descendants) with a single
    causal-gene relationship RO:0004003 -> HGNC:6484 LAMA4 and a disease_series_by_gene
    definition, so it is a gene-anchored disorder rather than a grouping or a subtype of an
    existing entry.

    THE CENTRAL CURATION DECISION: the gene-disease relationship is NOT established, and the
    entry says so structurally rather than only in prose. The ClinGen Dilated Cardiomyopathy
    Gene Curation Expert Panel classified LAMA4-dilated cardiomyopathy as LIMITED on
    2024-11-15 under SOP10 (cached as
    CGGV:assertion_e937f98e-7577-48bd-a24a-361634ba0a8d-2024-11-15T170000.000Z). The dispute is
    carried in four places: the entry description, the genetic block
    (`relationship_type: DISPUTED`, `association: Limited`, with the ClinGen row cited as a
    REFUTE-typed evidence item against the implicit claim that LAMA4 is an established cause),
    a dedicated KNOWLEDGE_GAP discussion with two proposed experiments, and a treatment entry
    for genetic counseling that names the Limited classification explicitly. No node asserts
    that LAMA4 variation is a proven monogenic cause of human DCM. MONDO nonetheless models
    CMD1JJ as a concept, which is why the entry exists at all - the DISPUTED marker records the
    evidence state, it does not retire the concept.

    Deep research: `just research-disorder falcon Dilated_Cardiomyopathy_1JJ`, 6 references,
    0 confabulations, 5/6 on topic. `just preflight-dr <report> MONDO:0014095` -> WARN with two
    notes: LAMA4 mentioned 43 times (dominant, as required), and "Report cites OMIM 600133 but
    MONDO:0014095 xrefs OMIM 615235". That OMIM discrepancy was checked by hand and is BENIGN:
    600133 is the MIM number of the LAMA4 GENE, and the report labels it as such
    ("gene MIM 600133"), not as a rival disease. No rival disease entity is present. The report
    independently reached the same conclusion this entry curates - that LAMA4 is a
    minor/limited-evidence cardiomyopathy gene and a LAMA4 variant must not by itself drive
    predictive testing or ICD implantation - which is a useful cross-check rather than a source
    of new claims. The report cites no PMIDs (it uses internal citation keys), so nothing was
    curated from it directly; its one actionable lead, the Micolonghi 2024 minor-genes review,
    was resolved to PMID:39337275, fetched, read and cited from its own text.

    Pathograph (9 nodes, single connected component, all reachable from the trigger,
    MOLECULAR present at the root):
    LAMA4 integrin-interacting-domain variant (MOLECULAR, trigger) -> loss of laminin-integrin
    binding at the cardiac basement membrane (MOLECULAR, central_effector) -> branches to
    cardiac microvascular structural defect (TISSUE) and endothelial cell loss in the myocardium
    (CELLULAR), which converge on myocardial ischemia from microcirculatory insufficiency
    (TISSUE) -> adverse ventricular remodeling (TISSUE) [also via neurohormonal activation
    (ORGANISM)] -> left ventricular dilation and systolic dysfunction (ORGANISM) -> structural
    cardiac impairment and heart failure (ORGANISM).

    The chain is deliberately routed through a MICROVASCULAR and CELL-MATRIX-ADHESION arm
    rather than through a primary contractile-protein lesion, because that is what the evidence
    says: in the Lama4-null mouse, isolated cardiomyocytes still contract and the sarcolemmal
    dystrophin-glycoprotein and integrin complexes are unaltered, while the vessels are
    malformed, the pericapillary matrix widened and the myocardium hypoxic. That negative
    result is curated STRUCTURALLY as a FAILS_TO_RECAPITULATE model link with two UNCHANGED
    readouts, not left as prose.

    Module conformance: five nodes conform to kb/modules/cardiomyopathy_maladaptive_remodeling
    (#Primary Cardiomyocyte Insult, #Neurohormonal Activation, #Ventricular Remodeling,
    #Progressive Contractile Dysfunction, #Structural Cardiac Impairment and Heart Failure).
    The disorder-specific microvascular/ischemic nodes sit BETWEEN the trigger and the module's
    remodeling step and deliberately declare no conformance, because the module has no
    microvascular node to conform to.

    Curated: 9 pathophysiology nodes, 3 phenotypes, 1 inheritance block, 1 genetic block with 4
    annotated variants, 1 prevalence record, 2 animal models (Lama4-null mouse with three
    mechanism links including the FAILS_TO_RECAPITULATE one; zebrafish lost-contact ilk mutant),
    3 treatments, 2 discussions, 60 evidence snippets over 9 references.

    Honesty caveats recorded in the entry:
    - A HUMAN_MODEL_MISMATCH discussion records two ways the mouse differs from the human
      disease: the null mouse develops cardiac HYPERTROPHY while the human entity is DILATED
      cardiomyopathy, and a constitutive null models absence of the chain rather than the
      missense loss of integrin binding proposed for the human alleles. The Lama4 null also
      develops chronic kidney disease, so it is not cardiac-restricted.
    - The remodeling node's mouse evidence is marked PARTIAL for exactly the geometry reason.
    - Ischemia in the mouse was inferred from Hif1a/Vegfa transcripts plus histology, not
      measured as perfusion; the authors' hedge ("suggested") is quoted verbatim.
    - The conduction-system-disease phenotype rests on one family and is typed
      INDIRECT_UNKNOWN_INTERMEDIATES with a description stating that no mechanism links the
      laminin lesion to the conduction system.
    - The neurohormonal node openly carries class-level, non-LAMA4-specific evidence and says
      so in its own description.
    - `frequency:` omitted from every phenotype; prevalence is UNKNOWN / NOT_YET_DOCUMENTED
      because no LAMA4-specific rate can be derived while the relationship is Limited.
    - No `datasets:` block: no LAMA4-cardiomyopathy-specific accession was identified, and
      searching the gene alone would surface whatever else LAMA4 is studied for - the Named
      Entity Confusion hazard the dataset SOP warns about.
    - No ORPHA evidence asserted; `just refresh-orphadata` currently fails on a manifest
      checksum mismatch.

    Snippet mechanics worth recording: two first-draft snippets failed and were repaired at
    source rather than worked around. The Knoll 2007 quote naming the two alleles contains
    square-bracketed protein changes ([Pro943Leu], [Arg1073X]) which are stripped before
    snippet matching, so it was split into two bracket-free quotes. A quote attributed to
    PMID:20035058 was a paraphrase of its title and was replaced with an exact sentence from
    its abstract.


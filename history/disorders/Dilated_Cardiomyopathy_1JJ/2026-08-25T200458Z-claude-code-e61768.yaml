    - just check-title-snippets / check-duplicate-keys / check-cache-order /
      check-term-cache-integrity -> all OK
    - pytest tests/test_data.py -k "conforms_to or model_readout or failure_to_recap or unique
      or treatment or diagnosis" -> 11931 passed

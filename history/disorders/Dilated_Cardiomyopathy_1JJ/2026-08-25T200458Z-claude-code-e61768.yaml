  summary: 'Review response: GeneReviews baseline, diagnosis section, model-link retyping,
    treatment coverage'
  details: |
    Addressed all four blocking items and all three non-blocking items from the automated
    review of PR #9490.

    1. GENEREVIEWS BASELINE (blocking, SOP item 15). PMID:20301486 "Dilated Cardiomyopathy
       Overview." is now tagged `GeneReviews` in `references:` and mined in the new diagnosis
       section. Following the Dilated_Cardiomyopathy_2A precedent, the entry ALSO records
       explicitly why nothing more could be mined: the cached PubMed record for that chapter
       contains only its four-point statement of purpose and no Clinical Characteristics text,
       so it supplies the proband evaluation strategy this gene-specific entry sits inside but
       cannot serve as a phenotype baseline. There is no LAMA4- or CMD1JJ-specific GeneReviews
       chapter.

    2. DIAGNOSIS SECTION (blocking). Added with two entries. "Echocardiography" (NCIT:C16525),
       with the DCM primer's statement that imaging is required to assess ventricular
       dysfunction plus its definition of DCM as a clinical diagnosis requiring exclusion of
       loading conditions and coronary disease - i.e. echocardiography is necessary but not
       sufficient. "Molecular Genetic Testing (Multigene Cardiomyopathy Panel)" (NCIT:C15709),
       which is where the entry's central caution is made operational: a LAMA4 finding must not
       be used on its own to make or exclude a diagnosis or to direct predictive testing,
       because the gene sits outside the core diagnostic set with a ClinGen Limited
       classification and reported variants have included ClinVar VUS and variants co-occurring
       with an established DCM mutation in another gene.

    3. FAILS_TO_RECAPITULATE CONTRADICTION (blocking). The reviewer was right and the file was
       self-contradictory: the third Lama4-null model link asserted FAILS_TO_RECAPITULATE
       against "Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane" while that
       same node cited the same mouse paper as SUPPORT. Took the reviewer's first option -
       retyped to PARTIALLY_RECAPITULATES, keeping BOTH `UNCHANGED` readouts (sarcolemmal
       DGC/integrin beta-1D levels; isolated cardiomyocyte contractility), which are the
       genuinely informative negatives. The link description now states the reasoning
       explicitly, including why the alternative was not taken: the mechanism the mouse excludes
       (sarcolemmal destabilisation) is deliberately not curated as its own node in this
       pathograph, so a FAILS_TO_RECAPITULATE link would have had nothing to point at, and
       inventing a node purely to host a negative would be worse modelling than retyping the
       link. The negatives remain the stated reason the disease is routed through the
       microvasculature rather than through a contractile or dystrophin-glycoprotein defect.

    4. TREATMENT COVERAGE (blocking). Added "Cardiac Resynchronization Therapy" (NCIT:C80436,
       DEVICE) - the reviewer correctly noted CRT was named inside a snippet already quoted for
       the ICD entry - with a `target_mechanisms` MODULATES link to the LV dilation node, whose
       evidence is marked PARTIAL because the DCM-primer sentence frames both devices in terms
       of arrhythmia prevention whereas resynchronization's action on that node is mechanical.
       Added "Advanced Heart Failure Therapy (mechanical circulatory support and
       transplantation)" (NCIT:C15246, SURGERY), stating plainly that no LAMA4 patient has been
       reported to receive either and that nothing in the proposed laminin mechanism predicts a
       different response. Added ARNI (NCIT:C190796) and SGLT2 inhibitor (NCIT:C98083) as
       `therapeutic_agent` entries on the existing pharmacotherapy record.

       These required one NEW reference, PMID:42475150 (HFrEF update review), fetched with
       `just fetch-reference`; the falcon report cites no PMIDs so its section 12 could not be
       used as a source. All four new snippets are exact substrings of that abstract.

    Non-blocking, all three taken:
    - PMID:33947203 retyped from HUMAN_CLINICAL to OTHER at all three occurrences, for
      consistency with every other review-type citation in the file.
    - PMID:22752727 and PMID:25445411 added to the `references:` block; they were cited in
      evidence but missing there.
    - Added a "Reduced left ventricular ejection fraction" phenotype (HP:0012664), quoted from
      PMID:30650640 as the reviewer suggested.

    Also fixed a folded-scalar hyphen split introduced by the new model-link description
    ("The sarcolemmal-" at a line end) - caught by scripts/check_folded_hyphens.py and
    rephrased rather than baselined.

    Validation after the changes:

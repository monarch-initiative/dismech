  details: |
    Round-2 response to the review of PR #9490. Two blocking text fixes and both non-blocking
    suggestions.

    BLOCKING 1 - stale claim in `notes:`. The round-1 retyping of the Lama4-null model link
    from FAILS_TO_RECAPITULATE to PARTIALLY_RECAPITULATES did not propagate to the notes block,
    which still told readers the negative result was "curated structurally as a
    FAILS_TO_RECAPITULATE model link". `grep FAILS_TO_RECAPITULATE` now returns zero hits in
    the file, so the entry was describing something it no longer did - on a page that renders.
    Replaced with an accurate description: the negative result is curated structurally as a
    pair of UNCHANGED readouts on the Lama4-null model link.

    BLOCKING 2 - review-process narration in a rendered `description`. The third
    modeled_mechanisms link opened by narrating this PR's review round ("Retyped from
    FAILS_TO_RECAPITULATE after review: ..."), which belongs in the commit message and the
    history record, not on the disorder page. Restated in the present tense as a description of
    the MODEL: it recapitulates the node's positive content, adds two informative negative
    readouts that bound the mechanism, and those negatives are why the disease is routed
    through the microvasculature. The final sentence still explains why the excluded mechanism
    is not its own node, but now as a statement about the pathograph rather than about an edit.

    SUGGESTION - cardiac MRI. Taken, and it is the strongest addition of the round. Added a
    `diagnosis:` entry for cardiac magnetic resonance imaging (NCIT:C16809) citing the JAMA
    2024 CMR meta-analysis, which the falcon report gestured at by DOI only; resolved to
    PMID:39298146 and fetched. Three evidence items: LGE presence and extent associated with
    higher all-cause mortality; the size of the evidence base (103 studies, 29,687 patients);
    and - the reason the entry is worth having separately from echocardiography - the NEGATIVE
    result that left ventricular ejection fraction was NOT associated with all-cause mortality.
    The description states plainly that none of this is LAMA4-specific and that no reported
    LAMA4 patient has published CMR.

    Note on the reference cache: PMID_39298146.md was already committed in the repository as
    `content_type: abstract_only`. Re-fetching it with `just fetch-reference` upgraded it to
    `full_text_html` from openalex. The upgraded content is a superset of what was there, so no
    existing snippet elsewhere in the KB can be invalidated by it, and the change is committed
    as part of this branch.

    SUGGESTION - second GeneReviews snippet. Taken. Added purpose item 4 of the cached chapter
    (genetic risk assessment of at-risk asymptomatic relatives, to inform cardiac surveillance)
    with an explanation that connects it to this entry's own position: the surveillance
    recommendation is real, but a Limited-evidence gene cannot carry the risk assessment it
    depends on, which is why the counseling entry directs surveillance by the clinical
    phenotype in the family rather than by LAMA4 carrier status.


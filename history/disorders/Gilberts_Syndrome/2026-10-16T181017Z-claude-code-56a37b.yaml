  details: |
    Bound LOINC:1971-1 (Bilirubin.indirect [Mass/volume] in Serum or Plasma) to the Unconjugated Bilirubin biochemical record, and LOINC:95143-4 (UGT1A1 gene TA repeats [Genotype]) to the UGT1A1 promoter (TA)n genotyping diagnosis row's measurements, as part of dismech LOINC Diagnostics tranche H (pharmacogenomic tests). Bound the TA-repeat-sizing-specific code rather than the broader LOINC:34509-0 'UGT1A1 gene targeted mutation analysis' panel, matching the row's own description of 'sizing the TATA-box TA repeat' as the primary action, with coding-region sequencing for UGT1A1*6 named as a separate conditional step. 'Indirect' bilirubin (LOINC's term) and 'unconjugated' bilirubin (the entry's term) are the same clinical-chemistry analyte. All labels verified against the Monarch KG entity API in the same step they were written. Confirmed both CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

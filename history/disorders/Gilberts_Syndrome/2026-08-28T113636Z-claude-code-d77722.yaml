  summary: Recurate Gilbert's Syndrome with OpenScientist deep research
  details: |
    Recuration of an entry first curated in March 2026 without deep research.

    Deep research: one OpenScientist report, research/Gilberts_Syndrome-deep-research-openscientist.md. 30 references, all resolved, none off topic. The provider emitted no Reference Validation section, so it was retro-fitted with `just validate-research-reference`. `just preflight-dr` against MONDO:0007745 PASSed: UGT1A1 mentioned 80 times, and the report's OMIM 143500 matches the MONDO term.

    Added three pathophysiology nodes the original entry lacked: the drug-glucuronidation arm (SN-38, atazanavir and indinavir unmasking, efavirenz induction), drug-unmasked hyperbilirubinemia, and chronic biliary bilirubin load driving pigment gallstone formation. Added Cholelithiasis and Fatigue phenotypes; a top-level inheritance block with INCOMPLETE penetrance; fasting as an environmental exposure wired into the pathograph via influences_mechanisms, reusing the KB's existing XCO:0000102 binding; the Gunn rat and the humanized UGT1 mouse as animal models, both PARTIALLY_RECAPITULATES at LOW fidelity with explicit limitations; two diagnostic definitions, the historical unisex 1 mg/dL cutoff and the sex-, age- and genotype-stratified centile definition; Crigler-Najjar type II and haemolysis as differentials; the bilirubin-antioxidant-protection hypothesis as ALTERNATIVE carrying both its in-vitro support and its Mendelian-randomization refutation; and four discussions: one OPEN_QUESTION, one HUMAN_MODEL_MISMATCH and two KNOWLEDGE_GAPs. Added laboratory reference ranges with interpretation bands to the bilirubin biomarker, and a clinically-recorded-prevalence record alongside the genotype-prevalence one.

    Fixed pre-existing defects: the prevalence population was "Population studies", which is an ascertainment method rather than a cohort, and the record carried the deprecated percentage slot.

    Two snippets were trimmed rather than kept verbatim, because the reference validator strips square-bracketed spans and neither a confidence interval nor a bracketed unit conversion matches the two literal_bracket_patterns currently configured. Widening that config is a repo-wide change and was left out of a curation PR; it is filed separately.

    One deep-research claim was deliberately not followed. The report presents cardiovascular protection from raised bilirubin as "a striking and reproducible feature" and proposes, as future work, the Mendelian randomization that PMID:37456363 had already published with a negative result. The hypothesis is therefore recorded as ALTERNATIVE with the refutation attached, and a note records the discrepancy.

    Validation: just validate, validate-terms, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass. 71 of 77 snippets verify against the local reference cache; the remaining 6 are skipped by prefix.

    Review round 1 (ai4c-reviewer, changes requested). Three blocking items, all verified against the sources and fixed: phenotypes#Fatigue carried frequency FREQUENT where its own cited table reports 1,401/9,240 cases (15%), which is OCCASIONAL - the band had been set from the paper's prose rather than its Table 4, and the corrected entry now cites the table row and records the 22%/12% female/male split; the bilirubin_systemic_antioxidant_protection hypothesis group was orphaned, with no downstream edge opting into it, and now labels the edge it disputes; and treatments#UGT1A1 Genotyping Prior to Irinotecan Therapy had no target_mechanisms, leaving the two new pharmacogenomic nodes without an incoming treatment edge.

    Also acted on the reviewer's non-blocking suggestions: added the UGT1A1 TA-repeat allelic series (*36 and *37, with the African allele frequencies that make an assay scoring only (TA)6/(TA)7 misclassify in both directions), G6PD as a MODIFIER gene, a phenobarbital treatment as the enzyme-induction join point on the glucuronidation node, and a diagnosis: section covering the exclusion-based diagnosis, the fasting provocation test and (TA)n genotyping. This consumed the three fetched-but-uncited caches the reviewer identified. Model entity references were rekeyed from species to name.

    The reviewer's report of the DR's HGNC id for G6PD was worth checking: the deep-research report states HGNC:4118, which is GALK1. The correct id, hgnc:4057, was confirmed with OAK before use.

    GeneReviews (skill item 15), which the reviewer could not check from its sandbox, was verified here: a PubMed search for a Gilbert syndrome GeneReviews chapter returns exactly one hit, PMID:20301450, which is the Alagille Syndrome chapter matching only on an author surname. There is no standalone GeneReviews chapter for Gilbert syndrome and no Crigler-Najjar chapter either, so item 15 requires no action and no tags: block is needed.

    A fourth instance of the abstract gene-symbol-stripping problem was hit and corrected while adding the G6PD modifier: the PubMed abstract for PMID:37508669 reads "in thepromoter", where the cached full text has "in the UGT1A1 promoter". Filed as part of issue #9832.

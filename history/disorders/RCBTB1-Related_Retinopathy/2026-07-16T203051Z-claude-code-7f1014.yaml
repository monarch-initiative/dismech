  summary: 'Create: RCBTB1-Related Retinopathy'
  details: |
    Fresh curation of RCBTB1-Related Retinopathy (MONDO:0014955, OMIM:617175, RDEOA), the next item in issue #4008's gene-tail list after CACNA1F (#6501). Sourced from 3 independently WebSearch/WebFetch-verified PMIDs (27486781 founding AJHG paper full-text, 35057699, 41162190) plus a falcon deep-research run that surfaced 2 additional real papers (37408192 Huang et al. 2023 iPSC-RPE mitochondrial-dysfunction study, 26908610 Wu et al. 2016 haploinsufficiency/FEVR paper), each independently verified via just fetch-reference before use. Modeled a 4-node pathophysiology causal chain: RCBTB1 loss of CUL3 substrate-adaptor function -> impaired NFE2L2(NRF2) oxidative-stress response -> RPE mitochondrial dysfunction and oxidative damage -> progressive photoreceptor/RPE degeneration (conforms_to photoreceptor_degeneration#Rod Photoreceptor Apoptosis). Modeled 3 has_subtypes (Early-Onset RP, Late-Onset Macular, Syndromic) without separate MONDO IDs since none exist for these phenotypic groupings. Added a differential_diagnoses entry against Familial Exudative Vitreoretinopathy documenting that heterozygous RCBTB1 haploinsufficiency (Coats/FEVR, Norrin/FZD4-Wnt/beta-catenin mechanism) is a distinct, non-overlapping disease from the biallelic CUL3/NFE2L2 mechanism modeled here. One KNOWLEDGE_GAP discussion on the still-unidentified direct CUL3/RCBTB1 ubiquitination substrate. Schema/validation gotchas: proposed_experiments requires Experiment objects (experiment_id/name/description), not bare strings; the reference validator strips bracketed MIM-number annotations from snippets before substring-matching; Windows console cp1252 encoding crashes linkml-term-validator's success/failure emoji output, so PYTHONIOENCODING=utf-8 is needed to see real results. Manually appended MONDO:0014955 to cache/enums/diseaseterm_f618932bb23f.csv in sorted order since MONDO enum values do not auto-populate during validation (HP/GO/CL/HGNC did auto-populate). 85.4% global compliance, full validate / validate-references / validate-terms-file pass.

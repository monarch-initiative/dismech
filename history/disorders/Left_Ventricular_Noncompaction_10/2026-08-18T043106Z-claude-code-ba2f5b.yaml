  summary: 'Create: Left Ventricular Noncompaction 10 (MYBPC3, LVNC10)'
  details: |
    Created LVNC10 (MONDO:0014163; OMIM:615396; MYBPC3) resolving issue #8746. Modeled two allelic-dose subtypes: biallelic (homozygous/compound heterozygous) truncating MYBPC3 producing severe lethal neonatal noncompaction with congenital septal defects (Wessels 2015 PMID:25335496, n=21 literature cohort; Kolokotronis 2019 PMID:30924982, ~20% residual cMyBP-C protein, heart transplant case), and monoallelic MYBPC3 producing/co-segregating with a noncompaction phenotype overlapping HCM in relatives (van Waning 2019 JACC PMID:30947911; Blagova 2022 PMID:36011256 familial HCM/LVNC/RCM continuum case). Cross-references the umbrella Left_Ventricular_Noncompaction.yaml (MONDO:0018901) for shared downstream LVNC mechanism and Hypertrophic_Cardiomyopathy_4.yaml (MONDO:0007268, same gene) as key differential diagnosis and for the shared cMyBP-C haploinsufficiency molecular mechanism. Added a KNOWLEDGE_GAP discussion on the unestablished mechanistic step converting cMyBP-C dose deficit into a developmental compaction-failure phenotype versus postnatal hypertrophic remodeling. Deep research: ran falcon (Edison) via just research-disorder; just preflight-dr returned PASS (MYBPC3 mentioned 60 times, no rival-gene drift toward HCM). The report's headline OpenTargets-sourced claim of a founding p.Arg820Trp/R820W LVNC10 allele was independently checked against its own cited PMIDs (20186049, 27532257 -- neither supports the claim) and against the report's own aside that R820W is 'notable in Ragdoll cats' (a known feline HCM variant), and was judged an unverified/likely-conflated claim and deliberately NOT incorporated into the KB entry. All other report content corroborated the primary-literature mechanism already sourced directly from Wessels 2015 and Kolokotronis 2019. Validation: just validate, just validate-terms, and just validate-disorders all pass (33/33 snippets verified against cached references); pytest tests/test_data.py passes (only a non-blocking missing-subtype_term warning, consistent with the HCM4 sibling entry).

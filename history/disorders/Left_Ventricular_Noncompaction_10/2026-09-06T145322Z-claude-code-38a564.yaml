  summary: 'Augment: Left Ventricular Noncompaction 10 (model systems, datasets, hypotheses)'
  details: |
    Augmented the existing LVNC10 entry (created 2026-08-18, #8746). Deep
    research: re-ran `just research-disorder falcon`, this time with the MONDO
    ID supplied, which the August pass lacked. 50 citations (up from 26); all
    18 extracted references resolved, 0 off topic, confabulation_rate 0.0.
    `just preflight-dr research/Left_Ventricular_Noncompaction_10-deep-research-falcon.md
    MONDO:0014163` returned PASS with MYBPC3 mentioned 61 times and no rival-gene
    drift. The report's term_validation sets needs_review: true on two label
    mismatches; both are template artifacts, not bindings - the "(if available)"
    placeholder echoed against MONDO:0014163, and a descriptive phrase written
    beside HP:0011664. Both CURIEs resolve and are the ones the entry already
    uses. This regenerated report replaces the August one at the same path; the
    superseded version remains in git history.

    Model systems were the largest gap and are the substance of this pass. Added
    `animal_models` (5) and `experimental_models` (2), all with typed
    `modeled_mechanisms` links carrying fidelity, model_scale, limitations and
    `divergences`, plus readouts. The scientifically important one is the
    homozygous cMyBP-C-deficient mouse (PMID:26153423): cMyBP-C normally
    inhibits postnatal myocyte cytokinesis, so the null completes an extra round
    of division and enlarges by hyperplasia where the heterozygote enlarges by
    hypertrophy. That is a candidate answer to the dose-phenotype divergence the
    entry had recorded as wholly open, and it is corroborated across species by
    the zebrafish mypbc3 knockout (PMID:36012114), which shows the same
    cardiomyocyte hyperplasia. Also added the Mybpc3-targeted knock-in mouse
    with neonatal AAV-U7-AON exon-skipping rescue (PMID:23716398), the Tet-Off
    conditional cMyBP-C re-expression mouse (PMID:30573635), the compound
    heterozygous cloned pig (PMID:40496056), the biallelic MYBPC3 hiPSC line
    with isogenic control (PMID:34375846), and MYBPC3 premature-termination-codon
    isogenic hiPSC-CMs (PMID:30586709).

    Recorded the mismatch those models expose as a HUMAN_MODEL_MISMATCH
    discussion: every model reaches the biallelic genotype and none reaches the
    noncompaction phenotype - the mouse dilates, the pig hypertrophies, the
    zebrafish has no compact layer, the hiPSC line has no assayed phenotype. The
    September deep-research pass reached the same conclusion independently. This
    bounds what the two rescue experiments in the entry can be read to show.
    Added two `mechanistic_hypotheses` (CANONICAL sarcomeric dose continuum,
    EMERGING cytokinesis-brake-release) and opted the compaction edge into both
    via `hypothesis_groups`; extended the pre-existing KNOWLEDGE_GAP discussion
    with the candidate mechanism and gave it evidence, and gave its proposed
    experiment structured perturbations, readouts, would_support/would_refute.

    Filled every uncited causal edge: all 5 `pathophysiology[].downstream[]`
    edges and both `treatments[].target_mechanisms[]` links now carry their own
    evidence, with `directness: INDIRECT` where the source establishes sequence
    or co-occurrence within a cohort rather than the causal step.

    Added `datasets` (was empty): geo:GSE274124 (biallelic in-trans patient
    hiPSC-CM transcriptome), geo:GSE140965 (isogenic het vs hom MYBPC3 LOF
    edits), geo:GSE262253 (the cMyBP-C(t/t) mouse curated here, against a
    half-dose transgenic). All three are HCM/DCM-labelled, not noncompaction
    datasets; that is recorded in each `notes`. `just verify-datasets` OK 3/3;
    GEO_*.md cache files committed.

    Added ClinGen structured-source evidence to `genetic`: MYBPC3-HCM Definitive
    (AD) against MYBPC3-DCM Limited (AR). The AR row is the nearest expert-panel
    verdict on the biallelic regime this entry models, since OMIM files LVNC10
    with CMD1MM, and it corroborates the Mazzarotto caveat already in the notes.
    Added the 2025 autopsy-confirmed compound heterozygous case (PMID:41488457),
    the first in this entry to name which septal defect (atrial); the phenotype
    stays bound at HP:0001671 rather than being narrowed on one case. Added
    `progression` (2 phases) and `clinical_burden` (HIGH).

    Cleaned up all four `explanation` strings that still argued for the retired
    `supports: PARTIAL` value (#10003 prose fallout), replacing them with
    `directness: INDIRECT` where that is what was meant. No occurrence of the
    retired value remains in this entry's prose.

    Deliberately not used: the report's claim that 15/21 pooled biallelic
    patients died before one year. That figure is in the Wessels full text, not
    the abstract, and is absent from the cached reference, so it could not be
    snippet-verified; the cohort outcome is curated from the abstract's own
    wording instead. Also fetched but not cited: PMID:24047589 (zebrafish
    mybpc3 morpholino knockdown), redundant against the stable knockout, and its
    cache file was removed rather than committed uncited.

    A pre-PR red-team review (dismech-pr-review skill, fresh context) found
    fifteen issues, all in curator prose running ahead of the quotes beside it;
    no fabricated snippet, wrong identifier, Named Entity Confusion, or bad
    ontology term. All fifteen were fixed in this same pass. The three that
    mattered:

    (1) The zebrafish model description claimed zebrafish "have no compact
    myocardial layer". That is false, and the paper says the opposite of what
    the entry implied: the mybpc3-knockout ventricle and atrium "became more
    compact" with a thicker wall and smaller chamber diameters. The claim
    appeared three times, escalating from a hedged divergence to a load-bearing
    premise of the HUMAN_MODEL_MISMATCH discussion. Rewritten throughout, and
    the corrected fact is a sharper version of the same argument, so a REFUTE
    readout quoting the "more compact" sentence was added to the zebrafish
    link. Note also that the paper's abstract misspells the gene "mypbc3" while
    its results use mybpc3; curator-written fields now use mybpc3, snippets
    keep the source spelling, and a note records why.

    (2) "Every model curated in this entry reaches the biallelic MYBPC3
    genotype" was contradicted by the entry's own limitations on the
    heterozygous premature-termination-codon iPSC-CMs. Narrowed.

    (3) `progression` asserted "There is no presymptomatic phase to screen for
    once the genotype is biallelic", which PMID:41488457 - added in this same
    pass - refutes: normal prenatal screening, discharged healthy, collapse at
    two months. Rewritten to the defensible claim, that a window exists and no
    screening interval has been shown to use it.

    Also fixed: uncited residual-protein percentages in the CANONICAL
    hypothesis description (the only measured figure in the entry is ~20% in
    one LoF-plus-missense compound heterozygote, not the truncating/truncating
    subtype, and the isogenic iPSC-CM result cuts against the half-dose
    inference); the one link carrying `fidelity: HIGH` with no caveat and an
    organ-level readout under `model_scale: MOLECULAR` (now MODERATE/ORGANISM
    with PROXY_QUANTITY and SPECIES_MISMATCH divergences); a new
    `causal_link_type: DIRECT` edge resting on a cohort co-occurrence statistic
    without `directness: INDIRECT`; the ClinGen MYBPC3-HCM Definitive item
    graded SUPPORT when its own explanation calls it a contrast term (now
    NO_EVIDENCE, kept because omitting it would make the AR/DCM Limited row
    look like the whole ClinGen picture); "the same four neonates in whom
    noncompaction was diagnosed" (three of four); a curator extrapolation
    written as the authors' proposal; `materiality: INVALIDATING` on a
    divergence arguing against a claim its link does not make (QUALIFYING); a
    duplicated snippet on a treatment mechanism link; and a `datasets`
    description calling geo:GSE274124 the configuration that defines the
    subtype when one of its alleles is low-penetrance missense.

    The review also flagged that two 2024 human systems from the report were
    dropped without recording why - MYBPC3 p.D389V cardiac organoids with
    mavacamten-reversible hypercontractility, and MYBPC3 c.1377delC iPSC-CM
    metabolic remodeling - and that the organoid one undercuts the discussion's
    claim that no human system could score compaction. Both decisions, and the
    reason `clinical_trials` stays empty (NCT06024759 is a generic-LVNC
    registry with no MYBPC3 arm), are now recorded in the discussion rationale
    rather than left silent.

    Validation: `just validate`, `just validate-terms`, and the batched
    `just validate-disorders` all pass, 84/84 snippets verified against cached
    references (up from 33). `just check-entity-refs`, `check-causal-targets`,
    `check-duplicate-keys`, `check-enum-values`, `check-qualifier-terms`,
    `check-folded-hyphens`, `check-snippet-grading`, `check-title-snippets`,
    `check-snippet-length`, `check-environmental-evidence` all OK; no baseline
    was updated. `just model-scale-audit` reports 0 upward-extrapolating links
    lacking limitations or divergences. Compliance rose from 110/123 satisfied
    checks to 203/230.

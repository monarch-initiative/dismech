  summary: 'Curate phenotypes: Left Ventricular Noncompaction 10'
  details: |
    Phenotype pass from cached literature (PubMed, Europe PMC and OLS were blocked by the session proxy). Added eight phenotypes: cardiomegaly, right ventricular hypertrophy, myofiber disarray, cyanosis and lethargy for the biallelic subtype from the PMID:41488457 autopsy case (graded INDIRECT because that case is hypertrophic, not noncompacted); myocardial fibrosis (both subtypes); nonsustained ventricular tachycardia and restrictive cardiomyopathy for the monoallelic subtype from PMID:36011256 (confounded by sarcoid myocarditis, recorded in the explanations). Enriched seven existing phenotypes with further evidence, NEONATAL/CONGENITAL onset and OBLIGATE frequency (4/4 founding series) for feeding difficulties, failure to thrive and dyspnea; removed the monoallelic-only subtype from hypertrophic cardiomyopathy because the biallelic autopsy case also had it. Wired nine phenotypes from four existing pathophysiology nodes (was zero connected). Validated with validate, count-verified-snippets (all verified), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes, check-name-collisions, check_snippet_length against origin/main.

    Review round 1 (PR #19210): reflowed one explanation line that ended in a hyphen (check-folded-hyphens CI gate); took three of the reviewer's optional suggestions (son "not reported to have sarcoidosis"; ischemic contribution to the son's fibrosis noted and that item graded INDIRECT; dropped the unsupported "near-absent cMyBP-C" phrase from the myofiber disarray explanation). The nonsustained VT rebind was left for a curator with HPO access.

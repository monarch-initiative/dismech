  summary: 'Create: Adult Granulosa Cell Tumor of Ovary'
  details: |
    Created the adult-type granulosa cell tumor entry (MONDO:0020541) as one of two mechanism-bearing Disease entries split out of the malignant ovarian sex cord-stromal tumor umbrella (issue #9002), alongside a new Ovarian Sex Cord-Stromal Tumors grouping. Curated eight pathophysiology nodes running FOXL2 c.402C>G (p.C134W) somatic driver -> altered FOXL2 transcriptional program -> granulosa cell proliferation/survival and aberrant ovarian steroidogenesis -> estrogen-driven endometrial pathology -> indolent growth with late recurrence, plus a TERT promoter/telomerase node conforming to enabling_replicative_immortality#Telomere Maintenance Reactivation and an FGFR1 kinase-domain node for FOXL2-wildtype tumors conforming to sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion. Deep research: falcon (Edison), report at research/Adult_Granulosa_Cell_Tumor_of_Ovary-deep-research-falcon.md; its own reference validation reported 9/9 references resolved, 0 unresolved, 0 off topic. 'just preflight-dr' returned SKIP because MONDO records no causal gene for this somatic-driver cancer class; the manual NEC fallback passed - FOXL2 dominates the report's gene mentions 42 to 12 over the next gene, and MONDO:0020541 carries no OMIM xref to conflict. All evidence was curated from primary literature fetched with 'just fetch-reference' and verified independently of the report. Validation actually run and read: 'just validate' schema clean; 'just validate-terms' passed; 'just count-verified-snippets' reported 41/41 snippets verified against cached references; 'just check-duplicate-keys' clean; 'just validate-disorders' run over both new disorder files before opening the PR. Note recorded in the entry: the MONDO label 'maligant granulosa cell tumor of ovary' carries an upstream misspelling of 'malignant' in both the local MONDO build and OLS, and is reproduced verbatim because term.label must match the canonical label.

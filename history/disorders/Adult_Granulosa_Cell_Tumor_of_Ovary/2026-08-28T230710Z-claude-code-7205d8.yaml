  summary: 'Detailed evidence review: adult granulosa cell tumor of ovary'
  details: |
    Full evidence audit of every evidence item in the entry against its cached reference. No defects were found and the entry was left unchanged.

    Scope: 56 evidence items were re-read across 14 unique cited references. Every cached reference file was read in full, title plus abstract or available full text, before grading. Evidence was checked wherever it appears in the entry: pathophysiology nodes and their causal edges, phenotypes, histopathology, diagnosis, biochemical markers, genetic entries including the FOXL2 case-fraction record, prevalence, both progression phases, treatments and their target_mechanisms links, both animal models with their modeled_mechanisms links and readouts, and the clinical trial.

    Snippet verification: the reference snippet audit reports 56 of 56 snippets verified as exact substrings of their cached reference bodies, with nothing skipped by prefix. Each was additionally read in context to confirm it is a propositional result statement rather than a paper title or a topic sentence.

    Semantic verification: each snippet was checked against the specific claim it sits under, and each supported it. Representative checks:

    - The FOXL2 C134W driver node cites the founding whole-transcriptome study, PMID:19516027, for both the identification of the recurrent 402C to G mutation and its 97 percent frequency in adult-type granulosa cell tumours, with independent replication at 99 percent from the 227-tumour cohort, PMID:39615884.
    - The altered transcriptional program node correctly separates the isogenic ChIP-seq result showing the mutant binds both wild-type and unique elements, PMID:32641414, from the mouse knock-in transcriptomic result supporting the gain-of-function reading, PMID:36409821.
    - The TERT node's 43 percent frequency and enrichment at recurrence come from PMID:39615884, and the telomerase-silencing rationale that justifies the conforms_to link to the replicative-immortality module comes from PMID:39395821.
    - The FGFR1 node's kinase-domain hotspot codons and their near-complete mutual exclusivity with the FOXL2 driver are quoted from PMID:41128462, which is the same source used for the diagnostic caveat that a negative FOXL2 result does not exclude the diagnosis.

    evidence_source grading: all 56 values were checked against the design of the cited study and all were correct. The isogenic cell-line ChIP-seq work is graded IN_VITRO; both mouse models, the Foxl2 C134W knock-in and the Foxo1/Foxo3/Pten depletion model, are graded MODEL_ORGANISM on every item including the readout-level evidence; and the human cohorts, retrospective series, systematic review, biomarker validation study and phase II trial are graded HUMAN_CLINICAL.

    supports grading: the PARTIAL gradings are each justified in their own explanation text and were confirmed appropriate rather than defensive hedging. Specifically: the pooled sex cord-stromal recurrence cohort, PMID:21481441, is correctly PARTIAL because the cohort is 82 percent adult granulosa cell tumour and 13 percent Sertoli-Leydig rather than a pure series, and that composition is stated in the explanation; the endometrial-carcinoma phenotype is PARTIAL because the cited 51.2 percent figure is a composite endometrial-pathology rate that includes hyperplasia; the elevated-estradiol phenotype is PARTIAL because the review states that the driver mutation promotes hormonal changes without quantifying circulating estradiol; and the nirogacestat trial is PARTIAL and curated explicitly as an informative negative result, since the trial produced no confirmed objective responses.

    Named Entity Confusion check: this was the highest-risk dimension for this entry because adult-type and juvenile granulosa cell tumour share a name but not a driver. Every cited source was confirmed to concern the adult type. The founding study's quoted sentence itself distinguishes the two forms, reporting the FOXL2 mutation in 97 percent of adult-type tumours against 10 percent of juvenile-type. The entry's own notes already record that MONDO:0020541 is the adult-onset class and that the GNAS and AKT1-driven juvenile form is deliberately out of scope. The one pooled-histotype source is flagged PARTIAL with its composition disclosed. No quote was found attached to a claim about a different tumour, gene or drug than the one it describes.

    Two curator notes were spot-checked against their sources and found accurate rather than embellished: the note reproducing the cached abstract's misspelling of adult as adut in the mouse-model quote, and the note explaining that the endometrial-pathology node deliberately carries no outgoing causal edge because early detection is not a cause of the tumour's indolent biology.

    Validation: schema validation passed; the snippet audit reports 56 of 56 verified; entity-reference, duplicate-key, folded-hyphen, snippet-length, title-snippet and snippet-grading checks are all clean for this file. No edit was made to the entry.

  summary: 'Address PR 7547 review: add DONSON and mechanism refinements'
  details: |
    Response to ai4c-reviewer REQUEST_CHANGES on PR 7547. Blocking fix: added the DONSON genetic row (hgnc:2993, CAUSATIVE) with three evidence items mined from the already-cached full text of PMID:37059840, and added DONSON, MCM3 and MCM7 to the genes list of the CMG helicase node whose description already named them. Note: the reviewer's suggested snippet 'Exome sequencing and phased genome sequencing identified DONSON...' does NOT validate, because the cached PDF-derived text contains the ligature artifact 'identi fi ed'; the quote boundary was moved to 'DONSON as a novel disease gene in several MGORS patients'. Also addressed reviewer suggestions: new MOLECULAR node for loss of ORC1 BAH recognition of H4K20me2 (PMID:22398447, newly fetched) feeding the licensing node, cited back in the licensing-severity knowledge gap it partly answers; MOPD II differential diagnosis (MONDO:0008872); GINS3-arm neutropenia phenotype (HP:0001875) from the same cached review; therapeutic_agent on both pharmacotherapies (NCIT:C837 Somatropin after CHEBI:37845 growth hormone failed the ChemicalEntityTerm enum; CHEBI:16469 17beta-estradiol); target_mechanisms joins from both drug treatments into the pathograph; and quantitative growth-hormone response data from PMID:39789585. Deliberately not done: MGORS10 (MONDO:0981050) remains uncurated because its causal gene is not stated in MONDO and could not be verified; ORPHA:2554 cross-reference skipped because references_cache/ORPHA_2554.md is not built locally. GeneReviews absence re-confirmed with two further PubMed queries, both zero hits. Validation: just validate passes, 104/104 snippets verified; compliance 93.4 percent global, 93.6 percent weighted.

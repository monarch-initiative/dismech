  details: |
    Read the latest review on d6ae23ea5 and the disease-specific clinical source in context. Added categories to seven prior additions and seven source-backed phenotypes: ventricular septal defect, patent ductus arteriosus, premature birth, recurrent respiratory infections, genu recurvatum, joint hypermobility and pes planus. Removed five co-occurrence-only causal grouping edges to feeding difficulties, emphysema, hearing impairment, lipodystrophy and clitoromegaly; documented their individual unresolved mechanisms. Added a qualified reflux-to-feeding clinical sequela, supported by the review explicitly identifying reflux as a possible cause. Added evidence to reflux and contracture gaps, and recorded the additional cardiac, birth, respiratory and joint gaps. Removed disease-wide GH-stimulation and clitoromegaly bands derived from endocrine-selected cases, and the unsupported lipodystrophy band. Anchored delayed bone age FREQUENT to independent qualitative clinical evidence. Made the patellar recurrence inference visible in its description. This round adds 18 evidence/snippet occurrences, seven phenotypes and seven gap discussions; changes no existing snippet strings or HPO bindings; removes five and adds one causal edge; adds no pathophysiology nodes. Result: 35 phenotypes, 16 with causal in-edges and 19 explicit unexplained phenotypes. Replayed both prior campaign commits onto main through a clean three-way alternate-index refresh, preserving their authors and all prior history records.

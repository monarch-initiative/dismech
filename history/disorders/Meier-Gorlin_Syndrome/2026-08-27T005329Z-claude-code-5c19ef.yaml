  summary: Re-verify ISDS group 21 assignment against the 2023 Table 1
  details: |
    Group-21 re-verification pass. The assignment already cited the 2023 revision and is correct; the note was extended with the verified row range NOS 21-0250 through NOS 21-0350 and two facts found during re-transcription. First, DONSON - the thirteenth Meier-Gorlin gene curated in this entry's CMG-helicase node - is not one of the eleven rows; the 2023 table lists it separately at NOS 21-0200 because the DONSON-Meier-Gorlin association postdates the table. That leaves the assignment unchanged (both rows are group 21) but makes the entry broader than the rows it cites, which the note now says. Second, NOS 21-0250 prints the name 'ORC4-related' against the gene ORC1 and OMIM 224690 (Meier-Gorlin syndrome 1) - a typographical error in the source, recorded so a later reader does not treat it as a second ORC4 row.

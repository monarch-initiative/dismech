  summary: 'Phenotype review: Meier-Gorlin_Syndrome'
  details: |
    Reviewed all 21 phenotypes for snippet-claim consistency in whole-paper context, HPO term optimality, and pathograph explanation. Entry was already fully wired (21/21 connected) and evidence discipline was strong. Changes: (1) removed the causal edge from Global Prenatal and Postnatal Growth Restriction to Decreased response to growth hormone stimulation test - its rationale conflated somatic GH resistance with pituitary secretion on stimulation testing, and it contradicted the 35.3% GHD figure the phenotype itself cites; replaced with a KNOWLEDGE_GAP discussion (gap_mgors_gh_axis_abnormality_mechanism) since no study establishes the mechanism, leaving 20/21 deliberately. (2) Rebound Patellar dislocation to HP:0005001 Recurrent patellar dislocation (evidence and description both describe luxating patellae/recurrent luxation); renamed node and its downstream edge target. (3) Softened Microtia description (evidence documents mild-to-severe range, not uniformly severe). (4) Added quantified full-text PMID:26381604 evidence for frequency bands: microtia 94%, IUGR 97%, microcephaly 43%, feeding problems 80% (new VERY_FREQUENT band), congenital pulmonary emphysema 43% (new FREQUENT band, verbatim hyphen-split literal snippet), plus conductive hearing-loss evidence. (5) Emphysema preferred_term set to Congenital pulmonary emphysema (HP:0002097 kept; HP:0033255 Congenital lobar overinflation judged narrower than evidence). Considered and rejected: HP:0003508 Proportionate short stature (GINS3/DONSON cohort growth restriction explicitly not proportionate in many individuals, PMID:37059840). Validated: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, validate-disorders all green; 112/112 snippets verified.

  summary: Map Meier-Gorlin syndrome to OMIMPS:224690
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. The January 2026 PS224690 snapshot lists Meier-Gorlin types 1 through 8, all represented in this entry. The September 2026 MONDO:0016817 hierarchy also includes types 9 and 10, while the entry discusses further replication-associated genes. ExactMatch aligns the Meier-Gorlin syndrome concept rather than treating a dated enumeration as a closed gene list. Shared impaired DNA replication initiation and the microtia, patellar, and growth-restriction syndrome support that clinical umbrella. The mapping does not claim every patient has every feature, that inheritance is uniformly recessive, or that the inspected OMIM snapshot already contains all subsequently numbered forms.

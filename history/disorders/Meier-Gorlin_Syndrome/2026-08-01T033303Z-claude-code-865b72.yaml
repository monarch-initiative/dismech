  summary: 'Create: Meier-Gorlin syndrome'
  details: |
    De novo creation of the Meier-Gorlin syndrome (MGORS) entry. Deep research: Edison/falcon (just research-disorder falcon Meier-Gorlin_Syndrome, 638 s, 29 citations, 1 artifact); its MONDO suggestion (MONDO:0012826) was rejected after direct OAK verification against sqlite:obo:mondo, which gives MONDO:0016817. All evidence was independently verified from PubMed abstracts rather than taken from the DR report. Curated: a ten-node pathograph spanning the licensing module (ORC/CDC6/CDT1 hypomorphs and the stabilized-geminin GMNN arm), the CMG pre-initiation module (CDC45/GINS2/GINS3/MCM/DONSON), the shared cellular proliferation deficit, the parallel non-replicative centriole-ciliogenesis-Hedgehog-chondroinduction arm, and the organism- and tissue-level growth outcomes; eleven subtypes (MGORS1-9 with MONDO bindings plus GINS2- and MCM3/MCM7-related arms); 20 HPO-bound phenotypes; 12 genes; prevalence, three diagnosis modes, seven treatments, one observational registry trial, two differential diagnoses, and three discussions (two KNOWLEDGE_GAP, one HUMAN_MODEL_MISMATCH on the embryonic-lethal GINS3 D24 mouse). Validation: just validate passes (schema + terms + references), 92/92 snippets verified against cached abstracts; compliance 93.0 percent global, 93.3 percent weighted. Related to issue 5862, whose auto-assessment misrouted a GINS2 MGORS preprint to Gorlin_Syndrome.yaml (nevoid basal cell carcinoma), a different disease.

  summary: Wire 21/21 phenotypes; complete gene-to-mechanism wiring
  details: |
    Pathograph-connectivity pass (0/21 phenotypes, 10/12 genes at baseline). Wired the growth and GH-response phenotypes off the global growth-restriction node; microtia, the patellar triad, the craniofacial and genital findings, lipodystrophy, emphysema and hearing impairment off the tissue-disproportionate node; craniosynostosis off the suture node; and neutropenia off the proliferation node. Wiring these off the disproportionate rather than the global node is the substantive choice: microtia and patellar aplasia are what make Meier-Gorlin syndrome distinctive, and they are precisely the features a uniform growth deficit fails to explain. Also fixed the gene wiring: ORC4 and ORC6 were named in the pre-replication-complex node description but absent from its genes list, so both floated unwired. ORC6 needed its HGNC identifier corrected to hgnc:17151. Result: 21/21 phenotypes and 12/12 genes connected.

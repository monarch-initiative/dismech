  summary: 'Create: Photosensitive Epilepsy (MONDO:0015643)'
  details: |
    Created a CURATE_ROOT_WITH_SUBTYPES entry for photosensitive epilepsy
    (MONDO:0015643) per issue #8964. Modeled as a root with six has_subtypes
    blocks: Pure Photosensitive Epilepsy (no MONDO id bound; the description
    explains why MONDO's own child terms, photoparoxysmal response 1-3, are
    genetic-linkage loci rather than this clinical concept), Photosensitive
    Occipital Lobe Epilepsy (linked via subtype_term to the already-curated
    Photosensitive_Occipital_Lobe_Epilepsy.yaml rather than duplicated),
    Photosensitivity in Juvenile Myoclonic Epilepsy, Jeavons Syndrome
    (the archetypal syndrome, strongest CHD2 association), Photosensitivity
    in Dravet Syndrome, and Photosensitivity in the Progressive Myoclonic
    Epilepsies -- the last four each subtype_term-linked to their own
    independently curated dismech entries and deliberately kept thin
    (photosensitivity-specific literature only, not a re-derivation of the
    full curated content already in those files).

    Pathophysiology chain (visual cortical hyperexcitability ->
    photoparoxysmal EEG response -> visual-to-motor cortical hyperexcitable
    spread, grounded in a TMS study -> photically provoked seizure
    generation -> recurrent visually provoked seizures) conforms to
    epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and
    Hypersynchrony. A discussion records why it deliberately does not
    conform to the module's Recurrent Unprovoked Seizures terminal node
    (reflex seizures are provoked by definition), extending the same
    reasoning already recorded in the Photosensitive_Occipital_Lobe_Epilepsy
    entry to the added complication that most named subtypes here also have
    genuinely unprovoked seizures, correctly modeled in their own separately
    curated entries.

    CHD2 (hgnc:1917) modeled as a RISK_FACTOR gene with structured
    case_fractions (11/580 overall, 3/36 in Jeavons syndrome) and a
    KNOWLEDGE_GAP discussion on how a chromatin remodeler, rather than an
    ion channel, produces acute cortical hyperexcitability; cross-referenced
    against the existing CHD2-Related_Developmental_and_Epileptic_Encephalopathy.yaml
    entry (the severe, fully penetrant end of the same gene's spectrum)
    rather than duplicating it.

    Environmental trigger bound to ECTO:0000007 (exposure to visible light
    radiation), found directly in MONDO's own logical definition of the
    disease (RO:0009501 ECTO:0000007), linked via influences_mechanisms with
    environmental_effect TRIGGERS. Pattern stimulation was searched in ECTO
    and left unbound with notes recording that no suitable term exists.

    Sourced from primary literature: Takahashi et al. 1999 (PMID:10496248,
    PPR mechanism), Galizia et al. 2015 (PMID:25783594, CHD2), Strigaro et
    al. 2015 (PMID:26395125, TMS visuomotor connectivity), Bai et al. 2019
    (PMID:31526678, Chinese Han epidemiology), Gurrell et al. 2019
    (PMID:30877186, GABA-PAM trial), Kasteleijn-Nolst Trenite et al. 2025
    (PMID:40580381, valproate sex differences), Santoshkumar et al. 2008
    (PMID:18358403, Unverricht-Lundborg), the 2022 reflex-seizure scoping
    review (PMID:35807051), and the ILAE 2022 childhood-epilepsy nosology
    position paper (PMID:35503717). Then cross-checked against a falcon
    (Edison Scientific) deep-research report
    (research/Photosensitive_Epilepsy-deep-research-falcon.md; a cached run,
    reference_validation: 9/9 resolved, 0 unresolved, 0 off-topic,
    confabulation_rate 0.0), which independently corroborated the pure-PSE-
    vs-epilepsy-with-photosensitivity distinction and the visual-cortical /
    frontoparietal network model used here. Ran `just preflight-dr`, which
    returned SKIP because MONDO:0015643 records no single causal gene
    (expected for this genetically heterogeneous, complex trait); a manual
    OMIM/synonym cross-check against the runoak MONDO record (OMIMPS:132100,
    synonyms photoparoxysmal response / PSE, is_a inherited reflex epilepsy)
    found no Named Entity Confusion.

    Validation: `just validate` (schema clean, terms clean, 40/40 snippets
    verified), `just validate-disorders` (the batched pre-PR sweep, all
    passed, 40/40 snippets verified), `just check-duplicate-keys`,
    `check-entity-refs`, `check-folded-hyphens`, `check-snippet-length`,
    `check-title-snippets`, `check-snippet-grading`, and
    `check-environmental-evidence` all clean, and the full
    `pytest tests/test_data.py` suite (9814 passed, 0 failed; one
    informational UserWarning noting the intentionally MONDO-unbound Pure
    Photosensitive Epilepsy subtype has no subtype_term, by design).

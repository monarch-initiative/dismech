  summary: 'Review: Acquired Partial Lipodystrophy'
  details: |
    Re-reviewed classic non-HIV Barraquer-Simons syndrome against the largest contemporary APL cohorts, multisociety guidance, primary complement experiments, current regulatory labels, and the live ClinicalTrials.gov record. Corrected the C3NeF causal direction, qualified factor D, single-biopsy, and single-patient expression findings, removed HLA-DRB1 as a causal gene, and recorded unresolved HLA/LMNB2 and depot-selectivity questions. Added Spanish prevalence, cohort-backed metabolic and renal frequencies, macular drusen and emotional-wellbeing surveillance, DXA assessment, differential diagnoses, jurisdiction-specific metreleptin guidance, trial eligibility/status, and complete reference-catalog closure. Schema, ontology terms, file-scoped causal graph, phenotype connectivity, CX2, KGX, enum-cache, folded-hyphen, pre-commit, and normalized evidence audits passed; KGX export produced 35 nodes and 54 edges, and all 124 evidence items resolved across 23 catalogued references.

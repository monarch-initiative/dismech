  summary: Declare conformance to the genome-instability hallmark module
  details: |
    Added conforms_to: genome_instability_mutation#Mutator Phenotype and Chromosomal Instability on the EMAST Tetranucleotide Repeat Instability node, found by checking which modules already bind MSH3 rather than by review feedback.

    Two modules bind MSH3 and only one of them is the right target. kb/modules/mismatch_repair_driven_repeat_instability.yaml is the closer match by gene, and is wrong here: its own notes state that it covers the case where the MMR machinery is intact and paradoxically drives tandem-repeat expansion, a gain of a toxic repair outcome, and that it is explicitly not the cancer mutator phenotype. This disease is the opposite case, loss of MutS-beta producing a mutator phenotype, so genome_instability_mutation is the correct module and the near-miss is recorded here so it is not revisited.

    The conforming node binds GO:0043570 maintenance of DNA repeat elements DECREASED where the module node binds GO:0006281 DNA repair DECREASED. just check-conformance-content therefore reports one process_absent finding, which is the documented benign specific-for-generic substitution rather than a mis-picked anchor; the reason is stated in the node's own description, together with what this disease substitutes into the hallmark: the caretaker lesion is MutS-beta loss and the resulting mutator phenotype is tetranucleotide-selective rather than the hypermutation of MutS-alpha-deficient Lynch syndrome, which is why the standard five-marker panel reads microsatellite-stable.

    Checked at the same time, and no change needed: no existing kb/ entry curates MSH3 as a causal gene for any polyposis, and the two committed FAP entries (MONDO:0021056 and MONDO:0021055) are APC-based and contain no MSH3 mention, so this entry does not double-model either of them. That check was prompted by finding a duplicate the hard way on the sibling ATP6AP2 curation.

    validate-disorders clean after the change: 24 snippets, 24 titles, 0 issues.

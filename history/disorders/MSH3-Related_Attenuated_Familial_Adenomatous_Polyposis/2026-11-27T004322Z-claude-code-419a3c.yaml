  summary: 'Review round 1: MSH3-Related Attenuated FAP'
  details: |
    Answered the ai4c-reviewer CHANGES_REQUESTED review on PR 19066 in one push. Both blocking items and both suggestions are addressed. Every quote the review offered was checked against the reference cache first, and all of them were present verbatim.

    Item 1, no treatments section. Two rows added. Endoscopic surveillance of the upper and lower gastrointestinal tract, bound to NCIT:C78162 Gastrointestinal Endoscopy, quoting both of PMID:35675019's relevant sentences: the schedule itself, colonoscopy every one to two years from 18 and gastroduodenoscopy at least every five years from 35 with intervals by polyposis severity, and the separate statement that surveillance in biallelic MSH3 carriers seems warranted. The row's description records what that recommendation is and is not: the authors' own suggestion from the available cases, not a society guideline and not an outcome study, in a disease with very few published carriers. It also records why the duodenal arm is not optional, since duodenal adenomas are in the reported phenotype. Colectomy for uncontrollable polyp burden or carcinoma, bound to NCIT:C15209, quoting PMID:38243056's emergency left colectomy for an obstructing descending colon cancer at 43, with the description noting that surgery here is reactive and that no cited source recommends risk-reducing colectomy on genotype alone.

    Aspirin chemoprevention is deliberately not recorded, and the reason is in the colectomy row's notes rather than left implicit. The review offered it as optional and said to mark it as extrapolated from Lynch trials. Every supporting trial was run in Lynch syndrome and no MSH3 carrier has been randomised, so a treatment row would present a cross-genotype extrapolation as this disease's evidence; the note records the reasoning so it is not rediscovered.

    Item 2, the bundled cyst row. Split into a Renal cyst row on HP:0000107 and a Hepatic cysts row on HP:0001407, so the hepatic finding is queryable. Both rows carry the PMID:37597744 sentence that reports the two findings together, and both now also carry PMID:38243056, a second unrelated patient in whom renal and hepatic cysts were the only extraintestinal lesions. That second source is why the rows describe a recurring extraintestinal finding rather than a single observation, and it also resolves the review's second suggestion, since PMID:38243056's cache file was previously committed without being cited.

    Suggestions. Stomach cancer on HP:0012126 and Astrocytoma on HP:0009592 added from the index cohort's tumour-spectrum sentence in PMID:27476653, hedged as the breast-carcinoma row is. The astrocytoma row states the limit explicitly: a single CNS tumour among four patients establishes neither risk nor mechanism, and no cited source links MutS-beta loss to glial transformation.

    Three reference_title values written during this round were composed rather than copied, and the pre-push title audit caught all three before the push: PMID:38243056 twice, PMID:27476653 twice and PMID:35675019 twice, each corrected to the cache frontmatter's own title. The failure mode is the one CLAUDE.md describes, a plausible title that reads like a title and is not one, and the audit is the only thing that catches it. A fourth error of the same family was caught by reading rather than by a gate: the treatments row's target_phenotypes was first written with HP:0012125, whose actual label is Prostate neoplasm, and then with HP:0100273 labelled Neoplasm of the rectum when the canonical label is Neoplasm of the colon. Both were corrected from the entry's own existing phenotype rows and from OLS.

    Validation: validate-disorders clean, 32 snippets and 32 titles with 0 issues; all reference titles re-audited to 0 mismatches; term validation passes offline with the NCIT cache rows committed, which also confirms NCIT:C78162 and NCIT:C15209 are inside the TreatmentActionTerm dynamic enum.

  summary: Create La Crosse encephalitis infectious disease entry
  details: |
    Added a new La Crosse encephalitis entry for MONDO:0019378 and deleted its stub. The curation models La Crosse virus as a mosquito-borne orthobunyavirus, binds Aedes triseriatus as the primary vector, records humans as incidental dead-end hosts, and separates mosquito-bite infection, hematogenous olfactory-bulb neuroinvasion, and viral meningoencephalitis in the pathograph.

    The entry uses PMID:35755222, PMID:34280142, PMID:35607778, PMID:25956408, PMID:35891445, and PMID:39079177 to support enzootic vector ecology, incidental human infection, passive-surveillance incidence and case counts, pediatric symptomatic-disease predisposition, neuroinvasive presentations, acute seizure and status epilepticus burden, mouse olfactory-bulb capillary neuroinvasion, neuronal infection and apoptosis in murine LACV encephalitis, SIADH-mediated hyponatremia, EEG/MRI abnormalities, post-encephalitic epilepsy, long-term neurobehavioral sequelae, IgM/neutralization diagnosis, EEG and MRI diagnostic evaluation, and supportive seizure-focused management. Asian invasive mosquito vectors, Gc fusion-peptide determinants, and the historically reported but reinterpreted acute-flaccid-paralysis phenotype were left out of the structured graph.

  summary: 'Create: Spinocerebellar Ataxia Type 8 (MONDO:0012116)'
  details: |
    De-novo curation of SCA8 from a Perplexity deep-research report (research/Spinocerebellar_Ataxia_Type_8-deep-research-perplexity.md, sonar-deep-research, 21 citations). Unlike the sibling BPPV run in the same batch, this report did carry reference_validation and term_validation frontmatter, and reading it first changed what was reused: term validation reported needs_review true, with 19 of 43 checked labels naming a different term than the report claimed. None of the report's CURIEs were therefore reused. Three of its errors would otherwise have been silently wrong in this entry: HP:0001270 offered as Dysarthria is Motor delay (correct HP:0001260), HP:0002067 offered as pyramidal signs is Bradykinesia, and both gene identifiers were wrong (ATXN8 given as HGNC:13813, correct hgnc:32925; ATXN8OS given as HGNC:10610, correct hgnc:10561, both resolved via OAK sqlite:obo:hgnc). Only 8 of 21 citations resolved to identifiers; the remainder were web pages, so PMIDs were recovered from the report's PMC URLs via the NCBI ID converter and from PubMed title searches. The entry's structural decision is to model the three toxic products of the single CTG-CAG expansion as three parallel mechanistic_hypotheses (rna_gain_of_function and polyglutamine_protein_toxicity as CANONICAL, ran_translation_toxicity as EMERGING) rather than as one linear chain, with downstream edges opting into the matching hypothesis_groups. A HUMAN_MODEL_MISMATCH discussion records that the causal weighting between the three arms rests on mouse and cell interventions while the human evidence is co-localisation only. MBNL1 is recorded under genetic as MODIFIER with a review_notes stating it is model-organism evidence and not a human modifier gene. One label error was caught by term validation during curation: NCIT:C159273 is Speech Language Therapy, not Speech Therapy as CLAUDE.md's backfill table spells it. Validated with just validate (schema, terms, references: 46/46 snippets verified) plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values, all clean.

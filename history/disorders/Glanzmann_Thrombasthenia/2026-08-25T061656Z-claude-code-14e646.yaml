  summary: Set both prevalence measure_type values to UNKNOWN (sources state none)
  details: |
    Correction to an earlier record in this session, plus a non-blocking review-round-2 fix.

    CORRECTION. The history record 2026-08-25T055126Z-claude-code-2d995e.yaml (and the corresponding PR comment) described the reference_title mis-attribution using the WRONG author names. History records are append-only, so that record is left as written and this one carries the correction.

    What it said: "all 16 evidence items citing PMID:21765412 (Kahr, 'NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet alpha-granules') carried the title of PMID:21765413 (Albers, 'Mutations in NBEAL2, encoding a BEACH protein, cause gray platelet syndrome')".

    What is actually true, verified against the committed cache frontmatter in this session:
      PMID:21765412 = Gunay-Aygun M et al. - "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet alpha-granules."
      PMID:21765413 = Kahr WH et al. - "Mutations in NBEAL2, encoding a BEACH protein, cause gray platelet syndrome."

    So the sixteen items carried KAHR's title on GUNAY-AYGUN's PMID. Albers is the third of the back-to-back 2011 Nature Genetics NBEAL2 papers and is not cited in this entry at all - naming it was an error on top of the transposition.

    Two things worth separating: the TITLES in the earlier record were correctly paired to their PMIDs, and the YAML fix that record describes was and remains correct (PMID:21765412 now carries the Gunay-Aygun title). Only the author attribution in the prose was transposed. No curated data was wrong as a result of this correction; the defect was in the description of the fix, not the fix.

    The transposition was caught by the ai4c-reviewer in round 2, which checked the claim against the cache rather than accepting it - and then independently swept every reference_title and references[].title across all ten touched files (397 checked, 0 mismatches). The lesson is the same one the original defect taught: a claim about a source needs checking against the source, and that applies to a claim made while fixing a previous such claim.

    NON-BLOCKING FIX (review round 2). The reviewer noted that Gray_Platelet_Syndrome's prevalence record asserted measure_type: POINT_PREVALENCE while its source (PMID:31710726) says only "a rare (<1/1 000 000) and inherited platelet function disorder" - stating no measure type at all. Corrected to UNKNOWN, with the notes: updated to say why.

    The same audit was then applied to this session's other prevalence records rather than fixing only the one flagged: both Glanzmann_Thrombasthenia records also asserted POINT_PREVALENCE from sources that state no measure type (one explicitly declines to estimate prevalence; the other gives a qualitative "may actually be a common hereditary hemorrhagic disorder"). Both corrected to UNKNOWN. Note that the reviewer's comparison pointed at Glanzmann as already handling this correctly - that was true of its prevalence_class but not of its measure_type, so the flagged inconsistency was broader than reported.

    Validation after these changes: Gray_Platelet_Syndrome 37/37 snippets verified, Glanzmann_Thrombasthenia 52/52, both schema and term validation clean.

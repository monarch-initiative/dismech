  summary: 'Create: Glanzmann Thrombasthenia (MONDO:0100326, BDPLT2)'
  details: |
    Curated Glanzmann thrombasthenia as the aggregation-arm worked conformer of the new primary_hemostatic_plug_failure module and the mechanistic mirror image of the existing Bernard-Soulier_Syndrome entry.

    Scope decision: MONDO:0100326 (Orphanet:849, OMIMPS:273800) is the primary disease_term, with MONDO:0031332 (GT1, ITGA2B) and MONDO:0031009 (GT2, ITGB3) carried as has_subtypes rather than as separate entries - the subunits are obligate heterodimer partners and the two genotypes are clinically indistinguishable, so splitting them would duplicate one pathograph. The type I / type II / variant classes are carried as subtypes too, flagged in-file as a phenotypic severity axis crossing both genes rather than as additional genotypes; variant GT earns its place because a quantitative flow-cytometry screen misses it. Three stubs were deleted (Glanzmann_Thrombasthenia, _1, _2).

    Boundaries drawn explicitly: the dominant ITGA2B/ITGB3 macrothrombocytopenias caused by variants at the alphaIIb Arg995 / beta3 Asp723 cytoplasmic salt bridge (BDPLT16, BDPLT24) have the OPPOSITE mechanism - increased integrin activation interfering with megakaryocytopoiesis - and are recorded only as a differential diagnosis and as a caveat in the ITGB3 gene block, so a variant in either gene is not by itself a diagnosis of this entry. LAD-III (FERMT3/kindlin-3) belongs to the module's signalling arm, not here.

    Prevalence deliberately left unquantified at worldwide level: PMID:16722529 explicitly declines to estimate it, because ascertainment is dominated by consanguineous populations (of 177 reviewed patients only 12 were from the United States). A qualitative COMMON band is recorded separately for the named populations with no numerator. Deriving a rate from a case series was the alternative and was rejected as fabrication.

    Two discussions: a KNOWLEDGE_GAP on why same-variant patients differ so widely in severity (neither genotype nor residual receptor level predicts it, which matters because prophylaxis and transplant decisions are severity-driven), and a HUMAN_MODEL_MISMATCH on whether the beta3-null mouse placental defects and fetal mortality correspond to anything in human ITGB3-null patients - scoped to the ITGB3 arm only, since ITGA2B patients retain alphaVbeta3 entirely.

    Validation: linkml-validate PASSED; linkml-term-validator PASSED; reference validation PASSED with 52/52 snippets verified. PMID:16722529 is cached as full text, so several snippets carry PDF-extraction hyphenation artefacts (diag- nosis, character- istic, insidi- ously); these are faithful to the cached text and are not transcription errors. Two snippets were trimmed during validation - one to avoid a stripped [27,28] citation marker, one to avoid a hyphenated word split - rather than paraphrased.

  summary: Remove unevidenced 5-20% residual-receptor figure from the Type II subtype
  details: |
    Follow-up to PR #9456 (merged). Content-accuracy pass over the platelet-type bleeding disorder tranche, targeting quantitative claims in curator prose that are not supported by the entry's own cited sources.

    METHOD, and why the first version of it was wrong. Extracted every numeric claim (percentages and ranges) from description/notes/rationale prose across the five new entries and the module, then checked each against the full cached text of every PMID that entry cites. The naive form of that check - does the number appear anywhere in the corpus - passed everything, including the defect that prompted the audit. The reason is instructive: "5-20" does appear in the Glanzmann source, three times, all of them as bibliography page numbers ("Platelets 1998, 9:5-20"). A substring test over a document that ends in a reference list will confirm almost any small number. The check only works when the surrounding context is inspected, so the second pass printed source context for each hit and excluded bibliographic matches by pattern. Seven numeric prose claims across the tranche; five verified genuinely supported, two not.

    FIX 1 - Glanzmann_Thrombasthenia, Type II subtype. The description read "reflecting residual surface alphaIIbbeta3 (conventionally 5-20%)". The 5-20% figure is conventional teaching about type II thrombasthenia; it is not in PMID:16722529, and no other source cited by this entry quantifies residual receptor. Removed, with a sentence recording that the figure was deliberately not stated and why, so a later curator does not helpfully restore it from memory. The neighbouring figures in the same block are all genuinely sourced and were left: 78% type I, 14% type II and 8% variant GT are verbatim from the Hopital Lariboisiere series in that review ("50 out of 64 patients (78%) had type I disease, nine patients (14%) had type II disease with residual alphaIIbbeta3, and five patients (8%) were classified as variant GT"). Note the 8% took a second look to confirm - the first grep missed it because the cached full text carries PDF hyphenation artefacts across the sentence.

    FIX 2 - Gray_Platelet_Syndrome, Genetic counselling. "Recurrence risk is 25% for future pregnancies of carrier parents" appears in none of the entry's eleven cited sources. Unlike the Glanzmann case this is not an error: 25% is the Mendelian consequence of autosomal recessive inheritance, which the entry does evidence, so it is arithmetic rather than a measurement. Reframed to say so explicitly rather than deleted, because deleting correct and clinically necessary counselling information would be the worse outcome, and because the sentence as written read like a sourced rate. This distinction - derived-from-evidenced-premises versus separately-measured - is the useful part of this fix.

    FIX 3 - Gray_Platelet_Syndrome, CTLA-4 interaction. The co-immunoprecipitation item (PMID:37349339) carried evidence_source: HUMAN_CLINICAL. A co-IP is a biochemical assay performed outside an organism; the patients supply the material but the interaction is demonstrated on the bench. Now IN_VITRO, with the reasoning in the explanation. This was raised as non-blocking by the reviewer on #9456 and explicitly deferred there as scope creep, since it sits in a hunk that PR did not otherwise touch. It is in scope now.

    CHECKED AND FOUND CLEAN, recorded so the work is not repeated: the 58% myelofibrosis rate, its median age of 28.5 years, and the 17% infection-susceptibility figure in the Gray_Platelet_Syndrome notes are all verbatim in PMID:34408521. The four remaining numeric hits across the tranche were HPO frequency-band definitions (VERY_FREQUENT 80-99%, FREQUENT 30-79%, OCCASIONAL 5-29%), which are schema conventions rather than claims about a source.

    Validation: Glanzmann_Thrombasthenia 52/52 snippets verified, Gray_Platelet_Syndrome 78/78, schema and terms pass on both, duplicate-key and folded-hyphen gates clean. One folded-hyphen finding was introduced by this commit's own prose and reflowed before commit - the third time in this work that explanatory prose has tripped that gate.

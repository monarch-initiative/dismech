  summary: 'Create: Ureaplasma urethritis'
  details: |
    Created the Ureaplasma urethritis entry from a local infectious-disease gap candidate. Curated Ureaplasma urealyticum as the supported conditional agent, added human sexual transmission and host lifecycle context, built a load-qualified urethral colonization to neutrophilic urethritis mechanism, added carriage and symptomatic NGU phases, added dysuria and urethral discharge phenotypes, modeled microscopy and Ureaplasma PCR diagnosis, and grounded NGU antibiotic therapy in the cached randomized trial. Deliberately left Ureaplasma parvum out of infectious_agent because the cited species-resolved NGU literature treats it primarily as a colonizer rather than a supported male NGU cause.

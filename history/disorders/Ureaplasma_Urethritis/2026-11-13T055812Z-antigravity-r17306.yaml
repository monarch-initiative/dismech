  summary: 'Addressed PR 17306 review: rebound urethral epithelial cell (CL:1000296), oriented persistence/IgA1 virulence nodes upstream of colonization, trimmed unsourced beta-lactam claim, and split Chlamydia/Mycoplasma NGU differentials'
  details: |
    Rebound cell_types on High-Burden Urethral Ureaplasma Colonization from generic epithelial cell (CL:0000066) to epithelial cell of urethra (CL:1000296) and added PMID:22646228 urethral epithelial attachment evidence. Re-oriented Ureaplasma Urea Catabolism and Surface Persistence and Ureaplasma IgA1 Cleavage upstream of High-Burden Urethral Ureaplasma Colonization via INDIRECT_UNKNOWN_INTERMEDIATES edges and removed the reverse downstream edges from High-Burden Urethral Ureaplasma Colonization. Trimmed the unsourced intrinsic beta-lactam resistance claim from Ureaplasma Ribosomal Translation (Tetracycline and Macrolide Target) and added PMID:22646228 cell-wall-absence evidence. Added PMID:26220178 clinical evidence to the Gonorrhea differential diagnosis and split the bundled Chlamydia trachomatis or Mycoplasma genitalium Nongonococcal Urethritis entry into separate Chlamydia trachomatis Nongonococcal Urethritis (MONDO:0005701) and Mycoplasma genitalium Nongonococcal Urethritis (MONDO:1030003) entries with pathogen-specific quotes from PMID:26220178.

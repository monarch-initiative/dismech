  summary: 'Create: Leukocyte Adhesion Deficiency Type II'
  details: |
    New entry for SLC35C1-related leukocyte adhesion deficiency type II (MONDO:0009953). Eight pathophysiology nodes in one connected component, deliberately branching rather than chaining: a single Golgi GDP-fucose transport failure produces the loss of sialyl-Lewis X selectin ligands (immune), the loss of red-cell H-antigen fucosylation (Bombay phenotype, clinically inert), and growth/neurodevelopmental impairment, none of which is downstream of the others. Oral fucose is curated with its genotype-dependence stated, since the founder-mutation study reports the two alleles differ in response. The compound-heterozygous sibling pair with a partial defect and no immune phenotype is curated as an INTERPRETATION discussion. The CHO-gmt5 knockout line is an experimental_models entry with limitations noting it models the transporter's biochemistry rather than the disease. Ontology note: the research report suggested GO:0036065 for fucosylation, which is obsolete, and mislabelled CL:0000071; both corrected against OLS. 29/29 snippets verified and independently re-checked as raw substrings.

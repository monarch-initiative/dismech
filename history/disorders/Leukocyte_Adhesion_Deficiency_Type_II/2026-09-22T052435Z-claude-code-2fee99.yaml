  summary: 'Review: connect LAD II''s five detached phenotypes (IUIS Table 5)'
  details: |
    All five phenotypes were detached. Three attach to the extravasation-failure node and two to the growth and neurodevelopmental node.

    The leukocytosis edge carries the diagnostic point: neutrophils accumulate in the circulation because they cannot leave it, so a high count indicates this disease rather than excluding it. The two systemic edges are what distinguish LAD II from an isolated adhesion defect - global hypofucosylation affects far more than the selectin ligands, which is why this one is a syndrome.

  details: |
    Response to the first review round, taking evidence from 29 to 40 items. Regraded the fibroblast fucose-correction item from HUMAN_CLINICAL to IN_VITRO, since it is a cultured-cell experiment and the item's own explanation called it the in-vitro correction. Replaced the periodontitis evidence: the reviewer pointed at the PLOS Pathogens Moutsopoulos paper, but PMID:25741691 is about LAD-I (CD18/ITGB2), a different gene and a different disease, so citing it here would have been Named Entity Confusion. Declined it, left no cache file behind, and used PMID:11213799 instead, a LAD II-specific review stating that chronic severe periodontitis is the only persistent clinical symptom, which upgrades the phenotype from PARTIAL/FREQUENT to SUPPORT/VERY_FREQUENT. Added a clinical_trials section with NCT05462587, NCT05754450 and NCT03354533, and AVTX-803 as its own treatment separated from compassionate-use fucose. NCT03354533 carries no evidence item because its cached content restates the title; the reason is recorded in notes. Added a diagnosis section (neutrophil sialyl-Lewis X flow cytometry, Bombay typing, SLC35C1 sequencing). Added the Slc35c1-knockout mouse to animal_models with two modeled_mechanisms links, and curated the lymph-node-versus-spleen homing dissociation as an INTERPRETATION discussion. Named the founder-allele response difference from the same LAD II review. 40/40 snippets verified and independently re-checked as raw substrings.

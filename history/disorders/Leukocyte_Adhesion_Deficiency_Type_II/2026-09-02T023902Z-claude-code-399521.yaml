  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Created a classifications block; the entry previously had none. Added harrisons_chapter (IMMUNE_RHEUMATOLOGIC for the inborn error of immunity presenting with recurrent bacterial infection and leukocytosis; GENETICS_ENVIRONMENT_DISEASE for the Mendelian congenital disorder of glycosylation) and iuis_category: phagocyte defect.

    IUIS 2022 Table 5, section 2 (Defects of Motility), cache line 3038: 'Leukocyte adhesion deficiency type 2 (LAD2) SLC35C1 AR 605881', affected cells N + M, affected function rolling and chemotaxis, associated features mild LAD type 1 features with the hh blood group, growth retardation and developmental delay.

    An unambiguous 1:1 match on disease name, gene and OMIM number - no scoping judgment was required. The notes record that the lesion is on the functional axis: neutrophils are produced normally and the defect is in selectin-ligand-dependent rolling, which is why the blood neutrophil count is high rather than low.

    Evidence cites PMID:35748970 with the row quoted verbatim.


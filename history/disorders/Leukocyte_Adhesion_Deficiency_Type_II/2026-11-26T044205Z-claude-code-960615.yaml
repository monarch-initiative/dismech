  summary: 'Gene-family review: SLC35C1; ground the transporter node and record ClinGen
    tier'
  details: |
    SLC35C1 was named only in the genetic_context of the variant node, so it landed on no node with a molecular function. The node Impaired Golgi GDP-Fucose Import, which binds GDP-fucose transmembrane transporter activity (GO:0005457), now carries SLC35C1 in genes. Its modifier was LOSS_OF_FUNCTION; it is now DECREASED, because the claim is a quantitative reduction of transport (hypomorphic compound-heterozygous alleles leave residual transport, as the record's notes say) and the variant consequence is already recorded as functional_impact_category LOSS_OF_FUNCTION on the variant node. ClinGen classifies SLC35C1 Strong for leukocyte adhesion deficiency type II (MONDO:0009953, the entry's disease term, 2025-11-03); the tier is now recorded, and supports the existing CAUSATIVE typing.

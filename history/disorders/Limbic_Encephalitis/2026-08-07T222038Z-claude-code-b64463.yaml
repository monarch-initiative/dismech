  summary: Point each tumor exposure at the antibody node it defines
  details: |
    Backfill for issue #8085. The three tumour exposures target three different nodes rather than converging on one, which is the discrimination this entry earns. Underlying Neoplasm targets the general neuronal antigen humoral autoimmunity node; small-cell lung cancer targets the GABAB receptor node, because the cited series is the founding GABAB cohort in which five of seven tumours were small-cell lung cancer; and the thymus, breast, or lung exposure targets the AMPAR node, because the cited cohort is the one that first characterised AMPAR antibodies. All three are TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES, with loss of immune tolerance as the named intervening step, and all three carry supports SUPPORT because each sentence attaches its exposure to the specific antibody group rather than to paraneoplastic limbic encephalitis at large. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 69 of 75 with 6 pre-existing DOI-prefix skips.

  summary: 'Create: X-linked_Intellectual_Disability_Van_Esch_Type'
  details: |
    New entry for Van Esch-O'Driscoll syndrome (VEODS; MONDO:0015601, OMIM 301030), X-linked recessive syndromic intellectual disability caused by hemizygous hypomorphic POLA1 variants. Curated from PubMed (7 cited references: the 2019 gene-discovery paper PMID:31006512 in PMC full text, the 2005 linkage report of the first family, the 2021 case report, the POLA1 X;6 translocation and Xp microdeletion reports, and two reviews). The cached record for PMID:33392852 was upgraded from abstract to PMC full text by a plain fetch; the XLPDR entry's snippets from it still verify (98/98). Pathograph: hypomorphic POLA1 variants -> impaired replication origin firing and hypersensitivity to replication stress (patient lymphoblastoid cells, family C and families A-C) -> proposed deficient replication in proliferating developmental cells -> microcephaly, ID, developmental delay, short stature, IUGR; a separate node records selection against POLA1-deficient cells in carrier females. The developmental node carries a REFUTE item (patient LCLs proliferate normally) and the patient LCL experimental model records FAILS_TO_RECAPITULATE for it. Hypogonadism, seizures and other single-family features are left unwired because no source gives a mechanism. The XLPDR interferon / RNA:DNA hybrid mechanism and the review's statements about a VEODS interferon signature and reduced MCM4 were deliberately not encoded. HP:0012546 Skewed maternal X inactivation was dropped as a phenotype because it is outside the PhenotypeTerm enum. No treatment recorded (none reported). One OpenScientist deep-research report was used as leads (14/14 references resolved, 0 unresolved terms; preflight-dr PASS); its interferon arm, slowed-fork claim and HPO-annotation frequencies were not adopted; one review sentence it surfaced (PMID:33392852) was added. Validation: just validate, validate-terms, count-verified-snippets 60/60, validate-disorders, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, check-retired-support-prose all pass; check-genereviews --online NO_CHAPTER; list-disconnected-phenotypes 5/17 connected.

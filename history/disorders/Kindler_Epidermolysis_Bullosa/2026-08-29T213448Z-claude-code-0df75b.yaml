  summary: 'Review: Kindler Epidermolysis Bullosa evidence re-read against cached
    sources'
  details: |
    Re-read all 26 cached references and re-verified all 74 evidence items, including the
    8 non-PMID items (7 DOI + 1 clinicaltrials) and 2 GEO items the machine verifier skips.
    All 74 snippets are exact substrings of their cache bodies, including the Cyrillic
    character in the DOI:10.15690/vsp.v23i5.2808 snippet.

    Fixed in this pass:
    - references[PMID:26937547]: an author byline ("Youssefian L(1), Vahidnezhad H(1),
      Uitto J(1).") was curated as a finding's statement, its supporting_text, AND its
      evidence snippet. It is an exact cache substring - which is why every mechanical check
      passed - but it is a list of authors supporting no claim, and it evades
      check-title-snippets (not a title) and check-snippet-length (44 characters). Removed;
      the same PMID is cited 18 other times with real clinical sentences.
    - references[DOI:10.3389/fped.2024.1425030]: a clinical/genetic case report plus Chinese
      literature review was graded COMPUTATIONAL on a sentence describing the KS phenotype.
      Regraded HUMAN_CLINICAL.

    Recorded, not fixed:
    - The SCC mortality figure "38.5% of SCC-bearing patients dying" is in no cached source;
      every other number in that description is snippet-backed.
    - Two PMID:19762710 items quoting a transfection/overexpression rescue in cultured KS
      keratinocytes are graded HUMAN_CLINICAL; that is the textbook IN_VITRO case.
    - Carrasco et al. 2024 is cited under both PMID:38982038 (MODEL_ORGANISM) and
      DOI:10.1038/s41389-024-00526-1 (HUMAN_CLINICAL) - one publication, two grades.
    - pathophysiology[Mucosal Involvement] describes intestinal and oral epithelium but
      binds only CL:0000312 keratinocyte.
    - has_subtypes carries two disease *phases*, which belong in progression:.

  summary: Add environmental risk factors and expand treatments
  details: |
    Curation pass on treatments and risk factors for the existing Bloom syndrome entry.

    Added an environmental section, which the entry previously lacked, covering the three exposures the sources treat as modifiable in this disease.

    1. Ultraviolet radiation exposure (ECTO:0000006). TRIGGERS edge to the Cutaneous photosensitivity phenotype, causal_link_type DIRECT, on the GeneReviews statement that the rash appears after the first sun exposures of infancy or early childhood on skin that is generally normal before then. Deliberately scoped to the eruption. No claim is made that ultraviolet exposure drives the overall cancer burden, because the registry cancer spectrum is dominated by hematologic and gastrointestinal tumours rather than skin cancers.

    2. Ionizing radiation exposure (ECTO:7000047). EXACERBATES edge to Early-Onset Multicancer Predisposition, causal_link_type INDIRECT_KNOWN_INTERMEDIATES. EXACERBATES rather than TRIGGERS because the biallelic BLM lesion establishes the predisposition and radiation adds to it. The human evidence available concerns hypersensitivity and treatment toxicity rather than a measured excess of radiation-induced cancers, so the carcinogenicity claim on the mechanism edge is carried by an irradiated Blm-deficient mouse model and graded MODEL_ORGANISM. PMID:40641635, the largest paediatric series, reports radiotherapy acutely well tolerated in the two children who received it and is carried as REFUTE evidence at entry level rather than dropped, since it is the only direct paediatric tolerability observation. No IARC group recorded, because the entry describes medical radiation exposure in this disease rather than an agent-level carcinogen assessment.

    3. DNA-damaging antineoplastic agent exposure (ECTO:9001737). EXACERBATES edge to Early-Onset Multicancer Predisposition. The supporting quote from PMID:38995367 states in the same sentence both the practice recommendation against alkylating agents and that it rests on mechanism and clinical judgement rather than comparative outcome data, which is why it was chosen over a bare recommendation sentence. Entry review_notes record that this is curated as an iatrogenic exposure, not as an argument for withholding chemotherapy.

    All three ECTO terms were already present in cache/ecto/terms.csv and the exposureterm enum cache, so the bindings validate offline.

    Treatments went from seven to eleven.

    Added: hematopoietic cell transplantation for hematologic malignancy (NCIT:C15431), recorded because it is performed rather than because the evidence recommends it, with the single detailed paediatric myeloablative case that ended in treatment-related death carried as REFUTE; multidisciplinary endocrine and metabolic co-management during cancer therapy (NCIT:C15747); genetic counseling and reproductive options (NCIT:C15240, COUNSELING_INFORMATIONAL); developmental and educational support (NCIT:C15747). All four NCIT terms were confirmed present in the treatmentactionterm enum cache before use.

    Enhanced: Individualized reduced-toxicity cancer therapy gained four evidence items from PMID:33226170 and PMID:40641635 covering the start-low-escalate strategy, the reported 20 to 60 percent dose reductions, the observation that every remission in the paediatric series followed tailored dose reduction, and the five-of-nine remission rate, plus review_notes stating that the quantitative figures come from two case reports and a nine-patient series and support individualization rather than any specific percentage. Age- and organ-specific cancer surveillance gained the GeneReviews dermatologic skin-exam recommendation, which is the organ-specific counterpart to the ultraviolet risk factor.

    Three new references fetched: PMID:40641635, PMID:33226170, PMID:38995367. PMID:37644665 was fetched during the search and discarded because it is a Letter with no abstract or full text in the cache, so nothing in it is quotable.

    Growth hormone therapy was searched for and deliberately omitted. Candidate PMIDs surfaced (33122222, 34136918) describe growth hormone deficiency or short-stature genetics rather than a Bloom-syndrome-specific recommendation, so no claim was curated.

    Validation: just validate passed with 123/123 snippets verified; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean on this file.

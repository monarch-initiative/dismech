  summary: 'Review: Bloom Syndrome'
  details: |
    Comprehensive re-review of biallelic BLM-related Bloom syndrome. Rebuilt the causal pathograph around BTRR double-Holliday-junction dissolution failure, hyper-recombination, sister-chromatid exchange, loss of heterozygosity, somatic instability, and early multicancer predisposition. Added fourteen causally connected major phenotypes while preserving growth, dermatologic, immune, metabolic, reproductive, pulmonary, and thyroid manifestations behind an explicit unknown-intermediates node because their molecular routes remain unresolved. Added molecular and cytogenetic diagnosis with the SCE specificity caveat, evidence-bound management and surveillance, three differential diagnoses, the historical registry protocol, a Bloom mouse model, GSE283485, and four open interpretation gaps. Validated schema and ontology terms, 100% recommended-field compliance, 14/14 phenotype connectivity, 1/1 causal-gene wiring, a 27-node/31-edge graph without integrity issues or orphan targets, normalized-exact evidence across 82 evidence items and 13 sources, D2P review, CX2/KGX export, scoped hooks, and a fully paginated open-PR overlap scan with zero overlaps.

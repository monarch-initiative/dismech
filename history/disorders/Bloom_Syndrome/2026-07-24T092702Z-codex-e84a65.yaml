  summary: Resolve Bloom syndrome review and CI findings
  details: |
    Addressed every requested review change and the failing reference-validation check. Reclassified GeneReviews evidence claim by claim, aligned both PMID:7585968 uses as human clinical gene-discovery evidence, tagged the canonical GeneReviews PMID, retained URL citations only for full-text-only claims, and replaced interrupted or overbroad excerpts with exact cache-backed text. Split the cancer mechanism into atomic BTRR dissolution, mitotic hyper-recombination, loss-of-heterozygosity, and multicancer nodes; modeled elevated sister-chromatid exchange as a noncausal diagnostic readout. Added six evidence-backed major phenotypes and a feeding/reflux management entry, clarified diagnosis and progression wording, and restored the legacy metadata date. Final measurements: schema and ontology-term validation passed; 102/102 evidence items and all titles validated cache-only; recommended-field compliance was 241/241 (100%); the pathograph had 34 used nodes, 39 edges, one component, no integrity issues or orphan targets, 20/20 phenotypes graph-linked (19 causal plus one readout), and 1/1 causal gene wired; 41 focused tests passed. Reference-cache blobs were kept byte-identical.

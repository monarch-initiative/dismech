  summary: 'Review round 1: evidence grading, knockout gap, FEMg'
  details: |
    Answers the review on PR 14307. Two abstract sentences from PMID:17671655 that summarize the MDCK and HEK293 assays were re-graded from HUMAN_CLINICAL to IN_VITRO, the second also marked directness INDIRECT. The deep-research report's claim that Egf-knockout mice do not become hypomagnesemic could not be sourced: its citation does not resolve, and PubMed and Europe PMC searches (recorded verbatim in the entry notes, re-run before commit) returned no such study. The claim was therefore not curated, and a KNOWLEDGE_GAP discussion records that no animal model of p.Pro1070Leu exists, with a proposed knock-in experiment; HUMAN_MODEL_MISMATCH was not used because it would assert model evidence that could not be cited. The node Renal Magnesium Wasting was renamed Impaired DCT Magnesium Reabsorption so it no longer differs from the phenotype only in case. A biochemical row for raised fractional magnesium excretion was added; the patients' values appear only in a figure, so no number is curated. Brisk reflexes were not added because the 2007 full text does not mention reflexes. The trailing-whitespace change to references_cache/PMID_17671655.md was reverted to the fetched bytes, and a description was added to the EGF receptor binding descriptor.

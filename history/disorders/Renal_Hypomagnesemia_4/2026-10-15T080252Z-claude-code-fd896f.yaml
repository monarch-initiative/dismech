  summary: 'Create: Renal Hypomagnesemia 4'
  details: |
    New entry for renal hypomagnesemia 4 (MONDO:0012717, EGF). Source report: research/Renal_Hypomagnesemia_4-deep-research-perplexity.md (Perplexity sonar-deep-research, default reasoning effort); 16/16 references resolved. preflight-dr returned WARN because its heuristic gene lexicon counted the disease abbreviation HOMG4 as a second gene; the report names OMIM 611718 and EGF throughout. Primary sources: the 2007 molecular report (PMID:17671655, full text cached) and the 1987 clinical report (PMID:3436090), plus two mechanism papers (PMID:19073827, PMID:19937979) and a commentary (PMID:17671646), found by PubMed search. The report presents the seizures as caused by hypomagnesemia, but PMID:3436090 states the convulsions were unrelated to hypomagnesemia, so seizures and intellectual disability are curated without an incoming edge from the magnesium chain. Magnesium replacement is not curated because no cited source reports it in these patients. Validated with just validate, count-verified-snippets (30/30), validate-terms, check-genereviews (NO_CHAPTER) and check-causal-targets.

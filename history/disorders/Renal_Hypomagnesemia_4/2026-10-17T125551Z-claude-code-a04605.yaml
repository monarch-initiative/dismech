  summary: Bind the fractional excretion of magnesium code; decline the 2 per cent
    band as an unrepresentable strict inequality
  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:80958-2 (fractional excretion of magnesium, urine and serum or plasma) as the loinc_term of the fractional magnesium excretion marker. The code is specific: LOINC 2.83 carries seven fractional excretion codes, covering sodium, potassium, calcium, phosphate, urea and magnesium, and only this one names magnesium. It spans both specimens, which matches the quantity, a ratio computed from paired urine and serum results rather than a urinary concentration. A Part also exists, LOINC:LP207800-6, readable in the KG and not in the export; it is recorded on the record rather than bound, because the Biochemical slot names the measurement that quantifies the marker and the Part carries neither the specimen pair nor the ratio property. The 2 per cent diagnostic threshold is not carried as a band: the source states an excretion above 2 per cent, a strict inequality, and a band's lower bound is inclusive, so the only available bound would place exactly 2 per cent inside the abnormal range when the source places it outside. This is the strict-greater-than side of the two-sided reference-range gap this PR also records in design decisions section 12.

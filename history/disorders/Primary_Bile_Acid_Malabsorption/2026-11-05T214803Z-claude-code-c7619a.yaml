  summary: Split the colonic spillover node and evidence the secretory and motility
    arms
  details: |
    Refs issue 9788. The bundled node 'Colonic Bile Acid Spillover and Diarrhoea' carried two claims and explicitly left the colonic secretagogue mechanism unsourced. It is now three nodes: Colonic Bile Acid Spillover (TISSUE, keeps the original PMID:9109432 and PMID:31900034 evidence, the Growth Failure edge and the bile acid sequestrant target), Bile Acid Receptor-Driven Colonic Secretion (CELLULAR, colonocyte, GO:0038184 INCREASED) and Increased Colonic Motility (TISSUE, GO:0120054 INCREASED), both feeding Congenital Watery Diarrhoea. Evidence for the two new nodes is quoted from two already-cached bile acid diarrhoea reviews (PMID:38338820, PMID:35683489), graded directness INDIRECT and quote_role REVIEW_SYNTHESIS because neither studies SLC10A2 deficiency. Also removed an explanation on the C4 biochemical item that argued for the retired PARTIAL grade. Validated with just validate, validate-terms, count-verified-snippets (48/48), check-causal-targets, check-entity-refs and check-name-collisions.

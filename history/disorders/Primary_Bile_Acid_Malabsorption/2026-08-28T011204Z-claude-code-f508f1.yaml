  summary: 'Review round 2: connect the orphan node, split the bundles, add the FXR-FGF19-CYP7A1
    axis'
  details: |
    Addressed the round-2 CHANGES_REQUESTED review on PR 9781. The first item is a defect I introduced and reported as fixed: the Fat-Soluble Vitamin Malabsorption node had no incoming edge, because the Python string replacement meant to add downstream to the Steatorrhoea node did not match and silently no-opped, and the commit message stated it had landed. This is the third occurrence of that exact failure in this five-PR run, after the missing phenotype edge on PR 9779 and the half-addressed citation item on PR 9782. A reachability audit was then run over all five entries in the run; the other four are clean, each with exactly one root node and no dangling targets. The gap that let it through three times is filed as issue 9789: check-entity-refs validates that references resolve, not that nodes are reachable, and an absent edge has no reference to break. Round-1 items 6 and 7 are now addressed rather than deferred. The Contracted Bile Acid Pool and Compensatory Hepatic Synthesis node was split into three: pool contraction as an organism-level state, a new Loss of FXR-FGF19 Signalling from the Ileum node at cellular scale, and CYP7A1 Disinhibition and Compensatory Hepatic Synthesis as a hepatocyte process. Splitting the bundle is what made room for the regulatory axis, which is why the two review items were really one. The axis also explains both diagnostic biomarkers, so serum FGF19 and serum C4 are now curated in a new biochemical section as the readouts of the two new nodes rather than as free-floating tests. Renaming the pool node broke an incoming edge that still pointed at the old name; the reachability audit caught that too, which is the argument for having it. The sequestrant treatment was one-sided and the contradicting evidence was in a file this PR itself added: PMID:34192422 reports colestyramine resolving diarrhoea with catch-up growth in a homozygous SLC10A2 infant, while the entry showed only the REFUTE item from the vitamin-deficiency patient. Both are now present, and the mechanistic reason they differ is stated: a sequestrant binds luminal bile acids, so it acts on colonic spillover and not on the contracted pool. The description no longer claims there is no SLC10A2-specific evidence, only no controlled-trial evidence. Also added the cholestyramine therapeutic_agent, named 75SeHCAT as the gold standard in the diagnosis entry, and changed vitamin supplementation to SMALL_MOLECULE. Snippets 44 of 44 verified.

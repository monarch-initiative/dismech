  summary: 'Fix: readout target named a node that does not exist'
  details: |
    The 'Bile acid pool size' readout on the Slc10a2-null mouse link carried target 'Contracted Bile Acid Pool and Compensatory Hepatic Synthesis', which is not a node in this entry: it conflates the two real nodes 'Contracted Bile Acid Pool' and 'CYP7A1 Disinhibition and Compensatory Hepatic Synthesis'. A readout's target must repeat its link's target, and that link targets 'Contracted Bile Acid Pool', which is also the node the measurement is about - pool size, DECREASED. Set the readout target to 'Contracted Bile Acid Pool'. This was failing test_model_readout_targets_match_link on main since PR 9781 merged; PR 9850 independently confirmed it on a clean tree. No claim, evidence item, or snippet changed.

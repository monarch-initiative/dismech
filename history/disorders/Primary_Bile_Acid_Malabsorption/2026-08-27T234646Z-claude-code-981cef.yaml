  summary: 'Create: Primary Bile Acid Malabsorption'
  details: |
    New Disease entry for MONDO:0013214, SLC10A2/ASBT deficiency, curated from a claude_code deep-research report at research/Primary_Bile_Acid_Malabsorption-deep-research-claude_code.md. Nothing in kb/ previously covered bile acid malabsorption under any name. Pathophysiology is a six-node chain from loss of ASBT transport function through failed ileal reclamation to two branches: colonic bile acid spillover with secretory diarrhoea and steatorrhoea, and a contracted bile acid pool with compensatory hepatic synthesis and reduced plasma cholesterol. The molecular node is stated as a transport-function defect rather than protein loss because the 1997 transfection work showed the mutant transporter is expressed and trafficked normally yet transports nothing. The Slc10a2-null mouse is curated as an animal_models entry with four modeled_mechanisms links: RECAPITULATES with HIGH fidelity for the reclamation and pool nodes, each with a quantified readout, and FAILS_TO_RECAPITULATE with LOW fidelity for the steatorrhoea and plasma cholesterol nodes, each carrying limitations and REFUTE-graded evidence. A HUMAN_MODEL_MISMATCH discussion attaches to both failing nodes with a proposed high-fat dietary challenge experiment. The mismatch is the substantive finding of this curation: the model reproduces the transport lesion almost completely while failing at the two nodes where the human disease is clinically defined, so it can support the proximal nodes and must not be cited for the distal ones. Top-level notes record that the human evidence rests on one family, that no phenotype carries a frequency for that reason, and that this entry is the congenital SLC10A2 form only, not the far commoner acquired bile acid malabsorption. The genetic block records that A171S is a 28-percent-frequency polymorphism sharing an allele with a pathogenic splice change, so a variant-level reading that did not separate them would mis-assign causality. Validated with just validate, just validate-terms, just count-verified-snippets at 23 of 23, just check-entity-refs, just check-duplicate-keys, and the model-link pytest selection.

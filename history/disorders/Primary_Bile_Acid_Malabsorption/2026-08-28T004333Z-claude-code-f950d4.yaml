  summary: 'Review round 1: vitamin-deficiency arm, treatments, diagnosis'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 9781. The substantive correction came from fetching PMID:40814585, a 2025 genotyped patient the review pointed at: she had lifelong severe fat-soluble vitamin deficiency, rickets, a hypocalcaemic seizure at ten months and reduced final height, with normal stool frequency and consistency and no steatorrhoea at all. The entry had modelled diarrhoea and steatorrhoea as the defining features and stopped one step short of fat-soluble vitamin malabsorption, which meant it would not have recognised the presentation that took eighteen years to diagnose. A Fat-Soluble Vitamin Malabsorption node was added downstream of steatorrhoea, with four new phenotypes and growth failure sourced from two independent genotyped patients. The one-family framing in top-level notes was reworded: the reviewer was right that further kindreds exist, and more importantly the stated reason for carrying no frequencies was wrong. The problem is the absence of a denominator, not the number of families. The unevidenced colonic secretagogue claim was softened to what the two citations actually establish, with the textbook mechanism named as something a curator should evidence rather than asserted. Added treatments with the vitamin supplementation first, since for that presentation it is the treatment rather than an adjunct, and the sequestrant graded REFUTE for the vitamin arm specifically because in the genotyped patient it was discontinued for side effects with no effect on vitamin uptake, which is mechanistically expected since a sequestrant acts on luminal spillover and not on the contracted pool. The low-fat diet carries no evidence item and says so rather than borrowing a citation from the acquired-condition literature. Added diagnosis with bile acid retention testing and sequencing, a prevalence class record, a scope note naming PBAM2 and SLC51B as the deliberately excluded Mendelian neighbour, and the more specific CL:1000334 enterocyte binding. One note on the review itself: it suggested HP:0002153 for hypocalcaemia, which is Hyperkalemia; the entry uses HP:0002901. Snippets 35 of 35 verified.

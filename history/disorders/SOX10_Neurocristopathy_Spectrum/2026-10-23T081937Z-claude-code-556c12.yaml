  summary: Re-grade two PMID:15004559 evidence items to IN_VITRO
  details: |
    Changed evidence_source from HUMAN_CLINICAL to IN_VITRO on two PMID:15004559
    (Inoue et al. 2004) evidence items: the PCWH subtype in has_subtypes ("Our
    experiments show that triggering NMD and escaping NMD may cause distinct
    neurological phenotypes.") and the NMD-escape pathophysiology node ("the
    more severe disease phenotype, PCWH, is realized only when the mutant mRNAs
    escape the nonsense-mediated decay (NMD) pathway"). Both sentences report
    the authors' own experiments on truncated SOX10 (dominant-negative activity
    and NMD escape), and PCWH_syndrome.yaml already grades the same sentences
    IN_VITRO. The cached reference is abstract-only and PubMed Central has no
    full text for this article, so the grade follows the abstract's own framing
    of the result as an experimental finding. Snippets, supports and
    explanations are unchanged.

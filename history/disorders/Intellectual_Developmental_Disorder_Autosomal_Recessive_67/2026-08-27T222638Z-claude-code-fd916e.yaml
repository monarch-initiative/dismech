  summary: 'Address second review on PR #9724: correct the Sleep Disturbance frequency
    band and re-band by counted figures'
  details: |
    Response to the second automated review on PR #9724. The blocking item is
    accepted, and both non-blocking suggestions are taken.

    Blocking item (accepted, and the reviewer was right). Sleep Disturbance was
    banded FREQUENT. The counted figure is 5/21 = 24%, which is OCCASIONAL (5-29%)
    under FrequencyEnum. My justification had been the authors' adjective
    "frequent" in a sentence covering three symptom groups jointly; the reviewer's
    point is exact, that the other two groups do reach the band (muscle tone 48%,
    hyper-/myopia 38%) and sleep is the one that does not, and that banding by
    adjective was the only place in the entry departing from its own stated
    discipline. Corrected to OCCASIONAL.

    A tooling conflict is worth recording, because the reviewer's literal
    suggestion cannot be implemented as written. The review pointed at the Table 2
    row "Sleeping problems5 (21; 24%)" as the source. I first quoted that row, and
    it verified against the cache, but scripts/check_snippet_length.py rejected it
    along with the equivalent refractive-error row:

      phenotypes[9].evidence[0].snippet: 4 word(s): 'Sleeping problems5 (21; 24%)'
      phenotypes[8].evidence[1].snippet: 3 word(s): 'Hyper-/myopia8 (21; 38%)'

    The gate's own message explains why, that such a snippet "is usually lifted
    from a table whose cells do not survive text extraction", and directs the
    curator to quote the sentence instead. Grandfathering is unavailable when
    checking against a ref, so this is a hard block rather than a baseline item.

    The resolution turned out to be better than either the reviewer's suggestion or
    my earlier position: the paper states all three figures in ordinary prose
    elsewhere in the discussion, and I had simply not found those sentences because
    I had only searched the table. All three phenotypes are now banded on quoted
    prose:

    - Sleep Disturbance, OCCASIONAL, on "Five of 21 individuals (24%) had sleeping
      problems."
    - Refractive Error, FREQUENT (unchanged band, better evidence), on "Notably,
      different ophthalmological findings were observed in up to 38% of affected
      individuals (8/21) and included hyper-/myopia (38%), strabismus (14%),
      nystagmus (5%) and coloboma (5%)."
    - Microcephaly, now FREQUENT, on "Microcephaly was common at the last physical
      examination (6/19; 32%), and microcephaly (4/10; 40%) or normocephaly (6/10;
      60%) remained consistent between birth and the last measurement."

    This reverses my earlier decline of the microcephaly band. That decline rested
    on the premise that the 6/19 count existed only inside mangled table text,
    which was simply wrong; a clean prose sentence exists and I had not found it.
    The band is added, and the same sentence additionally supports the entry's
    description of the growth phenotype as constitutional rather than progressive,
    since head-size status is stable from birth.

    No phenotype in this entry now bands by adjective. Every frequency value traces
    to a counted figure quoted from prose.

    Second suggestion (accepted): the three iPSC modeled_mechanisms links now carry
    readouts for the eIF3f protein level, the bulk translation rate and the
    proliferation rate, each with direction DECREASED, an interpretation, its own
    evidence, and a target that repeats its link's target as the schema requires.
    The translation readout's interpretation records that the measurement is bulk
    and therefore cannot say which messages are affected, which is the same limit
    the entry's neural-model knowledge gap turns on.

    Validation after the edits, run and read: just validate (passed);
    just count-verified-snippets (Snippets checked: 71/71 verified against cached
    references); just validate-terms (Validation passed); just validate-disorders
    (All 1 disorder file(s) passed validation); scripts/check_snippet_length.py
    --against-ref origin/main (OK, the gate that blocked the table-cell quotes);
    just check-snippet-grading, just check-environmental-evidence,
    just check-title-snippets, just check-reference-titles, check_folded_hyphens,
    just check-duplicate-keys, just check-cache-order,
    just check-term-cache-integrity all OK. Readout target integrity verified
    programmatically: 3 readouts, all repeating their link target. No cache rows
    were added this round.

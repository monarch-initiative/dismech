  summary: 'Create: Intellectual Developmental Disorder Autosomal Recessive 67 (EIF3F,
    MONDO:0032662)'
  details: |
    De-novo creation of the EIF3F-attributed leaf entity MRT67 (MONDO:0032662,
    OMIM 618295), modelled as a partial failure of general protein synthesis.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count (leaf)
    and one causal gene (hgnc:3275 EIF3F). The MONDO parent (MONDO:0019502,
    autosomal recessive NON-syndromic intellectual disability) is recorded as a
    skos:broadMatch cross-reference rather than adopted, because the clinical
    literature consistently describes this entity as syndromic.

    NAMED ENTITY CONFUSION - falcon report discarded and NOT committed. The falcon
    deep-research report for this disease failed the NEC preflight against
    MONDO:0032662: expected gene EIF3F mentioned 0 times, PPP1R21 mentioned 48
    times. PPP1R21 causes intellectual developmental disorder, autosomal recessive
    59 (El-Hattab-Schmidts syndrome), a different member of the same numbered
    series. The report's own citation validation was clean (4/4 resolved,
    confabulation rate 0.0), which is exactly why the gene-frequency check is the
    only defence: every citation in a wrong-entity report resolves. The report and
    its citations file were deleted rather than committed, and the seven
    PPP1R21/FERRY DOI cache stubs it left behind were removed unstaged. Nothing in
    this entry derives from it.

    A second deep-research run with the claude_code provider PASSED the same check
    (EIF3F 64 mentions; report OMIM 618295 matching the MONDO xref) and is
    committed. That report independently flagged the same PPP1R21 hazard in its own
    text. Its needs_review: true flag is due to two malformed DOI identifiers in
    which markdown link syntax leaked into the identifier string; nothing was
    curated from either.

    Every reference cited here was located independently through PubMed
    E-utilities and fetched with just fetch-reference, before either DR run
    completed.

    Pathophysiology: 4 atomic nodes, 3 edges, single root, all reachable.
    Homozygous EIF3F p.Phe232Val lowers eIF3f protein abundance (MOLECULAR) ->
    reduced global translation initiation (CELLULAR) -> reduced cell proliferation
    and growth (CELLULAR) -> impaired brain development and somatic growth
    (ORGANISM, mechanism_confidence PROVISIONAL). No TISSUE node: there is no
    tissue-level finding to hang one on, since brain imaging in this disease is
    explicitly nonspecific.

    Two animal models, both from PMID:31026345, with limitations stated: the
    eIF3f-null mouse (PERTURBS, LOW fidelity - embryonic lethal, a genotype no
    patient has) and the heterozygous mouse (RECAPITULATES the translational
    deficit, PARTIALLY_RECAPITULATES the growth deficit, but measured in skeletal
    muscle and behaviourally normal).

    Three discussions. A CONTROVERSY on the epilepsy frequency discrepancy (6/9 in
    the founding cohort versus much less frequent in the larger follow-up), read as
    ascertainment. An OPEN_QUESTION on whether eIF3f's separate deubiquitinase
    activity on Notch contributes, which is deliberately NOT modelled as a
    pathophysiology edge because nobody has tested whether p.Phe232Val affects it.
    An OPEN_QUESTION on the leukoencephalopathy reported in two individuals and its
    possible link to eIF3F's role in RAN translation, with the larger cohort's
    negative imaging finding cited as REFUTE evidence in the same discussion. A
    KNOWLEDGE_GAP records that every functional measurement in this disease was
    made outside the nervous system.

    Frequency bands asserted only where the source gives one: GDD, speech delay and
    intellectual disability VERY_FREQUENT (all individuals); behavioural problems,
    hearing loss, altered muscle tone and short stature FREQUENT (about half).
    Microcephaly, reduced pain sensitivity, cleft lip/palate, GI symptoms,
    regression, leukoencephalopathy and epilepsy carry no frequency.

    The founder allele's gnomAD carrier frequency is curated on the variant but
    deliberately not converted into a disease prevalence, because the disease is
    far rarer than Hardy-Weinberg on that frequency predicts and this entry does
    not speculate about why.

    PMID:35743796 was fetched during literature search and deliberately not curated
    or committed: it reports a heterozygous EIF3F variant as one of seven
    moderate-effect alleles in a proposed oligogenic model, which is a different
    claim from biallelic EIF3F causing MRT67.

    Snippet-quoting note: this literature interleaves numeric citation markers
    ([9], [6]) inside the sentences worth quoting. Those are stripped from a
    snippet before matching but not from the cached text, so several quotes are
    trimmed to bracket-free spans. Three snippets failed on this and were fixed at
    source rather than by changing the global bracket config.


  summary: 'Address review on PR #9724: two phenotypes, audiology to diagnosis, meningioma
    gap, iPSC model'
  details: |
    Response to the automated review on PR #9724. All four blocking items and one
    of the two suggestions are addressed; the other suggestion is declined with a
    reason.

    Item 1 (accepted): two phenotypes were quoted in the file but never curated.
    The snippet naming "muscular hypotonia and/ or hypertonia, ophthalmologic
    findings and sleeping problems" as frequent and previously unreported had only
    its muscle-tone clause turned into a phenotype. Added Refractive Error
    (HP:0000539) and Sleep Disturbance (HP:0002360), both FREQUENT, on the strength
    of the authors' own word "frequent" for that group of findings rather than on
    the Table 2 counts, which are only available as mashed run-on text. The
    refractive-error entry also carries the authors' caveat as a PARTIAL item,
    because they explicitly note hyper- and myopia are common in the general
    population and may not be related to EIF3F deficiency.

    Item 2 (accepted): Audiological Assessment was a diagnostic evaluation sitting
    in treatments:, bound to NCIT:C15747 Supportive Care, and evidenced by a
    snippet about hearing-loss frequency rather than about the assessment. Moved to
    diagnosis: and rebound to NCIT:C217379 Diagnostic Audiology Testing, which was
    verified against OAK before use and is newly added to the term caches by
    just validate-terms rather than by hand. Its evidence is now the roughly 50%
    hearing-loss frequency, which is what justifies assessing routinely.

    Item 3 (accepted): the meningioma signal is now a KNOWLEDGE_GAP discussion
    rather than a confound buried in the regression phenotype description. Two of
    twenty-one individuals in a cohort of median age 8.5 years is hard to dismiss,
    and the authors' own COSMIC check is curated as REFUTE evidence: somatic EIF3F
    variants in 0.9% of 38,579 samples and in none of 130 meningiomas. The
    discussion states explicitly that this is NOT curated as a phenotype and NOT as
    a surveillance recommendation, because two cases with an explicit negative
    tumour-genetics check support neither. A proposed experiment asks for tumour
    incidence against a defined denominator with follow-up time.

    Item 4 (accepted): the gene-edited isogenic p.(Phe232Val) homozygous iPSC line
    is now an experimental_models entry (IPSC_DERIVED_MODEL) with three
    modeled_mechanisms links into the two MOLECULAR/CELLULAR nodes and the
    proliferation node. The reviewer's point that the "no neural model" knowledge
    gap reads more sharply against a curated non-neural human model is right, and
    each link's limitations now say what the model cannot show: undifferentiated
    stem cells, a bulk translation-rate measurement that does not identify which
    transcripts lose efficiency, and stem-cell proliferation that is not
    developmental growth.

    Suggestion accepted: added a Genetic Counseling treatment carrying the quotable
    25% recurrence-risk sentence from PMID:39723281, which also records that the
    counselling was actually delivered to the family.

    Suggestion declined: a FREQUENT band for microcephaly. The 6/19 count exists
    only inside the mashed Table 2 run-on text ("Microcephaly later6 (19; 32%)"),
    and the clean prose sentence about microcephaly gives no band, only that it is
    less frequent than short stature. Quoting a mangled table row to justify a
    frequency band is worse than leaving the band off, so microcephaly keeps its
    association evidence and no frequency.

    Validation after the edits, run and read: just validate (passed);
    just count-verified-snippets (Snippets checked: 65/65 verified against cached
    references); just validate-terms (Validation passed, including the new
    NCIT:C217379); just validate-disorders (All 1 disorder file(s) passed
    validation); just check-environmental-evidence, just check-snippet-grading,
    check_snippet_length --against-ref origin/main, just check-title-snippets,
    just check-reference-titles, check_folded_hyphens, just check-duplicate-keys,
    just check-cache-order, just check-term-cache-integrity all OK. Cache addition
    is 2 rows for NCIT:C217379, machine-derived. Graph and link integrity
    re-verified: 4 nodes, all model, treatment and discussion link targets resolve.

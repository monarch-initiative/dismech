  summary: 'Create: Lupus_Vulgaris'
  details: |
    Created Lupus_Vulgaris (MONDO:0006838) from the stub. Leads came from research/Lupus_Vulgaris-deep-research-claude_code.md (claude_code provider; 20/20 references resolved, 2 quotes attributed to PMID:24770496 did not match verbatim and were not reused; term-validation flagged HP:0033349 as Seizure cluster, not a tuberculin term, and EFO:1001023 as obsolete, neither bound) and from PubMed E-utilities searches. preflight-dr returned SKIP because MONDO records no causal gene; the report was checked by hand and is about lupus vulgaris throughout. Every snippet was taken from a references_cache file fetched with just fetch-reference; DR leads without cached text (PMID:34272074, Jaka-Moreno 2012 PMID:22056255, PMID:21506968) were not cited. Scoped as a standalone focal tuberculosis entry following Meningeal_Tuberculosis, distinct from Primary Cutaneous Tuberculosis (PR 18948); M. tuberculosis, M. bovis and BCG lumped with a Deliberately lumped review note. Pathophysiology: sensitized-host seeding -> Th1 DTH -> dermal tuberculoid granuloma (conforms to granuloma_formation) -> paucibacillary persistence -> chronic peripheral extension with central scarring -> chronic inflammation-associated squamous carcinogenesis, with an epidermal hyperplasia/atrophy branch; all 7 phenotypes causally connected. Validated with just validate, count-verified-snippets (67/67), validate-terms, the whole-repo gates and validate-disorders.

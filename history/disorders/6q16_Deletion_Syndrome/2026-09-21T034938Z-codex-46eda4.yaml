  summary: Review 6q16 deletion intervals, clinical findings and experimental mechanisms
  details: |
    Reviewed the matching deep-research report and citation audit against primary sources. Replaced overconfident human hypothalamic and oxytocin claims with nine atomic nodes distinguishing genomic dosage, variant assays and zebrafish evidence. Expanded to 46 phenotypes, three interval groups, longitudinal endocrine and growth follow-up, actual supportive care and fetal neuropathology. Incorporated the 2015 deletion cohort, 2022 SIM1-sparing case, 2021 EPHA7 cohort and 2023 intragenic POU3F2 evidence. Removed unsupported frequencies and qualified table inconsistencies, variable penetrance and additional CNVs. Full available sources were read; POU3F2 2016/2023 remained abstract-only after sanctioned retrieval, limiting detailed model claims. Independent peer mechanism audit corrected inferred-edge evidence directness. Schema, live ontology terms and all 127 snippets passed; causal-target and coarse-binding gates passed. Included the previously reviewed tracked PMC retrieval adapter so full-text caches are reproducible without ignored environment edits; its 12 tests passed. No caches were hand-edited and the frozen dataset accession file was not accessed.

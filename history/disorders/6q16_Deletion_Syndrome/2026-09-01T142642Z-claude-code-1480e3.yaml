  summary: 'Create: 6q16 Deletion Syndrome (MONDO:0015749)'
  details: |
    De-novo curation of 6q16 deletion syndrome from a Perplexity deep-research report (research/6q16_Deletion_Syndrome-deep-research-perplexity.md, sonar-deep-research, 18 citations). The report's reference_validation reported 7 of 7 resolved at confabulation rate 0.0, but it cites 18 sources, so 7 is what the validator could see rather than a clean bill; 5 of the 7 were judged on topic and one citation-list entry is the bare string 'ACMG/AMP'. Its term_validation was the more useful signal: 8 of 20 checked labels named a different term than the report claimed, so no CURIE from the report was reused and every binding was resolved through OAK (SIM1 hgnc:10882 and POU3F2 hgnc:9215 via sqlite:obo:hgnc). All references were resolved to PMIDs, fetched with just fetch-reference, and quoted from the fetched text. The substantive curation decision is to decline the conventional shorthand that this syndrome is SIM1 haploinsufficiency under a cytogenetic name. Two published observations block that: a roughly 350 kb critical region at 6q16.1 encompassing POU3F2 but not SIM1 produces overlapping developmental delay and obesity susceptibility (PMID:26833329), with zebrafish work placing POU3F2 downstream of SIM1 controlling oxytocin expression in the neuroendocrine preoptic area; and SIM1-sparing deletions at the adjacent 6q14.1-q15 interval produce a strikingly similar phenotype (PMID:21045960). The pathograph therefore branches from the deletion node into separate SIM1 and POU3F2 arms that converge on dysregulated hypothalamic control of energy balance, and a KNOWLEDGE_GAP discussion carrying the 6q14.1-q15 paper as evidence records gene-to-phenotype attribution as unresolved. Hypopituitarism is recorded at OCCASIONAL frequency with a note that it rests on a single reported patient, and short stature carries directness INDIRECT because the authors state it as a possibility rather than an established feature. Validated with just validate (schema, terms, references: 23/23 snippets verified) plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values, all clean.

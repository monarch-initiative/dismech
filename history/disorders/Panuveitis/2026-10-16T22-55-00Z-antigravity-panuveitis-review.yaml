  details: >-
    Audited all existing claims, HPO/GO/CL/MONDO/NCIT/CHEBI/HGNC bindings, and
    PubMed snippets in kb/disorders/Panuveitis.yaml against references_cache/.
    Connected the 8 previously unwired phenotypes (Panuveitis, Photophobia,
    Ocular pain, Floaters, Retinal detachment, Cataract, Glaucoma, and Optic
    nerve damage), linked Pan-uveal intraocular inflammation to Leukocyte
    trafficking across ocular barriers with verbatim-evidenced causal edges, and
    wired HLA-B (hgnc:4932), IL23R (hgnc:19100), and TNFAIP3 (hgnc:11896) with
    corresponding GO molecular_functions (GO:0042605, GO:0004896, GO:0061578)
    into Infectious and systemic inflammatory triggers. Added top-level
    classifications (IMMUNE_RHEUMATOLOGIC and INFECTIOUS_DISEASES),
    sporadic/multifactorial inheritance (HP:0003745), noninfectious and
    infectious panuveitis subtypes (quantified from the 6,050-patient Hellenic
    Study of Uveitis cohort, PMID:37428299), prevalence and adult onset
    progression records (PMID:40434762, PMID:41877771, PMID:37428299),
    intraocular/serum TNF-alpha and IL-6 biochemical markers (PMID:39157460),
    HLA-B, IL23R, and TNFAIP3 susceptibility loci (PMID:41877771, PMID:40434762),
    differential diagnoses (intraocular lymphoma masquerade syndrome, posterior
    uveitis, anterior uveitis), and top-level reference summaries.

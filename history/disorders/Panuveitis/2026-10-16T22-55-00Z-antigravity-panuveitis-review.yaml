  summary: Reviewed Panuveitis.yaml, verified ontology bindings and evidence snippets with HUMAN_CLINICAL
    and quote_role grading, wired all 10 phenotypes into the pathophysiology causal graph, separated immunogenetic
    susceptibility into its own pathophysiology node, split epidemiological incidence and subtype share
    records, split systemic and intravitreal corticosteroid therapies, and added classifications, inheritance,
    subtypes, progression, biochemical markers, genetic risk loci, differential diagnoses, and top-level
    references.
  details: 'Audited all claims, HPO/GO/CL/MONDO/NCIT/CHEBI/HGNC bindings, and PubMed snippets in kb/disorders/Panuveitis.yaml
    against references_cache/, assigning evidence_source: HUMAN_CLINICAL and quote_role (REVIEW_SYNTHESIS
    or PRIMARY_RESULT) across all evidence items. Connected all 10 phenotypes (including binding Optic
    nerve damage to HP:0000587), marked indirect sight-threatening complication edges with INDIRECT_UNKNOWN_INTERMEDIATES,
    linked Pan-uveal intraocular inflammation to Leukocyte trafficking across ocular barriers, and created
    a dedicated Immunogenetic susceptibility node carrying HLA-B (hgnc:4932), IL23R (hgnc:19100), and
    TNFAIP3 (hgnc:11896) with corresponding GO molecular_functions (GO:0042605, GO:0004896, GO:0061578)
    and biological_processes (GO:0002474, GO:0002253). Added top-level classifications (IMMUNE_RHEUMATOLOGIC
    and INFECTIOUS_DISEASES), sporadic/multifactorial inheritance (HP:0003745), noninfectious and infectious
    panuveitis subtypes (quantified from the 6,050-patient Hellenic Study of Uveitis cohort, PMID:37428299),
    separate prevalence records for general population uveitis annual incidence and adult uveitis panuveitis
    cohort share (PMID:40434762, PMID:41877771), adult onset progression (PMID:37428299, PMID:40434762),
    intraocular/serum TNF-alpha and IL-6 biochemical markers (PMID:39157460), HLA-B, IL23R, and TNFAIP3
    susceptibility loci, split Systemic corticosteroid therapy (NCIT:C122080) and Intravitreal corticosteroid
    therapy (NCIT:C121367 with CHEBI:41879 dexamethasone and CHEBI:9667 triamcinolone), differential diagnoses
    (intraocular lymphoma masquerade syndrome, posterior uveitis, anterior uveitis), and top-level reference
    summaries.'

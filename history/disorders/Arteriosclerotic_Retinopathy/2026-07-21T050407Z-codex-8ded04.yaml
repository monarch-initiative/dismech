  summary: 'Evidence and scope re-review: Arteriosclerotic Retinopathy'
  details: |
    Re-reviewed the ontology identity and contemporary clinical usage against a
    2026 large health-screening cohort, primary Scheie-grade studies, and
    reviews of hypertensive retinal disease. Narrowed the entry to the
    fundus-defined retinal arteriolar sclerosis phenotype used in modified
    Scheie S/retinal arteriosclerosis index grading. Explicitly separated the S
    axis from pressure-related Scheie H changes and severe hypertensive
    parenchymal injury.

    Removed unsupported endothelial-proliferation biology, nonspecific retinal
    narrowing, OCT/OCTA as a disease diagnostic test, risk-factor correlations
    presented as causal mechanisms, and an observationally inferred treatment.
    Added a population-bounded high-grade RAI prevalence estimate, two
    uncertainty-typed and evidenced phenotype edges, current systemic-risk
    associations, a focused fundus-assessment workflow, a hypertensive-
    retinopathy differential, and open nomenclature and causal/prognostic gaps.
    No lesion-specific treatment or biochemical/genetic mechanism is asserted
    without direct evidence. Validation confirmed 21/21 exact snippets and
    titles, schema and ontology conformance, causal-graph integrity, 2/2
    phenotype connectivity, and successful CX2 and KGX exports.

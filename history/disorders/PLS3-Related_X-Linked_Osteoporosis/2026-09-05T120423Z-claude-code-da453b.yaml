  details: |
    Responded to the CHANGES_REQUESTED review on PR #10632. (1) Corrected three phenotype frequency bands that contradicted their own snippets: Blue Sclerae and Skin Hyperlaxity moved OCCASIONAL -> FREQUENT, and Reduced Bone Mineral Density moved VERY_FREQUENT -> FREQUENT, since the Dutch cohort gives 18/18 men plus 3/10 women affected (~75%), inside the 30-79% band rather than 80-99%. (2) Added a diagnosis: section with four entries - molecular genetic testing (NCIT:C19770), bone densitometry (NCIT:C48789), transiliac bone biopsy with histomorphometry (NCIT:C15189), and spinal MRI (NCIT:C16809) - modelling the diagnostic pathway the entry previously described only in prose across differential_diagnoses, discussions, prevalence.notes and pathophysiology. All snippets came from references already cached; no new PMIDs were needed. (3) Generated the missing deep-research artifact with a real Falcon/Edison run: 11/11 references verified, 0.0 confabulation rate, 16/16 ontology terms resolved. Its independent Diagnostics section corroborates all four curated diagnosis entries and additionally motivated recording exon-level copy-number analysis, sourced to the cached PLS3-deletion paper. Also took three reviewer suggestions: added the zebrafish evidence carrying the temporal-ordering argument (vascular defect precedes bone cells) that the endosteal vascular niche node turned on but never cited, and made the HUMAN_MODEL_MISMATCH attaches_to name the two specific animal models instead of the ambiguous species key. Declined two suggestions with reasons: DiseaseMappings has no orphanet_mappings slot so the ORPHA:391330 cross-reference stays in notes, and the ISDS classification could not be sourced - the cached 2023 nosology full text does not list PLS3. Merged origin/main to clear conflicts in two derived term-cache CSVs. Validation: schema passed, 89/89 snippets verified, terms passed, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and the cache contracts all clean.

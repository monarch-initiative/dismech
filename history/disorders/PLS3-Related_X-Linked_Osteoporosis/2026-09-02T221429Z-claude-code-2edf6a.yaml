  summary: 'Create: PLS3-Related X-Linked Osteoporosis (MONDO:0018315)'
  details: |
    New Mendelian entry for PLS3-related X-linked osteoporosis, the follow-up named in the #6400 scanner assessment as the natural first disorder conformer to the EMERGING Endosteal Vascular Niche Dysfunction node added to kb/modules/osteoporosis_bone_resorption.yaml by PR #8365. Seven pathophysiology nodes model the disease as a formation/mineralization defect rather than a resorptive one, with three competing mechanistic_hypotheses groups (osteoblast mineralization/mechanosensing CANONICAL, osteoclast NKRF-NFkB-NFATc1 ALTERNATIVE, endosteal vascular EMERGING). Three nodes declare conforms_to against the osteoporosis module; the module's RANKL/resorption steps are deliberately not instantiated because human histomorphometry shows low turnover with reduced osteoclast numbers, and that divergence is recorded in the node notes. Two REFUTE evidence items are carried on the osteoclast node (normal human osteoclast surface; failed trabecular replication in an independent Pls3-null mouse line). Three animal models and one cell-line model are wired via modeled_mechanisms with readouts, including an UNCHANGED negative readout for trabecular bone mass. Four discussions record the unresolved primary cell type, the cortical-only model mismatch against the trabecular/vertebral human disease, the absence of any human bone-vascular study, and the antiresorptive mechanism mismatch. Validated with just validate (schema, terms, references: 78/78 snippets verified against cached references), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading. All 16 new reference cache files were produced by just fetch-reference.

  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Extended the existing Bone Densitometry diagnosis row with DXA Lumbar spine Z-score (LOINC:85394-5) and DXA Femur Z-score (LOINC:80934-3). One reference range on the lumbar spine code carries the ISCD 2013 Pediatric Official Positions threshold, low bone mass or bone density for Z-scores less than or equal to -2.0 (PMID:24690232), with notes that it is a general paediatric reporting threshold, not a PLS3-owned cut-off, and that the ISCD paediatric osteoporosis definition also needs a fracture history (PMID:24631254). No adult Z-score cut-off is recorded because no cached source states it. No total-body-less-head DXA Z-score code was found.

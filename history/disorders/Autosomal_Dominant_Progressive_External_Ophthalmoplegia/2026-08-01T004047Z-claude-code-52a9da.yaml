  summary: 'Create: Autosomal Dominant Progressive External Ophthalmoplegia'
  details: |
    De novo curation of adPEO (MONDO:0008003) resolving issue #7469. Modelled the locus heterogeneity with six has_subtypes entries: PEOA1/POLG (MONDO:0024528), PEOA2/SLC25A4 (MONDO:0012238), PEOA3/TWNK (MONDO:0012241), PEOA4/POLG2 (MONDO:0012415), PEOA5/RRM2B (MONDO:0013117) and PEOA6/DNA2 (MONDO:0014062), each bound to its own gene-specific MONDO term and HGNC gene. Built a 12-node fully connected pathograph running from the heterozygous nuclear variant, through dominant-negative subunit poisoning or haploinsufficiency and imbalanced mitochondrial dNTP supply, to replication fork stalling, multiple large-scale mtDNA deletion formation, decades-long clonal expansion in post-mitotic cells and threshold-dependent mosaic COX deficiency, and thence to extraocular muscle selective vulnerability, skeletal and bulbar myopathy and multisystem PEO-plus extension. The nigrostriatal node declares conforms_to parkinsonism_dopaminergic_degeneration at the Nigrostriatal Dopaminergic Neurodegeneration node (not the alpha-synuclein node, since POLG parkinsonism shows nigral loss without Lewy bodies). Twenty phenotypes, every one reached by a downstream edge. Falcon (Edison Scientific) deep research was run and used as a LEAD source only; a named entity confusion preflight was run with OAK against MONDO:0008003 and all six subtype terms before any deep-research content was used, and the report identity, gene set and Orphanet/OMIM anchors matched. GeneReviews baseline established from PMID:20301791 and PMID:24741716, both tagged GeneReviews in the top-level references block, including the valproic acid contraindication. Validated with just validate (schema, terms, references), just validate-terms, just validate-references with 136 of 136 snippets verified as exact substrings of cached abstracts, scripts/check_folded_hyphens.py, just check-reference-cache-frontmatter, and pytest tests/test_data.py with 5191 passed. Twenty new references_cache entries were fetched via just fetch-reference; none were hand-written.

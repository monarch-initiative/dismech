  summary: 'Harvest content from closed duplicate PR #7491; add gene-mapping guard
    note'
  details: |
    Duplicate-PR reconciliation for issue #7469. Two independent Claude Code sessions curated adPEO in parallel; PR #7491 (branch curate/autosomal-dominant-peo) was closed under the newer-PR-closes policy, and its content was harvested into this surviving entry (PR #7489).

    LOCUS-GENE MAPPING (priority check). Re-verified PEOA1-PEOA6 independently against MONDO and OMIM with OAK. This entry was ALREADY correct - PEOA1=POLG (OMIM 157640, MONDO:0024528), PEOA2=SLC25A4/ANT1 (609283, MONDO:0012238), PEOA3=TWNK/C10orf2 (609286, MONDO:0012241), PEOA4=POLG2 (610131, MONDO:0012415), PEOA5=RRM2B (613077, MONDO:0013117), PEOA6=DNA2 (615156, MONDO:0014062) - and did NOT inherit the one-place shift present in the original text of issue #7469. No data change was required. A prominent SUBTYPE-GENE MAPPING note was added at the head of notes: recording the authoritative mapping, the PEO1-gene-versus-PEOA1-disease trap, and the fact that the issue text was wrong, so the error cannot be reintroduced by a later editor.

    PORTED FROM #7491. (1) Elamipretide treatment, with the NEGATIVE MMPOWER-3 Phase 3 primary result curated as supports: REFUTE and placed first, ahead of the post-hoc replisome-plus-CPEO six-minute-walk subgroup result (PARTIAL), so the subgroup signal cannot be read as efficacy. (2) A clinical_trials entry for NCT05162768 (NuPOWER), completed but unreported. (3) A third diagnosis entry: serum FGF21 and GDF15 as non-invasive adjuncts (PMID:32857451, PMID:38391710). (4) Three phenotypes - Dysarthria HP:0001260, Dysphonia HP:0001618, Respiratory insufficiency due to muscle weakness HP:0002747 - each wired into the pathograph from the Skeletal and Bulbar Mitochondrial Myopathy node. (5) MONDO disease_term bindings on four existing differential_diagnoses. (6) A sixth differential: OPA1-Related Dominant Optic Atrophy Plus (MONDO:0014720).

    ADDED INDEPENDENTLY. role: on all 12 pathophysiology nodes (trigger / effector / central_effector / amplifier / consequence / outcome), which was absent from both duplicate entries. A SCOPE LIMIT paragraph on the valproate treatment recording that the caution is genotype-directed - established for POLG (PEOA1) and extended by GeneReviews to RRM2B (PEOA5) - and does not extend to the SLC25A4, TWNK, POLG2 or DNA2 subtypes, and that the underlying hepatotoxicity literature is dominated by biallelic POLG disease.

    NOT PORTED, DELIBERATELY. #7491's HP:0001626 Abnormality of the cardiovascular system was rejected in favour of this entry's more specific HP:0011675 Arrhythmia. #7491's HP:0009830 Peripheral neuropathy is a parent of this entry's HP:0003477 Peripheral axonal neuropathy and was not substituted. #7491's HP:0000577 Exotropia was not added because this entry already carries HP:0000651 Diplopia. The Thyroid Eye Disease and Other Orbital Disease differential was deliberately left without a disease_term because it names a class of orbital disease rather than a single MONDO entity.

    VALIDATION. just validate passed (schema, terms, references); 147 of 147 snippets verified against cached references with no character substitution required (the only non-ASCII character in a new snippet, the plus-minus sign in the 6MWT figure, is present verbatim in the cached abstract); check-reference-cache-frontmatter OK; pathograph has 12 nodes, 0 dangling downstream targets, and 23 of 23 phenotypes reached by a causal edge. Five new reference cache files were fetched with just fetch-reference (PMID:39574155, PMID:32857451, PMID:20880070, PMID:26838077, NCT05162768); none was hand-written.

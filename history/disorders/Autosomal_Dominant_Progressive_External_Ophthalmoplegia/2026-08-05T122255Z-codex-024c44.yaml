  summary: 'Publication-readiness review: Autosomal Dominant Progressive External
    Ophthalmoplegia'
  details: |
    Independently reviewed the complete disorder entry for publication readiness.
    Audited all cached evidence and the Falcon deep-research report/citation artifact,
    checked the prior review history and design decisions, and searched current PubMed
    and primary sources through 2026-08-05 across mechanism, phenotype, diagnosis,
    epidemiology, natural history, management, prognosis, models, trials, and gaps.
    Added current evidence from PMID:41008644, PMID:41538773, PMID:41766080,
    PMID:41822038, and PMID:42366043, plus direct ragged-red-fibre evidence from
    PMID:8941270 and case-level diplopia assessment from PMID:21519523. Confirmed that NCT05162768 is completed without posted registry
    results and found no adPEO-specific disease-modifying efficacy evidence.

    Corrected evidence scope and graph semantics: qualified locus-specific dominance
    and replication mechanisms; separated RRM2B dNTP supply from SLC25A4 ADP/ATP
    exchange; removed age at onset as direct evidence for clonal expansion; corrected
    the COX-negative/SDH-positive interpretation; removed an unsupported diplopia
    assertion and a clinic-composition record misclassified as prevalence; broadened
    cardiac and hearing terms to match the cited evidence; replaced indirect or
    non-specific snippets for ragged-red fibres, dysphagia, cataract, and depression;
    and replaced umbrella frequency enums derived only from TWNK cohorts with
    PEOA3-scoped phenotype contexts where an exact quantitative passage was available.
    Frequencies retained at disease level for ptosis, PEO, and multiple mtDNA deletions
    are defining or supported across the disease framing; unquoted estimates were not
    reintroduced as structured claims.

    D2P audit disposition (98 recommendations before the graph-link correction):

    - RESOLVED by linking the local molecular phenotype to its producing pathophysiology
      and restoring the clinically variable diplopia assertion without an unsupported
      disease-wide frequency: HP:0003689, HP:0000651.

    - RETAINED the broader local assertion because the cached evidence supports only
      broad cardiovascular, neurologic, hearing, or muscle findings and does not
      justify the narrower source term: HP:0011675, HP:0005110, HP:0001662,
      HP:0001638, HP:0001644, HP:0002066, HP:0011713, HP:0001712, HP:0001962,
      HP:0002548, HP:0001730, HP:0003731, HP:0012664, HP:0000407, HP:0003390,
      HP:0004308, HP:0034306.

    - NOT IMPORTED because OMIM/Orphanet aggregation spans broader PEO, recessive,
      syndromic, or gene-level spectra and the review found no exact, subtype-relevant,

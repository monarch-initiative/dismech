  summary: 'Create: Autosomal_Dominant_Progressive_External_Ophthalmoplegia'
  details: |
    De novo creation of the autosomal dominant PEO entry (MONDO:0008003), modelled as CURATE_ROOT_WITH_SUBTYPES over the locus-defined PEOA1-PEOA6 series.

    Deep research: Edison/Falcon via `just research-disorder falcon` (537s, 20 citations, 1 artifact); report and citations sidecar committed under research/. Treated as leads only - every PMID was fetched with `just fetch-reference` and every snippet verified as an exact substring of the cached abstract. No references_cache file was hand-written.

    Named Entity Confusion preflight (CLAUDE.md) run against MONDO/OMIM with OAK. This CORRECTED the subtype-gene mapping supplied in the task brief. Authoritative mapping used: PEOA1=POLG (OMIM 157640, MONDO:0024528), PEOA2=SLC25A4/ANT1 (609283, MONDO:0012238), PEOA3=TWNK/C10orf2 (609286, MONDO:0012241), PEOA4=POLG2 (610131, MONDO:0012415), PEOA5=RRM2B (613077, MONDO:0013117), PEOA6=DNA2 (615156, MONDO:0014062). The PEO1-gene-vs-PEOA1-disease naming trap is documented in notes and in the TWNK genetic entry.

    GeneReviews baseline: PMID:20301791 (POLG-Related Disorders) mined across Clinical Characteristics, Diagnosis, Management, Genetic Counseling and Agents/Circumstances to Avoid. PMID:29517884 (Mitochondrial DNA Maintenance Defects Overview) is tagged but deliberately not cited - its PubMed record is objectives-only with no quotable clinical content; recorded in notes so a future reviewer does not re-flag it.

    Dominant-vs-recessive boundary: the entry is scoped strictly to the dominant nuclear-gene multiple-mtDNA-deletion arm. Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1, Kearns-Sayre_Syndrome and Autosomal_Dominant_Optic_Atrophy_Plus are cross-referenced as explicit differential_diagnoses rather than duplicated; Mitochondrial_DNA_Depletion_Syndrome_7 is noted as the recessive TWNK counterpart and left out of scope.

    Content: 8 pathophysiology nodes with biological_scale (nuclear replisome/dNTP-pool defect, replication-fork stalling, multiple mtDNA deletions, clonal expansion past the heteroplasmy threshold, mosaic OXPHOS deficiency, ragged-red/COX-negative pathology, selective extraocular and levator failure, multisystem PEO-plus extension); 19 phenotypes; 6 Genetic entries with lowercase hgnc terms and per-allele dominance mechanism; 6 subtypes; 3 histopathology; 1 biochemical; 3 diagnosis; 5 differential diagnoses; 7 treatments; 1 clinical trial; 3 KNOWLEDGE_GAP discussions.

    A red-team self-review against the dismech-pr-review skill was run before opening the PR and its findings applied: independent re-verification of all six subtype MONDO/OMIM mappings; corrected an explanation that mis-stated PMID:19664747 as post-dating RRM2B discovery; rebound the strabismus phenotype from the parent term HP:0000597 to HP:0000577 Exotropia; downgraded genotype-unspecified CPEO evidence to PARTIAL; added human evidence for ragged-red fibres so the claim no longer rests on mouse data alone; set the Finnish prevalence record to PERIOD_PREVALENCE/UNKNOWN rather than back-calculating a band from an assumed catchment; added a cardiac phenotype, a dysphonia phenotype, an FGF21/GDF15 diagnosis entry, and myasthenia gravis and oculopharyngeal muscular dystrophy differentials; softened an unsourced levodopa-responsiveness claim.

    Validation: just validate PASS (129/129 snippets verified against cached references), just validate-terms PASS, just validate-references PASS, just compliance 90.3% global / 90.5% weighted.

  details: |
    Addressed the six nonblocking suggestions on independent review of db31abd7a6a9c38bea3a107a271caf36fec1d12c. The review workflow completed successfully before this update was prepared for publication.

    Reworded the mitral-first progression explanation to identify it as the 2019 clinical synthesis, not a universal sequence. Added the 2017 review's carrier and presumed-penetrance statement with REVIEW_SYNTHESIS provenance, and its explicit valve-replacement recommendation. Changed physical therapy to BEHAVIORAL according to the CLAUDE.md NCIT:C15302 mapping. Added indirect fragility links to tendon rupture, muscle tears, inguinal hernia, striae and thin skin.

    Replaced the mid-sentence Figure 5 fragment with the complete finding phrase "mRNA was shown to be markedly decreased." The explanation identifies this as the 2006 discussion's synthesis; the separate 2004 patient-fibroblast evidence remains direct. A longer Figure 5 quote failed cache matching because of inline HTML around COL1A2. Regenerating the PMID again returned an abstract, and the publisher PDF and Europe PMC XML routes returned HTTP 429 and 500, respectively. No cache content or validator behavior was edited to make a quote pass.

    Reran OLS4 searches with ontology=hp, rows=15 and queries lower eyelid ptosis, flexion crease, toe dislocation, toe subluxation, muscle tear and muscle rupture. Added query and candidate-specific reasons to each unbound phenotype's notes. The searches return upper-eyelid ptosis, finger/digit-specific or absent creases, toe dislocation/sesamoid injury, and named muscle/tendon injuries; none was silently substituted for the source's less specific observation.

    The first CI run failed only the node-class example check. Updated the protein-abundance-loss example to the new node name. Removed the obsolete "outcome risk" example: the revised node describes observed cardiac valve insufficiency, not a standing probability of future heart failure. No class, logical definition or check was weakened.

    Batched disorder validation passes schema, terms, 89 snippets and 98 title checks. Node-class references, causal targets, history validation and normal hooks are checked before publication. The original REVIEW history record remains unchanged.

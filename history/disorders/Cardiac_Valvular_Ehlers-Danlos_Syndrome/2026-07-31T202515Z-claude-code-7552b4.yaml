  summary: 'Address PR #7422 review: UBERON locations for valve nodes, diagnosis/progression,
    GeneReviews confirmation'
  details: |
    Addresses the ai4c-reviewer REQUEST CHANGES review on PR #7422.

    1. Ontology fit: dropped GO:0003170 "heart valve development" from both the TISSUE-scale Progressive Cardiac Valve Matrix Failure node and the ORGANISM-scale Cardiac Valvular Insufficiency node. The reviewer was right on both counts: GO defines the term as a morphogenetic progression from endocardial cushion to mature structure, whereas cvEDS valve disease is post-developmental progressive leaflet degeneration; and it was the sole annotation on an ORGANISM-scale node, where GO should not carry organ-level physiology. Replaced with the locations slot bound to UBERON:0002135 mitral valve and UBERON:0002137 aortic valve, which is anatomically accurate and makes no process claim. No GO valve term is a better fit since all are developmental.

    2. Expanded diagnosis beyond skin fibroblast collagen electrophoresis: added molecular genetic testing of COL1A2 as the modern confirmatory test (noting that variant class and zygosity, not just the gene, discriminate cvEDS from osteogenesis imperfecta), and echocardiography as both diagnostic and surveillance.

    3. Added progression: a childhood hypermobility-predominant phase that can mimic mild hypermobile EDS, followed by progressive mitral-first valvular disease emerging in adolescence to adulthood.

    4. Answered the reviewer's open question about a GeneReviews baseline. Confirmed by PubMed GeneReviews[Book] search that no cardiac-valvular chapter exists: the eight EDS-related chapters are vascular, classic, hypermobile, TNXB classical-like, periodontal, PLOD1- and FKBP14-kyphoscoliotic, and musculocontractural. The reviewer's domain read was correct; this is recorded in the entry notes.

    5. Aortic regurgitation kept at supports PARTIAL. A targeted PubMed search for a cvEDS-specific aortic source returned only classical/hypermobile EDS cardiac studies, so no stronger source exists and the hedge stands. Recorded in the entry notes rather than silently left.

    Deep research: still no provider artifact; the entry is built from primary literature via the PubMed E-utilities API with all snippets machine-verified. A sourcing note recording this is now in the entry notes.


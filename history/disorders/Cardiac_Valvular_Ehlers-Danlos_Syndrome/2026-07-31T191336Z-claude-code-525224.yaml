  summary: 'Create: Cardiac Valvular Ehlers-Danlos Syndrome (COL1A2)'
  details: |
    New entry for cardiac valvular EDS (MONDO:0009159), curated as a standalone disease rather than as a subtype of the umbrella Ehlers-Danlos Syndrome entry, following the Vascular_Ehlers-Danlos_Syndrome and Hypermobile_Ehlers-Danlos_Syndrome precedent. The disorder was named as a curation gap in both the Ehlers-Danlos_Syndromes grouping notes and its MONDO mapping-consistency note; both have been updated.

    Pathophysiology: five-node chain. Biallelic COL1A2 null variants activate nonsense-mediated mRNA decay -> complete absence of proalpha2(I) chains, so type I collagen assembles as an alpha1(I) homotrimer -> progressive cardiac valve matrix failure -> valvular insufficiency, in parallel with generalized soft tissue laxity that characteristically spares bone.

    Sourcing: PMID:30821104 (Guarnieri, cvEDS as a well-defined condition), PMID:15077201 (Schwarze, the NMD mechanism and the founding case series), PMID:16816023 (Malfait, total absence of the alpha2(I) chain), PMID:28306229 (2017 EDS nosology). No GeneReviews chapter exists for cvEDS; a PubMed search for one returned no results, so the GeneReviews baseline step is not applicable here. Deep-research providers were NOT used; literature was found directly via the PubMed E-utilities API and every PMID cached with just fetch-reference.

    Epistemic markers: aortic regurgitation and the valve-surgery treatment are recorded as supports PARTIAL because the cited abstracts characterize the lesion rather than naming the aortic valve specifically or reporting surgical outcomes. A KNOWLEDGE_GAP discussion records that the valve-selective, bone-sparing effect of complete proalpha2(I) loss is described by its discoverers as surprising and remains mechanistically unexplained, which is why the causal edge to valve matrix failure is curated as INDIRECT_UNKNOWN_INTERMEDIATES.

    No module conformance declared. The disorder is not an aortopathy, and although chronic regurgitant volume overload could in principle engage cardiomyopathy_maladaptive_remodeling, no cvEDS-specific evidence for ventricular remodeling or heart failure was found, so asserting that conformance would outrun the sources.

    Differential-diagnosis boundary recorded in notes: cvEDS, arthrochalasia EDS, and osteogenesis imperfecta are all COL1A1/COL1A2 disorders discriminated by variant class and zygosity, with absence of bone fragility as the practical bedside discriminator against recessive COL1A2 osteogenesis imperfecta.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS with 37/37 snippets verified against cached abstracts. Compliance 94.4 percent global / 95.4 percent weighted; residual gaps are root datasets (none exist for this ultra-rare disorder) and datasets/evidence on proposed_experiments (not-yet-run by definition).

  summary: Review cardiac-valvular EDS against full-text molecular, clinical and
    management evidence
  details: |
    Reviewed the existing inherited COL1A2-null disorder; no previous REVIEW or open KB/history overlap was found in the fresh main census. Infectious, environmental and poisoning entries remain excluded from the sweep. No matching provider research artifact exists; the audit used primary literature and cached clinical reviews directly.

    Regenerated PMID:15077201 with the repository reference tool to obtain its full text. Read the full 2004 molecular/clinical report and the full 2006 childhood report, including the latter's clinical findings, frameshift, RNA and protein studies. The 2006 full text was fetched through its NCBI URL after the PMID and DOI routes remained abstract-only. Used existing full-text PDF caches for the cvEDS sections of the 2017 classification and rare-types review. PMID:30821104 and its DOI remained abstract-only after retrieval attempts; its two sisters and proposed distinguishing features are retained without inferring absent full-text data. All new cache files were generated by the reference fetcher, never hand-authored. Derived raw PDFs and redundant/captcha cache fetches are not included in the PR.

    Content completeness: expanded five phenotypes to 34 observations. Added directly documented mitral prolapse, aortic regurgitation evidence, ventricular/atrial enlargement, ventricular hypertrophy, atrial fibrillation, secundum ASD, skin and wound findings, joint dislocations/tears, foot changes, ocular findings, hypotonia, reduced bone density and isolated pyloric stenosis. Preserved lower-eyelid ptosis, unspecified interphalangeal-crease hypoplasia, toe subluxation and unspecified muscle tears without misleading narrower ontology bindings. OLS searches and definitions were used for bindings; local sqlite HP searches returned only imported terms and were not treated as evidence that HPO concepts were absent. Tiny series and individual cases do not justify population-frequency bands.

    Separated nine mechanism nodes: splice-altering SNVs, aberrant splicing, nonsense SNV, frameshift insertion, transcript depletion, collagen-chain loss, homotrimer formation, valve insufficiency and connective-tissue fragility. Included intron-1 pseudoexon activation and distinguished computational RNA-folding hypotheses from cell assays. Gene/protein and molecular-function grounding records the structural collagen role. Human observations, cultured patient-cell experiments, mouse findings and computational predictions have distinct evidence grading. Removed unsupported valve-interstitial-cell and valve-matrix degeneration assertions.

    Added the actual successful and fatal valve-replacement outcomes from the primary report, and catheterization-associated vascular injury, without generalizing to spontaneous arterial disease or numerical operative risk. Surveillance now sits under diagnosis, including annual echo guidance, baseline valve/root assessment, CNV/deep-intronic diagnostic limits, and consideration of bone density assessment. Added patient-reported physiotherapy, conditional recessive counseling, primary fibroblast models, and the 2022 Col1a2-null/oim comparison. The latter constrains the bone-sparing hypothesis without proving a human valve mechanism. Corrected the universal mitral-first progression and bone-unaffected assertions. Removed the prior curation diary and unsupported absence claims from KB notes.

    Read the full 2021 Hyperdynamic Valve report. Its exact variant, zygosity and collagen studies are not provided, so it is retained as a clinical lead but its generic EDS mortality and arterial-risk statements are not imported. No distinct cvEDS subtype is established by these sources. No disease-specific therapeutic trial or accession-bearing dataset was identified: ClinicalTrials.gov exact-condition query returned zero studies. GeneReviews baseline check on the 2026-09-10 snapshot reports NO_CHAPTER.

    Validation: batched validate-disorders passes schema, ontology terms, all 87 snippets and all 96 reference-title checks. Other deterministic repository gates and normal commit hooks are run before publication. Existing history records are preserved unchanged.

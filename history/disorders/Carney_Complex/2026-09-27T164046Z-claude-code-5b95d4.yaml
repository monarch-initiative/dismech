  summary: 'Genetics pass: add CNC1 subtype row, wire six phenotypes, route the MYH8
    variant syndrome to a stub'
  details: |
    d2g genetics pass for the two Carney complex rows of dismech#12274
    (MONDO:0008057 Carney complex type 1 / PRKAR1A and MONDO:0012137 Carney complex -
    trismus - pseudocamptodactyly syndrome / MYH8). Neither CURIE appeared anywhere
    in kb/ before this change.

    Anchor test. MONDO:0015285 is correct and unchanged; it asserts no causal gene of
    its own and the entry had no subtype rows, so the reciprocal test passes
    trivially. Reading its three children is what mattered: two are the issue's rows
    and the third is Carney complex type 2 (MONDO:0011525, OMIM:605244), which
    carries neither a gene axiom nor definition text.

    Rows. MONDO:0008057 is now a `has_subtypes` row, CNC1, bound with PRKAR1A - it is
    the arm the entry models throughout, and MONDO defines it as "Any Carney complex
    in which the cause of the disease is a mutation in the PRKAR1A gene".
    MONDO:0012137 is declined structurally and routed to a new curation stub,
    stubs/Carney_Complex_-_Trismus_-_Pseudocamptodactyly_Syndrome.yaml: MONDO
    describes it as a heart-hand syndrome combining Carney complex manifestations
    with trismus and distal arthrogryposis, gives it its own OMIM (608837) and
    Orphanet (319340) identities, and attributes it to MYH8 rather than to the PKA
    pathway this entry models. Whether MONDO's placement under Carney complex is
    itself right, and whether the MYH8 attribution holds, were not investigated -
    a structural routing decision does not need them answered, and researching a
    checklist row in order to decline it is the backward move.

    Wiring. Phenotype causal inlink went 0/6 to 6/6: all six phenotypes wired from
    the Multiple Neoplasia and Paradoxical Endocrine Overactivity consequence node,
    each edge carrying the GeneReviews snippet that already supported the phenotype.
    Gene-to-mechanism coverage was already 1/1 and is unchanged.

    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, and the file's share of a 643/643 snippet verification across the ten
    files this PR touches. No new references were fetched for this entry.

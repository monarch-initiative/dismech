  summary: 'Create: Intermittent Explosive Disorder'
  details: |
    Created kb/disorders/Intermittent_Explosive_Disorder.yaml (MONDO:0001521), claimed via issue #11337.

    Coverage preflight: confirmed uncovered at origin/main eedf9251c. MONDO:0001521 appeared in kb/ only inside differential_diagnoses blocks of Conduct_Disorder and Oppositional_Defiant_Disorder, never as a disease_term, has_subtypes term, or mondo_mappings entry. The MONDO parent MONDO:0001162 (impulse control disorder) is likewise uncurated, so there was no parent-term entry already covering the concept. No stub, no other open claim issue among the 151 checked.

    Deep research: two provider runs. (1) claude_code — this report is NOT usable and nothing from it was cited. It ran in a single turn with no web searches and its citations are largely confabulated: PMID:16585462 does not resolve at all; PMID:17509164, cited as the Coccaro amygdala fMRI study, is a breast cancer neoadjuvant chemotherapy trial; PMID:22193671 is the Columbia-Suicide Severity Rating Scale; PMID:24951854 is a rodent mGlu5/dopamine study; PMID:31082627 is a microglial NLRP3/clomipramine study. It also gave wrong HPO ids (HP:0000722 for Irritability, HP:0011201 for Impulsivity) and inverted Coccaro's central finding, describing amygdala responsivity to angry faces as reduced when the paper reports it exaggerated. just validate-research-reference was run on it and flagged the unresolved PMID. (2) openscientist — much better: 33/33 references verified, confabulation_rate 0.0, but 7 of 20 checked ontology labels mismatched. Given both, every reference here was located independently through the PubMed E-utilities API and every ontology term was resolved independently through OLS before binding.

    Content: six-node frontolimbic causal chain from central serotonergic hypofunction and frontolimbic gray matter reduction, through amygdala hyperreactivity and orbitofrontal hypoactivation to social threat, to loss of amygdala-OFC coupling and failure to inhibit aggressive impulses. Four phenotypes, two prevalence records (lifetime 7.3%, 12-month 3.9%, NCS-R), two progression phases, four differential diagnoses, two treatments.

    Evidence discipline: the serotonergic node carries directness: INDIRECT because its support is a treatment response inferred back to mechanism rather than direct human synaptic measurement. The fluoxetine treatment carries a notes: line recording that a later 30-subject substudy (PMID:26277033) found no anti-aggressive response, so the effect is not presented as uniformly replicated. Candidate-gene associations for impulsive aggression (MAOA, SLC6A4, TPH2, HTR1B) were deliberately not curated as genetic context, since they are association findings for the intermediate phenotype rather than for IED as a diagnosis.

    Validation: just validate passes, 20/20 snippets verified against cached references, just validate-terms passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

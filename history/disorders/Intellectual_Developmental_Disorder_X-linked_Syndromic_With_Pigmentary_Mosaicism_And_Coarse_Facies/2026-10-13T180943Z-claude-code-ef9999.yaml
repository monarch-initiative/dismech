  summary: 'Create: Intellectual_Developmental_Disorder_X-linked_Syndromic_With_Pigmentary_Mosaicism_And_Coarse_Facies'
  details: |
    New entry for the TFE3 de novo gain-of-function syndrome (MONDO:0859080), curated from the 17-patient series (PMID:32409512), the founding Cell Stem Cell study (PMID:30595499), a two-patient report (PMID:31833172), the RagA-interface stability study (PMID:36608670), a pigmentary mosaicism exome cohort (PMID:35503477) and a neonatal liver case (PMID:39584589). Inheritance is bound to X-linked dominant and Typically de novo; HP:0001442 is bound on a separate block only for the documented mosaic males, with the description stating that female Blaschko-line pigmentation reflects X-chromosome functional mosaicism and is not encoded by that term. Pathograph: RagA-interface missense variants -> escape from Rag-dependent cytoplasmic retention and degradation -> constitutive nuclear TFE3 activity -> repression of developmental programmes (mouse ESC), with indirect, explicitly unstudied edges to the clinical phenotypes. Liver findings are from a single case and left unconnected. No treatment literature exists; recorded as a KNOWLEDGE_GAP on treatments. ClinGen's Definitive classification is for a broader MONDO disease and was not recorded as a validity assertion. Validated with just validate, validate-terms, count-verified-snippets (35/35), entity-ref, causal-target, duplicate-key and block-scalar checks.

  summary: 'Create: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type
    3'
  details: |
    De novo curation of MC5DN3 (MONDO:0013547, ATP5F1E). entry_type decided as DISEASE: MONDO places the term under mitochondrial respiratory chain complex deficiency and mitochondrial proton-transporting ATP synthase complex deficiency, not under Leigh syndrome or any curated dismech grouping, and the entity has one conserved pathograph (epsilon-subunit substitution -> failed F1 assembly -> reduced complex V content -> reduced ATP synthesis) shared by all three reported patients. Follows the per-subunit convention of the Mitochondrial_Complex_I_Deficiency_Nuclear_Type_N entries.

    Two entity traps were handled explicitly. MT-ATP6/MT-ATP8 disease (NARP, maternally inherited Leigh) supplied no evidence: the falcon deep-research report mentions MT-ATP6 eleven times and just preflight-dr flagged it as a rival gene at 28 percent of ATP5F1E mentions, so every reference was selected and read directly from PubMed rather than taken from the report, and each cited paper is either specifically about ATP5F1E/ATP5E or a review section explicitly about the ATP5E patient. Combined-OXPHOS cohorts were likewise excluded, and an Isolated Complex V Deficiency with Preserved Respiratory Chain node states that boundary in the pathograph.

    No phenotype frequency bands are assigned: the disease is three patients in two papers, and a band computed from n=3 would overstate the literature. The 2022 cohort figure of dystonia in 7 of 10 was explicitly not used because that denominator spans four ATPase genes.

    Yeast Y11C model curated as experimental_models (yeast is not an animal) with FAILS_TO_RECAPITULATE against the assembly node, with limitations recording that the negative is about species divergence in ATP synthase biogenesis, not about pathogenicity. HEK293 ATP5F1E knockdown curated as a CELL_LINE model with two RECAPITULATES links.

    Validated: just validate (schema + terms + 45/45 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, plus the whole-KB ratchets.

  summary: Correct viral-oncoprotein origin marking; derive origin from the HPV exposure
  details: |
    Correction following PR review (monarch-initiative/dismech#10629). The cancer-origin backfill had marked a viral-oncoprotein node with genetic_context.variant_origin: SOMATIC, where no host genetic variant exists for variant_origin to describe -- the same situation as the HTLV-1 Tax precedent recorded in CLAUDE.md. The spurious mark also suppressed the correct derivation, because a recorded lesion takes precedence over the exposure rule. Removed the marking and recorded the initiating exposure structurally instead: an environmental entry bound to ECTO:2000053 (exposure to Human Papillomavirus Infection) with an influences_mechanisms link carrying environmental_effect: TRIGGERS onto the initiating node, so the entry derives its cell of origin through the ENVIRONMENTAL_TRIGGER rule. Evidence on the exposure and on the link reuses verified snippets already cited in this entry. The backfill script now excludes viral-oncoprotein nodes outright.

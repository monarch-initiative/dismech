  summary: Separate HPV acquisition, persistence and progression
  details: |
    Backfill for issue #8085. The four exposures act at three different points and the links record that. Human papillomavirus infection is TRIGGERS/DIRECT into the HPV infection node, an identity since the entry models the infection itself as initiating. Receptive anal intercourse is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the same node: it is the route of acquisition rather than a carcinogen, with sexual transmission as the intervening step. HIV infection and immunosuppression is EXACERBATES, because it does not cause infection but prevents clearance, converting transient HPV into the persistent infection the node requires. Tobacco smoking targets a different node entirely, anal intraepithelial neoplasia progression, as PREDISPOSES, since its cited risk is independent of age and other factors including sexual behaviour, so it acts on progression rather than acquisition. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 40 of 40 verified; integrity issue count unchanged from origin/main.

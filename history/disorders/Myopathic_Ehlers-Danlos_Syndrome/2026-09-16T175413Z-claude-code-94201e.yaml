  summary: 'Create: Myopathic Ehlers-Danlos Syndrome'
  details: |
    Created new entry for myopathic Ehlers-Danlos syndrome (mEDS), a connective-tissue/muscle overlap disorder caused by COL12A1 (collagen XII) variants. Modeled as a single genotype-correlated severity spectrum with two subtypes rather than two diseases: mEDS Dominant (heterozygous, milder, anchors the disease_term via MONDO:0034022 'Bethlem myopathy 2', an exact MONDO synonym of 'myopathic EDS'/'EDS, myopathic type') and mEDS Recessive (biallelic loss-of-function, more severe, MONDO:0014654 'Ullrich congenital muscular dystrophy 2'). MONDO has no separate EDS-branded top-level term for this disease -- confirmed via runoak relationship search on the COL12A1 HGNC id (RO:0004003) rather than a label search on 'myopathic Ehlers-Danlos', which returns nothing. No GeneReviews chapter exists for myopathic EDS, COL12A1, Bethlem myopathy, or Ullrich congenital muscular dystrophy (searched PubMed genereviews[book] for each; no hits), recorded in notes:. Sources: the founding 2014 discovery paper (PMID:24334604, Zou et al., recessive+dominant mutations in mouse and human), a 2020 cohort-expansion mechanism paper demonstrating that COL12A1 variants secondarily deplete extracellular decorin AND tenascin-X (PMID:31273343, full text -- mechanistically linking this entry to classical-like EDS/TNXB at a shared downstream ECM node), a 2025 clinical characterization of the severe biallelic end (PMID:39923201, full text, 8 patients/7 families), and a 2025 review with two novel dominant families (PMID:40508193). Pathograph converges dominant (DOMINANT_NEGATIVE, subunit-interface variants) and recessive (LOSS_OF_FUNCTION, biallelic) molecular nodes on a shared 'Depleted Collagen XII-Bridged Extracellular Matrix' node, branching into a muscle-force-transmission arm (citing a Col12a1-null mouse model's decreased grip strength and passive-force-generation deficiency) and a joint/skin-laxity arm; all phenotypes wired into the causal graph. Ran just discover-datasets Myopathic_Ehlers-Danlos_Syndrome: both candidates that came back (geo:GSE20025, geo:GSE103270) were Named Entity Confusion -- fetched and confirmed both are COL6A1/2/3-related classic collagen-VI Bethlem myopathy studies, not COL12A1/MONDO:0034022 'Bethlem myopathy 2' -- so no datasets: block was added. Validated with: just validate (25/25 snippets verified after fixing one non-propositional 2-word table-cell snippet flagged by the whole-KB just check-snippet-length gate), just validate-disorders (CI-authoritative gate, passed), just check-causal-targets (0 new dangling targets), just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, and just list-gene-term-mismatches (0/5 mismatches). just compliance: 89.4% global / 90.2% weighted. A falcon deep-research pass (just dr_fallback='--fallback' research-disorder falcon Myopathic_Ehlers-Danlos_Syndrome) was launched for cross-check per the default-provider instruction; its findings, if any, will be recorded in a follow-up EDIT history record.

    Discovered a real cross-file overlap while checking the cache diff for the PMID:24334604 fetch: it was already tracked, cited by an existing kb/disorders/Ullrich_Congenital_Muscular_Dystrophy.yaml entry's thin 'UCMD2' has_subtypes stub (also anchored on MONDO:0014654, one description line plus two evidence items). This is not accidental duplication -- that entry frames UCMD as a neuromuscular-disease syndrome with COL6A1/2/3 as the primary cause and COL12A1 as a rare phenocopy subtype, while this new entry frames the same COL12A1 gene-disease relationship through the 2017 international EDS classification's named 'myopathic EDS' subtype, and additionally covers the milder dominant end (Bethlem myopathy 2) that the Ullrich-framed entry does not model at all. Added a two-way cross-reference rather than duplicating or deleting either curation: a notes: paragraph in this entry pointing to the existing UCMD2 stub and explaining the dual classification, and a matching one-paragraph addition to that file's UCMD2 subtype description pointing back here. Both files revalidated together with just validate-disorders (110/110 snippets verified across both).

  summary: 'Review Myopathic Ehlers-Danlos Syndrome: repair COL12A1 grounding and
    treatment targets, and enrich phenotypes and models'
  details: |
    Repaired COL12A1 gene-activity grounding defect on both COL12A1 Dominant Variant and COL12A1 Biallelic Loss-of-Function with molecular_functions (GO:0005201 extracellular matrix structural constituent DECREASED, GO:0005518 collagen binding DECREASED), cell_types (CL:0000057 fibroblast), and locations (UBERON:0001134 skeletal muscle tissue, UBERON:0002067 dermis). Repaired three treatment target_mechanisms that previously pointed at phenotype names to target Impaired Muscle Force Transmission and Joint and Skin Connective Tissue Laxity (moving phenotypes to target_phenotypes) and added therapeutic_modality on Genetic Counseling. Added Harrison's chapters and collagenopathy mechanistic_category, updated prevalence (45 patients across 31 families via PMID:40508193), preserved Ehlers-Danlos_Syndromes grouping criteria (HP:0020152 Distal joint hypermobility), added six wired mEDS phenotypes, expanded short Talipes Equinovarus snippet, added NCIT diagnosis bindings including Skeletal Muscle MRI (NCIT:C16809), and added Col12a1 knockout mouse model.

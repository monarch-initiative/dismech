  summary: 'Review: Thymic Carcinoma — split CDKN2A/CDKN2B and TP53 somatic nodes, rebind mediastinal lymphadenopathy, add prevalence, diagnosis & PD-L1 evasion'
  details: >-
    Tranche 11A curation and review pass: split the combined tumor-suppressor mechanism into atomic somatic LOSS_OF_FUNCTION nodes (CDKN2A and CDKN2B Tumor Suppressor Loss and TP53 Tumor Suppressor Inactivation) grounded to hgnc:1787, hgnc:1788, and hgnc:11998 with GO molecular functions and CL:0002293 cell of origin; added synonyms and a historical Müller-Hermelink/Suster type C thymoma note, classifications (ONCOLOGY_HEMATOLOGY, Carcinoma), structured US and German annual incidence (PMID:38264756), chest CT/biopsy/IHC diagnosis, PD-L1-Mediated Immune Checkpoint Evasion supported by WHO 2021 overview PMID:34695605 and PMID:29395863 (BACKGROUND), rebound Lymphadenopathy to Mediastinal lymphadenopathy (HP:0100721) with ORPHA:99868 and carcinoma-specific PMID:37752995 (BACKGROUND) evidence while removing mixed-TET cohort snippets from Chest pain and Pleural effusion, and added SOMATIC_DRIVER/SOMATIC genetic annotations and treatment modalities/target_mechanisms.

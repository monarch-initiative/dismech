  summary: Point the NUT subtype row at the NUT carcinoma entry
  details: |
    NUT carcinoma now has its own dismech entry (kb/disorders/NUT_Carcinoma.yaml, MONDO:0005563), so the NUT row in this entry's has_subtypes needed curated_in to say so. Without it the row reads as a subtype this entry is responsible for curating, and the infectious-disease granularity rule in CLAUDE.md names exactly that as the defect: a subtype naming a disease with its own entry and lacking curated_in.

    One line added, plus a review_notes paragraph recording why just check-granularity reports POINTER_TERM_MISMATCH on this row and why that is correct rather than a thing to fix. The row binds NCIT:C146706 Mediastinal/Thymus NUT Carcinoma, which is the thymic and mediastinal stratum; the entry it points at is anchored to MONDO:0005563 NUT carcinoma, which also covers primary tumours of the lung, head and neck and other sites. The narrower term is the right binding for a row inside a thymic carcinoma entry, and repointing it at the entry's own term would broaden what the row asserts. check-granularity --strict passes: POINTER_TERM_MISMATCH is one of its advisory classes.

    No evidence added and no other row touched; 28 snippets re-verified unchanged. This entry belongs to another curator.

    Added a top-level discussions: block with three grounded open questions at the PME umbrella-mechanism level. (1) gap_pme_convergent_final_common_pathway (KNOWLEDGE_GAP): why genetically/biochemically divergent PME etiologies converge on the cortical-myoclonus + cerebellar-ataxia + cognitive-decline triad and what the shared final common pathway / selective cortical-cerebellar vulnerability is; attaches to the Cortical Reflex Myoclonus node. (2) gap_pme_lafora_body_driver_versus_bystander (CONTROVERSY): whether Lafora bodies are the causal driver of EPM2 neurodegeneration or a biomarker of the upstream glycogen-handling defect, and whether glycogen-synthesis reduction works by aggregate removal vs metabolic correction; attaches to the Defective Glycogen Handling node. (3) gap_pme_myoclonus_versus_neurodegeneration_dissociability (OPEN_QUESTION): whether cortical hyperexcitability generating myoclonus is dissociable from the degenerative process, and why PME myoclonus is pharmacoresistant / aggravated by Na-channel-blocker and GABAergic ASMs. Each carries a rationale and a proposed_experiments block with a decision_criterion. All evidence reuses already-cited, cache-verified PMIDs (15778103, 30143794) with snippets confirmed as exact substrings. Validated with just validate and just validate-disorders (both pass).

  details: |
    Response to the automated review on PR #7806, which requested changes. All four blocking items and all three suggestions were addressed.

    Root cause of the blocking items: references_cache/PMID_35227171.md is a 301-line FULL-TEXT cache, not an abstract-only cache. During the initial curation only the abstract portion was read, so three phenotypes fell back on a generic "misdiagnosis as pneumonia" sentence that did not state the claim, and the diagnostics and biomarker content available in the body was missed entirely. Every quote proposed by the reviewer was independently re-verified against the cache before use rather than being taken on faith.

    Blocking item 1, claim-evidence alignment. Three phenotype snippets were replaced with quotes that actually state the claim, all upgraded from PARTIAL to SUPPORT. Crazy paving now cites the HRCT morphology sentence, with the source's own caveat carried as a second PARTIAL item and a notes field recording that the pattern is characteristic but not diagnostic. Crackles now cites the physical-examination sentence. Restrictive ventilatory defect now cites the lung-volumes sentence, and its description was softened: the source states spirometry is normal in many patients, so restriction is scoped to more advanced disease while reduced DLCO is recorded as the consistent finding, with the "spirometry normal in many patients" sentence curated as an explicit PARTIAL counterweight.

    Blocking item 2, missing diagnosis section. A diagnosis block with four entries was added: the serum GM-CSF autoantibody test (the defining test, with the threshold caveat from PMID:19282464), bronchoalveolar lavage (NCIT:C38042, milky fluid and waxy sediment), high-resolution chest CT (bounded by the not-diagnostic caveat, which is what makes the autoantibody test necessary), and an entry recording the diagnostic difficulty and delay.

    Blocking item 3, missing biomarkers. Three biochemical entries were added: serum KL-6 (better predictor of progression and therapeutic need than LDH or PaO2), serum surfactant proteins and other activity markers (severity-correlated but non-specific), and serum LDH (bound to HP:0025435, the one routine test that is characteristically abnormal). KL-6 deliberately sits alongside the existing curated negative that autoantibody titre does not track severity.

    Blocking item 4, opportunistic infection. An Opportunistic infection phenotype (HP:0031690) was added with three supporting quotes covering the myeloid-function basis, the causative organisms, and the intra- and extrapulmonary distribution. The Systemic Myeloid Host Defence Impairment node now has a downstream edge to it, so the immunodeficiency arm terminates in the phenotype it actually predicts rather than only in recurrent respiratory infections.

    Suggestions, all accepted. The statin conclusion sentence was retagged from MODEL_ORGANISM to OTHER because it summarises pooled human, murine and ex vivo results rather than a single study type. Whole lung lavage moved from NCIT:C49236 (Therapeutic Procedure) to the more specific NCIT:C38068 (Lavage), which term validation confirms is reachable from NCIT:C25218. Digital clubbing moved from category Skeletal to Respiratory since it functions as a diagnostic negative for a lung disease, and its snippet was upgraded to the unambiguous full-text sentence "Digital clubbing is not a feature of autoimmune PAP."

    Also added from the same full text, closing part of the reviewer's non-blocking phenotype-coverage gap: cyanosis (HP:0000961) and chest pain (HP:0100749). Fatigue and weight loss were NOT added because no quotable sentence for them exists in any cached reference; adding them would have required fabricating support.

    The reviewer's optional suggestion of the protective HLA-DPB1 epitope was not taken: the only sentence stating it contains Greek and multiplication characters that the reference validator normalises away, so no clean exact-substring quote is available.

    Validation after the changes: schema and term validation pass, and reference validation reports 93 of 93 snippets verified against cached references, up from 70. All pathograph downstream, treatment target_mechanisms and discussion attaches_to targets still resolve. The 9 tests in tests/test_data.py parametrized on this file pass. No new reference caches were needed since every added quote comes from caches this PR already commits.

  summary: 'Classify: IUIS 2022 Table 10'
  details: |
    Added classifications.iuis_category: phenocopy of IEI, backfilled from IUIS 2022 Table 10 (Tangye et al., PMID:35748970), second section, 'Associated with autoantibodies'. The row is entered under the bare name 'Pulmonary alveolar proteinosis' with pathogenesis given as autoantibody to GM-CSF and a similar-PID column naming CSF2RA deficiency. The bare row name is the trap: IUIS is describing the anti-GM-CSF autoantibody disease, which is this entry, not the hereditary receptor disease. Phenocopy-versus-primary check: dismech curates Hereditary_Pulmonary_Alveolar_Proteinosis separately, and the CSF2RA/CSF2RB receptor defects sit in IUIS Table 5 (congenital defects of phagocyte number or function), not Table 10 - so only this entry takes the phenocopy value, and the hereditary entry was left untouched by this pass. Two evidence items, both PMID:35748970 graded OTHER: the row itself, and the associated-features and similar-PID cell naming CSF2RA deficiency, quoted separately because it is what distinguishes the two entries. Notes record that the row's opportunistic-infection column (cryptococcal meningitis, disseminated nocardiosis) is the clinical reason IUIS treats the acquired form as an immunodeficiency at all rather than as a purely respiratory disease. Existing harrisons_chapter assignments untouched.

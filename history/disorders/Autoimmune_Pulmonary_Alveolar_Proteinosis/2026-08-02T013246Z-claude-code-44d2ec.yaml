  details: |
    Correction record. The round-3 review flagged a factual inaccuracy in the previous history record (2026-08-02T011438Z-claude-code-507441.yaml) and in the commit message of c42e14d. The reviewer is correct and the figures are corrected here; history is append-only, so this record supersedes rather than edits.

    What the previous record said: "Ten rows landed across nine cache files ... plus NCIT:C20644 and the enum row for NCIT:C181397, both introduced by the term refinements below."

    What is actually true, verified independently by inspecting the commit rather than by trusting either the earlier claim or the review: c42e14d added 18 rows across 9 cache files, covering 9 distinct ontology terms. Each term contributes two rows, one to its per-ontology terms.csv and one to the corresponding enum CSV. The nine terms are GO:0030225, GO:0043129, HP:0031690, MONDO:0012579, NCIT:C1492, NCIT:C20644, NCIT:C38042, NCIT:C38068 and NCIT:C77591.

    NCIT:C181397 (Autoantibody Measurement) contributed no row at all. It was already present in both cache/ncit/terms.csv and cache/enums/treatmentactionterm_b7dcb86faf99.csv from an earlier entry, so binding the serum GM-CSF autoantibody test to it in c42e14d required no cache addition. It appears in the commit diff only as unchanged context lines, which is what produced the miscount.

    The error was one of counting and attribution, not of content: the committed cache state was and remains correct and complete. Re-running just validate on a clean checkout reports Files updated: 0 and leaves git status -- cache/ empty, which is the affirmative signal that no rows are missing, and just check-cache-order reports canonical order.

    Also recorded here for the audit trail: the branch was deliberately NOT rebased onto origin/main despite the reviewer noting that the pre-existing test failure in Myofibrillar_Myopathy.yaml and Adrenal_Cortex_Adenoma.yaml has since been fixed on main by #7804. A dry-run three-way merge against origin/main (21e84a6e3) reports conflicts in all seven touched cache CSV files, arising from both sides inserting sorted rows into the same regions. Resolving those by hand carries a real risk of corrupting cache ordering for no benefit, since no GitHub check is currently registered against this commit and the pull request is purely additive, so the merge commit itself takes main's side on the two files this branch does not touch. The branch refresh is therefore deferred to the merge.

  summary: 'Publication-readiness review: close QC-metric gaps'
  details: |
    Full publication-readiness review of the entry created in PR #7806. The review was driven by the repo's own QC metrics rather than free-form expansion, so every change closes a measurable gap.

    Baseline: schema/term/reference validation already passed (93/93 snippets verified), but compliance was 88.9% global / 89.2% weighted, phenotype pathograph connectivity was 50% (7/14), and causal-gene wiring was 0% (1 gene).

    Gaps closed:

    - classifications: block was entirely absent (706 other entries carry one). Added harrisons_chapter RESPIRATORY (primary clinical home) plus IMMUNE_RHEUMATOLOGIC (autoimmune / acquired-immunodeficiency axis), each with evidence. No mechanistic_category was added: MechanisticNosologyEnum has no autoimmune value, so the slot was correctly left empty rather than forced.

    - Pathograph phenotype connectivity 50% -> 87% (13/15). Wired Cough and Crackles from Alveolar Surfactant Accumulation; Cyanosis, Respiratory failure and Polycythemia from Impaired Gas Exchange; Autoimmune antibody positivity from Loss of Immune Tolerance, where it is definitional. Two phenotypes are deliberately left unconnected: Chest pain has no asserted mechanistic route in the sources, and Digital clubbing is curated as a REFUTE negative that must not be given a causal in-edge.

    - Causal-gene wiring 0% -> 100%. HLA-DRB1 sat in the genetic block without ever reaching the mechanism graph; added a genes: descriptor (hgnc:4948) to the Loss of Immune Tolerance to GM-CSF node, which is what graph.py matches on.

    - New phenotype Polycythemia (HP:0001901), documented in the review as a severe-disease consequence of sustained hypoxaemia and corroborated in GM-CSF-signaling-deficient mice, but previously absent from the entry.

    - progression: added the natural-history data that was missing. The course is not uniformly progressive (three recognized patterns including spontaneous resolution, 7.9% in the largest meta-analysis), plus the survival curve (78%/75%/68% at 2/5/10 years), the front-loaded mortality (>80% of deaths within 12 months) and the ranked causes of death (respiratory failure, then uncontrolled infection - the two arms of the mechanism are also the two leading killers). A PARTIAL counterweight from the registry cohort records the referral-vs-screening ascertainment caveat.

    - imaging_findings: block was absent although HRCT is central to this disease and was only captured as a phenotype. Added crazy paving, the geographic ground-glass pattern, and late fibrosis with traction bronchiectasis, all diagnostic: false with the explicit not-diagnostic-of-aetiology caveat preserved.

    - animal_models: block was absent although both models were already cited in evidence elsewhere in the entry. Added the Macaca fascicularis passive-transfer model (the causality experiment that licensed renaming the disease from idiopathic to autoimmune PAP) and the Csf2/Csf2ra/Csf2rb knockout mice, each annotated with the model-human boundary that the existing HUMAN_MODEL_MISMATCH discussion turns on.

    - treatments: Plasmapheresis and Lung Transplantation carried no evidence at all (treatments[].evidence was 5/7). The full text of PMID:35227171 supports both. Plasmapheresis now carries a REFUTE item (impractical and unviable) plus a target_mechanisms block explaining why a mechanistically sound approach fails in practice; Lung Transplantation now carries both the indication and the allograft-recurrence caveat that its notes previously asserted without a citation.

    - clinical_trials: added IMPALA (NCT02702180), which the entry already cited as a PMID but had not curated as a trial record. The NCT id was read out of the cached PMID:32897035 report rather than assumed.

    - datasets: root slot was empty. Added GEO GSE153957, an aPAP-specific human microarray study, verified via NCBI E-utilities with its publication (PMID:33820876) independently fetched and cached. Flagged as exploratory (n=5 per group); its lncRNA/ceRNA networks are deliberately NOT curated as pathophysiology nodes and no mechanistic claim rests on them.

    - Causal-edge evidence: pathophysiology downstream edges carried zero evidence items. Added evidence to the six backbone edges of the trigger-to-effector chain.

    Evidence discipline: the decisive resource was that PMID:35227171 is cached as full text rather than abstract-only, which made the natural-history figures, the plasmapheresis negative recommendation and the transplantation caveat quotable at all. Every snippet was extracted programmatically from the cached file rather than retyped, and ASCII-safe substrings were chosen to avoid the en-dash and unicode artifacts present in the PDF-derived text.

    Validation: schema, term and reference validation all pass; snippet verification went from 93/93 to 123/123. Compliance 88.9% -> 91.7% global, 89.2% -> 91.6% weighted.

    Repo hygiene note: running the validator locally rewrote 7,780 unrelated references_cache/*.md files with a reference_id quoting change (an artifact of the local linkml-reference-validator version). That churn was reverted and is not part of this PR. Only PMID_30846703.md was kept, because it received a meaningful full_text_attempted flag.

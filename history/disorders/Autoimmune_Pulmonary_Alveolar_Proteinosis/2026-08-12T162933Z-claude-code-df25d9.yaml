  summary: Link smoking and dust as MODULATES, carrying the entry's own refutation
  details: |
    Backfill for issue #8085. Both exposures are MODULATES rather than PREDISPOSES, because the entry's own best evidence declines to support a risk claim. The registry that documents a smoking history in 56 percent of patients and dust exposure in 23 percent is the same one that concludes the disease was not strongly linked to smoking, occupational exposure or other illnesses once ascertainment was systematic. That refuting sentence is carried on the smoking link so a reader of the pathograph meets it at the point of the claim rather than only in the exposure block. A prevalence among patients is not a risk, since the cohort has no comparison group, and the links are drawn to record the associations without asserting causation; MODULATES is outside the causal-predicate set and so cannot contribute a mechanistic-explanation score on this evidence. One thing this entry's dust description says and its evidence does not is recorded in the link description rather than asserted: inhalational exposures such as silica are more firmly tied to the secondary form of this disease than to the autoimmune form modelled here, so a dust-driven case may be a different entity rather than this one with an exposure. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 128 of 128 verified.

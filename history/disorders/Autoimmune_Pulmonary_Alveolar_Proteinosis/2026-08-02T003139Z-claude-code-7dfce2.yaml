  summary: 'Create: Autoimmune Pulmonary Alveolar Proteinosis'
  details: |
    De novo curation of autoimmune pulmonary alveolar proteinosis (MONDO:0012579), the anti-GM-CSF-autoantibody form that accounts for ~90% of the PAP syndrome. It complements the existing Hereditary_Pulmonary_Alveolar_Proteinosis entry (MONDO:0012580), which disables the same GM-CSF axis at the receptor (CSF2RA/CSF2RB) rather than at the ligand.

    Deep research used the claude_code provider via `just research-disorder claude_code`, producing research/Autoimmune_Pulmonary_Alveolar_Proteinosis-deep-research-claude_code.md. Before the report was used it was checked for artificial truncation: run_metadata.stop_reason was end_turn rather than max_tokens, all 15 template sections were present, the body terminated on a complete citation list, and the size (68 KB, 814 lines, 64 citations, 18 web searches, 20 turns) was consistent with other complete claude_code runs already in research/. The provider source was also inspected and contains no length-slicing logic; its only failure modes are raise-on-error and raise-on-timeout.

    The report was treated as leads only. Every PMID was re-verified against PubMed/PMC, every snippet validated as an exact substring of the cached abstract, and every HP/GO/CL/UBERON/NCIT/HGNC term verified with OAK. Two citation errors in the report were caught and corrected: it attached NEJMoa1816216 to IMPALA and NEJMoa1913590 to a sargramostim trial. Trial identities were re-derived from PubMed as PMID:32897035 for IMPALA (NEJM 2020), PMID:40834301 for IMPALA-2 phase 3 (NEJM 2025), and PMID:20167854 for the Japanese inhaled sargramostim phase II trial.

    The pathograph has eight nodes: loss of tolerance to GM-CSF, autoantibody neutralization and functional GM-CSF deficiency, arrested alveolar macrophage terminal differentiation, impaired surfactant catabolism with macrophage cholesterol overload, alveolar surfactant accumulation, and impaired gas exchange, plus a parallel systemic myeloid host-defence arm capturing the acquired innate immunodeficiency and a secondary pulmonary fibrosis branch. All nodes carry biological_scale tags. Treatments use target_mechanisms to link to the node each acts on, which separates the mechanism-directed therapies (inhaled molgramostim and sargramostim at the GM-CSF node, rituximab at the tolerance node, statin at the cholesterol node) from the purely symptomatic whole lung lavage.

    Two curated negatives are worth noting. Digital clubbing is recorded as a REFUTE evidence item because the AJRCCM review states it is not typical and that its presence should prompt an alternative diagnosis. Smoking carries both a PARTIAL and a REFUTE item from the same Japanese registry paper, which reports a 56% smoking history yet explicitly concludes the disease was not strongly linked to smoking.

    Two discussions were recorded: a HUMAN_MODEL_MISMATCH noting that Csf2 and Csf2rb knockouts model the downstream signaling loss but not the autoimmune trigger, since the macaque passive-transfer experiment is an antibody challenge rather than endogenous tolerance breakdown; and a KNOWLEDGE_GAP on whether the HLA-DRB1*08:03 association replicates outside the single-ancestry Japanese GWAS.

    Validation: `just validate` passes schema, term and reference validation with 70 of 70 snippets verified against cached references. tests/test_data.py passes for this file. One unrelated pre-existing failure exists on main in Myofibrillar_Myopathy.yaml, where a MONITORING action carries target_mechanisms; it was left untouched. No GeneReviews chapter exists for aPAP, as expected for a non-Mendelian acquired disease.

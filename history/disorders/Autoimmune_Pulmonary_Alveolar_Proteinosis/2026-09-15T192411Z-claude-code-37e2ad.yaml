  details: |
    Two phenotypes had no incoming edge. They needed opposite treatment, which is the point of this record.

    Chest pain is now linked from Alveolar Surfactant Accumulation, as one of the less common presenting complaints attributed to the airspace filling.

    Digital clubbing (atypical) is left unconnected on purpose, and the description now says so explicitly. It is curated with REFUTE evidence because the source states digital clubbing is not a feature of autoimmune PAP; it exists in the entry as a diagnostic negative that should prompt consideration of an alternative or superimposed diagnosis. Drawing an edge would assert the causal path the source denies. Without that note, an orphan-phenotype sweep would connect it as a defect, which is why the reason is recorded in the entry rather than only in this history record.

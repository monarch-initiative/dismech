  summary: 'Review round 1: Cocaine Dependence'
  details: |
    Answered review round 1 on PR 18473 in one push. Blocking item 1: the REFUTE evidence item sat on the Serotonergic Contribution node rather than on Monoamine Transporter Blockade. Because the supports grade is relative to the claim it hangs off, and the serotonergic node's claim is redundancy, the sentence that no single transporter knockout reduces cocaine reward was that node's strongest supporting evidence while being filed as contradicting it; the item's own explanation referred to the preceding node, so the placement disagreed with the prose. Moved it to the blockade node and rewrote the explanation to say why it belongs there and why the same sentence reads as support one node down. Blocking item 2: the Elevated Synaptic Dopamine node bound GO:0014046 dopamine secretion with modifier INCREASED while its description said cocaine raises synaptic dopamine by preventing clearance rather than by driving release, and its snippet reports extracellular rather than secreted dopamine. Replaced it with GO:0051583 dopamine uptake involved in synaptic transmission, modifier DECREASED, verified at OLS and already cached. This leaves the conformance link to addiction_cycle sharing no GO term with the module node, which is the documented benign process_absent case: the module binds the generic release process and this conformer binds the specific mechanism its drug uses. Took three suggestions: GO:0008504 on the serotonergic node replaced with the serotonin-specific GO:0005335 serotonin:sodium:chloride symporter activity, matching what the dopamine side already did with GO:0005330; prevalence_class changed from COMMON to NOT_YET_DOCUMENTED, since the record's own notes say no population estimate was located and a qualitative tier is still a magnitude claim; and PMID:31183685, which the previous push cached without citing, is now cited on the Pharmacotherapy row and reflected in the knowledge-gap rationale. 18 of 18 snippets verified after the changes.

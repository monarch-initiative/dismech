  summary: 'Create: Cocaine Dependence'
  details: |
    Curated kb/disorders/Cocaine_Dependence.yaml from stubs/Cocaine_Dependence.yaml (MONDO:0005186), which the stub had already decided as entry_type DISEASE with HIGH priority. Ten pathophysiology nodes, five conforming to the addiction_cycle module, with the cocaine-specific pharmacology on the entry: monoamine transporter blockade, a serotonergic reinforcement route, and DeltaFosB accumulation. The entry's organising problem is that the canonical mechanism and the knockout evidence disagree: the 1987 potency correlation makes the dopamine transporter the target, while single knockouts of the dopamine, serotonin or noradrenaline transporter all leave cocaine reward intact and only the dopamine-plus-serotonin double knockout abolishes place preference. Both are recorded on the blockade node, one SUPPORT and one REFUTE, with a CONTROVERSY discussion and two competing mechanistic_hypotheses rather than a resolution. Scope follows the stub: acute toxicity stays in Cocaine_Intoxication (MONDO:0019544), which is recorded as a differential diagnosis, and the sodium-channel pharmacology is not modelled here. MONDO:0004456 cocaine abuse is mapped skos:closeMatch rather than made a subtype. SLC6A3 is typed UNKNOWN because no human association is cited; the transporter is present as the drug's target, carried structurally on the blockade node. The pharmacotherapy treatment row records the absence of any approved drug rather than a treatment, and a KNOWLEDGE_GAP discussion asks why a target identified in 1987 has produced none. 17 of 17 evidence snippets verified against 10 cached references, 6 newly fetched and 4 reused from the addiction_cycle module. One snippet was initially written from memory for PMID:33318153 and failed exact-quote validation; it was replaced with a real sentence read from the cached abstract.

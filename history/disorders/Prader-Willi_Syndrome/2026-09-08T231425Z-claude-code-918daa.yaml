  details: |
    Review round on PR #9143 (PWS genetic-subtype augmentation). Replaced both PMID:31920975 subtype snippets, which were two halves of one cognition sentence and did not verify against the abstract-only cache, with PMID:36901699 (Butler 2023, 15q11.2 BP1-BP2 review) for the Type I/Type II molecular definition and PMID:36674736 (Butler 2023, consecutive microarray series) for subtype frequency. Replaced the unsourced 45%/50% of deletion cases figures with the microarray series 40.2%/59.8% split and re-banded subtype_frequency (Type I FREQUENT to OCCASIONAL at about 23% of all PWS; Type II stays FREQUENT at about 34%). Differentiated Subtype.genes: Type I now additionally carries the four non-imprinted BP1-BP2 genes TUBGCP5, CYFIP1, NIPA1 and NIPA2 that a Type II deletion retains, while Type II keeps SNRPN and MAGEL2 only. Carried the longitudinal polysomnography caveats into both subtype descriptions (Type I n=12 against Type II n=10, Type I obstructive AHI p=0.093, and a significantly higher Type I baseline obstructive AHI), with a supporting snippet, so the Type I null is not read as respiratory safety. Renamed the mUPD subtype from Maternal Uniparental Disomy (mUPD) to mUPD per the subtype foreign-key naming convention, keeping the verbose form in display_name. Softened intensive to close polysomnographic monitoring to match the source. Migrated the entry's remaining retired supports PARTIAL value to SUPPORT with directness INDIRECT. Merged origin/main into the branch. Validation: just validate, just validate-terms, just count-verified-snippets (94/94), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading and just validate-disorders all pass.

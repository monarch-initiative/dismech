  summary: 'Create: macular dystrophy with or without cone dysfunction'
  details: |
    De novo curation of SAMD7-related autosomal-recessive macular dystrophy with or without cone dysfunction (MONDO:0958326), closing claim issue #15488. Curated directly from primary literature: the disease-defining human genetics paper (PMID:38272031, Bauwens et al., Am J Hum Genet 2024; full text force-fetched from PMC) plus mechanism papers in mouse/zebrafish (PMID:28900001 Omori 2017, PMID:39531499 Volkov 2024, PMID:23565263 Hlawatsch 2013). Literature depth is thin by design of the subject: PMID:38272031 is the only human disease report (6 families, 8 individuals); a PubMed sweep of all 20 SAMD7 papers found no additional clinical cases. Encoded: AR inheritance (HP:0000007); four-node pathophysiology chain (biallelic LoF variants -> loss of SAMD7 transcriptional corepressor/PRC1 activity -> derepression of CRX-regulated photoreceptor genes [mouse/zebrafish] -> macular cone photoreceptor dysfunction) with the human derepression->maculopathy link marked INDIRECT_UNKNOWN_INTERMEDIATES per the authors' statement that the human pathomechanism remains undetermined; gene SAMD7 (hgnc:25394) wired on the corepressor node with GO:0003714/GO:0000122; three phenotypes (Macular dystrophy HP:0007754 VERY_FREQUENT; Cone dysfunction HP:0008275 FREQUENT; Hyperautofluorescent macular lesion HP:0030631 FREQUENT); three representative homozygous variants; and a HUMAN_MODEL_MISMATCH discussion capturing the explicit rod-dominated-mouse vs cone/macular-human divergence. No GenCC/ClinGen validity tier exists for SAMD7, so none recorded. No GeneReviews chapter exists (check-genereviews NO_CHAPTER, synonyms:[] recorded). Deep research: the default falcon provider was attempted but failed authentication (403, no valid Edison/FutureHouse key in this environment); a keyless claude_code provider run then succeeded (research/Macular_Dystrophy_With_Or_Without_Cone_Dysfunction-deep-research-claude_code.md, 5 refs all verified, 0 confabulation) and cited only PMID:38272031 and PMID:39531499, both already used here, so it surfaced no new citable findings; it correctly distinguished the sibling term HP:0030637 (congenital stationary cone dysfunction), which this entry does not use. just preflight-dr was not run because its MONDO causal-gene lookup requires the 1.2 GB local mondo.db, removed to stay within a near-full container disk; the report's own reference+term validation is clean, the SAMD7 anchor was explicit, and all KB snippets were independently verified against primary sources. Validated: just validate (schema+terms+references 19/19 snippets, 19/19 titles), just validate-disorders (gate, pass), count-verified-snippets 19/19, check-entity-refs/causal-targets/enum-values/duplicate-keys/coarse-phenotypes/qualifier-terms/snippet-grading/shared-disease-terms all OK; check-gene-activity-grounding passes in CI ref mode (0 new findings; local failure is pre-existing baseline staleness unrelated to this entry).

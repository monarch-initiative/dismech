  details: |
    Backfilled reference_title on all 29 evidence items from cache frontmatter titles covering 5 PMIDs and 5 DOIs. Re-verified every existing snippet as an exact substring of its cached source and confirmed each supports its claim. Full text was retrieved for PMID 37891379 and used to enrich the Platinum and Radiation Sensitivity node with two new IN_VITRO evidence items on wild-type TP53 driven apoptosis and on dual death-receptor plus mitochondrial pathway activation, plus two new GO process terms for extrinsic and intrinsic apoptotic signaling. Added a macrophage to T cell shift evidence item on the immune microenvironment node from the BJC T cell paper. Added a seminoma-specific stronger cryptorchidism association evidence item to the Cryptorchidism phenotype. Added a 15.1 percent stage I relapse evidence item to the Active Surveillance treatment from the M371 surveillance study. Restored an OpenAlex full-text fetch for PMID 29799399 that returned hijacked-domain spam and reverted the repo-wide reference_id requoting churn so the PR touches only this disease caches.

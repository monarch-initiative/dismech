  details: |
    Phenotype pass from cached literature (PubMed, Europe PMC, NCBI and Orphadata were blocked by the network proxy). Added Ventricular Bigeminy (HP:0034306) with biallelic 30/33 and heterozygous-family 19/26 contexts from Table 1 of PMID:32693635, wired from Triggered Cardiomyocyte Action Potentials. Added Supraventricular Arrhythmia (HP:0005115), no frequency, from a family-level observation in PMID:27157848 plus the Casq2-null mouse study PMID:24216388, wired from Atrial Triggered Activity. Added biallelic 27/33 and heterozygous-family 14/26 contexts to Effort-Induced Polymorphic Ventricular Tachycardia (source row combines polymorphic and bidirectional VT) and heterozygous-family contexts to Syncope, Cardiac Arrest and Premature Ventricular Contractions. Added CASQ2-specific evidence to Bidirectional Ventricular Tachycardia (PMID:42435031, PMID:27157848). Fixed a stale explanation that referred to an onset value no longer on the phenotype. Seizure was not split from Syncope, respecting an earlier deliberate fold. validate-disorders passed; 161/161 snippets verified.

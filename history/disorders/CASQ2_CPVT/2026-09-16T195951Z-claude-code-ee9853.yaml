  details: |
    Added conforms_to cardiac_camp_pka_calcium_handling#Cardiomyocyte cAMP-Raising Stimulus to the Beta-Adrenergic Stimulation pathophysiology node. No other change: no evidence added, removed, or regraded, and no text edited. The node already described the catecholamine surge acting on a genetically primed calcium-release apparatus and already carried its own evidence; it simply had no module to point at, because no cardiac cAMP or PKA node existed anywhere in kb/modules before issue 11949. The scale differs on purpose: this node is ORGANISM-scale (exertion or emotion producing a systemic surge) while the module target is MOLECULAR-scale (the surge acting at the myocyte), because the module deliberately starts inside the cardiomyocyte and leaves the systemic arm to the disorder entry. Validated with just validate-disorders over both changed CPVT files: schema clean, term validation passed, reference validation reported Snippets checked 160/160 verified against cached references.

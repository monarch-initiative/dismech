  details: |
    Review-response pass for PR #7452 (ai4c-reviewer CHANGES_REQUESTED, 2026-07-31).

    Both IMPORTANT findings were the same class of error and both were accepted: an `evidence_source` of MODEL_ORGANISM on an evidence item whose quoted clause actually describes isolated cardiomyocytes rather than whole animals. The reviewer correctly noted this was an internal inconsistency, since the entry already tagged other items from the same two papers correctly.

    Rather than simply retagging, both were resolved by SPLITTING the evidence, per the CLAUDE.md rule that a paper mixing evidence sources should be split so each item carries a single evidence_source. In both cases the paper does contain a genuine in vivo sentence that was not previously cited, so the split adds real evidence rather than removing it:

    1. PMID:16932808 (Knollmann 2006), on the Delayed Afterdepolarizations and Triggered Activity node. The snippet "resulting in premature spontaneous SR Ca2+ releases and triggered beats" is the tail of the sentence "Exposure to catecholamines in Casq2-null myocytes caused increased diastolic SR Ca2+ leak, resulting in ...", i.e. isolated myocytes. Retagged MODEL_ORGANISM to IN_VITRO and reworded the explanation to name the myocyte system. Added a new MODEL_ORGANISM item quoting "In vivo, Casq2-null mice phenocopied the human arrhythmias", which supplies the whole-animal counterpart that the node previously lacked. The three other PMID:16932808 items in the entry genuinely quote "Casq2-null mice" or "The mice exhibited ..." and correctly remain MODEL_ORGANISM.

    2. PMID:19835880 (Hilliard 2010), on the Flecainide treatment. The snippet "Flecainide induced a sustained decrease in the frequency of spontaneous Ca2+ waves, whereas tetracaine was ineffective" comes from a sentence about "Casq2-/- myocytes, a model of CPVT". Retagged MODEL_ORGANISM to IN_VITRO and reworded the explanation from "in the Casq2-null mouse CPVT model" to "in Casq2-null myocytes". Added a new MODEL_ORGANISM item quoting "the drug flecainide inhibits RyR2 channels and prevents CPVT in mice and humans", preserving genuine in vivo efficacy evidence for the treatment. That snippet is tagged MODEL_ORGANISM consistently with how the same sentence is already tagged in kb/disorders/RYR2_CPVT.yaml.

    Optional reviewer suggestions adopted:

    - Onset. Added onset.onset_category CHILDHOOD to the Syncope phenotype descriptor and to the Effort-Induced Polymorphic Ventricular Tachycardia descriptor, the latter with mean_age_years 7.0. The onset claim is evidenced from the CASQ2-specific Ng/Roston 2020 cohort ("median age of onset of 7 years") rather than the general-CPVT GeneReviews sentence, keeping the entry's rule that CASQ2 claims are sourced from CASQ2 data where possible.
    - Surveillance. Added a "Longitudinal cardiology surveillance" entry to the diagnosis section (not treatments), covering six-to-twelve-month cardiology review, the growth-related rationale for continual beta-blocker dose adjustment, and serial exercise stress testing as the instrument for individualising permitted exercise intensity.
    - Palpitations. Added the Palpitations phenotype bound to HP:0001962, together with a causal edge from the Delayed Afterdepolarizations and Triggered Activity node so the phenotype is not orphaned. Evidence is the general-CPVT review statement tagged OTHER, with a note stating the CPVT-wide rather than CASQ2-specific scope, mirroring how Bradycardia is handled; no frequency band is asserted.

    Optional suggestions declined, with reasons:

    - Calreticulin/RyR2 compensatory arm. Not added. The primary source already cited for the Casq2-null phenotype states the opposite for this class of protein: PMID:16932808 reports that "upregulation of other Ca2+ -binding proteins was not apparent". Adding a compensatory-upregulation arm would require new literature verified against a cached abstract, and would sit awkwardly against a source the entry already relies on.
    - GO:0061337 on the ORGANISM-scale node. Kept. GO:0061337 cardiac conduction is a multicellular, heart-level process, so it is an appropriate annotation for a node describing a whole-heart rhythm disturbance; the biological_scale tag records the scale of the node's substrate and does not constrain the granularity of the GO process annotated on it. The same GO term is used on the corresponding node of the cardiac_ion_channel_repolarization module.

    Validation after the changes: just validate, just validate-terms and just validate-references all pass, with 76/76 snippets verified against cached references (up from 70/70). Structural self-audit re-run: 11 pathophysiology nodes forming a single connected component with no orphan nodes, all 9 phenotypes targeted by a causal edge, and all conforms_to, attaches_to, has_subtypes and target_mechanisms references resolving. Evidence source distribution is now HUMAN_CLINICAL 49, IN_VITRO 9, OTHER 9, MODEL_ORGANISM 8, COMPUTATIONAL 1.

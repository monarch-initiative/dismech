  summary: 'Create: CASQ2 CPVT (CPVT2, MONDO:0012762)'
  details: |
    De novo creation of the gene-specific CPVT2 (CASQ2) entry.

    NEC preflight: ran `runoak -i sqlite:obo:mondo info MONDO:0012762 -O obo`. Confirmed name "catecholaminergic polymorphic ventricular tachycardia 2", causal gene CASQ2 (RO:0004003 HGNC:1513), OMIM:611938, is_a MONDO:0017990. The CPVT numbered series is a high named-entity-confusion class, so the check was explicit: CPVT1 (RYR2, dominant) is a different entity and is already curated as kb/disorders/RYR2_CPVT.yaml. That file was read in full first, and no CASQ2 evidence in this entry is sourced from RYR2-specific literature. Checked for duplicates with `grep -rl MONDO:0012762 kb/` (none) and `grep -rl CASQ2 kb/` (only RYR2_CPVT.yaml, as part of the umbrella gene spectrum).

    Lump-vs-split: kept separate from RYR2_CPVT, which is keyed to the CPVT umbrella term MONDO:0017990 and carries the disease-level gene spectrum. The split is justified by mode of inheritance (recessive vs dominant), molecular lesion (loss of the SR luminal calcium buffer vs gain of function in the release channel itself), and genetic-counselling / cascade-screening implications. The reasoning is recorded in both the description and the notes.

    Pathophysiology: eleven-node chain forming a single connected component with no orphan nodes. CASQ2 loss of function to reduced SR calcium buffering (plus a parallel destabilised-RyR2-closed-state arm) to diastolic SR calcium leak (gated by beta-adrenergic stimulation) to cytosolic calcium overload to delayed afterdepolarizations and triggered activity via forward-mode NCX to bidirectional/polymorphic VT to syncope and sudden cardiac death, with a sinoatrial-node-dysfunction branch that feeds back into the DAD node and an atrial triggered-activity branch. Every phenotype is the target of a causal edge. biological_scale is tagged on all nodes.

    Module conformance: evaluated kb/modules/cardiac_ion_channel_repolarization.yaml node by node rather than blanket-conforming. Five nodes conform (trigger, altered-AP-and-calcium-handling, arrhythmogenic-substrate/triggered-activity, ventricular tachyarrhythmia, syncope-and-SCD) because those module nodes explicitly admit calcium-handling variants, ryanodine-receptor calcium leak, and delayed afterdepolarizations. No conformance is claimed for any repolarization, APD-dispersion, or early-afterdepolarization aspect, since CPVT2 has a normal resting ECG and normal action-potential duration. The module Sinoatrial Node Pacemaker Dysfunction node was deliberately NOT claimed, because it models loss-of-function pacemaker-current channelopathy (HCN4/SCN5A), a different mechanism from calsequestrin-dependent sinoatrial depression; that decision is documented in a node-level note.

    Evidence discipline: 70 snippets, all verified as exact substrings of cached references (Snippets checked: 70/70). Four new references were fetched with `just fetch-reference` (PMID:12386154 Postma 2002, PMID:16908766 di Barletta 2006, PMID:16932808 Knollmann 2006 Casq2-null mouse, PMID:32693635 Ng/Roston 2020 international multicenter CASQ2 cohort); no references_cache file was hand-written or hand-edited. evidence_source was assigned per publication evidence type, splitting mixed-source papers: in vivo Casq2-null mouse results are MODEL_ORGANISM, isolated/permeabilised myocyte and turbidity/bilayer work is IN_VITRO, structural mapping is COMPUTATIONAL, and review statements including statements about absent data are OTHER.

    Deliberate omissions, all recorded in notes: no frequency band on any phenotype, because the CASQ2-specific numbers (97.1 percent penetrance, 76.5 percent arrhythmic events, 33.3 percent of heterozygotes meeting criteria) attach to penetrance and to a composite endpoint rather than to any single HPO term, so per the frequency-evidence guidelines the band was omitted rather than back-derived, with the penetrance figure recorded in inheritance.penetrance_percentage instead; no ClinGen CGGV citation, because `just clingen-refresh` failed its pinned manifest checksum for gene_validity.csv during this session and the cache must not be hand-edited; no Orphanet citation, because no ORPHA cache file for CPVT exists in the repository; atrial fibrillation modelled as a mechanism branch rather than a human phenotype, because the only calsequestrin-specific evidence is mouse optical mapping; and no clinical trials, because there are no CASQ2-restricted interventional trials.

    Diagnostic content is in the diagnosis section (exercise stress testing, molecular genetic testing of CASQ2, resting ECG and structural cardiac assessment), not in treatments.

    Discussions: two KNOWLEDGE_GAP entries (unmeasured intra-SR calcium kinetics in calsequestrin CPVT models; unknown prevalence and mechanism of dominant-acting CASQ2 alleles) and one HUMAN_MODEL_MISMATCH (Purkinje-restricted calsequestrin deletion fails to produce CPVT in mice, against human mapping data localising ectopy to the outflow tracts), each with attaches_to references and structured proposed_experiments.

    Deep research: `just research-disorder claude_code CASQ2_CPVT` produced research/CASQ2_CPVT-deep-research-claude_code.md plus its citations sidecar (39 citations). The report corroborated the curated mechanism, inheritance spectrum, and founder-effect narrative. It was treated as leads only; DR-only claims that could not be verified against a cached abstract, for example the gnomAD aggregate pathogenic-variant burden figure, were not curated.

    Validation: `just validate`, `just validate-terms`, and `just validate-references` all pass; a targeted pytest selection (subtype foreign keys, conforms_to, unique names, discussions) passed 1693 tests.

  summary: Review and enrich IDH_Mutant_Cholangiocarcinoma
  details: |
    Repaired skos:broadMatch mapping direction on MONDO:0003210; added synonyms, Adenocarcinoma icdo_morphology, and backed Harrisons chapters; upgraded pathophysiology with biological_scale, molecular_functions on IDH1/IDH2, cholangiocyte cell-of-origin, module conformance, and causal wiring to all 6 phenotypes. Addressed Round 1 review feedback on PR 17179: split Differentiation Block and Tumor Growth into Hepatocyte Differentiation Block and Biliary Progenitor Expansion (CELLULAR, backed by Saha et al. 2014 PMID:25043045 HNF-4alpha suppression) and Intrahepatic Tumor Mass Growth (TISSUE); registered phase III ClarIDHy (NCT02989857) in clinical_trials and Alb-Cre; LSL-IDH2-R172K; KrasG12D mouse (PMID:25043045) in animal_models; trimmed unsupported adjuvant capecitabine claim and backed surgical curability with PMID:41429598; added Ivosidenib IDH1-selectivity note, directness: INDIRECT on placebo-arm symptom frequencies, IDH1/IDH2 case_fractions (14.0% and 4.0%, n=3067, DOI:10.1200/po.23.00544), immunologically cold PD-L1/TMB biochemical marker, trimmed unsupported R132H IHC clause in diagnosis, and cleaned uncited title-only reference findings.

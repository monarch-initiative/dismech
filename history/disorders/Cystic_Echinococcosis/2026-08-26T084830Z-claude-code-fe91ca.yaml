  details: |
    Addressed part of the Cystic_Echinococcosis row of curation tracker #6309: added a 'Pulmonary cysts' phenotype (HP:0032445, lung 20% site distribution) and an 'Anaphylactic shock' phenotype (HP:0100845) for major cyst rupture, plus two new pathophysiology nodes (Hepatic Cyst Rupture; Secondary Hydatidosis) linking rupture to the anaphylaxis phenotype and to peritoneal seeding. All evidence sourced from the single already-cited, already-cached PMID:27047771 (Pakala et al. 2016) -- no new reference fetches. Deliberately left out of scope for this bounded run: structured prevalence, biliary-complication phenotypes, and agent_life_cycle, which the tracker also lists for this entry but which need separate sourcing/judgment calls.

  summary: 'Review round: drop unevidenced anaphylaxis frequency, add urticaria/flushing'
  details: |
    Addressed the two blocking findings on PR #9512.

    (1) Removed 'frequency: OCCASIONAL' from the Anaphylactic shock phenotype. The supporting snippet ('A major rupture can cause a life-threatening anaphylactic reaction.') establishes that the phenotype occurs, not how often, while OCCASIONAL asserts 5-29 percent of patients. No band is asserted in its place, because the cited abstract gives no rate.

    (2) Added 'Urticaria' (HP:0001025) and 'Flushing' (HP:0031284) phenotypes for the most frequently reported manifestations of the post-rupture IgE reaction, which the entry previously left as prose while curating only the rare severe tail. Both are evidenced by a snippet already verified in this file, so no new reference fetch was needed, and both are wired into the pathograph as downstream targets of 'Hepatic Cyst Rupture' with edge-level evidence. Neither carries a frequency band, for the same reason as (1): the snippet describes the character of the allergic reaction, not a population rate.

    'Angioedema' (HP:0100665) was deliberately not added -- mapping the source's 'mucous membrane swelling' onto it is an interpretive step the abstract does not license.

    Validated with just validate, check-causal-targets, check-entity-refs, check-duplicate-keys and check-enum-values.

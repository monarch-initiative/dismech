  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for Echinococcus granulosus, the full two-host cestode cycle. Hosts: Canis lupus familiaris (NCBITaxon:9615, definitive host of the adult tapeworm), Ovis aries (NCBITaxon:9940), Sus scrofa (NCBITaxon:9823) and Bos taurus (NCBITaxon:9913) as intermediate hosts of the cyst-forming larva, and Homo sapiens (NCBITaxon:9606) as accidental intermediate host. No vectors: transmission is by egg ingestion. Five stages: adult tapeworm in the canid gut (OPL:0000237 adult parasitic worm stage; PMID:40944955, PMID:27047771), egg stage shed in canid faeces (OPL:0000180 egg stage; PMID:27047771), oncosphere penetration and dissemination, hydatid cyst (metacestode) stage, and cycle closure when a canid eats protoscolex-containing organs (all PMID:27047771). The oncosphere, metacestode and hydatid-cyst stages are left unbound: searches of the local OPL build found no terms for them. Block evidence PMID:40944955 frames the zoonosis that humans enter accidentally at the larval stage. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues). The pre-existing NO_PROGRESSION finding is out of scope for this change.

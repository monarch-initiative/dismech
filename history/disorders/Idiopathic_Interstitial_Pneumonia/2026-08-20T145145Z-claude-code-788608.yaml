  summary: 'Create: Idiopathic Interstitial Pneumonia (MONDO:0002429)'
  details: |
    Created the ATS/ERS idiopathic-interstitial-pneumonia classification root as a Disease entry with has_subtypes covering all eight entities (IPF, iNSIP, COP, AIP, RB-ILD, DIP, LIP, IPPFE), each bound to its own MONDO term.

    Scoping decision. Chose a root Disease over a kb/groupings/ Grouping because a dismech Grouping is a union over already-distinct Disease entries, and only one of the eight (Idiopathic_Pulmonary_Fibrosis) currently exists as an entry -- a one-member union would carry no auditable boundary. The IPF subtype references the existing entry rather than duplicating it. Recorded in the entry's notes field, together with the condition under which converting to a Grouping becomes correct.

    The pathograph is deliberately not blended: it models the shared injury trigger, an explicit divergence node where the histopathologic pattern assigns the entity, four parallel entity-specific lesion nodes (organizing pneumonia, diffuse alveolar damage, bronchiolocentric pigmented macrophages, lymphocytic interstitial expansion), and the shared progressive-pulmonary-fibrosis outcome. IPF-specific upstream biology (telomeres, AT2 senescence, MUC5B) is left on the IPF entry and is not re-derived. Three conforms_to anchors into fibrotic_response: Tissue Injury, Mesenchymal Cell Activation, and Architectural Distortion and Organ Dysfunction.

    Deep research: falcon, research/Idiopathic_Interstitial_Pneumonia-deep-research-falcon.md, used as leads only. Its reference_validation block reported 15/15 references resolved, 0 unresolved, 0 off topic. Every snippet in this entry was independently sourced from PubMed abstracts and fetched with just fetch-reference; none was lifted from the falcon report, whose citations are author-year keys rather than PMIDs.

    NEC preflight: just preflight-dr returned SKIP because MONDO:0002429 records no causal gene (it is a disease_grouping / ordo_group_of_disorders term). The manual section-2b fallback was therefore run. MONDO:0002429 has no OMIM xref, so no OMIM conflict is possible. The report's top gene mentions (MUC5B, TERT, RTEL1, ABCA3) are all bona fide IIP / familial-pulmonary-fibrosis genes rather than another entity's. The report carries its own explicit scope note distinguishing the IIP family from IPF. Synonym check: MONDO:0002429 carries "idiopathic fibrosing alveolitis" while MONDO:0800504 (IPF) does not, so the IIP/IPF synonym collision that would be the natural NEC route here exists only in the KB's free-text synonym list on the IPF entry, not in MONDO; the report was keyed on the preferred label. Verdict: no named-entity confusion.

    Validation: just validate passed (schema, terms, references). just count-verified-snippets reported 47/47 verified against cached references. just validate-disorders, the batched no-full-text sweep CI runs, passed. just check-duplicate-keys, scripts/check_snippet_length.py --against-ref origin/main, scripts/check_folded_hyphens.py and scripts/check_title_snippets.py were all clean.

    Noted and deliberately not changed here: NCIT:C17427 Smoking Cessation sits under Behavior rather than Clinical Intervention or Procedure, so it is not reachable from NCIT:C25218 and cannot bind a treatment_term. The smoking-cessation treatment keeps a free-text preferred_term with the reason recorded in its description.

  details: |
    Created the Sennetsu_Fever infectious-disease entry after an OpenScientist deep-research run. Curated N. sennetsu as an Anaplasmataceae infectious agent, the probable raw-fish/digenean-fluke exposure route, a monocyte-macrophage vacuolar pathophysiology chain with IRP1 transferrin-receptor iron acquisition, eight HPO-bound phenotypes, scoped IgG-seroprevalence observations, PCR/IFA diagnosis, and tetracycline-class pharmacotherapy linked to bacterial translation and cell-penetrant antimicrobial requirements. Read the report validation blocks: all 36 references resolved and 14/14 checked report quotes matched; term validation needed review because GO:0030260 was obsolete and the report mislabelled Doxycycline, Minocycline, and Tetracycline as unrelated NCIT identifiers, so the entry used GO:0044409 and CHEBI-backed doxycycline/minocycline/tetracycline bindings instead. Fresh-context pre-PR review caught a missing IFA snippet, a missing atypical-lymphocyte phenotype, a morula-expansion node needing more direct human-monocyte culture evidence, and evidence-source/quote-role refinements; the YAML was updated for each. Automated review caught confounded Splenomegaly support, a missing prevalence section, and an overbroad evidence_source on the IFA assay-development quote; those were corrected before the final push. The GeneReviews online check returned NO_CHAPTER, Named Entity Confusion preflight skipped the gene check because infectious MONDO:0000332 has no causal gene, and manual synonym/report review confirmed the report was about Sennetsu fever. Validated the entry with just validate, just validate-disorders, just check-entity-refs, just count-verified-snippets, just check-folded-hyphens, just check-causal-targets, just check-case-collisions, just check-genereviews --online, and just compliance.

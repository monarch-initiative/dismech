  details: |
    De novo curation of nonimmune chronic idiopathic neutropenia of adults (MONDO:0011922).

    DEEP-RESEARCH PROVIDER: the brief asked for perplexity; the account quota was exhausted mid-run (HTTP 401 insufficient_quota) after two of five reports. Re-run with just dr_fallback='--fallback' so the substitution is recorded in data rather than prose: research/Nonimmune_Chronic_Idiopathic_Neutropenia_of_Adults-deep-research-claude_code.md, requested_provider perplexity, fell_back true, 22 citations. Report reference_validation 13/13 resolved, 11/13 on topic; term_validation 3 of 7 labels mismatched (HP:0100279 offered as 'Recurrent aphthous stomatitis' when HPO calls it Ulcerative colitis). No CURIE taken from the report. The report contributed PMID:12517813, the Papadaki 2003 progenitor-apoptosis study, which is the single most important mechanism paper for this disease and which my relevance-sorted PubMed searches had not surfaced.

    SCOPE DECISION. The claim issue asked whether a diagnosis of exclusion has a conserved enough pathograph to be a Disease at all. It does, and the reason is recorded in the entry description: one sustained research programme has localised the defect to the committed CD34+/CD33+ granulocyte progenitor compartment specifically, with no excess apoptosis in the CD34+/CD33-, CD34-/CD33+ or mature neutrophil fractions. That compartment specificity is what makes it one disease rather than a label.

    Three things curated as awkward rather than smoothed over, each with a discussion entry: (1) 'nonimmune' means not-antibody-mediated, not not-immune - the mechanism is T-cell driven, and the most recent prospective cohort frames the whole entity as immune and enrols CIN and autoimmune neutropenia together, which undercuts the MONDO distinction this entry is named for; (2) GFI1, the gene OMIM attaches to this concept and the one the stub carried, comes from patients with a CONGENITAL phenotype ascertained as ELANE-negative severe congenital neutropenia, acting by ELANE derepression - a differentiation defect, not the progenitor-apoptosis mechanism of the adult disease - so it is recorded as SUSCEPTIBILITY with a note saying it may not belong on this record at all, rather than being silently promoted to CAUSATIVE or silently dropped; (3) the telomere shortening is modelled as downstream but the data are cross-sectional and compatible with either direction.

    No conforms_to. kb/modules/myelosuppression was read and rejected because it begins with a cytotoxic insult and ends in multilineage cytopenias, neither of which applies here.

    THREE FABRICATED CURIEs CAUGHT BEFORE VALIDATION. NCIT:C1428 written as 'Filgrastim' is Stavudine; NCIT:C15220 as 'Diagnostic Procedure' is Diagnosis Assessment; NCIT:C69141 as 'Watchful Waiting' is Curator. All three were written from recall rather than from a lookup performed in the same step, which is precisely the failure CLAUDE.md documents. They were caught by a bulk id/label checker run against OLS before just validate, added to the loop after two single instances of the same slip earlier in this run. Correct bindings are NCIT:C1474 Filgrastim and NCIT:C18020 Diagnostic Procedure. The third has no correct binding: NCIT:C15722 Patient Observation is the right concept but is not reachable from NCIT:C25218, so treatment_term carries preferred_term only, with a note saying why.

    Two further validation failures: ProgressionInfo has no 'description' slot (it has 'notes'), and NCIT:C15722 failed the TreatmentActionTerm dynamic enum as above.

    Evidence: 27 snippets across 9 PMIDs, all exact-quote verified. PMID:11202431 (HLA-DRB1*1302 association) was fetched but has no cached abstract text, so it is not cited and the HLA predisposition is not claimed in the entry.

    Validated with just validate (schema, terms, 27/27 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values.

  summary: 'Review round: converse-supporting snippet replaced, a false claim about
    the cache corrected, aphthous stomatitis added'
  details: |
    Both blocking findings taken, plus three of the suggestions.

    Blocking 1 - the Observation without treatment evidence supported the converse of its claim, and my explanation defended that with a false statement about the cache. It said the supporting sentence 'uses a superscript that cannot be quoted verbatim'. The cache stores the threshold as '0.5 x 10/l' with the superscript already stripped, and the sub-span 'most patients can be observed and not treated prophylactically with antibiotics or a growth factor' is an exact substring. I asserted something about repository state without checking it against repository state, which is the same class of error as the false 'no prevalence estimate exists' corrected earlier on this entry. The correct quote is now the primary evidence and covers both halves of the claim - no prophylactic antibiotics and no growth factor - which the old snippet did not touch at all. The converse sentence is retained as a second item, beside the statement it is the converse of rather than standing in for it, and the explanation records the error.

    One correction to the review: it asked for the false sentence to be removed from notes. The false sentence was in the evidence explanation, not in notes. The notes on that treatment concern NCIT:C15722 not being reachable from NCIT:C25218, which is accurate and unchanged.

    Blocking 2 - Recurrent aphthous stomatitis added, bound to HP:0011107, FREQUENT, anchored on 'Overall, recurrent aphthous stomatitis was observed in 45% of the patients.' The reviewer's reconstruction of why it was missing is correct and is recorded in the phenotype notes: the deep research report offered HP:0100279 for it, which is Ulcerative colitis - a real CURIE with the wrong concept under a plausible label. Rejecting the identifier was right; dropping the phenotype with it was not.

    Suggestions taken:
    - Severity distribution from PMID:39300133 on the neutropenia phenotype (median ANC 0.8, moderate 39 per cent, severe 24 per cent), which grounds the 0.5 x 10^9/L threshold the treatment section turns on.
    - Splenomegaly tension recorded rather than resolved: the 8 per cent figure from the larger prospective cohort added as a REFUTE against the FREQUENT band, with an explanation that the two are probably measuring different things (routine ultrasound versus clinical detection). The imaging-based band is kept.
    - The autoimmune burden added to the nonimmune_boundary_with_autoimmune_neutropenia discussion with two evidence items: 56 per cent anti-neutrophil autoantibodies and 31 per cent autoimmune comorbidity at baseline, and 44 per cent with thyroid disease in the registry population. A majority-seropositive cohort is not what 'nonimmune' leads a reader to expect, and the gap is the right place for it.

    Not taken: the mappings block. DiseaseMappings has slots only for icd10cm, icd11f, mondo and ncit, so OMIM 607847, ORPHA:2688 and GARD 16605 have nowhere to go. ICD-10-CM D70.8 could be recorded, but the reviewer's own lump/split note argues the predicate choice there is a real decision rather than bookkeeping, and making it inside a single-disease curation PR would bury it.

    Validation: just validate-disorders (schema, terms, 42/42 snippets, was 36/36); all eleven offline gates clean; bulk OLS id/label comparison over 21 pairs, 0 mismatches. No cache rows added.

  summary: 'Self-review: a false ''no prevalence estimate exists'' claim, corrected
    from PMID:10466440'
  details: |
    Self-review round run while claude-review was unavailable (shared Claude account usage limit, resets 2026-09-12T20:00Z). I applied the automated reviewer's finding shape from the other PRs in this batch - a deep-research source present in the report and absent from the YAML - and it found a false statement in my own entry.

    The correction. The prevalence block asserted 'No prevalence estimate exists', with a note explaining that the published cohorts are all referral-based. That was wrong, and the paper refuting it was sitting uncited in this entry's own research report. PMID:10466440 is a population screening study by the same Crete group whose referral cohorts this entry's pathophysiology is built on: 778 apparently healthy adults, of whom 8.23 per cent met their diagnostic criteria for CINA.

    The figure is now curated as POINT_PREVALENCE, ABOVE_1_IN_1000, rate_per_100000 8230, with three evidence items and a long note, because the number is easy to misread. None of the 64 had severe neutropenia; 6.81 per cent were mild and 1.41 per cent moderate. So 8.23 per cent is the prevalence of a screen-detected laboratory phenotype, not of the clinical disease that reaches a haematology clinic. The authors state their own sampling limitation and that sentence is quoted rather than paraphrased. No qualitative RARE/COMMON tier is recorded alongside the rate, per the prevalence conventions, and the reason is stated in the note rather than left implicit. A second prevalence record carries the sex ratio (3:2 female) and age distribution (two thirds aged 30-59) as a separate claim from the rate.

    Also from PMID:10466440: Chronic rhinitis as a phenotype (3.4 times more frequent in neutropenic subjects), curated with no upstream node and no sequela link, because the direction of the association is not established - chronic mucosal inflammation would sit upstream of the marrow inflammation this disease starts from as plausibly as downstream of the neutropenia.

    From PMID:40725177 (2025 exome study, 25 subjects): a second evidence item on the lymphopenia phenotype, with a proportion this time; and, on the gfi1_relevance_to_the_adult_entity discussion, the first direct genetic evidence bearing on that question. The variants retrieved are in immune-regulation and autoimmunity genes rather than in the myeloid differentiation programme GFI1 belongs to, which is the genetic shape this entry's pathophysiology predicts. Cited as a directional result; no gene from it was added to the genetic section, since it is 25 subjects with no replication cohort.

    PMID:18328744 was fetched and rejected: it is a murine GFI1 study in severe congenital neutropenia, which is the disease this entry argues it is not. Its cache was deleted rather than committed.

    One error of my own, caught before it reached the file: I first wrote HP:0000440 for Chronic rhinitis from memory. That CURIE does not resolve in HPO; the correct term is HP:0002257. This is the failure mode CLAUDE.md documents under 'Every CURIE is read from a source in the same step it is written', and it was caught only because the lookup is a habit rather than because anything flagged it.


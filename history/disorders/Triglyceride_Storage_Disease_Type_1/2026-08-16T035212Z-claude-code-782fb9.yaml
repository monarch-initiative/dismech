  details: |
    Weekly compliance sweep focused on taxonomies/classification for metabolic disorders. Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE and DERMATOLOGY, and icimd_category glycerolipid_metabolism. DERMATOLOGY is included because congenital nonbullous ichthyosis is the disease-naming feature separating NLSD type I from NLSD type M. Bound the previously unbound triacylglycerol biomarker to CHEBI:17855, verified with OAK, keeping preferred_term triacylglycerol over the broader CHEBI label triglyceride. Added evidence to five causal edges and to the inheritance block, and backfilled eleven missing reference_title fields on existing evidence items. The mouse-derived edges are marked MODEL_ORGANISM and their explanations preserve the source's own hedge that the acylceramide mechanism may, not does, underlie human ichthyosis. Validated with just validate for schema, terms and references, just count-verified-snippets reported 20/20 verified, and just check-title-snippets is clean. Weighted compliance moved from 67.2 to 87.0 percent.

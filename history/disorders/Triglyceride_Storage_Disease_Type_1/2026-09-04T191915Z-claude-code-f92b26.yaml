  details: |
    PR Shepherd review round addressing ai4c-reviewer's two blocking findings.

    IMPORTANT 1 - the inheritance block's autosomal-recessive/biallelic claim was carried only by a snippet about the truncating variant spectrum, which cannot support mode of transmission. Added PMID:37746493 stating the AR mode directly as the primary item, and rewrote the older item's explanation so it claims only the loss-of-function half.

    IMPORTANT 2 - references_cache/PMID_37746493.md was cached abstract_only on this branch, so the frequency sentence the review pointed at was not quotable here. Regenerated it with 'just fetch-reference PMID:37746493', which upgraded it to full_text_xml. Used the sentence to evidence the four previously unevidenced causal edges to Hepatomegaly, Myopathy, Cataract and Sensorineural hearing loss, and to set frequency bands on those four phenotypes: hepatomegaly 60 percent FREQUENT, myopathy 59 percent FREQUENT, cataract 22 percent OCCASIONAL, neurosensory deafness 17 percent OCCASIONAL.

    Non-blocking suggestions taken: added the two phenotypes from the same sentence that were absent, ectropion 29 percent HP:0000656 and splenomegaly 13 percent HP:0001744, plus a splenomegaly causal edge parallel to the cataract and deafness edges; evidence on the supportive-care treatment; a CASES_IN_LITERATURE / ULTRA_RARE prevalence record; and a diagnosis section for the peripheral-smear Jordans anomaly finding.

    Ectropion is deliberately left unwired to the pathograph, with a notes field recording why: the source groups it with the ocular manifestations while the usual dermatological account is cicatricial traction from ichthyotic skin, and neither route is asserted by a quotable sentence in the cited references.

    The lumping/splitting question against kb/disorders/Dorfman_Chanarin_Disease.yaml raised as suggestion 5 was left for human adjudication.

    Validated: just validate passed; just count-verified-snippets 36/36; just validate-terms passed.

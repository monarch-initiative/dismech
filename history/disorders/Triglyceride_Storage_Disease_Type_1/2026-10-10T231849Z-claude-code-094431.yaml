  summary: Rewrite as the historical OMIM 190420 adipose-lipolysis phenotype
  details: |
    The entry described ABHD5-related neutral lipid storage disease with ichthyosis under MONDO:0008601, duplicating Dorfman_Chanarin_Disease. MONDO:0008601 cross-references OMIM:190420, the historical type I phenotype of the 1974 provisional triglyceride-storage classification. Following the precedent of Triglyceride_Storage_Disease_Type_2, the entry was rewritten around that phenotype from PMID:187005 and the 1974 QJM abstract (DOI cache): blunted catecholamine-stimulated adenylate cyclase / absent isoprenaline cyclic-AMP response and impaired glycerol release in peripheral adipose tissue, excess peripheral adipose triglyceride with severe malnutrition, and the congenital abnormalities of the two 1976 children. No gene, inheritance, treatment or prevalence is asserted. ABHD5 content unique to this entry was moved into Dorfman_Chanarin_Disease. The node-class example citing this entry's Epidermal Lipid-Barrier Defect node was repointed to Dorfman_Chanarin_Disease. Validated: schema, terms, 15/15 snippets.

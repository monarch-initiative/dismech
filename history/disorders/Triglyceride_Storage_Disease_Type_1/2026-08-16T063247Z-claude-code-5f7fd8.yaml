  summary: Add ICIMD and Harrison's classifications plus triacylglycerol CHEBI binding
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + DERMATOLOGY, and icimd_category 'glycerolipid_metabolism' (ICIMD group 'Disorders of glycerolipid metabolism' under category 'Disorders of lipid metabolism'; Ferreira et al. 2021, PMID:33340416). The notes record that no lysosomal_storage_category is assigned: despite the 'storage disease' name, NLSD type I is a cytoplasmic lipid-droplet disorder caused by failed ATGL-mediated triacylglycerol lipolysis, not a lysosomal hydrolase deficiency. Provenance in notes rather than a fabricated evidence snippet, per the disease-classification skill. Also added a biomarker_term binding to the previously unbound 'Cytoplasmic triacylglycerol droplet accumulation' biochemical entry: CHEBI:17855 (triglyceride), verified with OAK against sqlite:obo:chebi. Validated with 'just validate' - schema, term and reference validation all passed.

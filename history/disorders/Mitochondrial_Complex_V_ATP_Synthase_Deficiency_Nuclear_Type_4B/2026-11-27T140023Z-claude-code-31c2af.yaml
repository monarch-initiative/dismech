  details: |
    New entry for MC5DN4B (MONDO:0014091, OMIM 615228), the recessive ATP5F1A (hgnc:823) disorder; gene-family gap fill for complex V, replacing stubs/Mitochondrial_Complex_V_ATP_Synthase_Deficiency_Nuclear_Type_4B.yaml. Lump/split: kept separate from the dominant MC5DN4A (MONDO:0957254) because inheritance, mechanism and course differ and MONDO/OMIM split them; the two entries cross-reference each other with skos:relatedMatch, following the SLC25A4 MTDPS12A/12B precedent. The second recessive ATP5F1A family (homozygous p.Tyr321Cys, combined respiratory chain deficiency, PMID:23596069) belongs to MONDO:0020727 combined oxidative phosphorylation deficiency 22 and is recorded only as a relatedMatch mapping and a differential. Evidence: the founding sibship (PMID:23599390 abstract: paternal c.985C>T p.Arg329Cys, silenced maternal allele, complementation restored complex V) and two reviews summarising its full text (PMID:24564666, PMID:39016153: death in the first week, renal cysts, hypoplastic lungs, reduced assembled complex V without F1 accumulation, isolated hydrolytic defect). relationship_type UNKNOWN because the evidence is one family; ClinGen has no ATP5F1A record. No GeneReviews chapter. Validation: linkml-validate, OLS term validation, reference validator (28 snippets, 0 issues), count-verified-snippets 28/28, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, list-gene-term-mismatches and check-genereviews all passed.

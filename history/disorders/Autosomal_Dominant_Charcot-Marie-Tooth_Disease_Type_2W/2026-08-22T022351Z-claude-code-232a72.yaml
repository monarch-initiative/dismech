  summary: 'Create: Autosomal dominant Charcot-Marie-Tooth disease type 2W (HARS1)'
  details: |
    New Disease entry for CMT2W (MONDO:0014711), claimed via issue #9219.

    Lump/split decision: DISEASE. One causal gene (hgnc:4816 HARS1), no MONDO descendants. Charcot-Marie-Tooth_Disease_Type_2.yaml (the MONDO parent) exists but has no has_subtypes block and does not mention HARS1 or CMT2W, so this is not a subtype duplication.

    Mechanism curated as a four-node chain with conformance to peripheral_axonal_degeneration at two nodes (#Distal Axonal Degeneration and Demyelination, #Peripheral Neuropathy): HARS1 catalytic domain dysfunction -> neuronal proteostatic and translational stress -> impaired neurite outgrowth and distal axonal degeneration -> length-dependent sensorimotor neuropathy.

    The central node is PROVISIONAL and carries THREE competing mechanistic_hypotheses rather than one chain, because three routes each have direct experimental support and they are allele-specific rather than rival readings of one experiment: dominant-negative translational stress with eIF2-alpha phosphorylation (CANONICAL); amino acid mistranslation with proteotoxic accumulation, demonstrated for V155G and S356N but explicitly NOT for Y330C (ALTERNATIVE); and aggregation of the mutant enzyme itself, shown for D364Y (ALTERNATIVE). A further constraint recorded in the entry: one patient variant reduced aminoacylation without compromising overall protein synthesis, which argues against a simple bulk-translation-deficit account.

    Clinically the most important content is a hazard, not a therapy. Histidine supplementation rescued the mistranslating alleles but caused insoluble protein aggregation and reduced viability for the reduced-abundance alleles V133F and Y330C -- described by the source as histidine toxicity. Since histidine is an unprescribed over-the-counter supplement, this is curated as an open KNOWLEDGE_GAP framed as a hazard and deliberately NOT as a treatment. A second KNOWLEDGE_GAP records the defining puzzle of the aminoacyl-tRNA synthetase neuropathies: why a housekeeping enzyme yields a nerve-restricted, length-dependent phenotype.

    No treatments block. Valproic acid rescued process formation in a single D364Y neuronal cell line via JNK signalling; that is one cell-line result with no animal or human data and curating it as a treatment would overstate it. Reasoning recorded in notes.

    Cross-reference recorded in notes: HARS1 already appears in Antisynthetase_Syndrome as the Jo-1 autoantigen, a different mechanism (autoimmunity against the protein, not enzymatic impairment) that must not be conflated. Usher syndrome type IIIB (recessive Y454S, tRNA-binding domain) is curated as a differential diagnosis.


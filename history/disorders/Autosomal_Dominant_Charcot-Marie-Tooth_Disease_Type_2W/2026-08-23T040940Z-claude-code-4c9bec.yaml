  details: |
    Addressed the automated review on PR #9265. The CANONICAL hypothesis was evidenced solely by PMID:32940403, whose publication_types include Comment - it is a one-paragraph commentary on Mullen et al., and the curated snippet had the words 'Mullen et al.' truncated off the front, so model-organism data was attributed to a paper that generated none. Resolved the primary paper to PMID:32543048 (it was already cached in the repo as abstract_only; the fetch upgraded it to full text) and now cite it directly for the eIF2-alpha and translation result, plus the heterodimer finding as PARTIAL since the authors say it only raises the possibility of a dominant-negative mechanism. PMID:32940403 is retained as OTHER for the class-level generalization it makes and the commentary status is stated in its explanation. Re-pointed three core clinical phenotypes (peripheral axonal neuropathy, distal muscle weakness and wasting, distal sensory impairment) away from generic-CMT introduction sentences in the in-vitro valproic-acid paper and onto HUMAN_CLINICAL evidence from PMID:26072516 and PMID:36164730; the PMID:36164730 quote was extended to carry the preceding CMT2W-specific framing sentence so it is not itself a generic-CMT claim. Added a prevalence record scoped explicitly to CMT overall rather than CMT2W, with a note saying so, since no CMT2W-specific rate exists. Added two animal models with modeled_mechanisms links: the C. elegans p.Asp364Tyr dominant-neurotoxicity model (LOW fidelity - no myelinated peripheral nerve, one allele tested) and the zebrafish sensory/motor neuron development model (PARTIALLY_RECAPITULATES - a developmental axon-outgrowth defect is not adult-onset length-dependent degeneration, which is the entry's existing HUMAN_MODEL_MISMATCH). Changed functional_impact_category from DOMINANT_NEGATIVE to PARTIAL_LOSS_OF_FUNCTION so the variant-level slot no longer pre-commits to one of three contested mechanism hypotheses. Split the bundled Cerebellar Atrophy and Cognitive Impairment phenotype into two entries and dropped the unsupported VERY_RARE frequency band. Corrected five wrong reference_title lines that I had introduced in this session by writing titles from memory instead of reading the cache - notably PMID:36164730 is a histidine-supplementation study, not a review. Validation: linkml-validate clean, linkml-term-validator passed, 38/38 snippets verified against cached references (was 31/31), all five ungated gates clean.

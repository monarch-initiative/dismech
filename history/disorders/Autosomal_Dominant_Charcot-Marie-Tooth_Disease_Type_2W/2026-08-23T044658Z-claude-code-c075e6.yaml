  details: |
    The Distal Muscle Weakness and Wasting explanation said 'The CMT2W-specific statement is carried by the PMID:36164730 item alongside it', but that phenotype had exactly one evidence item and the PMID:36164730 companion sits on Distal Sensory Impairment instead. Same overclaim shape corrected in the previous round, displaced one field over: prose promising a citation the phenotype does not have. Note the identical clause on the pathophysiology node IS true - the companion item is directly beneath it there - so only the phenotype occurrence was changed. Fixed by making the promise true rather than deleting it: added PMID:31211171 as a second HUMAN_CLINICAL item quoting the HARS1 patient's neurological examination, which records moderate amyotrophy in distal lower limbs with associated mild distal muscle weakness - both halves of the phenotype's name, observed clinically in a HARS1-variant patient. The clause now points at that item. Also took two suggestions: added the CMT2W-specific sentence from PMID:36164730 ('HARS is specifically associated with Charcot-Marie-Tooth disease type 2 W (CMT2W), an autosomal dominant axonal-form subtype of CMT') to the defining Peripheral Axonal Neuropathy phenotype, which previously rested only on a CMT2-class sentence from the in-vitro paper; and added the PMID:20301532 GeneReviews tag, the reviewer having resolved the divergence between their two reviews in favour of consistency with the four sibling CMT entries. Validation: linkml-validate clean, linkml-term-validator passed, 43/43 snippets verified against cached references (was 41/41), all five ungated gates clean, title audit 0 mismatches, evidence placement verified by parsing rather than by reading the diff.

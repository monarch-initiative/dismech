  summary: Bind the Yersinia pestis antibody test as a LOINC measurement
  details: |
    Added diagnosis_term (NCIT:C217458 Diagnostic Serology Testing) and measurements: LOINC:33706-3 (Yersinia pestis Ab [Presence] in Serum) to the Bubo Aspirate Culture, qPCR, Serology, and F1 Antigen Testing row, whose evidence specifically describes blood serology measuring IgG F1 antibodies, alongside culture, PCR and F1-antigen rapid testing which this binding does not cover. No F1-antigen-specific antibody code exists in the Monarch KG, so the species-level, method-unspecified antibody code was used. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch12 (LOINC_DIAGNOSTICS.md tranche B). This is a separate kb/disorders entry from Plague.yaml (which has no diagnosis section of its own).

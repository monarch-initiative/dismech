  summary: 'Create: Cranial Neuralgia (MONDO:0016374)'
  details: |
    Created kb/disorders/Cranial_Neuralgia.yaml for issue #9605 as a CURATE_ROOT_WITH_SUBTYPES target.

    Concept decision. Curated as a single Disease with nerve-defined has_subtypes rather than a kb/groupings/ union. The classical forms share one mechanistic spine node-for-node: neurovascular compression at the root entry zone, then focal demyelination and axonal juxtaposition, then ectopic discharge and ephaptic cross-excitation, then paroxysmal lancinating pain -- with the same first-line drug class and the same cause-directed operation. Love and Coakham (PMID:11701590) make that generalisation explicitly. Subtypes are Trigeminal (MONDO:0008599), Glossopharyngeal (MONDO:0016372), Nervus Intermedius, and Occipital. What varies between them is which nerve carries the lesion, which is anatomical substitution on a conserved graph.

    Occipital neuralgia is the deliberate exception and is flagged as such in both the subtype description and the entry notes: the greater, lesser and third occipital nerves are C2-C3 dorsal-ramus branches rather than cranial nerves, the described compression points are extracranial (PMID:39217283), and MONDO:0016374 does not list occipital neuralgia among its descendants. Its pathophysiology node (Extracranial Entrapment of the Occipital Nerves) is kept separate from the root-entry-zone chain and does not claim the ephaptic mechanism; its downstream edge to the pain outcome is INDIRECT_UNKNOWN_INTERMEDIATES.

    The falcon deep-research report argued the opposite case, that cranial neuralgia is an umbrella category that should be split. That reading is recorded in the entry notes rather than discarded, and is why every prevalence record carries an explicit subtype rather than being stated at the root. stubs/Trigeminal_Neuralgia.yaml is deleted by this session, because MONDO:0008599 is now covered as a has_subtypes entry; re-nominating it is the route if a future split is wanted.

    The classical-versus-secondary distinction is captured as two additional trigger nodes converging on the shared demyelination node: Central Demyelinating Plaque in Multiple Sclerosis and Posterior Fossa Mass Compressing the Nerve Root. Carbamazepine and oxcarbazepine reach the graph through target_mechanisms on the Dysregulated Voltage-Gated Sodium Channel Expression node; microvascular decompression targets the compression node; percutaneous ablation targets the ectopic-discharge node, which is the mechanistic reason it costs sensory function where decompression does not.

    Three discussions recorded: whether the trigeminal-derived ephaptic mechanism actually holds for glossopharyngeal and nervus intermedius neuralgia (which is what the one-disease concept decision rests on), why severe neurovascular contact is present on 13 percent of asymptomatic sides, and a HUMAN_MODEL_MISMATCH on the rat infraorbital constriction model that supplies the sodium-channel subunit detail.

    Deep research: falcon (Edison), 14 of 14 references resolved, confabulation rate 0.0. preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0016374; the manual synonym and duplicate preflight was done instead. Evidence was sourced primarily from direct PubMed search rather than from the report's own citations, which are largely secondary reviews cited by DOI.

    Validation: just validate (schema, terms and references) passed with 102 of 113 snippets verified against cache and 3 skipped by prefix; validate-terms passed; check-duplicate-keys, check-entity-refs, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean; check_reference_titles.py --against-ref origin/main clean. The Chronic arterial hypertension environmental entry is intentionally left without an exposure_term, because ECTO and XCO carry only antihypertensive-agent concepts which would assert the opposite of the claim; the search is recorded in the entry's notes.

    Post-drafting self-review (subagent, dismech-pr-review) found and this session fixed: three prevalence_class bands off by a decade against scripts/migrate_prevalence.py::_band_from_rate (independently caught before the review returned); an oxcarbazepine target_mechanisms snippet that quoted first-line status rather than the sodium-channel mechanism it was cited for; two pronoun-only snippets whose referent sat outside the quote; a Stereotactic Radiosurgery treatment whose only evidence was an EAN sentence that never mentions radiosurgery, now backed by PMID:37144649 and PMID:38385643; HP:0012533 Allodynia bound to the trigger-evoked phenotype despite the entry's own cited source separating trigger zones from allodynia, now unbound with the distinguishing quote recorded; PMID:39217283 graded HUMAN_CLINICAL when it is a cadaveric dissection study, now OTHER/PARTIAL in both uses; an unevidenced glossopharyngeal vagal-syncope clause, now a substantiated Cardiovascular phenotype citing PMID:27102416; and PMID:25616608 cited in evidence but absent from the top-level references block.

    Also added in response to that review: an animal_models entry for the rat infraorbital chronic constriction injury carrying both a PARTIALLY_RECAPITULATES link to the sodium-channel node and a FAILS_TO_RECAPITULATE link to the paroxysmal-pain node, which gives the HUMAN_MODEL_MISMATCH discussion a structural counterpart; clinical_trials for NCT06620172 and NCT05491915; therapeutic_agent bindings for the intravenous and botulinum treatments; and therapeutic_modality corrections from SMALL_MOLECULE to OTHER for botulinum toxin (a ~150 kDa protein) and for the occipital nerve block (a procedure). Weighted compliance is 100% apart from an intentionally empty datasets block.
    Review round (ai4c-reviewer, CHANGES_REQUESTED, one IMPORTANT finding). The blocking item was that the entry had no genetic section and did not record why, even though DOI:10.1007/s12031-024-02263-x was fetched and committed in this PR. Resolved by adding a genetic section with C8B (hgnc:1353) and MFGE8 (hgnc:7036) as relationship_type SUSCEPTIBILITY with PARTIAL-graded association evidence, plus per-gene notes and an entry-level note recording the three caveats: candidate-gene design rather than a genome-wide scan so p=0.00016 is far from 5e-8 and uncorrected, small effect sizes (OR 1.357 and 1.313), and a single unreplicated cohort. Neither gene is wired into the pathograph, because the proposed biology is complement and neuroinflammation which this entry does not model.
    Non-blocking review suggestions all actioned: added a STIM1/ORAI1 store-operated-calcium KNOWLEDGE_GAP discussion citing DOI:10.3389/fnmol.2024.1391189, graded COMPUTATIONAL and MODEL_ORGANISM against the paper's stronger wording; cited the cached GPN comparative surgical study DOI:10.1186/s12883-023-03415-z on the percutaneous ablation treatment; added a progression section including the finding that attack frequency and duration do NOT escalate with disease duration, which refutes the intuitive model and is why no severity-escalation edge exists; added clinical_burden HIGH backed by PMID:26174508 (aHR 2.85 depression, 2.98 anxiety, 2.17 sleep disorder in a 3273-patient nationwide cohort); regraded all six PMID:11803297 evidence items from HUMAN_CLINICAL to OTHER since Devor is a hypothesis review with no primary data; and removed GO:0009612 from the tissue-scale compression node, since it names a cell-level response while the node is the mechanical insult itself.
    Self-check during that round found three evidence snippets that the reference validator skips by prefix (DOI: references are not machine-verified) and which did not match their caches: two used ASCII spaces where the cache has U+2009 thin spaces around comparison operators, and one the same around equals signs. All three were corrected to the exact cache characters, and a manual pass now confirms all 13 prefix-skipped snippets are exact substrings of their caches.
    Held under review: the datasets block stays empty, because with no causal gene to anchor on a dataset search resolves through disease-name matching straight into Named Entity Confusion. The occipital neuralgia node stays off the ephaptic chain, since the demyelination-and-ephaptic evidence comes from cranial nerve roots and has not been shown for C2-C3 dorsal-ramus branches. The reviewer raised neither as a problem.
    Second review round (ai4c-reviewer, CHANGES_REQUESTED). The blocking finding was that PMID:35860499 (Szmyd 2022, systematic review of the neurovascular compression syndromes) was fetched and committed in this PR but uncited, and that the gap_cn_compression_insufficient rationale ended "No candidate for that additional factor is established" -- which that source contradicts, and which had also become internally inconsistent with this session's own previous commit, since the STIM1/SOCE discussion and the C8B/MFGE8 genetic records both propose exactly such a co-factor. The rationale is reworded to say candidates have been proposed but none demonstrated as the necessary second hit, citing Szmyd's list (demyelination, REZ remodelling, vasculature pathology, nucleus hyperexcitability, white/grey matter change, ion-channel disturbance).
    Szmyd is also now cited on the central ephaptic node as independent corroboration of the lump/split decision: it reaches the same grouping two decades after Love and Coakham and explicitly includes geniculate (nervus intermedius) neuralgia, which is the thinnest subtype here. That argument is added to the entry notes as well, since the one-disease decision previously rested on a single 2001 source.
    Both non-blocking suggestions actioned: PMID:30095334 now cited twice on the Nervus Intermedius subtype (definition, and the diagnostic-overlap caveat graded PARTIAL); and both unbound subtypes carry review_notes recording the MONDO search, matching the convention already used for the ECTO/XCO hypertension search. For Occipital the note also records that HP:0012318 exists but cannot be used, because subtype_term is bound to the DiseaseOrSubtypeTerm enum which an HP term is not a member of.
    The reviewer confirmed on re-read that the empty datasets block and keeping occipital neuralgia off the ephaptic chain are both correct, and independently verified 109 of 109 snippets and 33 of 33 reference titles.


  summary: 'Create: Cranial Neuralgia (MONDO:0016374)'
  details: |
    Created kb/disorders/Cranial_Neuralgia.yaml for issue #9605 as a CURATE_ROOT_WITH_SUBTYPES target.

    Concept decision. Curated as a single Disease with nerve-defined has_subtypes rather than a kb/groupings/ union. The classical forms share one mechanistic spine node-for-node: neurovascular compression at the root entry zone, then focal demyelination and axonal juxtaposition, then ectopic discharge and ephaptic cross-excitation, then paroxysmal lancinating pain -- with the same first-line drug class and the same cause-directed operation. Love and Coakham (PMID:11701590) make that generalisation explicitly. Subtypes are Trigeminal (MONDO:0008599), Glossopharyngeal (MONDO:0016372), Nervus Intermedius, and Occipital. What varies between them is which nerve carries the lesion, which is anatomical substitution on a conserved graph.

    Occipital neuralgia is the deliberate exception and is flagged as such in both the subtype description and the entry notes: the greater, lesser and third occipital nerves are C2-C3 dorsal-ramus branches rather than cranial nerves, the described compression points are extracranial (PMID:39217283), and MONDO:0016374 does not list occipital neuralgia among its descendants. Its pathophysiology node (Extracranial Entrapment of the Occipital Nerves) is kept separate from the root-entry-zone chain and does not claim the ephaptic mechanism; its downstream edge to the pain outcome is INDIRECT_UNKNOWN_INTERMEDIATES.

    The falcon deep-research report argued the opposite case, that cranial neuralgia is an umbrella category that should be split. That reading is recorded in the entry notes rather than discarded, and is why every prevalence record carries an explicit subtype rather than being stated at the root. stubs/Trigeminal_Neuralgia.yaml is deleted by this session, because MONDO:0008599 is now covered as a has_subtypes entry; re-nominating it is the route if a future split is wanted.

    The classical-versus-secondary distinction is captured as two additional trigger nodes converging on the shared demyelination node: Central Demyelinating Plaque in Multiple Sclerosis and Posterior Fossa Mass Compressing the Nerve Root. Carbamazepine and oxcarbazepine reach the graph through target_mechanisms on the Dysregulated Voltage-Gated Sodium Channel Expression node; microvascular decompression targets the compression node; percutaneous ablation targets the ectopic-discharge node, which is the mechanistic reason it costs sensory function where decompression does not.

    Three discussions recorded: whether the trigeminal-derived ephaptic mechanism actually holds for glossopharyngeal and nervus intermedius neuralgia (which is what the one-disease concept decision rests on), why severe neurovascular contact is present on 13 percent of asymptomatic sides, and a HUMAN_MODEL_MISMATCH on the rat infraorbital constriction model that supplies the sodium-channel subunit detail.

    Deep research: falcon (Edison), 14 of 14 references resolved, confabulation rate 0.0. preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0016374; the manual synonym and duplicate preflight was done instead. Evidence was sourced primarily from direct PubMed search rather than from the report's own citations, which are largely secondary reviews cited by DOI.

    Validation: just validate (schema, terms and references) passed with 92 of 95 snippets verified against cache and 3 skipped by prefix; validate-terms passed; check-duplicate-keys, check-entity-refs, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean; check_reference_titles.py --against-ref origin/main clean. The Chronic arterial hypertension environmental entry is intentionally left without an exposure_term, because ECTO and XCO carry only antihypertensive-agent concepts which would assert the opposite of the claim; the search is recorded in the entry's notes.

    Post-drafting self-review (subagent, dismech-pr-review) found and this session fixed: three prevalence_class bands off by a decade against scripts/migrate_prevalence.py::_band_from_rate (independently caught before the review returned); an oxcarbazepine target_mechanisms snippet that quoted first-line status rather than the sodium-channel mechanism it was cited for; two pronoun-only snippets whose referent sat outside the quote; a Stereotactic Radiosurgery treatment whose only evidence was an EAN sentence that never mentions radiosurgery, now backed by PMID:37144649 and PMID:38385643; HP:0012533 Allodynia bound to the trigger-evoked phenotype despite the entry's own cited source separating trigger zones from allodynia, now unbound with the distinguishing quote recorded; PMID:39217283 graded HUMAN_CLINICAL when it is a cadaveric dissection study, now OTHER/PARTIAL in both uses; an unevidenced glossopharyngeal vagal-syncope clause, now a substantiated Cardiovascular phenotype citing PMID:27102416; and PMID:25616608 cited in evidence but absent from the top-level references block.

    Also added in response to that review: an animal_models entry for the rat infraorbital chronic constriction injury carrying both a PARTIALLY_RECAPITULATES link to the sodium-channel node and a FAILS_TO_RECAPITULATE link to the paroxysmal-pain node, which gives the HUMAN_MODEL_MISMATCH discussion a structural counterpart; clinical_trials for NCT06620172 and NCT05491915; therapeutic_agent bindings for the intravenous and botulinum treatments; and therapeutic_modality corrections from SMALL_MOLECULE to OTHER for botulinum toxin (a ~150 kDa protein) and for the occipital nerve block (a procedure). Weighted compliance is 100% apart from an intentionally empty datasets block.

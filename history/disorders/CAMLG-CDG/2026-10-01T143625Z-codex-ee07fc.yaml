  summary: Review CAMLG-CDG mechanisms, limited clinical evidence and neuronal models
  details: |
    Review the complete CAMLG-CDG entry, its CREATE history, the matching deep-research report and citation list, and the cached primary literature. Eligibility was checked against origin/main 5ece56453d85ddb3c99778917fb7011ab2a43c14 and the refreshed paginated open-PR file census: no previous REVIEW and no open KB/history overlap. Automated research preflight returned SKIP because MONDO has no causal-gene edge; manual OMIM 620201 / MONDO:0859357 / CAMLG identity checks agree with the primary report and current ClinGen record. Retain the established gene-named disease and synonyms.

    Read the complete 2022 clinical/functional paper (PMID35262690), including methods, results, figure legends and discussion. Separate physical intronic alteration, observed exon skipping, predicted protein truncation and measured reduced CAML. A +4 donor-region variant is not a canonical splice-dinucleotide substitution. Preserve the normal localization of several tail-anchored substrates and distinguish measured STX5 mislocalization/BET1L abundance from proposed insertion, degradation and SNARE-trafficking steps. Separate Golgi morphology, O-glycan undersialylation and the serum type II N-glycan defect. Record the normal patient-fibroblast Golgi morphology alongside the HeLa result, and avoid assuming otherwise-normal glycan structure from a limited marker panel.

    Add substantive 2025 evidence omitted from the entry and research report: PMID39823474 was read in full, including all scientific text, methods and figure legends. Graded global depletion and neuron-specific Caml deletion models survive long enough to show severe motor phenotypes, and the SLICK-H model has measured lumbar motor-neuron loss. Mouse fibroblasts show altered lysosomal cargo handling, galectin/LAMP1 abnormalities and increased PNA staining. Keep these findings distinct from the partially depleted cortical cultures, whose STX5/CD222 localization changes and neurite growth differences were nonsignificant. Represent the new cellular/organism models and proposed lysosomal route without asserting that mouse motor-neuron pathology explains every human clinical feature. Read the 2014 WRB/CAML yeast-complementation paper (PMID24392163) and add a limited normal-function rescue model. The 2003 mouse-null source remains abstract-only after refetch and DOI fallback; no inaccessible full-text details are asserted.

    Preserve one-family uncertainty without assigning phenotype frequencies. Add explicitly reported intellectual disability, use the limb-joint contracture term, and bind postnatal microcephaly to Secondary microcephaly. Remove unsupported claims of progressive radiographic loss, a fixed versus progressive course, unreported walking milestone history, precise respiratory-support starting age, gastrostomy airway protection and treatment failure inferred from a single low weight. Remove unsupported sequela edges. Connect all 23 clinical findings with appropriately qualified mechanisms or unresolved clinical associations. Retain the levetiracetam response as a single-patient observation.

    Refresh diagnostic interpretation with RNA confirmation and brain MRI; classify STX5 localization as a research marker rather than a validated discriminatory clinical test. Preserve observed supportive treatments and make genetic counselling explicitly indirect. Read GET4 and ASNA1 comparator papers in full and the relevant STX5 clinical/functional results. Do not import GET4 bortezomib rescue or ASNA1 cardiac outcomes as CAMLG therapies or phenotypes. The GET4 serum/cellular glycosylation findings and slight ASNA1 glycoform abnormalities do not establish an identical glycosylation defect across all TRC disorders.

    Current ClinGen CCID008383 remains Limited (September 2024). Add a structured gene_disease_validity assertion and replace the schema's Strong/Definitive CAUSATIVE relationship label with UNKNOWN plus an explicit candidate-causation association. Preserve the experimentally demonstrated variant effects while avoiding a definitive gene-disease claim. ClinVar RCV003152398.2 flags the literature-only OMIM pathogenic submission for insufficient gene-disease evidence; this is not a benign classification. ClinGen's live summary swaps author names for two model papers and lists MRI age as onset/exome sequencing; use the primary publications for those facts. The immutable structured CGGV source remains the cited classification record.

    Search current Europe PMC/PubMed gene literature and ClinicalTrials.gov. The search identified the 2025 mouse paper but no independent second CAMLG-CDG case report. A Parkinson disease common-variant study (PMID40053464) was read for its relevant results and limitations; it does not establish another recessive CDG allele or phenotype and is not cited. The sole trial-registry match is an unrelated lupus telitacicept study with a CAML background mention. Fresh GeneReviews and StatPearls checks both return NO_CHAPTER. No disease-specific intervention trial is added.

    Retain both scientific discussions, updating the neurological mechanism question for the new mouse evidence and remaining human neuronal/allele-specific uncertainty. Remove curation-process prose from disease notes. Regenerate every new reference cache through just fetch-reference; unused DOI, live ClinGen HTML and Parkinson-study caches are excluded from the PR. Validate all 91 exact quotations and 100 titles, schema and ontology bindings, history, complete phenotype connectivity, structured gene validity and repository evidence-hygiene gates.

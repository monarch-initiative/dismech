  summary: 'Create: CAMLG-CDG (congenital disorder of glycosylation type IIz, MONDO:0859357)'
  details: |
    De novo curation of MONDO:0859357 (congenital disorder of glycosylation, type IIz).

    Gene identification. The stub recorded no gene. CDG-IIz was resolved to CAMLG from
    MONDO:0859357 -> OMIM:620201 / MedGen C5774295 (NCBI E-utilities esummary), then
    MedGen -> NCBI Gene 819 (elink), which returns CAMLG at 5q31.1 with CDG2Z and GET2
    among its aliases. HGNC:1471 was read from the HGNC REST API in the same step. The
    primary literature search (PubMed 'CAMLG-CDG', 'CDG2Z', 'CAMLG AND (glycosylation OR
    CDG)') returns exactly one patient report, Wilson et al. 2022 (PMID:35262690), whose
    title names the disease CAMLG-CDG.

    Naming / lump-split. Curated as a Disease under the gene-named form CAMLG-CDG. The
    automated second opinion on issue #12798 pointed out that the two most recently
    curated type-II CDG entries (IIr, IIw) kept the roman-numeral name, and suggested the
    collision with a separately curated non-CDG disease of the same gene as the likely
    reason for IIr (ATP6AP2). That check was run here: 'grep -ril CAMLG kb/' returns no
    disorder entry, so there is no collision and the dominant gene-named convention
    applies. Roman-numeral and OMIM forms are carried as synonyms. The stub was updated
    to entry_type: DISEASE in a separate commit before the entry was written, then
    deleted with the curation commit.

    Deep research. Requested provider falcon returned HTTP 402 (account out of credits);
    the run fell back to claude_code, as configured. The report is committed as
    research/CAMLG-CDG-deep-research-claude_code.md with its citations sidecar.
    'just preflight-dr' returned SKIP, not FAIL: MONDO records no RO:0004003 causal gene
    for MONDO:0859357 so the automated gene-identity check cannot discriminate. The
    manual fallback confirms the report is on-topic - top gene CAMLG (21 mentions), OMIM
    620201 matching MONDO's own xref. The report's own term validation flagged four
    suspect HPO/GO CURIEs (HP:0002451, HP:0007266, HP:0007305, GO:0006486); none of them
    was used. Every binding in the entry was looked up independently through the OLS REST
    API. The report also mis-states the age of seizure onset as ~3 months; the primary
    source says one year, and the entry follows the primary source. The report's
    suggestion to trace the mouse knockout claim to its own source was taken -
    PMID:12919676 is cited directly for the Camlg null rather than Wilson et al.'s
    background sentence, which is cited alongside it for the hypomorph/null contrast.

    Evidence. 64 snippets, all exact-quote verified against cached references
    (references_cache/PMID_35262690.md is full_text_xml, so the full-text quotes are
    CI-reproducible under linkml-reference-validator 0.3.0rc1). Six references are
    cited: the defining paper, the GET4, ASNA1/GET3, STX5 and mouse-knockout papers used
    for the differential and the animal model, and the ClinGen assertion below.

    Structured sources, and a corrected negative claim. An earlier draft of the entry's
    notes asserted that ClinGen had published no gene-disease validity assertion for
    CAMLG. Re-running the search against the source rather than trusting the draft
    refuted it: the ClinGen CSV carries
    CGGV:assertion_c077f9b7-9845-44dc-8007-be476f7b291e-2024-09-25T160000.000Z, CAMLG /
    congenital disorder of glycosylation, type IIz, AR, classification Limited, CDG Gene
    Curation Expert Panel, 2024-09-25. It is now cited in the genetic section and stated
    in the description, since a Limited classification bears directly on how a CAMLG
    variant should be read on a diagnostic panel. The cache file was built with
    `clingen-rebuild --id ... --cache-dir references_cache` from a fresh download of the
    unversioned ClinGen URL; data/clingen/MANIFEST.yaml was deliberately not repinned,
    as that is a repo-wide change outside this entry's scope, and the assertion has not
    changed since 2024 so the pinned release should yield the same bytes. Orphanet has
    no corresponding concept: OLS ORDO searches for "CAMLG", "glycosylation type IIz"
    and "CDG-IIz" each returned 0, against 99 for "glycosylation" as a control.

    Deliberate omissions. No phenotype carries a frequency band: with one reported
    patient any band would be an assertion about a denominator of one. No GeneReviews
    or StatPearls chapter covers the disease (`just check-genereviews`, offline and
    --online, reports NO_CHAPTER for both). gnomAD was not consulted for the intronic
    variant and no population-frequency claim is made. The T-cell biology of CAML was
    left out as a non-disease-linked gene function. The two
    downstream pathograph steps - Golgi SNARE disorder to hyposialylation, and the
    biochemical defect to the neurological phenotype - are marked PROVISIONAL and
    HYPOTHETICAL because the defining study offers both as proposals and states that the
    pathomechanism is not established.

    Environment. Disk on the curation machine was at 97%, so no private rc venv was
    built; an existing linkml-reference-validator 0.3.0rc1 environment was reused and
    its version re-read immediately before each gate. No ontology SQLite build was
    downloaded - all term lookups went through the OLS REST API.

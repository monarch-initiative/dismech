  summary: 'Genetics pass: Bilateral_Striopallidodentate_Calcinosis (d2g series-039)'
  details: |
    Genetics pass for series-039 (issue #12246). Enumerated all 10 MONDO descendants of MONDO:0008947 through the OLS4 API and read each term's gene edges from the Monarch association API. Added genetic: records for the two genes the entry did not carry: CMPK2 (IBGC10), typed CAUSATIVE on two families with co-segregating biallelic variants plus knockout and knock-in mouse models that reproduce the calcification, and RRP12 (IBGC11), typed UNKNOWN with association Candidate following its founding report's own wording. CMPK2 brings a third mechanistic axis to the entry, so a new pathophysiology node "Neuronal and endothelial mitochondrial dysfunction" was added, bound to CMPK2, with downstream to the existing calcium-phosphate deposition node. RRP12 gets no node: the cited work establishes reduced protein and abnormal nucleolar morphology, not how either step reaches deposition. Declared all nine gene-defined MONDO leaves as disease-level narrowMatch mappings rather than creating nine has_subtypes rows, preserving the entry's existing inheritance-based subtype split; the reasoning is in the notes. Tagged the GeneReviews chapter PMID:20301594 in references: as the mandatory baseline and recorded why no evidence item quotes it. Backfilled relationship_type CAUSATIVE onto the seven pre-existing genetic records that already said so in free-text association.

  summary: 'Create: MERTK-Related Retinopathy'
  details: |
    Created MERTK-Related Retinopathy (MONDO:0800394, RP38) as the next gene-tail target in the #4008 retinopathy curation series, following CACNA1F, RCBTB1, and CAPN5. Deep research run via both claude_code (317s, 26 web searches, verified) and falcon/Edison (1506s, 41 citations) providers; the claude_code report was used as the primary source. All 10 candidate PMIDs plus the NCT01482195 clinical trial record were independently fetched and verified against cached abstracts/full text before use; one deep-research-cited PMID (28303901, proposed for the PTC124 translational read-through rescue claim) was a fabricated/mismatched citation, an unrelated telomere/Wnt signaling paper, and was discarded and replaced with the correct paper PMID:28246391 Ramsden et al 2017, found via independent PubMed search. Modeled the disease's distinctive non-cell-autonomous mechanism: MERTK loss abolishes RPE-side outer-segment ensheathment/phagocytosis, evidenced with an hPSC-RPE mechanistic paper PMID:32160519, rather than acting cell-autonomously in photoreceptors, distinguishing it from most other RP genes; pathophysiology conforms to the photoreceptor_degeneration module at the Rod Photoreceptor Apoptosis node. Included the completed phase I subretinal AAV2 gene therapy trial rAAV2-VMD2-hMERTK NCT01482195 and the investigational ataluren/PTC124 translational readthrough strategy as treatments, plus the RCS rat and patient-derived iPSC-RPE animal/cellular models. No GeneReviews chapter exists for MERTK-RP, confirmed via PubMed search, so none was used as a baseline. Full validation schema/term/reference passes; required a manual addition of MONDO:0800394 to cache/enums/diseaseterm csv and cache/mondo/terms.csv since the term postdates the last full enum-cache regeneration, which timed out/was killed when attempted fresh in this environment; also fixed two unrelated pre-existing mojibake-corrupted rows in cache/mondo/terms.csv MONDO:0009145 and MONDO:0100163 encountered along the way, consistent with a known Windows encoding bug from a prior PR RCBTB1 #6622.

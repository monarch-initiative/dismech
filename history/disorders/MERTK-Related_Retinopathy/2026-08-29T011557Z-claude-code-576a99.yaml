  details: |
    # Fix summary: MERTK-Related Retinopathy

    ## Findings fixed

    1. **MINOR — "Secondary Cone Degeneration" asserts an unsourced mechanism** (review
       finding 1). The node description asserted "elevated outer retinal oxygen tension and
       loss of rod-derived survival factors drive cone photoreceptor death" as if evidenced
       by PMID:21677792, which only supports the early macular involvement. Reworded to frame
       the oxygen-tension / trophic-factor mechanism as "the general mechanisms proposed for
       rod-cone dystrophies" and added an explicit parenthetical noting these downstream
       cone-death mechanisms are general RP biology, not specifically evidenced for MERTK-RP
       by the cited cohort. The evidence item and its snippet are unchanged (they correctly
       support the early macular involvement). The upstream causal-edge
       `intermediate_mechanisms` were left as-is: that slot legitimately lists hypothesized
       intermediates on an INDIRECT_KNOWN_INTERMEDIATES edge and does not assert them as
       sourced.

    3. **MINOR (structural) — iPSC-RPE model was under `animal_models`** (review finding 3).
       Moved the "Human (patient-derived) iPSC-RPE, Ser331Cysfs*5 MERTK frameshift" entry
       out of `animal_models:` into a new `experimental_models:` section as an
       `ExperimentalModel` with `experimental_model_type: IPSC_DERIVED_MODEL`, per CLAUDE.md
       (animal_models is whole-organism only; iPSC-derived cultures belong in
       experimental_models). Mapped fields to the ExperimentalModel schema: `species`/
       `genotype` (AnimalModel-only slots) → `name` + `cell_source`; added `organism`
       (NCBITaxon:9606) and `cell_types` (CL:0002586, retinal pigment epithelial cell — both
       already cached) and `publication: PMID:26263531`. The entry carried **no**
       `modeled_mechanisms` link, so nothing there to preserve; description, evidence,
       snippet, and its IN_VITRO grading are all unchanged.

    ## Findings intentionally skipped

    - **Review finding 2** (Rod Photoreceptor Apoptosis mechanism supported only by the
       RCS-rat MODEL_ORGANISM reference): report says this is "defensible" (mechanism node,
       not a human-phenotype claim; node conforms_to the photoreceptor_degeneration module;
       human rod-cone phenotype is separately supported in the phenotypes section) and
       "likely no change needed". Verified grading is honest (MODEL_ORGANISM, RCS rat) and
       the node's mechanism claim is appropriately model-sourced. No change.

    ## New/changed references

    - No references fetched or changed. One entry relocated between top-level sections;
      no snippets altered.


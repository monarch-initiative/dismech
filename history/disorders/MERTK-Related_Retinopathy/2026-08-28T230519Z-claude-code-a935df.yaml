    # Review: MERTK-Related Retinopathy

    - File: `/home/user/dismech/kb/disorders/MERTK-Related_Retinopathy.yaml`
    - Review date: 2026-08-28
    - Mechanical audit: **34/34 snippets verified** against cached references
      (`uv run python -m dismech.reference_snippet_audit`).

    ## Verdict: MINOR_ISSUES

    No claim-fidelity or misclassification finding rises to MAJOR/CRITICAL. Every
    evidence snippet is an exact substring of its cached source, every snippet
    substantively supports the specific claim it attaches to (right gene MERTK,
    right disease RP38/MERTK-RP, right direction), `supports:` grading is uniformly
    correct, and `evidence_source:` is correct throughout (HUMAN_CLINICAL for the
    Faroese/Saudi/Australian patient cohorts and the phase I trial; IN_VITRO for the
    hESC/iPSC-RPE ensheathment and TRID studies; MODEL_ORGANISM for the RCS rat
    preclinical work). The three findings below are minor.

    ## Findings

    1. **MINOR — pathophysiology "Secondary Cone Degeneration" (PMID:21677792):
       description asserts a specific mechanism the cited source does not state.**
       The node description claims cone death is driven by "elevated outer retinal
       oxygen tension and loss of rod-derived survival factors," and the upstream
       causal edge lists intermediate_mechanisms "loss of rod-derived trophic
       support for cones" / "elevated outer retinal oxygen tension after rod loss."
       The attached evidence (PMID:21677792) says only: *"Early macular involvement
       was present, in accordance with that of other reported patients with MERTK
       mutations."* That snippet supports the *existence* of early cone/macular
       involvement, not the oxygen-tension / trophic-factor mechanism, which is
       general RP biology carried in as descriptive context rather than sourced from
       this paper. This is a common and largely tolerated descriptive pattern (the
       node's clinical reality is well supported), but the mechanistic prose runs
       ahead of the single citation. Why it matters: a reader may take the
       oxygen-tension mechanism as evidenced for MERTK-RP specifically when it is
       not cited.

    2. **MINOR — pathophysiology "Rod Photoreceptor Apoptosis": sole support is a
       model-organism reference (PMID:23692380, RCS rat, MODEL_ORGANISM).** The node
       asserting progressive rod photoreceptor death rests on the RCS-rat statement
       *"Mutations in MERTK cause impaired phagocytic activity and accumulation of OS
       debris ... that ultimately leads to photoreceptor cell death."* This is a
       mechanism node (not a human-phenotype claim — the human rod-cone-dystrophy
       phenotype is separately and independently supported by HUMAN_CLINICAL evidence
       in the phenotypes section, PMID:20300561), and the node `conforms_to` the
       photoreceptor_degeneration module, so model-organism support for the mechanism
       is defensible. Noted only because it is the single evidence item on the node
       and it is model-organism; a human-tissue or clinical corroborating citation
       would strengthen it.

    3. **MINOR (structural, not evidence-fidelity) — the second `animal_models`
       entry is a human in-vitro model.** "Human (patient-derived) iPSC-RPE,
       Ser331Cysfs*5 MERTK frameshift" (PMID:26263531, correctly graded IN_VITRO) is
       a non-animal, iPSC-derived culture system placed under `animal_models:`. Per
       CLAUDE.md, `animal_models:` is for whole-organism animals and non-animal
       systems (organoids, iPSC-derived and primary cultures) belong in
       `experimental_models:`. The evidence and its classification are correct; only
       the section placement is off. (The genotype label matches the source — the
       cache reports the same c.992_993delCA / p.Ser331Cysfs*5 variant.)

    ## Coverage


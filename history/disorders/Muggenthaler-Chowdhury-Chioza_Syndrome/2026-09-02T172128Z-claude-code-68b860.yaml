  summary: 'Create: Muggenthaler-Chowdhury-Chioza syndrome (HYAL2)'
  details: |
    Created new ultra-rare Mendelian disorder entry for Muggenthaler-Chowdhury-Chioza syndrome (HYAL2 deficiency, MONDO:0976127; biallelic loss-of-function HYAL2, hgnc:5321). Grounded directly in primary literature (no deep-research recipe run): foundational paper Muggenthaler et al. 2017 PLoS Genet (PMID:28081210, human + Hyal2-/- mouse), clinical-spectrum expansion Fasham et al. 2022 Genet Med (PMID:34906488), and the GeneReviews chapter (PMID:37733894, tagged GeneReviews). Modeled a three-node causal chain: HYAL2 deficiency -> impaired extracellular hyaluronan degradation -> disrupted hyaluronan-dependent developmental morphogenesis, wired by bare-name downstream targets to cleft lip/palate, cor triatriatum sinister, and facial dysmorphism. Curated phenotypes (cleft lip/palate, cor triatriatum sinister, myopia, conductive hearing impairment, facial dysmorphism, pectus excavatum), AR inheritance (HP:0000007), supportive/surgical/genetic-counseling treatments (NCIT), and ultra-rare cases-in-literature prevalence. Mouse data graded MODEL_ORGANISM, transfection/functional studies IN_VITRO, in silico modeling COMPUTATIONAL. Kept distinct from HYAL1 deficiency / MPS type IX. All evidence uses exact-quote snippets verified via just fetch-reference + count-verified-snippets (23/23). Passed just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-disorders. Deleted stub. Claim issue #10522.

- type: CREATE
  outcome: changed
  summary: Initial curation of El Hayek-Chahrour neurodevelopmental disorder (MONDO:0970951)
  details: |
    Created kb/disorders/El_Hayek-Chahrour_Neurodevelopmental_Disorder.yaml (MONDO:0970951, OMIM #620820) based on primary literature (PMID:33350388, PMID:37992166, PMID:41889174). Curated autosomal dominant and autosomal recessive inheritance modes, prevalence (33 reported individuals from 28 families), pathophysiology cascade conforming to epigenetic_machinery_neurodevelopmental_dysregulation, HPO-anchored clinical phenotypes, KDM5A genetic association (hgnc:9886), and Kdm5a-/- mouse model findings.
- type: EDIT
  outcome: changed
  sections:
  - synonyms
  - prevalence
  - pathophysiology
  - phenotypes
  - diagnosis
  - treatments
  - animal_models
  - discussions
  summary: Address PR #14121 review feedback (unbundle pathophysiology, refine GO and phenotype edges, reconcile ID/seizure cohort counts, and add discussions)
  details: |
    Addressed ai4c-reviewer feedback on PR #14121 and reconciled the entry against the deep-research report: added reference_title to all evidence items; split bundled neuronal/dendritic pathophysiology node into three tissue-specific atomic nodes (Altered Hippocampal Neuronal Subtype Identity and Accelerated Maturation, Hippocampal Neuronal Dendritic Hyper-Arborization, Cortical Pyramidal Neuron Dendritic and Spine Hypoplasia) with specific GO H3K4 demethylase bindings (GO:0034647, GO:0006482), removed redundant GO:0032453, clarified that altered H3K4me2/3 erasure is biochemically inferred rather than directly assayed in brain tissue, and removed the 6 unsupported phenotype causal edges (Hypoplasia of the corpus callosum, Microcephaly, Hypotonia, Feeding difficulties, Sleep disturbance, Seizure); connected Kdm5a-/- mouse model via modeled_mechanisms; added discussions for the heterozygous Kdm5a+/- mouse vs monoallelic human dosage mismatch (HUMAN_MODEL_MISMATCH, with Morris water maze evidence from PMID:33350388) and unassayed brain H3K4me2/3 levels (KNOWLEDGE_GAP); reconciled Intellectual disability (19/22 assessed present across 25 Table 1 columns [13/13 in the biallelic block including KD-9-3, 6/9 assessed in the monoallelic block], 3 absent, 3 unassessed) and Seizure (9/24 assessed across Table 1: 7/13 biallelic and 2/11 assessed monoallelic) cohort counts with Table 1 of PMID:41889174; replaced deprecated prevalence percentage with measure_type: CASES_IN_LITERATURE and prevalence_class: ULTRA_RARE; added MONDO synonyms (NEDEHC, neurodevelopmental disorder, El Hayek-Chahrour type, KDM5A-related neurodevelopmental disorder); added diagnosis (WES/WGS, CMA, Brain MRI) and treatments (anticonvulsant pharmacotherapy with lamotrigine [CHEBI:6367] and oxcarbazepine [CHEBI:7824], behavioral/rehabilitative therapies, gastrostomy feeding support); added Hypertelorism (HP:0000316), Microcephaly (HP:0000252), and Atrial septal defect (HP:0001631); and noted that single-case/low-count leads from the deep-research report (isolated ventricular septal defect, ventriculomegaly, and ADHD in 1/9 of the 2020 cohort) were intentionally left out.

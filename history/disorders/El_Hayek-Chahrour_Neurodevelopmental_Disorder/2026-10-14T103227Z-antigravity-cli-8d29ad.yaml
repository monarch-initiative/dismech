- type: CREATE
  outcome: changed
  summary: Initial curation of El Hayek-Chahrour neurodevelopmental disorder (MONDO:0970951)
  details: |
    Created kb/disorders/El_Hayek-Chahrour_Neurodevelopmental_Disorder.yaml (MONDO:0970951, OMIM #620820) based on primary literature (PMID:33350388, PMID:37992166, PMID:41889174). Curated autosomal dominant and autosomal recessive inheritance modes, prevalence (33 reported individuals from 28 families), pathophysiology cascade conforming to epigenetic_machinery_neurodevelopmental_dysregulation, HPO-anchored clinical phenotypes, KDM5A genetic association (hgnc:9886), and Kdm5a-/- mouse model findings.
- type: EDIT
  outcome: changed
  sections:
  - synonyms
  - prevalence
  - pathophysiology
  - phenotypes
  - diagnosis
  - treatments
  - animal_models
  summary: Address PR #14121 review feedback (unbundle pathophysiology, connect phenotypes and animal model, add reference titles, diagnosis, treatments, and additional phenotypes)
  details: |
    Addressed ai4c-reviewer feedback on PR #14121: added reference_title to all evidence items; split bundled neuronal/dendritic pathophysiology node into three tissue-specific atomic nodes (Altered Hippocampal Neuronal Subtype Identity and Accelerated Maturation, Hippocampal Neuronal Dendritic Hyper-Arborization, Cortical Pyramidal Neuron Dendritic and Spine Hypoplasia) with specific GO H3K4 demethylase bindings (GO:0032453, GO:0034647, GO:0006482) and causal downstream edges to core neurodevelopmental phenotypes; connected Kdm5a-/- mouse model via modeled_mechanisms; replaced deprecated prevalence percentage with measure_type: CASES_IN_LITERATURE and prevalence_class: ULTRA_RARE; added MONDO synonyms (NEDEHC, neurodevelopmental disorder, El Hayek-Chahrour type, KDM5A-related neurodevelopmental disorder); added diagnosis (WES/WGS, CMA, Brain MRI) and treatments (anticonvulsant pharmacotherapy, behavioral/rehabilitative therapies, gastrostomy feeding support); added Hypertelorism (HP:0000316), Microcephaly (HP:0000252), and Atrial septal defect (HP:0001631); and restricted phenotype frequency bands to phenotypes with explicit cohort-wide denominators.

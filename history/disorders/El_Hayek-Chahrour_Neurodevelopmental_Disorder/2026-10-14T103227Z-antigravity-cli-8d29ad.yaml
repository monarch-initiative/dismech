  summary: Initial curation of El Hayek-Chahrour neurodevelopmental disorder (MONDO:0970951)
  details: |
    Created kb/disorders/El_Hayek-Chahrour_Neurodevelopmental_Disorder.yaml (MONDO:0970951, OMIM #620820) based on primary literature (PMID:33350388, PMID:37992166, PMID:41889174). Curated autosomal dominant and autosomal recessive inheritance modes, prevalence (33 reported individuals from 29 families), 4-node pathophysiology cascade conforming to epigenetic_machinery_neurodevelopmental_dysregulation, 13 HPO-anchored clinical phenotypes with cohort frequencies, KDM5A genetic association (hgnc:9886), and Kdm5a-/- mouse model findings.

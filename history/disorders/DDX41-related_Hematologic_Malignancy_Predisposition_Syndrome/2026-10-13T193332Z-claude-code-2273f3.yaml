  summary: 'Create: DDX41-related_Hematologic_Malignancy_Predisposition_Syndrome'
  details: |
    New entry for the germline DDX41 predisposition syndrome (MONDO:0014809), curated as a single gene-level DISEASE entry matching the MONDO term and the ClinGen Hereditary Cancer GCEP Definitive (AD) assertion, which is copied from the cached CGGV record. GeneReviews (PMID:34723452, abstract only cached) is the phenotype baseline. Primary sources: index germline/somatic report (PMID:25920683), French and Japanese MDS/AML cohorts (PMID:31484648, 35443031, 36322930), French penetrance study (PMID:41044237), genome-first UK Biobank/DiscovEHR study (PMID:39501104), family dysplasia and solid-tumor series (PMID:39945023), Korean and Mayo cohorts (PMID:33626862, 40040251), HSCT and donor-cell leukemia series (PMID:40924929), and mouse, zebrafish and cell models (PMID:34473945, 38937548, 33763998, 36229594, 40764304, 27174803). One falcon (Edison) deep-research report was run and used only as a lead: all 24 resolved citations, none off-topic; its single term-validation mismatch is a template artifact ('if available'). The report pointed to the UK Biobank genome-first study, which was then fetched and quoted directly; its review-derived GVHD figure for DDX41 transplants was not used because the primary subgroup was not checked. preflight-dr exited 2 because the local mondo.db build is absent. Pathograph: germline LoF -> snoRNA/ribosome and splicing/R-loop defects -> erythroid genome instability -> cGAS-STING and p53 stress -> ineffective erythropoiesis/dysplasia -> cytopenia, macrocytosis, MDS; somatic R525H second hit -> myeloid transformation -> MDS/AML/other myeloid neoplasms; lymphoid neoplasms linked from the germline node as an epidemiological edge with no lineage-specific mechanism. Conforms to the germline two-hit module at the first-hit and second-hit nodes only, not the biallelic-inactivation node, because biallelic DDX41-mutant cells are a minority subclone with a competitive disadvantage in mice (recorded as a CONTROVERSY discussion). Gaps recorded as discussions: solid-tumor risk (confounded, no second hit), biallelic germline DDX41 retinal dystrophy (preprint; not lumped). Validated with just validate, validate-terms, count-verified-snippets (76/76), entity-ref, causal-target, duplicate-key, qualifier, GeneReviews, gene-term-mismatch and block-scalar checks, the whole-KB ungated gates, and validate-disorders.

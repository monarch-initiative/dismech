  summary: 'Review round 1: DDX41-related_Hematologic_Malignancy_Predisposition_Syndrome'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 14048 and the failing CI gate for ungrounded genes. (1) Replaced the 'Antecedent Cytopenia' record, which was bound to Aplastic anemia, with lineage-specific records sourced from the Mayo CCUS subgroup (PMID:40040251): Macrocytic anemia HP:0001972, Thrombocytopenia HP:0001873, Decreased total neutrophil count HP:0001875, Pancytopenia HP:0001876 (including progression to pancytopenia). Aplastic anemia HP:0001915 is kept as its own record backed by the GeneReviews snippet. The ICUS-to-MDS evidence moved to the MDS record, and the inaccurate negative-search note was removed. (2) Split 'Other Myeloid Neoplasms' into CMML HP:0012325, Myeloproliferative disorder HP:0005547 and Chronic myelogenous leukemia HP:0005506, each with its own edge from Myeloid Transformation. (3) Added an unbound Therapy-Related Myeloid Neoplasm record sourced to GeneReviews; OLS hp searches for 'therapy-related' and 'treatment-related' returned no matching term. (4) Split lymphoid neoplasms into Lymphoma, Multiple myeloma HP:0006775, Chronic lymphatic leukemia HP:0005550 and Acute lymphoblastic leukemia HP:0006721, each linked from the germline node by an epidemiological edge. (5) Re-graded the PMID:27174803 R525H-location sentence as HUMAN_CLINICAL with quote_role BACKGROUND. Set directness INDIRECT on the PMID:39945023 lymphoblastoid and blood inflammation item after assessing it against the cGAS-STING claim. (6) Added the Stepanchick hematopoietic Ddx41+/- (+/- Trp53) mouse (PMID:38937548) and the zebrafish ddx41 sa14887 mutant (PMID:33763998) as animal models with modeled_mechanisms. (7) CI fix: bound molecular_functions on the two DDX41-bearing nodes: RNA helicase activity GO:0003724 on the germline node (ClinGen summary) and G-quadruplex unwinding activity GO:0160225 on the somatic second-hit node (PMID:40764304 FRET assay of R525H). Not done: chemotherapy agents (no cached source names the regimen), mappings (no cached ORPHA/OMIM record), and the NCT natural-history registrations (observational, with no intervention to record). Revalidated with the full fast loop, the whole-KB gates, check_gene_activity_grounding and validate-disorders.

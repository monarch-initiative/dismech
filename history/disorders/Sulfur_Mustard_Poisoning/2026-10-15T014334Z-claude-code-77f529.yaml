  details: |
    Bound LOINC:26881-3 (Interleukin 6, Serum or Plasma) to the existing Serum interleukin-6 biochemical marker. Searched for the thiodiglycol (TDG) metabolite named in the entry's own cited source (PMID:28962267) as instructed: the only similarly-named LOINC candidate, LOINC:29243-3 'Thiodiglycolate [Mass/volume] in Urine', names the structurally distinct diacid thiodiglycolic acid, a different biomonitoring analyte associated with other thioether-solvent exposures, not the diol (TDG) and its sulfoxide (TDGO) the cited source actually measures. Declined as a plausible-looking false friend rather than bound, and recorded the reasoning in the diagnosis row's notes. No code was bound for the haemoglobin N-terminal valine adduct either: a direct search for the adduct returns zero LOINC results.

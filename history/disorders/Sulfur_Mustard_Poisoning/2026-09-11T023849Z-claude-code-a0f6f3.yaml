  summary: 'Pre-PR repository-state sweep: curate GST modifiers, fix two false source claims'
  details: 'Ran the repository-state sweep on this entry before opening its PR, applying the

    habit that closed four review rounds on the COA6 entry: grep the file for every

    claim about what sources say, what an ontology contains, or what is or is not

    curated, then test each one rather than trusting the prose. Three of the seven

    claims tested were wrong, and the two substantive ones are fixed here.


    Claims that held. ECTO has no term under the agent''s common or military names -

    searches for mustard gas, yperite, vesicant, sulfur mustard and sulphur mustard

    all return nothing, and ECTO:0070054 really is "exposure to mustard greens via

    ingestion". NCIT:C68769 (Decontamination) really has no NCIT:C25218 ancestor

    while NCIT:C49236 does, so the binding compromise recorded in notes is correct.

    No GeneReviews chapter exists - the PubMed search returns zero hits.


    Finding 1, and the reason the sweep was worth running. The notes asserted that

    no sulfur-mustard-specific association study existed for the glutathione-pathway

    polymorphisms, and that no genetic: records were therefore curated. False.

    PubMed returns PMID:29435433, "Association of glutathione S-transferase

    polymorphisms with the severity of mustard lung" - 185 exposed subjects, GSTM1

    null genotype associated with severity at an adjusted OR of 2.257. The claim was

    not something this session established; it was the deep-research report''s own

    statement that its search had not found such a study, absorbed into the notes as

    though it were a finding of ours. That is the same defect class as the four COA6

    rounds, with an additional wrinkle: the false claim originated in a provider

    artifact rather than in an earlier draft.


    The fix is content, not a reworded sentence. Three genetic: records are now

    curated: GSTM1 as MODIFIER carrying the severity association, and GSTT1 and

    GSTP1 as DISPUTED carrying the negative results from the same cohort and the

    same analysis. Negative results from a study powered to find the GSTM1 effect

    are informative - they argue the effect is isoform-specific rather than a

    general property of glutathione-transferase capacity - so they are recorded

    rather than omitted. PMID:24344877 was fetched alongside and is cited on the

    GSTM1 record for the complementary observation that GSTM1 message is upregulated

    2.84-fold in mustard-lung airway wall; the notes state explicitly that combining

    the two lines is inference and that neither study tests the link.


    All three gene CURIEs were resolved by live lookup in both directions rather

    than read from the cache alone: hgnc:4632 GSTM1, hgnc:4641 GSTT1, hgnc:4638

    GSTP1.


    Finding 2. The entry contradicted itself on blister timing. A note said the

    human figures - erythema at 2 to 24 hours, vesication at 24 to 48 - are stated

    in no cached source and are deliberately not asserted, while the Skin blistering

    phenotype asserted "appearing 24 to 48 hours after contact". The note was right

    about the cache: grepping every cited source for those intervals returns

    nothing. The phenotype description now says the lesion appears after a latent

    interval without naming a figure, and points at the node that carries the

    animal-model timing that is quotable.


    Finding 3. The melanocyte node hedged its in-vitro explanation with "pigmentary

    change is also reported in areas that were never exposed", which was load-bearing

    - it was the stated reason the explanation "cannot be the whole story" - and

    which no cached source supports. Searching every cited cache for unexposed-site

    pigmentary change returns nothing. The unsourced assertion is removed and the

    epistemics kept: the opposing dose-dependence is measured in cultured human

    melanocytes, the mapping onto the clinical pattern is the study authors'' own

    inference, and no cached source reports the within-lesion concentration gradient

    the explanation would require. That replacement negative claim was itself tested

    before being written.


    Counts recomputed from the file rather than carried forward: 17 pathophysiology

    nodes, 18 phenotypes, 8 treatments, 3 genetic records, 3 animal models, 2

    environmental exposures, 4 discussions, 4 conforms_to declarations against the

    5-node fibrotic_response module, 21 evidence PMIDs of which 13 are

    content_type full_text, 117 evidence snippets. Every fetched reference is now

    cited; nothing is left in references_cache/ unused.


    Validation: just validate-disorders passes, 117/117 snippets verified, and all

    twelve offline gates green - validate-terms, check-entity-refs,

    check-causal-targets, check-duplicate-keys, check-enum-values,

    check-qualifier-terms, check-folded-hyphens, check-snippet-length,

    check-title-snippets, check-snippet-grading, check-environmental-evidence,

    check-reference-titles. Graph audit confirms no dangling targets, no orphan

    nodes and no unconnected phenotypes. Weighted compliance 87.3%.'

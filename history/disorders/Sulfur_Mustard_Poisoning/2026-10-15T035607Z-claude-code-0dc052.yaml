  summary: Drop unsourced thioether-solvent characterisation
  details: |
    The thiodiglycolate false-friend note described thiodiglycolic acid as 'a different biomonitoring analyte associated with other thioether-solvent exposures' -- unsourced, and the usual association for that analyte is vinyl chloride, which is not a thioether solvent. Removed the characterisation; the note now says only that LOINC:29243-3 names a structurally distinct diacid compound, different from the diol (TDG) and sulfoxide (TDGO) PMID:28962267 actually measures, which is sufficient to justify declining it.

  summary: 'Address PR #11663 review: correct MSC treatment binding, add omission note'
  details: 'First review round on PR #11663. One blocking finding, three suggestions, all

    verified against the files before acting.


    Blocking finding, and it was right. The investigational MSC treatment bound

    NCIT:C15431 Hematopoietic Cell Transplantation to an intrastromal injection of

    mesenchymal stromal cells into the cornea. Mesenchymal stromal cells are not

    haematopoietic cells and nothing is transplanted into marrow, so a query for

    haematopoietic cell transplantation would have returned a corneal injection.

    The binding came from CLAUDE.md''s mechanical-backfill table, which lists

    NCIT:C15431 as its CELL_THERAPY example - the table is about inferring a

    modality from an action term, and I read it as licensing the action term

    itself. Rebound to NCIT:C116467 Mesenchymal Stem Cell Transplantation, which

    the reviewer suggested and which was verified independently rather than taken

    on trust: live OAK lookup confirms the label, it is reachable from NCIT:C25218,

    it is already in the treatmentactionterm enum cache, and kb/modules/

    stem_cell_exhaustion.yaml already uses it. therapeutic_modality: CELL_THERAPY is

    unchanged and still correct.


    Suggestion taken: directness. The GSTM1 expression evidence item now carries

    directness: INDIRECT. The notes above it already said the synthesis is inference

    rather than a finding either study makes, so the slot was simply missing from

    the item that carried the inference.


    Suggestion taken: recording what was left out. Four organ systems the research

    surfaced are absent from phenotypes: gastrointestinal involvement,

    neuropsychiatric sequelae, cutaneous malignancy at exposure sites, and dry eye.

    A notes paragraph now records them so they are not re-litigated, and calls out

    that the cutaneous-malignancy omission is asymmetric - the entry models

    malignant transformation of bronchial epithelium but not of skin, though the

    same alkylation and chronic-injury nodes run through both. That asymmetry

    reflects what is citable here, not a claim that the skin risk is lower.


    A first draft of that paragraph was itself imprecise and was corrected before

    pushing. It said the report cites all four to NCBI Bookshelf rather than to

    PMIDs. Checking each: gastrointestinal, neuropsychiatric and cutaneous

    malignancy are Bookshelf-cited, but the neuropsychiatric entry additionally

    carries a publisher link to animal aggregate-culture demyelination data, and dry

    eye has no citation behind it at all - it appears only in the report''s suggested

    HP-term list, and is one of the six identifiers in that list naming a different

    concept. The paragraph now says that.


    Found during the sweep rather than by the reviewer: the bone-marrow discussion

    was keyed sm_bone_marrow_suppression_not_curated while the entry does curate

    Haematopoietic Suppression as a pathophysiology node. The identifier asserted

    the opposite of what the file does. Renamed to

    sm_haematopoietic_suppression_evidence_thin, which is what the discussion is

    actually about - the node exists but rests on a review''s secondhand assertion

    with no counts, frequency or time course. Nothing referenced the old id, and the

    PR has not merged, so the rename costs nothing.


    Suggestion declined with reason: a mappings: block for MeSH D009151 and

    CHEBI:25434. DiseaseMappings has exactly four slots - icd10cm_mappings,

    icd11f_mappings, mondo_mappings, ncit_mappings - so there is no MeSH slot to put

    D009151 in, and CHEBI:25434 is already bound in the entry as the chemical_entity

    on the penetration node, which is where the causative agent belongs rather than

    in a disease cross-reference block. The reviewer separately confirmed the ICD

    code was correctly not guessed.


    Counts recomputed from the files rather than carried forward: 22 evidence PMIDs

    of which 13 are content_type full_text, 117 evidence items, 17 pathophysiology

    nodes, 18 phenotypes, 8 treatments, 3 genetic records, 4 conforms_to

    declarations. Cached PMID files added on this branch: 22, matching the 22 cited,

    with no orphans in either direction. The PR body had said 21 PMIDs - stale by

    one since PMID:24344877 was added as an evidence item after that figure was

    written - and has been corrected.


    Validation: just validate-disorders passes, 117/117 snippets verified, and

    twelve offline gates green.'

  summary: 'Address PR #11663 round 2: curate two ocular phenotypes, retract a false claim I introduced'
  details: 'Second review round on PR #11663. The previous blocking finding was confirmed

    fixed. The new blocking finding was introduced by that same fix commit, in the

    sentence written to make the previous paragraph more precise.


    The defect. The notes paragraph added in f2d2b9780 said dry eye "has no citation

    behind it at all - it appears only in the report''s list of suggested HP terms".

    Half true: HP:0000585 offered in that list is indeed one of the six identifiers

    naming a different concept. The rest is false. Dry eye also appears in the

    report''s clinical narrative for delayed keratopathy, cited to PMID:15808253, and

    that paper''s cached abstract reports chronic blepharitis and decreased tear

    meniscus in all 48 patients.


    Worse than the reviewer stated: the entry already quoted that exact sentence

    twice, for the limbal stem cell deficiency node and for the ocular surface

    findings. So a paragraph asserting nothing was citable was contradicted by a

    snippet the file itself was using, twice, elsewhere. PMID:15808253 is cited ten

    times in this entry.


    This is the same defect class the pre-PR sweep was run to catch, occurring in

    the sentence written to correct an instance of it. The sweep did run on that

    commit and did not catch this, because it tested the claims that were already in

    the file and treated newly written prose as verified by having just been

    checked. Newly written negative claims need the same test as inherited ones.


    Fix, and the judgement call inside it. Two phenotypes are now curated from the

    sentence: Chronic blepharitis bound to HP:0000498 Blepharitis, and Decreased

    tear meniscus bound to HP:0000633 Decreased lacrimation. Both CURIEs resolved by

    live lookup. What is bound in each case is the sign the authors reported. The

    keratoconjunctivitis sicca diagnosis is deliberately not asserted: HP:0001097

    exists and this cohort does document the ocular surface damage the diagnosis

    requires, but the authors do not draw that conclusion in the quoted sentence.

    The tear item carries directness: INDIRECT because the bound term names tear

    production while the source reports tear volume present at the lid margin - one

    inferential step, recorded rather than smoothed over.


    No frequency band on either, despite "in all patients". The denominator is a

    48-patient specialist chronic-keratitis referral series, not exposed people

    generally, which is the same reason the neighbouring corneal phenotypes carry no

    band. The descriptions say so.


    The notes paragraph now states what happened rather than quietly reflecting the

    new state, because the paragraph exists to stop the question being re-litigated

    and a future curator reading a confident false negative would not re-check.


    Reviewer suggestion taken, and it was the right correction to make: notes is not

    a queue. The cutaneous-malignancy asymmetry - this entry models malignant

    transformation of bronchial epithelium but not of skin, though the same

    alkylation and chronic-injury nodes run through both - was described accurately

    in notes with no owner. It is now a KNOWLEDGE_GAP discussion,

    sm_cutaneous_malignancy_not_modelled, attached to pathophysiology#Skin

    Ulceration and Impaired Wound Healing, stating that the omission is driven by

    citability rather than by relative risk and that closing it needs a primary

    cohort study of skin cancer incidence in an exposed population.


    One mechanical note: adding the two downstream edges produced a duplicate

    downstream: key on the keratopathy node, which linkml-validate caught

    immediately. The blocks were merged rather than one being dropped.


    Counts recomputed from the file: 22 evidence PMIDs of which 13 are

    content_type full_text, 119 evidence items, 17 pathophysiology nodes, 20

    phenotypes, 5 discussions, 4 conforms_to declarations. No dangling pathograph

    targets, no orphan nodes, no unconnected phenotypes.


    Validation: just validate-disorders passes, 119/119 snippets verified, twelve

    offline gates green.'

  summary: 'Create: Sulfur Mustard Poisoning'
  details: 'Created kb/disorders/Sulfur_Mustard_Poisoning.yaml (MONDO:0800387), an

    environmental/occupational chemical-vesicant exposure entry. No prior KB entry,

    stub, PR or issue covered the disease (checked against origin/main by MONDO ID

    and by the labels "sulfur mustard", "sulphur mustard", "mustard gas" and

    "vesicant", plus PR and issue search across all states).


    Deep research: `just research-disorder claude_code Sulfur_Mustard_Poisoning`,

    one run, report committed at

    research/Sulfur_Mustard_Poisoning-deep-research-claude_code.md with its

    citations sidecar. The provider was the one requested by the user; no fallback

    was needed.


    Report validation as generated. Reference validation clean: 29/29 references

    resolved, confabulation_rate 0.0, 1/1 quoted claims found in source. Term

    validation NOT clean: needs_review true, with 7 identifiers named as a

    different term. Five of those were HP CURIEs naming unrelated concepts -

    HP:0000508 offered as "photophobia" is Ptosis, HP:0000534 as "corneal

    neovascularization" is Abnormal eyebrow morphology, HP:0000585 as "dry eye" is

    Band keratopathy, HP:0000523 as "blindness" is Subcapsular cataract, and

    HP:0025406 as "blistering" is Asthenia. A sixth, HP:0002204 offered as

    "pulmonary fibrosis", is Pulmonary embolism and was reported only in the

    softer "worth a second look" bucket. None of the report''s CURIEs were used.

    Every identifier in the entry was resolved by live OAK lookup at the moment it

    was written, which is how the correct terms (HP:0000613 Photophobia, HP:0011496

    Corneal neovascularization, HP:0002206 Pulmonary fibrosis) were obtained.


    One further report error found by reading the sources rather than by a

    validator: for PMID:27832694 the report quoted "56.7% of a 30-patient

    sub-cohort showing pulmonary function improvement and 77.8% of an HRCT-assessed

    sub-cohort showing radiographic improvement". The abstract reports neither

    figure - it describes 73 patients (38 asthma, 16 COPD, 19 bronchiolitis

    obliterans) and compares FEV1 decline. The entry uses the abstract''s own text.


    Content. 15 pathophysiology nodes forming a branched chain from agent

    penetration and episulfonium ion formation, through N7-guanine alkylation and

    interstrand crosslinking, PARP1 hyperactivation and NAD+/ATP depletion, and a

    parallel glutathione-depletion arm, into epithelial necrosis; then three organ

    arms (cutaneous vesication and ulceration, corneal and limbal injury into

    delayed mustard gas keratopathy, and the pulmonary arm) plus a melanocyte arm

    and a terminal malignant-transformation node. Four nodes conform to

    fibrotic_response (Inflammatory Recruitment and Amplification, Mesenchymal Cell

    Activation, Excessive ECM Deposition, Architectural Distortion and Organ

    Dysfunction), following the pattern Asbestosis and Paraquat_Poisoning use.

    17 phenotypes, all bound and all connected to a mechanism node by a bare-name

    downstream edge. Two environmental exposures bound to ECTO:9001175, both

    pathograph-linked with environmental_effect TRIGGERS. Six treatments, four

    progression phases, three diagnosis records, three animal models with

    modeled_mechanisms and readouts, two biomarkers, one prevalence record, four

    discussions.


    Deliberate omissions, each recorded in the entry rather than left silent.

    Bone marrow suppression is not curated as a node: no cached source states it

    quotably, and the nearest (PMID:37852927) records a workshop scoping decision

    rather than a finding, so it is a KNOWLEDGE_GAP discussion citing that source

    with supports NO_EVIDENCE. No genetic: records, because the host-susceptibility

    literature is glutathione-pathway polymorphisms as severity modifiers with no

    sulfur-mustard-specific association study identified. No GeneReviews baseline:

    the disease is an acquired toxic exposure with no Mendelian form.


    Two binding compromises recorded in notes:. NCIT:C68769 (Decontamination) is

    not reachable from NCIT:C25218, so the decontamination treatment binds

    NCIT:C49236 (Therapeutic Procedure) with the specificity in preferred_term.

    ECTO has no term under any of the agent''s common or military names;

    ECTO:9001175 "exposure to bis(2-chloroethyl) sulfide" is the systematic-name

    term for the same substance, and ECTO:0070054 "exposure to mustard greens via

    ingestion" is an unrelated dietary term that is not a candidate.


    One self-caught error worth recording because it is the exact failure mode

    CLAUDE.md warns about: NCIT:C17204 was written with the label

    "High-Resolution Computed Tomography" from memory rather than from a lookup.

    The CURIE is Computed Tomography; term validation flagged the mismatch, and a

    search found the real term, NCIT:C20644 High Resolution Computed Tomography.


    Validation. `just validate-disorders` passes. 98/98 evidence snippets verified

    against the local reference cache by `just count-verified-snippets`.

    `just validate-terms` passes. Ten offline gates green: check-duplicate-keys,

    check-entity-refs, check-causal-targets, check-qualifier-terms,

    check-enum-values, check-folded-hyphens, check-snippet-length,

    check-title-snippets, check-snippet-grading, check-environmental-evidence.

    check-snippet-length initially failed on a four-word snippet, which was

    lengthened to the full clause rather than baselined. Graph audit confirms no

    dangling downstream targets, no orphan pathophysiology nodes, and no phenotype

    without an incoming edge. Weighted compliance 87.2%.


    24 references cached and committed, all PMIDs; 16 were recovered from PMC IDs

    in the report via the PMC ID Converter API and cited by PMID in preference to

    DOI.'

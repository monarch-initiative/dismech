  details: |
    Response to the REQUEST_CHANGES review on PR #9719. Added reference_title to all 44 evidence items and a top-level references block. Replaced the case_fractions record sourced to a background sentence in the Xenopus paper with two primary-source records: the discovery cohort (20/35, 57 percent, cohort_size 35, PMID:22541558) and a pooled 84-patient literature series (76 percent, PMID:35331022). Added Congenital cardiac malformation and Ocular involvement phenotypes from PMID:35331022 and PMID:41667381, and added the dedicated Nager review PMID:41667381 as a second source on the two cardinal phenotypes so they no longer rest solely on a frog paper's introduction. Added a second diagnosis item for clinical recognition of the acrofacial pattern. Added frequency to all eight clinical phenotypes. Recorded the genotype-phenotype findings from PMID:35331022 in the SF3B4 notes. Two checks the reviewer asked for are recorded in notes: no GeneReviews chapter exists for Nager syndrome, SF3B4 or acrofacial dysostosis, and Orphanet ORPHA:245 could not be consumed because Orphadata has replaced the snapshot pinned in data/orphadata/MANIFEST.yaml, so the cache cannot be rebuilt reproducibly without bumping the manifest and regenerating all 8823 ORPHA files. Validated: 52/52 snippets verified.

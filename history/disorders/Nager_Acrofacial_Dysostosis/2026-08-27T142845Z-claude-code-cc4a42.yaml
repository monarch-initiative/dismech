  summary: 'Create: Nager Acrofacial Dysostosis'
  details: |
    New entry created from stubs/Nager_Acrofacial_Dysostosis.yaml (deleted in the same change) to host the Xenopus tropicalis sf3b4 CRISPR model from Disease Models and Mechanisms (PMID:40126363). Pathophysiology runs SF3B4 haploinsufficiency to aberrant pre-mRNA splicing and exon skipping to cranial neural crest migration failure and apoptosis to first and second branchial arch skeletal hypoplasia. The animal model carries three mechanism links, including a PARTIALLY_RECAPITULATES link whose UNCHANGED readout records that heterozygous frogs form normal craniofacial cartilage. Two discussions: a HUMAN_MODEL_MISMATCH on the species difference in SF3B4 dose sensitivity (human dominant haploinsufficiency versus frog recessive), and a KNOWLEDGE_GAP on why a ubiquitous spliceosome component fails in one lineage. Roughly 40 percent of cases have no identified cause, which the entry states rather than implies. Validated: schema and terms pass, 44/44 snippets verified.

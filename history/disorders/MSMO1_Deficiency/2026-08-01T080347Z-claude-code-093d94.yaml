  details: |
    Created kb/disorders/MSMO1_Deficiency.yaml for MSMO1 deficiency (microcephaly-congenital cataract-psoriasiform dermatitis syndrome, MONDO:0014793, OMIM:616834, MSMO1/hgnc:10545). Preflight confirmed the MONDO RO:0004003 relation resolves to HGNC:10545 MSMO1. Deep research ran via 'just research-disorder claude_code MSMO1_Deficiency' (claude_code provider, 18 min, 11 web searches, 28 citations; report at research/MSMO1_Deficiency-deep-research-claude_code.md) and was read in full before the entry was rewritten from it. No GeneReviews chapter exists for this disorder: three PubMed searches returned zero records, documented in the entry notes. Curated a single-root connected pathophysiology DAG of 11 nodes (MSMO1 Deficiency -> C4-methylsterol accumulation and impaired distal cholesterol biosynthesis, then LXR ligand signaling, EGFR/vesicular trafficking, epidermal and hematopoietic overproliferation, fibroblast IL-6, immunocyte dysregulation, lens membrane lipid alteration, chondrocyte hypertrophy, neurodevelopment and growth), 20 HPO-bound phenotypes including the disease-defining lab terms HP:6000753 and HP:6000754, histopathology, a plasma C4-methylsterol biochemical readout, genetic section with the reported missense allele spectrum, two diagnosis entries, two zebrafish animal models, an EMERGING PSORS9 mechanistic hypothesis, two discussions (HUMAN_MODEL_MISMATCH for the absent mouse model, KNOWLEDGE_GAP for the absent natural history), four treatments including negative evidence that conventional antipsoriatic therapy fails, and two NEC-focused differential diagnoses (Smith-Lemli-Opitz, CHILD syndrome). Named-entity-confusion discipline applied throughout: every citation checked for the enzyme the reported cohort actually has variants in; family-wide reviews cited only for SC4MOL/MSMO1-specific sentences; the SC4MOL/NSDHL cancer-cell EGFR paper marked PARTIAL; all three cholesterol-plus-statin treatment citations are MSMO1-genotyped patients rather than CHILD syndrome. Frequency bands deliberately omitted everywhere because published denominators are fewer than ten patients and conflict. No ORPHA/CGGV/CGDS structured-source citation: neither record is in references_cache and generating one needs a MANIFEST bump blocked by #7622; noted in the entry. Validation: just validate clean (schema, terms, references), 137/137 snippets verified verbatim by scripts/check_snippets_verbatim.py, check_folded_hyphens.py clean, compliance 97.4 percent weighted.

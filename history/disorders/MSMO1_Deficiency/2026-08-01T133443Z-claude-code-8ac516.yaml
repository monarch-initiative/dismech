  details: |
    Blocking review items on PR #7633.

    (1) Failure to thrive: the truncated snippet from PMID:21285510 stopped immediately before the words carrying the claim. Extended to the complete sentence in both locations (the Growth Restriction causal edge and the Failure to thrive phenotype) and rewrote both explanations so the snippet itself carries the assertion.

    (2) differential_diagnoses expanded from two to five post-squalene cholesterol-biosynthesis disorders. Added CK syndrome (MONDO:0010441, NSDHL, methyl sterols; PMID:21129721), lathosterolosis (MONDO:0011816, SC5D, lathosterol; PMID:24142275 plus the cached PMID:21695019 cutaneous review) and desmosterolosis (MONDO:0011217, DHCR24, desmosterol; PMID:11519011 plus PMID:21695019). Each carries the deficient enzyme and the accumulating sterol as its discriminator rather than a phenotype list. CHILD syndrome gained the PMID:21129721 allelism snippet and an explicit CHILD-versus-CK discriminator, since both are NSDHL disorders accumulating methyl sterols and can only be separated clinically. New notes item (8) records the scope of the block and the grep-verified rationale for leaving CDPX2/EBP, HEM-Greenberg/LBR and Antley-Bixler/POR unmodelled.

    Non-blocking suggestions also applied: HP:0002715 (root-level) replaced by HP:0010978 Abnormality of immune system physiology; CHEBI:1949 preferred_term realigned to the term label so an instance is no longer labelled as a class; Ichthyosis preferred_term aligned to HP:0008064; PMID:24144731 granulocyte/B-cell immunophenotyping reclassified IN_VITRO -> HUMAN_CLINICAL to match the analogous PMID:21285510 item; notes renumbered into sequence.

    Deliberately not done: HP:0010442 Polydactyly was left as-is rather than narrowed to HP:0100259 Postaxial polydactyly, because grepping references_cache for 'postaxial'/'preaxial' across PMID:37195326, PMID:41413001 and PMID:24144731 returns no hits and no cached source supports the laterality. Structured-source citations (ORPHA/ClinGen) remain skipped under the stale MANIFEST pins tracked in #7622.

    Validation after the change: just validate clean, 152/152 snippets verbatim (scripts/check_snippets_verbatim.py), folded-hyphen check clean, compliance 100% on all differential_diagnoses paths.

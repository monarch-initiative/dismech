  details: |
    series-064 genetics pass. Bound both checklist classes: MONDO:0014808 (CSD8, SLC9A3) on the classic row and MONDO:0010036 (CSD3, SPINT2) on the syndromic row, and deleted stubs/Congenital_Secretory_Sodium_Diarrhea_3.yaml. Added a new upstream node for the SPINT2 arm, Loss of HAI-2 Protease Inhibition and Uncontrolled Prostasin Proteolysis, which the entry previously said it was not modelling: it carries the measured prostasin-inhibition defect from two papers, an edge to the shared NHE3 node typed INDIRECT_UNKNOWN_INTERMEDIATES because the route is the authors' stated hypothesis, and four edges to the extraintestinal malformations that had no upstream at all. Gene wiring 1/3 to 3/3 and phenotype inlink 0/7 to 7/7. Self-review caught three of my own citation errors before push: a reference_title I had composed rather than copied from the cache, and the acidosis, hyponatremia and diarrhea quotes attributed to the wrong one of the entry's two founding papers. Entry notes now flag MONDO:0034204 as a possible duplicate of MONDO:0010036 for a human to put to MONDO.

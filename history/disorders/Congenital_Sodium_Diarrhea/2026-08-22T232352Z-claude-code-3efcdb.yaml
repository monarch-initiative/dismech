  summary: 'Create: Congenital Sodium Diarrhea'
  details: |
    New entry completing the electrolyte-transport-related class of the congenital diarrheas and enteropathies, and the second conformer that made the electrolyte_transport_related_diarrhea module worth creating.

    MONDO:0015170. Unlike the other new gut entries this MONDO term carries no causal gene (RO:0004003) because the disease is genetically heterogeneous, so the gene check was done per subtype against the primary literature instead.

    Three genetic forms curated as subtypes, chosen because the sources treat them as forms of one disease rather than separate entities: classic non-syndromic (recessive SLC9A3/NHE3 loss of function), syndromic (recessive SPINT2 loss of function, with choanal/anal atresia, hypertelorism and corneal erosions), and the GUCY2C-activating form (dominant gain of function).

    The mechanistically interesting point, and the reason this is one node rather than two: NHE3 is a downstream target of guanylate cyclase C, so loss-of-function of the exchanger and gain-of-function of its upstream inhibitor converge on the same failed step. That convergence is stated directly in PMID:26358773 and is cited as such.

    Five-node chain: loss of NHE3 activity or constitutive GC-C activation (trigger) -> failure of net intestinal sodium absorption (central_effector) -> luminal sodium retention with obligated water loss, and in parallel systemic sodium depletion with metabolic acidosis (two effectors) -> electrolyte crisis, growth failure and later enteral adaptation (consequence).

    Curation caution recorded in the entry notes: PMID:11113072 concluded that CSD is unrelated to the known sodium/proton exchanger genes and specifically excluded NHE3. That negative conclusion was overturned in 2015 by PMID:26358773. The 2000 paper is cited only for inheritance, phenotype and biochemistry, and the notes plus the relevant evidence explanation both warn against citing it for the NHE3-exclusion claim.

    A drafting error was caught and fixed: two ideographic (full-width) space characters were typed at the start of one `explanation:` line, which YAML accepted without error while silently dropping the field. Verified fixed by re-parsing and asserting the key is present.

    Validation: linkml-validate clean (after moving a `subtype:` qualifier out of an Inheritance block, which does not accept that slot, into its description); linkml-term-validator clean; 27/27 snippets verified against cached abstracts.

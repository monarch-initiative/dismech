         (`IN_VITRO`), the full R90W human sentence (`HUMAN_CLINICAL`), and the
         CrxR90W/W-phenocopies-Crx-/- mouse sentence (`MODEL_ORGANISM`).
       - `pathophysiology[4]`: now quotes the E80A promiscuous-binding biochemical
         sentence (`IN_VITRO`), the K88N Spec-seq specificity-change sentence
         (`IN_VITRO`), and the K88N/+ functional-antagonism mouse sentence
         (`MODEL_ORGANISM`).

    7. **MINOR — truncated macular-atrophy snippet (finding 7): FIXED.** Extended
       to the full sentence ("Many patients have central retinal degeneration; in
       some patients, we have observed an additional focus of degeneration in the
       nasal retina.").

    8. **MINOR — six uncited phenotypes (finding 8): SKIPPED (partially, with

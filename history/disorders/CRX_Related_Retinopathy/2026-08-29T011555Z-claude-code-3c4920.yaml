    ## Findings fixed

    1. **MAJOR — split-line fragment snippets (finding 1): FIXED.** All ~17
       PDF-line fragments replaced with complete propositional sentences from the
       same cache files, and each subject-fragment/predicate-fragment pair collapsed
       into a single evidence item:
       - `has_subtypes[0]` (LCA7): 6 items -> 3 (full E168d2, K88N, R90W
         genotype-phenotype sentences).
       - `has_subtypes[1]` (CORD2): 3 items -> 2 (full E80A sentence; the
         grandfathered 4-word `"mild late-onset dominant CoRD"` replaced by the full
         R90W sentence).
       - `has_subtypes[2]` and `has_subtypes[3]`: both PMID:41595470 fragments
         extended to the full phenotype-spectrum sentence (`has_subtypes[3]` was not
         in the report's location list but was the second half of the same split
         sentence; fixed for consistency).
       - `inheritance[1]`, `pathophysiology[3]`, `pathophysiology[4]`,
         `phenotypes[1]`, `genetic[0]`: identifier fragments replaced with the
         substantive sentences (details under findings 4-6).
       - Mechanics note: the reference validator strips `[...]` spans from snippets
         before matching, so the four sentences containing bracketed variant
         identifiers (`[NM_000554.6: ...]`) are curated as ellipsis-split two-part
         snippets (`"...variant [NM_...] ... is associated with..."`), an
         established KB pattern; all verify.

    2. **MAJOR — review graded as primary evidence (finding 2): FIXED** per the
       dispatcher's directive (grade each quoted sentence by the evidence type it
       reports, rather than blanket `OTHER`):
       - The "In humans, E168d2 ..." sentence: now `HUMAN_CLINICAL` everywhere
         (was `MODEL_ORGANISM` at `has_subtypes[0].evidence[0]`; the
         `pathophysiology[1]` copy was replaced by the actual mouse sentences,
         graded `MODEL_ORGANISM`).
       - The review's own taxonomic sentence ("In this paradigm, disease variants
         are categorized into four major classes...") at `pathophysiology[0]` and
         `genetic[0]`: regraded `OTHER` with explanations noting it is the authors'
         classification scheme, not a primary result.
       - Mouse-result sentences -> `MODEL_ORGANISM`; biochemical/Spec-seq/reporter
         sentences -> `IN_VITRO`; human genotype-phenotype sentences ->
         `HUMAN_CLINICAL`; the review's NMD mechanistic reasoning -> `OTHER`.

    3. **MAJOR — same sentence, two `evidence_source` values (finding 3): FIXED.**
       Every quoted sentence now carries one grading across all its occurrences
       (R90W sentence x4 `HUMAN_CLINICAL`; paradigm sentence x2 `OTHER`; spectrum
       sentence x2 `HUMAN_CLINICAL`). `check_snippet_grading.py --all` reports zero
       divergences for this file.

    4. **MAJOR — undetectable-ERG phenotype (finding 4): FIXED.** The old item

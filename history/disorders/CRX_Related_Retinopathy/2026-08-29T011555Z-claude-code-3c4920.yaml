       (b) the actual K88N mouse blindness sentence ("...are completely blind at
       1 month...") as `MODEL_ORGANISM`, so the explanation's claim is now in its
       snippet and the human phenotype is no longer supported by model evidence
       alone.

    5. **MAJOR — NMD-escape asserted as fact (finding 5): FIXED.**
       `pathophysiology[1]` description rewritten: NMD escape is now "proposed",
       with the competing long-3'-UTR-triggers-NMD model and the open-question
       status stated; the demonstrated part (allele-specific overexpression,
       elevated mutant-to-WT ratio, dominant-negative outcompetition) is now
       explicitly attributed to the E168d2/+ mouse. Evidence replaced with four
       quoted sentences: the two mouse demonstration sentences (`MODEL_ORGANISM`),
       the NMD-escape inference, and the competing-model sentence (both `OTHER`).

    6. **MINOR — under-quoted pathophysiology[3]/[4] (finding 6): FIXED.**

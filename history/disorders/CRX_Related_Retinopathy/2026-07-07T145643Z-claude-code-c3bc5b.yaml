  summary: 'Create: CRX-Related Retinopathy'
  details: |
    New entry for CRX-Related Retinopathy (MONDO:1040064), part of the issue #4008 retinopathy curation follow-up, medium-priority gene target per the maintainer-approved lumping guidance. Deep research performed via 'just research-disorder falcon CRX_Related_Retinopathy' (Edison/falcon provider, ~24 min run, 32 citations); also independently sourced and verified primary literature directly via PubMed (PMID:38414750, a comprehensive 25-year CRX review categorizing disease variants into 4 biochemically distinct pathogenic classes, used as the primary mechanism source; PMID:39632990 and PMID:41595470, clinical phenotype cohort papers). Falcon's report was cross-checked against my independently-fetched primary sources per the anti-hallucination SOP -- it corroborated the same 4-class variant mechanism using the same primary source, but several additional falcon-cited facts (specific de novo mutation rate, two additional nonsense variants, OMIM identifiers) could not be verified as exact substrings of my cached full-text copy of the cited paper and were deliberately NOT included, to avoid citing unverified/potentially mismatched claims. Modeled has_subtypes as LCA7, CORD2, CRX-Associated Maculopathy, and adRP per the literature's own phenotype categorization (a 2026 case series explicitly separates maculopathy as a 4th branch, beyond the 3-way LCA/CORD/RP split in the issue's original guidance). Modeled both autosomal dominant (majority) and autosomal recessive (rare, biallelic hypomorphic p.Arg90Trp) inheritance, including the unusual zygosity-dependent phenotype divergence (heterozygous R90W -> mild dominant CORD; homozygous R90W -> recessive LCA) for the same allele. Pathophysiology models the 4 distinct pathogenic variant classes (C-terminal truncating/dominant-negative, C-terminal elongating, homeodomain DNA-binding-affinity-reducing/hypomorphic, homeodomain DNA-binding-specificity-altering/antimorphic) plus verified CRX-NRL synergistic transactivation of the rhodopsin promoter. No GeneReviews chapter specific to CRX exists (only a general nonsyndromic-LCA-overview chapter, PMID:30285347, not gene-specific, so not used as a mandatory baseline). Validated: schema, ontology terms, and reference snippets all pass cleanly. Compliance report: 87.1% global / 88.1% weighted on first pass.

    # Review: CRX-Related Retinopathy

    - **File:** `/home/user/dismech/kb/disorders/CRX_Related_Retinopathy.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `dismech.reference_snippet_audit` — **27/27 snippets verified** against
      cached references. No unverified snippets: every quoted string is an exact substring of its
      cache file.
    - **Reviewer note:** report-only; no KB, cache, or history files were modified.

    ## Verdict: NEEDS_FOLLOWUP

    Nothing in this entry is *fabricated* — the underlying biology is accurately drawn from
    Zheng & Chen's CRX review, and I could locate a supporting passage in the cached source for
    essentially every substantive claim. The problem is that the evidence layer does not do the
    work it appears to do. Most snippets are single **lines** clipped out of PDF-extracted text
    rather than sentences, so the subject and its predicate end up in *different* evidence items
    and neither half asserts anything on its own; the load-bearing sentences that actually
    establish each mechanism sit unquoted a line or two away in the same cache file. On top of
    that, one review is graded as three different primary-evidence types across 23 items, the
    same quote carries two different `evidence_source` values in one file, and one phenotype's
    `explanation` states a mouse result that is nowhere in its own snippet.

    ## Findings

    ### 1. MAJOR — snippets are split-line fragments, not propositions; subject and predicate are curated as separate evidence items

    - **Location:** `has_subtypes[0]` evidence 0-5, `has_subtypes[1]` evidence 0-2,
      `has_subtypes[2]` evidence 0, `inheritance[1]` evidence 0, `pathophysiology[1]` evidence 0,
      `pathophysiology[3]` evidence 0, `pathophysiology[4]` evidence 0-1, `phenotypes[1]`
      evidence 0, `phenotypes[4]` evidence 0, `genetic[0]` evidence 0-1 — ~17 of 27 items, all
      `PMID:38414750` except `phenotypes[4]` (`PMID:39632990`).
    - **What the entry does:** quotes the first half of a sentence as one evidence item and the
      second half as a separate evidence item on the same block. For example, `has_subtypes[0]`
      carries `"K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no"` as one item and `"is associated
      with severe dominant LCA in humans"` as the next. Likewise `"R90W variant [NM_000554.6:
      c.268C > T (p.Arg90Trp),"` + `"is associated with recessive LCA and"`, and `"In humans,
      E168d2 [NM_000554.6: c.503_504del (p.Glu168fs),"` + `"is associated with dominant LCA
      (Freund"`.
    - **What the paper actually says** (single sentences, split by PDF line wrapping in the
      cache): "K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no ClinVar entry] is associated with
      severe dominant LCA in humans (Nichols et al., 2010)."; "R90W variant [NM_000554.6: c.268C
      > T (p.Arg90Trp), ClinVar VCV000007422] is associated with recessive LCA and mild late-onset
      dominant CoRD (Swaroop et al., 1999; …)."; "In humans, E168d2 […] is associated with
      dominant LCA (Freund et al., 1998; Jacobson et al., 1998)."
    - **Why it matters:** a snippet is supposed to be the exact source text that substantively
      supports the specific claim. Half of these fragments name a variant and assert nothing; the
      other half are dangling predicates with no subject (`"is associated with severe dominant LCA
      in humans"` — *what* is?), and several end mid-token (`", no"`, `"(Freund"`,
      `"is associated with severe early-onset dominant"`). None is independently checkable, and a
      reader or exporter cannot tell which allele a bare predicate refers to. `"mild late-onset
      dominant CoRD"` (`has_subtypes[1].evidence[2]`) is already flagged by
      `scripts/check_snippet_length.py --all` as a 4-word snippet (it passes only because it is
      grandfathered in the committed baseline). The fix is mechanical and needs no new literature:
      re-quote each claim as the whole sentence, which is present verbatim in
      `references_cache/PMID_38414750.md`, and collapse each fragment pair into one evidence item.

    ### 2. MAJOR — PMID:38414750 is a review, but is graded `HUMAN_CLINICAL` / `MODEL_ORGANISM` / `IN_VITRO` across 23 evidence items, including one grading that inverts the sentence's own meaning

    - **Location:** every `PMID:38414750` evidence item (23 of the file's 27).
    - **What the source is:** according to PubMed, PMID:38414750 (Zheng & Chen, *Front Cell
      Neurosci* 2024, "Transcriptional precision in photoreceptor development and diseases —
      Lessons from 25 years of CRX research", [DOI](https://doi.org/10.3389/fncel.2024.1347436))
      has `article_types: ["Journal Article", "Review"]`. Its own abstract calls it "this review".
      The cache file carries no `publication_types` block.
    - **Entry claims:** the file assigns this one review `HUMAN_CLINICAL` (15 items),
      `MODEL_ORGANISM` (7 items) and `IN_VITRO` (1 item), with no item graded `OTHER`.
    - **The clearest inversion:** `has_subtypes[0].evidence[0]` and `pathophysiology[1].evidence[0]`
      quote `"In humans, E168d2 [NM_000554.6: c.503_504del (p.Glu168fs),"` — the opening of a
      **human** genotype-phenotype sentence — and grade it `MODEL_ORGANISM`, with an
      `explanation` about the CrxE168d2 knock-in mouse. The quoted words say "In humans"; the
      grading says animal model. Symmetrically, `pathophysiology[0].evidence[0]` and
      `genetic[0].evidence[0]` grade the review's own taxonomic sentence ("In this paradigm,
      disease variants are categorized into four major classes based on their locations in CRX
      functional domains…") as `HUMAN_CLINICAL`, though it reports no patients.
    - **Why it matters:** `evidence_source` classifies the cited publication's evidence type. A
      review summarising other people's mouse and biochemical work is `OTHER` under this repo's
      own convention (see, for contrast, `OPTN-related_Open_Angle_Glaucoma.yaml`, which tags every
      cited review `OTHER` and says so in the `explanation`). As curated, a consumer filtering
      this file for human clinical evidence gets 15 review sentences, and for model-organism
      evidence gets a sentence that begins "In humans".

    ### 3. MAJOR — the same quoted sentence carries two different `evidence_source` values in this file

    - **Location:** `has_subtypes[0].evidence[2]` (`HUMAN_CLINICAL`),
      `pathophysiology[4].evidence[1]` (`HUMAN_CLINICAL`), and `phenotypes[1].evidence[0]`
      (`MODEL_ORGANISM`) — all quoting `"K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no"`.
    - **Confirmed by tooling:** `uv run python scripts/check_snippet_grading.py --all` reports
      exactly this divergence twice for `kb/disorders/CRX_Related_Retinopathy.yaml`.
    - **Why it matters:** this is the #8184 defect verbatim — `evidence_source` describes the cited
      publication, so it cannot change because the quote was pasted into a different block. The
      file currently says both things about one sentence.

    ### 4. MAJOR — `phenotypes[1]` (undetectable ERG): the `explanation` states a result that is not in its snippet, and a human phenotype is supported only by mouse evidence

    - **Location:** `phenotypes[1] Undetectable electroretinogram` (`subtype: LCA7`), evidence
      `PMID:38414750`, `evidence_source: MODEL_ORGANISM`.
    - **Entry claims:** `explanation`: "K88N knock-in mice are completely blind by one month,
      modeling the non-recordable ERG seen in severe dominant LCA."
    - **What the snippet contains:** `"K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no"` — a
      variant identifier. Nothing about mice, blindness, or ERG. The sentence that would support
      the explanation is in the same cache file and unquoted: "the K88N/+ and K88N/N mice show
      more severely disturbed retinal morphology than Crx KO or R90W/W and are **completely blind
      at 1 month**."
    - **Why it matters:** two problems compound. (a) The `explanation` asserts something the
      evidence item does not contain, which is the failure mode snippet verification exists to
      catch — and it passes the mechanical audit because the fragment *is* a real substring. (b)
      A non-recordable ERG in human LCA7 patients is then supported, in this entry, only by
      `MODEL_ORGANISM` evidence, against the repo rule that model-organism evidence should not be
      the sole support for a human phenotype. A human source is available: the cohort study
      `PMID:39632990`, already cited in this file, reports "Pattern and full-field ERGs indicated
      macular dysfunction in all 6 cases, with generalised cone (n = 2) or cone and rod (n = 4)
      system involvement".

    ### 5. MAJOR — `pathophysiology[1]` asserts NMD escape as established fact, where the cited review explicitly leaves it open; and none of the node's substantive claims are quoted

    - **Location:** `pathophysiology[1] C-Terminal Truncation and Dominant-Negative
      Overexpression` — `description` plus its single evidence item.
    - **Entry claims:** "These truncating transcripts **escape nonsense-mediated decay** and are
      allele-specifically overexpressed, so the truncated protein accumulates at
      higher-than-wild-type levels and outcompetes wild-type CRX…"
    - **What the paper says:** "allelic truncating mutations in the CRX transcription effector
      domain **likely** produce mutant mRNA that escapes NMD. Such an 'escape from NMD
      surveillance' mechanism has been **proposed**… **Yet, other models suggest that the long
      3'-UTRs created by PTCs can trigger NMD** by promoting the binding of a central regulator of
      NMD." The review closes the paragraph by calling this an open question: "elucidation of the
      molecular mechanisms of CRX effector domain truncating mutations will advance our
      understanding…".
    - **Additionally:** the node's only evidence is the E168d2 identifier fragment. The sentences
      that would actually support the dominant-negative claim are unquoted and adjacent:
      "Molecular studies in the E168d2/+ mouse retinas reveal an allelic-specific overexpression
      of the mutant transcripts and accumulation of the non-functional, truncated proteins,
      resulting in a significantly elevated mutant-to-WT ratio" and "can thus be explained by a
      dominant-negative mechanism where the significantly higher concentrations of the mutant
      proteins outcompete WT proteins in binding to CRX cognate sites".
    - **Why it matters:** a hypothesis the source deliberately presents as contested is stated in
      the KB as mechanism, and the demonstration that *is* solid (mouse allele-specific
      overexpression) is asserted without species attribution and without being quoted. Both are
      fixable from the same cache page: quote the two mouse sentences, and hedge the NMD clause.

    ### 6. MINOR — the same under-quoting pattern weakens `pathophysiology[3]` and `pathophysiology[4]`

    - `pathophysiology[3] Homeodomain DNA-Binding Affinity Reduction` claims reduced binding
      affinity and poor promoter activation; its only evidence is the R90W identifier fragment,
      while the supporting sentence sits unquoted: "Biochemical assays found that R90W HD has
      significantly reduced DNA binding affinity and activates photoreceptor gene promoters
      poorly (Chen et al., 2002)."
    - `pathophysiology[4] Homeodomain DNA-Binding Specificity Alteration` claims promiscuous
      non-cognate binding and antagonism of wild-type CRX; its two evidence items are the E80A and
      K88N identifier fragments, while "CRX E80A protein binds more promiscuously to
      non-consensus/sub-optimal CRX motifs and drives a higher level of gene expression",
      "Spec-seq, reveals that K88N mutation changes CRX preferred sequence from TAATCC to
      TAATT[A/T]" and "the ectopic CRX K88N activity functionally antagonizes CRX WT's actions"
      are all present and unquoted.
    - **Why it matters:** the node descriptions are accurate; they are simply not the thing the
      attached evidence says. Graded MINOR only because the correct quotes are in the same cached
      page and the claims are true.

    ### 7. MINOR — `phenotypes[4]` snippet is truncated immediately before the word that carries the claim

    - **Location:** `phenotypes[4] Macular atrophy`, `PMID:39632990`, snippet `"Many patients have
      central retinal"`.
    - **What the paper says:** "Many patients have central retinal **degeneration**; in some
      patients, we have observed an additional focus of degeneration in the nasal retina."
    - **Why it matters:** as quoted, the snippet stops one word short of asserting anything. Same
      fix as finding 1.

    ### 8. MINOR — six of nine phenotypes carry no evidence at all

    - **Location:** `phenotypes` — Nystagmus, Photophobia, Color vision defect, Nyctalopia,
      Central scotoma, Progressive visual loss have `phenotype_term` and `subtype` but no
      `evidence:` block.
    - **Why it matters:** `evidence` is optional on the class, so this is not a validation
      failure, and the assignments are clinically unremarkable. But two patient cohort papers are
      already cached (`PMID:39632990`, n=60 UK; `PMID:41595470`, n=15 US) and would ground the
      subtype-level phenotype assignments with human data, which is what this entry is thinnest on.

    ### 9. MINOR — the headline finding of both cited clinical cohorts is not curated

    - Both `PMID:39632990` and `PMID:41595470` are cited only for one-line background statements
      (that CRX disease is dominant, and that the phenotype spectrum includes maculopathy). Their
      actual result — a distinctive **nasal / bifocal retinal degeneration** pattern, "12% in our
      cohort" (6 of 50 imaged UK patients) and "8 of 15 patients (53.3%)" at Bascom Palmer, with
      the UK paper noting it is "not typically seen in other forms of inherited retinal disease" —
      appears nowhere in the entry. `PMID:41595470` is cited, for the existence of maculopathy, by
      a paper whose title is *"Nasal Retinal Degeneration Is a Feature of a Subset of
      CRX-Associated Retinopathies"*.
    - **Why it matters:** coverage gap rather than an error, but it is a discriminating,
      well-evidenced human phenotype that the entry already has the references for.

    ## Non-findings (checked and cleared)

    - **No fabricated snippets.** All 27 verify as exact substrings, and I located a supporting
      passage in `references_cache/PMID_38414750.md` for every mechanistic claim in the
      pathophysiology chain.
    - **Named-entity check passes.** Right gene (CRX / `hgnc:2383`), right disease family, right
      variant-to-phenotype pairings throughout: E168d2/p.Glu168fs → dominant LCA; K88N → severe
      dominant LCA; E80A → severe early-onset dominant CoRD; R90W → recessive LCA when biallelic
      and mild late-onset dominant CoRD when heterozygous. The zygosity-dependent R90W divergence
      described in `inheritance[1]` is exactly what the source states.
    - **Three evidence items are properly done** and can serve as the pattern for repairing the
      rest: `inheritance[0]` (full sentence from the UK cohort, correctly `HUMAN_CLINICAL`);
      `pathophysiology[2]` (three substantive clause-level quotes on the CrxRip elongating-frameshift
      mechanism); `pathophysiology[5]`/`pathophysiology[6]` ("Genetic ablation of Crx in mice
      (Crx-/-) does not affect the genesis of photoreceptors but prevents their terminal
      differentiation and leads to rapid degeneration of the immature photoreceptor cells", correctly
      `MODEL_ORGANISM`).
    - **`check_title_snippets`:** no hits — no snippet is a paper title used as a finding.
    - **`check_snippet_length --against-ref origin/main`:** no *new* short snippets; the one
      4-word snippet is in the committed baseline.
    - **`conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"`** — module and node
      name resolve; not otherwise assessed here.

    ## Coverage

    - **Evidence items in file:** 27 (every evidence item carries a snippet).
    - **Examined:** 27/27 — each read against its cached reference.
    - **References cited:** `PMID:38414750` × 23, `PMID:39632990` × 2, `PMID:41595470` × 2.
      **All three are present in `references_cache/`; none missing.**
    - **Concentration risk:** 23 of 27 evidence items come from a single review article. Every
      mechanistic node in the entry rests on that one secondary source, with no primary paper
      (Tran & Chen 2014, Zheng et al. 2023, Chen et al. 2002, Nichols et al. 2010) cited directly,
      even though the review names them all.
    - **Cache note (not a defect in this entry):** `references_cache/PMID_38414750.md` has no
      `publication_types:` front matter, which is plausibly how a review came to be graded as
      primary evidence 20 times. The file is a PDF-derived cache in which sentences wrap
      mid-clause, which is likewise the mechanism behind finding 1.

    ## Sections reviewed

    `description`, `disease_term`, `synonyms`, `parents`, `has_subtypes` (4, incl. all evidence),
    `inheritance` (2), `pathophysiology` (7 nodes + `downstream` edges), `phenotypes` (9, incl.
    `reports_on`), `genetic` (1), `treatments` (2), `references`. Sections absent from the entry
    (and so not reviewable): `prevalence`, `progression`, `diagnosis`, `differential_diagnoses`,
    `animal_models`, `experimental_models`, `datasets`, `clinical_trials`, `biochemical`,
    `environmental`, `discussions`, `mechanistic_hypotheses`.

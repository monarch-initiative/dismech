  summary: 'Fix: Rename Alcohol Consumption to Ethanol Exposure (ECTO:9000027 retained)'
  details: |
    Renamed the 'Alcohol Consumption' environmental entry to 'Ethanol Exposure', retaining
    its ECTO:9000027 (exposure to ethanol) binding, as part of resolving the duplicate-name
    CURIE conflict in issue #8469.

    The curated mechanism is chemical on two counts -- ethanol acting as a solvent that
    enhances carcinogen penetration, and as the source of acetaldehyde, a DNA-damaging agent
    -- so the chemical term (ECTO:9000027, which involves CHEBI ethanol) is correct and the name was brought into line with it.
    Binding rationale recorded in the entry's notes slot.

    Note the entry's evidence item (PMID:39244563, a Mendelian randomization study) speaks of
    'alcohol' at the exposure level rather than ethanol chemistry; it is retained unchanged
    and still supports the risk association, while the solvent/acetaldehyde mechanism remains
    description-level and uncited, as it was before this change.

    No CURIE change, and no evidence items were added, removed, or re-quoted.

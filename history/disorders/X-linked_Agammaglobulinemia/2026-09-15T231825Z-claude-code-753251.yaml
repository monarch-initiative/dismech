  details: |
    Added conforms_to on 'Panhypogammaglobulinemia from Absent Plasma Cells', the clean parallel to Autosomal_Agammaglobulinemia's existing conformance at the same module node: BTK loss arrests B-cell development at the pre-B stage, so the germinal center reaction never starts because no B cell reaches the follicle, the same shape the module's notes already describe for the autosomal form. Mirrored Autosomal_Agammaglobulinemia's node structure exactly: added modifier DECREASED to the existing Immunoglobulin Production process and a second Humoral Immune Response process (GO:0006959, modifier DECREASED), reusing the identical GO id/label pair already cached from that entry.

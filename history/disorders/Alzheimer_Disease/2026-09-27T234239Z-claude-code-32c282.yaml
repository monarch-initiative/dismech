  summary: 'Review round 1 on PR 13049: evidence and term fixes for N-glycan node'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 13049. (1) The DECREASED O-GlcNAcylation and hyaluronan annotations on 'Brain N-Glycan Hyperglycosylation' were supported only by a sentence saying UDP-GlcNAc use is 'not globally upregulated'; added the paper's direct statement of a mild decrease (PMID:42265388) and noted 'mild' in the node description. (2) Rebound O-GlcNAcylation from GO:0006493 protein O-linked glycosylation to its child GO:7770074 protein O-linked glycosylation via N-acetylglucosamine, found through the OLS hierarchicalDescendants endpoint for GO:0006493 and checked as non-obsolete with ancestry through GO:0006493 to GO:0008150. (3) Bound node locations to UBERON:0000956 cerebral cortex, UBERON:0002421 hippocampal formation and UBERON:0001897 dorsal plus ventral thalamus, each looked up via runoak ols:uberon info. (4) Added the direct null incident-AD result from PMID:37689747 as its own REFUTE/INDIRECT item on the glucosamine environmental entry. Validated with count-verified-snippets (457/457), validate-terms, the offline check-* gates and validate-disorders.

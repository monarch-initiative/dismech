  summary: Curate smORF-encoded microprotein mechanism (micro-MKKS63) from the brain
    microprotein atlas
  details: |
    Curated the Alzheimer-relevant findings of the brain microprotein atlas
    (Miller et al., Nat Aging 2026, PMID:42736449) into this entry. The paper was
    supplied as a PDF; the reference was cached with
    `just fetch-reference PMID:42736449`, which returned full text
    (content_type: full_text_html), so evidence quotes the results rather than
    the abstract.

    What was added:

    - mechanistic_hypotheses: `smorf_microprotein_model` (EMERGING). Small open
      reading frames absent from the reviewed reference proteome are translated
      in human frontal cortex, their microproteins carry their own
      Alzheimer-associated expression changes, and those changes can be decoupled
      from the annotated main ORF at the same locus - so conventional Alzheimer
      proteomics, which quantifies the annotated product, could not have seen
      them.
    - pathophysiology: two atomic nodes. `Micro-MKKS63 Microprotein Depletion`
      (MOLECULAR) records that a 63-amino-acid smORF product, not the annotated
      570-amino-acid MKKS protein, is the locus's predominant translation product
      in dorsolateral prefrontal cortex, and that it falls in symptomatic
      Alzheimer disease. `Microglial Oxidative Phosphorylation Failure`
      (CELLULAR) records the respiratory deficit produced by knocking the smORF
      out. One DIRECT edge joins them.
    - experimental_models: the HMC3 micro-MKKS63 CRISPR-Cas9 knockout lines, as a
      CELL_LINE entry with `modeled_mechanisms` (PERTURBS, fidelity LOW,
      model_scale CELLULAR), four respirometry readouts, and two typed
      `divergences` (POPULATION_MISMATCH, CAUSE_UNREPRESENTED). This is the first
      `experimental_models` block on this entry.
    - datasets: `pride:PXD071500`, the raw mass spectrometry for the HMC3 work.
    - discussions: `mismatch_micro_mkks63_hmc3_versus_human_microglia`
      (HUMAN_MODEL_MISMATCH) and
      `gap_micro_mkks63_causal_role_in_alzheimer_disease` (KNOWLEDGE_GAP, two
      proposed experiments).

    Judgement calls worth recording, because each is a place where more could
    have been claimed than the source supports:

    - `Microglial Oxidative Phosphorylation Failure` is left terminal. Microglial
      bioenergetic failure has obvious candidate consequences already curated in
      this entry - impaired amyloid phagocytosis, a proinflammatory shift feeding
      Neuroinflammation - and the source tests none of them. The edges are
      recorded as the knowledge gap instead of being drawn.
    - No `cell_types` are bound on the depletion node. The measurement is bulk
      postmortem cortex, which cannot say which cell type lost the microprotein;
      the microglial attribution arrives only through the cell-line knockout, and
      binding microglia on the human node would smuggle it into a measurement
      that does not support it. This is the first half of the
      HUMAN_MODEL_MISMATCH.
    - No `conforms_to` against
      `mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress`,
      although the node is plainly the same kind of state. That module node pairs
      decreased oxidative phosphorylation with increased reactive oxygen species
      metabolism, and the reactive-oxygen arm was not measured here; conforming
      on half the node would assert the other half.
    - The reserve-capacity readout is curated although the results text omits it:
      it is the one parameter in the panel where the two knockout lines disagree
      (significant for sgRNA1, not significant for sgRNA2). It carries no
      evidence item, because the discordance is legible only in the figure
      legend's block of per-line test statistics, which asserts nothing in
      sentence form. Leaving the readout out entirely would have made the panel
      look more uniform than it is.
    - The coexpression-network evidence is graded COMPUTATIONAL/INDIRECT, not
      HUMAN_CLINICAL, although its input is human RNA-seq. It is network
      inference with Gene Ontology overrepresentation testing, which CLAUDE.md
      places under COMPUTATIONAL, and a coexpression signature implies a
      functional role only through an inference step.
    - The depletion node binds `hgnc:7108` under a `preferred_term` of
      "MKKS locus (micro-MKKS63 smORF)" rather than a bare "MKKS", and the
      microprotein itself moved to `gene_products`. A bare gene binding was
      technically correct and practically misleading: hgnc:7108 is the only HGNC
      record at the locus and UniProt assigns Q9HB66 to gene MKKS, so it names
      the right place - but the symbol it carries denotes the McKusick-Kaufman
      gene whose 570-amino-acid product this very node reports as undetectable,
      so `genes: MKKS` asserted the thing the node exists to deny. The
      microprotein is left unbound in `gene_products`: that slot binds to the
      NCIT Gene Product hierarchy (NCIT:C26548), which has no term for it, and a
      generic protein term would say less than the name does. UniProt carries it
      only in unreviewed TrEMBL, auto-annotated from a 2000-era submission as
      "McKusick-Kaufman syndrome, isoform CRA_a" and "PNAS-117" - filed as an
      isoform of the canonical protein, which is the annotation error the source
      corrects. `just list-gene-term-mismatches` still resolves the binding
      cleanly (43/43 gene named by the entry, 0 findings), so the disambiguating
      parenthetical does not cost the consistency check.
    - PXD060912 (the outer-mitochondrial-membrane proximity-labeling dataset
      reanalyzed for the localization claim) is deliberately NOT curated as a
      dataset record. It is a lipid-droplet contact-site study with no Alzheimer
      content; it resolves fine, and a relevance triage says it does not belong
      in this entry's datasets block. The reanalysis is cited as evidence on the
      depletion node instead - it is the endogenous localization result, so it
      rather than the overexpression immunofluorescence is what the node quotes.

    On the reference identifier. The first pass of this session cited the paper
    by DOI, having concluded it was not yet in PubMed: the NCBI ID converter
    returns no PMID for this DOI, and a `[Title]`-tagged PubMed search returned
    nothing. Both were wrong tools. A direct `[AID]` query
    (`term=10.1038/s43587-026-01207-x[AID]`) finds PMID:42736449. The curation
    was redone against the PMID, which matters for more than tidiness in two
    ways: `DOI` is in `skip_prefixes` in `conf/reference_validator_config.yaml`,
    so DOI-cited snippets are never checked by linkml-reference-validator,
    whereas the PMID ones now are; and the PMID fetch returned full text where
    the DOI fetch returned `abstract_only`, so every evidence item now quotes a
    primary result instead of a compressed abstract clause. The DOI cache file
    was removed once nothing cited it.

    Validation run: `just validate-disorders` (schema + terms + references),
    `just verify-datasets` (pride:PXD071500 OK), `just check-duplicate-keys`,
    `just check-entity-refs`, `just check-causal-targets`,
    `just check-qualifier-terms`, `just check-enum-values`, and the whole-KB
    snippet gates (`check-folded-hyphens`, `check-snippet-length`,
    `check-title-snippets`, `check-snippet-grading`). All 16 evidence snippets
    were additionally confirmed by hand as exact substrings of
    `references_cache/PMID_42736449.md`, with every `reference_title` compared
    against its `title:` frontmatter.

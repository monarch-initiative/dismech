  summary: Curate five modifiable risk factors as environmental records
  details: |
    Adds five modifiable risk factors to `environmental`: tobacco smoking (ECTO:6000029), ambient fine particulate air pollution (ECTO:8000036), physical inactivity (ECTO:6000004), midlife hypertension and midlife obesity. Four carry an `influences_mechanisms` link onto a node the entry already had, three to Vascular Dysfunction and one to Neuroinflammation; midlife obesity is recorded with `disease_effect` only, because no source was found carrying midlife adiposity to a named mechanism node here, and the Environmental class permits either scope without the other.

    Sources are per-factor rather than a single synthesis. The standing Lancet Commission report (PMID:39096926) caches with no quotable text, as Lancet Commissions carry no PubMed abstract, so it is listed in `references` uncited and every figure comes from a meta-analysis or pooled cohort analysis instead: PMID:43034842 for smoking, PMID:41998752 for air pollution, PMID:41559019 for obesity and physical inactivity, PMID:41655380 for cumulative systolic blood pressure, plus PMID:34941088 (cerebral small vessel disease) and PMID:38657455 (PM2.5 in human microglia) and PMID:36789631 (accelerometer-measured activity and cerebral perfusion) for the mechanism links.

    ECTO reconnaissance, run through OLS4 because this container has no local ECTO build: terms exist for smoking, air pollution, alcohol, sedentary lifestyle and sound. Searches for hearing loss, noise, head injury, traumatic brain injury, trauma, social isolation, loneliness, education, obesity, diabetes, hypertension and vision returned no usable exposure class. The hypertension and obesity rows therefore carry no `exposure_term` and say so in `notes`, naming the query and what it returned; both searches were re-run immediately before committing. The audit confirms the gap is KB-wide, not local: all 16 hypertension-named and all 30 obesity-named environmental records in kb/ are unbound.

    `disease_effect: PREDISPOSES` and `causal_role: RISK_FACTOR` are populated on all five, following the roughly 30 files already using those slots. EnvironmentalCausalRoleEnum carries a schema comment calling itself unratified pending issue 11112 and warning against populating at scale; five rows against the existing ~50 uses is not that, and RISK_FACTOR is the value that issue's own worked example uses, but a reviewer who disagrees can say so cheaply.

    Two snippets failed validation first time and were replaced rather than trimmed. The validator strips a bracketed span from the snippet unless its content matches conf/reference_validator_config.yaml's literal_bracket_patterns, so a numeric confidence interval in square brackets is removed while one containing a percent sign survives; a pre-check calling only normalize_text does not reproduce that and passed both. The Alzheimer-specific smoking estimate was re-quoted from the paper's Results, which uses parentheses, and the biological-definition caveat now bridges one bracket with an ellipsis.

    Checks: validate-disorders passed (580 snippets, 598 titles, 0 issues); count-verified-snippets 577/577; check-environmental-evidence, check-entity-refs, check-causal-targets, check-enum-values, check-name-collisions, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-logical-rules, check-shared-disease-terms, check-gene-activity-grounding, check-block-scalar-comments, check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose and check-snippet-grading all OK.
- type: REVIEW
  outcome: changed
  sections:
  - environmental
  - evidence
  - notes
  summary: 'Review round 1: grade directness per outcome, widen the air-pollution scope'
  details: |
    Both blocking findings were real and were verified against the file and the
    reference cache before acting.

    The first was a false statement the entry made about itself. One evidence
    explanation and the entry-level notes both said the risk estimates were
    graded INDIRECT, where only two of nine disease-level items set
    `directness` at all. The reviewer offered a choice between grading them all
    INDIRECT and rewording the prose; neither is right on its own, because two
    of the snippets report an Alzheimer-specific estimate rather than an
    all-cause dementia one. `directness` is now set by what outcome each quoted
    estimate reports: Alzheimer-specific is DIRECT (the smoking RR 1.40 and the
    PM2.5 per-microgram AD hazard ratio), all-cause dementia or
    neurodegenerative disease at large is INDIRECT, and the one item that is
    not a risk estimate at all, the cohort denominator, is left unassessed as
    the schema intends. Both prose passages now state that rule instead of a
    blanket claim. Recorded: 2 DIRECT, 8 INDIRECT, 1 absent.

    The second was a scope mismatch between a record's name and its binding.
    `Ambient fine particulate air pollution` bound ECTO:8000036 exposure to air
    pollution, and ECTO:7000117 exposure to fine respirable suspended
    particulate matter was available and already cached. Of the reviewer's two
    options the record was widened rather than the binding narrowed: its second
    snippet names PM10 and nitrogen dioxide as well, so narrowing would have
    left that evidence outside the record's scope. The record is now `Ambient
    air pollution`, the description says which pollutants carry the association
    and that ozone does not, and PM2.5 is identified as the component the
    mechanism link rests on. The row name is referenced nowhere else, and the
    name-collision and entity-reference gates confirm the rename broke nothing.

    Two of the three optional suggestions were taken in the same push. The
    hypertension mechanism link moves from DIRECT to
    INDIRECT_KNOWN_INTERMEDIATES, naming arteriolar remodelling and the loss of
    cerebral autoregulation as the omitted steps, which is both more accurate
    and consistent with the other three links. The midlife obesity record gains
    the authors' own midlife-versus-late-life sentence, which was checked
    against the cache before use, and loses a clause about weight loss as a
    prodromal feature that no source in the record supported. The third
    suggestion needed no action: the reviewer accepted causal_role at five uses.

    Checks after the edits: validate-disorders passed (581 snippets, 599
    titles, 0 issues); check-environmental-evidence, check-entity-refs,
    check-causal-targets, check-enum-values, check-name-collisions,
    check-block-scalar-comments and check-snippet-grading all OK;
    environmental-term-audit reports 5 of 7 rows BOUND and none PARTIAL.

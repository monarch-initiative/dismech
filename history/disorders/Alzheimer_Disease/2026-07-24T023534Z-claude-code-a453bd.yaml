  details: |
    Follow-on literature investigation of the zoster-vaccine/dementia question raised in the prior medRxiv review. Surveyed the broader natural-experiment landscape via web search and verified two additional positive studies through the reference pipeline: the Canadian Lancet Neurology RD/quasi-experiment (PMID:41579903; ~2.0 pp absolute reduction over 5.5y, plus MCI and dementia-death reductions) and the recombinant-vs-live vaccine-type natural experiment (Nature Medicine 2024, DOI:10.1038/s41591-024-03201-5; recombinant/Shingrix associated with even lower dementia risk than live vaccine). Added both as SUPPORT evidence to the existing knowledge-gap discussion gap_ad_herpesvirus_zoster_vaccination_dementia_prevention, expanded the rationale to frame the evidence balance (receipt-based/primary-care/death-certificate designs concordantly positive vs the lone eligibility-ITT/hospital-coded null) and the most likely ascertainment/dilution reconciliation, and refreshed the notes. All four cited snippets verified as exact raw substrings of cached abstracts. No mechanistic nodes or ontology terms changed. Schema validation passed.

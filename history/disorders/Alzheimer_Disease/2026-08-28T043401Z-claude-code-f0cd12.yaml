  summary: 'Cell-biology review: add mechanism nodes and hypothesis groups'
  details: |
    Reviewed the entry for cell-biological completeness and currency of mechanistic hypotheses. The entry was strong on hypothesis-level modeling, neuroimmunology and virology but carried no representation of several well-evidenced cellular mechanisms. Added seven mechanistic_hypotheses groups and nine pathophysiology nodes covering complement-dependent microglial synapse elimination, neuronal endosomal-lysosomal acidification failure and the inside-out amyloid model, selective vulnerability of RORB-positive entorhinal excitatory neurons, necroptotic neuronal death, senescent cell accumulation, oligodendrocyte and myelin dysfunction, microglial lipid droplet accumulation, interneuron dysfunction with network hypersynchrony, and tau-induced nucleocytoplasmic transport failure. Conformance declared to the disabled_macroautophagy, cellular_senescence and cns_myelin_failure modules. Added a Seizures phenotype bound to HP:0001250, plus human astrocyte-reactivity and meningeal-lymphatic evidence on existing nodes. Added three discussions recording open questions: senescent cell identity, plaque origin, and the complement versus MFG-E8 mouse-human opsonin mismatch. Fixed two dangling free-text consequences on the PARP1-Mediated Parthanatos node that named no node in the entry. Twenty-seven new references were fetched with just fetch-reference and every snippet verified as an exact substring of its cached source.

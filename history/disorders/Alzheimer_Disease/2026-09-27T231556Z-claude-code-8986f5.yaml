  summary: Add N-glycan hyperglycosylation mechanism and glucosamine exposure from
    PMID:42265388
  details: |
    Curated from Hawkinson et al. 2026, Nat Metab, 'Hyperglycosylation is a metabolic driver of Alzheimer's disease' (PMID:42265388, DOI:10.1038/s42255-026-01538-4), read from the PMC full text. Added: (1) mechanistic hypothesis group n_glycan_hyperglycosylation_model, status EMERGING; (2) pathophysiology node 'Brain N-Glycan Hyperglycosylation' (PROVISIONAL) with GO:0006487 and GO:0006048 INCREASED, GO:0006493 and GO:0030213 DECREASED, CHEBI:59520, PGM3, and a single causal edge to the Memory Loss phenotype supported by the PGM3 knockdown, NGI-1 and glucosamine mouse experiments; no inbound edge from amyloid or tau was curated because the phenotype appears in both 5xFAD and PS19 mice and its trigger is unresolved; (3) environmental entry 'Oral glucosamine supplementation' bound to ECTO:0070168, linked EXACERBATES to the new node; (4) two KNOWLEDGE_GAP discussions, one on glucosamine harm in established AD and one on the direction of N-glycosylation change. Counter-evidence was searched for and curated alongside: Xu et al. 2025 (PMID:41042700) reports site-specific loss of N-glycosylation in AD brain and is recorded as REFUTE/INDIRECT on the hypothesis and node; three UK Biobank cohorts (PMID:36978077, PMID:36514123, PMID:37689747) report glucosamine use associated with lower or unchanged dementia and AD incidence and are recorded as REFUTE/INDIRECT on the environmental entry, with PMID:37158699 cited in its notes; Suttapitugsakul et al. 2022 (PMID:36309312) supports the direction-of-change discussion. Validated with just validate, count-verified-snippets (455/455), validate-terms, check-entity-refs, check-causal-targets, check-environmental-evidence, check-snippet-grading, check-reference-titles and validate-disorders.

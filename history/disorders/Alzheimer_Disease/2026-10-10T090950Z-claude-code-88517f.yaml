  details: |
    Added three diagnosis rows. MoCA: panel LOINC:72133-2, total LOINC:72172-0 with two cut-off schemes, the original validation cut-off of 26 (PMID:15817019, with the false-positive caveat from PMID:28731508) and the Taiwanese AD-versus-controls cut-off 21/22 (PMID:23919950). MMSE: panel LOINC:72107-6, total LOINC:72106-8 with the CDR-mapped staging bands 30 / 26-29 / 21-25 / 11-20 / 0-10 (PMID:16473978) and the Taiwanese 24/25 cut-off (PMID:23919950). CDR: panel LOINC:72088-8 only, because LOINC has no CDR global or sum-of-boxes score code, so no stage bands. Each row carries its LOINC third-party copyright notice verbatim in notes; no instrument items are reproduced. Validated with just validate, loinc-seed-cache, count-verified-snippets, validate-terms and tests/test_loinc_measurement_schema.py.

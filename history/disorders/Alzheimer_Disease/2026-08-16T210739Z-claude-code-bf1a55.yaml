  summary: Wire two existing AD pathophysiology nodes to aging-hallmark modules
  details: |
    Curation-scanner run for issue #5847 ([kgap-scan:scope] Autophagy-Senescence-Inflammasome axis).

    Delivered the one step that both independent assessments (on #5847 and its duplicate #6189) agreed
    needs no module-scope design call: reuse existing modules rather than build a composite ASI module,
    by declaring conformance from Alzheimer disease pathophysiology nodes that already curate the
    relevant biology. Two conforms_to edges added; no new nodes, evidence, ontology terms, or prose.

    - "Autophagy-Lysosomal Dysfunction" -> disabled_macroautophagy#Failure of Cytoplasmic Quality
      Control. The node already carries GO:0006914 autophagy DECREASED plus decreased lysosomal
      degradation and protein catabolism, and its consequences are aggregate accumulation (amyloid,
      tau) - the module's central-effector state. Mirrors the existing precedent in
      Parkinsons_Disease.yaml ("Autophagy-Lysosome Pathway Dysfunction") and
      Amyotrophic_Lateral_Sclerosis.yaml, which already conform to the same node.
    - "Mitochondrial Quality-Control Failure" -> mitochondrial_dysfunction#Impaired Mitophagy and
      Quality Control. The node already carries GO:0000422 autophagy of mitochondrion DECREASED and
      states "failed clearance of damaged mitochondria through mitophagy" with mitochondria-associated
      oxidative and inflammatory stress, matching that amplifier node's definition.

    Deliberately NOT wired this run:
    - "Oxidative Stress" -> mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress. The AD
      node does not assert decreased oxidative phosphorylation (GO:0006119) and explicitly includes a
      non-mitochondrial NADPH-oxidase arm, so it is not a clean match.
    - cellular_senescence: Alzheimer_Disease has no senescence/SASP pathophysiology node, so conformance
      would require net-new curation with fresh primary evidence, not a wiring change.
    - Multiple_Sclerosis and Ischemic_Stroke: contrary to the earlier assessment on #6189, neither entry
      has any autophagy, mitophagy, or senescence pathophysiology node to attach to (MS nodes are
      demyelination / Th1-Th17 / inflammatory-lesion; stroke nodes are occlusion / energy failure /
      excitotoxic-oxidative injury / neurovascular inflammation). Wiring them would be new-node
      curation, not conformance wiring, and was left for a separate run.

    Validation on the changed file: just validate (passed; "Snippets checked: 216/219 verified against
    cached references (3 skipped by prefix)"), just validate-terms (passed), just count-verified-snippets
    (216/219), just check-duplicate-keys (OK), and pytest tests/test_data.py -k "conforms_to or
    duplicate" (2122 passed), which covers test_conforms_to_module_node_references - both new anchors
    resolve to real module nodes.

  summary: Add verified antiviral prevention-vs-treatment evidence (VALAD RCT + meta-analyses)
    from OpenScientist mining
  details: |
    Attempted fresh OpenScientist deep-research runs on the hsv1_reactivation_model hypothesis (twice); both hit the provider's 2h job ceiling and produced no output. Mined the existing OpenScientist report (kb/hypotheses/Alzheimer_Disease/hsv1_reactivation_model/openscientist.md) instead. Added three independently verified evidence items to the existing antiviral-suppression knowledge-gap discussion: VALAD phase II RCT (PMID:41405855, JAMA 2026; valacyclovir no benefit/possible harm in early symptomatic AD, ADAS-Cog +3.93 P=.01) as REFUTE for the treatment corollary; anti-herpetic meta-analysis (PMID:41467972; HSV+VZV, aHR 0.77) and TriNetX antiviral cohort (PMID:41779765; RR 0.87 AD / 0.83 dementia) as SUPPORT for the prevention corollary. This mirrors the zoster-vaccine prevention-vs-treatment split. Per the DR anti-hallucination SOP, every PMID and snippet was verified against the fetched abstract; one DR-reported number was caught misattributed (report cited OR=1.46 for PMID:40934136 whose real abstract reports OR=1.32/20%) and was not used. No mechanistic nodes or ontology terms changed. Schema validation passed.

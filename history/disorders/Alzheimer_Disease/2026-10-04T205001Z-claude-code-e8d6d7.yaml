  summary: Evidence-claim mismatch review (#12828)
  details: |-
      Reviewed the 38 distinct evidence items that the Jev evidence-claim-match
      assessment (dismech-evals, observed 2026-10-03) rated MISMATCH at the whole-claim
      level, matching each to the current file by reference and snippet because
      list indices had shifted since the snapshot.

      Removed nine evidence items whose snippet does not bear on the claim and
      where the claim keeps other direct support:
      - Global prevalence: PMID:31072403 says AD is the most common dementia; it gives
        no rate (GBD PMID:34998485 remains).
      - Synaptic Dysfunction: PMID:27163751 (review scope sentence) and PMID:9024330
        (plaque and tangle composition).
      - Oxidative Stress: PMID:9024330 ("the specific process ... remains obscure").
      - Vascular Dysfunction: PMID:16443487 (amyloid and neuronal death, nothing vascular).
      - Cerebrospinal Fluid Analysis: PMID:37924152 (plasma, not CSF, markers) and
        PMID:32929646 (Mendelian randomization null on causal effect, not diagnostic use).
      - Supportive Care: PMID:27651009 (cholinesterase inhibitors and memantine).
      - Selective Vulnerability of RORB+ neurons: the PMID:33432193 astrocyte
        sentence; the same paper's RORB sentence remains.

      Replaced snippets with sentences from the same abstract that state the claim:
      PSEN1 (PMID:36641620, PMID:35430993 now quote the PSEN1 variant rather than the
      EOAD fraction); Cognitive Therapy (PMID:37428401 now quotes the CT/CR findings
      rather than a sentence about healthy individuals); MEG3 ischemia item
      (PMID:29238035) extended to include the apoptotic-death sentence its
      explanation relies on.

      Corrected direction where the explanation argued against the label:
      - Anticholinergic exposure, PMID:42250644 null result: SUPPORT -> REFUTE with
        directness INDIRECT; the explanation still referred to the retired PARTIAL grade.
      - Network hyperexcitability, PMID:34570177: split into a REFUTE item (overall
        null) and a SUPPORT item quoting the prespecified epileptiform-subgroup benefit.
      - Cellular senescence, PMID:37679434 phase 1 pilot: SUPPORT -> NO_EVIDENCE,
        matching its own explanation (neither confirms nor refutes).

      Added directness INDIRECT to evidence drawn from other diseases: memantine in
      Huntington disease (PMID:20943326), FTLD-tau (PMID:37703311), CTE
      (PMID:41957675), necrosome GVD in ALS/FTLD (PMID:32949047), MEG3 in ischemia
      (PMID:29238035).

      Left unchanged: MISMATCH hits on hypothesis-group structural fields
      (hypothesis_group_id, status, applies_to_subtypes) where the item is a correctly
      graded SUPPORT or REFUTE with an explanation that already states its limit
      (tau antibody trials, synaptic resilience, NSAID trials, HSV-1, Arc EV, GWAS
      complement loci, endosomal internal control, locus coeruleus interval, ASI
      axis, HOPE4MCI); the somatostatin-neuron scope limit on the RORB node; the
      meningeal lymphatic item on the glymphatic node; and the CELIA trial route
      snippet. PARTIAL-rated items were not individually reworked.

      Validated with just validate, validate-terms, count-verified-snippets
      (459/459), check-entity-refs, check-snippet-grading, and validate-disorders.

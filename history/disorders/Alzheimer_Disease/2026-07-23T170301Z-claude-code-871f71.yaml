  details: |
    Reviewed medRxiv preprint DOI:10.64898/2026.07.20.26358345 (Hamilton, Geldsetzer, Davey Smith et al., 2026), an English HES regression-discontinuity analysis finding NO detectable intention-to-treat effect of live-attenuated shingles (VZV) vaccine ELIGIBILITY on hospital-coded dementia, despite a clear reduction in shingles. Added one KNOWLEDGE_GAP discussion (gap_ad_herpesvirus_zoster_vaccination_dementia_prevention) to Alzheimer_Disease.yaml capturing the conflict between this null and the positive Welsh RD finding (PMID:40175543, Nature 2025, ~20% relative dementia reduction), attached to the HSV-1 reactivation and Neuroinflammation pathophysiology nodes. Both references were cached via linkml-reference-validator and snippets verified as substrings of the cached abstracts; medRxiv item flagged as non-peer-reviewed preprint. No mechanistic pathophysiology nodes, phenotypes, or ontology terms were changed. Schema validation passed (target-class Disease).

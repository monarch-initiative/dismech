  summary: 'Review response: fix zoster-vaccine evidence attribution and gap framing'
  details: |
    Addressed the two IMPORTANT items in the ai4c-reviewer CHANGES_REQUESTED review of PR #8838, both on the zoster-vaccine/dementia KNOWLEDGE_GAP discussion.

    1. Evidence misattribution and double-counting. The PMID:41579903 snippet quoted "herpes zoster vaccination prevents or delays dementia onset", which is the Canadian paper's BACKGROUND recitation of two PRIOR natural experiments - one of them PMID:40175543, cited separately in the same discussion, so the item both misattributed the claim and double-counted the Welsh result. Replaced with the paper's own FINDINGS sentence (the 2.0-percentage-point Ontario RD estimate at the Jan 1 1946 threshold) and rewrote the explanation to record that this is an eligibility contrast rather than a receipt-scaled estimate.

    2. The gap resolved itself in prose. The rationale asserted the positive/null disagreement was "most likely" ascertainment plus ITT dilution. The cited England/Wales preprint pre-rebuts exactly that in its own abstract, and the receipt-versus-eligibility framing is untrue for PMID:41579903, whose headline estimate is itself an eligibility RD contrast at the birth-date cutoff. Reframed to genuine equipoise: the methodological reconciliation is now recorded as proposed but unsettled, with both reasons stated, and the preprint's rebuttal sentence added as its own evidence item. Aligned the trailing notes block, which repeated the same framing.

    Also corrected an unverifiable claim in the same rationale sentence: it attributed "reductions in mild cognitive impairment and dementia-related death" to PMID:41579903, which the cached abstract does not state. Replaced with the multi-province synthetic-control corroboration the abstract does report. Flagged on the PR in case the full text supports the original.

    Validation: just validate (all validations passed), just check-duplicate-keys (OK), just count-verified-snippets 234/240 verified with 6 skipped by prefix (was 234/239 with 5 skipped - the added item is a DOI, which the validator config skips, and both DOI snippets were confirmed as exact substrings of the cached preprint by a whitespace-normalized substring check). just check-title-snippets reports 4 pre-existing findings, all in an unrelated file. Incidental references_cache/ frontmatter re-normalization produced by the validator run was reverted rather than committed.

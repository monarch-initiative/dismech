  summary: Add molecular functions for TREM2, NLRP3 and PYCARD on Neuroinflammation
  details: |
    CI gate check_gene_activity_grounding flagged TREM2, NLRP3 and PYCARD, newly wired onto Neuroinflammation, as landing on a node with no molecular function. Added the core molecular functions from their ai-gene-review reviews: GO:0035591 signaling adaptor activity and GO:0140608 cysteine-type endopeptidase activator activity (NLRP3, PYCARD inflammasome) and GO:0004888 transmembrane signaling receptor activity (TREM2). The node already binds GO:0044546 NLRP3 inflammasome complex assembly and microglial activation. Gate and just validate pass.

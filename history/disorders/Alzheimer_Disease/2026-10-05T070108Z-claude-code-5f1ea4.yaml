  summary: Align Alzheimer genes and GO processes with ai-gene-review core functions
  details: |
    Cross-checked the 30 HGNC-bound genes in the entry against ai-gene-review (17 have reviews; RIPK1, RIPK3, MLKL, RORB, PYCARD, CDKN2A, ADAM17, CHRM1, PARP1, ACSL1, ITGAM, MFGE8 and NUP98 do not). Amyloid Plaque Formation: the 'Aggregation' descriptor was bound to GO:0034205 amyloid-beta formation, which is the gamma-secretase cleavage of APP (the PSEN1/PSEN2 core process); relabelled that descriptor as Abeta generation and added GO:1990000 amyloid fibril formation for aggregation, the term the APP and MAPT reviews use. Neurofibrillary Tangle Formation: added GO:1902988 neurofibrillary tangle assembly (MAPT review core process), GO:0050321 tau-protein kinase activity and GSK3B (GSK3B review core function, IDA), with a PMID:31903881 snippet naming GSK3-beta. Neuroinflammation: added TREM2, NLRP3 and PYCARD gene descriptors so these genetic rows reach the pathograph (TREM2 review: microglial activation and phagocytosis; NLRP3 review: NLRP3 inflammasome complex assembly, already on the node). Vascular Dysfunction: added decreased GO:0097242 amyloid-beta clearance for LRP1 (LRP1 review core function), with new evidence from PMID:19098903, which was also added to the previously evidence-free LRP1 genetic row. Complement-Mediated Microglial Synapse Elimination: narrowed GO:0098883 synapse pruning to GO:0150062 complement-mediated synapse pruning, the term carried by the C1QA, C3 and TREM2 reviews. Validated with just validate, count-verified-snippets (462/462), check-entity-refs, check-causal-targets, check-duplicate-keys and check-snippet-grading.

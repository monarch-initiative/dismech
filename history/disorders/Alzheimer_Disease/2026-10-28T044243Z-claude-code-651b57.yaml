  summary: Assess OpenScientist exploration of d2r_arrestin_gsk3b_tau_model; correct
    a false negative in notes
  details: |
    Reviewed the OpenScientist hypothesis-exploration report with the review-hypothesis-exploration skill and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml (verdict PARTIALLY_SUPPORTED). The report's central negative claim is false: it stated that a PubMed search returned zero papers and that tau had never been measured after aripiprazole in an Alzheimer model, but PMID:32587124 measures GSK-3beta, acetylated tau and phospho-tau in APP-Swedish N2a cells with aripiprazole in a three-drug combination. The provider's own search log shows the query was a bare multi-term string and the report itself notes low index recall on those, so the zero was a query artifact. Two further retrievals contradict the shared seed/report framing that nothing computational nominates the drug: PMID:35204697 nominates aripiprazole for Alzheimer disease by name, and PMID:33274491 reports over 70 percent human butyrylcholinesterase inhibition at 10 micromolar with an IC50 the authors call compatible with clinical dosing, which is a competing mechanism neither the seed nor the report considered. Source-grading defects recorded: PMID:28965318 is a hypothesis paper with no association analysis but is typed as human genetic evidence; PMID:31156177's significant lithium subgroup (SMD -0.41, p=0.04) is omitted while only the tideglusib null is reported; PMID:38160617 escaped reference validation as a bare PMID in a comma list; the artifact bundle claims a MANIFEST.yaml, an environment file and checksums that are not present. The report's directional finding stands and is its main contribution, but the hyperprolactinemia review it leans on still predicts benefit from a D2 partial agonist specifically, so the hypothesis likely needs its premise inverted rather than abandoned. The disorder entry's mechanistic_hypotheses notes carried the same false negative-existence claim and were corrected in place. Validation: linkml-validate clean on both the entry and the sidecar, dismech.hypothesis_assessment reports all links and quotes verified, reference_snippet_audit 420/420, check_folded_hyphens and check_hypothesis_links clean.

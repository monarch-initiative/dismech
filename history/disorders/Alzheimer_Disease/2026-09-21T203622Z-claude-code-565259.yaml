  summary: Declare d2r_arrestin_gsk3b_tau_model hypothesis for deep-research exploration
  details: |
    Added one mechanistic_hypotheses entry, d2r_arrestin_gsk3b_tau_model (status EMERGING), to scope an OpenScientist hypothesis exploration. The model proposes that D2-family receptor signalling state sets GSK-3beta activity and therefore tau phosphorylation, via the beta-arrestin2/PP2A/Akt scaffold, making aripiprazole a candidate disease-modifying rather than purely symptomatic agent. Four evidence items, all directness INDIRECT: PMID:30597182 (aripiprazole but not haloperidol preserves pAkt-pGSK3beta under D2R hyperactivity in cortical neurons), PMID:41192583 (D2/D3 beta-arrestin ligand profiling), PMID:39174788 (the only chronic aripiprazole exposure in an Alzheimer model, 5xFAD, glutamatergic readout), and PMID:34173272 (NILVAD) carried as a REFUTE item so the principal human counter-evidence travels with the hypothesis. No pathograph edge opts into the group and none should until the tau arm has direct support; notes record that explicitly. Validated with linkml-validate (no issues), reference_snippet_audit (420/420 snippets verified against cache), check_duplicate_yaml_keys, check_enum_values, check_folded_hyphens, check_hypothesis_links, check_reference_titles and check_snippet_grading, all clean.

  summary: 'Genetics pass: wire BIN1/TREM2/NLRP3/PYCARD, add ADAM10, map AD2/AD17/AD18'
  details: |
    Genetics-gap pass for issue #12268 (d2g series-061), parent 2 of 7.

    Measurement. Gene-to-mechanism wiring was measured with
    dismech.qc_plugins.gene_mechanism_wiring_coverage, which reads gene, gene_term,
    genes and genetic_context together via the causal graph. This entry started at
    5/9: APP, PSEN1, PSEN2, APOE and LRP1 reached nodes, while BIN1, TREM2, NLRP3
    and PYCARD were listed in genetic and bound to no node at all. It is now 10/10
    after ADAM10 was added.

    Wiring. TREM2, NLRP3 and PYCARD were bound on the Neuroinflammation node. NLRP3
    needed no new source: the node already cites a paper whose quoted sentence names
    the NLRP3 inflammasome in Alzheimer brains. TREM2 and PYCARD each got a
    node-level item - the TREM2-deficient 5XFAD result for the failure of the
    microglial response to amyloid, and the ASC-speck work for the inflammasome
    adaptor, including the ASC-deficient mouse that resists seeded spreading. BIN1
    was bound on the neuronal endosomal node with the human-induced-neuron and
    Drosophila arms of an isoform-specific early-endosome study, which is the
    mechanism that matches the node's own description of enlarged Rab5-positive
    early endosomes; its prior evidence was eQTL and GWAS only, which supports a
    risk association and locates no mechanism.

    New gene. ADAM10 was added to genetic as a RISK_FACTOR and bound on the Amyloid
    Plaque Formation node. Its record deliberately carries both directions: the
    founding report's seven late-onset families with incomplete penetrance and its
    cell-based loss of alpha-secretase activity, the transgenic-mouse
    demonstration that the same variants divert APP toward beta-secretase and raise
    plaque load, and a REFUTE item from a resequencing study of sporadic AD that saw
    neither variant and found no excess of rare ADAM10 coding variation. The
    negative study bounds the claim to familial late-onset disease, which is why the
    gene is typed RISK_FACTOR rather than CAUSATIVE.

    MONDO reconciliation. All three checklist rows are recorded in a new mappings
    block as skos:narrowMatch, with per-row justifications: MONDO:0014036 (TREM2),
    MONDO:0014265 (ADAM10) and MONDO:0007089 (APOE). Each names one gene or allele
    rather than a clinically separable form of disease, so a has_subtypes row would
    assert a distinction the clinic does not make, while each gene is curated in
    genetic and bound on the node it acts at.

    Anchor audit. MONDO:0004975 was checked against four tests and kept. It is not
    over-broad, and it contains what the entry models. Two observations were
    recorded in notes. MONDO:0007089, defined by an association with the APOE E4
    allele, reaches the Alzheimer class through MONDO:0100087 familial Alzheimer
    disease, whose own definition concerns families with more than two affected
    members - a common susceptibility allele filed under a familial concept. And
    reading the children shows MONDO:0015140, which is a separately curated entry
    here, sitting beneath this entry's class while this entry also carries an
    Early-Onset Alzheimer's Disease subtype row, so the two overlap on that scope.
    That overlap is reported, not resolved.

    Self-review corrections. Seven prose claims were narrowed against the caches: a
    BIN1 "dose" claim the quoted sentence did not support, "principal"
    alpha-secretase, an "unaffected relative" where the source says unaffected
    subject, a generalisation about the numbered Alzheimer series that is false of
    its Mendelian members, an unchecked OMIM attribution in two places, an unchecked
    mapping of the numbered early-onset classes to specific genes, and APOE's risk
    grade.

    Validation: just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches --resolve,
    the whole-repo gates including check-folded-hyphens, and validate-disorders.

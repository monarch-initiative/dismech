  summary: Manual evidence review of Alzheimer Disease entry
  details: |
    Detailed manual claim-by-claim review verifying every evidence snippet supports its claim (no scripting). Schema, term, and reference validators all pass. Fixes applied: (1) Executive Dysfunction phenotype_term upgraded from generic HP:0100543 (Cognitive impairment) to the exact HP:0033051 (Impaired executive functioning). (2) Removed off-topic Executive Dysfunction evidence PMID:36279224 ([Vascular cognitive impairment]) whose snippet describes fronto-executive deficits in cerebrovascular/small-vessel disease, not AD, and weak PMID:31930617 (anosognosia snippet about memory core symptoms, no executive-function support); PMID:24011643 retained as direct support. (3) Removed Behavioral Changes evidence PMID:34580191 (snippet was only the article title 'Alzheimer Disease and Mood.'; no abstract in cache) and PMID:34755541 (frequencies are for cerebral amyloid angiopathy, not AD); PMID:38157881 and PMID:28413709 retained. (4) Agnosia phenotype had only two NO_EVIDENCE placeholder items (no support); replaced with real support PMID:31449049 reporting object agnosia and prosopagnosia are common in AD. (5) Reworded Late-Onset subtype PMID:18667359 explanation to stop overclaiming (snippet supports AD ~60% of dementia, not a late- vs early-onset comparison). (6) Added missing disease-modifying anti-amyloid monoclonal antibody therapy (lecanemab/donanemab) with CLARITY-AD phase 3 evidence PMID:36449413, therapeutic_modality MONOCLONAL_ANTIBODY, therapeutic_agent NCIT:C175105 (Lecanemab). Recent high PMIDs (42094473 bioRxiv, 42372723 Cell, 42413719 Life Sci) and the BIN1 preprint PPR:PPR1263744 snippets were spot-checked against cache and confirmed authentic. Outstanding items filed as GitHub issues: prevalence block not migrated to structured measure_type/prevalence_class/rate_per_100000 slots; no clinical_trials section; APOE/TREM2/NLRP3/PYCARD/LRP1 genetic entries lack gene_term bindings; donanemab/aducanumab not separately curated.

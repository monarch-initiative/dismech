  summary: Add verified computational HUMAN_MODEL_MISMATCH for adaptive T-cell arm
  details: |
    Added a HUMAN_MODEL_MISMATCH discussion capturing an OpenScientist code-execution finding, independently reproduced before curation: an Open Targets Platform gene-set enrichment of Alzheimer disease genetic-association targets (MONDO:0004975, top 200 of 13,367 by genetic_association) shows innate-microglial genes strongly enriched (18/35; OR 115.1; Fisher one-sided p 1.79e-27) but adaptive-immune/CD8/IFN-gamma/MHC-I genes not enriched (0/46; OR 0.0; p 1.0), robust across cutoffs/backgrounds. Interpreted as the adaptive T-cell arm being an acquired/downstream response to tau rather than an inherited AD-risk driver, reconciling mouse functional data with human genetics. Numbers reproduced to the digit by re-running the same GraphQL query + Fisher test; anchor PMIDs 41888907/40670704 cited in prose only. Two proposed experiments (cell-type colocalization; tau-endophenotype-stratified enrichment). Schema/term/reference/folded-hyphen checks pass.

  summary: Add plasma proteomic cellular aging clock biomarkers (astrocyte, OPC, inhibitory
    neuron)
  details: |
    Curated cell-type-specific plasma proteomic aging clocks from Ding et al. (PMID:42297981, Nat Med 2026) as biochemical biomarkers with pathograph readouts. Added three biomarkers: astrocyte age gap (PREDICTS -> Neuroinflammation, HR 12.59 extreme vs youthful for incident AD over 15y in UK Biobank; CORRELATES_WITH -> Neurofibrillary Tangle Formation via plasma pTau-217 in NSHD Insight-46), oligodendrocyte precursor cell age gap (stepwise with CDR, strongest PACC correlate; CORRELATES_WITH -> Neurofibrillary Tangle Formation), and inhibitory neuron age gap (inhibitory but not excitatory neurons linked to AD; CORRELATES_WITH -> Synaptic Dysfunction). All three grounded to NCIT:C97139 Proteomic Profile with CL cell-type bindings. Deliberately curated as prognostic associations, not causal mechanism nodes: the clocks are observational plasma signatures, and the note on the astrocyte entry records that the headline 12.59-fold figure is an extreme-vs-youthful contrast rather than the HR 5.16 excess-risk comparison against APOE4 carrier status and the AD polygenic risk score. Added a KNOWLEDGE_GAP discussion (gap_cellular_aging_clock_generalizability_and_cell_assignment) recording the study's own two limitations: predominantly older European-ancestry derivation cohorts, and probabilistic protein-to-cell-type assignment bounded by Human Protein Atlas coverage and a twofold enrichment threshold. Validation: linkml-validate clean; term validation passed; all 19 new snippets verified as exact literal substrings of the cached full text, checked with a direct substring test in addition to the snippet audit, because three earlier drafts matched only under the audit's whitespace and dash normalization and were rewritten to clean spans.
    Source of this curation: the Cell Reports Medicine Spotlight by Heikal & Salama
    (PMID:42612620, doi:10.1016/j.xcrm.2026.102996), which surveys Ding et al.
    Numbers were taken from the primary paper, not the commentary: the Spotlight
    presents the astrocyte HR 12.59 (extreme vs youthful) as directly exceeding
    APOE4's HR 5.30, but those come from two different comparisons in Ding et al.
    The commentary is not cited as evidence because its cached record carries only
    the teaser sentence, which states no finding of its own.

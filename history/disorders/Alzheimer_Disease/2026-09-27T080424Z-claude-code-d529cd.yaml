  summary: Add obicetrapib (CETP inhibition) and BROADWAY trial
  details: |
    Added an investigational treatment for obicetrapib (NCIT:C175167) from the BROADWAY Alzheimer biomarker substudy (PMID:41109840), which reported attenuated plasma p-tau217 rise versus placebo, largest in APOE4/E4 homozygotes, with GFAP and NfL reductions in that subgroup. Linked it to Neurofibrillary Tangle Formation as MODULATES (indirect, biomarker-only) and to Vascular Dysfunction as INHIBITS using class-level mouse evidence with evacetrapib (PMID:42547584). Added clinical trial NCT05142722 (phase 3, completed; status and phase checked against the ClinicalTrials.gov API). A CETP Mendelian randomization study (PMID:39415269) was considered and not cited because its significant dementia findings are for Lewy body and Parkinson dementia, not Alzheimer disease. Validated with just validate-disorders; all 425 snippets verified.

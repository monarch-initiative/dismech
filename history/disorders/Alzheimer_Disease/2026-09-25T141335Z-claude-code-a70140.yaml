  summary: Add PsychAD/PASCode single-nucleus evidence and dataset
  details: |
    Added evidence from PMID:42778763 (He et al., Nat Med 2026; PASCode phenotype scoring of the PsychAD prefrontal snRNA-seq cohort, 1,494 donors) on four existing targets: Neuroinflammation (microglia subpopulations; astrocyte inflammation/ER-stress states associated with depression within AD), Interneuron Dysfunction and Network Hypersynchrony and Mitochondrial Quality-Control Failure (E/I imbalance and mitochondrial dysfunction in cognitively impaired vs resilient donors), and the amyloid-tau-glia-resilience ordering knowledge gap (reactive astrocyte subtypes associated with cognitive resilience). Only the abstract is cached, so every snippet is an abstract quote; full-text detail (MTERF1, KCNB2/KCND2, EMP1/FKBP5, SST depletion) appears only in explanations, read from the article PDF supplied by the user. evidence_source COMPUTATIONAL because the findings are ML phenotype-association scores over human tissue data. Added dataset synapse:syn60084804 (PsychAD_NPS; title from the Synapse API). No new nodes or edges.

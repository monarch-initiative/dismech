  summary: PsychAD evidence and six emerging hypotheses
  details: |
    Added evidence from the PsychAD Consortium papers (PMID:42778699, PMID:42778698, PMID:42778537) to Selective Vulnerability of RORB+ Entorhinal Excitatory Neurons, Interneuron Dysfunction and Network Hypersynchrony, Vascular Dysfunction, Neuroinflammation, Adaptive Immune T Cell Response to Tau Pathology (REFUTE: helper T and antigen-presentation programs tracked dementia resilience), Autophagy-Lysosomal Dysfunction, Oligodendrocyte and Myelin Dysfunction, and apoe_risk_modulation_model (NO_EVIDENCE: no APOE-genotype differential expression, which the model does not predict). Added EMERGING hypotheses microglia_vlmc_meningeal_expansion_model, sst_interneuron_amyloid_restraint_model, early_il17_neurovascular_injury_model, monocyte_adaptive_immune_resilience_model, neuronal_regulatory_reserve_resilience_model and deep_layer_excitatory_nps_model, each naming the supplementary tables that would test it. All rest on one DLPFC cohort. Validated with just validate-disorders; snippets verified against cached full text.

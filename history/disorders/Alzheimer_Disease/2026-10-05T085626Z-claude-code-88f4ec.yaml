  summary: Reconcile Alzheimer gene roles with new ai-gene-review reviews
  details: |
    After ai-gene-review reviews were written for ADAM17, MFGE8, ACSL1, RIPK1, RIPK3 and MLKL, four statements in the entry were brought into line with them. Muscarinic M1 node: ADAM17 described as the PKC-stimulated (regulated) APP alpha-secretase, with a note that constitutive neuronal alpha-secretase cleavage is attributed mainly to ADAM10 (PMID:20676056). Complement-Mediated Microglial Synapse Elimination: notes now state that MFG-E8 is a phosphatidylserine-integrin bridging opsonin, not a complement component. Necroptotic Neuronal Death: MLKL phosphorylation attributed to RIPK3 within the necrosome. Microglial Lipid Droplet Accumulation: ACSL1 described as a long-chain acyl-CoA synthetase marker rather than a lipid-droplet-associated enzyme, since no evidence places the protein on lipid droplets. Validated with just validate and count-verified-snippets (462/462).

  summary: 'Integrate assessed OpenScientist findings: eight pre-sweep hypothesis
    assessments'
  details: |
    Final integration pass over the eight Alzheimer_Disease hypotheses whose OpenScientist assessment sidecars predate this sweep: cellular_senescence_model, complement_synaptic_pruning_model, endolysosomal_origin_model, hsv1_reactivation_model, myelin_oligodendrocyte_model, necroptosis_model, network_hyperexcitability_model and selective_neuronal_vulnerability_model. No new assessment was written; each existing sidecar (by claude-opus-5, claude-opus-4-8 or codex) was read and only its RETAINED and QUALIFIED claims were considered for integration. Every one of the 29 primary identifiers cited by those claims was already present in the entry, so the great majority of claims needed no action: the assessors had promoted them when the sidecars were written. Three claims were found to be still outstanding and were integrated as prose qualifications only. No evidence item, pathophysiology node, causal edge, ontology binding or status value was added or changed, and no snippet was re-derived, so the verified snippet count is unchanged at 404 of 410. First, the cellular_senescence_model claim that a glia only dataset cannot adjudicate a glia versus neuron cell identity dispute: the geo:GSE160936 dataset notes had recommended it as the natural place to test exactly that question, which is the misuse the report flagged, so the notes now record that the series carries no neuronal comparator and can establish presence of a glial senescence signature but not which cell type carries the burden. Second, the cellular_senescence_model circularity claim: the senescent cell controversy recommends re scoring senescence signatures against geo:GSE129308, and the notes now record that PMID:30126037 derived its signature from microdissected tangle bearing neuron transcriptomes, so scoring that same signature in a tangle bearing versus tangle free design is partly circular and an independently defined signature is required. Third, the myelin_oligodendrocyte_model notes on the mechanistic_hypotheses entry were stale relative to the corrections already curated on the Oligodendrocyte and Myelin Dysfunction pathophysiology node: they still described the microglial diversion arm as merely less replicated rather than SPECULATIVE on a checked absence, and still gave the oligodendrocyte precursor plasma proteomic age gap biomarker as motivation without the correction that its source plasma clock (PMID:42297981) shows astrocyte aging as the strongest APOE4 linked signal. Both corrections were folded into the hypothesis notes with a pointer to the node. Deliberately not curated: every NEEDS_VERIFICATION and REJECTED claim, including the fabricated OR 1.46 figure for PMID:40934136, the GEO linked PMID:41620473 attribution for GSE129308, the RIPK1 inhibitor discontinuation reasons, the gamma entrainment and CSF complement biomarker leads, the NRGN/BEX1 marker assignment, and the plaque proteomics public accession claim for which no ProteomeXchange identifier could be resolved. No status value was changed: every assessment concluded the curated status was correct.

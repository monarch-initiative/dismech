  summary: Add Glymphatic Clearance Failure node conforming to glymphatic_dysfunction
  details: |
    Added a 'Glymphatic Clearance Failure' pathophysiology node (role amplifier, biological_scale TISSUE, mechanism_confidence PROVISIONAL) declaring conforms_to glymphatic_dysfunction#Impaired Perivascular CSF-ISF Exchange and Solute Clearance, with a downstream edge to Amyloid Plaque Formation. Added a matching EMERGING mechanistic_hypotheses entry, glymphatic_clearance_model. Deliberately did NOT attach conformance to the existing Vascular Dysfunction node: that node models transcytotic blood-brain-barrier / LRP1 amyloid efflux, which is a different anatomical clearance route from perivascular CSF-ISF exchange, and merging them would conflate two mechanisms. The new hypothesis group is likewise kept separate from vascular_bbb_clearance_model for the same reason. Held at PROVISIONAL/EMERGING because the human evidence is dominated by imaging surrogates and small intrathecal-tracer cohorts and the underlying transport mode is contested (see the module's curated hypotheses and discussions). Evidence: PMID:27893874 (human postmortem AQP4 depolarization in AD), PMID:29997300 (delayed intrathecal tracer clearance in a dementia cohort), PMID:33004510, PMID:28899014 and PMID:29632177 (interventional human sleep-to-amyloid evidence on the causal edge). Schema, term, and reference validation all pass (214/217 snippets verified, 3 pre-existing non-PMID refs skipped by prefix).

  details: |
    Answered the 2026-10-23 review of exp_ipsc_bbb_chip_barrier_failure_to_tau. The Barrier integrity readout (direction DECREASED, lower resistance and higher permeability) was bound to GO:0150104 transport across blood-brain barrier, which read with DECREASED says the barrier tightened; it is now bound to GO:0035633 maintenance of blood-brain barrier, whose label was taken from cache/go/terms.csv and which is already a member of the BiologicalProcessTerm enum cache. The experiment description now names the allele class the isogenic correction targets (APOE e4 to e3, or a familial APP, PSEN1 or PSEN2 variant), since sporadic disease has no single variant to correct. A fourth typed divergence (BOUNDARY_OMISSION, QUALIFYING) records that the published chip has no pericytes, although pericyte is one of the two cell types bound to the Vascular Dysfunction node. No evidence changed.

  summary: Add tau-directed ASO (diranersen/BIIB080) treatment and CELIA trial
  details: |
    Added a Tau-Directed Antisense Oligonucleotide Therapy treatment for diranersen [BIIB080 / IONIS-MAPTRx], an intrathecal RNase H1 gapmer that lowers MAPT mRNA to reduce tau. Structured with therapeutic_modality ANTISENSE_OLIGONUCLEOTIDE and an aso_details block [RNASE_H_KNOCKDOWN, MAPT hgnc:6893 target, 2prime-MOE chemistry, unconjugated], plus a target_mechanisms edge to the Neurofibrillary Tangle Formation node. Evidence anchored to the published phase 1b MAPTRx trial PMID:37095250 [Mummery et al. Nat Med 2023] with three verified exact-quote snippets: MAPT-lowering intent, dose-dependent >50pct CSF total-tau reduction, and intrathecal dosing. Added a clinical_trials entry for the phase 2 CELIA study NCT05399888 [PHASE_II, ACTIVE_NOT_RECRUITING] validated against ClinicalTrials.gov. The 2026 AAIC topline CELIA results [missed primary endpoint, tau reduction, slowing of clinical decline, FDA Fast Track] are described in prose only, since no peer-reviewed publication with a citable abstract exists yet. Prompted by a Science News article on the CELIA tau-drug results.

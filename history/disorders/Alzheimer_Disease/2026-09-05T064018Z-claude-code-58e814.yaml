  summary: Integrate assessed OpenScientist findings across eight hypothesis groups
  details: |
    Integration-only pass over eight of the sixteen OpenScientist hypothesis reports for this entry (adaptive_immune_tcell_model, amyloid_cascade_model, autophagy_lysosomal_clearance_model, ev_mediated_tau_propagation_model, neuroimmune_glial_amplification_model, tau_neurodegeneration_model, synaptic_failure_convergence_model, vascular_bbb_clearance_model). No assessment sidecars were written; all sixteen already existed and validate. Work was driven by the RETAINED and QUALIFIED claims of the by-claude-opus-5 sidecars, and every snippet was re-derived from references_cache rather than copied from the reports, because several proposed snippets in the reports are truncated, silently repaired, or reworded titles.

    Added 32 evidence items across seven mechanistic_hypotheses blocks and four new KNOWLEDGE_GAP discussions. amyloid_cascade_model: A673T knock-in protection (PMID:39496485), donanemab clinical meaningfulness (PMID:42128444), the Cochrane null on amyloid removal (PMID:41985900), gantenerumab moving amyloid but not tau PET (PMID:39887500), the tau-first spatiotemporal subtype (PMID:37433038), solanezumab graded OTHER as expert opinion rather than trial evidence (PMID:38685682), oldest-old resilience with its co-pathology explanation attached (PMID:41942821, two items), and the C99 endolysosomal arm (PMID:31043483). tau_neurodegeneration_model: seeding before AT8 tangles (PMID:39211286), axonal tau reduction lowering both tau and amyloid (PMID:40734174), glial phenotype separating demented from resilient at matched Braak III-IV including tau-free cortex (PMID:35534858), and the TANGO and Lauriet anti-tau failures requoted from the cache rather than from the report's safety sentence (PMID:38012285, PMID:37643887). synaptic_failure_convergence_model: CSF/PET SV2A concordance (PMID:40491249), plasma GAP-43 (PMID:41406948), hippocampal tangle burden against synaptic density (PMID:40465636), DTI-ALPS against synaptic density (PMID:41454064), gut bacterial vesicles driving Piezo1/C1q-C3 pruning (PMID:40731189), and NDAN spine preservation (PMID:38829680). neuroimmune_glial_amplification_model: INPP5D-RIPK1-NLRP3 (PMID:41633359), HDAC6 as dual BACE1/NLRP3 regulator (PMID:41789727), the activated-microglia transplant sufficiency experiment (PMID:39194073), TREM2-R47H attenuating tau-driven atrophy (PMID:32544086), preclinical plasma GFAP and CSF sTREM2 (PMID:40747577), and the NSAID trial failures graded OTHER (PMID:19589092). vascular_bbb_clearance_model: APOE4-graded pericyte degeneration with CypA/MMP-9 (PMID:25757756), PICALM linking LRP1 and P-glycoprotein (PMID:30041013), carotid stenosis raising soluble amyloid (PMID:28667120), and the stage-dependent inversion of the blood-flow/tau association (PMID:40884970). autophagy_lysosomal_clearance_model: endolysosomal GWAS enrichment with the APOE-removal contrast (PMID:30124770, two items), early disease-specific endosomal enlargement (PMID:9236226), lysosomal accumulation preceding degeneration quoted from the source rather than the report's repaired version (PMID:8004466), the dynein-Snapin transport block with the quote extended past 'coupling' to the immobilization clause (PMID:28085665), and presenilin lysosomal calcium as a second candidate mechanism (PMID:23103503). adaptive_immune_tcell_model: human primary tauopathy tissue (PMID:37703311, two items, one of them the 'remarkably little activation of microglia' sentence qualifying the microglia-as-recruiter step) and chronic traumatic encephalopathy (PMID:41957675, two items). PMID:41762118 was curated on glymphatic_clearance_model rather than on vascular_bbb_clearance_model where the report placed it, because it measures perivascular influx and clearance rather than barrier transcytosis; both the temporal-precedence result and the omitted dissociation (antibody treatment cleared plaque without restoring glymphatic function) were curated together.

    New discussions: gap_ad_tau_toxic_species_and_glial_cofactor, gap_ad_synaptic_convergence_relative_stressor_weights, gap_ad_vascular_to_tau_causal_link, gap_ad_arc_ev_tau_replication_and_genetic_support. The last records the founding paper's disclosed Arc-capsid commercial interest alongside the replication gap.

    No status slot was changed. Four reports proposed values that are not in MechanisticHypothesisStatusEnum (ESTABLISHED, SPECULATIVE, PARTIALLY SUPPORTED, DISEASE MODIFIER) or asked for three statuses on one hypothesis; those distinctions were recorded in notes instead.

    Deliberately not curated, per the assessments: the CD103-positive cell-type reading and its ontology lead (the cited paper reports CD103-negative); regulatory T cells as neuroprotective from PMID:15549735 (direction inverted); the claim that BACE1 inhibitors raise C99 (BACE1 generates C99, and the cited paper shows inhibition rescues); the TREM2 lead PMID:42039545 (background sentence, and a cerebral amyloid angiopathy model); PMID:41345807 for the astrocyte axis (a neuroHIV study); the ARIA-E 22-36% figure attributed to the Cochrane review; the ontology leads GO:0150076, CL:0000669 and GO:0015630; the tau-strain snippet from PMID:33693528 (a reworded title); and the 8-month Arc-knockout convergence, which is not in the cached abstract. Also skipped: PMID:36907103 (review; the assessment directs citing the underlying GWAS instead) and PMID:35867714 and PMID:36730056, which have no reference-cache entry.

    Verification: linkml-validate against Disease reports no issues; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-folded-hyphens all pass; count-verified-snippets reports 404/410 with 6 skipped by prefix and no failures; check-snippet-length, check-title-snippets and check-snippet-grading report no findings in this file.

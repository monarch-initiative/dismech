  summary: 'Curate the clinical layer: neuropsychiatric phenotypes, NIA-AA 2024 staging,
    presentation subtypes'
  details: |
    The entry was strong on mechanism (29 pathophysiology nodes, 24 hypotheses) and thin on clinical content: 7 phenotypes with 1 causally connected, no staging, and subtypes only by age at onset. This pass curates the clinical layer; risk factors and risk genes are left for a separate pass.

    Phenotypes. Added the eight neuropsychiatric symptoms the source meta-analysis (PMID:26540080, 48 studies) reports: apathy 49%, depression 42%, aggression 40%, anxiety 39%, sleep disorder 39%, irritability 36%, delusion 31% (all FREQUENT) and hallucination 16% (OCCASIONAL). Apathy also carries an independent community-based sample (PMID:16670248) in which it was the one symptom whose frequency rose with dementia severity. The pre-existing Behavioral Changes row is kept as the umbrella, with its notes rewritten to name the separate rows and to record that four Neuropsychiatric Inventory domains (appetite disorder, aberrant motor behaviour, disinhibition, euphoria) are still uncurated.

    Causal edges. Three phenotypes gained one. Seizures from Interneuron Dysfunction and Network Hypersynchrony, which is where the entry's network-hyperexcitability account already sat: the hAPP interneuron deficit paper for direction (MODEL_ORGANISM, INDIRECT) and the 42.4%-versus-10.5% epileptiform-activity figure for the human association (INDIRECT). Agnosia and Aphasia from Neurofibrillary Tangle Formation, on the tau-PET series (PMID:26962052) in which tracer uptake and hypometabolism localize to the clinically affected cortex while amyloid stays diffuse; both are INDIRECT on series of five to seven patients. Connected phenotypes went from 1 of 7 to 4 of 15.

    Staging. Added the two quasi-independent axes of the revised criteria (PMID:38934362) as stages with substages: clinical stages 0 to 6 by severity of cognitive and functional impairment, and biological stages A to D by amyloid PET plus tau PET topography. evidence_source is OTHER throughout, because the document is a workgroup consensus statement rather than a study. No numeric cutpoints are curated: the document explicitly leaves those to practice guidelines. Note the same paper was already listed in the deep-research references block by DOI (DOI:10.1002/alz.13859); the new evidence cites the PMID, whose cache carries the full text the snippets verify against.

    Subtypes. Added the five phenotypic presentations the criteria name (amnestic, language, visuospatial, behavioral, dysexecutive) and tagged all seven rows with classification, so the age-at-onset and presentation axes are distinguishable. No subtype_term is bound on any of the five. For the visuospatial row that is deliberate and cited: the consensus classification of posterior cortical atrophy (PMID:28259709) makes this disease one cause of that syndrome among others, so MONDO:0018899 is broader than the subtype. The language row records the same reasoning for MONDO:0016644, which Primary_Progressive_Aphasia already carries as a subtype.

    Two knowledge gaps. One asks whether the medial-temporal-to-neocortical tau sequence the biological staging scheme assumes holds in the atypical presentations, whose tangle burden is neocortical from early on; the criteria document states that caveat itself. The other asks what produces the neuropsychiatric symptoms, and is why none of the eight new phenotypes is given a causal edge: a meta-analysis found no consistent association between those symptoms and amyloid, tau or neuronal biomarkers (PMID:42024116), with the young-onset-dementia scope of that review recorded in the evidence explanation.

    One caveat recorded rather than resolved. The meta-analysis behind the eight frequency bands has a published corrigendum (PMID:27455352) whose content could not be retrieved: the record caches with no quotable text, Europe PMC holds no abstract, and the publisher page refused automated access. It is listed in references, cited by nothing, and named in the Behavioral Changes notes as something for a curator with journal access to check.

    Checks: just validate-disorders passes; validate, validate-terms and count-verified-snippets (551 snippets, 568 titles, 546 of 546 verified) pass; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-logical-rules, check-gene-validity, check-delivery-system, check-name-collisions, check-snippet-grading, check-title-snippets, check-reference-titles, check-reference-titles-present, check-snippet-length, check-retired-support-prose, check-folded-hyphens, check-folded-yaml and check-empty-snippets all pass. Two snippet errors were caught by validation during the pass and fixed at source: one quote had been truncated mid-word, and one had four bracketed spans that strip mid-quote, which was replaced with a bracket-free sentence carrying the same claim.
- type: REVIEW
  outcome: changed
  sections:
  - phenotypes
  - pathophysiology
  summary: 'Review round 1: soften the Seizures causal link, drop two unsourced DLB
    comparisons'
  details: |
    Three suggestions, all non-blocking, on an approving review. Two were defects in the prose of the preceding commit and are fixed here; one was mistaken and the note it concerns is unchanged.

    The Seizures edge carried causal_link_type DIRECT while both of its evidence items are graded directness INDIRECT and its source node carries mechanism_confidence PROVISIONAL. The mechanistic direction comes from hAPP mice alone, so DIRECT asserted more than the evidence holds. It is now INDIRECT_KNOWN_INTERMEDIATES, naming network hypersynchrony and spontaneous epileptiform discharges as the intermediate, which also matches how the sibling edge from the same node to Memory Loss is modelled.

    Two notes carried an uncited comparison with dementia with Lewy bodies: that delusions outnumbering hallucinations distinguishes the two diseases, and that prominent early visual hallucinations should raise DLB instead. Both are clinically conventional and neither is in any source this entry cites, so they were prose claims no check could reach. Removed. What the cited meta-analysis does support is kept: delusions at 31% against hallucinations at 16%.

    The third suggestion asked for the Hallucinations note's euphoria comparison to be confirmed from full text or dropped, on the grounds that the abstract gives no figure for euphoria. The cached abstract does: "Least common was euphoria, with an overall prevalence of 7% (95% CI 5-9%)". Hallucination at 16% is therefore the second least common of the twelve symptoms. The note is kept and now states euphoria's figure, so the next reader can check it without going to the paper.

    Checks after the edits: just validate-disorders passes; validate (551 snippets, 0 issues), check-enum-values, check-entity-refs, check-causal-targets and check-retired-support-prose all pass.

  summary: OpenScientist hypothesis runs across seven new hypotheses
  details: |
    Commissioned OpenScientist hypothesis-exploration runs for all seven mechanistic hypotheses added in the preceding cell-biology review, and processed each report through the repository's report-to-assessment-to-curation flow. Added a reusable dataset-anchored template (templates/hypothesis_deep_research_datasets.md) that takes the standard hypothesis variables plus candidate_datasets and requires per-dataset fitness-for-purpose, the concrete analysis, the discriminating prediction stated in advance, and known confounds. Five hypotheses were run against it; network hyperexcitability was run on the standard template because its open question is a clinical-trial question, and it was the right call. Added the entry's first datasets block, eleven records with every accession resolved by just verify-datasets. Each of the seven reports has an assessment sidecar recording claim-level dispositions. Findings promoted only after fetching the source and validating snippets: Musi 2018 breaking the species-split framing of the senescent-cell-identity controversy; the SToMP-AD phase 1 senolytic trial; the HOPE4MCI negative trial; a tau-to-necroptosis edge giving that node the upstream trigger it lacked; human C3-at-synapses and CR1/CLU genetics strengthening the complement arm; human plaque proteomics as the discriminating data type for plaque origin; RORB region-specificity; and a correction to my own over-reading of the oligodendrocyte-precursor plasma biomarker. Two runs failed and were retried: one API 502 and one server-side timeout, the latter fixed by reducing iterations rather than raising the timeout, which the provider caps.

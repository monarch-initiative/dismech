  summary: Add astrocyte-resilience and glial-depression hypothesis groups
  details: |
    Added two EMERGING mechanistic_hypotheses seeded from PMID:42778763 (He et al. 2026, PsychAD prefrontal snRNA-seq): reactive_astrocyte_resilience_model (reactive astrocyte subtypes, e.g. EMP1 versus FKBP5, associated with cognitive resilience at matched Braak stage) and glial_depression_in_ad_model (astrocyte inflammatory and ER-stress states associated with depression within Alzheimer disease). Each carries the paper's abstract quote as its seed evidence; the resilience model also cites PMID:37248300. Both were then explored with OpenScientist dataset-analysis runs on the paper's open supplementary tables; the reports, artifact bundles and assessments are under kb/hypotheses/Alzheimer_Disease/. Both assessments are WEAKLY_SUPPORTED_UNRESOLVED and both analyses PARTIAL (see issue 12909 for why no OpenScientist dataset run can currently pass the analysis gate). The hypothesis statuses were left at EMERGING. Rebased onto main, where an N-glycan hypothesis had been added at the same position; both were kept.

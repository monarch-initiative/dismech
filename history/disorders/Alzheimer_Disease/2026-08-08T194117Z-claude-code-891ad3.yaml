  summary: Add anticholinergic muscarinic burden model to Alzheimer Disease
  details: |
    Curated the anticholinergic-burden/dementia question (diphenhydramine as exemplar) into the Alzheimer Disease entry after reading 13 primary sources.

    Added: (1) mechanistic_hypotheses entry anticholinergic_muscarinic_burden_model, status EMERGING; (2) pathophysiology node 'Muscarinic M1 Receptor Signaling Loss' (biological_scale MOLECULAR) with downstream edges to Amyloid Plaque Formation (via ADAM17/alpha-secretase diversion) and Neurofibrillary Tangle Formation (via GSK3-beta/PKC), both MODEL_ORGANISM evidence from 3xTg-AD/Tg-SwDI mice; (3) a new top-level environmental: block for cumulative strong-anticholinergic exposure, ECTO:9001824, environmental_effect PREDISPOSES, influences_mechanisms linked to the new node; (4) two discussions - a HUMAN_MODEL_MISMATCH on M1-selective mouse antagonism vs non-selective human drug exposure, and a CONTROVERSY on reverse causation and class specificity.

    Epistemic stance: deliberately curated as PREDISPOSES/EMERGING, not causal. Conflicting evidence is carried in the entry rather than suppressed - the Cochrane deprescribing review is cited as NO_EVIDENCE (PMID:38063254) and the target trial emulation as REFUTE (PMID:42250644), because the two large UK studies localize the signal away from antihistamines and the largest antihistamine cohort reports the same dose-response for second-generation agents that do not meaningfully cross the blood-brain barrier.

    Post-review correction after obtaining the Richardson 2018 CPRD full text (PMID:29695481). The antihistamine null there is weaker than the abstract implies - antihistamines were tested and were non-significant on any-prescription exposure, but the paper reports a tentative effect above 365 defined daily doses, notes that over-the-counter supply is not captured so antihistamine use is underestimated, and calls for independent confirmation specifically for antihistamines. Because diphenhydramine is predominantly an over-the-counter drug, prescription-database nulls are substantially exposure-misclassification nulls rather than clean refutations. Also corrected - antipsychotics were significant in QResearch but null in CPRD, so the two UK studies are no longer described as agreeing on that class. These findings are recorded in notes fields rather than as evidence snippets, because the cached reference is abstract-only and the validator routes full text to a private cache for copyright reasons.

    Validation run: linkml-validate (No issues found); linkml-term-validator validate-data --labels (Validation passed); reference_snippet_audit reports 229/232 verified against cached references, 3 skipped by prefix, 0 unverified. All 13 new PMIDs fetched with the reference validator cache command, never hand-written. Caches normalized with migrate-cache --sort-only plus the enum sort (no reordering needed). tests/test_data.py -k 'environmental or discussion or attaches or hypothesis or cache': 4094 passed after rebase onto origin/main 95c99b28c. Full-suite run before the rebase: 21347 passed, 1 pre-existing unrelated failure in X-Linked_Infantile_Spinal_Muscular_Atrophy.yaml.

  summary: Add treatments for neuropsychiatric symptoms (#18278)
  details: |
    Added five treatment rows, each linked to an existing neuropsychiatric phenotype through target_mechanisms: brexpiprazole for agitation (PMID:37930669, PMID:31708380), citalopram for agitation (CitAD, PMID:24549548), atypical antipsychotics for psychosis and agitation (CATIE-AD, PMID:17035647; mortality meta-analysis, PMID:16234500), suvorexant for insomnia (PMID:31944580) and sertraline/mirtazapine for depression, recorded as a negative result (HTA-SADD, PMID:21764118, REFUTE on the Depression link). FDA approval of brexpiprazole and the antipsychotic boxed warning were left out because no cached source states them. Non-pharmacological approaches were not added. Validated with just validate, validate-terms and count-verified-snippets (577/577).

  summary: 'Create: MT-ATP6/MT-ATP8-Related Infantile Hypertrophic Cardiomyopathy
    (MONDO:0010777)'
  details: |
    New entry for MONDO:0010777 (cardiomyopathy, infantile hypertrophic), the maternally inherited mtDNA complex V (ATP synthase) infantile hypertrophic cardiomyopathy caused by variants in the MT-ATP6/MT-ATP8 overlapping reading frames (reference allele m.8528T>C).

    NEC preflight (mandatory; this MONDO label was flagged HIGH RISK because at least six existing kb/disorders entries carry infantile hypertrophic cardiomyopathy as a feature of a *nuclear-gene* mitochondrial disease). MONDO:0010777 records no causal-gene relationship (RO:0004003), so `just preflight-dr` returns SKIP and cannot adjudicate; the identity was anchored manually instead:
    - `runoak -i sqlite:obo:mondo info MONDO:0010777 -O obo` gives xref OMIM:500006 (a phenotype number in the 500000 mitochondrial-inheritance series) and is_a MONDO:0003847 hereditary disease, with no causal gene.
    - MedGen 412660 (the equivalent concept) lists OMIM 516060 and 516070 as alternate names for the same phenotype string; those are the OMIM *gene* entries for MT-ATP6 and MT-ATP8.
    - The literature entry point for OMIM 500006 is Ware et al. 2009 (PMID:19188198): four unrelated infants with isolated hypertrophic cardiomyopathy carrying m.8528T>C in the MT-ATP6/MT-ATP8 overlap.
    - `just preflight-dr <report> MONDO:0010777` verdict SKIP; its gene census on the falcon report is strongly confirmatory: MT-ATP6=45, MT-ATP8=22, no rival gene above 2 mentions. Report OMIM ids were 256000, 516060, 551500 (Leigh / MT-ATP6 gene / NARP context); 500006 itself was not cited by the report, so the Leigh/NARP material was read as context and not curated in.

    Deep research: `just research-disorder falcon` (Edison Scientific, 727s, 33 citations). Its own reference-validation frontmatter reported 10/10 references resolved, 0 unresolved, 0 off topic, needs_review absent. The report was used as a lead generator only; every PMID was re-fetched with `just fetch-reference` and every snippet re-verified against the local cache. One report suggestion was rejected on checking: it proposed HP:0011663 for left ventricular non-compaction, but HP:0011663 is "Right ventricular cardiomyopathy", so that phenotype was dropped rather than mis-bound.

    GeneReviews: no chapter exists for this disorder. A PubMed search returned only the general "Primary Mitochondrial Disorders Overview" (PMID:20301403), whose abstract states the chapter's purpose and carries no disease-specific clinical characteristics, so it was deliberately not cited as a phenotype baseline. This is recorded in the entry's notes.

    Content: 10 atomic pathophysiology nodes running m.8528T>C in the overlap -> failure to insert ATP6/ATP8 into the Fo membrane domain -> complex V holoenzyme deficiency with subcomplex accumulation -> impaired proton-coupled ATP synthesis (plus a parallel dimerisation/cristae arm) -> cardiomyocyte energy deficit -> compensatory hypertrophy -> progressive infantile heart failure, with a separate Cardiac Heteroplasmy Threshold modifier node feeding the energy-deficit node. Two OPEN KNOWLEDGE_GAP discussions with proposed experiments: (a) whether the ATP6 start-codon loss or the ATP8 p.Trp55Arg substitution drives the infantile phenotype - unresolvable in patients because the overlapping frames make the two consequences inseparable; (b) why the phenotype is cardiac-restricted when the heart is the least often affected tissue (18%) across MT-ATP6/MT-ATP8 deficiency.

    Evidence discipline: mechanistic evidence drawn from the adjacent MT-ATP8 nonsense variant m.8529G>A (PMID:17954552), from yeast ATP6 work (PMID:33600551, PMID:11823415), and from whole-spectrum MT-ATP6/MT-ATP8 or general paediatric cohorts (PMID:40112238, PMID:30763462, PMID:30642647, PMID:33718303, PMID:31711761) is either marked supports: PARTIAL or carries an explicit node-level notes saying what population it came from. Two cached records used here, PMID:26803244 and PMID:27409572, have no abstract in the cache; they are listed under top-level references for discoverability but are deliberately NOT used as evidence items, since the only quotable text in them is the title (issue #8374).


  summary: 'Gene-family review: MT-ATP6, MT-ATP8'
  details: |
    MT-ATP8 relationship_type changed from CAUSATIVE to UNKNOWN: ClinGen rates MT-ATP8 Limited for mitochondrial disease (MONDO:0044970), and the single causal variant m.8528T>C alters both overlapping genes (PMID:19188198). MT-ATP6 stays CAUSATIVE on ClinGen's Definitive tiers; both records carry notes. MT-ATP6 and MT-ATP8 now also sit on the Complex V Holoenzyme Deficiency node, whose GO:0046933 descriptor is described as the holoenzyme activity the two non-catalytic membrane subunits contribute to, so each gene lands on a molecular function rather than only on the variant node.

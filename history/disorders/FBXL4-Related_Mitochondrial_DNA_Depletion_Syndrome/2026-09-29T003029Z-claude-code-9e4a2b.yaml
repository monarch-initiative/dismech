  details: |
    New entry for MONDO:0014198 (FBXL4, OMIM 615471). The stub stubs/Mitochondrial_DNA_Depletion_Syndrome_13.yaml is deleted.

    Deep research: one Perplexity sonar-deep-research report at the default (medium) reasoning effort. It was produced through a session-local streaming wrapper (sitecustomize.py on PYTHONPATH, not committed), because the egress proxy drops the non-streaming call after about 300 s (dismech#9357). The first term-validation pass aborted on an OLS timeout for a MedGen CURIE and was re-run with --skip-prefix MedGen. just preflight-dr against MONDO:0014198 returned PASS (FBXL4 mentioned 281 times, OMIM 615471 matches).

    Perplexity cites bare URLs, so the report's reference validation found no PMID or DOI (dismech#10249). Each of the 18 URLs in the .citations.md sidecar was resolved by hand. PMID 23993193 (Bonnen) and PMID 25868664 (Huemer) are cited. PMC5580732 is Antoun et al. 2016 (PMID 26404457), not the Gai et al. paper the body names. The report quotes "profound reductions in complex I-, II- and ETF-linked..." for it, and that text is not in the Antoun abstract, so it was not used. PMC6370620 is Ballout et al. 2019 (PMID 30804983). The EMBO Mol Med DOI is PMID 32525278 and was cited by its PMID. The Autophagy commentary is PMID 38423516. The Frontiers cardiovascular review (DOI 10.3389/fcvm.2025.1582219) was not cited: the report's "54% cardiac involvement" figures and its HFpEF FBXL4-transfection claim are not in the abstract, and the report's [11] is used for both this review and GeneReviews. The OMIM, MedGen, Orphanet, ClinVar, NCBI Gene, MedlinePlus and GTR URLs are not fetchable references and were not used. The report's hyperammonemia "about half" figure comes from MedlinePlus; the entry uses the 45% figure quoted from PMID 40161922 instead, marked quote_role BACKGROUND.

    Additional sources were found by a PubMed FBXL4[tiab] search. They are the GeneReviews chapter PMID 28383868 (tagged and mined for clinical characteristics, diagnosis, management, surveillance and genetic counselling), Gai 2013, El-Hattab 2017 (87 patients), Dai 2017, the 2023 BNIP3/NIX ligase papers (PMIDs 36896912, 37161784, 37102372, 37568009, 37876279), PPTC7 (38151018), the AMPK preclinical study (42310391), dichloroacetate (31442532, 35881484), ketogenic diet case reports (33882172, 41635899), the deoxynucleoside trial (40175578, NCT04802707), prenatal cases (36411461, 40252080, 27099744), hyperammonemia cases (27858371, 40161922), a mild-course case (34602956), a fibroblast study (31969900) and a commentary (39937392). PMIDs 26421988 and 34738379 cached with no quotable text and were not used.

    Pathograph: FBXL4 loss of function -> failed SCF-FBXL4 ubiquitination of BNIP3/NIX -> excessive basal mitophagy -> reduced mitochondrial content -> mtDNA depletion and combined respiratory chain deficiency. The respiratory chain deficiency leads to lactic acidosis and to neuronal, muscle and cardiomyocyte energy-failure nodes, which feed the phenotypes. Side branches cover mitochondrial fusion (PMID 31442532), anaplerosis and hyperammonemia (PMID 27858371, hypothetical), and an embryonic-mitophagy hypothesis for the developmental features (PMID 39937392, EMERGING). Three hypothesis groups are recorded: canonical BNIP3/NIX mitophagy, an alternative primary-OXPHOS reading (PMID 31969900), and the emerging embryonic hypothesis. Conflicting fibroblast findings on mitochondrial mass are recorded as REFUTE items and a KNOWLEDGE_GAP discussion. Pulmonary hypertension is left without an upstream edge because no source gives a mechanism.

    ClinGen gene-disease validity was not cited: just clingen-refresh fails on a checksum mismatch, and repinning was out of scope.

    Validation: just validate passed; just validate-terms passed; just count-verified-snippets 165/165. check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading (after removing one item that graded a Gai sentence two ways), check-reference-titles, check-folded-hyphens and check-genereviews (TAGGED) all passed. list-disconnected-phenotypes reports 33/34 phenotypes connected.

  details: |
    Independent fresh-context audit (adversarial cross-check of a self-reviewed PR), merged with the ai4c-reviewer CHANGES_REQUESTED findings.

    REVIEWER IMPORTANT 1 - third prevalence record was a proportion, not an occurrence measure. The record gave "approximately 11 percent of cancer diagnoses in children, adolescents and young adults" with population set to a denominator of diagnoses rather than a cohort, measure_type UNKNOWN, and prevalence_class RARE that its own snippet did not support. Agreed and removed the record from prevalence entirely, relocating the figure and the reasoning to the entry-level notes. The age skew it described is still modeled in progression.

    REVIEWER IMPORTANT 2 - epigenetic arm absent from the pathograph. Agreed and closed. The blocker the entry had disclosed (only an abstract was cached and no quotable sentence carried the methylation claims) was resolved by locating and caching the Children's Oncology Group epigenome-wide study, PMID:30287918, 154 paediatric germ cell tumours. Added a Histology-Determining Epigenetic Reprogramming pathophysiology node upstream of Divergent Germinomatous and Non-Germinomatous Differentiation, carrying the 8,481-DMR histology-partitioning result and the germinoma-hypomethylation direction, wired in from the primordial germ cell transformation node. Evidence is deliberately mixed strength: the two descriptive results are SUPPORT, while the developmental-rationale sentence and the causal edge itself are PARTIAL, because a cross-sectional methylation-histology association cannot establish that methylation is upstream of the differentiation choice rather than a consequence of it. Scope caveat recorded on the node: the COG cohort is paediatric germ cell tumours at all sites, not ovary-restricted. Still unmodeled and disclosed: the IGF2/H19 imprinting-control claim and the miR-371-373 / miR-302-367 cluster biology.

    FOUND BY INDEPENDENT AUDIT:
    1. All four differential_diagnoses carried no disease_term, leaving the entry's boundaries unqueryable. Bound to MONDO:0005140 ovarian carcinoma, MONDO:0003820 mature ovarian teratoma, MONDO:0004319 hypercalcemic type ovarian small cell carcinoma, MONDO:0002227 ovarian lymphoma.
    2. While adding the epigenetics node, GO:0006306 "DNA methylation" was initially selected and is OBSOLETE in the current GO release (its label is now "obsolete DNA methylation"). Caught by the repository pre-edit validation hook and replaced with GO:0040029 epigenetic regulation of gene expression. Recording it because it is a live example of the failure mode this audit was looking for: an identifier that reads as obviously correct and would have been copied straight through from a plausible term name.

    NOT ADDRESSED, with reasoning:
    - Reviewer suggestion 3 (rate_per_100000 0.4 versus the snippet's 4:100,000): the normalisation is sound and already disclosed in notes; changing it would require a source stating the per-million figure directly, which is a new-evidence task rather than a repair.
    - Reviewer suggestions 4 to 7 (frequency upgrades from the Saani full text, salvage TIP and VeIP, AKT1 and 20q genetic entries, ascites and nausea phenotypes, NCT02582697, a models section): all real content gaps, all requiring new source fetching and verification. Left for a follow-up curation pass rather than rushed into an audit commit.
    - Fourteen downstream edges carry no edge-level evidence. Flagged, not fixed: adding edge evidence wholesale risks manufacturing support, and the node-level evidence is complete.
    - All twelve phenotypes have no incoming causal edge. Flagged for the author rather than fixed, since wiring them correctly is a modelling decision rather than a repair.

    VERIFICATION PERFORMED: all ontology identifiers re-resolved with OAK and definitions read, not just labels. All 108 original evidence snippets checked against the cached references with a normalisation ladder distinguishing line-wrap differences from real character substitution; zero character substitutions. All reference_title values diffed against the cached paper titles; no misattributions.

    Agreeing with the reviewer's explicit non-findings after independent check: HP:0031925 Rosette and HP:0001298 Encephalopathy for anti-NMDAR encephalitis are both correct as curated, the latter being the right general-term-plus-caveat pattern given HPO has no autoimmune-encephalitis class (HP:0002383 is Infectious encephalitis and would be wrong).

    VALIDATION: just validate, just validate-terms and just validate-references all pass. 111/111 snippets verified. Weighted compliance 89.5 to 89.6 percent.

  details: |
    Created the umbrella root entry for malignant germ cell tumor of ovary, MONDO:0018171, for issue #7464 with recommended_action CURATE_ROOT_WITH_SUBTYPES. Deep research provider: Edison/Falcon via 'just research-disorder falcon'; report at research/Malignant_Germ_Cell_Tumor_of_Ovary-deep-research-falcon.md with its citations sidecar and one Edison artifact table. The Falcon report exposed DOIs rather than PMIDs, so each source DOI was resolved to a PMID via the PMC ID Converter and fetched with 'just fetch-reference' before use; no snippet was taken from the DR text itself. Named Entity Confusion preflight passed - the report's subject entity, gene and marker set of KIT, chromosome 12p, OCT3/4 and SALL4, and its Orphanet:35807 framing all match MONDO:0018171. Lump/split boundary: this page is deliberately complementary to the pre-existing Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary entry for MONDO:0016096, plus Yolk_Sac_Tumor and Mixed_Germ_Cell_Tumor. Mechanism is curated on the shared MOGCT axis - primordial germ cell origin with retained pluripotency, chromosome 12p gain, lineage-specific AFP/beta-hCG/LDH marker secretion, bulky unilateral mass, and platinum chemosensitivity - plus the dysgerminoma arm and the dysgenetic gonad with Y-chromosome predisposition, neither of which had any existing dismech coverage. Content curated: 12 pathophysiology nodes each with biological_scale and role, 6 has_subtypes with ovarian-specific MONDO bindings, 12 phenotypes, 4 histopathology findings, 4 biochemical markers, 5 genetic records, 3 diagnosis records, 9 treatments including BEP and JEB regimen_term bindings with therapeutic_agent and therapeutic_modality, structured prevalence with no deprecated percentage field, 4 differential diagnoses and 2 clinical trials. Three pathophysiology nodes declare conforms_to across all three nodes of the sustaining_proliferative_signaling module. A self-review pass against the dismech-pr-review skill was run before opening the PR and its findings were fixed in place: the reported '4:100,000' incidence was normalized to 4 per 1,000,000 because the printed figure was internally inconsistent with the age-specific pediatric rate and the deep-research report had flagged it; the anti-NMDA receptor encephalitis phenotype was scoped to the Immature Teratoma subtype, downgraded to PARTIAL and annotated because the defining series was predominantly mature (benign) teratoma; unquotable 87 and 85 percent frequency figures were removed and both bands downgraded from VERY_FREQUENT to FREQUENT; the dysgerminoma morphology finding was re-evidenced against a 140-case series, PMID:33577182; the immature-teratoma and mixed subtype bindings were moved to ovarian-specific MONDO terms; HP:0033400 Acute abdomen and NCIT:C16768 Karyotyping replaced looser bindings; and dissemination, growth-factor-independent proliferation and platinum-resistant relapse nodes plus salvage treatments were added. Validation: 'just validate', 'just validate-terms' and 'just validate-references' all pass, with 108 of 108 snippets verified against cached references, and weighted compliance of 89.5 percent.

  details: |
    Created the umbrella root entry for malignant germ cell tumor of ovary, MONDO:0018171, for issue #7464 with recommended_action CURATE_ROOT_WITH_SUBTYPES. Deep research provider: Edison/Falcon via 'just research-disorder falcon'; report at research/Malignant_Germ_Cell_Tumor_of_Ovary-deep-research-falcon.md with its citations sidecar and one Edison artifact table. The Falcon report exposed DOIs rather than PMIDs, so each source DOI was resolved to a PMID via the PMC ID Converter and fetched with 'just fetch-reference' before use; no snippet was taken from the DR text itself. Named Entity Confusion preflight passed - the report's subject entity, gene and marker set of KIT, chromosome 12p, OCT3/4 and SALL4, and its Orphanet:35807 framing all match MONDO:0018171. Lump/split boundary: this page is deliberately complementary to the pre-existing Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary entry for MONDO:0016096, plus Yolk_Sac_Tumor and Mixed_Germ_Cell_Tumor. Mechanism is curated on the shared MOGCT axis - primordial germ cell origin with retained pluripotency, chromosome 12p gain, lineage-specific AFP/beta-hCG/LDH marker secretion, bulky unilateral mass, and platinum chemosensitivity - plus the dysgerminoma arm and the dysgenetic gonad with Y-chromosome predisposition, neither of which had any existing dismech coverage. Content curated: 9 pathophysiology nodes each with biological_scale, 6 has_subtypes with ovarian-specific MONDO bindings, 12 phenotypes, 4 histopathology findings, 4 biochemical markers, 5 genetic records, 3 diagnosis records, 7 treatments including BEP and JEB regimen_term bindings with therapeutic_agent and therapeutic_modality, structured prevalence with no deprecated percentage field, 2 differential diagnoses and 2 clinical trials. Two pathophysiology nodes declare conforms_to against the sustaining_proliferative_signaling module. Validation: 'just validate', 'just validate-terms' and 'just validate-references' all pass, with 95 of 95 snippets verified against cached references, and weighted compliance of 90.8 percent.

  summary: 'Create: ISCU Myopathy (MONDO:0009706)'
  details: |
    De novo curation of ISCU myopathy (hereditary myopathy with lactic acidosis; myopathy with deficiency of SDH and aconitase; Swedish exercise-intolerance myopathy), autosomal recessive Fe-S cluster biogenesis defect. Node chain: ISCU deep-intronic founder splice variant (c.418+382G>C) -> cryptic splice-site activation and pseudoexon inclusion (truncated ISCU) -> skeletal-muscle-predominant ISCU protein deficiency (tissue-specific mis-splicing; PTBP1/MyoD) -> failure of mitochondrial Fe-S cluster assembly -> deficiency of Fe-S enzymes aconitase and complex II (SDH) -> impaired OXPHOS/TCA flux -> (branches) compensatory glycolysis and lactate accumulation; mitochondrial iron overload and oxidative stress; PGC-1alpha remodeling and FGF21 secretion -> muscle energy failure on exertion -> exertional rhabdomyolysis and myoglobinuria; edges to phenotypes exercise intolerance, exertional dyspnea, tachycardia, myalgia, muscle weakness, lactic acidosis, elevated lactate, rhabdomyolysis, myoglobinuria. Lump/split: single DISEASE entry; the rarer compound-het intronic+p.Gly50Glu (Kollberg 2009/Saha 2014) and de novo dominant p.Gly96Val (Legati 2017) alleles recorded in genetic notes, not split. No module conformance (mitochondrial_dysfunction is an aging module; not appropriate). Provider: Edison/Falcon deep-research report (research/ISCU_Myopathy-deep-research-falcon.md); it cites by author-year/DOI. DOIs resolved to PMIDs via idconv; two report-prose PMIDs were WRONG and corrected before use (Mochel 2008 AJHG is 18304497 not 18296749 which is Olsson 2008 HMG; Holmes-Hampton 2016 ASO is 28007899 not 27729411 which is an unrelated K-channel paper). GeneReviews PMID:20301757 used as clinical baseline and tagged GeneReviews with retired-status noted. PMIDs used: 20301757, 18304497, 18296749, 19567699, 21196119, 21165651, 23035118, 23943793, 24573684, 28007899, 30209894, 1918374. Unsourced/contentious: no exact-quote abstract for the ~1:188 carrier frequency or a serum CK value, so prevalence rate is left UNKNOWN/ULTRA_RARE with a notes caveat and CK biochemical carries context only. Validation: just validate PASS; count-verified-snippets 46/46; validate-terms PASS; check-entity-refs OK; check-causal-targets OK (no new); check-duplicate-keys/enum-values OK; validate-disorders 46/46 PASS; folded-hyphens/snippet-length/title-snippets/snippet-grading not flagged for this file; pytest test_data.py -k ISCU 23 passed; compliance 78.4%.

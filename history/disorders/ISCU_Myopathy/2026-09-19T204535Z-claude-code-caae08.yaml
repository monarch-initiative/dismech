  summary: 'Address review: diagnosis, histopathology, oligonucleotide slots'
  details: |
    Review-fix session on PR 12104. Treatments: the deprecated aso_details/aso_mechanism/aso_chemistry slots on the splice-switching ASO treatment were renamed to oligonucleotide_details/oligonucleotide_mechanism/oligonucleotide_chemistry, the mechanism set to SPLICE_MODULATION_EXON_SKIPPING (the ASO suppresses pseudoexon inclusion), the introduction-derived enzymology quote from PMID:28007899 tagged quote_role BACKGROUND, and the description now records that the Holmes-Hampton 2016 18-mer carries mixed 2'-MOE and constrained-ethyl chemistry with only the 2'-MOE component in the chemistry slot. Added a diagnosis section with four entries bound to NCIT clinical-intervention terms: molecular genetic testing (NCIT:C15709) quoting the GeneReviews diagnostic sentence verbatim plus Legati 2017 (PMID:29079705) full text on exome capture missing deep-intronic alleles and targeted screening of the founder intronic region; RNA analysis for pseudoexon inclusion (NCIT:C18473) quoting Olsson 2008, Kollberg 2009 and Legati 2017; muscle biopsy (NCIT:C51895) with the pathognomonic histochemical/biochemical phenotype and the post-rhabdomyolysis regeneration timing caveat from Kollberg 2011; and cardiopulmonary exercise testing (NCIT:C116517) quoting Haller 1991. Added a histopathology section (SDH-negative fibres and iron accumulation in muscle fibres flagged diagnostic, type I fibre predominance with increased capillary density non-diagnostic), finding_term left as free text because NCIT has no histochemical-SDH or muscle-iron finding term; ragged-red fibres/mitochondrial proliferation deliberately not recorded (absent in the dominant case, no cached source for classic disease). Added an FGF21 biochemical marker (NCIT:C112280) as a READOUT_OF the PGC-1alpha/FGF21 node quoting Crooks 2014, with a note that it is class-level not disease-specific. Added a notes line on Calf muscle hypertrophy recording that its mechanism is unsettled and no causal edge is drawn. New reference cache references_cache/PMID_29079705.md; term caches gained NCIT:C116517 and NCIT:C18473. Validation: just validate passed; count-verified-snippets 66/66; validate-terms passed; normalize-cache clean; check-entity-refs, check-causal-targets, check-enum-values OK; check_snippet_length --against-ref origin/main, check-snippet-grading, check-title-snippets report no new findings; validate-disorders passed with 66/66 snippets verified.

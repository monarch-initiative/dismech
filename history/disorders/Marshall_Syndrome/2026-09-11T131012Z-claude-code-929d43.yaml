  summary: 'Review round 1: GeneReviews mining, term specificity, cataract surgery,
    classifications'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11680. All three blocking items taken, four of five suggestions taken, one declined on a schema limitation and one deferred to a follow-up PR as the reviewer proposed. Bundled into a single push per the repo's one-push convention.

    BLOCKING, all taken.
    - GeneReviews (PMID:20301479, already cached on main) is now mined. Management quotes added to the retinal, auditory and orthopaedic treatments; the 50 per cent transmission-risk quote added to the autosomal dominant inheritance block; and the agents-to-avoid recommendation modeled as a new environmental: block - contact sports as an EXACERBATES link onto Vitreoretinal Collagen Matrix Defect, following the pattern in Stickler_Syndrome_Type_2. Every GeneReviews item carries directness: INDIRECT with a stated reason: the chapter covers COL11A1 but is written for Stickler syndrome, and no Marshall-specific chapter exists. EXACERBATES rather than the TRIGGERS used by STL2, because the exposure acts on a lesion the collagen defect has already created rather than initiating one.
    - CL:0000138 chondrocyte replaced with CL:1000217 growth plate cartilage chondrocyte.
    - Cataract surgery added as a treatment (NCIT:C157809) with a target_phenotypes join to Cataract, resolving the contradiction with the phenotype description.

    SUGGESTIONS.
    - Taken: fibrochondrogenesis (MONDO:0016068) and autosomal recessive Stickler syndrome (MONDO:0031047, type 6 / COL9A3) added as differentials; skeletal radiography added to diagnosis; the ~50 per cent collagenopathy-panel diagnostic yield added to the sequencing diagnosis, framed as what a negative panel does and does not exclude; classifications.isds_skeletal_category set to type_11_collagen, sourced from the enum's own description in src/dismech/schema/classifications/isds_skeletal_nosology.yaml, which cites PMID:31633310 and names Marshall syndrome explicitly.
    - CORRECTION, made in the same round: the OMIM mapping was initially declined on the grounds that the schema had nowhere to put it. That was wrong. external_assertions carries OMIM and ORPHA identifiers structurally with external_id, 89 disorder entries on main already use it for OMIM, and issue #9922 withdrew a proposal to add omim_mappings on exactly that ground. OMIM:154780 (phenotype) and OMIM:120280 (COL11A1 gene) are now recorded as external_assertions. The original error is the same one #9922 names: treating absent from the class I checked as absent from the schema. Original reasoning, now superseded: the OMIM mapping. DiseaseMappings has icd10cm, icd11f, mondo and ncit slots only, and a search of dismech.yaml found no OMIM slot anywhere in the schema, so there is nowhere to put OMIM 154780. Recorded in the entry notes as prose and reported to the reviewer as a schema gap rather than worked around.
    - Deferred: the Type XI Collagenopathies grouping, which the reviewer themselves scoped to a follow-up PR.

    Used MONDO:0031047 (Stickler syndrome, type 6) for the recessive differential rather than the reviewer's general 'autosomal-recessive Stickler' framing, because runoak shows MONDO:0016647 'autosomal recessive Stickler syndrome' is obsolete and the cited paper (PMID:33570243) is a COL9A3 family.

    Validation: just validate-disorders clean, 63/63 snippets verified (up from 50/50); schema, terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, reference-titles, environmental-evidence, snippet-grading and title-snippets all OK.

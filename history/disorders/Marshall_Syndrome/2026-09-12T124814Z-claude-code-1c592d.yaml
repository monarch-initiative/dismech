  summary: 'Review round 2: retarget the trauma exposure, complete GeneReviews mining'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review (round 2) on PR #11680. Both blocking items and both actionable suggestions taken in a single bundled push.

    BLOCKING.
    - The ocular/head trauma exposure was attached to 'Vitreoretinal Collagen Matrix Defect' with EXACERBATES. The reviewer is right that this is one node too far upstream: the matrix defect is what the COL11A1 allele made it, and trauma cannot worsen it. Retargeted to the 'Retinal detachment' phenotype node with TRIGGERS and causal_link_type DIRECT, and rewrote the link description accordingly. My round-1 rationale for EXACERBATES over TRIGGERS was answering the wrong question: against the detachment the exposure genuinely initiates the event. This also makes the entry consistent with Stickler_Syndrome_Type_2, which attaches the same exposure to the same node.
    - GeneReviews mining completed. Added the DIAGNOSIS/TESTING sentence to the COL11A1 sequencing diagnosis entry, which is the authoritative statement that molecular testing establishes the diagnosis and that COL11A1 is one of the genes it is established on. Added the CLINICAL CHARACTERISTICS sentence to the sensorineural hearing phenotype, with an explanation noting that the chapter reports hearing loss as both conductive and sensorineural while this node is the sensorineural component specifically. Both graded directness INDIRECT because the chapter is written for Stickler syndrome rather than under the Marshall eponym.
    - Added tags: [GeneReviews] to the PMID:20301479 references entry. My round-1 note claimed Stickler_Syndrome_Type_2 on main does not carry that tag. That was wrong - it does, at lines 31-34 - and 1091 entries in kb/disorders use the tag. The claim was made without checking and should not have been made.

    SUGGESTIONS TAKEN.
    - Recorded the ECTO search on the environmental entry: trauma, injury, mechanical and physical exposure and sport terms were searched, ECTO:6000002 and ECTO:6000031 are exposure to exercise and to strenuous exercise, neither of which means blunt ocular or head trauma, so none is bound. Copied the pattern from Stickler_Syndrome_Type_2 so the next curator does not repeat the search.
    - Added an evidence item to the ISDS classification assignment, and deliberately scoped it narrowly. The PMID:31633310 abstract does not name the type 11 collagen group or place Marshall syndrome in it; it establishes that the nosology sorts 461 disorders into 42 groups on clinical, radiographic and molecular phenotype. The snippet is cited for that framework and the explanation says plainly that the group assignment itself comes from the nosology's full-text group table, which is not in the cached record. Quoting a true sentence as though it supported the specific group membership would have been the defect this repo warns about rather than a strengthening.

    NOT TAKEN.
    - The Type XI collagenopathies grouping remains a follow-up. The reviewer agrees it is out of scope for this PR; with fibrochondrogenesis now modeled as the recessive contrast, Marshall, STL2 and fibrochondrogenesis are three mechanistic outcomes at one locus, which is a cleaner basis for it than existed last round.

    Validation: 66/66 snippets verified (up from 63/63); schema, terms, entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, environmental-evidence, snippet-grading and title-snippets all pass.

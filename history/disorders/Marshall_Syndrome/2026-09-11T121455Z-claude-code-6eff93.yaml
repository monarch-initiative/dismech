  summary: 'Create: Marshall Syndrome'
  details: |
    De novo curation of Marshall syndrome (MONDO:0007949, COL11A1) from a single openscientist deep-research report (research/Marshall_Syndrome-deep-research-openscientist.md, preflight-dr PASS against MONDO:0007949, 22/22 references verified by the provider's own validation) plus direct reading of every cited reference in references_cache/.

    Pathograph: heterozygous 54-bp C-terminal exon splice variant -> in-frame exon skipping -> shortened proalpha1(XI) chain -> dominant-negative poisoning of the collagen XI heterotrimer -> defective heterotypic collagen II/XI fibril assembly, branching to growth-plate cartilage, vitreoretinal matrix and membranous labyrinth. Recorded functional_impact_category DOMINANT_NEGATIVE rather than a loss-of-function framing, because the in-frame/in-register argument is what makes the allele harmful rather than null.

    Nosology: the Marshall vs Stickler type 2 split is recorded rather than asserted. A published statement that the two are one entity is curated as supports: REFUTE against the separate-entity claim, and an OPEN KNOWLEDGE_GAP discussion states what evidence would settle it.

    A HUMAN_MODEL_MISMATCH discussion records that both available animal models (cho/cho mouse, col11a1a zebrafish morphant) are loss-of-function nulls while the human disorder is dominant-negative, with a proposed heterozygous knock-in experiment.

    Several evidence items carry directness: INDIRECT because the study populations are neighbouring collagenopathies (Stickler cohorts for retinal prophylaxis and auditory natural history, COL11A2 OSMED for the arthropathy) rather than Marshall syndrome itself.

    Two errors caught during curation and worth recording: the deep-research report suggested HP:0000426 for depressed nasal bridge, which is Prominent nasal bridge (the opposite sign); the correct term is HP:0005280. Separately, two MONDO CURIEs written into the differential_diagnoses block from memory (MONDO:0007490, MONDO:0018230) resolved to carpotarsal osteochondromatosis and skeletal dysplasia; linkml-term-validator caught both and they were replaced with MONDO:0007160 and MONDO:0044206 read from the term cache and the stub queue.

    Validation: just validate (schema + terms) clean; just validate-disorders clean with 50/50 snippets verified against cached references; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (offline and --resolve), check-enum-values and check-reference-titles all OK.

  summary: 'Create: Intellectual Disability, Anterior Maxillary Protrusion, and Strabismus
    (MRAMS, SOBP)'
  details: |
    De novo curation of MRAMS syndrome (MONDO:0013353, OMIM:613671, SOBP / hgnc:29256). Deep research was run with two providers, falcon (Edison) and claude_code; both reports are committed under research/. Both were treated as leads only and every claim was re-verified. Falcon proposed several incorrect ontology identifiers (e.g. NCIT:C15329 labelled as Supportive Care when it is Surgical Procedure) which were discarded in favour of independent OAK lookups; claude_code supplied block quotations attributed to PMID:34414417 that are absent from that abstract, which were also discarded. The claude_code c.1981C>T (p.Arg661Ter) HGVS nomenclature was independently confirmed against the ClinVar variant record before use, and no ClinVar pathogenicity classification was claimed because none is asserted there. NEC preflight passed: the MONDO:0013353 identity anchors (causal gene SOBP via RO:0004003, OMIM:613671 xref, MRAMS synonym) all match the curated content. No GeneReviews chapter exists for SOBP or for this disorder, so the HPO annotation set for OMIM:613671 was used as the phenotype baseline alongside the two primary papers (PMID:17618476 clinical delineation, PMID:21035105 gene identification). Content: eight pathophysiology nodes spanning MOLECULAR to ORGANISM scale with evidence-bearing causal edges, eight phenotypes with frequency bands derived from the 7-sibling kindred counts, a variant record, three diagnosis entries, seven treatments, and three discussions (one HUMAN_MODEL_MISMATCH on the mouse-versus-human cochlear severity gap, two KNOWLEDGE_GAP on SOBP-BOR candidacy and on intrafamilial expressivity). Module conformance to pharyngeal_arch_patterning_serial_homology was considered and deliberately declined; the rationale is recorded in notes. An Orphanet ORPHA:562559 cache file was generated but then removed because the upstream XML had drifted from its pinned checksum and the record was incomplete. Validation: just validate passed, just validate-terms passed, just validate-references verified 64/64 snippets across 8 cited references, compliance 85.7 percent.

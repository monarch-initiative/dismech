  summary: Take four optional suggestions from the approving review
  details: |
    Third round. The automated review APPROVED the entry with no critical or important findings and six optional suggestions; four were taken, two declined with the reasoning recorded in the entry.

    Taken:

    1. evidence_source on a background literature statement. The snippet 'FOXP3 expression is known to be regulated by canonical NF-kappaB signaling' was graded HUMAN_CLINICAL. It is the authors summarising established literature in their discussion, not an observation in their patients. Regraded OTHER, with the reason in the explanation.

    2. A snippet naming two evidence sources in one sentence. 'One possible explanation is the increase in thymic T reg cells, observed in the mouse model, and increased FOXP3 expression in the proband.' was graded HUMAN_CLINICAL while citing a mouse observation and a human one together. Regraded OTHER rather than split: it is a single interpretive claim, and splitting would mean quoting half a hypothesis. The reasoning is recorded in the explanation so a later curator does not undo it.

    3. An unevidenced mechanistic claim. The Ectodermal dysplasia description asserted that 'NF-kappaB signalling is required for ectodermal appendage development'. True and uncontroversial, but a distinct claim from the phenotype observation and carrying no citation of its own. Reworded to state the co-occurrence as a recognised presentation of NF-kappaB pathway disorders while saying outright that the developmental step is not evidenced here, and that this is why no causal edge is drawn to the phenotype.

    4. Pathograph connectivity for the autoinflammatory arm. Added an INDIRECT_UNKNOWN_INTERMEDIATES edge from Enhanced Canonical NF-kappaB Signalling to Eczematoid dermatitis, with a description stating that the cells and cytokines between the signalling change and the skin lesion are not established in this disorder.

    Declined, with reasons now recorded in the entry notes rather than left implicit:

    5. A serum biomarker panel quotable from PMID:36378426 (increased pro-inflammatory chemokines associated with macrophage recruitment). Declined because that panel was measured in the patient carrying the in-trans E518K/T559M genotype that the rest of the entry quarantines; importing it would reintroduce the scope problem the entry works to avoid. The reviewer independently reached the same conclusion and asked only that the reasoning be on the record.

    6. Causal edges to Ectodermal dysplasia and Autoimmune hemolytic anemia. Declined: the first would assert the developmental mechanism removed under item 3, and the second belongs to the compound-heterozygous case. The reviewer agreed AIHA is better left detached.

    Also declined: adding HP:0005415 Decreased circulating total T cell count, which the reviewer itself rated low value as largely subsumed by the curated lymphopenia and naive-T terms.

    Note on sequencing: this push follows an approving review and therefore resets it under dismiss_stale_reviews. Taken deliberately - items 1, 2 and 3 are evidence-discipline defects in permanent KB content, and CLAUDE.md asks that optional suggestions be addressed where they improve quality. All four changes were batched into a single push to cost one re-review cycle rather than several.

    Separately, Harry Caufield merged main into this branch at 15:50Z, bringing in three unrelated curations. The entry was revalidated against the merged tree before and after these changes.

    Validation: just validate (schema + terms + 61/61 snippets), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens and check-reference-titles all pass. No baseline widened.

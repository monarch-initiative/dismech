  summary: 'Address pre-PR red-team review: kinase-domain error, in-trans genotype,
    evidence gaps'
  details: |
    Second round on the same entry, responding to an adversarial pre-PR review run against the dismech-pr-review skill. It returned one blocking finding, fifteen important ones and several minor ones; all were addressed.

    Blocking finding, and it was a real factual error: the entry asserted that p.Thr559Met is a kinase-domain variant, in four prose slots plus a pathophysiology node name. PMID:36378426, which the entry already cited, says plainly that 'Both the E518K and T559M are located between the leucine-zipper and NEMO-binding regions'. Verified against the cache before fixing. Those two variants are now excluded from the kinase-domain allele series with the reason stated, and the top-level description no longer defines the disease as kinase-domain-only.

    Related scope correction: the E518K/T559M patient carried the two variants IN TRANS, one from each asymptomatic parent, which is a compound heterozygous genotype rather than the single dominant allele that defines IMD15A. The entry had said only 'two heterozygous variants', which reads as one allele. Now stated explicitly in the phenotype description, phenotype notes and treatment notes - it is the largest remaining scope caveat and it was understated in the direction that made the case look more like IMD15A than it is.

    Other scope leak fixed: the differential's TREC explanation asserted that neither IKBKB disorder is caught by newborn screening, but the TREC data are from the loss-of-function cohort only. Rewritten to scope the claim to IMD15B and say TREC data have not been reported for IMD15A.

    Claim-evidence mismatches fixed, each with a better quote already present in a cached file: the autoimmune haemolytic anaemia phenotype now quotes the sentence naming AIHA rather than the genus 'autoimmune cytopenias'; the ectodermal dysplasia phenotype now quotes the founding proband's 'dental abnormalities consistent with ectodermal dysplasia' rather than a sentence about 'epithelial defects'; the variant-to-substrate edge no longer claims receptor-independence on the strength of a TNF-stimulated experiment, and cites the patient-PBMC baseline measurement for the resting arm.

    Model-organism-only support removed from two nodes that make human claims: 'Constitutive IkappaB-alpha Phosphorylation' and 'Increased Regulatory T Cell Output' each gained the corresponding human observation from the same paper.

    evidence_source consistency: four ex vivo patient-cell functional assays were split between IN_VITRO and HUMAN_CLINICAL within the same nodes; all four are now IN_VITRO. check-snippet-grading cannot catch this because it keys on the quoted sentence and these are different sentences. The authors' interpretive sentence spanning human and mouse observations is regraded OTHER rather than carrying two evidence sources in one item.

    supports: REFUTE on the open-question discussion changed to SUPPORT. supports is scoped to the claim the item is attached to; that claim is the discussion prompt - that the reconciliation is unresolved - which the counterexample strengthens rather than contradicts. The nuance stays in the explanation.

    Ontology corrections: the NF-kappaB signalling node was bound to CD4-positive alpha-beta T cell where the evidence says only 'T cell compartment' and the assay covered fibroblasts, T and B cells - now CL:0000084. The naive T cell depletion node was bound to CD8 only where the evidence says both compartments - now both CL:0000624 and CL:0000625.

    Additions: the pathograph was fragmented, with seven phenotypes having no incoming edge and 1 of 11 causal edges carrying evidence. Recurrent respiratory infections now has sequelae to bronchiectasis and recurrent otitis media; the B cell and T cell nodes connect to Combined immunodeficiency and to the infection and candidiasis phenotypes, with causal_link_type marking the inferential ones. Added an IUIS combined-immunodeficiency classification, a MONDO exactMatch mapping, a diagnosis record covering the sequencing route and functional confirmation, and a second animal model - the K171R activation-loop knock-in from PMID:32554083, held at MODERATE fidelity because only a brief abstract is available. The immunoglobulin treatment moved from generic NCIT:C15986 Pharmacotherapy to NCIT:C121331 Intravenous Immunoglobulin Therapy with NCIT:C80829 as therapeutic_agent, and gained a target_mechanisms link.

    Minor: removed a trailing period that made one snippet a non-literal substring; corrected a notes claim that features were omitted 'for want of a quotable source' when quotable sentences exist and the real reason is single-patient scope; regraded the Fukumura somatic-tumour citation from IN_VITRO to OTHER with directness INDIRECT.

    The review confirmed the 15A/15B firewall held - no loss-of-function source is used as a gain-of-function claim anywhere outside differential_diagnoses - and independently verified the no-GeneReviews-chapter claim, the HP:0001890 versus HP:0001878 choice, the PMID:10229185 mouse-lethality claim, and that all reference titles match their caches.

    Validation after fixes: just validate (schema + terms + 61/61 snippets), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and check-environmental-evidence all pass. Weighted compliance 86.6%, down from 90.4% because the added edges and sections enlarged the denominator.

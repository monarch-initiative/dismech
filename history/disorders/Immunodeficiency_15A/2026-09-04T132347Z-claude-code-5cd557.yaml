  summary: 'Create: Immunodeficiency 15A (IKBKB gain-of-function)'
  details: |
    New Mendelian entry for IKBKB gain-of-function combined immunodeficiency (MONDO:0032599), curated from a claude_code deep-research run (research/Immunodeficiency_15A-deep-research-claude_code.md, 370s, 15 web searches, 33 turns) plus the primary literature.

    No GeneReviews chapter exists for IKBKB - a PubMed search for 'IKBKB GeneReviews[All Fields]' returns nothing - so the mandatory GeneReviews phenotype baseline is unavailable for this entry and no substitute was claimed.

    The dominant risk on this disease is scope confusion between two disorders caused by the same gene in opposite directions: IMD15A is autosomal dominant gain-of-function (PMID:30337470, PMID:40403933, PMID:36378426), while IMD15B is autosomal recessive loss-of-function (PMID:24369075, PMID:30391351). Every IMD15B source is confined to differential_diagnoses. In particular the research report cited the IKBKB transplant cohort (PMID:30391351) toward treatment, but that cohort is 16 patients homozygous for c.1292dupG - IMD15B - so it is not used as treatment evidence here. Treatment coverage is consequently one documented immunoglobulin course in a single gain-of-function patient, and the entry notes say so rather than padding the section.

    Report validation: reference validation 8/8 resolved, 0 unresolved, needs_review true on one off-topic flag; term validation 38/41 resolved with 4 mislabelled CURIEs and 1 obsolete. The off-topic flag (PMID:10229185, the IKK-beta knockout mouse) was a false positive from vocabulary mismatch and was read rather than dismissed - it establishes that mouse Ikbkb nulls die at E14.5 while humans homozygous for a null survive with immunodeficiency, recorded in notes as a species asymmetry belonging to the loss-of-function disorder rather than modelled as a human/model mismatch here. Mislabelled CURIEs were rejected: the report offered HP:0001878 labelled 'AIHA' (HP calls it Hemolytic anemia); the entry uses the more specific HP:0001890 Autoimmune hemolytic anemia. HP:0010976 and HP:0002164 were offered with table-cell text as labels and not used. The obsolete GO:0002741 was not used.

    One label correction found by validation: the local OAK hp build gives HP:0030374 as 'Decreased proportion of memory B cells' while the OLS adapter the validator uses gives 'Decreased memory B cell proportion'; the canonical OLS label is used.

    Content: a seven-node causal chain from the kinase-domain variant through constitutive IkappaB-alpha phosphorylation and enhanced canonical NF-kappaB signalling to a lowered lymphocyte activation threshold, branching to naive T cell depletion and impaired B cell differentiation, with increased regulatory T cell output as a parallel arm. 12 phenotypes, 1 treatment, 1 animal model (the CRISPR orthologous V203I knock-in) with two pathograph links and readouts, an autosomal dominant inheritance block, a progression record for the age-dependent decline, the IMD15B differential, and an OPEN_QUESTION discussion recording the central unresolved paradox - how a hyperactivating allele produces deficiency - including a REFUTE evidence item for the patient who had the deficiency without the regulatory T cell expansion.

    Scope discipline: no prevalence band or rate (16 patients from 4 families recorded as CASES_IN_LITERATURE with prevalence_class UNKNOWN); no frequency band on lymphopenia because the two available series describe fixed versus age-dependent patterns and a single band would misdescribe one; single-patient features from the founding case reports (cataracts, hidradenitis suppurativa, hepatosplenomegaly, CMV colitis) left uncurated with the reason recorded.

    Validation: just validate (schema + terms + 49/49 snippets), just validate-disorders (the batched CI gate), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-reference-titles all pass. Weighted compliance 90.4%. The stubs entry was deleted.

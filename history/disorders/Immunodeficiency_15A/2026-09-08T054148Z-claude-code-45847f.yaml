  summary: 'Review round 2: prevalence tier, model_scale, notes de-duplication'
  details: |
    Took all three optional suggestions from the 2026-09-08 re-review (approving, no blocking findings).

    1. prevalence_class UNKNOWN -> ULTRA_RARE. The record is measure_type CASES_IN_LITERATURE with 16 patients from 4 families and no rate_per_100000. PrevalenceClassEnum documents ULTRA_RARE as the tier for 'only a handful of reported cases, with no population rate available. Often paired with measure_type CASES_IN_LITERATURE', and the schema states the qualitative tiers presuppose that no numeric estimate was given. So declining a numeric band never entailed declining the qualitative tier. The entry also contradicted itself: prevalence[0].evidence[0].explanation already called the quote 'the basis for describing this as an ultra-rare disorder' while the slot said UNKNOWN, which is how a later curator ends up reversing a deliberate choice. notes now records why the tier and the declined rate are compatible.

    2. model_scale added to all three modeled_mechanisms links. The review suggested ORGANISM on all three because both knock-in mice are whole animals. That is what the models ARE; the slot records what a link OBSERVES, so blanket ORGANISM would have been wrong on two of the three. Assigned per link from the readout actually cited: MOLECULAR for Constitutive IkappaB-alpha Phosphorylation (splenocyte phospho-IkappaB-alpha to total ratio), CELLULAR for Naive T Cell Depletion (splenic CD3+ proportion and absolute count), ORGANISM for Enhanced Canonical NF-kappaB Signalling (the K171R link cites a whole-animal immunologic phenotype comparison and carries no cellular or molecular readout). Result is two ALIGNED and one MODEL_ABOVE_TARGET; none is upward extrapolation, so no limitations or divergences requirement is triggered and model-scale-audit --strict passes.

    3. Deleted a duplicated sentence in notes. 'each is a single-patient observation rather than an established feature of the disorder' was restated three lines later; the surviving text keeps the one fact the second copy added, that the founding proband's full presentation is preserved under the Eczematoid dermatitis phenotype.

    No evidence item, snippet, reference or ontology binding changed. Validation on the edited tree: validate-disorders clean with 61/61 snippets verified, validate-terms clean, check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and model-scale-audit --strict all pass.

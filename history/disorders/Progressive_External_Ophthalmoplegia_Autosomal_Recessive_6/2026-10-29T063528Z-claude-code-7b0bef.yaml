  summary: 'Create: Progressive External Ophthalmoplegia Autosomal Recessive 6'
  details: |
    De-novo curation of PEOB6 (MONDO:0957993, OMIM:620647), an autosomal recessive mtDNA maintenance disorder from biallelic RRM1 loss-of-function at Arg381. Single-source entry on PMID:35617047 (full text force-fetched); RNR-imbalance mouse model from PMID:20724444. Atomic pathograph: RRM1 LoF -> imbalanced mitochondrial dNTP pools -> impaired mtDNA replication -> multiple mtDNA deletions -> mosaic respiratory chain deficiency -> clinical features. RRM1 grounded on GO:0004748 (RNR activity). Dominant N427K excluded as a separate disease. No module conformance (no mtDNA-maintenance module; mitochondrial_dysfunction is an aging hallmark). Validated with validate-disorders and all offline gates incl. gene-activity-grounding, snippet-grading, model-scale-audit.

  summary: Added top-level description, Harrison's and mitochondrial disease classifications, full phenotype descriptions and causal wiring, and enriched diagnosis and treatments for PEOB6.
  details: Added a comprehensive disease description and classified PEOB6 under NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, and mitochondrial disease backed by PMID:35617047. Grounded pathophysiology nodes with mitochondrion (GO:0005739) cellular component, skeletal/extraocular muscle and gastrointestinal anatomical locations, smooth muscle and neuron cell types, causal_link_type annotations, and downstream wiring to peripheral axonal neuropathy and areflexia for 100% phenotype connectivity. Added descriptions to all 15 phenotypes, presence/results to diagnostic tests, and target_mechanisms and evidence to supportive care and genetic counseling treatments.

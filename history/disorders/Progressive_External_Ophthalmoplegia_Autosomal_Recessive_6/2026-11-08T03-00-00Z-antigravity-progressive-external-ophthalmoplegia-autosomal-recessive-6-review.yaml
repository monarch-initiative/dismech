  summary: Added top-level description, Harrison's and mitochondrial disease classifications, phenotype descriptions and family-scope notes, and enriched diagnosis and treatments for PEOB6.
  details: Added a comprehensive disease description and classified PEOB6 under NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, and mitochondrial disease backed by PMID:35617047. Grounded pathophysiology nodes with mitochondrion (GO:0005739) cellular component, skeletal/extraocular muscle and gastrointestinal anatomical locations, and causal_link_type annotations, marking Enteric Mitochondrial Involvement as inferred (INDIRECT_UNKNOWN_INTERMEDIATES) from the MNGIE-like presentation in family 1. Added descriptions to all 15 phenotypes, noted that gastrointestinal features were confined to consanguineous family 1, added proband 4 evidence on proximal muscle weakness, populated presence/results on diagnostic tests, and recorded honest scope on supportive care and genetic counseling.

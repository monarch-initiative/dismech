  summary: 'Review round 1: PEO6 (RRM1)'
  details: |
    Addressed the three blocking review findings plus the sound suggestions, all sourced from the cached full text of PMID:35617047. (1) Added recessive-patient phenotypes: peripheral axonal neuropathy, areflexia, diarrhea, gastrointestinal dysmotility, cachexia, generalized limb muscle atrophy. (2) Corrected the prevalence note: 5 probands from 4 families, of which 3 families carry the recessive R381 disease; proband 3 (dominant N427K) is a separate disease. (3) Added a diagnosis section (WES genetic testing NCIT:C15709, muscle biopsy NCIT:C51895 with mtDNA-deletion detection). Also: added the direct RNR-activity IN_VITRO evidence to the LoF node; made the dNTP-pool node description allele-dependent (R381H pools near-normal) with the qualifying snippet; added proband-2 reduced-mtDNA evidence to the replication node; replaced the all-proband deletions snippet with a recessive-specific one; split the gastrointestinal phenotypes onto a new Enteric Mitochondrial Involvement node rather than the skeletal-muscle respiratory-chain node; conformed the respiratory-chain node to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress (following the other MDDS entries); removed the unsourced 'Northern European' ancestry and 'sixth decade' onset. Re-validated with validate-disorders and offline gates.

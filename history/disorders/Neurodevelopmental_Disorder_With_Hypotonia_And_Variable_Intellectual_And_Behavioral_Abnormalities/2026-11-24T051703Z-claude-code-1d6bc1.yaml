  summary: 'Create: NEDHIB (POLR2A)'
  details: |
    New entry for neurodevelopmental disorder with hypotonia and variable intellectual and behavioral abnormalities (NEDHIB, MONDO:0032829, POLR2A). Deep research with claude_code (preflight-dr PASS). Pathograph models the two mechanisms the cohorts distinguish: catalytic missense variants -> dominant-negative impairment of Pol II (severe), early truncating variants -> haploinsufficiency (mild), both -> impaired neurodevelopment -> phenotypes. Evidence from Haijes 2019 (PMID:31353023, founding cohort), Hansen 2021 (PMID:33665635, full text, two-mechanism model and multisystem spectrum), plus worked cases (cerebellar atrophy 35461703, autism 35328024, dopa-responsive regression 43047756), and the ClinGen CGGV record (Definitive). Caught and fixed two deep-research errors: the report quoted a paper title as a snippet in two places (replaced with abstract sentences), and several of its HP CURIEs were verify-flagged, so every term was re-resolved against the cache or OLS before binding. 6/11 phenotypes connected; ataxia, autism, feeding, strabismus, regression left unwired (behavioural/systemic, no node-specific mechanism). No GeneReviews chapter (NO_CHAPTER). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading, check-title-snippets, check-gene-validity and validate-disorders.

  summary: 'Review round 1 remediation: fix KRAS GTPase modifier, prevalence measure_type,
    KITLG/MDM2 genetics, subtype MONDO bindings, and unbundled cisplatin resistance'
  details: |
    Addressed PR #17429 review findings: changed GO:0003924 GTPase activity modifier on KIT/RAS Signaling Activation from INCREASED to DECREASED; changed Global prevalence measure_type to UNKNOWN and dropped RARE class; removed unsourced frequency and ~10% figure from Gynecomastia; added primary GWAS KITLG (PMID:23640991, PMID:21617256, PMID:25598472) and somatic MDM2 genetic entries and grounded GCNIS with KITLG and GO:0005173; replaced mismatched PMID:36835562 snippet on Isochromosome 12p and dropped mutator-phenotype conforms_to; bound MONDO subtype_term on Seminoma (curated_in Testicular_Seminoma), Yolk Sac Tumor, Choriocarcinoma (MONDO:0005207), and Teratoma; split Cisplatin Resistance Mechanisms into TP53/MDM2, NAE1 neddylation, and promoter hypermethylation/teratomatous resistance nodes; retargeted Orchiectomy to Testicular Mass, removed Surveillance Supportive Care binding, removed duplicate Cryptorchidism phenotype while wiring environmental Cryptorchidism (PMID:23423470) to GCNIS, and added REVIEW_SYNTHESIS grading across review quotes.

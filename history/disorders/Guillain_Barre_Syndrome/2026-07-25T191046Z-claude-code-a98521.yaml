  summary: 'Claim-evidence audit: correct inverted complement evidence explanation'
  details: |
    Claim-evidence correctness audit of 10 neuroimmune entries.

    PMID:10355667 on the 'Complement-Mediated Nerve Damage' node carried the explanation 'establishing the complement-mediated mechanism of nerve damage'. The cited paper is titled '...activate the complement cascade without inducing acute conduction block in vitro' and concludes the node of Ranvier is relatively resistant to acute antibody-mediated injury, recommending in vivo models instead. The explanation therefore inverted the study's conclusion. Rewritten to state exactly what the study shows (antibody binding plus complement fixation at nodes of Ranvier) and what it explicitly does not show (resulting nerve injury). supports: PARTIAL retained.

    Set evidence_source: MODEL_ORGANISM on the same item: the preparation is ex vivo mouse sciatic nerve, previously defaulting to HUMAN_CLINICAL.

    Restored the truncated tail of the PMID:37108447 snippet ('...which often merely supports the clinical diagnosis') so it is an exact substring, and softened the corresponding explanation from 'Confirms' to reflect the source's hedge.


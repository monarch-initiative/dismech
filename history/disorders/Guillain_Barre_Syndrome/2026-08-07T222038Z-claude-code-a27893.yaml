  summary: Link antecedent infections to the mimicry node
  details: |
    Backfill for issue #8085. All three antecedent infections target the molecular mimicry and antiganglioside antibody node, and they split on whether the cited sentence names the route. Campylobacter jejuni is TRIGGERS with DIRECT because its snippet states the mimicry between sialylated bacterial lipooligosaccharide and nerve ganglioside epitopes outright, which is this node's own mechanism. Cytomegalovirus and Zika virus are graded identically to each other at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because one rests on a list of frequent antecedent pathogens and the other on outbreak-associated incidence rises; both establish the antecedent and neither reaches the antibody response. The Campylobacter and Zika items were both given evidence_source OTHER, which the pre-existing items lack; both sources are reviews rather than primary clinical reports, and an absent field would default to HUMAN_CLINICAL. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 25 of 40 with 15 pre-existing DOI-prefix skips, and every snippet added by this change including the DOI one was checked against its cache by hand.

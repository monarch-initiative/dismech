  summary: 'Bind LOINC: CSF protein/cell count and specimen-specific NfL'
  details: |
    Added loinc_term LOINC:2880-3 (CSF protein) to the existing CSF Protein marker, and added a new CSF Cell Count marker with loinc_term LOINC:26465-5 (Leukocytes [#/volume] in Cerebral spinal fluid), both grounded in the already-cited IGOS CSF study's own albuminocytologic-dissociation definition (elevated protein >0.45 g/L with white cell count <50 cells/uL), so the dissociation pattern is carried by both of its component measurements rather than protein alone. Split the combined 'Neurofilament Light Chain' marker into 'Plasma Neurofilament Light Chain' (loinc_term LOINC:101281-4) and 'CSF Neurofilament Light Chain' (loinc_term LOINC:100996-8), since the existing evidence already reported both specimens separately (elevated in plasma and CSF in GBS, CIDP and PDN) and one loinc_term slot cannot hold both. LOINC:2880-3 and LOINC:101281-4 were newly seeded via just loinc-seed-cache (not yet on main, carried only by earlier still-open PRs in this campaign); LOINC:26465-5 and LOINC:100996-8 were already cached. just validate-disorders passed with 0 issues.

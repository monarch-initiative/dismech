  summary: Conform to the CGRP receptor antagonism module
  details: |
    Added one pathophysiology node with role therapeutic_vulnerability, conforming at the CGRP receptor antagonism module trigger, and routed the entry's existing receptor-directed CGRP treatment to it through target_mechanisms. The node carries no downstream edge: the relation between an antagonist and the CGRP signalling it blocks is inhibitory, and a downstream edge would assert that the drug drives that signalling. Node evidence is disease-specific. This entry already had a target_mechanisms link from the erenumab treatment to its CGRP-mediated trigeminovascular headache signalling node with treatment_effect INHIBITS; the new occupancy link was merged into that existing list rather than added as a second target_mechanisms block, which would have been a duplicate mapping key. The two links describe one action at two steps. The scope limit the entry records on that treatment, that the evidence bears on persistent headache after papilledema has resolved and not on raised intracranial pressure or visual outcome, is restated on the new node rather than dropped. Edits were made as text insertions, not by a YAML round-trip, so comments and formatting are untouched.

  summary: 'Integrate assessed OpenScientist findings: choroid plexus CSF hypersecretion'
  details: |
    Integrated the assessed findings of the OpenScientist report on the choroid_plexus_csf_hypersecretion hypothesis (assessment sidecar: kb/hypotheses/pseudotumor_cerebri/choroid_plexus_csf_hypersecretion/assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict PARTIALLY_SUPPORTED). Choroid plexus CSF hypersecretion node: description rewritten from two hormonal arms to three, adding the androgen arm and recording the unsettled Na+/K+-ATPase versus NKCC1 transporter attribution; molecular_functions bound to GO:0005391; six evidence items added (PMID:28835515 GLP-1R expression and exendin-4 Na+/K+-ATPase suppression, both IN_VITRO; PMID:30753168 human choroid plexus AR/AKR1C3 expression and testosterone raising Na+/K+-ATPase in a rat choroid plexus cell line, both IN_VITRO; PMID:37328884 in vivo testosterone raising ICP and CSF secretion rate, quoted as NKCC1 rather than the report's Na+/K+-ATPase misattribution, MODEL_ORGANISM; PMID:32036786 hydrocortisone raising CSF secretion rate, MODEL_ORGANISM). Metabolic risk background node: added PMID:33848268 insulin- and leptin-resistant phenotype in excess of obesity and PMID:30753168 IIH androgen excess signature distinct from PCOS and simple obesity. choroid_plexus_csf_hypersecretion hypothesis: one SUPPORT item (PMID:40937960, no BMI association across 1550 patients) and two REFUTE items (PMID:37328884 obesity raising ICP via drainage not secretion; PMID:38273331 raised secretion without raised ICP when drainage compensates); notes extended to say the claim of primacy is the weakest part of the model; status left at EMERGING as the report itself recommends. Added a new ALTERNATIVE hypothesis glymphatic_isf_dyshomeostasis with PMID:41472646 and PMID:39585390, since the competing model was previously named only in the prose of a discussion rationale. Added discussion gap_iih_human_csf_secretion_rate_unmeasured (kind HUMAN_MODEL_MISMATCH) with a proposed noninvasive CSF production imaging experiment, because every secretion-rate measurement behind the node is rodent or cell culture and the rodent evidence does not point one way. Extended discussion gap_iih_venous_stenosis_cause_or_consequence with the intrinsic/extrinsic split and two evidence items (PMID:30219791, PMID:37410913). Deliberately not integrated: no inflammatory pathophysiology node (the human cytokine study reports only that distinct inflammatory alterations were observed, and the rodent TNF-alpha effect appeared in control-diet rats only); no intrinsic/extrinsic split of the venous stenosis node (the non-reversal claim is a review background sentence, not a cohort result); no status change; no scope qualifier for non-obese, male or pediatric IIH (gap_iih_sex_and_nonobese_predilection already covers it); the 1991 CSF steroid contradiction PMID:2061573 (five mixed-sex patients, authors state no definitive conclusion) and the IIH GWAS PMID:38528581 (14 patients from one consanguineous village, uncorrected p) were left out as too thin. Checks run: count-verified-snippets 49/49, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all clean.

  details: |
    Re-applied the part of the earlier OpenScientist sweep (branch os-review-fable) that never merged, rebuilt against main's restructured entry rather than merged from the old branch. Six citations absent from main were re-derived from references_cache on disk and placed against main's current nodes: PMID:32036786 (hydrocortisone raises the rat CSF secretion rate) on the Altered glucocorticoid metabolism -> Dysregulated cerebrospinal fluid dynamics edge, whose description proposes exactly that influence; PMID:30219791 (extrinsic 63 percent / intrinsic 37 percent in a 70-patient stented series) on the Venous sinus stenosis node, supplying the cohort figures behind that node's previously uncited distribution sentence; PMID:40937960 (GLP-1/GIP-GLP-1 meta-analysis, 1550 patients, no detected BMI association) on the choroid_plexus_csf_hypersecretion hypothesis, marked directness INDIRECT; PMID:41472646 and PMID:39585390 on a new ALTERNATIVE hypothesis group glymphatic_isf_dyshomeostasis, which main lacked entirely and which the committed codex assessment sidecar had asked be preserved as an explicit hypothesis rather than a canonical causal chain; and PMID:41279197 (rat CSF-iDDxI production imaging validated against acetazolamide, a bioRxiv preprint) on the existing HUMAN_MODEL_MISMATCH discussion gap_iih_secretory_transport_and_outflow_translation. Added a molecular_functions block to Choroid plexus CSF hypersecretion carrying both reported transporters, GO:0005391 and GO:0008511, rather than the old sweep's single Na+/K+-ATPase annotation, so the structured annotation matches the node's own statement that the attribution is unsettled; both CURIEs were already in cache/go/terms.csv and the molecularfunctionterm enum cache. Skipped the old sweep's other content as already covered by main's parallel curation: the NKCC1-versus-Na+/K+-ATPase source correction is on main in stronger form, in the node description, the hypothesis notes and the codex sidecar; the HUMAN_MODEL_MISMATCH discussion exists under a different id; and the two refuting rodent items (PMID:37328884 high-fat-diet result, PMID:38273331 Zucker compensation) are already on that discussion with the same quoted sentences. Copied the missing assessment sidecar openscientist-assessment-by-claude-opus-5.yaml and the narrative artifact it declares, both byte-identical to os-review-fable; note that the narrative's Integration section describes the old branch's edits, not the state of main. Checks: linkml-validate clean, 108/108 snippets verified, duplicate-key, entity-ref, causal-target, enum-value and hypothesis-assessment gates all pass.

  summary: 'Add knowledge gap: topiramate mechanism in IIH unresolved'
  details: |
    Added KNOWLEDGE_GAP gap_iih_topiramate_mechanism attached to the Topiramate treatment and the Choroid plexus CSF hypersecretion node. CSF secretion has never been measured in patients on topiramate. Evidence: marginal, non-significant ICP effect in a patient crossover trial that was not powered to compare drugs (PMID:39853738), and topiramate lowering ICP in rats where acetazolamide did not (PMID:29898611). Leads from research/drug_mechanism/pseudotumor_cerebri-drug-mechanism-topiramate-deep-research-openscientist.md. A report-derived claim that the rat IIH model shows no change in CSF secretion was dropped because the testosterone arm of the same study (PMID:37328884) did show increased secretion. Edge unchanged.

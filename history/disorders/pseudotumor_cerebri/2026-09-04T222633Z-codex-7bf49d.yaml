  summary: Review IIH causal mechanisms and OpenScientist exploration
  details: |
    Reviewed the complete disorder YAML, the choroid_plexus_csf_hypersecretion OpenScientist report and its 41-citation sidecar, and the corresponding Asta retrieval report. The Asta report contains broad, mostly unrelated retrieval (including goat pregnancy toxemia, hydrocephalus and unrelated organoids) rather than a disease synthesis; no unsupported findings were imported. Automated entity preflight returned SKIP because MONDO records no causal gene; manual disease/synonym relevance assessment was used. Independently checked primary mechanistic experiments, randomized trials, clinical cohorts, genetics, clinical guidelines and trial registries.

    Completeness checklist:
    - Identity/scope: distinguish primary idiopathic intracranial hypertension from secondary pseudotumor cerebri syndrome and preserve pediatric/male/non-obese evidence limits.
    - Proximal mechanisms: separate metabolic associations, androgen excess, altered glucocorticoid metabolism, secretion, outflow resistance, venous narrowing and venous hypertension. Correct GLP-1 directionality and distinguish cultured-cell Na+/K+-ATPase results from chronic-rat NKCC1 activation. Do not promote a universal initiating mechanism.
    - Distal mechanisms/phenotypes: trace pressure to optic transport impairment, papilledema, axonal injury and visual morbidity; retain independently evidenced CGRP headache signaling with exploratory ICP-amplitude qualifications. Add visual fields, transient obscurations, diplopia, tinnitus, back pain, hyposmia and cognitive impairment with population limits. Eight of ten phenotype nodes receive evidence-backed causal links; back pain and cognitive impairment remain unlinked because causal mediation was not established. Only the biologically supported pressure-dependent venous feedback cycle is asserted.
    - Diagnosis/differentials: incorporate venography, appropriate LP interpretation, ophthalmic/perimetry assessment and exclusion of secondary causes.
    - Treatment/trials: connect acetazolamide, weight loss/bariatric surgery, shunting, optic nerve sheath fenestration, selected-patient venous stenting, topiramate, erenumab in ocular remission and investigational exenatide/AZD4017 to relevant nodes with evidence limits. Preserve the exenatide trial's prespecified alpha 0.1 and negative AZD4017 primary between-group endpoint. Record the terminated phase III exenatide program and distinguish outdated registry status from published IIH:WT outcomes. Remove a publication misrepresented as a reusable dataset.
    - Models: add three rat paradigms with readouts, fidelity and limitations, including compensatory drainage that prevents raised ICP despite hypersecretion. Differences across high-fat and testosterone paradigms remain explicit rather than flattened into one mechanism.
    - Genetics and other dimensions: record exploratory familial/GWAS evidence as an unresolved susceptibility question; correct the false first-GWAS assertion. No Mendelian inheritance, disease-specific histopathology or validated clinical mechanistic subtypes are invented where literature does not establish them.
    - OpenScientist: add an authoritative 23-claim assessment, overall PARTIALLY_SUPPORTED. Retain the heterogeneous multi-mechanism reframing and qualified human/preclinical leads; correct transporter substitution, systemic-only androgen characterization, stenosis cohort prevalence/causal primacy, trial interpretation, first-GWAS claim, MRI exchange-versus-net-secretion, and CP tissue acquisition assumptions. Record the atlas's tumor/control composition. Mark future analyses SKIPPED and literature screening REPORTED_ONLY/UNVERIFIABLE because no execution artifacts were supplied; published experiments are not provider-executed analyses.

    Validation: targeted disorder schema and ontology validation passed, 99/99 evidence snippets verified against fetched caches; hypothesis-assessment schema, links and report quotes passed. Duplicate keys, permissible enum values, entity references, bare causal targets and source-defect claims passed. Additional offline title, snippet and cache gates are recorded in the PR validation results. All reference caches were generated by fetch-reference, and the frozen dataset-accession cache was excluded from this worktree and never accessed.

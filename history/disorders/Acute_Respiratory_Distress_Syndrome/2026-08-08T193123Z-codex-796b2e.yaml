  summary: Create Acute Respiratory Distress Syndrome entry
  details: |
    Created a de novo ARDS entry from Asta deep research and targeted review of
    the issue-nominated narrative review (PMID:42432720), the 2023 global ARDS
    definition, the 2024 ATS management guideline, pivotal supportive-care
    trials, a broad mechanistic review, a pediatric review, and human single-cell
    evidence. Modeled established acute alveolar-capillary injury as the
    canonical mechanism and immunometabolic reprogramming/mitochondrial
    dysfunction as an emerging modifier with an explicit knowledge gap, rather
    than implying that the latter is universal or clinically actionable.

    Kept the causal chain at the disorder-entry level: the existing epithelial
    barrier and mitochondrial modules address different biological contexts,
    and one ARDS entry did not establish the recurrence needed for a new shared
    module. Added adult and pediatric subtypes, phased progression, phenotypes,
    diagnostic criteria, investigational biochemical markers, and evidence-
    graded supportive treatments. No dataset accession was added because a
    stable accession could not be verified from the cited human omics report.

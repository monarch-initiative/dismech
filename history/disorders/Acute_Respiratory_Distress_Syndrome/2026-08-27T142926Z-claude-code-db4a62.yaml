  summary: Add chlorine and Pseudomonas VAP chips; conform to new barrier module
  details: |
    Two changes. First, added two experimental_models entries with four modeled_mechanisms links. The human airway-on-a-chip chlorine gas model (PMID:41442163, Toxicological Sciences) addresses a gap that is hard to fill otherwise, since human clinical data on acute chlorine exposure are scarce and animal models translate poorly; it gives a 10-to-30 ppm dose-response from recoverable to irreversible barrier loss, and shows epithelial junctional gaps immediately with endothelial disruption delayed to 72 hours despite the endothelium never being directly exposed. The organoid-derived Pseudomonas pneumonia-on-a-chip (PMID:41252215, JCI) compares physiological 5 percent against hyperphysiological 10 percent cyclic strain under otherwise identical infection, isolating the contribution of ventilation-associated stretch to Ventilator-Induced Lung Injury and Alveolar-Capillary Barrier Disruption. Limitations recorded for both, including the chlorine chip's absence of neutrophils and macrophages, quoted from the authors. Second, added four conforms_to edges wiring this entry's Direct Pulmonary or Indirect Systemic Insult, Ventilator-Induced Lung Injury, Alveolar-Capillary Barrier Disruption, and Protein-Rich Alveolar Edema and Loss of Aerated Lung nodes to the new alveolar_capillary_barrier_failure module, making ARDS its principal conformer. No existing content was altered. Validated: linkml-validate clean, linkml-term-validator clean, entity refs resolve, snippets verified.

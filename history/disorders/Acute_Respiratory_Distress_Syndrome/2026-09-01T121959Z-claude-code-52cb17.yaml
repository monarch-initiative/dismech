  summary: Add inhalational toxicant exposure routes; tag biological_scale on all
    nodes
  details: |
    The entry had eleven pathophysiology nodes and no environmental block at all, despite its trigger node naming inhalational injury among the direct pulmonary insults. The toxicological arm of ARDS was therefore describable in prose but absent from the pathograph.

    Added two environmental entries, each linked by influences_mechanisms (TRIGGERS, DIRECT) to the Direct Pulmonary or Indirect Systemic Insult trigger node, and each carrying its own top-level evidence as the CI gate requires. Irritant halogen gases (chlorine, bromine): encountered through transport accidents, industrial spills, water treatment and deliberate release, with human clinical evidence that severe exposure reaches ALI/ARDS rather than airway irritation alone. Smoke inhalation: combustion products plus fine particulates and thermal injury, quantified at roughly 22 percent of burn patients and at least 30 percent of fire-associated mortality.

    Both bind the substance-level ECTO:0000231 (exposure to chemical) with the specific agent and route carried in preferred_term, description and a notes line. ECTO:6000029 (exposure to tobacco smoking) was deliberately NOT reused for the smoke entry: it denotes tobacco smoking, which is a different exposure from inhaling combustion products in a fire. Reusing it would have validated cleanly while misclassifying the exposure, which is the mutually-consistent-wrong-binding failure mode. The ontology service was unreachable at curation time so a more specific CURIE could not be verified.

    Tagged biological_scale on all eleven pathophysiology nodes, which previously had none: TISSUE for the insult, ventilator injury, barrier disruption, coagulation, edema, repair and fibrosis nodes; CELLULAR for the macrophage, neutrophil and immunometabolic nodes; ORGANISM for shunt physiology and hypoxemic respiratory failure.

    No existing node, evidence item, conformance declaration or treatment was altered.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (78/78), just check-environmental-evidence, just check-duplicate-keys, and a graph build showing 34 edges with no integrity issues and both new exposures reaching the trigger node.

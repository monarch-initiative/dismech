  summary: Address review on inhaled GM-CSF treatment (GI-HOPE)
  details: |
    Bound therapeutic_agent to NCIT:C77591 Molgramostim instead of the recombinant GM-CSF class term, matching Autoimmune_Pulmonary_Alveolar_Proteinosis. Added reference_title to the mechanism-level evidence item. Added a REFUTE item quoting the abstract's conclusion that the primary GI-HOPE score did not differ. Reworded the treatment and mechanism descriptions: CD206 rose against both placebo and low dose, HLA-DR only against low dose (p=0.1841 vs placebo); CD206 is described as a marker of differentiation toward homeostatic tissue-resident alveolar macrophages, as the paper frames it, rather than alternative activation. Added clinical_trials entry NCT02595060 (phase 2a, completed) citing the ClinicalTrials.gov record. therapeutic_modality left unset: inhaled GM-CSF in ARDS is not replacing a deficiency, and OTHER would record nothing. Validated with just validate, count-verified-snippets (85/85), validate-terms and validate-disorders.

  summary: 'Create: Papillon-Lefevre Disease (MONDO:0009490, CTSC)'
  details: |
    New disorder entry for Papillon-Lefevre syndrome, the autosomal recessive cathepsin C (CTSC) deficiency.

    Curation inputs. One Perplexity deep-research run, committed alongside as research/Papillon-Lefevre_Disease-deep-research-perplexity.md, plus independent PubMed E-utilities searching. The report was used for narrative framing only. Two things about it are worth recording. Its reference_validation block reported 10 of 10 identifiers resolved with one flagged off topic - PMID:19882040, a paper on depigmentation after intralesional corticosteroid injection, which shares no vocabulary with the report and is not cited by this entry. Its term_validation block reported 27 of 60 checked labels mismatched, so no ontology CURIE was taken from the report at all; every binding here was resolved independently against the committed term caches and OLS. Two examples of what the report offered: CL:0000094 as neutrophil, when the ontology calls it granulocyte and neutrophil is CL:0000775; and UBERON:0001838 as gingiva, when gingiva is UBERON:0001828.

    GeneReviews baseline. A PubMed search for Papillon-Lefevre Syndrome GeneReviews returned no results, so Step 3b of the initiate-new-disorder-creation skill does not apply here.

    Structure. Ten pathophysiology nodes, running from biallelic CTSC loss of function through failure of neutrophil serine protease zymogen activation; the separate and less obvious claim that the proteases are degraded rather than merely left inactive in mature neutrophils; loss of the two oxygen-independent antimicrobial functions, LL-37 generation and leukotoxin degradation; impaired NET formation; a hyperinflammatory neutrophil phenotype; dysbiotic subgingival colonisation; and destructive periodontal inflammation with alveolar bone resorption. The cutaneous branch is kept separate rather than downstream, on the strength of two facts: skin and periodontal severity are uncorrelated across 47 patients, and the keratoderma appears in the first three years of life. It is graded HYPOTHETICAL, with the fibroblast autophagy and lysosomal-permeabilisation work carried as a PROVISIONAL node.

    Twelve phenotypes, two of them assigned to the Haim-Munk subtype. Haim-Munk syndrome is curated under has_subtypes rather than as a separate entry because it is allelic - the defining study found a mutation in the same CTSC codon as a classical PLS family.

    Three discussions. One HUMAN_MODEL_MISMATCH: mouse knockouts assign the neutrophil serine proteases a crucial antimicrobial role, while humans lacking all three are not correspondingly infection-prone, and one study states outright that they are dispensable for human immunoprotection. That claim is flagged rather than endorsed, because PLS patients do have a severe infection-linked pathology, just one confined to the periodontium. Two KNOWLEDGE_GAPs: the unidentified epidermal cathepsin C substrate, and whether residual NET formation is allele-specific.

    Validation. Schema validation passes; 50 of 50 evidence snippets verified against cached primary references; term validation passes; duplicate-key and entity-ref checks pass.

    Snippet issues fixed during curation, recorded because they are the recurring failure mode here: five snippets failed on the accented spelling of the eponym, since the sources use both a grave and an acute accent in different papers; one failed on an en-dash inside a percentage range; and ten reference titles needed the same accent correction. All were fixed by quoting the cached source exactly rather than by relaxing the claim.

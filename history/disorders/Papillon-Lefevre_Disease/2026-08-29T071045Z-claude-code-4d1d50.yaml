  summary: 'Review round 1: address ai4c-reviewer items on PR 10023'
  details: |
    Addressed all five IMPORTANT items and four of five suggestions from the automated review of PR 10023.

    Term specificity, three one-line swaps. GO:0008234 cysteine-type peptidase activity replaced by GO:0008239 dipeptidyl-peptidase activity, which is the exact concept the mechanism turns on - cathepsin C is an exopeptidase removing a dipeptide, and that is why the neutrophil serine protease pro-dipeptides go uncleaved. HP:0006480 Premature loss of teeth replaced by HP:0006357 Premature loss of permanent teeth, so the two dentition-loss phenotypes are curated at matching granularity. NCIT:C38052 Dental Procedure replaced by NCIT:C63714 Periodontal Scaling and Root Planing on the intensive periodontal therapy entry.

    Prose contradicting the data. Three pathophysiology descriptions said Graded SUPPORTED or Graded EMERGING, neither of which is a MechanismConfidenceEnum value, while the machine-readable field read PROVISIONAL in all three. The prose now names the actual value. Worth recording as a failure mode: the enum rejected the invalid values at validation time and I corrected the field, but the prose I had written alongside kept the words I first reached for, and no check catches that divergence.

    Missing mechanism. Added a Failure of Granzyme Activation and NK Cell Cytotoxicity node, cited from PMID:26203280 which this PR already caches. The reviewer was right that this bears on the entry's central HUMAN_MODEL_MISMATCH argument: the claim that neutrophil serine proteases are dispensable for human immunoprotection is a claim about neutrophil proteases, and a PLS patient has also lost granzyme activation, so the two effector arms should not be conflated when reading the clinical mildness. The node is graded PROVISIONAL and carries a second, PARTIAL evidence item from the same review recording that the wider immunological literature in PLS is inconsistent - which is the honest qualifier on a claim about the first consistent immune dysfunction. The top-level description now carries the same caveat.

    Suggestions taken. HP:0000982 Palmoplantar keratoderma replaced by the more specific HP:0007447 Diffuse palmoplantar hyperkeratosis. The HUMAN_MODEL_MISMATCH discussion now carries its own evidence, both sides of it - the mouse knockout sentence from PMID:16926422 and the human statement from PMID:25244098 - rather than asserting them in rationale prose alone. A Prosthetic and Implant Rehabilitation treatment was added, including the point that implants are contraindicated in growing individuals because they behave like ankylosed teeth. A note records prepubertal aggressive periodontitis type 1 as a third allelic CTSC condition, with the reason it is not curated as a subtype.

    Suggestion not taken, with reason. The reviewer suggested an animal_models entry for the Ctsc-null mouse with a FAILS_TO_RECAPITULATE link. No primary Ctsc-null mouse paper is cached in this PR; the only mouse evidence available is a secondary citation inside PMID:16926422, and that sentence is about protease-specific knockouts rather than a Ctsc null. Building an animal_models entry whose sole support is a review's citation of work I have not read would be worse curation than leaving it out. The claim is instead carried as discussion evidence, where its secondary character is stated. If a primary Ctsc-null paper is fetched later, the entry is the right home for it.

    Validation after changes. Schema validation passes; 56 of 56 evidence snippets verified, up from 50; term validation, entity-ref, duplicate-key and snippet-grading checks all pass.

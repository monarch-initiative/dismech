  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Added classifications.iuis_category: phagocyte defect to the existing classifications block (which previously carried harrisons_chapter only).

    IUIS 2022 Table 5, section 2 (Defects of Motility), cache line 3054: 'Papillon-Lefevre Syndrome CTSC AR 602365', affected cells N + M, affected function chemotaxis, associated features periodontitis and palmoplantar hyperkeratosis in some patients.

    The assignment is on the functional axis of the table, not the quantitative one: cathepsin C loss leaves neutrophil numbers normal and disables the serine-protease arm. The notes say explicitly that the narrow IUIS affected-function cell (chemotaxis only) bounds the claim rather than asserting a broad killing defect, which keeps the tag consistent with the way this entry is already curated - as a tissue-selective failure of oxygen-independent antimicrobial defence in the periodontal pocket, not a systemic immunodeficiency.

    Evidence cites PMID:35748970 with the row quoted verbatim up to but not across the fused affected-cells/affected-function column boundary ('N + MC hemotaxis' in the extracted text). The snippet preserves the source's 'Papillon-Lefevre' spelling with its accented e (U+00E8), which differs from this entry's own unaccented name.


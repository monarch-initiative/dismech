  summary: 'Review round 2: correct the granzyme claim introduced in round 1 (PR 10023)'
  details: |
    Round 2 corrects an error I introduced in round 1, and the correction turned out to strengthen the entry.

    What went wrong. Round 1 of the review asked for a missing NK cell and granzyme mechanism, pointing at PMID:26203280 - a narrative review saying impaired NK cytotoxic function is the first consistent immune dysfunction in PLS. I added a node asserting that arm fails, with modifier DECREASED, and edited the top-level description to say patients have lost two effector arms rather than one. Round 2 pointed out that PMID:15585850 was cached by this PR and cited nowhere, and that it is Pham et al., the study that actually measured this in patients: PLS patients retain significant granzyme activity in the lymphokine-activated killer compartment and have normal LAK-mediated cytotoxicity against K562 cells, which the authors offered as the molecular explanation for the absence of a generalised T cell immunodeficiency in PLS.

    So I asserted a mechanism the entry's own cached evidence base refutes. Two things caused it. I acted on a reviewer's pointer without going to the primary literature behind it, which is the same mistake as citing a review's summary in place of a measurement. And a cached-but-uncited reference sat in the PR through an entire review round on both sides without anyone reading it - the reviewer noted that this was partly on the previous review too.

    The fix. The node is renamed Granzyme Activation in Cytotoxic Lymphocytes, so its name no longer asserts a direction. mechanism_confidence is HYPOTHETICAL. The DECREASED modifier is removed - the node carries the GO term with no directional claim. The description leads with the human measurement and then gives the review's contrary position, and says plainly that a direct measurement in patients outranks a narrative review's summary of prior reports. Two REFUTE-graded evidence items from Pham, two PARTIAL-graded items from the review, and the shared premise cited from PMID:39164687, which was also cached and uncited. The top-level description now says the second arm is contested rather than lost.

    What the correction added. Fetching the primary mouse paper behind the granzyme claim, PMID:10411926, resolved a suggestion the reviewer had made twice: an animal_models entry for the Ctsc-null mouse. In DPPI-null mice granzymes A and B are present in normal amounts but retain their prodipeptide domains and are inactive, with target-cell apoptosis as defective as a perforin null. That is the model recapitulating the activation chemistry faithfully - curated as RECAPITULATES at HIGH fidelity against the zymogen-activation node - and failing to recapitulate the human outcome, curated as FAILS_TO_RECAPITULATE at LOW fidelity against the granzyme node, with the Pham measurement as its REFUTE evidence.

    That is a better version of the entry's central argument than it had before. The HUMAN_MODEL_MISMATCH discussion now attaches to the model and the granzyme node as well, and carries two further Pham quotes: the granzyme result, and the direct measurement that PLS neutrophils do not uniformly fail to kill Staphylococcus aureus and Escherichia coli, which separates a claim about human neutrophil biology from a claim about disease severity. The discussion also now records the direction of the error: the mouse over-predicts harm, so a safety case for cathepsin C inhibition built on it is conservative while a mechanistic efficacy case built on it is not.

    In round 1 I declined the animal_models suggestion on the grounds that no primary Ctsc-null paper was cached and I would not build an entry on a review's citation of work I had not read. That reasoning was right; the mistake was stopping there rather than fetching the paper.

    Validation after changes. Schema validation passes; 66 of 66 evidence snippets verified, up from 56 in round 1 and 50 in the original; term validation, entity-ref and duplicate-key checks pass; the model-link pytest lanes pass for this file. The one failure in those lanes is the pre-existing Polycystic_Kidney_Disease_3 defect on main, filed as issue 10028.

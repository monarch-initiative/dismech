  summary: 'Review: connect ten orphans; record why intracranial calcification stays
    unconnected (IUIS Table 5)'
  details: |
    All eleven phenotypes were detached; ten are now wired and one is deliberately not.

    The periodontal cascade attaches to the destructive-inflammation node and the keratoderma to the epidermal node, which is the PLS dyad. Arachnodactyly and nail dystrophy are drawn from the shared CTSC lesion rather than from either, because they belong to the Haim-Munk allelic variant rather than to classic PLS and no route from protease loss to digital morphology is established.

    Intracranial calcification is left unconnected because the entry's own description says no mechanistic link to cathepsin C loss has been established. Every candidate parent describes a neutrophil or epidermal mechanism and none reaches dural or choroid plexus calcification by any cited route.

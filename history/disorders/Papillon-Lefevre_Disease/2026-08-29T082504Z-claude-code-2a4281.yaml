  summary: 'Review round 3: fidelity/evidence mismatch on the DPPI-null mouse link
    (PR 10023)'
  details: |
    Round 3 fixed a fidelity claim that its own evidence did not support, and the fix added a mechanism link the entry should have had from the start.

    The defect. The animal_models link targeting Failure of Neutrophil Serine Protease Zymogen Activation was graded RECAPITULATES at HIGH fidelity, but every piece of evidence on it - and its readout - measured granzymes A and B in cytotoxic lymphocytes. That is a different protease family in a different compartment from the elastase, cathepsin G and proteinase 3 node the link points at. The link's own limitations field said so, which makes it the same prose-contradicts-data pattern as round 1 item 4, one slot over. The concrete harm the reviewer identified is the readout: readouts are written to be self-describing so they can be lifted out of their link, and lifted out, a granzyme measurement filed against a neutrophil-serine-protease node reads as a claim nobody made.

    The fix, and a reviewer PMID error found on the way. The reviewer offered two options and recommended fetching the primary DPPI-null neutrophil-protease paper, giving PMID:12208867. That identifier resolves to a sitosterolemia paper about ABCG5 and ABCG8 trafficking, with no DPPI content; the cache file was deleted rather than committed. The intended paper is PMID:11827996, Adkison et al., J Clin Invest 2002, found by searching the title the reviewer described. It establishes that DPPI is required for the full activation of cathepsin G, neutrophil elastase and proteinase 3 - the same three enzymes in the same compartment as the human node - so RECAPITULATES at HIGH fidelity is now supported by evidence that measures what the link claims. The limitations note that full activation is the paper's own wording and leaves open whether residual activity remains, and that the model's functional consequences are inflammatory rather than infective.

    This is the second reviewer PMID misattribution in this curation batch; the first was PMID:15316526 on the CVID4 entry, identified as a BAFF-R mutational analysis when the cached record is a CVID lung-disease study. Both were caught by reading the cache before citing. Worth recording as a pattern rather than two incidents: a suggested identifier is a lead, from a reviewer exactly as from a deep-research report.

    The addition. Taking the reviewer's non-blocking suggestion, a third modeled_mechanisms link records the divergence on the neutrophil arm, which is arguably more interesting than the granzyme one. In the mouse the proteases are present and unprocessed; in human PLS neutrophils they are absent, degraded after normal synthesis and sorting. So cathepsin C's chaperone-like role protecting the proteases from degradation - separate from activating them - is a human finding this model does not show, and a therapy restoring only the activating cleavage would be sufficient in the mouse and insufficient in the patient. Graded FAILS_TO_RECAPITULATE at LOW fidelity, with limitations stating plainly that the divergence is inferred across two studies rather than measured head to head, since no cached reference reports protease abundance in DPPI-null mouse neutrophils.

    Second non-blocking item, and a correction to my own reasoning. The Pham human measurement attached to the granzyme FAILS_TO_RECAPITULATE link was graded REFUTE. That was wrong and the reviewer was right that it contradicted its own explanation. supports is relative to the claim the evidence is attached to, and that link's claim is that the model fails to recapitulate the human outcome - which the measurement is exactly the evidence for. Regraded SUPPORT, with the reasoning written into the explanation so the same mistake is visible next time. The same sentence is graded SUPPORT on the discussion, so the two are now consistent.

    A snippet note. The most direct sentence naming all three proteases carries bracketed abbreviations, and the reference validator strips bracketed spans before matching unless conf/reference_validator_config.yaml lists a literal_bracket_patterns entry. A neighbouring bracket-free sentence is used at link level instead, with the explanation saying why, and the readout carries the three enzyme names.

    Validation after changes. Schema validation passes; 68 of 68 evidence snippets verified, up from 66; and the full ungated gate set was run this time - folded-hyphens, snippet-length, title-snippets, snippet-grading - alongside term validation, entity-ref and duplicate-key checks. The model-link pytest lanes pass for this file; the one failure is the pre-existing Polycystic_Kidney_Disease_3 defect on main, filed as issue 10028.

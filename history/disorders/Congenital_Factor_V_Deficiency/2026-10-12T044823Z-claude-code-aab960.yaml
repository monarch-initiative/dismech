  summary: 'Create: Congenital Factor V Deficiency'
  details: |
    De novo curation of congenital factor V deficiency (MONDO:0009210, F5). Pathophysiology chain from biallelic F5 loss-of-function through reduced plasma factor V, impaired prothrombinase cofactor function, reduced thrombin generation, impaired fibrin clot formation, to systemic bleeding; plus a compensation arm (residual platelet factor V + low TFPI -> preserved platelet-dependent thrombin generation) explaining the characteristic activity/severity discordance. 16 phenotypes (mucocutaneous bleeding, ICH, lab findings), F5 CAUSATIVE with ClinGen DEFINITIVE gene_disease_validity copied from CGGV record, FV:C biomarker with severity bands, prevalence ~1/million, diagnosis (coag screen/mixing study/F5 sequencing), differential diagnoses (acquired FV deficiency; combined FV+FVIII), treatments (FFP, platelet transfusion, antifibrinolytics, rFVIIa, liver transplant), four animal models (Cui 1996 knockout, transgene rescue, 2025 knock-in, zebrafish), two KNOWLEDGE_GAP discussions. The claude_code deep-research report under research/ was used as leads only; all primary sources were found and verified via PubMed and fetched into references_cache. Validation: validate-disorders passed (62/62 snippets, 0 issues), validate-terms passed, entity-refs/causal-targets/qualifier-terms/duplicate-keys/enum-values clean, 15/16 phenotypes causally connected, no GeneReviews chapter exists (StatPearls tagged), global compliance 82.4%.

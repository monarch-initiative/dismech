  summary: 'Review round 2: add cardiac, edema, vomiting, toe and two facial phenotypes'
  details: |
    Addressed the CHANGES_REQUESTED review of 2026-09-04 on PR #10996. All three IMPORTANT findings were verified against references_cache/PMID_34805998.md before acting, and all three were correct.

    IMPORTANT 1 - cardiac finding dropped. Added a phenotype for the mild systolic dysfunction in proband 1.2, wired as a second INDIRECT_UNKNOWN_INTERMEDIATES edge from Increased Filamentous Actin with Excess Filopodia and Migration, parallel to the constipation edge, as the review asked. The edge evidence is the Discussion sentence that pairs the two ('Similarly, the ventricular dysfunction seen in NAA80 individuals could reflect a minor ACTC1 dysfunction'), graded HUMAN_CLINICAL / INDIRECT to match the constipation edge.

    I did NOT use the suggested HP:0025169 (Left ventricular systolic dysfunction). The label is correct - I checked it in HPO - but the term is wrong for the claim. The paper says 'mild systolic dysfunction' and later 'ventricular dysfunction' and never names a chamber, so HP:0025169 would manufacture left-ventricular specificity the source does not carry. HP:0005185 (Global systolic dysfunction) was also rejected: its definition requires an enlarged left ventricle and marked cardiomegaly, and the source says explicitly that no other abnormality was found. Bound HP:0006673 (Reduced systolic function), the unqualified parent of HP:0005185, with severity MILD and the source wording in preferred_term. HP:0006673 was the only new CURIE in the cache diff.

    IMPORTANT 2 - two phenotypes dropped from an already-quoted sentence. Added Peripheral edema (HP:0012398) and Vomiting (HP:0002013), both from the sentence already used three times, reusing that snippet with the same HUMAN_CLINICAL grading. Both are deliberately left unwired, with the reason recorded in each phenotype's notes and in a new entry-level notes point: the report gives no mechanism for them, the etiological workup found no cause, and nothing in the cited literature places episodic infection-associated swelling or vomiting on the actin axis. The intercurrent-illness decompensation pattern the review asked about is recorded in the entry-level notes as the clinically actionable part.

    IMPORTANT 3 - toes dropped while fingers kept. Added a phenotype bound to the generic HP:0001780 (Abnormal toe morphology, 'An anomaly of a toe') with preferred_term 'Disorganized implant of the toes', wired from the dysmorphogenesis node beside Tapered finger. HPO's specific toe terms (overlapping, widely spaced, deviated, short) each assert something the source does not say. The review was right that HP:0001883 (Talipes) is wrong - it names a foot deformity, not toe placement.

    SUGGESTION 4 - added Long philtrum (HP:0000343) and Bulbous nose (HP:0000414) from the Fig 1F legend for proband 1.4, both wired from the dysmorphogenesis node. Labels verified in HPO.

    SUGGESTION - residual-activity window. Added the 1-2 percent estimate as an evidence item on Reduced N-Terminal Acetylation of Cytoplasmic Actin, graded COMPUTATIONAL / INDIRECT because it is an inference from a simplified kinetic model, not an activity assay, with the rarity argument in the explanation.

    SUGGESTION - external assertions. Added OMIM:620830 (confirmed as the OMIM xref of MONDO:0970998 via OAK) and the ClinVar record. The review gave VCV001301869.1; the live record is at version .6, so the accession is recorded without a version suffix. More substantively, ClinVar's preferred title names the variant on a different transcript - NM_001200016.2(NAA80):c.323T>C (p.Leu108Pro), not the paper's c.389T>C p.(Leu130Pro) - and that is recorded in notes so nobody reads it as a different allele. Both resolve to GRCh37 chr3:g.50334572A>G, the coordinate the paper gives. ClinVar links the record to MONDO:0970998 and OMIM:620830 and classifies it Pathogenic/Likely pathogenic.

    Also corrected 'Falcon/Edison run' to 'Falcon deep-research run' in the entry notes: there is no edison provider in this repository. Renumbered the notes preamble from six points to seven.

    NOT CHANGED: the optional split of pathophysiology node 1 was left alone - the review itself called it defensible and the evidence is a single coherent argument. HP:0012450 Chronic constipation and HP:0000219 Thin upper lip vermilion were flagged in round 1 and dropped in round 2; both remain, and the reasoning is in the PR comment.

    Validation on the changed file: just validate pass; validate-terms pass; count-verified-snippets 76/76 (the entry cites no DOIs, so nothing is skipped by prefix and every snippet is machine-checked); check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all OK; validate-disorders pass. Whole-KB check-title-snippets, check-snippet-length and check-snippet-grading clean with no new baseline rows. Orphan sweep over every downstream/sequelae/reports_on/target_mechanisms/modeled_mechanisms target: zero dangling targets; the only phenotypes without an incoming causal edge are Peripheral edema and Vomiting, both deliberate and both documented. The cache diff is a single tool-generated additions-only row pair for HP:0006673; references_cache is untouched.

  summary: 'Create: Auroneurodental Syndrome (MONDO:0970998, NAA80 p.Leu130Pro)'
  details: |
    De-novo curation of MONDO:0970998 (OMIM 620830) as a standalone Disease entry. Identity came from the MONDO xrefs and the single annotation-source PMID:34805998 (Muffels et al. 2021, Brain Commun), which reports two brothers homozygous for NAA80 c.389T>C p.(Leu130Pro). The issue asked whether this is a single family with nothing mechanistic to build a pathograph from; it is a single family, but the mechanism is unusually well measured, so a full entry was warranted rather than a stub disposition. Seven pathophysiology nodes: variant destabilizes the NAA80 catalytic-domain fold (structural prediction plus recombinant insolubility plus reduced protein in patient fibroblasts) -> 25-65 percent of cytoplasmic beta- and gamma-actin left unacetylated against 0.5 percent in controls -> increased F-actin, filopodia and migration in patient fibroblasts and PBMCs, reversed by wild-type NAA80 -> four HYPOTHETICAL organ-level nodes (inner ear, developing brain, skeletal muscle, craniofacial/dental/digital dysmorphogenesis). 27 phenotypes, all wired, no frequency bands (denominator is two). Patient fibroblasts/PBMCs curated as an experimental_models entry with modeled_mechanisms and rescue readouts; the zebrafish naa80 knockout (PMID:39384430) curated as an animal_models entry with three links, including a FAILS_TO_RECAPITULATE link for skeletal muscle carrying its own limitations and REFUTE evidence, plus a HUMAN_MODEL_MISMATCH discussion. Two further knowledge gaps recorded: the co-segregating homozygous PLXNB1 p.Ser911Gly variant, which the report states and does not discuss, and the absence of any measurement in an affected tissue. PMID:29581253 (Drazic et al. 2018) supplies the enzyme-substrate and filament-kinetics background. A Falcon (Edison Scientific Literature) deep-research run was attempted and discarded: it reported that the label 'auroneurodental syndrome' could not be verified, substituted LAMM syndrome (FGF3, OMIM 610706) as the likely intended entity, and never mentions NAA80. preflight-dr returns SKIP rather than FAIL because MONDO records no causal gene, but its diagnostics (FGF3=42, report OMIM 610706 vs MONDO 620830) make the substitution unmistakable. No research artifact is committed. Validated: just validate (68/68 snippets verified, all PMID references, no DOI citations), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, plus whole-KB check-title-snippets, check-snippet-length, check-snippet-grading and check-folded-hyphens.

  summary: 'Create: Mullerian_Aplasia_and_Hyperandrogenism'
  details: |
    New entry for MONDO:0008019 (OMIM 158330), heterozygous WNT4 (hgnc:12783) loss of function. Curated 4 pathophysiology nodes and 11 causal edges (WNT4 loss of function to failed Mullerian duct formation, derepressed ovarian androgen biosynthesis and, from Wnt4-null mouse data only, impaired nephron tubulogenesis), 8 HPO-bound phenotypes all wired to mechanism nodes, autosomal dominant inheritance, WNT4 genetic record with the four published alleles (E226G, R83C, L12P, A233T), three mouse models with modeled_mechanisms, two supportive treatments carried over from Mullerian agenesis guidance with INDIRECT directness, and differentials MRKH syndrome, MURCS association, SERKAL syndrome and PCOS. 68 evidence items over 22 PubMed references. Primary literature was found by PubMed search first; the OpenScientist deep-research report was then read. Its validation block: 22/22 references resolved, 14/15 quotes matched (the unmatched quote 'remarkably similar to' was attributed to PMID:9989404 but comes from PMID:15317892; that quote was not reused), 1 off-topic reference (PMID:35455528, MRKH quality-of-life review, not cited here), needs_review true. Term validation: 0 unresolved, 6 mislabelled including HP:0000858 offered as Hyperandrogenism (it is Irregular menstruation) and HP:0008222 offered as Decreased ovarian reserve (it is Female infertility); neither was bound, and all terms here were looked up independently. The report omits the R83C allele (PMID:16959810) and states the alleles are not dominant negative, which PMID:16959810 contradicts; the entry follows the primary paper. From the report, PMID:24641817, PMID:28434104 and PMID:24356390 were used; QoL, vaginoplasty-technique, EHR and pathway-context references (35455528, 37994266, 33461758, 39391975, 39280286, 39324432, 39388911, 18617533, 27481580, 22251856, 30518531, 31685872, 41358813, 41636313) were not cited because they concern MRKH or Wnt biology generally rather than this disease, or duplicate claims already sourced. just preflight-dr could not run (local MONDO build absent; not downloaded); identity was checked by hand: the report names WNT4 96 times, cites OMIM 158330, and discusses no rival causal gene. No ClinGen gene-validity record exists for WNT4 (checked against the current ClinGen download), so no tier is recorded. just check-genereviews --online: NO_CHAPTER. Validated with just validate, validate-terms, count-verified-snippets (68/68), the offline gates, and just validate-disorders (pass).

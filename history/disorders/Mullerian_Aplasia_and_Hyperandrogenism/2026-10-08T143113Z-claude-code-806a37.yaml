  summary: 'Review round 1: Mullerian_Aplasia_and_Hyperandrogenism'
  details: |
    Bound GO:0005109 frizzled binding (DECREASED) as the molecular function on the Heterozygous WNT4 Loss of Function node, which CI's check_gene_activity_grounding gate requires for a gene wired into the pathograph. WNT4 is a secreted Wnt ligand that signals through Frizzled receptors. Removed the IVF treatment evidence item quoting PMID:18182450 on follicle development: it states a caveat about ovarian reserve rather than support for the treatment, and the caveat remains in the treatment description. Follicle depletion was not added as a phenotype: the source abstract (PMID:18182450) says only follicle depletion in one patient, and the closest HPO terms (HP:0033085 Reduced antral follicle count) assert a measurement the source does not report.

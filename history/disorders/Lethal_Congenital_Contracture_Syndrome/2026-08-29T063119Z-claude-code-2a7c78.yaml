  summary: 'Create: Lethal Congenital Contracture Syndrome (MONDO:0017436)'
  details: |
    Curated MONDO:0017436 as a Disease with has_subtypes rather than a kb/groupings/ entry. MONDO:0017436 is an OMIM phenotypic series (OMIMPS:253310) with twelve numbered members, which normally argues for a grouping; it is curated as a disease because the subtypes are not a union of distinct diseases but one deformation sequence reached by three different routes through the same fetal motor unit (anterior horn cell in LCCS1-3, Schwann cell myelination and node-of-Ranvier assembly in LCCS2 and LCCS7-11, sarcomere and NMJ in LCCS4-6), converging on a single node - absent fetal movement - below which every finding is deformation secondary to the missing movement. The reasoning is recorded in the entry notes.

    Deep research: falcon (Edison), 13/13 references resolved, confabulation_rate 0.0, one reference flagged possibly off topic (the NEK9/MYH9 ciliogenesis paper) which was read and not cited in the entry. The report was used as a lead source only; every KB snippet was taken from the primary reference cache directly, and no snippet was copied from the report text.

    Evidence: 135/135 snippets verified against cached references by count-verified-snippets and by validate-disorders. 28 references fetched via fetch-reference (PMIDs only; DOI-keyed caches created during discovery were removed in favour of their PMID equivalents so reference_title values come from PubMed rather than publisher HTML markup).

    GeneReviews baseline: PubMed searched for a GeneReviews chapter on lethal congenital contracture syndrome, arthrogryposis and fetal akinesia; none exists, so no GeneReviews reference is tagged.

    Post-review revision (PR #10020, ai4c-reviewer CHANGES_REQUESTED plus an independent red-team pass). Corrected a 10x prevalence error: the Finnish source states the LCCS1 rate as both 1 in 25,250 and 0.40 per 10,000, and the per-10,000 figure had been copied into the per-100,000 slot; the record now reads 3.96 per 100,000, and both prevalence records were re-banded (BAND_1_9_PER_100000 and BAND_1_5_PER_10000). Removed an ADCY6 36-month survival claim that no cached reference supported, from all three places it appeared. LCCS12 is no longer recorded as gene-unassigned: OMIM 621511 and MedGen assign DST, sourced to PMID:40497796 (Jacob et al., Brain 2026); a gene binding, a genetic entry and a reframed knowledge gap replace the previous assertion that no gene was known. MONDO:0981031 still carries no RO:0004003 edge, which the gap now records as an ontology gap to report upstream. Added a molecular layer to the pathograph (mRNA export, PI3K-Akt, phosphoinositide synthesis, cAMP synthesis, NEK9 mitotic/ciliary), split the bundled muscle node into myofibril-assembly and endocytic-trafficking nodes, rebound the fetal movement phenotype from the syndrome term HP:0001989 to the finding term HP:0001558, and replaced GO:0097049 motor neuron apoptotic process with GO:0021522 spinal cord motor neuron differentiation DECREASED because the node's own zebrafish evidence shows the deficit is precursor apoptosis, not apoptosis of differentiated motoneurons. Re-sourced the LCCS1-tagged pterygia, micrognathia and muscle-atrophy claims from an un-genotyped 2002 FADS autopsy paper to LCCS1-specific sentences in PMID:18204449, and the neurogenic bladder claim from the LCCS3 paper's negative statement to the LCCS2 paper's positive one. Demoted several VERY_FREQUENT bands that rested on single cases or on a figure that contradicted the band. Added talipes equinovarus, areflexia, dysphagia and retinal haemorrhage phenotypes, two CARRIER_FREQUENCY prevalence records, a LAAHD differential, and palliative care. Scope notes: LCCS12 now carries its gene but is not placed on a pathograph arm, because whether DST-b loss reaches akinesia through the contractile-apparatus route is unestablished. Rebased onto origin/main after 55 commits had landed, which included the schema change in #10003 (#7439) retiring PARTIAL from EvidenceItem.supports and splitting direction from directness. The bulk migration converted all 11,616 existing PARTIAL items to SUPPORT with directness left absent, deliberately not backfilled so as not to manufacture appraisals no curator made. This entry's 12 PARTIAL items were instead converted to SUPPORT plus an explicit directness: INDIRECT, because each was written in this session with an explanation already stating why the support is indirect, so the appraisal is a real curator judgement rather than a default. The explanation prose was reworded from "PARTIAL because" to "Indirect because" to match. Three cache conflicts (cache/mondo/terms.csv, cache/cl/terms.csv, cache/enums/celltypeterm_a43e4ab67bda.csv) were purely additive row collisions with concurrently merged curation PRs; resolved by keeping both sides and re-deriving order with just normalize-cache, verified with check-term-cache-integrity and check-cache-order. No cache row was hand-edited.

    Second review round (approving, with four non-blocking suggestions, all taken): downgraded the palliative-care evidence directness because its snippet is about congenital SMA rather than LCCS; renamed the Impaired Fetal Swallowing node to Impaired Swallowing since it spans the postnatal dysphagia that enteral feeding actually targets; dropped the frequency bands from areflexia and dysphagia, which rested on single-case examination sentences; and added overlapping fingers, vocal cord paresis, pyloric stenosis and congenital cardiac defects from the research report. Also corrected a residual internal contradiction in notes prose, which still said all subtypes converge on the akinesia node after LCCS10 and LCCS12 had been deliberately left off it. clinical_trials and datasets are deliberately empty - no interventional LCCS trial and no LCCS-specific omics resource were identified, and no accession was manufactured from a causal-gene search. Zebrafish results for GLE1, ZBTB42 and ADCY6 are cited as MODEL_ORGANISM evidence on mechanism nodes but no animal_models section with modeled_mechanisms links was built; that is left as follow-up.

    Third review round. Removed two phenotypes, Pyloric Stenosis and Congenital Cardiac Defects, that had been tagged subtype LCCS10 and sourced to PMID:36712877. Re-reading the cached paper confirmed the reviewer: those visceral and cardiac findings belong to the allelic APUG disorder (arthrogryposis, Perthes disease and upward gaze palsy) whose patients survive and carry compound heterozygous or missense NEK9 alleles, not to LCCS10, which is reported in fetuses with homozygous truncating alleles. The paper describes its own two surviving neonates as almost consistent with APUG, and the pyloric/pulmonic/septal findings appear in its literature review under Alkuraya APUG patients rather than under the Casey LCCS10 fetuses. This was Named Entity Confusion reached through an allelic series: both snippets were exact and the PMID real, so no validator caught it, and the phenotype descriptions then used those misattributed findings to argue that LCCS10 is mechanistically different from the motor-unit subtypes, which is the claim the lccs10_offspine_mechanism gap rests on. The gap now carries an explicit caution recording the APUG/LCCS10 boundary and the fact that an earlier draft crossed it. Also tagged Overlapping Fingers subtype LCCS3, its only source being LCCS3-specific. Snippet count 135 to 133.

    Validation run: validate (schema + terms) passed; validate-terms passed; check-duplicate-keys passed; check-entity-refs passed; check_reference_titles.py --against-ref origin/main passed; check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all passed with no new baseline entries.

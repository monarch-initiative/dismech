  summary: Add source-scoped LCCS care and diagnostic evidence after review
  details: |
    Added perinatal palliative/shared-goals care with the ERBB3 family’s actual change from planned comfort care to noninvasive neonatal support; separated observed care from the authors’ general recommendation. Added named tracheostomy and orthopedic surgery using actual GLDN procedures without inferring causal benefit. Added source-scoped MRI, EMG, muscle biopsy, peripheral nerve biopsy and renal/bladder ultrasound; preserved subtype, individual and timepoint distinctions, normal-test limitations, and neurogenic rather than mechanical bladder attribution. Retained HP:0001558 with absent-movement display nuance: OLS defines HP:0001989 as the composite fetal akinesia sequence, not isolated absent movement. Official GeneReviews title index and LCCS1 GTR did not identify an applicable dedicated LCCS/GLE1 chapter; broad differential chapters were not substituted. No occupational-therapy-specific evidence or validated umbrella CK/echocardiography protocol was identified in the inspected sources; isolated normal observations were not promoted to required testing. Convention: author conjecture and care principles are OTHER; actual patient findings, procedures and evolving family decisions are HUMAN_CLINICAL. All prior content and history are preserved; no phenotype, frequency or causal topology changes.

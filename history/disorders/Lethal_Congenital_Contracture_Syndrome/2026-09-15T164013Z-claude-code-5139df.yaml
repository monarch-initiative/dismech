  summary: 'Fix: prefix 17 PMC-URL evidence references with url:'
  details: |
    Seventeen evidence items cited the PMC article pages for PMID:23092955 (PMC3658203) and PMID:26004201 (PMC4457946) as bare https URLs. The whole-KB schema sweep (check_evidence_items_have_references) rejects a reference without a recognised prefix, so the merge queue failed three times. Rewrote the 17 references to the url: form the test and the reference validator both accept; snippets, titles, and the two tool-fetched url caches are unchanged. Verified with just validate (211/211 snippets against cached references) and the test_disorder_file case for this entry.

    Follow-up: convert these references to the PMIDs. Blocked in this session because both papers are PMC author manuscripts: PMC efetch returns abstract-only XML, Europe PMC fullTextXML and NCBI BioC return nothing, and the PMC web page (the only source of the quoted full text) answers the reference validator's downloader with a reCAPTCHA challenge, so the tool cannot write a PMID cache that carries the full text. The built-in pmc provider's HTML fallback also targets the retired www.ncbi.nlm.nih.gov/pmc host and its old selectors.

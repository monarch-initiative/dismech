  details: |
    PR #7410 re-review response (ai4c-reviewer[bot], REQUEST_CHANGES on frequency
    derivation).

    Confirmed finding: the Hair and Skin Hypopigmentation phenotypes justified
    frequency: OCCASIONAL with "two of five patients supports the OCCASIONAL band".
    Two of five is 40%, which is the FREQUENT band (30-79%), not OCCASIONAL
    (5-29%). The justification was arithmetically wrong.

    Resolution: rather than reword to preserve the band, frequency: was REMOVED from
    both pigmentary phenotypes. The only denominators available are two small series
    from a single group (five patients and a sib pair), and PMID:21990275 reports
    the pigmentary finding as newly associated with MOPD I, so there is no basis for
    a disease-level rate. docs/frequency-evidence-guidelines.md is explicit that a
    missing frequency is honest and a fabricated one is not, and lists omission as
    strictly better than fabricated quantitative-looking justification. Evidence
    explanations reworded to state they support the association only. The reasoning,
    including the specific arithmetic error, is recorded in the entry notes so it is
    not silently reintroduced.

    Also took the non-blocking suggestion: added Fundus Hypopigmentation
    (HP:0007894), the third arm of the pigmentary triad both sources describe
    together and the only one still unbound. Distinct from the existing Retinal
    Dystrophy entry, which is a degenerative claim from the broader RNU4ATAC
    spectrum; this is a developmental pigmentary deficit in MOPD I. Also carries no
    frequency, for the same reason.

    Audited every frequency band in BOTH entries for the same class of error by
    parsing each stated band against the percentages and ratios in its evidence
    explanations. No further mismatches: all remaining derived values fall inside
    their stated bands. The neighbouring Cerebellar Vermis Hypoplasia derivation
    (one of five, 20%, OCCASIONAL) is arithmetically correct and was left as is.

    Validation after changes: schema, term, and reference validation pass;
    68/68 snippets verified against cached references.

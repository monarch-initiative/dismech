  summary: Re-verify ISDS group 21 assignment against the 2023 Table 1
  details: |
    Group-21 re-verification pass. The existing assignment cited the 2019 revision (PMID:31633310) Table 1 group 19, part of the 2019-derived backfill the axis documentation flags as outstanding. Re-derived it from the 2023 Table 1 (PMID:36779427), where this entity is NOS 21-0080 (RNU4ATAC, OMIM 210710). Group value unchanged - only the provenance in notes was upgraded, and the assignment was confirmed correct. The note additionally records that RNU4ATAC's two other phenotypes are elsewhere: Roifman syndrome at NOS 21-0090 (a separate dismech entry) and Lowry-Wood syndrome, which the 2023 revision moved out of this group entirely to group 9 (NOS 09-0110, OMIM 226960). Both revisions lump MOPD I and MOPD III into one row, which matches this entry's scope. Schema validation, folded-hyphen, duplicate-key and entity-ref checks all pass.

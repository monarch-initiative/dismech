  details: |
    PR #7410 review response (ai4c-reviewer[bot], REQUEST_CHANGES).

    evidence_source corrections in the Secondary Primary Cilium Dysfunction node:
    the GO term-enrichment evidence item from PMID:36802443 was reclassified
    IN_VITRO -> COMPUTATIONAL (in-silico gene-set enrichment, no wet-lab
    component), and the mixed patient-fibroblast/zebrafish sentence from the same
    paper was split into two evidence items so each carries a single
    evidence_source (IN_VITRO and MODEL_ORGANISM), per the CLAUDE.md rule on
    mixed-source papers.

    Phenotype additions, all snippet-verified: Abnormal Cortical Gyration
    (HP:0002536), Corpus Callosum Malformation (HP:0007370), Cerebellar Vermis
    Hypoplasia (HP:0001320), and Hair and Skin Hypopigmentation (HP:0011358). Two
    new references were fetched and cached for these: PMID:23794361 and
    PMID:21990275 (Abdel-Salam et al., RNU4ATAC-confirmed MOPD I series).

    The specific cortical findings were previously left unasserted because the
    then-cited abstracts supported only generic brain malformation; PMID:23794361
    supplies the missing quotes and additionally states that cortical malformations
    should be considered cardinal manifestations of MOPD I.

    Declined with reasoning: the review requested sparse/absent hair (HP:0008070)
    citing PMID:26522830. That quote does not exist in the cached abstract, which
    is about Roifman syndrome and does not mention hair. No cached reference in
    this entry's citation set attests structural hair sparsity. The attestable
    hair/skin finding is pigmentary, and is what was curated instead. Rationale
    recorded in the entry notes.

    Validation after changes: schema, term, and reference validation pass;
    63/63 snippets verified against cached references.

  summary: 'Re-review response: split hair/skin hypopigmentation (PR #7410)'
  details: |
    PR #7410 re-review response (ai4c-reviewer[bot], APPROVE with one non-blocking
    suggestion).

    Took the optional suggestion: HP:0011358 is hair-specific by definition
    ("Reduced pigmentation of hair diffusely"), but both supporting sentences also
    attest skin involvement ("fair skin", "unusually fair complexion of hair and
    skin"), which was therefore unbound and unqueryable.

    Split the single "Hair and Skin Hypopigmentation" phenotype into two: renamed
    the existing one to "Hair Hypopigmentation" (HP:0011358) so its name matches the
    hair-only term, and added "Skin Hypopigmentation" (HP:0001010) reusing the same
    two verified snippets plus a third from PMID:21990275 ("Skin biopsy showed
    abnormal melanin function but OCA genes were normal") that establishes the
    melanin-function defect as distinct from classical oculocutaneous albinism.
    Both banded OCCASIONAL (two of five patients).

    Updated the entry notes cross-reference to name both phenotypes.

    Validation after changes: schema, term, and reference validation pass;
    66/66 snippets verified against cached references.

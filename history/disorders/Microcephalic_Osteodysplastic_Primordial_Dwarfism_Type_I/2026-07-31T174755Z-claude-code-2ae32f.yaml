  summary: 'Create: Microcephalic Osteodysplastic Primordial Dwarfism Type I'
  details: |
    De novo curation of MOPD I (Taybi-Linder syndrome / TALS; RNU4ATAC; MONDO:0008871).

    Lump-vs-split decision, made before curation: MOPD I and MOPD II were curated as TWO
    records, not one. They share a clinical name and membership in the microcephalic
    primordial dwarfism group, but differ in causal gene (RNU4ATAC minor spliceosome vs PCNT
    centrosome), cellular mechanism, natural history (historically infantile-lethal with
    profound cognitive impairment and structural brain malformation vs survival into
    adulthood with near-normal intelligence), MONDO and OMIM identifiers, and GeneReviews
    chapter. MOPD III is subsumed here as a historical subtype following the Orphanet/MONDO
    merge (MONDO:0016994). Roifman syndrome and Lowry-Wood syndrome are allelic RNU4ATAC
    disorders but are kept OUT of this entry and recorded as differential diagnoses, since
    they are clinically distinct entities with their own MONDO terms.

    Deep research: the falcon/Edison provider returned HTTP 402 Payment Required and could
    not be run, so the claude_code provider was used instead
    (research/Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I-deep-research-claude_code.md).

    GeneReviews baseline: PMID:36795902 (RNU4atac-opathy) was found, fetched, cached, tagged
    in the top-level references block, and cross-referenced against the phenotype list.

    Pathograph curated: RNU4ATAC variant destabilizing U4atac -> minor spliceosome
    tri-snRNP assembly failure -> defective U12-type minor intron splicing -> impaired
    development of proliferative and ciliated cell populations, with a parallel secondary
    primary-cilium-dysfunction arm (PMID:36802443).

    DR errors caught and corrected during curation: the MONDO ID (report gave MONDO:0009338;
    OAK-verified correct term is MONDO:0008871); the claim that GeneReviews chapters have no
    PMID; and four incorrect HPO suggestions that did not survive OAK verification
    (HP:0007099 is Chiari type I malformation, not lissencephaly; HP:0003021 is metaphyseal
    cupping, not hip dislocation; HP:0001377 is limited elbow extension; HP:0002850 is
    decreased circulating total IgM). The report's iPSC cerebral-organoid spindle-orientation
    finding was excluded from pathophysiology because its only source is an unrefereed
    bioRxiv preprint with no PMID; the question it bears on is recorded as a
    HUMAN_MODEL_MISMATCH discussion instead.

    Validation: just validate passes schema, term, and reference validation;
    55/55 snippets verified against cached references; weighted compliance 91.4%.

  summary: Wire 17/17 phenotypes; add the 2026 genotype-severity rule
  details: |
    Pathograph-connectivity pass (0/17 phenotypes connected at baseline). Wired the growth, brain, skeletal, facial and immune phenotypes off the proliferative-cell-population node and the retinal and hypopigmentation findings off the ciliary node. Stroke is wired provisionally with its description saying that a cerebrovascular mechanism is established for the related PCNT disorder MOPD II but not for RNU4ATAC. Literature update: added the 2026 reevaluation of all published RNU4ATAC cases (PMID:41808109), which establishes the genotype-severity rule - variants located exclusively in the 5' stem-loop give lethal MOPD I, while a genotype sparing the 5' stem-loop gives the milder Roifman or Lowry-Wood phenotype - and the structural reason for it, that the 5' stem-loop is where U4atac binds NHP2L1 and PRPF31. That rule is the most useful predictive fact in the RNU4ATAC-opathies and is why the three disorders are separate dismech entries. Result: 17/17 connected; 70/70 snippets verified.

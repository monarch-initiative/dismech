  summary: 'Review response: add rhIGF-1 rescue, diagnosis, biochemical, GH1 case
    fractions'
  details: |
    Response to the automated review on PR #9230. The review named three candidate PMIDs for the rhIGF-1 finding and asked that each be confirmed before use; all three were fetched and read, and all three are real, on topic, and say what the review expected.

    rhIGF-1 (mecasermin) rescue, the blocking finding. Added as second-line rescue with a heterogeneous response, which is what the three sources jointly support rather than what any one of them says. PMID:7509217: a patient with anti-GH titres to 1:1,000,000 grew well for a year on IGF-I with no anti-IGF-I antibody formation. PMID:10417965: two Brazilian children with 6.7-kb deletions achieved catch-up growth at 6.7 to 8.4 cm/yr after replacement produced only a transient response. PMID:16607923, the counterweight the review asked for: the growth response was moderate and the outcome heterogeneous, with bone-age acceleration in the two treated at pubertal age. Wired with treatment_effect: BYPASSES on Loss of Growth Hormone Receptor Signalling - IGF-1 does not restore receptor signalling, it supplies the mediator that signalling would have produced, which is exactly why it survives the antibodies. Also curated a limit on the substitution: IGFBP-3 was low and did not rise on IGF-I, which the authors read as showing that GH effect is not IGF-1-mediated.

    diagnosis, the second blocking finding. Two entries built from quotes already sitting in a cache file this PR ships: molecular confirmation of the GH1 lesion by PCR of the flanking regions, and carrier genotyping in relatives from dried blood spots. Both bind NCIT:C19770 Molecular Analysis. The first entry states why it matters - this is a molecular diagnosis rather than a deletion-only one, so a workup stopping at deletion screening misclassifies the nonsense and frameshift patients.

    biochemical, the third blocking finding. GHBP is the discriminator the notes paragraph was arguing in prose: normal here because the receptor is intact and there is no ligand, characteristically low in receptor defects, and unchanged across three years of GH therapy. Added alongside IGFBP-3 and the anti-GH antibodies, the last deliberately unbound for the reason below.

    HPO new-term request, from the suggestions. Filed as dismech issue #9231 rather than left implicit, citing HP:6000494 Anti-factor VIII antibody positivity as the precedent - an inhibitor antibody against a replacement protein in a patient lacking the endogenous version, which is this situation with growth hormone in place of factor VIII. The issue number is recorded in notes; the upstream request belongs at obophenotype/human-phenotype-ontology.

    The failed desensitisation, from the suggestions. PMID:10417965 also records that desensitisation with small daily doses of exogenous GH was attempted in the two Brazilian children and anti-GH antibodies appeared anyway. Curated as REFUTE evidence on the knowledge gap, because a probed and failed intervention is a different state of knowledge from an untried one - and it is the reason this entry has no immune-tolerance-induction treatment.

    PMID:16607923 also strengthened the gap in a way the review did not anticipate: two cousins with an identical genetic defect diverged all the way to final height, one reaching her target range and one responding far less favourably. The authors name three candidate explanations (genetic disposition, specific epitopes, induction of tolerance) and do not choose between them; those are added to the candidate list rather than replacing the residual-expression and preparation hypotheses already there.

    biological_scale on Loss of Growth Hormone Receptor Signalling changed from ORGANISM to CELLULAR, as suggested - the node carries GO:0060396, a cellular-scale process, and the organism-scale consequences are already on the downstream phenotypes.

    Prevalence, checked rather than filled. MONDO:0009876 carries Orphanet:231662; the record built from the pinned Orphadata snapshot holds synonyms and six cross-references with no epidemiology table, no HPO frequency table and no definition - Orphanet treats IGHD IA as a clinical subtype rather than a disorder. This is the second disorder in this batch where the review's assumption that Orphanet would supply prevalence turned out to be false. No primary reference gives a population figure for this entity either. The one figure that exists - 1 in 4,000 to 1 in 10,000 live births for isolated GH deficiency of all types - belongs to the parent category and is deliberately not curated here, since type IA is its rarest member and the parent's rate would overstate it by an unknown factor. All of this is recorded in notes so the gap is not re-opened as unfilled work.

    Deep research, the process note. Ran the claude_code provider: 23 of 23 identifiers resolved, none unresolved, 1 of 1 quote valid, 20 of 23 on topic and none off topic, so three undecided. It contributed PMID:9432120, a multi-ethnic GH1 sequencing series in 83 families that is now behind a new case_fractions record - GH1 alterations in 8 of 12 IGHD IA families against 7 of 71 in all other GH-deficient families - plus the modal 6.7-kb deletion at 78% and the population variation in molecular yield (11.6% Northern Europe, 14.7% Mediterranean, 31.2% Asia). The case_fractions note states what that denominator is: the sensitivity of GH1 sequencing in an already-classified phenotype, not the share of a disease attributable to a gene. The run also independently reached the same epidemiology conclusion recorded above.

    Validation: just validate passed with 42/42 snippets verified; just validate-terms passed; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates run. Pathograph verified as one connected component over 4 pathophysiology nodes, 4 phenotypes and 9 edges, no dangling downstream, target_mechanisms or attaches_to references, and cited references reconciling with the references block in both directions.

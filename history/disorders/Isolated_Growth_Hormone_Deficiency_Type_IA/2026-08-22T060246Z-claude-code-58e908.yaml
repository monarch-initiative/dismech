  summary: State the mixed-cohort bound on the rhIGF-1 counterweight evidence
  details: |
    Acts on the one non-blocking observation from the approving review of PR #9230, after checking it against the cached abstract.

    The reviewer noted that PMID:16607923's cohort of four mixes GH1 defects with a GH receptor mutation and that the abstract does not say which three patients received rhIGF-I, and judged that nothing needed changing. Reading the abstract, the point is slightly stronger than that framing: a GH receptor mutation is the mirror disease rather than this one, so an unknown share of the "moderate" rhIGF-I response the entry uses as its counterweight may not be about IGHD IA at all.

    That matters because the counterweight is doing real work. It is the reason this treatment is curated as second-line rescue with a heterogeneous response rather than as a solution, and a future curator reading "response moderate" as a clean IGHD IA finding would over-read it. The explanation now states the cohort composition, that rhIGF-I went to three of the four, that the abstract does not say which three, and what that bounds. The evidence item stays PARTIAL and the snippet is unchanged.

    This is the same defect class as the five earlier instances in this batch - a claim in free text that no gate can check - at its smallest magnitude: not a false statement, but a true one presented without the limit that qualifies it.

    Validation: just validate passed with 42/42 snippets verified; just validate-terms passed; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates run. No cache churn; one file changed.

  summary: 'Create: Isolated Growth Hormone Deficiency Type IA'
  details: |
    New entry for isolated growth hormone deficiency type IA (MONDO:0009876), the most severe Mendelian form of IGHD - autosomal recessive, complete absence of endogenous growth hormone, severe dwarfism by six months.

    The organising claim is that the same lesion causes the disease and the failure of its treatment. Patients with complete GH1 loss of function have never been exposed to growth hormone, so they were never made tolerant to it; given recombinant GH, many mount an antibody response against the hormone and those antibodies can abolish the growth response the treatment was given for. The entry curates that as a second arm downstream of the absence node rather than as a treatment complication, because it follows from the mechanism rather than from the drug.

    The natural experiment that establishes this is the heterozygote, and it is curated as evidence rather than left as reasoning: a carrier with one deleted allele and one allele producing non-truncated protein has circulating GH and is usually immune tolerant. Tolerance tracks the presence of endogenous hormone rather than the genotype, which is what identifies antigen absence - not the mutation - as the cause of the antibody response. That is as close to a controlled comparison as a rare disease offers.

    Four pathophysiology nodes and four phenotypes joined by seven downstream edges into one connected component, with every phenotype attached to the node that produces it. Complete absence of endogenous growth hormone is curated as the central effector rather than "deficiency", deliberately: the other three Mendelian IGHD forms all have diminished GH, and a quantity that is reduced behaves differently in the immune system from one that is zero. The tolerance arm depends on that distinction.

    Definitional care taken from the cited review. The entity is complete GH deficiency caused by severe GH1 loss of function, not "the GH1 deletion syndrome" - deletions of roughly 6.7 to 45 kb are commonest but nonsense and frameshift mutations predicting complete absence of bioactive hormone cause the same disease, and an entry organised around deletions would misclassify those patients. The review states this explicitly and the sentence is curated.

    A KNOWLEDGE_GAP records what the tolerance account does not explain: variation among patients who all have no endogenous hormone. Its sharpest form is the Italian sibship - three children, one 45-kb deletion, two with high-titre antibodies and secondary growth arrest, one growing normally with very low titres. Genotype held constant, outcome different. A separate patient with a 7.0-kb deletion seroconverted with low binding capacity and grew for at least three years. So titre and binding capacity, not seroconversion, determine whether therapy fails, and nothing curated predicts which a patient will develop.

    The treatment evidence is deliberately mixed. The Italian sibship observation is marked PARTIAL because it is simultaneously evidence for and against the therapy - the same treatment in three siblings with the same deletion, working in one and neutralised in two - and it is the single most informative observation about this treatment in this disease. The 1997 case showing sustained catch-up growth despite low-binding-capacity antibodies is also PARTIAL, curated as a counter-case so the entry does not read as though seroconversion always means failure.

    The antibody phenotype is deliberately left unbound to an ontology term. HPO carries specific "X antibody positivity" terms but none for anti-growth-hormone antibodies, and the nearest generic candidates describe concentrations rather than the presence of a specific antibody, so binding either would assert something the phenotype does not claim. A first draft bound it to reduced circulating growth hormone concentration; that was wrong for exactly this reason and was removed before commit. The claim is carried by the phenotype name, description and evidence instead.

    Relationship to the existing knowledge base: Growth_Hormone_Insensitivity_Syndrome (Laron) is the mirror lesion - receptor-side, with growth hormone present and often elevated and unable to be heard. Here the receptor is intact and there is nothing to hear. Similar growth phenotypes by opposite lesions, and only one of them has an immune tolerance problem, because only one lacks the antigen. Neither is a subtype of the other, and the notes say so.

    No GeneReviews chapter exists. The All Fields search returned chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase deficiency and AIP familial isolated pituitary adenomas - the same false-positive pattern seen twice more in this batch, recorded rather than the absence merely asserted.

    The primary sources date from 1994 to 2006. That is a property of the entity rather than a gap in curation: IGHD IA was molecularly characterised in that period and recent literature on isolated GH deficiency has moved to other genes and to combined pituitary deficiency. A 2020-2026 search returned nothing on this entity, and the notes record that.


  summary: 'Create: Hypervalinemia_And_Hyperleucine-isoleucinemia'
  details: |
    New entry for BCAT2 deficiency (MONDO:0100058, hgnc:977). Deep research was attempted with the falcon provider (with --fallback) but failed with an Edison authentication error, so no deep-research report was produced; literature was gathered directly from PubMed. Sources: the index report (PMID:25653144), Knerr 2019 series (PMID:31177572), the Spanish newborn-screening study (PMID:30626930), the eighth-case report (PMID:40248769), the 2026 Slovenian case series and systematic review (PMID:41623317), the ClinGen Definitive AR assertion (CGGV:assertion_b5e16ee6...), and two Bcat2 knockout mouse papers (PMID:17767905, PMID:20133434). The pathograph runs BCAT2 loss of function -> impaired mitochondrial BCAA transamination -> systemic BCAA accumulation without ketoacid excess -> biochemical phenotypes (DIRECT) and neurological phenotypes (UNKNOWN, grouped under an EMERGING hypothesis), reflecting that the clinical pathogenicity is unresolved; a CONTROVERSY discussion records this. Insulin resistance carries a REFUTE item from the knockout mouse, and the seizure carries the reporting authors' own caveat as REFUTE. The contrast with MSUD (normal ketoacids, undetectable alloisoleucine, no encephalopathy) is captured in biochemical rows. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (47/47), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

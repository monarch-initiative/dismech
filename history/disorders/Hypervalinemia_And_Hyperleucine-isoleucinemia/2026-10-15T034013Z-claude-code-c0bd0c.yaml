  summary: 'Review rounds 1-2: evidence regrading, frequency, deep-research report'
  details: |
    Review round 1 (PR 14263) asked for a deep-research artifact and made two suggestions. The PMID:31177572 sentence under mechanistic_hypotheses states that it is unclear whether developmental delay and autism belong to the disorder; it was regraded from REFUTE to NO_EVIDENCE because it states uncertainty rather than contradicting the hypothesis. Hyperleucinemia was marked VERY_FREQUENT, citing the PMID:40248769 review sentence that the deficiency elevates plasma BCAAs; Hyperisoleucinemia was left without a frequency because isoleucine elevation is less consistently reported. Deep research: Falcon failed to authenticate; an Asta run returned papers about unrelated diseases and was not committed. The OpenScientist report (9 references resolved, 0 unresolved) is committed. It was checked against the entry and adds no gap: it describes only the 2015 index case and states that no later cases were found, whereas the entry already covers the later case series (PMID:31177572, 30626930, 40248769, 41623317). Its one source not cited in the entry, PMID:26351290 on protein turnover in the Bcat2 knockout mouse, concerns muscle metabolism rather than the human disease and was not added.

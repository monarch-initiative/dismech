  summary: 'Review round 1: GeneReviews evidence, GNB1 molecular functions, movement
    phenotypes, intrathecal baclofen'
  details: |
    Response to the first ai4c-reviewer round on PR #15211.
    GeneReviews (PMID:32134617) abstract sentences added as evidence: the
    clinical-characteristics sentence on developmental delay, intellectual
    disability, brain morphology, hypotonia and seizure; the less-common
    findings sentence on dystonia, cerebral visual impairment (reduced vision),
    growth delay, GI, GU and cutaneous mastocytosis; the management sentence
    on antiseizure medication and physical/occupational therapy; the
    germline-mosaicism recurrence sentence on the inheritance block. The
    "behavior issues" phrase was not attached to the autism or ADHD nodes
    because it does not name either.
    GNB1 molecular functions bound on the variant node from QuickGO
    annotations of P62873, labels checked on OLS: GO:0051020 GTPase binding
    (IPI) and GO:0099104 potassium channel activator activity (IDA,
    PMID:23739333), matching the assembly and GIRK arms. Fixes the
    check_gene_activity_grounding finding.
    Added Myoclonus, Ataxia and Chorea from PMID:38674235 (sentences quoted
    with ellipses around bracketed citation numbers); myoclonus and chorea
    are wired from the hyperexcitability node under the review's proposed
    mechanism, ataxia is left unconnected. Added intrathecal baclofen
    (CHEBI:2972) as a proposed, not reported, treatment, and the single-case
    pallidal DBS sentence on the DBS treatment. Genetic notes now say the
    cited sources do not quantify malignancy risk and that 8/13 discovery
    variants overlap somatic tumor hotspots; no CBC surveillance claim.
    Validated with validate, validate-terms, count-verified-snippets (72/72),
    entity-ref, causal-target, coarse-phenotype, gene-activity-grounding and
    the offline gates, then validate-disorders.

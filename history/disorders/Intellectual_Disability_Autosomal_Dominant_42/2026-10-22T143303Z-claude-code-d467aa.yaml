  summary: 'Create: Intellectual Disability Autosomal Dominant 42 (GNB1 encephalopathy)'
  details: |
    New entry for GNB1 encephalopathy (MONDO:0014855), claim #15202.
    Deep research: one Perplexity report
    (research/Intellectual_Disability_Autosomal_Dominant_42-deep-research-perplexity.md).
    Its reference validation resolved 13/13 references. Its term table
    proposed several wrong CURIEs that the report's own term check did not
    name-check (it name-checked only 2 of 82 terms): NCIT:C617 given as
    ethosuximide is Lomustine; NCIT:C52003 given as gastrostomy is
    Thrombectomy; NCIT:C116551 given as deep brain stimulation is Case
    Management; NCIT:C15329 given as physical therapy is Surgical Procedure;
    HP:0011970 given as cutaneous mastocytosis is Cerebral amyloid angiopathy.
    None were used; every CURIE in the entry was looked up on OLS.
    PMID:31034681 (DBS case report) was cached with no abstract and is not cited.
    Phenotype baseline is the GeneReviews chapter PMID:32134617 (tagged);
    frequencies come from Hemati 2018, Fukuda 2020 (pooled 16/31), the 2024
    case report and review (PMID:38674235) and Kleinendorst 2024. ClinGen
    Definitive assertion recorded under gene_disease_validity; its narrative
    is also quoted to mark the haploinsufficiency arm as provisional.
    Mechanism chain: variant -> defective Gbeta-gamma assembly (missense and
    truncating) and allele-specific GIRK dysregulation (K78R gain, I80T/N loss)
    -> cortical network hyperexcitability -> thalamocortical spike-wave
    discharges -> seizures, from the K78R knock-in mouse; neurodevelopmental
    phenotypes are wired from a knockout-derived node as INDIRECT edges.
    Validated with just validate, validate-terms, count-verified-snippets
    (all snippets verified), check-entity-refs, check-causal-targets, and
    validate-disorders. 13 of 24 phenotype nodes were initially unconnected;
    after wiring, GI, GU, mastocytosis and acute encephalopathy remain
    unconnected because no source proposes a mechanism. The GI and GU
    phenotypes are bound to organ-system HPO terms with
    coarse_binding_basis SOURCE_UNSPECIFIED, since the cohort abstract reports
    only 'gastrointestinal anomalies' and 'genitourinary anomalies'.

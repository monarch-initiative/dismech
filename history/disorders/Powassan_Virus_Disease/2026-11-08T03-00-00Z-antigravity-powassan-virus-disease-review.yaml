  summary: Enriched Powassan Virus Disease with Harrison's classifications, anatomical/cell-type/process bindings across pathophysiology nodes, age-scoped CSF and brain MRI diagnostic entries, and separate empirical corticosteroid and IVIG treatment records.
  details: Added Harrison's chapter classifications (INFECTIOUS_DISEASES, NEUROLOGIC) backed by PMID:40545598 and PMID:38133440. Enriched all five pathophysiology nodes with anatomical locations (skin epidermis, lymph node, blood, spleen, blood-brain barrier, brain, cerebellum, thalamus, brainstem, cerebral cortex), macrophage cell type on Peripheral Replication and Viremia (noting murine phagocytosis-vs-productive-infection ambiguity and splenic macrophage findings from PMID:40545598), and viral genome replication process (GO:0019079). Added diagnostic flags/descriptions on core phenotypes, expanded diagnosis with age-scoped CSF analysis figures and verbatim brain MRI involvement percentages, omitted therapeutic_modality on generic Supportive Care (NCIT:C15747), and modeled Empirical Systemic Corticosteroid Therapy (CHEBI:50858) and Empirical Intravenous Immunoglobulin (NCIT:C121331, NCIT:C80829) as separate treatment records.

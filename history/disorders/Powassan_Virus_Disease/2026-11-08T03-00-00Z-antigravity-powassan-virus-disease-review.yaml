  summary: Enriched Powassan Virus Disease with Harrison's classifications, anatomical/cell-type/process bindings across pathophysiology nodes, CSF/MRI diagnostic entries, and empirical immunotherapy/supportive care details.
  details: Added Harrison's chapter classifications (INFECTIOUS_DISEASES, NEUROLOGIC) backed by PMID:40545598 and PMID:38133440. Enriched all five pathophysiology nodes with anatomical locations (skin epidermis, lymph node, blood, spleen, blood-brain barrier, brain, cerebellum, thalamus, brainstem, cerebral cortex), macrophage/dendritic cell types, and viral genome replication process (GO:0019079). Added diagnostic flags/descriptions on core phenotypes, expanded diagnosis with CSF analysis and brain MRI, and enriched treatments with target mechanisms and empirical corticosteroid/IVIG therapy.

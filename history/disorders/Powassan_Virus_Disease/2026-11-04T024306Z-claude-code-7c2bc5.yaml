  summary: 'Create: Powassan Virus Disease'
  details: |
    Created Powassan Virus Disease (MONDO:0000276), an emerging North American tick-borne orthoflavivirus. The claude_code deep-research run misfired (returned clarifying questions, not a report, with 0 citations), so evidence was sourced directly from PubMed: two 2025 comprehensive reviews (PMID:40545598 pathogenicity/virulence; PMID:40733731 innate immunity), a 2023 systematic review of 84 published cases (PMID:38133440), a 2026 mouse neuroinvasion/BBB/neuroinflammation study (PMID:42577415, MODEL_ORGANISM), and a 2026 Vermont diagnostic-delay report (PMID:42182837). Modelled causal chain: Ixodes tick-saliva inoculation and flaviviral endocytic entry -> peripheral replication/viremia -> BBB disruption and neuroinvasion -> neuroinflammation and neuronal death (microglia/astrocyte activation, caspase-3/p16, gray-matter predilection) -> encephalitis/meningitis and neurological phenotypes. All 11 phenotypes wired into the pathograph. Agent (NCBITaxon:11083), two Ixodes vectors, enzootic reservoir, Ixodes-bite transmission, diagnosis, biphasic progression, CDC 2004-2022 case burden, supportive-care treatment. MONDO label 'Powassan encephalitis' is narrower than the curated clinical entity; noted as an upstream MONDO report. Validated: just validate (schema+terms+26/26 snippets), entity-refs, causal-targets, granularity (deterministic classes clean), coarse/logical/enum/duplicate-key gates. GeneReviews NO_CHAPTER (infectious).
    Self red-team review (fresh-context subagent) applied before PR: rebound the BBB endothelial cell from CL:1001602 (cerebral cortex endothelial cell) to CL:2000044 (brain microvascular endothelial cell), rebound the paralysis phenotype from HP:0001269 (Hemiparesis, which asserted a laterality the general-paralysis evidence did not support) to HP:0003470 (Paralysis), and refined the neuronal apoptosis process to GO:0051402. All 26 snippets re-verified and all gates re-run green.

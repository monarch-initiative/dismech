  summary: 'Review round 1: add the top-level references block, the hearing-aid device
    qualifier, and two recorded declines'
  details: |
    Answered the first review round on PR 11413. Blocking finding accepted: the entry had no top-level references block, so the four cited PMIDs carried no titles and the applicable GeneReviews overview was untagged. Added a references block with PMID:20301607 Genetic Hearing Loss Overview carrying tags GeneReviews, plus titles for the four cited PMIDs, each copied exactly from its cached frontmatter. The notes now state that the GeneReviews entry is a bibliographic tag only, because its cached abstract is a statement of the chapter's purpose with no mention of CLDN9 or claudin and nothing in it is quotable. Reviewer suggestion one accepted but not as proposed. The review named NCIT:C120533 as the hearing-aid device term. That CURIE resolves to CDISC SEND Cardiovascular Test Name Terminology, verified with runoak against the local NCIT build, so it was not used. Searched NCIT and bound NCIT:C183182 Hearing Aid instead, carried as a qualifiers predicate-value pair under NCIT:C16830 Medical Device, matching the pattern the cochlear implantation entry in the same file already uses. check-qualifier-terms-online confirms all four qualifier labels match the ontology. Reviewer suggestion two declined with the reason recorded in notes: speech and language therapy NCIT:C159273 resolves correctly, but its yield depends on age at onset relative to language acquisition, and onset is the one variable this entry does not settle, carrying both a REFUTE item and an open question on whether the loss is prelingual or postlingual. Adding a third uncited treatment whose indication turns on that unresolved variable would assert more than the two existing uncited treatments do. Reviewer suggestion five accepted: the notes now record that the module's Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration node is also declined, and why it differs from the progression node already recorded, namely that no CLDN9 source reports spiral ganglion neurons at all, which is absence of evidence rather than a contradicted claim. Suggestions three and four needed no change and the review said so. Validation after the edits: just validate passed with 78 of 78 snippets verified, just validate-terms passed, check-qualifier-terms-online passed, and just validate-disorders passed as the authoritative batched gate. just qc was not run because it exceeds the available tool timeout.

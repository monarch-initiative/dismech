  summary: 'Create: Hearing_Loss_Autosomal_Recessive_116'
  details: |
    De novo curation of DFNB116 (CLDN9, MONDO:0033670) from three primary human reports (PMID:31175426 Turkish family, c.86delT; PMID:34265170 Pakistani and Moroccan families, p.Glu159Lys and p.Ile124dup) plus the Cldn9 nmf329 mouse (PMID:19696885) and the Cldn9 dosage/tet-OFF study (PMID:37873357). Lump/split: entry_type DISEASE, consistent with 26 sibling numbered DFNA/DFNB entries; MONDO:0033670 is a leaf with one causal gene and no descendants.

    Mechanism discipline was the main curation decision. The endolymph-perilymph barrier story is demonstrated in mouse and in transfected epithelial monolayers only: the nmf329 mouse has a raised perilymphatic K+ with a NORMAL endocochlear potential and normal endolymphatic K+, and causality is established by two rescues (low-K+ organ culture, pou3f4 deletion). Nothing equivalent has been measured in a human cochlea, so the three pathophysiology nodes downstream of the protein lesion carry mechanism_confidence: PROVISIONAL, the general claudin-barrier statement is graded directness: INDIRECT, and two discussions record the gap (cldn9_barrier_mechanism_unmeasured_in_humans; cldn9_dosage_versus_barrier_function). A HUMAN_MODEL_MISMATCH discussion records that the mouse is uniformly deaf across frequencies while the human audiogram spares low frequencies.

    Conformance: three nodes conform to sensorineural_hair_cell_loss (Cochlear Sensory Epithelium Insult, Cochlear Ionic Homeostasis Disruption and Oxidative Stress, Hair Cell Mechanotransduction Failure and Death). The final node deliberately does NOT conform to that module's Progressive Sensorineural Hearing Loss node, because progression is contradicted in one of the three families (stable over 10 years in family HLRBS10).

    Excluded: the fourth reported individual with p.(Cys25Trp) and fluctuating hearing loss is kept out of the phenotype and prevalence sections and handled as a KNOWLEDGE_GAP; its primary report (PMID:33924653) is abstract-only in cache and contains no CLDN9 sentence, so every statement about it is quoted from PMID:34265170's description. Both device treatments (amplification, cochlear implantation) are curated without evidence and say so in notes, because no primary report describes any patient's audiological management.

    Deep research: claude_code provider, 250 s, 8/8 references resolved, 0 unresolved; preflight-dr PASS (CLDN9 x33, OMIM 619093 matched). Two factual errors in the DR report were not propagated: it gives the Nakano PMID as 19696886 (correct: 19696885) and describes family HLRBS10 as a Turkish mother and two daughters (correct: Pakistani siblings). None of its suggested ontology CURIEs were used - its Term Validation section flagged UBERON:0000407 called Cochlea (actually sympathetic trunk), UBERON:0004551 called Organ of Corti (obsolete plantar arteries), and CL:0002067 called type I outer hair cell (type A enteroendocrine cell).

    Validation: just validate, validate-terms, count-verified-snippets (78/78), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-qualifier-terms-online, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-term-cache-integrity, normalize-cache all pass; just validate-disorders passes (78/78 snippets).

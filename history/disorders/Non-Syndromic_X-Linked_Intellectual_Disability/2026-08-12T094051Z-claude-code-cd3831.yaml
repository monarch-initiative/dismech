  summary: 'Create: Non-Syndromic X-Linked Intellectual Disability'
  details: |
    Created the umbrella entry for non-syndromic X-linked intellectual disability (MONDO:0019181), completing the non-syndromic intellectual-disability trio alongside the existing autosomal dominant and autosomal recessive entries. Modelled 8 gene-anchored has_subtypes (IL1RAPL1/MRX21, PAK3/MRX30, GDI1/MRX41, TSPAN7/MRX58, FTSJ1/MRX9, ACSL4/MRX63, AFF2/FRAXE, and the non-syndromic arm of the ARX allelic series), each bound to a MONDO descendant of the root term; SLC9A7 curated under genetic because no MONDO descendant was confirmed. Five-node pathophysiology chain from X-linked gene disruption through hemizygous expression and convergent synaptic disruption to static cognitive impairment without brain malformation. Three KNOWLEDGE_GAP discussions: the Piton 2013 questioned-gene reassessment (17 of 25 challenged genes still unresolved as of the 2017 update), the instability of the syndromic/non-syndromic boundary, and the absence of a group-level prevalence. Per the curation issue, syndromic entries were deliberately excluded: FGD1, ZDHHC9 and OPHN1 map to syndromic MONDO entities, RLIM placement is unresolved, and AGTR2 is excluded on evidence grounds. Deep research: Edison (falcon). NEC preflight returned SKIP because MONDO records no causal gene for this umbrella term; the manual fallback check was performed and passed - the report top genes are all genuine XLID genes and the report is unambiguously about this entity. Every PMID and snippet used from the report was independently fetched and verified against the cached abstract.

    A self-review round was run before opening the PR and materially changed the entry. Its blocking finding: a first pass conflated two distinct Edison citation keys by the same Basque group, and as a result the dedicated NS-XLID review (Tejada and Ibarluzea 2020, PMID:31898314) - the report's most-cited source - was omitted entirely, while a notes block asserted a citation-resolution that had not actually been verified. That review has been fetched and added, and now sources the class definition, the not-clear-cut syndromic/non-syndromic boundary statement, and the 141-gene count; the notes block has been corrected to record both keys under their separately verified identities and to state that the DOI-to-PMID converter returns no PMID for the review's DOI. Other review fixes: removed three evidence items whose snippets did not make the claim they were attached to (global developmental delay, speech delay, and ARX seizures - the last quoted the syndromic ARX entities this entry deliberately excludes), keeping the phenotypes as described clinical context; added the FRAXE founding paper (PMID:8673086) because the previous evidence quoted sequence variants rather than the defining CCG repeat expansion; renamed the convergence node from Synaptic to Neuronal Function and hedged its description, since the tRNA, fatty-acid and Golgi-pH arms have no cited synaptic endpoint; hedged the IL1RAPL1 and TSPAN7 mechanism prose, which restated authors' speculation as fact; hedged the static/non-progressive claim, which no cited source evidences; retagged six evidence_source values (PAK3 and IL1RAPL1 expression work to MODEL_ORGANISM per their MeSH species terms, TSPAN7 in situ hybridisation to IN_VITRO, three textbook background statements to OTHER); added Chaves 2023 (PMID:36943625) for the X-inactivation-skewing yield, marked PARTIAL because half its recovered variants were autosomal; dropped three unquantified OCCASIONAL frequency bands and an unevidenced COMPLETE penetrance; dropped a misleading HP:0001249 binding from the absence-of-features phenotype and unsupported pyramidal/glutamatergic cell-type specificity; and changed a case-fraction prevalence record from PERIOD_PREVALENCE to UNKNOWN.

    Validation after all fixes: just validate (schema and terms) passes; just validate-disorders - the batched schema, terms and reference sweep CI runs - passes with exit 0 and reports 83/83 snippets verified; just verify-datasets OK for geo:GSE179384; targeted pytest FK/uniqueness selection 6055 passed and the full tests/test_data.py suite passed. Global compliance 92.3 percent, weighted 92.2 percent - slightly below the pre-review 93.8 percent because unsupported evidence items were removed rather than retained for score.

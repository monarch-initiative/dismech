  summary: 'Address PR review suggestions: Non-Syndromic X-Linked Intellectual Disability'
  details: |
    Addressed the seven non-blocking SUGGESTIONs from the automated review on PR #8367 (the PR was already APPROVED with no CRITICAL or IMPORTANT findings; these were optional improvements).

    Split fragile X (FMR1) repeat testing into its own diagnosis entry, since a repeat expansion is not reliably called by exome or panel sequencing so a normal sequencing result does not exclude fragile X. Three evidence items: the most-common-XLID-entity statement (PMID:22482801), the referral-level exclusion step and the normal-repeat entry criterion of the Basque cohort (PMID:31906484). Also added diagnosis_term bindings to all four diagnosis entries (NCIT:C19770 Molecular Analysis, NCIT:C15709 Genetic Testing, NCIT:C16809 Magnetic Resonance Imaging), which had none.

    Added the two mechanistic arms missing from the convergence node's machine-readable biological_processes: Golgi/post-Golgi pH regulation (GO:0051453) and glycosylation of exported cargo, plus the AFF2/FMR2 transcriptional-activation arm (GO:0045893). The reviewer suggested GO:0006486 for glycosylation; that term is OBSOLETE (reason for obsoletion: it represents a molecular function) and was replaced with its declared successor GO:0009101 glycoprotein biosynthetic process. GO:0045893 was chosen over the suggested GO:0006357 because the supporting assays are yeast and mammalian reporter transcription-activation experiments that do not resolve promoter class. The transcriptional arm is newly evidenced by Hillman and Gecz 2001 (PMID:11355014, fetched this session): one IN_VITRO item for the activation assays and one HUMAN_CLINICAL item connecting FRAXE methylation silencing of FMR2 to the cognitive endpoint. The node description now names the AFF2 arm.

    Added anatomical grounding via the locations slot: cerebral cortex (UBERON:0000956) and hippocampal formation (UBERON:0002421) on the TISSUE node, both already named in its description and in its cited expression snippets; brain (UBERON:0000955) on the ORGANISM node.

    Added two group-level phenotypes that the previous round had judged unsupportable. Both come from the Basque cohort paper (PMID:31906484), whose cached record is full text: autistic behavior (HP:0000729), frequency OCCASIONAL, from the sentence that quantifies autism spectrum disorders in nearly 30% of the cohort while confirming in the same sentence that the cohort is phenotypically unspecific; and the existing Seizure entry, which was unevidenced and scoped to the ARX subtype, broadened to class level with frequency OCCASIONAL on the almost-15%-epilepsy figure for the X-linked group. The ARX-designation reasoning and the refusal to attach the syndromic-ARX quote are preserved in the description. The OCCASIONAL band for autism is recorded as the conservative reading of "nearly 30%", which sits exactly on the OCCASIONAL/FREQUENT boundary; that judgement is stated in the evidence explanation.

    Split Speech and Language Therapy (NCIT:C159273) and Occupational Therapy (NCIT:C121351) out of the lumped Supportive Care entry as queryable NCIT-coded entries, each explicitly recorded as carrying no evidence block because the deep-research support for them is full-text-only and no cached abstract enumerates the individual modalities. A PubMed search for an abstract-level source enumerating these modalities returned only GeneReviews chapters for other disorders (MBD5, DDX11), which would have been wrong-disease evidence and were not used. The Supportive Care description was rewritten accordingly: it no longer claims the modalities are deliberately unsplit.

    Retagged the PMID:38424476 evidence_source from HUMAN_CLINICAL to OTHER on the hemizygous-expression node, as the reviewer noted the quoted sentence is a methodological statement rather than a clinical observation, and applied the same correction to the second PMID:38424476 item on Supportive Care, whose snippet states the scope of a review.

    Recorded the negative clinical-trials result in notes rather than adding a clinical_trials block. Independently verified against the ClinicalTrials.gov API v2 this session rather than relayed from the deep-research report: a condition search for X-linked intellectual disability returns only syndromic entities (Rett, fragile X, MPS), and the two studies naming this population - NCT02854956 and NCT06500260 - were fetched individually and are phenotyping and natural-history studies, not treatments. Also recorded in notes why hypotonia and muscle weakness remain unmodelled: they appear only in the full text of PMID:30335141, whose cached record is abstract-only, so no verifiable snippet exists. A stale claim in the speech-delay phenotype description, which attributed that same gap to the --no-full-text flag rather than to the cache being abstract-only, was corrected - this session established that CI does accept snippets from cached full text.

    A second, independent review was then run by an agent given no context on this work and instructed to distrust the commit message, the notes prose and this history record. It returned APPROVE WITH SUGGESTIONS, and its findings were acted on in the same session. Two were substantive. First, the second PMID:11355014 evidence item was tagged HUMAN_CLINICAL although that paper reports no human clinical data (MeSH: HeLa cells, Saccharomyces cerevisiae) and the quoted sentence is the abstract's opening background statement - retagged OTHER, which is also the standard this session applied to the two PMID:38424476 items. Second, the convergence node's closed list of arms lacking a cited synaptic endpoint was not updated when the AFF2 arm was added, so it implied AFF2 had one - AFF2 added to the caveat.

    Suggestions also acted on: PMID:22482801 retagged OTHER (historical review, field-summary sentence) and its explanation corrected from "most common XLID entity" to "most common of the XLID syndromes", matching the quote; the FMR1 entry's "precondition of the workup" explanation softened to what the cohort sentence actually supports, with the generalisation labelled as the entry's own inference; both new frequency bands annotated with their real denominators (the 61 males are a referral population of whom only 16 received a candidate variant, and the epilepsy figure covers the roughly 47-proband X-linked sub-arm, not all 61); the parent/child HPO overlap between Atypical behavior (HP:0000708) and the new Autistic behavior (HP:0000729) resolved by removing the autism claim from the parent entry and stating why both are retained; the lost subtype cross-reference restored as a phenotype_contexts entry scoped to ARX-related, so the subtype association survives structurally without mis-scoping the class-level claim; the stale "verified against the cached abstract" sentence in notes corrected, since four snippets quote cached body text; the therapy entries' rationale corrected - a grep of all cached references for this entry finds no mention of speech-language or occupational therapy at all, including in a full-text-cached source, so the DR report over-attributed the modality list; and the trials note softened from "returns only trials in syndromic entities" and now records that NCT02854956 is registered as INTERVENTIONAL even though its intervention is a phenotyping protocol.

    Validation: just validate (schema and terms) passes; just validate-disorders - the batched sweep CI runs, with --no-full-text - passes with exit 0 and reports 90/90 snippets verified, confirming the two new body-text snippets are acceptable to CI; just validate-history passes; just check-cache-order and just check-term-cache-integrity pass, and the only cache diff is two additive rows for the new GO terms; the full tests/test_data.py suite passes (32173 passed). Global compliance is 92.3 percent (191/207), weighted 92.2 percent - level with the pre-review entry rather than the 92.7 percent reached mid-session, because the ARX phenotype context added during the second review round is deliberately unevidenced (the subtype label establishes that seizures vary without quantifying them).

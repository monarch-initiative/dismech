  summary: Enumerate 14 gene-defined MRX/IDX subtypes; decline 6 with reasons
  details: |
    Subtype-enumeration pass for the genetics-gap campaign (dismech#12227,
    epic dismech#12189), working the twenty gene-anchored MONDO descendants of
    this entry's own disease_term that the d2g coverage analysis flagged.

    ANCHOR CHECK (done first, as the job requires). MONDO:0019181 was
    re-verified against OLS4 and is the right anchor: its definition states
    that "intellectual deficiency is the only symptom of MRX", in contrast to
    the syndromic MRXS class, which is exactly what this entry models. It is a
    class term rather than a gene-defined leaf, and all twenty flagged
    concepts are direct rdfs:subClassOf children of it, so they were routed
    here by MONDO's own hierarchy and not by an over-broad anchor. No change
    to disease_term.

    ADDED - 14 has_subtypes rows, each with a bound subtype_term, a bound
    causal gene, a description, and exact-quote evidence from the primary
    report: MRX1 (IQSEC2), MRX19 (RPS6KA3), MRX50 (SYN1), MRX72 (RAB39B),
    MRX90 (DLG3), MRX96 (SYP), MRX97 (ZNF711), MRX101 (MID2), MRX103
    (KLHL15), MRX104 (FRMPD4), MRX105 (USP27X), MRX108 (SLC9A7), IDX110
    (FGF13), IDX112 (ZMYM3).

    ADDED - 13 new genetic[] entries with relationship_type CAUSATIVE,
    per-gene notes and their own evidence. SLC9A7 was already present and was
    promoted from a bare genetic entry to a subtype-backed one.

    ADDED - the reciprocal genetic[].subtype foreign key on all 22 genetic
    entries, including the nine that predated this change and carried none.

    WIRED - all 14 newly bound genes plus SLC9A7 onto the Convergent
    Disruption of Neuronal Function pathophysiology node, which previously
    reached 8 of the 9 genes then curated (SLC9A7 was unwired). That node now
    carries 22 gene descriptors, matching genetic[] exactly. Its description
    was extended to name the new mechanistic themes, and five GO biological
    processes were added for them: postsynaptic density organization
    (GO:0097106), synaptic vesicle endocytosis (GO:0048488),
    ubiquitin-dependent protein catabolic process (GO:0006511, deliberately
    without a modifier because the arm has no single direction - MID2 and
    KLHL15 are ligase-pathway components while USP27X is a deubiquitinase),
    chromatin organization (GO:0006325), and microtubule cytoskeleton
    organization (GO:0000226).

    CORRECTED - a pre-existing notes claim that no MONDO descendant of
    MONDO:0019181 had been confirmed for SLC9A7, which was the stated reason
    the gene was kept out of has_subtypes. The term exists: MONDO:0026723,
    whose primary label is "intellectual developmental disorder, X-linked 108"
    and which carries MRX108 only as a related synonym, so a disease-shaped
    label search misses it. This is the "no MONDO term exists for X is usually
    wrong" pattern the campaign brief warns about, found in pre-existing KB
    prose rather than agent-authored text.

    DECLINED - 6 of the 20, each with the reasoning recorded in notes:
    MONDO:0010506 (MRX61, RLIM - OMIM has renamed it Tonne-Kalscheuer
    syndrome; the entry's pre-existing exclusion is now verified rather than
    "unresolved"), MONDO:0010393 (MRX93, BRWD3 - reproducible macrocephaly
    and obesity, stub already exists), MONDO:0030907 (MRX106, OGT - the field
    has reclassified it as the syndromic OGT-CDG, stub already exists),
    MONDO:0975828 (IDX114, SRPK3 - defining report concludes for syndromic
    XLID), MONDO:0957203 (IDX111, SLITRK2 - declined on evidence grounds,
    following the entry's own AGTR2 precedent), MONDO:0010487 (MRX99, USP9X -
    defining report describes a distinctive male syndrome, and dismech's
    USP9X_Female-Restricted entry already treats it as a separate disease
    entry).

    SPOT CHECK - every one of the twenty MONDO terms had its RO:0004003
    causal-gene edge (read from OLS4) compared against the gene NCBI MedGen
    links to the same concept. All twenty agreed; no mis-bound term was found.
    Each HGNC CURIE was resolved to its symbol through the HGNC REST service
    or the committed cache in the same step it was written.

    EXPORT-LAYER MEASUREMENT - gene_to_edge keys every gene edge on the
    entry's own disease_term, so 0 of the 20 checklist terms are exportable at
    their own MONDO id, before or after this change; that is dismech#12316 and
    is not fixable by curation. What did move is the umbrella: the entry
    emitted 9 gene edges at MONDO:0019181 carrying 1 of the 20 checklist genes
    before, and emits 22 carrying 14 after.

    NOT DONE - ClinGen classifications are quoted in several descriptions but
    are not cited as CGGV evidence, because `just clingen-refresh` fails on a
    drifted upstream pin (dismech#10426) and re-pinning was out of scope.
    They were read from the live ClinGen gene-validity download on 2026-09-24
    and that provenance is recorded in notes. They should become cited CGGV
    evidence once the pin is repaired.

    SEARCHES RUN, recorded here because they are the basis of the SLC9A7
    correction above and of several "no such record" statements in notes. An
    OLS4 term lookup was run on each of the twenty MONDO terms in the
    reconciliation checklist, reading label, exact and related synonyms, OMIM
    xrefs and the RO:0004003 gene edge from the same response; a
    synonym-inclusive sweep matched every one of those labels and synonyms,
    normalised, against every kb/disorders/ filename and `name:` field and
    returned no collision; NCBI OMIM esummary was read for all twenty
    phenotype MIM numbers on 2026-09-23, which is where the Tonne-Kalscheuer
    rename was found; and a PubMed title search on FGF13 combined with
    intellectual disability, mental retardation or neurodevelopmental returned
    only the single report the IDX110 row rests on.

    GENEREVIEWS - `just check-genereviews` reports NO_CHAPTER for both
    GeneReviews and StatPearls against the committed Bookshelf index snapshot
    2026-09-10, confirming offline the entry's pre-existing prose claim that
    no chapter exists for the umbrella class.

    REVIEW ROUND 1 (PR dismech#12650). The reviewer found the biology,
    bindings and evidence sound and blocked on one convention issue: several
    new `notes:` paragraphs narrated this curation session rather than
    stating facts about the disease, which CLAUDE.md asks to keep in the
    history record instead. Moved here: the account of how the SLC9A7
    correction arose, the reciprocal-foreign-key and 8-of-9 gene-wiring
    counts, the gene-term spot check, the searches above, the GeneReviews
    re-confirmation, and the "re-pinning was out of scope" framing on the
    ClinGen paragraph. Kept in `notes:`, on the reviewer's advice, are the
    six decline reasons, the MONDO placement disagreements, the anchor
    statement, the ClinGen classifications with their read date, and the fact
    that MONDO:0026723 is the MRX108 term. Two optional suggestions were also
    taken: the IDX110 description now says "three male children", the
    source's own wording, and the ClinGen paragraph now points at
    dismech#10426 rather than explaining itself.

    VALIDATION - just validate, validate-terms, count-verified-snippets
    (151/151), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches (67
    bindings, 0 mismatches), check-genereviews, check-folded-hyphens,

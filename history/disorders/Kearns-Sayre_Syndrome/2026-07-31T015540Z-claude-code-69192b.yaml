  summary: 'Augment: Kearns-Sayre syndrome phenotypes, mechanism, treatments'
  details: |
    Augmented the existing KSS entry using the GeneReviews baseline PMID:20301382 plus claude_code and openscientist deep research. Added 12 GeneReviews/cohort-documented phenotypes: increased CSF protein, muscle weakness, exercise intolerance, dysphagia, cognitive decline, tremor, leukoencephalopathy, short stature, diabetes mellitus, hypoparathyroidism, renal tubular dysfunction, cardiomyopathy, with frequency qualifiers from the PMID:34872991 multicentre paediatric cohort. Added a Secondary Cellular Stress/CNS white-matter pathophysiology node PMID:38224444 with oligodendrocyte cell type and ROS/autophagy/apoptosis GO terms; added biological_scale tags and tissue-specific cell types to pathophysiology nodes. Added folinic acid targeted therapy, coenzyme Q10 PMID:3941783, and prophylactic pacemaker treatments plus the GeneReviews anesthesia safety warning. Added SLSMD population prevalence PMID:15781811. Validated with just validate and just validate-references, both pass; weighted compliance 89.5 percent.
- type: EDIT
  outcome: changed
  sections:
  - pathophysiology
  - phenotypes
  - histopathology
  - treatments
  summary: 'Address PR #7399 review (atomicity, connectivity, gaps)'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review. Split the bundled "Cardiac Conduction and Neurologic Energy Failure" node into atomic "Cardiac Conduction System Energy Failure" and "Central Nervous System and Auditory Energy Failure" nodes (resolving the AV-bundle/Purkinje cell-type ambiguity). Added three tissue-level energy-failure nodes (skeletal muscle, renal tubule, endocrine gland) and wired all previously orphaned phenotypes into the connected pathograph. Dropped the contradictory OCCASIONAL band on renal tubular dysfunction. Added Hypogonadism (HP:0000135, PMID:1424198, 20%) and refined short-stature/diabetes with KSS-specific denominators (PMID:1424198). Added a histopathology section and muscle-biopsy diagnosis entry for ragged-red/COX-negative fibers (PMID:17541738, PMID:38018320). Added target_mechanisms to folinic acid, coenzyme Q10, and pacemaker; added GeneReviews recurrence-risk figures; added Heart block frequency. Re-validated with just validate (schema+terms+references pass).

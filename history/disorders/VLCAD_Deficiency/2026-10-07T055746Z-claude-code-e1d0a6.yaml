  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn bloodspot screening diagnosis row: moved diagnosis_term from NCIT:C15419 Disease Screening to the more specific NCIT:C81178 Newborn Screening, and bound two dried-blood-spot measurements, LOINC:53191-3 Tetradecenoylcarnitine (C14:1) [Moles/volume] in DBS and LOINC:53193-9 Tetradecenoylcarnitine (C14:1)/Acetylcarnitine (C2) [Molar ratio] in DBS. Three reference ranges: Dutch NBS programme C14:1 cut-off at or above 0.8 umol/L for 2007-2010, with the later 0.6 umol/L referral value quoted in notes (PMID:26453363); New Zealand NBS programme C14:1 notification cut-off 2.5 umol/L, with the 0.9-2.4 sub-threshold follow-up finding as band interpretation (PMID:26743058); Dutch retrospective C14:1/C2 ratio cut-off at or above 0.020, with the 0.023 alternative and its sensitivity and PPV quoted in notes (PMID:26453363). Added loinc_term LOINC:LP19322-4 Tetradecenoylcarnitine (C14:1), the specimen-independent Part, on the biochemical C14:1 marker, which describes the analyte across newborn screening and plasma. The other two diagnosis rows (molecular confirmation, enzyme testing) are unchanged. All LOINC codes and labels read from the Monarch KG via just loinc-seed-cache; cache/loinc/terms.csv rows committed. Part of dismech issue 13642, batch 3.

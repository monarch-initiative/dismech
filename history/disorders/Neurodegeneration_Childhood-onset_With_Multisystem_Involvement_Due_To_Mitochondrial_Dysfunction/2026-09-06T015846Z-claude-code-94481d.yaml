  summary: Red-team review round on the new LETM1 entry, before external review
  details: |
    Pre-PR self-review of the entry created earlier in this session, run by a fresh-context subagent against the dismech-pr-review skill. It found no fabricated snippet and no wrong PMID; every snippet was already an exact substring, every frequency band correct, and every non-MONDO term label exact. What it did find, and what this round fixed: (1) Four evidence items pointed at the wrong node. The K+/H+ efflux node cited a swelling-and-cristae quote, and the OXPHOS-protein-loss node cited a respiratory-chain-deficiency quote; both are now cited to sentences that assert what the node claims, and the displaced swelling quote moved to the swelling node where it belongs. The top-level inheritance block's only evidence was the Wolf-Hirschhorn monoallelic sentence, which does not support autosomal recessive inheritance; the biallelic-cohort sentence is now the primary item and the WHS sentence is kept as an explicit contrast. (2) An explanation described a review as 'an independent review's reading of the same cohort' when PMID:41191133 cites PMID:36055214 as its source, so it is independent in authorship but not in evidence; that item was replaced by the primary sentence. (3) The claim that WHS seizures map to a terminal 4p region was stated twice as fact with no citation. The reviewer proposed weakening it; the better fix was available because PMID:26747863 is already in the cache and states it directly, so the claim is kept and now carries two quotes from that paper, and PMID:26747863 was added to the references block and to the WHS differential. (4) The aminoglycoside/tetracycline snippet had been truncated with an explanation claiming a non-ASCII dash prevented quoting the full sentence; that is false (962 existing kb/disorders snippets contain an en dash) and the full sentence verifies, so it is now quoted in full and the excuse deleted. (5) GO:0051402 neuron apoptotic process INCREASED asserted a cell-death mechanism no source reports; the binding is removed and the node now states that the mode of neuronal loss is uncharacterised. (6) GO:0033108 mitochondrial respiratory chain complex assembly DECREASED sat two lines below a description saying LETM1 is not an assembly factor; the binding is removed and the node records why no term is bound. (7) Cell types: CL:0000121 Purkinje cell was narrower than the source's 'cerebellar neurons' and the cochlear neuron the source names was missing, so the node now binds CL:1001611 cerebellar neuron and CL:0011113 spiral ganglion neuron, with the retinal ganglion cell relabelled as this entry's inference. (8) Two explanations described container state rather than evidence ('the closest HPO term available offline', the dash excuse) and were rewritten. (9) The 'over 150 genes' figure is from a 2016 paper and cannot include LETM1; the differential-diagnosis prose and explanation now date it. (10) Six phenotype fan-out edges were uncited and silent about it; each now carries a description saying the attribution is this entry's, and the notes block says so too. (11) Recalled-knowledge one-liners in the optic atrophy, spasticity, cataract, diabetes and hearing-loss descriptions were replaced with statements traceable to PMID:26917594's organ list, which notably excludes cataract and diabetes, and that exclusion is now stated rather than papered over. (12) The top description's 'and then' ordering of K+ efflux, swelling and protein loss contradicted the entry's own KNOWLEDGE_GAP discussion; it is hedged to match. 'Combined rather than isolated' complex deficiency is now marked as this entry's expectation rather than a source claim. The unhedged 'there is no earlier literature under any other name' now carries the same 'as far as the sources consulted here show' hedge the notes block already used. (13) The unsourced negative 'WHS does not present with respiratory chain complex deficiency' is replaced with a statement that no cited source addresses it. (14) The CONDMIM synonym is unsourced because omim.org is blocked here; it is kept as a search handle with its provenance disclosed in notes rather than dropped or dressed up as a cross-reference. Minor ontology fixes: modifier DECREASED added to the proton-transport process, and GO:0007007 regraded from DECREASED to ABNORMAL since distortion is not a decrease. VALIDATION AFTER FIXES: schema clean; snippets 42/42 verified (up from 36, all six new items verified); duplicate-key, entity-ref, causal-target, qualifier-term, enum-value, folded-hyphen, snippet-length, title-snippet and snippet-grading gates all pass; pytest 6106 passed; compliance 86.7% weighted. Offline term validation resolves every HP, GO, CL, hgnc and NCIT binding including the two new CL terms. MONDO:0859304 remains the single unresolved item, blocked by the same egress policy, and still needs a re-run of just validate-terms somewhere with ontology access before merge so its cache rows can be committed. NOT CHANGED: the reviewer suggested making Respiratory Chain Complex Deficiency MOLECULAR to match the node above it. Declined - that node's bound processes are oxidative phosphorylation and aerobic respiration, which are cellular-level, so CELLULAR is the accurate tag and matching it to its neighbour would make it worse.

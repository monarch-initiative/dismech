  details: |
    De novo curation of the LETM1-related entity (MONDO:0859304, OMIM 620089, CONDMIM). NO DEEP-RESEARCH PROVIDER RUN: the session's egress policy blocked every provider endpoint (api.platform.futurehouse.org, api.edisonscientific.com, api.openscientist.io all returned 403 at CONNECT), so 'just research-disorder falcon ... --fallback' could not reach any provider and no research/ report was produced. Reference fetching was blocked for the same reason (eutils.ncbi.nlm.nih.gov 403), so 'just fetch-reference' could not run and NO new references_cache/ file was created; curation was restricted to references already present in the committed cache. Four were used, all pre-existing: PMID:36055214 (the defining 2022 AJHG cohort of 18 individuals from 11 families, which carries the mechanism, the phenotype frequencies and the Wolf-Hirschhorn contrast), PMID:41191133 (2025 review, full text cached, for the K+/H+ exchanger function and the cochlear/cerebellar neuron target populations), PMID:23963300 (WHS deletion mapping, for the argument that monoallelic LETM1 loss is not sufficient for WHS), and PMID:26917594 (for the general mitochondrial-disease management and toxin-avoidance claims). GeneReviews baseline: no GeneReviews chapter exists for this entity - checked, and the absence is expected for a 2022 gene-discovery disorder. Pathophysiology is built as an eight-node causal chain from the biallelic variant through loss of mitochondrial K+/H+ exchange, matrix osmotic swelling, loss of OXPHOS protein components and respiratory chain deficiency to neuronal bioenergetic failure, progressive neurodegeneration and multisystem organ dysfunction; the swelling-to-protein-loss ordering is inference from the source's framing rather than a measured sequence, and that is recorded as a KNOWLEDGE_GAP discussion rather than asserted. VALIDATION: 'just validate' schema clean; 'just count-verified-snippets' 36/36 verified against the cached references; 'just validate-disorders' schema and reference validation both pass with 36/36 snippets. Offline term validation resolves every HP, GO, CL, hgnc and NCIT binding; the ONLY failure anywhere is MONDO:0859304, which is absent from cache/mondo/terms.csv and could not be resolved because www.ebi.ac.uk OLS is blocked by the same egress policy - the validator reports this as a service outage, not a data error, and the CURIE was taken from the committed stub rather than invented. It has NOT been independently verified in this session and needs a re-run of 'just validate-terms' somewhere with ontology access. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass. Compliance 86.1% weighted. No datasets block: 'just discover-datasets' could not reach NCBI, so the dataset search was never completed and its absence is unchecked rather than negative. The curated stub was deleted.

  summary: Add Orphanet prevalence records and refine ontology bindings in Dimethylglycine Dehydrogenase Deficiency
  details: >-
    Added Orphanet prevalence records (ORPHA:243343) for worldwide point
    prevalence (<1/1,000,000) and single-case literature count (ULTRA_RARE).
    Removed the duplicate GO cellular-component entry (GO:0005739 mitochondrion)
    from the locations slot on the DMGDH molecular function deficiency node,
    leaving GO:0005759 mitochondrial matrix in cellular_components. Bound the
    Fish-odor syndromes including trimethylaminuria differential diagnosis to
    MONDO:0011182 (trimethylaminuria) and updated the Supportive clinical
    monitoring target_phenotypes binding from HP:0500001 (Body odor) to
    HP:0410020 (Fish odor) to match the phenotype section.

  summary: 'Create: Combined immunodeficiency due to CD3gamma deficiency (MONDO:0014276)'
  details: |
    New de novo Disease entry for combined immunodeficiency due to CD3gamma deficiency (MONDO:0014276, CD3G, hgnc:1675). entry_type decided as DISEASE: the disorder has its own MONDO term under combined immunodeficiency, a single conserved pathograph (biallelic CD3G null -> impaired TCR/CD3 assembly -> reduced surface receptor -> attenuated TCR signalling -> distorted thymic selection and Treg failure -> autoimmunity plus infection susceptibility), and no existing kb entry mentions CD3G.

    Named Entity Confusion check: 'just preflight-dr' PASS on the falcon deep-research report (CD3G mentioned 40 times, top gene by a wide margin, OMIM 615607 consistent). The main same-gene confusion risk here is with the other CD3 chain deficiencies (CD3D/CD3E/CD3Z), which are severe combined immunodeficiencies rather than this disorder; every citation was checked to be about CD3G/CD3gamma specifically, and the CD3D/CD3E material is confined to the differential_diagnoses entry where it belongs.

    Evidence-source convention, stated in the entry notes and applied consistently: patient-sample measurements (flow cytometry, repertoire sequencing, clinical course) HUMAN_CLINICAL; culture-dependent or engineered-line work (PHA-driven T-cell blasts, Treg suppression co-cultures, Jurkat and JGN lines) IN_VITRO; mouse data MODEL_ORGANISM.

    Deliberately curated as a negative-result model link: the Cd3g-null mouse (PMID:9524111) PARTIALLY_RECAPITULATES the receptor-expression defect but FAILS_TO_RECAPITULATE the preserved peripheral T-cell compartment and skewed repertoire, with the species basis (human but not mouse gamma-delta TCR incorporates CD3delta) from PMID:17923503. Paired with a HUMAN_MODEL_MISMATCH discussion. A second KNOWLEDGE_GAP records the absent genotype-phenotype correlation.

    Not curated: no clinical_trials (none registered for this disorder), no datasets, no environmental factors, no biochemical reference ranges. Membership of an existing IEI grouping (Combined_Immunodeficiencies_IEIs) was noted as a follow-up rather than made here, to keep this PR to its own entry.

    Validation: just validate exit 0 (72/72 snippets verified), just validate-terms exit 0, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence all exit 0.

  summary: Review CD3G phenotypes, variable immune mechanisms and source-specific evidence
  details: |
    Reviewed all 16 original phenotypes on evidence, HPO specificity and causal attribution against the complete Falcon report and primary sources. Expanded to 48 scoped phenotypes, distinguished patient readouts from causal outcomes, qualified Treg/thymic selection and CD40L models, corrected PHA/CD69 and mouse-versus-human overclaims, retained overlapping-cohort and treatment-era laboratory caveats, and represented case-specific airway, gastrointestinal, hepatic and H. pylori-associated lymphoma routes. Recorded source-access limitations separately from biological attribution gaps. Preserved prior history and references; no generic grouping/module expansion. The composite combined-immunodeficiency designation is represented as a readout of cellular/humoral dysfunction rather than linked through definitional causal arrows.

  summary: Split MYC amplification into its own node with a molecular function
  details: |
    The gene activity grounding check flagged the MYC genetic entry as newly wired to a pathophysiology node (Clustered Structural Variant Hotspot Oncogene Amplification) with no molecular function. That node also carries CCND3, CCNE1 and CDK4, so no single GO molecular function is true of it. MYC was moved off the hotspot node into a new node, MYC Oncogene Amplification, reached by a downstream edge from the hotspot node and bound to GO:0003700 DNA-binding transcription factor activity (modifier INCREASED). The function is supported by an abstract quote from PMID:35203395 (review, Cells 2022) stating that MYC encodes a bHLH-ZIP transcription factor; MYC amplification in osteosarcoma is supported by PMID:24703847 and the PPR:PPR1322550 preprint already cited on the hotspot node. Found PMID:35203395 by a PubMed search for reviews with MYC in the title and transcription factor in the abstract; osteosarcoma-specific abstracts from a separate search did not state the transcription factor activity.

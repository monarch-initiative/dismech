  summary: Add histopathology, biochemical, surface/secondary subtypes and germline
    predisposition
  details: |
    Filled the largest content gap identified in docs/reports/pediatric-cancer-claim-evidence-review-2026-07-25.md section 3.1: histopathology and biochemical were both empty arrays. Added a histopathology block led by the defining diagnostic criterion (production of malignant osteoid by the neoplastic cells, NCIT:C53695), the three predominant-matrix subtypes (osteoblastic NCIT:C53953, chondroblastic NCIT:C4021, fibroblastic NCIT:C4020), and percent tumour necrosis after neoadjuvant chemotherapy (NCIT:C35957) with the 90 percent Huvos threshold. The necrosis node is curated with its limitations rather than as the strongest prognostic factor: the Nature Reviews Disease Primers source states that intensification in poor responders did not improve outcomes and that use of necrosis grading has declined, and both statements are carried as PARTIAL evidence. Added a biochemical block for serum alkaline phosphatase (NCIT:C16276) and lactate dehydrogenase (NCIT:C25184); the LDH entry carries a REFUTE item from a pediatric extremity cohort where LDH was not prognostic, because the literature is genuinely inconsistent. Added the parosteal and periosteal surface subtypes and a secondary osteosarcoma category (radiation, alkylator exposure, Paget disease), with the secondary entry explicitly flagged as an etiologic axis rather than a sibling of the histologic ones. Added a germline cancer predisposition genetic entry (18-28 percent germline variant frequency; TP53 and RB1 most common; Diamond-Blackfan and the RECQ helicase disorders) which closes the one-directional cross-reference noted in the review, since the Retinoblastoma entry already names osteosarcoma as its principal second malignancy. Added radiographic periosteal reaction (Codman triangle and sunburst, HP:0030313) and pathologic fracture (HP:0002756, OCCASIONAL, about 10 percent) as phenotypes. Sources are PMID:36481668 (Nat Rev Dis Primers, cached full text), PMID:26904501 and PMID:27645694 (newly cached via the reference validator), and the already-cited PMID:32751922. Several snippets preserve odd intra-word spacing from the source PDF text extraction; this is noted in the affected explanations. Validated with linkml-validate, linkml-term-validator (--labels) and linkml-reference-validator; all pass.

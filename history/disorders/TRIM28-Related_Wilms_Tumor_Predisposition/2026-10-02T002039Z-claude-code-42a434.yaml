  summary: Retarget renal surveillance link to the tumor phenotype
  details: |
    The Renal Tumor Surveillance treatment's target_mechanisms link pointed at the Epithelial-Type Wilms Tumor Initiation mechanism node. Surveillance detects tumors early and does not prevent initiation, so the link now targets the Epithelial-Predominant Wilms Tumor phenotype. This was raised in review of the PR that created the entry (monarch-initiative/dismech#13272).

  summary: 'Create: TRIM28-Related_Wilms_Tumor_Predisposition (Wilms tumor 7)'
  details: |
    New entry for Wilms tumor 7 (MONDO:0979876), the germline TRIM28 loss-of-function Wilms tumor predisposition, curated separately from Wilms_Tumor under design decision 3a. Five-node two-hit chain conforming to germline_two_hit_tumor_predisposition (germline first hit, 19q copy-neutral LOH second hit, biallelic loss in nephrogenic precursors, late nephrogenic arrest, epithelial-type tumor initiation), three phenotypes (epithelial-predominant Wilms tumor, bilateral Wilms tumor, perilobar nephrogenic rests), autosomal dominant inheritance with incomplete penetrance and the maternal transmission bias including the first paternal case, surveillance, counselling and immunohistochemistry-led diagnosis. Evidence drawn from PMIDs 33565090, 30885698, 30694527, 29912901, 37792584, 38282073, 32699065, 42522414; every snippet verified against references_cache. No deep-research provider run; sources found by PubMed search and read directly. Replaces stubs/Wilms_Tumor_7.yaml.

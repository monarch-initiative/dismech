  summary: 'Edit: wire Cystinosis to defective_skeletal_mineralization'
  details: >-
    Added one conforms_to declaration; no content changed. The 'Electrolyte
    wasting, rickets, and growth failure' node conforms to
    defective_skeletal_mineralization#Phosphopenic Substrate Deficiency,
    alongside the Tyrosinemia Type I and Fanconi-Bickel wirings in the same pass,
    since all three are renal Fanconi phosphate-wasting nodes. This entry was
    first wired to the module's central effector (#Impaired Hydroxyapatite
    Deposition at the Mineralization Front) on the reasoning that the node's own
    description says the Fanconi losses drive 'hypophosphatemic/calcipenic
    rickets', i.e. a mixed deficit for which no single trigger arm is right. PR
    review corrected that and the correction was verified before accepting: the
    node is a renal one (UBERON:0004134 proximal tubule; GO:0006811, GO:0006817,
    GO:0015701, GO:0015804, all transport terms) whereas the module's central
    effector is a bone-tissue node (TISSUE scale, UBERON:0001474 bone element,
    osteoblast and osteocyte, GO:0030282 bone mineralization), so conformance
    there asserted the wrong substrate - the node is upstream of hydroxyapatite
    deposition, not identical to it. Every other conformer at that node is a bone
    node. The mixed-etiology argument also failed on inspection: the module's
    calciopenic arm is intestinal (enterocyte, GO:0070561, GO:0070509), so
    cystinosis's renal calcium wasting was never a candidate for it and there was
    no tie to break, while the phosphopenic node's description covers this case
    explicitly ('in tubular disorders the loss is a direct transport defect').
    Part of item 2 of #8995.

  summary: 'Genetics pass: bind CTNS to all three subtypes and record the residual-function
    genotype-phenotype basis'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12194, epic #12189). The
    genetics was re-derived from the GeneReviews chapter (PMID:20301574), the
    ClinGen Tubulopathy panel's Definitive CTNS assertion, Orphanet and the primary
    CTNS mutation literature before the issue's MONDO reconciliation checklist was
    opened. MONDO records CTNS for both nephropathic cystinosis (MONDO:0100151) and
    ocular cystinosis (MONDO:0009064); CTNS was already curated and already wired to
    the cystinosin-transport node, so the reconciliation was complete on the gene
    axis. The pass added the split-side detail: CTNS is bound as the gene of all
    three has_subtypes rows, and a variant record states that the infantile,
    juvenile and ocular forms are separated by residual cystinosin function rather
    than by different genes (PMID:10556299). A notes paragraph records the
    reconciliation and that no second cystinosis gene was found. Validated with just
    validate, validate-terms, count-verified-snippets (185/185),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches, and
    validate-disorders.

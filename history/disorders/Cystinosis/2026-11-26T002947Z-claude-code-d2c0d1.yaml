  summary: 'Gene-family review: CTNS; bind the proton-coupled symport and repair truncated
    snippets'
  details: |
    Reviewed CTNS modelling. The CTNS node bound L-cystine transmembrane transporter activity (GO:0015184) plus the generic parent transmembrane transporter activity (GO:0022857), which added nothing. The parent is replaced by solute:proton symporter activity (GO:0015295), marked decreased: cystinosin is a proton-driven exporter, since cells expressing plasma-membrane-redirected cystinosin take up L-cystine only at acidic pH and lose the activity when the pH gradient is collapsed (PMID:11689434). GO has no cystine:proton symporter term, so the two terms together carry the claim. Four evidence quotes stopped before the words carrying their claim ('characterized by defective', 'responsible for cystine export from lysosomes', and two copies of 'caused by mutations in the CTNS gene that encodes'); each now quotes the full sentence, and the introductory sentence of PMID:11689434 is graded HUMAN_CLINICAL with quote_role BACKGROUND because it restates the human disease rather than the paper's in vitro result.

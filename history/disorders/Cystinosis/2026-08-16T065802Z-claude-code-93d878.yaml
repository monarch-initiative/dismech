  summary: Add ICIMD and Harrison's classifications plus L-cystine CHEBI binding
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + KIDNEY_URINARY_TRACT + GENETICS_ENVIRONMENT_DISEASE, and icimd_category 'amino_acid_transport' (ICIMD group 'Disorders of amino acid transport' under category 'Disorders of amino acid metabolism'; Ferreira et al. 2021, PMID:33340416). The notes record the mechanism-first reasoning: cystinosin is a transporter, not a hydrolase, and the defect is failure to export intact cystine from the lysosome with lysosomal catabolism itself intact, so ICIMD places it with the transport defects rather than under complex molecule degradation - even though cystinosis is conventionally counted among the lysosomal storage diseases, which this entry's own parents list already records. Both framings are therefore preserved rather than one silently overriding the other. Also bound the previously unbound Elevated leukocyte cystine biomarker to CHEBI:16283 (L-cystine), verified with OAK against sqlite:obo:chebi; the L- stereoisomer was chosen over the parent CHEBI:17376 cystine because it is the stored species. Validated with 'just validate' - schema, term and reference validation all passed, 180/182 snippets verified (2 skipped by prefix).

  summary: Bind the Francisella antibody titer test as a LOINC measurement
  details: |
    Added measurements: LOINC:16875-7 (Francisella tularensis Ab [Titer] in Serum) to the Francisella Microagglutination Serology row, whose evidence quotes a specific MAT titer threshold (>=1/160). The bound code is titer-based and method-unspecified, matching the measurement type reported (a titer) without asserting the microagglutination method itself, per the identity-not-method rule; the only LOINC codes naming microagglutination explicitly are method-qualified ('by Microagglutination') and were not used. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch10 (LOINC_DIAGNOSTICS.md tranche B). This is a separate kb/disorders entry (a promoted Tularemia subtype with curated_in) from Tularemia.yaml, already covered in batch 7 (#13974) with a different LOINC code (the IgG/IgM panel) on a different row; no conflict.

  summary: 'Classify: IUIS 2022 Table 3 (predominantly antibody deficiency)'
  details: |
    Added iuis_category 'predominantly antibody deficiency' to the existing classifications block (which carried only harrisons_chapter). The IUIS 2022 update (PMID:35748970) lists 'SH3KBP1 (CIN85) deficiency SH3KBP1 XL 300310' in Table 3 section 2 (CVID phenotype, cache line 2095). Notes record that despite the legacy AGMX2/XLA2 synonyms IUIS places the entity in section 2 (normal or low B cells) rather than section 1 (agammaglobulinemia), consistent with the entry's description arguing the defect is B-cell-effector-intrinsic rather than a production block. Evidence quotes the exact table row. Validated: just validate, count-verified-snippets, validate-terms, check-duplicate-keys.

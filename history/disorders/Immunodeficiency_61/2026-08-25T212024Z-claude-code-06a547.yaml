  summary: 'Create: Immunodeficiency 61 (SH3KBP1/CIN85, MONDO:0010296)'
  details: |
    Created kb/disorders/Immunodeficiency_61.yaml for MONDO:0010296 (OMIM #300310).

    Entry-type decision: DISEASE. MONDO:0010296 is a leaf under MONDO:0015977 agammaglobulinemia
    with no descendants.

    GENE ANCHOR FROM OMIM/MEDGEN, NOT MONDO - the second such case in this tranche.
    MONDO:0010296 records no causal-gene relationship, so the stub had no `genes:` block.
    Following its xrefs, MedGen (MEDGEN:337462, from OMIM #300310) associates the concept with
    SH3KBP1 (gene_id 30011) at Xp22.12, encoding CIN85. That is the anchor used here, and the
    missing MONDO relationship is recorded in the entry's notes as worth reporting upstream.

    NEC preflight: SKIP (MONDO records no causal gene). Manual fallback check, with the XLA/BTK
    hazard specifically in mind because this entity's legacy synonyms are AGMX2, XLA2 and
    "agammaglobulinemia, X-linked, type 2" - names that could easily pull a report toward
    BTK-related X-linked agammaglobulinemia instead:
    - Gene: SH3KBP1=32 mentions (CIN85=38 additionally, which the symbol matcher does not
      count). BCR=23 is the B cell RECEPTOR, a false positive of the symbol matcher against the
      BCR gene. BTK appears only 3 times, and inspection of every occurrence shows it is cited
      purely as the contrast diagnosis ("distinguishing it from classic BTK-related X-linked
      agammaglobulinemia", "Differential diagnoses include BTK-related X-linked
      agammaglobulinemia", "favor SH3KBP1 deficiency over BTK-related XLA"). No wrong-entity
      drift.
    - OMIM: the report asserts none, so nothing contradicts the MONDO xref 300310.
    Verdict: manual preflight PASSES. The report scored only 1 of 5 references on topic and
    cites by internal key rather than PMID, so NOTHING WAS CURATED FROM IT; it served purely as
    a cross-check, and usefully corroborated the nosology point below.

    FULL-TEXT MINING. The founding report PMID:29636373 caches abstract-only, which constrained
    the clinical layer. Two other sources cache as full text and were mined: PMID:21822214
    (SLP65/CIN85 transducer module) and PMID:42375371, a 2026 case report whose discussion
    section summarises the founding kindred's phenotype and is the only quotable source for the
    case count, the loss-of-function characterisation, and the neurodevelopmental features.

    Pathograph (6 nodes, single connected component, all reachable from the trigger, MOLECULAR
    at the root): SH3KBP1 (CIN85) loss-of-function deletion (MOLECULAR, trigger) -> loss of the
    preformed SLP65-CIN85 transducer module (MOLECULAR, central_effector) -> impaired B cell
    receptor effector signalling (CELLULAR, amplifier) -> defective antibody production by
    intrinsically impaired B cells (CELLULAR, effector) -> phenotypes; plus a parallel
    neurodevelopmental involvement node (ORGANISM, consequence).

    The mechanistic centre of gravity is the readiness module: CIN85 trimerises through a
    C-terminal coiled coil, its nine SH3 domains oligomerise SLP65, and the complex sits in
    resting B cells in granules formed by phase separation with lipid vesicles. The
    generalisable claim the disease makes - quoted from the source rather than paraphrased - is
    that signalling can fail not because a component is missing from the pathway but because
    too few copies are pre-concentrated in the right place.

    Curated: 6 pathophysiology nodes, 4 phenotypes, 1 inheritance block, 1 genetic block with
    two annotated variants, 1 prevalence record, 3 treatments, 2 discussions, 42 evidence
    snippets over 7 references.

    Honesty caveats recorded in the entry:
    - THE EVIDENCE BASE IS AMONG THE THINNEST IN THE KB and the entry says so up front: two
      affected brothers reported, one later patient carrying a PARTIAL deletion classified as a
      variant of uncertain significance whose authors state that causality remains unproven, and
      no ClinGen gene-disease validity assertion for SH3KBP1 in the cached ClinGen snapshot.
      `relationship_type` is nonetheless CAUSATIVE rather than DISPUTED, and the genetic block
      explains why: the founding report demonstrated the mechanism functionally in patient cells
      and no publication disputes the relationship - the limitation is quantity of evidence, not
      conflict within it. That is a deliberate contrast with the LAMA4 entry curated in the same
      tranche, where a ClinGen Limited classification did justify DISPUTED.
    - A KNOWLEDGE_GAP records a genuine sign disagreement in the literature: human CIN85 absence
      IMPAIRS BCR effector responses, while CIN85 knockdown in B cell lines and primary B cells
      ENHANCES BCR-induced survival and growth via Cbl-mediated Syk degradation. The knockdown
      result is curated with `supports: REFUTE` against a naive "CIN85 is required for BCR
      signalling" reading. No entry in this family should assert a single unified CIN85 function
      until this is resolved.
    - A second KNOWLEDGE_GAP records that the entity is misclassified: it carries the legacy
      names AGMX2/XLA2/"agammaglobulinemia, X-linked, type 2" and MONDO places it under
      agammaglobulinemia, but the founding report found all immune cell compartments normal with
      an intrinsic B cell effector defect. This is flagged as a curation-facing question rather
      than acted on, because reclassifying a MONDO concept is not a disorder entry's job.
    - The neurodevelopmental node is typed INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence
      throughout, and its description states the two reasons it is curated rather than dismissed
      (CIN85 was conditionally ablated in brain in mice; it recurs across all reported
      individuals) alongside the two reasons to doubt it (ascertainment bias; the later
      deletion spans neighbouring genes so a contiguous-gene effect cannot be excluded).
    - All three treatments are explicitly class-level for inborn errors of immunity, not
      disease-specific: with two reported patients no disease-specific evidence could exist, and
      each treatment says so.
    - `frequency:` omitted from every phenotype.

    Features NOT curated, and why - documented in the entry's notes. MedGen/HPO annotate this
    concept with obesity, recurrent sinusitis, recurrent otitis media, decreased circulating IgM,
    and decreased circulating IgG2 and IgG4. Those derive from the OMIM clinical synopsis of the
    founding report, whose PubMed record caches abstract-only and contains none of those
    statements, and no ORPHA record for Orphanet:696945 could be built because
    `just refresh-orphadata` fails on a manifest checksum mismatch with the bulk XML absent.
    Rather than cite an abstract for facts it does not contain, they are named as leads. The IgG
    subclass pattern is flagged as the highest-value one to promote: selective IgG2/IgG4
    deficiency with normal B cell numbers is a far more specific description than "antibody
    deficiency" and would strengthen the nosology argument.

    Quoting mechanics: several snippets stop short of a Greek character ("NF-" for NF-kappaB,
    "PLC" for PLCgamma2) because the cached records render those symbols in a form that is not a
    stable matching substring. Documented in the entry's notes.


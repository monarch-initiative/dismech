  summary: 'Review round 2: retract a false quoting rule, restore four truncated snippets,
    add two full-text-evidenced phenotypes'
  details: |
    Round-2 response to the review of PR #9498. Both blocking findings and all three
    suggestions.

    BLOCKING 1 - THE GREEK-CHARACTER QUOTING RULE WAS FALSE, AND I INVENTED IT FROM A TYPO.
    The entry claimed in `notes:` that cached references render kappa and gamma "in a form that
    is not a stable matching substring", and used that to justify four truncated snippets. It is
    not true. What actually happened: my first draft typed "NF-kB" with an ASCII k where the
    source has "NF-kappa-B" with a Greek kappa; the snippet failed to match; and instead of
    noticing the character mismatch I generalised one transcription error into a rule about the
    cache, wrote the rule into the entry as though it were a fact about the tooling, and
    repeated it in the PR body. The reviewer disproved it in one line: the same cached files
    render the characters plainly, and at least five existing KB entries quote them inside
    `snippet:` and validate.

    The damage was not cosmetic. The snippet on the SLP65-CIN85 module edge stopped immediately
    before "responses were abrogated" - the predicate that IS the finding - so the quote no
    longer stated the result its own explanation claimed it measured. Another began mid-word
    ("B activation..."). All four quotes are now restored in full with the correct characters,
    and the `notes:` paragraph asserting the rule is deleted. Snippet count 42 -> 51, all
    verified.

    The general lesson, recorded because it generalises past this entry: when a verbatim quote
    fails to match, the first hypothesis should be that I transcribed a character wrong, not
    that the cache is defective. Writing an unverified claim about tooling into a KB entry is
    worse than the original failed snippet, because the entry then teaches the error to whoever
    reads it next.

    BLOCKING 2 - TWO PHENOTYPES WERE OMITTED FOR A REASON THAT DID NOT HOLD. The "Features NOT
    curated" note blamed the founding report being abstract-only. True for PMID:29636373, but
    PMID:42375371 is cached as FULL TEXT in this very PR and documents both findings for the
    SH3KBP1 patient. Added:
    - Decreased circulating total IgM (HP:0002850), with two quotes - below 20 mg/dL at
      presentation, and persistently 5-6 mg/dL across four years of follow-up - plus a
      downstream edge from the antibody-production node.
    - Decreased total B cell count (HP:0010976), quoting the two timepoints (87 cells/uL, 3.2%;
      84 cells/uL, 3.5%) and the fact that other lymphocyte subsets were normal.
    Both are marked PARTIAL because that patient's variant is of uncertain significance.

    The B lymphocytopenia additionally CONTRADICTS the founding report's "all immune cell
    compartments developed normally", so it carries a REFUTE-typed counter-item quoting that
    sentence. The conflict is left visible rather than resolved by preferring one source, and
    the phenotype description points at the standardised-immunophenotyping experiment already
    proposed in the nosology discussion as the thing that would settle it.

    This is the second time in this tranche that a full-text cache was under-read. Noted.

    THE TRAP THE REVIEWER WARNED ABOUT, AND A SECOND INSTANCE OF IT. PMID:42375371 reports two
    unrelated patients; its elevated IgE, selective IgG2 deficiency and poor vaccine response
    belong to Case 1, who has an MECP2 duplication and no SH3KBP1 variant. Every quote taken
    from that reference in this entry is from the Case 2 paragraph, and each was checked for
    uniqueness against the whole cached file before use. That check caught a second instance the
    review did not mention: the sentence "The variant has been deposited in the NCBI ClinVar
    database under accession number ..." appears TWICE in identical wording, with SCV005849919
    for Case 1's MECP2 variant and SCV005849918 for the SH3KBP1 deletion. A naive first-match
    extraction returned Case 1's accession. The snippet is therefore quoted WITH the accession
    number so it is unambiguous, and both traps are now written into the entry's `notes:` as a
    warning to whoever promotes the remaining leads.

    SUGGESTION 1 (variant_origin) - taken, with a schema correction. `variant_origin` is a slot
    on GeneticContext, not on Variant, so it cannot go on `variants[1]` as suggested. The de novo
    fact is recorded on that variant's description with its own evidence item quoting
    "Importantly, the deletion occurred de novo, as confirmed by its absence in the patient's
    mother". The `genetic_context.notes` was the actually-defective text and is rewritten: it now
    says `variant_origin` is unset ON THAT BLOCK because the block describes the founding
    kindred, states that the later case is affirmatively de novo, and explains that the
    mosaicism remark comes from the authors' limitations paragraph and qualifies how exhaustively
    segregation was assessed rather than whether the mother carried the variant. The reviewer was
    right that the note gave only one side.

    SUGGESTION 2 (machine-identifiable variant) - taken. `identifiers: [ClinVar:SCV005849918]`
    on the later variant, matching the pattern used in Cardiofacioneurodevelopmental_Syndrome,
    plus the deletion size and predicted exon range in the description with a supporting quote.
    The genomic coordinate string is deliberately NOT quoted: it contains "[GRCh37]", which is
    neither an all-caps abbreviation nor a percent-bearing span, so the bracket normalizer
    would strip it and the quote could never match.

    SUGGESTION 3 (contiguous-gene caveat) - taken, and it was the right catch: the caveat was
    load-bearing for the Neurodevelopmental Involvement node and was asserted with no citation.
    Now evidenced by the source's own gene list for the deleted interval.


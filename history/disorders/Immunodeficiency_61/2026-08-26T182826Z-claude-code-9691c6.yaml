- type: EDIT
  outcome: changed
  summary: Correct fabricated reference_title; narrow agammaglobulinemia claim
  details: |
    Two CRITICAL review findings.

    1. The two obesity evidence items added in the previous commit carried a
    reference_title that does not exist. It was written from inference rather than
    read from the cache, and it disagreed with the 29 other items in this file citing
    the same PMID. Corrected both to the cached title, then audited every
    reference_title in the file against its cache frontmatter: 7 distinct references,
    0 mismatches. Note reference_title is not machine-checked, so validate-disorders
    passed with the wrong value in place.

    2. The entry asserted categorically that these patients do not have
    agammaglobulinemia. That conflates two different claims: normal B CELL
    DEVELOPMENT (which is supported and is what distinguishes this entity from
    BTK-related XLA) versus absent IMMUNOGLOBULIN (which is not, since the more
    severely affected founding brother had undetectable total IgG and IgA). Narrowed
    the claim at all three sites - top-level description, the Defective Antibody
    Production node, and the nosology discussion rationale - to argue from mechanism
    rather than from a categorical negative. The discussion is retained; the question
    it raises is still real, and it matters more than usual because it proposes an
    upstream MONDO change.

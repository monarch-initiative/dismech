  summary: 'Create: Brain Small Vessel Disease 3 (COLGALT1)'
  details: |
    New Mendelian Disease entry for MONDO:0100105 (BSVD3, COLGALT1), curated from stub stubs/Brain_Small_Vessel_Disease_3.yaml (claim issue #18799). Lump/split: a single-gene autosomal recessive disease with one conserved pathograph (COLGALT1 loss of function, impaired collagen IV production and secretion, basement-membrane fragility of cerebral small vessels, hemorrhage and its sequelae), so entry_type DISEASE. Named after the BSVD2 (COL4A2) and BSVD4 (NIT1) sibling convention; no established gene-related name was found in MONDO synonyms, GeneReviews, or the ClinGen record. Deep research was requested from falcon; no Edison key was configured, so the run fell back to claude_code (research/Brain_Small_Vessel_Disease_3-deep-research-claude_code.md, 17/17 references resolved). A second fallback run was marked answer_status unsuccessful and was deleted. Evidence comes from the four published clinical reports (PMID:30412317, 33709034, 39785835, 41911597), enzyme biochemistry (PMID:19075007, 20470363), the Colgalt1 fosse mouse (PMID:31101663), and the ClinGen Moderate AR assertion. The adult homozygous p.Gly377Arg case is flagged as a variant of uncertain significance. A knowledge gap records that human knockdown cells and mouse fibroblasts disagree on the direction of the collagen IV secretion change. No module conformance target exists for collagen post-translational modification. Validated with just validate, validate-terms, count-verified-snippets (all verified), check-causal-targets, check-entity-refs and validate-disorders.

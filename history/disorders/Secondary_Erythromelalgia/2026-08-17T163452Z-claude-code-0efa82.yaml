  summary: 'Create: Secondary Erythromelalgia (MONDO:0035149)'
  details: |
    Created kb/disorders/Secondary_Erythromelalgia.yaml for GitHub issue #8545 (MONDO:0035149, Orphanet:529864).

    MECHANISM MODELED. The mechanistically distinct SECONDARY route, not the nociceptor-hyperexcitability
    mechanism of the primary form: clonal thrombocythemia in a myeloproliferative neoplasm -> thromboxane/
    COX-1-dependent platelet activation and aggregation -> arteriolar inflammation with fibromuscular intimal
    proliferation -> acral arteriolar microvascular occlusion -> episodic acral burning pain, erythema and
    warmth, with a branch to acrocyanosis and digital ischemic necrosis. A separate, deliberately
    low-resolution node (mechanism_confidence PROVISIONAL) covers the non-MPN acquired routes (neuropathic,
    autoimmune, drug-induced). Aspirin and indomethacin carry INHIBITS target_mechanisms edges onto the
    platelet-activation node; cytoreduction carries an INHIBITS edge onto the upstream thrombocythemia node.
    The aspirin-responsiveness contrast (dramatic in MPN-associated disease, characteristically poor in
    primary/SCN9A disease) is curated with its own evidence in treatments, diagnosis and
    differential_diagnoses.

    DEEP RESEARCH AND NEC. Provider: falcon (research/Secondary_Erythromelalgia-deep-research-falcon.md).
    Elevated Named Entity Confusion risk was expected because the bare word "erythromelalgia" usually
    returns SCN9A/primary material. "just preflight-dr <report> MONDO:0035149" returned SKIP - MONDO records
    no causal gene (RO:0004003) for this term, so the automated gene-identity check cannot discriminate -
    and it reported SCN9A as the top gene mention (11). A manual NEC review was therefore performed as the
    skill requires, and the report PASSED: every SCN9A mention is contrastive (e.g. "SCN9A and Nav1.7 are
    central to inherited primary erythromelalgia, not to secondary erythromelalgia"), and the report is
    substantively about the acquired form throughout. The report was nonetheless used only as leads - it
    cites 3 resolvable DOIs and no PMIDs (its own reference_validation block reports 3/3 resolved,
    confabulation_rate 0.0) - so NO evidence item in this entry is sourced from it.

    EVIDENCE. All evidence was independently sourced via the PubMed E-utilities API and verified against
    locally fetched abstracts: PMID:3977194 (Michiels 1985 Ann Intern Med, the seminal platelet-mediated
    arteriolar inflammation and thrombosis paper), PMID:8951772 (50-case consecutive thrombocythemia series),
    PMID:8883266 (platelet activation and endothelial damage but NOT thrombin generation), PMID:7792731
    (shortened platelet survival reversed by aspirin), PMID:12781799 (Michiels 2003 aspirin-responsive
    arterial thrombophilia), PMID:9263352, PMID:8203771 (three-entity classification), PMID:32491719
    (StatPearls classification), PMID:18713229 (Olmsted County population-based incidence), PMID:16673274
    (platelet COX-1 as drug target), PMID:29641704, PMID:30609105.

    CURATION DECISIONS RECORDED RATHER THAN LEFT SILENT.
    1. No conforms_to on the thrombogenesis module, with the reason in the entry notes: the acral thrombi are
       VWF-rich with only weak fibrin staining and form without thrombin generation (PMID:8883266), and the
       module explicitly scopes out VWF-platelet microangiopathy absent an evidenced thrombin/fibrin branch.
       The disease looks superficially like a conformer, so the non-conformance is documented.
    2. A KNOWLEDGE_GAP discussion (secondary_em_nomenclature_scope) records the conflict between the
       historical three-way Drenth-Michiels classification, in which MPN-associated disease is NOT
       "secondary", and the modern MONDO/Orphanet two-way split that this entry follows.
    3. datasets is deliberately empty: "just discover-datasets" returned no GEO candidates, and relaxing to
       the underlying MPNs would import datasets belonging to Polycythemia_Vera / Essential_Thrombocythemia -
       Named Entity Confusion reached through dataset search.

    CROSS-REFERENCES ADDED. kb/disorders/erythromelalgia.yaml: bound both has_subtypes stubs to MONDO terms
    (subtype_term MONDO:0007571 and MONDO:0035149) and pointed each at its standalone entry.
    kb/disorders/Primary_Erythermalgia.yaml: added a Secondary Erythromelalgia differential_diagnoses block
    so the sibling link is bidirectional.

    PRE-PR SELF-REVIEW AND RESULTING CHANGES. An adversarial review pass was run against the draft before
    opening the PR, and it found real problems that were fixed:
    (1) The Erythromelalgia phenotype had frequency VERY_FREQUENT justified by 26/40 (65%) and 31/50 (62%) -
    arithmetic that lands in FREQUENT, and against the wrong denominator (patients with thrombocythemia, not
    patients with this disease). Changed to OBLIGATE, since the phenotype IS the disease, with the referral
    bias and the conflict with the OCCASIONAL band already curated on the MPN entries stated explicitly; both
    cohort items downgraded to PARTIAL.
    (2) The Acrocyanosis FREQUENT band was justified by "14 of 50" (28% = OCCASIONAL) and rested on a
    composite endpoint double-counted with the Digital ischemic necrosis phenotype. Restated against the
    correct 31-patient erythromelalgia denominator (14/31 = 45%), with the composite endpoint, the untreated
    conditioning, the missing untreated denominator, and the referral series all named; item downgraded to
    PARTIAL and the 31-patient denominator separately evidenced.
    (3) The claim that MONDO/Orphanet intend the broad sense of "secondary" was unverified and is
    load-bearing for the entry's scope. MONDO:0035149's only synonym is "Secondary erythermalgia" EXACT
    [Orphanet:529864] - i.e. the historical NARROW term. The Orphadata bulk XML is gitignored and not present
    locally, so ORPHA:529864 could not be quoted; the discussion rationale was rewritten to state the gap
    precisely and name the command that would resolve it, rather than assert an ontology's intent.
    (4) The top-level description called the MPN form "historically defining", contradicting the discussion's
    own point that MPN disease is NOT "secondary" under the historical scheme. Changed to "best-evidenced".
    (5) The blanket negative "no specific effective therapy exists" was contradicted by a 2025 systematic
    review (PMID:40428878) surfaced by this PR's own falcon artifact. Fetched it and added a new
    "Symptomatic pharmacotherapy for aspirin-unresponsive disease" treatment (amitriptyline-ketamine,
    lidocaine, iloprost, misoprostol), all items PARTIAL because that review pools primary, idiopathic and
    secondary EM without stratifying by aetiology; the old negative was softened and scoped to
    cause-directed therapy.
    (6) No environmental/trigger content existed despite heat-provocation and cooling-relief being the most
    universally described feature of the syndrome. Added an environmental entry with an EXACERBATES
    influences_mechanisms edge onto the flare node.
    (7) Two modifier: INCREASED assertions had no supporting measurement (GO:0004666 COX activity,
    GO:0042311 vasodilation). The COX modifier was dropped; the vasodilation term was removed entirely,
    since it also sits against this entry's occlusive model. Both omissions are explained in place.
    (8) The Non-Platelet Acquired Routes node named three etiologies that no snippet supported; now
    evidenced from PMID:40428878 and PMID:18713229.
    (9) In the sibling Primary_Erythermalgia differential block, an explanation attached to PMID:3977194
    asserted "has no counterpart in the neuronal channelopathy of primary erythermalgia" - a negative that
    paper never addresses (the #7791 pattern). Trimmed to what the paper shows, with the comparative claim
    reassigned to PMID:8203771; "later onset" and "unilateral" now evidenced from PMID:40428878.
    Also: PMID:9263352 reclassified HUMAN_CLINICAL -> OTHER (narrative minireview); an ICD10CM:I73.8
    mappings block added with skos:broadMatch and an explicit warning that the residual code cannot serve as
    a case definition; a clinical_trials rationale added to notes (all EM trials exclude secondary disease);
    and three uncitable content_type:unavailable DOI cache stubs removed rather than committed.


  summary: 'Fix swapped NCT ids in notes; add AV-shunting knowledge gap, CLS treatment,
    etiology evidence (PR #8772 review)'
  details: |
    Addresses the automated review on PR #8772 (verdict CHANGES_REQUESTED, one blocking item).

    BLOCKING FIX - swapped NCT identifiers in notes:. The clinical_trials: [] rationale attributed two
    trials backwards: it named NCT04039633 as the ATX01 topical amitriptyline study and NCT05917912 as the
    burst spinal-cord-stimulation study. These are inverted. The note is load-bearing - it is the recorded
    reason clinical_trials is empty - so a future curator revisiting that decision would have followed the
    wrong identifiers, and identifiers inside free-text notes: are not reference-validated, which is exactly
    why a clean validate-disorders run did not catch it.

    I did not take the reviewer's mapping on trust. I verified both identifiers directly against the
    ClinicalTrials.gov API (v2 /studies endpoint), independently of the deep-research artifact:
      NCT05917912 -> "EASE (Efficacy of ATX01 Study in Erythromelalgia)", sponsor AlgoTherapeutix,
                     enrollment 14, interventions Amitriptyline Hydrochloride + Placebo
      NCT04039633 -> "Spinal Cord Stimulation for Refractory Pain in Erythromelalgia", sponsor
                     St. Olavs Hospital, enrollment 6, interventions Burst Spinal Cord Stimulation + Sham
    This confirms the review and matches the falcon artifact's own statements at lines 1156, 1157 and 1218.
    The corrected note now carries sponsor and enrollment for both lead trials so the attribution is
    self-checking, and records that the identifiers were verified against the API rather than only against
    the DR report.

    OPTIONAL ITEMS TAKEN (all three are evidence-backed; none manufactured).

    1. AV-shunting / tissue-hypoxia KNOWLEDGE_GAP added (discussion_id av_shunting_vs_occlusion_paradox),
       attached to the flare node and the occlusion node. The reviewer expected this could only be recorded
       as an unevidenced note because the mechanism's only source in the DR report is a textbook chapter
       with no PMID. That turned out not to be the constraint: PMID:15075045 was ALREADY in
       references_cache/ (it is cited by the umbrella erythromelalgia entry) and states the hypothesis
       directly - "all having a single common pathogenetic mechanism - microvascular arteriovenous
       shunting". So the gap is curated with real evidence. It is deliberately PARTIAL: that 2004 review
       asserts shunting as the SINGLE common mechanism for ALL erythromelalgia, which the SCN9A/Nav1.7
       findings contradict, and the umbrella entry already flags the same quote PARTIAL for the same reason.
       The discussion states the paradox it reconciles (an occluded arteriole producing warm, red skin),
       explains why no vasodilation process is bound to the flare node, and names the experiment that would
       settle it (paired laser Doppler and transcutaneous oxygen tension in aetiologically stratified
       patients). The shunting model is recorded as an open hypothesis, NOT promoted to a pathophysiology
       node.

    2. Chemical lumbar sympathectomy added as a procedural treatment node, sibling to the
       symptomatic-pharmacotherapy node, from PMID:40428878 (already cited and cached). Both evidence items
       are PARTIAL under the same mixed-aetiology caveat already applied to the pharmacotherapy node: the
       review pooled 120 patients across primary, idiopathic and secondary EM (13 receiving CLS) without
       stratifying outcomes by aetiology. The second item deliberately carries the qualifying finding
       ("long-term outcomes after CLS remain underreported and variable") so the node reads as an option,
       not a recommendation. Term note: no verifiable NCIT sympathectomy term exists (NCIT:C51765 is
       Bilateral Salpingectomy with Oophorectomy - the pre-edit hook caught this attempt), and neither the
       local ncit adapter nor OLS returns one, so the generic verified NCIT:C49236 Therapeutic Procedure is
       used with preferred_term "chemical lumbar sympathectomy", per the CLAUDE.md pattern that
       preferred_term may be more specific than the bound term. The description records that the procedure
       is a percutaneous chemical neurolysis rather than open surgery and that SURGERY is merely the closest
       available therapeutic_modality bucket.

    3. Non-Platelet Acquired Routes node strengthened with a further evidence item from PMID:15075045,
       which names collagen-vascular disease, diabetes mellitus, peripheral neuropathy, autoimmune and
       infectious disease and drug exposure as the acquired associations - a genuinely quotable etiology
       list, which the node previously lacked for several of those conditions.

    OPTIONAL ITEMS DELIBERATELY NOT TAKEN.

    - Expanding differential_diagnoses from 2 to the ~12 conditions named in the DR report (CRPS, Raynaud,
      cellulitis, vasculitis, gout, Fabry, SLE, ...). Those trace only to the unquotable textbook chapter.
      Adding them would mean either citing a source I cannot quote or attaching real PMIDs to claims they do
      not make - the #7791 pattern this entry was reviewed clean for. The reviewer marked this genuinely
      optional and conditional on sourcing; it is not sourced, so it is not added.
    - Splitting the Progression to Acrocyanosis and Digital Ischemic Necrosis node. The reviewer explicitly
      advised against splitting without a source that separates the two outcomes; the cited series reports
      them as a composite endpoint and the entry already says so.
    - Adding has_subtypes. The reviewer agreed the current single PROVISIONAL node is the more honest
      modeling given no per-class phenotype, prevalence or mechanism data exists.

    VALIDATION ACTUALLY RUN AND READ, after these edits. The repository pre-edit hook ran just validate on
    every write and blocked one invalid draft (the wrong NCIT sympathectomy term). just validate-terms
    PASSED on the changed file. just count-verified-snippets initially reported 77/78 with one failure - the
    CLS snippet quoted an inline "[21]" citation marker, which is stripped before matching; re-quoted to
    avoid the bracket, after which it reports 129/129 verified across all three changed files.
    just check-title-snippets OK, just check-duplicate-keys OK, just check-term-cache-integrity OK. The
    batched just validate-disorders over all three changed files - the same check CI runs - passed with
    129/129 snippets verified. The only remaining compliance gap is datasets, which is intentionally empty
    with its reasoning recorded in notes.

    The CHANGES_REQUESTED review was left in place and NOT dismissed; a fresh review was dispatched via
    the claude-code-review workflow instead.

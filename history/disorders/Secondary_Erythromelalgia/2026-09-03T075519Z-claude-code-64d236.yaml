  details: |
    Augmentation pass over an existing merged entry (created in PR #8772). No de-novo creation.

    DEEP RESEARCH. Ran openscientist rather than the default falcon, deliberately: a falcon report from 2026-08-17 already existed at research/Secondary_Erythromelalgia-deep-research-falcon.md, and 'just research-disorder falcon' writes to that same path, so re-running it would have overwritten the report the current entry was curated from. openscientist writes to a distinct path, so both reports now coexist. The run produced no frontmatter validation summary, so both retrofits were run: 'just validate-research-reference' and 'just validate-research-terms'.

    Report reference validation: 26/26 references resolved, 0 unresolved, 0 off topic, 24/25 quotes matched. The single flagged quote (PMID:22247059) is a false positive - the report's 'closest text in source' is byte-identical to the quote. Nothing from that report was cited on an unresolved identifier.

    Report term validation: 5 mislabelled CURIEs were reported and NONE were bound. MONDO:0008574 is obsolete ('obsolete Tl antigen', offered as erythromelalgia); HP:0012326 is 'Abnormal celiac artery morphology', offered as Erythromelalgia; NCIT:C512 ('Free Radical') offered as Hydroxyurea; NCIT:C15325 ('Skin Transplantation') offered as Phlebotomy; NCIT:C79809 ('Defactinib') offered as Ruxolitinib. Every ontology term added in this session was resolved independently via OLS.

    RETIRED ENUM PROSE (dismech#10003). Removed all 13 occurrences of prose arguing for the retired 'PARTIAL' supports value. Each explanation was rewritten to preserve its substantive caveat rather than deleted, and five were converted into structured 'directness: INDIRECT' where the support genuinely runs through an inference step. Also repointed the discussion cross-reference that asserted the umbrella 'erythromelalgia' entry 'flags as PARTIAL'; that entry still carries one such stale line, left out of scope for this disease's PR and flagged in the PR body.

    NEW MECHANISM. Added pathophysiology node 'Complement-Mediated Microvascular Injury and Autonomic Denervation of Acral Skin' (mechanism_confidence PROVISIONAL) plus a mechanistic_hypotheses group 'immune_dysautonomic_route' (status EMERGING), from PMID:39846717. This gives the previously unresolved non-MPN acquired routes their first biopsy correlate (microvascular C5b-9, type-I interferon in endothelium, CD56 loss of autonomic innervation of eccrine coil and arteries) and a mechanistic reading of their aspirin resistance. Deliberately NOT promoted to an established mechanism: single retrospective n=9 single-centre series, cases selected by clinical concern rather than aetiology, not stratified MPN vs non-MPN, and the authors say 'suggests'. Both its causal edges carry hypothesis_groups tags. The same source was also added as INDIRECT evidence on the pre-existing av_shunting_vs_occlusion_paradox knowledge gap, whose prompt asks whether shunting operates in the MPN arm or only the non-platelet routes - autonomic denervation of acral arteries is a candidate substrate, and the gap was updated to say so while remaining OPEN.

    NEW SECTIONS. synonyms (MONDO exact synonym plus attested usage). progression: three phases - presenting flare (with the median 2.5-year lead time before myeloproliferative diagnosis, PMID:2643412, and the Olmsted case definition's 2-year window, PMID:18713229), untreated progression to acrocyanosis/necrosis/gangrene, and remission on COX inhibition or cytoreduction. clinical_burden VARIABLE, not HIGH, because the MPN arm is abolished by low-dose aspirin while the non-MPN arm is aspirin resistant and can reach tissue loss; both ends are cited. classifications: harrisons_chapter CARDIOVASCULAR (primary, matching the acral arteriolar lesion and the I73.8 cross-reference) plus ONCOLOGY_HEMATOLOGY (the MPN substrate), each with evidence.

    OTHER EVIDENCE ADDED. Modern unselected erythromelalgia frequency in polycythemia vera of 5.3% (PMID:39556352), which answers the denominator caveat the Erythromelalgia phenotype description already raised against the 62-65% referral-series fractions. Aspirin specificity - no response to coumadin, immediate relief on a 500 mg load (PMID:16510297) - and recurrence on aspirin withdrawal with remission on rechallenge (PMID:22844295), establishing the effect as suppressive rather than curative. Thrombotic thrombocytopenic purpura (PMID:1613144) and chronic myelogenous leukemia (PMID:2643412) recorded as single-case acquired associations, named rather than modeled. Serial blood-count monitoring recommendation (PMID:2643412).

    NOT CHANGED, DELIBERATELY. datasets: and clinical_trials: remain empty; the existing notes give sound reasons (no GEO candidates, no causal gene to key on, MPN datasets belong to the MPN entries; the interventional trials enrol primary/idiopathic disease and exclude secondary). No histopathology: section was added even though the biopsy findings are well evidenced - they are already carried by the Arteriolar Inflammation pathophysiology node and by diagnosis#Skin punch biopsy of an affected area, and a third structured restatement would be redundant.

    VALIDATION. 'just validate-disorders kb/disorders/Secondary_Erythromelalgia.yaml' (the batched gate CI runs) passed: schema clean, term validation passed, 105/105 snippets verified; a later prose edit brought it to 106/106 under 'just validate'. Offline gates all green: check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-source-defect-claims. The causal graph builds with 25 nodes, 16 edges and an empty orphan_targets set. Two self-inflicted errors were caught by the gates during the session and fixed: a duplicated 'downstream:' key, and a non-unique string match that corrupted an unrelated pathophysiology evidence block, which was restored from origin/main and re-verified.

  summary: 'Augment: new immune/dysautonomic mechanism, progression, burden, classifications;
    clear retired-PARTIAL prose'
  details: |
    Augmentation pass over an existing merged entry (created in PR #8772). No de-novo creation.

    DEEP RESEARCH. Ran openscientist rather than the default falcon, deliberately: a falcon report from 2026-08-17 already existed at research/Secondary_Erythromelalgia-deep-research-falcon.md, and 'just research-disorder falcon' writes to that same path, so re-running it would have overwritten the report the current entry was curated from. openscientist writes to a distinct path, so both reports now coexist. The run produced no frontmatter validation summary, so both retrofits were run: 'just validate-research-reference' and 'just validate-research-terms'.

    Report reference validation: 26/26 references resolved, 0 unresolved, 0 off topic, 24/25 quotes matched. The single flagged quote (PMID:22247059) is a false positive - the report's 'closest text in source' is byte-identical to the quote. Nothing from that report was cited on an unresolved identifier.

    Report term validation: 5 mislabelled CURIEs were reported and NONE were bound. MONDO:0008574 is obsolete ('obsolete Tl antigen', offered as erythromelalgia); HP:0012326 is 'Abnormal celiac artery morphology', offered as Erythromelalgia; NCIT:C512 ('Free Radical') offered as Hydroxyurea; NCIT:C15325 ('Skin Transplantation') offered as Phlebotomy; NCIT:C79809 ('Defactinib') offered as Ruxolitinib. Every ontology term added in this session was resolved independently via OLS.

    RETIRED ENUM PROSE (dismech#10003). Removed all 13 occurrences of prose arguing for the retired 'PARTIAL' supports value. Each explanation was rewritten to preserve its substantive caveat rather than deleted, and five were converted into structured 'directness: INDIRECT' where the support genuinely runs through an inference step. Also repointed the discussion cross-reference that asserted the umbrella 'erythromelalgia' entry 'flags as PARTIAL'; that entry still carries one such stale line, left out of scope for this disease's PR and flagged in the PR body.

    NEW MECHANISM. Added pathophysiology node 'Complement-Mediated Microvascular Injury and Autonomic Denervation of Acral Skin' (mechanism_confidence PROVISIONAL) plus a mechanistic_hypotheses group 'immune_dysautonomic_route' (status EMERGING), from PMID:39846717. This gives the previously unresolved non-MPN acquired routes their first biopsy correlate (microvascular C5b-9, type-I interferon in endothelium, CD56 loss of autonomic innervation of eccrine coil and arteries) and a mechanistic reading of their aspirin resistance. Deliberately NOT promoted to an established mechanism: single retrospective n=9 single-centre series, cases selected by clinical concern rather than aetiology, not stratified MPN vs non-MPN, and the authors say 'suggests'. Both its causal edges carry hypothesis_groups tags. The same source was also added as INDIRECT evidence on the pre-existing av_shunting_vs_occlusion_paradox knowledge gap, whose prompt asks whether shunting operates in the MPN arm or only the non-platelet routes - autonomic denervation of acral arteries is a candidate substrate, and the gap was updated to say so while remaining OPEN.

    NEW SECTIONS. synonyms (MONDO exact synonym plus attested usage). progression: three phases - presenting flare (with the median 2.5-year lead time before myeloproliferative diagnosis, PMID:2643412, and the Olmsted case definition's 2-year window, PMID:18713229), untreated progression to acrocyanosis/necrosis/gangrene, and remission on COX inhibition or cytoreduction. clinical_burden VARIABLE, not HIGH, because the MPN arm is abolished by low-dose aspirin while the non-MPN arm is aspirin resistant and can reach tissue loss; both ends are cited. classifications: harrisons_chapter CARDIOVASCULAR (primary, matching the acral arteriolar lesion and the I73.8 cross-reference) plus ONCOLOGY_HEMATOLOGY (the MPN substrate), each with evidence.

    OTHER EVIDENCE ADDED. Modern unselected erythromelalgia frequency in polycythemia vera of 5.3% (PMID:39556352), which answers the denominator caveat the Erythromelalgia phenotype description already raised against the 62-65% referral-series fractions. Aspirin specificity - no response to coumadin, immediate relief on a 500 mg load (PMID:16510297) - and recurrence on aspirin withdrawal with remission on rechallenge (PMID:22844295), establishing the effect as suppressive rather than curative. Thrombotic thrombocytopenic purpura (PMID:1613144) and chronic myelogenous leukemia (PMID:2643412) recorded as single-case acquired associations, named rather than modeled. Serial blood-count monitoring recommendation (PMID:2643412).

    NOT CHANGED, DELIBERATELY. datasets: and clinical_trials: remain empty; the existing notes give sound reasons (no GEO candidates, no causal gene to key on, MPN datasets belong to the MPN entries; the interventional trials enrol primary/idiopathic disease and exclude secondary). No histopathology: section was added even though the biopsy findings are well evidenced - they are already carried by the Arteriolar Inflammation pathophysiology node and by diagnosis#Skin punch biopsy of an affected area, and a third structured restatement would be redundant.

    RED-TEAM REVIEW ROUND. A pre-PR adversarial review was run in a fresh context against the
    dismech-pr-review skill before any PR was opened. It confirmed every snippet exact and every
    reference_title matching the cache, and raised 16 findings, all content/reviewer objections
    rather than CI failures. All were acted on. The substantive ones:

    - The causal edge from Non-Platelet Acquired Routes into the new immune node was graded
      causal_link_type DIRECT while its snippet establishes only that 3 of 9 patients carried an
      autoimmune diagnosis. The edge description also asserted three unsourced things (that the
      lesion belongs to the autoimmune/idiopathic arm, that it is instead of a platelet-rich
      thrombus, and that the acquired route causes it). Removed the DIRECT grade, added
      directness INDIRECT, and rewrote both description and explanation to claim only what the
      quote gives.
    - The hypothesis label read '...in Non-MPN Secondary Disease', putting a restriction into the
      rendered label that the source cannot support: PMID:39846717's series was assembled by
      clinical concern for erythromelalgia and is not stratified primary/secondary or MPN/non-MPN.
      Relabelled to drop the restriction and added a sentence saying the restriction is part of
      the hypothesis rather than an observation.
    - synonyms: had added 'Platelet-mediated erythromelalgia', which names the MPN arm alone, has
      no MONDO backing, and sits against this entry's own open secondary_em_nomenclature_scope
      discussion. Dropped. 'Secondary erythermalgia' is kept because MONDO carries it as an exact
      synonym, and the nomenclature discussion now says so explicitly so the two do not read as
      contradicting each other.
    - The PMID:39556352 5.3% item was attached to a phenotype whose only claim is
      frequency OBLIGATE, and its own explanation conceded it did not support that. Regraded
      NO_EVIDENCE per the CLAUDE.md table, kept as a cited counterweight to the referral series.
      Also corrected 2024 to 2025 for that review's year.
    - The PARTIAL rewrite had, in one place, flipped the direction of a claim: the Acrocyanosis
      band explanation went from 'this does not support the band' to 'the band is read off that
      figure'. Restored the hedge and added directness INDIRECT, noting that 14/31 is a curator
      computation joining two sentences of an abstract that states '14 cases' with no denominator.
    - The Drenth-Michiels sentence 'Secondary erythermalgia: Aspirin resistant...' was cited three
      times with inconsistent directness, and is a category DEFINITION rather than an empirical
      result, so citing it as support for aspirin resistance is definitionally circular. Set
      directness INDIRECT on all three and reworded to say the classification defines the category
      by the property.
    - The Olmsted case definition says 'within 2 years of the diagnosis of erythromelalgia', which
      is symmetric; the progression notes had over-read it as 'up to two years after'. Corrected,
      and the direction is now carried by PMID:2643412 and PMID:11208311 which do state it.
    - The clinical_burden low end said a treated patient carries 'close to no residual burden',
      contradicting content added in this same session (suppressive not curative; bleeding hazard
      at very high platelet counts). Softened.
    - CL:0000115 'endothelial cell' was bound where CL:0011030 is labelled exactly
      'dermal microvascular endothelial cell', matching the curator's own preferred_term. Rebound.
      The pre-existing CL:0000115 at the Arteriolar Inflammation node was left alone as out of
      scope for this change.
    - evidence_source corrections: the PMID:2643412 monitoring sentence is a recommendation, not an
      observation, so OTHER; PMID:16510297 is a narrative review whose coumadin-vs-aspirin
      comparison is a synthesis, so OTHER, matching how this entry already grades PMID:12781799.
      Added directness INDIRECT to the PMID:18713229 burden framing quote.
    - PMID:22844295 was described as the syndrome 'recurring' on withdrawal. The patient was taking
      aspirin for stroke prophylaxis and the erythromelalgia emerged de novo on stopping it, so
      this is unmasking, not relapse. Reworded, and the resulting general claim is now explicitly
      reconciled against PMID:8951772's description of a 'curative' aspirin effect.
    - age_range carried a two-clause folded block duplicating a caveat already in notes; shortened
      to a phrase and the median-61-years figure now carries its own evidence item, which it
      previously lacked.
    - The shunting-discussion addition said the finding 'points at the non-platelet routes' four
      lines above conceding the series was unstratified. Reworded to a conditional, and the
      reviewer's observation that superficial vascular ectasia is itself a more parsimonious
      reading of the warm hyperemic surface than shunting was added to the discussion.
    - Unused fetched references: PMID:22247059 (Swedish population cohort) now supports the
      diagnostic-delay claim on progression phase 1 and the VARIABLE burden call (no
      EM-attributable mortality). PMID:23334520 was added to the new node as a NO_EVIDENCE
      counterweight: it states the commonly reported secondary-EM histology and names neither
      complement nor denervation.
    - The 14/31 figure and its three caveats were recited in full in three sections; the caveats
      now live once, on the phenotype where the band lives.
    - Harrison's placement notes asserted what Harrison's covers without a source; reframed as
      curator placement rationale, and DERMATOLOGY is now explicitly considered and declined
      rather than silently omitted.

    Reviewer suggestions NOT taken: rebinding the pre-existing arteriolar endothelial cell term
    (out of scope for this change), and adding a DERMATOLOGY Harrison's Part (declined in the
    notes, with the reason recorded).

    'just preflight-dr <report> MONDO:0035149' was run at the reviewer's suggestion. It SKIPs:
    MONDO records no causal gene for MONDO:0035149, so the gene-identity check cannot
    discriminate. The report's top genes are JAK2/MPL/CALR (the MPN drivers) with SCN9A appearing
    only as the primary-form contrast, so there is no Named Entity Confusion signal.

    VALIDATION. 'just validate-disorders kb/disorders/Secondary_Erythromelalgia.yaml' (the batched gate CI runs) was re-run on the final post-review bytes and passed: schema clean, term validation passed, 110/110 snippets verified. Offline gates all green: check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-source-defect-claims. The causal graph builds with 25 nodes, 16 edges and an empty orphan_targets set. Final evidence census: 108 SUPPORT, 2 NO_EVIDENCE, 14 directness INDIRECT. Two self-inflicted errors were caught by the gates during the session and fixed: a duplicated 'downstream:' key, and a non-unique string match that corrupted an unrelated pathophysiology evidence block, which was restored from origin/main and re-verified.

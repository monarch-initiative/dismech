  summary: 'Create: Hereditary Spastic Paraplegia 49 (MONDO:0014016, TECPR2)'
  details: |
    De novo curation of TECPR2-related disease (MONDO:0014016) from the claim in issue #9620.

    Deep research: claude_code provider (falcon/Edison returned HTTP 402, key out of credit). Report validation clean - 14/14 references resolved, 0 unresolved, 0 off topic. Report leads were combined with direct PubMed E-utilities searches.

    GeneReviews baseline: PMID:36137062, tagged in top-level references. Its Agents/Circumstances to Avoid section is curated as a treatment entry (benzodiazepines, antihistamines and other respiratory depressants).

    The main curation judgement is the disease name. MONDO:0014016 is labelled "hereditary spastic paraplegia 49" after the original 2012 five-patient Bukharian founder description, but the accumulated evidence puts the burden elsewhere: PMID:26542466 proposed reclassification as a hereditary sensory-autonomic neuropathy, PMID:33847017's 28-individual analysis does not list spasticity among core manifestations, and GeneReviews now titles the chapter TECPR2-HSAN with ID. The entry keeps the MONDO binding and the stub's proposed filename (that is the concept claimed), but the description opens with the nomenclature problem, the Corticospinal Axonopathy node is curated as explicitly secondary, and a KNOWLEDGE_GAP discussion sets out what would settle it. A reviewer who prefers a renamed entry should say so - the change is cheap.

    Second judgement call, recorded as its own KNOWLEDGE_GAP discussion: the published autophagy readouts conflict in direction. PMID:23176824 found decreased LC3-II and decreased p62 in patient fibroblasts (a formation defect), while both in vivo models - the Spanish Water Dog (PMID:26555167) and the Tecpr2 knockout mouse (PMID:33218264) - report autophagosome accumulation and read it as a clearance defect. The mouse's REFUTE-graded evidence item in that discussion is deliberate. This is not presented as settled in either direction.

    Two animal models curated with modeled_mechanisms: the naturally occurring Spanish Water Dog TECPR2 p.R1337W neuroaxonal dystrophy, and the CRISPR Tecpr2 knockout mouse. The dog carries a FAILS_TO_RECAPITULATE link for Corticospinal Axonopathy, since the authors state directly that the canine lesions spare the motor pathways most human HSPs involve - and its limitations field notes this cuts both ways, agreeing with the human cohort data that the corticospinal component is weaker than the SPG49 name implies.

    Investigational ASO exon-skipping therapy curated from PMID:35860385 with structured aso_details (SPLICE_MODULATION_EXON_SKIPPING, TECPR2 exon 8, unconjugated). aso_chemistry was deliberately omitted: the source states 2'-O-methyl / phosphorothioate for the initial 25-mer screening set, not for the optimized lead ASO-005-02, so annotating it would overstate what the source says. The caveat is in the treatment description instead. The neuronal-localization rescue is graded PARTIAL because correct localization is a surrogate for function, not a functional assay.

    Validation: just validate-disorders passes (schema, terms, references), 64/64 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

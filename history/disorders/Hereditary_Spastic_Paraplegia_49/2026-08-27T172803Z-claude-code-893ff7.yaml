  summary: Correct the false band claim, resolve the node description/graph contradiction
  details: |
    Second correction round on PR #9655. Both remaining review findings were correct and both were mine.

    The carrier-frequency notes made a checkably false claim about this repo's own schema, and I should have checked it. The first round removed the prevalence_class from both carrier records, arguing that 81.9 per 100,000 fell in a gap between BAND_1_5_PER_10000 and ABOVE_1_IN_1000. There is no gap. PrevalenceClassEnum defines BAND_1_5_PER_10000 as 10-99 per 100,000, and the description says explicitly that it combines the Orphanet 1-5 and 6-9 classes into one decade-spanning band for exactly that reason; _band_from_rate() in scripts/migrate_prevalence.py buckets any rate at or above 10 into it. I reasoned from the Orphanet class name rather than reading the schema description underneath it, which is the same error in kind as reading a paper's title instead of its findings.

    Both records now carry the schema-correct band - BAND_1_5_PER_10000 for the general population, and ABOVE_1_IN_1000 restored on the Ashkenazi record where it was right all along. Setting them is also the right call for a different reason the reviewer raised: 34 of 37 CARRIER_FREQUENCY records across kb/disorders/ set a band, and one entry diverging on its own reasoning produces a second inconsistency rather than a fix.

    The substantive concern behind the removal survives and is now filed as issue #9723 rather than acted on unilaterally. Orphanet classes band disease occurrence, a carrier frequency is not disease occurrence, and ABOVE_1_IN_1000 on a 1-in-155 carrier rate reads to anything not also checking measure_type as a claim that the disease affects more than 1 in 1,000 people - for a disorder with about 30 reported patients. Whether that matters depends on whether any consumer reads the band without measure_type, which I have not checked. The notes on both records point at the issue.

    The node description contradicted its own edges, and the fix is to make the topology the claim rather than to add the edge. The description said the 2025 knock-in mouse locates the lesion "one step downstream of autophagosome formation", while the graph made the node a sibling hanging directly off TECPR2 Loss of Function. The sibling topology is the defensible one: the paper establishes a distinct HOPS-dependent role in endolysosome maintenance and does not show that this lesion follows from failed autophagosome formation. Drawing the serial edge would assert a sequence the source does not support. The description now says that explicitly and names what evidence would justify adding the edge later.

    Three of the non-blocking suggestions are taken because they improve the entry rather than merely satisfy the review. The endolysosomal node now lists neuron alongside microglial cell, since the paper covers both. Aspiration carries a sequelae edge to Recurrent Respiratory Infections, which its own description already asserted in prose. And the tecpr2_autophagy_direction_conflict discussion now absorbs the new paper: it listed three candidate explanations for the formation-versus-clearance conflict and none was the one this entry's own new node advances - that a protein required both at ER exit sites and at endolysosomal tethering would produce formation-like readouts in one assay and clearance-like readouts in another without either being an artefact. That is the most economical reconciliation available and the discussion now says so, while noting it reframes the conflict rather than resolving it. The discussion also attaches_to the new node.

    Also dropped two duplicate DOI caches, DOI_10.1038_s41419-025-08168-w.md and DOI_10.1080_15548627.2020.1852724.md, now that both papers are cited by PMID.

    Validation: just validate-disorders passes, 75/75 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length.

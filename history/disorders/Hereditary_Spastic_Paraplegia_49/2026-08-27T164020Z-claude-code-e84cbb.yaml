  summary: Add diagnosis and counselling, endolysosomal node, phenotype edges; fix
    apnea and carrier-frequency bindings
  details: |
    Correction round on PR #9655 in response to review. All seven blocking findings addressed, plus the Bugbot prevalence finding.

    diagnosis: section added. It was absent and the GeneReviews DIAGNOSIS/TESTING sentence was unmined. The section says more than that sentence does, because the sentence alone would be uninformative: the interpretive difficulty in this disorder is variant classification rather than variant detection, since nearly half the disease alleles are missense and cluster in the beta-propeller repeats. The allele-spectrum quote is graded PARTIAL because it states where the difficulty sits without stating a diagnostic criterion.

    GENETIC COUNSELING mined into a new treatments entry, with both the 25/50/25 sentence and the carrier/prenatal/preimplantation testing sentence. The entry's description records why counselling carries more weight here than the recurrence figure alone implies - an estimated 1 in 155 Ashkenazi carrier frequency, and unrelated non-founder patients as far afield as China.

    PMID:41173829 was cached and uncited. It is now a new pathophysiology node, Endolysosomal Dysfunction and Impaired Microglial Clearance, sitting downstream of TECPR2 loss of function and upstream of neuron degeneration. It is worth a node rather than a few evidence items because it adds two things the entry did not have. First it locates the lesion one step past autophagosome formation, via TECPR2's interaction with the HOPS tethering complex. Second it makes the mechanism non-cell-autonomous: damage-associated microglia respond to the dying neurons but their clearance capacity is itself attenuated. The paper's most striking observation, that the axonal dystrophy is region-specific and concentrated in the medulla, is recorded in the node description as an open question rather than presented as an explanation - nothing in this pathograph explains why a ubiquitously expressed protein produces a lesion confined to one region.

    Three GeneReviews phenotypes added: atypical behavior (HP:0000708), gastrointestinal dysmotility (HP:0002579), and aspiration (HP:0002835, temporality RECURRENT). All three come from the same characterisation sentence.

    Sleep Apnea regraded. The phenotype was bound to HP:0010535 Sleep apnea, but the sources describe apnea as part of autonomic dysfunction and record wake apnea, so the sleep-restricted child asserts a narrower claim than any source makes. Renamed to Apnea and rebound to HP:0002104, with a note saying that splitting into sleep and wake apnea is the right move if a source is ever found that separates them, and is not supported now.

    The pathograph now reaches the phenotypes. Sensory and Autonomic Neuron Degeneration carries eight downstream edges, DIRECT for the neurological signs and INDIRECT_KNOWN_INTERMEDIATES for the autonomic ones, where the intermediate is the specific autonomic pathway rather than the general degeneration. Corticospinal Axonopathy carries one to Spastic Paraplegia.

    Bugbot's prevalence finding was correct and the fix goes further than the finding. The general-population carrier record was prevalence_class: ABOVE_1_IN_1000 with rate 81.9 per 100,000 - and 1 in 1221 is below 1 in 1000, so the class was simply wrong. No other Orphanet band fits either: 81.9 per 100,000 falls in the gap between BAND_1_5_PER_10000, which tops out at 50 per 100,000, and ABOVE_1_IN_1000. The class is removed rather than swapped, and removed from the Ashkenazi record too, where the numeric rule would have permitted keeping it. The reason is recorded in both: Orphanet prevalence classes band disease occurrence, and a carrier frequency is not disease occurrence, so setting one reads as a claim about how common the disease is. The numeric rate is the informative field for a carrier estimate.

    Validation: just validate-disorders passes, 75/75 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length.

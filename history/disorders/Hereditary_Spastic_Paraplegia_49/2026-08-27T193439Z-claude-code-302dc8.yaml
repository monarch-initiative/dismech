  summary: Add the knock-in mouse model; cite the autophagy-class reviews
  details: |
    Addressed the non-blocking items from the third review on PR #9655.

    Added the 2025 Tecpr2 L1152Yfs knock-in mouse (PMID:41173829) as a third animal_models
    entry. It was already cited on the Endolysosomal Dysfunction pathophysiology node but had
    no model record, so the HOPS finding could not carry modeled_mechanisms. Two links:
    RECAPITULATES against the endolysosomal node (two readouts - medullary axonal swelling
    with neuronal loss, and the DAM state with reduced endocytic capacity) and
    PARTIALLY_RECAPITULATES against Sensory and Autonomic Neuron Degeneration (gait ataxia
    readout). Recorded two limitations that matter: the corresponding human endolysosomal
    lesion is shown only in fibroblasts and knockout cells rather than patient nervous tissue,
    and the knock-in's stated design purpose - testing a truncated mutant protein for toxic
    gain-of-function - was not met because TECPR2 was undetectable at the protein level, so it
    is functionally a loss-of-expression model like the knockout.

    Cited the two review articles that were fetched into the cache and left unused.
    PMID:26715604 names SPG49/TECPR2 as a founding member of the congenital-disorders-of-
    autophagy class, which is the classification the entry's description asserts and which
    previously had no evidence behind it. PMID:34130600 places the TECPR2 lesion at the
    formation stage on the autophagosome node, and separately states in the
    direction-conflict discussion that the role is "not fully resolved" - external
    confirmation that the conflict this entry records is a real state of the field.


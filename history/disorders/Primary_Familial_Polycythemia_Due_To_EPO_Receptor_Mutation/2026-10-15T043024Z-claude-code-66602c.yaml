  summary: 'Create: Primary Familial Polycythemia Due to EPO Receptor Mutation'
  details: |
    De-novo curation of PFCP/ECYT1 (EPOR, hgnc:3416, MONDO:0007572), the primary (EPO-low) counterpart of the secondary erythrocytosis siblings Chuvash polycythemia and Familial Erythrocytosis 4. Deep-research provider claude_code; the report was thin (3 web searches, most content flagged unverified) so it was used only for leads. Backbone PMIDs independently fetched and verified: 8506290 (de la Chapelle 1993 sentinel kindred), 7795221 (Sokol 1995 frameshift + BFU-E hypersensitivity), 9649565 (Kralovics 1998 incomplete penetrance), 29269524 (Pasquier 2017 frameshift novel-tail mechanism), 20096014 (Huang 2010 down-regulation review), 15878737 (Arcasoy 2005 Y344/STAT5), 24533580 (EGFR-EPOR chimeras), 11158582 (Divoky 2001 humanized knock-in mouse), 38546672 (New Caledonia founder cohort, phlebotomy+aspirin), 41123216 (2026 JAK2-unmutated erythrocytosis review), 27831681 (GeneReviews baseline). 13-node atomic pathophysiology chain from the EPOR truncation to organism-level consequences, all 12 phenotypes causally connected. Validated: validate-disorders passed (51 snippets, 62 titles, 0 issues); validate-terms, entity-refs, causal-targets, qualifier-terms, duplicate-keys, block-scalar, coarse-phenotypes, cache-integrity all clean. preflight-dr WARN (benign: EPO co-mention is the receptor ligand; OMIM 133100 and gene EPOR match). GeneReviews chapter PMID:27831681 exists and is tagged; offline Bookshelf index snapshot missed it. Review round 1 (ai4c-reviewer, changes requested): rebound the stroke phenotype from HP:0002140 Ischemic stroke to HP:0001297 Stroke (source does not specify ischemic; renamed node and the Thromboembolism sequela target); added GeneReviews (PMID:27831681) evidence to the molecular-diagnosis row, the gene-testing row, the reduced-EPO phenotype (below-normal-EPO criterion), and the genetic-counseling treatment (50% recurrence, prenatal/PGT); added Tinnitus (HP:0000360) and Visual impairment (HP:0000505) hyperviscosity phenotypes wired from Blood Hyperviscosity; grounded the frameshift-tail node with GO:0004900 erythropoietin receptor activity; swapped PMID:8506290 to its direct 'negative control on erythropoiesis' quote with directness INDIRECT; set quote_role BACKGROUND on the two PMID:38546672 JAK2/STAT5 introductory snippets; noted the Dizziness->Vertigo binding choice. 58/58 snippets, 14/14 phenotypes connected, just validate-disorders clean. Review round 2 (ai4c-reviewer): replaced the 4-word 'below normal erythropoietin concentration' snippet with the full GeneReviews diagnostic-criteria sentence (clears check-snippet-length), added that GR evidence to the Serum erythropoietin measurement diagnosis row as well, and marked the Thromboembolism->Stroke sequela INDIRECT with a caveat that GeneReviews also names intracerebral hemorrhage, which a thromboembolic edge does not explain. 59/59 snippets verified, check-snippet-length clean, just validate-disorders clean.

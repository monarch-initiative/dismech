  summary: 'Compliance: evidence for phenotypes and hemolytic laboratory markers in
    AIHA'
  details: |
    Weekly compliance pass. Added PMID-backed evidence items to all four phenotypes (anemia, jaundice, splenomegaly, fatigue) and all five biochemical markers (DAT, reticulocytes, LDH, haptoglobin, indirect bilirubin), which previously carried no evidence at all. New references fetched with just fetch-reference: PMID:30146455 (pediatric primary-AIHA clinical series), PMID:40728672 (FACIT-Fatigue qualitative studies in warm AIHA), PMID:26819490 (hemolytic markers review) and PMID:31839434 (First International Consensus Meeting). A PARTIAL evidence item records that reticulocytopenia occurs in 20-40 percent of AIHA cases, qualifying the reticulocytosis marker. Population limits of each source are stated in the explanations. Weighted compliance 71.4 percent to 91.7 percent. Validated with just validate, just validate-terms and just count-verified-snippets (22/22 verified).

  summary: Review AIHA subtypes, immune mechanisms and treatments against full-text
    evidence
  details: |
    Reviewed the acquired AIHA umbrella against the matching Falcon research report and its cited clinical/mechanistic sources. The Cyberian artifact is a local inventory rather than an independent scientific review. The Falcon report contains erroneous ontology suggestions, including its MONDO identifier and Kupffer-cell ID; verified ontology bindings take precedence. Existing history contained no REVIEW, and eligibility/open-PR checks were performed before this work. This is autoimmune disease, within the sweep excluding infectious and environmental disorders.

    Source consumption: read the full scientific bodies and relevant tables of PMID:39371250, PMID:38673882 and PMID:40821796, including conflicting source statements rather than copying review summaries uncritically. Read full-text marrow results/methods/tables (PMID:40854885), Treg methods/results (PMID:37534543), Tfh mouse experiments (PMID:31875006), and the Kostic 2024 CD4-cell PDF. Read the daratumumab full report (PMID:38507742), CADENZA extension (PMID:39091672), prospective epoetin cohort (PMID:38029356), thrombosis cohort (PMID:35555857), 2026 fostamatinib report (PMID:41846299), fatigue interviews (PMID:40728672), and bortezomib review (PMID:34795889). Recovered Kuter 2022 full text through its generated PMC URL cache and the original 2018 bortezomib phase II letter through its institutional PDF cache. Abstract evidence was used for the FORWARD, parsaclisib, sovleplenib, pegcetacoplan, CD19 CAR-T, long-lived plasma-cell and red-pulp macrophage primary reports. The latter full text remained inaccessible through attempted PMC URLs (browser challenge) and Europe PMC XML (HTTP 500); its verified abstract supports the receptor-expression claim. PMID:31839434's cached HTML repeats abstract/metadata and was not counted as full scientific text. PMID:39708374 remained an unavailable later bortezomib/rituximab lead; no results were inferred from its title. The daratumumab erratum PMID:39671214 was checked through recovered XML: Figure 1 time axes are weeks, not months. Cache files were generated only by the reference fetcher.

    Completeness assessment:
    1. Phenotypes adequate: anemia, jaundice, splenomegaly, fatigue, dyspnea, pallor, cold circulatory manifestations, spherocytosis, hemoglobinuria, reticulocytopenia and thrombosis. Removed unsupported population frequencies; symptom-selected interviews do not establish prevalence.
    2. Subtypes adequate: warm, primary CAD, secondary cold agglutinin syndrome, mixed and PCH; DAT-negative is a diagnostic category. Passenger lymphocyte syndrome is an alloimmune differential. Preserve the dedicated CAD entry for additional clonal detail.
    3. Mechanisms adequate: atomic autoantibody, Fc-receptor, agglutination, classical complement, C3-opsonization, hepatic clearance and terminal-lysis events; marrow compensation and immune persistence are represented. Tfh/Treg/Th17, BAFF, inflammatory and ADCC findings retain experimental or provisional limits. Rat-RBC immunization is required in the Tfh transfer model; findings do not prove spontaneous human disease. Human red-pulp macrophages express Fc-gamma-RIIa/IIIa without detectable IIb in the cited primary experiment.
    4. Treatments/trials adequate: standard warm versus cold management, transfusion/supportive care, thromboprophylaxis, epoetin, clone-directed and complement therapies, emerging B-cell/plasma-cell/FcRn/kinase/CAR-T approaches; 31 treatments and 26 registry records. Current ClinicalTrials.gov API statuses checked on 2026-09-27 replace stale review statuses; UNKNOWN and terminated studies are retained as such. Registration is not evidence of efficacy. FORWARD failed its prespecified primary endpoint; later observational and post-hoc findings do not reverse that result. Trial-specific subtype, denominator, concomitant therapy and adverse-event limits are preserved.
    5. Genetics adequate for scope: acquired immune disease, not a single Mendelian phenotype. Underlying immune-dysregulation syndromes and clonal CAD biology are contextual; experimental expression changes and common association signals are not universal causal germline variants.
    6. Diagnostics/biomarkers adequate: hemolysis plus DAT interpretation, cold titer/thermal amplitude, Donath-Landsteiner and extended DAT-negative workup, with five biochemical markers and four histopathology findings. Marrow biopsy is not asserted to be routine for every patient.
    7. References adequate: verified high-value primary evidence supplements the reviews; all new evidence carries titles. GSE301528 has 12 patient specimens from nine patients plus three healthy donors, not 18 patients; GEO records and clinical participants are distinguished. GSE195791 RNA and protein findings are not conflated. All three datasets verified through generated accession caches.
    8. Overall consumption adequate: central research themes represented, with primary-study corrections and explicit experimental limits. GeneReviews check found no applicable chapter.

    Specific numerical safeguards: marrow Table 1 has dyserythropoiesis 74/97 and MF1 fibrosis 28/97, unlike reversed percentages elsewhere in the article. Daratumumab has 12 warm and seven cold patients, with concomitant treatment in 13/19. Epoetin late response is 31/34 observed at month 12, not 91% of the entire 47-person cohort. Bortezomib has 21 enrolled and 19 evaluable, with two early adverse-event discontinuations excluded from efficacy. The 2026 CAR-T report combines five compassionate-use and six phase I patients, not an eleven-person randomized trial.

    Validation: schema, ontology and batched references passed (144 snippets, 155 titles, no unavailable snippets). Scoped data tests passed (four cases, including the matching giant-cell-hepatitis/AIHA entry). Causal targets, coarse phenotype bindings, source-defect claims and snippet length/title guards passed. Full-text HTML subscript markup required quoting the intact folate clause rather than inserting a space in B12. Remaining independent PR review and CI are tracked separately from this author review.

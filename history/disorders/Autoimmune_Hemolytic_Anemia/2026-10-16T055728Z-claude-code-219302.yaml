  summary: 'LOINC: bind direct antiglobulin test reagent codes'
  details: |
    Bound three DAT reagent-specific codes -- LOINC:1007-4 (polyspecific), LOINC:55776-9 (IgG-specific), LOINC:54410-6 (complement C3-specific) -- as three separate measurements on the Demonstrate hemolysis and characterize red-cell sensitization diagnosis row, as part of dismech LOINC Diagnostics tranche C (autoantibodies). The row's own cited evidence states monospecific DAT testing is mandatory alongside the polyspecific screen, so all three reagent specificities were bound as separate measurements rather than one code with a caveat (same discipline as the HIT functional-assay split in an earlier batch); no single LOINC code bundles the three reagents. Also bound LOINC:55776-9 (IgG-specific) on the Direct Antiglobulin Test (DAT) biochemical record, with a note pointing to the diagnosis row for the complement-specific and polyspecific codes, since loinc_term there is single-valued. This record is not subtype-stratified by warm/cold AIHA -- the entry's warm/cold has_subtypes blocks do not carry their own DAT rows. All labels were verified against the Monarch KG entity API in the same step they were written. Confirmed all three CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

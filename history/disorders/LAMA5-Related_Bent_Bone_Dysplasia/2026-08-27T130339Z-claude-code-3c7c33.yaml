  summary: 'Fix a snippet-grading divergence: one quote graded two ways'
  details: |
    check-snippet-grading flagged one sentence from PMID:33242826 carrying evidence_source HUMAN_CLINICAL at phenotypes[2] and IN_VITRO at discussions[1]. Per CLAUDE.md, evidence_source classifies the cited publication's evidence type, so it cannot change because the quote moved -- re-grading a copied quote is the defect.

    The sentence reports a radiographic phenotype observed in the affected patients, used as the motivation for an in-vitro investigation. The quoted content is the human observation, so HUMAN_CLINICAL is correct in both places; the discussions entry was the wrong one and is corrected.

    Surfaced locally after main set SNIPPET_GRADING_BASELINE_REF (bb26cce63). Fixed regardless of whether the CI job flags it, since it is a real divergence by the repo's own rule.

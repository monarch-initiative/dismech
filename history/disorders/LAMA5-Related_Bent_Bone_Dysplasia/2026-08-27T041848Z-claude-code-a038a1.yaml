  summary: 'Rename: Bent Bone Dysplasia Syndrome 2 -> LAMA5-Related Bent Bone Dysplasia'
  details: |
    Renamed from "Bent Bone Dysplasia Syndrome 2" (file Bent_Bone_Dysplasia_Syndrome_2.yaml), created earlier in this same session. BBDS2 and Bent Bone Dysplasia Syndrome 2 are retained as synonyms; disease_term stays MONDO:0859573.

    The rule adopted: gene-anchor an entry name when the phenotypic label on its own is locus-ambiguous - when one clinical label names two or more dismech entries, so the label alone cannot say which entry is meant. Where OMIM/MONDO supply a numbered form it is kept as a synonym and stays the disease_term label; the gene anchor replaces the entry name only, never the ontology binding. Campomelic dysplasia has one gene and keeps its plain clinical name.

    This is a disambiguation rule, not adoption of the ISDS 2023 dyadic naming system. src/dismech/schema/classifications/isds_skeletal_nosology.yaml previously said dyadic naming was "deliberately NOT imported into dismech entry naming"; that sentence would now contradict the KB, so it was rewritten to state the rule and its limits explicitly.

    Filenames track entry names, per the repo convention (2197 of 2282 disorder files already matched). History records are append-only: the originals keep their target.slug/target.path and carry target.superseded_by pointing at the successor, and the record files were moved into the successor slug directory.

    One history record moved and annotated. The differential_diagnoses display name for the FGFR2 entry was updated. No content or evidence changed.

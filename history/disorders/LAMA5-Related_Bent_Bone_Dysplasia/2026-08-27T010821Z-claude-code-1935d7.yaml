  summary: 'Create: Bent Bone Dysplasia Syndrome 2 (LAMA5), ISDS group 20 NOS 20-0060'
  details: |
    Curated as part of a completeness pass over ISDS 2023 nosology group 20. NOS 20-0060 is the only group-20 row with no MIM number in the 2023 table; OMIM:620076 (BBDS2) and MONDO:0859573 were minted afterwards.

    Lump/split: separate from Bent_Bone_Dysplasia_Syndrome (BBDS1, FGFR2). Shared name and shared radiographic sign only; different gene, inheritance (AR vs dominant de novo) and mechanism (basement-membrane/focal-adhesion vs receptor-trafficking/ribosome-biogenesis). OMIM, MONDO and ISDS all split them.

    Everything known comes from one sibship (ISDR R03-206, PMID:33242826), with both alleles SIFT-benign missense; that limitation is recorded as an explicit KNOWLEDGE_GAP discussion rather than smoothed over. Two further gaps recorded: the WNT-to-mineralization step is argued rather than demonstrated, and the muscular/mechanical contribution to bone bending is the authors' own speculation. The load-bearing negative result - unchanged phospho-FAK alongside reduced PYK2/FYN - is curated explicitly, since it is what makes the pathway noncanonical and tissue-restricted. The gene-edited HeLa LAMA5Hyp/Hyp line is curated as an experimental_models entry linked to the signaling node with two readouts.

    Congenital/infantile nephrotic syndrome from biallelic LAMA5, flagged in the ISDS row, is deliberately not curated here; nor are the two earlier unrelated human LAMA5 reports.

    Validation: just validate passes; 45/45 snippets verified against cached references.

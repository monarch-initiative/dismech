  summary: 'Create: Queensland Tick Typhus'
  details: |
    Created a standalone Queensland Tick Typhus entry for MONDO:0001118 after
    ignored-file-inclusive local search found the MONDO ID, label, and Rickettsia
    australis strings only in the Spotted_Fever_Rickettsiosis subtype row, generated
    Spotted_Fever_Rickettsiosis Boomer/pages output, rare-disease mapping worklists,
    existing Rickettsia references, and one Murine_Typhus research/page echo. The only
    all-state PR match was the merged spotted-fever root PR (#8899), and all-state
    GitHub issue searches for both `Queensland tick typhus` and `MONDO:0001118`
    returned no matches.

    PROMOTION. Promoted the Queensland tick typhus subtype out of the deliberately thin
    Spotted_Fever_Rickettsiosis root while leaving that parent intact, and changed the
    subtype description there from "No standalone dismech entry yet" to `Curated in
    full in Queensland_Tick_Typhus.yaml`.

    DEEP RESEARCH. Seeded the QTT entry with its MONDO term, Rickettsia australis
    infectious-agent binding, and a cached QTT review (PMID:28719297), then ran `just
    research-disorder openscientist Queensland_Tick_Typhus`. The first OpenScientist
    call stayed silent for roughly 20 minutes without a report file, so it was
    interrupted; an immediate fallback-enabled rerun picked up the completed
    OpenScientist result in the provider cache and wrote
    `research/Queensland_Tick_Typhus-deep-research-openscientist.md`, its citation
    sidecar, and HTML/PDF artifacts. The report resolved all 24 references and marked
    14 as on-topic.

    NEC. `just preflight-dr
    research/Queensland_Tick_Typhus-deep-research-openscientist.md MONDO:0001118`
    returned SKIP because MONDO records no RO:0004003 causal gene for this acquired
    infection. Manual identity review matched the report to QTT throughout: the report
    centered MONDO:0001118, Rickettsia australis, Ixodes tick transmission, and eastern
    Australian disease. The "Australian spotted fever" alias was treated as ambiguous
    with Flinders Island spotted fever and was not added as a synonym.

    TERM REVIEW. The report's term validation resolved every CURIE but correctly
    flagged two bad or misleading leads: `UBERON:0000465` was offered for "Lymphatic
    system" even though it resolves to "material anatomical entity", and `GO:0050830`
    was offered for Gram-negative bacterial defense even though it resolves to
    "defense response to Gram-positive bacterium". Neither was used.

    CONTENT. Curated Ixodes holocyclus/Ixodes tasmani transmission, eastern-coastal
    Australian exposure, R. australis infection of dermal macrophages, the conserved
    rickettsial endothelial vasculitis mechanism, TLR4/ASC/MyD88 innate control, CD8
    T-cell cytotoxic clearance in the R. australis mouse model, the shared
    70S-ribosome doxycycline target, and the shared intracytosolic Rickettsia niche.
    Added five phenotypes and wired all five to causal parents: eschar, regional
    lymphadenopathy, fever, headache, and vesicular rash. Added qPCR and indirect
    immunofluorescence diagnosis, plus empiric doxycycline treatment targeting both the
    ribosomal translation node and the intracellular niche.

    VALIDATION. `just validate kb/disorders/Queensland_Tick_Typhus.yaml` passed with
    23 snippets checked, no skipped or unavailable snippets, and 26 titles checked.
    `just count-verified-snippets kb/disorders/Queensland_Tick_Typhus.yaml` reported
    23/23 snippets verified against cached references. `just list-disconnected-phenotypes
    kb/disorders/Queensland_Tick_Typhus.yaml` reported 5/5 phenotype nodes causally
    connected. `just validate kb/disorders/Spotted_Fever_Rickettsiosis.yaml` passed
    after the parent row pointer edit.

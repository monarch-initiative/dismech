  summary: Bind LOINC group-level SFG serology code to the IFA diagnosis row, with
    a cross-group caveat
  details: |
    Added diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Indirect immunofluorescence assay serology row. This entry had previously been left unbound as ambiguous: its cited evidence says serology distinguishes QTT from scrub typhus and murine typhus, which read at first as a group-vs-species question rather than the group-vs-non-group question the code actually answers. Re-reading it this round: scrub typhus (Orientia tsutsugamushi) and murine typhus (Rickettsia typhi, typhus group) carry different antigens from the spotted fever group, so a reactive group-level SFG result is consistent with QTT (and the other SFG diseases) and inconsistent with those two -- which is exactly the distinction the row's evidence describes. A notes field was added to the row stating this directly and noting the residual limit: the code does not by itself distinguish QTT from another SFG member such as Flinders Island spotted fever. The code was seeded this round via just loinc-seed-cache + just normalize-cache: one new, additive cache/loinc/terms.csv row (the same code is also cached, with a different retrieved_at, by the still-open batch-9 and batch-16 PRs #13988 and #14101; that is a known, trivial additive conflict for whichever merges later).

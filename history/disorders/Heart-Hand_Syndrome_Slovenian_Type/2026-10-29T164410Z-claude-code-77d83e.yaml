  summary: 'Fix red CI: reference titles on the trial evidence; regrade to OTHER'
  details: |
    Fixes the one red gate on this branch, 'Check every evidence item has a reference title' (scripts/find_missing_reference_titles.py). The two clinical_trials evidence items added in the previous round cited clinicaltrials:NCT02057341 and clinicaltrials:NCT03439514 with no reference_title. Both titles are copied verbatim from the title: frontmatter of the corresponding references_cache/clinicaltrials_*.md files, not written from the trial descriptions. That gate is not in the CLAUDE.md gate list and is not part of just validate, just as check-gene-activity-grounding was not, so neither of the two red CI rounds on this branch was caught by the checks the curation workflow names. Both are run by the whole-repo gates step, so running that step rather than the enumerated recipes is what would have caught them. Bundled into the same push, since a push costs a review cycle whatever its size: the two trial evidence items are regraded from HUMAN_CLINICAL to OTHER. What they quote is a registration record describing an intended design, not a result, which is the case CLAUDE.md's ICTRP example assigns to OTHER; the reviewer raised it as optional in two consecutive rounds and it is plainly correct. Their explanations already said 'the registration record's own description', so no prose changed. Also in this push, the previous round's history record is trimmed to this entry: its details had been written once for a four-entry batch and mostly described KDF1, CCDC47 and DPH1, which belong to other entries' ledgers. The LMNA content, the reason a real binding was preferred to a baseline exemption, and the note on the dismissed approval are kept; the other three genes' specifics are removed rather than corrected in place, and the three merged PRs each carry that content in their own records.

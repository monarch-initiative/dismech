  summary: 'Review round 1: HHS toe binding, signalling node split, missing phenotypes'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review on PR 15753. All four IMPORTANT findings were verified before acting and all four were correct. (1) A toe phenotype was bound to HP:0010554 Cutaneous finger syndactyly, a finger term, while its own description and snippet were about the fourth and fifth toes; rebound to HP:0004692 4-5 toe syndactyly and the node renamed, since the node's name carried the wrong label too. (2) The PMID:41073815 snippet beginning 'Computational modeling revealed' was graded IN_VITRO; it is an in silico result and is now COMPUTATIONAL, with the explanation noting that the same study's experimental arms are graded separately. (3) The best finding: the Dysregulated Mechanotransductive Signalling node bundled WNT going down with MAPK going up, bound only the Wnt term with modifier DECREASED, and carried the p38 inhibitor's target_mechanisms - so the pathograph asserted that ARRY-371797 acts on decreased Wnt signalling, which is not its mechanism. Split into MAPK Pathway Hyperactivation (GO:0000165, INCREASED) and Reduced WNT/beta-catenin Signalling (GO:0016055, DECREASED), both fed from the nuclear-damage node and both feeding the conduction node, with the drug now pointing at the MAPK node. This also brought PMID:30319452 into use: it was in references: with no evidence item, and now carries the ERK1/2 hyperactivation claim, and PMID:36515663's introduction supplies the human-tissue p38 activation that makes the MAPK node a human rather than a mouse claim. (4) Added two features named in snippets the entry already quoted: Supraventricular tachycardia (HP:0004755) for the atrial tachyarrhythmia in the segregating phenotype, bound at that level because the sources say 'atrial tachyarrhythmias' without naming a rhythm; and Toe symphalangism (HP:0010179) for the terminal symphalangism of the original kindred, with a description recording that HP:0100264 Proximal symphalangism was deliberately NOT used because the fusion is terminal - the same term the deep-research report had mislabelled. Suggestions taken: the prose saying the skeletal node is marked HYPOTHESIZED corrected to HYPOTHETICAL, which is the actual value; the unevidenced CL:0000138 chondrocyte binding dropped, with the node description now saying why no cell type is bound; GO:0042733 embryonic digit morphogenesis added alongside limb development, with a note that both are kept because metacarpals and metatarsals are affected as well as phalanges; and clinical_trials entries added for the phase 2 pilot and for REALM-DCM. The trial work turned up an error in both the report and the review: REALM-DCM is NCT03439514, not NCT02351856, which is the separate open-label rollover study - confirmed by fetching all three registrations. Both trials carry status UNKNOWN rather than an asserted value, because the cached registration records have no status field; the entry says so and points at just clinicaltrials-status-audit. No therapeutic_agent was bound for ARRY-371797 because NCIT has no term for it, and the treatment description now records that. One suggestion not taken: splitting a fibrosis/contractile node out of Conduction System Degeneration and Myocardial Fibrosis. The reviewer marked it optional, and the sources describe conduction loss, fibrosis and contractile failure as one progressive process without separating them, so splitting would assert an ordering the literature does not give; left as a note for a future pass. Re-validated: schema, terms, 41/41 snippets, 44 titles, and the per-file and whole-tree gates clean.

  summary: 'Create: Heart-Hand Syndrome, Slovenian Type'
  details: |
    De novo curation of heart-hand syndrome type IV (MONDO:0012417, LMNA). Deep research: falcon was requested and returned HTTP 403 (invalid EDISON_API_KEY); the run fell back to openscientist with --fallback, so the committed report records fell_back/requested_provider/provider_attempts. Report validation read before use: 15/15 references resolved, confabulation_rate 0.0, 12/15 on topic; needs_review was set for one mislabelled term, HP:0100264, which the report calls 'Symphalangism affecting the phalanges' and HP calls 'Proximal symphalangism'. That term is not bound in this entry, and it would have been wrong on the facts as well as the label: the original kindred had TERMINAL symphalangism. The report materially improved the entry. It supplied four references my own PubMed sweep had missed - PMID:41073815 (microtubule forces, not LINC-transmitted contractile strain, drive nuclear damage, with a rescue experiment), PMID:28069793 (reduced WNT/beta-catenin and connexin 43, with pharmacological rescue of intraventricular conduction defects specifically), PMID:18926329 (penetrance 60/94, and splice-site genotype as an independent sudden-death predictor, which matters because this disease's original allele IS a splice-site variant) and PMID:36515663 (the p38 inhibitor phase 2 trial). Conversely, my manual search found the second family report (PMID:27723096) which the report did not cite, so neither source was sufficient alone. The lump/split decision is recorded in the entry's review_notes rather than left implicit, because it is where the entry is most open to challenge: LMNA is already extensively curated here and the cardiac features are indistinguishable from Dilated_Cardiomyopathy_1A, so the case for a separate entry rests entirely on the skeletal arm being inexplicable by any cardiac node. The skeletal pathophysiology node is marked mechanism_confidence HYPOTHETICAL, since the only published proposal is a comparative inference from acro-osteolysis in other LMNA disorders. gene_disease_validity is absent on purpose: ClinGen classifies LMNA for dilated cardiomyopathy, but a tier assigned for a different MONDO disease is a different gene-disease pair and must not be copied here. just preflight-dr could NOT be run: it requires the local 1.3 GB MONDO build and this container had about 500 MB of writable disk free, so the Named Entity Confusion check was done by hand (the report's anchors name LMNA and MONDO:0012417, and it correctly treats Holt-Oram/TBX5 as the differential rather than the subject). Validation: just validate passes (schema, terms, 35/35 snippets, 40 titles); per-file and whole-tree KB and evidence gates clean. GeneReviews baseline: NO_CHAPTER for this entity - there is a GeneReviews chapter on LMNA-related dilated cardiomyopathy, which covers the cardiac arm but not the skeletal arm and does not name this disease, so it is not the baseline and the entry notes say so.

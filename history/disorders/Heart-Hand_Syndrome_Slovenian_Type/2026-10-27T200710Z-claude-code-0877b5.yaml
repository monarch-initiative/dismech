  summary: 'Fix red CI: ground the causal gene with a molecular function'
  details: |
    Fixes the check-gene-activity-grounding gate, which failed in CI on this branch. The gene descriptor on the entry's root pathophysiology node, LMNA Variant Producing Structurally Abnormal Lamin A/C, carried no molecular_functions, so the gate counted it as a newly ungrounded gene. Fixed by binding a real molecular function rather than grandfathering the node in tests/gene_activity_grounding_baseline.txt: that exemption is for a many-gene bundle or a class whose members share no function, and this node is neither - it carries exactly one gene with one well-defined activity that the entry's own cited evidence already describes. LMNA is bound to GO:0160123 structural constituent of nuclear lamina, following the precedent already in kb/disorders/Charcot-Marie-Tooth_Disease_Type_2.yaml, which grounds the same gene with the same term on an equivalent nuclear-lamina node. The modifier is DECREASED, which is the direction the lesion acts in and is consistent with the node immediately downstream, Weakened Nuclear Lamina. The same gate failed on the three other entries curated alongside this one in the same session; each was fixed on its own branch, in its own PR, with its own record. Note on cost: this push dismisses the approval this PR had been given, because main has dismiss_stale_reviews enabled. That is unavoidable and correct - a red head is not mergeable whatever its review state, so holding the fix to protect an approval would have left the PR unmergeable with an approval on it.

  summary: 'Create: Acute Post-Surgical Pain'
  details: |
    Created Acute Post-Surgical Pain (Iatrogenic; MONDO intentionally unbound — no human MONDO term exists, closest relative MONDO:0024317 chronic pain syndrome; chronic sequela is ICD-11 MG30.21). Pathophysiology chain: surgical incision/nociceptor activation -> inflammatory mediator release/peripheral sensitization -> spinal central sensitization (dorsal horn, NMDA, microglia) -> resolution vs chronic post-surgical pain. Added a therapeutic_vulnerability node 'Spinal Microglial Gating of Opioid Antinociception' conforming to spinal_hsp90_opioid_enhancement#Microglial Src Kinase Activation (paw-incision model is the flagship module study). Refs: PMID:8783314 (Brennan incision model), PMID:29392204 (Pogatzki-Zahn mechanisms->treatment review), PMID:16698416 (Kehlet CPSP), PMID:20961685 (Woolf central sensitization), PMID:41031962 (module flagship). 18/18 snippets verified exact substrings; schema+term validation pass. Manual PubMed research (DR providers unavailable in env).

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178 Newborn Screening) with two MeasurementDescriptors read from the Monarch KG: LOINC:53175-6 Octanoylcarnitine (C8) [Moles/volume] in DBS and LOINC:53177-2 Octanoylcarnitine (C8)/Decanoylcarnitine (C10) [Molar ratio] in DBS. Two reference ranges on the C8 code with screen-negative/screen-positive bands: Ohio programme cut-off 0.7 umol/L (PMID:23151387) and British Columbia programme cut-off 0.38 umol/L (PMID:18767270), each quoting the source sentence. The C8/C10 ratio is bound without a range because no PubMed abstract found by the named query states a numeric ratio cut-off; the query is recorded in the row notes. Added loinc_term LOINC:53175-6 on the existing C8 acylcarnitine biochemical marker, whose context already describes the dried-blood-spot screening marker. Cache rows seeded with scripts/seed_loinc_cache.sh and normalized. Validated with just validate, validate-terms, count-verified-snippets (88/88), check-duplicate-keys, check-entity-refs, the LOINC schema pytest, a scratchpad render, and the batched validate-disorders sweep.

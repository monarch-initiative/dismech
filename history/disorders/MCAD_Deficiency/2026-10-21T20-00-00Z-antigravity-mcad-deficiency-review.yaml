  summary: >-
    Reviewed MCAD Deficiency entry, removing deprecated prevalence percentage,
    wiring Hypoketotic hypoglycemia mechanism to Elevated liver transaminases,
    binding Reye-like syndrome to HP:0006582, rebinding L-carnitine
    supplementation to Pharmacotherapy (NCIT:C15986) with CHEBI:16347, and
    grounding Dietary modification and Avoidance of fasting with GeneReviews
    (PMID:20301597) evidence.
  details: >-
    Audited all existing snippets, ontology terms, and causal edges across the
    MCAD_Deficiency entry against cached references. Removed the deprecated
    percentage field from the European ancestry prevalence record while keeping
    the 1 in 6,500–20,000 range; connected Hypoketotic hypoglycemia mechanism
    via an INDIRECT_UNKNOWN_INTERMEDIATES downstream edge to Elevated liver
    transaminases backed by PMID:1684086; bound Reye-like syndrome to
    HP:0006582 (Reye syndrome-like episodes); updated L-carnitine
    supplementation from NCIT:C15447 to NCIT:C15986 (Pharmacotherapy) with
    therapeutic_modality SMALL_MOLECULE and therapeutic_agent CHEBI:16347
    ((R)-carnitine) without adding un-evidenced target_mechanisms; added
    PMID:20301597 evidence to Dietary modification and its Hypoketotic
    hypoglycemia mechanism target_mechanisms link; and added pregnancy
    catabolism avoidance guidance from PMID:20301597 to Avoidance of fasting.

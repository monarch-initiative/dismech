  summary: 'Create: Developmental and Epileptic Encephalopathy 14 (KCNT1)'
  details: 'New etiology-defined entry for DEE14 (MONDO:0013989), the KCNT1-related developmental and
    epileptic encephalopathy.


    Scope decision. Two syndrome-defined entries already existed and overlap this one: Epilepsy_of_Infancy_with_Migrating_Focal_Seizures
    (MONDO:0017385) and Familial_Sleep_Related_Hypermotor_Epilepsy (MONDO:0000030, which carries a KCNT1
    ENFL5 subtype). Neither claimed MONDO:0013989. DEE14 was curated as a separate DISEASE entry because
    it is defined by etiology rather than syndrome and neither contains nor is contained by the other
    two: KCNT1 accounts for about half of EIMFS, and the KCNT1 phenotype spans EIMFS, sleep-related hypermotor
    epilepsy, other early-onset encephalopathies and non-encephalopathic focal epilepsy. The reasoning
    is recorded in the entry''s top-level notes. Duplicate preflight over origin/main, all PRs and all
    issues found no existing coverage; the stubs/ entry for this disease is deleted by this change.


    Deep research: falcon (Edison), 790s, report at research/Developmental_And_Epileptic_Encephalopathy_14-deep-research-falcon.md
    with citations sidecar and one artifact. Its own validation reported 15/15 references resolved, 0
    unresolved, 0 off topic, and 32/33 terms resolved. The single flagged ''mislabelled'' term is a template
    artifact: the prompt string ''MONDO:0013989 (if available)'' caused the validator to read ''if available''
    as the reported label. No real mislabelling, and no CURIE from the report was bound without independent
    checking.


    GeneReviews baseline: PMID:30234941 (KCNT1-Related Epilepsy) fetched, cached, and tagged GeneReviews
    in the top-level references block. Its Clinical Characteristics were cross-referenced against the
    phenotypes section; every phenotype it lists is captured (migrating focal seizures, nocturnal hypermotor
    seizures, drug resistance, developmental plateau/regression, profound delay, axial hypotonia, progressive
    microcephaly, strabismus, autonomic manifestations, cognitive/psychiatric comorbidity, cardiac arrhythmia,
    pulmonary hemorrhage). Its Agents/Circumstances to Avoid guidance is curated as a Seizure-Safety Precautions
    treatment quoting the recommendation directly.


    Sources beyond the report. The report cites by author-year key with no PMIDs in the body, so its sources
    were looked up in PubMed individually. Two lookups changed the entry materially: the Bonardi 248-individual
    spectrum series (PMID:34114611) supplied the four-group phenotype structure used for has_subtypes
    with real denominators (EIMFS 152, non-EIMFS DEE 37, ADSHE 53, other 6), and following the GEO dataset''s
    linked publications surfaced PMID:41981306 and PMID:42056090 - the antisense-oligonucleotide work
    the report could only cite as a 2024 preprint has since been peer-reviewed and published, including
    first-in-human results. That changed the ASO treatment from preclinical-only to carrying human efficacy
    (seizure reduction in two children with p.R474H) and, importantly, human toxicity (ventricular enlargement
    or hydrocephalus in both, goals-of-care redirection in one), which is recorded as a REFUTE item alongside
    the efficacy.


    Pathophysiology is built as a causal chain, not a list: KCNT1 gain-of-function variant -> increased
    cooperative Slack channel gating -> elevated KNa current -> branching into impaired GABAergic interneuron
    excitability (mouse, network-dependent) and shortened action potential with enhanced afterhyperpolarization
    (human iPSC neurons, explicitly cell-autonomous) -> aberrant synaptic rewiring -> cortical network
    hyperexcitability and hypersynchrony -> seizure phenotypes and developmental plateau. The branch is
    deliberate: the two mechanisms are recorded as competing mechanistic_hypotheses (interneuron_disinhibition
    CANONICAL, cell_autonomous_firing ALTERNATIVE) with a HUMAN_MODEL_MISMATCH discussion, because neither
    study tests the other''s mechanism and no human tissue measurement arbitrates.


    Evidence discipline. Quinidine deliberately carries evidence in both directions - the randomized trial
    (PMID:29196578) and prospective neonatal series (PMID:30182418) refute efficacy, the open-label cohort
    and case report support it - with the reconciliation (variant-specific sensitivity, marginal brain
    concentrations, and phenotype: pooled benefit is confined to EIMFS and is nil in sleep-related hypermotor
    epilepsy) recorded in notes rather than resolved by dropping one side. One claim from the falcon report
    was deliberately NOT curated: its KCNT1-specific status epilepticus rate (6/10) comes from the Donnan
    full text, and the cached abstract does not contain it, so no snippet could be quoted.


    Datasets: geo:GSE297948 (human, KCNT1 ASO knockdown), located by searching GEO for the gene rather
    than the disease. just discover-datasets returned only SCN8A, CDKL5, PNPLA8 and SCN1A datasets - Named
    Entity Confusion through a disease-name search - and those were reviewed and rejected; the rejection
    is recorded in the dataset notes.


    Self-review round before PR. A fresh-context red-team review against the dismech-pr-review skill was
    run and its findings acted on in this same change rather than deferred. What it changed. The entry
    now declares conforms_to against epilepsy_excitation_inhibition_imbalance for its interneuron and
    network nodes, so the mechanism is integrated with the module rather than restated. A diagnosis section
    was added after the review found GeneReviews only partially mined, along with its previously unquoted
    Surveillance and Pregnancy management guidance and developmental support. HP:0020174 Refractory drug
    response replaced HP:0007359 Focal-onset seizure on the drug-resistance phenotype, and the entry''s
    claim that HPO had no term for pharmacoresistance was simply wrong and was deleted; that term is used
    12 times elsewhere in this KB. Four claims quoting the literature-review introduction of a mouse paper
    were regraded from HUMAN_CLINICAL to OTHER with directness INDIRECT, since they describe the EIMFS
    syndrome rather than the KCNT1-defined entity. Two explanations claiming seizure-independent developmental
    causation were softened to what their snippets actually support. The etiologic fraction misfiled as
    a prevalence record moved to genetic case_fractions. variant_origin was unset because the slot is
    single-valued and this entry spans de novo, inherited and mosaic origins. mondo_mappings were added
    recording MONDO:0014002 as narrowMatch and MONDO:0017385 as relatedMatch, so the scope claim is machine-checkable
    rather than only prose. Sequelae edges were added to connect the previously orphaned status epilepticus,
    mortality and microcephaly phenotypes. A convulsive status epilepticus phenotype was added, at 6/10
    KCNT1 individuals from Donnan 2023. A knowledge gap on the origin of the developmental phenotype was
    added, the review having noted that the entry stated the uncertainty in prose while modelling only
    one branch. The ASO section gained the countervailing on-target tolerability datum so the safety picture
    is not one-sided.


    Two corrections the review made to my own scope argument are worth recording. The notes block asserted
    that this entry curates the KCNT1 mechanism once rather than three times. That was false about the
    repository, because the EIMFS entry already carries its own KCNT1 mechanism chain, KCNT1 genetics
    and quinidine treatment, and this change does not edit it. The notes now state the intent and say
    plainly that the mechanism is at present curated in two places, with reconciliation deferred to a
    follow-up rather than bundled into a new-entry PR, and they now also record why a Grouping was considered
    and rejected. Separately, the HUMAN_MODEL_MISMATCH rationale overstated its case. It claimed neither
    study tests the other''s mechanism, when the mouse study did measure excitatory-neuron KNa current
    and found the subthreshold increase absent there, and it omitted the gene-dose confound, namely that
    the iPSC neurons are homozygous while patients are heterozygous, which is the leading benign explanation
    for the discrepancy. Both are now recorded.


    Validation. just validate, just validate-disorders (the batched gate CI runs), just verify-datasets,
    check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence
    and check-stubs all pass. 133/133 evidence snippets verified against the local reference cache. Weighted
    compliance 90.5%, down from 92.7% before the review round because that round added structure faster
    than it added evidence; the new diagnosis section, sequelae edges and third knowledge gap each introduce
    slots the scorer counts. 24 PMIDs, 3 ClinicalTrials.gov records, 1 GEO accession. Thirteen DOI cache
    files generated by the report''s own reference validation are deliberately not committed, because
    the entry cites no DOIs and they are not needed for deterministic CI.


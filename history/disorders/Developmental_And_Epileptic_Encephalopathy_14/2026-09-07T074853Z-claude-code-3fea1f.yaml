  summary: 'Correction: DOI reference caches were committed after all'
  details: 'Corrects one statement in the CREATE record for this entry, which is append-only and is left
    as written.


    That record states that thirteen DOI cache files generated by the deep-research report''s own reference
    validation were deliberately not committed, on the grounds that the entry cites no DOIs and they are
    not needed for deterministic CI. That was the decision taken and it was accurate when the curation
    commit was made. It is no longer accurate about the repository. An automated post-session hook, reacting
    to the files being untracked, committed them immediately afterwards as 58b3a1318 and pushed them.
    That commit was not authored as part of the curation work and its message is the hook''s, not the
    curator''s.


    The files are being kept rather than reverted. They back the citation validation of the deep-research
    report that this branch also commits, so under the repository''s own guidance that references_cache/*.md
    is committed for deterministic reference validation, their presence is defensible even though no kb/
    entry cites them. Reverting would churn the pull request without changing what CI does. Nothing about
    the disorder entry, its evidence, or its validation depends on them either way.


    One incidental finding worth recording because it outlives this branch. Two of the committed files,
    DOI_10.1212_WNL.0000000000207080.md and DOI_10.1212_wnl.0000000000207080.md, are the same DOI cached
    twice under different letter case. This is not an artifact of this session: the repository already
    carries the same collision on main for a different paper, where DOI_10.1172_JCI97350.md and DOI_10.1172_jci97350.md
    are both tracked and both cited from Autosomal_Recessive_Nonsyndromic_Hearing_Loss_26.yaml, so one
    entry cites one paper twice through two casings of its identifier. The reference fetcher does not
    normalize DOI case, so every casing variant gets its own cache file, and such pairs will collide on
    a case-insensitive filesystem. Fixing it needs normalization in the fetcher plus a one-off deduplication
    of the existing pairs and the entries citing them, which is tooling work outside the scope of a curation
    change and is not attempted here.

    '

  summary: 'Create: Glycogen Storage Disease Type VI (MONDO:0009294)'
  details: |
    Created kb/disorders/Glycogen_Storage_Disease_Type_VI.yaml. entry_type DISEASE; the
    stub is retired by this change.

    Scope decision: GSD VI is curated SEPARATELY from GSD IX, despite the two being
    clinically indistinguishable and sharing a single ACMG management guideline. The reason
    is mechanistic - PYGL encodes the substrate enzyme, phosphorylase kinase is the distinct
    activating kinase upstream of it. This applies the same rule the GSD IX entry used when
    it lumped PHKA1/PHKA2/PHKB/PHKG2: those genes encode subunits of ONE enzyme complex, so
    they lump; PYGL and PHK are different enzymes, so they do not. The clinical convergence
    is real and is captured as an open KNOWLEDGE_GAP rather than being dissolved into the
    scope decision, with a note that a Hepatic_Phosphorylase_System_Deficiencies grouping
    over VI and IX would be the right structure for it - left as a follow-up rather than
    smuggled into this PR.

    Two things are curated as positive findings rather than as absences, because they are
    what makes the disease diagnosable. First, ketosis: fatty-acid oxidation is intact, so
    ketogenesis is preserved and the hypoglycaemia is ketotic - the discriminator against the
    non-ketotic hypoglycaemia of GSD I, where gluconeogenesis is also blocked. The central
    node is deliberately named for what remains intact as well as what fails. Second,
    postprandial hyperlactataemia, whose temporal direction is the reverse of GSD I's fasting
    lactic acidosis; the timing, not the abnormality, carries the discriminating value.

    The "benign disease" framing is deliberately NOT repeated. PMID:34440378 reports liver
    fibrosis in 32.4% and early cirrhosis in 10.8% of 37 biopsies, and PMID:32892177
    independently found regenerative nodules in four of ten patients. GeneReviews'
    "cirrhosis is rare" is curated alongside as PARTIAL rather than reconciled, and the
    denominator problem - these are biopsied patients, not all patients - is recorded as an
    OPEN_QUESTION with a proposed unselected-cohort elastography study. Averaging the two
    sources would have invented a number neither supports.

    The Pygl-null mouse (PMID:31701076) is curated as an animal_models entry with two
    ModelMechanismLinks. It carries the metabolic arm at HIGH fidelity and the fibrogenesis
    arm at MODERATE, with limitations recorded on both: the model is a constitutive knockout
    while most patients carry missense alleles with residual activity, and its collagen
    deposition is minimal-to-mild and appears only after ~40 weeks, so it supports the
    fibrogenesis node but not the cirrhosis endpoint. Its alpha-SMA readout is what licenses
    the fibrotic_response#Mesenchymal Cell Activation conformance on the fibrogenesis node.

    NEC risk was highest for this entry of the four, since a deep-research report that
    drifted to phosphorylase kinase would have been entirely coherent and would have
    validated perfectly. The Perplexity report passed preflight against MONDO:0009294 with
    PYGL mentioned 109 times and no PHKA2/PHKB contamination, OMIM 232700 matching the MONDO
    xref. Used as a lead-generation aid only.

    An upstream ontology issue is flagged in the entry notes rather than acted on: MONDO's
    own definition of MONDO:0009294 calls the disease "benign" and uses the obsolete
    sub-numbering "GSD 6b".

    Validation: just validate passes all three stages, reporting "Snippets checked: 33/33
    verified against cached references". All five ungated CI gates pass. Three fixes were
    needed during validation, all worth recording: ModifierEnum has no NORMAL value, so the
    "gluconeogenesis intact" claim is carried by the node description rather than by a
    modifier; genetic_context belongs on a pathophysiology node, not on a genetic entry; and
    one snippet had been written from memory rather than transcribed - the real abstract of
    PMID:9536091 says something stronger and more useful, and the corrected quote is now
    used.

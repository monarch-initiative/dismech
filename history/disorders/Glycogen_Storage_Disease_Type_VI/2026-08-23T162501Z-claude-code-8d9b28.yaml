  summary: 'Review round: address ai4c-reviewer findings on GSD VI'
  details: |
    Two review rounds on PR #9312, recorded together.

    Round 1 raised four CRITICAL and four IMPORTANT findings. Added a references: block
    tagging PMID:20301760 as GeneReviews and a diagnosis: section mining the three
    previously unmined GR sections (DIAGNOSIS/TESTING, MANAGEMENT surveillance, GENETIC
    COUNSELING). Corrected two claim-evidence mismatches on the dietary treatment: the
    target_mechanisms link had been backed by ACMG document-purpose boilerplate, and the
    entry-level evidence by a suboptimal-control complications snippet that belonged on
    phenotypes. The replacement GR sentence - "Increasing protein intake may be necessary
    to provide an alternate substrate for gluconeogenesis" - turned out to evidence this
    entry's own gluconeogenesis-is-intact thesis directly, so the fix improved the entry
    rather than merely repairing it. Added glucagon as a REFUTE-graded contraindicated
    treatment (it acts through the very phosphorylase that is missing), the three missing
    GR phenotypes, and reworded the lump/split rationale so it no longer depends on the
    unmerged GSD IX PR.

    Round 2 confirmed all eight resolved and raised one further IMPORTANT finding, which
    was a correct catch against a mistake of mine. The only prevalence record was the
    Mennonite founder population at ABOVE_1_IN_1000, which would make any consumer
    aggregating on prevalence_class read GSD VI as a >1-in-1,000 disease. My stated reason
    for omitting the ACMG general figure - that it sat in full text the reference validator
    does not read - was wrong. The cached file holds the full text and the sentence
    verifies; I had inferred the limitation from the --no-full-text flag without testing
    it. The general-population record is now curated at 1 per 100,000
    (BAND_1_9_PER_100000, range 0.1-1.5), together with the guideline's own caveat that no
    good prevalence studies exist and the condition is almost certainly underdiagnosed -
    which is consistent with this entry's KNOWLEDGE_GAP on indistinguishability from GSD
    IX. The Mennonite record is kept alongside with its notes corrected to say it is a
    founder figure roughly a hundredfold above the general rate.

    Two suggestions were declined in round 1 and the reviewer independently verified both
    declines were correct: the schema has no OMIM mapping slot, and this entry's parents:
    title-casing matches the GSD majority.

    Validation: 44/44 snippets verified under just validate-disorders, the exact CI
    command, up from 33/33 at first submission. All five ungated CI gates pass.

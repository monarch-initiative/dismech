  summary: Enriched Harrison's classifications, CNS and immune cell ontology bindings, phenotypes, CSF diagnostic criteria, and supportive treatment links for Tick-Borne Encephalitis.
  details: >-
    Added Harrison's chapter classifications (INFECTIOUS_DISEASES and NEUROLOGIC) backed
    by ACIP MMWR recommendations (PMID:37943707). Enriched pathophysiology nodes with
    macrophage, lymphocyte, and neutrophil cell types and brain and spinal cord
    anatomical locations. Added Myalgia and Paralysis phenotypes with causal downstream
    edges from viremic and neuroinvasive pathophysiology nodes, added Cerebrospinal
    Fluid Examination to diagnosis, and linked Supportive Care to Neuroinvasion and
    Central Nervous System Inflammation.

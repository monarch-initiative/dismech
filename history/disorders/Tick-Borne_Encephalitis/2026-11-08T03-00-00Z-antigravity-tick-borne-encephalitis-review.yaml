  summary: Enriched Harrison's classifications, CNS and immune cell ontology bindings, phenotypes, CSF lumbar puncture diagnosis, and treatment metadata for Tick-Borne Encephalitis.
  details: >-
    Added Harrison's chapter classifications (INFECTIOUS_DISEASES and NEUROLOGIC) backed
    by ACIP MMWR recommendations (PMID:37943707). Enriched the neuroinvasion
    pathophysiology node with lymphocyte and neutrophil cell types (supported by CSF
    pleocytosis quotes), brain and spinal cord anatomical locations, and spinal MRI
    evidence on the Paralysis causal edge. Added Myalgia and Paralysis phenotypes with
    causal downstream edges, added Cerebrospinal Fluid Examination bound to Lumbar
    Puncture (NCIT:C15327) under diagnosis, and added therapeutic_modality metadata on
    vaccination and supportive care.

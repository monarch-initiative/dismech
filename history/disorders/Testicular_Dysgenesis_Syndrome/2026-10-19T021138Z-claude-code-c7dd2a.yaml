  summary: 'Create: Testicular_Dysgenesis_Syndrome'
  details: |
    New entry for MONDO:0005437, curated as the umbrella fetal-origin mechanism rather than a clinical diagnosis. Pathograph is a seven-node causal chain from fetal testis maldevelopment through Leydig and Sertoli dysfunction, with two branches: the androgen arm (reduced fetal testosterone -> deficient androgen action in the masculinisation programming window -> incomplete reproductive tract masculinisation) and an androgen-independent descent arm (impaired INSL3-RXFP2 signalling at the gubernaculum -> failure of trans-abdominal descent). Germ cell arm runs from Sertoli dysfunction to arrested gonocyte differentiation and GCNIS. Three animal models curated with modeled_mechanisms links, per request for animal models of decreased anogenital distance and androgen signalling disruption: gestational DBP rat (AGD and intratesticular testosterone readouts; FAILS_TO_RECAPITULATE link on the GCNIS node, since no animal model reproduces human-type germ cell cancer), gestational flutamide rat (receptor-level blockade, separating androgen action from androgen synthesis; records its own shortfall on cryptorchidism after single-dose exposure), and the ENU Rxfp2 D294G mouse (descent arm). A REFUTE evidence item on the DBP model's Leydig link records that grafted human fetal testis resisted phthalate-induced steroidogenic suppression (PMID:22511013), with a matching limitations field. Deep research: falcon was requested but its API key returned 403, so the run was repeated with --fallback and openscientist produced the report; the report records fell_back, requested_provider and provider_attempts in its frontmatter. Report validation read before use: 48/48 references resolved, confabulation_rate 0.0, needs_review true on two off-topic references (PMID:28981654, PMID:36377604), neither of which is cited here; one unresolved term (CHEBI:41448), not bound. The six mislabelled_terms entries are the report putting frequency text in the label column, not wrong bindings. preflight-dr returned SKIP because MONDO records no causal gene for this entity; checked manually instead and the report's top genes (INSL3, RXFP2, NR5A1, KITLG, DMRT1) are TDS-appropriate. No GeneReviews chapter (check-genereviews NO_CHAPTER). No HPO term for anogenital distance was found, so reduced AGD is represented as model readouts rather than bound to an approximate phenotype term. Validated with just validate (47/47 snippets and titles), validate-terms, check-entity-refs, check-coarse-phenotypes, count-verified-snippets 47/47; weighted compliance 100.0% with datasets the only missing slot. A red-team review in fresh context was run before commit and found two critical errors, both fixed. First, the pathograph was rooted on an edge the cited source argues against: PMID:22253897 states the Leydig impairment precedes dysgenesis and reads the correlation as a common cause, not dysgenesis causing somatic dysfunction. The chain was re-rooted on a new node, Common Early Disruption of Testis Lineage Specification, with Fetal Leydig Cell Dysfunction, Sertoli Cell Dysfunction and Focal Testicular Dysgenesis as parallel consequences; the former root is now a marker node with no downstream edges, and the snippets were replaced with the authors' common-origin sentences. Second, the Sertoli edge had encoded a part-whole relation as causation and was re-expressed off the new root as INDIRECT_UNKNOWN_INTERMEDIATES. Also fixed from that review: the supports: REFUTE on PMID:22511013 was attached to a link claim it did not contradict (the rat model does perturb fetal Leydig function; what the xenograft refutes is human translatability), so it was moved into a structured divergences entry of type CONTESTED_ASSUMPTION, materiality QUALIFYING, and reclassified IN_VITRO since the material assayed is human fetal testis; the GCNIS node was split into Arrested Gonocyte Differentiation, Germ Cell Neoplasia In Situ and Invasive Testicular Germ Cell Tumour so the cancer arm reaches an organism-level endpoint like the other two arms; four overclaiming passages that stated rat results as human fact were hedged; the flutamide model's top-level quote was about the androgen-exposed female arm and was replaced with a flutamide result; an intratesticular-testosterone interpretation asserted a recovery its attached quote did not show; an uncited negative claim that human RXFP2 variants are not a cause of cryptorchidism was replaced with a cited and narrowed statement (PMID:31167797 reports recessive RXFP2 variants in familial bilateral cryptorchidism); the Leydig-to-INSL3 edge rested on an anatomy sentence and was downgraded to INDIRECT_UNKNOWN_INTERMEDIATES; one reference carried two evidence_source values in one file; and a readout bundling two measurements was narrowed to the one its quote supports. The review also flagged under-use of the research report: maternal paracetamol was the second best-evidenced exposure and was absent, so it was added with both cohorts of PMID:21059752 including a REFUTE item for the null Finnish cohort, plus PMID:27609981. Genetics, diagnostics and treatments were deliberately left to the component and neighbour entries, and that scoping is now stated in notes rather than left silent. Final state: 57 snippets and titles verified, validate-terms, check-entity-refs and check-coarse-phenotypes all pass, weighted compliance 100.0% with datasets the only missing slot.

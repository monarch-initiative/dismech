  summary: 'Address review on PR #14865'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #14865, bundled into one push. Critical: just check-snippet-grading failed because the same PMID:28352662 sentence was graded HUMAN_CLINICAL on the Germ Cell Neoplasia In Situ node and MODEL_ORGANISM on the DBP model's FAILS_TO_RECAPITULATE link. The sentence genuinely spans human and rat testes, so each item was re-quoted with the half it needs rather than one being re-graded: the human-side comparison sentence stays on the GCNIS node, and the model link now quotes the rat-side inventory of what the model reproduces, which is also the better evidence for a negative link because that list stops short of a germ cell neoplasm. Whole-KB check-snippet-grading now reports no new divergences. Second: no phenotype was wired into the pathograph (0 of 5). Five edges added with bare-name targets, all from evidence already in the file except the infertility edge: Incomplete Reproductive Tract Masculinization to Hypospadias and to Cryptorchidism (PMID:18340380), Failure of Trans-abdominal Testicular Descent to Cryptorchidism and Oligozoospermia (PMID:20963592) and to Male infertility (PMID:20610195, INDIRECT_UNKNOWN_INTERMEDIATES because the figures are post-orchidopexy outcomes rather than a measured mechanism), and Invasive Testicular Germ Cell Tumour to Testicular neoplasm (PMID:18205797). Cryptorchidism is deliberately reached by two edges, matching the two phases of human descent. list-disconnected-phenotypes now reports 5 of 5 connected. Third: quote_role REVIEW_SYNTHESIS was set on five primary research articles (PMIDs 22253897, 23589523, 16079079, 28352662, 20963592), none of which carries a PubMed Review type and each of which was quoted from its own conclusion; all five changed to PRIMARY_RESULT. Fourth: three unsignalled omissions. Added a prevalence record carrying the birth-cohort incidence trend and the developed-world concentration (PMID:17031378), which is the central epidemiological argument for a fetal origin and was previously asserted in the environmental section with no citation at all; that prose claim is now cited. Added an inheritance block recording the syndrome as multifactorial with rare monogenic forms, bound to HP:0010982, explicitly stating that the X-linked AR family in the genetic block is not the mode of inheritance of the syndrome. Prognosis is recorded on the descent-to-infertility edge rather than as its own block, with the reasoning stated in notes. Also took three reviewer suggestions: PMID:18308057 and PMID:18205797 regraded from HUMAN_CLINICAL to OTHER where the quoted sentence spans animal and clinical work or is a statement about animal models, and a notes line recording that the report's two off-topic references were read and not cited. Two reference_titles I had guessed were corrected against the cache (PMID:20610195 and PMID:17031378). Final state: 68 of 68 snippets and titles verified, validate-terms, check-entity-refs, check-coarse-phenotypes and whole-KB check-snippet-grading all pass, 5 of 5 phenotypes causally connected, weighted compliance 100.0%.

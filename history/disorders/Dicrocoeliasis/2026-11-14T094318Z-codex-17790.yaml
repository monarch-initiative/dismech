  summary: Create Dicrocoeliasis infectious disease entry
  details: |
    Added a new Dicrocoeliasis entry for MONDO:0005729 and deleted its stub. The curation binds the agent to NCBITaxon:57077 so both Dicrocoelium dendriticum and probable West African Dicrocoelium hospes infections remain in scope, models the snail/ant/ruminant life cycle, and separates true ant-acquired metacercarial infection from spurious stool egg passage after eating infected raw liver.

    The entry uses PMID:27895270 and PMID:33720847 for true-versus-spurious diagnosis and treatment, PMID:20220269 for an adult bile-duct fluke and triclabendazole-treated true infection, PMID:2260188 for the 208-patient Saudi stool-positive series, and PMID:19602926 for an albendazole-responsive true infection with eosinophilia and elevated bilirubin.

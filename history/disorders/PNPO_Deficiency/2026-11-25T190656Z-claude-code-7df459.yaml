  summary: 'Gene-family review: PNPO'
  details: |
    PNPO modelling re-reviewed and found correct: biallelic loss of pyridox(am)ine 5'-phosphate oxidase, with the node binding pyridoxamine phosphate oxidase activity (GO:0004733) as decreased; ClinGen Definitive already recorded. Added a record-level autosomal recessive inheritance block copied from the entry-level evidence. In Ariboflavinosis PNPO is correctly modelled as a cofactor-limited enzyme (low FMN from riboflavin deficiency) with no genetic record.

  details: |
    PR Shepherd round on PR #8600, which had been sitting behind main with conflicts since 2026-08-16.

    Merged origin/main into the branch (no rebase, no force-push). kb/disorders/PNPO_Deficiency.yaml had 11 conflict hunks against two intervening curation PRs (#9570, #9635). Resolved as follows:

    - Five hunks were distinct evidence items attached to the same causal edge by the two sides. Both were kept, since each cites a different source for the same claim and evidence is a list. This preserves main's PMID:33421502 and PMID:30764523 citations alongside this branch's PMID:32888189 and PMID:15772097 ones.
    - Six hunks differed only in prose or in how much of a sentence was quoted. Took main's wording, which quotes the fuller GeneReviews sentence (for example the seizure-semiology snippet, where main includes the leading 'In both classic and late-onset untreated PNPO deficiency' clause).

    Three content fixes in the same round:

    - genetic.evidence[1] on PMID:32888189 carried supports: PARTIAL, a value retired from EvidenceSupportEnum by #7439/#10003 while this branch was open. This is the merge-shaped failure CLAUDE.md describes: the value was legal when written and illegal on merge, and neither side could see it alone. Migrated to SUPPORT with directness: INDIRECT. The quote bounds the strength of the genotype-response claim ('only a weak correlation between the severity of PNPO protein disruption and disease outcomes') rather than asserting it directly, which is the inference-step case that INDIRECT records. The explanation already preserved the qualifier and was left as written.
    - An explanation on the Impaired PLP-Dependent GABA Synthesis to Neuronal Hyperexcitability edge ended with four lines describing what a previous version of the file had quoted. Edit history belongs in this record, not in an explanation slot, so that text was removed. The substantive part of the explanation is unchanged.
    - Folded the basis for frequency: FREQUENT back into the Developmental Impairment explanation when taking main's wording, so the 30-79 percent band remains justified in place.

    The blocking review finding from 2026-08-16 (a PMID:15772097 snippet reused on a downstream edge it did not evidence) was already addressed on this branch by commit a239683635 before this round.

    Validation: just validate (38/38 snippets verified), just validate-terms, just check-enum-values, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading all pass. Diff of the merge result against origin/main is 152 insertions across 3 files with no deletions, confirming the merge reverted nothing.

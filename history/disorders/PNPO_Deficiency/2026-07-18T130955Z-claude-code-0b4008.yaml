  summary: 'Create: PNPO Deficiency'
  details: |
    De-novo curation of PNPO deficiency / pyridox(am)ine 5'-phosphate oxidase deficiency (MONDO:0012407), a treatable autosomal recessive vitamin-B6 metabolism epilepsy and the PLP-synthesis-failure counterpart of ALDH7A1 pyridoxine-dependent epilepsy. GeneReviews baseline PMID:35737815 (tagged). claude_code deep research. Granular unbundled pathophysiology: PNPO deficiency -> impaired PLP synthesis -> PLP deficiency -> impaired PLP-dependent GABA synthesis and E/I imbalance -> hyperexcitability -> B6-vitamer-responsive neonatal seizures; parallel neurodevelopmental-impairment effector. Three conforms_to links to the epilepsy module. Evidence snippet-verified: 35737815 (GeneReviews), 15772097 (Mills 2005 founding), 32888189 (Alghamdi 87-case review), 25762494 (normal-CSF-PLP diagnostic caveat). Diagnosis, prevalence (CASES_IN_LITERATURE), biochemical-free. Discussions: PLP-vs-pyridoxine responsiveness + CSF-PLP caveat, prematurity risk-vs-manifestation, and the shared PLP-deficiency pathway with PDE (cross-referenced). All snippets confirmed as exact substrings; validation and folded-hyphen pass.

  summary: 'Publication-readiness review remediation: claim-evidence alignment and
    completeness'
  details: |
    Remediated a full publication-readiness review (issue #8052).

    Claim-evidence alignment: replaced all three references[].findings[].supporting_text values, which held meta-commentary about the Falcon deep-research run rather than quotations, with verbatim excerpts from the cited papers, and added an evidence item to each Finding. The reference validator checks only evidence[].snippet, so these three values were structurally unverified by CI. Sourced the fetal gamma-to-epsilon acetylcholine receptor subunit switch asserted in the lead pathophysiology node from the abstract of PMID:27245440, already cited but whose quoted sentence stopped short of the claim. Added evidence and intermediate_mechanisms to the core causal edge from receptor dysfunction to the fetal hypokinesia sequence. Removed diagnostic: true from the muscle-biopsy histopathology finding, whose snippet establishes observation but not diagnostic utility, and recorded why. Split the conflated foot-deformity phenotype: HP:0001838 now covers congenital vertical talus (6/12) and a new HP:0001762 entry covers clubfoot (1/12).

    Completeness: added derived-count frequency bands to six phenotypes with explicit numerators in their explanations; deliberately withheld a band from scoliosis because the cohort was ascertained as MPS-with-scoliosis and the published range (32-93%) crosses a band boundary. Added mappings (MONDO, ICD10CM, icd11f, NCIT), a Harrisons chapter classification, genetic case_fractions (CHRNG 5/7 solved cases), biological_scale tags, and a MYH3 differential diagnosis (MONDO:0020746). Dropped the deprecated updated_date.

    Two gaps left open deliberately and documented in-entry: no prevalence, because Orphanet has no epidemiology section for ORPHA:2990 and the only quantitative figure available describes lethal MPS; and no evidence on the genetic-counseling treatment, because no cited reference discusses counseling and fabricating a snippet was rejected.

    Validation: schema, term, and reference validation all pass with 49/49 snippets verified. The supporting_text values were separately confirmed verbatim by a whitespace-normalized substring check, since nothing in CI validates them. Weighted compliance rose from 95.0 to 99.2 percent.

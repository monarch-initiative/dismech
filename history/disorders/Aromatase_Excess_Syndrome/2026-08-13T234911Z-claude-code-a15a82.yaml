  summary: 'Create: Aromatase Excess Syndrome'
  details: |
    Created new Disease entry for Aromatase Excess Syndrome (AEXS, MONDO:0007690, CYP19A1 gain-of-function), a rare autosomal dominant disorder of aromatase overexpression complementing the existing Aromatase_Deficiency entry. Deep research provider: claude_code (deep-research-client, WebSearch/WebFetch; 15 web searches, 20 turns, report reference_validation 13/13 references verified, confabulation_rate 0.0). GeneReviews: none exists for AEXS (a McCune-Albright GeneReviews PMID was a false-positive search hit and was discarded). Evidence anchored to primary literature independently fetched and verified: Shozu NEJM 2003 (PMID:12736278, original inversion/constitutive-promoter GOF), Fukami JCEM 2011 (PMID:21470988), Fukami Int J Endocrinol 2012 (PMID:22319526), Fukami JCEM 2013 genomic basis (PMID:24064691), Fukami Pediatr Endocrinol Rev 2014 (PMID:24716396), Stratakis JCEM 1998 feminization-of-both-sexes (PMID:9543166), Binder JCEM 2021 long-term anastrozole (PMID:33513243), Tan JPEM 2019 (PMID:30530883), Wit Nat Rev Endocrinol 2011 (PMID:22024975). NEC note: PMID:9543140 was initially mis-fetched (it is an unrelated inhibin/endometrial paper, not the Stratakis AEXS paper); correct PMID is 9543166 — the wrong one is cited nowhere. Modeled CYP19A1 GOF as functional_impact_category HYPERMORPHIC on genetic_context and INCREASED aromatase activity (GO:0070330) rather than qualitative GAIN_OF_FUNCTION, since the enzyme is catalytically normal but overexpressed. Validation: schema (linkml-validate --target-class Disease) passed; term validation passed; count-verified-snippets 22/22 verified; CI-equivalent reference validation (--no-full-text) passed; compliance 96.6% global / 98.2% weighted; title-snippet and snippet-length gates show no new violations; caches normalized.

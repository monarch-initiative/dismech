  summary: Review and enrich GJB2-GJB6 Digenic Nonsyndromic Hearing Loss with classifications, GO molecular
    function/component/location bindings, and genetic molecular testing
  details: |
    - Added `classifications` section with Harrison's chapters (`DISORDER_OF_EAR`, `GENETICS_ENVIRONMENT_DISEASE`).
    - Grounded `Loss of Cochlear Connexin Gap-Junction Coupling` and downstream `pathophysiology` nodes with `biological_scale`, GO molecular function (`GO:0005243` gap junction channel activity), cellular components (`GO:0005921` gap junction, `GO:0005922` connexin complex), anatomical locations (`UBERON:0001844` cochlea, `UBERON:0002282` stria vascularis of cochlear duct, `UBERON:0001846` internal ear), cell type (`CL:0000202` auditory hair cell), and biological process (`GO:0007605` sensory perception of sound), plus downstream link to phenotype.
    - Marked `Congenital Sensorineural Hearing Loss` phenotype with `diagnostic: true`.
    - Added `variant_origin: GERMLINE` to `GJB2` and `GJB6`.
    - Enriched `Pure-tone audiometry` with `presence` and `results`, and added `GJB2 and GJB6 molecular genetic testing` (`NCIT:C15709`) backed by PMID:15064611 and PMID:11807148.

  summary: 'Review round 1: ai4c-reviewer findings'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #10938 in a single
    bundled push. Per finding:

    1. Apoptosis direction. The "Intrauterine Destructive Pancreatitis" node's
    acinar-apoptosis process was modifier INCREASED with no supporting snippet;
    the cited abstracts describe the lesion only as "destructive pancreatitis"
    and give no apoptosis direction (the "impaired apoptosis / induced necrosis"
    reading lives in the DR report, not a citable paper). Re-annotated to modifier
    DYSREGULATED (a real ModifierEnum value and the honest reading), renamed the
    process preferred_term accordingly, and added an explanation line stating the
    abstracts do not report a direction. Did not add necrosis/inflammation GO
    terms: no exact-quote evidence for them exists in the cached references.

    2. Added a diagnosis: section with three entries, each with an exact-quote
    snippet already in the cache: molecular UBR1 testing (NCIT:C15709,
    PMID:22072859), audiologic evaluation via auditory brainstem response
    (NCIT:C184949, PMID:34760428), and prenatal ultrasonography (NCIT:C17230,
    PMID:10423811). Pancreatic exocrine function testing was intentionally omitted
    - no quotable fecal-elastase/function-test snippet was available and inventing
    one would violate evidence discipline.

    3. Added cardiac (HP:0001627 Abnormal heart morphology) and genitourinary
    (HP:0000119 Abnormality of the genitourinary system) phenotypes, both citing
    the generic "...anomalies in cardiac and genitourinary systems" clause of
    PMID:22072859. Bound the general system-level terms rather than specific
    defects (ASD/hypospadias) because the snippet is generic - binding a narrower
    term would over-claim beyond the source.

    4. Connected the three orphaned phenotypes (Intellectual disability,
    Microcephaly, Anal atresia) plus the two new cardiac/GU phenotypes with
    INDIRECT_UNKNOWN_INTERMEDIATES downstream edges from the "Multisystem
    Developmental and Organ Dysfunction" hub, each with supporting evidence. Fixed
    the namespace hazard by renaming the pathophysiology node "Exocrine Pancreatic
    Insufficiency" to "Exocrine Pancreatic Failure" (distinct from the "Exocrine
    pancreatic insufficiency" phenotype) and updating all three bare-name
    references to it (upstream pancreatitis edge, PERT treatment target_mechanism,
    Ubr1-null mouse modeled_mechanism + readout).

    5. Dropped the unsupported Hypothyroidism frequency (OCCASIONAL had no snippet
    and contradicted the "commonest endocrine manifestation" description); no
    quotable frequency figure exists, so no band is asserted. Also softened the
    "commonest endocrine manifestation" superlative on both the phenotype and the
    hub edge to "a recognized endocrine manifestation".

    Suggestions taken: prevalence population changed from "Europe" (unsupported by
    the geography-free PMID:34760428 snippet) to "General population" with a note;
    zygosity: HOMOZYGOUS removed from genetic_context because both homozygous and
    compound-heterozygous cases occur and the slot is single-valued (biallelic
    LOF remains captured in the node description and functional_impact_category).

    Suggestions deferred with reason: Oligodontia frequency band (research says
    80-99% but no quotable source); top-level references block citing the Clinical
    Utility Gene Card PMID:23652379 (its cache content is "unavailable" - title
    only, nothing quotable); quantified mutational spectrum in the genetic section
    (its source, PMID:23652379, has no quotable cached body); and additional
    treatments (growth-hormone therapy, protein-hydrolysate diet, anoplasty) - no
    exact-quote support in the cached references.

    Validation: validate, validate-terms, validate-disorders (batched) all passed;
    54/54 evidence snippets verified; check-duplicate-keys, check-entity-refs,
    check-causal-targets (no new broken targets), check-qualifier-terms, and
    check-enum-values all passed. History record validated.

  summary: 'Create: Johanson-Blizzard syndrome'
  details: |
    De novo creation of the Johanson-Blizzard syndrome (JBS, MONDO:0009479)
    Disease entry, closing claim issue #10934 and deleting the corresponding
    curation stub.

    Curation was research-first: a Claude Code deep-research report was generated
    (research/Johanson-Blizzard_Syndrome-deep-research-claude_code.md) and used
    only as a set of leads. Every ontology CURIE and every evidence snippet was
    independently verified before use.

    Pathograph (8 pathophysiology nodes): biallelic UBR1 loss of function (an E3
    ubiquitin ligase of the N-end rule / N-degron pathway) -> impaired N-end rule
    proteolysis -> intrauterine destructive pancreatitis -> exocrine pancreatic
    insufficiency -> malabsorption and failure to thrive; plus a multisystem
    developmental/organ-dysfunction hub whose extra-pancreatic edges (nasal alae
    hypoplasia, scalp aplasia cutis, oligodontia, sensorineural hearing loss,
    hypothyroidism) are annotated INDIRECT_UNKNOWN_INTERMEDIATES because the
    disease-relevant N-end rule substrate is undefined. All causal downstream
    targets use bare names.

    12 phenotypes with HP terms; genetic section (UBR1, hgnc:16808, autosomal
    recessive, functional_impact_category LOSS_OF_FUNCTION with a genetic_context
    block on the trigger node); prevalence (1 in 250,000, BIRTH_PREVALENCE);
    3 treatments (pancreatic enzyme replacement therapy, levothyroxine, cochlear
    device implantation using the device-vs-action qualifier pattern); a Ubr1-null
    mouse animal model linked via modeled_mechanisms (PARTIALLY_RECAPITULATES);
    and a HUMAN_MODEL_MISMATCH discussion capturing that the Ubr1(-/-) mouse does
    not reproduce the destructive prenatal pancreatitis or the malformation
    spectrum.

    Two report-suggested CURIEs were rejected during term verification and are
    recorded in the entry notes: HP:0001060 (proposed for aplasia cutis; it is
    actually "Axillary pterygium" - scalp defect bound instead to HP:0007385) and
    CHEBI:6710 (proposed for levothyroxine; it is actually meclofenamic acid -
    levothyroxine bound instead to NCIT:C62080).

    Validation: schema validate passed; validate-terms passed; 44/44 evidence
    snippets verified against cached references; check-duplicate-keys,
    check-entity-refs, check-causal-targets (no new broken targets),
    check-qualifier-terms-online (2/2 device qualifier labels match), and
    check-enum-values all passed; batched validate-disorders passed.
    Key foundational reference: Zenker et al. 2005 (PMID:16311597, UBR1
    discovery and Ubr1-null mouse).

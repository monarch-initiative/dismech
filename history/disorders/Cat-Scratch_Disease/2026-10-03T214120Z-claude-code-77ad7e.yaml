  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for Bartonella henselae. Hosts: Homo sapiens (NCBITaxon:9606, accidental host via scratch or bite), Felis catus (NCBITaxon:9685, reservoir host, healthy carriers bacteraemic for months or years), Ctenocephalides felis (NCBITaxon:7515, cat flea, vector between cats). Vector: cat flea. Three stages: bacteraemic carriage in the feline reservoir (PMID:11189710), flea-borne transmission between cats (PMID:23351927, the collar trial, where untreated co-housed cats became infected and insecticide-treated cats did not), and human infection by cat scratch or bite (PMID:37772236, snippet copied from the transmission block with its HUMAN_CLINICAL grading unchanged). Block evidence PMID:11189710 states that the cat-to-cat step requires the flea and does not occur by direct contact. Two new references fetched: PMID:11189710 and PMID:23351927. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

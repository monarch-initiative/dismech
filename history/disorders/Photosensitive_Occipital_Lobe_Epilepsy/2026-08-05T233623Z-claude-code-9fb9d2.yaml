  summary: 'Create: Photosensitive Occipital Lobe Epilepsy'
  details: |
    Created the POLE entry as a seven-node pathograph running from an abnormal visual cortical response to photic and pattern stimulation, measured directly as elevated P100 amplitude at normal latency, through the photoparoxysmal response and a self-sustaining cortical after-discharge whose amplitude grades whether the electrographic event becomes a clinical seizure, to occipital seizure onset with elementary visual hallucinations, propagation to vomiting, headache and secondary generalization, and recurrent visually provoked reflex seizures. One node conforms to epilepsy_excitation_inhibition_imbalance at the hyperexcitability node; conformance is deliberately NOT declared at that module's Recurrent Unprovoked Seizures node, because the seizures of this syndrome are provoked by definition, and that mismatch is curated as an open question about the module boundary rather than papered over. Two further discussions cover the focal versus generalized classification tension and whether after-discharge amplitude is the mechanism of the electrographic-to-clinical transition or only its correlate. No genetic section is included. Deep research was run with the falcon provider and independently warned against transferring the mixed-cohort photosensitivity variant spectrum to this syndrome. All snippets were verified against their own fetched caches.

  summary: 'Create: Primary Ciliary Dyskinesia 9 (MONDO:0012906, DNAI2)'
  details: |
    New disorder entry for primary ciliary dyskinesia 9 (CILD9), the DNAI2-related form.

    Curation inputs. One Perplexity deep-research run, committed alongside as research/Primary_Ciliary_Dyskinesia_9-deep-research-perplexity.md, plus independent PubMed E-utilities searching. The report contributed narrative framing only and very little of that: its reference_validation block reported just three citations in total, all resolving and all on topic. Its term_validation block reported 20 of 49 checked labels mismatched, so no CURIE was taken from it. Two examples: HP:0005938 offered as primary ciliary dyskinesia, when HPO calls it Abnormal respiratory motile cilium morphology; and HP:0011107 offered as chronic cough, when HPO calls it Recurrent aphthous stomatitis. All bindings here were resolved against the committed term caches, several by reuse from the sibling entry Primary_Ciliary_Dyskinesia_30.

    GeneReviews baseline. The PCD chapter, PMID:20301301, is cited in references and tagged GeneReviews. Its PubMed record is a scope statement listing what the overview covers, not a clinical abstract, so it carries no quotable phenotype text; the phenotype frequencies in this entry come from the prospective multicentre cohorts instead. That is stated in the entry notes so a reviewer does not read the absence of GeneReviews evidence items as an omission.

    Structure. Eight pathophysiology nodes from biallelic DNAI2 loss of function through outer dynein arm assembly failure, absence of outer dynein arms from the axoneme, and motile ciliary beat failure, which then branches three ways into mucociliary clearance failure and chronic airway damage, randomised left-right asymmetry, and impaired sperm flagellar propulsion.

    The gene-specific content is in the assembly node. DNAI2 loss removes both outer-arm heavy chains, DNAH5 and DNAH9, from all mutant axonemes, so it disrupts proximal and distal outer dynein arm complexes alike, where DNAI1 loss mainly disrupts the proximal ones. The hierarchy runs both ways: DNAI2 is itself absent from the axoneme in DNAH5 patients and absent distally in DNAI1 patients.

    Ten phenotypes. Every prognostic and frequency statement is borrowed from the outer dynein arm defect class rather than measured in DNAI2 patients, and each is labelled as such in place rather than only in a footnote. Two frequencies for neonatal respiratory distress are recorded rather than averaged, because the cohorts differ.

    Two discussions, both KNOWLEDGE_GAP. The first is the absence of any DNAI2-specific natural history: the multicentre cohorts report by ultrastructural class, and the question is answerable in principle because the neonatal respiratory distress analysis does resolve genotypes within the outer-arm class. The second is the single reported co-occurrence of hydrocephalus with a DNAI2 microdeletion, which the case report proposes as a new genetic risk factor; the phenotype is curated VERY_RARE with the reasoning attached so one case report is not mistaken for an established correlation.

    A diagnostic point worth recording: one of the four reported DNAI2 alleles is a 6.9 kb intragenic deletion found by array CGH, so copy-number analysis is curated as a separate diagnosis entry from panel sequencing, and a negative panel in a patient with outer dynein arm defects is not a negative DNAI2 result.

    Validation. Schema validation passed on the first run; 32 of 32 evidence snippets verified against cached primary references; term validation, duplicate-key and entity-ref checks all pass.

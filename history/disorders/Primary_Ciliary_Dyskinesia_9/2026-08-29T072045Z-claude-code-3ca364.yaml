  summary: 'Review round 1: address ai4c-reviewer items on PR 10024'
  details: |
    Addressed all five blocking items and three of four non-blocking suggestions from the automated review of PR 10024.

    Item 1, missing otologic phenotypes. Added Recurrent otitis media (HP:0000403, FREQUENT) and Conductive hearing impairment (HP:0000405, OCCASIONAL), both from ORPHA:244 rows. The reviewer was right that this was a blocking omission: the entry's own description named recurrent otitis, the source was already cached, and the sibling entry Primary_Ciliary_Dyskinesia_30 curates both from the same rows.

    Item 2, ORPHA:244 unused. It is now the frequency backbone for the otologic phenotypes and is listed in references. The disagreement the reviewer flagged is reconciled explicitly rather than silently: Orphanet grades Bronchiectasis Occasional (29-5%) against the FREQUENT curated here. Both records are carried on that phenotype, with the Orphanet row graded PARTIAL because it supports the phenotype's occurrence while contradicting its frequency, and the description says why the cohort figure was preferred - the prospective paediatric series imaged every participant by CT and found a median of three affected lobes across all 118, which is not compatible with a sub-30 per cent rate.

    Item 3, diagnosis coverage. Added two entries. Nasal nitric oxide and high-speed videomicroscopy, cited from PMID:38891105, including that review's explicit statement that there is no single gold standard test. And immunofluorescence staining as its own entry, because it is the most DNAI2-specific of the three: DNAI2 disease loses DNAI2 plus both outer-arm heavy chains along the whole axoneme, DNAI1 disease loses DNAI2 only distally, and DNAH11 disease has a proximal-only partial reduction that conventional TEM reports as normal.

    Item 4, uncited cached references. PMID:26909801 now anchors the proximal/distal outer-arm heterogeneity the entry's whole argument rests on - previously carried by one sentence from the Loges paper. PMID:11713099 anchors the DNAI1 contrast. PMID:38891105 supports the new diagnosis and treatment entries.

    Item 5, no treatments and no scoping rationale. Added a single supportive-care entry linked to the clearance and chronic-infection nodes, with the scoping decision stated in the entry rather than left implicit: no trial has enrolled by genotype, the umbrella entry holds the detailed management block, and duplicating it here would create two places to maintain the same evidence and imply a genotype-specific practice that does not exist.

    Non-blocking suggestions taken. Fixed the evidence_source inconsistency within PMID:11153919 - both quotes are from the paper's introduction and both are now OTHER. Added the medaka jaodori dnai2 mutant as an animal_models entry with two modeled_mechanisms links and three readouts, after verifying the PMID the deep-research report implied: PMID:20709053 resolves to a real Dev Biol paper and its abstract states the Kupffer's vesicle findings directly. The model entry carries the limitation the model itself reports - medaka has a second dnai2 gene with redundant and distinct roles, and humans have one - graded PARTIAL because it qualifies the model's informativeness. Added Heterotaxy as a phenotype separate from situs inversus totalis, with no frequency asserted because the cited source does not separate the two. Added two differential_diagnoses covering the other outer-arm and docking genes and the normal-ultrastructure group.

    Validation after changes. Schema validation passes; 48 of 48 evidence snippets verified, up from 32; term validation, entity-ref and duplicate-key checks pass; the pytest lanes covering entity references and model-readout targets pass (7910 tests).

  summary: 'Create: Sinoatrial Node Dysfunction and Deafness (SANDD, CACNA1D)'
  details: |
    De novo curation of SANDD, MONDO:0013960, OMIM 614896. NEC preflight against the MONDO record and primary literature found that the curation issue mis-stated the causal gene as HCN4; the verified causal gene is CACNA1D, HGNC:1391, encoding the Cav1.3 L-type calcium channel, per the MONDO RO:0004003 relationship, PMID:21131953 which coined the SANDD name, and PMID:32601767 which ties CACNA1D to OMIM 614896 by number. The entry was therefore curated against CACNA1D and the discrepancy is documented in the entry notes. Deep research provider: Edison/falcon; the DR report passed the NEC gene/OMIM/MONDO check and additionally warned against merging SANDD with the dominant CACNA1D gain-of-function disorders. Modelled as a single-channel two-tissue divergence: biallelic CACNA1D loss of function feeds a sinoatrial pacemaker arm and a cochlear inner hair cell ribbon synapse arm. Three conforms_to edges declared against cardiac_ion_channel_repolarization at the variant, sinoatrial node pacemaker dysfunction, and syncope nodes; conformance to sensorineural_hair_cell_loss deliberately NOT declared because that module is framed on mechanotransduction failure rather than presynaptic calcium influx failure. Three discussions record open gaps: vestibular sparing, human cochlear degeneration versus pure synaptopathy, and whether human atrioventricular block occurs. No GeneReviews article exists for CACNA1D or SANDD. Orphanet prevalence not used because the local Orphadata refresh fails a manifest checksum; a qualitative ULTRA_RARE band is asserted instead. Validation: just validate passed, just validate-terms passed, just validate-references reported 59 of 59 snippets verified against cached references.

  summary: 'Gene-family review: CACNA1D'
  details: |
    CACNA1D was typed CAUSATIVE; ClinGen rates CACNA1D-SANDD Moderate (AR, Hearing Loss GCEP, 2024-04-17), so it is retyped UNKNOWN with the tier copied into gene_disease_validity (MONDO:0013960 is the disease term) and germline origin added. The evidence is the founder glycine insertion and one missense allele in consanguineous Pakistani families (PMID:21131953, PMID:30498240). The loss-of-function node (voltage-gated calcium channel activity DECREASED) is unchanged.

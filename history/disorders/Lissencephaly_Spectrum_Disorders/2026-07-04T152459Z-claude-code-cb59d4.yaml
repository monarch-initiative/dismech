  summary: DCX germline-KO vs human neocortex HUMAN_MODEL_MISMATCH
  details: |
    Added a HUMAN_MODEL_MISMATCH discussion (gap_dcx_knockout_mouse_neocortex_model_mismatch) to the DCX branch under cortical-malformation epic #4101. Captures the classic DCX human/model discordance flagged by Romero, Bahi-Buisson & Francis 2018: germline Dcx-knockout mice have a near-normal neocortex (PMID:12196578) while only acute in utero RNAi reproduces the migration/heterotopia phenotype (PMID:14625554), which itself forms in rat but not mouse (PMID:16292002), attributable to partially redundant Dclk compensation (PMID:16387639). Attaches to pathophysiology#DCX Microtubule Stabilization Failure and #Impaired Neuronal Migration; adds two proposed_experiments. All four snippets independently verified as exact substrings of fetched abstracts; schema/term/reference validation pass.

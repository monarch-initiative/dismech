  summary: Wire ARX into the pathograph via an interneuron tangential-migration node
  details: |
    Added the pathophysiology node 'ARX-Dependent Interneuron Tangential Migration Failure', which carries ARX and conforms to interneuron_specification_tangential_migration_failure#Tangential Migration Failure from Ganglionic Eminences. Before this, the ARX genetic record and the ARX-related subtype had no mechanism node. Evidence: PMID:12379852 (ARX loss of function causes XLAG), PMID:17460091 (reduced tangential migration in Arx-mutant mice), PMID:20461390 (human ARX-mutated cortex devoid of interneurons), PMID:15921244 (XLAG as a tangential migration disorder). One downstream edge goes to the existing Seizures phenotype as INDIRECT_UNKNOWN_INTERMEDIATES, citing PMID:15921244. No edge was drawn to the gyral malformation, because the literature does not establish that the interneuron deficit causes it; the node description points to the ARX-Related_Lissencephaly_and_Interneuronopathy entry for that question. The dystroglycanopathy half of the issue (POMT1, POMT2, POMGNT1) had already been wired by #12754 through the 'Neuronal Overmigration Across the Pial Boundary' node, so nothing was changed there. Validation: just validate, validate-terms, check-entity-refs and check-causal-targets pass, and 100/100 snippets verified against cached references.

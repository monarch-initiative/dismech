  summary: 'Genetics pass: six gene-defined subtypes, five pathograph nodes (d2g series-038)'
  details: |
    Genetics pass over the gene-defined MONDO subtypes of the lissencephaly spectrum (issue 12245, series-038).

    Anchor check first: the entry's disease_term MONDO:0018838 was verified against OLS. Its label matches, it is not obsolete, and it is genuinely a spectrum umbrella, which is what this entry models; no rebinding needed. Enumerating its descendants in the local MONDO build returned 43 classes besides the root, 19 of which carry an RO:0004003 causal gene edge - ten more than the nine the job listed.

    Six new has_subtypes rows, each with a verified MONDO subtype_term, HP-bound inheritance, an hgnc gene descriptor and exact-quote evidence: LIS10/CEP85L (MONDO:0030031), LIS6/KATNB1 (MONDO:0014534), LIS7/CDK5 (MONDO:0014596), LIS8/TMTC3 (MONDO:0014992), LIS9/MACF1 (MONDO:0032677), CDCBM9/CTNNA2 (MONDO:0032578). Six matching genetic records with subtype foreign keys. The X-linked/DCX row gained subtype_term MONDO:0010239; the Classic/LIS1 row gained a narrowMatch mapping to MONDO:0011830, which is narrower than the classic-lissencephaly class it binds because MONDO:0015146 also subsumes the DCX form.

    Five new pathophysiology nodes, each one claim: Pericentriolar CEP85L Deficiency, CDK5 Activation Failure at the Centrosome, Katanin p80 Deficiency in Dividing Neural Progenitors, ARP2/3 De-repression from alphaN-Catenin Loss, and Neuronal Overmigration Across the Pial Boundary (conforming to pial_basement_membrane_radial_glial_endfoot_failure#Neuronal Overmigration Across the Pial Boundary). The CEP85L node feeds the CDK5 node, which feeds the pre-existing LIS1-NUDEL-Dynein node, so the two new centrosomal genes join the classic nucleokinesis chain rather than hanging beside it. The overmigration node also picks up POMT1, POMT2 and POMGNT1, which previously reached no node at all; the genes are supported there by a genotyped fetal neuropathology series already cached for the Dystroglycanopathy entry. MACF1 and DYNC1H1 were bound to the existing Cytoskeletal and Microtubule Dysfunction node with their own evidence items; DYNC1H1 previously reached no node.

    One new phenotype, Cobblestone lissencephaly (HP:0007260, canonical label Type II lissencephaly), as the overmigration node's downstream target.

    Dispositions recorded in notes rather than as rows: PSAT1/Neu-Laxova syndrome 2 (curated in 3-Phosphoglycerate_Dehydrogenase_Deficiency), TUBA1A (own entry), LAMB1 (own entry), and Norman-Roberts syndrome, whose MONDO RELN edge derives from the OMIM merge of the clinical label with RELN-related lissencephaly with cerebellar hypoplasia; RELN is already curated under the ClinGen-curated LCH term.

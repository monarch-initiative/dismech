  summary: 'Address PR #11093 review: bind HP:0034271, retire stale imaging caveat'
  details: |
    Review round on PR #11093 (ai4c-reviewer, changes_requested). Blocking finding: the 'Copper-Beaten Skull Appearance on Skull Radiographs' imaging finding carried a sentence stating no HPO term for the sign was available at curation time, which the same PR falsified by adding HP:0034271 Copper beaten skull to the caches and binding it on a new phenotype. Bound imaging_finding_term to HP:0034271 on the imaging finding and deleted the superseded sentence; the enum-cache row in imagingfindingterm was derived by just validate-terms, not hand-placed. Also took all three optional suggestions: aligned the top-level references manifest title for PMID:39940902 to the authoritative cache spelling (TGF-beta -> TGF-β, the lone outlier against 20 in-file reference_title occurrences), and extended the two ORPHA:457395 snippets backing the Ptosis and Strabismus phenotypes from a bare noun-phrase list to a span carrying the subject ('dysmorphic craniofacial features (including microcephaly, hypertelorism, epicanthal folds, mild ptosis, strabismus, malar hypoplasia'). The reviewer's remaining suggestion asked only to confirm that the Copper Beaten Skull and Cone-Shaped Epiphyses phenotypes intentionally restate imaging_findings entries; confirmed intentional - phenotypes and imaging_findings make different claims (clinical feature vs radiographic sign), and the Cone-Shaped Epiphyses phenotype binding HP:0010579 is a real specificity gain over the pre-existing Brachydactyly HP:0001156 phenotype. No content removed. Validation: just validate passes with 109/109 snippets verified, just validate-terms passes, and all eleven ungated CI gates pass.

  summary: 'Edit: reconcile the concurrent duplicate curation of MONDO:0014748 by
    porting PR #9082''s unique content onto this entry'
  details: |
    Reconciliation of a concurrent duplicate curation of MONDO:0014748.

    Two Claude Code sessions were launched on this disease 12 seconds apart on 2026-08-20 and each produced a full entry. PR #9081 merged first, on 2026-08-20 at 09:15Z, creating this file. PR #9082 produced a second entry under the full MONDO label, Progressive_Spondyloepimetaphyseal_Dysplasia-short_Stature-short_Fourth_Metatarsals-intellectual_Disability_Syndrome.yaml. Neither duplicate preflight could have caught the collision: the #9082 preflight ran at about 07:05Z and searched origin/main, all pull requests and all issues for MONDO:0014748, RSPRY1 and Faden-Alkuraya, and #9081 did not exist until 07:58Z.

    Both the automated reviewer and the PR Shepherd independently confirmed the duplication and escalated it, since two Disease entries bound to one MONDO concept is invisible to CI - test_all_disorders_have_unique_names passes because the two name values differ, and there is no disease_term uniqueness test. The decision recorded by the repository owner was to keep this entry, under the shorter clinical Faden-Alkuraya name already merged and already referenced by history records, and to port the content unique to #9082 onto it rather than merge a second entry or discard the work. #9082 is closed.

    Ported onto this entry: a mappings block with the skos:exactMatch to MONDO:0014748 sourced to ORPHA:457395; a complete top-level references manifest covering all nine cited sources, including the three this entry already cited that the #9082 manifest did not know about (PMID:26497270, PMID:27230627, PMID:33092958); a variants section with the three curated RSPRY1 alleles c.377delT, c.516+2T>A and c.1652G>A p.(Cys551Tyr), the last carrying CADD, M-CAP, REVEL and AlphaMissense scores and a ClinVar SCV; a Harrison's classification with ORPHA-backed evidence, alongside the ISDS group this entry already carried; NCIT diagnosis terms on both diagnosis entries, NCIT:C38092 Skeletal Survey X-Ray and NCIT:C101295 Whole Exome Sequencing, chosen over the broader NCIT:C38101 because NCIT has a term for exactly that procedure; two treatments, anti-seizure pharmacotherapy with a CHEBI-bound levetiracetam agent and ophthalmologic correction; two discussions, a CONTROVERSY on whether RSPRY1 is secreted or cytoplasmic that carries paired SUPPORT and REFUTE evidence from PMID:39940902 and PMID:38562122, and a KNOWLEDGE_GAP on the absence of any animal model reproducing the dysplasia; and ten phenotypes.

    Deliberately not ported: the five #9082 discussions whose subject matter this entry already covered under different identifiers, the phenotypes whose HPO terms were already present or were less specific than this entry's (severe short stature against postnatal short stature, hyperlordosis against lumbar hyperlordosis), and the #9082 pathophysiology chain, which is a six-node restatement of the seven-node chain already here. The aim was to add what was missing, not to churn curation that was already sound.

    Two caveats in this entry's own notes were resolved rather than left standing, because the port contradicts them. The notes had recorded that an Orphanet structured record for ORPHA:457395 could not be built because the upstream bulk XML no longer matched the pinned checksum; it was in fact built during the #9082 session with just refresh-orphadata followed by just structured-rebuild-orphanet --id 457395, and data/orphadata/MANIFEST.yaml is unchanged, so there is no snapshot drift and the wider ORPHA cache was not rewritten. references_cache/ORPHA_457395.md is added by this change. The notes had also recorded that microcephaly, seizures, hypotonia and corpus-callosum thinning were omitted for want of a quotable passage; all four now have citable sources, three from the ORPHA structured record and the seizures from PMID:38562122. The head-size tension is preserved rather than flattened: the microcephaly phenotype carries the ORPHA statement as SUPPORT and the delineation series' normocephaly statement as REFUTE, with no frequency band asserted.

    The two deep-research reports from the #9082 session are added under research/ with their original query-derived filenames. They are the provenance for the ported variants and discussions. Both carry authentic provider frontmatter with linkml-reference-validator blocks (claude_code 6/6 references resolved, 2/2 quotes valid; openscientist 6/6 resolved, 10/11 quotes valid), and both passed the NEC preflight against MONDO:0014748 - claude_code PASS, openscientist WARN triggered only by SMAD3 mention counts, SMAD3 being the mechanistic partner rather than a rival disease entity.

    The #9082 history records were never merged to main, so nothing needed retargeting and no superseded_by block applies; this record is the surviving provenance for that work.

    Known gap worth its own issue, flagged by both the reviewer and the PR Shepherd: there is no test asserting one Disease entry per disease_term, which is why this duplication reached review rather than CI. Not addressed here, since this change is content reconciliation only.

    Validation: just validate passes for schema and terms; just count-verified-snippets reports 109/109 verified against cached references, up from the pre-port count. The full CI gate set was run - check_snippet_length, check_title_snippets, check_folded_hyphens, check_environmental_evidence, check_duplicate_yaml_keys over 4361 files, dismech-stubs check, term_cache_integrity, enum cache ordering and check-reference-cache-frontmatter all pass. Compliance is 92.8% global and 93.1% weighted. Cache additions are three rows: HP:0002651, HP:0034271 and NCIT:C38092.

    Curation was AI-assisted via claude-code; the model identifier is deliberately omitted from this record per the operating instructions for this session.

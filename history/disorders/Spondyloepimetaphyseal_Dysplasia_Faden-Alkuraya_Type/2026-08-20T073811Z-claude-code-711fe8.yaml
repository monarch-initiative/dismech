  summary: 'Create: Spondyloepimetaphyseal Dysplasia Faden-Alkuraya Type (RSPRY1)'
  details: |
    New Mendelian entry for SEMDFA (MONDO:0014748, OMIM #616723, RSPRY1 / hgnc:29420), curated from primary literature plus a claude_code deep-research report.

    Deep-research providers: falcon was attempted first (the /curate default) and failed with HTTP 402 Payment Required from the Edison Scientific API, so no falcon report exists. claude_code was used instead and produced research/Spondyloepimetaphyseal_Dysplasia_Faden-Alkuraya_Type-deep-research-claude_code.md (14 web searches, 27 turns; its own reference-validation block reports 6/6 references resolved, 0 unresolved, 1/1 quoted claim valid, 6/6 on topic, needs_review not set). An openscientist run was submitted in parallel and was still queued server-side when this session finished; if it lands it can be folded in as a follow-up EDIT.

    NEC preflight: "just preflight-dr <report> MONDO:0014748" returns WARN, reviewed and judged benign. RSPRY1 dominates the report (53 mentions vs SMAD3 14); SMAD3 is the curated downstream effector of RSPRY1 loss, not a rival disease entity. The OMIM IDs the tool flagged as disagreeing with the MONDO xref (184250, 300106, 602271, 603546) all appear inside the report's differential-diagnosis section, and the report names OMIM #616723 as the disease's own identifier.

    GeneReviews: PubMed was searched for a GeneReviews chapter on RSPRY1 / SEMDFA; none exists, so no GeneReviews baseline applies.

    Content: a seven-node pathophysiology chain from biallelic RSPRY1 loss of function through constitutive TGF-beta/SMAD3 activation and disordered ECM dynamics to impaired endochondral ossification, progressive skeletal deformity, and a conditional craniosynostosis branch. The fibroblast-to-bone step is curated as INDIRECT_UNKNOWN_INTERMEDIATES because all functional data come from dermal fibroblasts. 31 phenotypes, 3 imaging findings, 3 progression phases, 2 diagnosis entries, 3 differential diagnoses, 3 treatments, 2 experimental models with modeled_mechanisms and readouts, and 4 discussions (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH, 1 EMERGING_HYPOTHESIS).

    Deliberate restraint: no GO molecular-function binding on the RSPRY1 node, because E3 ligase activity is inferred from domain architecture and interaction databases and has never been demonstrated. Frequency bands are given only where a snippet quantifies (5/5 or 2/2 patients); bands were withheld for small epiphyses, metaphyseal cupping, scoliosis, craniosynostosis, and every single-patient finding. Reported microcephaly, seizures, hypotonia, and corpus-callosum thinning were dropped because they could not be traced to a quotable passage in a cached primary reference, and the 2018 series states most patients were normocephalic. TGF-beta-directed therapy is recorded as an EMERGING_HYPOTHESIS discussion rather than as a treatment.

    An Orphanet structured record for ORPHA:457395 could not be built: the upstream Orphadata en_product1.xml no longer matches the sha256 pinned in data/orphadata/MANIFEST.yaml, and bumping that pin would rewrite the entire ORPHA cache. This is recorded in the entry notes as a separate maintenance task.

    Validation: "just validate" passes (schema + terms + references). "just count-verified-snippets" reports 85/85 verified against cached references. "just validate-disorders" (the batched CI-equivalent sweep, --no-full-text) passes. "just check-duplicate-keys" and "just check-title-snippets" pass. The stubs/ entry for MONDO:0014748 was deleted and "just check-stubs" passes.

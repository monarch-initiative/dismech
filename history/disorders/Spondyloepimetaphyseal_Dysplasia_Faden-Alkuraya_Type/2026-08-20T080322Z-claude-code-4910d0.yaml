  details: |
    Follow-up EDIT folding in the openscientist deep-research report, which was still queued server-side when the CREATE record was written and landed afterwards (research/Spondyloepimetaphyseal_Dysplasia_Faden-Alkuraya_Type-deep-research-openscientist.md, 28 minutes, 5 autonomous iterations, 2 artifacts).

    Report validation as generated: 14/14 references resolved, 0 unresolved, 1/1 quoted claim valid; needs_review is true solely because 1 of 14 references (PMID:33989636, a TRIM7 B30.2 crystal-structure paper) was flagged as possibly off topic. That reference is not used here. NEC preflight on this report is WARN for the same benign reason as the claude_code one (SMAD3, the curated downstream effector, is the flagged rival gene); its OMIM check is a clean match, 616723 against the MONDO xref 616723.

    What was added, each independently verified against a freshly cached primary reference rather than taken from the report:

    1. PMID:33092958 (TRIM/TRIM-like substrate recognition) added as PARTIAL/OTHER evidence to the rspry1_biochemical_function KNOWLEDGE_GAP. It supplies the structural argument for the E3-ligase hypothesis - PRY-SPRY is the domain most often used for substrate recognition in this family - and the explanation states plainly that this is domain analogy, not evidence about RSPRY1.

    2. New OPEN_QUESTION discussion contiguous_gene_deletion_haploinsufficiency, citing PMID:27230627, a 16q12.2q21 interstitial-deletion patient whose authors proposed that loss of RSPRY1 might explain the skeletal defects. Recorded as an open question rather than as a genetic entry or modifier: SEMDFA is recessive and every reported patient is homozygous, so a single-copy contribution would be a dosage claim resting on one deletion patient's candidate-gene inference. The snippet reproduces the source's wording verbatim including its grammatical slip ("was been discovered"), and the explanation says so. This corrects an earlier judgement in the CREATE session, where PMID:27230627 was set aside as probably irrelevant on the strength of its title alone.

    3. proposed_experiments added to two existing discussions - bone-lineage validation of the TGF-beta/SMAD3 mechanism in patient iPSC-derived chondrocytes/osteoblasts and skeletal phenotyping of an Rspry1-null mouse on the fibroblast_proxy_for_bone_lineage HUMAN_MODEL_MISMATCH; interactome/ubiquitination assays and endogenous-localization resolution on the rspry1_biochemical_function KNOWLEDGE_GAP. Each carries a decision_criterion stating what would and would not resolve the gap.

    Not taken from the report: its ClinVar variant table and gnomAD constraint metrics (pLI, LOEUF, o/e). Both are real and useful, but neither is quotable against a cached reference, so importing them would have put unverifiable numbers into the entry.

    Corroboration rather than new content: the report's own limitations section independently reaches all four gaps already curated in the CREATE commit - tiny evidence base, mechanism from a single fibroblast study, untested biochemical link, no animal model, no therapeutics.

    Validation: "just validate" passes (schema + terms + references); 88/88 snippets verified against cached references, up from 86.

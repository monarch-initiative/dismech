  summary: 'Review round: hypercalciuria, nephrocalcinosis REFUTE, gene exclusion,
    treatments, infantile hypotonia, progressive hearing loss'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #11029. All findings came from unmined content in references_cache/PMID_27811305.md, the PR's only full_text_xml cache; each quote was checked against that file before use.

    1. Hypercalciuria added (HP:0002150, temporality RECURRENT), wired from the cell-cycle node and carrying a sequelae edge to Nephrocalcinosis typed INDIRECT_UNKNOWN_INTERMEDIATES. The edge description states plainly that it is a candidate route and not a demonstrated one: proband II(1) had nephrocalcinosis on newborn ultrasound and documented hypercalciuria only at age 4, and II(2) had nephrocalcinosis with no hypercalciuria reported. The pre-existing direct edge to Nephrocalcinosis is deliberately kept in parallel for that reason. Attribution checked: the hypercalciuria is documented in II(1) only, and the parenthesis in the 'may be entirely incidental' sentence attaches to the cataracts, not to the hypercalciuria.

    2. REFUTE evidence item added on Nephrocalcinosis quoting the authors' incidental caveat. The explanation records that the sentence's own premise - that these findings were unique to that study - is superseded by the 2026 second missense case already cited on the same phenotype.

    3. The 12-of-14 gene exclusion added as a SUPPORT/INDIRECT item on Nephrocalcinosis, with the authors' own coverage caveat about PTH and CLDN14 in the explanation.

    4. Treatments block added (hearing aid usage, cleft palate repair bound to NCIT:C168380 Palatorrhaphy, and the Pavlik harness), all joining the pathograph through target_phenotypes. target_mechanisms is deliberately not used: the schema's comment on that slot says targets should be pathophysiology node names, and none of these acts on a mechanism node. The falsified notes sentence claiming no source described an intervention is rewritten to say what was wrong and what remains true.

    5. Infantile Hypotonia added, bound to HP:0001252 (Hypotonia) with preferred_term and a NEONATAL onset descriptor rather than to HP:0008947 as the review suggested. HP:0008947's canonical HPO label is 'Floppy infant', not an infantile-hypotonia term, and the source describes hypotonia with poor feeding that later improved - a different claim. Recorded in the phenotype notes. Sensorineural Hearing Impairment given clinical_course PROGRESSIVE and a CHILDHOOD onset descriptor with two new evidence items; the Audiometry diagnosis entry now carries the surveillance point and its supporting quote.

    6. The mechanism_confidence prose/value mismatch fixed (LOW to HYPOTHETICAL). Suggestion 8 taken up: the proteasomal-degradation interpretation added as IN_VITRO/INDIRECT evidence on the Loss of Nuclear AMMECR1 Function node rather than as a new node, since the source hedges it throughout and no degradation assay was performed.

    Validation: just validate, validate-terms, count-verified-snippets (56/56, none skipped by prefix), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, whole-KB check-title-snippets / check-snippet-length / check-snippet-grading, and validate-disorders all pass. No dangling pathograph targets and no orphan phenotypes; all three treatment target_phenotypes descriptors resolve to their phenotype nodes.

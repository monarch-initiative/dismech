  summary: 'Create: Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis
    (AMMECR1)'
  details: |
    De-novo curation of MFHIEN/MHEN (MONDO:0010516), AMMECR1. This is the AMMECR1-attributable residue of the AMME contiguous-gene deletion syndrome: COL4A5 accounts for the Alport component and AMMECR1 for the rest, confirmed from both directions by point mutations and by COL4A5-sparing microdeletions. Four-node pathograph: AMMECR1 loss of function, loss of nuclear AMMECR1 function, a hypothetical cell-cycle-associated developmental node, and a separate erythrocyte node; nine wired phenotypes. Eight PMIDs, 37/37 snippets verified against the local cache, no DOI-only citations. No phenotype carries a frequency band, deliberately: the published experience is about a dozen affected males across six differently ascertained reports with no common denominator, so each phenotype instead lists in notes which reports observed it. The mechanism is genuinely unknown and the entry says so structurally rather than in prose only - the two speculative nodes carry mechanism_confidence: HYPOTHETICAL, and every edge out of them is typed INDIRECT_UNKNOWN_INTERMEDIATES. Two findings preserved that would otherwise be lost: the 1998 ektacytometry result showing the elliptocytosis is not a membrane-skeleton defect, which rules out the obvious mechanism and is curated as its own node; and the fetal cochlear immunohistochemistry placing AMMECR1 in the affected tissue, graded IN_VITRO and INDIRECT because expression is not mechanism. A REFUTE item records that elliptocytosis is not obligate despite being in the disease name. Female carriers are given their own Inheritance block bound to HP:0001417 rather than being folded into the recessive one, because all three examined carriers had hearing loss. Zebrafish morphant curated with fidelity LOW and limitations naming the reason a fish cannot test the defining phenotype. Three discussions record the open questions.

  summary: 'Create: Oculomotor Nerve Palsy (MONDO:0001309)'
  details: |
    De-novo curation of oculomotor nerve palsy (MONDO:0001309) for issue #8956. Modelled as an aetiologically heterogeneous syndrome converging on one motor and one autonomic deficit, with five has_subtypes: Microvascular, Compressive, Traumatic, Congenital, and RPON.

    The mechanistic core is the somatotopic segregation of the nerve's two fibre populations, curated as real pathophysiology nodes rather than asserted in prose. A "Somatotopic Segregation of Pupillomotor and Somatic Motor Fibres" node is evidenced on the superficial peripheral position of the preganglionic parasympathetic fibres and the deeper position of the somatic motor fibres (PMID:30252368, PMID:36116851). It feeds an extrinsic-compression arm and an endoneurial-ischaemia arm, which terminate in the paired "Superficial Pupillomotor Fibre Injury" (pupil-involving) and "Preserved Superficial Pupillomotor Function" (pupil-sparing) nodes. Pupil sparing is curated as a positive mechanistic state, not as the absence of a finding.

    Eleven pathophysiology nodes in total, also covering transtentorial herniation compressing CN III, traumatic stretch at fixed tether points, congenital nerve hypoplasia/aplasia, RPON focal blood-nerve-barrier breakdown, and aberrant regeneration (which manufactures apparent pupil sparing).

    A CONTROVERSY discussion records the documented failure modes of the pupil rule in both directions: only 2 percent of aneurysmal palsies spare the pupil, but 53 percent of diabetic microvascular palsies in a 1400-patient inpatient series did involve it, and pupillary signs carry no localizing value in children. An EMERGING_HYPOTHESIS discussion records the proposed diffuse-versus-focal pattern of extraocular muscle paresis as a candidate second discriminator, explicitly flagged unvalidated by its own authors. A KNOWLEDGE_GAP discussion records that no mechanism for RPON is established.

    Deep research: falcon, run 2026-08-20 (research/Oculomotor_Nerve_Palsy-deep-research-falcon.md). "just preflight-dr" returned SKIP, as expected for an acquired syndrome for which MONDO records no causal gene, so the manual CLAUDE.md section 2b NEC checks were performed instead (runoak MONDO record: no causal gene, no OMIM xref, no competing eponymic synonym; the report explicitly names MONDO:0001309 and the correct entity). The report was judged NOT a named-entity confusion, but its top gene mentions (TUBB3, KIF21A, TUBA1A, PHOX2A, CHN1) revealed a scope drift into congenital cranial dysinnervation disorders / CFEOM. That material was deliberately excluded and the boundary recorded as a RESOLVED INTERPRETATION discussion, anchored on the exclusion criterion stated by the entry's own anchoring cohort (PMID:38411317). The report was used as leads only; every PMID and snippet was independently fetched with "just fetch-reference" and verified against the local reference cache.

    Cross-referencing rather than duplication: Intracranial_Berry_Aneurysm already carries oculomotor nerve palsy as a phenotype of the aneurysm, and Bells_Palsy is the analogous single-cranial-nerve entry for CN VII; both are named in notes and neither is duplicated.


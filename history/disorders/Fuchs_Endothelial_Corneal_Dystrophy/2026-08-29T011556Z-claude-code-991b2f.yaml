    ## Findings fixed

    1. **Finding 1 (PMID:33724294 scope sentence graded HUMAN_CLINICAL)** — regraded to `OTHER` on the
       *Oxidative and Mitochondrial Stress* node; explanation records that the quoted sentence is the
       review's scope statement over mixed cell/animal/human evidence. This also removes the
       internal inconsistency with the paper's other (already-`OTHER`) item.

    2. **Finding 2 (generic mitochondrial-biology sentence carrying the apoptosis edge)** — replaced
       the second PMID:33724294 item (textbook mitochondria background) with the FECD-specific
       sentence the review identified in the already-cited PMID:34130750 full-text cache:
       "when the increase of ROS level exceeds a certain threshold, mitochondria will release the
       mitochondrial cytochrome c, which can activate the apoptosis of CECs by caspase-9 and
       caspase-3" (`supports: SUPPORT`, `evidence_source: OTHER` as a review-level mechanistic
       synthesis; sentence not used elsewhere in the file, so no grading divergence).

    3. **Finding 3 (PURPOSE belief statement as lead UPR evidence, graded HUMAN_CLINICAL)** — swapped
       the PMID:28727885 snippet to a RESULTS finding from the same cache ("Aggresome formation was
       higher in iFECD than in iHCEC and was colocalized with type 1 collagen, fibronectin, and
       agrin.") and graded it `IN_VITRO` (iFECD/iHCEC cell lines), fixing both the
       hypothesis-as-finding quote and the misgrade in one move. The node's second item
       (GRP78/IRE1/PERK/CHOP, IN_VITRO) is untouched.

    4. **Finding 4 (table-of-contents sentence on the apoptosis node)** — requoted the second
       PMID:34130750 item to the substantive flatmount finding ("Analysis of endothelium flatmounts
       showed apoptotic CECs in the FECD group, and the control group showed no apoptotic cells.");
       kept `HUMAN_CLINICAL` (human FECD endothelium specimens); explanation notes the adjacent
       TUNEL result in the same passage.

    5. **Finding 5 (TGF-beta/EMT patient-cultured-cell sentence graded HUMAN_CLINICAL)** — regraded
       to `IN_VITRO` (the reviewed experiment is TGF-beta stimulation of cultured patient-derived
       CECs); explanation extended accordingly. Its companion item was already IN_VITRO, so the node
       no longer feigns human-clinical corroboration.

    6. **Finding 6 (normal-physiology definition graded HUMAN_CLINICAL on the barrier node)** —
       regraded the PMID:25593321 deturgescence-definition item to `OTHER`; explanation records that
       the disease claim is carried by the node's second (PMID:34130750) item.

    7. **Finding 7 (diagnosis explanation asserts corneal thickness not in snippet)** — explanation
       rewritten to name only what the quoted sentence supports: endothelial-cell density, guttae
       burden, and endothelial (Na+/K+ ATPase) pump function.

    8. **Finding 8 (early-onset subtype claim outside its snippet)** — added a second PMID:34130750
       evidence item on the Early-onset FECD subtype quoting the adjacent cached sentence
       ("Early-onset FECD, ascribed to mutations in the collagen type VIII alpha 2 chain ... usually
       begins in the first decade of life."). The bracketed "(COL8A2, MIM 12052) [8]" span had to be
       elided with an ellipsis: the validator strips bracketed spans from snippets before matching,
       so the full verbatim sentence fails as a single substring; the two-part quote verifies.

    9. **Finding 9 (clinical_trials status unverifiable from cache)** — left `status: COMPLETED` on
       both trials and added `notes:` to each recording that the status reflects the
       ClinicalTrials.gov registry at curation time and is not in the cached record. Did not re-fetch
       the trial caches (regeneration risks invalidating the two already-verified snippets). For
       NCT02653391, did **not** add a `phase:` field: `ClinicalTrialPhaseEnum` has no combined
       Phase 1/2 value (PHASE_I..PHASE_IV, NOT_APPLICABLE), so any single value would misstate a
       Phase 1/2 trial; the entry's note records this.


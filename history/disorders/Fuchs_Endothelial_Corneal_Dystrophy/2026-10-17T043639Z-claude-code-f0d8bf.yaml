  summary: Remove GO:0001837 from an endothelial-substrate node
  details: |
    Removed the GO:0001837 epithelial to mesenchymal transition binding from a pathophysiology node whose only annotated cell type is an endothelial cell, in the corneal endothelium. GO:0001837 asserts an epithelial substrate, so the binding contradicted the node's own cell annotation. It was not rebound: GO carries no general endothelial-to-mesenchymal transition term: searching GO for "EndMT", "EndoMT", "endothelial mesenchymal", "endothelial to mesenchymal transition" and "endothelial cell to mesenchymal cell transition" returns only GO:0140074 cardiac endothelial to mesenchymal transition and its three regulation terms (GO:0061999, GO:0062000, GO:0062001), all scoped to cardiac endothelium. Binding GO:0140074 here would assert the wrong anatomy. The node now carries no biological_processes annotation, following the precedent of the Endocardial fibroelastosis node in Hypoplastic_Left_Heart_Syndrome: the node name and description still say the process is EndMT. The node's notes field records the searches so a later curator does not repeat them.

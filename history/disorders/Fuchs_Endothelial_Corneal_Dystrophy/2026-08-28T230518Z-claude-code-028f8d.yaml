    # Review: Fuchs Endothelial Corneal Dystrophy

    - **File:** `/home/user/dismech/kb/disorders/Fuchs_Endothelial_Corneal_Dystrophy.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `dismech.reference_snippet_audit` — **58/58 snippets verified** against cached references. No unverified snippets.

    ## Verdict: MINOR_ISSUES

    No fabricated snippet, no wrong-gene/wrong-disease confusion, and no case-report-to-general-claim overreach was found. Every mechanistic node traces to FECD-specific human corneal-endothelium work (Du 2015, Wieben 2017, Okumura 2017, Liu 2021) or to the Orphanet record. The issues below are all snippet-selection and `evidence_source` classification problems, plus a small number of node descriptions whose supporting sentence sits next to, rather than inside, the quoted text.

    ## Findings

    ### 1. MINOR — Review-article evidence graded `HUMAN_CLINICAL` where the reviewed evidence is animal/cell-culture
    **Location:** `pathophysiology` → *Oxidative and Mitochondrial Stress* → `PMID:33724294` (Skeie 2021, "Mitophagy: An Emerging Target in Ocular Pathology").
    **Entry claims:** `evidence_source: HUMAN_CLINICAL`, snippet "Furthermore, this article reviews investigations of ocular diseases with impaired mitophagy, including Fuchs endothelial corneal dystrophy…".
    **What the paper says:** the same abstract states "The results of various studies using **cell culture, animal, and human tissue models** are presented". The sentence quoted is the review's scope statement, not a human clinical observation.
    **Why it matters:** `evidence_source` classifies the evidence type in the cited publication. `OTHER` is the correct grade for a mixed-evidence review's scope statement — and the entry itself grades a *second* snippet from this same paper as `OTHER`, so the file is internally inconsistent about the same reference. (Not a `check-snippet-grading` violation, since the two grades sit on different sentences.)

    ### 2. MINOR — Generic mitochondrial-biology sentence used as mechanistic support for an FECD-specific edge
    **Location:** `pathophysiology` → *Oxidative and Mitochondrial Stress* → `PMID:33724294`, second item (`evidence_source: OTHER`).
    **Entry claims:** explanation — "This supports the mechanistic bridge from mitochondrial dysfunction to apoptosis."
    **What the paper says:** "mitochondria provide energy through the generation of adenosine triphosphate (ATP), regulate cellular metabolism, provide redox balancing, participate in immune signaling, and can initiate apoptosis." This is textbook background about mitochondria in general, with no FECD content.
    **Why it matters:** the node's downstream edge to *Corneal Endothelial Apoptosis* is carried by a claim that is true of all cells. A far better FECD-specific sentence exists in an already-cited source (`PMID:34130750`: "when the increase of ROS level exceeds a certain threshold, mitochondria will release the mitochondrial cytochrome c, which can activate the apoptosis of CECs by caspase-9 and caspase-3").

    ### 3. MINOR — Belief/purpose statement used as the primary evidence for the ER-stress node, graded `HUMAN_CLINICAL`
    **Location:** `pathophysiology` → *ER Stress and Unfolded Protein Response Activation* → `PMID:28727885`, first item.
    **Entry claims:** `supports: SUPPORT`, `evidence_source: HUMAN_CLINICAL`, snippet "The unfolded protein response (UPR) is believed to play a role in the pathogenesis of Fuchs' endothelial corneal dystrophy (FECD)."
    **What the paper says:** that sentence is the opening line of the PURPOSE section — it states a prior belief that motivated the study, not a result. The paper's actual data are immortalized cell lines (iFECD vs iHCEC) plus immunostaining of surgical Descemet membranes; the entry's *second* item from this paper is correctly graded `IN_VITRO`.
    **Why it matters:** a hypothesis-framing sentence is not a finding, and `HUMAN_CLINICAL` misdescribes an in vitro study. The node is nonetheless well supported by the second (correctly graded) item, so this is a snippet/grade swap, not a substantive gap.

    ### 4. MINOR — Review scope sentence ("mechanisms … were then explored") used as evidence that apoptosis occurs in FECD
    **Location:** `pathophysiology` → *Corneal Endothelial Apoptosis* → `PMID:34130750`, second item.
    **Entry claims:** explanation — "The review identifies apoptosis among reported FECD molecular mechanisms."
    **What the paper says:** the quoted sentence is the review's MAIN TEXT roadmap ("The molecular mechanisms associated with FECD, such as … apoptosis pathway … were then explored"). The review's substantive apoptosis evidence is elsewhere and much stronger ("Analysis of endothelium flatmounts showed apoptotic CECs in the FECD group, and the control group showed no apoptotic cells"; "Eleven of the 14 corneas with FECD showed positive TUNEL labelling").
    **Why it matters:** a table-of-contents sentence is close to the "title used as a finding" defect the repo's `check-title-snippets` guards against; a directly propositional quote is available in the same cache file.

    ### 5. MINOR — TGF-beta/EMT evidence from patient corneal endothelial cells graded `HUMAN_CLINICAL`
    **Location:** `pathophysiology` → *TGF-beta-Driven Endothelial-Mesenchymal Transition* → `PMID:34130750`, first item.
    **Entry claims:** `evidence_source: HUMAN_CLINICAL`, snippet "The up-regulation of EMT-related genes ZEB1 and SNAI1 by TGF-β in CECs in FECD patients was associated with the deposition of ECM proteins".
    **What the paper says:** this is the review restating its reference [88], a cell-based TGF-β stimulation experiment on patient-derived corneal endothelial cells (the same paragraph continues "the TGF-βR1 inhibitor (SB431542) suppressed the expression of ZEB1 and SNAI1" — an in vitro pharmacological manipulation).
    **Why it matters:** per repo rules, cultured patient cells are `IN_VITRO`, not `HUMAN_CLINICAL`. The entry's second item on this node is correctly `IN_VITRO`, which makes the pair read as if one claim were human-clinical corroboration of an in vitro result when both derive from cell-based work.

    ### 6. MINOR — Physiology-definition snippet graded `HUMAN_CLINICAL` on the barrier-dysfunction node
    **Location:** `pathophysiology` → *Corneal Endothelial Barrier Dysfunction* → `PMID:25593321`, first item.
    **Entry claims:** `evidence_source: HUMAN_CLINICAL`; snippet defines the normal corneal endothelium ("a non-regenerative cell monolayer … responsible for the maintenance of corneal clarity by continual deturgescence").
    **What the paper says:** the sentence describes normal anatomy/physiology, not an FECD observation. The entry's explanation is honest about this ("defines the corneal endothelial function that is lost"), and the *second* item on the node (`PMID:34130750`, impaired stromal dehydration → bullae and vision loss) carries the disease claim.
    **Why it matters:** background physiology is `OTHER`; grading it `HUMAN_CLINICAL` inflates the apparent human-clinical support for the node.

    ### 7. MINOR — Diagnosis explanation asserts an assessment metric (corneal thickness) absent from its snippet
    **Location:** `diagnosis` → *Endothelial cell and corneal edema assessment* → `PMID:32735996`, first item.
    **Entry claims:** explanation — "The review supports endothelial density, guttae burden, **and corneal thickness** as FECD assessment metrics."
    **What the paper says:** the quoted sentence names only "anatomical variables that reflect the density of endothelial cells and guttae, and functional variables that relate to Na+/K+ ATPase pump function". Corneal thickness is not in it (the node's next item, on Scheimpflug staging of edema, is the closer support).
    **Why it matters:** small explanation/snippet mismatch; the node's overall claim is sound.

    ### 8. MINOR — Early-onset subtype claim partly outside its snippet
    **Location:** `has_subtypes` → *Early-onset FECD* → `PMID:34130750`.
    **Entry claims:** description — early-onset FECD "beginning in the first decade of life and **commonly associated with COL8A2 variants**".
    **What the paper says:** the quoted snippet covers only the two-type classification. The COL8A2 and first-decade claims are in the *next* sentence of the same cached paragraph ("Early-onset FECD, ascribed to mutations in the collagen type VIII alpha 2 chain (COL8A2 …), usually begins in the first decade of life").
    **Why it matters:** the claim is true and in the cited cache; only the quote boundary is short.

    ### 9. MINOR — Clinical-trial `status:` values are not verifiable from the cached records
    **Location:** `clinical_trials` → `NCT04057053`, `NCT02653391` (both `status: COMPLETED`).
    **What the cache holds:** `references_cache/clinicaltrials_NCT04057053.md` and `…NCT02653391.md` contain only the brief summary text; neither records a recruitment status.
    **Why it matters:** the snippets themselves are exact and on-point (both verified), but the `status` metadata rests on no cached source and cannot be re-checked offline. `NCT02653391` also carries no `phase:` field although its description states Phase 1/2.

    ### 10. INFORMATIONAL — `Corneal Edema` phenotype is bound to the generic HP:0000969 *Edema*
    **Location:** `phenotypes` → *Corneal Edema*.
    This mirrors the Orphanet HPO row exactly (`HP:0000969 | Edema | Very frequent (99-80%)`) and the entry is transparent about it in both `preferred_term` and the explanation ("Orphanet lists edema as very frequent in FECD; the disease definition specifies corneal edema"). Recorded as an observation only — the binding faithfully reflects the cited source, and per the review calibration this is not an evidence-fidelity defect.

    ### 11. INFORMATIONAL — Good practice worth preserving
    Two curation decisions in this entry are exemplary and should not be "corrected":
    - *Nyctalopia* carries an explicit caveat that Orphanet lists it while primary FECD literature emphasizes glare/contrast loss — the phenotype is retained as an Orphanet assertion rather than laundered into a general claim.
    - *Eye Movement-Induced Pain* grades `PMID:34130750` as `PARTIAL` with the explanation stating precisely what the paper does and does not cover ("supports corneal pain from epithelial bullae, though not specifically pain induced by eye movement"). This is the right use of `PARTIAL`.

    ## Coverage

    - **Total evidence items in file:** 58 (each carries exactly one snippet; the audit's 58/58 count equals the evidence-item count).
    - **Examined:** 58 / 58 — every evidence item in `has_subtypes`, `inheritance`, `prevalence`, `progression`, `pathophysiology` (node-level and edge-level), `phenotypes`, `genetic`, `diagnosis`, `treatments`, and `clinical_trials` was read against its cached reference.
    - **References resolved from cache:** `ORPHA:98974`, `PMID:25593321` (full text), `PMID:26937169`, `PMID:28118661`, `PMID:28727885`, `PMID:31414054`, `PMID:32735996` (full text), `PMID:32965936`, `PMID:33724294`, `PMID:34130750` (full text), `PMID:39946654`, `PMID:42018070`, `clinicaltrials:NCT04057053`, `clinicaltrials:NCT02653391`. All present; none missing.
    - **Not in cache (and not required to be):** the `datasets[].publication` PMIDs `29966009`, `41298634`, `31705138` have no `references_cache` entries. These are dataset provenance links on bulk-generated `datasets:` records that deliberately carry no `evidence:` block, so no snippet verification applies. Flagged only so a future curator does not mistake them for verified evidence.
    - **No PubMed lookups were needed** — every doubtful claim was resolvable from the cached full text or abstract.

    ## Sections reviewed

    `description`, `disease_term`, `synonyms`, `parents`, `has_subtypes`, `notes`, `inheritance`, `prevalence`, `progression`, `pathophysiology` (9 nodes + all `downstream` edges), `phenotypes` (9), `genetic` (5), `diagnosis` (3), `treatments` (2, incl. `target_mechanisms`), `clinical_trials` (2), `references`, `datasets` (4).

    ## Cross-cutting checks (Step 4)

    - **Descriptions asserting uncited facts:** none material. The top-level `description`, the `notes` block (ORPHA cross-references and inheritance categories), and each node description trace to `ORPHA:98974`, `PMID:34130750`, or `PMID:25593321`. Findings 2, 7 and 8 are quote-boundary issues, not unsourced assertions.
    - **Model-organism or in-vitro evidence as sole support for a human phenotype:** none. The entry cites no animal evidence at all; every `phenotypes[]` item is supported by the Orphanet HPO table and/or human clinical review text. The two `IN_VITRO` items (`PMID:28727885` iFECD, `PMID:34130750` menadione EMT model) both sit on `pathophysiology` nodes alongside human-derived evidence, never alone on a phenotype.
    - **Same sentence graded with different `evidence_source` values:** none detected. `PMID:33724294` and `PMID:28727885` each appear twice with different grades, but on *different* quoted sentences, which the repo explicitly permits.
    - **Named Entity Confusion:** none. Every claim is FECD-specific; the TCF4 repeat-expansion material is carefully kept distinct from the myotonic dystrophy type 1 comparison that the source papers draw, and no DM1 finding is imported as an FECD finding.

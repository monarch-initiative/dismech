  summary: 'Genetics pass: FECD1-8 subtypes, COL8A2/SLC4A11/AGBL1 mechanism nodes'
  details: |
    Recovers the Fuchs_Endothelial_Corneal_Dystrophy work deferred by PR #12902 (tracked on #12931). Added eight has_subtypes rows bound to the MONDO children of MONDO:0005321 (FECD1 COL8A2, FECD2 13p locus, FECD3 TCF4, FECD4 SLC4A11, FECD5 5q locus, FECD6 ZEB1, FECD7 9p locus, FECD8 AGBL1), kept the onset-axis rows, and put COL8A2 on the early-onset row. Each genetic record now carries a reciprocal subtype key. COL8A2, SLC4A11 and AGBL1, previously unwired, each gained a mechanism node with a GO molecular function; COL8A2 feeds the existing UPR node (Col8a2 knock-in mice) and SLC4A11 feeds the oxidative-stress node (Slc4a11 knockout mice, graded INDIRECT). AGBL1 is typed DISPUTED with REFUTE evidence from a 2023 systematic review and a 2025 carrier study, and its node has no downstream edge. The same review's finding that no ZEB1 variant is pathogenic for FECD is recorded as REFUTE evidence on the ZEB1 record without changing its typing. Validated with just validate, count-verified-snippets (88/88) and the offline KB gates.

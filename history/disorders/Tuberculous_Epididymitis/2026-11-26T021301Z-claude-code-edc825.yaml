  details: |
    New entry for tuberculous epididymitis (MONDO:0001537), curated from the stub stubs/Tuberculous_Epididymitis.yaml, which this change deletes. Lump/split: curated as its own focal TB entry, following the Meningeal_Tuberculosis precedent; tuberculous epididymo-orchitis is included because the testis is involved only by extension from the epididymis. M. bovis BCG epididymo-orchitis after intravesical BCG is kept in the same entry (agent, transmission route and environmental exposure) rather than as a subtype, with the reasoning in review_notes. Leads came from research/Tuberculous_Epididymitis-deep-research-claude_code.md (claude_code provider, committed with its citations sidecar) and from PubMed E-utilities searches; every snippet was checked against references cached with just fetch-reference. The clinical literature is mostly single-centre case series (34 to 81 patients) and narrative reviews, so pathogenesis claims are graded OTHER/REVIEW_SYNTHESIS. Two nodes conform to granuloma_formation. Validated with just validate, count-verified-snippets, validate-terms and validate-disorders.

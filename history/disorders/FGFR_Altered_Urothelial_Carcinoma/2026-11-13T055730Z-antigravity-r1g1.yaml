  summary: Address PR 17273 review feedback on MONDO broadMatch mapping, resistance
    node split, evidence grading, companion PCR fusion caveat, trials, and mouse model
  details: |
    Added skos:broadMatch mondo_mappings to MONDO:0040679 (urothelial carcinoma) and cross-referenced Bladder_Urothelial_Carcinoma (MONDO:0005611) in notes. Corrected DOI:10.1172/jci169241 background evidence grading on FGFR3 Constitutive Activation (HUMAN_CLINICAL + BACKGROUND) and RAS-MAPK proliferation edge (OTHER + BACKGROUND), added DOI:10.3389/fimmu.2023.1258388 proliferation support on PI3K-AKT Pathway Activation edge, and split Acquired Secondary FGFR3 and PI3K-AKT Bypass Resistance into On-Target Secondary FGFR3 Kinase-Domain Mutation (FGFR3, GO:0004714 INCREASED, CL:0000731) and PI3K-AKT Bypass Activation (AKT1, GO:0004674 INCREASED, GO:0043491 INCREASED, CL:0000731). Removed unsourced FREQUENT frequency from Dysuria and Urinary urgency, added DOI:10.3390/ijms252212126 RT-PCR fusion-miss caveat to companion diagnostic, documented erdafitinib on-target hyperphosphatemia, added INHIBITS target_mechanisms on Immune Checkpoint Inhibitors, added structured clinical_trials (NCT02365597, NCT03390504, NCT03473743) and UPFL animal_models, and removed boilerplate opening-sentence findings in references.

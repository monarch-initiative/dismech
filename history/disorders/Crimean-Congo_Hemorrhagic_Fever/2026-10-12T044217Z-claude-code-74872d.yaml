  summary: 'Create: Crimean-Congo_Hemorrhagic_Fever'
  details: |
    Curated de novo as an infectious-disease entry under the granularity ladder (design decisions 3e). infectious_agent bound to NCBITaxon:3052518 (Orthonairovirus haemorrhagiae); three transmission routes (Hyalomma tick bite, viraemic-livestock blood/tissue, nosocomial blood/body-fluid); agent_life_cycle with Hyalomma vector/reservoir and human dead-end host. Pathophysiology is a causal chain of 9 nodes conforming to viral_hemorrhagic_fever_syndrome at the high-viremia, endothelial-activation, increased-vascular-permeability, consumptive-coagulopathy, decreased-factor-production and reduced-platelet-number nodes; 27 phenotypes all causally wired (100%). Added as a DISEASE member of the Viral_Hemorrhagic_Fevers grouping and updated its uncurated-member text. Deep-research report (research/, claude_code, thin) used as leads only; all PMIDs fetched and every snippet verified against references_cache. Key sources: Swanepoel 1989 (PMID:2749111), Bente 2013 (PMID:23906741), Hawman & Feldmann 2023 (PMID:36918725), Zivcec 2016 (PMID:27110812), LDLR entry (PMID:38548922), Ergonul cytokine (PMID:16518755), ribavirin meta-analysis (PMID:21482564), occupational exposure (PMID:39558265). validate-disorders passed; count-verified-snippets 74/74; validate-terms, check-entity-refs, check-causal-targets, check-granularity, check-coarse-phenotypes, check-enum-values all clean. Note HP:0030138 from the DR report is not Ecchymosis; bound HP:0031364 after lookup.

  summary: Add the chronic-inflammation and ADM nodes the exposures act on (#8302)
  details: |
    Second instance on the #8302 running list, raised by caufieldjh in the review of #8301. None of the entry's five pathophysiology nodes was inflammatory, so all three environmental exposures - Tobacco Smoking, Chronic Pancreatitis, Obesity and Diet - landed on KRAS Oncogene Activation, the initiating oncogenic event, where none has a plausible direct route. #8301 kept that honest by grading all three PREDISPOSES/INDIRECT_UNKNOWN_INTERMEDIATES, but that was grading around a missing node rather than modeling the biology. Added two upstream nodes: 'Chronic Pancreatic Inflammation' (TISSUE; the nongenetic half of initiation, evidenced by Guerra 2007 PMID:17349585 - adult KRAS-mutant mice are refractory until challenged with chronic pancreatitis - plus the human CP-to-PDAC meta-analysis PMID:35142721 as PARTIAL) and 'Acinar-to-Ductal Metaplasia' (CELLULAR; GO:0060290 transdifferentiation, acinar CL:0002064 and ductal CL:0002079 cell types, evidenced by PMID:35176433 and Guerra's lineage result). Wired inflammation to ADM, ADM to Tumor Suppressor Inactivation (PanIN as the named unmodelled intermediate), and added a KRAS to ADM edge so both the genetic and nongenetic inputs converge on the metaplasia, leaving the pre-existing KRAS to Tumor Suppressor Inactivation edge untouched. Retargeted Chronic Pancreatitis to the inflammation node as TRIGGERS/DIRECT and Obesity and Diet to it as PREDISPOSES, and gave Tobacco Smoking a second link into it - that is where the cited meta-analysis PMID:24509242 is actually strongest, since its own qualifier is that tobacco's effect on pancreatitis exceeds its effect on pancreatic cancer, the sentence that previously only served to limit the KRAS link. Recorded in notes that Chronic Pancreatitis is a disease state rather than an exposure (issue #8185) and why it is nonetheless left in place. Two references newly fetched and cached: PMID:17349585, PMID:35176433. Validated with just validate (49/56 snippets verified, 7 DOI-prefixed skipped), just validate-terms, the batched just validate-disorders sweep, the duplicate-key, snippet-length, title-snippet, environmental-evidence and folded-hyphen gates, and pytest -k 'entity_ref or environmental_mechanism or Pancreatic' (7245 passed; the only 2 failures are the pre-existing alias-prefix ones in untouched files). Note that the first validate-terms run failed on GO:0060290 with 'not found in ontology' and a dynamic-enum rejection; a straight retry passed and the term cached normally, so that was a transient OLS lookup failure, not an enum coverage gap - the term is reachable from GO:0008150 via subClassOf in the GO build.

  summary: Mark the KRAS activation node as the somatic origin lesion
  details: |
    Added genetic_context (KRAS hgnc:6407, variant_origin: SOMATIC, functional_impact_category: GAIN_OF_FUNCTION) to the 'KRAS Oncogene Activation' pathophysiology node. Before this, the cell-of-origin derivation fell back to the free-text role rule and landed on the 'Chronic Pancreatic Inflammation' root node, yielding macrophage (CL:0000235) and pancreatic stellate cell (CL:0002410) as the apparent cell of origin -- the tumor's setting rather than its origin. With the lesion marked, the entry derives pancreatic ductal cell (CL:0002079). No new content claim: the node's existing description and cited evidence already state that KRAS mutation is the initiating event of the PanIN-to-PDAC sequence. Validated with just validate, just validate-terms, just check-enum-values, just check-duplicate-keys, and just check-cancer-origin.

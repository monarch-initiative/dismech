  summary: Link the three risk-factor exposures to the initiating oncogenic node
  details: |
    Backfill for issue #8085. All three exposures point at KRAS oncogene activation, the node this entry calls the initiating oncogenic event, because that is where a carcinogen exposure enters the graph; all three are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL. The routes are left unknown deliberately: this entry's description proposes that tobacco carcinogens promote KRAS mutations, but no cited sentence says so. Two things about the shared meta-analysis are worth recording. Its headline figures are for pancreatic diseases as a class rather than for this cancer, and the same abstract states outright that tobacco and alcohol have bigger effects on acute and chronic pancreatitis than on pancreatic cancer. That qualifying sentence is now carried as a second evidence item on the tobacco link, so the relative risk of 1.87 cannot be read as a cancer-specific estimate; the pre-existing evidence explanation, which reports the figure without the qualifier, was left as it stands. The snippet was also widened from the obesity clause alone to the full ranking sentence, so an exposure's rank among the others is visible rather than implied. Chronic pancreatitis is the best evidenced of the three, its meta-analysis being specific to this cancer and reporting risk rising with duration of exposure, which is a dose-response argument the other two lack; it is graded identically to them because it still measures incidence rather than anything at the node. Note that chronic pancreatitis is a disease state rather than an exposure, the same modelling question raised for cirrhosis in issue #8185 and resolved for that entry in PR #8195; it is pre-existing here and was not re-modelled. The pre-existing exposure-level tobacco explanation, which reported the relative risk of 1.87 without the qualifier, was updated too rather than left one layer up from the link that qualifies it; leaving it would have kept the unqualified reading alive in the same file. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 34 of 41 with 7 pre-existing DOI-prefix skips, none on items added here.

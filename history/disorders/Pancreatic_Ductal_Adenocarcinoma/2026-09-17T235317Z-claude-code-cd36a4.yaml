  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the two citations from the earlier OpenScientist sweep (branch os-review-fable) that were still absent from main after main's independent rewrite of this entry.

    APPLIED. PMID:25736685 (Pettazzoni 2015, Cancer Res) added to pathophysiology node 'RTK and Feedback Pathway Reactivation'. That node's description already invokes 'Earlier MEK or G12C-selective-inhibitor studies are contextual analogies' but main cited none of them; its whole evidence set is daraxonrasib-era (PMID:42581230, PMID:42465401). This is the PDAC-native member of that class: in an inducible KRAS-G12D mouse PDAC model, MEK1 inhibition reactivates AXL, PDGFRa and HER1-2 alongside sustained PI3K-AKT-mTOR signalling. Graded MODEL_ORGANISM; the explanation states that the blockade is MEK-only, so it does not establish sufficiency against multiselective RAS(ON) inhibition. Placed on the node only, not on the downstream edge, because a 2015 MEK study does not support a daraxonrasib-resistance edge.

    APPLIED. PMID:42090791 (Wolpin 2026, NEJM) added to pathophysiology node 'Acquired RAS(ON) Inhibitor Resistance'. Main's description asserts that median progression-free survival alone cannot distinguish acquired resistance, primary nonresponse and death, but carried no citation quantifying nonresponse. The quoted result (objective response in 29% of 38 patients with RAS G12/G13/Q61 mutations) is that quantification. Main cites no other objective-response figure anywhere in the entry.

    Both snippets were re-derived from references_cache/ on disk rather than copied from the old branch. PMID_25736685.md is full_text_xml; PMID_42090791.md is abstract_only. Both quotes are exact substrings.

    SKIPPED. Two further uses of PMID:42090791 in the old branch lived inside discussions main does not carry. The use in gap_daraxonrasib_resistance_route_prevalence is now wrong on its face: that discussion's premise was that daraxonrasib trials report efficacy and safety without paired molecular profiling at progression, which PMID:42581230 (paired pretreatment and end-of-treatment ctDNA in 44 patients) superseded, as main's own text records. The use in gap_daraxonrasib_immune_remodeling_human_validity was left alone because porting that discussion would have been a structural addition beyond this task, and its readouts target a node main renamed ('Regulatory T-Cell Relief' to 'Regulatory T-Cell Recruitment after KRAS Inhibition'), so it would not have resolved as written.

    PROSE CORRECTIONS, ALL ALREADY ON MAIN. The old sweep's headline correction was that two nodes claimed drug-matched immune data in this cancer did not exist when it does. Main has fixed this independently and carries all three PMID:40057911 sentences: the myeloid decrease with T-cell increase and the T-cell/dendritic-cell dependence of regression depth on 'Immunosuppressive TME Reversibility under RAS(ON) Inhibition' and 'Myeloid Suppression Relief and CD8 Effector Infiltration', and the complete-responses-with-immunotherapy sentence on the 'Experimental KRAS Inhibition with Immune Checkpoint Blockade' treatment. A search for residual absence-of-data claims returned nothing. The resistance-description qualification is present as main's own sentence. The counter-regulatory fibroblast and myeloid rebound node the sweep added exists as 'IL6-CAF and Myeloid Rebound after SOS1-MEK Inhibition', with the same PMID:38727236 support and the same edge to Immune Evasion. The sweep's deliberate NO_EVIDENCE Treg item is superseded: main found the sentence in the same paper that does bear on Tregs and graded it SUPPORT.

    No assessment sidecar needed; main already holds the codex assessments for both hypotheses.

    Verified: linkml-validate clean; 211/211 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all OK; check-folded-hyphens and check-snippet-length report nothing for this file.

    Metastatic_Pancreatic_Adenocarcinoma was folded into this entry on 2026-08-28 under design decisions section 3a, which forbids a stage as its own entry. The fold moved both RAS(ON) hypothesis_group_id values onto this entry but left kb/hypotheses/Metastatic_Pancreatic_Adenocarcinoma/ in place. Because render.collect_hypothesis_research_links looks up the hypothesis directory by this entry's filename stem and has no fallback, both OpenScientist reports and their assessment sidecars were invisible on this disease page. Confirmed by calling the function directly: 0 sections and 0 reports before, 2 sections and 2 reports after, both now carrying their real labels and EMERGING status. The directory was renamed to Pancreatic_Ductal_Adenocarcinoma and the hypothesis notes sentence asserting that the reports remain under the old path was corrected, since the rename made that statement false. No mechanistic content, evidence item or hypothesis status was changed.

  summary: Review PDAC mechanisms and clinical scope with two OpenScientist assessments
  details: |
    Review inputs and scope
    - Read the complete PDAC YAML, both OpenScientist reports and citation sidecars under the legacy Metastatic_Pancreatic_Adenocarcinoma directory, both existing July codex assessment YAML/Markdown pairs, both broad Falcon research reports/citation inventories, repository guidance, design decisions and relevant review/reference/term/cancer/assessment skills.
    - Reconciled literature with the full disease model rather than limiting review to the OpenScientist deltas. Independently retrieved primary papers, clinical trials and current guidance. All reference-cache files were generated through the sanctioned fetcher, with shared serialization to avoid NCBI throttling. Existing unrelated PRs were checked for overlap; no other author's branch was modified.

    Content-completeness checklist
    1. Identity/subtypes: retained PDAC as one histologic disease including its metastatic state. Distinguished acinar reprogramming, adult ductal-origin models, PanIN and cystic precursor routes; removed obligatory acinar origin and a universal mutation-order assertion. Classical/basal expression assignments are plastic, potentially coexisting states, with cohort-specific prognostic associations. Added basal-cell GM-CSF immune-circuit perturbation evidence from August 2026. Removed the incorrect exact equivalence between pancreatic-duct site code ICD10CM:C25.3 and the histologic PDAC entity; MONDO and NCIT mappings remain.
    2. Pathophysiology: separated cooperating inflammation/KRAS/tumor-suppressor changes from unsupported arrows implying that metaplasia causes specific mutations. Added anabolic glucose metabolism, glutamine redox support, macropinocytic protein scavenging, autophagy, inflammatory CAF programming, stromal restraint, matrix-associated hypoperfusion, GM-CSF myeloid signaling, NBR1/MHC-I degradation and kinase-independent nuclear FAK effects. Distinct fibroblast states prevent the model treating all stroma as uniformly promoting cancer. Exosome-MIF liver priming is distinguished from universal metastasis; mouse early dissemination is separated from human timing and Snail/Twist dispensability. Human neural-growth-factor associations are qualified by a prospective cohort in which pain did not predict PNI. No unsupported causal cycles or extra edges were invented to force graph connectivity.
    3. OpenScientist findings: restored two mechanistic_hypotheses definitions lost in consolidation and placed hypothesis groups on causal edges. Valid findings are represented with explicit drug, allele, model, publication and clinical scope. Cyclophilin-A protein loss, CDK2/4/6 continuation, JUN/mTOR under combination therapy, MYC/YAP bypass, CDK8/CXCL2/FAS adaptation, USP20/HMGCR/ULK1 and CD24 antiphagocytic signaling are distinct. Ferroptosis susceptibility is a treatment vulnerability, not a proven causal resistance state. Direct RMC-7977/daraxonrasib PDAC immune evidence supersedes the report's erroneous agent gap. Autophagy/FAK do not exclude RAS regulation of antigen presentation. New Treg-recruitment/CTLA4 findings replace unsupported generalized Treg relief and qualify generic checkpoint synergy.
    4. Clinical resistance update: PMID:42581230 (August 11, 2026) now profiles paired ctDNA in 44 patients selected for acquired resistance after disease control in phase I/II NCT05379985. RAS-pathway events in 26/44 and KRAS amplification in 16/44 are selected-cohort rates; RTK/MAPK/PI3K categories overlap. This supersedes July's broad clinical-data gap without claiming that it is RASolute 302, that all patients progress through these routes, or that no detected secondary KRAS mutation excludes all possible on-target mutations. Clinical salvage efficacy and non-genetic routes remain unresolved.
    5. Phenotypes: removed unsupported frequency bands from pain, jaundice, weight loss and diabetes; scoped hepatic-metastasis percentages to metastatic cases. Pancreatogenic diabetes is mapped to Diabetes mellitus rather than Type II diabetes. Added exocrine insufficiency and a functional-loss-to-maldigestion/weight-loss chain; the 72% pooled estimate concerns advanced pancreatic cancer, not every PDAC. Pain is not a PNI diagnostic surrogate. Fatigue is retained as a nonspecific presentation without an invented frequency or detailed causal claim.
    6. Genetics: separated germline susceptibility from somatic drivers and assay-specific mutation/deletion/silencing frequencies. Corrected BRCA2 inheritance and the germline BRCA1/2 scope of POLO; added BRCA1, ATM and MLH1 inherited-risk associations with cohort/ancestry limits and the NRG1-fusion treatment subset. Tumor suppressor inactivation is not an obligatory consequence of KRAS signaling or metaplasia.
    7. Histopathology/diagnosis/biochemistry: replaced disease-as-histologic-finding with ontology-bound glandular differentiation; removed unsupported histologic frequencies. Added pancreatic-protocol imaging, biopsy confirmation before systemic therapy, molecular/germline testing and four clinically meaningful resectability/metastasis categories. CA19-9 and CEA are contextual markers rather than standalone screening tests; CEA is less sensitive, not less specific in the cited pooled analysis.
    8. Treatment/trials: expanded surgery beyond Whipple to location-appropriate pancreatic resection; distinguished metastatic FOLFIRINOX from adjuvant modified FOLFIRINOX evidence; removed unsupported cross-trial tolerability comparison. Added NALIRIFOX, NRG1-selected zenocutuzumab, MSI-high/dMMR checkpoint context, nutritional/enzyme support and pain/biliary care. POLO PFS benefit is qualified by nonsignificant final OS. Daraxonrasib phase III efficacy is not evidence of clinical immune mediation. KRAS vaccine is an early residual-disease trial rather than proven primary prevention. Corrected RAS/EGFR/STAT3 pharmacologic combination evidence is experimental. Four randomized trial records include negative PEGPH20 survival results; current recruitment status is not inferred from a purpose-only registry cache or a results paper.
    9. Risk/environment: removed unsupported smoking-to-KRAS and obesity-to-specific-mechanism arrows and diet claims. Aggregate pancreatic-disease risk ratios are not PDAC-specific. Chronic pancreatitis remains in the inflammatory mechanism and the existing dedicated comorbidity record, rather than being treated as an external exposure.
    10. Models/data: added linked immunocompetent and KPC whole-mouse models separately from cell/organoid systems. Verified all four GEO accessions through generated per-accession caches and live SOFT metadata. GSE111672 has 23 records from six patients. GSE155698 lists 41 records while its design totals 39; explicitly preserve the discrepancy pending GSM-manifest reconciliation. Raw dbGaP data were not accessed. Inspected pinned PhysiCell v2.0.1 configuration/rule files; model records do not claim simulations, calibration or patient-response validation in this review. The frozen dataset accession blob was never read, written or staged.
    11. References/research consumption: cached titles, proposition-complete quotes and source-type grading were reviewed throughout. Removed generic introductions/title-only pseudo-findings from the broad-research bibliography and reconciled duplicate DOI/PMID versions. Scope-limited review leads and unresolved experimental combinations remain assessments/discussions rather than being promoted to established clinical mechanisms. The existing organ-on-chip discussion remains a proposed assay, not a performed validation.

    Report assessment audit
    - Updated both codex assessment YAMLs and readable Markdown renderings, preserving and extending useful July claims. They now contain 42 claim dispositions and 15 skipped/proposed analysis inventories. Both linked final HTML/PDF artifacts are absent; no provider query archive, raw dataset or executed computational result is committed. Citation sidecars verify selected strings, not search completeness or source independence.
    - Key corrections: G12D CypA versus G12R EGFR/RAS-WT (not G12V); median PFS is not universal acquired resistance; selective-G12C NSCLC resistance often remains sensitive to multiselective RAS inhibition; CDK4/6 OR CDK2 combinations are not evidence requiring both; JUN combination scope and ferroptosis vulnerability are narrower than claimed.
    - Primary MYC/YAP work predates the report but was missed; new clinical resistance findings appeared later and are treated as an update, not a July error. CD24 and MRTX1133 preprint/final pairs are not independent replications. PMID:32459143 is commentary on the primary NBR1 Nature study. Retracted PMID:41329731 is not supporting evidence; corrected PMID:42224594 includes pharmacologic as well as genetic experiments. Computational ERBB/FAK preprint nonsignificance does not prove independence. CRC drug-holiday and MEK lysosomal sequestration findings do not justify daraxonrasib PDAC treatment recommendations.

    Validation
    - Schema, ontology-term and cached no-full-text reference validation passed on the disease. Separate literal body checks include DOI/registry prefixes skipped by the default validator. Both assessments passed LinkML schema and report-quote/path/provenance validation.
    - Targeted duplicate-key, enum, entity-reference, causal-target, qualifier-term, source-defect and snippet-boundary checks passed. Global reference-title, snippet-grading and folded-hyphen ratchets passed. Derived term caches were inspected; all new titles come from generated cache frontmatter.
    - The single-disease page rendered successfully; generated HTML is excluded from the curation commit. A static graph was inspected and the graph constructor found no orphan targets or integrity issues. Unsupported edges were removed or narrowed even when this leaves a mechanism unconnected.

    Final source audit: the immune report PMID:42226659 did not resolve; the matching wording was located in Cancer Discovery news DOI:10.1158/2159-8290.CD-NW2026-0062 and is treated as secondary reporting, not independent trial replication. FDA approval on 26 August 2026 and the precise US indication were verified directly at the linked FDA notification and recorded in treatment notes. Added primary SenCAF depletion evidence to distinguish a specific promoting myofibroblast state from restraining stroma.

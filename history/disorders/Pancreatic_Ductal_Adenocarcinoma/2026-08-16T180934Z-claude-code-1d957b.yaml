  summary: Add mutant-KRAS vaccine immunologic interception treatment
  details: |
    Added a Mutant KRAS Vaccine immunologic-interception treatment, motivated by the NCI TACPAD meeting report (Miller & Mohammed, J Cancer Prev 2023;28:24-28, Jaffee plenary) used as a lead source only. Evidence from the PRIMARY phase 1 AMPLIFY-201 trial of the lymph-node-targeted amphiphile mutant-KRAS vaccine ELI-002 2P: Pant et al., Nat Med 2024 PMID:38195752 NCT04853017. therapeutic_modality VACCINE, treatment_term NCIT:C15346 vaccination; target_mechanisms INHIBITS the existing KRAS Oncogene Activation node via immune elimination of mutant-KRAS-expressing clones, distinct from the co-listed pharmacologic daraxonrasib. Framed honestly: AMPLIFY-201 is adjuvant/MRD-setting immunogenicity, and true high-risk primary prevention is noted as under investigation. Validated with just validate, just validate-terms, and batched just validate-disorders. No causal snippet drawn from the secondary meeting report.

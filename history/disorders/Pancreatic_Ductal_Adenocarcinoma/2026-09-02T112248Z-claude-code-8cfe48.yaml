  summary: 'Integrate assessed OpenScientist findings: RAS(ON) immune remodeling and
    acquired resistance'
  details: |
    Integrated the RETAINED and QUALIFIED claims from the two existing codex assessments of the OpenScientist reports under kb/hypotheses/Metastatic_Pancreatic_Adenocarcinoma (ras_on_inhibition_immune_tme_remodeling and ras_on_inhibitor_acquired_resistance). No new assessment sidecar was written because both already exist.

    Immune-remodeling hypothesis. Added PMID:40057911 (Orlen et al., Cancer Discov) in three places. This is the drug-matched PDAC study both the report and the entry had missed: RAS(ON) multiselective inhibition in immunocompetent PDAC mice decreases myeloid cells, increases T cells, and depends on T cells and conventional dendritic cells for regression depth and duration, with immunotherapy combination giving complete responses. Two SUPPORT items went on the Myeloid Suppression Relief and CD8 Effector Infiltration node (composition shift; functional T-cell and cDC dependence) and one on Immunosuppressive TME Reversibility under RAS(ON) Inhibition (combination requirement). Corrected the prose on both nodes, which asserted that daraxonrasib-specific PDAC immune data did not exist. Qualified Antigen Presentation Restoration, whose description and evidence explanation claimed MHC-I control in PDAC is dominantly autophagy and FAK owned and largely RAS-independent and that the drug-class evidence is NSCLC-only; the assessment REJECTED that categorical reading, so the prose now says the RAS contribution has not been separated from autophagy and FAK rather than that it is absent. Qualified Regulatory T-Cell Relief, whose description claimed a literature search found no relevant primary evidence, and added a NO_EVIDENCE item on PMID:40057911 recording that the closest drug-matched study reports a global T-cell increase and no Treg measurement in its abstract. Added a new pathophysiology node, Counter-Regulatory iCAF and M2 Myeloid Rebound, from PMID:38727236 with two SUPPORT items and an edge to Immune Evasion: KRAS-pathway inhibition expands IL6-expressing iCAFs and M2 macrophages and degrades dendritic-cell quality, and durable responses needed CD40 agonism in addition to checkpoint blockade. Added a HUMAN_MODEL_MISMATCH discussion, gap_daraxonrasib_immune_remodeling_human_validity, with a proposed randomized daraxonrasib plus anti-PD-1 trial with paired biopsies, citing clinicaltrials:NCT07491445 (the registered first-line phase 3 pairs daraxonrasib with chemotherapy, not a checkpoint inhibitor) and PMID:42090791.

    Acquired-resistance hypothesis. Added PMID:25736685 to RTK and Feedback Pathway Reactivation, giving that node its first PDAC-native evidence: MEK inhibition in a KRAS-driven PDAC mouse model reactivates AXL, PDGFRa and HER1-2 with sustained PI3K-AKT-mTOR signaling. The blockade is partial, which is why sufficiency against complete RAS(ON) suppression stays open. Added PMID:42090791 to Acquired RAS(ON) Inhibitor Resistance and qualified the node description: fewer than a third of treated patients had an objective response, so population progression-free survival must not be read as universal acquired resistance. Added a KNOWLEDGE_GAP discussion, gap_daraxonrasib_resistance_route_prevalence, with a longitudinal ctDNA and paired-rebiopsy experiment to rank the curated routes and separate pre-existing from selected states.

    Deliberately not changed. No mechanistic_hypotheses block was added: the entry carries both hypothesis_group_id values only on causal edges, and declaring them is a structural change no assessed claim called for. No MHC-I or FoxP3 evidence item was added from PMID:40057911 because those results are full-text only and the cache holds the abstract; the assessment report of them is recorded as prose qualification instead. The retracted PMID:41329731 alternative was not integrated. Claims already curated (CypA loss, cell-cycle uncoupling, JUN and mTOR, ferroptosis, MYC, CDK8-CXCL2, USP20) were left alone.

    Verified with check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets, and count-verified-snippets (85 of 102 snippets verified, 17 skipped by prefix, none failing).

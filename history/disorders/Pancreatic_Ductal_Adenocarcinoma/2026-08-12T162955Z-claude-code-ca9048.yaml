  summary: Link the two modifiable risk factors to the oncogenic signalling node
  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the KRAS-centered oncogenic signalling node, which is this entry's most upstream mechanism and the only one a carcinogen exposure can honestly reach; the remaining nodes model dissemination, which is downstream of the cancer already existing. They are graded identically because they rest on the same sentence of the same review, which lists the modifiable risk factors together, so neither can be placed above the other on evidence. The entry's note for the metabolic exposure proposes that metabolic dysfunction reinforces inflammatory and growth-factor programs relevant to dissemination; that route is the entry's prose and appears in no cited sentence, so the intermediates are recorded as unknown and the link does not point at the dissemination node. Chronic pancreatitis was not linked because it carries no evidence items at all, which is the gap recorded in issue #8296. Note also that this entry is a metastatic-scope entry with carcinogenesis-scope exposures, the pattern recorded in issue #8302; unlike the gastric case it does have an upstream oncogenic node, so the links are drawable here. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 44 of 54 with 10 pre-existing DOI-prefix skips.

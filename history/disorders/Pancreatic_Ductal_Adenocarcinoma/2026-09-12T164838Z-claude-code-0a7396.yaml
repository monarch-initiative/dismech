  summary: Record the delivery system (carrier) for Pancreatic_Ductal_Adenocarcinoma
  details: |
    Added a delivery_system block to the NALIRIFOX treatment recording delivery_platform: LIPOSOME, which was previously inexpressible: the carrier axis lived only inside oligonucleotide_details and NALIRIFOX is a small-molecule regimen. Only the irinotecan component is liposomal, which is what separates NALIRIFOX from FOLFIRINOX, so the description says so explicitly. Evidence is an exact quote from the already-cited NAPOLI 3 report (PMID:37708904) describing the drug product, graded OTHER because it is not a result of the trial. Validated with just validate, just validate-terms, and just check-delivery-system.

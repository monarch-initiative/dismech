  summary: Correct derived cell of origin from ductal to acinar
  details: |
    The KRAS Oncogene Activation node carries this entry's somatic lesion and is therefore the node the cell of origin derives from, but it bound CL:0002079 pancreatic ductal cell. That contradicts the entry's own Acinar-to-Ductal Metaplasia node, which states with cited lineage-tracing evidence (PMID:17349585 - K-Ras(G12V) in the acinar/centroacinar lineage yielding PanINs and invasive PDA) that the origin lies in the acinar compartment 'rather than in pre-existing ducts despite the tumour's ductal histology'. Rebound to CL:0002064 pancreatic acinar cell so the derived cell of origin agrees with the entry's own evidence, and rewrote the genetic_context description to say the lesion arises in the acinar/centroacinar compartment with the ductal phenotype acquired downstream through metaplasia. The ductal binding predates this branch - it is present on origin/main and this branch's diff does not add it. An earlier draft of this record attributed it to PR #10334; that was wrong, an artifact of reading `git log` in a shallow clone where that commit is the graft boundary rather than the true origin. The file was created in PR #528 (2026-03-09); which commit introduced this particular binding was not established and is not claimed here. Marking the node as the origin turned a latent internal inconsistency into a published derived claim, which is how it surfaced. The human cell of origin of PDAC remains debated in the literature; this entry commits to the acinar position and cites it, so the change makes the record self-consistent rather than settling the field.

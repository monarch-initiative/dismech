  details: |
    Responds to formal review 5121061296 at head 8417ceb482e31698d2a7f24cda59d7295959bfe7. Added context-bounded causal links from the neoplastic compartment to IL1-driven inflammatory CAFs, SHH-driven tumor-restraining stroma, exocrine loss through duct obstruction/fibrosis/tissue loss, and location-dependent obstructive jaundice through biliary obstruction. Connected the acquired-resistance branch by the experimental RAS-EGFR-STAT3 combination targeting KRAS, preserving model scope; no unsupported initiating-KRAS-to-acquired-amplification causal edge is asserted. Left pre-existing pain/PNI backlog unwired because cited PMID28785934 found that pain did not predict PNI. Added specific agents and modalities for the six new treatment categories, splitting nutritional counseling from enzyme replacement and biliary drainage from multimodal pain care. Linked enzyme replacement and stenting to their symptomatic targets. Added the pancrelipase randomized trial and retained its negative eight-week BMI endpoint. Corrected the narrative-review evidence source to OTHER. Both raw OpenScientist reports and both assessment pairs remain unchanged. Validation covers targeted disease schema, ontology labels/membership and derived caches, both assessment schemas/quote/provenance checks, history, duplicate keys, enum/entity/causal/qualifier/source-defect gates, literal snippet and title-cache checks including DOI sources, graph integrity and page rendering, relevant offline repository gates and explicit-file pre-commit.
    Independent read-only review by the lysosomal/blood curator checked all seven new edges against their source caches and found no concrete direction or source-scope issue. Final graph: 42 mechanisms, 84 total nodes, 59 edges; all 54 nonisolated nodes are in one component. Final exact evidence inventory: 208 snippets and cache-matched titles.

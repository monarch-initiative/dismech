  summary: Review COG4-CDG clinical evidence, glycosylation mechanisms and model
    limits
  details: |
    Reviewed the complete COG4-CDG entry, its three existing CREATE/EDIT history records, and the OpenScientist deep-research report against cached and newly retrieved sources. Preflight confirmed MONDO:0013281, OMIM:613489 and COG4; the report's erroneous suggested HGNC identifier was not used. Rebased the review branch on origin/main before work. This inherited disorder has no prior REVIEW and is within the campaign excluding infectious/environmental disorders. The Saul-Wilson differential remains a separate dominant disorder.

    Major findings and corrections:
    - Removed all-COG-CDG pooled phenotype frequencies, unsupported COG4 hearing impairment/recurrent-fever assignments and the pooled intellectual-disability evidence. Retained disease-specific absent speech and facial dysmorphism with founding-case evidence; added cognitive impairment from the COG4-specific historical GeneReviews paragraph without a frequency band.
    - Replaced the bundled clinical-syndrome mechanism with atomic COG4 dysfunction, protein abundance, retrograde transport, proposed enzyme recycling, N-glycan processing, O-glycan processing and Golgi morphology nodes. Clinical edges explicitly leave tissue intermediates unresolved. Enzyme localization is hypothetical, not a direct measurement, and autophagy/fever is an unresolved pooled-COG hypothesis in a discussion, not an established COG4 mechanism.
    - Added case-level cirrhosis, transaminase elevation, thrombocytopenia, hyperreflexia, ataxia, axial hypotonia, limb hypertonia, frontotemporal atrophy, hepatic failure and status epilepticus. The last two are explicitly scoped to a critically ill child. No case series percentage was inferred.
    - Added the clinical phenobarbital response omitted from the original entry. Added historical group-level nutritional/developmental support, hepatic/coagulation surveillance, medication precautions and reproductive counseling with their scope and retired-source limitations stated explicitly. No COG4-specific intervention trial was identified in the report or the targeted web search; no trial or proven disease-modifying treatment is asserted.
    - Expanded molecular diagnosis and the allelic spectrum with the segregated p.Glu419Ter/p.Cys314Tyr case; structured c.1647+5G>A as an intronic SNV with measured exon skipping but only predicted premature termination. Preserved uncertainty about residual function and near-null viability. Normal transferrin and initially normal broader N-glycan analyses do not exclude COG4-CDG; the apoC-III findings are correctly assigned to the COG4 siblings, not the ATP6V0A2 patient.
    - Added patient fibroblast and zebrafish gene-loss models. Corrected the engineered R729W model to knockout plus lentiviral complementation, with normal Golgi morphology explicitly failing to recapitulate the patient-cell phenotype. Captured failed patient-cell complementation and impaired control-cell trafficking after increased COG4 expression; neither is clinical gene-therapy evidence. The zebrafish null is a functional perturbation with developmental readouts, not proof of human COG4 hearing loss. G516R-specific SIL1 secretion and Saul-Wilson therapies/models were not transferred.
    - Removed process-diary notes from the disease entry. Domain knowledge gaps remain in structured discussions.

    Source consumption:
    PMID:19494034 full text, including clinical course, protein abundance, assembly/localization, BFA and washout assays, failed rescue, control overexpression, TEM, discussion and methods. PMID:21185756 full text, including artificial GAP-acceptor O-glycan assays, allele/transcript data, clinical description and unsuccessful complementation. PMID:34603392 full text and methods, including near-endogenous promoter-driven constructs, positive lectin/HSPG findings and negative Golgi/GS15 findings. PMID:31804708 full scientific body and limitations: pooled 45-patient all-COG data and an explicitly unproven autophagy hypothesis. PMID:28848061 cache was a repository landing page; recovered and read the complete corresponding chapter in the author's Utrecht thesis (https://pure.umcutrecht.nl/ws/portalfiles/portal/41751415/5e9705a6c73bd.pdf), including mutation/protein tables, severe lobe B counterexamples and small-sample limitations. No blanket clinical severity ranking by lobe remains.

    New PMID:34298581 full text was consumed for cohort ascertainment, sequencing/segregation methods, patient P21's narrative and tables; other diagnoses and cohort mortality rates were not attributed to COG4. New PMID:30287385 full text was read for the null allele, developmental experiments, ECM/collagen findings and later canal formation. PMID:19651599 structural abstract was read and cited conservatively; forced PMID, PMC, Europe PMC and XML retrieval attempts did not recover quotable full text. PMID:33960646 abstract was inspected but did not identify COG4-specific patient details, so it was not used as phenotype evidence. PMID:37340984 COG4-knockout/SNARE passages and PMID:23865579 abstract were checked for scope; they do not establish SNARE abnormalities in recessive COG4 patient cells and were not promoted to such claims.

    PMID:34022244 and PMID:42202558 abstracts were read completely; repeated generated PMID/DOI and publisher retrieval attempts did not obtain usable full text. Their claims remain limited to the abstract. PMID:30290151 abstract supplies only the explicit Saul-Wilson contrast; forced retrieval remained abstract-only. Every new or refreshed reference cache was generated by the fetch tooling; no cache markdown was authored or edited manually. Failed, CAPTCHA and unused retrieval artifacts are not included in the PR.

    GeneReviews baseline: the offline index finds no dedicated COG4 chapter. The pre-existing PMID:20301507 tag originally served only as a search token. After direct NCBI routes returned CAPTCHA, found the already committed full chapter at url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1332/. Read its COG4-specific clinical paragraph and complete evaluation, management, surveillance, avoidance and counseling sections. Restored the PMID tag and added actual full-text evidence for clinical cognitive impairment, molecular testing, supportive care, monitoring, medication caution and conditional Mendelian/reproductive counseling. It is explicitly a retired group-level chapter (2017 update); newer COG4 diagnostic and adult-survival evidence takes precedence. No PMM2/MPI therapy, organ manifestation or distorted recurrence risk was transferred. HTML-linked sentences require ellipsis-separated verbatim segments for deterministic matching; the quotation text and meaning were preserved.

    Eight-dimension completeness assessment: phenotypes adequate after primary-case additions and removal of pooled scope errors; subtypes adequate with Saul-Wilson kept separate; pathophysiology adequate with atomic mechanisms and explicit uncertainty; treatments/trials adequate for the available single-case response and historical supportive guidance, no disease-specific trial surfaced; genetics adequate including splice/deletion/nonsense/missense configurations and structural context; biomarkers/diagnosis adequate with false-negative screens and molecular/RNA confirmation; references adequate with high-value clinical/model sources added and retrieval limits documented; overall consumption adequate, retaining uncertainty rather than importing off-disease findings.

    Validation: just validate-disorders passes schema, ontology and reference validation, with 115/115 quotations and 128 titles verified and no skipped or unavailable snippets. The 28 repository QA gates pass; gates affected by the GeneReviews additions were repeated. Two targeted data tests pass, snippet boundaries verify, and the page renders with the expected new mechanisms, treatments and models. New ontology labels and relevant definitions were inspected through OAK. The rendered HTML is excluded from the commit.

  summary: 'Review round 1: cited an uncited diagnostic claim, mined the cached full
    text, connected five orphan phenotypes'
  details: |
    Addressed all seven IMPORTANT findings from the automated review of PR 11245. Connected the five phenotypes that had no incoming edge: brain atrophy, abnormality of coagulation, abnormality of the liver and recurrent infections now descend from the multisystem node using the same PMID:42202558 snippet that already named them, and recurrent fever descends from a new pathophysiology node for the COG complex's autophagy role, which the source proposes specifically as the route to episodic fever as distinct from the glycosylation defect. That new node was itself given a parent so it does not become a second orphan root. Cited the previously uncited claim that transferrin isoelectric focusing can be falsely normal in this disorder, using PMID:34022244, and added transferrin IEF and apolipoprotein C-III IEF as diagnosis entries in their own right, since a combined N- and O-glycosylation defect is characterised by the pair; the transferrin entry carries its evidence as REFUTE against the implicit claim that the screen detects this disorder. Attached real denominators from the cached PMID:31804708 to the frequency bands that previously rested on a qualitative feature list, and added four phenotypes from the same paper: facial dysmorphism at 71 percent, intellectual disability at 53 percent, and severe hearing impairment and absent speech, the last two deliberately without frequency bands because the source gives patient counts rather than rates for them. Renamed the pathophysiology node Reduced COG4 Expression and Destabilised Lobe A to Reduced COG4 Expression, because the lobe A destabilisation half is exactly what the entry's own discussion records as unresolved between PMID:19494034 and PMID:21185756, and the node should not silently close a conflict the entry deliberately leaves open. Added a top-level references block tagging the retired group-level GeneReviews chapter PMID:20301507, following the CCDC115-CDG convention, with a notes sentence recording that no COG4-specific chapter exists. Added an experimental_models block for the isogenic CRISPR COG4 R729W RPE1 and HEK293T lines from PMID:34603392, with a modeled_mechanisms link to the glycosylation defect node and its translational limitations recorded. Validation: schema passes, 52/52 snippets verified (was 33/33), term validation passes, and the whole-KB gates were run.

  summary: 'Create: COG4-Congenital Disorder of Glycosylation / CDG-IIj (MONDO:0013281)'
  details: |
    De novo curation of recessive COG4-CDG (CDG-IIj).

    Lump/split, the central decision: curated as a DISEASE separate from Saul-Wilson_Syndrome.yaml, which already exists and is also COG4. The argument is mechanistic, not clinical. Saul-Wilson is a single recurrent heterozygous de novo p.Gly516Arg allele whose fibroblasts have normal COG4 mRNA and protein and show ACCELERATED retrograde recycling (PMID:30290151). COG4-CDG is biallelic loss of function with reduced COG4 protein and DELAYED retrograde transport (PMID:21185756). The transport phenotypes run in opposite directions, so these are not two severities of one lesion. The deep-research report independently reached the same conclusion. Alternative shape if reviewers disagree: a shared COG4 entry with has_subtypes.

    A disagreement deliberately left standing: PMID:19494034 reports that reduced COG4 also affects expression/stability of other lobe A subunits, while PMID:21185756 reports COG4 dramatically reduced with other subunits unaffected. Both are cited on the same pathophysiology node with a KNOWLEDGE_GAP discussion recording the conflict, rather than selecting the more convenient one. They studied different genotypes so the disagreement may be real.

    Weakest link marked as such: the edge from the combined glycosylation defect to the clinical syndrome is INDIRECT_UNKNOWN_INTERMEDIATES. Nothing cited identifies which glycoproteins are functionally compromised, and the glycan abnormality is described as mild even in severely affected patients.

    Citation scope recorded: the recurrent-fever phenotype is evidenced from a study of all 45 reported COG-CDG patients across subunits, not COG4 specifically. Stated in the evidence explanation so the scope is not silently widened.

    Deep research: one openscientist report. preflight-dr PASS (COG4 x40, OMIM 613489 matches; the report also carries 618150, Saul-Wilson's OMIM, consistent with it covering both COG4 diseases). 28/28 references resolved. Note the report's own reference validation reports 3 of 14 quoted claims NOT found in source; none of this entry's 33 snippets derive from the report's quotes, all were verified independently against the reference cache.

    Two self-caught defects: two reference_title values written from memory failed the validator's title check and were re-derived from the cache; and one snippet failed because the validator strips bracketed text while the source retains it, so a clean unbracketed sentence was quoted instead.

    Validation: just validate passes schema plus 33/33 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all pass. check-snippet-length and check-title-snippets fail identically on a pristine main checkout with zero local changes, so those are pre-existing and unrelated.

  details: |
    Addressed all four IMPORTANT findings from the second review of PR 11245. Three were residuals of my own round-one fixes. The apolipoprotein C-III diagnosis entry quoted the sentence stating that transferrin analysis was normal, which explains why a second-line assay is needed but says nothing about what apoC-III showed; replaced with the two sentences reporting the apoC-III patterns, and renamed the entry to two-dimensional electrophoresis because that is the method the cited report used rather than plain isoelectric focusing. Global developmental delay kept VERY_FREQUENT while the percentage I attached to it in round one gives 73 percent, which is the FREQUENT band; corrected the band and the explanation, which had asserted that the figure supported the band it contradicted. This is the same defect the reviewer had flagged as CRITICAL on the sibling HSAN-VI entry and I reintroduced it here while fixing the finding it belonged to. The Reduced COG4 Expression node was renamed in round one but its description still stated as fact that the loss propagates to the other lobe A subunits, which is exactly the claim the cog4cdg_conflicting_subunit_effects discussion records as unresolved; the description now states the contested status and names both sides. Added hypotonia and failure to thrive, quotable from PMID:21185756 which the entry already cites, without frequency bands because the support is case-level. Went beyond the blocking findings on the reviewer's related non-blocking note: brain atrophy, seizure, abnormality of coagulation and recurrent infections carried FREQUENT on the strength of a qualitative feature list, and no percentage for any of them exists in any cited source, so those bands were dropped rather than asserted. Every remaining band in the entry now traces to a quoted percentage. Also recorded OMIM:613489 and ORPHA:263487 as external_assertions. Validation: schema passes, 55/55 snippets verified (was 52/52), term validation passes, and the whole-KB gates were run.

  summary: Disposition MONDO:0007495 (dystonia 5) as a subtype of AD-DRD
  details: |
    Curation target was the stubs/Dystonia_5.yaml queue item, MONDO:0007495 (dystonia 5 / DYT5, OMIM 128230).

    DECISION: SUBTYPE, not a new disorder file. MONDO:0007495 sits under both MONDO:0100184 (GTP cyclohydrolase I deficiency) and MONDO:0971063 (autosomal dominant dopa-responsive dystonia), and is already modelled as the 'GCH1-related GTPCH1-deficient DRD' entry in this file's has_subtypes list. The parent entry already carries the GCH1 haploinsufficiency -> reduced BH4 -> nigrostriatal dopamine synthesis deficiency chain, the diurnal-fluctuation phenotypes (temporality: DIURNAL), sex-biased reduced penetrance, and the low-dose levodopa treatment, all scoped to that subtype, so a separate file would have duplicated it.

    CHANGES: added therapeutic_modality: SMALL_MOLECULE to the low-dose levodopa treatment, which already bound CHEBI:15765 as therapeutic_agent but carried no modality. Recorded entry_type: SUBTYPE and status: BLOCKED on stubs/Dystonia_5.yaml with the lump/split reasoning and the remaining step.

    NOT DONE, and why: binding subtype_term to MONDO:0007495 on the GCH1 subtype. The block was written and reverted because it cannot be validated in this environment. MONDO:0007495 is absent from cache/mondo/terms.csv and from the DiseaseOrSubtypeTerm enum closure cache, and every route to materialize those rows is denied by this session's egress policy (EBI OLS www.ebi.ac.uk and the bbop-sqlite MONDO build both answer 403 at the proxy). Cache rows must never be hand-written, and curation PRs in this repo commit the cache rows alongside the binding, so shipping the binding without them would have been incomplete. A session with ontology-service access finishes it in one step: add the subtype_term block, run just validate-terms on this file, commit the resulting cache rows, delete the stub.

    DEEP RESEARCH: falcon was requested and is unavailable here (EDISON_API_KEY empty, and api.platform.edisonscientific.com denied by the egress policy); the just dr_fallback='--fallback' run produced no report. A claude_code provider run succeeded and is committed as research/Autosomal_Dominant_Dopa_Responsive_Dystonia-deep-research-claude_code.md (14 web searches, 17 turns, 36 citations). Its reference validation could NOT run: crossref and NCBI E-utilities are both denied by the egress policy, so the report carries no Reference Validation section and no frontmatter summary. All four PMIDs it cites (40140190, 18345435, 12891653, 9182249) are uncached and unfetchable here, and its remaining citations are bare web URLs, so NO evidence item was taken from it. It is committed as an unvalidated research lead only.

    VALIDATION RUN: just validate (passed), count-verified-snippets 76/89 verified with 13 skipped by prefix (unchanged, no evidence added), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK, just validate-stubs and just check-stubs OK. just validate-terms could NOT complete: the ontology service is unreachable, which the validator itself reports as 'not a data error'.

  summary: 'Review: Autosomal Dominant Dopa-Responsive Dystonia'
  details: |
    Comprehensive evidence and scope review through 2026-07-21. Recast classic heterozygous GCH1 disease as the canonical BH4-dopamine branch; separated IMPDH2 dystonia-tremor and NR4A2 dystonia-parkinsonism as provisional molecular subtypes; removed aggregate Orphanet hyperphenylalaninemia, ataxia, gait ataxia, hearing, sleep, anxiety, and fatigue claims from the canonical phenotype graph; added subtype-aware progression, clinical burden, differentials, current literature, datasets, and qualified active observational or diagnostic studies. Preserved the legacy updated_date. Reference caches were generated only through just fetch-reference.

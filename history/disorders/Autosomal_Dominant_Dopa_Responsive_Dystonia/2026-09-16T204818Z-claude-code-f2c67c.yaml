  summary: Bind MONDO:0007495 (dystonia 5) as the GCH1 subtype term
  details: |
    Binds MONDO:0007495 'dystonia 5' as the subtype_term on the 'GCH1-related GTPCH1-deficient DRD' has_subtypes entry, and retires stubs/Dystonia_5.yaml from the curation queue. The stub nominated MONDO:0007495 as uncurated, but the disease is curated here: the stub's own synonyms are 'GTP cyclohydrolase 1-deficient dopa-responsive dystonia', 'Dopa-responsive dystonia; Segawa syndrome AD' and 'dystonia, Dopa-responsive, autosomal dominant', which is exactly this entry's classic GCH1 subtype. The binding is on the subtype rather than on the entry's disease_term because MONDO:0971063 is the broader concept - it also carries the provisional IMPDH2 and NR4A2 branches - while MONDO:0007495 names the GCH1 form specifically. This follows the Cystinuria subtype_term pattern and the approach issue #9868 recommends, so seed-stubs cannot re-nominate the concept. Nothing in the existing tooling could detect this: tidy-stubs matches a stub's own MONDO ID against curated disease_term values (confirmed by running it - Dystonia_5 is not reported), and a subtype-level MONDO ID appears nowhere it looks, which is issue #9846. The stale stub was found during the CMT2K claim run (#10879) because that skill's preflight searches origin/main by label as well as by MONDO ID. The CURIE was not written from memory: it was left unresolved locally, bound, and then resolved and cached through just validate-terms against the configured OLS adapter, which returned 'dystonia 5' as the canonical label. No other content in the entry was changed.

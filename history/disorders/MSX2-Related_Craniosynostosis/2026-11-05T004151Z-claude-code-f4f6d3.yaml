  summary: 'Review round: evidence regrading and endocranial erosions'
  details: |
    Answered the first automated review of PR 16549. Two quotes taken from paper introductions were regraded: the PMID:9917362 sentence restating the earlier binding result is now IN_VITRO with quote_role BACKGROUND and moved from the variant to progenitor-pool edge onto the variant node, and the PMID:8968743 sentence describing the transgenic mice is now MODEL_ORGANISM with quote_role BACKGROUND. Added an Endocranial erosions phenotype citing PMID:23918290, left without an HPO binding because HP:0034271 Copper beaten skull is defined by gyral impressions that the sources do not describe; the OLS queries run are recorded in the phenotype notes. No causal edge was added for it because no source gives one. The suggestion to mark the PMID:8106171 Msx2 expression sentence as BACKGROUND was not taken: its MeSH indexing lists in situ hybridization and the abstract states the expression finding without attributing it to earlier work, so it reads as the paper's own result.

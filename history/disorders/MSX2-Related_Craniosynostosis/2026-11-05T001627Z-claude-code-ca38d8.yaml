  summary: 'Create: MSX2-Related_Craniosynostosis'
  details: |
    New entry for Boston-type craniosynostosis (MONDO:0011481), caused by heterozygous MSX2 missense variants at codon 148. Curated from PubMed abstracts, the Orphanet record ORPHA:1541 and the ClinGen Definitive assertion, then checked against an OpenScientist deep-research report (preflight PASS, all 19 cited references resolved). The pathograph runs from the homeodomain gain-of-function variant (increased DNA binding) through an expanded osteogenic front progenitor pool to premature suture fusion and the skull shape phenotypes. The dominant-negative degradation finding for p.Pro148His is recorded as an alternative hypothesis with no edges. Two Msx2 overexpression mouse models are linked to the pathograph. Skull shape sequelae and the surgical treatment cite a general craniosynostosis review and are marked INDIRECT. The allelic loss-of-function disorder stays in Enlarged_Parietal_Foramina.

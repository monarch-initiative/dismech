  summary: Bind the five locus subtype MONDO terms, the digenic USH1D/F row, and the
    five genes into the pathograph
  details: |
    Genetics pass for the d2g series-035 gap list (issue #12242).

    The issue named kb/disorders/Usher_Syndrome.yaml as the parent entry. That file was deleted
    by #12652 while this work was in flight, and the lumped entry was replaced by four
    mechanism entities plus a grouping. The gap list's MONDO subtype terms are still uncurated
    in the new structure, so the work was re-homed onto the type entities rather than dropped.

    This record covers Usher Syndrome Type 1.

    Added. Each of the five locus subtype rows now binds its MONDO term: USH1B MONDO:0700087,
    USH1C MONDO:0010171, USH1D MONDO:0010984, USH1F MONDO:0011186, USH1G MONDO:0011748. A
    sixth row, USH1DF, binds MONDO:0100050 for the digenic CDH23-plus-PCDH15 form, whose
    inheritance claim neither the USH1D nor the USH1F row makes. The entry bound no gene to any
    pathophysiology node; the five type-1 genes are now bound to the upper tip-link density node
    and to the calyceal-process node, with the two tip-link cadherins additionally on the
    hair-bundle cohesion node, whose own snippet names them. Two evidence items were added to
    source those gene sets from the nodes' own references. Structured case_fractions from a
    684-patient meta-analysis were added to the five causative records, with the denominator
    stated because it is all Usher syndrome rather than type 1.

    Declined, with reasoning in notes: USH1E, USH1H and USH1K (locus-only, no causal-gene
    axiom), USH1J (MONDO has retired the term into the CIB2 nonsyndromic deafness concept, and
    this entry already carries CIB2 as DISPUTED) and USH1M (MONDO:0032841, misparented upstream
    and with uncertain gene evidence).

    Upstream MONDO observation recorded in the entry: MONDO:0010984 carries no causal-gene axiom
    despite CDH23 being one of the five established type-1 genes, which is why the gap list
    omitted it.

    Verification. Every MONDO and HGNC CURIE was read from a lookup against the local builds in
    the same step it was written. Every snippet is from an abstract. One gene binding written
    during this session was removed on self-review because the node's own snippet did not name
    the genes.

    Review round 1 (PR #12741). The reviewer found ten committed reference caches cited
    nowhere in kb/, left over from the pre-#12652 draft. Five of them belong to this entry
    and are now cited as the primary gene-discovery report on the subtype row each one
    established: PMID:7870171 on USH1B, PMID:10973247 on USH1C, PMID:11138009 on USH1D,
    PMID:11398101 on USH1F and PMID:12588794 on USH1G. Before this, every one of those rows
    rested only on the GeneReviews sentence listing all five genes at once, so no row carried
    evidence for its own gene-to-locus assignment. Each new snippet is from the cited paper's
    abstract and all five caches are content_type abstract_only. The five PMIDs were also
    added to the references block, with titles copied from the cache frontmatter.

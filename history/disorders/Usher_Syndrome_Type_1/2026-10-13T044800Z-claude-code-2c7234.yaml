  summary: 'LOINC tranche G: audiometric thresholds and WHO hearing grades'
  details: |
    Bound the pure-tone threshold audiometry panel (LOINC:89015-2) and the eight per-ear 500/1000/2000/4000 Hz threshold codes as diagnosis measurements, plus both the Global Burden of Disease and earlier WHO (1991) better-ear-average hearing-loss grade bands, quoting Olusanya/Davis/Hoffman (PMID:31656340). Same codes, bands and quotes already bound on Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2A and Usher_Syndrome_Type_2 (prior LOINC tranche G batches). Part of LOINC tranche G batch 8 (projects/LOINC_DIAGNOSTICS.md).

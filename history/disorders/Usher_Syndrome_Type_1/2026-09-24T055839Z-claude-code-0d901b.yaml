  summary: 'Create: Usher Syndrome Type 1 (upper tip-link density entity, split from
    lumped Usher_Syndrome)'
  details: |
    Created by splitting kb/disorders/Usher_Syndrome.yaml into four mechanism
    entities plus kb/groupings/Usher_Syndrome.yaml, per the decision recorded on
    issue #10822.

    Scope of this entity: the upper tip-link density (UTLD) complex - MYO7A,
    USH1C, USH1G, CDH23, PCDH15. Five pathophysiology nodes replace the three the
    lumped entry applied to all nine Usher genes. The hair-bundle node is scoped
    to the mature tension-bearing complex rather than to the transient ankle-link
    complex of type 2, and the retinal node names the calyceal-process adhesion
    belt rather than the connecting cilium: the lumped entry's single
    "Photoreceptor Connecting Cilium Dysfunction" node was wrong for this entity,
    not merely imprecise.

    Subtypes USH1B/C/D/F/G are named for the locus rather than the gene, because
    USH1C and USH1G are simultaneously locus designations and HGNC gene symbols.

    Evidence: 48 snippets, all verified against references_cache. Three
    references were fetched for this entry (PMID:21709241 UTLD localization,
    PMID:23045546 calyceal processes) plus a ClinGen gene-validity record for the
    MYO7A-type 1 Definitive assertion and one for the CIB2 Refuted assertion,
    which is curated as a REFUTE evidence item so CIB2 is not re-added later.

    conforms_to declared against sensorineural_hair_cell_loss and
    photoreceptor_degeneration. Neither Usher entry carried any module conformance
    before this change.

    A HUMAN_MODEL_MISMATCH discussion records that mice have no calyceal
    processes, so a negative retinal result in a type-1 mouse model is
    uninformative - which bears directly on preclinical testing for MYO7A gene
    therapy.

    Validated: linkml-validate (Disease), linkml-term-validator --labels,
    linkml-reference-validator (48/48 snippets verified).

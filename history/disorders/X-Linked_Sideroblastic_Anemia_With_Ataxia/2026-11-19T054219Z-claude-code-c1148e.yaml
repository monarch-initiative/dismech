  summary: 'Create: X-Linked Sideroblastic Anemia With Ataxia'
  details: |
    Created the ABCB7 entry (MONDO:0010524). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true; it passed just preflight-dr (ABCB7 mentioned 49 times). No GeneReviews chapter exists for ABCB7; the phenotype baseline is the six or seven published families. The pathophysiology is an unbundled chain of eight nodes, and the central effector is deliberately the export step rather than an assembly step: ABCB7 exports the mitochondrial precursor the cytosolic assembly pathway consumes, so the mitochondrial machinery is intact and the entry conforms to no node of the new iron-sulfur assembly module. The erythroid arm runs through the heme-synthesis block to ring sideroblast formation, and the neurological arm through cerebellar developmental failure, whose selectivity is recorded as inferred rather than demonstrated. Three discussion sections cover the cerebellar selectivity, whether the heme block is direct or mediated by iron regulatory protein 1, and whether an ABCB7 family with ataxia and no anemia belongs to this disease, each with a proposed experiment. MGI:1351646, written from memory for the mouse model's gene, resolves to Abca7 rather than Abcb7 per the Alliance API, so the binding was removed rather than guessed again; the model keeps its genotype and publication. Two MONDO ids for differentials were also written from memory and corrected against sqlite:obo:mondo and the sibling KB entry. GO:0140466 and GO:0140481 were new to the caches and OLS timed out, so they were seeded by running just validate-terms with GO temporarily pointed at the local sqlite build, after which conf/oak_config.yaml was restored with no diff. Review round 1 added strabismus (5/8, the blocking phenotype gap), motor delay and delayed language development, and a treatments section whose central content is a negative result: pyridoxine was refractory in one patient and changed no red-cell index in another, graded REFUTE, including on a target_mechanisms link to the heme-synthesis node. That negative is what separates this disease from pyridoxine-responsive ALAS2 disease and follows from the mechanism, since ALAS2 is not the defective step. A rehabilitative care row is recorded with no evidence item and a note saying why, because no source reports an outcome of rehabilitation in this disease. Also in this round: the Pappenheimer bodies description now states that its only source describes a carrier rather than an affected male; the export node's evidence was regraded MODEL_ORGANISM with quote_role BACKGROUND rather than OTHER; the ABCB7 sequencing diagnosis row now quotes the sequencing result rather than the restriction digest; the GLRX5 differential gained an evidence item; and notes records that a retired GeneReviews chapter exists and is deliberately not used as the baseline. The mouse model's gene binding was NOT restored: the Alliance and Ensembl lookups both timed out in this session, and the earlier error was writing an MGI identifier from memory, so the binding is left absent rather than guessed a second time. Review round 2 corrected the retired-chapter note that round 1 had added. The note said a retired GeneReviews chapter covers the X-linked sideroblastic anemias generally; it is this disease's own chapter, X-Linked Sideroblastic Anemia and Ataxia, now retired, and the loose wording left just check-genereviews reporting CITED_UNTAGGED. The chapter is fetched and tagged GeneReviews in a new top-level references block, the note states what it actually is, and the verdict is now TAGGED_RETIRED, which does not block; withdrawn content is still not used as a phenotype baseline and was not mined. The pyridoxine target_mechanisms effect was also changed from ACTIVATES to RESTORES, because the target node is named Inhibited Heme Biosynthesis and ACTIVATES read literally says the drug increases the inhibition. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues) and just check-entity-refs.

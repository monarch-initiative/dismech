  summary: 'Create: Megalencephaly-polydactyly Syndrome'
  details: |
    New entry for MONDO:0958279, the MYCN gain-of-function megalencephaly-polydactyly syndrome (OMIM 620748). entry_type DISEASE: it has its own MONDO term and is the opposite-direction allelic disorder to Feingold syndrome type 1 (MONDO:0008115), so it is cross-referenced from differential_diagnoses rather than folded into Feingold_Syndrome as a subtype.

    Sources: Kato et al. 2019 (PMID:30573562, index Thr58Met patient), Nishio et al. 2023 (PMID:37710961, full text cached; two further patients, functional assays and the Mycn T58M knock-in mouse), the same group's 2024 review (PMID:38884091), PMID:16139224 for normal N-myc phosphodegron biology, and the ClinGen Moderate AD assertion (CGGV:assertion_57c5c940...). PubMed searches for MYCN with megalencephaly, polydactyly, Thr58/Pro44 and germline found no other patient reports.

    Deep research: one OpenScientist run (no fallback). Reference validation 18/18 resolved. Term validation flagged HP:0100306 offered as Neuroblastoma (it is Muscle fiber hyaline bodies); HP:0003006 was bound instead. The report also states hypoplastic corpus callosum in all three patients, which the source table contradicts (absent in the p.Pro60Leu fetus), and offers an expansion of the acronym MPAPA that could not be verified in MONDO, so no synonym was recorded. Its Aurora-A and BET inhibitor therapy rationale is extrapolated from neuroblastoma models and was not curated.

    Phenotypes not wired to a mechanism (ventriculomegaly, corpus callosum hypoplasia, intellectual disability, developmental delay) have no studied mechanism in the literature. relationship_type CAUSATIVE is reported as overstated by list-gene-validity against ClinGen Moderate; the tier is recorded in gene_disease_validity and explained in genetic notes.

    Validated with just validate, count-verified-snippets (46/46), validate-terms, the per-file offline gates, check-genereviews (NO_CHAPTER), and validate-disorders.

    CI fix: test (3.13) failed check_folded_hyphens.py because a line in the cyclin D node description ended in "megalencephaly-polymicrogyria-polydactyly-". The description was reflowed so the syndrome name sits on one line; no content changed. The whole-repo CI gates were re-run locally afterwards.

    Review round 1: added the facial features the second report gives for all three patients (hypertelorism, wide nasal bridge, depressed nasal bridge, wide nasal base, upturned nasal tip bound to Anteverted nares), plus motor delay, postnatal growth retardation and the single-case findings (ventricular septal defect, tracheomalacia, Meckel diverticulum, pyeloureteral dilatation bound to Dilatation of the renal pelvis). Table 1 rows of PMID:37710961 are quoted for the per-patient counts. Recorded that the paper text and Table 1 disagree on corpus callosum hypoplasia in the fetus, and corrected the intellectual disability description, which had said patient 2 could not be assessed when Table 1 records it as present. Linked the renal model-mismatch discussion to the pyeloureteral phenotype. Low-set ears, retrognathia and short nose (fetus only) were not added.

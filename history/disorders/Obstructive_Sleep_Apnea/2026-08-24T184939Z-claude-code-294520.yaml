  summary: 'Review: Obstructive Sleep Apnea (sleep-disorders sweep)'
  details: |
    Review as part of a sleep-disorders sweep. Repaired a disconnected pathograph: the six pathophysiology nodes carried no causal edges at all, so nothing downstream of upper-airway collapse was linked to it. Added roles, biological_scale, and the full causal chain; corrected the pharyngeal dilator node, which bound 'Muscle Relaxation' to GO:0006939 smooth muscle contraction (wrong muscle type and opposite direction) - now GO:0006937 regulation of muscle contraction with modifier DECREASED. Added a Non-Anatomic Endotypic Traits node (collapsibility, genioglossus responsiveness, arousal threshold, loop gain), which the entry previously omitted entirely despite non-anatomic traits contributing in the majority of patients. Wired five nodes to the new sleep_disordered_breathing_intermittent_hypoxia module and gave CPAP target_mechanisms links. All snippets re-verified against cached abstracts.

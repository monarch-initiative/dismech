  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 2. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. Cited all five previously evidence-free `environmental:` exposures (Obesity, Alcohol, Sedatives, Supine Sleep Position, Nasal Congestion). The Alcohol note asserted upper-airway muscle relaxation, which the citable meta-analysis does not measure; it now states the measured association (OR 1.33) with the mechanism marked as proposed, graded PARTIAL because the authors grade the overall evidence low to very low. Nasal Congestion is PARTIAL for a subtler reason worth preserving: the Wisconsin Sleep Cohort study measures habitual snoring, and its authors state the association was NOT explained by snorers with frank sleep apnea, so it supports raised upper airway resistance rather than an increase in apnea events. Validated with `just validate`, `just count-verified-snippets` and the batched sweep.

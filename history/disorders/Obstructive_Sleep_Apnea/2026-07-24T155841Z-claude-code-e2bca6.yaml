  summary: 'Augment: OSA-dry eye disease pathophysiology (issue #6270)'
  details: |
    Augmented the existing OSA entry with the OSA-to-dry-eye-disease link from PMID:42412736 (Pai et al., Ophthalmic Res 2026), a mechanistic review. Added a pathophysiology node 'Ocular Surface Inflammation and Dry Eye Disease' capturing intermittent hypoxia + oxidative stress driving ocular/systemic inflammation, lacrimal gland dysfunction, and meibomian gland (sebaceous) dysfunction with dysregulated meibum lipid metabolism, producing tear-film instability and both aqueous-deficient and evaporative dry eye; mechanical contributors (face-down sleeping, eye rubbing, CPAP airflow leakage) noted. Added a 'Dry Eye Disease' phenotype (HP:0001097 Keratoconjunctivitis sicca). Terms used: CL:2000021, GO:0006954/0006979/0006629, HP:0001097 - all verified against OAK and present in committed enum caches. Three evidence snippets manually verified as exact substrings of the cached abstract; schema + term validation pass.

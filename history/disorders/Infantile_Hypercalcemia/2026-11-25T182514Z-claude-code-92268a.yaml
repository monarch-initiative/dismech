  summary: 'Gene-family review: CYP24A1 and SLC34A1 typed, subtypes bound, ClinGen
    recorded'
  details: |
    Both genetic records were untyped and their inheritance blocks unbound. The two subtypes are now bound to their MONDO terms (MONDO:0020739 hypercalcemia, infantile, 1 for CYP24A1; MONDO:0014851 hypercalcemia, infantile, 2 for SLC34A1, the two children of the entry's MONDO:0000212) and carry their genes. Each record is now typed CAUSATIVE with germline origin and its subtype, its autosomal recessive inheritance is bound to HP:0000007, and each carries its ClinGen Tubulopathy GCEP Definitive (AR) tier with the subtype named (CGGV:assertion_79d75e39-ce7f-47f7-b60d-05505938452c-2022-10-20T050000.000Z; CGGV:assertion_1b164a17-9f7b-43b2-88b2-2adb8e458c08-2022-10-19T133000.000Z). The SLC34A1 node carried the gene with no molecular function; it now binds sodium:phosphate symporter activity (GO:0005436) as decreased, matching the loss of phosphate transport by mutant NaPi-IIa (PMID:26047794). The CYP24A1 node's generic vitamin D metabolic process became vitamin D catabolic process (GO:0042369), decreased. Seven gene-evidence snippets that stopped before the words carrying their claim were replaced with the full sentences from the same cached abstracts (PMID:21675912, PMID:26047794, PMID:28470390).

  details: |
    Applied the optional suggestions from the automated review of PR 14978. Folinic acid therapeutic_agent rebound from CHEBI:63606 ((6S) stereoisomer) to CHEBI:15640 5-formyltetrahydrofolic acid, since the source says only folinic acid. Added phenotypes from Table 1 of PMID:37035392 (cached full text, table rows quoted exactly) and case-report sentences: Spasticity (2021 patients 3 and 5), Hyperreflexia (2021 patient 4), Hyporeflexia (2020 patient, by sentence, plus both founding family 2 siblings), Esotropia (2023 patient, by sentence), Umbilical hernia, Inguinal hernia and Cryptorchidism (one founding family 2 sibling). Frequencies left unset, as for the entry's other few-patient features, with counts in descriptions. Lennox-Gastaut evolution in one founding family 1 patient added to the Seizure description with the PMID:32612635 table row as evidence; HPO has no Lennox-Gastaut term (OLS search l~Lennox on hp returned nothing). Added Hypoplasia of the corpus callosum from a PMID:33410539 figure legend. No PIGS-specific quotable source for delayed myelination was found in the cached PIGS papers, so the Brain MRI diagnosis description no longer claims it. New neurological phenotypes and corpus callosum hypoplasia are wired from Impaired Neural GPI-Anchored Protein Function with the 2021 background statement as INDIRECT evidence (corpus callosum hypoplasia is developmental, so it is not placed under Progressive Brain Atrophy). Gingival overgrowth is wired from Disturbed Development of Non-Neural Tissues with INDIRECT evidence; hernias and cryptorchidism are left unwired because no source states a mechanism. Feeding difficulties remains without a causal inlink. Added experimental_models (Pigs-knockout mouse F9 cells; PIGS-knockout HEK293 cells with patient-allele rescue) and an animal_models entry (Drosophila PIG-S mutant) with modeled_mechanisms, readouts and evidence. just validate and count-verified-snippets pass (131/131).

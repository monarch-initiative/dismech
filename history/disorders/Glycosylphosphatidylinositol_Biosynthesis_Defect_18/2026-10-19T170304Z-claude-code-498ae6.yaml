  details: |
    New entry for MONDO:0029140 (GPIBD18 / DEE95, PIGS), claimed in issue #14929; deletes the stub. Deep research: research/Glycosylphosphatidylinositol_Biosynthesis_Defect_18-deep-research-claude_code.md (claude_code provider). Its reference validation resolved 10/10 identifiers; the two unmatched quotes were ellipsis-shortened versions of real sentences in PMID:30269814 and PMID:11483512. just preflight-dr returned WARN only because 'GPI' (the anchor, not a gene) was counted as a second gene; the report is about PIGS throughout. Clinical evidence is four case reports/series (PMID:30269814, 32612635, 33410539, 37035392): 14 individuals (12 liveborn, 2 fetuses) from 10 families. Gene-disease validity copied from the ClinGen CGGV record filed against MONDO:0029140 (Definitive, AR); relationship_type CAUSATIVE follows it. check-genereviews --online: NO_CHAPTER. Pathophysiology chain: biallelic PIGS LoF -> impaired GPI attachment (GO:0016255) -> reduced surface GPI-APs -> neural and non-neural developmental nodes -> phenotypes; class-level and Drosophila edges are marked INDIRECT. Death in childhood recorded under progression because HP:0003819 is outside the PhenotypeTerm enum. PMID:38456468 cache was refetched as full text (it was abstract-only) to quote its PIGS alkaline phosphatase sentence. Validated with just validate, validate-disorders (107 snippets, 0 issues), count-verified-snippets, check-causal-targets, list-disconnected-phenotypes (37/39 connected), check-genereviews and check-gene-validity.

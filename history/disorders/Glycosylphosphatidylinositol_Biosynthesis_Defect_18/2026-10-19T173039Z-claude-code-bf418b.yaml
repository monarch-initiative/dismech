  summary: 'Red-team review: Glycosylphosphatidylinositol Biosynthesis Defect 18'
  details: |
    Adversarial review before PR. Pyridoxine treatment rewritten to per-patient outcomes (five treated: seizures decreased in two, seizure-free in one, development improved in one, outcome not reported in one) with the 2023 authors' caution quoted; removed the unsupported claim that CSF pyridoxal 5'-phosphate was never measured in any patient (only the 2021 series says it could not be measured). Added the founding report's lymphocyte FLAER evidence for the lymphocyte cell type. Hypotonia frequency lowered from VERY_FREQUENT to FREQUENT because Table 1 of PMID:37035392 records it absent in three of the 2021 patients, contradicting that paper's own text. Moved the Microcephaly edge from Progressive Brain Atrophy to Impaired Neural GPI-Anchored Protein Function because microcephaly is listed among congenital anomalies, not as a consequence of atrophy. Grouping row: removed an unsourced comparative severity claim against GPAA1. Confirmed the ClinGen CGGV record is filed against MONDO:0029140, the 14-individual/10-family count against Table 1 of PMID:37035392, and that the full-text upgrade of PMID_38456468.md still verifies all 404 snippets in the six entries citing it.

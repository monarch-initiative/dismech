  summary: 'Review response: wire the isolated phenotypes into the pathograph'
  details: |
    Second session on this entry, responding to two rounds of review on #10383.

    Round one addressed a single orphaned phenotype (Recurrent respiratory infections, whose description asserted an aspiration mechanism that no edge carried) by adding a sequelae edge from Aspiration, and added five phenotypes for the severe end of the disease. That was half the fix: the five new phenotypes were themselves added without edges, so repairing one orphan created five more, and the reviewer's second round correctly blocked on it. The first attempt at those phenotypes also quoted table cells (for example 'Apnea 17 (19)'), which check-snippet-length rejected as non-propositional; they were re-anchored to the severity-criteria sentence in PMID:26924742 and the operative-indication sentence in PMID:18392498, and a plain Apnea phenotype was dropped rather than kept on a table cell.

    Round two wired all of them in. Dynamic Supraglottic Airway Obstruction now carries five further downstream edges, each with its own evidence item: Dyspnea and Intercostal retractions as DIRECT, and Cyanosis, Obstructive sleep apnea and Gastroesophageal reflux as INDIRECT_KNOWN_INTERMEDIATES. The reflux edge is the one that needed a decision. The reviewer suggested drawing it from Reflux-Associated Supraglottic Oedema, but that node's own claim runs reflux to oedema to obstruction, so an edge out of it to the reflux phenotype would reverse its meaning. It is instead drawn obstruction to reflux on the other half of the same literature, quoting the source's explicitly hedged sentence that some posit CLM can lead to reflux disease by affecting the thoraco-abdominal pressure gradient. The edge description states that this is one of two competing directions and points at the clm_reflux_causal_direction discussion, and directness is INDIRECT because the source sentence is a hedge rather than a finding. The graph therefore now carries both directions without asserting that the dispute is settled.

    Growth delay was folded into Failure to thrive rather than wired separately, taking the reviewer's non-blocking observation that the two were distinguished only by which word the surgical and feeding literatures use, which is provenance rather than phenotype. The PMID:18392498 quote is now a second evidence item on Failure to thrive, marked INDIRECT because the source says growth delay. No phenotype in the entry is now an isolated node and no causal target dangles, checked by building the edge set from the file rather than relying on check-causal-targets, which detects targets resolving to nothing and not nodes that nothing resolves to.

    Tracheostomy was rebound from the generic NCIT:C15329 Surgical Procedure to NCIT:C15341 Tracheotomy, keeping preferred_term tracheostomy for the procedure and stoma distinction. The two cache rows for HP:0030864 that the previous push left uncommitted were committed; running just validate-terms had written them and I had not checked whether it wrote anything. The roughly ten percent operative rate from PMID:18392498 was added to Expectant Management, since it is the figure that makes watchful waiting a default rather than a gamble.

    Not taken: rebinding Dyspnea to a respiratory-distress observable. The source says severe dyspnea and the phenotype is anchored to that quote, so relabelling it would leave the binding describing something the snippet does not say.

    Validation: just validate clean (schema, terms, references, 47/47 snippets verified), plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-term-cache-integrity, all clean.

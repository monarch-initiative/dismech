  summary: 'Create: Congenital Laryngomalacia (MONDO:0007878)'
  details: |
    De-novo curation of congenital laryngomalacia from a Perplexity deep-research report (research/Congenital_Laryngomalacia-deep-research-perplexity.md, sonar-deep-research, 22 citations). The report's reference_validation frontmatter reported 5 of 5 references resolved with a confabulation rate of 0.0, which is misleading read alone: it cites 22 sources, so only 5 were identifiers the validator could see. Three of the 22 are not citations in any form (a fragment of prose, the phrase Poiseuille's law, and the bare string 'Landry et al'), and the remainder are web pages. Every claim retained was re-anchored to a PMID resolved from the report's PMC URLs and from a PubMed title search, fetched with just fetch-reference, and quoted from the fetched text. The report's ontology bindings were not reused; UBERON:0001737 was offered as epiglottis when it is larynx (correct epiglottis term UBERON:0000388). The entry's substantive framing choice is to make the trigger node immature sensorimotor integrative function of the larynx rather than cartilage softness, following the laryngopharyngeal sensory testing evidence (PMID:17513991) in which the laryngeal adductor reflex threshold tracks severity and normalises in step with symptom resolution. Reflux is modelled as an aggravating node rather than an upstream cause, because the causal direction is disputed and an upstream model would predict an effect on disease duration that the evidence does not show; that choice is recorded in review_notes and raised in a KNOWLEDGE_GAP discussion. No numbered Type 1/2/3 anatomic subtypes are asserted, because the sources consulted assign those numbers to different anatomy; a second discussion records that. The expectant-management treatment is left with an unbound treatment_term: NCIT:C15722 Patient Observation is not reachable from NCIT:C25218 and is correctly rejected by the TreatmentActionTerm enum, since watchful waiting is the decision not to intervene, and no NCIT clinical action term expresses it. Validated with just validate (schema, terms, references: 33/33 snippets verified) plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values, all clean.

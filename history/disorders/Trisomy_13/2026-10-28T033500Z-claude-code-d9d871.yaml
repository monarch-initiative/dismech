  details: |
    Removed the target_mechanisms link from Supportive and Palliative Care to Impaired Forebrain/Midline Development; supportive care does not act on a prenatal forebrain-cleavage defect, and no cited source names a phenotype the care treats. Marked the PMID:24340511 perinatal-mortality snippet on that treatment directness INDIRECT and rewrote its explanation so it no longer claims the paper discusses management. Added PMID:30855930 (StatPearls, Patau Syndrome) as REVIEW_SYNTHESIS evidence that aggressive medical therapy has lengthened survival in some patients, and listed it under references with a StatPearls tag. Softened the explanation on the karyotype Methods snippet to what it shows: the cohort was confirmed cytogenetically. Added a node note that the GO:0007059 chromosome segregation binding describes how the lesion arises, not ongoing missegregation in the patient. Validated with just validate, count-verified-snippets, validate-terms and check-causal-targets.

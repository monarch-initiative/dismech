  details: |
    LOINC tranche F batch 3. Same specimen-scope trap as HER2_Positive_Gastric_Cancer in this batch: this entry's own cited evidence states a unified HER2 scoring system was not established in CRC, and names colorectal-specific HERACLES criteria distinct from breast. Bound LOINC:18474-7 (tissue-generic HER2 IHC presence), not the breast-specimen code bound on HER2_Positive_Breast_Cancer. Bound LOINC:49683-6 (tissue-generic FISH ratio, reused from the batch-2/batch-3 siblings -- its own label never names breast tissue, so no trap there). Bound LOINC:42783-1 (ERBB2 gene mutations found, Blood or Tissue, Molecular genetics method) for the 'Next-Generation Sequencing' row. No interpretation_bands recorded: the cited evidence confirms each method but does not quote the numeric ratio/copy-number thresholds this row states. All three codes newly seeded (49683-6 also on the still-open sibling loinc-f-batch2, an expected non-blocking collision). just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

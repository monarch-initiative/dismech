  summary: 'Create: severe X-linked intellectual disability, Gustavson type'
  details: |
    Created the RBMX Gustavson-type XLID entry (MONDO:0010661) for claim issue 11065. Six-node pathophysiology chain from the hemizygous in-frame RBMX deletion NM_002139.4 c.484_486del p.(Pro162del) through disrupted hnRNP G SH3-binding-motif interaction and dysregulated RNA polymerase II transcription to impaired brain development, profound neurodevelopmental impairment and death in early childhood; ten HP-bound phenotypes; RBMX (causative) and RBMXL1 (modifier) genetic entries; X-linked recessive inheritance bound to HP:0001419 with the skewed-XCI carrier-protection finding; ULTRA_RARE CASES_IN_LITERATURE prevalence; supportive care and genetic counseling treatments; Shashi syndrome differential positioning the two allelic RBMX disorders; a zebrafish rbmx morphant animal model linked to the brain-development node; and two discussions (a KNOWLEDGE_GAP on the unresolved loss-of-function vs N-terminal gain-of-function reading of p.Pro162del, and a HUMAN_MODEL_MISMATCH on RBMXL1 retrocopy buffering in rodent models). Evidence comes from PMID:8456840 (1993 clinical report), PMID:8503440 (1993 Xq26 linkage), PMID:37277488 (2023 RBMX discovery, full text), PMID:42360281 (RBMX retrocopy cohort study), PMID:15895365 (zebrafish rbmx morphant) and PMID:19282290 (hnRNP G splicing function), each fetched into references_cache and quoted from its own cached record. An Edison/falcon deep-research run was performed; gene-drift check passed (35 RBMX, 76 Gustavson, 14 Pro162del mentions, no drift), report validation was clean (9/9 references, 27/27 terms resolved, no unresolved terms), and preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0010661, so identity was confirmed manually by matching report OMIM 309555 to MONDO OMIM 309555 and by verifying the RBMX attribution against PMID:37277488 directly. The report carries no PMIDs and contributed no citable claim; nothing was quoted from it. No GeneReviews chapter exists for Gustavson syndrome or RBMX-related intellectual disability (PubMed searches returned no results). Validated with just validate, count-verified-snippets (49/49), validate-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-environmental-evidence and validate-disorders, all passing.

    Addressed the round-2 CHANGES_REQUESTED review on PR 11072, whose three findings all concerned the round-1 tree. Finding 1: the notes claimed no quotable sentence carries growth impairment, but the patient V:7 photograph legend in references_cache/PMID_37277488.md carries short stature verbatim; added a Short stature phenotype bound to HP:0004322 quoting that legend (single patient, no frequency band) and corrected the notes sentence. The prior round-1 history record repeats the superseded claim and is left untouched because history is append-only; this record is the corrected account. Finding 2: the Abnormal facial shape description claimed the sources do not itemize the dysmorphic features, but the same legend itemizes five of them; rewrote the description to say what the sources actually contain, added a second evidence item quoting the itemization, and kept the binding at HP:0001999 with the reasoning stated - the syndrome-level claim is the family-level gestalt, one child's features are thin ground for syndrome-level rows, and puffy eyelids overlaps the allelic Shashi gestalt. The reviewer's optional suggestion to promote High palate to its own phenotype row was declined on the same grounds, with the reasoning recorded in notes and in the PR comment. Finding 3: Cerebellar vermis hypoplasia and Thin corpus callosum, added in round 1 from the same MRI sentence as Lissencephaly, had no incoming pathograph edge while their sibling did; both are now DIRECT downstream of Impaired Brain Development. Also added an explicit scope-out paragraph in notes naming the single-observation features deliberately not curated (V:7's remaining facial items, overweight, hemangiomas, and the deep-research-only items Dandy-Walker malformation, cerebral atrophy, ventriculomegaly, subependymal gliotic nodules, dysplastic ears, micrognathia, ureteral reflux, neurogenic bladder - verified absent from every cited cache), per the reviewer's completeness cross-check asking that scoping-out be stated rather than implicit. Entry now has 14 phenotypes, 6 pathophysiology nodes, 18 edges and 56 verified snippets. Re-validated with just validate, count-verified-snippets 56/56, validate-terms, check-folded-hyphens, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and the three baseline gates against the branch base ec7e406616, plus the authoritative just validate-disorders, all passing.

  details: |
    Addressed the CHANGES_REQUESTED review from ai4c-reviewer and six inline suggestions from claude on PR 11072. Finding 1: congenital heart defects had been dropped on the stated grounds that the sentence carrying them was broken across a page-header insertion in the cached full text; that claim was wrong. Only the sentence's opening is broken, and lines 196-197 of references_cache/PMID_37277488.md carry a contiguous ligature-free run. Added a Congenital heart defect phenotype bound to HP:0001627 (canonical label Abnormal heart morphology, with the specificity carried in preferred_term), left unwired from the pathograph because no source gives a mechanism from the RBMX allele to a cardiac lesion, and corrected the notes paragraph that made the false cache claim. Growth impairment stays uncurated on the honest ground that no quotable sentence carries it. Finding 2: four snippets stopped just before the words carrying their claim and were extended to the full ligature-free sentence - the SH3 caveat now quotes 'Thus, the variant effect is context dependent and likely complex in vivo.', the splicing-exclusion snippet now names RBMX and the investigated tissues, the severity snippet now carries the subject Gustavson and the qualifier 'described in this gene family so far', and the loss-of-function snippet in the gustavson_lof_versus_gof_mechanism knowledge gap now names hnRNP G function. The one truncation the reviewer said should stay (the threefold-weaker peptide affinity, which cannot be extended because the next cache word carries a U+FB01 ligature) was left as is. Non-blocking suggestions also taken: Blindness is now wired as a sequela of Optic atrophy, Abnormal facial shape as a parallel INDIRECT_UNKNOWN_INTERMEDIATES consequence of the variant node, two further single-patient MRI phenotypes added (Cerebellar vermis hypoplasia HP:0001320, Thin corpus callosum HP:0033725) from the same figure legend already quoted for lissencephaly, and therapeutic_modality OTHER 
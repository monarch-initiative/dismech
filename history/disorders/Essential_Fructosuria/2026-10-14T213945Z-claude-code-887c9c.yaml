  details: |
    New entry for essential fructosuria (MONDO:0009252), the benign autosomal recessive deficiency of ketohexokinase caused by biallelic KHK variants. The pathograph runs from biallelic KHK loss of function to hepatic KHK-C deficiency, failure of hepatic fructose phosphorylation, accumulation of unmetabolized fructose in the blood, and then three branches: renal excretion (fructosuria and a non-glucose reducing substance in urine), slow extrahepatic phosphorylation by hexokinase, and raised erythrocyte fructose 3-phosphate. All four phenotypes are causally connected. Variants recorded are p.Gly40Arg (null in recombinant enzyme), p.Ala43Thr (thermolabile, KHK-C selective) and the common non-pathogenic p.Val49Ile; no cDNA coordinates are given because none of the cited abstracts states them. Treatment is recorded as none needed, with reassurance. Differentials link the existing Hereditary_Fructose_Intolerance and Fructose-1,6-Bisphosphatase_Deficiency entries, plus diabetes mellitus and a renal tubular hexose reabsorption defect. Three Khk knockout mouse lines and the Allen and Musante whole-body fructose model are linked to pathograph nodes. KHK inhibitor drug development is deliberately out of scope; it appears only in a knowledge-gap discussion about long-term outcome.

    Deep research: one OpenScientist report (research/Essential_Fructosuria-deep-research-openscientist.md). Reference validation: 14 of 14 references resolved, 17 of 17 quotes found, 11 judged on topic and none off topic. Term validation flagged needs_review; the report's CL:1000452 (parietal epithelial cell) and CL:0002253 (epithelial cell of large intestine) were offered for kidney and intestinal epithelium and are wrong, and its HPO suggestion HP:0032262 for fructosuria is Pulmonary tuberculosis in HPO (not listed by the term validator). None of these were used; fructosuria is bound to HP:6000804 Elevated urine fructose level. just preflight-dr returned PASS (KHK mentioned 87 times). Report citations used: PMID:7833921, 29870677, 29664676, 18035330, 26316589. Not used: the report's own gnomAD v4 allele-frequency and constraint figures and its derived prevalence of about 1 in 2 million, because they are report-internal computations with no committed analysis artifact; PMID:25187370 and 39418102 (KHK in diet-induced metabolic disease, outside the scope of the inherited deficiency); PMID:19237742, 38805243 and 41070915 (KHK crystal structures, not needed for any curated claim); PMID:8662230 (chromosomal co-localization with GCKR); PMID:35838297, 30798914 and 41781320 (general fructose metabolism and imaging context). Primary literature beyond the report: Asipu 2003 recombinant enzymes (PMID:12941785), Boesiger 1994 liver 31P MRS (PMID:7816517), Petersen 1992 erythrocyte fructose 3-phosphate (PMID:1308858), Tran 2017 review (PMID:28368361), Johnston 2021 UK Biobank (PMID:33621267), Diggle 2009 and 2010 (PMID:19365088, 20841500), Hayward 1998 splicing (PMID:9799106), two fructosuria differentials (PMID:30675358, 40428357) and Orphanet ORPHA:2056. No GeneReviews chapter exists (check-genereviews NO_CHAPTER, offline and online). Laron 1961 (PMID:13759156) is mentioned in notes but not cited because no abstract text was retrieved. An ECTO binding for dietary fructose exposure (ECTO:0900134 exposure to fructose via ingestion, found in OLS) was not added because the ECTO SQLite build could not be fetched to validate it. Validation: just validate, validate-terms, count-verified-snippets 70/70, entity-ref, causal-target, duplicate-key, enum, block-scalar and whole-KB snippet gates all passed.

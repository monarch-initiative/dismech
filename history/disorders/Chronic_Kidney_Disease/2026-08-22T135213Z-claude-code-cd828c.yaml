  summary: Add plasma albumin Mendelian randomization signal from PMID:40973818
  details: |
    Added one research biomarker entry for circulating plasma albumin, distinguished in the `specificity` field from urinary albumin, which is the established CKD marker. The atlas recovers a bidirectional causal relationship between albumin level and chronic kidney disease, consistent with earlier work; no `presence` value is recorded because bidirectionality means the sign cannot be attributed to one direction. A second evidence item, marked PARTIAL, carries the authors' own therapeutic caveat that lowering albumin might reduce CKD events while raising metabolic-disease risk -- PARTIAL because that sentence is an interpretation of a possible trade-off, not a tested intervention result. No readouts were added: the bidirectional signal does not identify which pathophysiology node albumin reports on. The MetRS entry added to the diabetes entries in this tranche was deliberately NOT added here even though the paper reports CKD classification at AUC 0.933, because every span of that sentence naming CKD contains thin spaces and could not be quoted as a clean ASCII snippet; citing the general abstract sentence instead would have been a real paper cited for a claim it does not make. No ontology terms were added.

    Source: PMID:40973818, You J et al., 'Mapping the plasma metabolome to human health and disease in 274,241 adults', Nat Metab 2025. UK Biobank cohort, Nightingale Health NMR panel of 313 plasma measures, median 14.9 years of follow-up, with bidirectional Mendelian randomization and a machine-learning metabolic risk score (MetRS) built from the top 30 measures. All snippets were taken from the cached full text and verified as exact ASCII substrings before commit; spans containing the article's thin spaces, en dashes and unicode minus signs were deliberately avoided because no existing kb/disorders snippet uses non-ASCII characters.

    Validation run over all six edited files: `just validate` (schema, pass); `just count-verified-snippets` (446/517 verified against cached references, 71 skipped by prefix, 0 failures); the five ungated CI gates -- check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys -- all pass; and `just validate-disorders` over all six files (schema + terms + references batched, exit 0; the 12 reported issues are pre-existing WARN-level unfetchable EGA and Metabolomics Workbench dataset accessions, not errors, and are untouched by this change).

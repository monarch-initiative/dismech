  summary: 'Address PR #7110 review: add tobacco smoking exposure'
  details: |
    PR Shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review on #7110.

    Blocking item: added the missing Tobacco Smoking environmental exposure, bound to ECTO:6000029 (exposure to tobacco smoking; already present in cache/ecto/terms.csv and the exposureterm enum membership cache, so no new term was introduced), with two verified exact-quote evidence items from PMID:28339863 (Xia et al., Nephrol Dial Transplant 2017; meta-analysis of 15 prospective cohorts, 65064 incident CKD cases), fetched via just fetch-reference. Quoted the RESULTS and CONCLUSIONS sentences rather than the paper title, per the 'a title is not a finding' rule. Recorded the reported null smoking-proteinuria association in notes so the exposure is not over-claimed as acting through albuminuria.

    Non-blocking review items also applied: effect strings replaced with the repo's short-token convention (CAUSATIVE/HARMFUL), independently verified as dominant across kb/disorders before adopting; exposure_term preferred_term values now mirror their ECTO labels; redundant one-line notes stubs dropped; the uncited 'papillary necrosis' clause removed from the NSAID description (the cited PMID:30281062 abstract does not mention it); calcineurin inhibitors and proton pump inhibitors added to the nephrotoxic chemicals list, both named in the already-cited snippet.

    Also merged origin/main into the branch to clear three merge conflicts, taking the union in each case: this branch's Nephrotoxic Medications enrichment plus main's newly added HIV/HIVAN and tenofovir (TDF) exposures in the disorder YAML, and both sides' added rows in cache/ecto/terms.csv and the exposureterm enum cache.

  summary: 'Create: DEE with Spike-Wave Activation in Sleep'
  details: |
    De novo curation of developmental and/or epileptic encephalopathy with spike-wave activation in sleep (MONDO:0800501), covering the syndrome formerly called continuous spike-and-wave during sleep. Nine-node pathograph with two roots, a heterogeneous genetic etiology and an early thalamic injury, converging through selective thalamocortical disconnection on an abnormal frequency-dependent cortical excitability node, the augmenting response, which is then potentiated specifically in non-rapid-eye-movement sleep by the coincidence of reduced brainstem activation and spindle-band drive. That sleep-potentiated activation branches into disruption of sleep-dependent synaptic plasticity leading to developmental regression, into clinical seizures, and into the developmentally gated spontaneous remission of the electrographic pattern. Two nodes conform to epilepsy_excitation_inhibition_imbalance at the hyperexcitability and recurrent-seizure nodes; the scope note records why the module is joined there rather than at its ion-channel trigger, and that the state-dependence which defines this syndrome is not something the generic module captures. Four discussions: a CONTROVERSY on whether the sleep discharge actually causes the regression or is a parallel consequence of the same lesion, curated with the randomized trial evidence and its own stated limitations on both sides; a CONTROVERSY on whether the ILAE DEE-SWAS versus EE-SWAS split is a real boundary or a description of the starting point; a KNOWLEDGE_GAP on why corticosteroids work when no immune mechanism is established; and a KNOWLEDGE_GAP on the developmental gating of onset and spontaneous remission. Deep-research cross-check with the claude_code provider prompted the has_subtypes split and the steroid-mechanism discussion; its suggestion to curate a numeric spike-wave index threshold was declined and the reason recorded in the diagnosis record, since the published thresholds disagree and the ILAE definition does not mandate one. MONDO:0800501 required local sqlite seeding of the DiseaseTerm enum cache per the known OLS timeout issue; conf/oak_config.yaml was restored unchanged afterwards. Validation: schema passed, term validation passed, 57/57 evidence snippets verified against cached references, snippet-length check clean, pathograph self-check clean.

  summary: 'Review round 1: histopathology, diagnosis, inflammation split'
  details: |
    Changes made in response to review round 1 of PR 13076. Added a histopathology section with three findings: vacuolar degeneration of upper spinous and granular keratinocytes (NCIT:C96302 Cytoplasmic Vacuolation), perinuclear tonofilament clumping (left unbound: HP:0034067 Tonofilament clumping is outside the HistopathologyFindingTerm enum, and NCIT:C45956 describes concentric aggregates the sources do not report), and a thickened granular layer and stratum corneum (NCIT:C35541 Hyperkeratosis; HP:0025114 Hypergranulosis is outside the enum). Added a diagnosis section for skin biopsy (NCIT:C51692) and KRT1/KRT10 sequencing (NCIT:C153598), sourced from the Danish cohort full text (PMID:22930352). Split the combined inflammation node into Keratinocyte NLRP3 Inflammasome Activation and IL-18 Release (PMID:36656063) and Cutaneous TH17 Inflammation (PMID:40288548), each fed from Keratin Filament Network Collapse and Aggregation by an INDIRECT_UNKNOWN_INTERMEDIATES edge. No edge joins the two, because no cited source links IL-18 to TH17 skewing in this disease. IL-17A blockade and the pruritus edge now point at the TH17 node. Other changes: quote_role REVIEW_SYNTHESIS on the PMID:15663649 review items; emollients rebound to NCIT:C121969 Skin-Directed Therapy with therapeutic_modality OTHER; the skin pain phenotype keeps HP:0012531 Pain, because OLS searches of HP found no skin-specific pain term, and now has preferred_term Skin pain; the German cohort finding that KRT10 patients spread evenly across severity forms (PMID:38741524) added to the dominant genetic row; the explanation on the TH17 snRNA-seq evidence now says it is unclear whether KRT10 patients were sampled. Collodion presentation and neonatal dehydration in the recessive subtype were not added, because the cached abstract of PMID:20302579 does not state either. The Perplexity report committed in the previous round is truncated after section 7.2, so its sections 8 to 15 (diagnostics, prognosis, treatment, other species, model organisms) are missing. Validated with just validate-disorders (70/70 snippets), validate-terms, check-causal-targets, check-entity-refs and list-disconnected-phenotypes (11/11 connected).

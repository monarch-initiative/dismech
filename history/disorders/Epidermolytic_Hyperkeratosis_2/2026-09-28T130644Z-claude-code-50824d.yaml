  summary: 'Create: Epidermolytic Hyperkeratosis 2'
  details: |
    New entry for the KRT10 form of epidermolytic ichthyosis (MONDO:0958184), structured in parallel with KRT1_Keratinopathies. Three has_subtypes rows bind the MONDO children of MONDO:0958184: MONDO:0700248 (autosomal dominant), MONDO:0700245 (autosomal recessive null) and MONDO:0100303 (annular epidermolytic ichthyosis 1). Ichthyosis with confetti (MONDO:0012208) was left out because MONDO does not place it under MONDO:0958184, it is caused by KRT10 or KRT1, and its frameshift and revertant-mosaicism mechanism differs. Six pathophysiology nodes (dominant-negative and null KRT10 alleles, filament collapse, suprabasal cytolysis, compensatory hyperproliferation, IL-18/IL-17 inflammation) connect to all 11 phenotypes. A Perplexity deep-research report was produced: the first run failed with a server disconnect, and a rerun with a streaming request succeeded (research/Epidermolytic_Hyperkeratosis_2-deep-research-perplexity.md). The entry was first curated from PubMed abstracts fetched with just fetch-reference, and the report was then screened as leads only. Its body stops after section 7. just preflight-dr could not run because the local MONDO build is absent. Its Term Validation section flags UBERON:0001510 and UBERON:0001509 as named for other structures (skin of knee, triceps brachii, called palm and sole), and UBERON:0001511, UBERON:0002330 and UBERON:0007798 as loose matches; none of its CURIEs were used. Several claims it attributes to PMID:21271994 (17 of 28 de novo, 87% missense, recessive collodion cases, p.Gln434X) are not in that abstract, and its Danish prevalence of 1 in 2,300,000-4,350,000 contradicts the cited 1 in 350,000 (PMID:22930352). The one lead taken from it is the keratin 10 null mouse (PMID:11408568), added with the mutant K10 transgenic mouse as an animal_models section; the null mouse is recorded as FAILS_TO_RECAPITULATE suprabasal cytolysis, a species difference from human recessive disease. Validated with just validate-disorders (schema, terms, 62/62 snippets), check-causal-targets, check-entity-refs, list-disconnected-phenotypes (11/11 connected), check-genereviews (no GeneReviews chapter in the Bookshelf index; StatPearls chapter tagged) and list-gene-term-mismatches.

  summary: 'Create: Epidermolytic Hyperkeratosis 2'
  details: |
    New entry for the KRT10 form of epidermolytic ichthyosis (MONDO:0958184), structured in parallel with KRT1_Keratinopathies. Three has_subtypes rows bind the MONDO children of MONDO:0958184: MONDO:0700248 (autosomal dominant), MONDO:0700245 (autosomal recessive null) and MONDO:0100303 (annular epidermolytic ichthyosis 1). Ichthyosis with confetti (MONDO:0012208) was left out because MONDO does not place it under MONDO:0958184, it is caused by KRT10 or KRT1, and its frameshift and revertant-mosaicism mechanism differs. Six pathophysiology nodes (dominant-negative and null KRT10 alleles, filament collapse, suprabasal cytolysis, compensatory hyperproliferation, IL-18/IL-17 inflammation) connect to all 11 phenotypes. A Perplexity deep-research run was requested but failed with a server disconnect, so no report is committed and all evidence was drawn from PubMed abstracts fetched with just fetch-reference. Validated with just validate-disorders (schema, terms, 58/58 snippets), check-causal-targets, check-entity-refs, list-disconnected-phenotypes (11/11 connected), check-genereviews (no GeneReviews chapter in the Bookshelf index; StatPearls chapter tagged) and list-gene-term-mismatches.

  summary: Bind keratin 10 molecular function on the KRT10 variant nodes
  details: |
    Added molecular_functions GO:0030280 structural constituent of skin epidermis to the two pathophysiology nodes that the KRT10 genetic entries reach: KRT10 Dominant-Negative Rod-Domain Variant (modifier ABNORMAL, the mutant chain poisons the network) and Biallelic KRT10 Null Alleles and Keratin 10 Absence (modifier ABSENT, no keratin 10 protein is made). GO:0030280 was read from OLS, is a molecular function term that GO annotates to human keratin 10 (UniProt P13645) with IDA, IBA and NAS evidence in QuickGO, and validated in the molecular-function dynamic enum. This satisfies check_gene_activity_grounding.py, which landed on main after the branch was cut. Validated with just validate-disorders, validate-terms, check-causal-targets and check-entity-refs.

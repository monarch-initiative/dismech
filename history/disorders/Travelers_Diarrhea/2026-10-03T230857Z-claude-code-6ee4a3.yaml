  summary: 'Rung-3 review: restructure the E. coli pathotypes, record the non-E. coli
    lump, add transmission'
  details: |
    Applied the rung-3 and rung-3a rules of the infectious-disease granularity ladder (design decisions section 3e, rules R6 to R16) plus the rule R25 transmission requirement. The entry was reported PATHOTYPE_COLLAPSE, MISSING_TRANSMISSION and TAXON_LUMP.

    PATHOTYPE_COLLAPSE, the one deterministic finding here, is fixed. Three infectious_agent records, for enterotoxigenic, enteroaggregative and enteropathogenic E. coli, were each bound to NCBITaxon:562, which rule R15 forbids: the species CURIE cannot be the identity of a pathotype, and each record's own description said as much in free text. They are replaced by a single Diarrheagenic Escherichia coli agent bound at the one rank the ontology does carry, and the pathotypes move to disease-level has_subtypes rows with classification pathotype, which is what rule R13 prescribes for a stratum defined by gene content below any named rank. Rule R14 asks the row to name the determinant, and the Croxen review (PMID:24092857, newly fetched as full text) supplies all three: ETEC is defined by its ability to produce a heat-labile or heat-stable enterotoxin together with colonization factors; typical EPEC carries the LEE and the bundle-forming pilus gene and, like EAEC, makes neither enterotoxin; EAEC's aggregative adherence fimbria variants are encoded on the pAA virulence plasmid with the AggR regulator, and its reference identification method is a HEp-2 cell adherence assay rather than a toxin assay, which is a diagnosis-axis difference as well. No subtype_term is bound on any row: no NCBITaxon node exists at pathotype rank, MONDO has no pathotype class, and binding the parent species is the error being repaired.

    The non-E. coli agents, norovirus, Campylobacter jejuni, Shigella, nontyphoidal Salmonella enterica and Giardia duodenalis, were assessed under rule R7 and deliberately lumped, recorded in review_notes with the sentinel paragraph section 3e specifies. Each of them does differ from the others on presentation and on therapy, and that is the reason they are not strata of this entry: they are the agents of named clinical entities the field diagnoses and treats in their own right, and four are already curated here as their own Disease entries (Campylobacteriosis, Shigellosis, Invasive_Non-Typhoidal_Salmonellosis, Giardiasis). Travel is the setting in which those diseases are acquired, and the ladder's own exclusions make a transmission setting not a granularity axis, so promoting them would curate one disease at two rungs, which rule R20 forbids. Whether this entry belongs at rung 2 at all rather than as a rung-1 grouping over those entities is surfaced in the same paragraph and left to issue 10115, because converting it would move content out of a curated pathograph; that is a judgement for a maintainer, not a side effect of a lump/split pass.

    MISSING_TRANSMISSION was fixed with two fecal-oral routes, food and water, quoted from the clinical review already cited by the entry's environmental records (PMID:31084597), with the CDC Yellow Book chapter on restaurant food handling in high-income countries and the Croxen review on sewage contamination of drinking and recreational water. The route descriptions were deliberately trimmed back to what the snippets support after a first draft asserted animal faeces and swimming exposure that no cited source states.

    Nothing else was touched: disease_term, its skos:closeMatch mapping, pathophysiology, phenotypes, environmental, diagnosis, treatments, experimental_models, datasets and discussions are unchanged, and no progression or agent_life_cycle block was added. The existing review_notes paragraph is unchanged and the new paragraph sits above it. Validation: just validate-disorders over the four entries in this tranche reported 248 snippets checked and 0 issues; just check-granularity on this file reports none of the three findings it opened with.

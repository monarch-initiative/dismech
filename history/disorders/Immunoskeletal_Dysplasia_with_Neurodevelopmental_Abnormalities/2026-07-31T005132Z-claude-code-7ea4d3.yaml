  summary: 'Create: Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities
    (EXTL3, MONDO:0044312)'
  details: |
    De novo curation of ISDNA (MONDO:0044312; OMIM:617425; EXTL3/hgnc:3518).

    Deep research: Edison Scientific (falcon) via `just research-disorder falcon` - report at research/Immunoskeletal_Dysplasia_with_Neurodevelopmental_Abnormalities-deep-research-falcon.md (707s run, 20 citations, 1 artifact). An initial falcon attempt failed with a transient 403 from the Edison auth endpoint and was rerun successfully.

    NEC preflight: the MONDO:0044312 obo record confirms gene EXTL3 (RO:0004003 HGNC:3518), xref OMIM:617425, synonym ISDNA. Gene-frequency check on the DR report: EXTL3 mentioned 60x, no competing gene (EXT1/EXT2/EXTL2 all 0), single OMIM id cited (617425) matching the MONDO xref. No NEC signal.

    GeneReviews: PubMed searched for both "EXTL3[TI] GeneReviews[TI]" and "immunoskeletal dysplasia GeneReviews[All Fields]" - no GeneReviews chapter exists for this disorder, so no mandatory phenotype baseline applied.

    Sources: curation is anchored on the two 2017 founding papers (PMID:28148688 Volpi JEM; PMID:28132690 Oud AJHG), the SEMD delineation (PMID:28331220 Guo), the 14-case literature review (PMID:35114981 Bajaj), long-term follow-up (PMID:34089299 Akalin), two later case reports (PMID:38010729 Demir; PMID:38010033 Tian), and the 2022 cryo-EM structure (DOI:10.1038/s41467-022-31048-2 Wilson). All eight were fetched with `just fetch-reference`; no cache file was hand-written.

    Mechanism modeled as an 8-node pathograph capturing the non-obvious core of the disease: hypomorphic EXTL3 alleles do not abolish heparan sulfate but yield qualitatively aberrant HS (longer chains, excess 6-O/2-O sulfation), which is then transduced in OPPOSITE directions by tissue - potentiating FGF2-ERK signaling in fibroblasts (skeletal arm, explaining the FGFR3-dysplasia-like radiographs despite wild-type FGFR1/2/3) while reducing IL-2/IL-7-STAT5 signaling in lymphocytes (immune arm). The thymic defect is modeled as dual hematopoietic-intrinsic plus thymic-stromal, which is the stated basis for the HSCT caveat on that treatment. Cervical cord compression is modeled as a separate ORGANISM-scale node downstream of the skeletal dysplasia because it is the single actionable complication.

    Also recorded: one mechanistic_hypotheses entry (immune_severity_modifiers, EMERGING) for the unexplained genotype-independent divergence of immune severity, and three discussions - two KNOWLEDGE_GAP (immune-severity modifiers; neurodevelopmental impairment primary vs secondary to cord compression) and one HUMAN_MODEL_MISMATCH (zebrafish thymic model translational validity, given mouse Extl3 null is E9.5-lethal so no mammalian hypomorph exists).

    Graph connectivity: a review pass found the Neurodevelopmental Impairment node orphaned - it had no incoming causal edge despite its description asserting a primary HS origin. An `Aberrant Heparan Sulfate Chain Structure -> Neurodevelopmental Impairment` edge was added, carrying the Volpi brain-development sentence as MODEL_ORGANISM evidence and cross-referencing the isdna_neuro_primary_vs_secondary knowledge gap so the edge is not read as settling the primary-vs-secondary question.

    Validation: `just validate` passes all three layers (schema, term, reference). `just validate-references` reports 0 issues; the validator was spot-checked by deliberately corrupting a snippet in a scratch copy, which it correctly rejected, confirming the clean run was a real pass rather than a no-op. `just validate-graphs` reports no findings for this file (the failures it prints are pre-existing in other entries). Two snippets initially failed reference validation because the source PDF hyphenates across line breaks; both were replaced with exact contiguous substrings rather than being force-fitted. Weighted compliance 93.0% (up from 51.3% before the reference_title and causal-edge evidence backfill). Remaining gaps are datasets (none exist for this ultra-rare disorder) and evidence on proposed_experiments (not applicable to proposed work).

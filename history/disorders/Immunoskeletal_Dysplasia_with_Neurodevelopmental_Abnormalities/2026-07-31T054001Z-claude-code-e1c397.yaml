  summary: 'Address PR #7302 review findings'
  details: |
    Second curation pass responding to the automated review on PR #7302, which returned REQUEST_CHANGES. The reviewer confirmed evidence integrity (79/79 snippets exact), scope cleanliness, deep-research authenticity, and pathograph structure, and asked for the clinical-management half of the research to be consumed.

    Addressed:
    - (1) Added `diagnosis:` with six entries - molecular confirmation by exome/genome sequencing with parental Sanger segregation; craniovertebral junction imaging (the priority investigation, carrying the source's own statement that early detection determines prognosis); skeletal survey; immunological evaluation including newborn TREC screening; visceral/cardiac surveillance imaging; and an explicit negative entry recording that urinary GAG and leukocyte lysosomal enzyme screening are normal, so a normal MPS screen does not exclude the diagnosis.
    - Added `differential_diagnoses:` (not requested, but the same source supports it): the immune-osseous dysplasias (SMARCAL1/RMRP/ACP5) and the morphologically confusable SEMDs (opsismodysplasia, odontochondrodysplasia).
    - (2) Added `biochemical:` with two markers - the serum/urine D0a0 and D0a4 disaccharide signature (previously buried inside a pathophysiology node description) and the fibroblast HS chain-length/sulfation abnormality with its EXTL3-complementation rescue.
    - (5) `HP:0009098` removed. The source documents a single episode of oral candidiasis and every HPO oral-candidiasis term asserts chronicity or recurrence (HP:0009098 is_a HP:0002728). The descriptor now carries a `preferred_term` only, with a note recording the reasoning and that an HPO NTR for a course-neutral term is the correct resolution. Phenotype renamed Chronic Oral Candidiasis -> Oral Candidiasis.
    - (3) Added the phenotypes that are actually sourceable: acetabular dysplasia (HP:0008807), hip subluxation (HP:0030043), ventricular septal defect (HP:0001629).
    - (4) Split the bundled `Supportive and Rehabilitative Care` treatment into Nutritional Support and Gastrostomy Feeding (MAXO:0000088) and Genetic Counseling and Prenatal Testing (MAXO:0000079), leaving a genuine remainder under the generic supportive-care term with a note explaining why it stays generic. Added `therapeutic_modality: BEHAVIORAL` to each.
    - (6) Deepened `genetic:` with the allelic-spectrum observations (all reported alleles missense and exon-3 clustered; absent from population databases; skeletal penetrance complete while immune penetrance is not) and the EXTL3 HS-vs-CS branch-point role.
    - (7) `parents:` corrected from the singleton `Spondyloepiphyseal Dysplasias` (wrong - this is a spondyloEPIMETAphyseal dysplasia) to `Skeletal Dysplasia` plus `Combined Immunodeficiency`, reflecting the genuinely bi-systemic nature.
    - (8) The four `VERY_RARE` bands were single-patient observations against a cohort of ~16, i.e. ~6%, which is arithmetically OCCASIONAL not VERY_RARE. Rather than promote them a tier on an ascertainment-biased denominator, the bands were removed and each carries a note explaining the omission per docs/frequency-evidence-guidelines.md.
    - (9) Cited Bourgeais et al. 2024 (DOI:10.1093/glycob/cwae016) for the HS-versus-CS decision-step role of EXTL3.
    - (10) Added `classifications:` with `iuis_category: combined immunodeficiency with syndromic features` (evidence-backed) and `harrisons_chapter: GENETICS_ENVIRONMENT_DISEASE`.
    - Added evidence to the isdna_neuro_primary_vs_secondary discussion, which previously had none.

    NOT done, and why - four phenotypes the reviewer requested (obstructive sleep apnea with AHI 29.7, restrictive lung disease, thin corpus callosum, neurogenic bladder) are sourced in the deep-research artifact only to full-text pages of Akalin 2021 (PMID:34089299). That paper is available as abstract only; refetching was attempted and still returns abstract_only, and none of the four terms appears in any cached reference. Per the CLAUDE.md deep-research SOP (DR outputs are leads, not ground truth; unverifiable DR citations must not be used) these were not added. The same applies to the requested live-vaccine-avoidance treatment: the only live-vaccine sentence in any cache (Volpi) describes a patient RESPONDING to live vaccines after immune recovery, which would have been a misuse of the quote to support the opposite recommendation. Physical/occupational/speech therapy were likewise not split out as separate treatments because no cached reference documents them for a reported patient. The 2023 Unger nosology (finding 10) is not cached, so its preferred designation is recorded as a synonym rather than asserted with a citation.

    GeneReviews re-confirmed absent: NCBI eutils esearch returned count 0 for both `EXTL3 AND GeneReviews` and `"immunoskeletal dysplasia" AND GeneReviews`. The reviewer could not check this because its environment blocked outbound curl.

    Validation: schema, term, and reference validation all pass; validate-graphs reports no findings for this file; full pytest suite green. Weighted compliance 93.0% -> 94.1%.

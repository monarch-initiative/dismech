  summary: Fix MAXO binding on MPS-screening diagnosis entry; apply review suggestions
  details: |
    Third pass on PR #7302, clearing the single remaining blocking item from the second automated review plus its three non-blocking suggestions.

    BLOCKING FIX - the diagnosis entry "Normal mucopolysaccharidosis screening does not exclude the diagnosis" was bound to MAXO:0000127 (genetic testing), copied from the sequencing entry above it. Its description and evidence are entirely about urinary GAG screening and leukocyte lysosomal enzyme assays, which are laboratory procedures, not genetic testing. Rebound to MAXO:0000006 (clinical laboratory procedure), verified against OAK. This also removes a duplicate term binding that would have made the entry invisible to a query for lab screens.

    Suggestions applied:
    - Renamed the phenotype "Acetabular Dysplasia and Hip Subluxation" -> "Acetabular Dysplasia" so the name matches its HP:0008807 binding; the separate Hip Subluxation entry (HP:0030043) already carries the subluxation claim.
    - Added `icimd_category: o_linked_protein_glycosylation` with evidence. Category 18 explicitly subsumes glycosaminoglycan SYNTHESIS, which is where EXTL3 acts. Noted in the block why glycosaminoglycan_degradation is deliberately NOT used: that category is the mucopolysaccharidoses, the mechanistic opposite, and the distinction is clinically load-bearing in this entry because routine MPS screening is normal in ISDNA.
    - Bound `biomarker_term` on both biochemical entries (NCIT:C28153 Glycosaminoglycan; NCIT:C540 Heparan Sulfate) and populated `specificity` on each. The specificity text records what is NOT established as well as what is: the disaccharide signature has no published sensitivity/specificity statistics, and the fibroblast HS assay is a research method requiring skin biopsy rather than a first-line clinical test.

    Note on term verification: an initial attempt bound the disaccharide biomarker to NCIT:C692, guessed rather than looked up. The pre-edit validation hook caught it - NCIT:C692 is Nimodipine. Replaced with NCIT:C28153 after an OAK lookup. Recording this because it is exactly the hallucination class the term validator exists to catch, and it was caught pre-commit rather than in review.

    Validation: schema, term, and reference validation all pass; validate-graphs reports no findings for this file; `pytest -k Immunoskeletal` 9 passed. Manual whitespace/Unicode-normalized audit of all 107 snippets against cached bodies: 0 failures. That manual audit matters because `conf/reference_validator_config.yaml` lists DOI in skip_prefixes (issue #4478), so `just validate-references` does not actually check this entry's two DOI-referenced snippets; both were confirmed by hand. Weighted compliance 94.1% -> 94.2%.

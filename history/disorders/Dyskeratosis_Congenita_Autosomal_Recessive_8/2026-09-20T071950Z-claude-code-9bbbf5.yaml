  summary: Record why no DCLRE1B genetic record is added (review round)
  details: |
    Review round on PR #12326 (genetics pass, issue #12195). This entry was checked during the
    original pass and correctly needed no gene-curation change: its MONDO disagreement about
    DCLRE1B was already recorded, and re-checking it against MONDO confirmed the argument.

    What changed now is a durability point raised in review. The reasoning for NOT adding a
    DCLRE1B `genetic:` record - which a later curator would reasonably expect, since the sibling
    Embryonal_Rhabdomyosarcoma entry does exactly that for the gene MONDO wrongly attributes to
    it - lived only in the pull request body. A `notes:` paragraph now records it in the entry:
    the KGX exporter hardcodes the predicate to `biolink:contributes_to` and never reads
    `relationship_type` (dismech#12320), so a DISPUTED DCLRE1B record here would export as a
    plain causative gene-disease edge asserting exactly the relationship this entry says is
    false. The note also draws the distinction from the rhabdomyosarcoma case, where the gene is
    genuinely reported in that disease however thinly, and marks the decision for revisiting once
    #12320 is fixed.

    No evidence, gene binding, phenotype or pathophysiology content was touched.

  summary: 'Create: DKCB8 / TYMS-ENOSF1 digenic dyskeratosis congenita (MONDO:0859319)'
  details: |
    De-novo curation from claim issue #11715. The curation began on the wrong gene: MONDO asserts MONDO:0859319 RO:0004003 HGNC:17641 (DCLRE1B), just enrich-stubs copied that into the stub, and the claim issue repeated it. The OpenScientist deep-research report came back entirely about TYMS-ENOSF1; just preflight-dr flagged the conflict correctly (DCLRE1B mentioned 0 times, TYMS 70) and pointed at the OMIM 620133 xref as the independent identity anchor, which resolves it in favour of TYMS-ENOSF1. Verified against the primary sources (Tummala 2022 AJHG, eight families; Shams 2025 confirmatory case) before rewriting. Curated the digenic architecture explicitly with HP:0010984 and relationship_type COOPERATING on ENOSF1, since the ENOSF1 haplotype is pathogenic only in trans to a TYMS loss-of-function allele. Ordered the causal chain nucleotide-supply-first (TYMS deficiency -> dNTP pool imbalance -> genotoxic stress -> abnormal telomere maintenance) because that ordering is what distinguishes this from the telomerase and shelterin forms it is clinically indistinguishable from. The 5-fluorouracil hypersensitivity is graded IN_VITRO and INDIRECT throughout and the avoidance recommendation is labelled as this entry's inference, since no patient has been reported to receive a fluoropyrimidine. Validated: linkml-validate, linkml-term-validator, 25/25 snippets verified, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, validate-history.

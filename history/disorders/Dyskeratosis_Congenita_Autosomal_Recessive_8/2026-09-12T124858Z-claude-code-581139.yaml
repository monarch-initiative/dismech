  summary: 'Review round 1: correct the false no-patient-exposure claim; mine Table
    1'
  details: |
    Addressed the REQUEST_CHANGES review on PR #11719.

    CRITICAL, and a real error. The entry stated in four places that no DKCB8 patient had ever received a fluoropyrimidine, and built a knowledge gap plus a proposed experiment on that premise. The cached full text of PMID:35931051 reports a proband with 'a severe adverse response to topical 5-FU' during treatment for squamous carcinoma and melanoma of the leg, corroborated by her Table 1 footnote. The claim was written from the abstract and from a deep-research report that makes the same omission, while the full text was already committed in the same PR. Fixed by adding two HUMAN_CLINICAL evidence items (pathophysiology node and treatment), regrading the treatment's supporting evidence into a DIRECT/HUMAN_CLINICAL item plus a separate INDIRECT/IN_VITRO item, and rewriting the treatment description, treatment notes, pathophysiology description, top-level notes, and the discussion so none asserts the observation is absent. The discussion was re-scoped from 'is this untested in patients' to the narrower open question: whether one topical reaction extends to systemic dosing, and whether DPYD screening would flag such a patient.

    Table 1 of the cached full text had never been mined. Oral leukoplakia regraded VERY_FREQUENT to FREQUENT (4/10). Sparse hair regraded OCCASIONAL to VERY_FREQUENT (9/10, one unknown). Bone marrow failure regraded VERY_FREQUENT/SEVERE to OCCASIONAL (1/10) with the severity qualifier dropped and both readings of the discrepancy stated: a young cohort versus a genuinely marrow-sparing form. Three phenotypes added: decreased circulating immunoglobulin (6/10, HP:0004313), cutaneous malignancy (HP:0008069), abnormal dentition (HP:0000164). Each new frequency carries the Table 1 row as a DIRECT evidence item.

    Ontology correction. pathophysiology#Genotoxic Stress and Defective Transcription was bound to GO:0006284 base-excision repair, which describes a plausible mechanism rather than the one measured. Rebound to GO:0006974 DNA damage response, with the ATM/CHK1/CHK2/p53/p21 phosphorylation sentence added as the supporting measurement.

    Telomerase framing corrected. The entry claimed the telomere machinery is intact. The paper reports reduced telomerase activity, accumulating oligoadenylated immature TERC, and reduced DKC1, TERT and SMUG1; only shelterin is unchanged. Rewritten to shelterin-intact with the authors' own downstream-of-nucleotide-metabolism reading, and the shelterin sentence added as evidence.

    Node renamed. pathophysiology#Fluoropyrimidine and Antifolate Hypersensitivity to #Antimetabolite Hypersensitivity, because antifolate hypersensitivity is unsupported by either source while hydroxyurea hypersensitivity is reported. Hydroxyurea evidence added. The treatment renamed correspondingly. All intra-entry references updated.

    Management added from the GeneReviews cache, which contains zero TYMS mentions and is therefore cited only for class-level telomere-biology-disorder management, graded INDIRECT: malignancy surveillance and androgen therapy / hematopoietic cell transplantation. A top-level references block was added, with the GeneReviews entry tagged.

    Validation: just validate passes, 42/42 snippets verified (was 25/25). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK.

  summary: 'Edit: Opioid Use Disorder - close remaining #8270 checklist items'
  details: |
    Closes the remaining checklist in issue #8270, the follow-up from the
    content-completeness review of #8268. PR #8631 had already landed the first
    tranche (nalmefene nasal spray, extended-release buprenorphine, ORT/SOAPP
    screening); this session covers everything left.

    Guardrail followed throughout: the issue records that the original
    deep-research run produced five ontology identifiers resolving to different
    entities, so nothing here was taken from that report or from the candidate
    PMIDs listed in the issue's own context comment. Every reference was found
    by independent PubMed search, fetched with `just fetch-reference`, and
    snippet-verified against the cached abstract.

    Mechanism. Added the pathophysiology node `Opioid-Induced TLR4 and
    Microglial Neuroimmune Activation` (CL:0000129 microglial cell; GO:0034142
    toll-like receptor 4 signaling pathway; GO:0001774 microglial cell
    activation), with an upstream edge from `Exogenous Mu-Opioid Receptor
    Agonism` and downstream edges to `Opioid-Induced Hyperalgesia` and
    `Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome`. The node is
    deliberately parallel to, not upstream of, the receptor-desensitization
    tolerance node: TLR4 activation is non-stereoselective and so is not a
    mu-opioid receptor event. Primary source PMID:19679181 (Hutchinson et al.),
    bounded by PMID:31209174 (Araldi et al.), which found TLR4 dependence for
    low-dose but not high-dose morphine. Entry `notes` gap (1) updated from
    "not modelled" to "modelled, translational status open".

    Human translation of that arm is recorded as a HUMAN_MODEL_MISMATCH
    discussion (`oud_tlr4_glial_human_translation`) rather than asserted. The
    only human interventional test found (PMID:25975386, ibudilast in
    opioid-dependent volunteers) was null on its prespecified outcome and
    positive only in an exploratory pooled subscale analysis; it is curated at
    `supports: PARTIAL` on that basis.

    Treatments. Added `Contingency Management` (NCIT:C94375, BEHAVIORAL),
    separate from the existing general psychosocial-intervention entry, on
    PMID:34347030 (JAMA Psychiatry meta-analysis, 74 reports / 10,444
    participants). No durability claim is curated: the meta-analysis reports
    end-of-treatment outcomes only.

    Phenotypes. Added `Sedation` (HP:0002329 Drowsiness), `Cognitive
    Impairment` (HP:0100543), and `Opioid-Associated Immunosuppression`
    (HP:0002721 Immunodeficiency). Cognitive impairment uses primary
    case-control neuropsychological data in methadone-maintained patients
    (PMID:26885347) rather than the chronic-pain reviews the issue's context
    comment offered, and carries that study's own negative domains as a
    bounding PARTIAL item. Immunosuppression pairs the human infection-risk
    association (PMID:29435555) with the receptor-level mechanism
    (PMID:37259426). No `frequency` is asserted on any of the three: the
    available prevalence figures come from long-term-opioid-therapy chronic
    pain cohorts, not OUD cohorts, and that is recorded in each phenotype's
    `notes`.

    Genetics. Of the six candidate loci in the issue, KDM4A (hgnc:22978) and
    LRRIQ3 (hgnc:28318) are added as SUSCEPTIBILITY entries on PMID:34728798,
    whose abstract names both. Both carry the caveat that the source GWAS
    phenotype is self-reported problematic opioid use, a proxy, not diagnosed
    OUD; LRRIQ3 additionally notes that its variant is intergenic, so the gene
    assignment is positional. PPP6C was already covered by the multi-trait GWAS
    cited on the susceptibility node. CPT2, CD47 and SLC5A11 are NOT added: no
    abstract-level source associating any of them with opioid use disorder was
    found, and the issue is explicit that a GWAS supplementary table that
    cannot be quoted is not a citable basis. That decision and its reasoning
    are recorded in the entry `notes` as gap (5) so the three are not silently
    dropped. PMID:35879402 (Deak et al., the largest OUD-specific GWAS) was
    added to the susceptibility node, both as independent replication of
    OPRM1/FURIN and as the bound on every additional locus: signals recovered
    by multi-trait analysis are partly shared across substance use disorders.

    Epigenetics. Deliberately NOT modelled as a mechanism node. Recorded
    instead as a KNOWLEDGE_GAP discussion (`oud_epigenetic_mechanism`) citing
    two primary sources: PMID:18650805 (OPRM1 promoter hypermethylation, but in
    lymphocytes, with the expression consequence stated by the authors only as
    a possibility) and PMID:33667780 (epigenome-wide analysis of postmortem
    dorsolateral prefrontal cortex, no CpG surviving FDR correction). The issue
    asked for primary sources rather than review-level citation; the primary
    sources do not support a node.

    Style items. The issue said to fix both or neither. Item 1 (NTR notes in
    `description`) is fixed in both entries: the Craving note moved to the
    `notes` slot in Opioid_Use_Disorder and Alcohol_Use_Disorder, and the
    Neonatal Opioid Withdrawal Syndrome note likewise. The brainstem-node NTR
    note named in the issue was already in a `notes:` slot and needed no
    change. Item 2 (`evidence_source` consistency between PMID:28034973 and
    PMID:22786453) resolves to no change: the two are consistent under the rule
    this entry already applies throughout, which is whether the document
    reports or synthesizes human clinical data (HUMAN_CLINICAL) or narrates a
    mechanism (OTHER). The issue asked to align to a house convention if one
    exists; none does - guideline-titled references across kb/disorders/ split
    roughly two-to-one between the two values - so the operative rule is
    recorded in the entry `notes` instead of a value being changed.

    Validation. `just validate kb/disorders/Opioid_Use_Disorder.yaml` passes
    (schema, terms, references; 109/109 snippets verified) and the same for
    kb/disorders/Alcohol_Use_Disorder.yaml (131/131). The five ungated CI
    gates - check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-environmental-evidence, check-duplicate-keys - all pass, the three
    ratcheted ones against origin/main, and `just check-not4curation` passes.
    `tests/test_data.py` passes in full: 35,216 tests, no failures, in 37m51s.
    A targeted subset covering these changes specifically (required fields,
    evidence references, unique names, subtype and environmental-mechanism
    foreign keys, conforms_to node references, non-therapeutic action targets,
    disorder count) was run first and also passed. Every new
    `downstream[].target`, discussion `attaches_to` ref, and treatment
    `target_mechanisms` target was separately checked to resolve to a real node
    name. Twelve new reference cache files were created by
    `just fetch-reference`; the only cache CSV changes are the three rows the
    validator added for NCIT:C94375, hgnc:22978 and hgnc:28318.

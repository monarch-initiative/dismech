  summary: Add ibogaine as a treatment with pathograph mechanism links
  details: |
    Added Ibogaine to the treatments block of Opioid_Use_Disorder, with four target_mechanisms links into the pathograph and the safety record curated alongside the efficacy claims.

    Mechanism links: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome (INHIBITS; the best-attested clinical effect, but a phenotypic rather than mechanistic link, and the one randomized opioid trial did not reproduce it significantly); Compulsive Opioid Seeking and Loss of Control (INHIBITS; the single-dose aftereffect that all three mechanistic hypotheses on this entry were built to explain); Reward-System Downregulation and Hyperkatifeia (MODULATES rather than INHIBITS, because the direction is contested and the validated pharmacology for the state is kappa antagonism); VTA Disinhibition and Mesolimbic Dopamine Release (INHIBITS; blockade of opioid-evoked accumbal dopamine, shown for the parent compound and not only for 18-MC).

    The entry is explicit that ibogaine is not approved anywhere for this indication, that the supporting human evidence is open-label and observational, that it is a mu-opioid antagonist so withdrawal relief cannot be agonist substitution, and that 33 deaths are documented. Treatment-level evidence carries the QTc data, the iPSC cardiomyocyte repolarization mechanism, and the CYP2D6 clearance dependence. Deliberately omitted a link to Opioid-Induced Hyperalgesia, since the hyperalgesia reversal result is for the oxa-noribogaine analogue rather than for ibogaine. Safer analogues (18-MC, tabernanthalog, oxa-iboga) are noted but not curated as treatments, since none has been tested in humans for this indication.

    therapeutic_agent bound to CHEBI:5852 (ibogaine); treatment_term NCIT:C15986; therapeutic_modality SMALL_MOLECULE; action_category THERAPEUTIC. Six references newly fetched with just fetch-reference.


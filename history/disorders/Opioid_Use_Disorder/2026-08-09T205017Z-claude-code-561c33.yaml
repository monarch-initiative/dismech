  summary: 'Address PR #8268 review: evidence-claim mismatches, NOWS term binding,
    misparented causal edge'
  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES review on PR #8268 - three IMPORTANT findings and three non-blocking suggestions, all applied.

    IMPORTANT 1, claim-evidence mismatch. The Constipation and Hypogonadism phenotypes both carried PMID:23321159 with a snippet about morphine's analgesic efficacy, and explanations that conceded the citation did not address bowel or endocrine effects. The reviewer is right that this is worse than no evidence: the snippet validates as an exact quote, so no automated check catches it, and the entry reads as supported when it is not. Rather than taking CLAUDE.md section 4 Option C (drop the block, keep the description) I fetched real references, since both phenomena are well documented: PMID:28034973 (Opioid-Induced Constipation and Bowel Dysfunction: A Clinical Guideline) now supports constipation with two on-topic snippets, and PMID:22786453 (Opioid-induced androgen deficiency) supports hypogonadism including the hypogonadotropic mechanism that makes it a central rather than primary hypogonadism. Both upgraded from PARTIAL to SUPPORT. PMID:23321159 remains on the tolerance node and the environmental TRIGGERS edge, where the reviewer agreed its use is defensible.

    IMPORTANT 2, NOWS bound to a single constituent sign. Neonatal Opioid Withdrawal Syndrome was bound to HP:0000737 Irritability. Took the NTR route rather than renaming, which is consistent with the entry's own notes already flagging NOWS as arguably its own entity, and with the discipline already applied to Craving. The phenotype_term is dropped and the description now states why - NOWS spans irritability, tremor, feeding difficulty, autonomic instability and seizures, so binding one sign understates it for any downstream consumer.

    IMPORTANT 3, misparented causal edge. The Prefrontal Executive Control Deficit edge hung off Opioid-Induced Hyperalgesia while its stated intermediate was "repeated cycles of intoxication and withdrawal driving frontal-circuit neuroplasticity" - an intermediate belonging to the withdrawal arm, not to hyperalgesia. The reviewer's diagnosis is exactly right, including the cause: that edge was added late specifically to de-orphan the prefrontal node, and the parent was chosen for connectivity rather than mechanism. Reparented to Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome, which makes the intermediate coherent and matches what PMID:27475769 describes. Graph re-checked after the move: still a single root at polygenic susceptibility, prefrontal still reachable.

    Suggestions, all applied. GO:0006950 response to stress was removed from the two ORGANISM-scale nodes where it was doing no work (withdrawal syndrome, hyperkatifeia - the latter retains dopamine secretion DECREASED, which is a genuine cellular process) and replaced on the hyperalgesia node with GO:0019233 sensory perception of pain, INCREASED, which is substantive rather than near-vacuous. CL:0000540 neuron was dropped from the brainstem respiratory node in favour of an NTR note naming the populations actually meant (preBotzinger complex inspiratory rhythm-generating neurons, Kolliker-Fuse respiratory-modulating neurons) and stating that CL has no term at that granularity. Methadone's therapeutic_agent moved from NCIT:C62044 to CHEBI:6807, aligning with every other agent in the entry.

    Not addressed, and why: the reviewer's Content-Completeness gaps (nalmefene, extended-release buprenorphine, contingency management, additional risk loci, ORT/SOAPP screening instruments, sedation and immunosuppression phenotypes) were all marked non-blocking and each needs its own fetched and snippet-verified reference. They are follow-up curation rather than corrections to what is already present.

    Validation after the changes: `just validate-disorders kb/disorders/Opioid_Use_Disorder.yaml` passes. Snippets checked: 76/76 verified against cached references, 0 skipped by prefix. Compliance 90.7 percent global, 91.0 percent weighted. Graph verified: single root, prefrontal node reachable via its new parent, no dangling references.

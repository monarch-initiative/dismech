  summary: 'Create: Opioid Use Disorder'
  details: |
    New Disease entry for Opioid Use Disorder, bound to MONDO:0005530 (opiate dependence, EXACT synonym "opioid dependence") as the closest MONDO term to the DSM-5 construct. The terminology caveat is recorded in the entry notes, following the convention set by the Alcohol_Use_Disorder entry.

    Deep-research provider: claude_code. Run via `just research-disorder claude_code Opioid_Use_Disorder`; 12 web searches over 14 turns, 42 citations, report at research/Opioid_Use_Disorder-deep-research-claude_code.md.

    NEC preflight: `just preflight-dr research/Opioid_Use_Disorder-deep-research-claude_code.md MONDO:0005530` returned SKIP, because MONDO records no causal gene for this complex trait. Manual fallback checks passed: the report's dominant gene mention is OPRM1 (21 mentions), which is the correct mu-opioid receptor gene for this entity, and the queried name matches MONDO's synonym list. One artifact worth noting for future preflight runs - the tool reported "F11=5" among top genes, which is the ICD-10 chapter code F11 for opioid-related disorders being matched as the coagulation factor XI gene symbol, not a real signal.

    DR outputs were treated as leads, not ground truth. This run was substantially worse than the Alcohol_Use_Disorder run on identifiers: five of its suggested ontology IDs resolved to entirely different entities. UBERON:0002550 was offered for ventral tegmental area but is anterior hypothalamic region (correct: UBERON:0002691); UBERON:0002037 for locus coeruleus is cerebellum (correct: UBERON:0002148); UBERON:0002440 for periaqueductal gray is inferior cervical ganglion (that node was dropped rather than bound to an approximate term); CL:0000750 for medium spiny neuron is OFF-bipolar cell (correct: CL:1001474); and HP:0000454 for miosis is wrong (correct: HP:0000616). It also proposed GO:0038003 as a molecular function when it is a biological process. Every term in the committed entry was verified against OAK before use.

    Content curated. Pathograph: 12 pathophysiology nodes with a single root at polygenic susceptibility - exogenous mu-opioid receptor agonism; VTA disinhibition and mesolimbic dopamine release; receptor desensitization and tolerance; cAMP-PKA superactivation in locus coeruleus noradrenergic neurons; noradrenergic hyperactivity and the withdrawal syndrome; reward-system downregulation and hyperkatifeia; opioid-induced hyperalgesia; prefrontal executive control deficit; compulsive seeking; and the two nodes that make this disorder distinctively lethal, brainstem respiratory rhythm suppression and fatal overdose. Modelling the respiratory arm off the same receptor node as the reward arm is deliberate: it captures why opioid analgesia and opioid death cannot be pharmacologically separated, and it gives naloxone a mechanism node to target. Also 18 phenotypes, 2 genetic entries (OPRM1 and FURIN, both SUSCEPTIBILITY), 1 environmental exposure with influences_mechanisms edges, 6 treatments (methadone, buprenorphine, extended-release naltrexone, naloxone overdose reversal, lofexidine, adjunctive psychosocial intervention), 1 prevalence record, 2 diagnosis records, 1 clinical trial (X:BOT, NCT02032433 verified against the cached article), and 2 discussions.

    Epistemic decisions worth recording. Craving is curated with no phenotype_term and flagged as an NTR candidate, consistent with the Alcohol_Use_Disorder entry, because HPO has only food-specific craving terms. The prevalence record is labelled as opioid MISUSE rather than diagnosed OUD, because that is what the only quotable cached figure actually measures. The KNOWLEDGE_GAP discussion on the molecular basis of tolerance is taken directly from the cited review's own statement that large gaps remain, and is tied to why it matters clinically - analgesic and respiratory tolerance diverge, which is what makes the post-abstinence overdose spike lethal. Several withdrawal signs carry only syndrome-level citations at supports: PARTIAL with the gap named in the explanation rather than papered over.

    Validation: `just validate-disorders kb/disorders/Opioid_Use_Disorder.yaml` passes - the batched schema, ontology-term and reference check that CI runs. Snippets checked: 74/74 verified against cached references, 0 skipped by prefix. Compliance: 90.7 percent global, 91.0 percent weighted.

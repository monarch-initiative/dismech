  summary: Add ibogaine mechanism knowledge gaps with proposed experiments
  details: |
    Added six discussions to Opioid_Use_Disorder recording the knowledge gaps that fell out of the three OpenScientist hypothesis-search runs and their assessments, each with structured proposed_experiments (perturbations, controls, readouts, decision_criterion, would_support/would_refute).

    Five KNOWLEDGE_GAP entries: oud_ibogaine_mechanism_necessity_untested (no study has microinjected ibogaine itself at any site, or blocked any candidate receptor, while measuring opioid self-administration; two experiments, a site dissociation and a factorial blockade); oud_alpha3beta4_antagonist_opioid_self_administration_untested (AT-1001 exists, blocks nicotine self-administration with a food control and attenuates morphine withdrawal, but has never been run against opioid taking); oud_ibogaine_durability_versus_depot_pharmacokinetics (every proposed mechanism is pharmacodynamic, so the premise that persistence needs an induced change has never been tested against sequestration in fat plus conversion to noribogaine); oud_human_neurotrophin_response_to_ibogaine_unmeasured (the only human GDNF datum is a null cross-sectional baseline, and the craving-tracking neurotrophin is BDNF); oud_noribogaine_kappa_state_dependence_untested (the normalization reading that would resolve the agonist/antagonist polarity mismatch requires state-dependence that has never been observed).

    One HUMAN_MODEL_MISMATCH: oud_iboga_preclinical_versus_randomized_human_divergence, recording that rodent and uncontrolled human data report large effects while the one randomized trial in opioid-dependent patients found non-significant withdrawal reductions, with seven of forty preclinical studies null and the strongest recent result male-rat-only.

    All evidence snippets verified against references_cache; thirteen references newly fetched with just fetch-reference. Also repaired four folded-scalar hyphen splits in the assessment sidecars committed earlier.

    Validated with just validate (139/139 snippets verified), check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, and the entity-ref/foreign-key pytest lane (9948 passed). check-environmental-evidence reports 33 findings, all in files this branch does not touch.

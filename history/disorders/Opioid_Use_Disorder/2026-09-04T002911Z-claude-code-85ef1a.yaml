  summary: 'Rebase on main and convert retired supports: PARTIAL values'
  details: |
    Responded to the automated review on PR #10539 and to the check_enum_values CI failure.

    Rebased the branch onto origin/main, which had narrowed EvidenceItemSupportEnum in the issue #7439 change. Converted all 18 occurrences of the retired supports: PARTIAL in Opioid_Use_Disorder.yaml. Sixteen became SUPPORT, eleven of those carrying directness: INDIRECT where the quoted text supports the claim through a real inference step (a different reinforcer, an analogue compound, an in vitro measurement standing in for an in vivo state). Two became REFUTE because the cited result contradicts the claim rather than partially supporting it: the broad BDNF induction (PMID:30890941) contradicts attributing the durable effect specifically to VTA GDNF, and the noribogaine-versus-18-MC dissociation (PMID:21040239) contradicts transferring the alpha3beta4 model from the congener to ibogaine. Both explanations were reworded to state what is contradicted.

    Also repaired a pre-existing line in the entry's notes that named supports: PARTIAL as a curation todo; the underlying gap (syndrome-level rather than sign-specific citations) is unchanged and the retired enum name was removed.

    Recorded in the entry notes why the three ibogaine hypotheses opt no causal edges into hypothesis_groups: they are hypotheses about drug action, which this entry models through treatments.target_mechanisms, and hypothesis_groups exists only on CausalEdge, so a treatment mechanism link has no slot to opt in with. Opting the pathogenesis edges in instead would be wrong, since none of them is disputed by the competing accounts.

    Removed the artifacts block from all three hypothesis assessment sidecars. The declared path pointed at openscientist_artifacts/final_report.html, which .gitignore line 243 excludes from the repository, so the files cannot be committed and the declaration could not resolve. Each summary now records that the provider returned an HTML and PDF bundle that the repository excludes, and the GDNF assessment additionally records that its run emitted no citations sidecar, unlike the two sibling runs.

    Validated with just check-enum-values (clean across 2922 files), just validate (152/152 snippets verified, term validation clean), just validate-hypothesis-assessment on all three sidecars, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-term-cache-integrity, validate-history-all, and the entity-ref/evidence/treatment/hypothesis pytest lane (15986 passed).

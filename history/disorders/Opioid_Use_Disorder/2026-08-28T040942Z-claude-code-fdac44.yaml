  summary: Add ibogaine mechanistic hypotheses to Opioid Use Disorder
  details: |
    Added three EMERGING mechanistic_hypotheses covering competing accounts of ibogaine's reported anti-addictive mechanism in opioid use disorder: (1) ibogaine_gdnf_vta_neuroplasticity_model, the induced-neuroplasticity account in which GDNF upregulation in the ventral tegmental area and Ret/ERK-MAPK signalling carry the durable anti-relapse effect; (2) ibogaine_kappa_biased_agonism_model, in which noribogaine's G-protein-biased kappa-opioid agonism is the principal driver, with weak mu antagonism secondary; (3) ibogaine_alpha3beta4_habenular_model, in which noncompetitive alpha3beta4 nicotinic blockade in the medial habenula and interpeduncular nucleus damps the sensitized mesolimbic dopamine response. Each hypothesis carries PMID evidence with snippets verified against references_cache, and notes stating the experiment that would discriminate it from the others. Twelve new references were fetched with just fetch-reference. Validated with just validate (123/123 snippets verified), plus check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles. These hypotheses seed OpenScientist hypothesis-search runs under kb/hypotheses/Opioid_Use_Disorder/.

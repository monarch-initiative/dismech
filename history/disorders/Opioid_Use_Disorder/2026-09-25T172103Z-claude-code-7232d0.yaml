  summary: Conform to addiction_cycle; wire phenotypes to mechanisms
  details: |
    Four pathophysiology nodes now declare conforms_to on the addiction_cycle module (VTA disinhibition -> Acute Mesolimbic Dopamine Reinforcement; reward-system downregulation -> Reward Deficit and Stress-System Recruitment; prefrontal deficit; compulsive seeking). Causal phenotype connectivity went from 0 of 21 to 19 of 21. Twenty downstream edges were added, each following what the entry's own node and phenotype descriptions already state. Mu-opioid agonism now leads to miosis, constipation, sedation, hypogonadism (indirect, via gonadotropin suppression) and immunosuppression. Brainstem respiratory suppression leads to respiratory depression and sleep-disordered breathing. The noradrenergic withdrawal syndrome leads to its seven listed signs. Hyperkatifeia leads to anxiety and depression, hyperalgesia to increased pain sensitivity, prefrontal deficit to craving, and compulsive seeking to addictive substance use. Two phenotypes were deliberately left unwired. Neonatal Opioid Withdrawal Syndrome occurs in the offspring, not the proband. Cognitive Impairment has no mechanism named in the entry.

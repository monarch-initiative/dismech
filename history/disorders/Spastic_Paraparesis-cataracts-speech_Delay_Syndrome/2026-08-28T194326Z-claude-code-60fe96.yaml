  summary: 'Create: Spastic Paraparesis-Cataracts-Speech Delay Syndrome (FAR1 gain
    of function)'
  details: |
    De novo curation of spastic paraparesis-cataracts-speech delay syndrome (MONDO:0036212, FAR1 / hgnc:26222) as a standalone kb/disorders Disease entry.

    entry_type decision: DISEASE. One causal gene, a single recurrent codon, its own OMIM (619338) and Orphanet (615938) identity, and a conserved pathograph. It is emphatically not a subtype of the recessive FAR1 disease: the mechanism is inverted.

    Identity discipline, which was the main risk on this disease. This entry is the dominant gain-of-function arm of FAR1. The recessive loss-of-function arm (FAR1 deficiency / RCDP4, plasmalogen deficiency) is already curated inside Rhizomelic_Chondrodysplasia_Punctata_Plasmalogen_Synthesis_Defect as a has_subtypes entry. Most FAR1 literature is about the recessive arm, so every reference cited here was checked against three discriminators: heterozygous, codon 480, and elevated rather than deficient plasmalogens. PMID:33239752 (defining 12-patient cohort, full text), PMID:36254151 (Middle Eastern case, de novo p.Arg480Cys, full text) and PMID:37335441 (de novo p.Arg480Ser) all pass all three. PMID:36720320 is a review of the normal plasmalogen feedback pathway, cited only for that mechanism and belonging to neither disease. PMID:36781603 (Mov Disord FAR1 variant spectrum) was fetched, found to be content_type unavailable, dropped and not committed.

    modifier grading, argued rather than assumed as the issue asked. The entry splits the claim across two nodes. "Elevated FAR1 Protein and Enzyme Activity" takes modifier INCREASED on the reductase activity: the same enzyme doing the same reaction in larger amounts, three to four times control, with normal peroxisomal targeting and normal peroxisomal beta-oxidation and DHAPAT - a purely quantitative claim, and one that stays PATO-bound. "Uncontrolled Ether Lipid Synthesis" takes modifier GAIN_OF_FUNCTION on the ether lipid biosynthetic process, because the negative feedback loop that sets the pathway's output has been abolished, demonstrated by a direct HDG perturbation in which control cells dropped FAR1 by about 40 percent and patient cells did not respond at all. The pathway is not running above a set point; it has no set point. That is the qualitative "outside normal regulatory constraints" condition CLAUDE.md reserves GAIN_OF_FUNCTION for, and the trade of ontology grounding for expressivity is made knowingly.

    GeneticContext.functional_impact_category is HYPERMORPHIC rather than the generic GAIN_OF_FUNCTION: the enum defines HYPERMORPHIC as increased normal gene product activity, which is exactly what was measured, and no novel activity is reported so NEOMORPHIC is wrong. DOMINANT_NEGATIVE is excluded by the direction of effect.

    MONDO duplication found and recorded: MONDO:0036212 and MONDO:0100230 both name this disease. The former carries OMIM, Orphanet, MedGen and UMLS cross-references; the latter carries only GARD and its definition is the defining paper's title restated. This entry anchors on MONDO:0036212 and maps MONDO:0100230 as skos:exactMatch. The pre-existing RCDP entry refers to this disease by MONDO:0100230, so both identifiers are now reachable. This should be reported upstream to MONDO rather than resolved unilaterally.

    Treatment and indication kept consistent: the only treatment curated is symptomatic antiseizure pharmacotherapy (barbiturates, levetiracetam, oxcarbazepine), which is genuinely reported in this cohort with 4 of 8 patients withdrawn without recurrence, and its indication - seizures in 8 of 12 - is curated as a phenotype in the same entry with target_phenotypes pointing at it.

    Discussions: OPEN_QUESTION on why ether lipid excess and ether lipid deficiency both cause cataracts and spastic paraparesis, with three competing hypotheses kept distinct and none preferred; KNOWLEDGE_GAP on the absence of any model beyond three patients' fibroblasts, sharpened by the observation that the fibroblast carries the full biochemical lesion and is entirely well; KNOWLEDGE_GAP on whether ether lipid flux could be therapeutically reduced, noting that overshooting has a known and worse phenotype.

    Snippet handling: four snippets had to be trimmed or restarted mid-sentence because the source writes ether-lipid nomenclature as PC[O], DG[O], TG[O] and units as pmol/[h.mg protein], and the reference validator strips bracketed spans. Each trimmed snippet's explanation records what was omitted and why, so the omission is not mistaken for selective quotation. This is a general tooling gap worth a follow-up: [O] is standard lipid nomenclature and conf/reference_validator_config.yaml's literal_bracket_patterns does not cover single letters.

    Deep research: falcon. NEC preflight PASS (FAR1=67 mentions, next token PC=5). The report is squarely about the monoallelic gain arm and contrasts it with recessive FAR1 deficiency explicitly; nothing from it was used without checking against the cached full text. Report and citations sidecar committed under research/.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 43/43 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0.

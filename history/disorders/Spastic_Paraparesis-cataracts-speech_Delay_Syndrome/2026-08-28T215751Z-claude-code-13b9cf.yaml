  summary: 'Review response: phenotype frequencies, qualify the no-neuropathology
    claim'
  details: |
    Review response on PR #9927.

    Blocking item 1: every phenotype frequency slot was empty while the exact fractions sat in the phenotypes' own verified snippets. Seven now carry the fraction verbatim from their own evidence - spastic paraparesis 12/12, bilateral cataracts 12/12, delayed speech 10/12, seizures 8/12, axial hypotonia 6/12, intellectual disability 3/12, macrocephaly 2/12 - using the string form the schema permits via any_of FrequencyEnum or FrequencyQuantity, as in Activated_PI3K-delta_Syndrome. Delayed gross motor development takes the FREQUENT enum, since its source says only "in most". Bare fractions rather than fractions-plus-percentages, deliberately: the percentages would be my arithmetic, not the paper's. This matters because the RCDP4 differential leans on intellectual disability at 3/12 against profound-and-universal in the recessive arm, and that comparison was previously reachable only as prose.

    Ankle clonus and lower limb spasticity deliberately carry no frequency, and now say why in their descriptions: the source names both inside the pyramidal-signs sentence without attaching a count, in the same breath where it does give fractions for spastic paraparesis and truncal hypotonia. Inferring 12/12 from sentence structure would be reading a number the paper declined to give.

    Blocking item 2: the knowledge-gap discussion claimed there is "no neuropathology". Della Marina et al. 2024 (J Neuropathol Exp Neurol, PMID:39074165) reports lipid and protein imbalances in muscle from a patient with a heterozygous de novo FAR1 variant - this arm of the disease, in a tissue nobody else has examined. The prose is qualified rather than the paper cited: PubMed carries no abstract for it (fetched, confirmed content_type unavailable, cache file not committed), which is the same disposition given to PMID:36781603. The gap's actual point survives and is now stated more precisely: neither of the two tissues that fail, the corticospinal tract and the lens, has been examined in any patient.

    Non-blocking suggestion taken: a notes paragraph records that supportive management - cataract extraction, physiotherapy, speech therapy - was considered and not curated, because the defining paper never mentions surgery or therapy of any kind and the only management it reports is the antiseizure drugs already curated. Adding them from general practice would assert a management record for twelve patients that nobody wrote down.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 48/48 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. No cache diff.

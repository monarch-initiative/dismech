  summary: Add lower limb spasticity, intellectual disability and macrocephaly phenotypes
  details: |
    Curation follow-up on PR #9927, acting on the automated research comment on issue #9908 while the PR review is pending.

    Three phenotypes added, each with a verbatim sentence from the already-committed cache.
    1. HP:0002061 Lower limb spasticity, from the pyramidal-tract sentence, noting the distinctive pairing with axial hypotonia.
    2. HP:0001249 Intellectual disability at 3/12, framed as one of the clearest separators from recessive FAR1 deficiency where it is profound and universal.
    3. HP:0000256 Macrocephaly at 2/12, recorded partly because its direction matters - recessive FAR1 deficiency causes microcephaly - and quoted from the sentence that also records the absence of dysmorphism.

    Constipation was in the research comment at 5/12 and is deliberately not curated: it appears only as per-patient plus and minus marks in Table 1 and never in the paper's prose, so no sentence can be quoted for it. That decision and the other per-patient columns it applies to are recorded in the entry's notes so a curator with the table can add them.


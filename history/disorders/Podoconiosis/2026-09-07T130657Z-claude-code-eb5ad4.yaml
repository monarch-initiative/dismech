  summary: 'Review round 1: address three IMPORTANT findings on PR #11329'
  details: |
    Review round 1 on PR #11329 (ai4c-reviewer, CHANGES_REQUESTED, three IMPORTANT
    findings plus one non-blocking suggestion). All verified against the caches and
    all fixed in one bundled push; `main` runs dismiss_stale_reviews, so a follow-up
    chore commit would cost a full re-review cycle.

    Two of the three findings were incomplete fixes from this entry's own pre-PR
    red-team round - the same defect class the red team was run to catch, escaping
    because the fix pass changed one section and did not re-grep the others.

    Finding A - the groin-sparing / ascending discriminator survived in three
    places. The pre-PR round rewrote the phenotype but left the claim in the
    `Lymphatic Obstruction and Lymph Stasis` node description, the `diagnosis`
    description, and the `differential_diagnoses` description. No cited source says
    "ascending", "descending", or that podoconiosis spares the groin; the entry even
    contradicted itself, with a phenotype explanation stating the claim was avoided
    because "no cited source says" it. All three rewritten. The filariasis contrast
    is now the citable mechanistic one from PMID:33348721 - "the lymphatic
    disruption in LF is proximal (worm nests in the groin or armpits), in
    podoconiosis the exposure is at the feet" - which was sitting uncited in a
    cache the entry already used, and which is a better distinction than the bedside
    rule of thumb it replaces. PMID:33348721 and PMID:35604949 are now both cited on
    the differential record, and the explanation records that an earlier draft
    asserted the unevidenced version.

    Finding B - the entry described its own evidence incorrectly. Two sentences (the
    `podo_inverted_mineral_response` discussion and the top-level `notes:`) said the
    inverted IL-1beta result "is recorded as a REFUTE item". The pre-PR round had
    regraded it SUPPORT and left the prose describing the old grade. The file
    contained 96 SUPPORT and 0 REFUTE. Both sentences fixed; the evidence item and
    its grading argument were correct and untouched.

    Finding C - the ADLA frequency band rested on the wrong cohort, and the
    reviewer's replacement is better than what was there. FREQUENT rested on 38%
    from PMID:33348721, a trial that enrolled in Ethiopia and Bangladesh and states
    "we made no attempt to differentiate the cause of lymphedema in our study" -
    a mixed-etiology cohort in a region where filariasis, not podoconiosis, is
    endemic. Meanwhile PMID:35604949, this entry's primary 289-patient
    podoconiosis series and already cited 29 times, reports "About 86% of the cases
    in our study had at least one episode of ADLA during the three-month period
    preceding the date of examination". Retagged VERY_FREQUENT on that figure. The
    38% item is kept but reframed as a treatment-effect observation, and the
    mixed-etiology caveat is added as a NO_EVIDENCE item quoting the authors' own
    sentence - recorded rather than silently dropped, because the reason the earlier
    basis was wrong is worth keeping visible. This is the entry's only
    NO_EVIDENCE item.

    Suggestion taken: antibiotic therapy for acute attacks, with the qualifier the
    source attaches to it. The snippet carries both halves - antibiotics including
    penicillin are the recommended interruption for an acute episode, AND they are
    "not routinely available for patients in remote rural populations in Ethiopia".
    Graded OTHER because the sentence is the GoLBeT trial's background framing
    citing an earlier recommendation, not a trial result; no trial of antibiotic
    therapy in podoconiosis is cited here. No `therapeutic_agent` is bound: the
    source names penicillin as an example inside a general recommendation and no
    cited source reports a regimen.

    Validation after the round: `just validate-disorders` clean, 101/101 snippets
    verified (was 96), term validation passed, entity refs / causal targets /
    duplicate keys / enum values / qualifier terms / source-defect claims all OK,
    `just compliance` 82.1% (was 81.9%). Every reference_title derived
    programmatically from references_cache frontmatter rather than typed. No new
    references were fetched - all four snippets used in this round came from caches
    already committed with the entry.

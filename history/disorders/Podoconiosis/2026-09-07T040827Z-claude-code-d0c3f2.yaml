  summary: 'Create: Podoconiosis (MONDO:0005425)'
  details: |
    Create the Podoconiosis entry (MONDO:0005425), a new curation with an
    environmental-exposure focus requested by the user. Claim issue #11296.

    Why this disease. Podoconiosis is the cleanest gene-environment disease
    available in the neglected-tropical-disease space: no pathogen, no vector, a
    mineral exposure through the skin, and an HLA class II susceptibility with 63%
    heritability layered on an obligate environmental cause. It exercises
    `environmental:` and `influences_mechanisms`, which most entries leave empty.
    Preflight was clean on all three surfaces - no entry, no stub, no open or closed
    issue or PR.

    Deep research. Requested as `falcon` per the skill default; no EDISON_API_KEY is
    configured here, so the run used `--fallback` and the report records
    `fell_back: true`, `requested_provider: falcon` and the ProviderNotConfiguredError,
    renamed to `-claude_code` on completion. 41/41 references resolved, 0
    confabulation, 1 flagged off topic (PMC:PMC1008352, not cited). Term validation
    resolved 24/24 and flagged four bindings the report named wrongly: UBERON:0002387
    (*pes*, not dermis), UBERON:0004357 (*paired limb/fin bud*, not dorsum of foot)
    and UBERON:0001511 (*skin of leg*, not "leg structures") in its "names something
    else" section, plus UBERON:0002391 (*lymph*, not lymph node) in its weaker
    "worth a second look" section. None is bound as the report proposed it;
    UBERON:0001511 is used, but for what UBERON actually calls it.

    Note the sequencing: `just research-disorder` requires the disorder file to
    exist, so a minimal schema-valid scaffold was written first and then replaced.

    Pathophysiology. Thirteen nodes, one root, no orphans. Barefoot soil contact ->
    transdermal particle entry -> macrophage phagocytosis -> lymphatic transport,
    which forks into an HLA-restricted arm and a direct particle effect on the
    vessel wall, both converging on endolymphangitis -> collagenization ->
    luminal obliteration -> lymph stasis -> dermal sclerosis -> epidermal barrier
    failure -> acute dermatolymphangioadenitis, which feeds back into
    collagenization. The feedback edge makes the graph cyclic, which is how the
    clinical literature describes it.

    Three findings curated as negatives or contradictions rather than smoothed away:
    - PMID:39591258 found that on stimulation with kaolinite and chlorite it was the
      healthy endemic controls, not the patients, who produced two to three times
      more IL-1beta - the opposite of a hypersensitivity model. Curated with an
      explanation that says so plainly and an INTERPRETATION discussion.
    - PMID:22455414 states that mineral particles are found in the lymph nodes of
      unaffected as well as affected people. Curated on the phagocytosis node,
      because it is the reason the HLA node exists at all.
    - PMID:25401490 found HPV-PCR negative in every specimen, ruling out the obvious
      alternative explanation for the verrucous change.

    Where the entry declines to assert more than its sources. The systematic review
    that assembles the implicated minerals (PMID:40623043) says outright they may be
    covariates rather than direct contributors; that sentence is quoted. The edge
    from particle transport to the HLA node is INDIRECT_UNKNOWN_INTERMEDIATES, not
    "antigen presentation", because how a silicate engages class II is unsolved -
    recorded as a KNOWLEDGE_GAP.

    PRE-PR RED-TEAM REVIEW. A subagent review against `dismech-pr-review` before any
    PR was opened returned REQUEST_CHANGES with seven blocking findings. All were
    verified against the caches and all were fixed. The substantive ones:

    1. The stated diagnostic discriminator - "ascending", "spares the groin", and
       "descending/unilateral" for filariasis - appeared in five places including a
       `diagnostic: true` phenotype, and NO cited source supported any of it. It
       traced to the deep-research report, which is a lead and not a citable source.
       Rewritten to what the sources do say: "starting from the feet, progressively
       involving the legs, yet in most cases remaining below the knee"
       (PMID:35604949), bilateral in 86.9%, above the knee in 1.4%, asymmetric in
       stage (36%) and type (18.5%). The filariasis distinction is now the real,
       citable one - proximal worm nests versus distal soil exposure (PMID:33348721)
       - which is mechanistically better than the clinical rule of thumb it replaced.
    2. `VERY_FREQUENT` on acute dermatolymphangioadenitis was justified by an
       episode rate (23.9 per person-year), not the patient proportion the enum band
       is defined on. Retagged FREQUENT against the 38% of the control arm reporting
       any attack (PMID:33348721), with the rate kept and relabelled.
    3. Three false claims about repository state, all verified false and all fixed:
       (a) the notes claimed podoconiosis is the only DERMAL exposure among the KB's
       mineral-particle diseases. `Chronic_Beryllium_Disease` has no
       `exposure_classifications` at all and curates a "Dermal beryllium exposure"
       entry; `Byssinosis` is classified BIOLOGICAL; `Asbestosis` was omitted from
       the list. Rewritten to a claim that is true and states both exceptions.
       (b) the notes mislisted which UBERON terms the report's validator flagged and
       in which section - corrected above.
       (c) "All three are bound on the pathophysiology node" while only two genes
       were bound. HLA-DQB1 (hgnc:4944) is now bound.
    4. The Ankle Ankylosis phenotype carried no evidence, justified by the claim
       that the staging description "was not available as a quotable cached
       reference". False - PMID_35604949 carries a figure legend placing ankylosis
       in stage 5 verbatim, and stage descriptions for 1, 2, 4 and 5. All are now
       cited, and stage 3 carries an explicit note saying why it has none.
    5. `supports: REFUTE` on the HPV finding was inverted: `supports` is relative to
       the record it sits on, and the record asserts the change is NOT HPV-driven,
       which the negative PCR supports. Regraded SUPPORT. The same reasoning
       regraded the inverted IL-1beta item from REFUTE to SUPPORT.
    6. The skin node bound `UBERON:0002067` *dermis* under a broader
       `preferred_term`, and excluded the node's own headline epidermal finding.
       Rebound to `UBERON:0001511` *skin of leg*.
    7. The Endolymphangitis node rested solely on rabbit data. Human evidence added
       (PMID:25401490 infiltrate; PMID:38448477 for the endolymphangitis
       description, graded OTHER/INDIRECT since it summarises Price's work).

    Also from the review: three bundled nodes were split (phagocytosis vs transport,
    collagenization vs obliteration, dermal sclerosis vs epidermal barrier failure);
    the CD4 node was retagged CELLULAR; six evidence items citing narrative-review
    summary text or background prose were regraded HUMAN_CLINICAL -> OTHER with
    corrected explanations; `clinical_trials:` was added for both RCTs via their WHO
    ICTRP registrations (ISRCTN67805210 and ISRCTN16764792, both fetched with
    `just ictrp-fetch`); an `inheritance:` block was added; and the footwear
    treatment's "halt or reverse" claim gained the sentence that actually says it
    (PMID:35604949, stages 1 and 2 completely reversible).

    One inheritance-term judgment: `HP:0032113` *Semidominant inheritance* matches
    the segregation analysis's "autosomal co-dominant" wording, but it sits under
    *Mendelian inheritance* in HPO, and podoconiosis produces no disease without the
    exposure. Bound `HP:0001426` *Non-Mendelian inheritance* instead and recorded
    the reasoning in the block description. No term beats a bad one.

    Datasets: none added. `just discover-datasets Podoconiosis` returned exactly one
    candidate, geo:GSE119367, tagged GENE_ONLY - a leprosy GWAS in a Chinese Han
    population reached through HLA-DQA1. That is Named Entity Confusion reached via
    dataset search, and it was rejected on relevance.

    GeneReviews: none exists; confirmed by PubMed search. Podoconiosis is a complex
    gene-environment trait, not a Mendelian disorder.

    Animal model: the intralymphatic silica injection experiment (PMID:3006293) with
    three typed divergences, including a POPULATION_MISMATCH marked INVALIDATING -
    the animals are unselected, so the model cannot speak to the susceptibility step.
    Species is Rabbit, from the record's MeSH indexing; the abstract says only
    "animal experiments", and the entry says so. A HUMAN_MODEL_MISMATCH discussion
    records that no model can reproduce a disease requiring both a human HLA
    haplotype and barefoot bipedal soil contact.

    One term was invented and caught by validation: NCIT:C15311 was written for
    "Preventive Intervention" and is actually *Quality Control*. Corrected to
    NCIT:C15843.

    Not curated: the report's depression and anxiety odds ratios, quality-of-life
    scores, economic burden figures, standardized mortality ratio, OMIM 614590
    mapping, and the Rwandan barefoot-walking ban all trace to sources this session
    did not fetch. Recorded in `notes:` rather than included.

    Validation after the review round: `just validate-disorders` clean, 96/96
    snippets verified, term validation passed, entity refs / causal targets /
    duplicate keys / enum values / qualifier terms / source-defect claims all OK,
    pathograph re-audited (13 nodes, one root, no orphans), `just compliance` 81.9%.
    Cache diff is additions only. 30 uncited reference caches written by the
    report's own validation pass were pruned, the cited list re-derived immediately
    afterwards, and the snippet count re-run on the pruned tree. Every
    reference_title was derived programmatically from references_cache frontmatter

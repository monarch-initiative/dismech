  details: |
    Automated PR Shepherd pass responding to the two blocking items in the ai4c-reviewer re-review of 1436ac06.

    Item 1 (ICD/CRT and heart transplantation treatments missing). Added two treatments following the sibling Dilated_Cardiomyopathy_1Z pattern the reviewer cited:

    - Cardiac Resynchronization Therapy and Implantable Cardioverter Defibrillator, therapeutic_modality DEVICE, treatment_term NCIT:C80435. Cited to PMID:31073128 with supports PARTIAL / evidence_source OTHER, matching the disease-class scoping already accepted for generic Pharmacotherapy in this entry. The snippet was copied from the abstract copy in references_cache/PMID_31073128.md, which uses a plain hyphen in "cardioverter-defibrillators"; the full-text copy in the same cache file uses an en dash. The description states explicitly that no CMD1B-specific arrhythmic risk-stratification rule exists or can exist while the gene is unidentified, since there is no carrier status to stratify on.
    - Heart Transplantation, therapeutic_modality SURGERY, treatment_term NCIT:C15289. Cited to PMID:7573045 (the founding linkage report's "chief indication for heart transplantation" sentence, already quoted elsewhere in this file) and PMID:20525703 (transplant-free survival endpoint).

    Item 2 (no diagnosis section). Added a diagnosis section before treatments, matching the sibling section ordering, with two entries:

    - Echocardiography, diagnosis_term NCIT:C16525, cited to PMID:31073128 and PMID:7573045. The description makes the locus-only point the reviewer asked for explicitly: with no identified 9q13-q22 gene there is no confirmatory molecular test, so the echocardiographic phenotype plus the pedigree carry the whole diagnostic burden.
    - Pedigree Analysis and Familial Screening, diagnosis_term NCIT:C15419, cited to PMID:20525703 and PMID:7573045. A notes field cross-references the companion Cascade Clinical Screening treatment entry so the overlap between the interventional and diagnostic roles is explicit rather than accidental.

    No new ontology terms were introduced: NCIT:C80435, C15289, C16525 and C15419 were all already present in cache/ncit/terms.csv and in the treatmentactionterm enum membership cache, so validation stayed offline and no cache files changed.


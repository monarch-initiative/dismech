  summary: 'Create: Dilated Cardiomyopathy 1B (CMD1B, 9q13-q22 locus)'
  details: |
    New locus entry for CMD1B (MONDO:0010951, OMIM 600884), the autosomal dominant familial dilated cardiomyopathy locus mapped by Krajinovic et al. 1995 (PMID:7573045) to 9q13-q22 between D9S153 and D9S152 with a maximum multipoint LOD of 4.2.

    Curated deliberately as a LOCUS entry with no causal gene. The genetic block carries no gene_term; TMOD1 and PRKACG appear only as positional candidates, in notes and in an open KNOWLEDGE_GAP discussion, never as curated gene-disease claims.

    Deep research: falcon and openscientist were unavailable this session (falcon returned HTTP 402 Payment Required from the Edison API; openscientist returned HTTP 401 Unauthorized), so the provider used was claude_code, report at research/Dilated_Cardiomyopathy_1B-deep-research-claude_code.md. That report carried needs_review: true with confabulation_rate 0.25. Its one unresolved identifier, DOI:10.1093/eurheartj/ehag159/8529603, was not cited anywhere in this entry. Two further report errors were caught and not propagated: it suggested the wrong MONDO ID (MONDO:0011486) and the wrong HGNC ID for TMOD1 (HGNC:11874 instead of hgnc:11871).

    NEC preflight (just preflight-dr) returned SKIP because MONDO records no causal gene for this term, so the manual OMIM/synonym/gene check was performed instead and passed. The report's OMIM 115200 mentions were confirmed to be explicit references to the CMD1A series-reference entry rather than a misidentification of the disease.

    Independent verification beyond the report: all 24 papers citing PMID:7573045 were reviewed and none identifies a gene at this locus; NCBI Gene 1218 was confirmed to be a phenotype-only record returning no genomic coordinates; TMOD1, PRKACG and FXN map positions were confirmed against NCBI Gene. The OMIM percent-prefix designation could not be verified directly because omim.org returned HTTP 403, so it is attributed to secondary sources in the notes rather than asserted, and nothing in the entry relies on it.

    Pathophysiology is a three-node chain whose trigger is an explicit unresolved-locus placeholder. Conformance to cardiomyopathy_maladaptive_remodeling is declared only at the two downstream nodes carrying direct phenotype evidence, and deliberately not at Primary Cardiomyocyte Insult, since the nature of the insult is precisely what is unknown. This departs from the deep-research report's recommendation that no conformance be declared at all and that CMD1B may not be curatable as a standalone entry; the reasoning for keeping both is recorded in the entry text.

    Validation: just validate passed for schema, terms and references; just validate-disorders passed, which is the batched check CI runs; 27/27 snippets verified against cached references; just check-duplicate-keys OK; just check-title-snippets OK; a targeted pytest selection over tests/test_data.py covering conforms_to resolution, foreign keys, unique names and duplicates gave 4150 passed. Compliance is 93.2 percent global and 94.6 percent weighted. Datasets were left empty deliberately: no CMD1B-specific dataset can exist without a gene, and attaching a generic DCM dataset would be exactly the relevance failure the dataset curation SOP warns against.

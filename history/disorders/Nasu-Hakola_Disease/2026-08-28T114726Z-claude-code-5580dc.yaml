  summary: 'Review round 2: tighten phenotype grounding, add scope notes'
  details: |
    Addressed the round-2 ai4c-reviewer review on PR #9828. Removed two phenotypes added in round 1 whose evidence snippets did not name them: Memory Impairment rested on a progressive-dementia sentence with no cognitive-domain wording in any cached source, and Arthralgia rested on the same GeneReviews sentence already supporting Bone Pain, which does not separate joint from bone pain. Rebound Cerebral Cortical Atrophy HP:0002120 to Cerebral atrophy HP:0002059, since the citable source says cerebral and the cortical wording appears only in web references. Renamed Personality Change and Disinhibition to Disinhibition, trimmed its description and requoted it against the frontal-lobe-syndrome clause that names loss of social inhibitions, leaving the separate Personality Change node holding the sentence that supports it. Added a top-level notes section recording the Orphanet blocker (issue #9687, including that the failed download is left on disk so structured-rebuild-orphanet silently builds from unverified data) and naming the Orphanet-listed features deliberately not modelled for want of a citable source. Also added cell_types osteoclast to the resorption node and a note distinguishing the cerebral-atrophy evidence grading from the regraded receptor-biology sentences. Net phenotype count 14 to 12, all grounded on snippets that name them. Revalidated: 60/60 snippets verified, check-entity-refs and check-duplicate-keys pass.

  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9828. Added a progression section with the four GeneReviews stages, a histopathology section covering both halves of the disease name, and six further phenotypes: memory impairment, personality change, loss of mobility, ventriculomegaly, cerebral cortical atrophy and arthralgia. Split two bundled pathophysiology nodes as suggested: Impaired Oligodendrocyte Myelination and Demyelination became separate failure-to-myelinate and demyelination nodes, and Osteoclast Differentiation and Resorption Failure became Osteoclast Maturation Arrest plus Impaired Bone Resorption and Remodelling. Regraded two background-mechanism evidence items from HUMAN_CLINICAL to OTHER. Repointed the discussion anchor from animal_models#Mouse to the model name. Two review items were not actioned and are explained in a PR comment: the Orphanet frequency rows are unavailable because just refresh-orphadata fails its pinned checksum, which is issue #9687, and the rebuild step then silently produces a cache file from the unverified download, which I added as a comment there; and DiseaseMappings has no OMIM or ORPHA slot so the suggested mappings block has nowhere to go. Revalidated: 62/62 snippets verified, check-entity-refs, check-duplicate-keys and check-snippet-grading all pass.

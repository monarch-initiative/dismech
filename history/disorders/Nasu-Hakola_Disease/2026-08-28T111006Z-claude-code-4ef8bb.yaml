  details: |
    De novo curation of Nasu-Hakola disease from claim issue #9816. Deep research: Perplexity sonar-deep-research, report at research/Nasu-Hakola_Disease-deep-research-perplexity.md. Its reference-validation block reported 4/4 identifiers resolved, 0 confabulation, 4/4 on topic - but only 4 of 16 citations were resolvable identifiers, the rest being web URLs, so the report was used as a lead source and every evidence snippet was anchored to a PMID fetched and verified independently with just fetch-reference. GeneReviews baseline PMID:20301376 was cross-referenced for phenotypes and management. One recollection error was caught by the fetch step: PMID:10888890, not PMID:10888878, is the Paloneva 2000 TYROBP paper. Modelled as one Disease with has_subtypes PLOSL1 for TYROBP and PLOSL2 for TREM2, because the two genes encode the two subunits of one receptor complex and give an identical phenotype. Records an explicit FAILS_TO_RECAPITULATE model link and a HUMAN_MODEL_MISMATCH discussion for the DAP12-null mouse, which reproduces the osteoclast and myelin arms but not the human microglial RUNX1/STAT3/TGF-beta signature. Validated with just validate, 46/46 snippets verified against cached references, plus check-entity-refs and check-duplicate-keys.

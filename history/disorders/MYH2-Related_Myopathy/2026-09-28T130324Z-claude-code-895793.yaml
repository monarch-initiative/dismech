  summary: 'Create: MYH2-Related Myopathy'
  details: |
    New entry for MONDO:0011577 (myopathy, proximal, and ophthalmoplegia; MYPOP), replacing stub Myopathy_Proximal_And_Ophthalmoplegia. Lump/split: one Disease entry for all MYH2 myopathy, following the MONDO definition, with the two MONDO children carried as has_subtypes rows: MONDO:0019195 (autosomal dominant, hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome) and MONDO:0018206 (childhood-onset autosomal recessive myopathy with external ophthalmoplegia). Kept separate from Inclusion_Body_Myositis (sporadic, acquired) despite MONDO filing MONDO:0011577 under MONDO:0007827. Pathograph: dominant motor-domain route (E706K -> impaired motor function -> myosin instability and aggregation -> sarcomeric protein breakdown with rimmed vacuoles -> adult fibre degeneration), dominant distal-tail assembly route, and recessive loss-of-function route converging on loss or atrophy of type 2A fibres. Phenotype frequencies taken from the 86-patient systematic literature review in PMID:41252304. The entry was first curated directly from PubMed abstracts and PMC full texts fetched with just fetch-reference, because the first Perplexity deep-research run failed (Perplexity API: server disconnected without sending a response). A rerun with a streaming request then produced research/MYH2-Related_Myopathy-deep-research-perplexity.md, which was screened as leads only. Its 11 references all resolved, but its term validation flagged 18 mislabelled CURIEs and 2 nonexistent HP terms, so none of its CURIEs were used. preflight-dr could not run because no local MONDO build was present; disease identity was checked by hand (the report names MYH2, OMIM 605637 and MONDO:0011577). The report's lead that ClinGen has curated MYH2 was verified and added: the two ClinGen Gene-Disease Validity assertions against MONDO:0011577 (autosomal recessive Definitive, autosomal dominant Moderate) were cached with the clingen structured source and cited on the subtype rows. The report's claim that expression studies give direct evidence of a dominant-negative effect was not adopted, because the ClinGen dominant curation states that a dominant-negative mechanism has been suggested but not established. A second, independent family carrying the dominant c.5673+1G>C splice variant (PMID:36774715) was added as replication evidence on that variant. Validated with just validate, count-verified-snippets (all snippets verified), validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-genereviews (no chapter), list-gene-term-mismatches, and validate-disorders.

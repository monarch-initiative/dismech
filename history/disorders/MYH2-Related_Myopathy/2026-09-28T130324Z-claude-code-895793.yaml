  summary: 'Create: MYH2-Related Myopathy'
  details: |
    New entry for MONDO:0011577 (myopathy, proximal, and ophthalmoplegia; MYPOP), replacing stub Myopathy_Proximal_And_Ophthalmoplegia. Lump/split: one Disease entry for all MYH2 myopathy, following the MONDO definition, with the two MONDO children carried as has_subtypes rows: MONDO:0019195 (autosomal dominant, hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome) and MONDO:0018206 (childhood-onset autosomal recessive myopathy with external ophthalmoplegia). Kept separate from Inclusion_Body_Myositis (sporadic, acquired) despite MONDO filing MONDO:0011577 under MONDO:0007827. Pathograph: dominant motor-domain route (E706K -> impaired motor function -> myosin instability and aggregation -> sarcomeric protein breakdown with rimmed vacuoles -> adult fibre degeneration), dominant distal-tail assembly route, and recessive loss-of-function route converging on loss or atrophy of type 2A fibres. Phenotype frequencies taken from the 86-patient systematic literature review in PMID:41252304. A Perplexity deep-research run was attempted but failed (Perplexity API: server disconnected without sending a response), so no deep-research report exists and the entry was curated directly from PubMed abstracts and PMC full texts fetched with just fetch-reference. Validated with just validate, count-verified-snippets (all snippets verified), validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-genereviews (no chapter), list-gene-term-mismatches, and validate-disorders.

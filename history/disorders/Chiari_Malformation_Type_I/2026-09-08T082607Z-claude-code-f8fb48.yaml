  summary: 'Create: Chiari Malformation Type I (MONDO:0007316)'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report (research/Chiari_Malformation_Type_I-deep-research-perplexity.md). 26 evidence snippets, all verified by dismech.reference_snippet_audit against references_cache/.

    Lump/split decision: DISEASE, despite the term reading like a radiological finding. About thirty existing dismech entries -- craniosynostoses, skeletal dysplasias, connective tissue disorders -- already carry Chiari malformation as a phenotype, and this entry gives them a convergence node in the way the 'disease-like phenotypes' module family does for osteoporosis and glaucoma. The mechanism is genuinely conserved across those upstream causes: a posterior fossa too small for a normal hindbrain.

    The report was usable for structure but not for citations. It cited only two PMIDs in its body, so the primary literature was assembled by hand: PMID:10232534 (Milhorat, 364 patients, the defining cohort and the volumetric data), PMID:8988080 (Nishikawa, occipital enchondral morphometry), PMID:8271018 (Oldfield, the piston mechanism with intraoperative ultrasound), PMID:16823310 (cine phase-contrast CSF flow and outcome), PMID:18074684 (the HDCT cohort).

    The report's ontology terms were not usable. Its own term_validation reported 19 of 53 labels mismatched, and the errors were internally inconsistent: it gave CL:0000138 for both chondrocyte and ependymal cell, and CL:0000142 for osteoblast (osteoblast is CL:0000062). No CL term was taken from the report; the entry names the tissue and somite instead of binding a cell type the sources do not identify, and that decision is recorded in notes.

    Two structural decisions worth noting. First, the HDCT association was initially drafted as a comorbidity_associations block; Disease has no such slot, and on reflection it is not a comorbidity but a second upstream mechanism -- occipitoatlantal hypermobility with cranial settling, reaching the same neural-compression node without a small fossa -- so it was restructured as its own pathophysiology node. Second, the entry carries a REFUTE evidence item on the CSF-flow-obstruction node: 19% of operated patients have normal preoperative flow and those patients are 4.8-fold more likely to relapse after decompression, which refutes obstruction as a sufficient account of the syndrome. That is recorded as evidence and as a knowledge gap rather than smoothed over.

    Three discussions record what is not known: the symptomatic normal-flow group, whether acquired tonsillar descent is the same disease, and whether the 24% trauma-precipitant figure is causal or recall bias.

    Validation run in the worktree: linkml-validate (Disease) clean; linkml-term-validator validate-data --labels clean; reference_snippet_audit 26/26; check_duplicate_yaml_keys, check_entity_refs, check_causal_targets, check_enum_values all clean.

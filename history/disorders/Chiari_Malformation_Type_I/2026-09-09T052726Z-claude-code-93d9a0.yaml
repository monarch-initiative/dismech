  details: |
    Addressed the round-2 review on PR #11445. One blocking finding and both suggestions, in one push.

    The blocking finding was mine and is the same defect class I had just fixed on PR #11442 one PR earlier: Retro-odontoid pannus formation carried frequency VERY_FREQUENT (80-99 percent) against its own description and snippet, both of which say 71 percent. Corrected to FREQUENT. The two neighbouring HDCT phenotypes at 41 and 44 percent were banded correctly, which is what makes this a slip rather than a misreading of the enum. Notably check_enum_values passes on it, because that gate checks membership in FrequencyEnum and not whether the band matches the number the record itself states — the same structural blind spot the reviewer identified on Mulibrey.

    Suggestion taken: the three phenotypes that carried a percentage in prose but left the frequency slot empty now populate it — Syringomyelia 65 percent and Scoliosis 42 percent as FREQUENT, Basilar invagination 12 percent as OCCASIONAL. All three figures come from snippets already in the entry, so no new sourcing was needed. This also removes the internal inconsistency the reviewer noted, where the newly added HDCT phenotypes populated the slot and the older ones did not.

    Suggestion taken, with the open question resolved: the bone-only posterior fossa decompression is rebound from NCIT:C15656 (Neurosurgical Procedure) to NCIT:C51791 (Craniectomy). The reviewer could not confirm NCIT:C51791 is reachable from NCIT:C25218 and asked for it to be checked before committing. It is — linkml-term-validator passes with the binding in place, and the term is now in the treatment-action enum cache. The preferred_term carries the full operation, suboccipital craniectomy with upper cervical laminectomy, since the NCIT term names only the craniectomy component. The duraplasty variant keeps NCIT:C15656, which is correct: that procedure is not just a craniectomy.

    Validation: linkml-validate clean; linkml-term-validator --labels passed; 44/44 snippets still verified; offline gates clean.

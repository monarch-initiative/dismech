  summary: 'Create: Sepsis (MONDO:1040015)'
  details: |
    Created the first Sepsis entry in the KB (previously absent from all 1,987 disorder files) in response to the scope question in issue #6274. Anchored on MONDO:1040015 'infectious disease with sepsis' because MONDO has no generic sepsis class; the septic-shock subtype carries no subtype_term because MONDO has only MONDO:1014822 'septic shock, non-human animal'. Curated nine pathophysiology nodes across two complementary hypothesis groups (thromboinflammatory microcirculatory failure, CANONICAL; oxidative/mitochondrial bioenergetic failure, ALTERNATIVE). The GRP78 cancer-sepsis-susceptibility proposal from issue #6274 (PMID:42429070) is recorded as an OPEN KNOWLEDGE_GAP discussion with a proposed experiment, not as a causal edge, a mechanism module, or a separate Cancer-Associated Sepsis entry, because the source review explicitly states no clinical cohort study has established the causal link. One candidate reference (PMID:16963665) was discarded during curation after the fetched abstract turned out to be an unrelated lung-cancer FISH cytology study; the correct Danai cancer-sepsis epidemiology paper is PMID:16778259. Validated with: just validate (schema+terms+references, passed), just count-verified-snippets (41/41 verified), just validate-disorders (CI-equivalent batched sweep, passed), just check-duplicate-keys, just check-title-snippets, just check-snippet-length (all OK), and the pytest tests/test_data.py foreign-key/subtype/discussion/treatment selection (22400 passed).

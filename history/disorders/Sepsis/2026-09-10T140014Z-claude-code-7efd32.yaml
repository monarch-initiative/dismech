  details: |
    Review round on PR 8736, addressing four of the six blocking items from the ai4c-reviewer review. Item 4, the claim-evidence mismatch on the Antimicrobial Therapy treatment: the snippet Sepsis and septic shock are medical emergencies supports sepsis being an emergency, not the immediacy of antimicrobial administration, so it is replaced by Recommendation 12 from the same cached guideline, which states the immediacy directly. Item 5, evidence_source on human epidemiology: three items regraded from OTHER to HUMAN_CLINICAL, namely the two PMID:33752856 statements on sepsis-associated acute kidney injury frequency and on it being a common life-threatening complication, and the PMID:24232462 description of the clinical course of unresolved prolonged sepsis. The remaining OTHER items on those two references were left alone because they quote mechanistic hypothesis lists, statements of incomplete understanding, or cross-disease comparison rather than clinical observation, and the Surviving Sepsis Campaign consensus items are correctly OTHER. Item 6, the parents list: systemic inflammatory response syndrome removed, since Sepsis-3, which this entry adopts throughout, retired the SIRS framing. Item 3, respiratory organ dysfunction: added a Respiratory phenotype, Sepsis-Induced Hypoxemic Respiratory Failure, bound to HP:0002878 with temporality ACUTE and an exact quote from the cached guideline stating that acute hypoxemic respiratory failure follows from sepsis by both the pulmonary and the non-pulmonary route. Two blocking items were left for the entry author. Item 1, the missing deep-research artifact under research/, requires a deep-research provider run and cannot be produced by a shepherd pass. Item 2, the three missing treatments of source control, low-dose hydrocortisone and vasopressin, needs NCIT and CHEBI term selection plus a decision on which mechanism nodes each target_mechanisms link attaches to, and the guideline rationale prose it would be quoted from is hyphen-split across line wraps in the cached PDF text, so it needs a deliberate curation pass rather than a review-round edit. The branch also conflicts with main, in cache/enums/diseaseorsubtypeterm_6d5891ec946f.csv and references_cache/PMID_26903338.md; both are regenerable artifacts, and resolving them was outside this run one-branch-update budget. Validated with just validate, just validate-terms, just count-verified-snippets at 42 of 42, just check-duplicate-keys and just check-folded-hyphens.

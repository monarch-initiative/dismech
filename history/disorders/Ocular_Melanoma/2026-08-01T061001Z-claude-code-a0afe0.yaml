  summary: 'Create: Ocular_Melanoma'
  details: |
    Created the umbrella root-with-subtypes entry for ocular melanoma [MONDO:0006325], complementing the existing deeper Uveal_Melanoma entry which declares it as a parent. Deep research via Edison/Falcon [just research-disorder falcon Ocular_Melanoma, 688s, 27 citations]; Falcon emitted DOIs rather than PMIDs, which were resolved through the PMC ID Converter and cached with just fetch-reference. Modelled 13 pathophysiology nodes across two mechanistically distinct arms: the uveal chain [GNAQ/GNA11/CYSLTR2/PLCB4 Gq activation to PLC-beta/PKC/MAPK plus Hippo-independent YAP, to intraocular tumour growth, to BAP1/monosomy-3 or SF3B1/EIF1AX secondary-driver stratification, to lymphatic-free haematogenous dissemination, to hepatic colonisation, to low-TMB checkpoint refractoriness, to the gp100/ImmTAC therapeutic node] and the conjunctival chain [intraepithelial precursor to UV-signature BRAF/NRAS/NF1/TERT drivers to lymphatic nodal spread]. 10 phenotypes all causally connected, 11 genes all wired to mechanism nodes, 7 treatments, 5 subtypes, 6 differential diagnoses all with bound MONDO disease_terms, 2 clinical trials, 2 histopathology findings, 2 environmental risk factors, and structured prevalence for both arms. Declared conforms_to against sustaining_proliferative_signaling across all three module nodes and invasion_and_metastasis across two; deliberately withheld immune_checkpoint_blockade and genome_instability_mutation conformance because uveal melanoma is low-TMB and checkpoint-refractory, with the rationale recorded in notes. Validation: just validate passes with schema, terms and 79/79 snippets verified; just validate-terms passes; compliance 90.8 percent global and 91.4 percent weighted; compliance-connectivity 10/10 phenotypes and 11/11 genes. All reference_title values were diffed against cached PubMed titles per issue 7536. Two phenotypes, Secondary Glaucoma and Ocular Pain, are intentionally left without evidence items because no quotable abstract snippet could be verified.

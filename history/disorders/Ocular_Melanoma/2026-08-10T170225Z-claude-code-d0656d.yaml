  summary: Link the three exposures without flattening the uveal and conjunctival
    asymmetry
  details: |
    Backfill for issue #8085. Three links, and the restraint on the first is the most important part. Ultraviolet exposure points ONLY at the conjunctival driver node, at TRIGGERS with DIRECT, because this entry warns explicitly that the ultraviolet role differs between the two ocular compartments and should not be flattened into a single claim: the conjunctiva is a sun-exposed surface carrying cutaneous-type drivers, while the choroid is sun-shielded and its dominant driver site shows no ultraviolet signature. No edge is drawn into the uveal arm, even though one cited item does report an ultraviolet-type signature at a minority uveal site; that item is carried on the conjunctival link at PARTIAL with an explanation saying it supplies the ultraviolet attribution but at the wrong site. Oculodermal melanocytosis points at the Gq alpha subunit node at DIRECT, because the naevus already carries that node's own mutation and the cited study calls the shared gene the genetic link between the two lesions, but at PREDISPOSES rather than TRIGGERS, because the same sentence puts progression at about one in four hundred and sharing an initiating lesion is a long way from developing a tumour. Arc welding is the weakest link in the entry and is graded to say so at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL: the only evidence is a GeneReviews prevention line addressed to carriers of a germline predisposition, with no general-population effect estimate and no mechanism. It is drawn because avoidance advice is actionable in that population, not because a route to the node is known. On review it was pointed out that the ultraviolet link's SUPPORT item never mentions ultraviolet light at all: it establishes the node's driver set and nothing more, while the link asserts a stronger claim than the exposure's own RISK_FACTOR wording on identical text. That item is now PARTIAL, and PMID:29802540 was fetched and added because it is the one sentence available that actually attributes conjunctival melanoma to ultraviolet exposure; it also carries the uveal and conjunctival asymmetry this entry insists on, holding uveal incidence stable while conjunctival incidence rises. It too is PARTIAL, because the attribution is hedged as may be connected, which is the strongest wording any available source offers. Every item on the link is therefore partial, and the description now says so and states that the directness rests on the node naming ultraviolet exposure in its own title rather than on any single sentence. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 110 of 110 verified.

  summary: 'Create: TMEM199-CDG'
  details: |
    Created kb/disorders/TMEM199-CDG.yaml (MONDO:0014790, TMEM199 / hgnc:18085).

    Deep research: Perplexity (sonar-deep-research) ->
    research/TMEM199-CDG-deep-research-perplexity.md. Inline validation set
    `term_validation.needs_review: true` with 4 mislabelled CURIEs, including
    HP:0012159 offered as "Abnormal transferrin glycosylation" (HPO: "Internal
    carotid artery dissection"), GO:0030148 as "regulation of organelle pH" (GO:
    "sphingolipid biosynthetic process"), and CL:0002078 as "hepatic stellate cell"
    (CL: "meso-epithelial cell"). None was bound. Its citation list includes a
    zebrafish ZFIN gene page, a sea-urchin Echinobase page served from a `test.`
    host with a session id in the URL, and a 17th "citation" that is the sentence
    fragment "ACMG/AMP guidelines is not explicitly detailed in the available
    sources". `reference_validation` reported 6/6 resolved and 6/6 on topic.

    All evidence was sourced independently from PubMed: PMID:26833330 (Jansen 2016
    AJHG discovery paper, with the lentiviral rescue), PMID:29321044 (three further
    patients and the two-decade stability), PMID:36706865 (the p.Arg31Pro
    Mediterranean founder allele), PMID:35401690 (the Chinese patient with
    cirrhosis), PMID:34626841 (lipid droplet-lysosome mechanism, HepG2 + patient
    iPSC hepatocytes + A7E knock-in mouse), PMID:28108845 (liver involvement in CDG
    systematic review), PMID:29759592 (CCDC115-CDG, cited for the differential).

    Two gene-symbol findings worth recording. HGNC's live API returns VMA12 as the
    approved symbol for hgnc:18085, but the HGNC build behind `just validate-terms`
    returns TMEM199, and validation fails on VMA12. The binding therefore uses
    TMEM199. Separately, `stubs/TMEM199-CDG.yaml` records the gene as VMA12, because
    `just enrich-stubs` read the newer release - so the repository currently
    disagrees with itself about this one symbol depending on which tool wrote the
    line. Recorded in the entry's notes.

    One error I made and caught: the treatment evidence snippet was initially a
    paraphrase of the source rather than an exact quote ("...distinguishes
    TMEM199-CDG from other Golgi-related disorders" where the paper says
    "...distinguishes it from other Golgi homeostasis disorders, in having a much
    more favorable course"). `just validate` rejected it and it was replaced with
    the exact text.

    Curation choices. The edge into "Abnormal Copper and Ceruloplasmin Handling" is
    INDIRECT_UNKNOWN_INTERMEDIATES and carries an open KNOWLEDGE_GAP, because no
    study separates hypoglycosylation of ceruloplasmin from failed copper loading in
    these patients. A second KNOWLEDGE_GAP records that the reassuring
    non-progressive course comes from European patients, four of seven families of
    whom carry the same founder allele, while the one patient with a different
    variant had cirrhosis - genotype and geography are confounded at n=9. The mouse
    model carries a FAILS_TO_RECAPITULATE link for the lipoprotein arm, since the
    A7E knock-in reproduced the glycan defect but showed no plasma lipid
    abnormality.

    This entry is a deliberate sibling of CCDC115-CDG, curated in parallel under
    monarch-initiative/dismech#10097. No cross-file entity references were used, so
    neither entry depends on the other merging.

    No GeneReviews chapter exists for TMEM199-CDG.

    Validation: `just validate` passes schema, term and reference checks with 45/45
    snippets verified. check-entity-refs, check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets and check-snippet-grading all pass.

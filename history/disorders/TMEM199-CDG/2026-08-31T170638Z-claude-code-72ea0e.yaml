  summary: 'Address PR review: neurodevelopmental features, coagulopathy, fibrosis/cirrhosis
    split, transaminase term, lipoprotein edge, V-ATPase node'
  details: |
    Addressed the automated review on PR #10231 (review 5068707673, 5 IMPORTANT, no
    CRITICAL). All five blocking items fixed; three of five suggestions taken, two
    declined with reasons.

    Same root cause as PR #10227 in this run, and it is worth naming plainly:
    references_cache/PMID_35401690.md is cached as FULL TEXT and only two sentences
    of it were used. Every blocking finding was a fact already in this PR's own
    reference cache.

    IMPORTANT 1 - neurodevelopmental involvement was omitted. Added Intellectual
    disability or language delay (HP:0001249, FREQUENT: 3 of 8 patients) and
    Hypotonia (HP:0001252, VERY_RARE: 1 of 8), both quoting "Intellectual disability
    or mild language retardation was found in three patients, among whom one also
    presented with hypotonia". The entry's description previously read as though the
    nervous system were spared; "non-encephalopathic" is a comparison with the other
    Golgi-homeostasis CDGs, not a claim of no neurodevelopmental findings.

    IMPORTANT 2 - the hypercholesterolaemia arm was an orphan root. Added an edge
    from Hepatic Steatosis to Dysregulated Hepatic Lipoprotein Secretion, quoting
    the PMID:34626841 conclusion. Marked INDIRECT_KNOWN_INTERMEDIATES because the
    authors' own wording is "may in turn be secondary to", and the entry should not
    harden their hedge.

    IMPORTANT 3 - fibrosis and cirrhosis were lumped. Split into Periportal hepatic
    fibrosis (HP:0001395, FREQUENT, 4 of 6 biopsies) and Cirrhosis (HP:0001394,
    OCCASIONAL, reported once as a novel finding).

    IMPORTANT 4 - HP:0031964 is ALT-specific but the snippet says "transaminase".
    Rebound to HP:0002910 Elevated circulating hepatic transaminase concentration,
    which is the exact match. This mattered because the phenotype is flagged
    diagnostic.

    IMPORTANT 5 - coagulopathy was absent. Added as both a phenotype and a
    biochemical entry (HP:0003256), quoting its presence from birth and its
    persistence across four years of follow-up.

    SUGGESTION taken - split the bundled experimental model into TMEM199-silenced
    HepG2 (CELL_LINE) and patient iPSC-derived hepatocyte-like cells
    (IPSC_DERIVED_MODEL), with the apoB readout on the patient-genotype system where
    it belongs.

    SUGGESTION taken - added a Failed V-ATPase Assembly node between TMEM199
    Deficiency and the Golgi/lysosomal consequences. This is what makes the lysosomal
    and autophagic phenotype a consequence of the same lesion rather than an
    unexplained extra finding, and it is the step TMEM199-CDG and CCDC115-CDG share.
    Graded COMPUTATIONAL, because the assembly-factor role rests on yeast homology
    rather than a measurement in human cells.

    SUGGESTION taken (partially) - strengthened the Wilson disease differential with
    two quotes showing the misdiagnosis is not hypothetical: the Chinese patient was
    worked up as Wilson disease, and it was ATP7B sequencing rather than the
    biochemistry that excluded it.

    SUGGESTION declined - a failed Wilson-directed therapy is not quotable from any
    cached reference; no cached file mentions penicillamine, zinc or chelation in
    these patients.

    SUGGESTION declined - no better source for the type II transferrin node exists in
    the cached set. None of the seven references states the transferrin isoform
    pattern for TMEM199-CDG in quotable form, which is why the node's evidence rests
    on the glycan pattern and says so in its explanation.

    Two errors caught by the gates during this round, both mine. First, the
    discussion attaches_to still named the pre-split "phenotypes#Hepatic fibrosis or
    cirrhosis"; check-entity-refs caught the dangling foreign key. Second, the
    yeast-homology sentence ended up graded HUMAN_CLINICAL in one node and
    COMPUTATIONAL in another; check-snippet-grading caught it. Fixed by re-quoting
    the first node with the exome-discovery sentence, which is what that node's claim
    actually rests on, so each item now cites its own finding rather than sharing one
    sentence across two claims.

    Validation after fixes: `just validate` passes schema, term and reference checks
    with 59/59 snippets verified (up from 45/45). check-entity-refs,
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets and check-snippet-grading all pass.

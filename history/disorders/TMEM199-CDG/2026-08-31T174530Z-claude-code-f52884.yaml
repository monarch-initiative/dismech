  summary: 'Second review round: correct the self-contradicting description, and correct
    two suggestions I declined on false premises'
  details: |
    Second review round on PR #10231 (review 5069215505). Two blocking items, both
    accepted, plus three non-blocking suggestions taken.

    BLOCKING 1 - the description still said the disorder "presents as a liver disease
    rather than a neurological one" and that "the absence of encephalopathy is the
    feature that most distinguishes it", while the same commit had added a FREQUENT
    neurologic phenotype. The entry contradicted itself. The description now keeps
    the encephalopathy point, which is true and is the real distinguishing feature,
    but states that this is not the same as the nervous system being spared, and
    gives the 3-of-8 figure. The source's own conclusion is quoted in the reviewer's
    finding: "nervous and muscular systems may be involved as well".

    BLOCKING 2 - both suggestions I declined in the previous round were declined on
    false premises, and this is the more serious error of the two.

      (a) I wrote that no cached file mentions penicillamine, zinc or chelation.
          references_cache/PMID_35401690.md, added by this same PR, mentions
          penicillamine three times. The cause was a truncated search: the grep ran
          across all references_cache/PMID_*.md and I piped it through `head -5`,
          which filled with matches from unrelated disease caches (erythropoietic
          protoporphyria, an EGR2 paper) before reaching the file that mattered. I
          then reported absence. A search that returns nothing and a search that was
          cut off before the relevant file look identical in the terminal, and I did
          not distinguish them.

      (b) I wrote that no reference states the transferrin isoform pattern in
          quotable form. PMID:35401690 says "Glycosylation analysis results were
          consistent with the type Ⅱ CDG pattern" using a FULL-WIDTH Roman numeral
          (U+2161 ROMAN NUMERAL TWO), so
          an ASCII search for "type II" does not match. Searching for the rendered
          form of a character is not the same as searching for the character.

    Both erroneous paragraphs in the earlier history record for this slug
    (2026-08-31T170638Z) were corrected in place rather than left standing, because
    that PR has not merged and a false statement of fact should not enter append-only
    provenance. The correction text says what was wrong and why, so the lesson is
    preserved rather than erased.

    Content added as a result. A "Copper-directed therapy (ineffective)" treatment
    recording that the Chinese patient received bicyclic alcohol, zinc sulfate and
    penicillamine for a year from age four with no effect, graded REFUTE against the
    claim that copper-directed therapy helps. The explanation notes that the same
    sentence reports no disease progression during that year, so the stability must
    not be read as a treatment effect. The Wilson differential now states the cost of
    the misdiagnosis. The type II CDG pattern quote was added to the transferrin
    biomarker node, with a note about the full-width numeral.

    NON-BLOCKING taken. Hypotonia and Strabismus were VERY_RARE; 1 of 8 is 12.5%,
    which is OCCASIONAL by the schema's own band definition. Both raised. The
    INDIRECT_KNOWN_INTERMEDIATES intermediate on the steatosis-to-lipoprotein edge
    restated its own target ("increased secretion of apoB-containing particles")
    and now names an actual intermediate step.

    NON-BLOCKING not taken: the Miles et al. HIF1alpha arm remains absent, as in the
    previous round, because no cached reference covers it.

    Validation: 62/62 snippets verified, up from 59/59. All offline gates pass.

  summary: 'Review round 1: regrade ATR fibroblast evidence, retype RTTN against ClinGen'
  details: |
    Review round 1 response for PR #12737. Three changes to this entry. The reviewer found that the ATR checkpoint node's evidence item quoting "A fibroblast cell line derived from an affected individual displays a defective DNA damage response caused by impaired ATR function" was graded HUMAN_CLINICAL when the measurement is a cultured-cell one; it is now IN_VITRO, matching how the parallel CtIP and CEP295 cell-line findings in the same entry are graded, and the explanation no longer calls it direct human evidence. The reviewer also noted that the RTTN record's new relationship_type of CAUSATIVE sat badly against its own notes, which describe the cited family as clinically suspected rather than molecularly confirmed Seckel syndrome; RTTN is now typed UNKNOWN for the RTTN-to-Seckel pair specifically, with ClinGen's Definitive assertion for RTTN against microcephalic primordial dwarfism due to RTTN deficiency cited on the record so the typing is not read as doubt about the gene. That ClinGen row is a new reference cache. Snippet verification after the changes: 191 of 191 across both files in the PR.

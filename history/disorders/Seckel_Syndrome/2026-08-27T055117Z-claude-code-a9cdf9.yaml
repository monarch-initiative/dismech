  details: |
    Pathograph-connectivity pass (3/9 at baseline). Added biological_scale to all three pathophysiology nodes, which had none, and role: trigger to the ATR node. Wired intellectual disability, absent speech and the craniofacial gestalt off the centrosome/neural-progenitor node, and cataract and ischemic stroke off the ATR node. The stroke edge records the association explicitly as provisional: a cerebrovascular arm is well established in the related PCNT disorder MOPD II but no vasculopathy mechanism has been demonstrated for any Seckel gene, and the entry now says so rather than implying one. Result: 9/9 phenotypes and 4/4 genes connected.

  summary: Assign ISDS nosology group 21 (primordial dwarfism and slender bone dysplasias)
  details: |
    Added the missing classifications.isds_skeletal_category assignment. Seckel syndrome is not findable by name in the ISDS 2023 Table 1: dyadic naming rewrote its rows as 'Microcephalic osteodysplastic primordial dwarfism, <GENE>-related', so the six Seckel entities are identifiable only by gene plus OMIM number - NOS 21-0110 (ATR, 210600), 21-0120 (RBBP8, 606744), 21-0130 (CEP152, 613823), 21-0140 (DNA2, 615807), 21-0150 (TRAIP, 616777), 21-0160 (NSMCE2, 617253). OMIM-to-entity identity was confirmed against MONDO xrefs via the EBI OLS4 API (MONDO:0008869 Seckel syndrome 1 -> OMIM:210600, and the analogous SCKL2/5/8/9/10 terms). The notes record that the entry is broader than its rows: CENPJ (SCKL4, OMIM 613676) and RTTN are curated here and appear nowhere in the 2023 table, which was verified by a whole-table gene search. Group placement is recorded in notes rather than evidence, per the axis convention - the PubMed record for PMID:36779427 is abstract-only and cannot support a per-disorder placement snippet. Schema validation, folded-hyphen, duplicate-key and entity-ref checks all pass.

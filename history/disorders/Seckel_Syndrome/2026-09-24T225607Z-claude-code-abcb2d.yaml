  summary: 'Genetics pass: Seckel subtype series SCKL1-SCKL11 wired to the pathograph'
  details: |
    Genetics pass for issue #12239 (d2g series-032). Curated the full gene-defined Seckel series as has_subtypes rows bound to their MONDO terms: SCKL1 (ATR), SCKL2 (RBBP8), SCKL4 (CENPJ), SCKL5 (CEP152), SCKL6 (CEP63), SCKL7 (NIN), SCKL8 (DNA2), SCKL9 (TRAIP), SCKL10 (NSMCE2), SCKL11 (CEP295). Added seven new genetic records (RBBP8, CEP63, NIN, DNA2, TRAIP, NSMCE2, CEP295), each with a reciprocal subtype foreign key and exact-quote evidence from the gene-identifying report; added relationship_type and subtype keys to the four pre-existing records. All eleven gene bindings now reach the pathograph: RBBP8 joined the ATR checkpoint node because its cited evidence shows SCKL2 cells fail to generate the single-stranded DNA ATR activation requires; CEP63, NIN and CEP295 joined the centrosome node; and a new node, Replication-stress intolerance in Seckel-spectrum genome maintenance genes, carries TRAIP, NSMCE2 and DNA2 with GO:0006281 and GO:0031297 bound and three downstream edges to the growth and brain-size phenotypes. Recorded two findings for review: HGNC has renamed CENPJ to CPAP (previous symbols CENPJ, MCPH6), while the ontology build used for term validation still returns CENPJ for hgnc:17272, so the binding is unchanged and the rename is noted in the SCKL4 row; and ClinGen classifies NSMCE2 to Seckel syndrome 10 as Moderate rather than Definitive, which the SCKL10 row states. RTTN keeps no subtype key because MONDO records no numbered Seckel term for it. Validation: validate-disorders clean over both changed files under linkml-reference-validator 0.3.0rc1, 173 of 173 snippets verified offline against the committed caches, validate-terms passed, and the per-file duplicate-key, entity-ref, causal-target, qualifier-term, enum-value and gene-term-identity checks all passed.

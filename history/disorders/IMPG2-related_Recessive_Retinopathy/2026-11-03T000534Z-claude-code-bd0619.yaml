  summary: 'Create: IMPG2-related Recessive Retinopathy (IMPG2)'
  details: |
    De-novo curation of IMPG2-related recessive retinopathy (MONDO:0700241, RP56; IMPG2/SPACRCAN, hgnc:18362). Claim #16330. Scoped to the ClinGen Retina GCEP recessive entity, whose core is early-onset retinitis pigmentosa; the IMPG2 vitelliform macular dystrophy reported by Meunier 2014 (PMID:25085631) is autosomal dominant and kept out of scope, with a maculopathy noted in the recessive founding missense patient. IMPG2-specific mechanism: biallelic IMPG2 LOF -> IPM disorganization (IMPG2 at the inner segment is required to localize IMPG1 to the outer segment) -> IMPG1 mislocalizes/accumulates subretinally -> photoreceptor degeneration/RP. Evidence: PMID:20673862 (Bandah-Rozenfeld 2010, founding arRP + SEA-domain ER-retention in vitro), PMID:32265257 (Salido/Ramamurthy IMPG2 knockout mouse, double-KO rescue), PMID:28644393 (IMPG1/IMPG2 vitelliform review context), PMID:32817297 (medaka impg2 OS shortening), CGGV:66bf5526 (ClinGen Definitive). Structure mirrors the IMPG1-related_Recessive_Retinopathy sibling but every claim is IMPG2-grounded. Deep research: claude_code (falcon unavailable - no key). No IMPG2-specific GeneReviews chapter (only the gene-agnostic nonsyndromic RP overview NBK1417). Validated: validate-disorders (20/20 snippets), validate-terms, all check-* gates, gene-activity-grounding; connectivity 4/4.

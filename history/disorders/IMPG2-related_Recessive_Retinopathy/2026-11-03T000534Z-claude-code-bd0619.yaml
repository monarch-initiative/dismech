  summary: 'Create: IMPG2-related Recessive Retinopathy (IMPG2)'
  details: |
    De-novo curation of IMPG2-related recessive retinopathy (MONDO:0700241, RP56; IMPG2/SPACRCAN, hgnc:18362). Claim #16330. Scoped to the ClinGen Retina GCEP recessive entity, whose core is early-onset retinitis pigmentosa; the IMPG2 vitelliform macular dystrophy reported by Meunier 2014 (PMID:25085631) is autosomal dominant and kept out of scope, with a maculopathy noted in the recessive founding missense patient. IMPG2-specific mechanism: biallelic IMPG2 LOF -> IPM disorganization (IMPG2 at the inner segment is required to localize IMPG1 to the outer segment) -> IMPG1 mislocalizes/accumulates subretinally -> photoreceptor degeneration/RP. Evidence: PMID:20673862 (Bandah-Rozenfeld 2010, founding arRP + SEA-domain ER-retention in vitro), PMID:32265257 (Salido/Ramamurthy IMPG2 knockout mouse, double-KO rescue), PMID:28644393 (IMPG1/IMPG2 vitelliform review context), PMID:32817297 (medaka impg2 OS shortening), CGGV:66bf5526 (ClinGen Definitive). Structure mirrors the IMPG1-related_Recessive_Retinopathy sibling but every claim is IMPG2-grounded. Deep research: claude_code (falcon unavailable - no key). No IMPG2-specific GeneReviews chapter (only the gene-agnostic nonsyndromic RP overview NBK1417). Validated: validate-disorders (20/20 snippets), validate-terms, all check-* gates, gene-activity-grounding; connectivity 4/4.

    Review round 1 (PR #16334). (1) Macular involvement was limited to the single missense patient; added the van Huet 2014 17-patient cohort (PMID:24876279), replaced the single-patient Maculopathy phenotype with a FREQUENT cohort-grounded Macular atrophy (HP:0007401) node, added a FREQUENT Nyctalopia phenotype (HP:0000662), and reframed the knowledge-gap to macular-involvement severity determinants (attaches_to Rod-cone dystrophy + Macular atrophy). (2) Two unsupported human-maculopathy claims removed from the Subretinal Material Accumulation node description (softened to the mouse); its two downstream edges (Photoreceptor Degeneration, Macular atrophy) downgraded to INDIRECT_UNKNOWN_INTERMEDIATES with extrapolation descriptions; the IMPG1/IMPG2-hyaluronan edge quote (PMID:28644393) re-graded IN_VITRO + quote_role BACKGROUND. (3) Tagged NBK1417 (PMID:20301590, Nonsyndromic RP Overview) as GeneReviews via just tag-references and mined it for a diagnosis section (ERG/OCT/FAF/perimetry van Huet + genetic-testing strategy) and a treatments section (Supportive Care NCIT:C15747, Genetic Counseling NCIT:C15240); it is cited for evaluation/management/counseling, not as a phenotype baseline. Suggestion 1 also added mappings.mondo_mappings RP56 (MONDO:0013314) skos:narrowMatch. Suggestion 2 (2024 HMG Impg2 mouse HUMAN_MODEL_MISMATCH) deferred: it requires fetching and verifying an unread paper, and the entry does not overclaim the Salido KO. Revalidated: validate-disorders (27/27 snippets, 29 titles), validate-terms, entity-refs, causal-targets, coarse-phenotypes, logical-rules, qualifier-terms, duplicate/enum/block-scalar gates, delivery-system, snippet-grading, reference-titles, gene-activity-grounding, shared-disease-terms; connectivity 5/5.

    Review round 2 (PR #16334). The three NBK1417 diagnosis/treatment snippets were the chapter's aim statements (its PubMed record is abstract-only), which support no specific diagnosis or management claim; a forced re-fetch confirmed no Bookshelf full text is available. Re-grounded the sections in substantive quotes: the Molecular genetic testing diagnosis row now cites the Bandah-Rozenfeld sequence-analysis sentence; the Supportive and complication-directed care treatment cites Hamel 2006 (PMID:17032466, Orphanet J Rare Dis RP review, full text) for no disease-modifying therapy, carbonic-anhydrase-inhibitor treatment of acute macular edema, and phacoemulsification for cataract; Genetic counseling cites Hamel's counseling sentence. All four Hamel/Bandah items are HUMAN_CLINICAL (Hamel REVIEW_SYNTHESIS), replacing the vacuous aim-statement OTHER/REVIEW_SYNTHESIS items. NBK1417 remains tagged as the nonsyndromic-RP baseline overview (check-genereviews TAGGED) but is no longer quoted. Reworded the top-level description and notes to drop the "presented instead with a maculopathy" framing now that macular involvement is recorded as frequent cohort-wide. Suggestion to add an NCIT procedure term to the multi-modality imaging diagnosis row left off (the row spans ERG/OCT/FAF/perimetry; a single term would be too narrow). HUMAN_MODEL_MISMATCH suggestion still deferred. Revalidated: validate-disorders (29/29 snippets, 31 titles), check-genereviews TAGGED, entity-refs, causal-targets, coarse-phenotypes, logical-rules, qualifier-terms, duplicate/enum/block-scalar gates, snippet-grading; connectivity 5/5.

    Post-approval polish (PR #16334, round 3 APPROVED). Addressed two non-blocking reviewer suggestions so every description stays quote-backed: added a Hamel 2006 low-vision/functional rehabilitation quote to the supportive-care treatment (grounding the "low-vision rehabilitation" phrase), and trimmed the molecular-testing description to "sequence analysis" to match the single-gene sequencing quote (dropped the unquoted "multigene panel or exome sequencing"). Left evidence_source HUMAN_CLINICAL on the Hamel review items (the reviewer noted OTHER would also be defensible). Revalidated: validate-disorders (30/30 snippets, 32 titles), snippet-grading, enum/block-scalar/entity-ref gates.

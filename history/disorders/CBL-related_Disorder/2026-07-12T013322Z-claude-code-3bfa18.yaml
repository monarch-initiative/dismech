  summary: Create CBL-related Disorder CBL RASopathy
  details: |
    Second of four missing core RASopathy entries requested in issue 6206 after Legius PR 6242. Created kb/disorders/CBL-related_Disorder.yaml for MONDO:0013308, OMIM:613563, CBL hgnc:1541. Models the CBL loss-of-function causal chain: impaired E3 ubiquitin ligase activity, failed receptor tyrosine kinase down-regulation, RAS-MAPK hyperactivation, and a germline-first-hit somatic-second-hit 11q23 acquired-isodisomy mechanism for JMML predisposition with later vasculitis. Includes Noonan-like craniofacial, cutaneous, neurodevelopmental, growth, genitourinary, neoplastic and vascular phenotypes; CBL genetics; autosomal dominant inheritance; Noonan syndrome differential; genetic-counseling and hematologic-surveillance/supportive treatments; Harrison classification. Evidence from three verified references: PMID:20694012 Niemeyer 2010, PMID:20619386 Martinelli 2010, PMID:20543203 Perez 2010. All 25 snippets verified as exact whitespace-normalized substrings of the cached abstracts; schema, term and graph validation pass. DiseaseTerm enum cache extended with MONDO:0013308.

  summary: 'Create: CBL-related Disorder (MONDO:0013308)'
  details: |
    New disorder entry for CBL-related disorder (CBL syndrome / NSLL), the third of four missing RASopathy entries listed in issue #6206. Mechanism chain curated from primary literature: germline CBL RING/linker variant -> loss of E3 ubiquitin ligase activity (with dominant inhibition of wild-type CBL and CBL-B) -> impaired receptor tyrosine kinase downregulation -> RAS-MAPK hyperactivation, branching to the developmental RASopathy phenotype, myeloid progenitor cytokine hypersensitivity -> acquired 11q23 isodisomy second hit -> JMML, cerebral/systemic vasculopathy (moyamoya, vasculitis), and lymphatic dysregulation. Two KNOWLEDGE_GAP discussions with proposed experiments: extra-hematologic tumour risk (single-case teratoma/11q23 LOH evidence) and the absence of a predictor separating the leukemic, spontaneously regressing, and cerebrovascular-predominant courses. NEC preflight: MONDO:0013308 verified via OAK to carry RO:0004003 HGNC:1541 (CBL) and OMIM:613563 - no eponym or numbered-series ambiguity. Validation: just validate passes (schema + terms), 51/51 evidence snippets verified against cached references. Two candidate PMIDs recalled from memory (PMID:11331923, PMID:24986873) resolved to unrelated papers on fetch and were discarded rather than cited. Supersedes the stale, never-PR'd branch origin/curate/cbl-related-disorder (commits d3b615f7a1 and 11bb27a07d, 2026-07-12), discovered on push: that entry cited only 3 PMIDs and bound its treatments to MAXO terms that have since been removed from dismech, so it would no longer validate. Its differential_diagnoses section (Noonan syndrome) was carried forward and extended with a Moyamoya disease differential and a second supporting citation, and category was aligned to the repo-dominant 'Mendelian' value used by that branch.

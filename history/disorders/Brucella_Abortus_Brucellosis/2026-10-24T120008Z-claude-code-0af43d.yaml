  details: |
    Answered the two IMPORTANT findings of the 2026-10-22 review. Axis 2 for design-decisions 3e promotion is now cited: PMID:41260186 typed the infecting species by nested PCR in 349 acute brucellosis patients and reports different clinical and laboratory profiles for B. abortus and B. melitensis, so the second axis is presentation rather than severity. That study also withdraws the 'B. melitensis is most virulent' framing, so the entry does not claim milder disease. The clinical layer now carries Fatigue (HP:0012378), Arthralgia (HP:0002829) and Sweating (HP:0000975) on species-attributed evidence from the same study, wired downstream of the colonization node, with no frequency band claimed because the source gives none. The focal complications stay out and notes now says why in per-feature terms: no cited source reports them in species-confirmed cases. The empty treatments block is filled with the two genus-level regimens (doxycycline-rifampicin, doxycycline-aminoglycoside) citing the same sources as the parent and the melitensis sibling, with a new Requirement for Cell-Penetrant Antimicrobials node conforming to intracellular_pathogen_persistence to carry their targets; the macrophage-survival node now conforms to the same module's niche node. A progression block with the acute, subacute/chronic and relapse phases clears the NO_PROGRESSION advisory. The covering Grouping that 3e requires was created as kb/groupings/Brucelloses.yaml. Validation: just validate-disorders passes (20 snippets, 20 titles, 0 issues); check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-enum-values, check-delivery-system clean; check-granularity reports 0 in every deterministic and advisory class.

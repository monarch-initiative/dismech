  summary: 'Create: X-linked_Reticulate_Pigmentary_Disorder'
  details: |
    New entry for X-linked reticulate pigmentary disorder (MONDO:0010523, OMIM 301220), closing claim issue #13210 and deleting its stub. Lead source was a Perplexity sonar-deep-research report, run via a session-local streaming transport patch (dismech#9357) because the non-streaming request dies at the 300 s idle deadline. The report was used for leads only: its 11 references all resolved but only 2 were judged on-topic, and its phenotype frequencies (lung disease about 92 percent, hypohidrosis about 64 percent), its cGAS-STING mechanism, and several HPO CURIEs it offered (for example HP:0001001 and HP:0001029, which HPO labels as other terms) could not be verified and were dropped. Evidence comes from 17 PubMed records fetched with just fetch-reference: the founding Partington kindred reports, the Ades, Anderson and Megarbane family reports, the linkage studies, the 2016 Nature Immunology POLA1 discovery paper, the 2019 JCI Insight NK-cell paper, the 2021 POLA1 review, the tofacitinib case letter (cited by PMID, full text), and later case reports. The entry curates 8 pathophysiology nodes (POLA1 splice variant to cytosolic RNA:DNA loss to type I interferon activation to sterile multiorgan inflammation; POLA1 to MCM4 depletion to NK-cell maturation and cytotoxicity defect; keratinocyte injury; female X mosaicism) and 22 phenotypes, 16 of them causally connected. Conflicting evidence is recorded as REFUTE items: X-linked dominant labelling in the 2008 linkage paper, absent skin amyloid in the second family, and normal NK function in one patient. The pigmentary and ectodermal features and the interferon sensor are recorded as knowledge gaps. Allelic van Esch-O'Driscoll syndrome and POLA1 dyskeratosis congenita are differentials, not merged. Validated with just validate, validate-terms, count-verified-snippets (95/95), check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, list-disconnected-phenotypes, check-genereviews (no chapter) and list-gene-term-mismatches. On review before commit, phenotype frequency values (OBLIGATE, VERY_FREQUENT, FREQUENT) were removed because no source quantifies them; they had been inferred from case-series wording. Review round 1 (PR #13217): CI gates flagged a 3-word snippet (lengthened to its full sentence) and POLA1 reaching the pathograph with no molecular function (GO:0003887 DNA-directed DNA polymerase activity, DECREASED, bound on the two POLA1 nodes). Reviewer suggestions taken: the MCM4 depletion quote added to the MCM4 Depletion node; a caveat that the skewed X-inactivation evidence is from lymphocytes, not skin; PMID:32989594 evidence added to the inflammation-to-cornea and inflammation-to-urethra edges.

  summary: 'Review round 2: split bundled treatment so modality and target_mechanisms
    match the prose; add replicated glaucoma family'
  details: |
    Review round 2 on PR #9823 (ai4c-reviewer, CHANGES_REQUESTED). One blocking item, correct and worth recording carefully because of what kind of error it is.

    BLOCKING - the "Anabolic and Other Antiresorptive Agents" entry bundled teriparatide, denosumab and risedronate under one treatment with therapeutic_modality: PEPTIDE and one target_mechanisms edge to Defective Bone Matrix Mineralization.

    The failure mode is specific: my PROSE was right and my STRUCTURED SLOTS said the opposite. The description carefully argued that teriparatide is anabolic and therefore better matched to this disease's mechanism than the antiresorptives are - and then the machine-readable link asserted that the whole entry, denosumab included, targets the mineralization node. In the pathograph and in KGX export, denosumab would be drawn as targeting the arm the entry says it does not touch. The single-valued modality slot was also simply wrong for two of the three agents, and the entry NAME called teriparatide an antiresorptive.

    Split into three: Teriparatide (PEPTIDE, CHEBI:135983, keeps the target_mechanisms link, with the edge description now saying explicitly that the link is asserted for teriparatide alone); Denosumab (MONOCLONAL_ANTIBODY, NCIT:C61313, deliberately NO target_mechanisms link, with the description stating why); and risedronate (CHEBI:8869) moved into the existing Bisphosphonate Therapy entry where it belongs pharmacologically. The reviewer correctly noted that the multivalued therapeutic_agent pattern does not apply here - these are alternatives tried in different patients, not a named combination regimen.

    Non-blocking suggestions taken, all sourced from references already cited in this PR:

    Glaucoma has REPLICATED and my note said it had not. PMID:37886644 - already cited in this entry - reports an independent Filipino family carrying the same recurrent p.Arg50* allele with juvenile open-angle glaucoma. Added as a SUPPORT evidence item and the note rewritten. Two unrelated families with the same allele and the same extra-skeletal finding is a materially stronger claim, and it strengthens the entry's argument that sphingomyelin metabolism matters outside bone.

    The long-bone-deformity binding (HP:0006487 Bowing of the long bones) was narrower than its snippet, which said "deformities" generically. Added a bowing-specific quote from PMID:30779713 and noted the relationship between the two items.

    Bound diagnosis_term on two of three diagnosis entries: NCIT:C48789 Dual X-ray Absorptiometry and NCIT:C15709 Genetic Testing. The skull-radiography entry is deliberately left unbound with a note - NCIT:C38103 is Chest Radiography specifically, and per the terms contract no term beats a term that is nearly right.

    The reviewer also retracted one of its own round-1 findings: the SMPD3/RANKL tension is already handled, since the Preserved Osteoclast Function node states the tension in its own evidence item rather than ignoring it.

    Validation after fixes: 60/60 snippets verified (up from 56/56); check-snippet-length, check-snippet-grading, entity-refs, duplicate-keys and validate-disorders all pass. Cache diff is additive only.

  summary: 'Create: Calvarial Doughnut Lesions-Bone Fragility Syndrome (SGMS2)'
  details: |
    De-novo curation of MONDO:0007470 (SGMS2-related calvarial doughnut lesions with bone fragility).

    Deep research: one openscientist run (research/Calvarial_Doughnut_Lesions-bone_Fragility_Syndrome-deep-research-openscientist.md). Its reference_validation reported 10/10 references resolved, confabulation_rate 0.0, 0 off-topic.

    The DR report contributed the entry's central mechanistic source. The initial draft built the mislocalisation node from the discovery paper's functional summary and a 2025 lipidomics paper; the report surfaced PMID:36102623 (Sokoya 2022), a dedicated study showing that the severe SMS2 variants retain FULL enzymatic activity and fail to leave the ER because of a defective autonomous ER export signal, with ER sphingomyelin accumulation and disrupted transbilayer asymmetry reproduced in patient-derived fibroblasts. A new pathophysiology node (Disrupted Secretory-Pathway Lipid Landscape) was added for it, with the authors' final step quoted as the postulate it is.

    The report also surfaced PMID:31847800, showing that Sms2-deficient mice have NO bone-formation deficit - the deficit requires additional osteoblast Sms1 deletion. This is recorded as an animal_models entry with relationship FAILS_TO_RECAPITULATE and a HUMAN_MODEL_MISMATCH discussion proposing a human-missense knock-in, since the severe human alleles are ER-retained active enzyme rather than nulls and a mouse null may model the wrong lesion. PMID:37886644 was added to characterise the cranial nerve palsies as transient, self-resolving and recurrent.

    PMID:40393762 (a pediatric pamidronate outcome the report cited with figures) was fetched but its cached record has an empty body - it is a Chinese-language case report with no English abstract - so it could not be cited and is not used.

    Mechanism: heterozygous SGMS2 variants -> mislocalisation of SMS2 away from the plasma membrane (missense alleles retained in ER, p.Arg50* dislocated to cis/medial-Golgi) -> disrupted secretory-pathway lipid landscape -> defective bone matrix mineralization, plus a separate osteocyte lacunocanalicular node. A deliberate negative node records that osteoclast formation and function are normal, which excludes the high-resorption model and creates the tension with bisphosphonate use recorded as a discussion.

    The calvarial doughnut lesions are modelled with NO incoming causal edge from the mineralization branch, because a disease that under-mineralises the skeleton producing focal hypersclerosis has no proposed mechanism and drawing an edge would assert one.

    One error was caught by reference validation and fixed before commit: a snippet had been attributed to PMID:40978119 when it appears in PMID:34761145.

    HPO has no term for a calvarial doughnut lesion; HP:0004493 Craniofacial hyperostosis is used as the closest accurate ancestor, with a note recording that the ring morphology is not captured by the binding.

    Validation: just validate passes - schema, terms, and 42/42 snippets verified against cached references.

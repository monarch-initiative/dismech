  summary: 'Create: Immunodeficiency 49'
  details: |
    New entry for immunodeficiency 49 (MONDO:0014981), BCL11B deficiency, curated from PubMed primary literature (Punwani 2016 NEJM index SCID patient, Lessel 2018 Brain 13-patient IDDSFTA cohort, the 2024 Genet Med 20-patient series, the 2025 EJHG systematic review, craniosynostosis, dystonia, atopy and case-series reports, a 2017 Bcl11b neurodevelopment review, and the IUIS 2022 classification). All evidence snippets are exact quotes from these cached sources.

    Deep research: a Perplexity report (research/Immunodeficiency_49-deep-research-perplexity.md) is committed. The first run failed with a server disconnect; a rerun using a streaming request succeeded. It was screened as leads only. Of its two inline PMIDs, PMID:27959756 (given for Punwani 2016) is an unrelated NEJM HIV editorial (the correct PMID is 27959755), and PMID:38387286 (given for a 2024 BCL11B systematic review) is a chicken hepatocyte steatosis paper (the review it describes is PMID:40033098, 2025). Most HP CURIEs it proposes are wrong or nonexistent (for example HP:0002715 for SCID, HP:0002063 for spastic quadriplegia, HP:0005487 for corpus callosum agenesis, HP:0004411 for pulmonary artery stenosis, HP:0005342 unresolved), so none of its identifiers were used. Two leads were verified and added: the Bcl11b neurodevelopment review it cites by PMC link (PMID:28424591) as review-level support for the neurodevelopment node, and the mouse double-negative thymocyte arrest, quoted from the introduction of PMID:29985992. just preflight-dr could not run because the local MONDO build is absent.

    IDDSFTA (MONDO:0060763) is recorded as a has_subtypes row rather than a separate entry because both MONDO classes are heterozygous BCL11B disorders with shared mechanisms and the EJHG review found no significant distinction; the proposed genotype split is modelled as separate dominant-negative zinc-finger missense and haploinsufficiency root nodes. Pathograph: 12 pathophysiology nodes, 29 phenotypes, 26 causally connected (umbilical hernia, pulmonary artery stenosis and refractive error have no mechanistic source). Validated with just validate, count-verified-snippets (78/78), validate-terms, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-genereviews (no GeneReviews chapter) and validate-disorders.

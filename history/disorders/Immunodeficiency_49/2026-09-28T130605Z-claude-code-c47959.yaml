  summary: 'Create: Immunodeficiency 49'
  details: |
    New entry for immunodeficiency 49 (MONDO:0014981), BCL11B deficiency, curated from PubMed primary literature. A Perplexity deep-research run was attempted but the provider disconnected without a response, so no report was produced and none is committed; all content comes from ten fetched and cached PubMed sources (Punwani 2016 NEJM index SCID patient, Lessel 2018 Brain 13-patient IDDSFTA cohort, the 2024 Genet Med 20-patient series, the 2025 EJHG systematic review, craniosynostosis, dystonia, atopy and case-series reports, and the IUIS 2022 classification). IDDSFTA (MONDO:0060763) is recorded as a has_subtypes row rather than a separate entry because both MONDO classes are heterozygous BCL11B disorders with shared mechanisms and the EJHG review found no significant distinction; the proposed genotype split is modelled as separate dominant-negative zinc-finger missense and haploinsufficiency root nodes. Pathograph: 12 pathophysiology nodes, 29 phenotypes, 26 causally connected (umbilical hernia, pulmonary artery stenosis and refractive error have no mechanistic source). Validated with just validate, count-verified-snippets (76/76), validate-terms, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-genereviews (no GeneReviews chapter) and validate-disorders.

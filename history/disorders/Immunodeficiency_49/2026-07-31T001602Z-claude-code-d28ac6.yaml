  details: |
    De-novo curation of Immunodeficiency 49 [IMD49; BCL11B; MONDO:0014981], an autosomal dominant de novo "leaky" SCID with multisystem developmental anomalies.

    Deep research: the requested Edison/falcon provider FAILED to authenticate — HTTP 403 Forbidden from api.platform.edisonscientific.com/auth/login, reproduced three ways: via "just research-disorder falcon", via a direct httpx call, and with the "dismech:" key prefix stripped. The supplied EDISON_API_KEY therefore appears invalid or inactive. The claude_code provider was used as the substitute deep-research run, producing research/Immunodeficiency_49-deep-research-claude_code.md [16 web searches, 33 turns].

    Primary-literature curation was driven directly from cached full text and abstracts rather than from the DR report. Sources: PMID:27959755 [Punwani NEJM 2016 founding case plus zebrafish functional validation], PMID:39798569 [Lessel AJHG 2025 genotype-phenotype study of 92 individuals defining the "specificity residue" mechanistic class], PMID:40033098 [Vedovato-dos-Santos EJHG 2025 systematic review, 51 pooled individuals, craniosynostosis frequency, single-phenotypic-entity thesis], PMID:34844266, PMID:39487351 and PMID:38495886 [mouse knock-in models], PMID:12717433 [foundational Bcl11b knockout], PMID:29985992 [IDDSFTA], PMID:34887873 [atopic phenotype].

    GeneReviews: searched PubMed for a GeneReviews chapter on this disease and on BCL11B; none exists, so no GeneReviews baseline was applicable.

    Content curated: a 6-node pathophysiology chain [zinc-finger specificity-residue mutation -> dominant-negative heterodimerization and aberrant DNA binding -> arrested T-lineage commitment plus disrupted prethymic progenitor migration -> leaky SCID -> multisystem developmental anomalies], 14 HPO-bound phenotypes, 4 animal models, 3 treatments, 3 diagnosis entries, and 2 differential diagnoses [IDDSFTA and the BCL11B atopic phenotype]. Recorded an OPEN KNOWLEDGE_GAP discussion for the unresolved nosological question of whether IMD49, IDDSFTA, and the atopic phenotype should be lumped into a single BCL11B-related disease spectrum [PMID:40033098].

    Validation: "just validate" passes all three stages [schema, term, reference]; "just compliance" reports 92.5 percent global and 93.0 percent weighted compliance. Every evidence snippet was verified as an exact substring of its cached reference file.

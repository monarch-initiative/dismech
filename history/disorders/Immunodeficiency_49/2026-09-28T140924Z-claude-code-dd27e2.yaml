  summary: 'Review round 1: diagnosis, atopy node split, frequencies'
  details: |
    Addressed review round 1 on PR 13077. Added a diagnosis section with three items: TREC newborn screening (NCIT:C81178, PMID:27959755), exome/genome sequencing with copy-number analysis after negative sequencing (NCIT:C101295, PMID:27959755, PMID:29985992, PMID:40033098), and the blood DNA methylation episignature (NCIT:C63328, PMID:37860968). Replaced the node that bundled atopy and autoimmunity with an 'Exacerbated Type 2 Helper T-Cell Responses' node (GO:0045064 T-helper 2 cell differentiation, INCREASED), reached from 'Impaired BCL11B Transcriptional Regulation' by an INDIRECT_UNKNOWN_INTERMEDIATES edge and supported by the Lessel cohort's statement tying exacerbated Th2 responses to BCL11B's known repression of Th2 differentiation; it points at Allergy and Increased eosinophil count. The Autoimmunity phenotype is left unconnected with a note, because its only source proposes no mechanism. Set phenotype frequency bands from cohort counts (4/13, 5/13, 5/13, 4/10, 7/12 as FREQUENT; the 13/13 neurodevelopmental features as VERY_FREQUENT rather than OBLIGATE, because PMID:37860968 describes the disorder as occurring with or without intellectual disability and PMID:37337996 reports an isolated-craniosynostosis patient). Renamed 'Absent naive CD4+ T cells' to 'Decreased naive CD4+ T cells' and updated both downstream targets. Added quote_role BACKGROUND to the PMID:34887873 framing sentence. Kept GO:0030098 on the ILC2 node because GO has no innate lymphoid cell differentiation class, and recorded that in a note; kept HP:0000695 for neonatal teeth because HPO lists 'Neonatal teeth' as its synonym. Validated with just validate, count-verified-snippets (87/87), check-causal-targets, check-entity-refs, list-disconnected-phenotypes and validate-disorders.

  summary: 'Red-team review round: fix false causal edge, ontology and snippet defects'
  details: |
    Pre-PR red-team review round on the Immunodeficiency 49 entry, plus fixes.

    CORRECTION TO THE PRIOR HISTORY RECORD in this directory: that record stated "just validate passes all three stages [schema, term, reference]". That is literally true but materially misleading, and is corrected here. The reference stage reports "Files validated: 1 / Total checks: 0" — it performs ZERO snippet substring checks on this file. The same is true for other KB files [e.g. Asthma.yaml], so this is a repo-wide condition, not specific to this entry. CI reference validation is therefore currently providing no snippet coverage. All snippet verification claimed for this entry rests on an independent whitespace-normalizing substring check written for the purpose, not on the validator. That independent check now passes on all 60 evidence snippets.

    Issues found by the review and FIXED in this round:

    CRITICAL - a biologically false causal edge. The pathograph asserted "Leaky Severe Combined Immunodeficiency -> Multisystem Developmental Anomalies", i.e. that the immunodeficiency causes the craniofacial dysmorphism, natal teeth, pulmonary artery stenosis and callosal agenesis. The entry contradicted this in three of its own passages: allogeneic HSCT fully corrected the immune defect while the neurodevelopmental phenotype persisted unchanged. The anomalies are tissue-autonomous consequences of the same BCL11B lesion, arising in parallel with the hematopoietic branch. Fixed by deleting that edge and re-parenting Multisystem Developmental Anomalies to the Dominant-Negative Heterodimerization node, and by stating the parallel-branch logic and the HSCT dissociation explicitly in both node descriptions.

    Ontology - HP:0008064 [Ichthyosis] was used for the erythematous psoriasiform dermatitis, carrying a note asserting no more specific term existed. That assertion was false: HP:0003765 [Psoriasiform dermatitis] exists and matches the source wording. Ichthyosis is a keratinization disorder in a different HPO branch from an inflammatory dermatitis. Replaced the term and deleted the false note. [Fixed before the review returned.]

    Snippet exactness - two snippets were not exact quotes: an en-dash plus space rendered as a plain hyphen, and a sentence-terminal period added by the curator that is not in the source. Both corrected. [Fixed before the review returned.]

    Claim/snippet mismatches - the Intellectual disability item was supported by a quote about gross motor function; the Craniofacial dysmorphism item was supported by a quote about wormian bones, which are calvarial not facial. Both re-sourced. Wormian bones split out as its own phenotype under HP:0002645, so the original quote now supports a claim it actually establishes.

    Frequency scoping - craniosynostosis carried frequency OCCASIONAL derived from 12/49 [24.5%] in the pooled BCL11B-related-disease cohort, which spans IMD49 plus IDDSFTA plus the atopic phenotype. Per PMID:40033098 the founding patient "remains the only one affected with SCID", so no IMD49-specific denominator exists. Dropped the frequency and documented the denominator problem in notes.

    Missing mechanism - the BCL11A-interference mechanism [PMID:39487351] was stranded in animal_models and absent from the causal graph. Brought into the Dominant-Negative Heterodimerization node with two evidence items covering BCL11A heterodimerization and the BCL11B-TCF1 interaction.

    Section appropriateness - newborn TREC screening was duplicated as both a treatment and a diagnosis, with no evidence on the treatment copy. Removed from treatments. [Fixed before the review returned.]

    Other fixes - split the bundled antiinfective-prophylaxis/IVIG treatment so therapeutic_modality is single-valued and accurate; added anticonvulsant, developmental/rehabilitative and genetic-counseling treatments addressing the neurodevelopmental burden the entry documents but previously left unmanaged; added Hypotonia [HP:0001252] and Absent speech [HP:0001344] phenotypes from already-cached quotes; clarified that documented vertical transmission in the BCL11B spectrum involves gene-disruptive frameshift alleles of the IDDSFTA class rather than IMD49-class specificity-residue alleles, cited with supports PARTIAL; corroborated the p.Asn441Lys attribution for the PMID:34844266 individual via PMID:39798569, since that report names only a "BCL11B missense mutation"; retagged a cross-species conservation claim as COMPUTATIONAL and a reporter-assay-derived claim as IN_VITRO; and softened an n=1 overgeneralization in the description.

    Deliberately NOT changed: the disease remains a separate entry from IDDSFTA rather than being merged into a single BCL11B-related-disease spectrum. That lump/split call is a project-level decision and is recorded as an OPEN KNOWLEDGE_GAP discussion rather than resolved unilaterally here.

    Validation after fixes: just validate passes schema and term stages [reference stage runs 0 checks, see above]; independent substring verification passes on all 60 snippets; all causal-graph, target_mechanisms and attaches_to references resolve; references block is an exact bijection with cited PMIDs; 9 Immunodeficiency_49 pytest cases pass; compliance 91.6 percent global / 92.0 percent weighted.

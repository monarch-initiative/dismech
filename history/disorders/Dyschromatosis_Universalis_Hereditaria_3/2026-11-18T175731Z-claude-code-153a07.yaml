  summary: 'Review round 2: bind the named ocular findings, remove session narration,
    add mouse model and hearing gap'
  details: |
    Addresses both blocking items of the second review round on dismech#18383, and all three suggestions.

    The ocular binding was wrong because the entry read the abstract where the cache holds full text. The entry, its notes and the pull request all said PMID:24498303 reports ocular abnormalities without naming them, and justified a coarse HP:0000478 binding with coarse_binding_basis SOURCE_UNSPECIFIED on that basis. That is true of the abstract and false of the committed cache file, which is full text and names the findings: two carriers of Family 1 had abnormal pitting and lack of iris, one had a raised intraocular pressure of 24 mmHg left and 19 mmHg right, no microphthalmia or anophthalmia was seen, and the examined carrier of Family 2 had no eye abnormality at all.

    The single coarse row is replaced by two specific ones. Iris abnormality binds HP:0000525 Abnormality iris morphology, with coarse_binding_basis NO_HPO_TERM because HPO has no term for iris pitting, which is the basis that actually applies rather than the one recorded before. Ocular hypertension binds HP:0007906. Both carry the full-text sentence as a DIRECT SUPPORT item and the Family 2 sentence as a DIRECT REFUTE item, which is the better balancing evidence the review identified: it comes from the same study and the same examination, where the previously used PMID:24224009 coloboma sentence was INDIRECT and about a different family and a different finding. That coloboma item is dropped, since neither new row claims coloboma. Both rows are marked OCCASIONAL.

    Session narration removed from notes. Three passages described the curation session rather than the disease: the paragraph explaining that an earlier version of this entry gave the wrong reason for the unbound zebrafish gene, the paragraph on the OpenScientist timeouts and the fallback behaviour, and the sentence in the genetic notes about what check-gene-validity reports. All of it is in the history records. What remains is the subject matter: the two zebrafish paralogs with the NCBI Gene queries and accessions, the fact that the paper does not say which one its morpholinos target, and the CAUSATIVE call standing above a Moderate ClinGen tier with its reasons.

    Suggestions taken. A constitutive Abcb6 knockout mouse is added to animal_models, bound to MGI:1921354 and linked to Failure of Early Melanosome Maturation as PARTIALLY_RECAPITULATES with MODERATE fidelity and a PROXY_QUANTITY divergence, since its readout is melanosome number in retinal pigment epithelium rather than melanosome maturation in skin melanocytes. just check-gene-namespaces-online resolved and cached the accession. The p.Gly382Arg allele from a Saudi mother and son is added from PMID:35024399.

    The hearing material is recorded as a HUMAN_MODEL_MISMATCH discussion rather than a phenotype. PMID:39557842 shows a raised auditory brainstem response threshold in Abcb6 knockout mice and an inner-ear morphant phenotype that human ABCB6 mRNA partially rescues, so the model evidence is positive and gene-specific; the human side is that paper's framing sentence about dyschromatosis universalis hereditaria as a whole, a genetically heterogeneous concept, with no hearing result in an ABCB6-genotyped patient. Evidence exists in a model and translational validity is the open question, which is the distinction that separates HUMAN_MODEL_MISMATCH from KNOWLEDGE_GAP.

    Two suggested papers could not be used. PMID:25288164 and PMID:30430618 resolve to real records but serve no abstract or full text that can be fetched here, so there is no sentence to quote and their variants are not curated. Their empty cache files were deleted rather than committed. The notes now record this alongside ClinGen's count of nine missense variants across six publications, so the variant list reads as deliberately incomplete rather than overlooked.

    Validation: just validate passes with 40 of 40 snippets and 40 titles verified, up from 33; just check-gene-namespaces-online passes.

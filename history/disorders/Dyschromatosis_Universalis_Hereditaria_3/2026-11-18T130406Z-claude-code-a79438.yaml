  summary: 'Create: Dyschromatosis Universalis Hereditaria 3'
  details: |
    New entry for the ABCB6 subtype of dyschromatosis universalis hereditaria (MONDO:0014169), curated from PMID:23519333 (Zhang 2013, gene identification and the Golgi mislocalisation of disease alleles), PMID:24498303 (independent linkage and exome replication, the zebrafish knockdown, and the ocular examination of carriers), PMID:24224009 (further alleles plus the patient skin histology) and PMID:29940187 (ABCB6 in melanosomes, PMEL amyloid matrix, and a rescue experiment on the G579E DUH allele), with PMID:37634201 as the clinical review. The pathophysiology is a four-node chain whose middle is the specific finding that makes the disease legible: the maturation block falls unevenly across melanocytes, so hyperpigmented skin carries mature melanized melanosomes and hypopigmented skin carries empty immature ones, which is why the pattern is mottled rather than uniformly pale. Three judgement calls. The prevalence figure is for dyschromatosis universalis hereditaria as a whole rather than for this genetic subtype, so it is recorded with directness INDIRECT and an explicit note that it is an upper bound. The ocular phenotype is bound at the organ-system level with coarse_binding_basis SOURCE_UNSPECIFIED, because the source reports that ocular abnormalities were found in carriers without naming them, and narrowing to coloboma would assert more than it says. The zebrafish animal model carries no gene identifier: the report names its target only as the zebrafish ABCB6 homolog and an Alliance search for abcb6 returned nothing, so the field was left out rather than guessed, which just check-gene-namespaces had caught when a remembered ZFIN accession was written there first. Validation: just validate-disorders passed with 25 of 25 snippets and 25 titles verified; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-genereviews and check-gene-namespaces all pass. The OpenScientist report for this disease is queued in the second batch after the timeout failures described in dismech#10387, and will be reconciled against the entry before the pull request is opened.

  summary: 'Review round 3: correct p.Ser322Lys to p.Ser322Arg, bound the mouse model
    with its organism-level negative'
  details: |
    Addresses the one blocking item of the third review round on dismech#18383, plus both suggestions.

    The variant name was wrong, and the source that corrects it was already in this pull request. The allele was curated as p.Ser322Lys, which is the name PMID:24498303 gives it. PMID:39557842, cached in the previous round for the inner-ear discussion, states that the mutation was first reported mistakenly as S322K before correct identification as S322R by another group, and excluded the incorrectly identified S322K mutation from its own functional panel. The cDNA change settles it independently: c.964A>C changes the first base of codon 322 from AGC to CGC, serine to arginine, and no single A>C substitution at that position can give lysine. The discovering paper is not internally consistent on this allele either, its Figure 2C legend writing p.S322L.

    The variant is renamed p.Ser322Arg. The originally reported name is kept in its description together with the codon reasoning, so a reader meeting p.Ser322Lys in the literature can connect the two. The PMID:24498303 cosegregation snippet is left exactly as the source wrote it, since a snippet never corrects its source, and its explanation now says the protein change in that quote is the superseded name. Two evidence items are added from PMID:39557842: the correction sentence, graded OTHER because it is a bibliographic correction rather than a study result, and the functional result that S322R is one of three DUH mutations showing significantly reduced expression in a cell assay, graded IN_VITRO.

    The mouse model is now bounded by a sourced organism-level negative. The limitation previously said no mottled skin phenotype is reported for this mouse, which understated the gap. PMID:39557842 reports that complete knockout of Abcb6 in a pigmented C57BL/6 strain resulted in no detectable abnormalities in pigmentation, eye morphology, or balance. That sentence is added as a REFUTE item on the model link and the limitation rewritten: the subcellular melanosome deficit does not produce a visible pigmentary phenotype in a pigmented strain, so the mouse does not reproduce the human phenotype at the organism level at all. That is a stronger statement against the model's fidelity than the entry made before, and it is the honest one.

    One leftover sentence about the environment is reworded. The note explaining why two allele reports are unused said neither serves an abstract or full text that can be fetched here, which describes this container rather than the papers. It now says neither has an abstract indexed. The same note records that PMID:39557842 counts ten reported DUH missense mutations, including Y424H and T673A, beside ClinGen's count of nine across six publications, so the incompleteness of the variant list is stated with two independent counts.

    Validation: just validate passes with 43 of 43 snippets and 43 titles verified, up from 40.

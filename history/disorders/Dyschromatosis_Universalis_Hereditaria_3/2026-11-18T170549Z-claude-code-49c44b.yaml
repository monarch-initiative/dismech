  summary: 'Review round 1: ClinGen tier, three missing variants, ocular balance,
    zebrafish paralogs'
  details: |
    Addresses the first review round on dismech#18383 in a single push.

    ClinGen. The gene_disease_validity assertion is now recorded: ABCB6 / MONDO:0014169, Moderate, classified_by CLINGEN, external_id CGGV:assertion_93bbbc0a-5f6f-4d80-b560-3265d7b89ed3-2026-06-12T160000.000Z, with the gene-disease validity row quoted as evidence. The review quoted the 2024-04-26 SOP10 stamp from the committed cache/clingen export; the live export carries the same assertion UUID reapproved under SOP12 on 2026-06-12 at the same Moderate tier, so the current version stamp is used and the cache file was built from that export. The genetic notes no longer say the record was not retrieved in this session, and now state directly that relationship_type CAUSATIVE sits above a Moderate tier, which is why check-gene-validity reports this record as overstated.

    Zebrafish paralogs. The previous note said an Alliance search for abcb6 returned nothing. Re-running it shows that search was malformed: it returns a zero total for abcb6a as well, a gene that does exist, so the result was silence rather than a negative answer. NCBI Gene queries abcb6[Gene Name] AND Danio rerio[Organism] and abcb6*[Gene Name] AND Danio rerio[Organism] return abcb6a (NCBIGene:564067, ZFIN:ZDB-GENE-050517-9) and abcb6b (NCBIGene:100004801, ZFIN:ZDB-GENE-070912-584). No ZFIN accession is bound, but the reason has changed: PMID:24498303 names its target only as zABCB6 and puts the morpholino design in supplementary Figure S5 of Text S1, so the paper does not say which of the two paralogs it targets, and binding either would be a guess between two real genes. The queries are recorded verbatim in the entry notes.

    Variants. Added p.Ser322Lys (c.964A>C, cosegregating in a second family), p.Ser170Gly (c.508A>G, from a sporadic-patient screen with no cosegregation evidence) and c.459delC (the one frameshift allele, previously referred to in the genetic notes without being listed), each with its own quoted evidence. p.Ala453Val now carries the cosegregation evidence item it was missing.

    Ocular finding. A REFUTE item from PMID:24224009 records that none of the 21 affected members of a second family had ocular coloboma, graded INDIRECT because the sentence reports the absence of coloboma specifically rather than of the unspecified ocular abnormalities the supporting item describes. The phenotype description now says the finding is not constant.

    Treatments. No Established Treatment, which was bound to NCIT:C15747 Supportive Care and so implied that supportive care is given, is replaced by two records for what was actually tried: Narrowband UVB Phototherapy (NCIT:C15301) and Laser Therapy (NCIT:C15466), each describing the lack of convincing benefit and citing the same review sentence.

    Zebrafish limitation. The clause saying the model shows uniform loss of pigmentation is removed; the source reports a reduced number of mature melanocytes in the head region at 5 dpf and explicitly no morphological abnormalities, so the limitation now says the model does not reproduce the mottled pattern. The partial rescue by co-injected human ABCB6 mRNA is added to the model description.

    Differential. The DUH locus claim is now sourced rather than dropped: PMID:24498303 states that the DUH loci were mapped to 6q24.2-q25.2 and 12q21-q23 by linkage, quoted with the bracketed reference markers bridged.

    Mechanism note. The entry now records that the mechanism by which one heterozygous missense allele produces dominant disease is unsettled: PMID:24498303 proposes a dominant-negative effect from mislocalisation, while the ClinGen assertion records the mechanism as currently unknown. functional_impact_category stays LOSS_OF_FUNCTION on the narrower claim that the mislocalised transporter does not perform its activity, which the G579E rescue failure supports directly.

    Deep research. research/Dyschromatosis_Universalis_Hereditaria_3-deep-research-claude_code.md is added. OpenScientist failed on every attempt in this batch, first on client-side timeouts (dismech#10387) and then on a server-side stream idle timeout (dismech#18386), and --fallback does not engage on a runtime failure, so the provider was switched to claude_code by hand. just preflight-dr against MONDO:0014169 returns PASS with ABCB6 as the canonical MONDO gene and 188 mentions.

    CI. The failing check-gene-activity-grounding run is fixed by binding GO:0015439 ABC-type heme transporter activity with modifier LOSS_OF_FUNCTION on the lesion node, which is UniProt's IMP-supported molecular function for ABCB6.

    Validation: just validate passes with 33 of 33 snippets and 33 titles verified; just validate-terms passes; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-gene-namespaces, check-qualifier-terms, check-delivery-system, check-name-collisions and check-gene-validity all pass.

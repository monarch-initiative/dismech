  summary: 'Create: Methylmalonate Semialdehyde Dehydrogenase Deficiency (ALDH6A1,
    MONDO:0013579)'
  details: |
    New entry for WP-001 metabolic worklist row 1.2.17.01 (ALDH6A1-related methylmalonate semialdehyde dehydrogenase deficiency). Verified absent from kb/ before starting: no filename match, no use of MONDO:0013579 or ALDH6A1 anywhere in kb/, and no open or merged PR covering it.

    Identity anchors checked manually rather than by `just preflight-dr` (no DR report was used): MONDO:0013579 records RO:0004003 -> HGNC:7179 (ALDH6A1), xref OMIM:614105 and xref Orphanet:289307. The worklist row cites OMIM 603178, which is the ALDH6A1 *gene* MIM rather than the phenotype MIM; both point at the same entity, and that discrepancy is recorded in the entry notes.

    NEC hazard specific to this disorder: "3-hydroxyisobutyric aciduria" is a biochemical finding with at least three causes - ALDH6A1 deficiency, HIBADH deficiency (a separate WP-001 row, 1.2.25.01, still uncurated) and respiratory-chain defects. Literature retrieved under that phrase was checked paper-by-paper for which enzyme it concerns. PMID:34176136 and PMID:35174513 are HIBADH papers and are cited only in the differential_diagnoses section, never as evidence for this disorder's mechanism.

    Modelling decisions:
    - Six pathophysiology nodes. The organising claim is that MMSDH is the convergence point of two independent catabolic routes (valine -> (S)-methylmalonate semialdehyde; thymine -> (R)-enantiomer), each bound to its own CHEBI enantiomer term. That is what makes the disorder simultaneously an aminoacidopathy and a pyrimidine-catabolism defect, and it explains the mixed urine profile.
    - Only the enzyme node declares conforms_to (metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism). The module's toxic-metabolite/energy-deficit, acute-decompensation and encephalopathy nodes are deliberately NOT claimed: metabolite toxicity and acute decompensation are not evidenced for this disorder.
    - Every clinical finding sits on a PROVISIONAL or HYPOTHETICAL node with no causal edge from the biochemical chain, because ClinGen classifies the ALDH6A1 gene-disease relationship as Limited and states outright that whether the additional symptoms belong to the disorder is an open question. Two REFUTE-typed evidence items (a biallelic patient developing normally at four years; a molecularly confirmed patient with a normal brain MRI) are curated against the neurological phenotypes so they cannot be read as penetrant.
    - The single-patient fibroblast mitochondrial-dysfunction finding is kept as a PROVISIONAL node with no edge to the clinical arm, since nothing links the two.
    - No phenotype frequency: bands assigned - fewer than ten published patients, clinical ascertainment throughout.

    Evidence: 8 references (7 PMIDs fetched via `just fetch-reference`, plus the ClinGen CGGV assertion built with `just clingen-rebuild`). Two KNOWLEDGE_GAP discussions with proposed experiments cover clinical causality/ascertainment bias and the unexplained inter-patient metabolite variability.

    Validation: `just validate` passes (schema + terms + references); "Snippets checked: 67/67 verified against cached references". `just check-duplicate-keys`, `just check-term-cache-integrity`, `just check-reference-cache-frontmatter` and `just check-title-snippets` all OK.

  summary: 'Genetics pass: bind the three MONDO monilethrix classes as subtypes and
    wire the keratins'
  details: |
    Genetics pass for the d2g series-062 gap list (issue #12269).

    Anchor check first: MONDO:0008009 monilethrix has exactly three children, each
    defined by one type II hair keratin in its OWL axioms (monilethrix-1 KRT86,
    monilethrix-2 KRT81, monilethrix-3 KRT83), and is equivalent to no single gene
    itself. The entry models the whole disease, so the anchor is correct and every
    subtype row added here sits inside it. The re-nomination mechanism was unbound
    rows: the three causal keratins were already curated with evidence, but the
    entry had no has_subtypes list at all and no gene reached a pathophysiology
    node.

    Added three has_subtypes rows bound to MONDO:0700343, MONDO:0700341 and
    MONDO:0700342, each carrying its gene, autosomal dominant inheritance and
    evidence, with reciprocal genetic[].subtype foreign keys. Bound KRT86, KRT81,
    KRT83 and KRT31 as genes on the Dominant-Negative Hair Cortex Keratin Variant
    node, which took gene-to-mechanism wiring from 0/4 to 4/5. DSG4 is the
    deliberate exception and stays unwired, because this entry models the dominant
    keratin disease only.

    New research beyond the gap list: KRT31 was added as a causal gene from
    PMID:39026424, nine affected individuals across four unrelated families with a
    recurrent nonsense variant and cell-model validation. MONDO has no class for
    it; the searches are recorded in the entry notes. DSG4's only evidence item was
    a sentence about dominant transmission that did not support DSG4 at all, and
    its explanation asserted that the entry cited no direct DSG4 evidence. Added
    two items from PMID:25615553 (the background gene-disease sentence and the
    patient's own electron microscopy showing fewer desmosomes), recessive
    inheritance, and corrected the explanation. Recorded MONDO:0011932
    hypotrichosis 6 as a skos:relatedMatch, since MONDO files the DSG4 disease
    under hypotrichosis simplex with monilethrix-like hypotrichosis as a synonym
    rather than under monilethrix.

    Also wired the Beaded Fragile Hair phenotype, which no edge reached, from the
    shaft-narrowing node, taking phenotype causal inlink from 2/3 to 3/3.

    Validation: just validate 30 snippets and 33 titles clean; validate-terms
    clean; list-gene-term-mismatches 12/12 compared, no findings;
    check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-case-collisions,
    check-coarse-phenotypes all clean. LRV 0.3.0rc3.

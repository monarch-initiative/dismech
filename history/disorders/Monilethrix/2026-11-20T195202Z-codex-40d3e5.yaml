  summary: Map Monilethrix to OMIMPS:158000
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS158000 contains the three numbered KRT86-, KRT81-, and KRT83-related forms in the January 2026 OMIM snapshot, corresponding to the three children of MONDO:0008009. All three are curated as subtypes of this Disease. The entry also includes KRT31-associated monilethrix and discusses DSG4-associated recessive monilethrix, which MONDO places under hypotrichosis 6 rather than this series. NarrowMatch records the numbered series as a subset of the broader clinical and genetic scope curated here. Shared beaded, fragile hair supports the clinical umbrella, while keratin filament and desmosomal mechanisms remain distinct; the mapping does not claim the three-member series exhausts monilethrix or that recessive DSG4 disease is a dominant keratinopathy.

  summary: Add C. elegans animal models (dys-1) to Duchenne Muscular Dystrophy
  details: |
    The entry carried computational_models but no animal_models at all, so no in vivo model reached the pathograph. Added six C. elegans dystrophinopathy models with modeled_mechanisms links, genes bound to WormBase identifiers resolved at the Alliance (dys-1 WB:WBGene00001131, hlh-1 WB:WBGene00001948, egl-19 WB:WBGene00001187, drp-1 WB:WBGene00001093, stn-1 WB:WBGene00006062) and cached by just check-gene-namespaces-online.

    Models and what each is cited for:

    dys-1(cx18) null (PMID:9933302) - RECAPITULATES Dystrophin Deficiency on the strength of the human-dystrophin C-terminal chimera rescue, and FAILS_TO_RECAPITULATE Myofiber Necrosis. The negative link is the point of including the strain: the dystrophin null alone leaves muscle apparently normal, which is why every nematode degeneration assay runs in a sensitized background. Graded INCOMPLETE_PHENOTYPE rather than SPECIES_MISMATCH because the same allele degenerates once hlh-1 is compromised, so nothing about the organism forbids the phenotype.

    dys-1(cx18); hlh-1(cc561ts) (PMID:10996789, PMID:26358775, PMID:15145337) - the standard model. PARTIALLY_RECAPITULATES Progressive Muscle Degeneration and Myofiber Necrosis, RECAPITULATES Sarcolemmal Fragility with an EM readout, FAILS_TO_RECAPITULATE Chronic Muscle Inflammation. The inflammation link is SPECIES_MISMATCH/INVALIDATING and is load-bearing in the other direction too: prednisone cutting degeneration by 40% in an animal with no inflammation to suppress is the model's strongest mechanistic argument.

    egl-19 modifier worms (PMID:11696327) - PERTURBS Calcium Influx bidirectionally. CAUSE_UNREPRESENTED, since calcium enters through a channel allele rather than through a torn sarcolemma.

    dys-1(eg33) (PMID:30396907, PMID:33627403) - PARTIALLY_RECAPITULATES Mitochondrial Dysfunction with a NemaFlex force readout. Limitations record that baseline respiration is raised where the node asserts reduced ATP synthesis, and that permeability transition is not assayed, so the model shows mitochondrial damage without establishing this node's mechanism.

    Mitochondrial-fission knockdown and cyclosporine A (PMID:23804750) - PERTURBS Mitochondrial Dysfunction and RESCUES Progressive Muscle Degeneration. This is the only nematode model here that reaches the permeability-transition step the node actually names, through the cyclophilin D homologue CYN-1, where the eg33 strain stops at mitochondrial morphology; it also establishes the ordering, since fragmentation precedes any detectable degeneration and recurs in a zebrafish DMD model. Cyclosporine A also inhibits calcineurin, which the limitations record.

    DGC-component RNAi (PMID:12234669) - PARTIALLY_RECAPITULATES Dystrophin-Glycoprotein Complex Destabilization. BOUNDARY_OMISSION records that C. elegans has no sarcospan and only divergent alpha/beta-sarcoglycan relatives.

    Two genotype gaps are recorded in model notes rather than guessed. PMID:11696327 caches abstract-only and says 'dystrophin mutants' without naming alleles, so the egl-19 background is recorded as dys-1 loss-of-function rather than as the dys-1; hlh-1 combination. In the DGC study only stn-1 is bound; the dystroglycan and sarcoglycan homologues are identified by sequence relationship in the cached abstract with no settled symbol, and a WormBase lookup is the only acceptable source for an identifier.

    Target-node choices worth flagging for a later pass. No link targets Cardiac Myocyte Injury, Myocardial Fibrosis, Respiratory Muscle Weakness, Failed Satellite Cell Regeneration or Fibrofatty Muscle Replacement, because the organism has no heart, no respiratory muscle, no satellite cell compartment and no fibro-adipose replacement; those are absences of a target rather than failures of a model, so they are left unlinked rather than recorded as FAILS_TO_RECAPITULATE. Progressive Muscle Degeneration is PARTIALLY rather than RECAPITULATES for the same reason: that node's description names regeneration-exhaustion and fibro-fatty replacement explicitly.

    The scale audit reports all 18 links UNDETERMINED because no target node in this entry carries biological_scale. model_scale is set on every new link, so the comparison becomes available as soon as those nodes are tagged; tagging them was left out of this change as a separate decision.


  summary: Add complementary computational models for Duchenne muscular dystrophy
  details: |
    Added two mdx mouse muscle-regeneration agent-based models and a 2024 human nonlinear mixed-effects virtual-trial model. The agent-based entries preserve the acute-injury and species limitations, the emergent satellite-cell and microenvironment result, and the experimentally falsified first fibrosis prediction that was reconciled by separating matrix area from protein density. The human model links individual covariates, six-minute walk distance, and muscle MRI-T2 trajectories while explicitly identifying it as a statistical virtual-patient model rather than a mechanistic personal twin. A three-iteration OpenScientist exploration independently supported the transport-constrained interpretation and found no validated human DMD tissue digital twin. A related 2024 murine CompuCell3D successor archive was checksum-verified; execution could not proceed because its pinned conda-only runtime is unavailable in this environment. All evidence snippets and model exports were validated.

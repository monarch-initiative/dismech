  summary: Drop generic mismatched supplementary evidence on Cardiac Myocyte Injury
  details: |
    Removed the second evidence item (PMID:23620650) from the Cardiac Myocyte Injury pathophysiology node. That paper is a real, correctly-cited fibrosis review, but its quoted sentence ('Mortality in DMD patients is often due to respiratory or cardiac problems') only establishes cardiac involvement generally, not the DGC-destabilization/membrane-injury mechanism the node asserts. The node's primary evidence item (PMID:15117830, MODEL_ORGANISM) already carries that mechanistic claim and was left untouched. PMID:23620650 remains correctly used elsewhere in the file (Myocardial Fibrosis node) where it does support the fibrosis claim. Surfaced by issue #6972 (claim-evidence audit of muscular disorders); validated with linkml-validate and just validate-references.

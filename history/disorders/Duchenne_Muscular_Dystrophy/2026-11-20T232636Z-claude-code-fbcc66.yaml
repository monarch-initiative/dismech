  summary: Tag every pathophysiology node with biological_scale and type two scale
    extrapolations
  details: |
    Follow-up to the calcium-clearance commit, which noted that only 5 of 21 pathophysiology nodes carried biological_scale, so just model-scale-audit reported all but one model link UNDETERMINED and could not see this entry at all.

    All 16 untagged nodes now carry the slot: 10 MOLECULAR, 6 CELLULAR, 5 TISSUE across the 21 total. No node is ORGANISM.

    Five assignments were not judgement calls and were copied from the module this entry conforms to, kb/modules/sarcolemmal_fragility_myofiber_necrosis.yaml, which already tags its own nodes: DGC Destabilization MOLECULAR, Sarcolemmal Fragility CELLULAR, Calcium Influx CELLULAR, Myofiber Necrosis CELLULAR, Fibrofatty Muscle Replacement TISSUE. Three more were taken by analogy to module nodes with no conformance link here: Mitochondrial Dysfunction CELLULAR (the module's Mitochondrial Permeability Transition), Failed Satellite Cell Regeneration CELLULAR (Exhausted Satellite-Cell Regeneration), Chronic Muscle Inflammation TISSUE (Necrosis-Driven Muscle Inflammation). Taking the conformance target's value rather than re-deriving it is deliberate: a conforming node that disagreed with its module on scale would be a contradiction nothing currently gates.

    Calcium Influx is the assignment most likely to be second-guessed. The enum lists ion transport under MOLECULAR, which argues for that value, but the node's substrate is the cell's cytosolic calcium state and its conformance target is Myofiber Cytosolic Calcium Overload, which the module tags CELLULAR. The module wins. TRPC/SOCE-mediated Calcium Entry is MOLECULAR by contrast, and the difference is intended rather than an inconsistency: that node is about the channel complexes and their transport activity, where Calcium Influx is about the resulting cellular state.

    CNS Dystrophin Isoform Deficiency is tagged MOLECULAR with a review_notes paragraph recording that the node bundles two claims. Its name and description are about the absent distal brain-expressed isoform, which is molecular, while its annotations are GO:0050890 cognition, an organism-scale process, and cell type neuron. Single-value scale tagging is meant to surface exactly this, and the remedy is to split the node rather than to change the value, which needs the isoform-to-phenotype evidence re-read as a separate pass.

    With the targets tagged, the audit went from 1 scale-determined link of 19 to 12: 8 ALIGNED, 3 MODEL_BELOW_TARGET, 1 MODEL_ABOVE_TARGET. The remaining 7 UNDETERMINED are the three pre-existing computational models' links, which carry no model_scale; they are untouched here.

    It also surfaced 3 upward-extrapolating links, all 1 step, CELLULAR model to TISSUE node. Two now carry a typed SCALE_EXTRAPOLATION divergence: both nematode links to Progressive Muscle Degeneration, where the measured quantity is degenerating-cell counts and the node is tissue-level muscle loss. The third, the dys-1; hlh-1 FAILS_TO_RECAPITULATE link to Chronic Muscle Inflammation, was deliberately left untyped and is still reported by the audit. Its operative caveat is that C. elegans has no cellular immune system, already recorded as SPECIES_MISMATCH with materiality INVALIDATING; adding a scale divergence there would imply the gap is one of observational resolution when the organism simply lacks the process.

    A CURIE error made and corrected in this session, recorded because the repository's own guidance says this failure gives no internal signal. The review_notes paragraph above was first written citing GO:0007610 for cognition, from memory, while describing a bundling problem. GO:0007610 is behavior; cognition is GO:0050890, which was already bound on the node being described and could have been read off it. Caught by looking it up before commit rather than by any gate, since prose in review_notes is not checked by anything.

    Validation: just validate-disorders passed (174 snippets, 0 skipped, 0 unavailable, 179 titles, 0 issues). model-scale-audit --strict exits 0; pytest -k 'scale or divergence' passes 5 tests, including check_scale_extrapolation_divergence_agrees_with_scales. check-enum-values, check-duplicate-keys, check-causal-targets, check-entity-refs, check-logical-rules and check-block-scalar-comments all clean.

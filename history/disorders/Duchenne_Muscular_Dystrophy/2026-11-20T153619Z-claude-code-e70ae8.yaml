  summary: Add calcium-clearance hypothesis group and its ECM/SERCA chain to Duchenne
    Muscular Dystrophy
  details: |
    The entry held one mechanistic hypothesis group (canonical_dystrophin_loss_membrane_fragility_model) and explained its elevated cytosolic calcium entirely by entry, through Calcium Influx and TRPC/SOCE-mediated Calcium Entry. A literature survey of the DMD calcium field surfaced a published position that disagrees on that step, and it had no representation here.

    Added mechanistic_hypotheses group calcium_clearance_failure_model, status ALTERNATIVE: the elevated calcium is a removal defect rather than an entry defect, with loss of ECM-to-sarcolemma integrity upstream of sarcoplasmic reticulum pump function. ALTERNATIVE rather than EMERGING because the position rests on two published studies and converges with the independent mammalian SERCA2a-overexpression literature, and rather than CANONICAL because the entry-side mouse genetics are not displaced by it.

    Two new pathophysiology nodes carry the group, so it is reachable in the pathograph rather than inert:

    Fibrillin-Related ECM Protein Downregulation (MOLECULAR) - FBN1 hgnc:3603 and FBN2 hgnc:3604 both DECREASED, GO:0030198 extracellular matrix organization DECREASED. Evidence is the nematode 57% mua-3 reduction (MODEL_ORGANISM) beside the human myoblast FBN1/FBN2 downregulation (IN_VITRO), which is what makes the node a claim about human disease rather than nematode biology.

    Impaired Sarcoplasmic Reticulum Calcium Reuptake (MOLECULAR) - GO:1990036 calcium ion import into sarcoplasmic reticulum DECREASED. No SERCA gene is bound, recorded in notes: the sources attribute the defect to SERCA activity as a function without naming a paralog, ATP2A1 and ATP2A2 differ by fiber type, and the nematode has a single ortholog with no fiber-type counterpart, so binding one would assert a specificity the sources do not support.

    Edges: Dystrophin Deficiency -> the fibrillin node, and the fibrillin node -> the reuptake node, both INDIRECT_UNKNOWN_INTERMEDIATES because the route from dystrophin loss to reduced fibrillin transcription is not established; the source's own candidate regulator (nematode ztf-7, human ZNF277) trends at p=0.098, and the source itself raises the possibility that chronic calcium elevation downregulates fibrillin by feedback, which would reverse the node's direction. That alternative is recorded in the node notes. The reuptake node -> Myofiber Necrosis is INDIRECT_KNOWN_INTERMEDIATES with calcium-dependent protease activation named as the omitted intermediate, so the two hypothesis groups converge on the same death step rather than forking to separate outcomes.

    The dys-1(eg33) model gained a RECAPITULATES link to the reuptake node with a phase-resolved GCaMP2 readout. This closes a gap left open in the previous commit on this entry, where calcium evidence was withheld from that model because PMID:30755520's abstract never names its allele. The gap is closed from the other side rather than by inference: PMID:40979067 states its own dystrophic strain (AVG6, dys-1(eg33) plus a muscle GCaMP2 transgene) in its strain table, quoted as the link's first evidence item with an ellipsis bridging the stripped square-bracket transgene span. No claim is made about PMID:30755520's allele, which is still unstated; that reference is cited only at node and hypothesis level, where allele identity is not load-bearing.

    Note the target chosen. An earlier plan was to attach this study to Calcium Influx, which would have been wrong: the paper argues against the entry route, so a RECAPITULATES link to an entry node would have inverted its conclusion. The clearance node is the correct target and did not exist until this change.

    quote_role is used to keep three distinct provenance situations apart in one reference. The clearance claim itself is BACKGROUND, because the sentence restates the group's earlier study rather than reporting a result of the citing paper. The mua-3 and FBN1/FBN2 measurements are PRIMARY_RESULT. The ECM-to-pump mechanism sentence is graded OTHER/PRIMARY_RESULT as a proposal the paper advances rather than a measurement, and is labelled as such in its explanation.

    Deliberately not curated. The sarcomere-remodeling result from the same laboratory exists only as a preprint (PMID:39257798); the published version (PMID:41431865, Biol Open 2026) carries no dys-1 data, and the preprint itself states that the deformation prevented quantification, so there is no citable claim. The mammalian SERCA2a and entry-side interventional literature named in the hypothesis notes is likewise not yet curated and is flagged there as such.

    Side effect worth noting: setting biological_scale on the two new nodes gives this entry its first scale-determined model link. just model-scale-audit now reports 1 MODEL_ABOVE_TARGET of 19 links, where previously all were UNDETERMINED, because no pathophysiology node in the file carried the slot. MODEL_ABOVE_TARGET is the unremarkable direction, a cellular model observing a molecular node.


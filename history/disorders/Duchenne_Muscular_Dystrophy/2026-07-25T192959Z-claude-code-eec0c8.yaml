  summary: 'Review: DMD claim-evidence audit; gene-therapy safety balance'
  details: |
    Claim-evidence audit as part of a 10-disorder muscular-disease review.
    Fixes: (1) The Delandistrogene Moxeparvovec (Elevidys) treatment carried efficacy evidence only - a 2026 meta-analysis - with no safety counterweight, despite reported AAV-capsid-mediated hepatotoxicity including liver failure and death. Added the immune-mediated toxicity profile to the description and two PARTIAL evidence items (PMID:41047627 real-world toxicity cohort; PMID:41854298 fatal hepatotoxicity / sirolimus series). (2) Five DOI-only evidence references converted to PMIDs so the reference validator checks them; all snippets verified verbatim first.
    Noted but not changed: pathophysiology[14] (Cardiac Myocyte Injury) carries a weak supplementary snippet ('Mortality in DMD patients is often due to respiratory or cardiac problems') that does not speak to cardiomyocyte DGC destabilization; the primary MODEL_ORGANISM evidence on that node does.
    Validated: linkml-validate, linkml-term-validator, linkml-reference-validator, pytest tests/test_data.py (subset).

  summary: 'Review round 1: GeneReviews mining gaps, evidence_source re-grading, idebenone
    counter-evidence'
  details: |
    Review round 1 on PR #11618 returned CHANGES REQUESTED on three GeneReviews mining gaps. The reviewer's rule: every section present in the PMID:20301426 abstract needs backing evidence items. Clinical Characteristics was mined; Diagnosis, Management-surveillance, Agents-to-Avoid and Genetic-Counselling-transmission were not. All three blocking findings and all four suggestions were taken, in one push, because main has dismiss_stale_reviews and a second push costs a full re-review cycle. Every GeneReviews sentence used was extracted programmatically from references_cache/PMID_20301426.md rather than retyped, so the hard-wrapped line breaks inside each quote are the cache file's own.

    Finding 1 (blocking). Added a diagnosis: block with two Diagnosis records. OPA1 Molecular Genetic Testing carries the GR DIAGNOSIS sentence and a second item from PMID:20417570 documenting the large-scale-rearrangement screen that coding-sequence-only testing misses; bound to NCIT:C15709 Genetic Testing with the reason for the broad binding in notes. Optical Coherence Tomography of the Retinal Ganglion Cell Complex carries PMID:30649972 on the RGCC as an in vivo biomarker plus the GR surveillance sentence; bound to NCIT:C20828. Both CURIEs were read from ols:ncit and checked against cache/enums/treatmentactionterm_b7dcb86faf99.csv for enum membership before binding. The report's sequencing-to-MLPA-to-panel detail was used only where it could be quoted from a primary source.

    Finding 2a (blocking). The surveillance clause in Low-Vision Rehabilitation and Visual Aids was an uncited claim. Added the GR Surveillance sentence as its own evidence item on that treatment, so the annual visual-acuity, visual-field, OCT and hearing schedule the description asserts is now backed.

    Finding 2b (blocking). Added an Avoidance of Mitochondrial Toxins treatment quoting the GR agents/circumstances-to-avoid sentence, bound to NCIT:C15747 Supportive Care with the binding reason in notes. The reviewer's distinction is adopted and stated in the entry: advising avoidance is a management action, whereas an environmental block would assert a causal edge, and the retirement caveat is much weaker for the former. The environmental block is still declined because no source quantifying an exposure effect in OPA1-related optic atrophy was located. Rewrote omission (3) in entry notes, which previously said the content was left out entirely and was therefore stale prose describing repository state; it now says what was curated, where, and what was withheld.

    Finding 3 (blocking). The 50% recurrence risk stated in Genetic Counseling was uncited. Added the GR 50%-chance sentence to the inheritance block rather than to the treatment, because it is a property of transmission rather than of the counselling act, and added the affected-parent/de-novo sentence alongside it with an explanation of why no de_novo_rate is recorded (the source gives no figure).

    Suggestion 1 (taken). Re-graded 7 background-prose evidence items from HUMAN_CLINICAL to OTHER: six from PMID:35652445 and one from PMID:38334784. Each paper's own results keep the grade matching its design, so PMID:35652445 now appears under OTHER 6 times and IN_VITRO 5 times, and PMID:38334784 under OTHER once and MODEL_ORGANISM twice. Rewrote the former per-item policy note as a statement of the new rule, which is that evidence_source classifies the evidence the cited publication presents and an introduction restating consensus presents none. This also makes the entry internally consistent with the review citations PMID:11850115 and PMID:21112411, which were already OTHER. Re-ran check-snippet-grading afterwards because evidence_source is one of the two values it keys on: no new divergences.

    Suggestion 2 (taken). Fetched PMID:26820596 and read it; it supports the reviewer's description. Added two REFUTE items with evidence_source MODEL_ORGANISM to the idebenone treatment, quoting the largely-ineffective conclusion and the 80.35% hepatic oxidative-damage increase, plus a treatment-level note setting the observational human cohort against the randomized mouse trial and stating that the entry does not claim idebenone works.

    Suggestion 3 (taken). Added a fourth discussions entry, developmental_versus_degenerative_rgc_loss, kind KNOWLEDGE_GAP, attaching to the two degeneration nodes and to clinical_trials#NCT06970106. Cited to PMID:42101483, which states the developmental component and draws the therapeutic-window consequence. Tagged KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH, with the reason in the discussion's notes: the open question is the timing of the deficit in the human disease, and no model result is in conflict with a human observation because the relevant human observation has not been made.

    Suggestion 4 (taken). Added ACO2-related dominant optic atrophy to differential_diagnoses, cited to PMID:41954904 for ACO2 being one of the most frequent causes of DOA, with a caveat that the source is a 2026 retrospective series from 13 referral centres and that the relative frequency of ACO2 and OPA1 is not settled.

    Counts after this round: 90 evidence items (85 SUPPORT, 5 REFUTE) against 77 (74/3) before; 2 diagnosis records, 4 treatments, 4 discussions, 4 differential diagnoses; 28 distinct references cited, 3 newly added (PMID:26820596, PMID:41954904, PMID:42101483).

    Validators run and their results. just validate PASSED, 90/90 snippets verified. just validate-terms PASSED. just check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK. just check-qualifier-terms-online run because NCIT terms were added: resolved 0 uncached CURIEs, OK. just normalize-cache and just check-term-cache-integrity OK, 18 term and 24 enum cache files matching the contract, and no new cache rows were needed because both NCIT CURIEs were already cached. just validate-disorders PASSED, all three batched lanes, 90/90. Whole-KB text checks: check-folded-hyphens OK, check-snippet-length OK, check-snippet-grading OK (specifically re-run for this round's re-grading), check-title-snippets OK. No baseline file was modified in this round or the previous one. check-environmental-evidence remains not applicable because the decision not to add an environmental block was deliberately retained.

    One YAML trap worth recording for a future editor: the first attempt at the re-grading wrote explanations of the form 'Evidence source is OTHER: the sentence is...', and a colon-space inside a plain YAML scalar broke the parse. The explanations were rewritten in the entry's existing 'OTHER because' form. Nothing was committed in the broken state.

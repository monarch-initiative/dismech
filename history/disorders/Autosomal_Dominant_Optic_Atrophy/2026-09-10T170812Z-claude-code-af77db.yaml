  summary: 'Create: Autosomal Dominant Optic Atrophy'
  details: |
    Created kb/disorders/Autosomal_Dominant_Optic_Atrophy.yaml for the classic non-syndromic form (MONDO:0008134, OPA1 hgnc:8140), the queue stub stubs/Autosomal_Dominant_Optic_Atrophy_Classic_Form.yaml having been deleted in the same change.

    Lump/split. Curated as a Disease entry separate from the existing Autosomal_Dominant_Optic_Atrophy_Plus (MONDO:0014720) rather than as a has_subtypes entry on it. The working hypothesis in claim issue #11601 was that the two differ on the genotype axis, and it was checked against primary sources rather than assumed: PMID:11440989 reports the classic-form spectrum as predominantly null alleles implying haploinsufficiency; PMID:27860320 quantifies that at 76 percent of pathogenic alleles; PMID:16617242 concludes in favour of haploinsufficiency in OPA1-positive cases; PMID:20157015 quantifies the skew the other way for the syndromic form (missense OR 3.06, GTPase-region OR 2.29). The hypothesis held. The non-sharpness of the boundary is recorded in entry notes and differential_diagnoses, and sensorineural hearing loss is deliberately left on the DOA-plus entry.

    Mechanism. OPA1's separable functions are curated as four distinct pathophysiology nodes with their own evidence rather than one bundled node -- inner-membrane fusion (PMID:12509422, PMID:16839885), cristae disorganization (same pair, citing the explicit genetic/molecular separability statement), mtDNA maintenance via the exon 4b isoform and nucleoid tethering (PMID:20974897, PMID:35652445), and cytochrome c sequestration at cristae junctions (PMID:16839885, PMID:12509422). They converge on an Oxidative Phosphorylation Deficiency node which conforms_to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress. biological_scale is set on every node.

    Retinal ganglion cell selectivity is curated as mechanism across two nodes -- the unmyelinated prelaminar axon's energy cost (PMID:39659974 mouse, PMID:11850115) and small-calibre papillomacular fibre loss (PMID:11850115, PMID:32243103, PMID:35652445) -- and the residual uncertainty is recorded as a KNOWLEDGE_GAP discussion rather than hand-waved, citing PMID:35652445 that the specific sensitivity of RGCs remains unclear and PMID:21112411 that the trigger is much more complex than a simple bioenergetic crisis. Two further KNOWLEDGE_GAP discussions cover reduced penetrance modifiers and the untested OMA1/YME1L stress-processing switch.

    Counter-evidence is curated rather than smoothed: the OXPHOS node carries two REFUTE items from PMID:18783614 (electron transport unaltered in isolated patient mitochondria) alongside the supporting items, with a node-level note stating the disagreement and the positional reconciliation adopted; and the Progressive visual loss phenotype carries a REFUTE item from the PMID:40329928 meta-analysis whose pooled visual-acuity decline is not significantly different from zero.

    Deep research. One report, requested from falcon. Falcon returned HTTP 402 (account out of credits); the run was repeated once with --fallback per the run brief and resolved to openscientist, so the committed report is research/Autosomal_Dominant_Optic_Atrophy-deep-research-openscientist.md with fell_back true, requested_provider falcon and the 402 recorded in its frontmatter. just preflight-dr PASSED against MONDO:0008134 (OPA1 mentioned 105 times, OMIM 165500 agreeing). just validate-research-terms was run in place and flagged two report mis-bindings (GO:0000002 obsolete; HP:0007766 Optic disc hypoplasia used for OCT RNFL thinning) -- neither was bound in the entry, which uses HP:0020119 for that phenotype. Report claims were treated as leads: six were verified against primary sources and adopted (PMID:18783614, 24616225, 21112411, 16617242, 22800932, 40329928); the report's mtDNA haplogroup J penetrance-modifier claim was checked, found to describe OPA1-NEGATIVE patients, and downgraded to a caveat in the penetrance gap's notes rather than curated as a modifier.

    Terms. Every CURIE was read from a lookup in the same step it was written -- ols:mondo, ols:go, ols:cl, ols:hp, ols:uberon, ols:ncit, ols:chebi, and cache/hgnc/terms.csv for hgnc:8140 confirming OPA1. HP:0000552 Tritanomaly was deliberately NOT bound for the acquired blue-yellow defect because HPO defines it as S-photopigment dysfunction, a cone-level claim; HP:0007641 Dyschromatopsia is bound with the tritan pattern carried in preferred_term, and the reasoning is in the phenotype description.

    Validators run and their results. just validate PASSED (77/77 snippets verified). just validate-terms PASSED. just count-verified-snippets 77/77. just check-duplicate-keys OK. just check-entity-refs OK. just check-causal-targets OK (no new dangling targets). just check-qualifier-terms OK (no qualifier terms added, so check-qualifier-terms-online was not needed). just check-enum-values OK. just normalize-cache and just check-term-cache-integrity OK (18 term + 24 enum cache files match the contract). just validate-disorders PASSED, all three batched lanes. Whole-KB text checks: check-folded-hyphens initially reported one new finding in this file (a line-end hyphen in a folded scalar) and check-snippet-length one (a four-word snippet); both were fixed by rephrasing and by quoting the full sentence, and no baseline file was modified. check-environmental-evidence is not applicable -- no environmental block was added.

    Deliberate omissions, all recorded in the entry notes: no biochemical block (the plasma nicotinamide deficiency is sourced only to a trial registration's rationale, not a measurement report); no datasets block (no accession was relevance-triaged); no environmental block (the only exposure guidance found is in a retired GeneReviews chapter); no histopathology block; and PYC-001 is curated as a clinical trial only, with no therapeutic_modality, because its registration gives route and dose but not drug class. PMID:20301426 is cited for clinical description only and its retirement is flagged in entry notes.

  summary: Review OPA1 optic atrophy using full-text evidence and update clinical/model
    scope
  details: |
    Substantive review of the full OPA1 classic optic-atrophy entry and its OpenScientist report/citation artifact, retaining MONDO:0008134 and distinguishing DOA-plus and biallelic Behr-like disease. This inherited disorder is in scope for the review queue excluding infectious and environmental diseases/poisonings.

    Full-text use: read relevant methods, results, figures/tables and limitations in cached PMID:35652445 (patient/isogenic iPSC-RGCs), PMID:20157015 (refetched full text, pure versus plus muscle biopsies), PMID:39659974 (prelaminar ultrastructure), PMID:18783614 (lymphoblast respiration), PMID:40329928 (natural-history synthesis), PMID:41944540 (2026 OCT follow-up), PMID:32561926 (neonatal RGC culture), PMID:40202868 (zebrafish/fly models), PMID:32243103 (retrospective idebenone), PMID:39264859 (STK-002) and PMID:24616225 (protease-dependent processing). Also examined relevant full-text cochlear methods/results/discussion in PMID:38334784 and the archival GeneReviews chapter's clinical, diagnostic, management and counseling sections. Generated caches through repository fetchers only. Refreshes of several older abstracts did not recover full text; claims relying on these, including PMID:38130806 and PMID:26820596, remain limited to available content. The full-text GeneReviews URL and its PMID are identified as the same publication.

    Major corrections: multiple mtDNA deletions occur in both isolated and plus disease, and neither muscle nor the studied iPSC-RGCs showed generalized copy-number depletion. The iPSC qPCR signal can reflect minor deletions or amplicon mutations; large rearrangements were absent and the knockout signal was nonsignificant. Maximal respiration was not significantly reduced in the classic patient line. Separate HeLa apoptotic perturbations, patient fibroblast counterevidence, normal isolated lymphoblast respiration and prelaminar morphology from demonstrated patient RGC death or regional ATP/transport measurements. Remove unsupported oxidative-stress binding and causal convergence; preserve provisional links where mediation is unresolved. Correct family-specific penetrance, the 440 molecularly solved-case denominator, and the OPA1-negative haplogroup-J finding. A pooled estimate whose interval includes zero does not refute progression.

    Completeness checklist: phenotypes adequate for classic ocular scope, with all nine connected; syndromic extraocular findings are explicitly outside this entry's phenotype set. Subtypes/differentials adequate: no invented mechanistic partition by variant class; add biallelic Behr differential. Mechanisms adequate after assay-specific qualification. Treatments/trials gaps addressed with prospective uncontrolled idebenone data, experimental STK-002 splice modulation and updated registry designs/statuses; no human efficacy inferred from fibroblast or wild-type animal rescue. Genetics adequate with bounded penetrance/ascertainment and one connected causal gene. Diagnostics/biomarkers adequate with 2026 longitudinal OCT and VUS interpretation; mixed classic/plus cohort and surrogate limitations explicit. References/titles checked; all four GeneReviews clinical domains mined, preserving retired/historical status. Overall research themes consumed critically: secondary-allele findings belong in the differential, while proposed modifiers and OMA1 interventions remain unresolved. No blocking central omission identified.

    Added model fidelity limits: mice lack the human macula/papillomacular bundle; neonatal cultures and homozygous/mosaic zebrafish or broad neuronal fly knockout differ from human heterozygous disease. Verified PRIDE PXD059584 and PXD059645 against the primary paper and fetched PRIDE metadata, without accessing the frozen shared dataset cache. Updated five NCT records/designs and retained the stale Australian ICTRP registration with UNKNOWN current status. PYC protocol descriptions are not efficacy claims. Validation: schema, ontology terms and 125/125 cached quotations pass; causal/entity references, all phenotype/gene connectivity, dataset accessions, delivery-system, coarse bindings and knowledge-gap checks pass. Remaining text-ratchet checks recorded in the PR review.

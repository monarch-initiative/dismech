  summary: 'Gene-family review: OPA1'
  details: |
    The OPA1 haploinsufficiency node carried the gene with no activity; added GTPase-dependent fusogenic activity (GO:0140523), DECREASED, supported by in vitro reconstitution showing OPA1 alone drives inner-membrane docking and hemifusion (PMID:31922487). Bound the OPA1 record's inheritance block, which named autosomal dominant without a term, to HP:0000006. ClinGen's OPA1 Definitive assertion is filed against the gene-centred MONDO:0800181, which lumps this entry with its syndromic and recessive relatives, and remains uncopied.

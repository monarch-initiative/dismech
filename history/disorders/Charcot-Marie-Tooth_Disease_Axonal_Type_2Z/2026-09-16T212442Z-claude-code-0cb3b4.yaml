  details: |
    Created kb/disorders/Charcot-Marie-Tooth_Disease_Axonal_Type_2Z.yaml (MONDO:0014736, MORC2) as a per-type entry alongside the existing Charcot-Marie-Tooth_Disease_Axonal_Type_2C, 2JJ, 2P, 2S, 2T and 2B2. Deep research: Perplexity sonar-deep-research (350s). just preflight-dr PASS (MORC2 mentioned 223 times). The report's term validation reported needs_review true with 21 of 71 checked labels mismatched; no CURIE was taken from it, and every term was resolved against the committed caches or OLS. Two mechanistic accounts are curated as separate nodes and deliberately not merged: HUSH-complex silencing hyperactivation (2017, 2020) and PARP1-dependent DNA repair failure (2026). genetic_context and the pathway modifier both use GAIN_OF_FUNCTION, because both functional papers report hyperactivation of silencing rather than loss. The founding paper PMID:26497905 is listed in references: but quoted nowhere: its cached record holds title, authors and affiliations with no abstract body, so there is no exact substring to quote, and the claims it would support are sourced from later papers. p.Arg252Trp and p.Arg190Trp are each curated as the commonest allele with their populations attached rather than one being chosen. Validated: just validate (38/38 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-snippet-grading, check-enum-values.

  summary: 'Review round 1: add pyramidal signs with its population split, the Morc2a
    mouse, and a prevalence anchor'
  details: |
    Addresses the REQUEST_CHANGES review of a6a7f8b6d (run 35173408922). Three IMPORTANT findings, all correct.

    Finding 1, pyramidal signs. The feature that distinguishes CMT2Z from most other axonal CMTs was absent from the entry, and the founding paper PMID:26659848 is titled for it and was cached in this PR without being cited. Added, and the curation is richer than the finding asked for: the same cohort paper PMID:33844363 that restates the pyramidal phenotype for the commonest allele also reports that none of its own Spanish patients had extensor plantar responses or spasticity. So the phenotype carries a REFUTE item beside its support. That is a genuine contradicted part, unlike the misapplied SUPPORT plus REFUTE pair corrected on the sibling COQ2 PR this session, and it is the clinical counterpart of the population-dependence this entry already records for the two hotspot alleles. Bound to HP:0002493 Upper motor neuron dysfunction; HP:0003487 Babinski sign would have named only the one sign reported and not the broader claim the literature makes.

    Finding 2, the animal model. Added an animal_models section for the Morc2a S87L heterozygous knock-in with two modeled_mechanisms links. RECAPITULATES against Axonal Degeneration. PARTIALLY_RECAPITULATES with fidelity LOW against Central Nervous System Involvement, because the mouse's central signs are cerebellar ataxia and motor neuron degeneration while the human central phenotype in CMT2Z is cognitive impairment, and the Spanish series reports no cerebellar findings at all. Treating the two as the same central involvement would assert a correspondence the clinical literature contradicts, so the limitations slot says so.

    The review's optional item about the protein-dosage tension is taken, and it is in the cache rather than only in the research report: Morc2a mRNA and protein are consistently decreased in the mutant mouse, which cuts against the gain-of-function reading this entry adopts. Recorded as evidence on the model rather than on the mechanism node, because it is a measurement in this mouse and has not been shown in human tissue.

    Finding 3, uncited cached references. PMID:26659848 and PMID:42656289 are now cited. PMID:42656289 also supplies a worldwide case count, fewer than 100 reported cases, which anchors the ULTRA_RARE band on a published figure instead of on the absence of one; added as a CASES_IN_LITERATURE prevalence record with quote_role BACKGROUND.

    Declined, with the reason now in notes. The AAV gene-therapy rescue and the DNA methylation episignature are described only in the deep-research report and appear in no cached reference. Curating either would mean taking content from a report whose own term validation flagged 21 of 71 labels as naming a different concept, which is the one thing this entry has consistently refused to do. The mouse itself is curated because its phenotype sentence is cached; the AAV arm of the same work is not.

    Also noted by the review and not a finding: the GeneReviews chapter is tagged but unmined because its cached record is a purpose statement with nothing propositional to quote. Same shape as the COQ2 entry.

    Validation: just validate passed with 45/45 snippets verified, up from 38/38. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-genereviews (TAGGED), check-snippet-length, check-title-snippets and check-snippet-grading all OK.

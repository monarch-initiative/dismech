  summary: 'Pre-review pass: connect the CNS node, correct a frequency band, fix the
    GeneReviews false positive'
  details: |
    No review has landed on this PR yet. This is a self-audit against the three systematic defects the reviewer found on the sibling PRs from the same curation batch (#11983, #11985, #11986), applied to this entry before its own review runs. All three were present here.

    Orphan pathophysiology node. Central Nervous System Involvement had an outbound edge to Intellectual disability but no inbound edge, so nothing in the pathograph pointed at it. check-causal-targets cannot see this: it asks whether a declared target resolves, and an absent edge is not a broken one. The rendering consequence is that a node with no inbound edge lands at the leftmost layer as an initiating step, which asserts a separate primary lesion. It is now a downstream target of Neuronal Transcriptional Dysregulation with INDIRECT_UNKNOWN_INTERMEDIATES, because MORC2 is a broadly expressed chromatin regulator and the central phenotype follows the same transcriptional dysregulation as the peripheral one. The intermediates are unknown for exactly the reason they are unknown on the axonal branch: no mis-silenced transcript has been identified in any tissue, which is this entry's main knowledge gap.

    Frequency without a denominator. Distal amyotrophy was VERY_FREQUENT, which means 80 to 99 percent, with no published fraction in any located source and no definitional status. It is now FREQUENT. Distal muscle weakness stays VERY_FREQUENT, and its description now says why: the band rests on the feature being definitional rather than on a fraction, since distal weakness is how a patient is ascertained as having an axonal CMT at all, so every reported patient has it by construction. The contrast between the two is stated so a reader can see the bands were reasoned rather than assigned.

    check-genereviews false positive. The retired Charcot-Marie-Tooth Neuropathy Type 2 chapter's PMID sat in notes inside the sentence explaining that the chapter is not cited, and the checker matches chapter identifiers anywhere in the file, so it reported CITED_UNTAGGED against a chapter the entry says it does not cite. The chapter is now named by title alone and the check reports TAGGED. notes records why the identifier is absent so nobody restores it. This is the third instance of the same checker blind spot in this batch.

    One defect I introduced and caught before pushing: the first attempt at the CNS edge used a greedy regex that appended the edge after datasets at the end of the file, breaking YAML parsing. Caught by the parser on the next check run and fixed by inserting against an exact anchor instead.

    Validation: just validate passed with 38/38 snippets verified, unchanged since no evidence was added. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-genereviews (TAGGED), check-snippet-length, check-title-snippets and check-snippet-grading all OK.

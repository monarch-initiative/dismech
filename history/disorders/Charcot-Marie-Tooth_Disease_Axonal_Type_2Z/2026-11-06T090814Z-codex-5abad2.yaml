  summary: Review CMT2Z clinical evidence, variant-specific mechanisms and experimental
    models
  details: |
    Reviewed the existing entry and matching Perplexity report against cached primary sources, including the founder-family full text, A406V case series, Jacquier functional study, Tao variant study, HUSH and structural ATPase papers, and the MORC2 methylation study. Reconciled R190W/R252W isoform numbering; separated sporadic cases from confirmed de novo inheritance; corrected frequency, onset and pyramidal-sign claims; added documented sensory, hearing, retinal and respiratory findings. Replaced blanket gain-of-function and unsupported HUSH-to-PARP1 causality with variant- and model-specific mechanisms; incorporated promoter methylation, named transcriptional targets, oxidative injury and primary mouse AAV rescue. Added molecular/electrophysiological diagnosis, qualified research assays, full GeneReviews supportive-care and counseling evidence, and verified GSE95480. Cross-checked all eight research-completeness dimensions: central clinical, genetic, mechanistic, diagnostic and reference gaps addressed; severe allelic developmental phenotypes remain comparisons rather than CMT2Z subtypes; no source-supported human interventional trial was identified. Abstract-only sources are limited to their retrieved results; unavailable full text is not reconstructed.

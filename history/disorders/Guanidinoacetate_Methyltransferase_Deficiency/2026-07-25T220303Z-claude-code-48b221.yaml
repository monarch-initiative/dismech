  details: |
    Addresses the code review on PR #7001. Both blocking items were correct.

    An uncited claim survived the cleanup, restated as prose (item 2 - the more
    interesting failure). The Symptom onset phase asserted "Symptoms typically
    become noticeable during the second year of life". That is the same claim
    this PR had just DROPPED as unverifiable (mean approximately 14 months,
    traceable only to unretrievable full-text pages), re-expressed in words that
    no longer look like a number. The attached PMID:37465909 snippet does not
    support it. This is a subtle form of the error the PR was written to fix:
    removing an unsupported figure while keeping the claim it encoded.

    Replaced with the quotable distribution the reviewer identified from
    PMID:39006040, already cited elsewhere in this entry: 50% of cases presented
    as infants, 28% as toddlers, 15% as children, 79% symptomatic before age
    five. The phase's weakest sentence is now its best-sourced one, and the
    distribution is more informative than a single mean anyway.

    population carried a measure-type caveat (item 1). The screening record's
    population read "Newborn screening programs (screen-positive rate, not
    disease prevalence)". CLAUDE.md scopes population to cohort and geography
    only; it is a stratifier consumed by rendering and queries, not a place for
    caveats. Changed to "Newborn screening programs (tandem mass spectrometry)".
    The caveat was already fully stated in the record's notes, so nothing is
    lost.

    Suggestions implemented:
    - Curation meta-commentary moved from notes to review_notes on both affected
      phenotypes (the seizure band-correction arithmetic and the hypotonia
      qualitative-evidence caveat). notes is rendered content; review_notes is
      the right home and is used in 163 places across the KB. Pathophysiology has
      no review_notes slot, so the module-conformance rationale stays in notes
      there.
    - Narrowed the GAMT node's molecular_functions from GO:0008168
      methyltransferase activity to GO:0030731 guanidinoacetate
      N-methyltransferase activity, which is exactly the enzyme. Pre-existing and
      out of scope strictly, but a one-token improvement.
    - Mined the two remaining quotable frequency figures from PMID:39006040. The
      84% developmental-delay figure is now curated evidence rather than a number
      appearing only in prose. The 43% intellectual-disability figure was the
      more interesting one: it is well below the VERY_FREQUENT band the entry
      records. Added as PARTIAL evidence with a review_notes explaining that the
      discordance is largely definitional - the landmark cohort counts the
      combined DD/ID domain (44 of 48, 92%), the scoping review counts formally
      diagnosed intellectual disability affecting learning (43%) - rather than a
      genuine disagreement, so the band is retained but the conflict is now
      visible rather than hidden.

    measure_type: UNKNOWN raised as an issue rather than patched (suggestion 3).
    The reviewer is right that UNKNOWN is documented as "not stated or cannot be
    determined" whereas the screen-positive rate is precisely determined and
    simply has no enum value - so the tag misdescribes the epistemic situation
    rather than merely being imprecise. Filed as issue #7003 proposing
    SCREEN_POSITIVE_RATE, with a note that a sibling SCREEN_DETECTED_INCIDENCE
    may also be needed since several entries quote figures of that third shape.
    Left as UNKNOWN in the meantime, since inventing an enum value in a review PR
    would be worse.

    Validation. Schema, term and reference validation all pass.

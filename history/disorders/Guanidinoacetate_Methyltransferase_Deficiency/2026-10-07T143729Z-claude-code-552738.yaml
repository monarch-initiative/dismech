  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    The entry had no diagnosis section; added one with a Newborn screening for elevated guanidinoacetate row carrying diagnosis_term NCIT:C81178 Newborn Screening and two LOINC measurements: LOINC:93488-5 Guanidinoacetate [Moles/volume] in DBS and LOINC:104194-6 Creatine [Moles/volume] in DBS, the two analytes the Utah and New York State programmes quantify on the spot (PMID:34389248). No operating programme's numeric guanidinoacetate cut-off could be cited: the Utah and New York State report gives mean levels only, and the British Columbia pilot and the New York method revision give no threshold in their abstracts, none with open full text. The one reference range therefore records the Utah feasibility study's proposed second-tier trigger (PMID:24276113, guanidinoacetate above 2.44 umol/L, the 99.5th centile of 10,000 deidentified spots) with population naming it as a proposal, not a programme cut-off; the source's strict greater-than versus the half-open band is disclosed in the range notes. Creatine carries no band because no cited source states a creatine rule; the guanidinoacetate-to-creatinine ratio DBS code exists in LOINC but no source reports a ratio rule, so it is not bound. Bound the LOINC Parts LP30825-1 Guanidinoacetate and LP15509-0 Creatine as loinc_term on the two biochemical markers, which describe several specimens; the brain-MRS creatine marker and the creatinine marker were left without codes. Cache rows were written by just loinc-seed-cache. Validated with just validate, validate-terms, count-verified-snippets (161/161 across both batch files), validate-disorders, check-duplicate-keys, check-entity-refs, check-snippet-grading and the LOINC schema test. Reported, not changed: the entry's newborn screen is also modelled as a treatments row bound to NCIT:C15419 Disease Screening.

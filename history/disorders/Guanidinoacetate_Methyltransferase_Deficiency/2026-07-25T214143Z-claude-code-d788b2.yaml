  summary: 'Review: cite uncited prevalence, separate screen-positive rate from prevalence,
    correct seizure band'
  details: |
    Review of the eighth-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Uncited prevalence with a screening-yield conflation (the principal
    finding). The prevalence section was a single record with no population, no
    measure_type, no prevalence_class and no evidence, carrying four
    quantitative claims. Two are verifiable and are now cited from PMID:37465909
    (the birth-prevalence estimate of 0.5 to 2 per million, and the screen-positive
    rate of about 1 per 100,000). Two are not: the Australian 1-in-1.4-million,
    Utah 1-in-321,305 and New York 1-in-759,246 programmatic figures come from
    pages 3-4 of the Pediatrics evidence review, which is abstract-only in the
    cache; fetching by DOI also returned abstract-only. They are removed rather
    than left uncited.

    More importantly the record conflated two different quantities. The
    screen-positive rate (1 per 100,000) is roughly an order of magnitude above
    the birth prevalence (0.5-2 per million) because it counts false positives -
    which is precisely why the source cites "the low number of positive results"
    as an argument for screening feasibility. They are now separate records, with
    the screening one explicitly labelled a yield rather than a prevalence and
    given measure_type UNKNOWN rather than a prevalence measure it does not have.

    Frequency band error corrected. Seizures carried VERY_FREQUENT (80-99%), but
    both curated quantitative sources put it below that threshold: 35 of 48 (73%)
    in the landmark cohort and 68% in the scoping review. Both fall in FREQUENT
    (30-79%), and no source in the entry supports 80% or above. Corrected, with a
    note recording the arithmetic so the change is auditable. Muscular hypotonia's
    FREQUENT band was left in place but now carries a note stating that it rests
    on qualitative evidence only - the source lists hypotonia first among
    untreated features, which implies prominence but is not a frequency.

    Progression rebuilt from a single unnamed unevidenced phase into four
    evidenced phases. The prose carried specific numbers (symptoms at a mean of
    14 months, diagnosis at a mean of 8.5 years) that trace to the same
    unretrievable full-text pages and are dropped; what replaces them is better
    sourced and more useful. In particular the treated-outcome phase now carries
    the monotonic relationship between age at treatment initiation and eventual
    severity - median 25.5 months for mild, 39 months for moderate, 11 years for
    severe developmental delay - alongside the four patients treated before nine
    months who had normal or almost normal outcomes. That relationship is the
    entire argument for newborn screening and was previously a single sentence.

    The asymptomatic neonatal phase now states why the disorder is a
    screening candidate rather than a clinically-detected one: placental creatine
    transfer masks the defect at birth, so the window in which treatment works
    best is the window in which nothing is visible.

    Module conformance deliberately NOT asserted, with the reasoning recorded on
    the GAMT node. Two modules look superficially applicable and neither fits.
    metabolic_intoxication_decompensation requires catabolic-stress-precipitated
    acute decompensation with acidosis, hyperammonemia or hypoglycemia; GAMT
    deficiency has no crisis phenotype at all. epilepsy_excitation_inhibition_imbalance
    is a closer call - seizures affect most patients and guanidinoacetate is
    thought to act on inhibitory neurotransmission - but the entry's own sources
    hedge that mechanism ("may alter inhibitory neurotransmission"), and epilepsy
    here is one manifestation of cerebral creatine deficiency rather than the
    disease's defining axis. Recording the negative decision explicitly, because
    an unexplained absence invites a future curator to "fix" it. This follows
    directly from the D-2-Hydroxyglutaric_Aciduria review in this same sweep,
    where conformance to the intoxication module was asserted on exactly that
    kind of superficial resemblance and had to be withdrawn.

    Validation. Schema, term and reference validation all pass.

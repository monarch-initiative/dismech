  summary: Remove duplicated evidence introduced by frequency mining, including a
    supports-value contradiction
  details: |
    Addresses the re-review on PR #7001, which confirmed the two blocking items
    fixed and found a new problem introduced by the optional frequency-mining
    work.

    Duplicated evidence, one duplicate self-contradictory. Acting on a review
    suggestion to mine two frequency figures from PMID:39006040, I added both -
    without checking whether they were already curated. They were, on main. Each
    snippet now appeared twice:
    - Global developmental delay carried the 84% snippet twice: a plain
      duplicate.
    - Intellectual disability carried the 43% snippet twice with CONFLICTING
      supports values - my new item as PARTIAL and the pre-existing one as
      SUPPORT. The entry therefore asserted both that the same figure fully
      supports and only partially supports the same claim, which destroys the
      PARTIAL item's entire purpose: it exists to make the band discordance
      legible, and a SUPPORT duplicate of the same sentence contradicts it.

    Both duplicates removed. For the intellectual-disability pair the PARTIAL
    item is kept because its explanation carries the reasoning and the
    review_notes references it; the pre-existing SUPPORT item is dropped.

    The reviewer noted their own suggestion 6 was wrong, but the error is mine:
    the suggestion was to mine the figures, and checking whether they were
    already present was my job before adding them. Worth recording that no
    validator catches this - validate-references verifies the same snippet twice
    without complaint, and the schema permits duplicate evidence items - so
    duplicate-and-contradict is a class of error only review can catch.

    Unverifiable figure removed (suggestion 10). The Global developmental delay
    description cited "100% in a 2023 review" with nothing behind it. The 2023
    review in question (PMID:36856349) is cached but contains no such figure in
    its abstract. Pre-existing, but exactly the failure mode this PR targets, so
    removed rather than left. The description now states only the two figures
    that are curated as evidence directly below it, and says so.

    Validation. Schema, term and reference validation all pass.

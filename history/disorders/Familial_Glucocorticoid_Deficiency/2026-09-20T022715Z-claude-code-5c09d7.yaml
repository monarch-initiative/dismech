  summary: 'Genetics pass: subtype and node gene bindings, MCM4 ClinGen disposition'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12196, epic #12189).

    Research first: no GeneReviews chapter exists for familial glucocorticoid
    deficiency in the committed Bookshelf index (cache/bookshelf/genereviews.csv,
    snapshot 2026-09-10); the nearest adrenal chapters there are 21-Hydroxylase-
    Deficient Congenital Adrenal Hyperplasia and NR0B1-Related Adrenal Hypoplasia
    Congenita, neither of which covers this disease. ClinGen has no gene-disease
    validity row for MC2R, MRAP, STAR, NNT or TXNRD2 in the table committed here.

    Wiring. All five has_subtypes rows (FGD1-FGD5) now carry a genes list. Four
    pathophysiology nodes gained gene bindings, each at the step the gene acts at
    rather than as a flat list: MC2R and MRAP on "ACTH Receptor Complex Signaling
    Failure", STAR on "STAR-Mediated Cholesterol Transport Deficiency", NNT and
    TXNRD2 on "Adrenocortical Mitochondrial Antioxidant Defense Failure", and MCM4
    on "Adrenocortical Replicative Stress and Impaired Steroidogenic Cell
    Differentiation". The convergence nodes downstream of these (cortisol
    biosynthesis, zona glomerulosa sparing, ACTH feedback) were deliberately left
    without genes. All six genetic records gained relationship_type CAUSATIVE and
    variant_origin GERMLINE.

    MCM4. The entry already dispositioned MCM4 as belonging to a distinct disease
    (NKGCD, MONDO:0012383) rather than to the numbered FGD series. That decision is
    now backed by a citable source: ClinGen's SCID-CID Gene Curation Expert Panel
    curates MCM4 against MONDO:0012383 at Moderate, not against any FGD term. The
    ClinGen assertion cache was generated with just clingen-rebuild and is
    committed.

    Review round 1. The reviewer flagged that the MCM4 record carries
    relationship_type CAUSATIVE beside a quoted ClinGen row reading Moderate. The
    value is right but the record did not say why, so a note was added: CAUSATIVE
    records that biallelic MCM4 loss of function is the mendelian cause of the
    disorder whose adrenal arm is modeled here, which is the only MCM4
    gene-disease relationship reported; the Moderate classification is ClinGen's,
    against MONDO:0012383, a disease term this entry does not curate. Same basis
    as the CIDEC and PLAAT3 records in the lipodystrophy entry.

    MONDO reconciliation: all three MONDO-recorded genes (MC2R hgnc:6930, MRAP
    hgnc:1304, NNT hgnc:7863) were already curated and are now bound at the subtype
    carrying each MONDO term. No disagreement with MONDO on this entry.

    Validation: just validate, validate-terms, count-verified-snippets (77/77),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches, and the batched just validate-disorders.

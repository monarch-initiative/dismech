  summary: 'Create: Familial Glucocorticoid Deficiency'
  details: |
    Created new root disorder entry for familial glucocorticoid deficiency (MONDO:0008733) resolving issue #9549. Modeled two mechanistically distinct routes to isolated ACTH-resistant cortisol deficiency with preserved mineralocorticoid production: (1) ACTH receptor signaling failure (MC2R/FGD1, MRAP/FGD2, and partial-function STAR/FGD3) and (2) adrenocortical mitochondrial antioxidant defense failure (NNT/FGD4, TXNRD2/FGD5), converging on a shared 'Impaired Adrenocortical Cortisol Biosynthesis' pathophysiology node. Curated the preserved zona glomerulosa/mineralocorticoid axis as a distinct pathophysiology node plus Plasma Renin Activity and Serum Aldosterone biochemical readouts linked to it, since preserved renin/aldosterone is the key discriminator versus combined-deficiency primary adrenal insufficiency. Triple A (Allgrove) syndrome, chronic primary adrenal insufficiency, and classic STAR-null lipoid congenital adrenal hyperplasia were curated as differential_diagnoses rather than subtypes, per issue scope. All PMIDs (8094489, 15654338, 22634753, 24601690, 19773404, 23279877, 30817990, 11012566, 19558534) were identified via targeted PubMed literature search (esearch/esummary) and fetched with just fetch-reference; no GeneReviews chapter exists specifically for FGD (searched PubMed for familial glucocorticoid deficiency GeneReviews, no hits). A falcon (Edison) deep-research run was launched via just research-disorder falcon for independent verification and is still in progress at the time of this record; MONDO subtype series (glucocorticoid deficiency 1-5, MONDO:0024536/0011826/0012214/0013874/0040502) confirmed via OAK against src/dismech/schema. Validation: just validate (schema/terms/references all pass, 57/57 snippets verified), just count-verified-snippets (57/57), just validate-terms (pass), just check-duplicate-keys (pass), just compliance (97.8% global / 98.5% weighted).

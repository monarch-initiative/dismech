  summary: 'Address CHANGES_REQUESTED review on PR #9559 (issue #9549)'
  details: |
    Addressed the reviewer's six IMPORTANT findings on PR #9559 (content-completeness, not correctness). (1) Added MCM4 as a third, replicative/genomic-stress genetic route: a genetic: entry (PMID:22354170, newly fetched) plus a new pathophysiology node 'Adrenocortical Replicative Stress and Impaired Steroidogenic Cell Differentiation' converging on the shared 'Impaired Adrenocortical Cortisol Biosynthesis' endpoint; documented in notes/description why the full NKGCD phenotype (MONDO:0012383, OMIM:609981) is not curated as a has_subtypes entry (MONDO models it as a distinct immunodeficiency disease, not a numbered FGD1-5 subtype); removed the orphaned CL:0002092 (bone marrow cell) cache rows that were added but never referenced. (2) Connected the pathograph to phenotypes: added downstream edges from 'Impaired Adrenocortical Cortisol Biosynthesis' to Decreased circulating cortisol level, Hypoglycemia, Failure to thrive, and Recurrent or severe infections, and from 'Loss of Cortisol-Mediated Negative Feedback and Compensatory ACTH Hypersecretion' to Hyperpigmentation and Increased circulating ACTH level -- all using evidence already verified elsewhere in the file. (3) Added target_mechanisms on Hydrocortisone Replacement Therapy (RESTORES on the cortisol-biosynthesis node; INHIBITS on the ACTH-hypersecretion node, evidenced by the tall-stature reversal PMID:11012566). (4) Added animal_models (Nnt-loss mouse, RECAPITULATES Adrenocortical Oxidative Stress and Apoptosis with an apoptosis readout) and experimental_models (NNT-knockdown and TXNRD2-deficient human adrenocortical cell lines, each RECAPITULATES Adrenocortical Mitochondrial Antioxidant Defense Failure with redox readouts), all reusing already cache-verified snippets. (5) Re-launched the falcon deep-research run (just research-disorder falcon Familial_Glucocorticoid_Deficiency) to completion this time (research/Familial_Glucocorticoid_Deficiency-deep-research-falcon.md; reference_validation: 7/7 resolved, 0 confabulation, 0 off-topic) and ran just preflight-dr against MONDO:0008733 (SKIP verdict -- MONDO records no single causal gene for this genetically heterogeneous umbrella term, so the automated gene-identity check cannot discriminate). The report independently corroborates finding 1: it explicitly describes MCM4 as a syndromic phenocopy distinct from classic isolated FGD, matching the curated notes. It also surfaces partial CYP11A1 defects as an additional reported cause of FGD-like disease not yet curated here; flagged as a follow-up rather than added, since it needs its own PMID sourcing and mechanism verification. (6) Renamed the differential_diagnoses entry 'Chronic Primary Adrenal Insufficiency (combined glucocorticoid and mineralocorticoid deficiency)' to 'Autoimmune Addison Disease and Other Combined-Deficiency Causes of Chronic Primary Adrenal Insufficiency' (bound disease_term to MONDO:0100480, autoimmune primary adrenal insufficiency) so it no longer collides with the same-named parent class; kept the parent declaration since a sibling KB entry (Chronic_Primary_Adrenal_Insufficiency.yaml) already lists FGD as one of its genetic-cause subtypes. Also corrected the PR body's inaccurate reference_title paragraph (all 57 original + 19 new evidence items already carry reference_title matching cache frontmatter). Validation observed and passing: just validate, just count-verified-snippets (76/76), just validate-terms, just check-duplicate-keys, scripts/check_snippet_length.py --against-ref origin/main, scripts/check_folded_hyphens.py, and just validate-disorders (batched pre-PR sweep).

  summary: Enriched Immunodeficiency 89 and autoimmunity with Harrison's classifications, CARD10 scaffold molecular function grounding, mucosal and airway epithelial bindings, multi-modality diagnosis, and treatments.
  details: Added IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE, and GASTROINTESTINAL Harrison's chapter classifications backed by PMID:32238915. Grounded CARD10 Loss of Function and Impaired CBM Complex NF-kappaB Signaling with protein complex scaffold activity (GO:0140378), signaling adaptor activity (GO:0035591), and CBM complex (GO:0032449), and enriched downstream nodes with intestinal and lung epithelial cell types, biological processes, and anatomical locations. Added diagnosis (CARD10 sequencing, high-resolution chest CT, gastrointestinal biopsy, and flow cytometry) and treatments (avoidance of occupational dust exposure and supportive care).

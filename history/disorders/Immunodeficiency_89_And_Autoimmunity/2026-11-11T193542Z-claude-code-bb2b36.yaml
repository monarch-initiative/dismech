  details: |
    Addressed the round-1 review of PR #17076. Removed the dust-avoidance/lifestyle treatment: the cited sentence compares two homozygous siblings and recommends nothing, and the existing environmental record for metal dust already carries that single-family observation with the correct hedge. Removed the supportive-care target_mechanisms edge onto the monocyte/dendritic-cell depletion node, restated the treatment description to say no management has been reported for IMD89, and marked its quote quote_role BACKGROUND (it is the paper's introductory statement citing earlier work). Removed GO:0030851 granulocyte differentiation from the monocyte/dendritic-cell node, since the node's observations are mononuclear phagocytes and the granulopoiesis data come from cell-line and murine silencing. Removed the diagnostic flags this PR had added to all six phenotypes, because the entity rests on one family. Added to the flow-cytometry row that the reduction was measured against a sibling with the same genotype. Trimmed the trailing figure-panel label from the HRCT snippet.

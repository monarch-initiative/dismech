  summary: 'Create: Immunodeficiency 89 and Autoimmunity (CARD10)'
  details: |
    Created the entry for IMD89. The stub carried no genes block because MONDO records no causal gene for MONDO:0030484, so the gene had to be established first. My initial working draft inferred IKZF2 (Helios) from a plausible-looking 2021 immunodeficiency paper; that was wrong. MedGen for the MONDO term's OMIM xref (OMIM:619632) describes an autosomal recessive disorder with adult onset of recurrent infections, allergies, microcytic anemia and Crohn disease attributed to Yang et al. 2020, and the MedGen record names CARD10. The falcon deep-research run that had already been launched against the IKZF2 draft was killed before it wrote a report, the entry was rewritten around CARD10, and the research run was relaunched; the committed report mentions CARD10 59 times and IKZF2 zero times. This is a Named Entity Confusion near-miss that the term and reference validators would not have caught, because every identifier involved was real. Primary source is Yang et al. 2020 (PMID:32238915), a short communication on one consanguineous family. No GeneReviews chapter exists for this entity. The gene-disease relationship is recorded as relationship_type DISPUTED rather than CAUSATIVE, and a KNOWLEDGE_GAP discussion records that the entity rests on a single family and that the authors call the variant the possible cause; an OPEN_QUESTION discussion records the marked intrafamilial severity difference and the authors' environmental-modifier explanation, which is also curated as an environmental entry with its own evidence. Two evidence items are marked directness INDIRECT: the Crohn disease expression association, which comes from unrelated patients rather than this family, and the mouse eosinophil dissociation. Validated with just validate (20/20 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-environmental-evidence.

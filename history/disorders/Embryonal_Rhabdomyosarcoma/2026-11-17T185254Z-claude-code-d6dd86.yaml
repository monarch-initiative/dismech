  summary: 'Edit: Embryonal Rhabdomyosarcoma — add ectomesenchymoma as a differential,
    and repair an unverifiable quote'
  details: |
    Adds a second differential_diagnoses row, for ectomesenchymoma, to an entry this project did not create but has twice extended: the Neuroblastoma differential row it builds on came from #15867, and #17454 deepened the entry two days ago. The row is written as a question about a component rather than about a separate disease, because the 2026 WHO classification removed ectomesenchymoma as a separate entity and recognises it as a subtype of embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation. MONDO keeps it as its own class and this knowledge base curates it separately, so the row says that and points at the other entry rather than settling the disagreement.

    Its four distinguishing features are each sourced. The neuroectodermal component spans the range of neural crest differentiation, which a 17-case series breaks down as neuroblastoma in 12, ganglioneuroma or ganglion cells in 2, composite ganglioneuroblastoma in 1 and Schwann cell differentiation in 2. The mesenchymal component does not separate the two, being embryonal rhabdomyosarcoma in 16 of those 17. Demography does not separate them either, since a seven-patient genomic series reports the male predominance, age under two and pelvic or urogenital site that embryonal rhabdomyosarcoma already has. And PHOX2B, which the entry's existing neuroblastoma row uses to favour neuroblastoma over rhabdomyosarcoma, was focally positive in only 2 of the 17, so a negative stain does not exclude the neuroblastic component here.

    Four of the five quotes are sentences the Ectomesenchymoma entry also quotes, and each keeps the grading it carries there. The fifth, the demographic-overlap sentence from the seven-patient series, is quoted here for the first time and graded on its own reading: it is the authors summarising their own series in the discussion, so SUPPORT, DIRECT, PRIMARY_RESULT, HUMAN_CLINICAL. None of the three references was cited by this entry before, but all three cache files were committed with the Ectomesenchymoma entry, so no cache file is added.

    The change also repairs one pre-existing quote the row exposed. A top-level references finding quoted a structured abstract whose cached text is welded, and the quote began mid-word at Examine inside ObjectiveExamine, so it could never verify: a match has to start on a whole word. The same finding's own evidence item carried the correct start, so the quote is aligned to it. The defect was present before this change and is repaired here because the file cannot validate while it stands.

    Validated with the repository's nineteen-gate set over the changed entry, reference validation included. All passed.

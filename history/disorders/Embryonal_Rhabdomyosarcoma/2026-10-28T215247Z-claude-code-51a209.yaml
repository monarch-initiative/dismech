  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Creates the differential_diagnoses section, directly after treatments: (the entry has no diagnosis section), with a Neuroblastoma row. Both are small round blue cell tumours that can present as a soft tissue mass in a young child; a single-centre imaging series compared the two (Sheng 2024, PMID:38406807). Four distinguishing features, including PHOX2B immunohistochemistry (PMID:25822764, PMID:28640941) and myogenin/MyoD1 (PMID:7495304). Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

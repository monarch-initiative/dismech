  summary: Add DICER1 and NF1 germline predisposition records (review round)
  details: |
    Review round on PR #12326 (genetics pass, issue #12195). Two germline predisposition genes
    added and one citation tagged; no round-one content revised.

    DICER1 (hgnc:17098) and NF1 (hgnc:7765) were named only inside a quoted snippet in this entry
    - the standard predisposition list "germline mutations in PTCH1, HRAS, NF1, DICER1, and TP53"
    - and never bound. That is the named-but-invisible pattern this campaign measures, and round
    one had already added a germline TP53 record from the same tier, so leaving the other two
    unbound was inconsistent. Both are now curated as RISK_FACTOR with their own primary
    evidence: DICER1 from the study reporting germline variants in all four children with
    familial pleuropulmonary blastoma plus ERMS and somatic variants in 2 of 52 sporadic tumours,
    graded GERMLINE_AND_SOMATIC because both allele states appear there; NF1 from the Intergroup
    Rhabdomyosarcoma Study IV report of 5 of 1,025 enrolled children having NF1.

    The NF1 note is explicit that 5 of 1,025 is an observed co-occurrence within a treatment
    cohort and not a relative risk, because the study reports no general-population comparison.

    PTCH1 appears in the same quoted list and is deliberately not curated. The searches run are
    named in the NF1 record's note along with what they returned - a case report and a mouse
    model of Gorlin syndrome rather than a human series - so the absence is a recorded search
    result rather than an unexamined gap.

    Also tagged the already-cited StatPearls chapter PMID:29939543 in the `references:` block,
    which `just check-genereviews` had reported as CITED_UNTAGGED.

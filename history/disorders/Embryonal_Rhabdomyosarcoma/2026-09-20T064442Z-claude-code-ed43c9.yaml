  summary: 'Genetics pass: curate the somatic driver genes; disposition SLC67A1 as
    DISPUTED'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006). This is the one entry in the tranche with a
    genuine curation gap rather than an export artefact, and the one where the checklist gene was
    investigated and rejected.

    Research first: the cancer-granularity and cancer-cell-of-origin sections of CLAUDE.md were
    read before any edit, then the rhabdomyosarcoma genomics literature - the 147 tumour/normal
    pair comprehensive sequencing study, the RAS/RAF-mutant ERMS clinicopathologic series, the
    MYOD1 p.Leu122Arg discovery, the FGFR4 activating-mutation report, and the germline TP53
    anaplastic-RMS series - before the reconciliation checklist was opened.

    Checklist reconciliation. MONDO asserts `MONDO:0009993 RO:0004004 HGNC:10964`, printing the
    gene as SLC67A1; RO:0004004 is "has material basis in somatic mutation in". That gene was
    absent from this entry, and this entry's `disease_term` is MONDO:0009993 itself, so unlike
    the rest of the tranche the gap was real rather than an export-layer mismatch.

    It is recorded as DISPUTED after investigation. The assertion traces to a single point
    mutation in a single rhabdomyosarcoma cell line, TE125-T, reported in 1998 in a paper whose
    subject was the transcriptional map of a 170 kb interval at 11p15.5 and whose own conclusion
    was "BWR1A may play a role in tumorigenesis". There is no patient series, no recurrence and
    no functional work in rhabdomyosarcoma. The gene also lies inside the 11p15.5 imprinted
    interval whose loss of heterozygosity is the hallmark somatic event of ERMS, so an alteration
    found there is a candidate passenger of a regional lesion this entry already models; and it
    does not appear among the recurrently altered genes named by the 147-pair sequencing study.
    Nomenclature: HGNC has renamed SLC22A18 to SLC67A1, so `preferred_term` carries the current
    symbol while `term.label` carries SLC22A18, which is what the OBO build this repository
    validates against still holds.

    What else changed. The genetics of this entry was previously three prose records with no
    `gene_term` at all. It is now:
    - NRAS (hgnc:7989), KRAS (hgnc:6407) and HRAS (hgnc:5173) as separate SOMATIC_DRIVER records
      with per-isoform evidence from the MSK series, and a class-level `case_fractions` entry on
      NRAS.
    - FGFR4 (hgnc:3691) as a SOMATIC_DRIVER record with the RTK/RAS/PI3K axis evidence and the
      primary FGFR4 activating-mutation report.
    - MYOD1 (hgnc:7611) as a SOMATIC_DRIVER record keyed to the Spindle Cell subtype, with the
      neomorphic p.Leu122Arg mechanism and a `case_fractions` entry.
    - PIK3CA (hgnc:8975) as COOPERATING, on the evidence that in the defining series every
      PIK3CA-mutant tumour genotyped for both was also MYOD1-mutant.
    - IGF2 (hgnc:5466) as a SOMATIC_DRIVER record whose note is explicit that the lesion is
      dosage and imprinting rather than a coding variant.
    - TP53 (hgnc:11998) as a germline RISK_FACTOR keyed to the Anaplastic subtype, replacing an
      evidence-free prose record. Graded RISK_FACTOR and not CAUSATIVE because a germline TP53
      variant predisposes to a spectrum and is neither necessary nor sufficient for this tumour;
      the predisposition syndrome stays in Li-Fraumeni_Syndrome per the cancer-granularity rule.
    - `genes:` lists on the Spindle Cell (MYOD1) and Anaplastic (TP53) `has_subtypes` rows.
    - `genes:` bindings on the IGF2 Overexpression and RAS Pathway Activation nodes.
    - `genetic_context` with `variant_origin: SOMATIC` on the Loss of Heterozygosity at 11p15
      node. `just check-cancer-origin` now derives a single cell of origin for this entry -
      CL:0000515 skeletal muscle myoblast - where it previously derived none.

    Prose figures corrected. `just prose-figure-audit` flagged three unsourced percentages, all
    pre-existing. The 11p15 loss-of-heterozygosity frequency ("approximately 80% of cases",
    stated twice) appears in no cited source and could not be sourced, so the number was removed
    and replaced with a statement of what the sources do establish, plus a sentence saying why no
    frequency is quoted; a second reference was added establishing 11p15.5 uniparental disomy as
    the classical hallmark. The FGFR4 frequency ("7-10% of cases") was replaced with the sourced
    7 of 94 (7.5%) from the primary report, with its rhabdomyosarcoma-wide denominator stated.
    The entry now passes the audit with no findings.

  summary: Settle the RMSE2 stub as a subtype and deepen Embryonal Rhabdomyosarcoma
  details: >-
    Settles the stub Rhabdomyosarcoma_Embryonal_2 (MONDO:0859046) as a SUBTYPE and deepens the entry
    from one already-cached genomic series. The stub is deleted in this PR.


    The stub decision. MONDO:0859046 is OMIM's rhabdomyosarcoma, embryonal, 2, which the
    genetics-gap scan nominated because MONDO records DICER1 as its causal gene. It is not a
    separate disease: what it names is embryonal rhabdomyosarcoma arising in a germline DICER1
    carrier, and this entry already carried a DICER1 germline predisposition record. It is recorded
    as a has_subtypes row, DICER1-Associated, carrying the MONDO term, with the existing genetic
    record scoped to it by subtype. MONDO gives the term two parents, hereditary disease and rhabdomyosarcoma, which makes it a sibling
    of this entry's own disease term rather than a descendant: both are direct children of
    rhabdomyosarcoma. The argument for taking it as a tumour stratum is its rhabdomyosarcoma parent. Note what does not
    make that argument, although a first draft said it did: MONDO asserts that the term has its
    material basis in a germline DICER1 mutation, and asserts exactly the same of the syndrome term
    MONDO:0100216, so the axiom cannot distinguish the two. A first
    draft of the row said MONDO files it under hereditary disease because OMIM's entry is a
    susceptibility phenotype; that omitted the second parent and the OMIM clause was unsourced, so
    both are gone. The DICER1
    predisposition syndrome itself is not curated here, which is what the genetic record already
    said.


    The three existing subtype rows were botryoid, spindle cell and anaplastic, all histological
    variants and all with classification absent. Each now carries classification: histological, so that the new predisposition-context row reads as a second axis rather
    than a fourth variant. A DICER1-associated tumour still has one of the three histologies.


    Three new genetic records from PMID:24436047, the 147-pair NCI/COG/Broad genomic series: BCOR
    and FBXW7, which that study reported as newly recurrent in rhabdomyosarcoma at 7.4% of PAX-gene
    fusion negative tumours each, and CTNNB1. Every one of these is graded INDIRECT and says why in
    its own explanation: the study's denominator is PFN, the fusion-negative genotype group, and the
    same paper shows that is not identical to embryonal histology, since it reports seven
    fusion-negative alveolar tumours whose profile was more consistent with embryonal ones. CTNNB1 was first written with only the paper's introduction behind it, graded COOPERATING, with a
    note saying that was the only cached support and that a frequency was a gap. Both adversarial
    verifiers refuted that from the same cache file: the Results report alterations at the known
    oncogenic codons S33 and T41 in three tumours, 3% of the fusion-negative group. That sentence is
    now quoted, and the grade is SOMATIC_DRIVER on the same footing as BCOR and FBXW7, which rest on
    the same kind of recurrence figure from the same paper. COOPERATING was also the wrong hedge in
    kind: the schema defines it as cooperating with a primary driver, which is a positive claim
    nothing cited makes.


    Four evidence items added to the existing RAS Pathway Activation node. The per-gene fusion-negative
    frequencies for NRAS, KRAS and HRAS. The series' convergence figure, 41 of 44 tumours by
    whole-genome sequencing, cited for framing only. The fusion-negative RAS-pathway figure, at
    least 45%, which is the one the node actually rests on. And the sentence that stops the first
    being misread: the authors count the axis as altered by either of two mechanisms, and for
    fusion-positive tumours the alteration is the PAX rearrangement itself rather than a lesion in a
    receptor tyrosine kinase, RAS or PI3K gene, which is a mechanism embryonal tumours lack by
    definition. The node description's FGFR4 denominator caveat is updated too, since the newly
    cited series splits that figure: 9.6% of fusion-negative tumours against 0% of fusion-positive
    ones.


    Three further evidence items on the DICER1 material, all from the already-cited PMID:22180160:
    the authors' own expectation that the gene matters most in tumours of the uterus and bladder and
    in the botryoid variant, their recommendation that organ-based embryonal rhabdomyosarcoma should
    prompt a family history, and the germline-normal result in the one sporadic case where germline
    DNA was available, which is what supports the GERMLINE_AND_SOMATIC origin from the somatic side.


    What is left undone and raised in the PR body rather than settled here. The new subtype is
    reported GENETIC_UNWIRED by just subtype-usage-audit, as two of the three existing ones already
    are: no pathophysiology node carries DICER1. The cached mechanistic sentences are all hedged. The closest to this disease is the abstract's
    closing suggestion that embryonal rhabdomyosarcoma may result from abnormal microRNA regulation;
    the discussion generalises to paediatric embryonal tumours, and the introduction offers a
    hypothesis about pleuropulmonary blastoma. A node built on a suggestion of that strength would
    claim more than the sources do, and no cited source names a step between the germline variant
    and the tumour. Separately, the spindle cell subtype row is out of date
    against current WHO practice and is raised in the PR body, not changed, because settling it is a
    different decision from this one.


    Validation: just validate passes; just count-verified-snippets reports 64/64 for the whole entry; just validate-terms and just check-stubs pass.


    Two adversarial verifiers were run before pushing, split by axis, and both independently found
    the CTNNB1 note as the blocking defect. Other findings applied: the BCOR record implied an
    exclusivity to fusion-negative tumours that only FBXW7 has, and called a mutation rate an
    alteration rate; the DICER1 site-and-type explanation attributed to the authors a claim about
    embryonal rhabdomyosarcoma generally as though it were about the germline-carrier stratum; the subtype's classification value was a seventh spelling of an idea the corpus already spells six
    ways, and is now histological, which the schema's own example uses and which is the most used of
    the six; A second verification round then found that three of the rewrites had displaced the same error by one sentence rather than removing it. The CTNNB1 note attributed the paper's potential new avenues clause to all three new genes when the same sentence files CTNNB1 among the previously reported ones; the DICER1 site-and-type explanation argued that the sites named coincide with where the carrier cases fell, when the carriers are cervix and bladder and uterus is the site of the single germline-normal case; and the FGFR4 caveat called a mutation rate an alteration rate, which is the distinction the BCOR note had just been corrected on. It also referred to two figures as quoted below that nothing quoted; they are now an evidence item. All are fixed. and the subtype description no longer repeats the DICER1 spectrum framing that
    the genetic record already carries, pointing instead at the separately curated DICER1 Tumor
    Predisposition Syndrome entry on MONDO:0100216. The only cache change is one additive row
    each in cache/mondo/terms.csv and the diseaseorsubtypeterm enum cache for MONDO:0859046. No
    reference was fetched; both cited references were already committed.

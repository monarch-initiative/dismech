  summary: 'Create: Deafness, Congenital Heart Defects, and Posterior Embryotoxon (DCHE, JAG1)'
  details: 'New entry for MONDO:0060713 (DCHE, OMIM 617992), the autosomal dominant JAG1 p.Cys234Tyr disorder delineated by Le Caignec et al. 2002 (PMID:12022040). Deep research provider: falcon (research/Deafness_Congenital_Heart_Defects_And_Posterior_Embryotoxon-deep-research-falcon.md; reference_validation reported 5/5 references resolved, confabulation_rate 0.0).


    NEC preflight (high risk: "posterior embryotoxon plus congenital heart defects" is a cardinal Alagille pairing, kb/disorders/Alagille_syndrome.yaml already exists, and both disorders share JAG1 so a gene-frequency check cannot discriminate). "just preflight-dr <report> MONDO:0060713" returned SKIP (MONDO records no RO:0004003 causal gene for this term) and additionally flagged an OMIM mismatch (report 118450 vs MONDO xref 617992). The manual OMIM/synonym preflight was therefore run per CLAUDE.md. The mismatch resolved as a false positive: OMIM 118450 appears in the report only inside a correctly labelled contrastive paragraph about classic Alagille syndrome, while the report names MONDO:0060713 as its target entity throughout. Identity anchors all agree (MONDO:0060713 xrefs OMIM:617992 with synonym DCHE; PMID:12022040 names JAG1 p.Cys234Tyr in the triad kindred; JAG1 dominates report gene mentions at 61 vs NOTCH2 6). Manual verdict: PASS. The primary literature was fetched directly from PubMed and read BEFORE the falcon report was opened, so the phenotype and genetic content is independently anchored rather than derived from the report.


    MECHANISM CORRECTION made during curation, recorded because it changed the entry''s central claim. A first draft assumed the allele-level functional data for p.Cys234Tyr was unavailable in an indexed abstract, and therefore built the mechanism on a graded "leaky allele" dose-threshold model extrapolated from the hypomorphic JAG1 p.Gly274Asp allele of PMID:12649809 (developing heart more dose-sensitive than developing liver). A pre-PR self-review found that PMID:20437614 (Bauer 2010) is cached as FULL TEXT, not abstract only, and that it assays p.Cys234Tyr directly: the protein is EndoH-sensitive, absent from the cell surface by both trypsin shaving and immunofluorescence, and unable to activate a CBF-dependent Notch reporter - complete haploinsufficiency. The same paper explicitly states the leaky-allele hypothesis and then reports the result that defeats it for this allele. The mechanism chain was rewritten accordingly: nodes 2 and 3 upgraded from PROVISIONAL to ESTABLISHED on direct allele-level evidence; the organ-selectivity node reframed from dose thresholds to unidentified modifying factors and downgraded to HYPOTHETICAL; PMID:12649809 retained only as an explicitly labelled contrasting hypothesis carrying supports: PARTIAL, plus one supports: REFUTE evidence item against the graded-dose explanation. The knowledge-gap discussion was replaced: the old one asked whether the allele was leaky or null (now answered) and the new one (dche_organ_selectivity_modifiers) asks what the modifiers are. Full-text snippets from PMID:20437614 were confirmed to validate under "just validate-disorders", which runs with --no-full-text; that flag governs downloading, not matching against an already-cached body.


    Alagille differentiation is explicit throughout: a differential_diagnoses entry bound to MONDO:0007318 listing the three absent Alagille criteria (bile duct paucity with cholestasis, butterfly vertebrae, characteristic facies) and carrying independent liver-sparing evidence from PMID:20437614 ("yet all carriers have normal liver function"; "the lack of any liver dysfunction in the nine family members studied by Le Caignec et al. is unusual"); a mechanism node whose entire purpose is the organ dissociation; and an OPEN_QUESTION discussion recording the competing reading that DCHE is the liver-sparing tail of the JAG1 continuum rather than a discrete disorder. No Alagille cohort frequency was imported into this entry.


    Content curated: 8 pathophysiology nodes forming an explicit chain (JAG1 EGF-repeat-1 cysteine substitution -> misfolding and ER retention -> loss of cell-surface Jagged1 and failure of Notch trans-activation -> modifier-dependent organ selectivity -> four tissue arms: inner ear sensory patterning, middle ear ossicle patterning, second heart field and cardiac neural crest outflow tract, periocular neural crest anterior segment); 8 phenotypes with HPO bindings; a JAG1 genetic block with GeneticContext; 4 differential diagnoses (Alagille syndrome, non-syndromic JAG1 right-sided CHD, Axenfeld-Rieger anomaly/syndrome spectrum, atypical/oligosymptomatic Alagille); 3 mouse models with modeled_mechanisms links carrying both evidence layers; 3 treatments; 4 discussions (1 OPEN_QUESTION, 2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH); prevalence, inheritance and classifications blocks.


    GeneReviews baseline: no GeneReviews chapter exists for this entity. The Alagille syndrome chapter (PMID:20301450) is tagged GeneReviews in the top-level references block and is used only for the allelic-disorder differential, not as a phenotype baseline for this entry.


    Datasets: "just discover-datasets" was run and returned no relevant accession. Every candidate was a GENE_ONLY match reached through JAG1 (breast cancer lymph node metastasis, glioma, pancreatic islet, embryonic haematopoietic stem cell), which is the Named Entity Confusion pattern the dataset-curation SOP warns about, so the datasets block is deliberately empty.


    Validation, all run to completion with output read: "just validate" passed schema and term validation with 91/91 snippets verified against cached references; "just count-verified-snippets" 87/87 at the time it was run separately, rising to 91/91 after the Axenfeld-Rieger differential was added; "just validate-terms" passed; "just validate-disorders" (the batched, --no-full-text check CI runs) passed; "scripts/check_snippet_length.py --against-ref origin/main" OK, no new snippets under 5 words; "just check-duplicate-keys" OK; "just check-title-snippets" OK, no new title-quoting snippets; "just check-reference-cache-frontmatter" and "just check-term-cache-integrity" OK; pytest tests/test_data.py -k Deafness_Congenital passed 16/16. One unrelated pre-existing failure in Travelers_Diarrhea.yaml was confirmed present on origin/main with these changes stashed.'

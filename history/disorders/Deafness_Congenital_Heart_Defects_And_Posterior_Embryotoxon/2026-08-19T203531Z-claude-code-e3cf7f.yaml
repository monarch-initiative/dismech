  summary: 'Address PR #8980 review: purge superseded dose model, add diagnosis section'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #8980 (0 CRITICAL, 3 IMPORTANT, 4 SUGGESTION).

    IMPORTANT 1 and 2 were both fallout from the mid-curation mechanism rewrite recorded in the previous history entry: the graded "leaky allele" dose-threshold model was replaced with complete haploinsufficiency after reading the PMID:20437614 full text, but remnants of the superseded model survived in sections not revisited. A full sweep of the entry for dose-model survivals (grep for dosage sensitiv / dose sensitiv / tolerates reduced / graded / dose threshold / dose-response) found FOUR, two more than the review flagged:

    1. (flagged) Alagille differential_diagnoses distinguishing_features asserted organ-specific dosage sensitivity as the mechanism of the liver-sparing dissociation, contradicting the entry's own supports: REFUTE evidence item. Rewritten to state that p.Cys234Tyr is completely haploinsufficient, that the organ selectivity is attributed to unidentified modifiers, and that the graded-dose account derives from the DIFFERENT leaky p.Gly274Asp allele and was specifically ruled out for this one. Also split the single overlong distinguishing_features string into four list items.
    2. (flagged) PMID:12649809 carried supports: SUPPORT with an affirmative mechanistic explanation in the Alagille differential while being supports: PARTIAL and labelled a contrasting model elsewhere. Downgraded to PARTIAL with matching contrasting-model framing, so the reference now holds one epistemic status throughout.
    3. (NOT flagged, found by sweep) The dche_entity_status discussion rationale still described "the mechanistic account offered here - organ-specific dosage sensitivity with additional modifiers". Rewritten to complete haploinsufficiency with modifier-set organ selectivity, which strengthens rather than weakens the continuum argument it appears in.
    4. (NOT flagged, found by sweep) The Jag1 Nodder animal_models description claimed the model "makes graded ligand reduction a credible mechanism for a graded human phenotype". Rewritten to say it establishes Jag1 dose dependence of the cochlear phenotype only, with an explicit statement that this is not support for a graded-dose account of the organ selectivity.

    IMPORTANT 3: added a diagnosis: section with seven entries (formal audiometry with tympanometry, auditory brainstem response, echocardiography, slit-lamp examination, JAG1 sequencing, JAG1 copy number analysis, and a caveat entry on interpreting JAG1 missense variants). All NCIT diagnosis_term CURIEs were verified against cache/ncit/terms.csv and the treatmentactionterm enum cache before use. The ~85% sequencing and ~9% CNV yield figures are quoted from the cached PMID:31343788 body and are both marked supports: PARTIAL with an explicit note that the denominator is an Alagille syndrome cohort and must not be read as a DCHE detection rate. Note markers: is a plain string slot, not a descriptor list; an initial draft using HP descriptors failed schema validation and was corrected to free text plus results:.

    SUGGESTION 5: split the mixed-source Bauer snippet into two evidence items per the CLAUDE.md rule that a sentence mixing an assay result and a clinical observation should not share one evidence_source. The assay clause is IN_VITRO, the patient-phenotype clause HUMAN_CLINICAL.

    SUGGESTION 4: added an Ophthalmic surveillance treatment (action_category MONITORING). The review suggested wiring it to target_phenotypes HP:0000627, but tests/test_data.py::test_non_therapeutic_actions_do_not_use_treatment_targets forbids treatment-style target slots on a non-THERAPEUTIC action, and that test failed when the suggestion was implemented literally. Resolved by dropping target_phenotypes rather than relabelling surveillance as THERAPEUTIC, with a notes: field recording why; the phenotype linkage lives on the slit-lamp entry in the new diagnosis section instead.

    SUGGESTION 7: repaired nine truncated proposed_experiments name: values across all four discussions. These were mid-sentence fragments produced by an automated folded-scalar conversion earlier in curation, not intent; each is now a complete phrase.

    SUGGESTION 6 (generic CL:0011012 reused across three crest populations) was explicitly flagged by the reviewer as awareness-only and not a requested change; left as is, consistent with the terms skill rule that no term beats a bad one.

    Validation, all run to completion with output read: just validate passed schema and terms with 105/105 snippets verified; just count-verified-snippets 105/105; just validate-terms passed; scripts/check_snippet_length.py --against-ref origin/main OK, no new snippets under 5 words; scripts/check_folded_hyphens.py OK, no new folded-scalar hyphen splits (this check had tripped four times on an earlier push and was fixed by a coordinator commit; the additions in this round introduce none); just check-duplicate-keys OK; just check-title-snippets OK; just validate-disorders (the batched --no-full-text check CI runs) passed with 105/105 snippets verified; pytest tests/test_data.py -k Deafness_Congenital 16/16 passed.

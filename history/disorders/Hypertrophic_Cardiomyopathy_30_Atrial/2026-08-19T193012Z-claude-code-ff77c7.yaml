  summary: 'Create: Hypertrophic Cardiomyopathy 30, Atrial (CMH30, CORIN)'
  details: |
    New entry for CMH30 (MONDO:0958241 / OMIM:620734), the CORIN-related autosomal recessive LEFT ATRIAL cardiomyopathy.

    Deep research: falcon (research/Hypertrophic_Cardiomyopathy_30_Atrial-deep-research-falcon.md). Its own reference_validation reported needs_review=true with confabulation_rate 0.143 and one unresolved identifier, a malformed DOI (10.3390/biomedicines12030682 with an embedded markdown link); that identifier was NOT cited.

    NEC preflight: 'just preflight-dr research/... MONDO:0958241' returned SKIP because MONDO records no RO:0004003 causal gene for this term, so the manual OMIM/gene/synonym preflight was applied. The MONDO term xrefs OMIM:620734 and MEDGEN:1858408, both naming CORIN at 4p12; the report's gene mentions are dominated by CORIN (49 versus 2 for the next symbol). The falcon report's suggestion that inheritance 'may plausibly be autosomal dominant' was REJECTED against the OMIM/NEJM homozygous-null evidence and curated as autosomal recessive. Sarcomeric CMH1-CMH29 literature was deliberately not imported and the 'atrial' qualifier is preserved throughout.

    Content: nine-node de-bundled mechanism chain from the biallelic CORIN null through failed pro-ANP processing, ANP/NPR-A/cGMP signalling deficiency, incomplete BNP compensation, hypertension, left atrial hypertrophy, cardiac fibroblast activation, left atrial fibrosis, to the atrial arrhythmogenic substrate; two conforms_to edges into fibrotic_response (Mesenchymal Cell Activation, Excessive ECM Deposition). The constitutive Corin-knockout mouse is curated as an animal_model with five modeled_mechanisms, including one FAILS_TO_RECAPITULATE for the atrial-arrhythmia arm (the model's reported battery is echocardiography and histology with no rhythm monitoring) and RESTORED readouts for the recombinant-corin rescue. Four discussions record the atrial-selectivity gap, the human/model mismatch, the single-family evidence base, and the scope boundary against the common hypomorphic CORIN I555(P568) allele.

    Validation actually run and read: just validate PASS; just count-verified-snippets 70/70 verified against cached references; just validate-terms PASS; scripts/check_snippet_length.py --against-ref origin/main OK (no new snippets under 5 words); just check-duplicate-keys OK; just validate-disorders PASS (batched schema + terms + references, 70/70). pytest tests/test_data.py selections for foreign keys, conforms_to node references, model readout targets and FAILS_TO_RECAPITULATE substantiation passed (12796 and 6556 tests, 0 failures).

    GeneReviews baseline: PubMed searched for a GeneReviews chapter covering CORIN/CMH30; none exists. Recorded in the entry's notes.

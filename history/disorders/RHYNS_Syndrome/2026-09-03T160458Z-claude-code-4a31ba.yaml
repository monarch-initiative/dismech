  summary: 'Create: RHYNS Syndrome (TMEM67 ciliopathy)'
  details: |
    De novo curation of RHYNS syndrome (MONDO:0011202) as a Disease entry. entry_type DISEASE rather than a has_subtypes line on a TMEM67 or Joubert entry: RHYNS is the eighth distinguishable clinical condition in the TMEM67 allelic series and its four reported patients share a phenotype combination that is unique within that series, but the entry is explicit that it is the mild end of a spectrum rather than a separate lesion.

    Correction to my own claim issue: I wrote in issue #10715 that RHYNS is attributed to TBC1D32. That is wrong. PMID:29891882 identified biallelic TMEM67 (meckelin) variants by exome sequencing of the originally described family, and TMEM67 is what this entry curates. The error was mine, from memory, and was caught by fetching the primary report before writing anything.

    Deep research: one openscientist run (research/RHYNS_Syndrome-deep-research-openscientist.md). It shipped with no reference_validation and no term_validation block, like three of the five runs in this batch; term validation aborted on a 5-second EBI OLS read timeout on CL:0000210. This is dismech#10396, where I commented with the batch-wide reproduction and then corrected my own count. The reference section was retro-fitted with just validate-research-reference and is worth reading: 27/27 references resolved, 20 of 27 on topic, 1 off topic (PMID:32156598, a prostate cancer TACC3 paper sharing only the term 'meckelin'; not used), and 16 of 19 quoted claims found in source with all three failures being ellipsis or paraphrase near-misses rather than confabulations.

    Used from the report: PMID:26035863 (Tmem67 knockout mouse establishing meckelin as a Wnt5a receptor required for ROR2 phosphorylation at the ciliary transition zone, and the RhoA rescue), PMID:23283079 (TMEM67-mutant mice on an MKS-like congenic background showing diminished Shh signalling), PMID:15384098 (natural history of nephronophthisis in Joubert-related cerebello-oculo-renal syndromes) and PMID:28719906 (TMEM67 p.Asn242Ser founder allele in 22 affected members of 12 Iranian families).

    Three things this entry is deliberately careful about. First, every mechanistic node above the genotype is mouse or in vitro data, and a HUMAN_MODEL_MISMATCH discussion records that the Tmem67-null mouse shares no defining RHYNS feature and carries a null where the RHYNS genotype is inferred hypomorphic; a proposed knock-in experiment specifies the test with both outcomes. Second, the Shh direction is contradictory across two mouse datasets, so the node carries the de-repression direction with a REFUTE evidence item for the contrary result rather than choosing; a KNOWLEDGE_GAP discussion explains why there is no basis to choose for RHYNS specifically. Third, hypopituitarism is the feature that distinguishes RHYNS within the series and has no mechanistic account at all, so its node asserts none and a third discussion records that.

    Phenotype-level honesty notes carried in the entry: nephronophthisis is in the acronym but is documented only in the index patient, not in the two brothers; and the skeletal phenotype is 'mild' in the index case and 'acromelic' in the brothers, which are curated as reported rather than reconciled.

    Ontology notes: HPO has no distinct Retinitis pigmentosa or Enophthalmos term, so those bind HP:0000510 (Rod-cone dystrophy) and HP:0000490 (Deeply set eye) with the clinical name in preferred_term, both being exact synonyms. Growth hormone deficiency binds HP:0008240 (Secondary growth hormone deficiency) because the deficiency is pituitary in origin.

    Validation: just validate passes; 37/37 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-title-snippets all pass.

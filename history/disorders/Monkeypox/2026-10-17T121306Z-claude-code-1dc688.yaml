  summary: Bind LOINC monkeypox virus DNA and Orthopoxvirus antibody panel codes
  details: |
    LOINC tranche B batch 26. Both biochemical markers take a loinc_term. Monkeypox Virus PCR takes LOINC:100383-9 (Monkeypox virus DNA [Presence] in Specimen by NAA with probe detection), the virus-specific nucleic acid detection the marker names, specimen left unqualified as the marker is. Serology for Orthopoxvirus Antibodies takes LOINC:100893-7 (Orthopoxvirus IgG and IgM Ab panel - Serum or Plasma), a panel code and therefore the preferred identity level, genus-level to match the marker's own genus-level claim and the serological cross-reactivity that is the reason the claim is made at that level, covering both isotypes the cited survey measured.

    LOINC also carries a dual-target panel pairing monkeypox virus with a non-variola Orthopoxvirus target, LOINC:101398-6, which is the configuration the first cited recommendation prefers. It was not bound because loinc_term is single-valued and this marker's identity is the virus-specific assay; the alternative is recorded in the marker's notes.

    Enumeration basis: Monarch KG LOINC set, queries Monkeypox (15 results) and Orthopoxvirus (10 results), total equalled shown for both so each set was fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code in either.

    Both codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand.

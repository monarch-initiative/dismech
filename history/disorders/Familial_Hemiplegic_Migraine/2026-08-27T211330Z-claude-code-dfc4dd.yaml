  summary: 'Create: Familial Hemiplegic Migraine (MONDO:0000700)'
  details: |
    New Disease entry for familial hemiplegic migraine, curated as a Disease with FHM1 (CACNA1A), FHM2 (ATP1A2) and FHM3 (SCN1A) as molecular has_subtypes. MONDO:0000700 xrefs OMIMPS:141500, an OMIM phenotypic series, which is what the has_subtypes shape models; it is not curated as a Grouping because FHM1/2/3 have no standalone Disease entries to form a union over.

    Mechanism. Nine pathophysiology nodes laddered MOLECULAR -> CELLULAR -> TISSUE -> ORGANISM. Three gene-specific molecular nodes converge on a shared "Reduced Cortical Spreading Depression Threshold" node, then to reversible hemiparetic aura and the headache phase. FHM1 (Cav2.1 gain of function) and FHM2 (astrocytic Na+/K+-ATPase alpha2 loss of function) reach it through increased cortical glutamatergic excitability and impaired glutamate/K+ clearance respectively. FHM3 is deliberately curated as a PARALLEL arm rather than folded into the glutamatergic node: PMID:34491914 showed CSD ignition by GABAergic interneuron hyperactivity via spiking-generated extracellular K+ with neither GABAergic nor glutamatergic synaptic transmission required, so a single glutamate-mediated convergence would overstate the evidence.

    Gain/loss-of-function slot discipline per CLAUDE.md: variant consequence on GeneticContext.functional_impact_category (GAIN_OF_FUNCTION for CACNA1A and SCN1A, LOSS_OF_FUNCTION for ATP1A2); pathway activity state on Descriptor.modifier (INCREASED/DECREASED).

    PRRT2 is recorded in the genetic section as a fourth hemiplegic-migraine gene but deliberately NOT as a numbered subtype: "FHM4" is not an accepted ICHD/OMIM designation and the mechanism is not an ion-transport defect. No PRRT2 pathophysiology node is curated because the cited authors state the mechanism is not understood.

    Boundaries with adjacent entries are stated in the entry notes. CACNA1A-Related Disorder keeps the gene-centred view (also EA2, SCA6, DEE42) and already carries FHM1 as a molecular subtype; Migraine with Aura explicitly scopes hemiplegic migraine out; sporadic hemiplegic migraine is curated as a differential rather than a subtype because the family-history criterion, not the mechanism, separates it. FHM2/ATP1A2 and FHM3/SCN1A CSD mechanism was previously covered nowhere in the KB.

    Two discussions recorded: a KNOWLEDGE_GAP on whether the three subtypes share one final CSD-threshold mechanism or merely converge clinically, and a HUMAN_MODEL_MISMATCH noting that the CSD-threshold node rests entirely on MODEL_ORGANISM evidence and CSD has not been recorded during a spontaneous human FHM attack.

    NEC preflight (CLAUDE.md section 2b): "just preflight-dr" returned SKIP because MONDO:0000700 records no RO:0004003 causal gene (expected for a phenotypic-series parent), so the manual check was run. Report gene frequencies were CACNA1A=28, ATP1A2=14, SCN1A=11, matching FHM1/2/3 exactly; the MONDO OMIM xref is the OMIMPS:141500 series and the report asserts no conflicting OMIM ID; "FHM" and "familial hemiplegic migraine" resolve uniquely to MONDO:0000700 with no synonym collision against the sibling sporadic entity MONDO:0020757. Manual verdict PASS.

    Also repaired a defect in Alternating_Hemiplegia_of_Childhood.yaml surfaced by drawing this boundary: its FHM differential described the overlap as "ATP1A2/ATP1A3 involvement", which reads as a shared locus. AHC is ATP1A3 and FHM2 is ATP1A2 - paralogous alpha subunits of the same pump, not the same gene - and that entry's own cited snippet (PMID:22842232) makes the opposite point. Description corrected and a distinguishing feature added naming the gene boundary.

    Validation. The interrupted WIP draft was treated as unverified. Fixed before validating: Genetic.description -> notes on four gene records (merging one into an existing notes block rather than dropping either), relationship_type CAUSAL -> CAUSATIVE, an invalid "classifications.channelopathy_type: calcium" replaced with a proper channelopathy_category ClassificationAssignment (neurological channelopathy, the enum being organ-system rather than ion) plus harrisons_chapter NEUROLOGIC, and a "MONDO:0011266_PLACEHOLDER" stub in the AHC differential replaced with the real MONDO:0016241 entry and evidence. Ran: just validate (passed), just validate-terms (passed), just check-duplicate-keys (passed), just count-verified-snippets (68/68 verified), and the batched pre-PR sweep just validate-disorders over both changed files (schema, terms and references all passed; 117/117 snippets verified). No reference cache or term cache file was hand-written; all references were already cached by fetch-reference.

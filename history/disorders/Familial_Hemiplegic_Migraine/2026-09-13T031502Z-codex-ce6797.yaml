  summary: Review FHM phenotype evidence, HPO specificity and causal explanations
  details: |
    Reviewed all 17 original phenotypes on evidence/claim, HPO specificity and causal-explanation axes, plus the full Falcon report, citation sidecar, GeneReviews and primary clinical/functional context. Separate visual/sensory/brainstem manifestations and add case-scoped cerebellar, cognitive, psychiatric and associated headache findings. Correct family-level cerebellar frequencies and the 105-solved-proband genetic denominator within 697 screened HM cases. Keep familial disease distinct from simplex/allelic cohorts, epilepsy-selected pedigrees, PRRT2 carriers and candidate CACNA1H/CACNA1I burden signals. Replace clinical-restatement mechanisms with qualified physiological routes; update directly measured W887R astrocytic clearance and L1649Q interneuron/potassium findings. Preserve provisional cortical aura, headache, severe S218L subcortical, cerebellar, vasogenic edema, acquired cognitive-injury and family psychiatric hypotheses with exact source and model scope. Add exploratory R583Q cytokine readouts and explicitly competing neuroimmune interpretation without converting serum assays into proof of CNS inflammation. Clinical attribution gaps remain for brainstem, altered-awareness, developmental and associated headache manifestations where the particular causal route is unresolved; incomplete intermediates do not erase supported channel-level cerebellar links. Split opposing model-readout directions and preserve the W887R negative clinical result in model evidence/limitations. Reclassify expert treatment advice OTHER, retain human observations HUMAN_CLINICAL, and copy exact fetched titles on every evidence item. Caches generated only by fetchers/validators; previous history preserved. Final validation suite and exact scope/count manifest are recorded in the PR.

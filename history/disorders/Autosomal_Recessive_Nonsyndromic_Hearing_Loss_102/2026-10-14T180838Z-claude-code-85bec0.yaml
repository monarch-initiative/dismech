  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing copy-number/sequencing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: the only published family is described with the qualitative word profound and no pure-tone dB figure is reported for either sibling, so there is no numeric value to anchor a WHO/GBD band on.

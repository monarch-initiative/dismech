  summary: 'Round 2 review response: stale prose, snippet scope, CI fix'
  details: |
    Answered round 2 of automated review, plus a CI failure this branch's previous push caused.

    Finding 8 (IMPORTANT). The Cochlear implantation description still said the record carried no evidence block, twenty lines above the evidence block added in the previous push. The review_notes narrative and the phenotype description had both been updated; this one was missed. Rewritten to keep the part that is still true - no cited publication reports implantation outcomes in an EPS8 patient, so the evidence is the general indication rather than a disease-specific result.

    Finding 9 (suggestion). The hearing-aid item quoted the subordinate clause "who receive limited benefits from optimally fitted hearing aids", which clears the length gate but asserts nothing standing alone. Replaced with the whole sentence, which is already quoted on the implantation record two items above and carries the same grading, so there is no divergence risk.

    Finding 10 (suggestion). directness INDIRECT added to the auditory-verbal therapy item. The snippet establishes that post-implant intervention is a managed variable; that this named therapy belongs here follows by one inference step, which is what the slot encodes.

    CI: check-folded-hyphens went red on the previous push. A line of the language-delay phenotype description ended in "post-" inside a folded scalar, so folding would have inserted a space mid-compound. Reflowed. The reason it was missed is worth recording: that recipe takes no file argument, so the per-file validation loop used during curation cannot see it. It is one of several whole-KB gates in that position.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 102 (MONDO:0014428)'
  details: |
    De novo curation of DFNB102 / EPS8-related nonsyndromic hearing loss (MONDO:0014428), claimed in #12502.

    entry_type decision: DISEASE. A single-gene, single-MONDO-term leaf under hearing loss, autosomal recessive.

    Pathograph: five nodes. One molecular lesion (EPS8 loss of function) with two separable downstream arms - failure of stereocilia elongation, shared by inner and outer hair cells, and arrested functional maturation confined to inner hair cells - converging on compromised detection of physiological sound pressures. A fifth node records EPS8 as one component of the MYO15A/whirlin/GPSM2 stereocilia tip complex rather than as a solo actor.

    Cell-type binding note: the elongation node binds CL:0000202 auditory hair cell rather than the narrower inner or outer hair cell terms, because the cited result is explicitly about both. The maturation node binds CL:0000589 cochlear inner hair cell, because there the source restricts it.

    Recorded human-model mismatch: Eps8-null mice have shortened vestibular stereocilia with no vestibular deficit, which the authors attribute to central compensation. The founding human family is described as having isolated deafness, but no vestibular testing is reported - so 'non-syndromic' rests on the absence of a complaint in two individuals against a model that predicts a measurable abnormality with no complaint. Proposed experiment records the reflex measurements that would distinguish the readings.

    Evidence base is deliberately stated as thin: one human family, two siblings, one homozygous nonsense allele, with the mechanism carried by mouse and in vitro work. Every pathograph node below the molecular one is graded MODEL_ORGANISM or IN_VITRO.

    One phenotype (Delayed speech and language development) carries no evidence block, deliberately, because no cited source reports speech outcomes in an EPS8 patient. This is stated in the node description and in review_notes.

    Validation: just validate, just validate-terms, just count-verified-snippets (15/15).

    Deep research reconciliation. The committed OpenScientist report materially
    changed this entry and caught one error of mine.

    Corrected: an earlier draft's notes said no GO term names "barbed-end actin
    filament capping", on the strength of an empty cache/go/terms.csv grep. The term
    exists (GO:0051016), confirmed with runoak against ols:go. An empty cache is
    silence, not a negative answer. The false note is replaced by a note recording the
    mistake, and GO:0051016 is now bound where it belongs.

    Corrected: the draft said the entry rests on "one human family". Five pathogenic
    EPS8 variants had been described by 2023, across Algerian, Chinese and Iranian
    families. The original framing came from reading the founding paper and stopping.

    Added from the report, each verified against a freshly fetched cache: a
    C-terminal-effector-domain pathophysiology node with the structural separation of
    capping from bundling (PMID:15558031, PMID:20532239); the MYO15A/whirlin/EPS8 tip
    complex statement (PMID:21236676); the compound splice-plus-65.9 kb-deletion
    genotype that sequencing alone read as homozygous (PMID:34637946); an Eps8
    knockout mouse model with the extra-auditory intestinal and metabolic phenotype
    recorded as a typed divergence (PMID:20209148); and cochlear implantation.

    Reference titles were twice written from descriptive text rather than copied from
    the cache frontmatter, and twice caught by the title check. They are now set
    programmatically from the references_cache title field.

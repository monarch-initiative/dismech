    # Fixes: AIPL1-Related Retinopathy

    File: `/home/user/dismech/kb/disorders/AIPL1-Related_Retinopathy.yaml`
    Review: `reviews/AIPL1-Related_Retinopathy.md` (verdict MINOR_ISSUES, 4 findings)

    ## Findings fixed

    1. **MINOR 1 — PMID:33067476 grading divergence on the p.G122R sentence.**
       The one mixed clinical+functional sentence ("The clinical history of these
       patients together with our functional assays suggest that the p.G122R
       variant is a rare hypomorphic allele…") was quoted twice with two different
       `evidence_source` values. Fixed by quoting the sentence that makes each
       claim, per the repo rule:
       - `has_subtypes[1].evidence[1]` (`HUMAN_CLINICAL`) now quotes the clinical
         sentence: "The p.G122R variant has been reported in association with the
         milder phenotypes of late onset retinal degeneration or RP."
       - `genetic[0].evidence[1]` (`IN_VITRO`) now quotes the functional-assay
         result: "while p.G122R had no effect on HSP90 binding, the modulation of
         PDE6 cGMP levels was impaired".
       Explanations updated to match. `check_snippet_grading.py` no longer reports
       any divergence in this file (the stale baseline row for it was left in place
       — the baseline file is outside the assigned scope and the checker only gates
       on *new* findings).

    2. **MINOR 2 — PMID:10615133 generic-LCA quote backing AIPL1-specific claims.**
       No AIPL1-cohort-specific replacement quote exists in the cached sources for
       the exact congenital-presentation wording, so the report's alternative
       ("make explanations transparent about the generic basis") was taken. All
       three explanations using this quote (phenotypes "Congenital blindness" and
       "Nystagmus", progression phase "Congenital severe visual impairment") now
       state that the sentence describes LCA in general (all genes) in the
       gene-discovery paper's background, and point at the AIPL1-specific cohorts
       (PMID:38880373, PMID:15249368) that independently support severity. Snippets
       unchanged.

    3. **MINOR 3 — 7-word truncated snippet on "Supportive care and monitoring".**
       Extended from "amino acids supplementation have failed to show" to the
       full-subject form "Vitamin A, minerals and amino acids supplementation have
       failed to show a clear benefit for these patients" (exact substring of the
       PMID:33712480 cache body, verified). The snippet now carries the vitamin-A
       subject the explanation and node description lean on.

    4. **MINOR 4 — unsourced CNG-channel/calcium mechanism on the rod-death node.**
       `pathophysiology` → "Rod PDE6 Loss and cGMP Accumulation" description no
       longer asserts CNG-channel opening / sustained depolarization / calcium
       influx; it now states only what the cited sources establish (PDE6 loss,
       elevated cGMP, rapid rod death, in mouse and human iPSC-derived
       photoreceptors). The mechanism was moved to a new `notes:` field on the same
       node, explicitly flagged as standard phototransduction biology not stated by
       the sources cited here. The node's `downstream` edge description was trimmed
       in the same way ("Sustained cGMP elevation in rods converges on rapid
       photoreceptor apoptosis"). Node name unchanged, so no entity refs moved.


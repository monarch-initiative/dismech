    # Review: AIPL1-Related Retinopathy

    - **File:** /home/user/dismech/kb/disorders/AIPL1-Related_Retinopathy.yaml
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `Snippets checked: 46/46 verified against cached references` (no skips)
    - **Term validation:** `linkml-term-validator validate-data` — passed

    ## Verdict: MINOR_ISSUES

    No claim-fidelity or misclassification finding of MAJOR or CRITICAL severity. Every
    snippet is an exact substring of its cached reference, and I confirmed every quoted
    sentence against the cache bodies (abstracts and, for PMID:18408180, PMID:28973376,
    PMID:33712480, full text). The entry is unusually careful: it caveats the divergent
    7%-vs-20% prevalence estimates, documents the corrected-but-not-retracted status of
    PMID:19299492 (the three errata are visible in the cache), deliberately avoids the
    retracted 2009 Gene Therapy paper, and honestly explains why no NCT identifier is
    cited for the Specials-Licence gene-therapy study.

    ## Findings

    1. **MINOR** — Genetic / Milder-EOSRD subtype; PMID:33067476, quote "the p.G122R
       variant is a rare hypomorphic allele with a later disease onset, amenable to
       therapeutic intervention". The identical sentence is graded
       `evidence_source: HUMAN_CLINICAL` at `has_subtypes[1].evidence[1]` and
       `evidence_source: IN_VITRO` at `genetic[0].evidence[1]`. `check-snippet-grading`
       flags this file (the divergence is already in the repo baseline, i.e., known).
       The source sentence in the paper is explicitly mixed — "The clinical history of
       these patients together with our functional assays suggest that…" — so per the
       repo rule the fix is to grade the quote once, or quote the sentence that makes
       each claim (a clinical sentence for the subtype claim, a functional sentence for
       the genetic claim). Not misinformation, but a tracked internal contradiction.

    2. **MINOR** — Phenotypes "Congenital blindness", "Nystagmus", and progression phase
       "Congenital severe visual impairment"; PMID:10615133, quote "Individuals affected
       with LCA are diagnosed at birth or in the first few months of life with severely
       impaired vision or blindness, nystagmus and an abnormal or flat
       electroretinogram (ERG)." The paper says exactly this — but as a description of
       LCA *in general* (all genes), in the background of the AIPL1 gene-discovery
       paper, not as an observation on the AIPL1 cohort. The entry attaches it to
       "classic AIPL1-LCA" claims. The generalization is clinically sound (AIPL1-LCA is
       among the severest forms, and PMID:38880373/PMID:15249368 independently support
       the severe congenital presentation), but a snippet from the AIPL1-specific cohort
       papers would be tighter.

    3. **MINOR** — Treatment "Supportive care and monitoring"; PMID:33712480, snippet
       "amino acids supplementation have failed to show". A seven-word fragment whose
       subject ("Vitamin A, minerals and…") is truncated away; the explanation and the
       node description lean specifically on the vitamin A part, which the quoted
       fragment does not itself carry. Full cache sentence: "Vitamin A, minerals and
       amino acids supplementation have failed to show a clear benefit for these
       patients, and are consequently not recommended." Extending the quote would make
       it self-supporting. (This is the short-fragment shape `check-snippet-length`
       baselines; support direction and `evidence_source: OTHER` for a management
       review are both correct.)

    4. **MINOR** — Pathophysiology node "Rod PDE6 Loss and cGMP Accumulation": the
       description asserts the death mechanism "elevated cGMP … keeps
       cyclic-nucleotide-gated channels open, producing sustained depolarization and
       calcium influx that drives rapid rod photoreceptor cell death". No cited source
       in this file states the CNG-channel/depolarization/calcium mechanism — the cited
       evidence (PMID:15365178 mouse, PMID:36084639 organoid) establishes PDE6 loss and
       cGMP elevation only. The mechanism is standard phototransduction biology, but as
       written the description outruns its evidence.

    Checked and deliberately **not** flagged (calibration): lowercase `hgnc:359`;
    `supports` values that differ per claim; MODEL_ORGANISM grading for the mouse
    studies (PMID:15365178, PMID:24108108, PMID:19299492) and IN_VITRO for organoid
    (PMID:36084639), yeast-two-hybrid/biochemistry (PMID:18408180, PMID:28973376) —
    all correct per repo rules; frequency bands (VERY_FREQUENT for 80% maculopathy,
    OCCASIONAL for 26% keratoconus/cataract, FREQUENT for 78.6% cone-rod ERG) match
    their quoted denominators; the "no NCT identifier" handling of the Lancet
    first-in-human study is accurate to the paper (Specials Licence manufacture);
    human phenotype claims are all supported by HUMAN_CLINICAL evidence, with model
    evidence confined to mechanism nodes.


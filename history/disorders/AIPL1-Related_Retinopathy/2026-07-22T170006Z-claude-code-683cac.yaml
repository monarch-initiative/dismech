  summary: 'Create: AIPL1-Related Retinopathy'
  details: |
    Fresh curation of AIPL1-related retinopathy (MONDO:0100438, LCA4), continuing the long-tail single-gene retinopathy list from issue #4008 after RDH5 (PR #6816) and RLBP1 (PR #6822). Mechanistically distinct from those two visual-cycle genes: AIPL1 is a phototransduction-effector CHAPERONE (FKBP-like domain binds farnesylated PDE6-alpha; TPR domain binds HSP90/HSP70) required for PDE6 holoenzyme folding/assembly, not a visual-cycle chromophore-regeneration protein. Modeled the classic allelic-severity spectrum as 2 subtypes: Classic LCA (biallelic null alleles, e.g. recurrent c.421C>T/W278X, extinguished ERG, congenital blindness) and Milder EOSRD (at least one missense/hypomorphic allele, e.g. c.152A>G, c.572T>C, or the rare hypomorphic p.G122R, severe-but-not-extinguished cone-rod ERG pattern, later onset). Pathophysiology models a genuine rod-vs-cone mechanistic divergence downstream of the same chaperone defect: rods show PDE6 loss -> cGMP ACCUMULATION -> excitotoxic apoptosis, while cones show PDE6/RetGC1 destabilization -> REDUCED cGMP synthesis -> a biochemically distinct death pathway (both confirmed via independent mouse-model PMIDs). 13 PMIDs independently fetched and verified via the full validation suite (schema+term+reference validation all pass clean). Caught two critical hazards flagged by the research agent before citing: (1) PMID:19710705, a superficially similar-titled 2009 AIPL1 gene-therapy paper, was formally RETRACTED in 2024 for image-duplication -- confirmed NOT cited anywhere in this entry, used the valid companion paper PMID:19299492 (which carries three published corrections in 2010, 2023, and 2024 but is not retracted) instead; (2) prevalence figures for AIPL1's contribution to LCA vary 3x across cohort eras (20% in an early small non-representative screen vs 7% in a later 512-proband worldwide screen) -- reported both with context rather than picking one as definitive. Real, very recent (Lancet 2025) first-in-human AAV8.hRKp.AIPL1 gene therapy trial in 4 children with classic LCA included as the primary treatment section -- this was a Specials-Licence compassionate program, not a standard registered trial, so the clinical_trials: entry deliberately omits a fabricated/guessed NCT identifier (lesson carried over from the RDH5 PR's NCT-mismatch incident). Ran an ad hoc Python substring-check script to self-audit all 38 evidence snippets and initially got 38/38 'failures' -- this turned out to be a false alarm caused by the script being stricter than the actual project validator (raw byte substring check does not tolerate PDF-extraction embedded \r\n line-wraps, which the project's linkml-reference-validator evidently normalizes/tolerates); the real just-validate run passed clean on the first attempt with zero reference-validation errors, so no snippet changes were needed. New MONDO:0100438 enum value manually appended in sorted order to cache/enums/diseaseterm_f618932bb23f.csv.

  summary: Review and enrich Periodontal Ehlers-Danlos Syndrome
  details: |
    Added Harrison's chapter classifications, 165-individual/34-family literature prevalence (PMID:37323685), germline C1R/C1S causative variant grounding and serine-type endopeptidase gain-of-function modifiers, Oral Examination and Genetic Testing diagnosis entries, Dental Prophylaxis and Arterial Imaging Surveillance treatments with target_mechanisms, and expanded short phenotype snippets. In review round 1 (#17365), rebound `Arterial Imaging Surveillance` from modality-specific `NCIT:C190557` (MRA) to modality-neutral `NCIT:C190556` (`Angiography`, verified in `TreatmentActionTerm`; `NCIT:C15719` `Surveillance` sits under `Observational Study` outside `NCIT:C25218`), changed C1R/C1S lesion molecular function modifiers to `GAIN_OF_FUNCTION`, grounded `IMMUNE_RHEUMATOLOGIC` on the heritable connective-tissue disorder classification sentence in PMID:37323685, graded GeneReviews PMID:34324282 items as `HUMAN_CLINICAL` + `REVIEW_SYNTHESIS`, added `Arthralgia` (`HP:0002829`, 52% in PMID:37323685) as the target of physical therapy symptom management, and updated actor metadata and PR link.

  summary: 'Create: Periodontal Ehlers-Danlos Syndrome'
  details: |
    Created new entry for Periodontal Ehlers-Danlos syndrome (pEDS, formerly EDS type VIII), covering both molecular subtypes: pEDS-1 (C1R, MONDO:0020684, the majority -- 15/17 genetically-solved founding-cohort families) and pEDS-2 (C1S, MONDO:0014954, 2/17 families). Anchored disease_term on the umbrella MONDO:0007527 'Ehlers-Danlos syndrome, periodontitis type', found via runoak label search on 'periodontal' (exact synonyms 'pEDS' and 'periodontal Ehlers-Danlos syndrome', related synonym 'EDS VIII'). Sources: the GeneReviews chapter (PMID:34324282, confirmed via just check-genereviews --online), the founding 2016 discovery paper (PMID:27745832, 19 families/107 individuals), the 2023 mechanistic paper demonstrating activated C1s directly degrades collagen I (PMID:36960056, full text), a 2019 C1S structural-mechanism paper (PMID:31921203, full text), a systematic adult oral-characteristics cohort (PMID:35833531, full text), a non-oral manifestations cohort with per-feature frequencies (PMID:37323685, full text), and a 13-novel-case phenotype-expansion paper documenting venous insufficiency as an additional feature (PMID:33890303). Pathograph departs from the collagen-gene mechanism used in every other EDS subtype curated this session: C1R/C1S gain-of-function variants (subunit-interface/inter-domain-hinge destabilization for C1R; a CCP1-module cleavage-exposing mechanism producing a constitutively active Fg40 fragment for C1S, per PMID:31921203) converge on a shared 'Uncontrolled Extracellular Activated C1s' node, which directly proteolyzes collagen I (a non-canonical activity distinct from C1s's role in complement C4 activation) rather than acting through a collagen-synthesis or collagen-modifying-enzyme defect. This converges into periodontal and systemic (dermal/vascular) branches, all phenotypes wired into the causal graph. Found and added one genuinely disease-specific dataset via just discover-datasets: geo:GSE190786 (monocyte transcriptomics, 2 pEDS patients vs 3 controls, PMID:35571048) was a DIRECT name-based match, not a GENE_ONLY hit on C1R/C1S's other biology, and was verified with just verify-datasets before adding. No stub existed for this disease (the parent Ehlers-Danlos_Syndrome.yaml entry carried a bare 'Periodontal EDS' has_subtypes placeholder with existing C1R/C1S genetic evidence, now superseded by this standalone entry). Ran the falcon deep-research pass (just dr_fallback='--fallback' research-disorder falcon Periodontal_Ehlers-Danlos_Syndrome) for cross-check; its findings, if any, will be recorded in a follow-up EDIT history record. Validated with: just validate (29/29 snippets verified), just validate-disorders (CI-authoritative gate, passed), just check-causal-targets (0 new dangling targets against 122 grandfathered), just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just list-gene-term-mismatches (0/6 mismatches), and whole-KB just check-snippet-length (initially flagged 4 short frequency-fragment snippets, fixed by quoting the full source sentence; now exit 0). just compliance: 84.3% global / 84.8% weighted.

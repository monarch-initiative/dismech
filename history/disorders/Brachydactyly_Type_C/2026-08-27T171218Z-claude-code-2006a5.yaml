  summary: 'Review: wire pathograph, add clinodactyly and surgical series'
  details: |
    Final-pass review. Phenotype causal connectivity was 0/5, now 7/7. Added clinodactyly of the index or middle finger and the angel-shaped phalanx as phenotypes, and a Closing Wedge Osteotomy treatment, all from a 2022 Saudi series of 15 families and 42 affected children [PMID:35502951] - the largest reported surgical series in BDC. The outcome claim is split: the operative result is SUPPORT, the durability claim is PARTIAL, quoting the authors' own note that long-term follow-up is lacking. The same paper adds two recurrent GDF5 missense alleles [p.Met173Val, p.Thr203Asn] to the genetic spectrum, and quantifies how uncommon the complete angel-shaped picture is [1 hand of 42 children].

  summary: 'Create: Brachydactyly Type C'
  details: |
    ISDS group 18 completeness pass. Mechanism is GDF5 functional haploinsufficiency with documented non-penetrance, contrasted with the dominant-negative BMPR1B and processing-site GDF5 alleles of BDA2. The classification note records that the biallelic GDF5 disorders - Grebe, Hunter-Thompson, Du Pan - are acromesomelic dysplasias in group 16, so the group follows the entity rather than the gene. PMID:9288091, the original CDMP1 gene-identification paper, has no retrievable content in the reference cache and is therefore listed under references: rather than quoted as evidence. All 28 snippets verified.

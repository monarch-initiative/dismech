  summary: Bind LOINC audiometry measurements to the existing audiometry diagnosis
    row
  details: |
    Added a LOINC-coded pure-tone audiometry measurement set to the existing Audiologic assessment and serial follow-up diagnosis row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not ABR, tympanometry, otoacoustic emissions or speech testing also described in that row. The measurement set covers the exact seven frequencies the cited series reports testing (250/500/1000/2000/4000/6000/8000 Hz per ear), rather than the usual four-frequency core set; the 250/6000/8000 Hz per-ear LOINC codes were absent from origin/main and were seeded as six new, additive cache/loinc/terms.csv rows. No reference range is bound: the Family 3 proband's pure-tone average of 85 dB HL is described in the source as severe, but 85 dB HL falls within the WHO/GBD Profound band (80-<95 dB) rather than the Severe band (65-<80 dB) the source's word names, so binding either grade would assert a precision the source's loose clinical wording does not support. Family 2 separately progressed to only moderate-to-severe loss by age nine.

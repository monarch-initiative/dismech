  details: |
    Created kb/disorders/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_124.yaml
    (MONDO:0968981, PKHD1L1, OMIM 620794). Scope decision: DISEASE - one gene, one
    proximal lesion (loss of the stereocilia surface coat on the upper stereocilia),
    one clinical picture. Stub deleted.

    Deep research: falcon (Edison), run through scripts/run_deep_research_client.sh
    directly. NEC preflight passes (PKHD1L1 mentioned 50 times; MYO7A correctly
    identified as the competing gene in one family rather than a second cause). It
    added nothing the primary literature does not carry.

    Sources: PMID:38459354 (Redfield 2024, full text) is the defining human paper -
    four families; PMID:31444330 (Wu 2019) identifies PKHD1L1 as the coat protein;
    PMID:39482437 (Strelkova 2024) supplies the bundle-maintenance time course, the
    negative controls and the noise result; PMID:36960824 is the zebrafish model.

    Curation decisions worth recording. Only the terminal pathophysiology node
    conforms to sensorineural_hair_cell_loss: conforming to that module's
    mechanotransduction node would assert a mechanism the data contradict, since
    FM1-43 loads normally in PKHD1L1-deficient hair cells, and its ionic/oxidative
    node has never been investigated here. The noise result is curated structurally
    as an environmental entry with an EXACERBATES influences_mechanisms link plus a
    PROVISIONAL node, and deliberately NOT as a treatment, because it is a mouse
    result and the human paper names it as an open question. The mouse-human onset
    divergence is a HUMAN_MODEL_MISMATCH discussion. The Family 3 MYO7A confound is
    recorded on the severe phenotype and in its own discussion rather than glossed.
    The four HPOA annotations on MONDO:0968981 that contradict "nonsyndromic" are
    not curated; the reasoning is in the entry notes and is worth reporting upstream.

    Validation: just validate exit 0; 62/62 snippets verified; check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-environmental-evidence,
    check-folded-hyphens all exit 0. One bracketed-phase snippet from the abstract
    was replaced with two case-description quotes because the reference validator
    strips bracketed spans before matching.

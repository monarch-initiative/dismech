  summary: 'Address review on PR #9392: treatments, p.C105W, cerebral atrophy, sFasL'
  details: |
    Applied the three IMPORTANT findings and four of the optional findings from the automated review of PR #9392.

    1. p.C105W founding allele. Added two evidence items to the FADD genetic entry and extended its notes: PMID:32350755 establishes that every previously reported homozygous patient carried p.C105W, and PMID:38752438 supplies a further independent homozygous family.

    2. treatments block (was absent). Four entries, each scoped to what a cited source actually reports rather than to clinical convention: Immunoglobulin Replacement (NCIT:C62710; subcutaneous, 400 mg/kg/month, with the reported subjective outcome quoted and classed PARTIAL), Antibiotic Prophylaxis (recommended on the strength of the functional hyposplenism and declined by the family, so PARTIAL), Haematopoietic Cell Transplantation (NCIT:C15431; performed in a small number of patients, with the authors' own hedge about curative threshold and non-haematopoietic manifestations quoted rather than paraphrased), and Immunomodulatory Therapy (NCIT:C116540; an argument from mechanism with no reported outcome, PARTIAL). Each carries target_mechanisms with its own evidence. The reviewer proposed sourcing the transplantation claim from Savic 2015 (PMID:25794656); that record was fetched and caches with content_type unavailable and a zero-length body, so it cannot supply a snippet. The transplantation claims rest on PMID:32350755 instead, which reviews those same patients in available text, and the situation is recorded in the entry notes.

    3. Cerebral atrophy phenotype (HP:0002059), evidenced twice - PMID:38752438 and PMID:32350755.

    Optional findings also applied: soluble Fas ligand is no longer silently omitted but curated as a biochemical marker with presence INCREASED, with an explicit note that HPO has no term for it and no misleading substitute was bound; PMID:37979702 added as a third diagnosis entry (serum biomarkers plus double-negative T cell phenotyping identify FADD cases missed by exome sequencing, three of four ALPS-U patients with normal FAS expression carrying heterozygous FADD mutations with somatic loss of heterozygosity); PMID:27584790 added as a second animal model (Tie2-cre endothelial Fadd deletion, RIPK3-mediated embryonic lethality with cardiovascular defects) linked to Loss of Fas-Independent FADD Functions at fidelity LOW with the translational limits stated, so it stands as a candidate route to the human cardiac malformation without asserting one.

    Validation: just validate (80/80 snippets verified against cached references), just validate-terms, just validate-disorders (the batched pre-PR sweep CI runs), pytest tests/test_data.py -k FADD (16 passed), and all six ungated CI gates plus the two advisory ones (check-snippet-boundaries, check-not4curation) - all clean. Global compliance 96.5 percent, up from 96.1.

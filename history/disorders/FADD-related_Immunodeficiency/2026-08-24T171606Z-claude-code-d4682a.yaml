  summary: 'Correction: bind diagnosis_term on two diagnosis entries (PR #9392)'
  details: |
    Correcting a claim made in the preceding record's PR comment. That comment declined the reviewer's optional suggestion of NCIT terms on the diagnosis entries on the grounds that DiagnosticProcedure has no term slot. That was wrong: the Diagnosis class carries diagnosis_term, ranged on TreatmentDescriptor and bound to NCIT under Clinical Intervention or Procedure (NCIT:C25218).

    Bound two of the three entries: 'Sequencing of sorted double-negative T cells' to NCIT:C153598 DNA Sequencing, which is what the cited method section describes; and 'Biomarker panel with double-negative T cell phenotyping' to NCIT:C113003 Immunological Flow Cytometry.

    The third, 'Fas-mediated apoptosis functional assay', is deliberately left unbound and a notes line records why: NCIT has no term for a functional apoptosis assay (searching it returns apoptosis as a biological process, apoptosis markers, and apoptosis-regulating proteins, but no diagnostic procedure), and the cited source does not state the assay platform, so binding a generic flow-cytometry term would assert a method the reference does not report. This follows the term-precision rule that no term beats a misleading or too-general one.

    Validation: just validate (80/80 snippets), just validate-terms, pytest -k FADD (16 passed), all six ungated CI gates plus check-not4curation and check-term-cache-integrity - clean. Cache diff is one added row, NCIT:C153598. Global compliance 96.6 percent.

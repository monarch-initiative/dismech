  summary: 'Wire phenotypes into the pathograph (PR #9392 approval follow-up)'
  details: |
    Addresses the one open suggestion from the approving re-review of PR #9392: phenotype causal connectivity was 0 of 14, because no pathophysiology node had a downstream edge to any phenotype.

    Added ten downstream edges, each with a causal_link_type and its own evidence, all drawn from references already cited in this entry - no new reference was fetched.

    Failure of Activation-Induced Lymphocyte Apoptosis now reaches the four ALPS-panel phenotypes: increased double-negative T cell number (DIRECT), and interleukin 10, vitamin B12 and lymphadenopathy. The three cytokine and biomarker edges are typed INDIRECT_UNKNOWN_INTERMEDIATES and evidenced PARTIAL on purpose - the panel is measured together and interpreted together, but no step between the failure of lymphocyte deletion and the individual analyte rise has been demonstrated in FADD deficiency, and the quoted sentence establishes co-occurrence rather than mechanism.

    Functional Hyposplenism now reaches Howell-Jolly bodies, which is the edge that makes the entry's handling of the missing HPO term coherent: the node is prose because HPO has no term for it, and the phenotype that carries the binding is now visibly its consequence.

    Recurrent Severe Infection reaches the bacterial and viral phenotypes as two separate edges rather than one, because the founding report attributes them to different upstream arms - hyposplenism and impaired interferon immunity respectively.

    Recurrent Febrile Encephalopathic Crises reaches encephalopathy and status epilepticus (both DIRECT) and cerebral atrophy (INDIRECT_UNKNOWN_INTERMEDIATES, PARTIAL) - the atrophy edge is hedged because the causal ordering is inference; the source establishes the feature, not that it follows the crises.

    Connectivity is now 10 of 14. The four left unwired - abnormal heart morphology, hepatic failure, cystoid macular oedema, tractional retinal detachment - are left unwired deliberately and the notes say so. No cited source places any of them downstream of a node in this pathograph. For the cardiac phenotype the nearest candidate mechanism is the Tie2-cre endothelial mouse, whose model link is held at fidelity LOW with the causal claim about human cardiac malformation explicitly refused; drawing a pathograph edge would assert what that link declines to assert. The ocular findings rest on one patient and the hepatopathy has no proposed mechanism in the cited literature.

    Validation: just validate (90/90 snippets verified, up from 80), just validate-terms, just validate-disorders, pytest -k FADD (16 passed), all six ungated CI gates plus check-snippet-boundaries and check-not4curation - clean. No cache changes. Connectivity 0/14 to 10/14.

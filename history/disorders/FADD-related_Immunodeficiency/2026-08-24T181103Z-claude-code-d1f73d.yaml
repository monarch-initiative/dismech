  summary: 'Route the infection edges onto their own arms (PR #9392 optional findings)'
  details: |
    Applies both optional findings from the approving re-review of the pathograph wiring.

    Finding A - the two-arm structure was collapsed in the topology. The previous commit hung both Recurrent bacterial infections and Recurrent viral infections off the aggregate Recurrent Severe Infection node, which receives from both arms. That meant the graph asserted that both arms cause both infection types, while the edge descriptions said otherwise - the pairing survived only in prose. Since the two-arm split is the substantive claim this entry exists to make, the topology has to carry it.

    The bacterial edge now runs from Functional Hyposplenism and the viral edge from Impaired Interferon Immunity, matching the founding report's own sentence, which assigns each susceptibility to a different upstream lesion in one breath. The evidence items are unchanged - they were already arm-specific quotes, which is what made the mismatch visible. Recurrent Severe Infection is retained as the convergence node feeding the febrile crises. Connectivity is unchanged at 10 of 14; this is a fidelity fix, not a coverage one.

    Finding B - the hyposplenism note enumerated the two rejected HPO candidates (HP:0001746 Asplenia, anatomical absence; HP:0001971 Hypersplenism, the clinical opposite) but not their parent. HP:0025409 Abnormal spleen physiology was verified independently with OAK: it exists, and Hypersplenism is its only descendant. It is the one spleen-function term that is neither inverted nor anatomical, so it belongs in the record - but it is passed over rather than bound, because a term whose sole descendant is the inverted one carries almost no information beyond the prose, and binding a near-vacuous parent next to the specific finding already curated (Howell-Jolly bodies, HP:0032550) would add noise rather than precision. The note now says so, which completes the search a later curator would otherwise have to redo.

    Validation: just validate (90/90 snippets verified, unchanged), just validate-terms, just validate-disorders, pytest -k FADD (16 passed), all six ungated CI gates plus check-snippet-boundaries and check-not4curation - clean. No cache changes; no new references. Global compliance 96.9 percent, unchanged.

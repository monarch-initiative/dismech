  summary: 'Create: FADD-Related Immunodeficiency'
  details: |
    De-novo creation of the FADD-related immunodeficiency entry, MONDO:0013408,
    claimed via issue #9388.

    Deep research: `just research-disorder claude_code`. NEC preflight PASS (FADD
    dominant at 78 mentions; report OMIM 613759 matches the MONDO xref). All 9
    references resolved and needs_review was not set, though only 6 of 9 were
    scored on topic (the remainder undecided rather than off topic).

    The report was nonetheless not trusted for terms or for factual claims, and
    both reservations paid off.

    Seven of its suggested ontology terms were wrong on checking against OLS4,
    several of them dangerously: HP:0001971 was offered for "functional abnormality
    of the spleen" but is Hypersplenism, the clinical opposite of the hyposplenism
    this disease actually has; HP:0031913 was offered for Howell-Jolly bodies but is
    Rhombencephalosynapsis; HP:0011146 was offered for encephalopathy but is
    Dialeptic seizure; HP:0040218 was offered for double-negative T lymphocytosis
    but is Reduced total natural killer cell count; HP:0040214 was offered for
    elevated vitamin B12 but is Abnormal circulating insulin concentration;
    HP:0025580 was offered for vitreoretinopathy but is Abnormal right atrium
    morphology; HP:0025406 was offered for isohemagglutinins but is Asthenia. The
    correct terms were substituted (HP:0032550, HP:0001298, HP:0002851, HP:6000016).

    The report also asserted that "no somatic FADD variants have been implicated".
    That is contradicted by PMID:37793571, which reports homozygous FADD mutations
    arising by uniparental disomy in the double-negative T cells of four unrelated
    patients carrying a germline monoallelic mutation inherited from a healthy
    parent. The somatic second-hit route is curated in the genetic section and given
    its own diagnosis entry, because sequencing peripheral blood can miss it.

    Content: 9-node pathograph deliberately built as two parallel arms out of the
    trigger, following the founding study's own framing - a Fas-dependent arm
    (impaired DISC assembly, failure of activation-induced lymphocyte apoptosis,
    ALPS-like biomarkers) and a Fas-independent arm (functional hyposplenism to
    bacterial infection, impaired interferon immunity to viral infection), converging
    on recurrent severe infection and the febrile encephalopathic crises. 14
    phenotypes, genetic, prevalence, progression, 2 diagnosis entries, an ALPS
    differential, the conditional Fadd knockout mouse, and 2 discussions.

    No `treatments:` block was curated. No FADD-specific therapy has been evaluated
    in any series; asserting supportive management as curated treatments would
    attach clinical convention to an evidence base that does not exist for this
    disorder. The decision is recorded in notes.

    Functional hyposplenism has no HP term, and the nearest-sounding candidate is
    its clinical opposite, so the state is described in prose and the binding is
    carried by Howell-Jolly bodies. This follows the review skill's rule that no
    term beats a misleading one.

    Discussions: a HUMAN_MODEL_MISMATCH on the necroptosis arm - mouse epithelial
    Fadd deletion causes MLKL-dependent necroptosis and colitis, which human
    patients do not have - with two competing explanations (hypomorphic human
    alleles versus a genuine species difference) and an experiment that would
    separate them; and a KNOWLEDGE_GAP on why febrile infection precipitates the
    encephalopathic crises, which bears on whether immunomodulation is rational.

    Curation corrections during the run: a title-quoting snippet for PMID:32350755
    was replaced with a real content quote once the cached PDF was read; a snippet
    broken by a stripped `[1]` citation marker was re-cut; and a four-word snippet
    was extended past the length gate. PMID:37199216 caches as content_type
    "unavailable" with no abstract, so it is carried as a top-level reference
    pointer only and is never used as an evidence source.

    Validation run and read: `just validate` (schema, terms, 58/58 snippets
    verified); the six ungated CI gates all clean; `just check-snippet-boundaries`
    and `just check-not4curation` clean; `just validate-disorders` over the changed
    file. Weighted compliance 96.1%.

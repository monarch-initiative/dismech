  summary: Review MYSM1 clinical spectrum and context-specific mechanisms using primary
    full text
  details: |
    Reviewed the complete prior entry and matching research report against cached primary literature, including recovered full accepted text for PMID:28115216, newly retrieved full articles, the ClinGen assertion, IUIS classification and a clearly identified 2026 preprint. Separated ribosomal-protein expression, translation, progenitor apoptosis, HSC quiescence and ferroptosis; corrected unsupported H2AK119 promoter causality, uniform HSC exhaustion, complete somatic correction and inferred malignant selection. Added neural/Id4 and GFI1 mechanisms with model limitations, missing clinical phenotypes, reported treatments without inferred efficacy, and linked animal and cellular models. Replaced unsupported current patient counts and frequencies with dated overlapping case ascertainment. Audited phenotypes, mechanisms, genetics, diagnosis, treatments, biomarkers, subtypes, ontology mappings, evidence titles and source attribution. Online GeneReviews check found no disease-specific chapter; a live MYSM1 clinical-trial search returned no records. Founding Blood and adult/transplant-caution letters remain retrieval gaps; their titles were not used to infer findings. The canonical ClinGen URL supplies the definitive classification because the fetcher does not support direct CGGV caching. No source cache was created or edited by hand. All 149 evidence quotations and 162 titles validate, with boundary, term and schema checks passing.

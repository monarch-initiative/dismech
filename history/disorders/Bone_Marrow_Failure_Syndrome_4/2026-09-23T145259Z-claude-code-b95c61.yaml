  summary: 'Create: Bone_Marrow_Failure_Syndrome_4'
  details: |
    Created the BMFS4 / MYSM1 deficiency entry (MONDO:0020856, OMIM 618116) from primary literature.

    Lump/split: MONDO carries a second class for the same disease, MONDO:0033683 (imported from Orphanet ORPHA:508542, "congenital progressive bone marrow failure-B-cell immunodeficiency-skeletal dysplasia syndrome", synonym MYSM1 deficiency). The Orphanet record maps ORPHA:508542 Exact to both OMIM:618116 and MONDO:0033683, so the two MONDO classes were lumped into this one entry, with MONDO:0033683 recorded under mappings.mondo_mappings as skos:exactMatch. No subtypes. This apparent MONDO duplicate is worth raising upstream.

    Deep research: exactly one run, `just dr_fallback='--fallback' research-disorder falcon Bone_Marrow_Failure_Syndrome_4`. Falcon returned HTTP 402 (account out of credits); the fallback produced an openscientist report. That report was about the wrong disease: `just preflight-dr` returned FAIL (MYSM1 mentioned 0 times, MECOM 42 times; report OMIM 165215 vs MONDO OMIM 618116). The report described MECOM-associated syndrome / radioulnar synostosis with amegakaryocytic thrombocytopenia, calling it BMFS4. Per the preflight rule it was discarded in full and not committed; nothing in the entry comes from it. No second deep-research run was made.

    Content: 12 pathophysiology nodes from biallelic MYSM1 loss of function through loss of H2A K119 deubiquitinase activity, reduced ribosomal-protein gene expression and protein synthesis in HSCs, p53 activation (mouse genetics), ferroptosis of human HSCs, HSC exhaustion, early B-cell block, impaired NK maturation, prolonged DNA damage response signalling, p53-mediated developmental apoptosis (mouse), somatic genetic rescue by reversion in an HSC (one patient, stable 12 years), and clonal evolution to MDS/AML (2025 Saudi series). Model-organism evidence is graded MODEL_ORGANISM and kept distinct from human evidence in node descriptions. 27 phenotypes (no frequency bands; about a dozen published patients), AR inheritance including one paternal UPD1 case, HSCT/transfusion/antibiotic-prophylaxis treatments, newborn SCID screening, exome sequencing and marrow surveillance as diagnostics, DBA and Fanconi anaemia differentials, a KNOWLEDGE_GAP on myeloid risk and a HUMAN_MODEL_MISMATCH on mouse thrombocytosis versus human thrombocytopenia.

    Structured sources: ORPHA:508542 cached via the structured-source rebuild and cited for Orphanet-only features. No GeneReviews chapter (`just check-genereviews --online`: NO_CHAPTER). No ClinGen validity assertion found. IUIS: MYSM1 not found in the cached text of PMID:35748970, PMID:41608113 or PMID:41608114, but those caches lack the tables, so iuis_category was left unset.

    Gaps: the founding Alsultan 2013 Blood letter (PMID:24288411) has no abstract and carries no quoted evidence. Rhizomelic arm shortening (PMID:32641579) is not curated as a phenotype because the cached text hyphenates the word across a line break. Orphanet-only features (eczema, hearing loss) lack a quotable primary source. Cataract, facial dysmorphism, polydactyly, choanal atresia, panniculitis and elevated eADA are left causally unconnected because no source links them to a mechanism node.

    Validation: just validate, validate-terms, count-verified-snippets (106/106), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-reference-titles and validate-disorders all pass.

  summary: Add claude_code deep-research report; minor evidence additions
  details: |
    Added the deep-research report that now backs this entry: research/Bone_Marrow_Failure_Syndrome_4-deep-research-claude_code.md with its .citations.md. It was produced by `just dr_fallback='--fallback-provider claude_code' research-disorder falcon Bone_Marrow_Failure_Syndrome_4`; falcon returned HTTP 402 (out of credits) and claude_code produced the report, as recorded in its frontmatter (requested_provider falcon, fell_back true). The run's inline term validation timed out against OLS, so both validation sections were added afterwards with `just validate-research-reference` and `just validate-research-terms`. Reference validation: 21/21 references resolved, 0 unresolved, 1/1 quoted claim found, 15 on topic, 0 off topic. Term validation: 59 terms, 0 unresolved, 3 obsolete GO terms (GO:0035522, GO:0016578, GO:0006977), 3 named as a different term (HP:0002846 offered for a B-cell count where HPO says Abnormal B cell morphology; the other two are parsing artefacts on MONDO:0020856 and HP:0000518), and HP:0000268 flagged for review because the report calls it trigonocephaly where HPO says dolichocephaly; none of these were bound. `just preflight-dr ... MONDO:0020856` returned PASS (MYSM1 mentioned 72 times; report OMIM 618116, plus 616738 only in the report's own note that MECOM-related RUSAT2 is a different disease).

    Why the earlier report was discarded: the first run (falcon -> openscientist fallback) produced a report about MECOM-associated syndrome under the BMFS4 name; preflight-dr returned FAIL (MYSM1 0 mentions, MECOM 42, OMIM 165215), so it was not committed, as recorded in the CREATE record.

    The report was used as a lead only. Two changes resulted, each checked against the cached primary source: an evidence item and description sentence on chronic GVHD of the eyes and lungs after haploidentical HSCT (PMID:40535318, exact snippet), and a notes sentence recording two MYSM1 letters without abstracts (PMID:38129711, an adult patient; PMID:35902396, a transplant report) that were not curated because their content cannot be quoted. The report's other leads were not adopted: trigonocephaly, gingival hyperplasia, delayed dentition and cardiac failure had no primary source in the cache, and its Pax5 B-lineage claim misreads PMID:26348977, which concerns plasma-cell differentiation.

    Validation after the change: validate, validate-terms, count-verified-snippets (107/107), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-reference-titles and validate-disorders all pass.

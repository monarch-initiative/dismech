  summary: 'Create: Usmani-Riazuddin Syndrome, Autosomal Recessive (MONDO:0859196)'
  details: |
    De novo curation of USRISR (MONDO:0859196), claimed in #12504. The stub was split out of #12186 specifically so this concept stayed visibly uncurated, and it asked for the entry_type to be settled first.

    entry_type decision: DISEASE. GROUPING is ruled out on definition - a dismech Grouping is a union over existing diseases or subtypes, and USRISR is one OMIM entity with two alleles in two families. A merge with the dominant sibling into one umbrella entry remains live and is recorded as an open discussion rather than taken: MONDO and OMIM both separate them, the reported molecular lesions differ in kind rather than degree, and a merge would need a new umbrella MONDO term or a mappings anchor rather than reuse of a child term.

    The mechanistic separation from the dominant form is the point of the entry. PMID:34102099 reports that the recessively inherited missense variants show no apparent impact on AP1-gamma-1's interaction with the other AP-1 subunits and instead affect the endosome recycling pathway. The dominant allele classes include frameshift, splice-site and whole-gene deletion, so that form is reachable by reduced dosage; a recessive missense genotype is not.

    Evidence concentration is recorded as a limitation: almost every claim traces to PMID:34102099, the only study with functional work on the recessive alleles specifically.

    Zebrafish model recorded as PARTIALLY_RECAPITULATES with two typed divergences (PROXY_QUANTITY, SPECIES_MISMATCH) rather than a clean model: the assay is rescue of a null by mutant mRNA, not the human biallelic-missense state, and its readout is embryonic lethality, not the human phenotype.

    Tooling gap encountered and reported, not worked around. The founding paper names both recessive alleles in one sentence with HGVS protein changes in square brackets; linkml-reference-validator strips bracketed spans from the snippet but not the cached text, so that sentence cannot be quoted. Recorded on dismech#10192 with the instance; the two affected evidence items quote neighbouring sentences and say so in their explanations.

    Validation: just validate, just validate-terms, just count-verified-snippets (13/13), check-duplicate-keys, check-entity-refs, check-causal-targets, check-genereviews (NO_CHAPTER).

    Review round 1 (PR #12511). Four phenotypes added - delayed speech and language
    development, hypotonia, spasticity, aggressive behaviour - from PMID:41226632's
    introduction, graded quote_role BACKGROUND. The earlier notes claim that no cached
    reference stated them was false, and the reviewer was right to call it: the paper
    was already in this entry's references block. Spasticity is quoted from the source's
    own "variably associated" clause rather than the common-signs clause, so the
    distinction the sentence draws is preserved.

    Also in this round: GO:0006457 modifier corrected from DECREASED to ABNORMAL, since
    the source describes altered folding rather than reduced folding; a diagnosis block
    added covering exome/genome sequencing and the copy-number route (PMID:38840441,
    newly cited); and the notes paragraph rewritten so the surviving gap is stated
    accurately as the missing per-inheritance-mode FREQUENCIES rather than the missing
    phenotypes.

    Review round 2 (PR #12511). Both remaining items taken.

    treatments: added - antiseizure medication, developmental and rehabilitative
    therapy, behavioural management - each with target_phenotypes pointing at
    phenotypes round 2 had just added, and each built from a snippet already verified
    in this file. My round 1 argument for leaving the section empty was that any row
    would be evidence-free; the reviewer showed the sibling dominant entry builds the
    same three rows from PMID:34102099 and PMID:41226632, both of which this entry
    already cites. The rows establish the treatment TARGET, which the sources do state,
    and say explicitly that no agent choice or response is reported.

    diagnosis_term bound on both diagnosis records: NCIT:C101295 Whole Exome Sequencing
    and NCIT:C101294 Whole Genome Sequencing, both verified in cache/ncit/terms.csv. The
    reviewer's warning about the neighbouring NCIT:C101293 Next Generation Sequencing is
    the case CLAUDE.md cites as a fabricated-CURIE example, and was heeded.


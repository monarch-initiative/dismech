  summary: 'Create: Autosomal Recessive Spondylometaphyseal Dysplasia, Megarbane Type'
  details: |
    De novo curation of MONDO:0013223 (PAM16/MAGMAS), decided as entry_type DISEASE. MONDO links exactly one disease term to HGNC:29679, verified with OAK, so there is no second PAM16 entity to separate; the p.Gln74Pro patient is curated as a second allele in an allelic series rather than as a separate entry, on the strength of two reviews that describe the patient as having the same disease with a milder course. A PubMed and Europe PMC search for a PAM16-related spastic paraplegia or neurological entity returned nothing. Pathograph is six nodes: p.Asn76Asp destabilisation of the MAGMAS J-like domain, impaired TIM23/PAM matrix preprotein import, mitochondrial fragmentation and cell death, then a skeletal branch through the growth-plate hypertrophic zone and primary spongiosa and two lethal branches, myocardial energetic failure and restrictive thoracic insufficiency, which is how the two families died differently on one founder allele. Yeast complementation curated under experimental_models with two readouts, the Drosophila blp hypomorph under animal_models with PARTIALLY_RECAPITULATES and LOW fidelity. A ROS mechanistic_hypothesis is recorded as EMERGING because all supporting work is in fly. Four knowledge gaps recorded, including a HUMAN_MODEL_MISMATCH between the yeast protein destabilisation and the reported absence of reduced steady-state PAM16 in patients. Two of the five published patients are described only in sources cached as content_type unavailable (PMID:27354339, PMID:41369754); both are listed under references with that limitation stated and neither is cited for a snippet. Validated: just validate exit 0, validate-terms exit 0, count-verified-snippets 68/68, validate-disorders exit 0, check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-folded-hyphens all exit 0.

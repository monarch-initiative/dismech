  summary: 'Create: GRIN2B-Related Developmental and Epileptic Encephalopathy (MONDO:0014505)'
  details: |
    Created new Mendelian entry for GRIN2B-related DEE (DEE-27). Unbundled pathophysiology with a gain-of-function vs loss-of-function fork (GRIN2B variant -> NMDAR GoF or LoF -> dysregulated NMDAR signaling -> impaired synaptic development and cortical E/I imbalance), the E/I node conforming to epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance. Includes a KNOWLEDGE_GAP discussion on whether variant functional class (GoF/LoF) predicts phenotype and precision-therapy response. Deep research via just research-disorder claude_code. Evidence from GeneReviews (PMID:29851452), Platzer 2017 functional/treatment paper (PMID:28377535), and Endele 2010 founding paper (PMID:20890276). Precision therapies wired to the fork via target_mechanisms: memantine (GoF, INHIBITS), L-serine (LoF, RESTORES; PMID:38380699), plus the radiprodil Phase 3 GRIN trial (NCT07224581). 26 evidence snippets all verified as exact substrings; validation passes; compliance 87.5% weighted.

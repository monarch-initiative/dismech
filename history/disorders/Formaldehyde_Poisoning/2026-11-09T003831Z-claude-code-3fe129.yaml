  details: |
    Added conforms_to inhaled_irritant_airway_injury#Airway Epithelial Junctional Barrier Failure to the 'Nasal and upper airway epithelial cytotoxicity' node, as the first conformer of the module created for dismech#16877. The node is a genuine instance: irritant-threshold epithelial killing confined to the nasal cavity and proximal trachea, with rhinitis, dysplasia and squamous metaplasia. No other change to the entry, and the node carried no previous conforms_to. check-conformance-content reports the link as process_absent, because the node binds GO:0006915 apoptotic process where the module node binds GO:0070830 bicellular tight junction assembly; that is the cell-death route to barrier failure which the module notes allow, not a mis-picked anchor.

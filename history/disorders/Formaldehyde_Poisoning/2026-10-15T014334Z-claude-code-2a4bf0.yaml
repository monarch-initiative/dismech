  details: |
    Bound LOINC:2292-1 (Formate, Serum or Plasma) to the existing Serum formate biochemical marker, and LOINC:33037-3 (Anion gap, calculated), LOINC:33264-3 (Osmol gap of Serum or Plasma), and LOINC:5693-7 (Methanol, Serum or Plasma) as measurements on the Acid-base and osmolal gap workup diagnosis row, which explicitly names all three as tests to obtain alongside the acid-base panel. The formate, anion-gap and osmolal-gap codes are the same ones already seeded on loinc-i-batch1 for Methanol_Poisoning, for the shared one-carbon-alcohol toxicity mechanism -- an expected cross-branch overlap, reported here before either branch merges. The serum methanol code is new to this campaign: Methanol_Poisoning's own batch-1 PR did not bind a methanol identity code, only its downstream metabolite formate, so this may be a gap worth revisiting there.

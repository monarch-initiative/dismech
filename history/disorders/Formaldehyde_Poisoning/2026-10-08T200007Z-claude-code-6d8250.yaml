  details: |
    Added a paragraph to the notes of the Formate accumulation and high anion gap metabolic acidosis pathophysiology node, at the reviewer's suggestion on PR #13724.

    The node bundles three claims: formate accumulation, the anion-gap acidosis, and cytochrome c oxidase inhibition. Only the last is what xenobiotic_oxidative_phosphorylation_blockade begins with, so the conformance declared on this node in that PR rests on the single claim the node's pre-existing notes already flag as carried over from methanol chemistry with no formaldehyde-specific publication behind it.

    The new paragraph states that explicitly, tells the reader to scope the conformance to the oxidase binding and not to the acidosis, and cites dismech#13726 where the node split is tracked. Without it the next reader has to reconstruct the reasoning from a PR thread.

    No other content was changed; no evidence was added, removed, or regraded.

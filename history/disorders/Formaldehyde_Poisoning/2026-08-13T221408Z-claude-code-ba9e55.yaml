  details: |
    Created kb/disorders/Formaldehyde_Poisoning.yaml (MONDO:0023176) de novo. Deep research: claude_code provider (just research-disorder claude_code Formaldehyde_Poisoning), report committed at research/Formaldehyde_Poisoning-deep-research-claude_code.md; its Reference Validation section reports 20/20 references resolved, 0 unresolved. NEC preflight (just preflight-dr against MONDO:0023176) returned SKIP because MONDO records no causal gene for a chemical poisoning; the manual OMIM/synonym fallback was applied and cleared - the report's top gene mentions (ALDH2, ADH5) belong to its clearance-genetics section, and the OMIM it cites (619151) is AMeD syndrome, which the report itself flags as a separate entity and which this entry curates only as a differential. Scope: this entry covers the EXPOSURE disease. AMeD syndrome (inherited endogenous formaldehyde clearance failure) is deliberately NOT curated here; its phenotypes are excluded and it appears only under differential_diagnoses, while ADH5/ALDH2/FANCD2 are recorded as susceptibility/modifier loci. Pathograph: 17 nodes across four arms (portal-of-entry delivery, corrosive protein fixation, systemic formate acidosis, genotoxic crosslinking) with biological_scale tags; conforms_to fibrotic_response#Architectural Distortion and Organ Dysfunction (stricture arm) and genome_instability_mutation#Failure of DNA Damage Surveillance and Repair (crosslink arm). Contested claims are curated as competing mechanistic_hypotheses rather than asserted: portal_of_entry_genotoxicity (CANONICAL) vs systemic_haematopoietic_genotoxicity (ALTERNATIVE) for the IARC leukaemia endpoint, plus intravascular_blood_fixation (EMERGING) for a single forensic case's proposed mechanism of death. Conflicting cohorts are both retained with opposite supports tags (PMID:23788167 SUPPORT vs PMID:24714728 REFUTE for nasopharyngeal carcinoma), and the formaldehyde-asthma association carries a REFUTE item. Five discussions: KNOWLEDGE_GAP on the leukaemia route, HUMAN_MODEL_MISMATCH on rodent-vs-human nasal dosimetry, EMERGING_HYPOTHESIS on blood fixation, KNOWLEDGE_GAP on ALDH2 rs671 exposure interaction, OPEN_QUESTION on the folate paradox. Validation run and read: just validate (schema + terms) passed; just count-verified-snippets reported 108/108 verified against cached references; just check-title-snippets passed (no new title-quoting snippets); just check-folded-hyphens passed; just compliance reported 85.0% weighted. Full tests/test_data.py run: 32331 passed, 2 failed - both in Urticaria.yaml and WAPL-Related_Developmental_Disorder.yaml, files not touched by this work, so inherited from main. The slow batched pre-PR sweep (just validate-disorders) is run separately before the PR.

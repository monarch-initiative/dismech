  summary: Conform Formaldehyde_Poisoning to the beta2 agonism module, without asserting
    efficacy
  details: |
    Wires this entry to the new beta2_adrenergic_receptor_agonism module as its second, non-asthma
    conformer, so the module is indication-independent rather than tied to asthma.

    Adds 'Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors' conforming to the module's trigger, with
    no downstream edge, and an ACTIVATES target_mechanisms link from the existing 'Bronchodilator therapy'
    treatment.

    The care needed here is about what is NOT claimed. That treatment carries a note from an earlier curator
    recording that no formaldehyde-specific efficacy publication was identified, so no evidence item was
    attached. That note still holds and is untouched. The link and the node carry receptor-level evidence only
    -- PMID:9817738 establishing that beta2 receptors are on airway smooth muscle -- and both the node
    description and a new review_notes paragraph state explicitly that this says where the agent acts and not
    that it is effective in this poisoning. A target_mechanisms link is a claim about the point of attack, not
    about outcome, and the entry now says so rather than leaving a reader to infer efficacy from the presence
    of a link.


  summary: 'Split the bundled formate node three ways (closes #13726)'
  details: |
    Resolved dismech#13726 by splitting 'Formate accumulation and high anion gap metabolic acidosis', which carried three separable claims, into three nodes. The proposed topology change that would have re-attributed the oxidase inhibition to formaldehyde was examined and REJECTED on the evidence; this is recorded below because the rejection is the substantive finding.

    New structure, replacing one ORGANISM node:
    - 'Formate accumulation' (ORGANISM, GO:0015942) - the systemic anion load.
    - 'Cytochrome c oxidase inhibition' (MOLECULAR, GO:0004129 DECREASED) - carries the module conformance, which previously sat on the bundled node where only one of its three claims was what the module trigger is about.
    - 'High anion gap metabolic acidosis' (ORGANISM) - the acid-base consequence.

    Chain: Systemic absorption and glutathione-dependent oxidation to formate -> Formate accumulation -> {Cytochrome c oxidase inhibition, High anion gap metabolic acidosis} -> Acute circulatory collapse and multiorgan failure.

    Why the formaldehyde attribution was rejected. PMID:26728267 measures dose-dependent inhibition of complex I and complex IV by formaldehyde itself in human neuronal cells, and reports formic acid did not affect viability in the same system. On its face that inverts the attribution this entry records. It does not survive three checks taken together. First, that paper studies formaldehyde as the intermediate generated during methanol poisoning, which is precisely the contrast this entry's own absorption node already flagged in prose: here formaldehyde is the agent being cleared, not the metabolite being made. Second, exogenous formaldehyde does not distribute systemically to a useful extent, and the entry already cites PMID:30701286, which could detect no exogenous formaldehyde DNA adducts at any exposure level tested. Third, cell viability is not oxidase activity; the abstract does not report that formate fails to inhibit the enzyme, only that it did not kill those cells at the concentrations used.

    The refutation was already in the entry. The absorption node's description states that formaldehyde's blood half-life is very short, that the glutathione-dependent route is high-capacity clearance rather than bioactivation, and explicitly notes the contrast with methanol poisoning. That should have been read before the topology change was proposed on the issue; it was not, and the issue comment proposing it has been superseded. The same lesson as the Ethylene_Glycol_Poisoning node notes in #13727.

    What the search did achieve. The node's previous notes recorded that the oxidase claim was carried over from methanol chemistry with no evidence item attached. That gap is now closed, but by the formate route rather than the formaldehyde one: PMID:12216995 states directly that formic acid inhibits cytochrome oxidase, and because the sentence is about the anion rather than about methanol it applies wherever formate accumulates. That citation was available all along in the methanol entry. PMID:26728267 is retained on the oxidase node graded INDIRECT, supporting the fact of respiratory-chain inhibition in this chemistry without measuring the species the node names, with the reasoning in the node's notes.

    Four inbound bare-name targets were repointed, and the split improves three of them. The upstream absorption edge now reaches 'Formate accumulation'. Hemodialysis and folinic acid INHIBITS links point at 'Formate accumulation', which is what they act on: dialysis removes the anion and folinic acid accelerates its folate-dependent oxidation. Sodium bicarbonate MODULATES now points at 'High anion gap metabolic acidosis', which matters because that treatment's own description says it counteracts the acidaemia without removing the formate, so before the split it pointed at a node named for the very thing it does not touch. These are bare-name targets matched verbatim with no error on failure (#9697), so all four moved in the same change.

    A fabricated reference title was caught by the gate and fixed. The first draft of this change wrote reference_title 'Formaldehyde-driven folate metabolism provides one-carbon units for nucleotide synthesis.' for PMID:28813411. The real title is 'Mammals divert endogenous genotoxic formaldehyde into one-carbon metabolism.' The string was composed to describe what the paper is about rather than copied from the cache frontmatter, which is exactly the failure CLAUDE.md documents, and knowing the rule did not prevent it. The reference validator flagged it at similarity 0.40; the replacement was read from the cache programmatically, and all 119 titles in the file were then audited the same way.

    Evidence grading: three items are INDIRECT and the reasons differ. PMID:12216995's accumulation and acidosis sentences are observations made in methanol poisoning that reach this disease through the shared identity of the accumulating anion. PMID:26728267 measured the parent compound rather than the metabolite. PMID:12216995's oxidase sentence is DIRECT, because the claim it asserts is about formate itself.

    Validation: just validate-disorders (119 snippets, 119 titles, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all clean. references_cache/PMID_26728267.md is newly committed with this change.

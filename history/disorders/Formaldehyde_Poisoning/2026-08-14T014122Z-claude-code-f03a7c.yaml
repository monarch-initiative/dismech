  summary: 'Edit: Formaldehyde Poisoning - add diagnosis section and correct evidence_source
    tags'
  details: |
    Two rounds of changes on PR #8443, on top of the CREATE record for this entry.

    Round 1 (self-review, pushed before the reviewer verdict landed): corrected three evidence_source tags on PMID:42101931, a Crit Rev Toxicol review. They had been classified by the paper's overall character rather than by what the quoted sentence reports, which is the rule in CLAUDE.md. The portal-of-entry node went HUMAN_CLINICAL -> OTHER (the sentence is the review's synthesis across human, animal, and mechanistic studies); the nasal epithelial cytotoxicity node went OTHER -> MODEL_ORGANISM (the quoted finding is explicitly from the rat nasal cavity); the regenerative proliferation node went OTHER -> COMPUTATIONAL (the inference comes from dosimetry and BBDR modelling). Each explanation now states why the tag was chosen. No snippets changed.

    Round 2 (response to ai4c-reviewer CHANGES_REQUESTED). The blocking item was a missing diagnosis: section, correctly identified - the deep-research report devotes a section to the diagnostic workup and none of it had been curated. Added three diagnosis entries, all with NCIT terms confirmed reachable from NCIT:C25218 via runoak ancestors: acid-base and osmolal gap workup (NCIT:C217391 Diagnostic Blood Gas Testing), upper GI endoscopy with injury grading (NCIT:C78144 Esophagogastroduodenoscopy), and patch testing for formaldehyde and its releasers (NCIT:C17137 Skin Test). The endoscopy entry cites PMID:31643028 twice - once for the prognostic value of the injury grade, once for the finding that symptoms and oral burns do not predict the depth of gastrointestinal injury, which is the actual argument for scoping - and carries a note that the evidence is from the general corrosive-ingestion literature rather than a formaldehyde-specific series.

    Also accepted three of the reviewer's optional suggestions: located_in UBERON:0001728 nasopharynx on the nasopharyngeal SCC phenotype (HP:0002860 carries histology but not site); NCIT:C70908 Esophageal Dilation replacing the generic NCIT:C15329 Surgical Procedure on the dilation treatment; and PMID:42035787 now cited on the allergic contact dermatitis phenotype.

    Two reviewer suggestions were declined with stated reasons rather than silently skipped, and both are recorded in the entry itself. First, the reviewer suggested PMID:42035787 would let the contact-dermatitis phenotype carry an evidence-backed frequency:. It would not: the 2.88% pooled prevalence has a denominator of dermatitis patients undergoing patch testing, not of formaldehyde-exposed people, so mapping it to a FrequencyEnum band would silently change what the number means. The figure is cited as evidence with its denominator stated, and a notes: on the phenotype explains why no band was set. Second, conformance to tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory Microenvironment was not added: that module node requires an immune infiltrate (TAMs, neutrophils, mast cells) secreting growth and pro-angiogenic factors, and the regenerative-proliferation node here is epithelial replacement proliferation driven by cytotoxicity, with no curated immune-cell content and no evidence gathered for one. Declaring conformance would assert content this entry does not have.

    Validation run and read after these changes: just validate (schema + terms) passed; just validate-disorders (the batched check CI runs) passed with 114/114 snippets verified against cached references, up from 108/108 at the CREATE commit; just check-title-snippets passed; just check-folded-hyphens passed; just compliance now reports 85.6% weighted, up from 85.0%. CI on the prior commit was fully green (test (3.13) pass, claude-review pass) before these changes.

  summary: Conform to xenobiotic_oxidative_phosphorylation_blockade module
  details: |
    Declared conforms_to against the new xenobiotic_oxidative_phosphorylation_blockade module on one pathophysiology node: Formate accumulation and high anion gap metabolic acidosis, to the trigger node.

    Why that node and not a cleaner one: this entry has no standalone cytochrome c oxidase node. It carries the GO:0004129 cytochrome-c oxidase activity DECREASED binding on its formate node, bundled with the acidosis claim, and its own notes state that the oxidase inhibition step is carried over from methanol chemistry with no formaldehyde-specific publication measuring complex IV inhibition. The conformance is therefore against a bundled node, and is recorded as such rather than silently.

    This is an improvement for the entry rather than a workaround: the shared claim its notes flagged as uncited now has an evidenced home at the module trigger node, which is where a disorder-agnostic claim belongs. Splitting the bundled node into separate oxidase and acidosis nodes would be the cleaner fix and is deliberately left out of this PR, which does not otherwise touch entry content.

    No content was changed and no evidence was added or regraded.

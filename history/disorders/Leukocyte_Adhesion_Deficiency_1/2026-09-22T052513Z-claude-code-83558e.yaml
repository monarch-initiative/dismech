  summary: 'Review: connect nine orphan phenotypes (IUIS Table 5)'
  details: |
    Nine of ten phenotypes had no incoming edge. Each attaches to the node that explains it rather than all to one terminal node: CD18 expression to the heterodimer-assembly node it measures, leukocytosis to the tissue-neutropenia-with-blood-neutrophilia node, the pus-free infections and omphalitis to the necrotic-infection node, delayed cord separation and non-healing ulcers to the wound-healing node, the periodontal pair to the bone-loss node, and autoimmune complications to the IL-23/IL-17 node.

    The last one matters: autoimmune complications are drawn from the barrier-site cytokine axis rather than from the adhesion defect directly, which is the distinction the entry's node structure already makes.

  summary: 'Create: Leukocyte Adhesion Deficiency 1 (ITGB2)'
  details: |
    De-novo curation of LAD1 (MONDO:0007293, ITGB2/CD18, AR). No deep-research provider run: the literature set was assembled directly from PubMed E-utilities searches and every reference fetched with just fetch-reference. No GeneReviews chapter exists for leukocyte adhesion deficiency or ITGB2 (PubMed search returned zero hits), so the 2026 international Delphi consensus PMID:42011429 was used as the expert-curated clinical baseline in its place; this is recorded in the entry notes. Nine-node pathophysiology chain curated as a causal chain rather than a bucket list: biallelic ITGB2 LOF (MOLECULAR) -> failed beta-2 integrin heterodimer assembly (MOLECULAR) -> defective neutrophil firm adhesion (CELLULAR) -> failure of transmigration (TISSUE) -> tissue neutropenia with blood neutrophilia (ORGANISM), which branches to pus-free necrotic infection and to the dysregulated IL-23/IL-17 axis -> inflammatory periodontal bone loss; a separate impaired-wound-healing branch hangs off the transmigration node. Every node and most edges carry evidence. The periodontal arm is curated deliberately as immunopathology rather than unpoliced infection, with an INTERPRETATION discussion recording the three observations that refute the infection reading (tissue bacterial load comparable to controls, lymphocytic neutrophil-free infiltrate, progression despite lifelong prophylaxis) and one REFUTE evidence item attached to the antimicrobial treatment recording that prophylaxis does not control it. Two KNOWLEDGE_GAP discussions: moderate-subtype natural history, and gene therapy versus allogeneic HSCT. Severity curated as two has_subtypes entries on the consensus CD18 thresholds (<2 percent severe, 2-30 percent moderate). IUIS classification is phagocyte defect, byte-verified against the LAD1 row of Table 5 in the cached IUIS 2022 update PMID:35748970 (lines 3030-3037), quoted with the PDF-extraction word break intact. No ORPHA reference cited: the Orphadata bulk XML is absent from this checkout so no ORPHA cache file could be generated, and the prevalence record is anchored to the consensus 1-per-million statement instead; recorded in notes. Validation: just validate passed (schema, terms, references); 81/81 snippets verified; validate-terms passed; check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-environmental-evidence, check-reference-titles, check-source-defect-claims all clean; check-snippet-grading initially flagged one divergence on PMID:22134107 within this file, fixed by grading the mutation compendium consistently as OTHER; batched just validate-disorders passed. Stub stubs/Leukocyte_Adhesion_Deficiency_1.yaml deleted; the generic stubs/Leukocyte_Adhesion_Deficiency.yaml left in place.

  summary: 'Genetics pass: 0/3 to 6/6 gene wiring, KRT25 and KRT71 subtypes, MONDO
    corrections'
  details: |
    Genetics pass under the genetics-gap campaign (issue #12200, epic #12189). This entry was the largest wiring gap of the four: 0 of 3 causal genes reached a pathophysiology node and 0 of 6 phenotypes had any causal inbound edge, so the pathograph was three disconnected islands. Both are now 6/6.

    Research first, reconciliation after. The issue's checklist names only KRT74 for MONDO:0020717, which was already curated. Independent research found two further gene-anchored MONDO children of this entry's own disease term that were not curated here: KRT25 (MONDO:0014765, wooly hair autosomal recessive 3) and KRT71 (MONDO:0014390, hypotrichosis 13, whose exact synonym is "hypotrichosis with woolly hair"). Both are now has_subtypes rows with bound terms, gene bindings and evidence. C3ORF52 was added as a gene record with no subtype foreign key, because a MONDO search returns only the HGNC gene node for it; its gene-discovery paper describes the phenotype as localized autosomal recessive hypotrichosis, and the ARWH review that reports the same variants in ARWH patients is what justifies including it here.

    Two MONDO findings recorded in the file rather than acted on silently. The ARWH2 subtype was bound to MONDO:0008686, this entry's own parent term, with a note asserting that no distinct ARWH2 term existed; re-running the descendants query returns MONDO:0011452, which xrefs OMIM:604379, carries RO:0004003 to LIPH, and lists the ARWH2 name as an exact synonym. The binding is corrected and the false note withdrawn. Separately, MONDO:0800312 (ARWH1, the existing binding) and MONDO:0010206 (hypotrichosis 8) appear to be two terms for OMIM:278150: only the latter has the OMIM xref and the LPAR6 gene relationship. That is recorded in the subtype's review_notes and left unresolved rather than rebound, since rebinding would silently change which identifier the subtype claims.

    Genes are wired to the node they act at. LIPH, LPAR6 and C3ORF52 sit on the LPA-signalling node; KRT74, KRT71 and KRT25 sit on the keratin node, which was renamed from "KRT74 Hair-Shaft Keratin Filament Defect" to "Inner Root Sheath Keratin Filament Defect" now that it carries three keratins from both type I and type II. Case fractions added for LIPH and LPAR6 from the Pakistani ARWH series (47.2% / 52.8%) and for LIPH from the Japanese series (98.7%).

    Validation: just validate, validate-terms, count-verified-snippets (42/42), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, validate-disorders.

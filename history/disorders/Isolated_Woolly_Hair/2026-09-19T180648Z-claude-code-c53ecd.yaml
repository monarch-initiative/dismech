  summary: 'Review round: evidence for four downstream edges'
  details: |
    Review round on PR #12302. The reviewer approved with three optional suggestions; all three were taken, one of them touching this entry.

    Four downstream edges added in the first round carried a description but no evidence: Fine Hair and Slow-Growing Hair from the LPA-signalling node, Curly Hair and Abnormal Hair Shaft Morphology from the keratin node. All four now carry evidence with exact quotes.

    The gradings are deliberate rather than uniform. The two LPA-axis edges take the review's "underdeveloped hairs" sentence, quote_role REVIEW_SYNTHESIS, with the Slow-Growing Hair edge additionally taking the case report's statement that woolly hair typically stops growing at a few inches, which supplies the downstream half of that edge. The Curly Hair edge takes the KRT74 paper's phenotype sentence, HUMAN_CLINICAL. The Abnormal Hair Shaft Morphology edge takes the KRT74 filament-disruption result as IN_VITRO and the KRT25 structural prediction as COMPUTATIONAL, since the authors state the latter as a modelling result rather than a measurement.

    Each explanation says which half of the edge its quote supports rather than implying the quote establishes the whole edge. The Fine Hair explanation in particular records that the quoted sentence names the phenotype at the level of "underdeveloped hairs" and does not separately report shaft diameter, which is why the edge is drawn from it rather than from a measurement.


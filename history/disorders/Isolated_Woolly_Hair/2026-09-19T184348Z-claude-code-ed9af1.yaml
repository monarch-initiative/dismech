  summary: 'Second review round: quote_role BACKGROUND on two definitional quotes'
  details: |
    Second review round on PR #12302. Three non-blocking suggestions; all three taken.

    Added quote_role: BACKGROUND to the two definitional woolly-hair quotes: the case report's "Woolly hair (WH) is a hair shaft anomaly characterized by tightly curled hair that typically stops growing at a few inches" and the KRT74 discovery paper's "Autosomal-dominant woolly hair (ADWH) is a rare disorder characterized by tightly curled hair". Both are opening framing sentences restating the established clinical description rather than either paper's own finding.

    Applied to all five occurrences in the file, not only the two added in the previous round. quote_role describes where a sentence sits in its source document's own argument, so like evidence_source it is a property of the quote and the paper rather than of the claim it is being cited for; tagging only the new occurrences would have left the same sentence graded two ways in one file.

    Validation: just validate, count-verified-snippets, check-snippet-grading, validate-disorders.

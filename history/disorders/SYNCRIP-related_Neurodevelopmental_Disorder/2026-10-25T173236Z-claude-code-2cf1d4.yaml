  details: |
    Addressed CHANGES_REQUESTED review on PR #15585. (1) Rebound the mRNA node off GO:0006417 regulation of translation to GO:0008298 intracellular mRNA localization, renamed it 'Dysregulated Neuronal mRNA Localization', and gave it its own evidence (PMID:22493061 background + the neuritic-mRNA knockdown result). (2) Split the origin: 'SYNCRIP Haploinsufficiency' is now the dosage/LoF arm feeding mRNA localization only; a new 'SYNCRIP RRM2 Missense Impairing RNA Binding' node (PARTIAL_LOSS_OF_FUNCTION, PMID:34157790 RRM2 evidence) feeds 'Impaired SYNCRIP Phase Separation', whose 39776340 mutant-protein evidence now sits downstream of the missense lesion rather than of haploinsufficiency. (3) Added GeneReviews-documented phenotypes: Hypertonia (HP:0001276), Feeding difficulties (HP:0011968), Constipation (HP:0002019); plus Widened subarachnoid space (HP:0012704, PMID:34157790). Suggestions taken: renamed the autism node to 'Autism spectrum disorder' to agree with its HP:0000717 binding; split the single Supportive Care treatment into antiseizure Pharmacotherapy (SMALL_MOLECULE, target_mechanisms -> Seizure) and Developmental and supportive care (BEHAVIORAL); added a second mouse-model link (learning/memory -> Intellectual disability, PARTIALLY_RECAPITULATES); regraded the 22493061 background quote to OTHER; added the GeneReviews one-family-transmission quote to the inheritance block. Validated: just validate-disorders passed, 42/42 snippets verified, check-entity-refs / check-causal-targets / check-coarse-phenotypes clean.

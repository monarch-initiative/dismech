  summary: 'Create: SYNCRIP-related Neurodevelopmental Disorder'
  details: |
    De novo creation of SYNCRIP-NDD (MONDO:0800456, gene SYNCRIP hgnc:16918). GeneReviews chapter PMID:42160654 used as the phenotype baseline (tagged in top-level references and mined for phenotypes, including the AD/de-novo inheritance and molecular-testing diagnosis). Primary literature: PMID:34157790 (clinical cohort; truncating-variant haploinsufficiency vs RRM2 missense impaired RNA binding; periventricular nodular heterotopia; myoclonic-atonic epilepsy), PMID:27479843 (trio meta-analysis identifying SYNCRIP as an ID gene), PMID:22493061 (hnRNP-Q neuronal mRNA metabolism / morphogenesis), and PMID:39776340 (Wu et al. 2025, the central developmental mechanism: SYNCRIP phase-separation-dependent stabilization complexes regulate Notch signaling governing radial glial cell temporal fate; pathogenic human mutations weaken phase separation; RGC-specific knockout mouse shows superficial cortical-layer defects and learning/memory impairment). Pathophysiology modeled as two arms off SYNCRIP haploinsufficiency: (1) impaired phase separation -> dysregulated Notch in radial glial cells -> stalled RGC temporal fate progression -> cortical layering defect; (2) dysregulated neuronal mRNA metabolism; both converging on impaired neurodevelopment -> clinical phenotypes. Added an animal_models entry (RGC-specific Syncrip knockout mouse, RECAPITULATES Cortical Layering Defect, limitations: complete knockout vs human heterozygous haploinsufficiency). Deep research requested falcon but it was not configured, so --fallback produced an OpenScientist report (research/SYNCRIP-related_Neurodevelopmental_Disorder-deep-research-openscientist.md; fell_back: true); 17/17 references verified, confabulation 0.0, and `just preflight-dr` PASS (SYNCRIP canonical gene, 52 mentions). Entry fixes in this round followed a fresh-context self red-team (its IMPORTANT finding was the omitted PMID:39776340 mechanism + mouse model, now added; note the report mislabeled CL:0000129 as radial glial cell, so forebrain radial glial cell was bound as CL:0013000 from a fresh OAK lookup). Validated: just validate-disorders passed, 32/32 snippets verified, check-entity-refs / check-causal-targets / check-coarse-phenotypes / check-snippet-grading / model-scale-audit clean.

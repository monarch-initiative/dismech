  summary: Complete auriculocondylar prevalence and differential records
  details: |
    Addressed both independent-review requests together: retained the published rarity band as explicitly background evidence without converting the literature case count into a prevalence denominator, and added the four named craniofacial differential entities from the cited source. Guion-Almeida type is treated with mandibulofacial dysostosis rather than as a fifth independent disease. Added specific nutritional, speech, respiratory, osteotomy and arthroplasty action bindings and a mesenchymal-cell binding for the osteogenic assay. Removed duplicated pooled ear-frequency evidence from the gene-lesion nodes while retaining it on relevant phenotype edges. Broad combined otologic and orthognathic care records retain appropriate action parents. Full URL sources remain where canonical PMID caches cannot supply the full body; their PMID identities and retrieval limits remain documented. All changes are a single consolidated response after reading the current PR thread.

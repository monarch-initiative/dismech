  summary: Review auriculocondylar syndrome mechanisms and clinical evidence
  details: |
    Reviewed the complete entry, matching Falcon research report, all twelve original cited sources at their actual available depth, and recovered primary full texts. Read methods, results, clinical tables and discussion where accessible; the abstract-only limits for PMID23315542 and PMID28328130 and missing figure/supplement coverage are explicit in the bibliography. No dedicated GeneReviews chapter was located.

    Replaced bundled and speculative mechanisms with eighteen atomic nodes. Added primary GNAI3 dominant-negative and PLCB4 signaling experiments, separating nucleotide binding, receptor association, Gq response, PLC activity and DLX expression. Kept EDN1 residual-activity predictions and human developmental mediation explicitly inferred. Separated the HDAC9-TWIST1 duplication from its parallel patient-cell observations; no untested TWIST1-to-migration-to-osteogenesis chain. Four animal and six culture models preserve assay, donor, genotype, species, intervention and rescue limitations.

    Expanded clinical coverage to thirty-one phenotypes, five molecular subtypes, allele-specific inheritance, four diagnostic approaches and ten care records. Removed unsupported frequency bands; retained selected-case and assessed-subset denominators. Distinguished central from obstructive apnea, variable cognitive outcomes, and rare vascular observations of unresolved causality. Care targets reflect actual interventions and case evidence rather than surveillance efficacy.

    Recovered full primary articles through the sanctioned reference fetcher. The accompanying tracked PMC fallback adds public reader/numeric routes and preserves canonical source identity; its focused nineteen-test suite and independent code review passed. All cache files were generated by fetch-reference, and dbGaP accession phs000437 was verified separately. Independent peer review checked the TWIST1 study and its integration.

    Schema, live ontology terms and all 191 exact excerpts passed authoritative validation. Twenty-five additional guards, node-class integrity and dataset verification passed; final publication checks and shared-reference consumer validation are recorded in the PR.

  summary: 'Genetics pass: add the isolated question-mark ears EDN1 subtype row'
  details: |
    Genetics pass for the series-069 row MONDO:0013013 question mark ears, isolated
    (EDN1).

    Row ruling: has_subtypes row, making explicit something the entry already asserted in
    prose. The ARCND3 row's own description said "Dominant EDN1 variants also cause
    isolated question-mark ears", the entry carries "question mark ear syndrome" as a
    synonym, "Question mark ear" is a pathograph phenotype target, and PMID:24268655 -
    already cited here - reports the dominant isolated form. So the row was dispositioned
    in prose naming the gene, which is why a CURIE grep returned nothing. An IQME row now
    binds MONDO:0013013, a direct child of the entry's disease_term, with EDN1
    (hgnc:3176) and autosomal dominant inheritance.

    The row's description states the authors' residual-activity model - heterozygous null
    alleles giving isolated ears, hypomorphic alleles giving the syndrome only when
    homozygous - as a model rather than as an established allele series, because the
    paper offers it as a suggestion. The second evidence item quotes that hedge verbatim
    so the hedge is auditable.

    Anchor audit: disease_term MONDO:0000107 auriculocondylar syndrome is an exact match
    and MONDO:0013013 is one of its children, so adding the row does not stretch the
    anchor. No change.

    Not done, and reported rather than attempted: 8 of 31 phenotypes have a causal inlink
    and 4 of 18 pathophysiology nodes have no outgoing edge. Those four are
    patient-derived-cell observations (TWIST1 and HDAC9 expression, migration,
    osteogenic differentiation) that sit beside the main chain rather than in it, so
    wiring them is a modelling decision about how cell-assay nodes attach, not a
    mechanical fix.


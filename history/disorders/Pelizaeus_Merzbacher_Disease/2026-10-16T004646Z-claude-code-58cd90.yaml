  summary: 'Edit: PMD subtypes and ClinGen validity'
  details: |
    Bound the PLP1 null syndrome subtype to MONDO:0017225 (null syndrome, a MONDO child of the Pelizaeus-Merzbacher spectrum class). Added a spastic paraplegia 2 subtype bound to MONDO:0010733, with GeneReviews (PMID:20301361) and PMID:29478609 evidence; MONDO files SPG2 under leukodystrophy and hereditary spastic paraplegia rather than under the PMD spectrum class, which the subtype description records. Recorded the ClinGen Definitive XL PLP1 assertion as gene_disease_validity (the backfill reported by just list-gene-validity). Validated with just validate, validate-terms and count-verified-snippets (65/65).

  summary: 'Create: Congenital Heart Defects and Skeletal Malformations Syndrome (CHDSKM,
    ABL1)'
  details: |
    De novo curation of CHDSKM MONDO:0060532 / OMIM:617602, caused by heterozygous germline gain-of-function missense variants in ABL1 hgnc:76. Causal gene was established BEFORE deep research from the MONDO structured gene relationship RO:0004003 hgnc:76 plus the OMIM:617602 xref, because the MONDO record has no def text. NEC preflight passed: the Edison/falcon deep-research report mentions ABL1 62 times versus TBX5 5 times, all of the latter inside an explicit scope-exclusion paragraph, and the report asserts the matching MONDO and OMIM ids. Deep research provider: Edison via just research-disorder falcon, 462 s, 23 citations. The DR bibliography was thin - only 3 distinct primary papers - so an independent PubMed sweep added 7 more, of which 6 are cited. Curated 7 pathophysiology nodes chaining autoinhibitory regulatory core disruption to kinase hyperactivity to substrate hyperphosphorylation to cardiac, skeletal, aortic and growth arms; 32 phenotypes with pooled 18-case frequency evidence from PMID:33223528; 3 variant records; 11 treatments including an explicitly investigational ABL-inhibitor entry with teratogenicity caveats and four non-therapeutic surveillance actions; 4 differential diagnoses; and 3 discussions covering the lineage knowledge gap, a HUMAN_MODEL_MISMATCH for the loss-of-function-only mouse models, and the unquantified malignancy risk. A deliberate negative finding is recorded: SMAD2 and SMAD3 phosphorylation were unchanged in the mutant constructs, so no conforms_to link to aortopathy_tgfbeta_dysregulation is declared despite the Marfan-like presentation. A pre-PR red-team review and the automated PR review both ran; their findings (overstated allele clustering, a claim-evidence mismatch on the cardiac-repair treatment, frequency bands sitting on terms narrower than their denominators, a one-sided reading of the TKI source, and several unmodelled spectrum features) were all addressed before merge. Validation after those fixes: just validate passed, just validate-terms passed, just validate-references reported 106 of 106 snippets verified against cached references, and tests/test_data.py passed apart from the pre-existing SETD5 failure tracked in issue 7729. Term validation caught and corrected one wrong MONDO id for van den Ende-Gupta syndrome.

- type: REVIEW
  outcome: changed
  summary: Review EBA full-text evidence, diagnostic specificity and mechanisms
  details: |
    Scope: substantive review of an acquired autoimmune disorder with CREATE and EDIT history but no REVIEW event. Infectious and environmental diseases/poisonings remain excluded from the campaign. Fresh worktree and main were both 093f725c2404daf223b730d6c901167470314dea; fetch confirmed no rebase delta. No open disease/history PR overlap at selection.

    Source consumption: read the complete cached scientific text and all tables of PMID:23956869 (2013 review), PMID:36769788 (2023 review), PMID:37503352 (four cases, including Table 1 and each case narrative), and PMID:38799441 (2024 mouse IFN-gamma study, including methods, results, discussion and tables). Read all original cached abstracts PMID:17380558, 17475881, 22913489 and 25689103, plus PMID:2031664 as diagnostic background. Read the new consensus PMID:29165796 and StatPearls PMID:32119399 abstracts. Read PMID:39006807 abstract, then recovered its full PMC article through just fetch-reference url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11238708/ and read the scientific narrative and aggregate Table 1. The detailed individual-study Table 2 and supplements of the rituximab review were not exhaustively audited. No hand-edited cache files.

    Access limitations: PMID:25689103 remained abstract-only after refetch; the 2018 consensus publisher route returned 403. The PMC rituximab reader URL and StatPearls reader URL returned CAPTCHA pages; these unused caches were stashed. The canonical rituximab PMC URL succeeded. The StatPearls Bookshelf PDF route returned 404; only its verified abstract supports the inherited-EB differential. Do not equate these access attempts with proof that full text is unavailable everywhere.

    Research cross-check: read the substantive narrative and citation appendix of Acquired_Epidermolysis_Bullosa-deep-research-claude_code, including reference and term validation. The report relied heavily on the 2023 review and left several primary-paper links as titles only. Disease identity is acquired anti-COL7 autoimmunity, not inherited COL7A1 deficiency. No phase II-or-later EBA trial identifier was surfaced by that report. Trial identifiers discussed in the 2013 review concern pemphigus or rheumatoid arthritis and were not imported as EBA trials.

    Completeness assessment: (1) Phenotypes adequate after adding pruritus, dysphagia and laryngeal stenosis, removing adult-only onset and unsupported global frequency assignments, and preserving oral involvement as 4/4 in the explicitly selected refractory case series. The 50-65% estimate concerns all mucosal sites and is retained only in that scope. (2) Clinical subtypes adequate: classical/inflammatory presentations can overlap or transition; the historical 83-patient series is not a population estimate. (3) Mechanisms adequate after separating T-cell help, autoantibody production, FcRn persistence, binding, complement, recruitment, neutrophil activation, ROS and protease arms, and tissue separation. Added IFN-gamma mouse amplification; direct adhesion interference is explicitly hypothetical with a hypothesis group. (4) Care adequate: conventional adjuncts, variable IVIG/rituximab responses, case-level infliximab/ustekinumab, immunoadsorption/ECP, specialist mucosal care, and preclinical FcRn/GM-CSF/anakinra/IFN-gamma entries are distinguished. No invented clinical trial or established human efficacy for mouse interventions. (5) Genetics adequate for an acquired disease: HLA susceptibility allele, no fabricated Mendelian penetrance or causal COL7A1 variant. (6) Diagnostics adequate after fixing u-serration/BSLE and floor-binding overlap, documenting seronegative/IgA-only assay limitations, and adding consensus and specialist localization. (7) Central references adequate: cached full text and research leads actively used, with publication titles checked for identifier/topic alignment. (8) Overall consumption adequate; source errors and unsupported extrapolations were not adopted.

    Specific interpretation safeguards: antibodies recognizing different NC1 epitopes did not correlate with clinical subtype in the 69-serum primary study; mouse Fc gamma RIV is not relabeled as a human receptor result. Passive transfer bypasses induction, and the IFN-gamma antibody started one day before induction, so that experiment is not treatment of established disease. Higher C3 staining despite improved mouse lesions is retained in publication findings. In the four-case paper, the overview implies nail involvement in all four while case 2 says nails were unaffected; no 4/4 nail frequency was curated. Some table and narrative follow-up intervals differ; the specific treatment descriptions quote the individual narratives and do not pool these times. The 2023 review's absolute statement that off-treatment remission is impossible conflicts with its own IVIG series and was not adopted. Its erroneous salt concentration and FOAM dye example were also not copied. The historical IBD association predates modern EBA criteria, not modern IBD criteria; the later contrary record-based finding is explicitly attributed to the 2023 discussion rather than presented as a newly audited primary cohort.

    Ontology: OAK local SQLite searches and definitions confirmed new HP, GO and NCIT terms; configured term validation passed. Immunoadsorption is represented by Therapeutic Apheresis with the specific preferred term. Granulocyte oxidase deficiency is an experimental perturbation, not patient EBA inheritance. Process narration moved out of disease notes into this record.

    Validation: authoritative batched schema/ontology/reference validation passes with 114 snippets, zero skipped/unavailable snippets, 126 titles and zero issues. All23 repository QA gates pass after restoring the retained HLA/COL7 molecular-function annotations during node separation (22 initial passes plus a successful targeted rerun of the gene-activity gate). Snippet grading, hypothesis links, history validation, Bookshelf baseline and page rendering pass. The GeneReviews snapshot reports no chapter; StatPearls is tagged and actively cited.

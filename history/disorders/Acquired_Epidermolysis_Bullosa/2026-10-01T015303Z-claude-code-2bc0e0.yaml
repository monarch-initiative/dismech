  summary: 'Create: Acquired Epidermolysis Bullosa (EBA)'
  details: |
    Created the EBA entry (MONDO:0018747), the acquired autoimmune subepidermal blistering disease completing the autoimmune-blistering set with Pemphigus_Foliaceus (desmosomal) and Dermatitis_Herpetiformis (IgA/TG3). Deep research: claude_code provider (report thin, 1 web search), so evidence was sourced independently from PubMed. Causal chain: HLA-DRB1*15:03 susceptibility -> anti-type-VII-collagen IgG response (NC1 domain) -> autoantibody binding at the dermal-epidermal junction (COL7A1 autoantigen, grounded GO:0005201), branching to skin fragility (direct anchoring-fibril impairment, mechanobullous) and to complement + neutrophil recruitment -> neutrophil NADPH-oxidase ROS/protease-mediated dermal-epidermal separation -> subepidermal blister -> phenotypes (blistering, skin fragility, milia, atrophic scars, oral mucosal blisters). has_subtypes Mechanobullous/Inflammatory with subtype FKs. Treatments: corticosteroids, colchicine, dapsone, rituximab, IVIG. Diagnosis: DIF u-serrated, salt-split dermal-floor, anti-COL7 ELISA. Animal model: anti-COL7 passive-transfer mouse (complement + NADPH-oxidase effector steps). Key PMIDs 23956869 (Ludwig review), 36769788 (Perkovic treatment review), 25689103, 22913489, 17475881, 17380558. Validation: validate-disorders clean, 29/29 snippets verified, terms/entity-refs/causal-targets/enum/duplicate-key/coarse-phenotype gates pass, 5/5 phenotypes connected, both pathograph genes grounded. No GeneReviews chapter (complex autoimmune, not Mendelian).

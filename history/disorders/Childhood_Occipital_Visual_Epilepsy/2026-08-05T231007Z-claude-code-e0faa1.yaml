  summary: 'Create: Childhood Occipital Visual Epilepsy'
  details: |
    Created the COVE entry as an eight-node pathograph running from age-dependent occipital cortical hyperexcitability through fixation-dependent gating of occipital discharges and occipital paroxysmal discharge to ictal recruitment of visual cortex, recurrent brief diurnal visual seizures, propagation beyond the occipital lobe, post-ictal headache, and age-dependent remission. Two nodes declare conformance to epilepsy_excitation_inhibition_imbalance. Four discussions are attached: a controversy on whether fixation-off sensitivity is causal or merely a marker, an open question on the migraine boundary, and knowledge gaps on the non-remitting third and on the absent genetic basis. No genetic section is included because no gene is established, and that absence is recorded as a gap rather than filled by borrowing candidates from adjacent syndromes. Deep research was run with the falcon provider and converged on the same two central claims. All 45 snippets were verified against their own fetched caches; schema and term validation pass.

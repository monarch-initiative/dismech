  summary: Review COVE electroclinical mechanisms, diagnostic criteria and treatment
    evidence
  details: |
    Reviewed the complete existing entry and falcon research narrative, citations and executive artifact. Confirmed eligibility on main afca68af41954f88dcd50b27e6c186003102e3b4: CREATE and EDIT history only, no overlapping open PR, noninfectious and non-exposure-defined syndrome. Manual identity review resolved the preflight SKIP: MONDO:0020308, its synonyms and Orphanet:98816 match; no causal gene is recorded. Research-reference checking resolved all five extracted identifiers, but generic GRIN2A and experimental-model literature was not treated as COVE evidence.

    Read all five existing cached abstracts and the relevant introduction, methods, results and discussion of the full FOS paper PMID:19258232. That cohort explicitly excludes idiopathic childhood occipital epilepsies; it cannot supply COVE prevalence or direct seizure-trigger evidence. Regenerated the outcome and clinical-review caches; full text remained unavailable through the fetcher. Obtained the complete open-access ILAE consensus paper from its official PDF URL using the sanctioned fetcher, and mined section 3.3, Table 4 and adjacent differential-diagnosis sections. Cross-checked the current ILAE diagnostic and EEG pages. Replaced the abstract-only duplicate ILAE reference with this full-text source. Fetched and read the primary levetiracetam pilot PMID:19754870; retained its small uncontrolled design and avoided inconsistent EEG percentages in its abstract. No cache was hand-written.

    Phenotypes: corrected unsupported frequency interpretations and added impaired-awareness, hemiclonic and focal-to-bilateral tonic-clonic seizures; directly supported headache frequency and documented coexisting EEG patterns. Subtypes: no established subtypes omitted; related syndromes remain differentials. Mechanisms: separated interictal and ictal activity, limited FOS to a variable EEG phenomenon, qualified inferred visual-network physiology and removed unsupported neuronal-subtype/GO specificity. Treatments/trials: replaced unsupported named-drug superiority with general medication evidence and the syndrome-specific levetiracetam pilot; no verified COVE-specific registered treatment trial surfaced. Genetics: used the full consensus for presumed complex inheritance and absence of a known gene; no adjacent-syndrome gene borrowing. Diagnostics: incorporated mandatory criteria, alerts versus exclusions, MRI, sleep EEG and genetic-testing context. References: every evidence item has a checked title and cache-backed quote; the GeneReviews check found no matching chapter. Overall consumption: addressed the central electroclinical and treatment gaps without inventing molecular models, epidemiological denominators or precision therapies.

    Corrected the interpretation of remission by age 16, prevalence denominator and observational experiment decision criteria. Removed curation-process notes. All eight phenotype nodes have causal inlinks. Final local validation checks are recorded in the PR; independent PR review and merge-queue CI are still required before merge.

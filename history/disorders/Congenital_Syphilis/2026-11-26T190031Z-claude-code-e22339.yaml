  summary: 'Create: Congenital_Syphilis'
  details: |
    New entry for congenital syphilis (MONDO:0005714), promoted out of Syphilis, which described it inline. Promotion axes recorded in notes: vertical transplacental transmission, fetal and neonatal multisystem organ involvement, and distinct first-line therapy (weight-based 10-day neonatal aqueous or procaine penicillin G by CDC neonatal risk scenario, with prevention by maternal screening and benzathine penicillin). Early (MONDO:0000333) and late (MONDO:0005821) congenital syphilis are modelled as progression phases, with a Deliberately lumped review note. Sources were found by direct PubMed search: CDC 2021 STI guidelines (PMID:34292926, full text) for screening, the four neonatal scenarios, regimens and caveats; WHO 2016 global burden model (PMID:30811406); CDC 2022 missed-opportunities report (PMID:37971936); placental and cord pathology series (PMID:12100814, 7628852, 37668986, 39670453); infant case series from China, Italy and South Africa for phenotype frequencies (PMID:20079003, 22760016, 36376519, 31635589); a placental-invasion review (PMID:38201292) for the mechanism; and late-stigmata case reports (PMID:22670010, 23919053). Two claude_code deep-research runs (just research-disorder claude_code Congenital_Syphilis) were both unsuccessful (exit 4: a safety classifier stopped the first, the second could not reach PubMed); both reports were deleted and none is committed. All 139 snippets verified against cached references with count-verified-snippets.

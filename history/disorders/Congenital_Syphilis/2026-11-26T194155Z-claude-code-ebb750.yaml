  details: |
    Addressed ai4c-reviewer review 6079544306. IMPORTANT items: (1) the third claude_code deep-research run succeeded and is committed as research/Congenital_Syphilis-deep-research-claude_code.md plus its citations (confabulation_rate 0.0); preflight-dr returns SKIP because MONDO records no causal gene for an infection, which is expected. From the report's leads I added the Tp0751/pallilysin-LamR endothelial adhesin mechanism to the Transplacental Treponemal Invasion node, cited to the primary source PMID:32238570, and added an endothelial cell type there. (2) Split a new Gummatous Tissue Necrosis node (fed from Fetal Hematogenous Dissemination as INDIRECT_UNKNOWN_INTERMEDIATES) out of Developmental Disruption of Bone and Dentition; Abnormal hard palate morphology now hangs off the gumma node, the developmental node's description no longer claims palatal perforation, and saber shin (Anterior tibial bowing) was moved to the Osteochondritis and Periostitis node with its own evidence. New reference PMID:24570790 for the gumma node. SUGGESTIONS taken: renamed Fetal Anemia and Hydrops to Fetal Anemia; dropped modifier: DECREASED on the peptidoglycan node; changed maternal benzathine penicillin treatment_term from Preventive Intervention to Pharmacotherapy to agree with action_category: THERAPEUTIC; added the CDC 'can be considered' ceftriaxone snippet; promoted the stronger 'failure of development of nasal bones' saddle-nose snippet to phenotype level; added the Chicago cohort (PMID:35493123) quantifying substance use as a risk factor. Merged origin/main. All snippets verified (148/148).

  summary: Review and enrich RET_Fusion_Thyroid_Cancer
  details: |
    Added RET-fusion-specific synonyms, classifications, somatic RET driver in thyroid follicular cells (CL:0002258, variant_origin SOMATIC), NGS/ultrasound/FNA diagnosis, and cleaned DR reference findings. Addressed Round 1 review feedback on PR 17203: unbundled pathophysiology into 7 atomic nodes (RET Fusion and Constitutive Kinase Activation with GO:0004713 protein tyrosine kinase activity -> separate RAS-MAPK Pathway Activation and PI3K-AKT Pathway Activation -> Thyroid Follicular Cell Dedifferentiation -> Sodium/Iodide Symporter Loss and Radioiodine Refractoriness, plus Primary Papillary Thyroid Tumorigenesis -> Locoregional and Distant Metastatic Dissemination); added Ionizing Radiation Exposure (ECTO:7000047, PREDISPOSES / RISK_FACTOR) in environmental backed by DOI:10.3389/pore.2023.1611138; rebound Cervical Lymphadenopathy to HP:0025289; added Distant Metastasis phenotype (18.6%, OCCASIONAL, HP:0002664 with coarse_binding_basis: NO_HPO_TERM); updated MONDO:0005075 mapping_predicate to skos:broadMatch; evidenced all three has_subtypes rows and genetic cohort numbers; added thyroid-specific ARROW 90.9% ORR evidence to Pralsetinib; and split Lenvatinib and Sorafenib into separate treatment rows.

  summary: 'Create: Cytochrome P450 Oxidoreductase Deficiency'
  details: |
    De novo curation of MONDO:0008726 from a claude_code deep-research report, after seven OpenScientist runs produced no report at any available timeout. preflight-dr returned PASS: POR is confirmed canonical at 227 mentions, and the other frequently named genes (CYP17A1, CYP21A2, CYP19A1, CYP51A1, CYP26B1) are the P450 partners POR serves rather than other diseases, while FGFR2 appears as the comparator for the other Antley-Bixler arm. Naming decision: the entry is named Cytochrome P450 Oxidoreductase Deficiency, the GeneReviews chapter title (PMID:20301592) and the name the field uses, with the MONDO label kept as a synonym. MONDO:0008726 is Antley-Bixler-titled but cross-references OMIM:201750, which GeneReviews scopes to the whole PORD spectrum including patients without craniosynostosis, so naming the entry after the skeletal phenotype would have been narrower than the entry covers; the entry-naming skill's scope rule drove this. kb/disorders/Antley-Bixler_Syndrome_FGFR2-Related.yaml curates the complementary autosomal dominant FGFR2 arm and the relationship is stated rather than assumed. The pathograph models the feature that makes this disease unusual: one reductase serves every microsomal P450, so a single defect degrades steroidogenesis, sterol synthesis and retinoic acid catabolism at once, and the degree of loss is partner-specific per allele - which is what makes the chain branch into opposite-direction genital phenotypes by karyotype. Two mechanism branches are genuinely contested and both are curated rather than resolved: 46,XX virilization via the alternative (backdoor) androgen pathway (Reisch PMID:31611378, reply PMID:32576683) against placental CYP19A1 inhibition (Fluck PMID:32576700), and the skeletal phenotype via sterol/Indian hedgehog deficiency against local retinoic acid excess. The retinoic acid branch is marked directness INDIRECT because its genetic evidence is from CYP26B1 (PMID:22019272), not POR. Drug metabolism is deliberately left out of the pathograph: reduced activity is demonstrated in vitro but no human pharmacokinetic study in PORD patients exists. PMID:32576700 is listed in top-level references with its title but carries no evidence snippet, because its cached record is a letter with no abstract body and no exact quote could be taken. Every snippet re-verified against the local reference cache: 23 snippets, 0 issues. Three corrections during the pass: anatomical_structures is not a Pathophysiology slot (the slot is locations); NCIT:C15346 was written from memory for Hormone Replacement Therapy and is actually Vaccination (corrected to NCIT:C15599); and one snippet quoted a paper's title rather than a finding, which validate-references rejected and which was replaced with the abstract's own result sentence. Validated with just validate plus check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-name-collisions, check-snippet-grading, check-title-snippets, check-shared-disease-terms and check-gene-validity.

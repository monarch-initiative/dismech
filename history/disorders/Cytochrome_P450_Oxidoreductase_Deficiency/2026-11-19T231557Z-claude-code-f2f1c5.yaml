  summary: 'Review rounds: Cytochrome P450 Oxidoreductase Deficiency'
  details: |
    Three review rounds on PR 18491, recorded here because the corrections are session narrative and do not belong in the entry's notes. Round 1 and 2: tagged the GeneReviews chapter, added six phenotypes from its Clinical Characteristics section, added four treatment rows from Management plus the prenatal GC/MS and 25% recurrence-risk snippets from Diagnosis and Genetic Counseling, replaced the sterol/hedgehog node's fluconazole-only evidence with PMID:19264869 (POR knockdown lowers Indian hedgehog, cholesterol neutralises it, recombinant Ihh rescues it) while demoting the fluconazole sentence to directness INDIRECT, added deoxycorticosterone-accumulation and gonadotropin-driven follicular-arrest nodes so Hypertension and Ovarian cyst were no longer orphan phenotypes, and pruned 123 cached references the entry does not cite. Round 3 corrected a defect of my own making that is worth recording in full, because the repository documents this exact failure. The maternal virilization phenotype had been bound to HP:0000078 Abnormality of the genital system with coarse_binding_basis NO_HPO_TERM, justified by a note asserting that HPO has no maternal-virilization term on the strength of searching cache/hp/terms.csv. That assertion was false. HP:0008072 Maternal virilization in pregnancy exists and is not obsolete, confirmed against the EBI OLS4 term endpoint. A missing row in cache/hp/terms.csv means only that nothing in kb/ has yet bound the term; the cache is cache-first and is never an authority on absence. CLAUDE.md records this under 'Naming the query does not make the note true; re-running it does', and the false justification was the worse half of the defect because it instructed the next curator not to look. The reviewer's suggested remedy, binding HP:0008072, does not validate either: its hierarchicalAncestors are HP:0002686 Pregnancy history and HP:0032443 Past medical history, so it lies outside HP:0000118 Phenotypic abnormality and just validate-terms rejects it as outside the PhenotypeTerm dynamic enum, exactly as HP:0200067 is rejected in Uterine_Leiomyoma and Ventriculomegaly_and_Arthrogryposis. The row is therefore left ontology-unbound with a note stating only the durable fact: the term exists and the enum will not take it. The underlying gap is upstream of this repository - HPO encodes maternal virilization only as pregnancy history, so a finding in the carrier mother has no home on the phenotype branch. Round 3 also split hydrocephalus out of a row that had grouped it with unrelated ear anomalies, added an imperforate anus row at 10.8% wired from the retinoic acid node, and renamed the urinary row so the anorectal frequency is not recorded twice. Deep research for this entry used the claude_code provider after seven OpenScientist runs produced no report at any available timeout. Validated with just validate (40/40 snippets), test-kb-files, check-snippet-length, check-causal-targets, check-coarse-phenotypes, check-entity-refs, check-name-collisions and check-cache-order.

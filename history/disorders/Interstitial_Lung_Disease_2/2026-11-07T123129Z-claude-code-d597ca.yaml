  summary: 'Create: Interstitial Lung Disease 2'
  details: |
    New entry for SFTPA2-caused interstitial lung disease 2 (MONDO:0800497), modelled on the sibling Interstitial_Lung_Disease_1 (SFTPA1). Deep research used OpenScientist, because the Edison (falcon) provider rejected the session's API key with HTTP 403; the report passed just preflight-dr (SFTPA2 named 52 times, OMIM 178500 agrees with MONDO) and all 20 cited references resolved. The causal chain (CRD missense variant, ER retention and ERAD, unfolded protein response, latent TGF-beta1 secretion, epithelial-to-mesenchymal transition and apoptosis, fibrotic remodeling) is taken from Wang 2009, Maitra 2010 and 2012, and Liu 2020; the fibrosis step is drawn as indirect because no SFTPA2 source measures the mesenchymal steps, and no conforms_to is declared for the same reason. ClinGen Definitive (AD) is copied from the cached CGGV record. Cohort items that pool SFTPA1/SFTPA2 or all surfactant genes say so in their explanations. MONDO's generic IPF synonyms are deliberately not carried. Validated with just validate (62/62 snippets verified), validate-terms, and the offline whole-repo gates.

  summary: 'Create: PFIC'
  details: |
    De-novo curation of progressive familial intrahepatic cholestasis MONDO:0015762, closing issue #7557. Deep research via Edison/FutureHouse falcon; the DR output was used strictly as lead generation - all 19 cited PMIDs were independently fetched with just fetch-reference and all 122 evidence snippets verified against cached text. Five DR-supplied ontology IDs were semantically wrong and were discarded after OAK resolution: HP:0031964, HP:0006744, HP:0001882, GO:0044294, plus all four suggested NCIT intervention terms C15469/C15221/C15274/C15236. GeneReviews baseline PMID:20301474 ATP8B1 Deficiency was fetched, tagged in top-level references and actively mined - its Clinical Characteristics, Management, Surveillance and Agents-to-Avoid content supply 14 evidence items including the ototoxic-agent and oral-contraceptive avoidance treatment. The serum GGT split is modelled mechanistically rather than as a bare label: a dedicated Unbuffered Bile Salt Injury to the Cholangiocyte pathophysiology node explains why loss of biliary phosphatidylcholine in ABCB4 disease exposes the cholangiocyte to free detergent bile salts and releases GPI-anchored GGT, while the hepatocyte-restricted subtypes keep a low or normal GGT; serum GGT also carries a reference_ranges block with two interpretation bands and a READOUT_OF link to that node. The IBAT-inhibitor era is modelled as a therapeutic_vulnerability node named Enterohepatic Bile Acid Recirculation that odevixibat, maralixibat and surgical biliary diversion all target with treatment_effect INHIBITS, including the genotype limit that complete BSEP loss predicts non-response. NEC preflight was performed against MONDO, Orphanet:172 and OMIMPS:211600; the allelic neighbour benign recurrent intrahepatic cholestasis MONDO:0019008 is curated as a structured differential rather than conflated with PFIC. Validation: just validate PASS covering schema, terms and 122 of 122 snippets; just validate-terms PASS; just validate-references PASS; just compliance 87.9 percent weighted; just compliance-connectivity 20 of 20 phenotypes and 9 of 9 causal genes wired.
- type: REVIEW
  outcome: changed
  sections:
  - phenotypes
  - biochemical
  - evidence
  summary: 'Review response: PFIC subtype numbering, MONDO subtype_terms, conjugated bilirubin'
  details: |
    Response to the automated review on PR #7605 (two amber findings, three suggestions; all five actioned). Amber 1: the MYO5B subtype had been named PFIC6, but in the OMIM/MONDO gene series PFIC6 is SLC51A/OSTa (MONDO:0030360) - the very gene this entry deliberately excludes - while MYO5B is PFIC10 (MONDO:0030810). Renamed the subtype to the gene-first MYO5B-related cholestasis, kept the legacy number in display_name, updated both foreign-key references and both prose mentions, and added a notes paragraph documenting the whole PFIC6-to-PFIC10 numbering trap so a future curator meeting PFIC6 in a paper has the disambiguation in the entry. Amber 2: added subtype_term to the three newer gene-first subtypes - MONDO:0030503 USP53/PFIC7, MONDO:0030505 KIF12/PFIC8, MONDO:0030800 ZFYVE19/PFIC9 - after OAK-resolving each ID and cross-checking its gene attribution against the OMIM entry rather than accepting the reviewer table on trust. Suggestions: added the Conjugated hyperbilirubinemia phenotype HP:0002908 wired from Hepatocellular Bile Salt Retention, and a third biochemical record for serum conjugated (direct) bilirubin carrying NCIT:C64481, LOINC:1968-7 and the only reference_ranges block in the entry with a citable evidence item (the greater-than-1 mg/dL consensus cholestasis definition, from newly fetched PMID:32861449); added PEDFIC 2 NCT03659916 as the odevixibat durability trial. A follow-up nit was also fixed: the PEDFIC 2 description originally asserted enrolment, duration and outcome figures that the cached registry record does not contain (they had been taken from the reviewer's own prose - circular sourcing), so the description was softened to what the registry record supports. Declined, deliberately: no USP53-specific sensorineural hearing loss phenotype, because MONDO:0030503's label carries the claim but the cached PMID:33075013 abstract does not mention hearing loss, and attaching an exact-but-irrelevant snippet is precisely the failure mode the reference validator cannot catch; it is recorded in the subtype description as a follow-up instead. Post-fix validation: just validate PASS, just validate-terms PASS, just validate-references PASS with 131 of 131 snippets verified, just compliance 88.3 percent weighted, just compliance-connectivity 21 of 21 phenotypes and 9 of 9 causal genes wired, tests/test_data.py 16125 passed. Review outcome: APPROVED.

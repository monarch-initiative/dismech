  summary: Add PFIC12 (VPS33B) and PFIC13 (PSKH1) subtypes, genetic records and pathograph
    wiring
  details: |
    Picked up the PFIC item deferred by PR #12900 and listed on issue #12931: VPS33B (PFIC12, MONDO:0031040) and PSKH1 (PFIC13, MONDO:0975807) were absent from the entry. Both MONDO terms were read from OLS (parent MONDO:0015762; RO:0004003 genes hgnc:12712 and hgnc:9529, confirmed against rest.genenames.org). VPS33B: subtype row for the hypomorphic, liver-limited form (PMID:31479177), gene added to the apical trafficking node beside MYO5B with BSEP mis-sorting evidence from ARC liver (PMID:20190753, marked INDIRECT because it comes from the null end of the spectrum); ARC syndrome stays in its own entry and the notes paragraph that excluded VPS33B was rewritten. PSKH1: subtype row, a new ciliary mechanism node (PMID:39132680, PMID:42238902) wired to Intrahepatic cholestasis, and a genetic record left at relationship_type UNKNOWN because the discovery paper calls it a candidate gene and no external validity tier exists. Validated with just validate, validate-terms, count-verified-snippets (166/166) and the per-file KB gates.

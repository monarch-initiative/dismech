  details: |
    CI gate check_gene_activity_grounding failed on PR 15962 because VPS33B, newly added to the 'Apical Trafficking Failure of Canalicular Transporters' node, landed on a node with no molecular_functions. Bound GO:0019905 syntaxin binding (modifier DECREASED) on that node, the same binding the Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome entry uses for VPS33B, and added a node evidence item quoting PMID:15052268 (cached) on the Sec1-like domain that regulates SNARE complex formation. The term describes VPS33B only; MYO5B on the same node remains grandfathered in the baseline. Validated with just validate, validate-terms, count-verified-snippets (167/167) and check_gene_activity_grounding against the merge base.

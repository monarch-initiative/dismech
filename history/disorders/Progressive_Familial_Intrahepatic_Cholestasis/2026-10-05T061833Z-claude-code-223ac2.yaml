  summary: Record BARI carrier cross-reactivity on odevixibat and maralixibat
  details: |
    Added the SLC10/OATP cross-reactivity profile of the two IBAT inhibitors this entry curates, from PMID:40998033 (J Lipid Res 2025), which tested all four clinical BARIs against ASBT, NTCP, SOAT and three OATPs in singly-transfected HEK293 cells.

    Three evidence items on Odevixibat and two on Maralixibat, all evidence_source IN_VITRO, all snippets from the abstract so they verify under the --no-full-text gate. The reference cached as full_text_xml; no snippet relies on the full text.

    What the entry now says that it did not: odevixibat and maralixibat inhibit SOAT (SLC10A6) at low micromolar potency and NTCP (SLC10A1) an order of magnitude more weakly, so all three bile-acid-handling SLC10 carriers are in range rather than ASBT alone; both also inhibit OATP1B1/1B3/2B1; and both sustain full ASBT inhibition through washout and 240 min of inhibitor-free incubation, where linerixibat's inhibition is reversible. The description attributes the clinical quietness of that profile to low oral bioavailability and a luminal site of action rather than to ASBT selectivity, which is the cited paper's own framing.

    Not done, deliberately. No claim was added to Hepatitis_B or Hepatitis_D. The paper frames NTCP as the HBV entry receptor and shows BARIs inhibit it, but it tests bile acid and steroid sulfate transport only - no viral entry, pre-S1 binding or infectivity readout - so asserting relevance to HBV/HDV entry would be an inference the source does not make.

    Also corrected one sentence in an existing odevixibat evidence explanation that still argued for the retired supports: PARTIAL grade (#10003 leftover prose); the value itself was already SUPPORT.


  summary: Record BARI carrier cross-reactivity on odevixibat and maralixibat
  details: |
    Added the SLC10/OATP cross-reactivity profile of the two IBAT inhibitors this entry curates, from PMID:40998033 (J Lipid Res 2025), which tested all four clinical BARIs against ASBT, NTCP, SOAT and three OATPs in singly-transfected HEK293 cells.

    Three evidence items on Odevixibat and two on Maralixibat, all evidence_source IN_VITRO, all snippets from the abstract so they verify under the --no-full-text gate. The reference cached as full_text_xml; no snippet relies on the full text.

    What the entry now says that it did not: odevixibat and maralixibat inhibit SOAT (SLC10A6) at low micromolar potency and NTCP (SLC10A1) more weakly, so all three bile-acid-handling SLC10 carriers are in range rather than ASBT alone. The two differ in how wide that NTCP margin is, and the entry now gives the per-compound figures rather than the abstract's pooled three-drug ranges: odevixibat is the most NTCP-potent of the active BARIs at SOAT 5.5/5.6 uM against NTCP 9.9/17.0 uM (two- to threefold), where maralixibat is SOAT 4.5/5.9 uM against NTCP 91.5/98.5 uM (roughly twentyfold). Both also inhibit OATP1B1/1B3/2B1; and both sustain full ASBT inhibition through washout and 240 min of inhibitor-free incubation, where linerixibat's inhibition is reversible. The description attributes the clinical quietness of that profile to low oral bioavailability and a luminal site of action rather than to ASBT selectivity, which is the cited paper's own framing.

    Not done, deliberately. No claim was added to Hepatitis_B or Hepatitis_D. The paper does carry one HBV-relevant readout: it used binding of the radiolabelled viral preS1 peptide to NTCP as a surrogate for HBV attachment, and elobixibat and odevixibat blocked that binding - but, in the authors' own words, "at quite high inhibitor concentrations and with large inter-assay variability", and they put it no higher than "a potential anti-HBV activity at high inhibitor concentrations". There is no virus entry or infectivity readout, nothing for maralixibat in that assay, and the discussion itself calls patient-level interference with the NTCP entry-receptor function unlikely given the weak in vitro potency. Against a drug with minimal systemic exposure that is not enough to assert HBV/HDV relevance in those entries, so the inference was left unmade.

    Also corrected one sentence in an existing odevixibat evidence explanation that still argued for the retired supports: PARTIAL grade (#10003 leftover prose); the value itself was already SUPPORT.


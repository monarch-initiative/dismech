  summary: Add Abcb11-/- mouse model, model-mismatch discussion, and fibrosis null
    result
  details: |
    PR review round (ai4c-reviewer, CHANGES_REQUESTED on #9160). IMPORTANT 1: the VTX-802 treatment description enumerated only positive outcomes and dropped the paper's null fibrosis result; the description now states it and two evidence items quote the Sirius Red result and the authors' attribution of the null to the model's mild, variable, regional fibrosis. This matters for this entry specifically because it already curates 'Hepatic Stellate Cell Activation and Biliary Fibrosis', and fibrosis progressing to cirrhosis is what sends PFIC2 patients to transplantation. IMPORTANT 2: the file had no animal_models section at all, so a preclinical mouse-only therapy sat beside approved agents with no structured caveat. Added an animal_models entry for the Abcb11-/- C57BL/6 knockout mouse with modeled_mechanisms targeting 'BSEP-Mediated Bile Salt Export Failure' (PARTIALLY_RECAPITULATES, fidelity MODERATE) carrying all three unconsumed limitations - serum bile acid unusable as a readout, female-only dosing, non-uniform AAV8 transduction sparing periportal hepatocytes - plus two readouts (biliary/intestinal bile acid RESTORED, serum bile acid UNCHANGED as a first-class negative result). Added a discussions entry pfic2_mouse_model_fidelity with kind HUMAN_MODEL_MISMATCH attached to the export-failure node, the fibrosis node, the Total serum bile acids biomarker, and the treatment. Also took the three non-blocking suggestions: hepatomegaly correction is now described as significant but partial, and the durability claim now says sustained through the 15-week endpoint rather than at least 4 months. Note: the review suggested supports: PARTIAL for the fibrosis item, but that enum value has since been retired upstream (#7439/#10003), so the null is stated in the description and the quotes are graded SUPPORT for the stated claim. Validated: just validate clean (schema no issues, term validation passed, 144/144 snippets verified, no reference issues); just check-duplicate-keys OK; all four attaches_to refs and both readout targets verified to resolve.

  summary: Bind genes on subtype rows and substantiate the ClinGen prose claims
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    All four checklist genes were already present, subtype-linked and bound to their
    own pathophysiology nodes, so the wiring gap here was narrow: no subtype row
    carried a gene. All four now do.

    The substantive work was on unsourced prose. Three gene records made claims about
    ClinGen in their `notes:` with no evidence item behind them - "ClinGen classifies
    DNAJB6 as Definitive for LGMD-D1", "ClinGen has curated HNRNPDL-LGMD-D3 as a
    gene-disease relationship", "ClinGen classifies the CAPN3-LGMD dominant
    relationship as a curated gene-disease entity". Reading the gene-validity download
    shows all four genes are definitive, but every assertion is recorded against the
    umbrella class MONDO:0015151 - ClinGen does not curate the LGMD-D numbering at all
    - so "Definitive for LGMD-D1" overstated what ClinGen says. Each record now quotes
    its validity row as evidence and the prose is corrected to match. The CAPN3 note
    records that this is the one gene ClinGen curates twice, against the dominant and
    the recessive umbrella separately, and that only the dominant assertion belongs
    here.

    Nomenclature, which the brief asked to be explicit about. This entry names its
    subtypes in the post-2018 ENMC scheme while binding MONDO terms that mostly still
    carry pre-2018 labels, so `name` and `subtype_term.label` read differently on
    purpose. A top-level `notes:` block now pairs them line by line, each read off the
    MONDO record's own exact synonyms: LGMD-D1 = MONDO:0021018 "type 1D (DNAJB6)" =
    OMIM "autosomal dominant 1"; D2 = MONDO:0012034 "type 1F" = OMIM "autosomal
    dominant 2"; D3 = MONDO:0012193 "type 1G" = OMIM "autosomal dominant 3"; D4 =
    MONDO:0029133, already in the new style, with LGMD1I as an exact synonym. The ENMC
    D-number coincides with the OMIM number throughout while the old LGMD1-letter
    series tracks neither. MONDO asserts a causal gene on all four terms and each
    agrees with the gene bound on that row.

    Scope: LGMD-D5 (COL6A1/COL6A2/COL6A3) is named in the entry's description but
    given no row and no gene record, because it is Bethlem myopathy and has its own
    dismech entry. The note says so rather than leaving the omission to look like an
    oversight.

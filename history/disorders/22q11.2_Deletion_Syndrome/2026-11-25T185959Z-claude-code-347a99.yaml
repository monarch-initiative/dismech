  summary: 'Gene-family review: PRODH node'
  details: |
    PRODH sat on the candidate cortical and neurotransmitter mechanisms node together with RANBP1 and COMT, with no molecular function. It now has its own node, PRODH Hemizygosity and Hyperprolinemia, binding proline dehydrogenase activity (GO:0004657) as decreased and L-proline as increased: among 92 people with the deletion a subset is severely hyperprolinemic with an HPI-like phenotype, and plasma proline correlates inversely with IQ (PMID:17135275). The recurrent deletion node now has a direct edge to it (PRODH lies in the deleted interval, PMID:26978485), and it feeds the candidate mechanisms node through the proline-by-COMT interaction associated with psychosis risk (PMID:17135275). PRODH was removed from the candidate node's genes; RANBP1 and COMT remain there without a molecular function.

  summary: 'Edit: 22q11.2 Deletion Syndrome - openscientist deep-research report and
    edge evidence'
  details: |
    Follow-up to the velocardiofacial curation in the preceding record. The requested deep-research provider falcon was unreachable (403 ProviderAuthError, confirmed by 'deep-research-client providers --check'), so the run was re-issued with --fallback; it selected openscientist, which completed after the first commit. The report is committed as research/22q11.2_Deletion_Syndrome-deep-research-openscientist.md with its citations sidecar and two artifacts, and its frontmatter records the substitution (fell_back: true, requested_provider: falcon, provider_attempts including the falcon 403). Report validation: 39/39 references verified, confabulation_rate 0.0, 28/39 assessed on topic; term validation 38/44 verified with needs_review true, driven by one obsolete term (CL:4023070, replaced by CL:4023064) and six label variants that are table-parsing artifacts rather than wrong bindings. None of the six touch terms used in this entry, and CL:4023070 is not used anywhere in kb/disorders. The report independently proposed HP:0000220 for velopharyngeal insufficiency, matching the binding already curated. One substantive addition taken from it: PMID:40038168 (2025 review) supplies a human-level statement that pharyngeal neural-crest disruption causes both the conotruncal lesions and velopharyngeal deficiency, which is added to the TBX1-associated pharyngeal developmental vulnerability -> Velopharyngeal structural and myogenic insufficiency edge. That edge previously rested only on homozygous-mouse evidence graded INDIRECT; the new item is graded DIRECT and HUMAN_CLINICAL, and the mouse item is retained alongside it. Repository hygiene note: two deep-research invocations overlapped, and one wrote its openscientist output over the committed falcon report, citations and artifact directory. The committed falcon files were restored from git and verified byte-identical to a pre-run backup, the openscientist artifacts that had landed in the falcon artifact directory were removed, and falcon's artifact-00.md was removed from the openscientist artifact directory after confirming by sha256 that it was the relocated committed file rather than a regenerated one. No committed falcon content was lost. Revalidated with just validate, just validate-disorders (69/71 snippets verified, 2 pre-existing DOI-prefix skips) and the ungated gates.

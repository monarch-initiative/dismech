  details: |
    Review round 1 response on PR #12322 (issue #12190).

    The review approved with no blocking findings. This change is a self-review correction
    found while re-reading the committed diff, not a review finding.

    The TBX1 gene descriptor on the new DiGeorge subtype row described TBX1 as "the one gene
    in the interval in which point mutations alone reproduce it". That is an
    unsearched-absence claim: the cited report (PMID:14585638) screened TBX1 and no other
    interval gene, so it cannot establish that the roughly thirty other genes in the deletion
    do not behave the same way. The description now says what the report found and states
    explicitly what it does not establish.

    No evidence, binding, or structural change. Revalidated over all eight files in the PR.

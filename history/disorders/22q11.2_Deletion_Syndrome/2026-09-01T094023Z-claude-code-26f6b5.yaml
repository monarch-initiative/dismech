  summary: 'Edit: 22q11.2 Deletion Syndrome - address PR #10355 review (phenotype
    frequencies, stronger evidence)'
  details: |
    Addresses the ai4c-reviewer review on PR #10355, which requested changes on one point. Every quote the reviewer proposed was verified as an exact substring of references_cache/PMID_39056299.md before use. Blocking item, phenotype frequencies: the reviewer noted that population frequencies for two of the three new phenotypes were quotable from the full text of PMID:39056299, a paper this PR already cited on an adjacent node, and that four peer phenotypes in the entry already carry frequency. Velopharyngeal insufficiency now carries frequency FREQUENT, supported by 'up to 80% of people with 22q present with VPI'; FREQUENT rather than VERY_FREQUENT because 80 percent is stated as an upper bound, and the deep-research report's own phenotype table independently gives roughly 65-70 percent. Delayed speech and language development now carries VERY_FREQUENT, supported by 'most people (95%) with 22q present with a speech-language disorder'. Both explanations record that these sentences are the paper's introductory summary of prior literature rather than findings of its own 14-patient cohort. Hypernasal speech is deliberately left without a frequency, as the reviewer agreed no clean population figure exists. Accepted suggestion on evidence quality: the reviewer identified selection bias in the Hypernasal speech evidence. The previous snippet quoted the preoperative severity split of the surgical arm, but inclusion criterion 3 of that study was 'presence of hypernasality on preoperative speech evaluation', so those proportions are true by construction and cannot evidence the phenotype. Verified against the cached methods section and replaced with a population-level statement that hypernasality is part of the syndrome's speech phenotype; the explanation records why the earlier quote was withdrawn. Accepted suggestion on the mechanism edge: a second evidence item was added to the Velopharyngeal structural and myogenic insufficiency -> Velopharyngeal insufficiency edge, quoting the sentence that enumerates the anatomic and physiologic velopharyngeal differences contributing to VPI. The prior snippet was Objective-section framing; it is retained for the multifactorial claim with a narrowed explanation. Declined suggestion, node splitting: the reviewer suggested splitting the mechanism node into increased pharyngeal depth and hypodynamic musculature, while explicitly not blocking. Declined because the newly added quote lists seven contributing differences rather than two, so a split into exactly two would impose a division the source does not make; both halves are also TISSUE scale, so this is a conjunction rather than the bundled-causal-step case the single-value biological_scale rule targets. Deferred suggestion, parkinsonism: out of the declared velocardiofacial scope of this PR and would widen it; left for a follow-up. A YAML indentation error was introduced while applying these edits, caught immediately by just validate, and fixed before any push. Revalidated: just validate and just validate-disorders pass with 72/74 snippets verified, up from 69/71, with the same two pre-existing DOI-prefix skips; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-snippet-length, check-title-snippets and check-folded-hyphens all pass.

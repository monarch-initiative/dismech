  summary: 'Genetics pass: DiGeorge and velocardiofacial subtype rows with TBX1 bound,
    plus human TBX1 evidence'
  details: |
    Genetics pass for issue #12190 (d2g wiring-001), part of epic #12189.

    Research first. The entry already modelled the lesion honestly: the primary genetic
    record is the recurrent contiguous-gene deletion, carrying no gene_term because no single
    gene is the lesion, with TBX1 curated separately as a dosage contribution explicitly
    qualified as "not sufficient to explain the full deletion syndrome". That framing was
    kept. The weakness found was evidential rather than structural: the TBX1 record's only
    support was a mouse study, which the evidence policy says should not be the sole support
    for a human phenotype.

    What changed. Two has_subtypes rows were added for the historical labels the entry
    already lists as synonyms and maps in mondo_mappings - DiGeorge syndrome (MONDO:0008564)
    and velocardiofacial syndrome (MONDO:0008644) - each binding TBX1 (hgnc:11592) with a
    descriptor description stating that in nearly every patient the lesion is the deletion
    rather than a TBX1 sequence variant. The evidence for both rows, and two new items on the
    TBX1 genetic record, come from PMID:14585638, which reports TBX1 point mutations without
    a 22q11.2 deletion in a patient with sporadic DiGeorge syndrome and in a sporadic case
    and a three-member family with velocardiofacial syndrome. That is the human evidence the
    record previously lacked, and it is what makes MONDO's TBX1 assertion against both
    concepts defensible. The deletion record gained relationship_type CAUSATIVE and
    variant_origin GERMLINE.

    A schema gap recorded in review_notes. TBX1's relationship_type is deliberately left
    unset. The claim is that TBX1 is the principal dosage-sensitive driver within a
    contiguous-gene deletion, and no permissible value says that: CAUSATIVE asserts the gene
    alone is sufficient, which the record's own association denies; MODIFIER denies it is a
    primary driver; UNKNOWN denies the PMID:14585638 finding. It was left absent rather than
    forced to a value that would be false.

    MONDO reconciliation. MONDO:0008564 and MONDO:0008644 both record TBX1 (hgnc:11592);
    present at the entry level before this pass and now bound on the matching subtype rows.
    No disagreement with MONDO, though note that MONDO attaches a single gene to what is a
    contiguous-gene deletion syndrome, which the KGX exporter's hardcoded contributes_to
    predicate happens to render correctly.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches
    and validate-disorders all pass.

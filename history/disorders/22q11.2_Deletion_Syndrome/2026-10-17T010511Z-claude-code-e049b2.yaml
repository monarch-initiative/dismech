  details: |
    LOINC tranche K batch 2. Searched the spelled-out condition name '22q11.2 deletion cell-free DNA' and found a full identity family distinct from the trisomy-21 code used elsewhere in this project (LOINC:77011-5, chromosome-21-specific in its own label) and from the joint aneuploidy-and-22q11.2 panel (LOINC:96978-2), which asserts a second test this row does not claim. Bound LOINC:75576-9 (Fetal 22q11.2 deletion risk [Likelihood] based on Plasma cell-free+WBC DNA by Dosage of chromosome-specific cfDNA), the clean numeric Likelihood code, over its Narrative-suffixed sibling (75577-7) and the [Interpretation] codes in the same family, since this is the LOINC family's quantitative scale encoding rather than a narrative conclusion field. Code verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

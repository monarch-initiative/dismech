  summary: 'Edit: 22q11.2 Deletion Syndrome - velocardiofacial (velopharyngeal/speech)
    arm'
  details: |
    Curated the velocardiofacial (Shprintzen) presentation. Requested disorder 'velocardiofacial syndrome' resolves to this entry: MONDO:0008644 is already bound here as a skos:narrowMatch (added in PR #7391) and the entry's description records VCFS/DiGeorge/CATCH22 as historical labels, so this is an augmentation rather than a new entry. Gap closed: velopharyngeal insufficiency existed only as prose inside the Palatal abnormality description, with no mechanism node and no speech-surgery treatment. Added phenotypes Velopharyngeal insufficiency (HP:0000220), Hypernasal speech (HP:0001611) and Delayed speech and language development (HP:0000750); added pathophysiology node 'Velopharyngeal structural and myogenic insufficiency' (biological_scale TISSUE; UBERON:0001733 soft palate, UBERON:0001042 chordate pharynx, GO:0060021) wired as TBX1-associated pharyngeal developmental vulnerability -> new node -> VPI and hypernasal speech; added treatment 'Velopharyngeal surgery for persistent hypernasality' with a target_mechanisms link to that node. Four new references (PMID:36695155, PMID:39056299, PMID:36512754, PMID:41800660), all specifically about 22q11.2 deletion syndrome. Deep research: the requested provider falcon was unreachable (403, confirmed by 'deep-research-client providers --check'), so the run was re-issued with --fallback so the substitution is recorded rather than made by hand; it selected openscientist and was still running when this entry was committed, so the curated content here derives from direct PubMed searches plus the pre-existing committed falcon report, which had already flagged HP:0000220 and HP:0001611 as unused term suggestions. Two claims were deliberately softened to match their sources: the pharyngoplasty-over-palatoplasty preference rests on a 14-patient series whose authors report it as a 'may be less effective' signal, and the mechanism node's explanation of post-palatoplasty resonance is labelled proposed rather than established. Delayed speech and language development was left unconnected in the pathograph because the cited cohort explicitly finds language impairment not explained by speech ability, and no source supports a causal edge. NCIT has no pharyngoplasty term reachable from NCIT:C25218, so the treatment binds the generic surgical action with specificity carried in preferred_term. Validated with just validate, just validate-terms, just validate-disorders (68/70 snippets verified, 2 pre-existing DOI-prefix skips), and the ungated gates check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens and check-not4curation.

  summary: 'Create: Neurodevelopmental_Disorder_with_Central_and_Peripheral_Motor_Dysfunction'
  details: |
    New entry for the NFASC-related neurodevelopmental disorder (MONDO:0032698, OMIM:618356), claimed in issue 14364. Falcon was requested as the default provider but failed Edison authentication (503) on three attempts, and the --fallback flag does not engage on authentication failures, so the claude_code provider was run directly; that report is committed beside the entry. The report resolved 19/19 references; its one unsupported quote (PMID:35172135) and three off-topic references were not cited. just preflight-dr confirmed the report is about NFASC; CNTN1 mentions are NF155's binding partner. The entry is built from the five human reports (PMID:30124836, 31501903, 30850329, 31608123, 31945734) and mouse models (PMID:16337912, 18573915, 19185024, 24719087, 28217083, 22492029, 42052621). The isoform-selective genotypes (NF155 vs NF186) are recorded as has_subtypes. No GeneReviews chapter exists (genereviews[book] search and just check-genereviews both returned none). HPO has no auditory neuropathy term, so ANSD is bound to Hearing impairment. Seven phenotypes have no inbound causal edge because no source links them to a specific mechanism node. Validated with just validate, validate-terms, count-verified-snippets (63/63), check-entity-refs, check-causal-targets, check-coarse-phenotypes and validate-disorders.

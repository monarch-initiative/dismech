  summary: 'Create: Buschke-Ollendorff Syndrome'
  details: |
    Created kb/disorders/Buschke-Ollendorff_Syndrome.yaml (MONDO:0008157, LEMD3, hgnc:28887 verified
    against the committed hgnc cache and the schema's gene enum) from scratch. 2110 lines,
    108 evidence snippets, all 108 verified against references_cache. Weighted compliance 89.3%.

    DEEP RESEARCH. Both requested providers ran to completion.
    - falcon (Edison Scientific), 524s, 18 citations, reference_validation 8/8 resolved,
      confabulation_rate 0.0. The report is genuinely good and several framing points in the
      entry come from it: the contiguous-12q14-deletion caveat, the warning that the
      1-in-20,000 occurrence figure is not a registry measurement, the "no faithful animal
      model" summary, and the caution against treating cognitive delay as a syndrome feature.
      Two defects worth recording. (1) It cites Mumm et al. 2007 as PMID:17223882; that PMID
      is a different paper (Br J Dermatol, "Familial cutaneous collagenomas resulting from a
      novel mutation in LEMD3"). The correct Mumm PMID is 17087626, which is what this entry
      uses. The mis-cited PMID turned out to be a real and relevant paper, but its PubMed
      record has no retrievable abstract (content_type: unavailable), so it could not be cited
      with a snippet and was dropped. (2) Its term_validation block reported only one
      mislabelled term (the MONDO id, trivially), but two of the HP CURIEs it proposed in
      prose tables resolve to unrelated concepts: HP:0005681 offered as "Osteopoikilosis" is
      actually Juvenile idiopathic arthritis, and HP:0005781 offered as "Melorheostosis" is
      actually Contractures of the large joints. Neither was used. Every HP/GO/CL/UBERON/NCIT
      binding in this entry was checked independently against the committed caches or the OLS
      REST API before use; the correct bindings are HP:0010739 and HP:6000817.
    - asta, 6.7s, 20 papers. The retrieval failed completely for this query: not one returned
      paper concerns Buschke-Ollendorff syndrome, osteopoikilosis, LEMD3 or melorheostosis
      (they are about Hutchinson-Gilford progeria, Bartter syndrome, epidermolysis bullosa,
      Bardet-Biedl, pulmonary hypertension and so on). Its reference_validation is clean
      because the papers exist, not because they are relevant - a good illustration of why
      "36/36 resolved" is not an on-topic guarantee. Nothing from the asta report was used.
    Because asta contributed nothing, the reference set was built primarily from a systematic
    PubMed E-utilities sweep (Buschke-Ollendorff; LEMD3; osteopoikilosis AND (LEMD3 OR MAN1);
    melorheostosis AND MAP2K1; MAN1 AND Smad; LEMD3 AND mouse; connective tissue nevus
    histopathology) plus the reference lists of the two review articles.

    GENEREVIEWS. There is no GeneReviews chapter. PubMed searches for
    "<term> GeneReviews[All Fields]" over Buschke-Ollendorff, osteopoikilosis, LEMD3 and
    melorheostosis all returned 0 hits, as did NCBI Bookshelf queries. The mandatory baseline
    therefore could not be applied and this is recorded in the entry's notes. In its place the
    phenotype block was cross-checked against the largest systematic review (PMID:26708699,
    164 cases) and the most recent genetically confirmed series (PMID:40195882).

    MECHANISM MODEL. Nine pathophysiology nodes forming a branching chain with bare-name
    downstream targets: LEMD3 Haploinsufficiency (MOLECULAR) -> Loss of Nuclear Envelope
    R-SMAD Antagonism (MOLECULAR) -> two parallel arms, Increased BMP-SMAD1/5/8 Transcriptional
    Output and Increased TGF-beta-SMAD2/3 Transcriptional Output (both MOLECULAR) -> Bone
    Lining Cell Activation and Modeling-Based Bone Formation (CELLULAR) and Dermal Fibroblast
    Elastin and Collagen Overproduction (CELLULAR) -> Focal Trabecular Osteosclerotic Nodule
    Formation, Segmental Cortical Hyperostosis and Dermal Connective Tissue Nevus Formation
    (all TISSUE) -> the phenotype nodes. Both arms feed the bone branch, because TGF-beta acts
    on the osteoblast lineage too and no study separates the two contributions in human tissue.
    mechanism_confidence is deliberately graded down the chain: ESTABLISHED for the molecular
    interaction (structural, biochemical and orthologue evidence), PROVISIONAL for the two
    transcriptional-output nodes (never measured in patient bone or skin), ESTABLISHED again
    for the bone tissue lesion (human histomorphometry, PMID:32151766) and the fibroblast
    overproduction (PMID:1629625), and HYPOTHETICAL for Segmental Cortical Hyperostosis.
    The two edges into Bone Lining Cell Activation are INDIRECT_UNKNOWN_INTERMEDIATES rather
    than DIRECT for the same reason.

    MELORHEOSTOSIS ATTRIBUTION. Handled as a first-class CONTROVERSY discussion
    (discussion_id: melorheostosis_attribution) rather than being decided in prose, because
    the honest position has three parts that pull in different directions. (i) The 2004
    gene-discovery paper (PMID:15489854) put melorheostosis in its title; that general claim
    is refuted, and the discussion carries two REFUTE evidence items against it -
    PMID:17087626 "no LEMD3 mutation was found for any other patient, including all four with
    sporadic MEL" and PMID:19438932's independent replication. Those are, as far as I can tell,
    the correct use of supports: REFUTE here: the quoted sentences contradict the proposition
    rather than merely failing to support it. (ii) Sporadic isolated melorheostosis is a
    somatic MAP2K1 mosaic disease (PMID:29643386), and it is modelled as a
    differential_diagnosis, not as part of this entry's pathograph. (iii) The LEMD3-associated
    segmental lesion is real but unexplained: everyone in the kindred carries the allele and
    only one member develops the lesion, and the postulated somatic second hit at LEMD3 has
    been searched for and not found (PMID:15489854, PMID:16470551). So the entry keeps a
    Segmental Cortical Hyperostosis node with mechanism_confidence HYPOTHETICAL, a
    "BOS with Melorheostosis" subtype, and an explicit statement in the node description that
    it makes no claim about sporadic melorheostosis. This seemed better than either asserting
    LEMD3 causation or deleting the lesion from an entry in which it genuinely occurs.

    OTHER MODELLING DECISIONS A REVIEWER SHOULD KNOW.
    - has_subtypes are presentation-defined intrafamilial forms (Complete, Skin-Limited,
      Bone-Limited, BOS with Melorheostosis), quantified by PMID:26708699's 24/20/54 split.
      I deliberately did NOT make "isolated osteopoikilosis" a subtype in the ontological
      sense: MONDO places MONDO:0015634 under osteopoikilosis, not under BOS, and BOS is
      defined by having both components. The MONDO binding on Bone-Limited BOS is labelled in
      its description as a cross-reference to the concept, not a subsumption claim.
    - animal_models carries three entries. The headline one is the heterozygous Lemd3+/GT
      mouse (PMID:19862465), linked FAILS_TO_RECAPITULATE against the bone-lesion node with
      fidelity LOW, model_scale TISSUE (equal to target scale, so no extrapolation), two
      readouts, both limitations and evidence as the schema requires for a negative link, and
      typed divergences (SPECIES_MISMATCH INVALIDATING, BOUNDARY_OMISSION QUALIFYING - the
      study never looked at skin). A matching HUMAN_MODEL_MISMATCH discussion
      (bos_no_animal_model) sets out the three alternative explanations and proposes an
      osteoblast-lineage conditional experiment. The Man1 Smad-domain-deletion mouse
      (PMID:16943282) and the Xenopus XMAN1 system (PMID:12642484) are linked to the molecular
      nodes with PARTIALLY_RECAPITULATES and PERTURBS respectively.
    - No conforms_to. kb/modules/ was searched. fibrotic_response is the near miss and is
      wrong - a connective tissue nevus is hamartomatous developmental matrix overproduction,
      not a myofibroblast wound-healing programme, with no injury, no inflammatory phase and
      no myofibroblast. aortopathy_tgfbeta_dysregulation shares the axis but is aorta-scoped;
      defective_skeletal_mineralization and osteoporosis_bone_resorption run the other way.
      Reasoning recorded in the entry's notes rather than forcing a target.
    - Two histopathology findings (dermal elastoma, dermal collagenoma) and one imaging
      finding carry a free-text preferred_term with no term:, because no NCIT
      HistopathologyFindingTerm (reachable from NCIT:C83490) and no HP descendant of
      HP:0025461 names them. HP:0025164/HP:6000022 are bound in the phenotypes block instead,
      where the enum root (HP:0000118) does admit them. The bone nodule is bound to the
      generic NCIT:C69309 Sclerosis, whose reachability from NCIT:C83490 I checked via OLS.
    - Empty by decision, with reasons in notes: biochemical (turnover markers are normal, no
      biomarker exists), datasets (no BOS-specific omics dataset was found), clinical_trials
      (none exist; the MEK-inhibitor interest belongs to MAP2K1 melorheostosis),
      environmental (germline Mendelian; trauma prompting the diagnostic radiograph is
      ascertainment, not aetiology). No cognitive phenotype was curated - PMID:26708699's
      cognitive-delay signal appears only in cases published from 2007 onwards, which is what
      reporting bias plus the arrival of microarray-detected 12q14 deletions looks like;
      recorded as an OPEN_QUESTION discussion instead.
    - prevalence measure_type is UNKNOWN, not ANNUAL_INCIDENCE, even though the source says
      "estimated incidence": no denominator population and no observation period are given.
      rate_per_100000 5.0, prevalence_class BAND_1_9_PER_100000.
    - Cross-referenced kb/disorders/Dacryocystitis-Osteopoikilosis_Syndrome.yaml
      (MONDO:0008158, also LEMD3) in notes. That file was read but not edited.

    REFERENCES CONSIDERED AND NOT USED. PMID:17223882 (familial cutaneous collagenomas from a

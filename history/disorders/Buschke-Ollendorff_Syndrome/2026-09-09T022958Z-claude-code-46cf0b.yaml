  details: |
    Answers the four non-blocking suggestions on PR #11496 in one push. (1) The notes paragraph explaining why no treatment carries target_mechanisms read as an exhaustive list but named four of six treatments, omitting excision of symptomatic connective tissue nevi and bisphosphonate therapy for melorheostosis. All six are now named. (2) Bisphosphonates were the omission that mattered, because an antiresorptive plainly does act on bone and this entry does curate bone-formation nodes, so a reader reaching for a counterexample would land there and find the argument absent rather than answered. The paragraph now makes the case explicitly: the curated nodes are modeling-based formation on quiescent surfaces, an antiresorptive acts on osteoclastic resorption, and the osteopoikilotic nodule has a normal remodelling rate to begin with - a point the treatment's own description already made. The drug is given for melorheostosis pain on weak evidence, which is a target_phenotypes claim and is recorded as one; a formation-node edge would assert a disease-modifying action nobody has shown. (3) Restored the zygosity to the second animal model's name, now 'Man1 Smad-interacting-domain homozygous deletion mouse'. The entry stresses homozygosity three times as the model's defining limitation against a haploinsufficiency disease, and the name was the one place it went missing. Verified before renaming that no attaches_to reference points at this model - the single animal_models# reference in the file names the Lemd3+/GT heterozygote - and re-ran check-entity-refs after. (4) On the observation that prose describing the entry's own structure goes stale with nothing to gate it: the paragraph now says so and tells a reader to check it against the treatments block rather than trust the count. That is the #11456 defect class, and a self-limiting sentence is the cheapest available mitigation short of a gate. No claim, ontology binding, evidence item, or snippet changed.

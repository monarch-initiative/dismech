  summary: 'Follow-up to #11171 review: name the animal models, narrow the NCIT surgery
    term, record decisions'
  details: |
    Follow-up to the approved review on PR #11171, taking the accepted non-blocking suggestions that were deferred rather than pushed onto the approved head.

    ANIMAL MODEL NAMES, and why this one mattered more than it looked. All three models were unnamed, so renderers and entity references fell back to '<genotype> <species>'. Two of the three are Mouse, which made the HUMAN_MODEL_MISMATCH discussion's 'attaches_to: animal_models#Mouse' ambiguous between the Lemd3+/GT gene-trap heterozygote and the Man1 Smad-interacting-domain deletion homozygote. The reference resolved - animal_models# falls back to species - but it resolved to whichever matched first, not necessarily to the intended model. The discussion's own rationale is explicitly about the heterozygous gene-trap ('The heterozygous Lemd3 gene-trap mouse, examined by radiography, quantitative micro-CT histomorphometry ... showed nothing'), so the reference is now retargeted to that model by name. Names given: 'Lemd3+/GT heterozygous gene-trap mouse', 'Man1 Smad-interacting-domain deletion mouse', 'XMAN1 gain- and loss-of-function Xenopus embryo'.

    NCIT TERM. Corrective Orthopaedic Surgery was bound to NCIT:C15329 (Surgical Procedure) where NCIT:C16186 (Orthopedic Surgical Procedure) exists and is the more specific accurate term, which is what the ontology contract asks for. Note that swapping the CURIE alone left the old label in place and term validation caught it as a label mismatch before commit - the label must be updated with the id, and the validator is what enforces that rather than review.

    REPRODUCTIVE OPTIONS. The genetic-counselling description gave the 50% recurrence risk and the unpredictability of severity but said nothing about what a family can do with that information. It now records that prenatal diagnosis and preimplantation genetic testing are technically available once a familial LEMD3 variant is known, and sets that against the condition's generally benign course - the point being that the decision here is not the one it would be for a progressive or life-limiting disease, so listing the options without that framing would misrepresent the counselling.

    ABSENT target_mechanisms IS A DECISION. No treatment in this entry carries a target_mechanisms edge, and a reader could reasonably read that as an unfinished section. It is not: every curated treatment is symptomatic or diagnostic-sparing (reassurance and radiographic recognition to avoid an oncological workup, analgesia, orthopaedic correction, counselling), and none acts on LEMD3 dosage, nuclear-envelope SMAD sequestration, or BMP/TGF-beta output. A target_mechanisms edge asserts that a treatment acts on a curated node; drawing one from analgesia to a bone-formation node would be false. The notes: block now says so, and says the absence should not be 'completed' without a disease-modifying agent to hang on it.

    Not taken: the physiotherapy/occupational-therapy treatment and the cutaneous differential diagnoses that the review raised as conditional. Both were conditional on finding an exact-quote source, and no cached source supports either; adding them would mean either an unsourced treatment entry or a snippet that does not verify.

    Validation: schema, terms and references pass, 108/108 snippets verified. All structural, content and cache gates clean.

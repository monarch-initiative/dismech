  summary: 'Wire SCN8A-DEE pathograph: connect mechanism chain to phenotype nodes'
  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Problem: the SCN8A-DEE mechanism chain (SCN8A gain-of-function variant -> increased
    Nav1.6 sodium current -> neuronal hyperexcitability -> seizures and developmental
    encephalopathy) terminated in an abstract summary node and never reached a phenotype.
    All 7 phenotype nodes floated disconnected (0/7 on phenotypes[].causal_inlink).

    Change: added downstream CausalEdges -
      - Neuronal Hyperexcitability -> Focal Seizures (DIRECT), Epileptic Spasms
      - Seizures and Developmental Encephalopathy -> Epileptic Encephalopathy (DIRECT),
        Global Developmental Delay
      - Increased Nav1.6 Sodium Current -> Movement Disorder (Dystonia), Ataxia,
        Choreoathetosis

    The three movement-disorder phenotypes are wired from the sodium-current node rather
    than from the seizure node, and all use INDIRECT_UNKNOWN_INTERMEDIATES with edge
    descriptions that say the intervening circuit mechanism is not established. The cited
    GeneReviews source reports these as common features without specifying a mechanism, so
    a DIRECT edge or a seizure-mediated route would over-claim.

    No new ontology terms, evidence items, or PMIDs; only causal edges with descriptions and
    causal_link_type.

    Validation: just validate passed (schema + terms + references; "Snippets checked: 14/14
    verified against cached references"). Phenotype connectivity recomputed at 7/7.
    Gene-to-mechanism wiring was already complete (the trigger node carries gene: SCN8A
    hgnc:10596 matching the genetic entry) and was not touched.

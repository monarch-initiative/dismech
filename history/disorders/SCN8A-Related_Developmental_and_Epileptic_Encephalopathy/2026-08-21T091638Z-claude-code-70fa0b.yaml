  details: |
    Weekly compliance sweep. Weighted compliance 42.7% (`just compliance` on the
    file). Ontology terms were already at 100%, so the gap was entirely evidence
    metadata and missing evidence blocks: `reference_title` 0% (0/11 evidence
    items), pathophysiology[].evidence 1/4, phenotypes[].evidence 4/7,
    treatments[].target_mechanisms[].evidence 0/1.

    Backfilled `reference_title` on all 14 in-scope evidence items, verified against
    the cached PubMed records for the three PMIDs this entry cites (27559564,
    22365152, 31904124). Added 9 new evidence items: 4 on pathophysiology nodes (the
    SCN8A trigger, neuronal hyperexcitability, and the seizure/encephalopathy
    endpoint), 3 on phenotypes (focal seizures, epileptic spasms, epileptic
    encephalopathy), 1 on the sodium-channel-blocker `target_mechanisms` link, and a
    second on the trigger node establishing the de novo origin.

    Note the first pass also inserted `reference_title` into the top-level
    `references:` block, whose class uses `title:` instead; `just validate` caught it
    and it was removed.

    Three items are deliberately PARTIAL:

    - The `Epileptic Spasms` phenotype is bound to HP:0011097 (Epileptic spasm), but
      PMID:31904124 says "spasm-like episodes". The semiology is described without
      the electroclinical entity being committed to, and the explanation says so
      rather than quietly upgrading the claim.
    - The 5% early-death figure is recorded on the seizure/encephalopathy node with
      the source's own qualification: premature death occurs in early childhood and
      "often for causes other than sudden unexpected death in epilepsy", so it is
      not a SUDEP rate. This qualifies the entry's SUDEP framing.

    Prevalence evidence was left absent on purpose. The entry's `prevalence[]` cites
    roughly 2.96 per 100,000 from a survey of de novo dominant neurodevelopmental
    disorders. The likely source is the de novo incidence catalogue (PMID:32168371),
    but its per-gene numbers are in a supplementary table, and SCN8A does not appear
    anywhere in the cached record - so there is no quotable snippet. Per the evidence
    SOP option A, the figure stays in `notes` rather than being given a citation that
    does not state it.

    Validation: `just validate` passed; `just count-verified-snippets` reported 23/23
    snippets verified against cached references; `just validate-terms` passed; all
    five ungated CI gates passed; `just validate-disorders` run as the pre-PR sweep.

    Weighted compliance 42.7% -> 73.8%; reference_title 0% -> 100%;
    pathophysiology[].evidence 25% -> 100%; phenotypes[].evidence 57% -> 100%.

    Remaining gaps: `datasets` empty; `pathophysiology[].downstream[].evidence` 0/10;
    `prevalence[].evidence` 0/1 (see above); and the
    `discussions[].proposed_experiments[]` sub-fields.

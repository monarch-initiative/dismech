  summary: 'Create: SCN8A-Related Developmental and Epileptic Encephalopathy'
  details: |
    De-novo curation of SCN8A-related DEE (DEE13, MONDO:0013801). Granular unbundled pathophysiology: SCN8A gain-of-function variant (Nav1.6) -> increased Nav1.6 sodium current (persistent current, impaired inactivation; conforms module) -> neuronal hyperexcitability (conforms) -> seizures + developmental encephalopathy (conforms). Evidence: Veeramah 2012 (PMID:22365152, first SCN8A-DEE, dramatic increase in persistent current, dominant GOF) and the phenotypic/treatment spectrum cohort (PMID:31904124, sodium-channel blockers at supratherapeutic doses, ketogenic diet effective, de novo). GeneReviews (PMID:27559564) tagged + mined for developmental delay and movement-disorder phenotypes. Treatments: high-dose sodium-channel blockers (target GOF), ketogenic diet. Three KNOWLEDGE_GAP discussions: early precision-treatment window, GOF-vs-LOF classification, SUDEP mechanism. Prevalence ~3/100,000 (roadmap estimate, notes). claude_code deep research NEC-clean (SCN8A/Nav1.6/DEE13); careful to attach only GoF-arm snippets. All snippets verified exact; schema + term validation pass.

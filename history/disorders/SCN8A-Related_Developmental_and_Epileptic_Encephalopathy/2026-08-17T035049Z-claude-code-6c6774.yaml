  summary: Add ICD-10-CM and NCIT mappings
  details: |
    Weekly compliance sweep, mappings focus. Added ncit_mappings NCIT:C188139 (Developmental and Epileptic Encephalopathy 13) as an exactMatch and icd10cm_mappings ICD10CM:G93.45 as a broadMatch. NCIT:C188139 was confirmed via OAK to be defined as the SCN8A-caused DEE subtype and to carry an NCIT:R176 relation to NCIT:C190831 SCN8A Gene, so it is the same concept as MONDO:0013801. ICD-10-CM has no gene-specific rubric, so G93.45 is recorded as broadMatch rather than exactMatch. No ICD-11 Foundation mapping was added: the only candidate, icd11f:1786562875 Epileptic encephalopathies, is a whole-category grouping and was judged too broad to be a useful mapping. Validated with 'just validate'; 14/14 snippets verified against cached references.

  details: |
    Created a new flea-borne spotted fever entry for MONDO:0019364. Ran just research-disorder with Asta requested and explicit fallback to OpenAI, Perplexity, Falcon, and OpenScientist; Asta, OpenAI, Perplexity, and Falcon were unconfigured and OpenScientist produced research/Flea_Borne_Spotted_Fever-deep-research-openscientist.md. Read the report validation: 21 of 21 references resolved, no off-topic references, and no ontology CURIEs suggested. Ran just preflight-dr, which returned SKIP because MONDO records no causal gene for this Rickettsia felis infection. Manually confirmed the report matched the intended R. felis flea-borne spotted fever entity and curated a compact pathograph for the R. felis ribosomal target, obligate intracellular niche, dermal inoculation, endothelial invasion/vascular leak, and R. felis chemokine/VEGF response, with fever, headache, maculopapular rash, eschar, paired-serum serology, and doxycycline treatment. Validated schema, ontology terms, and 20 of 20 evidence snippets.

  summary: Bind the spotted fever group Rickettsia antibody test as a LOINC measurement
  details: |
    Added measurements: LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Paired-serum indirect immunofluorescence assay row. The row's own evidence states R. felis antibodies cross-react more strongly with spotted-fever-group antigen than typhus-group antigen, i.e. the test used is group-level rather than R. felis-specific, which this group-level LOINC code matches exactly; no R. felis-specific LOINC code exists (checked via Monarch KG search for Rickettsia felis against category biolink:ClinicalMeasurement, no results). Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch9 (LOINC_DIAGNOSTICS.md tranche B).

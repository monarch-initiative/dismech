  summary: 'Create: Large Cell Neuroendocrine Carcinoma (MONDO:0005057)'
  details: |
    De-novo creation of the site-agnostic LCNEC entity (MONDO:0005057), the CURATE_ROOT_WITH_SUBTYPES target from issue #8988.

    DEEP RESEARCH. falcon (the repo default) was attempted first and failed with HTTP 402 Payment Required from the Edison API; no falcon report exists. Two providers completed and both reports are committed: claude_code (35/35 references resolved, confabulation_rate 0.0, 0 off topic) and openscientist (49/49 resolved, 7/7 quoted claims found in source, 0 off topic). Both reports' Reference Validation sections were read before any citation was reused.

    NEC PREFLIGHT. The priority dashboard flagged this candidate ACRONYM_AMBIGUITY on "LCNEC". just preflight-dr returned SKIP for both reports because MONDO records no causal gene (RO:0004003) for a sporadic carcinoma, so the manual fallback was run: the reports' top-mentioned genes are the expected TP53/RB1/STK11/KEAP1/ASCL1 set; MONDO:0005057 carries no OMIM xref to contradict; and an OAK search confirmed "LCNEC" names no other MONDO entity. Entity identity confirmed.

    DR ONTOLOGY ERRORS CAUGHT. Despite clean reference validation, the claude_code report proposed three wrong ontology IDs which were NOT used: KEAP1 as HGNC:6396 (correct hgnc:23177), pulmonary neuroendocrine cell as CL:0002251 (correct CL:1000223), and the disease as a "MONDO:0018316-class term" (correct MONDO:0005057). Every identifier in the entry was independently re-resolved with OAK. Reference validation checks citation resolution, not ontology-term reality.

    GENEREVIEWS. Searched; the only PubMed hit for "large cell neuroendocrine carcinoma GeneReviews" is PMID:20301399 (Tuberous Sclerosis Complex), which is unrelated. No GeneReviews chapter exists for this sporadic carcinoma, so Step 3b was recorded as not applicable rather than skipped silently.

    WHAT WAS CURATED. 10 pathophysiology nodes forming a bifurcating pathograph (tobacco mutagenesis then TP53 inactivation, then either RB1 biallelic loss or STK11/KEAP1 biallelic loss, then checkpoint loss and neuroendocrine lineage programme, then high-grade proliferation, local growth and early dissemination), with three module conformances: genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control, and invasion_and_metastasis#Metastatic Colonization. 6 has_subtypes covering all six MONDO children (pulmonary, combined pulmonary, thymic, cervical, pancreatic, breast). 5 somatic driver genes, all wired to mechanism nodes. 5 treatments including the RB1-predictive chemotherapy contrast. One animal model (PMID:31611390) with two modeled_mechanisms links, one RECAPITULATES and one PARTIALLY_RECAPITULATES. Two KNOWLEDGE_GAP discussions with proposed experiments.

    PHENOTYPES DELIBERATELY NOT CURATED. An earlier draft carried Cough, Hemoptysis, Dyspnea and Weight Loss. They were removed because no available source documents or quantifies them in LCNEC specifically; the only attachable snippets were general "LCNEC is aggressive" statements that do not support a symptom claim (the issue #8352 anti-pattern). They are recorded in the entry's notes as prose instead. Only the two directly-evidenced phenotypes were kept (lung neoplasm; brain metastasis at 19.2 percent), and both are wired into the pathograph.

    SCOPE. Thymic LCNEC (MONDO:0003047) is already curated in depth under Thymic_Neuroendocrine_Carcinoma.yaml and is listed here as a subtype only, not re-derived. Pulmonary-derived mechanism and treatment data are labelled as such rather than generalised across sites; the cervical subtype records a contrasting low-TMB HPV18 case as an explicit caution against that generalisation.

    VALIDATION. just validate passed (schema, terms and references). just validate-terms passed. just count-verified-snippets reported 65/65 verified against cached references. just check-title-snippets reported OK with no new title-quoting snippets. just check-duplicate-keys reported OK. Phenotype connectivity 2/2 (100 percent); gene-to-mechanism wiring 5/5 (100 percent). just compliance reported 89.4 percent weighted.

  summary: 'Create: Lymphomatoid Granulomatosis'
  details: |
    De novo curation of lymphomatoid granulomatosis (MONDO:0019466) from stubs/Lymphomatoid_Granulomatosis.yaml, using a claude_code deep-research report. just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0019466 and its gene-identity check cannot discriminate, so identity was checked manually against the MONDO record with runoak: the term's Orphanet-sourced definition matches the report on every point checked, including the EBV aetiology, the fourth-to-sixth-decade onset, the lung/skin/CNS/kidney distribution and the rarity of nodal and splenic involvement. Mechanism is modelled as a five-node chain from defective EBV immunosurveillance through outgrowth of EBV-positive atypical B cells to the ineffective angiocentric reactive T-cell response, coagulative necrosis, and clonal high-grade transformation; the first node declares conforms_to viral_oncogenesis#Persistent Oncogenic Virus Infection. WHO grades 1-3 are curated as has_subtypes bound to MONDO:0859747/8/9 rather than as stages, because they select different treatment arms and because grade moves in both directions under treatment. No genetic section is curated: predisposing germline immunodeficiency genes cause their own syndromes and no recurrent chromosomal lesion exists in this disease. Three discussions are recorded, including a HUMAN_MODEL_MISMATCH for the absence of any model that reproduces the angiocentric architecture. The NCT00001379 status was set from the ClinicalTrials.gov API (COMPLETED) rather than from the 2023 trial publication, which described the study as still open. Validated with just validate (49/49 snippets verified), just validate-terms, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, the module-conformance pytest selection, and the batched just validate-disorders. After the first CI run, the branch was rebased onto main to pick up #10003, which retired supports: PARTIAL; the two PARTIAL evidence items were migrated to supports: SUPPORT with an explicit directness value (INDIRECT for the dyspnea item, whose quote asserts progressive pulmonary failure rather than the symptom, and DIRECT for the transplantation item).

  summary: 'Create: Spinocerebellar Ataxia Type 14, promoted from ADCA-I'
  details: |
    Promoted SCA14 (PRKCG, MONDO:0011540) from the has_subtypes row of Autosomal_Dominant_Cerebellar_Ataxia_Type_I into its own entry, following the reference list recorded on issue 13103. The causal chain keeps three competing PKCgamma mechanisms apart (raised basal activity from impaired autoinhibition; mislocalization and aggregation; dominant-negative disruption of climbing fiber pruning and LTD in mouse Purkinje cells), carries REFUTE evidence against raised activity as the general mechanism (PMID:28738819, PMID:16189624), and records the domain-dependent question as a KNOWLEDGE_GAP. No functional_impact_category is asserted. Four mouse models and patient iPSCs are linked to the pathograph. The ADCA-I row now carries curated_in, and SCA14 was added to the Cerebellar_Ataxias grouping. Validated with just validate-disorders (211/211 snippets), validate-terms, and the whole-repo check gates.

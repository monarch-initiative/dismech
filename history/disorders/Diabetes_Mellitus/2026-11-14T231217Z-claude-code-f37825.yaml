  summary: Add SAID (Ahlqvist cluster 1) as a threshold-boundary subtype
  details: |
    Added SAID, the autoimmune Ahlqvist cluster, as a has_subtypes row on the diabetes mellitus umbrella rather than on Type_2_Diabetes_Mellitus, because membership is decided by a positive islet autoantibody test and the group overlaps adult-onset type 1 diabetes and LADA. Its SubtypeDerivation uses boundary_type THRESHOLD (assigned a priori by GADA positivity before the other clusters are fitted), not STATISTICAL_PARTITION. Evidence: the cluster definition (PMID:31047901), the Mediterranean replication that assigns SAID by GADA and/or IA-2A and expects it to resemble LADA, and the observation that its metabolic profile depends on whether clinical type 1 diabetes is excluded (PMID:42083025). No children link to the LADA row was asserted, because no cited source states that one group contains the other.

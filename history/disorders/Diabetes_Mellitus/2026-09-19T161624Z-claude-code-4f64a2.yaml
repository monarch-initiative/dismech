  summary: 'Genetics pass: curate the monogenic/MODY arm, wire it to the pathograph,
    dispute four MONDO genes'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12194, epic #12189). The
    MODY and monogenic-diabetes genetics was re-derived from the primary literature
    before the issue's MONDO reconciliation checklist was opened; the identity of
    each numbered MODY MONDO term and its OMIM xref was then read directly from the
    MONDO build with runoak.

    Scope decision. This file is the umbrella the A2 refactor left in place after
    its blended mechanism graph was retired (see
    docs/curation-notes/diabetes-mellitus-grouping-refactor.md): diabetes mellitus
    is a Grouping over standalone type entries plus the
    diabetic_vascular_complications module, and the umbrella keeps the has_subtypes
    catalogue and disease-level framing. The monogenic arm has no other home - there
    is no standalone MODY or neonatal-diabetes entry - so it was curated here, and
    the type 1 and type 2 genetic records were deliberately left alone rather than
    being wired or reallocated.

    What changed. All fourteen numbered MODY rows plus renal cysts and diabetes
    syndrome lost the "MONDO-defined MODY subtype." placeholder and gained a real
    description, the OMIM identifier its number derives from, evidence, and a bound
    gene where the gene-disease relationship stands up. Nine genetic records were
    added: PDX1 (MODY4) and NEUROD1 (MODY6) as low-penetrance causes on the strength
    of the PMID:40779032 burden analysis; CEL (MODY8) restricted to proximal-VNTR
    frameshift alleles; INS as a monogenic claim distinct from the existing type 1
    susceptibility record; RFX6, which MONDO does not list for any MODY type, on
    PMID:29026101; and KLF11, PAX4, BLK and APPL1 as DISPUTED. A single
    "Monogenic Beta-Cell Dysfunction" pathophysiology node was added upstream of the
    shared hyperglycaemia node, carrying fifteen gene descriptors, so the monogenic
    genes reach the pathograph without reintroducing per-subtype mechanism the
    refactor removed. Gene-to-mechanism wiring went from 0/20 to 15/25.

    Disagreement with MONDO. Four MONDO-recorded causal genes are curated as
    DISPUTED. BLK, KLF11 and PAX4 fail cosegregation, population frequency and
    case-control burden in PMID:35108381 and were reclassified as refuted by
    ClinGen; APPL1 fails the same burden design in PMID:40779032, which supported
    PDX1 and NEUROD1 in the same run. The MONDO subtype terms are retained and each
    row states why no gene is bound to it. This is worth an upstream MONDO issue.

    Not wired, on purpose. The new INS monogenic record carries no gene descriptor
    on the mechanism node, because the pathograph keys gene edges on the gene
    symbol and doing so would also draw an edge from the type 1 INS-VNTR
    susceptibility record, which makes a different mechanistic claim. The nine type
    1 and type 2 records duplicate records in Type_I_Diabetes.yaml and
    Type_2_Diabetes_Mellitus.yaml, where they are already wired. Both decisions are
    recorded in the entry's notes.

    Validated with just validate, validate-terms, count-verified-snippets
    (511/511 across the four files in this PR), check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, list-gene-term-mismatches, check-genereviews,
    compliance-connectivity, and validate-disorders.

  summary: 'Review round 1: correct the PTF1A uniqueness claim and the ABCC8 case
    fraction scope'
  details: |
    Review round 1 on PR #12727.

    The PTF1A notes had called it the only gene in this catalog whose defect removes the beta-cell
    compartment rather than impairing it. The entry's own PDX1 record states that biallelic PDX1
    loss causes pancreatic agenesis, so the claim contradicted content in the same file. The note
    now says one of two, names PDX1 and where it is recorded, and keeps the cerebellar involvement
    as what distinguishes PTF1A.

    The ABCC8 permanent-form case fraction (12%) is measured in a cohort screened for both
    permanent and transient neonatal diabetes, so it is not specific to the subtype that record is
    keyed to. Its notes now say so, and point at the series that puts most ABCC8 neonatal diabetes
    in the transient group.

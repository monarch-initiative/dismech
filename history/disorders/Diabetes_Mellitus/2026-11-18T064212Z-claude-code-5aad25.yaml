  summary: Reallocate type-specific content to per-type entries; type rows become
    curated_in pointers
  details: |
    Part of finishing the diabetes mellitus grouping refactor (step 4 of docs/curation-notes/diabetes-mellitus-grouping-refactor.md): type-specific content left on the Diabetes_Mellitus umbrella entry was moved to, or deduplicated against, the per-type entries. Rows were moved as unchanged YAML blocks with their evidence; only umbrella subtype scoping was dropped and one model target was renamed to the destination node. Here: curated_in added to the type 1, type 2, gestational, NDM-CH and type 5 rows, clearing the five DOUBLE_MODELLED findings; LADA and SAID moved to Type_I_Diabetes; deleted rows already covered elsewhere (8 T1/T2 susceptibility genes, 4 phenotypes, 5 treatments, 4 datasets, 4 computational models, 6 exposures, 2 progression stages); moved HLA-DQA1/DQB1, 3 trials, the UVA/Padova simulator and 3 progression stages out. The four sections left empty were removed, and the notes paragraph that described these genetic records as deliberately not reallocated was deleted because it no longer holds.

  summary: 'Genetics pass: gene-defined neonatal diabetes subtypes (d2g series-030)'
  details: |
    Genetics pass for the d2g series-030 gap list (issue #12237), covering the gene-defined
    neonatal diabetes subtypes MONDO records under diabetes mellitus.

    Anchor and shape check first. The parent disease_term MONDO:0005015 "diabetes mellitus"
    resolves in OLS to that label. This entry was already refactored into an umbrella that keeps
    the has_subtypes catalog and disease-level framing while deferring mechanism to the
    per-type standalone entries and the diabetic_vascular_complications module, with a
    kb/groupings/Diabetes_Mellitus.yaml grouping alongside it holding MONDO:0005015 as a
    closeMatch. The gene-defined neonatal subtypes therefore belong in this catalog, and were
    added to it rather than as new Disease entries.

    What was added. Nine has_subtypes rows: PNDM1 (biallelic GCK), PNDM2 (KCNJ11), PNDM3 (ABCC8),
    PNDM4 (INS), TNDM2 (ABCC8), TNDM3 (KCNJ11), PNDM-PCAS (PTF1A), EIF2B1-NDM (EIF2B1), and
    NDM-CH (GLIS3). The transient and permanent neonatal rows gained children lists naming them.
    NDM-CH is curated in full as the standalone entry
    Neonatal_Diabetes_Mellitus_With_Congenital_Hypothyroidism.yaml; the row says so and exists so
    the catalog covers the syndromic neonatal forms as well as the isolated ones. Every MONDO id
    and label was read from OLS, and every HGNC CURIE live from rest.genenames.org, in the step
    the line was written.

    Nine matching genetic records were added, one per row, so each subtype has its reciprocal
    foreign key. Four genes needed a second record because the gene already had one scoped to a
    different subtype: GCK, KCNJ11, ABCC8 and INS each reach more than one subtype in this
    catalog, and the subtype key is single-valued. Each new record names in its notes which other
    record it is distinct from and why.

    Case fractions were added where the sources state a share: ABCC8 12% of neonatal diabetes in
    a 34-patient screen (permanent record), ABCC8 52% of transient cases screened in the relapsing
    series, and a counts-only record for KCNJ11 in transient neonatal diabetes (three of eleven
    probands) with the percentage deliberately left empty because the source states only counts.

    Pathograph. INS, PTF1A, EIF2B1 and GLIS3 were bound as genes descriptors on the Monogenic
    Beta-Cell Dysfunction node, whose stated purpose is to be where the monogenic genes reach the
    pathograph. INS was already named in that node's description ("an insulin-gene defect") but
    was missing from its gene list. The description was extended to name the new entry points:
    failure of the pancreas to form (PTF1A) alongside the existing transcription-factor,
    set-point, channel and syndromic clauses.

    ClinGen's expert-panel curation lumps these genes against one "monogenic diabetes" entity
    (MONDO:0015967) rather than against the numbered subtypes, and grades GCK, KCNJ11, ABCC8 and
    INS Definitive there. Each subtype row and genetic record says so explicitly rather than
    implying a subtype-level ClinGen grade. PTF1A has no ClinGen row for any disease, and EIF2B1
    has one only for leukoencephalopathy with vanishing white matter, not for diabetes; both facts
    are recorded in the gene notes naming the file that was searched.

    Two gap-list genes were dispositioned to kb/disorders/Type_2_Diabetes_Mellitus.yaml rather
    than added here: CAPN10 (MONDO:0011027) and TBC1D4 (MONDO:0014488). See that entry's history
    record for the reasoning.

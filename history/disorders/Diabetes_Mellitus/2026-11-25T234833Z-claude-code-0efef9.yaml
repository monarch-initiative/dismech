  summary: 'Gene-family review: monogenic diabetes genes (GCK, HNF1A, HNF4A, HNF1B,
    PDX1, NEUROD1, ABCC8, KCNJ11, INS, CEL, KLF11, PAX4, BLK, APPL1)'
  details: |
    The monogenic hub node (Monogenic Beta-Cell Dysfunction) bound 19 genes to an insulin-secretion process with no molecular function. Five gene-class nodes now feed it, each binding the activity its genes lose or gain: DNA-binding transcription activator activity, decreased (HNF1A, HNF4A, HNF1B, PDX1, NEUROD1; PMID:29931562, PMID:10545951); glucokinase activity, decreased (GCK; PMID:29931562, PMID:14578306); Kir6.2 channel activity and SUR1 potassium channel regulator activity, increased, for the activating neonatal-diabetes variants (KCNJ11, ABCC8; PMID:15115830, PMID:16885549); insulin receptor binding decreased with increased ER-stress response for misfolded or under-produced proinsulin (INS; PMID:17855560, PMID:20133622); and sterol ester esterase activity, abnormal, for the aggregation-prone CEL-MUT protein of CEL-MODY (PMID:21784842). The non-B7 genes (RFX6, PTF1A, EIF2AK3, EIF2B1, GLIS3, WFS1, ALMS1, CISD2, SLC19A2) remain on the hub. Genetic records: GCK (heterozygous), ABCC8 (general), HNF1B typed CAUSATIVE; KCNJ11 and INS type 1/type 2 risk records typed SUSCEPTIBILITY; PDX1, NEUROD1 and CEL retyped UNKNOWN because ClinGen rates them Moderate; KLF11, PAX4, BLK and APPL1 retyped from DISPUTED to REFUTED to match ClinGen's Refuted classifications. ClinGen tiers copied into gene_disease_validity for GCK, ABCC8, KCNJ11, INS (AD and AR), HNF1B (renal cysts and diabetes syndrome), PDX1, NEUROD1 (AD and AR), CEL and the four refuted genes, each quoting the CGGV row. HNF1B record re-scoped to the renal cysts and diabetes syndrome subtype. Entry notes updated to describe the split.

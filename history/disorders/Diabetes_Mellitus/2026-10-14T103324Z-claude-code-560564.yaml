  summary: Evidence-claim mismatch review (#14058)
  details: |
    Reviewed the 24 assertions the Jev evaluation (source revision 8702d8d) labelled MISMATCH at
    the claim level; the entry was unchanged since that revision.

    Corrected:
    - treatments "Dietary intervention" and "Physical activity increase": the USPSTF sentence on
      referring prediabetes to preventive interventions names neither diet nor exercise. Replaced
      with the Diabetes Prevention Program trial (PMID:11832527, newly cached): lifestyle goals of a
      low-calorie, low-fat diet and 150 min/week of moderate activity, and the 58 percent incidence
      reduction. Graded directness INDIRECT because the two components were delivered together and
      the outcome was prevention, not control of established disease.
    - "Physical activity increase" was bound to NCIT:C15302 Physical Therapy; rebound to
      NCIT:C62739 Exercise Intervention (already in the cache and the treatment-action enum) and
      tagged therapeutic_modality BEHAVIORAL.
    - definitions/1 (USPSTF screening algorithm): the referral sentence replaced with the
      abstract's POPULATION sentence, which states the scope and BMI thresholds the algorithm uses.
    - has_subtypes type 1 diabetes: neither existing snippet (an immune checkpoint inhibitor case
      report and a historical review) states the autoimmune, progressive beta-cell-loss description.
      Added the PMID:26404926 statement that it does; the case-report explanation now says it is
      context only.
    - progression "Presymptomatic autoimmunity": the snippet described stage 3 (symptomatic). Replaced
      with the PMID:26404926 definitions of presymptomatic stages 1 and 2.
    - phenotypes "Chronic kidney disease": removed the PMID:36619566 case-report item, whose sentence
      about renal biopsy does not bear on the phenotype.
    - differential_diagnoses diabetes insipidus and primary polydipsia: the diabetic ketoacidosis
      snippet is kept as the diabetes side of the polyuria/polydipsia overlap; explanations now say so.

    Retained after review:
    - environmental influences_mechanisms edges citing PMID:10522815 (target is the hyperglycemia hub,
      link type already INDIRECT_UNKNOWN_INTERMEDIATES; the hedge is stated in the descriptions).
    - environmental/8 and its edge: the USPSTF item is complemented by the PMID:29939616 mechanism item.
    - genetic notes-supporting items (GCK heterozygous contrast, KCNJ11 sulfonylurea figures, PTF1A
      mouse cerebellar evidence, ABCC8 ClinGen row) and the ABCC8 case fraction, whose cohort size is
      already carried by a separate METHODS-sentence item.
    - has_subtypes NDM-CH, MODY1, MODY4, monogenic diabetes: snippets support gene and subtype; the
      flags were on the classification field, which is structural.
    - computational model MICOM: model_software COBRApy is accurate (MICOM is built on it) though the
      abstract states only "open-source Python package".

    Validated with just validate, validate-terms, count-verified-snippets (237/237) and
    validate-disorders.

  summary: Link all nine exposures to the single shared hyperglycaemia node
  details: |
    Backfill for issue #8085. This entry is the retained umbrella for diabetes mellitus and carries exactly one pathophysiology node, the shared chronic hyperglycaemia that every subtype converges on; the subtype-specific routes live in the per-type entries and in the diabetic_vascular_complications module. All nine evidenced exposures therefore target that one node, and the grades rather than the targets are what separate them, which is stated in every link description so the uniformity does not read as indifference. Diabetogenic pharmacotherapy is the clearest causal exposure and the only one with a reversal design: the drug produces the disease and stopping it often reverses it, bounded by the authors' own note that persistence depends on duration, agent and body mass index. Immune checkpoint inhibitor exposure earns a separate edge from it because the mechanism differs, releasing the brakes on self-reactive T cells to produce insulin deficiency rather than the insulin resistance most diabetogenic drugs cause; it is PARTIAL because the only evidence is a single case report. Three exposures, the general islet-autoimmunity trigger, viral infection and early dietary exposure, all rest on the same sentence of the same paper, which names dietary factors and viruses together, so none can be placed above the others on evidence held here; early dietary exposure is nonetheless MODULATES rather than PREDISPOSES because that exposure's own description and effect field frame early feeding as modulating risk rather than initiating it, and because the randomised infant-feeding evidence curated in Type_I_Diabetes is negative. High-calorie diet is INDIRECT_KNOWN_INTERMEDIATES because its sentence names the intervening step, hyperinsulinaemia driving insulin resistance, while sedentary lifestyle is graded below it precisely because its sentence names no intermediate and reports co-rising prevalence. The obesogenic environment link is the weakest and its description says so: its only evidence is a screening recommendation, which implies risk without stating a mechanism or a magnitude. The environmental-determinants exposure is a meta-exposure rather than an exposure, asserting that context matters across subtypes without naming a context, and is recorded as MODULATES for that reason. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 142 of 147 with 5 pre-existing DOI-prefix skips.

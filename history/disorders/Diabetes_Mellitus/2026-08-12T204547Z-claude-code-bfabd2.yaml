  summary: Link all nine exposures to the single shared hyperglycemia node
  details: |
    Backfill for issue #8085. This entry is the retained umbrella for diabetes mellitus and carries exactly one pathophysiology node, the shared chronic hyperglycemia that every subtype converges on; the subtype-specific routes live in the per-type entries and in the diabetic_vascular_complications module. All nine evidenced exposures therefore target that one node, and the grades rather than the targets are what separate them. That was originally restated in all nine link descriptions, about 630 words of duplication; the reviewer of PR #8408 pointed out it is already on the target node and in this record, so it is now stated once, on the meta-exposure link, which is the umbrella-level exposure and the natural place for it. Diabetogenic pharmacotherapy is the clearest causal exposure and the only one with a reversal design: the drug produces the disease and stopping it often reverses it, bounded by the authors' own note that persistence depends on duration, agent and body mass index. Immune checkpoint inhibitor exposure earns a separate edge from it because the mechanism differs, releasing the brakes on self-reactive T cells to produce insulin deficiency rather than the insulin resistance most diabetogenic drugs cause; it is PARTIAL because the only evidence is a single case report. Three exposures, the general islet-autoimmunity trigger, viral infection and early dietary exposure, all rest on the same sentence of the same paper, which names dietary factors and viruses together, so none can be placed above the others on evidence held here; early dietary exposure is nonetheless MODULATES rather than PREDISPOSES because that exposure's own description and effect field frame early feeding as modulating risk rather than initiating it, and because the randomized infant-feeding evidence curated in Type_I_Diabetes is negative. The three adiposity exposures, high-calorie diet, sedentary lifestyle and obesogenic environment, are all INDIRECT_KNOWN_INTERMEDIATES. They were not: the original grading gave the link type to whichever exposure's snippet happened to recite an intermediate, which the reviewer of PR #8408 correctly identified as grading the wrong thing. The schema discriminates on whether the field knows the intervening steps, not on what the quoted sentence says, and all three traverse the same well-mapped adiposity to insulin-resistance route. Evidence strength is carried separately by supports, which is PARTIAL on the two thin items. The obesogenic environment link originally had the thinnest evidence in the entry, a screening recommendation that implies risk without stating a mechanism, so a second item was added from the already-cached PMID:29939616 that does state the mechanism: excess body fat as the primary acquired cause of insulin resistance, and insulin resistance as a route to type 2 diabetes. Its evidence_source is HUMAN_CLINICAL to match the two pre-existing items citing the same paper in this file. The environmental-determinants exposure is a meta-exposure rather than an exposure, asserting that context matters across subtypes without naming a context, and is recorded as MODULATES for that reason. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 143 of 148 with 5 pre-existing DOI-prefix skips.

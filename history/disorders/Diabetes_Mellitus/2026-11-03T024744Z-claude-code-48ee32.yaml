  summary: Attribute the 2008 FDA acceptance to the simulator developers
  details: |
    The only source for FDA's 2008 acceptance of the UVA/Padova simulator is the developers' own review (PMID:37743740), so the description and finding statement now attribute it to them and note that no FDA document is cited.

    Also retargeted the mechanism link from the Hyperglycemia phenotype to the Chronic Hyperglycemia (shared diabetic complication cascade) pathophysiology node, because check_computational_model_mechanism_targets accepts only pathophysiology nodes; the merge queue rejected the phenotype target. Added BOUNDARY_OMISSION and TEMPORAL_SCOPE divergences for the complication cascade and the meal-to-day time horizon the simulator does not cover.

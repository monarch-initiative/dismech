  summary: 'Publication-readiness review: Triglyceride Storage Disease Type 2'
  details: |
    Corrected a named-entity conflation between historical triglyceride storage disease type 2 (MONDO:0008602; OMIM:190430) and the distinct PNPLA2-related neutral lipid storage myopathy (MONDO:0012545; OMIM:610717). Rebuilt the entry around the 1973 family report and explicitly provisional 1974 classification: putative autosomal-dominant inheritance is PARTIAL, the ex vivo adipose assays are IN_VITRO, both causal associations are UNKNOWN, and retained fasting lipid mobilization is an explicit boundary condition. Removed unsupported PNPLA2, autosomal-recessive, Jordan anomaly, myopathy, cardiomyopathy, hyperCKemia, treatment, prevalence, model, trial, and molecular-diagnosis claims; added exact historical Type 1 and NLSDM differentials, an unresolved-causal-validity discussion with a proposed family/genomics/adipocyte experiment, and explicit dataset/GeneReviews exclusions. Four new reference caches and one sanctioned existing-cache refresh were generated only through just fetch-reference; GO:0030730 and its enum cache row were generated by term validation. Validation passed for schema, ontology terms, configured references, independent strict 15/15 exact snippets (including manual DOI-prefix verification by an independent auditor), target graph integrity, 1/1 phenotype connectivity with no mechanism-relevant gene expected, 16 focused data tests, duplicate keys, snippet guards, cache frontmatter/integrity, and diff check. The whole-KB graph command retains 74 unrelated baseline failures and reports none for this target. Independent semantic audit approved with zero blockers; stale reciprocal synonymy in two out-of-scope files is documented for separate collision-checked reviews.

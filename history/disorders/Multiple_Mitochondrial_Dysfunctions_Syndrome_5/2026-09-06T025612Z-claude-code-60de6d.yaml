  summary: 'Create: Multiple_Mitochondrial_Dysfunctions_Syndrome_5 (ISCA1, MONDO:0033282)'
  details: |
    Created MMDS5 as a per-gene Disease entry (stub entry_type decision: DISEASE), sibling to MMDS1/MMDS2 in this tranche and to the open MMDS4 (ISCA2) PR. GeneReviews chapter PMID:31580634 fetched, tagged and its Clinical Characteristics cross-referenced (milestone loss, infantile seizures, spasticity/hyperreflexia, nystagmus, hearing loss, lactate, white matter, ventriculomegaly, pachygyria all curated; hyperglycinemia carried only in the pathophysiology node because it is not specifically reported in ISCA1 patients). Chain: biallelic ISCA1 loss, failure of ISCA1-ISCA2 4Fe-4S assembly and transfer to NFU1, LIAS deficiency, combined dehydrogenase/GCS deficiency, complex I/II deficiency, bioenergetic failure and neuronal death; neuron-specific, myocardial and constitutive Isca1 rat models linked with limitations. Sources: PMID:28356563, PMID:29767723, PMID:32092383, PMID:33711344, PMID:32817474, PMID:32776106, PMID:37140997, PMID:35304126, PMID:34977489, PMID:31016283. One snippet trimmed at bracketed notation. The Edison/falcon deep-research run had not completed when the entry was written (runs relaunched with fallback). Validation: just validate pass, just validate-terms pass, count-verified-snippets 57/57, check-causal-targets and check-entity-refs clean.

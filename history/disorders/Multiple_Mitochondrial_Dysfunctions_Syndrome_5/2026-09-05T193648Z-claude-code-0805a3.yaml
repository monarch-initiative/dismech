  summary: 'Create: Multiple Mitochondrial Dysfunctions Syndrome 5 (ISCA1)'
  details: |
    De-novo curation of MMDS5 (MONDO:0033282, ISCA1), claimed at #11155.
    entry_type resolved to DISEASE and the stub deleted.

    Sources: the ISCA1 GeneReviews chapter (PMID:31580634) as the mandatory
    phenotype baseline, plus Shukla 2017 (PMID:28356563), Shukla 2018
    (PMID:30105122), Torraco 2018 (PMID:29767723), Beilschmidt 2017
    (PMID:28492233), Suraci 2021 (PMID:33711344), Bogdan 2020 (PMID:32092383) and
    the Isca1 knockout rat (PMID:37140997).

    Deep research: one OpenScientist run, committed with the entry. It contributed
    the third allele p.(Tyr101Cys) and the neuron-specific Isca1 knockout rat,
    which is the only in vivo model of this disorder and is now linked to two
    pathograph nodes through modeled_mechanisms with readouts and per-link
    limitations.

    Two report identifiers were wrong and were not used. HGNC:16947, given for
    ISCA1 in both the report header and its genetics section, is ERLIN1; ISCA1 is
    hgnc:28660. Nothing flagged it because just validate-research-terms hardcodes
    --skip-prefix HGNC, so gene CURIEs are never checked in a report; reported on
    #9845. The report also pairs the correct disease OMIM (#617613) with an ISCA1
    gene OMIM (*611006) that belongs to a different gene; no OMIM number is bound.

    An earlier draft of this entry independently bound hgnc:14059 for ISCA1, which
    is CELF6. just validate-terms caught it on the first run because the KB path
    does resolve HGNC through conf/oak_config.yaml. Two wrong gene identifiers for
    one gene in one session, one caught in seconds and one invisible; that
    asymmetry is what was reported on #9845.

    The report's quote validation reports 7 of 20 quotes unsupported and sets
    needs_review: true. All seven were checked against the cached text and are
    verbatim; six fail on iron-sulfur notation and one on an HGVS designation,
    both stripped by the snippet matcher. Reported on #9364. Several snippets in
    this entry therefore quote a bracket-free sentence where the bracketed one
    states the mechanism more directly.

    preflight-dr returns WARN rather than PASS, on ISCA2 being mentioned at 36% of
    ISCA1's rate. That is expected here and is not entity confusion: ISCA1 and
    ISCA2 are obligate heterodimer partners in the step this disease breaks, so a
    correct mechanistic report has to discuss both. No ISCA2-specific (MMDS4)
    clinical content was taken.

    Curation decisions. The glycine-cleavage branch is a mechanism node with a
    KNOWLEDGE_GAP attached, not a phenotype, because no cited source reports a
    glycine measurement in an ISCA1 patient. HP:0003819 (Death in childhood) is
    outside the PhenotypeTerm dynamic enum, so mortality is carried in progression
    instead, with the reason in notes. The case for a separate entry rather than a
    subtype of the MMDS series rests on ISCA1 being non-redundant with ISCA2 in the
    same knockdown experiment and on a migration abnormality the other subtypes are
    said to lack; the counter-argument is recorded in differential_diagnoses.

    Validation: just validate-disorders passes schema, terms and 41/41 snippets.
    check-entity-refs, check-causal-targets, check-duplicate-keys and
    check-enum-values are clean. Eight references fetched during research but not
    cited were pruned from references_cache rather than staged.

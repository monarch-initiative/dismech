  summary: Wire orphan phenotypes and constipation treatment into the pathograph (#11222)
  details: |
    Closed the four follow-up items from #11222, filed against the MMDS5 entry curated in #11168. (1) Connected the five orphan phenotypes: added downstream edges from the 'Lactic Acidosis' pathophysiology node to phenotypes 'Increased circulating lactate concentration' and 'Lactic acidosis' (both DIRECT, since the node's own description is literally the mechanism behind both readouts); from 'Respiratory Chain Complex I and II Deficiency' to 'Elevated circulating creatine kinase concentration' (INDIRECT_UNKNOWN_INTERMEDIATES, since the source reports the CK elevation without naming muscle as the tissue or stating the mechanism); from 'Leukodystrophy' to 'Ventriculomegaly' (INDIRECT_UNKNOWN_INTERMEDIATES, ex-vacuo dilation is plausible but not asserted by the cited co-occurrence); and from 'Biallelic ISCA1 Loss of Function' to 'Pachygyria' (INDIRECT_UNKNOWN_INTERMEDIATES, deliberately routed to the root genetic lesion rather than through the postnatal white-matter node, since the entry's own knowledge gap questions whether a prenatal migration defect can be explained by the postnatal respiratory-chain mechanism at all). (2) Added a 'Constipation' phenotype (HP:0002019, OCCASIONAL, cited to the GeneReviews surveillance line) so the pre-existing 'Constipation Prevention' treatment's target_phenotypes link resolves; left 'Supportive Care' (already documented as an umbrella entry) and 'Genetic Counseling and Carrier Testing' unconnected, adding a one-line note to the latter that it addresses reproductive risk rather than a manifestation. (3) Recorded the name-collision decision in notes: 'Leukodystrophy' (node+phenotype, identical spelling) is treated as one concept the flat namespace correctly collapses; 'Lactic Acidosis'/'Lactic acidosis' (differ only by case) is treated as two concepts, now joined by an explicit edge rather than left to accidentally diverge. (4) Fixed the stale notes sentence claiming MMDS4 (ISCA2) has no entry on main -- it merged in #11131 -- since the differential_diagnoses cross-reference is now live. Verified with just validate, just validate-terms, just count-verified-snippets (61/61), just check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading (whole-KB, no new findings), just validate-disorders, and pytest tests/test_data.py -k Multiple_Mitochondrial_Dysfunctions_Syndrome_5 (2 passed). Recomputed the pathograph directly to confirm all 13 phenotypes now have an incoming edge and all treatments with a target_phenotypes link resolve.

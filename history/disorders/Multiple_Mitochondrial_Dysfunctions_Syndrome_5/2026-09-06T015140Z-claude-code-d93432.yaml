  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 11168 in a single push.

    Blocking items.
    (1) The patient-fibroblast lipoylation and complex I/II measurement (PMID:32092383) was graded HUMAN_CLINICAL; regraded IN_VITRO, since an enzyme assay on cultured cells is in vitro whatever the cells came from. The entry notes had codified the wrong convention as a rule, so that paragraph was rewritten rather than just the one evidence item.
    (2) Two of the three GeneReviews MANAGEMENT sub-sections were unmined. Added Constipation Prevention (prevention of secondary complications) and three surveillance treatments: neurologic/nutritional/respiratory assessment at each visit, annual ophthalmologic evaluation, annual audiologic evaluation.
    (3) No treatment reached the two highest-frequency treatable manifestations. Split Antiseizure Therapy and Spasticity Management out of the Supportive Care prose, each with target_phenotypes, so they join the pathograph.

    Suggestions taken.
    (4) The lumped MMDS1-4 differential became four entries, each with its MONDO disease_term and distinguishing_features. MMDS4 is not yet on main; its curation PR is open, so that is a forward link.
    (5) Aconitase added to the 4Fe-4S client class on the assembly node, with a purified-protein reconstitution quote from PMID:28492233 graded IN_VITRO.
    (6) Third KNOWLEDGE_GAP added for the METTL17 mitoribosome branch, citing PMID:37823603 (newly fetched), whose own authors state the ISCA1 involvement as a proposal and measure the translation defect in BOLA3 and NFU1 cells rather than ISCA1 ones.
    (7) biochemical: section added with two markers reading out the two downstream nodes.

    Suggestion declined.
    (8) Penetrance not recorded. No cited reference states one, and the five reported individuals were all ascertained through the phenotype, so complete penetrance would describe ascertainment rather than the genotype. Recorded in notes.

    Validation: schema pass, term validation pass, 55/55 snippets verified (was 41/41), entity refs, causal targets, duplicate keys, enum values, qualifier terms, cache order and cache integrity all clean. Whole-KB gates contribute no findings for this entry. Cache change is 10 additive rows, no deletions or reordering.

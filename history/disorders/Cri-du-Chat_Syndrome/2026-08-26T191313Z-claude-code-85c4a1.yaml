  summary: Merge case-duplicate Cri-du-chat entry into Cri-du-Chat_Syndrome
  details: |
    kb/disorders/Cri-du-chat_Syndrome.yaml (created 2026-08-22, merged via PR #9370) and kb/disorders/Cri-du-Chat_Syndrome.yaml (created 2026-07-30) curated the same disease, MONDO:0007404, and differed only in the case of one letter. On a case-insensitive filesystem the two paths collide, so every macOS and Windows checkout carried a phantom modification that could not be discarded, and no rebase could run at all: git aborts with "cannot rebase: You have unstaged changes".

    Kept the older, substantially richer entry (12 pathophysiology nodes vs 4, 33 phenotypes vs 12, plus differential_diagnoses and discussions sections the newer one lacked) and ported every block the newer entry had that it did not: has_subtypes (terminal vs interstitial 5p deletion, PMID:11238681); a genetic entry for the 5p terminal deletion itself (de novo vs familial breakdown, paternal origin; PMID:10678657, PMID:11238681); the Growth Failure phenotype (HP:0001508, PMID:10678657); a Physical and Occupational Therapy treatment; and the four-item references bibliography. Every other phenotype in the newer entry was already present in the retained one under the same HP term.

    The newer entry's inheritance block was deliberately NOT ported: its single HP:0000006 autosomal-dominant block is less precise than the retained entry's HP:0001466 contiguous-gene-syndrome plus HP:0003745 sporadic blocks, which carry the same de novo and familial evidence across more evidence items.

    Per the append-only rule, the two history records written under the retired slug keep their original target.slug and target.path and gain a target.superseded_by block; the files move into this slug directory.

    Validation: schema passes; 95/95 snippets verified against cached references; term validation passes; check-duplicate-keys, check-folded-hyphens and check-title-snippets pass. check-snippet-length passes against the committed baseline. Its --against-ref origin/main mode reports 4 pre-existing snippets as new only because it builds the grandfather set by extracting git archive into a temp directory, which on a case-insensitive filesystem loses one of the two colliding files; all four are present in the committed CI-generated baseline under this path, and the collision this change removes is itself the cause of the misreport.

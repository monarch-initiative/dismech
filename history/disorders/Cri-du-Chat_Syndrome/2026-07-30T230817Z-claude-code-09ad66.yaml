  summary: 'Create: Cri-du-Chat Syndrome, 5p contiguous-gene deletion'
  details: |
    De novo curation of Cri-du-chat syndrome [MONDO:0007404, OMIM:123450, ORPHA:281], a contiguous-gene deletion disorder absent from the KB and previously unmentioned in any entry.

    Deep research: claude_code provider, 16 web searches over 26 turns, report at research/Cri-du-Chat_Syndrome-deep-research-claude_code.md. NEC preflight passed - the report's MONDO/OMIM/Orphanet identifiers and 5p-deletion subject matter all match the intended entity. DR output was treated as leads only; every PMID was independently fetched via just fetch-reference and every snippet verified against the cached abstract.

    GeneReviews: no article exists for this syndrome - PubMed search returned no hits, consistent with its chromosomal rather than Mendelian basis.

    Mechanism graph: 12 atomic pathophysiology nodes, 12 fully-evidenced causal edges, single connected component, no dangling targets, all verified programmatically. Modelled around the entry's distinguishing feature - separable 5p critical regions map to separable phenotype components: cry to distal 5p15.31 at 1.5 Mb and 640 kb by phenotype dissection, speech delay to 5p15.32-15.33, facial dysmorphology to 5p15.2-15.31, with cognitive severity dose-additive across three intervals per Zhang 2005 MRI-III. Candidate-gene arms CTNND2, SEMA5A and TERT are typed by evidence strength: CTNND2 and SEMA5A COOPERATING, TERT UNKNOWN, since none is individually sufficient. The CTNND2 arm carries interventional support from AAV-Ctnnd2 rescue in a CRISPR rat model of the syntenic deletion, tagged MODEL_ORGANISM and explicitly not offered as human-phenotype evidence.

    Evidence discipline: 67 snippets across 9 references, all verified as exact substrings under strict whitespace-normalised matching. That independent check is stricter than the repo validator, which de-hyphenates; it caught one hTERT snippet the repo validator passed, and that snippet was tightened. PMID:16953888 is cached as extracted PDF text with words hyphenated across line breaks, so several snippets are trimmed to start or end mid-sentence; every affected explanation says so explicitly, and a note in the entry records the convention. Hedged source wording - probably, potentially, could contribute - is preserved as PARTIAL rather than upgraded to SUPPORT.

    Prevalence: birth prevalence of 1:15,000 to 1:50,000 recorded as rate_low 2.0 and rate_high 6.7 per 100,000, midpoint 4.3. BAND_1_9_PER_100000 was cross-checked against the repo's own _band_from_rate at midpoint, low and high.

    Three discussions, each evidenced: KNOWLEDGE_GAP on the unidentified cry gene; HUMAN_MODEL_MISMATCH on whether the rat model's complement and neuroinflammatory signature has any human counterpart; KNOWLEDGE_GAP on the unresolved causal direction of the deletion-independent DNA methylation changes, where the source authors disclaim causal ordering themselves. The methylation node's single outgoing edge is typed UNKNOWN for the same reason rather than asserted causal.

    Validation: just validate passes for schema, terms and references. The reference validator was positive-controlled with a deliberately fabricated snippet to confirm it was genuinely checking rather than silently passing. Compliance 96.4 percent global and 96.9 percent weighted; residual gaps are datasets on proposed, not-yet-run experiments.

    Self-review completeness pass against the deep-research report caught a real gap:
    the first draft omitted several manifestations above the 10-percent blocking
    threshold. Added behavioural phenotypes - hyperactivity and self-injurious
    behavior - plus congenital heart defect, renal anomaly, sensorineural hearing
    impairment and scoliosis, bringing the entry to 27 phenotypes. Frequency bands
    were assigned only where the cited source supplies a number or an explicit
    qualitative term; cardiac, renal and hearing phenotypes carry no band because the
    review calls malformations "not very frequent" while contemporary cohorts report
    roughly a third for cardiac disease, and that disagreement is recorded in the
    phenotype description rather than resolved by picking a side. Genetic counseling
    was switched from MAXO:0000079 to NCIT:C15240, following the review skill's
    preference for NCIT on new entries.

    One reusable finding: the reference validator strips bracketed citation markers
    such as [44] from snippets before matching, so a snippet quoting review prose that
    contains an inline citation number will fail even though it is a faithful verbatim
    quote. The affected snippet was replaced with a bracket-free sentence, and all
    snippets were scanned to confirm no others contain bracketed markers.

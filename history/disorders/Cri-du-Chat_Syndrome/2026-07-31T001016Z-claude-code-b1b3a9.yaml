  summary: 'Address PR #7185 review round 2: correct AAV cache misstatement'
  details: |
    Review round 2 response on PR #7185. The reviewer re-verified all 87 snippets from scratch, negative-controlled the hyphenation trims by confirming the untrimmed variants fail to match, confirmed decline of finding 1, and confirmed the REFUTE item. Two items remained plus one suggestion; all three are now fixed.

    The important one was my error. I claimed the cached abstract of PMID:39965128 "reports only the cognitive benefit" of AAV-Ctnnd2 rescue. That is false. The abstract closes with "However, the effectiveness of this therapy is confined to the early developmental stages and does not fully restore all CdCS symptoms." My earlier check searched for the reviewer's specific terms - liver, toxicity, window, social, memory, rescue - and that sentence contains none of them, so a keyword search missed it where reading the abstract's closing lines would not have. The inaccurate clause was removed and replaced with a statement of the actual limits, and the sentence is now cited as a second PARTIAL MODEL_ORGANISM evidence item on the CTNND2 edge. Misdescribing the contents of one's own cache is worse than the original omission, so this was the priority fix.

    Also added: the cohort's own frequency statement ("short neck, scoliosis, cardiac anomalies, and speech delay were present in 25-59% of the cases and should be considered frequent findings in the syndrome") as a second evidence item on Congenital Heart Defect and on Scoliosis. Congenital Heart Defect previously asserted a source disagreement in its description while citing only the Orphanet side, so a reader was told sources conflict but shown one of them. No frequency band is asserted for the cardiac phenotype: the 25-59% interval straddles the OCCASIONAL/FREQUENT boundary and the two sources disagree in direction.

    Dropped the redundant inheritance_term (HP:0001466 Contiguous gene syndrome) from the Recurrence risk block; it described the mechanism rather than recurrence risk and duplicated the term on the block above.

    Declined the optional extension of second-source frequency support to the craniofacial phenotypes. Those already carry per-feature Italian Registry percentages from PMID:16953888, which are more precise than the cohort's "around or higher than 60%" aggregate; adding the aggregate would be redundant without improving support.

    Validation: just validate passes; 90 snippets across 10 references verified as exact substrings under strict whitespace-normalised matching; graph unchanged at 12 nodes / 12 edges; compliance 96.3 percent global and 96.6 percent weighted. Evidence mix now 78 SUPPORT, 11 PARTIAL, 1 REFUTE.

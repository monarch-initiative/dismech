  summary: 'Create: Cri-du-chat Syndrome (5p deletion)'
  details: |
    Created new entry for Cri-du-chat syndrome / 5p- (MONDO:0007404). Curated from primary literature via PubMed (no DR-provider run): PMID:16953888 (Cerruti Mainardi 2006 Orphanet review - region, cry, features, SEMA5A/CTNND2/TERT, incidence, no specific therapy), PMID:11238681 (80-patient genotype-phenotype - two critical regions 5p15.2 dysmorphism/ID and 5p15.3 cat cry, size-severity correlation, ~90% paternal origin), PMID:10678657 (85% de novo vs 10-15% familial translocation; behavior), PMID:15733271 (critical-region refinement). Modeled the two critical regions as separate pathograph branches and deletion-size->severity via has_subtypes/notes. Schema + term validation pass; all 27 snippets verified against cache.

  details: |
    Reviewed the existing chondrodysplasia_punctata assignment as part of a sweep over ISDS group 23. Updated notes from 2019 to 2023-revision provenance, naming the three nosology rows this single dismech entry lumps (NOS 23-0070 GNPAT, NOS 23-0080 AGPS, NOS 23-0090 FAR1) and recording that the 23-0080 row label misspells the gene symbol as AGP5. All three rows sit in the same group, so the assignment remains a single value. Added harrisons_chapter and icimd_category glycerophospholipid_metabolism, contrasted in the notes against the peroxisomal_biogenesis assignment used for the import-receptor forms. No content outside the classifications block was changed.

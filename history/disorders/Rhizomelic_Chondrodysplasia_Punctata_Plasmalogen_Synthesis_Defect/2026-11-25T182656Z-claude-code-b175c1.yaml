  summary: 'Gene-family review: GNPAT, AGPS, FAR1'
  details: |
    The RCDP2 subtype was bound to MONDO:0009112, which MONDO has made obsolete with MONDO:0100273 (now labelled 'rhizomelic chondrodysplasia punctata, type 2', carrying the OMIM:222765 cross-reference) as its replacement; the subtype is rebound to MONDO:0100273. That term is the one ClinGen classifies GNPAT for, so the GNPAT record now carries the Definitive tier (CGGV:assertion_ba96f922-5ec9-4404-b2e4-66c31c2dcda6-2020-02-07T170000.000Z) with subtype RCDP2. The three ClinGen record citations were graded HUMAN_CLINICAL and are now OTHER, the grading used for a ClinGen row elsewhere in the KB. The GNPAT, AGPS and FAR1 records now name their subtypes (RCDP2, RCDP3, RCDP4). FAR1 is retyped from CAUSATIVE to UNKNOWN because ClinGen rates FAR1 deficiency Moderate, below the Definitive or Strong validity CAUSATIVE denotes. AGPS remains without a copied tier: ClinGen classifies it for MONDO:0100274 alkylglycerone-phosphate synthase deficiency, the parent of the RCDP3 term MONDO:0010823 bound here. The single enzyme node keeps the three enzyme activities (GO:0016287, GO:0008609, GO:0102965), each correct for its gene.

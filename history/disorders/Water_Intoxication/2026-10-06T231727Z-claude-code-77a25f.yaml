  summary: 'Create: Water Intoxication'
  details: |
    New Disease entry for water intoxication (MONDO:0022007), an exposure-defined disorder of excess electrolyte-free water relative to renal excretory capacity, with two has_subtypes for the two best-documented exposure contexts: compulsive drinking in psychiatric illness and overdrinking during endurance exercise.

    Deep research: Edison Falcon (research/Water_Intoxication-deep-research-falcon.md, 18/18 references verified, confabulation_rate 0.0). needs_review was set for one off-topic DOI and for the template placeholder 'if available' being echoed as the MONDO label; neither is a content defect. The report was used as a lead set and nothing was copied from it: every citation was re-fetched into references_cache/ and snippet-verified, and every CURIE was looked up in OAK while writing. The report was notably disciplined about scope, insisting that water intoxication is not synonymous with hyponatremia and that treatment trials enroll mixed etiologies, and the entry's scoping note follows that.

    Pathograph: 7 nodes. Chain is free-water intake exceeding renal excretory capacity -> net electrolyte-free water retention -> osmotic water shift into cells -> cerebral edema with raised intracranial pressure -> hyponatremic encephalopathy -> seizure, coma, headache, nausea and vomiting, confusion. Non-osmotic vasopressin release is a second environmentally-rooted node feeding the same retention step rather than being obligatory, because in pure polydipsia vasopressin is appropriately suppressed and intake alone suffices. Retention also branches to rhabdomyolysis via an INDIRECT_KNOWN_INTERMEDIATES edge naming the osmotic-shock intermediates the source gives.

    Deliberate modeling decision worth flagging for review: osmotic demyelination after overly rapid correction is a pathophysiology node with no incoming disease edge, because its trigger is an intervention rather than the intoxication. It is reached from the hypertonic saline treatment via target_mechanisms with treatment_effect MODULATES, and from desmopressin with INHIBITS. The reasoning is recorded both in that node's notes and in the entry notes so it does not read as an orphan oversight. The sources are explicit that central pontine myelinolysis in these patients is usually attributable to management rather than to the water intoxication.

    Other deliberate decisions, recorded in notes: (1) No frequency bands on any phenotype; the report searched for per-phenotype frequencies and found none for water intoxication itself, and the one quantified figure (symptomatic exercise-associated hyponatremia in under 1% of marathon runners) sits on the subtype where it belongs rather than on a phenotype. (2) No genetic section; the AVP-AVPR2-AQP2 pathway modifies the response to a water load but ordinary water intoxication has no demonstrated pathogenic variant, and inherited gain-of-function AVPR2 disease (NSIAD) is recorded as a differential diagnosis instead. (3) The vasogenic-versus-cytotoxic question is left unresolved: cell swelling is asserted, and the rat experiment's reduced tight-junction transcripts with no detectable fluorescein leak are both recorded, with the authors' own caveat that the transcript change is not proof of a clinically important leak. (4) Three evidence items carry directness: INDIRECT where a source states a recommendation or attribution rather than measuring the mechanism.

    One error was caught by the pre-write hook and is worth recording: I wrote GO:0030104 'water homeostasis' from memory after a prefix search returned nothing, and the term is obsolete. The hook blocked the write, a proper search found GO:0003091 renal water homeostasis, and the file was re-emitted. Seven further GO terms in the entry were then explicitly checked for obsoletion before re-emitting. A scripted audit of all reference_titles against their own cache files reports 9/9 matching.

    Validation run and read: just validate (0 issues), just validate-terms (passed), just count-verified-snippets (89/89), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), just check-qualifier-terms (2 labels match; 2 RO terms unvalidatable by any current tooling), just check-coarse-phenotypes (no new unexplained bindings), just check-term-cache-integrity (OK), just check-case-collisions (OK), and the authoritative just validate-disorders batch (89 snippets, 98 titles, 0 issues). New terms were seeded by pointing conf/oak_config.yaml at local sqlite adapters for the validator run and then restoring it; conf/ is unmodified in the diff and all cache rows were written by the validator itself.

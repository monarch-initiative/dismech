  summary: 'Review round 1: Water Intoxication'
  details: |
    Addressed the ai4c-reviewer round on PR #13633 in one push. All four blocking items accepted; two were real curation errors rather than omissions.

    CRITICAL (item 1), confirmed. references_cache/PMID_40913680.md was genuinely not committed, and it is the entry's most-cited source. Root cause was a shell staging loop, 'while read r; do git add ...; done' over a list written without a trailing newline: read returns false on the unterminated final line, so git add never ran for it and nothing warned. The dropped file was the alphabetically last cited PMID in each of three PRs from this session (#13631 PMID_988568, #13632 PMID_42302087, #13633 PMID_40913680); all three are corrected. Staging is now verified per cited reference with git ls-files --error-unmatch, reporting 9/9 here.

    IMPORTANT (item 2), accepted. The Seizure phenotype cited a snippet about the sodium concentration while its explanation asserted a tonic-clonic seizure that the quote did not contain. The actual seizure sentence from the same abstract is now the lead evidence item, with the sodium sentence retained behind it as the severity measurement and its explanation rewritten to claim only that. This was an explanation asserting more than its snippet, which is the defect the reviewer identified.

    IMPORTANT (item 3), accepted, and the reviewer's reading of the source is right. The snippet presents cerebral and pulmonary edema as parallel consequences of the same osmotic imbalance; it does not say one causes the other, so an edge from the cerebral node asserted a step the source does not support, and INDIRECT_UNKNOWN_INTERMEDIATES did not rescue it. The edge was moved to Net electrolyte-free water retention, which is the node the quoted sentence actually implicates, and its description now states that the source presents the two edemas as parallel.

    IMPORTANT (item 4), accepted. Two quotes from the introduction of the rat study PMID:40603486 were graded MODEL_ORGANISM although neither describes the rat experiment. Both now carry quote_role: BACKGROUND with evidence_source: HUMAN_CLINICAL, graded from what the quoted sentence describes. The reviewer's further suggestion was also taken: the rat study's own result is now cited as MODEL_ORGANISM with quote_role: PRIMARY_RESULT ('increased brain water content and downregulation of tight junction gene expression, although leakage of the BBB was not observed'), which supplies the citation the vasogenic-versus-cytotoxic note previously lacked.

    Suggestions taken. The desmopressin-to-ODS link now leads with the sentence that names desmopressin specifically, keeping the general re-lowering sentence behind it marked directness: INDIRECT because it does not name the drug. NCIT:C60814 Hypertonic Saline was added as a second therapeutic_agent, and therapeutic_modality on that treatment was changed from SMALL_MOLECULE to OTHER, since an electrolyte infusion is not a small-molecule drug. quote_role: REVIEW_SYNTHESIS was added to the three PMID:40618460 forensic-review items. Urine osmolality was added as a biochemical entry with both the polydipsia and the contrasting SIADH urine findings quoted, since it is the measurement that discriminates them. An animal_models entry for the Bordoni mouse model was added with modeled_mechanisms targeting Cerebral edema with raised intracranial pressure at model_scale ORGANISM, two intracranial-pressure readouts, and limitations recording the intraperitoneal route, the abruptness of the severe protocol, and that co-administered antidiuretic conflates the intake and reduced-clearance arms of the human mechanism.

    Suggestions not taken, with reasons. No NCIT fluid-restriction term exists: searching the local NCIT build for 'Fluid Restriction' returns only NCIT:C193355, a KDQOL-36 questionnaire item, so NCIT:C15900 with the detail in preferred_term remains the best available binding. Iatrogenic hypotonic-fluid administration was left in the disease description rather than promoted to a second environmental entry, because no cached source here states it as a documented exposure route with its own evidence, and an environmental entry needs its own citation. D5W remains in the desmopressin treatment description for the same reason: no cached snippet names it.

    links.prs now records #13633, which the reviewer noted was empty on the previous record.

    Validation after the fixes, run to completion and read: just validate-disorders (98 snippets, 107 titles, 0 issues), just validate-terms (passed), just count-verified-snippets (98/98), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), and uv run pytest tests/test_data.py -k 'model_readout or animal or entity_ref' (3552 passed). conf/ is unmodified.

  summary: Enriched SYT1 Baker-Gordon Syndrome with synonyms, Harrison's classifications, SYT1 gene/molecular function/cellular component grounding, downstream phenotype connectivity, and phenotype-targeted treatment links.
  details: >-
    Added disease synonyms, Harrison's chapter classifications (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE) backed by PMID:30107533, and SYT1 gene
    (hgnc:11509), molecular function (GO:0005509, GO:0005544, GO:0000149), and
    synaptic vesicle (GO:0008021) grounding on Dominant-Negative Synaptotagmin-1 C2B
    Dysfunction with in vitro membrane-penetration evidence (PMID:25705886). Connected
    Disrupted Neurotransmission and Impaired Neurodevelopment to all seven phenotypes
    (INDIRECT_UNKNOWN_INTERMEDIATES on congenital Ophthalmic Abnormality), aligned DE_NOVO variant_origin and
    added variant-level evidence on I368T, added diagnostic presence flags, and
    retargeted Supportive and Developmental Care to its managed phenotypes with
    INDIRECT evidence scoped to the founding case.

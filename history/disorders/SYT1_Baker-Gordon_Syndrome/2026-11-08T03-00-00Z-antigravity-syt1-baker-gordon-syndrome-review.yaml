  summary: Enriched SYT1 Baker-Gordon Syndrome with Harrison's classifications, SYT1 gene/molecular function/cellular component grounding, full downstream phenotype connectivity, and treatment evidence/target mechanisms.
  details: Added Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) backed by PMID:30107533. Grounded Dominant-Negative Synaptotagmin-1 C2B Dysfunction in SYT1 (hgnc:11509), calcium/phospholipid/SNARE binding molecular functions (GO:0005509, GO:0005544, GO:0000149), and synaptic vesicle membrane (GO:0008021), and connected Disrupted Neurotransmission and Impaired Neurodevelopment to all seven phenotypes. Added variant-level evidence on I368T, diagnostic presence flags, and treatment modalities, target_mechanisms, and verbatim evidence.

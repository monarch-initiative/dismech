  summary: 'Create: SYT1-Associated Neurodevelopmental Disorder (Baker-Gordon)'
  details: |
    Created SYT1-Associated Neurodevelopmental Disorder / Baker-Gordon syndrome (MONDO:0033864), the calcium-sensor/fusion-arm conformer of the synaptic_vesicle_cycle module (dominant-negative synaptotagmin-1 C2B -> impaired Ca2+-triggered synchronous fusion -> disrupted neurotransmission). Distinctively NOT an epileptic encephalopathy (seizures absent). References PMID:30107533 (Baker Brain 2018, 11-patient series, C2B variant cluster), PMID:25705886 (Baker JCI 2015, founding I368T case, in vitro dominant-negative). Validated: schema, terms, exact-substring snippet check (21/21). Added to Synaptic_Vesicle_Cycle_Disorders grouping (SATISFIED).

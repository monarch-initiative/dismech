  details: |
    Addressed review round 1 on PR #12167.

    CRITICAL (reviewer-found factual error). The entry asserted in four places that only one patient has been reported. PMID:33054089 (Thian et al. 2020, Haematologica) reports a second, unrelated patient with germline biallelic PIK3CG mutations, and this PR already committed that reference cache without citing it. Reworded the top-level description, the prevalence notes, the prevalence explanation, the clinical_burden rationale and the animal-model limitations so that 'one patient' now reads 'the index patient' where that is what is meant, and added PMID:33054089 to references:. Added an evidence item quoting PMID:38961274's restatement of the second case.

    The second report initially looked uncitable and then turned out not to be, which is worth recording. On first fetch its cache carried content_type: unavailable with no body, so nothing in it could be quoted under the exact-substring rule, and the first draft of this round cited it only through PMID:38961274's one-sentence restatement and said so in the prevalence notes and the discussion. A later validator run refetched it and obtained the open-access full text from PMC (content_type: full_text_xml), at which point the paper became directly quotable. The entry now cites the primary report in five places and the prose asserting that it could not be quoted has been removed, because it was about to become a false justification of exactly the kind this repository warns about: a note telling the next reader not to bother checking something that is in fact checkable.

    Citing the primary changed the content, not just the provenance. The second patient presented at fourteen with fever, hyperferritinaemia, hypertriglyceridaemia and haemophagocytosis, short of HLH criteria, with an NK-cell defect, and is stable on anakinra; the index patient presented in childhood with an antibody defect, autoimmune cytopenias and lymphocytic infiltration of lung and gut. The two also disagree about residual kinase activity: the primary report finds p110gamma expressed at normal levels and then shows by reconstitution that neither allele restores CD69 upregulation, while the later B-cell study calls the same kinase potentially hypomorphic on the basis of normal serum IgG. The discussion records both and asserts neither.

    Rewrote discussion pik3cg_single_patient_evidence_base as pik3cg_two_patient_evidence_base. Its old closing line proposed as future work ('a second unrelated kindred would change what can be asserted here') something that had already happened. The rewrite keeps the part that is still true (every HUMAN_CLINICAL item here traces to the index patient) and replaces the proposal with the question the second case actually opens: the two patients differ in humoral severity, the second kinase is described as potentially hypomorphic, and with two different allele sets no genotype-phenotype correlation can be drawn.

    IMPORTANT 1. CXCR3-Positive T Cell Tissue Infiltration bound its cell type to CL:0000084 (T cell) while both preferred_term and snippet specify CD4. Rebound to CL:0000624 (CD4-positive, alpha-beta T cell), already in cache/cl/terms.csv.

    IMPORTANT 2. Added phenotype Decreased specific antibody response to vaccination (HP:0032140), quoting the index patient's immunization pattern from PMID:38961274 (normal tetanus response, weak responses to weaker immunogens), and wired it downstream of Impaired Adaptive Lymphocyte Compartments so it is not a disconnected node. HP:0032140 chosen over HP:0012475 because the quoted finding is specifically about vaccination.

    Also taken, from the round's blue suggestions and its own checklist rather than from a
    blocking finding: four further phenotypes from the index report (thrombocytopenia,
    lymphadenopathy, splenomegaly, recurrent sinopulmonary infections); a causal edge from
    the regulatory T cell deficit to the autoimmune haemolytic anaemia, which was the one
    phenotype in the entry with no incoming edge, plus the same edge for the new
    thrombocytopenia; a sequela edge from the immunoglobulin deficit to the recurrent
    infections; a diagnosis section (trio whole exome sequencing, and p110gamma
    immunoblot as the step that turns two variants into a demonstrated null); and a
    paragraph in the pro-versus-anti-inflammatory discussion recording the anti-p40
    therapeutic corollary, which is noted there rather than curated as a treatment because
    no reported patient has received such an agent.

    Lymphadenopathy and splenomegaly are left with no incoming edge on purpose, with a notes
    line on each saying why: both of the entry's arms are plausible upstreams for
    lymphoproliferation and the source states the finding without attributing it, so an edge
    would assert a mechanism the entry cannot support. Connectivity is therefore 7/9 rather
    than 9/9, which is the honest number.

    Validation: just validate 35/35 snippets verified (was 25/25); check-folded-hyphens, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all clean; full CI preflight incl. pytest tests/test_data.py run before push.

  summary: 'Create: Immunodeficiency_97_With_Autoinflammation'
  details: |
    De novo curation of IMD97 / PI3K-gamma deficiency (MONDO:0030717) from primary literature plus an openscientist deep-research report.

    The first deep-research run for this MONDO ID came back about the wrong gene. It was 55 KB about TBK1, with zero mentions of PIK3CG, and it asserted that biallelic IMD97 is TBK1-related. MONDO's own RO:0004003 relation gives MONDO:0030717 has material basis in germline mutation in HGNC:8978 PIK3CG; MONDO's clinical description of the term is the PIK3CG patient of PMID:31554793 sentence for sentence; and MONDO files TBK1 biallelic autoinflammation under a separate term, MONDO:0971173 autoinflammation with arthritis and vasculitis. So the report was off-subject, not merely thin. just preflight-dr caught it but softened its verdict to reconcile rather than discard, because the report cited OMIM 619802, the correct xref for this MONDO term. Filed as dismech#12166: the OMIM anchor is not independent evidence when the report looked up the right identifier and wrote about the wrong gene under it.

    That first report was not committed. It was preserved outside the repository as evidence for the issue, and the run was repeated with the disease name disambiguated in the prompt. The second run is the committed artifact and is on subject: preflight-dr reports PIK3CG=30 mentions and PIK3CG as the top gene. Its correctness is therefore partly attributable to my disambiguation rather than to the provider unaided, and that should be read into any comparison of provider performance.

    The second run also exited without writing validation blocks, so both were retro-fitted with just validate-research-reference and just validate-research-terms. Reference validation: 16/16 resolved, zero unresolved. Term validation found six NCIT identifiers named as different terms - NCIT:C15839 offered as Antibiotic Therapy is Prevention and Treatment Evaluation; NCIT:C15267 as Immunosuppressive Therapy is Laryngectomy; NCIT:C2140 as Monoclonal Antibody Therapy is Adjuvant. None was used. Worth recording that NCIT procedure and drug CURIEs were the fabricated class in this report and also in a review comment on a sibling PR in the same session, which suggests the failure concentrates in that vocabulary rather than being uniform across ontologies.

    The first run additionally failed to fetch PMID:41171761 with HTTP 429 and recorded it as 'Identifier did not resolve to a record'. That paper exists. Commented on the existing dismech#11120 with the observation that the failure cause is known at the moment of failure and discarded one line later, which makes the proposed fix cheaper than that issue assumed.

    The entry was written from the primary literature before either report landed, and its substance does not depend on them. The report contributed one substantive addition: PMID:33661099, giving the protein-level mechanism by which mutations at the C-terminal residue R1021 inactivate the enzyme - and that oncogenic mutations at the same residue activate it, which is why this gene supports two opposite disease directions.

    Two evidence-shape decisions. Everything graded HUMAN_CLINICAL traces to a single reported patient, recorded as an explicit KNOWLEDGE_GAP rather than left for a reader to infer from the prevalence block. The mouse knockout recapitulates the disease only after co-housing with pet-store mice to acquire natural microbiota, recorded as a HUMAN_MODEL_MISMATCH because the experiment that establishes the dependence - varying microbial exposure at fixed genotype - has no human counterpart.

    gnomAD constraint data from the report (pLI, LOEUF) was not added: it comes from a database rather than a citable paper with a quotable sentence, and the same call was made on a sibling PR in this session for consistency.

    Validation: just validate passes with 25/25 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and pytest test_disorder_file all pass. GeneReviews: NO_CHAPTER, expected for a disorder defined in 2019 from one patient.

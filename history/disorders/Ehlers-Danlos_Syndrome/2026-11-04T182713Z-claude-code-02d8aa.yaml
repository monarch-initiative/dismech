  details: |
    Deferred work from PR #12907 (issue #12260), tracked on #12931. Bound subtype_term on the Hypermobile, Vascular, Kyphoscoliotic, Dermatosparaxis, Classical-like and Periodontal rows, using each sibling entry's own disease_term, and set curated_in so each row points to the entry that curates it in full. Added a Classical EDS type 2 row bound to MONDO:0019568 (COL5A2) and moved the COL5A2 genetic subtype key onto it. Added four gene-specific mechanism nodes with GO molecular-function bindings that match the sibling entries: fibrillar collagen chain defect (COL1A1, COL3A1, COL5A1, COL5A2), ADAMTS2 procollagen N-proteinase loss, PLOD1 lysyl hydroxylase 1 loss, and tenascin-X loss. Each feeds the existing Collagen Abnormalities node. Put C1R and C1S on the existing complement node, together with serine-type endopeptidase activity and an IN_VITRO quote. All evidence reuses quotes already verified in this entry or a sibling entry, with the same evidence_source. Validated with just validate-disorders, validate-terms, check-gene-activity-grounding, check-granularity (6 pointers, 0 mismatches), check-entity-refs, check-causal-targets and check-name-collisions.

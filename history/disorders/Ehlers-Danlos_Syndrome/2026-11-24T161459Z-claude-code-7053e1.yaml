  summary: Add pointer subtype rows for five EDS types curated in their own entries
  details: |
    Added has_subtypes pointer rows (curated_in + MONDO subtype_term) for arthrochalasia (MONDO:0007525), cardiac-valvular (MONDO:0009159), musculocontractural (MONDO:0011142), myopathic (MONDO:0034022, the term the Myopathic_Ehlers-Danlos_Syndrome entry itself binds) and spondylodysplastic (MONDO:0007526) EDS. Each term's label was read from OLS and each was confirmed to sit under MONDO:0020066. Descriptions summarize the target entries; no genes or evidence were added, following the existing Vascular and Kyphoscoliotic pointer rows, because the gene-level curation lives in the target entries. Brittle cornea syndrome was deliberately not added: its own entry states it is not among the 2017 EDS subtypes, which conflicts with the 2017 classification, and that conflict needs resolving in the BCS entry first. Validated with just validate, validate-terms, check-entity-refs, check-causal-targets and check-granularity (POINTER_TERM_MISMATCH 0).

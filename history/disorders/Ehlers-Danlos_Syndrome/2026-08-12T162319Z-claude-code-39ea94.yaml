  summary: Link trauma and repetitive motion to the tissue injury node
  details: |
    Backfill for issue #8085. Physical trauma is EXACERBATES with DIRECT into the tissue injury node, because the cited sentence reports exactly what that node holds, severe mucocutaneous injury after only minor trauma. Exacerbating rather than triggering, since the fragility is constitutional and present before any trauma; what the exposure changes is how much injury a given force produces. Repetitive motion is graded well below it, and two things about that exposure are worth recording. Only one of its two evidence items bears on the claim at all, and it concerns soft tissue injury and muscular strain caused by muscular imbalance rather than by repetition, so the link cites that one alone. The other item's own explanation concedes that the snippet does not state that repetitive motion exacerbates symptoms, and it was not carried. Separately, this exposure carries a review_notes field recording that it was added based on domain knowledge rather than from a source, which is consistent with the thinness of its evidence and is the honest explanation for why the link is graded as low as it is. The repetitive motion link was REMOVED on review. Its only carried snippet concerns soft tissue injury and muscular strain caused by muscular imbalance, explicitly a different route from repetition, and the exposure itself carries a review_notes field recording that it was added from domain knowledge rather than a source. Stating that limitation in the link description was not enough: EXACERBATES is a causal predicate that scores as a mechanistic explanation of the target, so the edge asserted more than the prose conceded. This is the same no-route-to-the-node reasoning used to drop Dieulafoy_Lesion from the tranche, applied a step earlier, to whether to draw the edge at all. The physical trauma link is unchanged. Its systematic review item was retagged HUMAN_CLINICAL, since a systematic review aggregates human clinical data. Validated with linkml-validate and just validate-terms.

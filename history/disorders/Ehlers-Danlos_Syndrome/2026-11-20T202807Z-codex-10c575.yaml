  summary: Map Ehlers-Danlos Syndrome to OMIMPS:130000
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS130000 is the full Ehlers-Danlos family series, containing classical type 1 and type 2 alongside vascular, hypermobile, and other non-classical forms. This subtype row describes classical EDS (MONDO:0007522), so the series is a broader target. This mapping belongs to the classical subtype and does not equate classical EDS with all EDS or restrict it to COL5A1 alone.

  details: 'Completed review and enhancement of Non-functional_Pancreatic_Neuroendocrine_Tumor: - Added UBERON location (pancreas) to the existing MEN1/DAXX/ATRX Chromatin Regulator Inactivation and mTOR Pathway Activation pathophysiology nodes and CL cell_types (neuroendocrine cell) to the mTOR node. - Connected Silent Well-Differentiated Pancreatic Neuroendocrine Tumor Growth directly to Pancreatic Mass and Mass Effect and Metastatic Presentation to Abdominal Pain, Hepatic Metastases, and Jaundice. - Clarified that the 57.5% Chromogranin A elevation rate in PMID:40314740 comes from a mixed functional/non-functional resected pNET cohort (77.5% non-functional) and noted NCIT:C17204 as the representative modality for cross-sectional/endoscopic imaging. - Added therapeutic_modality to five treatments, category: Cancer, NCIT diagnosis_terms for the imaging rows, classifications (Harrison''s chapters, ICD-O morphology Neuroendocrine Neoplasm), and MONDO exactMatch mapping.'

  summary: 'Create: Oculopharyngeal Muscular Dystrophy'
  details: |
    Created the OPMD entry (MONDO:0008116) from scratch: four-node pathophysiology
    chain (PABPN1 polyalanine tract expansion -> PABPN1 misfolding and intranuclear
    aggregation -> sequestration of poly(A) RNA and proteostasis machinery ->
    skeletal muscle fibre degeneration), eight phenotypes, dominant and recessive
    inheritance blocks, the PABPN1 genetic record, a founder-population prevalence
    record, five treatments, and an OPDM differential diagnosis. The aggregation
    node declares conforms_to loss_of_proteostasis#Misfolded-Protein Aggregation;
    the polyglutamine module was considered and rejected because OPMD is a
    polyalanine, not a polyglutamine, expansion. 49 evidence snippets across 10
    references, all verified as exact substrings of the fetched cache.

    THE DEEP-RESEARCH REPORT'S CITATION LIST WAS UNUSABLE AND WAS NOT USED. The
    report (research/Oculopharyngeal_Muscular_Dystrophy-deep-research-claude_code.md,
    claude_code provider) cites 24 PMIDs of which only two have titles relating to
    OPMD; the other 22 are real papers on unrelated subjects (Chlamydia trachomatis
    sampling, olfactory receptor gene evolution, a mandible arteriovenous
    malformation case report, zonisamide augmentation in depression, and so on).
    The report is committed for provenance, but NOT ONE of its references was
    carried into this entry on its authority. Every reference here was located by
    an independent PubMed search (NCBI E-utilities esearch/esummary across seven
    topic queries: PABPN1 polyalanine expansion, intranuclear inclusions,
    OPMD/OPDM discrimination, cricopharyngeal myotomy, blepharoptosis surgery,
    founder-population epidemiology, recessive OPMD), then fetched with
    just fetch-reference and quoted only from the cached body. The two plausible
    report citations (PMID:20301305 GeneReviews, PMID:9462747 Brais 1998) were
    independently re-found by that search and verified before use.

    Ontology verification: every CURIE was resolved with OAK in the same step it
    was written. MONDO:0008116 confirmed via sqlite:obo:mondo. The gene CURIE was
    derived, not recalled - runoak -i sqlite:obo:hgnc search "PABPN1" returns
    hgnc:8565, and just list-gene-term-mismatches confirms both gene bindings name
    the gene the entry names. One candidate GO term was rejected on lookup:
    GO:0006378 is "obsolete mRNA polyadenylation", replaced here by GO:0031124
    mRNA 3'-end processing. HP and CL terms were taken from existing verified
    bindings and re-checked (HP:0003701, HP:0000007, HP:0012473, HP:0011951 fresh
    from sqlite:obo:hp). NCIT has no clinical-action term for blepharoplasty or
    cricopharyngeal myotomy, so both surgical treatments bind NCIT:C15329
    Surgical Procedure with the specificity carried in preferred_term.

    OPMD vs OPDM disambiguation, which was the main hazard on this entry: the KB
    already holds Oculopharyngodistal_Myopathy (OPDM, non-coding CGG expansions in
    LRP12/GIPC1/NOTCH2NLC/RILPL1). The two are routinely confused in the
    literature. Separation here rests on PMID:36476314, a series that examined both
    diseases side by side and is cited three times in the differential: OPMD limb
    weakness is proximal where OPDM's is distal; p62-positive myonuclear inclusions
    are far more frequent in OPMD and are PABPN1-positive only in OPMD; and
    inclusions in non-muscle cells (vessels, nerve, spindles) occur in OPDM but
    were absent from all 15 OPMD samples. A notes: block records the confusion
    explicitly so the entry cannot be misread as OPDM. This entry also fills the
    gap left by Autosomal_Dominant_Progressive_External_Ophthalmoplegia, which
    already listed OPMD as a differential against a non-existent entry.

    Deliberately not claimed: no repeat-length/severity rule is asserted - the UK
    cohort observation (PMID:11222452) is recorded with an explanation noting that
    Brais 2003 says the correlation is not conclusively established. No toxic
    effector is asserted downstream of RNA/proteostasis sequestration, because the
    same review states the mechanism of polyalanine toxicity is unknown; that is
    recorded in the node's notes rather than filled in. No datasets, animal models,
    or clinical trials were added.

    Validation, each run separately and all passing: just validate (49/49 snippets),
    just validate-terms, just validate-disorders (batched, authoritative),
    check-duplicate-keys, check-entity-refs, check-causal-targets (no new dangling),
    check-qualifier-terms, check-enum-values, check-reference-titles,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-folded-hyphens, check-coarse-phenotypes, validate-history-all. The
    GeneReviews chapter was tagged with just tag-references, taking
    check-genereviews from CITED_UNTAGGED to TAGGED. The stub was removed with
    git rm. One schema fix during the build: causal_link_type takes
    INDIRECT_UNKNOWN_INTERMEDIATES, not INDIRECT.

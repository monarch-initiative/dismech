  summary: 'Create: Paraneoplastic Pemphigus (MONDO:0018974)'
  details: |
    Created kb/disorders/Paraneoplastic_Pemphigus.yaml for MONDO:0018974, closing the claim in issue #9025.

    Curated content: a seven-node pathograph (associated neoplasm -> parallel humoral anti-plakin/anti-desmoglein autoantibody production and cell-mediated cytotoxic interface attack -> suprabasal acantholysis with interface dermatitis -> intractable stomatitis, polymorphous cutaneous eruption; with bronchiolitis obliterans downstream of the cell-mediated arm), eight HPO-bound phenotypes, and three treatments (treatment of the underlying neoplasm, systemic corticosteroid therapy, anti-CD20 B-cell depletion). Two treatments carry evidence-bearing target_mechanisms links.

    Sources. Three references, all fetched and cached, with every snippet an exact quote from the cached abstract: PMID:2247105 (Anhalt 1990, the original description), PMID:26358412 (Ohzono 2015, 104-patient cohort), PMID:37597771 (2024 JAAD review, clinical overview and pathophysiology). A falcon deep-research run was launched and had not completed when this record was written; a follow-up EDIT record will cover any enrichment from it.

    A textbook first pass was written before evidence was gathered, and the evidence corrected it. The draft stated that an underlying neoplasm is required for the diagnosis; Ohzono reports that 12 of 104 patients had no detectable tumour. The node now records the association as causal but not universally demonstrable, and notes that absence of an identified neoplasm should prompt continued surveillance rather than reclassification.

    Nosology resolved: paraneoplastic pemphigus and paraneoplastic autoimmune multiorgan syndrome (PAMS) are the same entity, not separate concepts - the cited JAAD review uses the combined designation PNP/PAMS throughout. Curated as synonyms.

    Bronchiolitis obliterans is modelled as a mechanism node rather than only a phenotype, as the claim issue asked, and is linked to the autoantibody profile through Ohzono's reported correlation between desmoglein 3 reactivity and bronchiolitis obliterans rather than asserted as an incidental comorbidity.

    Deliberate omissions. Three phenotypes - skin erosion, dyspnea, and conjunctival involvement - carry descriptions but no evidence block, because no exact quote supporting them was found in the cached abstracts; per the evidence SOP the description is kept rather than a citation manufactured. PMID:10228191 (Nousari, mechanism of respiratory failure) was fetched but cached with an empty content section, so it cannot be quoted; the JAAD review is cited for bronchiolitis obliterans instead of quoting a title. NCIT:C2322 (Corticosteroid) was dropped from therapeutic_agent because it is not a member of the ChemicalEntityTerm dynamic enum; prednisone (CHEBI:8382) carries that treatment.

    No GeneReviews article exists for this disease (PubMed search returned zero hits), as expected for a non-Mendelian condition.

    The stub stubs/Paraneoplastic_Pemphigus.yaml is deliberately left in place: editing stubs/ would put the pull request outside the curation-scope CI guard's allowlist, tracked as issue #9070. tidy-stubs will detect it as already_curated once this entry lands.

    Validation: just validate passed with 22 of 22 snippets verified against cached references, and just validate-terms passed.

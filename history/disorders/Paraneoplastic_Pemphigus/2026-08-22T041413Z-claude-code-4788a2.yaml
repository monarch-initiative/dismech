  summary: 'Create: Paraneoplastic Pemphigus'
  details: |
    New entry for paraneoplastic pemphigus / paraneoplastic autoimmune multiorgan syndrome (MONDO:0018974). No existing entry; Pemphigus_Vulgaris and Pemphigus_Erythematosus are present but neither covers the paraneoplastic form.

    The organising claim is where the antibody comes from. In most paraneoplastic autoimmune syndromes the immune system responds to a tumour antigen and that response cross-reacts with a host protein - the tumour provokes the autoimmunity. Here, tumour cells of Castleman disease occurring with paraneoplastic pemphigus were shown to secrete antibodies against plakin family proteins directly, and those antibodies detached cultured keratinocytes. The neoplasm is the antibody source, not the stimulus for one. The notes contrast this explicitly with the Lambert-Eaton entry curated earlier in this session, where SCLC ectopic antigen expression drives a cross-reactive response, because the two have the same clinical shape and different mechanisms with different therapeutic consequences.

    Five pathophysiology nodes and four phenotypes joined by nine downstream edges into one connected component, with every phenotype attached to the node that produces it. Three treatments carry target_mechanisms at three different levels of the chain: tumour-directed therapy INHIBITS the trigger, rituximab and corticosteroids INHIBIT the autoantibody node, and lung transplantation BYPASSES the airway node - BYPASSES rather than INHIBITS because it does not act on the mechanism at all, it substitutes the organ the mechanism destroyed.

    The second spine is the dissociation between cause and consequence. Controlling the neoplasm removes the antibody source, which is the definitive move, but it does not reverse established bronchiolitis obliterans - the cited source states that lung transplantation is often the only viable option specifically once the underlying neoplasm has been controlled. So the cause is treatable and one of its consequences is not, and a KNOWLEDGE_GAP records that nothing cited distinguishes structural irreversibility from a self-sustaining process that outlives the antibody.

    A second KNOWLEDGE_GAP records a mismatch between diagnosis and mechanism that is easy to miss because it rests on a negative result. Envoplakin and periplakin antibodies are almost universally detected by immunoblotting and their epitopes have been mapped, yet patient antibodies purified against those two proteins failed to cause any pathological change in animal models. Anti-desmoglein 3 antibodies are pathogenic by passive transfer but absent or low in a significant proportion of patients. Anti-desmoplakin C-terminus antibodies were only shown pathogenic in 2022. The serological profile that defines the disease diagnostically is therefore not the profile that explains it mechanistically, and the entry curates the antibody node without claiming to know which specificity drives which lesion.

    The cell-mediated arm is curated as a parallel node rather than folded into the humoral one, and its prognostic behaviour is recorded because it is counterintuitive: lichenoid or interface dermatitis is associated with longer survival and remains protective in multivariable Cox analysis, which a purely antibody-centred model would not anticipate.

    Deliberately not claimed: the link from the mucocutaneous mechanism to the airway disease is INDIRECT_UNKNOWN_INTERMEDIATES because no cited source shows the airway lesion is produced by the same autoantibodies. Respiratory epithelium does express plakins and that is the obvious hypothesis, but the entry does not assert it.

    Two frequency bands are assigned, both from direct qualitative statements in the cited review - "typically present" for the mucocutaneous features and "a frequent complication" for bronchiolitis obliterans. Acantholysis carries no band because it is reported in individual cases rather than as a series frequency.

    Prognostic data come from a single systematic review of 290 articles and 504 patients, the largest synthesis available. It is still a synthesis of case reports and small series, and the notes say the hazard ratios are curated because they are the best available rather than because they are robust.

    Validation: just validate clean; just validate-terms clean; 28/28 evidence snippets verified against the local reference cache on the first run; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-cache-order all clean. Pathograph verified as one connected component with no dangling targets; all three treatment target_mechanisms and all four discussion attaches_to references resolve.

    One ontology note worth recording for future curators: searching HGNC with the label operator for DSP returned CTDSPL and for PPL returned ETNPPL - substring matches hiding the real genes, the failure mode the dismech-terms skill warns about. Both were resolved with an exact search and confirmed by CURIE lookup before use.

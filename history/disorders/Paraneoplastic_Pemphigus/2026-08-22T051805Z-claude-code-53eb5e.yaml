  summary: 'Follow-up: animal models with FAILS_TO_RECAPITULATE, IVIG, JAAD Part II
    citation'
  details: |
    Follow-up on the four non-blocking suggestions from the second review of PR #9229. Two were implemented, two were answered in notes with the reasoning recorded.

    Suggestion 4, the most valuable one, is implemented: an animal_models section with modeled_mechanisms. The passive-transfer work was already well curated as evidence, but only as evidence - the negative result survived as an evidence-level REFUTE with no structural signal. It is now two model entries in the same assay, distinguished by which IgG fraction was transferred. Anti-desmoplakin C-terminus RECAPITULATES the acantholysis node with three readouts (dose-dependent blistering, electron-microscopic loss of keratin anchorage, TUNEL apoptosis). Anti-envoplakin/periplakin FAILS_TO_RECAPITULATE the antibody node, with the required limitations and evidence.

    Splitting them into two model entries rather than putting two opposite relationships on one entry is deliberate: a negative result in an assay that demonstrably works for other specificities is informative in a way a negative result in an untested model is not, and that contrast is what the two entries make visible. The limitations field states what the negative cannot settle - a cofactor requirement, a second specificity, a target the neonatal mouse does not express in the same form, or a duration longer than the assay.

    Suggestion 1 is implemented: PMID:37714216, the JAAD CME Part II, was fetched in the previous round and left uncited, which is exactly the loose end that costs a future curator a re-fetch. It is now cited in the diagnosis section for the one thing it adds that the S2k guideline does not name - ELISA alongside immunoblot and immunoprecipitation in the workup modality list - and added to the references block.

    Suggestion 2 is partly implemented and partly declined, with the reasoning on the treatment entry. IVIG is added, curated at exactly the strength the guideline states it: high doses "have also been employed", PARTIAL, no target_mechanisms, because nothing cited says which node it acts on. The peri-operative rationale the review found interesting - IVIG around tumour resection to blunt antibody-mediated bronchiolar injury at tumour lysis - is NOT curated. It came from the deep-research report, the EADV guideline does not make the claim, and a PubMed search for it surfaced nothing that does. It would bear directly on this entry's second knowledge gap, which is precisely why it needs a primary source rather than a DR lead. Recorded on the treatment entry so the lead is not lost.

    Suggestion 3 is deferred with the decision made explicit in notes. The five polymorphous cutaneous patterns are diagnostically load-bearing and two of them are independent adverse survival factors, so they arguably deserve separate phenotypes - but doing it properly means deciding whether they are phenotypes, subtypes or severity strata, and that decision should not be made in a review-response commit.

    Validation: just validate passed with 72/72 snippets verified; just validate-terms passed; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates run. All modeled_mechanisms targets resolve to real pathophysiology nodes and every readout target repeats its link target, as test_model_readout_targets_match_link requires. Cited references reconcile with the references block in both directions.

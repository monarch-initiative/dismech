  details: |
    Third round on PR #9229. Four findings, all verified against the cached source before acting, and all four correct.

    Finding 1 is the one that matters, and it is my error of the same class this batch keeps producing. The first animal-model description said the serum came from "a 16-year-old patient with Castleman-associated disease". PMID:35911677 does not say that. The word Castleman appears exactly once in the cached file, in the introduction, referring to the group's separate earlier work on Castleman tumour cells - not to this donor. The donor is described as a 16-year-old with PNP who met the study's inclusion criterion of an underlying lymphoproliferative neoplasm on the strength of a 5 x 4 cm mediastinal mass, and who died of sepsis while being prepared for surgery, so the tumour was never histologically characterised.

    The reviewer's account of why this matters more than a stray adjective is right and is worth preserving: the entry's organising thesis is that Castleman tumour cells are the antibody factory, and attributing Castleman to the one donor whose IgG demonstrably transfers disease makes the transfer experiment read as direct support for a thesis it does not support. The thesis rests on the earlier study. Because the claim sat in a description rather than a snippet, no validator could see it - the same structural blind spot as the four earlier instances in this batch.

    Rewritten to say what the paper says, and to name the inference as an inference: a mediastinal mass in an adolescent with this disease is suggestive of Castleman disease, but suggestive is not the reported diagnosis.

    Finding 2: the IVIG treatment_term was NCIT:C15262 Immunotherapy, a bucket large enough to hold rituximab and IVIG in the same node. Replaced with NCIT:C121331 Intravenous Immunoglobulin Therapy, which validates. Same shape as the Organ Transplantation to Lung Transplantation fix accepted in the first round.

    Finding 3: both animal models omitted name, which is exactly the collision the schema comment warns about - two species: Mouse entries whose fallback labels are long folded genotype strings sharing an identical prefix, differing only at the tail. Worth recording why I got this wrong rather than just fixing it: I checked AnimalModel's slots list, saw no name, and concluded the schema did not offer one. name is declared as an attribute rather than in slots, so it was there the whole time. A negative conclusion from an incomplete query, which is the same failure mode as asserting an absence without checking properly.

    Finding 4: the FAILS_TO_RECAPITULATE evidence quoted the general "failed to cause any pathological changes in animal models" sentence. The same cached file has a species-specific one - "failed in observing any phenotype in mouse skin" - which is what the entry's species: Mouse assertion actually needs. Swapped on the model link; the general statement stays on the envoplakin/periplakin biomarker record, where the claim is about the antibody rather than about the model.

    Validation: just validate passed with 72/72 snippets verified; just validate-terms passed; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates run. No cache churn - NCIT:C121331 was already in the label cache.

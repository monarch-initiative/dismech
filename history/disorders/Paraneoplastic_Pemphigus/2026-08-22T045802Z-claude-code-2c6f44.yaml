  summary: 'Review response: add EADV S2k guideline, prevalence, biomarkers, diagnosis
    and differentials'
  details: |
    Response to the automated review on PR #9229. Every finding was checked before acting, and one of them turned out to rest on an assumption that is false for this disorder.

    Finding 2, corrected in the other direction. The review asked for ORPHA:63455 to be mined for prevalence and an HPO frequency table. `just fetch-reference ORPHA:63455` does not work for this prefix; the documented path is the structured-source rebuild, which needs the pinned Orphadata bulk XML. Refreshed that and built the record. Orphanet has NO epidemiology and NO phenotype table for this disorder - the cache file carries a definition and five cross-references and nothing else. So the prevalence section could not come from Orphanet, and the entry now records that absence explicitly rather than leaving a future curator to assume the gap is unfilled work. Orphanet is still cited, for its characterisation of the tumour association.

    What supplied the missing breadth instead was a source neither the entry nor the deep-research run had found: the EADV S2k guideline on PNP/PAMS (PMID:36965110), reachable as full text and located by following a corrigendum in a PubMed title search. It is now the single most productive reference in the entry.

    Prevalence. Added from the S2k guideline: incidence less than one new case per million inhabitants per year, curated as rate_high 0.1 with no lower bound because the source states an upper bound rather than an estimate, plus the guideline's own preceding sentence saying there is little data allowing an estimate at all.

    Finding 3, biochemical. Added five autoantibody records: envoplakin/periplakin, desmoglein 3, desmoplakin, A2ML1 and BP230. The BP230 record is the one the review specifically asked for - it was an adverse prognostic factor surviving only as prose inside a progression note.

    The envoplakin/periplakin record turned out to be the most interesting thing in this round. The 144-patient risk-factor review (PMID:30981429, surfaced by the deep-research run) shows anti-envoplakin antibodies independently associated with death on multivariate analysis. The entry already curated the finding that purified anti-envoplakin and anti-periplakin antibodies failed to cause any pathological change in animal models. So the specificity that is almost universally present and independently predicts mortality is the same one that did nothing when transferred. Both are now curated on the same biomarker record and the tension is added to the existing knowledge gap, which it sharpens rather than resolves.

    Finding 5, treatments split. Rituximab and corticosteroids were bundled. Split, because the guideline reports things about each that a combined entry hides: rituximab is preferred in lymphoproliferative-associated disease for a dual action (it depletes the neoplastic B cells and the autoreactive ones, which under this entry's tumour-as-factory model are largely the same cells), so it is now wired to the trigger node as well as the antibody node; and systemic steroids usually help cutaneous lesions while mucositis and bronchiolitis obliterans may be less responsive, which maps onto the entry's own reversible/irreversible split. Both carry therapeutic_agent bindings and specific modalities. The guideline's blanket statement that no evidence supports any specific therapy is curated on rituximab as PARTIAL so the limitation travels with the treatment.

    An unprompted correction to the tumour-directed therapy entry. The S2k guideline states that treatment of the underlying neoplasia rarely has a favourable impact on the clinical course - which qualifies the entry's original framing of tumour control as "the definitive move". The guideline also says, in a later section, that treating the malignancy is always recommended because it can result in improvement. Those sentences are in tension within one document, and the reconciliation it implies is anatomical: a resectable tumour (Castleman, thymoma) can be removed and remission follows in up to half of such patients, while a disseminated haematological malignancy is controlled rather than eliminated. The entry now curates that distinction, because a reader taking the mechanism at face value would over-predict benefit from chemotherapy.

    Finding 4. NCIT:C15289 Organ Transplantation replaced with NCIT:C15274 Lung Transplantation.

    Finding 8. Both quotable facts added: the applied diagnostic criteria and the rat-bladder IIF titre of 1:160, in a new diagnosis section alongside the six S2k consensus characteristics and the guideline's statement that its own criteria are unvalidated. Two diagnosis entries bind NCIT:C25294 Laboratory Procedure; NCIT:C176332 Indirect Immunofluorescence and NCIT:C17638 Immunoblot Analysis both exist but are not reachable from the TreatmentActionTerm enum root, so they fail term validation and were not used.

    Finding 9. The mixed-source evidence item was split into a MODEL_ORGANISM half and a HUMAN_CLINICAL half, each quoting its own clause.

    Finding 6, answered rather than implemented. There is no comorbidities slot on the Disease class, and the relationship is not comorbidity in any case - the tumour is this entry's trigger node. The quantitative link is curated as evidence there instead (Castleman disease in up to 56% of patients, more frequent in Asian countries; solid tumours in 14.8-17%; the rare tumour-absent cases), and notes says why no cross-reference to the two existing Castleman entries was added.

    Finding 7. The JAAD CME Part II is PMID:37714216, resolved rather than assumed.

    Finding 10. stubs/Paraneoplastic_Pemphigus.yaml deleted.

    Also added: three mortality estimates that disagree (90% at two years, 57%, one-year survival 49%) with the ranked causes of death; bronchiolitis obliterans as an independent survival factor on multivariable analysis, which is the quantitative support for the entry's second spine; and four differential diagnoses from the guideline - Good syndrome (distinguished by negative DIF and IIF), oral lichen planus, anti-plakin dermatosis, and acute cutaneous GVHD.

    Finding 1, deep research. Ran the claude_code provider; 16/16 identifiers resolved, none unresolved, 11 of 16 on topic and none off topic, so five are undecided. It contributed two references the entry now uses. It did not find the S2k guideline. A veterinary review of deep pemphigus in dogs, cats and horses was surfaced and fetched but deliberately not curated - naturally occurring paraneoplastic pemphigus in companion animals would be a real animal_models entry rather than an induced model, which is exactly why it should not be added on the strength of a title.

    Validation: just validate passed with 65/65 snippets verified; just validate-terms passed; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates run; check-stubs OK after the deletion. Pathograph verified as one connected component over 5 pathophysiology nodes, 4 phenotypes and 14 edges, no dangling references, and cited references reconciling with the references block in both directions.

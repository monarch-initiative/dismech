  details: |
    Follow-up EDIT to the CREATE record 2026-08-20T062049Z-claude-code-e9c89d.yaml, covering enrichment from the falcon deep-research run that was still in flight when that record was written. Appended rather than amending, since history records are append-only.

    Deep research. just research-disorder falcon Paraneoplastic_Pemphigus, 572s, report at research/Paraneoplastic_Pemphigus-deep-research-falcon.md with one Edison artifact. The report's own reference validation reported 6 references, 6 resolved, confabulation rate 0.0, and 5 of 6 weighed as on topic with 0 off topic - meaning one reference is undecided rather than cleared, which is expected for a record without an abstract.

    NEC preflight. just preflight-dr against MONDO:0018974 returned SKIP, because MONDO records no causal gene for this autoimmune disease and the gene-identity check cannot discriminate. The manual fallback was applied and the entity identity is sound: the report's most-mentioned genes after the disease abbreviation are A2ML1, DSG3, DSG1 and EVPL, which are precisely the paraneoplastic pemphigus autoantigens. Note the tool counted the disease abbreviation PNP as the gene symbol PNP (purine nucleoside phosphorylase) 48 times; that is a false positive of the gene-symbol counter on this disease, not an entity-confusion signal.

    Additions, each independently verified by fetching the reference and quoting its cached abstract rather than trusting the report:
    - PMID:9284106 - landmark identification of the 210-kDa autoantigen as envoplakin (IN_VITRO).
    - PMID:20805888 - landmark identification of the p170 autoantigen as alpha-2-macroglobulin-like-1, a protease inhibitor rather than a plakin (IN_VITRO).
    - PMID:9710446 - anti-desmoglein 3 quantification across 25 sera, and affinity-purified anti-Dsg3 antibodies proven pathogenic in neonatal mice. This second quote strengthens the pathogenicity claim materially: the CREATE record rested it on whole-IgG passive transfer from PMID:2247105, whereas this isolates the pathogenic fraction (MODEL_ORGANISM).
    - A KNOWLEDGE_GAP discussion attached to the Bronchiolitis Obliterans node, recording that the antigenic hierarchy behind the leading cause of death is unresolved: desmoglein 3 reactivity correlates with bronchiolitis obliterans in the 104-patient cohort, and anti-epiplakin and anti-desmoglein 1 correlate in other cohorts, but no specificity has been shown causal and the cell-mediated arm may be proximate. Therapeutically load-bearing, since B-cell depletion addresses only the humoral arm.
    - An animal_models entry for spontaneous canine paraneoplastic pemphigus (PMID:15657279), PARTIALLY_RECAPITULATES at LOW fidelity against the autoantibody node, with limitations recorded: a single spontaneous case, a solid spindle cell sarcoma rather than the lymphoproliferative tumours dominating human disease, presumed rather than identified plakin antigens, and no airway assessment.

    Deliberately not curated from the report. The report identified NCT06643091 as a phase-2 nintedanib study in unicentric Castleman disease and explicitly warned it is not a paraneoplastic pemphigus treatment trial and should not be represented as efficacy evidence; no clinical_trials entry was added. The report's quantitative antibody frequencies and its incidence estimate of under one case per million per year are cited to a guideline document rather than to a PMID, so no prevalence record or frequency annotation was added for them - there is no citable reference from which to quote an exact snippet.

    Validation after enrichment: just validate passed with 29 of 29 snippets verified against cached references; just validate-disorders, the batched check CI runs, passed; check_snippet_length against origin/main, check_folded_hyphens, check_title_snippets, check-duplicate-keys and check-cache-order all clean.

  summary: Curate the missing first-line GSM treatments, split the epithelial node,
    add the itching phenotype
  details: |
    Addresses the automated review of PR 17805. Treatments: added oral ospemifene (CHEBI:73275, NCIT:C15986 Pharmacotherapy, pivotal phase 3 PMID:23361170 plus the SERM-pharmacology review PMID:25087944), intravaginal prasterone (CHEBI:28689 dehydroepiandrosterone, phase 3 PMID:26731686), and non-hormonal moisturizers and lubricants (NCIT:C49236 Therapeutic Procedure with NCIT:C184953 Vaginal Moisturizer as the agent, PMID:32852449 for the severity ladder and PMID:38412393 for the finding that the moisturizer arm moved no objective marker). The moisturizer row is the only treatment whose mechanism edge is BYPASSES rather than RESTORES, and that edge is uncited because no source measures what a lubricant does to the secretory supply. Added the class-level network meta-analysis PMID:43000041 across the drug rows and the MsFLASH null result PMID:29554173 as REFUTE on both the local estrogen row and the moisturizer row. Energy-based devices were deliberately not curated: the conflict between PMID:38412393 and PMID:43000041 is recorded in notes instead. Pathophysiology: split Vaginal Epithelial Atrophy and Glycogen Depletion into two sibling nodes under the receptor node, with no edge between them, because the source cited for the glycogen measurement states that the relationship between luminal and epithelial glycogen is unresolved; the atrophy node now carries maturation-index evidence from three trials where it previously rested on a review framing sentence. The glycogen node's process binding was moved from GO:0005978 glycogen biosynthetic process to GO:0005977 glycogen metabolic process, because the measured quantity is free glycogen in the lumen and the source declines to say whether that tracks synthesis or storage, so the narrower term asserted a step the source does not identify. Phenotypes: added Vulvar Pruritus bound to HP:0032004 Pruritus vulvae and wired from the atrophy node. A search of HP for pruritus found HP:0030161 Vaginal pruritus as a sibling term, so the row's claim is scoped to the vulva to match its binding; no vaginal row is added because neither source distinguishes the sites. Notes: brought the design-decisions section 19 phrase into line with the rewritten section (mirror image of section 3a, not an application of it), replaced the paragraph saying prasterone was not curated, and recorded three wrong CURIEs carried by the committed OpenScientist deep-research report. Not done: the cancer-survivor safety arm, the Esr1-knockout and conditional-knockout mouse models, and the in vitro reconstructed vaginal epithelium are recorded in notes as uncurated leads.

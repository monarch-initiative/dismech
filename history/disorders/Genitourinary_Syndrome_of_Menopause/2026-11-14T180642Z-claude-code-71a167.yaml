  summary: 'Create: Genitourinary Syndrome of Menopause'
  details: |
    New entry for the genitourinary syndrome of menopause, one of the three disorders of the
    menopausal transition that design decisions section 19 names as in scope while ruling the
    life stage itself out.

    Naming. The entry is named for the syndrome, not for the class it anchors. The 2014
    ISSWSH/NAMS terminology consensus (PMID:25160739) replaced "vulvovaginal atrophy" with
    "genitourinary syndrome of menopause" in order to bring the urethral and bladder
    components inside the diagnosis, and the 2025 AUA/SUFU/AUGS guideline (PMID:40298120)
    uses the new name throughout. Per the entry-naming skill, "Postmenopausal Atrophic
    Vaginitis" was rejected because it is narrower than the entry's own content: an entry
    named for vaginal inflammation would not cover the urethral and trigonal nodes or the
    urinary phenotypes curated here. The MONDO label, the ICD-10-CM label and both older
    clinical names are kept in synonyms.

    Anchoring. MONDO has no class for the syndrome, re-verified through OLS immediately before
    commit: "genitourinary syndrome of menopause" and "vulvovaginal atrophy" return nothing,
    "urogenital atrophy" returns three unrelated congenital anomaly syndromes whose
    definitions contain the words, and of the 17 hits for "menopause" only four carry it in
    the label (premature menopause, postmenopausal osteoporosis, postmenopausal atrophic
    vaginitis, and a polyneuropathy syndrome). Following section 19, which names MONDO:0001410
    postmenopausal atrophic vaginitis as the nearest and narrower anchor and section 3a's
    parent-anchoring convention as the model, the entry binds MONDO:0001410 as its
    disease_term and records the relation in mappings.mondo_mappings as skos:narrowMatch.
    The direction is the reverse of section 3a's own case: there the entry is narrower than
    the class it anchors and records broadMatch, here the entry is broader and records
    narrowMatch, because SKOS predicates read subject to object with the entry as subject.
    check-shared-disease-terms does not apply, since no other entry binds MONDO:0001410.
    An ICD-10-CM mapping to N95.2 is recorded with the same predicate and the same reasoning;
    N95.2 was read from the NLM Clinical Table Search Service and then resolved against the
    local ICD-10-CM build, which gives the same label and places it under N95 within N00-N99.
    A MONDO term request for the syndrome would resolve the gap properly and has not been
    filed.

    Mechanism. Seven nodes. Two conform to kb/modules/menopausal_estrogen_withdrawal.yaml, at
    the two nodes the module names as its conformance targets: Systemic Estradiol Withdrawal
    (ORGANISM) and Loss of Urogenital Estrogen Receptor Signalling (CELLULAR), the latter
    substituting the tissue-specific populations the primer asks for - vagina squamous cell
    (CL:1001578) and urothelial cell (CL:0000731), located in vagina (UBERON:0000996) and
    urethra (UBERON:0000057), with ESR1 and ESR2. The module ends at the receptor by design,
    so the five nodes below it are the entry's own and nothing is duplicated from the module:
    vaginal epithelial atrophy and glycogen depletion, loss of vaginal lactobacillus dominance
    and the pH rise, reduced urogenital blood flow and lubrication, vaginal wall connective
    tissue remodelling, and urethral and trigonal mucosal atrophy. The module's hypothalamic
    KNDy arm is deliberately not conformed to; nothing in this syndrome runs through it.
    check-conformance-content reports all conformance links sharing a GO term with their
    module node, with no process_absent, cell_type_absent or edges_absent findings.

    Evidence discipline, and the two places the sources do not say what a simple deficiency
    model would predict. The lactobacillus and pH node is the entry's weakest step and its
    description says so: in PMID:25535963 the free-glycogen difference between pre- and
    postmenopausal women was significant but the lactobacillus and pH differences were trends
    that did not reach significance in 23 women, and the paper's full-text discussion records
    that some postmenopausal women retained substantial glycogen. That clause is quoted in
    full in the snippet rather than trimmed. The pH half is instead established from the
    treatment side, where vaginal estradiol significantly lowers pH. The collagen node carries
    a REFUTE item against the simpler claim it might be read as making: in PMID:11950190 six
    months of oestradiol decreased total collagen while raising MMP-2 and immature
    cross-links, which the authors read as accelerated turnover, so the node asserts loss of
    regulated turnover and the entry does not claim postmenopausal vaginal collagen content is
    lower. The urethral node carries a second REFUTE item recording that the trial whose
    urethral maturation index result supports it missed its primary storage-symptom endpoint.
    Both of these are the reason two knowledge-gap discussions are attached rather than the
    chain being presented as settled.

    Phenotypes. Five HP-bound (vaginal dryness HP:0031088, dyspareunia HP:0030016, urinary
    urgency HP:0000012, dysuria HP:0100518, recurrent urinary tract infections HP:0000010),
    each carrying onset.onset_category POSTMENOPAUSAL, which section 19 added to OnsetEnum for
    this purpose. One phenotype, vulvovaginal burning and irritation, is deliberately unbound:
    HP "vulvar" returns 17 terms and none is this symptom, HP "burning" returns site-specific
    terms for the mouth and the eye but none for the vulva or vagina, and binding Vulvodynia
    or Pruritus vulvae would assert a different symptom. The searches named in that
    description were re-run against OLS immediately before commit.

    Treatments. Two rows, both local vaginal estrogen, separated because they target different
    nodes and rest on different randomised evidence: symptom relief (Cochrane PMID:27577677,
    AUA guideline PMID:40298120) and recurrent urinary tract infection prevention
    (PMID:31232721, whose 35-woman size and asymmetric dropout are quoted alongside its
    result). Both bind NCIT:C15483 Estrogen Therapy, verified reachable from NCIT:C25218, with
    CHEBI agents. NCIT:C15599 Hormone Replacement Therapy is deliberately not used, per
    section 19's "what not to do": NCIT defines it as systemic post-menopausal or
    post-ovariectomy replacement, which is a different treatment from low-dose local delivery.
    Intravaginal prasterone is named in notes as not curated rather than added without
    evidence.

    Also recorded: a symptom-based diagnosis row with the guideline's own statement that no
    consensus exists on which symptoms define the syndrome; two differential diagnoses,
    Bacterial Vaginosis (which reaches the same luminal state by displacement rather than
    substrate withdrawal, and is already a KB entry) and overactive bladder (named by the
    guideline as the competing attribution for the urinary symptoms); and a prevalence record
    carrying a class and no rate, because the cited review's own finding is that the published
    estimates are not comparable.

    Connectivity. `just list-disconnected-phenotypes` on the committed entry reported 5 of
    6 phenotypes causally connected, the exception being the unbound vulvovaginal burning
    and irritation node. That was an oversight rather than a decision - the symptom does
    have an upstream node in this entry - so an edge was added from the vaginal epithelial
    atrophy node in a follow-up commit, with a description recording that the cited
    sources attribute the symptom to the atrophy generally rather than to the glycogen arm,
    and the edge left uncited rather than borrowing a node-level quote. The entry now
    reports 6 of 6 connected.

    Deep research. No `just research-disorder` provider was run for this entry. The reference
    set was assembled by direct PubMed E-utilities search and all 11 cited references were
    fetched with `just fetch-reference`.

    Validation run and read: `just validate` (schema, terms, references) passed;
    `just validate-disorders` over both entries of this pass passed with 84/84 snippets and
    102/102 titles and 0 issues; `just check-duplicate-keys`, `check-entity-refs`,
    `check-causal-targets`, `check-enum-values`, `check-coarse-phenotypes`,
    `check-qualifier-terms`, `check-delivery-system`, `check-block-scalar-comments`,
    `check-logical-rules` all clean on the file; `check-name-collisions`,
    `check-shared-disease-terms`, `check-environmental-evidence`, `check-folded-hyphens`,
    `check-folded-yaml`, `check-cache-order`, `check-gene-namespaces`,
    `check-reference-titles`, `check-retired-support-prose` clean whole-tree;
    `check-genereviews` reports NO_CHAPTER, which is the expected answer and is recorded in
    notes; `check-granularity` and `check-conformance-content` clean.

    Not fixed, and inherited rather than introduced. Three whole-tree ratchets that grandfather
    against origin/main are red on this branch for content in files this change does not touch,
    because the branch base is 30 commits behind origin/main and those snippets were repaired
    upstream: check-snippet-length (6 findings in Glioma.yaml and
    MET_Exon_14_Skipping_NSCLC.yaml), check-title-snippets (2 in

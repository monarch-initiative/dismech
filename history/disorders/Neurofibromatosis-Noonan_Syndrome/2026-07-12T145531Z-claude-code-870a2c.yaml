  summary: 'Create: Neurofibromatosis-Noonan Syndrome'
  details: |
    New de-novo RASopathy entry for NFNS anchored on MONDO:0011035 and NF1. Models neurofibromin RAS-GAP loss of function with GAP-related-domain clustering converging on RAS-MAPK dysregulation; NFNS positioned as an NF1 variant with rare additional PTPN11 second-locus contribution. Phenotypes and epidemiology anchored on De Luca 2005 PMID:16380919, Nystrom 2009 PMID:19845691, and the 2025 systematic review PMID:39643432; neurofibromin RAS-GAP mechanism reuses validated PMID:25877329 from the NF1 entry. All 22 snippets verified as exact substrings of cached abstracts; schema and term validation pass. Last remaining un-PR'd target of RASopathy gap issue 6206.

  summary: 'Review and enhance: Neurofibromatosis-Noonan Syndrome'
  details: >-
    Added MONDO and Orphanet synonyms, expanded classifications with CARDIOVASCULAR, DERMATOLOGY, and mechanistic_category RASopathy, and added ORPHA:638 and PMID:39643432 prevalence entries; added variant_origin GERMLINE plus ORPHA:638 and CGDS:HGNC_7765 dosage sensitivity evidence on NF1 and recorded Orphanet's MAP2K2 listing as DISPUTED with PMID:40289159 panel-screening evidence; added Somatic NF1 Second Hit node (CL:0002573 Schwann cell, SOMATIC LOSS_OF_FUNCTION, PMID:22700876) and direct melanocyte melanogenesis evidence (PMID:26150484), preserving protected node name RASopathy Developmental Program while connecting 20/20 phenotypes (adding Ptosis, Downslanted Palpebral Fissures, Posteriorly Rotated Ears, Plexiform Neurofibroma, Optic Pathway Glioma, Malignant Peripheral Nerve Sheath Tumor, Attention Deficit Hyperactivity Disorder, and Intellectual Disability with quantitative PMID:40289159 cohort/literature frequencies); added 3 NCIT-bound diagnosis entries, enriched MEK Inhibitors with selumetinib (CHEBI:90227), target_phenotypes, and target_mechanisms, and refined differential-diagnosis notes.

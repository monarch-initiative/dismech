  summary: 'Create: IRF7_Deficiency'
  details: |
    New entry for IRF7 deficiency (immunodeficiency 39, MONDO:0014597), claimed in issue 12615. Curated as a standalone autosomal recessive Disease: single gene (IRF7), leaf MONDO term with no descendants, per the triage note and the IFNAR1_Deficiency/Immunodeficiency_65_IRF9_Deficiency sibling pattern. Named IRF7_Deficiency over the Immunodeficiency_39 stub label, following the IFNAR1_Deficiency convention. Deep research: one Perplexity report via the new async-job transport (the streaming path had failed this run with Server disconnected; fix in PR #16390); report resolved 3/3 references and flagged many mislabelled CURIEs, so every term here was verified in OLS independently and several report suggestions (e.g. HP:0033067, HP:0030059, the NCIT drug codes) were discarded as naming unrelated terms. Evidence from the index influenza report (PMID:25814066), the COVID-19 cohort (PMID:32972995), the 7-patient series (PMID:35670811) and the Irf7-null mouse (PMID:15800576). Central interferon-amplification node conforms_to innate_antiviral_interferon_response. Stub deleted. Validated with just validate and the whole-repo gates.

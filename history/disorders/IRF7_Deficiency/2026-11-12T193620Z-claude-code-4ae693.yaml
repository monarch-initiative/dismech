  summary: 'Reviewed IRF7 Deficiency: added IUIS innate immunity classification, Orphanet
    prevalence, age-of-onset progression, respiratory cell/tissue annotations, and
    refined variant evidence grading'
  details: |
    Added exactMatch mondo_mappings, IUIS 2022 innate immunity defect classification (PMID:35748970), Harrison's IMMUNE_RHEUMATOLOGIC, INFECTIOUS_DISEASES, and GENETICS_ENVIRONMENT_DISEASE chapters, worldwide point prevalence (<1/1,000,000 from ORPHA:574918) and literature case count (7 patients in 6 families from PMID:35670811), and broad 6-month to 50-year onset progression. Enriched IRF7 Loss of Function with GERMLINE LOSS_OF_FUNCTION genetic_context and in vitro interferon-promoter reporter evidence (PMID:25814066), added respiratory tract epithelial cell (CL:0002368), fibroblast (CL:0000057), respiratory tract (UBERON:0000065), and lung (UBERON:0002048) annotations on Uncontrolled Viral Replication in Respiratory Cells, refined evidence_source on F410V (HUMAN_CLINICAL trio Sanger + COMPUTATIONAL prediction) and Q421X (IN_VITRO phosphorylation assay), added homozygous W91X and A280GfsX12 variants from PMID:35670811, and re-verified GeneReviews and ClinGen negative notes.

  summary: 'Curate phenotypes: IRF7 Deficiency'
  details: |
    Brought the phenotypes section up to the clinical detail in the cached full text of Campbell et al. 2022 (PMID:35670811), whose supplementary case narratives describe P2 to P7 individually. Added 13 phenotypes, each with exact snippets from that text and HP terms read from cache/hp/terms.csv: Hypoxemia, Fever, Dyspnea, Cough, Myalgia, Ground-glass opacification, Pulmonary opacity, Infection-associated lymphopenia, Elevated circulating C-reactive protein concentration, Bronchiolitis (infantile onset), Recurrent viral pneumonia, CSF pleocytosis and Diplopia. Enriched Severe viral infection, Acute respiratory distress syndrome and Respiratory failure with further evidence. Rebound Respiratory failure from HP:0002878 to HP:0004887 (Respiratory failure requiring assisted ventilation), which is what its preferred_term and evidence describe. Wired Bronchiolitis and Recurrent viral pneumonia from the viral replication node, Hypoxemia as a sequela of Pneumonia, and CSF pleocytosis and Diplopia as sequelae of the tick-borne encephalitis phenotype. Added a notes lead for PMID:41159916 (heterozygous IRF7 truncation with herpesvirus CNS infection), not curated because it is a different inheritance and phenotype, and because NCBI was unreachable for caching. No frequencies were set because the source gives per-patient narratives rather than cohort counts. Validation: validate, count-verified-snippets (all verified), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions all pass.

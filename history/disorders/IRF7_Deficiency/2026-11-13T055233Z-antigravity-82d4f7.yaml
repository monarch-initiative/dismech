  summary: 'Addressed PR 17282 review: restored Tick-borne viral encephalitis phenotype, softened respiratory-restriction and ECMO/vaccination prose, dropped ungrounded Pneumonia frequency and fibroblast cell binding, and split truncating variants'
  details: |
    Added Tick-borne viral encephalitis (HP:0033993) wired from Failure of Type I and III Interferon Amplification for patient P6's breakthrough CNS infection (PMID:35670811) and softened prose from strictly respiratory-restricted to narrow and predominantly pulmonary. Removed ungrounded VERY_FREQUENT frequency from Pneumonia and added P4-P7 pulmonary evidence, calibrated ECMO wording on Respiratory failure and Supportive care to one patient (P2) alongside P4 mortality and lack of IRF7-specific antiviral efficacy data, and calibrated Viral vaccination prose with mRNA anti-spike seroconversion and live-attenuated vaccine tolerance quotes. Dropped fibroblast (CL:0000057) from Uncontrolled Viral Replication in Respiratory Cells, split W91X and A280GfsX12 into separate variant entries, added functional F410V/Q421X localization/phosphorylation evidence (PMID:25814066), and cleaned notes wording.

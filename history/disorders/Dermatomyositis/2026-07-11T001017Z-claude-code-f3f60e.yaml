  summary: Add guideline-derived management strategy and rehabilitation to dermatomyositis
  details: |
    Mined the dermatomyositis clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2), targeting the management-strategy and rehabilitation gap alongside an already-rich pharmacotherapy list. Added 2 treatments: Treat-to-Target Management Strategy (MAXO:0000950; from the PReS/CARRA juvenile-DM treat-to-target task force, PMID:40410052) and Physical Therapy and Exercise Rehabilitation (MAXO:0000011; from the Brazilian Society of Rheumatology myopathy treatment guideline, PMID:30670084). Reinforced the previously evidence-less Corticosteroids and IVIG treatments with the same Brazilian guideline (first-line glucocorticoid; IVIG for refractory cases). All snippets snippet-verified against fetched abstracts. Fetched but did not cite the classification-criteria and diagnosis guidelines (EULAR/ACR 2017 PMID:29079590; Brazilian diagnosis PMID:31601261) since the entry has no diagnosis section to attach them to. Schema and term validation pass; all 6 new snippets confirmed as exact substrings (validate-references reports 0 checks, the known false-pass).

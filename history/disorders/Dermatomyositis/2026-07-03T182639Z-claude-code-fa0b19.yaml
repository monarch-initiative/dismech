  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on 76 previously untitled evidence references (51 ORPHA:221 records plus PMID:34549549, PMID:24695011, PMID:37153943, PMID:33599244, PMID:38143369, PMID:38456909, PMID:38929957, PMID:31279808). Re-ran validate-references which pulled full text for PMID:38456909 and PMID:38576610 and sanity-checked both matched their titles. Re-verified every existing snippet as an exact whitespace-normalized substring that genuinely supports its claim. Full-text enrichment added: a TREM-1 perimysial-vessel inflammation mechanism to the Perivascular Inflammation node, a new Hyperferritinemia laboratory phenotype (HP:0003281) plus a Ferritin biochemical marker keyed to anti-MDA5 disease severity, and two JAK inhibitor safety evidence items covering cytomegalovirus reactivation and thromboembolism plus herpes reactivation. Corrected the MORC3 anti-NXP2 note to reflect that the meta-analysis found anti-NXP2 a non-significant independent cancer risk factor once anti-TIF1-gamma cases were removed. Schema, term, and reference validation all pass.

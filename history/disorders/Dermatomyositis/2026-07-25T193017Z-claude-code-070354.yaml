  summary: 'Review: Dermatomyositis evidence-typing corrections'
  details: |
    Claim-evidence audit as part of a 10-disorder muscular-disease review.
    Fixes: (1) 'Respiratory Insufficiency due to Muscle Weakness' cited a Norwegian PM/DM cohort snippet reporting dyspnoea in 62%; dyspnoea in dermatomyositis is frequently ILD-driven and the cohort does not attribute it to respiratory muscle weakness, so the item was retyped SUPPORT -> PARTIAL with the limitation stated in the explanation. (2) The JAK Inhibitors treatment carried two evidence items typed SUPPORT whose snippets are adverse-event findings (CMV reactivation prompting discontinuation; orolabial HSV and thromboembolism); these are safety caveats, not support for the efficacy claim, and were retyped to PARTIAL.
    Validated: linkml-validate, linkml-term-validator, linkml-reference-validator, pytest tests/test_data.py (subset).

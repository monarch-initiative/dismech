  summary: Address ai4c-reviewer CHANGES_REQUESTED on PR 8476
  details: |
    Addressed all 7 blocking review findings on the Appendiceal Neoplasm root entry (PR #8476). (1) Cell type CL:0000584 (enterocyte) -> CL:0002563 (intestinal epithelial cell) to match mucinous/goblet epithelium biology. (2) Rupture node: replaced the non-supporting PMID:28746986 quote with two real mucocele-perforation sources, PMID:22759474 (spontaneous/accidental rupture -> pseudomyxoma peritonei) and PMID:19998220 (mucocele perforation spreads mucus/cells into the peritoneum). (3) The mucin-hypersecretion -> distension edge's mis-attached peritoneal-spread quote (PMID:23403822) was moved to the rupture->PMP edge it actually supports; the edge now cites PMID:22759474 cystic luminal dilatation. (4) The LAMN->HAMN->MAC transition quote (PMID:32821969) was moved to the TP53 high-grade-progression edge; the proliferation->distension edge was softened to a description-only claim per evidence SOP section 4. (5) Abdominal pain: replaced the incidental-finding quote with PMID:42460197 (RLQ abdominal pain consistent with acute appendicitis). (6) Appendectomy: replaced the incidental-finding quote on both the treatment and its target_mechanisms with the cached PMID:37956190 size-threshold sentence (simple appendectomy for <1 cm, right hemicolectomy for >2 cm); softened 'curative' to 'appropriate definitive treatment for small localized lesions'. (7) rate_per_100000 0.93 now backed by the exact PMID:37956190 incidence sentence. Non-blocking: prevalence_class RARE -> BAND_1_9_PER_100000; dropped vague GO:0030154+ABNORMAL amphicrine binding (NTR note); retagged two definitional-prose evidence items to evidence_source OTHER; strengthened the invasion-node evidence with infiltrative-invasion (PMID:26492181) and peritoneal-dissemination (PMID:30692096) quotes. Removed now-orphaned references_cache/PMID_28746986.md. Validated: just validate, validate-terms, count-verified-snippets 57/57, check-title-snippets, check_snippet_length --against-ref origin/main, batched validate-disorders.

  details: |
    Response to the automated review on PR #8879 (CHANGES_REQUESTED on coverage, not correctness). All seven findings addressed; nothing previously curated was removed or weakened.

    CRITICAL (1) GeneReviews baseline. Added a top-level `references:` block tagging PMID:24404629 with `tags: [GeneReviews]` and four `findings` covering the chapter's four domains, each carrying an exact `supporting_text` quote. Every domain is now also represented by section-level evidence: Clinical Characteristics on the new myocardial-infarction and xanthelasma phenotypes; Diagnosis/Testing across all four items of the new `diagnosis:` section; Management on statin therapy (paediatric initiation from ~age 8, pregnancy contraindication) and on the new risk-factor/surveillance treatment; Genetic Counseling on `inheritance:` (50% transmission risk). Every GeneReviews-sourced evidence item is tagged `evidence_source: OTHER` and, where the claim is about FH as a class rather than APOB-related FH specifically, `supports: PARTIAL` with the class-level limitation stated in the explanation. That distinction is deliberate: the chapter covers LDLR, APOB and PCSK9 together, and this entry should not silently promote class-level guidance into FDB-specific evidence.

    IMPORTANT (2) Diagnosis section. Moved "Molecular Genetic Testing of APOB" out of `treatments:` into a new `diagnosis:` section using `diagnosis_term` (NCIT:C15709), matching the 4/4 convention the reviewer cited, and dropped the now-redundant "recorded as a diagnostic action" sentence from its description. Opened the section properly with three further items rather than moving one entry: the FH multigene panel (LDLR/APOB/PCSK9/LDLRAP1, NCIT:C15709), clinical lipid-based diagnosis with the GeneReviews untreated LDL-C thresholds (NCIT:C25294), and the differential diagnosis of inherited hypercholesterolemia (NCIT:C18020). The thresholds item carries an explicit caveat that criteria calibrated on LDLR-mediated FH systematically miss part of the FDB distribution, tying it to the severity controversy already curated. The differential item carries the entry's central NEC guard: APOB also harbours a truncating series causing familial hypobetalipoproteinemia, the same gene with the opposite lipid direction, cited to a source (PMID:38393015) that describes both.

    IMPORTANT (3) Four phenotypes added, all HPO terms already in the label cache. Myocardial infarction (HP:0001658), coronary artery calcification (HP:0001717) and carotid artery stenosis (HP:0100546) are evidenced FDB-specifically from PMID:38393015; xanthelasma (HP:0001114) rests on class-level GeneReviews text and is marked PARTIAL. Frequency bands were omitted on three of the four under the frequency-evidence SOP: the 5.6% figure is for coronary heart disease as a whole rather than infarction, the compared cohorts differ in age and ascertainment, and the visible-xanthoma literature is drawn from broader FH cohorts.

    IMPORTANT (4) Genetic depth. Added two `case_fractions` records rather than one: 12% for the combined R3500Q/R3500W share of FH cases (PMID:38393015) and 2-5% for R3500Q alone in Europe (PMID:33519890, midpoint 3.5 with bounds). The spread is real and driven by which alleles are counted and how the FH denominator was ascertained, so it is recorded as two cohort-specific records rather than averaged. Penetrance and expressivity are recorded on `inheritance:` as INCOMPLETE and VARIABLE (the only slots the schema provides for them), with the age-dependence of the biochemical phenotype and the incomplete clinical penetrance against FH criteria distinguished in the description and separately evidenced; `penetrance_percentage` is deliberately omitted because no genotype-first estimate exists. Added LDLR and PCSK9 as `relationship_type: MODIFIER` gene entries — not CAUSATIVE, since a lesion in either on its own is a different disease — with the digenic-severity and modifier-gene evidence, plus a retained PARTIAL counterweight that digenic second hits do not uniformly worsen the phenotype.

    SUGGESTIONS (5) CL:0000115 refined to CL:0002139 (endothelial cell of vascular tree), so `preferred_term` and the bound label now agree. (6) All three `progression:` phases now carry evidence. (7) Second-line LDL-lowering therapy (ezetimibe, CHEBI:49040) added with the extrapolation caveat the reviewer and the research report both suggested, and a cardiovascular risk-factor/surveillance treatment (BEHAVIORAL) added from the GeneReviews management domain. Both carry notes stating plainly that no FDB-specific efficacy is asserted and that their evidential footing is weaker than the statin and anti-PCSK9 entries, which have genotype-stratified data.

    Two new references fetched with `just fetch-reference`: PMID:38393015 (Kounatidis 2024, Metabolites) and PMID:33519890 (Kamar 2021, Front Genet), both resolved from the deep-research report's DOIs via PubMed esearch rather than trusted from the report. Both cached as `full_text_xml`; the FDB-specific comparative figures live in the body rather than the abstract, so before curating them I probed the reference validator with `--no-full-text` (the flag `just validate-disorders` and CI use) on a throwaway file and confirmed it matches against the whole cached body — the flag suppresses network full-text retrieval, not matching. The DR report's one unresolved reference (DOI:10.5551/jat.CR005) remains unused. One snippet drafted for PMID:8006512 did not appear in the cached abstract and was replaced with a verified quote before validation rather than kept.

    Follow-up on the approving review's one non-blocking nit: the carotid-artery-stenosis note said 4% "would fall in the OCCASIONAL band". OCCASIONAL is 5-29%, so 4% is VERY_RARE. Corrected. The band stays omitted either way for the stated ascertainment reason, but the note's whole job is to justify the omission, so naming the wrong band undercut it.

    Validation: `just validate` passed (schema + terms + references) with 102/102 snippets verified, up from 70/70; `just count-verified-snippets` 102/102, 0 skipped by prefix; `just validate-terms` passed; `just check-duplicate-keys`, `just check-title-snippets` and `just validate-disorders` run before pushing.

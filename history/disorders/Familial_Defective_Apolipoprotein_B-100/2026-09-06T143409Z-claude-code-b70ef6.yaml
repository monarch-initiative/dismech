  summary: 'Augment: Familial Defective Apolipoprotein B-100'
  details: |
    Augmentation of an existing entry, not a new one. "Hypercholesterolemia,
    autosomal dominant, type B" is MONDO:0007751, already curated as
    kb/disorders/Familial_Defective_Apolipoprotein_B-100.yaml (PR #8879).
    Duplicate preflight covered origin/main by MONDO ID and by label/synonym,
    plus a PR and issue search across all states; nothing else open.

    Deep research: openscientist (research/Familial_Defective_Apolipoprotein_B-100-deep-research-openscientist.md,
    12m47s, 34 citations). Falcon was the default provider but a falcon report
    for this disorder already exists from the original curation, and re-running
    it would have overwritten committed research, so a second provider was run
    instead; the existing falcon report was read alongside it. The
    openscientist run produced no validation frontmatter, so
    `just validate-research-reference` and `just validate-research-terms` were
    run against it and both sections are now in the report. References came back
    34/34 resolved, 2/2 quotes valid, 0 off topic. Term validation flagged
    HP:0001229 as unresolved and named GO:0034364 and CHEBI:39025 as HDL terms
    the report calls LDL - none of the four was bound.

    Added an `animal_models:` block for the human apoB-100 R3500Q transgenic
    mouse. This model was already cited as evidence in the entry but had no
    first-class record, so nothing linked it to the pathograph. Two
    `modeled_mechanisms` links: RECAPITULATES the receptor-binding node, with a
    DECREASED binding readout (PMID:11115503) and a RESTORED carboxyl-terminal
    truncation rescue readout (PMID:9486979); and MEASURES the
    subendothelial-retention node with an UNCHANGED proteoglycan-binding readout
    (PMID:9637699, newly fetched). The second link is the substantive finding -
    R3500Q LDL binds proteoglycans normally while binding the receptor
    defectively, so FDB adds no retention-side defect and that node is driven by
    particle concentration rather than avidity. It is a molecular model cited
    for a tissue-level node, so it carries SCALE_EXTRAPOLATION and
    BOUNDARY_OMISSION divergences; `just model-scale-audit --strict` passes.

    Added `differential_diagnoses:` (6 entries, 4 with MONDO bindings): the
    LDLR, PCSK9 and LDLRAP1 routes, polygenic hypercholesterolemia, the
    allelic-opposite APOB hypobetalipoproteinemia (PMID:33983694), and the
    non-FH dyslipidemias plus Lp(a) assay overlap (PMID:39076699). The
    pre-existing `diagnosis` entry "Differential Diagnosis of Inherited
    Hypercholesterolemia" is the workup step and now points at the new block
    rather than competing with it.

    Added a `diagnosis` entry for the flow-cytometric LDL ligand function assay
    (PMID:10657378, newly fetched), carrying a SUPPORT item for its 0.95/0.89
    operating characteristics and a REFUTE item for the same paper's conclusion
    that the accuracy is too low to diagnose an individual. Its 32% residual
    binding affinity was also added to the receptor-binding pathophysiology
    node, which had no quantitative measure of the defect in patient material.

    Rewrote the `controversy_fdb_severity_versus_ldlr_fh` rationale. It
    previously said the milder-phenotype question was not resolvable because
    ascertainment differed between the two contradicting studies. The Copenhagen
    study (PMID:15528480) measures that ascertainment effect directly - 1.6
    mmol/L, about the size of the difference under dispute - and separately
    reports LDLR carriers 1.2 mmol/L above APOB R3500Q carriers in a sample
    reaching well beyond the lipid clinic. The rationale is careful about how
    far that goes: the abstract does not report the LDLR-versus-APOB contrast
    restricted to the general-population stratum, so it corroborates the milder
    reading without being an ascertainment-free estimate of it. The discussion
    stays OPEN because the endpoint is cholesterol rather than incident ASCVD -
    the 41.8% vs 5.6% coronary difference (PMID:25126774) is still
    clinic-ascertained - and the proposed experiment was narrowed to that
    remaining question. Also bounded the terminal ASCVD node to the coronary
    bed: the same Copenhagen cohort found excess myocardial infarction but no
    excess ischemic stroke among FH-causative mutation carriers including APOB
    R3500Q (PMID:29593013). Added the founder-allele age to the p.Arg3527Gln
    variant (PMID:9339363, ~6,750 years, ~270 generations).

    Two absences are recorded in the entry `notes` rather than left silent. No
    `datasets:` block: GEO returned 0 hits for the exact disease phrase and
    `just discover-datasets` returned 12 candidates that are all general FH,
    LDLR or PCSK9 studies, which is the sibling-disease collapse relevance
    triage exists to catch. No `environmental:` block: both deep-research
    reports agree no exposure causes FDB and neither yielded an FDB-specific
    quotable claim tying a named exposure to a mechanism node here.

    A red-team review pass (dismech-pr-review, fresh context) was run before
    the PR and its findings were taken. The substantive ones: the new
    coronary-bed boundary on the ASCVD node contradicted the entry's own
    pre-existing Carotid Artery Stenosis phenotype, and was rewritten to name
    the endpoint (no excess *incident ischemic stroke*, which leaves prevalent
    carotid disease untouched) and to stop calling PMID:29593013's CGPS cohort
    "the same" as PMID:9603795's earlier 9,255-person study; a distinguishing
    feature claiming tendon xanthomas are less frequent in FDB had no support
    and contradicted the entry's only xanthoma source, so it was deleted;
    PMID:9603795 was already cached and carries the ascertainment gradient for
    Arg3500Gln *itself* (2.6 / 4.0 / 4.5 mmol/L across general population, IHD
    and clinical FH), so the severity-controversy rationale now argues from the
    allele rather than by analogy from LDLR carriers, and the 1.9 mmol/L
    selection gradient being larger than the ~1.2 mmol/L disputed difference is
    now the stated reason the discussion stays OPEN; the bundled "non-FH
    dyslipidemias and Lp(a)" differential was split into four records
    (sitosterolemia and cholesteryl ester storage disease MONDO-bound,
    dysbetalipoproteinemia, plus familial combined hyperlipidemia from the
    openscientist report), and the Lp(a) assay-overlap caveat moved to the
    LDL-C thresholds diagnosis entry, since a measurement artefact is not a
    disease that presents similarly. Smaller fixes: the 32% affinity item
    regraded IN_VITRO (lymphocyte culture binding assay), the proteoglycan link
    dropped to `fidelity: LOW`, typed SPECIES_MISMATCH and BOUNDARY_OMISSION
    divergences added to the RECAPITULATES link, a Trp4369/Trp4396 numbering
    gloss, cached PMID:7583549 evidence attached to the two LDLR distinguishing
    features it supports, a note recording why the genus MONDO:0017774 was bound
    rather than MONDO:0014252, and two pre-existing explanations that still said
    "PARTIAL" (a retired enum value) rewritten.

    Validation: `just validate` and the batched `just validate-disorders` pass
    schema, terms and references with 131/131 snippets verified against the
    cache; check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading and check-environmental-evidence
    all pass. check-snippet-grading initially failed on four new GeneReviews
    items graded HUMAN_CLINICAL where the entry already grades the same
    sentences OTHER; they were regraded to match. Compliance moved from 206/216
    to 258/272 satisfied checks. Eight new references were fetched and cached:
    PMID:11115503, PMID:9637699, PMID:9339363, PMID:25126774, PMID:15528480,
    PMID:10657378, PMID:29593013, PMID:34906840.

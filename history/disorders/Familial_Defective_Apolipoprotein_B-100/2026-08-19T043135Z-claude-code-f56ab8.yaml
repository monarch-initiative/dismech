  summary: 'Create: Familial Defective Apolipoprotein B-100 (MONDO:0007751, APOB)'
  details: |
    New standalone Disease entry for familial defective apolipoprotein B-100 (FDB; hypercholesterolemia, autosomal dominant, type B), MONDO:0007751 / OMIM:144010 / APOB.

    NEC preflight: OAK confirmed MONDO:0007751 xrefs OMIM:144010 and carries RO:0004003 hgnc:603 (APOB), is_a MONDO:0005439. `just preflight-dr` on the falcon report returned WARN, driven by two benign signals: the token "FH" (the abbreviation for familial hypercholesterolemia, which is also a gene symbol) outranking APOB in the mention count, and the report citing OMIM 107730, which is the APOB *gene* MIM rather than a rival disease MIM. Manual gene/OMIM/synonym checks confirmed the report is about the APOB ligand-defect entity. No PCSK9 or LDLR content was curated as if it were APOB, and no low-LDL APOB (hypobetalipoproteinemia) literature was used.

    Scope decision: standalone Disease rather than a subtype of Familial_Hypercholesterolemia.yaml. MONDO models MONDO:0007751 as a gene-defined is_a child of MONDO:0005439; the existing FH entry's has_subtypes axis is zygosity, not gene; and the mechanism differs at the defining molecular step (ligand defect against a normal receptor vs receptor defect). The FH entry was read but not edited.

    Mechanism curated as the mirror image of LDLR-mediated FH: APOB receptor-binding-region missense variant (p.Arg3527Gln / R3500Q, c.10580G>A, CpG hot spot) -> defective apoB-100 binding to a structurally normal LDL receptor (Arg3527 is not a contact residue; it stabilizes the apoB-100 belt conformation via the carboxyl terminus / Trp4396, and carboxyl-terminal removal restores binding) -> reduced receptor-mediated hepatic LDL clearance -> elevated plasma LDL cholesterol -> subendothelial apoB-lipoprotein retention (conforms_to atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention) -> premature atherosclerotic cardiovascular disease. A supporting small-dense-LDL node is curated at PROVISIONAL confidence.

    GeneticContext.functional_impact_category scored PARTIAL_LOSS_OF_FUNCTION with an in-file justification: residual binding was measured at 32% of normal, the particle is otherwise normally assembled, and DOMINANT_NEGATIVE is wrong because each LDL particle carries exactly one apoB-100 molecule so mutant and wild-type particles are independent species.

    Two discussions curated rather than papering over disagreement: a CONTROVERSY on whether the FDB phenotype is genuinely milder than LDLR-FH (PMID:8215738 "clinically indistinguishable" vs PMID:7583549 milder, with the ascertainment argument spelled out), and a KNOWLEDGE_GAP on the VLDL/IDL production-side kinetic arm (PMID:9507998), which is deliberately NOT curated as a mechanism node.

    Validation: `just validate` passed (schema + terms + references, 70/70 snippets verified); `just count-verified-snippets` 70/70; `just check-title-snippets` OK; `just check-duplicate-keys` and `just validate-disorders` run before opening the PR. Every cited reference was fetched with `just fetch-reference`. Notably, every PMID recalled from memory before searching PubMed turned out to be wrong, so all identifiers here were resolved via PubMed esearch and verified against the fetched abstract.

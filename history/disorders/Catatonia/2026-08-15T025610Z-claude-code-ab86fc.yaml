  summary: 'Address the four review blockers on PR #8455'
  details: |
    PR Shepherd run addressing the four IMPORTANT items in the 2026-08-14 ai4c-reviewer CHANGES_REQUESTED review.

    (1) Truncated incidence snippet: replaced the quote that ended mid-sentence at "It has an incidence of" with the complete sentence from the cached PMID:37039129 text, so the figure asserted by rate_per_100000 is carried by the snippet rather than supplied by the explanation. The source's approximation sign is reproduced verbatim inside the quote; the reviewer's suggested shorter form would have fallen under the five-word MIN_SNIPPET_WORDS guard.

    (2) Second-line pharmacotherapy and antipsychotic risk, both mined from the already-cached BAP guideline PMID:37039129: added an amantadine/memantine treatment (target_mechanisms MODULATES on "Glutamatergic NMDA Receptor Perturbation and Neuroinflammation", previously the only pathophysiology node with no treatment attached) and an "Avoidance of antipsychotic medication" treatment (INHIBITS on "Reduced Striatal Dopaminergic Transmission"). Both preserve the guideline's own hedging; the amantadine response item is supports: PARTIAL because the underlying evidence is 18 cases across 11 articles rather than a trial, and the avoidance treatment records that the guideline calls this one of the most controversial areas of catatonia management rather than an absolute contraindication.

    (3) Immobility complications: added five phenotypes (pneumonia, deep venous thrombosis, pulmonary embolism, rhabdomyolysis, disseminated intravascular coagulation) drawn from the cohort sentence at PMID:37039129, each with a downstream causal edge from "Hypokinetic Psychomotor Output", which terminates a previously dangling branch of the pathograph. All five HP terms were already present in both cache/hp/terms.csv and the phenotypeterm enum cache, so no cache rows changed. Decubitus ulcer is named in the same source sentence but was omitted: no HP term for it is in the caches and it could not be verified offline.

    (4) Orphan reference and unevidenced differentials: cited PMID:40368005 (APA Resource Document), which the PR committed but never cited, on all six existing differential_diagnoses entries, which previously carried no evidence at all. Added the four differentials the same enumeration names but the entry lacked: stiff-person syndrome, akathisia, major neurocognitive disorders, and mania.

    Also corrected six reference_title values for PMID:37039129 that this session had initially introduced with the wrong BAP guideline title (the pregnancy/postpartum guidance rather than the catatonia guidelines); the title now matches the cached record.

    Validation: just validate kb/disorders/Catatonia.yaml passed, with Snippets checked 93/93 verified against cached references (up from 67/67); just check-snippet-length, just check-title-snippets and just check-term-cache-integrity all OK; 16/16 Catatonia tests in tests/test_data.py pass. The one failing test in tests/test_data.py is test_evidence_items_have_references on kb/disorders/Urticaria.yaml, which this PR does not touch and which fails identically with main's own copy of that file, so it is inherited from main and not attributable to this branch.

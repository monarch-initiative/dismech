  summary: 'Create: Catatonia (MONDO:0800105)'
  details: |
    Curated a new standalone Disease entry for catatonia (MONDO:0800105) in
    response to the scope question in issue #6531, a kgap-scan handoff on
    PMID:42431537 (Toledo et al., "Toward a systems model of catatonia").

    Scope decision: modeled as a Disease entry rather than a mechanism module.
    Three reasons, recorded in the entry's notes and in the catatonia_hpo_term_gap
    discussion. First, the disease-like-phenotype module family requires a concept
    carrying both an HP and a MONDO identifier, and HPO has no catatonia term --
    verified by OAK search against sqlite:obo:hp on 2026-08-14 for catatonia,
    stupor, catalepsy and waxy flexibility, none of which exists; MONDO:0800105
    does. Second, a mechanism module asserts a conserved causal chain that
    conforming disorders duplicate, and the anchor review's central claim is that
    no unified mechanism exists, so a module would assert more than the evidence
    supports. Third, catatonia is a MONDO disease concept in its own right, the
    unit the psychiatric curation SOP assigns one entry to.

    Structure: four mechanistic_hypotheses -- CANONICAL distributed psychomotor
    network, ALTERNATIVE cortical GABA-A deficit, ALTERNATIVE striatal dopamine
    hypofunction, EMERGING immune-mediated NMDA perturbation -- over eight
    pathophysiology nodes that converge on a single hub, Distributed Psychomotor
    Network Destabilization, and branch to hypokinetic, hyperkinetic /
    aberrant-volitional and autonomic-decompensation outputs. Treatments use
    target_mechanisms: lorazepam RESTORES the GABA-A node, ECT MODULATES the
    network hub, and treatment of the underlying condition INHIBITS the
    upstream-liability node. Five discussions record the open questions, including
    three KNOWLEDGE_GAPs (no unified mechanism; schizophrenia-spectrum and
    post-acute sampling bias; the observational evidence ceiling under first-line
    treatment) and one CONTROVERSY (malignant catatonia versus neuroleptic
    malignant syndrome).


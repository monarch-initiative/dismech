  summary: 'Address Catatonia review: causal wording, registry evidence and annotations'
  details: |
    Addressed independent review of PR 13561 after a clean rebase onto main 753fdfaefe187230a81b601610f3766f92f39e02. Removed the remaining unsupported DIC causal wording and retained the cohort association without restoring a causal edge. Retried just ictrp-fetch ISRCTN11236443 successfully, read the complete generated WHO-normalized registry record, and replaced the primary URL evidence with canonical ICTRP evidence for trial design and recruiting status. Registry objective/status evidence is OTHER with BACKGROUND; published protocol observations retain their clinical grading. Registry availability flags are not efficacy results.

    Added clinical manifestation links for akinesia and echolalia. The latter retains the provisional circuit hypothesis and uses both the APA model and the clinical definition of echolalia. Other signs were left unconnected where a named motor-output route was not sufficiently established by the cited passages; a list of diagnostic signs alone is not causal evidence. No molecular pathway was inferred from co-occurrence.

    Re-ran all nine recorded negative ontology searches and inspected the complete result lists. Replaced copied phenotype notes with each search's specific result. Verified L-dopa CHEBI:15765 and Psychotherapy NCIT:C15308 against live OLS definitions; added these treatment annotations and retained the BAP/APA disagreement on dopaminergic agents. Noted that the alternate StatPearls and Solmi full-text URLs identify the same publications as their PMID records.

    Validation: validate-disorders passed schema, terms and references with 196 snippets and 200 titles, no skips or unavailable snippets. The joint snippet audit of Catatonia and Anti-NMDA Receptor Encephalitis passed 290/290, checking the shared regenerated reference cache. Entity references, causal targets and discussion targets passed. Independent current-head review and CI are required again after this revision.

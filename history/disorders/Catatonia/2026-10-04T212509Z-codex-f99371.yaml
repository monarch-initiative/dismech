  summary: Review Catatonia mechanisms, clinical evidence and treatment trials
  details: |
    Reviewed the existing Catatonia entry across phenotype coverage, clinical presentations, mechanisms, treatment and trials, genetics, diagnosis, epidemiology and source use. This psychiatric transdiagnostic syndrome remains in scope; secondary infectious or medication-related causes do not make the entry an infectious disease or poisoning. No previous REVIEW event or overlapping open Catatonia PR was found. The branch was checked against freshly fetched main before editing.

    Consumed all fourteen original sources, using their full scientific bodies where retrieved. Regenerated the BAP guideline (PMID:37039129) and dopamine review (PMID:40966690) to restore eleven and four tables respectively. Read the full ASD meta-analysis, the full clinical prevalence meta-analysis through its alternate PMC cache, and primary London incidence studies PMID:35135642 and PMID:39789943. Inspected the APA 2025 document's narrative, supplements, figures 1-3 and tables 1-3, including the circuit model, treatment algorithm and diagnostic comparisons. The full StatPearls chapter was retrieved through the alternate NCBI /sites/books/ route and mined for completeness; its internally inconsistent NMDA claims and unsupported specific-mutation assertion were not adopted. GeneReviews check reports NO_CHAPTER; StatPearls is tagged. No matching disorder-specific deep-research artifact was found. The original SPECT source remains abstract-backed after repeated publisher PDF fetches returned HTTP 429; no unobserved methods or causal conclusions were inferred.

    Mechanisms: separated perfusion observations from GABA-A binding, separated hyperkinetic from parakinetic output, removed a non-atomic catch-all upstream liability node and unsupported microglial activation. Restricted dopamine and network claims to provisional hypotheses with sampling, timing and confounding limitations. Removed false treatment-restoration implications and the NMDA-antagonist-to-autoimmune-receptor-deficit link. Added source-supported clinical manifestation and complication edges, while retaining unresolved causal intermediates and leaving other associations unconnected.

    Clinical completeness: added stupor, catalepsy, waxy flexibility, mannerism, echopraxia, pressure ulcer, dehydration, urinary retention and malnutrition. Preserved overlapping motor dimensions rather than imposing mutually exclusive subtypes. Expanded clinical criteria, assessment scales, nonspecific lorazepam challenge, targeted investigation and complication monitoring. Replaced ten differential-list snippets with feature-specific full-text evidence and added NCSE and anti-NMDA receptor encephalitis as an etiological differential. Added supportive care, conditional and investigational treatments, withdrawal-specific management, periodic lithium maintenance, selected population considerations, and the disagreement between BAP and APA on dopaminergic agents.

    Trial coverage: searched ClinicalTrials.gov API v2 for catatonia and inspected relevant interventional records. Included ECT electrode-placement and neuromodulation studies, a narrowly scoped Down syndrome regression disorder phase II trial, and the phase III Laborit sodium-oxybate trial. Read the complete Laborit protocol PMID:40705436, including methods, eligibility, monitoring, outcomes, limitations and both tables. The primary ISRCTN PDF confirms recruiting status (last edited August 2026); the March 2025 protocol enrollment statement is explicitly historical. Protocol hypotheses, registry plans, small published case series and demonstrated clinical outcomes are distinguished. Abstracts of the oxazepam crossover study and ketamine systematic review were read and bounded to their selected populations.

    Epidemiology: replaced a worldwide incidence claim with catchment-specific episode rates; the DSM-5-TR estimate is a reanalysis of the same London cohort, not an independent study. Clinical pooled proportions, ASD research samples and published encephalitis case reports are not general-population prevalence. Preserved denominator inconsistencies without inventing a reconciliation. Genetic linkage is restricted to selected periodic-catatonia families and is not a causal gene or general genetic test.

    Ontology: verified added HP, CHEBI and NCIT terms; repeated negative OLS queries for catatonia, catalepsy, waxy flexibility, stupor, mannerism and sensorimotor cortex. Unbound clinical descriptors have explicit rationale rather than false equivalence to coma, akinetic mutism or stereotypy. Cache files were generated only by the reference fetcher and validators. No datasets were added. The two substantially expanded reference caches have no other disorder consumers on the checked base.

    Validation: authoritative validate-disorders passed schema, ontology and reference checks with no skipped or unavailable snippets. Entity references, causal targets, discussion targets and granularity checks passed. The page rendered and its clinical sections were inspected. Source caches and derived term additions are included; generated HTML is excluded. Independent review and CI remain required after PR creation.

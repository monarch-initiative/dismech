  details: |
    New autosomal-dominant, gain-of-function GNE disease (feedback-resistant UDP-GlcNAc 2-epimerase). Deep-research: falcon (Edison) requested with --fallback but HTTP 402 (out of credits); openscientist produced the report (fell_back=true). Named-Entity-Confusion actively screened: sialuria (dominant GOF, cytoplasmic free-sialic-acid overproduction) is kept strictly distinct from GNE myopathy (recessive LOF, already curated) and from ISSD/Salla (SLC17A5 lysosomal storage); preflight-dr PASS with GNE the dominant gene (66) and OMIM 269921 matched. GOF modeled per CLAUDE.md: functional_impact_category GAIN_OF_FUNCTION on genetic_context plus modifier GAIN_OF_FUNCTION on the epimerase-activity node; INCREASED used for the downstream quantitative overproduction. The NCAM-polysialylation -> developmental-delay link is hedged as an EMERGING mechanistic_hypothesis with INDIRECT_UNKNOWN_INTERMEDIATES and MODEL_ORGANISM evidence. Enzyme-kinetics quantitation cited (feedback inhibition 19-27% vs 79-100%). Primary literature incl. PMID:10330343, 11326336, 26980148, 10356312, 21436238, 16137682, 27966821, 29923088, 11486897, 40413313. Validated: validate-disorders PASS; 47/47 snippets verified; entity-refs/causal-targets/qualifier-terms clean. No sialuria-specific GeneReviews chapter.

  summary: Drop the phenotypes# prefix from two pathograph targets
  details: |
    The merge queue dequeued this PR with a CI failure from check-causal-targets, a gate added to main after this branch was opened. Two downstream targets used the entity-reference grammar in a slot that takes a bare name: 'phenotypes#Cerebellar ataxia' and 'phenotypes#Muscle weakness'. Per the Pathograph Targets section of CLAUDE.md and issue #10112, an unresolved target there is silent - it draws a phantom red duplicate node labelled with the raw string and orphans the real phenotype node out of the graph - so both phenotypes were disconnected from the pathograph while the entry still validated. Both names exist verbatim in the phenotypes section, so the fix is to drop the prefix, exactly as the checker's own message states. Verified by running main's scripts/check_causal_targets.py against the fixed file: 'OK: no new broken pathograph targets'. Also re-ran just validate (passed), just validate-terms (passed), 65/65 snippets verified, check-entity-refs and check-duplicate-keys clean. No claim, evidence, snippet or node name changed.

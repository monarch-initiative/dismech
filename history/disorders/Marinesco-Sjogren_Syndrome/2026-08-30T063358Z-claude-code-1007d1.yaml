  summary: 'Create: Marinesco-Sjogren Syndrome'
  details: |
    De novo curation of Marinesco-Sjogren syndrome (MONDO:0009567, SIL1), using GeneReviews PMID:20301371 as the phenotype baseline plus primary literature. One OpenScientist deep-research report was generated and read. Its reference validation was clean (16/16 verified) but its term validation set needs_review; three of its bindings were wrong and were NOT used: MONDO:0008541 (which resolves to spermatic cord torsion) as the disease term, HP:0002151 (Increased circulating lactate concentration) for cerebellar atrophy, and GO:0036498 (IRE1-mediated UPR) for the PERK branch. This entry uses MONDO:0009567, HP:0001272 and GO:0036499 instead. Named Entity Confusion checks: the stub synonym Marshall Smith Syndrome, a different NFIX disorder, was excluded from the entry and from literature searches; the GBA2 Marinesco-Sjogren-like phenocopy already curated in kb/disorders/Autosomal_Recessive_Cerebellar_Ataxia_With_Late_Onset_Spasticity.yaml was kept separate and nothing was cited across. Validated with just validate (51/51 snippets verified against cached references), check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

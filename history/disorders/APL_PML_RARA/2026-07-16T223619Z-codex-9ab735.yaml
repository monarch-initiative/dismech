  summary: Comprehensive APL PML-RARA review
  details: |
    Re-reviewed acute promyelocytic leukemia with PML::RARA against molecular, model, clinical, consensus, and current ClinicalTrials.gov sources. Rebuilt the causal graph around transcriptional repression, PML nuclear-body disruption, cooperating FLT3-ITD signaling, marrow suppression, consumptive coagulopathy, differentiation therapy, and differentiation syndrome; explicitly qualified cryptic or complex PML::RARA rearrangements and model-to-human uncertainty. Corrected phenotype frequencies, molecular diagnosis and end-of-consolidation MRD semantics, emergency ATRA and transfusion support, risk-defined ATRA/ATO regimens, APOLLO evidence, dexamethasone management, animal models, and live trial coverage. Validation included strict YAML, LinkML schema, ontology terms and deterministic term caches, 114 exact cached evidence snippets across 29 references, reference-cache frontmatter, graph integrity and connectivity, internal anchors, treatment actions, bibliography closure, and three independent final audits.

  summary: 'Self-review: consume PMID:36339314 — STN-DBS, drug failure, cleft lip,
    absent septum pellucidum'
  details: |
    Self-review round run while claude-review was unavailable (shared Claude account usage limit, resets 2026-09-12T20:00Z). I applied to this entry the finding shape the automated reviewer had raised on the other PRs in this batch - a deep-research source present in the report and absent from the YAML - and found three such sources.

    Two of the three are not usable: PMID:31970217 and PMID:35005077 are both Movement Disorders Clinical Practice case reports with no abstract in PubMed and no open full text, so their fetched caches are empty and nothing in them is quotable. They were fetched, inspected, and the empty cache files deleted rather than committed.

    The third, PMID:36339314, is substantial and produced four additions:

    - Bilateral subthalamic deep brain stimulation, curated as a treatment separate from the existing pallidal entry. The target is different - STN, not GPi - and the outcome is quantified (Burke-Fahn-Marsden motor score 44 to 20 at twelve months, with arm and leg improving far more than neck and trunk). Kept separate rather than merged into a generic DBS record because each target rests on one or two patients and merging would make the combined evidence look stronger than either.
    - Oral antidystonic pharmacotherapy, graded REFUTE against the claim that these agents control the dystonia: three years of unstable response to trihexyphenidyl and limited effect from clonazepam, baclofen and pramipexole. Added because the entry previously read as though stimulation were the only thing tried.
    - Cleft lip (HP:0410030), curated separately from the general Abnormal facial shape record because a cleft is a discrete fusion failure rather than a description of facial shape.
    - Absent septum pellucidum (HP:0001331), deliberately left with no upstream pathophysiology node. The only published mechanism for the malformations here is disturbed neural crest migration, and the septum pellucidum is a midline forebrain derivative rather than a neural crest derivative, so attaching it would assert a developmental claim no source makes. The temporal_vulnerability_model_untested discussion now records this explicitly: the hypothesis explains the face and not the midline CNS, which matters for a disease whose name begins with developmental malformations.

    One tooling note, recorded in the evidence explanation itself. The headline outcome sentence contains the source's own bracketed abbreviation of the rating scale. The reference validator strips bracketed spans from the query side and keeps literal only spans matching ^[A-Z]{2,}$, which a hyphenated abbreviation cannot match, so the verbatim quote failed. The snippet uses an ellipsis eliding exactly that bracket and nothing else, and says so. The config pattern was not widened, since CLAUDE.md asks for a whole-KB replay before changing it.

    Validation: just validate-disorders (schema, terms, 34/34 snippets); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length, check-reference-titles, check-environmental-evidence, check-folded-hyphens all clean; bulk OLS id/label comparison over 26 pairs, 0 mismatches. Cache diff is two lines.

  summary: 'Review round: five blocking findings plus three suggestions, including
    a second false claim about a cache'
  details: |
    All five blocking findings taken, plus three of the five suggestions.

    Blocking 1 - GO:0000166 nucleotide binding with modifier DECREASED. I had explicitly KEPT this in my own self-audit an hour earlier, reasoning that preferred_term 'actin nucleotide exchange' made the direction read correctly. The reviewer defeated that with an argument about export rather than about biology: kgx_export.molecular_function_to_edge drops preferred_term and emits only the term id plus a direction qualifier, so the graph would assert that beta-actin nucleotide BINDING is decreased - the inverse of the closed-state mechanism, in which the nucleotide is retained. Changed to ABNORMAL, with the export reasoning recorded in the node description so the next curator does not re-derive it. The lesson is that preferred_term is not a place to keep a qualification the graph needs.

    Blocking 2 - the REFUTE evidence quoted the case-identity sentence and my explanation justified that by saying the abstract does not restate the negative finding. False: references_cache/PMID_28487785.md is content_type full_text_xml and contains 'The previously reported twins with same p.Arg183Trp mutation as our patient had midline facial defects and skeletal anomalies; however our patient did not display these features of the phenotype.' verbatim. Swapped in, explanation rewritten to record the error. This is the second time this run I have asserted what a cache does not contain without reading the cache - the same defect the CIN entry carried with a claimed superscript.

    Blocking 3 - the two DECREASED modifiers my self-audit left behind on the dendritic-spine and neural-crest nodes. I had added directness: INDIRECT to their evidence in the same commit and not carried the reasoning through to the modifiers, which is an inconsistency the reviewer was right to call. Both now ABNORMAL.

    Blocking 4 - Parkinsonism added, HP:0001300, OCCASIONAL. One correction to the review: it pointed at PMID:36183459, whose title names parkinsonism. That cache is abstract_only and its abstract body does not mention parkinsonism at all, so there is nothing propositional to quote and a title is not a finding. The quotable statement is in PMID:29788902 - 'Some slowness and reduced amplitude of repetitive movements may represent mild signs of parkinsonism.' - and the record uses that, with the authors' hedge intact and the 36183459 situation recorded in notes.

    Blocking 5 - Dysphagia added, HP:0002015, as the bulbar sequela that carries the mortality.

    Suggestions taken: the DOPA-unresponsiveness quote on the pharmacotherapy record, since it is the specifically diagnostic negative that separates this from dopa-responsive dystonia; the failed left motor cortex stimulation as a third DBS treatment with a SUPPORT quote for the initial response and a REFUTE quote for its collapse into status dystonicus, so the entry no longer reads as though stimulation reliably works; and cleft palate plus achalasia from the twins' presenting sentence.

    Also added an animal_models block for the hair-cell conditional Actb knockout, linked to Stereocilia Maintenance Failure as PARTIALLY_RECAPITULATES with model_scale CELLULAR and an explicit limitation that a conditional null in mouse is standing in for a heterozygous missense allele in human. Its evidence is graded INDIRECT for that reason. The other two mouse models in the research report are not curated: neither is cited in this entry and neither has been fetched.

    Not taken: the mappings block. DiseaseMappings carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings, so OMIM:607371 and ORPHA:79107 have nowhere to go. This is the third PR in this batch where that suggestion was made and the third where it is unactionable for the same reason.

    Validation: just validate-disorders (schema, terms, 42/42 snippets, was 34/34); all eleven offline gates clean; bulk OLS id/label comparison over 30 pairs, 0 mismatches. No cache rows added.

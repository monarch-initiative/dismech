  summary: 'Self-audit against the defect classes four sibling reviews surfaced: three
    over-asserting modifiers'
  details: |
    This PR is the one of five in the batch that has still received no review - the workflow dispatch is 403 for an agent, the /review escape hatch is defeated by the server-appended attribution footer (#9321), and pr-shepherd's retry backoff is hours out. Rather than wait, I ran the defect classes the other four reviews surfaced against this entry as a checklist. Three of the six classes found something.

    Checked and clean:
    - Committed-but-uncited references: none. All seven cached PMIDs are cited, and nothing cited is uncached.
    - Over-specified single-valued severity where a source gives a range: no severity values in this entry at all.
    - Missing phenotypes above the 10 per cent threshold with an available HPO term: nothing surfaced beyond what the last round added.

    Found and fixed - all three are the same class the O2HE review caught with GO:0017022, a modifier asserting a direction its own node and source decline to assert:

    - Altered Actin Filament Depolymerization Dynamics carried modifier DECREASED on actin filament depolymerization. The node is named 'Altered', and the source says 'altered actin depolymerization dynamics'. Changed to DYSREGULATED, which is the enum value for 'regulation is impaired, may be increased or decreased'. Latrunculin resistance does suggest disassembly is harder to induce, but that is my inference and not the paper's statement, and the node description now says so.
    - The same node carried DECREASED on actin cytoskeleton organization, where the source says 'morphological abnormalities of the actin cytoskeleton'. Changed to ABNORMAL, which is the enum value for qualitatively abnormal.
    - Two evidence items now carry directness: INDIRECT. On the dendritic-spine node the quoted sentence is about striatal imaging and says nothing about spines; the explanation already admitted the cellular cause is inferred, so the caveat now sits in a queryable slot rather than only in prose. On the neural-crest node the quote is the authors' own hypothesis about what beta-actin does, not a migration assay - the node description already says no assay exists for this variant.

    Left alone deliberately: actin nucleotide exchange keeps DECREASED. The source says the substitution 'perturbs nucleotide release' and induces a closed-state conformation, and reduced exchange is what a closed state means, so the direction is carried by the mechanism the node describes rather than inferred past it.

    Validation: just validate-disorders (schema, terms, 34/34 snippets); all eleven offline gates clean. No cache rows added.

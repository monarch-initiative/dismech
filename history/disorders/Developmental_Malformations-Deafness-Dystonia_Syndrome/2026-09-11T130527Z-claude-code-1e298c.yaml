  details: |
    De novo curation of developmental malformations-deafness-dystonia syndrome (MONDO:0011823, ACTB p.Arg183Trp).

    DEEP-RESEARCH PROVIDER: the brief asked for perplexity; the account quota was exhausted mid-run (HTTP 401 insufficient_quota). The run was re-issued with just dr_fallback='--fallback' rather than substituting a provider by hand, and the handover is recorded in the report frontmatter (requested_provider perplexity, fell_back true, provider_attempts perplexity/falcon/claude_code). Report: research/Developmental_Malformations-Deafness-Dystonia_Syndrome-deep-research-claude_code.md, 24 citations.

    The report earned its place: PMID:16685646, the 2006 paper that first identified the variant and did the latrunculin A work, and PMID:20976199, the conditional Actb hair-cell deletion study, were both absent from my relevance-sorted PubMed searches and are now the backbone of the molecular and auditory arms respectively.

    Report validation read before use. reference_validation: 13/13 resolved but quotes_valid 1 of 5, with unsupported quotes attributed to PMID:28487785 and PMC:PMC5405358. No quoted material was taken from the report; every snippet here was copied from references_cache and verified. term_validation: 2 of 12 labels mismatched (HP:0025230 offered as 'Dystonic tremor' when HPO calls it Tendonitis; NCIT:C1364 as 'Botulinum Toxin' when NCIT calls it Didemnin B). No CURIE was taken from the report; all bindings were looked up in the same step they were written and then re-checked in bulk with a per-file id/label comparison against OLS before validation.

    LUMP/SPLIT DECISION. Curated as a separate Disease rather than a has_subtypes entry on Baraitser-Winter_Cerebrofrontofacial_Syndrome, which already carries a BRWS1 subtype for ACTB. Grounds: the variant is recurrent and specific rather than one of an allelic series; the phenotype is dominated by two features Baraitser-Winter does not have; the later reports describe it as distinct and overlapping rather than nested; MONDO assigns a separate term. Recorded as an open discussion rather than presented as settled, with the alternative remedy named, because it is a judgement a reviewer may reasonably take the other way.

    All three branch edges from the cellular node are marked INDIRECT_UNKNOWN_INTERMEDIATES. They rest on one temporal-vulnerability hypothesis stated in one paper, and the entry says so rather than asserting stage-specific mechanisms as demonstrated. The auditory branch has independent mouse support for the development-versus-maintenance split but not for this variant.

    One evidence item is graded REFUTE: PMID:28487785 against the claim that craniofacial dysmorphism is constant in this disease, since that paper reports the identical variant WITHOUT midline malformation. The explanation states explicitly that it refutes the constancy of the phenotype and not the disease.

    No conforms_to. sensorineural_hair_cell_loss and parkinsonism_dopaminergic_degeneration were both read and rejected, with the reasons written into the entry description rather than left as omissions.

    One validation failure: 'located_in' is a Descriptor slot and is not available on Pathophysiology; the correct slot is 'locations'.

    Validated with just validate (schema, terms, 29/29 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading.

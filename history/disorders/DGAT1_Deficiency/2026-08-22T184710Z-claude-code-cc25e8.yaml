  summary: 'Create: DGAT1 Deficiency'
  details: |
    New entry; a third and mechanistically distinct CODE class - failure of intracellular lipid handling after normal apical fat uptake.

    MONDO:0014375, causal gene DGAT1 confirmed against MONDO before curation.

    Four-node chain: loss of diacylglycerol O-acyltransferase 1 activity (trigger) -> failure of enterocyte triglyceride packaging and substrate accumulation (central_effector) -> enteropathy with intestinal protein loss (effector) -> fat-dependent diarrhea and intestinal failure (consequence).

    Epistemic care on the central causal step: the gene-discovery authors state that the precise cause of diarrhea is unknown and offer mucosal substrate buildup as an explicit speculation. That edge is therefore typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT, the evidence explanation says the claim is presented as speculation, and a KNOWLEDGE_GAP discussion records the open question with two proposed experiments (mucosal lipidomics, patient enteroid lipid-challenge barrier assay). The gap also bears on the safety of pharmacological DGAT1 inhibition, since the human null is the closest read on complete target blockade.

    Deliberately does NOT conform to diet_induced_osmotic_diarrhea even though the disorder is dietarily triggered and dietarily treated: the fat IS absorbed and the lesion is intracellular, so there is no retained luminal osmole. The notes use this as the worked example of why the module's criterion is the location and nature of the failed step rather than responsiveness to diet, and distinguish it from abetalipoproteinemia and chylomicron retention disease.

    The treatment is supported by the controlled comparison in the cited cohort - hydrolysed and MCT formulas failed where the low-fat amino acid formula succeeded - which is what localises the treatment to the substrate-accumulation node rather than to fat digestion generally.


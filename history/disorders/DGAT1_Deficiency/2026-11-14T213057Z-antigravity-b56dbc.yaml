  summary: Review and enrich DGAT1_Deficiency
  details: >-
    Audited DGAT1 Deficiency (MONDO:0014375) and wired its germline genetic association into pathophysiology. Added classifications (GASTROINTESTINAL, ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE, and ICIMD glycerolipid_metabolism), structured ULTRA_RARE CASES_IN_LITERATURE prevalence, and two-phase progression capturing neonatal/delayed onset and age-dependent improvement in dietary fat tolerance. Added upstream Germline DGAT1 Loss-of-Function Variants node (hgnc:2843, wild-type GO:0004144 diacylglycerol O-acyltransferase activity, GERMLINE genetic_context) upstream of enterocyte pathway failure, added UBERON:0002108 location and sourced downstream causal edges to phenotypes (Protein-Losing Enteropathy, Hypoalbuminemia, Chronic Watery Diarrhea, Vomiting, Failure to Thrive), grounded DGAT1 sequencing to NCIT:C15709, added top-level treatment evidence on Low-Fat Amino Acid Formula, and added status OPEN plus attaches_to entity references on the substrate-injury discussion item.

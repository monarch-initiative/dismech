  details: |
    Created from PubMed literature directly. Both configured deep-research providers remain unavailable: openscientist.io returns a CloudFront 403 on POST and 401 on authenticated GET, and the cyberian backend returns 500. Candidate PMIDs were found by NCBI esearch, fetched with just fetch-reference, and read in full before any YAML was written.

    The entry's central claim is that the genetic mechanism is a promoter swap rather than a fusion protein, and this is easy to get wrong. The seminal paper uses the phrase "fusion gene" and the events are named in the familiar PARTNER-USP6 style, which reads like a fusion oncoprotein. What is fused is DNA. The entire USP6 coding sequence is retained and only the upstream promoter changes, so the protein made is ordinary USP6 and only its transcription is deregulated. The strongest evidence is the partner list itself: thirteen partners are known and they share no functional family, only strong expression in bone and connective tissue, which is what one expects if the promoter is the operative element. CDH11 and COL1A1 are therefore recorded as COOPERATING rather than as drivers, because they contribute a promoter and no protein.

    Two honesty points are recorded rather than smoothed over. First, the core mechanism from USP6 through NF-kappa-B to MMP-9 and MMP-10 rests on a single 2010 cell-culture and xenograft study, graded IN_VITRO throughout and not upgraded on the strength of clinical papers that describe the lesion without testing the pathway. Second, the FISH validation study reports 53 percent sensitivity while citing a literature rearrangement rate of 70 to 75 percent. Both figures are recorded rather than reconciled, because the gap is real and its cause is not established. The practical consequence is stated in the diagnosis entry: a positive result is decisive, a negative one is not.

    Denosumab carries a NO_EVIDENCE item alongside its supporting evidence, quoting the authors' own statement that the oncological outcome remains unclear. The toxicity is recorded too: five of forty-three reported patients required intensive care for hypercalcaemia, and recurrence was 18.6 percent. Borrowing the drug from giant cell tumour was justified by histological similarity rather than shared genetics, and the target_mechanisms description notes that RANKL blockade does not touch the USP6 driver upstream, which is the likely reason lesions recur when it is stopped.

    Secondary ABC is listed as a subtype because it carries the same name and histology, but the notes state explicitly that nothing in the pathograph applies to it: it is USP6-negative reactive change inside a different neoplasm and behaves according to the lesion underneath.

    Pathograph topology was verified by parsing the file and printing every node with its outgoing edges, then checking for orphan phenotypes and dangling targets, rather than by inspection. Result: one root, no orphans, no dangling targets, all four phenotypes connected. That check was added after a review on PR #10532 caught a stranded node that visual inspection had missed.

    Ontology notes. HPO has an exact term for the lesion (HP:0012063), so no generic bone-cyst parent was needed. Denosumab has no CHEBI term and uses NCIT:C61313; polidocanol uses CHEBI:46859.

    Validation: 46/46 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean. Top-level references generated programmatically from cache frontmatter rather than typed.

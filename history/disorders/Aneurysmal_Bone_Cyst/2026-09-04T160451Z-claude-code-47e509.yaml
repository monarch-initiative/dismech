  summary: 'Review round 1: RANKL node, prevalence, histopathology, fracture phenotype,
    evidence regrading, deep-research artifact'
  details: |
    Response to review round 1 on PR #10946. All six blocking items, all six suggestions, plus the deep-research artifact.

    The reviewer identified the root cause correctly and it is the third instance of the same failure in this session. Three of the ten cached references are full text, not abstracts: PMID:35941207 is 55 kB, PMID:20418905 is 23 kB and PMID:34754635 is 16 kB. All three were mined only for the abstract at the top. The entry then recorded in notes that no quotable incidence figure existed, when it was present in a file the same commit added. The cache frontmatter carries a content_type field stating full_text_xml or abstract_only outright, and it was never checked. Checking it is now the first step before writing, and doing so here yielded prevalence, histopathology, the pathological fracture rate, the recurrence figures and the sharper USP6 percentages.

    Blocking items. The xenograft evidence was graded IN_VITRO for a mouse experiment and is now MODEL_ORGANISM. It had also been attached to an edge asserting NF-kappa-B to MMP-9 transcription, which a xenograft result does not show; the transcription sentence from the same abstract now carries that edge and the xenograft sits alongside it as separate support. Structured prevalence was added with both incidence 0.14 and prevalence 0.32 per 100,000. The RANKL arm became its own pathophysiology node conforming to osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis, and denosumab's target_mechanisms now points at it rather than at the osteolysis node it was reasoning past. Pathologic fracture was added at 15 percent with an edge from the endpoint node.

    Suggestions. The denosumab recurrence item was regraded from NO_EVIDENCE to REFUTE, since the quote does bear on the efficacy claim rather than being silent on it. A histopathology section was added covering the unlined blood-filled spaces, the RANK-positive giant cells against RANKL-positive stromal cells, and the absence of cytologic atypia that separates this lesion from telangiectatic osteosarcoma. Recurrence was quantified at 44.1 percent for curettage, and the sclerotherapy claim was qualified with a REFUTE item recording 90.6 percent persistent disease and 9.4 percent cure against the single-centre 92.3 percent ossification figure, because the two sources measure different endpoints and a curator taking only the first would overstate the treatment.

    The deep research job ran and contributed one substantive finding. USP6 and CDH11 rearrangements are restricted to the spindle cells and absent from the multinucleated giant cells, inflammatory cells, endothelial cells and osteoblasts, which identifies the myofibroblastic spindle cell as the neoplastic cell and reframes the giant cells and vascular spaces as recruited rather than transformed. That was verified directly against PMID:15509545 before use rather than taken from the report. The report's other citations were spot-checked; an initial XML-parsing check produced false negatives on two PMIDs that resolved correctly on retry with JSON, so no claim of fabrication is made against it.

    A provider correction belongs on the record. Four earlier entries in this session state that the deep-research providers were unavailable, two of them saying so in the present tense without re-testing. The diagnosis was wrong. openscientist.io issues a 301 to www.openscientist.io; curl -L strips the Authorization header across that host change, producing a 401 that was read as a revoked key, while the apex CloudFront distribution rejects non-cacheable methods, producing a 403 that was read as a service outage. Setting OPENSCIENTIST_URL to the www host resolves both, and the job completed in 757 seconds over two iterations.

    Pathograph topology verified by parsing: one root, no orphan phenotypes, no dangling targets. The graph now branches at USP6 overexpression into the NF-kappa-B/MMP arm and the RANKL arm, reconverging on osteolysis.

    Validation: 62/62 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean.

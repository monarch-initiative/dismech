  summary: 'Create: Spinocerebellar Ataxia Type 13 (KCNC3), promoted from ADCA-I'
  details: |
    New entry for SCA13 (MONDO:0011529), previously only the SCA13 has_subtypes row of Autosomal_Dominant_Cerebellar_Ataxia_Type_I (issue #13103). Pathograph runs from heterozygous KCNC3 missense variants through two allele classes (dominant-negative current suppression with intracellular retention for R420H/R423H; altered gating for F448L/R423H/C-terminal deletions) to Purkinje cell excitability dysfunction, calcium overload, impaired dendritic development (infant-onset) and Purkinje neuron degeneration, conforming four nodes to cerebellar_purkinje_degeneration. A binaural auditory brainstem node records the interaural timing/level deficit; no HPO term for impaired sound localisation was found in OLS. Phenotypes from GeneReviews (PMID:20301404, abstract only) and the R420H and R423H clinical series. Four animal models linked with modeled_mechanisms. ADCA-I SCA13 and SCA27 rows given curated_in pointers; SCA13 added to Cerebellar_Ataxias grouping. Validated with just validate-disorders (all snippets verified) and validate-terms.

  summary: 'Create: GLUT1 Deficiency Syndrome'
  details: |
    Created new disorder entry for SLC2A1-related GLUT1 Deficiency Syndrome (GLUT1DS). Mapped disease_term to MONDO:0011724 (encephalopathy due to GLUT1 deficiency, OMIM:606777, classic severe infantile-onset form / De Vivo disease). Modeled has_subtypes for the phenotypic spectrum: Classic GLUT1DS (primary), GLUT1 DS with Paroxysmal Exertion-Induced Dyskinesia (MONDO:0012805, OMIM:612126, DYT18/PED), and Dystonia 9 (MONDO:0010983, OMIM:601042, DYT9). The fourth seed OMIM number (614847, epilepsy idiopathic generalized susceptibility 12/EIG12) maps to MONDO:0013919, a susceptibility-locus association rather than a distinct GLUT1DS clinical subtype, and was not modeled as a has_subtypes entry given no quotable natural-history evidence distinguishing it as a GLUT1DS presentation; noted in curation report only. Built a 7-node pathophysiology causal chain: SLC2A1 loss-of-function variant to reduced GLUT1 transporter function at the blood-brain barrier to cerebral glucose energy deficit, branching to neuronal hyperexcitability/hypersynchrony to recurrent pharmacoresistant seizures, and to impaired neurodevelopment/movement disorder. The seizure-generation nodes declare conforms_to against epilepsy_excitation_inhibition_imbalance module nodes, substituting a metabolic energy-deficit upstream driver for the module default ion-channel lesion. Curated 9 phenotypes (seizures, developmental delay, progressive microcephaly, ataxia, dystonia, spasticity, paroxysmal exertion-induced dyskinesia, dysarthria, hypotonia), genetic causation (SLC2A1/hgnc:11005, about 90 percent de novo autosomal dominant per GeneReviews), hypoglycorrhachia biochemical marker with a BiomarkerReadout linking it back to the GLUT1 transport-function node, 3 diagnosis entries (lumbar puncture CSF:blood glucose ratio, SLC2A1 molecular testing, erythrocyte GLUT1 functional assay), and 3 treatments (ketogenic diet therapy with target_mechanisms BYPASSES the energy-deficit node, an anti-seizure-medication drug-safety-avoidance note per GeneReviews Agents/Circumstances to Avoid, and multidisciplinary supportive care). Evidence sourced from GeneReviews PMID:20301603 (tagged), a 2015 Japan nationwide survey of 33 confirmed cases PMID:25487684 (quantitative seizure/CSF-ratio/mutation-yield data), a 2011 milder-phenotypes paper PMID:21649651, a 2002 mechanism review PMID:12029447, and a 2024 ketogenic-diet-efficacy retrospective PMID:36303089. All PMIDs fetched and cached via just fetch-reference; all snippets verified as exact substrings, one snippet required the reference validator ellipsis bridging syntax to skip an editorial CSF bracket gloss that the validator strips by default. Validated with just validate, just validate-references, and just validate-terms, all passed.

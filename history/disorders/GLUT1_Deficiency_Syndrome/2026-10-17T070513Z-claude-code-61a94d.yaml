  summary: 'Bind LOINC: CSF:blood glucose ratio and absolute CSF glucose'
  details: |
    Added loinc_term LOINC:2352-3 (Glucose in CSF/Glucose plas -- LOINC's own abbreviated long common name, confirmed against both the Monarch KG and the NLM Clinical Tables LOINC search) to the existing Hypoglycorrhachia marker, since nearly all of its evidence already quotes the CSF:blood glucose ratio cutoff (<0.4) as the diagnostic hallmark. Added a new 'Absolute CSF Glucose' marker with loinc_term LOINC:2342-4 (Glucose [Mass/volume] in Cerebral spinal fluid), reusing an already-cited systematic-review quote (CSF glucose 16.2-50.5 mg/dL, at or below the 10th percentile in 147 patients) that reports the absolute value as a complementary diagnostic quantity alongside the ratio, since the two are distinct measurements and a single loinc_term slot cannot hold both. Both codes were newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

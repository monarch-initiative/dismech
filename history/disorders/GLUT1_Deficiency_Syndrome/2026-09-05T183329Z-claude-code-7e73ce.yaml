  summary: 'Expand and re-anchor to MONDO:0000188: GLUT1 Deficiency Syndrome'
  details: |
    Expanded the existing GLUT1DS entry from 966 to about 3000 lines using a Perplexity deep-research report (research/GLUT1_Deficiency_Syndrome-deep-research-perplexity.md) as leads only, plus PubMed-verified primary literature. Re-anchored disease_term from MONDO:0011724 to the umbrella MONDO:0000188 and bound both MONDO descendants as has_subtypes terms (MONDO:0011724 classic, MONDO:0012805 GLUT1DS2/PED), which is the lump/split decision recorded in notes and which retires stubs/GLUT1_Deficiency_Syndrome.yaml. Added: an autosomal recessive inheritance block with penetrance/expressivity/de_novo_rate; four new pathophysiology nodes (erythrocyte GLUT1 dysfunction, arrested cerebral angiogenesis, exertion/fasting-sensitive basal ganglia energy failure, plus biological_scale and locations on all nodes); 13 new phenotypes including the CSF biochemistry, seizure semiologies, EEG signature, PED and hemolytic anemia; two new biochemical markers (erythrocyte 3-OMG uptake, METAglut1) and CSF lactate; NCIT-bound diagnosis terms and an EEG entry; four differential diagnoses; modified-Atkins and AAV9 gene-replacement treatments plus genetic counseling, at-risk-relative evaluation and surveillance; two quantitative prevalence records (Danish 1:83,000 and Scottish 1 per 24,300 live births); three mechanistic_hypotheses; three animal models with modeled_mechanisms, readouts, fidelity, model_scale and limitations; two environmental exposures with influences_mechanisms; the NCT02014883 triheptanoin trial; a two-phase progression; an imaging finding; and a CONTROVERSY discussion on genotype-phenotype correlation carrying both SUPPORT and REFUTE evidence. Validation run: just validate (schema, terms, references) passed with 205/205 snippets verified; just validate-disorders passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence and check-term-cache-integrity all pass; compliance 89.4 percent. Report citations not used: PMID:1714544 (De Vivo 1991 NEJM) and PMID:20830593 (acetazolamide letter) have no abstract in PubMed so no snippet could be verified, and their caches were pruned; ORPHA:71277 has no structured-source fetcher; MedlinePlus, OMIM and medlink URLs in the sidecar are not fetchable reference types. Two brief-supplied PMIDs were wrong and were corrected after PubMed verification (Seidner 1998 is PMID:9462754 not 9620772; Tang 2017 is PMID:28106060 not 28211455). The report's five mislabelled HP CURIEs were rejected and replaced with OAK-verified terms.

  summary: 'Create: PCDH19 Clustering Epilepsy'
  details: |
    De-novo curation of PCDH19 clustering epilepsy / EFMR / DEE9 (MONDO:0010246), the X-linked female-limited developmental and epileptic encephalopathy. No GeneReviews chapter exists (documented); relied on claude_code deep research and primary literature. Granular unbundled pathophysiology built around the cellular-interference mechanism: PCDH19 LoF variant -> mosaic protocadherin-19 expression (via random X-inactivation in females; hemizygous males uniform and spared) -> cellular interference / impaired homophilic adhesion -> disrupted neuronal network assembly -> hyperexcitability -> fever-sensitive clustering seizures; plus a cognitive/behavioral effector. Two conforms_to links to the epilepsy module. Evidence snippet-verified: 18469813 (Dibbens founding EFMR), 29301106 (Pederick abnormal cell sorting - complete deletion abolishes it), 26123493 (Tan allopregnanolone deficiency), 36870093 (VIOLET ganaxolone RCT, PARTIAL), 19214208 (Depienne, PCDH19 major role / Dravet-overlapping), 19752159 (de novo). Diagnosis (mosaicism-aware testing) and prevalence (qualitative RARE) sections added. Discussions: cellular-interference completeness gap, allopregnanolone/neurosteroid hypothesis, and the mosaic-dependence therapy paradox. Caught and discarded a mis-cited Pederick PMID (29429936 = unrelated PSD-95 paper) during fetch-verify. All snippets confirmed as exact substrings; validation and folded-hyphen pass.

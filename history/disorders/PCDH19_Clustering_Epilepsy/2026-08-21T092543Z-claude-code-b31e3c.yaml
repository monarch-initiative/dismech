  summary: 'Compliance: add evidence to the cellular-interference chain, genetics
    and phenotypes'
  details: |
    Weekly compliance sweep. Weighted compliance 50.0%. Ontology terms were at 89.3%
    and every phenotype/cell-type term was bound, so the gap was evidence:
    pathophysiology[].evidence 1/7, phenotypes[].evidence 2/10, genetic[].evidence
    0/1.

    Added 17 evidence items across 5 pathophysiology nodes, 3 phenotypes, and the
    genetic block, each with a verified PMID and an exact-quote snippet. Two new
    references were fetched (PMID:39017914 Hungarian cohort, PMID:30451291
    multicenter electroclinical study); the rest reuse PMIDs already cited in the
    entry (18469813, 29301106, 32366910).

    The strongest additions are on the cellular-interference chain, which is what
    makes this entry mechanistically interesting and was almost entirely uncited:
    the mosaic node now carries both the mouse cell-sorting result and the human
    observation that mosaic males and heterozygous females are phenotypically
    indistinguishable - which is the cleanest available demonstration that mosaicism
    rather than sex is the operative variable.

    Three items are PARTIAL. The cortical malformations in PCDH19 patients are
    described by their own source as variable, so they cannot carry the
    network-assembly node alone. The mouse rescue experiment measures "altered
    network activity", which is not the same claim as the hypersynchronous,
    fever-sensitive hyperexcitability the human node asserts.

    One correction made during the work is worth recording. The Fever-Sensitive
    Seizures phenotype was first given PMID:29301106 as a PARTIAL anchor, with an
    explanation admitting the source does not state fever sensitivity at all. That is
    the "structurally valid, substantively empty" anti-pattern the evidence SOP warns
    about - it would have raised the compliance number while supporting nothing. It
    was replaced with PMID:39017914, which states the fever association, onset age,
    and clustering directly.

    Validation: `just validate` passed; `just count-verified-snippets` reported 32/32
    snippets verified against cached references; `just validate-terms` passed; all
    five ungated CI gates passed; `just validate-disorders` run as the pre-PR sweep.

    Weighted compliance 50.0% -> 65.5%.

    Remaining gaps: `datasets` empty; `pathophysiology[].downstream[].evidence` still
    largely unfilled (16 causal edges, 2 cited); five phenotypes still uncited
    (bilateral tonic-clonic, absence, myoclonic, atonic, aggressive behavior); and
    the `discussions[].proposed_experiments[]` sub-fields.

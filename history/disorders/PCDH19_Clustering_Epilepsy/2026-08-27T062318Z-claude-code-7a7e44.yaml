  details: |
    Weekly compliance pass focused on datasets. The entry had an empty datasets list; added two verified records found by a targeted GEO title search for PCDH19 - geo:GSE229366, expression arrays on neurospheres from Pcdh19 knockout, wild-type, and a mosaic mix of the two genotypes at day 0 and day 4 of differentiation, and geo:GSE333999, RNA-seq of mouse ESC-derived cortical neurons overexpressing the cleaved PCDH19 intracellular domain. Both resolved OK through just verify-datasets on 2026-08-27. GSE229366 is additionally listed on the proposed experiment exp_pcdh19_interference_vs_cell_autonomous inside the open knowledge gap gap_pcdh19_cellular_interference_completeness, because its three-genotype design is the in vitro mouse precedent for exactly the mosaic-versus-uniform contrast that experiment proposes to make in human organoids; that filled a previously empty proposed_experiments datasets slot. GSE333999 is flagged in its notes as a gain-of-domain overexpression experiment rather than a patient-variant or knockout comparison, and it bears on a nuclear-signalling role for protocadherin-19 that the entry's pathograph does not currently model. Only two GEO series carry PCDH19 in the title and both were kept; the discovery script's gene-level hits for this entry were all irrelevant. No pathophysiology evidence was added - those nodes were already well cited.

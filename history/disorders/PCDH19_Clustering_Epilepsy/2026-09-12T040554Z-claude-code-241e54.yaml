  summary: 'Review round: source the GSE229366 three-genotype design from GEO sample
    titles'
  details: |
    Review round on PR #9643; ai4c-reviewer requested changes on one blocking item.

    The reviewer flagged that the GSE229366 "mosaic mix" three-genotype design was unsourced, and that it is load-bearing: it is the stated reason the series is unusual and the sole justification for attaching it to exp_pcdh19_interference_vs_cell_autonomous, whose decision criterion turns on mosaic versus uniform-null tissue. Nothing committed corroborated it, because the cached GEO record holds only GEO's title and summary and that summary is the 2018 abstract, which describes knockout versus control only.

    Checked GEO at the sample level rather than softening the claim. GEO's own sample titles establish the three arms: neurosphere_wild_type_1..3 (GSM7159328-30), neurosphere_Pcdh19_knockout_1..3 (GSM7159331-33), neurosphere_mosaic_wild_type-Pcdh19_knockout_1..3 (GSM7159334-36), and the same three arms again after differentiation (GSM7159337-45). That is 3 genotypes x 3 replicates x 2 timepoints = the 18 samples GEO reports, which matches the arithmetic the reviewer had already noticed fit. The claim was correct; it was simply unauditable.

    Recorded the GSM accessions in the notes of both the entry-level datasets record and the copy attached to the experiment, and stated explicitly that the mosaic arm cannot be quoted from the cache file and is therefore recorded in notes rather than as a snippet. A reader can now check the claim against GEO at the sample level.

    Also took the reviewer's non-blocking point 1: recorded why the 2023-range accession carries a 2018 publication, namely that the series carries that paper's title and its summary is that paper's abstract verbatim, so it is a late deposit from an already-published study rather than a mismatched record.

    Housekeeping the round exposed: reverted cache/dataset_accessions.json to the merge-base version, since CLAUDE.md freezes it and this branch's older verify-datasets rewrites it on every run, and added the two references_cache/GEO_*.md records that geo: accessions now require as reference-cached references.

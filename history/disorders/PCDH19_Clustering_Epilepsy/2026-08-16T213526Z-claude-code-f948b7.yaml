  summary: Wire PCDH19 clustering epilepsy pathograph to its phenotype nodes
  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Problem: the PCDH19 chain (loss-of-function variant -> mosaic protocadherin-19 expression
    -> cellular interference -> disrupted network assembly -> network hyperexcitability ->
    fever-sensitive clustering seizures / cognitive-behavioral impairment) is well built and
    carries the pivotal cellular-interference evidence, but no causal edge reached the clinical
    layer. All 10 phenotypes floated (0/10 on phenotypes[].causal_inlink).

    Change: added downstream CausalEdges -
      - Fever-Sensitive Clustering Seizures -> Clustering Seizures, Focal-Onset Seizures,
        Fever-Sensitive Seizures, Bilateral Tonic-Clonic Seizures, Absence Seizures,
        Myoclonic Seizures, Atonic Seizures
      - Cognitive and Behavioral Impairment -> Intellectual Disability, Autistic Behavior,
        Aggressive Behavior

    The cognitive/behavioral phenotypes are wired from the dedicated
    Cognitive and Behavioral Impairment node, which the entry already places downstream of
    Disrupted Neuronal Network Assembly (i.e. parallel to the seizure arm, not caused by it).
    That preserves the entry's existing claim that the circuit-assembly defect, rather than
    the seizures, underlies the cognitive features.

    Two edges (Clustering Seizures, Focal-Onset Seizures) carry per-edge evidence graded
    PARTIAL: the cited cohort establishes the edge target as a near-universal clinical
    observation but does not assert the mechanism-to-manifestation step. Snippets are copied
    verbatim from evidence already present and cache-verified in this file.

    No new PMIDs, ontology terms, or evidence sources.

    Validation: just validate passed (schema + terms + references; "Snippets checked: 15/15
    verified against cached references"). Phenotype connectivity 0/10 -> 10/10; gene wiring
    was already 1/1 (PCDH19 on the trigger node) and was not touched.

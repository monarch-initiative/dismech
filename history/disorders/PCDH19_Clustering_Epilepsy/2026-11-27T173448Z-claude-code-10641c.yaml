  summary: 'Weekly compliance: progression and onset for PCDH19 clustering epilepsy'
  details: |
    Added a five-phase progression section (pre-seizure development, seizure onset, active epilepsy with recurrent clusters, decline in seizure frequency after about 10 years, adolescence and adulthood with cognitive and behavioral burden) sourced from PMID:32366910, PMID:30451291, PMID:19214208 and PMID:39017914, all already cached. Added quantitative onset (1.5-60 months, mean 12.2, median 10) to the Seizure cluster phenotype and an infantile onset category to Febrile seizure. Added evidence to the bilateral tonic-clonic, absence and myoclonic seizure phenotypes and to the antiseizure-medication treatment. Validated with just validate, validate-terms, count-verified-snippets (45/45) and validate-disorders.

  summary: Split bundled non-skeletal pathophysiology into four tissue-specific nodes downstream of Constitutive PDGFRB Activation, added Coronary Artery Aneurysm and systemic vascular surveillance, and wired all 16 clinical phenotypes into the causal graph.
  details: Added KOGS synonym, Harrison's GENETICS_ENVIRONMENT_DISEASE classification, childhood onset progression, and de novo plus familial inheritance evidence (DOI:10.1002/ajmg.a.62027, PMID:35221873). Replaced the bundled remodeling node with atomic Arterial Wall Dilation and Vascular Remodeling, Dermal Connective Tissue Abnormality, Subcutaneous Adipose Tissue Loss, and Cerebral White Matter Disease nodes, added Coronary Artery Aneurysm (HP:0030882), added NCIT-grounded PDGFRB molecular testing and brain MRI/MRA diagnosis entries, and added Systemic Vascular Screening and Blood Pressure Control (NCIT:C15747).

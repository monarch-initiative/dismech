  summary: 'LOINC tranche G: cohort-specific sweat chloride threshold'
  details: |
    Bound LOINC:2077-6 (sweat chloride) as a diagnosis measurement on the existing functional sodium-transport testing row, with a reference_ranges band at the original BESC1 report's own cohort-defining threshold (abnormal >40 mmol/L, normal <40 mmol/L, PMID:18507830) rather than the CF Foundation's higher CF-diagnostic decision limits already bound on the same code in Cystic_Fibrosis.yaml -- BESC1 is defined by excluding two pathogenic CFTR mutations, a different population. Notes disclose that the half-open lower_bound:40 band technically includes exactly 40.0 mmol/L, which the source's strict ">40" wording excludes, since no finer precision is reported for this cohort. Part of LOINC tranche G batch 9 (projects/LOINC_DIAGNOSTICS.md).

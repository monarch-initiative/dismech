  summary: 'Create: BESC1 (SCNN1B)'
  details: |
    Created new Disease entry for bronchiectasis with or without elevated sweat chloride 1 (BESC1, MONDO:0008887, OMIM:211400), a cystic fibrosis-like airway disease associated with germline SCNN1B (hgnc:10600, beta-ENaC) variants. Mechanism curated as an ENaC gain-of-function/increased-sodium-absorption chain distinct from CFTR-driven cystic fibrosis: ENaC channel hyperactivity (molecular_functions GO:0015280 GAIN_OF_FUNCTION) -> increased airway sodium/fluid absorption (GO:0006814 INCREASED) -> airway surface liquid depletion -> impaired mucociliary clearance (GO:0120197 DECREASED) -> chronic airway infection -> neutrophilic inflammation -> bronchiectatic airway destruction, with bare-name pathograph edges to the Bronchiectasis, Recurrent respiratory infections, and Productive cough phenotypes. Genetic block frames SCNN1B as a germline RISK_FACTOR susceptibility allele (heterozygous, incomplete penetrance, sometimes in trans with a CFTR variant), reflecting MONDO's omim_susceptibility subset. Evidence from three PMIDs with exact-quote snippets: Sheridan 2005 (PMID:16207733, SCNN1B beta-subunit variants in non-classic CF without CFTR mutations or renal disease), Fajac 2008 (PMID:18507830, ENaC beta/gamma variants and abnormal sweat chloride/NPD in idiopathic bronchiectasis), and the Mall 2004 beta-ENaC-overexpressing mouse (PMID:15077107, MODEL_ORGANISM, increased airway Na+ absorption -> ASL depletion -> CF-like lung disease). An EMERGING mechanistic_hypotheses block notes that variant-level functional characterization is incomplete. Validated with just validate, validate-terms, count-verified-snippets (22/22), check-duplicate-keys, check-entity-refs, check-causal-targets, and the batched just validate-disorders. Deleted the corresponding stub. See issue #10518.

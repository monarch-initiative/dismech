  summary: 'Create: Enlarged_Parietal_Foramina'
  details: 'Created a lumped entry for parietal foramina (MONDO:0018953) with has_subtypes
    rows for PFM1 (MSX2), PFM2 (ALX4, the claimed term), PFM3 (4q21-q23 locus, no gene) and
    PFM with cleidocranial dysplasia (MSX2, allelic with PFM1). The lump follows MONDO, where
    PFM1-3 are children of MONDO:0018953, and the shared pathograph: heterozygous MSX2 or
    ALX4 loss reduces calvarial osteoprogenitor proliferation, so the parietal bones fail
    to ossify around the parietal notch. Deleted the PFM1, PFM2 and PFMCCD stubs. Deep research:
    falcon was requested by default but Edison returned 503 Failed to authenticate on three
    attempts, including just dr_fallback=''--fallback'' research-disorder falcon, which did
    not fall back; deep-research-client providers --check showed claude_code as the only healthy
    provider, so research/Enlarged_Parietal_Foramina-deep-research-claude_code.md was run
    directly. Its reference validation was 69/69 resolved and 2/2 quotes valid; the two term-label
    mismatches were prefix-name artefacts. preflight-dr returned SKIP because MONDO records
    no causal gene on the parent term; a manual check confirmed the report is about this disease
    (top genes ALX4 and MSX2, OMIM 168500). GeneReviews chapter PMID:20301307 is the phenotype
    and management baseline and is tagged in references. Orphanet ORPHA:60015 supplies the
    prevalence band and phenotype frequencies; its cache file was written from Orphadata files
    newer than the manifest pin (release 2026-06-23 vs pin 2025-12-09), as the fetcher warned.
    Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-coarse-phenotypes and check-genereviews
    all pass. A fresh-context pre-PR review (dismech-pr-review checklist) led to these changes:
    the venous phenotype was rebound to HP:6000295 Persistent falcine venous sinus at disease
    level, with Reddy 2000 (PMID:10720293) and an MSX2 row from Table 1 of PMID:16319823,
    because the finding is not ALX4-specific; the PFM2 restriction was removed from polymicrogyria;
    the ectomeninx node was recorded as an EMERGING mechanistic hypothesis, with evidence
    on each of its edges; the Msx2-null limitation no longer asserts that heterozygous mice
    are normal, which no cited source states; a PROXY_QUANTITY divergence was added to the
    compound-mutant link; a tissue-expression item (PMID:11017806) wrongly graded HUMAN_CLINICAL
    was dropped; and Orphanet frequency rows, an atretic occipital encephalocele phenotype
    and a note on omitted Orphanet annotations were added. Final checks: count-verified-snippets
    78/78, check-reference-titles and validate-disorders pass.

    '

  summary: 'Create: Mucous_Membrane_Pemphigoid'
  details: |
    New entry for mucous membrane pemphigoid (MONDO:0018746), closing claim issue #12769. Lump/split decision: entry_type DISEASE. Ocular MMP is a has_subtypes entry bound to MONDO:0008109 (ocular cicatricial pemphigoid, MONDO's only descendant); anti-laminin 332 MMP is a serological has_subtypes entry with no MONDO class. The stub is deleted. Deep research: one Perplexity report (research/Mucous_Membrane_Pemphigoid-deep-research-perplexity.md). Reference validation 7/7 resolved (6 on topic). Term validation 12/12 resolved but needs_review: NCIT:C9777 is labelled Immune Globulin Therapy in the report yet is a CDP chemotherapy regimen, so it was not used; IVIG is bound to NCIT:C121331 with NCIT:C80829 as agent. preflight-dr returned SKIP (MONDO records no causal gene); disease identity was checked manually against the MONDO label, synonyms and parent (autoimmune bullous skin disease). Perplexity cites mostly URLs, so PMIDs were located via PubMed E-utilities; the entry cites 28 PMIDs, led by the 2021 EADV S3 guideline parts I and II (full text cached) and primary cohort, HLA, mouse passive-transfer and conjunctival-fibroblast studies. PMID:27456755 and PMID:40008456 cached with no quotable text and are not cited; the First International Consensus (PMID:11902988) abstract only describes its process, so it is listed in references without evidence items. ECTO has no DPP-4 inhibitor exposure class (queries recorded in the environmental notes), so the gliptin exposure is unbound. Causal wiring: every mechanism-to-phenotype edge carries its own evidence; phenotypes whose producing mechanism the sources do not state (chronic conjunctivitis, nasal, laryngeal and oesophageal symptoms, entropion, trichiasis, dry eye, fornix foreshortening, oesophageal web, malignancy) are left without edges and collected in a KNOWLEDGE_GAP discussion instead. Bare edges drafted earlier from the blister and fibrosis nodes to those phenotypes were removed before commit. Validation: just validate-disorders passed (102 snippets, 0 issues), count-verified-snippets 102/102, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, and the whole-KB snippet, title, grading, folded-hyphen, coarse-phenotype and reference-title gates all clean. check-genereviews: NO_CHAPTER for GeneReviews; a StatPearls chapter (PMID:30252376) exists and is not cited.

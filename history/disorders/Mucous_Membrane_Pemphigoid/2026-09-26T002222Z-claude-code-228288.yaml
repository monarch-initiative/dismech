  summary: 'Review round 1: Mucous_Membrane_Pemphigoid'
  details: |
    Addresses review round 1 on PR #12864. (1) reference_title backfilled from cache frontmatter on all evidence items (just backfill-reference-titles). (2) Added corneal phenotypes: Limbal Stem Cell Deficiency (HP:0032107) and Corneal Neovascularization (HP:0011496, preferred_term keratopathy with corneal neovascularization), both quoted from the EADV S3 guideline part I; HP:0000559 Corneal scarring was not used because no cached quote states corneal scarring. The blindness path now runs Symblepharon, Trichiasis, Dry Eye and Limbal Stem Cell Deficiency -> Corneal Neovascularization -> Blindness as phenotype sequelae, each with the guideline sentence. The direct Mucosal Subepithelial Fibrosis -> Blindness edge was removed and its PMID:21224056 quote moved to the Blindness phenotype evidence. (3) Added treatments Azathioprine (CHEBI:2948), Etanercept (NCIT:C2381, supported only by a narrative review, PMID:32905166) and Surgical Release of Scarring and Strictures (NCIT:C15329, SURGERY) with the guideline timing caveat; no target_mechanisms because no source states one. (4) Nasal Involvement frequency band removed: nasal lesions were 30/110 (a lower bound) and the 35% figure covers all nose-and-throat sites. (5) The PMID:40985889 background quote about the human disease is regraded HUMAN_CLINICAL. (6) The redundant qualifier on the direct immunofluorescence diagnosis term was removed. Validation: validate-disorders passed (115 snippets, 118 titles, 0 issues); count-verified-snippets 115/115; validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading, check-reference-titles and check-duplicate-keys clean.

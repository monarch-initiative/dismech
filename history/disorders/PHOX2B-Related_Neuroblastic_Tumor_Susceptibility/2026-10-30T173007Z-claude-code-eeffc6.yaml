  details: |
    Round one of review. One structural defect, one ontology improvement and one missing fact, all addressed; the deep-research item is answered by the decision already recorded on sibling pull requests.

    The defect was real and is the kind this repository warns about explicitly. A pathophysiology node named Neuroblastic Tumour was a British respelling of the phenotype Neuroblastic Tumor it pointed at, so the two collapsed into a near-duplicate and the node's only edge was a restatement. The node is removed, the upstream differentiation node now points straight at the phenotype, and the node's two evidence items, on advanced stage and on segmental chromosomal alterations, move onto the phenotype, which is where claims about tumour behaviour belong. The remedy follows the rule in the repository guidance: merge the edge onto the real upstream edge rather than renaming a node to dodge the collapse.

    The process term changed from neuron fate commitment to noradrenergic neuron differentiation, which is a better fit for a disturbance of differentiation and maturation and matches the programme PHOX2B actually governs. The reviewer also asked whether CL has a more specific progenitor term than migratory neural crest cell. It does not: searches of CL for sympathoadrenal and for sympathetic neuroblast return nothing, and the one sympathetic noradrenergic term is a mature neuron rather than a progenitor. That search and its result are recorded in the node notes, so the binding's breadth is explained rather than left looking careless.

    The reviewer also found a fact already present in a cached source and missing from the entry: PHOX2B accounts for approximately 10 per cent of heritable neuroblastoma. That is now a case_fractions row on the genetic record, with notes placing it in proportion, since familial disease is itself only 1 to 2 per cent of neuroblastoma, so the figure amounts to roughly one in a thousand cases overall.

    The reviewer's functional-work leads for the mechanism node were not pursued, because they would need literature this entry has not verified. The gap is instead stated in the node notes as the entry's main outstanding one, which is more useful to the next curator than silence.

    Validation: all 18 C4 gates pass after the changes.

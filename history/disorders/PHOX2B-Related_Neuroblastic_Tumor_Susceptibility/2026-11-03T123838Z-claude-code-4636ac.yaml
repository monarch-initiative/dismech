  summary: 'Review round 3: a SCREENING action may not carry target_phenotypes'
  details: |
    The reviewer identified the defect behind two merge-queue ejections, and correctly observed that the rebase pushed before this round could not have fixed it, because the failure comes from the entry rather than from the branch's position.

    The Neuroblastoma Surveillance treatment carried action_category SCREENING together with a target_phenotypes block bound to HP:0004376. The check check_non_therapeutic_actions_do_not_use_treatment_targets in tests/test_data.py rejects that combination, because those slots draw a treats edge and a surveillance schedule does not treat the tumour it finds. The block is removed and the action category is unchanged. The phenotype remains wired into the pathograph through Disrupted Autonomic Neuroblast Differentiation, so causal connectivity is unaffected, and the treatment description already states what is screened for and on what schedule.

    Why this was missed, and the fix beyond this entry. The test runs in the python pytest lane, which continuous integration selects by changed path, so a pull request touching only kb/ skips it while the merge queue runs it in the full suite. The pre-push gate set for this series ran eighteen checks but not pytest, which is exactly the hazard the repository guidance describes for check-snippet-grading and which applies to every data-driven check in tests/test_data.py. The gate script memory/newpr_saved/scripts/run_c4.sh now runs tests/test_data.py filtered to the changed entries as a nineteenth gate.

    The two suggestions carried from round 2 remain unanswered deliberately, and the reply on the pull request says so: the functional work on PHOX2B mutants that would let the differentiation node rest on experimental evidence is recorded in that node's notes as the entry's main outstanding gap, because the suggested references were flagged as unverified and this entry does not cite literature it has not read.

    Validation: all 19 gates pass, including the new pytest lane. 18 of 18 snippets verify.

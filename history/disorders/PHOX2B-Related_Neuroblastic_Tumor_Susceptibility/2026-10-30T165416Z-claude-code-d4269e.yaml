  summary: 'Create: PHOX2B-Related Neuroblastic Tumor Susceptibility (MONDO:0700041)'
  details: |
    New entry for the second single-gene neuroblastoma predisposition, alongside the existing ALK entry. It also deletes the NBLST2 stub it supersedes. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    The curation point of the entry is that risk tracks the class of variant rather than carrier status, by roughly thirtyfold. Two subtypes carry that: non-polyalanine repeat mutations, missense, frameshift or truncating, with a neural crest tumour risk of about 45 per cent; and polyalanine repeat expansions, with about 1 to 2 per cent, rising with expansion length. Both the round figures and the underlying counts are recorded, the latter from the 2005 series that reported 6 of 13 against 2 of 161, because the counts preserve something the summaries lose: the tumours in the two classes were of different kinds, invasive neuroblastoma in one and differentiated ganglioneuroma in the other.

    The provenance of the 45 per cent figure is recorded in the entry notes rather than taken on trust. Two reviews state it and both cite a chain back to a 2006 paper whose cached abstract carries no numeric figure, only the qualitative statement that neural crest tumours were more prevalent in the non-polyalanine group. The entry therefore cites the sources that actually state the numbers and says so.

    Three limits are recorded. The genotype-phenotype split is strong but not absolute, and a child with a polyalanine expansion who developed high-risk neuroblastoma is noted, which is why surveillance is recommended for longer expansions too. The tumours are predominantly differentiated, nine of thirteen in one series, but four were poorly differentiated, four patients had stage 3 or 4 disease, and adverse segmental chromosomal alterations were present in all six tumours tested; the authors' own conclusion about unpredictable prognosis is quoted. And no ClinGen tier is copied, because ClinGen curates PHOX2B against Haddad syndrome and congenital central hypoventilation syndrome rather than against this term.

    The molecular function on the lesion node is ABNORMAL rather than LOSS_OF_FUNCTION, because the two variant classes do not have the same effect and the cited sources characterise them by tumour risk and phenotype rather than by measured transcriptional activity.

    One attribution error was caught by the exact-quote check and fixed. A sentence giving the base rates of familial and bilateral neuroblastoma had been attributed to the 2017 workshop review; it is in the 2023 workshop update, and the citation was corrected rather than the quote altered. Reference titles were generated programmatically from each reference's own cache file rather than written, after that failure mode produced nine wrong titles on the preceding entry.

    Six references. All snippets verified.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-term-cache-integrity, check-shared-disease-terms, check-gene-validity and check-stubs after the stub deletion.

  summary: Evidence on both causal edges
  details: |
    Both causal edges were uncited. The germline-variant to disrupted-differentiation edge now carries two items with deliberately different provenance: a review sentence stating that PHOX2B is required for neural crest cells to become noradrenergic neurons, graded MODEL_ORGANISM and REVIEW_SYNTHESIS because the requirement was established in developmental work the review restates; and Trochet's introduction sentence tying heterozygous PHOX2B variants to disordered autonomic development in patients, graded HUMAN_CLINICAL and BACKGROUND because the authors are summarising their own earlier work. The differentiation to tumour edge is the stronger of the two: the 2015 series reports that these variants are predominantly associated with differentiating tumours, counted as five ganglioneuromas, three ganglioneuroblastomas and one differentiating neuroblastoma against four poorly differentiated, so a disturbance of differentiation is visible in the tumour phenotype rather than only inferred from the gene's developmental role. Trochet's conclusion that mutating a developmental master gene couples malformation to tumour predisposition is added as a second, INDIRECT item, because it states the coupling as a principle and does not measure the step.

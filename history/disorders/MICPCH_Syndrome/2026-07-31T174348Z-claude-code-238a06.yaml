  details: |
    Created the MICPCH syndrome entry (microcephaly with pontine and cerebellar hypoplasia; syndromic X-linked intellectual disability Najm type; MONDO:0010417; OMIM 300749; CASK) for issue #7212. Deep research provider falcon/Edison. NEC preflight passed - MONDO is_a CASK-related intellectual disability, OMIM:300749 xref matches, and the falcon report is anchored on CASK/MICPCH. The entry is deliberately scoped to the loss-of-function MICPCH arm and excludes the allelic hypomorphic CASK X-linked intellectual disability with or without nystagmus arm (OMIM 300422) and X-linked optic atrophy; that scope decision is documented in notes and enforced in the genetic and differential-diagnosis sections. GeneReviews chapter PMID:24278995 fetched and tagged, and all four of its abstract sections were mined. Curated 10 pathophysiology nodes in a connected chain, 27 phenotypes with HPO terms, structured prevalence, genetics with a domain-level genotype-phenotype correlation, diagnosis including the corpus-callosum imaging signature, 7 treatments including the preclinical JNK-inhibition lead, 1 animal model and a HUMAN_MODEL_MISMATCH discussion on which CASK molecular interface accounts for the brain phenotype. No conforms_to declared - cerebellar_purkinje_degeneration was evaluated and rejected because its calcium/proteostasis Purkinje-primary trigger is not what the CASK evidence shows. Validation: just validate PASS, just validate-terms PASS, programmatic snippet check 92 of 92 exact whitespace-normalised substrings with 0 mismatches, 0 dangling refs and 0 orphan nodes.

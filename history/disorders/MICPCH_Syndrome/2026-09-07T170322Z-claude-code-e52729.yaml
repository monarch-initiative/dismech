  summary: 'Phenotype review: MICPCH_Syndrome'
  details: |
    Reviewed all 27 phenotypes for snippet-claim consistency, HPO term optimality, and pathograph explanation. Snippet fixes: corrected the Seizures description, which asserted an epilepsy/ID-severity association while citing only the Italian cohort that found NO such difference; the association comes from the BINGO cohort (PMID:41039189), now cited, and the description presents both findings. Added quantitative human evidence from the PMID:41039189 full text to Inability to Walk (25.7% walk), Sleep Disturbance (74.12%), Cerebral Visual Impairment (90% above FCVIQ cut-off), Feeding Difficulties (57.1%), Hand Stereotypies (50% stereotyped behaviour) and Self-Injurious Behavior (42.86%), raising the last two from OCCASIONAL to FREQUENT with whole-spectrum caveats matching the entry's existing convention. Term rebind: Spasticity of the Extremities HP:0001257 Spasticity -> HP:0034353 Appendicular spasticity (exact match for hypertonia/spasticity of the extremities). Pathograph: added one new pathophysiology node (Retinal Ganglion Cell Deficit and Optic Nerve Axonopathy; PMID:29067402 CASK+/- mouse phenocopies ONH with complete penetrance, RGC loss, axonopathy; PMID:31425583 non-cell-autonomy plus a human ONH case with a CASK-destabilising p.Pro673Leu variant) wired from CASK Loss of Function and explaining Optic Nerve Hypoplasia and Optic Atrophy; added edges for Hypoplasia of the Pons, Inability to Walk (PMID:41039189 MICPCH-vs-microcephaly motor comparison), Axial Hypotonia, Ataxia (PMID:40422253 JNK-IN-8 rescue), Global Developmental Delay, Cerebral Visual Impairment, and Epileptic Spasms, all from existing nodes. Connectivity 6/27 -> 15/27. The 12 remaining unexplained phenotypes (SNHL, dystonia, appendicular spasticity, sleep, stereotypies, self-injury, feeding, scoliosis, four facial gestalt features) are deliberately left unwired and recorded in a new KNOWLEDGE_GAP discussion: no CASK-specific mechanism exists for any of them (prestin-CASK cochlear interaction is untested biophysics; basal ganglia/corticospinal circuits unstudied in CASK models). Validated: just validate, count-verified-snippets (109/109), validate-terms, check-duplicate-keys, check-entity-refs, validate-disorders all passed.

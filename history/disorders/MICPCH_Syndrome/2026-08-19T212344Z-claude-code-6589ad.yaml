  summary: Lengthen three sub-5-word evidence snippets to verbatim claim-bearing sentences
  details: |
    CI gate scripts/check_snippet_length.py --against-ref origin/main flagged three snippets under the 5-word minimum. Because the gate grandfathers against the base branch, everything a new-disorder branch adds counts as new, so these pre-dated the EEG edit but still had to be fixed at source; they were deliberately NOT added to tests/snippet_length_baseline.txt, since CI never reads the committed baseline. Each was replaced by a longer verbatim span from the same already-cached reference, chosen as the sentence that actually makes the claim. phenotypes[4] Progressive Microcephaly (PMID:21954287): 'severe postnatal microcephaly' became the cohort sentence reporting that analysis of 20 patients in this study plus five previously reported patients revealed a core clinical phenotype comprising severe developmental delay/intellectual disability and severe postnatal microcephaly often associated with growth retardation - this is what establishes the acquired, progressive character rather than primary congenital microcephaly. treatments[2] Physical Therapy and treatments[3] Nutritional Support (both PMID:24278995, GeneReviews): 'use of physiotherapy' and 'nutritional support' were bare clause fragments lifted from a single enumerating sentence; both now quote that whole sentence, with the explanation naming the clause each treatment relies on. No cache file was created or edited and no reference was refetched. After the change just count-verified-snippets still reports 94/94 verified, check_snippet_length reports no new snippets under 5 words, and just check-title-snippets reports no new title-quoting snippets.

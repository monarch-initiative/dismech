  summary: 'Create: Dopamine Beta-Hydroxylase Deficiency'
  details: |
    New entry for dopamine beta-hydroxylase deficiency (MONDO:0009123, orthostatic hypotension 1), claimed in issue #15450.

    Deep research: Falcon was requested but failed with an Edison 403 authentication error; the run fell back to claude_code (research/Dopamine_Beta-Hydroxylase_Deficiency-deep-research-claude_code.md). Its reference validation resolved 57/57 references; 3 of 36 quotes did not match (PMID:33034372, PMID:7715704, PMID:10051631), so no quote was reused from the report and every snippet in the entry was taken from the cached source. Term validation found 3 paraphrased UBERON labels, none bound here. just preflight-dr PASS (DBH mentioned 92 times; OMIM 223360 matches MONDO).

    Content: DBH genetics (c.339+2T>C, -1021C>T pseudodeficiency caveat), a pathograph from biallelic DBH loss through blocked noradrenaline synthesis, dopamine release as false transmitter, absent adrenaline, failed baroreflex vasoconstriction, to neurogenic orthostatic hypotension and the other phenotypes; prevalence, progression, biochemical markers with LOINC codes (DOPamine and EPINEPHrine seeded with just loinc-seed-cache), diagnosis, differentials (OH2/CYB561, Menkes, familial dysautonomia, AADC deficiency, PAF, MSA), treatments (droxidopa, fludrocortisone/midodrine, avoidance of orthostatic stressors, ptosis surgery, surveillance, genetic counseling) and the Dbh knockout mouse. GeneReviews chapter PMID:20301647 cited and tagged. The Dutch cohort (PMID:33034372, full text) is the main clinical source. PMID:15240410 calls the disease autosomal dominant and is not cited for inheritance.

    Validation: just validate passes (schema, terms, references); count-verified-snippets 154/154; whole-tree and per-file CI gates clean.

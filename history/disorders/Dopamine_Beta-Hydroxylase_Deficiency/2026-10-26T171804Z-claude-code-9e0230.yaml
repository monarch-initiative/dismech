  details: |
    Review round 1 on PR 15557.

    Blocking findings addressed:
    - reference_title added to all 171 evidence items, copied programmatically from the
      title frontmatter of each references_cache file. just check-reference-titles passes.
    - GeneReviews (PMID:20301647) genetic counseling section mined: the autosomal
      recessive sentence and the 25/50/25 sib recurrence sentence added to the
      inheritance block, and the carrier/prenatal/preimplantation testing sentence added
      to the Genetic counseling treatment.
    - The PMID:27778639 sentence about DBH-deficient mice regraded from HUMAN_CLINICAL to
      MODEL_ORGANISM, keeping quote_role BACKGROUND, and the primary mouse paper
      PMID:12959968 added beside it on the same edge.

    Suggestions taken:
    - Syncope rebound from HP:0001279 to HP:0012670 Orthostatic syncope, with a note that
      the quoted Orphanet row annotates the parent term.
    - Orthostatic seizures: HPO searched for a convulsive-syncope term in the local HP
      build; the queries and their results are recorded verbatim in the phenotype notes.
      HP:0001250 Seizure is kept because no such term exists.
    - Surveillance: the GeneReviews specialist-referral-before-surgery-or-pregnancy
      sentence added, and the single caesarean case report kept as an illustration with
      its explanation rewritten to say so. The GeneReviews pregnancy blood-pressure and
      droxidopa dose sentence added to the Droxidopa treatment.
    - Alpha-2 to hypoglycaemia edge: the patient caveat added as REFUTE evidence and
      stated in the edge description.
    - Hypothermia: PMID:2300263 moved off the thermogenesis edge onto the Hypothermia
      phenotype, and the edge description now says the link is inferred from mouse
      uncoupling-protein data.
    - Thrombocytopenia (HP:0001873) and Premature birth (HP:0001622) added from
      PMID:33034372, left unwired because the source proposes no mechanism.
    - Environmental block added: heat with heavy meals and alcohol, strenuous exertion,
      and ephedrine, each EXACERBATES the baroreflex vasoconstriction failure node with
      exact-quote evidence. PMID:2795065 fetched for the ephedrine paradox.
    - The missense endoplasmic-reticulum-retention mechanism added as IN_VITRO evidence
      and a sentence of description on the Biallelic DBH Loss of Function node, rather
      than a separate node, because the cited work splits routes to loss of function
      rather than to a distinct downstream mechanism.

    Nothing from the review was declined.

    Validation: just validate, validate-terms, count-verified-snippets (171/171),
    validate-disorders, check-reference-titles, check-snippet-grading,
    check-causal-targets, check-entity-refs, check-enum-values, check-duplicate-keys,

  details: |
    Created the DSG2-related dilated cardiomyopathy (CMD1BB, MONDO:0013030) entry from the seeded stub. Deep research: Falcon (Edison Scientific) ran successfully (910s, 31 citations, template_sha 1e7ea4ee); just preflight-dr PASSED against MONDO:0013030 with DSG2 mentioned 75 times and no competing gene, so no Named Entity Confusion. The report's term_validation reported needs_review: true for one obsolete CURIE (GO:0062023, replaced by GO:0031012); that term was not bound in this entry. As is characteristic of Falcon reports in this repo, the report carries ZERO PMIDs -- it cites by author-year key and DOI -- so it was used strictly as leads. Every one of the 73 evidence snippets cites a PMID fetched independently via just fetch-reference from PubMed searches, and all 73 verify as exact substrings of the local reference cache. Falcon did contribute two mechanism arms found nowhere in my own initial PubMed sweep: the cardiomyocyte NF-kappaB / CCR2+ macrophage injury axis (PMID:38564300) and the misfolded-DSG2 ER-stress PERK-ATF4-TGF-beta1 fibrosis route (PMID:39227800); both PMIDs were located by searching PubMed for the DOI-cited titles, then fetched and quoted directly. Pathophysiology is an 11-node connected causal chain from DSG2 loss of function at the desmosome through intercalated-disc destabilization, which branches four ways (mechanical uncoupling, Nav1.5 sodium-current reduction, plakoglobin/Wnt, NF-kappaB inflammation) and reconverges on fibrofatty replacement, biventricular remodeling and heart failure. Three nodes conform to desmosomal_adhesion_failure (which names DSG2 as a route-1 structural gene) and two to cardiomyopathy_maladaptive_remodeling, matching the dual-conformance pattern used by Carvajal_Syndrome. The plakoglobin node is curated WITH its contradiction: PMID:26676851 is recorded as REFUTE because it shows the reduced junctional plakoglobin signal in desmoglein-2 mutant mice is epitope masking rather than relocalization, and a KNOWLEDGE_GAP discussion with a proposed experiment records that dispute rather than resolving it. A second KNOWLEDGE_GAP records that the dilated/right-dominant split between this entry and Arrhythmogenic_Right_Ventricular_Cardiomyopathy is a phenotypic convention, not a demonstrated mechanistic boundary. Allele dose is curated as two has_subtypes (Biallelic, Monoallelic) plus two Inheritance blocks. Two treatments (heart failure pharmacotherapy, antiarrhythmic pharmacotherapy) deliberately carry NO evidence item, with the reason in notes: no DSG2-specific trial exists and citing a general heart-failure trial would overstate what is known. NOT curated: datasets, biochemical, clinical_trials (Falcon found no DSG2-specific registered interventional trial), histopathology, definitions. Validation run and passed: validate, validate-terms, count-verified-snippets (73/73), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-stubs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, and the batched validate-disorders gate.

  summary: Create Dioctophymiasis infectious disease entry
  details: |
    Added a new Dioctophymiasis entry for MONDO:0000298 and deleted its stub. The curation binds the agent to NCBITaxon:513045, models the D. renale egg, oligochaete, fish/amphibian, and mammalian kidney stages, and separates ordinary adult-worm renal parenchymal destruction from ectopic larval or adult tissue residence.

    The entry uses PMID:30963996 for the 37-case human retrospective review, PMID:40867017 for life-cycle details and a molecularly confirmed gastric-wall infection, PMID:26952087 for the renal parenchymal destruction mechanism, PMID:28299768 for an imaging-detected right-kidney infection with worm removal, PMID:24095916 for a genetically confirmed dermal larval infection, and PMID:21158627 for a fatal bilateral renal infection.

  summary: 'Definitions: DSM-5 rule as criteria sets'
  details: |
    Added a DIAGNOSTIC_CRITERIA definition from the DSM-5 criteria listed in the StatPearls Premenstrual Disorders chapter (PMID:30335340): timing (A), at least 1 of 4 core symptoms (B), at least 5 of 11 symptoms (B and C), and severity, exacerbation and substance/medical exclusions with prospective confirmation (D-G); all sets required. No ICD-10-CM code was added because MONDO records none for MONDO:1010182. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

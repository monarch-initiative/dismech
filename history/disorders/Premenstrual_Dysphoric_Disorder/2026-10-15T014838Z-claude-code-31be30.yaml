  details: |
    Added the entry's first model records, both built from papers it already cited. The PMDD patient lymphoblastoid cell lines (PMID:28044059) became an experimental_models record linked to ESC/E(Z) Epigenetic Dysregulation as RECAPITULATES with fidelity UNKNOWN, because whether the difference exists in brain is the entry's open knowledge gap, and to Abnormal Sensitivity to Cyclic Ovarian Steroids as PARTIALLY_RECAPITULATES with fidelity LOW. Readouts record the mRNA increase and the protein decrease separately, since the abstract reports them in opposite directions. The BDNF Val66Met heterozygous mouse with ovariectomy and estradiol add-back (PMID:30356121) became an animal_models record linked to both nodes as PARTIALLY_RECAPITULATES with fidelity LOW; its divergences record the species gap, the behavioural proxy, and that six weeks of continuous estradiol stands in for cyclic hormone change. Both models attach to the existing ESC/E(Z) brain-translation knowledge gap. Ovariectomy and estradiol add-back are recorded in prose because AnimalModel has no non-genetic perturbation slot (#13768). The cell-type binding CL:0017006 B-lymphoblast was taken from the existing term and enum caches. No new references were added.

  summary: Record why the ESR1 susceptibility record is not wired to a mechanism node
  details: |
    Sixth tranche of the estrogen-signalling work in issue #12925. The ESR1
    genetic record reaches no pathophysiology node, and it stays that way,
    with the reason recorded in its notes and relationship_type SUSCEPTIBILITY
    added, which is what its existing association (Risk Factor) and evidence
    already say.

    The record rests on PMID:17599809, a case-control study of 91 patients and
    56 controls whose authors describe the intron-4 association as preliminary.
    Nothing read for this entry shows an ESR1 variant altering the neural
    response to ovarian steroids. The node that would be the landing, Abnormal
    Sensitivity to Cyclic Ovarian Steroids, rests on the add-back experiment in
    which estradiol and progesterone each reintroduced symptoms, and it binds
    the generic steroid hormone receptor signaling pathway for that reason; a
    single receptor gene on it would resolve the sensitivity to one receptor
    when the node's own evidence does not.

    Searches. PubMed for premenstrual dysphoric disorder with ESR1 or estrogen
    receptor alpha in the title or abstract returned eight records, all ESR1
    polymorphism association or moderation studies (PMID:17599809,
    PMID:29146473 among them), none reporting a receptor-level mechanism. The
    broader premenstrual-syndrome search returned ESR1 polymorphism
    associations (PMID:33577472, PMID:32759446, PMID:25416214) and unrelated
    treatment studies. None was fetched into the cache, because none is quoted.

    The deep-research report (claude_code) was read first. It carries the ESR1
    association and the COMT interaction from the same paper and proposes no
    receptor mechanism beyond them, so the decision here agrees with it.

    No cache file changed. Checks: validate, validate-terms and
    count-verified-snippets passed on the file; validate-disorders over the
    tranche passed; the offline gates listed in the Osteoporosis record for
    this tranche passed with no new findings.

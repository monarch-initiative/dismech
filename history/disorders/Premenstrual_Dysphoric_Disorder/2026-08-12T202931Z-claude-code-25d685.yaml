  details: |
    Backfill for issue #8085. Chronic stress is EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES into corticolimbic emotional dysregulation, which is where this entry places the affective reactivity these sentences measure; it is deliberately not pointed at the steroid-sensitivity node, which holds the trait rather than its expression. The stronger of its two items reports that greater lifetime stressor exposure may lead to heightened emotional reactivity to ovarian hormone fluctuations, a gene-by-environment claim about severity rather than onset, which is why the effect is exacerbating rather than predisposing. The history of interpersonal trauma exposure was deliberately left unlinked. Its only evidence item quotes the bare phrase A history of interpersonal trauma, five words lifted from a list, which records that the factor was named without recording what was found about it. That is the fragment defect blocked on in PRs #8168 and #8301 and the adjacent pattern to the title-as-snippet problem filed as issue #8374 and now enforced by tests/test_title_snippets.py. Rather than build a pathograph edge on it, the gap is left visible; a sentence stating the association and its magnitude would make the link drawable. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 59 of 59 verified.

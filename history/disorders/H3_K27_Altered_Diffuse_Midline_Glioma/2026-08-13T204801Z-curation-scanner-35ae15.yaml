  summary: Add GD2-CAR T cell therapy and the anti-CAR immunity resistance arm
  details: |
    Acted on preprint-scan issue #6429 (PPR:PPR1276296, anti-CAR immunity as a driver of acquired resistance to GD2-CAR T cell therapy in H3K27M+ DMG).

    Added a five-node intervention-conditioned arm hanging off the existing "Loss of Glial Differentiation" node: GD2 Surface Antigen Expression -> GD2-CAR T Cell-Mediated Tumour Cytotoxicity -> Anti-CAR Adaptive Immune Response -> Loss of GD2-CAR T Cell Persistence -> Acquired Resistance to GD2-CAR T Cell Therapy. Added a GD2-Directed CAR T Cell Therapy treatment (therapeutic_modality CELL_THERAPY, NCIT:C126102) with target_mechanisms pointing at the GD2 antigen node, and a clinical_trials record for NCT04196413.

    Evidence discipline: the issue instructs that the preprint must not be sole support. The two flanking peer-reviewed reports of the same trial (PMID:35130560 Nature 2022, PMID:39537919 Nature 2025) and the preclinical GD2 target paper (PMID:29662203) carry the antigen, cytotoxicity, treatment and non-durable-response claims. PPR:PPR1276296 is cited only for the HACA/anti-CAR immunity mechanism itself, which is flagged in a node-level note as awaiting peer review.

    Validation: "just validate" passed (schema, terms, references) on the changed file; the snippet audit reports 27/40 verified against cached references with 13 skipped by prefix (pre-existing DOI refs). A deliberate-corruption probe confirmed the PPR snippets are genuinely checked rather than skipped by prefix. "just check-title-snippets" clean. All new references fetched with "just fetch-reference".

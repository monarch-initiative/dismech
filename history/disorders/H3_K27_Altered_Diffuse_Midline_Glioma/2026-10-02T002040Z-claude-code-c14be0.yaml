  summary: Narrow DIPG subtype preferred_term and explain broad MONDO binding
  details: |
    The DIPG subtype is bound to MONDO:0006033 diffuse intrinsic pontine glioma, which is broader than the row because it includes H3-wildtype tumors. preferred_term is now H3 K27-altered diffuse intrinsic pontine glioma, and the descriptor description records the scope difference. An OLS lookup on 2026-10-02 confirmed that MONDO:1060171 (this entry's disease term) is the only child of MONDO:0006033, and a MONDO search for diffuse intrinsic pontine returned no narrower pontine class. This was suggested in review of monarch-initiative/dismech#13282.

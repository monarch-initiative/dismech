  summary: 'Review response on PR #8437: reparent the GD2 arm, widen node locations,
    correct the durability claim'
  details: |
    Addressed the three IMPORTANT findings and two non-blocking SUGGESTIONS from the CHANGES_REQUESTED review on PR #8437.

    1. Reparented the GD2 arm. The edge into "GD2 Surface Antigen Expression" now originates from "Epigenetic Derepression and Aberrant Gene Activation" rather than "Loss of Glial Differentiation", is typed INDIRECT_KNOWN_INTERMEDIATES via ganglioside-synthesis gene upregulation (including B4GALNT1), and carries its own PMID:29662203 evidence item quoting the sentence that attributes GD2 overexpression to the oncohistone. "Loss of Glial Differentiation" returns to being a terminal leaf, as it is on main.

    2. Widened the GD2 node's locations from pons alone to pons + dorsal plus ventral thalamus + spinal cord, matching the convention already used by the "H3 K27M Oncohistone Mutation" node in the same file. Added an evidence item quoting the thalamic (QCTB-R059) and spinal cord (SU-pSCG1) patient-derived culture sentence from PMID:29662203.

    3. Corrected the acquired-resistance claim. The description now says "many patients" (the preprint's own word) rather than "most", and explicitly records the >30-month ongoing complete response as a counter-instance. Added the preprint's own "the durability of response has been limited in many patients" sentence as evidence, and replaced the PMID:39537919 snippet with the abstract-body sentence that actually reports loss of durable response, rather than the future-work sentence previously quoted. The explanation now states what that paper says instead of overstating it.

    4. Reworded the GD2 node description. The specificity contrast reported in PMID:29662203 is against H3 wild-type GD2-negative paediatric glioma cultures, not against normal brain; normal-brain GD2 expression is separately reported, and the therapeutic-window argument rests on the absence of significant neurotoxicity in human trials using the same 14g2a-derived binder.

    5. Moved the treatment target_mechanisms link from "GD2 Surface Antigen Expression"/MODULATES to "GD2-CAR T Cell-Mediated Tumour Cytotoxicity"/ACTIVATES. The therapy does not alter GD2 expression; it supplies the effector arm that turns pre-existing antigen into antigen-dependent killing.


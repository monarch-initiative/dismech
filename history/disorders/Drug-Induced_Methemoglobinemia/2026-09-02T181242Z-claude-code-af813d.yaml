  summary: 'Create: Drug-Induced Methemoglobinemia'
  details: |
    New entry for drug-induced methemoglobinemia (MONDO:0018740), the second case
    curated from the shared Toxicologic Phenocopy Atlas. Chosen because it is the
    only remaining Tier 1 pair in that atlas with a specific MONDO term whose genetic
    sibling is already in this KB: Hereditary_Methemoglobinemia (MONDO:0018963).
    Vigabatrin, leflunomide and the loop/thiazide diuretic pairs are equally clean
    mechanistically and have no MONDO disease term, so they cannot be entries;
    warfarin embryopathy has only an obsolete term.

    Modelled as a balance rather than as a lesion. Three decisions carry the entry:

    1. Baseline autoxidation and reductase recovery capacity are separate nodes, both
       entry points. Ferrous haem is oxidised continuously and the reductase drains
       the pool so efficiently that circulating methemoglobin is negligible. Without
       both nodes the disease reads as an abnormality appearing rather than an
       existing balance losing on the production side. This is what makes the
       phenocopy structural: the hereditary disease loses the reductase, this one
       outruns one that works, and the two share the accumulation node outright.
       PMID:8416301 names both routes and a third in a single sentence, which is
       quoted on the capacity node and on two differentials.

    2. Haemolytic anaemia hangs off the oxidant exposure node, NOT off methemoglobin
       accumulation. PMID:14579544 states that not all features observed in these
       patients are due to methemoglobin formation, and names chlorates as a case
       where the haemolysis is the greater threat to life. Drawing that edge from the
       accumulation would assert a causal claim the source contradicts. The edge
       description says so explicitly.

    3. Methylene blue failure in G6PD deficiency is a treatment entry in its own
       right rather than a caveat in notes. The antidote's action depends on NADP+,
       so it is less effective or ineffective in G6PD deficiency, and at high dose in
       the presence of haemolysis it can generate methemoglobin itself. That is
       curated with a REFUTE evidence item against the proposition that methylene
       blue treats this disease in such a patient, plus exchange transfusion as the
       alternative the source offers. A patient who does not respond to the antidote
       is a recognisable clinical situation with its own management, not an absence
       of treatment.

    The oxidant exposure node keeps the three oxidation routes the source
    distinguishes (direct oxidation, co-oxidation as in nitrites, and
    biotransformation to an active intermediate as in aromatic amino and nitro
    compounds) rather than listing culprit chemicals, because the sources sort them
    by route.

    Differentials: hereditary methemoglobinemia (the phenocopy), haemoglobin M
    disease (the third route to the same node, not curated as an entry), and cyanotic
    cardiac or pulmonary disease (what the patient is usually assumed to have, with
    the two bedside observations that point away from it).

    Evidence: 41 items over 5 references, all pre-verified against the local cache
    before writing except four in the phenotype and exposure blocks, which were
    written first and verified after; they passed, and the sequence was wrong.
    Anchors are PMID:14579544 (occupational review, which supplies the oxidation
    routes, the G6PD contraindication, the high-dose reversal, the negative evidence
    on antioxidant adjuvants and the exchange transfusion alternative), PMID:8416301
    (the balance and the phenocopy sentence), PMID:34463662 (methylene blue, and that
    its antidotal chemistry is the same chemistry that causes the disease), and
    PMID:21852596 (dapsone at therapeutic doses, and the delayed haemolysis).

    Claims deliberately not made: the six-fold methylene blue figure carries the
    source's own hedge that it is clinical experience and that no controlled trial of
    efficacy has been performed. The NADPH dependence is stated as the source states
    it, as a dependence on NADP+, without asserting the pentose phosphate pathway
    step that no cited source names. The metabolic acidosis edge is
    INDIRECT_KNOWN_INTERMEDIATES because the source reports the acidosis without
    assigning its origin. PMID:17379039 was fetched and not cited: no abstract.

    MONDO:0018740 was seeded from the local sqlite adapter after an OLS timeout, and
    conf/oak_config.yaml was restored and verified clean afterwards.

    Validation: just validate-disorders (the batched sweep CI runs) passed; 41/41
    snippets verified; check-folded-hyphens, check-duplicate-keys,
    check-title-snippets, check-environmental-evidence and check-entity-refs all
    clean; 36 tests pass; graph checked for dangling targets and unwired phenotypes,
    none, with the two balance nodes as intentional entry points. All reference_title
    values generated programmatically from the cache.

    Granularity pass after the first draft, at the user's request, to remove
    bundling from the pathophysiology. Three findings, in descending order of
    consequence.

    1. `Oxidant Exposure and Accelerated Haem Oxidation` was one node carrying the
       exposure plus three mechanistically distinct oxidation routes. Split into
       `Systemic Oxidant Exposure`, `Biotransformation to an Oxidising
       Intermediate` and the oxidation nodes. Biotransformation earns its own node
       because the parent compound is inert toward haem and the metabolism is what
       makes it dangerous, which is a different claim from oxidising haem.
    2. Direct oxidation and co-oxidation were then merged into one node with a
       `notes` block defending the merge. The defence was weak and the merge was
       undone. The two have OPPOSITE oxygen requirements, direct proceeding most
       readily in the absence of oxygen and co-oxidation requiring
       haemoglobin-bound oxygen, and both statements are quotable. That is a real
       distinction, so it earns two nodes, and the oxygen dependence is now
       carried as evidence rather than as prose.
    3. THE TOP-LEVEL DESCRIPTION ASSERTED A CLAIM NOTHING IN THE ENTRY CARRIED.
       It said ferric haem "distorts the remaining ferrous subunits so they
       release what they carry less readily". No node held it, no evidence
       supported it, and none of the four references states it. This is the third
       occurrence of the same defect in this session, in a third slot: isoniazid
       was description against notes, ackee was a differential's description
       against its own snippet, and this was the disease description against the
       whole entry. The claim was removed.

    The falcon report then returned that claim with a name, the Darling-Roughton
    effect, as an ordered step in its causal chain, citing sources this entry does
    not hold. Targeted searching found no citable primary source. It is curated as
    a KNOWLEDGE_GAP attached to `Impaired Oxygen Delivery`, with an experiment that
    would settle it and a note recording that the claim may well be correct and is
    simply not verified here. The same call as MCPG in the ackee entry.

    Final pathograph: 8 nodes, one claim each, no name joining two things, no
    dangling targets. The two entry points without inbound edges are the two arms
    of the balance, which is intentional.

    Deep research: falcon via Edison, 104 KB, zero PMIDs (normal for falcon, which
    cites by DOI), 14/14 references resolved, 0 unresolved, 0 off topic. Exit code
    3 was a term-validation OLS timeout on HP:0012378, not a content failure. NEC
    preflight SKIP, cleared manually: top gene mentions were G6PD, CYB5R3 and
    CYB5A, with G6PD leading, which is the right profile and confirms the antidote
    failure belongs in the entry rather than in a footnote.

    Not taken from the report for want of a source I hold: a 2024 cohort with
    per-agent case counts, and rebound methemoglobinemia after methylene blue with
    dapsone requiring repeat dosing. Both are worth having and neither is curated
    on the report's authority.

    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised two items. Both
    correct, and the second exposed a false statement I made in the PR body.

    1. No diagnosis: section, while the disease description asserted "a pulse
       oximeter that cannot be trusted" and the cyanotic-cardiac differential
       turned on oximetry being unreliable rather than low. This is the FOURTH
       occurrence in this session of asserting in prose what the entry does not
       carry, and the sharpest one: I pre-verified the exact supporting sentence
       ("Pulse oximetry is unreliable in the presence of methaemoglobinaemia.")
       earlier in the same session, then never used it. Verifying a quote and
       writing a claim that depends on it are two acts, and I did them separately
       and never joined them. Four diagnosis entries added: recognition from
       cyanosis with a saturation gap, the oximetry unreliability as its own
       entry, arterial blood gas with co-oximetry, and exposure history.

    2. PMID:22024786 (Skold et al.) has been committed in references_cache/ since
       the hereditary entry was curated, and I did not check what the repository
       already held. The PR body said material was "not curated for want of a
       source I hold", which was false: the source was on main. Three claims it
       supports are now curated. The saturation gap and chocolate-brown blood in
       the diagnosis section; benzocaine named alongside dapsone as a culprit,
       which adds the local anaesthetic class the entry lacked; and a new
       Reduced Oxygen Transport Reserve modifier node, because the same
       methemoglobin fraction is tolerated or not depending on whether oxygen
       transport was already impaired, which changes the treatment threshold
       without changing the biochemistry.

    Also taken from the suggestions: a progression: record for delayed onset over
    hours to days after low-level inhalational or repeated dermal exposure,
    quotable from PMID:14579544 and clinically load-bearing, since the exposure
    may have ended before the patient presents.

    Final pathograph: 9 nodes. Three entry points without inbound edges, which are
    the two arms of the balance and the reserve modifier.

    Process note for the next entry: before writing, check what is already in
    references_cache/ for the disease and its siblings. Two of this round's items
    were closed with a reference the repository had all along, and one of them I
    had already verified a quote from.

    Review round 2 (ai4c-reviewer, CHANGES_REQUESTED) confirmed both round-1 items
    closed and raised one new item, which was a good catch about this entry's own
    reasoning rather than about coverage.

    All four diagnosis_term bindings were NCIT:C124351 Clinical Evaluation with
    preferred_term "clinical assessment". Two of the four name procedures NCIT
    codes specifically, and both codes were already committed here, enum-proven,
    and already used as diagnosis_term in other entries. The point that matters:
    this entry splits pulse oximetry from arterial blood gas into separate
    diagnosis entries BECAUSE the diagnostic identity of the disease is that those
    two measurements disagree, and then bound both to the same generic term, so
    the distinction survived only in the entry names and nowhere a query could
    reach it. Pulse oximetry is now NCIT:C38085 and the blood gas is NCIT:C217391,
    both verified cached and enum-valid before use.

    The two entries that remain on NCIT:C124351 are recognition from cyanosis and
    exposure history. Taking a history is not a coded procedure and no more
    specific class fits, and a note on the exposure-history entry records that
    choice alongside the reason the other two were made specific, so the generic
    bindings read as decisions rather than as the same oversight repeated.

    The four preferred_term values were also paraphrases of the broad label, less
    specific than the entries they described, so they recovered nothing the
    binding dropped. All four replaced.

  summary: Add a diagnosis row binding a G6PD phenotype LOINC code to the methylene
    blue contraindication
  details: |
    LOINC tranche H batch 2. The entry's treatment section already describes a recognized clinical situation, 'Methylene blue failure in G6PD deficiency,' where the antidote is less effective, ineffective, or itself contraindicated at high dose because its action depends on NADPH. Added a new diagnosis row, G6PD Status Assessment Before Methylene Blue, to carry the measurement identity for that clinical fact rather than leaving it only in treatment-row prose. Searched both the gene-symbol abbreviation 'G6PD' (which surfaces only sequencing/mutation-analysis codes, not a clinical activity assay) and the spelled-out enzyme name 'glucose-6-phosphate dehydrogenase' (which, with the added 'Blood'/'Erythrocytes' qualifier, surfaces the clinical panel including several method-specific quantitative activity codes and two method-less qualitative ones). Bound the method-less qualitative code, LOINC:42319-4 (Glucose-6-Phosphate dehydrogenase phenotype [Interpretation] in Red Blood Cells), since the clinical question this entry's claim turns on is deficient-vs-normal status rather than a quantitative activity level. diagnosis_term is bound to NCIT:C80184 (Glucose-6-Phosphate Dehydrogenase Measurement) rather than a genetic-testing term, since this is a phenotype/enzyme assay, not DNA sequencing; this NCIT CURIE and its enum-cache membership were verified by validate-terms, which legitimately grew cache/ncit/terms.csv and cache/enums/treatmentactionterm_*.csv (diagnosis_term shares TreatmentDescriptor's dynamic enum). Evidence reuses the existing in-file PMID:14579544 sentence stating methylene blue's dependence on NADPH and reduced efficacy in G6PD deficiency.

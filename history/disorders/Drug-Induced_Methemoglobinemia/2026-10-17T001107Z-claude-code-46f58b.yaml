  summary: 'Review fix: rebind G6PD measurement to the Part code, not the interpretation
    field'
  details: |
    Corrected a wrong LOINC binding caught in review on PR #14618. The G6PD Status Assessment Before Methylene Blue diagnosis row was bound to LOINC:42319-4, 'Glucose-6-Phosphate dehydrogenase phenotype [Interpretation] in Red Blood Cells' -- an [Interpretation] code names the narrative conclusion field a lab reports its result into, not the test that was performed, so binding it asserted the test's identity is the interpretation slot rather than the assay. Searching the spelled-out enzyme name returns the whole LOINC family for this analyte: the Part code LP15601-5 (specimen- and method-free), nine quantitative activity codes differing by unit and method, a second Part code for the phenotype concept (LP36035-1), and two [Interpretation] codes (42319-4, 49266-0). Rebound the measurement to LOINC:LP15601-5 'Glucose-6-Phosphate dehydrogenase', the Part code, which is the correct identity-level binding within this analyte's family -- the same panel-first/Part-first rule already applied to the joint TPMT+NUDT15 panel on Cronkhite-Canada_syndrome, one level down: within one analyte's family the order of preference is Part code, then quantitative assay, then never the interpretation or comment field. Dropped the orphaned LOINC:42319-4 cache row after confirming via a whole-repo grep that nothing else referenced it, and seeded the correct LP15601-5 row, confirmed absent from origin/main before seeding (grep of origin/main's cache/loinc/terms.csv returned no match). Label verified fresh from the Monarch KG entity endpoint rather than assumed. No other binding in this PR needed to change: the DPYD/UGT1A1 codes on Chemotherapy_Induced_Diarrhea, the urinary dihydrouracil/dihydrothymine codes on Dihydropyrimidinase_Deficiency, and the joint TPMT/NUDT15 panel on Cronkhite-Canada_syndrome were all independently re-verified as correct.

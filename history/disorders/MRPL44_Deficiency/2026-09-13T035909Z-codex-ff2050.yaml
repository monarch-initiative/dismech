  summary: Review MRPL44 clinical phenotypes and qualified causal pathways
  details: |
    Reviewed all 17 baseline phenotypes on evidence, HPO specificity and causal attribution, plus missing clinical findings, using the full Falcon report/citations, primary abstracts, the complete 2021 infant clinical/functional paper and the 2025 single-patient cardiomyocyte preprint. Added 15 case-scoped clinical findings and the central-core biopsy observation. Removed three unsupported frequency bands while preserving counts and selection limits; broadened specific learning disability to cognitive impairment. Preserved qualified translation-defect attribution for the skeletal and neurological syndrome and represented acute acidosis and circulatory routes. Removed a clinical-restatement heart-failure node and unsupported chronic ATP/cumulative injury narrative; retained the provisional nutrient-stress hypertrophy hypothesis without measured FAO-flux or mTOR-activity claims. Preserved the 16q23.3 deletion, chromosome 2 isodisomy and 2025 VUS caveats; corrected allele-residual-function and recommendation/interpretation grading. Assay readouts are observational links. Exact reference titles were checked for all evidence. Remaining intrinsic metabolic, feeding, hepatic and infection attribution limitations are explicit. Full 2015 and adult-2021 texts were not accessible; their primary abstracts and detailed cited clinical summaries in the 2021 infant full text were used, without claiming to have read inaccessible tables. Prior history remains unchanged. Final fixed-base validation is recorded in the PR and retained gate logs.

    Final source-based review added the qualified OXPHOS-to-lactic-acidosis relation using the biochemical review PMID35806492 and the actual MRPL44 neonatal measurements; tissue-level uncertainty does not negate this supported relation. The final graph has 26 of 32 clinical phenotypes causally connected, with six clinical attribution gaps and five separate biochemical readout links. Mixed clinical shock observations retain HUMAN_CLINICAL grading with qualified attribution; the MT-CO1 tissue observation is likewise HUMAN_CLINICAL. Multisystem edge caveats distinguish the adolescent report from the adult isodisomy case.

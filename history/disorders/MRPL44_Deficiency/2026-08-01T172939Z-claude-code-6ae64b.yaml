  summary: 'Create: MRPL44 Deficiency'
  details: |
    De novo curation of MRPL44 Deficiency (COXPD16, MONDO:0014162, OMIM 615395, ORPHA:352563, gene MRPL44 / hgnc:16650), an ultra-rare autosomal recessive mitoribosomal large-subunit 39S translation defect causing infantile hypertrophic cardiomyopathy with combined complex I and IV deficiency. NEC preflight was run against MONDO:0014162 via OAK and confirmed gene MRPL44, OMIM:615395, and the COXPD16 synonym; the entry is explicitly distinguished from MTO1 deficiency (MONDO:0013865) and from SLC25A3 cardiomyopathy-hypotonia-lactic acidosis syndrome, which are separate entries. Duplicate preflight against origin/main, all PRs, and all issues found no prior coverage. Deep research used Edison/Falcon via just research-disorder falcon MRPL44_Deficiency (640 s, 22 citations); the report was verified on-target and used only as leads. All literature was independently fetched with just fetch-reference and every snippet verified as an exact substring of the cached text. Primary sources: PMID:23315540 Carroll 2013 index family with L156R, 39S assembly and 16S rRNA defect, retroviral rescue; PMID:25797485 Distelmaier 2015 late multisystem and neuro-ophthalmological spectrum; PMID:34140213 Friederich 2021 full text with tissue-graded combined CI/CIV deficiency, quantitative mitochondrial translation assay, cardiac electron microscopy and allelic series; PMID:33742325 Horga 2021 maternal uniparental isodisomy of chromosome 2 as a route to homozygosity; PMID:40402202 Gargouri 2025 novel Tunisian delins allele classified ACMG VUS; PMID:26221731 and PMID:38950860 Mrpl44 and yeast MrpL3 functional work; PMID:30384889 KidCMP childhood cardiomyopathy cohort; ORPHA:352563 Orphanet clinical definition with the cache rebuilt via just structured-rebuild-orphanet; and DOI:10.1101/2025.09.24.678132 Pradhan 2025 bioRxiv preprint on patient iPSC-cardiomyocyte nutrient-dependent pathology. An eight-node pathograph was curated running from biallelic MRPL44 loss through 39S assembly failure, impaired mitochondrial translation, failed compensatory mtDNA replication, combined CI/CIV deficiency, cardiomyocyte bioenergetic failure, progressive heart failure, and late multisystem involvement, plus an EMERGING mechanistic_hypotheses entry nutrient_dependent_postnatal_manifestation tagging the preprint-supported ISRmt and lipid arm. Added 16 phenotypes, 2 imaging findings, 2 histopathology findings, 5 biochemical markers, 5 variants with an autosomal recessive inheritance block flagging uniparental disomy, 4 treatments, and 4 discussions comprising 3 KNOWLEDGE_GAP and 1 HUMAN_MODEL_MISMATCH covering the yeast and mouse model divergence. No GeneReviews article exists for MRPL44; the PubMed search returned zero hits and this was documented rather than substituted. Validation: just validate, just validate-references and just validate-terms all pass. 75 of 82 snippets were machine-verified; the 7 DOI-prefixed snippets are skipped by validator config and were verified manually as exact substrings. validate-graphs shows no MRPL44 issues and compliance is 87.3 percent.

  summary: Type three model systems off experimental_model_type OTHER
  details: |
    Three model_systems rows carried OTHER. 'Patient iPSC-derived cardiomyocyte' and 'Human iPSC-derived cardiomyocyte' are IPSC_DERIVED_MODEL. 'Engineered human heart tissue' is also typed IPSC_DERIVED_MODEL, which understates it: the row exists precisely to escape the immaturity of monolayer iPSC cardiomyocytes, but ExperimentalModelTypeEnum has no value for an engineered 3D tissue, and it is neither an ORGANOID (engineered heart tissue is scaffolded, not self-organizing) nor an ORGAN_ON_CHIP (no microfluidics is described). The 3D distinction stays in the row's name and description rather than in the enum.

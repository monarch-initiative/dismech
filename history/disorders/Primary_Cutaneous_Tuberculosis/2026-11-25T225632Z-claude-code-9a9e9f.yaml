  summary: 'Create: Primary Cutaneous Tuberculosis (tuberculous chancre)'
  details: |
    De-novo curation of primary cutaneous tuberculosis (tuberculous chancre / primary inoculation TB), MONDO:0957464. Exogenous inoculation of M. tuberculosis into a tuberculin-naive host -> unchecked multibacillary dermal proliferation -> caseating granulomatous response (conforms_to granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation) -> lymphatic spread forming the cutaneous primary complex -> caseous necrosis/ulceration and scarring. Phenotypes: papule/nodule, painless ulcer, regional lymphadenopathy, scarring. 3-phase progression. Antituberculous chemotherapy. 21 snippets exact-matched; deterministic granularity classes all clean. Scoped standalone vs lupus vulgaris / TB verrucosa cutis reactivation siblings (review_notes). Deep research claude_code.

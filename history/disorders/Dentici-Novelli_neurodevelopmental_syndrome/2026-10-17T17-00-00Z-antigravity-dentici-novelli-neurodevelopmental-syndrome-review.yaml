  summary: Deepen Dentici-Novelli neurodevelopmental syndrome with synonyms, classifications, prevalence,
    progression, grounded ZNF526 pathophysiology, and specific HPO bindings.
  details: Added DENNED synonym, Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE),
    literature case prevalence (12 cases, 11 ZNF526 variants), prenatal/infantile progression covering both
    truncating and missense genotypes, explicit pathophysiology roles, molecular function (GO:0003700),
    inferred cell types with explanatory notes (CL:0010012, CL:0002224), anatomical locations (UBERON:0000955,
    UBERON:0000956, UBERON:0000970, UBERON:0000965), replaced coarse HP:0002060 with specific HP:0009879
    on Simplified gyral pattern, and added Intellectual disability (HP:0001249), Hypertonia (HP:0001276),
    and Cafe-au-lait spot (HP:0000957).

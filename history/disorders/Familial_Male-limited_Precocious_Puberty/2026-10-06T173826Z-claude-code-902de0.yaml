  summary: 'Create: Familial Male-limited Precocious Puberty'
  details: |
    New entry for MONDO:0008303 (issue #12679), built from the sources and term checks the released claim listed. Pathograph: constitutive LHCGR activation, ligand-independent Leydig cell cAMP signalling, gonadotropin-independent testosterone synthesis, androgen-driven virilization, peripheral aromatization to estradiol, premature Leydig cell proliferation and secondary central puberty. Testicular germ cell tumour and Leydig cell adenoma are recorded as phenotypes with quoted evidence and no causal edge, because the association rests on case reports. The KiLHR D582G knock-in mouse is linked to two nodes, and the female mouse phenotype is recorded as a HUMAN_MODEL_MISMATCH discussion. Somatic Asp578His testotoxicosis is noted under genetic and excluded. No GeneReviews or StatPearls chapter exists (just check-genereviews). Validated with just validate-disorders (55 snippets, 0 issues), validate-terms, and the offline entity-ref, causal-target, enum, duplicate-key and snippet gates. Stub deleted.

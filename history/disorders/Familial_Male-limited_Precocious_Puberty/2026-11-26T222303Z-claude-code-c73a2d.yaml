  summary: 'Treatment-centred enrichment: Familial Male-limited Precocious Puberty'
  details: |
    Split the two lumped drug treatments into seven regimens (bicalutamide plus anastrozole; spironolactone plus testolactone; third-generation aromatase inhibitor with spironolactone; ketoconazole; cyproterone acetate; medroxyprogesterone acetate; GnRH agonist for secondary central puberty) and added testicular surveillance as a monitoring action. Each drug regimen now has target_mechanisms with its own evidence. Added pathophysiology nodes for the drug targets: the CYP17A1 17,20-lyase step (ketoconazole), androgen receptor activation (antiandrogens), estrogen action on the growth plate, pubertal pituitary gonadotropin secretion (GnRH agonists) and premature germ cell maturation; bound CYP19A1 and aromatase activity on the existing aromatization node. Added a biochemical section (testosterone, LH, FSH, estradiol, AMH, inhibin B, 17-hydroxyprogesterone on ketoconazole) with readouts, and two phenotypes (ADHD, oligozoospermia) left without causal edges because no mechanism is established. Sources were found by a PubMed and ClinicalTrials.gov sweep; every snippet was read in the cached abstract. No GeneReviews chapter exists (just check-genereviews) and no Orphanet record is cached for this disease. Validated with just validate-disorders (132 snippets verified, 0 issues), validate-terms, and the whole-repo offline gates. Four of 17 phenotypes remain causally unconnected by design (testicular germ cell tumour, Leydig cell adenoma, ADHD, oligozoospermia). Review round 1 (ai4c-reviewer, changes_requested): unbound the CYP17A1 17,20-lyase molecular function, following the Congenital_Adrenal_Hyperplasia precedent, because GO:0004508 is the hydroxylase reaction and the reviewer's suggested GO:0047442 resolves as obsolete; moved the estrogen node to GO:0030284 nuclear estrogen receptor activity; kept GO:0004879 on the androgen receptor node because the reviewer's suggested GO:0004882 is obsolete with 'term replaced by' GO:0004879, and recorded that on the descriptor. Took the three optional suggestions as well: the dose out of ketoconazole's dosing_interval, evidence on the aromatase-inhibitor-plus-spironolactone receptor link, and the testosterone snippet extended across the bracketed span to include the suppressed LH.

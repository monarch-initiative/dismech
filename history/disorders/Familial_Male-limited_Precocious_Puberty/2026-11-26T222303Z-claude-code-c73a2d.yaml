  summary: 'Treatment-centred enrichment: Familial Male-limited Precocious Puberty'
  details: |
    Split the two lumped drug treatments into seven regimens (bicalutamide plus anastrozole; spironolactone plus testolactone; third-generation aromatase inhibitor with spironolactone; ketoconazole; cyproterone acetate; medroxyprogesterone acetate; GnRH agonist for secondary central puberty) and added testicular surveillance as a monitoring action. Each drug regimen now has target_mechanisms with its own evidence. Added pathophysiology nodes for the drug targets: the CYP17A1 17,20-lyase step (ketoconazole), androgen receptor activation (antiandrogens), estrogen action on the growth plate, pubertal pituitary gonadotropin secretion (GnRH agonists) and premature germ cell maturation; bound CYP19A1 and aromatase activity on the existing aromatization node. Added a biochemical section (testosterone, LH, FSH, estradiol, AMH, inhibin B, 17-hydroxyprogesterone on ketoconazole) with readouts, and two phenotypes (ADHD, oligozoospermia) left without causal edges because no mechanism is established. Sources were found by a PubMed and ClinicalTrials.gov sweep; every snippet was read in the cached abstract. No GeneReviews chapter exists (just check-genereviews) and no Orphanet record is cached for this disease. Validated with just validate-disorders (132 snippets verified, 0 issues), validate-terms, and the whole-repo offline gates. Four of 17 phenotypes remain causally unconnected by design (testicular germ cell tumour, Leydig cell adenoma, ADHD, oligozoospermia).

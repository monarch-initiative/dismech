  summary: Fold MONDO:0033717 into the SCAR33 subtype
  details: |
    Resolved stub MONDO:0033717 (congenital cerebellar ataxia due to RNU12 mutation) as a SUBTYPE of this entry rather than a new disease. MONDO:0033717 is the Orphanet-derived term (ORPHA:512260) and the existing SCAR33 subtype term MONDO:0859360 is OMIM-derived (OMIM:620208); Orphanet lists both MONDO:0033717 and OMIM:620208 as exact cross-references, so they name one disease. Added an exactMatch MONDO mapping on the SCAR33 subtype with Orphanet cross-reference evidence, a top-level narrowMatch mapping so the stub queue treats the concept as curated, an Orphanet definition and differentiating description on the subtype, and six SCAR33-stratified phenotypes (intention tremor, dysarthria, cerebellar vermis atrophy, axial hypotonia, delayed gross motor development, nystagmus) cited to ORPHA:512260 phenotype rows. Deleted the stub. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

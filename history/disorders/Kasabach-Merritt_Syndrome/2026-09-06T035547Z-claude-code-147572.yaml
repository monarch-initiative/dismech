  details: |
    Addressed the CHANGES_REQUESTED review on PR 11187. Both blocking items and all four suggestions taken in one push. IMPORTANT 1: added clinical_trials with all five trials the deep research surfaced (NCT03188068, NCT02110069, NCT04775173, NCT04077515, NCT04448873); phase, status and enrolment were read from the ClinicalTrials.gov API rather than from the research report, so NCT02110069 carries status TERMINATED although its cached registry summary does not state the termination. IMPORTANT 2: expanded diagnosis from the laboratory triad alone to add Doppler ultrasound with contrast MRI, and lesional biopsy with the GLUT1-negative HHV8-negative immunophenotype, both quoted from the already-cached PMID:32014025; this removes the two places where the entry asserted diagnostics in prose without modelling them. Suggestions taken: Supportive Transfusion Management treatment carrying the platelet-transfusion restriction and the 48-hour consumption observation; progression with three phases; histopathology with two findings; Anemia phenotype bound to HP:0001903. Snippets verified 44/44 to 67/67. All offline gates pass, no baseline widened.

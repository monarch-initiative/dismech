  summary: 'Create: Kasabach-Merritt Syndrome'
  details: |
    New entry for Kasabach-Merritt syndrome (MONDO:0007708), curated from an Edison falcon deep-research report (research/Kasabach-Merritt_Syndrome-deep-research-falcon.md) plus primary literature fetched from PubMed. The pathograph is built as a causal chain from the abnormal angiogenic/lymphangiogenic tumour vasculature of kaposiform hemangioendothelioma through podoplanin-CLEC-2 platelet adhesion, intralesional platelet trapping and activation, a shear-driven amplification loop that feeds back onto trapping, consumptive coagulopathy, intralesional haemorrhage, and a separate infiltrative tissue-destruction arm that runs in tumours without the coagulopathy. Seven phenotypes, four treatments (sirolimus, corticosteroid, vincristine, resection), two differential diagnoses, GNA14 recorded as a somatic driver with an explicit negative series (PMID:31887709) tagged REFUTE against reading it as a constant feature. Validated with 'just validate' (schema, terms, references): 43/43 snippets verified against cached references, no term errors. check-entity-refs, check-duplicate-keys and check-title-snippets all pass. Compliance 99.1% global / 100.0% weighted; the only gap is datasets, and the dataset-discovery disposition is recorded in review_notes. Two evidence items initially carried a fabricated title and snippet for PMID:30655857; the reference validator caught both and they were replaced with real quotes from other cached papers.

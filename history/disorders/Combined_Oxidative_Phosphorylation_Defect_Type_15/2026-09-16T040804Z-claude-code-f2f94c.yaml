  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 15'
  details: |
    De-novo curation of MTFMT-related COXPD15 (MONDO:0013987), claimed in issue 11926. Deep research: falcon (Edison) report research/Combined_Oxidative_Phosphorylation_Defect_Type_15-deep-research-falcon.md — IMPORTANT: that report is wholly about the wrong gene (TACO1, 63 mentions / 0 MTFMT — every section, not merely the executive summary as first stated), apparently seeded by noisy OpenTargets association rows naming TACO1 and MSTO1, and is unusable in full; it is retained only as a record of the provider error. A corrected, usable MTFMT artifact was later obtained via a claude_code re-run (research/Combined_Oxidative_Phosphorylation_Defect_Type_15-deep-research-claude_code.md, 75 MTFMT / 0 TACO1) during the PR #12085 review round. The correct gene is MTFMT, verified via MONDO:0013987 xref OMIM:614947 (COMBINED OXIDATIVE PHOSPHORYLATION DEFICIENCY 15) and the founding MTFMT literature. No content from the TACO1 report was used; the entry is built from the cached abstracts of Tucker 2011 (PMID:21907147), Haack 2014 (PMID:24461907) and Hayhurst 2019 (PMID:30911575), with the GeneReviews Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview (PMID:26425749) tagged as baseline. Validated: pre-edit hook (schema+terms), just validate-terms, just count-verified-snippets, offline gates, batched just validate-disorders.

  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 15'
  details: |
    De-novo curation of MTFMT-related COXPD15 (MONDO:0013987), claimed in issue 11926. Deep research: falcon (Edison) report research/Combined_Oxidative_Phosphorylation_Defect_Type_15-deep-research-falcon.md — IMPORTANT: that report's executive summary misattributes COXPD15 to TACO1 (apparently seeded by noisy OpenTargets association rows naming TACO1 and MSTO1); the correct gene is MTFMT, verified via MONDO:0013987 xref OMIM:614947 (COMBINED OXIDATIVE PHOSPHORYLATION DEFICIENCY 15) and the founding MTFMT literature. No content from the misattributed report sections was used; the entry is built from the cached abstracts of Tucker 2011 (PMID:21907147), Haack 2014 (PMID:24461907) and Hayhurst 2019 (PMID:30911575), with the GeneReviews Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview (PMID:26425749) tagged as baseline. Validated: pre-edit hook (schema+terms), just validate-terms, just count-verified-snippets, offline gates, batched just validate-disorders.

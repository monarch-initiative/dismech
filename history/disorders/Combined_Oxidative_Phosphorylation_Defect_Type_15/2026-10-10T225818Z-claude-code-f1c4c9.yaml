  summary: Add germline variant_origin to MTFMT genetic record
  details: |
    Gene-alignment review against the ai-gene-review MTFMT review. The MTFMT genetic record lacked variant_origin; added GERMLINE (biallelic inherited variants). HGNC binding hgnc:29666 and the molecular node (GO:0004479 methionyl-tRNA formyltransferase activity DECREASED; GO:0070124 mitochondrial translational initiation DECREASED) checked and consistent with the gene's normal function. ClinGen classifies MTFMT only for Leigh syndrome (MONDO:0009723), a different disease concept, so no gene_disease_validity was recorded. Validated with just validate, validate-terms and count-verified-snippets (23/23).

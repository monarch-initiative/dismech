  details: |
    Addresses review 1 of PR 15432 and the check-gene-activity-grounding CI failure. Bound GO:0008157 protein phosphatase 1 binding on the WBP11 Haploinsufficiency node, with PMID:14640981 evidence for the PP1-binding domains. Added Craniofacial anomalies (HP:0000271, SOURCE_UNSPECIFIED, 8/14) and Gastrointestinal malformations (HP:0011024, SOURCE_UNSPECIFIED, 7/14) from Table 2 of PMID:41975533; esophageal atresia keeps no band of its own because the 7/14 figure is a combined category. No cached source names anal atresia in a WBP11 patient, so none was added. Replaced the PMID:31874114 snippet on the haploinsufficiency-to-splicing edge with the intron-retention sentence. Rebound the retinal phenotype from HP:0000510 Rod-cone dystrophy to HP:0000580 Pigmentary retinopathy (no ERG reported) and added Chorioretinal coloboma (HP:0000567, whose synonyms include choroidal coloboma). Added postnatal growth-failure evidence to Short stature and two citations to the WBP4 differential (PMID:37963460, PMID:37425688). A diagnosis block for trio exome sequencing was not added. Validated with validate-disorders, validate-terms, count-verified-snippets (66/66), check-gene-activity-grounding against origin/main (WBP11 no longer flagged), check-coarse-phenotypes, check-entity-refs, check-causal-targets and check-snippet-grading.

  details: |
    New entry for VCTERL (MONDO:0030987, OMIM:619227), autosomal dominant WBP11 haploinsufficiency. Evidence from the defining cohort (PMID:33276377), later case reports (PMID:40089178, PMID:41185117), the 2026 Chinese case series with a cross-cohort phenotype table (PMID:41975533), the zebrafish knockdown model (PMID:42625817), and WBP11 splicing/centriole biology (PMID:14640981, PMID:31874114). Phenotype frequency bands are mapped from Table 2 of PMID:41975533. No GeneReviews or StatPearls chapter exists. Validated with just validate, validate-terms (pass), count-verified-snippets (57/57), check-entity-refs, check-causal-targets, check-duplicate-keys.

  details: |
    New entry for VCTERL (MONDO:0030987, OMIM:619227), autosomal dominant WBP11 haploinsufficiency. Evidence from the defining cohort (PMID:33276377), later case reports (PMID:40089178, PMID:41185117), the 2026 Chinese case series with a cross-cohort phenotype table (PMID:41975533), the zebrafish knockdown model (PMID:42625817), and WBP11 splicing/centriole biology (PMID:14640981, PMID:31874114). Phenotype frequency bands are mapped from Table 2 of PMID:41975533. No GeneReviews or StatPearls chapter exists. Deep research: falcon was requested but had no API key, so the recorded fallback ran openscientist (research/Vertebral_Cardiac_Tracheoesophageal_Renal_And_Limb_Defects-deep-research-openscientist.md; 14/14 references resolved, 0 unresolved terms; just preflight-dr confirmed WBP11 as the report's gene). The report added only the VACTERL clinical definition (PMID:23165726), used in the differential. Its prognosis and environmental findings come from the general VACTERL and esophageal atresia literature rather than WBP11-genotyped patients, and its gnomAD/ClinVar figures have no citable source, so neither was carried into the entry. Validated with just validate-disorders (58/58 snippets and titles), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-coarse-phenotypes.

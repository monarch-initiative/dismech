  summary: 'Create: MyD88 Deficiency'
  details: |
    Created kb/disorders/MyD88_Deficiency.yaml (immunodeficiency 68, MONDO:0012839, MYD88 hgnc:7562) as a sibling entry to the already curated IRAK-4 deficiency entry Immunodeficiency_67, which was used as the structural model so the two phenocopies stay parallel. First pass was built from PubMed E-utilities searches while an OpenScientist deep-research run was in flight: the founding series von Bernuth 2008 (PMID:18669862), the large international clinical-outcome cohort Picard 2010 (PMID:21057262), the transcriptional-module study PMID:25344726, the Roma founder-allele series PMID:39859960, the kindred report PMID:35286514, the combined MyD88/IRAK-4 SARS-CoV-2 cohort PMID:36880831, and the original Myd88 knockout PMID:9697844. The COVID-19 lead in the task brief cited PMID:37450565, which is a materials-chemistry paper on oxygen-reduction catalysts and nothing to do with this disease; the real TLR7/COVID-19 reference is PMID:36880831 and that is what the entry cites. Every figure quoted from Picard 2010 is one the source reports for the MyD88-deficient arm separately, except the pooled infection-free-years prophylaxis figure and the pooled high-IgE finding, both of which name both arms inside the snippet itself. The pathograph is a single chain from MYD88 loss of function through the abolished MyD88-dependent TLR/IL-1R signalling, failed NF-kappaB/MAPK activation and absent cytokine induction to the impaired inflammatory response, which branches into invasive pyogenic infection and weak systemic inflammation, plus a PROVISIONAL TLR7 branch to severe viral infection. Fourteen of fifteen phenotypes are wired in; the raised-IgE phenotype is deliberately left unconnected because no source here establishes how the adaptor defect raises IgE. All ontology identifiers were read from cache/*/terms.csv rather than written from memory. Validation: just validate passes (60 snippets, 67 titles, 0 issues), just validate-terms passes, just count-verified-snippets 60/60, entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes, snippet-length, title-snippets, snippet-grading, folded-hyphens and enum-values all clean, and just validate-disorders passes. just check-genereviews --online reports NO_CHAPTER for both GeneReviews and StatPearls. The OpenScientist report (research/MyD88_Deficiency-deep-research-openscientist.md) landed mid-session and was read afterwards. just preflight-dr returns WARN only because IRAK4 is mentioned 14 times against MYD88's 19, which is the expected phenocopy discussion rather than a second disease. Its citations were validated with just validate-research-reference and just validate-research-terms after the fact, because the generating run wrote no validation sections: 11/11 references resolved with 0 unresolved and 0 off topic, and 33/34 terms resolved with 1 unverifiable, 0 unresolved and 2 mislabelled. The two mislabelled ones are treatment NCIT codes, NCIT:C15617 offered as Antibiotic Therapy (it is Monoclonal Antibody 17-1A/sargramostim) and NCIT:C603 offered as Immunoglobulin Therapy (it is Isotretinoin); neither was bound, and the treatment bindings here were taken from the cache instead. Two report leads were folded in after checking their abstracts directly: PMID:25320238 for the T-independent IgM and marginal-zone-like B-cell arm, and PMID:20966070 for the death-domain S34Y and R98C variants. Leads not taken: PMID:20485341 (Myddosome crystal structure) and PMID:17004992 (murine TLR9 pneumococcal defence) add no claim this entry makes, and PMID:41369391 is a general review. Uncited reference cache files fetched while triaging searches were removed again; the report's own cited files are kept because the report is committed. Deleted the stub stubs/Pyogenic_Bacterial_Infections_Due_To_MyD88_Deficiency.yaml.

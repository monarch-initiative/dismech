  summary: Expand SEDC cellular-component and variant evidence
  details: |
    Added cellular-component bindings for the dominant-negative COL2A1 collagen-misfolding mechanism, covering rough endoplasmic reticulum, Golgi apparatus, and decreased extracellular matrix. Added in vitro evidence from PMID22028304 supporting abnormal processing and ER retention in cell-based assays from the Lpk SEDC model study. Structured the COL2A1 genetic section with variants for triple-helical glycine substitutions, patient-level SEDC glycine-substitution examples from PMID35581182, and Arg-to-Cys substitutions in Gly-X-Y repeats from PMID29439465. Schema, term, reference, and full validation were run for the edited disorder.

  details: |
    Acts on findings 1, 7 and 10 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    Finding 1: same unsourced iPSC/UPR hedge as Kniest; attached PMID:25187577 and PMID:40602718 with the same allele-scope caveat (p.Arg719Cys is not SEDC), and recorded that UPR engagement is unresolved for SEDC-causing glycine substitutions specifically.

    Finding 7: moved Cleft Palate and Flat Face off 'Impaired Growth Plate Organization' onto the upstream 'Dominant-Negative Collagen Misfolding' node. Palatal shelf fusion and the chondrocranium are not endochondral bone-formation processes, so parenting them to growth-plate disorganization asserted the wrong mechanism.

    Finding 10: the 3.4-per-million prevalence is quoted for SED overall (congenita plus tarda) from a case report, not a SEDC-specific primary study; notes and explanation now say so. Added PMID:25604898 as the explicit source for the 45% myopia / 12% retinal detachment figures, recording that the denominator is a mixed 93-patient COL2A1 cohort.

    Note: the first snippet drafted for PMID:25604898 did not appear in the cached abstract and was caught by reference validation; it was replaced with the real sentence, which reports the figures with confidence intervals.

    Validated: schema, reference and term validation all pass.

  summary: 'Create: Platyspondylic Dysplasia, Torrance Type'
  details: |
    Created the entry for MONDO:0007895 from the stub (claim issue 17221) and added it as a member of the Type_2_Collagenopathies grouping. Curated 8 pathophysiology nodes (COL2A1 C-propeptide variant, impaired procollagen II trimer assembly and secretion, retention in dilated rough ER, chondrocyte ER stress, growth plate chondrocyte apoptosis, abnormal type II collagen matrix, abnormal growth plate chondrocyte morphology, disordered endochondral ossification) with GO, CL and UBERON bindings and conformance to growth_plate_chondrocyte_failure; 22 HP phenotypes, 16 of them causally connected; ClinGen Definitive gene_disease_validity copied from the CGGV record for this MONDO term; two Col2a1 ENU mouse models bound to MGI:88452 with modeled_mechanisms; a HUMAN_MODEL_MISMATCH discussion (mechanism shown only in homozygous mice) and a CONTROVERSY discussion (triple-helical p.Gly1182Asp in a PLSD-T-like sib pair). Primary sources were fetched from PubMed and Orphanet (ORPHA:85166) first. The single deep-research report is OpenScientist; its reference validation resolved 12 of 12 references (0 unresolved, 0 needs review), and preflight-dr returned PASS. It was used as leads only and added one source (PMID:18678883, the Dmm mouse), cited as indirect model-organism evidence; its mislabelled term suggestions were not used. Validation: just validate, validate-terms, count-verified-snippets (82/82), check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-qualifier-terms, check-name-collisions, check-gene-namespaces, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-cache-order, validate-grouping and check-groupings all pass.

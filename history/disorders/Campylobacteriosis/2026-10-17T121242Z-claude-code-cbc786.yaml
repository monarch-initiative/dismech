  summary: Bind LOINC Campylobacter stool culture, NAAT and antigen codes
  details: |
    LOINC tranche B batch 26. Added diagnosis[].measurements on both rows. The stool culture and molecular confirmation row takes LOINC:6331-3 (Campylobacter sp identified in Stool by Organism specific culture) and LOINC:106552-3 (Campylobacter sp DNA [Presence] in Stool by NAA with probe detection), one per method the row names, both genus-level and stool-specific to match the row's own genus-level claim. The antigen row takes LOINC:57768-4 (Campylobacter jejuni+Campylobacter coli Ag [Presence] in Stool), whose two organisms are exactly the entry's two infectious agents and which carries no method qualifier.

    Absence basis for using method-qualified codes rather than a Part code: Monarch KG LOINC set (biolink:ClinicalMeasurement), query Campylobacter, 75 results, total equalled shown so the set was fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code present. The index does surface Part codes when they exist - the control query glucosylceramidase returns LOINC:LP15604-9 ranked first - so the absence is meaningful rather than an index miss.

    All three codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand. Checked for cache-row collisions against the 232 LOINC rows added by all 29 open loinc-* PRs: none.

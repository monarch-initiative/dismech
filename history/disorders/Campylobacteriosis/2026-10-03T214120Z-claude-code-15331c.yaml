  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for Campylobacter jejuni and C. coli. Hosts: Homo sapiens (NCBITaxon:9606, clinically affected host, not a maintenance host), Gallus gallus (NCBITaxon:9031, poultry, primary reservoir and main source of human transmission), Bos taurus (NCBITaxon:9913, ruminant reservoir). No vectors recorded: campylobacteriosis has no arthropod vector. Two stages: commensal intestinal carriage in the poultry and ruminant reservoir (DOI:10.3390/microorganisms12122669 for poultry as primary reservoir and for intestinal colonization of poultry as the vaccine target; PMID:31147581 genomic source attribution for the ruminant share) and human enteric infection after ingestion or animal contact (PMID:31147581). Block evidence PMID:31147581 states the commensal-carriage-plus-traceable-spillover framework. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

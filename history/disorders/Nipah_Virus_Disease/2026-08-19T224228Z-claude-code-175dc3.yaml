  summary: 'Address review round 3: trials, interferon antagonism, cell types, m102.4
    join, relapse phenotypes'
  details: |
    Third review round on PR 6913. Five blocking completeness items addressed, plus five suggestions.

    Item 1 - clinical_trials section absent. Added all five NCTs the reviewer supplied, each fetched with just fetch-reference and verified before curation. Enrolment counts returned by the ClinicalTrials.gov API matched the reviewer's figures exactly (192, 60, 120, 40), confirming correct trial identity. Phase and status use enum keys, PHASE_I and COMPLETED, not prose spellings. NCT01811784 is registered as Phase 1/Phase 2, which has no single corresponding value in ClinicalTrialPhaseEnum, so phase is omitted and the reason recorded in notes rather than misrepresenting it. Also cited the Tan 2024 state-of-play anchor.

    Item 2 - type I interferon antagonism absent. Added a MOLECULAR node "Type I interferon signaling antagonism" downstream of entry and upstream of dissemination, bound to GO:0060339. The reviewer was right that no cached reference covered this, so two new references were fetched: PMID:15279700 for the V protein arm and PMID:36851768 for the phosphoprotein P arm. Both are IN_VITRO.

    Item 3 - no cell_types on any pathophysiology node. Bound CL:0000115 endothelial cell and CL:0000192 smooth muscle cell on the endothelial tropism node, and CL:0000540 neuron on CNS invasion, matching the cells the already-present snippets name.

    Item 4 - m102.4 had no target_mechanisms join. Added a link to the ephrin entry node with treatment_effect INHIBITS. Note the schema slot is treatment_effect, not mechanism_action. This surfaced a real problem: the treatment description asserted m102.4 blocks G-glycoprotein binding to ephrin, and nothing in the cache supported it. Fetched PMID:24130486, which describes m102.4 as a receptor-blocking antibody and states the entry mechanism, and PMID:19888339, which identifies the G glycoprotein target and reports ferret post-exposure protection.

    Item 5 - relapsing/late-onset encephalitis and survivor sequelae missing. Added "Relapsing and late-onset encephalitis" with temporality RECURRENT and frequency VERY_RARE, supported quantitatively at 3/94 = 3.2% from Goh 2000 and corroborated qualitatively by the Kerala review's wording "rare". Added "Persistent neurologic deficits in survivors" with temporality CHRONIC and frequency OCCASIONAL at 15% from Goh 2000. Both bands are Pattern A/B quantitative, with the arithmetic documented.

    Suggestions addressed: item 6, NCIT:C217458 Diagnostic Serology Testing was tested with just validate-terms before switching and does validate as reachable, so the serology diagnosis term was upgraded from NCIT:C18020. Item 7, added a molecular_functions descriptor GO:0001618 virus receptor activity on the entry node; EFNB2/EFNB3 were deliberately not added to genetic, since they are host entry factors and not causal genes. Item 9, added a second modeled_mechanisms link from the animal model to CNS invasion. Item 10, added an ORGANISM-scale node "Systemic viral dissemination and febrile illness" connecting the previously orphaned fever, headache and vomiting phenotypes into the pathograph.

    Item 8 was already resolved in the previous round, since Respiratory distress and ARDS now rest on different snippets. Item 11 left as FREQUENT, which the reviewer called the right conservative instinct, as no quotable figure at or above 80% was found. Item 12, myalgia, remains omitted because no cached abstract states it and paraphrasing the research narrative would not be a real quote.

    Validation: just validate passes all three gates with 77/77 snippets verified against cached references, up from 56. All 19 listed references are cited and nothing cited is unlisted. check-duplicate-keys, check-snippet-length, check-title-snippets, check-cache-order and check-term-cache-integrity all OK. The reference validator caught one abbreviated trial title, which was corrected to match the registry exactly.

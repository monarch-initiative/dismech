  details: |
    Second review round on PR 6913. Addressed four deep-research completeness blockers, all from material already in references_cache with no new fetching.

    Blocker A - ephrin-B2/B3 receptor-mediated entry was entirely absent. Added a new pathophysiology node "Ephrin-B2/B3 receptor-mediated cell entry" with biological_scale MOLECULAR, GO:0046718 symbiont entry into host cell, and downstream edges to both tropism nodes it explains. This gives the pathograph its first MOLECULAR-scale node; the graph previously began at TISSUE. Evidence from the previously unused full-text cache PMID:39700307.

    Blocker B - three cached references were listed but never cited. PMID:39700307, PMID:38185127 and PMID:37896758 now all carry evidence items. Verified programmatically that all 10 listed references are cited and no cited reference is unlisted.

    Blocker D - no pulmonary/respiratory pathophysiology node. Added "Pulmonary involvement and respiratory tract infection" with biological_scale TISSUE, downstream to Respiratory distress, Acute respiratory distress syndrome and Cough, and upstream from the endothelial vasculitis node. Five evidence items covering the clade-dependence that distinguishes Bangladesh/India clade I from Malaysian clade II.

    Blocker G - m102.4 and remdesivir absent from treatments. Added both using the NCIT action term plus therapeutic_agent pattern. m102.4 uses therapeutic_modality MONOCLONAL_ANTIBODY with NCIT:C20401 Monoclonal Antibody as the agent term, since NCIT has no m102.4-specific concept. Remdesivir uses SMALL_MOLECULE with CHEBI:145994. Ribavirin retained at supports PARTIAL so the evidence hierarchy is no longer inverted.

    Blue items also addressed: added a diagnosis section covering nucleic acid testing and the explicit non-use of serology for acute diagnosis; added an animal_models section for the nonhuman primate challenge model with modeled_mechanisms linking to the pulmonary node, which consumes the previously unused PMID:37896758; added a distinct Acute respiratory distress syndrome phenotype on HP:0033677 addressing the specificity nudge while retaining the broader HP:0002098 term; connected the brain-stem triad of myoclonus, areflexia and hypotonia to the CNS invasion node.

    Frequency discipline preserved: no new frequency bands were introduced. Respiratory distress keeps its omitted band, and the new ARDS phenotype also omits one, both because the supporting evidence is outbreak-specific.

    Validation: just validate passes all three gates with 56/56 snippets verified against cached references, up from 36. check-duplicate-keys, check-snippet-length, check-title-snippets, check-cache-order and check-term-cache-integrity all OK. No cache rows were added, since every ontology term used was already cached.

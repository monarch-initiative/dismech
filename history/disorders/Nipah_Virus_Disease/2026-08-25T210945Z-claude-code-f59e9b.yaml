  details: |
    Review response for PR #6913 (Nipah Virus Disease), plus a rebase. Picked up after the prior
    agent exited; the last review confirmed all five earlier blockers resolved and raised one new
    blocker.

    REBASE FIRST. The branch was 277 commits behind origin/main and the PR was CONFLICTING, so nothing
    could land until that was fixed. Rebased onto origin/main; three cache files conflicted
    (diseaseterm enum, molecularfunctionterm enum, go/terms.csv). All resolved MAIN-AUTHORITATIVE PER
    CURIE - start from main's rows, add back only the CURIEs this branch introduces, re-sort
    canonically - never a naive union. Verified afterwards: the whole cache diff against origin/main
    contains ZERO deletions and exactly six added CURIEs (GO:0001618, GO:0060339, MONDO:0020499,
    NCBITaxon:3052225, NCBITaxon:9401, NCIT:C217458), every one traceable to this entry. No duplicate
    keys in any resolved file; check-cache-order and check-term-cache-integrity both pass.

    BLOCKER - modifier polarity on GO:0060339. Fixed: DECREASED -> INCREASED. The reviewer's reasoning
    is right and I verified the convention independently rather than taking it on trust: GO:0060339 is
    already a negative process ("negative regulation of type I interferon-mediated signaling
    pathway"), so DECREASED asserted LESS suppression of IFN signalling - the opposite of the node's
    own description ("Blocking the innate antiviral response is what permits the virus to disseminate
    systemically"), of its downstream edge, and of all four cited abstracts. Grepping the KB, entries
    that pair a pathogen- or tumour-enhanced suppressive process with a modifier use INCREASED; the 28
    "negative regulation of ..." annotations carrying DECREASED are genuine loss-of-suppression cases.
    This entry was the only user of GO:0060339 in the KB, so there was no in-file precedent either way.

    NON-BLOCKING 🔵 - reference_title on trial evidence items. Added to all six clinicaltrials:
    evidence items, taken from the title: frontmatter of the cached records. Worth noting a mistake I
    made and caught: my first pass added reference_title to the TOP-LEVEL references: block as well,
    where the correct slot is title:, not reference_title:. Five spurious lines were removed. The
    top-level block still has 19 entries all carrying title:, and a whole-document check now reports
    0 of 77 evidence items missing reference_title.

    FOUND AND FIXED, NOT REQUESTED - one mixed evidence_source. A whole-document check found one
    (reference, snippet) pair carrying two different classifications: the PMID:37896758 sentence
    "Outbreaks of HeV and NiV have led to severe respiratory disease and encephalitis in humans and
    animals characterized by a high mortality rate" was tagged OTHER in phenotypes and MODEL_ORGANISM
    twice in the animal-model section. Harmonised to OTHER in all three places, because the sentence
    reports NATURAL outbreak disease in humans and animals - it is background in a review about animal
    models, not a result from one, and so is not in vivo experimental data. Both explanations now say
    so explicitly. This is a judgement call rather than a mechanical fix and is flagged for the
    reviewer in the PR comment so it can be cheaply overruled.

    CHECKED, NOT CHANGED. The reviewer's earlier suggested YAML used a slot named mechanism_action;
    the schema slot is treatment_effect. Verified against src/dismech/schema/dismech.yaml rather than
    against review prose - no mechanism_action appears anywhere in the entry, and every
    target_mechanisms link resolves to a real pathophysiology node. Also re-checked the pathograph:
    7 nodes, 20 downstream edges, single root (Ephrin-B2/B3 receptor-mediated cell entry), nothing
    unreachable, and every downstream target resolves against the pathophysiology or phenotype names.


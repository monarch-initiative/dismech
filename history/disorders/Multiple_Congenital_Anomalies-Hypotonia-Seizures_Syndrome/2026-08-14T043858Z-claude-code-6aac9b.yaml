  summary: 'Create: Multiple Congenital Anomalies-Hypotonia-Seizures Syndrome MCAHS
    umbrella'
  details: |
    Created the MCAHS umbrella/parent entry MONDO:0100247 with three subtypes: MCAHS1 PIGN MONDO:0013563, MCAHS2 PIGA MONDO:0010466 X-linked, and MCAHS3 PIGT MONDO:0014165, per the priority dashboard LUMP_INTO_PARENT recommendation. Deep research via falcon/Edison: 7/7 report references verified, 0 percent confabulation. NEC preflight returned SKIP because the parent is a phenotypic series with no single causal gene; the report top-genes PIGA/PIGN/PIGT confirm the correct entity. Modeled the shared GPI-anchor biosynthesis mechanism: pathway defect leads to reduced surface GPI-anchored proteins, then neuronal dysfunction/DEE and multisystem developmental disruption. Evidence anchored on gene-discovery papers PMID:21493957 PIGN, PMID:22305531 PIGA, PMID:23636107 PIGT, plus the largest IGD natural-history cohort PMID:38456468 Sidpra 2024 Brain for frequencies. No dedicated GeneReviews chapter exists. Validated with just validate-disorders: schema, terms, and references pass, 29/29 snippets verified; title-snippet gate passes.
- type: EDIT
  outcome: changed
  sections:
  - phenotypes
  - pathophysiology
  - biochemical
  - diagnosis
  - treatments
  summary: Incorporate pre-PR red-team review findings
  details: |
    Applied fixes from a fresh-context red-team review. Corrected an overstated frequency (the 90 percent DD/ID figure is developmental-delay-general, moved from the profound-GDD node to the Intellectual disability node as VERY_FREQUENT; profound GDD downgraded to FREQUENT per the 59 percent severe-to-profound figure). Added the distinctive TNAP-dependent vitamin B6 (PLP) activation pathophysiology node mined from PMID:39081219 (previously referenced but unused), and linked a new pyridoxine treatment to it via target_mechanisms. Added a flow-cytometric GPI-anchored-protein diagnosis section and a serum alkaline phosphatase biochemical marker (with the MCAHS-normal/low vs HPMRS-elevated caveat). Retargeted the hypotonia node to general Hypotonia (HP:0001252) to match the 72 percent evidence; softened an unsupported subtype attribution on epileptic spasms; added chorea (HP:0002072, MCAHS1); and added an explicit caveat that quantitative frequencies are IGD-wide, not MCAHS-specific. Re-validated: 36/36 snippets verified, schema/terms/references pass.

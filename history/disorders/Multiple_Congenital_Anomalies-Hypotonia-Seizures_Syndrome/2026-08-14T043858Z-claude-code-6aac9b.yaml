  details: |
    Created the MCAHS umbrella/parent entry MONDO:0100247 with three subtypes: MCAHS1 PIGN MONDO:0013563, MCAHS2 PIGA MONDO:0010466 X-linked, and MCAHS3 PIGT MONDO:0014165, per the priority dashboard LUMP_INTO_PARENT recommendation. Deep research via falcon/Edison: 7/7 report references verified, 0 percent confabulation. NEC preflight returned SKIP because the parent is a phenotypic series with no single causal gene; the report top-genes PIGA/PIGN/PIGT confirm the correct entity. Modeled the shared GPI-anchor biosynthesis mechanism: pathway defect leads to reduced surface GPI-anchored proteins, then neuronal dysfunction/DEE and multisystem developmental disruption. Evidence anchored on gene-discovery papers PMID:21493957 PIGN, PMID:22305531 PIGA, PMID:23636107 PIGT, plus the largest IGD natural-history cohort PMID:38456468 Sidpra 2024 Brain for frequencies. No dedicated GeneReviews chapter exists. Validated with just validate-disorders: schema, terms, and references pass, 29/29 snippets verified; title-snippet gate passes.

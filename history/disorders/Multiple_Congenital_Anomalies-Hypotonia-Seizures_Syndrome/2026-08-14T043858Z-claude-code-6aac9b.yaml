  summary: Apply ai4c-reviewer non-blocking future-pass suggestions
  details: |
    After the reviewer APPROVED, applied three of its five non-blocking suggestions. (1) Split the multi-phenotype "Developmental delay, hypotonia and seizures in PIGN-related disease" entry (which named three phenotypes but bound a single HP term) into three subtype: MCAHS1 entries — Intellectual disability (HP:0001249), Hypotonia (HP:0001252), Seizures (HP:0001250) — each name matching its bound term. (2) Registered the FOLR1/cerebral-folate arm as a structured mechanistic_hypotheses entry (hypothesis_group_id folr1_cerebral_folate, status EMERGING) with the two FOLR1-arm downstream edges opting in via hypothesis_groups, making the hypothesized framing machine-queryable rather than prose-only. (3) Changed the FOLR1 node's background-biochemistry evidence_source from HUMAN_CLINICAL to OTHER. Deferred: folinic-acid therapeutic_agent binding (no clean folinic-acid ontology term available — declined to force one) and the PR-description mismatch (cosmetic, bot-authored body already superseded by a follow-up comment). Re-validated: 53/53 snippets verified; schema/terms/references pass; title-snippet gate passes.

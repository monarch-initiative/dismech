  summary: Incorporate pre-PR red-team review findings
  details: |
    Applied fixes from a fresh-context red-team review. Corrected an overstated frequency (the 90 percent DD/ID figure is developmental-delay-general, moved from the profound-GDD node to the Intellectual disability node as VERY_FREQUENT; profound GDD downgraded to FREQUENT per the 59 percent severe-to-profound figure). Added the distinctive TNAP-dependent vitamin B6 (PLP) activation pathophysiology node mined from PMID:39081219 (previously referenced but unused), and linked a new pyridoxine treatment to it via target_mechanisms. Added a flow-cytometric GPI-anchored-protein diagnosis section and a serum alkaline phosphatase biochemical marker (with the MCAHS-normal/low vs HPMRS-elevated caveat). Retargeted the hypotonia node to general Hypotonia (HP:0001252) to match the 72 percent evidence; softened an unsupported subtype attribution on epileptic spasms; added chorea (HP:0002072, MCAHS1); and added an explicit caveat that quantitative frequencies are IGD-wide, not MCAHS-specific. Re-validated: 36/36 snippets verified, schema/terms/references pass.
- type: EDIT
  outcome: changed
  sections:
  - phenotypes
  - pathophysiology
  - treatments
  - genetic
  summary: Address ai4c-reviewer REQUEST_CHANGES (content completeness)
  details: |
    Addressed the automated reviewer's three blocking completeness findings on PR #8503. (1) Mined six >10% phenotypes already present in verified in-file snippets: cerebellar atrophy (HP:0001272), corpus callosum anomaly (HP:0001273), central-tegmental-tract restricted diffusion (ontology-unbound, no forced match), and gastrointestinal (HP:0011024), cardiac (HP:0001627), and renal (HP:0000077) anomalies. (2) Added subtype-specific phenotype distinctions via the subtype: field with snippet-validated Paprocka 2022 (PMID:35058872, fetched as PMID so snippets validate) quotes: drug-resistant epilepsy in PIGA/MCAHS2 (76/81 epilepsy, 52 drug-resistant), DD/ID+hypotonia+seizures >80% in PIGN/MCAHS1, myoclonic seizures cardinal in PIGT/MCAHS3. (3) Added the FOLR1/cerebral-folate-delivery pathophysiology node as an explicitly hypothesized parallel to the TNAP/B6 arm (evidence supports FOLR1 being GPI-anchored; the folate-deficiency link is framed as emerging), plus a folinic-acid treatment linked via target_mechanisms. Also addressed suggestions: added downstream edges from the terminal pathograph nodes to phenotype nodes; registered MCAHS as a member of kb/groupings/Disorders_of_GPI_Anchor_Biosynthesis.yaml (audit: SATISFIED against the NECESSARY GO:0006506 criterion); enriched antiseizure medication with an anticonvulsant-agent binding and AED-usage evidence; added a ketogenic-diet treatment (PIGA); and added evidence to the epileptic-spasms and facial-dysmorphism phenotypes. Dropped a microcephaly entry rather than attach a weak claim-to-snippet match. Re-validated: 50/50 snippets verified; schema/terms/references pass; title-snippet gate passes; grouping validates and audits SATISFIED.

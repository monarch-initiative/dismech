    Correcting the prior event's deferral of suggestion 3: the re-review pointed out that a clean ontology term does exist — CHEBI:15640 (5-formyltetrahydrofolic acid) is folinic acid/leucovorin. Added a therapeutic_agent binding to the Folinic acid treatment (preferred_term: folinic acid, term CHEBI:15640) per the therapeutic-agent pattern, so the treatment is now queryable by agent identity like the pyridoxine treatment. The earlier "no clean folinic-acid ontology term" note was mistaken (I had only checked CHEBI:15637/63606). Re-validated: schema/terms/references pass. This closes all five reviewer suggestions except the cosmetic PR-description mismatch (bot-authored body, superseded by a comment).

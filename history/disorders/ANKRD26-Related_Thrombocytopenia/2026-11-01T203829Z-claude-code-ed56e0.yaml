  summary: 'Create: ANKRD26-Related Thrombocytopenia (thrombocytopenia 2, MONDO:0008555)'
  details: |
    New entry for ANKRD26-related thrombocytopenia (THC2), curated from primary literature with the GeneReviews chapter (PMID:29927566) as phenotype baseline and the ClinGen Definitive AD assertion copied into gene_disease_validity. Named by the GeneReviews title (a MONDO exact synonym); the MONDO label is kept as a synonym. Pathograph: 5' UTR variant abolishing RUNX1/FLI1 binding, persistent ANKRD26 expression (cytokine receptor binding), impaired MPL/EPOR/G-CSFR internalization and hypersignalling, ERK hyperactivation, impaired proplatelet formation, and a parallel JUNB-p21 apoptosis branch for polyploid megakaryocytes, ending in thrombocytopenia and megakaryocyte dysplasia; a separate somatic-transformation node leads to MDS, AML, CML and CMML. Thrombocytopenia is linked by a sequela edge to the mild bleeding tendency, which fans out to bruising, epistaxis, gingival bleeding and menorrhagia; reduced platelet alpha granules is the one phenotype left without an inbound edge because no source gives its mechanism. One OpenScientist deep-research report was used as leads only: 17/17 references resolved, 3 quotes unsupported (PMID:12745278, PMID:12161364, PMID:39443230, none cited here), and it gave HGNC:21026 (SNHG5) for ANKRD26 and NCIT:C62492 (Denenicokin) for eltrombopag; neither was used. preflight-dr returned WARN only for RUNX1 mentions, which are the disease's own repressor. The report contributed PMID:40670159 (bleeding tendency 25-30%, aggregation findings). PMID:24030261 (222-patient malignancy cohort) has no cached abstract, so its 24-fold AML risk is cited through the background statement in PMID:28100250. Validated with just validate, validate-terms, count-verified-snippets (85/85), check-genereviews (TAGGED), the whole-repo gates and validate-disorders.

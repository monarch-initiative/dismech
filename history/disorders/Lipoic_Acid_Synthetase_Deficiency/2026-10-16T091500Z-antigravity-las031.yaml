  summary: Enhanced Lipoic Acid Synthetase Deficiency entry with structured classifications, prevalence,
    progression, diagnostics, differentials, and indirect pathophysiology-to-phenotype links.
  details: Added classifications (mechanistic_category, icimd_category, and harrisons_chapter), prevalence,
    and progression sections. Expanded the pathophysiology graph with biological process and chemical
    entity bindings (GO:0019242, GO:0006099, GO:0019464, CHEBI:15428) and indirect edges from Brain glycine
    accumulation and encephalopathy to Microcephaly and Apnea. Updated Microcephaly and Apnea phenotype
    descriptions and evidence, added PMID:28817111 genetic evidence, added target_phenotypes to Supportive
    care, added target_mechanisms and results snippet from PMID:39547509 to Engineered bacterial lipoate
    ligase (experimental), and added Genetic counseling. Added diagnosis entries (Molecular genetic testing
    for biallelic LIAS variants, Plasma, urine, and cerebrospinal fluid glycine and lactate profiling,
    and Fibroblast mitochondrial protein lipoylation and enzyme activity assay) and differential_diagnoses
    entries (Lipoyl transferase 1 deficiency, LIPT2-related mitochondrial lipoylation defect, Multiple
    mitochondrial dysfunctions syndrome 2, and Classic nonketotic hyperglycinemia). Harmonized snippet
    grading across all shared quotes.

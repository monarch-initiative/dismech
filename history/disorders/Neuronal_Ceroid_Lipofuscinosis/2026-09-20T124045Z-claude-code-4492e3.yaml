  summary: 'Genetics pass: subtype terms and a soluble-enzyme mechanism node'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: the entry curated nine CLN genes with bound HGNC terms and one
    deliberately unbound umbrella record. None of the nine reached a pathophysiology
    node, and the three `has_subtypes` rows carried neither a MONDO term nor a gene.
    The checklist keys CLN5 (MONDO:0009745), which the entry already maps as a
    narrowMatch and already curates as a bound gene.

    The nine genes do not share one mechanism, so listing them together on the
    existing endomembrane node would have lost the distinction that matters. Mole &
    Cotman (PMID:26026925) give the split explicitly: lysosomal enzymes plus one
    soluble lysosomal protein (CLN1/PPT1, CLN2/TPP1, CLN5, CLN10/CTSD) against
    transmembrane proteins (CLN3, CLN6, CLN7/MFSD8) with CLN6 and CLN8 in the ER and
    progranulin (CLN11/GRN) in secretory-pathway compartments.

    Changes:
    - Bound the three subtype rows to MONDO:0009744 (CLN1/PPT1), MONDO:0008769
      (CLN2/TPP1) and MONDO:0008767 (CLN3), each with its gene and a PMID:26026925
      evidence item. All three terms and gene attributions were verified against OLS
      and the Monarch CausalGeneToDiseaseAssociation endpoint.
    - Added a `Soluble Lysosomal Enzyme and Protein Deficiency` node carrying PPT1,
      TPP1, CTSD and CLN5, with the three enzyme activities bound to GO and a
      downstream edge into the existing storage node. The node records the
      authors' own caveat that the in vivo substrates are incompletely defined, so
      it stops at loss of the degradative step rather than naming a stored
      substrate.
    - Wired CLN3, CLN6, CLN8, MFSD8 and GRN onto the existing `CLN Endomembrane
      Protein Dysfunction` node, extended its description with the two
      qualifications the source makes (CLN6/CLN8 are ER, GRN is secretory), and
      added the source's statement that the membrane proteins' primary functions
      remain unresolved.
    - Recorded on the unbound `CLN Genes` record why it is unbound: it names a locus
      family, not a gene, so no HGNC identifier exists for it.

    CLN5 was not given its own `has_subtypes` row. MONDO:0009745 is already carried
    as a narrowMatch mapping on this entry; adding a subtype row would assert the
    same class twice.

    New reference cached: none - PMID:26026925 was already in the cache.

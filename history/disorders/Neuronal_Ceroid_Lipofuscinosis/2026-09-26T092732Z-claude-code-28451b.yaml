  summary: 'Genetics pass: add CLN5/6/7/8/10/11 subtype rows with bound terms, reciprocal
    FKs, and the CLN14 disposition'
  details: |
    Genetics pass under the d2g gap campaign (issue #12255, series-048). Anchor check first: MONDO:0016295 neuronal ceroid lipofuscinosis is defined as a group of inherited progressive degenerative brain diseases, which is exactly what this umbrella entry models, so the disease_term binding was left as it stands.

    The gap here was the subtype series, not the gene wiring: nine of ten genetic records already reached a pathophysiology node before this pass, but only CLN1, CLN2 and CLN3 had has_subtypes rows and no genetic record carried a subtype foreign key. Six rows were added, each with a bound subtype_term, a genes descriptor, an autosomal recessive inheritance block and two evidence items: CLN5 Disease (MONDO:0009745, CLN5), CLN6 Disease (MONDO:0011144, CLN6), CLN7 Disease (MONDO:0012588, MFSD8), CLN8 Disease (MONDO:0010830, CLN8), CLN10 Disease (MONDO:0012414, CTSD) and CLN11 Disease (MONDO:0013866, GRN). Each MONDO term's own definition was read and independently states the gene correspondence the row asserts.

    Every one of the nine gene records gained relationship_type CAUSATIVE, an autosomal recessive inheritance block and a reciprocal subtype foreign key, and the three pre-existing subtype rows gained the inheritance block the new ones carry. Autosomal recessive is the mode in the ClinGen assertion each record already cited. subtype-usage-audit now reports 9/9 subtypes referenced by a subtype foreign key and 9 WIRED_DIRECT subtype genes.

    Each new row's protein-class claim is sourced to one sentence in the abstract of PMID:26026925, which classifies the whole series: lysosomal enzymes (CLN1, CLN2, CLN10, CLN13), a soluble lysosomal protein (CLN5), a protein in the secretory pathway (CLN11), two cytoplasmic peripheral-membrane proteins (CLN4, CLN14) and transmembrane proteins (CLN3, CLN6, CLN7, CLN8, CLN12). That classification is what determines which of the entry's two upstream nodes each subtype enters at, and it matches the gene distribution already present on those nodes.

    CLN14 (KCTD7) was investigated and declined, with the reasoning recorded in the CLN Genes notes so the concept is not re-nominated. The 2015 review this entry already cites does list CLN14 among the NCL genes. Against that, ClinGen's Epilepsy Gene Curation Expert Panel, which curated all nine genes in this entry against neuronal ceroid lipofuscinosis MONDO:0016295, curated KCTD7 against progressive myoclonus epilepsy MONDO:0020074 instead, Definitive and autosomal recessive. MONDO reflects the same split: MONDO:0012721 progressive myoclonic epilepsy type 3 is defined as any progressive myoclonic epilepsy caused by a KCTD7 mutation, and carries both MONDO:0020074 and MONDO:0016295 as parents, the NCL parent sourced from OMIM:611726 and Orphanet:263516. So MONDO is carrying a genuine dual classification from its sources rather than making an error, and the KCTD7 disease belongs in its own entry under progressive myoclonus epilepsy. No such entry exists in this knowledge base yet.

    Two further structural dispositions are recorded in the same notes. MONDO:0008768 ceroid lipofuscinosis, neuronal, 6B (Kufs type) belongs to the Adult_Neuronal_Ceroid_Lipofuscinosis entry, which already binds CLN6 alongside CTSF and DNAJC5; MONDO's own annotation on the 6A term states that biallelic CLN6 variants can also cause the juvenile or adult-onset Kufs form. CLN4 (DNAJC5) and CLN13 (CTSF) are likewise curated in that entry rather than here.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and validate-disorders all pass. Every snippet was independently confirmed to be an exact normalized substring of its cached reference and, for newly authored snippets, to sit inside the abstract region rather than the full-text body. list-gene-term-mismatches --resolve compared all 29 gene bindings across the two entries touched by this pass against live HGNC with no mismatch and no uncached row. check-genereviews already reported the NCL overview chapter as TAGGED; no reference-cache change was needed for this entry.

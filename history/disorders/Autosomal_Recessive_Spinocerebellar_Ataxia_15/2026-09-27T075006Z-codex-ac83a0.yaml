  summary: Review RUBCN-related SCAR15 against recovered clinical and functional sources
  details: |
    Reviewed the existing SCAR15/RUBCN entry against all five original cached references, the matching Falcon research narrative and citation list, and additional primary structural evidence. The entry remains distinct from ITPR1-related dominant SCA15 and CWF19L1-related SCAR17. No prior REVIEW or overlapping open PR was present when selected. This Mendelian disorder meets the sweep scope excluding infectious and environmental diseases/poisonings.

    Major corrections: replaced the dystonia paper-title snippet with its recovered full clinical examination; added the c.2244delG/p.Gln748HisfsTer48 allele at the authors' likely-pathogenic classification. Distinguished normal-borderline cognition from intellectual disability and removed uniform progression and hearing-lesion assumptions. The founder frameshift replaces the normal tail with a longer alternative sequence; it does not demonstrate absent protein. RNA effects of c.2126+1G>A are observed, whereas protein fate and localization are predictions. The 2013 localization experiment is cultured-cell evidence, not patient-neuron data. Removed unproven Purkinje/granule-cell loss and a universal decreased-autophagy mechanism; engineered RH-Rab7 interface mutants can release autophagy suppression. Five atomic mechanism nodes and two experimental models preserve these distinctions. Nine phenotypes have indirect clinical/developmental links; unresolved features are not forced into the graph.

    Source consumption:
    - PMID20826435: refreshed abstract; recovered the complete 2010 Brain article reproduced in Mirna Assoum's institutional thesis via just fetch-reference on the public Strasbourg PDF URL. Read scientific introduction, methods, results, discussion, figure legends and the supplementary clinical table. Recovered clonazepam response, vigabatrin/add-on-clonazepam sequence, myoclonic seizures, infantile spasms and reduced reflexes. The predicted altered tail is longer; the paper discusses possible partial loss of function. The supplementary nerve-conduction table reports absent sural responses in two patients, conflicting with the later 2020 normal-NCS summary; no universal normal-NCS diagnostic requirement remains. The entire thesis is the generated source cache, but other disease manuscripts in it were not reviewed.
    - PMID23728897: refreshed abstract. Read the full author-uploaded scientific text, methods, discussion and figure legends through ResearchGate indexing; direct sanctioned cache retrieval returned 403. The founder allele replaces 98 native residues with 145 unrelated residues. Patient fibroblast endogenous protein was not reproducibly detected; COS-1/HeLa overexpression demonstrated mislocalization. Increased degradation suggests lower stability but does not establish a patient-neuron null. Effects on autophagy and possible gain of function remained untested. Cached abstract passages support the retained localization claims.
    - PMID32450808: refreshed full XML; read the full scientific body, clinical narratives, methods, founder analysis, discussion, figures and recovered Table 1. The report's younger patient's gait is described as abnormal in narrative but absent in the table; IQ 72 is borderline despite a different historical description. These discrepancies are retained rather than converted into universal frequencies. The 2019 genomic-study proband and 2020 family are the same family, not separate ascertainments.
    - PMID38934208: recovered and read the full 2024 clinical letter. Added the alternate frameshift, dystonia, intention tremor, exotropia, lower-limb spasticity and absent sural responses; a normal cerebellum and hippocampal MRI findings are distinguished. The latter are not assumed to be a primary RUBCN lesion.
    - PMID39520129: refreshed abstract; RNA evidence is from patient blood. Read the publisher-indexed scientific introduction, methods, clinical results, genetic results and discussion. Full-text cache attempts via PMID, DOI, publisher HTML/full/epdf and PDFdirect returned 403. The patient had no ataxia at four years, and the full narrative describes focal seizures, EE-SWAS with language regression, levetiracetam followed by add-on clobazam and renewed progress. These uncached details, including the drug-specific response, are a non-blocking quotation/coverage limitation and have not been given fabricated exact-quote evidence. Abstract-supported epileptic encephalopathy, developmental delay and splice effects are retained. The paper's claim of only one prior allele is outdated relative to the 2024 dystonia letter and is not repeated; the gene/disease OMIM mix-up in its abstract is not propagated. The abstract uses NM_014687.3 while genetic results use .4; original transcript notation is retained rather than silently normalized.
    - PMID32632011: fetched and read the entire scientific body, key methods, results, discussion and figure legends. Added the RH-Rab7 structure and HeLa tandem-fluorescent-LC3 model with engineered-mutant limits. A886D is an exception to the other mutants' effects. RCSB 6WCW was directly verified and cached: 2.8 Angstrom human RH 699–949 with GTP-locked Rab7 Q67L residues 2–183, not a SCAR15 patient complex. It is recorded in pdb_structures.
    - General GeneReviews NBK1138: no disease-specific chapter was identified; read general supportive-care, surveillance and recessive-counseling sections. Physical therapy, speech-language care and counseling are explicitly general hereditary-ataxia recommendations, not SCAR15 trials. Source revision July 2026. No efficacy assertion for a disease-modifying therapy is made.
    - LAP boundary: the original negative-LAP assertion was unsupported. The 2015 Martinez paper at PMC4612372 is marked retracted (2024); a 2018 review cannot resolve that problem. Read the relevant zymosan-macrophage results, interpretation and methods of independent PMID35192551, which did not require Rubicon for LC3 lipidation under its assay conditions. Neither lupus nor Alzheimer model findings were imported as established SCAR15 pathophysiology.

    Completeness assessment:
    1. Phenotypes: adequate for the research's major neurological, developmental, auditory and ocular findings, with 23 phenotypes. Case-level descriptions replace unsupported population frequency or prevalence bands. Non-blocking 2025 full-text quotation limitation noted above; rare incidental skeletal/skin findings in the 2010 supplement are not presented as established syndromic features.
    2. Subtypes: no established separate molecular subtypes within RUBCN-SCAR15; clinical variability is not promoted to formal subtypes. Dominant SCA15 and SCAR17 remain differentials.
    3. Mechanisms: adequate allele/splice, domain, localization, autophagy-regulation and clinical cerebellar layers. Inferences and model limits explicit. No disease-specific animal histopathology established in the reviewed sources.
    4. Treatments/trials: six care actions include founding-case pharmacotherapy and general supportive management. No Phase II+ disease-specific intervention identified. ClinicalTrials.gov API searches for SCAR15/RUBCN returned a generic registry and an unrelated fatherhood program; Salih ataxia search returned SPATAX because Salih is an investigator. The actual protocols did not name this disease, so these search hits were not imported as disease-specific trials. No disease-modifying efficacy inferred from the structural study.
    5. Genetics: three clinically reported alleles, founder inheritance, alternative splicing and transcript-specific caveats covered. No verified modifier or penetrance estimate identified; database-only variants without clinical data were not converted into confirmed cases.
    6. Diagnostics/biomarkers: clinical MRI, molecular and RNA testing, EEG and auditory/nerve studies covered. Electrophysiological abnormalities do not imply unobserved histological lesions.
    7. References: all five original sources retained and consumed to the accessible extent; high-value 2010 full article/supplement, 2024 clinical letter and 2020 structural paper recovered. Generic care source clearly separated. All new evidence has source titles.
    8. Overall: substantial review and correction of both evidence and clinical/mechanistic interpretation; remaining access and source inconsistencies are explicitly documented. No blocking omission relative to the matching research report remains.

    Validation is recorded in the accompanying PR after the final schema, term, reference, scoped-data, history and curation-gate checks complete. Cache markdown is generated exclusively with just fetch-reference; commit-hook whitespace formatting is checked separately.

  summary: 'Create: Perlman Syndrome'
  details: |
    New entry for Perlman syndrome (MONDO:0009965, DIS3L2). Deep research: one OpenScientist report (research/Perlman_Syndrome-deep-research-openscientist.md; 27/27 references resolved, needs_review set by term mislabels), used as leads only. Every claim was re-checked against the cached abstract or full text; snippets are exact quotes. Phenotype baseline: Orphanet ORPHA:2849 and the AACR 2017 Wilms tumor surveillance consensus (PMID:28674120); no GeneReviews chapter exists (PubMed genereviews[book] searches on the disease name and DIS3L2 returned none). ClinGen DIS3L2 Definitive (AR) recorded from the CGGV record. Corrections to the report: PMID:23486540 is Higashimoto et al., not Igarashi; PMID:35700413 describes a monoallelic germline carrier with a somatic second hit, which is not Perlman syndrome, so the report's two-hit model for Perlman Wilms tumor was not carried over; HP:0001708 suggested for nephroblastomatosis is Right ventricular failure, so HP:0008643 was bound instead. Neonatal death (HP:0003811) is outside the PhenotypeTerm enum, so mortality is recorded in descriptions and evidence on the renal and respiratory failure phenotypes. Validated with just validate (schema, terms, 71 snippets) and the offline whole-repo gates.

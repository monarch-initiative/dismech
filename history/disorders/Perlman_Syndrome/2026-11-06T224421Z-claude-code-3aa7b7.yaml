  summary: 'Review round 1: Orphanet phenotypes, PI3K/AKT evidence'
  details: |
    Response to the first automated review of PR 16758. Removed PMID:40500755 as SUPPORT on Increased PI3K/AKT Signaling, with the zebrafish sentence in the node description: the cached abstract says dis3l2 acts through Akt-GSK3beta but gives no direction for Akt activity, so it cannot support an increase. It is still cited on the mitotic node. Added eleven ORPHA:2849 phenotype rows annotated Very frequent or Frequent that the entry lacked (intellectual disability, abnormal upper lip morphology, micrognathia, retrognathia, short nose, round face, smooth philtrum, open mouth, tall stature, abnormal pancreas morphology, hypoplasia of penis), each quoting its Orphanet row. No edge from pancreas morphology to hyperinsulinemia, because no reviewed source links them. Set quote_role REVIEW_SYNTHESIS on the second PMID:28674120 item for consistency. PMID:39466169 and PMID:34134020 were fetched and checked; neither abstract mentions Perlman syndrome, so neither is cited. Validated with just validate (81/81 snippets), validate-terms and the offline gates.

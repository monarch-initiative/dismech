  summary: 'Review: connect nine orphan phenotypes in GINS1 deficiency (IUIS Table
    6)'
  details: |
    Nine of ten phenotypes had no incoming edge.

    The haematologic ones attach where the mechanism puts them: chronic neutropenia and marrow dysplasia to the maturation blockade, NK deficiency to the differentiation failure, growth retardation before and after birth to the restricted-growth node.

    Three attach to the general replication defect rather than to the marrow node, and say why. The reduced CD8 count is the observation the entry itself describes as supporting the combined designation, so it is a lymphoid arm distinct from the granulocyte and NK blockade. Facial dysmorphism is not characterised into a gestalt in the source. Glaucoma is flagged by the reviewing authors as a possible phenotype expansion rather than an established feature, and the edge records it at that level.

    Protein-losing enteropathy is a sequela of the neutropenia as the most likely route to recurrent gut infection, marked INDIRECT_UNKNOWN_INTERMEDIATES because it is a single-patient finding with no established intermediates.

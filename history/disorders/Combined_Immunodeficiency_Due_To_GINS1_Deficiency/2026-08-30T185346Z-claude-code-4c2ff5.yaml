  summary: 'Create: Combined Immunodeficiency Due To GINS1 Deficiency (MONDO:0044725)'
  details: |
    De novo curation of IMD55 (GINS1/PSF1 deficiency). Sources: Cottineau et al. J Clin Invest 2017 (PMID:28414293, the five-patient defining series), the CMG-helicase IEI review (PMID:36809597), and Mackley et al. Clin Genet 2026 (PMID:41689265) - a case report plus review of all nine published individuals, surfaced by the openscientist deep-research run rather than by the initial PubMed sweep. Seven-node pathograph runs from biallelic hypomorphic GINS1 variants through defective GINS/CMG assembly, replication stress with impaired checkpoint signalling, and cell-cycle/genomic instability, then branches to a bone-marrow maturation blockade of the granulocyte and NK lineages and to restricted somatic growth. Three knowledge gaps recorded: why the NK lineage is selectively vulnerable to a ubiquitous replication defect; why residual GINS1 activity grades the growth arm but not the immune arm; and whether the gene-disease relationship is established above ClinGen Moderate/Limited. Validated with just validate, count-verified-snippets (47/47), check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading.

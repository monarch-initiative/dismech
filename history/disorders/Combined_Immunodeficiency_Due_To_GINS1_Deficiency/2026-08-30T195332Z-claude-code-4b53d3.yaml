  summary: 'Address review: complete truncated snippets, add models and prevalence'
  details: |
    Addresses the CHANGES_REQUESTED review on PR 10173. Eleven evidence snippets were single physical lines lifted from a two-column PDF extraction; six stopped before the fact they were cited for. The snippet validator normalizes whitespace before substring matching, so complete sentences spanning cache line breaks validate - all eleven replaced and re-verified, and the line-wrapped-fragment apologetics removed from the explanations. Three quotes retain a hyphen break where the source hyphenates a word across lines, and their explanations now say so rather than apologizing. Added experimental_models for the patient-derived fibroblast system with a RESCUES link for the wild-type GINS1 rescue arm, and animal_models for the Psf1 heterozygous mouse (PMID:24244394) at PARTIALLY_RECAPITULATES/MODERATE, including the Sld5 heterozygote negative result as an UNCHANGED readout that makes the marrow requirement subunit-specific. Added a HUMAN_MODEL_MISMATCH discussion recording that no model reproduces the human triad and that the NK deficiency is modelled by nothing, with a proposed hypomorphic knock-in experiment. Added a prevalence CASES_IN_LITERATURE record. Regraded the ExAC and gnomAD population-frequency items from COMPUTATIONAL to OTHER - observed cohort frequencies are not in silico predictions. Ontology refinements: the CMG assembly node now uses GO:0003678 DNA helicase activity plus GO:0071162 CMG complex and GO:0140529 CMG complex assembly instead of GO:0003688 origin binding; the marrow blockade node uses CL:0000837 multipotent progenitor instead of CL:0000037 HSC and covers both lineages with GO:0030851 and GO:0001779 instead of GO:0030099 alone. G-CSF regraded from PROTEIN_REPLACEMENT to OTHER with the reason recorded. The bundled nutritional/growth-hormone treatment was narrowed to nutritional support only. HSCT recorded in notes as a deliberate omission rather than left as an apparent gap. Snippets 57/57 verified; all gates pass.

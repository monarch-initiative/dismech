  summary: 'Create: MEND Syndrome (MONDO:0010498, EBP)'
  details: |
    De-novo curation of MEND syndrome (Male EBP Disorder with Neurologic defects), the X-linked recessive hypomorphic-EBP disorder of post-squalene cholesterol biosynthesis.

    Lump/split decision. Curated as its own kb/disorders entry. MONDO:0010498 is a leaf with one causal gene, and the term and label appear nowhere in kb/ or in an open PR. The KB's other sterol-biosynthesis entries (MSMO1_Deficiency, CHILD_Syndrome, Greenberg_Dysplasia, Chondrodysplasia_Punctata_Tibial-metacarpal_Type) are different enzymes or a different inheritance mode, so this does not duplicate them.

    The entity exists because of a nosological argument, and that argument is the substance of the entry. EBP variants in males give three different outcomes according to allele severity and mosaicism rather than variant position: a null allele is lethal in a hemizygous male in early gestation and gives X-linked dominant CDPX2 in a heterozygous female; a postzygotic mosaic variant gives the CDPX2 phenotype in a male, because a surviving wild-type population rescues viability while the mutant clone produces Blaschko-linear skin and asymmetric skeletal findings; a constitutional hypomorphic variant gives MEND, uniform partial activity in every cell, survivable, symmetrical, neurologically weighted.

    The load-bearing observation is in the 2012 paper that named the entity: the same p.Y11X nonsense change had previously occurred de novo in a female with typical CHH syndrome. So allele identity does not determine which disorder results, and the entry's genetic notes say the interpretation of a new male EBP variant requires two determinations - hypomorphic versus null, and constitutional versus mosaic - not one.

    The practical consequence is recorded twice, in diagnosis and in differential diagnoses, because it is easy to get wrong: plasma sterols do not distinguish MEND from CDPX2 in an affected male. Both accumulate 8(9)-cholestenol and 8-dehydrocholesterol, and the source states there is no correlation between sterol levels and mutational subgroup or phenotype.

    Structure. Three pathophysiology nodes only: hypomorphic non-mosaic EBP variant, reduced 3-beta-hydroxysteroid-delta8,delta7-isomerase activity, and sterol precursor accumulation with cholesterol deficiency. All four organ phenotypes hang off the third by INDIRECT_UNKNOWN_INTERMEDIATES edges.

    That the chain stops at biochemistry is deliberate and is the second discussion. Nothing available traces a route from raised precursors to intellectual disability, cataract, stippling or ichthyosis; the toxicity of the accumulating species is stated in the source as "potentially toxic" and is not measured. Two observations sharpen rather than fill the gap: sterol levels do not correlate with phenotype, so the phenotype is not a dose-response to the biochemical block; and CDPX2 has the same biochemistry with a substantially different phenotype, which in a mosaic disorder points at which cells are affected rather than how much sterol accumulates. Whether the statin rationale is right depends on which of the two arms - precursor excess or cholesterol deficiency - drives the phenotype, and that is unresolved.

    Two evidence items graded NO_EVIDENCE on purpose. The first is the statement that biochemical testing does not differentiate CDPX2 from MEND in affected males - cited to mark the absence of a usable signal, not to support a claim. The second is "Simvastatin therapy is being evaluated in two males from this family": that says a trial was under way, not that it worked, and no outcome has been published. Grading it SUPPORT would have manufactured a treatment result out of a statement of intent.

    Treatment framing. Simvastatin is curated as a mechanistic candidate rather than an established therapy, with three evidence items covering the three different things that are actually known: the in vitro suppression of cholest-8(9)-enol in patient fibroblasts (IN_VITRO, SUPPORT), the unreported trial (NO_EVIDENCE), and a topical simvastatin-cholesterol ointment case in the allelic disorder CDPX2 (SUPPORT, directness INDIRECT, with the explanation stating that it establishes the approach has been tried in EBP deficiency, not that it helps in this disease).

    GeneReviews baseline. There is no GeneReviews chapter for MEND syndrome. PMID:21634086 ("EBP-Related X-Linked Chondrodysplasia Punctata") is the closest expert source and is tagged, but it is written for EBP-CDPX, of which more than 95 percent of live-born affected individuals are female. The two evidence items taken from it therefore carry directness INDIRECT with that reason stated in place, rather than being imported as if they described this disease.

    A reference validator constraint discovered and worked around honestly. Three snippets from PMID:39754633 initially failed verification because the cached full text carries inline citation markers - "the four coding exons [1-3] of EBP", "8 [4]-cholestenol", "traits [9]" - and the reference validator strips bracketed spans before matching unless conf/reference_validator_config.yaml declares them literal. A snippet spanning such a marker fails even when it is a faithful quote. The three were shortened to stop before the marker, or replaced by the adjacent sentence carrying the same claim, with each explanation saying so. A snippet with a trailing marker ("cryptorchidism [6]") verifies unchanged, so the constraint applies to markers inside a quoted span rather than at its end. No configuration was changed to force a match.

    A reference that could not be quoted. PMID:27276700, the scanning electron microscopy study of the collodion membrane in MEND, returns a journal error page instead of content. Nothing is quoted from it and it is not cited; the collodion presentation is sourced from PMID:39754633 instead.

    Curation inputs. One Perplexity deep-research run, committed alongside, plus independent PubMed E-utilities searching. The report was used for orientation only. It contains no PMID or DOI in its body, and its term validation reported 26 of 53 checked labels naming a different term - the worst ratio of the five reports in this curation batch. The failures cluster in NCIT and are of the most misleading kind: NCIT:C288 offered as "Antiepileptic Agent" is Azacitidine, NCIT:C15382 as "Neurosurgical Procedure" is Gamma Knife, NCIT:C96116 as "Cataract Extraction" is a plastic container closure. Every CURIE in this entry was verified independently against OLS.

    A schema-fit note. The ICIMD classification was originally written as disorders_of_sterol_biosynthesis, which the enum does not contain; the correct existing value is sterol_metabolism, and that is what is used.

    Modifier-gene discussion. One family of four males sharing a primary EBP variant showed a severity gradient tracking the number of potentially functional variants each carried in cholesterol-homeostasis genes, with APOA5, ABCA1 and APOB proposed as candidates. Four individuals from one family, an in-house scoring system, no functional validation - so it is an open KNOWLEDGE_GAP with a replication experiment proposed, not curated as established. It is kept because it is one of the few available candidate explanations for expressivity in a disease where sterol levels do not predict phenotype.

    Validation. Schema validation passes; 35 of 35 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

  summary: 'Review round 1: resolve the CDPX2 lump/split, add modifiers, biochemical,
    progression'
  details: |
    Response to the automated review on PR #10101 (ai4c-reviewer, CHANGES_REQUESTED with one CRITICAL). Snippets 35 to 54 verified.

    CRITICAL, a documented lump/split decision reversed without addressing it. The reviewer is right and this is the most useful finding of the whole claim run. kb/disorders/X-linked_Chondrodysplasia_Punctata_2.yaml already held this concept deliberately, with an OPEN discussion, hypomorphic_male_entity, asking exactly the question this entry answers. Creating MEND_Syndrome.yaml silently overturned that decision.

    Why the preflight missed it, recorded because the failure generalises. The duplicate check ran by MONDO ID and by disease label, per the claim-disease skill, and both came back clean - correctly, because the concept was held in a different entry under a different name and surfaced only inside a discussion's prose. Neither an identifier search nor a label search can find a concept that a curator chose to keep unnamed. A mechanism search would have (rg -il "hypomorphic.*EBP" kb/). That is a real blind spot in the preflight as specified, not a slip in executing it.

    The four requested edits are made, all inside this PR:

    1. hypomorphic_male_entity in the CDPX2 entry is now status RESOLVED, with a rationale that states the split, names MONDO:0010498, and says which male belongs in which entry - a mosaic male or one with a null allele plus a supernumerary X stays in CDPX2, a male hemizygous for a constitutional hypomorphic allele comes here.

    2. The stale premises are corrected in place rather than deleted. The rationale said "MONDO carries only MONDO:0020603" and treated the evidence as "a single reported family". Both were false by the time of this PR, and the resolved rationale says so explicitly, because a reader should be able to see what changed and not just the new conclusion.

    3. The CDPX2 notes paragraph no longer says the phenotype is kept inside that entry; it points here and to the resolved discussion.

    4. This entry's notes carry the split, its basis, and the preflight failure, so the reasoning is findable from either side.

    The content conflict the reviewer flagged is also resolved, and in the direction the evidence supports. The CDPX2 discussion described the male hypomorphic phenotype as presenting "without the ichthyosis and stippling of CDPX2". That generalised from the single 2014 family, whose reported features were digital abnormalities, intellectual disability and short stature. Mild ichthyosis is documented in both patients of the 2025 family, so the CDPX2 sentence was corrected rather than left to contradict this entry. The distinction between the disorders is the pattern of the skin and skeletal findings - symmetrical here, Blaschko-linear with follicular atrophoderma there - not their presence.

    IMPORTANT 1, PMID:31397093 cached but uncited with its findings unattributed. Correct, and it was the worst defect in the original entry: the modifier discussion quoted that paper's variant counts and named its three candidate genes as if they were general knowledge. The discussion now carries an evidence item with the burden-gradient sentence, and APOA5, ABCA1 and APOB are curated in genetic: with relationship_type MODIFIER, each with the candidate-gene sentence and notes making clear they are candidates from one family with no functional validation.

    IMPORTANT 2, phenotypes named in snippets already quoted. Added Hypotonia, Hydrocephalus, Cleft palate, Clinodactyly and Strabismus from the reported family's clinical description. The hydrocephalus item quotes the sentence that also records the discordant finding in the other brother, so the single-family variability is visible in the evidence rather than only asserted.

    IMPORTANT 3, variant spectrum and the self-contradicting "all missense" claim. Correct - the claim refuted itself two lines later against the p.Y11X nonsense allele. The genetic notes now list all seven tabulated alleles across four familial and eight sporadic patients, and state the thing that actually unites them: residual activity, not variant type. A hemizygous male who survives has partial function by construction, whatever the mutation looks like.

    IMPORTANT 4, PMID:24700572. Fetched and cited as the third evidence item on the CDPX2 differential - it is the paper arguing the independent entity, so it is the natural citation for the split.

    IMPORTANT 5, partial GeneReviews mining. Two evidence items added to inheritance (the X-linked-with-typical-but-not-absolute-male-lethality sentence, which is precisely the clause MEND occupies) and two to the symptomatic management treatment (treatment-of-manifestations and the surveillance schedule). All four graded directness INDIRECT, since the chapter is written for EBP-CDPX.

    IMPORTANT 6, no target_mechanisms. Added on simvastatin, targeting the sterol node with treatment_effect INHIBITS. The description states the limit that matters: it acts on one arm only, and if cholesterol deficiency rather than precursor excess drives the phenotype, reducing flux is the wrong direction - which is the entry's own open question.

    IMPORTANT 7, prognosis and genotype-phenotype. Added a progression: block with two phases. The p.Trp47Arg phase records the oldest male alive and well at 43 and the milder-structural, more-behavioural trade-off against p.Trp47Cys at the same residue - which, as the reviewer noticed, partly answers the uncertainty the entry itself flags on Atypical Behavior.

    IMPORTANT 8, no biochemical block. Added, for the two diagnostic sterols, with the measurement evidence and the NO_EVIDENCE item recording that they do not discriminate MEND from CDPX2 in an affected male.

    SUGGESTION, epiphyseal stippling frequency. Downgraded FREQUENT to OCCASIONAL, with the reasoning written into the description: the only evidence is a GeneReviews sentence about EBP-CDPX generally, and stippling is absent from the clinical table of the one MEND family reported in detail. The feature belongs to the gene; its frequency in this disorder is not established.

    SUGGESTION, differential bindings. Both differentials now carry disease_term (MONDO:0020603, MONDO:0010035) and distinguishing_features.

    Suggestions not taken: the node-3 split into precursor-excess and cholesterol-deficiency arms (defensible, but the discussion attaching to a single node is what makes the unresolved either/or legible, and splitting would need two nodes neither of which has independent evidence); the Tattered mouse animal model (no primary source fetched, and the deep-research report carries no PMIDs); regrading PMID:39754633's background sentences to OTHER (arguable either way and the reviewer marked it "not wrong as it stands").

    A duplicate-key defect introduced and caught during this round, worth recording because it is the failure mode CLAUDE.md describes. Two edits appended evidence items in a way that produced a repeated explanation: key and a repeated supports: key. PyYAML's safe loaders would have silently kept the last value; the ruamel-backed reference validator raised DuplicateKeyError and aborted, which is how it was found. Both were merged rather than deleted and check-duplicate-keys is clean.

    Validation after the round: schema validation passes on both files; 54 of 54 evidence snippets verified; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

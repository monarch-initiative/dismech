  summary: Retype candidate modifiers APOA5, ABCA1, APOB from MODIFIER to UNKNOWN
  details: |
    Requested by the lipids and obesity gene-family review. The APOA5, ABCA1 and APOB records were typed MODIFIER on the strength of one study (PMID:31397093): an in-house in-silico ranking of exome variants in cholesterol-homeostasis genes in one family of four affected males sharing a primary EBP variant, whose authors conclude only that these are the most relevant candidate modifier genes in this family. With no statistical test, replication or functional validation, and no ClinGen assertion for these genes in MEND syndrome, the modifying role is not established, so the three records are now typed UNKNOWN with notes saying why. Added variant_origin GERMLINE to all three: the proposed variants are dbSNP-catalogued polymorphisms called from the patients' exomes. The curated summaries for APOA5 (hgnc_17288), ABCA1 (hgnc_29) and APOB (hgnc_603) were refreshed to the new typing and verify.

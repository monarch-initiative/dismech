  summary: Address review findings 1-3 on PR 9669
  details: |
    Addressed findings 2 and 3 and most suggestions. Finding 1 (Orphanet) is blocked by tooling and is documented rather than worked around.

    Finding 3 was correct and cheap: joint dysplasia is named in the PMID:16826533 sentence the entry already quotes twice, and is now curated with HP:0001367. The reviewer's wider point stands too, that the no-quotable-source framing was stronger than the evidence situation.

    Finding 2: polydactyly and syndactyly added. They still carry no evidence item, and notes now explains both closed routes rather than repeating a bare assertion. Orphanet cannot be built (see below). PMID:21716096, which by title is the single most on-point clinical source for exactly these features (Hypoplasia/aplasia of pelvis, femora, fibulae, ulna, digits and nails: Fuhrmann syndrome without WNT7A mutations), has content_type unavailable in PubMed, so there is no abstract text to quote; it is recorded in references for provenance.

    A PubMed search for further Fuhrmann sources turned up PMID:23266637, which materially qualifies this entry's central claim. The entry curates a dose model from PMID:16826533 (partial WNT7A loss gives Fuhrmann, null gives AARRS). PMID:23266637 reports the same G204S variant causing AARRS in three Saudi families and a Fuhrmann phenotype in an unrelated Saudi patient, with the authors explicitly questioning the genotype-phenotype correlation. Curated as PARTIAL evidence on the genetic entry plus a knowledge gap, rather than left out.

    Suggestions taken: HP:0002990 Fibular aplasia replaced with HP:0006492 Aplasia/Hypoplasia of the fibula, which matches both the description and the disease name; GO:0009952 added alongside the smoothened proxy; femoral bowing removed from the Postaxial Limb Deficiency description since that branch does not explain a proximal deformity, with a knowledge gap recording that it has no upstream node at all; references block and OMIM:228930 added.

    Ran the GeneReviews check the reviewer asked for: zero hits for both Fuhrmann syndrome and WNT7A. Their recollection was right and it is not a gap.

    Orphanet is unbuildable: just refresh-orphadata fails because data/orphadata/MANIFEST.yaml pins the 2025-12-09 snapshot while Orphadata now serves 2026-06-23 at the same URLs. Two independent downloads gave an identical checksum and the XML declares its own date, so this is a stale pin, not a bad transfer. Bumping it rebuilds all 345 committed ORPHA cache files, out of scope here. Filed as issue 9687.

    13/13 snippets verified; schema, term, entity-ref, duplicate-key and the three baseline gates pass. Cache diff is the single HP:0006492 row.

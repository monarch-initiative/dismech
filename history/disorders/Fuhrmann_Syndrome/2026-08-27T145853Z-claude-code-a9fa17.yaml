  summary: 'Create: Fuhrmann Syndrome'
  details: |
    Curated MONDO:0009232 as a Disease entry from a Perplexity deep-research report plus three primary references (PMID:16826533 human WNT7A genetics, PMID:7585966 WNT7a-Lmx1 dorsalization, PMID:7697724 WNT7a-Shh maintenance). Five-node pathograph running partial WNT7A loss to two parallel developmental branches (dorsoventral patterning; SHH maintenance) to the postaxial limb deficiency and nail hypoplasia.

    Evidence grading is the notable part of this entry. Only the genetic claim is HUMAN_CLINICAL; every mechanism node is MODEL_ORGANISM because the WNT7a developmental biology is chick and mouse. Several phenotype items are graded PARTIAL because the cited abstract describes limb aplasia/hypoplasia generically without naming the specific structure. Femoral bowing and nail hypoplasia deliberately carry no evidence item: they are in the syndrome definition but no abstract available to this curation states them quotably, and the deep-research report's citations for those features were disease-registry web pages rather than literature.

    A HUMAN_MODEL_MISMATCH discussion records that both mechanism nodes rest on avian embryology whose translational validity to the human limb is untested, which is the accurate kind for evidence that exists in a model but is unconfirmed in humans.

    11/11 snippets verified; term validation passed.

  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7377. All six IMPORTANT items and the one SUGGESTION were accepted and addressed; none were disputed. (1) Deep-research artifact: ran the claude_code provider, producing research/PRKN-Related_Juvenile_Parkinson_Disease-deep-research-claude_code.md plus its citations sidecar (13 web searches, 42 citations, 306 s). A gene-frequency NEC check on the report passed (PRKN/PARK2 about 108 mentions vs PINK1 13, DJ-1 2). The report was used as a completeness cross-check only; all entry claims remain sourced to directly-read fetch-reference caches, and this provenance is recorded in the entry notes. (2) evidence_source corrections on PMID:33029617: two items quoting Borsche's introductory summary of murine work were retagged from HUMAN_CLINICAL to MODEL_ORGANISM, and the truncated snippet was requoted with its full 'Recent research in murine models suggests that' lead-in so the murine framing is visible. The paper's genuine human-cohort results remain HUMAN_CLINICAL, and a further human result (IL6 correlation with disease duration) was added. (3) Replaced GO:0051881 regulation of mitochondrial membrane potential plus modifier ABNORMAL with the exact-match GO:0051882 mitochondrial depolarization. (4) Split three bundled pathophysiology nodes into atomic nodes, taking the graph from 10 to 13 nodes: Mitochondrial Depolarization and PINK1 Accumulation became Mitochondrial Depolarization then PINK1 Accumulation on the Outer Mitochondrial Membrane; Accumulation of Damaged Mitochondria and Oxidative Stress became Accumulation of Damaged Mitochondria then Oxidative Stress and Respiratory Chain Deficiency; mtDNA Release and Innate Immune Activation became Cytosolic and Circulating mtDNA Release then cGAS-STING Innate Immune Activation. All downstream edges were rewired and the HUMAN_MODEL_MISMATCH discussion attaches_to refs and rationale text updated to the new node names; a script check confirms zero dangling edges and zero dangling attaches_to. (5) Relative Cognitive Sparing: removed the misleading HP:0001300 Parkinsonism binding, leaving an unbound preferred_term plus an explicit NEEDS-TERM-REQUEST note explaining why both a dementia term and the general parkinsonism parent are wrong. (6) Mined the previously under-used GeneReviews Management and Surveillance sections: added a Non-Motor and Autonomic Symptom Management treatment covering constipation, genitourinary, sleep and orthostatic hypotension, a Cognitive and Dementia Management treatment bound to NCIT:C47792 Acetylcholinesterase Inhibitor, and a Periodic Neurologic, Autonomic and Cognitive Surveillance diagnosis entry bound to NCIT:C81313 capturing the six-to-12-month interval. SUGGESTION: removed the unsupported ascertainment-bias attribution from the case-fraction notes, and rewrote the mutational-spectrum claim so it no longer conflates counts of distinct variant types with allele share, explicitly stating what is not asserted. Validation after changes: just validate passed on schema, terms and references, with 90 of 90 snippets verified (up from 82); check_folded_hyphens passed; targeted pytest selection over discussion/attaches/hypothesis tests passed 1799 tests.

  summary: 'Create: PRKN-Related Juvenile Parkinson Disease (PARK2, MONDO:0010820)'
  details: |
    De novo curation of autosomal recessive juvenile Parkinson disease 2 (PARK2/PARK-PRKN, MONDO:0010820, PRKN/hgnc:8607), curated as an entity distinct from the existing Parkinsons_Disease entry (MONDO:0005180); the lump-vs-split rationale is recorded in the entry notes. NEC preflight was performed first: OAK confirmed MONDO:0010820 carries RO:0004003 HGNC:8607 (PRKN), xref OMIM:600116, and the synonyms PARK2 and 'PRKN young-onset Parkinson disease'. This matters because the PARK numbered series (PARK2/PRKN vs PARK6/PINK1 vs PARK7/DJ-1) is a high named-entity-confusion risk class. Curated a 10-node PINK1-parkin mitophagy pathograph with typed causal edges: PRKN biallelic loss of function and mitochondrial depolarization/PINK1 accumulation converge on failed phospho-ubiquitin-dependent parkin recruitment and E3 activation, then loss of outer-mitochondrial-membrane substrate ubiquitination, impaired mitophagy, accumulation of damaged mitochondria and oxidative stress, mtDNA release with cGAS-STING/IL-6 innate immune activation, selective substantia nigra pars compacta dopaminergic neuron loss, nigrostriatal dopamine deficiency, and parkinsonism. Nodes carry biological_scale tags and GO/CL/UBERON/HGNC bindings. Also curated: the exon-rearrangement CNV-dominant mutational spectrum with the clinical warning that sequencing-only panels miss a large share of alleles so dosage analysis such as MLPA is required; structured case_fractions of 8.6 percent pooled across more than 5800 early-onset PD cases, 49 percent in familial EOPD, and 77 percent in isolated PD with onset at or below 20 years; structured prevalence using measure_type and prevalence_class rather than the deprecated percentage field; Lewy-body-negative ventral-predominant nigral degeneration as the distinguishing histopathology, including a PARTIAL evidence item recording that 2 of 5 autopsy cases did show sparse Lewy bodies so the claim is not overstated; levodopa/carbidopa with both GeneReviews drug-safety warnings, plus deep brain stimulation; and two discussions, namely a HUMAN_MODEL_MISMATCH for the parkin-knockout mouse failing to reproduce nigral degeneration with two proposed experiments, and a KNOWLEDGE_GAP for nigral ventral-tier selective vulnerability. Frequency bands were asserted only where a source states one (hyperreflexia and levodopa-induced dyskinesia, both from GeneReviews) and omitted elsewhere. Evidence discipline: 13 references, all fetched via just fetch-reference; no cache file was hand-written. PMID:30135585 (Sliter 2018 Nature, the most-cited parkin-STING source) was found to carry a 2025 Nature retraction notice and was deliberately excluded; the innate-immune arm is instead sourced to the independent human study PMID:33029617. Validation: just validate passed covering schema, terms and references; just validate-terms passed; just validate-references reported 82 of 82 snippets verified against cached references with zero issues.

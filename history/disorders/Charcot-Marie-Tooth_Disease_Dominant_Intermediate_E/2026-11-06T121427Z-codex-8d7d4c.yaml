  summary: Review INF2 neuropathy using primary full texts and current clinical cohorts
  details: |
    # INF2 neuropathy evidence review

    Scope: CMT dominant intermediate E / INF2-related neuropathy. Eligible genetic disorder with no earlier REVIEW. Infectious/environmental disorders remain excluded. One current Orca checkout, no child workers/worktrees. Original unrelated untracked caches are preserved.

    Sources: complete substantive OpenScientist report and citation list; cached primary abstracts plus scientific results/discussion and relevant methods of PMID 37491439, 39337270, 40985697, 39857711, 30962575, 39536114, 39621430 and 38916773. PMID 39536114 was regenerated through the repository fetcher and upgraded to full text. Current CMT GeneReviews full HTML supplies indirect supportive-care guidance. The 2026 calmodulin paper was retrievable only as abstract; publisher full-text fetches returned 403. Founding NEJM full-text fetches also returned 403. No reference markdown was hand edited.

    Eight-dimension completeness cross-check:
    1. Phenotypes — adequate after adding hearing impairment, absent/decreased reflexes, conduction block, nephrotic syndrome, peripheral nerve enlargement and cohort-recorded tremor. Unsupported whole-disease frequency labels removed. Demyelinating physiology and adolescent kidney failure added using the later neuropathy cohort. Cohort counts are not population penetrance.
    2. Subtypes — adequate. Historical CMTDIE is this gene-associated neuropathy; isolated INF2 renal disease is adjacent scope, not a neuropathy subtype. No unsupported division at residue 184.
    3. Mechanisms — adequate. Atomic demyelination/axon-loss and renal trafficking/degradation/injury/scarring nodes; CAP-mediated regulation, newer CaM binding, cytoskeletal/ER/contact-site/mitochondrial results and renal-cell MRTF-SRF/mitotic findings included with model/allele limitations. No direct respiration-to-myelin causal claim. No universal GOF assignment to every DID variant.
    4. Treatments/trials — adequate. Transplantation, experimental renal-model bortezomib and latrunculin B, and general CMT supportive care/counseling. No verified disease-specific phase-II-or-later trial emerged. ASO/siRNA therapeutic efficacy proposed in the report is not established; experimental gene knockdown is distinguished from clinical therapy.
    5. Genetics — adequate. Missense, in-frame deletion and splice consequences, confirmed de novo in 5 tested pedigrees, variable expression and isolated-neuropathy examples. The LZTR1 R68G finding is a VUS without tumor sequencing; not an established modifier or tumor-predisposition claim. No computational result promoted to definitive pathogenicity.
    6. Diagnostics — adequate. Molecular testing independent of coincident renal disease, intermediate/demyelinating conduction with CIDP mimicry, clinically indicated renal biopsy and longitudinal proteinuria/renal-function assessment; no invented interval.
    7. References — adequate. New primary clinical cohorts and cell studies added; full texts used for findings absent from abstracts. Primary source 38916773 traced from the 2024 regulatory review rather than relying on its universalized cascade. Preprint 38915495 is not counted as independent replication of 39536114. Generic mitochondrial physiology and diabetic-nephropathy CAP1 paper 41864363 are outside direct disease evidence.
    8. Consumption — adequate. Core research themes covered or explicitly limited by directness. Incorrect proposed ontology IDs, rigid positional rules, absolute transplant nonrecurrence and generic disease-wide frequencies were rejected.

    Additional interpretation: table 1 of PMID 40985697 gives seven assessed pes-cavus cases; its prose percentage uses eight as denominator. The record does not reuse that percentage as a disease frequency. The cohort has internal age/variant-label inconsistencies; affected individual timelines and erroneous p.Trp104 label are not propagated. Nerve-enlargement paper has mechanistic/tumor hypotheses untested in somatic tissue. R218Q renal cultures and S186P organoids are not nerve models, and organoid controls are non-isogenic. The current record's shared quotes all received document-role grading.

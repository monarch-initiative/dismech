  summary: 'Review round 1: address ai4c-reviewer findings on #10767'
  details: |
    Addressed both findings. (1) Added an animal_models section for the INF2 R218Q knock-in mouse with three modeled_mechanisms links: RECAPITULATES against the autoinhibition node with a cellular actin readout, PARTIALLY_RECAPITULATES against the podocyte node, and FAILS_TO_RECAPITULATE against the nerve node - the last recorded as a substantive negative, since no INF2 mouse of either genotype has a reported neurological phenotype and the nerve arm of this disorder therefore has no animal model at all. (2) Made the directness grading consistent: the two PMID:39536114 items on the variant node now carry directness INDIRECT like the nephrin node, and genetic_context states why the gain-of-function conclusion is treated as generalising across the diaphanous inhibitory domain while the nephrin route stays allele-local - gain versus loss of function is a property of the domain and was measured across disease mutants, whereas the nephrin route is one pathway in one cell type from one allele. The reviewer suggested keeping R218Q inside the snippet; that is not possible, because the cached text flattens the paper's superscript genotype notation and the sentence reads 'INF2 mice'. The allele is named in the explanations instead and the cache limitation is recorded there. Revalidated: schema, terms, 62/62 snippets, all offline gates.

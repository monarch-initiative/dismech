  summary: 'Create: Charcot-Marie-Tooth Disease Dominant Intermediate E (INF2)'
  details: |
    De novo curation of INF2-related dominant intermediate CMT from primary literature plus one openscientist deep-research run. The entry is built around the diaphanous-inhibitory-domain restriction of the allele spectrum and a gain-of-function reading supported both biochemically (escape from CAP-KAc-actin inhibition) and in vivo (point-mutant mice susceptible to glomerular disease where knockouts are not). The deep-research run materially changed the entry: it supplied the disease-specific nerve-biopsy series establishing a Schwann cell actinopathy, the positional genotype-phenotype rule that partly answers the organ-selectivity gap, the nephrin/Dynll1/PI31 podocyte mechanism, and the transplant non-recurrence finding that is the entry's only management-changing item. The nephrin mechanism is graded INDIRECT throughout because it was established for R218Q, an FSGS-range allele outside this entry's CMT-range segment. Validated: schema, terms, 58/58 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms.

  summary: 'Round-2 review: retract a false cache-limitation claim and correct the
    allele-coverage statement'
  details: |
    Two blocking review findings, both correcting statements this curator asserted that were not true.

    1. A false claim about the reference cache. Two evidence explanations (one on the INF2 DID Variant node, one on the animal-model link) said the allele R218Q 'cannot be kept inside the quote because the cached text flattens the paper's superscript genotype notation'. That is not what the cache does. references_cache/PMID_39536114.md carries 'R218Q' in full; it is hard-wrapped to the end of the preceding line, and snippet matching normalises whitespace. Both snippets were replaced with the full sentence 'R218Q INF2 mice are susceptible to glomerular disease, in contrast to INF2 knockout mice.', which verifies, and both explanations now name the allele without inventing a tooling defect to explain its absence. The same false claim was made in the round-1 commit message, the round-1 history record and a PR comment; the append-only round-1 record is left untouched and this record is the correction. The PR comment has been corrected by a follow-up comment.

    2. The entry understated its own evidence. genetic_context.description said 'Both lines use FSGS-range alleles'. PMID:30962575 tested two mutants, not one: R218Q, an FSGS allele, and L77R, which the source itself calls a CMTD mutant and which sits at residue 77, inside the 57-184 CMT-associated span this entry describes. So the biochemical line bears on CMT alleles directly and only the mouse line is confined to an FSGS allele. The description now says that, and two evidence items were added to the Loss of Facilitated Autoinhibition of INF2 node: the sentence naming both mutants, and the result showing reduced CAP-KAc-actin inhibition of both with R218Q the more resistant.

    Validation after the change: just validate passes, 64/64 snippets verified against the committed reference cache (up from 62/62), and check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all pass. Reference-cache churn from re-fetching was reverted before staging.

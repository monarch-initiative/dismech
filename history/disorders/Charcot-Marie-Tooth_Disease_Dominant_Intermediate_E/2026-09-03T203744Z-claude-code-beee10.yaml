  summary: Regrade the animal-model readout to IN_VITRO after checking the methods,
    and name both knock-in genotypes
  details: |
    Takes a non-blocking suggestion the reviewer explicitly declined to escalate, because on checking it turned out to be a real mis-grade rather than a judgement call.

    The readout on the INF2 R218Q knock-in mouse link quoted the abstract sentence summarising colocalization, coimmunoprecipitation and cellular actin measurements, graded MODEL_ORGANISM on the strength of the model it hangs off. The committed cache for PMID:39536114 is abstract_only and that sentence names no experimental system, so the grade was not checkable from it. Fetching the full text settles it: the coimmunoprecipitation was done on cotransfected 293T cells, and the colocalization and F-actin/G-actin measurements on cultured podocytes derived from the knock-in mice. CLAUDE.md puts cultured cells under IN_VITRO whether human or animal, so IN_VITRO is correct and MODEL_ORGANISM was wrong. Regraded, with directness INDIRECT added for the same allele-range reason as its neighbours, and the explanation now discloses the three systems and states that the grade comes from the methods rather than from the quoted text.

    This is the same defect the reviewer caught on the sibling PR for DFNA78, where an immunohistochemistry snippet was graded HUMAN_CLINICAL because the abstract named no species and the full text said Macaca fascicularis. Two instances in one five-entry run, both from the same cause: evidence_source classifies the study, but the curator grades from whatever text layer is cached, and an abstract routinely omits exactly the thing the grade asserts. Reported on issue #9711, which proposes recording snippet provenance on EvidenceItem.

    Also named both knock-in genotypes in genotype, since the paper's basal F-actin/G-actin effect is homozygous-dominant and the model was run heterozygous and homozygous.

    Not taken: the reviewer's read that RAAS blockade and proteinuria screening should stay out as generic nephroprotection rather than INF2-specific management. Agreed, so nothing was added.

    Validation: schema, term and reference validation pass with 64/64 snippets verified, and the offline gates pass including check-snippet-grading. The full-text fetch was reverted so the committed cache is unchanged.

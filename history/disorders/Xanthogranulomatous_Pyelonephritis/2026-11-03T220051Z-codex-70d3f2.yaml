  summary: Create Xanthogranulomatous Pyelonephritis
  details: |
    Created a standalone XGP infectious-kidney-disease curation from OpenScientist research and generated PMID reference caches. Modeled obstructed endogenous upper-tract infection, E. coli and Proteus mirabilis, nephrolithiasis risk, chronic suppurative and foam-cell xanthogranulomatous renal inflammation, parenchymal replacement, perinephric/psoas extension, common phenotypes, CT and histopathologic diagnosis, culture-directed antibiotics, and nephrectomy for diffuse destructive disease. Duplicate preflight for issue #16420 found no existing XGP entry on origin/main or in open/all-state GitHub PRs.

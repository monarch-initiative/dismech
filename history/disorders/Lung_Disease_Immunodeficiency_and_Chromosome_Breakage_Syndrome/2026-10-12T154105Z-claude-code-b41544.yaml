  summary: 'Create: Lung_Disease_Immunodeficiency_and_Chromosome_Breakage_Syndrome'
  details: |
    New entry for LICS (MONDO:0014984; label copied with MONDO's trailing semicolon), caused by biallelic NSMCE3 (hgnc:7677) missense variants. Lump/split: DISEASE; single gene, no MONDO descendants, stub deleted. Built primarily from the founding report PMID:27427983 (full text: complex destabilization, HR and replication-recovery defects, micronuclei, clinical and immune features) and the 2021 Dutch series PMID:33741030 (variable immunity, lung pathology, failed HSCT and lung transplant, chronic course), with PMID:41608114 (IUIS 2024 row), PMID:26446992 (NSE3 dsDNA binding, used for the GO:0003690 molecular function) and PMID:36333305 (Atelis differential). Pathograph: NSMCE3 destabilization -> SMC5/6 destabilization -> defective HR and impaired replication recovery -> chromosomal instability; HR defect -> combined T and B cell dysfunction; two competing edges into the lung-injury node carried as mechanistic hypotheses (immunodeficiency-triggered, ALTERNATIVE, with REFUTE evidence; intrinsic systemic, EMERGING); 28/28 phenotypes causally connected. One openscientist deep-research report was used (13/13 references resolved, 2/2 quotes valid, 3 assessed on topic, 0 off topic; term validation needs_review for an obsolete HP:0005354 and the MONDO label, neither bound). Its unsourced claims (c.626C>T cDNA for p.Pro209Leu, cGAS-STING branch, p53 apoptosis from zebrafish smc5) were not curated. just preflight-dr could not run because the local MONDO sqlite build is absent and was deliberately not downloaded; the report was checked by hand against MONDO:0014984, OMIM 617241 and NSMCE3. PMID:40728043 (2025 case) has no abstract and is only mentioned in notes. Validation: validate, validate-terms, count-verified-snippets (all snippets verified), entity refs, causal targets, coarse phenotypes, snippet gates, gene-activity grounding and validate-disorders all pass.

  summary: 'Create: Congenital Disorder of Glycosylation Type IIr (ATP6AP2)'
  details: |
    De novo curation of ATP6AP2-CDG (MONDO:0026765) from the 2017 founding paper, its companion autophagic-liver-disease report, a 2023 Chinese case with a third allele, and a 2026 splicing-variant study. Deep research: one openscientist run (5 references, 5/5 resolved, 4/5 on topic, term_validation needs_review true). The report's ATP6AP2 identifier HGNC:18305 was checked and is correct, unlike the gene CURIEs in two of the four sibling runs in this batch. Its two newest references supplied the third allele and the splicing-versus-missense reconciliation; its framing otherwise follows the 2017 paper. Pathograph runs from the exon 3 missense alleles through impaired ATP6AP1 interaction and V0 assembly to organelle acidification, then branches to glycosylation and to autophagy/mTOR, with the entry stating that the clinical disease tracks the autophagy branch and the glycosylation defect is partial. Two models are curated with typed divergences: the liver-specific Atp6ap2 knockout mouse (complete knockout where patients carry retained-protein missense alleles) and the Drosophila knock-in, which is the only system in which lysosomal acidification itself is measured. Three REFUTE evidence items: the first affected female against a strict X-linked recessive reading, a patient with recurrent infections and normal immunology against hypogammaglobulinaemia as a constant, and a normal transferrin profile in an exon-skipping patient against transferrin screening as a test for ATP6AP2-related disease generally. Three discussions record the two-diseases-one-gene question reopened by the 2026 glycosylation finding in splicing patients, whether the glycosylation defect is the disease or its biomarker, and the unmeasured immunodeficiency mechanism. Validation on the final tree: just validate, validate-terms, validate-disorders, count-verified-snippets 47/47, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-coarse-phenotypes, check-reference-titles, check-case-collisions, check-genereviews (NO_CHAPTER), list-disconnected-phenotypes 11/15.


    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED, four IMPORTANT findings, all taken in one
    push). PMID:29388887 was declared in references: and named in the description as a founding
    paper while backing none of the 47 evidence items; it now supports the ATP6AP1-interaction edge,
    which previously had no evidence at all, and the whole-cascade sentence on the acidification
    node. Dysmorphic facial features were present in 2 of 4 patients and quoted inside another
    phenotype's snippet without being modelled; added with HP:0001999 and coarse_binding_basis
    SOURCE_UNSPECIFIED, since the source records their presence without enumerating them. Liver
    transplantation rebound from the generic NCIT:C15289 Organ Transplantation to NCIT:C15271 Liver
    Transplantation. The autophagy descriptor's modifier changed from GAIN_OF_FUNCTION to
    DYSREGULATED, which is what the node's own name and both its snippets say. The reviewer also
    observed that the research report's suggested transplantation CURIE NCIT:C15311 is Quality
    Control - a third wrong CURIE from this batch of five reports, and the only one that would have
    passed silently if copied, since no other field in the entry would have contradicted it.
    Post-round validation: count-verified-snippets 50/50, list-disconnected-phenotypes 11/16.
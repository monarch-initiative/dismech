  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR 17244 plus the CI gene-activity-grounding failure, in one push. Blocking: added Clubfeet (HP:0001762), Joint contractures (HP:0034392) and Scoliosis (HP:0002650) phenotype rows, each citing the GeneReviews additional-features sentence, with the contractures row also citing the Table 1 row and the single-case sentence from PMID:30167850 and carrying no frequency band because the sources disagree 1/12 against 10/10; none is given a causal parent because no source states whether they are secondary to hypotonia and non-ambulation. Added Orthopedic Management and Management of Constipation treatments from the GeneReviews management and surveillance text. Replaced the Feeding difficulties to Failure to thrive sequela evidence, which had cited a management line asserting no causal relation, with the PMID:30167850 sentence that states the causation directly in one individual. Corrected the false notes sentence claiming the three orthopedic features were recorded in the genetic and differential prose, and audited the rest of notes: also corrected an overstated claim that the report's term validation resolved 38 of 38 CURIEs (it checked 38, resolved 33, with 5 unverifiable and none unresolved) and attributed the absent-clinical-trials and facial-gestalt statements to their actual sources. Suggestions taken: risperidone added as a therapeutic_agent (CHEBI:8871, looked up); constipation row added; zygosity HOMOZYGOUS dropped from the root node because two of the three listed variants are compound heterozygous; the G-V-shift snippet moved onto the auto-inhibition to reduced-current edge it supports, with the node taking the CIH-release sentence; redundant GO:0042391 removed from the resting-potential node; NCIT:C15709 Genetic Testing bound as diagnosis_term after checking enum membership. CI: UNC80 was newly wired with no molecular function on its node, now bound to GO:0099106 ion channel regulator activity with a supporting snippet, chosen over the GO:0005261 cation-channel-activity annotation GO carries for UNC80 because the cryo-EM paper reports no transmembrane helices in UNC80, so it does not itself conduct; no baseline line was added. The unrelated DNMT3A finding on Heyn-Sproul-Jackson_syndrome came from branch drift and was cleared by merging origin/main (74d5a7391) into the branch, not by editing that entry. Revalidated after the merge: just validate, validate-terms, count-verified-snippets 81/81, validate-disorders, and 19 offline gates including gene-activity-grounding and snippet-length.

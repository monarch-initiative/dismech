  summary: 'Create: UNC80 Deficiency (IHPRF2, MONDO:0014777)'
  details: |
    New disorder entry for IHPRF2, named UNC80 Deficiency after the GeneReviews chapter title per design decision 18 and the entry-naming skill, diverging from the sibling IHPRF3 entry which predates that decision. Built from one OpenScientist deep-research report (reference validation 16/16 resolved, 0 off topic; term validation 38/38 resolved), with GeneReviews PMID:28933810 as the mandatory phenotype baseline and the ClinGen Definitive AR assertion copied from its CGGV record, rebuilt from the committed cache/clingen export because the local download had drifted from the pinned checksum. Pathograph runs from biallelic UNC80 loss of function through channelosome destabilisation, loss of surface and dendritic targeting, and persistent auto-inhibition to a reduced NALCN sodium leak current and dysregulated resting membrane potential, then by INDIRECT_UNKNOWN_INTERMEDIATES edges to six clinical features. Two discordances are curated rather than smoothed: seizures 1/12 versus 12/22, and central sleep apnea reported in one sibling pair against 0/12 breathing abnormalities in the largest cohort, recorded as a REFUTE item. The L2654* knock-in mouse is linked FAILS_TO_RECAPITULATE against the reduced-current node because its leak current was larger than wild type, and the allele-class divergence this implies is recorded as a knowledge gap. Early death is under progression because HP:0001522 is outside the PhenotypeTerm enum. Every CURIE was re-resolved against the committed caches, the OLS GO endpoint or the HGNC REST API while writing; GO:0098662 proved obsolete and was not used. Validated with just validate, validate-terms, count-verified-snippets (72/72), validate-disorders, and the offline gates for reference titles, snippet grading, snippet length, title snippets, retired prose, entity refs, causal targets, name collisions, coarse phenotypes, qualifier terms, duplicate keys, enum values, delivery system, logical rules, shared disease terms, cache order and case collisions. check-genereviews reports the chapter TAGGED with an EXACT title match.

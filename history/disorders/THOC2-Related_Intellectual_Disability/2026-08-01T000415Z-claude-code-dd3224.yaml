  summary: 'Create: THOC2-Related_Intellectual_Disability'
  details: |
    Created the THOC2-related X-linked intellectual disability entry
    (MONDO:0010496, OMIM:300957, THOC2 / hgnc:19073) for issue #7222.

    Deep research. Edison/falcon run, 487s, 22 citations, 1 markdown artifact:
    research/THOC2-Related_Intellectual_Disability-deep-research-falcon.md.
    Every falcon lead was re-verified against primary sources before use.
    Two falcon defects were caught and corrected: it cited PMID:26166475 for
    the 2015 defining paper (correct PMID is 26166480), and it asserted that
    no MONDO or OMIM identifier could be established for the disease. Falcon
    also drew on only three papers and missed the 2020 expansion cohort
    (PMID:32116545), both arthrogryposis reports (PMID:34976470,
    PMID:37945483) and the 2013 X;8 translocation case (PMID:23749989);
    these were added from an independent PubMed sweep of the nine papers with
    THOC2 in the title.

    NEC preflight. PASS. runoak on MONDO:0010496 returns a definition
    anchored on THOC2, an OMIM:300957 xref and an RO:0004003 relationship to
    HGNC:19073; the falcon report consistently concerns THOC2, X-linked
    inheritance and TREX. The specific contamination risk in this batch was
    the pre-existing THOC6 entry (Beaulieu-Boycott-Innes syndrome,
    MONDO:0013362, autosomal recessive). No THOC6 literature is used as
    evidence here. THOC6 is cross-referenced only in the entry notes and in
    the "Other THO/TREX Subunit Neurodevelopmental Disorders" differential,
    where the shared complex biology is genuinely relevant, cited to a 2025
    TREX review (PMID:40651286) rather than to THOC6 primary literature.

    Substantive corrections to the pre-existing draft:
    - Retired the naive bulk-mRNA-export-block model. The 2024 study found no
      overt nuclear mRNA retention in either mutant mouse primary neurons or
      the corresponding patient fibroblasts. GO:0006406 on the TREX node lost
      its DECREASED modifier, the node description now scopes the export
      claim explicitly, and a REFUTE evidence item records the negative
      finding. This also aligns the entry with the THOC6 entry, which
      independently retired the same model on different evidence.
    - Re-derived every frequency band against quoted numerators, preferring
      the pooled 38-individual cohort percentages in the discussion section of
      PMID:32116545 over the n=7 counts in PMID:29851191 where both exist.
      Short stature 52% FREQUENT, microcephaly 34% FREQUENT, IUGR 29%
      OCCASIONAL, increased body weight 26% OCCASIONAL, seizures 21%
      OCCASIONAL, composite movement abnormality 53% FREQUENT,
      hypertonia/spasticity 13% OCCASIONAL, the multisystem congenital and
      sensory group 10-30% OCCASIONAL. Hypotonia FREQUENT and tremor
      OCCASIONAL rest on the n=7 counts (4/7, 2/7) because the pooled cohort
      does not break those out. Every band now carries the quoted numerator
      that justifies it. A first pass of this entry banded the growth
      phenotypes from the n=7 series alone and asserted in several
      explanations that no larger numerator existed; a pre-PR red-team review
      caught that the pooled percentages were present in an already-cited,
      already-cached full text, and all such statements were corrected.
    - Added the multisystem arm of the disease, which the first pass omitted
      entirely: the largest cohort states that THOC2 disease should be
      considered multisystemic in a significant proportion of individuals. A
      Multi-Organ Developmental Involvement pathophysiology node was added,
      feeding congenital cardiac, genitourinary, skeletal and airway-malacia
      phenotypes, plus feeding difficulties, gastro-oesophageal reflux, visual
      impairment, hearing impairment, recurrent aspiration and sialorrhea. The
      cohort's explicit surveillance recommendation (paediatric systems review,
      echocardiogram, hearing screening, ophthalmology at diagnosis) and its
      low-threshold EEG/MRI advice were added as a treatment and a diagnosis
      entry respectively.
    - Recorded the largest cohort's explicit negative finding that there is no
      clear genotype-phenotype correlation by variant type or protein region,
      so that the one allele-specific exception (the arthrogryposis splice
      variant) is not over-generalised.
    - Recorded that cognitive severity spans normal IQ to profound
      intellectual disability, including a functionally confirmed variant
      carrier with a performance IQ of 104 and isolated speech apraxia.
    - Strengthened the R-loop node: R-loops accumulate in the patient's own
      fibroblasts, and RNase H1 overexpression reduces both R-loops and
      comet-assay DNA damage, ordering the two events causally. Confidence
      held at PROVISIONAL because the rescue was done in mouse cells and only
      one allele has been tested.

    Additions: a TISSUE-scale "Disrupted Cortical Neurogenesis and Neuronal
    Maturation" node between the R-loop node and the organism node; five
    phenotypes (small for gestational age, atypical behavior, autism,
    inability to walk, and allele-specific arthrogryposis multiplex
    congenita); a C. elegans model; physical/occupational therapy and
    antiseizure treatments; skewed X-inactivation in carrier mothers;
    evidence for all three differential diagnoses and both Harrison's
    classifications; and a second proposed experiment covering a genuine
    literature conflict (acute THOC2 knockdown increased progenitor
    proliferation without apoptosis, whereas the germline hypomorph produces
    progenitor cell death).

    No GeneReviews chapter exists for THOC2; a PubMed search returns nothing.
    The THOC6 GeneReviews chapter (PMID:32790266) is a different disorder and
    is not used.

    Review. A pre-PR red-team review using the dismech-pr-review skill was run
    in fresh context and returned REQUEST_CHANGES on two critical findings
    (frequency bands derived from the wrong denominator, and omission of the
    multisystem phenotype arm) plus several important and minor items. All
    were addressed before this record was finalised, including correcting
    three evidence_source tags from MODEL_ORGANISM to IN_VITRO where the cited
    experiments were on cultured cells, extending a truncated snippet that did
    not carry its directional claim, downgrading a background-sentence item
    from SUPPORT to PARTIAL, and replacing HP:0002093 with HP:0002086 for the
    generic respiratory-abnormality phenotype.

    Validation. Schema clean. Term validation passed. Reference validation
    reported 123/123 snippets verified against cached references. Compliance
    87.1 percent, against 81.9 percent on the draft over a much larger field
    denominator. Graph integrity checked independently: 6 pathophysiology
    nodes, 27 phenotypes, 33 downstream edges with no dangling targets, no
    unconnected phenotypes, no unreachable nodes, no duplicate YAML keys, and
    the discussion attaches_to reference resolves.

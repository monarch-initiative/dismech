  summary: Correct overclaim about Heritable Thoracic Aortic Disease grouping membership
  details: |
    The Relationship to the heritable entries notes paragraph asserted that the Heritable_Thoracic_Aortic_Disease grouping collects six named standalone entries: Familial TAAD, Marfan, Loeys-Dietz, Vascular EDS, Aneurysm-Osteoarthritis Syndrome, and Rienhoff Syndrome. Checked kb/groupings/Heritable_Thoracic_Aortic_Disease.yaml directly: its members list has only five entries -- Marfan, Loeys-Dietz umbrella, Arterial Tortuosity Syndrome, Familial TAAD, and Shprintzen-Goldberg Syndrome -- and does not include Vascular Ehlers-Danlos Syndrome, Aneurysm-Osteoarthritis Syndrome, Rienhoff Syndrome, or the newer standalone Loeys-Dietz_Syndrome_4/_6 entries. This is item 6 of issue #8866's reconciliation checklist. Corrected the notes text to accurately state which entries are and are not grouping members, without changing grouping membership itself, which remains the larger, human-judgment-gated part of #8866. Validated with just validate, just check-duplicate-keys, and just check-groupings; grouping evaluation unaffected, all members still SATISFIED.

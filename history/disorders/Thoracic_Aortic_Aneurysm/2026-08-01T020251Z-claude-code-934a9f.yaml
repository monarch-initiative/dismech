  summary: 'Create: Thoracic Aortic Aneurysm'
  details: |
    Created kb/disorders/Thoracic_Aortic_Aneurysm.yaml (MONDO:0005396) as the general, sporadic-degenerative thoracic aortic aneurysm entry: the thoracic counterpart of Abdominal_Aortic_Aneurysm, deliberately distinct from the existing heritable entries (Familial_Thoracic_Aortic_Aneurysm_and_Aortic_Dissection, Marfan_Syndrome, Loeys-Dietz_Syndrome, Vascular_Ehlers-Danlos_Syndrome, Aneurysm-Osteoarthritis_Syndrome, Rienhoff_Syndrome) collected by the Heritable_Thoracic_Aortic_Disease grouping. Deep research provider: claude_code; no Edison/Falcon, Asta or OpenScientist key was available in this environment, and provider output was treated as leads only. Curated an 8-node pathograph: aging/hemodynamic-stress and bicuspid-valve wall-shear-stress triggers, feeding VSMC depletion, ECM proteolysis and segment-specific SMC lineage susceptibility, converging on non-inflammatory medial degeneration, then loss of wall tensile strength with progressive dilatation, then dissection and rupture. Declares partial conforms_to against aortopathy_tgfbeta_dysregulation at the three aetiology-independent downstream nodes only; the module monogenic-lesion and TGF-beta nodes are intentionally NOT claimed for sporadic disease, and that open question is recorded as a HUMAN_MODEL_MISMATCH discussion contrasting the Marfan-mouse losartan result with the human randomized trial. A second KNOWLEDGE_GAP discussion records the central unsolved problem that a majority of both type A and type B dissections occur below the operative diameter threshold. Validation: just validate passed for schema, terms and references; just validate-references reported 69 of 69 snippets verified against cached references; weighted compliance 88.1 percent. Every PMID was fetched with just fetch-reference and every snippet independently confirmed as an exact whitespace-normalized substring of the cached abstract. Term validation caught one bad candidate CHEBI identifier, CHEBI:35567, which actually denotes 4H-1,2,3-triazole rather than beta-adrenergic antagonist; it was replaced with the verified NCIT:C29576 drug-class term. Environment note: the repo virtualenv was rebuilt on Python 3.13 because pyhornedowl is incompatible with the pre-existing 3.14 venv, which had silently broken all OAK-backed term validation repo-wide.

  summary: 'Address PR #7550 review: segment and mortality phenotypes, ARB arm'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7550. All three IMPORTANT items
    are addressed.

    ITEM 1 - missing aortic segment phenotypes. Segment heterogeneity is a central thesis of this
    entry - it has a dedicated pathophysiology node and the entry cites distinct growth rates and
    hinge points - while phenotypes carried only the aortic root. Added Ascending aortic aneurysm
    (HP:0004970) and Descending thoracic aortic aneurysm (HP:0012728), both OAK-verified before
    use, each with two evidence items from already-cached sources. The ascending entry carries the
    6.0 cm hinge point and the 0.07 cm/year growth rate; the descending entry carries the
    independently measured 0.19 cm/year from a dedicated 907-patient series plus a caveat that
    matters clinically - median size at acute type B dissection was 4.1 cm, well below the 7.0 cm
    operative threshold, so a diameter rule captures rupture risk in that segment far better than
    it captures dissection risk. The descriptions state explicitly why segment identity rather
    than absolute diameter drives the intervention decision, which is the point the separate
    phenotypes exist to make machine-readable.

    ITEM 2 - ARB arm under-modelled, and the discussion mis-framed. Both parts addressed.
    NCIT:C66930 Angiotensin II Receptor Antagonist added as a second therapeutic_agent alongside
    the beta-blocker, and PMID:36049495 fetched with just fetch-reference and verified before use.
    Two evidence items: the headline result (ARB allocation approximately halved the annual rate of
    aortic root Z score change over a median 3 years, across 7 trials and 1442 patients) and the
    fibrillin-1 subgroup effect, the latter PARTIAL because it comes from syndromic Marfan cohorts
    and transfer to sporadic degenerative aneurysm is not established.

    The reframing is the substantive half. The review's point was correct and worth stating
    precisely in the entry: PMID:25405392 showed losartan was not superior to atenolol, an ACTIVE
    comparator - it did not show that TGF-beta blockade failed to translate. The
    mismatch_taa_tgfbeta_losartan_translation discussion rationale now says so, and states the
    narrower honest version of the mismatch: ARBs demonstrably slow root dilatation in Marfan
    syndrome against control, but do not outperform beta blockade, so the human data do not
    isolate a TGF-beta-specific benefit of the magnitude the mouse model predicted. The treatment
    description carries the same distinction, since collapsing the two findings is the easy error.

    ITEM 3 - no symptomatic or mortality phenotypes. Added Chest pain (HP:0100749) and Death from
    aortic complication (HP:0001699), both OAK-verified. The mortality phenotype closes the gap
    the review identified - the pathograph previously terminated at dissection and rupture while
    the entry quoted a 10.8%/yr death rate - and its evidence item carries the full yearly-rate
    sentence, which shows death exceeding rupture and dissection individually. Its notes record a
    term caveat: HP:0001699 Sudden death is the closest available term, but the 10.8% figure is
    all-cause death in the cohort rather than specifically sudden death, so the term is broader in
    mechanism than the datum and preferred_term is kept general. Chest pain deliberately carries
    no evidence item and no frequency, with the reason stated inline - no cached source quantifies
    symptom frequency in unruptured aneurysm, and the clinical rule (new or severe pain in a known
    aneurysm is dissection until proven otherwise) is guideline practice rather than a finding of
    any cited study. It is curated anyway because a phenotype list containing only imaging
    findings would misrepresent how this disease presents. Aortic regurgitation, hoarse voice and
    dysphagia were not added: no cached source for this entry documents them, and they were listed
    as optional.

    VALIDATION. 'just validate-disorders kb/disorders/Thoracic_Aortic_Aneurysm.yaml' passes in full
    - schema, terms, references - with "Snippets checked: 81/81 verified against cached
    references", up from 74/74. HP:0004970, HP:0012728, HP:0100749, HP:0001699 and NCIT:C66930
    were all verified with OAK before use. The branch was rebased onto current origin/main,
    replacing an earlier merge commit; the rebase conflicted only on two generated cache CSVs,
    resolved to main's side with this entry's rows re-derived by just validate-terms.

  summary: 'Review round 1: ontology bindings on conformer nodes, hypomyelination
    term, node split'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11681. Both blocking items taken, plus most of the suggestions. Single bundled push.

    BLOCKING.
    - Both conforms_to nodes now carry ontology bindings: CL:0000128 oligodendrocyte on the trigger node and on Deficient CNS Myelination, plus GO:0042552 myelination DECREASED on the myelination node. This was a real omission - the entry's headline knowledge gap is about oligodendrocyte selective vulnerability and the cell type appeared nowhere machine-readable.
    - Added a CNS hypomyelination phenotype, but bound to HP:0003429, NOT the HP:0007266 proposed in review. HP:0007266 resolves to 'Cerebral dysmyelination' (verified with runoak against ols:hp). Dysmyelination and hypomyelination are different concepts - abnormal myelin composition versus insufficient deposition - and the hypomyelinating-versus-demyelinating distinction is the entry's central claim, so the suggested term would have asserted the opposite of what the entry argues. Also added HP:0001257 Spasticity as suggested.

    SUGGESTIONS TAKEN.
    - Split the bundled 'p53 Stabilization and Apoptosis of Translation-Dependent Progenitors' node into 'p53 Stabilization' (MOLECULAR) and 'Apoptosis of Translation-Dependent Progenitors' (CELLULAR), with CL:0002453 oligodendrocyte precursor cell on the latter. All downstream targets, attaches_to refs and animal-model link targets repointed; check_entity_ref_foreign_keys and check-causal-targets both clean afterwards.
    - Added GO:0006364 rRNA processing and the GO:0005736 RNA polymerase I complex protein-complex binding to the Pol I node.
    - Replaced the single generic supportive-therapy treatment with named physical therapy and occupational therapy entries. Used NCIT:C15302 Physical Therapy, not the NCIT:C15271 proposed in review, which resolves to Liver Transplantation.
    - Added a discussion recording the p53-inhibition preclinical lead, framed around why it is weaker than it looks: the zebrafish rescue is explicitly partial, the model has no myelin phenotype, it is a null rather than a hypomorph, and p53 suppression in a child carries oncogenic risk.

    NOT TAKEN.
    - gnomAD constraint metrics and ClinVar counts: the report obtained these by direct database query rather than from a citable publication, so there is no reference to attach an exact-quote snippet to. Adding them would mean an unevidenced numeric claim.
    - Pruning the seven 'uncited' references_cache files: they are cited by the committed deep-research report, which CI checks for citation coverage, so they are owned by this PR rather than screening residue.

    Validation: just validate-disorders clean with 43/43 snippets verified (up from 40/40); schema, terms, duplicate-keys, entity-refs, causal-targets, enum-values all OK; conforms_to anchors resolve after the node split.

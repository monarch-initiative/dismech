  summary: 'Create: Hypomyelinating Leukodystrophy 27'
  details: |
    De novo curation of hypomyelinating leukodystrophy 27 (MONDO:0958018, POLR1A) from one openscientist deep-research report plus direct reading of every cited reference in references_cache/.

    preflight-dr returned WARN, not PASS: the rival-gene heuristic flagged MDM2 at 27% of POLR1A mentions. Inspected every MDM2 mention before proceeding - all are the p53/MDM2 nucleolar-stress checkpoint, i.e. the disease mechanism, not a second disease entity. OMIM xref (620675) and causal gene both match the intended MONDO term, so the report was used.

    Two nosological calls recorded in the entry: (1) HLD27 is polymerase I, not polymerase III, so conformance is to the cns_myelin_failure module rather than to dismech's POLR-Related_Leukodystrophy entry (POLR3A/POLR3B); the convergence is at the oligodendrocyte and myelin-sheath nodes only. (2) POLR1A is allelic with acrofacial dysostosis Cincinnati type - dominant, craniofacial, no leukodystrophy - which dismech already carries; the founding report states the mandibulofacial syndrome was absent in their family.

    Evidence tiering is the substance of this entry. Reduced rRNA transcription, aberrant rRNA processing, abnormal protein homeostasis and ER stress carry IN_VITRO evidence from patient fibroblasts with no directness qualifier. The nucleolar phase-separation and p53 steps carry directness: INDIRECT throughout, because every supporting experiment is a Pol I null, a cancer cell line, or zebrafish neural crest. A HUMAN_MODEL_MISMATCH discussion records that the only in vivo model is a homozygous polr1a null built for the dominant craniofacial disorder, and the FAILS_TO_RECAPITULATE link against Deficient CNS Myelination states that no available model reproduces the defining phenotype.

    The atypical fifth family is curated as supports: REFUTE against the claim that hypomyelination is obligate, not against the disease-phenotype association.

    Errors caught during curation: the report offered HP:0002500 as 'Leukodystrophy' (it is Abnormal cerebral white matter morphology; the correct term is HP:0002415) and HP:0002451 as 'Basal ganglia abnormality' (it is Limb dystonia; the correct term is HP:0002134). Two MONDO CURIEs written from memory - MONDO:0024239 and MONDO:0060615 - resolved to congenital anomaly of cardiovascular system and to nothing at all; replaced with MONDO:0100605 and MONDO:0014651 read out of existing KB entries. One reference_title was completed from memory after a truncated terminal read and did not match the cached title; corrected programmatically from references_cache frontmatter.

    Validation: just validate-disorders clean with 40/40 snippets verified; schema, terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, reference-titles all OK; check_conforms_to_module_node_references returns no issues.

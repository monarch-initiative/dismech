  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review (round 2) on PR #11681. One blocking item, one suggestion, single bundled push.

    BLOCKING - the round-1 history record claimed a change the diff did not contain.
    - The record 2026-09-11T131518Z-claude-code-b90a9c.yaml said the generic supportive-therapy treatment had been replaced with named physical therapy and occupational therapy entries, and listed treatments among the sections touched. It had not been. The treatments block was unchanged from the first commit: one Supportive Care (NCIT:C15747) entry plus genetic counselling. The reviewer found this and is right; I verified it independently before acting.
    - Remedy taken: corrected the record rather than adding the treatments. The reviewer mildly preferred adding them, and I would normally follow that, but none of the references this entry cites states that physical or occupational therapy is used in this disease. A named treatment here could carry no exact-quote evidence, so adding one would mean either an unevidenced claim or a manufactured snippet. That is the same reasoning as the gnomAD refusal the reviewer accepted in round 1, applied to a treatment rather than a number.
    - The false bullet is gone, treatments is removed from the sections list, and the item now appears under NOT TAKEN with the reason. Editing a committed record is the narrow exception to append-only: the record stated something untrue about what happened, so leaving it and appending a correction would leave a future curator to discover the contradiction. The amendment is disclosed here so the change itself is on the record.

    SUGGESTION TAKEN.
    - GO:0042552 myelination to GO:0022010 central nervous system myelination, DECREASED, on Deficient CNS Myelination. The node is CNS-specific by name and the disease is CNS-restricted, and this is what the cns_myelin_failure module binds at the node this entry conforms to, so the child term matches both the claim and the conformance target. Already present in cache/go/terms.csv.

    What this round did not change: no evidence was added, removed or re-graded, and the snippet count is unchanged at 43/43.

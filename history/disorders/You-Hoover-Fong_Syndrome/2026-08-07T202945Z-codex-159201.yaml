  summary: 'Publication-readiness review: You-Hoover-Fong syndrome'
  details: |
    Independently audited identity, inheritance, prevalence, mechanism, phenotype scope and frequency, imaging, genetics, differential diagnosis, management, and explicit knowledge gaps against primary and authoritative evidence. Corrected the mechanism to demonstrated TELO2 and TTT-complex destabilization while preserving the reported normal PIKK assay boundary. Added exact Albokhari 2023 combined-cohort counts and corrected frequency arithmetic for developmental delay, intellectual disability, microcephaly, tone, feeding problems, failure to thrive, autistic features, strabismus, and supported brain-MRI findings. Recorded Table 3 monitoring suggestions explicitly as author opinion rather than guideline or outcome evidence. Removed unsupported progression, episodic movement, generalized regression, diagnostic, and nonsense-mediated-decay claims. Added PMID:41553761 for the single seizure-associated DEE/LGS regression case without generalizing that course to YHFS. Scoped schema, term, reference, and compliance validation passed; repository-wide graph validation still reports 73 pre-existing errors in unrelated entries, and YHFS is not among them. The cache audit verified 28 of 40 snippets and skipped 12 DOI-prefixed Albokhari full-text excerpts by validator policy; those table rows were checked exactly against the primary accepted manuscript.

  summary: 'Create: Platelet-type bleeding disorder 8 (MONDO:0012354, P2RY12)'
  details: |
    Curated BDPLT8 as a signalling-arm conformer of primary_hemostatic_plug_failure, entered at the agonist receptor. Stub deleted. It does not conform to the aggregation arm - alphaIIbbeta3 is normal and the aggregation abnormality is a downstream read-out, which is exactly the inference the module's guidance on that arm warns against.

    The drug relationship is the substance of this entry: the disorder is the congenital form of what clopidogrel, prasugrel and ticagrelor do pharmacologically. That makes it unusually well characterized mechanistically for something with a handful of reported patients, but it also means most human evidence about P2Y12 blockade comes from treated cardiovascular patients rather than from these families. Where a claim rests on the drug literature rather than on the congenital patients it is stated as such (the plug-formation node's evidence, and the acquired-phenocopy differential), and the unresolved discrepancy between them is curated as an explicit KNOWLEDGE_GAP - why lifelong congenital loss is only mildly to moderately haemorrhagic when acute pharmacological blockade measurably increases major bleeding - rather than smoothed over. That question is not academic: it determines whether these patients can be counselled from the much larger antiplatelet-trial evidence base.

    Two allele classes are distinguished in the trigger node and the gene block, because a quantitative receptor-expression assay would miss the second: frameshift/truncating variants abolishing the receptor, and missense variants (p.Arg256Gln in TM6, p.Arg265Trp in EL3) that traffic normally to the surface but fail to signal.

    Naming note recorded in-file: MONDO:0012354 carries the synonym 'bleeding disorder due to P2Rx1 defect, somatic', which is a synonym-level conflation of a different receptor (P2X1). It is not curated as a synonym of this entry; P2X1 and P2Y1 defects are curated as differential diagnoses instead.

    No prevalence record: small reported literature, no published denominator.


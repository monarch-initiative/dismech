  details: |
    # Evidence review — Crohn_Disease.yaml

    ## Stats
    - Evidence items checked: 153 (`reference:` blocks across the whole file)
    - Distinct references read from `references_cache/`: 116 (all present; no missing cache files)
    - Snippets mechanically verified against cache: 153/153 (`count-verified-snippets`, batched run reported 171/171 across all three assigned files)
    - Verified clean (snippet exact, on-claim, grade and source honest): 142
    - Items with a finding below: 11 (1 fixed, 10 reported only)

    ## Findings

    1. **pathophysiology → Paneth Cell Autophagy Impairment, line 294** — `PMID:18849966` (Cadwell et al., Nature 2008).
       Problem: `evidence_source` was absent, so the item defaulted to HUMAN_CLINICAL. The quoted sentence ("ATG16L1- and ATG5-deficient Paneth cells exhibited notable abnormalities in the granule exocytosis pathway") reports the *mouse* hypomorph result; the human patient-tissue observation in the same paper is a separate sentence about ATG16L1 risk-allele homozygotes. Per CLAUDE.md, `evidence_source` classifies what the quoted sentence reports.
       Severity: DEFECT.
       ACTION: **fixed** — added `evidence_source: MODEL_ORGANISM`. The snippet occurs only once in the file, so no `check-snippet-grading` divergence is introduced (verified: the check passes with no new divergences).

    2. **has_subtypes → Colonic Crohn's Disease, line 45** — `PMID:33278326` ("Effect of Crohn's Disease on Villous Length and CYP3A4 Expression in the Pediatric Small Intestine").
       Problem: the snippet ("Changes in absorptive capacity and first-pass metabolism in the small intestine affect oral drug bioavailability.") is the paper's opening background sentence about PBPK/drug bioavailability. It says nothing about the colon or about skip lesions — the claim it is attached to. The `explanation` concedes as much ("does not refute colonic involvement"), which is absence of contradiction, not support. Graded PARTIAL.
       Severity: DEFECT.
       ACTION: **reported only** — I read the full cached abstract; it is entirely duodenum/terminal-ileum and CYP3A4, so no better exact quote from this same reference can support a colonic-subtype claim. Fixing would require removing the evidence item or substituting a different paper, both outside the conservative fix policy.

    3. **has_subtypes → Colonic Crohn's Disease, line 40** — `PMID:26906301` ("Terminal Ileitis as a Feature of Henoch-Schönlein Purpura Masquerading as Crohn Disease in Adults").
       Problem: the paper is about Henoch-Schönlein purpura, and the quoted sentence is about *terminal ileitis* being pathognomonic for Crohn disease. It is attached to the **colonic** subtype, whose defining feature is colonic rather than ileal involvement — the quote points the opposite way. Graded PARTIAL with an explanation that mostly restates the mismatch.
       Severity: DEFECT (misattached snippet; a mild Named-Entity-adjacency case — right disease named, wrong anatomical claim).
       ACTION: **reported only** — the cached abstract has no colonic Crohn sentence available as a replacement.

    4. **has_subtypes → Colonic Crohn's Disease, line 50** — `PMID:28379745`.
       Problem: graded `NO_EVIDENCE`, but the `explanation` argues the opposite ("thereby supporting the subtype"). The quote is about small-bowel involvement being missed at ileocolonoscopy, which does not establish colon-limited disease. The grade is the honest one; the explanation contradicts it.
       Severity: MINOR.
       ACTION: **reported only** — the same explanation-vs-grade tension recurs at line 576 (`PMID:33836648`, Abdominal Pain, `NO_EVIDENCE` + "indirectly supporting that abdominal pain is a frequent symptom"). Both are prose-only defects; rewriting the explanations is a judgement call I preferred to surface rather than make unilaterally, since neither changes what the entry asserts.

    5. **prevalence → Global 200–300 per 100,000, line 94** — `PMID:38437854` (Lancet 2024 seminar).
       Problem: the snippet ("Crohn's disease is a chronic inflammatory disease of the gastrointestinal tract that might lead to progressive bowel damage and disability.") carries no occurrence figure at all, yet is graded SUPPORT for a specific `rate_low: 200.0` / `rate_high: 300.0` band. The `explanation` ("confirms Crohn's disease as a prevalent chronic condition") is overreach: "chronic" is not "prevalent". Per `docs/frequency-evidence-guidelines.md` logic, a rate band needs evidence for the band.
       Severity: DEFECT (overreach on a quantitative claim).
       ACTION: **reported only** — I read the full cached abstract; it contains no prevalence or incidence number, so no exact quote from this reference can support the band. The companion item at line 99 (`PMID:37137806`, "crude prevalence of IBD increased by 47%") is honestly graded PARTIAL and is the entry's only real epidemiological support, and it is IBD-wide rather than Crohn-specific.

    6. **progression → Onset, age_range 15-35, lines 108–127** — four references (`PMID:33587489`, `PMID:37384664`, `PMID:37266570`, `PMID:28051217`).
       Problem: none of the four supports an onset age range. They are about *progression* predictors, and the explanations say so honestly (one is graded REFUTE, one NO_EVIDENCE, two PARTIAL with explicit caveats such as "the exact age range of 15-35 is not specifically discussed"). The individual grades are defensible; the section-level result is that `age_range: 15-35` is asserted with zero supporting evidence.
       Severity: NOTE.
       ACTION: **reported only** — no single item is wrong; the gap is structural and would need a new reference, which the fix policy excludes.

    7. **environmental → Smoking, line 1387** — `PMID:28838409` ("Epidemiology, Natural History, and Risk Stratification of Crohn's Disease").
       Problem: the snippet ("Understanding the potential environmental risk factors and natural history of CD in a given patient guides the physician when counseling the patient and selecting a treatment strategy.") never mentions smoking. Graded SUPPORT with the explanation "The review discusses smoking as an important environmental risk factor" — an assertion about the paper's body, not about the quoted sentence.
       Severity: DEFECT (overreach; explanation claims more than the quote).
       ACTION: **reported only** — the cached record is abstract-only and the word "smoking" does not appear anywhere in it, so no replacement quote exists in this reference. Note the surrounding Smoking block is otherwise well evidenced (`PMID:38238335` genome-wide association, `PMID:33159156` Mendelian randomization, `PMID:31014995` umbrella review), so this item is redundant rather than load-bearing.

    8. **environmental → Stress, line 1453** — `PMID:31574072` ("Disease-Related Worries in Persons With Crohn Disease").
       Problem: **direction mismatch.** The claim is "Stress can trigger flare-ups and worsen symptoms" (stress → disease). The quoted qualitative-interview finding is that the disease's unpredictable course and loss of bowel control *created* feelings of stress (disease → stress). Graded SUPPORT.
       Severity: DEFECT.
       ACTION: **reported only** — I am confident the SUPPORT grade is wrong, but the correct replacement (`NO_EVIDENCE` vs `PARTIAL`) is a genuine judgement call, and the fix policy says to report when unsure. Worth noting the sibling item (`PMID:15288007`) already grades this exposure `NO_EVIDENCE` with an honest explanation that stress acts "more as a modifier than an inducing factor, and its contribution is more obvious in IBD animal models than human IBD" — so the entry already contains the accurate reading.

    9. **environmental → Diet, line 1421** — `PMID:33574618` ("Fiber-poor Western diets fuel inflammation").
       Problem: the snippet **is the paper title**, graded SUPPORT. The cached record is a Nature Immunology News & Views commentary with no abstract — the title is literally the only quotable text in the cache body.
       Severity: MINOR (grandfathered in `tests/title_snippet_baseline.txt`; `just check-title-snippets` passes).
       ACTION: **reported only** — the `dismech-references` skill's rule for exactly this case is "cite the underlying study or a different source", i.e. the primary paper this piece comments on (Nat Immunol 2021;22:287-300). Adding a new reference is outside the fix policy. The Diet block's substantive support is the adjacent `PMID:34010595`, which is correctly tagged `MODEL_ORGANISM` / PARTIAL with an explanation that explicitly flags it as a mouse result — a good example of the discipline this file mostly keeps.

    10. **biochemical → C-Reactive Protein (CRP), line 1068** — `PMID:36550821`.
        Problem: the snippet ("C-reactive protein, vitamin B12, folate levels were studied along with hemogram analyses.") is a **methods** sentence. It establishes that CRP was measured, not that it was elevated — which is the claim (`presence: Elevated`). Graded SUPPORT.
        Severity: MINOR (overreach; the node is well supported by the two preceding items).
        ACTION: **reported only** — the cached abstract reports B12/folate results but no CRP result, so no better quote exists here.

    11. **genetic → NOD2, line 1132 vs genetic → ATG16L1, line 1163** — `PMID:27076762` (same snippet, same paper, two nodes).
        Problem: the multi-locus genetic-risk-score snippet ("The highest accuracy, AUC of 0.78 was achieved with GRS combining 33 SNPs...") names no gene. It is graded **SUPPORT** under NOD2 and **PARTIAL** under ATG16L1, with the ATG16L1 explanation correctly noting "ATG16L1 is not mentioned explicitly". The same reasoning applies verbatim to NOD2 — the inconsistency is in the grading, not the biology.
        Severity: MINOR. (`supports` is deliberately claim-relative and not gated by `check-snippet-grading`, so this passes CI; it is an internal-consistency defect.)
        ACTION: **reported only** — NOD2 is otherwise supported by nine strong, on-claim references (`PMID:11385577` frameshift 3020insC, `PMID:16773683`, `PMID:12851870`, `PMID:16987083`), so this item is redundant; the honest grade would be PARTIAL to match its twin.

    ### Also noted (no action, not defects)
    - **Unevidenced nodes.** Five pathophysiology nodes carry no `evidence:` at all: Antimicrobial Defense Deficiency, Fibrosis and Stricture Formation, TL1A-Mediated T Cell Activation, Myeloid Cell Recruitment to Perianal Tissue, Myeloid-Stromal Cell Crosstalk. Three treatments are likewise unevidenced (Anti-IL-23 Biologics, TL1A Inhibitors, JAK Inhibitors), as are two phenotypes (Dehydration, Transmural Inflammation) and eighteen GWAS `genetic:` entries. Schema-legal, but the perianal fistula sub-graph (TL1A → myeloid recruitment → myeloid-stromal crosstalk → Perianal Disease) is the largest fully unevidenced causal chain in the file.
    - **`PMID:21543977` (line 240, lymphatic system) under Dysregulated Immune Response** is tangential — the quote is about lymphangitis and lymph drainage, not immune attack on the GI tract. Graded SUPPORT; the explanation is candid about the stretch. Borderline, left alone.
    - **`PMID:38326222` (line 1048, Perianal abscess)** quotes an unbalanced fragment, `"perianal skin complications (i.e., skin tags, fistula, and abscesses"`. It verifies as an exact substring and does name abscesses, so it is adequate, but it reads as a truncation.
    - **Model-linked and hypothesis evidence is the strongest material in the file.** The `mechanistic_hypotheses` PGS×context block, the `experimental_models` entries (`PMID:29094594`, `PMID:40095977`, `PMID:39701210`), and the creeping-fat organ-on-chip experiment (`PMID:40967215`, correctly split HUMAN_CLINICAL / MODEL_ORGANISM across the human-stricture and mouse-fibroblast sentences) all quote result sentences, grade PARTIAL where the model is not Crohn-specific, and tag `evidence_source` correctly. These sections need no changes.
    - **`PMID:39514635` (Macrophage LRRK2)** is a model case of doing this right: the same paper is cited twice on one node with two *different* sentences, one MODEL_ORGANISM and one HUMAN_CLINICAL, matching what each sentence reports.

    ## Sections reviewed
    has_subtypes, inheritance, prevalence, progression, mechanistic_hypotheses, pathophysiology, phenotypes, biochemical, genetic, environmental (incl. `influences_mechanisms` link-level evidence), treatments, discussions (incl. `proposed_experiments` evidence), experimental_models (incl. `findings` evidence), computational_models, classifications, datasets

    ## Verdict
    Evidence quality is good overall and unusually disciplined in the recently curated sections — the environmental `influences_mechanisms` links, the model entries, and the LRRK2/creeping-fat items quote result sentences, grade honestly, and split `evidence_source` per sentence. The weak stratum is the older bulk-curated material, where several items pair a topic-shaped or methods-section quote with a SUPPORT grade and an `explanation` that asserts what the quote does not say (findings 5, 7, 10) or attach a small-bowel/HSP quote to a colonic claim (findings 2, 3). One genuine direction mismatch (finding 8, stress) and one `evidence_source` error (finding 1, fixed) were the substantive defects; the rest are overreach in prose rather than fabrication, and no snippet was found that fails to appear in its cached source.

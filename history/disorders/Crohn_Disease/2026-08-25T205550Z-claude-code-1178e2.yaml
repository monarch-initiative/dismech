  summary: Add cuproptosis evidence-hierarchy knowledge gap (#8397)
  details: |
    Answers monarch-initiative/dismech#8397, which asked whether the cuproptosis evidence-hierarchy gap recorded on Systemic_Lupus_Erythematosus, Rheumatoid_Arthritis and Ankylosing_Spondylitis in #8326 should also be carried by Crohn_Disease and Ulcerative_Colitis. The issue offered three options and named option 3 (find CD/UC-specific literature) as strongest but unchecked. A PubMed sweep found that CD/UC-specific cuproptosis literature does exist, so the specificity objection that kept the gap off both entries dissolves; the answer taken is option 3 feeding option 1. Adds discussion gap_crohn_cuproptosis_evidence_hierarchy (kind KNOWLEDGE_GAP) attached to pathophysiology#Intestinal Barrier Dysfunction and pathophysiology#Dysregulated Immune Response, with one proposed experiment. No cuproptosis pathophysiology node was added: the two CD-specific studies are both bioinformatic and disagree on the direction of the signature (PMID:36466876 reports cuproptosis genes down in 437 CD samples, PMID:41232892 reports four markers up), neither tests any of the five canonical criteria, and the functional chelator-rescue work is in DSS and TNBS colitis models that speak to Ulcerative_Colitis rather than to transmural ileal Crohn disease. The five-part canonical bar from PMID:42435071 is carried over verbatim in the decision_criterion so it stays comparable with the four sibling entries. Validation: schema validation passes (the single reported reference issue on metabolomics_workbench:ST000899 is pre-existing on main, confirmed by re-running the validator on a clean tree), term validation passes, 160/160 snippets verified against cached references, duplicate-key / folded-hyphen / snippet-length / title-snippet checks clean, and the entity-ref foreign-key test suite passes.

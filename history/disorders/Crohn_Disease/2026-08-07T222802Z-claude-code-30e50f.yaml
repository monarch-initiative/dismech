  summary: Link smoking and Western diet; move a mis-filed item
  details: |
    Backfill for issue #8085. Smoking is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the dysregulated immune response node, with both evidence items at supports PARTIAL because the sentences available report disease risk and disease course rather than any immune measurement. Diet is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES into the Paneth cell autophagy impairment node, which is an unusually exact node-level match: the cited study shows four weeks of Western diet producing Paneth cell dysfunction, and names microbiome alteration with farnesoid X receptor and type I interferon signalling as the route. That item is tagged MODEL_ORGANISM and graded PARTIAL, because it is mouse work and should not stand alone behind a human claim; the pre-existing sibling quoting the same mouse snippet carried no evidence_source at all and so defaulted to HUMAN_CLINICAL, which is wrong for that paper; it is now tagged MODEL_ORGANISM and graded PARTIAL to match, and its explanation no longer calls a mouse result a direct mechanistic link. One evidence item was moved rather than left in place: a Mendelian randomization result reporting an odds ratio for smoking sat under the Diet exposure, with an explanation conceding it was about lifestyle factors generally. It now sits under Smoking, where the odds ratio it reports belongs, and its explanation names what it actually measures. This is the same defect and the same disposition as the mis-filed Otomycosis item in PR #8154. Stress was deliberately left unlinked. Its two evidence items point opposite ways: one is graded NO_EVIDENCE and states that stress acts as a modifier rather than an inducing factor with the effect clearer in animal models than in human disease, and the other documents worry caused by living with the disease, which is the reverse arrow from the one a pathograph link would draw. Neither supports an exposure-to-node claim. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 153 of 153 verified.

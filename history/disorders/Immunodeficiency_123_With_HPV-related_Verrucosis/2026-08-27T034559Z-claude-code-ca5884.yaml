  summary: 'Create: Immunodeficiency 123 with HPV-related verrucosis (CD28 deficiency)'
  details: |
    De novo creation of the IMD123 (CD28 deficiency) entry from the stub
    stubs/Immunodeficiency_123_With_HPV-related_Verrucosis.yaml, closing issue #9576.

    Entry-type decision: Disease. `runoak -i sqlite:obo:mondo info MONDO:0971177 -O
    obo` returns a leaf term with an OMIM:620901 xref and NO RO:0004003 causal gene -
    the stub's `genes:` list is empty because MONDO records none for this recently
    minted term, not because the gene is unknown.

    Gene identification (the stub could not supply it): the MONDO term's MEDGEN xref
    (1855052) returns `<Gene gene_id="940" chromosome="2" cytogen_loc="2q33.2">CD28
    </Gene>` and a `<Cytogenetic>2q33.2</Cytogenetic>` element, plus an OMIM-sourced
    definition describing the HPV2 tree-man / HPV4 stable-wart split, absence of other
    infections, normal leukocytes and immunoglobulins, and CMV/EBV viremia without
    clinical manifestations - which matches Beziat et al. 2021 (PMID:34214472)
    sentence for sentence. Confirmed against the primary report, which names the
    homozygous CD28 allele c.52G>A p.(Gly18Arg).

    Curated from primary literature: PMID:34214472 (Beziat 2021 Cell, the defining
    paper), PMID:34242561 (the accompanying Cell preview), PMID:34843682 (the
    phenotypic-spectrum review carrying the allele, the lesion description, the
    vaccine and transplant treatment statements, and the typical-versus-atypical EV
    distinction), PMID:36014978 (HPV skin phenotypes in inborn errors of immunity),
    PMID:36515678 (the CARMIL2 differential), PMID:41805718 (the 2026 CD28-knockout
    mouse study).

    Mechanism model: 9 pathophysiology nodes, 9 edges, one root, no unreachable node.
    Biallelic CD28 loss of function -> absent surface CD28 -> loss of co-stimulatory
    signalling (the branch point) -> failed HPV-reactive CD4+ T cell response ->
    uncontrolled cutaneous HPV replication in keratinocytes, dividing into the
    HPV-4 recalcitrant-wart and HPV-2 tree-man branches. Subclinical herpesvirus
    viremia and the reduced vaccine antibody response hang off the co-stimulation
    node as siblings of the skin disease rather than as steps toward it, because they
    are laboratory findings that do not produce illness in these patients.

    DEEP RESEARCH DISCARDED - NAMED ENTITY CONFUSION. `just research-disorder falcon`
    was run. `just preflight-dr` returned SKIP (MONDO records no causal gene, so the
    automated gene check cannot discriminate) with a warning line reading
    `top genes: CD4=82, LCK=6, ZAP70=3`. The manual fallback confirmed NEC: the
    report is about inherited CD4 deficiency (Guerin et al. 2024 JEM,
    DOI 10.1084/jem.20231044), which is Immunodeficiency 79 - OMIM 619238, CD4 at
    12p13.31, MedGen 1783683 - a different numbered immunodeficiency that also
    presents with recalcitrant HPV warts. IMD123 is OMIM 620901, CD28, 2q33.2. The
    phenotypes differ decisively: IMD79/CD4 patients are also susceptible to
    Tropheryma whipplei, tuberculosis, and respiratory, enteric and fungal
    infections, whereas the IMD123 definition states that patients do not show
    susceptibility to other infections. The report mentions CD28 exactly once, cites
    no PMIDs, and its own reference validation passed with 2/2 on topic - the
    citations are real and internally consistent, which is exactly why NEC is not
    catchable by snippet or identifier checks.

    The report files were deleted and are NOT committed, per the rule that a
    wrong-entity file in research/ misleads the next curator and falsely registers
    provider coverage. Nothing from it reached the YAML; the entry was written from
    MedGen/OMIM plus primary literature before the report finished.

    Deliberately not curated: no `classifications.iuis_category` - recorded as an
    entry-level `notes:` block instead. CD28 deficiency's IUIS table placement is not
    inferable from the mechanism (pathogen-restricted susceptibility is the Table 6
    pattern, but the lesion is in T cell co-stimulation, which is adaptive, and the
    KB's own Table 6 grouping describes its members as leaving the adaptive
    compartment broadly intact), and the IUIS 2024 update cached here does not carry
    its classification tables in retrievable text. No conformance to
    kb/modules/viral_oncogenesis.yaml on the tree-man node: the lesion is described as
    benign, the HPV types are low-risk, and the cited review says explicitly that
    whether such lesions have malignant potential is unclear. No phenotype frequency
    bands anywhere - the denominator is three patients in one family.

    One transcription note: the cached title of PMID:34214472 contains a
    non-breaking space (U+00A0) in "T cell". The entry uses an ordinary space in
    `reference_title` and `references[].title`; linkml-reference-validator normalizes
    the difference and accepts it.


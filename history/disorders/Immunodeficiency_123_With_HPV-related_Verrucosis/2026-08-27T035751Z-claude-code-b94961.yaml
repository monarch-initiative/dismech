  summary: 'Self-audit: separate OMIM-only laboratory facts from cited prose'
  details: |
    Self-audit of the IMD123 entry before review, on PR #9596. No reviewer feedback
    had arrived; these are corrections I found by re-reading my own descriptions
    against the cached sources.

    Four description claims turned out to be sourced from the OMIM clinical
    description (OMIM 620901, read through MedGen C5935639 / uid 1855052) rather than
    from any cited publication: that peripheral blood leukocytes and immunoglobulins
    are essentially normal (asserted in the top-level description, the Reduced
    Antibody Response to Vaccination node, and the diagnosis section), and that the
    warts begin in the first decade of life (the Cutaneous Warts phenotype). OMIM is
    not a citable reference type for linkml-reference-validator, so neither claim can
    carry a verifiable snippet, and sitting beside sourced sentences they read as
    though they came from the cited papers.

    Both were moved into the entry-level `notes:` block with their provenance named,
    together with the four MedGen HPO terms that are likewise not curated for want of
    a citable source (HP:0032301 genital warts, HP:0032163 molluscum contagiosum,
    HP:0550004 verruca plana, HP:0000403 recurrent otitis media). The descriptions
    were rewritten to state only what the cited papers state.

    While doing this, the sentence that properly supports "otherwise healthy" was
    found in the PMID:34843682 full text and added as evidence on the Subclinical
    Herpesvirus Viremia node, which had been leaning on the Beziat paper's title for
    that claim.

    Two further editorial sentences were tied back to sources in a second pass: the
    top-level description's "textbook immunology predicts a broad combined
    immunodeficiency" was my framing and now cites the two-signal model plus the
    paper's own characterization of the result as surprising; and the genetic note's
    advice about interpreting flow cytometry was unsourced clinical guidance, replaced
    with the fact underneath it (the revertant memory CD4+ T cell population does
    carry detectable CD28, so surface staining is not uniformly negative).

    Validation actually run and read after each change:
      just validate <file>                                -> passed, "Snippets checked: 45/45 verified against cached references"
      scripts/check_snippet_length.py --against-ref origin/main -> OK
      scripts/check_folded_hyphens.py --check             -> OK
      just check-title-snippets                           -> OK
      just check-duplicate-keys <file>                    -> OK
    No cache rows were added or removed.

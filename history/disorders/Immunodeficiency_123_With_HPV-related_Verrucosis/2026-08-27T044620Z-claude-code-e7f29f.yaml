  summary: 'Review round 1: correct a MedGen CUI copied from another disease'
  details: |
    Review round 1 on PR #9596. The single blocking finding addressed.

    IMPORTANT - the entry cited two different MedGen records for the same concept.
    The gene attribution is this entry's central identity decision, because MONDO
    records no RO:0004003 gene for MONDO:0971177, and the provenance was stated three
    times in disagreement: C3888310 in the mapping justification and in the genetic
    notes, C5935639 / uid 1855052 in the entry notes.

    C3888310 was verified and is not a real alternative record for this concept. It
    is the UMLS CUI of MONDO:0013365, autosomal recessive nonsyndromic hearing loss
    83 - a different disease I decided on in the same batch of claims (issue #9582,
    PR #9591). It is an identifier copied across from an adjacent piece of work and
    written into curated prose without being looked up, which is precisely the
    failure mode the reviewer named. Confirmed by two independent queries: esummary
    on medgen uid 1855052 returns conceptid C5935639 with title "Immunodeficiency 123
    with HPV-related verrucosis"; an esearch for C3888310[ConceptId] returns uid
    854856, "Autosomal recessive nonsyndromic hearing loss 83".

    All three sites now name uid 1855052 / CUI C5935639, matching what both history
    records for this entry say and what the creation record quotes as the XML it
    actually read. The mapping justification additionally names the MEDGEN:1855052
    xref that MONDO itself carries, so the chain from the MONDO term to the gene is
    traceable without leaving the entry, and both the mapping justification and the
    genetic notes now quote the AssociatedGenes element rather than paraphrasing it.

    Validation actually run and read after the change:
      just validate <file>                                -> passed, "Snippets checked: 45/45 verified against cached references"
      scripts/check_folded_hyphens.py --check             -> OK
    No evidence blocks were touched; the correction is to prose provenance only, and
    no cache rows changed.

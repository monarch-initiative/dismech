  summary: Evidence the FGFR2 p.Ser351Cys / Pfeiffer overlap on the entity-status
    gap (#9436)
  details: |
    Issue #9436 asked whether three correspondence PMIDs central to the Antley-Bixler nosology dispute (PMID:10076886, PMID:10076887, PMID:11430730) could be obtained as abstracts and added to gap_abs_fgfr2_distinct_entity_status. They cannot: all three are Letter/Comment publication types with no abstract in Europe PMC and no PMC/open-access copy, so re-fetching will never make them quotable. That is now recorded in notes so a future curator does not retry it. The half of the gap that WAS assertable, however, had been carried in prose with no citation at all: 'the same FGFR2 p.Ser351Cys allele is reported in severe Pfeiffer syndrome, so genotype does not discriminate'. Four evidence items now substantiate it from three newly cached references - PMID:8946174 (Pulleyn 1996, the allele's first description, in a craniosynostosis-spectrum series two years before the Antley-Bixler report), PMID:9714439 (Gripp/Zackai 1998, assigning p.Ser351Cys to Pfeiffer syndrome type III; the same authors as the PMID:10076887 rebuttal, so this abstract carries the substance of the position that letter cannot be quoted for), and PMID:34909104 (Danso 2021, a molecularly confirmed carrier diagnosed as Pfeiffer type 3). A fourth item quotes the elbow-ankylosis phenotype in the Gripp patient, marked INDIRECT, because it bears on exp_abs_humeroradial_synostosis_specificity: the joint fusion that defines Antley-Bixler syndrome is present in a p.Ser351Cys carrier labelled Pfeiffer. Prose in description, the gap rationale and notes updated to cite the papers instead of asserting the claim. No pathophysiology, phenotype, term binding or grouping membership was touched, and the gap remains OPEN - the entity dispute is not resolved here, only evidenced. Validated with just validate (25/25 snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

  summary: 'Create: Antley-Bixler Syndrome, FGFR2-Related (MONDO:0020667); closes
    the FGFR grouping''s last seat'
  details: |
    Curated de novo from primary literature, completing the FGFR-Related Skeletal Dysplasias grouping. 3 pathophysiology nodes, 6 phenotypes, 1 treatment, 2 discussions, 21 evidence items; added as the 15th member (check-groupings: 15/15 SATISFIED, no candidates).

    Two hazards were confirmed before curating, and both are recorded in the entry rather than left for the next curator.

    NAMED ENTITY CONFUSION (predicted in the stub, and real). A PubMed sweep of 93 title hits for "Antley-Bixler syndrome" returns an overwhelmingly POR (cytochrome P450 oxidoreductase) literature - congenital adrenal hyperplasia, disordered steroidogenesis, ambiguous genitalia - which is MONDO:0008726, a different disorder with no FGFR lesion. The entry is therefore scoped by GENOTYPE, not by name. Where a quoted snippet describes ABS as a whole and so mentions impaired steroidogenesis, the explanation says so explicitly and no steroidogenic phenotype is curated here.

    ENTITY STATUS IS DISPUTED - this was not anticipated and changed what the entry claims. The first FGFR2 case (Chun 1998, PMID:9605588) drew two published rebuttals: "Patient described by Chun et al. may not present Antley-Bixler syndrome" (PMID:10076886) and "Not Antley-Bixler syndrome" (PMID:10076887). Cragun et al. (PMID:16145814) concluded ABS without disordered steroidogenesis "appears to be a variant of the autosomal dominant fibroblast growth factor receptor (FGFR)-related craniosynostosis syndromes", and argued the ABS name should be reserved for the POR form - the opposite of the convention MONDO:0020667 encodes. The same FGFR2 p.Ser351Cys allele is reported in severe Pfeiffer syndrome, so genotype does not discriminate either. Curated because MONDO maintains the class and the mechanism is well defined, but independence is recorded as open in gap_abs_fgfr2_distinct_entity_status rather than asserted.

    GROUPING MEMBERSHIP was checked on mechanism before asserting, following the bent bone dysplasia correction (#9384). p.Ser351Cys creates an unpaired cysteine in the IgIII domain giving ligand-independent disulfide-mediated dimerization - genuine constitutive activation, the grouping's criterion, and the same activation class as Beare-Stevenson p.Tyr375Cys. Bent bone dysplasia's transmembrane alleles instead REDUCE membrane receptor and FGF responsiveness, which is why it is excluded. Same gene, opposite receptor behaviour, opposite membership. The nosology dispute does not touch the mechanism, so a future lump into Pfeiffer would not remove it from the grouping - noted in the entry.

    Discussions: gap_abs_fgfr2_distinct_entity_status (entity status) and gap_abs_two_disorders_one_name (a curation-practice gap on representing split eponyms, with the NEC preflight named as the relevant tooling).

    Evidence discipline: no frequency bands - small case literature additionally contaminated by the two-disorder problem, so name-derived counts overstate this entry. Three sources central to the dispute (PMID:10076886, PMID:10076887, PMID:11430730) cache with content_type unavailable and are cited in attributed prose only, never quoted; noted for future addition if cached. One snippet initially failed the reference validator because [MIM207410] is stripped by the bracket rule - re-quoted starting after the bracket rather than paraphrased.

    Validation: just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 21/21 verified; check-groupings 15/15 SATISFIED; check-stubs and check-duplicate-keys clean. Stub deleted.

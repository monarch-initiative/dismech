  summary: Review FGFR2-related Antley-Bixler evidence, clinical scope and care
  details: |
    Reviewed the entire existing disorder, original cited abstracts and actual cached full scientific bodies. Fresh parsed history showed CREATE/EDIT only; all 164 open PRs and their fully paginated changed-file lists plus 79 claim issues were checked before reservation. No matching deep-research artifact was found. The full FGFR craniosynostosis GeneReviews chapter was recovered and consumed for clinical characteristics, diagnosis, management/surveillance and genetic counseling. The 2005 mixed ABS cohort was regenerated as actual full text with tables. The craniosynostosis guideline was read in its methodology and respiratory chapter, including limitations; unrelated guideline chapters are not claimed as consumed.

    Replaced three bundled or overconfident mechanism nodes with nine events. S351C creates a cysteine and has a predicted disulfide-activation mechanism, but PMID9539778 did not test it. Native full-length COS1 receptor dimerization/kinase assays are distinguished from NIH3T3 FGFR2/Neu transformation, and the telokin homology model is not a mutant crystal structure. The tissue differentiation bridge remains provisional. Joint fusion is not assumed to share a directly measured suture pathway. All clinical graph links preserve unresolved intermediates where appropriate.

    Expanded six findings to 27 with genotype-specific scope. Elbow ankylosis, radioulnar fusion and non-bony multiple contractures are separate; the pooled RH/RU table and unspecific abstracts do not establish humeroradial anatomy in every case. Added ocular anterior chamber abnormalities, hydrocephalus, respiratory compromise, seizures, developmental delay, sacral appendage, hallux findings, intestinal non-rotation, feeding support and cohort-documented femoral bowing/fracture. Selected ocular cases and reused cohort participants do not yield frequency bands or population prevalence. Neonatal hypoxia/infection and unverified cause of death remain explicit.

    Replaced one generic treatment with ten care records, three diagnostic approaches and two differential diagnoses. Updated annual polysomnography guidance is separated from case-level CPAP use and chronic-mask precautions. Cranial/midface surgery, shunting, ocular protection, feeding, seizure care, developmental support, surveillance and family counseling retain their source populations and clinical aims. Normal genitalia do not exclude POR deficiency; endocrine assessment is a diagnostic precaution, not routine steroid replacement for FGFR2 disease. No disease-specific clinical drug or whole-animal S351C efficacy is asserted.

    Independent full-source peer audit checked the 1998 FGFR2 experiments. Bibliographic-only letters are not quoted. Source defects include the 2005 P276V/F276V inconsistency, the 2021 intron designation for a coding variant, unavailable old Table1 rows and overlapping reports. Generated cache content was never hand-edited; a CAPTCHA from an alternate GeneReviews PDF route was quarantined. Frozen dataset-accession data were not accessed. Validation results and PR review are recorded separately after checks complete.

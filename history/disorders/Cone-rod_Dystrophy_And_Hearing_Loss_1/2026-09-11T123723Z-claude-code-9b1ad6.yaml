  summary: 'Create: Cone-rod dystrophy and hearing loss 1'
  details: |
    De novo curation of CRDHL1 (MONDO:0020778, CEP78) from one openscientist deep-research report plus direct reading of every cited reference.

    SCOPE CHANGE FROM THE CLAIM. The claim (#11674) was filed against MONDO:0014980 'cone-rod dystrophy and hearing loss'. preflight-dr returned SKIP because MONDO records no causal gene for that term, so the manual preflight was run as the skill requires. runoak showed MONDO:0014980 xrefs OMIM phenotypic series OMIMPS:617236 and has exactly two descendants: MONDO:0020778 (CEP78) and MONDO:0020780 (CEP250). dismech already curates the CEP250 member as Cone-rod_Dystrophy_And_Hearing_Loss_2 (PR #9998, merged), so the series term is a two-member grouping with one member already done. This entry is therefore the CEP78 member, bound to MONDO:0020778 and named to match its sibling.

    The queue stub argued for lumping the two into one entry, and the stub is hand-authored by a lump review rather than machine-enriched - which is why it carries no mondo_parents or mondo_descendant_count. The stub's own note anticipates being overridden, recording that the CRDHL2 claim (#9981) would take precedence. It did. The split is the repository's standing decision and this entry follows it; the two entries cross-reference each other as differential diagnoses.

    Mechanism: biallelic CEP78 loss of function -> loss of CEP78 from the distal end of the mature centriole -> elevated CP110 and disordered cilium assembly -> three organ branches (photoreceptor connecting cilium, cochlear hair cell, sperm flagellum). The CP110 step carries a rescue experiment, which is what makes it causal rather than correlative. Conformance to ciliopathy_dysfunction at Basal Body and Transition Zone Dysfunction and Photoreceptor Connecting Cilium Degeneration.

    Evidence discipline: a large share of the quantitative claims are borrowed and marked directness: INDIRECT - the visual prognosis is from a mixed-aetiology cone-rod dystrophy cohort predating CEP78, and the cochlear-implant benefit is from eight Usher type IIa adults. One evidence item is graded NO_EVIDENCE on purpose: the SPAG17 confounder in one of the two infertile men neither supports nor refutes the infertility claim, and with n=2 omitting it would have made the evidence look cleaner than the authors presented it. Two REFUTE items record that neither hearing loss (two teenage siblings with presumed normal hearing) is obligate.

    Errors caught by the gates: three reference_title values were completed from memory after truncated terminal reads and did not match the cached titles (including one that named the wrong gene, CEP78 for a CEP250 paper); corrected programmatically from references_cache frontmatter. One snippet was not an exact substring ('we identified' where the source reads 'and identified'); corrected against the cache.

    Validation: just validate-disorders clean with 32/32 snippets verified; schema, terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, reference-titles all OK; check_conforms_to_module_node_references returns no issues.

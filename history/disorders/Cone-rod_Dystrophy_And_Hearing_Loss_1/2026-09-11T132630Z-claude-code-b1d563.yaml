  summary: 'Review round 1: correct the CP110 ubiquitination direction, add the Cep78
    knockout mouse'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11683. Both blocking items taken plus all four suggestions. Single bundled push.

    BLOCKING 1 - a real scientific error, confirmed against the source. The entry's description derived elevated CP110 from the Hossain ligase pathway, and bound protein ubiquitination with modifier DECREASED. Hossain (PMID:28242748) says the opposite: CEP78 binds EDD-DYRK2-DDB1(VprBP) and inhibits it, and specifically impedes transfer of ubiquitin from EDD to CP110 - so on that model CEP78 loss should increase CP110 ubiquitination and lower CP110. Nielsen (PMID:34259627) has CEP350 recruiting CEP78 which recruits EDD1, predicting the reverse, and observes elevated CP110 in CEP78-null cells. I had fused the two into one causal sentence that neither paper supports.

    Fixed by separating the three claims: the elevated-CP110 observation and the CP110-depletion rescue are common ground and remain the basis of the node; the ubiquitination process now carries no modifier because its direction is exactly what is disputed; the Hossain direction is curated as a supports: REFUTE item scoped against the implied direction rather than against the node; and a new KNOWLEDGE_GAP discussion states what a single experiment measuring CP110 ubiquitination and abundance side by side would settle. The description was rewritten to attribute the CP110 elevation to observation rather than derive it.

    BLOCKING 2 - the Cep78 knockout mouse (PMID:39747485) was cached by the PR and never cited. Added an animal_models section with a RECAPITULATES link to Sperm Flagellar Defect, a sperm morphology/motility readout, and limitations recording that it is a null against a human allelic spectrum that includes missense and structural variants, that knockout males are uniformly sterile while human infertility is variable, and that no retinal or auditory phenotype is reported so the two defining organs remain unmodelled. The author correction (PMID:40075211) has content_type unavailable, so the model notes record that its substance could not be inspected.

    The mouse materially narrows the entry's own male-infertility knowledge gap, so that discussion was rewritten rather than left standing: it supplies the structural lesion the human cohorts could not and is independent of the SPAG17 confounder, so the open question is no longer whether CEP78 can cause a flagellar defect but what fraction of biallelic men are affected and whether allele class predicts it.

    SUGGESTIONS, all taken. Regraded the Nrl-knockout snippet from IN_VITRO to MODEL_ORGANISM and narrowed the quote to the mouse half, since the discriminating comparison is mouse retina. Added PHARC syndrome (MONDO:0012984) and TUBB4B-related sensorineural disease (MONDO:0060650) as differentials. Added CL:0000019 sperm and conforms_to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction on the Sperm Flagellar Defect node. Cited PMID:36315013 for the CEP350 recruitment step.

    Errors caught by the gates during this round: two reference_title values written from memory (PHARC and TUBB4B) did not match the cached titles, and MONDO:0014685 written from memory for the TUBB4B disorder resolved to progressive myoclonic epilepsy type 9. The correct term, MONDO:0060650, was found with runoak. The cache row created by the bad lookup was reverted.

    Validation: just validate-disorders clean with 40/40 snippets verified (up from 32/32); schema, terms, duplicate-keys, entity-refs, causal-targets, enum-values, snippet-grading and reference-titles all OK; all three conforms_to anchors resolve.

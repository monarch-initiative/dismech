  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review (round 2) on PR #11683. One blocking item, single push.

    BLOCKING - the round-1 record claimed a rewrite that was not in the diff.
    - The round-1 history record (2026-09-11T132630Z-claude-code-b1d563.yaml, line 40) said the male-infertility knowledge gap 'was rewritten rather than left standing' to reflect the Cep78 knockout mouse added in the same commit. It was not. The fix commit touched no line of gap_crdhl1_male_infertility_causal_attribution. The reviewer found this and is right; verified independently before acting.
    - The consequence was worse than a stale record. The gap still said 'no clear ultrastructural abnormality was found in the sperm, so there is no structural lesion to anchor the claim', while the animal-model evidence added in the same commit introduces itself as 'The structural lesion the human cohorts could not supply'. The entry contradicted itself across two sections, and the single most relevant piece of evidence went unmentioned in the gap it bears on.
    - Remedy: made the change the record describes, rather than correcting the record. Unlike the equivalent finding on PR #11681, here the record described the right change and the entry was the thing that was wrong: the clause is genuinely falsified by evidence now in the entry.
    - The ultrastructure sentence is now scoped to the two human patients and no longer claims there is no structural lesion anywhere. A new paragraph records that the knockout supplies one in mouse, independently of the SPAG17 confounder since the mouse carries no second-gene variant, and restates what remains open: whether these two men's infertility is CEP78-attributable, what fraction of biallelic men are affected, and whether allele class predicts it. The mouse being a null against a human spectrum including missense and structural alleles, and uniformly sterile against variable human infertility, is stated as the reason it narrows the question without closing it.

    STATUS DELIBERATELY UNCHANGED.
    - The discussion stays OPEN. A mouse knockout does not establish that these two men's infertility is CEP78-caused, and it does not touch the SPAG17 confounder, so the prompt as written is still a live question. The reviewer made the same point independently.

    Validation: 40/40 snippets verified, unchanged - no evidence was added, removed or re-graded this round; schema, terms, entity-refs, causal-targets, duplicate-keys and enum-values all pass.

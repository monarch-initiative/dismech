  summary: 'Create: Overhydrated Hereditary Stomatocytosis'
  details: |
    De-novo curation of overhydrated hereditary stomatocytosis (OHSt, RHAG, MONDO:0008493) from a thin claude_code deep-research report (3 web searches, leads only). Independent PubMed/E-utilities literature work. Backbone PMIDs: 18931342 (Bruce 2009, the two heterozygous RHAG substitutions Ile61Arg/Phe65Ser, 6x oocyte cation leak, Rh50 pore model), 29713289 (Flatt & Bruce 2018 review, most severe leak ~40x, temperature dependence, stomatin secondary, Na,K-ATPase compensation), 21859730 (metabolomics, glycolysis exhausted), 21849667/22012326 (GOF cation conductance + LOF ammonia transport of F65S), 7230721 (splenic sequestration, high Na/low K, osmotic fragility, splenectomy effect), 8639421 (post-splenectomy thromboembolic disease, iron overload), 12560240 (phosphatidylserine exposure, thrombosis), 29559519 (de novo RHAG, clinical picture), 420735 (increased cation pumping, low 2,3-DPG). 15-node atomic pathophysiology chain from the germline RHAG substitution through pore formation, cation leak, net cation gain, compensatory Na/K-ATPase hyperactivity + glycolytic exhaustion, overhydration, stomatocyte shape change, reduced deformability, splenic sequestration and extravascular hemolysis to the phenotypes, plus branch nodes for secondary stomatin deficiency (correlate not cause), iron loading, and prothrombotic membrane state. Conforms to hemolytic_anemia_erythrocyte_destruction module at Reduced Erythrocyte Integrity and Premature Erythrocyte Destruction nodes. 12/12 phenotypes causally connected. Xenopus oocyte experimental model with modeled_mechanisms link (IN_VITRO, BOUNDARY_OMISSION divergence). Validated: just validate-disorders passed (52 snippets, 55 titles, 0 issues); terms, entity-refs, causal-targets, duplicate-keys, block-scalar, coarse-phenotypes, genereviews (NO_CHAPTER, correct), reference-titles all clean. preflight-dr PASS. CI fix: bound GO:0005261 monoatomic cation channel activity (GAIN_OF_FUNCTION) on the RHAG variant node so the gene is grounded, clearing the check-gene-activity-grounding gate (test 3.13). Review round 1 (ai4c-reviewer, changes requested): removed the Cholelithiasis phenotype and its sequela edge (no cached source supports gallstones in OHSt); fixed the Rh-null differential to cite the biallelic-RHAG Rhnull sentence (PMID:29713289) instead of an unrelated ammonium-carrier snippet; swapped MCV and MCHC onto the OHSt-specific macrocytic/low-MCHC sentence (PMID:25976965); moved the supportive-care splenectomy citation off the wrong-disease DHSt review (PMID:31308777) onto PMID:25976965; corrected three evidence_source values (two homology-modelling snippets to COMPUTATIONAL, one patient-genotype snippet to HUMAN_CLINICAL); swapped the 2,3-DPG biochemical snippet onto the sentence that names 2,3-DPG (PMID:420735); added a Pulmonary arterial hypertension phenotype (HP:0002092) downstream of the prothrombotic node and a Splenectomy (contraindicated) treatment entry (NCIT:C15328); added REVIEW_SYNTHESIS quote_role to review-sourced items. 55/55 snippets, 12/12 phenotypes connected, just validate-disorders clean.

  summary: 'Create: Gordon_Syndrome'
  details: |
    Created the Gordon syndrome (distal arthrogryposis type 3, MONDO:0007252) entry and deleted its curation stub. Gene: PIEZO2 (hgnc:26270), heterozygous, with the recurrent c.8057G>A (p.Arg2686His) variant and a fetal nonsense variant of uncertain significance recorded under genetic.variants.

    Pathograph: PIEZO2 gain of function (molecular; node name shared with the Marden-Walker syndrome entry) leads to excess mechanotransduction in proprioceptive sensory neurons (cellular), then tendon shortening and disrupted musculoskeletal development (tissue), then congenital distal joint contractures, which point to the distal arthrogryposis, camptodactyly, clubfoot, large-joint contracture and scoliosis phenotypes. Separate branches from the PIEZO2 node reach an incomplete secondary palate fusion node (cleft palate, bifid uvula), ptosis and Dandy-Walker malformation; these edges rest on genotype-phenotype associations and are marked INDIRECT_UNKNOWN_INTERMEDIATES. The sensory-neuron and tendon nodes are PROVISIONAL because they come from a mouse carrying the DA5 allele E2727del, not the Gordon syndrome variant; that gap is recorded as a HUMAN_MODEL_MISMATCH discussion and as typed divergences on the animal model links. 9 of 18 phenotypes are causally connected; the rest (short stature, high palate, micrognathia, limited mouth opening, pectus excavatum, cryptorchidism, decreased muscle mass, hearing impairment, mild intellectual disability) have no sourced mechanism and are left unconnected.

    Scope: DA5 (MONDO:0007158, open stub) and Marden-Walker syndrome (existing entry) are kept as separate entries and listed as differential diagnoses, as is the recessive PIEZO2 loss-of-function disorder (MONDO:0014941, open stub). Notes record the eponym collision with pseudohypoaldosteronism type 2.

    Deep research: one OpenScientist report (research/Gordon_Syndrome-deep-research-openscientist.md). Reference validation 19/19 resolved, 0 off topic; term validation needs_review with 2 mislabelled terms (MONDO:0007252 and GO:0005886, both formatting artifacts). just preflight-dr returned PASS (PIEZO2 mentioned 66 times, OMIM 114300 matches). Errors found in the report on reading: it gives Orphanet as ORPHA:375 (the record is ORPHA:376), says Orphanet classes prevalence as below 1 in 1,000,000 (the Orphanet record says unknown), reports 10/12 GS families where the source says individuals, and offers CL:0000100 for proprioceptive sensory neuron, which is motor neuron in CL (term validation did not flag it because the report gave no label). None of these were carried into the entry; CL:1001451 (sensory neuron of dorsal root ganglion) is used instead. The report's statement that reduced fetal movement causes the contractures is not supported by its cited sources and was not used.

    Report citations not used: PMID:39147733 and PMID:35586339 (PIEZO2 lipid and cytoskeletal gating, not disease-specific), PMID:36317804 (lethal respiratory DA5, not Gordon syndrome), PMID:41531622 (recessive PIEZO2 duplications), PMID:38349741 (C. elegans DA5 allele; reproductive phenotypes with no Gordon syndrome counterpart). PMID:24878349 (congenital myopathy and malignant hyperthermia in two people with Gordon syndrome) is mentioned in notes only, because the relationship to PIEZO2 is not established. Literature found outside the report: PMID:7258227, 8370149, 458832, 27714920, 37587573, 36588752, 34038001, 11152147, 27607563, 28728825, and the Orphanet record ORPHA:376. PMID:39559612 was read and excluded because it attributes WNK1/WNK4 mutations to a patient with Gordon syndrome, mixing the arthrogryposis with pseudohypoaldosteronism type 2.

    No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validation: just validate passed, 84/84 snippets verified, validate-terms passed, entity refs, causal targets, duplicate keys, enum values, folded hyphens and block-scalar checks clean.

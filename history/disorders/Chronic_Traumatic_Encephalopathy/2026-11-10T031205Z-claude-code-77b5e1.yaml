  summary: Add APOE and TMEM106B modifier genetics to CTE
  details: |
    Added a genetic section, as the review requested, with two MODIFIER records and no gene_disease_validity. APOE (hgnc:613): APOE e4 associated with CTE stage in donors over 65 (PMID:35759276). TMEM106B (hgnc:22407): the rs3173615 minor allele associated with less p-tau, CD68 neuroinflammation and dementia among CTE cases, with no difference in allele frequency from controls (PMID:30390709); the risk genotype associated with higher CTE stage in donors over 65 (PMID:41264095). All three references were fetched with just fetch-reference. The HGNC IDs were looked up in the HGNC REST API. 31/31 snippets verify, validate-terms passes.

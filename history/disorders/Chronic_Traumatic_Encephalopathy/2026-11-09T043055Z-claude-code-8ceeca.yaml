  summary: Add mechanical, vascular and microglial steps to the CTE mechanism, symptom
    frequencies and the neuropathological diagnosis, from a claude_managed deep-research
    report
  details: |
    Source: research/Chronic_Traumatic_Encephalopathy-deep-research-claude_managed.md (deep-research-client claude_managed provider: Opus coordinator, Haiku retrievers, grader-checked outcome; grader satisfied on iteration 1; one DRC evidence-check repair round). Report validation: references 135/135 resolve; ontology terms checked against conf/dr_ontologies.yaml, 0 unresolved (HGNC unverifiable by design). The run's first pass reported 10 unresolved references and 11 unresolved terms; these were a local DNS outage and an HGNC-scoping bug in deep-research-client, both fixed and re-run before use.

    Pathophysiology: the chain ran Repetitive Head Trauma -> perivascular p-tau -> TDP-43 -> neurodegeneration. Added three atomic nodes as branches from the trauma node, each re-joining at the p-tau node: Strain-Induced Neuronal Tau Mislocalization (PMID:33139536, in vitro; reversed by GSK3B/CDK5 inhibition or tau deletion; computational edge evidence for the sulcal-depth correspondence), Microvascular Injury and Blood-Brain Barrier Leakage (PMID:36617181, human post-mortem, n=156), and Microglial Neuroinflammation (PMID:27793189, mediation of RHI effect on p-tau through CD68 microglia). Existing trauma->p-tau edge and its finite-element evidence kept. Added the I-IV staging (PMID:23208308) to the p-tau node and the 85% TDP-43 figure to the TDP-43 node.

    Phenotypes: Cognitive impairment and Atypical behavior set VERY_FREQUENT from Mez 2017 (PMID:28742910; 85%/95% and 96%/89% in mild/severe), with the brain-bank ascertainment caveat in the explanation. Parkinsonism and ALS frequencies not set: no quantitative abstract-level source.

    Diagnosis: added the NINDS-NIBIB neuropathological criterion (PMID:26667418, PMID:36759368).

    Not taken from the report: the CTE-specific tau filament fold, transcriptomic and proteomic profiling, and traumatic encephalopathy syndrome clinical criteria, left for a later pass. All snippets copied from references_cache fetched with just fetch-reference; validate-disorders passed (27 snippets, 30 titles).

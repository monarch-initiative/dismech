  summary: Add impact-strain evidence to the trauma-to-tau edge
  details: |
    The Repetitive Head Trauma to Perivascular Hyperphosphorylated Tau Pathology edge had a description but no evidence. Added PMID:28043957, a finite-element head model study showing that impact strain is greatest at the depths of sulci, where CTE tau pathology is found, graded COMPUTATIONAL and INDIRECT because it is a spatial correspondence rather than a demonstration that strain causes tau aggregation. The edge description now says so. The entry was deliberately not conformed to focal_axonal_injury_wallerian_degeneration: its modelled mechanism is tau and TDP-43 pathology, and none of its nodes describes axonal injury. Validation: just validate passes; 12/12 snippets verify.

    Added a delivery_system block to the Nab-Sirolimus treatment recording delivery_platform: PROTEIN_NANOPARTICLE, previously inexpressible for a SMALL_MOLECULE treatment. Cited the already-referenced AMPECT report (PMID:34637337) with an exact quote naming the albumin-bound formulation, graded OTHER because the sentence describes the drug product rather than reporting a trial result. The quote came from a full-text upgrade the reference fetcher performed on that cache file during validation, so PMID_34637337.md is part of this change; five other cache files it upgraded at the same time were reverted as unrelated churn. No targeting slots: the cited sentence states the gp60 albumin-receptor transcytosis route as a possibility ("may enhance") rather than as established targeting, and notes records that, so the slots can be filled later if it is established. Validated with just validate, just validate-terms, and just check-delivery-system.

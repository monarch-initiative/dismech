  summary: 'Create: Hypertrophic Cardiomyopathy 11 (ACTC1)'
  details: |
    Curated CMH11 (ACTC1, alpha-cardiac actin; MONDO:0012799), a ClinGen-definitive thin-filament HCM gene, conforming to cardiomyopathy_maladaptive_remodeling. Thin-filament mechanism: mutant actin incorporated into the thin filament reduces actin-myosin interaction (beta-myosin ATPase to ~50% of WT). Thin-filament clinical profile (milder hypertrophy, greater diastolic dysfunction/HF progression, comparable arrhythmic risk) preserved. Deleted stub; added to FHCM grouping. All snippets verified; full validation passes.

  summary: Review and enrich Hypertrophic_Cardiomyopathy_11 (ACTC1) with classification evidence, grounded
    pathophysiology and phenotype edges, diagnosis rows, and treatment links.
  details: Added PMID:28912181 evidence to both Harrison's chapter classifications. On the ACTC1 thin-filament
    chain, added molecular functions, left-ventricle locations, actin-filament and Z-disc cellular components
    on the actin-myosin node, evidence on the first two causal edges, and causal edges from the diastolic
    dysfunction, heart failure and arrhythmic-risk node to its phenotypes. Lengthened several snippets
    to full sentences and replaced the class-level 30% snippet on the trigger node with one about ACTC1
    mutation clustering. Added phenotype frequencies and a diagnostic flag, echocardiography and molecular
    genetic testing diagnosis rows, and evidence, target mechanisms and target phenotypes on the ICD
    and heart-failure pharmacotherapy treatments. Added inheritance, variant origin and features to the
    ACTC1 genetic record.

  summary: 'Genetics pass: add FSGS1-9 gene-defined subtypes, APOL1/CD2AP susceptibility,
    wire ten genes'
  details: |
    Genetics pass against the MONDO descendant set of MONDO:0100313 (issue #12250, series-043). The descendant enumeration run via OLS4 on 2026-09-25 found two things a root-keyed comparison misses: the numbered FSGS series hangs off the intermediate MONDO:0005363 rather than off the root, and FSGS3 (CD2AP) and FSGS4 (APOL1) are not descendants of the FSGS root at all -- MONDO files both under inherited disease susceptibility with a predisposes-towards relation. Added seven gene-defined has_subtypes rows for FSGS1, FSGS2, FSGS5, FSGS6, FSGS7, FSGS8 and FSGS9, each with a subtype_term and bound gene, and declared them as children of the existing Genetic FSGS row so the clinicopathologic and gene-defined axes are explicitly related rather than silently mixed. Bound MONDO terms on the Primary FSGS and Genetic FSGS rows. Added genetic records for MYO1E, PAX2, ANLN and CRB2 as CAUSATIVE, APOL1 as RISK_FACTOR and CD2AP as SUSCEPTIBILITY, the last two matching MONDO's own susceptibility modelling and recorded in mappings.mondo_mappings as related rather than narrow matches. Set relationship_type on the two pre-existing ClinGen-sourced records: FAT1 CAUSATIVE (ClinGen Strong) and SYNPO UNKNOWN (ClinGen Limited, which is insufficient evidence rather than refutation). Wired ANLN and MYO1E onto the podocyte-injury node, CRB2 and CD2AP onto the filtration-barrier node, and added two new nodes for the two mechanisms with no existing home: APOL1 risk-variant cation flux and PAX2 transcription factor dysfunction. Ten of the twelve curated genes now reach the pathograph; FAT1 and SYNPO do not, because their only evidence here is a ClinGen validity row that states a classification and not a mechanism. HIV-associated nephropathy is a MONDO descendant of inherited FSGS and was deliberately not given a subtype row. Recorded which claims belong to Renal_Coloboma_Syndrome, Alport_Syndrome, Nail-patella_Syndrome, Denys-Drash_Syndrome and the separate INF2 Charcot-Marie-Tooth concept. Verified: schema, terms, snippets (validate-disorders under linkml-reference-validator 0.3.0rc1, 0 issues), duplicate keys, entity refs, causal targets, enum values, gene-term identity.

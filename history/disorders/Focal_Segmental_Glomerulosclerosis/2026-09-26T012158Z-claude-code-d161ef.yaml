  summary: 'Review round 1: split CD2AP, re-evidence the APOL1 edge'
  details: |
    Two blocking findings on PR 12780. First, the APOL1 to Podocyte Injury and Loss edge cited only the PMID:21997394 case-control odds ratio, which supports the genetic association already cited on the genetic record rather than the mechanistic step the edge asserts. The edge now cites the PMID:38227370 transgenic-podocyte sentence, which reports the cation flux and the podocyte injury and proteinuria together and their joint reversal; evidence_source MODEL_ORGANISM is kept so the copied sentence does not diverge from its other use in this file. Second, the single CD2AP genetic record concluded SUSCEPTIBILITY from a ClinGen Definitive autosomal-recessive classification, which is the opposite conclusion, and its notes described the 2-of-30 heterozygous series as the whole of the human evidence, omitting the homozygous reports. The record is now split. The CAUSATIVE record carries autosomal recessive inheritance and cites PMID:30612599, which identifies a homozygous CD2AP frameshift in three siblings with childhood-onset FSGS and end-stage renal disease and reproduces the disease with the same allele in gene-edited mice. The SUSCEPTIBILITY record keeps the heterozygous claim, the Lancet commentary's own caution, and the ClinGen Moderate autosomal-dominant grade, and adds a REFUTE item from PMID:17713465 recording that both obligate carrier parents of a homozygous patient had normal glomerular filtration and no proteinuria. Neither record takes a has_subtypes row; MONDO:0011917 stays a relatedMatch, and the notes now say explicitly that this is a disagreement with MONDO's modelling of a Definitive recessive relationship as a susceptibility rather than with ClinGen's grade. Both new references were located by a PubMed search and fetched with just fetch-reference; the reviewer named Loewik 2007, which is PMID:17713465.

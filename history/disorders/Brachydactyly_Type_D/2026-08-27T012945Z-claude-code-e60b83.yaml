  summary: 'Create: Brachydactyly Type D'
  details: |
    ISDS group 18 completeness pass. BDD is the one common member of the group - 0.41 to 4.0 percent by population, 3.55 percent in a genotyped Nepali cohort - so two structured prevalence records are curated rather than the CASES_IN_LITERATURE record used for the rare types. The entry is explicit that the HOXD13 attribution carried by the nosology accounts for very few cases and that a genome-wide scan of a combined BDD/BDE phenotype mapped to 7p15 instead; the 7p15 locus is recorded as a separate SUSCEPTIBILITY genetic row with no gene assigned. A REFUTE-tagged snippet records the 2008 review statement that no BDD gene had been identified. Two snippets preserve the cached PDF's hyphenated line breaks; the explanation says so.

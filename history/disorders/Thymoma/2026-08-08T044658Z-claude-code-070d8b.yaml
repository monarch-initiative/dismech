  summary: 'Augment: Thymoma with causal-edge evidence, epidemiology, and checkpoint
    toxicity'
  details: |
    Augmented the existing Thymoma entry. Curated as EDIT not CREATE: the duplicate preflight found Thymoma, Thymic_Carcinoma and Thymic_Neuroendocrine_Carcinoma already present on origin/main. Deep research used the claude_code provider, written to research/Thymoma-deep-research-claude_code.md with 17 web searches and 55 citations, read alongside the pre-existing research/Thymoma-deep-research-manual.md. GeneReviews baseline checked by PubMed esearch: no GeneReviews article exists for thymoma, which is non-Mendelian, so no baseline applied. Added evidence to all 8 previously bare pathophysiology causal edges. Added a new node, Impaired thymic epithelial progenitor differentiation, bridging the GTF2I oncogenic axis to the medulla-poor architecture. Added a new node, Checkpoint-blockade-unmasked immune-related toxicity, capturing the 58.3 versus 17.1 percent grade 3-5 irAE split between thymoma and thymic carcinoma. Added structured prevalence from US and German registry annual incidence, progression covering onset and Masaoka-Koga stage and tumor size, classifications ONCOLOGY_HEMATOLOGY and IMMUNE_RHEUMATOLOGIC, a hypogammaglobulinemia phenotype, an anti-titin antibody biochemical marker, two differential diagnoses, an Immune Checkpoint Blockade treatment carrying an explicit safety caveat, frequency-specific evidence for the myasthenia gravis FREQUENT band at 38 percent in the ITMIG database of 6097 cases, and subtype evidence for types B1 and B2 and encapsulated thymoma. Two discussions recorded: a HUMAN_MODEL_MISMATCH, since the Gtf2i L424H mouse reproduces the epithelial architecture defect but explicitly does not develop autoimmunity, and a KNOWLEDGE_GAP, since better-preserved rather than reduced MHC class II tracks with myasthenia gravis presence, which cuts against a monotonic reading of the reduced-class-II node. Three deep-research errors were caught and not propagated: the report gave MONDO:0006451, which is thymic carcinoma, for thymoma; it gave HGNC:4661, which is GTF2IRD1, for GTF2I; and it labelled HP:0002850 as IgG when the term is IgM. The entry retains the OAK-verified MONDO:0006456 and hgnc:4659. A germ cell tumor MONDO ID that I drafted incorrectly was caught by term validation and replaced with MONDO:0021067. Mass-effect phenotypes of chest pain, cough and dyspnea were deliberately not added because no quotable abstract-level source was found for them. Validation: just validate passed, just count-verified-snippets reports 66 of 66 verified, and just validate-disorders, the batched schema plus terms plus references sweep that CI runs, passed with 66 of 66 and no issues. Compliance rose from 87.4 to 94.1 percent.

  details: |
    Added a 'Neutralizing anti-IL-23 autoantibodies' pathophysiology node downstream of 'Central tolerance failure in the thymic microenvironment', with a bare-name causal edge to a new 'Opportunistic infection' phenotype (HP:0031690). Source: Cheng et al., NEJM 2024 (PMID:38507753), full text fetched and read. The edge from tolerance failure to anti-cytokine autoantibodies cites PMID:25230752 (INDIRECT; that paper documents IL-17/IL-22/type-I-IFN specificities). All infection claims worded 'associated with' and graded INDIRECT per the association-level evidence. Added a rituximab B-cell-depletion treatment targeting the autoantibody node, flagged n=1. Recorded the anti-IFN-alpha/IL-17/IL-22/IL-28 finding as a tested null for infection in the node description. Validated: validate, validate-terms, check-causal-targets, count-verified-snippets, validate-disorders.

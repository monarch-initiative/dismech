  details: |
    Response to the CHANGES_REQUESTED review from ai4c-reviewer on PR 8196. Both blocking items fixed. Blocking 1: the Lymphoma differential was bound to the top-level MONDO:0005062 lymphoma, which is too general for an anterior-mediastinal-mass differential and inconsistent with its sibling entry; rebound to MONDO:0004021 mediastinal malignant lymphoma, verified with OAK as a direct subClassOf the previous term. Blocking 2: GO:0045060 negative thymic T cell selection with modifier DECREASED was attached to the ORGANISM-scale Checkpoint-blockade-unmasked immune-related toxicity node. The reviewer was correct on both counts: it duplicated a cause onto its own distal consequence, since the same defect is already modelled upstream on Central tolerance failure in the thymic microenvironment, and neither of the node's evidence items mentions thymic selection. The descriptor was removed rather than replaced, and a notes field now records why the node deliberately carries no biological_processes descriptor. Non-blocking suggestions also addressed. Added a new PD-L1 Mediated Adaptive Immune Resistance node carrying conforms_to immune_checkpoint_blockade#Adaptive Immune Resistance, evidenced by PMID:34568003, which reports high CD274 expression in B2 and B3 thymomas validated by immunohistochemistry; the Immune Checkpoint Blockade treatment now has target_mechanisms INHIBITS on that node, so it joins the pathograph. This also makes explicit that the tumour-immune-evasion arm and the central-tolerance arm are separate mechanisms that happen to converge on the same drug, one as the reason to give it and the other as the reason it is hazardous in thymoma. Changed the anti-titin biomarker preferred_term from Titin, which names the protein, to Anti-titin antibody, which is what is measured, and added a context field recording that the FREQUENT band is conditioned on the thymectomized myasthenia gravis cohort rather than on unselected thymoma patients. Removed the OCCASIONAL frequency band from the Hypogammaglobulinemia phenotype: neither cited source quantifies it, and per the frequency-evidence SOP an unsupported band is worse than none. Backfilled biological_scale to the six remaining untagged pathophysiology nodes, applying single-value discipline. The unused MONDO:0002166 cache row was left in place, as the reviewer noted it is a harmless correctly-derived artifact and CLAUDE.md forbids hand-editing cache CSVs. Validation after fixes: just validate-terms passed, just count-verified-snippets reports 75 of 75 verified, and just validate-disorders passed with no issues. The conforms_to and target_mechanisms foreign keys were confirmed to resolve. Compliance 93.6 percent.

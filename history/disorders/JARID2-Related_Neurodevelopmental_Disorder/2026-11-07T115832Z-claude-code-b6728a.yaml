  summary: 'Create: JARID2-Related Neurodevelopmental Disorder'
  details: |
    New entry for MONDO:0859306 (OMIM 620098), curated from an OpenScientist deep-research report; Edison (falcon) was attempted first and returned HTTP 403 from the provider. The report's gene identifier (HGNC:6826) was wrong and was replaced by hgnc:6196 from the stub, MONDO and the ClinGen record. Named after recurring literature usage (JARID2-related intellectual disability, JARID2-neurodevelopmental syndrome/disorder) because the MONDO label is a broad phenotype name; the MONDO label is kept as a synonym. Pathograph: JARID2 haploinsufficiency to impaired PRC2.2 recruitment to disordered Polycomb-regulated gene expression to the neurodevelopmental phenotypes, with direct unknown-intermediate edges to the facial and palatal features and a mouse-derived cardiac morphogenesis node feeding abnormal heart morphology. ClinGen Definitive AD tier copied from its CGGV record. Validated with just validate, validate-terms, count-verified-snippets (38/38) and the offline whole-repo gates.

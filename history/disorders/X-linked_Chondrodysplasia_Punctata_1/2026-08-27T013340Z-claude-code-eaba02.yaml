  summary: 'Create: X-linked Chondrodysplasia Punctata 1 (CDPX1, brachytelephalangic)'
  details: |
    Curated as part of a sweep to complete ISDS Nosology group 23 coverage. Corresponds to nosology row NOS 23-0010. Uses the current HGNC symbol ARSL (hgnc:719) rather than the nosology row's ARSE. The pathophysiology deliberately models an explicitly unresolved node (the unidentified sulfated substrate), because the enzyme's physiological substrate has never been identified and that gap is the disorder's defining feature - there is no biochemical test. A separate node captures the warfarin sensitivity of the recombinant enzyme, the mechanistic bridge to warfarin embryopathy. The vitamin-K-deficiency, maternal-autoimmune, and coumarin phenocopies are recorded as differential diagnoses rather than as subtypes or environmental entries, since they are not ARSL disorders and one cited report argues the radiographic category is not a diagnostic entity at all; that dispute is recorded as a knowledge-gap discussion. Validated with the batched validate-disorders pass (43 snippets verified). Deleted the corresponding stub.

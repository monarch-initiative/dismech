  summary: Address PR review feedback by restoring DYNC1I2 caveats, unbundling Impaired
    Cortical Neurogenesis, and removing speculative circuit localizations
  details: |
    Restored explicit caveats on DYNC1I2 Biallelic Loss of Function (c.607+1G>A untested on patient RNA; GO:0045504/GO:0045503 phylogenetic IBA origin; subunit binding unmeasured in patient alleles), Cytoplasmic Dynein-1 Complex Dysfunction (motor/cargo-transport impairment inferred, unmeasured in patient material), and the 374 kb 2q31.1 deletion variant (neighbouring DCAF17, CYBRD1, and SLC25A12 contribution cannot be fully excluded). Renamed Impaired Cortical Neurogenesis and Brain Hypoplasia to Impaired Cortical Neurogenesis, grounded its evidence with indirect zebrafish progenitor-depletion and human MRI support, replaced speculative neuroanatomical circuit localizations on its 14 downstream phenotype edges with honest INDIRECT_UNKNOWN_INTERMEDIATES descriptions, updated discussions attaches_to, and marked cohort-level Genetic Counseling evidence accurately.

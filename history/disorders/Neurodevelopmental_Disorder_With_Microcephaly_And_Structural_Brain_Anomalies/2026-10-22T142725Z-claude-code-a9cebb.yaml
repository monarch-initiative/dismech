  details: |
    New entry for MONDO:0032779 (DYNC1I2, autosomal recessive), claim #15203. Deep research: one Perplexity sonar-deep-research report (research/...-deep-research-perplexity.md), run without a causal-gene anchor because the stub had no genes block; the report named DYNC1I2 in its first paragraph and explicitly distinguished the SMPD4 disease. Report validation: 6/6 cited PMIDs resolved; term validation 0 unresolved, one obsolete CL term and one false 'mislabelled' MONDO flag caused by the template text. preflight-dr not run (no local mondo.db). Evidence comes from two papers: PMID:31079899 (abstract only in cache) and PMID:39281811 (full text). The 2024 family appears to be the 2019 index pedigree; phenotype rows taken from its OMIM-synopsis table column are marked quote_role BACKGROUND. No feature frequencies given (five patients). Mechanism chain rests on zebrafish data only; brain malformation phenotypes are left unconnected with a KNOWLEDGE_GAP discussion. Validated with validate, validate-terms, count-verified-snippets (all verified), entity-ref and causal-target checks, offline gates, and validate-disorders.

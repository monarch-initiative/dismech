  details: |
    Addressed review on PR 15210. The zebrafish model link to the apoptosis node now quotes the abstract sentence reporting increased apoptosis instead of the head-size sentence. The spindle-and-mitosis node was split into Abnormal Mitotic Spindle Morphology (GO:0007052) and Prolonged Mitosis (GO:0000278, looked up on OLS), connected in the order the source gives (spindle defect -> prolonged mitosis -> apoptosis). The knowledge-gap rationale now limits its negative claim to human cells and tissue and notes that the 2019 full text, reportedly describing axon-tract disorganization in morphants, is not cached and was not checked. Validated with just validate, count-verified-snippets (39/39), check-entity-refs, check-causal-targets and the offline snippet gates.

  summary: 'Create: Aneurysm-Osteoarthritis Syndrome'
  details: |
    De-novo creation of Aneurysm-Osteoarthritis Syndrome, SMAD3-related Loeys-Dietz syndrome type 3, MONDO:0013426. Deep research provider: falcon/Edison. GeneReviews baseline PMID:20301312 fetched and tagged. Curated SMAD3/TGF-beta pathophysiology with conforms_to links to the aortopathy_tgfbeta_dysregulation module; TGF-beta paradox refined with Smad3-null mouse data PMID:27688095 and the iNOS/MMP inflammatory arm PMID:23782924, plus a cartilage early-onset-osteoarthritis mechanism node. Phenotypes with quantified human frequencies from the van der Linde 2012 AOS cohort PMID:22633655 and van de Laar PMID:21217753/PMID:22167769; genotype-phenotype and natural history from the Montalcino Aortic Consortium PMID:30661052. Treatments: ARB/beta-blocker, prophylactic surgery, whole-arterial-tree surveillance. Validated with schema+terms+references and 92.6 percent weighted compliance.

  summary: Add pregnancy/peripartum aortic surveillance and ARB pregnancy contraindication
  details: |
    PR Shepherd fix addressing the single remaining blocking review item on PR #7119 (ai4c-reviewer, re-review of c47aa666): pregnancy management was absent while ARB therapy was modeled without its pregnancy contraindication.

    Changes (treatments section only):

    1. New treatment "Pregnancy and Peripartum Aortic Surveillance" (MAXO:0000950 supportive care), evidenced with the exact GeneReviews quote already cached on this branch in references_cache/PMID_20301312.md: "Pregnancy and the postpartum period can be dangerous for women with LDS because of increased risk of aortic dissection/rupture and uterine rupture. Increased frequency of aortic imaging is recommended, both during pregnancy and in the weeks following delivery." No new reference fetch was required. A notes field records that the source is LDS-wide GeneReviews guidance covering SMAD3-related LDS type 3, not SMAD3-specific evidence.

    2. Added a notes field to "Angiotensin Receptor Blocker Therapy" recording the pregnancy contraindication (renin-angiotensin system action, fetal renal and developmental toxicity, withdrawal before or at conception) and cross-linking the new peripartum surveillance treatment.

    Evidence discipline: the ARB pregnancy contraindication is recorded in notes rather than as an evidence item because no cached reference for this entry states it in quotable form (CLAUDE.md "When Evidence Cannot Be Verified", Option A). No snippet was fabricated and no cache file was hand-created or edited.

    Validation: "just validate kb/disorders/Aneurysm-Osteoarthritis_Syndrome.yaml" passed (schema, term, and reference validation). All 17 PMID:20301312 snippets in the entry, including the new one, were independently confirmed as exact whitespace-normalized substrings of the cached abstract. No line-ending hyphens were introduced in folded scalars.

    Not addressed, left to the author: every remaining item in the review is marked SUGGESTION rather than blocking, including named intervention thresholds, the TEVAR aorta-versus-visceral distinction, the ClinGen CGGV assertion for the SMAD3 gene-disease pair, and additional unmined PMID_22633655 / PMID_22975338 full-text content.

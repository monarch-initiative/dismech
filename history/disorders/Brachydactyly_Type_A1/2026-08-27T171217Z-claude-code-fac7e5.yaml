  summary: 'Review: add 2024 joint-cavitation mechanism and new alleles'
  details: |
    Final-pass review of the ISDS group 18 set. Added a new central-effector node, Failed Interphalangeal Joint Cavitation from Suppressed Interzone Apoptosis, from the 2024 Nat Commun IhhE95K knock-in study [PMID:38472182]: the missing middle phalanx is a joint-cavitation failure driven by reduced interzone apoptosis, with IHH partners CDON and GAS1 proposed to act as dependence receptors. The dependence-receptor account is tagged PARTIAL because the authors present it as a proposed model. This node also wires the existing Distal Finger Symphalangism phenotype, explaining why BDA1 pairs shortening with symphalangism rather than producing one or the other. Also extended the IHH genetic notes with C-terminal-domain secretion variants [PMID:38917024] and the GDF5 notes with the S475N allele causing BDA1 plus multiple-synostoses syndrome 2 [PMID:38222807]. An initially wrong GO binding [GO:0072534, perineuronal net] was caught by term validation and corrected to GO:0036023.

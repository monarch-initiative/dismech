  summary: 'Review: cite prevalence, split progression, correct cerebellar band, document
    module non-conformance'
  details: |
    Review of the tenth-oldest unreviewed disorder entry (creation_date
    2025-06-12). This entry was in better shape than most of the sweep - it has
    classifications, evidenced treatments and frequency bands already - so the
    findings are narrower.

    Uncited prevalence (the recurring finding of this sweep). The single record
    had no measure_type, no prevalence_class and no evidence, asserting "Fewer
    than 300 cases have been reported worldwide" plus a consanguinity claim.
    Neither traced to any reference in the entry. Replaced with a
    CASES_IN_LITERATURE record anchored on the largest cohort actually reported
    in a cited source (106 patients, PMID:22391998), and paired with the source's
    own statement that mildly affected patients often remain undiagnosed into
    adolescence or adulthood - so the count is explicitly a floor rather than an
    estimate of frequency. The consanguinity claim is dropped as untraceable
    rather than restated.

    Progression split from one phase into three, using full text already cached
    but unmined. Two facts emerge that the single paragraph had flattened:
    - The tone abnormality EVOLVES: hypotonia predominates early, spasticity
      late. A patient assessed once can be mischaracterised, which matters for a
      disorder diagnosed across a wide age range.
    - About a quarter of patients lose acquired milestones - unassisted walking,
      speech. The source calls this "neurological decompensation", and the
      progression phase now says explicitly that this means loss of function, not
      metabolic crisis, because the word invites exactly the wrong reading in an
      organic aciduria.
    A third phase covers delayed diagnosis in mildly affected patients, which is
    a distinct clinical problem from the childhood presentation.

    Frequency band corrected. Cerebellar ataxia carried VERY_FREQUENT resting on
    a qualitative characterisation - the disease is "characterized by psychomotor
    delay and cerebellar dysfunction". That establishes cerebellar involvement as
    DEFINING but not that it reaches 80%. The one quantitative source puts
    epilepsy and cerebellar dysfunction at about two-thirds of the 106-patient
    cohort, which is FREQUENT. Lowered, with the reasoning in review_notes and
    the quantitative snippet added as evidence. Being a defining feature of a
    disease and being present in 80% of its patients are different claims, and
    the band encodes the second.

    Module non-conformance documented rather than left implicit. L-2-HGA would be
    grouped with metabolic_intoxication_decompensation on biochemical
    classification - organic aciduria, enzyme deficiency, metabolite accumulation
    - but lacks the feature that module models. The entry already said so in
    prose ("Unlike many organic acidemias, L2HGA does not feature acute metabolic
    decompensation crises"); that reasoning is now also on the enzymatic node
    where a curator considering conformance would look. Third entry in this sweep
    where the module was withheld deliberately (after D-2-HGA, where it was
    wrongly asserted and withdrawn, and GAMT deficiency).

    CNS neoplasm framing. The phenotype is banded VERY_RARE while its description
    states a significantly increased lifetime risk of CNS tumours including
    malignant glioma - and the entry carries neuroimaging surveillance as a
    treatment. Those are consistent (absolute rarity, elevated relative risk) but
    a reader could take VERY_RARE as a reason to skip surveillance. Added a note
    stating the distinction explicitly.

    Validation. Schema, term and reference validation all pass.

  summary: 'Create: Ariboflavinosis'
  details: |
    New entry for acquired riboflavin deficiency (MONDO:0004573), scoped to nutritional disease; inherited transporter deficiency, riboflavin-responsive MADD, SLC52A1 maternal deficiency and hereditary GSR deficiency are kept as differentials in notes (consistent with the acquired-GR differential in Glutathione_Reductase_Deficiency). Inputs: one Perplexity deep-research report run at reasoning_effort low, used for leads only; its numbered citations were not used. PMIDs added beyond the report by PubMed search: 12791609, 36018769, 23608654, 32330571, 11906577, 29855062, 19740970, 32458157, 29262062 (StatPearls), 6493112, 465434, 5794396, 32828. Pathograph: dietary/alcohol exposure -> systemic riboflavin insufficiency -> FMN/FAD depletion -> branches for erythrocyte glutathione reductase undersaturation (EGRAC), FMN-dependent PLP synthesis (PNPO), FAD-dependent MTHFR (homocysteine; blood pressure in 677TT), mitochondrial energy metabolism (fatigue), iron handling -> erythropoiesis (normocytic anemia, erythroid hypoplasia), and mucocutaneous epithelial injury (angular cheilitis, cheilosis, glossitis, seborrheic and scrotal dermatitis). Judgement calls: mechanistic links to epithelium, cornea and iron marked INDIRECT_UNKNOWN_INTERMEDIATES; RIBOFEM's unchanged iron absorption recorded as REFUTE on the iron-absorption node; B-complex non-response of angular stomatitis recorded as REFUTE on treatment; no per-sign frequencies because the only percentages are from a low-intake population, not a case series; prevalence records are biochemical deficiency (EGRAC >=1.40); MTHFR is a MODIFIER, not causal. Scrotal dermatitis bound to HP:0011123 because HPO has no specific term. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, gene-activity grounding all pass; 79/79 snippets verified; validate-disorders passed; check-genereviews NO_CHAPTER (non-Mendelian); all 13 phenotypes causally connected.

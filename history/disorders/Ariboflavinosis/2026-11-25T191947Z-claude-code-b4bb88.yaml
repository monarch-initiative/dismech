  summary: 'Gene-family review: MTHFR and PNPO'
  details: |
    The MTHFR modifier record (TT homozygotes are more sensitive to low riboflavin because the thermolabile enzyme loses FAD) was reviewed and kept; it now records germline origin, and the node's reductase binding was made NADPH-specific (GO:0004489 to GO:0106313). PNPO is correctly modelled as an FMN-limited enzyme with decreased pyridoxamine phosphate oxidase activity and no genetic record.

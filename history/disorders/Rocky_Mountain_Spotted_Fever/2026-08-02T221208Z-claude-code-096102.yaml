  summary: 'Update: RMSF review follow-ups (chloramphenicol, PCR/IHC diagnosis, prevention,
    histopathology, snippet expansion)'
  details: |
    Follow-up curation pass on the Rocky Mountain spotted fever entry addressing review items.

    Treatments: added a second-line chloramphenicol entry with the pregnancy positioning. It records that chloramphenicol is the only alternative agent but carries higher mortality than tetracyclines in CDC case-report data, is no longer available orally in the US, requires blood-index monitoring, and does not cover ehrlichiosis or anaplasmosis. The pregnancy note states that chloramphenicol is a potential alternative but carries a theoretical gray baby syndrome risk late in the third trimester, and that doxycycline remains preferred for suspected RMSF in pregnancy. target_mechanisms links it to the same Rickettsial Ribosomal Translation node doxycycline inhibits, noting the 50S rather than 30S binding site.

    Diagnosis: added two acute-phase confirmatory modalities that complement the retrospective paired-serum IFA already present. Whole-blood PCR, NCIT:C17003, records the low sensitivity of R. rickettsii detection in blood before advanced disease and the recommendation to draw specimens before antibacterial agents are given. Skin punch biopsy immunohistochemistry, NCIT:C23020, records the roughly 100 percent specific and 70 percent sensitive performance figures. Both entries state explicitly that a negative result does not exclude RMSF and must not delay empiric doxycycline.

    Prevention: added two prevention entries, a gap the review flagged. Tick-bite prevention counseling records that no vaccine is licensed, the DEET, IR3535, picaridin, and permethrin-on-clothing measures with the greater-than-80-percent bite reduction figure among outdoor workers, the rationale for prompt tick checks given the delay between attachment and transmission, and the explicit CDC recommendations against post-bite doxycycline prophylaxis and against treating asymptomatic seropositive persons. Pet acaricide use and peridomestic tick control captures the dog and Rhipicephalus sanguineus reservoir that drives the Arizona and northern Mexico epidemic foci already recorded in this entry's epidemiology, and is the population-level intervention that individual repellent use does not cover.

    Histopathology: added four findings from PMID:9449487, a 26-case cutaneous histopathology series that was fetched and verified for this pass. Lymphohistiocytic capillaritis and venulitis is the dominant pattern and the tissue-level correlate of the disseminated small-vessel vasculitis node. Leukocytoclastic vasculitis with nuclear dust is recorded at 11 of 15 involved-skin specimens, which justifies the FREQUENT band, together with the authors' classification of RMSF vasculitis as septic rather than immune-complex mediated. Focal fibrin thrombi with capillary wall necrosis is recorded as OCCASIONAL and corresponds to the platelet consumption node. Rickettsial antigen in affected endothelium, positive in all 12 cases tested, is marked diagnostic and is the histopathologic basis of the new skin-biopsy immunohistochemistry diagnosis entry.

    Phenotypes: added Anorexia, HP:0002039, cited to the Orphanet acute-presentation description. The review noted a few research-report phenotypes were uncarried; the remainder were checked and deliberately not added - the report's HP:0000965 for petechiae is actually Cutis marmorata and HP:0002119 for cerebral vasculitis is actually Ventriculomegaly, both wrong bindings, while fatigue and separate nausea/vomiting terms are already covered by the existing Malaise HP:0033834 and the combined Nausea and vomiting HP:0002017 entries.

    Evidence quality: expanded 55 truncated evidence snippets and reference finding supporting_text values to full sentences or complete clause boundaries, so each quote stands on its own rather than ending mid-phrase. No PMIDs changed; every expanded quote was re-verified against the cached reference text.

    Ontology precision: retightened two bindings. The endothelial cell type moved from CL:0000115 endothelial cell to CL:0000071 blood vessel endothelial cell, matching the vascular tropism the entry describes. The meningoencephalitis phenotype moved from HP:0002383 Infectious encephalitis to the more specific child term HP:0034387 Bacterial encephalitis, with the pathophysiology downstream target renamed to match.

    Schema fix: two environmental risk factor effect fields carried the enum-style value HARMFUL, but effect is free-text prose in this schema. Both were replaced with substantive descriptions of the mechanism by which the exposure raises risk.

    Validation: just validate passes for schema, terms, and references; 121 of 121 snippets verified against cached references.

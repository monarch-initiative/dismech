  summary: 'Create: Rocky Mountain spotted fever'
  details: |
    De-novo curation of Rocky Mountain spotted fever [MONDO:0019359, ORPHA:83311, Rickettsia rickettsii].

    Deep research: claude_code provider via `just research-disorder claude_code Rocky_Mountain_Spotted_Fever`; report at research/Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md, 20 web searches, 28 citations. The report was treated as leads only: every PMID was fetched with `just fetch-reference` and every snippet verified against the cached text.

    NEC preflight: MONDO:0019359 checked with OAK. The report's disease identity - R. rickettsii, ORPHA:83311, ICD-10 A77.0, no OMIM entry - matches the MONDO record's xrefs and definition. No named-entity confusion with the sibling spotted fever group entries already in the KB, Boutonneuse_Fever / R. conorii and Murine_Typhus / R. typhi.

    GeneReviews: not applicable. PubMed search returned no GeneReviews chapter, which is expected for an acquired infectious disease; this is recorded in the entry's notes field.

    Content: 11 pathophysiology nodes forming the causal chain tick inoculation -> endothelial invasion -> VE-cadherin / adherens-junction disruption -> disseminated small-vessel vasculitis -> microvascular permeability and platelet consumption -> multiorgan injury, plus a CD8 T-cell clearance node and a G6PD-associated fulminant thrombotic node. Two nodes declare module conformance: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome and intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion, the same pattern used by Murine_Typhus. 22 phenotypes with HPO bindings; frequency bands only where a quantitative source exists, from the PMID:17236897 pediatric series. Also structured prevalence for national and Arizona focal incidence, progression phases, epidemiology, infectious agent NCBITaxon:783, transmission, diagnosis, four differential diagnoses, doxycycline and supportive-care treatments with target_mechanisms, a G6PD MODIFIER genetic record, and three animal models.

    One HUMAN_MODEL_MISMATCH discussion records that the VE-cadherin hyperpermeability mechanism from PMID:22720111 was demonstrated with the non-pathogenic BSL2 surrogate R. montanensis rather than R. rickettsii, with three proposed experiments.

    Validation: `just validate` passes for schema, terms, and references; 102/102 snippets verified against cached references; `just validate-graphs` reports no dangling causal targets for this entry; compliance 82.5 percent global and 82.7 percent weighted.

  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for Rickettsia rickettsii. Hosts: Dermacentor variabilis (NCBITaxon:34621, American dog tick, principal US vector), Dermacentor andersoni (NCBITaxon:34620, Rocky Mountain wood tick, western US vector), Rhipicephalus sanguineus (NCBITaxon:34632, brown dog tick, vector of the Arizona and border peridomestic cycle), Rodentia (NCBITaxon:9989, order-level, the vertebrate host immature ticks feed on), Canis lupus familiaris (NCBITaxon:9615, preferred host of the brown dog tick at all life stages), Homo sapiens (NCBITaxon:9606, incidental host). Vectors: the three tick species. The tick is deliberately recorded as CARRYING the agent rather than as an unqualified reservoir. The brief named transovarial maintenance, and it is real and cited (PMID:9925615 for transovarial passage into 30 to 100 percent of offspring), but the same paper's own result is that R. rickettsii is lethal to the majority of infected D. andersoni, offered as the explanation for the low field prevalence of infected ticks, and PMID:28433729 - an experimental vertical-transmission study that included R. rickettsii in D. variabilis - concludes that sustained vertical transmission is not common. Both qualifications are cited in the first stage rather than omitted. Three stages: transovarial passage offset by lethality to the vector; tick feeding on vertebrate hosts across life stages (PMID:27172113 for vertebrates sustaining the tick life cycle, for immature ticks feeding on rodents and rabbits, and for dogs as the brown dog tick's preferred host); and human infection by the bite of an infected tick (PMID:27172113 on incidental human exposure). The PMID:27172113 ecology sentences are graded OTHER with quote_role REVIEW_SYNTHESIS, since the CDC recommendations report is synthesizing vector ecology rather than reporting human clinical data; the file's existing uses of that reference are HUMAN_CLINICAL on different, clinical sentences. Deliberately NOT used: the report's 'Dogs can serve as reservoir hosts for R.' sentence, which in context concerns Rickettsia conorii and not R. rickettsii. Two new references fetched: PMID:9925615 and PMID:28433729. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

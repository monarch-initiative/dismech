  summary: 'Create: Immunodeficiency 122 (POLD3)'
  details: |
    De novo curation of IMD122 (POLD3, MONDO:0971151) from the two published POLD3-deficiency reports plus the mouse Pold3 haploinsufficiency paper. Primary sources: PMID:38099988 (Riestra 2023, full text, Omenn patient, p.Lys373Thr) and PMID:37030525 (Mehawej 2023, abstract-only, Lebanese syndromic SCID patient, p.Ile10Thr); PMID:27524497 for the complex-destabilisation and developmental-requirement mouse evidence. Deep research: one openscientist run (research/Immunodeficiency_122-deep-research-openscientist.md); its term-validation section flagged NCIT:C603 mislabelled as Immunoglobulin Therapy (NCIT calls it Isotretinoin) which was not used, and confirmed no POLD3 human immunodeficiency papers beyond the two curated. Two genotyped patients total; three ungenotyped deceased siblings of the Mehawej patient are noted but not counted. Framed consistently with the sibling IMD120 (POLD1) entry: same proliferation-defect mechanism, two convergent allele routes (p.Ile10Thr abolishes POLD1/2/3 expression; p.Lys373Thr preserves expression but impairs function with normal subunit levels and rescue by WT POLD3). Within-paper attribution care: Mehawej-patient phenotypes are quoted from PMID:38099988's own summary paragraph of that case, with the snippet naming the patient so the assignment is checkable. Classified IUIS Table 2 (combined immunodeficiency with syndromic features) because both patients carry non-immune syndromic features. Pathograph: 9 pathophysiology nodes wired to 15 phenotypes via causal edges; one OPEN_QUESTION discussion (Omenn-vs-CID severity not tracking subunit abundance) and one HUMAN_MODEL_MISMATCH discussion (mouse developmental phenotype vs unconfirmed human developmental attribution). Validation on final tree: just validate (schema+terms), count-verified-snippets 41/41, validate-terms, validate-disorders (41 snippets, 44 titles, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-coarse-phenotypes, check-reference-titles, check-gene-activity-grounding, check-genereviews (NO_CHAPTER for GeneReviews and StatPearls). Deleted stub stubs/Immunodeficiency_122.yaml.

  summary: Rebind CD8+ phenotype to HPO proportion term
  details: |
    The Decreased CD8+ T Cell Proportion phenotype was bound to HP:5210425 (Decreased total CD8+ T cell number). The source (PMID:38099988 Table 1) reports CD8+ as a percentage (3% against 12-28%), and an OLS search found HP:0005415 Decreased total CD8+ T cell proportion, so the binding moved to that term. The note now records that HPO defines the proportion against CD3+ T cells while the source table does not state its denominator. An OLS search for an increased NK-cell proportion term returned only count terms (HP:0040089, HP:0040218), so the existing NK note stands. Validated with just validate, validate-terms, count-verified-snippets (46/46) and the offline gates.

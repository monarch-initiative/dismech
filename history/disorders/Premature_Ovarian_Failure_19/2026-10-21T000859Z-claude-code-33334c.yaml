  summary: 'Create: Premature_Ovarian_Failure_19'
  details: |
    New entry for HSF2BP-related premature ovarian failure 19 (MONDO:0030985; OMIM 619245), claimed in #15074, modelled on Premature_Ovarian_Failure_20 and conforming to meiotic_prophase_failure. Human evidence is the founding consanguineous family with homozygous p.Ser167Leu (PMID:32845237) and two sporadic homozygous patients, p.Cys128Arg and p.Leu186Pro, from a 1,030-patient POI cohort (PMID:35174157). Mechanism evidence is from Hsf2bp knockout and S167L knock-in mice (PMID:30760716, PMID:32845237) and the BRCA2-binding study (PMID:31242413). Most snippets were taken from cached full texts read directly. PMID:35174157 contradicts itself in two places, which the entry records rather than resolving: ACMG class (VUS in its text, LP in Table 1) and POI-2's age at amenorrhea (18 in the text, 16 in Table 1). Deep research: falcon was requested but had no usable key, so the --fallback run went to openscientist. That report failed just preflight-dr. It never names HSF2BP and is about ZSWIM7 (ovarian dysgenesis 10, already curated in 46_XX_Gonadal_Dysgenesis), so it was discarded and not committed, and the reference-cache rewrites its validation made were reverted. A claude_code report then passed preflight-dr (HSF2BP 19 mentions; BRCA2 is the binding partner, not a rival disease). It was committed, but its fetches of the primary papers were blocked, so it contributed no facts beyond the sources above. A subagent self-review found 13 issues. All were addressed except one: the downstream edges from follicle depletion to the phenotype nodes remain uncited textbook physiology. Validation: just validate, validate-terms, count-verified-snippets (38/38), check-entity-refs, check-causal-targets and the offline snippet/prose gates all pass. After PR review, the CI gene-activity-grounding gate required a molecular function on the HSF2BP node; GO:0005515 protein binding (GO's only HSF2BP molecular-function annotation) was bound, and an uncited reference cache (PMID:34794894) was dropped.

  details: |
    Added Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) and ULTRA_RARE CASES_IN_LITERATURE prevalence record; added GERMLINE variant_origin and sporadic POI cohort case_fractions (0.19% in n=1,030) on HSF2BP; enriched pathophysiology nodes with UBERON:0000992 ovary locations and CL:0000023 oocyte cell type (keeping GO:0007131 reciprocal meiotic recombination on the downstream cellular node rather than the molecular lesion node); added serum FSH measurement (NCIT:C74783, documenting both the 2024 ESHRE single-FSH >25 IU/L criterion and the two-measurement cohort criterion) and pelvic ultrasound imaging (NCIT:C17230) diagnosis entries; and enriched hormone replacement therapy with target_mechanisms/target_phenotypes and added Fertility treatment (NCIT:C49236 Therapeutic Procedure) for the unspecified fertility intervention reported in PMID:32845237.

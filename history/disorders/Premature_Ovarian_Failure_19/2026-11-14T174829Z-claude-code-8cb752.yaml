  details: |
    Ovarian Follicle Depletion now declares two module anchors, using the list spelling the schema accepts: the existing meiotic_prophase_failure#Ovarian Follicle Depletion and Primary Ovarian Insufficiency, and the new menopausal_estrogen_withdrawal#Ovarian Follicle Pool Exhaustion. Added a node-level notes block saying why both: the meiotic module reaches the node from above and explains why the reserve is small, while the withdrawal module starts from it and explains the hormonal state this node's own downstream edges assert.

    The route in differs from the module's own examples - here the reserve was never fully built, where the module names lifelong atresia and step reduction by surgery or chemotherapy - but the module's trigger node states that the route is the substitution a conformer makes and the state, an ovary with essentially no recruitable follicles, is what the node describes. The two sporadic patients' atrophic follicle-free ovaries are that state.

    just check-conformance-content reports process_absent on the new link: the module binds GO:0001541 ovarian follicle development and this node binds GO:0007292 female gamete generation. Both describe the depleted reserve from a different angle and the existing binding is the curator's choice, so no term was copied in. cell_type_absent does not fire (both bind CL:0000023 oocyte) and edges_absent does not fire (the node carries seven downstream edges). No other node in this entry maps: the remaining three are the HSF2BP lesion and the two meiotic steps.

    Not linked: nothing in this entry carries the systemic or receptor nodes, so the module's chain is picked up only at its trigger.

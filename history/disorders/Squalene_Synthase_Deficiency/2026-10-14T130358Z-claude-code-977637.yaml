  summary: 'Create: Squalene Synthase Deficiency'
  details: |
    New entry for squalene synthase deficiency (MONDO:0032566, FDFT1, autosomal recessive), replacing stub stubs/Squalene_Synthase_Deficiency.yaml (entry_type DISEASE: one gene, one enzyme step, one recessive mechanism; no cholesterol-biosynthesis grouping exists in kb/groupings to join).

    Sources. The GeneReviews chapter (PMID:32027475, tagged GeneReviews) is the phenotype, diagnosis, management, agents-to-avoid (sun and UV exposure) and genetic counseling baseline; the 2018 defining report (PMID:29909962) supplies the gene, the three index patients and the metabolite localization. One OpenScientist deep-research report was used (research/Squalene_Synthase_Deficiency-deep-research-openscientist.md): 15/15 references resolved, 15/15 quotes valid, term validation needs_review for three mislabelled CURIEs (HP:0003231, HP:0012443 as named, NCBITaxon:10116) and obsolete GO:0004310, none of which were bound. just preflight-dr against MONDO:0032566 returned WARN: FDFT1 is mentioned 27 times and the OMIM identifier matches MONDO (618156); the warning is that SHH is the second most mentioned gene (17). Those SHH passages discuss cholesterol-dependent hedgehog signaling as a candidate developmental mechanism by analogy with Smith-Lemli-Opitz syndrome, which the entry records as an EMERGING hypothesis, not a second disease entity.

    Taken from the report and verified against cached abstracts: Fdft1 null mouse (PMID:10521476), human SQS structure (PMID:24531458), EMC-dependent ER insertion (PMID:30578317), Fdft1 null lethality review (PMID:21247357), Shumiya cataract rat (PMID:16440058), cholesterol and hedgehog signaling (PMID:15539288, 9375918, 10564872), SLOS 7-dehydrocholesterol (PMID:20104611). Added outside the report: zaragozic acid A and farnesol-derived dicarboxylic acid studies (PMID:9083051, 9647670), the liver-specific Fdft1 knockout (PMID:25755092), oligodendrocyte cholesterol and myelination (PMID:15793579), and a population-genetic model placing FDFT1 in the recurrent 8p23.1 NAHR deletion (PMID:36180924, Table 2 row).

    Dropped report claims that the cited abstracts do not contain: low total and LDL cholesterol, raised plasma farnesol, the specific FDFT1 alleles (120 kb deletion, intronic splice variant, 16 bp regulatory deletion), reduced SQS protein on Western blot, and statins being contraindicated. The Coman full text is not available through PMC efetch, so these could not be quoted. Not used: PMID:9575210 and 21098670 (enzymology detail beyond what the entry needs; CrtM is bacterial) and PMID:34939274 (colon adenocarcinoma, a different context). The hedgehog step is curated as an EMERGING hypothesis because it is inferred by analogy with post-squalene defects and has not been tested in FDFT1-deficient tissue.


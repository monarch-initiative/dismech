  details: |
    New Disease entry for RHPD2 (MONDO:0014174), NEK8, AR, from the stub stubs/Renal-hepatic-pancreatic_Dysplasia_2.yaml (claim dismech#16406). The deep-research report is research/Renal-Hepatic-Pancreatic_Dysplasia_2-deep-research-claude_code.md: falcon (Edison) was requested and returned HTTP 403 ProviderAuthError, and the run fell back to claude_code (recorded in the report frontmatter). The report was used only as a list of leads; its own quotes were paraphrases. Every evidence item cites a reference fetched with just fetch-reference (Frank 2013 PMID:23418306, Grampa 2016 PMID:26967905 upgraded to PMC full text, Rajagopalan 2016 PMID:26697755, Gunther 2023 PMID:36756677, Manning 2013 PMID:23274954, Czarnecki 2015 PMID:25599650, Habbig 2012 PMID:23026745, Choi 2013 PMID:23973373, Hoff 2013 PMID:23793029) or the committed ClinGen CGGV record, from which gene_disease_validity (Definitive, AR) was copied. Mouse jck/Nek8-null evidence is graded MODEL_ORGANISM and cell work IN_VITRO. Dropped from the report's leads: pulmonary hypoplasia (no source in the fetched literature), oligohydramnios as a general feature (only one anhydramnios case, recorded as such), the Frank variant name p.Arg45* (not in the abstract), and the Al-Hamed 2016 inferred NEK8 variant (indirect). Situs inversus is bound to HP:0001696 because HPO has no unqualified term; the source does not say whether it was complete. Lump/split reasoning against the Nephronophthisis NPHP9 subtype and the ADPKD PKD8 subtype is in notes. The renal node conforms to ciliopathy_dysfunction#Renal Tubular Cystic and Fibrotic Disease. Validated with just validate, count-verified-snippets (all verified), validate-terms, the KB check recipes, and validate-disorders.

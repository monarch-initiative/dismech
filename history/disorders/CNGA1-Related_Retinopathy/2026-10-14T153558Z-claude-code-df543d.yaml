  summary: 'Create: CNGA1-Related Retinopathy'
  details: |
    New entry for CNGA1-related retinopathy (MONDO:0800405), modeled on CNGB1-Related_Retinopathy but using only CNGA1-specific evidence. Retinitis pigmentosa 49 (MONDO:0013405) recorded as a narrowMatch mapping and synonym rather than a subtype. Pathophysiology chain: biallelic CNGA1 loss of function, defective rod CNG channel membrane expression (in vitro retention of patient alleles; loss of CNGB1 protein in the Cnga1 Y509C mouse), loss of rod light responses, rod cGMP accumulation, progressive rod degeneration, secondary cone degeneration; conforms to phototransduction_cascade_dysfunction and photoreceptor_degeneration nodes. Phenotype frequencies come mainly from the 57-patient East Asian cohort (PMID:42440411) and the 58-patient Chinese natural-history cohort (PMID:41448483), with the Japanese exome study (PMID:25268133) for the 5.1% case fraction. Models: CRISPR Cnga1 knockout with AAV8 gene augmentation rescue (PMID:34418172, PMID:40897815), Y509C ENU mouse (PMID:36115851), Shetland sheepdog frameshift (PMID:26202106), two patient iPSC lines. Trial NCT06291935 (phase 1b intravitreal AAV2.NN-CNGA1) recorded as RECRUITING per the ClinicalTrials.gov API. General RP management cites the Nonsyndromic Retinitis Pigmentosa Overview (NBK1417, tagged GeneReviews); no CNGA1-specific GeneReviews chapter exists (check-genereviews --online). The OpenScientist deep-research report (research/CNGA1-Related_Retinopathy-deep-research-openscientist.md; 22/22 references resolved, 34/35 quotes matched, needs_review true) agreed with the primary-literature curation; from it the Italian CNGA1/CNGB1 cohort (PMID:38705136) and the two iPSC line papers (PMID:38340451, PMID:40795580) were added. Not used: its gene header HGNC:2000 (CNGA1 is HGNC:2148), its HP:0000572 and NCIT:C15262 suggestions (term validation shows Visual loss and Immunotherapy), the CNGB1 gene therapy evidence it offered as cross-channel support (PMID:22802073, PMID:29202463; CNGB1 findings are not CNGA1 evidence), the general IRD prevalence and consanguinity paper (PMID:38317096), the vitamin A RP review (PMID:11064860), the Luxturna review (PMID:42425207) and the channel-structure papers beyond the 3:1 stoichiometry (PMID:33651975, PMID:34969975, PMID:42830318). The report's one unmatched quote (PMID:25268133) was a concatenation of abstract sentences; the snippets used here were taken from the cache directly. just preflight-dr could not run because the local MONDO build is absent; identity was checked manually (CNGA1 named 113 times, OMIM 613756 and RP49 cited, no rival gene). Validation: just validate, validate-terms, count-verified-snippets (99/99), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-genereviews and validate-disorders all pass.

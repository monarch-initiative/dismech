  summary: 'Create: GPD1_Deficiency'
  details: |
    Created a new entry for MONDO:0013771 (transient infantile hypertriglyceridemia and hepatosteatosis), named GPD1 Deficiency because pooled follow-up (PMID:39839217, PMID:41971245, PMID:36051699) shows triglycerides normalizing in only about 28-30% of patients; the MONDO term is bound unchanged and its label kept as a synonym. Deep research: requested falcon, which returned HTTP 402 (out of credits); the claude_code fallback produced research/GPD1_Deficiency-deep-research-claude_code.md. just preflight-dr returned PASS (GPD1 mentioned 49 times, OMIM 614480 matches). Report reference_validation: 18 references, 11 resolved, 0 unresolved, 7 unverifiable, needs_review true; term_validation flagged four mislabelled CURIEs (NCIT:C61961 given as fenofibrate is Tacrine; NCIT:C15709 given as liver biopsy is Genetic Testing; GENO:0000148; UBERON:0000178) and obsolete GO:0004367, none of which were used. The report was treated as leads only; it misstated that the fenofibrate-treated boy (PMID:32685347) was first diagnosed at 16 with cirrhosis (he was followed from age 1), and attributed the G3P-retention hypothesis to the 2012 founding paper, which is available here only as an abstract, so that hypothesis is attributed to PMID:39839217 instead. All evidence was taken from records fetched with just fetch-reference; ORPHA:300293 was built with the structured-source CLI into the worktree cache. The three published mechanistic proposals for the hepatic and plasma triglyceride excess (acyl-DHAP diversion, hepatic G3P retention, increased hepatic secretion) are recorded as EMERGING hypotheses with their contradictions, and the opposite lipid phenotype of the Gpd1-null BALB/cHeA mouse (PMID:24472537, PMID:32662756) is recorded as a HUMAN_MODEL_MISMATCH discussion. Orphanet's inclusion of CREB3L3 was not followed (MONDO lists GPD1 only). No ClinGen validity assertion or GeneReviews chapter exists for GPD1. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-genereviews --online, the whole-KB snippet and hyphen gates, and validate-disorders.

    A first run of the same recipe with the generic --fallback flag was interrupted locally after falcon's 402, but its openscientist fallback job completed and wrote a second report (preflight-dr PASS; 15/15 references verified, 8/8 quotes valid). To keep to one report per entry it was not committed; the entry was built from the claude_code report and primary sources, and the openscientist report's reference caches not cited by the entry were not committed either.

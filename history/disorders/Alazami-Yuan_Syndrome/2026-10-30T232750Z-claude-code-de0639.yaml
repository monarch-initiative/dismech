  summary: 'Create: Alazami-Yuan Syndrome'
  details: |
    New entry for Alazami-Yuan syndrome (MONDO:0014931), the autosomal recessive TAF6 TFIID disorder, curated from the stub queue as entry_type DISEASE. Deep research: one OpenScientist report (research/Alazami-Yuan_Syndrome-deep-research-openscientist.md), no fallback; 11/11 citations resolved, 11/13 quotes matched. The two unmatched quotes were a truncated gene list from PMID:25558065 and the title of PMID:37746814 presented as a finding sentence; neither was reused. just preflight-dr passed (TAF6 named 72 times, OMIM 617126 matches). The report did not use the Yuan et al. co-immunoprecipitation data, which became the entry's only measured mechanistic step, and it framed complete heart block as a cardiac-development consequence without a source; that edge was not drawn. Its zebrafish metabolism bridge (PMID:37746814) concerns taf1 and taf5, not TAF6, so it is cited only for the TAFopathy grouping. Phenotypes were taken from the 2025 seven-case review (PMID:40321225) and two later single-case reports (PMID:42923476, PMID:36849876); no GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). PMID:32030742 (Tuc et al. 2020) has no retrievable text and is not cited. The pathograph runs variant -> disrupted TAF6 binding to TFIID subunits -> impaired TFIID-dependent transcription initiation, with edges to the CdLS-overlap phenotypes grouped under the EMERGING tafopathy_transcriptomopathy hypothesis; eight phenotypes are deliberately left unconnected and listed in notes. Validation: just validate, validate-terms, count-verified-snippets (77/77), validate-disorders, and the per-file offline gates all passed.

    CI fix round (PR #16103): test (3.13) failed two whole-repo gates. check_folded_hyphens flagged a folded-scalar line in the transcriptomopathy hypothesis description ending in "tissue-", reflowed so the compound stays on one line. check_gene_activity_grounding flagged TAF6 landing on a node with no molecular function; bound GO:0016251 RNA polymerase II general transcription initiation factor activity (DECREASED) on the TAF6 Biallelic Variants node, label checked in OLS and matching TAF6 IDA annotations in QuickGO (UniProt P49848). All coordinator-listed CI gates were then rerun.

    Review round 1 (PR #16103): added a diagnosis section (trio exome or large-panel sequencing after nondiagnostic karyotype, microarray and NIPBL/SMC1A testing, bound to NCIT:C101295 Whole Exome Sequencing; and CdLS clinical scoring, bound to NCIT:C20989 Physical Examination), sourced from PMID:35317131, PMID:40321225 and PMID:36849876. Added phenobarbital (CHEBI:8069) as a therapeutic agent and bound transcutaneous auricular VNS to NCIT:C203750, found by an OLS NCIT search for "vagus nerve stimulation". Regraded two background quotes from OTHER to IN_VITRO or HUMAN_CLINICAL with quote_role BACKGROUND, and replaced the histone-fold fragment with its full sentence graded OTHER. Added Table 1 rows of PMID:40321225 as frequency evidence for 12 phenotypes, set sensorineural hearing impairment to OCCASIONAL (1 of 3), and noted that the Taiwanese proband's deafness type is unstated. Added single-case phenotypes for that proband (hypertrophic cardiomyopathy, abnormal heart morphology with coarse_binding_basis SOURCE_UNSPECIFIED, hypospadias). Removed the hypothesis edges to hypertrichosis and microcephaly, which the source does not name among the features it attributes to transcriptional dysregulation. Dropped the uncited PMID:32030742 cache file.

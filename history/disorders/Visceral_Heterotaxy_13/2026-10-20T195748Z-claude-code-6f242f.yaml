  summary: 'Create: Visceral_Heterotaxy_13'
  details: |
    New entry for HTX13 (MONDO:0976134, OMIM:621079), autosomal recessive heterotaxy caused by biallelic DAND5 loss of function. Human evidence is three patients from three consanguineous families: the Arab-Muslim proband first reported in the 2022 exome cohort (PMID:34215651) and re-described in PMID:42650045, a second Arab-Muslim child in PMID:42650045 (both homozygous c.396_397dup), and a Gambian child homozygous for c.197del (PMID:36316122), whose allele lost Nodal inhibition in a reporter assay. The pathograph runs DAND5 loss of Nodal antagonism, bilateral Nodal activity at the left-right organizer, randomized lateral plate Nodal signaling, abnormal heart looping, then the cardiac and visceral situs phenotypes; the organizer and lateral plate steps rest on mouse Cerl2, zebrafish charon/dand5 and Xenopus Coco work, graded MODEL_ORGANISM. A laterality-independent myocardial proliferation node from the Cerl2 knockout and DAND5-null iPSC cardiomyocytes is recorded as an EMERGING hypothesis with a HUMAN_MODEL_MISMATCH discussion and is deliberately not wired to the one patient's biventricular hypertrophy, which no source attributes to it. The heterozygous p.Arg152His variant is recorded as LIKELY_BENIGN, per the 2022 and 2026 reports, with its reduced reporter activity kept as a REFUTE item and a KNOWLEDGE_GAP on monoallelic contribution. No frequencies are given because n=3. No GeneReviews or StatPearls chapter exists (check-genereviews --online: NO_CHAPTER). No ClinGen validity record exists, so gene_disease_validity is unset. No module conformance: no left-right patterning module exists and ciliopathy_dysfunction does not apply. An OpenScientist deep-research report was used as a lead (14/14 references resolved, 0 unresolved terms, one obsolete GO term). Dropped from it: its allele list, which counts the Bolkier allele and the shared Chorin allele as different variants when they are the same c.396_397dup in the same first patient; its statement that all families are Arab-Muslim (one is Gambian); HPO-annotation phenotypes not documented in any of the three case reports (transposition of the great arteries, right atrial and bronchial isomerism, dyskinesia); unverified ClinVar classifications; survival, prevalence and maternal diabetes figures from mixed-etiology heterotaxy cohorts; and asplenia antibiotic prophylaxis, which no DAND5 source documents. just preflight-dr could not run because the local MONDO build is absent; entity identity was checked by hand (the report is about DAND5 and OMIM 621079, the MONDO term's xref). Validation: validate, validate-terms, 81/81 verified snippets, entity-ref, causal-target, duplicate-key, qualifier, coarse-phenotype, snippet-length, title-snippet, snippet-grading, folded-hyphen, retired-prose, reference-title and block-scalar checks all pass; 20 of 27 phenotypes are causally connected.

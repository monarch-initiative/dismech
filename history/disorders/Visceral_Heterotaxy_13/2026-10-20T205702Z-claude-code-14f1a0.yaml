  summary: 'Review round 1: Visceral_Heterotaxy_13'
  details: |
    Review round 1 on PR #15052, addressing the reviewer's two blocking items
    and both optional ones.

    Blocking 1. The pulmonic stenosis phenotype was bound one level too broad:
    preferred_term, snippet and explanation all said "valvular pulmonary
    stenosis" while the term was HP:0001642 Pulmonic stenosis. Rebound to
    HP:0034350 Valvular pulmonary stenosis, verified through the OLS HP adapter
    (runoak -i ols:hp info) and the OLS hierarchicalParents endpoint, which
    returns HP:0001642 as its only parent, so the new term is the child of the
    old one rather than a sibling. The phenotype name and the matching bare-name
    downstream target on the Abnormal Cardiac Looping node were renamed together
    so no causal target dangles.

    Blocking 2. Added Hypertelorism (HP:0000316) and Bilateral epicanthal folds
    (HP:0000286, canonical label Epicanthus), both labels read from OLS in the
    same step. Each cites the Gambian patient's examination in PMID:36316122
    ("generally coarse facies, hypertelorism, and bilateral epicanthal folds")
    and the second report's restatement in PMID:42650045, which extends the
    finding to the second Arab-Muslim patient. Both carry the same caveat the
    coarse-facies phenotype uses: whether the feature belongs to the disease is
    not known.

    Optional 3. The myocardial hypothesis node had no incoming edge. Added one
    from DAND5 Nodal Antagonist Loss of Function carrying
    hypothesis_groups: [dand5_myocardial_proliferation], with two quotes from
    PMID:25033293: the authors' conclusion that Cerl2 controls the
    TGF-beta/Nodal pathway in heart development independently of its left-right
    role, and the qRT-PCR result placing Cerl2 expression in the embryonic
    ventricles with a left-sided bias. The patient's biventricular hypertrophy
    stays unwired, as before.

    Optional 4. Writing the requested note on the left-isomerism binding turned
    up a better term. HP:0011537 Left atrial isomerism is defined as both atria
    having left atrial morphology, which PMID:36316122 does not report; it says
    only "left-sided isomerism". A runoak "l~isomerism" search of HPO returns a
    general HP:0031854 Left Isomerism whose only hierarchical child is
    HP:0011537. Rebound to the parent, with the reasoning recorded in the
    phenotype's notes, and renamed the phenotype and its bare-name downstream
    target to match. This is a change the reviewer did not ask for; the atrial
    term asserted a distribution of isomerism its own source did not.

    Validation: validate, validate-terms (then normalize-cache, which added only
    HP:0031854 to cache/hp/terms.csv and the phenotypeterm enum cache), 87/87
    verified snippets, entity-ref, causal-target, duplicate-key,
    block-scalar-comment, coarse-phenotype, snippet-length, title-snippet,
    snippet-grading, folded-hyphen, retired-support-prose and reference-title
    checks, the Visceral_Heterotaxy_13 pytest selection,
    check_gene_activity_grounding --against-ref origin/main, and
    validate-disorders all pass.

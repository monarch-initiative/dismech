  summary: 'Round 2 review response: edge-description capture, NCV sourcing, hammertoe'
  details: |
    Answered round 2 of automated review. Three blocking items and all six suggestions.

    Blocker 1. The store-operated calcium downstream edge added in round 1 was inserted above an existing description, so the description that belonged to the Cholesterol Sequestration in the Golgi edge was captured by the calcium edge and rendered on the wrong pathograph arrow. Moved back, and the calcium edge given its own description naming why its link type is INDIRECT_UNKNOWN_INTERMEDIATES. No gate sees this: it is well-formed YAML in a valid slot.

    Blocker 2. A review_notes paragraph still said the pes cavus snippet did not name pes cavus, after round 1 re-sourced it to a sentence that does. Replaced.

    Blocker 3. The Nerve conduction studies diagnosis node cited a snippet about axonal loss and clinical impairments that named no conduction finding at all - NO_EVIDENCE for that claim rather than SUPPORT. Replaced with three items: the demyelinating threshold below 38 m/s and the uniform-and-diffuse character from PMID:42563944, and the measured mean median MNCV of 11.5 m/s in the Korean CMT1E cohort from PMID:35886002, which is the only conduction figure in the entry that is about CMT1E rather than about CMT.

    Suggestions. diagnosis_term bound on both diagnosis entries (NCIT:C88502 Nerve Conduction Velocity Test, NCIT:C15709 Genetic Testing), both offered on review and both verified against cache/ncit/terms.csv and the enum cache. A third reviewer CURIE, NCIT:C85857 Evoked Response Audiometry, was declined: it resolves as labelled but names one modality, and no cached source says which audiometric test was used. The new Audiologic assessment diagnosis entry binds NCIT:C38036 Audiometric Test instead, evidenced INDIRECT from the 40.6 percent hearing-loss yield in the Korean cohort - a yield is the argument for testing everyone rather than a recommendation, which is the inference step INDIRECT records. Hammertoe and Distal amyotrophy wired downstream of Demyelination of Peripheral Nerve. prevalence rate_per_100000 changed from the bottom of the reported range to its midpoint, both bounds kept.

    One error of mine, refuted by the search I claimed to have run. Hammertoe was recorded uncited with a description asserting that no reference cached for this entry named hammertoes. PMID:42563944, already cited five times in the entry, says "Pes cavus and hammer toes are common, while pes planus is less frequent" in its clinical section. I had searched the abstract and written the claim as though I had searched the reference. The node is now cited, the false description replaced, and the mistake recorded in review_notes rather than quietly fixed - it is the second negative-existence claim of mine in this entry, after the GO term note.

  summary: 'Create: Charcot-Marie-Tooth Disease Type 1E (MONDO:0007311)'
  details: |
    De novo curation of CMT1E (MONDO:0007311), claimed in #12503.

    entry_type decision: DISEASE, not a has_subtypes row on a PMP22 or CMT1 parent. The argument is mechanistic: CMT1A (duplication) and HNPP (deletion) are gene-dosage diseases of a normal protein, CMT1E is a protein-misfolding disease of an abnormal one, and PMID:15755691 shows the three mouse genotypes have distinct expression profiles rather than graded ones. The therapeutic consequence follows - PMID:21393063 records ascorbic acid working in the CMT1A dosage model and failing in humans. Folding CMT1E into a dosage parent would lose the claim that makes it worth curating.

    Pathograph: seven nodes. Transmembrane-domain missense to ER/Golgi retention, then two parallel arms - aggresome formation with autophagy-dependent clearance, and cholesterol sequestration in the Golgi with reciprocal plasma-membrane depletion - converging on Schwann cell apoptosis and failure of myelination, then demyelination and the clinical phenotype.

    The edge from demyelination to sensorineural hearing impairment carries causal_link_type UNKNOWN deliberately: hearing loss is the feature that distinguishes CMT1E and none of the cited sources shows the auditory lesion that produces it. A knowledge gap records the otoacoustic-emission phenotyping that would distinguish auditory neuropathy from a cochlear sensory lesion.

    Two REFUTE evidence items: PMID:34332267 against hearing loss being constant (a whole family with none), PMID:21393063 against ascorbic acid as a treatment.

    Deep research reconciliation. Curated from the committed OpenScientist report. Two corrections to its ontology suggestions are recorded in notes: it gives 'myelinating Schwann cell (CL:0002573)' where CL:0002573 is Schwann cell and CL:0000218 is myelinating Schwann cell. Every snippet the report supplied was re-fetched into references_cache and verified against the cached record rather than taken from the report; one (the cholesterol quote) needed the full sentence restored.

    Reference titles: several reference_title values were initially written from the report's descriptive text rather than copied from the cache frontmatter, and were caught by the title check. All are now copied verbatim from the references_cache title field.

    Validation: just validate, just validate-terms, just count-verified-snippets (24/24), check-duplicate-keys, check-entity-refs, check-causal-targets.

    Review round 1 (PR #12509). Four IMPORTANT items taken plus most suggestions.

    diagnosis: added, and the testing-ORDER point is the one that mattered - it is the
    practical consequence of this entry's whole not-gene-dosage thesis. Sequencing
    first calls a CMT1A patient negative; stopping at dosage analysis calls a CMT1E
    patient negative.

    Curcumin added to treatments, graded MODEL_ORGANISM with the authors' own
    "partially" preserved, and the description states there is no human trial.

    Two mechanism branches added: altered store-operated calcium handling
    (PMID:31213528) and extracellular matrix remodelling with macrophage-derived
    MMP-2/-9 (PMID:12421361). Both PROVISIONAL with INDIRECT edges. The MMP branch is
    the only route in this entry to a cell type other than the Schwann cell.

    prevalence: added for CMT as a whole in children, with the population field and the
    notes both stating explicitly that it is not CMT1E-specific.

    Reference screening recorded in notes for every cached PMID not cited.

    Three of the five HP CURIEs the reviewer supplied resolve to different concepts:
    HP:0009830 offered as foot drop is Peripheral neuropathy, HP:0003701 offered as
    distal amyotrophy is Proximal muscle weakness, HP:0001268 offered as cognitive
    impairment is Mental deterioration. HP:0001765 Hammertoe and HP:0002093 Respiratory
    insufficiency are correct and are used. Distal amyotrophy is curated as HP:0003693.
    Foot drop and cognitive impairment were not added: the correct term for foot drop
    would be HP:0009027 Foot dorsiflexor weakness and no cached source names it, and
    Mental deterioration asserts decline from a baseline that no source reports.

    Hammertoe is curated WITHOUT an evidence block, deliberately: the term is right but
    no cached sentence names hammertoes, and the node description says so.

    Pes cavus re-sourced to a sentence that names it, replacing the
    "musculoskeletal deformity" snippet the previous review_notes had self-flagged.


- type: REVIEW
  outcome: changed

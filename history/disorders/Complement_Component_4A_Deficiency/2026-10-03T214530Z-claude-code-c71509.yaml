  summary: 'Create: Complement Component 4A Deficiency'
  details: |
    Curated homozygous C4A deficiency (zero functional C4A, C4B present) as entry_type DISEASE from a Perplexity deep-research report (treated as leads) and 13 cached PMIDs. Scoped as a genetic risk state for SLE rather than a high-penetrance Mendelian disease; heterozygous partial deficiency curated as a RISK_FACTOR genetic record and complete C4 deficiency as a differential. Pathophysiology chain: absent C4A protein -> reduced immune complex/apoptotic clearance -> tolerance breakdown -> SLE, with C4-knockout-mouse edges graded INDIRECT. Phenotypes: SLE, decreased circulating C4, lymphoma, celiac disease, adverse drug response, pericarditis. KNOWLEDGE_GAP on HLA (8.1/DRB1*03:01) confounding and HUMAN_MODEL_MISMATCH on C4-knockout fidelity. Validated: just validate, validate-terms, 17/17 snippets verified; stub deleted.

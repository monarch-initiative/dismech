  summary: 'Create: TRIO-Related Neurodevelopmental Disorder MRD44/MRD63'
  details: |
    Initial de-novo lumped entry for TRIO-related NDD for issue 6107 routed from lit-scan 6041. One disorder with two head-size subtypes: MRD44 microcephaly GEFD1 loss-of-function and MRD63 macrocephaly seventh-spectrin-repeat gain-of-function, unified by direction of effect on TRIO-mediated RAC1 activity. Pathophysiology debundled into the shared TRIO-RAC1 GEF axis branching into LoF/hypoactivation and GoF/hyperactivation arms converging on impaired dendritic/synaptic morphogenesis. Evidence anchored on verified cohort/functional literature: Pengelly 2016 PMID:27418539, Barbosa 2020 PMID:32109419, Schultz-Rogers 2020 PMID:33167890, Sadybekov 2017 PMID:28928363. Every snippet verified as an exact substring of the fetched abstract; several recalled PMIDs were discarded after fetch-verification revealed wrong papers. MONDO anchors MONDO:0014892 MRD44 and MONDO:0032939 MRD63 verified reachable via authoritative sqlite:obo:mondo. just validate passed schema+terms+references.

  summary: 'Create: TRIO-Related Neurodevelopmental Disorder (MRD44/MRD63)'
  details: |
    New lumped gene-anchored entry for TRIO (hgnc:12303) RhoGEF neurodevelopmental disorder covering MRD44 (OMIM 617061; MONDO:0014892; microcephaly; GEFD1 loss-of-function -> RAC1 hypoactivation) and MRD63 (OMIM 618825; MONDO:0032939; macrocephaly; seventh-spectrin-repeat and second-SH3-domain gain-of-function -> RAC1 hyperactivation) as has_subtypes carrying their own subtype_term MONDO anchors. Pathophysiology models the opposite-direction, domain-specific RAC1 dysregulation converging on dendritic-spine / glutamatergic-synapse dysfunction, with head size tracking RAC1 activation level. Evidence from Barbosa 2020 (PMID:32109419), Pengelly 2016 (PMID:27418539), and the seed Zhang 2026 (PMID:42421094). All 21 evidence snippets verified as exact substrings of fetched abstracts; schema, term, and reference validation pass. Added MONDO:0014892/0032939 and GO:0016601/0051966/0060997 to the enum cache. Routed from #6041; addresses #6107.

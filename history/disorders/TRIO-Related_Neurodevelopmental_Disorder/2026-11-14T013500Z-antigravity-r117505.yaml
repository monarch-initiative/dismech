  summary: Address Round 1 PR review feedback on TRIO-Related Neurodevelopmental Disorder
  details: >-
    Added missing GeneReviews and cohort phenotypes (Feeding Difficulties
    HP:0011968, Failure to Thrive HP:0001508, Dental Abnormalities HP:0000164,
    Constipation HP:0002019, Scoliosis HP:0002650, and Congenital Heart Defect
    HP:0001627) backed by PMID:28796471 and PMID:32109419 and connected them in

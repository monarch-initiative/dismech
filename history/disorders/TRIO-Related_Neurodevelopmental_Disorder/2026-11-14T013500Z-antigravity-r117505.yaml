    evidence on downstream edges to Microcephaly, Macrocephaly, and Recognizable
    Facial Dysmorphism, updated Genetic Counseling to cite the 50% offspring
    transmission-risk and prenatal/preimplantation testing sentences from
    PMID:28796471, and added a Multidisciplinary Surveillance treatment entry
    from the GeneReviews surveillance guidance.

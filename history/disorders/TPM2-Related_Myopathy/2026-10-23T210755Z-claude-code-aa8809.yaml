  summary: 'Create: TPM2-Related Myopathy'
  details: |
    New gene-defined Disease entry for TPM2-related myopathy (MONDO:0100196), claimed in issue 15399. Entry type decided as DISEASE: the nemaline, cap, fibre-type-disproportion and core-rod presentations share one pathograph and co-occur within families and serial biopsies, so they are has_subtypes rather than separate entries; the recessive Escobar/multiple-pterygium form is a further subtype. The TPM2 distal arthrogryposes (DA1A, DA2B, DA7) are recorded as a differential diagnosis because MONDO places them outside this class. The pathograph branches from abnormal tropomyosin-actin association into reduced calcium sensitivity, increased calcium sensitivity (hypercontraction and contractures), altered cross-bridge kinetics and sarcomeric disorganisation, converging on reduced fibre force. Evidence was gathered by PubMed search (eutils) and just fetch-reference for 29 PMIDs plus the ClinGen CGGV record for TPM2 (Definitive, AD). The Falcon deep-research run was requested with fallback; Falcon was not configured, so it fell back to OpenScientist (research/TPM2-Related_Myopathy-deep-research-openscientist.md; 15/15 references verified, 0 off topic). The entry was drafted from primary literature first; the report then contributed the anticholinesterase-responsive cap myopathy case (PMID:25127990), added as a treatment and a fatigable-weakness phenotype. just preflight-dr was not run because the local MONDO build is absent in this environment. No TPM2-specific GeneReviews chapter exists; the two retired disease-wide chapters are tagged. Validated with just validate (90 snippets verified), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-genereviews.

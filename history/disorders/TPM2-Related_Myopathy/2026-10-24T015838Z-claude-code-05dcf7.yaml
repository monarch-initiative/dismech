  summary: 'Review round 1: TPM2-Related Myopathy'
  details: |
    Addressed the first automated review. Added a Scoliosis phenotype (HP:0002650) quoting the PMID:24692096 full-text sentence that axial contractures are usually scoliosis, and renamed the Spinal Rigidity preferred term to Rigid spine so the two are distinct; both are linked from Reduced Muscle Fibre Force Generation because the source ties axial contractures to the non-hypercontractile class. Regraded the skinned patient-fibre mechanics studies (PMID:18420702, PMID:17430991) and the two PMID:23378224 sentences describing recombinant-protein and cultured or dissected fibre experiments from HUMAN_CLINICAL to IN_VITRO, consistently within the file. Replaced the background-only evidence on the force node with the R133W specific-force measurement. Cited four previously uncited references (PMID:23886664, PMID:29097206 for raised calcium sensitivity, PMID:33919826 for reduced calcium sensitivity, PMID:23401156 for the distal arthrogryposis differential) and removed two uncited caches: PMID:27659899, a gene-agnostic nemaline myopathy review, and PMID:25079567, which describes an NEB patient rather than a TPM2 one. Bound NCIT:C47792 as the anticholinesterase therapeutic_agent and linked the treatment to Fatigable Weakness. Added the TPM2/TPM3 pooling caveat to the trismus evidence and a note on why MONDO:0007294 central core myopathy is not mapped. No feeding-difficulty phenotype was added because no cited TPM2 source states it. Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments and check-snippet-grading.

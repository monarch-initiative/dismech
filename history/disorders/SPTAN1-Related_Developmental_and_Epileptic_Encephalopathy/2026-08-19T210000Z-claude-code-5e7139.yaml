  summary: 'Create: SPTAN1-Related Developmental and Epileptic Encephalopathy (DEE5)'
  details: |
    New entry for SPTAN1-related DEE5 (MONDO:0013277), curated from a claude_code deep-research report. NEC preflight PASS: SPTAN1 mentioned 56 times and OMIM 613477 matches the MONDO xref, with the second reported OMIM 182810 being the SPTAN1 gene record. Note this MONDO term already appeared in the KB as a related-disease cross-reference inside SPTBN4-Related_Neurodevelopmental_Disorder, but never as a disease_term, so this is a genuinely new entry that the existing cross-reference effectively invited. The report's reference validation flagged needs_review with one unresolved DOI and one off-topic reference. The unresolved DOI, 10.1172/JCI95743, was a markdown-link parsing artifact rather than a fabricated paper; it was independently resolved through the NCBI ID converter to PMID:29337302, verified as the correct JCI paper on alpha-II spectrin in brain development, fetched, and cited. That re-check is recorded here explicitly rather than being done silently. The off-topic reference PMID:28838957 was fetched, confirmed to be a paper on vascular endothelium and pulmonary epithelial differentiation with no relation to SPTAN1, not cited, and its cache file removed. No GeneReviews chapter exists for SPTAN1. Pathophysiology is 15 atomic nodes. The chain from variant to aggregation is deliberately split into three steps rather than one, because assembly of the mutant heterodimer still occurs and only its stability fails, so thermolability and aggregation are separate claims. The most important curation decision is that Elevated Action Potential Threshold is recorded in the direction the measurement actually went, which is opposite to the naive expectation for an epilepsy gene, and is kept as its own node rather than merged into an excitability claim. Three discussions: a CONTROVERSY on how a lesion that raises the single-neuron firing threshold produces seizures, with reduced inhibitory innervation as the candidate resolution and the cell-type-resolved comparison that would test it stated as a proposed experiment; a HUMAN_MODEL_MISMATCH on no published animal model carrying an in-frame heterodimerization-repeat allele, where the conditional knockout cannot aggregate and the R1098Q mouse sits in repeat 10 and produces a milder ataxia phenotype; and a KNOWLEDGE_GAP on whether the hallmark hypomyelination is cell-autonomous in oligodendrocytes, non-cell-autonomous from abnormal axons, or secondary to the encephalopathy. The conditional knockout carries a FAILS_TO_RECAPITULATE link against the aggregation node, substantiated by the finding that heterozygous null mice show no haploinsufficiency phenotype. Validation: just validate passed with 46 of 46 snippets verified against cached references after correcting one mis-transcribed snippet, term validation passed, no duplicate keys, no new title-quoting or under-length snippets, and 6570 tests passed.

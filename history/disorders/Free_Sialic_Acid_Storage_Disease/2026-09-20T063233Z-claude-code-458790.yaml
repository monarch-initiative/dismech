  summary: 'Genetics pass: bind SLC17A5 to all three FSASD subtype rows with evidence'
  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    SLC17A5 was already curated with relationship_type: CAUSATIVE,
    variant_origin: GERMLINE, a variants: block, and a gene binding on the
    upstream node. The gap was the three has_subtypes rows: infantile FSASD
    (MONDO:0010027, the checklist term), Salla disease (MONDO:0011449) and
    intermediate severe Salla disease (MONDO:0017737) each carried no genes: list,
    even though the entry's own evidence names SLC17A5 as the gene for all three.

    Added genes: SLC17A5 to all three rows, each with the PMID:37713976 sentence
    that enumerates the three forms as SLC17A5 disease. That sentence sits in the
    paper's BACKGROUND section and restates established FSASD genetics rather than
    the study's own finding, so quote_role: BACKGROUND was set on the new items
    and on the pre-existing copy of the same quote.

    This is an onset/severity spectrum on one gene, so no per-subtype gene
    differentiation exists to curate and no case_fractions apply.

    Validation: just validate, validate-terms, count-verified-snippets (79/79),
    check-genereviews (already TAGGED), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings), validate-disorders.

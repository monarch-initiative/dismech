  summary: Add hs-cTn ascertainment definition and troponin specificity caveat
  details: |
    Curated issue #6065 ([preprint-scan] PPR:PPR1272216, DataLoch Heart Disease Registry). Added a PHENOTYPE_ALGORITHM definition recording the high-sensitivity cardiac troponin ascertainment used for emergency-department suspected-ACS cohorts (troponin-tested denominator plus Universal Definition 99th-centile case rule), with validation_status UNVALIDATED because the threshold is not specific for the type 1 atherothrombotic mechanism this entry models. The definition attaches_to pathophysiology#Myocardial Ischemia and Cardiomyocyte Death, the node whose troponin release the threshold actually detects, so the point of the definition is structurally visible rather than prose-only; the threshold and assay-timing criteria sit in laboratory_requirements rather than inclusion_criteria. Added a PARTIAL evidence item plus notes to the existing Elevated cardiac troponin biochemical marker recording that sensitivity and mechanistic specificity diverge, and carrying the registry's 73-to-47 per 1000 diagnostic-yield trend as attributed, preprint-labelled prose. The preprint is never sole support for a mechanistic claim: the injury-versus-type-1-MI caveat and the threshold rule are both carried by the peer-reviewed cluster-randomised High-STEACS trial (PMID:30170853).

    Review response (PR #8466, ai4c-reviewer CHANGES_REQUESTED): the two ANNUAL_INCIDENCE prevalence records originally proposed for the 73/47 per 1000 yield were removed. They were solely supported by the preprint, which issue #6065 forbids as sole support, and they would have been the only prevalence block on the entry, so a consumer reading rate_per_100000 (7300.0) or prevalence_class (ABOVE_1_IN_1000) would have received a test-positivity yield inside a clinician-selected denominator as if it were population incidence, roughly 25-30x the true adult rate. The biochemical notes now record explicitly why those figures are not curated as prevalence, so the decision is not silently re-litigated. The Fourth Universal Definition of MI (PMID:30165617) was fetched to cite the threshold rule primarily as the reviewer suggested, but the fetcher returns content_type unavailable for it (no retrievable abstract or full text), so no snippet could be verified and it is recorded in the definition notes rather than added as an unquotable evidence item.

    Validation: just validate (schema, terms, references) passed; reference_snippet_audit --strict reported 14/31 verified with 17 skipped by prefix and exit 0; just check-title-snippets reported OK.

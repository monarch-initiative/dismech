  summary: Add hs-cTn ascertainment definition and troponin-tested MI yield trend
  details: |
    Curated issue #6065 ([preprint-scan] PPR:PPR1272216, DataLoch Heart Disease Registry). Added a PHENOTYPE_ALGORITHM definition recording the high-sensitivity cardiac troponin ascertainment used for emergency-department suspected-ACS cohorts (troponin-tested denominator plus Universal Definition 99th-centile case rule), with validation_status UNVALIDATED because the threshold is not specific for the type 1 atherothrombotic mechanism this entry models. Added two ANNUAL_INCIDENCE prevalence records for the myocardial-infarction diagnostic yield among troponin-tested ED patients (73 per 1000 in 2014, 47 per 1000 in 2024), with notes stating explicitly that this is a diagnostic yield in a selected tested denominator, not a general-population incidence. Added a PARTIAL evidence item plus notes to the existing Elevated cardiac troponin biochemical marker recording that sensitivity and mechanistic specificity diverge. The preprint is never sole support for a mechanistic claim: the injury-versus-type-1-MI caveat and the threshold rule are both carried by the peer-reviewed cluster-randomised High-STEACS trial (PMID:30170853). Validation: just validate (schema, terms, references) passed; reference_snippet_audit --strict reported 14/31 verified with 17 skipped by prefix and exit 0; just check-title-snippets reported OK.

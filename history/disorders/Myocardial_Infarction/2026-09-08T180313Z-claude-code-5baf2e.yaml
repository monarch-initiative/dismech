  summary: 'Review round 2: complete CAUSE_UNREPRESENTED tagging, correct assays claim'
  details: |
    Round-2 review response on PR #11061. The approving review left five non-blocking suggestions; all five were taken in one push.

    (1) CAUSE_UNREPRESENTED was tagged on only 2 of the 8 modeled_mechanisms links while the accompanying report asserted all eight carried it. Added the divergence to the remaining six, each with its own description naming how ischemia is imposed in that model: diffusion limit in the organoid, device gas control on the two gradient chips, medium-switch protocol on the two ischemia-reperfusion constructs. The report sentence is now backed by the data; previously it claimed a queryability the entry did not provide, which is the same defect as a stale notes: sentence.

    (2) The design-decisions register row asserted 'assays is OBI-bound and used on 0 of 289 readouts'. Measured against the current tree this is wrong, not merely stale: 284 of the KB's 3,091 readouts carry assays, 514 entries across 82 files. What is at zero is the ontology binding - not one of the 514 entries carries a term:. The tooling-gap conclusion survives and is strengthened, since curators reached for the slot and were stopped at the binding. Register row rewritten to state the corrected finding and to carry no pinned counts; report bullet corrected with an explicit note of what the earlier revision got wrong.

    (3) Added CL:0002570 (mesenchymal stem cell of adipose tissue) to the Richards organoid cell_types. The cached reference states the construct is 50% hiPSC-CMs and 50% non-myocyte at a 4:2:1 ratio of fibroblasts, HUVECs and hADSCs; cell_source named the hADSCs but the ontology-bound list omitted them.

    (4) Rebound the HL-1 model's cell type from CL:0000746 (cardiac muscle cell) to CL:0002129 (regular atrial cardiac myocyte), so the chamber mismatch is visible in the binding rather than only in the SPECIES_MISMATCH divergence prose. preferred_term carries the immortalized-line detail the ontology term does not.

    (5) Narrowed an evidence explanation on the HL-1 link that read more into its quote than the quote carried. The snippet establishes the cells are HL-1; that the line is murine and atrial comes from its provenance, and the explanation now keeps the quoted and unquoted parts distinguishable.

    Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all pass; model-scale-audit --strict passes with CAUSE_UNREPRESENTED rising 4 to 10 KB-wide. check-snippet-grading reports one finding in MPI-Congenital_Disorder_of_Glycosylation.yaml, a file this branch does not touch - an artifact of the branch being behind main, as the reviewer independently noted.

  summary: Add spatially resolved in vitro cardiac models to Myocardial Infarction
  details: |
    Added an experimental_models block with five in vitro cardiac models, sourced from the citation list of Brenden et al., Spatiotemporal instrumentation of in vitro tissues (DOI:10.1016/j.celbio.2026.100576). All five share the property that pathology is spatially graded within the construct rather than applied uniformly: the Richards oxygen-diffusion-gradient cardiac organoid (PMID:32284552), the Rexius-Hall border-zone-on-a-chip (PMID:36475790), the Yadid human heart-on-a-chip IRI assay with an endothelial extracellular vesicle rescue arm (PMID:33055246), the Liu bioelectronically instrumented chip under acute hypoxia (PMID:32092276), and the Bannerman epicardial-myocardial Biowire II IRI chip (PMID:38683053). Eight modeled_mechanisms links target four existing pathophysiology nodes, each carrying fidelity, limitations and evidence-backed readouts. Every snippet was verified as an exact substring of its cached reference before being written. The Liu model is graded LOW fidelity and its limitations record that HL-1 is a murine atrial line, not human ventricular myocardium. Validated with just validate, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-snippet-grading.

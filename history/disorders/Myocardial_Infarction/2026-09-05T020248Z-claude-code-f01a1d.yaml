  summary: Add model_scale and typed divergences; correct stale schema-gap claim
  details: |
    Second round on PR #11061. Rebasing onto main brought in the model_scale and divergences slots on ModelMechanismLink (BiologicalScaleEnum, ModelDivergenceTypeEnum, ModelDivergenceMaterialityEnum), which had landed between this branch's original base and the rebase target. Two consequences were handled together. First, all eight modeled_mechanisms links added in the previous round now carry model_scale and typed divergences: SPECIES_MISMATCH/INVALIDATING on the HL-1 murine bioelectronic chip, BOUNDARY_OMISSION/INVALIDATING plus PROXY_QUANTITY on the border-zone chip's inflammation link, CAUSE_UNREPRESENTED on both models whose ischemia is imposed by diffusion limit or gas control rather than by coronary occlusion, and BOUNDARY_OMISSION on the remaining links. Second, the docs/reports schema-gap section and its decision-register row asserted that no slot on this path existed; that survey had been run against the pre-rebase base and was stale. Both were rewritten to state the correction explicitly, to record which claims the new slots now carry, and to narrow the remaining gap to positive measurement metadata: internal spatial comparator, sampling rate, and the unnamed comparator arm. The non-monotonic-direction item was withdrawn. Validated with just validate, check-enum-values, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and model-scale-audit --strict (exit 0).


    Also addressed the four actionable non-blocking suggestions from the ai4c-reviewer
    approval on PR #11061: removed CL:0000115 from the Yadid heart-on-chip cell_types
    because the authors state the construct consisted of only hCMs and the endothelial
    cells are the vesicle source rather than part of the tissue, recording that in the
    model description and in a cited BOUNDARY_OMISSION divergence; added a cited
    STRUCTURAL_IDEALIZATION divergence for the two-dimensional laminar monolayer geometry;
    replaced the cell-death readout snippet with the paper's direct live/dead measurement
    rather than the treatment-effect sentence; and added the two GEO series the source
    publication deposits (geo:GSE113871, geo:GSE115031) with their GEO titles copied
    exactly, verified by just verify-datasets, with their GEO_*.md caches committed. The
    reviewer's fifth point, that model_scale was unset, is answered by this round's
    model_scale values.
  details: |
    BLOCKING FINDING, now fixed. The S-HDL-PL% evidence item quoted 'while the ratio of phospholipids to total lipids in the small HDL percentage' -- a bare noun phrase that asserts nothing, leaving the actual claim (most protective metabolite for myocardial infarction, OR 0.63) only in curator prose. That is the defect class check-title-snippets exists to catch, and the sibling S-HDL-FC% entry in Familial_Hypercholesterolemia did it correctly. The snippet is now extended to carry the subject and its effect estimate -- 'the ratio of phospholipids to total lipids in the small HDL percentage (S-HDL-PL%; OR = 0.63 (0.59-0.67)' -- and a second evidence item quotes the predicate the reviewer identified, 'exhibited the most notable protective effect (Fig. 7e)', which occurs exactly once in the cache. Separately the XS-VLDL-L snippet was extended to include its own effect estimate '(OR = 1.55 (1.48-1.63)', so that number is quoted rather than asserted.

    Review round on PR #9308 (ai4c-reviewer, CHANGES_REQUESTED). The blocking finding was on Myocardial_Infarction; the rest of this round corrects an error of mine that the reviewer's suggestion 4 exposed.

    The error: the first round recorded that the source's AUC sentence 'could not be quoted as a clean ASCII snippet' because it contains U+2009 thin spaces, and MetRS was omitted from Chronic_Kidney_Disease on that basis. That reasoning was wrong. linkml_reference_validator's SupportingTextValidator.normalize_text lowercases, replaces every non-word non-space character with a space, then collapses runs of whitespace with the regex \s+ -- which in Python matches U+2009, U+2013, U+2212 and U+00D7 alike. Both sides of the comparison are normalized, so an ordinary-ASCII snippet matches thin-space and en-dash source text exactly. Every effect size and area under the curve in this tranche was quotable all along. The one genuine limit is that a multiplication sign cannot be transcribed as the letter 'x', because 'x' is a word character and survives normalization while U+00D7 does not; the q-value clauses are avoided for that reason.

    Validation for this round: all 15 PMID:40973818 snippets re-verified as exact and pure ASCII against the normalizer; `just count-verified-snippets` over the six files reports 452/523 verified, 71 skipped by prefix, 0 failures; check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-duplicate-keys and check-empty-snippets all pass; `just validate-disorders` over all six files exits 0 (its 12 reported issues are the pre-existing WARN-level unfetchable EGA and Metabolomics Workbench dataset accessions).

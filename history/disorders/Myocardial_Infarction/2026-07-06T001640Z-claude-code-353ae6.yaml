  details: |
    Integrated Falcon (Edison Scientific) deep-research leads into the previously thin entry after NEC preflight PASS (report is about acute type-1 MI: coronary atherothrombosis, ischemic cardiomyocyte necrosis, troponin, PCI/reperfusion; MONDO:0005068). Added 3 pathophysiology nodes with causal edges: Ischemia-Reperfusion Injury (MIRI; up to 50% of final infarct, MPTP opening, ROS, calcium overload, NLRP3 inflammasome); Post-Infarction Inflammation and Cardiac Repair (DAMP/TLR-NLR sensing, cardiac macrophage expansion, efferocytosis-to-repair switch); and Cardiac Fibrosis and Ventricular Remodeling (conforms_to cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling). Added phenotypes (Angina pectoris HP:0001681, Dyspnea HP:0002094, Ventricular fibrillation HP:0001663, Congestive heart failure HP:0001635, Syncope HP:0001279); biochemical markers (cardiac troponin with evidence, CK-MB context-only); a new Anti-Inflammatory/Immunomodulatory treatment (canakinumab NCIT:C80971, tocilizumab NCIT:C84217, therapeutic_modality MONOCLONAL_ANTIBODY); and the ARTEMIS ziltivekimab clinical trial (NCT06118281). 19 new evidence items. All PMIDs/DOIs/NCT fetched via just fetch-reference (no hand-created cache files). Every snippet independently verified as an exact whitespace-normalized substring of its cached abstract (24/24, 0 failures); note the reference validator skip_prefixes includes DOI, so DOI snippets are not machine-checked and were manually verified. Ontology terms verified with runoak and validate-terms. evidence_source OTHER for mechanistic reviews, HUMAN_CLINICAL for clinical sources. creation_date preserved; no updated_date. Validations: schema PASS, references PASS, terms PASS.

  summary: 'Create: Thrombocytopenia_3'
  details: |
    Curated Thrombocytopenia 3 (MONDO:0010120; FYB1/ADAP; CARST) as a single Disease entry from the two reported consanguineous families (Levin 2015, PMID:25876182; Hamamy 2014, PMID:25516138) plus ADAP mouse and platelet studies (PMID:29950291, PMID:36251748, PMID:17003372, PMID:24523237, PMID:19996090, PMID:30833485) and the cached ClinGen FYB1 / thrombocytopenia 3 record (Moderate, AR), regenerated with just fetch-reference. Input was the Perplexity sonar-deep-research report run with reasoning_effort=low; a medium-effort run was cut off by a connection drop at about 300 s, so the low-effort report was used. That report's reference validation resolved 19/19 identifiers but flagged DOI:10.1002/cyto.b.22192 as off-topic (not cited), and its term validation found 2 unresolved and 16 mislabelled CURIEs (for example HP:0008362 called Microthrombocytopenia); every CURIE in the entry was looked up independently via ols: or the local hgnc/mondo builds. Report claims not found in a cached source (heavy menstrual bleeding, prevalence figures, treatment recommendations such as tranexamic acid, platelet transfusion or HSCT) were dropped. preflight-dr verdict (coordinator): PASS. check-genereviews: NO_CHAPTER for GeneReviews and StatPearls after adding synonyms. Validation: just validate, validate-terms, count-verified-snippets (56/56), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments and list-disconnected-phenotypes (7/7 phenotypes connected) all pass; validate-disorders result recorded in the PR.

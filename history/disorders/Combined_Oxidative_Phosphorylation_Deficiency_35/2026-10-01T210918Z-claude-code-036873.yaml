  details: |
    Addressed the CHANGES_REQUESTED review on PR 13359, checking each item against the cached PMID:36047296, PMID:24901367 and PMID:35418828 text. Added a Diabetes mellitus phenotype (HP:0000819, OCCASIONAL, 2 of 15, both in the founding p.Arg323Gln sibship per review Table 1 and its discussion), left unwired because no source types the diabetes or attributes it to the OXPHOS defect. Added a glycaemic-screening (HbA1c and glucose profile) diagnosis item, following sibling entries that record surveillance under diagnosis. Removed diabetes from the notes list of uncurated features. Corrected the strabismus count from about 3 to 4 of 15, matching the Vision row of Table 1 (patients 1, 2, 3 and 11). Added a Dysmorphic Facial Features phenotype bound to HP:0001999 Abnormal facial shape (not in the coarse set, so no coarse_binding_basis), citing the review's conclusion and the PMID:35418828 case report; frequency omitted because Table 1 has no dysmorphology row. Added a fibroblast OXPHOS expression/activity diagnosis item quoting the review's recommendation for all newly diagnosed patients. Added a gastrointestinal line to notes (4 of 15: GERD, constipation, G-tube, malnutrition with constipation). Added link-level evidence to the S. pombe model from the PMID:24901367 Figure 3D legend, in which the p.Arg323Gln mutant fails to restore tRNASer(UCA) function; the Figure 3E glycerol-growth result was not cited because the legend says the mutant did not complement while the discussion says it partially complemented. The PMID:26857223 species-divergence item is kept.

  summary: 'Create: Combined_Oxidative_Phosphorylation_Deficiency_35'
  details: |
    New entry for COXPD35 (MONDO:0054742, TRIT1). Curated from the primary TRIT1 literature (the 2014 founding report, the 2017 matchmaking report, the 2019 blood/urine i6A biomarker report, the 2022 review of 15 patients, and later case reports from Korea, Turkey, Italy, Iran and Palestine) plus mechanistic papers on TRIT1 mitochondrial import, the human i6A37 substrate set, selenoprotein expression and the S. pombe tit1 deletion. One openscientist deep-research report was generated and used as a lead source (research/Combined_Oxidative_Phosphorylation_Deficiency_35-deep-research-openscientist.md; 14/14 references resolved, needs_review set only by term-table parsing artifacts and one obsolete GO term that was not used). just preflight-dr could not run because the local MONDO build is absent (exit 2); identity was checked manually: the report names TRIT1 31 times and cites OMIM 617873, which matches the MONDO xref read from OLS. From the report the entry took PMID:24126054 (human TRIT1 substrate set) and the more specific HP:0007766 Optic disc hypoplasia. Not adopted: the report's gnomAD constraint and ClinVar counts (its own unpublished analysis, not quotable), its statement that lactate is variably elevated (the 2022 review reports normal lactate in all nine patients tested), and its empirical mitochondrial-cocktail treatment list (no TRIT1-specific evidence). PMID:32088416 cached with no quotable text and is not cited. Pathograph: TRIT1 variants to loss of IPTase activity to mitochondrial and cytosolic tRNA i6A37 hypomodification, mitochondrial translation defect, complex I/IV deficiency and impaired OXPHOS, wired to 16 of 21 phenotypes; strabismus, optic disc hypoplasia, hearing loss, atrial septal defect and diabetes are left unconnected because no source attributes them to a mechanism. Validated with just validate, validate-terms, count-verified-snippets (74/74), check-entity-refs, check-causal-targets, check-duplicate-keys, the whole-KB offline gates and validate-disorders.

  summary: 'Create: Fowler Syndrome (MONDO:0009168, FLVCR2)'
  details: |
    New entry for IEMbase metabolic work-package WP-006 row 2.3.06.01 (issue #5561). Ten-node pathograph from biallelic FLVCR2 loss of function through impaired endothelial solute transport to glomeruloid vasculopathy, clastic CNS injury, and the fetal akinesia deformation sequence. The contested substrate identity (choline/ethanolamine vs heme) is curated as two hypothesis groups converging on one endothelial node rather than resolved, with a CONTROVERSY discussion covering the additional import-vs-export disagreement between the two 2024 choline papers. Two mouse models with modeled_mechanisms and readouts, including a REFUTE-graded readout for the paradoxical rise in brain choline after endothelial-specific deletion. NEC preflight: MONDO:0009168 xrefs OMIM:225790 matching the seed row; FLVCR2 hgnc:20105 read from the HGNC REST API; FLVCR1 (hgnc:24682) is a distinct gene already curated separately. Validation: just validate passed (schema, terms, 83/83 snippets verified); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all clean.

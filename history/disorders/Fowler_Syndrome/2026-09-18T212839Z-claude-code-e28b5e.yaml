  details: |
    Addressed the one blocking item of PR #11853's review: the entry had no diagnosis: section, while two evidence items filed under the genetic-counselling treatment were in substance diagnostic. That matters more than usual for this disease because diagnosis is the entire clinical pathway - there is no disease-modifying therapy. Added three Diagnosis entries. (1) Prenatal ultrasound, bound NCIT:C17230 Ultrasound Imaging, citing the already-cached PMID:12493052 first-trimester trigger sentence; the description states that imaging raises suspicion but does not establish the diagnosis. (2) Neuropathological examination at autopsy, bound NCIT:C25153 Autopsy, citing the PMID:20014121 sentence that autopsy is essential to differentiate Fowler syndrome from other causes of hydrocephaly and hydranencephaly, with the recurrence-risk rationale. (3) FLVCR2 molecular genetic testing, bound NCIT:C19770 Molecular Analysis, citing PMID:20206334 ('Direct sequencing of candidate genes within the target interval revealed five different germline mutations in FLVCR2 in five families with Fowler syndrome'), graded directness: INDIRECT because that paper reports gene discovery in five families rather than evaluating sequencing as a diagnostic test, so its sensitivity in unselected cases is not addressed. All three NCIT CURIEs were read from cache/ncit/terms.csv and their membership in the TreatmentActionTerm dynamic enum confirmed in cache/enums/treatmentactionterm_b7dcb86faf99.csv before binding, not written from memory. On the treatment side, the purely diagnostic PMID:20014121 item was moved out of the genetic-counselling treatment into the autopsy diagnosis entry. The PMID:12493052 item was kept on the treatment rather than moved, because its quoted span ends 'Genetic counseling is recommended.' and so genuinely supports the counselling claim; its explanation was rewritten to rest on that sentence and to point at the diagnosis entry for the diagnostic trigger in the same quote. No new references were fetched; all three PMIDs were already cached and cited elsewhere in the entry. Validated with just validate (85/85 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-snippet-grading.

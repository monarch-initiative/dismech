  summary: 'Create: Cataract_21_Multiple_Types'
  details: |
    Created the MAF-related cataract 21 entry (MONDO:0012437). Input: a Perplexity sonar-deep-research report generated through a locally streaming-patched deep-research-client (dismech#9357, deep-research-client#94); its reference validation was 20/20 resolved with no unresolved references, and its 10 label mismatches were table-parsing artefacts (labels pulled from a neighbouring column), so no report CURIE was bound without a fresh lookup. Six-node pathograph: pathogenic MAF variant -> impaired MAF transactivation of crystallin and lens genes -> defective lens fiber cell differentiation -> lens opacification -> cataract phenotypes, with an R288P nuclear-foci sequestration branch (proposed dominance mechanism, in vitro), a c.177dup oxidative-stress/apoptosis branch (one allele, in vitro; edge to opacity left uncited and marked inferred), and an anterior segment branch to microcornea, iris coloboma, anterior segment dysgenesis, Peters anomaly and microphthalmia marked INDIRECT_UNKNOWN_INTERMEDIATES. Ayme-Gripp syndrome (MONDO:0010992) is the main differential, split by MAF domain. References not used: PMID:28482824 and PMID:42074498 (Ayme-Gripp cases), PMID:42498775 (single H187del square-lens image case, not clearly isolated CTRCT21), PMID:26694549 and the DOI-keyed mutation surveys (pooled cohorts or duplicated by PMID records), PMID:29314435 (pooled counts mixing Ayme-Gripp and isolated cataract, so not used for phenotype frequency), PMID:17262012, PMID:21402583, PMID:37180497, PMID:38927721, PMID:12543751 (general or unrelated). Nystagmus and posterior subcapsular cataract were left out because no cited abstract or full text documented them for MAF cataract specifically. The Gln303 allele is named Q303L in its source abstract but c.908A>C (Gln303Pro) in a later review table; recorded in the variant description. No ClinGen record cached for MAF, so gene_disease_validity omitted. just check-genereviews --online: NO_CHAPTER. Validation: just validate, validate-terms, count-verified-snippets 84/84, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, gene-activity grounding gate (ref mode), snippet-length, title-snippets, reference-titles, snippet-grading, validate-disorders.

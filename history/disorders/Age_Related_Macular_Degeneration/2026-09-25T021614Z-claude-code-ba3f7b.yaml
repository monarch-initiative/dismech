  summary: 'Genetics pass round 2: HMCN1 and TLR4 dispositioned, dry/wet rows anchored
    to MONDO'
  details: |
    Resumed session for the d2g series-034 genetics pass (issue #12241); the first session on this entry ended at a usage limit. This record covers the second half of the work and the review of the first.

    Enumerated the hierarchical children of MONDO:0005150 in OLS rather than working from the gap list alone, and found five children the list does not name. Two are the dry and neovascular clinical forms, which were already has_subtypes rows and are now anchored to MONDO:0100114 and MONDO:0005417. The other three are locus designations of the same OMIM-derived series carrying no causal-gene edge in MONDO, which is why a gene-keyed gap list cannot see them: MONDO:0011285 (ARMD1, HMCN1), MONDO:0012674 (ARMD10, whose only gene attribution is a design-pattern synonym naming TLR4) and MONDO:0014207 (ARMD14, C2 and CFB).

    Curated the two new genes as DISPUTED rather than leaving them as an assertion in notes. HMCN1 (hgnc:19194) rests on a Gln5345Arg variant in one family; two independent case-control studies found no difference in its distribution between cases and controls and found the variant in none of 258 cases, and both are cited as REFUTE. TLR4 (hgnc:11850) has two meta-analyses of the same two variants disagreeing with each other, one reporting an rs4986790 association and the other finding that no TLR4 association survives Bonferroni correction; both are cited. Neither gene is wired into the pathograph. ARMD14 needs no new content because C2/CFB was already curated as a susceptibility record.

    Reviewed the first session's additions and tightened three things. The ABCA4 record claimed its cases and controls came from the same population, which the source does not state, and presented the negative result more strongly than the authors do; the association now gives the two cohort sizes the abstract states, and the notes record that 18 cases and 12 controls carried candidate alterations and that the authors say larger cohorts may be needed, so DISPUTED reads as a failed replication rather than a demonstrated absence of effect. The TIMP3 record gained a note distinguishing its AMD rare-variant evidence from the Sorsby fundus dystrophy literature, which is cited in it only for where the protein sits; Sorsby has no entry in this knowledge base. One inheritance evidence item quoted four words, 'distributed across 34 loci', which check-snippet-length correctly refuses; it was merged into the neighbouring item so one evidence item now quotes the whole sentence, elided across the genome-wide significance threshold because that is typeset with a multiplication sign and a superscript.

    Every gene CURIE and symbol was read from a live HGNC lookup in the same step it was written, in both directions, and every MONDO CURIE and label from an OLS query.

    Validation at linkml-reference-validator 0.3.0rc1: this file passes validate, validate-terms and validate-disorders with no issues; count-verified-snippets verifies every snippet in it. The whole-KB gates listed in the companion MELAS_Syndrome record all pass. list-gene-term-mismatches examined 60 HGNC bindings across the two entries with 0 findings.

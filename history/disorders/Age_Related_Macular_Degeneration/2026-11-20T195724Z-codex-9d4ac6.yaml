  summary: Map Macular degeneration, age-related to OMIMPS:603075
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS603075 contains fifteen numbered age-related macular degeneration records in the January 2026 OMIM snapshot, organizing genetic susceptibility and reported familial associations. This entry represents the multifactorial age-related retinal disease, including dry and neovascular clinical forms and age and smoking contributions. RelatedMatch links that clinical entity to the genetic series without making it a union of fifteen deterministic Mendelian diseases or equating an associated allele with a diagnosis. The September 2026 MONDO:0005150 hierarchy includes clinical wet/dry categories and a macular dystrophy class as well as numbered forms; these are not interchangeable classifications. The mapping does not include every monogenic macular dystrophy involving one of the cited genes.

  summary: 'Genetics pass: polygenic inheritance, seven gene records, subtype series
    declined'
  details: |
    Genetics pass for the d2g series-034 gap list (issue #12241). Verified the entry's disease_term anchor against OLS first: MONDO:0005150 is age-related macular degeneration itself, so the gap list is not an artefact of an over-broad anchor.

    Declined all ten proposed subtype rows and recorded the reasoning in a top-level notes ruling. The nine OMIM-derived "age related macular degeneration N" MONDO terms are locus designations in a polygenic risk architecture, not clinically distinguishable gene-defined forms, so they are curated as genetic records with an explicit relationship_type rather than as has_subtypes rows; the two rows that stay are the dry and neovascular clinical forms. MONDO:0014515 macular dystrophy with central cone involvement, equivalent to OMIM:616170, is a recessive Mendelian macular dystrophy whose gene MFSD8 is already curated as the gene of neuronal ceroid lipofuscinosis 7, so it gets no row or gene record here.

    Added an inheritance block bound to HP:0010982 polygenic inheritance, sourced to the 16,144-case/17,832-control genome-wide association study reporting 52 variants across 34 loci and predominantly shared genetics between the two clinical forms.

    Added seven genetic records. Four are affirmed susceptibility genes: CFI and TIMP3 (rare coding variants implicating them as causal in that study), FBLN5 (rare missense variants in 1.7 percent of an AMD case series and none of the controls, all carriers with cuticular drusen, recorded as a case_fractions entry), and CST3 (p.Ala25Thr recessive effect, with the retinal pigment epithelium secretion mechanism). Three are graded DISPUTED and deliberately not wired into the pathograph: CX3CR1, where two 2015 meta-analyses of the same two variants reach opposite conclusions; ABCA4, where a whole-gene survey found no excess of candidate variants in 200 AMD cases versus controls and whose established disease is Stargardt disease; and RAX2, whose only AMD-adjacent evidence is three individuals with unspecified retinal degeneration in the original QRX report and whose established diseases are Mendelian inherited retinal dystrophies.

    Wired the affirmed genes into the pathograph: CFI onto the existing Complement-Pathway Genetic Susceptibility node, and a new Bruch Membrane Protein Homeostasis Gene Variation node carrying FBLN5, CST3 and TIMP3, located at UBERON:0003957 and feeding Outer-Retinal Extracellular Deposit Accumulation through an INDIRECT_UNKNOWN_INTERMEDIATES edge.

    Left the 10q26 ARMS2/HTRA1 node without a downstream edge, as its own description intends: the causal gene at that locus is unresolved and inventing a mechanism edge would assert more than the sources do.

    Every gene CURIE was read from a live HGNC lookup in the same step it was written. This session ended at a usage limit before validation was finished. Reference validation, the offline gates and the remaining curation were completed in the resumed session, recorded separately.

  summary: Link cigarette smoking to RPE oxidative stress
  details: |
    Backfill for issue #8085. Cigarette Smoking is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES into RPE Oxidative and Lysosomal Stress, the node where this entry places the earliest acquired injury and the step oxidative stress is understood to reach. The link type follows that mapped route rather than the quoted sentence, per the convention settled on PR #8408: the schema asks whether the field knows the intervening steps, not whether the cited sentence recites them. The predicate is predisposing rather than triggering because the carried item is an incidence comparison, long-term prospective cohorts showing significantly higher disease incidence in people smoking more than twenty cigarettes a day than in never-smokers, which is a statement about risk and not about the retinal pigment epithelium; it is graded PARTIAL for that reason. The cached review contains no sentence connecting smoking to oxidative stress or to the retinal pigment epithelium, so no stronger item was available to fetch from it. Older Age was NOT linked. Age is a demographic and host characteristic rather than an environmental exposure, the category error tracked in issue #8185; its single sentence also names age, genetics and environmental factors together without separating them.

  summary: Review Bell's palsy mechanisms, recovery and clinical evidence
  details: |
    Reviewed the entire pre-existing entry and three EDIT records, and cross-checked the ASTA report and all 20 citation leads. Used generated cached full texts for the GWAS, inflammatory MR study, SLIT2 rat injury study, surgical and pediatric cohorts, BellPIC author manuscript, clinical guidelines, synkinesis mechanisms and care, and laser trial. Read adult factorial RCT and Cochrane abstracts; full-text retrieval attempts were unsuccessful where noted in the local source ledger.
    Replaced West Nile encephalitis case-background support for idiopathic mechanisms; separated inflammation, edema, compression, conduction impairment, axonal injury, aberrant regeneration and ocular exposure. Restricted herpesvirus causality to a hypothesis. Demoted JAK/STAT and SLIT2 computational associations to explicit unresolved discussions, accounting for low PP.H4 or PPH3+PPH4 analyses and the mechanical rat model. Added ocular complications and mild periauricular pain, removed unsupported phenotype frequencies, corrected recovery time and incidence denominator, and retained unresolved noncoding GWAS target biology without fabricating a dataset accession.
    Added adult steroid timing/age scope, pediatric randomized uncertainty, antiviral recovery versus composite-sequela evidence, eye care, selective and timed electrodiagnostics, atypical-palsy reassessment, specialist synkinesis care, and experimental-treatment limitations. Checked live NCT metadata on 1 October 2026 and fetched ICTRP registrations. Documented the ten-participant intratympanic study, laser reporting inconsistencies, and outdated BellPIC recruitment status rather than interpreting registry rationale as efficacy.
    No established infectious etiology is asserted for the idiopathic syndrome. No GeneReviews chapter was identified by the committed Bookshelf index. Schema, ontology terms, 109 quotations and 140 titles passed batched validation before PR preparation; further repository gates are recorded with the PR.

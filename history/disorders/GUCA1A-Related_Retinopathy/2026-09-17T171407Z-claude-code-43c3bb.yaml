  summary: 'Address PR 9474 review: deep research, frequency fixes, module conformance,
    connected pathograph'
  details: |
    Follow-up on PR 9474 review (ai4c-reviewer, CHANGES_REQUESTED 2026-08-25).

    Deep research. Ran just research-disorder falcon GUCA1A-Related_Retinopathy with EDISON_API_KEY; the report is committed at research/GUCA1A-Related_Retinopathy-deep-research-falcon.md (769s, 39 citations). Its own reference validation resolved 10 of 10 identifiers with 0 unresolved and 0 off-topic; the single term-validation mismatch is the template string "if available" echoed beside MONDO:0700376, not a term error. just preflight-dr against MONDO:0700376 returned PASS (GUCA1A mentioned 53 times, top gene by a wide margin). Two papers the report surfaced were fetched, verified and consumed: PMID:15953638 (Michaelides 2005, one p.Tyr99Cys allele producing cone, cone-rod and isolated macular dystrophy within one family) and PMID:28125083 (Chen 2017, zebrafish p.Arg120Leu overexpression).

    Frequency corrections. Macular atrophy OCCASIONAL to VERY_FREQUENT on "Maculopathy was evident in all individuals on OCT imaging" (19/19); the description previously conflated the macular-dystrophy ERG pattern (2/13) with structural maculopathy, and that ERG figure now sits on the electroretinogram phenotype instead. Color vision defect FREQUENT to VERY_FREQUENT on the 84.2 percent figure. Photophobia stays FREQUENT but is now sourced on the GUCA1A-specific 78.9 percent rather than the class-level review, which is retained as a second item marked OTHER.

    Pathograph. The bundled node "Cone Photoreceptor Calcium Overload and Degeneration" was split into four atomic nodes: sustained CNG channel opening and outer-segment calcium overload (conforms_to phototransduction_cascade_dysfunction hash cGMP and Calcium Overload Handoff to Photoreceptor Degeneration), impaired cone light-response generation and delayed recovery (conforms_to the module key target, Failure of Photoreceptor Light-Response Generation or Timely Recovery), abnormal photoreceptor-to-ON-bipolar synaptic transmission, and cone photoreceptor degeneration. A fifth node, variable rod photoreceptor involvement, carries the peripheral pigmentary and nyctalopia phenotypes. Downstream edges now reach the phenotype layer; the graph has no integrity issues, no orphan targets, and no disconnected node other than the two non-mechanistic treatments.

    Conformance declined and why. The module node instructs a conforming disorder to also declare photoreceptor_degeneration conformance. That module is rod-first and models cone loss as non-cell-autonomous after rod elimination, whereas GUCA1A disease is cone-first because GCAP1 expression is higher in cones. Declaring conformance there would assert a sequence this disease does not follow. The reasoning is recorded in notes on the calcium-overload node.

    Cone-scoped light-response node. The Y99C transgenic mouse showed little change in the rod photoresponse despite raised dark outer-segment Ca2+, and human dark-adapted ERGs were normal in all but one tested patient. The node is therefore scoped to cones and the mouse link is recorded as FAILS_TO_RECAPITULATE with limitations and evidence.

    Added sections. prevalence (US extrapolation 1 in 247,143, recorded as 0.4 per 100,000 in BAND_1_9_PER_1000000, not the reviewer-suggested BELOW_1_IN_1000000, which the arithmetic does not support; plus an unbanded IRD-cohort-share record), progression (three phases: onset, 0.20 logMAR per decade acuity decline, structural macular staging), diagnosis (molecular testing, multimodal imaging, electrophysiology), animal_models (Y99C transgenic mouse with three mechanism links, GCAP1 RNAi rescue models, R120L zebrafish), onset descriptor on Progressive visual loss, a MALE phenotype_context on Reduced visual acuity, and three new phenotypes (central scotoma, peripheral pigmentary retinopathy, nyctalopia). Nyctalopia is banded OCCASIONAL, not the VERY_RARE first drafted: 5.3 percent falls inside the 5-29 percent band.

    GAIN_OF_FUNCTION now also sits on GeneticContext.functional_impact_category on the trigger node, with allele_type, variant_origin and zygosity, alongside the existing descriptor modifier.

    Validation. just validate passes: schema, terms, and reference validation clean, 57/57 snippets verified against cached references. Full tests/test_data.py: 6726 passed. check-duplicate-keys, check-title-snippets, check-entity-refs, check-folded-hyphens, check-empty-snippets, check-causal-targets and check-enum-values all clean. Every reference title was rewritten programmatically from the cache frontmatter rather than typed.

  summary: 'Create: GUCA1A-Related Retinopathy'
  details: |
    Fresh curation of GUCA1A-Related Retinopathy (MONDO:0700376), part of the retinopathy MONDO-coverage effort tracked on issue 4008. Modeled a 3-node pathograph: GCAP1 loss of calcium-dependent inhibitory control, conforms_to phototransduction_cascade_dysfunction hash Phototransduction Cascade Component Defect; then RetGC constitutive hyperactivity, conforms_to phototransduction_cascade_dysfunction hash Loss of Outer-Segment cGMP and Calcium Set-Point Control; then cone photoreceptor calcium overload and degeneration. Cross-referenced MONDO child terms MONDO:0011193 (COD3) and MONDO:0800326 (CORD14) via mondo_mappings narrowMatch rather than forcing has_subtypes, since the largest cohort PMID:39969478 shows the same variant class producing both cone-only and cone-rod phenotypes. Sourced via independent PubMed E-utilities search and verification, 7 PMIDs; EDISON_API_KEY/falcon available but not run this session given its 20+ minute typical runtime. Every snippet checked as an exact substring of the cached abstract via count-verified-snippets, 15/15 verified. No GeneReviews chapter exists for this disease. Validated with just validate: schema, term, and reference validation all pass clean.

  summary: 'Review response: CDG-IIw review rounds 1 and 2'
  details: |
    Review response on PR #10723, recorded separately because the CREATE record accurately describes only the CREATE and its 54/54 snippet count was true when written.

    Round 1 fixed six blocking items. The one that was a real error rather than an omission: fresh frozen plasma transfusion was bound to NCIT:C15431 (Hematopoietic Cell Transplantation), a term naming a completely different intervention. I had taken it from the term cache because it validated, without checking its meaning; the label matched the ID so just validate-terms passed. Corrected to NCIT:C116475 (Fresh Frozen Plasma Transfusion). The other five: cardiac involvement added (HP:0001626, bound at system level because the abstract says only 'cardiac issues'); reduced factor XI activity added (HP:0001929), so the antithrombin-plus-F11 pairing the entry argues is diagnostic appears as two phenotypes; the transferrin biomarker rebound from the generic HP:0012345 to HP:0012301 (Type II transferrin isoform profile); five missing reference_title values backfilled; and nine downstream edges added, taking phenotype connectivity from 2/16 to 10/18.

    Tooling note worth recording: I had run just normalize-reference-titles and read its '0 re-synced' as clean. That recipe only re-syncs titles already present. just backfill-reference-titles is the one that adds missing ones. The same confusion cost a round on three sibling PRs.

    Two additions in round 1 that the review did not ask for. Choanal atresia is probably not a feature of this disorder: the same report notes the proband's mother also had bilateral choanal atresia at birth, and the causal allele is de novo, so the mother cannot carry it and the atresia segregates independently in that family. The phenotype is kept because it was reported in an affected patient, with a REFUTE item recording the confound. And a KNOWLEDGE_GAP records why eight phenotypes stay unconnected: the glycosylation defect is confined to secreted liver-derived glycoproteins, with normal glycans in fibroblasts and undifferentiated iPSC, so no curated source supplies a route to the craniofacial, skeletal or cardiac findings.

    Round 2 (after approval) took the reviewer's own correction. The cardiac frequency band was VERY_FREQUENT on a 7/7 reading of the four-family cohort, but that cohort is seven of the nine described patients and the separately reported second patient had cardiac assessment documented normal twice, at birth and at age 11. That is 7/9, or 78 per cent, which is the FREQUENT band. Rebanded, with a REFUTE evidence item carrying the normal-assessment sentence so the denominator correction is visible rather than only asserted in prose. Also took the preferred_term precision suggestion on the two biomarkers that remain bound to the generic HP:0012345, which have no HPO term of their own: their preferred_term now carries the specific concept rather than echoing the ontology label.

    Validation: just validate passes; 60/60 snippets verified. All offline gates pass.

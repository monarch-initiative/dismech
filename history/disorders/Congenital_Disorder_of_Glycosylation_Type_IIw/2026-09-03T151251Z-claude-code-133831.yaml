  summary: 'Create: Congenital Disorder of Glycosylation, Type IIw (SLC37A4-CDG)'
  details: |
    De novo curation of SLC37A4-CDG (MONDO:0030437) as a Disease entry, distinct from the recessive glycogen storage disease Ib caused by biallelic variants in the same gene. Entry type decided DISEASE: the lesion is escape of a truncated transporter from the ER, not loss of transport activity, and the intact allele supplies normal glucose-6-phosphate handling, so none of the GSD Ib phenotype is present.

    Deep research: one openscientist run (research/Congenital_Disorder_of_Glycosylation_Type_IIw-deep-research-openscientist.md, 766s, 5 iterations). Its reference validation reported 17/17 resolved, confabulation_rate 0.0, but only 6 of 17 weighed as on topic; term_validation needs_review was true (3 obsolete GO terms, 1 mislabelled MONDO name). just preflight-dr PASSed with SLC37A4 mentioned 16 times, though it also flagged that the report carries OMIM 232220 (GSD Ib) alongside 619525, which is the gene-sharing conflation the on-topic ratio was signalling.

    Used from the report: PMID:10940311 (structure-function study showing the last 12 residues of the G6PT cytoplasmic tail are dispensable for transport activity, cited INDIRECT since it pre-dates the disease and was done on GSD Ib alleles) and PMID:37193126 (CDG hemostatic-defect review giving the antithrombin-plus-factor-XI signature and its diagnostic discriminating value). Deliberately not used: PMID:28126686 and PMID:35506446, which are about GSD Ib and G6PC3 neutropenia rather than this disorder, and PMID:41136424, a 2025 G6PT cryo-EM structure paper whose text is framed entirely around GSD Ib.

    The four primary sources are PMID:32884905 (index patient, Golgi retention model), PMID:33964207 (seven patients, four families, base-edited hepatoma line, non-Golgi localization), PMID:33728255 (second patient, phenotype expansion) and PMID:34245688 (nine patients, bikunin isoforms as a Golgi pH readout).

    The localization disagreement between PMID:32884905 and PMID:33964207 is curated as two mechanistic_hypotheses groups (golgi_retention_model CANONICAL, er_exit_site_model EMERGING) rather than resolved, with the shared downstream edge annotated to both. Two REFUTE evidence items are recorded deliberately: PMID:37193126 against the reassuring reading of the reported preserved procoagulant/anticoagulant balance.

    Validation: just validate passes (schema, terms, references); 54/54 snippets verified against the local cache. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all pass. reference_title values were filled with just normalize-reference-titles after hand-typed titles failed the title check.

  summary: 'Create: Transient_Neonatal_Zinc_Deficiency'
  details: |
    New entry for MONDO:0011973 (OMIM 608118), the SLC30A2-related low-milk-zinc deficiency of exclusively breastfed infants, curated from PubMed primary literature and one OpenScientist deep-research report (research/Transient_Neonatal_Zinc_Deficiency-deep-research-openscientist.md). The report's reference validation resolved 15 of 15 references with 21 of 21 quotes found; its term validation set needs_review because it labelled HP:0012354 as abnormal circulating zinc (HP calls it increased fucosylation of N-linked protein glycosylation), and that term was not used. just preflight-dr returned WARN only because SLC39A4 is mentioned as the acrodermatitis enteropathica differential, which was checked by reading those sections. Leads taken from the report: PMID:24451381, PMID:32320289 and PMID:32331308. The ZnT4 lethal milk mouse (PMID:26538236) was not used because it models a different gene. The pathograph runs from the maternal SLC30A2 lesion through lactocyte vesicular zinc loading and milk zinc secretion to infant intake, systemic deficiency and nine phenotypes, all causally connected; maternal and infant nodes are labelled in role fields, and notes record that the schema cannot state whose genotype a genetic or inheritance block describes. The ClinGen Definitive (AD) tier is copied from CGGV:assertion_c4bde390-ff71-42de-949c-2ebd37f18b1a-2025-01-24T050000.000Z. No GeneReviews chapter exists. Validated with just validate, validate-terms, count-verified-snippets (94/94), validate-disorders and the offline KB gates.

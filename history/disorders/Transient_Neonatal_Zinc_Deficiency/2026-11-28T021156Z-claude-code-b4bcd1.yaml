  details: |
    Added ten infant phenotypes (recurrent infections, lethargy, poor feeding, abdominal cramps, hoarse cry, sparse eyelashes, paronychia, cheilitis, stomatitis, decreased serum IGF-1) from cached case reports PMID:37082517, PMID:24194756 and the PMID:40371305 discussion, wired nine of them from the systemic zinc deficiency node, and enriched dermatitis (onset and diaper-area distribution), alopecia, diarrhea, growth faltering, serum zinc, alkaline phosphatase and milk zinc with further case evidence. PubMed, Europe PMC, OLS and OMIM were unreachable from the session, so curation used cached full texts only. Updated the description to mention the added features. Validated with just validate, count-verified-snippets (all verified), validate-terms and validate-disorders.

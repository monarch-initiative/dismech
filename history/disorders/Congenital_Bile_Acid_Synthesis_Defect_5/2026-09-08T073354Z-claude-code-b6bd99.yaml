  summary: 'Create: congenital bile acid synthesis defect 5 (CBAS5, ABCD3)'
  details: |
    Created kb/disorders/Congenital_Bile_Acid_Synthesis_Defect_5.yaml for MONDO:0014564 (OMIM:616278, hgnc:67 ABCD3), and deleted the corresponding stub. Preflight re-run against origin/main f7dac83a4d confirmed MONDO:0014564 was bound in no kb/ file, ABCD3 appeared only inside a datasets: record of Oculopharyngodistal_Myopathy.yaml, no has_subtypes entry carried the term, and no open PR curated it. Framing: MONDO gives this concept two parents (MONDO:0018841 congenital bile acid synthesis defect, MONDO:0100372 disorder of peroxisomal transporter); the causal chain is built on the peroxisomal transporter lesion because the beta-oxidation enzymes of the pathway were measured as normally active and the peroxisomes were matrix-import-competent in the index patient, so nothing in bile acid synthesis is catalytically broken - what fails is substrate delivery across the peroxisomal membrane. Both parents are recorded as skos:broadMatch mondo_mappings. Conformance: the trigger node conforms to peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect by its single-transporter arm, and deliberately not to that module's central effector, whose ether-lipid deficiency half is contradicted by the normal DHAPAT activity and fibroblast plasmalogen levels reported for the index patient; the hepatic arm is not conformed to cholestatic_liver_injury because the only reported liver histology shows normal interlobular bile ducts and no ductular reaction, which is the cholangiocyte hub that module is built around. Evidence: seven references, all fetched with just fetch-reference; 55/55 snippets verified against references_cache. The entity rests on two families - PMID:25168382 (index patient plus Abcd3-/- mouse) and PMID:41179737 (a second child with compound heterozygous ABCD3 variants found by exome sequencing in an 80-child unexplained-pediatric-liver-disease cohort, not covered by the deep-research report). The C24 bile acid deficit is graded MODEL_ORGANISM because it was measured in the knockout mouse and the index patient's plasma C24 species were above, not below, their reference intervals. A claude_code deep-research run is committed under research/; its citations were unusable - it attributed eleven claims to PMID:25326392, a zebrafish glucocerebrosidase paper in the same journal and year as the founding ABCD3 report - and its term suggestions included HP:0031994 (Bronchial breath sound, offered as a bile acid term) and the obsolete GO:0043433. Neither term was bound and none of its citations were used. Validation run to completion: just validate (schema, terms, references) passed; validate-terms passed; count-verified-snippets 55/55; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all OK; check-source-defect-claims raised nothing for this file.

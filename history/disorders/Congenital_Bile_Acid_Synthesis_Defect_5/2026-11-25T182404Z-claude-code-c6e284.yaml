  details: |
    The ABCD3 record was typed CAUSATIVE while carrying ClinGen's Limited classification (CGGV:assertion_f8d82e6f-8ee8-4944-898b-165916c13cac-2025-07-08T160000.000Z); the schema reserves CAUSATIVE for Definitive or Strong validity, so the record is now typed UNKNOWN and its notes say why. Two patients have been reported. On 'ABCD3 Loss of Function' the ABC-type fatty-acyl-CoA transporter activity (GO:0015607) modifier changes from the qualitative LOSS_OF_FUNCTION to DECREASED, matching the absent PMP70 in patient fibroblasts (PMID:25168382); the variant consequence stays LOSS_OF_FUNCTION in genetic_context. The peroxisome organization process had a sentence as its preferred_term; it now reads 'peroxisome organization (fewer, enlarged peroxisomes)'.

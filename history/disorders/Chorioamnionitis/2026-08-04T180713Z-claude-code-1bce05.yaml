  summary: 'Address PR #7921 re-review: prevalence subtype, label caches, NCIT finding_term'
  details: |
    Second round of PR #7921 review response (re-review of 8e6ff37; no CRITICAL, three mechanical IMPORTANT items). All three addressed plus all three non-blocking suggestions.

    1. Reverted subtype: Clinical on the preterm-labor prevalence record. The reviewer was right that this was a misassignment: the 14 percent figure is amniocentesis-detected SUBCLINICAL intra-amniotic infection, the opposite of the overt Triple I syndrome the Clinical subtype denotes. It is a fourth category the three-subtype axis does not cover, so the record is now unassigned with a notes: sentence saying so explicitly.

    2. Added the nine missing ontology label-cache rows to cache/{chebi,cl,go,hp,mondo}/terms.csv. These were never generated in this worktree because term validation only runs from the primary checkout here (the worktree venv is Python 3.14 and oaklib fails there), so the rows existed only in the primary. Copied the validator-generated rows verbatim rather than hand-authoring labels. This removes the live-OLS dependency that made the reviewer's first validate run fail on EBI read timeouts.

    3. Bound finding_term NCIT:C111944 Histologic Chorioamnionitis on the histopathology record (verified reachable from both NCIT:C83490 Histopathology Result and NCIT:C35867 Morphologic Finding) and added subtype: Histologic Acute. Recorded the companion NCIT placement gap in both the histopathology notes and the entry-level ontology-gaps paragraph: NCIT:C97077 Funisitis and NCIT:C117324 Fetal Chorionic Vasculitis exist but sit under NCIT:C2991 Disease or Disorder, so neither is reachable from the HistopathologyFindingTerm enum roots and neither is bindable.

    Suggestions also taken: restructured both staging axes using the Stage.substages slot, which carries description-only children needing no evidence and therefore dissolves the scoping constraint from the previous round. MIR Stage 1-3 and FIR Stage 1-3 are now structured rather than prose, while the attached evidence still covers only what the cited abstract supports. Corrected the PRR-to-NLRP3 edge wording so TLR engagement is described as signal 1 (priming) and inflammasome activation as signal 2, which is the canonical ordering. Note that Stage has no subtype slot, so the Histologic Acute association is stated in each stage description instead.

    Validation after changes: schema clean; term validation passed; reference validation 79/79 snippets verified; pytest tests/test_data.py 17102 passed; compliance 80.0 percent global on a denominator grown to 240 by the six new evidence-free substages, which are description-only by design. Every other scored path remains at 100 percent.

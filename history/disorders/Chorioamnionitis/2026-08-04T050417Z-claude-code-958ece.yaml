  details: |
    De-novo curation of Chorioamnionitis (MONDO:0000409), the first dismech entry for this disease. Deep research provider: claude_code (research/Chorioamnionitis-deep-research-claude_code.md; 775s, 31 web searches, report verified non-truncated by PMID grep before use). All PMIDs were independently re-derived from PubMed E-utilities rather than taken from the DR report on trust, and every snippet was verified as an exact substring of the cached abstract.

    Modeling decisions: the entry splits three things clinical usage conflates into has_subtypes - the intrapartum clinical syndrome (Triple I), the acute histologic placental lesion, and chronic chorioamnionitis (a CD8+ T-cell maternal anti-fetal rejection lesion that merely shares the name). The pathograph has 16 connected nodes running from vaginal dysbiosis through ascending invasion, a parallel sterile-alarmin trigger arm converging on shared TLR signaling, then chemotactic / uterotonic / matrix-degrading output arms, the fetal inflammatory response syndrome, and the neonatal brain and lung injury endpoints. PPROM feeds back onto the invasion node. Two mechanistic_hypotheses groups capture the gestational-age-dependent direction reversal of the uterine effect (preterm_uterotonic_activation CANONICAL vs term_myometrial_suppression EMERGING) rather than encoding a self-contradictory edge.

    Deliberate restraint: the BPD association is recorded as PARTIAL with the meta-analysis authors' own publication-bias caveat quoted; no genetic block was curated because the candidate-gene literature is unreplicated (recorded as a KNOWLEDGE_GAP discussion instead); a HUMAN_MODEL_MISMATCH discussion records that sheep intra-amniotic endotoxin models have epitheliochorial rather than hemochorial placentation.

    Ontology notes: HPO has no chorioamnionitis or funisitis term, and HP:0030244 (maternal fever in pregnancy) sits outside the HP:0000118 PhenotypeTerm enum root, so HP:0001945 Fever is bound with an explicit note. NCBITaxon:2098 carries the reassigned label Metamycoplasma hominis. Enum and label caches were seeded for terms verified reachable from their enum roots via oaklib.

    Validation: linkml-validate schema clean; term validation passed; reference validation 61/61 snippets verified against cached references; compliance 80.2 percent global / 80.4 percent weighted after reference_title backfill via scripts/add_pmid_titles.py.

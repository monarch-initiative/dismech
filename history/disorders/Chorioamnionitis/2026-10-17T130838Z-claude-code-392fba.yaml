  summary: Bind LOINC amniotic fluid bacterial culture code
  details: |
    LOINC tranche B batch 28. The amniocentesis row takes LOINC:596-7 (Bacteria identified in Amniotic fluid by Culture) for the organism half of a row that tests in parallel for organisms and for inflammation; the inflammation half is already carried by the amniotic fluid interleukin-6 and matrix metalloproteinase-8 markers.

    The code is bound at bacteria-identified level rather than per organism on purpose. The row names no single agent, and three of this entry's six agents are genital mycoplasmas, which routine culture does not recover - so a per-organism code would have asserted something the culture does not return. The amniotic-fluid specimen matches exactly.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status and deprecation checked per code, so each result set is complete rather than a ranked page; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

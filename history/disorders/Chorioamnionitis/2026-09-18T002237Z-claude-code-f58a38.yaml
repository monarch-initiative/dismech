  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block with the dominant ascending route from the lower genital tract and a second block for the minority non-ascending pathways (haematogenous spread from the oral cavity or intestine, retrograde seeding through the fallopian tubes, and direct introduction during an invasive procedure). The second block is what explains the entry's Fusobacterium nucleatum agent, an oral anaerobe that reaches the amniotic cavity haematogenously rather than by ascent. Evidence: PMID:33007269 (evidence-based management review; one sentence for each route). All six infectious agents were already bound, so only transmission was added. Validated with just validate, just count-verified-snippets (83/83 verified), and the batched just validate-disorders sweep.

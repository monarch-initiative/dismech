    Backfill for issue #8085. Obstetric instrumentation and prolonged labour is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into ascending microbial invasion of the amniotic cavity, carrying vaginal flora past the cervical barrier, with risk scaling by number of examinations rather than by any single procedure. Oral and periodontal infection targets the same node but as PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, because it is the exception to this entry's ascending model: oral Fusobacterium reaches the amniotic cavity haematogenously, and the available evidence is a single case demonstration rather than an established pathway. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 81 of 81 verified; integrity issue count unchanged. PR review found the instrumentation link targeting the wrong node. This entry states three times in prose that instrumentation acts on the cervical barrier: the barrier node carries role trigger and names cervical instrumentation in its own description, the environmental entry says these exposures act on the trigger node, and the new link's own description said examinations carry flora past the cervical barrier. The structured edge nonetheless skipped that node and pointed at ascending invasion downstream of it. It now targets Vaginal Dysbiosis and Cervical Barrier Breach as DIRECT. This also restores the contrast the two links were drawing, since instrumentation goes through the cervical barrier while oral Fusobacterium bypasses it haematogenously; with both pointing at the same node that distinction was invisible in the graph. Re-verified: 81 of 81 snippets.

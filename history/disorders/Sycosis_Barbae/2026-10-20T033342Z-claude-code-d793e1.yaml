  summary: 'Address review: split furuncle/carbuncle, fix treatment evidence, add
    I&D, colonization, shaving'
  details: |
    Response to the CHANGES_REQUESTED review on PR 14880.
    - Split the bundled 'Perifollicular Nodules, Furuncles, and Carbuncles' phenotype (HP:0200036 Skin nodule) into Furuncle (HP:0020083) and Carbuncle (HP:0020084), both looked up in OLS and found to be siblings under HP:0025084 Folliculitis; each takes the matching half of the PMID:25226722 sentence, both are wired from Deep Perifollicular Staphylococcal Inflammation, and Carbuncle is a sequela of Furuncle.
    - Decolonization: PMID:27820584 recurrence sentence regraded REFUTE; added the PMID:30859379 SUPPORT sentence (INDIRECT, SSTI-general); added a target_mechanisms link to a new colonization node.
    - Antibacterial therapy: added PMID:30859379 mainstay sentence (INDIRECT); kept PMID:22639852 with an explanation that records its overuse caveat; removed topical mupirocin from therapeutic_agent because no cited source names it for treating the infection.
    - Added Incision and Drainage (NCIT:C38067) targeting Furuncle and Carbuncle.
    - Diagnosis rebound to NCIT:C16490 Cytological Procedure, qualifier removed, unsupported culture claim dropped.
    - Added an upstream S. aureus colonization node and a recurrence progression phase from PMID:30859379 (INDIRECT).
    - Added a shaving environmental entry (PREDISPOSES, since the source says 'often associated with'); ECTO searched in OLS for shaving/shave/razor/hair removal/grooming with no results, so it is unbound.
    - Removed 'Folliculitis barbae' from synonyms: MONDO:1050000 lists only 'bacterial folliculitis' (related) and the cited review calls folliculitis barbae the superficial precursor.
    - Rewrote entry-level notes to describe scope; the deep-research provenance (OpenScientist fallback, 19/19 references resolved, five on-topic, preflight-dr SKIP with manual identity review) is recorded here instead.

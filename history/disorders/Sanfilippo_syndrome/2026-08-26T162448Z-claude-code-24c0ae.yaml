  summary: Add iPSC-derived SGSH neural progenitor cell therapy (PMID:42576387)
  details: |
    Curated the Mandolfo et al. 2026 iPSC-derived SGSH neural progenitor gene therapy result (PMID:42576387) into Sanfilippo_syndrome, then addressed the four blocking items in the PR #9408 review. The experimental_models entry was removed: every efficacy result in the abstract is in vivo NSG-MPSIIIA mouse data, so the entry duplicated the animal_models entry target-for-target and doubled the apparent evidence for one experiment. Removing it also cleared the four evidence_source: IN_VITRO values that were in fact mouse behavioural and histological results. Added an iPSC-derived SGSH-expressing neural progenitor cell therapy treatment (therapeutic_modality: CELL_THERAPY) with target_mechanisms edges to Lysosomal heparan sulfate accumulation, Neuroinflammatory cascade and Progressive central neurodegeneration, each with its own MODEL_ORGANISM evidence. Lowered the neurodegeneration link fidelity from HIGH to MODERATE to match its own limitations block, and replaced the strain name in genotype with the actual genotype. Validated with just validate (89/89 snippets verified), just validate-terms, just check-duplicate-keys, and the entity-ref and model-readout pytest lanes.

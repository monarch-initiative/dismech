  summary: Split the generic enzyme marker into four subtype-specific bindings (tranche
    D batch 3)
  details: |
    LOINC tranche D batch 3 (enzyme activity and metabolite assays). This is the sharpest call of the batch, by design: the coordinator's token-match pool entry for Sanfilippo captured only 'alpha-N-acetylglucosaminidase' (NAGLU, the enzyme for MPS IIIB specifically), but this entry's own has_subtypes structure covers all four Sanfilippo enzyme subtypes (MPS IIIA/SGSH, MPS IIIB/NAGLU, MPS IIIC/HGSNAT, MPS IIID/GNS), each with a genuinely different enzyme. The pre-existing biochemical[] marker ('Subtype-specific lysosomal enzyme activity') was deliberately generic across all four, naming all four enzymes explicitly in its own interpretation and evidence -- binding a single LOINC code to it would have misrepresented three of the four subtypes, exactly the NCIT:C96567-shaped trap the coordinator flagged for this batch, applied to a biochemical scope rather than a single wrong CURIE. Resolved by splitting the one generic marker into four subtype-specific markers, each with subtype: MPS IIIA/B/C/D stratification (the has_subtypes[].name foreign keys) and its own specimen-generic Part code: LOINC:LP14028-2 (Heparan-N-sulfatase, SGSH/MPS IIIA), LOINC:LP21324-6 (Alpha-N-acetylglucosaminidase, NAGLU/MPS IIIB), LOINC:LP14461-5 (Acetyl-CoA:glucosamine acetyltransferase -- LOINC's component name for HGSNAT, using the enzyme's older acetyltransferase-direction synonym rather than the heparan-alpha-glucosaminide form or 'HGSNAT' itself -- MPS IIIC), and LOINC:LP14033-2 (N-Acetylglucosamine-6-Sulfatase, GNS/MPS IIID). All four confirmed against the Monarch KG API in the step written; none requires a third-party copyright notice; none was already cached on origin/main (Sanfilippo is not on the RUSP panel); no collision with any of the four on any other open loinc-* branch's cache. The restructuring broke one pathograph causal edge: a pathophysiology node's downstream target named the old generic marker by its bare name ('Subtype-specific lysosomal enzyme activity'), which just check-causal-targets caught as a new dangling target once the node was renamed/split. Fixed by replacing that single edge with four edges, one per new subtype-specific marker name, each reusing the same PMID:31536183 quote and OTHER grading as the original (no new snippet-grading divergence). No reference_ranges band on any of the four new markers: each source states 'low activity' qualitatively, with no numeric cut-off. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass after the edge fix.

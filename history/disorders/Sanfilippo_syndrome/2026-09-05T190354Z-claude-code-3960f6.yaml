  summary: Add iPSC-derived neural progenitor SGSH gene therapy and its NSG-MPSIIIA
    rescue model
  details: |
    Lit-scan augmentation from PMID:42576387 (Mandolfo et al., Mol Ther 2026), plus the review round that followed.

    Added a treatment for ex vivo lentiviral SGSH gene transfer into iPSC-derived neural progenitors, with three target_mechanisms edges (RESTORES the heparan sulfate catabolism defect; INHIBITS storage accumulation and the neuroinflammatory cascade). Added the NSG-MPSIIIA mouse under animal_models with three modeled_mechanisms links and their readouts.

    The review round on PR 8853 changed five things. (1) The treatment term was NCIT:C15431 Hematopoietic Cell Transplantation, which is wrong and actively misleading here, because HSCT is a separate, distinct, and famously ineffective intervention in MPS III. Rebound to NCIT:C15238 Gene Therapy, matching the sibling gene-therapy treatment in this file, with the term choice and the CELL_THERAPY/GENE_THERAPY duality recorded in notes; NCIT has no clinical-action term for neural or non-hematopoietic stem cell transplantation. (2) The RESTORES edge quoted the methods sentence describing how the cells were built rather than any restoration result; swapped to the abstract sentence reporting high enzyme delivery. (3) All three animal-model links asserted RECAPITULATES or PARTIALLY_RECAPITULATES while every readout measured post-transplant therapeutic response; converted them to RESCUES, which is what the data are. The abstract reports no untreated-versus-wild-type baseline, so no recapitulation claim is made for this model, and that is recorded in notes. (4) Removed the fabricated "(Morris water maze)" parenthetical from a readout name: the abstract names no behavioural task, and Morris water maze assays reference rather than working memory. (5) Reworded a limitations string that called the graft both xenogeneic and allogeneic at once, and dropped the unsourced allele detail from genotype.

    Also downgraded the neurodegeneration link to fidelity LOW, since a behavioural outcome evidences functional recovery rather than reversal of neurodegeneration, and recorded the authors' hedge about graft integration versus secreted-enzyme cross-correction.

    Validation on the pushed tree: just validate passes with 88/88 snippets verified against cached references; just validate-terms passes; check-folded-hyphens and check-duplicate-keys clean.

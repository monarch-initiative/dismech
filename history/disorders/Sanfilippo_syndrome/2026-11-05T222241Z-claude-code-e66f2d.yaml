  summary: Add approved SGSH gene therapy (rebisufligene etisparvovec) treatment
  details: |
    Added rebisufligene etisparvovec (FAYUVI), the AAV9 SGSH gene therapy FDA-approved September 2026 for neurological manifestations of MPS IIIA in preserved-neurodevelopment pediatric patients. Source: PMID:42951601 (cached via just fetch-reference). Three snippets verified against the cache. Efficacy is from an uncontrolled comparison with external natural history controls, recorded as such. The existing investigational gene therapy row was left unchanged. Selected from low_effort issue 16058.

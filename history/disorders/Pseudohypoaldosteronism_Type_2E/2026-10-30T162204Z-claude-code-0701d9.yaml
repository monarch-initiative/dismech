  summary: 'Create: Pseudohypoaldosteronism Type 2E (CUL3)'
  details: |
    Created the CUL3 form of familial hyperkalaemic hypertension as a Disease entry (entry_type DISEASE). ClinGen's Tubulopathy GCEP record (CGGV:assertion_f697fb5e-...) classifies CUL3 to PHA2E as Definitive and states that the ClinGen Lumping and Splitting Working Group split PHA2E from the CUL3 neurodevelopmental disorder on differing molecular mechanism and clinical phenotype, which is the basis for curating it separately from kb/disorders/Neurodevelopmental_Disorder_With_or_Without_Autism_or_Seizures.yaml. That entry already listed PHA2E as a differential; this entry mirrors the link.

    Pathograph: a ten-node chain from CUL3 exon 9 skipping through loss of COP9 signalosome and CAND1 interaction, ligase dysfunction, KLHL3 depletion, WNK accumulation, SPAK/OSR1 activation and NCC overactivity to distal salt reabsorption, plus a parallel vascular arm (RhoA accumulation in vascular smooth muscle to impaired vasodilation). Six of ten phenotypes are causally wired. Four are deliberately left isolated with the reason recorded in each description: hypercalciuria (the NCC-mediated calcium mechanism is plausible but unstated by any cited source), dental abnormality (no mechanism described), vomiting (co-occurrence only), and decreased aldosterone (direction disputed).

    Two disagreements are recorded rather than resolved. The neddylation direction of CUL3-delta9 is a CONTROVERSY discussion: PMID:25250572 reports it more heavily neddylated and activated, PMID:26100637 reports neddylation and RBX1 binding significantly impaired, and PMID:29897280 and PMID:31813255 both call the mechanism unsettled. The origin of the hyperkalaemia is a KNOWLEDGE_GAP discussion: PMID:27378813 states NCC activation does not account for it and reports that the leading ROMK candidate was tested in the knock-in mouse and not found. functional_impact_category is DOMINANT_NEGATIVE on the cell-based evidence; the ClinGen record's own loss-of-function wording is noted on the validity assertion rather than overwritten.

    Aldosterone needed correcting during curation. An early draft carried decreased aldosterone on the strength of one case report; PMID:27369102 states aldosterone is most frequently normal or high, so that phenotype now carries both readings (SUPPORT and REFUTE) and no frequency, and the entry notes that the disease name misleads on this point.

    Deep research: research/Pseudohypoaldosteronism_Type_2E-deep-research-openscientist.md (openscientist, 24 min). reference_validation 21/21 resolved, 0 unresolved, confabulation_rate 0.0, 18/21 weighed on topic, 0 off topic. term_validation 22/23 verified with 5 label mismatches, one of which is substantive: the report offered HP:0004879 for hyperchloraemic metabolic acidosis, which HPO calls Intermittent hyperventilation. That term was not bound; HP:0004918 Hyperchloremic metabolic acidosis was looked up and used instead. just preflight-dr returned PASS (CUL3 mentioned 90 times, OMIM 614496 matching MONDO). The report supplied PMID:27369102 and PMID:31813255, which added hypercalciuria, dental abnormality, growth delay and the aldosterone correction.

    Three CURIEs written from memory in a first draft were caught by the pre-edit validation hook and replaced with looked-up values: NCIT:C2296 (Progestogen, not Renin) became NCIT:C113591; MONDO:0030879 does not exist and became MONDO:0030994 for the neurodevelopmental disorder, read from the committed entry; MONDO:0018962 (common mesentery) became MONDO:0019161 for pseudohypoaldosteronism type 1. just check-gene-activity-grounding then flagged CUL3 landing on a node with no molecular function; GO:0160072 ubiquitin ligase complex scaffold activity was taken from the ai-gene-review ingest table and bound without a modifier, because the direction is what the literature disputes.

    No GeneReviews or StatPearls chapter exists (just check-genereviews --online, NO_CHAPTER on both lines with five synonyms present).


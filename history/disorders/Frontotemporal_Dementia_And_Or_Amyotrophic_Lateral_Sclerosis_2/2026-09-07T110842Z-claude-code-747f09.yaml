  summary: 'Create: Frontotemporal Dementia And/Or Amyotrophic Lateral Sclerosis 2
    (CHCHD10)'
  details: |
    Created kb/disorders/Frontotemporal_Dementia_And_Or_Amyotrophic_Lateral_Sclerosis_2.yaml
    for MONDO:0014395 (FTDALS2, causal gene CHCHD10, OMIM:615911).

    Lump/split decision. Issue #8946 filed this term and closed it as
    not_planned/wontfix on a LUMP_INTO_PARENT recommendation, inviting a standalone
    entry only if it states what it adds beyond the parent. A standalone entry was
    created and that argument is written into the entry's notes: block. The
    substance is that both parent entries model FTD-ALS proteostatically
    (Amyotrophic_Lateral_Sclerosis carries a CANONICAL "Motor Neuron Proteostatic
    Failure Model"; Frontotemporal_Dementia describes its FTD-MND subtype as almost
    exclusively C9orf72-linked, both verified against the current files), whereas
    CHCHD10 disease runs through MICOS disassembly, cristae-junction loss, mtDNA
    instability, OMA1-mediated L-OPA1 cleavage and a maladaptive mitochondrial
    integrated stress response, with a mitochondrial myopathy on muscle biopsy that
    neither parent's mechanism predicts. Three things specifically would have no home
    on a mapping row: the muscle-first ordering, the MICOS-integrity severity axis,
    and the GeneReviews drug cautions. The other arms of the CHCHD10 allelic series
    (SMAJ p.Gly66Val, axonal CMT2, isolated mitochondrial myopathy p.Gly58Arg) were
    deliberately recorded as differential_diagnoses rather than has_subtypes, since
    they are separate diseases with their own OMIM entries.

    Deep research. falcon was the requested provider and failed with HTTP 402 (Edison
    account out of credits). Rather than substituting a provider by hand, the run was
    re-issued through the recorded fallback path
    (just dr_fallback='--fallback' research-disorder falcon ...), which produced
    research/Frontotemporal_Dementia_And_Or_Amyotrophic_Lateral_Sclerosis_2-deep-research-openscientist.md
    carrying fell_back: true, requested_provider: falcon and both provider_attempts in
    its frontmatter. The report validated 21/21 references with confabulation_rate 0.0.
    Its needs_review: true flag is driven entirely by term validation, not references:
    one obsolete term (HP:0002355) and two identifiers the report "names" with
    frequency-table cell values rather than labels (HP:0001638 named "Spectrum-dependent",
    HP:0009830 named "Allele-dependent"). None of those three is bound in this entry.
    just preflight-dr <report> MONDO:0014395 PASSED (CHCHD10 mentioned 82 times; report
    OMIM 615911 matches MONDO's), so no Named Entity Confusion.

    GeneReviews baseline. PMID:26131548 (CHCHD10-Related Disorders) was found, fetched,
    cached, and tagged GeneReviews in the top-level references: block. Every arm of its
    Clinical Characteristics list is represented in phenotypes (mitochondrial myopathy,
    ALS, FTD, SMAJ features, axonal CMT features, cerebellar ataxia) except the
    "psychiatric abnormalities" named only in the surveillance sentence, which is too
    unspecific to bind to an HP term; that omission is stated in the entry notes. The
    Agents/Circumstances to Avoid content (baclofen worsening weakness; FTD behavioural
    drugs worsening dysarthria, dysphagia and respiratory weakness) is carried in the
    supportive-care treatment's notes.

    Evidence. 20 PMIDs, 101/101 snippets verified against the local cache. Sources are a
    mix of the founding clinical report (PMID:24934289), cohort screens (PMID:25155093,
    PMID:27056076, PMID:28318595), mechanism papers (PMID:26666268, PMID:32338760,
    PMID:28585542, PMID:30092269, PMID:41420107), knock-in mouse work (PMID:30877432,
    PMID:30874923, PMID:38583639, PMID:38724625) and human post-mortem
    neuropathology (PMID:35787294). Two supports: REFUTE items were recorded rather than
    smoothed over in prose: patient iPSC motor neurons are hypersensitive to
    caspase activation while mutant alleles block cytochrome c release in fibroblasts,
    and mitochondrial phospho-TDP-43 accumulates equally in the severe S59L and mild
    G66V alleles, which argues against TDP-43 localization being the severity
    determinant. Both are also carried as discussions.

    Deliberately not cited. PMID:25261972 ("Mutations in the CHCHD10 gene are a common
    cause of familial amyotrophic lateral sclerosis") is referenced only in a discussion
    rationale as prose, never as an evidence item: the publisher returned 403 to the
    full-text fetch and PubMed carries no abstract for the research letter, so no snippet
    could be verified, and its title is a claim rather than a finding. ClinGen's Moderate
    classification for CHCHD10-FTDALS2 (versus Definitive for CHCHD10-mitochondrial
    disease) is described in the genetic notes but not cited as a CGGV: reference,
    because just clingen-refresh currently fails a pinned-sha256 check against
    data/clingen/MANIFEST.yaml after an upstream release behind the same URL, and
    repinning plus rebuilding the 516-file ClinGen cache is a maintenance change that
    does not belong in a curation PR. Nothing in the entry rests on the ClinGen claim.

    Datasets. Empty by decision. just discover-datasets returned 12 candidates, all
    tagged DIRECT, and none mentions CHCHD10: seven are C9orf72 hexanucleotide-repeat
    studies, three are TDP-43/FUS studies, one is an E. coli phase-transition
    experiment. All were matched by relaxing this entry's name to the generic string
    "Frontotemporal Dementia Amyotrophic Lateral Sclerosis". This is the Named Entity
    Confusion case the dataset SOP describes, and it is sharper than usual because
    C9orf72 is the gene this entry's mechanism is defined against.

    Validation. just validate-disorders passed (schema, terms, 101/101 reference
    snippets). just check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values and check-qualifier-terms all OK on the file;
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading and check-environmental-evidence all OK whole-KB with no new
    baseline entries. linkml-data-qc reports 91.7% global / 92.0% weighted compliance.
    Uncited reference caches fetched during the session were pruned and snippet
    verification was re-run afterwards on the pruned tree. The stub
    stubs/Frontotemporal_Dementia_And_Or_Amyotrophic_Lateral_Sclerosis_2.yaml was
    deleted and just check-stubs reports no errors.

    The full pytest suite (6160 checks) passes. It caught one defect the validators
    did not: check_upward_extrapolating_links_are_caveated flagged the S55L mouse's
    integrated-stress-response link as an uncaveated MOLECULAR-model to
    CELLULAR-target extrapolation. Fixed by correcting model_scale to CELLULAR rather
    than adding a caveat, because MOLECULAR was simply the wrong tag: the model
    observes a cellular-scale programme (stress-induced transcription factors,
    myokine secretion, one-carbon metabolism, respiratory-chain enzyme
    downregulation), not a single molecular species.

    Pre-PR adversarial review. A red-team pass over the finished entry (per the
    dismech-pr-review skill) returned seven blocking findings, all fixed before
    commit. (1) No diagnosis: section existed, so the GeneReviews DIAGNOSIS/TESTING
    content was unmined; four diagnosis records were added covering the molecular
    route, the muscle biopsy, mtDNA-deletion detection and EMG/NCS, including the
    negatives that repeat-expansion and primary mtDNA testing are the wrong tests.
    (2) A supports: REFUTE item on the TDP-43 node refuted a severity claim that
    lives on the MICOS node, not a claim that node made; it was moved to the MICOS
    node and regraded SUPPORT with directness: INDIRECT. (3) A PMID:28585542 item
    graded IN_VITRO quoted a sentence naming C. elegans complementation assays; it
    was split into a MODEL_ORGANISM item and an IN_VITRO item, each quoting its own
    clause. (4) A PMID:35787294 explanation claimed human FTDALS2 evidence, but that
    paper's brains are FTLD-TDP and Alzheimer cases, not CHCHD10 carriers; the
    explanation was rewritten and directness: INDIRECT added. (5) A scope
    contradiction: notes: said the other CHCHD10 allelic arms are differential
    diagnoses while phenotypes: curated their features, each cited to a GeneReviews
    sentence explicitly about a different disease. Fasciculations, Muscle Cramps and
    Distal Muscle Weakness were removed; Areflexia was re-evidenced from the
    founding pedigree's examination findings and Skeletal Muscle Atrophy from the
    mitochondrial-myopathy sentence, both inside scope. (6) Unevidenced negative
    claims about C9orf72 disease in a differential's distinguishing_features were
    rewritten as the positive predictive direction the cited quote actually
    supports. (7) Both mechanistic_hypotheses were declared but no downstream edge
    opted into either, so the contested muscle-first ordering was asserted in the
    pathograph indistinguishably from settled edges; hypothesis_groups tags were
    added to the four relevant edges.

    Major findings also fixed: CL:0002372 (myotube, the immature precursor) was the
    wrong cell type for adult patient muscle fibre claims and was replaced with
    CL:0008002 skeletal muscle fiber in three places; orphaned phenotype nodes were
    wired into the graph, including Multiple Mitochondrial DNA Deletions, which the
    separate-entry argument rests on and which was hanging off the graph entirely;
    the description's claim that CHCHD10 ablation "produces no disease at all" was
    softened, since PMID:40400037 notes a knockout study reporting neuromuscular
    junction impairment; the PMID:28318595 "controversial role" quote is from that
    paper's framing of prior work while its own conclusion runs the other way, which
    the explanation now says; and the notes' dataset enumeration accounted for 11 of
    12 rejected candidates and mischaracterised the twelfth, now corrected.

    Two findings were not actionable and are recorded rather than silently dropped.
    The reviewer asked for OMIM:615911 in mappings:, but DiseaseMappings has slots
    for ICD-10-CM, ICD-11, MONDO and NCIT only, with no OMIM slot; this is noted in
    the entry. The reviewer also judged the notes' claim that CHCHD10 disease "does
    not run through" the parent's proteostatic model to be overstated, since that
    model does list mitochondrial dysfunction among its drivers. Verified and
    correct: the argument was rewritten to the accurate and stronger form, that
    mitochondrial dysfunction occupies the opposite position in the two models (one
    of several convergent contributors in the parent, the initiating lesion here).

    Cerebellar ataxia and sensorineural hearing loss are curated as phenotypes with
    no upstream pathophysiology node. Rather than invent an edge from the generic
    mitochondrial lesion, this is recorded as an explicit KNOWLEDGE_GAP discussion:
    both were presenting features of the founding pedigree, and the knock-in mice
    that carry this entry's mechanistic weight are phenotyped for muscle, heart,
    motor neuron and hippocampus but not cerebellum or cochlea.

    Final state: 106/106 snippets verified, 20 PMIDs, 1987 lines, 91.5% global /
    91.8% weighted compliance, all offline gates and 6160 pytest checks green.

    Review round on PR #11339. The automated reviewer approved with no blocking
    findings and five optional suggestions; four were taken and bundled into one
    push, since every push to this repo dismisses the standing approval. Added an
    Impaired Mitochondrial Axonal Transport pathophysiology node between the MICOS
    lesion and neuromuscular junction degeneration — the evidence (PMID:39478664,
    KIF5B-mediated transport and syntaphilin degradation) was already in the file
    but only inside a treatment description, so the nifuroxazide treatment now
    targets the mechanism its benefit is actually attributed to rather than only
    the MICOS phenotype the screen selected on. Both new evidence items are graded
    directness: INDIRECT because the transport deficit is inferred from a
    pharmacological rescue rather than measured. Bound NCIT:C90982 Nifuroxazide as
    therapeutic_agent (CHEBI has no nifuroxazide term). Recorded in notes why
    riluzole and edaravone are out of scope. Added the PR and issue links here.

    One suggestion was not actionable and is recorded rather than silently
    dropped: the reviewer asked whether a monitoring-specific NCIT term could
    separate the surveillance treatment from general supportive care. Neither
    NCIT:C15719 (Surveillance) nor NCIT:C53607 (Patient Monitoring) is reachable
    from NCIT:C25218, the TreatmentTerm root, so binding either would fail the
    dynamic enum; NCIT:C15747 stands. Method checked against NCIT:C15302 and
    NCIT:C15747, both of which do reach C25218.

    While applying these, the edit introduced a duplicate `evidence` key inside the
    nifuroxazide target_mechanisms block — the dismech#8623 failure mode. Caught by
    just validate before pushing, and fixed by restoring each target's own evidence
    rather than dropping a block.

    Second review round. The re-review approved the current head and raised three
    further optional suggestions, all taken in one push. (1) The new MICOS to
    axonal-transport edge was typed causal_link_type: DIRECT while its only evidence
    carried directness: INDIRECT — an edge stronger than its own evidence, and
    inconsistent with the sibling TDP-43 edge. Retyped
    INDIRECT_UNKNOWN_INTERMEDIATES. (2) functional_impact_category: GAIN_OF_FUNCTION
    sat alongside dominant-negative and loss-of-function language elsewhere in the
    file. The value is kept, because the knock-in ablation control is the strongest
    single result and switching to DOMINANT_NEGATIVE would discard it, but a
    gof_versus_dominant_negative CONTROVERSY discussion now records the tension with
    evidence on both sides, and the genetic_context description points at it. The
    two mechanisms may not even be exclusive: an aggregate that sequesters both
    CHCHD2 and wild-type CHCHD10 is a novel toxic species and a sink for the normal
    protein at once, which is what makes a single-valued enum the wrong shape here.
    (3) The NCIT:C25218 reachability finding was recorded only in this history file,
    where the next curator would not meet it; it is now also in the entry's notes.

    Writing that discussion tripped check-snippet-grading: the new evidence item
    quoted a sentence beginning with the same C. elegans clause already graded
    MODEL_ORGANISM in pathophysiology, but graded it IN_VITRO. The gate was right —
    evidence_source classifies the cited study and cannot change because the quote
    moved. Fixed by re-quoting the discussion item to the mammalian dominant-negative
    clause, which is the claim it actually needed, rather than by regrading either
    item. Final: 112/112 snippets verified, all gates and 6160 pytest checks green.

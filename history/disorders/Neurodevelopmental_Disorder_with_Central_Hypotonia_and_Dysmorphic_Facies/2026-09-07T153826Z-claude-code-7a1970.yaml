    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 11318. Blocking item 1: the split frequencies (Scoliosis 3/7, Kyphosis 2/7, Congenital hip dislocation 2/7, Hip subluxation 2/7) were asserted only in explanation prose while the snippet supported the combined counts; added the verbatim Table 1 Kyphosis/scoliosis and Hip anomalies rows as second EvidenceItems on the four phenotypes. Drooling's Table 1 row is 4 words and would trip the 5-word snippet floor, so its VERY_FREQUENT band continues to rest on the prose sentence plus description; deliberate. Blocking item 2: replaced the over-general Ophthalmologic anomalies (HP:0000478) phenotype with five specific ones supported by the same verbatim Visual problems row - Astigmatism HP:0000483 (2/7), Hypermetropia HP:0000540 (2/7), Esotropia HP:0000565 (1/7, intermittent), Amblyopia HP:0000646 (1/7), Absence of visual tracking HP:0025404 Abnormal visual fixation (1/7); all labels re-verified via OLS. Suggestions taken: added Relative macrocephaly HP:0004482 (1/7, individual 2) with the quotable growth sentence; moved the curation-changelog prose out of the Motor stereotypies, Scoliosis and Congenital hip dislocation descriptions into notes; renamed Dystonia to Limb dystonia to match the HP:0002451 binding and updated the pathograph edge target. Suggestion declined with reasons in the PR comment: dropping the Neurodevelopmental and Craniofacial-Skeletal Phenotype endpoint node - it anchors the nedchf_clinical_spectrum_undefined gap and two proposed experiments' would_support refs, and it is the only downstream representation of the un-wired portion of the syndrome on the N4 unidentified-pathways arm. Knowledge-gap attaches_to updated to the split eye phenotypes plus Relative macrocephaly. Validation: validate, validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-length, check-folded-hyphens, validate-disorders all pass; 101/101 snippets verified; connectivity 15/34 with all 19 unconnected phenotypes either gap-attached or deliberate negative annotations.

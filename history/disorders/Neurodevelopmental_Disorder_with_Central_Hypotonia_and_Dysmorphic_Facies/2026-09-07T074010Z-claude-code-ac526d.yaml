  summary: 'Phenotype review: Neurodevelopmental_Disorder_with_Central_Hypotonia_and_Dysmorphic_Facies'
  details: |
    Full phenotype review against the cached full text of PMID:33537682 (the single defining cohort paper) and the Falcon deep-research report. Snippets: all 25 pre-existing phenotype evidence snippets verified as exact substrings used in faithful whole-paper context; no wrong-disease or negation misuse found. Term/structure fixes: split the combined 'Motor stereotypies and dystonic movements' into Motor stereotypies (HP:0000733, 1/7) and Dystonia (HP:0002451 Limb dystonia, 1/7) since the findings occurred in different individuals; split 'Kyphoscoliosis' (HP:0002751, which asserts the combined deformity no individual had) into Scoliosis (HP:0002650, 3/7) and Kyphosis (HP:0002808, 2/7); split 'Hip dislocation or subluxation' (bound to Congenital hip dislocation though only 2/4 cases were congenital dislocations) into Congenital hip dislocation (HP:0001374, 2/7) and Hip subluxation (HP:0030043, 2/7); rebound the negative brachydactyly annotation from broad HP:0001156 to HP:0005863 Type E brachydactyly matching the paper's exact negation; corrected Drooling frequency FREQUENT to VERY_FREQUENT (6/7 in Table 1); added the missing Ophthalmologic anomalies phenotype (HP:0000478, 4/7 from the Table 1 Visual problems row that the Falcon PDF extraction dropped). Verified the entry's claim that HP:0011398 Central hypotonia is obsolete (it is; HP:0001252 binding stands). Pathograph: entry had 0/25 phenotypes causally connected; added 15 downstream edges from the two mechanism arms the paper itself proposes - 10 neuro edges from 'Impaired Neuronal Plasticity Gene Expression' (DD, ID, central hypotonia, walking, speech, seizures, infantile spasms, stereotypies, dystonia, MRI abnormalities) and 5 skeletal/craniofacial edges from 'MEF2C and RUNX2 Target Transcriptional Dysregulation' (fontanelle, teeth, hypertelorism, both hip phenotypes), all INDIRECT_UNKNOWN_INTERMEDIATES with directness: INDIRECT edge evidence quoting the MEF2C-overlap, RUNX2-overlap and MEF2-binding sentences. Deliberately left 11 phenotypes unconnected (facial gestalt items, scoliosis/kyphosis, joint hypermobility, feeding/drooling, sleep disturbance, eye anomalies) and recorded a new KNOWLEDGE_GAP discussion (nedchf_unique_feature_pathways_unknown) quoting the authors' as-yet-unidentified-pathways statement; the 3 REFUTE negative annotations correctly stay unconnected. Updated orthopedic treatment target_phenotypes to the split terms. Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-snippet-length, check-folded-hyphens, and validate-disorders all pass; 92/92 snippets verified; connectivity now 15/29.

  summary: 'Create: Neurodevelopmental Disorder with Central Hypotonia and Dysmorphic
    Facies'
  details: |
    De-novo curation of NEDCHF (MONDO:0859232, OMIM:619797, HDAC4), resolving
    issue #8531.

    Named-entity-confusion preflight: MONDO:0859232 was verified with OAK
    (`runoak -i sqlite:obo:mondo info MONDO:0859232 -O obo`) to carry
    xref OMIM:619797 and relationship RO:0004003 to HGNC:14063 (HDAC4),
    matching the gene and OMIM identity used throughout the entry. The falcon
    deep-research report additionally passed `just preflight-dr ... MONDO:0859232`
    (HDAC4 top gene with 47 mentions; OMIM 619797 present).

    Scope boundary: the entry is deliberately restricted to the de novo missense
    variants in the HDAC4 14-3-3 binding motif (residues 242-248). HDAC4 loss of
    function / 2q37 deletion (brachydactyly-mental retardation syndrome) stays
    curated in 2q37_Microdeletion_Syndrome.yaml, whose differential-diagnosis
    record already states the two must not be grouped. A reciprocal
    differential_diagnoses record was added here, spelling out the mechanistic
    distinction (proposed gain of function via increased nuclear HDAC4 versus
    haploinsufficiency) plus MEF2C haploinsufficiency and cleidocranial dysplasia
    as the two mechanism-motivated differentials.

    Mechanism modeled as a six-node pathograph, each node tagged with
    biological_scale: HDAC4 14-3-3 Binding Site Missense Variant (MOLECULAR) ->
    Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration (MOLECULAR) ->
    Increased Nuclear HDAC4 Co-repressor Activity (MOLECULAR, PROVISIONAL) ->
    MEF2C and RUNX2 Target Transcriptional Dysregulation (CELLULAR,
    HYPOTHETICAL) -> Impaired Neuronal Plasticity Gene Expression (CELLULAR,
    PROVISIONAL) -> Neurodevelopmental and Craniofacial-Skeletal Phenotype
    (ORGANISM). mechanism_confidence encodes how far the published evidence
    actually reaches: only the reduced-14-3-3-binding step is experimentally
    demonstrated (and only for two of four variants), which is recorded as an
    explicit KNOWLEDGE_GAP discussion with proposed experiments.

    Evidence: 65 snippets, all verified as exact substrings of cached
    references. Primary source PMID:33537682 (Wakeling et al. 2021), cached as
    PMC full text so per-feature clinical claims are quotable. Supporting
    mechanism references: PMID:18952052 (14-3-3 controls class IIa HDAC nuclear
    import), PMID:11470791 (HDAC4 modular trafficking), PMID:12641737 (neuronal
    activity-dependent HDAC4/HDAC5 shuttling and MEF2 repression), PMID:26074448
    (HDAC4 in neuronal function). BDMR contrast: PMID:20691407. Two REFUTE
    phenotype annotations (brachydactyly type E, autistic behavior) record the
    discriminating negatives so the boundary with BDMR is machine-queryable.

    Three discussions were added: the gain-of-function mechanism gap, the
    undefined clinical spectrum/natural history (n=7 cohort), and the
    HDAC4-selective inhibitor feasibility question (recorded as an
    OPEN_QUESTION, deliberately NOT curated as a treatment).

    Ontology QC: falcon suggested HP:0011443 for central hypotonia and
    HP:0000639 for long palpebral fissure; both were rejected after OAK
    verification. HP:0011398 (Central hypotonia) is obsolete and replaced by
    HP:0001252 (Hypotonia), which is used with `preferred_term: Central
    hypotonia`; the correct long palpebral fissure term is HP:0000637. The
    non-pharmacological treatments use NCIT action terms (NCIT:C15433,
    NCIT:C15302, NCIT:C15240) rather than the MAXO terms documented in
    CLAUDE.md, because the schema's TreatmentActionTerm dynamic enum is
    reachable only from NCIT:C25218 and rejects MAXO ids.

    Validation: `just validate` passes end to end (schema, term, reference);
    65/65 snippets verified against cached references; `just validate-terms`
    passes; compliance 88.4% global / 88.8% weighted.

    Tooling note: the repo's PreToolUse validate_disorder_hook.py resolves the
    project root from CLAUDE_PROJECT_DIR, so when curating in a git worktree it
    validates against the primary checkout's references_cache and venv rather
    than the branch's. The primary checkout here is several commits behind
    origin/main (validator 0.2.1rc2, no PMC full-text support), so the hook
    reported spurious snippet failures. All validation reported above was run
    inside the worktree with the branch's own tooling and cache, which is what
    CI uses.

  summary: Link HDAC4 model systems into the pathograph and apply optional review
    polish
  details: |
    Follow-up to the merged PR #8694, landing the review findings that were downgraded to optional at merge time.

    Model linking (review item 1). The three model systems previously reachable only as evidence snippets are now curated as first-class models with modeled_mechanisms links:
    - experimental_models: HEK293 HDAC4 / 14-3-3 beta co-immunoprecipitation assay (CELL_LINE, MEASURES "Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration", fidelity MODERATE), with one DECREASED readout for the two-fold reduced 14-3-3 binding and limitations covering transformed kidney cells, transient overexpression, the two untested Pro248 alleles, and binding-not-localization.
    - animal_models: HDAC4 overexpression in proliferating mouse chondrocytes (PARTIALLY_RECAPITULATES the RUNX2 arm of "MEF2C and RUNX2 Target Transcriptional Dysregulation", fidelity LOW), with a DECREASED differentiation readout; limitations note supraphysiological wild-type overexpression rather than a variant knock-in, and secondhand citation via PMID:33537682.
    - animal_models: HDAC4 3SA constitutive-nuclear mutant mouse that could not be generated (FAILS_TO_RECAPITULATE "Increased Nuclear HDAC4 Co-repressor Activity", carrying the required limitations and evidence), giving the nedchf_gain_of_function_unproven knowledge gap a structural anchor instead of prose.

    All model evidence reuses snippets already verified against references_cache/PMID_33537682.md; no new references were fetched.

    Optional polish also applied:
    - Antiseizure Pharmacotherapy: treatment_term moved from generic NCIT:C15986 to NCIT:C64172 Anticonvulsant Therapy, with NCIT:C264 Anticonvulsant Agent as drug-class therapeutic_agent (both confirmed enum-reachable via just validate-terms).
    - Feeding Support and Gastrostomy split into "Texture-Modified Diet" (NCIT:C15447 Dietary Intervention, BEHAVIORAL) and "Gastrostomy Feeding" (NCIT:C52006 Gastrostomy, SURGERY), the dietary arm quoting its Table 1 row and the gastrostomy arm quoting the prose sentence that establishes the swallowing-difficulty indication, so the modality is honest per treatment.
    - disease_term bound on two differentials: cleidocranial dysplasia to MONDO:0007340 (cleidocranial dysplasia 1) and MEF2C haploinsufficiency syndrome to MONDO:0013266 (OMIM:613443 xref, "MEF2C haploinsufficiency syndrome (MCHS)" exact synonym; both verified with OAK).
    - Added "Absence of obesity" as a third REFUTE phenotype (HP:0001513), completing the BDMR-discriminating triad with brachydactyly type E and autistic behavior.
    - Corrected the stale MAXO justification in notes (MAXO was removed from dismech and remapped to NCIT; the NCIT choices were already correct) and documented the new model sections.

    Deliberately unchanged: the gain-of-function vs 2q37 loss-of-function entity boundary and its reciprocal cross-reference; HP:0001252 with preferred_term "Central hypotonia" for the obsolete HP:0011398; the IN_VITRO vs COMPUTATIONAL split on variant evidence; mechanism_confidence HYPOTHETICAL on the MEF2C/RUNX2 node; the exclusion of PMID:40167013 as loss-of-function.

    Validation: just validate PASS; just validate-terms PASS; just validate-references 72/72 snippets verified (was 65/65). Model-link tests (readout target match, FAILS_TO_RECAPITULATE substantiation, animal-model label uniqueness, mechanism-link foreign keys) all pass.

  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added a diagnosis section with four rows. Stool Kato-Katz microscopy bound to LOINC:11085-8 (the only stool Schistosoma identification code in the Monarch KG; it names a concentration method). Urine filtration microscopy bound to LOINC:10715-1 (urine sediment light microscopy). Circulating antigen (CCA and CAA) row carries no LOINC code because the KG has no Schistosoma antigen code. Serology bound to the method-less LOINC:8020-0. The WHO heavy-intensity thresholds (400 or more eggs per gram of stool for S. mansoni, 50 or more eggs per 10 mL urine for S. haematobium) are stated in the row descriptions with evidence from PMID:34307724 (newly cached) and not as reference ranges, because LOINC has no egg-count code to key a range on; the cited source does not state the light and moderate classes. Other evidence from PMID:38990839 (newly cached) and PMID:24698483.

  summary: 'Review round: atomize bladder injury node and wire egg-inflammation chain'
  details: |
    Addressed review of PR 12531. Renamed the pathophysiology node 'Chronic bladder mucosal injury promotes squamous-cell carcinogenesis' to 'Chronic bladder mucosal injury' and rewrote its description as a state, leaving the causal claim on its downstream edge to Bladder Carcinoma. Added downstream edges Egg trapping triggers granulomatous inflammation -> Urogenital inflammation and scarring -> Chronic bladder mucosal injury, so the new node is no longer a disconnected root. Quoted the following sentence of PMID:24698483 ('This tumour is often multifocal, and in regions endemic for S haematobium, occurs at a younger age than do transitional-cell bladder carcinomas.') to back the multifocality and age claims on the node and the phenotype notes, and corrected the comparison from 'non-endemic populations' to what the source says (in endemic regions). Marked the Lancet seminar quotes quote_role: REVIEW_SYNTHESIS.

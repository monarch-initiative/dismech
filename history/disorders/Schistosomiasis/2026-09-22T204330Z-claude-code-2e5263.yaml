  summary: Add bladder squamous-cell carcinoma mechanism and phenotype
  details: |
    Added a pathophysiology node ('Chronic bladder mucosal injury promotes squamous-cell carcinogenesis') and a new phenotype node ('Bladder Carcinoma', bound to HP:0002862) closing the content gap flagged in issue #6309: S. haematobium -> squamous-cell bladder carcinoma (a WHO/IARC-recognized carcinogenic association) had no mechanism or phenotype node in the entry. Both new nodes cite the already-cached PMID:24698483 (Colley et al., Human schistosomiasis, Lancet 2014), which was already used elsewhere in the entry and states: 'Squamous-cell carcinoma of the bladder is also strongly associated with S haematobium infection. This tumour is often multifocal, and in regions endemic for S haematobium, occurs at a younger age than do transitional-cell bladder carcinomas.' No new reference fetch was needed. Left the remaining Malaria/HAT/Onchocerciasis/Babesiosis sub-items from issue #6309 for a future run; most of that tracker's per-entry checklist has already been resolved by prior PRs.

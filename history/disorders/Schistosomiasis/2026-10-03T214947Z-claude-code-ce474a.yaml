  summary: List the recognised phases in progression (#10115, R21)
  details: |
    Added a five-phase progression block: Cercarial penetration and cercarial dermatitis (PMID:36096120, newly fetched review of cutaneous schistosomiasis), Prepatent period (about 5-7 weeks from skin penetration to egg production; PMID:24698483), Acute schistosomiasis / Katayama syndrome (weeks to months after infection, lasting 2-10 weeks; PMID:24698483), Chronic schistosomiasis / egg-granuloma disease (the predominant endemic form; PMID:24698483), and Advanced (late) disease (usually 5-15 years to advanced fibrosis; hepatosplenic periportal fibrosis with portal hypertension, and urogenital obstructive uropathy, calcification and strictures; PMID:24698483, PMID:22786992). Phases are not scoped with subtype because the entry declares no has_subtypes. Two sentences the entry already quotes at a different grade (the bladder squamous-cell carcinoma sentence of PMID:24698483 and the egg-granuloma sentence of PMID:30093684) were left out of this block so check-snippet-grading stays clean. One reference newly fetched: PMID:36096120. Validation: just validate passed; count-verified-snippets all verified; check-snippet-grading, check-title-snippets, check-snippet-length, check-duplicate-keys, check-enum-values, check-entity-refs and check-causal-targets clean; check-granularity no longer reports NO_PROGRESSION.

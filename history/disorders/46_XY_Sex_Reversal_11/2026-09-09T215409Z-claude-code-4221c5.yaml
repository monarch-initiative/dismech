  details: |
    Round-nine review found the entry's scope/lump-split notes describing 46,XY complete gonadal dysgenesis as it was before main changed it. The notes said that entry carried a DHX37-related complete gonadal dysgenesis subtype 'while deliberately declining to bind MONDO:8000015 as a structured mapping (its notes record it as a phenotype-series cross-reference the local disease-term enum rejected)'. Verified both halves against origin/main before editing: that entry now binds MONDO:8000015 as the subtype_term of its DHX37-related complete gonadal dysgenesis subtype (line 418), and its notes no longer mention the disease-term enum at all. Both halves were false.

    Two edits to the notes, no content change elsewhere. First, the sibling-entry list now states the binding as it is: '...and which now binds MONDO:8000015 as that subtype's subtype_term'. Second, a new paragraph before the sign-off request states the consequence plainly - the concept is now claimed twice, once as this entry's disease_term and once as that subtype_term, and under the MONDO coverage rule a disease_term and a has_subtypes term both count as curated coverage, so it is a genuine collision rather than a cross-reference. The paragraph records that the binding landed on main after this entry was drafted, states why this entry retains the term (it curates DHX37 across the full severity range, not only the complete-dysgenesis slice), and says explicitly that which of the two should hold it is the question the curator is being asked to settle.

    This was an omission rather than drift. The collision was recorded in the preceding history record and raised in a PR comment, but not carried into the entry's own notes, which is the artifact a curator reads when making the lump/split call.


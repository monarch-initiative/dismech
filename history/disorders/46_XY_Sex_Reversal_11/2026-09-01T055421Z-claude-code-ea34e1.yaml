  summary: 'Create: 46,XY Sex Reversal 11 (SRXY11, DHX37)'
  details: 'Created kb/disorders/46_XY_Sex_Reversal_11.yaml for MONDO:8000015 (SRXY11, DHX37-related 46,XY
    DSD) and deleted the corresponding stub.


    Deep research: the requested provider was falcon, which returned HTTP 403 (Edison authentication failed).
    Rather than substituting a provider by hand, the run was repeated through the recorded-fallback path
    (just dr_fallback=''--fallback'' research-disorder falcon ...), which produced research/46_XY_Sex_Reversal_11-deep-research-openscientist.md
    and renamed the report to its actual producer; the frontmatter carries fell_back: true, requested_provider:
    falcon, and provider_attempts. That report is the one used.


    Report validation as read before use: reference_validation 18/18 resolved, 18/18 quotes valid, confabulation_rate
    0.0, needs_review true because of one off-topic reference, PMID:32057790 (a Turner-syndrome 45,X/46,XY
    mosaicism seminoma case report). That paper is genuinely about a different entity and was not cited.
    term_validation flagged HP:0000783 as unresolved; it is not bound anywhere in the entry. The four
    terms reported as mislabelled were artefacts of the report placing frequency descriptors in the label
    column (HP:0000133, HP:0000815, HP:0000771, HP:0100728 all carry correct CURIEs); each term actually
    used was independently verified against the ontology via the OLS API or an existing verified binding
    in a sibling KB entry.


    Scope decision: recorded as a DISEASE entry rather than a SUBTYPE. The stub was UNDECIDED. MONDO places
    SRXY11 under 46,XY complete gonadal dysgenesis, but the existing complete-dysgenesis entry explicitly
    excludes DHX37 as a phenotype-series cross-reference, and the existing 46,XY partial gonadal dysgenesis
    entry carries only a DHX37 subtype scoped to partial presentations. Neither covers the testicular-regression
    pole, which is where DHX37 variants are most enriched. The entry is gene-anchored and spans both poles,
    because the recurrent alleles produce both within and across families; the notes block records the
    overlap with both sibling entries explicitly.


    Content: 9 pathophysiology nodes forming a connected causal chain from the RecA-domain missense variant
    through impaired 40S biogenesis, nucleolar stress, and a branch into WNT/beta-catenin-mediated failure
    of testis determination versus p53-dependent somatic-cell apoptosis and fetal testicular regression;
    14 phenotypes; genetic and variants records for the p.Arg308Gln and p.Arg674Trp hotspots with three
    population-specific case_fractions; a Sertoli-cell conditional Dhx37 knockout animal model including
    a FAILS_TO_RECAPITULATE link; four diagnosis records; four treatments; four differential diagnoses;
    and five discussions.


    Epistemic care taken: the middle of the chain (nucleolar stress to WNT to failed determination, and
    the p53 arm) is the field''s leading model and not a demonstrated result, so those nodes carry mechanism_confidence
    HYPOTHETICAL and their edges carry directness INDIRECT. No prevalence record was created — no population
    prevalence for SRXY11 exists, and the published figures are ascertainment-dependent diagnostic yields,
    recorded as genetic.case_fractions instead. No DHX37-specific germ-cell tumour risk is quoted; the
    tumour phenotype cites a 292-patient 46,XY DSD series that was not DHX37-genotyped, and carries both
    the dysgenesis risk figure and the negative result at the regression pole. Discussions record the
    DHX37 expression-compartment disagreement between the two foundational studies, the regression-versus-dysgenesis
    controversy, the housekeeping-gene tissue-specificity paradox, and a HUMAN_MODEL_MISMATCH for the
    loss-of-function mouse against exclusively missense human alleles.


    GeneReviews: no chapter exists for SRXY11 or testicular regression syndrome. The overview chapter
    Nonsyndromic Disorders of Testicular Development (PMID:20301714) covers this disease family and is
    cached and tagged GeneReviews in the top-level references block; its PubMed abstract is a purpose
    statement with no Clinical Characteristics content, so it supplied no phenotype baseline and is cited
    only as the reference tag.


    Self-review round. Before committing, an adversarial review was run against the dismech-pr-review
    skill with fresh context, and its findings were verified against the reference cache rather than taken
    at face value; seventeen were raised and fifteen acted on. Substantive corrections: (1) the RIP-seq/RNAi-RNA-seq
    result from PMID:41535247 was regraded from MODEL_ORGANISM to IN_VITRO after confirming in the cached
    full text that those experiments were RNAi knockdown in the TM4 mouse Sertoli cell line, and the animal-model
    link evidence was repointed to the paper''s in-vivo sentence. (2) The Nucleolar Stress Response node
    had described a cell-line result as directly observable in knockout testis; the description was corrected
    and that node plus the p53 apoptosis node were tagged mechanism_confidence PROVISIONAL, which the
    notes block had already claimed of them but the file did not honour. (3) genetic.frequency claimed
    DHX37 was the most commonly identified gene in gonadal-dysgenesis cohorts generally, which the sources
    do not support; it was narrowed to TRS-enriched series with the 0.77-45.45 percent cohort range recorded.
    (4) The Ambiguous genitalia phenotype was supported only by a quote describing a range of genital
    outcomes, and was rebound to a PMID:42510869 sentence reporting ambiguous genitalia directly, with
    frequency dropped from FREQUENT to OCCASIONAL. (5) A REFUTE on the Muellerian phenotype was quoting
    a cohort''s enrolment criterion rather than a finding, and was regraded NO_EVIDENCE. (6) The case
    definition required a heterozygous variant, excluding the published homozygous p.T477H testicular-regression
    case that this entry cites elsewhere; it was softened, and that case with its heterozygous fertile
    father was added as evidence. (7) The treatments section was testosterone-only despite the entry curating
    the female-phenotype pole as first-class, so an estrogen-replacement record was added with its lack
    of DHX37-specific evidence stated plainly.


    Also corrected: the p53-to-regression edge snippet now quotes the clause that actually reaches the
    regression step; the Cryptorchidism edge moved from Absent Functional Testicular Tissue to Deficient
    Fetal Testicular Hormone Output, since absent tissue does not cause an undescended testis; the Brazilian
    ETRS case_fraction_percent of 50.0 was withdrawn because the 7/14 denominator reconciles with neither
    count in the abstract and the ratio may be inverted, with the ambiguity recorded in notes; a NO_EVIDENCE
    item doing a notes'' job moved to node notes; the gonadal-surgery binding tightened from NCIT:C15329
    Surgical Procedure to NCIT:C15288 Orchiectomy; Delayed puberty evidence marked directness INDIRECT;
    and hypospadias, primary amenorrhea, pelvic imaging, and a digenic DHX37 plus NR5A1 note were added.
    One point of fact in the notes block was wrong and is fixed: the 46,XY complete gonadal dysgenesis
    entry does carry a DHX37-related subtype and a DHX37 pathophysiology node, so the earlier wording
    implying it excludes DHX37 content entirely was incorrect.


    Two findings were recorded rather than resolved, both flagged in the entry''s notes for a human curator.
    The lump/split call warrants sign-off: DHX37 content now exists in three files, which is the gene-specific-forms
    pattern. And MONDO makes MONDO:8000015 a subclass of complete gonadal dysgenesis while this entry
    deliberately spans the partial and regression poles too, so the bound disease_term is narrower than
    the entry''s scope; a skos:narrowMatch mapping to MONDO:0016674 would make the partial-pole claim
    auditable and is noted as follow-up rather than asserted here.


    Validation: just validate-disorders (the batched pre-PR gate CI runs) passed after the review fixes
    — schema, terms, and 87/87 snippets verified against cached references. 13,238 KB-integrity pytest
    cases pass. Also passed: check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms,
    check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading,
    check-environmental-evidence, and check-stubs after stub deletion. All 15 references are PMIDs; no
    DOI-only or preprint citations were used.


  summary: 'Rewrite the SRXY5 differential per sixth-round review on PR #10348'
  details: |
    The sixth review round requested changes on the 46,XY sex reversal 5 differential added in the previous round. The finding was correct and the defect was mine: the description was scoped to the CBX2.1 index patient, but the three distinguishing_features beneath it were unscoped, so they read as gene-level discriminators. Checked against kb/disorders/46_XY_Sex_Reversal_5.yaml, two of the three did not hold gene-wide.

    The clean-contrast framing was the opposite of true for half the entity. SRXY5 has two isoform-defined subtypes. CBX2.1 has histologically normal ovarian tissue, which SRXY11 never produces, so that half is a real discriminator. CBX2.2 has dysgenetic Sertoli-cell-only testes in one patient and no residual gonadal tissue in the other, which is inside the SRXY11 gonadal range rather than a contrast with it. The differential now says so, and says that the CBX2.2 arm separates on genotype instead. The overlap is the more useful thing for a reader than the clean split I originally claimed, and PMID:29998616 is now cited for the CBX2.2 gonadal finding.

    The biallelic claim asserted what the sibling entry declines to assert. SRXY5 records that the CBX2.1 index patient carried two variants while the two CBX2.2 patients are each reported with a single variant, and carries an OPEN knowledge gap, cbx2_2_zygosity_and_gene_validity, on exactly that. The cited PMID:19361780 abstract states no zygosity either, only loss-of-function mutations. The feature now says the discriminator is the gene rather than the zygosity, and names the open question.

    The no-regression feature is retained with a qualifier naming what CBX2.2 actually shows, since no residual gonadal tissue sits close to the regression pole and the distinction is the degree of virilization rather than the gonad.

    Also took the SUGGESTION on the same block. The description stated CBX2 acting upstream of SRY flatly. That is sourced, but the SRXY5 entry holds it as one of two hypothesis groups and records that the two models are not yet reconciled. It is now attributed to the transactivation model and names the alternative.

    This is the same defect class that four earlier rounds removed from this entry, prose asserting more than its source carries, arriving in a free-text list that no gate inspects. Snippets 107 -> 108; all offline gates green.

  summary: 'Address ai4c-reviewer suggestions on PR #10348'
  details: 'Acted on the ai4c-reviewer review of PR #10348, which approved the entry on content with no
    blocking findings and six suggestion-level items. All six were implemented, one of them only after
    a first, evidence-based refusal was overturned by a fuller source.


    Implemented. (1) Added the gnomAD case-control enrichment to the DHX37 genetic record — 14 percent
    of the cohort versus 0.4 percent in gnomAD, P < 0.001, from PMID:31287541. This is a separate population-genetic
    argument from the enrichment test already cited from PMID:31337883. (2) Added ACMG classification
    evidence behind the clinical_significance value on both hotspot variant records, sourced to the cohort
    that first classified them as pathogenic or likely pathogenic. (3) Added four further variant records
    for the recurrent residues the research report named: p.Arg334Trp (PATHOGENIC, with the ACMG/AMP classification
    quoted and c.1000C>T), p.Gly478Arg (UNCERTAIN_SIGNIFICANCE, with the VUS classification and its PM1/PM2/PP3
    criteria, plus a REFUTE item recording that a later series reporting it turned out to include the
    same patient, so it is not an independent replication), p.Arg390His (UNCERTAIN_SIGNIFICANCE, a single
    report at the complete-dysgenesis pole), and p.Thr477His (UNCERTAIN_SIGNIFICANCE, the only homozygous
    case reported, whose heterozygous father was fertile with unilateral regression). (4) Consumed three
    of the seven fetched-but-uncited reference caches the reviewer flagged: PMID:41466375 supports genome-wide
    over targeted sequencing on the molecular-testing diagnosis record; PMID:40916030 adds a variant-interpretation
    caution, since one rare DHX37 variant in that cohort was likely benign alongside a likely pathogenic
    SOX9 variant that better explained the phenotype; and PMID:42057034 was added to the tissue-specificity
    knowledge gap as a paired SUPPORT and REFUTE, because an in-silico-deleterious DHX37 variant showed
    no measurable effect on DHX37 expression, localization, or downstream signaling when actually assayed.
    That disagreement between predicted and measured consequence sharpens the gap and is the reason this
    entry does not treat in-silico deleteriousness as establishing loss of helicase function. (5) Documented
    in notes why the remaining four caches were reviewed and not used, and recorded the GeneReviews search
    result.


    The cDNA identifier for p.Arg674Trp, initially declined and then added. The reviewer proposed c.2020C>T
    to match the c.923G>A already carried on p.Arg308Gln. Checked against the reference cache as it then
    stood, that value was not in any source: the DHX37 papers naming Arg674Trp gave the protein change
    only, and a grep for c.2020 returned an unrelated c.2020G>A, so it was declined as an arithmetically
    plausible derivation rather than a sourced fact. That was correct on the evidence available at the
    time but is not the final answer. Fetching PMID:40916030 for a different suggestion upgraded its cache
    entry from abstract-only to full text, and the full text states the variant as NM_032656; c.2020C>T;
    p.(Arg674Trp). The identifier is now recorded with that sentence as its evidence and the transcript
    named. The lesson worth carrying: an identifier absent from an abstract-only cache is not an identifier
    that does not exist, and the check should be repeated after any cache upgrade.


    Validation after this round: just validate-disorders passes with 102/102 snippets verified against
    cached references, up from 87. Also green: check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens,
    check-snippet-grading, check-environmental-evidence, and 13,264 targeted KB-integrity pytest cases.
    Two folded-scalar hyphen splits introduced by the new prose were caught by check-folded-hyphens and
    reflowed before pushing.


    Correction to the prior record in this directory: it states that 13,238 KB-integrity pytest cases
    pass, which was the count from a targeted selection that had completed at the time of writing. The
    full suite subsequently completed at 50,832 passed and 43 skipped. That record is append-only and
    is left as written; this note supersedes the figure.


    The two questions raised for a human curator are unchanged and still open: the lump/split call on
    the gene-specific-forms pattern, and the MONDO scope mismatch where MONDO:8000015 is a subclass of
    complete gonadal dysgenesis while the entry spans partial dysgenesis and regression as well. The reviewer
    agreed both should go to a human and asked that merge be held; it could not set assignees itself.'

  summary: Merge main to resolve a cache/go/terms.csv conflict; no content change
  details: |
    The branch went into a genuine conflict with main after drifting 22 commits behind. One conflicted file, cache/go/terms.csv - the familiar sorted-CSV case where both sides appended rows.

    Inspected all three stages before resolving. The branch's side held 3,591 CURIEs, main's held 3,599, and the branch's set was a strict subset of main's: no CURIE existed on the branch that main lacked. Two shared rows differed, both on retrieved_at only, with identical labels - GO:0030490 (maturation of SSU-rRNA) and GO:0042274 (ribosomal small subunit biogenesis), the two ribosome-biogenesis terms this entry introduced, which main has since added independently. Taking main's file whole is therefore lossless, and the result is byte-identical to origin/main. Verified no CR characters were introduced.

    The merge also brings main's regenerated pages/, dashboard/ and app/data.js into the branch. Those are incoming from main's own page-build, not authored here: the net diff against origin/main is 38 files and contains no pages/, dashboard/, app/ or cache/dataset_accessions.json path. cache/dataset_accessions.json was untouched throughout.

    No KB content changed. kb/disorders/46_XY_Sex_Reversal_11.yaml is byte-identical to the version approved in round ten.

    The merge was taken because a real conflict appeared, not because the branch was behind. At the two previous check-ins the branch was 4 and then 9 commits behind with a clean merge-tree, and was deliberately left alone: being behind is not itself a reason to merge, and a merge costs the standing approval.

    Validated after the merge: just validate-disorders clean (schema, terms, references; 108/108 snippets verified), check-term-cache-integrity (18 term caches, 24 enum caches), check-cache-order, check-duplicate-keys, check-entity-refs, and the five baselined gates - check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-causal-targets - all green with nothing new past baseline.

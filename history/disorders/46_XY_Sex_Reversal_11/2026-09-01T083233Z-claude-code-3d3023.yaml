  summary: 'Address re-review suggestions on PR #10348'
  details: 'Acted on the three suggestions from the ai4c-reviewer re-review of commit e49ec9c6e, which
    approved the delta with no blocking findings. All three were verified against the cached sources before
    acting, and all three were correct.


    One was a factual error in prose that I had introduced. The p.Gly478Arg variant description said "Its
    classification differs by report". It does not: PMID:37717579 classifies the allele as a VUS under
    PM1 + PM2 + PP3, and PMID:42510869 states that "p.Arg334Trp was classified as pathogenic, and the
    remaining five as variants of uncertain significance", which includes this allele. Both reports agree
    on the classification. What differs is only how strongly each argues pathogenicity in prose — one
    calls its structural and conservation evidence strongly supportive, the other calls the genotype-phenotype
    correlation speculative and asks for larger cohorts and in vitro assays. The description now says
    that, and two further evidence items were added carrying the second report''s classification sentence
    and its own hedge, so the prose and the evidence beneath it now agree.


    One was an evidence-grading correction. The PMID:42510869 same-patient sentence was graded REFUTE.
    That was wrong on the KB''s own definition: supports is claim-relative, and this record never asserted
    independent replication, so there was no asserted claim for the quote to contradict. It is now SUPPORT
    with directness INDIRECT, which carries the same point — the apparent second observation is not an
    additional family — without inventing a claim to refute. The count of independent families follows
    from the sentence rather than being stated by it, which is what INDIRECT is for.


    One was a genuine content gap. PMID:34293745 reports a paternally inherited p.Arg487His allele, previously
    tied to the recessive neurodevelopmental syndrome NEDBAVC, in a boy with a syndromic form of 46,XY
    DSD whose phenotype "may be explained in part by a novel homozygous loss-of-function variant in the
    NGLY1 gene". That is an allelic-series boundary case and a phenocopy caution at once, and it now sits
    on the NEDBAVC differential diagnosis rather than as a variant record, because it is precisely not
    a clean DSD-causal allele: finding a DHX37 variant in a syndromic patient is not sufficient to call
    this disease, since it may be a NEDBAVC allele or the phenotype may be driven by something else entirely.


    Validation: just validate-disorders passes with 105/105 snippets verified against cached references,
    up from 102. Also green: check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms,
    check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading,
    and 5,426 targeted KB-integrity pytest cases.


    The lump/split question and the MONDO scope mismatch remain open for a human and are untouched by
    this commit. @cmungall is assigned to the PR, which also keeps the deterministic auto-merge sweep
    off it.'

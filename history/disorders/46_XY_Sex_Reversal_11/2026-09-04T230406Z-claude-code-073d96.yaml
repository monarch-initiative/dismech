  summary: Name the uterus as a shared finding in the SRXY5 differential
  details: |
    Took the one SUGGESTION from the seventh review round, which approved 38d1bffcc with no blocking findings.

    The CBX2.1 bullet read 'histologically normal ovarian tissue with a uterus, which SRXY11 does not produce'. As a compound that is true, because SRXY11 does not produce normal ovarian tissue with or without a uterus. But this entry carries Presence of uterus in 46,XY individual as a phenotype of its own at the dysgenesis pole, so a reader scanning the bullet could take the uterus for the thing that separates the two entries, and it is not. The bullet and the matching description sentence now name the ovarian tissue as the discriminator and say in terms that the uterus is shared with the SRXY11 dysgenesis pole.

    One correction to the review for the record: it cited the phenotype as HP:0000130. The entry binds HP:0034546, whose label is Presence of uterus in 46,XY individual. The observation was right, the CURIE was not, and the fix does not depend on which one it is.

    This is the third round in a row on the same small block, and all three findings were the same defect wearing different clothes - a differential asserting a cleaner separation than the sources support. Snippets unchanged at 108/108; all offline gates green.

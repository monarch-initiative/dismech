  summary: Refresh branch against main to clear stale baselined-gate findings
  details: |
    No content change. Recorded because the eighth review round raised a branch-level finding worth a provenance entry.

    That round approved e3f751f56 and noted that three baselined gates - check-snippet-length, check-title-snippets, check-snippet-grading - had started reporting findings in files this PR does not touch. I reproduced it before acting: the failures were in Ewing_Sarcoma, Tangier_Disease, CRX_Related_Retinopathy, Glutaryl-CoA_Dehydrogenase_Deficiency, IgG4-Related_Disease, Primary_Ciliary_Dyskinesia, AIPL1-Related_Retinopathy, Congenital_Glaucoma, EYS_Related_Retinitis_Pigmentosa and Tay-Sachs_Disease, and in neither of this PR's two files.

    The cause is branch staleness rather than a defect. Those entries were rewritten on main while this PR sat blocked on an unrelated reviewer-credential failure, and the fixes for the flagged snippets landed there. The branch still carried the pre-fix copies, so the checkers compared against a main that no longer has those snippets and reported them as new.

    Merging origin/main in resolves it, and this is the case where refreshing is warranted rather than merely cosmetic: the PR was showing red CI for a reason a reader would naturally misattribute to this change. Earlier check-ins deliberately declined to merge main on the strength of being behind alone, which remained the right call until the staleness had an actual effect.

    The merge was conflict-free. This PR's contribution is byte-identical afterwards at 40 files, 6724 insertions, 32 deletions, and no derived path differs from main. All three gates are green again, and just validate-disorders passes over both edited entries at 259/259 snippets.

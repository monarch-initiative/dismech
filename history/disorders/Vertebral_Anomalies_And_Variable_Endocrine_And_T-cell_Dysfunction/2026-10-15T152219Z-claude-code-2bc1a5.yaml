  summary: 'Create: Vertebral_Anomalies_And_Variable_Endocrine_And_T-cell_Dysfunction'
  details: |
    Created a new entry for VETD (MONDO:0032607, TBX2), claim issue #14341. Deep research: falcon was requested by default but failed twice with an Edison authentication error (503), including with --fallback, so the claude_code provider was run instead (research/Vertebral_Anomalies_And_Variable_Endocrine_And_T-cell_Dysfunction-deep-research-claude_code.md; 17/17 references resolved). Its thymus-transplant and severe T-cell deficiency details come from a UDN web page with no PMID and were not encoded. Phenotypes are quoted from PMID:35311234 (full text, comparison table summarizing the defining cohort, quote_role BACKGROUND) and PMID:29726930 (abstract). Mechanism chain from mouse Tbx2 studies (PMIDs 22116936, 15459098, 22130515, 19769959). Allelic TBX2 phenotypes (osteochondrodysplasia with empty sella, chondrodysplasia, hearing loss) are noted but not curated. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (41/41), check-entity-refs, check-causal-targets, check-snippet-length and the other offline gates.
    A fresh-context review before the PR led to these changes: short stature added for the p.Arg305His patient only; the thymus node renamed to Impaired Thymus Development at TISSUE scale, with the T-cell binding removed; the immunodeficiency preferred_term no longer claims T-cell specificity; GO:0003184 pulmonary valve morphogenesis added; quote_role PRIMARY_RESULT set on PMID:29726930 items; Klippel-Feil and mild cognitive impairment snippets added; a note added that CAUSATIVE records the defining gene, not a validity tier. Not taken: Narrow palate as a second binding, and proposed experiments for the mouse-mismatch discussion, since no specific experiment could be sourced.

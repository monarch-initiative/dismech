  summary: Reviewed Pneumocystis_Pneumonia, added literature-backed evidence to classifications, annotated Opportunistic Infection in Cell-Mediated Immunodeficiency with cell_types and locations, added cohort evidence and downstream phenotype edges on Alveolar Pneumonia and Respiratory Compromise, added evidence and target_mechanisms on treatments, and cleaned up stale notes text.
  details: >-
    1. Added literature-backed evidence (PMID:33870843) to both classifications
    harrisons_chapter entries (INFECTIOUS_DISEASES and RESPIRATORY). 2. Added
    CD4-positive, alpha-beta T cell (CL:0000624) cell_types and lung (UBERON:0002048)
    locations to Opportunistic Infection in Cell-Mediated Immunodeficiency, and
    clarified in its description that CD4 <200 cells/uL is the HIV-context marker.
    3. Added human clinical cohort evidence (PMID:22129760) and downstream edges to
    Pneumonia, Dyspnea, and Fever on Alveolar Pneumonia and Respiratory Compromise.
    4. Added PMID:27242349 evidence to Trimethoprim-Sulfamethoxazole and added a
    target_mechanisms link with PMID:33870843 evidence from Adjunctive Corticosteroids
    to Alveolar Pneumonia and Respiratory Compromise. 5. Removed the stale sentence in
    notes stating that infectious_agent had been omitted.

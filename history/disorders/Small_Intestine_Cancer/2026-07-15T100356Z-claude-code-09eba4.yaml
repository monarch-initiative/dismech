  summary: 'Create: Small Intestine Cancer'
  details: |
    Created new CURATE_ROOT_WITH_SUBTYPES entry for small intestine cancer MONDO:0000956 per issue 5750. Root small-bowel carcinogenesis modeled with four has_subtypes histologies: adenocarcinoma, neuroendocrine tumor/carcinoid, lymphoma, sarcoma; the separately-curated GIST is cross-referenced as a differential diagnosis rather than duplicated. Deep research provider: EDISON falcon via deep-research-client. EDISON output was treated as leads only; every PMID and snippet was independently verified against PubMed abstracts before use. Evidence uses 9 verified PMIDs: 35565398, 38141930, 39199671, 37954063, 40218169, 40553474, 39411312, 25639480 (intestinal lymphoma / EATL-IPSID), 31682550 (KEYNOTE-158 pembrolizumab in MSI-H/dMMR). Added structured prevalence overall RARE and small-bowel NET ~1.4 per 100000 SEER, a PRRT treatment, and dMMR/MSI-H immune checkpoint blockade with a target_mechanisms link to the mismatch-repair pathophysiology node. A fresh-context red-team review (dismech-pr-review rubric) was run; its blocking finding (lymphoma subtype evidence not lymphoma-specific) was fixed with PMID:25639480, and high-value non-blocking fixes were applied (pathograph MMR->Invasion link, EC-cell node genetics chr18/CDKN1B aligned to its evidence, MSI/ICB inconsistency resolved). just validate passes schema+terms+references; compliance ~81 percent.

  summary: Link culprit drug and toxin exposures into the pathograph
  details: |
    Backfill for issue #8085. Both environmental entries target the drug or toxin-triggered pulmonary endothelial dysfunction node as TRIGGERS. Definite drug or toxin exposure is DIRECT, since for agents classified as definite risk factors the exposure is the cause of the disease and this entry models drug-induced endothelial injury as the initiating vascular step. Methamphetamine exposure is INDIRECT_UNKNOWN_INTERMEDIATES because the evidence available in this entry is epidemiological rather than mechanistic: a thirtyfold higher adjusted prevalence of PAH hospitalisations among concurrent users, which establishes association without identifying the steps between stimulant use and endothelial injury. This entry cites DOI rather than PMID references, which the default reference validator skips by prefix, so both new evidence items were verified manually against their cached files for snippet presence and title match. Validated with just validate and just validate-terms; zero integrity issues.

  summary: Review and enrich Drug_or_Toxin-Induced_Pulmonary_Arterial_Hypertension
  details: >-
    Added three synonyms (drug- or toxin-induced PAH, DPAH, DT-PAH) and Harrison's
    chapter classifications CARDIOVASCULAR, RESPIRATORY and POISONING_ENVENOMATION,
    each with its own evidence. Added one prevalence record, the period
    prevalence of pulmonary hypertension among historically aminorex-exposed
    patients (200 per 100,000 exposed, DOI:10.21542/gcsp.2019.19), with a note
    that the disease has no general-population denominator. Added a germline
    BMPR2 receptor signaling predisposition node (GO:0098821 BMP receptor
    activity, DECREASED), rebound the endothelial and smooth-muscle cell types to
    the pulmonary-artery-specific CL:1001568 and CL:0002591, added UBERON:0002012
    pulmonary artery locations, GO:0042310 vasoconstriction and GO:0001974 blood
    vessel remodeling, and linked the smooth-muscle proliferation and obstructive
    arteriopathy nodes to the pulmonary_vascular_remodeling module. Typed BMPR2 as
    a germline SUSCEPTIBILITY gene, bound ECTO:0000509 exposure to drug on the
    definite drug or toxin exposure entry, and added evidence to phenotype edges
    (INDIRECT on Fatigue). Diagnosis now binds NCIT Clinical Evaluation (exposure
    history and urine drug screening) and Right Heart Catheterization
    (vasoreactivity testing), both quoting PMID:39209475. Treatments bind NCIT
    Pharmacotherapy Discontinuation for culprit withdrawal and sildenafil,
    tadalafil, epoprostenol and sotatercept as PAH-targeted agents, both typed
    therapeutic_modality OTHER. Progression now quotes the methamphetamine-
    associated PAH 5- and 10-year survival figures from DOI:10.21542/gcsp.2019.19.
    In response to review, the unsupported GO:0072577 and GO:0030509 bindings and
    the endothelial node's module link were removed, the dangling aminorex
    subtype reference was dropped, and an all-PAH prevalence record was removed
    in favour of the aminorex record.

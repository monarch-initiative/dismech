  summary: 'Create: Brachyolmia-Amelogenesis Imperfecta Syndrome'
  details: |
    De-novo curation of brachyolmia with amelogenesis imperfecta, also published as DASS - MONDO:0011018, LTBP3. The repository had already flagged this gap: kb/disorders/Short_Stature_Amelogenesis_Imperfecta_And_Skeletal_Dysplasia_With_Scoliosis.yaml records that LTBP3 surfaced as a rival gene in its own deep-research preflight and was deliberately excluded because it is a separate entity. This is that entity. One OpenScientist deep-research run: 17/17 references verified, 28/28 quotes valid, confabulation_rate 0.0; term_validation needs_review true, with HP:0012865 reported as 'Broad femoral neck' when it is Abnormal sperm head morphology. Two verified leads from the report were adopted after independent reading: PMID:35352826 for the failure of TGF-beta-LAP-LTBP3 latent complex formation, and PMID:34906192 for a directly described biallelic-null patient with thoracic aortic aneurysm, which replaced a secondhand citation. PMID:35352826 also reports heterozygous carriers showing DASS characteristics, which qualifies the recessive model and is recorded in notes rather than smoothed over. The Ltbp3-null mouse is curated as three separately graded model links - RECAPITULATES for the enamel phenotype, RECAPITULATES for maxillary underdevelopment, and FAILS_TO_RECAPITULATE for platyspondyly, since the source states platyspondyly was not observed and the mouse bone density runs opposite to patients' - with a HUMAN_MODEL_MISMATCH discussion attached. Validated with just validate - schema, terms, 47/47 snippets verified - plus check-entity-refs and check-duplicate-keys.

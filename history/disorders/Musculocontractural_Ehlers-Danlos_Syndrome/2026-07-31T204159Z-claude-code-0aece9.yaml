  details: |
    Applies the three actionable non-blocking suggestions from the ai4c-reviewer APPROVE re-review of PR #7422. The PR was already approved; these were taken because two of them are the same name-broader-than-bound-term pattern the review's IMPORTANT item 3 corrected, at smaller scale, and leaving them would be internally inconsistent with the fix just made.

    1. Split "Wide Anterior Fontanel with Delayed Closure" into "Wide Anterior Fontanel" (HP:0000260) and "Delayed Closure of the Anterior Fontanelle" (HP:0001476). The GeneReviews snippet "large anterior fontanel with delayed closure" supports both halves independently; size and closure timing are distinct features.

    2. Split "Cardiac Valve Abnormalities and Congenital Heart Defects" into "Cardiac Valve Abnormalities" (HP:0001654 Abnormal heart valve morphology) and "Congenital Heart Defects" (HP:0001627 Abnormal heart morphology). The GeneReviews management line names both lesion classes, and congenital structural malformation is mechanistically distinct from progressive valve abnormality.

    3. Downgraded Hearing Impairment evidence from SUPPORT to PARTIAL. The reviewer was right that the claim is inferred from a management line ("hearing aids as needed") rather than a direct prevalence statement. The reviewer independently confirmed the GeneReviews cache holds no more direct hearing statement, so the source is retained as the best available, but the strength marker now matches the inference. Added the annual otologic surveillance line as a second corroborating PARTIAL item and recorded the indirectness explicitly in the phenotype description.

    Not changed, per the reviewer's own assessment: "Short Nose with Hypoplastic Columella" keeps HP:0003196 with the columella limitation documented in the description, since HPO has no hypoplastic-columella term (only HP:0009929 Abnormal columella morphology).

    Phenotype count 38 to 40. Compliance 96.5 to 96.6 percent global (96.9 weighted). Validation: validate, validate-terms, validate-references all pass; 104/104 snippets verified.

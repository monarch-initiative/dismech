  summary: 'Create: Musculocontractural Ehlers-Danlos Syndrome (CHST14/DSE)'
  details: |
    New entry for musculocontractural EDS (MONDO:0011142), covering both gene-defined forms as has_subtypes: mcEDS-CHST14 (MONDO:0020681, "type 1") and mcEDS-DSE (MONDO:0014236, "type 2").

    Lump-vs-split rationale: MONDO models the two forms as a disease_series_by_gene split; MONDO:0020681 carries no definition of its own, the forms are clinically near-indistinguishable, and the priority dashboard recommends LUMP_INTO_PARENT for both children with CURATE_ROOT for the parent. Modeled on the Spondylodysplastic_Ehlers-Danlos_Syndrome precedent, which likewise unifies three gene-defined forms of a GAG-biosynthesis EDS.

    Pathophysiology: five-node chain. Dermatan sulfate biosynthesis failure -> decorin GAG chain replacement by chondroitin sulfate -> disorganized collagen fibril assembly -> a two-arm split into congenital malformation and progressive multisystem connective tissue fragility.

    Sourcing: GeneReviews (PMID:40373179) used as the mandatory phenotype baseline, plus PMID:31905796 (pathophysiology review), PMID:25703627 (Syx, decorin glycanation), PMID:23704329 (Mueller, DSE index report), PMID:32130795 (mcEDS-DSE delineation), PMID:26646600 (CHST14/D4ST1 deficiency), PMID:28306229 (2017 EDS nosology). Deep-research providers were NOT used; literature was found directly via the PubMed E-utilities API and every PMID cached with just fetch-reference.

    Epistemic markers: the mcEDS-DSE severity explanation is recorded as supports PARTIAL because the source states it as a hedged proposal, and a KNOWLEDGE_GAP discussion tracks it. A HUMAN_MODEL_MISMATCH discussion records that the perinatally lethal Chst14-null mouse cannot report on the progressive postnatal fragility arm.

    No module conformance declared. mcEDS shares a GAG-biosynthesis mechanism class with spondylodysplastic EDS and the pair is flagged as a candidate for a future shared module, but no such module exists yet. Despite MONDO placing mcEDS under congenital disorder of glycosylation, the dismech congenital_disorder_of_glycosylation module is scoped to N-glycosylation and does not fit.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS with 72/72 snippets verified against cached abstracts. Compliance 95.3 percent global / 95.7 percent weighted; residual gaps are root datasets (none exist for this ultra-rare disorder) and datasets/evidence on proposed_experiments (not-yet-run by definition).

  summary: 'Address PR #7422 review: ontology precision, phenotype splits, diagnosis/progression/histopathology'
  details: |
    Addresses the ai4c-reviewer REQUEST CHANGES review on PR #7422 (no CRITICAL items; five IMPORTANT).

    1. Ontology precision: swapped the root GO:0008146 "sulfotransferase activity" for GO:0001537 "dermatan 4-sulfotransferase activity" (EC:2.8.2.35), which is exactly the D4ST1/CHST14 activity and matches the preferred_term verbatim. Verified with OAK.

    2. Phenotype name/term alignment: split three entries whose names claimed more than their bound HP term. "Multiple Congenital Contractures" now binds HP:0002828 Multiple joint contractures, with a new separate "Adducted Thumb" (HP:0001181) entry alongside the existing talipes entry. "Characteristic Craniofacial Features" was renamed to "Hypertelorism" (HP:0000316) and the remaining gestalt components split into ten individually HP-bound entries (wide anterior fontanel, short palpebral fissure, low-set ears, posteriorly rotated ears, short nose, long philtrum, thin upper lip vermilion, narrow mouth, high palate, micrognathia). "Atrophic Scarring and Poor Wound Healing" split into "Atrophic Scarring" (HP:0001075) and "Poor Wound Healing" (HP:0001058).

    3. Added the missing diagnosis section: molecular genetic testing of CHST14/DSE, the three major clinical diagnostic criteria, and skin fibroblast GAG/decorin analysis.

    4. Closed the phenotype-coverage gap the reviewer identified from the GeneReviews multisystem statement. Added Cardiovascular (cardiac valve abnormalities and congenital heart defects, HP:0001654), Neurologic (hypotonia HP:0001252 and motor delay HP:0001270, recategorized from Musculoskeletal and split), and Otologic (hearing impairment HP:0000365). All four organ systems GeneReviews names as additionally involved are now covered.

    5. Added progression (congenital presentation, then progressive connective-tissue fragility) and histopathology (the hallmark disorganized dermal collagen fibril EM architecture, marked diagnostic).

    Deep research: still no provider artifact. The reviewer offered the alternative of adding the missing systems from GeneReviews directly and noting the scoping decision; that route was taken because running a deep-research provider was out of scope for this session. A sourcing note recording this is now in the entry notes.

    Phenotype count rose 24 to 38. Compliance 95.3 to 96.5 percent global (96.8 weighted). Validation: validate, validate-terms, validate-references all pass; 101/101 snippets verified.

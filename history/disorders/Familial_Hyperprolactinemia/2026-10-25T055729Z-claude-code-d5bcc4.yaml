  summary: 'Create: Familial_Hyperprolactinemia'
  details: |
    New entry for familial hyperprolactinemia (MONDO:0014250), caused by germline PRLR loss of function. Built from the two published families: the heterozygous His188Arg kindred (PMID:24195502) and the Arg171Ter/Pro269Leu compound heterozygote with agalactia (PMID:30575453). The causal chain runs PRLR loss of function -> impaired JAK2-STAT5 signalling -> loss of short-loop dopaminergic feedback and of direct lactotroph restraint -> prolactin hypersecretion -> hyperprolactinemia, with branches to mammary resistance (agalactia) and reproductive-tract resistance (infertility). The feedback and implantation steps rest on Prlr-null and conditional knockout mice (PMID:12370275, PMID:27581458, PMID:9009200, PMID:10935023). Oligomenorrhea is deliberately left unconnected, with a KNOWLEDGE_GAP explaining why; the pituitary-tumour difference between mice and patients is a HUMAN_MODEL_MISMATCH. Deep research: falcon was requested, but EDISON_API_KEY was empty in this environment, so the run fell back to OpenScientist (recorded in the report frontmatter). The report resolved 22/22 references and 7/7 quotes. It was used for leads only. Two of its claims were rejected: it lists absence of galactorrhea as a distinguishing feature, but the heterozygous proband had persistent postpartum galactorrhea; and it cites PMID:39355173 for a PRLR Ser434Phe variant, but that paper concerns the androgen receptor. Several report CURIEs were wrong (for example CL:0002313, a prostate cell, offered as lactotroph) and none were used. just preflight-dr could not run because the local MONDO build is absent; I checked the report by hand instead: PRLR is named 50 times, and MEN1 and AIP once each, only as excluded causes. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validated with just validate (schema, terms, references), just count-verified-snippets (32/32), check-entity-refs, check-causal-targets and the other offline gates, and just validate-disorders before push.

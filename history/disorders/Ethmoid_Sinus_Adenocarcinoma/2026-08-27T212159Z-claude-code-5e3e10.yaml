  summary: 'Create: Ethmoid Sinus Adenocarcinoma / sinonasal intestinal-type adenocarcinoma
    (MONDO:0002418)'
  details: |
    New Disease entry for adenocarcinoma of the ethmoid sinus, the glandular member of the paranasal sinus carcinoma umbrella (issue 9036) and the histology carrying the strongest occupational aetiology in the group.

    Term-binding decision, recorded in the entry notes: MONDO has no class for sinonasal intestinal-type adenocarcinoma (ITAC), and no NCIT sinonasal intestinal-type term exists either. The closest available anchor is MONDO:0002418 ethmoid sinus adenocarcinoma, and the ethmoid is the sinus subsite most affected by sinonasal adenocarcinoma, so the entry is named and keyed on that class with ITAC and non-ITAC modelled as has_subtypes. Most of the cited molecular and occupational literature is reported at sinonasal rather than ethmoid-subsite level, and each affected evidence explanation says so explicitly.

    Pathograph: chronic sinonasal inflammation from retained occupational dust -> inflammation-associated TP53 mutagenesis (conforms_to genome_instability_mutation#Failure of DNA Damage Surveillance and Repair) -> heterogeneous oncogenic pathway mutation, and thence -> intestinal-type glandular transformation -> locally aggressive growth with dural invasion.

    Occupational aetiology modelled per the issue brief: hardwood dust (ECTO:7000135) and leather dust both carry environmental entries with influences_mechanisms TRIGGERS edges into the chronic-inflammation trigger node, each with its own evidence. Leather dust is bound to the parent ECTO:7000001 exposure to dust with a more specific preferred_term, because ECTO has no leather-dust class (ECTO:0500006 is exposure to leather dye, a different agent); this is recorded in the entry rather than left as an implicit gap.

    Deliberate non-conformance, recorded as a KNOWLEDGE_GAP discussion attached to the Heterogeneous Oncogenic Pathway Mutation node: the Wnt, MAPK, PI3K and receptor-tyrosine-kinase mutations found in ITAC are exactly the subject matter of sustaining_proliferative_signaling, but the only study to look reported that pathway protein expression did not correlate with mutations in those pathways and that no gene, pathway or pathway-activity level correlated with outcome. Conformance is therefore withheld rather than asserted, and the paper's own no-characterizing-driver conclusion is curated as supports PARTIAL.

    Validation: just validate passed on schema, terms and references; snippets 28/28 verified against cached references.

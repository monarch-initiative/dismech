  details: |
    Response to the CHANGES_REQUESTED review on PR #9766 (the uncited-reference-cache finding and the subtype-term observation).

    Turri-Zanoni 2022 (DOI:10.1007/s11912-021-01154-3) now carries the evidence behind this entry's ontology anchor, which until now existed only as prose in the entry-level notes: intestinal-type adenocarcinoma is the commonest sinonasal adenocarcinoma and 40-85% of cases arise in the ethmoid sinuses. Recorded as a second prevalence record, explicitly flagged in its notes as a subsite distribution rather than a population rate. The same paper's "occupational exposure represents a key point in ITAC cancerogenesis, demonstrated in about 88% of cases" is attached to the non-ITAC subtype, because it is the contrast that makes non-ITAC's lack of a wood-dust association a subtype-distinguishing feature rather than a small-numbers artefact.

    Re-fetching that reference was necessary rather than incidental: the committed cache was abstract-only and the abstract is review boilerplate with nothing substantive to quote. The full text carries both figures. Re-fetched with just fetch-reference, never hand-edited.

    Thawani 2023 (DOI:10.3322/caac.21752) supplies the denominator the existing 8-25% case-mix fraction is taken over - sinonasal malignancies at 0.5-1.0 per 100,000 - which is what converts that fraction into an order of magnitude for this histology. Attached to the existing prevalence record, with the explanation noting the figure is sinonasal-level and not ethmoid-specific.

    Both ITAC and non-ITAC subtypes now carry review_notes recording that the absent subtype_term is a checked absence - neither MONDO nor NCIT has a class for either histology - rather than an unfinished binding. This was the reviewer's item 7.

    Dropped references_cache/DOI_10.3389_fonc.2020.01402.md. The committed copy had an empty Content section; re-fetching recovered 96k of full text, but SNUC and sinonasal adenocarcinoma appear in that text only inside the reference list, so the paper is not a usable source for either entry in this PR.

    Validation: just validate, just validate-terms, just check-duplicate-keys, just check-folded-hyphens all pass. just count-verified-snippets reports 31/34 verified, 3 skipped by prefix; the 3 skipped are DOI: references and were checked by hand as exact whitespace-normalized substrings, including the en-dash characters in "0.5-1.0 per 100,000" and "(40-85%)", which the validator does not normalize.

  summary: Curate KRAS discordance and the ERBB2 negative result from the new DR report
  details: |
    Follow-up on PR #9766 after running the deep-research report the reviewer asked for (research/Ethmoid_Sinus_Adenocarcinoma-deep-research-claude_code.md). Two findings in that report were substantive enough to curate, both of them negative or discordant results, which the entry had no way to represent before.

    KRAS added as a discordant somatic mutation frequency. Reported frequency across the literature spans zero to roughly half of cases, with the highest figures from small early series and contemporary panel sequencing near the bottom. Curated as a range, in notes, rather than a point estimate, because the discordance is the finding: ITAC's morphologic resemblance to colorectal adenocarcinoma does not extend to colorectal-like KRAS activation. Wu et al. (PMID:8685214) supply both the zero end of the range and the authors' own conclusion that histologic similarity is not a guide to this tumour's genetics - which is the reason the colorectal driver set is not assumed anywhere else in this entry.

    ERBB2 added as an explicit negative. HER2 assessment in ITAC had produced contradictory reports, and that discordance was what kept HER2-targeted therapy alive as a candidate. Maffeis et al. (PMID:31047725) tested 43 cases at both protein and DNA level, found no amplification by CISH at all, and state the finding rules out any oncogenetic role for HER2 in ITAC pathogenesis. Both evidence items are supports: REFUTE. This is curated as a closed question rather than an open discordance like KRAS, and it is the reason no anti-HER2 treatment appears in the treatments section.

    The reference-validation pass over the research report fetched 35 reference caches as a byproduct. Only the two actually cited here are committed; the other 33 were discarded with git clean rather than committed uncited, since committing fetched-but-uncited caches is the exact finding the reviewer raised against the first round of this PR.

    Validation: just validate, just validate-terms, just check-duplicate-keys pass. just count-verified-snippets reports 35/38 verified, 3 skipped by prefix - up from 31/34, so all four new snippets verified against their caches.

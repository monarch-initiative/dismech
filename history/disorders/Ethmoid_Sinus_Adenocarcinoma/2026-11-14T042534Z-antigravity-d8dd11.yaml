  details: |
    Added Cancer category, ICD-O Adenocarcinoma morphology, Harrison's ONCOLOGY_HEMATOLOGY and ENVIRONMENTAL_EXPOSURES chapters, ILO cancer_wood_dust and EU upper_respiratory_tract_cancer_from_wood_dust occupational classifications, and IARC Group 1 exposure_classifications on hardwood and leather dust exposures. Repaired all 3 baseline defects: grounded TP53 (and EGFR/MET/HRAS) nodes with somatic genetic_context and GO molecular_functions, and rewrote two retired PARTIAL-grade prose explanations on PMID:34638506 and PMID:29389737. Connected Epistaxis and Nasal Obstruction (both FREQUENT) to Locally Aggressive Growth with Dural Invasion (fixing ZERO_CONNECTED), added relationship_type and variant_origin to TP53/KRAS/ERBB2, and added NCIT:C23020 CDX2/CK20 immunohistochemistry diagnosis while preserving Paranasal_Sinus_Carcinoma grouping criteria.

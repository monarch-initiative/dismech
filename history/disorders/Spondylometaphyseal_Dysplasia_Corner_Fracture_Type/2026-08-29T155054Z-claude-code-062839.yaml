  summary: 'Merge main: reconcile duplicate curation, port GeneReviews and five phenotypes'
  details: |
    Merge of origin/main into the PR branch, resolving the add/add conflict that PR Shepherd escalated as needing a curator.

    Three of this PR six entries collided with independent curations of the same diseases that reached main in #9744: corner-fracture type, cone-rod dystrophy, and corneal dystrophy. Resolution was to reconcile rather than pick a side. This branch versions are the base (roughly twice the size, carrying the pathograph wiring, gene-to-mechanism fixes, four rounds of review fixes, and 2024-2026 literature that main versions predate), with everything main had that this branch lacked ported in.

    Ported from main into the corner-fracture entry: PMID:32200603 (the GeneReviews chapter, which the reviewer had twice recorded as non-existent and unverifiable — it exists, and it is the source that settles the de-novo-versus-inherited balance), PMID:30051459 (patient mass-spec establishing the secretion block is partial rather than absolute, with ER retention), and five phenotypes — waddling gait, limitation of joint mobility, atlantoaxial instability, glaucoma, hypertension. Atlantoaxial instability independently corroborates the single os odontoideum case already curated here.

    A new Extraskeletal Fibronectin-Related Disease pathophysiology node carries glaucoma and hypertension, fed from the matrix-assembly node with INDIRECT_UNKNOWN_INTERMEDIATES. A surveillance recommendation evidences that something is a recognised consequence, not the route by which it arises, and the edge is graded accordingly. Phenotype connectivity remains 100 percent (70/70) and gene wiring 6/6.

    Differences where main used a less specific binding (Corneal dystrophy vs Corneal opacity, Intellectual disability vs Global developmental delay, Metaphyseal irregularity vs Metaphyseal cupping) were left on this branch more specific terms.

    Also migrated 35 supports: PARTIAL items across the six entries to the enum narrowed in #10003. All 35 were the same case — support through an inference step or an author hedge — so each became SUPPORT with directness: INDIRECT rather than the migration script blanket SUPPORT with directness absent; the script states that only a curator reading snippet against claim can make that call. Eleven explanations naming PARTIAL were reworded. None was the split-into-two case or NO_EVIDENCE. Note that main itself still carries supports: PARTIAL in 23 disorder files from PRs that merged around the migration; those are out of scope here.

    Review finding 7 fixed: removed the changelog sentence from the group-12 schema description.

    Validated on the merged tree with just validate-disorders (6/6, 299 snippets), the connectivity metric, check-duplicate-keys, check-entity-refs across 2752 files, validate-classification, and check-stubs. The diff against main touches only the six entries, their caches and references, the schema description, and history records.

  summary: 'Create: Spondylometaphyseal dysplasia, corner fracture type'
  details: |
    ISDS Nosology group 12, row NOS 12-0030. Pathograph runs from cysteine-substituting FN1 variants in the N-terminal type-I assembly domains through endoplasmic-reticulum retention and reduced fibronectin matrix assembly to the metaphyseal modelling defect that mimics corner fractures. Records non-accidental injury as a differential explicitly, since that is the practical risk of the radiographic appearance, and notes that the lesions healed with skeletal maturation in one reported patient. The COL2A1-related form is recorded in the genetic section with a note that the nosology row is FN1-specific and places the type 2 collagenopathies in a different group. 36 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

  details: |
    Round-5 review response. Every previously blocking item was already fixed; this addresses the one new finding plus the three smaller notes.

    The new finding was a genuine defect in my own merge reconciliation, and worth stating plainly: the port from main into the corner-fracture entry dropped evidence. That merge existed specifically to avoid losing curation, and no gate can see a dropped evidence item, so it took a reader to catch.

    Two items restored. PMID:30051459 had three evidence items in main and I ported two; the one I dropped was the only direct measurement of the entry central claim — immunofluorescence and immunoblotting showing mutant fibroblasts assemble significantly less fibronectin matrix than wild-type. Everything else on that edge measured fibronectin levels in plasma or medium; nothing measured assembled matrix, which is the quantity the disorder is actually about. Restored onto the edge that asserts it. PMID:32200603 GeneReviews had 21 items in main and I ported eight; the management material did not come across, which left Orthopaedic Management of Deformity claiming no management study exists while a cached, quotable expert recommendation sat unused. Now cited as evidence_source OTHER, with the notes narrowed to say what is true: no trial or comparative study exists, but an expert-consensus recommendation does.

    Three smaller notes. The mass-spectrometry quote spanning patient plasma and fibroblast culture medium was graded HUMAN_CLINICAL during the port where main graded it IN_VITRO; regraded to IN_VITRO with the reasoning recorded in the explanation, since the evidence is a mass-spectrometry assay run on patient-derived samples outside the organism rather than a clinical observation, and that also makes it consistent with the companion quote from the same paper. The three colliding entries lost main top-level references: blocks in the merge; restored, including the GeneReviews tag on the corner-fracture entry. The cone-rod entry had dropped main cross-reference to PMID:29122926; restored on the cone-rod dystrophy phenotype, where it is independent corroboration from outside the PCYT1A literature.

    Validated: just validate-disorders 6/6 with 305 snippets verified, phenotype connectivity 71/71 and gene wiring 6/6, check-duplicate-keys, check-entity-refs, check-snippet-grading, check-folded-hyphens, check-snippet-length, check-title-snippets, and the entity-ref, model-readout, graph and reference pytest selections (13221 passed).

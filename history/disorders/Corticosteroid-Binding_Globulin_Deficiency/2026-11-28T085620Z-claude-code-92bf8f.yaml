  summary: 'Create: Corticosteroid-Binding Globulin Deficiency'
  details: |
    New entry for corticosteroid-binding globulin deficiency (MONDO:0012675, SERPINA6),
    curated from the stub and claim issue 19047 alongside a SERPINA6 gene review in
    ai4curation/ai-gene-review (branch claude/serpina6-cbg-coreview); the two were
    reconciled and agree on mechanism, numbering and variant classes.

    Sources. 30 primary and review papers were cached with `just fetch-reference` and read;
    PMID:34308089 was upgraded to PMC full text because the Montevideo variant name is not
    in its abstract. No GeneReviews chapter exists (`just check-genereviews`: NO_CHAPTER),
    ClinGen has no gene-disease validity record for SERPINA6 in the cached export.

    Structure and population analysis done for this entry (not taken from a report):
    UniProt P08185 features; PDB 2VDX, 2VDY, 4BB2, 4C41, 4C49 (Biopython NeighborSearch
    for residues within 4 A of the steroid and residue contacts, Shrake-Rupley relative
    accessibility, chain A); AlphaFold AF-P08185-F1 v6 pLDDT and AlphaMissense scores;
    global BLOSUM62 alignment to SERPINA1 and SERPINA7; gnomAD v4.1 constraint and allele
    counts through the gnomAD API; ClinVar classifications as carried by gnomAD. Every
    literature residue was checked against the canonical sequence in mature and precursor
    numbering. Two HGVS c. names not given in the sources (c.1178G>C, c.845G>T) were
    derived from the Ensembl ENST00000341584 coding sequence and are marked as such.

    Deep research. `just research-disorder openscientist` was run; the first job
    (2986bb4a-9d6b-4b39-93fa-861c7600f0bf) hit the 3600 s client timeout and was cancelled
    with no report. The re-run with a 7000 s timeout (job
    2a7330fe-1795-4498-aab2-1cd3ab0293df) returned after the entry was written and the PR
    opened. Its report is research/Corticosteroid-Binding_Globulin_Deficiency-deep-research-openscientist.md
    (67 of 67 references resolved, 32 of 32 quotes found, `just preflight-dr` PASS). It was
    read as a check on the finished entry and agreed with it; five leads from it were then
    verified against the cached sources and added: the unselected 1982 survey that found
    3 Leuven heterozygotes in 500 samples, the brain-specific knockout result, the review
    statement that severe alleles are rare in fatigue cohorts, the rat finding that
    cleavage does not trigger the serpin transition (as a model divergence), and the
    Orphanet record ORPHA:199247, which an earlier label search of the cache had missed.
    The report's NCIT suggestions for hydrocortisone, glucocorticoid therapy and estrogen
    therapy resolve to unrelated terms and were not used. The focused
    `just research-hypothesis openscientist ... cbg_reservoir_blunted_stress_surge` run
    (job b82348bb-1bde-4d3f-89de-c05fa183a69e) also returned. It argues from a simulation
    that loss of the CBG-bound store cannot by itself blunt the free cortisol rise. The
    run was assessed in
    kb/hypotheses/Corticosteroid-Binding_Globulin_Deficiency/cbg_reservoir_blunted_stress_surge/assessments/
    (`just validate-hypothesis-assessment` passes), and its central calculation was
    reproduced with an independent script committed there. Its model code and manifest
    were not delivered, so no provider analysis is recorded as succeeded and the
    analysis-run gate was not applied. In the entry the reservoir hypothesis was restated
    and moved from EMERGING to ALTERNATIVE, with PMID:21054475 and PMID:31570737 added;
    the simulation itself is not cited as evidence.

    Co-review. After the companion session's own hypothesis run, the wording for the
    Leuven and H89Y variants was changed from acting through helix D to mechanism not
    established.

    Pre-PR review. A fresh-context review of the draft found eight points, all taken:
    the Montevideo allele terminates at codon 98, not in the signal peptide; an untested
    nonsense-mediated-decay statement was removed; the ascertainment hypothesis now cites
    the sex-ratio and blinded pain findings against it; the hydrocortisone and diagnosis
    text for PMID:40365551 was corrected (the proband stayed on treatment); the knowledge-gap
    rationale no longer says carriers were never studied genotype-first; the A51V carrier
    rate uses both sexes; and two snippets were replaced with sentences that carry their
    claims.

    Validation. `just validate` (schema, terms, references) passes with 111 of 111 snippets
    verified; the ungated whole-repo gates listed in CLAUDE.md pass, including
    check-gene-namespaces after the MGI row was resolved online; all 7 phenotypes are
    causally connected. The symptom mechanism is recorded as competing hypotheses and a
    KNOWLEDGE_GAP discussion, not as an established edge.

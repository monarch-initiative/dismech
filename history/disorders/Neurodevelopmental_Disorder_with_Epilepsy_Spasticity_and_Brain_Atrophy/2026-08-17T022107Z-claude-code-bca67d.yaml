  summary: 'Create: Neurodevelopmental Disorder with Epilepsy, Spasticity, and Brain
    Atrophy (NEDESBA, TRAPPC4)'
  details: |
    De novo curation of NEDESBA (MONDO:0032894, OMIM:618741), an autosomal recessive TRAPPopathy caused by biallelic TRAPPC4 variants.

    NEC preflight: OAK confirmed MONDO:0032894 carries OMIM:618741 and an RO:0004003 relationship to HGNC:19943 (TRAPPC4); `just preflight-dr` on the falcon deep-research report returned PASS (TRAPPC4 mentioned 56 times, no competing TRAPPC-family gene). The TRAPPC gene family is a known named-entity-confusion trap, so every citation was individually checked to be TRAPPC4-specific, except the deliberately cross-family citations used in differential_diagnoses.

    Deep research provider: falcon (Edison). All PMIDs were fetched with `just fetch-reference` and every snippet verified as an exact substring of the cached reference (119/119).

    Pathophysiology modeled as an 11-node causal chain, each node tagged with biological_scale: biallelic TRAPPC4 loss of function (MOLECULAR) -> aberrant exon-3 splicing with nonsense-mediated decay (MOLECULAR) -> reduced TRAPP complex assembly and stability (MOLECULAR) -> impaired RAB1 GEF activity (MOLECULAR) -> impaired ER-to-Golgi vesicular tethering and Golgi transit (CELLULAR) plus defective autophagosome formation and autophagic flux (CELLULAR) -> neuronal secretory and autophagic failure (CELLULAR, mechanism_confidence HYPOTHETICAL) -> cortical network hyperexcitability, corticospinal spasticity and progressive cerebral/cerebellar neurodegeneration (TISSUE) -> arrest of psychomotor development with regression (ORGANISM). Mechanistic cell-biology evidence is tagged IN_VITRO (patient fibroblasts, VSVG-GFP trafficking, autophagic flux, native PAGE/SEC) or MODEL_ORGANISM (yeast trs23 temperature-sensitive model), never HUMAN_CLINICAL.

    The degenerative-on-developmental course is modeled explicitly: clinical_course PROGRESSIVE on developmental regression, microcephaly, spastic tetraplegia, cerebral cortical atrophy and optic atrophy, plus a four-phase progression section (onset, stagnation/regression, progressive brain atrophy, late complications and mortality).

    Five sibling TRAPPopathies (TRAPPC12/PEBAS, TRAPPC6B/NEDMEBA, TRAPPC2L, TRAPPC11/LGMD R18, TRAPPC9/MRT13) are curated as differential_diagnoses with MONDO bindings and the gene distinction stated explicitly in distinguishing_features, plus a neurometabolic/neurodegenerative-mimic differential.

    Frequency bands are used only where a quotable numerator and denominator exist (early-onset seizures 23/31, cerebellar atrophy 21/27, movement disorder 12/33), with the derivation recorded in the phenotype notes.

    No GeneReviews chapter exists for TRAPPC4, NEDESBA, or the TRAPPopathies (PubMed searched); this is documented in the entry notes. Mortality is recorded in the progression section rather than as a phenotype because HP:0003819 sits under Clinical modifier rather than Phenotypic abnormality and is not a valid phenotype_term in this schema. Physical therapy is bound to NCIT:C15302 rather than MAXO:0000011 because the TreatmentActionTerm dynamic enum is reachable only from NCIT:C25218.

    Validation: `just validate` (schema + terms + references) passes; 119/119 snippets verified against cached references.

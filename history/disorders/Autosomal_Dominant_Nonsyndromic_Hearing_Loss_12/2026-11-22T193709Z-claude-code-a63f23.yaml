  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel autosomal dominant classification for TECTA (Definitive, 2018-01-02), filed under MONDO:0019497, which the entry now maps as skos:broadMatch; the panel's separate autosomal recessive TECTA record belongs to DFNB21 and is not recorded here. Added a pathophysiology node, Reduced Inner Hair Cell Drive at Best Frequency, with an edge from the matrix-assembly node and an edge to the hearing-loss node, all citing PMID:15995703: in Tecta Y1870C/+ mice cochlear mechanics are little changed while neural thresholds rise, so the entry's single outer hair cell route did not cover that allele's mouse phenotype. The node description states that this is one allele in the mouse and that the human p.Y1870C family has absent emissions. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

  summary: Resolve merge-queue conflict; fix wrong NCIT hearing-aid qualifier binding
  details: |
    Two changes in response to the merge-queue dequeue and the re-review on PR #10250.

    Merge conflict. The GitHub merge queue dropped this PR with MERGE_CONFLICT. Resolved by merging origin/main into the branch. Two files conflicted, both derived term caches, both the same add/add shape where a new row lands at the same position in a sorted list: cache/uberon/terms.csv and cache/enums/anatomicalentityterm_c7eab8227a65.csv. This branch added UBERON:0002233 (tectorial membrane of cochlea, which this entry binds); main added UBERON:0002228 (rib, from another author's merged work). Both rows are legitimate and both were kept, in canonical sorted order. No cache row was hand-written beyond placing those two lines that the merge could not order; "just normalize-cache" afterwards reported 0 files updated, which is the check that the resolution was canonical rather than merely plausible, and check-term-cache-integrity and check-cache-order both pass. The effective diff against main is unchanged at 36 files.

    Wrong ontology binding on a qualifier, caught in re-review. The medical-device qualifier on the hearing amplification treatment was bound to NCIT:C49947 with the label "Hearing Aid". NCIT:C49947 is actually "Fan Device". The correct term is NCIT:C183182 "Hearing Aid", which was already in cache/ncit/terms.csv and is what three sibling entries bind at the same slot (Otofacial_Neurodevelopmental_Syndrome, Autosomal_Recessive_Nonsyndromic_Hearing_Loss_77, Ageing_Associated_Decline_in_Intrinsic_Capacity). Rebound; preferred_term "hearing aid" and the NCIT:C15315 Rehabilitation action term are unchanged.

    Why nothing caught it, which is the part worth recording. linkml-term-validator does not descend into qualifiers, since Qualifier.predicate and Qualifier.value are plain Descriptors with no dynamic-enum binding, so "just validate-terms" reported a pass on a fabricated label (issue #10197). The offline gate could not catch it either: NCIT:C49947 is a qualifier-only CURIE that nothing else in the KB seeds, so it was in no cache and check-qualifier-terms reported it as uncached and unchecked rather than as wrong. Only the online form resolves against the ontology.

    This entry now carries four qualifier-bound terms across two device treatments, and "just check-qualifier-terms-online" was run against all four after the fix: it reports "OK: 4 qualifier term label(s) match the ontology". Recording that explicitly, because the offline gate's pass does not distinguish "checked" from "unable to check", and a later curator reading a green offline result has no way to tell which of the two it means.

    Validation on the resulting head: just validate passes with 58/58 snippets verified; validate-terms, check-qualifier-terms (offline and online), check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-cache-order and check-term-cache-integrity all pass. Zero cache churn from the rebind, since NCIT:C183182 was already cached.

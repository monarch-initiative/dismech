  summary: Review TECTA hearing-loss mechanisms, phenotype limits and treatment evidence
  details: |
    Substantive review of the whole existing entry. Confirmed no prior REVIEW event and no overlapping open PR when this worktree was created. This genetic hearing-loss disorder is eligible under the campaign excluding infectious and environmental diseases/poisonings; noise is a modifier, not its etiology.

    Read the matching OpenScientist scientific narrative, bibliography and validation appendix and all cited abstracts. Used the cached full scientific narratives of PMID:40583560, PMID:21520338 and PMID:26806019; the full methods/results/discussion of PMID:21567249; the relevant TECTA case and discussion of PMID:24130743; the full PMID:24363064 paper retrieved through EuropePMC XML; and newly regenerated full texts of PMID:37927186 and PMID:33559882 (results/discussion and relevant methods). Also retrieved and read PMID:18665028 to check an indirect histopathology attribution: its kindreds were ungenotyped, so they cannot establish human TECTA pathology. PMID:10196713 has abstract/paywall material rather than a usable full body; supplementary files were not independently retrieved. All cache changes were generated with just fetch-reference. The EuropePMC XML cache has an automatically extracted title of INTRODUCTION, but its article metadata identifies PMID:24363064; the entry cites the published PMID, not that extraction label. The failed direct PMC CAPTCHA cache is excluded.

    Corrected the major source-to-claim mismatches. The 2013 implanted TECTA patient was compound heterozygous for DFNB21 and did not receive EAS, so the case cannot establish dominant DFNA8/12 implant efficacy. The fourfold vital-dye result followed electrical stimulation of excised cochleae, not noise exposure in living mice; after noise, total hair-cell loss was not significantly greater, although its spatial distribution and emission-threshold recovery differed. Unchanged total RNA in the 2025 splice study does not prove normal mutant secretion or protein abundance. Congenital and prelingual onset are distinct; a child passed newborn screening before diagnosis. Stable Cys1036Tyr, progressive Asn465Lys and normal emissions in a young Cys1837Gly carrier limit blanket genotype and phenotype rules. Historical variant counts and cohort ascertainment are explicit.

    Added the omitted C1837G mouse and fixed the dangling generic Mouse discussion target. The L1820F/G1824D human family is stable, so lack of mouse progression is concordant for that allele. The audiogenic-seizure experiment involved C1619S, C1837G and L1820F/G1824D, not C1509G; susceptibility prevented the planned high-noise experiment. Added supported phenotype and vulnerability edges without extrapolating experimental injury to a proven human progression mechanism. PMID:33559882 is not merely duplicative: it supports a separate provisional calcium/adaptation hypothesis in a double-knockout model. PMID:37927186 was wrongly described as general hearing-loss literature; its family segregation and hearing-aid use now inform the entry.

    Eight-dimension deep-research assessment: (1) phenotypes adequate after correcting onset, severity/course and emission generalizations; no report-derived frequency is generalized to all patients; (2) subtypes adequate, with DFNA8/12 aliases and domain patterns retained within one disease and recessive DFNB21 differentiated; (3) pathophysiology adequate, preserving the matrix/coupling/amplification chain, linking experimental vulnerability and distinguishing the calcium hypothesis; (4) treatments adequate after replacing dominant implant overclaims with general candidacy and indirect recessive-case evidence, adding surveillance/noise protection and communication preferences; no disease-specific phase-II-or-later efficacy trial was surfaced by the report; (5) genetics adequate with segregation, splice effects, variant interpretation and historical-count limits; (6) diagnostics/biomarkers adequate with panels/genomic testing, VUS limits, audiology and family evaluation, without importing nonspecific diagnostic-yield figures; (7) references adequate with relevant full texts, explicit indirect evidence and real titles on all additions; (8) consumption adequate with resolved model/graph links and explicit human-versus-model boundaries. CEACAM16 interaction and striated-sheet biophysics remain supporting context rather than new disease subtypes or established human causal branches. No schema change was required.

    GeneReviews overview is tagged and its full current text was mined across clinical presentation, molecular diagnosis, management/surveillance and genetic counseling. TECTA-table prelingual onset is qualified by primary exceptions; generic hearing-loss frequencies and non-TECTA follow-up intervals are not assigned to DFNA8/12. Full text supports family evaluation despite a passed screen, individualized hearing support, general implant candidacy, noise avoidance, 50% variant transmission and personal reproductive choices.

    Local schema/ontology checks and all 78 quotation matches passed before recording this history, as did causal-target, entity-reference and GeneReviews checks. Formal author COMMENT, independent review and CI are separate completion gates for the PR.

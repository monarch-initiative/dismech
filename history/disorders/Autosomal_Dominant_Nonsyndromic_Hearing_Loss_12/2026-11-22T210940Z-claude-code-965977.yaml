  summary: Add the Tecta Y1870C/+ mouse model and clarify the inner hair cell node
  details: |
    Follow-up to the review of the previous change to this entry, which added the Reduced Inner Hair Cell Drive at Best Frequency node from PMID:15995703 without listing the mouse line that paper studied. Added an animal_models record for the Tecta Y1870C/+ mouse with three mechanism links, all citing that paper: RECAPITULATES for the matrix-assembly node (structure readout), RECAPITULATES with fidelity UNKNOWN for the inner hair cell drive node (neural threshold and tuning readout; the human mechanism has not been measured), and FAILS_TO_RECAPITULATE for Cochlear Amplifier Failure, because cochlear mechanics are little changed in the mouse while the human p.Y1870C family has absent otoacoustic emissions; that link carries an INCOMPLETE_PHENOTYPE divergence. Added a notes line on the inner hair cell node stating that the decreased GO:0050910 binding means reduced stimulus delivery, not a transduction defect. No gene descriptor was added to the model, matching the four existing Tecta model records. After review, the model-level quote of the human hearing loss caused by p.Y1870C, which is a background sentence in the mouse paper, was regraded from MODEL_ORGANISM to HUMAN_CLINICAL with quote_role BACKGROUND and directness INDIRECT, and the combined neural readout was split into a threshold readout (INCREASED) and a tuning readout (ALTERED). Validated with just validate-disorders, count-verified-snippets and the offline whole-repo gates.

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 12 (DFNA8/12, TECTA)'
  details: |
    De novo curation of DFNA12 (MONDO:0011102), the TECTA/alpha-tectorin dominant nonsyndromic hearing loss also written DFNA8/12. One openscientist deep-research report was generated and preflighted with "just preflight-dr ... MONDO:0011102", which PASSed with TECTA as the dominant gene mention and matching OMIM 601543. The report's own Term Validation section flagged HP:0008565 as not existing in HPO; that identifier is not bound anywhere here, and the exclusion is recorded in the entry notes so a later curator does not rediscover it from the report.

    Pathograph is a six-node mechanical chain: heterozygous TECTA missense variant, defective tectorial membrane matrix assembly, impaired mechanical coupling to outer hair cell stereocilia, cochlear amplifier failure, bilateral sensorineural hearing loss, plus a separate secondary outer hair cell vulnerability node covering the progressive genotypes. The dominant-negative mechanism is grounded on the DFNB21 comparison in PMID:9949200: heterozygous carriers of a truncating TECTA allele hear normally, which excludes haploinsufficiency as the mechanism of the dominant alleles.

    Three allele-matched mouse models are curated with modeled_mechanisms. Two carry UNCHANGED readouts recording real negative results. The C1619S line does not progress although the human family carrying the same substitution does, and the C1509G line has stable emission thresholds in quiet to six months. These ground a HUMAN_MODEL_MISMATCH discussion asking whether mouse lifespan or absent cumulative acoustic exposure explains the difference. A second discussion records the audiogenic seizure phenotype seen in all three models and never looked for in patients. A third records that the domain-to-audiogram correlation is many-to-one, since entactin and vWFD variants were later found to give mid-frequency loss that had been attributed to the ZP domain alone.

    Validated with just validate for schema and references, 46 of 46 snippets verified against cached references, plus just validate-terms, just check-entity-refs and just check-duplicate-keys, all passing. Term validation initially failed on an EBI OLS read timeout, which is a service error rather than a data error, and passed on retry.

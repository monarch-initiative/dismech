  summary: 'Create: HADDTS (CTBP1)'
  details: |
    New entry for HADDTS (MONDO:0060666, OMIM:617915), caused by heterozygous, mostly de novo CTBP1 variants, principally the recurrent p.Arg342Trp (NM_001328.2:c.1024C>T; MANE NM_001012614.2:c.991C>T, p.Arg331Trp). Pathophysiology is a chain from the PXDLS-cleft missense variant through reduced corepressor cofactor recruitment (Beck et al. 2019 proteomics) to dysregulated neurodevelopmental transcription (patient and isogenic iPSC neurons), impaired neural adhesion and migration, abnormal dendrite, spine and excitatory synapse development (in utero electroporation and cultured neurons), and cerebellar involvement; a hypothetical NOXA derepression and apoptosis branch from patient fibroblasts; a reduced neuronal interferon response; and secondary mitochondrial respiratory chain dysfunction leading to dystrophic myopathy. The node for dysregulated transcription conforms to epigenetic_machinery_neurodevelopmental_dysregulation. Phenotype frequencies come from the 25-case 2026 review (PMID:42589715). Seizures and skeletal anomalies were left out because they were reported only with non-recurrent variants; the enamel defect has no mechanism node because none has been studied. A first pass was built from PubMed; the openscientist deep-research report in research/ was then read and integrated (18/18 references resolved; its NCIT treatment codes were all mislabelled and none were used; its Orphanet name and frequency claims were not used because they were unsourced). Added from the report: PMID:41105133 and PMID:35455998 as normal-biology background evidence. just preflight-dr could not run because the local MONDO build is absent; identity was checked by hand (report names CTBP1 and OMIM 617915 throughout; OLS shows MONDO:0060666 xrefs OMIM:617915). No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (87/87), the offline check-* gates, and just validate-disorders all passed.

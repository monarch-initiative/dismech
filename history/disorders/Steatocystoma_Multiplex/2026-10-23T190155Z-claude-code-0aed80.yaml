  summary: 'Review round 1: Steatocystoma_Multiplex'
  details: |
    Review round 1 changes to the steatocystoma multiplex entry.

    - Bound GO:0005200 structural constituent of cytoskeleton (LOSS_OF_FUNCTION, following the keratin filament fragility module) on the KRT17 variant node, with PMID:26165312 cited as INDIRECT background, so the gene-activity grounding gate passes without a baseline entry.
    - Added a treatment row for the combined 1,450-nm diode and 1,550-nm fractionated erbium laser (PMID:22487444, one case report).
    - Changed the pubertal androgen node from ORGANISM to TISSUE scale, since its substrate is the sebaceous gland. No GO process was bound: GO has no response-to-androgen term, and androgen receptor signaling pathway would assert a receptor mechanism the cited sources do not state.
    - Added a Secondary Bacterial Infection of Cysts node between cyst rupture and inflammation and cutaneous abscess, sourced to PMID:33908804. Rupture and inflammation were left as one node because the sources give them in opposite orders and do not separate them.
    - Replaced the KRT17 sequencing row's methods sentence with a reported yield: KRT17 variants in two of nine patients, seven of them familial (PMID:42376483).
    - No biologic other than adalimumab was added: the PMID:41736170 abstract mentions only potential biologic agents without naming any reported use.

    Validated with validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, the gene-activity grounding gate and validate-disorders.

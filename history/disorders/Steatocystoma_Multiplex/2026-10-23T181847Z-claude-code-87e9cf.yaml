  summary: 'Create: Steatocystoma_Multiplex'
  details: |
    Created the Steatocystoma Multiplex entry (MONDO:0008485, sebocystomatosis)
    from the curation stub, which is deleted in the same change. Kept as one
    Disease entry: familial cases carry heterozygous KRT17 missense variants and
    sporadic cases, many KRT17-negative, have the same clinical and histological
    lesion, so there was no basis for a grouping or for subtypes.

    Content: autosomal dominant and sporadic inheritance blocks; a rare,
    case-count-only prevalence record; a causal chain from the heterozygous
    KRT17 helix initiation motif variant (conforming to the keratin filament
    fragility module trigger) through keratin 17 network disruption, abnormal
    sebaceous duct keratinization and cyst formation to the cysts, with
    pubertal androgen activity and suppressed cyst-wall apoptosis as modifiers,
    and cyst rupture and inflammation leading to abscess, scarring and pain.
    Three competing or preliminary mechanism accounts are recorded as EMERGING
    hypothesis groups: the duct keratinous-plug retention model, the
    pilosebaceous hamartoma model, and the KRT17 p.Arg94Cys SFN-BAD apoptosis
    model. Six phenotypes, all reached by a causal edge. Treatments: excision,
    incision and drainage, CO2 laser, cryotherapy, isotretinoin and adalimumab
    (for disease coexisting with hidradenitis suppurativa), all from case
    reports or small series. Differentials: pachyonychia congenita (allelic),
    steatocystoma multiplex-natal teeth syndrome, eruptive vellus hair cysts,
    epidermoid cysts and hidradenitis suppurativa.

    The dominant-negative mechanism and filament disruption are supported only
    by pachyonychia congenita sources and structural modelling, cited as
    INDIRECT; no SM-specific functional study of mutant keratin 17 was found.
    No GeneReviews chapter exists (check-genereviews: NO_CHAPTER); the
    StatPearls chapter is tagged. No ClinGen record for KRT17 and this disease
    is cached.

    Deep research: openscientist report
    research/Steatocystoma_Multiplex-deep-research-openscientist.md (27/27
    references resolved; term validation flagged HP:0032320, which HPO labels
    "Affected", and that term was not used). preflight-dr returned WARN because
    "PC" (pachyonychia congenita, the allelic disorder) was counted as a second
    gene; the report is about KRT17 steatocystoma multiplex. From the report,
    PMID:35676340, PMID:34116063 and PMID:29998099 were used; the K17-null
    mouse, siRNA and K17 cell biology papers were not, because they concern
    pachyonychia congenita therapy or normal keratin 17 function rather than
    this disease. Most references came from a separate PubMed search.

    Validation: just validate, validate-terms, count-verified-snippets (all
    snippets verified), check-entity-refs, check-causal-targets,
    check-duplicate-keys, list-disconnected-phenotypes (6/6 connected) and
    validate-disorders.

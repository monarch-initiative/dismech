  details: |
    Created the Siderius type syndromic X-linked intellectual disability (MRXSSD, MONDO:0010286, OMIM:300263, PHF8/HGNC:20672) entry from scratch. NEC preflight run first: 'uv run runoak -i sqlite:obo:mondo info MONDO:0010286 -O obo' confirmed relationship RO:0004003 HGNC:20672 PHF8 and xref OMIM:300263, and two independent primary papers (PMID:16199551, PMID:18498374) bind PHF8 to MIM/OMIM 300263 in their own text. Kept strictly separate from PHF6 (Borjeson-Forssman-Lehmann), PHF21A, KDM5C (Claes-Jensen), MECP2 duplication (Lubs) and the incidental PHF8 string in Schinzel-Giedion_Syndrome.yaml, which was not touched. Deep research was run with the claude_code provider (research/Siderius_Type_X-Linked_Intellectual_Disability-deep-research-claude_code.md, 15m26s, 89 turns, 13 citations) and read in full; every PMID and snippet it suggested was independently fetched and re-verified. GeneReviews: searched PubMed twice, no chapter exists for this disorder, documented in notes. Content: 15 pathophysiology nodes forming one connected DAG with the single root 'Pathogenic PHF8 Loss-of-Function Variant', two mechanistic_hypotheses (mTOR targeting, oxygen-sensing clefting), 15 HPO-bound phenotypes, genetic/variants/inheritance/prevalence/diagnosis/differential_diagnoses/treatments/animal_models, and five discussions including three HUMAN_MODEL_MISMATCH/KNOWLEDGE_GAP items. Both discordant Phf8 knockout mouse lines are curated, with the Walsh line's negative cognitive result recorded as supports: REFUTE. Frequency bands derived from the 16-individual cohort in PMID:35469323 with the derivations written into notes; per-feature counts available only in that paper's full text were deliberately omitted as unverifiable. No ORPHA/CGGV/CGDS structured-source citation and no prevalence rate, because those would need a MANIFEST bump (blocked pending #7622) - noted in the entry. Validation: just validate clean (schema, terms, references), scripts/check_snippets_verbatim.py 115/115 verified 0 failed, scripts/check_folded_hyphens.py clean, compliance 82.3%.

  summary: 'Review round 1: coverage gaps, progression, screening, agent bindings'
  details: |
    Answers all nine IMPORTANT items and all five suggestions from review round 1, in one push.

    Phenotypes added, all wired from the cerebellar and brainstem node: Cognitive Impairment (HP:0100543), Delayed Speech and Language Development (HP:0000750), Developmental Regression (HP:0002376), Dysarthria (HP:0001260), Cerebellar Atrophy (HP:0001272). The cognitive node carries the up-to-75-per-cent sequela figure and the sentence listing what the impairment consists of, including that a normal IQ does not exclude it.

    The Children's Oncology Group result that cognitive and adaptive function was stable over ten years in the treated cohort is placed in the long-term progression phase, not on the Cognitive Impairment phenotype. Stable is not normal, so the result bears on the course rather than on whether impairment occurs, and grading it REFUTE against the phenotype would have overstated it.

    progression: added with four phases - acute or subacute onset (57 per cent, ataxia often first), remission on therapy then sustained remission off therapy, relapsing course (over half in one series, triggered by infection or by reducing immunotherapy, possible decades later), and long-term neurodevelopmental sequelae.

    The trigger node was split. Neuroblastic Tumour Trigger keeps the tumour evidence; a new Parainfectious Immune Trigger node carries the reported organisms and the point that an infectious prodrome does not argue against a tumour. Both feed the same B-cell node.

    diagnosis: added Screening for a Peripheral Neuroblastic Tumour (NCIT:C15406 Cancer Screening) with six quotes - the recommendation, neck-to-pelvis whole-body imaging as the gold standard, the inadequacy of chest radiography plus ultrasound, urine VMA insensitivity, the 8 per cent MIBG false-negative rate and why it is worse in the differentiated tumours this syndrome accompanies, and repeat imaging at about 6 months.

    treatments: therapeutic_agent added to all three pharmacotherapy rows (NCIT:C80829, CHEBI:50858 plus CHEBI:3892, NCIT:C1702), therapeutic_modality set on IVIG (OTHER), rituximab (MONOCLONAL_ANTIBODY) and tumour resection (SURGERY). The corticosteroid-or-ACTH row has no modality and a notes field saying why: one clinical decision, two platforms, a single-valued slot, and two existing KB entries recording opposite values for the same agent pair. Added a Physical, Occupational and Speech Therapy row (NCIT:C15315, BEHAVIORAL).

    Irritability and Sleep Disturbance now lead with the sentence that names them and gives a frequency (over half of patients) rather than the criteria sentence, which says only behavior change. The criteria sentence is kept on both, regraded BACKGROUND. Two further quote_role corrections to BACKGROUND: the 50-per-cent association sentence on Neuroblastoma, and the Ri/ANNA2 sentence in the knowledge gap. Both sit in a cohort study's introduction citing earlier work.

    Brainstem (UBERON:0002298) added beside cerebellum on the saccadic instability node, since the omnipause and burst neuron mechanism it cites is brainstem.

    Two snippets were repaired for linkml-reference-validator 0.5.1, which main pinned after this branch was first pushed. The pre-existing PMID:35402641 opsoclonus quote failed the new whole-word boundary rule because the cached text runs reference markers into the adjacent words with no space (unclear.106,107It and movements.108Opsoclonus); it is now quoted from inside the sentence. One new snippet said The decision where the source says A decision and was corrected to the source wording.

    58 of 58 snippets verified and 58 of 58 reference titles checked; every title was generated from its own references_cache frontmatter rather than typed. No deep-research artifact was added - see the PR reply.

  summary: 'Edit: Opsoclonus-Myoclonus Syndrome, first differential diagnoses (four
    mimics)'
  details: |
    Added the entry's first differential_diagnoses section, with four rows.

    Acute cerebellar ataxia: the commonest initial misdiagnosis (the most common misdiagnosis in a cohort of 389 children, PMID:28959231; 2 of 15 children in a UK prospective study as summarised by the 2022 international expert panel's review, PMID:35260471; a common provisional diagnosis in a 20-child series, PMID:41240610). The row gives three distinguishing features (a fourth, irritability with gait ataxia in a toddler, was moved into the description after review because it is a prompt for suspicion and not a discriminator) and describes the mimic itself from a review (PMID:22805251) and from the largest series, 73 children (PMID:8210223). It binds MONDO:0850107 postinfectious cerebellitis, the class CAPOS_Syndrome already binds for the same mimic; MONDO has no class named acute cerebellar ataxia, and the row's note records the OLS search (re-run on 10 Nov 2026 before commit) and says the class is the nearest one, not an exact one.

    Guillain-Barre syndrome: 1 of 15 children in the UK study was first given this diagnosis (PMID:35260471). The source gives no distinguishing feature, so none is listed.

    Acute disseminated encephalomyelitis: a common provisional diagnosis in the 20-child series (PMID:41240610). The imaging contrast joins a statement about that disease (PMID:22805251) with one about the syndrome (PMID:35260471); both items are graded INDIRECT and the row's note says neither source compares the two directly.

    Neuronal ceroid lipofuscinosis: the expert panel's review names Batten disease, without a type, in the differential of the myoclonic encephalopathy the syndrome was first described as (PMID:35260471). The row binds the group class MONDO:0016295 and its note records that MONDO carries the name only as a synonym of the juvenile class MONDO:0019262 (OLS search re-run on 10 Nov 2026).

    Sources: 18 evidence items from five sources, all read by hand; no deep-research provider run. Three new reference caches (PMID:41240610, PMID:22805251, PMID:8210223). Not added: anti-NMDA receptor encephalitis, because three PubMed searches found no paper naming it as a mimic of this syndrome in children. Not cited: the UK prospective study itself (PMID:19423368), whose abstract does not carry the misdiagnosis counts.

    Validation: just validate, validate-terms and validate-disorders pass; 128 of 128 snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass.

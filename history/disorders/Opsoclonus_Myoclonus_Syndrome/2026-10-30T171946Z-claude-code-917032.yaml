  summary: 'Create: Opsoclonus-Myoclonus Syndrome (MONDO:0015247)'
  details: |
    New entry for the syndrome as a disease in its own right. It was previously curated only from two other directions: as a paraneoplastic phenotype of Neuroblastoma, and from the paraneoplastic side in Paraneoplastic_Neurological_Syndromes. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    Four pathophysiology nodes and six phenotypes, all connected. The chain runs from a neuroblastic tumour or other immune trigger, through intrathecal B-cell expansion with oligoclonal IgG synthesis, to cerebellar and brainstem saccadic instability, and then to the clinical signs. Both of the first two edges are typed as indirect with unknown intermediates, and the knowledge gap below says why.

    The entry is built around one honest asymmetry: the immune basis is far better established than its target. Routine cerebrospinal fluid studies are normal and commercial antibody panels negative, while oligoclonal bands and expanded B-cell frequency are present in 58 and 93 per cent of untreated patients, correlate with blinded neurological severity scores, are the same whether or not a tumour is found, and persist for years. No reproducible antigen has been identified. That is recorded as a KNOWLEDGE_GAP discussion attached to the B-cell node, with the full negative paraneoplastic panel quoted, the T-cell-mediated alternative the consensus review raises, and the one established exception, Ri antibodies in adult breast-cancer-associated disease.

    The most important practical point in the entry is that resecting the tumour does not treat the neurological disease: resection was insufficient in 58 per cent of those with a tumour, and neither resection nor chemotherapy altered the immunological abnormalities. The one randomised trial in the disease is recorded with its numbers and its limits: adding intravenous immunoglobulin to prednisone and risk-adapted chemotherapy raised response from 11 of 27 to 21 of 26, on 53 patients, against a treated backbone rather than against nothing.

    Rituximab's evidence is graded INDIRECT and the review's own enumeration of its weakness is quoted: an open-label study of twelve, a historical-cohort IQ comparison, and a treatment-duration observation.

    Two scope decisions are recorded in the notes. The adult paraneoplastic form is not modelled as a subtype, because the cited sources are paediatric and the one adult-specific finding sits in the knowledge gap instead. And a pointer subtype in Paraneoplastic_Neurological_Syndromes is deliberately left for a follow-up, because that file is shared with another curation lane and this entry does not need it to stand.

    A snippet had to be re-cut because the cached source wraps a word across a hyphenated line break, which the exact-quote comparison cannot match. The quotation now stops before the break and a second, cleaner source carries the part of the definition that decides the diagnosis at the bedside. The reason is recorded in that item's explanation so a later curator does not try to extend it.

    Eleven references. All snippets verified. Reference titles generated from each reference's own cache file rather than written.

    Validation: all 18 C4 gates pass, plus check-snippet-grading, check-reference-titles-present, check-cache-order, check-shared-disease-terms and check-coarse-phenotypes.

  summary: 'Edit: Opsoclonus-Myoclonus Syndrome, evidence on all 14 causal edges,
    gap status, two new sources'
  details: |
    Evidence pass on the opsoclonus-myoclonus entry, whose 14 pathophysiology downstream edges carried no evidence.

    Edges. Every edge now cites at least one exact quote (27 items): the tumour trigger to the Neuroblastoma feature (PMID:42889077 screening yield, PMID:38689540 criteria); the tumour trigger and the parainfectious trigger to the intrathecal B-cell node (PMID:35260471 adaptive-response argument, PMID:42889077 resection-insufficient statement, PMID:15136676 tumour versus no-tumour and resection results, ORPHA:1183 definition); the B-cell node to the cerebellar and brainstem node (PMID:15136676 conclusion, PMID:35260471 humoral-process argument and neuronal surface IgG); and the ten phenotype edges (PMID:35402641, PMID:26856612, PMID:28959231, PMID:34006622, PMID:42889077, PMID:35260471, PMID:38689540, PMID:29376112, ORPHA:1183). Mechanistic quotes stated as belief or inference are graded directness INDIRECT, and introduction or discussion restatements are graded BACKGROUND. Link types are unchanged. Six edge descriptions now say what the new evidence adds: tumour independence of the response, the severity correlation and neuronal IgG, behaviour on the severity scale, atrophy after severe presentations, relapses and remission against cognitive outcome, and the onset order for speech.

    Knowledge gap oms_antigen_unknown: status OPEN, with a 2026 statement (PMID:42889077, BACKGROUND) that no disease-specific autoantibody has been consistently identified.

    PMID:42889077 (Sun et al. 2026, 73 children, Peking University First Hospital) is also cited on the tumour node (all 30 tumours INRGSS L1 or L2), the parainfectious node (prodromal infection 51 per cent without and 37 per cent with a tumour, not significant; no consistent agent), the B-cell node (CSF white cells at most 8 per cubic millimetre; oligoclonal bands in 1 of 21 tested, recorded as REFUTE because it contradicts oligoclonal bands as a general finding), the Cerebellar Atrophy phenotype (onset MRI normal in all 73), both diagnosis rows (the oligoclonal band yield; two tumours missed on the first CT; opsoclonus as first sign, 20 against 2 per cent), and the long-term sequelae phase (42 per cent poor adaptive behaviour after remission; myoclonus at onset a risk factor; neuroblastoma and chemotherapy protective, with the authors' caveat, and set against PMID:35260471's statement that neuroblastoma does not associate with neurological outcome). The paper's results text calls 13 of its tumours ganglioneuromas, but its Table 2 lists them as ganglioneuroblastomas (8 nodular, 5 intermixed) with 2 ganglioneuromas and 15 neuroblastomas; the entry follows the table and does not quote that sentence. The top-level description, the B-cell node and the CSF diagnosis row now say that oligoclonal band yield varies widely between cohorts.

    ORPHA:1183: the definition is cited on the parainfectious and sleep edges, and seven phenotype rows set frequency (opsoclonus, myoclonus, ataxia and sleep VERY_FREQUENT; irritability, neuroblastoma and cognitive impairment FREQUENT), graded evidence_source OTHER and quote_role REVIEW_SYNTHESIS. The cache was built from the 2026-06-23 Orphadata release because the files on disk differ from the manifest pin; 63 committed ORPHA caches already carry that stamp. conforms_to is left to a later module-conformance pass.

    Snippets were cut programmatically from the committed caches, never retyped. Validation commands mid-session stripped trailing whitespace from PMID_17480225 and PMID_24342231, and both were restored to the committed versions. Validation: just validate passes; 110 of 110 snippets verify; the C4 gate set passes (see the PR).

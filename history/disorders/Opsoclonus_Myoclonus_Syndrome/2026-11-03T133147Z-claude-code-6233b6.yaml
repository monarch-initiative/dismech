  summary: 'Review round 2: rebind the speech phenotype and cite its frequencies'
  details: |
    Takes the one non-blocking suggestion both round-2 reviewers raised, because two parts of it were content defects rather than polish.

    The speech phenotype's description stated that trouble with speech was recorded in over half of the untreated cross-sectional cohort, and no evidence item cited that figure. It also carried PMID:35378965's "late cognitive and neuropsychological sequelae" sentence, which names cognitive and neuropsychological sequelae and not speech. So the node had an uncited frequency and a snippet that did not support the claim it sat under.

    Both are fixed from the same source the reviewers pointed at, but from its prose rather than its table. PMID:28959231 states the figures in sentences: "Lack of vocabulary characterized 89% of toddlers and 33% of youngsters" and "One-hundred percent of toddlers and 73% of youngsters could not form sentences, which also was assessed as delayed". Both are now PRIMARY_RESULT evidence on the node, and each explanation names which onset-age strata the two percentages are, since a reader cannot recover that from the sentence alone. The PMID:35378965 sentence moved to Cognitive Impairment.

    The binding changed with it, which is the reviewers' other point. HP:0000750 Delayed speech and language development asserts a developmental delay, and the sources describe a child who was already speaking losing vocabulary and sentences. HP:0002371 Loss of speech and HP:6001483 Loss of acquired spoken language go too far the other way: the cross-sectional study's own clause says the inability to form sentences "also was assessed as delayed", so the source reads it as both. The node is now bound to HP:0002463 Language impairment, which is tense-neutral and true of both readings, with the specific concept in preferred_term. Renamed to Speech and Language Impairment, and the pathophysiology downstream edge that targets it was renamed in the same edit - a bare pathograph target dangles silently on a rename.

    The acute loss of already-acquired language stays on the separate Developmental Regression node, and the new description says so, because the reviewers noted the two nodes overlap.

    60 of 60 snippets verified, 60 of 60 reference titles checked, every title generated from its own references_cache frontmatter. just validate-terms passes; HP:0002463 was already in cache/hp/terms.csv and the phenotypeterm enum cache, so no cache row changed. Phenotype connectivity stays at 11 of 11.

  summary: Map MONDO:0000723 as closeMatch
  details: |
    Checked against Mondo release 2026-11-03 (mondo.obo), reading labels, synonyms, cross-references and gene links. The earlier note said MONDO had no relevant term and that no numbered stuttering locus had a gene link; MONDO:0000723 is the parent of those loci and MONDO:0008483 links AP4E1. The term is recorded as closeMatch, not bound as disease_term, because MONDO classifies it as hereditary and familial persistent while this entry covers the common childhood-onset disorder including recovery. Reviewed with the requester, who chose not to assert identity.

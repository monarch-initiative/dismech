  summary: 'Create: Developmental Stuttering'
  details: |
    New entry for developmental stuttering (childhood-onset fluency disorder). No disease_term is bound - see below.

    Deep research: claude_code provider, 29/30 references resolved, confabulation_rate 0.033, needs_review true. The single unresolved identifier is a markdown-link parsing artefact ('DOI:10.1002/mdc3.13758](https://movementdisorders...'), not a fabricated DOI. Nothing from the report is cited; the reference set was assembled independently by direct PubMed search.

    GeneReviews baseline: checked and absent ('stuttering GeneReviews[All Fields]' returns zero results).

    The entry curates a genuinely surprising finding: the first genes associated with stuttering (GNPTAB, GNPTG, NAGPA) encode the mannose-6-phosphate system that targets hydrolases to the lysosome. Mutations in 25 of 786 case chromosomes vs 4 of 744 control chromosomes. NAGPA had no prior human disease association at all, so stuttering is the first phenotype attributed to loss of the uncovering enzyme.

    Curated a NEGATIVE node - 'Sparing of the Systemic Mucolipidosis Phenotype' - because the absence is the finding. The three clinically examined carriers had no dysmorphism, no skeletal/joint/eye/cardiac abnormality, no dysostosis multiplex, no developmental delay and normal urinary oligosaccharides. This is what licenses the entry NOT to conform to lysosomal_substrate_accumulation: that module models substrate accumulation causing storage-cell cytotoxicity, and no accumulation is demonstrated here. Conforming on the strength of gene names would assert a mechanism the evidence contradicts.

    The edge from the molecular node to the speech-motor circuit node is INDIRECT_UNKNOWN_INTERMEDIATES, and a KNOWLEDGE_GAP states why: nothing in the evidence connects partial lysosomal targeting deficiency to speech-motor control. The Gnptab knock-in mouse sharpens the puzzle rather than solving it - altered vocalisation timing with an extensive battery of non-vocal behaviours intact.

    No disease_term is bound and this is deliberate. MONDO has no term for common developmental stuttering, only four numbered OMIM locus entries (STUT1-4), none carrying a causal-gene relationship. Binding one would assert the entry IS that locus, which it is not. 23 existing KB entries also lack disease_term. Because those four form a numbered series this is a documented NEC risk class; the automated preflight would return SKIP since MONDO records no causal gene, so the manual check was done instead - reference set built by direct PubMed search on the disorder and its genes, every cited paper read.

    HP:0000735 'Impaired social interactions' was tried for the psychosocial burden and rejected: the validator reports it obsolete, and the live alternatives would mischaracterize it (a person who stutters is not socially abnormal, they are prevented from participating). Rather than bind a term wrong in a different way, the psychosocial consequences moved onto the Dysfluent Speech Output node with their own evidence item.

    One snippet failed initially because the bracketed span '[EC 2.7.8.15]' is stripped before matching; trimmed the quote to end before the bracket rather than altering the source text.

    Validation: just validate passed with 18/18 snippets verified, just validate-terms passed, and check-duplicate-keys, folded-hyphen, snippet-length, environmental-evidence, title-snippet and cache-order gates all clean.

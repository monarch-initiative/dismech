  summary: 'Self-correction: the same false-negative ontology search caught on a sibling
    PR'
  details: |
    Not triggered by a review on this PR - no review had arrived. Applied proactively after the reviewer on PR #9190 (trichotillomania) showed that my ontology searches had produced a false negative there, and I checked whether the same error existed here. It did.

    This entry asserted in notes that HPO has no term for the participation burden, after HP:0000735 'Impaired social interactions' turned out to be obsolete and the live alternatives (Abnormal social behavior, Reduced social responsiveness) mischaracterized it. The reasoning about those particular terms was correct; the conclusion drawn from it was not.

    HP:0033665 Diminished health-related quality of life exists, defined as 'A reduction in an individual's subjective assessment of his or her sense of well-being and ability to perform social roles' - which is what the cited source states almost word for word ('a holistic effect on the quality of life of a person who stutters by limiting participation in social situations'). It was missed because every search used was label-only: l~social, l~social withdrawal, l~avoidance. A synonym-aware 't~quality of life' returns it immediately.

    Restored the phenotype with the correct binding and its original evidence item, and removed the now-duplicated prose from the Dysfluent Speech Output node description.

    The general rule, now written into the notes of both this entry and Trichotillomania: l~ matches labels only, so a negative l~ result is not evidence that a term does not exist. Use t~ before concluding absence. Two entries in this batch made that mistake independently.

    Validation: 22/22 snippets verified (up from 21), terms clean, and the duplicate-key, folded-hyphen, snippet-length, environmental-evidence, title-snippet and cache-order gates all clean.

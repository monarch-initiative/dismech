  summary: 'Review round 1: the astrocyte answer, verified where the reviewer could
    not'
  details: |
    Review round on PR #9192. Items 1 and 2 were resolved by ai4c-agent's commit fe76a6d6f, which I fast-forwarded to and verified against references_cache/PMID_32047456.md rather than adopting on trust: the dopamine-excess theory rests on three patients against six controls, levodopa (raising striatal dopamine) EXACERBATES stuttering, and the same review derives Parkinson-associated stuttering from decreased dopamine. Omitting the modifier was the right call and I confirmed why.

    That commit also moved CL:1001474 off the Speech Motor Sequencing Deficit node. That was a real error of mine: the node states the evidence does not discriminate among three loci and then annotated a striatal cell type, which picks one.

    Item 3 was under-consumption of the deep-research artifact. The reviewer flagged four references it could NOT verify - network was unavailable in its sandbox - and asked that each be checked with just fetch-reference before curating. Three verified as real and were curated; all three are substantive.

    PMID:31405983 is the important one. Conditional knockout across a panel of cell-type-specific Cre drivers found that ONLY astrocyte-specific Gnptab deficiency reproduces the vocalisation deficit, with astrocyte loss concentrated in the corpus callosum and Purkinje cells, oligodendrocytes, microglia and dopaminergic neurons spared. This partially answers the entry's own housekeeping_gene_speech_specificity KNOWLEDGE_GAP and it performs the experiment that gap proposed as open. Added an Astrocyte Pathology in the Corpus Callosum node, rewrote the gap to state what is now answered and what is not, and replaced the obsolete proposed experiment with one that starts from the astrocyte result. The gap's earlier claim that regional Gnptg expression was 'the only positive lead' was false and is corrected.

    PMID:40721530 supplies the common-variant architecture the entry lacked despite being category Complex: 99,776 cases and 1,023,243 controls, 57 loci, with genetic similarity to autism, depression and impaired musical rhythm. PMID:26544806 adds AP4E1 as a fourth gene, which widens the theme from lysosomal enzyme targeting to intracellular trafficking generally.

    Took both suggestions I had independently identified earlier: GO:0050795 regulation of behavior was near-contentless for a speech node and is now GO:0071625 vocalization behavior, which also matches the mouse ultrasonic-vocalisation readout; and biological_scale on the cortico-BG circuit node moved from CELLULAR to TISSUE.

    Caught by my own connectivity check before committing: adding the astrocyte node left the graph at two components, because the negative node Sparing of the Systemic Mucolipidosis Phenotype had never carried any edge. Wired it from the molecular node, which is also a truer claim - the sparing is caused by the heterozygous-missense character of the deficit, not merely coincident with it. Now 6 nodes, 6 edges, one component.

    Validation: 32/32 snippets verified (up from 21 at PR open), terms clean, all six offline gates clean, no dangling attaches_to.

  summary: Waive the MET substrate rule on the WT1 node
  details: |
    The WT1 Zinc Finger Dysfunction node annotates GO:0060231 mesenchymal to epithelial transition with CL:0000077 mesothelial cell as its only cell type, which the met-without-mesenchymal-substrate logical rule reports because a mesothelial cell is an asserted subclass of CL:0000066 epithelial cell and so is the product of the transition rather than the mesenchyme that undergoes it. The annotation is correct as a claim about what WT1 controls: the description says the zinc-finger variants disrupt WT1-dependent transcriptional control of embryonic mesenchymal-epithelial state transitions, and PMID:21959952, already cited on the node, states that WT1 controls transitions between the mesenchymal and epithelial state of cells in a tissue-context dependent manner. The regulation term that would carry that exactly does not exist. Searching GO for 'regulation of mesenchymal to epithelial transition' returns only GO:0003339, GO:0003340 and GO:0072108, every one scoped to metanephros morphogenesis; the coelomic mesothelium this node describes is not metanephric, so binding one would assert the wrong anatomy. Rebinding was therefore unavailable and removal would have dropped a sourced mechanism claim, so the pairing is recorded as deliberate in review_notes instead. This is the first use of the waiver sentinel added in #14660, and with it the whole-KB check reports zero findings.

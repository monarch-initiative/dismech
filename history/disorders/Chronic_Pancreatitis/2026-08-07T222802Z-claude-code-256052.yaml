  summary: Separate alcohol as cause from smoking as accelerant
  details: |
    Backfill for issue #8085. Both exposures target the recurrent acinar cell injury node and are deliberately given different effect values. Alcohol is TRIGGERS with DIRECT, since the node names alcohol among its causes and alcohol acts on the acinar cell itself; it is graded supports PARTIAL because the only sentence available describes a cohort assembled from patients who already had alcoholic pancreatitis, presupposing the aetiology rather than demonstrating it. Smoking is EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES, because every figure cited measures acceleration of an established alcoholic pancreatitis rather than initiation: diagnosis 4.7 years earlier in smokers, and the study's own conclusion that smoking was associated with earlier diagnosis and with the appearance of calcifications and diabetes independent of alcohol consumption. That independence sentence was quoted from the cached abstract rather than reusing the pre-existing methods sentence. Hypertriglyceridemia and Hypercalcemia were left unlinked because they carry no evidence items at all; there is nothing to cite, and a link would assert a mechanism on no source. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 37 of 37 verified.

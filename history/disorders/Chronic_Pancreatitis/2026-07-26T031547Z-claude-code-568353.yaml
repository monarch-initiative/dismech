  summary: 'Claim-evidence review: replace pancreatic-cancer citations, bind GO terms'
  details: |
    Claim-evidence correctness review. The Recurrent Acinar Cell Injury node cited PMID:23622130, a pancreatic ductal adenocarcinoma stellate-cell review, with supports NO_EVIDENCE and a snippet about PDAC prognosis, while its explanation claimed it supported the injury cascade. Replaced with two chronic-pancreatitis-specific citations reused from the pancreatitis_acinar_autodigestion module this node conforms to. The Pancreatic Fibrosis node cited the same PDAC paper with a snippet explicitly about cancer development; replaced with newly fetched PMID:15753610 (Apte and Wilson, Mechanisms of pancreatic fibrosis), which addresses chronic-pancreatitis fibrogenesis and the stellate-cell role directly. Bound two previously unbound biological_processes to GO:0030198 and GO:0022600. Removed numbers from three explanations that did not appear in their snippets, and qualified the PRSS1 entry, where a risk-association snippet was described as confirming a causative role.

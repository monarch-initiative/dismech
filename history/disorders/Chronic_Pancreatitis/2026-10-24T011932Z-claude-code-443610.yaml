  summary: 'Genetics pass: wire all four genes, repair the severed pathograph, add
    the tropical pancreatitis subtype row'
  details: |
    Genetics pass for issue 12278 (series-071), the four parents deferred from PR 13315.

    Measured with dismech.qc_plugins.gene_mechanism_wiring_coverage,
    causal_inlink_coverage and gene_activity_grounding_coverage, before and after:
    genes wired 0/4 to 4/4; gene-activity grounding 0/0 to 4/4; phenotype causal
    inlink 3/5 to 4/5; pathophysiology nodes with no outgoing downstream edge 2 to
    0; subtype rows 0 to 1.

    Two upstream pathophysiology nodes added, splitting the four genes by the
    mechanism each acts at rather than listing them on one node: Premature
    Intrapancreatic Trypsinogen Activation (PRSS1, CTRC, SPINK1; GO:0004252
    increased and GO:0004867 decreased, which is the activation-versus-inhibition
    imbalance the conformance module describes) and Impaired Ductal Chloride and
    Bicarbonate Secretion (CFTR; GO:0005254 and GO:0015106, both decreased, on
    CL:0002079). Four repair edges close the chain the entry's own description
    already asserted and no gate reported: injury to fibrosis, fibrosis to each of
    the two insufficiency nodes, and injury to chronic abdominal pain through
    peripheral and central sensitization.

    Tropical pancreatitis curated as a has_subtypes row bound to MONDO:0011986 with
    SPINK1, placed on this entry rather than on Hereditary_Pancreatitis despite
    MONDO filing it under MONDO:0008185, because that entry is Mendelian, autosomal
    dominant and PRSS1-caused and tropical calcific pancreatitis is none of those.
    The disagreement is recorded in the row's review_notes, including that MONDO
    excludes the term from its own OMIM-subsumption QC check.

    Two evidence items deliberately refute rather than support. The cited trypsin
    review concludes trypsin is at most a mediator and not the culprit, which is
    carried on the activation node so it is not read as the initiating cause; and
    the common SPINK1 N34S allele does not impair trypsin inhibition in vitro,
    which is carried on the SPINK1 genetic record so the obvious mechanism is not
    assumed. A SPINK1 case fraction (44% N34S carriage in 66 tropical calcific
    pancreatitis patients) was added with the cohort named in the population field.

    Nausea and Vomiting is left with no incoming edge and a review_notes saying
    why: it is the only phenotype here carrying no evidence of its own, and none of
    the entry's sources places it downstream of a modelled mechanism.

    Validation on the final tree: just validate, just validate-terms and
    just count-verified-snippets clean; 61/61 snippets verified. Reference-cache
    renormalisation left by the validator was reverted and the snippet count retaken
    on the reverted tree.

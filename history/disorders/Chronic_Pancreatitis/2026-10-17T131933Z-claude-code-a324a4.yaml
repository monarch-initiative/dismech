  summary: Bind the quantitative stool pancreatic elastase code to the fecal elastase
    marker
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:25907-7 (pancreatic elastase, mass per mass in stool) as the loinc_term of the fecal elastase marker. The quantitative code was chosen over the release's ordinal presence-or-threshold counterpart because this marker is read as a concentration against severity bands. Three pancreatic elastase Parts exist in the KG, paginated in full - the plain component, a pancreatic elastase 2, and a free fraction - and none is bound, because this slot names the measurement that quantifies the marker and a Part carries neither specimen nor unit. No reference range was added: the cited source reports this assay's sensitivity by severity grade, which is test performance rather than a cut-off, and the entry states no concentration. The amylase, lipase and HbA1c markers on this entry were left alone as generic analytes carrying no threshold this disease owns.

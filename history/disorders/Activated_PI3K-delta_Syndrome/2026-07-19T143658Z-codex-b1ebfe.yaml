  details: |
    Deep source audit aligned the entry to APDS1 (PIK3CD gain of function) and APDS2 (PIK3R1 loss of function), while retaining PTEN-related APDS-like disease only as an explicitly out-of-scope nomenclature note. Added MONDO-grounded subtype terms, autosomal-dominant inheritance, subtype-aware phenotype frequencies, natural-history progression, structured thoracic CT findings, and diagnostic biomarker readout links separated from causal edges. Updated leniolisib with pivotal phase 3 evidence, the May 2025 FDA age/weight dosing and anaphylaxis warning, and active pediatric trials; balanced sirolimus and HSCT benefits with observed limitations; added multisystem, viral, pulmonary, and malignancy surveillance; and supplied evidence-backed directness metadata for every causal edge.

  summary: 'Address PR #9234 review: direction-neutral zygomatic HP term; human cleft-palate
    source'
  details: |
    PR-shepherd pass over the third-round ai4c-reviewer findings on PR #9234.

    Finding 1 (blocking): the "Malar and Zygomatic Anomaly" phenotype was bound to
    HP:0000272 "Malar flattening", which asserts the opposite direction from the
    finding it cites -- the description, the snippet and the cached source all
    report a *thickened* malar bone. Rebound to the direction-neutral HP:0010668
    "Abnormal zygomatic bone morphology", whose EXACT synonym "Abnormal malar bone
    morphology" is verbatim the entry's own preferred_term. Both the HP label cache
    and the phenotypeterm enum cache already carried the CURIE, so no cache change
    was needed. The evidence explanation no longer has to apologise for an
    imperfect term fit; supports: PARTIAL is retained on the narrower and accurate
    ground that the quote covers the thickened malar bone but not the absent
    squamosal zygomatic process also asserted in the description.

    Finding 2 (blocking): "Cleft Palate" carried no evidence at all -- the previous
    round had correctly dropped a mouse-negative snippet under Evidence SOP option
    C rather than mis-attribute it, which left the human phenotype uncited. Added
    PMID:20583178 (Zechi-Ceide et al. 2010), the pre-molecular clinical delineation
    of the MFDA tetrad, fetched with `just fetch-reference`. supports: PARTIAL with
    the caveat stated explicitly in both the explanation and the phenotype
    description: the patient was karyotypically normal and TCOF1-negative but the
    report predates the identification of EDNRA, so it establishes cleft palate as
    a feature of the clinically defined entity rather than of a molecularly
    confirmed EDNRA case. Added to the top-level references list with its title.

    Consequential fix: the HUMAN_MODEL_MISMATCH rationale stated that cleft palate
    was retained in attaches_to "for the separate reason that the human phenotype
    itself is currently uncited". That reason no longer holds, so the sentence was
    rewritten -- cleft palate now stands on its own footing as a genuine
    cross-species negative (human phenotype cited; the ENU Y129F line explicitly
    reported free of it), while noting that it rests on the single ENU report
    whereas the alopecia negative holds across both models.

    Finding 3 (no deep-research artifact) NOT addressed: out of scope for an
    automated shepherd pass, and left to the PR author. The additional
    non-blocking content available in PMID:20583178 (a second source for lower
    eyelid coloboma, plus dental and sensorineural findings) was also left
    unmined, to keep this fix scoped to the blocking items.

    Validation: `just validate` exit 0 (schema + terms + references), snippets
    38/38 verified against cached references, and check-duplicate-keys,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-environmental-evidence and check-cache-order all clean.

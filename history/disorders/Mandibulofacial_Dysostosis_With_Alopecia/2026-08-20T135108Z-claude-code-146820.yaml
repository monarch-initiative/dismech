  summary: 'Create: Mandibulofacial Dysostosis with Alopecia'
  details: |
    De-novo curation. Pathograph: EDNRA gain-of-function variant (p.Tyr129Phe, p.Glu303Lys) raising receptor affinity for the non-preferred ligand endothelin 3 -> ectopic ETAR activation in the maxillary prominence -> partial maxillary-to-mandibular homeotic transformation -> multi-element first and second arch malformation. Conforms to all three pharyngeal_arch_patterning_serial_homology nodes.

    Curation decisions worth recording:
    - Lump/split call: curated as a separate Disease rather than a has_subtypes entry on Auriculocondylar_Syndrome, even though both attach to the same module nodes. The two are opposite-direction lesions of one arch-patterning axis (MFDA is EDNRA gain of function with maxillary-to-mandibular transformation; auriculocondylar syndrome is loss of EDN1-EDNRA signalling with mandibular-to-maxillary transformation), and biallelic EDNRA loss of function gives a third entity, oro-oto-cardiac syndrome. The reasoning is recorded in the entry notes and in the genetic allelic-series note.
    - The gain of function is qualified rather than absolute: upper jaw shows aberrant signalling while lower jaw shows disrupted signalling, which is why patients have micrognathia rather than a duplicated mandible. That qualification is preserved in the transformation node and in notes.
    - Both knock-in mouse models are curated, including the Edn3-deletion rescue (an ABOLISHED readout) that establishes ligand dependence, and an explicit FAILS_TO_RECAPITULATE link for the alopecia, cleft palate and eyelid defects the Y129F mouse does not reproduce.
    - A KNOWLEDGE_GAP records that the alopecia which names the syndrome has no mechanistic account and is not a pharyngeal arch derivative.
    - Two phenotype terms are imperfect fits and say so in their explanations: HP:0000272 Malar flattening is bound for a reported malar *thickening* (nearest available concept), and the conductive character of the hearing loss is inferred from ossicular localisation rather than audiometry.

    Validation: schema, ontology-term and reference validation all run via `just validate` on each file. Every PMID was fetched with `just fetch-reference` and each evidence snippet verified as an exact substring of the cached abstract; no snippet was written from memory. Snippet count for this entry: 29/29 verified. The stub for this disease is deleted in the same change, and this PR carries only this disease's files: the entry, its history record, its five cited reference-cache files, and the five ontology-term cache rows this entry introduced (MONDO:0014608, GO:0004962, hgnc:3179 and their enum-membership rows).

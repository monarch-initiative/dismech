  details: |
    Addressed the ai4c-reviewer re-review of 307d371d.

    Finding 2 (human evidence): mined PMID:36637912 for human primary evidence on the
    three phenotypes that previously rested solely on MODEL_ORGANISM support.
    Mandibular Hypoplasia gets a PARTIAL human item, because the sentence establishes
    human mandibular dysplasia without itself naming micrognathia, which is the bound
    HP term. External Ear Anomaly and Conductive Hearing Impairment get SUPPORT human
    items; the incus quote supplies the ossicular basis and dissolves the earlier
    PARTIAL rationale on the hearing phenotype. Added two previously unused human
    phenotypes from the same cache: Generalized Hypopigmentation HP:0007513, curated
    as the one observation bearing on the follicular-melanocyte reading of
    gap_mfda_alopecia_mechanism, and Lower Eyelid Coloboma HP:0000652.

    Finding 3 (mouse eyelid claim): narrowed the blanket assertion that the mouse
    shows no eyelid defects, which this PR's own committed cache contradicts. The
    CRISPR knock-ins show open eyelids at birth and periocular skin erosion, while the
    ENU line was reported free of them, so the two reports may genuinely disagree and
    no cross-model murine negative exists. The HUMAN_MODEL_MISMATCH is now framed on
    scalp-patterned alopecia, the one non-skeletal negative that holds across both
    models, supported by the authors' own direct statement of the species difference.

    Suggestions applied: pathophysiology[0].evidence[0] evidence_source moved from
    HUMAN_CLINICAL to IN_VITRO, since the snippet reports a binding-affinity
    measurement; and the cranial neural crest cell binding moved from CL:0011012
    neural crest cell to CL:0000008 migratory cranial neural crest cell, which is more
    specific than the suggested CL:0000333 and matches the existing preferred_term.

    Finding 1, the deep-research artifact, is NOT addressed and remains open. It needs
    a deep-research provider run, which is outside this automated pass.

    Validation: just validate passes (schema, terms, references); 37/37 snippets
    verified against cached references; check-duplicate-keys, check-folded-hyphens,
    check-snippet-length and check-title-snippets clean. check-environmental-evidence
    is clean against the PR merge-base; it reports five findings in Heart_Failure,
    Lyme_Disease and Merkel_Cell_Carcinoma against current origin/main, which is
    branch staleness rather than a defect in this change, and is why the branch was
    refreshed from main in this push.

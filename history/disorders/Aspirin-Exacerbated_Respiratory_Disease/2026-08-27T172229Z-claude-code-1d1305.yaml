  summary: Address review on PR 9708
  details: |
    Addressed all six blocking items from the automated review on PR 9708. Connected the acute drug-triggered arm to the chronic arm with an INDIRECT_KNOWN_INTERMEDIATES priming edge from Bronchial LTC4 Synthase Overexpression to COX-1 Inhibition Unmasking Reaction; the pathograph is now a single connected component of nine nodes. Replaced the diagnosis snippet, which quoted a meta-statement about the review's contents rather than a finding, with the sentence stating that definitive diagnosis is only achieved through aspirin provocation. Added montelukast and zileuton as first-line leukotriene-modifier treatments, targeting different points of the same pathway. Added a biochemical section modelling urinary leukotriene E4 as the central biomarker, graded PARTIAL on the diagnostic readout because the source is explicit that it is not sufficient alone. Added an Eosinophilia phenotype. Modelled the prostaglandin D2 arm as its own node rather than leaving it asserted in the description without support. Also took several non-blocking suggestions: a platelet-adherent leukocyte transcellular synthesis node, endoscopic sinus surgery, a progression section, and evidence for the adult onset claim. Every new snippet came from PMID:30884882, already in the cache this PR added. Snippets went from 27 to 41, all verified. Re-ran just validate-disorders plus all offline gates.

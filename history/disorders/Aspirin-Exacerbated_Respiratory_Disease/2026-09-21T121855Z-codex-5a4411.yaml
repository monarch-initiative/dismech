  summary: Review AERD mediator mechanisms, variable clinical spectrum and current
    treatment evidence
  details: |
    Comprehensive review of all eight original cited references, the complete matching deep-research report and actual citation list, and current 2025–2026 guideline and primary literature. Genuine JCI and platelet full texts were recovered through sanctioned fetch-reference URLs after misleading metadata and access failures; all cached scientific bodies were read in their applicable scope. Rebuilt twenty atomic events to distinguish mediator supply, receptor abundance and signaling, cellular activation and bronchomotor/vascular effects. Removed the asserted defining LTC4-synthase lesion, universal PGE2 resistance, direct unqualified human IL33 chain, eosinophil-only polyp causation and maintenance-aspirin leukotriene suppression. Added twenty clinical findings without unsupported frequency bands, corrected blood-versus-tissue eosinophilia, retained variable and mixed presentations, and removed a fabricated prevalence midpoint. Expanded sixteen care records using specialist selection and trial-specific limitations, including the negative 2025 aspirin trial and nested 2026 dupilumab analysis. Added two induced mouse and three culture systems with perturbation, timing and translational limits, and ten live interventional trial records plus three observational research records with registry-publication discrepancies explicit. Fully read the NAVIGATOR subgroup report and GLP-1 platelet study: exploratory NSAID-sensitivity subgroup effects, mouse pretreatment, ex-vivo activation without aggregate suppression, and inconsistent recruitment counts remain qualified. Independent peers reviewed all original mechanisms/models and thirteen core care/five diagnosis records and prompted removal of an airway-to-conjunctiva anatomical mismatch. No dedicated GeneReviews chapter applies to this acquired complex disorder. Remaining abstract-only sources and unmined supplements are identified; caches were generated only using just fetch-reference.

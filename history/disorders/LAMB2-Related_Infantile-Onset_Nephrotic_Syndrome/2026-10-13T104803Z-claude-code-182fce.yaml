  summary: 'Create: LAMB2-Related_Infantile-Onset_Nephrotic_Syndrome'
  details: |
    New entry for MONDO:0013621 (claim issue #14003) covering the LAMB2 nephropathy spectrum, with Pierson syndrome (MONDO:0012184, the only MONDO descendant) and an unbound isolated/oligosymptomatic LAMB2 nephropathy subtype documented by Hasselbacher 2006, Matejas 2010, Suzuki 2023 and Sakuraya 2021. Pathograph: biallelic LAMB2 variants -> (missense) impaired laminin-521 secretion and podocyte ER stress -> loss of laminin-521 from basement membranes -> disorganized GBM -> glomerular filtration barrier breakdown (conforms_to nephrotic_podocyte_injury) -> secondary foot process effacement -> progressive glomerulosclerosis; branches to ciliary/pupillary muscle hypoplasia, ocular maldevelopment, neuromuscular junction maldevelopment and reduced quantal ACh release (conforms_to neuromuscular_transmission_failure), and neurodevelopmental impairment (mechanism unknown). 25 HP-bound phenotypes, all causally connected; 5 treatments; 5 mouse models with modeled_mechanisms. Input: Perplexity sonar-deep-research report run with reasoning_effort=low, because two medium-effort runs were cut off by a ~300 s connection drop. Report reference validation 18/18 resolved; term validation flagged 2 unresolved and 3 obsolete CURIEs and 14 mislabelled ones, so every CURIE was looked up independently via OLS/MONDO sqlite. The report misattributes the 2023 Kidney Int Rep systematic review (PMID:37705905) to 'Sato et al.'; its authors are Suzuki et al. Report claims sourced only to MedGen, Orphanet, OMIM, GTR or ClinVar web pages (e.g. MedGen ocular feature lists, ClinVar variants, Orphanet visual prognosis) were dropped as not citable from the cache. preflight-dr: PASS (LAMB2 135 mentions; MONDO OMIM 249660, 614199). check-genereviews: NO_CHAPTER (also with --online). No ClinGen CGGV record for LAMB2 exists in the cache, so gene_disease_validity is omitted. Validation: just validate passed (101 snippets verified), validate-terms passed, count-verified-snippets 101/101, check-causal-targets/entity-refs/duplicate-keys/block-scalar-comments OK, list-disconnected-phenotypes 25/25 connected, check-reference-titles, check-title-snippets, check-snippet-length and check-coarse-phenotypes report no new findings, validate-disorders passed.

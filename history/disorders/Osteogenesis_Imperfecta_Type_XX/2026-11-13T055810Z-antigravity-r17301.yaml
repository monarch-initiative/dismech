  summary: 'Addressed PR 17301 review: disconnected absent ocular phenotype from WNT signaling edge, trimmed over-specific treatment bindings, and removed deprecated updated_date'
  details: |
    Removed deprecated top-level updated_date. Removed the downstream edge from Reduced Canonical WNT/Beta-Catenin Signaling and Osteoblast Bone Formation to Absent Eye Abnormalities (Distinguishing Hypomorphic MESD from Complete LRP5 Loss) so the absent-feature phenotype is not wired as an active downstream effect of residual WNT signaling. Removed unsupported pamidronate (CHEBI:7903) therapeutic_agent and specific-agent prose from Bisphosphonate Therapy, keeping class-level NCIT:C198585. Changed WNT-Pathway Biologic Therapy (Proposed Strategy) therapeutic_modality from MONOCLONAL_ANTIBODY to OTHER and removed unsourced anti-sclerostin antibody naming to match PMID:31564437. Trimmed unsourced 25% recurrence prose and tangential stillbirth WES evidence (PMID:33596325) from Genetic Counseling.

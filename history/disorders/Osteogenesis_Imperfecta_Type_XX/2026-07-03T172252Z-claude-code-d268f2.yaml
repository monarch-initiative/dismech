  details: |
    Second-pass phenotype enrichment per issue #5079. Added two literature-supported distinguishing phenotypes: Multiple prenatal/intrauterine fractures HP:0005855 at the neonatal-lethal end of the spectrum cited to PMID:33596325; and explicitly ABSENT eye abnormalities HP:0000478 modifier ABSENT distinguishing hypomorphic MESD OI-XX from complete LRP5 loss / osteoporosis-pseudoglioma cited to PMID:31564437. Blue sclerae, dentinogenesis imperfecta, wormian bones, and joint hypermobility were deliberately NOT added because the primary MESD literature does not document them, consistent with the WNT-signaling non-collagen mechanism. Validated with validate, validate-references, and validate-terms.

  summary: 'Review round 1: address XFE review items'
  details: |
    Addressed the CRITICAL item and all five IMPORTANT items from the automated review on PR 10077, plus three of the five suggestions. The CRITICAL finding was correct and identified a real curation error: two evidence items cited PMID:21612988 with a sentence describing the review's own scope rather than any finding, which is exactly the non-propositional pattern the title-snippet gate exists to catch. Both were replaced with quotes from PMID:20301571, the Xeroderma Pigmentosum GeneReviews chapter, which lists ERCC4 among its causal genes and was already in the cache. IMPORTANT 1 was the most consequential and identified a second error of mine: the entry's notes asserted that the founding case report's clinical description of patient XP51RO was not quotable and used that premise to justify grading four human phenotypes as model-organism-only. The premise was false. PMID:26074087, a reference this same curation added and cached as full text, carries a dedicated XP51RO paragraph. The phenotypes were reworked against it and now carry human evidence, and the note was rewritten to record the error rather than deleted, because the lesson is procedural: a structural-gap claim is a claim about the cache and should be checked against the cache. IMPORTANT 2, cutaneous photosensitivity now leads with the XP51RO sentence and keeps the class-level xeroderma sentence as corroboration. IMPORTANT 3, five phenotypes documented in the index case but curated only in narrative prose were added: lipoatrophy, progeroid facial appearance, sensorineural hearing loss, visual impairment and learning disability. Note the review's suggested HP:0011451 for aged facies is Primary microcephaly, not a facial term; HP:0005328 Progeroid facial appearance was used instead. IMPORTANT 4, added a top-level references block with the GeneReviews tag on PMID:20301571. IMPORTANT 5, senolytics are now a curated treatment citing PMID:28871086, with the circularity made explicit that the Ercc1 model is both the discovery platform for the drug class and the system validating it. Suggestions taken: the ambiguous animal_models#Mouse reference now names both models explicitly; an environmental block was added with UV exposure and high dietary protein, both linked to the DNA damage node with environmental_effect EXACERBATES. Suggestions declined with reasons recorded in the entry: the OMIM mapping is not expressible because DiseaseMappings has no OMIM slot, and the three organ-specific Ercc1 models were left out deliberately because adding them would multiply the subunit mismatch this entry is built around rather than address it. Revalidated: just validate with 57 of 57 snippets verified, just validate-terms, just check-entity-refs, just check-duplicate-keys, just check-environmental-evidence, and scripts/check_reference_titles.py.

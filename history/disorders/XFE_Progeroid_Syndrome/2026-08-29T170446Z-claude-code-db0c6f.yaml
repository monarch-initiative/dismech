  summary: 'Create: XFE Progeroid Syndrome'
  details: |
    Created the XFE progeroid syndrome entry, the ERCC4/XPF segmental progeria. Curated as its own entry rather than a subtype of Xeroderma Pigmentosum, which already carries XP-F on the same gene, because the literature states the discriminator mechanistically: ERCC4 genotypes are separated by the balance they leave between nucleotide excision repair and interstrand crosslink repair, and the progeroid genotype impairs both while the xeroderma genotypes impair excision repair alone. Deep research: openscientist, research/XFE_Progeroid_Syndrome-deep-research-openscientist.md. The report supplied the great majority of the mechanistic content: the somatotroph axis interpretation, the NER versus ICL balance rule, the carrier-frequency-versus-patient-count argument for prenatal lethality, the NF-kappaB intervention result, the dietary restriction result, the two Ercc1 mouse strains, and the peripheral neuropathy timing. Its reference validation was clean at 24 of 24 resolved. Its term labelling was not: 14 of 15 labelled terms were mislabelled, though most of those are an artefact of the report placing a category word in a table column that the validator read as a label. No ontology term was taken from the report without independent checking. The entry's central editorial decision is that almost every mechanistic claim rests on mouse models that mutate ERCC1, the partner subunit, rather than ERCC4, and that the founding human allele fails by mislocalisation of a catalytically intact protein rather than by loss of nuclease activity. That is recorded as an explicit HUMAN_MODEL_MISMATCH discussion with a proposed knock-in experiment rather than smoothed over. Two evidence items knowingly cite a review for its scope because no quotable sentence naming the finding exists in the cached abstract; both are flagged in the entry notes as the first places to improve. A structural gap is also recorded: the founding case report is a Nature letter whose abstract compresses the clinical description to one sentence, so the best human evidence for several phenotypes exists but is not quotable. Validated with just validate, 39 of 39 snippets verified, plus just validate-terms and just check-entity-refs.

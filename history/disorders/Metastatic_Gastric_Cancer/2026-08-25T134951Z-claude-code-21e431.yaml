  summary: Model gastric carcinogenesis alongside metastasis and relink exposures
    (#8302)
  details: |
    Issue #8302 recorded that all three environmental exposures (H. pylori, smoking, high-salt diet) are gastric-carcinogenesis risk factors while every pathophysiology node modelled metastatic biology, leaving the single 'Gastric Carcinogenesis Substrate' node added earlier as a dangling root with no downstream edge. Added three carcinogenesis nodes so the pathograph carries both halves and is connected end to end: 'Helicobacter pylori Chronic Active Gastritis' (initiating gastritis; PMID:1458460, PMID:36483973), 'Intestinal-Type Invasive Adenocarcinoma' (terminal step of the Correa cascade; PMID:1458460, PMID:15668283) and 'CDH1 Inactivation and E-cadherin Loss' (initiating lesion of the diffuse Lauren route; PMID:9537325). Wired the two Lauren routes into the pre-existing metastatic nodes: gastritis to substrate, substrate to intestinal-type carcinoma, intestinal-type carcinoma to Peritoneal Dissemination (PMID:39023829), CDH1 inactivation to E-Cadherin Loss and Diffuse Invasion (PMID:9537325), E-cadherin loss to Peritoneal Dissemination (PMID:34650801, newly fetched) and Peritoneal Dissemination to Angiogenesis and Metastatic Outgrowth (PMID:32439934). Retargeted the H. pylori exposure to the new gastritis node (TRIGGERS/DIRECT) and gave the high-salt exposure a second link into it (EXACERBATES) alongside its existing substrate link, now citing Correa's late-stage salt sentence as well. Strengthened the smoking exposure with the cohort meta-analysis PMID:18293090 at both entry and link level. Validated with just validate, just count-verified-snippets (37/43 verified, 6 DOI-prefixed skipped), just validate-terms and the batched just validate-disorders sweep; the one remaining WARN is the pre-existing unfetchable EGA dataset accession.

  summary: 'Create: Multiple_Mitochondrial_Dysfunctions_Syndrome_1 (NFU1, MONDO:0011582)'
  details: |
    Created MMDS1 as a per-gene Disease entry (stub entry_type decision: DISEASE), matching the granularity of MMDS9B and the open MMDS4/MMDS6 PRs; the stub's suggestion of a single MMDS1/MMDS2 entry with per-gene subtypes was considered and declined so the series stays uniform, with MMDS2 and MMDS5 curated as sibling entries in the same tranche. Chain: biallelic NFU1 loss, defective 4Fe-4S delivery to NFU1-dependent targets, LIAS deficiency and loss of lipoylation, combined 2-oxoacid dehydrogenase/GCS deficiency, complex I/II deficiency, attenuated mitochondrial translation, bioenergetic failure and neurodegeneration, and a pulmonary endothelial node conforming to pulmonary_vascular_remodeling. Sources: PMID:21944046, PMID:22077971 (discovery), PMID:25918518, PMID:25477904, PMID:29441221, PMID:28470589, PMID:32747156, PMID:36256512, PMID:31970900, PMID:42192213 (clinical), PMID:28161430, PMID:28906594, PMID:32776106, PMID:32151725, PMID:37823603, PMID:28803783 (biochemistry), PMID:34440194, PMID:35883565 (reviews), PMID:34449775, PMID:36645076 (C. elegans), PMID:30759996 (BOLA3 endothelial mechanism, used for the PAH node with an explicit extrapolation note). Deep research: the Edison/falcon run for this entry had not completed when the entry was written (the provider connection was retrying); the entry was built from PubMed abstracts fetched with just fetch-reference and cross-checked against the completed sibling reports where relevant. Corrections during validation: NFU1 HGNC id corrected to hgnc:16287 (an initial wrong id failed term validation), and four snippets containing bracketed Fe-S notation were shortened because bracketed spans are stripped before matching. Validation: just validate pass, just validate-terms pass, count-verified-snippets 66/66, check-causal-targets and check-entity-refs clean. No GeneReviews chapter exists for NFU1-related MMDS.

  summary: Rebind defining vascular phenotype to HP:6000253 + add evidence
  details: |
    Added a Histopathologic phenotype node bound to HP:6000253 "Necrotizing vasculitis" as part of creating the Necrotizing Vasculitides grouping (kb/groupings/Necrotizing_Vasculitides.yaml, issue #8754). Before this change no entry anywhere in the KB used HP:6000253, so the grouping's NECESSARY membership criterion had nothing to evaluate against and just check-groupings reported every listed member as a contradiction; annotating the defining lesion on each member is what makes the grouping auditable rather than aspirational. Every snippet is an exact quote from an abstract already cached by just fetch-reference. Validation actually run over this file: just count-verified-snippets (no unverified snippets) and the batched pre-PR sweep just validate-disorders across all eight edited entries, which passed schema, ontology-term and reference validation ("Files validated: 8 ... All validations passed", "Snippets checked: 386/401 verified against cached references (15 skipped by prefix)"). Handled differently from the other seven members to avoid a near-duplicate node: this entry already had a Necrotizing small- and medium-vessel vasculitis phenotype bound to the generic HP:0002633 Vasculitis, so rather than adding a second node saying the same thing, that node was rebound to HP:6000253 (strictly more specific; HP:6000253 is_a HP:0002633, so nothing that previously matched stops matching under ontology closure) and a second evidence item added. Evidence: the existing PMID:28631066 plus PMID:17023257, which names the histopathological demonstration of necrotizing vasculitis as the diagnostic finding.

  summary: Connect the eight disconnected phenotypes to the pathograph
  details: |
    Eight of the entry's twelve phenotypes had no incoming causal edge: External ophthalmoplegia, Failure to thrive, Generalized hypotonia, Global developmental delay, Hypertrophic cardiomyopathy, Microcephaly, Seizure, Sensorineural hearing impairment. Four were wired (lactate, optic atrophy, reduced visual acuity, proximal muscle weakness), so the entry rendered a connected molecular-to-tissue chain beside eight floating nodes. Nothing in notes recorded that as a decision, so it was an omission rather than a judgement. This is the defect class flagged on PR 11412.

    Seven are routed from Combined Respiratory Chain Enzyme Deficiency, the systemic node that already fans out to the retinal, muscle and lactate consequences. External ophthalmoplegia is routed instead from Mitochondrial Myopathy of Skeletal Muscle, because the extraocular muscles are skeletal muscle and are characteristically involved in mitochondrial myopathy; the source reports it in the same sentence as the proximal weakness that node already explains.

    Every edge is causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT, and each cites the same already-verified snippet that supports its phenotype. This is deliberate and the explanations say so: the sources report these findings in NSUN3-mutant patients, they do not demonstrate the route from respiratory chain deficiency to the organ phenotype. Marking them DIRECT, as the four pre-existing edges are, would assert more than the literature carries - the pre-existing four are anatomically tight (myopathy to weakness, retinal ganglion degeneration to optic atrophy, OXPHOS failure to lactate) where these are systemic manifestations.

    The hypertrophic cardiomyopathy edge is the weakest and its explanation says so: a single case, whose own report presents the association as novel rather than settled.

    Validation: just validate-disorders passes, 76/76 snippets verified, up from 68/68 - all eight new snippets are exact substrings of already-committed caches, no new references fetched. Every phenotype now has an incoming edge. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms clean. Checked explicitly that no snippet now carries two different evidence_source values, since each reused quote also appears on its phenotype: zero divergences. No cache change.

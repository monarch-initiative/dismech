  details: |
    Answers the blocking phenotype-coverage finding and all three blue-tier suggestions in one push.

    BLOCKING - three recurrent phenotypes were documented in the cached sources and already quoted inside this file, but not curated. All three are now curated and wired into the pathograph so the entry does not regain floating nodes.

    Blue-dot cataract, HP:0000518 Cataract with the specificity in preferred_term. Four of roughly eleven published individuals across two unrelated families. HP:0007976 Cerulean cataract is the term whose definition most closely matches the colloquial name, and it is deliberately NOT used: that definition asserts congenital onset and concentric peripheral layering, neither of which the sources state, so binding it would manufacture detail. Three evidence items, including the authors' negative cataract-panel result graded INDIRECT - it shows they looked for a separate cause and found none, which is why the finding is curated here rather than treated as an unrelated comorbidity, but it does not demonstrate NSUN3 causation.

    Nystagmus, HP:0000639. Two unrelated individuals with different character (convergence in the index case, rotatory bilateral in the 2024 report), so the general term is the honest binding rather than a character-specific child.

    Generalized axonal sensorimotor neuropathy, HP:0007141 Sensorimotor neuropathy. HPO has no term combining the axonal and sensorimotor characters - a real choice between them, recorded in the phenotype notes. HP:0007141 is bound because sensorimotor is the distinction the source draws; HP:0003477 Peripheral axonal neuropathy is the defensible alternative. The deep-research report's HP:0007002 Motor axonal neuropathy is wrong on its face, since the source says sensorimotor, and is not used. Every CURIE was resolved against ols:hp before binding rather than taken from the review.

    Pathograph wiring for the three: cataract and neuropathy from Combined Respiratory Chain Enzyme Deficiency, nystagmus from the optic-nerve node it is reported alongside. All INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT, matching the style established in the previous commit. The cataract edge explanation says plainly that the lens is avascular and glycolysis-dependent, so the route from a respiratory chain defect to lens opacity is not obvious and the source proposes none; it is recorded as an unexplained association rather than a demonstrated step. The nystagmus edge says the sources do not settle whether it is sensory, secondary to early visual loss, or independent brainstem or cerebellar involvement.

    SUGGESTION 1 - target_mechanisms added to both drug treatments, which were the last disconnected section. Idebenone links to the optic-nerve node with treatment_effect BYPASSES, its defining pharmacology (short-chain quinone carrying electrons to complex III, bypassing complex I). CoQ10 links to the respiratory chain node with RESTORES, replacing a measured secondary deficiency. Both evidence items are INDIRECT and both descriptions state that the link records the indication, not an outcome: the idebenone individual had begun recovering spontaneously twelve months before treatment, which this entry already carries as a REFUTE item, and no outcome of the CoQ10 supplementation is reported.

    SUGGESTION 2 - GO:0002097 tRNA wobble base modification removed from node 4. The node's claim is about decoding; modification is already carried by nodes 2 and 3, so the binding restated the upstream claim rather than describing this node. GO has no clean wobble-decoding term, so biological_processes is omitted rather than a misleading term bound, per the terms contract.

    SUGGESTION 3 - therapeutic_modality on Supportive and Multidisciplinary Care changed BEHAVIORAL to OTHER. That treatment bundles anticonvulsants, nutritional support and multi-organ surveillance, which BEHAVIORAL is narrower than. Genetic Counseling keeps BEHAVIORAL, the majority convention.

    Validation: just validate-disorders passes, 87/87 snippets verified, up from 76/76. All 15 phenotypes have an incoming edge. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms clean. Zero snippets carrying two evidence_source values. No new references fetched and no new ontology terms outside the three verified HPO bindings.

    Process note: the round-1 review posted at 13:29 UTC and I did not see it until 17:10, because at two intervening check-ins I fetched check runs but not reviews for this PR. A comment I posted at 16:15 claimed the review had not run. That was wrong and is corrected on the PR.

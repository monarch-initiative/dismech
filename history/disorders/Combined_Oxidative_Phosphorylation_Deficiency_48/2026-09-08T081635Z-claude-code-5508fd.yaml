  summary: 'Create: combined oxidative phosphorylation deficiency 48 (COXPD48, NSUN3)'
  details: |
    De novo curation of COXPD48 (MONDO:0033566, OMIM:619012, hgnc:26208 NSUN3) as a standalone Disease entry. Preflight re-derived against origin/main at ec5a66d1e3: MONDO:0033566 bound in zero files under kb/, hgnc:26208 absent, NSUN3 appearing only as a row in an unrelated Wilson disease Biomni gene-results TSV, no open PR. OMIM 619012 confirmed independently three ways (MONDO xref, literature, DR preflight).

    The curation is built around the mechanistic point that distinguishes this entity from the rest of the combined-OXPHOS series: NSUN3 is neither a respiratory chain subunit nor an assembly factor but an mt-tRNA wobble methyltransferase, so the lesion is a translation-level modification defect upstream of all thirteen mtDNA-encoded proteins. The pathophysiology chain is eight nodes, four of them molecular (enzyme loss, loss of m5C34, absence of f5C34, impaired wobble decoding) before reaching translation, combined respiratory chain deficiency, and the retinal ganglion cell and skeletal muscle tissue nodes.

    Sources: Van Haute 2016 Nat Commun (PMID:27356879, founding case), Jurkute 2025 IOVS (PMID:40465263, eight individuals from five families, the largest cohort), Paramasivam 2020 J Mol Neurosci (PMID:32488845), a 2024 Genes optic neuropathy case (PMID:38790159), a 2026 hypertrophic cardiomyopathy case report (PMID:41725275), mechanism work from Haag 2016 EMBO J (PMID:27497299) and Nakano 2016 Nat Chem Biol (PMID:27214402), and the Nsun3 mouse knockout study (PMID:36949224).

    Deep research was run with the claude_code provider; its report resolved 11/11 references but offered UBERON:0001780 named 'Optic nerve' when UBERON calls it spinal nerve, and an obsolete CHEBI:5991 named 'Idebenone'. Neither was used; every term in this entry was verified independently with runoak against the local builds, and NCIT diagnosis terms were additionally checked for reachability from NCIT:C25218.

    Evidence discipline: 68 evidence items, all snippets extracted programmatically and confirmed as exact substrings of the cached references before validation; several were trimmed to avoid non-breaking spaces and non-breaking hyphens introduced by full-text extraction. Two REFUTE items are curated deliberately - a family with normal lactate against the raised-lactate phenotype, and the documented spontaneous visual recovery preceding idebenone against attributing that recovery to the drug. Sideroblastic anemia was deliberately not curated because the cohort authors attribute it to a separate heme-synthesis gene variant in the same patient. Where the cohort paper's figure legend and its per-individual text disagree about COX-negative fibers, the narrower per-individual text is quoted.

    Module conformance: one node conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, and only partly - the module's reactive oxygen species arm is not evidenced in any NSUN3 report and is not asserted, and the module's age-related mtDNA damage node does not apply to a primary nuclear modification defect. Conformance to complex_iv_assembly_deficiency was considered and declined because that module scopes itself to subunit, assembly, copper and heme A defects. Grouping membership: no existing grouping fits; the Mitochondrial_Complex_IV_Deficiency grouping is anchored to an isolated rather than a combined deficiency, and no mitochondrial-translation grouping exists. Recorded in notes with the reasoning rather than left open.

    Validation run to completion: just validate (68/68 snippets verified, term validation passed), validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-source-defect-claims, and validate-disorders. The curation stub was deleted.

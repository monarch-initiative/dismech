  summary: 'Completed focused review of CDH23-associated pituitary adenoma 5, evidencing
    all provisional edges and findings while preserving the unresolved mechanism and
    folding the iPSC result from PR #7116.'
  details: |
    Added exact evidence to the predicted CDH23 adhesion effect and to both
    reference findings. The adhesion-to-adenoma bridge is supported only by
    PARTIAL evidence from the predicted proximal defect and the clinical
    association, preserving the explicit mechanistic knowledge gap. Folded the
    nonredundant single-patient iPSC lineage-commitment result from overlapping
    endocrine review PR #7116 and graded it PARTIAL because it lacks an
    isogenic control and does not establish tumorigenesis. The sole phenotype
    remains connected and the D2P audit has no completeness gaps.

  details: |
    Manual correctness review of claim-evidence matching.

    No claim-evidence mismatches found. The entry's provisional framing (RISK_FACTOR
    gene typing, PROVISIONAL/HYPOTHETICAL mechanism_confidence, COMPUTATIONAL grading
    of the predicted adhesion effect, and an open KNOWLEDGE_GAP instead of forcing the
    gene into the AIP/GPR101/GNAS cAMP module) is well matched to what PMID:28413019
    actually reports. All snippets are exact.

    Added, against the open gap: PMID:36359740 reports that iPSCs from a Cushing
    disease patient carrying a germline CDH23 mutation showed dysregulated cell lineage
    commitment. This is the first cellular phenotype tying germline CDH23 to a
    pituitary-relevant lineage defect and speaks directly to the gap's question about
    the affected lineage, but it is a single-donor in vitro observation without an
    isogenic control reported inside a broader organoid methods study, so it is graded
    PARTIAL and the gap stays OPEN with its rationale updated to say what it does and
    does not settle.

    Remaining completeness gaps (not correctness defects, not addressed here): the
    entry carries no inheritance, prevalence, diagnosis, or treatments blocks.


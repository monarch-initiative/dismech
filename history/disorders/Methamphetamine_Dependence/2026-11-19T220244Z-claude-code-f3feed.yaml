  summary: Narrow three overstated explanations and add post-mortem transporter evidence
  details: |
    Answered the round-4 re-review on PR 18480. It approved the branch, and all three of its non-blocking suggestions were correct criticisms of prose I had written in the round before, so all three are fixed. The shape of the error is worth recording because it recurred: each was an explanation or note that claimed more than the sentence it was built on.

    The sharpest one is the fourth prevalence evidence item. Its explanation said the quoted sentence established that the excluded injecting group "is not a small remainder". The quote states that from 2017 to 2019 the prevalence of use disorder or injection exceeded that of use with neither, which compares groups of people who use methamphetamine and counts disorder and injection together. It bounds the combined group and says nothing about the size of the injecting part, so the explanation did not follow from it. It now says what the quote shows, that most people who use methamphetamine have use disorder or inject, and says explicitly that the quote does not size the excluded group. The same overstatement had been copied into the record's notes and is corrected there too, where it now says that how far the figures understate the disorder is not recoverable from this source.

    This is the same defect class as the round-1 blocking finding on this entry, in a milder form: an exact, verified quote carrying a claim it does not support. Snippet verification cannot see it, because the quote is real; only reading the sentence against the claim can.

    The other two corrections. The recorded percentages are the source's adjusted prevalences rather than crude population rates, which the notes now state, because a model-adjusted rate and a crude one are different quantities. And the 195,711 respondents are pooled across the 2015-2019 waves, so that item's explanation no longer calls the count the denominator of the 2019 figures, which the source does not give separately; it is the scope of the survey the record draws on.

    The round also closed the suggestion carried since round 2, for post-mortem striatal transporter data in the degeneration controversy. PMID:8640565, a 1996 Nature Medicine study of post-mortem striatum in chronic methamphetamine users, answers it and answers it on the downregulation side: the transporter was reduced alongside dopamine and tyrosine hydroxylase, while DOPA decarboxylase and the vesicular monoamine transporter, the two markers that fall in Parkinson disease, were normal. That is a selective deficit rather than the loss of terminals carrying all five, it bears directly on the Parkinson disease concern the controversy's rationale raises, and it reaches the same conclusion as the 2015 imaging study by a wholly different method nineteen years earlier.

    Three evidence items carry it. The post-mortem measurement itself is SUPPORT, since the reduced transporter is what this node is scoped to. The marker dissociation is a second SUPPORT, because two further markers of the same terminals, both of which fall in Parkinson disease, were normal: a loss of terminals would take all five markers down together, so the dissociation is what distinguishes downregulation from degeneration. The authors' conclusion, that chronic exposure does not cause permanent degeneration at the doses used by the young subjects in the study, is REFUTE, because the claim it bears on is the degeneration hypothesis the entry carries as the ALTERNATIVE rather than the node's own downregulation claim. Their dose and age caveat sits inside the quoted sentence rather than being paraphrased around it, and it is the live limitation on the finding.

    It was two items until I read each new explanation back against its own snippet, which is the check this round exists to institute, and the first one failed it. That item quoted the dissociation sentence while its explanation asserted the reduced transporter, the post-mortem striatum and the chronic users, none of which that sentence says: all three are in the preceding sentence. The remedy was to quote both sentences as separate items with an explanation confined to each, not to splice them, which the evidence rules forbid. Catching my own instance of the defect I was writing the record about is the argument for the check rather than against it.

    Both items are graded HUMAN_CLINICAL, and the explanation says why rather than leaving it to be inferred: the subjects are a human autopsy series of chronic users against controls, not a cultured or explanted preparation. IN_VITRO would be defensible for homogenate neurochemistry and is the reading I rejected; a reviewer who disagrees can see the reasoning rather than having to reconstruct it.

    The controversy rationale is updated, because its closing sentence had become false. It said the entry carried the downregulation reading "on the strength of one study of sixteen participants", and there are now two independent human studies by different methods. It says so, and keeps a sharper version of the original caveat: neither study measured high-dose or long-duration exposure, which is the condition under which the review's neurodegeneration claim would apply.

    PMID:8640565, like PMID:34550301 in the round before, was one of the 58 reference caches deleted two rounds ago, when only the unsuccessful deep-research report cited it. That report was correctly deleted and the entry never drew on it, but it had surfaced two papers that turned out to be worth citing, which is what a deep-research report is for even when its own output is unusable. Both are re-fetched through just fetch-reference and read from the cache directly.

    One correction to the record of the previous round, rather than to the entry: that round's history record, PR body and PR comment all said 34 of 34 snippets verified. The true figure at that head was 35. I counted before adding the fourth prevalence evidence item and did not recount after. The reviewer's own count was right and mine was stale; the PR body is corrected in this round.

    38 of 38 snippets verified. just validate and just validate-terms clean. All 36 gates in the workflow's whole-repo step pass, plus just validate-disorders and just check-snippet-grading.

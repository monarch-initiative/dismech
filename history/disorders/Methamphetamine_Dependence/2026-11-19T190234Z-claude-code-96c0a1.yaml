  summary: 'Create: Methamphetamine Dependence'
  details: |
    Curated kb/disorders/Methamphetamine_Dependence.yaml from stubs/Methamphetamine_Dependence.yaml (MONDO:0005419), which the stub had already decided as entry_type DISEASE with HIGH priority. Nine pathophysiology nodes, five conforming to the addiction_cycle module. The upstream pharmacology is modelled as two nodes rather than one because methamphetamine's mechanism is not cocaine's: vesicular monoamine store depletion through disruption of VMAT2, then reverse transport of cytosolic dopamine out through the plasma-membrane carrier. The entry binds GO:0014046 dopamine secretion INCREASED where the cocaine entry binds GO:0051583 dopamine uptake DECREASED, which is the mechanistic contrast made machine-readable. Resolved the lump/split question the stub raised by keeping the methamphetamine term and deliberately not mapping amphetamine abuse (MONDO:0003969) at all, which differs from the cocaine entry's skos:closeMatch to cocaine abuse: there the two terms are one drug at two severities, here they are two drugs with different potency, brain entry and clinical populations. The reason is recorded in the entry notes. The striatal transporter-deficit node is scoped to the PET measurement and marked PROVISIONAL rather than modelled as terminal degeneration, because the one cited human study found dopamine release normal despite a 20 to 30 per cent transporter deficit, found the transporter-release correlation inverted against controls, and found partial recovery over nine months; the degeneration reading is carried as an ALTERNATIVE hypothesis with a CONTROVERSY discussion rather than as the node's claim. The naltrexone-bupropion row records the absolute response rate (13.6 per cent against 2.5 per cent) rather than the significance alone, and its target_mechanisms link says the trial established an effect on abstinence and not which node the drugs act on. 16 of 16 evidence snippets verified against 9 cached references, 4 newly fetched and 4 reused from the addiction_cycle module plus one shared with the cocaine entry. All seven candidate snippets were verified against the cached bodies with the real normalizer before being written, after two from-memory lapses earlier in the session.

  summary: 'Review round 1: Methamphetamine Dependence'
  details: |
    Answered review round 1 on PR 18480. The blocking finding was a real curation failure on my part: the withdrawal node and its three phenotypes were written from the AIMS, DESIGN and MEASUREMENTS sections of PMID:16128721 without reading its FINDINGS, so the node carried the study's aim as its only snippet and bound Insomnia (HP:0100785) when the paper reports increased sleeping. The snippet passed exact-quote validation because it is a real sentence from the paper; exact-quote checking cannot catch a quote that is real but supports nothing, which is the hazard CLAUDE.md records at #15607. Corrected: the node now quotes the FINDINGS sentence naming increased sleeping and eating and the depression cluster, plus the CONCLUSIONS sentence giving the two-phase structure (acute 7-10 days, subacute at least two further weeks), and its description no longer says severity merely falls over three weeks. Insomnia is replaced by HP:0001262 Excessive daytime somnolence with preferred_term increased sleeping and a note recording that HPO has no plain hypersomnia class, and HP:0002591 Polyphagia is added for the increased eating. Fatigue is dropped because the cited abstract does not report it and no other source was cited for it. Every phenotype row now carries its own evidence item, which none did before. Added methamphetamine psychosis, which the reviewer rightly identified as the clinically most distinguishing feature of this disorder and which the first version omitted entirely: Psychosis (HP:0000709), Hallucinations (HP:0000738) and Paranoia (HP:0011999), sourced to PMID:23303471, a prospective within-person fixed-effects study of 278 people with DSM-IV methamphetamine dependence that excluded lifetime schizophrenia and mania and found a five-fold, dose-dependent rise in psychotic symptoms during periods of use. All three are wired from the dopamine node as INDIRECT_UNKNOWN_INTERMEDIATES, because the study measured days of use rather than dopamine. Phenotype connectivity is 7 of 7. Also took the suggestion that Sustained Methamphetamine Exposure claimed to drive the transporter node without an edge to it, and strengthened the degeneration ALTERNATIVE with a REFUTE item on the transporter node citing PMID:20849327 for apoptosis and terminal degeneration after long-term use, marked INDIRECT and REVIEW_SYNTHESIS because that review's own subject is acute poisoning. A claude_code deep-research run was launched as the review asked and had not returned when this round was prepared. 27 of 27 snippets verified; all eight candidates were checked with the real normalizer before being written.

  summary: Add NSDUH past-year prevalence and the transporter node's concluding evidence
  details: |
    Took the two carried suggestions from the round-3 re-review on PR 18480, which approved the branch without them. Both were non-blocking, and in the ordinary case a push on an approved PR is not worth a review round; the reason to do it here is that these three PRs cannot auto-merge before about 22 November under the deterministic controller's three-day age gate, so a round costs nothing in merge latency, and the entry had no prevalence record at all.

    Prevalence. The record was a placeholder saying no population estimate had been located, which was true when written and is not: PMID:34550301, a JAMA Psychiatry analysis of the 2015-2019 National Survey on Drug Use and Health, reports past-year methamphetamine use disorder directly. The record now carries measure_type PERIOD_PREVALENCE, prevalence_class ABOVE_1_IN_1000, and rate_low 640 / rate_high 820 with rate_denominator POPULATION, scoped in population to US adults aged 18-64 by race and ethnicity in 2019.

    The range is deliberately one quoted sentence's span rather than a derived figure. The source reports no overall percentage. Its headline 2019 figure is a count, 815,000 adults with use disorder without injection, and the weighted NSDUH denominator behind that count is not stated as a quotable number, so converting it to a rate would mean originating one; rate_per_100000 is therefore left absent rather than filled with a midpoint or a computed value. The recorded 640 to 820 is the 2019 span across the three race and ethnicity strata the source gives, 0.64 per cent in Black individuals to 0.82 per cent in Hispanic individuals, converted at the documented per-cent-times-1000 rate. The sex and sexual-orientation strata fall inside that span, so the choice of axis does not move it. Four evidence items carry the record, one per claim it makes: the stratified prevalences the range comes from; the surveyed sample and its age bounds, which is the denominator; the source's statement of what it measured and over which years, which is what makes this a period prevalence rather than a point one; and the sentence establishing that the excluded injecting group is not a small remainder, which is why the range understates the disorder. All four snippets were verified with SupportingTextValidator.normalize_text before being written.

    Two of those four were deliberately shaped rather than taken as found. The denominator quote is the whole clause, not the opening prepositional phrase, so that it asserts the count instead of merely introducing it; the phrase alone cleared the five-word floor, which is a word count and not a test of whether a quote says anything. The measure-definition quote comes from the study's objective and therefore carries no quote_role, which is what CLAUDE.md prescribes for an aim statement: an aim is neither the publication's own finding nor somebody else's fact. It is cited for how the source defines its measure, not for a result. That distinction is worth stating because quoting an aims sentence is what went wrong on this entry in round 1, where a node's finding was built from one; using an aim to establish what was measured is a different thing, and the absent quote_role is what keeps the two apart in the record.

    Two candidate snippets were discarded at that step rather than after a failure. Both quoted the count with its confidence interval, and both contain a square-bracket span whose contents are not all upper case; the normalizer strips such a span from the candidate while turning it into spaces on the source side, so neither could ever verify. That asymmetry is the one found on the nicotine entry in this session and filed as dismech#18471. The remedy was to pick bracket-free sentences, not to shorten a quote until it passed: a truncated quote still verifies and still clears the five-word floor while supporting nothing.

    Dopamine transporter node. Added the authors' own concluding clause from PMID:26208874, that the loss of transporters in these participants does not reflect degeneration of dopamine terminals. This is the sentence the node's provisional, measurement-scoped framing rests on, and until now the node argued that framing from the release and recovery results without quoting the conclusion drawn from them. Quoted as the closing clause rather than the whole sentence, because the earlier part of the same sentence carries a typographical error in the published abstract and a snippet never corrects its source.

    PMID:34550301 was one of the 58 reference caches deleted in the previous round, because at that point only the deleted deep-research report cited it. It is re-fetched through just fetch-reference and committed with the entry, and added to the references block.

    Not done, and why. The re-review also suggested re-running deep research once a provider can reach PubMed. That condition is not met: the claude_code provider's sandbox denies Bash and blocks PubMed E-utilities, which is what made the previous run unsuccessful, and OpenScientist failed twice earlier in this session at its report-generation step. A fourth attempt would reproduce the same failure and the gate would reject the artifact again.

    34 of 34 snippets verified, up from 30. just validate and just validate-terms clean. All 36 gates in the workflow's whole-repo step pass, plus just validate-disorders and just check-snippet-grading.

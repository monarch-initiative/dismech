  summary: Remove the unsuccessful deep-research run and its uncited reference caches
  details: |
    Removed the deep-research artifact this branch had committed, because the run did not produce a usable report. The `claude_code` run launched during review round 1 returned with `answer_status: unsuccessful` in its own frontmatter: its sandbox denied Bash and blocked PubMed E-utilities (5 permission denials, `denied_tools: [Bash]`), so it worked from a handful of Europe PMC abstracts and web pages and closed with "Incomplete report: ... several sections could not be sourced." `scripts/check_unsuccessful_research.py` is a CI gate on exactly that marker, and it failed the `test (3.13)` job on head d8fbae7cf8. The gate's instruction is to delete the run with its sidecar and re-run or use another provider, so the report and its `.citations.md` are deleted; there was no `_artifacts/` directory.

    Deleted with them are the 58 reference-cache files that entered this branch only as that report's resolved citations and that nothing in `kb/` cites. The cited set was re-derived from the final tree immediately before pruning, as CLAUDE.md requires, and the 8 cache files the entry does cite (PMID:15955613, PMID:16128721, PMID:20849327, PMID:23303471, PMID:26208874, PMID:29407687, PMID:30586362, PMID:33497547) are kept; `just count-verified-snippets` re-run on the pruned tree still reports 30 of 30 verified, which is what establishes that no cited cache was removed.

    No KB content changed in this round. The entry never drew on the report: every claim in it was curated from `references_cache/` records read directly, which is why deleting the report costs the entry nothing. The round-1 history record's closing sentence, that a run "was launched as the review asked and had not returned when this round was prepared", remains an accurate description of that round and is left as written; this record is where the run's outcome belongs.

    The miss was in my own pre-push sweep, not in the content. I was running 25 gates against a CI step that runs 36, and the research gate was one of the 11 I was not running. The sweep is now generated from the workflow's own gate list, so the two cannot diverge silently again; all 36, plus `just validate-disorders` and `just check-snippet-grading` (which CI skips on a kb/-only PR), pass on this tree.

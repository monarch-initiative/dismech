  summary: >-
    Re-curate DYRK1A-related intellectual disability syndrome: add classifications,
    prevalence, progression, inheritance, diagnosis, differential diagnoses,
    ADHD/depression phenotypes, and enrich treatments and animal models
  details: |
    Substantive re-pass of DYRK1A-related intellectual disability syndrome (MRD7;
    MONDO:0013578) grounded in cached primary literature and the Falcon deep-research
    report:
    - Added classifications (Harrison's chapters: Neurologic disorders and
      Genetics, environment, and disease).
    - Added prevalence records covering worldwide published / 100,000 Genomes
      Project cohort estimates (PMID:33562844) and autism spectrum disorder cohort
      estimates of 0.1-0.5% (PMID:29034068, PMID:33562844).
    - Added progression entries covering prenatal/neonatal onset (IUGR, congenital
      microcephaly, neonatal feeding difficulties), infantile febrile seizure onset
      evolving to generalized/myoclonic/atonic epilepsy, and childhood-to-adulthood
      neurodevelopmental, behavioral, and musculoskeletal course.
    - Added top-level autosomal dominant inheritance (HP:0000006) with complete
      penetrance and variable expressivity (PMID:26677511).
    - Added Attention deficit hyperactivity disorder (HP:0007018, 69%) and
      Depression (HP:0000716, 23% in adolescents/adults) from the caregiver-reported
      natural history cohort (PMID:38622540) and wired both into the downstream
      targets of Impaired Neocortical Circuit Development and E/I Imbalance (24/24
      phenotypes connected).
    - Added relationship_type: CAUSATIVE to the DYRK1A genetic entry.
    - Added diagnosis section (Molecular Genetic Testing of DYRK1A, Trio Whole
      Exome and Whole Genome Sequencing, Chromosomal Microarray and Cytogenetic
      Analysis, and Brain Magnetic Resonance Imaging and Electroencephalography).
    - Added differential_diagnoses section (Angelman syndrome, ADNP-related
      neurodevelopmental disorder, CHD8-related neurodevelopmental disorder with
      overgrowth, Idiopathic autism spectrum disorder, and Down syndrome).
    - Enriched all 5 treatments with action_category, therapeutic_modality, and
      target_mechanisms, and repaired the truncated snippet on Genetic Counseling.
    - Enriched animal_models with name, publication, associated_phenotypes, and
      modeled_mechanisms, and added the conditional cortical/hippocampal Emx1-Cre
      Dyrk1a deletion model from PMID:37797581.

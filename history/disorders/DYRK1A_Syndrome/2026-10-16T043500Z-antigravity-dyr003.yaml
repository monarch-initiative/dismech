  summary: 'Re-curate DYRK1A-related intellectual disability syndrome: add classifications, prevalence,
    progression, inheritance, diagnosis, differential diagnoses, ADHD/depression and spinal/renal phenotypes,
    genetic case_fractions, and enrich treatments and animal models'
  details: "Substantive re-pass of DYRK1A-related intellectual disability syndrome (MRD7;\nMONDO:0013578)\
    \ grounded in cached primary literature and the Falcon deep-research\nreport:\n- Added classifications\
    \ (Harrison's chapters: Neurologic disorders and\n  Genetics, environment, and disease).\n- Added\
    \ worldwide published / 100,000 Genomes Project cumulative case count\n  prevalence record (145 patients\
    \ across 144 families; PMID:33562844) and\n  recorded the 0.1-0.5% autism spectrum disorder cohort\
    \ estimate on\n  genetic[0].case_fractions (PMID:29034068, PMID:33562844).\n- Added progression entries\
    \ covering prenatal/neonatal onset (IUGR, congenital\n  microcephaly, neonatal feeding difficulties;\
    \ 92-individual growth chart cohort\n  in PMID:37740550 and PMID:25944381), infantile febrile seizure\
    \ onset evolving\n  to generalized/myoclonic/atonic epilepsy, and childhood-to-adulthood\n  distal\
    \ musculoskeletal/foot features and prominent attentional/depressive\n  behavioral profile.\n- Added\
    \ top-level autosomal dominant inheritance (HP:0000006) with variable\n  expressivity and ~1% theoretical\
    \ sibling recurrence risk from potential\n  parental germline mosaicism (PMID:26677511).\n- Refined\
    \ DYRK1A Haploinsufficiency molecular_functions to specific dual-specificity\n  catalytic activities\
    \ (GO:0004674 protein serine/threonine kinase activity and\n  GO:0004713 protein tyrosine kinase activity).\n\
    - Added Attention deficit hyperactivity disorder (HP:0007018) and Depression\n  (HP:0000716) from\
    \ the caregiver-reported natural history cohort (PMID:38622540),\n  plus Pectus excavatum (HP:0000767),\
    \ Kyphosis (HP:0002808), Scoliosis\n  (HP:0002650), Renal agenesis (HP:0000104), and Renal cyst (HP:0000107)\
    \ from\n  PMID:33562844, wiring all 29/29 phenotypes into the pathograph.\n- Added relationship_type:\
    \ CAUSATIVE and ASD cohort case_fractions (0.1-0.5%)\n  to the DYRK1A genetic entry.\n- Added diagnosis\
    \ section (Molecular Genetic Testing of DYRK1A, Trio Whole\n  Exome and Whole Genome Sequencing, Chromosomal\
    \ Microarray and Cytogenetic\n  Analysis, and Brain Magnetic Resonance Imaging and Electroencephalography).\n\
    - Added differential_diagnoses section (Angelman syndrome, ADNP-related\n  neurodevelopmental disorder,\
    \ CHD8-related neurodevelopmental disorder with\n  overgrowth [MONDO:0014017], and Idiopathic autism\
    \ spectrum disorder).\n- Enriched all 5 treatments with action_category, added therapeutic_modality\
    \ on\n  3 therapeutic entries and target_mechanisms on Antiepileptic Pharmacotherapy\n  and Educational\
    \ and Developmental Therapy, refined the preferred_term on\n  Educational and Developmental Therapy,\
    \ and repaired the truncated snippet on\n  Genetic Counseling.\n- Enriched animal_models with name,\
    \ publication, associated_phenotypes, and\n  modeled_mechanisms (including a Disrupted Cortical Neurogenesis\
    \ and Cell-Cycle\n  Control link on the Dyrk1a-I48K knock-in model), and added the hippocampal\n \
    \ mossy fiber-parvalbumin interneuron conditional CA3/CA2 Dyrk1a deletion and\n  Dyrk1a+/- model from\
    \ PMID:37797581.\n"

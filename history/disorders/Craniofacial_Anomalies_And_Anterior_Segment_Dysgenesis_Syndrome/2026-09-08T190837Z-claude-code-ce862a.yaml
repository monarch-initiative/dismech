  summary: 'Create: Craniofacial Anomalies and Anterior Segment Dysgenesis Syndrome
    (VSX1)'
  details: |
    De novo curation of CAASDS (MONDO:0013618, OMIM 614195, VSX1) from claim issue #11472.

    An identifier correction worth recording: an initial draft of this entry, and the first
    deep-research query run for it, used OMIM 610256. That is anterior segment dysgenesis 2,
    a different entity whose name overlaps with this one. MONDO:0013618 xrefs OMIM 614195,
    which preflight-dr flagged, and the entry and the research query were both corrected.

    Scope decision: DISEASE, standalone, and the call was close enough to record rather than
    assert. MONDO:0013618 has hereditary disease as its only superclass and no descendants,
    so there is no grouping or parent entry to fold it into. The alternative was
    OUT_OF_SCOPE, on the grounds that a never-replicated single-family syndrome whose gene is
    disputed does not carry a conserved pathograph. That was rejected because one part of the
    phenotype - the retinal bipolar cell electrophysiology - does have independent
    mechanistic support, and because recording the contest is more useful than leaving a
    named MONDO concept with no entry and no note of why. The stub is deleted, since
    MONDO:0013618 is now bound as disease_term.

    Evidence base. One publication describes the entity: PMID:15051220, a 2004 report of a
    single three-generation African American family with four affected members. A PubMed
    search on 2026-09-08 for the syndrome name, and for VSX1 combined with craniofacial,
    anterior segment, sella and CVC-domain terms, returned no second family and no follow-up
    in twenty-two years. Five further references are cited for mechanism and for
    counter-evidence: PMID:11978762 (the original VSX1 disease report, which independently
    documents abnormal inner-retinal electroretinography in VSX1 variant carriers),
    PMID:15647262 (VSX1 as a transcriptional repressor; a keratoconus homeodomain change
    impairs repression), PMID:21917795 (Vsx1 controls terminal gene expression in mouse type
    7 ON bipolar cells), PMID:30535423 (a mouse model of a VSX1 CVC-domain change with an
    abnormal ERG and no corneal defect), and PMID:16799019 (a negative keratoconus cohort
    that catalogues R131S as a previously reported SNP). 31 of 31 snippets verify; no
    DOI-prefixed references are cited, so nothing is skipped by prefix.

    The gene is typed DISPUTED rather than CAUSATIVE. Four cumulative reasons: the genotype is
    two coding changes in cis, one of which the reporting authors themselves call a variation
    and which is independently catalogued as a polymorphism in a keratoconus cohort; neither
    change has ever been functionally assayed; the VSX1 missense changes that have been
    assayed either enhance repressor activity or leave it unchanged, which is the opposite of
    the direction a loss-of-function account needs; and a mouse carrying a VSX1 CVC-domain
    change reproduces the retinal electrophysiology but has no corneal defect at all. There is
    no ClinGen gene-disease validity assertion for VSX1, checked directly against the ClinGen
    gene-validity download of 2026-09-08 - GTPBP3, curated in the same session, does appear in
    that file, so the absence is a real negative rather than a missing download.

    Consistency with the rest of the knowledge base was checked rather than assumed.
    Keratoconus already types VSX1 DISPUTED and Posterior_Polymorphous_Corneal_Dystrophy
    records the historical VSX1-PPCD1 assignment as unconfirmed or of uncertain significance.
    Those are separate diseases with separate evidence, and neither settles this one, but
    typing the gene CAUSATIVE here while it is DISPUTED two files away would have needed a
    justification this evidence cannot supply.

    Pathograph. Five nodes, three marked PROVISIONAL. The two that are not are the genotype
    and the bipolar cell dysfunction - the two with support outside the family. The repression
    node carries an explicit warning that its modifier records the direction the causal chain
    would need rather than one observed for this allele, and a REFUTE evidence item sits on
    that node quoting the functional survey that found VSX1 missense changes enhancing rather
    than reducing repression. Every phenotype has an incoming edge; there are no unwired
    phenotypes and no dangling targets.

    Term-selection note. HP:0002690 is "Large sella turcica", not empty sella; the correct
    term for this phenotype is HP:6000483 "Empty sella turcica", confirmed through OLS.
    UBERON:0001772 is "corneal epithelium", not endothelium; the corneal endothelium is
    UBERON:0001985. Both wrong candidates were caught before binding.

    What is deliberately not curated. No treatments block - the source reports no intervention
    for anyone in the family, including the child with severe hydrocephalus, and importing
    generic management of the individual findings would assert of four people an experience
    recorded only of others; the reasoning is in the discussion
    caasds_no_treatment_or_natural_history. No progression block, because the study is a
    genotype-phenotype description with no follow-up. No animal model record: the mouse cited
    here carries a different VSX1 change and was built to test corneal disease, so it appears
    as evidence within nodes rather than as a model of this entity. The posterior fossa cyst
    and anterior encephalocele in the proband are described in prose rather than bound,
    because each was seen once and neither is separable from the severe hydrocephalus in the
    same child.

    Every frequency band is a count out of four people in one pedigree and says so in its own
    notes. The three OBLIGATE bands record that no affected member lacked the finding, not
    that none ever will.

    Validation run: just validate (schema, terms, references), count-verified-snippets
    (31/31), check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-stubs, plus the whole-KB snippet ratchets
    and validate-disorders.

  summary: Prepare Staphylococcus aureus pneumonia for infectious curation PR
  details: |
    Added MRSA/MSSA and necrotizing-pneumonia synonyms, evidence on the defining Staphylococcus aureus infectious agent, a human respiratory host life-cycle block, and the Deliberately lumped review note that keeps MSSA, MRSA, post-influenza community-acquired, and HAP/VAP staphylococcal pneumonia under the shared MONDO:0041879 organism-specific pneumonia scope.

    Expanded the entry after PR review by quoting the claim issue as a string, removing the disease-itself Pneumonia phenotype, adding PVL-positive necrotizing pneumonia phenotypes from human clinical series, splitting agr quorum-sensing activation from PSM-alpha neutrophil necroptosis, adding a PVL pathophysiology branch, modeling antecedent influenza as a co-infection modifier, and curating progression, ventilator-associated prevalence, diagnostic, antimicrobial, suvratoxumab, and SAATELLITE phase 2 trial records from cached sources.

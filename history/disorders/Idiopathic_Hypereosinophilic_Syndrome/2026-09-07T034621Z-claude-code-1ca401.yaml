  summary: Fix dupilumab trial snippet to the eligibility statement
  details: |
    Takes the one remaining non-blocking suggestion from the approving review on
    PR 11286.

    The NCT06477653 (dupilumab add-on) clinical_trials record quoted "HES can
    damage the lungs and airways, intestines, skin, and other organs." That is
    the registry record's plain-language background sentence about HES in
    general. The record's description says the trial is a pilot in patients
    responding only partially to eosinophil-depleting biologics, and the quoted
    sentence supports none of that; the explanation compounded it by calling the
    quote "the trial's own statement of the organ damage it targets", when what
    the trial targets is partial responders.

    Replaced with the trial's eligibility statement, which carries the claim
    directly: "People aged 18 years and older who take drugs (mepolizumab,
    reslizumab, or benralizumab) to treat HES." Reworded the explanation to
    describe the eligibility population rather than organ damage. The two
    neighbouring trial records already quote a design sentence, so this brings
    the third into line.

    Taken despite being non-blocking and despite the PR already carrying an
    approval that this push dismisses. It is the same claim-evidence mismatch
    class as the blocking finding of the previous round, in a knowledge base
    whose value rests on evidence integrity, and the deterministic auto-merge
    sweep requires a PR to be more than three days old regardless - so a further
    review cycle costs nothing against the merge timeline.

    Validation. just validate-disorders over both changed files: schema clean,
    terms clean, 121/121 snippets verified. check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-snippet-grading and check-title-snippets all clean with no new
    baseline rows.

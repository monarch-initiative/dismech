  summary: 'Review round: fix claim-evidence mismatches and content gaps'
  details: |
    Self-review round on the entry created earlier in the same session, run as a
    red-team pass with the dismech-pr-review skill before any PR. Every finding
    below was independently verified against the cached sources before acting;
    none was taken on the reviewer's word.

    Blocking fixes.

    1. The entry equated "FIP1L1-PDGFRA-negative HES" with "idiopathic HES" in
    three places. It is not: PDGFRA-negative is the union of idiopathic,
    lymphocytic-variant, and non-PDGFRA myeloid disease, which the entry's own
    differential says. The mepolizumab phase III and benralizumab phase II both
    enrolled that superset. Reworded the three claims, and set
    directness: INDIRECT on the trial-derived items now being read down onto the
    idiopathic subset.

    2. The Urticaria phenotype's only citation did not support it: the word
    "urticaria" does not appear anywhere in the cached PMID:30567176 (verified
    by grep), and the quote used was a recommendation sentence, not an
    observation. Rebound to PMID:40283978, which names urticaria among cutaneous
    manifestations, with the HES-wide caveat. Dropped the unsupported "frequent
    presenting feature" claim.

    3. Two cardiac causal edges cited a sentence from the Introduction of
    PMID:37829205, a primary mouse study, graded HUMAN_CLINICAL. evidence_source
    classifies the publication, not the sentence's rhetorical content, and the
    same file grades that paper MODEL_ORGANISM four times elsewhere. Replaced
    both with human sources already in the entry (PMID:39007045 for the
    necrotic-to-thrombotic step, PMID:39056762 for the thrombus-to-fibrosis
    step).

    4. The extracardiac branch ran backwards: granule-protein injury pointed at
    a node named "Eosinophilic Infiltration of Skin, Lung, and Gut", but
    infiltration precedes injury. Renamed to "Eosinophil-Mediated Skin, Lung,
    and Gut Injury" so the edge is correct, and said in the description that
    infiltration lives upstream at the recruitment node.

    5. The entry had no eosinophil-intrinsic prothrombotic mechanism, reducing
    HES thrombosis to surface thrombogenicity, which cannot account for the
    diffuse microangiopathy and post-normalisation events the entry itself
    claims. The parent entry already had this and the child came out less
    mechanistic than its parent on the axis it calls prognosis-determining.
    Added "Eosinophil-Driven Prothrombotic State" (ECP binding heparin and
    modulating thrombomodulin) citing PMID:32184691, already cached, and a paper
    specifically about idiopathic hypereosinophilia with venous thromboembolism.

    6. Pruritus and Pulmonary infiltrates rested on the first sentence of the
    benralizumab trial's Introduction - the definition of what HES is, used as
    a finding. Replaced with the organ-involvement rates from PMID:40283978.

    Ontology and structure.

    7. thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation was
    declared on Systemic Thromboembolism, but the module node explicitly scopes
    itself to formation and excludes later occlusion states. Moved it to
    Endocardial Injury and Mural Thrombus Formation, which is the node that
    forms the thrombus, and gave Systemic Thromboembolism
    thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury.

    8. The Myocardial fibrosis note claimed HPO has no endomyocardial fibrosis
    term. HP:0006685 Endocardial fibrosis exists; it is now curated as its own
    phenotype and the note says why both bindings are kept. Also added
    HP:0001635 Congestive heart failure, which the entry already quoted but
    never curated.

    9. The IL-5 node bundled a molecular claim (receptor signalling) with
    cellular ones (survival, recruitment) under a single biological_scale.
    Renamed to "IL-5 Receptor Signalling" and scoped to the signalling event.

    Content completeness.

    10. Four disease-specific references had been fetched and committed but
    never cited. The French guidelines (PMID:37122022) are now used for the
    serological arm of the exclusion work-up and for the pre-corticosteroid
    antiparasitic step.

    11. Added a biochemical: section - tryptase and vitamin B12 as
    myeloid-variant discriminators whose absence the diagnosis depends on, and
    troponin T as the one marker tracking this disease's own cardiac injury.
    That in turn made a knowledge-gap rationale overstated ("surveillance
    imaging as the only practical answer"); reworded to the accurate claim, that
    the available markers report damage already done.

    12. Added a prevalence: section. Recorded with measure_type UNKNOWN and a
    note saying the 175-fold spread between the SEER bounds is itself the
    finding, and that the figures span all HES variants rather than idiopathic
    disease alone. Also the absence of a sex predominance, which is
    idiopathic-specific.

    13. Added empirical antiparasitic therapy before corticosteroids - a
    patient-safety step the entry had omitted entirely, since corticosteroids in
    unrecognised strongyloidiasis can precipitate hyperinfection. Cited with the
    guideline's own statement that the practice is disputed, so the entry does
    not overstate it.

    Consistency and honesty fixes.

    14. Split the bundled "Hydroxyurea and Interferon Alfa" treatment. Interferon
    alfa is a recombinant protein, so SMALL_MOLECULE was wrong for it and it had
    no therapeutic_agent binding at all, making half the treatment invisible to
    any modality query. Now two records; interferon alfa bound to CHEBI:753470
    (NCIT:C20494 Interferon Alpha resolves but is not in the ChemicalEntityTerm
    enum).

    15. Two diagnosis records stated classification conventions rather than
    procedures but bound NCIT:C18020 Diagnostic Procedure, asserting something
    false. Removed the binding from both and said why in notes. The six-month
    rule had been cited to Chusid, whose cached abstract never states a
    duration; recited to PMID:40283978, which states both the historical
    six-month criterion and the 2-to-4-week window replacing it, plus the full
    contemporary criteria including the >=10% of leukocytes threshold.

    16. evidence_source was inconsistent across review-derived items: the SIAAIC
    statement was graded both HUMAN_CLINICAL and OTHER on different general
    assertions, while two other reviews in the same file were correctly OTHER.
    Regraded on a stated principle - OTHER when the quoted sentence is review or
    consensus authors summarising literature, HUMAN_CLINICAL only where the
    source reports its own patients. 21 items changed. PMID:40283978 keeps
    HUMAN_CLINICAL for its n=11 cohort sentences and takes OTHER for its review
    prose.

    17. The asthma frequency (72.7%) came from a cohort assembled from patients
    started on anti-IL-5 biologics, which that centre gives to HES patients with
    concomitant severe asthma. The selection bias is now named in the
    description. The arrhythmia description had attributed the finding to
    eosinophilic myocardial involvement, which the source does not say - it
    reports no permanent organ damage attributable to tissue eosinophilia - so
    the attribution was removed.

    18. Added the registry records (clinicaltrials:NCT02836496,
    clinicaltrials:NCT02130882) as evidence on the two clinical trials, which
    had been evidenced only by design sentences from the papers. Fetched the
    NCT02130882 cache. Added a mixed-aetiology caveat to PMID:2882081, whose
    cohort is eosinophilic endomyocardial disease from several causes. Noted
    that imatinib carries no target_mechanisms deliberately, since the claim is
    that it does not act on this disease's mechanisms. Added variant_origin:
    SOMATIC to the PDGFRA record and changed relationship_type from DISPUTED to
    BIOMARKER, which is what an exclusion test is.

    Recorded, not done. The recruitment -> degranulation -> cytotoxicity ->
    injury cascade is shared across HES variants, EGPA, and organ-restricted
    eosinophilic disease, and no eosinophil effector module exists in
    kb/modules/, so this entry and its parent both re-derive it. A follow-up
    note in the entry's notes: records that a module is the structurally right
    answer and why it was not done inline.

    Validation after the round. just validate-disorders over both changed files:
    schema clean, terms clean, 114/114 snippets verified. All per-file gates
    clean (entity-refs, causal-targets, duplicate-keys, enum-values,
    qualifier-terms) and verify-datasets OK. Whole-KB gates clean with no new
    baseline rows (folded-hyphens, snippet-length, title-snippets,
    snippet-grading, environmental-evidence). Compliance rose from 89.8% to
    90.1% while the entry grew by roughly a third.

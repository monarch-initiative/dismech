  summary: 'Create: Idiopathic Hypereosinophilic Syndrome'
  details: |
    New entry for idiopathic hypereosinophilic syndrome (MONDO:0011895),
    promoted out of the bare has_subtypes stub it had been carrying in
    kb/disorders/Hypereosinophilic_Syndrome.yaml (MONDO:0015691).

    Why a separate entry. The promotion test used elsewhere in this repository
    asks for a distinct diagnostic pathway or first-line therapy. Idiopathic HES
    has both: it is constituted by an exclusion work-up rather than by a
    positive finding, and its first-line therapy is corticosteroids and
    anti-IL-5 biologics rather than the imatinib that defines management of the
    FIP1L1-PDGFRA-positive myeloid sibling (88% vs 23% response, PMID:19910029).
    The parent entry keeps the cross-variant content and its subtype
    description now points here.

    MONDO term caveat, recorded in the entry's notes and worth a reviewer's
    attention. MONDO:0011895 derives from OMIM:607685, which builds its concept
    around the FIP1L1-PDGFRA fusion. MONDO therefore asserts
    "has material basis in germline mutation in PDGFRA" (RO:0004003 to
    hgnc:8803) on the term and places it under idiopathic cardiomyopathy
    (MONDO:0005110) and familial restrictive cardiomyopathy (MONDO:0016340).
    Those axioms describe the myeloid variant, which the modern ICOG-EO
    definition of idiopathic HES excludes (PMID:22460074). It is still the only
    MONDO term whose label names this concept, so it is bound and the
    discrepancy is recorded rather than papered over. This is also what makes
    `just preflight-dr` WARN on the report (PDGFRA=8, JAK2=5): the report
    discusses the myeloid genes because ruling them out is the definition, not
    because it drifted to another disease.

    Deep research. One provider, falcon (Edison Scientific), run 2026-09-06,
    717s: research/Idiopathic_Hypereosinophilic_Syndrome-deep-research-falcon.md.
    Its own reference validation reports 15/15 references resolved, 0 unresolved,
    0 off topic, confabulation_rate 0.0. `needs_review: true` in the frontmatter
    is driven only by term validation flagging MONDO:0011895 as "mislabelled",
    which is the template placeholder string "if available" being compared to the
    ontology label, not a real binding error. The report cites by author-year key
    with DOIs rather than PMIDs (it says so explicitly), so its sources were
    recovered through the PMC ID Converter and cited by PMID in preference:
    PMID:39056762, PMID:37122022, PMID:38611061, PMID:39389714, PMID:34052871,
    PMID:40283978. One DOI (10.1002/ajh.26966, the 2023 ICC paper) has no PubMed
    record reachable by DOI search and was not cited.

    GeneReviews. Searched PubMed for a GeneReviews chapter; none exists. Expected
    for a non-Mendelian exclusion diagnosis, so no baseline was applied.

    Content. A nine-node causal chain rather than a bucket list: unexplained
    eosinophil lineage expansion, IL-5-dependent survival and recruitment,
    chemokine-driven tissue recruitment, persistent hypereosinophilia,
    degranulation, granule-protein cytotoxicity, then branching into the cardiac
    arm (endocardial injury and mural thrombus, then endomyocardial fibrosis and
    restrictive physiology, and systemic thromboembolism) and the
    skin/lung/gut arm. Three nodes carry conforms_to against fibrotic_response
    and thrombogenesis. Three causal edges carry their own evidence separate
    from the nodes they connect.

    The first node is a deliberate negative: idiopathic HES is defined by what
    cannot be found, so that node is cited to the sources saying the aetiology
    is unproven rather than to a mechanism, and a KNOWLEDGE_GAP discussion is
    attached to it. A second KNOWLEDGE_GAP covers the dissociation between blood
    eosinophil count and cardiac progression (PMID:39007045, PMID:19364940),
    which is why surveillance continues after the count normalises.

    Imatinib is curated as a `supports: REFUTE` treatment item rather than
    omitted, because "does not work here" is the therapeutic fact that separates
    this entry from the myeloid variant. PDGFRA appears in `genetic:` as a
    definitional exclusion with relationship_type DISPUTED, not as a disease
    gene.

    Phenotype frequencies come from PMID:40283978, a cohort assembled
    specifically as idiopathic HES (n=11), rather than from mixed-HES series;
    the entry says in its descriptions that these are small-cohort observations,
    not population estimates.

    Animal model. The IL-5 transgenic mouse (PMID:37829205) is linked to two
    pathophysiology nodes with readouts. It is PARTIALLY_RECAPITULATES against
    the injury node, with the limitation stated plainly: its eosinophilia has a
    defined genetic cause, which is exactly what idiopathic HES is defined by
    not having, so it models the effector arm and not the unexplained driver.

    Dataset triage. geo:GSE185300 (IL-5Tg mouse left ventricle) was accepted and
    verified with `just verify-datasets`; its GEO_*.md cache file is committed.
    Two higher-scoring DIRECT candidates were rejected as Named Entity
    Confusion: geo:GSE12079 profiles CD3-CD4+ T cells from the lymphocytic
    variant this entry excludes by definition, and geo:GSE131738 is Sezary
    syndrome. All nine GENE_ONLY candidates matched on PDGFRA and reach this
    disease only through the erroneous MONDO axiom above.

    Validation. `just validate-disorders` over both changed files: schema clean,
    term validation clean, 100/100 snippets verified against the committed
    cache. Per-file gates clean: check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms. Whole-KB
    gates clean with no new baseline entries: check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-term-cache-integrity, check-cache-order.
    Compliance 89.8% (the parent HES entry is 85.8%). All evidence uses PMIDs;
    no DOI-keyed evidence items, so nothing bypasses the gating validator.

    Four references_cache files unrelated to this change (PMID_31367340,
    PMID_39156600, clinicaltrials_NCT02836496, clinicaltrials_NCT04191304) were
    upgraded from abstract to full text as a side effect of the research
    validator's pass and were reverted rather than staged; they belong to other
    entries.

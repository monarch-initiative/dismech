  summary: 'Review round 1: bound the normal band''s prose to its own reference interval'
  details: |
    Answers the actionable suggestion from the approving review on PR 12015 (review 5238573131), which found no blocking issues.

    The lowest interpretation band on the Absolute eosinophil count record carries no lower_bound, so under the half-open [lower, upper) convention it covers every result below 500 cells/uL - including results beneath the 50 cells/uL floor that the same reference_ranges block asserts. Its interpretation opened 'Within the laboratory reference interval', which is false for a result of, say, 20 cells/uL.

    The opening clause is now 'At or below the reference interval's upper limit', true across the whole band, and the text states that sub-50 results fall here too and are deliberately not graded LOW. abnormal_flag stays NORMAL: no cited source addresses eosinopenia, so a LOW band would be unsourced, and in treated disease a near-zero count is the therapeutic goal rather than an abnormality. Splitting the band at 50 was considered and rejected, because it would drop a treated patient at 20 cells/uL into an ungraded gap and lose the hematologic-remission reading the band also carries.

    The identical wording fix is applied to the parent Hypereosinophilic_Syndrome entry, which carries the same record per the repo's non-DRY convention.

    This entry carries no quote of PMID:19910029's structured BACKGROUND sentence, so the quote_role tagging in the parent entry has no counterpart here.

    Validation: just validate-disorders over both files passes with 131/131 snippets verified against committed caches, plus the offline gate battery.

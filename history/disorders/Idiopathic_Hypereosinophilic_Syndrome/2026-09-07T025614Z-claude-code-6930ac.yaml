  summary: Address ai4c-reviewer REQUEST_CHANGES on PR 11286
  details: |
    Round two on PR 11286, addressing the ai4c-reviewer REQUEST_CHANGES verdict.
    Each finding was verified against the cached sources before acting.

    Blocking finding, confirmed and fixed. The animal_models link targeting
    "Eosinophil-Mediated Skin, Lung, and Gut Injury" cited a snippet about heart
    tissue and claimed relationship: RECAPITULATES. Both halves were wrong. The
    quote was an exact substring, so the reference validator passed it, but it
    did not support the node it was attached to - the heart is covered by the
    neighbouring link on the same model, so the quote was doing double duty in
    the wrong place. Checking PMID:37829205's cached full text confirmed the
    reviewer's second point too: the paper measures pulmonary infiltration in
    detail and has no skin and no gastrointestinal data at all. Its only mention
    of those organs is a background sentence citing other literature. Replaced
    the snippet with the paper's own lung measurement, downgraded to
    PARTIALLY_RECAPITULATES, added a limitations line saying the cutaneous and
    gut arms of the node are unmodelled by this system, and added a pulmonary
    infiltration readout.

    This defect was introduced by the previous round's own fix. The node used to
    be named "Eosinophilic Infiltration of Skin, Lung, and Gut" and was renamed
    to the injury it actually represents; the heart snippet was already a
    stretch under the old name and became plainly wrong under the new one.
    Renaming a node means re-reading everything that points at it, not only the
    bare-name pathograph targets that check-causal-targets covers.

    Suggestions taken.

    prevalence_class: RARE sat beside a populated rate_per_100000, which
    CLAUDE.md reserves for records without one. Dropped rate_per_100000 - there
    was never a point estimate to put there, only the span already in rate_low
    and rate_high - and said so in the notes.

    Two prevalence records shared the population string "Worldwide, all HES
    variants", making a prevalence# entity reference ambiguous, and the second
    record is about the idiopathic variant specifically - its own snippet says
    "this variant has no clear gender predominance". Relabelled it "Worldwide,
    idiopathic variant (sex ratio)".

    Three folded explanation scalars carried multi-space runs from string
    concatenation in the previous round's edit script. Folded scalars preserve
    those into the rendered page. Collapsed.

    Non-blocking gaps taken. Added the three ongoing trials the reviewer named:
    NCT04191304 (NATRON, the phase III confirmation of the benralizumab phase II
    already curated), NCT05334368 (depemokimab, testing the same IL-5 axis this
    entry's mechanism rests on), NCT06477653 (dupilumab add-on for partial
    responders to eosinophil-depleting biologics, which is the clinical signal
    that the unexplained driver is not purely IL-5-dependent). Registry records
    fetched and cited. Added clinical_burden (HIGH) with the reported ~9.3%
    mortality and the indefinite corticosteroid maintenance that makes the
    treatment burden lifelong in responders. Added the Peripheral neuropathy
    phenotype.

    Deliberately not added, with reasons. Myocarditis as a discrete phenotype:
    the necrotic stage is modelled in the pathophysiology chain, but neither
    cached source states myocarditis in a quotable sentence, and inventing one
    is the defect this round is fixing. Hepatosplenomegaly: the only
    splenomegaly quotes available are about ruling out a myeloid neoplasm or
    malignant haemopathy, not about idiopathic HES presenting with organomegaly.
    Curating the phenotype on those quotes would be exactly the claim-evidence
    mismatch the blocking finding was about.

    Suggestions the reviewer raised and explicitly did not require a change on
    (all seven treatments binding the generic NCIT:C15986 with specific
    therapeutic_agent values, and the category-level EGPA differential snippet)
    were left as they are.

    Validation. just validate-disorders over both changed files: schema clean,
    terms clean, 121/121 snippets verified. Per-file gates clean
    (entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms)
    and verify-datasets OK. Whole-KB gates clean with no new baseline rows
    (folded-hyphens, snippet-length, title-snippets, snippet-grading).
    Compliance 90.1% to 90.8%.

    Everything in this round is one push: main dismisses stale approvals, so a
    follow-up chore commit would cost a full re-review cycle.

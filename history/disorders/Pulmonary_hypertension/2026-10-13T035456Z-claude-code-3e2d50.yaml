  summary: 'LOINC tranche G batch 7: mPAP measurement and the general PH diagnostic
    band'
  details: |
    Added diagnosis.measurements (LOINC:8414-5, mean pulmonary artery pressure) to the existing Right Heart Catheterization row, with a reference_ranges band for the revised general hemodynamic threshold (mPAP >20 mmHg, any of the five WHO groups), cited to the 2019 task-force paper already cited on this row (PMID:30545968). Notes point to the group-1 (PAH) triad bound on the three PAH entries instead of restating it here. Part of LOINC_DIAGNOSTICS.md tranche G.

    Review round 2: the criterion is mPAP >20 mmHg (strict), and the source's own quote on this band calls 20 mmHg "the upper limit of normal" -- but the pushed band used lower_bound: 20, which under the half-open convention includes exactly 20 as meeting the PH criterion, contradicting the evidence on the same band. Moved to lower_bound: 21, the whole-number half-open convention used elsewhere in this entry family, and recorded the boundary reasoning in notes.

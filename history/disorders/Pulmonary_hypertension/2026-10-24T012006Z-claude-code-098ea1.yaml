  summary: 'Genetics pass: pointer rows to the curated PAH children, decline the HUPRA
    row, resolve a dropped edge'
  details: |
    Genetics pass for issue 12278 (series-071), one of four parents deferred from PR 13315.

    Measured before and after with dismech.qc_plugins: phenotype causal inlink
    10/10 to 11/11; dangling bare-name pathograph targets 1 to 0; has_subtypes rows
    2 to 5, of which rows carrying a bound subtype_term 1 to 4; genes wired 0/9
    before and after, by the reasoning below.

    The nine genes in this entry's genetic section are all pulmonary arterial
    hypertension genes and all nine are already curated at
    Heritable_Pulmonary_Arterial_Hypertension, which carries four more genes
    (GDF2, ATP13A3, KDR, CAPNS1), seven gene-defined subtype rows, and a ten-node
    pathograph with 12 of its 13 genes wired in. Building that cascade here would
    duplicate the child entry rather than curate anything, so the genes were left
    unwired and the missing pointer was added instead: Heritable PAH
    (MONDO:0017148), Idiopathic PAH (MONDO:0001999) and PVOD/PCH (MONDO:0018554)
    are now curated_in rows nested under the existing pulmonary arterial
    hypertension row via its children slot. All three bind the disease_term of the
    entry they point at, so just check-granularity reports no DANGLING_POINTER and
    no POINTER_TERM_MISMATCH for this entry.

    EIF2AK4 was bound on the PVOD/PCH row, where it belongs: bi-allelic variants
    cause the recessive venous and capillary disease, which this entry's own
    association text for that gene already said. Its genetic record now carries a
    review_notes recording that it is the one gene here not belonging to the
    arterial disease.

    MONDO:0013458 (SARS2, HUPRA syndrome) is declined, with the reasoning in notes.
    MONDO files it as a direct child of MONDO:0005149 but also under inherited
    renal tubular disease (MONDO:0015962) and mitochondrial oxidative
    phosphorylation disorder (MONDO:0016387), and it is a multisystem mitochondrial
    aminoacyl-tRNA synthetase disorder in which pulmonary hypertension is one of
    four cardinal features. A subtype row would assert that it is a kind of
    pulmonary hypertension rather than a disease that has it. The term is already
    reasoned about on SARS1-Related_Neurodevelopmental_Disorder as a
    differential_diagnoses row; because that does not retire a concept from the
    MONDO curation queue, a stub was added instead. No HUPRA literature was read
    for this ruling and none is cited: it rests on an OLS4 lookup of MONDO:0013458
    and on the existing differential.

    Separately, the Right Ventricular Hypertrophy node carried a sourced downstream
    edge to Right Heart Failure with no node or phenotype of that name, so the edge
    was silently dropped from the graph and the entry's terminal outcome was
    missing. A Right Heart Failure phenotype bound to HP:0001708 resolves it. The
    now-stale row in tests/causal_target_baseline.txt was left alone, because a
    curation PR should not edit that tree; just check-causal-targets passes either
    way, since the guard fails only on new occurrences.

    Two defects were noted in the entry's notes and deliberately not changed: the
    top-level name is the file-stem form rather than a display name, and the single
    prevalence record is class RARE with the deprecated free-text percentage field
    and no measure_type.

    Validation on the final tree: just validate, just validate-terms and
    just count-verified-snippets clean; 35/35 snippets verified after reverting the
    validator's reference-cache renormalisation.

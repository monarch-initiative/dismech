  summary: 'Create: ZNF407-Related Neurodevelopmental Disorder'
  details: |
    De-novo curation of ZNF407-related neurodevelopmental disorder (MONDO:0859198, OMIM:619557, ZNF407 / HGNC:19904). NEC preflight confirmed gene and OMIM identity via the MONDO obo record. Curated from primary literature: PMID:32737394 (defining biallelic ZNF407 paper) and PMID:23195952 (original ZNF407 ID-with-autism report). An Edison/Falcon deep-research run was launched for cross-check. No GeneReviews article exists for ZNF407 (documented). 11 phenotypes with HPO terms; a two-node pathophysiology chain (loss of ZNF407 zinc-finger transcription-factor function then impaired neurodevelopment); genetic block with the reported variants; AR inheritance; prevalence. Validation: schema PASS, validate-terms PASS, validate-references 17/17 snippets verified.

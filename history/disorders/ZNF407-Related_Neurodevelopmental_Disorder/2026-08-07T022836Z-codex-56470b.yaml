  summary: Publication-readiness review of ZNF407 disorder
  details: |
    Full publication-readiness audit emphasizing completeness and claim-evidence alignment. Verified disease identity with MONDO and the ZNF407 NEC preflight, reviewed the complete ZNF407 PubMed landscape through 2026-08-06, and inspected primary full text where available. Qualified the biallelic mechanism as damaging variants with predicted transcriptional impairment rather than proven complete loss of function. Separated heterozygous 2013 observations from the recessive syndrome and corrected the literature denominator to nine affected individuals across four families. Removed heterozygous evidence from the biallelic causative relationship and replaced the autism phenotype with behavioural anomalies directly reported in the biallelic cohort. Added evidence to prevalence and the causal edge, classified structural modeling as computational and predictive, and added central speech, motor, gait, reflex, and hip phenotypes from founding full text. Connected the provisional transcriptional mechanism to evidence-backed neural endpoints and a clearly hypothetical somatic-development branch with unknown intermediates. Described molecular testing as the published workflow rather than a formal requirement, incorporated 2024 adipocyte cofactor data only as indirect evidence, and recorded explicit neural-model and natural-history gaps. All new snippets came from tool-generated reference caches.

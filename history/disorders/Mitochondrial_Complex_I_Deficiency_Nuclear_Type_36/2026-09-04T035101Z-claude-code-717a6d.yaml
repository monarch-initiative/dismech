  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 36 (MONDO:0030902,
    NDUFC2)'
  details: |
    Curated MC1DN36 (MONDO:0030902, biallelic NDUFC2) as a standalone DISEASE entry from a single primary report (PMID:32969598, three children in two consanguineous families) plus two ClinGen Gene-Disease Validity assertions (CGGV Leigh syndrome 2021 and mitochondrial disease 2023, both Moderate). GeneReviews PMID:26425749 is tagged in the top-level references block but deliberately not cited as evidence, since its cached record carries no clinical content.

    Scope decision: MONDO:0030902 has exactly one superclass, MONDO:0100223 mitochondrial complex I deficiency nuclear type, and is not placed under Leigh syndrome; kb/disorders/Leigh_Syndrome.yaml does not bind NDUFC2. Curated as its own entry, consistent with the MC1DN types already in the KB (2, 6, 12, 23, 24, 31, 34). A discussion (mc1dn36_two_disease_framings) records the coexisting MONDO and ClinGen framings.

    Pathophysiology is a single connected chain from the biallelic variant through loss of NDUFC2 from the membrane arm, failure of ND1/ND2 module assembly, stalled biogenesis, isolated complex I deficiency and loss of complex I-containing supercomplexes, to impaired respiration and then to lactate/pyruvate accumulation and the basal-ganglia/thalamic/brainstem lesion. One conforms_to declaration against mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, with a note recording that only the bioenergetic half of that module node is evidenced here.

    Review pass over the draft made four substantive changes. (1) Added a treatments block holding the two supportive interventions the source actually reports in one patient - ventriculoperitoneal shunt placement (NCIT:C168483) for acute hydrocephalus and nasogastric tube feeding (NCIT:C91836) for an unsafe swallow - each with an exact-quote evidence item; the knowledge-gap discussion that previously asserted no treatments block was rewritten to match, and still records why generic Leigh syndrome management was not imported. (2) Corrected six phenotype frequency bands from OCCASIONAL to FREQUENT: each is one of the three reported children, so 1/3 = 33 percent, which the schema places in FREQUENT (30-79) and not OCCASIONAL (5-29); a note on each records the numerator and denominator so the band is not read as a population frequency. Notes were also added to the OBLIGATE (3/3) and 2/3 phenotypes for the same reason. (3) Added a classifications block (harrisons_chapter GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC, mechanistic_category mitochondrial disease, icimd_category complex_i_subunits_and_assembly_factors), which five of the seven existing MC1DN siblings carry. (4) Corrected notes that referred to MC1DN13 as an existing sibling entry - it is open PR #10825, not a merged entry - and corrected a GeneReviews precedent list to name MC1DN23 rather than MC1DN13; also removed an appeal to an "MC1DN1 precedent" for the Leigh placement question, since no MC1DN1 entry exists in the knowledge base, and replaced it with the direct MONDO check that was actually run. The datasets record's title was aligned with the PRIDE repository's own title for PXD014936.

    Named Entity Confusion was actively managed: NDUFC2 carries a large cardiovascular and complex-trait association literature, and there is a separate HGNC readthrough entity NDUFC2-KCTD14 (HGNC:42956). None of that literature is cited; the gene binding is hgnc:7706; the trap is written into the genetic notes.

    Validation: just validate (schema, terms, references) passed with 63/63 snippets verified against the reference cache. Every snippet was independently re-checked against references_cache/ by script; the only non-byte-exact matches are Unicode hyphen, prime-apostrophe and non-breaking-space differences that the reference validator normalizes and that match KB-wide convention. Every reference_title was checked against its cache file frontmatter title. check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms and check-enum-values all pass on the file; check-title-snippets, check-snippet-length and check-snippet-grading pass whole-KB. No evidence item duplicates a quoted sentence under a different evidence_source.

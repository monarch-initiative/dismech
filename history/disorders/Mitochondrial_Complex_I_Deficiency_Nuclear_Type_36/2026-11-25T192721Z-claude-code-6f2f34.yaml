  summary: 'Gene-family review: NDUFC2'
  details: |
    The NDUFC2 membrane-arm node had no molecular function. NDUFC2 is an ND2-module accessory subunit contacting twelve other subunits, and patient cells lose it and assemble complex I defectively (PMID:32969598); the node now binds structural molecule activity, decreased. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

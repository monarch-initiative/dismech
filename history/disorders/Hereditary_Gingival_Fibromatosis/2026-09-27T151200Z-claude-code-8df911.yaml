  summary: Bind GINGF1/GINGF3/GINGF5 subtype terms and wire five HGF genes into the
    pathograph
  details: |
    series-064 genetics pass. Bound the two checklist classes as subtype_term on rows that already existed: MONDO:0007609 (GINGF1) on HGF1 and MONDO:0033493 (GINGF5) on REST-related. Also bound MONDO:0012378 (GINGF3) on the ZNF513/KIF3C digenic row, whose own display_name already named that locus. Gene-to-mechanism wiring went from 0/6 to 5/6 with no new literature: SOS1 and ZNF862 on the central collagen-overproduction node, and SOS1, ZNF513, KIF3C and KCNQ1 on the RAS-MAPK node, in every case a gene already named in that node's own cited evidence. REST is left unwired on purpose, with the two Europe PMC queries recorded in its genetic notes. Two rows left unbound and explained in the new entry notes: the GINGF2/GINGF4 row covers two MONDO classes at once and subtype_term is single-valued, and MONDO:0975841 GINGF6 carries no description, no synonyms and no causal-gene axiom while a MONDO search for ZNF862 returns nothing.

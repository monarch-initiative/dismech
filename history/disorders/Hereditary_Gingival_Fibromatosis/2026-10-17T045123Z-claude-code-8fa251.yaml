  summary: Annotate the epithelial substrate on the EMT node
  details: |
    The Oxidative Stress and Epithelial-Mesenchymal Transition node carried GO:0001837 epithelial to mesenchymal transition while annotating only a gingival fibroblast (CL:0000057), which is not epithelium. Unlike the other EMT findings in this sweep, the claim here is well evidenced and the fix is additive rather than a removal: PMID:31130610 reports basal lamina disruption with epithelial cell migration into the connective tissue, which is an epithelial substrate, and the node description already said the transition contributes to the fibroblast pool. Added CL:0002621 gingival epithelial cell, defined as a stratified squamous epithelial cell that is part of some gingival epithelium, so the node now annotates both ends of the transition. The term is already bound in Periodontitis, so it validates offline. No process annotation changed.

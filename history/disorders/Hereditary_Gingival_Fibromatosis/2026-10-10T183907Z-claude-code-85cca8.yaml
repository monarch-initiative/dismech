  summary: 'Review fix: move SOS1 GEF off the fibrotic end-state node; baseline ZNF862'
  details: |
    Review of #13022 flagged the SOS1 guanyl-nucleotide exchange factor binding on 'Gingival Fibroblast Hyperactivity and Collagen Overproduction'. That node is the shared fibrotic end state and also carries ZNF862 (whose evidence is COL1A1 upregulation by a zinc finger, no SOS1), so a SOS1 GEF term there overstated and wrongly grounded ZNF862. Removed that molecular_functions block. SOS1's GEF activity remains correctly bound on 'Constitutive RAS-MAPK Signaling in Gingival Fibroblasts' (only that node is the RAS-MAPK node; the earlier record wrongly called both RAS-MAPK). ZNF862 is now grandfathered in the baseline. Note the RAS-MAPK node's SOS1 binding passes the co-located ZNF513/KIF3C/KCNQ1 by the gate's node-level rule, not by describing their activities - that is a limit of the gate, not a grounding claim about those three.

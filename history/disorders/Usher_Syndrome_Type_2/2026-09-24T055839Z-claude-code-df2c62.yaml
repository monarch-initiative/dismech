  summary: 'Create: Usher Syndrome Type 2 (ankle-link complex entity, split from lumped
    Usher_Syndrome)'
  details: |
    Created by splitting kb/disorders/Usher_Syndrome.yaml into four mechanism
    entities plus kb/groupings/Usher_Syndrome.yaml, per the decision recorded on
    issue #10822.

    Scope of this entity: the ankle-link complex - USH2A, ADGRV1, WHRN, with PDZD7
    as a required scaffold curated as a modifier. Two facts make it a distinct
    mechanism rather than a milder type 1: the complex is transient and
    developmental where the type-1 complex is mature and tension-bearing, and its
    retinal counterpart is the periciliary membrane compartment rather than the
    calyceal-process adhesion belt.

    WHRN is held as a USH2D subtype rather than promoted, and the subtype
    description records that ClinGen curates it against a distinct MONDO term
    (MONDO:0012662) so the decision is visible rather than flattened.

    The "Low-Vision Rehabilitation and Psychosocial Support" treatment carries
    evidence for the progressive vision loss it addresses rather than for the
    recommendation itself, and its explanation says so: the type-2 GeneReviews
    abstract does not state that recommendation, and quoting the type-1 abstract
    here would assert it was said about type 2.

    Evidence: 43 snippets, all verified. Two references fetched for this entry
    (PMID:36964137 ankle-link LLPS assembly, PMID:25406310 quaternary complex),
    plus the ClinGen ADGRV1-type 2 Definitive record.

    conforms_to declared against sensorineural_hair_cell_loss and
    photoreceptor_degeneration.

    Validated: linkml-validate (Disease), linkml-term-validator --labels,
    linkml-reference-validator (43/43 snippets verified).

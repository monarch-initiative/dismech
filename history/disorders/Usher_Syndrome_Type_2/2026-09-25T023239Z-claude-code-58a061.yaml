  summary: Bind the three locus subtype MONDO terms and the ankle-link genes into
    the pathograph
  details: |
    Genetics pass for the d2g series-035 gap list (issue #12242), re-homed onto Usher Syndrome
    Type 2 after #12652 replaced the lumped Usher entry the issue named.

    Added. The three locus subtype rows now bind their MONDO terms: USH2A MONDO:0010169, USH2C
    MONDO:0011558, USH2D MONDO:0012662. The entry bound no gene to any pathophysiology node;
    USH2A, ADGRV1, WHRN and PDZD7 are now bound to the ankle-link complex assembly node, whose
    own two snippets name all four. PDZD7 is bound there although its genetic record is a
    MODIFIER, because the binding records where the protein acts rather than restating the
    causal claim; the notes say so. Structured case_fractions from a 684-patient meta-analysis
    were added to the three causative records, with the denominator stated.

    A gene binding on the downstream ankle-link-loss node was written and then removed on
    self-review: that node's snippet describes the links, not the genes, and the assembly node
    already gives all four genes pathograph reach.

    Upstream MONDO observations recorded in the entry: MONDO:0011558 carries no causal-gene
    axiom despite ADGRV1 being the canonical USH2C gene, and its text definition describes the
    digenic GPR98-plus-PDZD7 observation rather than the biallelic ADGRV1 disease the term
    names. MONDO:0024996, obsolete Usher syndrome type 2b, is term-replaced-by MONDO:0011558,
    so USH2B and USH2C are one concept upstream.

    Previous gene symbols recorded in notes were read from the HGNC build's synonym rows:
    ADGRV1 from VLGR1 and G protein-coupled receptor 98, WHRN from deafness autosomal recessive
    31.

    Review round 1 (PR #12741). Three of the ten uncited caches the reviewer found belong to
    this entry and are now cited as the primary gene-discovery report on the subtype row each
    one established: PMID:9624053 on USH2A, PMID:14740321 on USH2C and PMID:17171570 on
    USH2D. PMID:14740321 is quoted under its then-current gene symbol VLGR1, which is why the
    explanation names the approved symbol as well. Each new snippet is from the cited paper's
    abstract and all three caches are content_type abstract_only. The three PMIDs were also
    added to the references block, with titles copied from the cache frontmatter.

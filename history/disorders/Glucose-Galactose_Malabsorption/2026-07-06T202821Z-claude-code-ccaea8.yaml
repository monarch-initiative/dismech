  summary: 'Create: Glucose-Galactose Malabsorption'
  details: |
    Created new Mendelian disorder entry for SLC5A1-related glucose-galactose malabsorption (GGM, MONDO:0011731, OMIM:606824). Confirmed MONDO mapping via OAK: xref OMIM:606824, gene relationship to hgnc:11036 SLC5A1. No GeneReviews article exists for this disease per PubMed search. Curated pathophysiology chain: SLC5A1/SGLT1 loss of function -> failure of active intestinal glucose/galactose absorption -> fructose absorption spared via GLUT5/SLC2A5, and separately -> osmotic diarrhea and dehydration -> dietary rechallenge recurrence. Cited the founding mutation-discovery paper (PMID:2008213, Turk et al. Nature 1991), a Swedish founder-variant pedigree paper (PMID:34485913) documenting both loss-of-affinity and trafficking-defect mechanisms, a long-term dietary cohort study (PMID:33433815) documenting GLUT5-mediated fructose sparing, standard-of-care fructose-based formula treatment, nephrolithiasis complication, and disease rarity (several hundred cases worldwide), a fructose-metabolism literature review (PMID:36673104), a clinical case report (PMID:31142420) for hypernatremic dehydration, failure to thrive, and diagnostic rechallenge, and a recent case report (PMID:42160565) for the metabolic-acidosis and hypernatremic-dehydration phenotype. All PMIDs fetched via just fetch-reference; snippets were adjusted to avoid PDF-extraction mid-word hyphen breaks and page-break interruptions that fail the reference validator normalized substring match. Added a top-level notes field scoping this entry strictly to the congenital biallelic-loss-of-function disorder, excluding the independent SLC5A1 common-variant and T2D GWAS literature and SGLT2/SLC5A2 inhibitor pharmacology. just validate, just validate-references, and just validate-terms all pass.

  details: |
    # Evidence review — kb/disorders/Glucose-Galactose_Malabsorption.yaml

    ## Stats
    - Evidence items checked: 18 (1 inheritance, 2 genetic, 6 pathophysiology
      including downstream-edge evidence, 5 phenotypes, 1 diagnosis, 2
      treatments incl. `target_mechanisms`, 2 prevalence — that is every
      `reference:` block in the file).
    - References read: 6 distinct cached records — PMID_2008213, PMID_34485913,
      PMID_33433815, PMID_31142420, PMID_36673104, PMID_42160565. All present;
      every snippet is an exact substring of its cache body, including the two
      long quotes taken from the PMID_33433815 full-text body rather than its
      abstract.
    - Verified clean: 15 of 18.

    ## Findings

    1. **pathophysiology#Dietary Rechallenge Recurrence (line 289),
       PMID:31142420** — the node's claim is specifically that diarrhea
       *resolves on elimination and recurs on rechallenge*, the pattern used
       diagnostically. The quote is "Relevant investigations clinched the
       diagnosis of ''congenital glucose galactose malabsorption (CGGM)''",
       which names no investigation and says nothing about elimination or
       rechallenge. Vague fragment used as a finding. Severity: DEFECT.
       ACTION: reported only — the cached abstract of this case report contains
       no rechallenge sentence, so there is no same-reference substitution, and
       adding a reference is outside the fix policy. The nearest usable quote
       already in the file's cache set is PMID:33433815's "All six patients
       presented with profound diarrhea at birth with a significant improvement
       after glucose and galactose elimination…", which covers the elimination
       half only (see finding 2).

    2. **pathophysiology#Osmotic Diarrhea and Dehydration → downstream target
       "Dietary Rechallenge Recurrence" (line 269), PMID:33433815** — the quote
       documents improvement after glucose/galactose elimination but not
       recurrence on rechallenge, while the edge `description` asserts both
       ("Symptoms resolve when glucose/galactose is removed from the diet and
       recur on rechallenge"). Graded SUPPORT; PARTIAL would be the honest
       grade for the rechallenge half. Severity: MINOR (claim stronger than
       quote).
       ACTION: reported only — a supported half-claim with an unsupported half
       is a curation decision (split the claim, regrade, or source the
       rechallenge literature), not a minimal repair. Taken with finding 1, the
       whole "rechallenge" limb of this entry is currently unevidenced.

    3. **pathophysiology#SLC5A1/SGLT1 Loss of Function (line 120),
       PMID:2008213** — the quote is the paper's background description of
       *normal* physiology ("Normal glucose absorption is mediated by the
       Na+/glucose cotransporter in the brush border membrane…"), not a finding
       about the disease lesion. The explanation is honest about this
       ("Establishes the normal SGLT1-mediated apical Na+/glucose cotransport
       mechanism that is disrupted in GGM") and the actual lesion is evidenced
       one section up in `genetic:` by the same paper's cosegregation/oocyte
       result. Severity: NOTE. ACTION: reported only.

    4. **genetic#SLC5A1 loss-of-function variants (line 70), PMID:2008213** —
       `evidence_source: HUMAN_CLINICAL` on a sentence that mixes family
       cosegregation with a Xenopus-oocyte functional assay ("…cosegregates with
       the GGM phenotype and results in a complete loss of Na(+)-dependent
       glucose transport in Xenopus oocytes injected with this complementary
       RNA"). The cosegregation half is human genetics, so HUMAN_CLINICAL is
       defensible, but the sentence is genuinely mixed. Severity: NOTE.
       ACTION: reported only — the companion PMID:34485913 item on the same
       claim is correctly `IN_VITRO` for its electrophysiology sentence, so the
       file already covers the in-vitro side with the right grade.

    5. **phenotypes#Elevated Stool Reducing Substances (line 421),
       PMID:42160565** — snippet "reducing substances 2+" is a three-word lab
       fragment lifted from the case report's results table text. It does
       document the finding in a genetically confirmed GGM case, and
       `check-snippet-length` already grandfathers it, but it is
       non-propositional on its own (no analyte context, no patient, no
       direction) and depends entirely on the explanation to become a claim.
       Severity: MINOR. ACTION: reported only.

    6. **phenotypes#Positive Hydrogen Breath Test (line 429)** — carries no
       `evidence:` block at all; the diagnostic claim lives only in
       `description` and `notes`. Severity: NOTE (the `notes` field is
       transparent that this is standard ancillary practice rather than a
       sourced observation). ACTION: reported only.

    7. **prevalence#Västerbotten County, Northern Sweden (line 545),
       PMID:34485913** — the record is typed `measure_type: CASES_IN_LITERATURE`
       / `prevalence_class: NOT_YET_DOCUMENTED`, but the quoted evidence is an
       *allele frequency* comparison (0.0067 vs 0.0015 vs 0.000067), not a case
       count or an occurrence rate. The `notes` field explains the founder-variant
       framing honestly, so this is a typing mismatch rather than a
       misattribution, and the quote does support the sentence the explanation
       makes about it. Severity: MINOR. ACTION: reported only.

    8. **treatments#Fructose-Based Glucose/Galactose-Free Formula (line 507),
       PMID:31142420** — the entry-level quote ("an appropriate rational
       diagnosis can lead to life-saving treatment as depicted in this case
       report") supports that timely diagnosis enables life-saving treatment but
       never names the fructose-based, glucose/galactose-free diet. The
       treatment itself is properly evidenced by the PMID:33433815
       standard-of-care quote on the `target_mechanisms` link immediately above,
       so the claim is covered. Severity: NOTE. ACTION: reported only.

    ## Sections reviewed
    inheritance, genetic, pathophysiology (incl. downstream-edge evidence),
    phenotypes, diagnosis, treatments (incl. target_mechanisms), prevalence,
    notes, disease_term

    ## Verdict
    A carefully sourced entry with a coherent mechanism chain: SGLT1 loss of
    function → failed active glucose/galactose absorption → osmotic diarrhea
    and dehydration, with GLUT5-mediated fructose sparing correctly separated
    and correctly used to justify the dietary treatment, and with the two
    molecular mechanisms (loss of sugar-binding affinity vs. defective
    trafficking) distinguished and each cited to the right paper.
    `evidence_source` is well handled — the Swedish pedigree's
    electrophysiology is IN_VITRO, the fructose-dependence review is OTHER, and
    the case reports and cohort are HUMAN_CLINICAL. No edits were required. The
    single real weakness is the "dietary rechallenge recurrence" limb: the node
    and the edge into it both assert recurrence on rechallenge, and neither
    cited quote establishes it — one quotes only diagnostic resolution, the
    other only that a diagnosis was reached.

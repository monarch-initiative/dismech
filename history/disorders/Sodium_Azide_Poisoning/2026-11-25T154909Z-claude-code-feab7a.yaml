  summary: 'Create: Sodium Azide Poisoning'
  details: |
    New entry for the azide half of azide-salt toxicity, created alongside design decisions section 3g, which records why a composite azide salt is not an entry of its own.

    Mechanism. Nine pathophysiology nodes. Six conform to `xenobiotic_oxidative_phosphorylation_blockade`, which already holds this chain for cyanide, carbon monoxide, formate, diglycolic acid and chloramphenicol: the Complex IV block, the ATP-depletion-with-oxygen-intact convergence node, the glycolytic shift, the oxidative-stress amplifier, the high-demand-tissue effector and the necrosis consequence. `just check-conformance-content` reports 5 of the 6 links sharing a GO term with their module node and one `anchor_no_process` (the module's tissue node binds cell types and locations rather than a process); no `process_absent`, `cell_type_absent` or `edges_absent`.

    Three nodes are entry-local because the module has no counterpart for them: `Systemic Azide Exposure`, `Nitric Oxide Generation from Azide` and `Vasodilatory Hypotension`. Azide's oxidation to nitric oxide is the arm that distinguishes it clinically from cyanide - hypotension dominates and may need vasopressors or mechanical support - and no module covers xenobiotic NO-mediated vasodilation. Whether that earns a module is listed as open in section 3g.

    Two deliberate restrictions. `Myocardial Injury and Encephalopathy` conforms to the module's `Selective Deep Grey Matter and Myocardial Necrosis` but binds only the myocardial arm and a general cell-death claim: the reviewed azide literature reports encephalopathy, seizures and coma but no basal ganglia necrosis, and the node description says so. And dose thresholds are not curated - they carry no mechanistic information and much of the case literature is self-harm.

    Ontology gaps, both recorded in `notes` with the exact searches. No `disease_term`: OLS searches scoped to `mondo` on 2026-11-25 for `azide`, `hydrazoic`, `sodium azide` and `azide poisoning` each returned zero hits, while MONDO codes cyanide, methanol, lead, formaldehyde and thallium poisoning as siblings, so this is a coverage gap in a populated branch and a candidate term request. `Aconitine_Poisoning` and `Arsenic_Poisoning` are the precedent. No `icd10cm_mappings` either: searches returned nothing and the committed ICD-10-CM cache holds no azide code, so the mapping is left for a curator who can read the code from the tabular list rather than composed from memory.

    Validation: `just validate` passed, including term validation; 44 snippets checked and 44 reference titles checked with 0 issues; `just check-causal-targets` and `just check-entity-refs` clean.

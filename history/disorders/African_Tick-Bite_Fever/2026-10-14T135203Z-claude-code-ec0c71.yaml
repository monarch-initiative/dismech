  summary: Bind LOINC group-level SFG serology code to the IFA serology diagnosis
    row
  details: |
    Added diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Indirect immunofluorescence serology row. The row's own description already states that antibodies cross-react across spotted-fever-group species, notably R. conorii, so serology alone does not distinguish ATBF from Mediterranean spotted fever -- an exact match for the group-level scope of this code, so no additional caveat was needed. The code was seeded this round via just loinc-seed-cache + just normalize-cache: one new, additive cache/loinc/terms.csv row (the same code is also cached, with a different retrieved_at, by the still-open batch-9 and batch-16 PRs #13988 and #14101; that is a known, trivial additive conflict for whichever merges later).

  details: |
    Round-1 ai4c-reviewer fixes. (2) Split the bundled 'Dermal Rickettsia africae Entry and Lymphatic Spread' node into atomic 'Dermal Mononuclear Phagocyte Infection' (macrophage + CD68 evidence) and 'Lymphatic Dissemination to Regional Nodes'; moved the endothelial cell type onto the endothelial node and dropped the unsupported GO:0030036 actin binding. (3) Added a notes caveat to the eschar phenotype that its local vasculitic-necrosis mechanism is extrapolated from SFG rickettsioses (no ATBF-specific histopathology cited). Added phenotypes: chills (HP:0025143, PMID:18558881 87.5%), aphthous stomatitis (HP:0032154, PMID:12766836), myocarditis (HP:0012819, PMID:18558881), cellulitis (HP:0100658, PMID:18503259, as an eschar sequela); rebound the rash to HP:0033700 Papulovesicular eruption and added its 15-46% frequency (PMID:20233665). All 10 phenotypes connected. Added a serology diagnosis item (IFA cross-reaction with R. conorii + beta-lactams ineffective, PMID:9916419); a progression phase for the self-limited course (PMID:11939395); an epidemiology evidence item (second commonest fever after malaria, PMID:28544092); and a BEHAVIORAL personal-protection prevention treatment (PMID:21302476). Suggestions taken: quote_role REVIEW_SYNTHESIS on the review-sourced items (PMID:30148688 x3, 24336183, 21302476); lymphadenopathy notes recording the localized-term search. 31/31 snippets verified, all gates green.

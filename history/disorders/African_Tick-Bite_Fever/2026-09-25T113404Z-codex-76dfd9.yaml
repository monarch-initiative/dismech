  summary: 'Create: African Tick-Bite Fever'
  details: |
    Added a standalone African tick-bite fever entry from OpenScientist deep research and verified rickettsial evidence. The entry grounds Rickettsia africae and Amblyomma tick transmission, wires dermal inoculation through lymphatic spread and modest endothelial activation to fever, headache, myalgia, eschars, lymphadenopathy, and rash, and records clinical diagnosis, eschar-swab PCR, and doxycycline therapy. Also updated the spotted-fever parent to point at the new standalone ATBF record.

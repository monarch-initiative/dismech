  summary: Address Staphylococcus Discitis review feedback
  details: |
    Added titles to all evidence items and expanded under-consumed OpenScientist and cohort material into structured fields: all-cause infectious-spondylodiscitis incidence, radicular nerve damage, epidural/paravertebral abscess, endocarditis, elevated CRP, imaging and microbiologic diagnosis, and a progression outcome summary. Split the bundled Protein A/TNFR1/RANKL and endplate-destruction/epidural-extension nodes, replaced the osteoblast-differentiation GO term with TLR2 signaling and positive osteoclast-differentiation bindings, wired endplate destruction and epidural/paravertebral extension to the phenotypes they explain, removed unsupported vancomycin specificity from the six-week antibiotic treatment, replaced the weak surgical guideline scope sentence with an indications quote, and marked the rabbit model as post-seeding only for epidural extension.

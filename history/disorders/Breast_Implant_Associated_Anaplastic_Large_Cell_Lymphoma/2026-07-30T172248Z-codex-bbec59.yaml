  summary: Refine BIA-ALCL diagnostic markers
  details: |
    Reviewed the recently created BIA-ALCL entry for ontology coverage, diagnostic immunophenotype, evidence fidelity, and graph completeness. Mapped the peri-implant CD30-positive neoplastic-cell finding to NCIT:C39715 and added absent ALK protein expression as the defining negative biomarker of this ALK-negative ALCL subtype. Retained the delayed peri-implant seroma and ultrasound fluid-collection labels without forced identifiers because no faithful terms were available in their schema-allowed ontologies. Schema, terms, references, phenotype connectivity, gene wiring, and external phenotype audit all passed.

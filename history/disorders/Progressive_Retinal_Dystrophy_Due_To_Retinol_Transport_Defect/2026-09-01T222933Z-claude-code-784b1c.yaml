  summary: 'Create: progressive retinal dystrophy due to retinol transport defect
    (RBP4)'
  details: |
    New entry for MONDO:0014060, the recessive RBP4 arm of the retinol-transport spectrum. Claim issue #10411.

    Mechanism curated as a seven-node chain: biallelic RBP4 loss of function, absent circulating RBP4, failure to mobilise hepatic retinol into plasma, systemic retinol deprivation with intact hepatic stores, chromophore substrate deprivation at the retinal pigment epithelium, impaired rhodopsin regeneration in rods, and progressive photoreceptor and RPE degeneration, with a separate skin branch for reduced retinoid tone. The defining feature is that this is a distribution failure rather than a deficiency of vitamin A: liver stores stay full while the circulation empties, which is what the Rbp4-null mouse demonstrates directly and human sampling cannot.

    Scope decision. Only the recessive retinal-degeneration arm is curated. Dominant missense RBP4 alleles cause microphthalmia-anophthalmia-coloboma with skewed maternal inheritance; that arm differs in inheritance mode, variant class, developmental timing and proposed mechanism, so it is recorded in a knowledge-gap discussion rather than as a subtype.

    Evidence discipline. The strongest therapeutic result available is vitamin A rescuing vision in Stra6-null mice, and it is about a different gene. Stra6 nulls have the plasma carrier and lack the uptake receptor; these patients have the receptor and lack the carrier. Every use of PMID:24852372 is therefore graded directness INDIRECT, and the human oral dose-response test, in which serum retinol did not rise at all, is curated as a REFUTE item on the same treatment link rather than omitted. The Rbpr2-null mouse was excluded from animal_models on the same reasoning and its cache is not shipped.

    Term corrections against the research report, neither of which its confabulation rate of 0.0 would have surfaced. The report proposed HP:0031287 for acne; that identifier is Seborrheic keratosis and the correct term is HP:0001061. The report also transposed two retinol identifiers, calling CHEBI:17336 retinol/vitamin A and CHEBI:50211 all-trans-retinol, when it is the other way round; the entry binds CHEBI:17336. A third error was mine: GO:0034633 retinol transport was first filed under molecular_functions and is a biological process, caught by the dynamic-enum validator.


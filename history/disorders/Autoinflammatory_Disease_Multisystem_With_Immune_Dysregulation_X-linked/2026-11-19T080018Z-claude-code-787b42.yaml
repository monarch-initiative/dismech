  summary: 'CI: wire DOCK11 to the node that carries its molecular function'
  details: |
    Fixes the one whole-repo gate failing on this branch, check_gene_activity_grounding, which is listed in CLAUDE.md's whole-repo gate set and was not run before the PR was opened. The same miss hit all four entries curated in this run.

    The gate asks that a gene wired into the pathograph reach at least one pathophysiology node carrying molecular_functions:, so that the graph states what the protein can no longer do and not only what the cell can no longer do. DOCK11 reached only 'Hemizygous DOCK11 Loss-of-Function Allele', which is a genomic node asserting a lesion, not an activity. The molecular function was already bound one node downstream, on 'Failure of CDC42 Nucleotide Exchange' (GO:0005085 guanyl-nucleotide exchange factor activity, DECREASED).

    The repair is a genes: descriptor on that activity node rather than a molecular function on the allele node. dismech.graph auto-links a gene descriptor on a pathophysiology node to the genetic entry of the same gene, so DOCK11 now reaches the activity node directly. The claim is true independently of the gate: DOCK11 is the exchange factor whose CDC42 loading fails at that node, which is what the node's own description and its two evidence items already say. Binding a molecular function on the allele node instead would have misdescribed a genomic claim as a molecular-activity one, which the node-class guidance in CLAUDE.md warns against.

    No other content changed. Re-ran after the edit: check_gene_activity_grounding --against-ref origin/main clean; validate-disorders passed with 57 snippets and 60 titles, 0 issues, unchanged from the approved revision; gene-namespaces, snippet-grading, snippet-length, folded-hyphens, folded-yaml, block-scalar-comments, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, logical-rules, reference-titles and cache-order all clean.

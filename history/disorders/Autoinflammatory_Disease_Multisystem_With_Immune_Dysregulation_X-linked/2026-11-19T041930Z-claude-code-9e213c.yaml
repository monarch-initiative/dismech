  details: |
    Curated from an OpenScientist deep-research run (research/Autoinflammatory_Disease_Multisystem_With_Immune_Dysregulation_X-linked-deep-research-openscientist.md, job 4389b1af-1163-414a-93f6-fc0271b48b26, 2679s, 26/27 references resolved). just preflight-dr returned WARN, not FAIL: the second-gene signal was ADMIDX, which is the OMIM acronym for the disease itself misread as a gene because no local HGNC build is present, and the report's second OMIM number (300681) is DOCK11's gene MIM rather than a second disease. Verified by hand before using the report.

    Report findings deliberately NOT carried into the entry: PMID:41250716 did not resolve and is uncited; PMID:41278672 (C. elegans toca-1 collateral branching) was flagged off topic and is uncited; the report's own gnomAD v4 positional analysis, GTEx/HPA expression argument and Fisher test of allele class are provider computation rather than published findings and appear nowhere as evidence. The report's NCIT treatment bindings were largely wrong (its own term validation flagged NCIT:C579, C1593, C15360, C15339, C15417, C96109 as naming unrelated concepts) and every ontology term here was re-derived from OLS instead.

    Two bindings I wrote from memory were caught and corrected: MGI:2149013 does not exist and ZFIN:ZDB-GENE-060526-150 is map7d2a, not dock11. Correct IDs (MGI:1923224, ZFIN:ZDB-GENE-060503-196) were read from NCBI Gene and confirmed with just check-gene-namespaces-online. Two reference_title values were also fabricated and were replaced with the cached titles; all 67 titles now match.

    Entry shape: one Disease with two has_subtypes rows for the allele-class strata MONDO files as descendants (MONDO:0958138 complete, MONDO:0958137 partial), not a Grouping, because PMID:40274249 reports the two classes as differing in which clinical arm dominates while CDC42 activation is impaired in both. No IUIS category is recorded because IUIS 2022 (PMID:35748970) predates the 2023 description of the gene; that is stated in notes rather than guessed.

    Validation: just validate-disorders passed (64 snippets, 67 titles, 0 issues); just validate-terms passed; check-entity-refs, check-causal-targets, check-name-collisions, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-coarse-phenotypes, check-logical-rules, check-delivery-system and check-gene-namespaces-online all clean. just check-genereviews --online reports NO_CHAPTER for both the disease name and the causal gene, which is what notes claims. 17 of 17 phenotypes are causally connected.

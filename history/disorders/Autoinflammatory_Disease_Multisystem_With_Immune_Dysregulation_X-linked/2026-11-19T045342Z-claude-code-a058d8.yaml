  summary: 'Review round 1: re-bind phenotypes to quotable claims, fix snippet grading'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #18435.

    Blocking: just check-snippet-grading failed with 3 findings, which CI does not run on a kb/-only PR, so it would first have failed in the merge queue. Two were one sentence of PMID:37342957 graded HUMAN_CLINICAL on two pathophysiology items and MODEL_ORGANISM on the mouse model readout. Re-quoting the mouse clause alone did not clear it, because the gate matches by substring and the shorter quote is contained in the longer one, so the gradings were made to agree on HUMAN_CLINICAL (the sentence's subject is the patient-derived T cells; the paper is a four-patient clinical study) with the mixed-species reading recorded in the readout's explanation. No mouse-only sentence exists in the abstract. The third was PMID:39644982 graded HUMAN_CLINICAL on the Pericarditis phenotype, which has been removed.

    Substantive: the reviewer found that eight phenotypes carried quotes that did not name the finding - pericarditis cited an actinopathy-class sentence about skin and digestive manifestations, BCGitis cited 'presented with infections', and so on - and that directness: INDIRECT covers an inference step rather than a quote about something else. That is correct. just fetch-reference --force on all three index series returns abstract_only, so no quotable full text exists. Rather than drop the content silently or keep misdirected quotes, the phenotype block was re-bound to what the abstracts actually name: Autoimmune cytopenia (HP:5210419) replaces the Coombs-positive and thrombocytopenia rows, Colitis (HP:0002583) replaces Crohn's disease since the sources say inflammatory bowel disease and both reported forms are colitides, Lymphoproliferative disorder (HP:0005523) replaces hepatomegaly and splenomegaly, and Global developmental delay (HP:0001263) replaces failure to thrive and postnatal growth retardation. Anisocytosis, systemic lupus erythematosus, recurrent pneumonia and bronchiectasis keep their original quotes, which do name them. The fourteen OMIM-clinical-synopsis-only features are now listed in notes with their k/n denominators and an explanation of why they are not bound, so a curator with full-text access can promote them with a real snippet.

    Corticosteroid Therapy was removed rather than softened. None of the three index series' abstracts mentions any drug and the actinopathy review names only transplantation, so the entry cannot cite corticosteroid use in this disease; notes records that, and that the calcineurin and JAK inhibitors the deep-research report proposed are untested inference.

    Accepted suggestions: immunoglobulin replacement moved from therapeutic_modality OTHER to PROTEIN_REPLACEMENT; a second quote was added to the transplantation item establishing that the review's scope includes DOCK11 specifically, which is what licenses citing its class-level statements here.

    Declined, with the reason given in the PR reply: the entry name was not changed to 'DOCK11 Deficiency'. The reviewer marked it non-blocking. The KB's closest structural precedent, Autoimmune_Disease_Multisystem_Infantile-onset_3 for CBLB, uses the OMIM title form for exactly this shape; the name matches the MONDO label and the OMIM title; 'DOCK11 deficiency' is retained as a synonym; and a rename would also decouple the committed research report and history slug from the entry. Offered to rename if a maintainer prefers.

    Also not done: the report's macrophage chemotaxis branch (Dock11-tm1Thar) remains omitted, as the reviewer marked it non-blocking and the mouse line's chemotaxis result is not in a cached abstract.

    Validation after the round: just validate-disorders passed (57 snippets, 60 titles, 0 issues); just validate-terms passed; check-snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules, delivery-system and gene-namespaces all clean. 8 of 8 phenotypes causally connected.

  summary: Review Bachmann-Bupp clinical cohorts, ODC1 variants, experimental models
    and treatment evidence
  details: |
    Reviewed the existing entry, both prior CREATE/EDIT histories, and the matching claude_code deep-research report and citation sidecar. This is a Mendelian ODC1 gain-of-function disorder, eligible for the review sweep excluding infectious and environmental diseases/poisonings. Rebased onto origin/main before edits and again before finalization (116b24e6501).

    Evidence consumption: read the recovered scientific bodies and relevant tables of PMID:37092498, 34477286, 40167220, 37469105, 41410504, 33806076, 11533243, 40382142, 34282722 and 41925768, plus the BABS-relevant clinical sections of the full LSS article PMID:30723320. Read the remaining cited cached abstracts. Read GeneReviews PMID:36007106 and its accessible chapter opening/table; complete chapter cache retrieval encountered a challenge page, so no challenge content is committed or cited. Primary clinical tables supply the additional phenotypes and denominators. Generated and read the published erratum PMC10479987, ClinVar RCV001263232, and BioProject PRJNA640661 source records. All reference files were generated by fetch-reference or normalized by repository tooling, never hand-edited.

    Content-completeness assessment:
    1. Phenotypes — adequate after adding 25 features (51 total), including prenatal polyhydramnios, specific craniofacial and ectodermal features, cryptorchidism, behavioral findings, brain abnormalities and specific congenital cardiac defects. Frequency bands now use identified small-cohort denominators where available, with overlapping cohorts, stillbirth inclusion and age dependence stated. Corrected seizures from a qualitative VERY_RARE assignment to the reported 1/12 series and onset at 14 years, rather than age 23 at evaluation. Alopecia 12/12 and developmental delay 8/8 liveborn are observations in cited series, not established population penetrance. Vascular skin abnormality and cutaneous cyst replace unsupported narrower capillary-malformation and epidermoid-cyst bindings.
    2. Subtypes — N/A: no established mechanistically distinct BABS subtypes in the sources. ODC1 G84R has association and recombinant-enzyme evidence but is not established as a separate Mendelian diagnosis or a BABS allele.
    3. Pathophysiology — adequate with explicit limits. C-terminal truncation, impaired degradation, enzyme accumulation and polyamine excess are distinguished from provisional neural progenitor hypotheses. Skin-restricted K6/ODC is distinct from the ODC-ER model used to study stem-cell recruitment; the latter finding does not establish the K6 alopecia mechanism. Odc1-null early embryonic apoptosis is contextual evidence, not a BABS model or a human therapeutic threshold. Added patient fibroblast, reference-line organoid and engineered truncated-enzyme cell models. Treatment/model links are retained only where supported.
    4. Treatments/trials — adequate. Eflornithine evidence is uncontrolled, includes concurrent dietary intervention, and does not establish restored brain architecture, a developmental effect size or an optimal window. The 2025 review describes six treated individuals; published dermatology cases are not assumed to be additional nonoverlapping patients. Added physical, speech and occupational therapies and completed GeneReviews surveillance domains. The recorded ClinicalTrials.gov condition search returned zero studies; oncology/chemoprevention NCT identifiers from the research are not BABS trials. Experimental AMXT1501/polyamine-transport and microbiome proposals lack BABS clinical efficacy evidence. Removed the unsupported blanket DFMO contraindication in Snyder-Robinson syndrome.
    5. Genetics — adequate. Five variant records separate an explicitly qualified ClinVar pathogenic assertion, reported truncating/splice alleles without invented ACMG classes, and a p.Tyr406Phe VUS with normal erythrocyte ODC activity. The published 2021-table erratum establishes c.1342A>T, not A>G. Recurrent splice effects remain predicted when not experimentally assayed; inconsistent table spellings are not silently treated as distinct alleles.
    6. Biomarkers/diagnostics — adequate. Molecular diagnosis is distinguished from supportive metabolomics; no unsupported claim that metabolomics typically precedes sequencing remains. ODC activity fold changes are scoped to the index patient's specific preparations. Plasma polyamine findings are not generalized to every tissue. Acisoga remains an exploratory pharmacodynamic marker without an established specificity or clinical-outcome relationship.
    7. References — adequate. Recovered full text materially changes clinical and mechanistic curation; high-value sources and GeneReviews are represented. PMID:41931584 and the PubMed erratum record yielded no quotable text on attempted fetches and are excluded; the full erratum URL is cited instead. The BioProject is verified against NCBI and described as a broader organoid exposure study, not a BABS patient dataset; its total sample count is not assigned to the cited ODC1 expression analysis.
    8. Overall consumption — adequate for central research themes after correcting source errors and adding previously omitted clinical and experimental content. Secondary GeneReviews-table differentials CHD3, DCAF17, PAK1 and PTEN remain non-blocking leads without cached discriminating chapter passages; the existing molecularly informative polyaminopathy and LSS differentials are retained and corrected. No cancer surveillance standard is inferred from a suggestion or transgenic tumor susceptibility.

    Source discrepancies resolved include the published variant correction, seizure onset versus current age, table/narrative frameshift spelling, the 2026 review's inconsistent developmental-delay percentage and absence rows contradicted by primary cases, and the distinction between ODC-ER and K6/ODC skin models. Where a source is internally inconsistent, unsupported conclusions are not adopted.

    Validation before final commit: schema, ontology terms and references passed (233 snippets, 251 titles; zero skipped, unavailable or failed items); scoped disorder tests passed (2 tests); causal-target, coarse-phenotype and GeneReviews baseline checks passed; scoped snippet grading found no violations. Formatting preserved the parsed disorder content. Final commit hooks and independent PR review remain separate gates.

    Historical provenance archive follows. These are the original entry's process notes, preserved verbatim as an obsolete record of the earlier curation. Their statements about missing full text, five frequency bands, unconsumed variants and unavailable case counts are superseded by the review above and MUST NOT be interpreted as the current evidence assessment.

    Scope, provenance and named-entity-confusion notes for this entry.

    (1) GeneReviews baseline. A GeneReviews chapter exists (PMID:36007106, "Bachmann-Bupp Syndrome", Bupp, Michael, VanSickle, Rajasekaran and Bachmann, 2022 Aug 25) and was used as the mandatory phenotype baseline. Every clinical feature named in its Clinical Characteristics paragraph is represented in the phenotypes block: the distinctive alopecia, global developmental delay in the moderate to severe range, hypotonia, nonspecific dysmorphic features, behavioural abnormalities (autism spectrum disorder and attention-deficit/hyperactivity disorder are curated as two separate phenotype entries), feeding difficulties, the birth-hair-then-clump-loss natural history, and the rare findings of later-childhood seizures and conductive hearing loss. Features named only in its Management paragraph (obesity, constipation, refractive error, strabismus, follicular cysts, congenital heart defects) are also curated, sourced to that same paragraph. Nothing in the GeneReviews abstract is knowingly omitted. The cached record is the structured PubMed abstract, not the full chapter body, so features present only in the chapter body may still be missing.

    (2) Named-entity-confusion discipline - this is the central risk for ODC1. ODC1 is a heavily studied oncology and polyamine-pharmacology gene, and the overwhelming majority of its literature is cancer biology, DFMO chemoprevention or basic polyamine metabolism with no bearing on this neurodevelopmental disorder. Every citation in this entry was checked to be either (a) about genotyped human BABS patients, (b) the disease-specific review literature from the International Center for Polyamine Disorders, or (c) the C-terminally-truncated-ODC animal model that is the accepted mechanistic model of this exact lesion. No chemoprevention trial (colorectal adenoma, skin cancer) and no neuroblastoma efficacy trial is cited as evidence for a BABS claim; the neuroblastoma literature is referred to only where the BABS papers themselves invoke it as the source of the paediatric dose and safety data, and that is stated explicitly in the eflornithine treatment entry rather than cited directly.

    (3) The direction-of-effect trap. BABS is a GAIN-of-function disorder. ODC1 knockout and loss-of-function data must not be imported as if they modelled the patient state, and none is. The one loss-of-function observation that is curated (the ODC G84R hypomorph in PMID:33806076) is deliberately modelled as a differential-diagnosis entry and as a contrast, never as support for a BABS mechanism, because the same paper reports that the two directions have opposite predicted consequences for neural progenitors: gain-of-function with over-proliferation and loss-of-function with depletion. Likewise the mouse evidence used here is the K6/ODC transgenic, which carries a premature stop codon producing a carboxyl-truncated, stabilised ODC - the same class of lesion as the human variants - and not an Odc1 null.

    (4) Mouse-model fidelity and its limits. The K6/ODC mouse (PMID:8618048, reviewed in PMID:41925768) reproduces the alopecia and follicular cysts and their reversal with DFMO, and was the direct basis for the drug-repurposing decision. It is a keratin-6-promoter-driven, skin-restricted transgenic, whereas BABS patients express the truncated enzyme in every tissue, so it models only the cutaneous arm. All neurodevelopmental claims in this entry therefore rest on human evidence, and the mouse evidence carries evidence_source MODEL_ORGANISM and is confined to the hair-follicle and follicular-cyst nodes.

    (5) Frequency derivation. Frequency bands are recorded on only five phenotypes and are omitted everywhere else. The five that carry a band are derived from GeneReviews qualitative language using the standard prose-to-FrequencyEnum mapping: features the chapter says the syndrome "is characterized by" (alopecia, global developmental delay, hypotonia) take VERY_FREQUENT, and features it explicitly calls "rare findings" (later-onset seizures, conductive hearing loss) take VERY_RARE. No numeric denominator underlies these bands. The published case denominators are tiny and inconsistent: PMID:30475435 reported four patients, PMID:30239107 one, PMID:34477286 four more, PMID:37092498 two more, and PMID:34282722 described the cohort as "less than 10 known cases". The deep-research report surfaced a per-feature frequency table (n=9) from the body of the GeneReviews chapter, giving alopecia 9/9, dysmorphic features 9/9, developmental delay 8/8, hypotonia 8/8, macrocephaly 6/9 and seizures 1/8. Those numbers are consistent with the bands recorded here, but the cached PubMed record for PMID:36007106 contains only the structured abstract, so the table itself could not be verified byte-exactly and its numbers are therefore NOT asserted as evidence anywhere in this entry. A future curator with access to the full chapter should be able to upgrade these bands to denominator-backed ones.

    (5a) Two phenotypes that the deep-research report supports but this entry does NOT curate, because no cached abstract contains a quotable sentence for them. Polyhydramnios (reported at 55-80% of pregnancies) and the HPO annotation set for OMIM:619075 (hypertelorism, high forehead, sparse eyelashes, cryptorchidism, ptosis and others) are both real and both well-attested in the sources the report cites, but grepping every cached reference used by this entry for "polyhydramnios" returns zero hits, and the HPOA annotations are database records rather than quotable abstract text. They are omitted rather than sourced to a citation that does not contain them. This is a recorded gap, not a claim that the evidence does not exist.

    (6) Prevalence derivation. No population-based rate has ever been published. The prevalence record therefore uses the qualitative ULTRA_RARE tier with the case-count denominators recorded in its notes. The counts themselves conflict across sources and are not summed into a single asserted total.

    (7) No structured-source (ORPHA:544488, CGGV, CGDS) citation is included. Neither an ORPHA_544488 nor any ClinGen cache file for ODC1 is present in references_cache, and generating one would require a data MANIFEST bump, which is blocked by the stale, un-refreshable pins tracked in #7622. The structured-source citation is skipped rather than fabricated.

    (8) Two claims that are true in the literature but are NOT asserted here for lack of a quotable BABS-specific source. First, an exact number of reported BABS patients: the sources disagree and none of the cached abstracts states a current cumulative total, so no total is asserted. Second, an oncology surveillance recommendation: PMID:30475435 raises cancer surveillance only as a suggestion ("cancer surveillance may be important in this disorder") and the GeneReviews surveillance paragraph does not include tumour screening, so this is curated as a discussion item and an explicitly hedged treatment note rather than as a recommendation.

    (9) Prenatal presentation. PMID:41931584 reports a prenatally diagnosed BABS fetus with macrocephaly and a ventricular septal defect. That record has no abstract in PubMed - fetching it yields only a bibliographic header with no quotable body - so it is not cited for any evidence item and its cache file is deliberately not committed. The congenital heart defect phenotype is instead sourced to the GeneReviews management paragraph, which does list congenital heart defects. The same applies to PMID:34318586 (LSS hypotrichosis families), which also has no abstract; the LSS differential is therefore sourced to PMID:30723320 instead.

    (10) Scope of differential_diagnoses. Six differentials are modelled. The four other recognised polyaminopathies (Snyder-Robinson syndrome, Faundes-Banka syndrome, DHPS deficiency and DOHH disorder) are bound to MONDO terms, because PMID:41410504 explicitly groups all five as one family that "share many similar clinical phenotypes" - which is exactly the setting in which evidence gets misattributed. Each is discriminated by its gene, its direction of effect and its position in the polyamine pathway. LSS-related alopecia-intellectual disability syndrome 4 is bound as the closest mimic outside the pathway, discriminated on congenital versus non-congenital alopecia. The sixth, the ODC1 loss-of-function/hypomorphic neurological phenotype, is left UNBOUND: it is the single most dangerous confusion for this entry because it involves the same gene, but it has no OMIM entry and no MONDO term of its own, so binding it to any existing term would be a fabrication. Note that MONDO:0800159 (disorder of polyamine metabolism) and MONDO:0100500 (Mendelian neurodevelopmental disorder) are this entry's own asserted superclasses and are therefore deliberately absent from the differential list. Four further differentials named in the GeneReviews differential table and relayed by the deep-research report (CHD3 / Snijders Blok-Campeau syndrome, DCAF17 / Woodhouse-Sakati syndrome, PAK1 / IDDMSSD and PTEN / Cowden syndrome) are NOT modelled here, because that table lives in the chapter body and not in the cached abstract, so no verbatim discriminating sentence is available for any of them from a reference this entry cites. They are named here so the next curator knows where to look rather than having to rediscover them.

    (11) Provenance of this entry. The deep-research provider was claude_code, run via `just research-disorder claude_code Bachmann-Bupp_Syndrome` on 2026-08-01 (report at research/Bachmann-Bupp_Syndrome-deep-research-claude_code.md; 8 web searches, 77 turns, 38 citations). The report was read in full and treated as leads rather than ground truth: every PMID it supplied was fetched with `just fetch-reference` and every snippet used here was copy-pasted from the cached file. Claims the report made that could not be verified against a cached abstract - the GeneReviews frequency table, the GeneReviews differential table, the cumulative case counts of 12 published / 18 worldwide across eight countries, polyhydramnios frequencies, ClinVar accessions and the full variant table - are recorded in these notes as leads and are not asserted as evidence anywhere in the entry.

  summary: Enhance lithium mechanism-of-action evidence
  details: |
    Added two lithium mechanism-of-action pathophysiology nodes (GSK-3β Signaling Dysregulation; Phosphoinositide Signaling and Inositol Depletion) with fully validated evidence from Klein & Melton 1996 (PMID:8710892), Stambolic 1996 (PMID:8994831), Williams 2002 (PMID:12015604), and Chiu & Chuang 2011 (PMID:21743136). Strengthened the Circadian Rhythm Disruption node with Lavoie/Beaulieu 2013 GSK3-beta circadian evidence (PMID:23919927) and the Neuroplasticity Alterations node with lithium/BDNF evidence (PMID:21743136). Upgraded the Lithium treatment block with therapeutic_modality (SMALL_MOLECULE), treatment_term (NCIT:C15986 Pharmacotherapy) + therapeutic_agent (CHEBI:6504 lithium carbonate), and four target_mechanisms edges linking lithium to the GSK-3-beta, phosphoinositide, circadian, and neuroplasticity nodes. Two guessed PMIDs were caught and discarded during fetch-verification. All snippets confirmed as exact substrings of cached abstracts; schema, term, and structural (FK) validation pass.

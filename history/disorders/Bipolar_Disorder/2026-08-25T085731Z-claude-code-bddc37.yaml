  summary: Add ITIH3 / 3p21.1 shared BD-OCD susceptibility locus and effector-gene
    knowledge gap
  details: |
    Curation-scanner high_effort run against issue #8478 (preprint PPR:PPR1294131, a cross-trait BIP/OCD conjFDR analysis prioritizing ITIH3/ITIH4).

    Added a genetic[] entry ITIH3 (hgnc:6168, relationship_type SUSCEPTIBILITY) recording the extended 3p21.1 psychiatric risk region. Peer-reviewed anchor is the PGC bipolar GWAS Table 1 locus 9 row (PMID:34002096: rs2336147, chr3:52,626,443 GRCh37, P = 3.6e-13, OR 1.070, the authors' own gene label ITIH1, flagged as previously reported for SCZ and by the Cross-Disorder Group); the preprint is attached at supports: PARTIAL so it is never sole support.

    Named-entity check performed before writing: SNP and gene coordinates were resolved against the Ensembl GRCh38 REST API rather than assumed. rs2336147 (GRCh38 chr3:52,592,427) lies ~185 kb proximal to ITIH1 (52,777,559-52,792,068), so the notes and the evidence explanation both state this is a locus-level susceptibility signal in a long-range LD block, not a demonstrated ITIH3 coding or regulatory effect.

    Added discussion gap_bip_ocd_3p21_1_effector_gene_and_h3k27ac (KNOWLEDGE_GAP, OPEN, attaches_to genetic#ITIH3). It sets the preprint's proposal (ITIH3/ITIH4 effectors; rs3774364, which is inside ITIH4, colocalizing with prefrontal-cortex H3K27ac haQTLs) against PMID:34978167, whose CRISPR-Cas9 dissection of rs2535629 - a variant inside an ITIH3 intron - assigned the regulatory effect to the distal genes GLT8D1, SFMBT1 and NEK4 and concluded SFMBT1 mediates the risk. That contradiction in gene assignment is the substance of the gap. PMID:40855518 (systematic review and meta-analysis of BD-OCD comorbidity) supplies the peer-reviewed clinical stake.

    Validation run: just validate (all checks pass; 53/53 snippets verified against the cache), just validate-terms (pass), check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets (all pass), pytest tests/test_data.py -k Bipolar (38 selected, pass).

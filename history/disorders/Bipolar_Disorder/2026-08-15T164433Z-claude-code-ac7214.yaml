  summary: Cite evidence for previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 3. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. This tranche used a hardened helper that pulls `reference_title` from the cache frontmatter rather than typing it, and asserts each snippet is non-empty, over 20 characters, at least 5 words, bracket-free and present in the cache -- the guards that the #8541 review showed were missing. Cited all four previously evidence-free `environmental:` exposures (Childhood Trauma, Sleep Deprivation, Substance Use, Stress). Three of the four are PARTIAL for substantive reasons rather than weak sourcing: the childhood-trauma meta-analysis pools affective and psychotic disorders rather than isolating bipolar disorder; the substance-use review supports comorbidity and an effect on clinical course but not the episode-triggering half of the note, and states the direction of the relationship is unclear; and the life-events study found the reverse direction too, with depressive symptoms preceding negative life events, so its own title asks whether life events are cause or consequence. Sleep Deprivation is SUPPORT, cited to a review of the manic switch process.

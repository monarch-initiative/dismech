  details: |
    Reconciled the canonical_polygenic_synaptic_circadian_dysregulation_model hypothesis notes/evidence in Bipolar_Disorder.yaml with an independent assessment (issue #7402) of six qualifications copied into the disease YAML from the 2026 openscientist hypothesis-search sidecar report's Executive Judgment section, several of which overstated what the cited sources actually show.

    Rescoped five of the six qualifications to the actual scope/design of their supporting studies: 1 the psychosis-stratified cortical transcriptome overlap PMID:33442739 is a less-pronounced similarity concentrated among BD subjects with psychosis, not a test of the canonical model or a BD-I-restricted finding; 2 the dihydropyridine-vs-verapamil calcium-channel-blocker translational picture rests on a 2-patient sub-finding inside a 30-person mixed cohort PMID:9790159, tempered by a broader review finding limited controlled support for CCA efficacy generally PMID:11252650; 4 TIMELESS/RORA PMID:24716566 is one 2014 candidate-gene study, not a modern literature-wide meta-analytic replacement for CLOCK/BMAL1; 5 split the conflated structural-imaging claim into its two separate, weaker findings -- PMID:23820096 found no BD-risk-SNP structural association surviving correction so there is no confirmed gene-attributed finding to generalize from, and PMID:32646651 ENIGMA found shared morphology across BD/SZ/MDD/OCD generally, not gene-attributed or psychosis-spectrum-specific; 6 corrected the categorical no-modern-dihydropyridine-CCB-trial claim -- NCT01784666 adjunctive isradipine for bipolar depression was registered but terminated early for lack of enrollment 2 participants, confirmed via the ClinicalTrials.gov API. Qualification 3, lithium/PI3K-Akt pharmacogenomics, was left unchanged since the issue did not flag it.

    Also added PMID:39843750, the 2025 PGC4 multi-ancestry GWAS: 298 genome-wide-significant loci, 158036 cases, 2.8M controls, as evidence updating the polygenic-architecture context beyond the smaller PGC3 scan the sidecar report's genetics framing was based on, per the issue's Missing current genetics context section.

    Added eight new evidence items under the hypothesis's evidence list PMID:33442739, 9790159, 11252650, 24716566, 23820096, 32646651, clinicaltrials:NCT01784666, PMID:39843750, each grounding one rescoped qualification with an exact-quote snippet and an explanation stating what the study does and does not establish. status: CANONICAL left unchanged -- this is a precision/scoping fix, not a verdict change.

    Fetched and cached all 8 new references via just fetch-reference. Validated with just validate: schema + term + reference validation all pass, 42/42 snippets verified. Reverted unrelated references_cache frontmatter re-quoting churn and a cache/enums reordering that just validate's normalization step touched outside the scope of this change.

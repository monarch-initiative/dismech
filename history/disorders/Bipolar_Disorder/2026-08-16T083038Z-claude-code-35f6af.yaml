  details: |
    Curation-scanner run for issue #6512 (preprint-scan, SETD1A). Added a SETD1A genetic record with a structured p.Pro596Leu (rs139187973) variant, and a gap_bipolar_setd1a_p596l_replication KNOWLEDGE_GAP discussion attached to it. The bipolar association is deliberately recorded as a lead rather than a locus: relationship_type SUSCEPTIBILITY, the primary association evidence item typed PARTIAL (nominal P = 0.027, single founder population, non-peer-reviewed preprint PPR:PPR1277941), and PMID:26974950 cited only as peer-reviewed gene-level context, with an explanation stating explicitly that it does not itself implicate SETD1A in bipolar disorder. The proposed experiment is a gene-level burden test conditioned on psychotic features, because the founder allele is 55-fold enriched in the Old Order Amish and cannot be replicated directly elsewhere. Validated with just validate-disorders (schema + terms + references, exit 0) and just count-verified-snippets (189/189 across both changed files).

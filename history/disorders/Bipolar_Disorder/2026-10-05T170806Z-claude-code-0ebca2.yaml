  details: |
    Added the entry's first experimental_models section, with two models, for issue 13600. Model 1 is primary human neural progenitor cells from about 80 genotyped unaffected fetal donors exposed to lithium for 48 hours (Wolter 2023, PMID:36307327; Valone 2026, PMID:41935183). It is linked to Neuroplasticity Alterations as PERTURBS with fidelity UNKNOWN and four typed divergences (proxy quantity, population, boundary, temporal scope), and to GSK-3β Signaling Dysregulation as MEASURES with an UNCHANGED canonical-Wnt readout from the 2023 paper. Both full texts were read from the PMC cache. The dose-response result (proliferation up at 0.75 and 1.5 mM, down at higher concentrations) is quoted from the 2023 paper, which measured it; the 2026 paper restates it. The 18% chromatin figure, the bipolar heritability enrichment, the rare-variant overlap and the 105-gene association result were each confirmed in the 2026 full text. Genotype-by-treatment results have no structured field and are recorded under the model's findings. Model 2 is the patient iPSC-derived dentate gyrus-like neuron model (Mertens 2015, PMID:26524527), already cited in two pathophysiology nodes and now listed as a model linked to Neuronal Hyperexcitability (RECAPITULATES) and Mitochondrial Dysfunction (MEASURES). No pathophysiology node was added or changed. The 21 supplementary tables of the 2026 paper were not read. Validation: just validate-disorders passed with 112 of 112 snippets verified; the model-link tests in tests/test_data.py passed.

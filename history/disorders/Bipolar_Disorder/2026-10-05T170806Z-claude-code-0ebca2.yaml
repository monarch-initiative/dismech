  details: |
    Adds the entry's first experimental_models section, holding one model, for issue 13600. The model is primary human neural progenitor cells from about 80 genotyped unaffected fetal donors exposed to lithium for 48 hours (Wolter 2023, PMID:36307327; Valone 2026, PMID:41935183). It is linked to Neuroplasticity Alterations as PERTURBS with fidelity UNKNOWN and four typed divergences (proxy quantity, population, boundary, temporal scope), and to GSK-3β Signaling Dysregulation as MEASURES with an UNCHANGED canonical-Wnt readout from the 2023 paper. Both full texts were read from the PMC cache. The dose-response result (proliferation up at 0.75 and 1.5 mM, down at higher concentrations) is quoted from the 2023 paper, which measured it; the 2026 paper restates it. The 18% chromatin figure, the bipolar heritability enrichment, the rare-variant overlap and the 105-gene association result were each confirmed in the 2026 full text. Genotype-by-treatment results have no structured field and are recorded under the model's findings. The patient iPSC-derived neuron model (Mertens 2015, PMID:26524527) was drafted in the same session and has been split into its own pull request, 13788, so it does not wait on the scope question. No pathophysiology node was added or changed. The 21 supplementary tables of the 2026 paper were not read. Every evidence item carries reference_title, and the NFAT quote on the GSK-3β link is graded BACKGROUND because the sentence carries citation (47) and restates the group's earlier result; both were review findings on PR 13603. Validation: just validate-disorders passed with all snippets verified; the model-link tests in tests/test_data.py passed.

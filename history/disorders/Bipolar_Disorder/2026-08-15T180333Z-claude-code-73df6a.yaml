  summary: 'Resolve tranche-3 citation collision with #8556'
  details: |
    Conflict-resolution session against PR #8556, which landed a parallel tranche 3 over the same exposures from different sources while PR #8557 was in review. This record exists because the earlier record in this directory (2026-08-15T164433Z) describes two citations this entry no longer carries -- history is append-only and that record accurately describes the session as it ran, so it is left intact and this one records what changed. Childhood Trauma: the citation was replaced with #8556's PMID:33364762, which is bipolar-specific (OR 2.63 versus healthy controls). The earlier record's rationale -- a meta-analysis pooling affective and psychotic disorders, graded PARTIAL for exactly that pooling -- no longer applies, because the replacement removes the limitation that PARTIAL was flagging. Sleep Deprivation: replaced with #8556's PMID:10482346, a therapeutic sleep-deprivation trial measuring switch rates of 4.85% into mania and 5.83% into hypomania. The earlier record describes a review naming sleep deprivation among switch triggers; a measured rate from an intervention is better evidence for the annotation's claim. Substance Use and Stress each retained both citations: #8556's quantifies (SUD prevalence; life events as a recognised trigger) while this PR's carries the caveat (the episode-triggering half is unevidenced; the same prospective study found the reverse direction, with depressive symptoms preceding negative life events). So the count of PARTIAL items in this entry is now two, not the three the earlier record states. Also backfilled reference_title on the retained-from-#8556 items from their cache frontmatter, and repaired two structural artefacts of the textual merge: an evidence item attached to the wrong exposure, and a duplicate `- name: Substance Use` entry. Neither is a schema error and both validated cleanly, which is worth knowing for future concurrent tranches.

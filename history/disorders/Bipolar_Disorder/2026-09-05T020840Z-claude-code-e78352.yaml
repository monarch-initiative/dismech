  summary: 'Integrate assessed OpenScientist findings: calcium, hyperexcitability,
    AKAP11, circadian-dopamine'
  details: |
    Integration of the RETAINED and QUALIFIED claims from the existing codex
    assessment of the OpenScientist report for hypothesis
    canonical_polygenic_synaptic_circadian_dysregulation_model
    (kb/hypotheses/Bipolar_Disorder/canonical_polygenic_synaptic_circadian_dysregulation_model/openscientist.md,
    verdict PARTIALLY_SUPPORTED). No new assessment sidecar was written because
    openscientist-assessment-by-codex.yaml already exists; that file drove this
    integration.

    ADDED

    mechanistic_hypotheses (canonical model), two evidence items from
    PMID:34002096. The PMID was already in the file, but only as an ITIH3 locus
    table row; the claim RETAINED by the assessment as
    `pgc3-synaptic-calcium-enrichment` (synaptic-signaling enrichment, and
    enrichment among calcium-channel-blocker target genes) was not curated
    anywhere. The drug-target item records that the enrichment is shared with
    antipsychotic, antiepileptic and anesthetic targets, so it is not read as
    singling out L-type calcium channels.

    genetic#CACNA1C, two evidence items. PMID:25403839 (RETAINED,
    `cacna1c-risk-variant-function`) supplies the variant-to-function step in
    induced human neurons and fixes the direction of effect as gain of channel
    function. PMID:39370418 (QUALIFIED, `cacna1c-knockout-direction`) is graded
    directness INDIRECT with the direction mismatch stated explicitly in the
    explanation: the mouse is a Cav1.2 loss-of-function knockout while the human
    risk genotype raises expression and current, so it is gene-function evidence
    and not directionally convergent validation.

    genetic#AKAP11, new entry with three evidence items from PMID:35410376
    (QUALIFIED, `akap11-gsk3b-convergence`). The entry previously carried no
    rare-variant gene. The notes and the explanations keep both qualifications
    the assessment raised: the definitive gene-level result requires
    meta-analysis with schizophrenia SCHEMA data, and AKAP-11 to GSK3B is a
    reported protein-protein interaction rather than a demonstration that the
    truncating variants act through GSK3B. No gene_term was bound because
    AKAP11 is absent from cache/hgnc/terms.csv and the sweep forbids minting an
    uncached CURIE; this follows the existing uncached-gene pattern in the file
    (ODZ4).

    pathophysiology#Intracellular Calcium Dysregulation, new node
    (biological_scale CELLULAR) with four evidence items from PMID:10418700 and
    PMID:21167476 (QUALIFIED, `calcium-trait-chain`), plus a downstream edge to
    Mitochondrial Dysfunction. The entry had no calcium node at all despite
    calcium being the model's central pillar and CACNA1C its flagship gene. Both
    scope limits from the assessment are carried in the node description:
    peripheral blood cells rather than neurons, and no demonstrated coupling to
    mood state. The downstream edge is
    causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and its single evidence item
    (PMID:28093238) is graded evidence_source OTHER and directness INDIRECT,
    because that source is an explanatory model paper rather than a test of the
    proposed sequence.

    pathophysiology#Neuronal Hyperexcitability, new node (biological_scale
    CELLULAR) with two evidence items from PMID:26524527 (QUALIFIED,
    `ipsc-hyperexcitability`). Bound to CL:0001033 and to GO:0001508 /
    GO:0042391, all three already present in the repo caches and in the relevant
    enum membership caches. The responder-selective lithium rescue is curated as
    a treatment-response stratifier holding for the sampled lines, not as an
    established universal cellular mechanism.

    pathophysiology#Mitochondrial Dysfunction, two evidence items from
    PMID:26524527. This node previously had only a `supports: NO_EVIDENCE`
    review citation. The second item deliberately records a direction conflict
    rather than smoothing it over: the study found *enhanced* mitochondrial
    function in young patient-derived neurons, which does not match the node
    description's impaired-energy-metabolism framing and is consistent with the
    phasic model instead.

    pathophysiology#Circadian Rhythm Disruption, two evidence items from
    PMID:20591414 plus a new downstream edge to Monoamine Dysregulation
    (QUALIFIED, `clock-vta-causal-chain`). The entry previously had no edge into
    the monoamine node. The second node-level item quotes the mixed-state result
    from the same paper, so the edge cannot be read as a demonstration of
    episodic switching; the assessment's objection to the report's
    CLOCK-to-dopamine-to-mania causal-chain wording is preserved in the prose.

    treatments#Lithium, two evidence items (PMID:38395906 and PMID:16179524,
    QUALIFIED, `lithium-pi3k-interpretation`) plus two evidence items on the
    previously evidence-free Neuroplasticity Alterations target_mechanisms edge
    (PMID:41672966, QUALIFIED, `lithium-frontolimbic-preservation`). The
    ConLiGen explanation states precisely what the reported negative was (the
    ECM pathway, not a head-to-head rejection of GSK3B or inositol). The
    frontolimbic pair deliberately curates the review's own risk-of-bias
    sentence next to its headline result, so "preserves" is not asserted.

    treatments#Psychotherapy, expanded description, a new target_mechanisms edge
    to Circadian Rhythm Disruption, and three evidence items from PMID:16143731
    (QUALIFIED, `ipsrt-circadian-causality`). The preventive and causal wording
    the assessment objected to is not reproduced: the edge explanation states
    that IPSRT is multicomponent and that the social-rhythm analysis is
    mediational, and one evidence item records the trial's null result on time
    to stabilization.

    discussions#gap_bipolar_episodic_switching_trigger, new KNOWLEDGE_GAP with
    one proposed experiment. This is the structural home for the
    PARTIALLY_SUPPORTED verdict itself: the assessment's recurring finding is
    that no cited experiment establishes that the model's components converge in
    a chain producing episodic switching. Its rationale is built from the
    primary sources rather than the report's framing, including the null
    correlation between calcium measures and mood severity in PMID:10418700.
    supporting_outcome and refuting_outcome are written as lists.

    NOT INTEGRATED, and why

    Every REJECTED claim was left out. `largest-gwas` and
    `multi-ancestry-gwas-absence` are already corrected in the entry by the
    PMID:39843750 PGC4 citation. `calcium-channel-paradox`,
    `modern-dhp-trial-absence`, `psychotic-bdi-specificity` and
    `neuroimaging-risk-gene-specificity` are already curated as explicit
    qualifications in the mechanistic-hypothesis notes with their own evidence.
    `dopamine-transporter-trait` (PMID:36322065) was not added: the source
    reports a state-associated finding and the report's trait-level reading is
    an overreach. `fibroblast-genotype-attribution` was not added because the
    report assigned a genotype result to the wrong paper. `anatomy-ontology` was
    not acted on: UBERON:0001870 is frontal cortex rather than anterior
    cingulate cortex and UBERON:0002637 is a thalamic nucleus rather than
    ventral striatum, so no anatomical term was bound anywhere in this edit.

    `timeless-rora-update` (QUALIFIED) was already curated, with the
    single-study caveat, so nothing was added. `chronotherapy-prevention-absence`
    (NEEDS_VERIFICATION) is already covered by qualification 6 in the notes and
    was not promoted to a discussion. `biological-process-ontology` (RETAINED)
    was used only where an added node needed a process term. The report's
    proposed ANK3-190 palmitoylation edge was not added: no assessment claim
    covers it and no cited source in this report supports it. Status remains
    CANONICAL, which is what the report's own Candidate Status Change asked for.


  details: |
    Added a diagnosis section with an MDQ row. Panel LOINC:85102-2 bound as the measurement; total score LOINC:84773-1 carries a two-band screen at 7 or more items as stated in the Hirschfeld 2000 validation abstract (PMID:11058490, psychiatric outpatients). The notes say the band records only that item-count threshold and that further scoring conditions, if any, are not in the cited abstract. The general-population validation (PMID:12505821) is row evidence for setting-dependent accuracy. Diagnosis term NCIT:C15419 Disease Screening. Hirschfeld LOINC copyright notice verbatim in the row notes. No instrument items are quoted.

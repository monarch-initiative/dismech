  summary: 'Phenotypes: individual manic symptoms bound to HPO'
  details: |
    Added the manic symptoms as separate phenotypes: Decreased Need for Sleep (HP:5200276), Pressured Speech (HP:5200265), Racing Thoughts (HP:0033844), Distractibility (HP:0000736 Short attention span), Elevated or Expansive Mood (HP:0031844 Euphoria), Grandiosity (HP:5200270), Irritability (HP:0000737) and Risky Behavior (HP:0031472). Evidence is the StatPearls Mania chapter (PMID:29630220), whose abstract lists the defining characteristics and hallmarks of mania, and the StatPearls Bipolar Disorder chapter (PMID:32644424) for racing thoughts and irritability in mixed depressive episodes; both newly cached and tagged StatPearls in references. The existing Manic Episodes phenotype gained evidence that mania characterizes bipolar I disorder. The new phenotypes are not stratified by subtype and are not yet wired to a mechanism node. Validated with just validate-disorders (all snippets verified).

  summary: Add the patient iPSC-derived neuron model as an experimental model
  details: |
    Promotes the Mertens 2015 iPSC study (PMID:26524527) from a citation inside two pathophysiology nodes to a listed experimental model, which is decision 3 of issue 13600. The model is hippocampal dentate gyrus-like neurons from six patients with bipolar I disorder and four unaffected individuals, three of the patients clinical lithium responders and three not. It is linked to Neuronal Hyperexcitability as RECAPITULATES with fidelity MODERATE, carrying two readouts (hyperactive action-potential firing, and its reversal by lithium only in responders' neurons) and three typed divergences (POPULATION_MISMATCH for the six white male bipolar I donors, TEMPORAL_SCOPE because the phenotype reverses in older neurons, BOUNDARY_OMISSION for the single neuron type). A second link to Mitochondrial Dysfunction is MEASURES, with the membrane-potential readout recorded as INCREASED because the paper reports enhanced rather than impaired mitochondrial function. No pathophysiology node was added or changed and no new reference was fetched; PMID:26524527 was already cached and cited in the entry. Split out of the held draft PR 13603, which keeps the lithium-exposed progenitor model while the scope question in issue 13602 is open. Validation: just validate-disorders passed with all snippets verified; the model-link tests in tests/test_data.py passed.

  summary: 'Create: Congenital Thrombotic Thrombocytopenic Purpura'
  details: |
    De novo curation of congenital TTP (MONDO:0010122, ADAMTS13) as a Disease entry distinct from the existing Acquired_Thrombotic_Thrombocytopenic_Purpura entry, which names cTTP only as a differential diagnosis. Built from the UK national cohort, the international hereditary TTP registry and the phase 3 recombinant ADAMTS13 trial, then substantially expanded from an OpenScientist deep-research report. The report contributed the neonatal ductus-arteriosus shear mechanism, the founder origin of c.4143dupA, the multinational natural-history cohort, the Adamts13-knockout two-hit model and the pregnancy prophylaxis data; every claim was re-verified against the cached abstract. The report's reference validation was clean (27/27) but its term validation set needs_review and four of its bindings were substantively wrong and were not used: MONDO:0010134 for the disease (resolves to Pendred syndrome), CL:0002679 for hepatic stellate cell (natural helper lymphocyte), CHEBI:18420 for zinc (magnesium 2+) and NCIT:C171453 for plasma (Hospital Stay). No GeneReviews chapter exists for cTTP; three PubMed searches returned zero results. Two reference titles were corrected after the validator flagged mismatches against the cached records. Validated with just validate (68/68 snippets verified), check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

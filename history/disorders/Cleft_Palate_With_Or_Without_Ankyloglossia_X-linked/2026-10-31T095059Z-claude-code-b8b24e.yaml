  details: |
    New entry for X-linked cleft palate with or without ankyloglossia (CPX, MONDO:0010560), caused by TBX22 loss of function. Lump/split: curated as one Disease entry. Abruzzo-Erickson syndrome (MONDO:0010554) is recorded as a has_subtypes row because the cached ClinGen record (CGGV assertion c7700e51, Definitive, 2024) lumps it with CPX; a 2026 case series (PMID:41630180) proposes gain of function for its alleles, recorded as a KNOWLEDGE_GAP discussion. The separate Abruzzo-Erickson stub was left in place. Pathograph: TBX22 loss of function leads to delayed osteoblast maturation in the posterior palate, then reduced intramembranous ossification of the posterior hard palate, then submucous and overt cleft palate (Tbx22-null mouse, PMID:19648291); separate branches to abnormal tongue frenulum development (ankyloglossia) and a persistent oro-nasal membrane (choanal atresia). Submucous cleft palate has a sequela edge to velopharyngeal insufficiency and then hypernasal speech. Hypodontia, cleft lip and Pierre-Robin sequence are left unconnected because no mechanism is sourced. A HUMAN_MODEL_MISMATCH discussion records that heterozygous female mice are unaffected while about a third of human carrier females are affected. Gene-disease validity copied from the cached ClinGen CGGV record. Deep research: one OpenScientist report (research/Cleft_Palate_With_Or_Without_Ankyloglossia_X-linked-deep-research-openscientist.md). The recipe placed the report but exited with code 3 because term validation timed out resolving MeSH and MedGen xrefs on the EBI service; the reference and term validation sections were then added with just validate-research-reference and with the term validator skipping the xref-only prefixes (MeSH, MedGen, UMLS, GARD, DOID, Orphanet, OMIM, CT, HGNC). Reference validation: 19 of 19 resolved, 8 of 9 quotes matched (the miss, PMID:41520495, drops P values and is not cited here). Term validation flagged NCIT:C51756 and NCIT:C15415 as wrong-concept suggestions; neither was used. just preflight-dr PASS (TBX22 mentioned 70 times). No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Orphanet ORPHA:324601 was not cited because building it requires downloading the full Orphadata product set, which disk limits ruled out. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), entity-ref, causal-target, coarse, qualifier, enum, duplicate-key, block-scalar, logical-rule and whole-repo snippet gates passed; validate-disorders run before push.

  summary: 'Create: Chromophobe Renal Cell Carcinoma'
  details: |
    New Disease entry for chromophobe renal cell carcinoma (MONDO:0017885), the third most common RCC subtype and previously absent from the KB.

    Duplicate preflight: checked origin/main kb/ by MONDO ID, label and synonyms; searched all-state PRs and issues on monarch-initiative/dismech. No existing entry, PR or issue. Selected from dashboard/priority.json after filtering candidates already covered on current main (the dashboard snapshot is stale: its top-ranked candidates Wilms tumor, oligodendroglioma and thanatophoric dysplasia are all now curated).

    Deep research: claude_code provider (just research-disorder claude_code), 264s, 17 web searches, 19 turns, 37 citations, models claude-haiku-4-5 and claude-sonnet-5. Report at research/Chromophobe_Renal_Cell_Carcinoma-deep-research-claude_code.md. The run did not emit a reference_validation frontmatter block, so "just validate-research-reference" was run separately and appended a Reference Validation section: 30/30 references resolved, 0 unresolved, 0 unverifiable.

    Report errors caught and excluded during independent verification (a report's citations resolving is not the same as its bindings being correct):
    - PMID:5187849, cited as "PMID:5187849/PMC5187849" for an MT-ND1 recurrence-free-survival claim, is a 1968 paper titled "[Are sanitary tampons beneficial?]" - a PMC-ID/PMID conflation. Claim dropped entirely.
    - HP:0030057 was suggested for "Flank pain" but is "Autoimmune antibody positivity". Correct term HP:0030157 used.
    - HP:0031817 was suggested for "Abdominal mass" but is "Decreased circulating parathyroid hormone level". Correct term HP:0031500 used.
    - GO:0006977 was suggested for the p53 DNA-damage response but is obsolete. GO:0072331 used instead.
    - CL:1000497 was suggested for the intercalated cell of origin but is the broad "kidney cell". CL:1001432 (kidney collecting duct intercalated cell) used.
    Separately, PMID:8053493 was checked as a candidate for the classic CGH chromosome-loss paper and rejected (it is a soft-tissue-sarcoma paper); the correct paper is PMID:7519827.

    Content: 9 pathophysiology nodes forming a single connected pathograph from distal-nephron intercalated cell origin through whole-chromosome loss, TP53 inactivation, mTORC1 hyperactivation, TERT promoter structural rearrangement and the oxidative mitochondrial phenotype, to indolent tumor growth, sarcomatoid dedifferentiation and metastasis. Three module conformance declarations: evading_growth_suppressors#Tumor Suppressor Inactivation, sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation, and enabling_replicative_immortality#Telomere Maintenance Reactivation.

    Two deliberate non-conformances, recorded rather than left implicit. The entry does NOT conform to genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, because that node models chromosomal instability arising from defective repair with an accompanying elevated mutation rate, and chRCC has the aneuploidy without the mutator phenotype (~7 chromosome losses against ~31 exonic somatic mutations). It does NOT conform to deregulated_cellular_energetics#Aerobic Glycolysis, because chRCC retains an OXPHOS-dependent phenotype rather than a Warburg shift. Both are explained in node descriptions, and the first also in a KNOWLEDGE_GAP discussion.

    Three KNOWLEDGE_GAP discussions: the mechanism generating the recurrent whole-chromosome loss and how the tumor tolerates that aneuploidy; whether the hypodiploid model survives later evidence of frequent chromosomal gains; and whether somatic mtDNA mutations drive the oxidative phenotype or are passengers of the mitochondria-rich cell of origin.

    Two Flcn-knockout mouse models curated with modeled_mechanisms links into the pathograph (PMID:26083655, PMID:18182616), including a PARTIALLY_RECAPITULATES link whose limitations record that the knockout is targeted to the proximal tubule while human chRCC arises from the distal nephron, and that the model reproduces none of the defining sporadic genomics.

    GeneReviews baseline: no GeneReviews chapter exists for chRCC itself, which is a somatic tumor entity rather than a Mendelian disorder; a PubMed search returned only hereditary-syndrome chapters. The Birt-Hogg-Dube Syndrome chapter (PMID:20301695) was fetched, cited on the FLCN genetic entry, and tagged GeneReviews in the top-level references block. This is recorded in the entry notes.

    Datasets: 5 GEO series, each selected against a specific curated mechanism (chromosome-loss copy number, tetraploidization, array CGH profiling, chRCC-versus-oncocytoma expression, sarcomatoid chRCC) and manually relevance-triaged rather than taken from discovery ranking alone. All 5 verified with "just verify-datasets" (5/5 OK). Per the dataset SOP these carry no evidence block.

    Validation actually run and read: "just validate" passes (schema + terms + references); "just count-verified-snippets" reports 47/47 verified against cached references; "just validate-terms" passes; "just validate-disorders" (the batched check CI runs, --no-full-text) passes; "just check-title-snippets" reports no new title-quoting snippets; "just verify-datasets" reports 5/5 OK; pytest subsets of tests/test_data.py covering module conformance, foreign keys and model-readout targets pass (14278 selected tests). Compliance 80.1% global, 80.3% weighted.

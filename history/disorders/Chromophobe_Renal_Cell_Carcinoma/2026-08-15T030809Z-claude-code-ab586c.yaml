  details: |
    Addressed optional review suggestions from ai4c-reviewer on PR #8516. The review was an APPROVE with no blocking findings and five 🔵 optional suggestions; four were taken, one declined with reasoning.

    Taken:
    - Onset (suggestion 1). Added an OnsetDescriptor to the Renal Mass phenotype: onset_category ADULT, mean 59, range 27-82, with its own evidence item quoting the already-cached PMID:18813125. Note the reviewer proposed onset_category ADULT_ONSET, which is not in OnsetCategoryEnum; the correct value is ADULT.
    - chRCC-specific mTOR evidence (suggestion 2). Replaced the generic ASPEN snippet ("heterogeneity of the treatment effect was noted on the basis of histological subtypes") with the chromophobe-specific sentence ("one subtype (chromophobe) in which everolimus was associated with a longer median progression-free survival than that of sunitinib."), kept at PARTIAL because it remains a subgroup finding in a trial whose overall result favored sunitinib. Added a second SUPPORT item quoting the trial report's own mechanistic rationale (PI3K-mTOR activating mutations and preclinical rapamycin sensitivity). Both quotes were verified as exact substrings of references_cache/PMID_26794930.md before use.
    - Clinical trial (suggestion 2, second half). Added ASPEN as clinical_trials NCT01108445, fetched with just fetch-reference. Schema note: the clinical_trials example in CLAUDE.md uses free-text 'Phase III' / 'Completed', but the schema now enforces enums (PHASE_II / COMPLETED); the doc example is stale.
    - diagnosis section (suggestion 3). Added four Diagnosis entries moving diagnostic procedures out of histopathology/differential_diagnoses into the section consumers look in: kidney biopsy (NCIT:C51699), CD117/CK7 immunohistochemistry (NCIT:C23020), copy-number/cytogenetic testing for the characteristic chromosome losses (NCIT:C18280), and germline FLCN testing (NCIT:C15709). All four NCIT terms validated as reachable from the TreatmentTerm enum root. The histopathology CD117/CK7 finding is retained, since the immunoprofile is both a morphologic finding and a diagnostic procedure.

    Declined:
    - Constitutional phenotypes (suggestion 4). Weight loss and fatigue remain omitted. They are non-specific to chRCC and no cached reference supports a chRCC-specific frequency band; the reviewer's own note agrees that omitting beats guessing. Adding them unevidenced would trade a real gap for a fabricated one.
    - stages (suggestion 5). Not added. AJCC/TNM staging is generic to RCC rather than chRCC-specific, and the quotable content in PMID:18813125 is a pT distribution across one series, not a staging definition. The chRCC-specific prognostic drivers the suggestion points at (sarcomatoid change, necrosis, stage) are already curated in pathophysiology and histopathology.

    Validation after changes, all run to completion and read: just validate passes; just count-verified-snippets reports 53/53 verified (up from 47/47); just validate-disorders (the batched --no-full-text check CI runs) passes 53/53 - confirming the two new full-text-sourced ASPEN quotes match the cached record and are not affected by the no-full-text flag, which suppresses downloading rather than matching; just check-title-snippets reports no new title-quoting snippets; pytest subsets covering module conformance, foreign keys, model-readout targets, clinical trials and diagnosis pass (14361 selected tests). Compliance rose from 80.1% to 80.7% global, 80.8% weighted.

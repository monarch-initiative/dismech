  summary: Add guideline-derived multidisciplinary care to EB
  details: |
    Mined the EB clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2) into the entry. Added 2 phenotypes (Esophageal Stricture HP:0002043; Pseudosyndactyly/mitten deformity HP:0010554) and 6 multidisciplinary care treatments (esophageal dilatation NCIT:C70908; hand surgery plus therapy MAXO:0000004; palliative care MAXO:0000021; podiatric foot care MAXO:0000950; neonatal EB care MAXO:0000950; orthodontic treatment NCIT:C64248). Every evidence item is snippet-verified against the DEBRA International CPG abstracts fetched via just fetch-reference. Deliberately EXCLUDED PMID:41678328 and PMID:31646663, which describe autoimmune blistering disease / EB acquisita (a distinct entity from this Mendelian EB entry) and matched only via the 'epidermolysis bullosa acquisita' MeSH string. Schema and term validation pass; snippets manually confirmed as exact substrings (validate-references reports 0 checks, a known false-pass).

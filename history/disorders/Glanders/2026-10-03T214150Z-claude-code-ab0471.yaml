  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for Burkholderia mallei. Hosts: Equus caballus (NCBITaxon:9796), Equus asinus (NCBITaxon:9793) and the mule, bound to the interspecific hybrid taxon NCBITaxon:1050200 because NCBITaxon has no separate mule species term, all as natural reservoir hosts; plus Homo sapiens (NCBITaxon:9606) as accidental host infected occupationally. No vectors: transmission is by contact. Two stages: carriage and disease in the equid reservoir (PMID:22630609, which states horses, donkeys and mules are the only known natural reservoir, and that pre-symptomatic carriers spread it) and human infection after contact with infected equids (PMID:34838612, graded HUMAN_CLINICAL with quote_role BACKGROUND because the sentence is the human-risk framing in the introduction of a veterinary immunology study of equids). Block evidence PMID:22630609 frames glanders as a zoonosis of solipeds. Two new references fetched: PMID:22630609 and PMID:34838612. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

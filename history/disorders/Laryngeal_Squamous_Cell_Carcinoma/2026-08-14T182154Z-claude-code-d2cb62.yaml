  summary: 'Fix: Rebind Alcohol Consumption exposure to ECTO:0001082'
  details: |
    Rebound the 'Alcohol Consumption' environmental entry from ECTO:9000027 (exposure to
    ethanol) to ECTO:0001082 (exposure to alcohol consumption), resolving one arm of the
    duplicate-name CURIE conflict in issue #8469.

    ECTO splits both the smoking and the alcohol exposure pairs by anchor, not by
    specificity. Checked with 'runoak -i sqlite:obo:ecto ancestors -p i': ECTO:0001082 is_a
    ECTO:6000016 (exposure to personal behavior), while ECTO:9000027 is_a ECTO:9000026
    (exposure to alcohol) is_a ECTO:0000231 (exposure to chemical). Behaviour branch versus
    substance branch.

    This entry makes a risk-association claim only -- alcohol 'contributes to upper
    aerodigestive tract carcinogenesis and can act together with tobacco exposure' -- and
    describes no ethanol or acetaldehyde chemistry, unlike the sibling head/neck and
    esophageal entries. Under the naming convention adopted in #8448 and extended here, the
    entry's own name states drinking behaviour, so the behaviour term is correct and the
    name is left unchanged. Binding rationale recorded in the entry's notes slot,
    including why it differs from its siblings.

    No evidence items were added, removed, or re-quoted; this entry carries none at the
    exposure level.

  summary: Regrade the prophylaxis mechanism link to NO_EVIDENCE
  details: |
    The target_mechanisms link asserts that antibiotic prophylaxis INHIBITS transient bacteraemia - a pharmacological claim about what the drug does. The cited sentence from PMID:28213367 says postprocedural bacteraemia is not a good surrogate endpoint for IE. The curator had graded it PARTIAL; after #7439 retired PARTIAL the item read SUPPORT, so the entry asserted that a sentence criticising the surrogate supported the mechanism resting on it.
    First regraded to REFUTE. The review on PR #10136 argued that reads one step past the sentence, and it is right: what the sentence denies is that lowering bacteraemia predicts lower IE, which is the bacteraemia-to-endocarditis step rather than the drug-to-bacteraemia one. Using bacteraemia as a surrogate at all presumes the drug lowers it, so the quote does not contradict this link - it simply does not bear on it. Regraded to NO_EVIDENCE.
    The same sentence remains SUPPORT in the discussion block below, where the claim is that the controversy exists: one quote bearing on two different claims, which is why check-snippet-grading gates evidence_source but not supports. HPOA export checked at both gradings - a treatment link rather than a phenotype, so no NOT row either way and the entry's row count is unchanged at 9.

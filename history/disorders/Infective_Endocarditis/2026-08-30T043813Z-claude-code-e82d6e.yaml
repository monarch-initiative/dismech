  summary: Regrade the prophylaxis mechanism link to REFUTE
  details: |
    The target_mechanisms link asserts that antibiotic prophylaxis INHIBITS transient bacteraemia, i.e. that suppressing procedural bacteraemia is how the practice works. The cited sentence from PMID:28213367 says postprocedural bacteraemia is not a good surrogate endpoint for IE, which cuts against that mechanism; the curator's explanation said so, and graded it PARTIAL. After #7439 retired PARTIAL the item read SUPPORT, so the KB asserted that a sentence undermining the surrogate endpoint supported the mechanism resting on it. Regraded to REFUTE, scoped to this link only. The same sentence remains SUPPORT in the discussion block below, where the claim is that the controversy exists rather than that the mechanism holds -- one quote bearing on two different claims, which is what supports being claim-relative means, and why check-snippet-grading gates evidence_source but not supports. Checked the HPOA export: this is a treatment link rather than a phenotype, so no NOT row is produced and the entry's row count is unchanged at 9.

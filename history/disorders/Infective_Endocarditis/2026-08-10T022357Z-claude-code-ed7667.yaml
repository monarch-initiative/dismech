  summary: 'Review response and provenance retraction: Infective Endocarditis'
  details: |
    Review-response session on PR 8278. Corrects a CRITICAL finding and addresses
    five IMPORTANT findings.

    RETRACTION. The creation record for this entry, timestamped 2026-08-10T014831Z,
    states that two cached abstracts end mid-word because they are truncated at those
    points, and that the Duke-ISCVID cached record contains no abstract body. All
    three statements are false and are retracted here. The cache files committed in
    this pull request are complete. The apparent truncation was an artefact of a
    fixed-width character window used by the extraction script during curation, and I
    mistook my own cut for the source's. History records are append-only, so the
    earlier record is left in place and this record supersedes its provenance claims
    rather than editing them away.

    Snippets re-quoted at sentence boundaries as a result. The partial oral therapy
    trial snippet now carries the full eligibility criteria including the four named
    organism groups. The ICE-PCS snippet now includes the clause about the classic
    hallmarks being absent. The Duke-ISCVID item, which had been a title-only snippet
    with no evidentiary content, now quotes the sentence enumerating the actual
    changes in the 2023 revision.

    Added: infectious_agent with Staphylococcus aureus, Streptococcus sanguinis, and
    Enterococcus faecalis bound to NCBITaxon; has_subtypes for left-sided native
    valve, right-sided, and prosthetic valve disease; frequency bands and evidence
    for heart failure, stroke, and a new intracardiac abscess phenotype, all from the
    ICE-PCS cohort; and surgical evidence from the AATS guidelines on the valve
    surgery treatment.

    The conformance of septic embolization to the thrombogenesis occlusion node is
    now justified in the node description rather than asserted. The module excludes
    nonthrombotic emboli, and the argument made is that a septic vegetation is not a
    nonthrombotic embolus; it is a fibrin-platelet thrombus with organisms in it,
    occluding by the same mechanism the module models.

    One fetched reference, PMID 35139280, is deliberately not cited and the reason is
    recorded in the entry notes. It is a research letter whose cached record has no
    abstract body, so citing it would require exactly the title-only snippet this
    session removed elsewhere.

    Validation: schema, ontology terms, and references all pass. Snippets checked 22
    of 22 verified against cached references, up from 15 of 15.

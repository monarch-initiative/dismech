  summary: 'Create: Infective Endocarditis'
  details: |
    Created the Infective Endocarditis entry from a claude_code deep-research report
    treated as leads only.

    Mechanism model. Eight pathophysiology nodes running from endothelial injury and
    sterile thrombus formation, through transient bacteraemia and microbial adherence,
    to vegetation maturation with biofilm-like protection, and thence in parallel to
    local valvular destruction, systemic embolization, and innate immune activation,
    converging on heart failure and haemodynamic decompensation.

    Three nodes conform to the thrombogenesis module, at platelet adhesion, at
    fibrin-platelet thrombus formation, and at thrombotic occlusion with ischaemic
    injury. That an infectious disease conforms to a thrombosis module is the
    substantive claim of the entry rather than a convenience, because the sterile
    thrombus is a precondition for the infection rather than a consequence of it. It
    is also what explains why bacteraemia is common and this disease is rare.

    Deep-research reference errors caught. Three PMIDs in the report were fetched and
    found unrelated to this disease. PMID 25360655 is cited in the report as a study
    of genetic variants in inflammatory response genes in infective endocarditis, and
    the paper with that identifier is about animal models with coronary
    microcirculation. PMID 21969557 is a paper on 9-cis-epoxycarotenoid dioxygenase
    in Arabidopsis thaliana seeds. PMID 19717591 concerns FlhF GTPase activity in
    flagellar gene regulation. None is cited in the entry. Five replacement
    references were found by direct PubMed search and verified, including the POET
    partial oral therapy trial and the International Collaboration on
    Endocarditis-Prospective Cohort Study.

    Curated negative. Antibiotic prophylaxis before dental procedures is curated
    together with the systematic review that undermines it, including the finding
    that post-procedural bacteraemia is not a valid surrogate endpoint for the
    disease. The practice is recorded rather than omitted precisely so the
    contradicting evidence has something to attach to, and a CONTROVERSY discussion
    sets out why the question is unlikely to be resolved.

    Quotation caveats stated rather than concealed. Two snippets end mid-word because
    the cached abstracts are truncated at those points, and one snippet is an article
    title because the cached record for that reference contains no abstract body.
    Each is noted in its own explanation.

    Absent bindings. No ECTO terms are bound for injection drug use or intravascular
    catheters as exposures, because the hierarchy has no term expressing either as a
    route of microbial entry.

    Validation: schema, ontology terms, and references all pass. Snippets checked 15
    of 15 verified against cached references. Module conformance foreign keys pass.

  details: |
    Review round on PR #9720. The review requested changes not on the curation but on merge damage: the original commit 6630890c4 was clean, and the subsequent main merge 1033eca94 stacked this branch's environmental block on top of a competing weekly-compliance pass that main had already received for the same entry.

    The damage, as the review documented it and as reproduced here before fixing: duplicate evidence keys in environmental[0] and environmental[1], a duplicate notes key in environmental[0], and an entire PMID:9279330 evidence item absorbed into the text of a notes folded scalar, where it had ceased to be structured data. Because PyYAML keeps the last duplicate key, this PR's own PMID:26700022 and ICE-PCS items were being silently discarded - every renderer, test and export saw only main's version - which is also why count-verified-snippets kept reporting a clean pass over content it never read.

    Rebuilt rather than patched. The branch had also gone into conflict with current main, so the file was reset to main's version, which is known good and already contains the competing pass, and this PR's unique contributions were then re-applied from the clean commit 6630890c4. Reconciled per CLAUDE.md by merging blocks, not deleting them:

    environmental[0].evidence is now one block of five items - PMID:26700022 and PMID:19273776 from this branch, PMID:41030729 x2 and PMID:35589166 from main.

    environmental[0].influences_mechanisms[0].evidence holds PMID:9279330, recovered out of the notes scalar and restored as structured evidence, alongside this branch's PMID:26700022.

    environmental[0].notes keeps main's version. It says what this branch's version said and additionally records that the ECTO:6000007 binding arrived via the #8430 sweep, which is the better survivor, exactly as the review advised.

    environmental[1].evidence is now one block of three items - PMID:31941729 from main plus the two ICE-PCS items from this branch. Keeping the PMID:31941729 quote on both the entry and the mechanism link is deliberate; those are different claims.

    The four previously uncited pathophysiology nodes were re-cited: Endothelial injury and sterile thrombus formation and Innate immune activation and systemic inflammatory response from PMID:40422904, and Local valvular and perivalvular destruction and Systemic embolization of vegetation fragments from PMID:19273776.

    Non-blocking points taken. The PMID:19273776 item on environmental[0] carried the retired supports value PARTIAL, removed by issue #7439 after this branch was cut; it is now SUPPORT with the 10% qualification in the explanation. The Local valvular and perivalvular destruction explanation now states that the cohort substantiates only the perivalvular-extension limb and that the leaflet-perforation, chordal-rupture and conduction claims remain uncited. The chronic-intravenous-access explanation now records the cohort skew, and is careful about what the skew is: 61% of the patients with chronic intravenous access were from North America, not 61% of enrolments, which a first draft of that sentence got wrong. The evidence_source: OTHER grade on the two PMID:40422904 items was kept; the review's own view is that OTHER is right and the four pre-existing HUMAN_CLINICAL items citing the same narrative review are the ones that are off, and changing those is outside this PR.

    Verified after rebuilding: check-duplicate-keys clean, validate clean, 36/36 snippets verified, validate-terms, check-entity-refs and check-folded-hyphens all pass. Branch is out of conflict.

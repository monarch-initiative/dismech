  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block with four entries: haematogenous seeding of the endocardium during bacteraemia (the route every portal below feeds), and the three portals the literature names - the oral/dental route, injection drug use, and healthcare-associated intravascular access and cardiac devices. The first block states explicitly that infective endocarditis is not transmitted between people but acquired from organisms already in the bloodstream, which keeps the section consistent with the entry's thrombus-first model. Evidence: PMID:40422904 (bacteraemia as the origin of IE), PMID:28213367 and PMID:24247105 (dental bacteraemia and the contested prophylaxis argument, with the shift of emphasis toward healthcare-associated acquisition), PMID:9279330 and PMID:35589166 (injection drug use), PMID:19273776 (ICE-PCS cohort; healthcare exposure in a quarter of patients, chronic intravenous access as common as injection drug use). The four snippets reused from the environmental section keep their existing HUMAN_CLINICAL grading. All three infectious agents were already bound. Validated with just validate, just count-verified-snippets (43/43 verified), and the batched just validate-disorders sweep.

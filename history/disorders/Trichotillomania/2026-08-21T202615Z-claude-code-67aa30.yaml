  summary: 'Post-approval: four optional items, all verified as real'
  details: |
    PR #9190 was APPROVED on ai4c-agent's commit 81cad0095, which I fast-forwarded to rather than pushing over. That commit deleted a downstream edge I had written whose own description denied what the edge asserts - 'not implying that bezoar formation causes the alopecia' hung on a DIRECT causal edge. The bot's reasoning is correct and I should have caught it: a CausalEdge is a causal assertion regardless of the prose attached, and the disclaimer does not travel into the pathograph render or the KGX export. The common cause was already modeled via the shared parent.

    Four of the remaining optional items were verified and are real:

    HP:0011856 Pica sits exactly one hop below HP:0100738 Abnormal eating behavior, which is what trichophagia was bound to, and hair-eating is a form of pica. Rebound. Notably my own earlier synonym-aware search for 'pica' returned CL epicardium terms - a substring artifact that hid the real match. That is a third distinct way an ontology search has misled me this session, after l~ label-only matching and an obsolete term.

    PMID:39974061 is a medRxiv PREPRINT, not a peer-reviewed article - journal: medRxiv, publication type Preprint, page footer 'which was not certified by peer review'. Three evidence items in the genetic section rest on it. Disclosed in notes: it is cited because it is the only genome-wide analysis of this disorder that exists, and its findings are reported as what that analysis found rather than as settled.

    measure_type POINT_PREVALENCE over-specified a random-effects pool over 30 studies of non-uniform design. Changed to UNKNOWN with the reasoning stated in the record's notes.

    The SLITRK1 evidence gap is now closed from a reference this PR already commits: 'Candidate gene studies in humans have described rare coding variants in SLITRK1'. Curated as SUPPORT with an explanation that is careful about what it is - secondary attestation from a source the entry can read, since the primary report caches with no retrievable content, not independent confirmation.

    Validation: 27/27 snippets verified, terms clean, and the duplicate-key, folded-hyphen, snippet-length, title-snippet and cache-order gates all clean. No cache churn - HP:0011856 was already present.

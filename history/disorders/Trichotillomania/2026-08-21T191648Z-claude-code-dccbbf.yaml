  summary: 'Review round 1: a false negative about HPO, and four content gaps'
  details: |
    First review round on PR #9190. One CRITICAL and four IMPORTANT findings, all verified before acting and all correct.

    CRITICAL - I asserted a false negative about an ontology and called it verified. The entry claimed HPO has no term for hair pulling and bound the central phenotype to HP:0000722 Compulsive behaviors. HP:0012167 Hair-pulling exists, carries 'Trichotillomania' as an EXACT synonym, and shares xrefs SCTID:17155009 / UMLS:C0040953 with MONDO:0013189 - the same concept.

    The method error is worth generalizing: I searched 'l~trichotillomania' and 'l~hair pulling'. The l~ operator matches LABELS ONLY. HPO's label is the hyphenated 'Hair-pulling', so the unhyphenated query missed it, and 'Trichotillomania' is a synonym rather than a label so that query could not reach it. 't~trichotillomania' returns it immediately. A negative l~ result is not evidence of absence, and I recorded one as if it were.

    The binding was not merely too broad but wrong in a specific way: HP:0000722 carries 'OCD' and 'Obsessive-compulsive disorder' as EXACT synonyms, so it asserted precisely the identification this entry's own differential_diagnoses section argues against. HPO places HP:0012167 under Self-injurious behavior, not compulsive behaviour. Rebound the phenotype and the clinical trial target_phenotypes, and replaced the false notes paragraph with the correction and the method lesson.

    IMPORTANT items, all addressed:
    - HP:0000708 Atypical behavior was a near-maximally generic false match. Unbound rather than replaced: the snippet supports co-occurrence in general and names no specific disorder, so binding Depression or Anxiety would assert more than the source does. Functional impairment split off.
    - Added prevalence: TTM 1.14% (95% CI 0.66-1.96%) across 30 studies and 38,526 participants, recorded alongside any hair-pulling behaviour at 8.84% because the eightfold gap is what the diagnostic threshold does.
    - Added the trichophagia/trichobezoar/Rapunzel arm as a second branch off the behavioural node, with surgical treatment targeting it. This is the disorder's principal source of serious morbidity and the one arm whose definitive treatment is surgical; omitting it left the entry describing a cosmetic problem.
    - Genetics rewritten. MONDO asserts RO:0004003 to SLITRK1; recorded but NOT endorsed, since the primary report caches with no retrievable content and the 2025 GWAS found no genome-wide significant common variant. Added the polygenic and CNV findings (NRXN1, CSMD1, 15q11.2 deletions), which is the shape the genetics actually has.

    Also checked with synonym-aware search that HPO genuinely lacks terms for trichophagia and trichobezoar; trichophagia bound to the broad HP:0100738, the bezoar carried in pathophysiology.

    Validation: 26/26 snippets verified (up from 17), terms clean, all six offline gates clean, pathograph 5 nodes / 5 edges / 1 component.

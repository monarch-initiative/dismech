  summary: 'Create: Trichotillomania'
  details: |
    New entry for trichotillomania (hair-pulling disorder, MONDO:0013189), a body-focused repetitive behaviour in the DSM-5 obsessive-compulsive and related disorders chapter.

    Deep research: claude_code provider, 19/19 references resolved, confabulation_rate 0.0, no unresolved identifiers. 13 of 19 weighed on topic with none flagged off topic, though six were undecided (no abstract). The reference set actually curated was assembled independently by direct PubMed search.

    GeneReviews baseline: checked and absent. 'trichotillomania GeneReviews[All Fields]' returns zero results.

    Mechanism curated as unsettled, following the sources: the cited narrative review states the pathophysiology is poorly understood and likely multifactorial. What is supported is a corticostriatal locus converging from two directions - two independent knockout mice (Sapap3, Slitrk5) whose compulsive grooming removes hair, and an adult randomised trial of a glutamate modulator.

    The strongest single piece of evidence is the SAPAP3 striatal rescue: lentiviral re-expression in striatum reverses both synaptic and behavioural defects, which localises causation rather than leaving it correlational.

    Three deliberate restraints on what was NOT claimed:
    - Both mouse models are presented by their authors as OCD models. Curated as PARTIALLY_RECAPITULATES with explicit limitations noting that rodent overgrooming is species-typical behaviour performed to excess whereas human hair pulling is not, and that neither gene is established in human trichotillomania. A KNOWLEDGE_GAP asks whether they model the disorder or only a shared circuit.
    - PMID:28085938 (rare SLITRK5 variants) was fetched, read, and deliberately not cited. It is an OCD study whose own result is mixed - rare variant prevalence did not differ from controls, only the in vitro assay separated groups.
    - Two references cache with content_type 'unavailable' (PMID:17003809 SLITRK1 in trichotillomania, PMID:35964308 NAC across BFRBs). Nothing is quoted from either; the SLITRK1 finding is named as unavailable rather than cited on its title.

    Curated the N-acetylcysteine disagreement rather than only the positive trial: the adult trial (56% vs 16% much/very much improved) is SUPPORT, the paediatric trial (no difference on any measure) is REFUTE, and a KNOWLEDGE_GAP asks whether that reflects an age-dependent mechanism or an underpowered add-on design in 39 participants.

    HPO has no term for hair pulling; verified by search on both 'trichotillomania' and 'hair pulling'. Behavioural phenotype bound to HP:0000722 Compulsive behaviors with a specific preferred_term; resulting alopecia bound separately to HP:0001596.

    Validation: just validate passed with 17/17 snippets verified, just validate-terms passed, and check-duplicate-keys, folded-hyphen, snippet-length, environmental-evidence, title-snippet and cache-order gates all clean.

  summary: 'Create: SLC5A6-Related Multivitamin Transporter Deficiency'
  details: |
    New gene-level entry lumping the two MONDO SLC5A6 diseases as subtypes: NERIB (MONDO:0033546, OMIM:618973, infantile-onset multisystem SMVT deficiency) and COMNB (MONDO:0859255, OMIM:619903, childhood-onset biotin-responsive peripheral motor neuropathy), plus the proposed intermediate SRDDBC form (no MONDO term). There is no umbrella MONDO class, so disease_term is omitted and both MONDO terms are recorded as skos:narrowMatch mappings, following the WAPL and TRIO gene-level entries. The lump rests on PMID:38816490 (phenotype range from multisystem metabolic disorder to childhood-onset peripheral motor neuropathy) and PMID:38012394 (same gene and same triple-vitamin treatment for both, with an intermediate family). Both stubs (Peripheral_Motor_Neuropathy_Childhood-onset_Biotin-responsive and Neurodegeneration_Infantile-onset_Biotin-responsive) are deleted. Deep research: the first OpenScientist run, requested under the earlier slug, timed out after 3600 s and was cancelled server-side. It was rerun under this entry's slug with a 7200 s timeout and produced research/SLC5A6-Related_Multivitamin_Transporter_Deficiency-deep-research-openscientist.md, which is committed with its sidecar and artifacts; no other provider was used. Its reference validation resolved 18/18 references (0 off topic) and flagged one quote ('mimicking biotinidase deficiency') attributed to PMID:27904971; that phrase is the title of PMID:31392107, which is what the entry cites for it. Its term validation flags are column labels ('Clinical sign', 'Physical') rather than wrong bindings, and its use of HP:0003355 (Aminoaciduria) for organic aciduria was not carried into the entry. just preflight-dr returned PASS against MONDO:0033546 and WARN against MONDO:0859255, the WARN only because the report cites OMIM 618973 and the gene record 604024 rather than 619903; SLC5A6 is the only gene it discusses. Report citations not used: PMID:19056639, 21148397, 27492331, 34077272 (intestinal biotin uptake physiology and alcohol effects), 31369292 (intestinal-specific Slc5a6 deletion causing colitis in adult mice, not part of the human phenotype), 35899258 (evolution of the SLC5A5 family). Most of the entry was curated from primary literature found by PubMed search and the claim-issue bot comment leads: PMID:35013551 (defining COMNB cohort, full text), PMID:38816490, PMID:38012394, PMID:38348452, PMID:40396389, PMID:27904971, PMID:31754459, PMID:31392107, PMID:35217562, PMID:37391029, PMID:37409333, PMID:38407570, PMID:40272030, PMID:39898461, PMID:38036278 (B cell maturation), PMID:42228401 (cardiac Slc5a6 knockout mouse and DCM families), PMID:23104561 and PMID:29669219 (intestinal knockout mouse and vitamin rescue), PMID:25809983 (blood-brain barrier transport), PMID:42364996 (SMVT cryo-EM structure). Not cited: PMID:42507522 (SLC5A6 neuropathy, 18-month follow-up) cached with no abstract text on two fetches; PMID:39234898, PMID:41122322 and PMID:25971966 were fetched but not needed for any claim. A REFUTE item records normal fibroblast pyruvate carboxylase activity in a COMNB patient, and a REFUTE item records the inconsistent treatment response in that cohort. Validation: just validate, validate-terms, count-verified-snippets (115/115), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, check-retired-support-prose, check-granularity and check-genereviews --online (NO_CHAPTER) all pass; validate-disorders passes with 115 snippets and 115 titles checked and 0 issues.

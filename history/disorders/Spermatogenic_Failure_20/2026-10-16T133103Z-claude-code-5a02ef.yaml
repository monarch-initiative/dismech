  details: |
    New entry for SPGF20 (MONDO:0054724, CFAP44). Deep research run with the claude_code provider (research/Spermatogenic_Failure_20-deep-research-claude_code.md); just preflight-dr returned WARN because the paralog CFAP43 is mentioned, which is expected, and the report was used only for leads. Primary sources fetched with just fetch-reference: Tang 2017, Coutton 2018, Sha 2018/2019, Wu 2019, the 2026 deep-intronic CFAP44 family, the ciliate Fap43/Fap44 and T/TH structural papers, Ferreux 2021 ICSI series and the Muronova 2025 mouse ICSI study. ClinGen has no CFAP44 gene-disease validity curation in the 2026-10-14 export, so gene_disease_validity is left absent. Judgement calls: dynein complex binding (GO:0070840) bound as the molecular function, inferred from the ciliate T/TH complex; a peptidase activity reported for a Cfap44 splice fragment in transfected cells (PMID:28887034) was not modelled; no respiratory phenotype recorded because none has been reported for CFAP44, with a CANONICAL sperm-restricted hypothesis carrying a REFUTE item from the ciliate beating defect; the Cfap44 knockout mouse is PARTIALLY_RECAPITULATES for MMAF with a SPECIES_MISMATCH divergence because its flagellar malformation is subtler than in patients. No GeneReviews chapter. Validated with just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-causal-targets, check-duplicate-keys, snippet/title gates, gene-activity grounding and validate-disorders.

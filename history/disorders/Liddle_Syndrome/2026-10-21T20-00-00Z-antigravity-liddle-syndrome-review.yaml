  summary: >-
    Add molecular function annotation, genetic testing diagnosis, differential
    diagnoses, and treatment therapeutic modalities to Liddle Syndrome.
  details: >-
    Added GO:0005272 (sodium channel activity) molecular function annotation to
    ENaC gain of function in distal nephron and aligned the Renal potassium
    wasting to Metabolic alkalosis causal edge description with PMID:29534496;
    added molecular genetic testing of SCNN1A, SCNN1B, and SCNN1G (NCIT:C15709)
    to diagnosis with evidence from PMID:29534496 and PMID:42426704; added
    differential_diagnoses for Primary aldosteronism (MONDO:0001422), Apparent
    mineralocorticoid excess (MONDO:0009025), and Glucocorticoid-remediable
    aldosteronism (MONDO:0007080) with evidence from PMID:29534496 and
    PMID:42426704; and added therapeutic_modality annotations to ENaC blockers,
    Low-sodium diet, and Potassium supplementation.

  summary: 'Create: Acute Erythroid Leukemia'
  details: |
    Created a new dismech disorder entry for Acute Erythroid Leukemia (AEL, MONDO:0017858), resolving issue #9552. Curated via primary-literature research (PubMed E-utilities searches plus a falcon deep-research report, research/Acute_Erythroid_Leukemia-deep-research-falcon.md; just preflight-dr returned SKIP since MONDO records no causal gene for this somatic-cancer entity, manually resolved via MONDO synonym/gene cross-check - top genes in the report, TP53/JAK2/EPOR, matched the curated pathophysiology, no NEC signal found). Modeled the current WHO-HAEM5/ICC classification narrowly - biallelic TP53-defined pure erythroid leukemia - while recording the FAB/WHO 2001-2016 erythroid-myeloid (M6a) reclassification history in the definitions block and the Iacobucci et al. genomic-vs-morphologic classification controversy as an explicit CONTROVERSY discussion, so no single classification vintage is presented as settled. Pathophysiology chain: Biallelic TP53 Inactivation (conforms_to evading_growth_suppressors#Tumor Suppressor Inactivation) -> Loss of p53-Dependent Checkpoint and Apoptotic Control (conforms_to evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control) -> Chromothripsis and Complex or Monosomal Karyotype (conforms_to genome_instability_mutation#Mutator Phenotype and Chromosomal Instability) -> EPOR/JAK2/STAT5 Signaling Amplification -> Erythroid Maturation Arrest at the Proerythroblast Stage (GATA1-complex dysregulation, generalizing beyond the NFIA-ETO2 mouse model) -> Proerythroblast Accumulation and Marrow Replacement -> Suppression of Normal Hematopoiesis -> cytopenia phenotypes. Added the three required differential diagnoses (megaloblastic anemia erythroid hyperplasia, congenital dyserythropoietic anemia, MDS with erythroid predominance), five treatments (HMA plus venetoclax, intensive chemotherapy, allogeneic HCT, investigational ruxolitinib for EPOR/JAK2-amplified disease, supportive care), and a GATA1 genetic entry per the issue's curation notes. Validation performed and observed: just validate (schema/terms/references all passed, 61/61 snippets), just validate-terms (passed), just count-verified-snippets (61/61 verified), just validate-disorders (batched pre-PR sweep, all passed), just check-duplicate-keys (clean, no duplicates), and tests/test_data.py filtered on conforms_to_module/Acute_Erythroid/unique_name (2484 passed, 0 failed).

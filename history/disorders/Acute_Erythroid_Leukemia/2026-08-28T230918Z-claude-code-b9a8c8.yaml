  summary: 'Detailed evidence review: AEL evidence and reference audit'
  details: |
    Full per-item evidence review of kb/disorders/Acute_Erythroid_Leukemia.yaml.

    Scope: 93 evidence snippets checked across 13 distinct references. Every cached
    reference body was read in full (PMID:35732831 WHO-HAEM5, PMID:36323674 Mayo
    41-case pure erythroid leukemia series, PMID:30926971 Iacobucci genomic
    subtyping, PMID:38892446 AEL review, PMID:35839275 EPOR/JAK2, PMID:36735909
    NFIA-ETO2 mouse model, PMID:35636055, PMID:37246017, PMID:35015684 BCOR,
    PMID:19094231, PMID:32702750, DOI:10.1097/hs9.0000000000000558,
    clinicaltrials:NCT02861651). Each snippet was checked for exact-substring match,
    semantic support for the claim it sits under, correct supports grading, correct
    evidence_source classification of the cited study, and Named Entity Confusion
    (paper genuinely about AEL / pure erythroid leukemia, and the gene, drug or
    subtype in the quote matching the claim's entity).

    Verified without change: the WHO-HAEM5 quotes (erythroid predominance usually
    >=80% of marrow elements of which >=30% are proerythroblasts, the central role
    of biallelic TP53, and AEL superseding AML-MR) all sit in the source's AEL
    paragraph and match the claims they support; the Mayo series cohort numbers
    (100% biallelic TP53 with the allelic-pattern breakdown, complex karyotype in
    all cases and monosomal in 90%, CBC fractions of 100% anemia / 98%
    thrombocytopenia / 63% neutropenia, the treatment breakdown, and the 1.8-month
    median survival) match the phenotype frequency bands and treatment claims they
    are attached to; the NFIA-ETO2 mouse quotes are correctly graded MODEL_ORGANISM
    and correctly separate the TP53-mutant survival and self-renewal contribution
    from the fusion's differentiation-arrest contribution; the EPOR/JAK2
    amplification quotes match the subgroup and prognosis claims; the BCOR mechanism
    quotes are correctly IN_VITRO and their non-AEL-specificity is already disclosed
    in review_notes.

    Defects found and fixed. Four evidence items were corrected. No snippet text was
    rewritten and no fabricated or paraphrased quote was introduced; the one added
    quote is an exact sentence from a reference already cited in this file.

    1. TET2 gene entry. The PMID:38892446 quote "DNA methylation plays an essential
    role in erythroid malignancies, and it is regulated by several factors,
    including TET2 and DNMT3A/B" was graded HUMAN_CLINICAL. That sentence is the
    review's general statement of regulatory biology, citing other work; it reports
    no human clinical result. Corrected to OTHER, with the reason stated in the
    explanation.

    2. DNMT3A gene entry. The same sentence carried the same misgrade. Corrected
    identically, so both copies of the quote agree.

    3. Erythroid Maturation Arrest node and the GATA1 case_fractions entry. The
    PMID:38892446 quote "Recent AEL patient transcriptomic data show alterations of
    transcription or downstream signaling factors that mediate GATA1 activity in
    more than 25% of the cases" was graded OTHER in both places. It reports human
    patient cohort data carrying a case fraction, and every other cohort-fraction
    quote from this same review in this file is graded HUMAN_CLINICAL. Corrected to
    HUMAN_CLINICAL in both places.

    4. Suppression of Normal Hematopoiesis node. The PMID:30926971 quote "AEL is
    characterized by proliferation of erythroid and myeloid blast cells in the bone
    marrow and is associated with a poor prognosis" was graded SUPPORT. It is a
    background sentence that establishes the marrow-proliferative premise but not
    the suppression of normal trilineage output the node asserts, and it uses the
    older broad erythroid-plus-myeloid AEL concept rather than the pure-erythroid
    entity this file is scoped to. Marked SUPPORT with directness INDIRECT (the
    supports enum retired PARTIAL while this review was in flight) with both
    limitations stated in the explanation. The node was then given direct support by adding the
    already-cached Mayo series sentence documenting anemia in 100%,
    thrombocytopenia in 98% and neutropenia in 63% of evaluable patients in a
    modern, TP53-biallelic-restricted cohort.

    Left unchanged and recorded for a future reviewer: the parallel
    chromosomal-instability-to-maturation-arrest edge cites "These recent data
    further highlight the role of DNA methylation in AEL molecular biology", a broad
    summarising sentence. Its explanation already concedes it evidences one
    alternative cooperating-lesion class rather than the general path, so it was
    left rather than churned.

    Validation after edits: just validate passed. just count-verified-snippets
    reported 92/93 verified against cached references, with 1 skipped by prefix (the
    DOI reference, which sits in the validator's skip_prefixes list).
    just validate-disorders passed for this file. check-duplicate-keys,
    check-entity-refs, check-title-snippets, check-snippet-length,
    check-snippet-grading and check-folded-hyphens are all clean for this file.

  summary: 'Create: RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancy'
  details: |
    Created kb/disorders/RUNX1_Familial_Platelet_Disorder.yaml against MONDO:0100083, the RUNX1-specific entity. The claim issue was keyed on the gene-agnostic parent MONDO:0011071, whose stub also covers the ANKRD26 and ETV6 forms; that stub is deliberately left in place because a grouping for the three genes is out of scope here and was flagged to the user as an open decision. Seven pathophysiology nodes separate haploinsufficiency from RUNT-domain dominant-negative activity, then run through megakaryocyte maturation arrest, the dense granule and aggregation defect, thrombocytopenia, clonal hematopoiesis with second-hit acquisition, and myeloid transformation. Eight phenotypes, a genetic block, and two treatments. The gene therapy treatment carries a REFUTE evidence item: the rhesus macaque competitive repopulation model found no fitness advantage for corrected over mutant HSPCs, which argues against the approach, so it is recorded as evidence against rather than for. Deep research: falcon returned HTTP 403 for an invalid EDISON_API_KEY and the run fell back to claude_code via --fallback-provider, recorded in the report frontmatter. Report references resolved 17 of 17, confabulation_rate 0.0; its term section proposed the obsolete GO:0043433, which was not used. All HP and HGNC bindings were resolved independently from the committed caches and exact-match OLS queries. One duplicate evidence key arose during editing and was fixed by merging both blocks rather than dropping either, per the duplicate-key guidance. One snippet initially transliterated Greek letters and was corrected to the exact source text. Validated with just validate, 18 of 18 snippets verified exactly, plus check-duplicate-keys, check-entity-refs and validate-terms.

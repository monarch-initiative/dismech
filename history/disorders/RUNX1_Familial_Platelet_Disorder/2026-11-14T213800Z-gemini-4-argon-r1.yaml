  summary: Address Round 1 PR review comments on RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancy
  details: |
    Added PMID:36626254 evidence to the Worldwide prevalence entry for the >259 FPDMM families (164 unique RUNX1 variants) count, and expanded the United States prevalence notes to explain why the <=20,000 carrier estimate exceeds Orphadata's <1/1,000,000 diagnosed-case band. Replaced the unsourced 50-150 x 10^9/L platelet count range on Thrombocytopenia and Complete Blood Count and Peripheral Blood Smear with the verbatim mild-to-normal range quote from PMID:36626254, added the aspirin-like aggregometry and alpha/delta-granule deficit snippet to Platelet Aggregometry and Dense Granule Assessment, added the ~30% malignancy / >90% thrombocytopenia penetrance snippet to ETV6-related thrombocytopenia 5 while removing the unsourced negative eczema/granule bullet, and added the erythrocytosis/leukocytosis snippet to ANKRD26-related thrombocytopenia 2. Changed Platelet Transfusion therapeutic_modality from CELL_THERAPY to OTHER, removed GO:0046982 (protein heterodimerization activity, modifier: ABNORMAL) from RUNT Domain Dominant-Negative Activity while retaining GO:0000981 (DECREASED), and added a notes block on Immune and Inflammatory Dysregulation recording that intermediate immune-lineage mechanisms remain unresolved.

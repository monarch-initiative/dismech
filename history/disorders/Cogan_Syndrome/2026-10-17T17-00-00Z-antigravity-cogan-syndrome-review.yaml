  details: 'Reviewed Cogan_Syndrome.yaml for issue #10536 and PR #14721 review feedback. Added a progression
    block documenting young-adult onset (with pediatric onset reported at a median age of 12 years across
    55 pediatric cases, DOI:10.1186/s12969-023-00830-x) and progressive sensorineural hearing loss that
    frequently worsens despite glucocorticoid therapy (PMID:36502531, PMID:39007044 with quote_role: BACKGROUND),
    along with the less-than-two-year interval between ocular and audiovestibular symptoms in classic Cogan
    syndrome (PMID:28583785). Replaced 3 title-echo snippets (2 on PMID:12354474 and 1 on PMID:28583785)
    and expanded short evidence snippets (<50 chars) across pathophysiology, histopathology, phenotypes,
    and treatments to full verbatim sentences from cached references.'

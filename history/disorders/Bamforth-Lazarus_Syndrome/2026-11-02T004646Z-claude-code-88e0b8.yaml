  summary: 'Create: Bamforth-Lazarus Syndrome'
  details: |
    New autosomal recessive syndromic congenital hypothyroidism entry (MONDO:0009437, FOXE1/TTF-2). Deep research via claude_code (preflight-dr PASS, 47 FOXE1 mentions, OMIM 241850). Pathophysiology chain: FOXE1 forkhead TF dysfunction branching to thyroid dysgenesis (-> thyroid hormone deficiency, conforms_to hypothyroidism_thyroid_hormone_deficiency#Impaired Thyroid Hormone Synthesis) and impaired palatal shelf fusion (FOXE1->MSX1/TGF-beta3), plus choanal atresia and bifid epiglottis. Evidence from the founding TTF-2 report (PMID:9697705), the Titf2-null mouse (PMID:9697704), the MSX1/TGF-beta3 palate-target study (PMID:21177256), and a FOXE1 cohort/variant functional study (PMID:24219130); ClinGen Craniofacial Malformations GCEP Definitive validity curation (scoped to the AR syndrome, distinct from FOXE1 thyroid cancer/athyreosis). Mechanism left as mixed (most variants LOF, p.R73S gain-of-activity) per ClinGen. Validated with validate-disorders (0 issues), 24/24 snippets, 5/6 phenotypes connected, gene-validity clean. Closes #16298.

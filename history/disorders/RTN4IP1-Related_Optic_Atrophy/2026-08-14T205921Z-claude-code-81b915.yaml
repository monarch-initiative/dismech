  summary: 'Create: RTN4IP1-Related Optic Atrophy OPA10'
  details: |
    De-novo curation of optic atrophy 10 [OPA10; MONDO:0020737; OMIM 616732; RTN4IP1], an autosomal recessive mitochondrial optic neuropathy. Deep research provider: falcon/Edison (completed; 8/8 references verified, confabulation_rate 0.0). NEC preflight (just preflight-dr) returned a benign WARN: RTN4IP1 dominates the report (108 mentions, canonical gene confirmed); the only flag was report OMIM 610502 [the RTN4IP1 gene MIM] vs MONDO xref 616732 [the OPA10 phenotype MIM] - a gene-vs-phenotype MIM distinction, not named-entity confusion.

    Content: 3 pathophysiology nodes (RTN4IP1 loss of function / NAD(P)H oxidoreductase; impaired CoQ biosynthesis via COQ3 + terminal complex I assembly; retinal ganglion cell degeneration), 9 phenotypes (optic atrophy, nystagmus, rod-cone dystrophy, intellectual disability, ataxia, seizures, global developmental delay, dyskinetic movement disorder, sensorineural deafness), 1 biochemical (elevated lactate), prevalence (ultra-rare / cases-in-literature), genetic + a Saudi founder variant (c.475G>T p.Val159Phe), 2 treatments (experimental CoQ10 - hedged as PARTIAL single case + supportive care), 2 animal models (zebrafish, Drosophila) with mechanism links/readouts, and a CoQ10 disease-modification knowledge-gap discussion.

    Evidence anchored to primary literature: Angebault 2015 PMID:26593267 (gene discovery); Charif 2018 PMID:29181510 (clinical spectrum); Okamoto 2017 PMID:28638143; Park 2024 Nat Chem Biol PMID:37884807 (CoQ oxidoreductase via COQ3); Olahova 2025 EMBO J PMID:40859035 (complex I assembly + CoQ); Thys 2025 PMID:41161158 (dyskinesia / spectrum expansion); Aldosary 2022 PMID:36231115 (Saudi founder variant); Meunier 2021 PMID:33315831 (rod-cone dystrophy); CoQ10 case report PMID:41609474; Hu 2002 PMID:12067236 (NIMP/RTN4-interaction). All 27 snippets verified against cached references; just validate, validate-terms, and validate-disorders (CI-equivalent, --no-full-text) all pass. No dedicated GeneReviews chapter exists for RTN4IP1.

    A fresh-context red-team review (dismech-pr-review) found no CRITICAL issues; two IMPORTANT structural fixes were applied afterward: (1) the bundled CoQ+complex-I node was split into two atomic nodes (Impaired Coenzyme Q Biosynthesis; Impaired Complex I Assembly and Respiratory-Chain Dysfunction), and (2) the pathograph was wired with downstream causal edges into a connected spine (RTN4IP1 loss -> CoQ / complex I -> RGC degeneration -> optic atrophy), with the CoQ10 treatment target_mechanisms-linked (RESTORES) to the CoQ node. One minor evidence_source fix (cultured knockout myoblasts retagged IN_VITRO).

    Also in the same change: added a skos:narrowMatch mapping from Autosomal_Dominant_Optic_Atrophy_Plus.yaml (MONDO:0014720) to MONDO:0007429 (optic atrophy plus syndrome, OPA1), the OPA1-specific OMIM child of the plus-syndrome concept that entry already curates.

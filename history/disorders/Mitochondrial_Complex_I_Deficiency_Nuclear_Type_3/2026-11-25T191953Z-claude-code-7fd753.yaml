  summary: 'Gene-family review: NDUFS7'
  details: |
    NDUFS7's Q-module node binds 4 iron, 4 sulfur cluster binding, which is correct (NDUFS7 holds the terminal cluster N2), but neither its description nor its evidence said so: the cited structural sentences place the quinone site next to N2 without naming the subunit that ligates it. The description now states that N2 sits at the NDUFS2-NDUFS7 interface and is ligated by four NDUFS7 cysteines, with PMID:33640456 as evidence. The genetic record (causative, germline), the 2026 optic-atrophy findings already curated from PMID:41234160, and the lesion node were checked and left unchanged.

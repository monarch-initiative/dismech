  summary: 'Create: Mitochondrial Complex I Deficiency Nuclear Type 3'
  details: |
    New MC1DN3 (NDUFS7) entry curated end to end. Deep research: 'just research-disorder claude_code' produced research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_3-deep-research-claude_code.md (19 web searches, 25 turns). Its trailing term-validation step failed on a network timeout, so the reference and term validation sections were added afterwards with 'just validate-research-reference' and 'just validate-research-terms': 5/5 references resolved, 32/36 terms resolved. One unresolved CURIE (HP:0025438), two obsolete (GO:0005747, CHEBI:9077) and one mislabelled (HP:0002490 named 'abnormal basal ganglia MRI' but is Increased CSF lactate) were flagged; none of them was bound in this entry - the basal ganglia phenotype uses HP:0012751. 'just preflight-dr ... MONDO:0032608' returned PASS (NDUFS7 mentioned 56 times). Structure follows the seven curated MC1DN siblings, especially types 2 and 23: same parents style, the same 'mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress' conformance target that types 24 and 34 use, and the same classifications triple. Pathophysiology is a seven-node chain from NDUFS7 loss of function through two separable arms - Q-module/cluster-N2 catalytic integrity and complex I assembly - to defective NADH-to-ubiquinone electron transfer, isolated complex I deficiency and bioenergetic failure, and then to two tissue nodes: basal ganglia/brainstem and retinal ganglion cell/optic nerve. A mechanistic_hypotheses entry records the 2026 Brain finding that Leigh-associated and optic-atrophy-associated NDUFS7 missense variants segregate spatially within the subunit, graded EMERGING. References used: PMID:10360771 (Triepels 1999, the founding report), PMID:11004438 (Yarrowia reconstruction of V122M), PMID:17275378 and PMID:17604671 (Lebon 2007 R145H and the cryptic-exon intronic allele), PMID:39894241 (c.16+5G>A siblings), PMID:41234160 (Brain 2026 optic-atrophy cohort, full text), PMID:31226318 and PMID:23417064 (PSST Q-tunnel loop mutagenesis and complex I structure), PMID:38316835 (canine NDUFS7 Leigh syndrome plus Drosophila rescue), PMID:18435906, PMID:30429455, PMID:38823363, PMID:32335026 (cellular models), PMID:15576045 and PMID:22972949 (cohort and review context), PMID:26425749 (GeneReviews, tagged, no snippet - its abstract is a purpose statement with no findings). Deliberately not curated: the OMIM clinical-synopsis features of the founding cases (onset 11-26 months, dysarthria, feeding difficulty, hepatomegaly), because no cached source contains them; and the 2004 monoallelic NDUFS7 neonatal cardiomyopathy case, because a single-allele finding does not establish MC1DN3. Both are recorded in notes so they are not rediscovered. Validation: just validate passed; just count-verified-snippets 76/76 verified; just validate-terms passed; just check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence all passed; just validate-disorders run as the final batched gate.

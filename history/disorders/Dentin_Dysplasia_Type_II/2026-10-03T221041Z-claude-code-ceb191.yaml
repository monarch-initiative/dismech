  summary: 'Create: Dentin Dysplasia Type II'
  details: |
    New entry for dentin dysplasia type II (MONDO:0007437), curated from the Perplexity deep-research report research/Dentin_Dysplasia_Type_II-deep-research-perplexity.md plus 21 primary and review papers fetched into references_cache. Five-node pathograph: heterozygous DSPP variant -> mutant DSPP retention in the rough ER -> entrapment of wild-type DSPP and reduced secretion -> defective dentin mineralization -> aberrant pulpal dentin deposition and pulp calcification, with all seven dental phenotypes causally connected. HP, GO, CL and UBERON terms were looked up through OLS rather than taken from the report, whose term list contained ten mislabelled and two nonexistent identifiers (for example CL:0000661, UBERON:0001754 as dentin, GO:0042472 as dentinogenesis, HP:0006470, HP:0006314). DD-II is kept as a separate entry from dentinogenesis imperfecta types II and III because MONDO, OMIM and Orphanet separate it; a DSPP-spectrum grouping is suggested as a follow-up. Two knowledge gaps recorded: dominant-negative versus haploinsufficiency (von Marschall 2012 versus Shi 2020 Dspp+/- mice) and the unexplained severity difference between primary and permanent dentitions. Validated with just validate, validate-terms, count-verified-snippets (47/47) and validate-disorders. No GeneReviews chapter exists (check-genereviews --online). Orphanet ORPHA:99791 could not be cached because the Orphadata bulk XML is not present.

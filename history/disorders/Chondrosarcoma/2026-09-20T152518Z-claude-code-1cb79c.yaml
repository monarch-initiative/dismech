  details: |
    Review round on PR #12332, three non-blocking items taken. First, PMID:18271966 (Bovee, Orphanet J Rare Dis 2008) is a review and several records' own explanations already said so, but the evidence items carried no quote_role; all nine items citing it now carry quote_role REVIEW_SYNTHESIS, with evidence_source left at its assessed value rather than flattened to OTHER - the quoted detection rate is human clinical evidence that this publication is synthesising. Second, the EXT1 note said 'both lifetime transformation estimates quoted below' when only the ~2%-10% GeneReviews figure is in that record's evidence list; the note now names where each estimate is quoted. Third, a review_notes was added to the Conventional subtype row recording that its IDH1/IDH2 and TP53 frequencies come from a cohort that sequenced conventional and dedifferentiated disease together and reports them jointly, so neither is a conventional-only rate.

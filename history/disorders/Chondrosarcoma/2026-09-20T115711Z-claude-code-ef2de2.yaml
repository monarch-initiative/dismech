  summary: 'Genetics pass: first genetic block - nine genes, all wired'
  details: |
    Genetics pass for #12192 and the largest gap in the tranche: the entry had no `genetic:` block at all and no gene bound anywhere, while its pathophysiology chain already carried nodes named 'IDH1/IDH2 Neomorphic Enzyme Activity', 'COL2A1 Matrix Gene Disruption', 'TP53 Dysfunction', 'HEY1::NCOA2 Fusion Oncogenic Program' and 'EXT1/EXT2 Heparan Sulfate Polymerization Failure', each with verified evidence. Built the `genetic:` block from that existing evidence plus two additions, and wired every gene: IDH1, IDH2, COL2A1, TP53, CDKN2A, HEY1, NCOA2 as SOMATIC_DRIVER records, EXT1 and EXT2 as germline RISK_FACTOR records. Wiring is 9/9. Added `case_fractions` for the IDH1/IDH2 (50.5%) and TP53 (41.9%) shares of the 93-patient MD Anderson sequencing cohort. Bound genes on five of seven subtype rows and recorded in `review_notes` why clear cell and periosteal are left unbound. MONDO reconciliation: MONDO:0008977 / EXT1 was the one genuinely missing gene in this tranche and is now present, but recorded as RISK_FACTOR rather than CAUSATIVE - germline EXT1 loss causes hereditary multiple osteochondromas, and chondrosarcoma arises as secondary peripheral transformation in a minority of carriers, so an EXT1 variant is neither necessary nor sufficient for this disease. Fetched and tagged the Hereditary Multiple Osteochondromas GeneReviews chapter (PMID:20301413) for that argument. This is also the only checklist pair in the tranche whose MONDO term equals the entry's own `disease_term`, so it is the only one the KGX exporter can emit at the keyed term.

    Two follow-ups after rebasing onto a main that had gained kb/disorders/Hereditary_Multiple_Osteochondromas.yaml (#12130): the EXT1 and EXT2 records now cross-reference that entry, which carries the germline arm and stops at the transformation threshold; and the GeneReviews evidence items were regraded from HUMAN_CLINICAL to OTHER to match how that entry grades the same quoted sentences and its stated evidence-source convention.

  details: |
    Full manual evidence audit of kb/disorders/Chondrosarcoma.yaml.

    Scope: all 35 evidence items were re-read against their cited sources, covering 12 unique PMIDs -- 34742483, 34734747, 35672279, 37805864, 30296521, 18271966, 32208957, 31604924, 23770606, 41391500, 37747813 and 30082492. Every cache file was opened and read in full, including the two full-text caches, 18271966 and 31604924, where the paragraph surrounding each quoted passage was checked.

    Checks performed on each evidence item:
    1. Snippet is an exact substring of the cached reference body. Mechanically confirmed at 35/35 verified by count-verified-snippets.
    2. The quote semantically supports the specific claim it sits under -- the subtype definition, pathophysiology node, causal edge, histopathology finding, phenotype or treatment.
    3. The supports grading matches the strength of the quoted statement.
    4. evidence_source classifies the cited study rather than the claim or the curator.
    5. No Named Entity Confusion between chondrosarcoma and the tumours it is most easily confused with. Specifically checked that osteosarcoma, enchondroma, osteochondroma and chordoma material is not being used to support chondrosarcoma claims.
    6. Snippets are propositional statements rather than paper titles.

    Defect found and fixed: evidence_source misclassification on five evidence items.

    Five items citing two reviews of human disease were graded OTHER when the quoted sentences report findings from human patient series and human clinical practice, which the classification rules assign to HUMAN_CLINICAL. OTHER is reserved for evidence that does not fit the human, animal, cell-based or in-silico categories, such as expert consensus without underlying data.

    The five items, all changed from OTHER to HUMAN_CLINICAL:
    - PMID:34742483 Malignant Cartilage-Forming Tumors, quoted for the subtype frequency distribution of conventional, dedifferentiated, clear cell, mesenchymal and periosteal chondrosarcoma. Cited three times -- on the Conventional subtype, the Periosteal subtype and the Periosteal Chondrosarcoma histopathology finding. The percentages are the observed distribution of human chondrosarcoma cases.
    - PMID:18271966 Multiple osteochondromas, quoted twice. Once for the 0.5 to 5 percent rate of malignant transformation of osteochondroma to secondary peripheral chondrosarcoma, and once for germline EXT1 or EXT2 mutations being found in almost 90 percent of multiple osteochondromas patients. Both are frequencies observed in human patients.

    Named Entity Confusion check: no problems. PMID:18271966 is about multiple osteochondromas rather than chondrosarcoma itself, but it is cited only for the precursor-lesion relationship and the EXT1/EXT2 predisposition context that produce secondary peripheral chondrosarcoma, which is exactly what it establishes and how the explanations describe it. PMID:35672279 is a head and neck mesenchymal chondrosarcoma series and is used only for mesenchymal chondrosarcoma claims. PMID:30296521 is a head and neck chondrosarcoma series and is used only for the central conventional subtype and IDH mutation frequency sentence it actually contains.

    Other items checked and left unchanged:
    - The remaining OTHER gradings were left in place where the quoted sentence is a definitional or nosological statement rather than a patient finding, for example the WHO classification of clear cell chondrosarcoma as a low-grade malignant cartilaginous neoplasm.
    - PMID:32208957 is the ivosidenib phase I study and is correctly HUMAN_CLINICAL throughout, including the plasma 2-HG pharmacodynamic reduction quoted on both the D-2-hydroxyglutarate node and the ivosidenib target_mechanisms block.
    - PMID:31604924 is a multi-omics study of human cartilage tumours and is correctly HUMAN_CLINICAL for both the IDH-methylation association and the cell-cycle-activation classification axis.
    - PMID:23770606 is a genomic study of 49 human chondrosarcoma cases and is correctly HUMAN_CLINICAL for both COL2A1 hypermutability and the impaired-collagen-biosynthesis selection pattern.
    - Reference titles on evidence items match the title recorded in each cache file's frontmatter.

    Validation after review: just validate kb/disorders/Chondrosarcoma.yaml passed, and just count-verified-snippets reported 35/35 verified against cached references. The pre-existing check-snippet-grading divergences reported repository-wide do not involve this entry. No files under cache/ or references_cache/ were touched.

  summary: 'Create: Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome
    1A'
  details: |
    De novo curation of CPSFS1A (MONDO:0008338), the autosomal dominant MYH3 form. Curated entirely from references already present in references_cache/: the environment had no outbound access to PubMed, Crossref, ClinicalTrials.gov or OLS, so no new reference could be fetched and no new ontology CURIE could be resolved. Ontology bindings were therefore restricted to CURIEs already present in cache/, with the single unavoidable exception of the disease_term MONDO:0008338 itself, which is absent from cache/mondo/terms.csv and from the diseaseterm enum cache and could not be validated locally. Pathograph: MYH3 motor domain dysfunction to prolonged actomyosin interaction to myofibril assembly and stability defect to reduced fetal movement, branching to contractures, periarticular webbing and axial/appendicular bony fusion, with the fusion node carrying the vertebral, carpal and tarsal synostosis phenotypes and the progressive scoliosis that distinguish CPSFS from the other MYH3 arthrogryposes. Evidence discipline: no CPSFS-specific clinical series was citable. The only source naming CPSFS is PMID:38856159, whose own subject is a recessive distal arthrogryposis family. All mechanistic evidence comes from Drosophila and purified-protein work on DA1 (F437I) and DA2B (A234T) alleles (PMID:32799913) and is graded SUPPORT with directness INDIRECT and evidence_source MODEL_ORGANISM, IN_VITRO or COMPUTATIONAL as the assay warrants. The scoliosis and spinal-management evidence comes from a multiple pterygium syndrome series with two MYH3 patients (PMID:34440395), also INDIRECT. Seven phenotypes carry no evidence item rather than a borrowed one. A KNOWLEDGE_GAP discussion records that the molecular mechanism on this entry is borrowed from allelic DA conditions and explains nothing about the bony fusion that actually defines CPSFS, with a proposed experiment comparing CPSFS allele biochemistry against the DA alleles. Validation: linkml-validate clean; check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets, check_qualifier_terms, check_folded_hyphens, check_snippet_length, check_title_snippets, check_snippet_grading, check_reference_titles and check_empty_snippets all pass; reference_snippet_audit reports 18/18 snippets verified against cached references; offline term validation reports MONDO:0008338 as its only unresolvable CURIE.

  summary: Address PR review findings for Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome 1A
  details: |
    Scoped top-level description and MYH3 Motor Domain Dysfunction to autosomal dominant CPSFS1A alleles (removing recessive CPSFS1B c.-9+1G>A REFUTE items from the dominant root node while preserving the allele-class contrast in discussions); split Impaired Paraspinal Muscle TGF-beta Signaling and Disc Loading into atomic Reduced Embryonic-Myosin-Dependent TGF-beta Signaling (CELLULAR) and Abnormal Paraspinal Loading of Intervertebral Disc (TISSUE) nodes with Discussion mechanistic hypotheses in PMID:28205584 graded directness: INDIRECT; removed the un-evidenced Reduced Fetal Movement -> Axial and Appendicular Bony Fusion edge; changed GO:0001503 modifier on Axial and Appendicular Bony Fusion from INCREASED to ABNORMAL; corrected quote_role on classifications.harrisons_chapter PMID:32767732 to PRIMARY_RESULT; removed the self-referential MONDO:0008338 -> MONDO:0008338 mapping; trimmed Pterygium PMID:27381093 explanation to match the quoted neonatal snippet; softened Scoliosis and Spinal Bracing and Serial Casting malignant-scoliosis framing and noted the dominant (p.Leu1204Pro) vs recessive (c.-9+1G>A / p.Ala183Pro) MYH3 genotypes in PMID:34440395; and documented indirect MPS-spectrum support and lack of CPSFS1A-specific prevalence data in notes on Talipes equinovarus and Micrognathia.

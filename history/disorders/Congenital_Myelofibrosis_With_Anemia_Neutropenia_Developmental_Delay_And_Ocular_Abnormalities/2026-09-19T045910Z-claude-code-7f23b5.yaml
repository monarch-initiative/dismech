  summary: 'Create: Congenital Myelofibrosis with Anemia, Neutropenia, Developmental
    Delay, and Ocular Abnormalities (MONDO:0975797, RBSN)'
  details: |
    Created the dismech entry for MONDO:0975797 (OMIM:620939, MFANDO), biallelic RBSN /
    rabenosyn-5.

    Entity identity. Decided DISEASE, standalone. RBSN carries more than one Mendelian
    phenotype, so this was the substantive call. ClinVar (read through the NCBI E-utilities
    esummary API on 2026-09-19) keys NM_022340.4(RBSN):c.289G>C p.Gly97Arg to this condition
    (MedGen C5975380 / MONDO:0975797 / OMIM:620939) and keys the two FYVE-domain alleles
    p.Arg180Gly and p.Gly183Arg to a separately named disorder, Kariminejad neurodevelopmental
    syndrome (MONDO:0975795). PMID:35652444 concludes that distinct germline RBSN mutations
    cause non-overlapping phenotypes with discrete endolysosomal defects. So the earlier
    RBSN-related phenotype is a sibling entity, not a synonym and not a subtype. A stub was
    added for MONDO:0975795 so the split is recorded in the curation queue.

    A third RBSN patient (PMID:25233840, homozygous p.Gly425Arg) overlaps this entry clinically
    but is assigned to neither named disorder in ClinVar; that is recorded as an OPEN_QUESTION
    discussion rather than lumped or split silently.

    Naming. Followed the KB's de-inversion precedent for inverted MONDO/OMIM labels (as in
    "central hypoventilation syndrome, congenital" -> Congenital_Central_Hypoventilation_
    Syndrome) rather than the stub's proposed_name, which kept the inverted word order. Full
    descriptive name retained; at 97 characters the filename is within existing precedent.

    Evidence constraint. The defining report (PMID:29784638, a Letter to Blood) has no abstract
    in PubMed and Blood does not release its full text programmatically, so it carries no
    quotable snippet; it is listed in references: without an evidence block, and the
    disease-level phenotype claims are evidenced from the cached NCBI MedGen record for the
    concept. This is stated up front in the entry notes.

    Mechanism. Chain from RBSN loss of function through loss of rabenosyn-5/VPS45 coupling at
    the early endosome to impaired receptor recycling is evidenced directly from the
    rabenosyn-5 cell-biology literature. The steps from there to neutropenia and to marrow
    fibrosis lean on the VPS45 disease, in which rabenosyn-5 protein itself is reduced, and are
    graded INDIRECT and marked PROVISIONAL / HYPOTHETICAL accordingly.

    Deliberately not done: no conforms_to declared. fibrotic_response was considered and
    rejected because none of its intermediate steps (inflammatory recruitment, mesenchymal
    activation) has been shown in this disease or its VPS45 counterpart; myelosuppression does
    not apply because its trigger node is a cytotoxic insult. Three phenotypes (ocular, delayed
    bone age, facial dysmorphism) are left with no incoming causal edge, with the reason stated
    in each description and a KNOWLEDGE_GAP discussion attached.

    Fibrosis-gap sourcing: the statement that the mechanism of marrow fibrosis is unknown is
    quoted from the VPS45 review (PMID:30294941) rather than asserted, and the craniofacial
    gap cites a trafficking-disease review (PMID:34068038) that names rabenosyn-5 without
    offering a mechanism. Both were added during a self-audit pass that replaced four
    unsourced absence claims with cited statements or with an explicit record of the search
    that was run.


  details: |
    Review round 1 on PR #12288. One blocking finding and one suggestion.

    BLOCKING - no deep-research artifact. Accepted and fixed. Ran
    `just research-disorder falcon <this entry>` and committed the report, its
    citations sidecar, and its artifacts directory.

    Outcome of the Content-Completeness Checklist against the report:

    1. Phenotype coverage - GAPS, now closed. The report named specific ocular
       lesions (microphthalmia, optic nerve hypoplasia) where the entry carried only
       the umbrella term, plus hepatomegaly, extramedullary hematopoiesis and
       hypotonia. All five are also annotated to MedGen C5975380 in the committed
       cache file, so all five were added on that provenance. Per-sibling frequencies
       were NOT carried: they come from a table in the full text of PMID:35652444,
       which is not open access.
    2. Subtype completeness - N/A. The report names no subtypes; it argues the
       opposite, that other RBSN alleles must not be merged into this concept.
    3. Pathophysiology depth - ADEQUATE with one recorded gap. The report's causal
       chain matches the entry's. It adds that c.289G>C acts by exon skipping with no
       detectable protein rather than as the missense its p.Gly97Arg name implies,
       which is full-text-gated and therefore recorded as a CURATION_TODO rather than
       curated.
    4. Treatments and trials - ADEQUATE. No trial exists; the report confirms it. Its
       more cautious framing of transplantation is now recorded in the treatment's
       notes beside OMIM's outcome statement, because the two differ in scope.
    5. Genetic section depth - GAP, recorded not closed. Zygosity, cohort size and
       variant class are all full-text-gated.
    6. Biomarkers and diagnostics - N/A. The report lists a work-up but no biomarker
       or validated criteria.
    7. PMIDs - ADEQUATE. The report surfaces PMID:29784638 and PMID:35652444, both
       already cited here.
    8. Overall consumption - intentionally narrower than the artifact, and signalled:
       the discussion `paul2022_full_text_gated_content` names each item held back and
       why.

    Independent confirmations worth recording: the report reaches the same
    autosomal-recessive call, the same "the route from lesion to fibrosis remains
    inferred" judgement, and the same allelic-disorder split this entry made from
    ClinVar - reached from Open Targets and the Paul 2022 text rather than from
    ClinVar, so it is a genuinely separate route to the same answer.

    `just preflight-dr` returns WARN for one reason, and it is benign: the report
    cites OMIM 609511, the RBSN gene MIM, where MONDO:0975797 xrefs phenotype MIM
    620939. RBSN is the report's top gene at 50 mentions.

    SUGGESTION - rebind Rab5 binding to GO:0017137. Declined, with evidence. OLS
    returns GO:0017137 with is_obsolete true and "term replaced by GO_0031267", so GO
    has merged Rab GTPase binding into the term the entry already binds. Binding it
    was tried and just validate-terms rejects it with an ERROR for dynamic-enum
    membership plus a label-mismatch WARN giving the canonical label as GO_0017137.
    The check and its result are now recorded in the node's notes so it is not
    re-raised.

    Validation after the round: validate, validate-terms, count-verified-snippets
    (43/43), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-case-collisions, check-stubs, validate-stubs,
    list-gene-term-mismatches (0 findings), and validate-disorders. Phenotype
    connectivity is 9/15; the six unwired nodes each state why in their description.

  summary: 'Create: Superior Mesenteric Artery Syndrome'
  details: |
    De-novo curation of superior mesenteric artery syndrome [MONDO:0002687], a deliberately
    non-Mendelian, mechanical/anatomic dismech target.

    Preflights. NEC preflight run against the MONDO record - no causal gene, synonyms Wilkie
    syndrome / Cast syndrome / Arteriomesenteric duodenal compression syndrome - and passed;
    the Edison deep-research report was confirmed semantically to be about duodenal
    compression and explicitly not mesenteric ischaemia or SMA dissection. Duplicate preflight
    across origin/main kb/, all PRs, and all issues including synonyms found no existing
    coverage.

    Deep research. just research-disorder falcon Superior_Mesenteric_Artery_Syndrome
    - 7m20s, 12 citations, 1 artifact. The report was PMID-poor, leaning on ClinicalTrials.gov
    records, so its verifiable leads - PMID:30291587 plus NCT03416647 and NCT06970093 - were
    fetched and verified, and the remainder of the evidence base was built from a targeted
    PubMed E-utilities sweep. Every snippet was verified against a cache file created by
    just fetch-reference; no cache file was hand-written.

    Content. An eight-node CYCLIC pathograph: precipitating catabolic weight loss or anatomic
    alteration, mesenteric fat pad depletion, aortomesenteric angle and distance narrowing,
    extrinsic compression of the third part of the duodenum, proximal duodenal obstruction
    and gastroduodenal stasis, meal-provoked symptoms and reduced oral intake, progressive
    weight loss and malnutrition, and an edge closing back to fat pad depletion. Every edge in
    the loop carries the hypothesis group fat_pad_depletion_vicious_cycle, declared as a
    CANONICAL mechanistic_hypotheses entry. A second, non-adipose trigger arm - post-scoliosis
    -surgery geometric distortion - is modelled as an INDIRECT_KNOWN_INTERMEDIATES edge that
    bypasses the adipose node. Also curated: 10 phenotypes, 2 imaging findings, 3 environmental
    precipitants, prevalence, epidemiology, 6 treatments with target_mechanisms - nutritional
    rehabilitation RESTORES the fat pad node, nasojejunal feeding and duodenojejunostomy
    BYPASS, Strong procedure INHIBITS the compression - a diagnosis entry requiring
    clinical-radiological concordance, 3 differential diagnoses including nutcracker syndrome
    modelled as sharing the aortomesenteric substrate while remaining a distinct disease,
    2 clinical trials, and 2 KNOWLEDGE_GAP discussions with structured proposed_experiments.

    Deliberate omissions. Genetics, variants, inheritance, molecular pathways, biomarkers,
    omics, and animal-model sections are intentionally empty rather than speculatively filled.
    GeneReviews confirmed absent by PubMed search, as expected for a non-Mendelian entity.
    The historical 33 percent untreated-mortality figure was not carried in as a structured
    claim - selected historical series, no verifiable quotable source.

    Validation. just validate, just validate-references with 51/51 snippets verified against
    cached references, and just validate-terms all pass. Compliance 83.4 percent.

    Data-quality flag. references_cache/PMID_37383896.md was generated by just fetch-reference
    but its OpenAlex full-text resolution appended the full text of a DIFFERENT paper
    (PMC6982477 = PMID:31998513, Watters et al.) below the correct abstract. All snippets cited
    here against PMID:37383896 were taken only from its genuine abstract; the contaminated
    region was not quoted. Flagged for follow-up rather than hand-edited, per the cache guardrail.

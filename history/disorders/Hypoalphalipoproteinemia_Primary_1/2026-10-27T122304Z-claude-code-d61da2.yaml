  summary: 'Create: Hypoalphalipoproteinemia_Primary_1'
  details: |
    Created a Disease entry for MONDO:0011393 (ABCA1-related autosomal dominant familial HDL deficiency), kept separate from Tangier disease (MONDO:0008783) because the two are distinct MONDO/OMIM diseases with different inheritance and phenotype. Deep-research input: one Perplexity sonar-deep-research report (research/Hypoalphalipoproteinemia_Primary_1-deep-research-perplexity.md), generated via a locally streaming-patched deep-research-client because of dismech#9357 / deep-research-client#94. Its reference validation was 21/21 resolved, 0 unresolved; term validation flagged DOID:0080957 and CL:0000057 label mismatches (neither bound here). Its body cites bracket numbers that do not match the 54-entry citation sidecar, so only explicitly named PMIDs were used. Not used: PMID:37545679 and PMID:39691320 (case reports of severe/compound or Tangier-diagnosed ABCA1 deficiency, not monoallelic disease); PMID:12364545 (WHAM chicken, a recessive Tangier model) and PMID:28330813 (Tangier iPSC hepatocytes), both biallelic; PMID:38052254 used only for variant-interpretation caution; PMID:36889459/37548415 structural models not curated; the report's GenCC 'Definitive' claim not recorded because the committed ClinGen export has no ABCA1 CGGV record. References found outside the report's named PMIDs and cited here: PMID:15019541, 12679198, 19765707, 18523221, 21875686, 17303779, 26109739 (the report cites it by DOI), 27565770; PMID:30333156 came from the report's citation validation. Encoded the HDL/CAD controversy (family cohorts vs Danish population study) as a CONTROVERSY discussion with a REFUTE item on the premature coronary atherosclerosis phenotype. check-genereviews --online: NO_CHAPTER. Validation: just validate passed (49/49 snippets), validate-terms passed, entity-ref/causal-target/coarse/qualifier/enum/duplicate-key gates OK, validate-disorders run before commit.
    Review round 1 (PR #15715, changes requested): added a diagnosis section with two rows, HDL cholesterol measurement with exclusion of secondary causes (NCIT:C105587; PMID 30333156) and genetic testing of ABCA1, APOA1 and LCAT (NCIT:C15709; PMID 27565770, PMID 30333156). Removed the PMID 12204794 item from the premature coronary atherosclerosis phenotype because its snippet was the study aim, not a finding, and the abstract has no result sentence about coronary disease; PMID 11086027 still carries the claim. Added PMID 15019541 evidence to the edge from impaired HDL particle assembly to decreased apoA-I, marked directness INDIRECT. Not changed: uncited cache files written by the deep-research validation run (kept, as on the sibling PRs) and a fibrate treatment (no disease-specific source).

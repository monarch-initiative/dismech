  summary: 'Create: Malonic Aciduria (MLYCD, MONDO:0009556)'
  details: |
    New dismech entry for malonic aciduria / malonyl-CoA decarboxylase deficiency, curated as a WP-001 (IEMbase metabolic curation package, issue #5556) increment covering seed row 1.2.23.01 (MLYCD / OMIM:248360 / ORPHA:943). The WP-001 seed table short-alias-matched MLYCD to Migraine_with_Aura; that was confirmed to be a false-positive fuzzy match and discarded, so a new entry was created rather than an edit. NEC preflight was run against MONDO:0009556 before any content was written: the Orphanet-sourced definition names malonyl-CoA decarboxylase, the OMIM:248360 and Orphanet:943 xrefs match the seed row, and RO:0004003 points to HGNC:7150 (MLYCD), the gene named throughout the cited literature. The pathograph models a two-arm mechanism: MLYCD loss leads to malonyl-CoA accumulation, which inhibits CPT1 and hence mitochondrial long-chain fatty-acid oxidation, producing a cardiomyocyte energy deficit and cardiomyopathy; a parallel protein-lysine-malonylation arm is carried as an EMERGING mechanistic_hypotheses group plus a HUMAN_MODEL_MISMATCH discussion, because all malonylation evidence is fibroblast-derived rather than from heart or brain. Conformance is declared to metabolic_intoxication_decompensation (enzymatic block, toxic accumulation, and acute decompensation nodes) and to cardiomyopathy_maladaptive_remodeling (primary cardiomyocyte insult and structural cardiac impairment nodes). Eleven candidate PMIDs were fetched with just fetch-reference and nine are cited; PMID:31395333, the largest clinical series, has no PubMed abstract so no snippet could be quoted and it is not cited. Validation: just validate PASS, just validate-terms PASS, just validate-references PASS with 58 of 58 snippets verified against cached references.

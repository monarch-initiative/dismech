  details: |
    Review round 1 on PR #14682. The reviewer found that splitting the combined anti-GAD65 marker into serum and CSF markers had copied both citations to both markers, so each marker carried an item whose quoted sentence is about the other compartment, and that the context sentence saying the evidence does not separate the two compartments was false, since the sources do separate them.

    Both findings confirmed by reading the cached abstracts. Four changes.

    Serum marker, LOINC:13926-1. The PMID:3281011 snippet quoted only the clause about cerebrospinal fluid antibodies. It now runs on to the contiguous text "and the predominant antigen recognized by serum antibodies", which is the serum half of the same sentence and is the clause that bears on this marker. PMID:35084720 is unchanged, its snippet being about serum titers.

    Serum marker context. The "in serum and CSF" phrasing and the cross-marker sentence are gone. The 10,000 IU/mL figure is kept here only, and is now cited: PMID:33854562, already cited seventeen times in this entry and cached as full text, states "only titers >10,000 IU/mL are associated with a neurologic disorder" and attributes the cutoff to serum anti-GAD65 ELISA. The figure had been stated in prose with nothing behind it.

    CSF marker, LOINC:42501-7. The reviewer asked for the PMID:35084720 item to be removed. It was re-quoted instead, because that abstract does bear on CSF: the sentence continues past the serum clause to "commonly associated with the presence of GAD antibodies in the CSF, a reduced CSF GABA level and increased anti-GAD-specific IgG intrathecal synthesis", which is the snippet now used. Removing the item would have discarded a usable CSF citation; re-quoting satisfies the compartment requirement the finding rests on. PMID:33854562 was also added, for "The high titers were also associated with measurable anti-GAD antibodies in the CSF."

    CSF marker context. It no longer repeats the serum titer figure. It now states what the sources support for this compartment: antibodies commonly detectable in CSF with intrathecal synthesis, tracking high serum titers, and no established CSF cutoff.

    No bindings or cache rows changed. Both newly cited PMIDs were already cached and already cited in this entry, so no reference cache file was added.


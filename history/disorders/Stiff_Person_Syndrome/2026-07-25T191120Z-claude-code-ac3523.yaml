  details: |
    Claim-evidence correctness audit of 10 neuroimmune entries.

    The genetic record was named HLA-DRB1 but its notes made a quantitative claim about DQB1*0201, a different gene (HLA-DQB1), and its only evidence item was tagged NO_EVIDENCE with a snippet about clinical overlap across GAD-spectrum disorders that mentions no HLA allele -- the explanation conceded the gap ('implies common genetic susceptibility factors').

    Re-keyed the record to HLA-DQB1 with gene_term hgnc:4944 (verified with OAK) and replaced the non-evidence item with two verified sources:
    - PMID:8263140 (Pugliese et al. 1993, 'Association of HLA-DQB1*0201 with stiff-man syndrome'), the original typing study and the actual source of the ~70% figure: 'Seventy-two percent carried the DQB1*0201 allele (13 of 18, P = 0.02 vs. 18 of 48 controls)'.
    - PMID:32152690 (Muniz-Castrillo et al. 2020), four-digit typing of GAD65-antibody neurological syndromes showing DQB1*02:01 as the only significantly enriched allele, supporting a primary DQ rather than DR effect.

    Both references fetched via linkml-reference-validator cache reference; snippets verified as exact substrings. Notes updated to explain why the record is keyed to DQB1 rather than DRB1.

    Validation: linkml-validate (Disease) passes; linkml-term-validator --labels passes; all 96 evidence snippets verified as exact substrings.

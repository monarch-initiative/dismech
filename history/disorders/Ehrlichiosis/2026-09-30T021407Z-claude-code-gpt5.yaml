  details: |
    Created a broad Ehrlichiosis parent entry from the OpenScientist fallback report and bound MONDO:0016003, genus-level Ehrlichia, E. chaffeensis, the white-tailed-deer/lone-star-tick enzootic cycle, morula formation in leukocytes, TRP120/Notch/TLR immune evasion, Wnt-mTOR autolysosome blockade, Etf-3 ferritinophagy and iron acquisition, the febrile cytopenic syndrome, TNF-alpha/CD8-T-cell severe-disease immunopathology, and the core fever, thrombocytopenia, leukopenia, and transaminitis phenotypes. Avoided the report's bad HP:0012047 lead for hemophagocytosis; the remaining references all resolved, and manual review confirmed that the report covered the intended MONDO:0016003 tick-borne Ehrlichia infection parent.

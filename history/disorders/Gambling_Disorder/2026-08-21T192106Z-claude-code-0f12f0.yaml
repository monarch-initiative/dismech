  summary: 'Review round 1: the outcome that makes the disease matter was missing'
  details: |
    First review round on PR #9191. Three IMPORTANT findings, all verified and all correct.

    The sharpest was suicidality. The entry quoted a review that closes on 'the associations with poor quality of life and suicide' and then curated neither. A Swedish nationwide register study of 2,099 diagnosed individuals reports 1.8-fold all-cause mortality and 15-fold suicide mortality against the general population, with 21 of 67 deaths by suicide, and suicide death predicted by depression rather than gambling severity. Added as a bound phenotype (HP:0031589) with both figures. This is the same defect that recurred across this session in a new form: not an unevidenced assertion, but a cited source whose most important content was left uncurated.

    HP:0000708 Atypical behavior was a near-maximally generic false match for 'Psychiatric comorbidity' - the identical error flagged on the trichotillomania PR in the same round. Unbound rather than swapped for HP:0000716/HP:0000739: the snippet supports co-occurrence in general and names no specific disorder, so binding Depression or Anxiety would assert more than the source does. The one comorbidity the entry can name, depression as predictor of suicide death, now sits on the suicidality phenotype with its own evidence.

    GO:0050795 regulation of behavior with DECREASED was semantically off-target on the Reinforcement Learning Distortion node - the claim is distorted valuation, not reduced behavioural regulation. Replaced with GO:0008306 associative learning + DYSREGULATED. Note this same term is used on nodes in the trichotillomania and stuttering entries from this batch; there it reads correctly (failure of behavioural inhibition genuinely is reduced regulation of behaviour) so it was not changed, but the pattern is worth watching.

    Added an Endogenous Opioid Modulation of Striatal Dopamine Release node. The best-evidenced pharmacotherapy is opioid-receptor antagonism, and the treatment previously pointed its INHIBITS link at a dopaminergic circuit node its mechanism does not describe. The new node makes the join explicit and is honest about its own weaker status: it is inferred from the drugs' pharmacology and trial results, not from any measurement of opioid signalling in patients, so its outgoing edge is INDIRECT_UNKNOWN_INTERMEDIATES and its evidence item is PARTIAL.

    Not addressed, and stated rather than silently skipped: no diagnosis section (DSM-5-TR, SOGS, PGSI) and no clinical_trials entry for NCT01528007. Both were marked lower priority by the reviewer and are genuine additions rather than corrections.

    Validation: 18/18 snippets verified (up from 15), terms clean, pathograph 5 nodes / 5 edges / 1 component with all treatment and environmental targets resolving, all six offline gates clean.

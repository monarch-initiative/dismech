  summary: 'Create: Gambling Disorder'
  details: |
    New entry for gambling disorder (MONDO:0011662), the first and still only behavioural addiction placed in the DSM-5 substance-related and addictive disorders chapter.

    Deep research: claude_code provider, 52/52 references resolved, confabulation_rate 0.0, no unresolved identifiers. 34 of 52 weighed on topic with none flagged off topic; the remaining 18 were undecided rather than cleared. Reference set assembled independently by direct PubMed search.

    GeneReviews baseline: checked and absent ('gambling GeneReviews[All Fields]' returns zero).

    The entry is organised around whether the DSM-5 reclassification holds up mechanistically. Its causal anchor is iatrogenic rather than observational: in a cross-sectional study of 3,090 treated Parkinson patients, dopamine agonists were associated with impulse control disorders at 17.1% versus 6.9% off agonist (OR 2.72, 95% CI 2.08-3.54), gambling specifically in 5.0%. That is a pharmacological manipulation of dopaminergic signalling in humans that produces the disorder - causal evidence few psychiatric diagnoses have.

    The iatrogenic and sporadic routes are curated as SEPARATE pathophysiology nodes rather than merged. They converge on the same behaviour but differ in what initiates it, and whether they are the same disorder is left as an open discussion rather than assumed in the graph.

    Two KNOWLEDGE_GAPs, both arguing against the entry's own convenient reading: (1) shared circuitry is weak evidence for a shared mechanism when the circuit mediates reinforcement generally; the discriminating fact is the iatrogenic arm, but agonists produce compulsive buying, eating and sexual behaviour at comparable rates in the same cohort, so what they release may be general appetitive disinhibition. (2) Nothing explains which of the four impulse control disorders a given patient develops.

    Treatment curated with efficacy and tolerability pointing opposite ways: nalmefene and naltrexone have the best evidence in a 16-RCT network meta-analysis (SMD -0.86 and -0.42) and ALSO significantly higher dropout due to side effects (ORs near 8). A third PARTIAL evidence item records that no drug holds a formal indication, so the treatment is not read as approved.

    HPO has no term for gambling; bound to HP:0100710 Impulsivity with a specific preferred_term and a note saying the binding is not a definition. MONDO's label is the DSM-IV name 'pathological gambling'; preserved verbatim in term.label with the current name in preferred_term, and the rename explained in notes since it accompanied the reclassification this entry is about.

    Validation: just validate passed with 15/15 snippets verified on the first attempt, just validate-terms passed, and check-duplicate-keys, folded-hyphen, snippet-length, environmental-evidence, title-snippet and cache-order gates all clean.

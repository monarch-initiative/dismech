  summary: Wire PCK1 deficiency to the hepatic gluconeogenesis failure module
  details: |
    Declared conformance at four nodes along the module chain: Failure of Hepatic Gluconeogenesis -> hepatic_gluconeogenesis_failure#Failure of Hepatic De Novo Glucose Production (shares GO:0006094 and CL:0000182 with the module node), Fasting Hypoglycemia -> #Fasting Hypoglycemia, Neuroglycopenic Brain Injury -> #Neuroglycopenic Dysfunction, and Lactate Accumulation -> #Lactate Overproduction. The last of these is reported process_absent because the entry binds GO:0006089 lactate metabolic process where the module binds the narrower GO:0019249 lactate biosynthetic process; the mechanism matches, and the module's own description names PEPCK deficiency as the cleanest case of lactate arising as a true gluconeogenic substrate backup. Also removed a stale sentence from the entry notes stating that no conforms_to edge was added because the module file was not present on the branch and that wiring it was left to a follow-up. The module is now committed and this is that follow-up, so the sentence described repository state that no longer holds. No evidence, terms or bindings were changed.

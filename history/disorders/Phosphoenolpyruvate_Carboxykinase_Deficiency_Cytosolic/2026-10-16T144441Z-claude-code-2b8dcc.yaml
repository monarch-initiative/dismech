  details: |
    Review round 1 (PR #14472). BLOCKING: (1) added PMID:37924129 direct-quote evidence to the Acute intravenous glucose treatment (IV dextrose correcting hypoglycemia) and to Avoidance of fasting (the management sentence); (2) dropped the unsupported PCK2 peripheral-neuropathy claim in both the differential_diagnoses item and entry notes, describing PCK2 only as the mitochondrial PEPCK-M-encoding entity; (3) fetched and cited PMID:40092582 (Burg 2025) and PMID:41608521 (Vasilevska 2026): PCK1-specific hepatic steatosis (US fatty infiltration), acute liver failure with coagulopathy (Burg) and reversibility with continuous glucose (Vasilevska), new Hyperammonemia phenotype (HP:0001987, wired from Hepatocellular Metabolic Stress), and the c.978delC homozygous frameshift variant; (4) added a REFUTE evidence item on Hypoketotic hypoglycemia quoting the ketonuria observation so the hypoketotic claim is not absolute. SUGGESTIONS: added a CASES_IN_LITERATURE prevalence record (n=32, Goetz 2022), added Global developmental delay as a lasting sequela (HP:0001263, wired from Neuroglycopenic Brain Injury), and a notes line explaining the BEHAVIORAL modality on Nutritional support. Skipped: more specific NCIT/LOINC term for the urine organic acid diagnosis row (no specific NCIT term found via lookup; LOINC seed-cache skipped).

    and Congenital Scoliosis` downstream to `Hemivertebrae` and `Congenital Scoliosis`.

    - Added `genetic` (`TBX6` `hgnc:11605` null allele plus hypomorphic risk haplotype, PMID:25564734),
    `progression` (`Congenital onset` `HP:0003577`), `diagnosis` (`Spinal Radiography` `NCIT:C38101`,
    `TBX6 Copy-Number and Sequence Analysis` `NCIT:C153598`), `differential_diagnoses` (`Spondylocostal
    dysostosis` `MONDO:0000359`), and `references`.


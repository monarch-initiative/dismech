  details: |
    Answering the ai4c-reviewer CHANGES_REQUESTED review on PR #11430 in a single push, per the repo's one-push convention. Blocking item 1 (model_scale): both Boolean-model modeled_mechanisms links declared model_scale TISSUE, which CLAUDE.md's own counter-example rules out - a Boolean network whose output node is named for a tissue outcome still observes only cellular state. Changed both to CELLULAR, added a SCALE_EXTRAPOLATION divergence to each explaining what the network actually computes, and set biological_scale TISSUE on the two target nodes (Papulopustular inflammation, Neurovascular vasodilation) so the audit gives a real answer instead of UNDETERMINED. just model-scale-audit now counts both links as 1-step upward extrapolations (the 1-step total moved 7 -> 9) and --strict still passes because both carry limitations and a typed divergence. Blocking item 2 (provenance overclaims): the LL-37 assessment said the manifest 'needed metadata field additions to pass the repository gate', which reads as an assertion that the gate passes; it does not, and the ETR bundle is the same. Both now state that field names are not a passing gate and record the residual inputs[].local_path failures, whose cause is that those paths point into the gitignored raw/ directory kept out of the tree by the never-commit-large-raw-downloads policy - a repository-wide tension between gate and policy, left failing rather than papered over. The phyma MANIFEST.yaml declares schema_version '1.0' while failing 13 gate checks; the manifest is the provider's, so it was left untouched (editing a provider artifact to assert conformance it lacks is the silent bundle repair this repo forbids) and the non-conformance is recorded in the assessor's own document instead. Suggestions taken in the same push: item 3, the ETR scenario's unreported false negative (telangiectasia is false in a scenario named for it, because the only curated route to angiogenic remodeling runs through LL-37 and LL-37 cannot be made without mites) added to the third finding, which is the sharper statement the reviewer identified; item 4, intermediate_mechanisms on the Demodex->TLR2 edge was carrying an epistemic caveat rather than a biological step, so it now names the actual intermediate (mite-secreted bioactive molecules engaging pattern-recognition signalling) and the cross-cell-type extrapolation moved into the edge description; item 5, the sibling Sebaceous gland dysfunction edge now carries an explicit directness DIRECT with the reason (SZ95 sebocytes are the sebaceous gland's own cell type), so the contrast with the INDIRECT TLR2 edge is legible rather than looking like an oversight; item 7 in part, publication PMID:25848978 set on geo:GSE65914 and PMID:32941918 on geo:GSE155141, both already cached and committed. Not taken this round, and said so on the PR: item 6 (burning/stinging, dry appearance and the ocular symptom set as new phenotypes) and the rest of item 7 (van Zuuren 2019 GRADE certainty on the treatment blocks, Nguyen 2024) are real content additions needing their own evidence curation, and item 8 (stale PR description) is handled by rewriting the PR body rather than by a commit. The CI failure on test (3.13) was this branch's: the curation-scope guard rejects a kb/ PR that also touches models/ and tests/, which the Boolean model necessarily does; the guard's own remedy is the scope-override label, which was applied and disclosed in the PR comment rather than worked around. Validated after the changes: just validate (schema+terms+references, 187/187 snippets), verify-datasets 17/17, check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-qualifier-terms, model-scale-audit --strict, the three hypothesis-assessment validators, 311 model/hypothesis/dataset/boolean tests, and the whole-KB snippet-length, title-snippet, folded-hyphen, snippet-grading and environmental-evidence sweeps.

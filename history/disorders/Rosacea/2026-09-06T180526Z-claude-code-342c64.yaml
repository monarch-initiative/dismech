  details: |
    The entry had no mechanistic_hypotheses block, which the hypothesis deep-research runner keys on. Added four EMERGING hypothesis groups, each seeded with evidence already cached in this entry and each naming the dataset that can test it: etr_lipid_metabolism_acsl5_macrophage (ETR; geo:GSE65914; tests whether the single-study ACSL5/ACADVL lipid-metabolism signature and its macrophage-marker correlation reproduce -- a confirmatory analysis of the PROVISIONAL node), ll37_nlrp3_il1b_papulopustular (PPR; geo:GSE155141; tests coordinate NLRP3/CASP1/PYCARD/IL1B/IL18 elevation in lesional explants and IL-1beta induction), gwas_loci_lesional_expression (all subtypes; geo:GSE65914; tests lesional expression of each GWAS locus gene by subtype and TLR1-TLR2 co-expression, the TLR1 heterodimer angle never previously examined), and phyma_fibroblast_identity (Phymatous; arrayexpress:E-MTAB-16629; asks whether rhinophyma fibroblasts carry the PTGDS pro-inflammatory signature of Chen 2024 or a scar-type myofibroblast signature). Five existing causal edges opted in via hypothesis_groups: ACSL5->Immune cell infiltration; LL-37 generation->NLRP3 Inflammasome Activation and NLRP3->Papulopustular inflammation; Pro-inflammatory Fibroblast Expansion->Neurovascular vasodilation and ->Immune cell infiltration. The GWAS hypothesis has no edges by design (it concerns genetic entries). The three GEO-backed hypotheses were launched with scripts/hypothesis_deep_research.py run openscientist ... --template templates/hypothesis_dataset_analysis.md, the execution-gated contract that requires downloaded data, a MANIFEST.yaml and replayable analysis.py, with prespecified contrasts and target-gene lists passed as runner flags; the ArrayExpress single-cell hypothesis cannot meet that GEOparse-based contract, and templates/hypothesis_deep_research_datasets.md turned out to be unusable because the runner never fills its candidate_datasets variable, so it was launched with the default templates/hypothesis_deep_research.md (the seed hypothesis YAML names arrayexpress:E-MTAB-16629 explicitly). Run outputs land under kb/hypotheses/Rosacea/<hypothesis_group_id>/ and are recorded in separate history entries once assessed. Validated after the edit: just validate (schema+terms+references, 161/161 snippets verified), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, and the 111 hypothesis-related pytest checks.

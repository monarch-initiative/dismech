  summary: Promote NLRP3 mouse evidence, reword ETR hypothesis after dataset runs,
    add facial LL-37 and Demodex rabbit models
  details: |
    Follow-ups from the two assessed OpenScientist runs, plus an animal-model sweep. (1) Promoted PMID:33745908 (Antimicrobial Peptide LL-37 Drives Rosacea-Like Skin Inflammation in an NLRP3-Dependent Manner) onto the 'LL-37 generation' -> 'NLRP3 Inflammasome Activation' edge as two DIRECT items (MODEL_ORGANISM: caspase-1 activation and ASC specks in Nlrp3-expressing but not Nlrp3-deficient mice; IN_VITRO: LL-37 drives NLRP3 inflammasome activation in LPS-primed macrophages) and onto the node (abrogation in Nlrp3-deficient mice); added a node note recording that the GSE155141 run found no lesional-vs-non-lesional transcript change in the inflammasome module, so the node's support now rests mainly on the mouse loss-of-function evidence. (2) Reworded hypothesis etr_lipid_metabolism_acsl5_macrophage from 'drives M1 macrophage infiltration' to 'accompanies, and may promote, macrophage infiltration', and recorded the run's result in its notes (ACSL5/PPARG/ACADVL up, CPT1A flat, all three macrophage markers up, no within-ETR ACSL5-marker correlation, CD86/CD163 skew toward M2). Recorded the NLRP3 run's result in that hypothesis's notes likewise. (3) Animal models, from a PubMed sweep of rosacea model papers (12 reviews/primary hits screened; PMID:39177851 had no retrievable abstract and was not used): added 'Facial LL-37 injection mouse model with trigeminal readouts' (PMID:36517318; LL-37 injected into the face, pruritus behaviour, TRPV4/TRPM8 up in skin and trigeminal ganglion; RECAPITULATES 'TRP and neuropeptide signaling' with a readout) -- the only rodent model at the facial site -- and 'Demodex mite injection rabbit model' (PMID:36177392; Japanese rabbits, erythematous papules, telangiectasia, granuloma-like structure; PERTURBS 'Demodex Folliculorum Proliferation' with BOUNDARY_OMISSION and SPECIES_MISMATCH divergences, PARTIALLY_RECAPITULATES 'Papulopustular inflammation' with the granulomatous caveat). Added two links to the existing LL-37 model from PMID:40296272 (long-term induction: RECAPITULATES 'Angiogenic vascular remodeling', PARTIALLY_RECAPITULATES 'Sebaceous gland and soft tissue hyperplasia/fibrosis', fidelity LOW). The Demodex-extract mouse lipidomics model (PMID:41770444) was fetched but not added as a model; its P-AKT/FOXO1 lipid finding is a lead for the ACSL5 node. Validated: just validate (schema+terms+references, all snippets verified), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, model-scale-audit --strict, the animal-model/readout/divergence/hypothesis pytest checks, and the whole-KB snippet-length, title-snippet, folded-hyphen and snippet-grading sweeps.

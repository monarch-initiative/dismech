  details: |
    Assessed the OpenScientist execution-gated run for hypothesis ll37_nlrp3_il1b_papulopustular (kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/, provider job 6c1e56ea-88a4-4a32-958e-d3efc650b0a1, 797 s). Result: IL-1beta raises NLRP3 mRNA in non-lesional PPR explants (paired t p=0.025, dz=1.57, fold 1.19; BH q=0.196; Wilcoxon p=0.125), with IL1B and IL1RN trending up; the lesional-vs-non-lesional contrast is null for all eight target genes and CAMP/KLK5 are flat in both. Verdict PARTIALLY_SUPPORTED: transcript-level priming is consistent with the hypothesis, the steady-state lesional inflammasome module is not reproduced (relevant to the NLRP3 node, which rests on Casas 2012), and the post-translational steps are untestable here. Provenance: the runner's artifact download dropped MANIFEST.yaml, analysis.py and environment.txt because deep-research-client's OpenScientist provider admits only an extension allowlist (.csv/.md/.html/.pdf/images) -- a tooling defect worth an issue; the full artifacts zip was re-fetched from the provider API and the three files restored, and six flattened duplicate copies were removed after byte-identity checks. The provider manifest lacked the identifier/canonical_url/retrieved_at input keys and provider field the gate requires; these were added as duplicates of the provider's own values and the correction recorded in the manifest's assessor_corrections block with the pre-correction sha256 (61a37e19...). No input, code or output bytes changed. Independent clean replay with the pinned versions (numpy 2.3.5, pandas 3.0.3, scipy 1.17.1, statsmodels 0.14.6) regenerated samples.csv and gene_results.csv byte-identically. Report rebound to the corrected manifest; just validate-hypothesis-analysis-run passes. Post-lock citations PMID:33745908 (LL-37 drives rosacea-like inflammation in an NLRP3-dependent manner; Nlrp3-deficient mice, MCC950) and PMID:39133985 were fetched and their quotes verified; PMID:33745908 is flagged in the assessment as a promotion candidate for the LL-37 -> NLRP3 edge. Assessment sidecar: assessments/openscientist-assessment-by-claude-code.yaml. No change to kb/disorders/Rosacea.yaml in this session.

  summary: Add five GEO datasets to Rosacea (mTORC1/cathelicidin, gabapentin DRG,
    MR ocular model, GluK2 mast cell, Demodex ILC2)
  details: |
    Ran just discover-datasets Rosacea --limit 25: 13 DIRECT and 12 GENE_ONLY candidates. The 4 datasets already curated (GSE65914, GSE155141, GSE303282, GSE277020) were the top 4 DIRECT hits. Triaged the remaining 9 DIRECT candidates by reading each cached GEO summary. Added 5: geo:GSE147950 (mouse LL-37 model, mTORC1/cathelicidin loop, PMID:33734592), geo:GSE308876 (mouse LL-37 model skin+DRG, gabapentin, CGRP/NOS neurovascular program; no linked publication on the record), geo:GSE291177 (rat UVB ocular rosacea model, MR-overexpressing meibomian glands; companion to GSE277020; no linked publication), geo:GSE268986 (GluK2 agonist mast-cell study validated in murine dermatitis and rosacea models, PMID:39661706; rosacea is one of two models, recorded in description), geo:GSE197981 (mouse Demodex commensalism/ILC2-IL-13 study linked to human rhinophymatous rosacea, PMID:36044899; supports the Demodex Folliculorum Proliferation node added in the previous session). Each record carries evidence quoting the cached GEO summary and citing GEO:<ID> (the Acne_Vulgaris pattern), a publication PMID where the record lists one, and organism/data_type/sample_count/conditions. Skipped: GSE198657 and GSE197982 (n=4 sibling sub-series of GSE197981; noted in that record), GSE328751/GSE328467 (lenvatinib-treated Treg adoptive transfer across IBD/psoriasis/rosacea models -- a Treg cell-therapy study in which rosacea is one of three disease models, judged too peripheral), and all 12 GENE_ONLY hits (IRF1/SLC22A5/GZMK/MSR1 matches in IBD, HCC, Sezary syndrome, microglia -- Named Entity Confusion via the entry's GWAS genes). Uncited GEO cache files fetched during triage were removed before commit. Validated: just validate (schema+terms+references, 119/119 snippets verified, up from 114/114), just verify-datasets kb/disorders/Rosacea.yaml (9/9 OK), pytest -k dataset guard (pass). An Edison (falcon) deep-research report was commissioned in this same session and is recorded separately.

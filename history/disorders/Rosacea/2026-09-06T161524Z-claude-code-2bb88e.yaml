  details: |
    Augmented the existing Rosacea entry using leads from the previously-generated but unconsumed Asta deep-research report (research/Rosacea-deep-research-asta.md, 17 papers). Cross-checked the report's 17 PMIDs against the KB entry and found Demodex folliculorum mite biology and a 2025 ACSL5/lipid-metabolism transcriptomic study were absent despite being real, well-supported mechanisms. Added: (1) a new pathophysiology node 'Demodex Folliculorum Proliferation' (PMID:23171449 quantitative PCR density study, PMID:29532463 in-vitro sebocyte/TLR modulation, PMID:33095403 review), with downstream edges into the existing 'TLR2 upregulation' and 'Sebaceous gland dysfunction' nodes; (2) a new subtype-tagged (Erythematotelangiectatic Rosacea), mechanism_confidence:PROVISIONAL node 'ACSL5-Mediated Lipid Metabolism Dysregulation' (PMID:40195491, single-study WGCNA + mouse-model bioinformatics finding), with an indirect (co-localization, not causal-perturbation) downstream edge into the existing 'Immune cell infiltration' node; (3) a target_mechanisms link on the existing 'Papulopustular-directed pharmacotherapy' treatment (which already lists ivermectin) pointing at the new Demodex node, using PMID:33095403's acaricidal-therapy statement (directness: INDIRECT since ivermectin is not named verbatim in that source). Sourced the two new PMIDs beyond the Asta report's own list (PMID:23171449, PMID:29532463) via a targeted PubMed search for Demodex/TLR2 mechanistic papers, since the Asta report itself only mentioned Demodex in passing (ROSCO consensus, ocular-rosacea review) without a dedicated mechanistic citation. Left the report's remaining unused papers (TCM/network-pharmacology studies on Gyejibokryeong-hwan and Huperzine A, and generic pathogenesis reviews largely restating content already cited) out as lower-value/non-novel for this entry. Validated: just validate (schema+terms+references, 114/114 snippets verified, up from 107/107), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-environmental-evidence (all pass for this file); just check-enum-values, just validate-disorders (all pass for this file); just check-folded-hyphens, just check-snippet-length, just check-title-snippets, and just check-snippet-grading (whole-KB, all pass, no new baseline entries). Ran an adversarial subagent review (fresh context, before opening a PR) against the diff and the cited reference caches: it found the Demodex->'TLR2 upregulation' edge was marked causal_link_type DIRECT despite the cited evidence being a sebocyte-specific in-vitro study against a node text-scoped to keratinocytes (an extrapolation the evidence item's own explanation already flagged as directness:INDIRECT) -- fixed by changing that edge to INDIRECT_KNOWN_INTERMEDIATES with an intermediate_mechanisms note naming the sebocyte-to-keratinocyte extrapolation. Re-validated after the fix (114/114 snippets still verified). The review's other two observations (SUPPORT on a correlative-only ACSL5 edge; evidence_source:HUMAN_CLINICAL on a review article's synthesis prose) were judged acceptable: the first matches the schema's own supports/directness split (SUPPORT via an inference step is exactly what directness:INDIRECT exists for), and the second matches pre-existing file convention already applied to PMID:28150107 elsewhere in this entry, so left unchanged.

  summary: 'Add rosacea GWAS: 23andMe HLA/pigmentation/IL13 loci as genetic entries,
    MVP dbGaP summary-statistics dataset'
  details: |
    Prompted by the question of whether rosacea has GWAS and non-GEO datasets. GWAS Catalog (EFO -> MONDO:0006604) lists ~17 rosacea studies, all biobank phenome-wide scans; queried each large one's associations via the Catalog REST API. Only the Million Veteran Program European-ancestry analysis (GCST90476178, Verma 2024, PMID:39024449; 14,815 cases / 427,372 controls) has genome-wide significant hits (8): rs6866614 IRF1/CARINH, rs12203592 IRF4, rs12898729 HERC2, rs5743618 TLR1, rs10806180 near ELOVL4, plus three position-only signals. UKB WGS 2025, UKB exome (Backman 2021), FinnGen/Fitzgerald 2022, Genes & Health 2026 and the MVP Hispanic analysis report zero. The two dedicated rosacea GWAS (23andMe: Chang 2015 PMID:25695682; Aponte 2018 symptom-severity PMID:29771307) never deposited summary statistics, so they cannot be dataset records. Curated accordingly: (1) nine new genetic entries typed relationship_type SUSCEPTIBILITY with exact abstract quotes -- HLA-DRA, BTNL2 (rs763035 lead SNP recorded as a variant with dbSNP identifier, plus the IHC perifollicular-infiltrate finding), HLA-DRB1/HLA-DQB1/HLA-DQA1 (the *03:01/*02:01/*05:01 8.1-haplotype alleles, non-independence noted) from Chang 2015; IRF4, HERC2 (HERC2-OCA2), SLC45A2, IL13 from Aponte 2018, with the flanked regions PSMB9-HLA-DMB, NRXN3-DIO2, OVOL1-SNX32 and near-threshold MC1R rs1805007 left in notes rather than promoted to gene entries. HGNC IDs resolved with runoak sqlite:obo:hgnc. (2) One dataset record dbgap:phs001672 (data_type GWAS, sample_count 442,187, publication PMID:39024449) following the Binge_Eating_Disorder MVP precedent, but with NO evidence block: the cached full text of the 2,068-trait atlas contains zero occurrences of 'rosacea', so nothing is quotable; the Catalog loci are recorded in notes as provenance because the GWAS Catalog has no reference prefix in this repository (a tooling gap worth an issue). Noted in the record that the MVP African-ancestry analysis (GCST90480451, 410 cases) reports nine hits dominated by pigmentation SNPs, read as ancestry stratification rather than replication and deliberately not curated as genes. Cross-links recorded in notes only: MVP IRF4/HERC2 hits replicate the 23andMe loci; MVP IRF1 hit independently corroborates the existing MR-derived IRF1 entry; TLR1 (TLR2 heterodimer partner) is flagged as mechanistically relevant to the TLR2 chain; IL13 is tied to the ILC2/IL-13 Demodex checkpoint dataset GSE197981. Three short Aponte per-locus snippets were lengthened to the full effector-gene sentence pre-emptively to stay above check-snippet-length's floor. Also launched just research-datasets openscientist Rosacea for non-GEO repositories (result to be recorded separately if it yields anything). Validated: just validate (schema+terms+references, 133/133 snippets verified, up from 119/119), just verify-datasets (10/10 OK), check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets, check-term-cache-integrity, check-cache-order; whole-KB check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading.

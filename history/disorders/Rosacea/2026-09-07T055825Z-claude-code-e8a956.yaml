  summary: Add a repository-authored Boolean model of the innate-immune axis, its
    runner, committed results and guard tests
  details: |
    The entry had no computational_models block. Checked first whether one could be curated from the literature: PubMed returns nothing for rosacea combined with boolean network, logical model, agent-based, mathematical model or in silico model, and the computational rosacea literature is entirely network pharmacology and molecular docking (nine hits, mostly traditional-medicine target prediction), so there is no published dynamical model of rosacea to curate. Authored one in-repo instead, which the KB already permits: 4 of its 103 computational models carry no publication, and models/urate_homeostasis.* in Gout is the worked precedent for a repo-authored model with committed source. Added models/rosacea_innate_boolean.yaml (declarative spec: 7 inputs, 3 interventions, 12 rules, 5 phenotype outputs), models/rosacea_innate_boolean.py (deterministic runner; standard library plus PyYAML; a small recursive-descent parser for the and/or/not rule language rather than eval; --check fails on stale results, --print summarises) and models/rosacea_innate_boolean.results.json (committed output, byte-stable, no timestamps). Every node carries a maps_to reference into this entry and every rule cites the curated edges it encodes, extracted programmatically from the file rather than from memory, so the model asserts no biology of its own; the two Boolean choices the edge list did not determine (AND at LL-37 generation because it is a proteolytic product needing substrate and protease; OR at papulopustular inflammation, the literal reading of three separately curated edges) are recorded as decisions in the spec and the second is flagged as the model's least safe assumption. Deliberately NOT wired to dismech-perturb and deliberately given no models/<id>.config.yaml: that runner executes SBML through tellurium and cannot run a logical network, and the config glob is what sets the runnable flag, so the models browser correctly reports this model as 'Reference only' (verified against ModelsExporter). Three findings recorded, two of which are curation leads rather than biology: no combination of the three groundable interventions switches off the papulopustular phenotype, because the entry curates exactly one treatment-to-mechanism edge (acaricide onto Demodex) and nothing acts on the barrier/STAT3/fibroblast immune-infiltration arm; removing mites alone clears only telangiectasia, because Demodex is the sole curated upstream of TLR2 so the model cannot make LL-37 without mites, while UV and barrier impairment are curated onto pro-cathelicidin transcription only; and the erythematotelangiectatic scenario produces papules and pustules, which is clinically wrong and shows the curated edges carry no subtype gating. Two modeled_mechanisms links (Papulopustular inflammation, Neurovascular vasodilation), both PARTIALLY_RECAPITULATES with fidelity LOW, typed divergences STRUCTURAL_IDEALIZATION (binary synchronous update erases dose, kinetics and severity), CALIBRATION_PROVENANCE (nothing is fitted to any data, including this entry's own transcriptomic series) and BOUNDARY_OMISSION (ocular, phymatous, fibrotic and gut-skin chains excluded; for flushing the omission is marked INVALIDATING because the actual triggers are not curated). Added tests/test_rosacea_boolean_model.py (5 tests): committed results current, healthy scenario silent, every maps_to resolves against the live entry so a node rename cannot silently strand the model's provenance, intervention targets exist, and rules reference only declared nodes. Validated: just validate (schema+terms+references, 187/187 snippets), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, model-scale-audit --strict, tests/test_models_export.py and tests/test_results_export.py (34 passed, confirming the new model does not disturb the perturb machinery), the 5 new tests, and the whole-KB snippet-length, title-snippet, folded-hyphen and snippet-grading sweeps. app/models/data.js deliberately not regenerated or committed, per the derived-artifact rule.

  summary: 'Non-GEO datasets from OpenScientist: rhinophyma scRNA-seq (ArrayExpress)
    and six skin/gut microbiome BioProjects'
  details: |
    Ran just research-datasets openscientist Rosacea (1009 s; research/datasets/Rosacea-datasets-openscientist.md with citations sidecar and final_report.html/pdf artifacts) to reach repositories the GEO-only discovery index cannot. Report validation: 19/19 references resolved, 0 unresolved; four flagged off-topic (PMID:34662886 and PMID:41896352 are biobank GWAS-Catalog studies and are in fact on topic; PMID:25218965 and GEO:GSE48824 are spurious keyword matches the report itself calls out), so needs_review is set but no confabulation. Its accession list was triaged in three steps: (1) resolution -- all 14 non-GEO candidates resolve with just verify-datasets --accession; (2) deduplication -- four BioProjects (PRJNA1294752, PRJNA622593, PRJNA648833, PRJNA861245) are the BioProject mirrors of GEO series already curated, dbgap:phs000308 is the GLAUGEN glaucoma study with rosacea as a covariate, SRP123456 and PXD000001 are template placeholders, and the GWAS-Catalog GCST accessions have no supported prefix (already handled in the GWAS session); (3) relevance -- read each remaining record's NCBI BioProject / ENA / BioStudies description and, where a paper exists, its abstract. Added seven records: arrayexpress:E-MTAB-16629 (rhinophyma vs hypertrophic scar vs healthy skin 10x scRNA-seq, released 2026-02-18, no publication; sample_count 3 is the repository's figure); bioproject:PRJEB37562 (facial bacterial+fungal microbiome by subtype; ENA holds only the study object with no reads, and the matching paper, Woo 2020 PMID:32533846, is not linked by the repository and has no retrievable abstract, so both facts are recorded in notes rather than as publication/evidence); bioproject:PRJEB82826 (multi-omics microbe-host study with 96 ENA amplicon runs, publication PMID:40220854, two abstract quotes attached -- the C. acnes/S. epidermidis dysbiosis signature and the finding that ivermectin response tracks mite clearance and host-transcriptome normalization, not microbiome normalization; sibling umbrella PRJEB82848 has no data and is noted, not recorded); bioproject:PRJDB18292 (independent pre/post-ivermectin 16S design, 24 SRA experiments, publication PMID:39481532 whose abstract could not be retrieved); bioproject:PRJNA1189573 and PRJNA1288008 (paired skin/blood/stool bacterial 16S and fungal ITS designs, 93 and 66 SRA experiments, sample sites bound to UBERON skin of face / blood / feces); bioproject:PRJNA1191396 (fecal 16S in neurogenic rosacea, 34 experiments). Sample counts for BioProjects are SRA/ENA experiment or run counts and are labelled as such. Skipped bioproject:PRJNA1056316 (AQP3 mouse model; one-line description, no publication) as too thin to describe. Two tooling gaps surfaced and left for issues rather than worked around: DatasetTypeEnum has no value for amplicon (16S/ITS) metagenomics, so those records omit data_type and say so in notes; and non-GEO prefixes cache nothing, so ArrayExpress/BioProject records can carry evidence only when a PubMed abstract exists. A possible follow-up not taken here: PMID:40220854 would support a cutaneous-dysbiosis pathophysiology node, but with no sourced edge to inflammation it was not added. Validated: just validate (schema+terms+references, 153/153 snippets verified, up from 151/151), just verify-datasets (17/17 OK), pytest dataset guard, check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, term-cache integrity/order, and the whole-KB snippet-length, title-snippet, folded-hyphen and snippet-grading sweeps.

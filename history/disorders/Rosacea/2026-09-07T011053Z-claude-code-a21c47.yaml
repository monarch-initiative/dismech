  summary: Add three NAM experimental_models (PPR explant, SZ95-Demodex co-culture,
    HaCaT keratinocyte) and the neurovascular-NAM knowledge gap
  details: |
    The entry had animal_models but no experimental_models, even though two non-animal models were already present as a dataset and as evidence on other blocks. Added three, each built only from sources already cited in the entry, each linked into the pathograph via modeled_mechanisms: (1) 'Paired lesional and non-lesional papulopustular rosacea skin explants' (experimental_model_type OTHER; the ex vivo human facial tissue behind dataset geo:GSE155141), RECAPITULATES 'Papulopustular inflammation' at TISSUE scale with a MAPK/TNF pathway readout, and PERTURBS 'NLRP3 Inflammasome Activation' via the IL-1beta-treated arm, whose readout carries the nominal NLRP3 priming result from this branch's own assessed dataset run rather than a publication (stated in the record's notes, since GSE155141 has no linked PMID). (2) 'SZ95 sebocyte and live Demodex mite co-culture' (CO_CULTURE, PMID:29532463), PERTURBS 'Demodex Folliculorum Proliferation' with a BOUNDARY_OMISSION divergence and an IL-8-versus-mite-number readout, PARTIALLY_RECAPITULATES 'TLR2 upregulation' (readout direction ALTERED, because the paper reports a biphasic time course) and 'Sebaceous gland dysfunction'. (3) 'HaCaT keratinocytes under simulated rosacea conditions' (CELL_LINE, PMID:39823143), RECAPITULATES 'TLR2 upregulation' with a TLR2/S100A9 protein readout; the record states that the publication characterizes the stimulus only as simulated rosacea conditions, so no specific trigger is asserted. Cell types bound to CL:0000317 (sebocyte), CL:0000312, CL:0000057, CL:0000097; explant tissue to UBERON:1000021. All were already in the term and enum caches from elsewhere in the KB, so this change produces no cache diff. Also added discussion gap_rosacea_innervated_vascularized_nam (KNOWLEDGE_GAP, OPEN), attached to the TRP/neuropeptide and neurovascular-vasodilation nodes and to the experimental_models section as a whole: none of the three NAMs contains sensory neurons or perfused microvessels, so the flushing and burning arm is reachable only in the facial LL-37 mouse. It carries a proposed innervated, vascularized skin-on-chip experiment with typed perturbations, readouts, controls and supporting/refuting outcomes. Recorded as an absence of published rosacea-specific application, not a model-human mismatch, since generic innervated skin-chip platforms exist. One pre-existing correction: the geo:GSE155141 dataset evidence was graded HUMAN_CLINICAL, but the profiled material is cultured ex vivo explants, which this repository classes as IN_VITRO and which its sibling in vitro keratinocyte dataset geo:GSE303282 already uses; check-snippet-grading surfaced the resulting one-sentence-two-values conflict and the grade was corrected at source rather than by re-grading the new copies. NOT done in this change: the Boolean computational model of the TLR2-KLK5-LL-37 axis discussed earlier remains unbuilt, so computational_models is still absent. Validated: just validate (schema+terms+references, 187/187 snippets verified, up from 175/175), check-duplicate-keys, check-entity-refs (including the empty-anchor experimental_models# reference and the kind#name targets inside the proposed experiment), check-enum-values, check-causal-targets, check-qualifier-terms, just model-scale-audit --strict, and 194 model/discussion/experiment/readout/divergence/snippet-grading tests.

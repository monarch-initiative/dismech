  details: |
    Assessed the OpenScientist run for hypothesis phyma_fibroblast_identity (kb/hypotheses/Rosacea/phyma_fibroblast_identity/, provider job 9f1eadfa-f311-45a0-9f20-6b28f47ef547; launched on the default literature template because templates/hypothesis_deep_research_datasets.md is unusable, see the earlier record). The provider nonetheless downloaded the E-MTAB-16629 rhinophyma / hypertrophic scar / healthy single-cell atlas (nine processed 10x files plus SDRF/IDF, logged with byte sizes) and ran an exploratory scanpy analysis. Result: PTGDS is lowest in rhinophyma fibroblasts (5.0% positive) and highest in healthy fibroblasts (54.5%), tracks quiescent markers CFD/APOD, and PTGDS-high rhinophyma cells are endothelial -- the biomarker half of the hypothesis fails to transfer; rhinophyma fibroblasts are ACTA2-activated but POSTN/CTHRC1-low (3.1% vs 46.4%, 8.0% vs 43.4% in scar) with CCL19/CXCL12/CCL2 above scar levels -- the non-scar-myofibroblast identity half holds in qualified form. Verdict PARTIALLY_SUPPORTED. All computational claims rest on one donor per condition, marker-score lineage assignment, a proxy for the papulopustular signature (Chen 2024 has no public accession), and possible ambient-RNA spillover; the committed script does not regenerate the result tables, a Leiden step failed on the executor limit, one figure is local-only, so analyses are classified PARTIAL/PARTIALLY_AUDITABLE and no replay was attempted (this template carries no execution gate). Retro-fitted the report's reference validation with just validate-research-reference: 12/12 resolved, none unresolved, one flagged as possibly off-topic (PMID:24206029, a rhinophyma case study, which is on topic). Fetched PMID:25421393, 20531985, 40478772, 42423091 and 31066603 and verified the report's candidate snippets; the PMID:40478772 snippet elides part of its sentence and is noted as needing the full quote. Bundle recovery as in the other runs (issue #11254): MANIFEST.yaml, environment.txt, code/, logs/ and results/ restored from the provider API zip, five flattened duplicates removed after byte-identity checks; the manifest was left exactly as the provider wrote it, and committed results and code match its checksums. Entry change: the hypothesis label was reworded to drop 'PTGDS-high' and describe an inflammation-associated, POSTN/CTHRC1-low activated fibroblast state, and the run result was recorded in the hypothesis notes. Assessment sidecar: assessments/openscientist-assessment-by-claude-code.yaml.

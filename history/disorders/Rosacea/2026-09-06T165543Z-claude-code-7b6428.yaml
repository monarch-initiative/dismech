  details: |
    Commissioned an Edison/falcon deep-research report (just research-disorder falcon Rosacea; 885 s; research/Rosacea-deep-research-falcon.md with citations sidecar and one markdown artifact, artifact-00.md, a structured assertion table). Report validation: 13/13 references resolved, 0 unresolved, 0 off-topic; term validation 27/27 resolved with one 'mislabel' that is the template placeholder ('if available') for MONDO:0006604, not a real error. just preflight-dr: MONDO records no causal gene for rosacea so the gene-identity check cannot discriminate; top report genes (KLK5, TLR2, IRF4, NLRP3, PTGDS) are all rosacea-appropriate, no Named Entity Confusion signal. The report's references were DOI-keyed; mapped them to PMIDs via the PMC ID converter and PubMed and cited PMIDs throughout (10.3390/cosmetics11010011, MDPI Cosmetics, has no PubMed record and was not cited). Against the existing entry the report exposed four gaps, curated as: (1) prevalence -- the entry had no prevalence block; added two POINT_PREVALENCE records (worldwide pooled 5.46%, 95% CI 4.91-6.04, rate_per_100000 5460 with rate_low/high; dermatology outpatients 2.39%) from the Gether 2018 meta-analysis (PMID:29478264), with the ascertainment-method caveat quoted. (2) animal_models -- the entry had none; added the LL-37 intradermal injection mouse model (founding paper Yamasaki 2007 PMID:17676051; current protocol Zhang 2023 PMID:37185701) with three modeled_mechanisms links: PERTURBS 'LL-37 generation' (fidelity MODERATE, model_scale TISSUE, BOUNDARY_OMISSION + SPECIES_MISMATCH divergences, both QUALIFYING), RECAPITULATES 'Immune cell infiltration' with an H&E readout, and PARTIALLY_RECAPITULATES 'Fibrotic dermal remodeling' (fidelity LOW) with a collagen/alpha-SMA/COL1 readout; the description cross-references datasets geo:GSE147950 and geo:GSE308876, which derive from this model. (3) 'NLRP3 Inflammasome Activation' pathophysiology node (GO:0044546, GO:0032611, both INCREASED) with a new DIRECT edge from the existing 'LL-37 generation' node (Shi 2026 review PMID:42325915 full-text sentence; Zhang 2023 second-hand mouse NLRP3-dependence, directness INDIRECT) and an INDIRECT_KNOWN_INTERMEDIATES edge to 'Papulopustular inflammation' (Casas 2012 PMID:23171449 NALP-3/CASP-1 over-expression, PPR-enriched). (4) 'Pro-inflammatory Fibroblast Expansion' node (CL:0000057, subtype Papulopustular Rosacea) from the 2024 Nature Communications single-cell atlas (Chen 2024 PMID:39384741): DIRECT edge to 'Neurovascular vasodilation' (fibroblasts as the leading vasodilative-signal source) and INDIRECT edge to 'Immune cell infiltration' (fibroblast depletion / PTGDS knockdown blocks disease in mice, MODEL_ORGANISM, directness INDIRECT). Chen 2024's single-cell data were searched for a repository accession in the cached full text and none was found, so no dataset record was added. Not taken from the report: the Liang 2024 integrated bioinformatics gene list (computational associations, no causal claim), the pDC/type-I-interferon microbial branch and the gut/SIBO axis (review-level assertions without a primary quotable source in the cache), and the Demodex rabbit model (no primary citation given). Also removed a validator-written case-duplicate cache file (DOI_10.2147_ccid.s391705.md) that would break a case-insensitive checkout; the PMID cache (PMID:38283794) is what the entry cites. Validated: just validate (schema+terms+references, 151/151 snippets verified, up from 133/133), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, just model-scale-audit, the model-link/readout/divergence pytest checks, and the whole-KB snippet-length, title-snippet, folded-hyphen and snippet-grading sweeps.

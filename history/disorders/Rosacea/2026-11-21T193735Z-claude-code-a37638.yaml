  summary: Type the five MR-prioritised proteins from PMID:40890957
  details: |
    Mao et al. 2025 (PMID:40890957) prioritised five serum proteins by two-sample and SMR Mendelian randomisation: four (ABHD14B, CHMP6, DBNL, MCFD2) that inhibit rosacea onset and one (MSR1) that promotes it. Their genetic records carried that direction only in association text. Set relationship_type: PROTECTIVE on the four protective records and RISK_FACTOR on MSR1, so the five records from the one study are typed together. Evidence, notes and association text are unchanged. The protective records were identified by the prose-only census in docs/reports/protective-modifier-sources-2026-11-05.md.

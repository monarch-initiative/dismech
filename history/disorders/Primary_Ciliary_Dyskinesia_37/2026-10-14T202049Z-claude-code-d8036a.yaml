  summary: 'Create: Primary Ciliary Dyskinesia 37 (DNAH1)'
  details: |
    New entry for CILD37 (MONDO:0033204), the DNAH1-related form of primary ciliary dyskinesia, kept separate from Spermatogenic_Failure_18 (MONDO:0054615, same gene, sperm-only MMAF), which is cross-referenced as a differential and was not edited. Deep research: the requested falcon provider failed authentication (503) on two attempts, including with --fallback, so the report used is research/Primary_Ciliary_Dyskinesia_37-deep-research-claude_code.md; just preflight-dr against MONDO:0033204 returned PASS. Phenotypes come from the single index family (PMID:25927852, full text cached): Kartagener triad, chronic rhinitis, cough, wheezing, bronchitis, mild conductive hearing loss, female infertility. Respiratory mechanism nodes rest on Dnah1 knockout mouse data (PMID:11371505) and the localisation of DNAH1 to inner arm IDAd in human respiratory cilia (PMID:39056782); the family had no ciliary studies. Male infertility and reduced sperm motility are recorded as expected from SPGF18 (PMID:24360805) and the mouse, not observed in CILD37. ClinGen rates DNAH1 Limited for generic PCD (MONDO:0016575), so no gene_disease_validity was recorded. Validated with just validate, count-verified-snippets (all verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

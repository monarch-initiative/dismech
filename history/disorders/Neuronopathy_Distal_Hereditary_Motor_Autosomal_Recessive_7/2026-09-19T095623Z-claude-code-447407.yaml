  summary: 'Review round 1: add post-hoc deep-research cross-check and literature
    provenance (PR #12291)'
  details: |
    Review round 1 on PR #12291 (ai4c-reviewer, CHANGES_REQUESTED, 2026-09-19).

    One blocking finding, procedural: the new entry shipped no
    research/*-deep-research-*.md artifact, which .claude/skills/dismech-pr-review
    states as a MUST for new entries, and the absence was not signalled in notes:,
    review_notes:, or the history record. The reviewer verified that the only
    family-level report, Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive
    -deep-research-falcon.md, contains zero mentions of VWA1 or WARP and so
    provides no coverage; that was independently re-confirmed here by grep. The
    reviewer explicitly recorded that the entry is NOT under-consumed on any
    Content-Completeness dimension, so the gap was provenance, not content.

    Accepted. Both remedies the reviewer offered were taken rather than one:

    First, a deep-research pass was run as a post-hoc cross-check and committed:
    research/Neuronopathy_Distal_Hereditary_Motor_Autosomal_Recessive_7-deep-research-claude_code.md
    plus its .citations.md sidecar (provider claude_code, 197 s, 12 citations; no
    _artifacts/ directory was produced). It is explicitly a cross-check, not a
    source — the entry was curated before it existed and nothing in the entry was
    taken from it. just preflight-dr returns PASS against MONDO:0030977 with VWA1
    mentioned 37 times and the OMIM id matching. The outcome is that it found
    NOTHING NEW: it cites exactly the same eleven PMIDs the manual sweep had
    already curated, plus PMID:41416782, a 2026 Muscle Nerve letter whose cache
    has content_type: unavailable, so only its title is obtainable.

    Its own validation recorded 15/15 references resolving, confabulation rate 0.0,
    but needs_review: true on both reference and term validation. All three flags
    were checked rather than trusted. The one unsupported quote is an
    ellipsis-elided paraphrase attributed to PMID:39502942 that replaces "with
    VWA1-related disorder," with an ellipsis; the verbatim sentence was already
    quoted correctly in progression[0] and no change was needed. The two
    mislabelled terms are MONDO:0030977 reported as "MONDO" and GO:0000184 reported
    as "NMD", both the report abbreviating rather than misbinding.

    Two report claims were refused. It assigns VWA1 to cytogenetic band 1p36.33;
    the only band string in any cited cache is a bare "1p36" in PMID:33559681, and
    it appears there in a sentence about 1p36 deletion syndrome rather than as a
    locus assignment, so the sub-band is unsupported at that precision. It also
    reports an in-frame deletion in the variant spectrum; the 2024 cohort
    enumerates 3 stop-gains, 7 frameshifts and 3 proline missense changes among its
    13 additional variants, and grep for "in-frame" returns nothing across all
    eleven cited cache files.

    Two report suggestions were accepted after independent lookup and are now bound
    on the Depletion of WARP from Nerve and Muscle Basement Membrane node:
    GO:0005604 basement membrane as a cellular_components entry (confirmed present
    and under GO:0005575 via runoak against both the local build and ols:), and
    UBERON:0001134 skeletal muscle tissue added to locations (confirmed under
    UBERON:0001062). Binding the basement-membrane compartment is a real gain: the
    node named it in prose without grounding it, and this is a basement-membrane
    disease.

    The report's title-only claim that a 2026 case adds minipolymyoclonus and
    fasciculations to the phenotype was NOT written in. A title is not a finding
    and the cache holds no body, so it is filed as a CURATION_TODO discussion
    (vwa1_2026_minipolymyoclonus_case_full_text) naming what full text would be
    needed to resolve it. references_cache/PMID_41416782.md is committed alongside
    so a later curator can see the empty body rather than re-fetching to find out.

    Second, the manual literature provenance was lifted to a top-level notes: item
    (5). It names the five PubMed queries actually run and their record counts,
    re-confirmed against E-utilities on 2026-09-19: VWA1[Title/Abstract] = 46,
    VWA1[Title/Abstract] AND neuropathy = 6,
    VWA1 AND (therapy[sb] OR treatment OR trial) = 10,
    WARP[Title] AND (nerve OR basement membrane OR Vwa1) = 10,
    genereviews[book] AND VWA1 = 0. It also records the two records fetched and
    then dropped for having no quotable cached content (PMID:33693694,
    PMID:41416782), whose cache files were deliberately not committed.

    Non-blocking suggestion accepted: the PR description said the Bookshelf index
    holds 959 chapters where it holds 958. The YAML had already been corrected in
    c24334a02; only the PR prose was stale, and it was edited in place rather than
    pushed, since a body edit is not a commit.

    Nothing was conceded on content. The reviewer raised no content findings and
    positively endorsed the two-hypothesis-group modelling of the neuromyopathy
    nosology dispute, the atomic 8-node pathograph, the FAILS_TO_RECAPITULATE
    mouse link with its REFUTE evidence item, and the NCIT device-qualifier pair.

    The reviewer's own snippet checker flagged 1 of 129 snippets
    (PMID:39502942, a quote eliding a trailing "(Fig. 1H)" figure callout) and the
    reviewer deferred to the repository validator, calling it a false positive of
    stricter normalisation. Re-checked here: just validate-disorders reports
    129/129 snippets verified and the repository's
    literal_bracket_patterns configuration strips numeric and figure callouts
    before matching, so no change was made.

  summary: 'Create: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 7 (MONDO:0030977,
    VWA1)'
  details: |
    Created kb/disorders/Neuronopathy_Distal_Hereditary_Motor_Autosomal_Recessive_7.yaml
    for HMNR7 / HMNMYO (MONDO:0030977), caused by biallelic loss-of-function
    variants in VWA1 (hgnc:30910), which encodes the extracellular matrix protein
    WARP.

    entry_type decision: DISEASE. MONDO:0030977 was absent from kb/ on main; VWA1
    appeared only inside a quoted EMG snippet in
    Distal_Hereditary_Motor_Neuronopathy_Type_2A.yaml (HSPB8, autosomal dominant,
    no has_subtypes rows). The MONDO parent MONDO:0015363 is curated as
    Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive, whose has_subtypes
    rows cover HMNR1/IGHMBP2, HMNR2/SIGMAR1, HMNR4/PLEKHG5 and RTN2 but not HMNR7.
    A standalone entry was chosen because the causal gene is a basement-membrane
    matrix protein rather than a motor-neuron housekeeping protein, the neuropathy
    is non-length-dependent, and it carries a myopathic component the family
    template does not; SMARD1/HMNR1 is the existing precedent for an entry that is
    both a subtype row on that umbrella and a Disease entry of its own.

    Pathograph: biallelic VWA1 truncating variants -> nonsense-mediated decay and
    absent WARP protein -> depletion of WARP from nerve and muscle basement
    membrane -> impaired motor axon outgrowth and neuromuscular junction formation
    -> non-length-dependent motor axon loss -> chronic neurogenic denervation of
    skeletal muscle -> myopathic change in skeletal muscle. A parallel contested
    node, Muscle Extracellular Matrix Remodeling, feeds the same myopathic-change
    node under the alternative hypothesis.

    The primary-versus-secondary myopathy question is unsettled in the literature
    and is curated structurally: two mechanistic_hypotheses groups
    (denervation_secondary_myopathy CANONICAL, primary_muscle_matrix_lesion
    ALTERNATIVE), causal edges opted into each, and a CONTROVERSY discussion with
    the evidence on both sides and what would settle it. A second KNOWLEDGE_GAP
    discussion records the unexplained upper motor neuron signs.

    No conforms_to declared. peripheral_axonal_degeneration was rejected because
    its chain terminates in a length-dependent nerve-fibre-dysfunction node and
    non-length-dependence is this disease's defining feature.
    neuromuscular_transmission_failure was rejected because it requires fatigable
    weakness with a decremental response, and neither appears in any of the five
    cached VWA1 sources.

    Evidence: 129 snippets, all verified against cached references. Eleven
    references cited; PMID:19279005 and PMID:18314316 (the primary WARP knockout
    and reporter-gene localisation papers) were fetched so the basement-membrane
    and negative-muscle findings could be cited as primary results rather than as
    background restatements in the human-disease papers. Quotes restated by a
    citing paper carry quote_role: BACKGROUND, and review statements carry
    REVIEW_SYNTHESIS.

    Two histopathology finding_terms were left unbound because HP:0100297 and
    HP:0100298 are outside the NCIT-rooted HistopathologyFindingTerm enum; the HP
    terms are bound instead on matching category-Histopathology phenotypes,
    following Bethlem_Myopathy and Ullrich_Congenital_Muscular_Dystrophy.

    GeneReviews baseline: no chapter exists. Verified offline against
    cache/bookshelf/genereviews.csv and online with genereviews[book] AND VWA1,
    which returns zero records.

    Deliberately not done, both warranted as follow-ups: a matching has_subtypes
    row on the recessive umbrella entry, and membership of this entry in the
    Distal_Hereditary_Motor_Neuropathies grouping. Both edit heavily-referenced
    shared files that other curation PRs are open against.

    Validation on the pushed tree: validate-disorders passed (129/129 snippets),
    validate, validate-terms, check-entity-refs, check-causal-targets,

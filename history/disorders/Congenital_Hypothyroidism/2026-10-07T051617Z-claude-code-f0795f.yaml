  details: |
    Extended the existing Newborn screening (TSH-based) diagnosis row with a MeasurementDescriptor bound to LOINC:29575-8 Thyrotropin [Units/volume] in DBS (label read from the Monarch KG) and two reference ranges on that code with screen-negative/screen-positive bands in UCUM m[IU]/L: Republic of Ireland national programme cut-off 8 mU/L (PMID:29804122) and Republic of Macedonia national programme cut-off 10 mU/L (PMID:25192932), each quoting the source sentence. The T4-primary strategy is not bound because the entry row and cited sources are TSH-based; the DBS T4 code LOINC:31144-9 is named in notes. Added loinc_term LOINC:29575-8 on the existing Elevated TSH marker, whose context names newborn screening. The Low Free Thyroxine marker describes serum diagnostic evaluation and was left alone. Cache rows seeded and normalized. Validated with just validate, validate-terms, count-verified-snippets (103/103), check-duplicate-keys, check-entity-refs, the LOINC schema pytest, a scratchpad render, and the batched validate-disorders sweep.

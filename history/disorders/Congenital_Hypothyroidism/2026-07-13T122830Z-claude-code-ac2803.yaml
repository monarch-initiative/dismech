  summary: Wire minimal HPT feedback model for perturbation analysis
  details: |
    Added a KINETIC computational_models entry to Congenital_Hypothyroidism.yaml binding a minimal two-state (TSH, free T4) hypothalamic-pituitary-thyroid negative-feedback model authored in Antimony (models/hpt_feedback_axis.ant, exported to hpt_feedback_axis.xml SBML) and wired for dismech-perturb. Variables TSH/FT4 with HP threshold mappings (Elevated TSH HP:0002925, Hypothyroidism HP:0000821, Hyperthyroidism HP:0000836 for over-replacement), eight congenital-hypothyroidism gene perturbations (TPO/TG/DUOX2/SLC5A5/TSHR/PAX8/NKX2-1/FOXE1 -> thyroid secretory capacity S_thy), modeled_mechanisms, and COMPUTATIONAL evidence citing the Eisenberg-DiStefano HPT feedback-control simulator (PMID:18844475) with verified abstract snippets. Config sidecar (models/hpt_feedback_axis.config.yaml) uses S_thy as the disease-severity dial (baseline 1.0 = euthyroid) with disease scenarios (subclinical/overt/athyreosis/central) and levothyroxine treatment scenarios (under/full/over-replacement) modeled as parameter perturbations. Model calibrated to euthyroid TSH ~1.5 / free T4 ~15; reproduces primary hypothyroidism with compensatory TSH rise, levothyroxine titration to euthyroid, over-replacement thyrotoxicosis, and central hypothyroidism (low free T4 with non-elevated TSH). Third fully-perturbable disorder; demonstrates the Antimony authoring path. Schema/term/reference validation pass (pre-existing MONDO cache-staleness errors in has_subtypes untouched); 39 perturb tests pass.

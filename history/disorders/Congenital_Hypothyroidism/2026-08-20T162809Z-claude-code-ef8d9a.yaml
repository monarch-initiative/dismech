  details: |
    Surfaced by the new OLIDA cross-walk (scripts/olida_crosswalk.py) as curated-but-unbound. Added an inheritance block bound to HP:0010984 from PMID:39787321, the prospective nationwide French HYPOTYGEN cohort, which found a digenic mode in 16 of 292 genotyped patients, each carrying a thyroid development gene variant plus a DUOX2/DUOXA2 H2O2-generation variant, supported by familial segregation and in vitro cell-migration assays. By study design this is the best-powered multi-locus claim in the grouping. Reference newly fetched and cached. Validated with just validate and count-verified-snippets. Entry added as a member of the grouping.

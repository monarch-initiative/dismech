  summary: Correct a reversed comparison in the digenic inheritance block
  details: |
    Self-review before opening the PR. The digenic block claimed the digenic yield (5.5%) exceeded the monogenic yield (6.8%) in the HYPOTYGEN cohort. It does not - 5.5% is lower. Rewritten to state the counts (16/292 versus 20/292) and say the digenic arm nearly matched rather than exceeded the monogenic one; the point being made, that the digenic arm is not a rare curiosity at the edge of a mostly monogenic disease, survives the correction. Also removed a superlative that collided with the one on SHH_Holoprosencephaly_Spectrum: this entry now claims the least biased ascertainment (a prospective nationwide newborn-screening cohort) rather than the best study design, and SHH claims the only control-tested design. Sharpened the explanation on the segregation evidence item to note that the quoted sentence spans human familial segregation and in vitro assay and cannot be split without breaking the quote, with HUMAN_CLINICAL reflecting the arm the entry relies on. No snippet text changed; 205/205 snippets verified across the three files corrected in this pass.

  summary: 'Genetics pass (d2g series-037): gene-defined subtypes and pathograph wiring'
  details: |
    Genetics pass for the d2g series-037 gap list (issue #12244), covering the ten
    gene-defined congenital hypothyroidism subtypes MONDO files under
    MONDO:0018612.

    Anchor check first. The entry is bound to MONDO:0018612 "congenital
    hypothyroidism", verified against OLS, which is the right anchor for an entry
    of this name. Enumerating all 36 hierarchical descendants of MONDO:0018612
    through the OLS4 API and reading each term's RO:0004003 edges found seven
    gene-bearing siblings the gap list omits: MONDO:0010134 (SLC26A4),
    MONDO:0010137 (DUOXA2), MONDO:0010139 (TSHB), MONDO:0010475 (IGSF1),
    MONDO:0013757 (THRA), MONDO:0032819 (TRHR) and MONDO:0800046 (SECISBP2). Of
    those, Pendred syndrome, isolated thyroid-stimulating hormone deficiency,
    resistance to thyroid hormone alpha and SECISBP2 deficiency already have their
    own entries; DUOXA2 is curated here as thyroid dyshormonogenesis 5; and the
    central forms are curated in Central_Congenital_Hypothyroidism.

    Added nine has_subtypes rows for the primary forms, each binding its MONDO term
    and its gene: TSHR Resistance, CHNG2 (PAX8), CHNG5 (NKX2-5), TDH1 (SLC5A5),
    TDH2A (TPO), TDH3 (TG), TDH4 (IYD), TDH5 (DUOXA2) and TDH6 (DUOX2). The four
    pre-existing rows are etiologic classes rather than gene rows, so Permanent
    Primary and Dyshormonogenesis now carry children lists naming the gene rows
    below them.

    Added two genetic records. IYD is typed CAUSATIVE on the strength of the
    NEJM series reporting biallelic variants with reduced enzyme activity in four
    patients from three families. NKX2-5 is typed SUSCEPTIBILITY, not CAUSATIVE:
    the original report found three heterozygous missense changes in four of 241
    patients and called the role previously unknown, and a later screen of 63
    Brazilian children with thyroid dysgenesis found no mutations in it. That
    negative screen is carried as a REFUTE evidence item. Neither gene has a
    ClinGen gene-disease validity assertion for this disease in the ClinGen
    gene-validity download.

    Wiring. TSHR, PAX8, NKX2-1, FOXE1 and NKX2-5 were bound on Thyroid Gland
    Dysgenesis, which is supported by the node's existing evidence naming all five.
    SLC5A5, SLC26A4, DUOX2, DUOXA2, TPO and TG were bound on Defective Thyroid
    Hormone Biosynthesis, with an added review citation whose abstract names the
    full gene set and sets out the step each acts at. IYD was given its own
    upstream node, Iodide Salvage Failure, because iodide recycling is a different
    step from uptake, hydrogen peroxide supply, organification and thyroglobulin
    matrix formation; that node feeds Defective Thyroid Hormone Biosynthesis.

    The prose gene lists in the inheritance block, the Dyshormonogenesis subtype
    description and the biosynthesis node description were brought into line with
    the bound gene set, and the biosynthesis description now names the step each
    gene acts at instead of listing them flat.

    A fuller decomposition of the biosynthesis node into one node per step is
    supportable from the same review and is a reasonable follow-up; it was not
    done here to keep the change proportionate to the issue.

    Validation: just validate (99 snippets, 0 issues), just validate-terms,
    just count-verified-snippets, and the offline gates all pass under
    linkml-reference-validator 0.3.0rc1. Every snippet added was checked to be
    present in both the committed cache and the current PubMed abstract.

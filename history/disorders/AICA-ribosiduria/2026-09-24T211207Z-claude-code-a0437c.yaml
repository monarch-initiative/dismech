  summary: 'Create: AICA-ribosiduria'
  details: |
    New entry for AICA-ribosiduria (MONDO:0012099, ATIC). Curated as a single Disease entry: one causal gene, a MONDO leaf term, no recognised subtypes. A Perplexity deep-research report was used as a lead list only. Its reference validation was clean (6/6 resolved), but its term validation flagged needs_review: four CURIEs do not exist (HP:0007891, HP:0008021, HP:0003242, FMA:50801), one is obsolete (UBERON:0000967), and twelve NCIT/GO identifiers name unrelated concepts (for example NCIT:C15666 given as dietary intervention is Radiofrequency Ablation; GO:0003921 given as IMP cyclohydrolase activity is GMP synthase activity). None of the report's CURIEs were copied; every binding was looked up in cache/<prefix>/terms.csv or OLS. The report's claim that no animal model exists is contradicted by a 2025 atic knockout zebrafish (PMID:40623538), which was added with its limitations. The report attributes the mild sibling pair to Dewulf et al.; the published abstract is Galli et al. 2023 (PMID:36367252). just preflight-dr returned WARN only because it counted the metabolite abbreviation AICA as a second gene; no second disease entity is present. Orphanet ORPHA:250977 could not be cited because the Orphadata refresh fails on a pinned-checksum mismatch, so prevalence is recorded as a literature case count. just check-genereviews reports no GeneReviews chapter. Evidence comes from abstracts of eleven PMIDs, all fetched with just fetch-reference; the causal chain runs ATIC enzyme deficiency to pathway block and purinosome failure, ZMP/AICA-riboside accumulation, proposed AMPK activation and cytotoxic tissue injury, and on to all fourteen phenotypes. Validated with just validate, validate-terms, count-verified-snippets (62/62), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-coarse-phenotypes and validate-disorders; check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles were run against their committed baselines rather than origin/main.

  summary: Review AICA-ribosiduria against full-text clinical and cellular studies
  details: |
    Reviewed the complete entry and matching Perplexity research/citation artifacts; entity preflight passed and no GeneReviews chapter was found. Read cached references and the full crATIC transcriptome study plus relevant ATIC sections of the nucleotide-metabolism epilepsy review. Retrieved and mined full clinical manuscripts for Ramond 2020 and Galli 2023 through just fetch-reference URL calls. Added hypotonia, intellectual disability, hypermetropia, vomiting, liver findings, specific genital and cardiac findings, hip abnormalities, hypoglycemia and delayed myelination/skeletal maturation. Added diagnostic testing and ADSL differential. Replaced unsupported population frequency bands with case-level descriptions, broadened developmental/visual severity, qualified cytotoxic and AMPK hypotheses, retained incomplete salvage compensation as an alternative, and distinguished inferred from sequenced second alleles. Updated model limitations, biochemical-response interpretation, seizure treatment and orthopedic management. Cross-check: phenotype/diagnostic gaps addressed; genetics/mechanisms corrected; no distinct subtypes or disease-specific trial evidence in the research; hypothetical cell types and uncited care claims not promoted to evidence. Primary full text identifies its article despite URL-only automatically extracted cache titles, so evidence title mirrors cache and explanation records PMID. PMID15114530 full text retrieval was attempted but PMC served a browser challenge and Europe PMC returned 403; abstract retained. DOI10.1016/j.gimo.2025.102875 remained unavailable after force retry; no ketogenic efficacy inferred from title. All reference caches generated by the standard fetcher.

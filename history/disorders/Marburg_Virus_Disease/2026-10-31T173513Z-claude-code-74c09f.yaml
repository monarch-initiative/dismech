  summary: 'Create: Marburg virus disease'
  details: |
    Created the Marburg virus disease entry (named to match the sibling
    Ebola_Virus_Disease_EVD; 'Marburg hemorrhagic fever' kept as synonym and MONDO label).
    Deep research via claude_code (fallback path; report in research/, 8/8 references
    resolved; preflight-dr SKIP as expected for an agent-less infection). Evidence anchored on
    fetched primary abstracts (comprehensive review PMID:42294865, rapid systematic review
    PMID:42958480, GP virulence PMID:42028645, bat-reservoir isolation PMID:19649327, seasonal
    reservoir dynamics PMID:23055920, NPC1 filovirus entry PMID:21866103). Bound the
    infectious_agent to Orthomarburgvirus marburgense (NCBITaxon:3052505), two transmission
    routes, and an agent_life_cycle with the Rousettus aegyptiacus reservoir. Pathograph
    conforms four nodes to the viral_hemorrhagic_fever_syndrome module (High Viremia /
    Endothelial Activation and Damage / Increased Vascular Permeability / Consumptive
    Coagulopathy) substituting the Marburg GP mucin-like domain; all four conformance links
    share a GO term with their module node. Added a four-phase progression and wired all 6
    phenotypes (100% connected). Added the entry as a member of the Viral_Hemorrhagic_Fevers
    grouping and updated its not-yet-curated note. All gates pass.

  details: |
    De-novo curation of HIGM5 (UNG deficiency, MONDO:0011971, gene UNG hgnc:12572) from Perplexity deep research (preflight-dr PASS). UNG-loss pathophysiology chain from failed switch-region uracil excision to CSR failure, altered SHM spectrum, hyper-IgM serum profile, recurrent sinopulmonary infection and lymphoid hyperplasia; phenotypes wired to the graph; UNG gene wired via a genes descriptor on the lesion node. IUIS 2024 Table 3 classification (PMID:41608114) and a member row added to the Predominantly Antibody Deficiencies IEIs grouping mirroring HIGM2. 38 exact-quote snippets over 12 distinct PMIDs verified against the reference cache. Ung-knockout mouse recorded as MODEL_ORGANISM (partial CSR block, SHM transition bias, late B-cell lymphomas) with a HUMAN_MODEL_MISMATCH discussion on human cancer risk. Excluded the Yilmaz 2022 Research Square preprint (VUS, unreviewed) and the two report references flagged unresolved/off-topic. No GeneReviews chapter exists (offline + online check). Validated with validate-disorders, validate-terms, count-verified-snippets (38/38), entity-refs, causal-targets, duplicate-keys, qualifier-terms, and the whole-KB snippet/title/grading/retired-prose/coarse-phenotype/reference-title/block-scalar checks.

  summary: 'Create: Amoebiasis due to Entamoeba histolytica'
  details: |
    Created a standalone infectious-disease entry for Amoebiasis due to Entamoeba histolytica [MONDO:0019028]. The curation records E. histolytica as the NCBITaxon-bound agent, models mature fecally shed cysts, intestinal excystation to trophozoites, and invasive trophozoites, adds fecal-oral and fecal-sexual transmission routes, records global burden, connects Gal/GalNAc lectin-mediated colonic epithelial adhesion and amoebapore/cysteine-protease injury to amoebic colitis and portal spread to liver abscess, and adds PCR, antigen ELISA, and nitroimidazole-plus-luminal-amoebicide care, supported by cached PMID:36519347, PMID:30046644, and PMID:41809248.
    The local adversarial pass filed and fixed three issues before PR: it
    removed amoebic colitis and amoebic liver abscess from the synonym list
    because they are manifestations, constrained fecal-sexual transmission to
    infectious cysts rather than trophozoites, and branched portal liver spread
    directly from invasive trophozoite injury rather than making it downstream
    of amoebic colitis itself.

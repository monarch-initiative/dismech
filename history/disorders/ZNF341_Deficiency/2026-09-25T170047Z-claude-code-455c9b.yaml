  summary: 'Create: ZNF341 Deficiency'
  details: |
    Curated in two sittings. The first, on 2026-09-23, was ended by a hard
    account rate limit before anything was committed; its work was pushed
    unchanged as a safety commit and covered description, notes,
    classifications, mechanistic_hypotheses, pathophysiology (10 nodes) and 11
    phenotypes. This session completed the entry.

    Inherited content was reviewed rather than assumed correct. Two of its
    snippets did not verify under linkml-reference-validator 0.3.0rc1: one
    carried a literal "[52]" citation marker that defeats bracket
    normalisation, and one quoted the full-text body of PMID:35511492, whose
    cache is content_type full_text_html and which 0.3.0rc1 refuses as stale
    (confirmed by re-running just fetch-reference). Both were re-cited to text
    the validator can read.

    The pathophysiology edges named 13 phenotypes that did not exist, so the
    phenotype layer was almost entirely unreachable from the pathograph. All 13
    were curated from the pooled cohort table in PMID:37080116 together with
    five further features that table reports, giving 29 phenotypes. Frequency
    bands were set from each row's own numerator and denominator against
    FrequencyEnum's numeric ranges, which moved atopic dermatitis from
    VERY_FREQUENT to OBLIGATE (20/20). Where the table's printed percentage
    disagrees with its own fraction (minimal-trauma fractures, 2/20 printed as
    20%) the row is quoted as it stands and the discrepancy recorded on the
    phenotype.

    inheritance, prevalence, genetic, treatments, diagnosis,
    differential_diagnoses and references were written in this session.

    Re-running the PubMed query the entry's animal-model note rests on
    surfaced two primary reports that refuted claims made earlier in this same
    session. PMID:39420803 reports dupilumab in a 2-year-old with biallelic
    ZNF341 variants, against a treatment description that had said no
    paediatric experience existed; the same report's variant table carries a
    missense allele (c.538C>G, p.Pro180Ala), against genetic notes that had
    said every disease allele is truncating. PMID:35185921 gives a carrier
    frequency of 1:20 for the p.Arg302* founder allele in the Israeli village
    eight of the first eleven patients came from, added as a second prevalence
    record under measure_type CARRIER_FREQUENCY.

    Lump/split: a separate Disease entry rather than a subtype of
    Autosomal_Dominant_Hyper-IgE_Syndrome. Gene, inheritance and molecular
    mechanism all differ, MONDO/OMIM/Orphanet/ClinGen treat them separately,
    and the pooled table in PMID:37080116 separates them clinically (NK
    lymphopenia 67% vs 8%, high IgG 83% vs 27%, median NIH HIES score 28.5 vs
    64, no reported vascular complication). The stub's entry_type was set to
    DISEASE with that reasoning in a commit of its own before the stub was
    deleted, so the decision is auditable independently.

    Term bindings: NCIT:C15326 was written from memory as "Screening" in a
    first draft of the surveillance treatment and is in fact Sperm Banking.
    Term validation caught it and the binding is now NCIT:C15406 Cancer
    Screening. HP:0009098 is labelled "Chronic oral candidiasis" to match this
    repository's committed HPO snapshot and the 17 other uses in kb/; live HPO
    has renamed the term to "Recurrent oral thrush", and re-deriving the cache
    row would have broken eight unrelated entries, so the rename is recorded on
    the binding instead. Neoplasm is bound to the coarse HP:0002664 with
    coarse_binding_basis PATHOGRAPH_HUB.

    Deliberate gaps. No numerical recurrence risk is stated: neither discovery
    paper nor the review gives one. No malignancy surveillance protocol,
    starting age or interval is given, because none has been published; only
    the radiosensitivity rationale is cited. PMID:31980991, "Cancer Tendency in
    a Patient with ZNF341 Deficiency", is the one further primary report on
    malignancy here and is not cited because the fetcher returns content_type
    unavailable for it, so no exact quote can be taken; this is recorded in the
    entry's notes. No animal model exists, verified by three named PubMed
    queries recorded in notes and re-run on the day of the commit. No
    GeneReviews chapter exists, verified offline and online against the
    committed Bookshelf index.

    Deep research: falcon was requested and returned HTTP 402, so the
    claude_code fallback produced the report (fell_back: true recorded in the
    frontmatter). just preflight-dr returns WARN, not FAIL: STAT3 is mentioned
    at 51% of ZNF341's rate because ZNF341 regulates STAT3 and the disorder is
    a STAT3 phenocopy, which is the pathway-gene case rather than a mixed-entity
    report. The report was treated as a lead throughout; every claim in the
    entry is cited to a primary source or a structured record.

    Validation: just validate-disorders, count-verified-snippets (112/112),
    validate-terms, check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-coarse-phenotypes,
    check-qualifier-terms, check-reference-titles, check-genereviews
    (offline and online), list-gene-term-mismatches, validate-history and
    pytest -k ZNF341. Snippet gates were run under a venv pinned to
    linkml-reference-validator 0.3.0rc1, the floor main requires, rather than
    the shared 0.2.1 venv.

    Note for anyone re-running gates on this entry: just validate lacks the
    --no-full-text guard and truncated five references_cache files during this
    session (issue #12672). They were restored with git checkout and the entry
    was re-verified afterwards. Use just validate-disorders.

  summary: 'Create: Focal Facial Dermal Dysplasia Type IV'
  details: |
    New entry for FFDD4 (MONDO:0013997), the autosomal recessive preauricular focal facial dermal dysplasia caused by biallelic CYP26C1 loss of function. First pass built from PubMed (E-utilities) and Orphanet ORPHA:398189; then integrated the openscientist deep-research report (research/Focal_Facial_Dermal_Dysplasia_Type_IV-deep-research-openscientist.md). Report reference validation: 16/16 references resolved, 2/2 quotes found, 0 off topic. Report term validation flagged HP:0004410 as nonexistent and UBERON:0003066 as pharyngeal arch 2 (report used it for the arch in general); neither was used. From the report, PMID:21931173 (type IV reclassification) and PMID:25728400 (1p36 Setleis) were added; PMID:15531370, 39360443, 31072004, 28715412, 19476657 and 22275070 were not used because they concern CYP26 roles in retina, zebrafish ethanol sensitivity, SHH and Tbx1 regulation rather than this disorder. Report statements on lesion stability, quality of life, treatment and a count of about 20 molecularly confirmed patients carried no citation and were not curated. just preflight-dr could not run because the local MONDO build is absent (not downloaded for disk reasons); disease identity was checked manually: the report names CYP26C1 51 times and cites OMIM 614974, matching the MONDO xref and MONDO causal gene. Pathophysiology is a five-node chain (CYP26C1 loss of function, impaired retinoic acid catabolism, hypothesised retinoic acid excess at the maxillary-mandibular fusion line, hypothesised fusion defect, focal dermal hypoplasia) wired to the skin phenotypes; the two hypothesised steps are marked HYPOTHETICAL and carry a HUMAN_MODEL_MISMATCH discussion based on the phenotypically normal Cyp26c1 knockout mouse. Orphanet neurological annotations that trace to single clinically diagnosed children were left out and explained in notes. Validation: just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-causal-targets and the offline snippet/YAML gates, and the validate-disorders gate.

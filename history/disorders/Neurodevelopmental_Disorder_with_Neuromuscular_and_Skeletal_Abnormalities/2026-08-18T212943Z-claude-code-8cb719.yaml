  summary: 'Correct off-by-one in the preceding record''s audit statement (PR #8851)'
  details: |
    Sixth follow-up on PR #8851, and a correction to the immediately preceding
    record. The round-6 re-review of commit b11ac0a returned APPROVE with one
    suggestion: an off-by-one in that record's audit statement. Correct.

    CORRECTION. Record 2026-08-18T211843Z-claude-code-7850f7 states at lines 62-64:
    "An audit after the change confirms the 'rests on' clause now appears in exactly
    the six entries whose descriptions do rest on the prediction, and not in
    p.Asn469Ser." The number is wrong. The clause appears FIVE times, in
    p.Ser134Pro, p.Gly197Asp, p.Arg853Cys, p.Lys902Thr and p.Gly913Asp. Re-verified
    by walking the variants list programmatically: count 5.

    The arithmetic that produced the error: round 4 extended six snippets, and that
    figure is stated correctly elsewhere in the same record (line 31). Carving
    p.Asn469Ser out of the set in round 5 left five. The record reused the earlier
    number after the operation that changed it.

    No YAML change is required and none was made. The data was and is correct: the
    clause sits in exactly the entries whose descriptions assert the polarity/charge
    change, and is correctly absent from both p.Asn469Ser (the carve-out) and
    p.Asp55Gly, whose description asserts only solvent exposure and makes no
    polarity/charge claim. Only the prior record's self-description was wrong, and
    under the append-only rule it is corrected here rather than edited there.

    This is the fourth instance of one pattern across this review, and its
    progression is worth recording as the substantive lesson of the whole exercise.
    It began in the data (an ontology term asserting a demyelinating subtype no
    source stated), moved to a provenance note that misdescribed which cache text
    supported it, then to an evidence explanation that contradicted its own
    description, and has now surfaced in prose describing that fix. Each instance
    was smaller than the last and none was catchable by the validation stack: every
    snippet involved was an exact quote, every term resolved, every gating check
    passed. What they share is that a statement about the work drifted from the work
    after an edit changed one but not the other.

    The practical rule, stated once for future curation rather than repeated per
    instance: after any edit that changes the membership or shape of a set, re-derive
    every count and every claim made ABOUT that set - in descriptions, in evidence
    explanations, and in the history record - rather than carrying the previous
    figure forward. Prefer deriving such counts programmatically at the time of
    writing, as was done to confirm this correction, since the failure mode is
    specifically a stale number that reads as plausible.


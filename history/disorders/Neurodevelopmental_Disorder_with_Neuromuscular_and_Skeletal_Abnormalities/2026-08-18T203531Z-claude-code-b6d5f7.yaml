  summary: 'Structure NRCAM allele series and bind diagnosis terms (PR #8851 re-review)'
  details: |
    Second follow-up on PR #8851. The re-review of commit 7e1fe62 returned APPROVE
    again (no CRITICAL, no IMPORTANT) with three further optional suggestions, and
    explicitly accepted the earlier decline of PMID:35464310. All three adopted.

    1. diagnosis_term was unbound on both diagnosis entries. Bound to
       NCIT:C101295 (Whole Exome Sequencing) and NCIT:C38056 (Electromyography),
       both verified against NCIT and both accepted by just validate-terms as
       reachable from NCIT:C25218.

    2. The 13-allele series was prose in genetic notes rather than structured
       variants. Now structured as 13 Variant records, each with gene, type and its
       own evidence item: seven missense (Asp55Gly, Ser134Pro, Gly197Asp, Asn469Ser,
       Arg853Cys, Lys902Thr, Gly913Asp), three truncating (Glu111*, Arg929*,
       Thr766Ilefs*4), a canonical splice-acceptor allele (c.2647-2A>G, predicted
       exon-22 skipping to p.Ile883Serfs*8), the deep-intronic c.230+824G>C that
       only genome sequencing found, and Elahi's c.73C>T (p.Gln25*).

       Two deliberate omissions inside that block, both for the same reason that
       governs the skeletal phenotypes. cDNA coordinates are NOT asserted for the
       missense alleles: the paper's narrative names the protein changes and is
       quotable for them, but the per-individual cDNA mapping lives in Table 2,
       which is not in the extractable cached text. Only the three alleles whose
       narrative or abstract states a cDNA coordinate carry one. Likewise
       clinical_significance is left unset per allele, because the original reports'
       ACMG/AMP classifications are table content rather than narrative, and
       guessing PATHOGENIC per allele would be manufacturing a formal determination.
       Both choices are recorded in the genetic notes. Note this means the variants
       block was built entirely from quotable narrative text - the deep-research
       table that lists cDNA per individual was deliberately not used as a source.

    3. Genetic Counseling now carries therapeutic_modality: OTHER. NCIT:C15240 is
       one of the generic action terms excluded from mechanical backfill, so this
       was a judgement call: genetic counseling has no therapeutic platform in the
       sense the enum means, and BEHAVIORAL would misdescribe it as a lifestyle or
       physical intervention, so OTHER is the accurate value. The entry already
       carries action_category: COUNSELING_INFORMATIONAL, which is what actually
       classifies it.

    Validation after these changes:
      just validate                -> schema, terms and references all passed
      just count-verified-snippets -> 101/101 verified against cached references
      just validate-disorders      -> passed
      just check-duplicate-keys    -> no duplicate mapping keys
      just check-title-snippets    -> no new title-quoting snippets
      just compliance              -> 87.9% global, 88.2% weighted, up from
        85.9/86.1 - the structured variants added well-formed content rather than
        just growing the denominator.
    Snippet count 88 -> 101, all thirteen new items exact substrings of the cached
    narrative. Pathograph untouched.

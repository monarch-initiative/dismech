  summary: 'Address automated review suggestions on PR #8851 (NEDNMS)'
  details: |
    Follow-up to the CREATE record in this directory, responding to the automated
    review on PR #8851 (ai4c-reviewer, verdict APPROVE, no CRITICAL and no IMPORTANT
    findings, four blue suggestions). CI was already green on the reviewed head
    (Build and test: success). All four suggestions were considered; three were
    adopted and one was declined with reasoning.

    Adopted:

    1. Periventricular heterotopia (HP:0007165) was the one research-surfaced
       finding with an HPO term that appeared in neither phenotypes nor a
       documented-omission note. Now curated as a phenotype with the same
       provenance-note pattern as the other Table 1-derived findings: the string
       "heterotopia" has zero hits in the extractable text of the cached
       PMID:35108495, whose imaging narrative lists only thin corpus callosum,
       ventriculomegaly, periventricular leukomalacia and delayed myelination, so no
       evidence item and no frequency are asserted.

    2. Seizures were absent entirely with no stated reason. The exclusion is now
       recorded in the disease-level notes, and it is better founded than the
       reviewer assumed: the cached text of PMID:35108495 does not merely leave the
       single seizure case unexplained, it explicitly attributes it to a confounder
       - individual 1 carries a concomitant homozygous CD55 loss-of-function variant
       and "suffered from seizures attributed to sinus vein thrombosis secondary to
       the CD55 loss, which resolved on treatment with eculizumab". The note quotes
       that sentence and also records individual 3's mosaic KRAS variant as a second
       independent confounder in the founding cohort.

    3. PMID:16039564 (Eshed et al., gliomedin) is now cited twice on the
       node-of-Ranvier assembly node. It identifies gliomedin as the glial ligand
       for neurofascin and NrCAM, and shows that disrupting that interaction
       abolishes node formation outright - which upgrades the nodal mechanism from
       correlational localization evidence to a necessity claim. Both snippets are
       exact quotes from the cached abstract.

    4. The trivial modifier inconsistency the reviewer flagged turned out to be a
       real modeling wart rather than a deliberate distinction. The Cortical Circuit
       Dysfunction node was re-using GO:0007416 (synapse assembly) with
       modifier DYSREGULATED, duplicating the annotation on the upstream
       Impaired Synaptogenesis node and mislabelling what the node actually claims,
       which is an excitatory/inhibitory transmission imbalance rather than a second
       assembly defect. Rebound to GO:0050804 (modulation of chemical synaptic
       transmission), DYSREGULATED.

    Declined, with reasoning:

    - PMID:35464310 (NrCAM loss of function in adult hypothalamic tanycytes) was
      offered as optionally strengthening the CNS arm. Not added. It concerns adult
      neural stem/progenitor niche homeostasis and reports only a mild tanycyte
      depletion with a subtle metabolic phenotype; no hypothalamic, endocrine or
      metabolic finding is described in any affected individual. Citing it would
      extend the entry's mechanism graph past what the disease is documented to
      show, which is the failure mode the rest of this curation was built to avoid.
      The reference stays cached and uncited.

    Also noted for the record: the reviewer could not execute the GeneReviews PubMed
    esearch because curl/WebFetch/WebSearch were not in its allowedTools, and
    resolved skill item 15 by inference instead. That inference was correct, and it
    was independently confirmed during the CREATE session - the prescribed esearch
    ("NRCAM GeneReviews[All Fields]") was run directly and returned a count of 0.

    Validation after these changes:
      just validate                -> schema, terms and references all passed
      just count-verified-snippets -> 88/88 verified against cached references
      just validate-disorders      -> passed (the batched --no-full-text check CI runs)
      just check-duplicate-keys    -> no duplicate mapping keys
      just check-title-snippets    -> no new title-quoting snippets
      just compliance              -> 85.9% global, 86.1% weighted (the denominator
        grew with the added phenotype, so the ratio moved slightly while the entry
        gained content)
    Pathograph re-checked: still 12 nodes, single-rooted DAG, no dangling targets,
    all model links resolve. Phenotype count 24 -> 25.

  summary: 'Scope missense electrostatic claims to their evidence; soften p.Asn469Ser
    (PR #8851)'
  details: |
    Fourth follow-up on PR #8851. The round-4 re-review of commit 525e123 returned
    APPROVE with one suggestion plus a cosmetic nit. Both adopted.

    The suggestion was a scoping-and-accuracy point on the six missense variant
    descriptions, and it was right on both halves.

    Half one: the descriptions asserted that the substitution "changes polarity
    and/or charge, so it is predicted to perturb the electrostatic surface", but the
    attached snippet stopped at "appear exposed to the solvent" and did not cover
    that clause. Each of the six snippets is now extended through the following
    sentence, which does: "Because most of the amino acid substitutions change the
    polarity and/or charge of the residues, they are predicted to affect the
    protein's electrostatic balance, thus possibly disrupting NRCAM function and
    interactions." Each explanation now also records that the source hedges with
    "most", so the claim is an aggregate over the set rather than a per-residue
    assertion. Snippet count stays 107 because the six existing items were extended
    rather than duplicated.

    Half two: the reviewer identified p.Asn469Ser as the likeliest member of the
    excluded minority, and residue chemistry confirms it. Checking all seven:
    Asp55Gly (negative to nonpolar), Gly197Asp and Gly913Asp (nonpolar to negative),
    Ser134Pro (polar to nonpolar), Arg853Cys and Lys902Thr (positive to polar
    uncharged) all change polarity or charge. Asn469Ser does not - asparagine and
    serine are both polar and both uncharged, so what changes is side-chain size and
    hydrogen-bonding geometry (carboxamide to hydroxyl), not the electrostatic
    properties the prediction turns on. That entry's description now says so
    explicitly and states that the predicted effect is weaker than for its six
    counterparts, rather than repeating the boilerplate.

    This is worth flagging as a pattern for future curation: the six descriptions
    were generated from one template, and templating a claim across a set is exactly
    how a source's hedge ("most") gets silently upgraded to a universal. The failure
    is invisible to snippet validation, because the aggregate sentence is a genuine
    exact quote for every member of the set.

    Cosmetic nit also adopted: the genetic summary prose listed p.Asp55Gly among the
    narrative-named missense alleles with no inline marker, with the DR-provenance
    disclosure following later in the same notes block. An inline "[see the
    provenance caveat below]" now sits at the mention itself.

    Validation after these changes:
      just validate                -> schema, terms and references all passed
      just count-verified-snippets -> 107/107 verified against cached references
      just validate-disorders      -> passed
      just check-duplicate-keys    -> no duplicate mapping keys
      just check-title-snippets    -> no new title-quoting snippets
      just compliance              -> 88.2% global, 88.4% weighted (unchanged)
    An audit confirms every variant description that claims a polarity or charge
    change now has a snippet covering that claim; p.Asp55Gly makes no such claim and
    correctly carries none. Pathograph untouched at 12 nodes.

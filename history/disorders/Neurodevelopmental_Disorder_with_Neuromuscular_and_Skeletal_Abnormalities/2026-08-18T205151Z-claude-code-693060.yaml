  summary: 'Correct variant provenance disclosure; normalize names; broaden sequencing
    term (PR #8851)'
  details: |
    Third follow-up on PR #8851. The re-review of commit 87f3448 returned APPROVE
    with four optional suggestions. All four adopted.

    1. CORRECTION to the provenance claim made in the previous record and in the
       genetic notes. That record and the notes stated the variants block was built
       entirely from quotable narrative text. That is true for twelve of the
       thirteen alleles but NOT for p.Asp55Gly, and the reviewer was right to catch
       it. The paper's narrative names only six missense variants by domain
       (Ser134Pro, Gly197Asp, Asn469Ser in Ig-like 1/2/5; Arg853Cys, Lys902Thr,
       Gly913Asp in Fn-III 3); Asp55 appears only as a residue in the
       solvent-exposure list. So three details in that entry - the Gly substitution,
       the Ig-like domain 1 assignment, and the compound heterozygosity with
       c.230+824G>C - are transcribed from Table 2 via the claude_code deep-research
       report, not from the narrative.

       The data itself is retained rather than removed, because it is internally
       consistent and independently checkable: c.164 falls in codon 55, GAC to GGC
       is Asp to Gly, and individual 3 is the genome-sequenced individual carrying
       the deep-intronic allele. But the disclosure was wrong, and both the genetic
       notes and that variant's description now say plainly which parts are
       DR-sourced. The attached evidence item was already correctly scoped to
       solvent exposure and did not overclaim. Recording the correction here rather
       than editing the previous record, per the append-only rule.

    2. Six missense entries asserted solvent exposure in their description while
       attaching only the domain-location snippet. The solvent-exposure sentence
       names all seven residues, so it is now attached to each of the six as a
       second evidence item, matching what p.Asp55Gly already did. Snippet count
       101 -> 107.

    3. Five variant names used the paper's U+2217 ASTERISK OPERATOR. Normalized to
       ASCII asterisk in the names only, which is the KB convention and what a grep
       for p.Arg929* will actually match. The snippets keep U+2217 verbatim where
       the source uses it - an audit confirms eight remaining occurrences in the
       file, all inside snippets, zero in names. Note PMID:36606341's own abstract
       uses ASCII, so that name and its snippet now agree.

    4. The sequencing diagnosis entry was bound to NCIT:C101295 (Whole Exome
       Sequencing), which is narrower than the entry it annotates - the entry is
       named "Exome or Genome Sequencing" and its point is that genome sequencing
       is what found the deep-intronic allele that exome sequencing missed.
       Rebound to NCIT:C101293 (Next Generation Sequencing), which covers both
       arms; verified present in cache/ncit/terms.csv and in the treatmentactionterm
       enum cache, and accepted by just validate-terms.

    Validation after these changes:
      just validate                -> schema, terms and references all passed
      just count-verified-snippets -> 107/107 verified against cached references
      just validate-disorders      -> passed
      just check-duplicate-keys    -> no duplicate mapping keys
      just check-title-snippets    -> no new title-quoting snippets
      just compliance              -> 88.2% global, 88.4% weighted (from 87.9/88.2)

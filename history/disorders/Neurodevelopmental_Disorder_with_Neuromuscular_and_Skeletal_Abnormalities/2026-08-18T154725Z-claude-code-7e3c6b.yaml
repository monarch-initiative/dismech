  summary: 'Create: Neurodevelopmental Disorder with Neuromuscular and Skeletal Abnormalities
    (NEDNMS, NRCAM)'
  details: |
    De-novo curation of NEDNMS (OMIM:619833, MONDO:0859236), an ultra-rare autosomal
    recessive disorder caused by bi-allelic NRCAM (hgnc:7994) variants.

    Duplicate preflight: no matching entry on origin/main (searched MONDO ID, label,
    synonyms, and "NRCAM" across kb/); GitHub PR and issue searches for the MONDO ID
    and the disease name returned no prior or in-flight work.

    Deep research providers. falcon was requested first per the default, but the
    Edison Scientific API returned HTTP 402 Payment Required, so no falcon report
    exists. Two substitutes were run instead and both are committed:
      - claude_code (research/...-deep-research-claude_code.md; 16 web searches,
        25 turns, 4/4 references resolved, 3/4 on topic)
      - openscientist (research/...-deep-research-openscientist.md; 11/11 references
        resolved, confabulation_rate 0.0, needs_review true)
    NEC preflight (just preflight-dr) was run against MONDO:0859236 on BOTH reports
    and both returned PASS (NRCAM 29 and 32 mentions respectively, dominant gene;
    report OMIM IDs 601581/619833 consistent with the MONDO xref).

    The openscientist report's own reference validation flagged PMID:11728309
    (Lustig et al., "Nr-CAM and neurofascin interactions regulate ankyrin G and
    sodium channel clustering at the node of Ranvier") as possibly off topic. Per the
    SOP this is evidence and not a verdict, so the paper was fetched and read: it is
    squarely on topic - a myelinating DRG/Schwann-cell co-culture experiment showing
    that an Nr-CAM-Fc fusion specifically blocks Na+ channel and ankyrin G
    accumulation at the node without affecting myelination. The flag is a false
    positive and the paper is now cited on the node-of-Ranvier mechanism node.

    GeneReviews: PubMed searched for a GeneReviews chapter for NRCAM / NEDNMS
    ("NRCAM GeneReviews[All Fields]" and disease-name variants). None exists, which
    is expected for a disorder delineated in 2022 with ~11 published cases. No
    GeneReviews baseline was therefore available; per the skill, no action needed.

    Content curated: a 12-node pathophysiology graph running from bi-allelic NRCAM
    loss of function through impaired L1-family Ig-CAM adhesion to three parallel
    cellular arms (axon growth/guidance, node of Ranvier assembly, synaptogenesis and
    dendritic spine remodeling), then to peripheral nerve conduction failure, aberrant
    CNS white matter tract formation, cortical circuit dysfunction and sensory pathway
    miswiring, converging on neuromuscular dysfunction and global neurodevelopmental
    impairment. 24 phenotypes with HPO terms; genetic entry with the full reported
    allele series; prevalence; biochemical (CK); histopathology (neurogenic grouped
    fibre atrophy); diagnosis; four differential diagnoses; four treatments; three
    animal models (Nrcam KO mouse, gliomedin/NrCAM double KO, zebrafish nrcamaDelta)
    wired into the pathograph via modeled_mechanisms with readouts, including a
    FAILS_TO_RECAPITULATE link for the neuromuscular phenotype; two discussions.

    Deliberate evidence decision worth flagging for review. The disorder's OMIM/MONDO
    name foregrounds "skeletal abnormalities", and OMIM's clinical synopsis records
    scoliosis 5/9, hip dysplasia 3/9, pes cavus 3/9, plus coxa valga, acetabular
    dysplasia, hammertoe and distal arthrogryposis. Those counts derive from Table 1
    of PMID:35108495, which is a table asset absent from the extractable text of the
    cached reference; the paper's abstract and narrative never use the words
    scoliosis, skeletal or contracture and frame the disorder as neurological and
    neuromuscular throughout. Rather than manufacture snippets, the skeletal,
    microcephaly, optic atrophy, behavioural and cerebral-palsy items carry HPO terms
    plus explicit provenance notes and NO evidence items, no frequency is asserted for
    them, and a KNOWLEDGE_GAP discussion ("skeletal_phenotype_evidence") records both
    the evidentiary gap and the open mechanistic question, with two proposed
    experiments. The Secondary Musculoskeletal Deformity node is marked
    mechanism_confidence HYPOTHETICAL for the same reason. Outcome is recorded as
    needs_followup on that account.

    A second discussion ("mouse_null_neuromuscular_mismatch", HUMAN_MODEL_MISMATCH)
    records that Nrcam-null mice reproduce the cellular lesions but not the
    neuromuscular phenotype, with the three candidate explanations (L1-family
    redundancy, NMD-triggered transcriptional adaptation, species divergence at the
    poorly conserved KGE/RNRR motifs) and three discriminating experiments.

    gnomAD constraint figures in the genetic notes (pLI 2.6e-11, LOEUF 0.64,
    o/e LoF 0.53, 83 observed vs 156.5 expected, LoF Z 4.99) were read directly from
    the gnomAD GraphQL API (GRCh38) on 2026-08-18 rather than taken from a report,
    and are recorded as such with no evidence item since there is no citable
    publication for them.

    Datasets: just discover-datasets returned only GENE_ONLY candidates (synthetic-
    construct nucleosome-binding studies and a mouse hypothalamic tanycyte dataset)
    none of which is about this disease. Relevance triage rejected all of them and no
    datasets block was added.

    Validation actually run and read:
      just validate                -> schema, terms and references all passed
      just count-verified-snippets -> 82/82 verified against cached references
      just validate-disorders      -> passed (the batched, --no-full-text check CI runs)
      just check-duplicate-keys    -> no duplicate mapping keys
      just check-title-snippets    -> no new title-quoting snippets
      just compliance              -> 85.9% global, 86.1% weighted
    All 11 cited PMIDs were fetched with just fetch-reference; no cache file was
    hand-written.

    Pre-PR red-team review. A subagent ran the repo's dismech-pr-review skill over
    the finished entry before any commit and returned REQUEST_CHANGES. Every
    finding was acted on:
      - The phenotype "Demyelinating Peripheral Neuropathy" (HP:0007108) asserted
        a subtype no cited source states - "demyelinat" has zero hits in all three
        primary cached references, and the one quotable nerve conduction study is
        axonal. Renamed to "Peripheral Neuropathy" and rebound to HP:0009830, with
        a note recording the OMIM-synopsis origin of the demyelinating claim.
      - The Self-Injurious Behavior provenance note wrongly said the cache had no
        supporting text. It does: "other behavioral issues-most prominently
        aggression and self-injury-have been described in three individuals in our
        cohort". Evidence item attached and frequency FREQUENT (3/10) added.
      - PMID:38274568 was framed as an independent cohort; it is a correspondence
        letter whose "two patients" are individuals 8a and 8b of the founding
        cohort. Reframed, downgraded to PARTIAL/OTHER, and the prevalence and
        description corrected from "fewer than 15 in three publications" to
        "about 11 in two primary publications plus a review letter".
      - evidence_source on the computational-analyses snippet made COMPUTATIONAL
        consistently (was HUMAN_CLINICAL in two of three places).
      - GO:0042552 myelination ABNORMAL removed from the node-of-Ranvier node: its
        own PMID:11728309 evidence says Nr-Fc had no effect on myelination.
      - Strabismus, retinal detachment and micrognathia were DR-table claims in
        prose with zero hits in any cited source; removed from descriptions and
        moved into provenance notes.
      - Facial Dysmorphism rebound from HP:0005280 (one component) to HP:0001999
        Abnormal facial shape, with the Figure 1C legend attached as a quote.
      - The NFASC differential's snippet was truncated before naming NFASC;
        extended to the full verbatim span.
      - Intellectual Disability's FREQUENT band got its own frequency evidence.
      - Minors: dropped an organism-scale GO term and an unevidenced oligodendrocyte
        annotation, made the gliomedin/NrCAM double-knockout evidence PARTIAL
        throughout, hedged the PMID:11728309 explanation toward the authors' own
        neurofascin-centred conclusion, added target_mechanisms to two treatments,
        and corrected the hydrocephalus, ataxia and cerebral-palsy notes.
    Post-fix: just validate passes, 86/86 snippets verified, pathograph still a
    single-rooted DAG with no dangling targets.

    Full pytest tests/test_data.py: 33483 passed, 1 failed. The single failure is
    test_evidence_items_have_references on kb/disorders/Travelers_Diarrhea.yaml,

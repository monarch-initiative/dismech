  summary: 'Reword p.Asn469Ser evidence explanation to match its own description (PR
    #8851)'
  details: |
    Fifth follow-up on PR #8851. The round-5 re-review of commit 1734231 returned
    APPROVE with one suggestion. Adopted.

    The finding: when the shared explanation text was extended across the six
    missense entries last round, its first clause - "states the electrostatic
    prediction the description rests on" - was templated onto p.Asn469Ser too, where
    it contradicts that entry's own description. That description argues the
    opposite: that this allele is the likeliest member of the minority the source's
    "most" hedge excludes, and that the electrostatic prediction applies to it more
    weakly. The description does not rest on the prediction; it distances itself
    from it.

    Reworded for that entry only. The explanation now says the snippet places the
    residue among the solvent-exposed substituted amino acids and gives the
    aggregate electrostatic prediction that the description argues this particular
    allele is likely excluded from, and states plainly that it is cited for the
    solvent-exposure finding and as the source of the prediction being qualified -
    not as support for applying that prediction to this substitution. The snippet
    itself is untouched: it is a verified exact quote, and the problem was never the
    quote.

    This is the third instance in this review of the same underlying pattern, and
    the most pointed one, because it appeared in the very commit whose message
    identified the pattern. Writing one explanation and applying it across a set
    propagates whatever the set's exceptional member does not share - and here the
    copied clause described the entry as resting on a claim the entry was written to
    carve itself out of. Worth stating as a rule for future curation: when one
    member of a templated set is given a description that departs from the template,
    its evidence explanations have to be re-read too, because they were written for
    the version of the entry that no longer exists. No validator sees this - the
    snippet is exact, the evidence_source is right, and nothing in the entry is
    factually wrong. Only reading the explanation against its own description
    catches it.

    An audit after the change confirms the "rests on" clause now appears in exactly
    the six entries whose descriptions do rest on the prediction, and not in
    p.Asn469Ser.


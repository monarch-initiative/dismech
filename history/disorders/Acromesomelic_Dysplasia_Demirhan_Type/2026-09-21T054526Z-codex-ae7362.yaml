  summary: Review Demirhan acromesomelic dysplasia against full clinical and experimental
    sources
  details: |
    Reviewed the entire existing entry after reading all nine original cached references at their available depth and retrieving additional primary full text. Fresh preflight at base 6c632c2317d found four CREATE/EDIT events and no REVIEW, and no overlap among 149 fully paginated open PRs. No matching GeneReviews or StatPearls chapter was found in the current Bookshelf index. ClinicalTrials.gov searches for Demirhan, BMPR1B and Grebe returned no trials. No Demirhan-specific deep-research report was present.

    Read the complete four-page Demirhan 2005 founding report through the university-hosted PDF; visually checked page 315 and its clinical figures. Read all scientific Methods, Results, Discussion, Table 1 and figure legends of the C53R/W219* study (PMID:24129431) in its separately generated PMC HTML cache; also read the complete 2015 R31C Du Pan PDF, 2018 Hunter-Thompson paper/tables, 2024 Du Pan XML and 2003 dominant BDA2 full text. Read the complete 2001 Bmpr1b-null reproductive paper, including methods, histology, tables and limitations. Read the 2023 nosology main text and recovered the complete table PDF, visually confirming NOS 16-0040 in group 16. All new cache files were generated with just fetch-reference. Preserved the existing abstract-only 24129431 cache when re-fetching supplied no additional text. The 2000 mouse limb paper and 2023 Moroccan report remain abstract-level evidence after unsuccessful full-text retrieval; no full-read claim is made for them.

    Corrected the central assay interpretation: C53R chick micromass overexpression did not reduce differentiation versus wild-type, domain-deletion or empty-virus controls. I200K supplied a dominant-negative comparator. NIH/3T3 reporter data demonstrate defective GDF5-responsive signal, not directly measured ligand affinity or patient phospho-SMAD loss; C53R retains membrane localization and reduced processing efficiency is proposed. Truncating-allele RNA decay/protein loss remains predicted. Replaced exact receptor–ligand equivalence and an asserted severity law with a qualified allele-function knowledge gap. Built eight distinct mechanism nodes, separating precursor proliferation from chondrocyte differentiation and ovarian from uterine outcomes. Targeted-null mouse limb data support reduced phalangeal proliferation and differentiation after normal initial digital rays; they do not establish failure of initial cartilage condensation or every human skeletal anomaly.

    Replaced the sheep hyperprolific-allele-centered reproductive mechanism with an emerging BMPR1B reproductive-role hypothesis supported by the founding case and bounded null-mouse evidence. The null mice retain follicles and gonadotropin-responsive ovulation, have defective cumulus expansion, and have thin uterine linings/underdeveloped glands. Two litters in more than 30 matings preclude an absolute-sterility claim. The full paper reports a nonsignificant Cyp19 mRNA trend and no direct estradiol comparison; direct uterine versus secondary endocrine effects remain unresolved. Do not infer normal adult reproductive function from the later two-year-old girl whose ovaries were unassessable. Removed the ovarian-aplasia HPO binding because ultrasound nonvisualization does not establish agenesis; preserved the actual observation in diagnosis and mechanism descriptions.

    Expanded to 22 evidence-backed phenotypes and separated carpal from tarsal fusion. Table 1 has no tarsal synostosis in its three new Grebe cases, unlike the founder. Added source-specific primary amenorrhea, radial finger deviation, short first metacarpals/ulnae/toes/femoral necks, delayed bone age, clubfoot, absent proximal thumb/index phalanges and lower-limb length inequality. Kept abstract ulnar hand deviation distinct from body radial finger deviation. Removed unsupported occasional frequency bins and a numerical ultra-rare implication. Did not import polydactyly from the 2024 mild Du Pan case or Hunter-Thompson-specific observations. Corrected the Du Pan differential: the measured adult height was 148 cm with absent fibulae, not uniformly normal stature and preserved long bones.

    Added three diagnostic evaluations and restored actual reported hormonal substitution in the founder, with no invented agent, regimen, response or fertility benefit. Linked it to the endocrine mechanism; retained genetic counseling. Reframed the management gap as missing outcomes rather than no documented endocrine care. Added two experimental and two animal models with explicit readouts, comparators and translational limits. Independent peer review of the full founding, C53R and reproductive papers confirmed the major mechanism/model distinctions and identified the resolved ovarian-binding tension. Cached snippets, schema, ontology bindings, model and graph targets, history and repository guard checks were used to verify the revision before publication.

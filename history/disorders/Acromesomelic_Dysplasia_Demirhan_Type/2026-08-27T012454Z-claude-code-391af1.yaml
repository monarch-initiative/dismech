  summary: 'Create: Acromesomelic Dysplasia Demirhan Type'
  details: |
    De-novo curation while reviewing ISDS 2023 nosology group 16. Bound to MONDO:0012274 (OMIM 609441), which the 2023 revision lists as 'Grebe dysplasia, BMPR1B-related'. The pathophysiology reaches the same central GDF5-BMPR1B node as the GDF5 entries but from the receptor side. Genital anomalies are curated as OCCASIONAL rather than defining: they rest on the single index patient, later BMPR1B families were reported without them, and OMIM titles the entity 'with or without genital anomalies'. A knowledge-gap discussion records that the mechanism of the genital phenotype is untested. All 32 evidence snippets verified against the reference cache.

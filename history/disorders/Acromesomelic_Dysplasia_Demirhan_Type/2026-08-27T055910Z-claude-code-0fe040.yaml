  summary: 'Edit: ovarian pathograph branch and hypothesis groups'
  details: |
    The genital phenotype was curated but had no mechanism node behind it, so it did not appear in the pathograph at all. Added a two-node ovarian branch - impaired BMPR1B signalling in granulosa cells, then ovarian dysfunction and uterine hypoplasia - built on the ovine Booroola FecB data showing granulosa cells read GDF5 and BMP4 specifically through BMPR1B. The branch is deliberately gated behind an EMERGING hypothesis group and its edges carry that group, because the functional data are ovine and describe a variant that alters rather than abolishes receptor function, while the human observation rests on one index patient. A separate CANONICAL group covers the well-supported limb mechanism, so confidence in the limb story does not transfer to the ovarian one. The brachydactyly type A2 differential now records that even dominant BMPR1B alleles work by two different mechanisms. Snippets 44/44 verified.

  details: |
    Response to PR review finding 3. Added a treatments section with genetic counselling, noting that a heterozygous BMPR1B variant is not automatically benign because dominant-negative alleles in the same gene cause brachydactyly type A2, so carrier risk depends on the allele's functional class. Added a knowledge gap recording the absence of disease-specific surgical and rehabilitative literature, and stating explicitly that management of the reported ovarian dysfunction and hypergonadotrophic hypogonadism is equally undocumented.

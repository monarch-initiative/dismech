  details: |
    New entry for isolated FSH deficiency caused by biallelic FSHB variants (MONDO:0009239). Deep-research input: a Perplexity sonar-deep-research report (research/Hypogonadotropic_Hypogonadism_24_Without_Anosmia-deep-research-perplexity.md), generated with a locally streaming-patched deep-research-client because of dismech#9357 / deep-research-client#94. Its reference validation resolved 12 of 12 references with 5 on topic; its term-validation 'mislabelled' warnings were table-column artifacts (frequency text parsed as labels) and no report CURIE was bound without a fresh lookup. Of the report's references, only PMID:15705395, PMID:28392474 and PMID:23184658 are cited. PMID:11092704 (an LHB variant case), PMID:17227474 and PMID:20488225 (FSHB population genetics), PMID:22499219 (FSHB/FSHR pharmacogenetics) and DOI:10.1186/s13048-021-00880-3 (FSHR biology review) are not about this disease and were not used; DOI:10.1007/s10815-020-01786-7 had no cached content, so its PubMed record PMID:32367462 is cited instead. The foundational case reports were found through PubMed E-utilities and cached with fetch-reference: PMID:8220432, 12161499, 9806482, 12568849, 19966036, 20067895 (cached as full text), 11756367, 17961559, 30602350, 40441342, plus the Fshb knockout and rescue papers PMID:9020850 and 9645705. Layman 1997 NEJM (PMID:9271483) and Phillip 1998 NEJM (PMID:9624193) have no abstract and were not cited; their cache files were not kept. PMID:41631229 (a man with biochemical isolated FSH deficiency and negative FSHB testing) was read and not cited because it is outside this genotype-defined entry. Pathophysiology is a causal chain from the FSHB variants through loss of bioactive FSH secretion to loss of FSH signalling in granulosa and Sertoli cells, then follicle-maturation arrest and estradiol deficiency in women and impaired spermatogenesis in men, with every phenotype except cryptorchidism wired. One HUMAN_MODEL_MISMATCH discussion records the fertile Fshb-null male mouse. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER); no ClinGen FSHB record in the committed cache. No estrogen or testosterone replacement treatment was recorded because no cited source describes it for this genotype. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, the whole-repo snippet gates and validate-disorders.

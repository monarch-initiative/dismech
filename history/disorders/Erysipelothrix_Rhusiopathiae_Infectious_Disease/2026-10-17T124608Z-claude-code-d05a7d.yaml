  summary: Bind LOINC E. rhusiopathiae culture code to the blood culture row
  details: |
    LOINC tranche B batch 27. The blood culture row takes LOINC:86724-2 (Erysipelothrix rhusiopathiae [Presence] in Specimen by Organism specific culture), species-level to match the row's own species identification and specimen-level because LOINC carries no E. rhusiopathiae code qualified to blood.

    The biochemical identification the row describes (Gram stain, morphology, motility, H2S production) is the means of arriving at that species result rather than a separate measurement, so it is not bound separately. The remaining six E. rhusiopathiae codes in the table are immune stain, serology and cycle-threshold assays, none of which this row names. The full-thickness dermal biopsy row is histology rather than a pathogen assay and is left unbound.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

  summary: 'Review round 2: diffuse cutaneous form, phenotype/snippet fixes'
  details: |
    Addressed ai4c-reviewer round-2 CHANGES_REQUESTED. Arthritis phenotype re-cited to the reactive-arthritis sentence (PMID:26693283) instead of the diffuse-form polyarthritis quote. Lymphadenopathy frequency OCCASIONAL -> FREQUENT (source says one third = 30-79%). Added a Generalized (diffuse) cutaneous infection pathophysiology node (PMID:19733019 three-forms + PMID:26693283 diffuse-form quote) wired from the neuraminidase node and downstream to new Fever phenotype and to Arthritis (polyarthritis). Fixed the two claim/snippet mismatches: the aortic-valve node's quote never said aortic and the [8] citation marker is stripped asymmetrically by the validator, so the node was renamed to Endocardial valve infection and stated at the valve level the quote supports; blood-culture diagnosis gained the 'a standard blood culture should be performed' sentence as a second evidence item. Added treatment-duration evidence (4-6 weeks for bacteremia/endocarditis). Marked the neuraminidase->septicemia edge as an inference (INDIRECT_UNKNOWN_INTERMEDIATES) since the review does not directly attribute septicemia to neuraminidase. Osteomyelitis was NOT added: its only source sentence has inline [10] citation markers around every complication, so no bracket-free quote exists (same trap the reviewer flagged for the aortic [8]). HP:0011355 kept: the source describes the lesion as swollen/painful with peripheral spread and central decolorization, never as an erythematous plaque, so a narrower HP term would manufacture unsupported specificity. All gates green; 6/6 phenotypes connected.

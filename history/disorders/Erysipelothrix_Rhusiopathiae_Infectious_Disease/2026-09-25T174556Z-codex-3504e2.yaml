  summary: 'Create: Erysipelothrix Rhusiopathiae Infectious Disease'
  details: |
    Created the MONDO:0006752 species-level infectious disease entry from the OpenScientist report at research/Erysipelothrix_Rhusiopathiae_Infectious_Disease-deep-research-openscientist.md. The deep-research identity preflight returned SKIP, not FAIL, because MONDO records no human causal gene for this bacterial infection; manual preflight confirmed the report consistently targeted Erysipelothrix rhusiopathiae infectious disease / erysipeloid and the expected NCBITaxon:1648 pathogen. Curated a compact human entry with the E. rhusiopathiae infectious_agent, occupational animal/product/waste/soil cutaneous transmission, localized erysipeloid and septicemic-endocarditis pathophysiology branches, localized skin lesion and endocarditis phenotypes, and an Antibiotic Therapy treatment record capturing beta-lactam susceptibility plus vancomycin resistance. Used only three quotable cached PMID records and avoided OpenScientist term suggestions it had flagged as bad, including the obsolete GO:0052126 and mislabelled NCIT drug CURIEs. Validation during curation: just validate-terms, just count-verified-snippets, and just validate all passed for the new disorder file.

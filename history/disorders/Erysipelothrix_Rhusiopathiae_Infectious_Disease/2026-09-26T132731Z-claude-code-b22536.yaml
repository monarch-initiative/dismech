  summary: 'Review round: wire pathograph, split septicemia/endocarditis, add phenotypes/diagnosis/agents'
  details: |
    Addressed the blocking review findings on PR 12845. Wired the disconnected pathograph (now 6/6 phenotypes connected): added a Neuraminidase-mediated host-cell attachment and invasion node (GO:0004308) feeding both the cutaneous and invasive branches; split the bundled 'Septicemic dissemination with endocarditis' node into a Septicemic dissemination node (with host bacteremia risk factors) and an Endocardial infection of the aortic valve node; wired cutaneous infection -> {Localized erysipeloid lesion, Lymphadenopathy, Arthritis, Tenosynovitis} and septicemia -> endocardial infection -> Endocarditis. Added phenotypes Lymphadenopathy (HP:0002716), Arthritis (HP:0001369, polyarthritis of the diffuse cutaneous form), Tenosynovitis (HP:6001438). Bound therapeutic_agent on Antibiotic therapy: penicillin G (CHEBI:18208), ceftriaxone (CHEBI:29007), ciprofloxacin (CHEBI:100241), and added target_mechanisms linking it to the septicemic node. Added a diagnosis section (full-thickness dermal biopsy NCIT:C51692; blood culture with Gram stain/H2S NCIT:C25300) and a progression note on the self-limiting 2-4 week erysipeloid course, all from cached PMID:26693283. Osteomyelitis was dropped because its only cached mention is an interleaved multi-citation sentence with no bracket-free quotable span; recorded here rather than fabricating a quote. All snippets trimmed to exclude [N] citation markers, which the validator strips from the snippet but not the source. All CURIEs read from caches. validate-disorders passes (0 issues, 19 snippets).

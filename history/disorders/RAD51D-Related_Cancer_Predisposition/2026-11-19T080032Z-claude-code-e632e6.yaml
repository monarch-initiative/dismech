  summary: 'CI: bind the BCDX2 node''s molecular function and reflow a folded hyphen'
  details: |
    Fixes the two whole-repo gates failing on this branch. Both are listed in CLAUDE.md's whole-repo gate set; neither was run before the PR was opened.

    check_gene_activity_grounding. RAD51D reached only 'Germline RAD51D Loss of Function', and unlike the other three entries curated in this run no node in this entry carried molecular_functions: at all, so there was nothing to wire the gene to. The node where one belongs is 'Failure of BCDX2-Mediated RAD51 Loading and Fork Protection', which is MOLECULAR-scale and already carried two biological processes with no molecular function beneath them, which is exactly the gene -> molecular function -> biological process gap the gate describes.

    The term is GO:0003697 single-stranded DNA binding, DECREASED. It was chosen from RAD51D's own GO annotations rather than from memory: QuickGO reports GO:0003697 for UniProtKB:O75771 with IDA evidence, and the label was read from OLS. It is also what the node's description already asserted, that BCDX2 supports RAD51 filament nucleation and extension on resected single-stranded DNA, a sentence that until now had no snippet behind it.

    Two references were fetched to support it, both the paired Nature 2023 BCDX2 structures, and both quoted from the abstract: PMID:37344589 for RAD51D's own N-terminal domain contributing to the complex's ssDNA-binding specificity, and PMID:37344587 for BCDX2 orchestrating RAD51 assembly on single-stranded DNA for fork protection and double-strand break repair, which names both processes this node says fail together. A genes: descriptor for RAD51D on the same node makes the graph edge, as dismech.graph auto-links it.

    check_folded_hyphens. The PARP Inhibitor Therapy description had a folded-scalar line ending in 'homologous-recombination-', which folds to 'homologous-recombination- deficient'. Reflowed so the compound stays on one line. The prose is unchanged; no quoted snippet was touched.

    Re-ran after the edits: both gates clean; validate-disorders passed with 43 snippets and 45 titles, 0 issues, up from 41 and 43 by the two added references; gene-namespaces, snippet-grading, snippet-length, folded-yaml, block-scalar-comments, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, logical-rules, reference-titles and cache-order all clean. GO:0003697 was already in cache/go/terms.csv, so no cache row changed.

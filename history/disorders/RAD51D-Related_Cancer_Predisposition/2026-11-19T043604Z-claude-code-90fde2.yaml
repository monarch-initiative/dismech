  summary: 'Create: RAD51D-Related Cancer Predisposition'
  details: |
    Curated from an OpenScientist deep-research run (research/RAD51D-Related_Cancer_Predisposition-deep-research-openscientist.md, 39/39 references resolved, confabulation_rate 0.0). just preflight-dr returned PASS: RAD51D mentioned 227 times against RAD51C 49, and the report's OMIM 602954 is the RAD51D gene MIM.

    Entry shape follows design decisions §3a as a germline predisposition syndrome on the plain Mendelian rules, sibling to RAD51C-Related_Cancer_Predisposition, BARD1, PALB2 and CHEK2. ClinGen's own record states the same lumping decision for this concept and is quoted on the genetic row. just check-cancer-origin correctly skips the entry as a germline predisposition syndrome rather than assessing it as a neoplasm.

    Report content deliberately NOT carried into the entry as evidence: the provider's own tallies over ClinVar and gnomAD v4 (297 pathogenic records, one missense, the truncation-distribution and missense-triage null tests, ancestry-specific carrier frequencies) and its inter-atomic measurements in PDB 8OUZ. The report's structural re-measurement of Ser207 (17.6 A from the nearest XRCC2 atom, which would make the published interface explanation unlikely) is substantive and is recorded in that variant's description as an open question attributed to the report, with the functional defect cited to PMID:28646019 itself. PMID:37344587 had an unsupported quote in the report and PMID:38766263 was flagged off topic; neither is cited.

    Two report term bindings were wrong and were re-derived from OLS: HP:0100615 for high-grade serous tubo-ovarian carcinoma is HPO's Ovarian neoplasm, and HP:0100611 for fallopian tube carcinoma is HPO's Multiple glomerular cysts. The entry uses HP:0025318 and HP:0030394.

    Three of my own errors, all caught by gates and all from writing an identifier or title rather than reading one. LOINC:94077-8 on the diagnosis row does not exist; it was written from memory, just validate-terms cannot see LOINC because the prefix is not routed, and just loinc-seed-cache rejected it. The measurements block was removed and notes records why no LOINC code is bound. Five evidence snippets were paper titles rather than findings and were replaced with real abstract sentences. Replacing one of those introduced an evidence-claim mismatch on the peritoneal-carcinoma phenotype, which was then re-cited to the ACMG sentence that names primary peritoneal cancer and RAD51D directly.

    The PARP-inhibitor treatment carries a SUPPORT item for the ARIEL2 rucaparib result and a separate REFUTE item for the ACMG statement that there is insufficient evidence to guide targeted treatment in germline heterozygotes. They are kept as two items rather than merged because they are correct about different populations, which the treatment description states.

    Validation: just validate-disorders passed (38 snippets, 2 titles, 0 issues); just validate-terms passed; entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules, delivery-system, gene-namespaces, snippet-grading and shared-disease-terms all clean. just check-genereviews --online reports NO_CHAPTER for the disease and for RAD51D. 4 of 4 phenotypes are causally connected.

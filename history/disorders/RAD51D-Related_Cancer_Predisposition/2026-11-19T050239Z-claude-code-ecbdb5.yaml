  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #18441. All four IMPORTANT findings were correct and all are taken, with three of the four suggestions.

    1. No evidence item carried a reference_title. 43 were added, copied programmatically from the title: frontmatter of each references_cache/ file rather than typed. The top-level references: block does not accept the slot, so titles there stay as title:.

    2. The two prevalence records held penetrance, not prevalence: cumulative risk to age 80 within carriers, recorded with measure_type LIFETIME_PREVALENCE and a population of 'carriers', which anything reading prevalence would have taken as disease occurrence in 13% of a population. The reviewer's preferred fix, a CARRIER_FREQUENCY record modelled on the RAD51C sibling, is not available: PMID:32359370 gives a RAD51C-specific control frequency but no RAD51D one, and PMID:26261251's 0.11% control figure covers RAD51B, RAD51C and RAD51D combined. The section was therefore dropped, which the review allowed. The penetrance figures were already on the phenotypes they describe. The one genuinely per-gene frequency in the sources, RAD51D in 0.35% of epithelial ovarian cancer cases, moved to Genetic.case_fractions, which is its correct home.

    3. The reversion node's snippet covered BRCA1, RAD51C and RAD51D together while its explanation claimed it named RAD51D specifically. Replaced with the sentence the reviewer identified, which names RAD51D and states both halves of the node's claim.

    4. Three passages of the entry-level notes were a curation session log rather than facts about the disease (how the LOINC code came to be wrong, which HP terms the report mis-bound, the provider's computations). Per CLAUDE.md's rule that notes: is written for a human reader and not as a process diary, they were cut to one sentence per point that a future curator needs, and the detail lives here instead. The Ser207 note on the variant was left as it was.

    Suggestions taken: the cohort-makeup quote on Fallopian tube carcinoma was dropped, since it describes the study population rather than RAD51D; the somatic-loss node was paired with the ACMG wild-type-allele sentence and its STIC item marked directness: INDIRECT, since a precursor lesion does not demonstrate loss of the second allele; the Rad51d-null mouse (PMID:10705376) was added as an animal model with relationship FAILS_TO_RECAPITULATE and two typed divergences, because midgestation lethality in a constitutional homozygous null models neither the heterozygous carrier state nor the somatic second hit; and an Enhanced Breast Surveillance treatment row was added carrying both the ACMG breast-surveillance recommendation and its statement that ovarian surveillance has no proven benefit, which is the contrast that explains the asymmetric management.

    Two further identifier errors of mine were caught during this round, both from writing an ID rather than reading one. MGI:1347361 is Mmp23, not Rad51d; the correct MGI:1261809 was read from the NCBI Gene record's own Gene-ref_db block and confirmed with just check-gene-namespaces-online, and the stale Mmp23 row the online resolver had cached was removed since nothing in kb/ binds that gene. NCIT:C17057 Screening is not reachable from NCIT:C25218 and failed the TreatmentActionTerm enum; the surveillance row now binds NCIT:C15546 Breast Cancer Screening.

    An earlier attempt at the notes edit anchored on the first 'notes: >-' in the file, which is the nested one inside classifications.harrisons_chapter, and corrupted the block. Caught by a YAML parse failure, the file was restored from git and the edit redone against the top-level anchor.

    Validation after the round: just validate-disorders passed (41 snippets, 43 titles, 0 issues); just validate-terms passed; check-snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, coarse-phenotypes, logical-rules, delivery-system, gene-namespaces-online, cache-order and term-cache-integrity all clean. 4 of 4 phenotypes causally connected.

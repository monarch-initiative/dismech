  summary: 'Create: Dilated Cardiomyopathy 1A (LMNA, MONDO:0007269)'
  details: |
    Created the LMNA-related dilated cardiomyopathy (CMD1A) entry de novo.

    Deep research: the /curate default provider falcon failed with HTTP 402 (Edison account out of credits) and openscientist failed with HTTP 401 (the running container held a stale key that could not be refreshed mid-session), so the deep-research pass was run with the keyless claude_code provider (research/Dilated_Cardiomyopathy_1A-deep-research-claude_code.md). Its own reference validation reported 18/18 references resolved, confabulation_rate 0.0, and needs_review true on account of two off-topic flags. NEC preflight against MONDO:0007269 returned PASS: LMNA mentioned 63 times, and the report OMIM 115200 matches the MONDO xref.

    GeneReviews baseline PMID:20301717 (LMNA-Related Dilated Cardiomyopathy) was fetched, tagged in the top-level references block, and cross-referenced for phenotypes, management, surveillance intervals and the pregnancy contraindication.

    Two errors in the deep-research report were caught and corrected. It cited PMID:17672370 for Muchir et al. J Clin Invest 2007; that identifier resolves to an unrelated mammography paper and was one of the two off-topic flags, so the correct identifier PMID:17446932 was located independently and is what the entry cites. It also proposed HP:0011712 for first-degree atrioventricular block, which is in fact Complete right bundle branch block; HP:0011705 is used instead.

    Curated nine pathophysiology nodes spanning the mechanical-fragility and gene-regulatory arms, two mechanistic_hypotheses (CANONICAL nuclear-envelope rupture, ALTERNATIVE lamina-chromatin/LAD), and three discussions including a HUMAN_MODEL_MISMATCH recording that the mouse MAPK rationale reached phase 3 and failed for futility. Conformance declared to cardiomyopathy_maladaptive_remodeling at three nodes and to fibrotic_response#Excessive ECM Deposition. Three animal models and one iPSC experimental model carry modeled_mechanisms, including a FAILS_TO_RECAPITULATE link preserving the negative chromatin-compartment result. Two clinical trials curated (REALM-DCM phase 3, terminated for futility; and the phase 2 study). Three GEO datasets added, all LMNA-specific after manual relevance triage.

    Validation: just validate passes end to end (schema, terms, references) with 86/86 snippets verified against cached references; just count-verified-snippets 86/86; just verify-datasets 3/3 OK; just check-duplicate-keys OK; just check-title-snippets reports no new title-quoting snippets; weighted compliance 87.8 percent. The slow full-text just validate-references sweep was not run separately; the reference check reported here is the one bundled in just validate plus the offline snippet audit.

    One modeling error found in self-review was corrected before commit: the LMNA share of DCM cases had been encoded as prevalence rate_per_100000, which asserts a 6.2 percent population prevalence rather than a share of DCM cases. It was moved to genetic[].case_fractions and the prevalence record set to NOT_YET_DOCUMENTED.

  summary: Correct dataset record errors surfaced by the GEO reference check
  details: |
    Corrected organism on the geo:GSE330200 dataset record. It declared Homo sapiens under a title ending 'in a knock-in mouse model'. NCBI reports the series under two taxa (Homo sapiens; Mus musculus), so the previous value was not simply wrong -- but organism is single-valued, and declaring only human under a mouse-model title is misleading. It now records Mus musculus (NCBITaxon:10090), and notes states explicitly that GEO lists both taxa and that the human samples are not represented by that slot. Raised by automated review on PR #10162, which reported the series as mouse; the mixed taxon was confirmed against NCBI esummary.

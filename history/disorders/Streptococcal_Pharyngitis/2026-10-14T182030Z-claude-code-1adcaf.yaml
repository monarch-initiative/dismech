  summary: 'Review fix: swap to the method-less organism-identity LOINC code'
  details: |
    Reviewer correction: the original binding, LOINC:18481-2 (Streptococcus pyogenes Ag [Presence] in Throat), is both method-specific (antigen) and specimen-specific (throat) for a row describing three methods. Swapped to LOINC:105063-2 (Streptococcus pyogenes [Presence] in Specimen), which names the organism without committing to a detection method or specimen, so it covers culture, rapid antigen and NAA in one code -- the Part/panel-level identity binding CLAUDE.md requires. Reworded the row's notes accordingly. Removed the now-unused 18481-2 row from cache/loinc/terms.csv (confirmed nothing else in kb/ references it) and seeded 105063-2 after confirming it was absent from origin/main.

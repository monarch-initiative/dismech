  summary: 'Gene-family review: NDUFA6'
  details: |
    The NDUFA6 Q-module node had no molecular function. NDUFA6 is a LYR-motif accessory subunit whose loss depletes other Q-module subunits (PMID:30245030); the node now binds structural molecule activity, decreased. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

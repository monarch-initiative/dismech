  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 33 (NDUFA6)'
  details: |
    De novo curation of MC1DN33 (MONDO:0032636, NDUFA6) from claim issue #11473.

    Scope decision: DISEASE, standalone entry. MONDO:0032636 has one superclass
    (MONDO:0100223, mitochondrial complex I deficiency nuclear type) and no descendants,
    and the knowledge base already curates thirteen other MC1DN types as standalone
    per-gene entries. The stub is deleted.

    Evidence base. The disease literature is one paper: Alston et al. 2018 (PMID:30245030,
    four unrelated children, full text available through PMC). It is supplemented by the
    ClinGen Mitochondrial Diseases GCEP assertion for NDUFA6 / mitochondrial disease
    (Moderate, 2024-04-29), two Yarrowia lipolytica studies of the orthologous subunit
    (PMID:24706851, PMID:33243981), and the C. elegans suppressor study ClinGen counts as
    experimental evidence (PMID:38215760). 98 of 98 evidence snippets verify against the
    cached references; no DOI-prefixed references are cited, so nothing was skipped by
    prefix.

    Independent completeness check. A PubMed search on 2026-09-08 for NDUFA6 (58 records)
    and for NDUFA6 combined with deficiency / disease / syndrome / case / proband returned
    no patient report other than PMID:30245030, which matches ClinGen's statement that the
    2018 paper is the first and only report. A search for an Ndufa6 knockout mouse returned
    no hits; that negative is recorded in the entry as a searched absence with the query,
    not as a bare assertion.

    Two traps recorded in the entry rather than left for the next curator. First, transcript
    dependence: NDUFA6 has three in-frame isoforms with alternative initiation methionines,
    the RefSeq accession was revised because of this paper, and subject 3's start-loss
    allele is pathogenic or tolerated depending on which transcript it is numbered against.
    That is curated in the genetic notes and as discussion
    mc1dn33_normal_enzymology_in_subject_3. Second, Named Entity Confusion: 57 of the 58
    PubMed records for this gene are common-variant or expression-signature work
    (schizophrenia risk, tetralogy of Fallot, myeloma, glioma, sepsis, preeclampsia, the
    NDUFA6-DT lncRNA), none of which is cited anywhere in the entry.

    Pathograph. Nine pathophysiology nodes from the biallelic variant through Q-module
    subunit loss, the stalled ~830 kDa intermediate with retained NDUFAF2, the catalytically
    inactive supercomplex, isolated complex I deficiency, impaired respiration, lactate
    accumulation and brain injury. Nineteen phenotypes. Three phenotypes are deliberately
    left unwired (intrauterine growth retardation, decreased total neutrophil count, sparse
    hair) because the source proposes no mechanism for them; each says so in its own notes.
    Hypoglycaemia and hyperammonaemia are wired with INDIRECT_UNKNOWN_INTERMEDIATES and an
    explicit statement that the edge is a placement rather than an explanation. Two nodes
    are marked PROVISIONAL where the source hedges. No dangling causal targets.

    Deliberate omissions. No Leigh syndrome phenotype, because none of the four children was
    given that diagnosis - which distinguishes this entry from siblings MC1DN34 and MC1DN36.
    No biochemical block, no clinical trials (none registered), no imported generic
    mitochondrial-encephalopathy management. Three symptomatic treatments are curated
    because the paper records them in named patients; none carries an effectiveness claim,
    since none is reported.

    Validation run: just validate (schema, terms, references), count-verified-snippets
    (98/98), check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-enum-values, check-qualifier-terms, plus the whole-KB snippet ratchets and
    validate-disorders.

    Cache provenance note. The CGGV assertion cited here was rebuilt during this curation
    because it was absent from the committed cache. The ClinGen gene-validity CSV
    downloaded on 2026-09-08 no longer matches the sha256 pinned in
    data/clingen/MANIFEST.yaml - ordinary unversioned-URL release drift, which the manifest
    itself documents as expected. The NDUFA6 row is byte-identical to the copy in the
    pinned-era working tree and the assertion is dated 2024-04-29, so the record is
    unaffected. Repinning the manifest is a separate change and is not made here.

  summary: Add nOH mechanism chain conforming to the module
  details: |
    Antibody-Mediated Ganglionic Acetylcholine Receptor Dysfunction now conforms to the module ganglionic lesion node. The edge from Postganglionic Sympathetic and Parasympathetic Failure to Orthostatic Hypotension is routed through two new conforming nodes, Deficient Norepinephrine Release on Standing and Failure of Baroreflex-Mediated Vasoconstriction; its original PMID:18951069 evidence stays on the final edge to the phenotype, and the release edge cites PMID:28702747. No pressor drugs added: a PubMed search for pyridostigmine, midodrine or droxidopa in autoimmune autonomic ganglionopathy returned case reports only, and one cached case report found pyridostigmine had no effect. Validated with just validate, validate-terms, count-verified-snippets (95/95), check-causal-targets, check-entity-refs and check-snippet-grading.

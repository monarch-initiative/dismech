  summary: 'LOINC: bind ganglionic AChR antibody code'
  details: |
    Bound LOINC:42233-7 (Acetylcholine receptor ganglionic neuronal Ab [Moles/volume] in Serum, method-less) to the Serum Ganglionic Acetylcholine Receptor Antibodies biochemical record, as part of dismech LOINC Diagnostics tranche C (autoantibodies). Deliberately did not reuse LOINC:30192-9 (the muscle AChR antibody code bound on Adult-Onset_Myasthenia_Gravis in a previous PR, #14439): the entry's own text and cited cohort data specifically concern the ganglionic-neuronal alpha3/beta4 subunit receptor, a different analyte from the muscle AChR targeted in myasthenia gravis, confirmed by searching the Monarch KG for 'ganglionic acetylcholine receptor antibody' and finding a dedicated ganglionic-neuronal code family distinct from the muscle AChR panel. A note was added on the biochemical record stating this distinction explicitly. [Moles/volume] was chosen over [Presence] because no method-less [Presence] variant exists for this analyte (only Moles/volume, by-Immunoassay Moles/volume, and an IgG+IgM-specific by-Immunoassay variant were found). Label verified against the Monarch KG entity API in the same step it was written. Confirmed absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

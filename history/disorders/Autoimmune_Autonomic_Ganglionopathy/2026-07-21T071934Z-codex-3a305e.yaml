  summary: Review autoimmune autonomic ganglionopathy
  details: |
    Completed a full evidence and ontology review while preserving the deprecated
    updated_date. Clarified the boundary between contemporary acute/chronic AAG
    and the narrower ontology-linked acute pandysautonomia/Guillain-Barre
    presentation; replaced unvalidated alpha3/beta4 assay groups with cautious
    seropositive and seronegative-putative categories. Added biological scale and
    confidence to four mechanisms, wired all eleven phenotypes, represented
    CHRNA3/CHRNB4 as autoantigen components rather than inherited causes, and
    added objective diagnosis, four differentials, an induced mouse model,
    action-categorized immune and supportive treatments, current long-term
    outcome evidence, an audited six-person completed IVIG trial, and four open
    knowledge gaps. No suitable AAG-specific public omics dataset was found.

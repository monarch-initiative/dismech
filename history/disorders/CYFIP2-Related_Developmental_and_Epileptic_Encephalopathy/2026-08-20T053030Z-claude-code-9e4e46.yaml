  summary: Address re-review on PR 9046
  details: |
    Addressed both items from the second review round on PR 9046. The first was my error and the reviewer was right to insist on it. The entry had declined to curate the Xenopus laevis gain-of-function tadpole model on the stated ground that the preprint had no PMID or DOI resolving through the reference cache. That was asserted without testing: DOI:10.1101/2022.12.07.519540 resolves and caches normally, as bioRxiv DOIs cited elsewhere in this knowledge base already do. This is the third instance in this batch of the same failure mode - a confident negative claim about the sources that nothing in the validation stack checks, since the validators verify snippets that exist and say nothing about assertions that no snippet exists. The model is now curated with two mechanism links. It carries a genuine dissociation worth preserving: Arg87Cys produced seizure-related darting and circling behaviour while Tyr108Cys did not alter behaviour at all, yet both produced spontaneous epileptic brain activity, so a behavioural readout alone would have scored the second variant as unaffected. Valproate reduced the hyperactivity for both, which is the pharmacological control that argues the activity is seizure-like rather than an overexpression artefact. Limitations record transient ectopic mRNA overexpression rather than endogenous expression, which also means the model cannot bear on the competing protein-destabilization hypothesis since that is a claim about steady-state abundance, and preprint status. The second item was a self-contradiction: the Seizures phenotype description said seizures are effectively universal while the frequency band directly below said FREQUENT and the evidence explanation said epilepsy is not universal. The description now states the 32 of 42 figure and draws the consequence, that a variant carrier without seizures is an expected part of the spectrum. Also clarified that the OBLIGATE band on intellectual disability rests on a global developmental delay count rather than formal cognitive testing. Validation: 36 of 46 snippets verified with 10 skipped by prefix; all 10 DOI-prefixed snippets were hand-verified against the cached records by whitespace-normalized substring match, and all pass.

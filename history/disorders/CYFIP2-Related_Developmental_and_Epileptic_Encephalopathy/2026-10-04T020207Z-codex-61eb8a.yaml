  summary: Review CYFIP2 clinical spectrum and variant-specific mechanisms using
    full primary text
  details: |
    Reviewed the complete entry and matching deep-research narrative/citations against cached primary literature. Rebased onto origin/main 79b536d120484e6edf7daa96d0ef5170b01b748a. This Mendelian entry had CREATE/EDIT records but no REVIEW and no overlapping open curation PR. Infectious and environmental disorders remain excluded from this campaign.

    Clinical review: used full texts of Zweier2019 (regenerated cache now includes the body), Begemann2021, Cardoso2023, Salokivi2024 and Squire2025. Removed claims of universally severe intellectual disability, refractory epilepsy from onset, uniformly normal MRI and absence of human quiescent intervals. Separated global delay from formal intellectual disability, added feeding/swallowing, visual, behavioral, sleep, movement and hematologic findings with cohort-specific denominators and uncertainty. Added structural imaging findings and developmental regression. The Squire review table includes language-only delay and variants originally classified uncertain; pooled observations are not penetrance estimates. Neutropenia is an association of unresolved causation.

    Genetic review: added explicit Arg87/Asp724, in-frame deletion, late splice-truncating, Val551Leu and Gln95ProfsTer15 records. Preserved uncertain significance of early truncations in the2021 cohort, incomplete parental segregation for Val551Leu, and predicted rather than demonstrated protein consequences. Removed the erroneous shared cytogenetic location of CYFIP1 and CYFIP2.

    Mechanistic review: consumed Schaks2020 full text, including the CYFIP1 proxy constructs and direct CYFIP2 Arg87Cys experiment. Replaced direct-actin-binding annotation with the measured WAVE-domain interaction; distinguished ubiquitination, proteasomal turnover and reduced protein abundance. Removed the forced mutually exclusive gain-of-function versus dosage-loss framing. The late truncation fails WRC incorporation in its homologous assay, whereas activating R87C remains associated with the complex.

    Read Ma2025 full Results/Discussion and figure captions, plus Zaboroski-Silva2026 Results/Discussion/methods. Mouse synaptic/glial/lipid observations remain model-scoped associations without an invented complete causal chain. Separated patient heterozygous neural progenitors from engineered homozygous cells/organoids and retained the negative monolayer electrophysiology result. Added fibroblast and reconstitution models. The ligand screen is preclinical thermal-solubility evidence with no demonstrated functional rescue; candidate drugs are not presented as established treatments. Corrected Xenopus model exclusivity and valproate overgeneralization; its source remains a preprint. The available Kang2023 and Amato2025 abstracts were used within their limits.

    Management review: added observed lacosamide, ACTH/vigabatrin, ketogenic diet and clonazepam responses with their case-level limits, plus expert developmental/feeding support and genetic counseling. The offline GeneReviews/StatPearls check found no chapter. Official ClinicalTrials.gov CYFIP2 search returned two unrelated studies and no disease-specific trial to add. Computational WRC literature was checked as supplementary structural context; unrelated normal-gene and cancer biology was not imported.

    Regenerated all changed reference caches through just fetch-reference. Added verified GEO records for the knock-in bulk transcriptomes, heterozygous-null comparator and single-nucleus hippocampal data. No reference-cache text was hand-edited. Completeness cross-check covers phenotypes, genetics, mechanisms, diagnostics, treatments/trials and references; no separately established mechanistic subtype required creation. Human prognosis and the causal transitions from actin changes to seizures remain explicit knowledge gaps.

  summary: Address review on PR 9046
  details: |
    Addressed the review on PR 9046. Fetched Squire et al. 2025 (DOI 10.1002/cns3.70036) as the reviewer asked. The paper turned out to supply better material than the request implied: a 42-patient literature review with real denominators, which let three phenotypes gain evidence-backed frequency bands where they previously had none - global developmental delay OBLIGATE at 42 of 42, epilepsy FREQUENT at 32 of 42 or 76 percent, and epileptic spasms FREQUENT at 16 of 32 or 50 percent of those with seizures. That epilepsy is not universal in this disorder is a finding the earlier twelve-patient series could not have shown. A prevalence record was added with measure_type CASES_IN_LITERATURE and prevalence_class ULTRA_RARE, citing both the 42-patient count and the earlier 18-patient count so the trajectory of ascertainment is visible. The Arg87Cys share of cases, 12 of 42, was added to the genetic section. Two review items are declined with the checks recorded in notes. The hyperkinetic movement phenotype at 17 percent could not be curated: that figure comes from the deep-research report citing Squire 2025, but the retrievable abstract of that paper contains no mention of hyperkinetic, dyskinetic or choreiform movements at all, so the percentage cannot be quoted from its stated source. The Xenopus tadpole model is available only as a bioRxiv preprint with no identifier that resolves through the reference cache, so it cannot carry a verifiable snippet. Note that DOI-prefixed references are not snippet-checked by the validators because DOI sits in skip_prefixes; the five DOI-sourced snippets here were verified by hand against the cached record, and this is stated in the entry notes. Validation after fixes: 36 of 41 snippets verified with 5 skipped by prefix; schema, terms, folded-hyphen, title-snippet and snippet-length checks pass.

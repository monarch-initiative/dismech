  summary: Record the valproate divergence on the Xenopus model
  details: |
    Took the non-blocking suggestion from the third review round on PR 9046, because it is a statement about model validity rather than a style point. The entry already cited both halves of a divergence without connecting them: the Xenopus tadpole hyperactivity was reduced by valproate, while the entry's own Drug-Resistant Epilepsy phenotype cites a genotype-confirmed patient who remained refractory despite vigabatrin, phenobarbital, valproic acid and a ketogenic diet. The model is therefore valproate-responsive against a valproate-refractory human disorder. Nothing false was asserted before this change, since the readout is scoped to seizure behaviour rather than drug resistance and the link is already PARTIALLY_RECAPITULATES at LOW fidelity, but the partiality was generic where it could be specific. The limitations block now names the divergence and draws the consequence that matters: the preprint proposes this model as a pre-clinical drug-testing platform, so a compound that suppresses activity in the tadpole has not thereby been shown to work in patients. Validation unchanged at 36 of 46 snippets verified with 10 DOI-prefixed skipped by the validator; schema, folded-hyphen and duplicate-key checks pass.

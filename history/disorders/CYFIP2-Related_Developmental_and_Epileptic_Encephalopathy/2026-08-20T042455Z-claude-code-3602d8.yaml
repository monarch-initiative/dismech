  summary: 'Create: CYFIP2-Related DEE (DEE65)'
  details: |
    New entry for DEE65 (MONDO:0033374, OMIM 618008, CYFIP2 hgnc:13760), curated from a claude_code deep-research run. NEC preflight PASS with the cleanest report of the batch: CYFIP2 at 75 mentions against the paralog CYFIP1 at 3, OMIM 618008 matching the MONDO xref, and no needs_review flag. Two ontology bindings proposed by the report were wrong and were corrected against OAK: GO:0071203 is the WASH complex, not the WAVE regulatory complex, which is a different protein complex entirely and would have mis-assigned CYFIP2 - GO:0031209 SCAR complex is the correct term, SCAR and WAVE being synonyms; and HP:0031375 is the bare modifier Refractory, not drug-resistant epilepsy, so the KB convention HP:0020174 Refractory drug response was used. A third term, HP:0000735 Impaired social interactions, is obsolete in HPO with no adequate replacement, so that descriptor is deliberately left unbound with an NTR note rather than forced onto HP:0000729 Autistic behavior, which would overstate the quoted source. No GeneReviews chapter exists for CYFIP2. Eight references cited, four with full text. The entry curates the published disagreement over mechanism as two competing mechanistic_hypotheses - WRC gain of function CANONICAL versus reduced CYFIP2 protein stability ALTERNATIVE - with the causal edges tagged to hypothesis groups rather than one account being asserted over the other. Validation: just validate passed with 35 of 35 snippets verified; validate-terms, check-duplicate-keys, check_folded_hyphens, check_environmental_evidence, check-title-snippets and check_snippet_length all pass. The snippet-length gate caught a genuine four-word fragment that had been split by an abbreviation period; it was replaced with the full contiguous sentence.

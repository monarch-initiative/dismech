  summary: Enrich SMAD6-related craniosynostosis pathograph, cranial vault phenotypes, and treatment links
  details: '- Added `GO:0030514` (`negative regulation of BMP signaling pathway`, DECREASED) ontology binding and functional MH2-domain BMP-restraint `IN_VITRO` evidence from PMID:32499606 to `Germline SMAD6 loss with impaired BMP restraint`, and wired it downstream to `Developmental or intellectual delay` (PMID:32499606). - Renamed `Premature midline cranial suture fusion` to `Premature cranial suture fusion` to encompass both midline-predominant and coronal/multisuture involvement, and wired it downstream to `Coronal craniosynostosis`, `Trigonocephaly`, and `Hypotelorism` with clinical evidence from PMID:32499606. - Wired `Cranial vault growth restriction and raised intracranial pressure risk` downstream to `Raised intracranial pressure`. - Added `Trigonocephaly` (`HP:0000243`) and `Hypotelorism` (`HP:0000601`) phenotypes supported by clinical evidence from PMID:32499606. - Added `target_mechanisms` and `target_phenotypes` bindings across `treatments`.'

  summary: 'Create: MEGF8-related Carpenter syndrome (CRPT2)'
  details: |
    De novo curation of CRPT2 (MEGF8, MONDO:0013998) from a Perplexity sonar-deep-research report used as leads only; evidence rebuilt from PubMed. NEC preflight PASS (MEGF8 264 mentions vs RAB23 28, which is the correct differential rather than confusion; OMIM 614976 among those cited). The main curation finding corrected a framing I had asserted in the claim issue: Carpenter syndrome is usually described as loss of a negative regulator of Hedgehog signalling producing both craniosynostosis and polysyndactyly, but a 2026 study shows that for MEGF8 the craniosynostosis is Hedgehog-INDEPENDENT and BMP-driven, refractory to Hedgehog blockade and selectively rescued by BMP type I receptor inhibition, while only the limb defects are Hedgehog-dependent and SMO-rescuable. The pathophysiology is therefore bifurcated at the MEGF8 node into a Smoothened-degradation arm and a BMPR1A-turnover arm rather than routed through a single Hedgehog chain. Curated the Megf8 conditional/temporal deletion mouse with a FAILS_TO_RECAPITULATE link on the cardiac arm - deletion in any of five cardiac lineages produced no cardiovascular defect - which is the structural signal that the cardiac disease is downstream of the laterality defect rather than an independent cardiac requirement; the link carries both limitations and evidence as the schema requires for a negative claim. Declared conformance to three limb_digit_patterning_serial_homology nodes (polysyndactyly of hands and feet is exactly that module's serially homologous bundle) and explicitly DECLINED conformance to ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction, recording the reason in notes: that node is cilium-anchored, whereas MEGF8 restrains Hedgehog by promoting Smoothened degradation with no evidenced ciliary defect. Two KNOWLEDGE_GAPs: whether the mouse Hh/BMP partition holds in human tissue (the whole partition rests on one 2026 study, and human alleles are hypomorphic where the mouse work uses complete loss), and whether biallelic null MEGF8 is truly lethal or merely unobserved across fifteen patients. One snippet hit the bracket-stripping tooling gap again, this time on [CRPT1]/[CRPT2]; requoted rather than editing conf, and added to the filed issue. Validation: schema clean; 32/32 snippets verified; term validation passed first run; all five ungated CI gates clean; model-readout and conforms_to foreign-key tests passed.

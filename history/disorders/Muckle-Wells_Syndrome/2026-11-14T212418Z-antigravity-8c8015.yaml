  summary: Review and enrich Muckle-Wells_Syndrome
  details: >-
    Audited and enriched Muckle-Wells_Syndrome (MONDO:0008633). Repaired the germline lesion node NLRP3 gain-of-function activation by grounding wild-type NLRP3 molecular functions (GO:0005524 ATP binding and GO:0140378 protein complex scaffold activity) and keeping downstream myeloid cell types (CL:0000576 monocyte, CL:0000235 macrophage) on the cellular and cytokine maturation nodes. Added module conformance to nlrp3_inflammasome_activation on Constitutive NLRP3 inflammasome activation and Caspase-1 activation and IL-1beta overproduction while preserving protected node names. Added Orphanet ORPHA:575 structured cache evidence for Neutrophilic urticaria synonym, European <1/1,000,000 point prevalence, germline causative NLRP3 relationship, evidenced Harrison chapters (IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE) and IUIS autoinflammatory syndrome classification, and four atomic diagnostic entries (NCIT:C101293 Next Generation Sequencing, NCIT:C38036 Audiometric Test, NCIT:C47868 Blood Chemistry Measurement, NCIT:C74760 Urine Protein Measurement).

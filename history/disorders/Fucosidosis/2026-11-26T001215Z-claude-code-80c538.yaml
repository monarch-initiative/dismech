  summary: 'Gene-family review: FUCA1; repair truncated snippet and cite GeneReviews'
  details: |
    Reviewed FUCA1 modelling: CAUSATIVE germline record with the ClinGen Definitive tier recorded, and a node binding alpha-L-fucosidase activity (GO:0004560) as decreased, matching the lysosomal exoglycosidase that removes alpha-linked fucose from glycoconjugates. No modelling change was needed. The PMID:33266441 evidence quote stopped before its claim ('caused by mutations in the FUCA1 gene resulting in'); it now carries the full sentence ending 'resulting in alpha-L-fucosidase deficiency'. The GeneReviews chapter (PMID:41926607, NBK621565) is now tagged in references and quoted on the FUCA1 record. Recent work checked (readthrough rescue of nonsense alleles PMID:41200823; FUCA1/FUCA2 tissue versus plasma activity PMID:40940767) does not change the modelling.

  summary: Link ultraviolet and ionizing radiation to the somatic second hit
  details: |
    Backfill for issue #8085. Both radiation entries target the 'PTCH1 Somatic Second-Hit Loss' node rather than the germline first-hit node, which is the point: the first hit is inherited and unavoidable, while radiation supplies the somatic second hit in exposed tissue. Both are TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES via DNA damage and mis-repair. Both links now rest on mechanism-bearing evidence: the ionizing link documents radiogenic basal cell carcinomas arising in the irradiated field, and the ultraviolet link cites PMID:12007715, which recovers UV-signature C to T and CC to TT changes at dipyrimidine sites in PTCH mutations from basal cell carcinomas. That citation was added in response to PR review, replacing a clinical sun-avoidance recommendation that could not carry the TRIGGERS grading. The cited series is sporadic disease and the explanation states the inference to germline carriers explicitly. The evidence_source on the ionizing item was also corrected from OTHER to HUMAN_CLINICAL, since the quoted text is clinical follow-up of irradiated patients and a sibling item in the same file quoting the identical snippet leaves the field unset, which defaults to HUMAN_CLINICAL. Validated with linkml-validate and just validate-terms; integrity issue count unchanged.

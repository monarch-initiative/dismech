  summary: 'Integrate assessed OpenScientist findings: GLI bypass resistance model'
  details: |
    Assessed kb/hypotheses/Gorlin_Syndrome/gli_bypass_resistance_model/openscientist.md (verdict PARTIALLY_SUPPORTED; sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml plus .md narrative) and integrated its RETAINED and QUALIFIED claims. Added seven evidence items to the gli_bypass_resistance_model hypothesis entry, each backing a clause the notes already asserted without a citation: PMID:24651015 (SUFU-mutant and MYCN-amplified SHH-medulloblastoma xenografts primarily resistant while PTCH1-mutant respond), PMID:21123452 (GLI2/Ccnd1 amplification downstream of SMO, with its murine-allograft provenance stated), PMID:29055107 (class I HDAC inhibition blocks GLI in SMOi-resistant cells), PMID:40492880 twice (77 percent acquired resistance in advanced BCC as SUPPORT; sustained suppression in all 11 Gorlin patients who stayed on therapy as REFUTE), PMID:30707899 twice (resistant BCCs usually maintain HH activation as SUPPORT; cilia-loss RAS/MAPK subset with reduced GLI output as REFUTE), and PMID:30297801 (WNT-dependent persister identity switch, mouse model, REFUTE). Corrected the notes block: the report's headline 9.1 percent versus 77 percent resistance comparison is not like-for-like, since PMID:38867459's 9.1 percent is the share of treatment interruptions attributable to secondary resistance rather than the share of 351 Gorlin patients, and PMID:40492880's 77 percent is 10 of 13 locally advanced or metastatic BCC patients. Replaced it with the Gan cohort's own Gorlin-specific observation. Added PMID:26765315 to the existing gap_gli_directed_therapy_resistance discussion, which previously cited only a review of preclinical agents; the trial separates the pharmacodynamic result (GLI1 mRNA down 75 percent) from the clinical one (best response stable disease, no tumor shrinkage). Added a new KNOWLEDGE_GAP discussion gap_gorlin_specific_resistance_mechanism with a paired pre/post-treatment multi-patient Gorlin resistance-genomics experiment, since the entry cited the lineage-transition finding but recorded nowhere that the Gorlin-specific mechanism rests on one patient. Deliberately not changed: status stays EMERGING because the report's recommended PARTIALLY SUPPORTED is not a MechanisticHypothesisStatusEnum value and the report's own findings argue against promotion for a PTCH1-dominated entry; no new pathophysiology nodes for BCC-to-SCC transition, WNT persistence, or cilia loss, since these are acquired treatment-resistance states documented in sporadic BCC rather than Gorlin disease mechanisms; no ontology terms bound, because the report mislabels CL:0002559 as hair follicle infundibulum basal cell when the cache records hair follicle cell, and GO:0043408 is not cached; nothing curated from PMID:22391311, which states a proposed arsenic binding mode as established fact, nor from PMID:33608498, PMID:29550418, PMID:38757343, or PMID:37597490, none of which carry BCC or Gorlin data. Checks run: count-verified-snippets 127/134 verified with 7 skipped by prefix and no failures, check-duplicate-keys OK, check-entity-refs OK, check-causal-targets OK, check-enum-values OK, check-snippet-grading OK, validate-hypothesis-assessment passed.

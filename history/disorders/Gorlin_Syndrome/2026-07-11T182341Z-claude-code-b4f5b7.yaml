  summary: Detailed claim-by-claim evidence review of Gorlin syndrome (NBCCS) entry
  details: |
    Scope: full, manual (non-scripted) claim-by-claim review of the entire
    kb/disorders/Gorlin_Syndrome.yaml entry (1948 lines). Every evidence snippet
    across the disease description, external_assertions, definitions,
    has_subtypes, prevalence, inheritance, progression, pathophysiology (all 10
    nodes), mechanistic_hypotheses (3 groups), phenotypes (30), genetic (PTCH1,
    PTCH2, SUFU), environmental, treatments (8), and discussions (3) was read
    directly against its cached reference in references_cache/ and confirmed to
    be an exact substring, with the surrounding claim/explanation checked against
    what the quoted text actually supports.

    References verified (all snippets exact substrings; no fabricated PMIDs, no
    hallucinated quotes, no invented ontology terms): PMID:19032739, 9096761,
    22918513, 8326488, 25403219, 28596197, 35768194, 29186568, 38282294,
    31533758, 34888241, 40105068, 20301330 (GeneReviews), 6837723, 39545486,
    41396574, 37947611, 22670904, 31036756, 10027293, 32747535, 29088246,
    15107405, 37481904, 18479681, 22491411, 31072004, 33860896; plus structured
    sources ORPHA:377, CGGV PTCH1 (Definitive) and PTCH2 (Limited) assertions,
    and CGDS:HGNC_9585. The entry passed linkml-validate (schema), the
    linkml-term-validator (labels), and the linkml-reference-validator both
    before and after edits.

    Overall assessment: unusually high-quality, well-evidenced entry. Snippet
    fidelity is 100%. Only a small number of claim/explanation calibration
    issues were found and fixed in place.

    Fixes applied in this review:
    1. Cardiac Fibroma frequency OCCASIONAL -> VERY_RARE. Cited evidence is 2-3%
       (Evans 1993 PMID:8326488 = 3%; GeneReviews PMID:20301330 = ~2%), which is
       below the OCCASIONAL floor (5-29%) and within VERY_RARE (<5%).
    2. Multiple Basal Cell Carcinomas: rewrote the PMID:40105068 evidence
       explanation, which overreached beyond its snippet by asserting a
       "scalp/superficial predilection" (that finding is elsewhere in the
       abstract, and the quoted snippet actually reports nodular BCC as the most
       common subtype). Explanation now matches the snippet (head-and-neck
       predominant; nodular most common).
    3. Congenital Cataracts: the 26% figure from PMID:8326488 is a COMBINED
       "squint or cataract" ophthalmic-abnormality rate, not cataract-specific.
       Clarified the phenotype description (cataract ~18%, combined up to 26%)
       and tightened the evidence explanation accordingly.
    4. Gonadal Tumors: changed "ovarian teratoma in females" to "gonadal
       teratoma" to precisely match the GeneReviews wording. Verified against the
       live GeneReviews full text (NBK1151), which states: "Gonadal teratoma and
       testicular fibrosarcoma have also been reported in individuals with
       SUFU-related NBCCS" (the cached abstract-only copy did not contain this
       sentence, so the attribution was confirmed against the primary source).

    Outstanding problems filed as issues (not fixed in place):
    - #6201: Scoliosis is FREQUENT (Orphanet + Lo Muzio 40%), but the NIH cohort
      Kimonis 1997 (PMID:9096761) explicitly found scoliosis NOT significantly
      increased. Genuine literature disagreement -> maintainer judgment call.
    - #6202: Genotype-specific quantitative figures in has_subtypes descriptions
      (SUFU medulloblastoma "up to 33%", meningioma "~11%"; PTCH1 recognizable
      facies "~60%") are unattached to validated evidence; the 33% is quotable
      from GeneReviews (PMID:20301330) and ~11% derivable from PMID:38282294.

    Adjacent finding (commented, not part of this entry): open issue #5862
    ([preprint-scan] "Meier-Gorlin Syndrome ... GINS2") mis-targets
    kb/disorders/Gorlin_Syndrome.yaml. Meier-Gorlin syndrome (replication/GINS
    disorder) is a distinct entity from Gorlin syndrome / NBCCS (PTCH1/SUFU); a
    Named Entity Confusion comment was added to #5862 warning against applying
    that content to this file.

    Minor housekeeping noted, left as-is (tracked repo-wide by design decisions):
    deprecated updated_date (line 3) and free-text percentage fields in the two
    prevalence records remain present; per CLAUDE.md existing entries may retain
    these until a bulk cleanup.

  summary: 'Create: THPO-Related_Thrombocythemia'
  details: |
    New entry for thrombocythemia 1 (MONDO:0008554), named THPO-Related Thrombocythemia after the ClinGen-attributed MONDO EXACT synonym per the entry-naming skill; stub stubs/Thrombocythemia_1.yaml deleted in the same change. Deep research: just research-disorder claude_code (research/THPO-Related_Thrombocythemia-deep-research-claude_code.md; 34/34 references resolved, 1 flagged possibly off topic (PMID:23850243, a myelofibrosis niche paper) which is not cited in the entry; term validation flagged the report's own MONDO label handling and an obsolete GO:0005615, neither used here). just preflight-dr warned only that 'TPO' outnumbers 'THPO' in the report, which is the protein abbreviation for the same gene, not a second disease; the report correctly scopes itself to the dominant gain-of-function disorder and explicitly excludes the recessive THPO disorder that misled the earlier report in issue #15234. Four trailing paragraphs of non-report conversational text were removed from the report body. Pathophysiology built as a chain of 16 atomic nodes from the 5' UTR/splice-donor variant through exon 3 skipping, loss of uORF (ORF7) translational repression, increased translation, increased thrombopoietin production and serum level, MPL engagement, JAK2, STAT5/STAT3, progenitor expansion, marrow megakaryocytic hyperplasia, platelet production, thrombocytosis, impaired microcirculation, plus a platelet-MPL clearance feedback branch and a hypothesis-level hemangioblast/limb branch with INDIRECT_UNKNOWN_INTERMEDIATES edges. Module conformance: Excess Thrombopoietin Engagement of MPL conforms to jak_stat_pathway_activation#Activating Lesion or Sustained Ligand Drive Upstream of JAK (ligand-excess route, cited to PMID:28955303's intrinsic/extrinsic distinction); the JAK2 and STAT nodes deliberately do not conform, since the module requires constitutive or ligand-independent activity which has not been measured in carriers, and no thrombogenesis conformance was added because no platelet-activation or coagulation data exist for this disease. Seven discussions cover thrombosis risk versus sporadic ET, clonality and the two malignancy case reports, why serum thrombopoietin stays high despite platelet mass, management evidence, the distinction from receptor-driven disease, the limb-defect hemangioblast hypothesis, and the absence of any animal model of the translational lesion. GeneReviews: no chapter for the disease or for THPO (just check-genereviews --online), recorded in notes. Validation: just validate passes (schema, terms, 107/107 snippets with titles checked); just count-verified-snippets 107/107; just check-entity-refs OK; just compliance-connectivity reports no unconnected phenotypes and no unlanded gene; just check-conformance-content reports the single link sharing a GO term with its module node; whole-repo CI gate scripts run locally against origin/main. A red-team pass against the dismech-pr-review skill, run in a subagent with the cached full texts, changed several things: the raised serum thrombopoietin claim was softened (the full text of PMID:18367486 reports only slightly raised or normal levels in most affected members, so the VERY_FREQUENT frequency and the "defining signature" and "every pedigree" wording are gone); the claim that exome capture misses these variants was replaced with the interpretation-and-filtering problem the sources actually describe (PMID:27100794 found the variant in its own prior exome data, filtered out as novel and noncoding); the limb-defect count went from two families to three after reading PMID:32067437, a Korean case cached as a letter without an abstract, and its frequency tier was dropped as unestablished; the 5' UTR variant list was reconciled (G185T and G516T are the same c.-31G>T allele per PMID:33712866, and the uORF stopgain is c.-34C>T); splenomegaly (6 of 23 in the series) and transient myeloproliferative syndrome were added as phenotypes, the first without a quoted evidence item because the counts are full-text only; cytokine activity lost its INCREASED modifier, since the protein's activity per molecule is normal; the STAT node was renamed to STAT5 and the two Mpl mouse models were split into separate entries; the platelet-MPL branch gained the incoming edge its source proposes; two evidence_source values and two edge link types were corrected; hydroxyurea's failure in the Polish proband, the event rates per 100 patient-years and the further malignancy reports went into the discussions. Note that the gating validator runs with --no-full-text, so no full-text-only passage can carry a snippet; those findings are recorded in prose with the paper and section named. Final counts: 16 pathophysiology nodes, 23 edges, 10 phenotypes (8 causally connected; splenomegaly and the transient picture have no sourced upstream step), 107/107 verified snippets, 7 discussions. All eight whole-repo CI gate scripts were run locally against origin/main and passed.

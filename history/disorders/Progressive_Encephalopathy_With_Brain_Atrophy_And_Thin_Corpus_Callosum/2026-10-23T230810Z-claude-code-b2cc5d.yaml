  summary: 'Create: Progressive Encephalopathy With Brain Atrophy And Thin Corpus
    Callosum'
  details: |
    De novo curation of the TBCD-related autosomal recessive early-onset neurodegenerative encephalopathy (MONDO:0044646, OMIM:617193, PEBAT) from the stub queue, claim issue #13990. A Falcon deep-research report (research/Progressive_Encephalopathy_With_Brain_Atrophy_And_Thin_Corpus_Callosum-deep-research-falcon.md) was used as a lead source; every reference it suggested was fetched with just fetch-reference and every snippet was taken from the cached abstract or structured record, with the report's CURIEs treated as leads only. Pathophysiology is an eight-node chain: biallelic hypomorphic TBCD variants (PARTIAL_LOSS_OF_FUNCTION) -> reduced TBCD abundance and defective beta-tubulin/ARL2/TBCE binding (GO molecular functions bound) -> impaired alpha/beta-tubulin heterodimer assembly -> accelerated microtubule polymerization and hyperstable microtubules in patient fibroblasts -> disorganized mitotic spindle with impaired cortical progenitor proliferation/migration (mouse in utero knockdown, isogenic iPSC rescue) and defective neuronal microtubule dynamics with neurite degeneration (Drosophila projection neurons) -> neuronal loss, gliosis and progressive brain atrophy, and spinal motor neuron degeneration; the two tissue nodes carry bare-name downstream edges to 16 of the 19 phenotypes (postnatal growth retardation and neutropenia are left unwired because no mechanism is documented). Evidence: Miyake 2016 (PMID:27666374), Flex 2016 (PMID:27666370), Edvardson 2016 (PMID:28158450), Pode-Shakked 2017 (PMID:27807845), Ikeda 2017 (PMID:27928163), the Faroese founder cohort (PMID:29921875), later case series, the tubulin-cofactor biochemistry and cryo-EM literature, and the ClinGen Definitive CGGV assertion recorded as gene_disease_validity. Inheritance bound to HP:0000007; structured prevalence records the Faroese carrier frequency (CARRIER_FREQUENCY) and the published case count; treatments carry NCIT action terms with CHEBI therapeutic agents and therapeutic_modality; three animal models and two human cell models are linked through modeled_mechanisms with divergences; three discussions record the open neuronal-death mechanism, the development-versus-degeneration question, and severity modifiers. No GeneReviews chapter exists (just check-genereviews, Bookshelf snapshot 2026-09-10); the ORPHA:496641 record was not cached because the Orphadata bulk XML is not available in the curation environment. Validated with just validate, just validate-terms, just count-verified-snippets (104/104), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-gene-activity-grounding (against origin/main) and just compliance (86% global).

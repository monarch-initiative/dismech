  details: |
    Addressed the automated review of PR 15417. Removed the unsupported GO:0099111 microtubule-based transport binding from the Defective Neuronal Microtubule Dynamics node (no cited source reports a transport defect). Replaced GO:0051402 neuron apoptotic process with GO:0008219 cell death on the Neuronal Loss, Gliosis and Progressive Brain Atrophy node, with a note that the sources show neuronal loss and cellular death without establishing apoptosis and that cell_types carries the neuron specificity. Dropped the OMIM:617913 identifier attributed to the KIF1A-related encephalopathy from the entry notes, keeping the statement that it is a distinct disease. Removed the PMID:27666370 general cell-biology background sentence that had been graded HUMAN_CLINICAL. Renamed the Muscle weakness and atrophy phenotype to Muscle weakness (HP:0001324) so it no longer duplicates the Skeletal muscle atrophy phenotype, and retargeted its edges. Cohort frequencies and the node split were not added. Validation: validate and validate-terms passed, 103/103 snippets verified, entity refs, causal targets and enum values clean.

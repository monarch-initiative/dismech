  summary: 'Create: Neurodevelopmental Disorder with Dysmorphic Facies and Distal
    Skeletal Anomalies (NEDDFSA, ZMIZ1)'
  details: |
    De novo creation of the NEDDFSA entry (MONDO:0032855, OMIM:618659, ZMIZ1 / hgnc:16493, autosomal dominant), resolving issue #8534.

    NEC preflight (high-risk target). This entity belongs to the large near-identically-named OMIM "neurodevelopmental disorder with ..." series. Ran the CLAUDE.md manual preflight: `uv run runoak -i sqlite:obo:mondo info MONDO:0032855 -O obo` returned three concordant identity anchors (relationship RO:0004003 HGNC:16493 ! ZMIZ1; xref OMIM:618659; RELATED synonym NEDDFSA). Also ran the automated `just preflight-dr` against the deep-research report: PASS, ZMIZ1 mentioned 41 times vs next-highest gene AR at 3, and the report's OMIM number matched the MONDO xref. The principal confusable, NEDDFL (MONDO:0060596, OMIM:617755, BPTF), was verified with OAK as a distinct entity and recorded under differential_diagnoses; no BPTF literature was used anywhere in this entry.

    Dual-genotype confound. PMID:34680978 reports a proband carrying BOTH biallelic OTUD6B lesions and a heterozygous ZMIZ1 c.1491+2T>C splice variant. Per the caveat already recorded in the dismech OTUD6B entry, NO phenotype from that proband is curated here. PMID:34680978 appears exactly FIVE times in the entry, re-derived line by line and enumerated in the entry notes: genetic[0].evidence[4] (exon-14 skipping, PARTIAL), genetic[0].evidence[5] (paternal inheritance of the allele, PARTIAL), differential_diagnoses[1].evidence[0] (phenotypic overlap, SUPPORT), differential_diagnoses[1].evidence[1] (inheritance-mode discriminator, SUPPORT), and one bibliography entry in the top-level references list that carries no snippet. All four evidence citations restate the dual-genotype confound in their explanation and none attributes a phenotype to ZMIZ1. An earlier draft of both this record and the entry notes said "three", written before the paternal-inheritance item was added; a PR reviewer said "four", counting only evidence citations. Five is the count of occurrences of the PMID in the file. The t(10;19) ZMIZ1-PRR12 translocation cases were likewise excluded from phenotype curation because they disrupt two independent disease genes.

    Deep research: Edison/falcon (research/Neurodevelopmental_Disorder_with_Dysmorphic_Facies_and_Distal_Skeletal_Anomalies-deep-research-falcon.md, 1 artifact). Treated as leads only. Its two distinctive contributions that survived verification were the loss-of-function constraint metric (oe 0.13) and the Hirschsprung-disease spectrum-expansion candidate; both were re-verified as exact substrings of the cached PMID:38686122 text before use. The Hirschsprung item is marked supports PARTIAL because the primary source (Valind 2021, J Pediatr Surg Case Rep 71:101889) is not PubMed-indexed and reaches this entry only as a secondary citation.

    GeneReviews: none exists. PubMed searches for "ZMIZ1 GeneReviews" and for the full disease name plus GeneReviews both returned zero results on 2026-08-15, so no GeneReviews phenotype baseline was available; the phenotype set was built from the primary case literature plus the two published cohort/meta-analyses (PMID:39658964, PMID:40529245).

    Content: a seven-node pathophysiology chain (heterozygous ZMIZ1 variant -> impaired PIAS-family coactivator function -> dysregulated developmental transcriptional programs -> parallel cortical and craniofacial/skeletal arms -> global neurodevelopmental impairment and syndromic multisystem malformation), each node tagged with biological_scale. 35 HPO-bound phenotypes, 5 variants, 2 animal models, 3 differential diagnoses, 2 treatments, and 3 discussions (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH for the unmodeled skeletal arm). The skeletal-patterning node is deliberately marked mechanism_confidence PROVISIONAL because the only in vivo model is forebrain-restricted and by construction cannot develop that phenotype.

    Evidence discipline: several references are cached as full text, and linkml-reference-validator checks snippets against the cached body, so evidence items quote Results-section sentences as well as abstract text; every such snippet was confirmed against the cached file. An earlier draft wrongly assumed only abstracts were quotable and dropped two findings on that basis; both were restored (the VZ/SVZ-to-cortical-plate laminar distribution of the positioning defect, and bilateral hip dysplasia in the reported Chinese proband, now a curated phenotype). The supportive-care treatment carries no evidence items by design, because no management guideline exists for this disorder; that gap is recorded as the neddfsa_no_management_guideline discussion rather than papered over with a fabricated citation.

    Pre-PR red-team review: a self-review pass against the dismech-pr-review skill found and fixed two blocking issues. (1) PMID:41633496 explicitly states that BrdU birthdating showed migration was NOT disrupted in the forebrain-specific knockout, contradicting the neuron-migration annotation this entry had taken from the in utero electroporation overexpression paradigm; the contradiction is now curated as a supports: REFUTE evidence item on the cortical node, with node notes and description recording that the positioning phenotype is overexpression-specific in mouse while the human cortical heterotopias independently support it. (2) The abstract-only assumption described above. The same pass rebanded frequencies against quantitative sources (facial dysmorphism VERY_FREQUENT -> FREQUENT; autism OCCASIONAL -> FREQUENT at 60-66%; microcephaly and hypotonia given 64% and 57% quantitative snippets; gray matter heterotopia given the 57% MRI figure), dropped seven frequency bands that rested on bare feature-list prose with no frequency signal, added four phenotypes with already-cached quantitative support (abnormal corpus callosum morphology 21%, sleep disturbance 14%, joint contracture, hip dysplasia), added a terminal ORGANISM-scale node so the syndromic arm no longer dead-ends, corrected three evidence_source values, downgraded a misapplied REFUTE to PARTIAL, and recorded that the c.1491+2T>C splice allele was paternally inherited and was excluded from the 2025 domain-resolved re-analysis.

    Validation: `just validate` passes end to end - schema OK, term validation OK, references 115/115 snippets verified against the cached references. `just validate-graphs` reports no errors attributable to this entry. Note for future curators: MAXO treatment terms were rejected by the TreatmentActionTerm dynamic enum (rooted at NCIT:C25218) despite the MAXO examples in CLAUDE.md, so NCIT:C15747 (Supportive Care) and NCIT:C15240 (Genetic Counseling) were used instead. This matches the rest of the KB, which currently contains no MAXO treatment terms at all.

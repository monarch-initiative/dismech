  summary: 'Upgraded Ochoa Syndrome (Urofacial Syndrome) curation for issue #3579: added classifications,
    prevalence, progression, diagnosis, and differential_diagnoses sections; annotated GO molecular functions
    on Biallelic HPSE2 or LRIG2 dysfunction; and tagged GeneReviews reference PMID:23967498 with structured
    findings.'
  details: Added classifications (kidney/urinary tract and Mendelian disease), ULTRA_RARE prevalence backed
    by ORPHA:2704 and PMID:23967498, and two-phase progression covering prenatal/infantile onset and progressive
    obstructive uropathy. Bound GO:0004857 (enzyme inhibitor activity) and GO:0005102 (signaling receptor
    binding) to Biallelic HPSE2 or LRIG2 dysfunction. Added diagnosis entries for clinical evaluation,
    HPSE2/LRIG2 molecular genetic testing (NCIT:C19770), and renal/bladder ultrasonography (NCIT:C159885),
    plus differential diagnoses (Prune belly syndrome MONDO:0007032, Vesicoureteral reflux MONDO:0008653,
    and Hinman-Allen syndrome) and GeneReviews reference findings.

  summary: 'Review and deepen Ochoa Syndrome (Urofacial Syndrome, PR #14701, issue #3579): added classifications,
    prevalence, progression, diagnosis, and differential_diagnoses; split HPSE2 and LRIG2 into separate
    pathophysiology trigger nodes; and tagged GeneReviews reference PMID:23967498.'
  details: Added classifications (KIDNEY_URINARY_TRACT and GENETICS_ENVIRONMENT_DISEASE), POINT_PREVALENCE
    (NOT_YET_DOCUMENTED) prevalence backed by ORPHA:2704, and two-phase progression covering prenatal/childhood
    onset and progressive obstructive uropathy and renal injury. Split Biallelic HPSE2 or LRIG2 dysfunction
    into Biallelic HPSE2 loss (hgnc:18374, GO:0004857 enzyme inhibitor activity DECREASED, GO:0007422 peripheral
    nervous system development ABNORMAL) and Biallelic LRIG2 loss (hgnc:20889, GO:0007422 peripheral nervous
    system development ABNORMAL) converging on Aberrant urinary bladder autonomic innervation and Abnormal
    facial movement with expression. Added diagnosis entries for clinical evaluation, HPSE2 and LRIG2 molecular
    genetic testing, and renal and bladder ultrasonography, plus differential diagnoses (Primary vesicoureteral
    reflux and Hinman-Allen syndrome) and GeneReviews reference findings.

  summary: 'Upgraded Ochoa Syndrome (Urofacial Syndrome) curation for issue #3579 (PR #14701): added classifications,
    prevalence, progression, diagnosis, and differential_diagnoses sections; split Biallelic HPSE2 or LRIG2
    dysfunction into separate gene-specific HPSE2 and LRIG2 pathophysiology nodes; and tagged GeneReviews
    reference PMID:23967498 with structured findings.'
  details: Added classifications (kidney/urinary tract and Mendelian disease, plus mechanistic_category
    neuropathy and developmental disorder), ULTRA_RARE prevalence backed by ORPHA:2704 and PMID:23967498,
    and two-phase progression covering prenatal/infantile onset and progressive obstructive uropathy. Split
    Biallelic HPSE2 or LRIG2 dysfunction into Biallelic HPSE2 dysfunction (hgnc:18374, GO:0004857 enzyme
    inhibitor activity, GO:0045596 negative regulation of cell differentiation) and Biallelic LRIG2 dysfunction
    (hgnc:20889, GO:0005102 signaling receptor binding, GO:0050919 negative chemotaxis) converging on Impaired
    autonomic innervation of the bladder and facial musculature. Added diagnosis entries for clinical evaluation
    (NCIT:C124351), HPSE2/LRIG2 molecular genetic testing (NCIT:C19770), renal/bladder ultrasonography (NCIT:C159885),
    voiding cystourethrography (NCIT:C38101), and urodynamic study (NCIT:C139179), plus differential diagnoses
    (Prune belly syndrome MONDO:0007032, Vesicoureteral reflux MONDO:0008653, Hinman-Allen syndrome, Moebius
    syndrome MONDO:0007997, and asymmetric crying facies MONDO:0007786) and GeneReviews reference findings.

  summary: 'Address PR review: correct the CMV intermediate mechanism, re-anchor the
    model link, add hallmark phenotypes, named treatments and variant detail'
  details: |
    Addressed the automated review on PR #10227 (review 5068507865, 1 CRITICAL and
    7 IMPORTANT). Every finding was accepted; all were fixable from reference cache
    files this PR already commits.

    Root cause of the whole review, and the honest lesson: the entry was curated
    from the five ABSTRACTS when four of the five cached files contain FULL TEXT.
    `just fetch-reference` had already retrieved the full text and I did not read
    it. Every finding below is a fact that was sitting in this PR's own
    references_cache directory.

    CRITICAL 1 - wrong intermediate mechanism. The edge to "Impaired Control of
    Cytomegalovirus" asserted "reduced NK-cell cytotoxic effector function" as the
    intermediate. PMID:31068380 states the opposite: patient NK cells "were capable
    of degranulation and target cell killing, which was enhanced by IL-2 or IL-15
    priming", and shows "a selective resistance to IFN-γ production through IL-2 or
    IL-15 stimulation, while responding normally to IL-12 and IL-18". The same
    source names the real intermediate: "defects in NK cell differentiation toward
    adaptive NK cells". The intermediates were replaced with those two, the IFN-γ
    sentence added as evidence, and the cytotoxicity sentence added as a REFUTE item
    so the wrong reading is explicitly closed off rather than silently dropped.

    IMPORTANT 2 - the FAILS_TO_RECAPITULATE link was attached to the wrong mouse. It
    hung on the hypomorphic knock-in but described the conventional knockout, and
    its evidence was a HUMAN_CLINICAL-graded human paper supporting a claim about
    mouse NK cells. Replaced with the knock-in's own divergence, quoted from
    PMID:40570369 ("Unlike the increase in immature CD56bright NK cells observed in
    humans, we observed decreased mature stage E (CD11b+CD27+) NK cells and an
    excess of mature/potent cytotoxic (CD11b+CD27−) cells"), graded MODEL_ORGANISM,
    with a readout attached.

    IMPORTANT 3 - the NK discussion overstated the uncertainty. The human picture is
    consistent across alleles (numbers preserved or raised, CD56-bright elevated,
    CD57 negligible, cytotoxicity intact), so there is no inter-cohort disagreement
    to record. The KNOWLEDGE_GAP was rewritten as the threshold-requirement question
    the model paper states in its own words, and the HUMAN_MODEL_MISMATCH was
    repointed at the knock-in's inverted maturation phenotype.

    IMPORTANT 4 - the Treg "anticipated" hedge was wrong. Both papers measure it
    directly: "the proportion of CD4+CD25+FOXP3+ T regs was decreased in the
    patient" (PMID:31040184) and "the frequency of CD4+CD25+FoxP3+ regulatory T
    cells were clearly diminished in the two IL2RB-deficient patients examined"
    (PMID:31068380). Both added as HUMAN_CLINICAL; the hedge removed. Note the
    abstract's own wording ("an anticipated reduction") understates the paper's
    results section, which is what led me wrong.

    IMPORTANT 5 - four hallmark phenotypes added: autoimmune hemolytic anemia
    (HP:0001890), hepatosplenomegaly (HP:0001433), failure to thrive (HP:0001508),
    interstitial pneumonitis (HP:0006515).

    IMPORTANT 6 - the perinatally lethal end of the spectrum added: a "Perinatal
    lethal presentation" progression phase and a Respiratory failure phenotype
    (HP:0002878), both citing the p.Gln96* kindred of two fetuses and a neonate.

    IMPORTANT 7 - treatments rebuilt. The single vague INDIRECT-graded supportive
    entry was replaced by three named regimens with therapeutic_agent bindings and
    DIRECT evidence: methylprednisolone induction (NCIT:C647), sirolimus maintenance
    (CHEBI:9168), and ganciclovir/valganciclovir CMV suppression (CHEBI:465284 /
    CHEBI:63635). The HSCT entry was strengthened from "one patient" to two
    successfully transplanted patients plus five-year durable control despite waning
    donor chimerism.

    IMPORTANT 8 - variant-level detail added. Four alleles with their distinct
    mechanisms: p.Leu77Pro (misfolding/intracellular sequestration), p.Ser40Leu
    (reaches the surface, cannot signal), p.Pro222_Gln225del (WSXWS motif
    disruption), p.Gln96* (truncating, perinatally lethal). This is what the index
    paper means by "cause disease by distinct mechanisms".

    SUGGESTION 9 - GO:0035723 (interleukin-15-mediated signaling pathway) added
    alongside GO:0038110, so the dual-cytokine node's bindings match its name.

    SUGGESTION 10 not done: DiseaseMappings has only icd10cm/icd11f/mondo/ncit
    sub-slots, with no omim_mappings or orphanet_mappings, so OMIM:618495 and
    ORPHA:444463 cannot be expressed. Schema validation rejects the attempt.

    Snippets went from 40/40 to 63/63 verified. `just validate` passes schema, term
    and reference checks; check-entity-refs, check-duplicate-keys,
    check-folded-hyphens, check-snippet-length, check-title-snippets and
    check-snippet-grading all pass.

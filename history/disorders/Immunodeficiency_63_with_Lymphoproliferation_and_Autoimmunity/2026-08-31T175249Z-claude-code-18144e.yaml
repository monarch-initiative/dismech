  details: |
    Round-4 review fix (PR #10227).

    BLOCKING (reviewer, correct): the p.Pro222_Gln225del evidence item was graded IN_VITRO with an explanation asserting the surface-expression reduction was "measured in a reconstitution system rather than observed in patients". references_cache/PMID_31068380.md line 40 states the opposite in the clause immediately preceding the fragment I quoted: "As assessed by flow cytometry on patient lymphocytes, the IL2RB p.Pro222_Gln225del mutation drastically reduced IL-2Rbeta surface expression." I verified this against the cache before acting rather than taking the review on trust. The HEK-293T reconstitution work in that paragraph belongs to p.Leu77Pro and p.Ser40Leu, which the entry already grades correctly.

    Fix: regraded the item HUMAN_CLINICAL and extended the snippet to include the "As assessed by flow cytometry on patient lymphocytes" clause, so the evidence item now carries its own method rather than depending on an explanation to assert one. Rewrote both explanations in the block accordingly. This also removes an internal inconsistency: patient flow cytometry was graded HUMAN_CLINICAL for the Treg immunophenotyping item and IN_VITRO here.

    Root cause, recorded because it recurs: the previous review suggested splitting this item on the assumption that "the WSXWS-motif consequence is the in-vitro part". I implemented the suggested split without re-reading the full source paragraph, so a reviewer suggestion propagated into a factual claim the source denies. A review suggestion is a lead, not a source; the cache is the source.

    SUGGESTION taken: moved the OCCASIONAL banding rationale for Hepatosplenomegaly and Failure to thrive out of description (which renders as a claim about the disease) into notes (curation reasoning).

    SUGGESTION declined with reason: category Gastrointestinal on Hepatosplenomegaly. Surveyed all 19 hepatosplenomegaly phenotypes in kb/disorders and found 14 distinct category strings and no KB-wide convention; the two nearest neighbours by disease class - Immunodeficiency_69 and Autoinflammation_Immune_Dysregulation_and_Eosinophilia, both primary immunodeficiencies - both use Gastrointestinal. Leaving it matches the closest precedent that exists.

    Validation: just validate clean (schema, terms, references) at 64/64 snippets verified; check-entity-refs, check-duplicate-keys, check-snippet-grading all OK.

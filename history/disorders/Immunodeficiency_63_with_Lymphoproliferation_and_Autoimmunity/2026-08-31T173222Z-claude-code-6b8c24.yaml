  summary: Clear four non-blocking notes from the approving review
  details: |
    The approving review on PR #10227 (review 5069004292) listed six non-blocking
    suggestions. Four were correctness issues rather than style, so they were fixed
    even though the push resets the approval.

    1. Frequency bands. Hepatosplenomegaly, Failure to thrive and Interstitial lung
       disease were banded FREQUENT, but the supporting sentence describes the two
       Fernandez siblings out of roughly ten patients reported worldwide, which is
       not a cohort proportion. All three lowered to OCCASIONAL with the reason
       recorded in the description.

    2. p.Pro222_Gln225del evidence grading. The item was graded IN_VITRO while its
       quote describes an allele identified in patients. Split into two items: the
       allele identification graded HUMAN_CLINICAL, and the surface-expression
       consequence, measured in a reconstitution system, graded IN_VITRO with its
       own quote.

    3. Overstated independence. PMID:31068380 is a JEM Comment summarising both
       index papers, not a separate study, so calling it "a second, independent
       human measurement" was wrong: it draws on the same patients. Corrected, and
       the other three explanations citing that source now say the same thing
       explicitly. This one is worth recording as a general lesson: a citation from
       a distinct PMID is not automatically independent evidence, and nothing in the
       validation stack knows the difference between a primary report and a
       commentary on it.

    4. Ganciclovir snippet punctuation. The snippet ended "362,908 copies/ml." where
       the source reads "362,908 copies/ml, respectively." The normalizer accepted
       it, but the quote is now exact.

    Not done. The mappings block for OMIM:618495 and ORPHA:444463 remains
    inexpressible: DiseaseMappings carries only icd10cm/icd11f/mondo/ncit sub-slots.
    The hepatosplenomegaly category was left as Gastrointestinal; the reviewer called
    it defensible and no alternative is clearly better.

    Validation: 64/64 snippets verified, up from 63/63. All offline gates pass.

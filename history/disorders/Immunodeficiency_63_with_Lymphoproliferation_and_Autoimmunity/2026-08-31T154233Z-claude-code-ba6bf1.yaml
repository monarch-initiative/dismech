  summary: 'Create: Immunodeficiency 63 with Lymphoproliferation and Autoimmunity'
  details: |
    Created kb/disorders/Immunodeficiency_63_with_Lymphoproliferation_and_Autoimmunity.yaml
    (MONDO:0032782, IL2RB / CD122).

    Deep research: Perplexity (sonar-deep-research) ->
    research/Immunodeficiency_63_with_Lymphoproliferation_and_Autoimmunity-deep-research-perplexity.md.
    The report's own inline validation set `term_validation.needs_review: true`, and it
    earned it: 13 of 59 checked labels name a different term. Among them the report
    offered NCIT:C15206 as "Hematopoietic Stem Cell Transplantation" (NCIT calls it
    "Clinical Study"), HP:0002239 as "Cytomegalovirus infection" (HPO: "Gastrointestinal
    hemorrhage"), HP:0008354 as "Hypergammaglobulinemia" (HPO: "Factor X activation
    deficiency"), and UBERON:0002150 as "lymphoid tissue" (UBERON: "superior cerebellar
    peduncle"). HP:0030315 does not exist; HP:0005407 and GO:0035724 are obsolete. None
    of these was bound here - every ontology term in this entry was resolved
    independently against the committed caches or the OLS API.

    The reference side was weaker than it looks. `reference_validation` reports 6/6
    resolved, confabulation_rate 0.0, on_topic 4 - but the rendered "## Reference
    Validation" section prints "On topic 4 / Off topic 0" and then "All extracted
    references resolved successfully", so the 2 references that were neither on nor off
    topic are invisible in the section a curator actually reads. The block also carries
    no `needs_review` key and no per-reference list, so there is no way to tell which
    4 of 6 were judged on topic. Inspecting the citation list by hand found the reason
    to care: it includes two papers about TNFRSF9/CD137 deficiency (a different
    receptor and a different disease) and one about IL-2Rbeta in flounder
    (Paralichthys olivaceus). `just preflight-dr ... MONDO:0032782` still PASSes,
    because it scores the body's gene vocabulary (IL2RB mentioned 159 times) and does
    not look at the citation list at all. Citation #17 is the bare string "ACMG/AMP
    guidelines" rather than an identifier.

    Evidence was therefore taken from independently verified PubMed records:
    PMID:31040185 (Zhang 2019 JEM, 8 patients / 4 consanguineous families),
    PMID:31040184 (Fernandez 2019 JEM, the WSXWS siblings), PMID:40570369 (hypomorphic
    Il2rb knock-in mouse with the wild-type Treg transfer rescue), PMID:31068380 (JEM
    commentary on both index papers), PMID:34447369 (ALPS-like PIRD systematic review).

    No GeneReviews chapter exists for IMD63.

    Two deliberate epistemic choices are recorded in the entry rather than smoothed
    over. The human Treg reduction in PMID:31040184 is described by its own authors as
    "anticipated" - inferred from the signalling defect, not measured - so the entry
    says so in the explanation and lets the mouse paper carry the measurement. And the
    two index cohorts do not agree about the NK compartment (partial retained
    expression and function versus expanded CD56-bright with absent terminal
    differentiation); that disagreement is filed as an open KNOWLEDGE_GAP rather than
    resolved by picking one. A separate HUMAN_MODEL_MISMATCH records that the
    conventional Il2rb knockout mouse has no NK cells at all while patients do.

    Validation: `just validate` passes schema, term and reference checks with 40/40
    snippets verified. check-entity-refs, check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets and check-snippet-grading all pass.

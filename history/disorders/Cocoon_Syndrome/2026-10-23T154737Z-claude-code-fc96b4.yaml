  summary: 'Create: Cocoon_Syndrome'
  details: |
    New entry for cocoon syndrome / fetal encasement syndrome (MONDO:0013334), claimed in issue 15342. Deep research: one Perplexity report (research/Cocoon_Syndrome-deep-research-perplexity.md; 14/14 references resolved, one flagged off topic; preflight-dr PASS, CHUK mentioned 46 times). The first concurrent run was dropped by the API after about five minutes and was re-run on its own. As with the other reports in this batch, the body's inline citation numbers do not map to the citation list, so claims were re-anchored to PubMed abstracts and the Orphanet record ORPHA:465824. The report's CL:0000134 is mesenchymal stem cell, not mesenchymal cell, and was not used.

    The NEJM gene-discovery report (PMID:20961246) is abstract-only in the cache, so the specific variant, the fetal histology and the family details the report gives are not stated. Phenotypes come from the NEJM abstract and the Orphanet definition; mechanism from the IKK-alpha knockout mice and the epidermis-specific rescue (PMID:10195895, 10195896, 15071597). Kept as a Disease separate from Bartsocas-Papas syndrome 2 because MONDO keeps separate classes; the CHUK allelic spectrum is recorded in differentials. No ClinGen tier recorded: the only CHUK ClinGen record is Moderate for Bartsocas-Papas syndrome 2.

    An internal red-team review before the PR found a wrong file path for the ClinGen record, unsupported specifics (Finnish, one family), a node whose evidence contradicted it, negative-existence claims without recorded searches, a better HPO term for transparent skin (HP:0010648) and a mis-targeted rescue link; all were corrected. Validation: validate-disorders (46/46 snippets), validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading, check-coarse-phenotypes and check-genereviews (NO_CHAPTER) pass.

    PR 15349 review round 1: added reference_title to every ORPHA:465824 evidence item, and cited the NEJM CHUK-epidermis sentence (INDIRECT) on the CHUK to keratinocyte-differentiation edge. The CI gate "Check for newly ungrounded genes" flags CHUK because its landing node has no molecular function; the epidermal role of IKK-alpha is kinase-independent (PMID:15071597), so no honest molecular-function term exists, and the sanctioned baseline exemption is pending maintainer approval.

    PR 15349 review round 2: resolved the gene-activity grounding gate by binding GO:0008384 IkappaB kinase activity (DECREASED) on the CHUK lesion node, which is true because the protein is absent; the node description states that the downstream epidermal effect is kinase-independent, so the term records what is lost rather than the causal route. The baseline-exemption alternative was not used.

  summary: 'Create: Immunodeficiency 118 (MCTS1)'
  details: |
    De novo curation of IMD118 (MCTS1, MONDO:0958030) from the 2023 Cell report that defined the entity and a 2026 four-family follow-up. Deep research: one openscientist run (16 references, 16/16 resolved, 5/16 judged on topic, term_validation needs_review true). The report is the strongest of the five in this batch on mechanism and supplied the JAK2 start-stop uORF account, the IL-23 limb placement and the seventeen-gene reporter screen. Its gene CURIE for MCTS1, HGNC:7838, is NKX3-1; the correct identifier hgnc:23357 was substituted and the error recorded, the second such error in this batch after LARS2 in the HLASA run. Its JAK2 identifier was correct. The substantive divergence from the report is prognostic: the report follows the 2023 framing of isolated mycobacterial disease with otherwise normal immunity and generally favourable outcome, and the 2026 series adds a death from CNS BCG disease, growth failure below the third percentile in three of four, hypogammaglobulinaemia prompting replacement in three of four, and chronic gastrointestinal mycobacterial disease. Both readings are recorded, with the founding redundancy claim quoted with its own hedge intact and the tension carried as a CONTROVERSY discussion rather than resolved. Two REFUTE and one NO_EVIDENCE evidence item keep counter-evidence and a non-indication in place. Two curator errors caught by term validation: NCIT:C1428 written from memory for recombinant interferon gamma is Stavudine, now NCIT:C100089; CHEBI:6030's canonical label is isoniazide not isoniazid. Validation on the final tree: just validate, validate-terms, validate-disorders, count-verified-snippets 37/37, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-coarse-phenotypes, check-reference-titles, check-case-collisions, check-genereviews (NO_CHAPTER), list-disconnected-phenotypes 7/9.


    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED, two IMPORTANT findings, both taken, plus one
    of two suggestions). First: the whole mechanism chain was graded HUMAN_CLINICAL on the reasoning
    that the experiments used patient and patient-derived cells, which is the inference CLAUDE.md's
    definition rules out - IN_VITRO covers cultured cells whether human or not. The work behind those
    items is MCTS1-knockout HeLa transfection and reporter assays, 40S/80S footprinting, CRISPR
    knockout in THP-1, HEK-Blue IL-23 reporter lines, gamma-2A fibrosarcoma transfection, and
    SV40-immortalised patient fibroblasts; the founding paper itself describes the impaired BCG
    response of patient leukocytes as measured in vitro. Seven items regraded to IN_VITRO and one
    general-immunology statement to OTHER; phenotype and treatment items left HUMAN_CLINICAL. Second:
    Normal Circulating Leukocyte Subsets was bound to HP:0002721 Immunodeficiency, a binding that
    inverts the claim the node exists to make. The original notes flagged it as a binding of
    convenience, which does not help, since the disclaimer is prose and the term is machine-readable.
    The term is dropped, preferred_term carries the finding, and the phenotype's notes record the
    searches - l~leukocyte, l~lymphocyte count, l~immunophenotyp, l~normal against ols:hp - which
    were re-run before the note was written, per the CLAUDE.md rule that naming a query does not make
    the note true. HPO has terms for abnormality and none for a documented normal result in this
    domain; HP:0002372 Normal interictal EEG is cited in the note as the shape a suitable term would
    take. Also added a notes: paragraph on why IFN-gamma-1b is PROTEIN_REPLACEMENT rather than
    immunomodulation. Declined the suggestion to promote hepatomegaly, splenomegaly, osteomyelitis,
    fever and abscess from prose to phenotype nodes: the 2023 abstract lists them without
    per-patient attribution and the 2026 full text attributes its own, so promoting them would mean
    denominators this entry cannot source. One gate catch worth recording: regrading the JAK2
    sentence on the pathophysiology node left the same sentence graded HUMAN_CLINICAL on the JAK2
    gene record, and check-snippet-grading failed - which is precisely the divergence that gate
    exists for. Both now IN_VITRO. Post-round validation: count-verified-snippets 37/37, all gates
    green.
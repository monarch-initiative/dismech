  summary: 'Create: Mitochondrial Complex I Deficiency Nuclear Type 19'
  details: |
    Created MC1DN19 (FOXRED1) from the primary literature plus an OpenScientist deep-research report (24/24 references verified, one obsolete GO term, one MONDO table-parsing mislabel; no wrong CURIEs). Six-node causal chain from FOXRED1 chaperone loss through arrest and breakdown of the late complex I assembly intermediate to lactate accumulation and grey-matter degeneration. Two REFUTE evidence items quote a published letter to the editor: one against attributing pulmonary hypertension to the mitochondrial defect rather than to coexisting intracardiac shunts, one against the use of dichloroacetate; both are marked quote_role REVIEW_SYNTHESIS. A KNOWLEDGE_GAP discussion records the unresolved pulmonary hypertension attribution. No FOXRED1-specific GeneReviews chapter exists; the nuclear Leigh syndrome spectrum overview (PMID:26425749) caches as chapter purpose boilerplate with no clinical characteristics, so it was not used as a phenotype baseline and is not cited. Validated with just validate (44/44 snippets), just validate-terms, just check-entity-refs and just check-causal-targets. During curation I initially truncated three snippets on the assumption that Unicode tilde operators break the reference validator; I tested that against the cache, found it false, and restored the full sentences.

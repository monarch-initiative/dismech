  summary: 'Gene-family review: FOXRED1'
  details: |
    FOXRED1's lesion node bound GO:0016491 oxidoreductase activity on the strength of its FAD-dependent oxidoreductase-like domain, but no substrate, reaction, redox activity or FAD binding has been shown for FOXRED1, and its functional characterisation shows instead that it is needed for the late complex I assembly intermediate to mature and co-immunoprecipitates with complex I subunits (PMID:25678554). The molecular function is now protein-containing complex binding (binding to complex I subunits during assembly), decreased, with that co-immunoprecipitation sentence as evidence; the oxidoreductase term was removed. The node description, the entry description and the explanation of the PMID:33613441 evidence item were reworded so that none asserts an oxidoreductase activity: FOXRED1 is described as a complex I-specific assembly factor with an oxidoreductase-like fold of unknown activity. The genetic record (causative, germline) was checked and left unchanged. A 2026 report of two compound heterozygous patients with complex I disassembly (PMID:41412221) is consistent with the entry.

  summary: Rebind FOXRED1 node to complex I assembly; add gene and germline origin
  details: |
    Alignment with the ai-gene-review FOXRED1 review. The FOXRED1 trigger node was bound to GO:0044183 protein folding chaperone, which no study shows (the papers call FOXRED1 a chaperone because it is required for assembly). Rebound it to GO:0032981 mitochondrial respiratory chain complex I assembly (DECREASED), the process FOXRED1 is required for and the term its conforms_to module node carries, added the FOXRED1 hgnc:26927 gene descriptor, a node note explaining the choice, and variant_origin GERMLINE on the genetic record. ClinGen classifies FOXRED1 only for Leigh syndrome and mitochondrial disease (different MONDO terms), so no gene_disease_validity was copied. Validated with just validate, count-verified-snippets (48/48) and validate-terms.

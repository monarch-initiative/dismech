  summary: 'Create: Isolated_Focal_Non-epidermolytic_Palmoplantar_Keratoderma'
  details: |
    New entry for MONDO:0014622 (FNEPPK2, OMIM 616400), TRPV3 gain-of-function. Deep research: Perplexity report research/Isolated_Focal_Non-epidermolytic_Palmoplantar_Keratoderma-deep-research-perplexity.md; just preflight-dr returned PASS (TRPV3 mentioned 63 times). The report's term validation flagged UBERON:0001514 and UBERON:0001516 as aorta terms, not palmar/plantar skin; neither was used, and the tissue node binds UBERON:0013776 instead. Its one off-topic reference (DOI:10.1111/ddg.150_12930, the German version of a PPK review) was not used.

    The two disease-specific papers, He et al. 2015 (PMID:25285920) and Peters et al. 2020 (PMID:32314439), are letters with no abstract; each was fetched twice (second time with --force) and stayed content_type unavailable. They are listed under references but not cited. Evidence about the defining p.Gln580Pro family therefore comes from the Duchatelet and Hovnanian Olmsted review (PMID:25886873), a 2024 Olmsted review (PMID:39748945) and the case table and HaCaT assays of Ni et al. 2016 (PMID:26902751). Orphanet ORPHA:448264 supplies the definition, histopathology, prevalence class and gene rows; the Orphanet concept also lists KRT16, which MONDO splits off as MONDO:0013073 (FNEPPK1), recorded here as a differential. An additional isolated focal plantar TRPV3 p.Gly568Asp case (PMID:42725047), labelled Olmsted spectrum by its authors, supports plantar distribution, activity-related pain and non-response to keratolytics, tretinoin and acitretin (REFUTE evidence on the treatment).

    Pathophysiology chain: TRPV3 gain-of-function channel activation -> keratinocyte calcium overload -> proliferation-differentiation imbalance, EGFR pathway activation and keratinocyte apoptosis -> palmoplantar epidermal hyperkeratosis -> clinical and histological phenotypes; impaired cell adhesion -> suprabasal disadhesion; a hypothesised nociceptive branch -> plantar pain. All 8 phenotypes are causally connected.

    Validation: just validate, just validate-terms, just count-verified-snippets (37/37), just validate-disorders (pass), and the offline gates (duplicate keys, entity refs, causal targets, qualifier terms, coarse phenotypes, snippet length, title snippets, snippet grading, folded hyphens, block scalar comments, enum values) all pass. No GeneReviews chapter (check-genereviews NO_CHAPTER with synonyms present). No ClinGen validity record for TRPV3 in cache/clingen.

  details: |
    Added DERMATOLOGY and GENETICS_ENVIRONMENT_DISEASE Harrison's Part classifications with Orphanet evidence (omitting channelopathy_category so non-excitable keratinocyte TRPV3 disease is not misgrouped into Channelopathies), grounded TRPV3 Gain-of-Function Channel Activation to keratinocyte (CL:0000312) and skin epidermis (UBERON:0001003) with epidermal expression evidence (PMID:42725047), added clinical/histopathologic/genetic diagnosis entries, and wired Topical Keratolytics and Retinoids to Palmoplantar Epidermal Hyperkeratosis.

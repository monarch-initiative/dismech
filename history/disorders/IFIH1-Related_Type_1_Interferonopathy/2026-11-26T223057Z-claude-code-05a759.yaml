  summary: 'Treatment-centred enrichment: IFIH1-Related Type 1 Interferonopathy'
  details: |
    Treatment-centred review and enrichment. Pathophysiology rebuilt as the drug-target chain: variant, loss of tolerance to endogenous Alu duplex RNA, MDA5-MAVS signalling, type I interferon overproduction, receptor engagement, JAK1-STAT1 signalling, then tissue-level nodes for microglial activation, suppressed bone turnover, regulatory T cell dysfunction and interleukin-6 overproduction (3 nodes to 11). Treatments: the three existing JAK inhibitor records were re-read against their sources and retargeted from the generic tissue node to the JAK-STAT node they act on, with their own target_mechanisms evidence, doses, target_phenotypes and negative results; added tocilizumab, glucocorticoid-based immunosuppression, orthopedic soft tissue release and dental prosthetic rehabilitation (4 to 8). Added 11 phenotypes (interstitial lung disease, colitis, pancytopenia, IgA deficiency, skin ulcer, dystonia, seizure, growth delay, raised ESR, short dental root, muscle weakness), three biomarkers (serum interferon-alpha, interleukin-6, CSF neopterin) with readouts and the pharmacodynamic limits of the interferon signature, three registry trials plus a natural history study, four animal models with typed divergences, and two knowledge-gap discussions (CNS penetration of JAK inhibitors; the absence of any upstream-acting therapy, with IFIH1 excluded from the trials that target upstream steps). Literature came from a targeted PubMed and ClinicalTrials.gov sweep; the requested OpenScientist run was still in progress when this was committed and contributed nothing. Validated with just validate-disorders (157 snippets, 0 issues), just validate-terms, and the offline gates: causal targets, entity refs, duplicate keys, enum values, logical rules, coarse phenotypes, qualifier terms, delivery system, block scalar comments, name collisions, gene namespaces (online, to cache the MGI and ZFIN rows), snippet length/title/grading, reference titles, retired support prose, shared disease terms, GeneReviews baseline, cache order.

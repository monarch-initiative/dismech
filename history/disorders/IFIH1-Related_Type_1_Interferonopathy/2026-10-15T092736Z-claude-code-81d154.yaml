  summary: 'Create: IFIH1-Related Type 1 Interferonopathy'
  details: |
    New entry for IFIH1-related type 1 interferonopathy (MONDO:0700262), curated as a gene-level disease with AGS7 and SMS1 as subtypes. Source report: research/IFIH1-Related_Type_1_Interferonopathy-deep-research-perplexity.md, generated with Perplexity sonar-deep-research at reasoning_effort=low, because two runs at the default effort were disconnected at about 300 seconds. Reference validation resolved 25/25 references and 1/1 quotes, with one off-topic DOI not cited. preflight-dr returned WARN because its heuristic lexicon counted the disease abbreviation AGS as a gene. Three of the report's HPO suggestions named other findings (HP:0001171 Split hand for acro-osteolysis, HP:0032155 Abdominal cramps for the interferon signature, HP:0004382 Mitral valve calcification for aortic valve calcification) and were not used; acro-osteolysis is bound to HP:0002797 Osteolysis because HPO has no generic term. Primary papers fetched from a PubMed search: PMID:24686847, 25620204, 31898846, 32042913, 25243380, 35410415, 40043752. Validated with just validate, count-verified-snippets (45/45), validate-terms, check-genereviews (NO_CHAPTER), check-causal-targets and the gene-grounding gate.

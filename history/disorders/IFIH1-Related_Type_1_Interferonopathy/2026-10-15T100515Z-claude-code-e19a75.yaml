  summary: 'Review round 1: GeneReviews baseline, JAK inhibitor evidence'
  details: |
    Addressed review on PR 14312. The notes wrongly said no GeneReviews chapter covers the disease; the Aicardi-Goutieres Syndrome chapter (PMID:20301648) covers IFIH1. It is now tagged GeneReviews in references and quoted as REVIEW_SYNTHESIS evidence for the AGS7 subtype, dominant inheritance, cerebral calcification, chilblains (new phenotype, directness INDIRECT because the 40% figure is for AGS overall) and supportive management (new treatment). Ruxolitinib now cites the two brothers in PMID:32042913 (interferon signature fall and motor function) and its description no longer says single case. Added baricitinib from the 35-patient open-label AGS study (PMID:32877590), with explanations noting the cohort was genetically heterogeneous, and trial NCT03921554 (phase 2, completed per the ClinicalTrials.gov API). Optional items: conforms_to on the tissue interferon node to cgas_sting_pathway_activation; the spastic paraplegia edge marked directness INDIRECT; the somatic variant in PMID:40043752 noted in features and the tofacitinib description. Dystonia and an Ifih1 gain-of-function mouse model were not added because no cached source quotes them for IFIH1. Snippets 55/55 verified; validate, validate-terms, check-entity-refs, check-causal-targets pass; check-genereviews reports TAGGED.

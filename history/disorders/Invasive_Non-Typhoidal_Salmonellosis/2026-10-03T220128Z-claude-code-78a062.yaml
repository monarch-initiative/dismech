  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the four Salmonella strata against the six differentiating axes of design decisions section 3e (R7-R16). Outcome: one subtype added and the rest deliberately kept lumped, with the reasoning recorded in entry-level review_notes. The S. Typhimurium ST313 lineage is subtyped with classification: lineage, carried structurally per R13 with no identifier and explicitly not bound to NCBITaxon:90371, its parent serovar, per R15; MONDO has no class for it either, so the checker's UNBOUND_SUBTYPE on this row is the correct state rather than a gap. It differs from its siblings on four axes, each cited: geography (a sub-Saharan African clade), drug susceptibility (multidrug-resistant, forcing more expensive regimens), at-risk population (HIV in adults; malaria, HIV and malnutrition in children) and presentation (bloodstream infection, septicaemia and meningitis rather than the gastroenteritis caused by the ST19 lineage of the same serovar); PMID:22587967, PMID:25569606 (quote is a macrophage study's introduction stating the human clinical association, graded on that clinical evidence with quote_role BACKGROUND), PMID:37872141 for ST313-L2 as the current pandemic lineage. S. Enteritidis and S. Dublin were kept lumped: both are named as invasive serovars, which is the entry's inclusion criterion rather than a difference between them, and searches produced nothing quotable separating either from ST313 disease on any of the six axes. In particular PMID:26996313, the whole-genome study behind the S. Dublin agent record, never mentions cattle or a bovine reservoir, so the obvious axis for that serovar cannot be cited from the sources this entry holds; review_notes says so and invokes R10. No new references were needed. One grading was corrected during the gate sweep: the risk-factor sentence from PMID:22587967 is already quoted in the environmental section as evidence_source OTHER, so the subtype item was aligned to OTHER. The three agent-level strata under infectious_agent were left untouched per the task's scope, so their pre-existing UNBOUND_AGENT_STRATUM advisories remain; they are now bindable to NCBITaxon under the AgentSubtype class and are flagged in the PR as follow-up. disease_term, pathophysiology and infectious_agent bindings were not touched. Validated: just validate (70/70 snippets), just check-granularity (TAXON_LUMP cleared), just check-snippet-grading.

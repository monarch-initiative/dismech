  summary: Bind LOINC Salmonella sp culture code to the sterile-site culture row
  details: |
    Added diagnosis_term (NCIT:C25300 Microbial Culture Procedure) and diagnosis[].measurements binding LOINC:17563-8 (Salmonella sp identified in Specimen by Organism specific culture) to the Blood or cerebrospinal fluid culture row. The genus-level code matches this disease's own identity: iNTS is a residual category (any non-typhoidal serovar growing from a sterile site), not a single named serovar, unlike Typhoid_Fever where species-level identity is the disease's own defining feature and a genus-level code would under-specify it. A notes field explains this distinction. This entry was previously treated as not clearly bindable; re-examined this round. No cross-branch collision (checked against every open loinc-*-batch* branch). New cache/loinc/terms.csv row, confirmed absent from origin/main before seeding.

  summary: 'Review: expand invasive NTS host, burden, treatment, trial, and model
    coverage'
  details: |
    Addressed PR review by expanding invasive non-typhoidal salmonellosis beyond its initial bloodstream-dissemination skeleton. Added NCBITaxon-backed Typhimurium, Enteritidis, and Dublin infectious agents; HIV, malaria, malnutrition, and sickle-cell host contexts; pneumonia, splenomegaly, and shock phenotypes; concrete antibiotic agents; antiretroviral therapy; surgical management for Salmonella mycotic aneurysm; sub-Saharan African GBD incidence; pooled clinical-burden case-fatality estimates; IL12B, IL12RB1, IFNGR1, IFNGR2, STAT1, CYBB, NCF1, and HBB susceptibility genes; five active or completed iNTS vaccine/effectiveness trials; a macrophage ST313 infection model; and a transmission knowledge gap for the unresolved African reservoir. Regraded the HIV anti-LPS bactericidal blockade evidence to primary human clinical support and marked review-derived 2018 Africa-review quotes with REVIEW_SYNTHESIS.

  details: |
    Review round 1 on PR 13816. Added two phenotypes from Table 2 of DOI:10.26815/acn.2024.00717, which re-tabulates the founding Radio et al. cohort (quote_role BACKGROUND): Gastrointestinal features, 13/31, FREQUENT, bound to HP:0011024 Abnormality of the gastrointestinal tract with coarse_binding_basis VARIABLE_SPECTRUM because the source counts any GI feature together and names reflux and constipation only as footnote examples without counts; and Abnormal pyramidal signs, 6/24, OCCASIONAL, HP:0007256, wired from Abnormal Neurodevelopment like the other neurological phenotypes. No spine-anomaly phenotype was added: the only cached source is the founding abstract's 'brain and spine anomalies', with no quotable specific spinal finding. Dropped the PMID:41525714 REFUTE item on Brain anomalies, since normal MRI in two relatives does not contradict a FREQUENT feature. Reworded the PMID:40529391 explanation in the phenotype-expansion discussion: that VUS case is not counted toward Hearing impairment, which rests on the founding series (3/31). Added quote_role BACKGROUND to the two PMID:42456047 items quoting the palate/cleft frequency sentence, which restates the human phenotype in a mouse study. Removed the uncited Abnormal Neurodevelopment to Dystonia edge (single-family finding, no mechanism source). Split the combined dystonia treatment into Clonazepam (SMALL_MOLECULE, CHEBI:3756) and Botulinum toxin injections (NCIT:C157775 Botulinum Toxin Therapy, modality OTHER, therapeutic_agent unbound because the report names no serotype and NCIT:C163032 is outside the ChemicalEntityTerm roots), each with the same single-case evidence. Validation: validate-disorders passed, 85/85 snippets verified (also with --unskip-prefix DOI), terms, entity refs, causal targets, coarse phenotypes and snippet ratchets clean; 18/28 phenotypes causally connected.

  summary: Ground gene in a molecular function for the gene-activity gate
  details: |
    The gene-activity grounding gate added to main after this PR was approved flagged SPEN, whose landing nodes bound biological processes but no molecular function. Bound GO:0003714 transcription corepressor activity (DECREASED) on 'Reduced SPEN-Mediated Transcriptional Repression', supported by the node's existing evidence that MINT/SPEN competes with Notch for the DNA-binding factor RBP-J and suppresses Notch transactivation (PMID:12594956) and that SPOC recruits NCoR/SMRT (PMID:32025035). Bound GO:0106222 lncRNA binding (DECREASED) on 'Impaired XIST-SPEN-Mediated X Chromosome Silencing', supported by the node's evidence that SPEN binding to XIST RNA requires RRM4 (PMID:38164599). No evidence items were added or changed.

  details: |
    New entry for Radio-Tartaglia syndrome (MONDO:0859143; SPEN, hgnc:17575). Deep-research source: the Perplexity report in research/ (reference validation 12/13 resolved). The one unresolved reference, DOI:10.1371/journal.pgen.1008333&type=printable, is a malformed URL fragment; the underlying DOI resolves via eutils to PMID:31537017, a general Xist review, which was not cited because primary papers (PMID:25915022, PMID:32025035, PMID:38164599) support the same XIST-SPEN claims. Report items without a quotable PubMed or DOI source (OMIM/Orphanet/ClinVar/panel pages, neural conditional knockout mouse brain phenotype) were not used. preflight-dr could not run (no local mondo.db); the report was checked manually and is consistently about SPEN/RATARS. Founding paper PMID:33596411 is cached abstract-only, so phenotype frequency bands come from Table 2 of DOI:10.26815/acn.2024.00717, which re-tabulates the founding cohort's counts; those items carry quote_role BACKGROUND. The female X-chromosome DNA methylation episignature is recorded as a biomarker node with an inferred edge from impaired XIST-SPEN silencing, using only what the abstract states; its functional consequence is a KNOWLEDGE_GAP. Obesity mechanism is a fly-model hypothesis (HUMAN_MODEL_MISMATCH). Hearing loss from a VUS case (PMID:40529391) is a discussion, not a phenotype. No GeneReviews chapter (PubMed genereviews[book] and just check-genereviews: NO_CHAPTER). No ClinGen record cached, so gene_disease_validity absent. Validation: validate-disorders passed, 84/84 snippets verified, terms passed, entity refs, causal targets, coarse phenotypes, snippet ratchets clean; 18/26 phenotypes causally connected. In self-review, five downstream edges from Reduced SPEN-Mediated Transcriptional Repression (to congenital heart defect, facial dysmorphism, kyphosis, scoliosis and brachydactyly) were removed because no source specifies a mechanism for them; those phenotypes, plus strabismus, myopia and hearing impairment, are deliberately left unconnected.

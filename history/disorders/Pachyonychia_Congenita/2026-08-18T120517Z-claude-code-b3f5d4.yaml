  summary: 'Create: Pachyonychia Congenita (5-gene keratin subtypes, plantar pain
    node, TD101 siRNA)'
  details: |
    Created kb/disorders/Pachyonychia_Congenita.yaml de novo, resolving issue #8739
    (CURATE_ROOT_WITH_SUBTYPES, MONDO:0016471). No deep-research provider was used:
    curation is built entirely from primary literature plus GeneReviews, fetched and
    verified individually.

    Scope and subtypes. has_subtypes is modelled on the genotypic axis, five causal
    keratin genes. Four bind MONDO subtype_term values, all label-verified against
    OLS: PC-K6a to MONDO:0014324 "pachyonychia congenita 3", PC-K6b to
    MONDO:0014325 "pachyonychia congenita 4", PC-K16 to MONDO:0008173 "pachyonychia
    congenita 1", PC-K17 to MONDO:0008174 "pachyonychia congenita 2". PC-K6c (KRT6C)
    is curated with genes and evidence but is deliberately left UNBOUND because MONDO
    has no term for it; the gap is recorded in the subtype review_notes and in the
    entry-level notes, together with a warning that MONDO:0000325 and MONDO:0009827
    are obsolete and must never be used. The entry records that this genotypic
    scheme supersedes the eponymous PC-1 (Jadassohn-Lewandowsky) / PC-2
    (Jackson-Lawler) split, including the point that MONDO's PC1 term folds the
    Jadassohn-Lewandowsky eponym onto KRT16 alone, itself a simplification.

    Mechanism modelling. Two structural decisions were made deliberately, following
    the issue and the review of KRT1_Keratinopathies.yaml in dismech#3401. First,
    keratin network collapse is kept SEPARATE from downstream hyperproliferation:
    Dominant-Negative Keratin Variant -> Keratin Intermediate Filament Network
    Disruption -> Loss of Keratinocyte Mechanical Resilience, with Defective Terminal
    Differentiation of Volar Keratinocytes and Oxidative Stress and Hypoactive
    Keap1-NRF2 Signalling as intermediate nodes, and only then Compensatory Epidermal
    Hyperproliferation and Barrier Dysregulation. The resilience node is explicitly
    hedged (mechanism_confidence PROVISIONAL) because PC keratoderma is
    non-epidermolytic, unlike the KRT1/KRT9 keratinopathies. Second, plantar pain has
    its own mechanism node (Plantar Nociceptive and Neuropathic Pain) and its own
    phenotype (Plantar Pain) rather than being a severity qualifier on the
    keratoderma, because its magnitude is not proportional to callus extent and
    quantitative sensory testing (PMID:29210461) shows a neuropathic component that
    skin thickening does not explain.

    TD101 evidence discipline. The allele-specific KRT6A N171K siRNA is curated with
    therapeutic_modality SIRNA and target_mechanisms INHIBITS on Keratin Intermediate
    Filament Network Disruption. Its human evidence is hedged as PARTIAL throughout:
    the trial (PMID:19935778) enrolled a SINGLE PATIENT, and the description states
    that explicitly in capitals. The historical-first claim is kept as a separate
    SUPPORT item so it cannot be read as an efficacy claim. In-vitro allele
    selectivity (PMID:17914454, PMID:17145926, PMID:21248764) and molecular endpoint
    development (PMID:21191405) are curated separately as IN_VITRO.

    Also curated: five genetic entries with per-gene case_fractions; ten treatments
    including a REFUTE evidence item for oral statins in KRT16/KRT17 disease
    (PMID:41100406); three clinical trials (NCT05180708 topical rapamycin phase 3,
    plus NCT05435638 and NCT05956314 KM-001, duplicated from
    Punctate_Palmoplantar_Keratoderma.yaml because PC was a co-enrolled condition);
    two experimental_models and the Krt16-null animal model, all with
    modeled_mechanisms links; and three discussions (a KNOWLEDGE_GAP on what
    determines pain severity, a HUMAN_MODEL_MISMATCH on the recessive Krt16-null
    mouse versus dominant-negative human disease, and a RESOLVED OPEN_QUESTION
    recording the nosology decision).

    References. 19 references cited, all fetched with just fetch-reference and read
    before use: PMID:31823354, 19935778, 21248764, 21191405, 37766547, 33190296,
    20301457 (GeneReviews, tagged), 31021398, 22336941, 27183391, 31220272, 21326300,
    22264670, 19609311, 38805703, 29210461, 36116508, 17914454, 17145926, 41100406,
    plus clinicaltrials NCT05180708, NCT05435638, NCT05956314. Every claim from the
    issue's bot triage comment was independently re-verified against the fetched
    abstract. PMID:35245567 was fetched but returned no content and was not used;
    its cache file was removed rather than committed.

    Cache warming. EBI OLS was responding slower than the ols_client 5s default
    timeout, so MONDO/HP/UBERON terms new to this entry were populated from OLS
    itself via linkml-term-validator with a widened requests timeout. No cache row
    was hand-written.


  summary: Map Pachyonychia congenita to OMIMPS:167200
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. The January 2026 PS167200 snapshot overlaps the dominant keratin disorder curated here through the four numbered KRT16-, KRT17-, KRT6A-, and KRT6B-related records, but it also contains the historical autosomal recessive record OMIM:260130. Conversely, this entry explicitly curates the KRT6C form, which is not a separate member of the inspected series. MONDO:0016471 has the four numbered dominant children, so its exact crosswalk does not resolve these scope differences. RelatedMatch records the overlap without equating the current five-gene dominant keratinopathy with that historical five-record union or asserting either is a strict subset of the other. Shared nail and palmoplantar phenotypes explain the association; the mapping does not infer a dominant-negative keratin mechanism for the historical recessive record.
    Reworded a prose sentence to use disrupts to avoid a codespell false positive; evidence quotes are unchanged.

  details: |
    Third session on this entry, an augmentation of the existing ADH3 curation (created in PR #8884). No new disease scope; the entry, its MONDO anchor and its pathograph are unchanged.

    DEEP RESEARCH. A fresh falcon (Edison) run was executed rather than reusing the August report: `just research-disorder falcon Autosomal_Dominant_Hypercholesterolemia_3`, 674s, 34 citations. Its own validation sections are clean - reference validation 13/13 resolved, 0 unresolved, 0 off topic; term validation 12/13 resolved, 0 unresolved, 0 obsolete, 1 unverifiable. The recipe again failed to pass the MONDO ID through (frontmatter records `mondo_id: ''` despite `disease_term.term.id: MONDO:0011369` being present in the file), so `just preflight-dr <report> MONDO:0011369` was run separately: verdict WARN, PCSK9 dominant at 69 mentions against LDLR=34 and APOB=7, with the flagged rival "FH" again the disease abbreviation misread as the fumarate hydratase gene symbol. The preflight also reported that the report cites OMIM 143890 and 607786 while MONDO:0011369 xrefs OMIM 603776 - i.e. the report does mix in the sibling FH entities - so its LDLR- and APOB-specific passages were excluded and only PCSK9-anchored content was used. Falcon reports cite by author-year key with no PMIDs, so the report's DOIs were swept out of the body and resolved to PMIDs through the PMC ID converter before use.

    WHAT WAS ADDED. (1) A `classifications:` block - harrisons_chapter ENDOCRINOLOGY_METABOLISM and GENETICS_ENVIRONMENT_DISEASE plus icimd_category `hypercholesterolemias`, each evidenced from the Abifadel 2003 abstract (PMID:12730697). Values deliberately match the sibling LDLR-Related_Familial_Hypercholesterolemia and Familial_Defective_Apolipoprotein_B-100 entries; CARDIOVASCULAR was considered and declined, with the reason recorded in the assignment's `notes:` rather than left implicit. (2) An `imaging_findings:` block, the first in this entry: coronary plaque burden on CT angiography and coronary artery calcification (PMID:33261814, 259 asymptomatic molecularly diagnosed FH patients), and regression of plaque burden under PCSK9 inhibition (PMID:37009731, ARCHITECT). (3) A CONTROVERSY discussion, `adh3_cerebrovascular_risk`, recording why no cerebrovascular phenotype is curated here: GeneReviews lists stroke among FH manifestations, while the Norwegian genetically verified FH register (PMID:30580708) and SAFEHEART (PMID:27444203) both report no excess cerebrovascular risk. Recorded, not resolved. (4) Colesevelam as a treatment - bile acid sequestrant, `therapeutic_modality: OTHER` with the reason stated (a non-absorbed polymeric resin is not a small molecule and no other enum value fits), NCIT:C15986 plus CHEBI:59594, `target_mechanisms` MODULATES on the LDL-C node, evidenced from PMID:23916045 and the GeneReviews pregnancy guidance. (5) `case_fractions` on the PCSK9 genetic entry: 2.3% of a 130-patient LDLR/APOB-negative ADH cohort (PMID:16211558), with `notes:` stating explicitly that the denominator is already enriched and the figure is an upper bound on the PCSK9 share of unselected FH. (6) Evidence for incomplete segregation and within-family variability in severity from the same paper, which converts the entry's expressivity statement from an inference about an absent estimate into an observed property. (7) The cumulative-LDL-burden threshold age (about 12.5 years in FH versus about 55 without) on the presymptomatic progression phase, from PMID:38338916. (8) `evidence:` on the geo:GSE75545 dataset record, quoting the cached GEO summary - legitimate here because the record is hand-curated rather than bulk-generated, and the `notes:` was rewritten to say so instead of citing the no-evidence SOP.

    WHAT WAS CORRECTED. The ARCHITECT trial (NCT05465278) carried a `notes:` saying the registry record does not establish that participants are molecularly diagnosed; the results publication (PMID:37009731) does say so, so it was added as evidence and the note rewritten. The Peripheral Arterial Disease phenotype gained SAFEHEART as a second, molecularly defined source. Three `explanation:`/`notes:` strings still argued for the retired `supports: PARTIAL` enum value (dismech#7439, and the prose-rot problem #10003 records) and were rewritten to say what they meant without naming a value the schema no longer has. The Statin Therapy `notes:` claimed no lipid-lowering option is established in pregnancy; GeneReviews describes bile acid sequestrants as generally considered safe, so that sentence was reconciled with the new Colesevelam entry rather than left to contradict it.

    SCOPE DISCIPLINE. Most of the added clinical evidence comes from FH-wide cohorts (SAFEHEART, the Norwegian register, the CCTA series, the colesevelam trials), none of them PCSK9-stratified. Every such block carries a `notes:` saying so, following the pattern the existing treatment entries already use. No FH-wide finding is stated as a PCSK9-specific quantity.

    CLAIMS DROPPED RATHER THAN CURATED. The falcon report attributed an "approximately 1% of FH" figure for the PCSK9 gain-of-function share to a 2024 review (PMID:38338916). That figure could not be located anywhere in the cached full text of that review, so it was not curated; the `case_fractions` notes record the attempt and the failure rather than carrying the number. A draft rationale describing the Norwegian register and SAFEHEART as "the two largest cohort studies" of verified FH was softened to "two large cohort studies" - the superlative was not sourced. The candidate explanations offered in that rationale are explicitly labelled as untested in the cited papers and not curated as evidenced.

    VALIDATION. `just validate` passed (schema, terms and references). `just count-verified-snippets` reported 149/149 snippets verified against cached references, up from 124 at the end of the previous session; every new snippet was checked as an exact substring of its cached source before being written. `just validate-terms` passed, and HP:0001677, HP:0001717 and CHEBI:59594 were added to the enum/term caches by that run. `just check-duplicate-keys`, `just check-entity-refs`, `just check-causal-targets`, `just check-qualifier-terms` and `just check-enum-values` all clean on the file; `just check-title-snippets`, `just check-snippet-length`, `just check-folded-hyphens`, `just check-snippet-grading` and `just check-environmental-evidence` clean KB-wide. `just check-snippet-length` initially failed on a four-word GeneReviews quote ("stroke occurs more rarely") in the new discussion; it was replaced with the full clinical-characteristics sentence whose closing clause carries the claim. Compliance 97.5%, unchanged in rate while the denominator grew by roughly 40 checks. `just validate-disorders` was run over the changed file as the pre-PR sweep. All new references were fetched with `just fetch-reference` (PMID:16211558, 23916045, 27444203, 30580708, 33261814, 37009731, 38338916). PMID:38338916 is additionally cited for the bile-acid-sequestrant class mechanism stated in the Colesevelam description, so that description is not an uncited pharmacology claim. An unrelated metadata-only churn in references_cache/PMID_32197277.md, produced by a refetch attempt during validation, was reverted rather than committed. A red-team review was run against the change before the PR.

  summary: 'Create: Autosomal Dominant Hypercholesterolemia 3 (ADH3, PCSK9 gain-of-function)'
  details: |
    New standalone entry for MONDO:0011369 (OMIM:603776), the PCSK9 gain-of-function form of familial hypercholesterolemia.

    NEC preflight: the hypercholesterolemia series is a high-NEC-risk numbered/lettered class. Identity was anchored against MONDO before curation via "runoak -i sqlite:obo:mondo info MONDO:0011369 -O obo" - causal gene PCSK9 (RO:0004003 HGNC:20001), OMIM:603776, synonym HCHOLA3. A falcon deep-research report was generated and checked with "just preflight-dr <report> MONDO:0011369": verdict WARN, with PCSK9 dominating at 70 mentions (LDLR=29, APOB=3); the flagged rival "FH" is the FH disease abbreviation being read as the fumarate hydratase gene symbol, a false positive. The report was used only as leads - every PMID was fetched with "just fetch-reference" and every snippet verified against the cached abstract.

    Scope decision: standalone entry rather than a subtype of Familial_Hypercholesterolemia (MONDO:0005439). The umbrella entry's subtype axis is zygosity (HeFH/HoFH), not gene; MONDO models this as a distinct is_a child defined by causal gene; and the mechanism (accelerated degradation of a structurally normal LDL receptor by an overactive regulator) is distinct from the LDLR and APOB forms and is the direct rationale for PCSK9-inhibitor therapy.

    Curated content: an eleven-node pathograph running from the PCSK9 gain-of-function variant through EGF-A binding, lysosomal rerouting of the LDL receptor, reduced hepatic LDL clearance and chronic LDL-C elevation, into a three-node atherogenesis branch conforming to "atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention", "atherogenesis#Monocyte Recruitment and Macrophage Foam Cell Formation" and "atherogenesis#Smooth Muscle Cell Switching and Fibrofatty Plaque Formation", "atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap" and "atherogenesis#Plaque Rupture, Thrombosis, and Ischemic Events". Two mechanistic_hypotheses (CANONICAL receptor-degradation versus ALTERNATIVE apoB-secretion) with a KNOWLEDGE_GAP discussion and two proposed experiments. The variant consequence is recorded on GeneticContext.functional_impact_category (GAIN_OF_FUNCTION), not as a Descriptor modifier. Treatments: evolocumab and alirocumab (MONOCLONAL_ANTIBODY), inclisiran (SIRNA), statin therapy and ezetimibe (SMALL_MOLECULE), LDL apheresis (DEVICE) and lifestyle/risk-factor modification (BEHAVIORAL), each with target_mechanisms into the pathograph. Three PCSK9 variants (S127R, F216L, D374Y), GeneReviews-baselined phenotypes, three clinical trials (RUTHERFORD-2, ORION-9 and the VERVE-101 base-editing phase 1b), two animal models and one patient-derived iPSC hepatocyte-like-cell model with modeled_mechanisms and readouts, plus one relevance-triaged GEO dataset, an environmental block with pathograph links, and a progression timeline.

    Validation: "just validate" passed (schema, terms and references); "just count-verified-snippets" reported 109/109 snippets verified against cached references; "just validate-terms" passed; "just check-duplicate-keys" and "just check-title-snippets" were clean; "just verify-datasets" resolved geo:GSE75545; compliance 96.5%, with pathograph connectivity at 8/8 phenotypes and 1/1 causal genes wired. A red-team self-review was run before opening the PR and its blocking findings (pathograph connectivity, two mis-tagged evidence_source values, unevidenced OBLIGATE frequencies, an over-claimed binding-affinity statement, and an S127R zymogen-processing framing contradicted by a cited paper) were addressed.

  details: |
    Second session on PR #8884, responding to the ai4c-reviewer CHANGES_REQUESTED verdict and to a red `test (3.13)` job.

    CI ROOT CAUSE (not a schema or foreign-key failure). The failing step was `scripts/check_environmental_evidence.py --against-ref origin/main`, an ungated ratchet that fires on kb-only PRs. Two of the three `environmental:` exposures - Tobacco Smoking and Sedentary Lifestyle - carried evidence only inside their `influences_mechanisms[]` links and had no entry-level `evidence:` block; the checker keys on the entry-level block, so both read as new uncited causation claims. The first exposure (High Saturated and Trans Fat Intake) already had one, which is why only two were reported. Fixed by citing each exposure at entry level rather than by dropping them: Tobacco Smoking now cites PMID:34433300 (FH-Risk-Score - smoking is one of seven predictors in a 10-year ASCVD score derived in 3881 heterozygous FH patients) and Sedentary Lifestyle cites PMID:35294538 (UK Biobank; among FH-variant carriers a favourable lifestyle, scored partly on regular exercise, conferred 86% lower CAD risk). Both are FH-specific quantitative findings, not the GeneReviews 'circumstances to avoid' list already quoted on the mechanism links.

    REVIEWER IMPORTANT (blocking) ITEMS.
    Item 1. Bempedoic acid added to `treatments:` - SMALL_MOLECULE, NCIT:C15986 Pharmacotherapy plus `therapeutic_agent` CHEBI:149601, `target_mechanisms` MODULATES on 'Chronic Elevation of Plasma LDL Cholesterol' (it acts on the LDL burden, not on the PCSK9 lesion). Evidence from CLEAR Outcomes (PMID:36876740) for both the ATP-citrate-lyase mechanism and the MACE reduction. `notes:` records that CLEAR Outcomes enrolled statin-intolerant high-risk patients, not an FH or PCSK9-genotyped cohort - the same disclosure pattern the other treatments use.
    Item 2. Clinical FH diagnostic criteria added as a `diagnosis:` entry naming DLCN, Simon Broome and MEDPED, cited to PMID:29408959, with the second snippet tagged PARTIAL because the sentence validating the criteria also records their only-moderate concordance. Lp(a) added as a second `biochemical:` marker bound to HP:6000521, cited to PMID:27185354 (measure it in everyone with FH; Lp(a) cholesterol accounts for a quarter of clinical-FH diagnoses) and PMID:34433300 (one of the seven FH-Risk-Score variables). The Lp(a) note deliberately holds both roles apart - confounder of the clinical score, and prognostic modifier - and states it is not part of the PCSK9 mechanism.

    REVIEWER SUGGESTION (non-blocking) ITEMS ADDRESSED.
    Item 3. Peripheral arterial disease phenotype added (HP:0004950), PMID:30085243, no `frequency:` band because no PCSK9-specific figure exists and FH-wide odds ratios do not convert into one.
    Item 4. PCSK9 p.Arg496Trp added as a fourth representative variant, PMID:36187800 - a C-terminal CM1 allele whose gain of function runs through loss of LDL binding, a mechanistically separate class from the prodomain/catalytic alleles already curated.
    Item 5. Penetrance statement added to `genetic.notes`: high but age-dependent for the biochemical phenotype, unquantified per allele, frankly incomplete for clinical ASCVD - stated as an absence rather than borrowing an FH-wide number.
    Item 6. PCSK9 loss-of-function protective alleles recorded as reciprocal support only (PMID:16554528), scoped in `genetic.notes` as explicitly not part of the ADH3 entity and with no protective phenotype curated.
    Item 8. LDL Apheresis `treatment_term` moved from the generic NCIT:C49236 Therapeutic Procedure to NCIT:C173286 Therapeutic Apheresis, which is an exact label match; `just validate-terms` passes, confirming reachability from NCIT:C25218.
    Item 9. NCT05465278 (ARCHITECT) added, PHASE_IV / COMPLETED / n=104 confirmed against the ClinicalTrials.gov v2 API. Its `notes:` records that the registry text does not itself state the cohort is molecularly diagnosed, so that characterisation is not curated as an evidenced claim.
    Item 10. Xanthoma phenocopies added as a differential (sitosterolemia, cerebrotendinous xanthomatosis, lysosomal acid lipase deficiency), PMID:27678445, with the reason it matters here spelled out - tendon xanthomatosis is a curated phenotype of this entry and one of the strongest predictors in the clinical criteria added above.

    DELIBERATE NON-CHANGES.
    Item 7. The LDLR-independent PCSK9 inflammatory arm was not added. It would be a third mechanistic model in an entry that already carries two competing ones plus a KNOWLEDGE_GAP, and the research artifact supplies its own counter-evidence (PCSK9 inhibitors reduce events without clearly reducing hs-CRP). Adding a hypothesis the source material already undercuts would weaken the epistemics the review praised.
    Item 11. GO:0048661 plus `modifier: INCREASED` left as is. The redundancy is real but it is inherited: the node duplicates `atherogenesis#Smooth Muscle Cell Switching and Fibrofatty Plaque Formation` verbatim, including its `preferred_term`, term id and modifier. Conformance in dismech is duplication, not inheritance, so silently diverging from the module here would make the conforming node disagree with the node it conforms to. If the pairing is wrong it is wrong in the module (GO:0048659 'smooth muscle cell proliferation' is the term that matches the `preferred_term`), and that is a module-scoped change, not a curation-PR change.

    VALIDATION RUN. `just validate` passed (schema plus terms plus references). `just count-verified-snippets` reported 124/124 verified against cached references, up from 109/109 - all 11 new snippets were checked as exact substrings of their cached abstracts before being written, and all new references were fetched with `just fetch-reference` (PMID:34433300, 35294538, 36876740, 29408959, 27185354, 30085243, 36187800, 16554528, 27678445, NCT05465278). `just validate-terms` passed. `check_environmental_evidence.py --against-ref origin/main` now reports no new evidence-free exposures. `check_duplicate_yaml_keys.py` clean over 2334 files. `check_title_snippets.py`, `check_snippet_length.py`, `check_folded_hyphens.py` and the term-cache integrity check all clean. `just validate-disorders` run over the changed file as the pre-PR sweep.

    SEPARATE PRE-EXISTING BREAKAGE, NOT INTRODUCED HERE. A full local `pytest tests/test_data.py` run fails on kb/disorders/Travelers_Diarrhea.yaml (24 evidence items whose `reference:` is a bare https URL with no `url:` prefix), from commit af3849cba5 on main. That file is not in this PR's diff, and CI gates the pytest job on `src/**` / `tests/**` so it is not currently surfacing on kb-only PRs. Flagged for a separate issue rather than fixed here.

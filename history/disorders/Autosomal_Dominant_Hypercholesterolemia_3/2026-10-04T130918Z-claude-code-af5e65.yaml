  summary: Evidence-claim mismatch review (#12826)
  details: |
    Reviewed the 25 whole-claim MISMATCH findings in the Jev evidence_claim_match assessment (source revision fc510ecc, unchanged in this file since). Replaced four snippets that did not carry the claim: the dose-dependent PCSK9 sentence (PMID:17080197) now supports the circulating-abundance-to-receptor-binding edge in place of the D374Y potency comparison; the thick-cap barrier sentence (Endotext NBK343489) now supports the cap-weakening-to-rupture edge in place of a rupture-to-thrombosis sentence; the minipig model cites its results sentence (PMID:23283366) in place of the authors' outlook; the clinical-criteria diagnosis cites the odds-ratio results (PMID:29408959) in place of the aim statement. Extended the ORION-4 registry snippet to include the enrolled population. Gave the surface-LDLR node its own DIRECT evidence item instead of an alias to the lysosomal node's INDIRECT one. Regraded directness to INDIRECT where an inference step is needed: PCSK9 loss-of-function evidence on the causal gene, post-ACS ODYSSEY outcome evidence on alirocumab, and the D374Y aggressive-management sentence on apheresis. Kept the remaining flagged items, which already scope population and FH-wide sources in their explanations or are general review sources cited INDIRECT. Validated with just validate, validate-terms, count-verified-snippets (200/200) and validate-disorders.

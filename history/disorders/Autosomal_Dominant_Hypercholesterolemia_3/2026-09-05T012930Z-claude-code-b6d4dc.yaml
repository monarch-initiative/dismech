  summary: 'Keep loading doses out of dosing_interval: Autosomal_Dominant_Hypercholesterolemia_3'
  details: |
    Trimmed the inclisiran dosing_interval from 'once every 6 months after day 1 and day 90 loading doses' to 'once every 6 months'. The slot's own schema description, added by this PR, says to record loading or induction doses in the treatment description rather than in the interval; four of the twelve uses this PR introduced broke that rule, so the new convention was violated in its own first use and would have been copied. Nothing is lost: this entry's treatment description already states the loading schedule, and dosing_interval_days: 182.5 is the maintenance figure either way.

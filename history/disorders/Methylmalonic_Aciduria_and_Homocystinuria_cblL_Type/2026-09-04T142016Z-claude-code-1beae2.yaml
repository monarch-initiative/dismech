  summary: 'Create: Methylmalonic Aciduria and Homocystinuria cblL Type (MAHCL, THAP11)'
  details: |
    De novo curation of MAHCL / cblL (MONDO:0975798, OMIM:620940, THAP11). Lump-split decision: curated as a separate kb/disorders entry rather than folded into the cblX subtype of Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport, because cblL is autosomal recessive and cblX is X-linked, and because cblC, cblD, cblE and cblG each already have their own entry. The reasoning and the resulting staleness of that file's cblX subtype description are recorded in the mahcl_versus_cblx_entity_boundary discussion; that file is deliberately not edited here. Deep research: one OpenScientist run, committed as research/Methylmalonic_Aciduria_and_Homocystinuria_cblL_Type-deep-research-openscientist.md. Like the DFNA75 run in the same batch it emitted no reference_validation or term_validation frontmatter block and no report sections despite the flags, and both were retro-fitted (see issue 9702, commented). The retro-fitted term validation flagged eight wrong or questionable bindings, none of which were used: CHEBI:16009 offered as methylmalonic acid (it is 9-riburonosyladenine; the entry uses CHEBI:30860), and NCIT:C61796, NCIT:C61837 and NCIT:C61785 offered as Betaine, folinic acid and Levocarnitine (they are Ivermectin, Methacholine and Hydrocortisone Acetate). Separately and more seriously, the report offered hgnc:20856 for THAP11. That is THAP1, the DYT6 dystonia gene. HGNC is on the term validator's skip list, so nothing in the pipeline checks gene CURIEs and the wrong identifier would have passed silently; it was caught by resolving the symbol against the HGNC REST API. The correct identifier hgnc:23194 is used and the trap is documented in the entry's genetic notes. Entry content is built on PMID:28449119 (Quintana 2017, the index patient plus zebrafish), PMID:31905202 (Dehaene 2020, promoter binding and MMACHC transcription for the patient's own F80L allele), PMID:35013307 (Chern 2022, Hcfc1 and Ronin mouse models plus the ribosomopathy arm), PMID:24011988 (Yu 2013, cblX) and PMID:20301503 (GeneReviews). Two nodes downstream of MMACHC carry mechanism_confidence PROVISIONAL because they are inherited from cblC biology and have not been measured in a MAHCL patient. One patient has been reported, so three knowledge-gap discussions record the single-patient evidence base, the entity boundary against cblX, and the fact that OMIM's clinical synopsis for that patient records methylmalonic aciduria without the homocystinuria the disease is named for. Validation: just validate passed with 26/26 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-enum-values all clean.

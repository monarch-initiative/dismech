  summary: 'Gene-family review: MMACHC'
  details: |
    In cblL the MMACHC gene is intact and its expression falls because THAP11, with HCFC1, activates the MMACHC promoter; the entry rightly types MMACHC UNKNOWN and explains why it is listed. The Reduced MMACHC Expression node named MMACHC with no molecular function; it now binds MMACHC's two activities, GO:0033787 (decyanation) and GO:0016765 (glutathione-dependent dealkylation), as DECREASED, with preferred terms saying the loss follows from reduced expression rather than a defective protein. The MMACHC genetic record was left unchanged.

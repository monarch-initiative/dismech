  details: |
    LOINC tranche Q batch 1 (staging and severity scores, hepatology cluster). Added a diagnosis[] row ('Child-Pugh Assessment of Hepatic Reserve') binding LOINC:98153-0 (Child-Pugh panel) via measurements, citing two sentences from the same ASCO guideline (PMID:38502889) already used elsewhere in this entry's treatments section: Child-Pugh class A as a first-line systemic-therapy eligibility criterion, and class B as a treatment-caution gate. notes: documents why no reference_ranges/total-score band (LOINC:98152-2) is added: this entry's own cited sources use the Child-Pugh class letters as treatment-eligibility/caution gates, not as a point-based classification this entry itself defines or sources a numeric cut-off for (the canonical 5-6/7-9/10-15 point bands were not found cited anywhere in this entry's own references, so inventing them would violate the never-originate-a-number rule). Only the panel code is bound; the total-score code is deliberately left out of this entry pending a source that actually states the point cut-offs. First drafted as a biochemical[] marker, then moved to diagnosis[].measurements per the tranche's explicit panel/total-score-split convention (test the panel identity goes in diagnosis measurements, not biochemical.loinc_term). LOINC:98153-0 label (Child-Pugh panel) confirmed against cache/loinc/terms.csv via just loinc-seed-cache; no third-party copyright notice required for this code (checked against cache/loinc/external_copyright_codes.csv). No collision with any other open loinc-* branch's cache for this code. The evidence snippet for Child-Pugh class A eligibility was corrected during validation to match PMID:38502889's exact wording ('Atezolizumab + bevacizumab ... or durvalumab + tremelimumab ... may be offered first-line for patients with advanced HCC, Child-Pugh class A liver disease'), replacing an initial paraphrase that failed exact-substring validation. just validate-disorders, check-entity-refs, check-duplicate-keys, check
  summary: 'Curate the monomethyl phthalate to MMP9 environmental axis (issue #6395)'
  details: |
    Answers issue #6395, which asked whether the entry represents environmental toxin exposure pathways and whether the phthalate-MMP9 axis should be added as an extrinsic risk-factor mechanism. It did not, and now does. Added one pathophysiology node (MMP9 Upregulation, MOLECULAR, bound to hgnc:7176 and GO:0004222) with downstream edges to Portal Vein Invasion and Tumor Thrombus and to Enhanced Hepatocyte Proliferation; one environmental entry (Monomethyl phthalate exposure, bound to ECTO:9000906 exposure to phthalate ester) whose influences_mechanisms edge reaches the MMP9 node with environmental_effect EXACERBATES; and one KNOWLEDGE_GAP discussion recording why the phthalate class is not generalizable to a single environmental-chemical pathway. Note that an earlier bot comment on the issue reported this work as completed in commit b38bcf2, but that commit is not reachable from main and no phthalate content existed in the entry. Evidence: PMID:42435151 (the issue's paper; Mendelian randomization graded HUMAN_CLINICAL per KB precedent, cell-line arms IN_VITRO), PMID:40961618 (MMP-9 and heparanase combined knockdown lowering portal vein tumour thrombus in mice, MODEL_ORGANISM, graded INDIRECT because the arm is a combined knockdown), PMID:42674152 and PMID:42094681 (a second and third phthalate nominating different targets, used only in the knowledge-gap discussion). Deep research: just dr_fallback=--fallback research-disorder falcon Hepatocellular_Carcinoma. Falcon is unconfigured in this environment (no EDISON_API_KEY), so the run fell back to openscientist and recorded fell_back, requested_provider and provider_attempts in the report frontmatter. That report contained zero mentions of phthalate or MMP9 and contributed nothing to this entry, and its output path collided with the already-committed openscientist HCC report, so the tooling refused to overwrite and no research artifact is included in this change; the committed falcon and openscientist reports are untouched. Curation therefore worked from the issue's primary paper plus targeted PubMed searches. A red-team review pass before commit found and fixed six defects, two of them blocking: a notes field that named five ECTO search results when the query actually returns eleven classes (rewritten after re-running every query it cites), and environmental_effect TRIGGERS, which would have asserted non-mutational tumour initiation and entered the node into the cell-of-origin derivation on the strength of an experiment run in an already-transformed line. Validated with just validate (109/109 snippets verified), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-reference-titles, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes and check-case-collisions, all clean; just check-cancer-origin still reports a single hepatocyte origin.

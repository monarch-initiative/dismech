  summary: Split the MLKL/MFN2 MASLD-HCC node into an atomic chain and fix its bindings
    and evidence grading
  details: |
    Adds the MASLD-associated MLKL arm to the HCC pathograph from PMID:42549799, and answers the review on PR #8826. The original single node bundled a four-step chain and is replaced by four atomic nodes chained with downstream: Hepatocyte MLKL Upregulation (MOLECULAR, genes MLKL hgnc:26617) -> Necroptosis-Independent MLKL Function (MOLECULAR) and -> MFN2 Suppression and Impaired Mitochondrial Respiration (MOLECULAR, genes MFN2 hgnc:16877) -> Aerobic Glycolytic Shift in MASLD-Associated HCC (CELLULAR) -> Enhanced Hepatocyte Proliferation. Review fixes applied: dropped the molecular_functions binding GO:0004713 protein tyrosine kinase activity / GAIN_OF_FUNCTION, which was biologically wrong (MLKL is a catalytically dead pseudokinase, the fold is Ser/Thr-like rather than tyrosine, and the abstract reports increased protein expression rather than any kinase activity); replaced the over-general GO:0007005 mitochondrion organization with GO:0008053 mitochondrial fusion, DECREASED, which is what the MFN2 claim is about; regraded the necrosulfonamide HepG2 xenograft result MODEL_ORGANISM rather than IN_VITRO, since a xenograft is in vivo mouse work; split the first evidence item, which mixed a mouse result and a cell-line result in one snippet, into separate MODEL_ORGANISM and IN_VITRO items; gave the necroptosis-independence its own node, since it is the paper's headline finding and was previously only a clause in a description; and declared conforms_to deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect) on the glycolysis node, giving HCC its first energetics conformance. The necroptosis node carries GO:0070266 necroptotic process with modifier ABSENT, matching the abstract's 'without detectable necroptosis activation'; ModifierEnum on this base has no UNCHANGED value. Validation: just validate passes; all 38 checkable snippets verify against references_cache/PMID_42549799.md; just check-duplicate-keys passes; the causal graph builds with no orphan targets and the four new nodes chain as intended; 4163 selected pytest checks pass.

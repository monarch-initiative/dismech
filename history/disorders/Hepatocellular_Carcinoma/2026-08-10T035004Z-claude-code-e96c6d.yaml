  details: |
    Rebase of PR #8195 onto current main, plus the review retarget.

    Conflict resolution: since the PR branched, main gained #8085's environmental-pathograph backfill, which added an influences_mechanisms link (Cirrhosis TRIGGERS "Chronic Liver Disease Substrate", causal_link_type DIRECT) to the very environmental entry this change removes. Resolved in favour of the removal. The backfilled link does not rescue the entry - its own description concedes the point, calling cirrhosis "the other chronic injury state named at this node", i.e. constitutive of the node rather than acting on it from outside. The original review's observation that nothing is lost from the pathograph no longer holds literally (an edge is now being removed, not just a bare stub), so recording it explicitly here: the cirrhosis-HCC relationship is relocated to kb/comorbidities/com_Liver_Cirrhosis__Hepatocellular_Carcinoma.yaml rather than dropped.

    The sibling "Chronic hepatitis B or C infection" entry, which carries the same self-admitted tautology in its backfilled description but is a genuine external exposure, is left unchanged, as is the "Alcohol and aflatoxin exposure" entry.

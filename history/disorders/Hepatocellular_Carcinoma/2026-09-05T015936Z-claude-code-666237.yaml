  summary: 'Integrate assessed OpenScientist findings: RPP40 RNase P/MRP branch gap'
  details: |
    Integrated the RETAINED and QUALIFIED claims of the existing codex assessment of the OpenScientist report for hypothesis rpp40_rnase_p_pretrna_mtor_myc_bridge. No second assessment sidecar was written because openscientist-assessment-by-codex.yaml already exists. Three evidence items were added to the gap_rpp40_trna_processing_mtor_myc_causality discussion, all with snippets copied verbatim from the local reference cache. PMID:16723659 substantiates the shared subunit premise the gap rationale asserts without attribution: RPP40 partitions with essentially all RNase MRP complexes, so an RPP40 perturbation cannot assign an HCC phenotype to the RNase P branch. PMID:40413743 was added to the branch test experiment as an independent human screen showing the RNase MRP specific subunits are dispensable for RNase P activity, which is the property the RNase MRP specific perturbation arm depends on; the entry previously cited only PMID:41136609 for those handles. PMID:41933259 was already cited three times, but the entry did not record that the same pan cancer analysis found the RPP40 expression to cell cycle correlation nonsignificant specifically in LIHC, which weakens extrapolation of the generic proliferation correlate alternative into HCC; that quotation reproduces a run together token present in the cached full text extraction. Deliberately not integrated: the report's Rpp14 leader degradation argument, its false checked absence claim for an RPP40 rRNA HCC source, and its RPP24/RPP64 subunit naming, all of which the assessment dispositioned REJECTED or corrected. The hypothesis status remains EMERGING and unwired as a causal pathograph edge, per the assessment and the report's own candidate status change.

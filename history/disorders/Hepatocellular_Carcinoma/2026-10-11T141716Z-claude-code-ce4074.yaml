  details: |
    The single TAGLN2-CSNK1E-YAP node bundled a molecular step, a localisation step, EMT and the metastatic outcome under one MOLECULAR scale tag. It is now three chained nodes: TAGLN2-Mediated CSNK1E Stabilization (MOLECULAR; TAGLN2 hgnc:11554 and CSNK1E hgnc:2453, looked up in the HGNC REST API; GO:0050821 protein stabilization), YAP Nuclear Translocation (MOLECULAR; YAP1 hgnc:16262; GO:0006606 protein import into nucleus), and TAGLN2-Driven Epithelial-Mesenchymal Transition (CELLULAR; GO:0001837; conforms to invasion_and_metastasis#Epithelial-Mesenchymal Transition Activation). The CSNK1E-inhibition rescue sentence is cited on the CSNK1E -> YAP edge. The nude-mouse lung-metastasis sentence and the human mCTC recurrence association moved onto the EMT -> Portal Vein Invasion edge, the second explicitly described as a prognostic association. All snippets verified against references_cache/PMID_42600715.md.

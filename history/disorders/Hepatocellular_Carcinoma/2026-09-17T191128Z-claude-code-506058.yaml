  details: 'Third review round on PR #8826, answering the 2026-09-14 CHANGES_REQUESTED review.
    Merged current main (175 commits) into the branch first; the merge was clean and purely
    additive, and git diff origin/main...HEAD still touches only the four files this PR owns.


    CRITICAL 1, reference titles. All fourteen evidence items citing PMID:42549799 now carry
    a reference_title: the twelve in the pathophysiology chain plus the two on the new environmental
    entry. The string was read programmatically from the title field of the frontmatter of
    references_cache/PMID_42549799.md and inserted by script, never retyped, because a hand-copied
    title is the one part of an evidence item that no snippet check can catch. check_reference_titles.py
    passes against origin/main.


    IMPORTANT 2, the necrosulfonamide xenograft. Restored, taking the reviewer''s first option,
    on Hepatocyte MLKL Upregulation with evidence_source MODEL_ORGANISM and directness INDIRECT.
    A xenograft is grown in mice, so the earlier IN_VITRO grading was wrong and deleting the
    item was not the regrade the commit message claimed. The item now sits beside the genetic
    knockout arm as its pharmacological counterpart. No treatment entry or target_mechanisms
    join point was added: nothing in this entry models NSA as a therapy, and inventing one
    to hold the evidence would be a larger claim than the paper''s single xenograft sentence
    supports.


    IMPORTANT 3, node split. MFN2 Suppression and Impaired Mitochondrial Respiration is now
    two nodes. MFN2 Suppression and Impaired Mitochondrial Fusion keeps biological_scale MOLECULAR,
    the MFN2 gene binding and GO:0008053 mitochondrial fusion DECREASED, with the WD-suppresses-MFN2
    mouse item. Impaired Mitochondrial Oxidative Phosphorylation is new, biological_scale
    CELLULAR, carrying GO:0006119 oxidative phosphorylation DECREASED with the transcriptomic
    MODEL_ORGANISM item and the IN_VITRO MFN2-rescue item, respiration being the measured
    quantity there. The chain reads Hepatocyte MLKL Upregulation to MFN2 Suppression and Impaired
    Mitochondrial Fusion to Impaired Mitochondrial Oxidative Phosphorylation to Aerobic Glycolytic
    Shift in MASLD-Associated HCC to Enhanced Hepatocyte Proliferation, and the upstream edge
    was repointed to the new name.


    Suggestions taken. The subtypes list naming MASLD-Associated HCC now tags all five nodes
    in the chain rather than one. directness INDIRECT is set on four items whose explanations
    already argued the inference step in prose: the tumour-burden item, the NSA item and the
    human-survival item on the MLKL node, and the transcriptomic item on the OXPHOS node,
    which reports pathway expression rather than respiration itself. modifier ABSENT on GO:0070266
    is kept, per the reviewer''s answer to the open question.


    Duplicate Warburg anchor, considered and kept. Main has since given the entry''s existing
    Aerobic Glycolysis and Metabolic Reprogramming node the same conforms_to anchor and the
    same GO:0006096 INCREASED term that this PR''s glycolysis node carries, so the entry now
    holds two nodes conforming to deregulated_cellular_energetics#Aerobic Glycolysis (Warburg
    Effect). They were left separate and the reason is recorded in the notes field on the
    new node. That node is driven by oncogenic PI3K/AKT and MYC signalling and is written
    for HCC generally; this one is MASLD-specific and its glycolytic shift is MFN2-dependent,
    which is what the MFN2-deletion rescue evidence supports. Both converge on Enhanced Hepatocyte
    Proliferation. The alternative, pointing the OXPHOS node at the existing Warburg node
    and carrying the MFN2 evidence on that edge, would drop either the subtype scope or the
    MFN2 dependence, and would undo a node structure the 2026-09-14 review checked and approved.


    Orphan source node resolved. A new environmental entry, Long-term Western diet feeding,
    links to Hepatocyte MLKL Upregulation with environmental_effect TRIGGERS and causal_link_type
    DIRECT, so the arm finally has an incoming edge. Both the link evidence and the entry''s
    own required top-level evidence are drawn from snippets already verified in this file.
    The exposure_term binding is a compromise recorded in the notes field: ECTO has no live
    term for a Western or high-fat dietary pattern, since the diet-pattern classes in that
    branch (ECTO:0030000, ECTO:0030001, ECTO:6000017 and ECTO:6000019) are all obsolete, so
    it is bound to ECTO:0090010 exposure to lipid in food with modifier INCREASED, which covers
    the fat component and not the sugar component. This follows the binding already used for
    the same gap in Coronary_Artery_Disease and Autosomal_Dominant_Hypercholesterolemia_3.
    The link description states plainly that the measurement is made in diet-fed mice and
    that the edge is asserted for that model rather than for a human dietary pattern.


    Validation run and read, not assumed. just validate-disorders kb/disorders/Hepatocellular_Carcinoma.yaml,
    which is the batched no-full-text sweep CI runs: schema no issues, term validation passed,
    reference validation passed with 99 of 99 snippets verified against cached references
    and 0 unverified. just count-verified-snippets agrees at 99 of 99. The ungated whole-KB
    gates check_entity_refs, check_causal_targets, check_duplicate_yaml_keys, check_enum_values,
    check_qualifier_terms, check_reference_titles, check_snippet_length, check_title_snippets,
    check_folded_hyphens and check_environmental_evidence all report OK. Unrelated references_cache
    full-text enrichment written by a partial validator run was reverted, so the diff stays
    scoped to this PR.'

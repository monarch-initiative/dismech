  summary: 'Create: Primary Ciliary Dyskinesia 3 (DNAH5)'
  details: |
    New gene-specific entry for CILD3 (MONDO:0012085, DNAH5). Deep research: falcon (Edison) returned 503 'Failed to authenticate' on every attempt, including with --fallback, which did not engage, so the report used is research/Primary_Ciliary_Dyskinesia_3-deep-research-claude_code.md, run directly with the claude_code provider. preflight-dr returned PASS. The report was used only as a lead; all evidence comes from primary abstracts and the ClinGen CGGV record fetched with just fetch-reference. Pathograph: biallelic DNAH5 loss of function, then failure of axonemal incorporation, then outer dynein arm loss, then immotile cilia, branching to mucociliary clearance failure, laterality randomization and efferent duct cilia dysmotility (oligozoospermia with normal sperm motility). ClinGen Definitive tier copied from the cached CGGV record. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

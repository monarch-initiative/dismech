  summary: Correct experiment_design on the mTOR-inhibition trial
  details: |
    exp_depdc5_mtor_inhibitor_trial carried TARGETED_PERTURBATION, presumably because the proposal names a pathway and an inhibitor. Its description is 'Conduct a controlled clinical trial (or well-powered n-of-1 series) of sirolimus or everolimus' in genetically confirmed carriers, and its experiment_type preferred_term is already 'interventional clinical trial'. Set to INTERVENTIONAL_TRIAL. Note separately that this experiment's model_systems row is a human patient cohort carrying experimental_model_type OTHER, which is the no-schema-home class recorded in docs/explanation/experiment-model.md; it is deliberately left alone here.

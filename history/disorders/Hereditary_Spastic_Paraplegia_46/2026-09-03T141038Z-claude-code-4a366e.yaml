  summary: 'Create: Hereditary Spastic Paraplegia 46 (SPG46, GBA2)'
  details: |
    De novo curation of SPG46 (GBA2 non-lysosomal glucosylceramidase deficiency) from a Perplexity sonar-deep-research report plus the GeneReviews pure-HSP overview (PMID:20301682). Built a 5-node causal chain (GBA2 LOF -> glucosylceramide storage -> membrane/cytoskeletal disruption -> corticospinal degeneration + cerebellar dysfunction) with verified snippets from Martin 2013 (PMID:23332916), Hammer 2013 (PMID:23332917), Yildiz 2006 Gba2-KO mouse (PMID:17080196), Haugarvoll 2017 (PMID:28052128), and the 2024 Italian series (PMID:38334933). The deep-research report mislabeled several CURIEs; all bindings were verified against source ontologies (GBA2 corrected from HGNC:4193/GCH1 to hgnc:18986; glucosylceramide, motor-neuron, hypogonadism, thin-corpus-callosum, scoliosis, gait-ataxia terms corrected). Validated: just validate (schema+refs, 20/20 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys all pass.

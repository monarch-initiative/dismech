  summary: 'Create: SPTBN4-Related Neurodevelopmental Disorder'
  details: |
    New deep curation of neurodevelopmental disorder with hypotonia, neuropathy, and deafness (MONDO:0060496, OMIM:617519, SPTBN4 / hgnc:14896). NEC preflight run with OAK before any content was written: the MONDO gene edge RO:0004003 resolves to HGNC:14896 SPTBN4 and the OMIM xref is 617519. The pathograph is built from primary axon-initial-segment and node-of-Ranvier neurobiology (Berghs 2000, Komada and Soriano 2002, Lacas-Gervais 2004, Yang 2004 and 2007, Uemoto 2007, Devaux 2010, Xu 2013, Saifetiarova 2018, Nip 2022) alongside the clinical cohorts (Knierim 2017, Wang 2018, Haeusler 2020, Buelow 2021, Belkheir 2021, GeneReviews 2020, AlQudairy 2025, Abdalla 2026). Fourteen pathophysiology nodes cover the reciprocal ankyrinG / beta-IV spectrin scaffold, the separable mechanical (nodal undercoat) and electrical (Nav and KCNQ2 or KCNQ3 clustering) arms, the auditory-neuropathy and motor-axonal arms, and two explicitly contested nodes (skeletal muscle involvement, cortical mechanism). Six discussions record live conflicts rather than smoothing them: seizure frequency spanning very rare to more than half across four sources, the myogenic versus neurogenic muscle debate refuted by a muscle-specific conditional knockout, the opposite-direction excitability paradox, the absence of any human CNS tissue or iPSC model, the deafness-in-the-disease-name mismatch, and two unexplained late-onset outliers. No FrequencyEnum band is asserted anywhere; per-phenotype counts are recorded in notes with the HPO annotation retrieval date. Validation: just validate PASS, just validate-terms PASS, just validate-references PASS 126 of 126 snippets, scripts/check_snippets_verbatim.py PASS 126 verified 0 failed, scripts/check_folded_hyphens.py --check PASS, uv run pytest tests/test_data.py 16782 passed 0 failed.

  summary: 'Remediate verifier findings: SPTBN4-Related Neurodevelopmental Disorder'
  details: |
    Remediation pass over the initial curation, in response to an adversarial verification review of this branch. Fixes applied: (1) dropped rate_per_100000: 0.0 from the NOT_YET_DOCUMENTED prevalence block; it was the only such block in the KB carrying a numeric rate, and a zero reads downstream as an assertion that the disorder does not occur. (2) Rebound the alpha motor neuron descriptor from the parent CL:0000100 motor neuron to CL:0008038 alpha motor neuron; descendancy confirmed with runoak -i sqlite:obo:cl ancestors -p i CL:0008038, and the term was already present in cache/cl/terms.csv. (3) Rebound four cortical pyramidal neuron descriptors from CL:0000598 pyramidal neuron to CL:4023111 cerebral cortex pyramidal neuron, same verification, term already cached. (4) Rebound the Epileptiform EEG without clinical seizures phenotype from HP:0002353 EEG abnormality to its child HP:0011182 Interictal epileptiform activity, whose HPO definition explicitly covers epileptiform activity occurring in the absence of a clinical or subclinical seizure; the reason and the parent-level HPOA count are recorded in that phenotype's notes, and no FrequencyEnum band depends on the parent. (5) Corrected the reference-cache note: four references are cached with full text (PMID:33772159 as XML; PMID:40781329, PMID:33986717 and PMID:35393465 as PDF), not two. (6) Corrected the claim that two patients in the 2021 cohort had entirely normal nerve conduction and EMG; the cached text supports one patient with both studies normal and a second with normal sensory and motor action potentials and no EMG reported. (7) Reframed the denominator of 28 for the 2025 review's gastrointestinal and respiratory percentages as an explicit curator back-calculation from 15/54 percent and 17/61 percent rather than a figure attributed to the review, in both the disease-level notes and the Feeding difficulties phenotype notes; the string 28 does not appear as a denominator in the cached review. (8) Weakened the description's claim that hearing impairment is a minority feature in every cohort that has counted it to the two figures actually sourced (21 percent in the 2025 review, 2/5 in the HPO annotation set), while acknowledging that the founding 2018 report named auditory neuropathy as part of the syndrome it described. (9) Dropped the unsourced count of three approved disease-modifying therapies from the SMA differential and marked the remaining statement as general clinical background rather than an entry-sourced assertion. (10) Corrected the claim that MONDO:0007365 matches kb/disorders/Benign_Neonatal_Seizures.yaml; that term appears there only as a has_subtypes subtype_term and the file's own disease_term is MONDO:0016027. (11) Corrected the preceding history record's count of twelve pathophysiology nodes to fourteen.

    Findings rejected: the HPO annotation counts sourced to the ontology.jax.org network-annotation endpoint were retained; they cannot be re-derived from references_cache offline, but every count that can be cross-checked against the per-patient table in references_cache/PMID_33772159.md is arithmetically consistent. The PubMed-sweep and empty-fetch process notes were retained because they are already phrased as searches performed on a stated date, not as facts about the world.


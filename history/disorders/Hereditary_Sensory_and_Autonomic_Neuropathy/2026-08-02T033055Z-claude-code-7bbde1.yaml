  summary: 'Create: Hereditary Sensory and Autonomic Neuropathy (HSAN/HSN class)'
  details: |
    New entry adding the sensory/autonomic-predominant hereditary neuropathy class (HSAN/HSN), the sensory counterpart to the motor-predominant CMT entries and a previously missing whole class. Covers five verified subtypes: HSAN1/SPTLC1 (PMID:20504773, deoxysphingolipid mechanism), HSAN2/WNK1-HSN2 (PMID:15060842), HSAN3/ELP1-IKBKAP familial dysautonomia (PMID:11179021), HSAN4/NTRK1 CIPA (PMID:8696348), HSAN5/NGF (PMID:14976160). Four mechanism nodes (neurotoxic deoxysphingolipid formation; impaired NGF-TrkA neurotrophic signaling; Elongator/ELP1 deficiency; HSN2/WNK1 sensory-neuron maintenance) converge on a shared terminal node (sensory and autonomic neuron degeneration). Deliberately NOT conformed to peripheral_axonal_degeneration: HSAN mechanisms include developmental neurotrophic failure and sensory/autonomic neuronopathy rather than CMT-style length-dependent dying-back. All 22 evidence snippets verified as exact substrings of fetched caches; schema/term/graph validation pass; FK and uniqueness checks clean. Bound to MONDO:0015364 and HGNC gene terms (SPTLC1, WNK1, ELP1, NTRK1, NGF).

  summary: Mine three HSAN GeneReviews chapters into evidence items (review response)
  details: |
    Response to ai4c-reviewer REQUEST_CHANGES on PR #8651. The three GeneReviews chapters (PMID:20301564 SPTLC1-HSN1, PMID:20301359 Familial Dysautonomia, PMID:20301726 NTRK1-CIPA) were previously tagged in references but never cited in evidence items (skill item 15 blocking). Mined each into real evidence: Acral Ulceration phenotype (20301564 painless-injury/osteomyelitis/amputation quote), Autonomic Dysfunction phenotype (20301359 dysautonomia enumeration), Autosomal Recessive inheritance (20301359 25%/50% recurrence risk), two new evidenced treatments (20301564 orthotics/neuropathic-pain-drug management, and opioid-avoidance agents-to-avoid statement), and a new diagnosis section (20301726 molecular-genetic diagnostic criterion). All six new snippets independently verified as exact substrings of the cached chapters; schema, term, and causal-graph validation pass.

  summary: 'Create: Louse_Borne_Relapsing_Fever'
  details: |
    Promotion of louse-borne relapsing fever (MONDO:0001620) out of the Relapsing_Fever parent entry into its own Disease entry (CLAUDE.md design decisions 3e). Agent Borrelia recurrentis (NCBITaxon:44449); sole vector the human body louse Pediculus humanus (NCBITaxon:121225); humans the only reservoir. Differs from the tick-borne sibling on at least two ladder axes: an anthroponotic human-louse epidemic cycle with no animal reservoir (vs zoonotic Ornithodoros/small-mammal), and generally fewer, longer relapses. Covers the Jarisch-Herxheimer reaction (55.8% pooled), mortality (untreated to ~40-70% historically, treated 2-6%), blood-film microscopy and 16S PCR diagnosis, and single-dose tetracycline/doxycycline/erythromycin/penicillin treatment. 7 pathophysiology nodes with edge-level evidence on the main vmp chain; 17 phenotypes (15 pathograph-connected); deep research (claude_code) committed under research/. Parent row converted to a curated_in pointer subtype in the same PR.

  summary: Wire GNAO1-DEE pathograph, preserving the epilepsy/movement two-pole split
  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Problem: the GNAO1 entry models a genuine two-pole architecture (shared Gao signaling
    lesion diverging into a cortical/epilepsy arm and a basal-ganglia/movement arm), but
    neither arm's endpoint node had an edge into the clinical layer. All 12 phenotypes floated
    (0/12 on phenotypes[].causal_inlink).

    Change: added downstream CausalEdges preserving the two-pole split -
      - Developmental and Epileptic Encephalopathy -> Epileptic Encephalopathy, Epileptic
        Spasms, Focal Seizures, Generalized Tonic-Clonic Seizures, Status Epilepticus
      - Hyperkinetic Movement Disorder -> Chorea, Dystonia, Choreoathetosis, Feeding
        Difficulties
      - Impaired Go Heterotrimeric G-Protein Signaling -> Global Developmental Delay,
        Intellectual Disability, Hypotonia

    The last three are deliberately wired from the SHARED upstream signaling node rather than
    from the epilepsy endpoint. The entry's own phenotype descriptions say developmental
    delay, intellectual disability, and hypotonia occur across the whole spectrum, including
    the movement-predominant pole; hanging them off the epilepsy endpoint would assert they
    are seizure-driven, which the sources do not support. All three use
    INDIRECT_UNKNOWN_INTERMEDIATES.

    Feeding Difficulties is likewise INDIRECT_UNKNOWN_INTERMEDIATES: the sources say it
    worsens during hyperkinetic crises but do not separate the movement-disorder contribution
    from baseline global neurological impairment, and the edge description records that.

    Two edges (Chorea, Dystonia) carry per-edge evidence graded PARTIAL, following the
    convention used elsewhere in the KB for a citation that establishes the edge's target as a
    defining disease feature without asserting the mechanism-to-manifestation step. The
    snippet is copied verbatim from evidence already present and cache-verified in this file.

    No new PMIDs, ontology terms, or evidence sources.

    Validation: just validate passed (schema + terms + references; "Snippets checked: 25/25
    verified against cached references"). Phenotype connectivity 0/12 -> 12/12; gene wiring
    was already 1/1 (GNAO1 on the trigger node) and was not touched.

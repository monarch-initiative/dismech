  summary: 'Compliance: add GNAO1 dataset records and inhibitory-transmission evidence'
  details: |
    Weekly compliance pass focused on datasets. The entry had an empty datasets list; added two verified records - geo:GSE263736, RNA-seq of patient-specific GABAergic neurons carrying the GNAO1 c.607G>A p.G203R hotspot variant with AAV and allele-selective shRNA arms, and geo:GSE241258, RNA-seq of Neuro2a cells after siRNA silencing of Gnao1. Both resolved OK through just verify-datasets on 2026-08-27. Each record notes what it does not cover: GSE263736 was designed as an off-target safety readout for a gene-therapy candidate rather than as a disease-state comparison, and GSE241258 is wild-type knockdown in a mouse neuroblastoma line, so it models Gao depletion rather than the dominant-negative missense alleles that cause most human disease. Also added IN_VITRO evidence from PMID:40229422 to the previously unevidenced Cortical Excitation-Inhibition Imbalance node, graded PARTIAL because it is a single-allele single-receptor result in dissociated culture rather than a network-level excitation-inhibition measurement. Both candidates came from a targeted GNAO1 title search; the third GEO hit for GNAO1 is a glioblastoma CRISPR-activation screen and was rejected.

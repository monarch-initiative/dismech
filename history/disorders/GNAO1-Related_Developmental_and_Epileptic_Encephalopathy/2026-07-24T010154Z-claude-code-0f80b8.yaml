  summary: 'Create: GNAO1-Related Developmental and Epileptic Encephalopathy'
  details: |
    De novo curation of GNAO1-Related DEE (MONDO:0014199; also NEDIM MONDO:0060491 as a subtype). Deep research provider: claude_code (initiate-new-disorder-creation workflow). Pathophysiology deliberately partitioned into single-concept nodes (variant -> impaired Go signaling -> two divergent effector arms: Gbg presynaptic Ca-channel/neurotransmitter-release brake and adenylyl cyclase-cAMP -> cortical E/I imbalance vs basal-ganglia output dysregulation -> epilepsy pole vs hyperkinetic movement pole) to minimize bundling. GeneReviews baseline PMID:37956232 used for clinical/inheritance/diagnosis. Mechanism/genotype-phenotype evidence from Nakamura 2013 (PMID:23993195), Feng 2017 (PMID:28747448, LOF->epilepsy/GOF->movement cAMP model), Feng 2018 review (PMID:29758257), Danti 2017 cohort (PMID:28357411, tetrabenazine + life-saving DBS). Includes prevalence, diagnosis, differential_diagnoses (dyskinetic CP, STXBP1 DEE4, CDKL5, glutaric aciduria I), and two knowledge-gap discussions. Validated: schema + term validation pass (primary checkout); all 22 evidence snippets verified as exact substrings of cached abstracts.

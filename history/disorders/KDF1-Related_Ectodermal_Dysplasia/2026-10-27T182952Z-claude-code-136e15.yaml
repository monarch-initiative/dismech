  summary: 'Review round 1: ECTD12 tooth count, allele naming, edge directness'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review on PR 15751. All three IMPORTANT findings were verified against the cached source before acting and all three were correct. (1) The Tooth agenesis description claimed six of six affected members of the Shamseldin family had lost all their teeth; Table II of PMID:40463401 records five as 'Loss of all teeth' at ages 16-52 and the sixth (III:2, age 1) as 'Natal', so the entry contradicted its own variant description. Corrected to five of six. (2) The c.753C>A variant record carried no evidence naming the allele - its only snippet said a KDF1 mutation was first reported by Shamseldin et al without giving the change. Added the Table II row that names it, graded quote_role REVIEW_SYNTHESIS because it is this paper's tabulation of others' cases. The reviewer also flagged that the committed OpenScientist report gives c.753C>G (p.Phe251Leu) citing ClinVar while Table II writes c.753C>A. That disagreement is now recorded in the variant description rather than resolved: the Shamseldin abstract names no allele, ClinVar was not reachable, and both changes would alter the same TTC codon to leucine, so the protein consequence is probably p.Phe251Leu either way - which matters because residue 251 is the lower boundary of the 251-275 cluster the entry's genotype-phenotype reasoning uses. (3) PMID:35641834 was cited for the edge out of the DUF4656-domain node, but its allele p.Ile304Asn lies outside that cluster and the entry itself records it as the non-syndromic boundary case, so the only functional evidence on that edge came from the allele class the node excludes. Kept rather than dropped, because it is the only functional measurement on any human KDF1 allele, but graded directness INDIRECT with an explanation naming both inference steps (tooth-only allele to syndromic allele, and altered KDF1 level to loss of proliferation-differentiation control). Also took the reviewer's pathograph-ordering suggestion: USP7 recruitment is a direct molecular function of KDF1, so the IKK-alpha node now hangs off the variant node in parallel with the balance node rather than downstream of it, which also removes a mismatch between the YAML and the PR body. Three further suggestions taken: a Conical tooth phenotype (HP:0000698) for the reported peg-shaped teeth; a diagnosis section covering exome sequencing, Sanger confirmation and the uninformative prenatal ultrasound; and the c.760C>T p.His254Tyr point added to the dominant-missense knowledge gap, since a gain-of-function allele inside the same 251-275 cluster would mean position cannot predict direction of effect - labelled explicitly as a report-and-ClinVar lead, not a checked binding, and kept out of the evidence. One suggestion declined: adding an Acne inversa (HP:0040154) phenotype for the hidradenitis suppurativa seen with gain-of-function alleles. Its only source (PMID:37144643) has no quotable abstract, and that presentation belongs to an allele class this entry scopes out, so adding it would assert hidradenitis suppurativa as a feature of ECTD12 on no citable evidence. Re-validated after the changes: schema, terms, 41/41 snippets, 47 titles.

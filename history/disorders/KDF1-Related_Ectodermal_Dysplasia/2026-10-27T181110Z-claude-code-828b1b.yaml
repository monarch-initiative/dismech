  summary: 'Create: KDF1-Related Ectodermal Dysplasia'
  details: |
    De novo curation of ECTD12 (MONDO:0015024, KDF1). Deep research: falcon was requested and returned HTTP 403 (invalid EDISON_API_KEY); the run fell back to openscientist with --fallback, so research/KDF1-Related_Ectodermal_Dysplasia-deep-research-openscientist.md records fell_back/requested_provider/provider_attempts. Report validation read before use: 9/9 references resolved, confabulation_rate 0.0, but needs_review was set - the report invented HP:0100680, cited an obsolete HP:0001006 (hypotrichosis, replaced by HP:0008070), and mislabelled UBERON:0001003 and UBERON:0001091. None of those terms is bound in this entry. The report contributed two references found nowhere in my own PubMed sweep and which materially changed the entry: PMID:24075906 (the original Kdf1 forward-genetics paper, giving the dual p63/stratifin mechanism) and PMID:32239614 (the KDF1-USP7-IKKalpha deubiquitination axis). Before reading the report the IKKalpha arm had been left out as unsourced, because the paper that reports gain-of-function KDF1 alleles acting on IKKalpha (PMID:37144643) has no abstract text in PubMed and so cannot be quoted; with PMID:32239614 the axis is now a fully cited pathophysiology node. PMID:30977908 and PMID:37144643 are cited in references: without inline evidence for the same no-abstract reason, and the entry notes say so explicitly. just preflight-dr could NOT be run: it requires the local 1.3 GB MONDO build and this container had 509 MB of writable disk free, so the Named Entity Confusion check was done by hand instead (report anchors name KDF1 and MONDO:0015024; its citations include the correct defining family report). Validation: just validate passes (schema, terms, 37/37 snippets, 43 titles); check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose, check-environmental-evidence, check-snippet-grading, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes and check-qualifier-terms all clean. GeneReviews baseline: just check-genereviews --online reports NO_CHAPTER with five synonyms in place.

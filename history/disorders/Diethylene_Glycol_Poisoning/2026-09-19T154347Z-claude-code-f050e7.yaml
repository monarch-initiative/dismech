  summary: 'Review round 2: limb weakness rebinding, autonomic dysfunction, hemodialysis
    edge'
  details: |
    Review round 2 on PR #12297, answered in one push. Four findings, all taken.

    Two blocking, both correctly identified as my errors:

    1. Limb muscle weakness was bound to HP:0003324 Generalized muscle weakness
       while its preferred_term, description, snippet and explanation all said
       limb. Those two terms are siblings under HP:0001324, not a general and a
       specific form of one concept: HPO defines HP:0003690 as weakness "of the
       muscles of the arms and legs" and HP:0003324 as "affecting both distal
       and proximal musculature". Rebound to HP:0003690 and renamed to match.

       Worth recording how this happened, because the gates cannot catch it. The
       round-1 reviewer supplied HP:0003324 as a suggestion. I verified it
       existed and that its label was canonical, which is what validate-terms
       checks, and did not check that it was the right term for the claim. That
       is the same self-consistent-but-wrong shape CLAUDE.md documents for gene
       bindings, applied to a phenotype, and it is the second time this session a
       CURIE reached a commit because the existence check was mistaken for a
       correctness check. A CURIE from a reviewer is a lead on exactly the same
       footing as a CURIE from a deep-research report.

    2. Autonomic dysfunction was absent entirely, at 63% in the Panama cohort,
       with the sentence sitting in the same paragraph that supplied three
       frequencies added in round 1. Added, bound to HP:0012332 Abnormal
       autonomic nervous system physiology - the functional child rather than
       its structural parent HP:0002270, since the claim is about dysfunction.
       The parent/child relationship was checked against OLS rather than assumed.
       Frequency FREQUENT; the snippet keeps the source's "signs suggestive of"
       hedge and its spelled-out "Sixty three percent".

       The review's diagnosis of why it dropped out is right: the research report
       offered HP:0012647 for autonomic dysfunction, that identifier is Abnormal
       inflammatory response, and refusing it was correct. What was missing was
       rebinding rather than dropping the phenotype.

    Two optional, both taken:

    3. Hemodialysis now carries target_mechanisms against Systemic Diethylene
       Glycol Exposure. It was the only treatment outside the pathograph, and
       its own cited snippet - measured pre- and post-dialysis levels - is a
       claim about removing the toxin. The edge description carries the
       qualification from the supportive-care entry, that one cited source
       describes extracorporeal removal as implied rather than experimentally
       shown.

    4. Supportive correction of the metabolic acidosis now carries
       CHEBI:32139 sodium hydrogencarbonate as a therapeutic_agent, so the agent
       is queryable rather than named only in prose.

    The review also recorded that two of its round-1 asks were unfounded - the
    osmolal-gap figure is sourceable only from an ethylene glycol paper, and the
    68% facial palsy figure appears in no cached source - and that the two
    refusals in round 1 (no frequency on sensorimotor neuropathy, GI prodrome as
    one phenotype) were correct. No change needed for either.

    Validation: just validate-disorders clean with 70/70 snippets verified (was
    68/68); just validate-terms passed; check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms all clean.
    Connectivity 5/17 - the ratio keeps falling because each round adds
    phenotypes the entry cannot causally explain, which is the honest outcome.

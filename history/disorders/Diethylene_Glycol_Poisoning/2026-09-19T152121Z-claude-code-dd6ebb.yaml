  summary: 'Review round 1: GI prodrome, phenotype frequencies, ethanol and supportive
    care'
  details: |
    Review round 1 on PR #12297, answered in one push.

    Two blocking findings, both content-completeness gaps against the deep
    research artifact, both closeable from references already cached:

    1. The phase-1 gastrointestinal prodrome had no phenotype, although the
       entry's own three-phase framing rests on it and the supporting sentence
       (PMID:37186212) was already quoted in the file for the acidosis half of
       the same phase. Added as one phenotype rather than four: the source names
       the phase collectively as "gastrointestinal symptoms" and does not
       itemise nausea, vomiting, abdominal pain and diarrhoea, so splitting it
       would assert four findings where one is reported. Bound HP:0002017
       Nausea and vomiting as the closest single term with the reasoning in
       notes.

    2. No phenotype carried a frequency. Added FREQUENT to limb weakness (78%)
       and bilateral facial palsy ("more than half"), and OCCASIONAL to
       tetraparesis (22%), all from PMID:25170933. Every one of those figures is
       that paper reporting Sosa et al's Panama cohort rather than counting its
       own patients, so the evidence is graded REVIEW_SYNTHESIS and each
       phenotype's notes says so. Also added Generalized muscle weakness
       (HP:0003324) as a distinct, commoner phenotype than the tetraparesis it
       progresses to.

       Deliberately no frequency on Sensorimotor neuropathy. The available
       figure - severe sensorimotor axonal neuropathy in 19 of 21 - is
       conditional on having limb weakness and on having been tested, so it is a
       frequency within a selected subgroup. Entering ~90% as a disease-level
       band would overstate it; the numerator and denominator are carried in the
       evidence instead.

    Three optional findings, all taken:

    3. Added Ethanol as the alternative alcohol dehydrogenase inhibitor,
       targeting the same node as fomepizole, and a Supportive correction of the
       metabolic acidosis entry. Both from PMID:36939119, already cited here.
       The ethanol evidence is graded INDIRECT and BACKGROUND because the
       sentence is the authors proposing that the mechanism implies a therapy
       ("should be therapeutic"), not a result; the treatment description says
       so rather than implying demonstrated benefit. The bicarbonate snippet is
       quoted with the authors' parenthesis intact, since they note that
       extracorporeal removal of the toxin is assumed rather than shown - which
       qualifies the Hemodialysis entry too.

    4. Added a diagnostic caveat about routine bloods, but NOT the one the
       review proposed. The review's claim was that the osmolar gap is less
       sensitive for diethylene glycol than for methanol or ethylene glycol.
       The only cached source making an osmolal-gap-sensitivity claim is
       PMID:33425517, which is about ETHYLENE glycol - citing it here would be
       the cross-toxin error this entry exists to prevent. What a diethylene
       glycol source does say (PMID:33475432) is that the osmolal gap is
       increased but non-specific, and that is what was added.

    5. Added the opposing human data point to the oxalate discussion:
       PMID:25170933 reports absence of oxalate crystalluria and of oxalate
       deposition in tissue examined, pointing the other way from the
       PMID:28085681 autopsy. This turns a one-sided refutation into the
       two-sided open question the discussion claims to be. The snippet includes
       the source's own inline citation markers ("examined14,15") because that
       is how the sentence appears in the cached text.

    Verified rather than accepted: the review's frequency figures were checked
    against the cache before use. 78%, 22% and "more than half" are exact;
    "63%" appears as "Sixty three percent" and "19 of 21" as "in 19", so the
    snippets use the source's wording. The review also cited facial palsy at
    68%, which appears nowhere in the cached sources and was not used.

    Validation after the round: just validate-disorders clean with 68/68
    snippets verified (was 58/58); just validate-terms passed; check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values and
    check-qualifier-terms all clean; every reference_title still byte-identical
    to its cache frontmatter. Connectivity 5/16 - the ratio fell because this
    round added two phenotypes that nothing in the entry causally explains,
    which is the honest outcome rather than a regression.

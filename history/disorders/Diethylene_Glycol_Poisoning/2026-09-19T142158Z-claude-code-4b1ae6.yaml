  summary: 'Create: Diethylene Glycol Poisoning (no MONDO term)'
  details: |
    Create: Diethylene Glycol Poisoning, a toxin-exposure entry with no MONDO term.

    Deep research: `just research-disorder claude_code` (336 s, 20 web searches,
    62 citations). The run produced no inline validation block, so reference and
    term validation were retro-fitted with `just validate-research-reference` and
    `just validate-research-terms`: 31/31 references resolved, 0 unresolved, 1
    off topic (and only 31 of the 62 citations were checkable at all, the rest
    being web pages rather than PMIDs or DOIs).

    No CURIE was taken from the report. That was load-bearing: term validation
    plus my own checks found seven of its suggestions naming different concepts.
    HP:0025314, offered for "CSF protein elevation", is Choroidal nevus.
    NCIT:C1421, offered for fomepizole, is Oxygen Radical. NCIT:C15571, offered
    for hemodialysis, is Differentiation Therapy. CL:1001016, offered as
    proximal convoluted tubule epithelial cell, is loop of Henle ascending limb -
    in an entry whose whole mechanism is proximal-tubule-specific. HP:0100519 and
    HP:0100518 were offered as Oliguria and Anuria and are Anuria and Dysuria.
    HP:0012647, offered as Autonomic dysfunction, is Abnormal inflammatory
    response. Every binding in this entry came from a live OLS lookup performed
    while writing the line.

    Why this entry rather than a subtype of the existing Ethylene_Glycol_Poisoning
    entry: the mechanisms diverge. Ethylene glycol runs through glycolic to oxalic
    acid and calcium oxalate deposition; diethylene glycol is oxidised to
    diglycolic acid, a succinate mimic taken into proximal tubular cells by the
    dicarboxylate transporters, not effluxed, and inhibiting complex II
    specifically. The evidence has clean negative controls - the parent compound
    and the first metabolite produce no cell death at all - and fomepizole blocks
    metabolite formation and every downstream toxicity, which makes bioactivation
    necessary rather than incidental.

    Four mechanistic_hypotheses, all wired to edges: the canonical renal arm, and
    three competing accounts of the delayed neuropathy (direct diglycolic acid
    neurotoxicity, 2-hydroxyethoxyacetic acid as the causal moiety, and retention
    conditional on renal failure).

    No disease_term. MONDO has no diethylene glycol concept; the searches are
    recorded in notes, and binding MONDO:0017861 ethylene glycol poisoning would
    assert the confusion this entry exists to prevent.

    A red-team subagent reviewed against dismech-pr-review before any PR and
    returned 14 findings. All were acted on. Four were blocking:

    1. Three of four hypothesis groups were declared but no causal edge opted
       into them, including the CANONICAL one. All four are now wired.
    2. The bioactivation node bundled three sequential reactions, which made it
       impossible to express that fomepizole blocks only the first, and left
       2-hydroxyethoxyacetic acid with no node - so the hypothesis naming it as
       the neurotoxic moiety had no edge to attach to. Split into an alcohol
       dehydrogenase node and a 2-HEAA node. Retargeting fomepizole to the split
       node was then missed and caught by check-causal-targets, which is the
       rename-dangling case that gate exists for.
    3. The Facial palsy phenotype cited a paper that names cranial nerve deficits
       without saying which - and whose only seventh-nerve sentence attributes it
       to ETHYLENE glycol, the exact confusion this entry warns about. Replaced
       with a sentence naming bilateral facial paresis in human DEG cases, and
       rebound from HP:0010628 to the more specific HP:0430025.
    4. Twenty-four cache files were committed uncited. Four high-value ones are
       now used: the only human fomepizole case (PMID:10793034), the
       toxicokinetics study sourcing the tissue distribution claim (PMID:8135655),
       the NaDC-1 expression study explaining variable susceptibility
       (PMID:36939119), and a human neurological case series (PMID:25170933). The
       rest are cited by the committed research report and so are not orphans.

    Unsourced prose the review caught and this round fixed: a tissue distribution
    claim now cited; an "osmolal and anion gap behave differently" sentence that
    was unsourced and half wrong, since both poisonings give a high anion gap;
    three hemodialysis claims including "the main determinant of survival"; and a
    "one to three weeks" delay figure contradicted by a cited source saying two to
    seven days. The oxalate discussion also mischaracterised its own quoted
    source, offering product impurity as an explanation for ethylene glycol that
    the quote shows was measured in rat urine and is therefore a metabolite.

    Also added on review: hepatic failure and seizure phenotypes, both from
    snippets already quoted elsewhere in the file; affirmative human evidence for
    hemodialysis, which previously had only a negative observation about
    peritoneal dialysis; an SLC13A2 gene descriptor on the transporter node; a
    diagnosis section, since the entry's own notes argue the distinction from
    ethylene glycol is diagnostic; and corrections to experimental_model_type,
    two biological_scale tags and an animal-model link that pointed at a node the
    study does not measure.

    One process failure worth recording: I wrote HP:0002239 from memory rather
    than from a lookup. It happened to be correct, which is luck and not process -
    the rule is that a CURIE is read from a source in the same step it is written,
    and a correct guess is not evidence the rule was followed. I also mistyped a
    snippet ("was given between" for "was found between") and caught it before
    validation.

    Validation: just validate-disorders clean with 56/56 snippets verified;
    just validate-terms passed; check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms,
    check-snippet-grading, check-title-snippets, check-snippet-length,
    check-folded-hyphens, check-environmental-evidence, check-case-collisions,
    check-reference-titles and check-not4curation all clean. check-genereviews
    returns NO_CHAPTER, correct for a non-Mendelian acquired poisoning.
    Connectivity 5/14.

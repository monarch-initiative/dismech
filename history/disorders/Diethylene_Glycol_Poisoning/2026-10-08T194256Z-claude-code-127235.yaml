  summary: Conform to toxic_alcohol_adh_bioactivation module
  details: |
    Declared conforms_to against the new toxic_alcohol_adh_bioactivation module on five pathophysiology nodes: Systemic Diethylene Glycol Exposure (trigger), Alcohol Dehydrogenase Oxidation of Diethylene Glycol (central effector, the key conformance target), 2-Hydroxyethoxyacetic Acid Formation and Diglycolic Acid Formation (both to the shared sequential-oxidation amplifier node), and Organic Acid Accumulation (acidosis effector).

    Two acid-formation nodes conform to one module node because this entry models the sequential acids separately, and the module node covers the whole second-oxidation-and-accumulation step for exactly that reason.

    This entry now conforms to two modules at disjoint node sets. The three nodes wired to xenobiotic_oxidative_phosphorylation_blockade (the renal and neuronal complex II inhibition nodes and proximal tubular ATP depletion) are untouched here. The two modules are complementary halves of this poisoning: this one explains how diglycolic acid is generated, the other explains how it then blocks complex II.

    Observation not acted on: this entry carries a node named Dicarboxylate Transporter-Mediated Renal Uptake, which is a close instance of drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake and currently conforms to nothing. That is a separate wiring opportunity and is deliberately out of scope for this PR.

    No content was changed and no evidence was added or regraded.

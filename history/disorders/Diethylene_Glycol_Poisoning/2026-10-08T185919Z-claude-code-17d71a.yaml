  summary: Conform to xenobiotic_oxidative_phosphorylation_blockade module
  details: |
    Declared conforms_to against the new xenobiotic_oxidative_phosphorylation_blockade module on three pathophysiology nodes: Renal Mitochondrial Complex II Inhibition and Neuronal Mitochondrial Complex II Inhibition (both to the trigger node), and Proximal Tubular ATP Depletion and Necrosis (central effector).

    Two trigger conformances in one entry is correct here rather than redundant: the entry models the same complex II blockade separately in kidney and in nerve because the renal arm requires dicarboxylate-transporter uptake and intracellular trapping that the neuronal arm does not. This is the module's upstream-complex arm, the evidence that the blockade need not be at the terminal oxidase.

    No content was changed and no evidence was added or regraded.

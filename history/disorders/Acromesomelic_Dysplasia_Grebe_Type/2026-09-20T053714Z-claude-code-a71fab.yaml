  details: |
    Genetics pass for issue #12190 (d2g wiring-001), part of epic #12189.

    Research first: the entry already carried a complete GDF5 genetic record with three
    cited alleles and a full ligand-to-receptor pathograph. The GeneReviews baseline check
    reports NO_CHAPTER for this disease, which is correct - the Bookshelf index holds no
    GeneReviews chapter for Grebe or Hunter-Thompson acromesomelic dysplasia.

    What changed. GDF5 (hgnc:4220) is now bound as a genes descriptor on both has_subtypes
    rows, so the gene-defined Hunter-Thompson subtype (MONDO:0008717) carries its causal
    gene in a machine-readable slot rather than only in prose. An evidence item was added to
    the Grebe row quoting the sentence that attributes both presentations to biallelic
    mature-domain GDF5 variants. GDF5 was also bound on the two downstream pathophysiology
    nodes that describe its protein, and BMPR1B (hgnc:1077) on the shared central-effector
    node as the receptor half of the pair, with a descriptor description stating explicitly
    that it is bound as a node component and not as a cause of Grebe dysplasia.

    MONDO reconciliation. MONDO:0008717 records GDF5 (hgnc:4220); present and now bound on
    the matching subtype row. No disagreement with MONDO.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches
    and validate-disorders all pass.

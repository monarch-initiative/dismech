  summary: 'Create: Acromesomelic Dysplasia Grebe Type'
  details: |
    De-novo curation while reviewing ISDS 2023 nosology group 16 (acromesomelic dysplasias). Bound to MONDO:0008703 with the Hunter-Thompson type (MONDO:0008717) curated as a subtype, following the 2023 revision, which treats 'Grebe dysplasia, GDF5-related' as covering OMIM 200700 and OMIM 201250. Pathophysiology models the two allelic routes separately: truncating alleles as simple ligand loss, and the classic mature-domain missense allele as a retained protein that also blocks secretion of partner BMPs, which is what explains the brachydactyly seen in heterozygous carriers. The consequence node declares conformance to limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation. All 42 evidence snippets verified against the reference cache.

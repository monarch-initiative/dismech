  summary: 'Edit: address PR #9648 review findings'
  details: |
    Response to PR review findings 2 and 3. Finding 2: seven phenotypes rested on PMID:34178199, a case report about NPR2-related disease whose Grebe content is a differential-diagnosis paragraph citing other papers. Fetched and cited the primary literature instead - PMID:27577507 and PMID:26870132 for the digit and limb phenotypes and the proximodistal gradient, PMID:26275437 for micromelia and for femoral and tibial hypoplasia - and regraded every retained PMID:34178199 citation from HUMAN_CLINICAL to OTHER with an explanation naming why. Two findings (carpal fusion detail, forearm involvement) have no primary source in the literature searched and are flagged in their explanations as needing re-sourcing. Finding 3: added a treatments section with genetic counselling, which is the one intervention this disorder's literature documents, plus a knowledge gap recording that no disease-specific surgical, prosthetic or rehabilitative report was found to cite. Also added prenatal sonographic diagnosis, and extended the dominant-negative hypothesis with the LTBP1/LTBP2 co-factor result, which offers a candidate explanation for the carrier variability the entry already recorded.

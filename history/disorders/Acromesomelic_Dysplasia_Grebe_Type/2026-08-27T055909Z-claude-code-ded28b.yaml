  details: |
    Added three mechanistic_hypotheses groups covering the distinct GDF5 allele classes - simple ligand loss (CANONICAL), dominant-negative BMP sequestration (ALTERNATIVE), and precursor-processing failure (EMERGING) - and tagged the two trigger edges with the groups they belong to. These are not competing accounts of one allele but different allele classes that the clinical phenotype cannot distinguish, which the group notes state explicitly. Pathograph GO coverage completed: protein processing on the trigger, protein heterodimerization on the sequestration node, SMAD signal transduction and receptor serine/threonine kinase signalling on the central effector, and chondrocyte differentiation, cartilage development and extracellular matrix organization on the condensation node. Snippets 49/49 verified.

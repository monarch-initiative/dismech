  summary: 'Edit: address Bugbot review threads on PR #9648'
  details: |
    Response to two Cursor Bugbot review threads on PR #9648. The 'Grebe' subtype carried subtype_term MONDO:0008703, the same class as the entry's own disease_term, which made the disease a subtype of itself and duplicated the identifier on export. Removed the redundant binding; the subtype is retained as a named clinical presentation so it and Hunter-Thompson can be referred to symmetrically, and its description now records why it carries no term. Separately, the isds_skeletal_category evidence quoted an enumeration of the acromesomelic types that names diseases and OMIM numbers without mentioning the nosology, so the snippet did not actually support the group assignment. Added the preceding sentence as its own evidence item, which is the one that attributes the enumeration to the 2023 revision.

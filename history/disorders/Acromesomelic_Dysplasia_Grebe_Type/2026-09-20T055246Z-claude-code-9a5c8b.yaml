  summary: 'Review round 1: grade the GDF5 background sentence with quote_role'
  details: |
    Review round 1 response on PR #12322 (issue #12190).

    Took the reviewer's optional suggestion on the GDF5 evidence quoting PMID:26275437.

    The quoted sentence - "Homozygous mutations in the mature domain of GDF5 result in severe
    limb malformations such as the Grebe type or the Hunter-Thompson type of acromesomelic
    chondrodysplasia" - sits in the later, discussion portion of an unstructured abstract
    whose own finding is a single p.Arg377Trp proband. The citing paper is restating
    established knowledge there, so the item now carries quote_role: BACKGROUND.

    evidence_source stays HUMAN_CLINICAL: the quoted text describes a human
    genotype-phenotype rule, and quote_role records only that this paper is not where it came
    from. This is the pattern CLAUDE.md sets out for a background sentence in a paper that
    ran something else.

    Applied to both occurrences of the sentence in this file, not only the one the review
    flagged. It is the same sentence from the same place in the same document, so grading the
    two differently would be the defect the snippet-grading gate exists to catch.

  summary: 'Create: TUBGCP4-related Microcephaly and Chorioretinopathy (MCCRP3)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified; just validate and just validate-terms pass.

    A gamma-tubulin COMPLEX disorder rather than a tubulin-isotype disorder: biallelic TUBGCP4 loss of function reduces the level of the gamma-TuRC that nucleates microtubules. Patient fibroblasts show reduced gamma-TuRC, altered nucleation, abnormal nuclear shape and aneuploidy - a division phenotype, not the post-mitotic motility phenotype of the cortical-malformation tubulinopathies - and zebrafish morphants reproduce both the reduced head volume and the chorioretinal dysplasia.

    functional_impact_category is LOSS_OF_FUNCTION and, unusually for this family, is not inferred: the alleles are frameshifts, a deletion and a synonymous variant shown to induce exon skipping.

    Deliberately NOT a Tubulinopathies grouping member. The grouping's notes record TUBGCP genes as out of scope - complex proteins, not isotypes - and the disorder does not conform to the migration module. Curated as a pair with TUBGCP6-related MCCRP1.

  summary: Review and evidence-calibrate TUBGCP4-related MCCRP3
  details: |
    Reviewed the existing entry against its complete effective history (one CREATE
    record and no prior REVIEW), all three pre-existing cached abstracts, ontology
    mappings, graph structure, and current literature/registry context. The review
    changed the entry; it did not create a new disease identity.

    Changed sections:

    - description, pathophysiology, and evidence: retained the direct founding-study
      observations (reduced gamma-TuRC, altered microtubule nucleation/organization,
      abnormal nuclear shape and aneuploidy in patient fibroblasts; reduced head
      volume and ocular abnormalities in morpholino-treated zebrafish) but split the
      bundled chain into atomic nodes. The patient-cell observations are ESTABLISHED;
      the bridge to human brain and retinal development is HYPOTHETICAL and uses
      INDIRECT_UNKNOWN_INTERMEDIATES. The source describes altered, not necessarily
      decreased, microtubule nucleation, so that process is DYSREGULATED.
    - references and progression: added PMID:33137195 as abstract-only evidence. One
      TUBGCP4 proband in PMID:37038737 was clinically stable for two decades. The
      separate PMID:33137195 natural-history cohort combined KIF11, TUBGCP4, and
      TUBGCP6 and contained only one TUBGCP4 participant; its progression conclusion
      is retained only as explicitly mixed-cohort surveillance context. No pooled
      fraction or TUBGCP4-specific progression rate is inferred.
    - inheritance and genetic: kept autosomal recessive, biallelic/in-trans human
      evidence and calibrated the loss-of-function context to the directly reported
      truncating, deletion, and splice-altering alleles. Later nonsense-allele and
      in-trans observations now have source-local evidence.
    - phenotypes: retained microcephaly and chorioretinopathy as core features and
      added source-local, case-bounded reduced visual acuity (HP:0007663),
      microphthalmia (HP:0000568), neurodevelopmental delay (HP:0012758), nystagmus
      (HP:0000639), and abnormal facial shape (HP:0001999). Human
      chorioretinopathy is conservatively bound to HP:0000532 (Abnormal
      chorioretinal morphology); exact chorioretinal dysplasia wording belongs to
      the zebrafish observation, not the human snippets. No phenotype frequency is
      inferred from the small, phenotype-ascertained reports.
    - diagnosis: replaced unsupported diagnostic extrapolations with the actual
      workflows: founding-family exome sequencing and later, separate segregation
      analysis. The splice statement is confined to the recurrent synonymous allele
      experimentally shown to induce exon skipping. Ophthalmic examination,
      imaging, electroretinography, and visual fields are described as methods used
      in the mixed-gene cohort, not as TUBGCP4-specific diagnostic-accuracy results.
    - animal_models: added the zebrafish morpholino model with its directly observed
      head and eye findings and explicit transient-knockdown/patient-variant limits.
    - treatments and notes: removed unsupported supportive-care, no-disease-
      modifying-therapy, low-vision-management, 25 percent recurrence-risk, and
      carrier-testing claims. Removed reliance on an absent report path and rewrote
      grouping/mechanism notes to distinguish observations from hypotheses.

    Considered but deliberately not added:

    - Reduced visual acuity, microphthalmia, neurodevelopmental delay, nystagmus,
      and abnormal facial shape remain intentionally outside the causal pathograph.
      They are case-level observations without a sourced directional mechanistic
      bridge. The resulting phenotype connectivity is intentionally 2/7; scientific
      restraint takes priority over raising the metric.
    - PMID:41565369 (a recent secondary review) and PMID:37568951 (an additional case
      article) were identified read-only but deferred after no essential unresolved
      gap required them. No cache was fetched for either. The entry makes no positive
      no-trial, no-dataset, treatment-outcome, or population-prevalence claim.
    - N-of-one additional findings such as Tetralogy of Fallot, obesity, acanthosis,
      scoliosis, and hypercholesterolemia were not promoted to syndrome features.

    PMID:33137195 cache provenance:

    - A separate pre-fetch gate pinned authoritative main at
      145d8af1dd648fdf88f3798881771c42c9c1bea2 across fetch, origin/main,
      ls-remote, and the GitHub API. Stable OPEN snapshots contained 226 PRs on
      explicit pages 100/100/26/0, with no immutable tuple drift after PR #9399 was
      rescanned at its rebased base/head pair.
    - Every PR files endpoint was explicitly paged through an empty page; filename
      and previous_filename produced zero exact or case-folded hits for
      references_cache/PMID_33137195.md. Declared file counts reconciled except the
      known REST caps: PR #7922 returned 3,000 versus 7,728 declared and exact pinned
      Git diff; PR #9240 returned 3,000 with an anomalous zero declaration versus
      4,384 in the exact pinned Git diff. Both immutable Git fallbacks had zero
      target hits. The initial REST scan contained 12,994 file records; rebased
      PR #9399 was separately rescanned through empty and reconciled 29/29.
    - Only after literal CLEAR, `just fetch-reference PMID:33137195` generated
      references_cache/PMID_33137195.md. The publisher DOI returned HTTP 403, so the
      validator cached the PubMed abstract successfully as content_type
      abstract_only. The generated cache was never hand-edited.

    Validation and frozen content:

    - `just validate` passed schema, term, reference, and cache normalization checks;
      32/32 evidence snippets matched cached source text. Duplicate-key,
      snippet-boundary, source-defect, empty-snippet, snippet-length, title-snippet,
      folded-hyphen, cache-frontmatter, and diff checks passed. The causal graph is
      valid, causal-gene wiring is 1/1, and the intentional phenotype connectivity is
      2/7.
    - The initial independent content audit blocked three overly specific claims:
      human chorioretinal dysplasia, global developmental delay, and collapsed
      targeted-testing/segregation plus plural synonymous-variant wording. All three
      were repaired exactly. The read-only re-audit returned APPROVE with stable
      pre/post hashes.
    - Approved content SHA-256 values are
      263ef063004fec1abed1bb26c40df36992b4cfc7c2c97043621ef9c0b1c343cc for the
      disorder YAML and
      7ed2c567c74ddee5d82981f75293ac8830a6e14a489792b8130d77ec565c1033 for the
      generated PMID:33137195 cache.

    Publication remains pending: links.prs is deliberately empty, and this history

  summary: Add guideline-derived maternal PKU management and reinforce therapies
  details: |
    Mined the phenylketonuria clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2). The entry already had diet, medical formula, sapropterin, pegvaliase, and LNAA; the guidelines uniquely add maternal PKU management. Added 1 treatment: Maternal PKU Management (MAXO:0000088; preconception blood-Phe control to prevent maternal-PKU embryopathy, PMID:37470789). Reinforced the Phenylalanine-Restricted Diet (European guidelines PMID:40378670 untreated-disease consequences; ACMG systematic review PMID:37470789 Phe<=360 target), Sapropterin (PMID:37470789 pharmacologic Phe-lowering enabling dietary liberalization), and Pegvaliase (PMID:37349772 unrestricted diet under maintained Phe control). All 6 new snippets snippet-verified as exact substrings of fetched abstracts. Schema (standalone linkml-validate) and term validation pass; new snippets manually verified. Note: the pre-edit Edit hook runs full reference validation which fails on PRE-EXISTING uncached structured sources (ORPHA:716, CGGV) and full-text-only PMIDs (30570999, 34082800) present on main and unrelated to this change; edits were applied via script and validated via schema+terms+manual-substring gates. This PR was rebuilt cleanly after a concurrent-agent worktree collision corrupted the original enrich-Phenylketonuria-guidelines branch (which had picked up unrelated Hemophilia B / Takayasu commits).

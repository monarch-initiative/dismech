  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn Screening for Hyperphenylalaninemia diagnosis row with diagnosis_term NCIT:C81178 (Newborn Screening, verified via OLS) and three LOINC measurements resolved from the Monarch KG: LOINC:29573-3 Phenylalanine [Moles/volume] in DBS, LOINC:35571-9 Tyrosine [Moles/volume] in DBS and LOINC:35572-7 Phenylalanine/Tyrosine [Molar ratio] in DBS. Reference ranges: Phe cut-off 120 umol/L and Phe/Tyr ratio cut-off 2.0 from the Zhejiang province programme 1999-2022 (PMID:38105685, verbatim: Phe>120 umol/L and/or Phe/Tyr ratio>2.0 were considered positive for HPA), with PMID:40136633 (23-country survey, cut-off set mostly at 120 umol/L) and PMID:36768810 (Slovenian programme, 120 umol/L fluorometric vs 85 umol/L MS/MS) as corroborating and method-dependence evidence. No tyrosine cut-off recorded because no cited source states one. Added loinc_term with the same DBS codes on the Blood Phenylalanine, Blood Tyrosine and Phenylalanine to Tyrosine Ratio biochemical markers. Validation: just validate, count-verified-snippets 225/225, validate-terms, loinc-seed-cache (all codes and labels match the KG), validate-disorders over the batch. Nothing else in the entry changed.

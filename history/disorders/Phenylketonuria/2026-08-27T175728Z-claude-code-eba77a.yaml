  summary: Cite the three dietary phenylalanine food-source exposures
  details: |
    Added evidence to Mammalian Meat Intake, Dairy Intake and Nut Intake. Meat and nuts cite PMID:42123950, which names both among the high-protein foods the recommended PKU diet avoids. Dairy cites PMID:36296952, a randomized crossover trial in which added phenylalanine from milk protein was tolerated by only half the children at 50 mg/day and under a third at 100 mg/day, which is a stronger design than an observational listing. Part of #8296.

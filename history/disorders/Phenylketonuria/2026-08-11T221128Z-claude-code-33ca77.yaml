  summary: Link dietary phenylalanine and aspartame to the hyperphenylalaninemia node
  details: |
    Backfill for issue #8085. Both exposures are TRIGGERS with DIRECT into the hyperphenylalaninemia node and are graded identically, because aspartame is not a separate mechanism but a specific instance of the same one: it is a phenylalanine-containing sweetener, so it adds to the same substrate load and reaches the node by the same route. It earns its own edge because the exposure is hidden in foods and drinks that a protein-restricted diet would not otherwise flag. The effect value deserves a note. The enzyme block is the disease, but dietary phenylalanine is the substrate without which the block produces nothing, so the exposure sets the value at this node rather than aggravating a state that exists without it; that is why these are triggering rather than exacerbating links. The evidence comes at the claim from the treatment side, which is the strongest design available here, since restricting the exposure holds blood phenylalanine inside a target range and therefore removing the exposure removes the node. Three further exposures, mammalian meat, dairy and nut intake, carry no evidence at all and so could not be linked; they are part of the gap recorded in issue #8296. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 207 of 214 with 7 pre-existing DOI-prefix skips, none on items added here.

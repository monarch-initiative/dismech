  summary: 'Create: Jeffries-Lakhani Neurodevelopmental Syndrome'
  details: |
    New entry for JELANS (MONDO:0958329), the autosomal recessive multisystem disorder caused by biallelic CRELD1 variants. entry_type DISEASE: the HECTD4 NEDSSACC entry names CRELD1 only as a co-listed gene in a gene-burden table, and the heterozygous CRELD1 AVSD susceptibility in Atrioventricular_Septal_Defect is kept distinct and noted in the entry. Curated from primary sources cached with fetch-reference: Jeffries et al. 2024 (PMID:37947183, full text; 18 patients, Xenopus knockdown and overexpression), Archer et al. 2025 (PMID:40870020), D'Alessandro et al. 2025 (PMID:40980404, C. elegans patient-equivalent knock-ins), Chundru et al. 2024 (PMID:39313616), the C. elegans AChR study (PMID:30407909), the Drosophila Creld mitochondria study (PMID:35867795), the Creld1 T cell mouse study (PMID:33169013) and the MedGen copy of the OMIM description. Deep research: one OpenScientist report. The first run timed out after 3600 s and was cancelled server-side; the single retry succeeded, with no fallback. Its 14 references all resolved; one quote attributed to PMID:37947183 was a paraphrase of that abstract and was not used. Its term-label mismatches were table-cell parsing artifacts, and preflight-dr flagged HGNC:14630 written beside EGF. The report overstated some points that were not adopted: it called the calcineurin-NFAT cardiac arm and a CMS-like neuromuscular picture experimentally supported, attributed infections to immune dysregulation despite normal patient PBMC subsets, offered HP:0011097 as early-onset epilepsy (it is Epileptic spasm) and HP:0001674 for septal defects (patients had ASD/VSD), and suggested pyridostigmine without evidence. Twelve of 21 phenotypes are wired into the pathograph; the variable dysmorphic, ocular, imaging, growth and septal features are left unwired because no mechanism is reported. Validated with just validate, count-verified-snippets (68/68), validate-terms, the per-file offline gates, the whole-repo CI gates, check-genereviews (no chapter) and validate-disorders.

  details: |
    New entry for MC5DN5 (MONDO:0020858, OMIM 618120), the recessive disorder of ATP5F1D (hgnc:837), the delta subunit of the complex V central stalk; gene-family gap fill, replacing stubs/Mitochondrial_Complex_V_ATP_Synthase_Deficiency_Nuclear_Type_5.yaml. Evidence: the founding report (PMID:29478781, abstract only because the PMC full-text request returned HTTP 429): two patients homozygous for p.Pro82Leu and p.Val106Gly with episodic lethargy, metabolic acidosis, hyperammonaemia and 3-methylglutaconic aciduria; impaired ATP synthase assembly and reduced complex V activity in fibroblasts; fewer cristae; Drosophila knockdown rescued by wild-type but only partly by the variants. Clinical detail (lactic acidosis, muscle weakness, mild developmental delay, rhabdomyolysis, transient dilated cardiomyopathy, ketoacidosis, exercise intolerance, onset ages) from the 2024 systematic review (PMID:39016153). relationship_type UNKNOWN: two patients; ClinGen rates ATP5F1D Limited (AR) only for the lumped mitochondrial disease term (MONDO:0044970). MONDO's exact synonym 'mitochondrial complex v (atp synthase) deficiency' is too broad and was not used. No GeneReviews chapter. Validation: linkml-validate, OLS term validation, reference validator (32 snippets, 0 issues), count-verified-snippets 32/32, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, list-gene-term-mismatches, check-genereviews and check-snippet-grading all passed.

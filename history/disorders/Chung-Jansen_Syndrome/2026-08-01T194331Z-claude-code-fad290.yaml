  summary: 'Create: Chung-Jansen Syndrome (PHIP, MONDO:0035133)'
  details: |
    New de-novo entry for Chung-Jansen syndrome / PHIP-related behavioral problems-intellectual disability-obesity-dysmorphic features syndrome, MONDO:0035133, gene PHIP hgnc:15673.

    NEC preflight PASSED. runoak on MONDO:0035133 returned relationship RO:0004003 HGNC:15673 PHIP, xref OMIM:617991, xref Orphanet:589905, and EXACT synonym 'Chung-Jansen syndrome'. The disorder was kept distinct from the obesity-plus-ID syndromes that dominate naive searches - Prader-Willi, Bardet-Biedl, Borjeson-Forssman-Lehmann, MC4R obesity - and from other BRD-family chromatinopathies such as BRPF1 and BRWD3. Prader-Willi, Cabezas/CUL4B, Cornelia de Lange, Borjeson-Forssman-Lehmann, White-Kernohan and Pitt-Hopkins are curated explicitly as differential diagnoses rather than conflated.

    Duplicate preflight: no existing kb entry, no PR, and no issue other than 7722 matched the MONDO ID, the eponym, PHIP, or the long descriptive label on origin/main.

    Deep research: Edison/Falcon via just research-disorder falcon Chung-Jansen_Syndrome, 515 s, report committed at research/Chung-Jansen_Syndrome-deep-research-falcon.md with citations sidecar and one markdown artifact. The report was read in full. It was NEC-clean but bibliographically thin - three primary sources plus one registry, no PMIDs supplied at all, and it entirely missed the chromatin-reader mechanism, the episignature, the natural-history cohort, and the CAKUT association. An independent PubMed E-utilities sweep supplied the rest. Useful leads taken from the DR report: the Simons Searchlight registry NCT01238250 and the POMC framing.

    Anti-hallucination discipline: every cited PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract - 118 of 118 snippets verified. Several specific figures that the DR report quoted from Marenne et al. full text but that are absent from the cached abstract - the burden-test odds ratio and p-value, the named dominant-negative variants, the nuclear-to-cytoplasmic ratio p-value, and the mouse Phip-null growth and survival data - were deliberately excluded from prose as well as from snippets, and that exclusion is recorded in the entry notes. Two cache files are full text rather than abstract-only; both were checked to be the correct paper and the quoted passages sit in each paper's own abstract.

    Mechanism modelling: curated as a chromatinopathy rather than a generic NDD. Ten pathophysiology nodes run PHIP loss-of-function to haploinsufficiency, then split into three arms. The canonical arm is the trivalent nucleosome reader module - Tudor reading H3K4 methylation with GO:0140002, BD1 reading H3K14ac with GO:0140015, BD2 reading H4K12ac with GO:0140011 - feeding failure of CRL4 substrate-receptor recruitment to chromatin with GO:0080008, which in turn feeds the patient-level DNA methylation episignature and the neurodevelopmental gene-expression program. The second arm is reduced nuclear PHIP with repressed POMC transcription in arcuate POMC neurons, CL:4042033 at UBERON:0001932, feeding impaired central melanocortin satiety signaling and obesity. The third arm is DCAF14 replication fork destabilization, left deliberately without a clinical downstream because the genome-instability consequence is an author prediction rather than a patient observation. A fourth, separate arm covers PHIP-dependent kidney and urinary tract development feeding CAKUT. Three mechanistic_hypotheses groups tag the arms and the causal edges opt into them.

    Also curated: 24 phenotypes with frequency bands derived from cohort denominators, structured prevalence as CASES_IN_LITERATURE / ULTRA_RARE, a genetic block noting the absence of a mutational hotspot and the reported PHIP plus CLCN4 dual diagnosis, four diagnostic modalities including episignature testing and polysomnography, seven treatments each with an explicit action_category, six differential diagnoses, and four discussions - one HUMAN_MODEL_MISMATCH on the cell-context limitation of the POMC result and three KNOWLEDGE_GAP entries.

    Deliberate omissions: no ORPHA prevalence row, because the Orphadata refresh fails a manifest checksum in this repository, so only a qualitative band is recorded. No GeneReviews baseline, because no GeneReviews chapter exists for this disorder or gene - both PubMed searches returned zero. No ClinGen dosage record, because none is cached locally.

    Pre-PR self review: a red-team pass was run against the dismech-pr-review skill before opening the PR, focused on what the validators cannot check - free-text prose, snippet-to-claim fit, frequency bands, evidence_source, and graph connectivity. It found and this session fixed: an unsourced dominant-negative claim that had leaked from DR full-text into prose despite the entry's own exclusion note; two frequency bands attached to the wrong granularity of HPO term, where an aggregate cohort denominator was bound to a specific component term (behavioral abnormality 20/23 bound to Aggressive behavior, and craniofacial gestalt 23/23 bound to Macrotia) - both rebound to aggregate terms with the component features given their true, much lower per-feature rates from the same cached full text; an orphan CAKUT pathophysiology node with no incoming edge, now connected to PHIP Haploinsufficiency; a backwards target_mechanisms edge (dietary intervention INHIBITS the already-impaired satiety signal), retargeted to the weight node; an overstated ESTABLISHED confidence on the reader-impairment node, demoted to PROVISIONAL because the source says patient alleles likely rather than demonstrably disrupt binding; a node name asserting the unverifiable nuclear-to-cytoplasmic result, renamed to Repressed POMC Transcription; a methods sentence used where the result sentence was available; an ovarian-morphology term bound to a report that documents only a menstrual finding, rebound to Oligomenorrhea; an IN_VITRO tag on a human burden-test claim; an unverifiable trial recruitment status; and the word interchangeable applied to CRL4 substrate receptors, which the source does not say. Six research-backed phenotypes with quotable evidence already in this PR's cache were added in response: seizures, brachydactyly, clinodactyly of the fifth finger, 2-3 toe syndactyly, gastroesophageal reflux, and feeding difficulties, plus an amblyopia breakdown on visual impairment and a separately banded aggression entry.

    Validation: just validate, just validate-terms and just validate-references all pass; 133 of 133 snippets verified against cached references. pytest tests/test_data.py passes except the single pre-existing SETD5_Haploinsufficiency_Syndrome failure tracked as issue 7729, which was left untouched. The cache CSV diff was rebuilt by hand to be purely additive - 21 insertions, zero deletions - rather than committing the tooling's whole-file re-sort, and the roughly 7600 files of pre-existing references_cache churn produced by the validators were reverted.

  summary: 'Create: ACTB-Related_Syndromic_Thrombocytopenia'
  details: |
    New entry for MONDO:0100433 (OMIM 620475), the ACTB 3' coding region (exons 5 and 6) disorder defined by Latham et al. 2018 (PMID:30315159, cached full text). Named ACTB-Related Syndromic Thrombocytopenia, the ClinGen-preferred exact MONDO synonym; the MONDO label, ACTB-AST and the OMIM title are synonyms. The file was renamed from the skeleton's ACTB-Associated slug; the deep-research report keeps its original filename.

    Pathophysiology: germline 3' variant, then impaired polymerization and profilin binding (PMID:35313204, PMID:10411937; with a REFUTE item from PMID:41529692 for near-normal p.Glu364Lys dynamics), reduced beta-actin to gamma-actin ratio, recruitment of NM-2A, alpha-actinin 1 and filamin A to beta-actin filaments, disordered microtubule marginal band in proplatelets and platelets, and impaired terminal platelet maturation leading to thrombocytopenia, enlarged platelets and platelet anisocytosis. A separate neutrophil node records the single p.Glu364Lys patient. Phenotypes come from the founding cohort, the 1999 case and one bone marrow failure cohort patient (PMID:35572556); renal anomalies were not found in these sources and are not recorded. Microcephaly frequency (5 of 6) is the only frequency given.

    ClinGen: Moderate, AD, Hemostasis/Thrombosis GCEP; copied from the CGGV record into gene_disease_validity. GeneReviews: no chapter for this disorder; check-genereviews --online offered only the BWCFF chapter, which is the differential, recorded in notes. Differentials: BWCFF (KB entry exists) and the ACTB loss-of-function disorder. An OPEN_QUESTION discussion records the 2026 proposal (PMID:41529692) to merge this disorder with the ACTB pLoF disorder; the entry follows the ClinGen and MONDO scope.

    Deep research: one OpenScientist report (research/ACTB-Associated_Syndromic_Thrombocytopenia-deep-research-openscientist.md). Reference validation: 20 of 20 references resolved, none unresolved. Term validation: 21 of 22 resolved, none unresolved; its four mislabelled rows (MONDO:0100433, HP:0001873, HP:0000252, HP:0001999) are table header words read as labels, not real mislabels; it suggests HP:0011877 for platelet anisocytosis, which is Increased mean platelet volume, so HP:0032438 is bound instead. The report also describes all variants as de novo missense, which the founding paper contradicts (two inherited, two frameshifts, one in-frame deletion); and its treatment suggestions are by analogy, so no treatments were added. preflight-dr gave WARN only because it counted the disease abbreviation ACTB-AST as a second gene.

    relationship_type is left unset: ClinGen rates the pair Moderate and the schema ties CAUSATIVE to Definitive or
    Strong; the Moderate tier is recorded in gene_disease_validity (monarch-initiative/dismech#16102).

    Checked: just validate, count-verified-snippets (all verified), validate-terms, the whole-repo offline gates, and validate-disorders.

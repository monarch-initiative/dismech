  summary: 'Create: Subcutaneous Panniculitis-like T-cell Lymphoma'
  details: |
    De novo curation of SPTCL (MONDO:0019475) from stubs/Subcutaneous_Panniculitis-like_T-cell_Lymphoma.yaml. Deep research was run with the claude_code provider; just preflight-dr returned PASS against MONDO:0019475 (HAVCR2 mentioned 43 times, and the report's OMIM 618398 matches MONDO's). Two ontology CURIEs suggested by the report were wrong and were replaced after checking the ontologies directly: HP:0031477 for Subcutaneous nodule is an obsolete mitral valve term, correct term HP:0001482; HP:0005517 for Hemophagocytosis is actually T-cell lymphoma/leukemia, correct term HP:0012156. Mechanism is modelled as a five-node chain from germline TIM-3 loss of function through unrestrained innate activation to both the clonal cytotoxic T-cell expansion with adipocyte rimming and the systemic hemophagocytic syndrome. Two knowledge gaps are recorded: whether HAVCR2-mutant disease is neoplastic at all, given the ruxolitinib responses and a reported pair of clonally unrelated episodes; and what drives the HAVCR2 wild-type half of an unselected cohort. Validated with just validate (57/57 snippets verified), just validate-terms (passed), check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, and the batched just validate-disorders. After the first CI run, the branch was rebased onto main to pick up #10003, which retired supports: PARTIAL; the four PARTIAL evidence items were migrated to supports: SUPPORT with an explicit directness value (DIRECT for three, INDIRECT for the radiotherapy item whose only available quote is a methods sentence rather than a result).

  summary: 'Review follow-up: directness on inference-step evidence; Table 1 misalignment
    caution'
  details: |
    Delivers the two suggestions accepted in review on PR #11175 but deliberately not pushed onto its approved head. (1) Marked directness: INDIRECT on four evidence items whose quoted text reaches its claim through an inference step rather than asserting it: the two causal edges from the vitamin E node to Ataxia and to Myopathy, both of which quote GeneReviews' umbrella phrase 'neuromuscular abnormalities ... secondary to vitamin E deficiency' and rely on the inference that ataxia and myopathy are among the abnormalities it covers; the Ataxia phenotype's GeneReviews management sentence, which is a statement about treatment rather than about the phenotype; and the paediatric-cohort 0% row at the Reduced left ventricular ejection fraction phenotype, which reports absence in childhood and supports a very-rare adult band only in combination with the GeneReviews adult report. Each item's explanation was rewritten to state the inference step rather than merely gaining a slot. (2) Added a review_notes caution about Table 1 of PMID:20920215, whose 'Retinopathy' row reads 'Adult permanent 100% +++' - putting 100% in the 'Prevalence in childhood' column against an adult age at onset, where the same paper's Table 2 says there is no retinopathy in childhood and every other adult-onset row in that column reads 0%. No phenotype in this entry is banded from that row. The point of recording it is that every snippet from this reference verifies as an exact substring, so no gate can catch a figure read against the wrong header. No claim, band, or ontology binding changed. Corrected in the same PR after review: the first version of this note diagnosed the inconsistency as a PDF extraction failure, claiming that rows whose age-at-onset cell wraps across two lines push shorter rows out of alignment with the headers. That is false, and checking the cached text settles it - every row carries its five cells in header order and a wrapped cell never displaces a neighbouring row, so the 100% sits under the childhood header as the authors printed it. The defect is the paper's, not our cache's. The wrong diagnosis also undercut this PR's own new explanation on the reduced-ejection-fraction phenotype, which reads the same-shaped 'Cardiomyopathy/Biological signs Adult permanent? 0%' row as a childhood figure and needs the alignment to be sound. Same defect class as issue #11456: prose asserting something about a source that the source itself contradicts.

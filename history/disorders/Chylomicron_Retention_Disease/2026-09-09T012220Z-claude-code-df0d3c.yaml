  details: |
    Delivers the two suggestions accepted in review on PR #11175 but deliberately not pushed onto its approved head. (1) Marked directness: INDIRECT on four evidence items whose quoted text reaches its claim through an inference step rather than asserting it: the two causal edges from the vitamin E node to Ataxia and to Myopathy, both of which quote GeneReviews' umbrella phrase 'neuromuscular abnormalities ... secondary to vitamin E deficiency' and rely on the inference that ataxia and myopathy are among the abnormalities it covers; the Ataxia phenotype's GeneReviews management sentence, which is a statement about treatment rather than about the phenotype; and the paediatric-cohort 0% row at the Reduced left ventricular ejection fraction phenotype, which reports absence in childhood and supports a very-rare adult band only in combination with the GeneReviews adult report. Each item's explanation was rewritten to state the inference step rather than merely gaining a slot. (2) Added a review_notes caution that Table 1 of PMID:20920215 does not extract cleanly: rows whose 'Age at onset' cell wraps across two lines throw the shorter rows out of alignment with the column headers, so 'Retinopathy Adult permanent 100% +++' sits under a 'Prevalence in childhood' header while the same paper's Table 2 says there is no retinopathy in childhood. No phenotype in this entry is banded from that row. The point of recording it is that every snippet from this reference verifies as an exact substring, so no gate can catch a figure read against the wrong header. No claim, band, or ontology binding changed.

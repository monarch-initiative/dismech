  details: |
    Created kb/disorders/Chylomicron_Retention_Disease.yaml (SAR1B, MONDO:0009528) from scratch. 2551+ lines, 194 evidence snippets, all verified against references_cache. Closes the claim on issue #11088; stubs/Chylomicron_Retention_Disease.yaml deleted.

    DEEP RESEARCH THAT ACTUALLY RAN. Two providers. Edison/falcon (`just research-disorder falcon Chylomicron_Retention_Disease`, 641 s) produced research/Chylomicron_Retention_Disease-deep-research-falcon.md plus one artifact; its own reference validation resolved 11/11 citations with 0 unresolved and 1/1 quoted claims found, and `just preflight-dr ... MONDO:0009528` returned PASS (SAR1B mentioned 44 times, OMIM 246700 matching MONDO). Its term_validation reports needs_review: true, but the single "mislabelled" term is MONDO:0009528 being called "if available" -- that is the template's own "MONDO ID: MONDO:0009528 (if available)" placeholder being scraped, not a wrong binding. Asta also ran (3.6 s) and produced research/Chylomicron_Retention_Disease-deep-research-asta.md; it is retrieval-only and returned mostly off-topic papers (goat pregnancy toxaemia, diabetic nephropathy, renal cell carcinoma). `just preflight-dr` on it returned WARN: SAR1B mentioned twice against APOBEC1 six times. I used exactly two papers from it -- the Levy 2024 review (PMID:39062121) and Levy 2021 (PMID:33584351, read but ultimately not cited) -- and no claim in the entry rests on Asta alone. Neither report's suggested identifiers were cited without independently fetching the record.

    GENEREVIEWS BASELINE. A chapter exists: PMID:35344313 "Chylomicron Retention Disease" (Burnett, Hooper, Hegele), fetched, cached, and tagged `GeneReviews` in the top-level references block. Every Clinical Characteristics item in its abstract is represented in the entry: failure to thrive, diarrhoea, vomiting, abdominal distention, fat malabsorption, steatorrhoea, hepatomegaly, vitamin-E-secondary neuromuscular abnormalities, poor bone mineralisation and delayed bone maturation, prolonged INR, the ophthalmological cluster (micronystagmus, delayed dark adaptation, abnormal scotopic ERG), adult cardiomyopathy with decreased ejection fraction, marked hypocholesterolaemia, low apoB, normal-to-low triglycerides, low fat-soluble vitamins, and the gelee blanche duodenal mucosa. Abnormal visual evoked potentials were the one listed finding not given its own phenotype row; the quoted sentence naming them is carried on the Abnormal electroretinogram and Nystagmus rows instead. The Agents/Circumstances to Avoid section (fatty foods rich in long-chain fatty acids) and the pregnancy caveat (halve vitamin A) are both curated onto the relevant treatments with the GeneReviews quote.

    MECHANISM MODEL. The pathophysiology is a connected chain of 11 nodes, all biological_scale tagged, with bare-name downstream targets. Spine: SAR1B Loss of Function (MOLECULAR) -> Defective COPII Coat Assembly at Endoplasmic Reticulum Exit Sites (MOLECULAR) -> Failed Pre-Chylomicron Transport Vesicle Export from the Endoplasmic Reticulum (CELLULAR) -> Enterocyte Chylomicron Retention (CELLULAR) -> {Absent Postprandial Chylomicronemia, Intestinal Fat Malabsorption} (both ORGANISM) -> {Fat-Soluble Vitamin Deficiency, Essential Fatty Acid Deficiency} -> Vitamin E-Dependent Neuroaxonal and Retinal Injury (TISSUE) -> the neurological and ophthalmological phenotypes. Two branches leave the spine at the top: Impaired Intestinal HDL Biogenesis and Cholesterol Efflux (the ABCA1 route to the low HDL, which cannot be derived from a pure chylomicron-export block) and Impaired Hepatic ApoB Lipoprotein Secretion (the proposed route to hepatic steatosis in a disease whose primary lesion is intestinal). A third branch, Enterocyte Lipid Peroxidation and Endoplasmic Reticulum Stress, hangs off the retention node.

    MODELLING JUDGEMENT CALLS A REVIEWER SHOULD CHECK.
    (1) No conforms_to. I read the three plausible modules. enterocyte_polarity_trafficking_failure scopes itself explicitly to the CODE class in which villus architecture is lost and diarrhoea does not remit on dietary elimination; CRD has normal villi and diet-responsive diarrhoea, so conforming would assert the opposite of the evidence. hepatic_steatosis_lipotoxicity asserts progression through steatohepatitis to fibrosis, and the CRD guideline review states no cases of steatohepatitis cirrhosis. diet_induced_osmotic_diarrhea is about a lost brush-border digestive/transport step, not a secretion step. A COPII / ER-export trafficking module would be the natural target and does not exist; I did not create one, since that is a separate piece of work. Recorded in the entry's notes.
    (2) Two nodes carry mechanism_confidence: PROVISIONAL -- the hepatic branch and the oxidative/ER-stress branch. Both are supported by review and cell/animal work and neither has been shown to drive a human complication. The edge into the stress node is typed INDIRECT_UNKNOWN_INTERMEDIATES for the same reason.
    (3) PMID:33002559 (Sar1b knockdown impairs cortical neuron migration; the paper states the action is "unrelated to lipid absorption from the gut") is recorded as an animal model with NO modeled_mechanisms link, deliberately. Linking it would assert a cell-autonomous neural mechanism in human CRD that no patient study supports, competing with the well-evidenced vitamin E pathway. The reasoning is in that model's notes.
    (4) Cardiomyopathy is banded VERY_RARE on the GeneReviews "small proportion of adults" wording, not on the Peretti cohort figure, which is 0% -- the cohort is paediatric. Both quotes are curated so the tension is visible.
    (5) One causal edge is deliberately left uncited: Essential Fatty Acid Deficiency -> Failure to thrive. No source makes that specific causal claim; the sources make the disease-level claim. It is the only item costing compliance points and I preferred an honest gap to a stretched citation.
    (6) No allele-based has_subtypes, because the largest series states the absence of phenotype-genotype correlation.
    (7) SAR1A is curated in the genetic block with relationship_type MODIFIER and an explicit note that it is not a disease gene. It is there because the failure of paralogue compensation is what explains both the patient biopsy data and why only a SAR1A/SAR1B double knockout abolishes chylomicron output in Caco-2 cells.

    SIBLING DIFFERENTIATION. Cross-referenced but not merged with kb/disorders/Abetalipoproteinemia.yaml and kb/disorders/Hypobetalipoproteinemia.yaml, both as differential_diagnoses entries with distinguishing_features and as prose in the top-level notes. The discriminator carried throughout is the normal fasting triglyceride plus detectable LDL/apoB-100 (hepatic secretion preserved), against the very low triglyceride of MTTP- and biallelic-APOB-related disease; absence of acanthocytosis is curated as a biochemical finding with the cohort figure. Abetalipoproteinemia already carries CRD as a differential, so the pair is now reciprocal.

    REFERENCES REJECTED OR NOT USED. PMID:39332967 (An Pediatr, "Chylomicron retention disease: A condition to keep in mind") and PMID:22959141 (Dig Liver Dis) both cache with an empty abstract, so no snippet could be taken; neither is cited. PMID:33584351 (Levy 2021) and PMID:31970693 (Lu & Kim, COPII mutations in vertebrates) were read and are on topic but every claim they support was better served by a more specific source, so neither is cited. Orphanet could not be used at all: `just fetch-reference ORPHA:71` has no fetcher and `just structured-rebuild-orphanet` needs data/orphadata/en_product1.xml, which is gitignored and absent from this checkout; downloading it was out of scope on a shared disk-constrained machine. That is why the prevalence record cites PubMed sources rather than an ORPHA epidemiology row.

    FULL-TEXT SNIPPETS. A number of frequency and lipid-panel snippets are quoted from the cached full text of PMID:20920215 (the two-centre cohort's Table 1) rather than from its abstract, and one prevalence snippet from the cached full text of PMID:21235735. I tested this deliberately before relying on it: the reference validator matches against the whole cached record, and `just validate` (which runs the same validator as `validate-disorders` minus --no-full-text) verifies all 194. Whitespace is normalised across the PDF's line wraps, so I avoided every span that crosses a hyphenated line break.


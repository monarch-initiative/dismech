  summary: 'Address PR #8412 review: evidence-matched life-cycle claims, paratenic
    host, taxon rebinding'
  details: |
    PR #8412 review round, closed out by the PR shepherd. The two blocking items had
    already been fixed in commit 9b9e47d03c (2026-08-30); this session merged main to
    clear a conflict and took the three review suggestions that were still open.

    BLOCKING 1 (claim-evidence mismatch on the copepod stage). Already fixed. The stage
    no longer claims that copepods "support development into infective larvae" — the
    description now says copepods are the transmitting vectors that carry the parasite
    to the next host, and states explicitly that intra-copepod maturation is the
    textbook account but is not asserted here because no cached reference states it at
    abstract level. The explanation matches the snippet, which speaks only of
    transmitting vectors.

    BLOCKING 2 (paratenic host in prose but not modeled). Already fixed. A fourth host
    entry with role: paratenic host is present, bound to NCBITaxon:7898 Actinopterygii
    with a note that the "other aquatic animals" clause of the source is broader than
    any single accurate taxon and is therefore carried in prose rather than by a second
    invented binding.

    SUGGESTION (Cyclopoida over Copepoda). Taken. The intermediate host was bound to
    NCBITaxon:6830 Copepoda, a subclass, while preferred_term said "Cyclops copepod"
    and the source says "Cyclops copepods (water fleas)". Rebound to NCBITaxon:84308
    Cyclopoida, verified against OLS as a current, non-obsolete term with that exact
    label. The genera that carry D. medinensis — Cyclops, Mesocyclops, Thermocyclops —
    all sit in this order, so the order-level term is the most specific one that
    remains accurate. The reason is recorded on the host entry, and the vectors list
    was updated to match.

    SUGGESTION (evidence_source on the Kim 2016 items). Taken, and extended past the
    one item the review named. PMID:27162746 is a narrative review — its own abstract
    says "This paper reviews the pathogenesis, epidemiology, clinical criteria,
    diagnostic criteria, treatment, and prevention of dracunculiasis" — so
    HUMAN_CLINICAL, the implicit default when the slot is absent, was wrong for it.
    Because evidence_source classifies the cited publication and not the claim, the
    same publication cannot carry two grades in one file; all four items citing it
    were set to OTHER, not just the newly added stage evidence. Two of those four are
    pre-existing content, deliberately touched for that consistency reason. This also
    keeps the duplicated Cyclops-copepod sentence, which backs both the life-cycle
    stage and the "Larval transmission by copepods" pathophysiology node, graded
    identically in both places, as check-snippet-grading requires.

    Merge conflict. Only cache/ncbitaxon/terms.csv and its organismterm enum cache
    conflicted, in both cases because this branch and main had appended non-overlapping
    rows at the same offset. Resolved as the union of both sides in canonical order and
    re-derived with the repository's normalizer; no row was hand-written.

    NOT taken. Cats and baboons as additional animal hosts, and a human-phase
    life_cycle_stages node, were left alone: both are real gaps but need abstract-level
    sources this session did not have on hand, and neither was blocking. OPL:0000082
    was kept for the stage term — the review confirmed via OAK that OPL has no nematode
    larval-stage term, so the alternatives are this broad term or none, and the broad
    term plus an explicit prose caveat is the more informative of the two.

    Validation. just validate (schema, terms, references) passes; snippet verification
    unchanged at 26/30 with 4 skipped by prefix. check-enum-values, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-grading,
    check-term-cache-integrity and check-cache-order all pass.

  summary: Added Harrison's chapter and mitochondrial mechanistic classifications, moved GO:0005739 from
    locations to cellular_components and added UBERON locations, grounded all phenotypes to HPO terms,
    fixed a 5-word snippet, and added diagnosis and treatments sections.
  details: 1. Added `classifications.harrisons_chapter` (`ENDOCRINOLOGY_METABOLISM`, `GENETICS_ENVIRONMENT_DISEASE`)
    and `classifications.mechanistic_category` (`mitochondrial disease`) with literature evidence. 2.
    Moved `GO:0005739` (`mitochondrion`) from `locations` to `cellular_components` across all three pathophysiology
    nodes, added UBERON `locations` (`UBERON:0000955` brain, `UBERON:0002107` liver), `biological_scale`,
    and `biological_processes` (`GO:0044394` protein malonylation, `GO:0006119` oxidative phosphorylation),
    and linked `Mitochondrial metabolic inefficiency` downstream to specific HPO-grounded phenotypes.
    3. Replaced ungrounded umbrella phenotypes with HPO-bound phenotypes (`Combined malonic and methylmalonic
    aciduria` `HP:0001992`, `Ketoacidosis` `HP:0001993`, `Hypoglycemia` `HP:0001943`, `Microcephaly` `HP:0000252`,
    `Dystonia` `HP:0001332`, `Axial hypotonia` `HP:0008936`, `Memory impairment` `HP:0002354`) and expanded
    the 5-word snippet from PMID:30740739 to the full 17-word verbatim sentence. 4. Added `association`,
    `variant_origin`, and `inheritance` to `genetic`. 5. Added `diagnosis` (`Organic Acid Analysis in
    Urine and Plasma` and `ACSF3 Molecular Genetic Testing`) and `treatments` (`Clinical Monitoring and
    Conservative Management`).

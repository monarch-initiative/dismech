  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding propionylcarnitine C3 (LOINC:53160-8), the C3/C2 ratio (LOINC:53163-2) and second-tier 2-methylcitrate in DBS (LOINC:82386-4). The row states that the C3 screen is shared with the methylmalonic acidemias and cobalamin disorders (PMID:27216769, Ontario). Reference ranges: C3 above 5.73 umol/L and C3/C2 above 0.23 from the Serbian healthy-newborn study (PMID:35254746), recorded with population and notes saying these are proposed cut-offs for a programme not yet screening, because no operating programme's absolute C3 value was found in a PubMed abstract (search named in notes); second-tier 2-methylcitric acid 1.0 umol/L from Newborn Screening Ontario (PMID:27216769) and 0.70 umol/L from the Zhejiang LC-MS/MS second tier (PMID:32615850). The C3/C16 ratio was not bound. loinc_term Parts added on the Propionylcarnitine (C3) marker (LOINC:LP19303-4) and the 2-Methylcitric acid marker (LOINC:LP18136-9). Same validation and cache seeding as the rest of the batch.

  summary: 'Addressed compliance and review items for Keratoderma Hereditarium Mutilans: removed deprecated
    percentage field from prevalence, standardized evidence_source OTHER across all citations of StatPearls
    review PMID:30335335, expanded short and fragment snippets, wired GJB2 (hgnc:4284) and LOR (hgnc:6663)
    with molecular functions into pathophysiology trigger nodes, connected pathophysiology nodes to all
    cutaneous and auditory phenotypes, and added progression and differential_diagnoses blocks.'
  details: Removed deprecated free-text percentage field from prevalence while retaining CASES_IN_LITERATURE
    and ULTRA_RARE. Added evidence_source OTHER to all previously ungraded citations of PMID:30335335
    (StatPearls review) to resolve check_snippet_grading inconsistency, and expanded sub-5-word and truncated
    snippets from PMID:10369869 and PMID:9326398 to full verbatim sentences. Linked GJB2 (hgnc:4284, GO:0005243
    gap junction channel activity) to Gap Junction Dysfunction and LOR (hgnc:6663, GO:0030280 structural
    constituent of skin epidermis) to Mutant Loricrin Nuclear Accumulation, and wired downstream edges
    to Palmoplantar Keratoderma, Honeycomb Palmoplantar Hyperkeratosis, Starfish-Shaped Hyperkeratoses,
    Knuckle Pads, Ichthyosis, Pseudoainhum, and Sensorineural Hearing Loss. Added progression (Infantile
    onset, HP:0003593) and differential_diagnoses (Bart-Pumphrey syndrome MONDO:0007866, mal de Meleda
    MONDO:0009552, and Olmsted syndrome MONDO:0031421).

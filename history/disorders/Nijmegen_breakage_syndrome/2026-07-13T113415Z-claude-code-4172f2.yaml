  details: |
    Added three hallmark phenotypes from PMID:22373003 (Chrzanowska et al. 2012, Orphanet J Rare Dis)
    that were missing from the entry, as required by issue #6307 sub-task for Nijmegen breakage syndrome:

    1. Increased sensitivity to ionizing radiation (HP:0011133) — "radiosensitivity are other integral
       manifestations of the syndrome". Category: Laboratory.
    2. Spontaneous chromosomal breakage with 7;14 rearrangements (HP:0040012) — "spontaneous
       chromosomal breakage in peripheral T lymphocytes with rearrangements preferentially involving
       chromosomes 7 and 14". Category: Laboratory. This is the cytogenetic hallmark used in
       differential diagnosis from Fanconi anemia.
    3. Hypergonadotropic hypogonadism (HP:0000815, females) — "in females, hypergonadotropic
       hypogonadism" from the principal-manifestations sentence. Category: Endocrine.

    All three snippets are exact substrings of the cached PMID:22373003 abstract. Schema validation,
    term validation (HP IDs verified with OAK), and reference validation all pass.

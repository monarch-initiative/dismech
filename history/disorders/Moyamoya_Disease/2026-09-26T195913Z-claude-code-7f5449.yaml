  summary: 'Genetics pass: gene-defined subtypes, NO pathway and ANO1 mechanisms,
    gene wiring'
  details: |
    Genetics pass on Moyamoya disease, recovering the itemised-but-deferred parent from
    issue #12263 (PR #12930 curated Congenital isolated hyperinsulinism from the same
    issue and deferred the rest).

    Anchor: disease_term MONDO:0016820 Moyamoya disease is kept unchanged. Its OLS
    definition ("a rare intracranial arteriopathy involving progressive stenosis of the
    cerebral vasculature located at the base of the brain") is what this entry models, and
    the term asserts no causal gene of its own, so it is not broader than the entry.

    Scoping: the entry models moyamoya disease (idiopathic primary arteriopathy) plus the
    monogenic forms MONDO files under MONDO:0016820, not moyamoya syndrome secondary to
    another condition. A synonym-inclusive MONDO search for "moyamoya" returns nine
    classes, all MONDO:0016820 or its children, so there is no separate moyamoya-syndrome
    class. Recorded in the entry notes and evidenced from the abstract of PMID:24581742.

    Added four gene-defined has_subtypes rows, each with a bound MONDO subtype_term, a
    genes descriptor and its own evidence: Moyamoya disease 2 (MONDO:0011784, RNF213),
    Moyamoya disease 6 with achalasia (MONDO:0014331, GUCY1A1, autosomal recessive),
    Moyamoya disease 7 (MONDO:0958202, ANO1), Moyamoya disease 8 (MONDO:0980949, NOS3,
    autosomal recessive). Inheritance is asserted only on the two rows where an abstract
    states it; the other two carry review_notes saying why not.

    Added two genetic rows (NOS3 biallelic loss of function, ANO1 gain-of-function
    variants), typed the three existing rows with relationship_type, renamed the GUCY1A3
    row to GUCY1A1 biallelic loss of function and retyped it CAUSATIVE on the strength of
    homozygous segregation in three families, and added reciprocal subtype foreign keys.

    Added two pathophysiology nodes: Nitric oxide-sGC-cGMP signaling deficiency (NOS3 and
    GUCY1A1, GO:0038060 DECREASED) and ANO1 gain-of-function chloride channel
    hyperactivity (GO:0005229 GAIN_OF_FUNCTION), each with a sourced downstream edge to
    the steno-occlusive arteriopathy node. Bound RNF213 as a genes descriptor on the three
    existing RNF213 nodes.

    Wired four phenotype edges from the arteriopathy node (intracranial arterial stenosis,
    ischemic stroke, intracranial hemorrhage, cognitive impairment), each with its own
    abstract-sourced evidence item. Declined edges to transient ischemic attack,
    post-revascularization seizure and hemiparesis for want of a source stating the edge.

    Declined MONDO children: moyamoya disease 1 (MONDO:0009649) and 3 (MONDO:0012122) have
    no causal gene in MONDO's OWL axioms; Moyamoya disease 5 (MONDO:0013542, ACTA2) because
    ACTA2 Arg179 arteriopathy is curated in Multisystemic smooth muscle dysfunction
    syndrome, where ClinGen's Definitive ACTA2 assertion also points; the moyamoya
    angiopathy-short stature-facial dysmorphism-hypergonadotropic hypogonadism syndrome
    (MONDO:0010448) because MONDO asserts no causal gene and it is a distinct syndromic
    X-linked entity better served by its own entry.

    Validation under linkml-reference-validator 0.3.0rc3: linkml-validate pass, term
    validation pass, 49/49 snippets verified, list-gene-term-mismatches 15/15 bindings
    compared against HGNC with zero findings. Gene-to-mechanism wiring moved from 0/5 to
    5/5 and phenotype causal inlink from 0/7 to 4/7. Orphanet could not be consulted (no
    ORPHA cache file for this disease). No GeneReviews chapter exists in the committed
    Bookshelf index.

  summary: 'Genetics pass: Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant
    (d2g series-039)'
  details: |
    Genetics pass for series-039 (issue #12246). Enumerated all 20 MONDO descendants of MONDO:0015362 through the OLS4 API and read each term's gene edges from the Monarch association API; the enumeration found three gene-bearing descendants the issue's gap list omitted. Wired the existing gene set into the pathograph, which was the main gap: the two upstream pathophysiology nodes carried no genes: descriptors at all. "Motor Neuron and Distal Axon Gene Defect" now binds all eleven causative genes with six added evidence items covering the genes the pre-existing review snippet did not name, plus a notes block recording that the bound protein-folding term speaks to the chaperone subset only and that EMILIN1's lesion is extracellular. "Disrupted Proteostasis and Axonal Transport" binds only the three genes its own cited evidence demonstrates the step for, with a notes block saying which genes are not bound and what would be needed to bind them. Added subtype_term and genes bindings to the six existing subtype rows that lacked them, and four new subtype rows with genetic records: FBXO38 (dHMN type 2D), EMILIN1 (HMND10), SPTAN1 (HMND11) and BAG3 (HMND15). Declared MONDO:0010043 (Silver syndrome / SPG17, the second BSCL2 term) and MONDO:0976226 as disease-level narrowMatch mappings. New entry-level notes account for every MONDO descendant and record the three-way numbering collision between OMIM's HMND series, MONDO's Harding-style labels, and this entry's slugs.

  summary: Curate dHMN2C (HSPB3) as a has_subtypes row binding MONDO:0013243
  details: |
    Resolved claim issue #11469 (neuronopathy, distal hereditary motor, type 2C; MONDO:0013243) as entry_type SUBTYPE rather than a standalone kb/disorders/ file.

    Decision. dHMN2C is the HSPB3 member of the small heat-shock protein arm of dominant dHMN, and the sibling members are already has_subtypes rows on this entry: dHMN2B (HSPB1) sits here, and dHMN2A (HSPB8) was split out only because it had a specific, finer proteostasis mechanism to curate. HSPB3 has nothing comparable. Two reported alleles in two families, and no HSPB3 assertion at all in ClinGen's Gene-Disease Validity table (release pinned in data/clingen/MANIFEST.yaml, snapshot_date 2026-08-13), against a Definitive HSPB8 classification for MONDO:0015362, which is this entry's own disease term. Note the CSV itself is gitignored and not committed; the manifest is the reproducible pin, which is why the prose attributes the absence to ClinGen the resource rather than to a local file path. A separate entry would have been mostly the parent entry restated.

    Also added an OMIM external_assertions row for dHMN2C (OMIM:613376), sourced from the MONDO:0013243 cross-reference set rather than recalled, matching the four sibling subtypes that already carry one.

    Gene. HSPB3 (hgnc:5248), taken from the stub genes block and confirmed against PMID:20142617 (the founding report) and PMID:28018906 (a review that names the entity dHMN2C and ties it to the same c.21G>T p.R7S allele).

    Naming trap handled. The issue warned that this entry also discusses HMSN2C, which is a different disease caused by TRPV4 and already curated here as the dHMN-TRPV4 row. The new dHMN2C description says so explicitly so the two abbreviations are not conflated by a later reader.

    Allele boundary recorded rather than smoothed. The two published HSPB3 alleles fall on opposite sides of the dHMN/CMT2 line this entry otherwise draws electrophysiologically: p.Arg7Ser (N-terminal) was reported as dHMN, p.Tyr118His (alpha-crystallin domain) as axonal CMT2. The description states that rather than presenting HSPB3 as a clean dHMN gene.

    Evidence. Four items on the subtype row (PMID:20142617 twice for the gene assignment and the allele location; PMID:28018906 for the entity name and the narrowness of the evidence base; PMID:29341343 for the second family) and two on a new genetic HSPB3 block (PMID:28018906 for the HSPB3-HSPB2-HSPB8 hetero-oligomer, quoted with its own hedging intact; PMID:37804589 for the first animal model, graded MODEL_ORGANISM and explicitly limited to the CMT2-associated allele rather than the dHMN2C one). All snippets are exact substrings of the cached references.

    Also added HSPB3 to the entry description's list of dominant dHMN genes, where it was previously present only inside a quoted snippet.

    Validation. just validate (34/34 snippets verified; PMID references only, so nothing skipped by prefix), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-stubs, and the whole-KB check-title-snippets / check-snippet-length / check-snippet-grading. No pathophysiology nodes, phenotypes or causal edges were added, so no new downstream, sequelae or target_mechanisms targets exist and there is no orphan exposure.

    No deep-research report was run. Two primary papers, one review and one fly model is the entire literature for this entity, and all four were read directly.

  summary: 'Review: wire Bernard-Soulier_Syndrome to primary_hemostatic_plug_failure'
  details: |
    Re-reviewed as part of a sweep of the platelet-type bleeding disorders. The entry was already substantial and accurate; no content was rewritten and no evidence was changed.

    Change made: three conforms_to declarations added, wiring it to the new primary_hemostatic_plug_failure module at the arms its existing evidence already supports - the trigger node to #Loss of a Platelet Primary-Hemostatic Component, 'Loss of von Willebrand Factor Capture Under Shear' to #Impaired Platelet Adhesion to the Injured Vessel Wall, and its existing 'Failure of Primary Hemostatic Plug Formation' node to the module's identically named central effector. The entry had independently converged on that node name before the module existed, which is part of why it was chosen as the module's rate-limiting step.

    Not wired to the aggregation, signalling or procoagulant arms: the entry's evidence supports the adhesion route and the megakaryocyte cytoskeletal route, and asserting the others would be unsupported. The macrothrombocytopenia arm is deliberately left outside the module, which is scoped to qualitative platelet function.

    Validation after the change: linkml-validate PASSED; reference validation PASSED with 87/87 snippets verified against cached references.

  summary: 'Address PR review: modifier contradiction, evidence_source, gene therapy'
  details: |
    Addressed all three IMPORTANT findings from the PR 8529 review plus its consistency suggestion, and fixed a CI failure. (1) Removed the megakaryocyte differentiation GO:0030219 annotation carrying modifier ABNORMAL from the membrane-skeleton node. The reviewer correctly identified this as a claim-versus-evidence contradiction: the node's own description and both cited snippets state that megakaryocyte number, differentiation, and endoreplication are NORMAL, and the interesting biology is precisely that differentiation is spared while proplatelet formation fails. The platelet formation GO:0030220 DECREASED annotation already carries that correctly and is retained. (2) Retagged PMID:10706630 from HUMAN_CLINICAL to MODEL_ORGANISM on the primary-hemostasis node, since evidence_source classifies the publication's study type rather than the topic of the quoted sentence, and the paper is a mouse knockout study; the same PMID was already correctly tagged MODEL_ORGANISM elsewhere in the file. Also added a genuinely human source (PMID:17109744) to the same node as the reviewer suggested. (3) Added a lentiviral gene therapy treatment entry with therapeutic_modality GENE_THERAPY and a RESTORES target_mechanisms edge onto the complex-assembly node, evidenced across all three genes: PMID:22044935 (GPIbalpha-null mouse, corrected bleeding time and macrothrombocytopenia), PMID:27148783 (GPIbbeta-null mouse, GPIb-IX restored in 97% of circulating platelets), and PMID:37416759 (ex vivo correction in hematopoietic stem cells from two unrelated type C patients, graded PARTIAL because it is patient-derived cells rather than treated patients). Added a KNOWLEDGE_GAP discussion recording that no clinical trial of gene therapy exists in this disease despite the preclinical package, and qualified the allogeneic transplantation entry so it no longer reads as the only conceivable cure. (4) Suggestion A: added causal_link_type to the 15 downstream edges that lacked it, DIRECT for the mechanism-to-manifestation edges and INDIRECT_KNOWN_INTERMEDIATES for iron deficiency anemia, which runs through chronic blood loss. (5) CI fix: two folded-scalar lines ended in a hyphen (high-molecular- and surface-), which the check_folded_hyphens gate rejects because folding would insert a space mid-compound; both were reflowed. Validated: just validate passed (schema, terms, and references), just count-verified-snippets reports 81/81 verified against cached references, up from 76/76, and check_folded_hyphens is clean.

  details: |
    New KB entry for Bernard-Soulier syndrome (MONDO:0009276), curated from a claude_code deep-research report (research/Bernard-Soulier_Syndrome-deep-research-claude_code.md), whose own reference validation reported 34/34 references verified with a confabulation rate of 0.0. Seven pathophysiology nodes built around a two-branch model that is experimentally earned rather than merely tidy: loss of the GPIb-IX-V complex disables both an adhesion function (ectodomain capture of von Willebrand factor under shear, plus platelet-surface coagulation factor binding) and a thrombopoietic function (cytoplasmic-tail anchoring of the membrane skeleton during proplatelet extrusion), and a chimeric-receptor mouse dissociates the two cleanly by domain. Four subtypes with MONDO subtype terms (A1/GP1BA, B/GP1BB, C/GP9, A2 dominant monoallelic). Sixteen phenotypes, two genetic entries including the Bolzano founder allele, six treatments, two animal models and one patient-derived megakaryocyte culture each with modeled_mechanisms and readouts, four differential diagnoses, three discussions including the curatable negative that no BSS-causing variant has ever been found in GP5. One EMERGING mechanistic_hypotheses entry for the shear-mechanosensor platelet-clearance route, deliberately not modeled as a node because the link from BSS-causing variants to accelerated clearance in patients has not been demonstrated. Prevalence recorded as CASES_IN_LITERATURE rather than as a population rate. Recombinant factor VIIa deliberately carries no therapeutic_agent binding rather than forcing an NCIT term that is not a reliable member of the therapeutic agent enum. Validated: just validate passed (schema + terms) and just count-verified-snippets reported 76/76 verified against cached references. IMPORTANT SELF-CORRECTION during verification: six reference_title values had been taken from the deep-research report rather than from the cached PubMed record and were wrong; all seventeen title values were then audited programmatically against references_cache and corrected, and the audit now reports zero mismatches. Three snippets were also corrected against the cached text (a missing parenthetical, a unit rendering, and a dropped clause). Seeded cache/mondo and the DiseaseTerm and DiseaseOrSubtypeTerm enum caches for MONDO:0009276, MONDO:1060238, MONDO:1060239, MONDO:1060237, and MONDO:0007930; the three gene-related subtype terms are absent from the local sqlite MONDO build but present in live MONDO, so they were seeded through the configured OLS adapter with conf/oak_config.yaml left unchanged.

  summary: Create Tyrosinemia Type II (Richner-Hanhart / TAT deficiency)
  details: |
    New standalone disorder entry for WP-002 gap 1.4.02.01 (TAT / tyrosinemia type II, Richner-Hanhart). NEC preflight: MONDO:0010160 has RO:0004003 HGNC:11573 TAT and OMIM:276600, distinct from Tyrosinemia_Type_I (FAH), avoiding the flagged TAT->Type I fuzzy-match trap. Modeled the tyrosine-degradation-block pathophysiology chain (TAT deficiency -> hypertyrosinemia -> oculocutaneous tyrosine deposition -> keratitis/corneal dystrophy/palmoplantar hyperkeratosis; hypertyrosinemia -> intellectual disability). Evidence from GeneReviews PMID:39446998, PNAS PMID:1357662 (TAT gene/mutations), case report PMID:22389994. All 25 PMID snippets verified as exact substrings of fetched abstracts; schema, term, and render checks pass.

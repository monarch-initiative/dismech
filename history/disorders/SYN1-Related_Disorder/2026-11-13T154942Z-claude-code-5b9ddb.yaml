  details: |
    Split the trigger node into a molecular synapsin-1 loss-of-function node (MF GO:0106006 cytoskeletal protein-membrane anchor activity, DECREASED, matching the ai-gene-review core function) and a cellular vesicle-clustering node (GO:0097091, ABNORMAL because S79W increases clustering). Dropped GO:0140090 membrane curvature sensor activity and GO:7770062 vesicle membrane tethering activity, which rested on a sentence about where S79W sits rather than on a demonstrated activity change. Added an excitation-inhibition imbalance and network hyperexcitability node from PMID:19020204, PMID:23406870 and PMID:26096837, and moved the epilepsy edge onto it. Added phenotypes from the Parenti 2022 series and the original families: bathing-triggered reflex seizures, global developmental delay, language impairment, ADHD and macrocephaly, with frequencies on epilepsy and intellectual disability. Removed the unsourced levetiracetam agent from antiseizure treatment, retargeted it to the hyperexcitability node and cited response and pharmacoresistance. Added the Syn1 knockout mouse (MGI:98460) with modeled mechanisms. Committed the claude_code deep-research report after preflight-dr (WARN only on non-gene tokens such as CDC).

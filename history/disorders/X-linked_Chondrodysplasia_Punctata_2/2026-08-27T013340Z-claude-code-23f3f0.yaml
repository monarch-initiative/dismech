  summary: 'Create: X-linked Chondrodysplasia Punctata 2 (CDPX2)'
  details: |
    Curated as part of a sweep to complete ISDS Nosology group 23 (Chondrodysplasia punctata) coverage. Corresponds to nosology row NOS 23-0020, CDP X-linked dominant EBP-related. Modelled the disorder around the mosaic logic that distinguishes it from the autosomal recessive members of the group: an X-Inactivation Mosaicism node drives the blaschkolinear cutaneous phenotype, the asymmetric skeletal involvement, and male hemizygous lethality. Includes the tattered (Td) mouse as an animal model linked to that node. Two knowledge-gap discussions: whether the hypomorphic-allele male phenotype is a separate entity, and which arm of the dual sterol lesion produces the cartilage calcification. Curated as its own entry rather than lumping, since the nosology lists it separately and the mosaic mechanism has no counterpart in the other group members. Validated with linkml-validate, linkml-term-validator, and the batched validate-disorders pass (48 snippets verified). Deleted the corresponding stub.

  summary: Rebind EBP isomerase MF to GO:0047750; add variant_origin
  details: |
    The molecular node bound GO:0000247 C-8 sterol isomerase activity, whose GO definition is the fungal fecosterol = episterol reaction (yeast ERG2). Human EBP catalyses lathosterol = 5alpha-cholest-8-en-3beta-ol (EC 5.3.3.5, RHEA:15281), which is exactly GO:0047750 cholestenol delta-isomerase activity (definitions checked in OLS). Rebound to GO:0047750, consistent with MEND_Syndrome and with the updated ai-gene-review EBP core function. Added variant_origin: GERMLINE to the genetic record. No ClinGen validity assertion exists for EBP. Validated (48/48 snippets, validate-terms passes).

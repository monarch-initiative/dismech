  summary: 'Resolve hypomorphic_male_entity: male hypomorphic phenotype split off
    as MEND syndrome'
  details: |
    Edited as part of the MEND syndrome curation PR (#10101), in response to a review finding that the new entry silently overturned a decision recorded here.

    What changed. The discussion hypomorphic_male_entity is moved from OPEN to RESOLVED. Its question - whether a male hemizygous for a hypomorphic EBP allele has a mild variant of CDPX2 or a separate X-linked recessive disorder - is answered in favour of a separate entity, now curated as MEND syndrome at kb/disorders/MEND_Syndrome.yaml and bound to MONDO:0010498.

    Why the earlier decision was right at the time and is not now. The rationale rested on two premises, and both were checkable and both have become false. It said "MONDO carries only MONDO:0020603": MONDO:0010498 exists. And it treated the evidence as "a single reported family": a 2025 review tabulates seven distinct EBP alleles across four unrelated families and eight sporadic patients. Either alone would have been enough to reopen the question. Both premises are quoted and corrected in the resolved rationale rather than deleted, so a reader can see what changed and not only the new conclusion.

    Where the boundary now falls. Not on severity, on mosaicism. A male who survives by somatic mosaicism, or by a null allele plus a supernumerary X, has enzyme-competent clones and presents as a CDPX2 patient - he stays in this entry. A male hemizygous for a constitutional hypomorphic allele has partial activity everywhere and no competent clones, giving a symmetrical, neurologically weighted phenotype, and belongs in the MEND entry.

    A factual correction, not just bookkeeping. The discussion previously described the male hypomorphic phenotype as presenting "without the ichthyosis and stippling of CDPX2". That generalised from the single 2014 family, whose reported features were digital abnormalities, intellectual disability and short stature. Mild ichthyosis is documented in both patients of a 2025 MEND family and is curated in the MEND entry, so the sentence directly contradicted the new entry. It is corrected: the distinction between the two disorders is the pattern of the skin and skeletal findings - symmetrical and often transient in MEND, Blaschko-linear with follicular atrophoderma and scarring alopecia here - not their presence or absence.

    The evidence item on the discussion is retained with its explanation updated. PMID:24700572 argued for a distinct male entity on one family with biochemical confirmation; that was enough to raise the question, and the seven alleles across twelve patients are what settled it.

    The notes paragraph no longer says the hypomorphic-allele male phenotype is kept inside this entry. It points at the MEND entry and at the resolved discussion.

    What is left open here is the biology, not the nosology: whether the two disorders sit on one enzyme-activity continuum or differ in kind. That belongs to the sterol-to-phenotype gap already recorded separately in this entry, and the resolved discussion says so rather than carrying it.

    Validation. Schema validation, term validation and reference validation pass on this file; duplicate-key and entity-ref checks pass across both edited files.

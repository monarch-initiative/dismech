  summary: 'Review: add missing resolution_note to a RESOLVED knowledge gap'
  details: |
    Caught by the check-knowledge-gap-targets gate added in monarch-initiative/dismech#10583, when main was merged into that branch. The hypomorphic_male_entity discussion carries status RESOLVED with no resolution_note; it was written after that PR's census, so it is the first case the gate found that was not already known.

    The resolution was already stated in the rationale: the male hypomorphic phenotype is curated as a separate entity, MEND syndrome (kb/disorders/MEND_Syndrome.yaml, MONDO:0010498), while a mosaic male or one with a null allele plus a supernumerary X remains in this entry, and the two are distinguished by the pattern of skin and skeletal findings rather than their presence or absence. Summarised that into resolution_note without changing the rationale, the evidence, or any claim. resolved_date is still absent and is reported but not gated, since there is no source for when the decision was made.

    Verified with linkml-validate and scripts/knowledge_gap_discussion_audit.py --strict.

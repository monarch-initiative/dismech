  summary: 'Reviewed and enhanced Primary Carnitine Deficiency entry: integrated GeneReviews baseline (PMID:22420015), added evidence to classifications, structured prevalence into cohort-specific records and progression into subtype-scoped phases, and bound therapeutic_agent and target_mechanisms on L-carnitine supplementation (CHEBI:16347) and Acetyl-L-carnitine (CHEBI:57589).'
  details: Conducted a comprehensive review of kb/disorders/Primary_Carnitine_Deficiency.yaml. Integrated the GeneReviews Primary Carnitine Deficiency chapter (PMID:22420015) across progression, genetic, diagnosis, treatments, and references; added ENDOCRINOLOGY_METABOLISM and GENETICS_ENVIRONMENT_DISEASE classifications with evidence (PMID:38961493); split prevalence into two structured cohort records (PMID:38961493, PMID:38125748); structured progression into subtype-scoped infantile metabolic and childhood-to-adult cardiac phases (PMID:22420015, PMID:29502916, PMID:38585546); and bound CHEBI:16347 ((R)-carnitine) on L-carnitine supplementation and CHEBI:57589 (O-acetyl-L-carnitine) on Acetyl-L-carnitine for encephalopathy with target_mechanisms.

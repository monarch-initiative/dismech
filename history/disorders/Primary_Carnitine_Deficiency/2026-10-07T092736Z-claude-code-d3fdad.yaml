  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding free carnitine C0 in DBS (LOINC:38481-8) and the C3+C16 sum (LOINC:75211-3) the Guangzhou programme evaluated. Two C0 reference ranges, abnormal direction low: Quanzhou 2020 second-tier trigger below 8.5 umol/L (PMID:39248612, already cited by the entry; the same programme widened the trigger to 12 umol/L in 2021-2022, PMID:38158618, recorded in notes and evidence) and the Guangzhou 2015-2019 operating cut-off below 10 umol/L (PMID:32521959). The Guangzhou retrospective proposal of (C3+C16) below 2 umol/L was deliberately not banded because the paper models it rather than applying it. The Free carnitine (C0) marker got loinc_term LOINC:LP18431-4, the specimen-agnostic Part, because the marker is described in plasma and DBS. LOINC codes resolved via the Monarch KG search and entity endpoints and seeded into cache/loinc/terms.csv by just loinc-seed-cache. Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, validate-disorders and the LOINC schema test.

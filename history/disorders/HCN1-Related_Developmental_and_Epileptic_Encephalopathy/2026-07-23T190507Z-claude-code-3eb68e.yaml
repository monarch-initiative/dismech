  summary: 'Create: HCN1-Related Developmental and Epileptic Encephalopathy'
  details: |
    New DEE-24 (MONDO:0014377, HCN1/hgnc:4845) entry. Five-node unbundled cascade of the hyperpolarization-activated Ih 'pacemaker' current: HCN1 variant altering the Ih channel -> aberrant hyperpolarization-activated current (gain-of-function cation leak for severe M305L, Bleakley 2021) -> loss of dendritic excitability constraint -> cortical network hyperexcitability (conforms_to epilepsy_excitation_inhibition_imbalance) -> impaired neurodevelopment. Divergent GoF/LoF variant effects captured; KNOWLEDGE_GAP discussion on functional-class -> phenotype -> therapy mapping. Clinically actionable sodium-channel-blocker safety warning (DMCN case series PMID:42357823 + knock-in mouse PMID:33822003) and investigational Org 34167 HCN modulator precision therapy (PMID:40762985). Ultra-rare prevalence (no denominator). Evidence: Nava 2014 (PMID:24747641), Marini 2018 (PMID:30351409), Bleakley 2021, DMCN case series, Org 34167, J Neurochem review (PMID:37565989). All 25 snippets substring-verified; validate + term-validation clean; weighted compliance 88.6%.

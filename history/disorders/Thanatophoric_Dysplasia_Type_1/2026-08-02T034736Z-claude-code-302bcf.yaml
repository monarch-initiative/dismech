  summary: Correct unsupported germline-mosaicism claim and source penetrance
  details: |
    Acts on finding 6 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md, plus a new finding surfaced while fixing it.

    The report flagged that penetrance: COMPLETE had no supporting evidence (the cited snippet reports mutation detection counts and does not address penetrance). While sourcing it, a second and more serious problem appeared: the inheritance description asserted that 'Germline mosaicism has been reported, leading to rare recurrences in siblings'. No cited reference supports this, and PMID:20301540 (GeneReviews), already cited elsewhere in this same entry, states the opposite: germline mosaicism in healthy parents, although not reported to date, remains a theoretic possibility. The entry contradicted a source it already relied on.

    Corrected the description to match GeneReviews and attached two PMID:20301540 evidence items: one for the autosomal dominant / de novo mode, and one bounding the recurrence mechanism (marked PARTIAL, since it constrains rather than demonstrates the claim). penetrance: COMPLETE is retained but the description now explains its basis and its limit: no unaffected heterozygous carriers have been described, but TD is ascertained as a perinatally lethal phenotype, so carriers are by construction affected and the value cannot be estimated from an unselected carrier series. The original snippet's explanation was narrowed to what it actually establishes.

    Validated: schema, reference and term validation all pass.

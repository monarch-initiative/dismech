  details: |
    Second review round on PR #10710. Fixed a Named Entity Confusion the reviewer caught: the mycobacterial and fungal phenotype snippets had been quoted from a sentence describing NFKBIA (a comparator disorder) that opened 'Like IKBKB immune deficiency' - exact substrings but wrong disease. Re-cited both to IKBKB-cohort-specific sentences (disseminated BCG deaths; abstract fungal statement). Also fixed the 4-word mycobacteria snippet that had failed check-snippet-length in CI. Added evidence to immunoglobulin replacement and anti-infective prophylaxis treatments, bound the IVIG agent to NCIT:C80829, re-parented hypogammaglobulinemia/agammaglobulinemia edges to Impaired Immune-Cell Activation, and added an allelic-spectrum evidence item. Validated: validate 20/20, check-snippet-length, check-causal-targets, check-entity-refs, check-duplicate-keys.

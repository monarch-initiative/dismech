  summary: 'Create: IKK2 Deficiency (IMD15B)'
  details: |
    De novo curation of IKK2 deficiency / SCID due to IKBKB deficiency (IMD15B, MONDO:0014267) from a Perplexity sonar-deep-research report. Modeled the signaling-SCID chain: IKBKB/IKK2 LOF -> failure of canonical NF-kappaB activation -> impaired activation of T/B/innate cells (naive-only lymphocytes, absent Treg/gamma-delta) -> combined immunodeficiency with hypo/agammaglobulinemia. All 11 snippets verified against the landmark Pannicke 2013 NEJM abstract (PMID:24369075). Terms verified against ontologies (IKBKB hgnc:5960; NF-kB GO:0007249; IkB kinase activity GO:0008384). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys.

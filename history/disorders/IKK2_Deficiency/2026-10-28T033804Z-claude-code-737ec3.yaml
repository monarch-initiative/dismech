  details: |
    Restored the immunoglobulin replacement edge to Hypogammaglobulinemia (treatment_effect BYPASSES: it supplies the antibody the patient cannot make) and the anti-infective prophylaxis edge to Recurrent infections (INHIBITS), keeping the PMID:30391351 evidence added in the previous round; both had been moved to Systemic Combined Immunodeficiency, which neither treatment acts on. Replaced CL:0000624 CD4-positive, alpha-beta T cell with CL:0000084 T cell on the three pathophysiology nodes, because PMID:24369075 reports impaired responses through T-cell receptors in T cells generally. Added quote_role BACKGROUND to both copies of the mouse embryonic-lethality snippet, which this human study restates from earlier mouse work. Renamed the diagnosis row from (TREC-negative) to (normal TREC) to match its description. Rewrote the 2026-10-24 record so its classification values match the file, it no longer claims UBERON terms, and it records the treatment retargeting.

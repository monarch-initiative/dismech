  summary: Reviewed and enriched IKK2 Deficiency with Harrison's and IUIS classifications, IKBKB gene
    wiring on the trigger node, node-level evidence and cell/process terms, phenotype diagnostic flags,
    a diagnosis term binding, treatment target_mechanisms, and animal model evidence.
  details: Added classifications (harrisons_chapter IMMUNE_RHEUMATOLOGIC and GENETICS_ENVIRONMENT_DISEASE,
    iuis_category combined immunodeficiency). Wired hgnc:5960 IKBKB onto IKK2 Loss of Function and added
    GO:0007249 and cell types there; added cell types on Failure of Canonical NF-kappaB Activation and
    GO:0046649 on Impaired Immune-Cell Activation; added node-level evidence (PMID:24369075 or PMID:30391351)
    on all four pathophysiology nodes. No UBERON terms were added. Set diagnostic flags on all seven phenotypes.
    Bound NCIT:C15709 Genetic Testing as the diagnosis_term and added presence/results. On treatments,
    added treatment_effect RESTORES and evidence to the HSCT edge, and moved the immunoglobulin replacement
    and anti-infective prophylaxis edges from Hypogammaglobulinemia and Recurrent infections to Systemic
    Combined Immunodeficiency (MODULATES) with evidence. Added top-level PMID:24369075 evidence to the
    Ikbkb knockout mouse.

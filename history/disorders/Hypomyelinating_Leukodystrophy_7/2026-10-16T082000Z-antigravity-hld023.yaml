  summary: Enhance Hypomyelinating Leukodystrophy 7 with prevalence, progression,
    differential diagnoses, classifications, inheritance, and causal wiring
  details: Added top-level classifications (harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE),
    inheritance (Autosomal recessive inheritance HP:0000007 with VARIABLE expressivity),
    prevalence (Worldwide CASES_IN_LITERATURE / NOT_YET_DOCUMENTED), progression
    (early-childhood onset, attenuated adolescent/adult-onset, and progressive neurological/bulbar
    deterioration phases), and five differential diagnoses (Pelizaeus-Merzbacher disease
    MONDO:0010714, POLR3B-related HLD8 MONDO:0013722, POLR1C-related HLD11 MONDO:0014666,
    POLR3A-related hereditary spastic ataxia, and Wiedemann-Rautenstrauch syndrome
    MONDO:0009910). Bound hgnc:30074 (POLR3A) to upstream pathophysiology nodes, added
    verbatim evidence from PMID:21855841 and PMID:30898877, wired downstream phenotype
    edges from Central Nervous System Hypomyelination, and synchronized references.

  summary: Enhance Hypomyelinating Leukodystrophy 7 with prevalence, progression, differential diagnoses,
    classifications, inheritance, Dysphagia phenotype, and causal wiring
  details: Added top-level classifications (harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE),
    inheritance (Autosomal recessive inheritance HP:0000007 with VARIABLE expressivity), prevalence (Worldwide
    CASES_IN_LITERATURE / NOT_YET_DOCUMENTED), progression (early-childhood onset, attenuated adolescent/adult-onset,
    and progressive neurological/bulbar deterioration phases), and five differential diagnoses (Pelizaeus-Merzbacher
    disease MONDO:0010714, POLR3B-related HLD8, POLR1C-related HLD11, POLR3A-related hereditary spastic
    ataxia, and Wiedemann-Rautenstrauch syndrome MONDO:0009910), while removing the out-of-scope POLR3B
    subtype from has_subtypes. Bound hgnc:30074 (POLR3A) and molecular_functions GO:0003899 (DNA-directed
    RNA polymerase activity, DECREASED) on Biallelic POLR3A Loss of Function, aligned description wording
    with PMID:21855841 ("autopsied brain tissue"), softened causal downstream edge descriptions with INDIRECT_UNKNOWN_INTERMEDIATES
    where intermediate mechanisms remain unresolved, added Dysphagia (HP:0002015) to phenotypes, downstream
    edges, and Multidisciplinary Supportive Care target_phenotypes (alongside Hypogonadotropic hypogonadism
    HP:0000044), and removed uncited PMID:39062571 from top-level references.

  summary: Tighten 6'-sialyllactose trial reporting and prevalence range
  details: |
    Took two of the four optional items from the third review. (1) The 6'-sialyllactose description said the placebo-controlled trial found no difference in muscle strength, which flattened the authors' own carve-out. PMID:39644669 reports that hand grip power fell in both arms and reached significance only in placebo (p = 0.0004), and that the regions failing to separate on MRI were the anterior thigh AND both lower-leg regions, not the anterior thigh alone. Description corrected on both points, and the hand-grip sentence added as its own PARTIAL evidence item so the finding is traceable rather than only implied by the word 'excluding' in the REFUTE snippet. Graded PARTIAL not SUPPORT because it is an asymmetry in which arm reached significance rather than a between-group difference: with five and six participants per arm, the treated arm's failure to reach significance is as consistent with low power as with preservation. Note that p = 0.0004 appears twice in that abstract for unrelated endpoints (hand-grip decline in placebo, and the between-group fat-fraction difference) and the two must not be conflated. (2) Added rate_low 0.1 / rate_high 0.9 to the clinical/registry prevalence record, which carried a point value while its gnomAD-derived sibling carried a range; 1-9 per million is 0.1-0.9 per 100,000. Declined: therapeutic_modality SMALL_MOLECULE for a milk trisaccharide (arguable either way, no clear gain over OTHER) and the c.620A>T prose addition. Validated: just validate passed; count-verified-snippets 78/78; title audit 25 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

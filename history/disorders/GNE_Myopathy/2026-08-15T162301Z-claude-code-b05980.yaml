  details: |
    Addressed all four IMPORTANT findings and all five suggestions from the PR 8552 review. IMPORTANT 1 (evidence_source on mouse-paper background sentences) had already been fixed in a self-correction pushed before the review landed; the reviewer's additional point that two of the three were the sole evidence for human phenotypes is now also addressed by adding a human GeneReviews source to the beta-amyloid deposits and fiber-diameter variability phenotypes so neither rests on model-organism evidence alone. IMPORTANT 2: added a two-record prevalence block capturing the order-of-magnitude disagreement the reviewer identified, the conventional clinical/registry estimate of one to nine per million and the gnomAD-derived 18.46 to 95.42 per million, both from PMID:40225917, with the second tagged COMPUTATIONAL because it is an in silico estimate from allele frequencies rather than a counted cohort; the disagreement is recorded as the finding rather than reconciled. IMPORTANT 3: added 6'-sialyllactose as a treatment with a RESTORES target_mechanisms edge onto the Free Sialic Acid Depletion node, carrying SUPPORT for target engagement (PMID:37852099), PARTIAL for the significant MRI fat-fraction separation, and REFUTE for the negative muscle-strength endpoint in the same trial (PMID:39644669). IMPORTANT 4: added a clinical_trials block with NCT02377921, NCT04671472, NCT02346461, and NCT04231266, the last being the placebo-controlled ManNAc trial that would resolve the open-label study's main limitation. Suggestions: retargeted all four cell-type annotations from CL:0000188 to CL:0008002 skeletal muscle fiber, since the entry describes myofiber-level pathology throughout; retagged the Japanese approval evidence item to OTHER, matching the entry's own explanation that it is a fact about regulatory action; added a sialuria line to notes recording the dominant gain-of-function allelic disorder at the same locus and why GAIN_OF_FUNCTION must never be curated on a myopathy allele. On the thrombocytopenia band the reviewer was right that 4.1% sits just outside VERY_RARE: rather than move it to a band it also does not fit, the frequency was removed and the explanation now states that 4.1% falls in the gap between the VERY_RARE and OCCASIONAL bands and that rounding into either would assert precision the single registry figure does not carry. Validated: just validate passed (schema, terms, references), just count-verified-snippets reports 76/76 verified against cached references, up from 64/64, all 25 reference_title values audited against references_cache with zero mismatches, and check_folded_hyphens clean.

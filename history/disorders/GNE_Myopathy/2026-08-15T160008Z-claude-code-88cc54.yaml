  summary: 'Create: GNE Myopathy'
  details: |
    New KB entry for GNE myopathy (MONDO:0011603), curated from a claude_code deep-research report (research/GNE_Myopathy-deep-research-claude_code.md), whose own reference validation reported 41/41 references verified, 7/7 quotes valid, confabulation rate 0.0. GeneReviews chapter PMID:20301439 fetched, tagged, and used as the phenotype baseline, including its Agents/Circumstances to Avoid section which is curated as its own treatment entry. Six pathophysiology nodes: biallelic hypomorphic GNE variants and enzymatic block, free sialic acid depletion, hyposialylation of muscle glycoproteins, autophagic block and proteostasis failure, amyloid and misfolded protein accumulation, and myofiber atrophy and degeneration. Two mechanistic points are carried carefully. The quadriceps-sparing sign, the disease's most useful diagnostic discriminator, is given its biochemical explanation from measured free sialic acid differences in NORMAL muscle rather than in disease. And hyposialylation is asserted as causal on the strength of the mouse rescue, quoted with the authors' own hedge that it is one of the key factors rather than the whole story. Fourteen phenotypes, two subtypes by catalytic domain (recorded because the domain distinction is therapeutically consequential for ManNAc), four treatments, one animal model and one iPSC-derived experimental model each with modeled_mechanisms and readouts, four discussions. The central curation decision is the sialic acid trial discordance: an international phase 3 gave Class I evidence of no benefit while Japanese trials were equivocal-to-positive enough to support 2024 approval, and the entry records both directions with REFUTE and PARTIAL evidence side by side rather than picking one. Deliberately not curated: the registry's 14.7% psychiatric disease figure, which is self-reported and confounded by reactive depression, and dietary sialoglycoprotein loading as a protective factor, which tested negative. Validated: just validate passed (schema, terms, and references) and just count-verified-snippets reported 64/64 verified against cached references. All 35 planned snippets were pre-verified against the cache before any YAML was written, which caught four that did not match; five reference_title values were corrected against the cached records after the reference validator flagged them, and a programmatic audit of all 18 title values now reports zero mismatches.

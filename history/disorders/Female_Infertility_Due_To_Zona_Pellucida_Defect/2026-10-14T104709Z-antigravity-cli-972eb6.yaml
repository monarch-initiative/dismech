  details: |
    Addressed PR #14120 review items: (1) expanded phenotypes to include Absent zona
    pellucida (HP:6000328), Thin zona pellucida (HP:0020157), Empty ovarian follicle
    (HP:0031067), and Oocyte degeneration (with notes on missing HPO term), and wired
    all pathophysiology terminal edges and phenotype sequelae into Female infertility
    (HP:0008222) so zero phenotypes are disconnected; (2) unbundled Impaired
    Cumulus-Oocyte Complex Organization and Granulosa-Oocyte Crosstalk from Oocyte
    Mitochondrial Dysfunction, Fragility, and Intra-Follicular Degeneration (with
    GO:0005739 mitochondrion); (3) replaced generic ECM/gamete GO bindings with
    specific egg-coat and fertilization GO terms (GO:0035805 egg coat, GO:0035803 egg
    coat formation, GO:0035804 structural constituent of egg coat, GO:0007339 binding
    of sperm to zona pellucida) and removed unsupported GO:0006621; (4) added
    Sex-limited expression (HP:0001470) to inheritance; (5) updated prevalence to
    General population (measure_type: UNKNOWN) and moved ZP1 cohort case fraction
    (18.5%, 5/27 in North African OMD cohort) to genetic.case_fractions; (6) added
    structured variants under genetic[0] (c.1169_1176del, c.1097G>A, c.326G>A,
    c.247T>C, c.785A>G) with SO terms and clinical_significance; (7) added Oocyte
    Donation treatment entry and action_category/therapeutic_modality on ICSI; (8)
    populated reference_title across all EvidenceItems, added quote_role annotations
    (REVIEW_SYNTHESIS, BACKGROUND), and split mixed IN_VITRO/MODEL_ORGANISM evidence
    in discussions; (9) cross-referenced TUBB8-related_Oocyte_Maturation_Defect.yaml
    and aligned creation_date with the curation date.

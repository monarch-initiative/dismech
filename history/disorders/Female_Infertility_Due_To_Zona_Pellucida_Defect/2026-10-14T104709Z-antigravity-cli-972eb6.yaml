  details: |
    Created comprehensive disorder entry for female infertility due to zona pellucida
    defect (MONDO:0014342, OOMD1, OMIM:615774), caused by pathogenic variants in ZP1
    (hgnc:13187). Curated autosomal recessive and sex-limited autosomal dominant
    inheritance, cohort prevalence in genuine empty follicle syndrome and North African
    OMD cohorts, 4-node directed causal pathophysiology graph (cytoplasmic ZP1 retention
    and partner ZP3/ZP4 sequestration -> failure of ZP1-N1 intermolecular disulfide
    cross-linking and ZP matrix assembly -> impaired cumulus-oocyte complex organization
    and granulosa-oocyte crosstalk / defective sperm-zona recognition), phenotypes,
    ZP1 genetic variants across all 7 domains, ICSI rescue vs oocyte donation treatment
    stratification, genetic testing diagnosis, differential diagnoses (OOMD3/ZP3,
    OOMD6/ZP2, OOMD2/TUBB8), rat/macaque/mouse animal models, mammalian heterologous
    cell models, and resolved species divergence discussion. All 43 evidence snippets
    verified against references_cache.

  summary: Add synonyms, diagnosis, differential diagnoses, hepatic transaminase downstream edge, and liver transplantation target_mechanisms for Cori-Forbes disease (GSD III)
  details: Added synonyms block (Glycogen storage disease type III, GSD III, GSDIII, Limit dextrinosis, Glycogen debranching enzyme deficiency). Added downstream edge from Hepatic glycogen accumulation and fibrosis to Elevated circulating hepatic transaminase concentration (PMID:31263214). Added diagnosis entries for AGL molecular genetic testing (NCIT:C15709, PMID:20301788, PMID:11949933) and Glycogen debranching enzyme activity assay (NCIT:C64430, PMID:20301788). Added differential_diagnoses entries for Hypertrophic cardiomyopathy (MONDO:0005045, PMID:33368379) and Cirrhosis of liver (MONDO:0005155, PMID:33368379). Added target_mechanisms (RESTORES on Hepatic glycogen accumulation and fibrosis, PMID:20301788) and extrahepatic myopathy/cardiomyopathy caveat note to Liver transplantation.

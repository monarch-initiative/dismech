  details: |
    De-novo curation of GSD X (muscle phosphoglycerate mutase deficiency, PGAM2) from the stub MONDO:0009865. Required deep-research input: the Perplexity report (sonar-deep-research, default/medium reasoning effort), produced through a session-local streaming wrapper (sitecustomize.py on PYTHONPATH, not committed) because the non-streaming call is dropped by the egress proxy after about 300 s (dismech#9357). The report cites bare URLs (dismech#10249); its 17 sidecar URLs were resolved by hand (PMC id converter / PubMed) to PMID:6262916, PMID:8447317 (PMC1682163), PMID:27612597, PMID:30310767 (PMC6178239) and PMID:30740405 (PMC6331362); the rest are database pages (OMIM, Orphanet, MedlinePlus, MalaCards, ClinVar, GTR, MedGen, PomBase, Alliance) with no PMID. just preflight-dr passed (PGAM2 mentioned 146 times, OMIM 261670 agrees with MONDO). Report content rejected: its citation [5] is described as a BMC Medical Genetics case report but resolves to Mol Genet Metab Rep (PMID:30310767); the claim that PGAM activity in deficiency is only slightly lower than PFK is attributed to Koo et al. but is not in that abstract; the non-spherocytic hemolytic anemia (from a PomBase summary) and the hyperuricemia/gout/coronary arteriosclerosis features (attributed to the Kanungo 2018 review, PMID:30740405, whose abstract does not mention GSD X) are not supported by any primary report and were not curated; several suggested HPO/GO/CL/MONDO CURIEs were mislabelled per the report's own term validation, and every term was looked up afresh. PMID:30740405 was not cited. The report's ochratoxin A broiler-chicken paper (PMID:6940112) was screened by title only and not used: it concerns an induced toxicosis, not a PGAM2 defect. Independent PubMed searches added 19 primary reports and reviews (index and second cases, the 1993 molecular study, 31P-MRS and exercise-physiology studies, manifesting heterozygotes, tubular-aggregate and dantrolene reports, exome/panel cohorts, and a PGAM mouse study used only to document the absence of a Pgam2 loss-of-function model). PMID:19322572 (E154K manifesting heterozygote) was fetched but has no cached abstract and was not cited. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER; the StatPearls candidate is the generic GSD chapter). Validation: just validate passed; validate-terms passed; count-verified-snippets 80/80; check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and check-folded-hyphens all OK; list-disconnected-phenotypes 9/9 phenotypes causally connected. The authoritative just validate-disorders run passed (1 file, 80 snippets, 0 issues), and all 23 ungated whole-KB CI gates (including the newly-ungrounded-genes gate) all passed.

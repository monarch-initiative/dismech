  summary: 'Review: add CDSS-distinguishing phenotypes and published-case epidemiology'
  details: |
    The entry carried only five phenotypes, all of which it shares with classic Crouzon syndrome, so nothing in it explained why crouzonodermoskeletal syndrome is treated as a separate entity. Added the five features a 2025 PRISMA-guided scoping review of 74 published cases identifies as distinguishing it (PMID:41215833): choanal atresia (HP:0000453), hydrocephalus (HP:0000238), Chiari malformation (HP:0002308), mandibular prognathia (HP:0000303, attributed by the source to odontogenic tumours rather than to midface hypoplasia), and spinal canal stenosis (HP:0003416, part of the axial involvement that the FGFR3 p.Ala391Glu allele produces and the FGFR2 Crouzon alleles do not).

    Prevalence: added a second record with measure_type CASES_IN_LITERATURE recording that the entire evidence base is 74 cases across 32 publications from 1985-2023, which is the practical ceiling on any frequency claim for this disorder. The same source independently corroborates the existing 1-per-million estimate and reports an unexplained ~2:1 female predominance, flagged in notes as a possible ascertainment artefact rather than curated as a biological sex effect.

    Validation: just validate PASS; just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 23/23 verified.

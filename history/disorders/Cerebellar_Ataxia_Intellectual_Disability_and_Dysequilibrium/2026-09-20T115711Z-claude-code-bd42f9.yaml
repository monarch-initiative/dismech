    Genetics pass for #12192. All four genes were curated with good evidence and the pathophysiology already had one node per subtype - 'Disrupted Reelin Signaling (CAMRQ1)', 'Endolysosomal Trafficking and Autophagy Defect (CAMRQ2)', and so on - but not one of those nodes carried a gene descriptor, so gene-to-mechanism wiring was 0/4 in an entry whose node names already stated the answer. Bound VLDLR, WDR81, CA8 and ATP8A2 on their respective nodes with a `subtypes:` scoping, bound the same genes on the four `has_subtypes` rows, and added `relationship_type: CAUSATIVE` to the four genetic records. Wiring is now 4/4. No new literature needed. MONDO reconciliation: MONDO:0024542/VLDLR, MONDO:0012430/WDR81, MONDO:0013188/CA8 and MONDO:0014104/ATP8A2 all present.

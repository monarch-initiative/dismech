  summary: Review CAMRQ mechanisms, subtype spectrum, clinical care and model evidence
  details: |
    Reviewed the existing Falcon narrative, citations, four supplementary artifacts and cached primary sources, including available full texts and the full VLDLR GeneReviews chapter. Separated VLDLR receptor trafficking and Reelin signaling, WDR81 endosomal and selective aggrephagy functions, CA8 calcium regulation and regional atrophy, and ATP8A2 abundance versus intrinsic activity. Removed unsupported universal imaging, progression and genotype-severity claims. Expanded subtype-specific motor, sensory, developmental, imaging and care coverage; preserved normal-intellect and normal-MRI exceptions. Added model systems with measured endpoints and limitations, including non-neuronal patient-derived endoderm. GeneReviews clinical, diagnosis, management and counseling sections were actively mined. Reviewed titles and claim-snippet alignment; verified ontology terms. Schema, term and reference validation passed, including shared Reelin disorder/module consumers. Page and pathograph rendered and visually inspected; no JavaScript errors. Cohort denominators are scoped; model results are not generalized to all patient alleles.

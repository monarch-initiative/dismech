  summary: Tag IDH1/IDH2 NEOMORPHIC
  details: |
    Adds a genetic_context to the "IDH1/2 Neomorphic Mutation" node: IDH1 and
    IDH2, heterozygous, somatic, missense, NEOMORPHIC.

    The textbook neomorph and the discriminator against HYPERMORPHIC: the mutant
    enzyme does not do more or less of the wild-type reaction, it acquires a
    catalytic activity the wild type does not have, reducing alpha-ketoglutarate to
    D-2-hydroxyglutarate. PMID:40916936 names 2-HG as an oncometabolite produced by
    mutant IDH -- a product the wild-type enzyme does not make, which is the
    defining criterion.

    Part of a tranche giving every FunctionalImpactEnum value a real, cited
    exemplar in the KB rather than only a prose example in the schema.

    Structural note found while doing this: the disease-level genetic: block uses
    the Genetic class, which has no functional_impact_category slot. The enum can
    only attach through Pathophysiology.genetic_context (or
    PhenotypeContext.genetic_context). That is why only 24 annotations existed
    KB-wide despite hundreds of genetic blocks, and it is a candidate follow-up.

    No new references were fetched for this tranche. Every genetic_evidence snippet
    is an exact quote already present and verified in the same entry, re-cited
    against the specific claim it supports, so the change adds precision without
    adding citation risk.

    Validation for the tranche: linkml-validate clean on all nine changed files;
    linkml-term-validator validate-data passes on the seven that gained
    ontology-bound content; reference_snippet_audit --strict reports 785/805
    snippets verified against cached references, with 20 skipped by prefix;
    check_duplicate_yaml_keys, check_snippet_length, check_title_snippets and
    check_empty_snippets all clean. check_folded_hyphens flagged one new finding,
    which was mine in the schema comment added by the preceding commit (a line
    ending in "disease-" would fold to "disease- contributing"); it was reflowed and
    the check is clean again.

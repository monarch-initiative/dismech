  details: |
    Second review round on PR #10145, taking the non-blocking suggestions that were left after approval.

    Scoliosis phenotype added (HP:0002650). This one was a mistake in a PR comment rather than in the entry: I had replied that scoliosis was already present, when in fact it appeared only inside snippet text and in a treatment name. The reviewer checked and I had not. The same GeneReviews sentence that grounds the kyphosis and joint-contracture phenotypes names scoliosis alongside them, so the evidence needed no new source.

    therapeutic_modality on Immunosuppressants and DMARDs changed from SMALL_MOLECULE to OTHER. As prescribed in this disease the class spans conventional synthetic DMARDs, corticosteroids and biologic agents, so no single platform describes it and SMALL_MOLECULE asserted one.

    The immobilization-avoidance guidance moved from notes into the description and evidence of Physical Therapy and Activity Modification. It had been recorded as care guidance with no mechanism target, but avoiding immobilization is precisely what the activity-modification arm of that treatment consists of, so it belongs to the treatment. Cited to the GeneReviews agents-and-circumstances-to-avoid clause.

    diagnosis_term bound on all four diagnosis records: NCIT:C15709 Genetic Testing, NCIT:C51692 Skin Biopsy, NCIT:C137876 Bone Radiography, NCIT:C25294 Laboratory Procedure. Each preferred_term is more specific than its binding, which is the intended relationship. NCIT:C137876 is a new cache row; the other three were already cached.

    Total Joint Arthroplasty renamed to Total Hip Arthroplasty. The name claimed joint replacement generally while every outcome figure in the entry comes from hip series. GeneReviews does recommend arthroplasty without naming a joint, and the description now records that distinction rather than silently narrowing.

    Not changed: the MODULATES edge on the ineffective-therapy treatment. TreatmentEffectEnum has no NO_EFFECT value, so there is nothing to change it to, and graph.py emits a targets edge for every target_mechanisms entry regardless of effect or evidence grade. That is a schema and exporter gap affecting the whole KB and is filed as its own issue rather than worked around here.

    Validation: linkml-validate clean, linkml-term-validator --labels clean, 67/67 snippets verified, entity references resolve, no duplicate keys, all baseline gates report no new divergences. Cache diff is one additive row plus its enum row.

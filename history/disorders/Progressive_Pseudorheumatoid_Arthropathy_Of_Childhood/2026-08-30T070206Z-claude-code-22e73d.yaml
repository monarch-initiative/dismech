  summary: 'Create: Progressive Pseudorheumatoid Arthropathy of Childhood'
  details: |
    De novo curation of progressive pseudorheumatoid arthropathy of childhood (MONDO:0008827, CCN6/WISP3), using GeneReviews PMID:26610319 as the phenotype baseline plus four national cohorts (Turkey, China, India, Egypt). One OpenScientist deep-research report was generated and read. Its reference validation was clean (29/29 verified) but its term validation set needs_review with 14 label mismatches, of which eight were CURIEs naming entirely different concepts. None was used: MONDO:0009215 as the disease term (it is Fanconi anemia complementation group A, confirmed by OAK lookup), HP:0000944 for platyspondyly (Abnormal metaphysis morphology), HP:0100360 for enlarged interphalangeal joints (Upper-limb joint contracture), HP:0002826 for spinal canal stenosis (Halberd-shaped pelvis), NCIT:C157866 for total hip arthroplasty (Gluten Free Diet), NCIT:C51765 for physical therapy (Bilateral Salpingectomy with Oophorectomy), NCIT:C1898 for calcitriol (Physical Carcinogens), and two UBERON terms. Every CURIE in the entry was instead checked against the committed term cache or looked up directly with OAK. The Czech dysplasia naming hazard already recorded in kb/disorders/Czech_Dysplasia.yaml was cross-referenced as a differential_diagnoses entry rather than re-derived; PMID:27587938, the citation that entry flags as misattributed, is not cited here. Two reference titles were corrected after the validator flagged mismatches against the cached records. Validated with just validate (50/50 snippets verified), check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

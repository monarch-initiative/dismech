  summary: 'Review round 1: ferritin, therapeutic agents, nonproteolytic mechanism'
  details: |
    Addressed the automated reviewer's CHANGES_REQUESTED on PR 10041. Three IMPORTANT findings, all accepted. Added serum ferritin as a phenotype - the discriminating value, abnormal by being higher than acquired iron deficiency rather than lower - plus the macrophage-sequestration evidence that explains it, and softened the differential-diagnosis claim that IRIDA and acquired iron deficiency look identical on an iron panel, which the entry's own cached source contradicted. Added CHEBI:29033 iron(2+) as therapeutic_agent on both iron treatments. Incorporated PMID:32384154, which reframes the headline mechanism discussion: in vivo dissection shows the catalytic domain is required for hepcidin suppression but its proteolytic activity is not, so the disease may be a loss of partner binding rather than of proteolysis - which matters because every functional assay used to classify a novel TMPRSS6 variant reads out cleavage. Also acted on the reviewer's lower-priority pointer to two unconsumed papers, which turned out to matter more than flagged: PMID:23319530 documents a genotype-confirmed kindred responsive to oral iron and presenting with hyperferritinemia, and PMID:36261087 a proband with normocytic anaemia. Both falsified OBLIGATE frequency bands, which are demoted to VERY_FREQUENT with the counterexamples curated as REFUTE evidence. Applied three suggestions: dropped an inapt DECREASED modifier on the hepcidin node's GO binding, moved two treatment-response phenotypes from category Laboratory to Treatment Response, and added external_assertions for OMIM and Orphanet. Settled the reviewer's disclosed uncertainty about GeneReviews - no chapter exists for IRIDA or TMPRSS6, confirmed by PubMed search, now recorded in notes. Snippets 72/72 verified; full gate battery re-run clean.

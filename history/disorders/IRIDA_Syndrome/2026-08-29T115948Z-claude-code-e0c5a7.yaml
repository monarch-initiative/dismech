  summary: 'Create: IRIDA Syndrome, MONDO:0008788'
  details: |
    De novo curation of IRIDA (biallelic TMPRSS6 loss of function) from primary literature, with an OpenScientist deep-research report run alongside and committed under research/. Eight-node pathograph: TMPRSS6 loss of function branching into two parallel published mechanisms - ectodomain cleavage of membrane hemojuvelin, and a cytoplasmic-domain effect on the Hamp proximal promoter - converging on inappropriately elevated hepcidin, which blocks ferroportin-mediated export at the duodenal enterocyte and the macrophage, giving systemic iron restriction and iron-restricted erythropoiesis. Eleven references, all fetched via 'just fetch-reference'; 62/62 snippets verified. Four references were leads the deep-research report surfaced and were independently verified on PubMed before use; two of them changed conclusions rather than adding detail. The TSAT/hepcidin ratio study contradicted a draft claim that no validated decision rule existed, and the anti-TMPRSS6 antibody Phase 1 trial supplied human causal evidence for the hepcidin node. Curated a definitions PHENOTYPE_ALGORITHM for the TSAT/hepcidin ratio with its method-bound threshold recorded as inclusion criteria rather than prose caveats, plus two discussions: the unresolved ectodomain-versus-cytoplasmic-domain mechanism question, and a HUMAN_MODEL_MISMATCH on matriptase-2 stabilising neogenin in mouse liver while cleaving it in hepatoma cells. Validated with validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys and validate-disorders.

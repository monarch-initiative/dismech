  summary: 'Create: Neurodevelopmental Disorder With Spasticity, Seizures, And Brain
    Abnormalities (NSRP1)'
  details: |
    Created kb/disorders/Neurodevelopmental_Disorder_With_Spasticity_Seizures_And_Brain_Abnormalities.yaml
    for MONDO:0859275 / OMIM 620001, NSRP1, closing the stub of the same name
    (deleted in this change) and claim issue #18549. Duplicate preflight was run
    against origin/main, all PRs and all issues by MONDO ID, gene symbol and
    disease name: nothing covered it, and the only prior mention of NSRP1 in kb/
    is a row in an unrelated Wilson's disease microarray artifact table.

    Deep research. The antigravity provider was requested for this entry and is
    the only one used; no fallback was needed. One run, 1202 s, 72 retrieval
    calls, 15 citations, model gemini-4-carbon-medium, run status SUCCESS. The
    report is committed under research/. It passes `just preflight-dr` against
    MONDO:0859275 with NSRP1 as the named gene (73 mentions), so it is not about
    a different disease; it also cites OMIM 616173, which is the NSRP1 gene entry
    rather than a second disease.

    Both of the report's validation blocks carry needs_review: true. Reference
    validation resolved 10 of 10 identifiers with confabulation_rate 0.0 and
    flagged one reference as off topic. Term validation resolved 65 of 75 terms
    with none unresolved; the one label worth a second look is HP:0001250, which
    the report calls "Seizure (Epilepsy)" against HPO's "Seizure", a harmless
    paraphrase. Ten terms were unverifiable because OMIM, Gene and MGI have no
    resolver, one (UBERON:0004720) could not be reached, and one
    (UBERON:0002037) resolved but could not be checked for obsolescence. No
    CURIE was taken from the report: every binding in the entry was resolved
    against a local ontology build, the committed term caches, or the Alliance
    API in the step it was written.

    Two misattributed PMIDs in the report, both verified against NCBI esummary
    in this session. The report cites PMID:22342930 as Kovacevic et al. on
    CCDC-55 in C. elegans; that identifier is "The role of hydration in protein
    stability: comparison of the cold and heat unfolded states of Yfh1"
    (J Mol Biol, 2012), and the paper the report means is PMID:22285439. It
    cites PMID:34033671 as the Nucleic Acids Research thymocyte study; that
    identifier is a hemodialysis outcomes paper (PLoS One, 2021), and the paper
    it means is PMID:34037780. The entry cites the correct identifiers in both
    cases. Worth recording for the provider-quality question: because both wrong
    identifiers resolve to real papers, confabulation_rate was 0.0, the
    relevance check flagged one and missed the other entirely. A clean
    confabulation rate says nothing about whether a citation names the paper the
    text describes.

    Sources and scope. A PubMed search on NSRP1 returns 18 records, of which
    exactly two are about this disease: PMID:34385670 (six patients, three
    consanguineous families from Egypt, Iran and Pakistan; cached as full text)
    and PMID:38808951 (one compound heterozygous patient at the milder end;
    abstract only, the publisher declined full text). Three mechanistic papers
    are cited (PMID:21296756 full text, PMID:26797131 abstract, PMID:34037780
    full text), along with the nematode ortholog study PMID:22285439 (full text)
    and the ClinGen gene-validity assertion
    CGGV:assertion_aedfe664-3c38-4478-aab0-32820b3bc8b4-2024-12-16T170000.000Z.
    `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
    StatPearls against the committed Bookshelf index snapshot of 2026-09-10
    (958 GeneReviews, 9,646 StatPearls), so the phenotype baseline comes from the
    two clinical reports and ClinGen's summary rather than from a review chapter.

    What is in the entry: ten pathophysiology nodes running from the biallelic
    lesion through the two allelic routes (loss of the C-terminal nuclear
    localization signal, and transcript depletion) to cytoplasmic
    mislocalization, loss of NSRP1-dependent splice-site selection, unopposed
    SRSF1/SRSF2 activity, mis-splicing of splicing-factor and cell-cycle
    transcripts, disrupted brain development, and the two clinical nodes;
    22 phenotypes; one gene record with five variants; three animal models with
    typed divergences; two diagnostic routes; one treatment; and four
    discussions.

    The most important curation decision is what the entry declines to assert.
    Four edges into and out of `Disrupted Brain Development` carry
    causal_link_type: UNKNOWN, because nothing connects NSRP1 to any
    neurodevelopmental step: the mouse, fly and nematode nulls all die before
    there is a brain, and the only global splicing profile of NSRP1 loss was
    made in mouse thymocytes. Those edges exist so the pathograph is not
    fragmented into an unconnected molecular half and clinical half, and they are
    marked UNKNOWN so no reader mistakes them for mechanism. The evidence items
    on two of them are graded NO_EVIDENCE and cite the authors' own statements
    that the question is open.

    relationship_type on the gene record is UNKNOWN rather than CAUSATIVE,
    following the precedent set by TPM4-related_Platelet_Disorder: the schema
    reserves CAUSATIVE for ClinGen Definitive or Strong validity and ClinGen
    rates this pair Moderate (Cerebral Palsy Gene Curation Expert Panel,
    16 December 2024, SOP11). The reasoning is recorded in the gene record's
    notes, together with the point that the tier reflects proband count (four by
    ClinGen's count) rather than any doubt about direction. The tier itself is
    carried structurally in gene_disease_validity as MODERATE / CLINGEN with the
    CGGV assertion id, quoting the ClinGen row and summary.

    Two genuine tensions in the literature are recorded rather than resolved.
    First, the same laboratory's 2011 siRNA knockdown found no change in
    SR-protein alternative splicing activity or speckle localization, which cuts
    against the 2016 deletion-construct result that NSrp70 reverses SRSF1 and
    SRSF2 splicing activity; this is carried as a REFUTE evidence item on the
    `Unopposed SRSF1 and SRSF2 Splicing Activity` node and as a CONTROVERSY
    discussion, noting that the knockdown is the design closest to the patients'
    partial loss. Second, patients survive where animal nulls do not; the
    authors offer hypomorphic alleles or reduced human dependence as
    alternatives and test neither, which is carried as a HUMAN_MODEL_MISMATCH
    discussion with the nematode null-versus-RNAi contrast as supporting
    evidence.

    Model-organism gene bindings were resolved at source rather than from
    memory, which mattered: NCBI Gene lists two MGI identifiers against mouse
    Nsrp1 (MGI:2144305 and MGI:700597), and the Alliance API returns
    "No gene found with ID: MGI:700597", so MGI:2144305 is the gene. Both MOD
    bindings were then confirmed symbol-by-symbol against the Alliance
    (MGI:2144305 Nsrp1, Mus musculus; WB:WBGene00007627 ccdc-55, Caenorhabditis
    elegans) and cached by `just check-gene-namespaces-online`. cache/wb/ is a
    new directory: this is the first WormBase gene binding in the knowledge base.

    Two ontology absences are recorded instead of being papered over. HPO has no
    term for opercularization, so Under-opercularization is bound to HP:0002538
    Abnormal cerebral cortex morphology with the searches that establish the
    absence written out on the row (`t~opercular` and `search operculum` against
    the local build return only UBERON:0010262, an anatomical term). Early death
    carries no phenotype_term at all, because every HPO death term is
    age-specific and the cached full text gives no age at death.

    Content from the antigravity report that was checked against the cached
    sources and deliberately not used is listed in the entry's review_notes:
    named antiseizure drugs and baclofen, none of which appears anywhere in
    either clinical paper; a claim that three of six patients achieved seizure
    control, which is the untested complement of the reported drug-resistant
    fraction; an assertion that the 2024 patient had no infantile epilepsy, where
    the abstract is silent; cerebellar atrophy, corpus callosum hypoplasia or
    aplasia, and spastic tetraplegia, each more specific than the source;
    leaky translation re-initiation at p.Gln18Ter; a Belgian origin for the 2024
    patient; and intron retention across Srsf1, Son and Sf3b1, none of which
    terms appears in the cached full text of the paper cited for it.

    Validation, all run on the final tree. `just validate` passes with 109 of 109
    snippets checked and 0 issues; the 109 reference_titles were added
    programmatically by scripts/backfill_reference_titles.py, read verbatim from
    the cache frontmatter, and a structural comparison against the pre-backfill
    copy confirms reference_title was the only field that changed. Term
    validation passes against the local ontology builds. The per-file gates
    check-entity-refs, check-causal-targets, check-name-collisions,
    check-duplicate-keys, check-enum-values and check-block-scalar-comments all
    pass. The whole CI gate list was run locally through
    scripts/run_ci_gates.sh with the 36 gates extracted from the `Run whole-repo
    gates` step of .github/workflows/main.yaml, so the local run matches CI
    rather than a hand-picked subset. Four single term-cache rows were added
    (MONDO:0859275 in cache/mondo/terms.csv and the DiseaseTerm enum cache,
    hgnc:25305, MGI:2144305) plus the new cache/wb/terms.csv; all are additive
    and in canonical order. MONDO:0859275 was seeded by a one-off validate
    against the local sqlite:obo:mondo adapter, the documented workaround in
    conf/oak_config.yaml, and that file was restored byte-for-byte afterwards.

    Sixteen of the 22 phenotype rows are reached by a causal edge, 72.7 per cent
    by `just list-disconnected-phenotypes`. The six that are not are listed with
    reasons in the entry's review_notes: four come from the 2024 case report,
    whose abstract gives no imaging and so supports no edge from the
    brain-development node for that patient; Abnormal facial shape is unwired
    because the founding authors state there is no recognisable pattern; and
    Early death is unwired because the paper states the cause is unclear.

    Review round 1 on PR #18564, recorded here because these are corrections to
    the session's own work rather than facts about the disease.

    The `test (3.13)` job failed on
    check_failure_to_recapitulate_links_are_substantiated: the mouse gene-trap
    model's FAILS_TO_RECAPITULATE link carried `limitations` and `divergences`
    but no `evidence`, which CLAUDE.md requires for that relationship because it
    is a substantive negative claim. Evidence was added on the link itself, as
    distinct from the evidence already on the model: the embryonic-lethality
    sentence from PMID:21296756 and the authors' statement in PMID:34385670 that
    the early lethality is what has prevented NSRP1 from being studied in the
    brain. The process error worth recording is that the 36 whole-repo gates from
    `scripts/run_ci_gates.sh` cannot see this check. It lives in
    tests/test_data.py and runs in CI's path-gated `Test changed KB entries`
    step, which a curation PR triggers and the gate list does not cover.
    `just test-kb-files <file>` is the local equivalent and now passes; it
    belongs in the pre-push routine alongside the gate script.

    Two review findings were accepted. First, the phenotype-connectivity
    sentence in review_notes was wrong in both numbers and named three
    unconnected rows where there are six; it claimed 20 of 23 where
    `just list-disconnected-phenotypes` reports 16 of 22, the extra two being
    Gait ataxia and Abnormal facial shape. Corrected here and in the entry.
    Second, the Drosophila nito sentence was graded quote_role:
    PRIMARY_RESULT in two places although it restates another group's work and
    ends in a citation; both are now BACKGROUND. The reviewer's further
    suggestion to drop quote_role from the two "it will be important to
    examine..." items was taken, since a statement of intended future work is
    neither the paper's finding nor a restatement of anyone else's.

    The reviewer also suggested, optionally, adding a Drosophila animal-model
    record so the "lethal in three species" argument would rest on the primary
    fly papers. Checking that suggestion refuted the argument instead, and the
    entry now records why. The founding paper writes "D. melanogaster ortholog
    CG15747 (also known as nito)", but those are two different fly genes: NCBI
    Gene gives nito as spenito, FBgn0027548 / CG2910, a SPEN-family nuclear
    protein, and CG15747 as FBgn0030474, an uncharacterized protein, as separate
    records; the Alliance of Genome Resources stringent orthology set for
    NSRP1 returns FB:FBgn0030474 and does not contain nito; and the cached
    abstract of the axon-outgrowth paper (PMID:28916169, fetched while checking
    this) describes NITO as a SPEN-family protein throughout. So the only
    neural result anyone has offered for this gene is a result about a different
    gene. No Drosophila model was added, the nito evidence items are now marked
    as drawing on their first clause only, the fly claim was removed from the
    HUMAN_MODEL_MISMATCH prompt and qualified in its rationale, the nematode
    link's "third lineage of animals" became "second animal lineage", and the
    discrepancy is written up in the entry's notes with both FlyBase
    identifiers. PMID:28916169 was fetched during this check and is deliberately
    not cited by the entry, since it is evidence about spenito.

    After these changes `just validate` passes with 111 of 111 snippets and 111
    of 111 titles checked and 0 issues, `just test-kb-files` passes, and the 36
    whole-repo gates were re-run.

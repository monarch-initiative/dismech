  summary: 'Genetics pass (d2g series-047): Methylmalonic_Acidemia'
  details: |
    Genetics pass on the Methylmalonic Acidemia umbrella for issue #12254 (d2g series-047).
    Confirmed the disease_term anchor MONDO:0002012 is correct for an umbrella entry. Took the
    GeneReviews chapter "Isolated Methylmalonic Acidemia" (PMID:20301409) as the baseline: it
    establishes the diagnosis on biallelic variants in MCEE, MMAA, MMAB, MMADHC or MMUT, of
    which only three were curated. Bound hgnc CURIEs to the three genes: descriptors on the
    root pathophysiology node, which carried bare preferred_term values and were therefore
    invisible to a knowledge-graph gene comparison, and added MMADHC there as the cblD
    adenosylcobalamin-branch gene. Added MMADHC, MCEE and CD320 as genetic records with
    ClinGen Definitive evidence, and added two mechanism-specific pathophysiology nodes rather
    than extending the single flat node: "Methylmalonyl-CoA epimerase deficiency" (MCEE,
    GO:0004493) feeding the impaired methylmalonyl-CoA metabolism node, and "Impaired cellular
    cobalamin uptake" (CD320, GO:0015889) feeding the mutase/AdoCbl node. Gene-to-mechanism
    wiring is 6/6. Gave the two vitamin B12 responsiveness has_subtypes rows gene lists and
    reciprocal genetic[].subtype foreign keys, and added a third row, TCblR defect, bound to
    MONDO:0013341, with the ClinGen caveat that the condition is probably benign recorded
    alongside the Definitive grade and the one reported symptomatic exception quoted. Merged the
    lump/split reasoning into the existing top-level notes rather than adding a second notes key:
    MONDO:0009615 and MONDO:0009613 already have their own dismech entries, MONDO:0009612 and
    MONDO:0009614 are still stubs, and combined methylmalonic aciduria with homocystinuria stays
    out of scope. One snippet had to be requoted: the GeneReviews B12-responsiveness sentence
    carries a bracketed "[rare]" qualifier that the reference validator strips, after which the
    remainder no longer matches the source, so the bracket-free genotype sentence from the same
    abstract is quoted and the reason recorded in the row's review_notes.

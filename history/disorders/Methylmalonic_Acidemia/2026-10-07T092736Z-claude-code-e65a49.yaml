  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn screening diagnosis row with diagnosis_term NCIT:C81178 and measurements for C3 (LOINC:53160-8), C3/C2 (LOINC:53163-2), second-tier methylmalonic acid in DBS (LOINC:82385-6) and 2-methylcitrate in DBS (LOINC:82386-4). Reference ranges: the shared C3 and C3/C2 proposed cut-offs from the Serbian study (PMID:35254746, status stated in population and notes), Zhejiang second-tier methylmalonic acid 2.12 umol/L and 2-methylcitric acid 0.70 umol/L (PMID:32615850), and the Ontario second-tier 2-methylcitric acid 1.0 umol/L (PMID:27216769). Total homocysteine on the same second-tier spot is out of scope and not bound. Diagnosis-row evidence added from PMID:27216769 and PMID:32615850. loinc_term Parts added on the Methylmalonic acid (LOINC:LP15735-1), Propionylcarnitine (C3) (LOINC:LP19303-4) and 2-Methylcitric acid (LOINC:LP18136-9) markers. Existing description, evidence and prose on the row were left unchanged.

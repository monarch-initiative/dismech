  summary: 'Review round 1: correct notes claims falsified by this PR'
  details: |
    Blocking finding on PR 12897. The entry's notes said MONDO:0700298 isolated methylmalonic aciduria cblD type is not bound anywhere in the KB and that the cblD-MMA subtype row is where it belongs - in the same PR that bound it on exactly that row, so the sentence was false on merge. It now states where the term lives: the cblD entry's disease_term is the cblD homocystinuria class MONDO:0700297 and its cblD-MMA subtype row carries MONDO:0700298. The same paragraph said three of the five GeneReviews genes have their own entry or stub when by its own account all five are represented outside this entry; corrected, and the MMUT and MMAB stubs are now named as stubs rather than folded into the count. This is the second instance in this campaign of prose describing repository state being falsified by the same PR that changed that state, after the CMT4K explanation on PR 12775, so the general lesson is to prefer stating where a thing is over what is missing.

  summary: 'Gene-family review: MMADHC, CD320'
  details: |
    CD320 (transcobalamin receptor) is typed CAUSATIVE and now carries variant_origin GERMLINE and the ClinGen Definitive tier for methylmalonic acidemia due to transcobalamin receptor defect (MONDO:0013341, the TCblR defect subtype's term; CGGV:assertion_d98515f5-4296-4d41-95a9-adac90c00349-2022-09-23T160000.000Z, already cited). Its node binds GO:0038024 cargo receptor activity as DECREASED, which is correct for a receptor that internalizes cobalamin-loaded transcobalamin. MMADHC (cblD) now has variant_origin GERMLINE; its ClinGen record is against MONDO:0019220 rather than this entry's methylmalonic acidemia term, so no tier was copied. MMADHC, MMAA and MMAB share a pathway node whose only molecular function is MMUT's methylmalonyl-CoA mutase activity; MMADHC was not given its cobalamin-binding term there, because the isolated-MMA form of cblD arises from N-terminal alleles that leave the cobalamin-binding C-terminal domain intact.

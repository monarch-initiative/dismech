  details: |
    ai4c-reviewer round on PR 12852. CRITICAL: removed the PMID:28187042 evidence (a gut-to-surgical-wound MRSA study cited for the opposite of its finding: IV MRSA plus muscle injury produced NO infection); the trauma link is now supported from human data (PMID:29338140 25.8% trauma history; PMID:39971676 minor trauma) and the misreading sentence is dropped from the node description, and the uncited cache file was pruned. Wired the graph: abscess node -> Fever/Myalgia/Functional impairment; complication node -> Osteomyelitis/Septic arthritis/Sepsis phenotypes (added, HP:0002754/HP:0003095/HP:0100806). Gave the Functional impairment phenotype a phenotype_term (HP:0001288 Gait disturbance; HP:0002355 is obsolete) and fixed its anatomic-distribution evidence to the painful-limp sentence. Added a diagnosis section (MRI, NCIT:C16809, PMID:40440680 100% sensitivity). Added an environmental section: muscle trauma and host immunocompromise, each with entry-level evidence and influences_mechanisms PREDISPOSES -> seeding node (PMID:29338140, 39971676, 32147332, 34407271 HIV/AIDS). Bound flucloxacillin/vancomycin/clindamycin/linezolid (CHEBI) as therapeutic_agent. Dropped deprecated updated_date. validate-disorders clean, all gates green including check-environmental-evidence.

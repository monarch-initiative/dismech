  details: |
    Created a new Pyomyositis entry from OpenScientist deep research. Curated Staphylococcus aureus as the dominant infectious agent, the hematogenous seeding of injured skeletal muscle to intramuscular neutrophilic abscess formation to septic/local-extension complication chain, core fever/myalgia/functional-impairment phenotypes, and antibiotic plus abscess drainage treatment records. Ran OpenScientist preflight; the gene-based identity preflight skipped because MONDO:0019168 has no causal human gene, and manual MONDO inspection confirmed the intended pyomyositis record and its tropical/suppurative myositis synonyms.

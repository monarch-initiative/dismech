  details: |
    Review round 1 on PR #13491, blocking finding 2. The third transmission block, 'Tropical and temperate at-risk populations', was not a transmission route: it described where the disease occurs and who is susceptible (share of tropical surgical admissions, rising temperate reports, the HIV odds ratio), which presented geography as a route. Removed the block. Its substance is folded into the haematogenous block's description as one qualitative sentence noting that the same route accounts for the disease in both settings and that susceptibility differs. No evidence was lost: all three snippets were already curated elsewhere in this entry before the transmission backfill - the tropical surgical-admissions quote at pathophysiology[1].evidence[0], and the HIV/AIDS association at environmental[1] including on its influences_mechanisms link. The only snippet unique to the removed block was 'It is increasingly being reported from high-income temperate countries', a pure epidemiology sentence with no route content. Did not create a prevalence: section for it: the quoted figure is a share of surgical admissions rather than a population rate, so it has no honest home in the Prevalence class, whose measure_type and rate_denominator slots would have to be guessed. Kept the antecedent-injury block, with reasoning given in the PR reply. Validation: just validate passed; snippets verified; MISSING_TRANSMISSION stays cleared.

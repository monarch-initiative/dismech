  summary: Ground IGHMBP2 in its helicase activity node after CI
  details: |
    CI identified one newly ungrounded gene: IGHMBP2 was linked to genetic lesion nodes but not explicitly to the existing molecular-function node. Added the gene descriptor to Impaired IGHMBP2 Helicase Activity, which already carries validated DNA- and RNA-helicase molecular functions. This preserves the atomic separation of genotype and functional consequence. In the same repair, took the optional H922Y wording suggestion from the independent approval: the readout now says modest late gastrocnemius decrease, and the model evidence explanation limits the activity-severity correlation to tested alleles. Other optional suggestions retain the source-scope rationale documented in the PR. Validation results are recorded in the PR after the repaired grounding check and entry validation.

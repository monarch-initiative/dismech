  details: |
    Review round on PR #11290 (changes requested: two important findings, four optional). Finding 1: the Disturbed Ribosome Biogenesis and Translation node claimed decreased translation and a low-grade integrated stress response without a supporting citation; added two IN_VITRO evidence items from Park 2024 (PMID:38803225, the PubMed record of DOI 10.26508/lsa.202302554 that the branch had cached but not cited) quoting the reduced-global-translation and ATF4 reporter sentences. Finding 2: added reference_title to both clinicaltrials:NCT05152823 evidence items. Optional suggestions taken: fetched PMID:25439726 (Cottenie 2014, the CMT2S gene-discovery paper, whose DOI cache had no content) and cited it twice on the genetic block for the 11 recessive families and the residual-protein-level basis of the CMT2S-versus-SMARD1 distinction; replaced the remaining mid-sentence frequency-list fragment on Gait disturbance with the full sentence; appended a note to the cohort-derived explanation on Distal muscle weakness, Gait disturbance, Foot dorsiflexor weakness and Pes cavus that the frequency band is inferred from the presenting-symptom share, a lower bound on lifetime frequency. Not taken: the two unconsumed caches (Tian 2023, Tran 2024) remain uncited as secondary. Validation: just validate pass, count-verified-snippets 60/60, validate-terms pass, check-causal-targets, check-entity-refs, check-enum-values, reference-title, snippet-grading, snippet-length and title-snippet gates clean.

  summary: Review CMT2S clinical scope and full-text mechanistic evidence
  details: |
    Reviewed the complete CMT2S entry and the falcon research narrative, citation list,
    and companion evidence map. The disease-specific identity MONDO:0014511 remains
    appropriate; SMARD1 is an allelic differential, not a CMT2S subtype. This review
    follows design decisions 3, 6, 7 and 18.

    Full-text evidence materially changes the account. PMID:38803225 reports modest
    translation suppression and reversible ATF4/ISR activation in engineered K562
    cells, but no gross ribosome-biogenesis defect, no detected CHOP induction and
    uncertain relevance to peripheral neurons. Separated these findings from the
    hypothetical pre-rRNA-processing mechanism motivated by PMID:36480289 and
    PMID:38403020. Restricted allele/activity correlations to tested alleles and
    removed a universal residual-activity threshold and unsupported complete
    penetrance. Intrafamilial discordance is retained.

    PMID:40060931 supplies the intron-8 c.1235+894C>A pseudoexon/NMD mechanism,
    direct distal weakness/atrophy and scoliosis observations, and the composition
    of the functional NMJ chip (patient iPSC-derived motor neurons plus healthy
    iPSC-derived muscle). Anatomical denervation and functional fatigue are now
    separate nodes. Rat tolerability is not represented as an absence of findings.
    PMID:39461706 full text distinguishes the late, modest H922Y NMJ phenotype
    from severe D564N/H922Y compound-heterozygote disease. PMID:41486111 supports
    SMARD1 mouse gene therapy only. PMID:37372153 full text supports induced-neuron
    morphology rescue but not restoration of reduced conversion yield; these
    mixed neurons and intermediate-spectrum patients are not a pure CMT2S motor
    neuron model.

    Removed phenotype frequency bands unsupported by the cited presenting-symptom
    counts or small series. Corrected the motor-delay denominator. Replaced an
    unsupported pes-cavus specificity with source-unspecified foot deformity; added
    areflexia from CMT2S synthesis and scoliosis from the direct clinical report.
    The literature case count and referral-cohort percentages are not population
    prevalence. Recovered the full Tran report through the sanctioned DOI fetcher
    and used its CMT2S patient-4 course. PMID:38046662 was recovered as full XML;
    its discussion includes CMT2S truncating-allele exceptions, so the research
    report's blanket two-truncating-alleles claim was not adopted.

    GeneReviews baseline check returned TAGGED_OVERVIEW. PMID:20301532 has only
    a purpose abstract and is not a phenotype baseline; the cached full NBK1358
    chapter supplies general CMT exercise, orthoses, surgery, pain care, weight
    management, vincristine precaution and recessive/reproductive counseling,
    explicitly identified as broader-CMT evidence. ClinicalTrials.gov API v2 was
    read on 2026-11-06: record updated 2026-10-30, enrolling by invitation, phases
    I and II, ages 2 months to 14 years, estimated enrollment 10. The schema's
    single phase field retains PHASE_I with the combined phase explained.

    Content-completeness assessment: phenotype coverage adequate after corrections;
    subtypes not applicable within the defined CMT2S scope; pathophysiology adequate
    with explicit uncertainty; treatment/trial coverage adequate; genetic depth
    adequate including the deep intronic allele; diagnostics adequate including
    RNA/genome testing and possible superimposed immune neuropathy; central
    reference coverage adequate; overall research consumption adequate. General-CMT
    rehabilitation studies and SMARD1-specific downstream hypotheses are not
    promoted into demonstrated CMT2S outcomes.

    Retrieval limitations: forced PMID refreshes for 25439726, 36413117 and
    35660062 retained abstract-only text. Publisher/PMC URL retries did not yield
    usable cached full articles; challenge/API information pages were not cited.
    No reference cache was hand-authored. Successful full-text cache additions
    and the Tran cache upgrade are included; metadata-only refreshes are excluded.

    Validation: schema and ontology checks passed; all 97 snippets and 99 titles
    verified. Pathograph targets, naming, coarse bindings, discussion targets,
    snippet boundaries, history schema and pre-commit checks passed. Final
    repository-wide consistency results are recorded in the PR.

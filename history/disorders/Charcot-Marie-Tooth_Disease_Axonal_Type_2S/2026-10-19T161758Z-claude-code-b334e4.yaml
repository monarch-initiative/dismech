  summary: Complete the VCA-894A antisense oligonucleotide record
  details: |
    Completed the n-of-1 antisense oligonucleotide treatment record from the cached full text of PMID:40060931, while curating the sibling KAND ASO content. The block previously carried no drug name, no chemistry and no delivery platform, and used the deprecated aso_details/aso_mechanism spelling. Named the agent VCA-894A as a therapeutic_agent, migrated the nested block to oligonucleotide_details, added a Treatment-level delivery_system (UNFORMULATED, UNCONJUGATED), set treatment_effect RESTORES on the existing target_mechanisms link, named the c.1235+894C>A intron 8 variant that creates the cryptic acceptor, and added three evidence items for the agent chemistry, the neuromuscular-junction functional rescue and the rat intrathecal toxicity study. This removes one LEGACY nested-only delivery record (81 to 80). No new ontology terms were bound.

    A pre-PR self-review in fresh context changed three things here. oligonucleotide_chemistry was first bound to PHOSPHOROTHIOATE and is now TWO_PRIME_O_METHOXYETHYL: the source says "phosphorothioate and 2'-O-MOE", the slot is single-valued, and the sugar is the modification that identifies this design. The KB bears that out, with 23 TWO_PRIME_O_METHOXYETHYL bindings against 2 PHOSPHOROTHIOATE, the other being fomivirsen, a first-generation PS-only ASO with no 2' modification; the enum also describes PHOSPHOROTHIOATE as RNase H chemistry, and this ASO is splice-modulating. The rat evidence snippet was swapped for the sentence that also carries the NOAEL, so the description's NOAEL claim is quoted rather than uncited. treatment_effect RESTORES was added to the neighbouring AAV9 gene-therapy link to the same node, whose own description already said it restores IGHMBP2 expression, so the two links no longer differ in a way that reads as a claim.

    Validated with just validate, just validate-terms, just count-verified-snippets and just validate-disorders alongside the KIF1A entry, plus the entity-ref, enum-value, delivery-system and snippet-grading gates.

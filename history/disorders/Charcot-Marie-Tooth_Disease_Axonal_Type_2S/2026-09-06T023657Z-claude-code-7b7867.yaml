  details: |
    Created CMT2S as a Disease entry separate from the allelic SMARD1 entry (stub entry_type decision: DISEASE), conforming to the peripheral_axonal_degeneration module at the insult, distal-degeneration and length-dependent-dysfunction nodes. Sources: PMID:25568292, PMID:27450922, PMID:28202949, PMID:28065684, PMID:35660062 (cohorts and variant spectrum), PMID:36413117 and PMID:39461706 (CMT2S mouse models), PMID:38403020 and PMID:36480289 (residual-activity genotype-phenotype correlation and ABT1), PMID:39119929 (mechanism review), PMID:40060931 (personalised ASO), PMID:41486111 (AAV9 gene therapy), clinicaltrials:NCT05152823 (intrathecal AAV9-IGHMBP2 trial, fetched and cached), PMID:30409445 and PMID:41468720 (atypical presentations). GeneReviews: no CMT2S-specific chapter; the CMT Hereditary Neuropathy Overview (PMID:20301532) is tagged. Deep research: Edison/falcon report research/Charcot-Marie-Tooth_Disease_Axonal_Type_2S-deep-research-falcon.md (10/10 references verified, 36/38 terms verified, preflight-dr PASS); the report's suggested GO:0023055 (axon maintenance) is obsolete and was not used. Scoliosis and areflexia were not curated for lack of quotable abstract evidence. Validation: just validate pass, just validate-terms pass, count-verified-snippets 56/56, check-causal-targets and check-entity-refs clean.

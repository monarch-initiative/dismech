  summary: 'Create: MPIG6B-Related Thrombocytopenia and Myelofibrosis'
  details: |
    New entry for MONDO:0044316, curated from primary literature with one deep-research report (openscientist) used as leads.

    Naming: the MONDO label 'thrombocytopenia, anemia, and myelofibrosis' names a phenotype triad that many other diseases produce, so per design decisions section 18 the entry takes the gene-scoped name MPIG6B-Related Thrombocytopenia and Myelofibrosis. That form is established: it is a MONDO EXACT synonym attributed to ClinGen ('MPIG6B-related thrombocytopenia, anemia, and myelofibrosis'), and it is the title of PMID:41838173. The MONDO label, THAMY (the OMIM abbreviation) and 'congenital macrothrombocytopenia with focal myelofibrosis' are kept as synonyms. Lump/split: a single gene, a single MONDO class, no subtypes; the ASXL2 myelodysplastic-syndrome case is recorded as a knowledge gap rather than a subtype or a separate entry.

    Content: 13 pathophysiology nodes from the biallelic lesion through loss of the G6b-B receptor, loss of heparan-sulfate-triggered Shp1/Shp2 recruitment, unrestrained ITAM-Syk signalling with metalloproteinase-driven receptor shedding, the megakaryocyte maturation and proplatelet defect, megakaryocyte accumulation and clustering, perimegakaryocytic marrow fibrosis (conforms_to fibrotic_response#Excessive ECM Deposition), marrow replacement with ineffective haematopoiesis, splenic extramedullary haematopoiesis and megakaryocyte-driven bone formation. 19 phenotypes, all 19 causally connected (just list-disconnected-phenotypes reports 100 percent). ClinGen Definitive (AR, Hemostasis/Thrombosis GCEP) copied into gene_disease_validity with the CGGV record quoted. Five variants, 8 treatments, 3 mouse models on MGI:2146995, 2 knowledge gaps (the route from the megakaryocyte cluster to the fibrosis, and whether germline MPIG6B variants predispose to a myeloid neoplasm). The profibrotic-signalling step is curated as a candidate with indirect evidence, because both the reviews and the mouse work state it as proposed or likely rather than shown.

    Deep research: exactly one report, research/MPIG6B-Related_Thrombocytopenia_and_Myelofibrosis-deep-research-openscientist.md. The run exited 3 because its own term validation timed out against EBI (MedGen:C4479504, 5 s read timeout), so the report arrived with no validation record at all: neither a Term Validation nor a Reference Validation section (related to dismech#11896). Both were added here by rerunning just validate-research-terms and just validate-research-reference, and the report is committed with those sections. References: 8 of 8 resolved, 0 unresolved, 8 of 8 on topic; 1 of 1 quoted claims not found in its source ('frequently described in the Arab population', attributed to PMID:38694137, which is a loose paraphrase of that paper's own title rather than a sentence in it). Terms: 35 checked, 30 resolved, 1 unresolved (NCIT:C29087, offered for IVIG, does not exist), 4 unverifiable, and 13 named as a different term, including every NCIT treatment identifier the report suggested (NCIT:C66919 is Photoimmunotherapy not Romiplostim; NCIT:C15280 is Breast Conservation Treatment not Transfusion; NCIT:C1876 is Lurtotecan Liposome). No CURIE was taken from the report: every identifier in the entry was looked up in OLS or read from a cache file in the step that wrote it. just preflight-dr returned PASS (MPIG6B mentioned 40 times, OMIM 617441 agreeing with MONDO, resolved over OLS with no local MONDO build). The report's HPO frequency table (Monarch disease annotations) was not used, since it has no citable source document in the cache. Its HP:0040326 suggestion for macrothrombocytopenia resolves to Hypoplasia of the olfactory bulb; HP:0040185 was bound instead. Its HP:0004823 Anisopoikilocytosis suggestion was adopted, replacing an initial Poikilocytosis binding, because the case reports use that exact word.

    Validation: linkml-validate, just validate-terms, 129/129 snippets verified, and just validate-disorders all pass (the gate initially failed two snippets that ended mid-word at a Greek letter, 'GPIb' and 'FcR'; both were extended to the full source phrase). check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-delivery-system, check-name-collisions, check-gene-namespaces (online, after caching MGI:2146995), check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-shared-disease-terms, check-folded-hyphens and check-cache-order all pass; list-gene-term-mismatches reports no mismatch. just check-genereviews --online reports NO_CHAPTER for both GeneReviews and StatPearls, which the entry's notes record. Stub stubs/Thrombocytopenia_Anemia_And_Myelofibrosis.yaml deleted.

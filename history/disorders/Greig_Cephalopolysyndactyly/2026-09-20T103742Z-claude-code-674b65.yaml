    Fetched and cited the GeneReviews chapter PMID:20301619, which was not previously cited: one
    quote establishes GLI3 as the disease gene and sources the chromosome 7p14.1 location that the
    genetic record's notes: already asserted without a citation, and a second sources the autosomal
    dominant inheritance now recorded on the relationship. The chapter is tagged GeneReviews in the
    top-level references block. Allelism with Pallister-Hall syndrome was already correctly recorded
    in the notes with its positional genotype-phenotype evidence and was not changed. Validated with
    just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches,

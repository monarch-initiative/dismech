  details: |
    New entry for tuberculous empyema (MONDO:0005999), the purulent, multibacillary form of pleural tuberculosis, kept distinct from the paucibacillary hypersensitivity effusion curated as the Tuberculous Pleuritis node of Tuberculosis.yaml. Eleven pathophysiology nodes run from pleural seeding through the hypersensitivity precursor to multibacillary purulent infection, suppressed fibrinolysis, fibrocalcific rind, impaired drug penetration with acquired resistance, bronchopleural fistula, empyema necessitans, lung entrapment and pyothorax-associated lymphoma; 14 phenotypes, 4 progression phases, 4 diagnosis rows and 4 treatments (chemotherapy, TDM-guided high-end dosing, tube thoracostomy, decortication). No subtypes; the lump decision is recorded in review_notes. Deep research: research/Tuberculous_Empyema-deep-research-claude_code.md (claude_code, second run; the first run was marked unsuccessful and deleted), used as leads only. All 96 snippets verified against cached abstracts or full text with count-verified-snippets; terms validated with validate-terms; validate-disorders run before the PR.

  summary: 'Create: Preterm Premature Rupture of the Membranes'
  details: |
    New Disease entry anchored to MONDO:0012511 (preterm premature rupture of the membranes), curated for issue #7837 (obstetrics coverage gap) by the curation scanner at the high_effort tier.

    Selected because PPROM is the largest identifiable route to preterm birth, which #7837 lists as still absent and flags as the leading cause of neonatal death worldwide. Preterm birth itself has no MONDO term - searched preterm birth, premature birth, preterm labor and obstetric labor complication - so PPROM is the only anchorable disease concept in this part of obstetrics. That gap is recorded as a KNOWLEDGE_GAP discussion rather than worked around, alongside the observation that MONDO classifies MONDO:0012511 under hereditary disease (reachable from MONDO:0003847), which fits the SERPINH1 susceptibility literature but not the multifactorial entity curated here. Both are upstream MONDO items.

    Modelled as a disease of the fetal membranes following Menon's framing: a 13-node pathograph running oxidative stress -> premature senescence -> microfractures, in parallel with two other routes into the same convergence node (ascending colonisation -> intraamniotic inflammation, and decidual haemorrhage -> thrombin -> MMP-1), all reaching MMP-mediated collagen degradation and then loss of amniochorion tensile strength. Mechanical failure is kept as a separate node from rupture itself, because it is the state a predictive biomarker would have to detect. Post-rupture pathology is modelled separately as a breached-barrier problem.

    Ascending colonisation before rupture and ascending infection after rupture are deliberately separate nodes, with a KNOWLEDGE_GAP discussion recording why: amniotic fluid is sampled after the cavity is open, so a positive culture cannot distinguish cause from consequence.

    Genetics: SERPINH1 -656 C>T as SUSCEPTIBILITY (not CAUSATIVE), with the admixture control cited as its own evidence item.

    All six phenotypes are causally connected (100% inlink coverage). Three of the four treatments target consequences rather than mechanisms, which is stated explicitly in notes rather than left implicit in the edges.

    A first draft recorded the PPROMT trial as NCT00194844; that identifier was checked against the ClinicalTrials.gov API and is a different trial (Couples Miscarriage Healing Project). Replaced with the ISRCTN identifier the publication itself cites, fetched via just ictrp-fetch ISRCTN44485060, with phase following the registry's own Not Applicable value.

    Validation: just validate-disorders passed; 50/50 snippets verified against cached references; term validation passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-case-collisions, check-reference-titles, check-not4curation and check-source-defect-claims all clean. check-genereviews reports NO_CHAPTER, which is expected and not a gap for a multifactorial obstetric condition.

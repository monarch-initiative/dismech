  summary: 'Create: Alpha-2-Plasmin Inhibitor Deficiency'
  details: |
    New entry for congenital alpha-2-plasmin inhibitor (alpha-2-antiplasmin) deficiency, MONDO:0009883, SERPINF2. Pathograph: SERPINF2 loss-of-function variants -> ER retention and proteasomal degradation of mutant protein in hepatocytes -> reduced plasma alpha-2-antiplasmin -> unopposed plasmin activity on fibrin -> premature dissolution of the haemostatic plug -> delayed and provoked bleeding phenotypes (all 11 phenotypes causally connected). Treatments: antifibrinolytics (tranexamic acid) and fresh frozen plasma. Animal models: Serpinf2 knockout mouse (recapitulates fibrinolysis, fails to recapitulate bleeding) and Scottish deerhound SERPINF2 p.A202V delayed postoperative hemorrhage. One OpenScientist deep-research report (research/Alpha-2-Plasmin_Inhibitor_Deficiency-deep-research-openscientist.md): the run's built-in validation aborted on an OLS read timeout, so reference and term validation were added afterwards with just validate-research-reference and just validate-research-terms (19/19 references resolved, no unresolved terms); just preflight-dr PASS (SERPINF2 mentioned 24 times). Additional primary references were found by PubMed search. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with just validate-disorders (all snippets verified) and the offline CI gates.

  summary: 'Review round 1: Alpha-2-Plasmin Inhibitor Deficiency'
  details: |
    Addressed the first automated review of PR 13964. Added a genetic record for SERPINF2 (CAUSATIVE, germline) with the ClinGen Definitive gene-disease validity assertion (CGGV:assertion_a8fa2353-ff89-41f1-b030-bde64517edbb-2020-09-23T160000.000Z, row quoted) and four variants (Okinawa, exon 5 frameshift, p.Val384Met, Artas). Bound GO:0004867 on the SERPINF2 variant node so the newly wired gene lands on a molecular function (check-gene-activity-grounding). Added epsilon-aminocaproic acid (CHEBI:16586) as a second antifibrinolytic agent, an intracranial haemorrhage phenotype (HP:0002170) wired from the plug-dissolution node, a ROTEM sentence and evidence in diagnosis, evidence for the normal-fibrinogen sentence, quote_role REVIEW_SYNTHESIS on PMID:31427261 and PMID:19141165 items, directness INDIRECT on the dental-extraction dosing item, and corrected the mouse genotype to 'exon 2 through part of exon 10'. Backfilled reference_title on all 60 evidence items with just backfill-reference-titles. Not done: an Orphanet prevalence record, because ORPHA:465 cannot be built without the Orphadata bulk XML, which is not present in this environment.

  summary: 'Addressed PR 17307 review: debundled cytokine excess, systemic hyperpermeability, and aberrant angiogenesis; qualified VEGF role with bevacizumab REFUTE evidence; enriched plasma-cell genetics; fixed fragment snippets; and added bortezomib therapy'
  details: |
    Removed deprecated top-level updated_date. Preserved SOMATIC variant_origin and plasma cell (CL:0000786) on Clonal Plasma Cell Neoplasm and added primary molecular/cytogenetic evidence for restricted IGLV1-44*01 and IGLV1-40*01 germline usage (PMID:18497319), 14q32 (IGH) translocations and 13q14 deletions (PMID:23957213), and heterogeneous somatic plasma-cell mutations (PMID:33262528). Debundled Vascular Hyperpermeability and Multiorgan Disease into Proinflammatory Cytokine Excess (IL6, TNF, IL12B; GO:0001816 INCREASED), Systemic Microvascular Hyperpermeability (GO:0043114 INCREASED), and Aberrant Systemic Angiogenesis (GO:0001525 INCREASED), routing extravascular volume-overload phenotypes through Systemic Microvascular Hyperpermeability, skin angiomatosis/changes through Aberrant Systemic Angiogenesis, and organomegaly and endocrinopathies through Proinflammatory Cytokine Excess. Qualified VEGF Overproduction as a downstream paraneoplastic mediator rather than sole initiating cause, added supports: REFUTE clinical bevacizumab failure/worsening counter-evidence (PMID:30264176) on VEGF downstream edges, and expanded gap_poems_pathogenesis in discussions. Replaced fragment snippets on Ascites (PMID:30264176) and CIDP (PMID:31012139) with full-sentence quotes, fixed Breakdown capitalization and added HIF-1alpha hypoxia feedback evidence on Endoneurial Microvascular Injury and Blood-Nerve Barrier Breakdown, added Congo red / nerve-biopsy amyloid evidence to AL Amyloidosis differential diagnosis, and added Bortezomib-Based Proteasome Inhibitor Therapy (CHEBI:52717) with peripheral neuropathy exacerbation caveat (PMID:37732822).

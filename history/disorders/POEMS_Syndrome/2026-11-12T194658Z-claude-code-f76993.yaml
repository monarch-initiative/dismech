  summary: 'Audit and enrich POEMS Syndrome: declare VARIABLE_SPECTRUM on Endocrinopathy,
    normalize phenotype categories, expand 6-node pathophysiology cascade wiring 15/15
    phenotypes, and enrich biomarkers, diagnosis, differentials, and treatments'
  details: |
    Added synonyms and WHO 5th-edition icdo_morphology Plasma Cell Neoplasm plus Harrison ONCOLOGY_HEMATOLOGY and NEUROLOGIC classifications with evidence; expanded pathophysiology to 6 atomic nodes (Clonal Plasma Cell Neoplasm with SOMATIC genetic_context, Osteosclerotic Bone Remodeling, preserved VEGF Overproduction anchor with hgnc:12680 VEGFA and growth-factor/cytokine molecular_functions, Endoneurial Microvascular Injury and Blood-Nerve Barrier Breakdown, Demyelination and Length-Dependent Axonal Degeneration conforming to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination, and Vascular Hyperpermeability and Multiorgan Disease) connecting 15/15 phenotypes via bare-name downstream edges; declared coarse_binding_basis VARIABLE_SPECTRUM on Endocrinopathy (HP:0000818), normalized all PhenotypeCategoryEnum values, and added constituent Hypogonadism, Hypopituitarism, Adrenal Insufficiency, Ascites, Pleural Effusion, and Polycythemia phenotypes; enriched biochemical biomarkers with presence, NCIT:C572 Immunoglobulin, and readouts; added 5 NCIT-bound diagnostic assays; bound MONDO:0006702 on CIDP and added AL Amyloidosis (MONDO:0019438) differential; added Daratumumab-Based Monoclonal Antibody Therapy and wired target_mechanisms with evidence across all 4 treatments.

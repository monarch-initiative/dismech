  summary: Absorb POEMS-associated multicentric Castleman disease
  details: |
    As part of the Castleman disease split, POEMS-associated multicentric Castleman disease is curated here rather than as a Castleman entry, because its driver is the clonal plasma cell neoplasm of POEMS and its VEGF output rather than anything specific to Castleman disease.

    Added: a histopathology entry for Castleman-type angiofollicular lymph node hyperplasia recording the POEMS-MCD designation and that 32% of multicentric Castleman cases meet POEMS criteria; a progression entry giving the outcome split by osteosclerotic lesions (90% vs 27% 5-year survival); and a differential_diagnoses entry against idiopathic multicentric Castleman disease. POEMS is listed as a member of kb/groupings/Castleman_Disease.yaml so the historical four-subtype framework is preserved.

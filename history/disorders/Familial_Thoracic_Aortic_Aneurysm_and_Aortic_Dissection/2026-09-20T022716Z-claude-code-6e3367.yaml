  summary: 'Genetics pass: subtype and node gene bindings, THSD4 node, GeneReviews
    baseline'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12196, epic #12189).

    Research first. The GeneReviews baseline for this disease group is "Heritable
    Thoracic Aortic Disease Overview" (PMID:20301299, NBK1120), which the entry did
    not cite. It is now tagged in a new top-level references block. Its fetched
    cache contains only the chapter front matter and statement of purpose, with no
    clinical or genetic body text, so nothing is quoted from it and the entry's
    notes say so. ClinGen's committed gene-disease validity table was read for
    every gene: against MONDO:0019625 the HTAD Gene Curation Expert Panel rates
    FBN1, MYH11 and TGFB2 Definitive; LOX, MYLK and PRKG1 Strong; FOXE3 and MFAP5
    Moderate; BGN, FLNA, TGFB3 and MAT2A Limited. THSD4 has no ClinGen row.

    Wiring. All seven gene-defined has_subtypes rows now carry a genes list. The two
    that do not - AAT1 (11q23 linkage locus) and AAT2 (3p24-p25 TGFBR2-candidate
    locus) - are the two leaf classes MONDO assigns no confirmed causal gene to, and
    their descriptions already say so. Six pathophysiology nodes gained gene
    bindings: the three VASCERN mechanism-class nodes (extracellular matrix; TGF-beta
    signaling; smooth muscle contractile apparatus) and the three gene-specific
    nodes (MYH11, PRKG1, MFAP5).

    New node. THSD4 was curated in the genetic list and as a subtype but reached no
    pathophysiology node, so "THSD4 haploinsufficiency and impaired fibrillin-1
    microfibril assembly" was added, bound to GO:0160054 microfibril assembly - a
    term whose own GO definition cites the THSD4 paper - and feeding the
    extracellular-matrix node. Its two evidence items are the patient-variant
    functional result and the heterozygous mouse phenotype from PMID:32855533.

    Lump/split. The genetic list is wider than the subtype list because it also
    carries the syndromic HTAD genes the VASCERN pathway names. Each of those now
    carries a note saying where it is curated in full: FBN1 in Marfan_Syndrome,
    COL3A1 in Vascular_Ehlers-Danlos_Syndrome, and TGFBR1, TGFBR2, SMAD3 and TGFB2
    as Loeys-Dietz types 1-4 in Loeys-Dietz_Syndrome (each with the MONDO term that
    entry binds). No subtype rows were created for them. A top-level notes block
    now states this scope rule once.

    relationship_type. CAUSATIVE was applied to eleven genes. Ten of them ClinGen
    rates Definitive or Strong, either against MONDO:0019625 (FBN1, MYH11, TGFB2,
    LOX, MYLK, PRKG1) or against their own syndromic disease term (COL3A1 vascular
    EDS, TGFBR1 and TGFBR2 Loeys-Dietz, SMAD3 aneurysm-osteoarthritis syndrome).
    The eleventh is ACTA2, which has no ClinGen row against any thoracic aortic
    term in the committed table - its only row is a Definitive curation against
    multisystemic smooth muscle dysfunction syndrome - so a note on that record
    says the CAUSATIVE value rests on MONDO's gene assignment and the VASCERN
    classification instead. relationship_type was deliberately left unset on
    MFAP5 (ClinGen Moderate) and
    THSD4 (no ClinGen curation), and set to UNKNOWN on MAT2A (ClinGen Limited),
    with the reason recorded on each record: GeneDiseaseRelationshipEnum has no
    value between CAUSATIVE and DISPUTED, so a Moderate or Limited classification
    has no honest value to take.

    ClinGen citability. Most HTAD panel assertions predate the CGGV identifier
    scheme and are published under CGGCIEX identifiers, which
    src/dismech/structured_sources/clingen.py does not ingest, so only the MAT2A
    assertion (already in the entry) is citable as a snippet-validated reference.
    The other classifications are recorded in notes naming the committed CSV.

    Review round 1 additions. The reviewer noted two genes absent from the entry
    that do not fall under the syndromic-exclusion rule as written, and both were
    added. FOXE3 is a nonsyndromic HTAD gene that ClinGen rates Moderate against
    MONDO:0019625 - the same tier as MFAP5, which the entry does curate - and it
    acts on smooth muscle cell number and survival rather than on any of the three
    VASCERN gene classes, so it got its own pathophysiology node ("FOXE3 loss and
    aortic smooth muscle cell depletion") with the human segregation result and
    the two mouse results from PMID:26854927, and relationship_type left unset on
    the same basis as MFAP5. SMAD2 is the Loeys-Dietz syndrome 6 gene (ClinGen
    Definitive against MONDO:0030500) and was the one Loeys-Dietz gene missing
    where its four siblings are kept with cross-reference notes; it is now a
    genetic record at CAUSATIVE with a note pointing at Loeys-Dietz_Syndrome_6,
    and is bound on the TGF-beta signaling node alongside them. MONDO assigns
    neither gene a numbered AAT leaf class, so neither got a has_subtypes row.

    MONDO reconciliation: all six MONDO-recorded genes (LOX hgnc:6664, THSD4
    hgnc:25835, MYH11 hgnc:7569, MYLK hgnc:7590, PRKG1 hgnc:9414, MFAP5 hgnc:29673)
    were already in the genetic block and are now bound at the subtype carrying each
    MONDO term. No disagreement with MONDO on this entry.

    Validation: just validate, validate-terms, count-verified-snippets (39/39),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    check-folded-hyphens, list-gene-term-mismatches, and the batched just
    validate-disorders.

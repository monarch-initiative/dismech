  details: |
    Added seven phenotypes (ascending and descending aortic dissection, ascending aortic aneurysm, abdominal aortic aneurysm, early-onset ischemic stroke, livedo reticularis, iris flocculi) quoting PMID:25759435 and PMID:16996941, and three downstream edges from the aortic dilatation node. The GeneReviews overview cache holds only a purpose statement, so no baseline was available; Orphanet lists many more HPO terms but they were not added without a quotable paper. Cerebral aneurysm was skipped because no exact HPO term fit the source wording. Review round 1: removed two unsourced family claims from the livedo and iris descriptions, gave each new causal edge its own matching snippet, noted that HP:0004970 covers the tubular ascending segment only, and added a phenotype-sources note. Validation: validate, validate-terms, count-verified-snippets (55/55), validate-disorders, causal-target, coarse-phenotype and name-collision checks passed.

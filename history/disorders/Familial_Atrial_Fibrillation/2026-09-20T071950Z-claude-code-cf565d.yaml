  summary: Correct the ABCC9 channel-subunit wording (review round)
  details: |
    Review round on PR #12326 (genetics pass, issue #12195). One wording correction, found in
    self-review rather than raised by the reviewer.

    The lesion-node description and the entry description both said that ABCC9, NUP155 and MYL4
    reach the mechanism "without being channels at all". That is wrong for ABCC9: SUR2A is a
    subunit of the KATP channel, just the regulatory rather than the pore-forming one. Both
    sentences now say what is actually true - that the mutated protein in these three loci is not
    a pore-forming potassium or sodium channel - and name SUR2A's role precisely.

    No gene binding, grading, evidence or foreign key was changed. The gradings introduced in
    round one stand: CAUSATIVE for the seven loci with segregation or complete penetrance plus
    functional support, UNKNOWN for the three resting on probands without pedigrees, RISK_FACTOR
    for SCN5A, SUSCEPTIBILITY for ZFHX3.

    A reviewer suggestion to add `quote_role: BACKGROUND` to two PMID:29080865 evidence items was
    investigated and declined; the reasoning is in the pull request reply. In short, only one of
    the two quoted sentences is in that abstract's BACKGROUND section - the other is under
    METHODS AND RESULTS and is the paper's own human linkage result - and the BACKGROUND one is
    the authors describing their own family ascertainment, which CLAUDE.md names as the case
    where that section label is a false positive.

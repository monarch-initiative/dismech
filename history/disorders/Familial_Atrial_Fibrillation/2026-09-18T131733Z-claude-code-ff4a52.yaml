  details: |
    Weekly compliance sweep. All 39 compliance gaps were empty evidence slots; every ontology binding was already present. The largest single block was has_subtypes, where none of the 18 subtypes carried evidence. Added 18 evidence items: nine gene-backed subtypes (KCNQ1, KCNE2, KCNJ2, GJA5, NPPA, SCN5A, KCNA5, NUP155, MYL4), three genetic entries (KCNE2, NPPA, SCN5A) and the Stroke phenotype. Six references newly cached: PMID:15368194, PMID:18614783, PMID:18378609, PMID:16772329, PMID:29080865, PMID:19070573. The seven locus-only subtypes (ATFB1, 2, 5, 8, 16, 17) are deliberately left without evidence, since they are MONDO leaf-class anchors for linkage intervals with no confirmed causal gene. Curating the sources surfaced two places where the entry's framing is narrower than its own subtype list, and three subtype descriptions were extended to record them: NPPA acts through a circulating chimeric peptide rather than a channel defect; KCNA5 loss of IKur lengthens the atrial action potential where the KCNQ1 and KCNJ2 arms shorten it, so shortened refractoriness is not necessary for familial AF; and MYL4 is a structural atrial cardiomyopathy, so the entry's structurally-normal-heart framing does not hold for it. Weighted compliance 64.2 to 80.0 percent. All 33 snippets verified against the cache.

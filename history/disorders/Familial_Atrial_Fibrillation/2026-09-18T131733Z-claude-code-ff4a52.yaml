  details: |
    Weekly compliance sweep. All 39 compliance gaps were empty evidence slots; every ontology binding was already present. The largest single block was has_subtypes, where none of the 18 subtypes carried evidence. Added 30 evidence items covering twelve gene-backed subtypes (KCNQ1, KCNE2, KCNJ2, GJA5, NPPA, SCN5A, KCNA5, NUP155, MYL4, ABCC9, SCN1B, SCN2B), three genetic entries (KCNE2, NPPA, SCN5A) and the Stroke phenotype. Eight references newly cached: PMID:15368194, PMID:18614783, PMID:18378609, PMID:16772329, PMID:29080865, PMID:19070573, PMID:17245405, PMID:19808477. The six locus-only subtypes (ATFB1, 2, 5, 8, 16, 17) are deliberately left without evidence, since they are MONDO leaf-class anchors for linkage intervals with no confirmed causal gene; they are now the only uncited subtypes. Curating the sources surfaced several places where the entry's framing is narrower or stronger than its own subtype list, and six subtype descriptions were extended or corrected to record them: NPPA acts through a circulating chimeric peptide rather than a channel defect, and its peptide-to-substrate step is shown in isolated perfused rat heart rather than human atrium; KCNA5 loss of IKur lengthens the atrial action potential where the KCNQ1 and KCNJ2 arms shorten it, so shortened refractoriness is not necessary for familial AF; MYL4 is a structural atrial cardiomyopathy, so the entry's structurally-normal-heart framing does not hold for it; ABCC9 was described as gain-of-function, but the cited patch-clamp shows impaired ADP-dependent opening with ATP inhibition retained, so the description was corrected to loss of stress-responsive activation and the absent segregation analysis recorded; and SCN1B/SCN2B rest on a case-control screen of 480 AF patients rather than pedigree linkage, so "caused by" was softened to "associated with" in both. Weighted compliance 64.2 to 80.0 percent. All snippets verified against the cache.

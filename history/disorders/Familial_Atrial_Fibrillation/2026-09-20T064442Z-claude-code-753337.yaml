  summary: 'Genetics pass: curate seven missing ATFB loci; grade all twelve and dispute
    ZFHX3'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006). The largest job in the tranche: twelve
    checklist genes across eighteen numbered ATFB subtype rows.

    Research first: the primary report behind each numbered locus was fetched and read before the
    reconciliation checklist was consulted - KCNQ1 S140G, KCNE2 R27C, KCNJ2 V93I, GJA5 somatic
    missense, NPPA frameshift with linkage, SCN5A resequencing, KCNA5 E375X, ABCC9 Thr1547Ile,
    the SCN1B/SCN2B beta-subunit screen, NUP155 R391H, MYL4 c.234delC, and the ZFHX3 genome-wide
    association study - together with two 2024 reviews of genetic testing in early-onset AF and
    the UK Biobank rare loss-of-function burden analysis. ClinGen gene-disease validity was not
    used: `just clingen-refresh` fails on a checksum mismatch against a new upstream release, and
    repinning the manifest belongs in its own pull request rather than in a curation one.

    State before this pass: six `genetic:` records, of which three (KCNE2, NPPA, SCN5A) carried no
    evidence at all; no `subtype:` foreign keys; no `relationship_type` anywhere; no `genes:` on
    any of the eighteen `has_subtypes` rows; and seven of the twelve checklist genes - ABCC9,
    SCN1B, SCN2B, NUP155, MYL4, KCNA5 and ZFHX3 - with no gene binding anywhere in the file
    despite each having its own subtype row.

    What changed:
    - Seven new `genetic:` records, each with a `gene_term`, a `subtype:` foreign key and its own
      primary evidence: KCNA5, ABCC9, SCN1B, SCN2B, NUP155, MYL4 and ZFHX3.
    - Evidence added to the three records that had none, from the papers above.
    - `subtype:` foreign keys and `relationship_type`/`variant_origin` on all six pre-existing
      records.
    - `genes:` lists on thirteen `has_subtypes` rows.
    - Twelve genes bound on the "Atrial Ion-Channel or Coupling Variant" lesion node; the three
      gain-of-function potassium genes bound on the repolarization-shortening node; GJA5 bound on
      the gap-junction coupling node.

    Gradings are not uniform, and the rule is stated in the entry `notes` rather than left
    implicit. CAUSATIVE where a family or population study showed segregation or complete
    penetrance with supporting functional work (KCNQ1, KCNE2, KCNJ2, GJA5, KCNA5, NUP155, MYL4);
    UNKNOWN where the report describes unrelated probands without pedigrees or a single patient
    (SCN1B, SCN2B, ABCC9); RISK_FACTOR for SCN5A, following its own study's "may predispose"
    conclusion; SUSCEPTIBILITY for ZFHX3. The notes also record the population-scale context: an
    exome-wide rare loss-of-function burden scan across 9,099 genes in the UK Biobank found one
    significant gene, and it was TTN rather than any numbered ATFB locus. That reference is
    registered under `references:` with its supporting text rather than asserted as bare prose.

    Disagreement with MONDO, recorded. MONDO relates atrial fibrillation, familial, 8
    (MONDO:0013100) to ZFHX3 with RO:0004003, "has material basis in germline mutation in" - the
    same relation it uses for KCNQ1 and MYL4. The finding behind ATFB8 is a common intronic SNP
    with an odds ratio near 1.2 from a genome-wide association study; no rare coding variant, no
    family and no segregation. Three features confirm the reading: the association did not reach
    significance in a Han Chinese cohort where the allele is far more common, the same variant
    associates with cardioembolic stroke as a downstream consequence of AF, and the authors found
    no association between the variant and ZFHX3 expression in the tissues tested, so even the
    gene assignment within the locus is by proximity. ZFHX3 is bound, because the association is
    solid and replicated, but graded SUSCEPTIBILITY. The ATFB8 subtype description, which
    previously said the locus had no confirmed causal gene, was rewritten to say what the locus
    actually is.

    Also corrected in passing: the entry's description named only six loci and is now accurate
    about the twelve, including the three that are not ion channels at all (ABCC9 regulates the
    atrial KATP channel, NUP155 is a nuclear pore component, MYL4 is the atrial myosin light
    chain) and the fact that KCNA5 loss of function lengthens rather than shortens the atrial
    action potential - so action potential shortening is not a necessary feature of monogenic AF.
    A derived case fraction for MYL4 (8 homozygotes over the study's 1,799 early-onset AF cases)
    was drafted and then removed: the study reports an allelic frequency and a homozygote count,
    not a case share, and the arithmetic would not have been a reported figure. The reasoning is
    recorded in the MYL4 record's note.

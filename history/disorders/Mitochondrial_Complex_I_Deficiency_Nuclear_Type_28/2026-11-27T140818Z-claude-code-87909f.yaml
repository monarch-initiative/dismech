  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 28 (NDUFA13)'
  details: |
    New entry for MONDO:0032632, the recessive complex I deficiency caused by biallelic NDUFA13 (GRIM-19) variants, created from its stub (stub deleted). NDUFA13 is modelled as a structural accessory subunit (GO:0005198, DECREASED) whose transmembrane helix sits at the junction of the peripheral and membrane arms and contacts ND1, NDUFS8 and NDUFA3 (structural analysis in PMID:39963288); loss destabilizes the holoenzyme and supercomplexes (PMID:25901006, PMID:32722639; complex I assembly GO:0032981 DECREASED; Grim-19 knockout mouse PMID:15367666; deletion mutants PMID:18287540), giving isolated complex I deficiency (GO:0008137, GO:0006120) and a midbrain-predominant neurological disease. Phenotypes and their frequencies are copied from the 2025 cumulative cohort of 13 patients from 11 families (PMID:39963288): developmental delay, spasticity, hypotonia, ataxia, dyskinesia, choreoathetosis, seizures, oculomotor abnormalities, optic atrophy, raised lactate and symmetric substantia nigra T2 hyperintensity (11/12 imaged); hearing impairment of the first family and the hypertrophic cardiomyopathy of the second are single-family findings (PMID:32722639). relationship_type UNKNOWN: ClinGen rates NDUFA13 Moderate for Leigh syndrome and for mitochondrial disease (lumped terms, curated 2024-11-18, before the 2025 cohort), so no tier was copied and the genetic notes say a re-curation could be higher. Not used as phenotype evidence: the PGM1-CDG plus NDUFA13 dual-diagnosis case (PMID:40358162, cited only for the 13-patient count) and the homozygous E63K skeletal dysplasia outlier. The GRIM-19 Hurthle cell thyroid tumour association (MONDO:0011836) is deliberately excluded. No treatment is reported in the literature, so there is no treatments block. Validated: linkml-validate, term validation, reference validation (44/44 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

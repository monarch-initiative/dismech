  summary: 'Create: Amyotrophic Lateral Sclerosis Type 1 (SOD1, MONDO:0007103)'
  details: |
    New Mendelian entry for SOD1-associated ALS (ALS1), split from the broad Amyotrophic_Lateral_Sclerosis entry (MONDO:0004976) on pathological rather than merely genetic grounds: SOD1-mutant cases carry ubiquitin-positive but TDP-43-negative inclusions (PMID:17469116), placing them outside the TDP-43 proteinopathy that defines most ALS. Stub entry_type decided as DISEASE and stubs/Amyotrophic_Lateral_Sclerosis_Type_1.yaml deleted.

    Deep research: falcon was requested but its Edison endpoint returned 403 ProviderAuthError, so the run was repeated with 'just dr_fallback=--fallback research-disorder falcon ...'. openscientist produced the report, which is recorded as research/Amyotrophic_Lateral_Sclerosis_Type_1-deep-research-openscientist.md with fell_back/requested_provider/provider_attempts in its frontmatter. No provider was substituted by hand.

    Report validation was read before use. reference_validation: 38/38 resolved, confabulation_rate 0.0, but needs_review true - 5 references carried quotes not found in source (PMID:25613506, 32958236, 42661170, 40364643, 39257530); no quoted material from any of those five was reused, and none is cited in this entry. term_validation: needs_review true, with two dangerous mislabels - NCIT:C1289 named 'Glutamate antagonist' is actually Recombinant Interleukin-8, and NCIT:C65331 named 'Free-radical scavenger' is actually Cinnamon. Neither was bound; riluzole is bound to CHEBI:8863 instead. The HP mislabels were column-header artifacts ('Clinical sign' in the label field) and the CURIEs themselves were verified independently against cache/hp/terms.csv. just preflight-dr passed on disease identity (SOD1 mentioned 90 times) but flagged that the report cites OMIM 147450 where MONDO:0007103 xrefs OMIM 105400; no OMIM identifier was used.

    GeneReviews baseline: PMID:20301623 (Amyotrophic Lateral Sclerosis Overview) is the applicable chapter, fetched and tagged in the top-level references block. Its cached abstract is 380 characters and is a statement of the chapter's purpose only, carrying no Clinical Characteristics content, so the phenotype cross-reference was done against primary literature rather than against that abstract. There is no standalone SOD1 GeneReviews chapter.

    Pathophysiology curated as a causal chain rather than a bucket list: SOD1 missense variant -> misfolded SOD1 gain of toxic function -> three parallel arms (cytoplasmic aggregation, Derlin-1/ASK1 ER stress, prion-like templated propagation) plus non-cell-autonomous glial toxicity -> motor neuron degeneration -> denervation -> phenotypes. The gain-of-function claim is supported by three independent lines (SOD1-null mice normal, PMID:8673102; D90A with normal enzyme activity, PMID:7647793; G93A transgene with preserved activity sufficient to paralyse mice, PMID:8209258). Two nodes declare conforms_to against loss_of_proteostasis, whose own description names SOD1 as a substitutable aggregating species.

    Two allelic strata curated as has_subtypes rather than separate entries per the granularity rules: A4V (1.4 yr median survival, ~12,000-year founder allele, PMID:18055113) and D90A homozygous (recessive, slow, with dorsal column degeneration and sensory/bladder involvement, PMID:36385230).

    Tofersen curated with its actual evidence shape rather than smoothed: VALOR met biomarker endpoints but missed its primary clinical endpoint, recorded as a REFUTE item against demonstrated functional efficacy alongside SUPPORT items for target engagement, with the final VALOR/OLE integrated analysis (PMID:41661214) added for the early-versus-delayed signal and its non-randomized caveat stated in the explanation.

    Three animal models including two informative negatives: SOD1-null mouse as FAILS_TO_RECAPITULATE, and a REFUTE item on the G93A model recording that the standard high-expressing line is resistant to prion-like seeding a low-expressing sub-line supports (PMID:41702846). A HUMAN_MODEL_MISMATCH discussion records the transgene-dose problem; a KNOWLEDGE_GAP records that the relative contribution of the three toxic arms in human ALS1 is untested.

    Datasets: only geo:GSE271030 was included, after manual relevance triage. GSE260913 matched on the SOD1 gene index but its own GEO record names only 'an ALS patient' and was rejected; remaining candidates were general ALS or concerned other genes. The rejections are recorded in the dataset notes.

    Validation: just validate passes; 85/85 snippets verified against cached references; compliance 89.8%. check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-environmental-evidence all pass. just verify-datasets OK. pytest tests/test_data.py subtype/entity-ref/model selection: 2904 passed. No DOI-keyed evidence items were used, so the DOI skip-prefix gap does not apply.

    Post-curation review round (same PR, before first reviewer verdict). An adversarial
    self-review was run against the committed entry and found real defects, all fixed here.
    Blocking: a cited allele list in genetic.notes had Asp90Ala silently appended to the
    three alleles PMID:9029070 actually names (removed, and the source's own "clinically
    similar to non-SOD1 ALS" sentence recorded alongside for balance); a snippet from
    PMID:41702846 began one word after the subject and dropped the "VLE" (very-low-expressing)
    qualifier, which inverted the paper's point (restored); the familial-ALS frequency was
    stated as "roughly a fifth to a quarter in most series" while two references cached in
    this same change report 12-23% and 1-23% (replaced with the range plus both sources); the
    top-level description asserted mitochondrial injury and oxidative stress, which the entry
    neither models nor evidences and whose only cached candidate sources are about sporadic
    ALS (removed rather than curated from wrong-disease sources); two dataset evidence items
    lacked reference_title (added); GeneReviews was tagged but unquoted with the rationale
    living only in this history record, so it now sits in the entry's review_notes where a
    reviewer will see it.

    Also fixed: unsupported frequency bands VERY_FREQUENT and VERY_RARE removed; six cardinal
    phenotypes that carried no citation now cite PMID:9029070's similarity finding as the
    explicit warrant, and respiratory involvement cites PMID:40328546; the entry's central
    aggregation-to-degeneration edge now carries human autopsy evidence (PMID:42406382); a
    new biochemical block curates neurofilament light, which drove the whole tofersen and
    ATLAS narrative in prose while having no structured representation; clinical-trial
    registration evidence regraded HUMAN_CLINICAL to OTHER per the ICTRP precedent, since a
    registration states intent rather than reporting a study; GO:0006515 no longer carries
    INCREASED and DECREASED two nodes apart; the "genetically separable from aggregation"
    claim dropped, since the ASK1 experiment measured neuron loss and lifespan and not
    aggregation; incomplete penetrance now cited (PMID:42265995); the >200-variant count now
    cited (PMID:41661214) and the exon-distribution inference labelled as an inference; the
    Extra-Motor edge retyped INDIRECT_UNKNOWN_INTERMEDIATES to match the node's own statement
    that it is the weakest edge in the entry; the D90A ataxia claim corrected (that series was
    two heterozygotes and two homozygotes, so it does not belong to the homozygous subtype);
    single-centre cohort figures now labelled as such in prose; edaravone added on the same
    stated footing as riluzole; PMID:42406382 also recorded as a REFUTE item because misfolded
    SOD1 inclusions persisted in tofersen-treated donors, which constrains what target
    engagement buys.

    Parent entry reconciled: kb/disorders/Amyotrophic_Lateral_Sclerosis.yaml now points at
    this entry from its SOD1 genetic note, so a reader arriving at the parent learns ALS1 was
    split out and where the SOD1-specific content lives. This entry's review_notes records
    that ALS1 must NOT be added to kb/groupings/TDP-43_Proteinopathies.yaml, since being
    TDP-43-negative is the entire basis for the split.

    Compliance rose 83.7% to 89.8%. All gates re-run green including check-folded-hyphens,
    which caught a real defect introduced during this round (a line ending in "active-" inside
    a folded scalar) that was reflowed.

  summary: 'Address review round 1 on PR #11194 (ALS Type 1)'
  details: |
    Response to the ai4c-reviewer request-changes verdict on PR #11194, bundled into one push per the answer-a-review-in-one-push rule.

    Blocking findings, all fixed.

    Finding 1 (ontology specificity). The upper motor neuron cell type was bound to CL:0000598 pyramidal neuron, which also subsumes hippocampal and amygdala pyramidal neurons. Rebound to CL:4023052 Betz upper motor neuron, which matches the node's own preferred_term exactly and is the binding the sibling Juvenile_Amyotrophic_Lateral_Sclerosis entry already uses. Term was already in cache/cl/terms.csv, so no ontology research was needed.

    Finding 2 (phenotype completeness). Lower-limb onset, the characteristic SOD1 presentation, had no phenotype entry. Added Lower Limb Muscle Weakness bound to HP:0007340, cited to PMID:41511639 (67.6% of a single-centre Indian cohort) and independently to PMID:42265995 (juvenile p.Asp125Gly cases), and wired downstream of Progressive Muscle Denervation. Recorded at disease level rather than under an allelic subtype because the two sources cover different alleles.

    Finding 3 (no diagnosis section). Added a three-entry diagnosis block: Gold Coast criteria with the sensitivity figures from the individual-participant meta-analysis (PMID:42618698), exclusion of degenerative cervical myelopathy as the principal treatable mimic (PMID:42625715), and SOD1 genetic testing as the step that gates tofersen eligibility (PMID:41661214). The Gold Coast entry carries a REFUTE item quoting the same paper's statement that specificity is imprecise and heterogeneous, so the sensitivity number cannot be read as accuracy overall. Placed before treatments so the genotype step precedes the therapy that depends on it, which was the coherence gap the reviewer identified.

    Non-blocking suggestions taken.

    Finding 5. Added the Disease-Associated Motor Neuron State node (PMID:42335888) between the toxic arms and Motor Neuron Degeneration, with three separately graded evidence items: MODEL_ORGANISM for the SOD1-G93A definition, HUMAN_CLINICAL for conservation of the signature in human ALS spinal cord, and IN_VITRO for the transcription-factor induction showing the state is actively driven. The node description says explicitly that which upstream arms drive the transition is unresolved.

    Finding 6. The D90A subtype now records why the allele is recessive: coexpressed wild-type SOD1 shortens survival as its own toxicity predicts while coexpressed D90A does not, and D90A forms a distinct aggregate strain (PMID:40450581). Prose states this is a transgenic-mouse result offered as an explanation for a human inheritance pattern, not a demonstration in patients.

    Finding 7. Riluzole and edaravone descriptions asserted uncited pharmacology. Both now cite PMID:42503607 for the drug-class and modest-effect claims and PMID:42666355 for the limits, both graded OTHER because the sentences are background framing rather than either paper's own result. PMID:40364643, which the research report offered for the approvals, was NOT used: it is one of that report's five unverifiable-quote references.

    Finding 4 (prevalence) not taken, with reasoning given in the PR reply rather than silently deferred.

    Finding 8. PR body numbers were stale (68/68 and 84%); updated.

    Validation: validate-disorders passes over both changed files, 314/314 snippets. This entry now carries 101 snippets, all re-verified byte-exact against the raw cache files independently of the validator. Compliance 84.0% to 90.5%. Pathograph is 10 nodes, 12 phenotypes, 25 edges with no unresolved targets; Gait Ataxia remains a deliberate documented orphan. All offline gates pass. Full pytest suite 6,088 passed.

  summary: Review SOD1 ALS mechanisms, variant scope and clinical care
  details: |
    Read the matching deep research, full GeneReviews baseline and every available cached primary scientific body, with independent complete source audits of the motor-neuron atlas and two seeding/coexpression studies. Split ERAD, ER stress, signaling-complex and ASK1 events; removed unsupported direct inclusion-to-death and transcriptional-state-to-death claims. Corrected variant-dependent enzyme activity, inheritance, TDP-43 exceptions, selected human cohorts, model dosage and experimental rescue limits. Expanded general ALS supportive care and qualified SOD1-specific tofersen evidence using primary trials, the EAN guideline and US labels. Added scoped experimental models and verified per-accession datasets without accessing the frozen dataset blob. GeneReviews clinical, diagnostic, management and counseling domains are represented. Abstract-only sources remain explicitly limited; failed full-text responses were excluded. Integrated peer checks found no residual material scope issue in the audited models and drug comparisons.

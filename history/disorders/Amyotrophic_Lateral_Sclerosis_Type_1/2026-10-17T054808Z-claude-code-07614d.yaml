  summary: Bind the plasma/serum NfL LOINC code, not a CSF one
  details: |
    LOINC tranche J batch 1. Bound LOINC:101281-4 (Neurofilament light chain [Mass/volume] in Serum or Plasma by Immunoassay) to the Neurofilament light chain biochemical marker. Every quoted measurement in this marker's evidence is in plasma or blood (the tofersen trial reductions, the ATLAS presymptomatic-rise finding), not CSF, even though the marker's own notes mention 'blood or CSF' generically -- read the specimen from the evidence, not the generic framing sentence. Searching 'Neurofilament light chain Serum Plasma' returns exactly one LOINC entity, fully enumerated; there is no method-less serum/plasma code for this analyte, only the by-Immunoassay one. Code verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding. The broader Amyotrophic_Lateral_Sclerosis entry (not curated in this batch) also carries a biochemical NfL marker with serum-specific evidence and no diagnosis: section -- it would take the same code via the same biochemical route in a later batch.

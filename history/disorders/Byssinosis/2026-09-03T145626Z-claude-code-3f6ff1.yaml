  summary: 'Create: Byssinosis'
  details: |
    Created kb/disorders/Byssinosis.yaml de novo (MONDO:0006688).

    Duplicate preflight: git grep over origin/main kb/ for MONDO:0006688, "byssinosis",
    "cotton dust" and "brown lung" returned nothing; stubs/ had no match; GitHub PR and issue
    searches across all states returned zero.

    Deep research: claude_code provider only. 275s, 26 turns, 19 web searches, ~$1.38, 31
    citations. As with the Coal Workers Pneumoconiosis run, the report carried no
    reference_validation or term_validation frontmatter block, so both were retro-fitted.
    References: 17/17 resolved, 0 unresolved, 0 off topic (12 scored on topic, 5 undecided for
    lack of an abstract). Terms: 37/37 resolved, 2 named as a different term and 2 worth a
    second look, all four benign paraphrases.

    This report was substantially more careful than the CWP one. It marked each causal step as
    demonstrated or inferred, flagged two of its own suggested GO terms as "n/a", and stated
    plainly that no byssinosis-specific omics dataset exists. Its term suggestions were mostly
    right. Two were not, and only a direct OAK sweep caught them:
      CL:0005006 offered as "basal cell of respiratory epithelium" -> CL calls it ionocyte.
        Not used. The entry binds CL:0002328 bronchial epithelial cell instead.
      UBERON:0003126 described as "trachea/bronchus tree" -> UBERON calls it trachea. The
        entry binds UBERON:0002185 bronchus and UBERON:0002186 bronchiole.
    The term validator flagged neither, because both sat inside parenthetical alternatives its
    name extraction does not reach — the same blind spot that hid HP:0002105 (Hemoptysis,
    offered as "Restrictive ventilatory defect") in the CWP report. Every binding in this entry
    was re-derived from OAK. HP:0025428 "Bronchospasm" was checked and rejected as obsolete.

    Citations: the report cites by URL and PMC id. Five PMC ids were converted via the PMC ID
    Converter and cited as PMIDs. PubMed searches added the primary sources the report did not
    name, including the 20-year Shanghai cotton/silk cohort papers and the original Schilling
    grading study.

    Two substantive curation decisions, both about not overstating the mechanism.

    First, the endotoxin hypothesis is modelled as contested rather than settled. The skeleton
    originally asserted endotoxin as the causative agent. PMID:16179819 challenged 21 healthy
    subjects with cotton bract and cotton dust extracts measured at 5.71 and 31.88 EU/mg and
    saw ~70% falls in MEF40%(P) in 18 and 17 of them plus universally enhanced methacholine
    responsiveness; the deep-research report independently notes that complement activation by
    cotton dust does not track endotoxin concentration. A large effect from little endotoxin
    argues for a second agent. The entry therefore carries two mechanistic_hypotheses —
    endotoxin_model (CANONICAL) and non_endotoxin_constituent_model (EMERGING) — with the
    initiating node's downstream edges opting into the respective groups, plus a KNOWLEDGE_GAP
    discussion on the identity of the non-endotoxin constituent. Bract tannin is named as the
    literature's candidate only, not as a demonstrated agent.

    Second, the natural history is modelled as two decoupled arms rather than one dose-response.
    Acute cross-shift responses appear within the first working week of first exposure and then
    attenuate with continued exposure (PMID:17693783, a tolerance effect in the authors' own
    words), yet their magnitude and frequency predict irreversible long-term FEV1 loss
    (PMID:17975204: 10 mL/year attributable to cotton dust, plus 1.5 mL/year per 10 mL of
    cross-shift drop, over 20 years against a silk-worker reference group). PMID:20797932 shows
    past cumulative endotoxin predicts the chronic deficit while recent exposure predicts
    current symptoms. So the entry carries a separate `Exposure Tolerance Across the Working
    Week` node as a modifier, and the acute node feeds both tolerance and the chronic node.

    Content: 2 subtypes (acute reversible, chronic fixed), a 9-node pathophysiology chain, 6
    phenotypes (all graph-connected), 1 environmental exposure bound to ECTO:7000148 with a
    TRIGGERS mechanism link, 3 modifier genes (TNF, LTA, CD14), 2 prevalence records, 1
    definitions entry, 1 diagnosis entry, 1 animal model, 2 treatments, 1 discussion. Graph:
    22 nodes, 20 edges, 0 orphan targets.

    TNF is curated as MODIFIER here but SUSCEPTIBILITY on Coal Workers Pneumoconiosis. That is
    deliberate and recorded in the entry's notes: the byssinosis studies measure rate of FEV1
    decline in exposed workers, the CWP studies measure case-control odds. The difference is in
    what was measured, not the biology.

    The Schilling grading is curated as a `definitions` entry citing Roach & Schilling 1960
    (PMID:14437722) directly rather than a secondary description of it. Its validation_status
    records that the scale is the reference standard while noting that WHO symptom-only versus
    Schilling symptom-plus-FEV1 criteria gave 3% and 4% on the same 2,031-worker cohort, so the
    criterion choice moves the answer.

    Deliberate omissions:
      - No datasets block. GEO searches for "byssinosis", "cotton dust lung" and "endotoxin
        airway textile" each returned zero series, matching the report's own statement that no
        byssinosis-specific single-cell, spatial or multi-omics dataset exists.
      - No IARC carcinogen group. IARC has not classified cotton dust in a group this entry
        would be entitled to assert, and byssinosis is not a neoplastic outcome.
      - ILO item 2.1.7 (occupational asthma) not claimed, only 2.1.6. Byssinosis is not a
        sensitizer-driven asthma and its Monday pattern is the opposite of a progressive
        sensitization course.
      - No GeneReviews baseline; a purely acquired occupational disease.
      - hazard_agent_type is BIOLOGICAL rather than CHEMICAL, unlike the mineral-dust
        exposures on silicosis and CWP, because the operative agent on the canonical model is
        bacterial endotoxin and the dust is plant material.

    Validation: `just validate` and `just validate-disorders` both pass with 58/58 snippets
    verified. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms and check-qualifier-terms-online all OK. Whole-KB content gates
    report no new violations except check-title-snippets, whose 2 findings are in
    Meckel_Diverticulum.yaml and Pouchitis.yaml — pre-existing, untouched by this branch, and
    independently confirmed as pre-existing by the reviewer on PR #10697. Compliance 85.2%
    (Coal Workers Pneumoconiosis 84.9%, Silicosis 79.4%, Asbestosis 88.6%).

    Committed on branch claude/byssinosis-curation rather than the session's designated branch,
    with the user's explicit approval, because the designated branch's PR (#10697) was in the
    merge queue and pushing to it would have ejected it.

  summary: 'Address PR #10732 review findings'
  details: |
    The automated reviewer returned REQUEST_CHANGES on PR #10732 with seven IMPORTANT
    findings and no CRITICAL ones. All seven were verified against the reference caches
    before acting, and all were correct. Most were under-consumption of material this PR
    had already fetched.

    1. Dyspnea was missing from phenotypes. Breathlessness is half the Schilling grade-1
       criterion ("Chest tightness and/or breathlessness on Mondays only"), and the
       shortness-of-breath prevalence snippet was being spent on Wheezing as INDIRECT
       evidence where it fitted badly. Added Dyspnea (HP:0002094, already cached), moved
       that snippet onto it as DIRECT evidence with frequency FREQUENT, trimmed the
       Wheezing snippet to the clause that actually supports wheeze, and wired Dyspnea
       downstream of Acute Bronchoconstriction so all 7 phenotypes are now connected.

    2. TLR4 was absent from genetic: while CD14 from the same paper was present, even
       though the mechanism node is named "Endotoxin Sensing by CD14 and TLR4" and cited
       the TLR4 genotype result twice. Added TLR4 (hgnc:11850) as a MODIFIER with the
       IL-6/ECP genotype result and the study's own conclusion, carrying the same cohort
       caveat as CD14.

    3. GO:0006956 complement activation was bound with a directional modifier and the
       node's own notes admitted no primary source had been retrieved. A PubMed search
       found one: PMID:6617618, an in vitro assay showing cotton mill dust extract
       activates complement by both classical and alternative pathways AND that
       "endotoxin is not the principal complement-activating component, as complement
       activation could not be correlated to endotoxin concentrations". That is stronger
       than the binding needed — it is independent mechanistic support for the
       non-endotoxin hypothesis. Both sentences are now cited and the apologetic note
       replaced.

    4. A snippet ended mid-word at "potentiati". Trimmed to a clause boundary.

    5. Chest tightness carried frequency: FREQUENT supported by "Prevalence of chest
       tightness ranged between 4% and 58%" — prevalence among exposed workers, not
       frequency among cases. Since chest tightness IS the case definition, the frequency
       is OBLIGATE by definition; changed, with a note saying it is definitional rather
       than observed. The 4-58% range moved to prevalence: as its own record, where the
       denominator is right, with a notes line naming the denominator distinction.

    6. Ten of 22 cached references were uncited, including both full-text fetches. Two
       are now consumed:
       - PMID:23361196 (upgraded to full text in this PR) supplies the two REFUTE-
         direction observations the EMERGING non-endotoxin hypothesis needed: no
         dose-response between bract-extract endotoxin content and FEV1 drop, and
         endotoxin failing to reproduce the tracheal smooth-muscle contraction cotton
         dust causes. It also sources the new smoking record.
       - PMID:23527081 is the largest genetic dataset in the reference set and the only
         one with a byssinosis-relevant endpoint rather than a blood cytokine. Added as a
         locus-level genetic record (rs1910047, rs9469089, genetic risk score
         P trend = 3.01e-18, gene-by-endotoxin interaction). Deliberately no gene_term:
         the leads are rsIDs near TBX3/TBX5 and RNF5/MHC, and an association near a gene
         is not evidence that gene carries the effect. The reviewer described this study
         as genome-wide; it is a gene-centric panel (Illumina Human CVD BeadChip), which
         the record's notes say, since it changes what the negative space means.

    7. Bronchodilator Therapy bound generic NCIT:C15986 with no therapeutic_agent. Added
       NCIT:C319 Bronchodilator.

    Non-blocking suggestions also acted on: the mast cell histamine node had no incoming
    edge and is now reached directly from dust inhalation (PMID:6722048), so the pathograph
    is one connected component; smoking added as an environmental record bound to
    ECTO:0100003 with a MODULATES link onto the chronic-decline node. MODULATES rather
    than EXACERBATES because the source describes additive interaction, and the same review
    notes that poor smoking adjustment confounds much of the older literature — which is a
    reason to model smoking explicitly rather than leave it out.

    Two reference attributions were wrong in the first pass of these fixes and were caught
    by the validator's title check before pushing: the Schilling criterion was attributed
    to PMID:12554839 when it belongs to PMID:14437722, and the mast cell recruitment quote
    to PMID:6202313 when it belongs to PMID:6722048.

    Suggestions not taken: PGF2a as a distinct bronchoconstriction node, and EPHX1 in
    genetic:. Both are single mentions in the deep-research report without a retrieved
    primary source, and adding them would repeat the uncited-binding defect finding 3 was
    about.

    A second pass finished finding 6 rather than leaving it half-done. Of the ten uncited
    cached references, three were assessed individually:
      - DOI:10.1080/109158101753253054 was added to the mast cell histamine node. It is
        the only human study in the reference set pairing raised blood histamine with
        simultaneous measured obstruction across central, large and peripheral airways in
        exposed workers, which is exactly the translational weakness of a node otherwise
        resting on 1984 proposals and guinea pig lung measurements. The article has no
        PubMed record (checked via the PMC ID Converter), so it is DOI-keyed; DOI: is in
        skip_prefixes and therefore not snippet-checked by the gating validator, so it was
        verified separately with `just count-verified-snippets --unskip-prefix DOI`
        (74/74). Both facts are recorded in the node notes.
      - PMID:4689794 ("Byssinosis: a study of 10,133 textile workers") has a title-only
        cache with no abstract body, so nothing can be quoted from it. Quoting its title
        would trip check-title-snippets. Not usable as it stands.
      - PMID:8722109 is a general review of animal models for organic dust reactions
        across cotton, hay, silage, grain and compost, not a byssinosis model. Too
        unspecific to add as a second animal_models entry without overclaiming.

    Validation after this pass: just validate and just validate-disorders both pass with
    73/73 snippets verified by the gating validator (up from 58) and 74/74 including the
    DOI-keyed item. All offline and whole-KB gates OK. All 7 phenotypes graph-connected.
    Compliance 85.6%, up from 83.6%.

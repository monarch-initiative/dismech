  summary: Add ICD-11 Foundation and NCIT mappings
  details: |
    Weekly compliance sweep, mappings focus. Added ncit_mappings NCIT:C125384 (exactMatch, taken from the MONDO:0016019 cross-reference that also supplies the MONDO definition, with a consistency assertion) and icd11f_mappings icd11f:182666470 as a closeMatch. The ICD-11 Foundation has no entity for Rasmussen encephalitis itself, only 'Epilepsy due to Rasmussen encephalitis', so closeMatch rather than exactMatch is the honest predicate. No icd10cm_mappings was added: the only candidate, ICD10CM:G04.81, is a residual 'other encephalitis' category whose OAK synonyms all name noninfectious ADEM, and it was judged not a good enough match to record. All CURIEs and labels verified with OAK. Validated with 'just validate'; 16/16 snippets verified against cached references.

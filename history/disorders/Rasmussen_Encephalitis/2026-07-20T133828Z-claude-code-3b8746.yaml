  summary: 'Create: Rasmussen Encephalitis'
  details: |
    De-novo curation of Rasmussen encephalitis (MONDO:0016019), an acquired T-cell-mediated autoimmune epilepsy - a deliberate mechanistic contrast to the genetic DEE entries in the pediatric-epilepsy sweep. Granular unbundled autoimmune pathophysiology: unknown immune trigger / adaptive activation -> CD8+ cytotoxic T-cell brain infiltration -> microglial activation and neuroinflammation -> progressive unihemispheric neuronal loss and gliosis -> unihemispheric cortical hyperexcitability (conforms epilepsy module) -> drug-resistant focal seizures and epilepsia partialis continua (conforms), with a progressive neurological decline branch. Evidence: Bien 2002 (PMID:11891826, CD3+CD8+ T-cell infiltrate, granzyme-B, T-cell-mediated neuronal death) and Varadkar 2014 Lancet Neurol review (PMID:24457189, T-cell-driven, unilateral cortical inflammation triad, hemispherectomy only cure). Treatments: functional hemispherectomy (definitive), immunotherapy, antiseizure meds. Three KNOWLEDGE_GAP discussions: unknown antigenic trigger, immunotherapy-vs-hemispherectomy timing, unihemispheric restriction. Prevalence ultra-rare (qualitative). NEC-low-risk single well-defined entity; MONDO def matches. Deep-research run errored (transient) so entry anchored on verified primary literature. All snippets verified exact; schema + term validation pass.

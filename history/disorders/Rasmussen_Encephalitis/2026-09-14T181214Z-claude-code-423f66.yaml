- type: REVIEW
  outcome: changed
  sections:
  - prevalence
  summary: Fix the incidence record's prevalence_class and add its rate_denominator
  details: |
    Round 3 review finding. The German nationwide record carried prevalence_class: ULTRA_RARE on a measure_type: ANNUAL_INCIDENCE record with a populated rate_per_100000, which CLAUDE.md forbids on both counts: the qualitative tiers are defined by prevalence thresholds and presuppose no numeric estimate, so they are never to be paired with an incidence measure or with a numeric rate. Replaced with BELOW_1_IN_1000000, which is the correct magnitude band for 2.4 diagnosed cases per 10 million people aged 18 or under per year. Also added rate_denominator: POPULATION_PER_YEAR, which CLAUDE.md requires on an ANNUAL_INCIDENCE record because that measure has no fallback denominator and per-population-per-year and per-person-year are not interchangeable; the cited figure is per population per year. The first prevalence record was left alone: measure_type: UNKNOWN with prevalence_class: ULTRA_RARE is an explicitly permitted pairing. Validated with just validate (42/42 snippets verified), just validate-terms, just check-enum-values and just check-folded-hyphens.

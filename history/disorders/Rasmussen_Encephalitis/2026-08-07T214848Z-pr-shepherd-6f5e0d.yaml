  details: |
    PR-shepherd follow-up addressing the ai4c-reviewer CHANGES_REQUESTED review on PR #6996. No new references were introduced; every change concerns the fit between an already-cited snippet and the claim it is attached to.

    IMPORTANT 1 - misfitted edge evidence. The edge Immune Trigger and Adaptive Immune Activation to CD8+ Cytotoxic T-Cell Brain Infiltration cited 'initial damage to the brain is mediated by T cells and microglia', which does not support that edge and was reused verbatim on the next edge where it does fit. It now cites the antigen-directed T-cell-response sentence from the same review, as PARTIAL.

    IMPORTANT 2 - supports level overstated on indirect evidence. Per the schema, SUPPORT means directly supports and PARTIAL means partially or indirectly supports. Five items that rest on definitional co-occurrence rather than an asserted causal step were downgraded from SUPPORT to PARTIAL, and each explanation now states plainly what the snippet does and does not establish: the T-cell-to-microglia edge, the neuronal-loss-to-hyperexcitability edge, the Unihemispheric Cortical Hyperexcitability node, the hyperexcitability-to-seizures edge, and the neuronal-loss-to-neurological-decline edge. The last of these was not enumerated in the review but is the same definitional-fragment pattern, so it was treated consistently.

    Items left at SUPPORT are the ones whose snippet states the node's own claim directly: the CD3+CD8+ infiltrate, the microglial nodules, the T-cell-mediated cytotoxic reaction inducing neuronal death, the causal 'leading to the destruction of the affected hemisphere' edge, and the two clinical-feature nodes.

    Non-blocking suggestions also addressed: filled intermediate_mechanisms on the INDIRECT_KNOWN_INTERMEDIATES edge; removed an evidence item duplicated verbatim between an edge and the node below it; set biological_scale on all seven pathophysiology nodes; recorded the PR link in the original session record.

    The branch was 13 days stale and, standing alone, no longer schema-valid: it predated the MAXO-to-NCIT remap and still carried MAXO:0000004. origin/main was merged in - no rebase, no force-push - which resolved that cleanly. The post-merge diff against main is purely additive, two files, with no deletions or stale reversions.

    Validation: just validate-disorders on the file passed, reporting 'Snippets checked: 16/16 verified against cached references'.

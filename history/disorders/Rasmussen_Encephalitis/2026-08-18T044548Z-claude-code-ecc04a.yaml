  summary: 'Compliance: Rasmussen immunotherapy and ASM treatment evidence, reference_title
    backfill, incidence record'
  details: |
    Weekly compliance pass focused on immune-disease treatments. Treatments: the Immunotherapy entry had no evidence at all despite being the central medical question in this immune-mediated encephalitis. It now carries therapeutic_agent bindings (tacrolimus NCIT:C1311, azathioprine CHEBI:2948, rituximab NCIT:C1702), therapeutic_modality SMALL_MOLECULE, a target_mechanisms link with its own evidence to the CD8+ Cytotoxic T-Cell Brain Infiltration node, and two evidence items: the only randomized prospective treatment trial in the disorder (tacrolimus vs IVIG, PMID:23216622) and the azathioprine cohort (PMID:33046614). Both are recorded with their limits intact - the randomized trial's therapeutic-dilemma finding (immunotherapy may arrest patients in pharmacoresistant epilepsy with function too preserved for hemispherectomy, and no already-refractory patient became responsive) is kept in notes, and the azathioprine item is PARTIAL because it is Class III retrospective evidence showing no effect on cognitive decline or hemispheric atrophy. Antiseizure Medication gained evidence from the medical-treatment systematic review (PMID:35131107) plus a target_mechanisms link to the Drug-Resistant Focal Seizures phenotype, recording the intervention as used but characteristically ineffective. Phenotypes: added evidence for Epilepsia Partialis Continua and Progressive Hemiparesis with quantitative untreated-control rates (67 percent and 92 percent, PMID:33046614), Progressive Cognitive Decline (PMID:24457189), and Unilateral Cerebral Atrophy (PMID:35131107); added clinical_course PROGRESSIVE to the hemiparesis and cerebral-atrophy descriptors. Prevalence: added a second record carrying the nationwide German diagnosed-incidence estimate (2.4 cases per 10 million people aged 18 or under per year, normalized to 0.024 per 100000) with evidence, kept alongside rather than replacing the existing qualitative worldwide record; the notes state that a diagnosed-case rate is a floor rather than a true incidence. Mechanical: backfilled reference_title on all 16 evidence items from the committed reference cache titles - read from references_cache, not retyped. Validated with just validate: 26 of 26 snippets verified against cached references. Weighted compliance 50.0 to 82.6.

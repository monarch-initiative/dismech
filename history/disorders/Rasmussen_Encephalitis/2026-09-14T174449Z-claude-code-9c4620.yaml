  summary: Merge main; fold both sides' phenotype evidence; retire PARTIAL prose
  details: |
    Merged current main into the PR branch to clear the conflict that was stopping any workflow, including re-review, from starting. Thirteen conflict hunks. Six were the pre-existing supports: PARTIAL items that main had already migrated to SUPPORT; main's side was taken. Three were phenotype entries (Progressive Hemiparesis, Progressive Cognitive Decline, Unilateral Cerebral Atrophy) where the merge base carried no evidence at all and both sides independently added some: the two citing different papers were folded so both evidence items survive, and the one where both sides quoted the same sentence of PMID:24457189 kept main's shorter quote. The branch's HP:0100308 hemiatrophy binding and clinical_course qualifiers were preserved through the fold. The therapeutic_agent list was unioned (tacrolimus and azathioprine from this branch, methylprednisolone from main). The target_mechanisms edges this PR added were kept, as was main's new classifications block, which one hunk would otherwise have dropped. Separately, eleven explanations still argued for the retired PARTIAL value above a supports: SUPPORT line. Each describes an inference step, so each item now carries directness: INDIRECT and the prose was reworded to stop naming a value the schema no longer has. Validated with just validate (42/42 snippets verified), just validate-terms, just check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-grading and check-title-snippets.

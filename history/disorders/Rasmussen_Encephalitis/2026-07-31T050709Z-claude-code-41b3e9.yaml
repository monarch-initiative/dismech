  summary: 'Weekly compliance: add evidence and reference titles'
  details: |
    Weekly compliance pass on Rasmussen_Encephalitis. Backfilled reference_title on the 7 pre-existing evidence items via scripts/add_pmid_titles.py. Added 34 new verified evidence items across the pathophysiology nodes that lacked them (Microglial Activation, Unihemispheric Cortical Hyperexcitability, Drug-Resistant Focal Seizures/EPC, Progressive Neurological Decline), all 6 downstream causal edges, the 4 phenotypes lacking evidence (EPC, hemiparesis, cognitive decline, unilateral cerebral atrophy), the immunotherapy and antiseizure-medication treatments, additional hemispherectomy outcome evidence, and two knowledge-gap discussions. New PMIDs cited: 15689357 Bien 2005 European consensus statement; 12135966 Bien 2002 natural history; 23216622 Bien 2013 randomized tacrolimus vs IVIG trial and source of the incidence estimate; 23531608 clinico-pathological series with CD68-positive microglial nodules and unilateral atrophy; 35131107 systematic review of medical treatment; 36939721 EPC and FLAIR-hyperintense cortical lesion study; 32875551 pediatric EPC diagnostic algorithm; 28029552 EPC review; 24815913 Italian hemispherotomy long-term outcomes; 37992429 Brazilian hemispherotomy series. Also restructured the prevalence record from measure_type UNKNOWN with a free-text ULTRA_RARE class into a structured ANNUAL_INCIDENCE record with prevalence_class BELOW_1_IN_1000000 and rate_per_100000 0.024, anchored to the Germany-wide incidence estimate of 2.4 cases per 10 million people age 18 or under per year. Every PMID was fetched with just fetch-reference and every snippet copied as an exact substring from the cached abstract; validate, validate-references and validate-terms all pass. Weighted compliance improved from 39.7 percent to 90.2 percent.

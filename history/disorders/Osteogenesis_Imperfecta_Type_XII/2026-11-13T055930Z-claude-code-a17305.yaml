  summary: Address PR #17305 review by documenting dominant heterozygous SP7 reports, adding dentinogenesis imperfecta and craniofacial anomalies, removing unsupported CT diagnosis, and rebinding Bone Deformity
  details: |
    Removed the unsupported heterozygous-carrier sentence from Autosomal Recessive inheritance and documented dominant heterozygous SP7 reports (p.Glu340Ala low-turnover dominant OI and neomorphic p.Ser309Trp cranial hyperostosis / juvenile Paget disease) across inheritance, genetic notes, and top-level notes citing DOI:10.1007/s00223-024-01266-5. Rewrote Delayed Tooth Eruption to remove the erroneous exclusion of dentinogenesis imperfecta, added Dentinogenesis Imperfecta (HP:0000703) and Craniofacial Anomalies (HP:0000929, SOURCE_UNSPECIFIED), and wired both from Impaired Osteoblast Differentiation and Bone Matrix Deposition. Removed the unsupported Temporal Bone Computed Tomography diagnostic entry. Rebound Bone Deformity from HP:0006487 (Bowing of the long bones) to HP:0011842 (Abnormal skeletal morphology, SOURCE_UNSPECIFIED) and removed unsupported bowing language. Marked all five COL1A1/COL1A2 GeneReviews (PMID:20301472) evidence items directness: INDIRECT with an explicit Bookshelf snapshot check note, added edge evidence to all five skeletal downstream edges, and documented stature variability in homozygous p.Arg316Cys siblings.

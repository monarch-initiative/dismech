  details: |
    Added MONDO synonyms (OI12, SP7 osteogenesis imperfecta, osteogenesis imperfecta type 12); added Harrison GENETICS_ENVIRONMENT_DISEASE and mechanistic_category collagenopathy classifications with evidence on ISDS skeletal category; preserved pathograph node class anchor Impaired Osteoblast Differentiation and Bone Matrix Deposition while grounding pathophysiology nodes with biological_scale, SP7 (hgnc:17321) germline loss-of-function genetic_context, RNA Pol II transcription factor molecular_functions (GO:0000981), skeletal locations, PMID:38014644 procollagen knockdown evidence, and bare-name downstream edges connecting all 7 phenotypes (100%); repaired Short Stature HPO binding from HP:0001510 Growth delay to HP:0004322 Short stature, added phenotype categories, and added Scoliosis (HP:0002650); added Osx-/- mouse model (PARTIALLY_RECAPITULATES); added Dual X-ray Absorptiometry and Temporal Bone Computed Tomography diagnostic entries; enriched Bisphosphonate Therapy with SMALL_MOLECULE modality, pamidronate/zoledronic acid agents, and target_mechanisms with evidence.

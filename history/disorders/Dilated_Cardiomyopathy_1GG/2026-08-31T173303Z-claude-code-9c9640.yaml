  summary: 'Create: Dilated Cardiomyopathy 1GG (MONDO:0013339, SDHA)'
  details: |
    Curated de novo as entry_type DISEASE. The entity rests on one primary report (PMID:20551992): 15 patients from two consanguineous Bedouin families homozygous for SDHA c.1664G>A p.(Gly555Glu), presenting with neonatal isolated dilated cardiomyopathy. The pathograph is built around the tissue restriction of the enzyme defect, which is the entity's defining and unexplained feature: severe loss of succinate dehydrogenase activity in myocardium with substantial activity retained in skeletal muscle and lymphoblastoid cells. The molecular mechanism is a destabilised SDHA-SDHB interface, evidenced independently by patient immunochemistry (PMID:12794685) and by a human SDHA-knockout cell line panel (PMID:39321216, per-variant result full-text derived). A conditional cardiac Sdhaf4 knockout mouse (PMID:35803927) is curated in animal_models with three mechanism links; it was surfaced by the falcon deep-research report and reproduces the SDHA-SDHB interface failure and the dilated phenotype but not the allele or the tissue selectivity. Four knowledge gaps are recorded, the central one being why a homozygous allele present in every cell disables only the heart. No treatment is curated for the enzyme defect; riboflavin is recorded as a knowledge gap with opposed evidence rather than as a treatment. The MC2DN1 coverage overlap and the declined module conformance are disclosed in the entry notes. Validated with just validate (exit 0, 46/46 snippets verified against cached references).

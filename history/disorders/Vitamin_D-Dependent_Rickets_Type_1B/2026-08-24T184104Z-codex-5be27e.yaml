  summary: 'Review: evidence-calibrate vitamin D-dependent rickets type 1B'
  details: |
    Deep review of the CYP2R1 disorder corrected the metabolite interpretation,
    completed the clinical and diagnostic record, and made mechanistic and model
    claims match the evidence actually available. Identity, MONDO binding, parent
    groupings, synonyms, autosomal-recessive primary inheritance with reported but
    non-uniform semidominant behavior, and CYP2R1 causality were rechecked and
    retained. The changed or explicitly considered top-level sections are all
    enumerated in this event's sections list; evidence and references are included
    because claim-to-source alignment and cache provenance were first-class review
    targets.

    Scientific changes:

    1. Calcitriol is now Variable rather than Normal or elevated. Normal and high
       measurements remain explicitly documented and do not exclude VDDR1B, while
       the review evidence also allows low values. The biochemical state is no
       longer presented as an obligatory calcitriol deficiency or an exclusively
       preserved active-hormone state.
    2. Diagnosis is structured as a refractory-calciopenic-rickets evaluation
       followed by CYP2R1 molecular confirmation. Structured differentials cover
       ordinary nutritional calcium/vitamin D deficiency, VDDR1A, VDDR2A, VDDR3,
       phosphopenic/renal phosphate-wasting rickets, and acquired malabsorption,
       liver disease, renal comorbidity, and medication-related disease. Failure to
       heal despite adequate adherent repletion and/or family history is the gate to
       inherited-refractory evaluation rather than an isolated metabolite result.
    3. PMID:34137732 Table 3 completeness was restored: limitation of activity
       18/27, generalized osteopenia 15/27, bone deformity 8/27, gait abnormality
       7/27, genu valgum 8/27, and metaphyseal cupping 4/27 are represented with
       exact subgroup-derived counts. Secondary hyperparathyroidism is represented,
       but the cohort's 20/27 abnormal bone profile remains explicitly composite;
       that count is not imputed separately to PTH, calcium, or alkaline
       phosphatase.
    4. The intestinal calcium/phosphate and vitamin-D-action path is labeled as a
       group-level mechanistic inference rather than a directly measured VDDR1B
       enterocyte/VDR-signaling result. The unsupported enterocyte and decreased-VDR
       descriptor claims were removed. Clinical response to high-dose parent
       vitamin D is retained, while flux through residual CYP2R1 or alternative
       hydroxylases is described as a plausible interpretation rather than a patient
       pathway measurement.
    5. The Cyp2r1-null mouse retains its evidence-supported biochemical
       PARTIALLY_RECAPITULATES link and two measured serum readouts. The prior
       skeletal FAILS_TO_RECAPITULATE edge was removed: the abstract's statement
       that the mice had no health issues is not a skeletal assessment. Skeletal
       fidelity is now an open, unassessed translational question with a proposed
       controlled phenotyping experiment.
    6. Treatments are response-stratified: calcifediol bypass, high-dose parent
       vitamin D plus calcium, and calcitriol for selected nonresponders. The
       calcifediol treatment now carries structured agent CHEBI:17933 calcidiol.

    Frequency-boundary decision: 8/27 is 29.63 percent, while the repository's
    integer-labelled bands end OCCASIONAL at 29 percent and begin FREQUENT at 30
    percent. Bone deformity and genu valgum therefore retain the exact 8/27 count
    and evidence without a categorical frequency. This avoids inventing a rounding
    convention and was the sole issue in the first pinned re-audit; the one-issue
    immutable re-audit approved the corrected representation.

    Eligibility and collision gates were read-only and complete before mutation.
    Effective prior review state was rebuilt with event type REVIEW and the
    effective target path (`target.superseded_by.path` when present, otherwise

  summary: 'Create: Vitamin D-Dependent Rickets Type 1B'
  details: |
    De-novo curation of the CYP2R1 (hepatic 25-hydroxylase) member. Records the semidominant inheritance explicitly, qualifying the plain autosomal recessive label carried in the ontologies, and the lifelong high-dose vitamin D requirement with relapse on dose reduction. Evidence: PMID:15128933 (index L99P case establishing CYP2R1 as the 25-hydroxylase), PMID:25942481 (Nigerian families, semidominance, in vitro activity), PMID:34137732 (27-patient Saudi cohort). Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets 10/10 verified.

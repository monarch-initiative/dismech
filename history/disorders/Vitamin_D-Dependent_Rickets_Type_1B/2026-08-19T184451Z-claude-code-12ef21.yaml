  summary: 'Edit: 1B phenotype and biochemical coverage from cached cohort'
  details: |
    Closed the one remaining blocking item from the PR #8975 re-review: type 1B had consumed none of its own research and carried only two phenotypes. Added five, all from references already cited in the file, so no new sources were introduced. From PMID:34137732, the largest reported CYP2R1 cohort, three with derived-count frequencies whose denominators sit inside the quoted sentence: bone pain 25/27 (VERY_FREQUENT), short stature 12/27 (FREQUENT), hypocalcemic manifestations 5/27 (OCCASIONAL). From PMID:15128933, the index case, two without any frequency band because it is a single-patient report: hypophosphatemia and elevated alkaline phosphatase. Also added a biochemical block carrying the two analytes that position 1B in the series - 25-hydroxyvitamin D low (the blocked step, shared with nutritional deficiency, and the discriminator against type 1A) and 1,25-dihydroxyvitamin D within the normal range in the index case despite florid rickets, with a context note that a normal calcitriol therefore does not exclude the disorder. Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets 17/17; just validate-disorders passed on this file.

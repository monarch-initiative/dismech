  summary: 'Gene-family review: CYP2R1'
  details: |
    CYP2R1 modelling re-reviewed. The trigger node bound vitamin D 25-hydroxylase activity (GO:0030343) with the qualitative LOSS_OF_FUNCTION modifier; a variant-driven reduction of a normal enzyme activity is the quantitative case, so the modifier is now DECREASED. Added a 2026 family with compound heterozygous CYP2R1 variants inherited one from each parent, in which the frameshift c.75_76insA (p.Gly26ArgfsTer68) is not expressed and loses catalytic function while c.1115G>C (p.Cys372Ser) is destabilized through the unfolded protein response and partially active (PMID:42838446); used as genetic-record evidence and for a new record-level autosomal recessive inheritance block. The entry-level inheritance block, which records semidominant behavior in some families, is unchanged. ClinGen has no CYP2R1 assertion.

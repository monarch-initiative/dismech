  summary: 'Red-team review and fixes: Bainbridge-Ropers_Syndrome'
  details: |
    Adversarial red-team review of PR #7533 (issue #7499).

    INDEPENDENT VERIFICATION PERFORMED

    NEC re-check. `runoak -i sqlite:obo:mondo info MONDO:0014205 -O obo` confirms
    RO:0004003 -> HGNC:29357 (ASXL3), xref OMIM:615485, xref Orphanet:352577. The
    entry's disease_term label matches the ontology record exactly. The entry has
    not absorbed a confusable neighbour: ASXL1/Bohring-Opitz (MONDO:0011510) and
    ASXL2/Shashi-Pena (MONDO:0014963) appear only in differential_diagnoses and in
    explicitly comparative statements, and the separately curated
    kb/disorders/Bohring-Opitz_syndrome.yaml is untouched by this PR.

    Fabrication sweep. A script walked every evidence item in the YAML, resolved
    each reference to its references_cache file, and whitespace-normalised both
    sides. All 120 original snippets were exact substrings of the cache file they
    cite. A second script located each match by line number and confirmed every
    snippet falls inside the abstract block of its cache file, ruling out false
    positives from reference lists or MeSH blocks in the larger cached records.
    Fifteen PMIDs were re-checked against the live PubMed esummary API; all exist,
    all titles match the reference_title recorded in the YAML, and all are about
    ASXL3 except the two ASXL2/ASXL-family papers, which are used only as
    differentials. The deep-research artifact was confirmed genuine (real provider
    frontmatter, 58 citations, 1097s run).

    Ontology terms. All 54 term IDs were independently re-verified outside the
    validator: HP, GO, CL and MONDO via OAK, CHEBI and NCIT via the OLS4 API. Every
    label matched its ontology record exactly.

    Hygiene. `git diff origin/main...HEAD --stat` shows only the disorder YAML,
    research artifacts, reference cache files, term/enum cache rows and a history
    record. No .env, no .python-version, no generated browser or page files, no
    edits to other disorders' YAMLs.

    DEFECTS FOUND AND FIXED

    1. Missing eponymous phenotype term. The disorder's defining feature, failure
       to thrive, had no HPO binding anywhere in the entry. HP:0001508 Failure to
       thrive sits under HP:0004325 Decreased body weight and is therefore neither
       an ancestor nor a descendant of HP:0001510 Growth delay, so the combined
       'Failure to thrive and poor postnatal growth' node did not cover it. Split
       into a Failure to thrive node (HP:0001508, infantile onset) and a Poor
       postnatal growth node (HP:0001510), each with its own honest evidence.

    2. Treatment/phenotype asymmetry. The entry recommended baseline renal imaging
       on the strength of the natural-history study's 'emerging renal phenotype'
       but modelled no renal phenotype at all. Added a Renal anomalies node
       (HP:0000077, deliberately low specificity, no frequency band, with a note
       explaining both) and added it to the surveillance treatment's
       target_phenotypes.

    3. Internally inconsistent frequency bands. Prominent forehead was banded
       FREQUENT and Hypertelorism OCCASIONAL, both derived from the identical
       composite-gestalt sentence in PMID:28100473 ('distinct face (...), (9/12)')
       and with near-identical per-feature HPO frequencies. Harmonised Prominent
       forehead to OCCASIONAL and downgraded both evidence items to PARTIAL, since
       a composite 9/12 count does not decompose to individual features.

    4. Unsupported frequency band. Dental crowding was banded FREQUENT with no
       quantitative support in any cached source; GeneReviews lists dental
       anomalies only qualitatively. Frequency removed per the frequency-evidence
       SOP rather than softened.

    5. Surveillance recommendation cited as phenotype evidence. Strabismus cited
       'Dental and Ophthalmological follow-up for all' as SUPPORT, and Dental
       anomalies cited the six-monthly dental review as SUPPORT. A management
       recommendation is not direct evidence for a phenotype's presence or
       frequency; both downgraded to PARTIAL with corrected explanations.

    6. Named-but-untermed phenotype. Athetosis appeared in a phenotype node's
       name, description and cited snippet but carried no ontology term, because
       the node's single phenotype_term slot was used for hyperventilation. Split
       Athetosis out as its own node (HP:0002305) and renamed the parent node to
       Hyperventilation.

    7. Research-backed content gap. The deep-research artifact surfaced an
       infantile-onset dystonia / dystonic cerebral palsy presentation with a
       quotable, ASXL3-specific abstract, absent from the YAML. Added a Dystonia
       node (HP:0001332, infantile onset) backed by newly fetched PMID:35863334,
       whose authors conclude that dystonic features are part of the BRPS spectrum
       and that ASXL3 belongs on cerebral-palsy gene panels.

    DELIBERATELY LEFT ALONE

    The GeneReviews baseline is fully mined across all four abstract sections
    (Clinical Characteristics, Diagnosis/Testing, Management, Genetic Counseling),
    so no action was needed there. The 2026 bioRxiv ASXL3-DIO3 preprint remains
    omitted, correctly, as unrefereed and uncacheable. The 'Absence of an ASXL3
    DNA Methylation Episignature' node is a deliberate biomarker node with
    role: BIOMARKER and no downstream edges; it is intentionally outside the main
    causal chain and was left as-is. Roughly 30 deep-research PMIDs remain
    unconsumed; they are single-case or peripheral findings and were judged
    non-blocking.

    VALIDATION AFTER FIXES

    just validate: schema, term and reference validation all pass.
    just validate-references: 125/125 snippets verified against cached references.
    just compliance: 93.1 percent global (up from 92.8 percent before the fixes).

  summary: 'Create: Bainbridge-Ropers_Syndrome'
  details: |
    Created kb/disorders/Bainbridge-Ropers_Syndrome.yaml for MONDO:0014205
    (OMIM:615485; causative gene ASXL3, hgnc:29357).

    NEC preflight. Run before any content was written:
    `uv run runoak -i sqlite:obo:mondo info MONDO:0014205 -O obo` confirmed the
    RO:0004003 gene relation is HGNC:29357 (ASXL3) and the OMIM xref is 615485,
    matching the assigned target. The ASXL family is a documented
    named-entity-confusion class: ASXL1 causes Bohring-Opitz syndrome (already
    curated at kb/disorders/Bohring-Opitz_syndrome.yaml, not touched here),
    ASXL2 causes Shashi-Pena syndrome, ASXL3 causes Bainbridge-Ropers syndrome.
    Every paper cited was checked for which paralog it reports; ASXL1 and ASXL2
    papers appear only in differential_diagnoses and in explicitly comparative
    statements, never as support for an ASXL3 phenotype or mechanism. The
    lump-vs-split decision (KEEP SPLIT) is stated in the entry review_notes with
    three independent supports: the ontology/gene anchor, clinical
    discrimination from Bohring-Opitz syndrome (PMID:27901041), and molecular
    discrimination via the absent DNA methylation episignature (PMID:35361921).

    Deep research provider. claude_code, via
    `just research-disorder claude_code Bainbridge-Ropers_Syndrome`
    (falcon was not attempted because EDISON_API_KEY and FUTUREHOUSE_API_KEY
    were both empty). The run took about 18 minutes, 6 web searches, 101 turns,
    58 citations. The report is committed at
    research/Bainbridge-Ropers_Syndrome-deep-research-claude_code.md and was
    treated as a lead generator only, not as ground truth.

    GeneReviews baseline. PMID:33151654 (ASXL3-Related Disorder, Balasubramanian
    and Schirwani) was found by PubMed search, fetched with just fetch-reference,
    and tagged GeneReviews in the top-level references block. Every phenotype in
    its Clinical Characteristics section was cross-checked into the phenotypes
    list: developmental delay/intellectual disability, speech and language delay
    and absent speech, autistic features, feeding issues, dysmorphic facial
    features, hypotonia transitioning to spasticity with flexion contractures,
    poor postnatal growth, strabismus, seizures, sleep disturbance, and dental
    anomalies are all represented. Its management and surveillance
    recommendations were curated into treatments.

    Content curated. 4 progression phases; clinical_burden HIGH; inheritance
    bound to HP:0000006 with mosaicism recurrence-risk evidence; 7
    pathophysiology nodes forming a complete causal chain (ASXL3
    haploinsufficiency with NMD of the mutant transcript, impaired ASXL3-BAP1
    PR-DUB complex function, elevated H2AK119 monoubiquitination, genome-wide
    transcriptional dysregulation, disrupted neural cell fate specification,
    terminal clinical phenotype, plus a separate node for the informative
    negative episignature finding) with GO/CL/GO-complex terms, biological_scale
    tags, and evidence on the causal edges themselves; 22 phenotypes with HPO
    terms and frequency bands each justified by quantitative cohort data; a
    genetic section recording the MCR1/MCR2 genotype-phenotype correlation and
    the NMD versus no-NMD split; 2 diagnosis entries; 4 differential diagnoses;
    9 treatments with NCIT and CHEBI bindings and honest n=1 caveats on
    pregabalin and behavioral intervention; 3 discussions (one
    HUMAN_MODEL_MISMATCH about the Xenopus-only neural cell-fate evidence versus
    normal human brain MRI, two KNOWLEDGE_GAP) each with structured
    proposed_experiments and decision criteria; and a deliberately qualitative
    ULTRA_RARE prevalence record noting that no denominator-based estimate
    exists.

    References. 20 references, all real PMIDs fetched with just fetch-reference.
    No references_cache file was hand-written or hand-edited.

    Validation. `just validate` passes clean: schema validation "No issues
    found", term validation passed, reference validation "All validations
    passed" with 120/120 snippets verified against cached abstracts.
    `just validate-terms` passed. `just validate-references` reported 120/120
    snippets verified. `just compliance` reported 92.8 percent global and 93.0
    percent weighted compliance.

    Knowingly incomplete. (1) The 2026 bioRxiv preprint describing an
    ASXL3-DIO3-thyroid hormone-parvalbumin interneuron axis and an AAV
    split-intein ASXL3 gene replacement rescue in mice and non-human primates is
    the most significant recent mechanistic and therapeutic development, but it
    is unrefereed and could not be fetched into references_cache with the
    standard tooling, so it was omitted rather than cited weakly; it should be
    added on peer review. (2) The provisional biallelic-missense congenital
    heart defect phenotype is recorded as a knowledge gap rather than asserted
    as an allelic disorder. (3) Orphanet (ORPHA:352577) and ClinGen structured
    sources were not cited: the Orphadata bulk XML is gitignored and absent, and
    `just clingen-refresh` failed on a pinned-checksum mismatch against upstream,
    which was left alone rather than worked around. (4) No numeric prevalence is
    asserted because none exists in the literature. Both omissions (1) and (3)
    are recorded in the entry notes field.

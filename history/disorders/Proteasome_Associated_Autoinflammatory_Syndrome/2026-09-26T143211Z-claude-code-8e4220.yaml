  summary: 'Genetics pass: PRAAS1-6 subtype series, gene wiring, chaperone node'
  details: |
    Genetics pass for the d2g series-052 gap list (issue 12259). Checked the parent
    anchor first: disease_term MONDO:0009726 is the PRAAS umbrella and all four
    checklist diseases are its direct children, so the anchor is correct and no
    narrowMatch remedy was needed.

    Curated the full OMIM-numbered subtype series as has_subtypes rows, not only the
    four on the checklist. PRAAS1 (PSMB8, hgnc:9545, MONDO:0054698), PRAAS2 (POMP,
    hgnc:20330, MONDO:0054700), PRAAS3 (PSMB4, hgnc:9541, MONDO:0054699), PRAAS4
    (PSMG2, hgnc:24929, MONDO:0030931), PRAAS5 (PSMB10, hgnc:9538, MONDO:0030924),
    PRAAS6 (PSMB9, hgnc:9546, MONDO:0968983). Each row carries a bound subtype_term,
    a bound gene, and evidence; five carry a bound inheritance_term (PRAAS4 does not,
    because its abstract does not state inheritance).

    Added six genetic records with reciprocal subtype foreign keys (POMP, PSMB4,
    PSMG2, PSMB10, PSMB9 new; subtype PRAAS1 added to the existing PSMB8 record), plus
    a PSMA3 record typed COOPERATING for the digenic partner that the disease-level
    inheritance section already named but nothing bound.

    Split the root pathophysiology node along the distinction the sources draw:
    Proteasome Subunit Loss of Function (PSMB8, PSMA3, PSMB9, PSMB10, PSMB4) and a new
    Proteasome Assembly Chaperone Loss of Function (POMP, PSMG2), both feeding Impaired
    Proteasome Biogenesis and Activity. Nothing targeted the renamed node, so no
    pathograph target was broken. Gene wiring moved from 0/2 to 7/8; the one record
    still unwired is the spectrum-level record that has no gene_term by design and now
    explains in its notes which genes it retains (PSMB7, PSMA5, PSMC5).

    PRAAS6 is the contested row. Its two reported patients carried the same de novo
    PSMB9 G156D variant with pulmonary hypertension and combined immunodeficiency and
    no lipoatrophy, and the reporting authors proposed a separate category, PRAAS-ID.
    The row follows the OMIM and MONDO placement under this umbrella and carries that
    authors' proposal as a REFUTE evidence item against its own placement, with the
    reasoning also in the entry notes.

    PMID:31783057, the PSMB10 discovery letter, has no abstract in PubMed and no
    retrievable body, so PRAAS5 is evidenced from the 2023 case series (PMID:37600812)
    instead and that letter is not cited.

    Self-review correction before commit. The first draft described PSMB4 as a
    constitutive catalytic subunit. It is not: the three catalytic active site
    subunits are beta-1, beta-2 and beta-5 (PSMB6, PSMB7, PSMB5), and PSMB4 encodes
    the structural beta-7 subunit. Corrected in the gene descriptor, the genetic
    record notes and the node description. Three over-claims were also narrowed in
    the same pass: two "no OMIM-numbered form of its own" absence claims were
    rewritten as checkable statements about the six numbered forms; the PRAAS2 and
    PRAAS6 naming provenance was tied to the MONDO label and OMIM xref that were
    actually looked up; and a clause contrasting the POMP dominant-negative mechanism
    with a hypomorphic subunit was dropped because two of the cited papers describe
    that mechanism differently.

    Validation: just validate passed with 64 snippets checked and 0 issues;
    just validate-terms passed; just list-gene-term-mismatches --resolve reported 0
    findings with full HGNC coverage; check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-case-collisions, check-environmental-evidence and
    check-coarse-phenotypes all clean.

  summary: 'Review round 1: PSMB4 is a structural not catalytic subunit'
  details: |
    Review round 1 on PR 12906. The reviewer found that the beta-7 correction made
    before the first commit had missed one field: the PSMB4 genetic record still read
    association "Catalytic-subunit cause of the PRAAS3 form and digenic partner" while
    its own notes two lines below said PSMB4 is a structural subunit of the beta-ring
    and not one of the three catalytic active site subunits. Changed to
    "Structural-subunit cause of the PRAAS3 form and digenic partner".

    The same contrast was inconsistent in six further places written in the same pass,
    because the subunit branch of the pathograph holds PSMB4 (beta-7) and PSMA3
    (alpha-7), neither of which is catalytic. The Proteasome Subunit Loss of Function
    node opened with "structural subunits of the proteasome" and then listed mostly
    catalytic ones, so it now reads "subunits of the proteasome"; the Proteasome
    Assembly Chaperone Loss of Function node contrasted itself with "the catalytic
    subunits themselves" and now contrasts with "the proteasome subunits themselves";
    and four gene-descriptor and notes clauses that said "catalytic-subunit defect",
    "catalytic-subunit forms", "catalytic-subunit route" and "catalytic-subunit arm"
    now say proteasome-subunit or subunit.

    The PSMB10 and PSMB9 association strings still say catalytic-subunit, which is
    correct: beta-2i and beta-1i are catalytic. One pre-existing sentence in the
    spectrum-level genetic record ("affecting proteasome catalytic subunits and
    proteasome assembly factors") was left alone, as it predates this work and the
    reviewer did not raise it.

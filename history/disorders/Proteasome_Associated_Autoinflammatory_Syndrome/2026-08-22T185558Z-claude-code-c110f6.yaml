  summary: Withdraw two over-claims from the digenic inheritance block
  details: |
    Self-review before opening the PR. Two claims went beyond the cited abstract. First, the block named PSMA3, PSMB4, PSMB9 and PSMB8 as the loci reported across the DIGENIC families; PMID:26524591 lists those as the genes in which the study found mutations overall and states only the subunit CLASSES that pair (one inducible plus one constitutive), never the per-family combinations. The block now says exactly that and marks the per-family pairings as deliberately unstated. Second, the block asserted the phenotype follows additive loss of total proteasome activity rather than failure of either subunit class alone; the abstract reports the mutations variably affecting transcription, expression, folding, assembly and ultimately activity, and makes no such comparison. That sentence is withdrawn and the additive-loss framing is now attributed to the study's title rather than presented as a measured result. No snippet text changed.

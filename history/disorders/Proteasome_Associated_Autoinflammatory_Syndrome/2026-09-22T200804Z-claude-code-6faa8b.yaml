  summary: 'Review: connect seven detached phenotypes (IUIS Table 7)'
  details: |
    All seven were detached behind a complete chain to the persistent interferon signature.

    Lipodystrophy is drawn as INDIRECT_KNOWN_INTERMEDIATES because in this disease it follows the panniculitis rather than occurring independently - the sequence is inflammation of subcutaneous fat first, then its loss. The periodic fever edge notes that it is interferon-driven rather than inflammasome-driven, which is what distinguishes this from the classic periodic fever syndromes it superficially resembles.

  summary: Add inheritance section with recessive, dominant and digenic arms
  details: |
    Boundary sweep for the Digenic_and_Oligogenic_Disorders grouping. The entry had no inheritance section at all, while its genetic section asserted recessive, digenic and de novo dominant-negative architectures with no citation for the digenic claim. Added three blocks sourced from the discovery study (PMID:26524591): autosomal recessive PSMB8 CANDLE, autosomal dominant POMP, and digenic inducible-plus-constitutive subunit pairing across six patients in four families, plus a 2024 review (PMID:38578475) confirming digenic and oligogenic inheritance as established for proteasome disease. Both references newly fetched and cached. A 2026 report extending the pattern to PSMA6 (PMID:41205671) is named in the block description but not curated as evidence because PubMed serves no abstract for it. Validated with linkml-validate and count-verified-snippets. Entry added as a member of the grouping.

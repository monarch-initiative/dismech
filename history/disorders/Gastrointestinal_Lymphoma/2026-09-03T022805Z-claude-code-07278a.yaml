  summary: Bind both lineages on the antigenic-stimulation node
  details: |
    Correction following PR review (monarch-initiative/dismech#10629). The --bind-single-cell pass had bound only B cell (CL:0000236) to 'Chronic Mucosal Antigenic Stimulation', but this entry also covers EATL and MEITL, whose postulated cell of origin is the intraepithelial lymphocyte -- the entry says so in its own IL-15 node. Added intestinal intraepithelial lymphocyte (CL:0020035) alongside the B cell, so the derivation reports MULTI_ORIGIN_CELL and the lump/split question this entry raises becomes visible rather than being hidden by a single wrong binding.

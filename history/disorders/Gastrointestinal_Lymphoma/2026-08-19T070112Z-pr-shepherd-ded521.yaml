  details: |
    Second review-response session on PR #8830, addressing the ai4c-reviewer CHANGES_REQUESTED findings 2 (unevidenced causal edges), 3 (no diagnosis: section) and 5/4 (no genetic: section), plus three non-blocking suggestions. Finding 1 (no deep-research artifact) is NOT addressed here and remains open; it needs a real DR pass.

    PROVENANCE CORRECTION. The preceding history record (2026-08-18T152843Z-pr-shepherd-6e4deb) states that "six of the seven `downstream` causal edges still carry no evidence". That figure was wrong: `just compliance` reported `pathophysiology[].downstream[].evidence: 0.0% (0/7)` at that commit, i.e. ZERO of seven edges carried evidence, not one. History records are append-only, so that record is left untouched and the correction is recorded here. The reviewer flagged the same discrepancy.

    FINDING 2 - causal-edge evidence, 0/7 -> 7/7. Every edge citation reuses a reference already cached in this branch; no reference cache file was created or edited, and no new PMID was introduced.
    - Chronic Mucosal Antigenic Stimulation -> Pro-Tumorigenic Mucosal Lymphoid Microenvironment: two SUPPORT items. PMID:20303878 for the general step ("tumorigenic pathogens subvert host immunity and establish persistent infections associated with low grade but chronic inflammation") and PMID:37627888 for the small-bowel instance (continued gluten exposure in a GFD-unresponsive patient "providing a chronic inflammatory environment").
    - Pro-Tumorigenic Mucosal Lymphoid Microenvironment -> Antigen-Driven Clonal Lymphoid Expansion: one PARTIAL item, PMID:21568677, that gastric MALT lymphoma "is a prototypical cancer that occurs in the setting of chronic inflammation". PARTIAL because it establishes the setting, not that the infiltrate supplies the selecting accessory-cell signals.
    - Pro-Tumorigenic Mucosal Lymphoid Microenvironment -> IL-15-Driven JAK-STAT Activation in IELs: two SUPPORT items from PMID:37627888 - the IL-15Ralpha membrane-complex sentence ("subsequently activating RCDII IELs") and "Epithelial-derived IL-15 plays an important role in the expansion of aberrant cell population".
    - Antigen-Driven Clonal Lymphoid Expansion -> Transformation to Antigen-Independent Lymphoma: SUPPORT, PMID:21568677, "chromosomal translocations are acquired that render the lymphoma antigen-independent". This is the copy the reviewer named; the same quote was already verified on the downstream node, and is carried onto the edge because the edge is its own claim.
    - Antigen-Driven Clonal Lymphoid Expansion -> Mucosal and Transmural Lymphomatous Infiltration: the WEAKEST of the seven, and handled by fitting the claim to the evidence rather than the reverse. No cached source states that the antigen-dependent clone progresses to transmural, wall-replacing infiltration. The edge description was therefore NARROWED from "infiltrates and progressively replaces the wall of the involved gut segment" to mucosal and submucosal occupation, with transmural progression explicitly reassigned to the edge from the transformation node, and cited PARTIAL against PMID:36756091 ("MALT lymphoma is composed of submucosal proliferation of small centrocyte-like cells"). The explanation records that the transmural step is unevidenced in the cached corpus. Anyone reviewing this edge should read it as a deliberately reduced claim, not as a fully evidenced one.
    - IL-15-Driven JAK-STAT Activation -> Transformation to Antigen-Independent Lymphoma: PARTIAL, PMID:37627888, "enables the acquisition of mutations and malignant transformation into EATL". PARTIAL because the source evidences malignant transformation but not the further antigen-INDEPENDENCE claim carried by the target node's name.
    - Transformation to Antigen-Independent Lymphoma -> Mucosal and Transmural Lymphomatous Infiltration: two SUPPORT items from PMID:37627888 - angiocentricity/angioinvasion "may lead to extensive necrosis, often resulting in obstruction, intestinal perforation, and peritonitis", and NKp46-mediated enterocyte killing "resulting in severe ulceration".

    FINDING 3 - diagnosis: section added, and the section-appropriateness violation removed. The Mucosal and Transmural Lymphomatous Infiltration node description no longer ends "so that diagnosis rests on biopsy"; it now points at the diagnosis: section instead, and the affected evidence item's explanation was retrimmed to match. Three diagnosis entries:
    - Endoscopic biopsy with histopathological analysis (NCIT:C15389 Endoscopic Biopsy), four evidence items: PMID:21390139 that imaging is non-specific "thus mandating histopathological analysis for its definitive diagnosis"; PMID:36756091 that six of eight cases were diagnosed on endoscopic biopsy and two after resection, and that a first biopsy is not invariably diagnostic; PMID:35125760 naming colorectal adenocarcinoma as the differential radiology cannot resolve.
    - Helicobacter pylori testing (NCIT:C189536 Helicobacter pylori Measurement), curated explicitly as the GATE on treatment 1 rather than as a test for the lymphoma. Two items from PMID:37122607: the meta-analysis eligibility criterion restricting the eradication evidence base to H. pylori-positive patients, and the guideline recommendation the test gates. Individual assays (urea breath, stool antigen, histology, serology) are not compared by the cached sources, so no method is asserted and the term is left at the general measurement level.
    - Staging and extent-of-disease workup (NCIT:C17007 Positron Emission Tomography). PMID:37627888 names the workup verbatim ("magnetic resonance enteroclysis, a positron emission tomography scan, and a histologic identification of lesions present"); PMID:26988370 establishes clinical stage as an independent prognostic factor. NCIT has no enteroclysis term (searched sqlite:obo:ncit), so only the PET component is bound, and that limitation is recorded in the entry's notes. No formal staging system is asserted: a stages: section using Lugano is left to separate work rather than invented from these sources.
    All three NCIT CURIEs were verified with OAK (runoak -i sqlite:obo:ncit info / ancestors) for label and for reachability from NCIT:C25218 before use. NCIT:C15389 and NCIT:C189536 were new to cache/enums/treatmentactionterm and cache/ncit/terms.csv and were warmed by linkml-term-validator itself; no cache row was hand-written.

    FINDINGS 4/5 - genetic: section added, scoped to the gastrointestinal T-cell arm. The reviewer's minimum was JAK1/STAT3 + HLA-DQ2.5 or an explicit deferral note; the real section was curated instead, because there is no EATL or MEITL entry anywhere in kb/disorders/ and these genetics would otherwise be absent from the KB. All quotes are from the full-text body of the full_text_xml-cached PMID:37627888, and every explanation says so explicitly, since a full-text quote is not abstract-verifiable the way the rest of this entry's evidence is.
    - JAK1 (hgnc:6190) and STAT3 (hgnc:11364), both SOMATIC_DRIVER / SOMATIC, on "JAK1 or STAT3 gain-of-function mutations garner the cells with hyper-responsiveness to IL-15" plus, for JAK1, the pathway's standing as "among the most commonly mutated signaling pathways in EATL pathogenesis" and, for STAT3, JAK1-STAT3 synergy with NF-kB-activating mutations. The source is a narrative review, not a sequencing cohort, so no mutation frequency is asserted.
    - SETD2 (hgnc:18420), SOMATIC_DRIVER / SOMATIC, subtype Small Intestine, deliberately scoped to MEITL and not to EATL: the review is explicit that SETD2 is the most frequently mutated gene in MEITL and that the majority of its mutations are loss of function, while EATL in the same comparison showed TP53/NOTCH/VEGF/PI3K-AKT lesions.
    - HLA-DQ2.5 haplotype, SUSCEPTIBILITY / GERMLINE, subtype Small Intestine, gene_term bound to HLA-DQB1 (hgnc:4944). Curated with care on two points the reviewer flagged. First, this is a germline risk association, NOT a somatic driver, and the notes say so in terms. Second, the reported 53.3% is the proportion of EATL patients who are HLA-DQ2.5 homozygous - a frequency among cases, not a relative risk, attributable fraction or per-gene case fraction - so it is deliberately NOT recorded in frequency: or case_fractions:. The single-valued gene_term is noted as an approximation: the DQ2.5 heterodimer is encoded jointly by HLA-DQA1 (hgnc:4942) and HLA-DQB1.
    All five hgnc CURIEs were already present in cache/hgnc/terms.csv; GeneTerm has no reachable_from constraint, so only label validation applies and no network lookup was needed.

    NON-BLOCKING SUGGESTIONS FOLDED IN.
    - SCOPE note narrowed. It previously read as an exhaustive enumeration of the tubular GI tract. It now states that the five site subtypes were selected by prevalence and names the three tubular-GI descendants of MONDO:0004699 that are NOT modelled - MONDO:0002034 cecum, MONDO:0001237 appendix, MONDO:0001888 anus - and flags the cecum omission specifically, since the entry cites the ileocecal region as the third commonest site. This is the cheaper and more honest of the reviewer's two options; adding three subtypes would have required evidence this branch's cache does not carry.
    - Gluten-Free Diet now has treatment-level evidence, both from PMID:37627888: a SUPPORT item that coeliac disease is "caused by exposure to gluten in a genetically susceptible individual" (the rationale for the intervention) and a PARTIAL item that "many cases of EATL arise despite a strict GFD". The pair is deliberate - it keeps the treatment from reading as curative, which is the honest difference from the H. pylori eradication arm.
    - CL:0009060 was NOT changed, per the reviewer's own reasoning: it follows the MALT_Lymphoma precedent and CL offers nothing better (only CL:0000845 marginal zone B cell of spleen). A CELL TYPE IMPRECISION paragraph was added to notes: recording that the canonical label "marginal zone B cell of lymph node" is anatomically wrong for gut MALT, that the preferred_term is deliberately the unqualified "marginal zone B cell" so the display does not assert the nodal location, and that a CL new-term request would resolve it. The imprecision is now on the record rather than looking settled.
    - A GENETIC SCOPE paragraph was added to notes explaining that the B-cell/MALT genetics stay in MALT_Lymphoma while the T-cell genetics are carried here for want of any other home.

    DELIBERATELY NOT DONE. stages: and histopathology: (larger additions, non-blocking, better as separate work, and the second would properly belong to an EATL/MEITL entry). datasets: (still missing; unchanged by this session). Finding 1, the deep-research artifact, is out of scope for this session.


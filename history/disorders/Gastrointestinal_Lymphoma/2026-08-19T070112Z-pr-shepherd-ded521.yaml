    ONE PRE-EXISTING FAILURE, NOT CAUSED BY THIS SESSION AND NOT FIXED HERE. `just check-title-snippets` exits 1 with four findings, all four in kb/disorders/Juvenile_Neuronal_Ceroid_Lipofuscinosis.yaml, a file this branch does not touch. Cause is branch staleness, not content: origin/main commit e5695136fe ("Fix pre-existing title-only evidence snippets blocking PR #8709's CI") repaired those snippets AFTER this branch was cut, so the branch's older copy of that file now looks "new" against the refreshed origin/main grandfather baseline. The remedy is a branch refresh from main, which this session was explicitly instructed not to perform (no rebase, no reset, no force-push). Recorded here so it is not mistaken for a regression introduced by this commit.

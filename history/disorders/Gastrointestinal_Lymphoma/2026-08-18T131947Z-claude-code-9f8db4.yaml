  summary: 'Create: Gastrointestinal Lymphoma (MONDO:0004699)'
  details: |
    Created the Gastrointestinal Lymphoma entry (MONDO:0004699) for issue #8829, a
    CURATE_ROOT_WITH_SUBTYPES target that was previously unbound anywhere in kb/.

    DELIVERABLE TYPE. Curated as a Disease entry in kb/disorders/, not a Grouping.
    The issue raised Grouping as an option and the argument is recorded in full as a
    RESOLVED INTERPRETATION discussion (gi_lymphoma_disease_vs_grouping) on the
    entry. Summary: a dismech Grouping asserts that each listed member IS a member,
    and that assertion is false for the curated histology entries -- MALT lymphoma
    also arises in lung, ocular adnexa, salivary gland and thyroid, and DLBCL,
    mantle cell and peripheral T-cell lymphoma are overwhelmingly nodal. Only their
    GI-site restrictions are members, and neither those nor the five MONDO site
    children exist as Disease entries, so a Grouping would have no well-formed
    members to point at. The entry also carries a real shared pathograph, which a
    Grouping has no slot for.

    SUBTYPE AXIS. Anatomic site only (gastric MONDO:0001059, small intestine
    MONDO:0001852, colon MONDO:0002035, esophagus MONDO:0001188, rectum
    MONDO:0002166). Site is the axis that constitutes the concept (MONDO defines the
    class as lymphoma located in the digestive system), site partitions the disease
    cleanly whereas histology does not, and the site+histology leaves overlap the
    site subtypes. The histology axis is already curated as standalone entries and
    is cross-referenced rather than duplicated. The decision and its reasoning are
    recorded in the entry's notes. Scope restricted to the tubular GI tract;
    accessory-organ and Waldeyer's-ring MONDO descendants, and the two splenic
    leukaemia-manifestation descendants, are explicitly excluded in notes.

    MECHANISM. Six pathophysiology nodes carrying the antigen-driven chronic
    stimulation route that distinguishes GI from nodal lymphoma: chronic mucosal
    antigenic stimulation -> pro-tumorigenic mucosal lymphoid microenvironment ->
    antigen-driven clonal lymphoid expansion (B-cell arm) and IL-15-driven JAK-STAT
    activation in intraepithelial lymphocytes (coeliac/EATL T-cell arm) ->
    transformation to antigen-independent lymphoma -> mucosal and transmural
    lymphomatous infiltration. The Parsonnet NEJM nested case-control study
    (PMID:8145781) anchors the site-specificity claim, since it reports the H.
    pylori association for gastric but explicitly not for non-gastric NHL.

    MODULE CONFORMANCE. Two nodes conform to tumor_promoting_inflammation
    (#Chronic Inflammatory Stimulus and #Pro-Tumorigenic Inflammatory
    Microenvironment). Conformance to the module's third node
    (#Hallmark-Promoting Inflammatory Output) was deliberately NOT declared and the
    reason is recorded in notes: that node models bioactive molecules supplied by
    the microenvironment to the tumour, whereas the corresponding node here models
    an acquired tumour-cell-intrinsic genetic lesion that uncouples growth from the
    microenvironment.

    OTHER CONTENT. Five site subtypes with evidence; eleven phenotypes (frequency
    bands asserted only where the cited cohort reports a percentage, from
    PMID:26988370; frequency deliberately omitted on T-cell lymphoma, malabsorption,
    dysphagia and perforation); three structured prevalence records (a
    share-of-GI-cancers record with measure_type UNKNOWN and no rate asserted, plus
    SEER annual incidences for colorectal lymphoma and EATL); three environmental
    exposures wired into the pathograph via influences_mechanisms (H. pylori bound
    to ECTO:3000003; gluten and Campylobacter jejuni left unbound with notes
    recording that ECTO was searched and holds no suitable term); four treatments
    with target_mechanisms edges; and two discussions.

    VALIDATION RUN AND READ TO COMPLETION.
    - just validate -> "All validations passed"
    - just validate-terms -> "Validation passed" (OLS cache warmed first; see below)
    - just count-verified-snippets -> "Snippets checked: 48/48 verified against
      cached references". A negative control was run on this same file (one snippet
      corrupted) and the tool correctly reported 47/48 with the offending path named
      and exited 1, so the 48/48 is a genuine positive result rather than a vacuous

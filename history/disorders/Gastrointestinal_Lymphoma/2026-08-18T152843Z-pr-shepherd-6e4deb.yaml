    Automated PR-shepherd response to the ai4c-reviewer CHANGES_REQUESTED review on PR #8830, plus the failing `test (3.13)` job.

    CI blocker: `just check-environmental-evidence` failed on two new evidence-free exposures. Both already carried well-cited `influences_mechanisms` link evidence, but the guard requires an entry-level `evidence:` block with a non-empty snippet (see scripts/check_environmental_evidence.py `_has_quoted_evidence`), and grandfathering is unavailable when checking against a ref. Added entry-level evidence to both, quoting only already-cached references — no reference cache file was created or edited.


    Full publication-readiness review of the disorder entry. The disease-specific Asta artifact was inspected and found to be retrieval-only and off-topic, so completeness was reassessed with current PubMed searches for Aland/Åland Island eye disease, Forsius-Eriksson syndrome, and CACNA1F. No GeneReviews article exists. Added the omitted 2025 disease-specific two-patient report PMID:40400241; the focused 2022 high-myopia item PMID:35065730 had no abstract and was not retained. Added structured Orphanet prevalence, childhood nyctalopia, iris transillumination, and the newly reported choroidal-thinning/ERG spectrum. Debundled the pathograph into molecular, synaptic, visual-function, refraction, foveal-development, and pigmentation states; marked clinically inferred causal edges PARTIAL with unknown intermediates where appropriate; and made the genetic-testing limitation across the AIED/CSNB2A continuum explicit. Treatments and trials remain empty because no AIED/CACNA1F-specific interventional study or snippet-supported disease-specific treatment publication was found; broad registries and nonspecific CSNB studies were excluded. Source polarity and evidence_source were reviewed for every evidence item. In response to automated publication review, choroidal thinning was bound to HP:0000610 Abnormal choroid morphology and routed provisionally through abnormal ocular growth, the nystagmus edge was made indirect with partial evidence, and congenital onset was added from PMID:40400241. The deprecated existing updated_date was retained per the design register's deprecated-field policy; a neurological-channelopathy classification was not added because it would misclassify a retinal channelopathy; and PubMed's Ȧland source title was retained verbatim. Targeted schema, term, history, reference-cache-frontmatter, term-cache-integrity, and folded-hyphen validation passed; reference validation verified 56/56 snippets. Compliance is 93.9% global / 94.6% weighted. Connectivity is 
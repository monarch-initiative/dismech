    De novo creation of the Organophosphate Poisoning entry (MONDO:0800386). Deep research via the claude_code provider. Models the cholinergic mechanism as 11 de-bundled atomic pathophysiology nodes: bioactivation (thion->oxon via P450), acetylcholinesterase inhibition, enzyme aging, synaptic acetylcholine accumulation, and separate muscarinic/nicotinic/central overstimulation arms converging on respiratory failure, plus the intermediate syndrome and the NTE(PNPLA6)->distal axonal degeneration OPIDN arm. Three subtypes (acute cholinergic crisis, intermediate syndrome, OPIDN with its own MONDO:0957912), 13 phenotypes, 2 cholinesterase biomarkers, PON1 genetic susceptibility modifier, 4 exposure sources, 5 treatments (atropine, pralidoxime, benzodiazepine, decontamination, ventilation) with target_mechanisms, and a KNOWLEDGE_GAP discussion on the contested clinical efficacy of oximes. All 47 evidence snippets verified as exact substrings of cached PubMed abstracts; all ontology terms OAK-verified. just validate and validate-graphs pass; weighted compliance 90.7 percent.

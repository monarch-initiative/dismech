  summary: Add chlorpyrifos zebrafish VAMR behaviour model
  details: |
    Added the first animal model on this entry: wild-type zebrafish larvae exposed to chlorpyrifos and tested in the Visual and Acoustic Motor Response (VAMR) assay (Spath et al. 2026, PMID:41780647).

    The model links to the node Central cholinergic overstimulation with relationship MEASURES, fidelity UNKNOWN and model_scale ORGANISM. MEASURES rather than RECAPITULATES because the study measured locomotor behaviour only: it did not measure acetylcholinesterase activity or acetylcholine, and it does not attribute the behavioural effects to cholinesterase inhibition. Two typed divergences carry that gap (PROXY_QUANTITY for movement standing in for cholinergic transmission, SPECIES_MISMATCH for the zebrafish-human toxicokinetic difference the authors state).

    Three readouts record direction: increased movement in normally quiescent periods after a 40-minute exposure at 5 days post-fertilization, decreased movement on most endpoints after exposure from 1 to 5 days post-fertilization, and UNCHANGED in the light period after developmental exposure.

    Evidence comes from the open full-text copy of the article on Zenodo, cached through just fetch-reference as a url: reference. The PubMed record for this article caches as abstract only, so the methods and results sentences are quotable only through that copy; both cache files are committed.

    Potency figures are limited to the two AC50 ranges the article text states (2.46-9.01 micromolar acute, 0.08-0.17 micromolar developmental). Per-endpoint hit calls and AC50 values live in the publisher's supplementary workbook, which is not a cached reference, so they are not quoted in the entry; they are tabulated in docs/reports/zebrafish-vamr-assay-2026-10-03.md with its data file instead.

    Validated with just validate, just count-verified-snippets (64/64 verified), just validate-terms, the offline gates, and just validate-disorders.

  summary: Add chronic take-home pesticide exposure route and its mechanism gap
  details: |
    Added an environmental[] entry for the take-home and residential pesticide exposure route of farmworker families, and an OPEN KNOWLEDGE_GAP discussion attached to it and to the absorption node.

    Source: PMID:35429626 (Bahrami et al., NeuroImage 2022), surfaced by an OpenScientist deep-research review of that paper. The paper is a cross-sectional fMRI cohort of 78 Latinx 8-year-olds, 48 from farmworker families, reporting that graded parent-reported pesticide exposure from the prenatal period to 96 months tracks default-mode-network topology. All eight effect sizes quoted by the research report were checked against the cached full text and match.

    Three curation decisions worth recording. The exposure term is bound to ECTO:0000530 exposure to pesticide, not the narrower ECTO:9000284 exposure to organophosphorus compound that the research report proposed: the paper's exposure variable is months living near treated fields with no chemical assay, and it writes "organophosphate" only when describing other studies, so the narrower term would assert a chemical identity the source does not carry. The mechanism link is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES rather than TRIGGERS, because this route carries no dose capable of producing the cholinergic syndrome the rest of the entry models, and no study of it has assayed cholinesterase in the exposed children. Two of the four evidence items carry quote_role BACKGROUND, because the exposure-pathway and child-vulnerability sentences come from the paper's introduction restating others' work rather than from its own results; the finding itself is PRIMARY_RESULT and graded directness INDIRECT, since the measured outcome is brain-network topology in undiagnosed children and not any manifestation of poisoning.

    Nothing was added to the pathophysiology chain, and no conformance to acetylcholinesterase_inhibition was claimed: that module opens at enzyme inhibition, and this paper measures none.

    Validated with validate, validate-terms, check-entity-refs, count-verified-snippets (71/71), check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-environmental-evidence, check-snippet-grading, check-snippet-length, check-reference-titles and check-title-snippets.

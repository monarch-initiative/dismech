  summary: 'Review round 1: chlorpyrifos VAMR model relationship and readouts'
  details: |
    Review round on the chlorpyrifos zebrafish VAMR model added earlier the same day. The record for that session stands as written; this one records what the round changed, including the one decision it reversed.

    The link relationship changed from MEASURES to PERTURBS. The earlier record argued for MEASURES on the grounds that the study observed behaviour and never measured acetylcholinesterase or acetylcholine, so it could not claim to reproduce the mechanism. That reasoning is still sound about what the study measured, but it was answering the wrong question: the schema's MEASURES is a readout 'without claiming to reproduce or perturb', and PERTURBS covers a 'chemical challenge' by name. Chlorpyrifos immersion is a chemical challenge to cholinergic transmission, so PERTURBS is what the model does to the node. The measurements it was reasonable to want MEASURES for are carried by the readouts, which is where they belong.

    Both AC50 explanations were corrected. They said the quoted ranges covered 'the endpoints the authors fitted', which reads as all 26. The paper introduces those figures with 'Curve fits for the same endpoints shown in Fig. 2', so the ranges cover the four endpoints in Fig. 3A-D. This was a substantive error rather than loose wording: chlorpyrifos's most sensitive acute endpoint is BSL2 at 0.53 micromolar, below the 2.46 micromolar floor of the quoted acute range, so the old wording understated the compound's potency to anyone reading the range as assay-wide.

    A fourth readout was added for the acute increase in dark-period activity, which the paper reports alongside the quiescent-period increase. It keeps the authors' 'some dark periods' rather than generalising.

    quote_role was assessed on the two quotes taken from the discussion: BACKGROUND for the zebrafish-human toxicokinetic gap, which restates a known property of the model system rather than a result of this study, and PRIMARY_RESULT for the authors' conclusion that it is unclear whether acute behavioural effects predict developmental outcomes, which is their own conclusion about their own work.

    The report describing the assay was moved out of this PR to a separate one, because a PR touching kb/ may not also change docs/ without a scope-override label.

    Validated after the changes: just validate, count-verified-snippets (65/65 verified), validate-terms, validate-disorders, validate-history, and the offline gates.

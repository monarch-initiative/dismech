  details: |
    Acts on the ai4c-reviewer suggestions on PR #10417. Dysarthria and Nystagmus now have incoming edges from Central Nervous System Involvement, where the entry's own prose already places them, and Delayed Ability to Walk from Length-Dependent Sensorimotor Axonal Degeneration, with the description recording why the peripheral node rather than the central one is the right parent. The HUMAN_MODEL_MISMATCH discussion's attaches_to now names both mouse models explicitly instead of animal_models#Mouse, which resolved to both only by accident of the shared species field. The ClinGen in-vitro-summary evidence item was regraded from IN_VITRO to OTHER with directness INDIRECT: evidence_source classifies the cited publication, a ClinGen curation record is a curation record throughout, and 704 of 709 CGGV citations in kb/ are graded OTHER. Not acted on: adding CMTDIG to the Intermediate Charcot-Marie-Tooth Disease has_subtypes list, which would modify an existing entry this PR deliberately leaves alone.

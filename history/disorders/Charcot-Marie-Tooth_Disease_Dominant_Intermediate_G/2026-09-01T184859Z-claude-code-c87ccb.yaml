  summary: 'Fix: drop phenotypes# prefix from bare-name pathograph targets'
  details: |
    CI step 'Check pathograph targets resolve' (scripts/check_causal_targets.py, issue #10112) failed on eleven downstream targets. downstream[].target does not use the <kind>#<name> entity-reference grammar; dismech.graph matches it verbatim against another item's name, so a prefixed target is silently unresolved and renders as a phantom duplicate node while orphaning the real node. The prefix was dropped from all eleven. Local equivalent is just check-causal-targets, which is not among the pre-PR gates listed in CLAUDE.md.

  summary: 'Create: Charcot-Marie-Tooth Disease Dominant Intermediate G (MONDO:0036484,
    NEFL)'
  details: |
    New standalone Disease entry for CMTDIG, the intermediate-conduction presentation of autosomal dominant NEFL-related neuropathy. Mechanism curated as neurofilament network disruption and NFL aggregation, failure of neurofilament delivery to distal axons, failure of radial axonal growth, and intermediate-range conduction slowing arising from reduced axonal calibre rather than from a myelin lesion. Sources: the two Berciano dominant-intermediate pedigrees (PMID:25877835 E396K, PMID:26645395 N98S), the NEFL clinical-literature review PMID:33993654, the pooled NEFL cohort PMID:28501821, the Korean national NEFL series PMID:35044100, the Nefl N98S knock-in mouse PMID:25552649, the Nefl E397K knock-in mouse PMID:40635134, and the ClinGen autosomal dominant NEFL-CMT assertion. Entry-type decision and the contrary evidence are recorded as a KNOWLEDGE_GAP discussion: PMID:33993654 and ClinGen both treat CMT1F/CMT2E/CMTDIG as presentations of one dominant NEFL disease rather than distinct entities, and the entry states this rather than asserting a mechanistic distinction. Named entity confusion handled explicitly for serum NfL biomarker literature, the other NEFL diseases, and GAN-related giant axonal neuropathy. Both mouse models are published as CMT2E models; that mismatch is curated as a FAILS_TO_RECAPITULATE link plus a HUMAN_MODEL_MISMATCH discussion, with supports NO_EVIDENCE because conduction velocity is absent from the reported measures. Tooling note: just clingen-refresh exits non-zero on a drifted checksum but leaves gene_validity.csv on disk, and clingen-rebuild --id then works; the manifest was not repinned. Validation: linkml-validate clean, 48/48 snippets verified, term validation clean, entity refs and duplicate keys clean.

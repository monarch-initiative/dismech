  summary: Review CMTDIG variant-specific mechanisms, cohort phenotypes and model
    evidence
  details: |
    Reviewed the complete CMTDIG entry against the Falcon research report and citation artifact, cached family reports, cohort tables, clinical reviews, ClinGen assertion and available experimental full texts. Excluded infectious/environmental scope and verified no earlier REVIEW event or overlapping open PR before starting.

    Content-completeness assessment:
    1. Phenotypes: repaired gaps with subtype-resolved hearing impairment (8/24), tremor (7/24), scoliosis (5/24), and reported dementia (2/24), counted within the CMTDIG rows of PMID:35044100 Table 2. Added direct clinical sensory/weakness support. The narrative ataxia rate (79%) disagrees with the explicit Table 2 count (17/24); retained this discrepancy without assigning a frequency band. Removed obligate 25–45 m/s classification because reported CMTDIG median MNCVs extend to 49 m/s and N98S patients can have demyelinating-range values with attenuated CMAPs.
    2. Subtypes: adequate after clarifying overlapping NEFL CMT1F/CMT2E/CMTDIG presentations and distinguishing recessive null-allele disease. No new subtype taxonomy invented.
    3. Mechanisms: repaired universal assembly/transport/calibre assertions. I384F retains INA filament formation (PMID:37848414); reduced axonal content does not directly measure failed delivery. Calibre contributes to conduction but is not a demonstrated unique CMTDIG mechanism. Qualified myelin interpretation and modeled variant-specific evidence.
    4. Treatments/trials: added full GeneReviews symptomatic management, orthoses, exercise, orthopedic care, dominant transmission counseling and vincristine precaution. Added preclinical ASO and allele-selective editing, explicitly in N98S CMT2E-derived cells, with no clinical efficacy claim. No CMTDIG clinical trial was established by the research sources. Glycosylation-directed treatment remains exploratory and is discussed without importing unrelated trial drugs.
    5. Genetics: adequate with L312P/I384F/E396K cohort context, N98S family evidence, historical human versus mouse E397K nomenclature, restricted null-allele inference, and parental mosaicism as wider NEFL counseling context. Blood mosaicism is not presented as the obligatory origin of CMTDIG. No supported penetrance or modifier estimate was available.
    6. Diagnostics/biomarkers: corrected threshold rigidity and unproven serial reclassification; qualified posterior calf MRI specificity. Cell-culture NF-L biomarker reduction is not a validated clinical response marker. No CMTDIG population prevalence inferred from NEFL cohort proportions.
    7. References: regenerated caches through fetch-reference only. Upgraded PMID:34485306 and PMID:35044100 for full-text details/tables; consumed full texts of PMID:28501821, PMID:33993654, PMID:40635134, PMID:37848414, PMID:38578900 and the full GeneReviews overview. Retrieved primary PMID:14733962 and PMID:29940160; abstracts used where full text was unavailable or publisher access declined. The GeneReviews purpose-only PubMed abstract is not a subtype phenotype baseline. New evidence titles checked against cache and study type.
    8. Overall consumption: repaired central omissions; scoped broad NEFL muscle presentations, recessive disease, serum NfL biomarker literature, general CMT sequencing yields and unrelated glycosylation trial drugs out of the subtype record. Model gap corrected: N98S has measured reduced caudal NCV, whereas E397K measures distal latency/CMAP rather than formal NCV. Removed an unsupported FAILS_TO_RECAPITULATE relation based on an unmeasured endpoint. No new dataset accession identified in the consumed cache text.

    Removed curation diary and stale scope notes from the disease entry. Full current-entry validation passed with 74 snippets and 83 titles before final QA. Additional validation results are recorded in the PR.

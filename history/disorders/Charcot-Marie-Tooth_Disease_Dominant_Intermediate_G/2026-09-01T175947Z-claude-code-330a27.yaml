  summary: 'Edit: CMTDIG - module conformance, onion bulb histology, three phenotypes'
  details: |
    Follow-up to the create commit, acting on the automated second-opinion dossier posted on issue #10407. Added conforms_to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination on the length-dependent degeneration node, matching Intermediate Charcot-Marie-Tooth Disease and Charcot-Marie-Tooth Disease Type 2. Added the Jordanova nerve-biopsy finding (PMID:12566280) of onion bulbs and axonal regeneration clusters in a de novo NEFL patient, curated as a phenotype and as a downstream consequence of the axonal node rather than as evidence of primary demyelination, since NEFL is not expressed in Schwann cells; this is the histological form of the entry's calibre argument. Added claw hand deformity and areflexia, both quoted in existing snippets but previously uncurated. No frequency bands were set from single biopsies or single patients.

  summary: 'Create: Mesomelic Dysplasia, Savarirayan Type'
  details: |
    De-novo curation of row NOS 15-0150 of ISDS Nosology 2023 group 15. The entry is careful about the gene attribution: ID4 is named in the dyadic disorder name but no ID4 coding variant has been reported, ID4 lies outside the smallest deleted interval, and the patient with the largest deletion, which did remove ID4, had no skeletal phenotype. The pathograph therefore models a structural rearrangement at 6p22.3 leading to enhancer adoption by ID4 in the limb bud, with both supporting evidence items marked PARTIAL because both sources state the model as a prediction from breakpoint position rather than a measured expression change. The 2026 inversion case is included as copy-number-neutral evidence against a dosage mechanism. A KNOWLEDGE_GAP discussion records that the ID4 misexpression has never been measured, and contrasts this with the HOXD locus where the equivalent hypothesis was settled by an engineered mouse inversion plus in-cis null rescue. All 15 evidence snippets verified; schema, term and reference validation pass.

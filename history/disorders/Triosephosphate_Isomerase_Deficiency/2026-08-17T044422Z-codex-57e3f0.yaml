  summary: 'Review: Triosephosphate Isomerase Deficiency'
  details: |
    Deep evidence, identity, ontology, pathograph, model, diagnosis, treatment, and dataset review. Confirmed a single autosomal-recessive TPI1 allelic-spectrum identity at MONDO:0014221 with OMIM:615512 and ORPHA:868. Corrected the prior established DHAP-methylglyoxal neurotoxicity and erythrocyte ATP-failure claims: patient erythrocyte modeling shows increased glycolytic flux with compensated energy state, methylglyoxal/glycation evidence is blood-based and associative, and a stable low-activity mouse shows catalytic reduction alone is insufficient. Rebuilt the hemolysis chain with full module conformance and explicit unknown intermediates, separated the candidate neurotoxic branch, wired TPI1 and all eleven phenotypes, and added enzyme and molecular diagnosis including the transfusion limitation. Added positive and negative mouse models, a Drosophila model, a patient-fibroblast model, separate KNOWLEDGE_GAP and HUMAN_MODEL_MISMATCH discussions, and supportive-care boundaries without promoting experimental therapies. Dataset discovery found only unrelated GENE_ONLY GEO candidates, so datasets remains explicitly empty; no disease-specific GeneReviews chapter was found. Eleven new PMID caches were generated only with just fetch-reference. Validation at review time: schema, terms, references, 82 of 82 strict exact snippets, graph construction, 11 of 11 phenotype connectivity, 1 of 1 gene wiring, duplicate keys, cache frontmatter, six targeted model and module tests, and git diff check all passed.

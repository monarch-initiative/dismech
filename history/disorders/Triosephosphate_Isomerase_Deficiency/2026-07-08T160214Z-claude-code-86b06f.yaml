  details: |
    New standalone entry for TPI1-related triosephosphate isomerase deficiency [WP-007 IEMbase metabolic sweep, row 3.3.09.01], curated by the automated high_effort curation scanner. NEC preflight against the local MONDO snapshot confirmed MONDO:0014221, OMIM:615512, Orphanet:868, gene TPI1/HGNC:12009 all match; an initial mis-recall of the MONDO id was caught and corrected. Modeled the systemic TPI1 dimer-destabilization root lesion feeding two arms: the disease-specific DHAP-accumulation to methylglyoxal/AGE neurotoxic arm driving progressive neurodegeneration, and the erythrocyte glycolytic-failure arm conforming to the hemolytic_anemia_erythrocyte_destruction module. Four phenotypes, two biochemical markers, AR inheritance, ultra-rare prevalence, supportive-care treatment. Six primary references; all 22 evidence snippets verified as exact substrings of freshly fetched PubMed abstracts. Schema, term, and reference validation all pass.

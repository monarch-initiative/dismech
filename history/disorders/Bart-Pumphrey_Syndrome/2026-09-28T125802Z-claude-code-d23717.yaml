  summary: 'Create: Bart-Pumphrey Syndrome'
  details: |
    New entry for Bart-Pumphrey syndrome (MONDO:0007866). Deep research: the first Perplexity run failed (server disconnected without sending a response); a rerun with a streaming request succeeded and its report is committed as research/Bart-Pumphrey_Syndrome-deep-research-perplexity.md with its citations sidecar. The entry was first curated from PubMed directly and then cross-checked against that report, which was used as leads only. Its 8 extracted references all resolved, but its ontology identifiers were largely wrong (NCIT:C1222 given as Keratolytic Agent is Miglustat, NCIT:C28125 does not exist, and many HP/CL/UBERON/NCIT CURIEs name unrelated terms), so none of its CURIEs were used. From its citations, PMID:31334055 (hereditary PPK review, PMC full text) was fetched and added as the source for a histopathology finding and a class-level keratolytic/systemic retinoid treatment item (directness INDIRECT). Its BPS-specific retinoid statement comes from the JAMA Dermatology image report (PMID:32745176), which has no abstract, so it is not quoted. preflight-dr could not run because the local MONDO build is absent. Sources: the N54K gene-identification paper (PMID:15482471), clinically diagnosed family reports (PMID:138007, PMID:20418990, PMID:22421650), the G59S Vohwinkel report noting the BPS allele (PMID:30565282), functional studies of N54K in HeLa cells, rat epidermal keratinocytes and cochlear HEI-OC1 cells (PMID:28428247, PMID:32300592, full text), and two connexin reviews that disagree on gain versus transdominant loss of function (PMID:19939300, PMID:22796187), recorded as an open CONTROVERSY discussion. The pathograph runs GJB2 variant -> Cx26 intracellular retention -> transdominant inhibition of Cx30/Cx43 -> keratinocyte coupling deficit -> PPK and knuckle pads, with a hypothetical cochlear branch to hearing loss and an unknown-intermediates edge to leukonychia; all four phenotypes are connected. The cochlear node does not conform to sensorineural_hair_cell_loss because that module asserts oxidative stress and hair-cell death with no BPS evidence. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Four key papers (PMID:6015974, PMID:15952212, PMID:32745176, PMID:36331160) have no abstract or open full text and are named in notes only. Validated with just validate, count-verified-snippets (44/44), validate-terms, check-causal-targets, check-entity-refs, list-disconnected-phenotypes and validate-disorders.

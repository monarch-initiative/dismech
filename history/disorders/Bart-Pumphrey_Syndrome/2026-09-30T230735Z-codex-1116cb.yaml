  summary: Review Bart-Pumphrey mechanisms and clinical evidence using recovered primary
    full text
  details: |
    Reviewed the complete Bart-Pumphrey entry and prior CREATE/EDIT history, the Perplexity scientific report and all citation-sidecar sources relevant to its clinical and mechanistic claims. Identity preflight passed for MONDO:0007866/GJB2. GeneReviews and StatPearls returned NO_CHAPTER in the 2026-09-10 index. Read the complete scientific text of the 2017 N54K functional study, 2020 HEI-OC1 study and 2010 clinical family report, plus the relevant sections of the connexin and hereditary-PPK reviews. Automatically fetched the 2024 connexin review as full text and recovered the 2003 SciELO father-son study and 2012 family report through publisher URL caches, because the PMID routes did not provide those full texts. No reference-cache files were hand-created or edited.

    Mechanistic corrections: N54K localization, channel function and effects on coexpressed connexins are distinct readouts. Add an atomic mutant-channel dysfunction node and retain trafficking separately. Wild-type Cx26 coexpression produced some HeLa plaques without restoring dye transfer. Cx30 recruited N54K into plaques in HEI-OC1 cells, but the functional FRAP experiments tested Cx26 and S183F, not N54K/Cx30; do not call this functional rescue. In rat keratinocytes, N54K reduced dye transfer modestly without reducing Cx43 plaque number. Patient lesional Cx26 staining was weak/absent with preserved adnexal and punctate membrane staining; move that observation to histopathology rather than treat it as proof of retention. The 2017 paper explicitly calls interaction with a non-traditional partner a gain-of-function property: this can coexist with transdominant loss of coupling. Replace the artificial gain-versus-loss controversy with the actual cell-context-to-patient knowledge gap. G59S function remains unresolved; remove the all-allele DOMINANT_NEGATIVE assignment. Potassium recycling, nutrient passage and signaling are candidate cochlear functions, not proven BPS-specific mechanisms; do not add oxidative injury, hair-cell death or KID-like leaky-hemichannel cytotoxicity.

    Clinical/full-text additions: the 2012 family contains three examined relatives and three described by relatives; the ten-year-old girl had hearing loss with normal skin examination. A 47-year-old woman used hearing aids. The 20-year-old proband developed cryotherapy scars after knuckle pads were mistaken for warts; this is not evidence for BPS cryotherapy efficacy. Add bounded congenital and severe sensorineural hearing observations, secondary historical mixed hearing loss, and keratosis pilaris in two members of the 2010 clinically diagnosed family. Do not generalize its male-only hearing loss to sex-specific inheritance. PPK worsened with age in 2010 but did not in the 2003 father-son report. Replace the incorrect inference that the entire 1994 family lacked leukonychia with a directly observed absence in the 2003 family. Add primary palm/sole and knuckle histology, keeping additional acanthosis/papillomatosis/hypergranulosis as review-level observations. Clinical families often lacked genotyping. Qualitative RARE is supported directly; fewer than ten reports in 2012 does not determine patient counts or a population rate.

    Management/genetics/diagnostics: separate mechanical keratin reduction, topical keratolytics and systemic retinoids; retain the class-level PPK basis and no BPS response estimate. Acitretin is a class example, not a documented BPS outcome. Add observed hearing-aid use, genetic counseling and a 2025 cochlear-implant cohort that includes one BPS participant (PMID:40010783). The abstract does not report that person's genotype, complications or outcome, so pooled prognostic associations are not BPS effects. Add structured allelic and isolated-knuckle-pad differentials. GJB2 results require phenotype correlation; arbitrary variants do not confirm BPS. N54K/G59S are representative alleles, not all dominant GJB2 skin-hearing variants. The G59R 2005 case concerns overlapping PPK-deafness without leukonychia and is not silently renamed BPS. No numerical penetrance or modifier-gene claim is supported. Add three linked cell models with explicit species/cell-source and overexpression/maturation limitations; no BPS whole-animal phenotype is inferred.

    Source limits and live search: PMID:15482471 and the early reviews remain abstract-only where indicated after refetch. PMID:8151643 has an abstract and public PMC PDF pointer, but full-paper text retrieval failed; do not claim to have read its entire paper. The 2020 JAMA report was readable through the web publisher text, but PMID, DOI, HTML URL and PDF cache fetches did not recover usable cache text; its general retinoid/implant recommendations are not substituted for patient outcomes. The 1967 original, 2005 G59S report, 1996 case and 2023 cholesteatoma letter lacked usable cache text. Additional 2023 PPK/pseudoainhum report had discordant GJB4/RHBDF2 VUS and no GJB2 diagnosis, so do not import its amputations, HIV or VUS as BPS features. Isolated leukonychia and unrelated knuckle conditions likewise do not establish BPS manifestations. No causal cholesteatoma, breast-cyst, mortality, cognition or cancer-risk claim is added from weak or inaccessible reports. ClinicalTrials.gov API search on 2026-09-30 found no BPS-specific registered study. SKY-GJB2 NCT07627971 requires biallelic disease; the GJB2 natural-history protocol NCT05402813 concerns nonsyndromic disease. Neither is entered as a BPS treatment trial; other GJB2 search hits were withdrawn, unrelated or nonspecific cohorts.

    Eight-dimension research cross-check: phenotypes adequate after onset/severity/skin-variability additions; subtypes N/A, with overlapping allelic diagnoses modeled as differentials; mechanisms adequate after six-node separation and qualified causal links; treatments/trials adequate after six management entries and scoped live registry review, with speech/language support described by the inaccessible-to-cache JAMA text remaining a non-blocking general-care omission; genetics adequate with representative alleles and explicit functional/penetrance limits; diagnosis/histopathology adequate after primary biopsy and subtle-feature additions; references adequate with recovered primary full text, clinical newer cohort and exact-quote verification; overall consumption adequate, with speculative or non-BPS extrapolations excluded. No blocking research-backed omission remains.

    Validation before publication: schema and live term checks pass. Eighty evidence quotations and titles were checked; exact quotations, content/history gates and formatting/precommit are rerun after final edits. Append-only review provenance accompanies the disorder change.

  summary: Bind GJB2 molecular function for gene-activity grounding gate
  details: |
    Bound GO:0005243 gap junction channel activity (modifier DECREASED) as molecular_functions on the 'Connexin 26 Intracellular Retention' node, the node carrying GJB2 whose own evidence reports that cells expressing N54K were essentially unable to establish gap junction channels capable of dye transfer (PMID:28428247). Hemichannel activity was not bound because the same study found highly variable, inconclusive hemichannel dye uptake for N54K. The upstream variant node was left without a molecular-function term because its evidence describes segregation and domain location, not activity. GO:0005243 was already in cache/go/terms.csv and the molecular-function enum cache. check_gene_activity_grounding.py against origin/main now prints OK; validate, validate-terms, count-verified-snippets (44/44), check-causal-targets, check-entity-refs and validate-disorders pass.

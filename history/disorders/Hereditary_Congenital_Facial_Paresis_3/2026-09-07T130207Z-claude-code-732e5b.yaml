  details: |
    Round 2 raised one blocking item and three carried-over suggestions.

    Blocking: the round-1 history record's details field was the literal string PLACEHOLDER. just new-history writes that when --details is omitted, and it was never filled in. It validates, because details is required to be a string and PLACEHOLDER is one, so no gate catches it. The reviewer's argument for fixing it now rather than tolerating it is the right one: history records are append-only, so this is the last point at which that record can carry anything, and 4 of the other 5 PLACEHOLDER records in the repository are already merged and cannot be repaired.

    The record now carries the full account of round 1: the two rebindings and the reasoning error behind them, the two evidence_source regradings and why check-snippet-grading cannot see either, the decision to record the unconnected ear and speech findings as a knowledge gap rather than draw two unevidenced edges, and the unprompted correction to the Hypernasal Speech description. That prose already existed in the commit message for c4958f9; moving it into the record is where it belongs.

    Suggestion taken: cache churn. references_cache/PMID_11278854.md and PMID_15872003.md were regenerated with just fetch-reference. Both now carry the full_text_attempted line that every validation run was adding and discarding, so the churn is closed rather than re-appearing on each contributor's checkout.

    Suggestion declined with the reason recorded: no prevalence block. No source cached for this entry carries a population rate or a count of published cases. The nearest candidate is the 1-of-95 yield from the Moebius and HCFP screen in PMID:26007620, which is a diagnostic yield in a selected clinical series and measures something else. Orphanet would supply a real prevalence class, but no ORPHA record for this disorder is in references_cache, and building one requires refreshing and repinning the Orphadata bulk manifest, which does not belong in a curation PR. The reasoning is now in notes so the question is not re-litigated.

    Suggestions left alone, as the review allowed: the hearing-loss frequency band stays FREQUENT, which the reviewer agreed is defensible; pharyngeal_arch_patterning_serial_homology is not forced, since that module's nodes are skeletal rather than neural; and the round-1 record's 44/44 snippet figure is left as written, because history records are append-only and rewriting a number to match a later tree would be the wrong repair.

    Validation on this tree: just validate clean, 47/47 snippets verified; entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms all OK; snippet-length, title-snippets, snippet-grading, folded-hyphens report nothing new against origin/main; validate-history clean on both records.

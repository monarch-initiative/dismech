  summary: 'Review round 1: bind rhombomere 4 and branchiomotor neuron, fix two evidence
    gradings, record the unconnected ear and speech findings'
  details: |
    Review round 1 on PR #11113. Four blocking findings, all fixed in one push.

    Findings 1 and 2 are the same mistake made twice, and worth naming
    precisely because the reasoning looked careful at the time. The
    deep-research report offered UBERON:0005396 for rhombomere 4 and
    CL:0011001 for branchiomotor neurons. Both are wrong: a carotid artery
    segment and a spinal cord motor neuron. Rejecting them was correct. What
    was not correct was the next step, concluding from those two bad
    suggestions that no better term existed, and recording that conclusion in
    notes as a fact about the ontology. Both terms exist. UBERON:0005511 is
    rhombomere 4 and CL:0005023 is branchiomotor neuron. Both are now bound in
    place of the hindbrain and motor neuron fallbacks, and both were verified
    with just validate-terms before being written. The notes now record the
    error rather than the original claim, and state the general rule it
    illustrates: a bad suggestion from a deep-research report is evidence
    about the report, not about the ontology, and the ontology still has to be
    searched independently before concluding a term is missing. The r4 node's
    whole argument is segment specificity, so the broader hindbrain binding
    was throwing away the node's point.

    Finding 3, two evidence_source values contradicting their own snippets.
    PMID:22770981 quoted "Molecular modeling and an in vitro DNA-protein
    binding assay predict..." while graded HUMAN_CLINICAL; regraded IN_VITRO
    for the binding assay, with the explanation stating why the computational
    half of the same sentence is not split into a separate item. PMID:11278854
    quoted a transgenic reporter result ending "in rhombomere 4 in vivo" while
    graded IN_VITRO; regraded MODEL_ORGANISM. As the review noted,
    check-snippet-grading cannot catch either: it keys on a sentence appearing
    more than once with different grades, and each of these appears once.

    Finding 4, the description claimed an arm the pathograph does not carry.
    It said one lesion "explains the facial, auditory and ear findings
    together" while Abnormal Pinna Morphology and Hypernasal Speech were the
    target of no downstream edge anywhere in the file. Of the two options
    offered, drawing the edges or recording the gap, this takes the second.
    Drawing two plausible-looking arrows would have made the graph agree with
    the prose without either being evidenced. The description no longer claims
    the ear finding and says explicitly that it is excluded from the account.
    A new KNOWLEDGE_GAP discussion, hcfp3_unconnected_ear_and_speech_findings,
    attaches to both phenotypes and states what is missing in each case: for
    the ear, r4-derived neural crest does populate the second pharyngeal arch,
    but no source cited here makes that link for HCFP3; for the speech
    finding, hypernasality is ordinarily velopharyngeal and the soft palate is
    not an r4 derivative, so the obvious edge from facial weakness is probably
    the wrong one.

    That last point also corrected an unprompted claim inside the entry. The
    Hypernasal Speech description asserted the finding results "from weakness
    of the facial and perioral musculature". The cited snippet does not say
    that, and perioral weakness is not the usual mechanism of hypernasality.
    The description now records the finding without the mechanism and says why
    it is left open. No gate would have flagged this; it was found while
    fixing something else.

    Validation on this tree: just validate clean with 47/47 snippets verified,
    up from 46. Terms, entity-refs, causal-targets, duplicate-keys,
    enum-values, qualifier-terms, snippet-length, title-snippets,
    snippet-grading and reference-titles all pass. Two new cache row pairs,
    CL:0005023 and UBERON:0005511, from the rebindings.

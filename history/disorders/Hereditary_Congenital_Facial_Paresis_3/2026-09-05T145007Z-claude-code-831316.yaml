  summary: 'Create: Hereditary Congenital Facial Paresis 3 (HCFP3, HOXB1)'
  details: |
    New kb/disorders entry for HCFP3 (MONDO:0013880), claimed via issue #11110. Curated as a rhombomere-4 specification disorder rather than a list of clinical features: HOXB1 loss of function -> failure to maintain r4 identity -> two parallel arms (facial branchiomotor neuron mis-specification and migration failure; loss of r4-derived neural crest glial support of the VIIth nerve) converging on facial motor nerve deficiency, plus a third arm through the r4-derived geniculate and spiral/vestibular ganglia to the hearing loss. Six HPO-bound phenotypes, two mouse models (constitutive Hoxb1 null and the neural-crest-conditional deletion) with per-link fidelity, limitations and readouts, and two KNOWLEDGE_GAP discussions (the 44 percent esodeviation that r4 lineage does not explain; single-patient neck and shoulder-girdle weakness). Named-entity discipline: HCFP1/HCFP2 (dominant, no gene) and Moebius syndrome were kept separate throughout, and the Moebius differential is evidenced from a cohort screen rather than asserted. Validation: schema pass, term validation pass, 44/44 snippets verified against cached references, check-entity-refs / check-causal-targets / check-duplicate-keys / check-qualifier-terms / check-enum-values all clean. The OpenScientist deep-research run for this disease was still queued when the entry was written from primary literature; the report is committed alongside.

  summary: Bind disease_term on the CNTNAP2 differential
  details: |
    Bound MONDO:0012400 (cortical dysplasia-focal epilepsy syndrome, RO:0004003 HGNC:13830 CNTNAP2 confirmed) on the CNTNAP2-related Pitt-Hopkins-like differential. The remaining three are deliberately unbound with the reason recorded on each: the 1p34.3p34.2 contiguous deletion has no MONDO term; craniofacial spliceosomopathies and TGF-beta pathway aortopathies are mechanism- and pathway-defined CATEGORIES, and binding a single member such as Nager acrofacial dysostosis or Loeys-Dietz syndrome 1 would narrow them and misstate the differential. Terms verified with runoak; none obsolete; none an ancestor of this entry's anchor. No prose or evidence content changed.

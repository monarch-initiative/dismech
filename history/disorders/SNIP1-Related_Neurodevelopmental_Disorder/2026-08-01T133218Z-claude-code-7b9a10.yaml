  summary: 'Apply PR #7635 review: fix inverted edge, wrong-concept HPO binding, bundled
    node, missing neuroimaging diagnosis'
  details: |
    Addressed the four blocking items and four of five suggestions from the automated review of PR #7635.

    Blocking item 1 - causally inverted edge. Removed the downstream edge Neonatal Feeding Failure and Aspiration Risk -> Small for Gestational Age. SGA is determined at birth and cannot be caused by a postnatal event; the retained IUGR snippet documents co-occurrence, not causation. SGA is now an unwired phenotype and the reason is recorded in the node notes and in the new top-level unwired-phenotypes paragraph.

    Blocking item 2 - wrong-concept ontology binding. The phenotype named Drug-Resistant Epilepsy was bound to HP:0002353 EEG abnormality, a different concept rather than a broader one. Split into two phenotypes: Drug-Resistant Epilepsy now binds HP:0020174 Refractory drug response (verified with OAK to sit under HP:0000118 via HP:0020169), keeping the pharmacoresistance snippet; a new EEG Abnormality phenotype binds HP:0002353 and keeps the EEG snippet. Added a downstream edge Cortical Network Hyperexcitability -> EEG Abnormality, which is the node that already carried the EEG snippet, rather than hanging it off the seizure node, because the abnormality is a property of the network and is present interictally.

    Blocking item 3 - missing neuroimaging diagnosis entry. Added a Neuroimaging at diagnosis entry bound to NCIT:C173635 Neuroimaging (verified reachable from NCIT:C25218), citing the already-cached at-diagnosis recommendation and the 18/18 yield snippet. Used the generic Neuroimaging term rather than an MRI-specific one because the recommendation sentence does not name a modality. Founder-cohort provenance of the 18/18 denominator is stated in the entry notes.

    Blocking item 4 - bundled pathophysiology node. Split Status Epilepticus and Hypoxic-Ischaemic Secondary Injury into Status Epilepticus (ORGANISM) -> Hypoxic-Ischaemic Secondary Brain Injury (TISSUE). Developmental Regression is wired from Status Epilepticus rather than from the injury node, because the source attributes the regression directly to the status epilepticus event without asserting an intervening hypoxic mechanism; Spastic Tetraplegia and Severe Global Developmental Impairment hang off the injury node, which is where the authors place the hypoxic attribution. Updated the upstream edge from Infantile-Onset Drug-Resistant Epilepsy and both discussion attaches_to references.

    Suggestions applied. Removed the deprecated updated_date. Added a variants[] entry for the founder allele with type missense_variant and clinical_significance PATHOGENIC (the reviewer named a variant_types slot, which does not exist in the schema; Variant.type is the slot that does). Split Cloverleaf Skull (HP:0002676) out of Craniosynostosis so the 5/35 count bands the subgroup it actually counts, leaving Craniosynostosis unbanded.

    Suggestion declined with reason. Genetic counselling (NCIT:C15240) is still not curated. All thirteen cached references for this entry were grepped case-insensitively for the string counsel and none contains it, so no quotable snippet exists from any cited source; the absence was verified rather than assumed and is recorded in the entry notes. The surveillance-under-treatments placement is retained and the rationale is now stated in notes.

    Validation. just validate clean (schema, terms, references 176/176). scripts/check_snippets_verbatim.py 176 verified 0 failed. check_folded_hyphens.py clean. Compliance 83.6%. Pathograph recount 25 nodes / 71 edges / 15 unwired phenotypes; the stale counts in notes were corrected. references_cache churn from #7507 reverted; no new references were fetched. cache CSV changes are purely additive (HP:0020174, NCIT:C173635).

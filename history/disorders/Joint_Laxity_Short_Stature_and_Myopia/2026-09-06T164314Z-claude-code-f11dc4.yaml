  summary: 'Create: Joint Laxity, Short Stature, and Myopia / GZF1-related phenotype
    (MONDO:0060556)'
  details: |
    De novo curation of JLSM / GZF1-related phenotype.

    Lump/split: DISEASE, filed under the Larsen Syndrome parent. It was described from within the Larsen literature and is still sometimes called autosomal recessive Larsen syndrome, but the 2026 series (PMID:42170786) argues explicitly that it is distinguishable, on the basis of severe ocular disease that FLNB-related Larsen syndrome does not have. Precedent for a separate entry already exists in kb as Larsen-like_Syndrome_B3GAT3_Type. GZF1 appears nowhere in kb before this entry.

    The mechanism is the part that needed the most care. The GZF1 -> P3H2 -> collagen 3-hydroxylation -> high myopia chain is attractive and is NOT established. It is assembled from two separate findings: P3H2 appears among enriched matrix genes in transcriptional profiling of GZF1 patient fibroblasts (which the founding authors describe as hinting at a potential mechanism), and biallelic P3H2 loss independently causes non-syndromic high myopia. Both halves are solid; the join is untested. No study has measured P3H2 protein or collagen 3-hydroxylation in GZF1-deficient tissue, and fibroblasts are not sclera.

    The entry therefore: marks the joining edge INDIRECT_UNKNOWN_INTERMEDIATES; grades every P3H2-derived evidence item directness: INDIRECT with explanations stating the citation is about a different disease; and records a KNOWLEDGE_GAP naming what would close the gap.

    preflight-dr returned WARN on 'rival gene P3H2 mentioned 31 times'. That warning is apt rather than a false positive: P3H2 genuinely is a second disease entity in the report. It was addressed by curating P3H2 only as a differential diagnosis and as explicitly indirect mechanistic support, never as evidence about GZF1 patients. OMIM 617662 matches MONDO both ways.

    Two things flagged for reviewers rather than hidden. The hearing-loss binding is Sensorineural hearing impairment while the quoted sentence says only 'progressive hearing loss'; the sensorineural characterisation comes from the wider report. And congenital glaucoma is bound to the general Glaucoma term because no congenital glaucoma term was confirmed in the validated cache, with the qualifier carried in the description.

    A second KNOWLEDGE_GAP records that the skeletal arm has no candidate effector at all, and that the markedly milder skeletal involvement in one of two founding families with homozygous truncating alleles is unexplained.

    Validation: just validate passes schema plus 31/31 snippets verified on first pass; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all pass.

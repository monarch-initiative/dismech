  summary: 'Review round 1: record ClinGen SCN9A Refuted and HCN1 Definitive'
  details: |
    Addressed review on PR 15884. Added the ClinGen Epilepsy GCEP Refuted classification for SCN9A and autosomal dominant epilepsy (CGGV assertion 72a91ef6) as a REFUTE evidence item on the SCN9A genetic record, plus a REFUTE item from Fasham et al. 2020 (PMID:33216760), which found the founding p.N641Y allele at high frequency in seizure-free Amish carriers. Removed SCN9A from the voltage-gated sodium channel dysfunction node and moved the homozygous knock-in mouse evidence to the SCN9A genetic record as INDIRECT; the subtype row (MONDO:0013470) and RISK_FACTOR typing are kept, with the contested status stated in the subtype description, association and review_notes. Recorded ClinGen's Definitive HCN1-GEFS+ classification (CGGV assertion 0932fa23, MONDO:0018214) in gene_disease_validity on the HCN1 record. Validated with just validate, count-verified-snippets (66/66), check-gene-validity, check-snippet-grading, check-causal-targets and check-entity-refs.

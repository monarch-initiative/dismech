  summary: Manual expert claim-evidence review of GEFS+
  details: |
    Manual expert correctness review focused on claim-evidence matching (no deterministic validators run). All ~32 evidence snippets verified as exact substrings of their caches; AD-spectrum framing with incomplete penetrance and the SCN1A/SCN1B/GABRG2/GABRD/STX1B/SCN9A gene set confirmed correct; severe-end/Dravet kept correctly distinct from the milder core. One fix applied: the genetic STX1B entry (relationship_type CAUSATIVE) previously cited only a generic 'GEFS+ exhibits significant genetic heterogeneity' snippet (PARTIAL) that never named STX1B; added the direct STX1B discovery paper (PMID:25362483, SUPPORT) whose snippet explicitly reports STX1B mutations causing fever-associated epilepsy, directly grounding the CAUSATIVE assignment. Noted for human follow-up: the SCN9A and GABRD RISK_FACTOR genetic entries reuse the same generic heterogeneity snippet and would benefit from gene-specific primary citations.

  summary: 'CI gate fix: ground HCN1 on the Ih current node'
  details: |
    PR Shepherd fix for the failing check-gene-activity-grounding gate. HCN1 lands on the 'Altered HCN1 Ih current' node, which named biological processes but no molecular function. Bound GO:0022843 voltage-gated monoatomic cation channel activity (label read from OLS) with modifier ABNORMAL, matching the node's existing ABNORMAL process modifiers and its PMID:30351409 evidence that HCN1 epilepsy variants range from complete loss of function to shifts in activation kinetics or voltage dependence. GO's HCN-specific child terms were not used because the node does not distinguish cyclic-nucleotide gating from voltage gating. Validated with just validate, check-gene-activity-grounding, check-logical-rules and the term cache checks.

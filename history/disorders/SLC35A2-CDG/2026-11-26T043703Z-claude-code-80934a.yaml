  summary: 'Gene-family review: SLC35A2; type record and ground the transport node'
  details: |
    The SLC35A2 record was untyped and no pathophysiology node named the gene: the primary-lesion node Impaired Golgi UDP-galactose Transport bound only the transport process. The node now carries SLC35A2 and binds UDP-galactose transmembrane transporter activity (GO:0005459) as decreased, supported by its existing evidence that each patient variant reduced UDP-galactose transport (PMID:23561849) and that fibroblast transport activity tracks the wild-type to mutant allele ratio (PMID:30817854). The record is now CAUSATIVE: ClinGen classifies SLC35A2 Definitive (X-linked), filed under X-linked complex neurodevelopmental disorder (MONDO:0100148), a broader term than this entry's disease, so the tier is noted rather than copied. Variant origin stays DE_NOVO, with the brain-restricted MOGHE arm carried by the entry's somatic-mosaicism inheritance block.

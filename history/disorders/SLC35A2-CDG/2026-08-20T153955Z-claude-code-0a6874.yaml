  summary: Split germline vs somatic-mosaic MOGHE subtypes; wire to CDG module
  details: |
    Two diseases share this gene and little else: germline SLC35A2-CDG is a multisystem X-linked disorder found by serum transferrin screening, while brain-restricted somatic mosaicism causes MOGHE, where blood is wild type, transferrin screening is normal, and diagnosis requires sequencing resected epileptogenic tissue. The entry modeled both in one undifferentiated phenotype list.

    Added has_subtypes Germline and Somatic MOGHE, each with its own evidence from PMID:41373710 and PMID:42542984. Four phenotypes that depend on body-wide transporter deficiency - type II transferrin profile, skeletal abnormalities, dysmorphic features, failure to thrive - are tagged to Germline. Shared phenotypes (epilepsy, spasms, developmental delay) are deliberately left untagged because both arms produce them.

    Strengthened the existing Brain Somatic Mosaicism and MOGHE node with the 2026 MOGHE review's histopathology and its identification of infantile epileptic spasms syndrome as the dominant presentation.

    Added conforms_to on two nodes to congenital_disorder_of_glycosylation. The terminal Neurodevelopmental Dysfunction node was deliberately left unconformed: the module's consequence node is multisystem glycoprotein dysfunction, and SLC35A2 disease is brain-predominant.

    Datasets: geo:GSE318030 and geo:GSE284073, both MOGHE single-nucleus/multiomic series, verified by just verify-datasets. GSE318030 lists no linked PMID in GEO, so its publication was matched by exact title agreement with PMID:42168328 and the notes say so.

    KNOWLEDGE_GAP records the 2026 preprint (PMID:41867720) proposing that the lesion is specifically truncated O-GalNAc glycosylation rather than generalized hypogalactosylation. That would be a substantial reframing and is recorded as an open question, not curated as mechanism, because it is an unreplicated preprint.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 37/37.

  summary: Correct de novo rate and epilepsy-surgery outcome to match cited papers
  details: |
    Issue 16590 (clinical review by matentzn) found two claims whose numbers were lifted from the cited papers with their scope dropped. (1) de_novo_rate was 87, which in Ng et al. 2019 (PMID:30817854) is the share of variants that were novel rather than recurrent. It now reads 28/30 trio-confirmed de novo with 2 strongly suggestive, in one ascertained cohort of 30, and a new evidence item quotes the sentence giving that count from the cached PMC full text. (2) The Epilepsy surgery treatment said resection achieves seizure freedom in a majority of drug-resistant focal epilepsy patients. Barba et al. 2023 (PMID:36307217) reports 63.8% Engel I and 55.3% Engel IA across 47 patients, with complete seizure freedom in 61.5% of the EE group and 37.5% of the DR-FE group. The description now gives the cohort, endpoints and follow-up, and the methods-sentence snippet was replaced by the results sentence. The PMID:36307217 cache was upgraded from abstract to full text with fetch-reference --force because the subgroup figure is only in the full text. Validated with just validate-disorders (all passed) and count-verified-snippets (39/39).

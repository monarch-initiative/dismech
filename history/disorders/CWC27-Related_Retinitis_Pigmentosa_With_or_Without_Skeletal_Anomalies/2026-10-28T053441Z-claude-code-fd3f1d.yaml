  summary: 'Create: CWC27-Related Retinitis Pigmentosa With or Without Skeletal Anomalies'
  details: |
    New entry for MONDO:0009598 (metaphyseal chondrodysplasia-retinitis pigmentosa syndrome; RPSKA) from the stub queue; the stub is deleted in the same change. Sources: Xu et al. 2017 (PMID:28285769, full text; seven families, Cwc27 tm1b knockout and K338fs hypomorphic mice), later case reports (PMID:31481716, 36718996, 38134094, 38956876), the Cwc27 K338fs retinal splicing study (PMID:34726245) and AAV rescue (PMID:37479075), the CWC27/CWC22 heterodimer structure (PMID:32329775), the Cwc27 cyclophilin-domain structure (PMID:25478830) and the ClinGen Definitive AR assertion (CGGV:assertion_95089ec9...). The variant node conforms to spliceosome_component_dysfunction#Germline Spliceosome Component Variant and carries GO:0005515 protein binding for the shown CWC22 interaction; peptidyl-prolyl isomerase activity was deliberately not bound because the human domain lacks the catalytic residue. The retinal mis-splicing node (mouse retina RNA-seq, human RPE-1 knock-down) and the photoreceptor degeneration node (patient OCT, mouse histology) conform to the module's mis-splicing and splicing-sensitive cell-failure nodes. The developmental node rests on knockout mouse embryos only and has no mis-splicing intermediate. No deep-research report was run; evidence was curated directly from fetched PubMed and ClinGen records. No GeneReviews chapter exists per the offline Bookshelf index. Validated with just validate, validate-terms, count-verified-snippets (55/55) and the KB gates.

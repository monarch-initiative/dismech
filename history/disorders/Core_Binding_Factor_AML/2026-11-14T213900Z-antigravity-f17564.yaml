  summary: 'Address PR #17564 review feedback on KIT node split, CD34+ stem/progenitor cell of origin, Hepatomegaly frequency, prevalence scoping, and NRAS/KRAS/FLT3 co-mutations'
  details: |
    Split Cooperating KIT Receptor Tyrosine Kinase Activation into its own pathophysiology node while keeping Self-Renewal Maintenance for fusion-driven CD34+ stem/progenitor expansion. Replaced the unsourced CL:0000049 binding on CBF Transcription Factor Complex Disruption with CL:0000037 (hematopoietic stem cell, preferred_term CD34+ hematopoietic stem/progenitor cell) backed by DOI:10.3390/cells13010078. Restored OCCASIONAL frequency on Hepatomegaly and routed it via Extramedullary Leukemic Infiltration, wired Anemia to Fatigue via sequelae, scoped the ORPHA:102724 annual incidence record to the t(8;21) subtype in Europe while moving the 12-15% AML share to description/notes, added COOPERATING somatic entries for NRAS, FLT3, and KRAS from DOI:10.4274/tjh.galenos.2022.2021.0641, and tagged review-synthesis and background quotes.

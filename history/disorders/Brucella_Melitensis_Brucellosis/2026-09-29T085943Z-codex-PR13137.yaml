  summary: 'Edit: address Brucella melitensis brucellosis PR review'
  details: |
    Addressed the PR review by expanding the B. melitensis pathograph from the BCV/rBCV core to Omp25-dependent TNF-alpha suppression, Th1/IL-12 containment failure, VirB-dependent autophagic BCV egress, hematogenous dissemination, and focal osteoarticular, valvular, and genitourinary seeding. Added osteoarticular, endocarditis, and epididymo-orchitis phenotypes; host IL4, IL18, TGFB1, TNF, and TLR4 susceptibility/modifier genetics; species-caveated prevalence records; a livestock/raw-food environmental risk factor wired to zoonotic acquisition; Rose Bengal/ELISA/qPCR diagnosis; and an IL-12p40-deficient chronic splenic reservoir mouse model. Removed two over-broad GO process bindings and changed fever from FREQUENT to VERY_FREQUENT based on the 83% Houston case-series estimate.

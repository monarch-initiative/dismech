  summary: 'Create: Immunodeficiency 102 (SASH3 deficiency)'
  details: |
    De novo curation of MONDO:0024781 as a standalone Disease entry. entry_type DISEASE: MONDO records no descendants and one causal gene (SASH3, hgnc:15975), the label and gene appear nowhere else in kb/, and the 2022 IUIS classification (PMID:35748970) lists SASH3 deficiency as its own entity in Table 1 (immunodeficiencies affecting cellular and humoral immunity). Named Immunodeficiency_102 following the forty other numbered immunodeficiency entries, with 'SASH3 deficiency' as a synonym, matching the Immunodeficiency_105 precedent. Seven pathophysiology nodes run adaptor loss -> antigen receptor signalling failure -> thymocyte survival failure, peripheral T cell proliferation/apoptosis defect, and germinal centre failure, with separate branches for loss of peripheral tolerance and for NK depletion. One node declares conforms_to germinal_center_reaction#Germinal Center Reaction. 14 phenotypes, 13 causally wired; neutropenia deliberately left unwired with a KNOWLEDGE_GAP discussion because SASH3 is lymphocyte-restricted and neither a neutrophil-intrinsic nor an autoimmune mechanism has been demonstrated. Two Sly1 mouse models linked through modeled_mechanisms with limitations and divergences; the NK link is LOW fidelity with a CAUSE_UNREPRESENTED divergence and a HUMAN_MODEL_MISMATCH discussion, because mouse SLy1 acts in NK cells as a ribosomal stabiliser rather than a signalling scaffold and nobody has tested that in human NK cells. No mouse-derived claim is the sole support for a human phenotype. Four treatments recorded as indications for standard combined-immunodeficiency management, none claiming genotype-specific efficacy; HSCT deliberately omitted because no reported SASH3 patient has been transplanted. No GeneReviews chapter exists, verified offline with just check-genereviews against the committed Bookshelf index. Validation: schema clean, terms clean, 80/80 snippets verified, entity refs and causal targets clean, gene binding confirmed against HGNC as SASH3 and not SASH1. Self-review pass before any external review: removed an unsourced Xq26.1 cytogenetic band written from memory that appears in none of the cited sources; corrected the description's claim that SASH3 is cytosolic, since it is found in both cytoplasm and nucleus and the localization data are mouse, now stated as such; replaced an arithmetic 'fewer than a dozen patients' total with the overlapping per-source counts plus an explicit statement that no source gives a total; corrected the numbered-entry count from forty to the 39 actually present in kb/disorders/; corrected the SLy1 literature start date from 2005 to the 2001 initial characterization with the 2005 first mutant mouse; recorded exactly which papers were searched for transplantation and noted that PMID:33876203 is cached abstract-only so absence there is weaker than in the four full texts; and added the index cohort's 'refractory autoimmune cytopenias' sentence as primary evidence for the immunosuppression treatment, which previously rested only on a splenectomy quote. Snippets after the pass: 82/82 verified.

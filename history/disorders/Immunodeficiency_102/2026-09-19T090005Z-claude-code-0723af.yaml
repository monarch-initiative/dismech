  details: |
    Addresses the CHANGES_REQUESTED review on PR #12284. Blocking item: no deep-research artifact existed for this entry. Generated research/Immunodeficiency_102-deep-research-claude_code.md plus its citations sidecar with the claude_code provider (253s, 4 web searches, 16/16 references verified, 0.0 confabulation rate). just preflight-dr returns WARN only because CD4 is mentioned 17 times against SASH3's 67; CD4 is the lymphopenic cell population here rather than a rival disease gene, and the report's OMIM 301082 matches MONDO's, so disease identity is confirmed. The artifact was generated after the entry was drafted and is a cross-check, not a source: it independently reproduces the same 14 phenotypes with identical HPO ids and the same seven-node causal chain, so it confirmed completeness rather than changing it. Two changes did come out of it: splenectomy promoted from an awkward evidence item inside the immunosuppression treatment to its own Treatment bound to NCIT:C15328 Splenectomy, verified reachable from NCIT:C25218, with therapeutic_modality SURGERY and a target_mechanisms link to the tolerance node describing it as acting on the effector end rather than the cause; and the reviewer's suggestion 2, directness INDIRECT on the two cohort-level PMID:40510848 evidence items, whose quoted sentence describes the immunodeficiency-gene subset of a congenital-neutropenia cohort rather than the SASH3 patient in it. The gene-list snippet on the neutropenia phenotype is direct and stays unmarked. Reviewer suggestion 3, a mucosal-infection phenotype, was searched and declined: no HPO term fits. Recorded the exact queries run in notes per the dismech-terms rule that a negative-existence claim must be re-runnable. Also declined the report's Xq26.1 cytogenetic band and its Orphanet prevalence class as unverifiable in this worktree, both recorded with the reason. Validation after the round: 82/82 snippets verified, schema and terms clean, entity refs, causal targets, enum values, duplicate keys, qualifier terms, folded hyphens and the snippet gates all clean, gene binding still SASH3.

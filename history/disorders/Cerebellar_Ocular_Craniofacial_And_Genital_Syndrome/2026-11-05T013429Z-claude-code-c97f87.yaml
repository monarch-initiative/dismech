  summary: 'Create: Cerebellar_Ocular_Craniofacial_And_Genital_Syndrome'
  details: |
    New entry for COFG syndrome (MONDO:0032774, MAB21L1, OMIM 618479) curated from an OpenScientist deep-research report (the only provider used). Report screening: 11/11 citations resolved, 10/10 quotes valid; preflight-dr returned WARN only because the acronym COFG was counted as a second gene, and the report is about MAB21L1. The report's table listed microphthalmia as a human COFG feature; the defining cohort (PMID:30487245, full text) does not report it, so microphthalmia is used only for the Mab21l1-null mouse and the dominant Arg51 eye disorder is recorded as a differential diagnosis rather than a phenotype. Phenotypes come mainly from the Rad et al. 2019 full text plus the first case report (PMID:27103078). Pathophysiology is rooted at MAB21L1 loss of function with branches to the lens placode (Pitx3/Maf/Sfrp2 and Foxe3 loss, ER stress; PMID:34779479, PMID:12642482), cerebellum, craniofacial (calvarial ossification; PMID:29156428) and genital mesenchyme (PMID:37750449). ClinGen Strong AR assertion recorded from its CGGV record. References found outside the report: PMID:27103078, PMID:12642482, PMID:29156428. Cited by the report but not used: PMID:31593902 (review, adds nothing to the entry), PMID:8582275 (C. elegans), PMID:33973683 (dominant disorder). No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (79/79) and validate-disorders.

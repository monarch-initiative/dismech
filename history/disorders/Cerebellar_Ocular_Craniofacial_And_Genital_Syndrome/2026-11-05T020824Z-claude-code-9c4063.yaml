  summary: Review round 1 on PR 16569
  details: |
    Response to review 5778795938. Replaced the mouse model's genital-link evidence with the PMID:37750449 morphometry sentence (the earlier quote described eye and skull). Added a description to the pons phenotype saying HP:0012110 is read from the source's 'pontine involvement' wording. Added buphthalmos (HP:0000557), dry eye (HP:0001097 Keratoconjunctivitis sicca, whose HPO synonyms include 'Dry eyes'), flat nasal bridge (HP:0005280), mild clitoral hypertrophy (HP:0008665) and hirsutism (HP:0001007), each quoting PMID:30487245. Optic nerve hypoplasia was not added: PMID:30487245 names it only in a Table 1 cell for one patient, with no sentence to quote. Added a CASES_IN_LITERATURE / ULTRA_RARE prevalence record quoting the ClinGen count of 11 individuals from six families, a progression record quoting delayed walking and gait improvement with age, and a notes sentence on the index family's negative findings (no seizures, normal hearing, no skeletal, renal, cardiac, dermal or gastrointestinal anomalies). No source sentence states that the course is non-progressive, so that was not claimed. Validated with validate-disorders (88/88 snippets) and the same gates as the first round.

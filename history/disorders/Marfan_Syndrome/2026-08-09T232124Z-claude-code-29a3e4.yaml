  summary: Add Loeys-Dietz differential diagnosis with MFS2 nosology note
  details: |
    Added a differential_diagnoses block for Loeys-Dietz Syndrome (disease_term MONDO:0018954) -- the entry's first, despite this being the textbook differential pair for heritable thoracic aortic disease.

    Distinguishing features: the LDS craniofacial/vascular triad (hypertelorism, bifid uvula or cleft palate, generalized arterial tortuosity), ectopia lentis as a cardinal revised-Ghent criterion that was absent in the entire original LDS cohort, the more aggressive LDS vascular natural history driving different surgical thresholds, and FBN1 versus TGFBR1/TGFBR2/SMAD3/TGFB2 as the definitive molecular discriminator.

    Five evidence items cite PMID:16928994 (Loeys, NEJM 2006), PMID:15731757 (Loeys, Nat Genet 2005) and PMID:20591885 (revised Ghent nosology; newly fetched via just fetch-reference).

    The notes field records the historical nosology: TGFBR2-related aortopathy was labelled "Marfan syndrome type 2" (MFS2) after the 3p24.2-p25 locus was mapped, and reviews as recent as 2020 still present it as a Marfan subtype. MONDO obsoleted that entity as MONDO:0017308 ("OBSOLETE. Hypothesized form of Marfan; dubious", subset speculative) with no replacement term -- retiring MFS2 as a dubious entity rather than asserting equivalence to Loeys-Dietz syndrome. The note states the obsolete CURIE must not be cited as a term anywhere in the KB.

    Rationale: the schema has no negative-assertion slot, so there is no way to state "MFS2 is not a subtype of Marfan syndrome" directly. differential_diagnoses is the only slot that carries this claim with evidence and a MONDO-bound disease_term; the structural statement is already made by the Heritable_Thoracic_Aortic_Disease grouping, which lists Marfan and Loeys-Dietz as sibling members with a keep-split grouping_rationale.

    Validation: just validate (passed), just validate-terms (passed), just count-verified-snippets over both touched files (217/217 verified, 0 skipped by prefix), and just validate-disorders over both files (schema + terms + references batched, --no-full-text; passed). tests/test_data.py run over the full KB.

  summary: Add the first protective links in this backfill for activity modification
  details: |
    Backfill for issue #8085. These are the first PROTECTS_AGAINST links produced by this backfill, and the direction is the point: both exposures are forms of activity modification, so what they do is prevent rather than cause. The restriction exposure targets the aortic dissection phenotype, since that is the event restriction is meant to avert, and the moderate aerobic exposure targets the aortic root aneurysm phenotype, since dilation rate is what it was measured against. Both use INDIRECT_KNOWN_INTERMEDIATES, the intervening step being the haemodynamic wall stress this entry models as impaired mechanotransduction. The two are deliberately held simultaneously, as this entry's own notes explain, because what is restricted is exercise intensity and type rather than physical activity itself. The aerobic link is the better evidenced of the two and is the only one with a supporting grade: patients instructed to walk ten thousand steps a day had a significantly lower aortic root Z score than controls, which measures the outcome the node holds. The restriction link is graded PARTIAL throughout, because its guideline item states the intention of the restriction rather than a measured reduction, which is what guidelines encode. Both entries' pre-existing evidence_source tags were already correct and were not changed. The restriction link's description now records an export caveat: because the exposure is named for the restriction while the KGX exporter maps it to an exposure-to-strenuous-exercise term, a protective predicate inverts on export and reads as strenuous exercise being protective. The problem predates this link but the structured predicate is now the authoritative path; tracked as issue #2656. Validated with linkml-validate and just validate-terms.

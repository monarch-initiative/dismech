  summary: Split environmental activity node into restriction + moderate-exercise
    arms (#6953)
  details: |
    Resolves issue #6953 (Option 1: split the node). The single 'Physical Activity Restrictions' environmental node asserted only the restriction half of activity modification but carried three SUPPORT evidence items, two of which (PMID:36453629, a 10,000-steps/day pediatric intervention; PMID:28947563, moderate exercise training in Marfan mice) report the OPPOSITE direction of effect - exercise slowing aortic root dilation. Split into two exposures: (1) 'Vigorous Isometric and Competitive Sport Restriction' keeps PMID:9789865 and adds PMID:36072558 (guidelines restrict vigorous exertion to prevent acute dissection) plus PMID:35144638 as PARTIAL (intensity threshold for harm; the review states the deleterious high-intensity effects were reported only in animal studies); (2) 'Moderate Dynamic Aerobic Activity' receives the two relocated exercise-benefit items with rewritten explanations, plus PMID:36072558 (moderate-intensity exercise safe and feasible in thoracic aortic disease). Both effect strings are phrased 'Reduces risk of ...' so the KGX exporter maps each to biolink:associated_with_decreased_likelihood_of rather than contributes_to (see #2098/#2623); when the structured effect_polarity enum from #2656 lands, both nodes should be set PROTECTIVE. Two new references cached with just fetch-reference. Validated: just validate (pass), just validate-references (121/121 snippets verified), just validate-terms (pass).

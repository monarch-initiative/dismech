  summary: Evidence the five unsupported Marfan mechanism nodes, record the case against
    the TGF-beta step, and add the revised Ghent nosology, from a claude_managed deep-research
    report
  details: |
    Source: research/Marfan_Syndrome-deep-research-claude_managed.md (deep-research-client claude_managed provider; grader satisfied on iteration 2; session reached its cost cap after the verdict, so no repair round ran; evidence check 185/185 quotes found, 194/194 cited identifiers backed by evidence). Report validation: 211 references, 210 resolve; the other (PMID:21152435) is real but failed one NCBI fetch with HTTP 400. Compared with the existing falcon and cyberian-codex reports, which share one base of 6 review DOIs, this report cites 194 PMIDs, 183 of them new to this entry.

    Gap review: five of six pathophysiology nodes carried no evidence. Added primary evidence to each:
    - Dysregulated TGF-beta Signaling: SUPPORT PMID:12598898 (lung, fibrillin-1-deficient mice), PMID:16601194 (losartan and TGF-beta neutralisation prevent aneurysm); REFUTE PMID:28119285 (young Fbn1 C1039G/+ mice develop aortopathy with no detectable SMC TGF-beta change, worsened by SMC TBRII loss). The description now says the step is contested and stage-dependent.
    - Extracellular Matrix Remodeling: PMID:15254584 (impaired microfibrillar deposition), PMID:10097121 (inflammation-mediated elastolysis in mgR mice).
    - Impaired Mechanotransduction: PMID:33976159 (NO-sGC-PRKG1 dysregulates SMC actin; NO donors induce, sGC/PRKG inhibition reverses). Added a sentence for this route; the node's integrin-fibrillin sentence remains without direct evidence.
    - Vascular Inflammation: PMID:18954631 (T cells and macrophages in Marfan aneurysm media and adventitia).
    - Mitochondrial Dysfunction: PMID:33709773 (mtDNA depletion; SMC Tfam deletion).
    Diagnosis: added Revised Ghent Nosology (PMID:20591885) as the first diagnosis entry.

    Noted, not changed: the genetic section lists TGFBR1, TGFBR2, SMAD2, SMAD3 and ACTA2, which cause other heritable aortopathies (Loeys-Dietz, familial TAAD) rather than Marfan syndrome; worth a separate review. All snippets copied from references_cache fetched with just fetch-reference; validate-disorders passed (142 snippets, 150 titles).

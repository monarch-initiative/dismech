  summary: Drop withdrawn ClinGen FBN1-Marfan validity citation
  details: |
    ClinGen unpublished its 2019 Definitive gene-disease validity assertion for FBN1 and Marfan syndrome (CGGV:assertion_d3fc0bea-...): on 2026-10-09 the report id returned ClinGen's invalid-identifier page, the row was absent from the gene-validity export, and the FBN1 gene page listed only familial thoracic aortic aneurysm and Shprintzen-Goldberg syndrome. The evidence item quoting that row was removed from the FBN1 genetic entry, which keeps its six literature citations for the gene-disease association; the withdrawal is recorded in the entry's notes, and the orphaned CGGV cache file was removed. Orphanet's ORPHA:558 record carries no gene table, so there is no structured-source replacement. Validated with just validate-disorders, count-verified-snippets, check-reference-titles, check-entity-refs and check-duplicate-keys. Found by the CGGV currency census in dismech issue 13576.

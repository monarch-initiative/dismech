  summary: 'Review: claim-evidence correctness fixes (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: (1) biochemical > Fibrillin-1 Protein carried four evidence items marked REFUTE whose explanations all affirmed support of the presence: Abnormal claim - retagged PMID:8180508 and PMID:37688493 SUPPORT, PMID:22705998 PARTIAL (it argues the pathogenic model is TGF-beta dysregulation downstream of fibrillin-1 deficiency), and removed PMID:9586151 whose snippet about revised nosologic criteria did not bear on the protein-presence claim. (2) prevalence record 1 had prevalence_class BAND_1_5_PER_10000 (10-50/100k) contradicting its own rate_low 5.0 / rate_high 10.0 - corrected to BAND_1_9_PER_100000 and added a note flagging the ~10x disagreement with the second (Orphanet worldwide) record. (3) PMID:26631233 in that record was marked REFUTE although its 6.5/100,000 falls inside the recorded interval - retagged SUPPORT; both explanations in the block referenced a stale 0.01-0.02 percentage absent from the record and were rewritten. (4) Removed PMID:7911041 from the Aortic Aneurysm phenotype: a 1994 cardiovascular genetics review whose quoted sentence concerns supravalvular aortic stenosis, Williams syndrome and elastin, never aortic aneurysm. (5) Rewrote two progression explanations that argued against an onset restricted to childhood-adolescence, superseded by age_range: All ages. Deferred to issue #6953: the environmental Physical Activity Restrictions node cites two exercise-benefit studies (PMID:36453629 10000-steps RCT, PMID:28947563 murine) as SUPPORT for an activity-restriction claim - direction-of-effect mismatch needing clinical input on how to model the dynamic-vs-isometric distinction. Validated with linkml-validate and an offline snippet-vs-cache substring check.

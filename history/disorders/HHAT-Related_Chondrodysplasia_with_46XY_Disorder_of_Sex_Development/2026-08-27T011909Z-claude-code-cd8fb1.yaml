  summary: 'Create: HHAT-related chondrodysplasia with 46,XY disorder of sex development'
  details: |
    Completes ISDS Nosology group 12, row NOS 12-0060. The pathograph is organised around the fact that HHAT palmitoylates all three mammalian Hedgehog ligands, so one enzyme defect attenuates three developmental programmes at once - SHH for the forebrain midline and face, IHH for the growth plate, DHH for testis cord formation and fetal Leydig differentiation - which is what makes the otherwise disparate phenotype coherent. Entry name uses current terminology for the sex development phenotype; the MONDO label's historical wording is reproduced exactly on disease_term as term validation requires and kept as a synonym. Open knowledge gap records that the skeletal phenotype has never been characterised radiographically at the level the group placement implies. 35 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

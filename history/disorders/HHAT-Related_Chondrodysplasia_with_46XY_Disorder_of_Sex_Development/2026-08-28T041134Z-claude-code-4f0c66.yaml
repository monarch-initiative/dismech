    Split Craniofacial, Forebrain and Cerebellar Maldevelopment into three nodes with separate edges: midline forebrain and craniofacial maldevelopment, cerebellar hypoplasia, and microcephaly with neurodevelopmental impairment. These are distinct Hedgehog-dependent developmental programmes and the evidence differs between them - the cerebellar arm in particular rests on an independent molecularly confirmed sibship.

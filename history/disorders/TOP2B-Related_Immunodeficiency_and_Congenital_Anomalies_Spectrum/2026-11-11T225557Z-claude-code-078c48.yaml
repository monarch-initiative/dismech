  summary: 'Create: TOP2B-Related Immunodeficiency and Congenital Anomalies Spectrum'
  details: |
    New entry for the TOP2B disease MONDO files as B-cell immunodeficiency, distal limb anomalies, and urogenital malformations, curated as its own Disease rather than a subtype of Autosomal Agammaglobulinemia: MONDO files it under syndromic disease, the lesion is a dominant-negative topoisomerase IIbeta defect rather than a pre-B-cell-receptor signalling defect, and the limb and urogenital features have no home in the agammaglobulinemia entry. The stub was marked entry_type DISEASE and deleted.

    Named TOP2B-Related Immunodeficiency and Congenital Anomalies Spectrum. The MONDO exact synonym Hoffman syndrome was rejected because it collides with Hoffmann syndrome, the hypothyroid pseudohypertrophic myopathy, which several recent papers spell with one n and which MONDO:0016521 carries as a synonym. TICAS, the acronym proposed by PMID:37068767 and used independently by PMID:42963833, supplies the established gene-related name. The MONDO label, Hoffman syndrome, BILU syndrome and TICAS are all kept as synonyms.

    relationship_type is left unset on the TOP2B genetic row: the schema reserves CAUSATIVE for a ClinGen Definitive or Strong tier and ClinGen rates this pair Moderate, which is recorded in gene_disease_validity with the CGGV record quoted. UNKNOWN would wrongly say the pair is unclassified.

    The pathograph runs from the heterozygous TOPRIM-domain variant through loss of type II topoisomerase activity to the failure of long B-lineage transcription factor gene expression, the marrow arrest, and the absent peripheral B cells, with separate NK-cell and developmental-malformation branches. Seventeen of nineteen phenotypes are causally connected; postnatal growth retardation and infantile spasms are left unconnected because no cited source gives a mechanism for them. Two open questions are recorded in discussions: why neither mouse model reproduces the malformations (HUMAN_MODEL_MISMATCH), and why the defect is B-lineage selective.

    Deep research ran as falcon with --fallback; the falcon key was rejected with HTTP 403 and OpenScientist produced the report. Its reference validation resolved 21 of 21 identifiers with none unresolved, and flagged one as possibly off topic; term validation resolved 36 of 38, with one obsolete GO term and three terms named as a different term. just preflight-dr returned WARN: the report writes HGNC:11997 beside the TOP2B symbol twice, which is TOR3A. The report was used as a lead list only and nothing was cited from it; all 93 snippets are quotes from references fetched directly, and the HGNC identifier here is hgnc:11990 from the term cache.

    Also edited kb/disorders/Autosomal_Agammaglobulinemia.yaml, turning its TOP2B has_subtypes row into a pointer with curated_in and a MONDO-bound subtype_term, following the Achromatopsia ACHM3 precedent. The rest of that entry's TOP2B content was left in place.

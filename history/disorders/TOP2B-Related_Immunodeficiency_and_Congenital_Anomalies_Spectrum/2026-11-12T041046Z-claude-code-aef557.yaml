  summary: 'Review round 1: NK counts, evidence grading, antibody-failure node'
  details: |
    NK counts were below the age reference range in two of the four founding patients, not three: Table 1 of PMID:31409799 gives 58, 172, 448 and 17 CD16-positive NK cells per microlitre against ranges of 200-400, 150-400, 200-600 and 200-600. The NK node and the NK phenotype descriptions now say two of four. On the NK phenotype, a PMID:35063500 sentence saying NK cells had not previously been examined was graded as support for the phenotype; it is replaced by the Table 1 row itself.

    Two gradings are corrected. The PMID:32128574 sentence on experimental data consistent with a dominant-negative effect summarises recombinant-protein, transfection and decatenation assays, so it is IN_VITRO rather than HUMAN_CLINICAL. The sentence predicting that the A485P proline destabilises a TOPRIM helix is a structural prediction, so it is COMPUTATIONAL rather than IN_VITRO. Each sentence appears once in the entry.

    The node Absent Peripheral B Cells and Failure of Antibody Production is renamed Failure of Antibody Production, and its description now covers the antibody claim alone; the absent circulating B cells are already the phenotype that Arrest of Early B-Cell Development points to. The five bare-name targets that named it (one causal edge, the immunoglobulin treatment, and the knockin mouse link and readout) are updated.

    Smaller changes: the edge from the B-cell arrest to absent circulating B cells now cites the marrow aspirate finding instead of a sentence explaining why the authors studied T cells; Abnormal facial shape moves from VERY_FREQUENT to FREQUENT, since no source gives a count; and the anticonvulsant treatment names vigabatrin (CHEBI:63638) and lamotrigine (CHEBI:6367), both read from the CHEBI term cache.

    Validation: validate, validate-terms, count-verified-snippets (93/93), check-reference-titles-present, check-entity-refs, check-causal-targets, check-name-collisions, validate-disorders and the six baseline gates pass.

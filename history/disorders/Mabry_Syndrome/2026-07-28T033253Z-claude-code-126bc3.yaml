  summary: 'Create: Mabry Syndrome (HPMRS/GPI-anchor deficiency)'
  details: |
    De-novo grouping-level curation of Mabry syndrome (HPMRS, MONDO:0016596) with six HPMRS1-6 subtypes (PIGV/PIGO/PGAP2/PGAP3/PIGW/PIGY). Deep research via claude_code provider (full report). Unbundled two-arm pathophysiology (ER biosynthesis + Golgi remodeling arms converging on transamidase-mediated soluble ALP release and reduced GPI-AP surface display, then synaptic dysfunction, brain atrophy, and PLP-depletion side branch to seizures). Evidence anchored on verified PubMed abstracts (Krawitz 2010 PIGV, Murakami 2012 ALP-release mechanism, Horn 2014 founder allele, Sidpra 2024 cohort frequencies, pyridoxine cohort, Pigv341E mouse). Added KNOWLEDGE_GAP (no episignature/omics) and HUMAN_MODEL_MISMATCH (Pigv341E social-domain inversion + unmeasured ALP) discussions. Validated: just validate (schema+terms) pass; all 23 evidence snippets verified as exact substrings of cached abstracts.

  summary: 'Create: Tick Paralysis'
  details: |
    De novo creation of Tick Paralysis (MONDO:0005981), a tick salivary neurotoxin envenomation. Curated as category Injury / Arthropod Envenomation, not Infectious Disease: no microbe replicates in the host, so no infectious_agent/transmission/agent_life_cycle block, and check-granularity correctly places it out of the infectious ladder (infectious set: 0). Pathograph: holocyclotoxin inhibition of presynaptic calcium entry -> reduced quantal acetylcholine release -> neuromuscular transmission failure, with the latter two nodes conforming to neuromuscular_transmission_failure module nodes. North American (Dermacentor andersoni/variabilis) and Australian (Ixodes holocyclus) forms curated as has_subtypes on the documented post-removal-course difference (rapid reversal vs 24-48h worsening). Treatments: tick removal (key), supportive care/mechanical ventilation, Australian tick antitoxin. Deep research: one Perplexity report; used as leads only, all evidence re-fetched from PubMed. 26/26 snippets verified. NCBITaxon tick species IDs looked up at OLS. No human causal gene.

  summary: 'Create: Fetal Valproate Syndrome'
  details: |
    Created kb/disorders/Fetal_Valproate_Syndrome.yaml for issue #13597 as a Disease entry rather than a has_subtypes entry on an existing disease: it has its own MONDO term, its own consensus diagnostic criteria, and a malformation pattern no parent disease carries. Structurally it follows Fetal_Alcohol_Spectrum_Disorder.

    DEEP RESEARCH. falcon was requested and is not configured here, so the run used --fallback and was produced by claude_code, recording fell_back, requested_provider and provider_attempts in its frontmatter. Two artifacts are committed with the same report body and different validation results. The run's own frontmatter (the claude_code-named file, which carries template_sha) sets needs_review: true - 71 of 72 references resolved, with PMID:35639399 unresolved and flagged as possibly fabricated, and 54 of 71 assessed references scored on topic. A later re-validation (the falcon-named file) resolved all 72, because PMID:35639399 resolves on retry; it is real (Bjork 2022, JAMA Neurology), was fetched successfully, and is now cited in the entry, so that flag was a transport failure and not a fabrication. Both runs flagged 15 to 17 references as off topic; that score is computed against the report's own vocabulary and was not treated as a verdict. Term validation resolved 85 of 86, the exception being an unresolvable ORPHA prefix, which means unchecked rather than wrong. just preflight-dr returned SKIP because MONDO records no causal gene for a teratogenic disorder, so the OMIM identifier was checked by hand (609442 in both report and MONDO). Duplicate preflight ran against origin/main, all PRs and all issues: no existing entry, no prior PR, only issue #13597. just check-genereviews --online with 7 synonyms present returned NO_CHAPTER, so no GeneReviews baseline exists.

    CONTENT. A 16-node pathophysiology chain with one root (the exposure) and three terminal outcomes: failed neural tube closure, craniofacial dysmorphogenesis, neurodevelopmental impairment. Three upstream branches are curated in parallel and deliberately not ranked - class I HDAC inhibition, folate receptor antagonism, embryonic redox disruption - but the entry states they are not equally supported: the first two carry analogue-dissociation evidence, the redox branch rests on pharmacological rescue and carries a REFUTE item of its own. 36 phenotypes, 6 treatments, 4 animal and 5 experimental models including the Valone 2026 83-donor human neural progenitor panel (PMID:41935183) named in the issue, and 7 discussions.

    Contradictions carried rather than resolved: the progenitor proliferation/differentiation direction conflicts between human in vitro and mouse in vivo; folic acid protects across antiseizure medications but not against valproate-associated spina bifida; small-for-gestational-age has evidence both ways and no frequency. A discussion records that Anencephaly, Spina_Bifida_Cystica and Autism_Spectrum_Disorder describe this mechanism differently from each other and from this entry, and proposes a shared module.

    Not curated, each recorded as a visible gap: the 30-40% neurodevelopmental figure (traces only to regulatory summaries with no quotable primary source); paternal exposure (association does not survive restriction to fathers with an indication, PMID:41733407); the 80.6% sensory phenotype (no HPO term the source's wording supports); laryngomalacia, epicanthic folds and the non-myopia ophthalmological anomalies (named in the consensus chapter's tables, which the cached abstract-level extraction does not contain).

    Two treatment_term bindings are constrained by the schema: the TreatmentActionTerm enum admits only NCIT descendants of NCIT:C25218, so MAXO:0001015 and MAXO:0001128, which name the two actions exactly, were replaced with NCIT:C15843 and NCIT:C64894 and the mismatch noted in both treatments.

    SELF-REVIEW BEFORE PR. A fresh-context adversarial review using dismech-pr-review returned REQUEST_CHANGES, and every finding was fixed or answered. Fixed: this details field and the entry notes previously asserted a clean deep-research validation result that neither artifact supported (corrected above); a claim that scalp defects could not be quoted was false, since the snippet validator supports ellipsis splitting, so that phenotype is now curated along with talipes and pes planus; the cranial neural crest to craniofacial edge cited a sentence whose stated outcomes are trigeminal axonal elongation and reduced head size, neither of which is that node, so it was re-cut and downgraded from DIRECT; six frequency bands sat a band above their own evidence and were corrected (Cognitive impairment, Intellectual disability, Autism, ADHD and Specific learning disability moved down; Memory impairment and Small for gestational age had their bands removed); PMID:35639399 and PMID:38507750 were added as the population cohorts that settle the per-exposed-pregnancy denominator; four phenotype frequencies taken from a support-group-ascertained fetal anticonvulsant series now carry an ascertainment caveat; four evidence_source values were corrected and one mixed-source quote re-cut; HP:0000389 became HP:0031353 (otitis media with effusion, the term for glue ear) and HP:0006501 became HP:0006433 (radial ray deficiency, matching the source wording); two nodes bundling two biological scales were split (folate receptor antagonism from embryonic one-carbon metabolism, and circuit formation from the clinical outcome); two DIRECT edges resting on co-occurrence or a hedged organoid inference were downgraded; an edge whose only evidence was a cross-species validity remark now carries no evidence and says so; PMID:34293696 was added because it shows valproate lowering placental folate carrier expression, which means the HDAC and folate branches may be serial rather than independent, and the wording claiming independence was removed; PMID:37443734 was registered as an experimental model rather than only cited; and several denominator and attribution errors in prose were corrected.

    VALIDATION after the fix pass: just validate passes all three stages (schema, terms, references) with 192 snippets checked and 0 issues; just count-verified-snippets reports 192/192 with 0 skipped, so no DOI-only evidence went unchecked; just validate-disorders, the check CI runs, passes; just check-entity-refs and just validate-terms pass. A duplicate causal_link_type key introduced during the fix pass was caught by the validator and removed - PyYAML had silently accepted it. The three entries sharing re-fetched reference caches (Anencephaly, Autism_Spectrum_Disorder, Spina_Bifida_Cystica) still verify 198/198, so the cache churn broke nothing.

    Nine snippets initially failed the audit solely because they included inline bracketed citation spans, which the validator strips before matching; all nine were re-cut to bracket-free spans rather than left unverified. The session began under claude-fable-5-1 and completed under claude-opus-5 after a model switch.
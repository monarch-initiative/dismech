  details: |
    Added the missing Orphanet ORPHA:79500 Very frequent and Frequent phenotypes—Gingival overgrowth (HP:0000212), Wide nasal bridge (HP:0000431), Long philtrum (HP:0000343), Anteverted nares (HP:0000463), Floppy infant (HP:0008947), Poor suck (HP:0002033), Polyhydramnios (HP:0001561), Bilateral tonic-clonic seizure (HP:0002069), and Focal impaired awareness seizure (HP:0002384)—corroborating gingival overgrowth and wide nasal bridge with PMID:32849222 and seizure semiologies with PMID:24291220, wiring the two seizure types from TBC1D24 synaptic vesicle cycling dysfunction and leaving dysmorphic/perinatal phenotypes unwired rather than adding speculative edges. Clarified the DOORS-specific Frequent rating vs broader TBC1D24-spectrum occasional wording for urinary 2-oxoglutarate, softened Strabismus and Coarse facial features downstream edge descriptions to state unestablished intermediate mechanisms, added the GeneReviews PMID:25719194 25% sibling recurrence-risk quote to Autosomal Recessive inheritance, and aligned the ATP6V1B2 ClinGen note to data/clingen/MANIFEST.yaml (2026-10-04).

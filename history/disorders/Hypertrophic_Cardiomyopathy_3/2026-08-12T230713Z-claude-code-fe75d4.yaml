  summary: 'Address PR #7815 review: ECG/NSVT/syncope phenotypes, penetrance, CMR,
    arrhythmic-risk gap'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7815 (seven IMPORTANT findings,
    seven suggestions; the previous push was a rebase, so all were still open). Findings 1, 2, 4,
    5, 6 and suggestion 8 are addressed. Findings 3 and 7 are NOT curated, and the reason is
    recorded in the entry rather than left silent - see below, because that is the substantive
    decision in this session.

    FINDING 2 (abnormal ECG) and FINDING 4 (TPM1 penetrance). Both satisfied from PMID:32731933,
    already cached and already cited, exactly as the review indicated. Added an Abnormal
    Electrocardiogram phenotype (HP:0003115) carrying the observation that matters for this entry:
    54.2% of carriers had an abnormal ECG BEFORE meeting diagnostic criteria, a median 4.4 years
    before, which is the empirical justification for the serial-surveillance cascade testing the
    entry already curates. Added the TPM1 15-year penetrance of 42% to the genetic block.

    The review warned specifically against under-qualifying that figure, and the curation follows
    that warning rather than the headline number. The snippet quotes the full per-gene table so the
    95% CI of 11% to 92% travels with the estimate; the explanation states that the interval
    overlaps every other gene, that it rests on 9 carriers in 3 families, and that it must not be
    counselled as a TPM1-specific figure. A second evidence item quotes the all-gene benchmark of
    46% so a reader can see immediately that 42% sits inside it and carries no information beyond
    the cohort average. Both items are PARTIAL for that reason.

    FINDING 1 (symptomatic/arrhythmic phenotypes) - partially addressed, with the limits stated.
    Added Non-Sustained Ventricular Tachycardia (HP:0004756, general term with a narrower
    preferred_term since HPO has no NSVT term) and Syncope (HP:0001279), both sourced to the
    thin-filament review PMID:36158814 and both PARTIAL because that source is a narrative review
    of the class rather than a TPM1 measurement. Frequency bands are omitted from both with the
    reason inline. Dyspnea, atrial fibrillation and chest pain were NOT added: the cohort
    percentages the review cited for them are in the full text and tables of the thin-filament
    outcome study, not its abstract, which is what is cached.

    FINDING 5 (CMR/LGE) - added a Cardiac Magnetic Resonance diagnosis entry, but built on what the
    cached abstract actually supports: the thin-filament cohort's significantly lower maximum wall
    thickness measured by both echocardiography (p=0.024) and CMR (p=0.006). The entry states the
    LGE rationale from the fibrosis phenotype it already curates, and its notes record that the
    circulating LGE prevalence figure is not quotable from the cached abstract. The DOI reference
    for that cohort study was fetched during this session with just fetch-reference.

    FINDING 6 (thin-filament prognosis / Risk-SCD) - added as a KNOWLEDGE_GAP rather than as
    prose, and it turned out to be a stronger finding than the review framed it. The cached
    abstract of the thin-filament outcome study contains three quotable statements that set up a
    genuine contradiction: no thin-filament patient experienced a malignant arrhythmic event; the
    authors state directly that the higher-arrhythmic-risk claim is controversial between studies
    and depends on age of onset and genotype; and thin-filament patients progressed to advanced
    heart failure roughly five times faster (HR 5.6). The gap rationale sets those against the
    narrative-review framing of high arrhythmic risk, and draws out the calibration consequence -
    the conventional risk models are driven by wall thickness, which is precisely the input that is
    lower in this class, so they may under-call a risk weighted toward heart failure, or may
    correctly identify a genuinely lower arrhythmic risk, and nothing in current evidence
    distinguishes those. A proposed experiment specifies the stratified calibration analysis on
    registries that already exist.

    SUGGESTION 8 (ICD contradiction in notes) - resolved. The scope note listed ICD among the
    generic treatments delegated to the umbrella entry while the entry itself curates an ICD
    treatment. The note now states ICD as a deliberate exception and says why: risk stratification
    in thin-filament disease is genotype-dependent in a way the rest of the generic set is not,
    and it points at the new knowledge gap.

    FINDINGS 3 and 7 NOT CURATED, deliberately. Finding 3 is the Finnish TPM1-D175N founder effect;
    finding 7 is the case-control observation that truncating TPM1 variants confer no HCM excess
    (OR 0.00), which the review correctly identifies as the observation grounding a
    gain-of-function rather than haploinsufficiency mechanism. Neither is quotable from any source
    cached for this entry: the founder-population detail appears in no cached record, and the
    odds ratio comes from a web-hosted variant atlas rather than a paper with a quotable abstract.
    Curating either would mean attaching a citation that does not contain the claim. Both, and the
    unquotable percentages behind finding 1 and finding 5, are recorded in a new notes paragraph
    that names each omission and its reason, so the next reviewer sees a decision rather than a
    gap. The truncating-variant point is instead made qualitatively where the evidence does support
    it - every curated TPM1 allele in this entry is missense.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_3.yaml' passes in
    full - schema, terms, references - with 118/122 snippets verified against cached references
    (4 skipped by prefix, the DOI-prefixed items the validator does not snippet-check), up from
    113/113. Two snippets had to be re-spanned during curation and the reasons are recorded where
    relevant: the thin-filament review is a PDF cache whose typographic ligatures break exact
    substring matching, and the penetrance benchmark sentence contains square-bracketed text that
    the validator normalises away.

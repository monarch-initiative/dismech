  summary: 'Create: Hypertrophic Cardiomyopathy 3 (TPM1)'
  details: |
    Created the gene-specific CMH3 (TPM1) entry, MONDO:0007267, as a child of the
    existing Hypertrophic_Cardiomyopathy umbrella (MONDO:0005045). The umbrella
    file was not edited. The entry conforms to the
    cardiomyopathy_maladaptive_remodeling module at four nodes: Primary
    Cardiomyocyte Insult, Ventricular Remodeling, Progressive Contractile
    Dysfunction, and Structural Cardiac Impairment and Heart Failure.

    Deep-research provider. The requested provider was falcon (Edison /
    FutureHouse), but no EDISON_API_KEY or FUTUREHOUSE_API_KEY was present in
    this environment and deep-research-client reported only
    "Available: claude_code". The claude_code provider was substituted; the
    substitution is disclosed in the entry notes, the commit message, and the PR
    body. The resulting report is committed at
    research/Hypertrophic_Cardiomyopathy_3-deep-research-claude_code.md.

    NEC preflight. Run twice. (1) Against sqlite:obo:mondo before curation:
    MONDO:0007267 carries relationship RO:0004003 HGNC:12010 (TPM1), xref
    OMIM:115196, and synonyms CMH3 / "cardiomyopathy, familial hypertrophic, 3".
    (2) Against the DR report before using any of its content: TPM1 is named 125
    times versus 19 for the next-most-frequent gene (MYBPC3), and OMIM 115196 is
    asserted throughout, both matching the MONDO record. CMH3 is in a documented
    high-NEC-risk class (numbered CMH series plus a gene that is pleiotropic
    across hypertrophic, dilated, restrictive, and noncompaction phenotypes), so
    the TPM1 allelic siblings are handled explicitly as differential diagnoses
    rather than mixed into the hypertrophic chain.

    Duplicate preflight. Re-run against a freshly fetched origin/main
    immediately before writing: neither MONDO:0007267 nor its only parent
    MONDO:0024573 (familial hypertrophic cardiomyopathy) is curated, and no open
    or closed PR or issue covers the entity. Clear to create a new file.

    Content curated. 3 mechanistic_hypotheses (CANONICAL loss of
    tropomyosin-mediated crossbridge inhibition; ALTERNATIVE myofilament calcium
    buffering as the initiator of hypertrophic signaling; EMERGING
    variant-specific HCM-versus-DCM divergence), 8 pathophysiology nodes with
    causal edges opting into those hypothesis groups, 12 phenotypes, 2 genetic
    entries with structured case_fractions (3% of familial HCM historically;
    0.61% for the p.Arg21Leu Iberian founder variant in a 4,099-proband HCM
    series), 2 inheritance blocks (autosomal dominant plus rare homozygous), 3
    diagnosis entries, 3 differential diagnoses (thick-filament sarcomeric HCM,
    TPM1-related dilated cardiomyopathy, TPM1-related left ventricular
    noncompaction), 3 progression entries, 3 treatments, 4 experimental models,
    and 3 discussions (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH).

    Evidence discipline. Every PMID was fetched with just fetch-reference; no
    references_cache file was hand-created or hand-edited. DR output was treated
    as leads only - each DR-suggested citation was independently fetched and each
    snippet checked as an exact substring of the cached abstract. Evidence-source
    typing follows the publication, not the curator: COMPUTATIONAL for
    molecular-dynamics and Markov-model claims, IN_VITRO for reconstituted
    filaments and engineered heart tissue, MODEL_ORGANISM for the transgenic
    mouse, HUMAN_CLINICAL for pedigree and cohort data, OTHER for reviews and
    ClinGen assertions. The two mixed simulation-plus-experiment papers
    (PMID:36896133, PMID:39436707) are split into separate single-source items.

    Notable gap closed from DR leads. The first draft had no whole-organism
    evidence. The DR report surfaced the alpha-TM180 Glu180Gly transgenic mouse
    (PMID:11603924), which was verified and added as an experimental model and as
    MODEL_ORGANISM evidence on the trigger, crossbridge, and remodeling nodes.
    Also added from verified DR leads: PMID:10900175 (human reconstituted
    filaments; the "heterologous systems give different effects" statement that
    anchors the HUMAN_MODEL_MISMATCH discussion), PMID:12651045 (the Glu62Gln
    malignant pedigree with five young deaths, which pairs a human phenotype with
    the engineered-tissue mechanism for the same allele), PMID:32731933
    (post-negative-screen penetrance), and PMID:39132495 (ClinGen HCM gene
    reappraisal).

    Validation. just validate passes end to end (schema, terms, references);
    113/113 snippets verified against cached references; just validate-terms and
    just validate-references pass standalone; compliance 87.4% global, 87.6%
    weighted.

    Deliberate omissions, each recorded in the file rather than left silent.
    (1) The mavacamten therapeutic_agent term binding is left unbound: NCIT does
    have a Mavacamten concept (NCIT:C174901) but it is classified under
    NCIT:C168966 Inotropic Support rather than NCIT:C1909 Pharmacologic
    Substance, so it is unreachable from the ChemicalEntityTerm roots and fails
    term validation, and CHEBI has no mavacamten term; per the CLAUDE.md
    convention the agent is carried as free text and the upstream NCIT
    classification gap is noted. (2) There is no TPM1-specific GeneReviews
    chapter; the disease-level Nonsyndromic Hypertrophic Cardiomyopathy Overview
    (PMID:20301725) is tagged GeneReviews in top-level references, but its
    indexed record contains only the chapter purpose statement, so no snippet is
    quoted from it and the clinical baseline is built from primary TPM1 cohort
    and pedigree literature instead. (3) Generic HCM management already curated
    on the umbrella entry (beta blockers, calcium channel blockers, septal
    myectomy, alcohol septal ablation) is deliberately not duplicated here.
    (4) Frequency bands are supplied only where a source supports them and are
    marked PARTIAL where the supporting statement is class-level rather than
    TPM1-specific.

  summary: 'Gene-family review: add MRAP2'
  details: |
    Added MRAP2, previously absent from the KB, as a SUSCEPTIBILITY gene with germline origin and autosomal dominant inheritance: rare heterozygous coding variants are enriched in obesity (pooled OR 2.61 across seven mostly European-ancestry cohorts, PMID:41596694) and the reported variants impair MC4R cAMP or IP3 signaling (PMID:39807633). Named MRAP2 on the shared MC4R pathway node, where the existing type 4 melanocortin receptor binding term covers its binding of MC4R. Typed like SH2B1 and NCOA1, whose evidence is of the same kind.

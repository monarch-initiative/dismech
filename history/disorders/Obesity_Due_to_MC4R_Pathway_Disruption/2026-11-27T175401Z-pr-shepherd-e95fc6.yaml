  summary: 'Address review on PR 18152: split leptin signaling node'
  details: |
    Split leptin and leptin-receptor signaling out of the MC4R pathway signaling failure umbrella node into a new upstream node, Leptin and leptin receptor signaling deficiency, carrying LEP and LEPR, GO:0038021 leptin receptor activity, GO:0005179 hormone activity, and the PMID:17229951 and PMID:37659411 evidence. The hypogonadotropic hypogonadism, delayed puberty and recurrent respiratory infection edges now start from that node instead of the MC4R node, since these leptin effects act on the gonadal axis and immune cells outside the melanocortin pathway; the new node also feeds the MC4R node. Metreleptin's target_mechanisms now point at the new node. Moved GO:0007189 (Gs-cAMP signaling) back to MC4R pathway signaling failure and retagged Hyperphagia and failed satiety as biological_scale ORGANISM. Reworded the insulin resistance edge description to the adiposity route it is drawn from. Removed the synonyms 'Leptin-melanocortin pathway obesity' and 'Hypothalamic and monogenic melanocortin obesity', which could not be sourced. Replaced the SIM1 autosomal dominant inheritance snippet (both the subtype and genetic blocks) with the PMID:23778136 sentence naming heterozygous carriers.

  summary: 'Edit: type SH2B1/NCOA1 records, add LEPR and PCSK1 molecular functions'
  details: |
    Typed the two untyped genetic records conservatively from the entry's own evidence: SH2B1 and NCOA1 both get relationship_type SUSCEPTIBILITY with variant_origin GERMLINE, not CAUSATIVE, because the reported human variants are rare heterozygous changes ascertained from severe-obesity cohorts and no ClinGen gene-disease validity assertion is cached for either gene (just list-gene-validity reports no rows for this entry), so the Definitive/Strong basis the CAUSATIVE value requires is not established. Added one evidence item per record supporting that typing: the heterozygous-null mouse intermediate diet-dependent phenotype for SH2B1 (quote_role BACKGROUND, evidence_source MODEL_ORGANISM, since the sentence is in the paper's framing and describes mouse data) and the 23 rare heterozygous SRC-1 variants found in 2462 people with severe obesity for NCOA1. Added LEPR leptin receptor activity (GO:0038021) and PCSK1 serine-type endopeptidase activity (GO:0004252) as DECREASED molecular functions on the MC4R pathway signaling failure node, which previously carried only the MC4R function although both genes were bound to the node, each with its own evidence item (PMID:17229951 for impaired LEPR signalling, PMID:14617756 newly fetched for severely reduced PC1 catalytic activity). This aligns the node with the ai-gene-review core functions for LEPR and PCSK1 created in the same change. Validation: just validate, validate-terms, count-verified-snippets (56/56), check-duplicate-keys, check-entity-refs, check-causal-targets and validate-disorders all pass.

  summary: Add Xiphophorus Y-linked mc4r copy-number (P locus) animal model
  details: |
    Added the Xiphophorus multilineatus / nigrensis Y-linked mc4r copy-number polymorphism as an animal model, linked via modeled_mechanisms to 'MC4R pathway signaling failure' as PARTIALLY_RECAPITULATES (fidelity MODERATE). Rationale: Lampert et al. (PMID:20869245) showed that non-signal-transducing Y-linked mc4r copies act dominant-negatively on co-expressed functional receptor, giving a naturally occurring graded allelic series of melanocortin-4 signalling loss on a wild-type background. This is directly relevant to heterozygous human MC4R variants, whose severity is not explained by simple haploinsufficiency. Limitations recorded prominently, and repeated in a model-level notes field: fish do not develop an obesity phenotype. The readout is pubertal timing and body size, not hyperphagia or fat mass, so the model recapitulates the receptor-level lesion but not this entry's clinical endpoint; adiposity claims should continue to rest on mammalian and human evidence. The Y-linked, copy-number-variable architecture also has no human counterpart. One readout (onset of puberty, direction ALTERED). Gene bound to hgnc:6932 (MC4R). All snippets verified as exact substrings of the local reference cache. Validation: linkml-validate clean, term validation passed, duplicate-key and entity-ref checks clean, snippet audit reported no failures, baseline gates reported no new defects.

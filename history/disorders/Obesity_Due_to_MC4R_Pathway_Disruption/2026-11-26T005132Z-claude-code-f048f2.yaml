  summary: 'Gene-family review: LEP, LEPR, POMC, PCSK1, MC4R, SIM1, SH2B1'
  details: |
    Added inheritance blocks to six gene records that had none: autosomal recessive for LEP, LEPR, POMC and PCSK1, autosomal dominant for MC4R and SH2B1 (SIM1 already had one). On the shared MC4R pathway node, which already bound the activities of MC4R (melanocyte-stimulating hormone receptor), LEPR (leptin receptor), PCSK1 (serine-type endopeptidase), POMC (type 4 melanocortin receptor binding) and SIM1 (transcription factor), added the three gene products that had none: LEP hormone activity (receptor binding would misdescribe the antagonistic p.D100Y hormone, which binds but does not activate), SH2B1 signaling adaptor activity (SH2B1 is an adapter modulating leptin-receptor/JAK signaling, PMID:23160192) and NCOA1 transcription coactivator activity (PMID:35137184), all decreased. Relationship types were reviewed and kept: the five ligand, receptor and processing genes and SIM1 CAUSATIVE, SH2B1 and NCOA1 SUSCEPTIBILITY.

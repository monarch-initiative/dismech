  summary: 'Genetics pass: retire inflated MONDO:0011122 anchor, bind monogenic subtype
    terms, add SIM1'
  details: |
    Genetics-gap pass for issue #12253 (d2g series-046), Obesity half.

    This entry was not named as a parent in the issue, but it is where the issue's
    Obesity rows belong and it is where the anchor problem was. Its disease_term was
    bound to MONDO:0011122 obesity disorder - the same class Obesity.yaml is bound
    to - so two entries were asserting identity with one class, and the
    mechanism-defined umbrella was claiming the whole of obesity. That inflated
    anchor is why the six gene-defined obesity diseases in the issue were attributed
    here and to Obesity.yaml alike. The entry's own review_notes already recorded the
    compromise ("No precise local MONDO term covered the full acquired-plus-genetic
    umbrella, so MONDO:0011122 (obesity disorder) is used as the root disease term").

    Remedy follows dismech#12184 and the ANK2_Related_Complex_Neurodevelopmental_Disorder
    precedent: disease_term is now free text with no term, and MONDO:0011122 is
    recorded in mappings.mondo_mappings with mapping_predicate skos:broadMatch, which
    is a cross-reference and so does not retire the class from the curation queue.
    The mapping_justification quotes both strings MONDO's description array carries
    for that class (the definition and the editor note - read as a whole list, not
    element zero) and records the four synonym-inclusive OLS4 searches run before
    dropping the binding: "monogenic obesity" returns MONDO:0019182 inherited
    obesity and its seven gene-defined children, the closest fit but one that
    excludes this entry's acquired and congenital hypothalamic-injury arms;
    "hypothalamic obesity" returns MONDO:0975922 acquired hypothalamic obesity plus
    ROHHAD, Froelich and Prader-Willi; "melanocortin" returns only the MC4R leaf
    disease; "leptin" only the LEP and LEPR leaf diseases. No class denotes this
    entry's scope.

    MONDO coverage for the family now sits on the subtype rows, which is the right
    level. Bound four checklist diseases: LEPR to MONDO:0013992, POMC to
    MONDO:0012335, PCSK1 to MONDO:0010961, MC4R to MONDO:0019115. Also bound
    Acquired HO to MONDO:0975922 acquired hypothalamic obesity, which is beyond the
    checklist and an exact match for that row. The LEP row is deliberately left
    unbound: MONDO:0013991 is the disease_term of Congenital_Leptin_Deficiency, where
    the same three forms are curated in full, and the row's description now says so.

    Added the fifth checklist disease as a new subtype: SIM1, bound to
    MONDO:0018244 obesity due to SIM1 deficiency, with a reciprocal genetic record
    (relationship_type CAUSATIVE, subtype FK SIM1) and SIM1 bound onto the MC4R
    pathway signaling failure node. SIM1 belongs on this umbrella rather than beside
    it because Sim1 haploinsufficient mice are resistant to hypothalamic melanocortin
    signalling and Sim1 and Mc4r are expressed in the same nucleus (PMID:16728530),
    so the gene acts inside the pathway this entry is built around; the human
    evidence is PMID:23778136, whose association tracks the strength of the
    functional defect rather than being fully penetrant. The description records that
    contiguous 6q16 deletions removing SIM1 are a separate disease curated as
    6q16_Deletion_Syndrome, so this row is the intragenic form.

    All seven monogenic subtype rows now carry a bound genes descriptor; previously
    the genes reached the pathograph only through the genetic records and the node's
    own gene list. relationship_type CAUSATIVE and variant_origin GERMLINE were added
    to the four checklist gene records, translating the existing free-text
    association values rather than adding a claim. SH2B1 and NCOA1 were left
    untouched: their rows assert "Causative" in free text but ClinGen has no assertion
    for either, and CAUSATIVE in this schema means Definitive or Strong.

    Declined: MONDO:0014309 obesity due to CEP19 deficiency has no row here. CEP19 is
    a ciliary protein, not a leptin-melanocortin component, and the gene is already
    curated and pathograph-wired in Bardet-Biedl_Syndrome on Orphanet's gene list for
    that syndrome. Whether the standalone MONDO concept is nonsyndromic morbid
    obesity or a Bardet-Biedl presentation is a nosological question this pass did
    not research; it is recorded in Obesity.yaml's notes and reported in the PR.

    Validation: just validate and validate-terms pass; count-verified-snippets
    51/51; check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms pass.

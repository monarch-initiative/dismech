  summary: Bind POMC and SIM1 molecular functions on the MC4R signaling node
  details: |
    The 'MC4R pathway signaling failure' node names POMC and SIM1 but bound only MC4R, LEPR and PCSK1 activities, so neither gene's own function was represented. Added GO:0031782 type 4 melanocortin receptor binding (POMC-derived alpha-MSH) and GO:0000981 DNA-binding transcription factor activity, RNA polymerase II-specific (SIM1), both DECREASED, matching the core functions of the ai-gene-review POMC and SIM1 reviews. Existing node evidence (PMID:35528826 for POMC; PMID:16728530 for Sim1 heterozygote melanocortin resistance) supports both. Labels looked up in OLS / the GO cache.

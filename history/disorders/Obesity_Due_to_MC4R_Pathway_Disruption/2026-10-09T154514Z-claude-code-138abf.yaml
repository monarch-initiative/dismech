  summary: Gene-alignment review of MC4R pathway node and gene records
  details: |
    Checked all eight gene bindings (LEP, LEPR, POMC, PCSK1, MC4R, SH2B1, NCOA1, SIM1) against cache/hgnc/terms.csv and list-gene-term-mismatches: all correct. Added relationship_type CAUSATIVE and variant_origin GERMLINE to the LEP genetic record (biallelic LEP deficiency). Left SH2B1 and NCOA1 without relationship_type because the schema defines CAUSATIVE as ClinGen Definitive/Strong and these heterozygous, incompletely penetrant associations have no ClinGen classification. On the MC4R pathway signaling failure node, replaced the unmodified GO:0007188 with the more specific GO:0007189 adenylate cyclase-activating GPCR signaling pathway (MC4R is Gs-coupled) and added molecular function GO:0004980 melanocyte-stimulating hormone receptor activity, both modifier DECREASED, with PMID:12588803 in vitro evidence. This aligns the node with the core function of the new ai-gene-review MC4R review. No ClinGen validity records exist for any of the eight genes. Validated with just validate, count-verified-snippets (52/52) and validate-terms.

  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on all 16 pre-existing evidence items across five PMIDs 25684164 CADISS, 33765420 TREAT-CAD, 34746432 ESO guideline, 37957581 HR-MRI vessel-wall imaging, 38791244 peripheral-blood transcriptomics. Re-verified every snippet as an exact substring of the cached source and confirmed each genuinely supports its claim in the gestalt of carotid and vertebral intramural-hematoma pathophysiology and its stroke consequences. No misquotes or wrong-disease attributions found. Added two full-text-sourced evidence items with exact quotes: PMID 38791244 stating CeAD is the primary cause of ischemic stroke in young adults on the thromboembolism node, and PMID 33765420 reporting that ischaemic strokes in TREAT-CAD occurred only in the aspirin group on the aspirin-therapy node. Removed the frequency qualifiers from all five phenotypes Headache, Neck Pain, Ischemic Stroke, Transient Ischemic Attack, Horner Syndrome because none carried dedicated frequency evidence per the frequency-evidence guideline, and the OCCASIONAL band on Ischemic Stroke understated its true occurrence in symptomatic dissection. The single CADISS presentation quote reflects a symptomatic-trial cohort rather than population frequencies.

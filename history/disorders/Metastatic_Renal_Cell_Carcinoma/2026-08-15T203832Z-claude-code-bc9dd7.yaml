  summary: Add ICD-O morphology and Harrison's chapter classification
  details: |
    Weekly compliance pass, cancer-classification/ICD-O theme. Added a classifications block with icdo_morphology=Carcinoma and harrisons_chapter=ONCOLOGY_HEMATOLOGY. Derivation: the entry disease term MONDO:0005086 renal cell carcinoma corresponds to NCIT:C9385 Renal Cell Carcinoma, which OAK confirms is a descendant of NCIT:C2916 Carcinoma, the NCIT term the ICDOMorphologyEnum Carcinoma value is bound to. NCIT also places NCIT:C9385 under NCIT:C224634 Urinary System Adenocarcinoma and ICD-O codes RCC NOS as 8312/3 in the adenocarcinoma block, so the more specific Adenocarcinoma value would be defensible; the conservative Carcinoma value was chosen to match contemporary clinical and WHO usage, and that judgement is recorded in notes. A supporting evidence item was attached quoting PMID:36831657 describing ccRCC as a renal epithelial malignancy. Validated with just validate; just count-verified-snippets reported 15/28 verified with 13 skipped by prefix and no unverified snippets.

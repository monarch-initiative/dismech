  summary: Add ArrayExpress native-submission dataset records
  details: |
    Added 1 ArrayExpress record(s) via scripts/discover_arrayexpress.py. Only submissions NATIVE to ArrayExpress/BioStudies were considered: 73.6 percent of the collection is GEO series re-accessioned on import (E-GEOD), and curating those would duplicate GEO datasets under a second resolvable accession, so they are excluded by design. Matching required the disease to be named in the study's own title; causal genes were never searched and sibling-disease qualifier conflicts were vetoed. Every accession was resolved against EBI BioStudies before commit. No evidence blocks generated, since an evidence item requires an exact abstract quote.

  summary: 'Create: CCDC115-CDG (MONDO:0014789, CCDC115/VMA22)'
  details: |
    De-novo curation of CCDC115-CDG (congenital disorder of glycosylation type IIo), an autosomal recessive Golgi-homeostasis defect with a liver-predominant phenotype.

    Lump/split decision. Curated as its own kb/disorders entry. MONDO:0014789 is a leaf with no descendants and one causal gene; neither the term nor the label appeared in kb/ or in an open PR at claim time. The closest neighbour already in the KB is MPI-Congenital_Disorder_of_Glycosylation, a different gene and a treatable disease, so this does not duplicate it.

    Curation inputs. One Perplexity deep-research run (research/CCDC115-CDG-deep-research-perplexity.md, committed alongside) plus independent PubMed E-utilities searching. The report was accurate in outline and useful for orientation. It was not used as a source, for the reason its own validation panel gives: it contains no PMID and no DOI anywhere in its body - reference validation checked 5 URL-embedded identifiers out of 18 citations - and its term validation reported 8 of 13 checked labels naming a different term. Those mislabels are worth naming because they are systematic rather than random: NCIT:C15607 offered as Supportive Care (NCIT: Clinical Diagnosis), NCIT:C28255 as Physical Therapy (International Unit), NCIT:C15279 as Occupational Therapy (Radical Mastectomy), NCIT:C28254 as Speech Therapy (Milliliter), NCIT:C15273 as Liver Transplantation (Longitudinal Study), NCIT:C16690 as Gene Therapy (HIV Envelope Protein gp41). Every NCIT suggestion in the treatments section was wrong. This entry uses NCIT:C15271 for liver transplantation, verified independently.

    Gene symbol disagreement, recorded rather than resolved. The live HGNC REST API returns VMA22 ("vacuolar ATPase assembly factor VMA22") as the approved symbol for HGNC:28178, with CCDC115 as a previous symbol. The OBO HGNC build that this repository's linkml-term-validator resolves against still returns CCDC115, and binding VMA22 fails term validation here with a label mismatch. The entry binds CCDC115, which is what the configured authority says, what MONDO says, and what every paper says. The consequence - a query matching this entry against a current HGNC download will not match on symbol - is stated in the entry's genetic notes and in its description, so it is discoverable rather than silently absorbed. The right fix is a refresh of the OBO HGNC build, not a per-entry workaround, so none was applied. The MONDO stub for this disease already carried the VMA22 label, which is how the discrepancy surfaced.

    Structure. Five pathophysiology nodes forming a chain with a branch: biallelic CCDC115 loss of function, impaired V-ATPase assembly and organelle acidification, then two parallel consequences - a combined N- and O-glycosylation defect and lysosomal lipid accumulation with hepatic steatosis - converging on hepatic injury and fibrosis.

    The convergence node is graded PROVISIONAL and both incoming edges are INDIRECT_UNKNOWN_INTERMEDIATES on purpose. Which upstream defect drives the liver disease is not established, and the 2018 case series is explicit that its account of the hepatic pathogenesis is hypothesis rather than demonstration. That is one of the two discussions.

    The acidification node carries a caveat stated in place: the measurement that exists is lysosomal, from CCDC115-silenced HepG2 cells. Golgi luminal pH has not been measured in patient cells; it is argued from the glycosylation phenotype, which the glycosylation phenotype is then explained by. That circularity is the second discussion, and the defining paper's own observation - that the phenotypic spectrum here is distinct from V-ATPase core-subunit defects, suggesting a more general trafficking role - is an argument for measuring rather than assuming.

    Diagnostic content. The entry is built around the Wilson-disease mimicry, because that is the practical failure mode: low ceruloplasmin plus abnormal copper handling plus childhood liver disease reads as Wilson, and two patients in this literature were in fact found inside an ATP7B-negative Wilson series (PMID:32043565). The separator is plasma transferrin glycosylation, not the copper studies, and the entry says so in both the diagnosis and differential-diagnoses blocks.

    Evidence grading. Several items are SUPPORT with directness INDIRECT: the V-ATPase general principle (background framing in its source rather than a measured result), the low-ceruloplasmin finding taken from TMEM199 patients to show it belongs to the mechanism class, and the supportive-care item, which is cited for what the most recent whole-caseload review does not contain. That last one is flagged in its own explanation as being an absence rather than a positive finding.

    Denominator. Thirteen patients reported worldwide as of the 2025 review. Every frequency band in this entry rests on that, and the prevalence notes say so.

    Validation. Schema validation passes; 38 of 38 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

  summary: 'Review round 1: pathograph wiring, node split, cholestasis and facial
    dysmorphism'
  details: |
    Response to the automated review on PR #10097 (ai4c-reviewer, CHANGES_REQUESTED). All four IMPORTANT items and all three suggestions addressed. Nothing disputed. Snippets 38 to 45 verified.

    IMPORTANT 1, orphan phenotypes. Correct, and the ceruloplasmin case was the one that mattered: the entry is built around the Wilson mimicry and the finding that drives it had no mechanistic link. It now hangs off the glycosylation node by an INDIRECT_KNOWN_INTERMEDIATES edge, and the intermediates are named rather than gestured at - ATP7A is glycosylated, deficient glycosylation could impair its function, and loss of copper export into serum would lower ceruloplasmin. Two new evidence items from PMID:34173795 carry that: the attribution of the copper and ceruloplasmin abnormality to hypoglycosylation, and the ATP7A glycosylation claim, the second graded directness INDIRECT because its own source says the mechanism is at present uncertain.

    The neurological arm is now wired by INDIRECT_UNKNOWN_INTERMEDIATES edges from the glycosylation node to developmental delay and hypotonia, with a description saying explicitly that nothing traces a route and the edge records that the arm exists and is unexplained. That is preferable to inventing an intermediate node to make the graph look complete. The hepatic injury node picked up four further edges - hepatosplenomegaly, transaminases, cholestasis, jaundice.

    IMPORTANT 2, node scale. Correct and the CLAUDE.md rule is the right one to invoke: a node that would take two biological_scale values is bundling two claims. Split into "Lysosomal Lipid Accumulation and Failed Lipophagy" (CELLULAR) with phenotypes#Hepatic Steatosis downstream, which also resolves that orphan. The node description now says the separation is deliberate, so the cell-biology claim and the clinical finding can be graded and cited independently. All references to the old node name were updated - the incoming edge from the acidification node and the attaches_to in the first discussion.

    IMPORTANT 3, claim-evidence mismatch on transaminases. Correct. The genotype-correlation sentence presupposes the frequency rather than establishing it. The core-presentation sentence from the same paper is now the first evidence item and carries the VERY_FREQUENT band; the genotype sentence is retained as a second, explicitly weaker claim about magnitude rather than frequency, and its explanation says so.

    IMPORTANT 4, research cross-check. The reviewer was right and the omission had a specific cause worth recording: PMID:34173795 (PMC9255677, the 2021 systematic review of liver involvement in CDG) was fetched during initial curation and then deleted from the commit as uncited. That was a mistake - it is the more recent systematic review, superseding the 2017 one that was cited, and it carries CCDC115-specific content the older one does not. It is now cited and its one enumerating sentence supports three new phenotypes: Cholestasis, Jaundice and Abnormal Facial Shape.

    Seizures were deliberately not added, and the entry now says why. The deep-research report lists them; the systematic review says five of eleven patients had "neurological symptoms" without specifying seizures, and no cached source attributes seizures to this disease. Adding them would have been consuming the report's claim rather than the literature's.

    ORPHA:468684, the reviewer's other suggested source, could not be fetched: it is not among the 347 ORPHA records cached in this repository and just refresh-orphadata fails on a checksum mismatch against the pinned manifest. That failure is already open eight times (#7199, #7234, #7522, #7539, #7622, #8836, #9687, #9897), so no further issue was filed.

    SUGGESTION, GeneReviews negative result. Adopted in the form the sibling CDG entries use: PMID:20301507 is tagged GeneReviews in the references block and the notes state that it is a retired archival overview with no CCDC115-specific content, so the tag records that the search was done and came back negative rather than implying a usable baseline. PMID:34173795 is named as the equivalent expert phenotype baseline.

    SUGGESTION, target_mechanisms on Liver Transplantation. Added, pointing at Hepatic Injury and Fibrosis. treatment_effect is RESTORES, and the description states that this is the closest available enum value rather than an exact one - the graft does not reverse the fibrosis, it removes the tissue carrying it - and that nothing upstream is touched, since a constitutional glycosylation defect persists in every other tissue.

    SUGGESTION, OBO HGNC refresh tracking issue. Not filed, and deliberately. The per-entry handling was affirmed as correct by the reviewer, and the repository already carries a large number of duplicate infrastructure issues of exactly this shape - eight for the Orphadata pin alone - so an unchecked ninth-of-its-kind is a cost rather than a contribution. The disagreement is recorded in the entry's genetic notes where a curator hitting it will see it. Raised for a maintainer in the PR thread instead.

    Validation after the round: schema validation passes; 45 of 45 evidence snippets verified; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

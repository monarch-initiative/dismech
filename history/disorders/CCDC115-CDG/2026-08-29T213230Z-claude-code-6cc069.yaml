  summary: 'Review round 2: fix the cholestasis frequency inversion, add the ATP7B
    copper edge'
  details: |
    Response to the second automated review round on PR #10097. The one blocking item and two of the three suggestions are addressed; the third is now acted on outside the PR. Snippets 45 to 46 verified.

    Blocking item, cholestasis graded above a phenotype the entry says is more frequent than it. Correct, and the defect was introduced by the previous fix commit rather than by the original entry - which is the kind of regression a review round is for. The sentence all four hepatic phenotypes are cited from ranks them explicitly: hepatosplenomegaly, jaundice, liver failure, cholestasis. Cholestasis was graded FREQUENT while Hepatic Failure sat at OCCASIONAL, inverting that order, and the cholestasis description said "it is the least frequent of the four listed" two lines above its own band.

    Cholestasis downgraded to OCCASIONAL rather than raising Hepatic Failure, and the description now states why: the source gives an ordinal ranking and no counts, so the band has to sit at or below the band of liver failure. Raising Hepatic Failure to FREQUENT was the other valid fix the reviewer offered, and it was declined because it would have imported a second denominator - 3 of 8 in the defining series rather than 3 of 13 across the reported caseload - without saying so.

    Which leads to the more useful half of the fix. The reviewer asked for a notes line recording which denominator the bands use, and that was the right thing to ask for: it was invisible, and the answer is that the entry uses two. Bands here use thirteen where a count exists and the source's own ordinal ranking where it does not, and the notes now say so, name the alternative, and record that Hepatic Failure would fall in a different band against the eight-patient series. That is a metadata gap in the schema as much as in this entry - a frequency band carries no denominator, so two entries can disagree by a whole band while both being correct against their own source.

    Suggestion, the ceruloplasmin edge uses the weaker half of the mechanism. Taken, and it materially improves the entry. The source proposes two copper transporters and only ATP7A was curated. ATP7B is explicitly not glycosylated, so it cannot sit downstream of the glycosylation node; the source ties it instead to V-ATPase malfunction via Golgi residence. A second edge now runs from the acidification node to the ceruloplasmin phenotype, with that sentence as its evidence, graded directness INDIRECT because the source calls it a postulated link.

    The point the reviewer drew out is worth restating: ATP7B is the Wilson gene, so this is the half of the mechanism that makes the Wilson mimicry mechanistic rather than coincidental. The same organelle failure that breaks glycosylation is proposed to disable the transporter that Wilson disease disables. That belongs in an entry built around the mimicry.

    Suggestion, make the two remaining orphan phenotypes visibly deliberate. Taken. Elevated Alkaline Phosphatase and Abnormal Facial Shape each now carry a sentence saying the absence of an incoming edge is a decision and giving the reason - bone-derived origin that a hepatic edge would contradict in the first case, no published route in the second. A reader auditing pathograph coverage can now tell these apart from misses.

    Suggestion, HGNC tracking issue. Now filed, having been declined twice. The earlier refusals were about not adding a ninth duplicate of the Orphadata checksum issue; that reasoning does not transfer, because a search of the repository's issues found nothing covering the OBO HGNC build drifting from live HGNC. The reviewer raised it in two consecutive rounds, it outlives this entry, and it is genuinely new - so it is filed rather than left in one entry's genetic notes.

    Validation after the round: schema validation passes; 46 of 46 evidence snippets verified; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

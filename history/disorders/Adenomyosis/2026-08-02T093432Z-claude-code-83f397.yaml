  details: |
    De novo entry created to close the benign-gynecology half of the coverage gap in #7837, which singled out adenomyosis as the conspicuous absence given that both siblings (Endometriosis, Uterine_Leiomyoma) were already curated.

    Curated as two competing hypothesis groups: invagination_tiar_model (CANONICAL) and metaplasia_stem_cell_model (ALTERNATIVE). Six pathophysiology nodes run from junctional-zone microtrauma through TIAR-driven local estrogen production and the self-perpetuating peristalsis loop, to basalis invagination, with parallel somatic-KRAS and aromatase/progesterone-resistance arms converging on myometrial hypertrophy. The entry is written to interlock with its siblings: shared pathophysiology with Endometriosis and molecular separation from Uterine_Leiomyoma (fibroid smooth-muscle drivers absent; KRAS confined to endometrial epithelium) are both curated under differential_diagnoses.

    Term binding notes: CL has no dedicated endometrial stromal cell class, so lesional stroma uses CL:0000499 stromal cell with a more specific preferred_term. Term validation caught a guessed CHEBI ID for dienogest (CHEBI:31475 is dibekacin sulfate); corrected to CHEBI:70708 after OAK lookup.

    Two snippets from PMID:28865548 contain a typo present in the published abstract ('treatment withf GnRHa'); left uncorrected so snippet verification holds, and flagged in the entry notes. Final state: 43/43 snippets verified against cached references on first pass; schema and term validation pass.

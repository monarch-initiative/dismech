  summary: Drop the substrate-less duplicate EMT annotation from the fibrosis node
  details: |
    The Lesional Fibrosis and Myofibroblast Transdifferentiation node carried GO:0001837 epithelial to mesenchymal transition while annotating only a fibroblast (CL:0000057), a myofibroblast (CL:0000186) and a uterine smooth muscle cell (CL:0002601). None of those is the epithelium that undergoes the transition, so the node asserted EMT without the cell that performs it. The annotation was removed rather than repaired with an added epithelial cell type, because the entry already models EMT where its substrate is: the Basalis Invagination and Myometrial Infiltration node carries GO:0001837 alongside CL:0009084 glandular epithelial cell of endometrium. Keeping it in both places asserted the transition twice. The node retains GO:0030198 extracellular matrix organization and GO:0042060 wound healing, which are what its own cell types do, and its conformance to fibrotic_response#Mesenchymal Cell Activation is unchanged. PMID:36099328 names EMT as one of three routes to lesional fibrosis and the description still says so; that is the fibrotic programme rather than this node's own cell-level claim.

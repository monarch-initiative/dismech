  summary: 'Address PR #7863 review: specific CL terms, prevalence, diagnosis, treatments,
    ARID1A'
  details: |
    Addressed all 8 IMPORTANT items from the ai4c-reviewer review on PR #7863.

    1. CL terms rebound to the tissue-specific children the reviewer identified: CL:0002255 stromal cell of endometrium, CL:0002601 uterine smooth muscle cell, CL:0009084 glandular epithelial cell of endometrium. The reviewer was correct and the entry's previous note asserting no dedicated endometrial stromal class exists was factually wrong. Root cause recorded in the notes for future curators: the original search used the adjective form 'endometrial stromal cell' while CL names these in the of-form 'stromal cell of endometrium', so none of the three specific terms were returned.

    2. evidence_source made consistent. PMID:36099328 was tagged OTHER on the stated grounds that it is a review article, while three comparable reviews were tagged HUMAN_CLINICAL. Article format is not the criterion under CLAUDE.md; all four are now HUMAN_CLINICAL. The EMID snippet spans human epidemiologic data and a mouse model, so its explanation now states that the epidemiologic arm is the basis for the classification.

    3. prevalence block added from PMID:41257733 (127 studies, ~199M women): general population 1%, infertility 31%, focal 17%/diffuse 15%. Note the reviewer's quoted figures (histopath 35.1%, MRI 35.0%, US 30.7%) do not appear in that abstract; the curated values are the ones quotable from it.

    4. diagnosis block added from the SOGC guideline PMID:37244746 (transvaginal sonography and MRI).

    5. Treatments added: combined oral contraceptives, tranexamic acid, uterine artery embolization, endometrial ablation, all evidenced from PMID:37244746. HIFU deliberately omitted — no NCIT clinical-action term exists in the local adapter, recorded in notes.

    6. Dyspareunia phenotype added (HP:0030016).

    7. Hysterectomy rebound from generic NCIT:C15329 to NCIT:C15256 Hysterectomy, with evidence and a target_mechanisms link.

    8. Genetic section expanded: KRAS case_fractions 37.1% (PMID:31857578, 26/70) and 24% (PMID:36708516, n=17); new ARID1A entry at 12%. The 37.1% figure the reviewer cited was verifiable after all — it is in the Inoue abstract. Inoue also supplies a clinically actionable link now recorded on the dienogest treatment: KRAS-mutant lesions show diminished dienogest effect via epigenetic PR silencing, tagged IN_VITRO and supports PARTIAL since it was shown in immortalized cells.

    Validation: schema pass, terms pass (two passes, lazy enum expansion), 64/64 snippets verified (was 47/47).

  summary: Deep research (claude_code) + fibrotic_response conformance and EMID hypothesis
  details: |
    Ran the REQUIRED Step 3 deep research skipped in the initial pass: 'just research-disorder claude_code Adenomyosis' (21 web searches, 24 citations, 266 s, $1.80). Report and citations sidecar committed under research/.

    The run corroborated the curated TIAR-invagination chain, the KRAS driver, and the aromatase/progesterone-resistance arm, and exposed one structural gap: the entry had no fibrotic arm at all, despite dismech carrying a fibrotic_response module for exactly this conserved process.

    Three additions, all evidenced from PMID:36099328 (Guo, Reproduction 2022), fetched and snippet-verified:
    1. New pathophysiology node 'Lesional Fibrosis and Myofibroblast Transdifferentiation' with conforms_to fibrotic_response#Mesenchymal Cell Activation, capturing the three-route programme (EMT, fibroblast-to-myofibroblast transdifferentiation, smooth muscle metaplasia) and fibrosis propagation into the interface and endometrium. Conformance target verified to resolve to a real module node.
    2. Heavy-menstrual-bleeding phenotype gained its mechanism: fibrosis-driven tissue stiffness attenuates PGE2/hypoxia signalling and glycolysis, impairing endometrial repair.
    3. New EMERGING hypothesis group emid_model (endometrial-myometrial interface disruption), a third pathogenesis model alongside invagination and metaplasia, with epidemiologic and mouse-model support plus Schwann-cell involvement. Framed as compatible with rather than exclusive of the TIAR model.

    DR identifier hygiene: the report cited 'PMID:34252159 (approx.)' for the Human Reproduction Update NGS paper, self-flagging uncertainty; not used. The correct paper is PMID:34131719, already cited independently.

    Uncurated DR findings recorded in entry notes: TLR4/NF-kB and cGAS-STING inflammation, NLRP3 macrophage pyroptosis, HIF-1alpha/VEGF neuroangiogenesis, hyperinnervation/central sensitization, and impaired decidualization (HOXA10/FOXO1) as the subfertility mechanism. Validation after changes: schema pass, terms pass, 47/47 snippets verified.

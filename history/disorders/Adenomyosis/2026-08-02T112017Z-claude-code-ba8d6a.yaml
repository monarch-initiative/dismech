  details: |
    Applied three non-blocking SUGGESTION items from the approving re-review on PR #7863.

    1. Modality-stratified prevalence. The reviewer was right and my earlier pushback was wrong. I had claimed the histopathology 35.1% / MRI 35.0% / ultrasound 30.7% figures were not quotable because they do not appear in the PMID:41257733 abstract. That was true of the abstract but irrelevant: the cached reference is 42KB of full text and the figures sit at lines 397-400. My error was checking only the abstract slice I had printed rather than searching the whole cached file. Three prevalence records added — histopathology-diagnosed 35.1%, ultrasound-diagnosed 30.7%, and hysterectomy-for-benign-indication 42.3% vs 31.9% for malignant. These are the quantitative anchor for the entry's existing 'Diagnostic ascertainment and prevalence uncertainty' epidemiology entry, which previously argued the ascertainment point only qualitatively. The lesson is recorded in the entry notes alongside the CL of-form lesson.

    2. NSAIDs added, quoting the same SOGC snippet already used for the other medical options. No target_mechanisms, consistent with tranexamic acid and endometrial ablation: it acts on the symptom endpoint, not the lesion.

    3. GnRH agonist therapy gained a therapeutic_agent. Note the reviewer's suggested identifier was wrong: NCIT:C1279 is Pingyangmycin, a bleomycin-family antibiotic, not leuprolide. Verified against OAK and used CHEBI:6427 leuprolide instead. This is the second incorrect term ID from this reviewer in two rounds (the first was NCIT:C15220, given as 'Screening', actually 'Diagnosis Assessment'), so reviewer-supplied identifiers are being OAK-checked rather than taken at face value.

    Not applied: suggestion 5 (DEVICE vs SURGERY on uterine artery embolization) — the reviewer itself marked it as no change required and DEVICE lands in the correct coarse PROCEDURE bucket. Suggestion 2 (MUSA criteria, JZ >12mm threshold) needs a reference that is not yet cached and is left for follow-up. Carried-forward items (infertility pathograph anchor via HOXA10/FOXO1, mappings block, malignancy/obstetric risk, experimental_models) remain in notes as deferred.

    Validation: schema pass, terms pass, 68/68 snippets verified (was 64/64).

  summary: Retarget the Protein hypoglycosylation node to GO:0009101
  details: |
    Changed one biological_processes binding on the Protein hypoglycosylation node: GO:0009100 glycoprotein metabolic process -> GO:0009101 glycoprotein biosynthetic process. Nothing else in the entry was touched.

    Why. The node's claim is hypoglycosylation - the cited result is hypoglycosylated LAMP2 in UGP2-knockout neural stem cells, rescued by wild-type or p.Met12Val long isoform. That is a failure of glycoprotein biosynthesis. GO:0009100 additionally spans glycoprotein catabolism, so it was broader than the claim; GO:0009101 is its biosynthetic child and is the most specific term that still represents the claim accurately, per the Ontology Term Contract.

    What was deliberately NOT done: the binding was not narrowed to GO:0006487 protein N-linked glycosylation or GO:0006493 protein O-linked glycosylation. The source says "hypoglycosylation of LAMP2" without resolving which branch, and UGP2's lesion is UDP-glucose supply, which feeds several glycosylation branches plus glycogen synthesis - branch-agnostic is the honest level, and is why this disease belongs to the Other Disorders of Multiple Glycosylation Pathways grouping rather than a branch-specific one.

    Context. This surfaced as a NOT_SATISFIED verdict for the entry against that grouping's NECESSARY criterion, which named only specific branches. Ontology closure runs downward, so an annotation at an ancestor of a named process never satisfies it. The criterion was the side that was wrong about the conceptual level and was corrected in the same change (see the grouping's own history record); this entry's edit stands on its own as a specificity improvement and would be correct even if the criterion had not moved.

    Term sourcing. GO:0009101 and its label were read from OLS, where it appears as an ancestor of both GO:0006487 and GO:0006493 - i.e. it is the common ancestor of the N- and O-linked classes. Worth recording for the next editor: GO:0006486, the identifier one would reach for as "protein glycosylation", does not exist in GO; an OLS lookup including obsolete entities returns nothing.

    Verification. linkml-validate against target-class Disease: no issues found. Term validation (run_term_validator.sh validate-data --labels): validation passed. GO:0009101 was already present in cache/go/terms.csv, so there is no cache diff. check-duplicate-keys, check-enum-values, check-entity-refs and check-causal-targets all clean on this file. The grouping evaluator now reports the entry SATISFIED against both its child and the umbrella grouping.

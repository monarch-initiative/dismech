  summary: Bind GO:0006011 on the reduced UDP-glucose synthesis node
  details: |
    Added a biological_processes descriptor (GO:0006011 UDP-alpha-D-glucose metabolic process, DECREASED) to the existing central-effector node 'Reduced UDP-glucose synthesis in neural-lineage cells', alongside its CHEBI:18066 chemical descriptor. No new claim: the node already asserted reduced UDP-glucose synthesis with the PMID:31820119 snippet 'KO NSCs showed a severely reduced ability to produce UDP-glucose'; the GO binding makes that claim machine-readable so the Other Disorders of Multiple Glycosylation Pathways grouping's nucleotide-sugar precursor-supply criterion (GO:0009225, evaluated over is_a/part_of closure) can audit this member. Motivated by the grouping audit reporting this entry as a contradiction against a criterion whose prose named precursor supply but whose logic did not encode it. Validated with just validate-disorders.

  details: |
    Addressed the CHANGES_REQUESTED review on PR 14888. (1) Regraded evidence_source from OTHER to HUMAN_CLINICAL for epidemiology, clinical, diagnostic and treatment-outcome quotes and to IN_VITRO for the UreI pH-gating quote (PMID:12471160), keeping quote_role REVIEW_SYNTHESIS; the PMID:24914320 mucus-colonization synthesis stays OTHER because it pools human and animal colonization work. (2) Split the three bundled nodes into Antral Gastrin-Driven Acid Hypersecretion -> Duodenal Ulceration, Corpus Gastritis-Induced Hypochlorhydria, Gastric Mucosal Atrophy -> Gastric Intestinal Metaplasia, and CagA E-cadherin Binding and Beta-Catenin Release; added Phosphorylated CagA SHP-2 Activation from PMID:17237808. Renamed Chronic Active Gastritis node to Chronic Gastric Mucosal Inflammation to avoid a case-only collision with the phenotype. (3) Wired all phenotypes with bare-name downstream edges and gave Epigastric pain evidence (PMID:15345211, INDIRECT). (4) Added therapeutic_agent bindings (NCIT PPI class, CHEBI vonoprazan, clarithromycin, amoxicillin, metronidazole, tetracycline, levofloxacin, bismuth subcitrate potassium). Suggestions taken: Gastric MALT lymphoma phenotype bound to HP:0045038 Gastric lymphoma (OLS hp searches for MALT lymphoma terms returned nothing); prevalence (worldwide ~50% from PMID:15758899; China 2023 36.3% from newly fetched PMID:42757050, which the research report had described as a global estimate but is China-only); progression phases. Skipped host genetics, diagnosis split, extragastric comorbidities and agent life cycle as needing new research. Validated with just validate, validate-terms, count-verified-snippets and the offline gates.

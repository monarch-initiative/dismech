  summary: Fix two ontology term bindings from PR review
  details: |
    Fourth-round review fixes on PR #7318.

    1. Treatment "Orthopaedic management of kyphoscoliosis and contractures": the
       binding NCIT:C16186 (Orthopedic Surgical Procedure) asserted surgery that
       neither the cited GeneReviews snippet ("standard management of kyphoscoliosis
       and contractures by orthopedics") nor the entry's own non-surgical description
       supports. Rebound to NCIT:C49236 (Therapeutic Procedure) - accurate though
       less specific. NCIT has no clean non-surgical orthopedic-intervention term
       (C16942 is the specialty, C157956 is orthopedic physical therapy, C52008 is
       stabilization), so the less specific but true term is preferred over a more
       specific but misleading one.

    2. Phenotype "Jejunal stenosis": rebound from the parent HP:0002244 (Abnormal
       small intestine morphology) to the exact child HP:0012848 (Small intestinal
       stenosis), defined "The narrowing or partial blockage of a portion of the
       small intestine" and a direct is_a child of HP:0002244. preferred_term kept
       as "Jejunal stenosis" per the documented pattern allowing a preferred_term
       more specific than the ontology label.

    Both CURIEs were already present in cache/hp/terms.csv and cache/ncit/terms.csv
    with matching canonical labels, so no cache rows were written.


  summary: Rebase onto main; correct two frequency bands and lengthen table-cell snippets
  details: |
    Rebase of PR #7318 onto current main, plus the three findings of the third automated review.

    Rebase. The branch was 964 commits behind main and CONFLICTING. It was rebased onto origin/main; the earlier "Merge main and resolve cache conflicts" commit was dropped by the rebase, leaving three linear commits. All conflicts were confined to generated cache CSVs - cache/chebi/terms.csv, cache/mondo/terms.csv, cache/ncit/terms.csv, cache/go/terms.csv and cache/enums/biologicalprocessterm_dd47231dca51.csv. No kb/, references_cache/ or research/ file conflicted.

    Cache-conflict resolution. A naive additive union of the two sides was attempted first and rejected: it resurrected malformed rows that live in this branch's OLD merge base and have since been repaired on main, namely "BI:24996" with a truncated prefix, "MONDO:0MONDO:0008661", "MONDO:MONDO:0018088" and a mis-split "e Present" row. just check-term-cache-integrity failed on that union, which is exactly the dismech#7682 hazard of re-committing a repaired row. The resolution taken instead treats main as authoritative: every cache file was reset to main's version, and the entry's own term rows were then re-derived from the YAML by just validate-terms, which is the only sanctioned writer of these files. No cache row was hand-written, retyped or string-concatenated. The net cache diff against main is 20 added rows across 8 files with zero deletions, all of them SMS-relevant: CHEBI spermine, spermidine, N-8-acetylspermidine and S-adenosylmethioninaminium; GO polyamine metabolic, spermine biosynthetic, polyamine catabolic, intracellular polyamine homeostasis and spermine synthase activity; hgnc:11123 SMS; and HP:0002244. The two hallucinated NCIT lookups the previous review flagged as retained, NCIT:C381 and NCIT:C1300, are no longer added by this branch and are absent from main.

    Review finding 1, frequency-band arithmetic. Abnormal retinal pigmentation and Recurrent respiratory infections were both banded VERY_RARE on the strength of the PMID:25888122 Table 1 rows reading "0/13". That reading dropped the table's two further columns for the report's own propositi II-1 and II-3, both of which are "+" on both rows, so the true count over every patient the table tabulates is 2/15 = 13.3%. Both were promoted to OCCASIONAL and both explanations were rewritten to show the corrected arithmetic and to say explicitly what the trailing "+" marks are. The sibling Nephrocalcinosis and Renal cyst bands were left alone: they rest on the GeneReviews qualitative "rare findings" mapping, not on this table.

    Review finding 2, snippet_length_baseline scope. The rebase dropped the branch's changes to tests/snippet_length_baseline.txt entirely, so the four unrelated DTYMK-Related_Neurodegeneration and PPP2R3C-Related_Gonadal_Dysgenesis_Syndrome rows this PR had silently absorbed are gone. The four sub-five-word table-cell snippets that were this PR's own were not re-baselined but fixed at source: each was lengthened to quote consecutive whole rows of Table 1 instead of a single truncated cell, which also makes the retinal and infection rows self-evidencing for the corrected 2/15 arithmetic. just check-snippet-length now reports "OK: no new snippets under 5 words".

    Review finding 3, stale history. The original CREATE record was left untouched, since history records are append-only and it accurately describes the session it was written for. Two records were scaffolded for the sessions that had none - the MAXO to NCIT remap and the first-round review-feedback additions - alongside this one.

    Validation. Schema validation PASS and term validation PASS on kb/disorders/Snyder-Robinson_Syndrome.yaml; 126/126 evidence snippets verified against cached references; just check-cache-order OK; just check-term-cache-integrity OK across 18 term cache files and 24 enum cache files; just check-duplicate-keys clean; just check-snippet-length OK. Final state: 8 pathophysiology nodes, 25 phenotypes, 126 evidence items across 23 references.

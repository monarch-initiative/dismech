  summary: 'Address first-round review feedback: add 4 phenotypes, seizure frequency,
    maternal mosaicism'
  details: |
    Documents the third curation session on this entry (commit "fix: Address review feedback on Snyder-Robinson Syndrome"), which had no history record of its own. It closes the five blocking findings of the first automated review of PR #7318.

    1. Retinal pigmentary change and recurrent respiratory infections were added as phenotypes, HP:0007703 Abnormal retinal pigmentation and HP:0002205 Recurrent respiratory infections, mined from the PMID:25888122 propositi sentence already quoted twice in the file for nephrocalcinosis and renal cysts.
    2. A frequency band was added to Seizure, derived from the PMID:25888122 Table 1 row "Seizures 8/15" rather than from the deep-research report's "up to 67%" figure. That figure was checked against PMID:34177437 and is genuinely absent from it, so it was rejected as unsourced rather than curated.
    3. HP:0002167 Abnormality of speech or vocalization was added as the primary speech phenotype, with the pre-existing HP:0001611 Hypernasal speech retained as the more specific sub-phenotype. HP:0000750 Delayed speech and language development was declined: GeneReviews contains no speech-delay statement, so the claim would have been unsourced.
    4. HP:0001371 Flexion contracture was added as a phenotype. It had previously appeared only inside a treatment name and description.
    5. Maternal mosaic transmission was captured in inheritance, cited to PMID:34667072, with the recurrence-risk counselling consequence spelled out.

    Also added in this session: two evidence items, taking the entry from 115 to 126 evidence items and from 21 to 25 phenotypes across 23 distinct references.

  summary: 'Create: Snyder-Robinson_Syndrome'
  details: |
    Created the Snyder-Robinson syndrome (SRS, MONDO:0010664, SMS/hgnc:11123, OMIM:309583) disorder entry from a Falcon deep-research report plus primary literature. NEC preflight passed: OAK confirmed MONDO:0010664 carries RO:0004003 HGNC:11123 (SMS), xref OMIM:309583, synonyms "Snyder-Robinson syndrome" and "MRXSSR", and is_a MONDO:0800159 (disorder of polyamine metabolism); the SRS acronym collision with Silver-Russell syndrome and the SRM/SMS spermidine-vs-spermine-synthase confusion were both excluded. The Falcon report contained only DOIs and no PMIDs, so every DOI was resolved to a PMID via NCBI ESearch and fetched with just fetch-reference; no cache file was hand-created.

    Content: 8 pathophysiology nodes forming a single connected pathograph from the SMS loss-of-function trigger through the elevated spermidine:spermine ratio to four effector arms (spermidine catabolic overflow generating ROS and reactive aldehydes; lysosomal and mitochondrial dysfunction; loss of polyamine-dependent inward-rectifier potassium channel modulation; and impaired osteoblastic bone matrix mineralisation leading to net bone loss and skeletal fragility). 19 phenotypes, plus biochemical, genetic, diagnosis, differential-diagnosis, treatment, animal-model and classifications sections. Classifications: Harrison's ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC, plus ICIMD polyamine_metabolism.

    The skeletal arm declares conforms_to against osteoporosis_bone_resorption at the "Impaired Osteoblastic Bone Formation" and "Net Bone Loss and Skeletal Fragility" nodes only, deliberately NOT at "Increased Osteoclastic Bone Resorption", because SRS bone histopathology shows depleted rather than increased osteoclasts and dynamic histomorphometry in the SMS G56S mouse attributes the low bone mass to a reduced bone formation rate.

    Verification: three hallucinated or obsolete ontology identifiers inherited from the deep-research draft were corrected. NCIT:C381 resolved to Clotrimazole rather than Eflornithine and NCIT:C1300 resolved to Dolastatin 10 rather than Phenylbutyrate, so both treatments were rebuilt as NCIT:C15986 Pharmacotherapy with CHEBI therapeutic_agent bindings (CHEBI:41948 eflornithine, CHEBI:41500 4-phenylbutyric acid). MAXO:0000004 is "surgical procedure" not "therapeutic procedure" and was replaced. The obsolete GO:0032917 and GO:0032918 polyamine/spermidine acetylation terms were dropped. One case-variant self-referential downstream edge that pointed at a biochemical name rather than a pathophysiology or phenotype node was removed.

    Validation: just validate passes schema and term validation. All 106 evidence snippets across 22 references were programmatically confirmed as exact whitespace-normalised substrings of their references_cache bodies, with 0 mismatches and 0 missing caches. Note that just validate-references reports "Total checks: 0" and validates nothing, so it was not relied upon. just compliance reports 99.6% global and 100.0% weighted compliance.

    Self-review: the entry was re-reviewed in fresh context with the dismech-pr-review skill, which returned REQUEST_CHANGES; all blocking and should-fix items were addressed. Fixes: CHEBI:16610 (spermidine) was replaced with the correct CHEBI:27911 (N(8)-acetylspermidine) on the plasma-biomarker record; the spermidine-ratio to mineralisation causal edge was re-evidenced with the CDAP spermine-synthase-inhibition sentence instead of a generic polyamine-supplementation sentence that did not support the specific edge; patient-derived cultured-cell evidence was retyped HUMAN_CLINICAL to IN_VITRO; three introduction/discussion background statements mis-typed IN_VITRO were retyped OTHER; the hedged "possibly ... intrinsic gateway" quotation was made PARTIAL in both places it appears; and the GeneReviews GENETIC COUNSELING section was mined for the 50% per-pregnancy transmission risk and the non-reproduction of affected males. Added: a histopathology record for the osteoblast and osteoclast depletion with absent trabecular meshwork (the evidence base for the deliberate non-conformance to the resorptive module node); two gastrointestinal phenotypes (jejunal stenosis, exocrine pancreatic insufficiency) at VERY_RARE with PARTIAL support from the single reported severe case; skeletal and renal surveillance treatments from GeneReviews; GO:0046849 bone remodeling on the net-bone-loss node to complete module conformance; GO:0005242 inward rectifier potassium channel activity on the ion-channel node; and a causal edge to Reduced bone mineral density, which previously had no incoming edge. Final state: 8 pathophysiology nodes, 21 phenotypes, 14 causal edges, 115 evidence items across 22 references, 0 snippet mismatches, 0 dangling targets, 0 orphan nodes, all nodes reachable from the trigger, 99.6% global and 100.0% weighted compliance.

  summary: Remap MAXO treatment terms to NCIT after MAXO removal
  details: |
    Documents the second curation session on this entry (commit "fix: Remap MAXO treatment terms to NCIT after MAXO removal (#7228)"), which had no history record of its own.

    MAXO was removed from dismech in #7228 while this PR was open, invalidating all six MAXO treatment_term bindings in the entry. Every one was remapped to its NCIT equivalent using the frozen crosswalk docs/superpowers/maxo_ncit_final_map.tsv rather than by hand-picking identifiers: NCIT:C15747 Supportive Care, NCIT:C64172 Anticonvulsant Therapy, NCIT:C15433 Nutritional Support, NCIT:C198585 Bisphosphonate Therapy, and NCIT:C124351 Clinical Evaluation (twice). No MAXO binding remains in the entry.

    therapeutic_modality was deliberately NOT backfilled in this pass. In particular NCIT:C15433 Nutritional Support was not blanket-tagged BEHAVIORAL, per the CLAUDE.md caution that the term names a specific chemical or vitamin compound far more often than a diet-pattern change; the calcium-supplementation treatment here is such a case.

    Validation at the time of that session: schema validation and term validation both passed, and 115/115 evidence snippets verified against cached references. Push scope was 3 files, +18/-12.

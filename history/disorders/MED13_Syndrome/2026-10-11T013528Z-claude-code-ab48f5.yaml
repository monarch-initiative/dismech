  summary: Add uncurated MED13 literature with explicit evidence grading
  details: |
    Literature sweep (PubMed title/abstract search for MED13, THRAP1, TRAP240, MRD61 and 17q23.2 deletions; Europe PMC full-text search for MED13 with neurodevelopmental terms and for the NM_005121 transcript; Europe PMC preprints) against the 39 PMIDs already cited. Added: three truncating variants from cohort tables (p.Ser1601Ter, maternally inherited, PMID:37543562; p.Tyr901Ter, PMID:42780563; p.Gly1793*, with a negative EpiSign screen that reflects the absence of a MED13 episignature, PMID:41957673); a single-case unilateral renal agenesis phenotype (VERY_RARE, unconnected to any mechanism node, PMID:42780563); exome-wide significance in 46,612 trios (PMID:36350923); a second structural study of MED13 IDR occlusion (PMID:38955181); a Drosophila neural-progenitor requirement (bioRxiv preprint, PMID:41959135); yeast Med13 loss-of-function and degron mapping (PMID:25057017, PMID:29212878); the 12-line MED13L fibroblast study (PMID:42698208); MED13L missense instability as indirect REFUTE evidence on the missense altered-function hypothesis (PMID:40500968); and mouse/fly metabolic-axis papers (PMID:26883362, PMID:24979807). New items carry directness, and explanations state the evidence level (human case, cohort statistics, model organism, in vitro, or paralog analogy). Considered and not added: PMID:38572415, PMID:33921431, PMID:38003033 and PMID:40731902 (MED13 variants classified VUS); PMID:41262629 (17q23.2 duplication of undetermined significance); PMID:35141295 (gene-burden candidate only); PMID:41272104 (the published version reports MED13L, not the MED13 named in its preprint); PMID:40019509 and PMID:32767738 (MED13L patients). PMID:41957673 was regenerated with fetch-reference to obtain its tables; validated with just validate-disorders.

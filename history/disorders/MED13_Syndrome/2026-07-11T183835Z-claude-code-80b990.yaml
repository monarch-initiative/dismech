  summary: In-depth claim-by-claim evidence review of MED13 Syndrome
  details: |
    Manual, claim-by-claim review of every evidence item in the MED13 Syndrome
    entry (no automated-only pass). Each snippet was read against the cached
    abstract/full text in references_cache/ and judged for semantic support of
    the claim it backs; schema, reference, and term validators were also run and
    all pass both before and after the edits below.

    NEC (named-entity-confusion) preflight: PASSED. MONDO:0032485 (intellectual
    developmental disorder 61) maps to gene MED13 (HGNC:22474), OMIM:618009, and
    synonym MRD61 via OAK. The entry consistently distinguishes MED13 from its
    paralog MED13L; MED13L-only literature (e.g. PMID:37512036) was correctly
    excluded.

    Snippet verification: all 30+ evidence snippets are exact substrings of their
    cached sources (reference validator green) and are semantically supported by
    the cited text. Foundational cohort (PMID:29740699, 13 individuals, 11 de novo),
    mechanistic context (PMID:33390853 review; PMID:29325037 mouse ZGA;
    PMID:41663567 cortical-neuron migration via PlxnA4; PMID:25422356 and
    PMID:40989238 cardiac metabolism/redundancy), and phenotype-expanding case
    reports (PMID:36087421 epilepsy; PMID:38745205 severe multi-anomaly infant;
    PMID:41561257 SNHL + supernumerary tooth; PMID:41195223 Chinese family +
    megacolon; PMID:33258286 Kabuki-like; PMID:38854223 ASD/uncertain variant) all
    check out.

    Fixes applied in this review:
    - Frequency corrections: Hydrocephalus, Aganglionic megacolon, and Dental
      anomalies (supernumerary tooth) were each supported by only a single case
      report yet marked OCCASIONAL (5-29%), contradicting their own "single
      case"/"previously unreported complication" descriptions. Downgraded all
      three to VERY_RARE (<5%) and tightened the description wording.
    - ASD evidence strengthened: added PMID:38528425 (pathogenic de novo
      truncating MED13 frameshift with ASD) as a SUPPORT item, so the association
      no longer rests mainly on the original cohort plus the uncertain-significance
      variant case (PMID:38854223, retained as PARTIAL). Updated description/notes.
    - Speech/language: added PMID:41465117 (2025 MED-related disorders review) to
      support the "language-dominant phenotype (MED13)" claim.

    Literature search (2023-2026, PubMed): the entry is already current through
    2026. Newly surfaced and assessed papers: PMID:38528425 and PMID:41465117
    (added, above); PMID:38453051 (incomplete penetrance across 11 NDD genes
    incl. MED13 - no MED13-specific quotable detail, noted as a follow-up);
    PMID:37512036 (MED13L, out of scope).

    Outstanding problems filed as GitHub issues (see needs_followup):
    1. Cardiac "developmental" pathophysiology node is supported by adult
       cardiac-energy-metabolism evidence (PMID:25422356, PMID:33390853) rather
       than by cardiac-developmental evidence; reframe or add developmental
       support (e.g. the A-to-I RNA-editing-in-cyanotic-CHD data in PMID:33390853
       full text, or PMID:40989238).
    2. Simons Searchlight dataset entry asserts unsourced participant counts
       (~15 MED13 individuals; >7,000 total) with no evidence item.
    3. Missing structural blocks: no prevalence: block and no classifications:
       block for an ultra-rare Mendelian NDD.
    4. Candidate new phenotype: focal cortical / tuber-like MRI abnormalities
       "mimicking tuberous sclerosis" (PMID:38528425) and incomplete penetrance
       (PMID:38453051) as a genetic-section nuance.

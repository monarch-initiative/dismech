  summary: 'Add brain MRI diagnosis note: usually normal or only mildly abnormal'
  details: |
    Added a diagnosis row for brain MRI stating that imaging in MED13 syndrome is usually normal or only mildly abnormal and is not diagnostic. Prompted by the 2025 MED-related disorders review (PMID:41465117), whose MED13 imaging statements were traced to the primary cohort (PMID:29740699): MRI normal or not performed in most of 13 patients, mild frontal atrophy in one, a small left occipital abnormality not concordant with seizures in another. The review is cited as REVIEW_SYNTHESIS supporting evidence only. The review's Table 6 lists 'Frontal atrophy; dysmorphic corpus callosum' as MED13 MRI findings; that framing was not adopted because it presents single-patient observations as characteristic. The infantile-spasms patient's corpus callosum finding (PMID:36087421) was checked against the article full text supplied by the user; it is described there in the body, not in the cached abstract, so it is not quoted here. Validated with just validate, count-verified-snippets (146/146), check-snippet-grading, check-entity-refs, check-folded-hyphens, check-snippet-length and check-reference-titles.

  summary: 'Expand: MED13 Syndrome mechanism graph, variants, diagnosis and differentials'
  details: |
    Expanded from an Anthropic-generated systematic-review pipeline output for MED13 that had been held out from this repository during its own generation. Added four mechanistic_hypotheses (haploinsufficiency CANONICAL; clustered-missense altered function EMERGING and explicitly contested by the ClinGen loss-of-function determination; Fbw7-degron stabilisation with its FBXW7 oncogenic-risk counterweight; miR-208a/MED13 metabolic axis), four pathophysiology nodes (CKM hinge anchoring, CKM occupancy with bidirectional control, MED13/MED13L paralog redundancy, stress-induced Med13 degradation with cyclin C release), six variants, an inheritance block recording incomplete penetrance, three diagnosis entries, six differential_diagnoses across the CDK8 kinase module plus Kabuki syndrome, three animal_models, and the ClinGen Definitive gene-disease validity external assertion. The ClinGen assertion id supplied by the pipeline was independently verified against data/clingen/gene_validity.csv before use. Pipeline snippets were not reused: all were verbatim spans of its review text, so every claim was re-derived against PubMed abstracts. Quantitative per-phenotype cohort fractions and gnomAD constraint figures from the pipeline were dropped because they are not present in any cited abstract and gnomAD is not a snippet-validated source here. Validated with linkml-validate, linkml-term-validator (--labels) and linkml-reference-validator, all passing.

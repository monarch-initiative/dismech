  details: |
    Curated de novo as a kb/disorders Disease entry (entry_type DISEASE; single causal gene KREMEN1, one Wnt-dysregulation / ectodermal-appendage pathograph). Deep research: the required falcon (Edison) provider was unavailable (403 auth failure environment-wide); --fallback routed to openscientist whose queue was backed up and stalled, so per coordinator steering the DR run was completed with the claude_code provider (research/Ectodermal_Dysplasia_13_Hair_Tooth_Type-deep-research-claude_code.md; reference_validation 2/2 verified, confabulation_rate 0.0). Evidence from five primary papers: Issa 2016 (PMID:27049303, original Palestinian families, p.F209S WSC-domain), Dinckan 2018 (PMID:28813618, Turkish families), Intarak 2018 (PMID:29526031, compound-het confirmation; abstract body not available so kept as a top-level reference only, not quoted), Lee 2022 (PMID:34028942, splice variant/NMD, biphasic Wnt biology, patient features), Rosen 2026 (PMID:40553753, functional study: reduced glycosylation, impaired KREMEN1-DKK1-LRP6 ternary complex, general Wnt deregulation). Pathograph: KREMEN1 LOF -> impaired ternary complex -> deregulated canonical Wnt -> disrupted ectodermal appendage morphogenesis -> oligodontia/sparse hair. No GeneReviews chapter (NO_CHAPTER, verified online with synonyms). No ORPHA xref. Validated: just validate, just validate-terms, just count-verified-snippets 20/20, just validate-disorders, check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-snippet-grading, check-delivery-system, check-gene-activity-grounding (against-ref origin/main, no new finding), preflight-dr (benign DKK1 ligand WARN, OMIM matched).

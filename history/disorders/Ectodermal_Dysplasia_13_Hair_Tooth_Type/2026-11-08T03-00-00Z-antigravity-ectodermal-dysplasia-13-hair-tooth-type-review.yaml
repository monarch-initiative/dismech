  summary: Enriched Ectodermal Dysplasia 13 Hair Tooth Type with Harrison's classifications, KREMEN1 Wnt/ectodermal appendage ontology groundings, causal link to dry skin, Oligodontia frequency/diagnostic annotation, and diagnostic details.
  details: >-
    Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE,
    DERMATOLOGY) backed by PMID:40553753, and updated KREMEN1 genetic
    association wording. Enriched all four pathophysiology nodes with plasma
    membrane cellular components, CL cell types (epithelial cell, fibroblast,
    keratinocyte), UBERON locations (calcareous tooth, hair follicle, skin
    epidermis), GO molecular functions and biological processes, and a
    downstream causal link to Dry skin (leaving Hyperpigmentation of the skin
    and Heat intolerance unconnected where no ectodermal gland/melanocyte
    mechanism is established). Annotated Oligodontia as VERY_FREQUENT and
    diagnostic with family-level counts across the four cited series, completed
    molecular genetic testing presence/results, and annotated prosthodontic
    treatment_effect.

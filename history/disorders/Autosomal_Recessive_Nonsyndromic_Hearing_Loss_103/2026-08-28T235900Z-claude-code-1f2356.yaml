  details: |
    Addressed the second CHANGES_REQUESTED review on PR #9923, which superseded an earlier approval on the same head commit. Added CL:0000589 cochlear inner hair cell to the stereocilia fusion node: PMID:40859056 states IHC bundle fusion occurs across all cochlear regions while OHC fusion is worst apically, so IHCs are the more extensively affected population and were missing. Added the sentence as its own evidence item. Added GO:0060121 vestibular receptor cell stereocilium organization alongside GO:0060088 rather than falling back to their shared parent GO:0060122, since the node models both arms and both have direct evidence. Rewrote the node description to name the two mouse lines separately - jitterbug fusion from P10, Clic5-null nothing at P14 and established by P17 - because the two time courses read as self-contradictory when merged, and the P14-to-P17 window used by the discussion and the AAV limitations is the null line's. Regraded two PMID:33114113 items from HUMAN_CLINICAL to OTHER: the quoted sentence is that paper's introductory summary of prior gene-function knowledge, and grading it clinical implied human podocyte data the renal knowledge gap says does not exist. Quoted the rate-carrying sentence on the Eveno-Bytantaysky prevalence record, which previously stored 313.9 per 100,000 supported only by a sentence about ethnic composition. Added a dedicated evidence item for the reciprocal MYO6 dependence, previously asserted in prose only. Retargeted the renal gap's second anchor from phenotypes#Vestibular Areflexia to disease#, since the question is whether the disease is nonsyndromic. Added a Bilateral Sensorineural Hearing Impairment phenotype at VERY_FREQUENT. Validated with just validate (64/68 snippets, 4 DOI-prefixed skipped and checked by hand), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys and the five baseline gates, all exit 0.

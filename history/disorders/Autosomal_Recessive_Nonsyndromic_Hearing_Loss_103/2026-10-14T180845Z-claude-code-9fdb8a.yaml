    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000 Hz per ear) to the existing Audiologic and vestibular assessment diagnosis row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not the vestibular evaluation also described in that row. No reference range is bound: the entry's own phenotype section documents progression from mild to severe or profound loss in one family, a moderate-to-profound range in a 22-patient cohort, and a highly variable mean annual threshold-change rate, so severity is neither static nor consistent across the reported families.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 103 (DFNB103, CLIC5)'
  details: |
    De novo curation of DFNB103 (MONDO:0014469, CLIC5 hgnc:13517) from the stub queue. entry_type decided as DISEASE: one causal gene, no MONDO descendants, one pathograph from biallelic CLIC5 loss through failure of the stereocilia taper membrane-actin tether to progressive fusion, hair cell degeneration and postlingual progressive hearing loss with vestibular involvement. Nothing in kb/ previously mentioned CLIC5.

    Mechanistic point of the entry: CLIC5 is a chloride intracellular channel family member that acts as a membrane-cytoskeletal adaptor at the base of the stereocilium rather than as an ion channel, in near 1:1 stoichiometry with radixin and in complex with taperin, PTPRQ and myosin VI. Losing a base-of-bundle tether gives a different phenotype from losing a tip protein, and the mouse shows it as progressive stereocilia fusion from P10 with partner mislocalisation preceding the fusion, which is the timing evidence that makes the complex disassembly upstream rather than consequent.

    The jitterbug mouse is curated in animal_models with modeled_mechanisms (not experimental_models), with two links (taper tethering, RECAPITULATES HIGH; stereocilia fusion, RECAPITULATES HIGH) and readouts for radixin staining and partner localisation. The 2025 AAV gene-replacement study is curated as a second animal model with a RESCUES link, and its limitations state plainly that treatment was given at P0 before the lesion begins between P14 and P17, so it demonstrates prevention rather than reversal. A HUMAN_MODEL_MISMATCH discussion carries that timing problem against a human disease detected at a mean age of about 8 years, and also records the unexplained divergence in that study between durable vestibular rescue and auditory thresholds that deteriorated despite robust transgene expression and unchanged hair cell morphology.

    A second KNOWLEDGE_GAP preserves the founding authors' hedge about mild renal dysfunction in one patient. Later descriptions call DFNB103 nonsyndromic without qualification; CLIC5 has an established role in glomerular podocyte maintenance, so the observation points at a mechanism rather than being a chance finding, and the Siberian founder cohort is now large enough to settle it.

    Evidence: 8 references cited, all fetched with just fetch-reference; 56/56 snippets verified against the local cache. One near-miss caught during curation and fixed: an initial evidence item for PMID:22889583 quoted a paraphrase of the paper title rather than a real substring; the reference validator caught it and it was replaced with a verified sentence from the abstract. Prevalence records the Siberian founder yield (9.9 percent of GJB2-negative patients) as CARRIER_FREQUENCY with a note that it is a diagnostic yield in an ascertained, GJB2-excluded series and does not generalise.

    Deep research: falcon report run and preflighted against MONDO:0014469, verdict PASS (CLIC5=36 mentions, next gene at 8). Entry curated from primary sources regardless.


  details: |
    Addressed the CHANGES_REQUESTED review on PR #9923. Extended the two snippets that truncated P17 to P1, inverting the lesion window the HUMAN_MODEL_MISMATCH discussion rests on, and deleted the explanations claiming the cache splits the day number - it does not. Replaced two further truncated snippets whose explanations also misdescribed the cache: the 47.4 Mb sentence carries a U+2009 thin space rather than a sentence break, and the Cys32Ter sentence is present in full. Removed rate_per_100000 9900.0 and prevalence_class from the Sakha diagnostic-yield record, which asserted that 9.9 percent of the Sakha population has DFNB103, and set measure_type to UNKNOWN because CARRIER_FREQUENCY is defined as the heterozygote rate. Fetched Pshennikova 2019 (DOI 10.25557/2073-7998.2019.10.36-48; the fetcher returned full text including an English abstract) and added two real POINT_PREVALENCE records - Yakutia-wide 2.7 per 100,000 and Eveno-Bytantaysky district 313.9 per 100,000. Regraded four evidence items citing PMID:40859056, a mouse AAV study, from HUMAN_CLINICAL to OTHER where the quoted sentence is its introduction restating human findings from papers it cites, and one PMID:24781754 item citing prior mouse work. Lowered the postlingual phenotype from VERY_FREQUENT to FREQUENT and cited the 19-of-26 denominator. Added a genetic note that c.1121G>A p.Trp374* and c.644G>A p.(Trp215*) are the same founder allele on different transcripts. Disambiguated the discussion attaches_to from animal_models#Mouse, which both mouse models matched by species. Added a three-phase progression section and an external_assertions record for OMIM:616042 - OMIM belongs there rather than in mappings, whose DiseaseMappings class has no OMIM slot. Confirmed by NCBI esearch that no CLIC5 or DFNB103 GeneReviews chapter exists. Validated with just validate, validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys and the baseline gates, all exit 0.

  details: |
    Round-two edit responding to the ai4c-reviewer CHANGES_REQUESTED review on PR #8850. All three blocking items addressed; four of five non-blocking suggestions taken; one declined with reasoning.

    Blocking item 1 - delayed/hypomyelination missing from phenotypes. Added a Delayed Myelination phenotype bound to HP:0012448 with frequency FREQUENT, derived from a single clean cohort count (4/10 in PMID:30755616 = 40%, inside 30-79% and away from either boundary). This is the same standard already applied to epileptic encephalopathy, and the notes say so explicitly to distinguish it from microcephaly and seizure, where the numbers straddle a band boundary and no frequency is asserted.

    Blocking item 2 - histopathology section absent. Added two HistopathologyFinding entries from the single Friedman autopsy (GB31-II-6): the microscopic pattern (intense white-matter gliosis, minimal myelination, PRESERVED axonal density, sudanophilic histiocytes) and the gross description (simplified gyral pattern, reduced white matter volume, thin corpus callosum, explicit absence of cavitation or necrosis). Both are marked diagnostic: false and carry an n=1 caveat.

    The reviewer asked for these to be linked into the causal graph with downstream edges. HistopathologyFinding has no downstream slot, so that is not possible on the histopathology entries themselves. Instead the mechanism was added to the pathograph properly: a new pathophysiology node, White Matter Hypomyelination with Preserved Axons (TISSUE scale, mechanism_confidence PROVISIONAL), sits downstream of Impaired Brain Growth with Neural Cell Loss and upstream of Progressive Postnatal Loss of Cerebral Volume. That is the substantive point the reviewer was making - preserved axons with deficient myelin is a myelination failure, not the residue of axonal degeneration - and it now lives in the graph rather than only in a findings list.

    Blocking item 3 - cardiac involvement. Added two phenotypes. Cardiac Involvement is bound to the broad HP:0001627 (Abnormal heart morphology) with frequency OCCASIONAL from 2/13 (15%), deliberately NOT bound to a specific defect because the 2026 series reports a heterogeneous mix (pericardial effusion, thrombus, mass lesion, PDA, ASD, VSD) within those two individuals and binding to any one would assert a specificity the source does not support. Ventricular Septal Defect is curated separately at HP:0001629 because it is the one lesion two independent cohorts report, and Friedman's "clinically insignificant" qualifier is preserved.

    Suggestion 6 taken - oligodendrocyte CL:0000128 annotated on the new white-matter node, which is what takes that arm to cell-type granularity.

    Suggestion 5 taken - added a biochemical entry, Valyl-tRNA Aminoacylation Activity, with presence DECREASED and two BiomarkerReadout links (READOUT_OF, direction NEGATIVE) to Deficient Valylation of tRNA-Val and Reduced Specific Activity of Assembled ValRS. This captures the three numbers that are the only direct quantitative support the threshold model has in this disease: ~20% residual activity in patients (fivefold reduction), 60-80% in obligate carriers who are unaffected, and 75-110% for LARS/RARS in the same lysates, which is what makes the deficit ValRS-specific. No reference_ranges block is asserted - four individuals in one cohort establishes direction and magnitude, not a reference interval.

    Suggestion 8 taken - added Autism (HP:0000717) and Sleep Disturbance (HP:0002360), both explicitly scoped in their descriptions to the two mildly affected siblings of family 7, with the note that an autism assessment is not meaningful in the severe presentation where speech is absent and delay profound.

    Suggestion 4 declined - recurrent vomiting. Confirmed the reviewer's diagnosis: in PMID_30755602 the finding survives only inside a mangled phenotype-table blob, and no clean prose sentence reporting vomiting was found in any other cached cohort paper. Per the evidence SOP the choice is a fabricated or stitched-together quote versus omission, so it is omitted.

    Suggestion 7 declined with reasoning - the integrated stress response. This was a deliberate exclusion in round one and remains so. The ISR has no VARS1-specific evidence of any kind: no eIF2-alpha phosphorylation, ATF4 induction or charged-tRNA measurement has been published in VARS1 patient material or in the zebrafish model. A pathophysiology node asserts a step in THIS disease's mechanism, and HYPOTHETICAL confidence marks how firmly a step is established, not whether the disease has been studied at all. The ISR is already recorded in the ndmsca-no-neural-measurement KNOWLEDGE_GAP with its cited rationale (PMID:39702998, quoted with the source's own "can be dysregulated" hedge) and a proposed iPSC cortical organoid experiment that would measure it. Recorded on the PR rather than silently ignored.

    One term binding intentionally left unbound: the gross-neuropathology histopathology finding. NCIT:C117277 Demyelination fails twice - it is not reachable from the Histopathology Result branch backing the HistopathologyFindingTerm enum, and it is semantically wrong, since demyelination means loss of myelin previously formed whereas this pattern is failure to form myelin with axons intact. NCIT has no term for hypomyelination-with-preserved-axons. Per the repository rule that no term beats a bad one, the entry carries the claim in its description. The microscopic finding IS bound, to NCIT:C26783 Gliosis, which validates.

    Validation after the edit: just validate and just validate-disorders both pass - schema clean, term validation passed, 96/96 snippets verified against cached references (up from 81/81). just check-duplicate-keys OK, just check-title-snippets OK. Internal foreign keys re-checked programmatically: every downstream, target_mechanisms, modeled_mechanisms and biochemical readout target resolves to a real node. Compliance 88.5 percent global / 88.8 percent weighted. No new references were fetched - every snippet added in this round came from files already in references_cache.

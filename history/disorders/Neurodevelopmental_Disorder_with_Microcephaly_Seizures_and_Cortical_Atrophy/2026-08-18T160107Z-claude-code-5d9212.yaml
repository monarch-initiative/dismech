  details: |
    De-novo creation of the NDMSCA entry (MONDO:0060621, OMIM 617802, VARS1 / HGNC:12651).

    Entity verification before writing: `runoak -i sqlite:obo:mondo info MONDO:0060621 -O obo` (gene RO:0004003 HGNC:12651 VARS1, xref OMIM:617802) and `runoak ... relationships --direction down -p RO:0004003 HGNC:12651` (exactly one disease, so MONDO does not split the VARS1 phenotype). Duplicate preflight covered origin/main kb/disorders, all-state PRs and all-state issues: no existing entry, PR or issue.

    Named Entity Confusion was the main risk and is documented in the entry notes. Three traps were checked explicitly: VARS2 (mitochondrial paralogue, different disease); MONDO:0060577 NEDMAS, a near-identically named neighbour caused by SARS1 and already curated here as SARS1-Related_Neurodevelopmental_Disorder; and the unrelated "Visual Aura Rating Scale (VARS)" paper that a naive literature search returns.

    Deep research: falcon was attempted first as the repository default and FAILED with HTTP 402 Payment Required from the Edison API (account has no credit), so no falcon report exists. Two other providers were run instead and both reports are committed: claude_code (7 references, 7 resolved, 0 unresolved, confabulation_rate 0.0) and openscientist (17 references, 17 resolved, 0 unresolved, confabulation_rate 0.0). Neither report's frontmatter set needs_review. `just preflight-dr` was run against MONDO:0060621 for both reports: claude_code PASS (VARS1=51 mentions, top rival ASNS=5), openscientist PASS (VARS1=30, top rival DARS2=4). The openscientist report contributed the two ARS therapy references (PMID:39702998, PMID:41075682); every other reference was located independently through PubMed E-utilities. One DR error was caught and not propagated: the claude_code report misattributes PMID:29691655 to "Musante L / Bogershausen N" when the authors are Stephen J et al.

    GeneReviews: no chapter exists. Three PubMed searches (VARS1 GeneReviews, valyl-tRNA synthetase GeneReviews, NDMSCA GeneReviews) returned zero records on 2026-08-18; this is recorded in the entry notes because it means there is no expert-curated phenotype baseline to cross-reference against.

    Content. Nine-node pathophysiology chain from biallelic VARS1 alleles through two distinct published routes (loss of enzyme abundance via nonsense-mediated decay, per Stephen et al.; loss of specific activity with intact protein, per Friedman et al.) converging on deficient valylation of tRNA-Val, then the translational-threshold step, impaired brain growth, and the three clinical arms (progressive volume loss, cortical network hyperexcitability, global neurodevelopmental impairment). 17 phenotypes, a VARS1 genetic block with the published allelic series, 4 treatments, 2 diagnosis entries, 4 differential diagnoses (SARS1/NEDMAS first), the vars knockout zebrafish with two PARTIALLY_RECAPITULATES modeled_mechanisms links, and 4 discussions.

    Two curation judgements worth flagging. First, the disease name overstates the entity: the 2026 series (PMID:41672381) states that progressive cortical atrophy, though considered a hallmark, was absent in several cases, and Okur et al. (PMID:30275004) report biallelic VARS1 disease with neither seizures nor atrophy. Both the atrophy and seizure nodes are therefore curated as frequent-but-not-obligatory, and the KNOWLEDGE_GAP discussion ndmsca-atrophy-not-obligate records the unresolved severity-dependent versus age-dependent reading. Second, frequency bands were deliberately omitted for microcephaly, seizure and cortical atrophy: the available numbers straddle FrequencyEnum boundaries or are quoted across several ARS genes at once. FREQUENT is asserted only for epileptic encephalopathy, where PMID:40044141 gives a VARS1-specific 50 percent.

    Case counts are deliberately not summed; the cohorts share recurrent alleles and the 2026 series is internally inconsistent about its own denominator and carries a corrigendum (PMID:41820113) with no retrievable content. The corrigendum is listed under references but is not cited as evidence anywhere, since there is nothing quotable in it.

    The integrated stress response is deliberately NOT curated as a pathophysiology node: it is the obvious candidate mediator and the rationale for ISR-inhibitor therapy across the ARS class, but it has never been demonstrated in VARS1 disease. It is recorded in the ndmsca-no-neural-measurement gap instead.

    Validation. `just validate` and `just validate-disorders` (the batched sweep CI runs) both pass: schema clean, term validation passed, 81/81 snippets verified against cached references. `just check-duplicate-keys` OK. `just check-title-snippets` OK, no new title-quoting snippets. Compliance 88.3 percent global / 88.7 percent weighted. `uv run pytest tests/test_data.py` passes for this file; the one suite failure, bare-URL references in Travelers_Diarrhea.yaml, is pre-existing on main (last touched by PR #8789) and unrelated to this work.

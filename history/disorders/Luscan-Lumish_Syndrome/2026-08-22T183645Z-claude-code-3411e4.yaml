  summary: 'Create: Luscan-Lumish syndrome (SETD2, MONDO:0014791)'
  details: |
    Curated de novo while reviewing Mendelian intellectual disability coverage; absent from kb/disorders and open in stubs/ (now deleted). Luscan-Lumish syndrome is the writer-class conformer of the new epigenetic_machinery_neurodevelopmental_dysregulation module, complementing the eraser-class Beck-Fahrner entry curated in the same pass. Four-node chain, all four declaring conforms_to: SETD2 haploinsufficiency -> deficient H3K36 trimethylation -> dysregulated developmental gene expression -> overgrowth and neurodevelopmental phenotype. The central curation decision is the SETD2 allelic series: one gene produces three nosologically distinct entities - LLS from loss of function (overgrowth, macrocephaly), Rabin-Pappas syndrome from de novo p.Arg1740Trp (microcephaly and growth failure, the opposite direction), and MRD70 from p.Arg1740Gln at the same residue. These are recorded as a KNOWLEDGE_GAP discussion rather than as has_subtypes, because the source describes them as separate entities with their own OMIM numbers and a probably different (gain-of-function) mechanism, not as severity grades; if curated later they should be separate entries. The practical consequence is stated in the entry: a SETD2 variant is not by itself an LLS diagnosis. Overgrowth is curated as characteristic but not obligate, since loss-of-function cases without overgrowth are reported. PMID:28202515 is cited only for the Setd2-to-H3K36me3 enzyme-mark link, with an explicit note that its lung-adenocarcinoma tumour-suppressor context is a somatic-cancer mechanism outside this chain. Prevalence omitted: incidence reported as unclear. Validation: linkml-validate clean; linkml-term-validator passed; 21 of 21 snippets verified against cached references - two snippets were rewritten after the audit flagged them, one where a bracketed [MIM #616831] span is stripped before matching and one that had been truncated mid-word at the end of the cached abstract.

  details: |
    Adversarial evidence-claim review of the entry created earlier in this branch. Snippet verification only proves a quote exists in the cited abstract; this pass checked whether each quote supports the claim its explanation makes. Three repairs. (1) The central_effector node cited a snippet defining overgrowth conditions as a class - a quote containing no reference to transcription or gene expression, supporting a transcriptional-dysregulation node. Replaced with a real mechanistic statement that H3K36me3 marks actively transcribed gene bodies and that its loss disrupts transcriptional elongation among other chromatin-dependent processes, tagged evidence_source OTHER with the explanation stating plainly that it is a background statement in the cited paper's introduction rather than that paper's own result. (2) The genetic evidence snippet was truncated mid-sentence at 'the total 51 SETD2'; extended to the full sentence, which additionally states the authors' loss-of-function conclusion and so strengthens the claim it was cited for. (3) The obesity phenotype explanation referenced an obesity-prevention recommendation from a different paper than the one cited; trimmed to what the cited snippet supports. Also tightened the trigger node's first evidence explanation to say explicitly that the quoted sentence is about NSD1 and EZH2, does not mention SETD2, and is cited as writer-class context only, with the SETD2 loss-of-function claim resting on the following item. All 21 snippets re-verified after the edits.

  summary: Dedent over-indented paragraphs in the description folded scalar
  details: |
    Formatting-only fix raised as a non-blocking suggestion in the PR #9378 re-review. Three paragraphs added earlier in this branch were inserted at four-space indent inside a 'description: >' folded scalar whose body sits at two spaces. In YAML a more-indented line inside a folded scalar is treated as a literal block, so those paragraphs kept their hard line breaks and would have rendered with different wrapping from the surrounding prose. The file validated either way, which is why it was not caught by any gate. All 21 affected lines dedented to the block's base indent; the description now folds to five single-line paragraphs, verified by parsing the file and checking that no paragraph retains an internal newline. No content changed. A detector for this shape was run over every folded scalar in the file and reports no remaining over-indented blocks. Validation: linkml-validate clean, 34 of 34 snippets still verified.

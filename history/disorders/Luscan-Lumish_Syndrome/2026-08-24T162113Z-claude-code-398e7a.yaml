  summary: Add deep-research artifact; curate the chromatin-independent alpha-tubulin
    arm it surfaced
  details: |
    Ran an OpenScientist deep-research pass in response to review finding 1 on PR #9378, which noted that no DR artifact existed for this entry and that it was the thinnest of the three new entries. The report and its citations sidecar and artifacts are committed under research/. Provenance checks before use, per the DR discipline in CLAUDE.md: the report's own reference validation reports 22 of 22 references resolved, 17 of 17 quoted claims found in source, 0 off topic, and a 0.0 confabulation rate; just preflight-dr against MONDO:0014791 returns PASS with SETD2 dominating gene mentions at 62 and the report OMIM matching the MONDO xref at 616831; just qc-deep-research scores the report with 0 missing references. The NEC check mattered here because the template ran with an empty mondo_id and because SETD2 carries a known three-entity confusion risk.

    The report earned its keep by surfacing a mechanism arm the entry entirely lacked and that GeneReviews does not cover: SETD2 is a dual-function methyltransferase that also methylates alpha-tubulin at lysine 40, and that cytoskeletal arm is required for neuronal polarization and migration independently of chromatin. Two new pathophysiology nodes curate it - Deficient Alpha-Tubulin K40 Trimethylation and Impaired Neuronal Polarization and Migration - branching from the trigger and rejoining at the clinical consequence. Both are deliberately NOT wired to the epigenetic machinery module, and the node description says so explicitly: this is a cytoskeletal rather than a chromatin mechanism, and conforming it would misattribute part of the neurodevelopmental phenotype to the chromatinopathy chain. The decisive evidence is the rescue experiment - migration defects are restored by a cytoplasm-localised SETD2 truncation or by a tubulin-mark mimic, which places the defect outside the nucleus.

    Also strengthened the allelic-series discussion with the primary genotype-defined cohort (PMID:32710489: 15 individuals with de novo codon-1740 variants, 12 p.Arg1740Trp and 3 p.Arg1740Gln) rather than resting on a review assertion, and replaced the blanket prevalence omission with the reported scale of roughly 50 published patients. Every claim taken from the report was re-verified against the primary papers before curation. Validation: linkml-validate clean, term validator clean, 34 of 34 snippets verified, pathograph structural audit clean at 6 nodes.

  summary: 'Review follow-up: cohort literature, mitochondrial arm, MAXO to NCIT repair'
  details: |
    Addresses the CHANGES_REQUESTED review on PR #7338 and repairs a break introduced by main. (1) Branch refreshed from main via the GitHub update-branch flow; main had meanwhile removed MAXO (#7228), invalidating this entry's MAXO:0000106 treatment term. Remapped to NCIT:C15433 Nutritional Support per the frozen crosswalk docs/superpowers/maxo_ncit_final_map.tsv. (2) Incorporated PMID:24173411 (van de Ven 2014, the only HPII cohort, n=4 from a 20,991-sample screen): added REFUTE counter-evidence to the pyridoxine treatment (clinical course independent of B6 concentration and B6 therapy), intellectual disability, behavioral, anxiety and hallucination phenotypes, and a PROVISIONAL Mitochondrial Dysfunction pathophysiology node. (3) An independent PubMed sweep (documented in research/Hyperprolinemia_Type_2-deep-research-claude-code.md) surfaced two papers the review did not flag: PMID:21168532 (Drosophila P5CDh-null model with swollen mitochondria, MODEL_ORGANISM cross-species corroboration of the mitochondrial arm) and PMID:41602883 (2025 HPII case presenting with global developmental delay and ASD; the ALDH4A1 variant is of uncertain significance, so curated PARTIAL). (4) Added a HYPOTHETICAL Neurodevelopmental and Behavioral Impairment node reached by a causal_link_type UNKNOWN edge, quoting the literature's own statement that the causal relation between the metabolic abnormalities and the clinical features is frequently debated. (5) The orphaned Lactic acidosis phenotype now attaches via reports_on READOUT_OF to the mitochondrial node, with the inferential nature of that link stated in notes. (6) Added a diagnosis section (plasma proline with urinary P5C criteria; the P5C-adduct biomarker assay). (7) Cached ORPHA:79101 (the record carries no HPO table, so no frequency bands are derivable from it). (8) Fixed the preferred_term duplication of an upstream HPO label typo. No frequency bands were added anywhere: all clinical data remain case reports plus one n=4 cohort. Validation: schema, term, and 76/76 reference snippets verified; grouping/foreign-key/history tests pass.

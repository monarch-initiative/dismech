  summary: 'Create: Hyperprolinemia Type 2 (ALDH4A1, MONDO:0009401)'
  details: |
    New Disease entry curated for IEMbase metabolic work package WP-003 row 1.7.06.01 (ALDH4A1-related pyrroline-5-carboxylate dehydrogenase deficiency). NEC preflight performed before curation: MONDO:0009401 resolves to RO:0004003 HGNC:406 (ALDH4A1) with OMIM xref 239510, matching the seed row gene and OMIM exactly. Pathograph debundled into five nodes: ALDH4A1 P5C dehydrogenase deficiency (trigger) -> P5C and proline accumulation -> P5C-mediated Claisen condensation inactivating pyridoxal 5-phosphate (central effector) -> secondary vitamin B6 deficiency -> seizures and metabolic encephalopathy, the last conforming to epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis. Pyridoxine supplementation is linked back to the vitamin B6 deficiency node via target_mechanisms (RESTORES). Two KNOWLEDGE_GAP discussions record that the PLP-to-seizure link is inferred rather than measured in patients, and that penetrance and stress-unmasking are untested. Frequency bands deliberately omitted throughout (no cohort data). Nine PMIDs fetched with just fetch-reference; validation: schema PASS, term validation PASS, reference validation 44/44 snippets verified.

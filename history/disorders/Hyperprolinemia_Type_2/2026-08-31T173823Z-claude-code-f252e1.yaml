  details: |
    Response to the blocking item in the ai4c-reviewer review of PR 10234. The reviewer is right and the finding is a real gap in my detector, not just in the prose. My fingerprint tested whether a snippet was EXACTLY one wrapped line of the cached file, which caught 43 whole-line fragments but was blind to fragments that are a PORTION of one line. Those are the same defect and there were 30 more of them in this entry, including two that the PR body's own table listed as examples of work already done: 'Mutation of Ser352 to Leu is shown to' was still cut before 'abolish catalytic activity and eliminate NAD(+) binding', which the explanation already asserts, and 'Each type is caused by an autosomal recessive inborn error of' was still cut before 'the proline metabolic pathway'. Worse, 'The accumulating P5C spontaneously reacts' sat cut in one block while the same sentence had been repaired in full in another block of this same file. The test is replaced with the stricter one it should have been: every snippet must both start and end at a sentence boundary of its cached reference. Thirty snippets are extended to their enclosing sentence, each verified as an exact substring of the same cache before writing. Twelve remaining flags were checked by hand and are detector artefacts rather than defects: the snippet is already a whole sentence and the naive sentence splitter only joins it to the cache file's markdown header or to the ORPHA cross-references table. One item could not be quoted whole because the sentence contains a bracketed span, '[A7fs(-1) and G521fs(+1)]', which the reference validator strips from the snippet but not from the cached text, so the full sentence fails to match; it uses the sanctioned discontinuous-quote form with an ellipsis across the bracket instead. No supports, directness, reference, evidence_source or ontology term changed in this pass. Validated with just validate-disorders over both entries (97/97 snippets verified), check-duplicate-keys, check-folded-hyphens, and check-snippet-length and check-title-snippets grandfathered against origin/main.

  summary: 'Create: Brain_Malformation_Renal_Syndrome'
  details: |
    New entry for EXOC3L2-related brain malformation renal syndrome (MONDO:0975799, OMIM 620943). Sources: founding report of two families (PMID:30327448, abstract only), a Czech fetal exome family with a homozygous exon 3-5 deletion (PMID:34974531), the ciliopathy cohort listing EXOC3L2 as a candidate (PMID:27894351), endothelial cell work (PMID:21566143) and the Exoc3l2 knockout mouse (PMID:36362885). Mechanism nodes below the gene are PROVISIONAL or HYPOTHETICAL because the route from EXOC3L2 loss to the hindbrain and kidney malformations is not established; a KNOWLEDGE_GAP discussion records the ciliary versus endothelial question. No GO molecular function is bound because EXOC3L2 has none beyond protein binding (QuickGO); the gene is grandfathered in the activity-grounding baseline. No GeneReviews chapter, Orphanet record or ClinGen assertion exists. Treatment is limited to genetic counseling; no therapy or management report exists. Validated with just validate, count-verified-snippets (40/40), validate-terms and the offline gates.

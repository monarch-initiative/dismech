  summary: 'Create: Hereditary_Spastic_Paraplegia_3A (SPG3A, ATL1)'
  details: |
    Created a dedicated Disease entry for hereditary spastic paraplegia 3A (MONDO:0008437, ATL1 / atlastin-1), claimed in issue #11762 via the claim-disease skill. Lump/split: the umbrella Hereditary_Spastic_Paraplegia entry already carried SPG3A as a has_subtypes row plus one ER-shaping node; SPG7, SPG11, SPG44, SPG46, SPG48 and SPG49 have dedicated entries, and the allelic HSN1D entry was split the same way (#10545), so SPG3A was promoted to its own entry. The umbrella's SPG3A row was kept (as for SPG7/SPG11) because the umbrella's own phenotype rows reference `subtype: SPG3A`; removing it would break that file's foreign keys. The stub stubs/Hereditary_Spastic_Paraplegia_3A.yaml was deleted.

    Content: an eleven-node pathograph conforming to corticospinal_tract_axonopathy at five nodes (trigger, transport, degeneration, disinhibition, spasticity) and to peripheral_axonal_degeneration at its axonal-degeneration node for the complicated form; SPG3A-specific BMP-receptor-trafficking, astrocyte lipid-droplet/cholesterol and presynaptic nodes; three mechanistic hypothesis groups (canonical ER-fusion deficit, alternative fusion-independent variant effects, emerging glial cholesterol supply) wired onto edges via hypothesis_groups; a REFUTE evidence item on the trigger node for the most frequent allele (R239C) retaining wild-type fusion activity, and a CONTROVERSY discussion (dominant-negative vs loss-of-function) with a discriminating proposed experiment. Three has_subtypes (Pure, Complicated with axonal neuropathy, Severe very-early-onset complex from the de novo mutational cluster or biallelic variants); AD and rare AR inheritance blocks; 20 phenotypes (subtype-scoped where appropriate); five variants; a derived-share prevalence record with no rate; GeneReviews-based diagnosis and treatment blocks including the dantrolene warning; four animal models (Atl1 K80A KI/Reep1 KO mouse, Drosophila null/knock-in/RNAi, zebrafish atl1 morphant, C. elegans atln-1) and four human stem-cell systems, all linked via modeled_mechanisms with relationship, fidelity, model_scale, limitations, typed divergences and readouts; KNOWLEDGE_GAP, HUMAN_MODEL_MISMATCH and OPEN_QUESTION discussions.

    Research: `just research-disorder falcon Hereditary_Spastic_Paraplegia_3A` (Edison, 11.5 min, 61 citations; reference validation 15/15 resolved, 0 off-topic; term validation 46/46 resolved, the only label flag being the template's "(if available)" placeholder on the MONDO ID). The report was thinner on primary literature than a direct PubMed E-utilities sweep, so most citations come from that sweep (58 PMIDs cited); the report's own extra sources (Khan 2014 recessive family, Kadnikova 2019 Russian cohort, Crosby 2021 human atlastin reconstitution, Bellofatto 2019 management review, Hamamie-Chaar 2024) were converted DOI->PMID and cited by PMID. The report's Russian-journal cohort (Rudenskaya 2020, no PubMed record) was not cited. Two HPO suggestions in the report were wrong (HP:0001278 is orthostatic hypotension, HP:0002066 gait ataxia) and were not adopted; every CURIE in the entry was read from cache/*/terms.csv. No SPG3A-specific GEO dataset exists (just discover-datasets and a GEO DataSets search returned only other SPG genes and adult-T-cell-leukaemia false positives on "ATL"), so no datasets block.

    Validation: `just validate-disorders` passed (schema, batched terms, 196/196 snippets against cache); just check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms OK; whole-KB check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence OK with nothing new; targeted tests/test_data.py selection (subtype foreign keys, entity refs, readouts, recapitulation, divergences, hypotheses, unique names) 3203 passed. Compliance 92% before the review round.

    Review: a fresh-context red-team review (dismech-pr-review skill) before the PR found eight must-fix items, all taken: an overstatement of Ulengin 2015 in the description, a shared-mechanism claim in the HSN1D differential that the entry itself refutes, an uncited 8-10% figure (now cited to PMID:31594988), two review-sourced items graded HUMAN_CLINICAL (now OTHER), unsupported VERY_FREQUENT on hyperreflexia/Babinski (dropped), a wrong denominator for the 17% neuropathy figure, and missing imaging content (added an MRI diagnosis entry and a white-matter phenotype). Optional items taken: CL:0008039 lower motor neuron, zebrafish and mouse links downgraded to PARTIALLY_RECAPITULATES with a PROXY_QUANTITY divergence, GO:0007029 moved to the trigger node and GO:1990535/CL:0000100 added to the module-conforming nodes, DeLuca 2004 post-mortem neuropathology (INDIRECT) on the degeneration node, GW3965 and acetyl-tubulin readouts, dysphagia/dysarthria phenotypes, and the penetrance hotspot paper PMID:23483706. Not taken: orthopaedic surgery treatment and oxybutynin agent (no quotable SPG-relevant sentence in the cached sources), splitting the transport/growth node.

    Also folded in from the automated comment on #11762: Cadoria 2026 (PMID:42419637, mutation-specific fly models: pure-variant lipid lesion responsive to an LXR agonist vs complex-variant ER disruption) and Gao 2013 (PMID:23999326, in vivo mouse cortex, R217Q fails to support dendritic growth).

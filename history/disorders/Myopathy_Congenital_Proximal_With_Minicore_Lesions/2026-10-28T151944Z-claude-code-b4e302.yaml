  summary: 'Review round 1: calf hypertrophy term, phenotype wiring, CK and infections'
  details: |
    Changes in response to the first automated review of PR 15819.

    1. Calf enlargement rebound from HP:0003707 Calf muscle pseudohypertrophy to HP:0008981 Calf muscle hypertrophy, and the phenotype renamed. PMID:35393337 says only calf hypertrophy and neither paper shows fat or connective-tissue replacement in the calf.
    2. Seven INDIRECT_UNKNOWN_INTERMEDIATES edges added from Myofiber Atrophy and Type 1 Fiber Predominance to delayed gross motor development, Gowers sign, foot dorsiflexor weakness, scapular winging, respiratory insufficiency, obstructive sleep apnea and scoliosis. Joint hypermobility, joint contracture and spinal rigidity are left unwired because no source links them to a mechanism node. Connectivity went from 10/21 to 18/22.
    3. Added recurrent respiratory infections (HP:0002205), quoting the fatal infection in patient CIII:1, as a sequela of respiratory insufficiency.
    4. Added a serum creatine kinase diagnosis row (NCIT:C64489) recording the normal CK in all eight patients.

    Not changed: Delayed gross motor development (HP:0002194) was kept rather than narrowed to HP:0031936 Delayed ability to walk, because the cited sentence says delayed gross motor milestones and the patients also sat late (one at 1 year 9 months). A restrictive ventilatory defect (HP:0002091) was not added, because the source reports only an FVC of 12% and never uses the word restrictive.

    Validation after the edits: just validate, validate-terms, count-verified-snippets 57/57, check-entity-refs, check-causal-targets, check-duplicate-keys, check-folded-hyphens, check-snippet-grading, check-coarse-phenotypes and validate-disorders all pass.

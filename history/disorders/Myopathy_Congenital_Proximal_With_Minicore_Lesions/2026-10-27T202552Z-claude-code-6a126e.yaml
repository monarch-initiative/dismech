  summary: 'Create: Myopathy Congenital Proximal With Minicore Lesions (FXR1, CMYO9B)'
  details: |
    New entry for MONDO:0032937 (OMIM 618823, CMYO9B), caused by homozygous 5' FXR1 exon-15 frameshifts. Lump/split: kept as its own DISEASE entry rather than a subtype of Multiminicore_Disease, because MONDO places it directly under congenital myopathy with its own OMIM number and causal gene; the existing Multiminicore_Disease entry (RYR1/SELENON) and the allelic lethal disorder CMYO9A (MONDO:0032936, no entry yet) are recorded as differential diagnoses. The stub's entry_type was set to DISEASE and the stub deleted.

    Deep research: falcon was requested but is not configured (no EDISON_API_KEY); the run fell back to claude_code and the report is research/Myopathy_Congenital_Proximal_With_Minicore_Lesions-deep-research-claude_code.md (11/11 references resolved, 6/6 quotes valid; the five term-label mismatches are parsing artifacts where the report wrote a cache marker next to the CURIE). preflight-dr returned PASS (FXR1 mentioned 33 times, OMIM 618823).

    Evidence: the two human papers (PMID:30770808, PMID:35393337) were re-fetched and upgraded from abstract_only to full_text_xml, and most phenotype and mechanism snippets quote the full text. Supporting model-organism and in-vitro work: PMID:15128702 (Fxr1 knockout mouse), PMID:21659647 (FXR1 translational repression of desmoplakin and talin2 in heart). PMID:32328638 and PMID:19648401 were fetched by the research run but not cited. The translational-repression node is marked HYPOTHETICAL because the founding paper states it as a hypothesis and the target mRNAs were identified only in cardiac muscle. Psychiatric diagnoses in one family and cryptorchidism in one patient are recorded in notes, not as phenotypes. No GeneReviews chapter exists.

    Validation: just validate, validate-terms, count-verified-snippets (55/55), check-entity-refs, check-causal-targets, check-duplicate-keys, the snippet gates, test_gene_activity_grounding and validate-disorders.

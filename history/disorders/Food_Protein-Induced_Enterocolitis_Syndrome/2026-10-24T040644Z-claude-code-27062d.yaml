  summary: 'Create: Food Protein-Induced Enterocolitis Syndrome'
  details: |
    New entry for FPIES (MONDO:0100008; label verified via OLS). Duplicate preflight: no KB entry, stub, PR or issue for FPIES or MONDO:0100008; the open Food_Allergy PR #15345 (MONDO:0700226) was left untouched and is related only through the free-text parents list.

    Deep research: openscientist via just research-disorder (about 21 minutes). Report validation: 23/23 references resolved, 30/30 quotes valid, 23 on topic; needs_review was set only by term validation (NCIT:C1157 mislabelled as ondansetron, obsolete CL:0000548 and GO:0005615); none of those CURIEs was bound. The report is about FPIES throughout. just preflight-dr was not run: no local mondo.db is present, and with no MONDO causal gene or OMIM xref the check could not discriminate disease identity; identity was checked by reading the report instead. Additional references were found by direct PubMed searches. Evidence used from the report: the IL-17 signature (PMID:33891982), purinergic/serotonin metabolomics (PMID:36306938) and gut microbiome studies (PMID:41825597, PMID:39175183).

    Casein emphasis is limited to what the sources state: casein-specific IgG/IgG4/IgA and casein-stimulated TGF-beta and IL-10 deficits, casein-induced lymphocyte proliferation, caseins as the more antigenic milk proteins across milk-allergy groups, extensively hydrolyzed casein formula as recommended feeding, and milk-specific IgE (not casein-specific IgE, which no cached abstract reports as a persistence marker) as the marker of atypical, persistent FPIES. Whether casein or whey is the operative antigen is recorded as an open question.

    The 2017 consensus executive summary (PMID:28167094) caches as abstract only, so the diagnostic criteria are quoted from the full-text J Food Allergy review (PMID:39022142) that reproduces them. NCIT has no oral food challenge term, so diagnosis rows carry no diagnosis_term (searches recorded in notes). Several mechanistic edges are marked INDIRECT_UNKNOWN_INTERMEDIATES because the literature states associations or hypotheses rather than demonstrated steps; the antigen-specific T-cell model is recorded as ALTERNATIVE with REFUTE evidence. Empty caches PMID:31059725, PMID:30244024, PMID:34479731, PMID:23890754 and PMID:29481888 are not cited.

    Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), validate-disorders and the whole-repo gates.

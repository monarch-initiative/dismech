  summary: 'Genetics pass: split the ERG arms from the numbered MONDO loci, add the
    Oguchi arm, wire every gene'
  details: |
    Genetics pass for issue 12247 (d2g series-040). The entry previously carried
    three electroretinographic arms (complete Schubert-Bornschein, incomplete
    Schubert-Bornschein, Riggs) with a numbered MONDO leaf bound on each arm as
    though the arm were that leaf. That binding is now corrected: the three arms are
    electroretinographic classes with no MONDO term of their own and are left
    unbound, and each numbered locus carries its own MONDO term on its own row.
    Synonym-inclusive OLS4 searches for the complete form and for
    Schubert-Bornschein are recorded in the cCSNB review_notes.

    Fifteen numbered subtype rows were added or rebound, each with a gene
    descriptor, a MONDO term and its own evidence: CSNB1A (NYX), CSNB1B (GRM6),
    CSNB1C (TRPM1), CSNB1D (SLC24A1), CSNB1E (GPR179), CSNB1F (LRIT3), CSNB1G
    (GNAT1, recessive), CSNB1H (GNB3), CSNB1I (GUCY2D), CSNB2A (CACNA1F), CSNB2B
    (CABP4, whose MONDO primary label is "cone-rod synaptic disorder, congenital
    nonprogressive"), CSNBAD1 (RHO), CSNBAD2 (PDE6B), CSNBAD3 (GNAT1, dominant),
    plus an Oguchi umbrella row (MONDO:0019152) and its two leaves Oguchi1 (SAG) and
    Oguchi2 (GRK1).

    A fourth mechanistic arm was added for Oguchi disease, which the entry did not
    model: "Failure of Rhodopsin Shut-Off in the Rod Outer Segment" and its
    consequence "Delayed Rod Dark Adaptation", with SAG and GRK1 bound on the
    trigger node and edges to a new Mizuo-Nakamura Phenomenon phenotype
    (HP:0030824) and to Night Blindness. This is the mirror image of the Riggs arm:
    the rod generates a light response but cannot terminate it. Oguchi disease is
    also the one arm of this entry in which the fundus is not normal, which the
    entry now states explicitly as an exception to its own generalization.

    Every gene now reaches a pathophysiology node. Six genes were bound on the Riggs
    node (RHO, GNAT1, GNB3, PDE6B, SLC24A1, GUCY2D), five on the mGluR6 signalplex
    node (NYX, GRM6, TRPM1, GPR179, LRIT3), two on the presynaptic calcium channel
    node (CACNA1F, CABP4) and two on the new shut-off node (SAG, GRK1). Five new
    genetic records were added (SAG, GRK1, SLC24A1, PDE6B, GUCY2D).

    Two claims are carried with explicit reservations rather than asserted. CSNB1I
    (GUCY2D) is the least securely stationary row in the series: the authors describe
    the phenotype as only similar to rare forms of stationary night blindness, their
    patients had macular hypopigmentation and temporal vascular attenuation rather
    than a normal fundus, and an earlier biochemical study concluded that the loss of
    guanylyl cyclase activation it measured cannot account for a rod-selective
    deficit; that study is cited as a REFUTE item against the mechanistic half of the
    claim. CSNBAD1 (RHO) carries a REFUTE item recording that 53.3% of the largest
    p.G90D cohort developed progressive retinitis pigmentosa, which refutes treating
    p.G90D as a reliably stationary allele without refuting the existence of a
    stationary CSNBAD1 phenotype.

    SLC24A1 is placed in the Riggs arm despite OMIM and MONDO numbering it within the
    "complete" series, because the mouse knockout localizes the lesion to the rod
    outer segment with cone responses preserved. The reasoning and the numbering
    conflict are both recorded on the row.

    Three explanation strings that still argued for the retired PARTIAL evidence
    grade were rewritten to state the same caveat without naming the grade.

    A top-level notes block was added recording the two-layer subtype structure
    (mechanistic arms versus numbered loci), the enumeration of MONDO:0016293's 18
    hierarchical descendants with 17 curated as bound rows and the eighteenth
    (MONDO:0044749) identified as a mode-of-inheritance grouping, and the two MONDO
    terms this entry binds that are also bound on subtype rows of
    CACNA1F-Related_Retinopathy and RHO-Related_Retinopathy. The last of those is a
    lump/split decision recorded for a reviewer rather than resolved here.

    Verification on resumption after a session limit: every reference_title was
    compared against the title frontmatter of its references_cache file; all 99
    snippets in this file were confirmed present in the cited paper's PubMed abstract
    rather than only in the cached full text; every MONDO, HGNC, GO, HP and CL CURIE
    and label was re-read from a live OLS4 or HGNC REST lookup.

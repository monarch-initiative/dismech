  summary: 'Create: Congenital Stationary Night Blindness'
  details: |
    New entry for the CSNB group, curated specifically to exercise the scope guardrail of the new phototransduction_cascade_dysfunction module. Six pathophysiology nodes model three mechanistically distinct triggers: the Riggs rod phototransduction cascade defect, the complete-form mGluR6 signalplex defect at the ON-bipolar dendritic tip, and the incomplete-form presynaptic Cav1.4 defect at the photoreceptor ribbon synapse. Only the Riggs arm declares module conformance; the two Schubert-Bornschein arms are transmission defects with the reciprocal ERG signature and are deliberately not wired to the module. Twelve causative genes are curated across three subtypes. Carries mouse and canine LRIT3 models with rescue readouts, and a KNOWLEDGE_GAP challenging the assumption that stationarity is a gene-level rather than allele-level property, given progressive degeneration in both Cacna1f mouse lines. Validated: linkml-validate clean, term validation passed, 40 of 40 snippets verified against cached references.

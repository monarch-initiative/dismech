  summary: Remove conformance from the shared three-arm endpoint
  details: |
    PR review finding 3, and a real mechanistic error. The terminal node 'Impaired Scotopic Vision with Normal Fundus' carried conforms_to phototransduction_cascade_dysfunction#Congenital Non-Progressive Photoreceptor Dysfunction, but that node is the shared endpoint of all three arms: the Riggs cascade lesion drains into it and so do both Schubert-Bornschein transmission lesions. The conformance therefore silently readmitted the very forms the module's own scope note excludes, and asserted photoreceptor dysfunction of arms in which the photoreceptor is intact and the synapse is what fails. This is precisely the trap that scope note anticipates, missed on the way in. Conformance is now confined to the two Riggs-arm nodes upstream, which is where the module's key conformance target sits, and the decision is recorded in the node description so it reads as deliberate rather than absent.

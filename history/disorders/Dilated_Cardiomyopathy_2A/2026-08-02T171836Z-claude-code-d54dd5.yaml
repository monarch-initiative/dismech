  summary: 'Create: Dilated Cardiomyopathy 2A'
  details: |
    De-novo curation of CMD2A [MONDO:0012746], the autosomal recessive TNNI3-related form of familial isolated dilated cardiomyopathy.

    Deep research: Edison/FutureHouse Falcon -- research/Dilated_Cardiomyopathy_2A-deep-research-falcon.md, 17 citations, 857s run. Treated as lead generation only; every PMID, snippet, and ontology term in the entry was independently re-verified against the fetched PubMed abstract or against OAK. Two Falcon claims were checked and deliberately NOT carried over: its assertion that both Sorrentino 2023 patients carried homozygous p.Arg98* [the abstract states one p.Arg98* and one p.Arg69Alafs*8], and its report of compensatory TNNI1 upregulation in affected human myocardium [not stated in any cached abstract]. Falcon also failed to recover a MONDO identifier; MONDO:0012746 was resolved with OAK and NEC-preflighted against its TNNI3 gene and OMIM:611880 anchors, both of which match the report.

    Curated content: a four-node pathograph -- biallelic TNNI3 loss of function, perinatal troponin I isoform switch with loss of ssTnI compensation, thin-filament regulatory failure, left ventricular dilation and systolic failure -- with conforms_to edges to cardiomyopathy_maladaptive_remodeling at the trigger and contractile-dysfunction nodes. Two mechanistic_hypotheses: CANONICAL cTnI-null/perinatal isoform-switch model, EMERGING residual-cTnI-dose model of the dilated-versus-restrictive boundary. Eight phenotypes with HPO terms and structured onset descriptors; a four-allele genetic block with per-variant evidence; inheritance, prevalence, diagnosis, differential diagnoses, progression, treatments, the Tnni3-null mouse experimental model, and three discussions -- INTERPRETATION on the MONDO node versus ClinGen lumped-DCM entity boundary, KNOWLEDGE_GAP on whether truncation position sets the DCM/RCM phenotype, and HUMAN_MODEL_MISMATCH on the human fidelity of the murine ssTnI withdrawal schedule.

    GeneReviews baseline: no CMD2A- or TNNI3-specific chapter exists. The generic Dilated Cardiomyopathy Overview [PMID:20301486] is tagged GeneReviews in the top-level references block; its PubMed record carries only the chapter purpose and no Clinical Characteristics text, so phenotypes were built from the primary CMD2A case literature and the Sorrentino review instead.

    Key references: PMID:15070570 founding recessive TNNI3 report, PMID:36981019 biallelic-null review plus two patients, PMID:38924380 consanguineous lethal-infantile kindred, PMID:36565796 synonymous intron-retention allele naming DCM2A, PMID:41918167 recessive distal-truncation restrictive case, PMID:9915769 Tnni3-null mouse, PMID:26526134 TnI structure-function, PMID:31073128 DCM primer, PMID:26022819 childhood cardiomyopathy sudden death, plus the ClinGen AR TNNI3-DCM Strong assertion CGGV:assertion_b89182f6.

    Validation: just validate passes -- schema plus term validation clean; 60/60 evidence snippets verified against cached references; weighted compliance 88.3%.

  details: |
    Addressed the ai4c-reviewer REQUEST CHANGES review on PR #7881.

    Fixed 2 IMPORTANT items:
    1. Mixed evidence_source on the PMID:15070570 item on the "Biallelic TNNI3 Loss of Function" node. The snippet bundled a human family observation with an in vitro functional-studies sentence under a single HUMAN_CLINICAL tag. Trimmed to the clinical sentence and explained the split; the functional-studies sentence remains correctly modeled as a separate IN_VITRO item on the thin-filament node, so it is not duplicated.
    2. Added a Mechanical Circulatory Support (ECMO / ventricular assist device) treatment, filling the care-pathway gap between guideline-directed pharmacotherapy and heart transplantation. DEVICE modality, NCIT:C80452 Ventricular Assist Device Placement, target_mechanisms INHIBITS on the LV dilation node. Both NCIT terms supplied by the reviewer were independently re-verified with OAK. Per the reviewer's explicit caveat, no snippet was manufactured from the abstract-only PMID:36981019 cache; instead two new pediatric-DCM references were fetched and quoted verbatim -- PMID:42334151 [Pedimacs/PHTS registry, VAD as the standard bridge step] and PMID:42249650 [pediatric mechanical circulatory support bridge case series]. Both are marked PARTIAL because the cohorts are pediatric DCM of any cause rather than the recessive TNNI3 subset, and a note records that the Sorrentino CMD2A ECMO/VAD detail is full-text-only and deliberately not quoted.

    Adopted 1 SUGGESTION:
    3. Added the quotable GeneReviews purpose sentence [PMID:20301486] as a PARTIAL/OTHER evidence item on the Genetic Counseling treatment, so the GeneReviews tag is no longer purely decorative. Explanation records the double caveat: generic DCM guidance, and drawn from the chapter purpose rather than a Genetic Counseling section.

    Declined 2 SUGGESTIONS, both on verifiability grounds:
    4. p.Ala2Val founding allele NOT added. No cached reference contains the string; the only cache hit is an unrelated short-chain enoyl-CoA hydratase deficiency case report. The reviewer conditioned this on a quotable source existing, and none does.
    5. Nonsense-mediated decay NOT added as a pathograph node. The single PubMed hit for TNNI3 plus nonsense-mediated decay in cardiomyopathy is PMID:29355681, which is about TNNI3K -- a different gene -- and is exactly the TNNI3/TNNI3K confusion this entry's notes block already warns against. No TNNI3-specific quotable NMD source was found, so the node would have rested on prose alone.

    Validation after fixes: just validate passes [schema plus terms]; snippets 60/60 -> 63/63 verified against cached references; weighted compliance 88.1%.

    Also rebased onto origin/main [85bed582a] to resolve a merge conflict with PR #7872 [ACTN2 distal myopathy] in the shared term and enum caches. Both conflicts were same-sorted-position row insertions; resolved by taking the union of both sides and re-sorting via just normalize-cache, then verified the diff against the new base removes zero rows.

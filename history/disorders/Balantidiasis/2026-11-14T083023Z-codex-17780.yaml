  summary: Create Balantidiasis infectious disease entry
  details: |
    Added a new Balantidiasis entry for MONDO:0005662 and deleted its stub. The curation models Balantioides coli as the sole confirmed human-parasitizing ciliate, records Sus scrofa as the main reservoir host, and separates contaminated food or water ingestion of cysts, intestinal trophozoite colonization, colonic mucosal invasion, and hyaluronidase-associated colonic ulceration.

    The entry uses PMID:18854484, PMID:35146143, PMID:34339668, PMID:33183780, PMID:31688855, PMID:35734242, and PMID:1190365 to support direct cyst-trophozoite life cycle, fecal-oral cyst transmission, pig-contact and sanitation epidemiology, symptomatic intestinal disease, rare perforating colitis, stool microscopy, colonoscopy with tissue diagnosis, and tetracycline, metronidazole, or iodoquinol treatment. Environmental detection-only studies, unquantified animal host lists beyond the core pig reservoir, and weakly resolved extraintestinal routes were left out of the structured graph.

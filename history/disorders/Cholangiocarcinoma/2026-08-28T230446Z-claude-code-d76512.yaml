  summary: 'Detailed evidence review: Cholangiocarcinoma'
  details: |
    Re-read all 28 evidence items and all 15 unique cited PMIDs against their references_cache entries. Every snippet was verified as an exact substring of the cached reference body (28/28 via the mechanical snippet audit). Semantic support, supports grading, evidence_source classification, and disease/entity identity were checked item by item, including intrahepatic versus extrahepatic subtype attribution: quotes about iCCA-specific findings (FGFR2 fusion prevalence, single-cell fibroblast and Treg findings, desmoplastic stroma) are attached to claims framed for iCCA or for CCA generally, and no hepatocellular-carcinoma or wrong-subtype misattribution was found. Defects found and fixed, both on PMID:32129902 (global CCA incidence study, full-text cache): (1) the Chronic Biliary Inflammation and Cholestasis pathophysiology node cited an incidence-trend sentence (rates increased in most countries) that does not support the inflammation mechanism; replaced with the same paper's mechanistic sentence stating that chronic inflammation modifies cancer risk by causing DNA damage, altered apoptosis and proliferation leading to cholangiocarcinogenesis. (2) the Opisthorchis viverrini infectious_agent entry cited only a country-level incidence-rate sentence that never mentions flukes; replaced with the same paper's sentence naming Opisthorchis viverrini and Clonorchis sinensis and quantifying the 4-5-fold CCA risk increase from liver fluke infection (the same sentence already cited on the corresponding environmental exposure, so grading stays consistent). Verified correct and left unchanged: TOPAZ-1/KEYNOTE-966 first-line standard and German real-world GemCis-durvalumab outcomes, BILCAP long-term capecitabine OS benefit, FDA-approved IDH1/FGFR2 targeted therapies and MAPK-pathway resistance (ClarIDHy ctDNA analysis), tertiary lymphoid structure immunotherapy prediction, PSC lifetime CCA risk of 10-20 percent, subtype-specific mutation profiles (KRAS/PIK3CA large duct versus IDH1/2-FGFR2 small duct), and the single-cell IN_VITRO versus HUMAN_CLINICAL split on PMID:32505533, which correctly grades the functional IL-6/EZH2 experiment separately from the descriptive single-cell findings. Noted without change: the Weight Loss phenotype carries a transparently graded PARTIAL item whose quote (majority present with advanced disease) is indirect, disclosed as such in its explanation; the Clonorchis sinensis infectious_agent entry and several phenotypes carry no evidence, which the schema permits. Post-edit validation: just validate passed and the snippet audit reports 28/28 verified.

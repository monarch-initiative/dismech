  summary: Link liver fluke infection to chronic biliary inflammation
  details: |
    Backfill for issue #8085. Liver Fluke Infection is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into Chronic Biliary Inflammation and Cholestasis, and it is the best-evidenced link in this tranche because the intervening step is quoted rather than assumed: the flukes cause chronic irritation and increased cellular turnover in the bile ducts, which is the node's own content, and that then increases cholangiocyte susceptibility to carcinogens. Three items were fetched from the same review, but only the mechanism sentence is carried on the link. The other two, a four to fivefold increase in disease risk and the ingestion route and duration, were moved to the exposure's own evidence block after the reviewer of PR #8428 pointed out that they characterise the exposure rather than this edge into the node. They are not lost: the route sentence in particular is what makes this an environmental exposure rather than a host state, and it belongs on the exposure for exactly that reason. References were fetched because the single sentence already attached to the exposure reports cancer incidence rates by country and never mentions flukes, so it names neither the exposure nor any relation to this node; it is deliberately left on the exposure rather than carried onto the link. Primary Sclerosing Cholangitis was NOT linked. It is a chronic autoimmune biliary disease, so it is host and comorbidity state rather than environmental exposure, the category error tracked in issue #8185, and linking it would propagate that misfiling into the pathograph.

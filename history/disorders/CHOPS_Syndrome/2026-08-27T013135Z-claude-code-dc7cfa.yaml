  summary: 'Phenotype review: CHOPS_Syndrome'
  details: |
    Campaign phenotype review (snippet-claim consistency, optimal HPO binding, pathograph connectivity) of all 49 phenotypes against cached sources (PMID:31058441 full text, GeneReviews PMID:41712746, case reports) and the Falcon deep-research report. Term fixes: Recurrent pneumonia (HP:0006532) broadened to Pneumonia (HP:0002090) because the cohort paper reports only 'a history of pneumonia'; Pulmonary Arterial Hypertension renamed and preferred-term adjusted to source granularity Pulmonary hypertension (HP:0002092 kept as HPO's general PH term); Dilated Aortic Root rebound from HP:0001679 to HP:0002616, whose definition is exactly aortic root dilatation with 'Aortic root dilatation' as exact synonym, contradicting the entry's previous claim that no live term existed; Over-Affectionate Social Behaviour rebound HP:0012433 to HP:0100025 Overfriendliness; Hypoplastic Long Bones rebound HP:0045060 to HP:0003026 Short long bone. Split two bundled entries: Cerebral Atrophy and Corpus Callosum Hypoplasia into Corpus Callosum Hypoplasia (HP:0002079) plus Cerebral Cortical Atrophy (HP:0002120, matching the source wording 'cortical atrophy'); Enamel Hypoplasia and Tooth Agenesis into Enamel Hypoplasia (HP:0006297) plus Tooth Agenesis (HP:0009804). Pathograph: added top-level genes AFF4 to the variant node so the causal gene wires into the mechanism graph (0/1 to 1/1); added 36 downstream edges from the organism-level convergence node Multisystem Developmental Malformation and Growth Dysregulation (DIRECT for structural congenital malformations, INDIRECT_UNKNOWN_INTERMEDIATES for functional/behavioural features) and 3 edges from Food-Seeking Behaviour and Impaired Satiety (Hyperphagia DIRECT, Obesity DIRECT with GeneReviews edge evidence, Acanthosis Nigricans INDIRECT_KNOWN_INTERMEDIATES via obesity-associated insulin resistance). Connectivity 0/49 to 39/51. Deliberately left unexplained (12): the parenchymal/functional pulmonary set (chronic lung disease, pneumonia, alveolar haemorrhage, pulmonary hypertension, sleep apnea - aetiology explicitly undetermined per PMID:31058441; the existing pulmonary KNOWLEDGE_GAP now attaches to these phenotypes), dilated aortic root, constipation, the single-case dental and neuroimaging findings, and the unestablished moyamoya/vasculopathy association. Validated: just validate, validate-terms, check-duplicate-keys, check-entity-refs, folded-hyphens/snippet-length/title-snippets baselines, and just validate-disorders all pass; 139/139 snippets verified.

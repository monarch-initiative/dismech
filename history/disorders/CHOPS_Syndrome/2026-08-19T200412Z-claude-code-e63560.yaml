  details: |
    Response to the CHANGES_REQUESTED review on PR #8978 (https://github.com/monarch-initiative/dismech/pull/8978#issuecomment-5347108598).

    Blocking finding addressed: composite sentences from PMID:31058441 had been quoted for one clause with sibling clauses left unmodelled. Five phenotypes were added from sentences the entry already cited, with no new fetching and no new research:

    - Dilated Aortic Root (Case-6, Case-7; 2/11, OCCASIONAL). HPO has no live term for aortic root dilatation: HP:0002616 is aortic root *aneurysm*, a stronger and different claim, and both dilatation terms (HP:0001724, HP:0002622) are obsolete. Bound to the accurate broader parent HP:0001679 "Abnormal aortic morphology" rather than to the aneurysm term, with the gap and the term-request case recorded in the description.
    - Hypoplastic Long Bones (HP:0045060 "Aplasia/hypoplasia involving bones of the extremities"), from the abstract summary sentence already quoted twice, plus the radiographic body-text sentence naming bilateral proximal radial and fibular hypoplasia. No frequency asserted: the summary sentence carries no denominator.
    - Small Genitalia (HP:0000050 "Hypoplastic male external genitalia"; Case-5, Case-11), from the male-genital sentence previously used only for cryptorchidism and hypospadias. Frequency omitted because the denominator is males only and is not stated.
    - Wide Anterior Fontanel (HP:0000260; Case-1, 2, 5; 3/11, OCCASIONAL).
    - Wormian Bones (HP:0002645; Case-1, 5; 2/11, OCCASIONAL).

    Every HP term was verified with OAK before binding and `just validate-terms` passes, so each `term.label` matches the canonical label exactly. Each frequency band is justified by the case count in its own snippet and the arithmetic is stated in the `explanation`, per CLAUDE.md section 7; where the source gives no denominator, `frequency:` is omitted rather than inferred.

    Two further quotable phenotypes were added from sentences already cited: Over-Affectionate Social Behaviour (HP:0012433, all individuals, VERY_FREQUENT - a CdLS-discriminating feature the entry quoted but did not model) and Temper Tantrums (HP:0025160, no denominator so no band).

    Not added, per the reviewer: tracheomalacia, kyphoscoliosis/scoliosis and GERD appear in the falcon artifact but in no cached reference, so they are not snippet-supportable. Microcephaly/reduced head circumference is supported only indirectly and was skipped rather than stretched.

    Optional suggestions taken:
    - CL:0000057 fibroblast -> CL:0002620 skin fibroblast on all three dermal-fibroblast bindings.
    - Treatments moved off the generic NCIT:C49236 where a specific clinical-action term exists: gastrostomy -> NCIT:C157864 Gastrostomy Tube Procedure; chronic lung disease and sleep apnea -> NCIT:C15322 Respiratory Therapy; a new Cataract Surgery treatment -> NCIT:C157809. The hearing-aid treatment now omits `term:` entirely with a note, because NCIT has no clinical-action term for hearing aid fitting and binding it to a generic procedure term would misdescribe a device intervention. The remaining Ophthalmological Management entry deliberately keeps NCIT:C49236 and now says why: it spans refraction, spectacle correction and strabismus management, which no single more specific NCIT term covers.
    - `diagnosis_term` changed from NCIT:C101295 Whole Exome Sequencing to NCIT:C15709 Genetic Testing, because the entry's own text emphasises that targeted AFF4 sequencing is a viable route and a term naming only exome understated it.
    - The behavioural node keeps HP:0000708; HPO has no "disruptive behaviour" descendant, so the specificity was added as the separate temper-tantrum and social-behaviour phenotypes instead of forcing a narrower binding onto the general node.

    Validation run and read after the changes: `just validate` passed schema (`No issues found`), terms (`Validation passed`) and references with `Snippets checked: 136/136 verified` (up from 127); `just count-verified-snippets` 136/136; `just validate-terms` passed; `scripts/check_snippet_length.py --against-ref origin/main` reported no new snippets under 5 words; `scripts/check_folded_hyphens.py` reported no new folded-scalar hyphen splits; `just check-title-snippets` reported no new title-quoting snippets; `just check-duplicate-keys` OK; `just validate-disorders kb/disorders/CHOPS_Syndrome.yaml` passed 136/136. `pytest tests/test_data.py -k CHOPS_Syndrome` 16 passed. linkml-data-qc compliance 94.4% global / 94.6% weighted over a larger denominator (320 checks, up from 271). No cache files changed: every new ontology term was already present in the label and enum caches, so validation was fully offline.

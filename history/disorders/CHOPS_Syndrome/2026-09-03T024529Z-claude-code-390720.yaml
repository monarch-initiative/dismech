  summary: 'Address blocking review on #9572: PH rebind, aortic-root prose, spinal
    phenotypes'
  details: |
    Addressed the three blocking items in the ai4c-reviewer CHANGES_REQUESTED review of PR #9572.

    1. Pulmonary Hypertension rebound from HP:0002092 (Pulmonary arterial hypertension) to HP:0004890 (Elevated pulmonary artery pressure). Confirmed with OAK against sqlite:obo:hp that HP:0002092 sits two levels below HP:0004890 via HP:0033578 Pre-capillary pulmonary hypertension, and that its operative definition requires a pulmonary capillary wedge pressure of 15 mmHg or less. PMID:31058441 reports 'Pulmonary hypertension was found in Case-1 and Case-6' with no hemodynamic classification, so the pre-capillary claim was unsupported. The description previously asserted HP:0002092 was HPO's general PH term; that claim is removed and replaced with the reason HP:0002092 was rejected. preferred_term unchanged.

    2. Dilated Aortic Root keeps HP:0002616 but the description no longer claims 'Aortic root dilatation' is an exact synonym. OAK shows it is oio:hasBroadSynonym; the exact synonyms are 'Enlarged aortic root' and 'Increased aortic root diameter'. The corrected prose records that HPO is internally inconsistent here (definition is dilatation, label is aneurysm, synonym scope is broad), that HPO has no aortic-root dilatation term at any level, and that the rest of the KB binds aortic root dilatation to HP:0002616 (Shprintzen-Goldberg, Larsen-like B3GAT3, hypermobile EDS, ALG3-CDG). Also records why no causal edge is drawn from the malformation node.

    3. Added two phenotypes for the 2/11 spinal finding in PMID:31058441: Filum Terminale Lipoma (HP:6000184, exact term) and Low-Lying Conus Medullaris (HP:0031938 Abnormal conus terminalis morphology). Curated as two phenotypes rather than one bundle. The conus finding is bound to the parent rather than to HP:0002144 Tethered cord, whose definition requires a thickened rope-like filum and consequent neurologic signs, neither of which the source reports. Both carry the same verified snippet and are left unwired, with the reason in their descriptions.

    Also took the non-blocking suggestion on Hypoplastic Long Bones: the description now records that HP:0003026 shifts the claim from hypoplasia to shortness, that HPO has no long-bone-level hypoplasia term, and that the previous HP:0045060 was broader still.

    Validation on the edited file: just validate passed (141/141 snippets verified), just validate-terms passed, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean. Two term-cache rows added by the validator for the new HP terms.

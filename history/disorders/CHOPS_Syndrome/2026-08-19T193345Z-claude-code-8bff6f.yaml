  summary: 'Create: CHOPS Syndrome (MONDO:0014609, AFF4)'
  details: |
    New KB entry for CHOPS syndrome (MONDO:0014609, OMIM:616368, AFF4/hgnc:17869), the AFF4 super-elongation-complex gain-of-function multiple congenital anomaly / intellectual disability syndrome.

    NEC preflight (mandatory for this long compound MONDO label): `just preflight-dr research/CHOPS_Syndrome-deep-research-falcon.md MONDO:0014609` returned PASS - canonical gene AFF4 mentioned 55 times, next gene SIAH1 at 5; report OMIM 616368 matched the MONDO OMIM xref. Identity was anchored independently with `runoak -i sqlite:obo:mondo info MONDO:0014609 -O obo`, which gives xref OMIM:616368, relationship RO:0004003 HGNC:17869 (AFF4), and "CHOPS syndrome" as an EXACT synonym - the basis for the file slug.

    Deep research: falcon (Edison), 624s, 30 citations. Its own reference_validation block reported 5/5 references resolved, 0 unresolved, 0 off topic. The report was used as a lead only; every snippet in the entry was taken from a cached abstract or PMC full text, not from the report. The report contributed one reference not otherwise found (PMID:37528066, Che et al. on distinct AFF1/AFF4 SEC roles), which is cited with an explicit caveat that the experiment is AFF4 loss rather than gain.

    GeneReviews baseline: PMID:41712746 "AFF4-Related CHOPS Syndrome" exists and is tagged in the top-level references block. Its Clinical Characteristics and Management sections were cross-referenced against the phenotypes and treatments sections.

    Pathophysiology is de-bundled into seven atomic nodes: de novo ALF-homology-domain missense variant; loss of SIAH1-mediated degradation; accumulation of chromatin-associated AFF4; dysregulated SEC-dependent transcriptional elongation; a parallel enhancer-complex and enhancer-promoter-looping arm shared with Cornelia de Lange syndrome; global transcriptional dysregulation of developmental gene programmes; and an organism-level malformation node. Food-seeking behaviour is a separate node reached by an INDIRECT_UNKNOWN_INTERMEDIATES edge because no mechanism links AFF4 to appetite.

    Four KNOWLEDGE_GAP discussions record what is not known: the pulmonary mechanism (the largest clinical series itself calls the chronic lung disease aetiology undetermined), the appetite mechanism, whether the single-case moyamoya and systemic vasculopathy association is real (confounded by an RNF213 susceptibility allele in the same genome; curated with PARTIAL evidence), and how the CHOPS phenotype partitions between the CdLS-shared enhancer arm and the CHOPS-specific elongation arm.

    Models: patient dermal fibroblasts and the HEK293T AFF4/SIAH1 co-overexpression assay under experimental_models; the ENU "robotic" Aff1 mouse under animal_models as PARTIALLY_RECAPITULATES with LOW fidelity, its limitations stating it is the paralogue and produces ataxia, not CHOPS - there is no animal model of the disorder itself.

    Validation run and read: `just validate` passed schema, terms, and 127/127 snippets verified against cached references; `just count-verified-snippets` 127/127; `just validate-terms` passed; `scripts/check_snippet_length.py --against-ref origin/main` reported no new snippets under 5 words; `just check-title-snippets` reported no new title-quoting snippets; `just check-duplicate-keys` OK; `just check-term-cache-integrity` OK; `just validate-disorders kb/disorders/CHOPS_Syndrome.yaml` passed 127/127. `pytest tests/test_data.py -k CHOPS_Syndrome` 16 passed. A full `pytest tests/test_data.py` run showed one unrelated pre-existing failure in Travelers_Diarrhea.yaml (bare-URL evidence references); that file is byte-identical to origin/main and untouched here. linkml-data-qc compliance 94.9% (weighted 95.3%).

    datasets is deliberately empty: no CHOPS-specific dataset exists, and searching the causal gene would surface AFF4's HIV and leukaemia literature rather than this disorder - the Named Entity Confusion risk CLAUDE.md warns about for dataset discovery.

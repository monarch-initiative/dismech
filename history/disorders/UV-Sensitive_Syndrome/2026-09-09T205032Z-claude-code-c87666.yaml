  summary: Replace two truncated variant snippets with the full sentences
  details: |
    Quote-quality fix found by auditing snippets for terminal punctuation.

    Both variant evidence items had been quoted as mid-sentence fragments, on the mistaken assumption that a snippet spanning a line break in the cached full text would fail to match. One of them, 'causing a missense change close to the C-terminus of the', ended mid-phrase and did not stand as a proposition at all. Both passed every gate, which is the point worth recording: check-snippet-length only rejects snippets under five words, so a fragment of adequate length is invisible to it.

    The reference validator does normalise whitespace across line breaks. Both snippets are now the full sentences, each naming the allele, its zygosity, the case or cases carrying it and the protein consequence - and for ERCC6 the same sentence continues into the observation that other mutations in that gene cause the much more severe Cockayne phenotype, which is the contrast the entry is built around.

    Audited all 52 snippets for this: four lack terminal punctuation, and after this change the remaining three are each complete propositions (two are whole GEO summaries or a self-contained clause). No other snippet needed work.

    Compliance unchanged at 97.9% (137/140); snippets 52/52 verified.

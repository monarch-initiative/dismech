  summary: 'Create: UV-Sensitive Syndrome (MONDO:0015797)'
  details: |
    New entry for UV-sensitive syndrome, curated from a Falcon (Edison) deep-research run (research/UV-Sensitive_Syndrome-deep-research-falcon.md, 548s, 8 unique sources behind 44 citation strings).

    Lump/split: curated as ONE entry with three has_subtypes records (UVSS1/ERCC6, UVSS2/ERCC8, UVSS3/UVSSA), following the merged stub-queue decision in PR #9855 which folded the three seeded per-gene stubs into a single DISEASE stub. stubs/UV-sensitive_Syndrome.yaml deleted.

    Report screening: reference validation 9/9 resolved, 0 unresolved, 0 off-topic (on_topic 3 of 9, the other 6 undecided for lack of abstracts). Term validation 16/16 resolved; the single mislabelled term was MONDO:0015797 reported as 'if available', which is the prompt template's own boilerplate being parsed as a label, not a report defect. just preflight-dr returned SKIP, not PASS, because MONDO records no causal gene (RO:0004003) for MONDO:0015797. Identity was therefore confirmed manually: MONDO:0015797 carries xref OMIMPS:600630 matching the report's OMIM number, and the report's gene profile (UVSSA 47, ERCC6 17, ERCC8 16 mentions) matches MONDO's own subtype terms, with Cockayne syndrome appearing only as the intended contrast.

    Sources: the report cites by author-year key with no PMIDs anywhere. Eight unique DOIs were recovered from the citation sidecar and resolved to PMIDs via the PMC ID Converter and PubMed [AID] search. PMID:22466610 (UVSSA discovery), PMID:15486090 (the CSB-null contrast), PMID:32355176 (CSB/CSA/UVSSA/TFIIH assembly), PMID:38316879 (ELOF1 structural), PMID:34974577 (clinical review), PMID:39383571 (UVSSA in interstrand-crosslink repair; the published DNA Repair version was used in preference to the bioRxiv preprint PMID:37214867 the report cited).

    Deliberate omissions, all recorded in the entry notes: the review's 1:100,000 prevalence is not curated as a rate because it has no surveillance basis; xerosis is not curated as a phenotype because no cached source states it quotably; PMID:30182135 (Li 2019) carries no evidence item because its cached record is a publisher 'File not found' page rather than an abstract. No GeneReviews chapter exists for this disease (two PubMed searches returned zero), and the Cockayne GeneReviews chapter PMID:20301516 cannot substitute because its cached abstract does not mention UV-sensitive syndrome.

    No conforms_to link: there is no TC-NER module in kb/modules/. Flagged in notes as worth creating separately, since it would have several conformers.

    Validation: just validate, just validate-disorders, count-verified-snippets (21/21 verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-reference-titles, check-title-snippets, check-snippet-grading all pass.

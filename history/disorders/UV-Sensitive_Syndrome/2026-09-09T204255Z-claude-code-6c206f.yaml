  summary: Add mechanistic_hypotheses, variants and progression
  details: |
    Fills the remaining curatable sections identified in a completeness review.

    mechanistic_hypotheses: the two competing explanations for why the same genes give Cockayne syndrome in most people and this disease in others are now first-class records rather than prose inside a discussion rationale. csa_csb_repair_independent_functions (CANONICAL) is the field's general account - CSA/CSB have roles outside TC-NER whose loss drives the severe phenotype - recorded as a hypothesis precisely because it is stated as 'some other function' rather than a specified one. csb_pgbd3_fusion_position (EMERGING) is the specific positional alternative surfaced by geo:GSE111989: whether the CSB truncation falls upstream or downstream of the PGBD3 insertion determines whether a CSB-PGBD3 fusion protein is still made. No causal edge opts into either group, because the disagreement concerns what Cockayne syndrome adds rather than any step in this disease's own chain; that is stated in the group notes rather than left implicit.

    variants: two alleles curated with exact quotes from the Nakazawa full text - ERCC6 c.229C>T (p.Arg77X), the null that produces the mild disease and so carries the entry's central contrast, and ERCC8 c.1083G>T (p.Trp361Cys). UVSSA is curated as an allelic class, not as individual variants, and the reason is recorded: the deep-research report offered c.367A>T (p.Lys123Ter), but the only cached sentence carrying c.367A>T describes it as a heterozygous variant in a Japanese control individual, not a patient allele, and the patient-level form appears only as a table fragment that cannot be quoted as a proposition. The report separately flags that secondary sources disagree over p.Trp347Ter versus p.Tyr347Ter and that cDNA numbering is inconsistent. Curating specific UVSSA HGVS needs transcript-level verification against primary tables.

    progression: one phase, not two. A childhood-onset phase was drafted and then dropped because no cached source states the onset quotably; that omission is recorded in the phase notes rather than silently made. The surviving phase is evidenced by a source stating that no pathologies other than sunburn and freckles have been associated with the disease.

    prevalence gains a second evidence item arguing the published count is an ascertainment floor: the same review holds that hundreds or thousands of people likely have the disease but escape diagnosis because the phenotype is mild. This is the substantive justification for CASES_IN_LITERATURE with no rate attached.

    mappings: remains absent and this is now explained in the notes rather than looking unwritten. DiseaseMappings supports only icd10cm, icd11f, mondo and ncit mappings, while MONDO:0015797's cross-references are DOID, GARD, ICD9, MEDGEN, MESH, OMIMPS, Orphanet, SCTID and UMLS - none of which the schema can hold.

    Compliance 97.6% to 97.9% (137/140); snippets 45 to 52, all exact-quote verified. The three remaining unmet checks are the causal edges from UV-Induced Keratinocyte Apoptosis to the three cutaneous phenotypes, unchanged and deliberate.

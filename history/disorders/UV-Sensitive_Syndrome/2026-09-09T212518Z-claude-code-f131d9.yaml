  summary: 'Address review suggestions 1 and 3: UBERON anatomy bindings and Cockayne
    severity evidence'
  details: |
    Answers the automated review on PR 11573 in one push. Two of the four blue suggestions were taken; two were deliberately not.

    Taken - suggestion 1, anatomical grounding. Nothing in the entry was bound to UBERON, so the cutaneous phenotypes were not queryable by anatomy. Rather than tag everything 'skin', each binding was chosen for where the thing actually is: Persistent Transcription Blockage After UV Exposure gets UBERON:0002097 skin of body (UV reaches no deeper compartment in vivo); UV-Induced Keratinocyte Apoptosis gets UBERON:0001003 skin epidermis (both its cell types, keratinocyte and melanocyte, are epidermal); Cutaneous Photosensitivity gets skin of body; Freckling and Dry Skin get epidermis; Telangiectasia gets UBERON:0002067 dermis, where the dilated vessels are.

    The two upstream nodes were left unbound on purpose. Biallelic Loss of a TC-NER Factor is a germline lesion present in every cell, and Failure to Process Stalled RNA Polymerase II is a general cellular repair defect - it is assayed in dermal fibroblast lines, which is why this entry's own experimental_models are fibroblasts. Binding either to skin would assert a tissue restriction the biology does not have. The review suggested three terms without saying where they go; blanket-applying them would have been the wrong reading.

    All three CURIEs were confirmed present in cache/uberon/terms.csv and in cache/enums/anatomicalentityterm_c7eab8227a65.csv before use, so this validates offline. Note the canonical label for UBERON:0002097 is 'skin of body', not 'skin'.

    Taken - suggestion 3, the Cockayne severity contrast. The differential's leading distinguishing feature (absence of neurological, growth and developmental abnormality) is the entry's central clinical claim and rested on a single cell-biology paper. PMID:20301516, the Cockayne Syndrome GeneReviews chapter, is already cached in this repository and states the comparator's course exactly. Added as SUPPORT with directness INDIRECT and evidence_source HUMAN_CLINICAL, matching how Cockayne_Syndrome.yaml grades the same chapter. The explanation records the constraint the review itself set and which is worth keeping explicit: the chapter never mentions UV-sensitive syndrome, so it can establish only what the comparator looks like, never anything about this disease.

    Not taken - suggestion 2, four supportive-care treatments from research report section 12. The review states in the same paragraph that none is quotable from any cached source; PMID:34974577's abstract carries only the photoprotection sentence already cited. Adding them means an unevidenced treatment block. The existing notes already record the narrowing.

    Not taken - suggestion 4, conforms_to. No DNA-repair module exists, the review agrees, and the precedent is already recorded in notes.

    Validation: schema, terms and references clean; snippets 53/53 verified (was 52/52); entity-refs, causal-targets, duplicate-keys, qualifier-terms and enum-values all pass. Compliance 98.0% (144/147), up from 97.9% (137/140). The three unmet checks are unchanged - the terminal edges to the cutaneous phenotypes, left uncited by design.

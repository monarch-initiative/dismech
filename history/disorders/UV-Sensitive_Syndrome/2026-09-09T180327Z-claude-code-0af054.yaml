  summary: 'Expand: UV-Sensitive Syndrome to 97% compliance'
  details: |
    Second curation pass, raising linkml-data-qc compliance from 86.1% (62/72) to 97.1% (102/105) and snippet count from 21 to 37, all exact-quote verified.

    Added: environmental: (ECTO:0000006 exposure to ultraviolet radiation) with an influences_mechanisms TRIGGERS link onto the transcription-blockage node - the largest gap, since this disease is defined by a gene-environment interaction and had no environmental section at all; experimental_models: for the patient dermal fibroblast lines (UVs1KO, Kps3) and the isogenic TC-NER knockout lines, both with modeled_mechanisms links, fidelity, model_scale and limitations; diagnosis: for the recovery-of-RNA-synthesis assay and molecular genetic testing (NCIT:C15709); classifications.harrisons_chapter DERMATOLOGY + GENETICS_ENVIRONMENT_DISEASE; datasets: geo:GSE132840; evidence on the UVSS1 and UVSS2 subtypes and on two further causal edges.

    Dataset triage: just discover-datasets returned four candidates, all GENE_ONLY matches. Three were rejected and the reasons recorded on the dataset notes - GSE121960 uses UVSSA but studies MYC-driven cancer cell survival, GSE111989 targets CSB for Cockayne syndrome, GSE168861 is a broader ERCC6-anchored NER analysis. Only GSE132840 (XR-seq in CSA/UVSSA knockouts) is on-topic on its own summary, and its linked publication PMID:32355176 was already cited. Verified with just verify-datasets; GEO_GSE132840.md committed.

    PMID:26255937 (Spivak, Photosensitive human syndromes) was re-fetched after being dropped from the first pass as uncited. Its full text supplied the two quotes that let the apoptosis limb be evidenced honestly, including one stating the persistent-transcription-blockage-to-apoptosis step explicitly and flagging it as the prevailing explanation rather than a demonstrated one.

    Deliberately still uncited: the three edges from UV-Induced Keratinocyte Apoptosis to the cutaneous phenotypes. Sources establish that the cells die and that patients develop the signs, but none states that one produces the other in skin, and the research report says the same. These are the remaining 3 of 105 compliance checks; filling them would require asserting something no source says.

    mechanistic_category left unset: its enum offers no DNA repair value and stretching an existing one would be false. Genetic Counseling was removed as a treatment because no cached source states it, rather than left as an uncited object.

    Validation: just validate-disorders (37/37 snippets), compliance 97.1%, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-reference-titles, check-title-snippets, check-snippet-grading, check-environmental-evidence all pass.

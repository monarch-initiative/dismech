  summary: Cite the two co-discovery papers; add Dry Skin; record the COFS module
    precedent
  details: |
    Acts on the automated second-opinion comment on issue #11533, which was right about one thing and wrong about another.

    Right: UVSSA was reported by three simultaneous 2012 Nature Genetics papers and this entry cited only one. Nakazawa (PMID:22466610) was already here; Schwertman (PMID:22466611) and Zhang (PMID:22466612) are now added. This was not merely under-citation. The entry asserted the UVSSA-USP7 interaction and the CSB-stabilisation step in two places with nothing citing either; Schwertman is the source for both, and Zhang independently reports the same complex plus the RNA polymerase II phosphorylation-state readout. Two previously unsupported mechanism claims are now sourced.

    Wrong: the comment stated that COFS_Syndrome already conforms_to a shared TC-NER module. It does not. Its only mention of conforms_to is prose recording the opposite decision - that it mirrors the shared TC-NER biology 'rather than inherited via conforms_to because dismech modules are reserved for cross-disorder conserved mechanisms'. That is a prior curator declining a TC-NER module for this exact pathway, which is material to the open module question, so it is now recorded in this entry's notes rather than left to be rediscovered. The comment itself flagged that it had no paper access and asked for verification, which is why it was checked.

    Also added Dry Skin (HP:0000958), previously omitted for want of a quotable source. The source found (PMID:26255937) describes the manifestations of defective photoproduct repair as a class and never names this disease, so the evidence item is graded INDIRECT and its explanation states the inference and its limit explicitly. This is the one judgement call in this pass and is flagged as such.

    Considered and rejected: normalising the free-text parents slot against MONDO's own parent terms. The KB already spells this concept four different ways across entries (DNA repair disorder / disease, both casings), the slot is neither validated nor read by the coverage index, so changing this entry alone would be churn without benefit.

    Compliance 97.5% to 97.6% (121/124); snippets 41 to 45, all exact-quote verified. The three remaining unmet checks are unchanged and deliberate: the causal edges from UV-Induced Keratinocyte Apoptosis to the cutaneous phenotypes.

  summary: Add three gene-matched datasets and the CSB-PGBD3 hypothesis
  details: |
    Reversal of an over-strict dataset triage from the previous pass, prompted by curator review.

    The earlier pass kept only geo:GSE132840 of the four candidates just discover-datasets returned, rejecting the rest as GENE_ONLY matches. That was too aggressive: all four are matched on one of this disease's three causal genes, and a gene-matched dataset is a legitimate resource for a disease entry provided the caveat is stated. All four are now curated, each with per-dataset notes recording exactly what it does and does not address.

    One rejection was simply wrong, and it mattered. geo:GSE111989 was dismissed from its truncated title as a Cockayne syndrome study. Its summary is explicitly about the UVSS/CS divergence this entry's uvss_vs_cs_severity knowledge gap is built around, and it supplies a concrete candidate mechanism the entry did not have: CSB transcripts can read through into an inserted PiggyBac-derived element (PGBD3) to give a CSB-PGBD3 fusion protein, and the dataset reports that UVSS alleles carry nonsense mutations upstream of that insertion in both copies while Cockayne alleles are mutated downstream of it or in exon 1. The same work reports that forcing an upstream stop codon recovered mitochondrial membrane potential in Cockayne cells, which is the repair-independent function the general explanation appeals to. The discussion rationale now names this hypothesis and marks it as a cell-line result untested against the full allele set, rather than continuing to describe the explanation as unspecified.

    Caveats recorded per dataset: GSE121960 measures UVSSA-dependent RNAPII dynamics under MYC activation, so it is pathway-relevant but framed as oncology, and its evidence item is graded INDIRECT; GSE168861 depletes NER genes in MCF-10A breast epithelial cells, so it is neither disease-specific nor keratinocyte context, also graded INDIRECT. GSE111989 has no linked PubMed record.

    Compliance 97.1% to 97.5% (115/118); snippets 37 to 41, all exact-quote verified; all four accessions verified by just verify-datasets with their GEO cache files committed. The three remaining unmet checks are unchanged and deliberate: the causal edges from UV-Induced Keratinocyte Apoptosis to the three cutaneous phenotypes, which no source supports as a causal step.

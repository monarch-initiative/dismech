  summary: 'Follow-up enrichment: biochemical, exon-skipping variant, ovine model,
    2016 criteria (issue 9965)'
  details: |
    Addressed 3 of 4 deferred enrichment items from issue 9965 (review of PR 9945). (1) Added a biochemical: block for pNalpha1(I)/pNalpha2(I) procollagen accumulation in cultured dermal fibroblasts, the diagnostic biochemical hallmark, cited to PMID:26765342 SDS-PAGE/fluorography results and linked as a readout of the Failure of Procollagen N-Propeptide Excision node. (2) Added a variants: entry for the in-frame exon-skipping deletion class (exons 3-5 and exons 14-16) from PMID:15373769, distinguishing it from the predominant truncating alleles already in genetic:. (3) Added a new animal_models: entry for the ovine ADAMTS2 catalytic-domain missense model V15M, PMID:25354687, with modeled_mechanisms linking to Biallelic ADAMTS2 Loss of Function and a readout citing the in-silico structural-destabilization evidence, graded evidence_source COMPUTATIONAL for that specific claim and MODEL_ORGANISM for the sequencing finding. (4) Added a definitions: entry, DIAGNOSTIC_CRITERIA, for the 2016 revised clinical diagnostic criteria from Table 2 of PMID:26765342, citing the rationale for revision plus the new major/minor criteria text. Deliberately did not add the second ovine model, PMID:28856769, nonsense-mutation confirmation in White Dorper sheep: its references_cache entry has content_type unavailable with no abstract text, so no exact-quote evidence snippet could be sourced from it without fabrication; recording this gap rather than silently dropping it. All snippets are exact substrings verified against references_cache, 66 of 66 via just validate-disorders.

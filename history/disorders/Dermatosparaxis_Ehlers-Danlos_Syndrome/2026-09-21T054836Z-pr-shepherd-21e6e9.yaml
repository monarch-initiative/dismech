  summary: 'Review round: unsource zygosity on the White Dorper ovine model'
  details: |
    Addresses the 2026-09-20 review on PR #11770.

    BLOCKING (fixed): the White Dorper sheep animal model declared 'genotype: ADAMTS2 nonsense variant, homozygous' while its own 'limitations' field states that nothing beyond the title and indexed MeSH terms could be verified. Neither the title nor the MeSH terms (Codon, Nonsense; Sheep, Domestic/genetics; Switzerland) records zygosity, so 'homozygous' was an inference from autosomal-recessive inheritance sitting in a structured slot a consumer reads as sourced. Changed to 'ADAMTS2 nonsense variant (zygosity not recorded in the available source)' and recorded the reasoning in the model notes.

    SUGGESTIONS taken in the same push:
    - The model description called the V15M sheep allele a 'residual-activity allele'. The entry elsewhere declines to assert residual activity (the V15M model's own limitations record that pathogenicity rests on SIFT/PolyPhen-2 and structural modelling with no enzymatic readout; the canine model's notes call residual activity 'a plausible but unproven case'). Rephrased the contrast as allele class: 'a null allele and a catalytic-domain missense one'.
    - Added PMID:28856769 and PMID:36421833 to the top-level references: block. Both were cited in the entry but absent from that block; titles copied verbatim from the cache frontmatter.
    - Recorded PR #10177's opposing view in the model notes, so a future curator can act on it by deleting the one list entry rather than re-deriving the argument.

    NOT taken: the exon-17 in-frame skip allele flagged in the 2026-09-13 review remains out of scope for this diff, as that review itself noted.

    Validation: just validate (schema + terms + references) passes, 73/73 snippets verified.

  details: |
    Addressed the CHANGES_REQUESTED review on PR #10177.

    Blocking items:

    1. The definitions description misstated Table 2 of PMID:26765342. Re-read the cached
    table (references_cache/PMID_26765342.md) and rewrote the description: "bruising easily"
    is promoted from a Villefranche minor criterion to major (not kept); the typical facial
    gestalt is the FOURTH major criterion, not the third; of the five proposed minor criteria
    only umbilical hernia derives from a Villefranche criterion (narrowed from "large hernias
    (umbilical, inguinal)") while the other four are new; the gestalt is "congenital and/or
    postnatal, progressive", not congenital-onset; and the update drops two Villefranche minor
    criteria - soft doughy skin texture and premature rupture of fetal membranes - which the
    description now records.

    2. Added two criteria_sets, "Proposed updated major criteria" and "Proposed updated minor
    criteria", with ontology-bound CriteriaItems reusing HP terms already bound elsewhere in
    this entry. The composite facial gestalt and the visceral/vascular fragility criterion are
    deliberately left unbound, with the reason recorded in their description, per the ontology
    contract. minimum_required is unset because the source states no minimum count. The two
    criteria snippets previously carried as definition-level evidence now sit on the criteria
    sets they attest rather than being duplicated; the "why revised" evidence item stays at
    definition level.

    3. The biochemical block's entry-level evidence quoted the "pepsin-digested collagen was
    normal" sentence, which supports the context framing but not the pN-chain accumulation the
    block is named for. Added the accumulation snippet as an entry-level item and rescoped the
    "normal" item's explanation to the context claim. Also corrected the readout explanation:
    the biochemical study was done on P2, P3, P4 and P5, who between them come from four
    unrelated families - only P1 and P2 are siblings - so the earlier "four affected siblings"
    wording repeated the paper's loose usage as fact.

    4. Added PMID:15373769 and PMID:25354687 to the top-level references block, with titles
    copied verbatim from their cache frontmatter.

    Suggestions taken:
    - Bound biochemical.cell_types to CL:0002620 (skin fibroblast); the finding is explicitly
      in cultured dermal fibroblasts.
    - Added Variant.functional_effects for the in-frame exon-skipping allele class, capturing
      the impaired aminoprocollagen processing that had lived only in prose.
    - Softened the "first reported catalytic-domain missense allele in any species" priority
      claim on the ovine model; the abstract of PMID:25354687 makes no such claim.

    Suggestion not taken: splitting the variant entry into two records (homozygous exon 3-5
    deletion vs compound-heterozygous exon 14-16). The entry is deliberately an allele-class
    record and the reviewer marked this take-it-or-leave-it; splitting it would duplicate the
    shared class rationale without adding a distinguishable claim.

    Validation: just validate (schema + references, 67/67 snippets verified) and
    just validate-terms both pass; check-entity-refs and check-duplicate-keys pass.

  summary: 'Augment: Dermatosparaxis Ehlers-Danlos Syndrome (deep-research cross-check)'
  details: |
    This entry already existed as an exceptionally mature, actively-maintained curation (91.0% compliance, 1277 lines, animal_models/definitions/discussions/progression sections all present, its own prior OpenScientist deep-research pass documented in notes:) -- so this session's task was augmentation, not creation. Per /curate instructions, a fresh deep-research pass was run via 'just dr_fallback=--fallback research-disorder falcon Dermatosparaxis_Ehlers-Danlos_Syndrome' (falcon/Edison Scientific ran successfully this time, 628s, 34 citations, 11/11 references resolved, 0 confabulated; needs_review:true was driven only by a harmless template-placeholder artifact ('if available' leaking into the MONDO label field) plus one pre-existing obsolete GO term not used in this entry). Before running deep research, just discover-datasets surfaced a highly relevant, previously-uncited 2026 GEO dataset (geo:GSE343646, a patient-analog Adamts2 Q226* knock-in mouse with single-nucleus RNA-seq identifying fibroblasts as the most transcriptionally disrupted cell population) which was verified via just verify-datasets and added as a datasets: entry -- not as a full animal_models entry, since AnimalModel.publication requires a PMID and no peer-reviewed publication for this 2026 GEO deposit could be found via PubMed search. Cross-checking the fresh deep-research report's body against the existing entry found it substantially corroborated already-cited content, but surfaced two genuinely new, previously-uncited primary sources (fetched and verified before use, both full-text): PMID:36421833 (Jaffey et al. 2022, a natural canine dermatosparaxis model reporting two ADAMTS2 genotypes with strikingly different severity -- a truncating allele in 6 dogs all euthanized by 13 weeks vs. a catalytic-domain missense allele in a dog surviving 9+ years) and PMID:42261541 (a 2026 case report of an adolescent with dEDS presenting with hemorrhagic complications despite entirely normal coagulation studies). Added the canine model as a new animal_models entry (modeled_mechanisms -> Hieroglyphic Collagen Fibril Assembly, extending the ultrastructural phenotype to tendon/ligament beyond the dermis already characterized in the bovine model), explicitly preserving the source paper's own hedging that euthanasia timing for the truncating-allele puppies reflected owner discretion rather than a measured biological endpoint -- this was then woven into the existing deds_mild_phenotype_molecular_basis_unexplained discussion's rationale as a cross-species data point that parallels but does not resolve the human ascertainment-vs-biology question. Added the case report's coagulation-testing nuance as a new diagnosis: entry (normal coagulation panel/factor assay/thromboelastometry does not exclude disease-related bleeding). Considered and declined the report's large phenotype-frequency table (hypertrichosis, pes planus, additional ocular/dental findings, etc.) since it draws from the same underlying source (Van Damme et al. 2016 = PMID:26765342) already exhaustively and deliberately mined by the entry's existing curator with documented methodology in its notes: field: re-deriving frequency bands from a table the falcon report merely re-quotes would not add information and risked contradicting the existing curator's already-careful frequency-sourcing decisions. Revalidated with: just validate (schema/term/reference, 73/73 snippets verified), just validate-disorders (CI-authoritative batched gate, passed), just check-causal-targets (0 new dangling targets), just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-snippet-length (whole-KB, exit 0), and just list-gene-term-mismatches (0 mismatches across 4 gene bindings). Compliance (just compliance): 90.6% global / 90.4% weighted (essentially unchanged from the pre-existing 91.0%/91.5%, since most additions populated previously-empty optional slots such as datasets: alongside new required fields). Note: an unrelated, unexplained stray file references_cache/GEO_GSE130749.md (a testis-development CBX2/Wnt dataset with no connection to EDS or this session's work) appeared in the working tree during this session; it was not referenced by either deep-research report and was left uncommitted/unstaged rather than included here.

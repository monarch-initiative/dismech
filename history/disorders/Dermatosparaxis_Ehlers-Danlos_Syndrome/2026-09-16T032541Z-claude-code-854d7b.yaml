  summary: Add the second ovine ADAMTS2 model and the third in-frame exon-skip allele
  details: |
    Follow-up on PR #11770, which was opened against issue #9965 after PR #10177 had
    already been opened for the same issue. #10177 merged first and landed three of the
    four items #9965 listed - the biochemical block with a READOUT_OF link, the in-frame
    exon-skipping variants entry, and the 2016 revised diagnostic criteria - plus the
    V15M half of the fourth, which asked for two ovine models. So #11770's content is now
    duplicated by the entry it would be merged into. The one thing neither PR landed is
    the other ovine model, PMID:28856769, and that is what this session adds.

    #10177 deliberately left it out: the reference has no abstract (content_type:
    unavailable), so no evidence snippet can be quoted for it, and its body proposed
    that a curator with journal access add it later from full text. Re-running the
    fetcher this session reproduced content_type: unavailable, confirming the cache is
    accurate rather than stale, and the full text is paywalled. The model is added here
    with no evidence quote on the mechanism link, with the missing source text, the
    unrecoverable allele, and the unrecorded zygosity all stated in the model notes and
    in the link's limitations - the handling the reviewer of #11770 endorsed for this
    exact reference. ModelMechanismLink.evidence is recommended rather than required,
    and only FAILS_TO_RECAPITULATE links must be substantiated, so a RECAPITULATES link
    with fidelity UNKNOWN and an explicit caveat is schema-legal as well as honest. The
    opposing call - leave the model out until someone can quote it - is recorded in the
    notes so a curator can reverse this by deleting one list entry.

    Also added PMID:28856769 to the top-level references block, with the title copied
    verbatim from the cache frontmatter.

    The same review of #11770 raised one content point that #10177's merged version does not
    cover either: the in-frame exon-skipping class has three members, not two. PMID:26765342's
    survey of every biallelic ADAMTS2 allele known before it lists a homozygous in-frame skip of
    exon 17, attributed to Solomons et al., alongside the exons 3-5 and exons 14-16 alleles that
    the variants entry already characterised from PMID:15373769. The entry name and description
    now say three, with that survey sentence quoted as the evidence. It is graded HUMAN_CLINICAL
    with quote_role BACKGROUND, because the sentence attributes each allele it lists to another
    publication and so is not this paper's own result. Solomons et al. is not cited directly - it
    is not in references_cache/ and nothing was fetched this session - so the exon 17 allele rests
    on the 2016 paper's report of it, which is what the snippet and explanation say. Renaming the
    variants entry is safe: nothing in kb/ or history/ referenced its old name.

    Validation: just validate on the entry passes schema, term, and reference checks
    with 68/68 snippets verified; check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms and check-enum-values pass on the file;
    the whole-KB folded-hyphens, snippet-length, title-snippets and snippet-grading
    gates pass with no new baseline entries.

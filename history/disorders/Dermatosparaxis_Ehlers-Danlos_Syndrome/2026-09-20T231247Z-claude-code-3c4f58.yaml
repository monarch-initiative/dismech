  summary: 'Merge main: keep #11899 curation, port ovine nonsense-allele model'
  details: |
    Conflict resolution merging origin/main into PR #11770. While this PR was open, #11899 curated six EDS subtypes including this one and independently covered nearly everything this branch added, generally in better-structured form: the biochemical marker now carries readouts (so it reaches the pathograph), cell_types and presence INCREASED, which were this PR's two blocking review items plus two suggestions; the in-frame exon-skipping alleles moved from prose into a structured top-level variants section; and the 2016 revised diagnostic criteria definition is present. Main also added datasets and a canine model this branch lacks. Resolution therefore takes main's version of the entry wholesale rather than reconciling hunk by hunk. The one contribution of this branch not represented on main is ported: the White Dorper sheep ADAMTS2 nonsense allele (PMID:28856769), a second independent ovine allele alongside main's V15M catalytic-domain missense model, giving a within-species null-versus-residual-activity contrast. The reference cache for it was already committed on main but uncited. That cache file has no abstract, so consistent with the evidence SOP and with the original review's assessment of this handling, no snippet was manufactured from the title: the link carries fidelity UNKNOWN, no evidence item, and a limitations string plus notes disclosing that the record is title-and-MeSH level only. Validated on the merge result: just validate (73/73 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys all pass. Still open and not addressed here: the review's suggestion of a third in-frame skip allele (exon 17), which main's variants entry does not list.

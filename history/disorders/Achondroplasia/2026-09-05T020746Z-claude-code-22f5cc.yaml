  summary: 'Integrate assessed OpenScientist findings: cilia branch, receptor refinement,
    arm-attribution gaps'
  details: |
    Integrated the RETAINED and QUALIFIED claims from the codex assessment of the OpenScientist report for hypothesis canonical_fgfr3_gain_of_function_chondrocyte_model (kb/hypotheses/Achondroplasia/canonical_fgfr3_gain_of_function_chondrocyte_model/openscientist.md). No new assessment sidecar was written because openscientist-assessment-by-codex.yaml already exists.

    Added: (1) PMID:20624921 evidence on the mechanistic_hypotheses entry, supporting the receptor-activation refinement claim that the gain of function comes from increased phosphorylation probability of unliganded dimers rather than increased dimerization. (2) PMID:8630492 evidence on the trigger pathophysiology node plus an Fgfr3-null animal_models entry, supplying the reciprocal-overgrowth genetic argument; the report had attributed this to PMID:11742142, a behavioural study, which the assessment rejected. (3) A humanized FGFR3 p.Gly380Arg knock-in animal_models entry (PMID:28230213) with a RECAPITULATES modeled_mechanisms link to the endochondral ossification node, carrying fidelity, limitations, and a femur-versus-body-length readout whose target repeats the link target. (4) A new pathophysiology node, Primary cilium shortening and disrupted ciliary signaling, with an incoming DIRECT edge from Prolonged FGFR3 signaling and an outgoing INDIRECT_UNKNOWN_INTERMEDIATES edge to Growth-plate chondrocyte dysregulation, evidenced by PMID:29040558, PMID:29360984 and PMID:35078974; the node prose declines the ciliopathy classification, per the QUALIFIED disposition. (5) Pivotal phase 3 vosoritide evidence (PMID:32891212, two items including the investigators own final-height caveat) and PK/PD target-engagement evidence (PMID:34431071) on the CNP-NPR2 treatment link. (6) Three KNOWLEDGE_GAP discussions: signaling-arm attribution (KG-1, with a combination CNP-analogue plus CDK8-inhibitor proposed experiment, citing PMID:39674288 and PMID:40373614), unquantified ciliary contribution (KG-3, PMID:35078974), and unresolved statin rescue mechanism (KG-7, PMID:28583899).

    Deliberately not integrated: PMID:7913883 (duplicates the recurrent-G380R genotype already evidenced by PMID:7847369); PMID:34341520 (the 104-week open-label extension the assessment rejected as mischaracterized as an RCT, and superseded in this entry by the six-year extension PMID:39740666); every REJECTED claim, namely the accelerated-terminal-differentiation summary, the vosoritide STAT1-nonrescue inference, the Delphi 92 percent figure, the Dkk1 midface extrapolation, the CREB resting-zone depletion direction, the malformed PMID:48048522, and the report's proposed CL and GO identifiers, several of which name unrelated concepts. No status change to the CANONICAL hypothesis, as the report itself recommends retaining it.

    Verified with linkml-validate against the Disease class, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and count-verified-snippets (189/191, 2 skipped by prefix, none unverified).

  summary: 'Review: add trigger-node conformance and the phase 3 infigratinib result'
  details: |
    Two findings from the FGFR-Related Skeletal Dysplasias grouping review.

    Structural: Achondroplasia was the only grouping member whose trigger node did not carry conforms_to against fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation. This was invisible to check-groupings because the grouping evaluator matches CONFORMS_TO_MODULE on the module stem only and ignores the #Node anchor, so the entry reported SATISFIED on the strength of its other three anchors. Added the anchor on "FGFR3 p.Gly380Arg gain-of-function with impaired receptor down-regulation".

    Content: added infigratinib, the first FGFR-receptor-directed therapy to reach phase 3 in this disease (PMID:42370681, N Engl J Med 2026), as a treatment with target_mechanisms INHIBITS on "Prolonged FGFR3 signaling in growth-plate chondrocytes" - deliberately distinguished from the vosoritide/navepegritide CNP arm, which acts on a parallel counter-regulatory pathway rather than on the receptor itself. Curated with both caveats the trial reports: the upper-to-lower body segment ratio (the disproportion measure) did not change, and safety beyond 52 weeks is uncharacterized for a pan-FGFR1-3 agent in children. Added the PROPEL 3 trial (NCT06164951) as a clinical_trials entry.

    Validation: just validate PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 173/175 verified, 2 skipped by prefix (the FDA label url: references).

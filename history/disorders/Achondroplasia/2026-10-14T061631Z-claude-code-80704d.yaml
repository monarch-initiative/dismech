  summary: 'Re-curate: Achondroplasia'
  details: |
    Updated the entry for the current therapeutic landscape and outcome data. Treatments: bound navepegritide to NCIT:C188658 and added therapeutic_modality (PEPTIDE) and dosing intervals for both CNP analogues; added the ACcomplisH phase 2 result and the 27 Feb 2026 first US approval for navepegritide; added the phase 2 infigratinib dose-finding result and removed an unsourced 'first drug' claim and 'constitutively active' wording that contradicted the entry's own receptor model; added vosoritide complication-rate (pooled trials vs natural history, PMID:42001280) and early foramen-magnum growth (PMID:42495828) evidence, both graded INDIRECT and worded as signals rather than proof of complication prevention. New treatment records for meclizine (phase 1b/2; phase 2 height velocity unchanged, recorded as REFUTE) and recifercept (development terminated after a phase 2 showing no effect, recorded as REFUTE). Clinical trials: PROPEL 3 status ACTIVE_NOT_RECRUITING -> COMPLETED per ClinicalTrials.gov; added NCT03197766 (vosoritide phase 3), NCT04085523 (ACcomplisH) and NCT05598320 (APPROACH; registry lists phase 2/3, title says 2b, recorded PHASE_II). Genetic: backfilled ClinGen DEFINITIVE gene_disease_validity for FGFR3. Added clinical_burden HIGH and mortality evidence (Wynn 2007 42-year follow-up; Hashmi 2018 multicenter; Simmons 2014 infant cohort) to progression. Obesity: added abdominal-adiposity and systematic-review evidence and a sequela edge to spinal canal stenosis from GeneReviews. Tagged the GeneReviews chapter and completed the top-level references list. Deep research: falcon failed (Edison 503 authentication); perplexity disconnected twice and succeeded on a third run (research/Achondroplasia-deep-research-perplexity.md, preflight-dr PASS, 5/5 references resolved). The report added little quotable content beyond the primary sources used; its claims of ligand-independent constitutive activation and near-normal life expectancy were not adopted because they conflict with cited primary data. Validated with just validate, validate-terms, count-verified-snippets (246/246), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, the snippet/title/grading/retired-prose/block-scalar/reference-title gates, check-gene-validity, clinicaltrials-status-audit (0 drift) and validate-disorders (all passed).

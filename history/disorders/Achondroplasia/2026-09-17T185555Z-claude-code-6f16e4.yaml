  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist integration sweep (branch os-review-fable) that never merged, rebased onto current main rather than merged. All eleven outstanding citations still belonged and were applied; none was already covered by main under a different paper. Snippets were re-derived and re-verified against the references_cache records as they stand now (ten of the eleven records were absent and were fetched with just fetch-reference; four came back with full text where the earlier sweep had only abstracts), and all sixteen quoted sentences are exact substrings of the current cache. Added: PMID:20624921 to the canonical hypothesis evidence, attributing the gain of function to a higher phosphorylation probability within unliganded dimers rather than to increased dimerization, which is a different receptor-level claim from the ligand-dependence and delayed-down-regulation claims main already carried from PMID:10611230. PMID:8630492 to the FGFR3 p.Gly380Arg trigger node plus a new Fgfr3-null animal-model entry, supplying the reciprocal-overgrowth argument for FGFR3 as a negative regulator of endochondral bone growth; the earlier provider report had attributed this argument to the wrong paper. A new pathophysiology node, Primary cilium shortening and disrupted ciliary signaling, between Prolonged FGFR3 signaling in growth-plate chondrocytes and Growth-plate chondrocyte dysregulation, with PMID:29040558 on the incoming edge and node, PMID:29360984 on the node, and PMID:35078974 on the outgoing edge, which is marked INDIRECT_UNKNOWN_INTERMEDIATES; its description explicitly declines the ciliopathy classification the provider report proposed, and PMID:29360984 is graded MODEL_ORGANISM because the in vivo arm behind its ciliopathy title is an Fgfr3 mouse. A humanized FGFR3 p.Gly380Arg knock-in mouse (PMID:28230213) with a RECAPITULATES link and a femur-versus-body-length readout against Impaired endochondral ossification and chondrodysplasia. The vosoritide entry gained its pivotal phase 3 trial (PMID:32891212, both the placebo-adjusted growth-velocity result and the investigators own final-height caveat) and target-engagement data (PMID:34431071, urinary cGMP and the CXM biomarker) on the CNP-NPR2 mechanism link. Three knowledge-gap discussions: signaling-arm attribution (PMID:39674288, PMID:40373614) with a combined CNP-analogue plus CDK8-inhibitor experiment, the unquantified ciliary contribution (PMID:35078974), and the unresolved statin-rescue mechanism (PMID:28583899). All three are new topics; main's four existing discussions are phenotype-mechanism gaps and do not overlap. Node names main uses were unchanged from the base both versions diverged from, so every re-applied item landed on its original target. No prose on main needed correcting: the earlier sweep was purely additive for this entry, and the corrections it made travel inside the new node description and discussion rationales. No assessment sidecar was copied; kb/hypotheses/Achondroplasia/canonical_fgfr3_gain_of_function_chondrocyte_model/assessments already holds a pre-existing assessment by another assessor. Ontology bindings reuse only CURIEs already in this repo's caches (CL:1000217, GO:0060271, GO:0042073, GO:0007224, all present in terms.csv and in the celltypeterm and biologicalprocessterm enum caches). Validated with linkml-validate against Disease (no issues), count-verified-snippets (219/219), check-duplicate-keys, check-entity-refs, check-causal-targets, and check-enum-values, all clean.

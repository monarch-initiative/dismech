  summary: 'Reviewed and enhanced Ovarian_Mucinous_Carcinoma with category: Cancer, UBERON/CL/GO annotations with molecular_function modifiers across pathophysiology nodes, causal and sequelae edges to phenotypes, refined IHC diagnosis evidence, treatment modalities and target_mechanisms, and classifications.'
  details: 'Completed review and enhancement of Ovarian_Mucinous_Carcinoma: - Set category to Cancer (from Complex). - Added UBERON ovary location, CL epithelial cell types, GO biological_processes, and GO molecular_functions with directionality modifiers (GTPase activity DECREASED, transmembrane receptor protein tyrosine kinase activity INCREASED, protein kinase activity INCREASED, cyclin-dependent protein serine/threonine kinase inhibitor activity DECREASED, DNA-binding transcription factor activity DECREASED) across pathophysiology nodes. - Connected Invasive Mucinous Carcinoma to Ovarian Carcinoma and Ovarian Mass via downstream edges, and linked Ovarian Mass to Abdominal Distension and Abdominal Pain via phenotype sequelae edges. - Refined Immunohistochemical Profiling in diagnosis to distinguish SATB2 negativity (vs GI metastasis) from CDX2 positivity and WT1/ER/PR absence (vs serous and endometrioid ovarian carcinomas) with supporting quote from PMID:33919741. - Added therapeutic_modality and target_mechanisms to treatments and ICD-O morphology (Adenocarcinoma) to classifications.'

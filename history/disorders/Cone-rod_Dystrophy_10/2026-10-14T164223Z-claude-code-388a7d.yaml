  summary: 'Edit: Cone-rod_Dystrophy_10 (OpenScientist deep research)'
  details: |
    Ran OpenScientist deep research (research/Cone-rod_Dystrophy_10-deep-research-openscientist.md) in place of Falcon, which could not run because Edison had a service outage (#14154). The report found no SEMA4A patient clinical data, no family reported after 2006, and no new human evidence on the D345H/F350C genotype. All 16 of its references resolved, and its four core sources were already cited. Added Photophobia (HP:0000613) and Abnormal full-field electroretinogram (HP:0030466) as class-level phenotypes quoting PMID:29555955, marked BACKGROUND and INDIRECT like the entry's other symptom phenotypes. Linked photoreceptor degeneration to the ERG phenotype with Sema4a-null mouse evidence (PMID:15277503). Report claims not used, with the reasons: AAV gene transfer (PMID:23360997 used lentiviral vectors); SEMA4A as HGNC:10730 (it is hgnc:10729); founding variants called heterozygous/dominant (the abstract of PMID:16199541 does not say this, and the entry follows PMID:28805479); UBERON:0002423 for macula (that ID is the hepatobiliary system); and class-level epidemiology, therapy and differential-diagnosis papers that say nothing about SEMA4A. preflight-dr returned WARN only because it counted RPE (retinal pigment epithelium) as a gene. Validated with just validate, validate-terms, count-verified-snippets (40/40), check-entity-refs and check-causal-targets.

  details: |
    New entry for cone-rod dystrophy 10 (MONDO:0012464, SEMA4A), curated from the stub queue.

    Deep research: falcon was requested by default but could not run in this environment. The Edison API host (api.platform.edisonscientific.com) was refused by the session network proxy (HTTP 403 on CONNECT), and the --fallback rerun did not switch providers because the authentication exception was not treated as fallback-worthy. The claude_code provider was used instead (research/Cone-rod_Dystrophy_10-deep-research-claude_code.md). Its references all resolved (3/3). Its term-validation needs_review flag came from the report calling MONDO:0012464 'not obsolete', which is not a mislabel. just preflight-dr returned WARN: PITPNM3 is mentioned only to disambiguate it from CORD5. The report carries no verbatim quotes, so every snippet was taken from references_cache after just fetch-reference. PubMed searches for SEMA4A in retinal disease returned 16 records, and the primary papers were read directly.

    Content: the human evidence is one 2006 screen (PMID:16199541), so the entry records the weak gene-disease relationship explicitly. ClinGen has no retinal SEMA4A record; its only SEMA4A record is Disputed for Lynch syndrome. p.Arg713Gln is recorded as unlikely to be pathogenic (PMID:28805479). The mechanism chain runs from SEMA4A missense variants through protein misfolding and mislocalisation to impaired RPE endosomal sorting, with two branches (prosaposin exosome release, retinoid-binding protein sorting), ending in photoreceptor degeneration. It is built from mouse knock-in and null studies (PMID:15277503, 22465952, 23360997) and in vitro data (PMID:22956603). The finding that the patients' D345H/F350C compound genotype does not reproduce disease in mice is recorded as a FAILS_TO_RECAPITULATE model link and a HUMAN_MODEL_MISMATCH discussion. Class-level CRD symptoms are cited from the introduction of PMID:29555955 and marked quote_role BACKGROUND and directness INDIRECT. The RP35 rod-cone presentation was moved to notes rather than asserted as a phenotype. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER).

    Validation: a subagent ran a pre-PR review and its fixes were applied. Fixes: R713Q wording, a description misstatement about null mice, the gene-therapy target retargeted to Photoreceptor Degeneration, edge evidence added, evidence_source corrected to IN_VITRO for a co-expression assay, photophobia dropped. After the fixes, just validate-disorders passed (37 snippets, 0 issues), as did just validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading, check-snippet-length and check-duplicate-keys.

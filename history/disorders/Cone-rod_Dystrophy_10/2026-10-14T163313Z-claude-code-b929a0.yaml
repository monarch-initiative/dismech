  summary: Fix CI gene-grounding gate and take review suggestion
  details: |
    CI on PR 14155 failed the whole-repo gate check_gene_activity_grounding. SEMA4A was wired into the pathograph on a node with no molecular function. The fix binds GO:0030215 semaphorin receptor binding on the SEMA4A variant node, with no modifier. The structural model in PMID:23360997 places F350 away from the plexin-binding surface, so the entry does not claim that receptor binding is lost. The node description says this. The fix also takes one optional suggestion from the automated review: evidence on the Photoreceptor Degeneration to Cone/cone-rod dystrophy edge, from PMID:23360997, marked INDIRECT because it is cross-species. The suggestion to cite PMID:16199541 for inheritance was not taken, because that abstract does not state the mode of inheritance. OMIM and Orphanet mappings were not added. Validation: validate-disorders passed, count-verified-snippets 38/38, and check_gene_activity_grounding, check_snippet_grading and check_snippet_length passed against origin/main.

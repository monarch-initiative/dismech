  details: |
    Created the intestinal tuberculosis entry (MONDO:0001678) from PubMed searches and research/Intestinal_Tuberculosis-deep-research-claude_code.md (the second claude_code run; the first exited 4 and was deleted). Covers swallowed, hematogenous, contiguous and M. bovis dairy routes with a cattle host; M cell and Peyer's patch invasion with ileocecal predominance; caseating granulomatous inflammation (conforms to granuloma_formation) leading to transverse ulceration, pseudotumour, fibrotic stricture, mesenteric arteritis and caseating mesenteric lymphadenitis; 17 phenotypes with frequencies only from intestinal-only series; the ulcerative, hypertrophic and ulcerohypertrophic forms as subtypes; a Crohn disease differential bound to MONDO:0005011 with the Lee colonoscopic score, the meta-analytic Bayesian model, PCR, Xpert and IGRA meta-analyses and the empirical antituberculous trial as diagnosis rows; and six-month chemotherapy supported by three randomized trials, surgery and strictureplasty. Scope boundaries with Tuberculous_Peritonitis, Esophageal_Tuberculosis, Hepatic_Tuberculosis and Oral_Tuberculosis are recorded in notes. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

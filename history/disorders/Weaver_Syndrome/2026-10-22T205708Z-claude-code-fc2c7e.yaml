  details: |
    Takes the optional suggestion in the AI review of #15259: the 'Neuroblastoma Surveillance' description repeated most of what its evidence explanations already say. The two AACR sentences added in #15259 are cut to one: neuroblastoma screening is warranted in Weaver syndrome, no other tumour screening is recommended, and the recommendations use the North American 1% risk threshold where Europe typically uses 5%. The referral to the companion Kamihara et al. article and the note that no Wilms tumour or hepatoblastoma has been reported stay in the evidence explanations. No evidence item, grading or other section changed. Validated with just validate, count-verified-snippets --strict and the offline gates.

  summary: 'Edit: Weaver_Syndrome - neuroblastoma risk and surveillance from the 2024
    AACR update'
  details: |
    Adds the 2024 AACR Pediatric Cancer Working Group surveillance update (Kalish et al., PMID:39320341; PMC full text already committed in references_cache) to the neuroblastoma content of Weaver syndrome, as part of the neuroblastoma curation project (#14976, slate item P-b Weaver).

    Phenotype 'Neuroblastoma Predisposition': frequency OCCASIONAL; one phenotype-level evidence item (neuroblastoma is the most common malignancy reported in the syndrome, seven patients in total); a phenotype_contexts row carrying the update's '~9% (5/56)' figure from the largest review, with the caveats that the update does not cite that review and that five cases in one review's cohort give an imprecise estimate. The OCCASIONAL band follows that point estimate and is described as provisional.

    Treatment 'Neuroblastoma Surveillance': the GeneReviews (June 2025) sentence is kept word for word; three PMID:39320341 items added - screening for neuroblastoma is warranted and no other tumour screening is recommended (no Wilms tumour or hepatoblastoma reported); the workshop recommendations follow North American healthcare culture (1% risk threshold, Europe typically 5%); the update's guidelines use the 1% threshold. The last two are INDIRECT because the quoted sentences do not name Weaver syndrome or neuroblastoma.

    Not changed: action_category MONITORING (no target_phenotypes, as removed in #8337), the knowledge-gap discussion on the missing sympathoadrenal mechanism, and the pathograph. The companion AACR neuroblastoma article (PMID:38860978) is not cited: its abstract does not mention Weaver syndrome and no open full text is available.

    Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates (duplicate keys, entity refs, causal targets, coarse phenotypes, snippet grading, folded hyphens, block-scalar comments, snippet length, title snippets, retired-support prose, reference titles).

  summary: 'Review: Weaver Syndrome evidence and mechanism'
  details: |
    Completed a full claim-by-claim review against the existing Falcon research
    artifact, the current cached GeneReviews chapter, cached primary literature,
    and current literature and ontology checks through 2026-08-08.

    Corrected the inheritance record to state that both inherited and de novo
    EZH2 pathogenic variants occur but the de novo proportion is unknown; added
    the autosomal-dominant term, variable expressivity, reproductive options,
    structured qualitative prevalence, and age-dependent recognition evidence.
    Removed the unsupported genetic frequency qualifier and bounded p.Arg684Cys
    and dominant-negative claims to the studies that actually support them.

    Rebuilt the mechanism as an atomic EZH2/PRC2 catalytic-activity to
    H3K27me2/3/chromatin to cPRC1/gene-derepression chain. Replaced the prior
    osteoblast-to-multisystem wiring with partial clinical edges explicitly
    marked INDIRECT_UNKNOWN_INTERMEDIATES, retained the p.R684C osteoblast
    result as model-organism evidence, and added a HUMAN_MODEL_MISMATCH with a
    proposed human allelic-series experiment. Neuroblastoma remains intentionally
    unwired from the molecular graph behind a KNOWLEDGE_GAP and a proposed
    sympathoadrenal-lineage experiment rather than an unsupported causal edge.

    Corrected the hypertelorism and abnormal-muscle-tone phenotype bindings,
    removed a misleading mild-severity restriction from variable intellectual
    disability, and added supported congenital/infantile onset qualifiers. Moved
    the PRC2 methylation episignature from biochemical findings into adjunctive
    diagnosis, added the defining molecular diagnosis, tightened the Sotos
    differential, separated developmental support from physical therapy, and
    expanded counseling, routine follow-up, specialist care, and qualified
    neuroblastoma surveillance to match the cited GeneReviews text exactly.

    Validation passed with `just validate-disorders` (schema, terms, references;
    80/80 snippets verified), scoped causal-graph validation, and standalone
    schema and term checks. Connectivity is 15/16 phenotypes by design, with
    neuroblastoma represented as the explicit unresolved gap, and 1/1 causal gene
    is wired to mechanism. Recommended-field compliance is 95.4% global and
    95.9% weighted. Repository-wide reference-cache normalization churn from the
    validator was restored; no cache file is part of this review.

  summary: Add three human hepatocyte NAMs (R778L and H1069Q iPSC hepatocyte-like
    cells, prime-edited liver organoid) linked to the ATP7B trafficking node
  details: |
    Structured NAM linkage for dismech#802. Added modeled_mechanisms (target, relationship, fidelity, model_scale, limitations, PMID-quoted evidence and readouts) so the model reaches the pathograph instead of sitting as a disconnected list entry. Validated with just validate, just count-verified-snippets and just validate-terms; evidence snippets are exact quotes from the cached abstracts. Three models all target ATP7B Copper-Trafficking Defect: PMID:21593220 (R778L iPSC-HLCs, mislocalisation and defective copper transport with lentiviral/curcumin rescue readouts), PMID:29674751 (H1069Q iPSC-HLCs, ERAD-driven loss with a CONTESTED_ASSUMPTION divergence against the overexpression-based ER-retention model) and PMID:33097693 (patient liver organoids, RESCUES by prime editing, fidelity UNKNOWN because the abstract does not name the assay). The hepatic organoid previously existed only as a proposed experiment under discussions.

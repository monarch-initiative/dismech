  summary: Add ATP7B c.1707+2dupT splice-site variant
  details: |
    Adds the intron 4 ATP7B splice-site variant c.1707+2dupT (NM_000053.2) to genetic[].variants, sourced entirely from PMID:42631261 (first reported homozygous case). Review round 1 corrections applied in this session: clinical_significance lowered from PATHOGENIC to LIKELY_PATHOGENIC, because the paper twice classifies the variant as likely pathogenic and only argues that the case supports a future reclassification to pathogenic; the previously uncited splice-donor mechanism was given its own evidence item and promoted into a structured functional_effects entry with type loss-of-function; the description was corrected to stop claiming that all three previously reported compound-heterozygous cases had late presentation (one was an asymptomatic child diagnosed at 8 years) and to state the source's absolute finding of no neurologic or ocular involvement rather than hedging it; and the predicted consequence now carries the source's own 'potentially' and its frameshift/premature-stop step. Validated with just validate (passed) and just count-verified-snippets (294/294 verified).

  summary: 'Gene-family review: ATP7B'
  details: |
    ATP7B modelling re-reviewed against its normal function (Cu(I)-transporting P1B-type ATPase of the hepatocyte trans-Golgi network that loads copper onto apoceruloplasmin and, when copper rises, moves to a post-Golgi compartment for biliary excretion). The three ATP7B nodes bind GO:0140581 P-type monovalent copper transporter activity as DECREASED, which is correct. The Impaired Ceruloplasmin Loading node also carried GO:0004322 ferroxidase activity with ATP7B as its only gene; that activity is ceruloplasmin's (lost because apoceruloplasmin receives no copper), so the node now names CP (hgnc:2295) beside ATP7B and its description says whose activity it is. The ATP7B genetic record's inheritance block is now bound to HP:0000007 Autosomal recessive inheritance, matching the disease-level block. ClinGen Definitive (CGGV:assertion_f0ac0a41-d7d5-4377-a622-1ee9bc4ed9f3-2019-03-27T160000.000Z) was already recorded. Liver Cirrhosis types ATP7B as RISK_FACTOR with a note explaining why; that was left unchanged. Evidence already cited for the loading step: PMID:16382340, PMID:11961729.

  summary: Add 12 phenotype entries filling Orphanet/snippet-identified gaps
  details: |
    Phenotype-completeness review of Wilson disease against the Orphanet ORPHA:905 HPO table (the entry backbone source) found 10 curated rows unaccounted for, plus 2 phenotypes named in the entry's own multiply-quoted PMID:38731973 evidence snippet but never modeled. Added 9 evidence-backed phenotypes: aminoaciduria (HP:0003355), nephrolithiasis (HP:0000787), hypoparathyroidism (HP:0000829, with GeneReviews endocrine-involvement corroboration), infertility (HP:0000789), hallucinations (HP:0000738), pancreatitis (HP:0001733), insomnia (HP:0100785, GeneReviews + Orphanet), osteomalacia (HP:0002749), and rhabdomyolysis (HP:0003201). Added 3 further Orphanet rows as context-only documented exclusions following the file's existing adjudication pattern (no base frequency; Orphanet band retained as phenotype_contexts): abnormality of the hand (HP:0001155), back pain (HP:0003418), amplification of sexual behavior (HP:5200321). All evidence quotes pre-verified against cached references (ORPHA:905 rows, PMID:38731973 snippet already validated elsewhere in the file, PMID:20301685 GeneReviews). Phenotype count 59 to 71. Validation: linkml-validate no issues; term validation passed; reference validation passed.

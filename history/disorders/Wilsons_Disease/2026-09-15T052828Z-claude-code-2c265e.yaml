  summary: Add ATP7B c.1707+2dupT splice-site variant
  details: |
    Adds the ATP7B c.1707+2dupT intron 4 splice-site variant to the ATP7B genetic entry, from PMID:42631261 (Alkhateb et al., ACG Case Rep J 2026), the first reported homozygous case. Also addresses the ai4c-reviewer CHANGES_REQUESTED round. (1) Fetched and committed references_cache/PMID_42631261.md, which was cited by the new evidence items but never committed; its absence was the cause of the failing test (3.13) job, where the validator could reach only the abstract and could not find the Discussion-sourced snippet. (2) clinical_significance corrected from PATHOGENIC to LIKELY_PATHOGENIC: the source reports the reporting laboratory's likely-pathogenic call and then argues for an upgrade, and an argument for reclassification is not a reclassification. The bare phrase 'class 2' is now attributed to the reporting laboratory's own scheme, with an explicit note that ACMG class 2 is likely benign, so a reader cross-referencing the number against ClinicalSignificanceEnum is not misled. (3) The genotype-phenotype sentence had rendered the source's 'younger onset presentation' as 'predominantly hepatic manifestations', dropping the one element this patient contradicts; restated faithfully and recorded as an exception, with the authors' residual-activity qualification cited as a REFUTE item. (4) Five uncited description claims now carry evidence: the variant-specific splice mechanism sentence, the three-cases-worldwide rarity claim, the classification claim, the association as stated, and its qualification. The general splice-site mechanism snippet stays, but as background rather than as the variant-specific claim. (5) This history record. Suggestions taken: the n-of-1 case vignette (age, ceruloplasmin, urine copper, KF-ring status) was trimmed from the variant description; evidence item 1's explanation narrowed to what its snippet establishes; the type and functional_effects slots populated. Not taken: an identifiers entry. The KB convention for that slot is a ClinVar accession, the source supplies only the HGVS designation, and no ClinVar accession was located, so inventing one was declined and the reason recorded in the description. Validation: just validate (293/293 snippets verified, up from 286/288 with 2 uncached), just validate-terms, just check-enum-values, just check-entity-refs, just check-duplicate-keys all pass.

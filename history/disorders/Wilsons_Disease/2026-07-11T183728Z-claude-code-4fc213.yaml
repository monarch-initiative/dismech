  summary: Manual claim-by-claim evidence review of Wilson disease entry
  details: |
    Thorough, manual (non-scripted) claim-by-claim evidence review of the
    Wilson disease entry, verifying for every evidence item that (a) the
    snippet is an exact substring of its cached source and (b) the excerpt
    genuinely supports the attached claim.

    Scope covered: inheritance; 3 prevalence records; 6 mechanistic_hypotheses
    (canonical copper-retention, oxidative-mitochondrial, neurodegenerative
    movement, cuproptosis, ferroptosis, liver-derived neuroinflammation);
    the full pathophysiology causal chain (ATP7B defect -> impaired biliary
    excretion / ceruloplasmin loading -> hepatic copper accumulation ->
    systemic distribution -> hepatocyte injury -> stellate activation/ECM ->
    neurodegeneration -> cuproptosis/ferroptosis) with all downstream edges;
    ~55 phenotypes; 4 biochemical markers; genetic (ATP7B); 8 treatments;
    2 discussions/knowledge gaps; and differential diagnoses.

    Verification method: read the cached abstract/record for each of the ~52
    distinct PMIDs, the ORPHA:905 structured record, and the ClinGen (CGGV)
    ATP7B/Wilson definitive assertion. Snippet substring matching was done
    with whitespace normalization to account for cache line-wrapping. Result:
    all 51 unique ORPHA:905 rows, the CGGV assertion, and every PMID snippet
    verified as exact substrings; explanations were judged to genuinely
    support their claims. Quantitative snippets (e.g. HF HR 1.55 / AF HR 1.29
    PMID:28947309; genetic prevalence 13.9/100k PMID:30254379; Korea
    3.06/100k PMID:38565173; UK 1:7026 vs 1:30000 PMID:23518715; RTA 56%
    PMID:31317233; hemolytic anemia up to 17% PMID:24577547) were checked
    against their sources. Model-vs-human evidence_source tags and the
    EMERGING/PARTIAL qualifiers on cuproptosis, ferroptosis, and the
    liver-brain axis were checked and found appropriate. No named-entity
    confusion or fabricated citation was found; the recent PMIDs (42155004
    2026 TMC phase-2 trial, 41230834, 41966025, 41480142, 41006805, 40104154
    AAV8 gene therapy) are all real and on-topic.

    Fixes applied in this review:
    1. Bipolar Affective Disorder phenotype snippet (from GeneReviews
       PMID:20301685) contained a plain space where the source has a
       non-breaking space (U+00A0) before the slash in
       "bipolar disorder / bipolar spectrum disorder" — it would fail strict
       substring validation. Trimmed the snippet to an exact-ASCII substring
       ("Psychiatric disturbances can include depression, bipolar disorder")
       and updated the explanation.
    2. Osteoporosis phenotype snippet (PMID:29110062) quoted the pooled
       OSTEOPENIA figure (36.5%) while labelled as osteoporosis; extended the
       snippet to include the osteoporosis pooled prevalence (27.7%) and
       corrected the explanation. (The osteopenia phenotype/edge that
       legitimately use the 36.5% figure were left unchanged.)

    Schema and term validation pass after edits (linkml-validate: no issues;
    term validator: passed). The deprecated prevalence.percentage and
    updated_date fields were intentionally left in place per the
    design-decisions register (removal deferred; existing entries may retain
    updated_date).

    Outstanding gaps filed as issue #6220 (not changed here, require new
    verified references): (1) renal Fanconi syndrome / generalized
    aminoaciduria (only RTA currently modeled); (2) the "face of the giant
    panda" midbrain MRI sign (only a generic brainstem T2 lesion modeled);
    (3) optional genotype-level case_fractions for p.H1069Q / p.R778L.

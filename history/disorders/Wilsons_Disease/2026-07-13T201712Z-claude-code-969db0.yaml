  summary: Add Renal Fanconi syndrome and giant panda sign to Wilson Disease
  details: |
    Added Renal Fanconi syndrome (HP:0001994) as a new Renal category phenotype with evidence from PMID:37415038 (explicit statement that Fanconi syndrome is a well-known WD renal complication) and PMID:23565442 (case report demonstrating phosphaturia, glycosuria, aminoaciduria, kaliuresis in Wilson disease). Enhanced the existing Focal T2 Hyperintense Brainstem Lesion phenotype with notes about the pathognomonic face-of-the-giant-panda midbrain MRI sign and evidence from PMID:16447770. All three new snippets verified as exact substrings of their fetched PubMed abstracts. Schema, term, and reference validation all pass.

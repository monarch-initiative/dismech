  summary: 'Review: add Harrison''s Part classifications (metabolism/GI/neuro/genetics)'
  details: |
    Second increment of the Wilson disease review. The classifications block carried only icimd_category (copper_metabolism) and no harrisons_chapter. Added four Harrison's Parts matching the multisystem IEM convention (cf. DPM2-CDG): ENDOCRINOLOGY_METABOLISM (primary — inborn error of copper metabolism), GASTROINTESTINAL (defining hepatic axis), NEUROLOGIC (defining neuropsychiatric/movement axis), and GENETICS_ENVIRONMENT_DISEASE (Mendelian AR), each with a notes rationale. Modules: fibrotic_response 2-node conformance (Mesenchymal Cell Activation, Excessive ECM Deposition) reviewed and left as-is — correct and sufficient; additional final-common-pathway module conformance (hemolytic anemia, osteoporosis, cardiomyopathy) would require promoting currently-leaf phenotypes to dedicated mechanism nodes and was not forced. Groupings: Wilson is already a member of Fibrotic_Disorders (correct); a copper-metabolism grouping is recommended separately. Re-validated: schema OK, 282/282 snippets.

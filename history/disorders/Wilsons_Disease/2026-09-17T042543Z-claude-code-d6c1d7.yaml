  summary: Calibrate the c.1707+2dupT variant record to its source
  details: |
    Review round (#11661) addressed four blocking items on the ATP7B c.1707+2dupT variant record. (1) clinical_significance was PATHOGENIC, contradicting both PMID:42631261 and the record's own description two lines above. The source assigns class 2 (likely pathogenic) and only argues for reclassification; a proposal in a single case report is not an established ACMG class 5 call. Changed to LIKELY_PATHOGENIC, with the authors' reclassification argument recorded in the description as an argument rather than as the current call. (2) The first evidence item's explanation led with 'First reported case of homozygous c.1707+2dupT' while its snippet was about the patient's age, absent KF rings and absent neuropsychiatric symptoms - a different proposition. Split into two items, each quoting the sentence that carries its own claim: 'Our patient represents the first reported case of homozygosity for this variant.' for homozygosity, and the original quote retargeted to the late-onset atypical presentation. (3) The description asserted that splice-site mutations give 'earlier and more severe hepatic presentations than missense-only genotypes'. The source makes two separate claims and the comparator was grafted from one onto the other: it says splice-site mutations 'often display an earlier and more severe phenotypic presentation, which is typically hepatic' with no comparator, and separately that they are associated with younger onset and FEWER neurologic manifestations than missense-only genotypes. The two claims are now separate and the unsupported severity comparison is gone. (4) Added this history record. Suggestions also taken: 5, the class 2 call is now attributed to the clinical genetic test report with the in silico splicing prediction stated separately; 6, the variant name drops the uninformative p.(?) and the splicing mechanism is now structured as type splice-site plus a functional_effects entry marked as predicted rather than measured; 7, the paper's quantitative late-onset sentence ('up to 8% of patients present after the of age 40 years' - the source's own typo, quoted verbatim) now lands on the progression Onset phase, which previously held only four qualitative Orphanet age categories; 8, the steatosis snippet starts at lowercase 'histological' so it is a literal substring. Suggestion 9 concerns the PR body and is left to the PR author. Note two sibling PRs, #11734 and #11754, curate this same variant into this same entry from the same paper; that overlap is a maintainer's call and is not resolved here.

  summary: 'GO term audit: backfill direction modifiers on pathway bindings'
  details: |
    Backfilled ModifierEnum values on GO biological-process and molecular-function bindings that recorded a process as involved without saying what happened to it. Each direction was read off the node's own description and evidence rather than assumed, and inserted line-wise so no other formatting changed. Part of a KB-wide GO audit of the 102 ICIMD-classified inherited metabolic disease entries, which found 78 of 645 pathophysiology-level bindings unmodified and concentrated in a handful of older files. Bindings that describe a preserved or normal background process were deliberately left unmodified, because ModifierEnum has no NORMAL/UNCHANGED value and absence is the only way to express that. The Ferroptosis node's GO:0097707 binding was deliberately left unmodified with an inline comment recording why: that node's own evidence is PARTIAL for human relevance and its description frames ferroptosis as an emerging possibility, so asserting INCREASED would claim more than the entry does. The Cuproptosis node did take INCREASED, because its cited model-organism evidence states the cuproptosis markers 'were upregulated in both liver tissue'. Validated with just validate-terms and just validate.

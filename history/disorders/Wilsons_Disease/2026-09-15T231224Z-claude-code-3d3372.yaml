  details: |
    Addresses the three blocking items in the ai4c-reviewer review on PR #11282 and resolves the merge conflict that had accumulated against main.

    Blocking 3 -- missing history record. This record is it; the PR touched kb/disorders/ without one.

    Blocking 1 and 2 -- both were resolved by main rather than by this branch. main has since gained its own curation of the same c.1707+2dupT variant block, and that version already carries clinical_significance: LIKELY_PATHOGENIC (the review's item 1) and an explanation that does not conflate the modified Leipzig diagnostic score with variant pathogenicity classification (item 2). It also goes further than this branch did: it adds a functional_effects block typing the predicted loss of function, an evidence item quoting 'classified as a class 2 likely pathogenic mutation' to source the LIKELY_PATHOGENIC value explicitly, and evidence for the age range of the three prior compound-heterozygous cases -- which answers the review's non-blocking point that the description asserted splice-site variants cause uniformly earlier presentations while the entry documents a 47-year-old. The merge conflict was resolved by taking main's version of all three conflicting hunks in full. Nothing from main was reverted.

    What this branch still contributes after that resolution is the MASLD-mimicry content, which main does not have: two evidence items on the Hepatic Steatosis phenotype documenting that Wilson disease steatosis is histologically indistinguishable from MASLD and was in fact mistaken for lean MASH in this patient, an explanatory notes block on that phenotype, and two progression evidence items sourcing late-onset presentation (up to 8% after age 40, 40-60% hepatic-first). Post-merge diff against main is 29 insertions in one file, no deletions.

    Validation on the merged tree: just validate-disorders passes (schema + terms + references), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and whole-KB check-snippet-grading all clean.

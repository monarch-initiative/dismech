  details: |
    PR Shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review on PR #7723. The review's IMPORTANT item 1 was a slot-semantics error: the two ATP7B records recorded per-ALLELE frequencies (p.H1069Q 19%, p.R778L 17.3%) in genetic.case_fractions, but GeneCaseFraction is explicitly defined as the share of patients whose disease is explained by a gene, and is explicitly distinct from population allele frequency. Wilson disease is monogenic, so ATP7B explains essentially 100% of cases and a 19% case fraction is false as modeled. Both records were moved into the existing genetic[].variants list as p.H1069Q and p.R778L Variant entries, carrying the same PMID:30576569 and PMID:18034201 evidence and identical exact snippets, and both were marked clinical_significance: PATHOGENIC. The case_fractions block was deleted. Per review item 2, the H1069Q description now states the denominator explicitly (at least one ATP7B mutation identified in only eight patients, so 19% is about 3 of 16 alleles) and warns that larger Central/Northern European series report substantially higher frequencies, with a second supporting evidence item quoting the denominator sentence. Per the review suggestions, the R778L description is phrased as an allele/mutation share rather than anything patient-denominated, and the stale free-text notes on the ATP7B genetic entry was refreshed to mention both founder alleles and to record that no case_fractions record applies to a monogenic disease. Validation: just validate (pre-edit hook) passed, just count-verified-snippets reported 282/282 snippets verified against cached references, and just validate-disorders passed. No reference cache files were created or edited; both PMIDs were already cached by the original session.

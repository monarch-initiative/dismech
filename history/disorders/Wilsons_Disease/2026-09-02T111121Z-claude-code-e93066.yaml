  summary: Integrate assessed OpenScientist findings across five Wilson disease hypotheses
  details: |
    Integrated the RETAINED and QUALIFIED claims from the five existing codex assessments of the OpenScientist hypothesis reports (canonical_atp7b_copper_retention SUPPORTED, oxidative_mitochondrial_injury_model SUPPORTED, ferroptosis_superimposition_model PARTIALLY_SUPPORTED, neurodegenerative_movement_model PARTIALLY_SUPPORTED, cuproptosis_model WEAKLY_SUPPORTED_UNRESOLVED). No new assessment sidecars were written; all five already existed.

    Added 19 evidence items, each with a snippet re-derived from the local reference cache rather than copied from the reports. Canonical model: ATP7B gene transfer restoring holoceruloplasmin (PMID:11961729) on Impaired Ceruloplasmin Loading; hepatocyte repopulation restoring biliary copper excretion (PMID:11273771) on Impaired Biliary Copper Excretion; post-transplant normalization of copper indices (PMID:17889170) on Liver Transplantation; Estonian biobank recall supporting underdiagnosis (PMID:39674827) on the sequencing-based prevalence record; the tetrathiomolybdate-versus-trientine randomized trial (PMID:16606763) on Tetrathiomolybdate. Oxidative-mitochondrial model: blinded paediatric ultrastructure comparison against NAFLD and autoimmune hepatitis controls (PMID:35603480) on Hepatocyte Injury; methanobactin (PMID:27322060) and chelation (PMID:37968102) rescue on the Hepatic Copper Accumulation to Hepatocyte Injury edge; ARBM-101 rescue (PMID:41349253) on the hypothesis entry, explained as unable to identify the downstream death route. Ferroptosis model: LEC-rat iron-deprivation and phlebotomy interventions (PMID:8770863, PMID:16737843) on the Ferroptosis node; the tx-J ceruloplasmin-to-iron bridge (PMID:31011744) as SUPPORT and the Atp7b-null non-significant hepatic iron result (PMID:20594231) as REFUTE on the hypothesis entry; plus a new KNOWLEDGE_GAP discussion gap_wilson_iron_dependent_ferroptosis_specificity attached to Ferroptosis and Hepatocyte Injury, carrying a ferrostatin rescue discriminating experiment and PMID:20603110 showing copper outperforms iron as a lipid and thiol oxidant. Neurodegenerative model: serum and plasma neurofilament light cohorts (PMID:35114010, PMID:33078859) and NLRP3 blockade in toxic-milk mice (PMID:33462188) on the Neurodegeneration node; post-transplant neurological recovery (PMID:40513300) and D2-receptor recovery after chelation (PMID:8208404) on the hypothesis entry, both scoped in their explanations to what the study designs support.

    Deliberately not integrated: cuproptosis_model needed nothing, because its two RETAINED claims are already curated (PMID:35298263 on the Cuproptosis node, and the human lipoylation-hallmark gap as the existing gap_wilson_cuproptosis_human_validation discussion), and every distinctive claim was REJECTED or NEEDS_VERIFICATION. The deep-brain-stimulation lead (PMID:35811746) was left out because the assessment QUALIFIED the mechanistic inference and adding a treatment entry exceeds what a surgical case series supports. The single-patient D2-SPECT report (PMID:1532631) was left out as redundant with the existing atrophy evidence. No ontology terms were added; every GO and CL mapping proposed by the four reports was REJECTED by its assessment as naming the wrong concept. No hypothesis status changes were made, matching the reports' own retain-status recommendations.

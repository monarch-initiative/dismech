  summary: Fix review blocking issues for c.1707+2dupT variant entry
  details: |
    Addressed four blocking review findings from ai4c-reviewer on PR #11464:

    1. Clinical significance corrected: Changed PATHOGENIC → LIKELY_PATHOGENIC. The paper reports ACMG class 2 (likely pathogenic), which in dismech's ClinicalSignificanceEnum should map to LIKELY_PATHOGENIC, not PATHOGENIC. This preserves the distinction from known pathogenic siblings (p.H1069Q, p.R778L).

    2. Removed ACMG class numbering confusion: Removed phrase "Despite the class 2 (likely pathogenic) classification of splice-site mutations" which incorrectly invoked ACMG numbering (where class 2 = likely benign, not pathogenic). Simplified description to focus on observed phenotype rather than splice-site category assumptions.

    3. Removed unsourced claim: Deleted phrase "or protective modifiers" as it appears nowhere in the cached full text PMID:42631261. The paper only mentions residual ATP7B activity as the mechanistic explanation for atypical late-onset presentation.

    4. Added history record: This session record completes CLAUDE.md requirement that any PR editing a KB entry must have a corresponding history/ record.

    Evidence snippets remain exact quotes from PMID:42631261 (verified 289/289 in prior validation). No schema changes, no cache churn.

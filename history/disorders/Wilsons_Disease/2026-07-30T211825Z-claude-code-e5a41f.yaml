  summary: 'Add renal Fanconi syndrome, giant panda MRI sign (issue #6220)'
  details: |
    Added two well-established but previously uncited WD features from issue #6220 (curator-filed follow-up from a prior evidence review): (1) Renal Fanconi Syndrome phenotype (HP:0001994) plus a new downstream causal edge from the Systemic Copper Distribution pathophysiology node, cited to PMID:23565442 (a case report directly attributing a generalized proximal tubulopathy - phosphaturia, kaliuresis, glucosuria, aminoaciduria - to Wilson disease, distinct from the already-modeled isolated renal tubular acidosis); (2) the pathognomonic 'face of the giant panda' midbrain MRI sign as a new Neurological phenotype, bound to the closest-fit HP:0012748 (Focal T2 hyperintense brainstem lesion) term with a more specific preferred_term per repo convention, cited to PMID:16752136 (100-patient cranial MRI cohort reporting the sign in 12% of symptomatic patients) rather than the near-empty-abstract case report PMID:25856942 the issue had listed as a candidate. All four candidate PMIDs from the issue were independently fetched and reviewed; PMID:18186898 and PMID:21360162 were rejected as off-topic (post-transplant drug-induced Fanconi syndrome / a general tubular-dysfunction-marker review, not WD-specific). Left the issue's third, 'minor'-flagged item (structured ATP7B case_fractions for H1069Q/R778L) unattempted as a follow-up, since it needs a dedicated per-allele cohort source not yet identified. Validated with just validate, just validate-terms, and manual whitespace-normalized substring verification of both new snippets against their cached abstracts (the reference-validator CLI itself reports 'Total checks: 0' on this file, seemingly a pre-existing quirk unrelated to this change, so substring correctness was hand-verified as an extra check).

  summary: Evidence-claim mismatch review (#13620)
  details: |
    Reviewed the 12 claims that the saved Jev assessment rated MISMATCH as a whole (dismech-evals, source revision 19a31ae9e). Changed:
    - biochemical 24-Hour Urinary Copper, PMID:39139457: the quoted result (14/69 met both targets) did not say UCE is used for monitoring; replaced with the sentence stating chelator treatment is guided by NCC and 24 h UCE.
    - Oxidative-Mitochondrial Injury hypothesis, PMID:41349253 (ARBM-101 rescue): marked directness INDIRECT. Copper-depletion rescue shows copper drives the injury but says nothing about oxidative or mitochondrial mechanism, as the explanation already stated.
    - Neurodegenerative Movement Disorder hypothesis, PMID:33590415 (toxic milk mouse): regraded SUPPORT to REFUTE with directness INDIRECT. The sentence reports copper accumulation and neuronal destruction without a neurological phenotype, which contradicts the hypothesis in that model.
    - Ferroptosis node and the cuproptosis knowledge gap, PMID:41966025: extended the ACSL4 sentence with the methods sentence naming the Wilson disease models, so the snippet shows it is a WD result.
    - Ferroptosis node, PMID:8770863 (LEC rat iron deprivation): replaced the liver-cancer sentence with the fulminant-hepatitis result and the authors' iron-copper radical conclusion; directness INDIRECT, since the study predates ferroptosis and measured no ferroptosis marker.
    - Orphanet prevalence record: measure_type BIRTH_PREVALENCE changed to POINT_PREVALENCE, because both remaining quoted rows (worldwide, China) are point prevalence; removed the prevalence-at-birth row and moved that fact into notes.
    - Genetic-prevalence record, PMID:39674827: replaced the recall-cohort phenotype sentence with the study's underdiagnosis conclusion, which is what the notes claim.
    - Sunflower Cataract edge: added PMID:42550961 (2026 ocular review, newly fetched) for copper deposition in the lens capsule; the Orphanet row only establishes the phenotype.
    - Tremor edge: added PMID:31179301 for basal ganglia neuropathology plus tremor; marked the PMID:33474589 item INDIRECT. Nothing cited supports the cerebellar part of the edge description; left as is and noted in the explanation.
    Also set evidence_source OTHER on the existing PMID:31179301 item under Neurodegeneration (a narrative review that had no evidence_source and so defaulted to HUMAN_CLINICAL), so both items quoting its putamen sentence agree for check-snippet-grading.
    Retained without change: ferroptosis hypothesis REFUTE item PMID:20594231 (correct as graded); progression onset row 'Age of onset: Adult' (one of four Orphanet rows that together support the age range); phenotype context for abnormality of the hand (the Orphanet row states exactly the VERY_FREQUENT band). Validation: just validate and count-verified-snippets (336/336) pass.

  summary: 'Review round 1: prodromal CNS phenotypes, aim-statement snippet, cardiac
    GO terms'
  details: |
    Review round 1 on PR #12286, answered in one push.

    Two blocking findings from the automated reviewer:

    1. Five prodromal CNS features named in a snippet already verified in this
       entry were not modeled. Added circumoral paresthesia, metallic taste,
       dizziness, visual disturbances and muscle twitching as Neurologic
       phenotypes with temporality ACUTE, citing the same PMID:29763139 sentence
       that already backed tinnitus, agitation and dysarthria. Every HPO CURIE
       was taken from a live OLS lookup at the point of writing. Three bindings
       are looser than the source's word and each records why in notes:
       HP:0003401 Paresthesia has no perioral-specific child; HP:0002321 Vertigo
       carries "Dizziness" only as a synonym while its definition specifies a
       rotatory sensation the source does not claim; HP:0002380 Fasciculations
       carries "Muscle twitch" as an exact synonym but defines the finding by a
       motor-axon origin that is not the mechanism this entry models.
       HP:0000504 Abnormality of vision was chosen over HP:0000505 Visual
       impairment, whose HPO definition is permanent disabling vision loss.

    2. The Xenopus oocyte model's evidence quoted the paper's aim sentence and
       graded it PRIMARY_RESULT. CLAUDE.md says an aim statement has no value in
       quote_role. Replaced the snippet with the paper's own use-dependence
       result, which is what the link's description claims to measure, leaving
       PRIMARY_RESULT correct rather than merely removing the field.

    Non-blocking findings also taken:

    - Bound the conduction node to GO:0061337 cardiac conduction and GO:0086001
      cardiac muscle cell action potential in place of the generic GO:0001508.
    - Added a Cardiac conduction abnormality phenotype (HP:0031546) wired from
      Impaired Cardiac Impulse Conduction. Bound at conduction-abnormality
      granularity rather than HP:0006677 Prolonged QRS complex because the two
      cited sentences say "conduction abnormalities" and "PR/QRS" respectively,
      and the QRS term alone would drop the PR half.
    - Consumed four of the six cached-but-uncited references: PMID:17643405
      (cardiolipin liposome disruption, a second mitochondrial route distinct
      from the translocase arm, INDIRECT because the preparation is synthetic),
      PMID:26622452 (lipid emulsion against the CNS arm, the first non-cardiac
      target_mechanism on that treatment), PMID:35777259 (patient-side risk
      factors on the exposure entry), PMID:39398741 (matched pregnant/nonpregnant
      cohort, which measures a population that skips the prodrome and so bears
      directly on the classic_presentation_is_the_minority_picture discussion).

    Declined: pruning the remaining two caches. The reviewer suggested pruning
    what the entry does not cite, but PMID:33148630 and PMID:27243970 are both
    cited by the deep research report committed in the same PR, whose citation
    list validates against the same cache. Recorded in entry notes, with the
    reason each is unquotable here: the ASRA checklist abstract states only that
    the 2020 revision exists, and the exome study is about resistance to the
    intended block rather than systemic toxicity.

    Also declined: a diagnosis: section. The ASRA checklist is the obvious
    source and its cached abstract carries no clinical content to quote, so the
    section cannot be written from what is in the branch.

    A reference_title written from memory during this round was caught and
    corrected by rewriting every title in the file from its cache frontmatter.
    The invented string bore no resemblance to the real title.

    Validation after the round: just validate clean with 58/58 snippets verified
    (was 47/47); just validate-terms passed; check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values and
    check-qualifier-terms all clean.

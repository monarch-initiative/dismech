  summary: 'Create: Local Anesthetic Systemic Toxicity (MONDO:0100335)'
  details: |
    New entry for local anesthetic systemic toxicity. Deep research via the claude_code provider (the only one with credentials in this environment). Report validated retrospectively: 25/25 references resolved, 0 unresolved, 0 off topic; 33/33 terms resolved with matching labels. just preflight-dr returned SKIP because MONDO records no causal gene for a non-genetic disease; identity was checked manually instead, and the report's top gene mentions - SCN5A, CPT2, BCHE - are all on-topic for this syndrome, which is a useful corroborating signal. Every ontology CURIE was re-derived from a live OLS lookup at the point of writing. Pathograph is one connected component: exposure, then three parallel arms - cortical inhibitory-tone loss, Nav1.5 blockade, and mitochondrial carnitine-acylcarnitine translocase inhibition - converging on cardiovascular collapse. Two mechanistic_hypotheses: sodium channel blockade as CANONICAL, quoted with the source's own hedge that the evidence remains mixed, and the mitochondrial arm as ALTERNATIVE, quoted with its originating authors' 'The authors hypothesize' intact. A KNOWLEDGE_GAP records that the antidote's mechanism is unsettled between sequestration, direct inotropy and post-conditioning; a second records that the textbook progressive presentation fits only 60 percent of published cases. A fresh-context red-team subagent reviewed the entry against dismech-pr-review and returned 17 findings including 3 blocking; all were acted on. The blocking ones are the record worth keeping, because two are the same defect in the same session. First, an entry note asserted that no case report of host susceptibility had been retrieved or cached, when PMID:24445991 - a functionally characterised SCN5A variant with lidocaine-induced ventricular fibrillation - was already in this PR's own cache; it is now curated as a RISK_FACTOR genetic record. The reviewer also offered PMID:35363184 as the CPT-II half of that lead, and that part does not hold: the paper is about general anesthesia in fatty-acid-oxidation disorders, recommends avoiding propofol, and never mentions local anesthetics, so it is the wrong paper for the claim and the note now says so. Second, the environmental exposure note asserted that ECTO has no local-anesthetic-specific class, on the strength of two searches in American spelling; ECTO:9001759 exposure to local anaesthetic exists under the British spelling, is non-obsolete and validates, and is now bound in place of the broader ECTO:2000059. Third, both prevalence records carried prevalence_class BAND_1_9_PER_100000 against rates of 87.0 and 27.0 per 100,000, which the repo's own bucketer maps to BAND_1_5_PER_10000; both were corrected, and measure_type moved from ANNUAL_INCIDENCE to UNKNOWN because these are per-procedure attack rates rather than annual rates. While fixing the airway treatment binding I wrote a fourth negative-existence claim, that NCIT has no whole-airway clinical-action term; searching found NCIT:C94624 Oxygen Therapy, which is now bound in place of NCIT:C70909 Mechanical Ventilation, and the note records all three searches and what each returned. Other findings acted on: the cortical inhibition node had no evidence at all and attributed the effect solely to sodium channel blockade of interneurons, which the entry's own cited review contradicts - it now carries two items from PMID:42589553 including a REFUTE against reading the sodium binding as the complete mechanism; two evidence items were exact but off-claim and were supplemented with a sentence that names the phenotype directly; a false claim that a chosen quote was the best available in the cache was removed; PMID:28346007, an animal survival meta-analysis giving OR 0.24 for lipid emulsion, was added as the strongest efficacy evidence for the flagship treatment; an unsourced claim about refractory arrests and an unsourced lidocaine comparison were removed from prose; the two model systems already doing evidentiary work were recorded as animal_models and experimental_models with modeled_mechanisms links; and two phenotype edges that were unsourced mechanistic attributions were deleted, which lowered causal connectivity from 9/9 to 7/9 and is the honest figure. Validation: just validate-disorders passes with 47/47 snippets verified; entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, snippet-grading, title-snippets, snippet-length, folded-hyphens, environmental-evidence, case-collisions and reference-titles all clean. just check-genereviews returns GeneReviews NO_CHAPTER and StatPearls TAGGED. Note for the environment: three whole-KB gates failed mid-run with OSError errno 28 no space left on device, not with content findings - they extract an origin/main tarball to build their baseline and the disk was 100 percent full with five worktrees of a 96,000-file repo. Removing the two worktrees for already-merged PRs freed 8.2 GB and all three passed on re-run.

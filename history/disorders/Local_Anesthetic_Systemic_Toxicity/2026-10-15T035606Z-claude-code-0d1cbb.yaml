  summary: Fix bupivacaine marker's unsupported evidence claim
  details: |
    The Plasma bupivacaine concentration marker's evidence item cited PMID:42589553 ('Their therapeutic effect is based mainly on reversible voltage-gated sodium channel inhibition, but toxicity is not limited to this mechanism') with an explanation claiming it supports plasma bupivacaine concentration as the measurement underlying the root pathophysiology node. The quote is about mechanism of action; it names no concentration, no rise, and not bupivacaine, so the explanation claimed support the quote did not carry. Replaced it with the quote the entry already cites elsewhere (PMID:20301824, HUMAN_CLINICAL, quote_role BACKGROUND, copied unchanged from its existing citation): 'paralleling progressive increases in blood local anesthetic concentration, culminating in seizures and coma.' That supports a rising blood concentration as the defining measurable. The new explanation states plainly that the quote is class-level and that bupivacaine is the analyte bound here because the root node names it in chemical_entities, not because the quote does.

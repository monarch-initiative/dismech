  summary: 'Create: UQCRC1-Related Parkinsonism With Polyneuropathy'
  details: |
    De-novo curation of UQCRC1-related parkinsonism with polyneuropathy (MONDO:0036193, OMIM 619279) from the stub. Literature search via PubMed MCP + E-utilities (no deep-research provider used; providers not invoked). Primary source PMID:33141179 (discovery: 3 families, p.Y314S/p.I311L/splice alleles, SH-SY5Y + Drosophila + mouse knock-in functional validation, complex III-selective deficit, nigral + peripheral axonal degeneration, levodopa response). Mechanism/replication sources: PMID:34551295 (cytochrome c/apoptosis), PMID:41540037 (PINK1-dependent mitophagy), PMID:40346065 (UK Biobank PTV association), PMID:33248804 and PMID:32666668 (non-replication), PMID:39752790 (Austrian p.G405V family). UQCRC1-ai-review.yaml (ai-gene-review) read for gene function only, not cited. 8 pathophysiology nodes forming a causal chain, 7 phenotypes, fly + mouse animal_models with modeled_mechanisms, 2 discussions (CONTROVERSY on PD-gene replication, KNOWLEDGE_GAP on human neuropathology). No ClinGen/GenCC validity record found so gene_disease_validity left absent. Validated: just validate (45 snippets, terms OK), all offline gates.

  summary: 'Review round 1: UQCRC1-Related Parkinsonism With Polyneuropathy'
  details: |
    Changes made in answer to the automated review on PR 18717. Deep research: one Asta retrieval report (research/UQCRC1-Related_Parkinsonism_With_Polyneuropathy-deep-research-asta.md) was generated with just research-disorder; just preflight-dr against MONDO:0036193 returned PASS (UQCRC1 named 58 times, OMIM 619279 matches); its reference validation resolved 36 of 36 references and found no ontology term identifiers. Cross-check added two sources the entry lacked: PMID:30788857 (first report of the UQCRC1 variant in the index family, cited on the gene and in diagnosis) and PMID:38666843 (formoterol restoring complex III-linked respiration in the knock-in cell model, cited on a new experimental model record). Pathophysiology: the node 'Complex III Destabilization and Reduced Complex III Activity' was split into 'Complex III Homodimer Destabilization' (in silico evidence) and 'Reduced Complex III Activity' (cell and mouse measurements); 'Mitochondrial Respiratory Dysfunction and Oxidative Stress' was split into 'Impaired Mitochondrial Respiration and ATP Production' and 'Increased Reactive Oxygen Species Production'. All bare-name targets were updated. The cytochrome c edge now starts at the variant node because PMID:34551295 ties it to loss of UQCRC1 and its association with cytochrome c, not to respiration or reactive oxygen species. Grading: the cytochrome c item is MODEL_ORGANISM; the mitophagy evidence is split into one IN_VITRO item (SH-SY5Y) and two MODEL_ORGANISM items (fly); the homodimerisation item on p.Tyr314Ser and the dominant-negative sentence under inheritance are COMPUTATIONAL. Resting tremor now quotes the 'Rest tremor' row of the clinical table of PMID:33141179 (6 of 8 carriers). Frequencies with denominators from that table were added for parkinsonism, rest tremor, polyneuropathy and anxiety, and a Depression phenotype (2 of 5) was added. Non-replication: REFUTE items quoting PMID:36570444 and PMID:37984314 were added to the CONTROVERSY discussion. PMID:34286409 and PMID:33779694 have no abstract and returned no quotable text on a forced refetch on 2026-11-22, so their cache files were removed and notes names them as uncited leads. PMID:41783485 is cited on the respiration node as indirect evidence. Other changes: GO:0042416 removed from the nigral degeneration node (left unbound, reason in the node notes); Peripheral Axonal Degeneration conforms to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination; evidence added on eight downstream edges; edges added from the neuropathy node to distal weakness, distal sensory impairment and areflexia and from the striatal node to resting tremor; a diagnosis section (UQCRC1 sequencing, nerve conduction study, dopamine transporter SPECT); creation_date set to the creation record's timestamp; an unverified clause that no screen found p.Tyr314Ser outside Taiwan was removed from notes and the discussion rationale. relationship_type CAUSATIVE was left unchanged pending a maintainer decision. Validation: just validate, validate-terms, count-verified-snippets, validate-disorders and the offline gates passed.

  summary: Correct a false claim about ORPHA:90 introduced in the previous review
    response
  details: |
    CORRECTION. The previous history record in this directory
    (2026-07-25T205325Z-claude-code-08c985.yaml) contains a false claim about a
    cited source, repeated from a notes field added to the entry in the same
    session. History records are append-only, so that record is left intact and
    the error is corrected here.

    The false claim. The Hyperammonemia phenotype notes stated: "Note that
    Orphanet ORPHA:90 does not band hyperammonemia for argininemia at all, so the
    tension is internal to the literature rather than a source conflict", and
    listed nine HPO IDs as the complete set of Orphanet-banded phenotypes. That
    list omits HP:0001987. references_cache/ORPHA_90.md line 52 reads
    "| HP:0001987 | Hyperammonemia | Frequent (79-30%) |", sitting between
    HP:0001263 and HP:0002167 - exactly the position the nine-ID list skips.

    This is the failure class the parent PR was opened to repair: an unsupported
    factual claim about a cited source, curated into the KB. It is worse than the
    original error in one respect - because it lives in a free-text notes field,
    no validator can catch it. Only review can, and review did.

    It also inverted its own conclusion. There IS an Orphanet-versus-literature
    conflict on this band, and Orphanet's Frequent (79-30%) is the strongest
    argument against OCCASIONAL - not something dismissable as internal to the
    literature.

    The fix. The band stays at OCCASIONAL: PMID:26467175's "infrequent episodes
    of hyperammonemia" and the GeneReviews comparative statement are both real,
    and the comparative infrequency is genuinely what distinguishes ARG1
    deficiency from the proximal urea-cycle disorders - it is why this disease
    presents as progressive spastic paraparesis rather than acute hyperammonemic
    crises. But the note now records the discordance it actually faces: it states
    the Orphanet FREQUENT band up front, explains why OCCASIONAL is retained
    against it, and no longer makes any claim about what Orphanet does or does
    not contain beyond the row quoted. The ORPHA:90 row is additionally added as
    an evidence item with supports: PARTIAL, so the conflict is machine-visible
    rather than prose-only.

    Suggestions also implemented:
    - Added the Finland birth-prevalence record (BELOW_1_IN_1000000) from the
      ORPHA:90 epidemiology table. The disease description asserts a range with a
      "fewer than 1 per 1,000,000 live births" lower bound, but the only curated
      sub-1 record was Europe POINT prevalence - a different measure type - so
      the description's lower bound was not auditable from the entry. It now is.
    - population changed from "Global (modelled from ARG1 allele frequencies)" to
      "Global": CLAUDE.md scopes population to cohort and geography only, and the
      methodology was already stated in the record's notes.
    - Added Loss of ambulation to pegzilarginase target_phenotypes, closing the
      treatment-to-pathograph loop for the mobility benefit the phenotype
      description already cites.

    Not changed: CHEBI:18401 phenylacetate remains the binding for sodium
    phenylacetate. Checked as the reviewer suggested - runoak against
    sqlite:obo:chebi returns no sodium phenylacetate term, phenylacetate is the
    active species, and unlike the CHEBI:41500 case there is no sibling entry
    precedent to follow.

    Validation. Schema, term and reference validation all pass.

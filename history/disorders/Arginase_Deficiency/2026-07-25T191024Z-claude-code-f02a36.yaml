  summary: 'Review: prevalence claim-evidence repair, phenotype and treatment gaps'
  details: |
    Full review of the oldest-created unreviewed disorder entry (creation_date
    2025-06-12).

    Claim-evidence mismatch repaired (the principal finding). The single
    prevalence record asserted "approximately 2.8 cases per 1,000,000 live
    births" and "a population prevalence of approximately 1.4 cases per
    1,000,000 people", and the same 2.8-per-million figure was repeated in the
    disease description. Neither number appears in the only cited source
    (PMID:39669610), whose abstract instead reports a modelled birth-prevalence
    range of 1 in 141,331 to 1 in 34,602,076 and whose stated conclusion is that
    a large proportion of ARG1 variants lack adequate evidence of pathogenicity,
    i.e. that allele-frequency point estimates are unreliable. The unsupported
    point estimates were removed from both the description and the prevalence
    notes and replaced with three properly structured Prevalence records, each
    anchored on a quotable snippet: a United States BIRTH_PREVALENCE record
    (BAND_1_9_PER_1000000) and a European POINT_PREVALENCE record
    (BELOW_1_IN_1000000), both quoting rows of the Orphanet ORPHA:90 epidemiology
    table, plus a global modelled BIRTH_PREVALENCE record carrying the
    PMID:39669610 range and its reliability caveat as two separate evidence
    items. This also converts the entry from the deprecated free-text-only
    prevalence shape to the structured measure_type / prevalence_class /
    rate_low / rate_high slots.

    Missing phenotypes added (six). Two Orphanet-listed features were absent
    entirely: Atypical behavior (HP:0000708, very frequent) and
    Hemiplegia/hemiparesis (HP:0004374, frequent). Four features documented in
    the GeneReviews untreated natural history were absent: Developmental
    regression (HP:0002376), Loss of ambulation (HP:0002505), Urinary
    incontinence (HP:0000020), and Bowel incontinence (HP:0002607). Each carries
    a verified exact-quote snippet. Global developmental delay was recorded as
    FREQUENT against an Orphanet very frequent (99-80%) band; upgraded to
    VERY_FREQUENT with the Orphanet row added as supporting evidence, and its
    now-obsolete "frequency data are limited" note dropped.

    Pathograph wiring. All six new phenotypes were wired as downstream targets
    rather than left floating: Atypical behavior and Developmental regression off
    the guanidino-compound neurotoxicity node, and Hemiplegia/hemiparesis, Loss
    of ambulation, Urinary incontinence and Bowel incontinence off the CNS white
    matter pathology node. The hemiparesis edge is additionally supported by the
    focal putaminal and insular infarcts reported in PMID:18321250. Added
    conforms_to on the ARG1 molecular function deficiency node to
    metabolic_intoxication_decompensation#Enzymatic Block in Intermediary
    Metabolism, matching the sibling urea-cycle entries, plus biological_scale
    MOLECULAR. Conformance was deliberately NOT asserted on the downstream nodes,
    because that module's amplifier and central-effector nodes are framed around
    catabolic-stress-driven acute decompensation, which is precisely the feature
    that distinguishes ARG1 deficiency from the proximal urea-cycle disorders.

    Treatment evidence gaps closed. Protein-restricted diet, Nitrogen scavenger
    therapy and Liver transplantation each had no evidence at all; all three now
    cite GeneReviews (PMID:20301338). The liver transplantation description was
    also factually corrected: it claimed transplantation "is considered for
    patients with severe metabolic instability refractory to medical management",
    whereas GeneReviews states it is rarely necessary in arginase deficiency and
    reserved for the rare progression to hepatic fibrosis and cirrhosis. Added a
    missing Acute hyperammonemia management treatment (rapid ammonia reduction,
    anti-catabolic carbohydrate and fat calories, intravenous alternative-pathway
    agents, avoidance of overhydration and cerebral edema). Added
    therapeutic_agent bindings for sodium benzoate (CHEBI:113455) and sodium
    phenylbutyrate (CHEBI:41500) on the generic NCIT:C15986 pharmacotherapy
    scavenger treatment, and a target_mechanisms edge stating the
    alternative-pathway nitrogen-excretion mechanism.

    Progression. Added an "Advanced untreated disease" phase capturing the
    GeneReviews natural history, paired with the countervailing observation that
    individuals treated from birth appear to have minimal symptoms, so the phase
    is not read as the expected outcome of managed disease.

    Not changed, deliberately. The Hyperammonemia frequency was left at
    OCCASIONAL despite Orphanet's frequent (79-30%) band: the infrequency of
    hyperammonemia relative to other urea-cycle disorders is the entry's
    defining, well-sourced distinction and is stated directly by both PMID:26467175
    and GeneReviews. The deprecated updated_date field was left in place rather
    than dropped, to avoid preempting the tracked bulk cleanup.

    Validation. Schema, term and reference validation all pass. Reference
    validation was additionally sanity-checked by injecting a deliberately
    fabricated snippet and confirming the validator flagged it, so the clean pass
    is not a false negative.

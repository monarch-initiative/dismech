  details: |
    Follow-up to the automated code review on PR #6959. The two blocking findings
    (wrong CHEBI term for sodium phenylbutyrate; laterality claim unsupported by
    a bilateral-imaging snippet) were independently fixed by pr-shepherd in
    commit c927601 while this session was preparing the same repairs; that work
    is kept as-is and this record covers only the incremental changes made on top
    of it.

    One refinement to the laterality fix. pr-shepherd reworded the edge and the
    explanation correctly but left the PMID:18321250 item at supports: SUPPORT.
    Downgraded to PARTIAL: the paper evidences focal ischemic injury as a
    structural substrate, but a bilateral-lesion report cannot support the
    lateralization that a hemiparetic deficit implies, and the supports value
    should say so rather than relying on the prose explanation alone.

    Review suggestions implemented:

    - target_mechanisms retargeted (suggestion 3). Two treatments pointed
      target_mechanisms at Hyperammonemia, which is a phenotypes entry rather
      than a pathophysiology node; the slot documentation asks for pathophysiology
      node names. Both retargeted to Impaired ureagenesis and hyperargininemia,
      which is also mechanistically apter - alternative-pathway agents bypass the
      blocked cycle rather than acting on the ammonia level directly. Both
      treatments already carried Hyperammonemia in target_phenotypes, so no
      clinical link is lost.

    - GeneReviews DIAGNOSIS/TESTING mined (suggestion 4). Added the diagnostic
      quantification to the Erythrocyte arginase activity biochemical entry:
      activity is usually under 1% of normal in red-cell extracts, and the assay
      is a confirmatory alternative to molecular testing. The entry previously
      backed a diagnostic claim only with a generic loss-of-function snippet and
      carried no threshold.

    - Sodium phenylacetate added (suggestion 5). The acute-management treatment
      described benzoate and phenylacetate but bound only benzoate as an agent;
      phenylacetate added as CHEBI:18401.

    - Hyperammonemia frequency discordance recorded in the entry (suggestion 6).
      The justification for keeping OCCASIONAL previously lived only in the PR
      body and history record. Added a notes field on the phenotype setting out
      the conflict: PMID:26467175's "infrequent episodes" and GeneReviews' "not as
      likely to have episodes" are both COMPARATIVE statements relative to other
      urea cycle disorders, while GeneReviews' own opening line calls untreated
      disease "characterized by episodic hyperammonemia of variable degree". The
      note also corrects a premise in the review itself: Orphanet ORPHA:90 does
      not band hyperammonemia for argininemia at all (its banded phenotypes are
      HP:0000708, 0001250, 0001263, 0002167, 0002353, 0002478, 0004374, 0008339
      and 0010864), so the Frequent (79-30%) figure cited in the review is not an
      Orphanet-versus-literature conflict - the tension is internal to
      GeneReviews.

    Validation. Schema, term and reference validation all pass.

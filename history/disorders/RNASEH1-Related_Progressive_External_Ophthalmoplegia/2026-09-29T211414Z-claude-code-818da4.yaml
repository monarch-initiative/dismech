  summary: 'Create: RNASEH1-Related Progressive External Ophthalmoplegia'
  details: |
    New entry for PEOB2 (MONDO:0014656, OMIM:616479), caused by biallelic RNASEH1 variants (hgnc:18466, confirmed against the HGNC REST record). Replaces the stub Progressive_External_Ophthalmoplegia_With_Mitochondrial_DNA_Deletions_Autosomal_Recessive_2, which is deleted.

    Sources. One deep-research report was used as a lead: research/RNASEH1-Related_Progressive_External_Ophthalmoplegia-deep-research-perplexity.md (6/6 cited references resolved). No CURIE was taken from it; its term-validation section lists a dozen mislabelled terms (for example HP:0000506, which is Telecanthus). The preflight WARN counting PEO as a second gene is a false positive; the report is about RNASEH1. Evidence rests on twelve PubMed records fetched into references_cache: the founding series (PMID:26094573), the UK clinicopathologic series giving the PEO/ataxia/dysphagia percentages (PMID:28508084), three further case reports (PMID:31258551, PMID:35711919, PMID:33396418), the Holt/Spinazzola mechanistic papers on primer retention and nucleoid segregation (PMID:26162680, PMID:27402764), the conditional heart knockout that also reports the gain-of-activity p.Tyr29Cys allele (PMID:35947649), the constitutive null mouse (PMID:12667461), a 2026 bioRxiv preprint on mt-dsRNA release (PMID:42244575), and a general PEO review (PMID:36813323). PMID:27131367 (liver knockout) is cited in notes only. PMID:30340744 was fetched and discarded because PubMed holds no abstract for it.

    Structure. Pathograph: RNASEH1 variant node, impaired primer processing at the replication origins, stalled/incomplete mtDNA replication, multiple deletions in muscle, respiratory-chain deficiency, then extraocular, limb/bulbar and cerebellar tissue nodes wired to 15 of 17 phenotypes. Peripheral neuropathy and sensorineural hearing loss are left unconnected; they come from single families and no source supplies a mechanism. Side branches for nucleoid aggregation and mt-dsRNA innate immune activation carry no phenotype edges, and two KNOWLEDGE_GAP discussions record why. No mechanism module fits (the only mitochondrial module is the aging-hallmark one), so there is no conforms_to. just check-genereviews --online reports no GeneReviews or StatPearls chapter.

    Validation: just validate (81 snippets, 0 issues), count-verified-snippets 81/81, validate-terms passed, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-reference-titles, check-title-snippets and check-snippet-length all OK, and just validate-disorders on the file.

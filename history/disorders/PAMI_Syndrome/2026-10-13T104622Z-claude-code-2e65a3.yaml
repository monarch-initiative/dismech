  summary: 'Create: PAMI_Syndrome'
  details: |
    Created PAMI syndrome (MONDO:0011174, hyperzincemia with functional zinc depletion; OMIM 601979) from the stub of the same MONDO term, under the clinically current name rather than the MONDO label. Kept as a disease separate from PAPA_Syndrome: different causal PSTPIP1 variants (p.E250K, p.E257K charge reversal vs p.A230T, p.E250Q) and a phenotype absent from PAPA (hyperzincemia, about 20-fold higher calprotectin, cytopenias, hepatosplenomegaly, growth failure), per Holzinger 2015 (PMID:26025129). Pathograph: charge reversal -> loss of LYP phosphatase binding -> enhanced pyrin binding -> pyrin inflammasome activation and uncontrolled calprotectin release -> calprotectin-bound zinc accumulation (hyperzincemia; functional tissue zinc depletion recorded as a hypothesis with a REFUTE item for raised liver and muscle zinc in the index case) and TLR4 alarmin signaling -> systemic autoinflammation; marrow dysplasia and anti-neutrophil autoimmunity -> cytopenias. Input was the Perplexity sonar-deep-research report run at reasoning_effort=low, because two medium-effort runs were cut off by a connection drop at about 300 s. The report was used as a lead list only; every CURIE was looked up in OLS and every snippet quoted from a cached PubMed record (19 references fetched). The report's mislabelled NCIT/GO CURIEs, three nonexistent HP terms and obsolete GO terms were not used; DOI:10.1111/j.1651-2227.2008.01092.x (tacrolimus case, flagged off-topic) was cited by its PMID 18983438 after reading it, as it is a hyperzincemia/hypercalprotectinemia patient. preflight-dr: PASS (PSTPIP1 91 mentions, OMIM 601979). No GeneReviews chapter (check-genereviews NO_CHAPTER); no ClinGen CGGV or ORPHA cache record for PSTPIP1/this disease. Validation: just validate, validate-terms, count-verified-snippets (91/91), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments and validate-disorders passed.

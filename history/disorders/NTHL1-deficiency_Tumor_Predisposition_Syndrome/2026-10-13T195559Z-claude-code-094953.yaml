  summary: 'Review round 1: NTHL1-deficiency_Tumor_Predisposition_Syndrome'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 14053. Added an Endometrial Cancer Surveillance treatment (NCIT:C15406 Cancer Screening, the same TreatmentTerm used by Breast Cancer Surveillance and confirmed present in the treatment-action enum cache) quoting GeneReviews (PMID:32239880) and the 2025 systematic review (PMID:41107869) with their may-be-considered/could-be-considered hedges intact. Cited the GeneReviews 35% to 78% cumulative extracolonic cancer risk by age 60 on the inheritance block and in the risk-ascertainment discussion. Added the GeneReviews mammography schedule and at-risk-sib cascade-testing sentences. Added an explanation that the systematic review's meningioma figure 4/22 = 20.8% does not compute, keeping the quote verbatim. Added the mismatch-repair-proficient / microsatellite-stable tumor point to the tumor-signature diagnosis item, quoting PMID:39793275 and PMID:37727376, and replaced the ClinGen-summary-only statement of somatic driver genes with the primary tumor sequencing sentence from PMID:37727376. Fixed the CI gene-activity-grounding failure by binding molecular_functions GO:0000703 and GO:0003906 (labels read from OLS) on the trigger node that the NTHL1 genetic record reaches, with PMID:8990169 evidence. Did not add target_mechanisms to the breast, endometrial and brain surveillance treatments, because they detect tumors rather than act on a mechanism. FAP3 left as closeMatch pending a maintainer decision.

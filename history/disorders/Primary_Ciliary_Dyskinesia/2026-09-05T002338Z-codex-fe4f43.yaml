  summary: Review PCD transport, laterality and genotype severity with three
    OpenScientist assessments
  details: |
    Scope and inputs
    - Read the complete disease YAML, all three full OpenScientist reports and citation sidecars, all prior codex assessment YAML/Markdown pairs, both broad research reports and their citation inventories, repository guidance and the decision register. Applied disease review, reference, ontology, hypothesis-assessment and GitHub communication guidance.
    - Reviewed the whole model against primary literature and current guidance, including evidence outside the provider reports. Generated reference caches only through sanctioned fetch-reference and validated ontology caches through the term validator. No raw provider computations or primary-data analyses were reproduced. No other author's branch was modified.

    Content-completeness checklist
    1. Disease identity, inheritance and classification: retained the respiratory/genetic ciliopathy identity, broadened beyond obligatory autosomal recessive inheritance to dominant FOXJ1/TUBB4B and relevant X-linked forms, and distinguished genotype groups from validated prognostic subtypes. Gene entries with Limited ClinGen validity are explicitly qualified instead of being presented as definitive diagnostic causes. Added DNAH9, TUBB4B and CFAP74 with gene-specific evidence; not every TUBB4B allele causes respiratory PCD.
    2. Transport pathophysiology: separated axonemal beat dysfunction, reduced multiciliogenesis, C1d transport dysfunction despite normal routine tests, and CCDC39/CCDC40 scaffold-dependent protein loss. CCNO residual cilia can retain motor proteins and movement, whereas MCIDAS residual cilia lack DNAH5/CCDC39. Added scaffold loss to proteostasis/fate switching and periciliary-barrier dysfunction with explicit clinical-mediation limits. Added DNAH5 cellular oxidative stress and the GSTA2/NRF2 response, distinguishing adaptive increased expression from GSTA deficiency or proven antioxidant efficacy.
    3. Airway clinical chain: linked clearance failure to infection/neutrophilic inflammation, airway remodeling, bronchiectasis and heterogeneous obstructive decline. FEV1 is an airflow measure, not an interchangeable gas-exchange measure. Cough compensation and regional tracer limitations qualify whole-lung clearance. M2-like sputum-conditioned healthy macrophages are an in vitro finding, not a demonstrated stable in vivo endotype. IFT88 mouse remodeling, low NOS responses and acquired infection-induced YTHDF1/DNAH5 regulation remain scoped leads rather than universal human mutation-intrinsic mechanisms. Neonatal fluid-clearance mediation remains inferred rather than experimentally established in human infants.
    4. Laterality arm: replaced the erroneous situs-inversus-to-heart-defect/malrotation path with a common developmental laterality-disruption branch. Added direct 2023 mouse and zebrafish optical-tweezer mechanosensing evidence and PKD2/calcium/BICC1/CNOT3-dependent Dand5 RNA decay. Preserved the distinction between respiratory motor genes and nodal sensory machinery. CCDC39/CCDC40 can affect nodal function; they cannot be grouped indiscriminately with radial-spoke/central-apparatus genes. CCDC40 required function does not imply axonemal localization in nodal cilia. No unsupported turbulent-flow or strict binary 50:50 model was added.
    5. Genotype/severity: retained EMERGING status and replaced severe/standard/mild tiers with group-level associations and their actual endpoints. The 1236-person registry is cross-sectional, and the five-year study enrolled 137 participants with 732 visits. Within-group significance is not a between-group slope interaction. The 2026 physiological study compares RSPH1 with DNAH5, not ODA with IDA; small unadjusted cough differences do not establish clinical mediation. RSPH1 P=0.043, not 0.0. DNAH5/DNAH11 nonsignificance does not prove equivalence. nNO, neonatal distress, FEV1 and ENT intervention timing are different outcomes. CCNO pooled-case percentages and preprint/final duplication are qualified.
    6. Phenotypes and reproductive/ependymal disease: reviewed all phenotype evidence, retained appropriate Orphanet associations, removed unrelated/title-only citation support and unsupported frequency claims, and added heterotaxy and ectopic pregnancy context. Situs ambiguus and strict complex-cardiovascular heterotaxy have different denominators. Infertility survey percentages apply only to respondents who tried to conceive and include assisted reproduction; infertility is not obligatory. Hydrocephalus in FOXJ1/selected ciliogenesis forms and severe mouse phenotypes are distinguished from general human PCD. Ectopic pregnancy remains an unbound preferred term because its HP history term is outside the schema's phenotype subtree; no incorrect ontology binding was substituted.
    7. Epidemiology: corrected the 1/2265 prevalence geography from Pakistan to the British Asian population of Bradford, UK, and corrected the Europe range to 1–9 per 100000. Added the genetic-frequency model estimate with its Hardy-Weinberg/variant-database assumptions; it is not observed diagnosis or birth prevalence.
    8. Biochemistry and diagnosis: updated to joint 2025 ERS/ATS diagnostic guidance. Genetics must satisfy pathogenicity, gene validity and inheritance; TEM class 1 and class 2 findings have different diagnostic roles. HSV, immunofluorescence and nNO are adjuncts; no single normal test excludes PCD. The standardized 77 nL/min threshold is supportive under the specified protocol, not an acute CRITICAL_LOW value or universal exclusion threshold. Nasal NO production rate is distinguished from FeNO concentration and modeled alveolar NO. Added relevant differential diagnosis and organ/longitudinal assessment.
    9. Treatment and trials: replaced irrelevant prophylactic-antibiotic, hearing-loss and other disease citations with PCD-specific care evidence. Added maintenance azithromycin with BESTCILIA age, FEV1 and six-month scope, culture/NTM considerations and lack of a resolved antimicrobial-versus-immunomodulatory mechanism. Airway clearance, bronchodilators, nasal steroids, hearing aids, reproductive counseling and multidisciplinary support are appropriately individualized. CLEAN-PCD's modest combination-versus-saline signal and nonsignificant placebo comparisons are distinct; the legacy registry retains an ivacaftor protocol description that does not describe the published intervention arms. Human RCT1100-101/102 conference pharmacodynamics are not RCT1100-103 registry results and did not demonstrate post-treatment ciliary restoration. CCDC40 replacement remains preclinical. Brensocatib's FDA non-CF bronchiectasis indication, age restriction and broad ASPEN evidence are recorded without claiming separately established PCD efficacy.
    10. Environmental and model evidence: air-pollution evidence is labeled indirect general-airway literature. Reviewed all animal, culture and computational records, added mechanistic model links, and retained species/assay limitations. Frog ionocyte depletion is adjacent epithelial-system biology, not a human PCD genotype. The generic CFD record is narrowed to verifiable institutional abstract findings; no solver execution, quantitative calibration or patient-genotype prediction is claimed.
    11. Datasets and research consumption: fetched both GEO accessions into individual generated caches and checked live SOFT metadata. GSE272189 has 15 sample records and cultured human DNAH5 material; sample records are not independent patients. GSE254100 has four mouse sample records across control and Cfap221/Cfap54/Spef2 preparations; it directly contradicts the report's blanket no-cross-genotype-omics claim. Restored CFAP54 to the dataset gene list. No raw scRNA-seq was reanalyzed. Pruned empty generic bibliography entries, using primary references with actual findings. The frozen dataset-accession blob was never read, written or staged.

    OpenScientist assessments
    - Expanded and reconciled all three codex YAML/Markdown assessments: 79 claim dispositions and 20 analysis inventories, including three reported-only literature syntheses and 17 skipped future tests. The 11 figure placeholders have no matching committed images. No complete provider search corpus, raw input data, code or executed quantitative artifacts substantiate the claimed paper totals.
    - Canonical report: supported core, corrected CCNO/MCIDAS distinction, universal clearance wording, no-longitudinal-data/only-RCT gaps, mRNA human inference, infertility denominators and nNO/ontology errors. Added current clinical context without treating every new publication as a provider-era error.
    - Laterality report: supported core, rejected ODA-only genotype rule and unsupported turbulent-flow inference, identified pre-existing mechanosensing/Dand5 omissions, distinguished CHD surgical/18,781-CHD cohorts from confirmed-PCD denominators, and qualified negative-control and human-transcriptomic proposals.
    - Severity report: partially supported group associations and cellular mechanisms, rejected fixed-tier overinterpretation and misidentified physiological cohort, corrected denominator/statistical/omics claims, distinguished preprint/final and review evidence from independent replication, and retained clinical actionability as unresolved.

    Validation
    - Disease LinkML schema, strict ontology validation and full sanctioned reference validation passed; the default reference validator checked 225/226 snippets, and a separate exact cached-body audit verified all 226 including the DOI source. All 102 cited sources have generated caches.
    - All three assessment schemas, report quotes, paths and provenance links passed. Targeted duplicate-key, enum, entity-reference, causal-target, qualifier-term, source-defect and snippet-boundary checks were run, together with global offline cache integrity and title/grading/folded-hyphen ratchets.
    - Inspected the causal graph (18 mechanism nodes, 94 total nodes and 92 edges), which has no orphan targets or integrity issues, and rendered the disease page. No artificial causal cycles or unsupported edges were introduced to force a single connected graph. Generated pages and temporary graph images are excluded from the curation commit. Reviewed the full semantic diff against origin/main, restored applicable existing anatomical/process bindings, and removed an unsupported motility-to-redox causal inference while retaining the directly genotype-associated cellular finding. Pre-commit formatting and checks complete the submission gates.

  summary: Evidence-claim mismatch review (#13157)
  details: |
    Reviewed the 13 whole-claim MISMATCH findings and the highest PARTIAL findings from the Jev evidence_claim_match assessment (source revision e7b43a48, unchanged on main). Replaced snippets that did not carry the claim: nasal NO now cites the ERS/ATS guideline sentences on low nNO in most PCD and on nNO above threshold not excluding PCD, and the C1d study sentence reporting normal nasal NO production; the cystic fibrosis differential cites the guideline's alternative-diagnosis sentence and the Leigh 2013 nNO overlap with CF; the CLEAN-PCD trial gains the published combination-versus-saline result its description quotes; the heterotaxy edge quotes the full situs distribution so the with-or-without cardiovascular wording is supported; the RSPH1 FEV1 fragment is extended to name the compared groups; the GSTA2 catalase snippet now names the knockdown; the Xenopus foxi1e model and link cite the knockdown result rather than a system description; the IFT88 knowledge-gap discussion identifies the mouse model and adds the authors' nonmotile-cilium explanation for why it differs from axonemal PCD. Retained without change: nasal polyposis (snippet supports the phenotype and the up-to-15% note), the GSTA2 knockdown link and readout (snippet states the measured result; limitations already separate knockdown from the patient state), the NCT02871778 registry quote (explanation already distinguishes protocol from published comparison), and the M2-like macrophage sputum evidence (the node description already scopes it as ex vivo). Validated with just validate, validate-terms, count-verified-snippets (288/288) and validate-disorders.

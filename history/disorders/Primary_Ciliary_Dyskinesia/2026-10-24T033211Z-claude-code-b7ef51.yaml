  summary: 'Genetics pass: 22 gene-defined CILD strata, 10 genes, two new pathograph
    nodes'
  details: |
    Added the 22 gene-defined strata of the numbered CILD series that issue #12216 listed as
    uncurated: 19 full has_subtypes rows and 3 pointer rows (CILD3, CILD37, CILD40) whose
    content lives in Primary_Ciliary_Dyskinesia_3, _37 and _40. Every row carries a
    MONDO-bound subtype_term, one HGNC-bound gene, an inheritance block bound to HP:0000007
    (HP:0000006 for the autosomal dominant FOXJ1 stratum CILD43), the ClinGen Motile
    Ciliopathy Gene Curation Expert Panel validity row as evidence, and, on the 19 that are not pointers, a
    primary-literature evidence item quoted from the founding report.

    Added 10 genetic records (DNAL1, ZMYND10, ODAD2, DRC2, SPAG1, RSPH3, DRC4, DNAJB13,
    CFAP300, CLXN) and a reciprocal subtype foreign key on the 12 genes the entry already
    held. All 46 subtypes are now referenced by a subtype foreign key and 44 of 46 reach the
    pathograph.

    Pathograph: two new upstream nodes, Radial Spoke Defect (RSPH1, RSPH3, RSPH4A, RSPH9,
    DNAJB13) and Nexin-Dynein Regulatory Complex Defect (DRC1, DRC2, DRC4), each with a
    GO-bound process and cellular component and a DIRECT edge into Ciliary Dysfunction. The
    radial spoke and nexin-link genes were moved off Ciliary Dysfunction into those nodes;
    the new genes otherwise land on Cytoplasmic Dynein Arm Preassembly Failure (CFAP300,
    ZMYND10, SPAG1), Outer Dynein Arm Docking and Attachment Failure (ODAD2, CLXN) and
    Ciliary Dysfunction (DNAL1). Gene-to-mechanism wiring goes from 38/42 to 48/52; the four
    genes that stay unwired are the four ClinGen Limited genes, which this entry has never
    wired.

    DAW1 (CILD52) is recorded with ClinGen's Limited grade for primary ciliary dyskinesia and
    its higher Moderate grade for visceral heterotaxy, because the founding report calls the
    entity a motile ciliopathy with laterality defects and a later report describes heterotaxy
    and congenital heart disease with no evidence of primary ciliary dyskinesia.

    Validated with just validate, just validate-terms, just count-verified-snippets
    (616/616 over the three changed files) and just validate-disorders; the 13
    references_cache files the validator rewrote as trailing-whitespace churn were reverted
    and the snippet count retaken afterwards.

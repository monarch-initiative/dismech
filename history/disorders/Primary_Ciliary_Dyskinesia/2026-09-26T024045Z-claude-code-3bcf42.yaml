  details: |
    Genetics pass for the gene-defined subtype series under the Primary_Ciliary_Dyskinesia umbrella
    (issue #12215, series-008 part 1, 25 MONDO leaf terms).

    Anchor check first. The parent's disease_term is MONDO:0016575 primary ciliary dyskinesia, read live
    from EBI OLS4 in this session. The entry is the PCD umbrella, so the anchor is not over-broad and the
    dismech#12184 narrowMatch remedy does not apply here: the 25 checklist terms really are gene-defined
    subtypes of this entry rather than unrelated diseases pulled in through a wrong binding.

    Gene and subtype identity were established from three independent sources, each read in the same step
    the identifier was written. HGNC REST (rest.genenames.org/fetch/hgnc_id) gave the approved symbol,
    previous symbols and aliases for all 25 HGNC ids; EBI OLS4 gave the MONDO label, definition, synonyms
    and cross-references for all 26 MONDO terms; and the committed ClinGen Gene-Disease Validity CSV
    (cache/clingen/gene_validity.csv, snapshot 2026-08-13) gave the Motile Ciliopathy Gene Curation Expert
    Panel's own gene / numbered-disease / MONDO / mode-of-inheritance / classification row. A generator
    script copied the ClinGen assertion id, cache title and quoted row out of the CSV and the cache file
    rather than transcribing them, and asserted that each row's own HGNC column matched the CURIE being
    bound. The Orphanet PCD record (references_cache/ORPHA_244.md) independently carries a gene row with
    the same HGNC id for every one of the 17 newly added genes.

    ClinGen keyed 21 of the 25 rows to the numbered MONDO term itself, which is what makes the
    subtype-to-gene mapping citable rather than inferred from the issue's checklist. HGNC's alias lists
    corroborate the numbering independently for 15 of them (DNAAF2 carries CILD10, CCDC39 carries CILD14,
    and so on).

    Curated: 24 has_subtypes rows, each with a MONDO-bound subtype_term, a single HGNC-bound gene, an
    inheritance block bound to HP:0000007 or HP:0001417, and ClinGen evidence for both the gene-disease
    relationship and the mode of inheritance. 15 of the 24 also carry a primary-literature evidence item
    quoted from the abstract. 17 new genetic records (DNAAF1-6, DNAAF11, DNAAF19, CFAP298, TTC12, LRRC56,
    NEK10, NME5, DRC1, ODAD4, HYDIN, BRWD1) and a reciprocal genetic[].subtype foreign key on all 24
    subtypes, including the 8 genes that were already curated on this entry.

    Pathograph wiring: three new pathophysiology nodes, each a distinct site of action rather than one flat
    gene list. Cytoplasmic Dynein Arm Preassembly Failure (DNAAF1-6, DNAAF11, CFAP298, TTC12) covers the
    pre-import cytoplasmic step; Outer Dynein Arm Docking and Attachment Failure (ODAD1, ODAD4, DNAAF19)
    covers the axoneme-resident docking step; Central Pair Apparatus Defect (HYDIN, SPEF2) covers the
    central-pair lesion and is kept separate from the existing C1d-projection node, whose description and
    evidence are specific to CFAP46/CFAP54/CFAP74/CFAP221. All three feed Ciliary Dysfunction. DRC1, NEK10,
    NME5, NME8 and LRRC56 were added to the existing Ciliary Dysfunction node, whose own description
    already covers dynein motors, their cytoplasmic assembly or docking, and axonemal regulatory
    structures. DNAH7 and TTC12 were wired to the previously gene-free Sperm Flagellar and Reproductive
    Tract Dysfunction node.

    DNAAF19 was placed on the docking/attachment node rather than the preassembly node despite its DNAAF
    symbol, because its founding report describes the product as axoneme-associated and as a dynein-arm
    attachment factor. Its term.label is bound to CCDC103, the canonical label the ontology build that
    term validation reads still carries for hgnc:32700, with the approved symbol DNAAF19 in preferred_term;
    the rationale is recorded in the record's notes.

    Declined: MONDO:0957396 ciliary dyskinesia, primary, 51 (BRWD1). ClinGen classifies the
    BRWD1-primary ciliary dyskinesia relationship as Disputed, and the founding human report titles its
    own respiratory claim as likely primary ciliary dyskinesia and describes the phenotype as MMAF with
    PCD or PCD-like symptoms. BRWD1 is recorded as a genetic entry with relationship_type DISPUTED and
    is deliberately not wired into the pathograph; no has_subtypes row was created.

    Two further rows were curated with the discrepancy stated in the row's own description rather than
    declined: MONDO:0012571 primary ciliary dyskinesia 6 (NME8) and MONDO:0957252 ciliary dyskinesia,
    primary, 50 (DNAH7), both graded Limited by ClinGen against the unnumbered PCD term. MONDO:1010146
    CFAP46-related primary ciliary dyskinesia is likewise Limited and has no OMIM cross-reference.

    BRWD1 and DNAH7 are the disagreement worth escalating: OMIM places both in the numbered CILD series
    on the strength of MMAF cohorts, while the ClinGen Motile Ciliopathy expert panel grades one Disputed
    and the other Limited for PCD. That is an OMIM/ClinGen disagreement that MONDO mirrors rather than a
    MONDO error; it is reported in the PR for a human to decide whether it warrants an upstream issue.
    No upstream issue was filed.

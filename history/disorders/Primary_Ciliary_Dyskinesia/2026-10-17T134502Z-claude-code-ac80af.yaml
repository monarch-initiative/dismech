  summary: Record that LOINC has no nasal nitric oxide code, leaving the entry's 77
    nL/min bands unkeyed
  details: |
    LOINC Diagnostics tranche G, batch 28, the closing batch. Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows. Every KG query was paginated to its stated total. Validation for the whole batch: just validate-disorders over the five changed files reported 744 snippets and 793 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Nothing is bound on either nasal nitric oxide row, and the reason is an outright absence rather than a judgement. Both sources were enumerated in full. The release holds 11 codes whose name contains nitric oxide: one nitric oxide in exhaled gas, one fractional concentration of exhaled nitric oxide, and nine ventilator and gas-delivery-system codes for monitoring inhaled nitric oxide therapy. No code carries nasal in its system together with nitric oxide, none pairs the two words in its name, no naming variant such as nitrogen oxide or nitrogen monoxide appears, and no code anywhere in the release reports nL/min, the unit this measurement uses. The KG returns 12 nitric oxide records with one Part, zero records for nasal nitric oxide, and 30 nasal records whose only Part is the specimen nasal fluid. The two exhaled codes were declined because nasal nitric oxide is a production rate from the nasal cavity measured at velum closure while those code a concentration in lower-airway breath, which is the asthma marker. The unqualified nitric oxide Part was also declined, and that decision marks a limit on the Part-first preference: a Part was bound in Trehalase_Deficiency because it sat above two records and carried nearly all the specificity available, whereas this one sits above twelve spanning nasal screening, an asthma marker and ventilator therapy. What makes this the sharpest gap in the tranche is that the entry already carries correct reference-range bands at the 77 nL/min velum-closure threshold with no loinc_term, so a disease-owned numeric threshold is curated with nothing to key it to. The biochemical row already had a notes field; the LOINC paragraph was appended to it and the original text kept verbatim rather than adding a second notes key. An earlier attempt to record this in an invented loinc_term_absent_reason slot was blocked by the pre-edit schema hook, correctly.

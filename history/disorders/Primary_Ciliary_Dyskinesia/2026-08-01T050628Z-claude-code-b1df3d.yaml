  details: |
    Reconciled the three mechanistic_hypotheses nodes in Primary_Ciliary_Dyskinesia.yaml with the independently-assessed OpenScientist hypothesis-report sidecars under kb/hypotheses/Primary_Ciliary_Dyskinesia, per issue 7305. 1. Reworded the genotype_ultrastructure_severity notes away from 'mucociliary clearance is uniformly absent across genotypes' to source-faithful wording, citing PMID:38076675 (Marthin et al. 2023), which documents one CCDC103-carrier exception with residual clearance, and added it as a new PARTIAL evidence item. 2. Narrowed the embryonic_nodal_cilia_laterality notes so RSPH1, CCNO, and DRC1 are no longer presented as three equivalent negative-control genotypes; DRC1's only support (PMID:42185991) is a single case report plus literature review, not an independent cohort. 3. Recast the genotype_ultrastructure_severity description's discrete Severe/Standard/Mild tier model as a proposed, testable stratification rather than what 'the evidence best supports'; only the Severe (CCDC39/CCDC40/CCNO) and Mild (RSPH1) extremes are well supported, the Standard tier and exact boundaries are unvalidated. 4. Marked the 135/100/59 provider-reported paper counts in the three hypothesis notes as unverified, since the deposited citation manifests expose only 50/37/26 unique PMIDs with no reconstructable search log. All four corrections mirror RETAINED/QUALIFIED/REJECTED verdicts already recorded in the codex assessment YAMLs under each hypothesis's assessments directory. Validated with 'just validate kb/disorders/Primary_Ciliary_Dyskinesia.yaml': schema, term, and reference validation all pass, 165/165 snippets verified against cached references, including the new PMID:38076675 fetched via 'just fetch-reference'.

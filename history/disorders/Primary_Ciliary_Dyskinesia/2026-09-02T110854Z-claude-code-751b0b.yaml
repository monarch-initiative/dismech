  summary: 'Integrate assessed OpenScientist findings: RGMC node, nodal-flow and genotype-severity
    evidence, six discussions'
  details: |
    Integration pass over the three existing codex assessments of the OpenScientist hypothesis reports for this disease; no new assessment sidecars were written because openscientist-assessment-by-codex.yaml already existed in all three assessments/ directories.

    From canonical_motile_cilia_beat_failure (SUPPORTED): added a new pathophysiology node 'Reduced Generation of Multiple Motile Cilia' (RETAINED claim reduced-multiciliogenesis-route) with CCNO/MCIDAS genes, CL:0005012, GO:0044458 and GO:0098534 both DECREASED, a DIRECT downstream edge to Impaired Mucociliary Clearance in the canonical hypothesis group, and evidence from PMID:24747639 and PMID:25048963. Added PMID:31772028 (75-patient high-speed videomicroscopy, quantitative beat parameters by ultrastructural class) to the Ciliary Dysfunction node. The report's QUALIFIED branches were deliberately not added as pathograph nodes and were recorded as discussions instead: non-inflammatory airway remodeling (HUMAN_MODEL_MISMATCH, IFT88 mouse, PMID:24213915), the pan-epithelial NOS defect (KNOWLEDGE_GAP, PMID:23290188 and PMID:24189859), and the M2-macrophage endotype (KNOWLEDGE_GAP, PMID:41582098). The report's proposed CL:0000710 'multiciliated cell', CL:0000235 'M2 macrophage' and GO:0060271 'multiciliated cell differentiation' mappings were rejected by the assessment as mislabeled and were not used.

    From embryonic_nodal_cilia_laterality (SUPPORTED): added PMID:12097914 (Nonaka artificial nodal flow) as evidence on the mechanistic_hypotheses entry, which previously referenced that experiment in notes without citing it. Added two discussions: a HUMAN_MODEL_MISMATCH recording that every mechanistic step of the nodal-flow chain is non-human, and a KNOWLEDGE_GAP on the unexplained situs ambiguus/heterotaxy fraction (PMID:24577564), each with a proposed experiment. The report's UBERON:0003080 'ventral node' and GO:0003351/GO:0060287 mappings were rejected by the assessment and were not used; DRC1 was not added as a laterality-sparing negative control because the deposited evidence is a case report.

    From genotype_ultrastructure_severity (PARTIALLY_SUPPORTED): added three evidence items to the existing hypothesis entry - PMID:38871375 (1236-individual ERN-LUNG registry FEV1 z-scores by gene), PMID:26777464 (pooled CCNO series behind the severe-tier placement), and PMID:38602513 as REFUTE against the DNAH5-versus-DNAH11 distinction. Added a KNOWLEDGE_GAP recording the absence of any prospective or interventional genotype-stratified study, with a proposed cohort design; that discussion carries no evidence block because the claim is the absence of a study design. Status left at EMERGING and the three-tier model was not promoted, per the assessment. The report's OMIM subtype-ontology proposal was rejected as conflicting with project ontology policy.

    Verified with count-verified-snippets (190/190), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length and check-folded-hyphens, all passing.

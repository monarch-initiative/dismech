  summary: Curate PCD experimental readouts, ciliary disorientation and testable model
    knowledge gaps
  details: |
    Expanded the entry from five to eleven human experimental models and populated fourteen model-mechanism links with sixteen structured readouts. New models cover C1d patient transport assays, BMI1-expanded DNAH5 donor cells, iPSC airway-on-a-chip, the reported BCi-NS1.1 dyskinetic stock, CCDC40 wild-type/mutant mixtures and GAS2L2 patient nasal cultures. Added the GAS2L2 ciliary-disorientation mechanism and genetic association. The mechanism-to-clearance edge uses indirect mouse evidence, separate from patient-culture orientation measurements.

    Added four open discussions with proposed experiments, controls and pre-specified interpretation criteria: C1d transport inefficiency beyond routine beat assessment; fidelity across fresh samples, culture platforms and passage; genotype/spatial dependence of mosaic correction; and mechanical conditioning versus intrinsic ciliary coordination. Proposed outcomes are not represented as observed results. Technical fields and wells are distinguished from independent donors. Null results with narrow uncertainty are informative; imprecise results remain inconclusive.

    Primary evidence was fetched through just fetch-reference, with independent title/snippet checks for PMIDs 29481304, 30665704, 34233948, 41064994 and 41757021, alongside existing cached PCD model studies. The 2026 CCDC40 mixing study is explicitly a preprint. Its fitted ex vivo benchmark is COMPUTATIONAL evidence, while measured transport speeds are IN_VITRO. The benchmark uses wild-type representation among ciliated cells and is not interchangeable with mRNA expression-positive fractions or a clinical treatment threshold. BMI1 ion-current findings are recorded as exploratory model-specific observations.

    GeneReviews NBK1122 (updated 2025-05-22) was consulted as a clinical baseline: respiratory onset, bronchiectasis, ENT/hearing, reproductive manifestations, situs/heterotaxy, rare hydrocephalus, integrated diagnosis, inheritance and multidisciplinary management are represented in the pre-existing entry. PMID20301301 is tagged and cached, but its current abstract is an overview of chapter purposes rather than clinical recommendations; no clinical snippets were invented from that abstract. Existing Falcon research was cross-checked for major omissions; its automated preflight returned SKIP because MONDO:0016575 has no single canonical causal gene. Manual disease-name and genetically heterogeneous motile-ciliopathy identity checks were consistent. The older zero-duration cyberian-codex local-synthesis citation inventory was not used as research evidence.

    Fresh-context review under dismech-pr-review found the model/readout claims and overall clinical coverage adequate. Addressed review feedback by classifying the fitted threshold as computational, distinguishing fitted plateau from benchmark, adding the exploratory BMI1 ion-current finding and encoding indirectness on the GAS2L2 mouse-clearance evidence. The reviewer found no remaining blocking biological issues.

    Validation passed for schema, ontology terms and references via just validate-disorders. The explicit DOI-inclusive snippet audit verified all 281 snippets. Reference-cache frontmatter check passed, with two unrelated pre-existing delimiter advisories. The only term-cache addition is the validator-generated GAS2L2 HGNC binding. Changes were made in a separate worktree; unrelated reference-cache modifications were excluded. The frozen dataset-accession blob was not read or changed.

    Supplementary just research-disorder claude_code Primary_Ciliary_Dyskinesia was started before editing. It produced no report during the approximately fourteen-minute run and was explicitly cancelled after primary-source curation and independent review were complete (exit 143 from termination). No generated report from that run is claimed or committed. The completed existing Falcon report and directly fetched primary studies supplied the research basis. Entity-reference validation passed, and the causal-target audit found no prefixed, dangling or self targets.

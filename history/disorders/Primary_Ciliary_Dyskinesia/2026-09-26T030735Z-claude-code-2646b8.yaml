  summary: 'Review round 1: revert out-of-scope baseline edit, prune orphaned reference
    cache'
  details: |
    Review round 1 on PR #12876. No curation content changed.

    The "Check curation PR scope" CI step failed because the PR edited
    tests/title_snippet_baseline.txt, which is outside the paths a curation PR may
    touch (kb/, stubs/, history/, cache/, references_cache/, research/, pages/,
    dashboard/). The objection was to the location of that edit, not to any
    curated claim.

    The baseline edit is therefore reverted to its origin/main content. The
    underlying curation stands: the DNAI1 evidence item citing PMID:11893720 was
    removed in the previous commit because that reference has no abstract on PubMed
    (Chest 2002;121(3 Suppl):97S), so under linkml-reference-validator 0.3.0rc1 its
    re-fetch yields content_type unavailable and the snippet cannot verify. Its
    snippet was the paper's own title, and the DNAI1 record retains four other
    evidence items including the primary human-family study PMID:11231901. The
    baseline line for that snippet is now inert: scripts/check_title_snippets.py
    treats the baseline as a ceiling, CI grandfathers against kb/ at the base branch
    rather than against the committed file, and no test requires the two to agree.
    Shrinking it remains worth doing as its own small PR.

    references_cache/PMID_11893720.md is pruned in the same push. Removing the
    evidence item left it cited nowhere in kb/, and an uncited reference cache
    should not stay tracked.

  details: |
    Review round on PR 15451. Blocking finding: NME5 was wired to the Ciliary Dysfunction node while this PR's own rewrite of that node's description says radial spoke and nexin-dynein genes are wired to their separate upstream nodes rather than there, so the node's prose contradicted its gene list. NME5 is moved to Radial Spoke Defect, the node's description now names it as a spoke neck component, and PMID:32185794 is cited on the node for the placement, quoting the sentence that NME5 encodes a protein component of the RS neck. Extended the PMID:19200523 MODEL_ORGANISM snippet on the same node so the model systems sit inside the quote the grading rests on: it now begins at the investigation of knockdown or mutations of RSPH9 orthologs in zebrafish and Chlamydomonas rather than mid-phrase. Marked the CILD11 situs evidence item INDIRECT, because the quoted sentence reports both the human and the zebrafish result while the claim it supports is the human one. The ten gene-activity baseline exemptions are unchanged and remain purely additive with nothing removed or raised. The branch was also rebased onto current main, 39 commits behind at the time, because the grounding gate in ref mode had begun reporting genes in unrelated entries that main has since grounded while this branch still carried the ungrounded copies; after the rebase the gate reports no newly ungrounded genes. Validation after the rebase: validate-disorders passed on all three entries with 642 titles and 0 issues, 632 of 632 snippets verified with validator cache churn reverted, no per-list duplicate record names, and each of the three entries has a non-empty diff against main.

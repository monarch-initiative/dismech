  summary: Re-apply outstanding OpenScientist findings
  details: |
    Batch-2 re-application of the earlier OpenScientist sweep (branch os-review-fable) onto the rewritten main entry. Four citations from that sweep were still absent. Applied three. PMID:26777464 (CCNO variant series, Israel) and PMID:38602513 (Belgian single-centre DNAH5 vs DNAH11 comparison, REFUTE) were added as evidence on mechanistic_hypotheses genotype_ultrastructure_severity: main's notes already asserted both points in prose (CCNO percentages pool new and previously reported cases; a small nonsignificant DNAH5/DNAH11 comparison does not prove equivalence) with no citation anywhere in the entry, so these ground claims the entry was already making. PMID:24213915 (conditional IFT88 deletion, noninflammatory bronchiectasis in mice) was added as a new HUMAN_MODEL_MISMATCH discussion PCD-GAP-005 with one proposed experiment, attached to pathophysiology#Bronchiectasis and Airway Wall Remodeling and pathophysiology#Periciliary Barrier Dysfunction; main discusses that experiment in three descriptions and its canonical hypothesis notes but never cited it. Skipped PMID:24577564 (Shapiro 2014, at least 12.1 percent situs ambiguus): main covers the laterality distribution with the larger 559-participant cohort PMID:36342963 and its laterality notes explicitly warn that the older North American cohorts overlap, so adding the earlier figure would risk double-counting the same consortium population. All snippets re-derived and verified against the current references_cache records, not copied from the old branch. Structural items from the old sweep were already present on main: the CCNO/MCIDAS node exists as Reduced Multiciliogenesis with the edge into Impaired Mucociliary Clearance, the artificial-nodal-flow experiment is cited as PMID:12097914 on three nodes, and five of the old sweep's six discussion topics (NOS defect, inflammatory endotype, mouse-node extrapolation, unexplained situs ambiguus fraction, absent prospective genotype-stratified study) are covered in main's node descriptions and hypothesis notes. Hypothesis statuses unchanged; severity model remains EMERGING. Checks: linkml-validate no issues; 284/284 snippets verified; duplicate-keys, entity-refs, causal-targets, enum-values all OK.

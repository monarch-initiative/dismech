  summary: Add CFAP54 and the C1d diagnostic-elusiveness caveat
  details: |
    Added a CFAP54 genetic entry backed by the ClinGen Gene-Disease Validity assertion classifying the relationship as Strong, and a diagnosis entry recording that C1d-defective PCD evades the standard diagnostic algorithm - nasal nitric oxide, transmission electron microscopy and high-speed videomicroscopy all return normal, and PICADAR scoring is unreliable, so a patient can pass the standard workup. Follow-up commit addressed the review: corrected a parenthetical that falsely implied all three of CFAP46, CFAP74 and CFAP221 are curated in this entry (CFAP74 is not), and added the positive half of the caveat as evidence - in vitro ciliary transport assays do detect insufficient clearance in these patients, which is what makes this a diagnostic-pathway problem rather than a claim that the patients have no ciliary defect. Also committed the hgnc:26456 CFAP54 cache row that term validation generates, which the first commit omitted. Validation: linkml-validate clean, linkml-term-validator passed, 170/170 snippets verified against cached references, title audit 0 mismatches.

  details: |
    Created silicotuberculosis (MONDO:0021804) as active tuberculosis in silicosis/silica-exposed hosts. Covers silica-impaired alveolar macrophage control of M. tuberculosis (necrotic death, reduced TLR2, type-2 skew via cGAS/STING), NLRP3 and silicotic-nodule fibrosis, the severity-graded ~4x TB risk, HIV as multiplicative co-factor, diagnostic overlap/cavitation, and the 6-vs-8-month regimen and preventive-therapy evidence. Lumped per infectious-disease granularity ladder; conforms_to nlrp3_inflammasome_activation, fibrotic_response and granuloma_formation. Seeded from a claude_code deep-research report; all 75 snippets verified against cached references.

  summary: 'Address review on #17559: remove misattributed KCNK4 differential'
  details: |
    Removed the 'KCNA4 gain-of-function neurodevelopmental disorder' differential and the matching notes clause. The p.Ala172Glu/p.Ala244Pro variants of Bauer et al. 2018 are KCNK4 (TRAAK) variants defining FHEIG syndrome; the Kessi et al. systematic review (PMID:32655623) files that paragraph under its KCNA4 heading in error, and PMID:33594261 in references_cache attributes them to KCNK4. FHEIG shares no cataract or striatal features with this disease, so no replacement differential was added. Dropped the Kessi review's general potassium-channelopathy pharmacotherapy sentence from the genetic counseling treatment; its separate quote on KCNA4 loss of function (citing Kaya 2016, the causal-variant paper) is kept on the intellectual-disability edge. Set therapeutic_modality on genetic counseling to OTHER, and reworded the FDG-PET description to the source's 'severe hypometabolism'.

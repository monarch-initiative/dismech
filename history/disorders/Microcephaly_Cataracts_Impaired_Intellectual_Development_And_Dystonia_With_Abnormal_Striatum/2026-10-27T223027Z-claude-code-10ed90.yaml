  summary: 'Create: Microcephaly_Cataracts_Impaired_Intellectual_Development_And_Dystonia_With_Abnormal_Striatum'
  details: |
    New entry for the KCNA4-associated autosomal recessive syndrome (MONDO:0032656,
    OMIM 618284). The disease is known from one consanguineous Saudi family with four
    affected siblings, described in two reports: Al-Owain et al. 2013 (PMID:23181898,
    clinical description and linkage) and Kaya et al. 2016 (PMID:27582084, KCNA4
    p.Arg89Gln and oocyte electrophysiology). The Kaya cache was upgraded to PMC full
    text with fetch-reference --force so that Table 1 frequencies and the clinical
    paragraph could be quoted. All phenotype frequencies are n=4 from one sibship.

    Deep research: claude_code report. Reference validation 8/8 resolved, 1/1 quote
    found, none off topic; term validation 37/43 resolved, the rest MGI/EXT_ID prefixes
    with no resolver. preflight-dr returned WARN only because its heuristic lexicon
    counted the disease acronym MCIDDS as a second gene; OMIM 618284 and KCNA4 matched,
    so the report is about this disease. Claims the report drew from OMIM, GenCC,
    UniProt, MGI and the Arizona ocular database were not used, because none of those
    sources is cached and quotable here; this includes the GenCC "Limited" validity
    tiers, a cataract-surgery statement and the MGI note on seizures in a subset of
    Kcna4 knockout mice. PMID:21673715 (striatal neuron ischaemic vulnerability in
    Kv1.4/Kv4.2-deficient mice) was read but not cited directly; the entry quotes the
    Kaya discussion sentence that relies on it instead.

    GeneReviews: check-genereviews --online reports NO_CHAPTER for GeneReviews and
    StatPearls. No treatments section: neither report describes therapy.

    Pathograph: KCNA4 loss of function (molecular) -> reduced neuronal A-type K+
    current (cellular) -> striatal structural abnormality (tissue) -> putamen and
    caudate MRI phenotypes, dystonia and cogwheel rigidity; the cellular node also
    leads to intellectual disability and ADHD; KCNA4 loss -> loss of lens transparency
    (tissue) -> congenital cataract. The steps beyond the molecular node are the
    reporting authors' hypotheses and are tagged with two EMERGING hypothesis groups.
    Microcephaly, growth delay, motor and speech delay, pyramidal signs, glaucoma,
    corneal opacity and the FDG-PET finding are left unwired because no source
    proposes a mechanism (7 of 18 phenotypes connected).

    Conformance: the lens node conforms to
    cataract_lens_opacification#Loss of Lens Refractive Transparency and Light
    Scattering, at the terminal node only, since crystallin involvement is untested.
    Rejected: epilepsy_excitation_inhibition_imbalance (no seizures in this family;
    the module's chain ends in seizures) and
    neural_progenitor_centrosome_spindle_dysfunction (no progenitor mechanism
    proposed for the microcephaly).

    Validation: just validate, count-verified-snippets 49/49, validate-disorders
    passed; entity-ref, causal-target, logical-rule, coarse-phenotype, enum,
    duplicate-key and block-scalar checks clean.

    PR review response (changes requested): the FDG-PET phenotype snippet
    stopped before the words naming the imaging method, so it could not show
    the hypometabolism was a PET finding. It now quotes through to
    "deoxyglucose positron emission tomography", with an ellipsis bridging
    the bracketed "[18F]" that the validator strips. The KCNA4
    epileptic-encephalopathy differential now also cites the patch-clamp
    sentence that supports calling p.V558L loss of function.

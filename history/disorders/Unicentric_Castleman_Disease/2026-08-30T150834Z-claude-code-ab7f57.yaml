  summary: Address review on PR 9974
  details: |
    Addresses the CHANGES_REQUESTED review from ai4c-reviewer on PR 9974.

    Critical: the terminal pathograph edge targeted 'Generalized Lymphadenopathy' while the phenotype had been renamed 'Localized Lymphadenopathy' during the split, so the edge dangled and the entry's only phenotype was orphaned. downstream[].target is exempt from test_entity_ref_foreign_keys, so no test caught it. Target corrected and the edge explanation rewritten to state the single-region claim rather than the UCD/MCD contrast.

    The stromal VEGF node made a UCD-specific claim on an MCD-only snippet. Replaced with the UCD sentence from the same paper ('In UCD, VEGF expression was confined to the follicles...') plus the FDC-to-penetrating-vessel sentence, both verified verbatim.

    The Anemia phenotype was evidenced by an iMCD cohort frequency (85.3%), the wrong population. Replaced with the UCD-population meta-analysis quote, and the note no longer implies any UCD-specific rate, because none is reported.

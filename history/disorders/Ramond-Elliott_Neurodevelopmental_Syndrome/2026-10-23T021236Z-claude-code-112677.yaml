  summary: 'Create: Ramond-Elliott Neurodevelopmental Syndrome'
  details: |
    New entry for the TRA2B neurodevelopmental syndrome (MONDO:0980751), curated from the defining 12-person cohort (PMID:36549593), the second case report (PMID:37958557) and the neural-specific Tra2b knockout mouse (PMID:24586484). The pathograph runs from the 5' variant isoform switch (canonical Tra2-beta-1 down, repressive Tra2-beta-3 up; pre-mRNA binding, dominant negative) to disrupted exon inclusion and, via the mouse-only precursor apoptosis step, to microcephaly and brain anomalies. Both human sources are abstract-only in the cache, so per-feature frequencies reported in the full text are not recorded. A claude_code deep-research report was used as leads. just preflight-dr was not run (no local MONDO build). Validated with validate, validate-terms, count-verified-snippets, entity-ref, causal-target, duplicate-key, gene-activity-grounding and coarse-phenotype checks.

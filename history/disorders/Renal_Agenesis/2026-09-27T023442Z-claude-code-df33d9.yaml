  summary: 'Genetics pass: bind renal hypodysplasia/aplasia 1-4 subtypes, curate GFRA1,
    wire genes'
  details: |
    Genetics pass for issue dismech#12264 (d2g series-057). Verified the parent anchor: MONDO:0018470 is the correct class, recorded as equivalent to the OMIM phenotypic series OMIMPS:191830, and all four MONDO-numbered children (renal hypodysplasia/aplasia 1 to 4) are direct hierarchical children of it, so the re-nomination mechanism here is absent gene-defined has_subtypes rows rather than an over-broad anchor. Added RHDA1 (MONDO:0024519, ITGA8), RHDA2 (MONDO:0014319, FGF20), RHDA3 (MONDO:0024520, GREB1L) and RHDA4 (MONDO:0030822, GFRA1) as gene-defined subtype rows beside the existing laterality rows, each with genes and exact-quote evidence, and inheritance blocks on all but RHDA2. Curated GFRA1 (hgnc:4243, read live from rest.genenames.org) as a new causal gene from PMID:33020172, PMID:34737117 and PMID:36292572. Repointed the ITGA8, FGF20 and GREB1L genetic subtype foreign keys from the Syndromic row to their RHDA rows, because the cited sources describe nonsyndromic forms, and amended the Syndromic row description accordingly. Added relationship_type CAUSATIVE to those three rows and to GFRA1; left RET and PAX2 untyped because this entry cites no gene-specific causal evidence for RET. Wired genes into the pathograph: PAX2, GREB1L and ITGA8 as genes on the ureteric-bud induction node with two supporting evidence items added there, plus two new mechanism-specific nodes, one for GDNF co-receptor complex failure at the Wolffian duct (GFRA1, RET) and one for nephron progenitor stemness failure (FGF20), each with its own downstream edge. Removed the unsourced FGF20 attribution from the disease-level autosomal recessive inheritance description and replaced it with GFRA1, which the cited report states; the RHDA2 row records the searches that failed to establish FGF20 transmission mode. Validation: just validate passed, validate-terms passed, 45/45 snippets verified, gene-term identity 28/28 compared against HGNC with 0 findings.

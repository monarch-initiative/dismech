  summary: 'Create: NEDBEH (RERE-related neurodevelopmental disorder)'
  details: |
    Created the NEDBEH entry (MONDO:0014857, OMIM:616975, RERE / hgnc:9965) de novo.

    DUPLICATE PREFLIGHT. Checked all three surfaces before starting. git grep over
    origin/main kb/disorders found no RERE-anchored entry (the only word-boundary
    RERE hits are incidental mentions in Laryngotracheoesophageal_Cleft, MED13_Syndrome,
    and Vitiligo). GitHub issue and PR searches for RERE, NEDBEH, and MONDO:0014857
    returned nothing covering this entity. Note that an initial MONDO guess
    (MONDO:0014907) was wrong - that ID is short-rib thoracic dysplasia 15 - and the
    correct term was obtained by OAK label search and confirmed by its RO:0004003
    relation to HGNC:9965 and OMIM:616975 xref.

    DEEP RESEARCH PROVIDERS. The default provider, falcon, was attempted first and
    FAILED: the Edison API returned HTTP 402 Payment Required, so no falcon report
    exists for this entry and none of its content was used. Two substitutes were run
    instead, both successfully:
      - claude_code (research/..._-deep-research-claude_code.md): 16 web searches,
        24 turns. Its own reference_validation reports 8/8 references verified,
        confabulation_rate 0.0, but needs_review true because one reference
        (PMID:9150137, a generic SMRT/mSin3A/HDAC corepressor paper) scored off
        topic. That reference was NOT cited in this entry - it is generic nuclear
        receptor corepressor background rather than RERE-specific evidence.
      - openscientist (research/..._-deep-research-openscientist.md): 16/16
        references verified, 0 not found, confabulation_rate 0.0, no unresolved
        references.

    NEC PREFLIGHT. just preflight-dr was run against MONDO:0014857 on BOTH reports
    and both returned PASS: RERE mentioned 64 times (claude_code) and 52 times
    (openscientist), dominant over every rival gene, with report OMIM identifiers
    matching the MONDO xref. This mattered here because the claude_code report itself
    flagged a Named Entity Confusion risk against CDK19/DEE87 (OMIM:618916); that
    entity is explicitly excluded in the entry notes.

    EVIDENCE DISCIPLINE. The claude_code report states plainly that its own quotes are
    paraphrased from secondary sources and must not be treated as verbatim. That
    warning was honoured: NO snippet in this entry was taken from either research
    report. Every PMID was fetched with just fetch-reference and every snippet was
    copied from the actual cached abstract in references_cache/.

    GENEREVIEWS BASELINE (required step). PubMed search found the GeneReviews chapter
    "RERE-Related Disorders" (Scott DA, Sherr EH), PMID:30896913. It was fetched,
    cached, tagged GeneReviews in the top-level references block, and used as the
    phenotype baseline. Every phenotype in its Clinical Characteristics paragraph is
    represented: developmental delay, intellectual disability, hypotonia, feeding
    problems, ADHD, self-injurious behaviour, autism, coloboma, optic nerve anomalies,
    microphthalmia, Peters anomaly, myopia/astigmatism/strabismus, septal heart
    defects, vesicoureteral reflux, cryptorchidism, hypospadias, sensorineural hearing
    loss, plus seizures, GERD, scoliosis and hip dysplasia named in its management
    section. Its surveillance schedule is curated as a treatment entry. GeneReviews
    documents no Agents/Circumstances to Avoid for this disorder, so no drug-safety
    warning was added.

    STRUCTURED SOURCE. ClinGen has a Definitive, expert-panel gene-disease validity
    assertion for RERE (Intellectual Disability and Autism GCEP, SOP9, 2023-03-21).
    Its cache file was built with just clingen-rebuild and two rows are cited. Note
    ClinGen anchors on MONDO:0100465, a gene-agnostic ClinGen class rather than the
    RERE entity, so that term is recorded as a skos:broadMatch mapping, not as this
    entry's anchor. ClinGen also records the mechanism as loss of function, which
    conflicts with the 2026 cohort's gain-of-function/dominant-negative proposal for
    the HRR class; both are recorded and the conflict is left open rather than
    silently resolved.

    CONTENT. Eight-node pathophysiology chain from RERE co-regulator dysfunction
    through impaired retinoic-acid signalling (WHHERE complex; NR2F2/p300/RAR at
    RAREs) and deregulated SHH/FGF8 into four organ-specific effectors (ocular
    morphogenesis and retinal ganglion cell loss; endocardial EMT and GATA4 in the
    AV cushions; brain growth and hindbrain patterning; cranial-neural-crest palatal
    mesenchyme), converging on a multisystem developmental field defect. 27
    phenotypes, three curated RERE variant classes (LOF haploinsufficiency, HRR
    missense/in-frame, recurrent CHARGE-like HRR duplication), four treatments, four
    animal models and one patient-variant CRISPR cell line with modeled_mechanisms
    and readouts.

    DELIBERATE OMISSIONS. Most phenotypes carry NO frequency value. The sources
    describe features qualitatively and several phenotypes (Chiari I, nocturnal
    enuresis, clefting, choanal atresia) rest on one or two individuals, which
    supports no FrequencyEnum band; per the frequency SOP, omission was chosen over
    fabricated justification. Orphanet ORPHA:494344 was NOT cited: the bulk
    Orphadata XML is gitignored and not present locally, and cache files must never
    be hand-written. The 1p36 deletion birth prevalence is recorded only as an
    explicitly labelled contextual row marked supports: PARTIAL, because it is the
    contiguous-gene deletion's rate and not NEDBEH's.

    SELF-REVIEW FIXES. Four phenotypes whose names were broader than the HPO term
    they bound were renamed to match (Myopia, Hypoplasia of the Corpus Callosum,
    Ventricular Septal Defect, Cleft Palate) and a separate Strabismus phenotype was
    added so the motility findings were not lost. A severity: MILD qualifier on the
    hearing loss phenotype had no attached supporting quote; the GeneReviews sentence
    containing "mild sensorineural hearing loss" was added to support it. A
    gene-level variant_origin: DE_NOVO was removed because it flattened the real
    exception that LOF alleles are sometimes inherited - inheritance.de_novo_rate
    carries that nuance accurately instead.

    VALIDATION. just validate passes (schema + terms + references). just
    validate-disorders - the batched pre-PR sweep CI runs - passes, output read in
    full: 107/107 snippets verified against cached references. just
    check-duplicate-keys OK. just check-title-snippets OK, no new title-quoting
    snippets. just compliance reports 87.9% global, 88.2% weighted; the residual gap
    is discussions[].evidence and proposed_experiments[].evidence/datasets, which are
    empty by construction because those describe experiments not yet performed.

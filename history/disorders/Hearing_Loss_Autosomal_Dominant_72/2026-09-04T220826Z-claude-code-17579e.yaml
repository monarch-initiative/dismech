  summary: 'Create: Hearing Loss Autosomal Dominant 72 (DFNA72, SLC44A4)'
  details: |
    Identity resolved from the stub's MONDO xref chain rather than from MONDO itself, which records no causal gene for MONDO:0033259: OLS gave OMIM:617606, NCBI mim2gene_medgen mapped that MIM to GeneID 80736, and NCBI Gene resolved it to SLC44A4 (6p21.33). Coverage recheck by gene against origin/main found no existing kb/ entry for SLC44A4, so DFNA72 is curated as a new Disease rather than folded into an existing gene-named entry.

    Evidence base is deliberately small because the literature is. The whole clinical record is one four-generation Chinese kindred (PMID:28013291), and the ClinGen Hearing Loss GCEP classifies the SLC44A4 / nonsyndromic genetic hearing loss relationship as Limited on two separate evaluations (2018, 2022). That ClinGen assertion is cited as a structured CGGV: reference and is what the entry's diagnosis, genetic and prevalence records are built around.

    Two mechanistic hypotheses are recorded rather than one. The published cholinergic olivocochlear model is EMERGING: its three links were measured in three different systems (transfected SH-SY5Y cells, mouse alpha9 nAChR transgenics for efferent protection, and nothing at all for the SLC44A4-in-efferent-neuron step), and the authors themselves wrote 'may cause'. The ALTERNATIVE thiamine_pyrophosphate_transport_model records that the only direct characterisation of human SLC44A4 (PMID:24379411) identifies it as the colonic thiamine pyrophosphate transporter with uptake explicitly unaffected by choline - a competing substrate assignment that the hearing-loss literature imports as a premise. That paper is also cited as a REFUTE item on the choline-uptake node.

    Deep research: falcon, on-topic (SLC44A4 55 mentions in the report, no substituted disease; preflight-dr SKIPs because MONDO records no canonical gene, so substitution was checked by manual gene grep). The report's own term validation flagged one invented CURIE (HP:0004076); nothing from the report was bound. The report's additional clinical detail (onset 26-30 years, 1-2 kHz 40-50 dB HL U-shaped audiogram, screening of 1000 controls and 500 sporadic cases) comes from the paper's full text, which is paywalled and not cacheable, so it was NOT curated as evidence.

    Validation: just validate (schema + terms + references) passed; 32/32 snippets verified, no prefix skips; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean. One phenotype (Postlingual Onset) is deliberately unwired with a notes: explanation.

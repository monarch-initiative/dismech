  summary: 'Address review on PR #11034 (DFNA72)'
  details: |
    Response to the automated review's two IMPORTANT findings, plus four of its optional suggestions.

    IMPORTANT 1 - supports direction. The evidence item on thiamine_pyrophosphate_transport_model quoting 'Whole-exome sequencing revealed SLC44A4, which encodes the choline transport protein, as the pathogenic gene in this family' was graded SUPPORT. That sentence asserts the competing choline assignment, so relative to the TPP hypothesis it cuts against. Changed to REFUTE, with the explanation saying why it is a weak refutation (the DFNA72 report states the choline function as a premise, not a measurement) and noting that the same sentence stays SUPPORT in the substrate-identity discussion, where the claim being supported is that a disagreement exists rather than that either side is right.

    IMPORTANT 2 - two prose claims contradicted by this PR's own research artifact. The Mid-Frequency Sensorineural Hearing Loss and Postlingual Onset descriptions said no threshold, progression or onset data are published. The falcon report, which had full-text access, gives 40-50 dB HL at 1-2 kHz, bilateral involvement, progression to all frequencies, onset around 26-30 years, and tinnitus as the presenting symptom. Both descriptions now say the data exist in the paywalled full text and are not curated because a dismech snippet must be an exact substring of a cached source, and both point a future curator with journal access at the split to make. The scoping decision is unchanged; only the wording was wrong.

    Suggestions taken. (1) Split the bundled 'Reduced Choline Uptake and Acetylcholine Release' node into 'Reduced Choline Uptake' and 'Reduced Acetylcholine Release'. This is more than tidying: the refuting thiamine-pyrophosphate item now sits on the uptake node alone, because the substrate question bears on what SLC44A4 carries into the cell, not on whether less acetylcholine leaves it. Upstream edge, downstream edge and the discussion attaches_to were all repointed. (2) Added Cochlear Implantation with treatment_effect BYPASSES against the outer-hair-cell node, using the PMID:37371710 class-level snippet already in the file. (3) Added a Sensorineural Hearing Impairment phenotype bound to HP:0000407, wired from the same node - HP:0012781 encodes configuration and says nothing about type, and type is what places the lesion in the cochlea rather than the middle ear. (4) Populated Genetic.variants for c.466A>G (p.Met156Val) with type missense_variant and no clinical_significance, because ClinVar returns no classification from unflagged submissions for it and asserting one would go beyond both ClinVar and ClinGen's Limited classification of the pair.

    Suggestion declined: an environmental noise-exposure record. The mechanism is loss of efferent protection from acoustic injury, so the suggestion is coherent, but nothing published reports noise exposure in these patients or links their loss to it, and an influences_mechanisms edge would assert a causal claim about this disease that no source supports.

    Validation after the changes: just validate passed, 36/36 snippets verified with no prefix skips; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values and check-qualifier-terms clean; no new cache rows (every added term was already cached). Postlingual Onset remains deliberately unwired, and the variant node remains the graph root.

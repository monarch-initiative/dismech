  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing SLC44A4 gene-panel row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound, as the phenotype section's own notes already state: the denominator is a single reported pedigree, and a flat better-ear average would collapse the mid-frequency (cookie-bite) configuration that makes this locus clinically recognisable into a number that does not describe it.

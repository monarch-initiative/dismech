  summary: 'Create: Infantile Hemangioma (MONDO:0011191), with its hepatic form as
    a subtype and its malignant mimics as differential diagnoses'
  details: |
    New entry for infantile hemangioma on MONDO:0011191, which MONDO labels capillary infantile hemangioma. Until now the tumor appeared in the knowledge base only as a differential diagnosis: of Kasabach-Merritt_Syndrome and, in its hepatic form, of Neuroblastoma. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only. Closes the claim issue 17021; part of the neuroblastoma-related series (issue 15822).

    Sources. 53 papers and one trial registration record are cited. 50 of the papers and the trial record are new to the reference cache. PMID:33644927 and PMID:39640139 were already cached and quoted in Neuroblastoma, and PMID:32014025 in Kasabach-Merritt_Syndrome; their sentences keep the evidence_source used there. The sources are prospective and retrospective cohorts, six randomized trials, a network meta-analysis, consensus statements, reviews, and laboratory studies of cultured tumor cells and of implants in mice. Three papers that would have been cited could not be quoted, because no abstract or full text was retrieved for them (PMID:18550886, PMID:21079070, PMID:10900278); the entry's notes name two of them.

    Shape. One subtype row, Hepatic, with no MONDO term: MONDO:0002404 liver hemangioma is broader, and NCIT:C96840 is recorded as the subtype's mapping. Seven mechanism nodes: Hemangioma Stem Cell Vasculogenesis, Suppressed NFAT-Dependent VEGFR1 Expression, Constitutive VEGFR2 Signaling, Proliferating GLUT1-Positive Endothelium, Involution with Fibrofatty Replacement, High-Flow Shunting Through Hepatic Hemangiomas and Type 3 Iodothyronine Deiodinase Activity in Tumor Tissue. Three mechanistic hypotheses about what starts the tumor (stem_cell_origin, placental_origin, hypoxia_trigger), all ALTERNATIVE, because reviews list them side by side and they are not exclusive; only stem_cell_origin has edges. Ten phenotypes, each reached by a causal edge; four belong to the Hepatic subtype. Two genetic rows from one study (KDR as RISK_FACTOR, ANTXR1 as UNKNOWN). Two inheritance rows (sporadic; autosomal dominant in six reported families). Six diagnosis rows, seven differential diagnoses, seven treatments, one animal model linked to two nodes, four progression phases, one clinical trial, one prevalence record, five epidemiology rows and two KNOWLEDGE_GAP discussions.

    Decisions a reader may want to check. The name is Infantile Hemangioma, as in the clinical literature and NCIT:C6645; the MONDO label is kept as a synonym. The prevalence record is typed PERIOD_PREVALENCE: the source calls its figure an incidence, but it is the proportion of a birth cohort that had the tumor at any time in the first nine months of life. No node carries a somatic genetic_context, because no study cited identifies a somatic change in the tumor, so the entry derives no cell of origin. Two frequency bands are set: Skin Ulcer is OCCASIONAL (173 of 1,096 children in a referral cohort) and Subglottic Hemangioma is VERY_RARE (13 of 761 children in one series, and 1.6 per cent of 798 for any airway hemangioma in another). No band is set for the skin changes left after involution, because the abstract that reports them does not state its denominator; the notes of the Residual Telangiectasia row give the arithmetic. Negative trial results are REFUTE items on the treatment they concern: topical timolol in the early proliferative phase, and pulsed dye laser for uncomplicated hemangiomas. The trial NCT01056341 was registered as phase II/III and is recorded as PHASE_III, because the field takes one value. Infantile fibrosarcoma is a differential diagnosis described by its clinical features only. The differential row of Neuroblastoma that names the hepatic hemangioma is not changed here.

    Terms. Read through OLS, or from the local hgnc, ncit and icd10cm builds, on 11 November 2026. Three negative findings, each search run again before the commit. MONDO has no term for the hepatic form: OLS searches of MONDO for infantile hepatic hemangioma, hepatic infantile hemangioma and liver infantile hemangioma returned nothing. NCIT has no term for thyroid function testing as a whole: a label search of the local build for Thyroid Function returned 15 terms, all of them grades of adverse events, so that diagnosis row has no term. The ICD-10-CM codes whose labels name hemangioma are D18 and its children, so the mapping to D18.0 is a broad match. The enzyme activity of the last node is bound to GO:0033798 thyroxine 5-deiodinase activity, whose definition is the reaction between thyroxine and 3,3',5'-triiodothyronine (reverse T3).

    Left out. A classifications block, histopathology rows (the GLUT1 stain is described in the diagnosis section), datasets, and entries for PHACE syndrome and LUMBAR syndrome. just check-genereviews reports no GeneReviews chapter, as expected for a tumor that is not Mendelian.

    After review. The first review made three suggestions. One led to a change: the node Proliferating GLUT1-Positive Endothelium listed the skin as its only location although its edges also lead to the hepatic and the subglottic hemangioma, so the liver (UBERON:0002107) and the subglottis (UBERON:0036068) were added. Two were not taken. ANTXR1 stays unwired: the molecular function on the node it would land on, binding of VEGF, is that of VEGFR1 and not of the protein ANTXR1 encodes, and the variant rests on one carrier. PHACE syndrome stays out of this entry, as the review itself accepts.

    Validation: just validate, validate-terms and validate-disorders pass; 285 of 285 snippets verify against the cached references; the whole-repo gates, the extra gates and the kb test lane were run locally and pass. Term validation added 18 rows to the label caches and 18 to the enum caches.

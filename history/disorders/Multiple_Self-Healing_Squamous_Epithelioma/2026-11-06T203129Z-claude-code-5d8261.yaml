  summary: 'Create: Multiple Self-Healing Squamous Epithelioma'
  details: |
    New entry for MSSE / Ferguson-Smith disease (MONDO:0007566, TGFBR1). Deep research: OpenScientist (research/Multiple_Self-Healing_Squamous_Epithelioma-deep-research-openscientist.md; 26/26 references resolved; preflight-dr PASS). Report used as leads only; its mislabelled CURIEs (CHEBI:63631, NCIT:C1878, NCIT:C780 for the drugs) were not used and every term was looked up in OLS. Phenotype baseline is the 2020 Goudie review (PMID:33256177, PMC full text) because no GeneReviews chapter covers MSSE. Modelled as a germline two-hit tumor suppressor predisposition conforming to germline_two_hit_tumor_predisposition (first hit, somatic LOH second hit, biallelic loss), with tumors as phenotypes per design decision 3a, a digenic inheritance block for the unidentified 9q22.3 second locus, a knowledge-gap discussion on that locus and on regression, radiotherapy as an exacerbating exposure, ClinGen Definitive validity, and the allelic split from Loeys-Dietz syndrome 1 as a differential. UV exposure was not linked causally because no source read tests it. Validated with just validate, count-verified-snippets, validate-terms and the offline gates.

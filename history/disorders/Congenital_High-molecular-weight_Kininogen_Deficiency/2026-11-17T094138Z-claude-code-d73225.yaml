  details: |
    Review round on PR #18334. Both blocking items and all five suggestions taken, in one push.

    Blocking item 1, the unsourced ClinGen tier. The reviewer is right and supplied the assertion id. external_id is now set to CGGV:assertion_6dbf4bc1-b04f-4f1d-8c11-2b7998370293-2021-06-23T160000.000Z, the record is cached with just fetch-reference, and the gene-disease validity row is quoted as an evidence item with evidence_source OTHER. just list-gene-validity now reports unsourced 0 for this entry, where it reported the assertion as unsourced before.

    The fetch warned that data/clingen/gene_validity.csv does not match the sha256 pinned in data/clingen/MANIFEST.yaml, so the cache file is stamped with the file's own FILE CREATED date (2026-11-17) rather than the pin's 2026-10-04 snapshot. That is the known ClinGen pin drift (dismech#10426 and the family around dismech#8836); the quoted row matches the cached file exactly either way.

    Blocking item 2, the bradykinin node. The reviewer is right that the only evidence said what bradykinin does rather than that HK is its substrate, and that my own explanation admitted as much. The node now leads with PMID:40638675, which states HK is 'a substrate for plasma kallikrein and critical cofactor', graded OTHER with quote_role REVIEW_SYNTHESIS. The cerebral-malaria quote is kept as explicitly secondary context, as the reviewer allowed.

    Suggestion, orphan cache file. PMID:39773511 is now cited on the KNG1-related hereditary angioedema differential, which is the differential it is about. The first quote I tried did not appear in the abstract and reference validation caught it; the committed quote is the sentence listing kininogen among the genes in which variants cause HAE, which is what makes that differential a question about the same gene. The source prints its list with no spaces after the commas and is quoted as printed; the adjacent factor XII item is left out of the quote because the abstract spells it with a fullwidth Roman numeral, which does not survive snippet normalisation.

    Suggestion, unsourced mouse prose. An animal_models entry is added for the Kng1-null mouse, linked to Reduced Bradykinin Generation with relationship RECAPITULATES, fidelity MODERATE and model_scale ORGANISM, and the limitations field says the readout is a severe infectious challenge rather than anything an affected person experiences. The quoted sentence reports Kng1-/- mice protected to the same extent as bradykinin receptor knockouts, which is what attributes the protection to loss of the bradykinin arm specifically. The MGI identifier was wrong in my first draft: I wrote MGI:96644 from memory, and the real mouse Kng1 is MGI:1097705, taken from NCBI Gene 16644's MGI cross-reference. This is the fourth MOD or NCIT identifier in this batch that I wrote from memory and had to correct, which is the pattern CLAUDE.md documents.

    Suggestion, node_class on Preserved Haemostasis. Dropped. The reviewer is right that CELLULAR_FUNCTION_DISTURBANCE describes a disturbance and this node exists to record that there is none, and that the node is organism-scale. The slot is optional and leaving it absent is the honest answer.

    Suggestion, zygosity. Dropped rather than changed. ZygosityEnum offers HETEROZYGOUS, SIMPLE_HETEROZYGOUS, COMPOUND_HETEROZYGOUS and HOMOZYGOUS, with no biallelic value, so any specific value would be wrong for some reported patients. The genetic_context description now says that explicitly.

    Suggestion not taken, the weak diagnosis snippet. The reviewer asked for a results sentence about the mixing study or the HK assay in place of 'Activity and antigen levels of coagulation factors were determined.' PMID:36700498's abstract has no such sentence: its Results paragraph reports the case count, the variant count and the prevalence estimate, and the only sentence about assays is the methods one already quoted. Replacing it would mean quoting a sentence that does not describe the assay, so it is left as is. The entry's HK-activity values come from PMID:32185598 and PMID:24492696, which are quoted on the phenotype.

    Re-verified on this head: just validate passes (34/34 snippets), check-gene-validity reports 0 unsourced and 0 conflicts for this entry, check-gene-namespaces-online passes with the corrected MGI row cached, and check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-logical-rules, check-snippet-length, check-snippet-grading, check-title-snippets and check-cache-order all pass.

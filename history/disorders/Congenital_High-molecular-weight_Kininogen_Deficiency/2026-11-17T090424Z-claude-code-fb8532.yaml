  summary: 'Create: Congenital High-molecular-weight Kininogen Deficiency (KNG1)'
  details: |
    New entry for congenital high-molecular-weight kininogen deficiency (MONDO:0009234), the KNG1 contact-system defect.

    Deep research: one openscientist run, research/Congenital_High-molecular-weight_Kininogen_Deficiency-deep-research-openscientist.md. Its reference_validation reports 16/16 references resolved, confabulation_rate 0.0. Its term_validation set needs_review with three mislabelled CURIEs it had suggested for this entry: HP:0011897, offered as 'Abnormal prekallikrein', is Increased total neutrophil count; HP:0004863, offered as 'Abnormality of coagulation factor XI', is Compensated hemolytic anemia; GO:0002542, offered as 'bradykinin biosynthetic process', is Factor XII activation. None was bound. The correct terms, looked up in OLS, are HP:0034371, HP:0001929 and GO:0002936.

    The shape of this entry is unusual and deliberate. Severe HK deficiency is a dramatic laboratory abnormality with no clinical disease, so the entry is written to say that rather than to fill sections: there are four laboratory phenotypes and no clinical ones, and the pathograph carries an explicit Preserved Haemostasis node whose evidence is the negative finding that affected people are asymptomatic. The notes field says why, so a reader does not read the sparseness as an incomplete entry.

    Reported thrombotic events (splenic infarction PMID:24492696, an acute granulocytic leukaemia association PMID:6573994) are deliberately not recorded as phenotypes: they are co-occurrences in a 48-case population, neither report claims causation, and the systematic review's conclusion is that the condition is asymptomatic. A KNOWLEDGE_GAP discussion records the question instead, together with the authors' statement that an international registry is being established to answer it.

    KNG1 has two opposite phenotypes and only one is this disease. Every deficiency-causing allele reported is truncating; the single KNG1 missense allele with a relevant phenotype causes hereditary angioedema, a gain of pathway activity. That is recorded in the genetic notes and as a differential diagnosis, because a KNG1 variant on a report does not by itself indicate which disease is present.

    GeneReviews: none exists for the disease or the gene. PubMed searches of the GeneReviews book for both returned zero, and just check-genereviews reports NO_CHAPTER.

    Prevalence is recorded twice on purpose: a POINT_PREVALENCE row carrying the published estimate of about one case per eight million, normalised to rate_per_100000 0.0125 with rate_denominator POPULATION, and a CASES_IN_LITERATURE row for the 48 ascertained cases. The notes say the estimate was derived from gnomAD truncating-allele frequency rather than from ascertained cases, so it is an expected rather than an observed prevalence.

    Two snippets are quoted with the source's own typography rather than corrected: PMID:31858768 runs 'negativelycharged' together and 'coagulationpathway' together, and PMID:32185598 misspells the gene symbol as KGN1. Each explanation says so.

    One coarse binding: HK procoagulant activity has no HPO term (an OLS search of HPO for 'kininogen' returns nothing), so HP:0001928 Abnormality of coagulation is bound with coarse_binding_basis NO_HPO_TERM and the analyte named in preferred_term. check-coarse-phenotypes initially rejected it because preferred_term echoed the bound label; it now reads 'high-molecular-weight kininogen procoagulant activity below 1% of normal'.

    Validation: just validate passes (29/29 snippets), and check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-genereviews, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading and check-retired-support-prose all pass. The molecular function GO:0005102 signaling receptor binding was bound on the lesion node for check-gene-activity-grounding, taken from KNG1's own GO annotations rather than written to fit the prose.

  summary: 'Create: SETD1A-Related Early-Onset Epilepsy'
  details: |
    De novo curation of EPEDD (MONDO:0030005, OMIM 618832), the epilepsy-predominant SETD1A allelic entity, resolving the stub as entry_type DISEASE. Identity was anchored by NEC preflight against the local MONDO release (xref OMIM:618832, synonym EPEDD, RO:0004003 hgnc:29010 SETD1A); a claude_code deep-research report was generated and passed just preflight-dr (PASS, SETD1A mentioned 66 times). The report's reference_validation flagged needs_review (one unsupported quote attributed to PMID:26974950; three off-topic references; unresolved term HP:0000342; obsolete GO:0051568) - no quote, unresolved reference, or flagged term from the report was used: every snippet was copied directly from references_cache abstracts and every CURIE was re-verified against OLS/local OAK adapters, deliberately avoiding obsolete GO:0051568 in favor of GO:0040029/GO:0006325. Curated an 8-node causal chain (SETD1A haploinsufficiency -> reduced promoter H3K4 methylation -> transcriptional dysregulation of synaptic/neurodevelopmental genes -> abnormal excitatory synapse development, impaired cortical neuron migration -> cortical network hyperexcitability -> early-onset seizures; plus variable neurodevelopmental impairment), conforming the hyperexcitability node to epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony on the strength of human SETD1A+/- iPSC network hyperactivity (PMID:35508131). Key sources: PMID:31197650 (defining Yu 2019 cohort), PMID:42495272 and PMID:37928142 (epilepsy-first case reports), PMID:32346159 (NEDSID differentiation), PMID:26974950, PMID:31606247, PMID:32937141, PMID:35508131, PMID:34803610, PMID:37166351. Schizophrenia-focused model evidence is tagged MODEL_ORGANISM/IN_VITRO and the mouse-vs-human direction-of-excitability discrepancy is recorded as a HUMAN_MODEL_MISMATCH discussion with a proposed EEG/seizure-threshold experiment. Allelic differentiation from NEDSID (MONDO:0033630, still an open stub) and from SETD1A schizophrenia-risk content in Schizophrenia.yaml is recorded in notes; the NEDDFSB entry named in the assignment turned out to be the KAT5 disorder, so cross-reference was redirected to the true SETD1A entities. No GeneReviews chapter exists (PubMed search 2026-09-02). Validated with just validate (schema+terms clean), 42/42 snippets verified, and the batched just validate-disorders gate.

  details: |
    Full publication-readiness review. Corrected HBV-aflatoxin interaction polarity and scope; added current YTHDF2-PARP1 and IL-6/M2 macrophage mechanisms; narrowed generic HCC treatments and biomarker claims; added aflatoxin-context susceptibility modifiers, cfDNA ddPCR, chemoprevention surrogate evidence, epidemiology, and routine mappings; removed unsupported generic drivers and the unsupported hepatomegaly frequency band while retaining the phenotype. Current-head review follow-up moved the statistical HBV-aflatoxin interaction into epidemiology, joined the immune branch to the pathograph, and added phase II detoxification plus the TP53 R249S gain-of-function branch. Verified all evidence snippets and targeted schema, term, reference, compliance, and connectivity checks.

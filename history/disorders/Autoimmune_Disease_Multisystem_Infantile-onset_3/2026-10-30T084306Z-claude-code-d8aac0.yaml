  summary: 'Create: Autoimmune Disease Multisystem Infantile-onset 3 (CBLB)'
  details: |
    De novo curation of ADMIO3 (MONDO:0957388, OMIM 620430, CBLB / hgnc:1542) from the single gene-defining report (PMID:36006710, J Clin Invest 2022, three unrelated children) plus the IUIS 2024 inborn-errors-of-immunity classification row (PMID:41608114) and the Cbl-b mouse and rat literature.

    Pathograph: nine nodes in a chain from biallelic CBLB loss of function through loss of ubiquitin-dependent restraint on antigen receptor signalling, then three arms (T cell hyperproliferation uncoupled from CD28 costimulation -> effector T cell resistance to Treg suppression -> breakdown of peripheral T cell tolerance; B cell receptor hyperresponsiveness; mast cell hyperactivation), converging on multi-organ autoantibody production and on systemic inflammatory activation. 20 of 24 phenotypes are wired to a mechanism node; the four that are not are the first patient's hypogammaglobulinemia, recurrent otitis media, recurrent lower respiratory infection and impaired vaccine responses, left unconnected on purpose because the source itself suggests a second genetic cause for that arm.

    Negative results are recorded rather than dropped: a REFUTE item on the B cell arm reaching the antibody output (the knock-in mouse's augmented BCR signalling gave no increase in germinal-centre B cells or antibody), a REFUTE item on the Treg-proportion phenotype (decreased in the patient, increased in the mouse carrying her allele), a FAILS_TO_RECAPITULATE model link for the tolerance node with a BOUNDARY_OMISSION divergence, and a HUMAN_MODEL_MISMATCH discussion for the unidentified non-genetic second requirement.

    Three model systems: the Cblb H257L knock-in mouse (patient-allele matched), the Cbl-b null mouse, and the naturally occurring Cblb-nonsense Komeda diabetes-prone rat, whose thyroid and islet autoimmunity matches this disease's polyendocrinopathy. One experimental model, CBLB-knockout primary human CD4+ T cells.

    One OpenScientist deep-research report was run and used (exit 0, 22/22 references resolved, confabulation_rate 0.0; just preflight-dr returns WARN only because CD28 outranks CBLB on mention count, which is the disease's own mechanism rather than a second entity). It contributed the Komeda rat, the E3-ligase-activity-dead mouse (PMID:21248250), the TCR-zeta K33 ubiquitination substrate (PMID:20637659) the common-variant allelic-series context now in the gene notes, and the sibling ADMIO2 differential. Two of its statements were not folded in: it calls p.C464W a RING-finger allele that is catalytically non-functional, where the source places the residue between the RING and the proline-rich region and reports no functional assay for it, and it cites HP:0001078, which its own term-validation section flags as unresolved.


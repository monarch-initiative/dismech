  summary: 'Create: Hyaline Fibromatosis Syndrome (ANTXR2)'
  details: |
    New entry for hyaline fibromatosis syndrome (MONDO:0009229), the ANTXR2/CMG2 connective tissue disorder that unifies juvenile hyaline fibromatosis and infantile systemic hyalinosis.

    Deep research: one openscientist run, research/Hyaline_Fibromatosis_Syndrome-deep-research-openscientist.md (job 2f14b36a-c1a8-499a-8b5f-ad9e93bb9852, 916 s, 19 citations). Its reference_validation block reports 23/23 references resolved, 25/25 quotes valid, 21/23 on topic, confabulation_rate 0.0. Its term_validation block sets needs_review: true for five mislabelled CURIEs; three of those were suggestions this entry would otherwise have used (HP:0000704 offered as gingival overgrowth is Periodontitis, HP:0100242 offered as subcutaneous nodules is Sarcoma, CL:0002254 offered as intestinal stem cell is epithelial cell of small intestine). None of the three was bound. Every CURIE in the entry was looked up in OLS at the time of writing instead.

    GeneReviews baseline: PMID:20301698 Hyaline Fibromatosis Syndrome is a disease-specific chapter with a full Clinical Characteristics section. It was fetched, tagged GeneReviews in the top-level references block, and used as the phenotype baseline; just check-genereviews reports TAGGED. The notes field records how each chapter feature maps onto a recorded phenotype.

    Lump/split: juvenile hyaline fibromatosis (MONDO:0016071) and infantile systemic hyalinosis (MONDO:0016331) are recorded as has_subtypes rather than as separate entries, because they are allelic severity poles of one disorder and the field has replaced the two names with a four-grade scale.

    Pathophysiology is built as a chain from the biallelic ANTXR2 variant through ER retention or nonsense-mediated decay, loss of surface CMG2, failed talin-to-RhoA endocytosis of collagen VI, extracellular collagen VI accumulation, and then four tissue branches (skin and gingiva, periarticular and bone, duodenum, intramuscular connective tissue). Three edges that rest on mouse work or on an author's stated inference carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and directness INDIRECT. A HUMAN_MODEL_MISMATCH discussion records that the Wnt-dependent intestinal stem cell renewal defect is a mouse result requiring induced colitis, with a proposed organoid regeneration experiment.

    Validation: just validate passes schema, term and reference validation. just count-verified-snippets reports 84/84. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading and check-retired-support-prose all pass.

    Citations read and not used: PMID:24390076 and PMID:35212873 describe Antxr2-null mouse phenotypes (cervical remodelling, endothelial chemotaxis) with no human counterpart in this entry; PMID:38989346, PMID:30152846, PMID:22300424, PMID:39258861 and PMID:33120290 are single case reports whose claims are carried by the larger series; PMID:42409807 is cited in the report for an S-acylation mechanism not yet linked to a clinical feature.

    Orphanet: ORPHA:2176 was fetched for the severe form's prevalence. It is Orphanet's record for infantile systemic hyalinosis and maps exactly to MONDO:0016331, not to this entry's term, so it is cited only on the ISH-scoped prevalence row. Its phenotype table was not transcribed because it lists features at Very frequent that neither the GeneReviews chapter nor the molecular series support. The fetch reported all five Orphadata products differing from the manifest pin and stamped the file 2026-06-23; that is the known drift tracked in dismech#8836, where a measurement was added rather than a new issue filed.

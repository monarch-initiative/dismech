  summary: Fix the gene-activity-grounding gate on ANTXR2
  details: |
    Review round on PR #17384. The only outstanding item was a red CI check, not a reviewer finding: the gate check_gene_activity_grounding failed with one new finding, ANTXR2 wired into the pathograph with no molecular function on the node it lands on.

    Cause on my side: that gate is listed in CLAUDE.md among the pre-PR checks and I did not run it before opening the PR. I ran validate, count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, check-retired-support-prose, check-gene-namespaces, check-cache-order, check-stubs and validate-disorders, and missed this one.

    Fix: bound molecular_functions on the Biallelic ANTXR2 Loss-of-Function Variant node, GO:0004888 transmembrane signaling receptor activity with modifier LOSS_OF_FUNCTION and preferred_term 'CMG2 cell-surface receptor activity'.

    The term was chosen from ANTXR2's own GO annotations rather than from the mechanism prose. QuickGO returns three molecular-function annotations for UniProtKB:P58335: GO:0004888 transmembrane signaling receptor activity, GO:0038023 signaling receptor activity and GO:0005515 protein binding. GO:0005518 collagen binding, which the entry's collagen VI receptor description would suggest, is not among them, so it was not bound even though it would have read well. GO:0004888 is the most specific of the three annotated and matches the entry's own description of CMG2 as a single-pass type I transmembrane receptor. The label was verified in OLS.

    This branch had also been advanced by the repository pr-shepherd on 2026-11-15 (commit 875a9f017, its own history record 2026-11-15T173225Z-pr-shepherd-0b4f1d.yaml), which addressed the first review round while this session was idle. That work is untouched here; this round only adds the molecular function binding on top of it.

    Re-verified on this head: just validate passes (86/86 snippets, 0 issues), check-gene-activity-grounding reports no newly ungrounded genes, check-snippet-grading reports no new divergences.

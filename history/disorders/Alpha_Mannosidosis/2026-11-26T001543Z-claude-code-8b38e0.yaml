  summary: 'Gene-family review: MAN2B1; record origin, ClinGen tier and GeneReviews'
  details: |
    Reviewed MAN2B1 modelling. The node binds alpha-mannosidase activity (GO:0004559) as decreased, which fits lysosomal acid alpha-mannosidase, a broad class II enzyme cleaving alpha-1,2, -1,3 and -1,6 mannosyl linkages in N-glycan degradation. The genetic record lacked a variant origin and a bound inheritance term: it now records GERMLINE origin, binds HP:0000007 on its inheritance block, and carries the ClinGen Definitive tier for alpha-mannosidosis (MONDO:0009561, the entry's own disease) that it already cited. The GeneReviews chapter (PMID:20301570, NBK1396) is now tagged in references and quoted on the record for the definition of the disease by deficient acid alpha-mannosidase (typically 5-10% of normal) and biallelic MAN2B1 variants. The mouse knockout model still binds the human gene (hgnc:6826) rather than the mouse MGI record; that is an advisory namespace worklist item and was left unchanged.

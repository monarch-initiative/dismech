  summary: 'Address review on PR 18156: drop unsupported spasticity edge'
  details: |
    Removed the Basal Ganglia Neuronal Degeneration -> Spasticity downstream edge: the Spasticity phenotype records that its anatomical substrate is not established, and spasticity is a pyramidal sign that a striatal or pallidal lesion does not explain, so the phenotype is left unconnected. Renamed the second progression phase to 'Variable onset with spastic diplegia and parkinsonism' (age range toddler years to adolescence) and cut its notes back to what the PMID:40387296 snippet states (variable onset, progressive spastic diplegia and parkinsonism); the slower-progression and iron-deposition claims had no snippet. Added a clause to the Biallelic VAC14 Variants description stating that the DECREASED protein complex scaffold activity binding follows the fibroblast-rescue loss-of-function reading and does not describe the homodimerization-enhancing alleles. Validated with just validate and count-verified-snippets.

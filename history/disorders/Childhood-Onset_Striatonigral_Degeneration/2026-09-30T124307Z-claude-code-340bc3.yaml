  summary: 'Create: Childhood-Onset_Striatonigral_Degeneration'
  details: |
    De-novo curation of VAC14-related childhood-onset striatonigral degeneration (MONDO:0014889, OMIM 617054), replacing stub Striatonigral_Degeneration_Childhood-onset. Entry type DISEASE: a MONDO leaf with its own OMIM number and a single causal gene; the allelic VAC14 Yunis-Varon presentation is curated separately and the NUP62 infantile striatonigral degeneration stub was left untouched. Lead source was a Perplexity sonar-deep-research report, run via a session-local streaming transport patch (dismech#9357) because the non-streaming request dies at the 300 s idle deadline. The report resolved only 2 PMIDs itself; primary papers were found by PubMed search for VAC14 and fetched with just fetch-reference (27292112, 29296614, 31591492, 31876398, 33248288, 31387860, 32949958, 31392254, 37636228, 40387296, 40888261, 40221969, 28635952, 17956977, 19037259, 11889142, 42242586). Dropped as unverifiable: the report's 19-patient cohort figures (70 percent regression before age 5, intellect preserved in 16 of 19, a 37-year survivor), which it attributes to PMID:40443206, whose cache has no quotable text; and all of its CURIEs, which were re-looked-up (13 were mislabelled). Pathograph: biallelic VAC14 variants -> impaired PI(3,5)P2 synthesis -> endolysosomal vacuolation -> basal ganglia neuronal degeneration -> phenotypes, with mouse-only branches for endosome-to-TGN trafficking and early neuroinflammation. A REFUTE item records that one patient's fibroblasts lacked vacuoles. Validated with just validate (64/64 snippets, 64 titles), validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs, check-duplicate-keys, check-genereviews (NO_CHAPTER), list-gene-term-mismatches, check-qualifier-terms, check-coarse-phenotypes and validate-disorders.

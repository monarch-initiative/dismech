  summary: 'Create: MTO1 Deficiency'
  details: |
    De novo curation of MTO1 deficiency [COXPD10, MONDO:0013865, OMIM:614702, gene MTO1/hgnc:19261] via the /curate workflow.

    NEC preflight: ran runoak -i sqlite:obo:mondo info MONDO:0013865 -O obo before any DR content was used. Confirmed all three identity anchors - causal gene MTO1 via RO:0004003 HGNC:19261, the OMIM:614702 xref, and the COXPD10 synonym. Independently corroborated by the freshly generated ORPHA:314637 structured cache, which records MONDO:0013865 Exact and OMIM:614702 Exact. Explicitly kept distinct from the three named lookalikes: MRPL44/COXPD16 curated in parallel, SLC25A3 cardiomyopathy-hypotonia-lactic acidosis syndrome already in kb/disorders/, and GTPBP3/TRMU. These appear only as differential_diagnoses, and the exclusion rationale is recorded in the entry notes.

    Duplicate preflight: git grep over origin/main kb/ for MONDO:0013865, MTO1 and COXPD10 returned nothing; gh pr and gh issue searches for MTO1, COXPD10 and MONDO:0013865 across all states returned only issue #7703 and the priority EPIC #1079.

    Deep research: just research-disorder falcon MTO1_Deficiency - Edison, 476s, 18 citations, 1 artifact. Report read in full and confirmed on-target for the intended entity. DR output treated as leads only; every PMID was fetched with just fetch-reference and every snippet checked as an exact substring of the cached text. One DR claim was rejected on verification and the rejection is documented in the entry notes: the assertion that complete mouse Mto1 knockout reduces mitochondrial translation by more than 80 percent and is embryonic-lethal at about E8 could not be verified against the abstract of its cited source DOI:10.1093/jb/mvaa098, which does not mention MTO1 at all. DR-suggested ontology terms were also not taken on trust - HP:0031987, suggested for elevated alanine, was replaced with the verified HP:0003348 Hyperalaninemia.

    GeneReviews baseline: no chapter exists. A PubMed search for MTO1 GeneReviews returned only PMID:26425749, the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview, whose cached abstract does not mention MTO1. In its place the phenotype baseline is O'Byrne et al. 2018, PMID:29331171, the 35-patient international cohort, which supplies an explicit numerator and denominator for every frequency band asserted.

    Content: 8 pathophysiology nodes forming the causal chain from loss of tau-m5U wobble-uridine modification through impaired mitochondrial translation and combined complex I/IV deficiency to cardiac, neuronal/retinal and metabolic failure; 20 phenotypes with HPO bindings and cohort-derived frequency bands; 5 biochemical markers; MTO1 as CAUSATIVE plus MT-TF as a candidate MODIFIER; 2 diagnosis entries; 3 differential diagnoses; 6 treatments, two of which are curated with REFUTE evidence because the cohort showed no benefit from the mitochondrial cofactor cocktail or from riboflavin; 1 mechanistic hypothesis covering the residual-activity dose model; and 3 discussions - two HUMAN_MODEL_MISMATCH entries for the mouse anaesthesia-arrhythmia risk and for the mouse's missing neurological phenotype, plus one KNOWLEDGE_GAP for genotype-phenotype variability.

    Three ontology terms were caught and corrected during verification: HP:0025547 is NOT Abnormal liver physiology - it is Decreased mean corpuscular hemoglobin concentration - and was replaced with HP:0031865; GO:0005747 and GO:0005751 are obsolete and were replaced with GO:0045271 and GO:0045277.

    Frequency discipline: bands are quoted from bracket-free cohort fractions, because the reference validator strips square-bracketed confidence intervals and would otherwise break snippet matching. No band was asserted for Increased CSF lactate where n=6 and the CI spans three bands, for Abnormal basal ganglia morphology or Hypoplasia of the corpus callosum where the 14/20 denominator covers any MRI abnormality, for Muscle weakness where no summary denominator is reported, or for Intellectual disability which shares the combined GDD/ID denominator. The Wolff-Parkinson-White band is flagged in its explanation as a count derived from Table 1 rather than a reported summary statistic.

    Validation: just validate, just validate-terms and just validate-references all pass; 101/104 snippets verified against cached references, with the 3 DOI-prefixed snippets skipped by the validator and hand-verified as exact substrings of references_cache/DOI_10.3390_ijms24032178.md. pytest tests/test_data.py -k MTO1 passes 9/9. The one repo-wide test failure, SETD5_Haploinsufficiency_Syndrome target_phenotypes, is pre-existing and unrelated to this change.

  summary: 'Gene-family review: MTO1 and MT-TF'
  details: |
    The MTO1 genetic record gains an autosomal recessive inheritance block (HP:0000007) citing recessive segregation with carrier parents (PMID:29331171). The MT-TF modifier record gains variant_origin GERMLINE and a Mitochondrial inheritance block citing the homoplasmic m.593T>G variant (PMID:26061759). The MTO1 mechanism node already binds tRNA 5-taurinomethyluridine synthase activity (GO:0160236), consistent with MTO1 and GTPBP3 installing taurinomethyluridine at U34 of five mt-tRNAs (PMID:29390138); no change was needed there.

  summary: 'Create: TLR7-related systemic lupus erythematosus'
  details: |
    Created the TLR7-related systemic lupus erythematosus (SLE17) entry. Deep research via
    claude_code (report in research/); preflight-dr confirmed TLR7 dominant with matching OMIM
    301080. Evidence anchored on fetched primary abstracts/full text (Brown 2022 Nature
    discovery PMID:35477763, F507S JAK-response case PMID:42170322, Nat Rev Rheumatol review
    PMID:42321474). Atomic pathograph: TLR7 GOF variant -> enhanced guanosine
    sensing/TLR7-MyD88 signaling -> type I interferon overproduction and aberrant BCR-
    activated B-cell survival -> CD11c+ age-associated/germinal-centre B-cell accumulation ->
    loss of tolerance/autoantibodies; 3/3 phenotypes connected (ANA, thrombocytopenia,
    hypertriglyceridemia, all human-sourced), with the mouse proliferative glomerulonephritis
    kept as a model readout. Treatments: JAK inhibitor (ruxolitinib) and investigational
    TLR7-TLR8 antagonist. No module conformance: TLR7 reaches the IFN effector via MyD88
    rather than cGAS-STING, so the existing cGAS-STING IFN module is not an appropriate target
    (reasoning in notes). Validated: just validate, validate-disorders, causal-targets,
    entity-refs, logical-rules, coarse-phenotypes all pass.

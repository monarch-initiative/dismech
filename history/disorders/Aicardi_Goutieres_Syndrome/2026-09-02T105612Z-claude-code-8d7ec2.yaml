  details: |
    Integrated the RETAINED/QUALIFIED claims of the codex assessment of kb/hypotheses/Aicardi_Goutieres_Syndrome/ags_endogenous_nucleic_acid_interferon_model/openscientist.md that were not already curated. (1) trex1-cgas-epistasis / dendritic-cell-ontology-label: added a cell_types binding CL:0000990 (canonical label 'conventional dendritic cell', with preferred_term recording the literature synonym 'classical dendritic cell') plus MODEL_ORGANISM evidence PMID:39254994 on the 'Endogenous nucleic acid-driven innate immune activation' node, and a second distinct-quote evidence item from the same paper on the mechanistic_hypotheses entry; both explanations scope the result to the Trex1-/- mouse. (2) samhd1-evidence-type: added a new pathophysiology node 'SAMHD1-dependent replication fork processing defect' (GO:0031297 replication fork processing, modifier ABNORMAL) with an upstream DIRECT edge from 'AGS-related pathogenic variants' and a downstream DIRECT edge to 'Endogenous nucleic acid-driven innate immune activation', cited to the primary study PMID:29670289 as IN_VITRO per the assessment's correction of the provider's 'In vitro/Model' label. (3) sting-pharmacology-scope: added MODEL_ORGANISM evidence PMID:30566866 to the mechanistic_hypotheses entry, whose notes already asserted pharmacological STING inhibition with no citation backing it; the explanation records the assessment's qualification that the eight STING-directed agents are mechanistically heterogeneous and not equivalent replications, and that none has human AGS efficacy data. (4) Added a discussions entry gap_ags_samhd1_dominant_function (KNOWLEDGE_GAP, OPEN) with attaches_to on the two SAMHD1-relevant pathophysiology nodes and a separation-of-function proposed experiment, following the assessment's REJECTED sting-samhd1-disease-mismatch claim and the report's Gap 6. Deliberately not integrated: adar1-mda5-interferon (PMID:34525338 adds nothing beyond the already-cited PMID:34380029 and PMID:41855203); jak-neurological-inference (PMID:38381212 and PMID:39748568 are single-patient reports that add no weight to the already-curated PMID:41871482 qualification); atad3-mitochondrial-leakage (ATAD3 is not an AGS gene in this entry, the assessment records that no mitochondrial nucleic-acid species, leakage, or cGAS engagement was measured, and PMID:40665566 is not in the reference cache). No assessment sidecar was written: openscientist-assessment-by-codex.yaml already exists.

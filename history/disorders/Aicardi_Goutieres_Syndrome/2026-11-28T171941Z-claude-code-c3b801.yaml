  summary: Split the AGS innate-sensing node into a cGAS-STING DNA arm and an MDA5-MAVS
    RNA arm
  details: |
    The single 'Endogenous nucleic acid-driven innate immune activation' node conformed to the cGAS-STING module while also standing for the ADAR and IFIH1 genotypes, which signal through MDA5 and MAVS. Renamed it 'Self-DNA-driven cGAS-STING activation' and rescoped its description and notes to the TREX1, RNASEH2A/B/C, SAMHD1 and LSM11/RNU7-1 genotypes; updated every bare target and entity reference to the new name. Added 'Self-dsRNA-driven MDA5-MAVS activation' (GO:0039530 MDA-5 signaling pathway, INCREASED), fed from 'Defective nucleic acid metabolism and sensing' and feeding 'Constitutive type I interferon signaling', with evidence from PMID:34380029 (ADAR1 Zalpha mice, MODEL_ORGANISM, same snippet and grading as its existing use in the entry) and PMID:24686847 (IFIH1 gain-of-function assays, IN_VITRO). The RNA node deliberately has no conforms_to. Added notes on the two downstream nodes that still conform to the cGAS-STING module (TBK1-IRF3 and chronic tissue inflammation) stating that the conformance holds for the DNA-sensing genotypes only. Whether a sensor-agnostic interferonopathy endpoint should be factored out of the module remains open on the issue. Validation: just validate, validate-terms, count-verified-snippets (120/120), check-entity-refs, check-causal-targets, check-name-collisions, check-duplicate-keys, check-enum-values, check-logical-rules, check-snippet-grading all pass.

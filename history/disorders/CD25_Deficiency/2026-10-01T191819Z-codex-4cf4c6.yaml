  summary: Review CD25 deficiency using full-text immune, clinical and gene-correction
    studies
  details: |
    Reviewed the complete entry and matching OpenScientist report against cached primary literature and the current ClinGen assessment. Read the human S166N and Y41S studies, founding and bronchiolitis full texts retrieved through their PMC URLs, 2026 sibling/Moroccan/diabetes studies, granulomatous-hepatitis case, 2018 gene-editing experiments, and the FOXP1/FOXP4 mouse study. Reconciled repeated patients, conflicting abstract/body claims, and historical variant notation. Added the definitive gene-disease assessment and five physical variant classes while separating predicted splice/protein effects from measured consequences.

    Rebuilt the mechanisms around surface CD25, high-affinity IL-2 capture, dose-dependent STAT5 responses, Treg suppression versus relative abundance, inducible CD4 IL-10, proposed cytokine consumption, CD8 expansion, thymic BCL2/apoptosis and the non-universal peripheral apoptosis hypothesis. Preserved negative human apoptosis, antigen-rescue and NK assay results. Expanded to 38 phenotypes and three histology findings; replaced unsupported general frequency bands with study-specific denominators, corrected unrelated Moroccan families, and distinguished autoimmune from granulomatous or fatty liver disease. Updated neonatal diabetes, variable antibody responses, diagnoses, insulin/thyroid/IVIG support, glucose surveillance, HSCT limitations and preclinical gene correction. Models comprise three animal systems, five patient-cell systems and one explicitly limited structural prediction. Verified GEO GSE300286 for the indirect Foxp1/Foxp4 model with just verify-datasets.

    The research report understated current case counts, overgeneralized complete receptor/Treg absence and penetrance, conflated FOXP3/IPEX autoantibody findings with IL2RA deficiency, and treated mouse mechanisms or combination-treatment outcomes as more definitive than the sources support. These claims were corrected rather than carried forward. Common IL2RA complex-trait susceptibility variants remain outside the biallelic disease mechanism. No dedicated GeneReviews/StatPearls chapter or eligible CD25-specific interventional registry record was identified. The 2025 gene-corrected Treg report remains abstract-limited after unsuccessful full-text retrieval; its in-vitro manufacturing results do not establish clinical efficacy. The unavailable rapamycin citation is replaced by directly quotable treatment observations. ClinGen is cited through its fetched URL because the required fetch-reference route has no CGGV handler.

    All 175 evidence quotations and 197 titles pass schema, ontology and reference validation. Same-sentence evidence grading passes; repository gates and commit hooks are checked before submission. Reference caches were generated using just fetch-reference, never hand-edited.

  summary: 'Create: CD25 Deficiency'
  details: |
    De-novo curation of CD25 (IL2RA) deficiency, MONDO:0011664. First pass built from PubMed E-utilities searches on CD25/IL2RA deficiency; one OpenScientist deep-research report (research/CD25_Deficiency-deep-research-openscientist.md) was read afterwards and used as a lead source. Its reference validation reported 16/16 identifiers resolved with needs_review true: 4 of 17 quotes did not match, all because the report had elided mid-quote or reflowed the sentence (the section names the closest source text in each case), and 7 of 16 references were not scored on topic. Its term validation reported 45/47 resolved, 0 unresolved, and 13 label mismatches that are all the report printing a table column header (Physical, Lab, Sign) instead of the ontology label; no CURIE was bound from the report without an independent runoak lookup. just preflight-dr returned WARN on FOXP3 being mentioned 11 times against IL2RA's 30, which is correct and benign: FOXP3 appears because IPEX is this disease's principal differential and because FOXP3+ Treg persistence is a central mechanistic finding, not because a second disease is mixed in. Named Entity Confusion controls: no IL2RA autoimmunity-susceptibility GWAS paper is cited anywhere in the entry, and the only cited paper that also studies STAT5B deficiency (PMID:29988287) reports the two patients separately, with only the CD25 findings used. Pathophysiology is a nine-node chain from biallelic IL2RA loss of function through absent surface CD25, the raised IL-2 signaling threshold with deficient STAT5 activation, and four parallel consequences (Treg dysfunction, defective activation-induced and thymic apoptosis, impaired antigen-specific responses, impaired NK maturation) to loss of peripheral tolerance, multi-organ autoimmune attack, CD8+ lymphoproliferation and the infection node; all 20 phenotypes are wired in. No conforms_to was declared: there is no Treg or peripheral-tolerance module in kb/modules, checked with just list-modules treg and just list-modules autoimm and by grepping the module directory. The NK maturation node is deliberately left with no downstream edge because no source links that phenotype to a clinical feature. PMID:31605764 (rapamycin in IL2RA deficiency) caches with content_type unavailable after a forced refetch, so it is recorded in notes and in the top-level references block without an evidence item; sirolimus claims are quoted from PMID:23416241 instead. No GeneReviews chapter exists (just check-genereviews --online reports NO_CHAPTER for both collections; the only genereviews[book] title hit is the IPEX chapter, which is the FOXP3 disease). Validation: just validate passed, just validate-terms passed, count-verified-snippets 96/96, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes and check-enum-values clean, list-disconnected-phenotypes 20/20 connected, and just validate-disorders run over the file.

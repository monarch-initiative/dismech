  summary: 'Review round 1: mine the GeneReviews chapter''s management, clinical and
    counseling sections'
  details: |
    Review round 1 on PR #12971. The reviewer approved the KRT1 half unchanged and
    requested changes on this entry only: tagging the GeneReviews chapter made it
    this entry's clinical baseline, but only two of its four abstract sections were
    being used. All of the following came from the already-committed
    references_cache/PMID_20301649.md, so no reference was fetched.

    Genetic Counseling. The disease-level inheritance block now carries the
    transmission-risk and de novo figures, which were absent: 80% of affected
    individuals have an affected parent against approximately 20% de novo, and a 50%
    per-child risk. Both items are graded HUMAN_CLINICAL with quote_role
    REVIEW_SYNTHESIS.

    Management. A bisphosphonate treatment was added, the one organ manifestation of
    this disorder with an established pharmacological treatment; the entry previously
    had only generic supportive care, genetic counseling and an investigational gene
    therapy. It binds NCIT:C198585 Bisphosphonate Therapy with NCIT:C443
    Biphosphonate as therapeutic_agent, following the pattern already validated in
    Arthrochalasia_Ehlers-Danlos_Syndrome; CHEBI has no bisphosphonate class term,
    which a search of ols:chebi for bisphosphonate and diphosphonate confirmed. It
    targets the Pagetic bone remodeling node and the Osteolysis and Hip pain
    phenotypes. The supportive-care item now also cites GeneReviews for the specific
    mobility interventions and for the surveillance schedule, rather than resting only
    on the VCP-myopathy practice recommendation.

    Clinical Characteristics. A Parkinsonism phenotype was added, bound to HP:0001300
    and cited to the sentence naming dilated cardiomyopathy, amyotrophic lateral
    sclerosis and Parkinson disease as part of the spectrum. It is wired from the
    Ubiquitin-positive aggregate accumulation node, which already feeds the
    cardiomyopathy and motor neuron disease named in that same sentence. No frequency
    is recorded: the Orphanet record carries 43 HPO phenotype rows and a search of the
    cached record for parkinson returns none, and the phenotype's own explanation says
    so.

    Onset. The Proximal muscle weakness and Osteolysis descriptors now carry ADULT and
    the Frontotemporal dementia descriptor MIDDLE_AGE, each citing the mean age at
    diagnosis figures. Those items are marked directness INDIRECT because the chapter
    reports age at diagnosis rather than age at onset, which bounds onset without
    dating it; the explanations say that rather than presenting a diagnosis age as an
    onset age.

    Also in this push, from self-review before the verdict landed rather than from the
    review: the steric-zipper evidence item on the hnRNP fibril assembly node was
    regraded from COMPUTATIONAL to IN_VITRO, because the sentence asserts accelerated
    fibril formation and cross-seeding that the paper measured on recombinant protein;
    the explanation records that the motif itself came from a structure-based
    prediction in the same study. A positional word in notes that said the VCP genetic
    row was below the notes block was corrected, since the notes block is at the end
    of the file.

    Validation after the round: schema and term validation pass; 85/85 snippets
    verified for this file and 116/116 across both changed files under
    validate-disorders with 123 titles checked and 0 issues; check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-coarse-phenotypes, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms and check-enum-values all clean;
    compliance-connectivity 56.6% against a 50.0 floor. The diff for this round
    contains no deletions, so no neighbouring field was orphaned by the insertions.

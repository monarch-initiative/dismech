  summary: 'Genetics pass: IBMPFD2 and IBMPFD3 subtype rows and hnRNP pathograph wiring'
  details: |
    Genetics-gap pass for issue #12265 (series-058), parent 2 of 2.

    Re-nomination mechanism found: exact anchor that still inflates. MONDO:0000507
    asserts no causal gene and its definition is the multisystem syndrome, so the
    anchor is correct and was kept. What produced the checklist was the class's own
    child set: two children are the gene-defined forms this entry should carry, one
    is owned by a separate entry, and one is a different disease filed under the
    class.

    Curated: a has_subtypes block, which the entry previously lacked entirely.
    IBMPFD2 is bound to MONDO:0014178 with HNRNPA2B1 (hgnc:5033) and an autosomal
    dominant inheritance block; IBMPFD3 is bound to MONDO:0014179 with HNRNPA1
    (hgnc:5031) and the same. Both MONDO classes define themselves as this disorder
    caused by variants in that gene. Both genetic rows gained relationship_type
    CAUSATIVE and a reciprocal subtype foreign key, and their features strings were
    replaced: each previously said only that the gene was Orphanet-listed and
    corresponded to an OMIM-numbered broader subtype, which stated no mechanism.
    relationship_type was typed from gene-specific sources, not from the GeneReviews
    sentence that names all three genes together.

    Two pathophysiology nodes now carry both hnRNP genes as genes descriptors, so
    neither gene is an unwired genetic row any more. hnRNP prion-like domain fibril
    assembly binds GO:0051258 protein polymerization for the steric zipper and
    self-seeding fibril mechanism; hnRNP recruitment into stress granules and
    cytoplasmic inclusions binds GO:1903608 and GO:0010494 for the stress granule
    incorporation. The second node feeds the entry's existing rimmed-vacuole
    myopathy, pagetic bone and frontotemporal nodes, so the hnRNP arm reaches the
    same three-organ chain the VCP arm does. Every binding is supported by a quoted
    sentence in its own node.

    New evidence: the GeneReviews chapter PMID:20301649 was already cached and
    already referenced by string inside an Orphanet epidemiology row, but was not
    cited as a reference. It is now tagged GeneReviews in references and cited for
    the diagnostic gene set and the inheritance mode, with quote_role
    REVIEW_SYNTHESIS. The ClinGen HNRNPA2B1 assertion
    CGGV:assertion_1ffe711b-1ff6-4b11-b329-c0f820904764-2024-10-24T190000.000Z was
    built from the committed cache/clingen/gene_validity.csv snapshot; its disease
    column is MONDO:0014178, matching the class bound on the row that cites it. It
    supplies the Moderate grade, the autosomal dominant mode, the organ involvement
    proportions, and ClinGen's lumping of amyotrophic lateral sclerosis into this
    entity and splitting of oculopharyngeal muscular dystrophy 2 out of it. HNRNPA1
    has no ClinGen assertion against any inclusion body myopathy entity in that
    snapshot, and the features text says so.

    Declined: MONDO:0850514 inclusion body myopathy and brain white matter
    abnormalities (ANXA11), structurally. Its label names brain white matter
    abnormalities rather than Paget disease of bone or frontotemporal dementia, its
    OMIM cross-reference sits outside the IBMPFD series, and ANXA11 does not appear
    in the cached GeneReviews chapter. ANXA11 already has a curated home as the
    ALS23 row of Amyotrophic_Lateral_Sclerosis bound to MONDO:0027694, which is also
    the only disease ClinGen asserts the gene against. Queued as
    stubs/Inclusion_Body_Myopathy_And_Brain_White_Matter_Abnormalities.yaml.

    Not curated, and flagged rather than resolved: MONDO:0008178, the type 1 or VCP
    form, is the disease_term of the separate
    kb/disorders/VCP-associated_Multisystem_Proteinopathy.yaml entry. No subtype row
    here binds it and the VCP genetic row carries no subtype key. The two entries
    overlap in scope, and the umbrella entry carries VCP-specific synonyms that
    belong to the type 1 leaf. That is a standing lump-or-split question for a
    maintainer.

    Validation: schema and term validation pass; 76/76 snippets verified, including
    two full-text sentences from PMID:23455423 that verify under
    validate-disorders on a branch containing dismech#12883;
    list-gene-term-mismatches-online examined every binding with no finding;
    check-folded-hyphens, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms and check-enum-values all clean.

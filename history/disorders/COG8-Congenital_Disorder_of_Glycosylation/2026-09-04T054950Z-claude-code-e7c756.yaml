  summary: 'Create: COG8-congenital disorder of glycosylation (MONDO:0012635)'
  details: |
    New curation of COG8-CDG (CDG-IIh), the fourth-reported COG-complex CDG and a sibling of the existing COG7-CDG entry. Mechanism curated as a six-node chain: biallelic truncating COG8 alleles -> loss of the Cog1-Cog8 lobe bridge and secondary Cog1 deficiency -> failed Golgi vesicle tethering and Golgi SNARE complex assembly -> mislocalisation of Golgi glycosyltransferases -> combined N- and O-glycan hyposialylation -> multisystem glycoprotein dysfunction, with a parallel branch for reduced proteoglycan glycosaminoglycan modification. Conforms to the type II arm of kb/modules/congenital_disorder_of_glycosylation.yaml at three nodes (Golgi N-Glycan Processing and Trafficking Defect, Protein Hypoglycosylation, Multisystem Glycoprotein Dysfunction). Two patient-derived and knockdown cell models are linked via modeled_mechanisms, including the lentiviral COG8 complementation rescue as a RESTORED readout. Frequency bands are deliberately omitted from every phenotype: only four patients had been published as of PMID:30690882, so a band would have a case-series denominator; per-patient counts are recorded in each phenotype's notes instead. Seizures carry a paired SUPPORT/REFUTE pair because PMID:28619360 explicitly reports their absence in a milder patient. Two KNOWLEDGE_GAP discussions record the unexplained severity range across clustered exon 5 truncating alleles, and the untested relevance of the HEK293T proteoglycan result to patient tissue. Validated with just validate (71/71 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, and validate-disorders.

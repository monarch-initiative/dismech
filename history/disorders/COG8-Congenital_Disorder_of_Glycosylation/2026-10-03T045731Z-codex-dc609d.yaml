  summary: Review COG8-CDG clinical spectrum, trafficking mechanisms and model counterevidence
  details: 'Eligibility and scope: COG8-CDG is an inherited recessive disorder, not an infectious disease or environmental poisoning. Fresh main 094932bb9414f6c28175014142bb347d249b608b had only CREATE history for this entry; the open-PR census showed no overlapping COG8 review. The branch was rebased before curation. No matching deep-research report or citation artifact was present, so the completeness assessment used the original publications and the cached GeneReviews overview directly.

    Sources: Read the original entry and its CREATE history, all eight originally cited PMID abstracts, and the complete scientific text available for PMID:23865579 (Laufman; shRNA HeLa/patient fibroblast trafficking and SNARE studies), PMID:34053170 (Adusumalli; HEK293T proteoglycan knockout study), and PMID:21421995 (Pokrovskaya; newly recovered full-text HTML). Refetched all six originally abstract-only PMIDs through the reference tooling. Recovered the full Foulquier 2007 paper corresponding to PMID:17220172 from the publisher''s public article-minimal URL, including the clinical table, patient course, biochemical results, complementation experiments and methods. That generated cache is included. The original PMID record remains abstract-only and supplies the normal article title; URL cache titles are retained as generated. Read the COG8-specific paragraph and the diagnosis, management/surveillance, agents-to-avoid and genetic counseling sections of the full cached NBK1332 overview. This chapter is retired and its guidance is explicitly historical and group-level.

    Full-text limits: PMID:17331980, PMID:28619360, PMID:30690882 and PMID:17904886 remained abstract-only after forced fetches. Additional DOI/publisher routes were attempted for the clinical cases. Kranz''s accessible publisher page supplied an abstract, the Yang ScienceDirect pages could not be generated into a reference cache (403), and the Arora Wiley route also returned 403. Unavailable DOI and duplicate abstract caches were not cited. No manually authored reference caches were used. The 2026 COG6/COG7 HLH report and an unrelated FKTN prenatal report were excluded as different entities.

    Completeness assessment:

    1. Phenotypes: Adequate for the principal features supported by the available texts. Added regression, encephalopathy, esotropia, ataxia, action myoclonus, oculomotor apraxia, absent Achilles reflexes, foot drop, brainstem atrophy, short stature, coagulation abnormalities, bruising, CK elevation and recurrent fever from the detailed p.Tyr537Ter case. Preserved seizure absence in the Korean case and the distinction between progressive ataxia and relatively stable interval MRI. No population frequencies inferred from a handful of case reports. Minor dysmorphic details in the single-patient table remain a nonblocking extension; unperformed nerve conduction studies do not establish confirmed polyneuropathy.

    2. Subtypes: Adequate. CDG-IIh and COG8-CDG are synonyms; the cited reports do not establish separable mechanistic subtypes.

    3. Pathophysiology: Adequate. Replaced bundled events with ten atomic nodes separating COG8 abundance, complex assembly, SNARE assembly, two trafficking routes, enzyme localization, beta1,4-galactosyltransferase abundance and N/O-glycan sialylation. Retained direct patient/model discrepancies: residual truncated COG8, genotype-dependent COG1 localization, normal localization of two patient Golgi enzymes, and increased total-cell N-glycan sialylation after acute COG8 knockdown. Clinical connections retain unknown intermediates; glycan-to-organ mechanisms are explicit knowledge gaps. Interface hepatitis is recorded as a single biopsy observation, not a proven universal mechanism.

    4. Treatments/trials: Adequate for retrieved sources. Added evidence-backed general nutritional/developmental care, hepatic/coagulation surveillance, counseling, medication precautions and strabismus care, with historical and group-level scope. Cellular complementation remains a model rescue result, not a clinical therapy. No COG8 intervention trial or drug efficacy result was identified in these sources.

    5. Genetics: Adequate. Added intron 3 splice-donor and early/late frameshift genotypes and preserved the p.Tyr537Ter allele. Corrected the implication that all variants lie in exon 5. The 2019 splice-creating variant is described without inventing an HGVS coordinate, RNA assay or protein measurement. Mendelian recurrence risks are conditional on parental carrier status.

    6. Biomarkers/diagnosis: Adequate. Type II transferrin is not gene-specific; molecular sequencing and segregation establish the genotype. Added ApoC-III and glycan characterization and retained the distinction between biochemical and clinical severity. Liver biopsy morphology is separated into histopathology.

    7. References: Adequate. All eight original PMIDs are retained; the newly recovered mechanistic and patient full texts are consumed in exact-quote evidence. GeneReviews is tagged and supports phenotype, diagnosis, management, avoidance and inheritance/counseling claims. New evidence and publication entries carry source-consistent titles.

    8. Overall consumption: Adequate. The full texts materially changed the causal account and model interpretation rather than merely adding citations. Proteoglycan results remain under the HEK293T model, with preserved secreted-chain lengths and 10E4 binding in COG8 knockout cells. Proposed turnover changes are not presented as measured kinetics. Model limitations and typed divergences prevent extrapolating these results into established patient tissue disease.

    Validation: The final batched validate-disorders pass verified schema, ontology terms, 140 snippets and 151 titles with zero issues. Additional QA, targeted data checks and rendering are recorded in the PR once completed.

    '

  summary: 'Create: Spinocerebellar_Ataxia_Autosomal_Recessive_26'
  details: |
    New entry for SCAR26 (MONDO:0033116, XRCC1). Deep research: falcon requested, fell back to claude_code (16/16 references resolved; an off-topic cached reference PMID:33779029 from the run was removed). Causal chain from biallelic XRCC1 variants through reduced XRCC1/LIG3 alpha, defective single-strand break repair and PARP1 trapping and hyperactivation to cerebellar interneuron and granule neuron loss, with the Parp1-deletion rescues in mouse (PMID:28002403) and zebrafish (PMID:40379758) as the key causal evidence. Phenotypes from the three described patients (PMID:28002403, PMID:29472272). The myotonia of one patient (CLCN1) is excluded. Two 2026 case reports had no retrievable text and are not used. No GeneReviews chapter or ClinGen curation. A pre-PR review corrected three statements against the full texts: veliparib was tested in Xrcc1-deficient mice (PMID:33932076) without extending lifespan; a further XRCC1 patient with seizures and microcephaly is mentioned in PMID:28002403; and xrcc1 zebrafish behaviour was examined and normal. It also added a calcium/seizure branch, residual XRCC1 protein (~5%), the PARP1 to repair feedback edge, and phenotypes from PMID:29472272 (pontocerebellar volume loss, sensory loss, calf wasting, Babinski sign). Validated with just validate (68/68 snippets) and the offline gates.

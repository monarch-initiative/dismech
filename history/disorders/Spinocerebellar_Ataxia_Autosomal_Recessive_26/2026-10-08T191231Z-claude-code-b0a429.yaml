  details: |
    Answered the automated review and the CI gene-activity gate in one push. Extended the Seizure snippet (PMID:28002403) through the words that attribute the phenotype combination to the XRCC1 patient. Bound protein-macromolecule adaptor activity (GO:0030674, DECREASED) on the Reduced XRCC1 node, citing the scaffold sentence of PMID:28002403. Wired eight phenotypes: neuropathy sequelae (vibratory loss, distal amyotrophy, areflexia) and edges from cerebellar neuron loss to pontocerebellar atrophy, dysarthria, nystagmus, hypometric saccades and oculomotor apraxia; Babinski sign, learning difficulty and azoospermia deliberately left unconnected. Added a diagnosis block (exome sequencing; ADP-ribose as a research marker), a note that AFP/albumin/cholesterol are unreported, and a caveat on HP:0001328. Phenotype connectivity 12/15; 71/71 snippets verified.

  summary: Integrate assessed OpenScientist findings for both IgG4-RD hypotheses
  details: |
    Worked from the two committed codex assessments of the OpenScientist reports (innate_first_bystander_model, WEAKLY_SUPPORTED_UNRESOLVED; plasmablast_autoantigen_fibrosis_driver_model, PARTIALLY_SUPPORTED); no new assessment sidecar was written because one already existed for each. Only RETAINED and QUALIFIED claims were integrated, and every snippet was re-derived from references_cache rather than copied from the reports. Added: primary tissue evidence for the Tfh node (PMID:35568079) and for the CD4-positive CTL node (PMID:38092138); anti-IL-1RA autoantibody evidence on the candidate-autoantigen node (PMID:33974929); two evidence items on the previously evidence-free Rituximab treatment (PMID:38781535); a Peripheral Blood Eosinophilia phenotype bound to HP:0001880 with the allergy/eosinophilia/hyper-IgE meta-analysis (PMID:41912044); two evidence items on the existing organ-tropism gap (PMID:30612117 replicated four-phenotype latent class analysis, PMID:39306708 review proposing phenotype-specific immune subsets); a new KNOWLEDGE_GAP discussion for the two untested canonical edges, B-lineage antigen presentation to CD4-positive CTLs and CTL-driven fibroblast activation (PMID:27667138, PMID:38092138, PMID:41766862), with a proposed autologous co-culture and blockade experiment; and a new HUMAN_MODEL_MISMATCH discussion for the unobserved human innate-to-adaptive transition (PMID:39264798, PMID:24815737), with a proposed longitudinal repertoire-tracking experiment. Qualified three pieces of existing prose the assessments found overstated: the innate hypothesis notes now record the assessed WEAKLY_SUPPORTED_UNRESOLVED verdict and that innate-first ordering is mouse-only, the MITIGATE explanation no longer claims antigen-specific adaptive responses are necessary, and the NOD2 explanation no longer asserts redundant in-vivo innate pathways. Added a notes block to the plasmablast hypothesis recording why CANONICAL is retained and which report claims were rejected on assessment. Deliberately not added: PMID:22744834 (basophil TLR route) because NCBI returns no abstract or full text, so no verifiable snippet exists; PMID:27744509 because it is a review and cannot be the third independent primary pathway the report claimed; and no status change to either hypothesis, per both assessments. Statuses unchanged: plasmablast model CANONICAL, innate model ALTERNATIVE.

  summary: Review the complete IgG4-RD model, reconcile both OpenScientist
    reports, and add evidence-backed mechanisms and clinical coverage
  details: |
    Reviewed the entire disease YAML, both complete OpenScientist reports and their citation sidecars, both prior codex YAML/Markdown assessments, and the matching Falcon research report. Independently checked all 51 unique report PMID sources and additional primary experiments, clinical studies, guidelines, FDA labeling and six trial protocols. Literature results were not treated as provider-generated analyses.

    Content-completeness review:
    - Identity and clinical scope: preserve systemic IgG4-RD and distinguish type 1 autoimmune pancreatitis, glandular disease and four replicated clinical organ-pattern clusters. The clusters do not establish exclusive immune mechanisms. HLA/FCGR2B are polygenic susceptibility, not monogenic diagnoses. Add Harrison immune/rheumatologic classification, claims-based prevalence/incidence with denominators, heterogeneous progression and accumulated damage.
    - Adaptive mechanisms: retain oligoclonal plasmablast and cytotoxic T-cell biology, but keep B-lineage antigen presentation to CTLs and CTL-to-fibroblast mediation explicitly unresolved. Add patient-derived functional Tfh/B-cell evidence omitted from the earlier assessment. Add direct B-cell/plasmablast-to-fibroblast coculture evidence, transwell separation and PDGF-B blocking. Distinguish fibroblast activation/collagen production from storiform tissue architecture; LOXL2 expression is not uniquely IgG4-related or proof of matrix dominance. Spatial CTL/B-cell proximity and mesenchymal apoptosis are associations, not direct killing or antigen-presentation assays.
    - Innate mechanisms: add NOD2/TLR-associated BAFF production, TLR7/macrophage IL-33, IL-33/MMP12, cDC chemokines, T-cell CCL25 and pDC IFN-alpha amplification. The pDC/T-cell loop is supported by the actual induced-mouse and coculture experiments. The human component of PMID39264798 measured serum in 33 patients, including 14 paired treatment samples; it did not validate tissue temporal ordering. Gut microbiota transfer and barrier disruption require poly(I:C) and show organ-specific amplification. Slc29a3 sialadenitis includes lymphocytes and Aqp5-positive intercalated-duct injury; it is not isolated innate-cell sufficiency or faithful systemic IgG4-RD.
    - Autoantibodies: add functional IL-1RA neutralization and cholangiocyte-protection routes with subset/isotype limits. Annexin-containing patient serum and laminin gene knockdown are distinct perturbations. Mixed immune-complex complement activation does not identify a purified IgG4 causal renal pathway. Neonatal mouse IgG transfer shows context-dependent injury and IgG4 inhibition of IgG1 injury. Negative four-antigen panels do not exclude all autoreactivity or date epitope spreading.
    - Graph and distal disease: retain biological directionality and use a documented feedback cycle only. Add pancreatobiliary obstruction, intrinsic renal injury, retroperitoneal urinary obstruction and glandular injury branches, with bare-name targets resolving to the actual phenotypes. Add hydronephrosis, salivary involvement, lymphadenopathy, proteinuria and aortitis; retain core pancreatic, biliary, lacrimal, renal and retroperitoneal manifestations with source evidence. Remove untraceable weight-loss assertion and unsupported blanket frequencies. Clinical aortitis and lymphadenopathy remain without invented mediating arrows. Macrophage MMP12-to-storiform fibrosis and the cellular mechanism of obliterative phlebitis are explicit gaps, not forced edges for connectivity.
    - Histology and diagnosis: replace unverified histological frequencies with organ-variable pathology consensus. Venous obliterative phlebitis is distinct from arteritis/aortitis and cutaneous leukocytoclastic vasculitis. Require morphology plus clinicopathological integration; serum IgG4 and tissue IgG4 counts alone are insufficient. Add integrated imaging/serology/biopsy, distinguish research classification criteria from diagnosis, and discuss malignancy and Sjogren overlap.
    - Biomarkers: correct serum IgG4 and total-IgG denominator scope, add circulating plasmablasts, sIL-2R and exploratory IFN/IL-33/chemokines. Complement consumption and plasmablast expansion have structured readouts. Association and steroid-associated decline do not prove upstream effector action or specificity.
    - Treatments and trials: qualify referral-cohort glucocorticoid remission estimates, add actual open-label rituximab outcomes, update inebilizumab to the FDA adult indication and randomized MITIGATE results. Add nondepleting obexelimab INDIGO evidence, preliminary rilzabrutinib and heterogeneous abatacept results. Mechanism targets are used where justified; no untested direct profibrotic output is assigned to obexelimab. Add biliary and ureteral stenting for obstruction. Independently inspect six registry protocols/statuses, distinguish ongoing long-term extensions from published primary results, and correct the false no-belimumab-trial claim. Belimumab registry phase IV is not an IgG4-RD approval claim; CAR-T registry enrollment is not efficacy evidence.
    - Experimental systems and datasets: add four mouse models and four patient/cell-line systems with perturbations, readouts, fidelity and limitations. Retain both existing GEO datasets and verify accessions and metadata through per-accession reference caches (2/2 pass). No raw dataset reanalysis or provider execution is claimed.
    - Assessments: comprehensively update both authoritative codex YAML sidecars and paired narratives, preserving prior claim IDs and reconciling earlier overbroad statements. The adaptive report remains PARTIALLY_SUPPORTED with 25 claims; the innate report remains WEAKLY_SUPPORTED_UNRESOLVED with 23 claims. Correct tissue-validation, third-pathway primary-source, autoantibody-denominator, sIL-2R attribution, allergy-denominator, isotype, vascular, complement, genetic and clinical-trial errors. Record all 18 declared innate artifacts and all four adaptive figure placeholders as absent. Literature/figure-generation execution is REPORTED_ONLY and proposed experiments SKIPPED, with no invented successful analysis. Additional 2026 studies are separated by whether they predate each report.

    Validation: the targeted disease schema and canonical ontology bindings pass, and all 188 evidence snippets verify against cached sources. Both assessments pass schema, relative links and exact report-quote validation. Scoped duplicate-key, enum, entity-reference, causal-target, qualifier and source-defect checks pass. Dataset verification passes 2/2. Additional title/snippet/offline-cache gates and precommit results are reported in the PR. All source caches were generated through sanctioned fetch-reference calls; no cache Markdown was hand-edited. The frozen dataset-accession file is sparse-excluded and was never read, written or staged.

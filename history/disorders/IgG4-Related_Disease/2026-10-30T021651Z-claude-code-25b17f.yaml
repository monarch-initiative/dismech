  summary: 'Review: fix evidence-claim snippet mismatches in IgG4-Related_Disease'
  details: |
    Resolved evidence-claim-mismatch issue #15760 (jev whole-claim MISMATCH leads). Replaced six selected snippets that did not substantively support their claim with exact quotes from the same cached reference: (1) pathophysiology IgG4-Positive Plasma Cell Infiltration (PMID:25988916) — swapped a disease-framing sentence for the pathologic-diagnosis sentence naming increased IgG4+ plasma cells; (2) glucocorticoid target_mechanism (PMID:32552502) — swapped a response-timing sentence for the remission-induction dosing sentence; (3) progression mortality (PMID:37137671) — added mortality-rate context to the bare adjusted HR 2.51; (4) Sjogren differential (PMID:30596168) — added the IgG4-RKD extractable-nuclear-antigen contrast that makes anti-SSA/SSB distinguishing; (5) asbestos/idiopathic RPF (PMID:25089862) — swapped a cohort-size methods sentence for the OR 4.22 asbestos risk finding; (6) innate-first-bystander hypothesis (PMID:41332187) — expanded the Slc29a3 snippet to include the SLC29A3/TLR7-TLR8 innate-receptor mechanism it is cited for. Retained as correct: NCT07148791 CAR-T trial (status/phase/enrollment re-checked against ClinicalTrials.gov API), the Proteinuria/hemoproteinuria phenotype, and the immune-complex CH50 complement-consumption readout (PMID:26357950). Following review, marked the glucocorticoid (PMID:32552502, remission induction implies inflammation suppression) and asbestos (PMID:25089862, idiopathic RPF rather than IgG4-RD) items directness INDIRECT. No claims rewritten; all 216 snippets verify and validate-disorders passes.

  summary: Fix a malformed FDA label reference URL that missed its own committed cache
  details: |
    One character in one reference: the FDA label URL read drugsatfda/docs/label where FDA's own path is drugsatfda_docs/label. The slash form matched no cache file, so reference validation fell through to a live fetch of accessdata.fda.gov, which CI cannot reach, and the entry failed with one unavailable snippet. Three signals fix the spelling independently: the committed cache file references_cache/url_https___www.accessdata.fda.gov_drugsatfda_docs_label_2025_761142s003lbl.pdf.md carries reference_id with the underscore form, 60 other url: references in kb/ use the underscore form against this one, and this entry's own reference_title already used the underscore form. The defect predates this PR; it surfaced here only because just validate-disorders runs over changed files and this PR's one-line experiment_design insert brought the entry into scope for the first time. After the fix the entry validates with 216 snippets checked and 0 unavailable. No snippet, title or claim was altered.

  details: |
    Weekly compliance pass focused on disease classification for immune-mediated disorders. Added a classifications block assigning Harrison's Part IMMUNE_RHEUMATOLOGIC, cited to PMID:25988916 with the exact-quote definition of IgG4-RD as an immune-mediated fibroinflammatory condition affecting nearly any organ. No organ-system Part was added because the disease has no single dominant organ. Added evidence to four of seven previously unevidenced phenotypes, citing the latent-class phenotype analysis PMID:30612117, which was newly fetched with just fetch-reference. Retroperitoneal Fibrosis is SUPPORT because the abstract names that phenotype group directly; Autoimmune Pancreatitis, Sclerosing Cholangitis, and Enlarged Lacrimal Glands are marked PARTIAL because the abstract names organ-system groups and an eponymous syndrome rather than those individual findings. Validated with just validate, just validate-terms, and just count-verified-snippets, which verified 40/40 checkable snippets with 10 skipped by prefix because they cite DOIs. Weighted compliance rose from 77.0 percent to 80.5 percent.

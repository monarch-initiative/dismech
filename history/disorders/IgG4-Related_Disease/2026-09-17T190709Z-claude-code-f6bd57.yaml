  summary: Re-apply outstanding OpenScientist findings
  details: |
    Batch-2 re-application of the four OpenScientist-derived citations from the earlier assessed sweep (branch os-review-fable) that had not reached main, rebased onto main's heavily rewritten 3272-line entry. Applied: PMID:38781535 as two evidence items on treatments#Rituximab, which previously carried only the open-label 30-person trial - one replicating remission induction in a 33-patient retrospective cohort, one recording that depth of CD19+/naive/memory B-cell depletion predicts duration of response; PMID:39306708 as evidence on discussions#gap_igg4rd_organ_tropism_and_fibroinflammation, the review proposing a dominant immune subset per organ-distribution phenotype, framed as motivating rather than closing the gap; PMID:41766862 as node-level evidence on pathophysiology#CD4-Positive Cytotoxic T-Lymphocyte Fibrogenic Cytokine Production, with the explanation recording that the review's drivership attribution rests on the mediator profile rather than a fibroblast-activation experiment; PMID:41912044 as a new Hematologic phenotype, Peripheral Blood Eosinophilia (HP:0001880, frequency OCCASIONAL), with two snippets - the pooled 22% proportion, and the authors' own statement that the causal relationship to the type 2 axis is unresolved - and deliberately no causal edge. All six snippets were re-derived from the current references_cache records rather than copied from the old branch; PMID:38781535 now has full text, so both of its quotes were re-verified there. Skipped: the old branch's two new discussions (gap_igg4rd_bcell_antigen_presentation_and_fibroblast_edges, gap_igg4rd_innate_to_adaptive_transition) as redundant against main's three existing gap discussions, which already record the B-lineage-to-CTL antigen-presentation step as inferred and the CTL-to-storiform-architecture route as unresolved; their own citations (PMID:27667138, PMID:38092138, PMID:39264798, PMID:24815737) are already present on main. Also skipped the old branch's PMID:30612117 addition, already carried by main's has_subtypes and phenotypes, and PMID:33974929 / PMID:35568079 / PMID:38092138, all already on main. Prose corrections needed no action: main's innate_first_bystander_model notes already grade the composite hypothesis weakly supported/unresolved and state that mouse initiation does not establish human initiation; the inebilizumab explanation already declines the necessity claim; the NOD2/BAFF explanation already limits itself to cultured cells; and the plasmablast hypothesis description already records the unresolved autoantigen, B-cell-to-CTL and CTL-to-storiform steps. Assessment sidecars (openscientist-assessment-by-codex) were already present for both hypotheses. Verified with linkml-validate (No issues found), count-verified-snippets (215/215), check-duplicate-keys, check-entity-refs, check-causal-targets, and check-enum-values, all clean.

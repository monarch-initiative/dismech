  summary: Make confidence explicit for emerging pathophysiology mechanisms
  details: |
    Set PROVISIONAL confidence on thirteen emerging immune, autoantibody and epithelial-barrier nodes. Human association, small patient-cell functional studies and induced-mouse perturbations support these routes, while initiating roles and quantitative human contributions remain unresolved. This includes candidate antigen presentation, B-lineage profibrotic signaling, CTL-associated injury, innate BAFF, TLR7/IL-33/MMP12, the poly(I:C) cDC-T-cell-pDC sequence, microbiota amplification, IL-1RA neutralization, mixed immune-complex complement and cholangiocyte barrier dysfunction. Preserve established confidence for independently reproduced helper-cell and B-cell states, generic fibroblast activation, characteristic histology and organ injury. The explicit labels prevent the schema default from contradicting the existing evidence qualifications.

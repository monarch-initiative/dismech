  summary: 'Create: Cone-rod_Dystrophy_20'
  details: |
    New entry for cone-rod dystrophy 20 (MONDO:0014427), caused by biallelic POC1B variants. Kept as a standalone Disease: MONDO has it as a leaf under cone-rod dystrophy and no existing entry covers POC1B.

    Curated directly from PubMed literature; no deep-research report was run. Sources are the two 2014 gene-discovery papers (PMID:25018096, PMID:24945461), the Japanese seven-family cohort (PMID:31390656), further case series and case reports (PMID:34065499, 37246743, 33657974, 29220607, 39568138, 37227616), the POC1A/POC1B centriole study (PMID:23015594), the zebrafish knockdown studies (PMID:25018096, 26188096), and the oligoasthenoteratozoospermia family plus knock-in mouse (PMID:37070736).

    Lump/split: the reported Joubert-like presentation with homozygous p.Arg106Pro (PMID:25044745) was not split out and not recorded as a phenotype, because the same group later found a co-inherited deep-intronic CEP290 variant that fully explains the syndromic features and withdrew the Joubert attribution (PMID:40170356). This is recorded in the genetic notes. A two-sibling report of optic disc swelling (PMID:41293231) is mentioned in notes only.

    Pathograph: POC1B variants -> photoreceptor basal body / connecting cilium defect -> cone-predominant photoreceptor degeneration -> retinal phenotypes, with a separate branch to the sperm flagellum defect and male infertility. No GeneReviews chapter or ClinGen gene-disease validity record exists for POC1B. The treatment entry (supportive care) is uncited because no study evaluates treatment.

    Validated with just validate, validate-terms, count-verified-snippets, the offline entity-ref, causal-target, duplicate-key and enum gates, and validate-disorders.

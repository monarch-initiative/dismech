  summary: 'Review round 1: Cone-rod_Dystrophy_20'
  details: |
    Changes made in response to the first review of PR 13706.

    Molecular function: POC1B's pathophysiology node now binds GO:0046982 protein heterodimerization activity (modifier DECREASED). The evidence is the 2024 study showing that POC1A-POC1B heterodimers organise the inner centriole scaffold (PMID:39543170). QuickGO lists only generic protein binding (GO:0005515) as an experimental molecular-function annotation for POC1B, so the heterodimerization term was chosen as the most specific sourced activity.

    Phenotypes: added Nystagmus (HP:0000639) with infantile onset, citing PMID:25018096 (early-infancy nystagmus in 2 of 4 patients) and PMID:34065499. The description now mentions the achromatopsia-like early-infancy presentation. Added High myopia (HP:0011003) from PMID:39568138 and PMID:41293231. It is left unwired and has no frequency, because no study tests whether myopia is part of the POC1B phenotype. Frequency VERY_FREQUENT was set on the light-adapted ERG and the OCT phenotypes, where the cited series report the finding in all patients. A central-scotoma table row from PMID:25018096 was added as evidence. Male infertility stays at HP:0003251, because HPO has no single oligoasthenoteratozoospermia term (a search returned only separate count, motility and morphology terms).

    Other: the supportive treatment modality is now DEVICE. The PMID:25044745 retinal immunostaining item is regraded to IN_VITRO, since it is ex vivo tissue staining. quote_role PRIMARY_RESULT was added to the Roosing synthesis sentence.

    Deep research: a falcon report was run and committed (research/Cone-rod_Dystrophy_20-deep-research-falcon.md). All 5 of its references resolved, none unresolved. The single term-validation flag is a placeholder label ('if available') attached to the correct MONDO ID. just preflight-dr could not run because the local MONDO build is absent and was not downloaded, given limited disk. As a manual named-entity check, the report names POC1B 47 times and no other causal gene, and it describes the correct families. Reconciliation against the report added a REFUTE item: Beck et al. found p.Arg106Pro localized normally to the centrosome in HEK293T cells, so the node description now calls the localization defect assay-dependent. The report also cites a 2024 Mexican IRD cohort (DOI:10.1186/s12886-023-03276-7) listing one homozygous POC1B frameshift; it was not added, because the finding sits in a table, not the abstract.

    Validated with just validate, validate-terms, count-verified-snippets, the offline gates, check-gene-activity-grounding (ref mode), compliance-connectivity, check-coarse-phenotypes and validate-disorders.

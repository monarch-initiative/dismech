  summary: Address PR review on Developmental and Epileptic Encephalopathy 116
  details: |
    Round of changes answering the ai4c-reviewer CHANGES_REQUESTED review on PR 9589.

    Both blocking items fixed. Item 1, the cell type "Neural progenitor cell" was
    bound to CL:0000047 neural stem cell; the reviewer is right that CL:0011020
    neural progenitor cell is the exact match and that the supporting snippet says
    "neuro- and glial-progenitor cells", which a stem cell term does not cover.
    Changed, and CL:0011020 was already in cache/cl/terms.csv so no new cache row
    was added. Item 2, the mouse in utero electroporation negative result existed
    only as prose inside the HUMAN_MODEL_MISMATCH discussion; it is now an
    animal_models entry with modeled_mechanisms.relationship FAILS_TO_RECAPITULATE,
    an UNCHANGED readout, and the limitations and evidence that relationship
    requires. The discussion is kept and the two cross-reference each other.

    All six non-blocking suggestions were also taken. A biochemical section now
    carries plasma and cerebrospinal fluid glutamine and plasma ammonia, both with
    presence VARIABLE, which is the evidence the biochemistry knowledge gap hangs
    on. Hypotonia gained a VERY_FREQUENT band from the quote the reviewer pointed
    at, which supplies a denominator, and the same quote was added to Hypertonia
    because it states the contrast between the two series directly. HP:0006808
    Cerebral hypomyelination was added as a separate phenotype alongside the general
    white matter term. A three-phase progression section records presentation,
    developmental arrest, and the long-term course to 25 years. An
    experimental_models entry covers the transfection-based expression system in
    which the mechanism was established.

    Two evidence_source values were changed on the reviewer's reading and I agree
    with both: the single-cell transcriptome analysis is COMPUTATIONAL rather than
    HUMAN_CLINICAL, and the sentence describing the truncated enzyme retaining
    activity while escaping degradation describes in vitro work, so IN_VITRO.

    One tooling note. A scripted re-indent of reference_title lines was applied
    during this round and initially mis-set the indentation of eighteen lines that
    follow a "- reference:" list item, producing a YAML parse error. It was caught
    by just validate, corrected, and every reference_title in the file was then
    checked programmatically against the title field of its own references_cache
    file: 76 of 76 matched exactly, 0 problems. reference_title is not
    machine-checked by the normal validators, so this check was run explicitly
    rather than assumed.

    Validation, all run and read: just validate passed; just validate-disorders
    passed; Snippets checked: 78/78 verified against cached references;
    check-title-snippets, check_snippet_length --against-ref origin/main,
    check_folded_hyphens --check, check-duplicate-keys and check-cache-order all OK.
    No cache rows changed by this round. Branch level with origin/main.

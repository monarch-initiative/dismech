  summary: 'Gene-family review: GLUL'
  details: |
    GLUL was typed CAUSATIVE; ClinGen's only autosomal dominant assessment of GLUL, against the broader class genetic developmental and epileptic encephalopathy (MONDO:0100062, Epilepsy GCEP, 2025), is Moderate, so following the convention that CAUSATIVE needs a Definitive or Strong tier the record is now UNKNOWN with a note; the tier itself is not copied because that class is not this entry's disease term. The record now carries an inheritance block bound to HP:0000006, matching the disease-level block. The mechanism nodes, start-codon and 5' UTR splice variants that remove the N-terminal degron and leave glutamine synthetase running outside its glutamine-triggered degradation (GO:0004356 with GAIN_OF_FUNCTION), were left unchanged.

  summary: 'Create: Developmental and Epileptic Encephalopathy 116 (GLUL gain of stabilization)'
  details: |
    New Disease entry for MONDO:0970945 (OMIM 620806), the autosomal dominant
    GLUL-related developmental and epileptic encephalopathy, curated from the stub
    at stubs/Developmental_And_Epileptic_Encephalopathy_116.yaml.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count, so
    MONDO holds this as a leaf, and genes: lists a single causal gene (GLUL). No
    existing dismech entry covers GLUL, and the recessive GLUL disease (congenital
    glutamine deficiency, OMIM 610015) is not in the knowledge base either; it is
    curated here only as a differential_diagnoses entry, not as a subtype, because
    the two diseases run in opposite mechanistic directions.

    Deep research: just research-disorder falcon. The report's reference_validation
    block reported 4/4 references verified, 0 not found, confabulation_rate 0.0, 3 of
    4 weighed as on topic with 0 off topic (one undecided). NEC preflight
    (just preflight-dr ... MONDO:0970945) returned PASS: GLUL mentioned 37 times with
    no rival gene above 2, and the report OMIM 620806 matched the MONDO xref. This
    was the highest NEC-risk of the four entries in this batch, since DEE is a
    numbered series and a report about a different DEE number would validate
    perfectly; the gene-frequency check is what rules that out.

    The report was used as a lead only. All 62 snippets come from references_cache
    files fetched with just fetch-reference. Three claims the report made were
    checked against the cache before use: the zonisamide and brivaracetam efficacy
    statement, the ketogenic diet and cannabidiol negative result, and the female
    predominance of the founding cohort. All three are present verbatim in
    PMID:39985170 and were curated. One report claim was checked and NOT curated:
    the mechanistic name "glutamine synthetase stabilization disorder (GSSD)",
    attributed to the founding study. The cached record for PMID:38579670 is the
    PubMed abstract only and does not contain the phrase, so it was left out of the
    synonyms and the omission recorded in the entry notes.

    Content: 7 pathophysiology nodes forming a single connected chain from the
    start-loss and 5' UTR splice variants through translation reinitiation at
    methionine 18, escape from glutamine-induced degradation, unregulated enzyme
    activity in astrocytes and progenitors, and disrupted glutamate-glutamine
    homeostasis, to the clinical encephalopathy and a structural imaging branch.
    10 phenotypes, 1 genetic entry, 1 differential_diagnoses entry for congenital
    glutamine deficiency, a symptomatic antiseizure treatment entry, 2 diagnosis
    entries, and 3 discussions: a KNOWLEDGE_GAP on the biochemistry contradicting
    the mechanism, a KNOWLEDGE_GAP on the unexplained female predominance, and a
    HUMAN_MODEL_MISMATCH on the mouse in utero electroporation experiment that
    failed to reproduce a patient's periventricular nodular heterotopia.

    Deliberate omissions recorded in the entry notes: no prevalence record (roughly
    thirteen dominant patients reported, no population estimate exists); no
    environmental section; no experimental_models or animal_models section (the only
    model in the literature is the single negative electroporation experiment, which
    carries its meaning inside the HUMAN_MODEL_MISMATCH discussion); no datasets;
    and no antisense_oligonucleotide_therapy module conformance, because the
    antisense and methionine sulfoximine approaches are proposals with no drug, no
    trial and no demonstrated splice redirection. Frequency was omitted for four
    phenotypes where the denominator would be three patients from a single series.

    Validation, all run and read: just validate passed (schema, terms, references),
    Snippets checked: 62/62 verified against cached references; just
    validate-disorders passed; check-title-snippets OK; check_snippet_length
    --against-ref origin/main OK; check_folded_hyphens --check OK;
    check-duplicate-keys OK; check-term-cache-integrity OK; check-cache-order OK.
    Cache diff is exactly the three CURIEs this entry introduces (MONDO:0970945,
    GO:0004356, hgnc:4341).

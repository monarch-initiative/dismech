  summary: 'Review round 1: Brain_Small_Vessel_Disease_6_With_Leukoencephalopathy'
  details: |
    Addressed the first review of PR 15852. Added a PROVISIONAL node, Endothelin-1 Mediated Extracerebral Muscle and Fat Loss, linked to muscle cramps and enophthalmos, citing the cohort authors' proposed endothelin-1 pathway (PMID:41908989) and the mouse work they cite; the notes no longer say that no mechanism has been proposed for these features. Renamed Endothelin-1 Accumulation in White Matter to Endothelin-1 Excess, because it also feeds the vascular and muscle arms, and its description now says that only astrocytic staining has been observed. Added evidence to the endothelin-1 to vasoconstriction edge and a progenitor snippet to the oligodendrocyte maturation node. Added treatments: mechanical thrombectomy for large vessel stroke, with the intravenous thrombolysis caution, and antihypertensive therapy. Endothelin receptor antagonists were not added because none has been tested in CARASAL. Validated with just validate, validate-terms, count-verified-snippets and the whole-repo gates.

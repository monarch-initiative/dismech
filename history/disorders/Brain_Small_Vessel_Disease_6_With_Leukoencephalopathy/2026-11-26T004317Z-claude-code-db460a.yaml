  summary: 'Gene-family review: CTSA; relationship typed UNKNOWN'
  details: |
    The CTSA record was CAUSATIVE. CAUSATIVE is reserved for Definitive- or Strong-level evidence, and the case for CTSA in CARASAL rests on one recurrent variant, c.919C>T p.(Arg307Cys) (c.973C>T p.Arg325Cys in older numbering): two Dutch families sharing a founder haplotype (PMID:27664989), a 21-patient series from three pedigrees (PMID:41908989), and a few unrelated Chinese and Italian-Brazilian patients (PMID:35904593), with no functional study of the variant and no ClinGen classification. The record is now UNKNOWN with a note giving that basis, matching the KB convention used for ClinGen Moderate pairs. The node modelling was already appropriately provisional (activity bound without a direction) and was not changed.

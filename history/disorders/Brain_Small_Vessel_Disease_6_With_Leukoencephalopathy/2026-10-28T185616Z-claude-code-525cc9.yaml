  summary: 'Create: Brain_Small_Vessel_Disease_6_With_Leukoencephalopathy'
  details: |
    New Mendelian entry for CARASAL, bound to MONDO:0980711 (brain small vessel disease 6 with leukoencephalopathy), claimed in issue 15833. The claim was filed on MONDO:0035551, which the OLS MONDO release 2026-10-06 marks obsolete and merged into MONDO:0980711; the local MONDO build used for stub enrichment (2026-05-05) still lists 0035551 only as an obsoletion candidate. Both stubs are deleted and the claim issue retitled. Pathograph: heterozygous CTSA Arg307Cys (Arg325Cys in older numbering) -> endothelin-1 accumulation in white matter astrocytes -> oligodendrocyte progenitor maturation arrest -> leukoencephalopathy; and -> endothelin-1 driven arteriolar vasoconstriction -> hypertension and cerebral small vessel arteriopathy -> ischemic stroke, TIA and intracerebral hemorrhage. All nodes after the variant are PROVISIONAL: they rest on autopsy staining in the founding families and mouse endothelin-1 degradation data, and the variant's effect on cathepsin A activity has not been measured. Phenotypes from the 21-patient 2026 cohort (sicca, cramps, dysphagia, enophthalmos) are recorded but left unlinked where no mechanism is proposed. Deep research: one OpenScientist report (18/18 references resolved, only 5 judged on topic); it gave the wrong HGNC identifier for CTSA (HGNC:2515 is CTNND1), and its in-silico structural analysis of the variant is the provider's own and is not cited. The report files were renamed to the new entry slug. Validated with just validate, count-verified-snippets and the whole-repo gates.

  summary: 'Create: Interleukin-10 Receptor Deficiency'
  details: |
    New entry curating the archetype of monogenic very-early-onset inflammatory bowel disease, and the immune-mediated counterpart to the epithelial congenital enteropathies curated earlier on this branch.

    This entry completes the conceptual picture of the branch. The three epithelial CODE mechanism modules created here (diet_induced_osmotic_diarrhea, electrolyte_transport_related_diarrhea, enterocyte_polarity_trafficking_failure) each name immune-mediated enteropathy among their exclusions, following PMID:29654747, which divides CODEs into those caused by variants directly affecting the intestinal epithelium and those affecting the immune system that secondarily impair epithelial function. Until now the branch had modelled only the first division. This entry curates the second, and conforms to none of the three modules for exactly that reason - the epithelium here is intrinsically normal.

    Four-node chain: loss of a functional interleukin-10 receptor (trigger) -> abolished IL-10-induced STAT3 signaling (central_effector, the step directly measured in patients) -> loss of negative feedback on proinflammatory cytokine output (effector) -> hyperinflammatory enterocolitis (consequence). The framing preserved throughout is that this is a loss of regulation rather than a gain of a pathogenic signal: the immune system is left unrestrained rather than abnormally driven, which is why the disease is continuous wherever immune stimulation is continuous, and therefore worst in the gut.

    Lump/split decision: MONDO splits the disease by receptor chain (MONDO:0013153 IBD28 for IL10RA, MONDO:0012941 IBD25 for IL10RB) with no umbrella term. Curated as one entry named for the receptor, with both chains as has_subtypes each bound to its own MONDO term, and MONDO:0012941 recorded as a skos:narrowMatch so the IBD25 concept registers as covered per the project's MONDO-coverage rule. The justification is that the two chains form a single heterotetramer and produce the same phenotype. The one real asymmetry - IL10R2 is shared with the interleukin-22 and interleukin-26 receptors while IL10R1 is specific to the IL-10 receptor - is preserved in the genetic blocks, the subtype descriptions and the trigger node rather than smoothed away, and the notes name it as the grounds on which a future split would rest.

    Failed conventional therapy is curated as a treatment carrying REFUTE evidence rather than omitted, because its failure is a prediction of the model (blocking one downstream cytokine cannot replace a missing master regulator) and a practical diagnostic clue to monogenic VEO-IBD.

    Two evidence honesty notes recorded in the entry: the transplantation outcome rests on a single patient in the cited report, which the evidence explanation states; and the recurrent infections were attributed by the original authors to immunosuppressive therapy rather than to the receptor defect, so the phenotype is banded OCCASIONAL and explicitly flagged as not necessarily intrinsic.

    An OAK label search for IL10RB returned the divergent transcript IL10RB-DT (hgnc:44303) first; the real gene (hgnc:5965) was confirmed by direct lookup. This is the second instance of that near-miss on this branch, after MYO5B/MYO5BP1.

    Validation: linkml-validate clean; linkml-term-validator clean after correcting a CL label (CL:0000842 is "mononuclear leukocyte", not "mononuclear cell"); 15/15 snippets verified against cached abstracts; duplicate-key and folded-hyphen gates clean.

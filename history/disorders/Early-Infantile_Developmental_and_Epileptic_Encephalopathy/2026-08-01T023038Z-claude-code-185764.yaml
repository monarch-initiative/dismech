  details: |
    Independent fresh-context audit (adversarial cross-check of a self-reviewed PR), merged with the ai4c-reviewer CHANGES_REQUESTED findings.

    FOUND BY INDEPENDENT AUDIT - missed by both the author self-review and the automated reviewer:

    1. Two reference_title misattributions. PMID:33808762 was titled "GABAergic Signaling as Therapeutic Target for Autism Spectrum Disorders." but is actually "The Role of Phospholipase C in GABAergic Inhibition and Its Relevance to Epilepsy." PMID:35765990 was titled "Infantile Spasms: An Update on Pre-Clinical Models and EEG Mechanisms." but is actually "Treatment of children with infantile spasms: A network meta-analysis." In both cases the PMID and the snippet were correct and validated cleanly against the cached abstract, so snippet validation is structurally incapable of detecting this class of error. Both titles corrected against the cache.

    2. Pathograph encoded an incomplete model as settled. The outcome node's own description states that a developmental encephalopathy arises directly from the etiology and impairs development independently of any seizure, but the graph contained no such edge: the only path from the etiologic lesion to the DEE outcome ran through Recurrent Drug-Resistant Seizures, so the graph asserted that all developmental impairment is seizure-mediated. Added a direct Etiologic Lesion to Developmental and Epileptic Encephalopathy edge, evidenced by PMID:39237642.

    3. Orphaned mechanistic hypothesis. mechanistic_hypotheses declared eidee_epileptic_component_reversibility but no downstream edge opted into it via hypothesis_groups. The seizures-to-DEE edge now carries that hypothesis group, which is the edge whose strength the hypothesis contests.

    4. Three of five differential_diagnoses carried no disease_term. Bound EIMFS to MONDO:0100025, self-limited familial neonatal epilepsy to MONDO:0100023, pyridoxine-dependent epilepsy to MONDO:0009945. The prior rationale was internally inconsistent: Dravet and West syndrome are also separately curated yet were bound.

    5. PMID:35765990 evidence_source was OTHER on the stated grounds of being a review article; it is a network meta-analysis of randomised trials in children, so retagged HUMAN_CLINICAL.

    REVIEWER FINDINGS ADDRESSED:
    - IMPORTANT (MRI phenotype term narrower than its frequency band): HP:0002536 Abnormal cortical gyration replaced with HP:0012443 Abnormal brain morphology, keeping FREQUENT. Independently reached the same conclusion before reading the review.
    - Suggestion 1 (X-linked inheritance evidence): PMID:22565167 downgraded SUPPORT to PARTIAL, with an explanation stating that the snippet names neither the X-linked mode nor EIDEE.
    - Suggestion 2 (trigger node biological_scale): NOT changed; a node-level notes block documents why. Genetic (50 percent) plus metabolic (14 percent) etiologies dominate the 19 percent structural arm, and EIDEE is by ILAE definition an etiologically heterogeneous final common phenotype, so a single heterogeneous entry-point node is the right model. Recorded as a disclosed compromise rather than silently left.
    - Suggestion 3 (unsourced parental-mosaicism claim): added PMID:39237642 evidence quantifying the 8 percent parental low-level mosaicism rate.
    - Suggestion 4 (non-blocking research omissions): not addressed; left for a follow-up curation pass.

    VALIDATION: just validate, just validate-terms and just validate-references all pass. 98/98 snippets verified against cached references. Weighted compliance 88.8 to 89.0 percent.

  summary: 'Create: Early-Infantile Developmental and Epileptic Encephalopathy'
  details: |
    De novo creation of the ILAE 2022 EIDEE syndrome entry (MONDO:0800491) - the
    reclassification that subsumes Ohtahara syndrome and early myoclonic
    encephalopathy into a single age-at-onset electroclinical syndrome. Closes
    issue #7467 (tracker #1079).

    Deep research: Edison/Falcon via `just research-disorder falcon`. Run took
    413 s and returned 21 citations plus one artifact; the report, its
    `.citations.md` sidecar and the artifact directory are committed under
    `research/`. Falcon output was treated as leads only.

    Named Entity Confusion preflight (required - this target is high NEC risk
    because "Ohtahara syndrome", "EIEE", "early myoclonic encephalopathy" and
    the numbered DEE1..DEEn OMIM series are near neighbours). Ran
    `runoak -i sqlite:obo:mondo info MONDO:0800491 -O obo`: the MONDO record
    carries "Ohtahara syndrome", "early myoclonic encephalopathy", "EIEE" and
    "early infantile epileptic encephalopathy" as EXACT synonyms, and its
    definition matches the ILAE onset-by-3-months concept. There is no separate
    MONDO term for Ohtahara or EME to be confused with. The Falcon report itself
    opens with a scope caution warning against conflating the umbrella syndrome
    with the gene-numbered OMIM EIEE entries. Identity confirmed - no NEC.

    GeneReviews baseline (Step 3b). No GeneReviews chapter exists for the
    syndrome itself, so the chapters for its major causal genes were used
    instead: KCNQ2-Related Disorders (PMID:20437616), STXBP1 Encephalopathy with
    Epilepsy (PMID:27905812), CDKL5 Deficiency Disorder (PMID:38603524) and
    SCN8A-Related Epilepsy and/or Neurodevelopmental Disorders (PMID:27559564).
    All four are fetched, tagged `GeneReviews` in the top-level `references`
    block, and actually mined - for phenotypes, EEG patterns, conventional and
    precision antiseizure medication, supportive care, counselling, and the
    "agents to avoid" caution around sodium-channel blockers.

    Content curated: 8 pathophysiology nodes (each with `biological_scale`), 6
    of which declare `conforms_to` against
    `epilepsy_excitation_inhibition_imbalance`; 13 phenotypes; 10 causal genes
    with per-gene `case_fractions` from the Korean burst-suppression cohort
    (PMID:32247221); 9 treatments including the precision sodium-channel-blocker
    arm and the high-yield vitamin/cofactor trial arm; 2 structured `prevalence`
    records (never the deprecated `percentage`); 3 progression phases covering
    the EIDEE to West syndrome to Lennox-Gastaut evolution; one ILAE 2022
    DIAGNOSTIC_CRITERIA definition; 5 differential diagnoses; 2 KNOWLEDGE_GAP
    discussions with proposed experiments; 1 EMERGING mechanistic hypothesis.
    96 evidence items in total.

    Boundary handling. Ohtahara syndrome and EME are curated as synonyms here
    rather than as separate entries. Dravet syndrome, Infantile Spasms, EIMFS,
    Genetic DEE, Undetermined Early-Onset Epileptic Encephalopathy and the
    gene-level DEE entries are cross-referenced and explicitly triaged in
    `notes` and `differential_diagnoses` rather than duplicated. The SCN1A
    gain-of-function non-Dravet EIDEE phenotype is recorded as a deliberate
    crossover case with the opposite drug recommendation.

    Anti-hallucination discipline. Every PMID was fetched with
    `just fetch-reference`; no `references_cache/` file was hand-written or
    hand-edited. Every snippet was verified as an exact substring of the cached
    text (96/96). Every MONDO/HP/GO/CL/UBERON/CHEBI/NCIT/hgnc term was checked
    with OAK. Notably, three ontology IDs suggested by the Falcon report were
    wrong and were discarded: HP:0010849 for burst suppression (actually "EEG
    with spike-wave complexes (>3.5 Hz)"), HP:0002069 for tonic seizure
    (actually "Bilateral tonic-clonic seizure") and HP:0002123 for myoclonic
    seizure (actually "Generalized myoclonic seizure").

    Red-team self-review against `.claude/skills/dismech-pr-review` was run
    before commit and its findings applied: the combined potassium/sodium
    channel node was split into separate "Reduced Kv7.2/Kv7.3 M-Current" and
    "Increased Persistent Sodium Current" nodes so the sodium-channel-blocker
    `target_mechanisms` edge points only at the gain-of-function arm;
    `conforms_to` was removed from the etiologically heterogeneous trigger node
    and from the disease-specific encephalopathy outcome node; a "Recurrent
    Drug-Resistant Seizures" node was added to carry the module's terminal
    conformance; the DEE Primer (PMID:39237642) was reclassified from
    HUMAN_CLINICAL to OTHER as a review article; several SUPPORT items were
    downgraded to PARTIAL where the snippet only indirectly backs the claim;
    unsourced CDKL5 onset and parental-mosaicism claims were removed; the
    CDKL5 title-only snippet was replaced with a substantive quote; the SCN8A
    GeneReviews chapter was mined rather than only tagged; the MRI phenotype
    term was broadened to HP:0012443 to match the 44% any-abnormality figure
    its FREQUENT band rests on; and the second prevalence record was
    harmonized to BIRTH_PREVALENCE so an incidence is not compared with a
    prevalence.

    Validation: `just validate` passes (schema, term validation, 96/96 snippets
    verified), `just validate-terms` passes, `just validate-references` passes,
    `just compliance` reports 88.5% global / 88.8% weighted. Mortality is
    deliberately not a `phenotypes` entry because HP:0001522 sits outside the
    PhenotypeTerm dynamic enum; it is recorded with evidence under
    `clinical_burden`, matching existing precedent in the KB.

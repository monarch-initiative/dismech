  summary: Ground CHN1/MAFB node; part of genetics-s12276 grounding fixes
  details: |
    Bound GO:0005096 GTPase activator activity (INCREASED) for CHN1 on 'CHN1 Hyperactivation and MAFB Loss Disrupt Abducens Motor Neuron Development'. CHN1 (alpha2-chimaerin) is a Rac-GAP whose Duane variants are gain-of-function. MAFB carries its own molecular function on the same node, GO:0003700 DNA-binding transcription factor activity (DECREASED): the node's description names MAFB as a transcription factor required for abducens motor neuron identity and its evidence names reduced MAFB transcription-factor function, so the binding rests on the entry's own cited evidence rather than on a GO-A annotation. Both genes are thus grounded by their own activities rather than by node proximity (review of #13265 corrected an earlier version that grounded MAFB on the CHN1 term).

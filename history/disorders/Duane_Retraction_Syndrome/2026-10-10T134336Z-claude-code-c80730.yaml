  summary: Ground CHN1/MAFB node; part of genetics-s12276 grounding fixes
  details: |
    Bound GO:0005096 GTPase activator activity (INCREASED) on 'CHN1 Hyperactivation and MAFB Loss Disrupt Abducens Motor Neuron Development'. CHN1 (alpha2-chimaerin) is a Rac-GAP whose Duane variants are gain-of-function; the binding grounds both CHN1 and MAFB, which share this node (the gate grounds a gene when any node it reaches carries a molecular function). MAFB's own bZIP transcription-factor activity has no experimental GO annotation, but it needs no separate binding since the node now carries one.

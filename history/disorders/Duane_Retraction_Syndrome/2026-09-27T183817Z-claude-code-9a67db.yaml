  summary: 'Genetics pass: DURS2 subtype row, gene and phenotype wiring'
  details: |
    Genetics pass for the series-069 row MONDO:0011444 Duane retraction syndrome 2 (CHN1).

    Row ruling: has_subtypes row. A DURS2 row now binds MONDO:0011444 with CHN1
    (hgnc:1943, read from rest.genenames.org in the same step) and cites the founding
    CHN1 report. MONDO:0011444 is a direct child of the entry's own disease_term
    MONDO:0007473, and the cross-reference note in
    Duane_Retraction_Syndrome_3_With_Or_Without_Deafness already said this entry covers
    the CHN1 form, so the parent is the right home. The two other Mendelian forms are
    separate entries (MAFB -> MONDO:0014880; SALL4 -> Duane_Radial_Ray_Syndrome,
    MONDO:0011812) and are named in notes.

    Anchor audit: disease_term MONDO:0007473 is an exact match for the entry, its four
    children are all Duane classes, and none of the entry's own Huber-type rows binds a
    CURIE, so neither the over-broad nor the reciprocal test fails. No change.

    Wiring, measured with dismech.qc_plugins before and after:
      genes wired into the pathograph 0/3 -> 2/3
      phenotypes with a causal inlink   0/10 -> 9/10
      pathophysiology nodes with no outgoing edge 1 of 4 -> 0 of 4
    CHN1 and MAFB are bound as node genes on the lesion node whose cited evidence
    already carried both. SALL4 is left unwired on purpose: of the ten references this
    entry cites, only PMID:20301369 and PMID:40212284 mention SALL4 (checked by grep
    over the cached bodies), both as a gene to test rather than as an abducens
    mechanism, and the SALL4 chain is curated at Duane_Radial_Ray_Syndrome.
    Refractive error is the one phenotype left with no inlink; the reason is in notes.

    New edges: the lesion node to Sensorineural Hearing Impairment as a parallel MAFB
    arm, abducens hypoplasia to Impaired Ocular Abduction, aberrant reinnervation to
    Impaired Ocular Adduction, and the previously dead-end co-contraction node to Duane
    Anomaly, Palpebral Fissure Narrowing and Upshoot/Downshoot. Phenotype sequelae:
    Duane Anomaly -> Strabismus -> Compensatory Abnormal Head Posture and Amblyopia,
    the last marked directness INDIRECT because GeneReviews places the amblyopia risk on
    absent binocular vision rather than on strabismus itself.

    Validation on the committed tree: just validate 0 issues; just validate-terms
    passed; just count-verified-snippets 44/44.

  summary: Address PR 17336 review feedback by adding the remaining PANS consensus
    diagnostic-criteria phenotypes, adding NSAID and therapeutic plasma exchange
    treatments with evidence caveats, rebinding laboratory infectious workup to
    NCIT:C25294, marking indirect target_mechanisms evidence, and binding MONDO:0017648

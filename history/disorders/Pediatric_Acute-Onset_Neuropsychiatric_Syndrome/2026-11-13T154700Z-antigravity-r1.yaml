  details: |
    Added the missing ancillary PANS consensus diagnostic-criteria phenotypes across categories C-G: Irritability (HP:0000737), Aggressive behavior (HP:0000718), Developmental regression (HP:0002376), Cognitive impairment / school-performance decline (HP:0100543), Tics (HP:0100033), Dysgraphia (HP:0010526), Sensory hypersensitivity (HP:5200058), Sleep disturbance (HP:0002360), and Urinary frequency / Pollakisuria (HP:0100515), wiring the neuropsychiatric and sensory-motor manifestations from the basal ganglia neuroinflammation node while keeping the criterion-G somatic signs explicitly unwired alongside Enuresis. Added Nonsteroidal Anti-inflammatory Drug Therapy (NCIT:C15986 with naproxen, ibuprofen, sulindac, and celecoxib) and Therapeutic Plasma Exchange (NCIT:C15304) with RCT/controversy caveats from PMID:39512340 and PMID:37251418, added directness: INDIRECT to treatment target_mechanisms evidence items, rebound the combined infectious/serologic workup from NCIT:C25300 to NCIT:C25294 (Laboratory Procedure), added MONDO:0017648 (Sydenham chorea) to differential_diagnoses, and corrected agent_tool in the prior history record.

  summary: 'Create: PANS, with the PR #7458 review round folded in'
  details: |
    Creation of the PANS entry, plus the review round on PR #7458 answering all seven blocking items from the two CHANGES_REQUESTED reviews of 2026-08-01 and 2026-08-08. Written as one record because no history record was ever added for the original creation, which was blocking item 6.

    Original curation: Falcon deep-research-sourced, MONDO:1060178, NEC preflight against the confusable PANDAS acronym, every snippet an exact substring of a cached abstract.

    Item 1, the wrong phenotype term. The cardinal restricted-eating phenotype was bound to HP:0002039 Anorexia, which HPO defines as loss of appetite - the semantic opposite of what the entry's own description says, namely intentional restriction driven by contamination, sensory, or choking fears. Rebound to HP:0020302 Restrictive eating, whose definition draws that distinction explicitly, and which Avoidant_Restrictive_Food_Intake_Disorder.yaml already uses in the analogous context. The reasoning is recorded on the phenotype rather than only here. The same leaf in the grouping's membership criteria was corrected to match.

    Item 3, a snippet truncated past its own claim. The phenotype "Acute-onset obsessive-compulsive behavior" was supported by a quote starting mid-sentence at "tics, anxiety, mood swings..." which listed every symptom except the obsessive-compulsive disorder the phenotype asserts. Replaced with the full source sentence from PMID:35773312, which names both the abruptness and the OCD. This validated either way, which is why it needed a human read rather than a gate.

    Item 5, a dangling causal edge. The pathophysiology node's only downstream target, "Acute-onset obsessive-compulsive and neuropsychiatric symptoms", matched no node or phenotype name in the file and would have rendered as a phantom node. Replaced with four resolving edges to the phenotypes the node's own description names - the two cardinal features plus anxiety and emotional lability - each marked INDIRECT_UNKNOWN_INTERMEDIATES.

    Item 7, eleven candidate genes in prose with no genetic block. Added genetic: with all eleven (PPM1D, SGCE, PLCG2, NLRC4, CACNA1B, SHANK3, CHEK2, GRIN2A, RAG1, GABRG2, SYNGAP1), typed relationship_type SUSCEPTIBILITY rather than CAUSATIVE because that is what the source claims: candidates from a single exome/genome study, found in 21 of 396 cases, with 12 of 21 developing PANS on a pre-existing neurodevelopmental disorder. That last figure is curated as its own evidence item so the typing is defensible from the entry rather than from this note. NLRC4 (hgnc:16412) and CACNA1B (hgnc:1389) were not in cache/hgnc/terms.csv and were resolved at rest.genenames.org. The source sentence spells CHEK2 as "CHK2", which is not an HGNC symbol; the binding is to hgnc:16627 CHEK2 and the gene record says so, since a reader of just list-gene-term-mismatches would otherwise see an unexplained symbol.

    Item 2, no treatments block. Added four records - anti-infective treatment of the identified trigger, systemic corticosteroid therapy, IVIG, and CBT with SSRIs - all sourced from the already-cached full text of the 2024 Delphi consensus PMID:39512340. That cache is content_type full_text_pdf and carries ligature corruption (the fi ligature) and broken intra-word spacing in places, so every snippet was extracted programmatically from the cache text rather than typed, and spans containing corruption were avoided. IVIG is therapeutic_modality OTHER because polyclonal pooled immunoglobulin matches none of the enum's named platforms.

    Suggestions taken: temporality ACUTE on the cardinal phenotypes; evidence added to the previously uncited Anxiety and Emotional lability phenotypes, raising phenotype evidence coverage from 1/5; NCIT:C15220 Diagnosis Assessment swapped for NCIT:C124351 Clinical Evaluation, which is used 146 times elsewhere in the KB and matches preferred_term "clinical diagnosis" better; differential_diagnoses added for Sydenham chorea, Tourette syndrome, and primary OCD; a KNOWLEDGE_GAP discussion recording the absence of any confirmatory biomarker, which bounds every mechanistic claim in the entry; biological_scale set where a scale applies.

    Suggestion declined, with the reason recorded on the node: the "Broadened diagnostic construct beyond streptococcus" node is a nosological statement and the reviewer offered to be overruled on whether it belongs in pathophysiology. It is kept there because the trigger-agnostic boundary is what separates this entry from the PANDAS one and it carries its own cited evidence, and the node's notes now say that explicitly so the next reader sees a decision rather than an oversight. It deliberately has no biological_scale and no downstream edges.

    Enuresis is deliberately left unwired, with its reason on the phenotype: the consensus lists it among supporting somatic signs and no cited source connects it to the basal ganglia process the other phenotypes hang off.

    Two dead references repaired rather than dropped. The entry cited DOI:10.2147/NDT.S362202 and DOI:10.1093/pch/pxy145, both of which cache with content_type unavailable and an empty body, so nothing could ever have been quoted from either. Both resolve to PubMed records with full text, PMID:37251418 and PMID:30996598, and are now cited in that form.

    Validation: just validate passes with 28/28 snippets verified, up from 5/5. Also run and read: validate-disorders, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-genereviews, list-gene-term-mismatches, validate-grouping, check-groupings, validate-history-all.

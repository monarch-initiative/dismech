  details: |
    Addressed the three IMPORTANT items from the dismech-pr-review on PR #6994 (curate/onchocerciasis-nodules-hanging-groin-chorioretinitis-6309): (1) split the bundled 'Adult Worm Encapsulation and Onchocercal Lymphadenitis' pathophysiology node into two atomic nodes -- 'Adult Worm Encapsulation in Subcutaneous Nodules' (adult worm -> onchocercomata) and 'Onchocercal Lymphadenitis and Lymphatic Fibrosis' (lymph node inflammation -> hanging groin); (2) fixed causal placement so the lymphadenitis node sits downstream of 'Microfilarial Skin and Ocular Infiltration' rather than adult-worm encapsulation, per PMID:4070919's statement that chronic effects of onchocerciasis are a consequence of microfilarial degeneration; (3) fixed anatomic wording from 'lymphatic vessels ... undergo histiocytic hyperplasia' to 'draining lymph nodes', since histiocytic hyperplasia/follicular atrophy are lymph-node (not vessel) features, and added UBERON locations (hypodermis; lymph node) plus biological_scale: TISSUE per reviewer suggestion. No new PMIDs were needed -- the lymphadenitis evidence snippet (PMID:4070919) was already fetched and used elsewhere in the file (Hanging Groin phenotype). Re-ran just validate (schema), just validate-terms, and the reference validator directly on kb/disorders/Onchocerciasis.yaml -- all pass. Deliberately did not run 'just validate'/'just validate-references' end-to-end for this commit because those recipes invoke 'just fix-references-cache', which reformats reference_id quoting across the entire references_cache/ directory (hundreds of unrelated files) as a side effect; ran the underlying linkml-validate/term-validator/reference-validator commands directly instead to keep this commit scoped to Onchocerciasis.yaml. Did not address the reviewer's non-blocking SUGGESTIONS (chorioretinal scarring edge, granuloma_formation module conformance, Hanging Groin category/HPO fit) -- left as optional follow-up.

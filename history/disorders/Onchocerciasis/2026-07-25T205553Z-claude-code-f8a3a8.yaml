  details: |
    Curation-scanner run against issue #6309 (parasitic disorders content-gap review). Verified the issue's previously-recommended first task (pathophysiology section, keratitis, Wolbachia/doxycycline, moxidectin) was already present on main from prior work; added the three still-missing classic phenotypes called out in the issue checklist: onchocercomata/subcutaneous nodules (HP:0001482, PMID:4070919), hanging groin/adenolymphocele (HP:0034751 Inguinal lymphadenopathy, PMID:4070919), and chorioretinitis (HP:0012424, PMID:2243684, the leading cause of onchocercal blindness). Added a new pathophysiology node (Adult Worm Encapsulation and Onchocercal Lymphadenitis) linking adult-worm nodule formation and lymphatic fibrosis to the two new dermatologic phenotypes, and linked chorioretinitis as a downstream target of both existing ocular pathophysiology nodes. All snippets verified as exact substrings of freshly fetched PubMed abstracts via just fetch-reference; just validate, validate-references, and validate-terms all pass; full pytest suite passes for this file. Did not touch the epilepsy/nodding-syndrome evidence-hedging item or the other 14 disease entries tracked in issue #6309 - left for follow-up.

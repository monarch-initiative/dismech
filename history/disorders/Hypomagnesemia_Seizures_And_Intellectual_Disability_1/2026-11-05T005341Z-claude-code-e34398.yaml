  summary: 'Create: Hypomagnesemia_Seizures_And_Intellectual_Disability_1'
  details: |
    Created the HOMGSMR1 entry anchored on MONDO:0020787 (OMIM 616418) and CNNM2 (hgnc:103). Scope: the syndromic CNNM2 disease; isolated renal hypomagnesemia 6 (HOMG6, MONDO:0013480) is a separate MONDO disease and is recorded in notes only, together with the ClinGen lumping of the two. Two subtypes (Monoallelic, Biallelic) follow the recessive-versus-dominant distinction drawn in PMID:33600043 and PMID:34604137. ClinGen Definitive (SD) recorded as gene_disease_validity from the CGGV record. The pathograph runs from CNNM2 loss-of-function variants through CBS-module Mg-ATP binding, plasma membrane trafficking and loss of CNNM2-dependent magnesium transport to impaired distal convoluted tubule reabsorption, systemic magnesium depletion, impaired neurodevelopment and neuronal hyperexcitability, reaching every phenotype except obesity, whose mechanism is unknown and is recorded as a knowledge gap. Sources: primary literature found by PubMed search plus the OpenScientist deep-research report (research/Hypomagnesemia_Seizures_And_Intellectual_Disability_1-deep-research-openscientist.md). The report resolved 22/22 references and was on topic (preflight-dr: CNNM2 63 mentions; CBS hits are the CBS domain). It gave HGNC:2020 (CLCN2) for CNNM2 three times; that identifier was not used. Report citations added from it: PMID:24706765, PMID:25184538, PMID:37532502, PMID:35170241. Not used: PMID:27856537 (flagged off topic; PRL-CNNM phosphocysteine biochemistry), PMID:30929901 (schizophrenia zebrafish atlas, not this disease), PMID:38871680 and PMID:26446763 (general magnesium reviews), PMID:32369769 (TRPM6 disease), PMID:41869998, PMID:36941847, PMID:35818515 and PMID:34515155 (other causes of hypomagnesemia or single case management reports), and the report's gnomAD constraint figures, which have no citable source. NCIT:C29236 in the report is obsolete and was not bound. A diagnosis section covers serum magnesium, fractional magnesium excretion, CNNM2 molecular testing, brain MRI and EEG, with NCIT terms looked up in OLS (Serum Magnesium Measurement and Fractional Excretion of Magnesium were confirmed under NCIT:C25218). No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (all snippets verified) and the offline gate list passed; validate-disorders run before commit.

  summary: Fix inverted RP phenotype export; add diagnosis, treatments, differential
    and model mismatch
  details: |
    Correction round on PR #9678 in response to two review rounds. The blocking inversion is fixed, along with every item restated in the second round.

    The inverted phenotype export was the serious one and the reviewer traced it correctly. "Absence of Retinitis Pigmentosa" carried phenotype_term: HP:0000510 and frequency: VERY_FREQUENT. kgx_export.py reads phenotype_term and frequency and never reads supports, so the exported triple asserted that 80-99% of DFNA11 patients have rod-cone dystrophy - the precise opposite of the entry's headline claim, and the most harmful edge this entry could emit given that MYO7A is the commonest Usher type 1 gene. The REFUTE grading on the evidence item is claim-relative and cannot reach the phenotype assertion. Fixed by following Amyotrophic_Lateral_Sclerosis_27_Juvenile: no phenotype_term, no frequency, diagnostic: true, and the reasoning written into the description so the omission is not later mistaken for an oversight and repaired back into a wrong assertion.

    GO:0051015 actin filament binding was on a node about motor activation. Rebound to GO:0000146 microfilament motor activity, which is what the node's own notes argue about. The GAIN_OF_FUNCTION modifier is unchanged.

    PMID:32350269 is now cited three times on Progressive Stereocilia Dysfunction, which previously rested on two OTHER-graded sentences from a cohort paper's introduction, one carrying an inline reference marker. The primary paper supplies the electrophysiology - reduced resting open probability and slowed MET current onset - and the temporal claim the node makes, that hair cells develop normally and then degenerate. Its "conclusive evidence is lacking" sentence is also quoted, graded PARTIAL, as the honest characterisation of what the two review sentences were asserting before this study existed.

    The pathograph was open-ended. Progressive Stereocilia Dysfunction now carries three downstream edges to the auditory and vestibular phenotypes.

    prevalence: a second record adds the dominant-specific figure from PMID:35453549 - MYO7A variants in 4.7% of postlingual families - and the first record's note no longer claims no DFNA11-specific rate exists. Both are graded PARTIAL with the ascertainment caveat stated: these are proportions within cohorts already selected for hearing loss, not population rates.

    genetic: the domain-based genotype-phenotype correlation is added - dominant variants cluster in motor and MyTH4 domains, motor-domain missense gives later onset with an ascending audiogram, tail-domain variants give a severe phenotype. This is the finer-grained form of the entry's own allele-type thesis. The tail-domain item is graded PARTIAL because tail-domain variants are not confined to the dominant phenotype.

    diagnosis: added with two entries. The ophthalmologic assessment entry is the procedural basis of the absence-of-RP claim and states why it is a longitudinal commitment rather than a single test. The DPOAE entry records that outer hair cell function can be abnormal before thresholds move, which matters because it means a normal audiogram in an at-risk relative does not establish an unaffected cochlea.

    treatments: added. Hearing amplification carries no NCIT binding, deliberately - NCIT's hearing-aid and cochlear-implant concepts are device terms not reachable from NCIT:C25218, and there is no clinical-action term for fitting or implantation, so a free-text preferred_term is correct under the ontology contract. Its evidence is graded PARTIAL and labelled as class-level: PMID:37371710 is a narrative review of autosomal dominant nonsyndromic hearing loss as a group, and no DFNA11-specific treatment study exists in the cache.

    progression: added from PMID:32097363, including a PARTIAL item quoting normal vestibular function in that family. That conflicts with the caloric abnormalities curated in the vestibular phenotype from another family, and is quoted rather than omitted because an entry carrying only the positive finding would overstate vestibular involvement.

    The GeneReviews question the reviewer raised turned out to matter. The reviewer suspected the research artifact's citation of a "MYO7A-Related Hearing Loss and Retinitis Pigmentosa" chapter was a confabulation. It is - no such chapter exists. But the check surfaced two real chapters the entry should have had: Usher Syndrome Type I (PMID:20301442) and Genetic Hearing Loss Overview (PMID:20301607). The original claim that no DFNA11 chapter exists remains true, but "no DFNA11 chapter" was the wrong question to have asked, because the USH1 chapter documents the differential this entry is built on. It is now fetched, tagged GeneReviews in a new top-level references block, and mined into a differential_diagnoses entry for Usher syndrome type 1B - including the fact that RP in USH1 develops in early adolescence, which is what makes a normal childhood retinal examination non-exclusionary and justifies the longitudinal recommendation in diagnosis.

    A HUMAN_MODEL_MISMATCH discussion is added, as suggested. Every in vivo MYO7A model is a deletion, so they model the recessive and Usher end of the allelic series; the activation claim rests on a cultured kidney epithelial cell assay. The discussion states the consequence concretely: the proposed mechanism predicts a therapy restoring autoinhibition would help in DFNA11 and be useless or harmful in DFNB2 and USH1B, and no in vivo system currently exists in which that could be tested.

    Not done: PMID:9354784, the 1997 discovery paper, has no retrievable content in its cached record, so nothing can be quoted from it. experimental_models: for the epithelial targeting assay is not added - the assay is now cited in the mismatch discussion where its heterologous nature is the point, and modelling it as an ExperimentalModel with modeled_mechanisms would assert a fidelity relationship the paper does not support.

    Validation: just validate-disorders passes, 53/53 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length.

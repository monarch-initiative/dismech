  summary: 'Round-4 review: fix drifted title, duplicate evidence item, fragment snippet'
  details: |
    Fixed the three defects from the round-4 review on PR #9678. All three were mine, all
    three were introduced by the last two commits, and all three were verified against the
    cache before fixing.

    1. reference_title for PMID:23383098 did not match the cache. Three occurrences read
    "...in a family with autosomal dominant nonsyndromic hearing loss." The title: frontmatter
    in references_cache/PMID_23383098.md reads "...in a family with autosomal dominant hearing
    impairment (DFNA11)." I wrote it from the sense of the paper rather than copying it, which
    is exactly what the title field exists to prevent: a drifted title is indistinguishable
    from a fabricated citation in a diff, so a reviewer has to open the cache to tell them
    apart. Copied verbatim.

    2. Duplicate evidence item in genetic[0].evidence. The PMID:38594301 snippet "Among the
    autosomal recessive cases, all patients had at least one missense variant." appeared
    twice, once with no explanation. Introduced in ec4995005 while the domain-correlation
    items were being inserted. Nothing in the validation stack catches a duplicated evidence
    item - schema validation, snippet verification and check-duplicate-keys all pass with it
    present, because it is a repeated list element rather than a repeated mapping key. Deleted
    the copy without the explanation. Snippet count drops 57 to 56, which is the duplicate
    leaving.

    3. The p.R668H segregation snippet was a fragment missing its subject. It read "is
    heterozygous in all affected family members and absent in 100 healthy individuals", which
    on a variant-level entry does not say which variant is heterozygous. I had truncated it to
    avoid the Unicode arrow in the source; the arrow verifies fine as an exact substring.
    Extended to the full sentence: "A c.2003G-arrow-A (p.R668H) mutation of the MYO7A, is
    heterozygous in all affected family members and absent in 100 healthy individuals." Note
    the cache carries this sentence twice, once as "the MYO7A" and once as "theMYO7A" with the
    space missing; the well-formed copy is the one quoted.

    Not done: the two non-blocking suggestions. The POINT_PREVALENCE records are a
    PrevalenceMeasureEnum limitation the notes are already candid about, and citing
    PMID:24698764 in the HUMAN_MODEL_MISMATCH discussion was considered and set aside in the
    previous pass because that zebrafish model is a biallelic null of USH1B, a different
    disease in the allelic series.

    Validation: just validate (56/56 snippets verified, down from 57 as the duplicate left),
    check-entity-refs, check-duplicate-keys, validate-terms, tests/test_reference_titles.py
    (38 passed), check-snippet-grading, check-snippet-length, check-title-snippets,
    check-folded-hyphens all pass.

  summary: Record ClinGen Definitive validity for MYO7A and correct the variant-domain
    statement
  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for MYO7A (Definitive, autosomal dominant, 2018-03-19), filed by the panel under MONDO:0019497, which the entry now maps as skos:broadMatch. Set variant_origin GERMLINE. The initiating variant node said dominant alleles fall in the motor domain and the IQ motifs, while the entry's own cited series reports clustering in the motor and MyTH4 domains; the description now states both and the node cites that series. A review of the MYO7A GO annotations also noted that motor-domain alleles are not IQ lesions and that the stereocilia step rests on loss-of-function mouse data; the entry already states the IQ de-repression account as an interpretation, so the chain was not restructured. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

  summary: Rewrite the stale GO notes, split implantation from amplification, restore
    truncated snippets
  details: |
    Third correction round on PR #9678. All three remaining review findings were correct and all three were mine.

    The activation node's notes still argued about the term they replaced. The previous round rebound the node from actin filament binding (GO:0051015) to microfilament motor activity (GO:0000146), but left the notes saying "The GO binding is actin filament binding" and arguing about whether binding is quantitatively increased. So the file contradicted itself, and the argument read against the wrong concept - the entire point of the swap was that the claim concerns motor activity rather than binding. This is the same failure mode as the Optic Atrophy frequency field on PR #9674 in this same session: the reasoning gets rewritten in one place and the thing it describes in another, and the two drift. The notes are now rewritten with the term, and record what the binding was and why it was wrong, so the rebinding is legible rather than looking like churn.

    The treatment section wrongly generalised a real constraint. It carried one entry, "Hearing Amplification and Cochlear Implantation", with a note claiming NCIT has no clinical-action term for either fitting or implantation. The first half is true - NCIT:C183182 Hearing Aid is a device concept and is not reachable from NCIT:C25218 - but the second half is false, and both sibling entries prove it: Autosomal_Dominant_Nonsyndromic_Hearing_Loss_17 and MYO6_Hearing_Loss both bind cochlear implantation to NCIT:C15329 Surgical Procedure. Implantation is a procedure, and procedures bind; the device does not. Lumping the two treatments together let the amplification gap be generalised into a claim about implantation that was not checked.

    Split into two treatments. Hearing Amplification keeps the free-text preferred_term with the note now scoped to amplification specifically and pointing at the implantation entry so the distinction is not lost again. Cochlear Implantation takes NCIT:C15329. Both carry target_phenotypes, which also closes the treatment join point the pathograph was missing. The implantation entry's evidence is graded PARTIAL and labelled group-level, because no DFNA11-specific implantation outcome exists anywhere in the cache - the entry records the intervention without claiming an outcome for this genotype.

    The two GeneReviews snippets were truncated for a reason that does not exist, and the correction matters beyond this entry. Both stopped mid-clause with an explanation blaming a line break in the cached chapter. The reviewer pointed at Usher_Syndrome.yaml quoting the same cache file across the same kind of break and passing CI. Tested directly: both full sentences verify, 54/54.

    The underlying mistake is a real distinction I had collapsed. The reference validator normalises clean line wraps, so a sentence wrapped mid-word-boundary can be quoted whole. It cannot bridge hyphenated word splits, where a two-column PDF extraction breaks a word as "chromo-\nbarrel" - which is what forced the mid-word truncations in the KAT8 entry earlier in this session. Having hit the hyphenation case first, I generalised it to all line breaks and then wrote that false constraint into an explanation, where it would have taught the next curator to truncate unnecessarily.

    The truncation cost real content in both cases. The first snippet was cited as "the USH1 triad" but stopped before the third element, adolescent-onset retinitis pigmentosa - the one element that matters for this differential. The second was cited for RP timing but was a fragment whose subject sat in the previous sentence, so as stored it did not say what develops in early adolescence. Both are now full sentences and the explanations say what they carry rather than apologising for what they omit.

    Validation: just validate-disorders passes, 54/54 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length, check-title-snippets.

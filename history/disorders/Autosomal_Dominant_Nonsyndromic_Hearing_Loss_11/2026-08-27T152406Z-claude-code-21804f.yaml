  details: |
    De novo curation of MYO7A-related autosomal dominant nonsyndromic hearing loss, DFNA11 (MONDO:0011032), from the claim in issue #9626.

    Deep research: claude_code provider, needs_review: true - 10/10 references resolved but 0 of 1 quotes validated, on PMID:32097363, and 7/10 on topic. That PMID is not cited in this entry, so unlike #9623 and #9624 the failure does not touch curated content. Running tally for this session: three of five claude_code reports failed quote validation (#9623, #9624, #9626); two were clean (#9625, and the earlier cblE and HSP49 runs). No quoted material was taken from any report; every snippet here was read from the cached abstract or full text. Falcon/Edison remained unavailable (HTTP 402) throughout. No GeneReviews chapter for DFNA11 specifically.

    Four-node pathograph: heterozygous MYO7A missense variant to loss of IQ-motif autoregulation to constitutive myosin VIIa motor activation to progressive stereocilia dysfunction.

    The organising claim is that MYO7A is an allelic series in which allele TYPE, not severity, selects the disease - and that this is supported by two independent kinds of evidence. Genetically, a 10,042-patient cohort found that every dominant-case variant was missense or in-frame deletion while nearly half of Usher patients carried biallelic nulls; so dominant disease is not haploinsufficiency. Mechanistically, many DFNA11 alleles activate Myo7A motor-dependent targeting in cultured cells (PMID:39345484), which the authors offer as the explanation for dominance.

    Judgement calls a reviewer should check:
    - The pathophysiology node "Loss of IQ-Motif Autoregulation" proposes that calmodulin occupancy of the IQ motifs is the brake DFNA11 alleles release, reconciling PMID:39345484 with PMID:15300860. The node description states plainly that the 2004 authors interpreted their own result as impaired adaptation rather than de-repression, and that the unified reading is an interpretation across two papers rather than a claim either makes. Their interpretation is also curated as its own PARTIAL-graded evidence item, so the alternative reading is in the record and not just in a caveat sentence.
    - The Constitutive Myosin VIIa Motor Activation node uses modifier GAIN_OF_FUNCTION on GO:0051015 rather than INCREASED, with a notes field giving the CLAUDE.md reasoning: the claim is qualitative escape from regulatory constraint, not a quantitative rise.
    - "Absence of Retinitis Pigmentosa" is curated as a phenotype whose primary evidence item is graded REFUTE, because the asserted claim is the absence of retinal degeneration. It is bound to HP:0000510 (Rod-cone dystrophy), with a notes field explaining both choices. This is the single most consequential fact for a newly diagnosed DFNA11 family, given that MYO7A is the commonest Usher type 1 gene, so it is curated explicitly rather than left as an omission.
    - The prevalence record is graded PARTIAL and its notes state what the 1.36% figure is not: it covers all three MYO7A phenotypes together and is a proportion within an ascertained hearing loss cohort, not a population rate for DFNA11.
    - The high-frequency phenotype carries a PARTIAL item quoting a pedigree whose loss begins at low and mid frequencies, qualifying rather than supporting the typical configuration.

    Two KNOWLEDGE_GAP discussions. The first asks whether allele class can be used prospectively, and identifies the specific missing experiment: nobody appears to have run recessive missense alleles through the same activation assay, which is the comparison that would turn a correlation into a predictor for a novel variant in an isolated case. The second covers the unmapped intrafamilial modifier, including the negative result that ATP2B2 and WFS1 SNPs did not segregate with severity, graded REFUTE.

    Validation: just validate-disorders passes (schema, terms, references), 32/32 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

  summary: Curate the p.R668H counterexample to the activation account
  details: |
    Cited two references that had been fetched into the cache and left unused.

    PMID:23383098 is the substantive one. It reports a dominant DFNA11 family carrying the
    motor-domain allele p.R668H, and measures its actin-activated ATPase activity as reduced
    rather than raised. That cuts against the gain-of-function account the entry presents as
    its leading mechanism, so it is curated as a third variant entry and as PARTIAL-graded
    evidence in the myo7a_allele_type_determines_disease discussion - which had already
    identified an untested dominant allele as the missing case. The discussion rationale now
    states why the two results are not strictly contradictory (ATPase turnover in a
    recombinant enzyme assay and motor-dependent targeting in a cell are different
    quantities) while noting that nobody has run both assays on the same allele, so the
    reconciliation is a hypothesis. The description was softened accordingly: activation is
    now described as the leading explanation rather than the explanation.

    PMID:9354784 (Liu 1997) is the paper that defined the locus. PubMed holds no abstract for
    it - it is a Nature Genetics Letter and the cache records content_type: unavailable - so
    it cannot carry an evidence snippet. Recorded in the top-level references: list, with the
    1997 origin stated in the description.

    Left uncited deliberately: PMID:24698764 (myo7aa zebrafish) models USH1B, a different
    disease in the allelic series; PMID:27525485 (PDZD7-MYO7A ankle-link complex) is
    stereocilia biochemistry that no claim in this entry rests on.


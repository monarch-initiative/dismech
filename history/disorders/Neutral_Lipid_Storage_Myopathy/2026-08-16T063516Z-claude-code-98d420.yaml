  summary: Add ICIMD and Harrison's classifications plus creatine kinase NCIT binding
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + NEUROLOGIC, and icimd_category 'glycerolipid_metabolism' (ICIMD group 'Disorders of glycerolipid metabolism' under category 'Disorders of lipid metabolism'; Ferreira et al. 2021, PMID:33340416). The notes record two deliberate non-assignments: no lysosomal_storage_category (NLSDM is a cytoplasmic lipid-droplet disorder, not a lysosomal hydrolase deficiency) and not the ICIMD mitochondrial fatty acid oxidation group (the ATGL lesion is in mobilizing stored triacylglycerol, upstream of beta-oxidation). Provenance in notes rather than a fabricated evidence snippet, per the disease-classification skill. Also added a biomarker_term to the previously unbound HyperCKemia entry: NCIT:C113245 (Creatine Kinase), verified with OAK against sqlite:obo:ncit and matching the pattern already used in Emery_Dreifuss_Muscular_Dystrophy. Validated with 'just validate' - schema, term and reference validation all passed.

  summary: Curate all four criteria-set prevalence rates (review round 3)
  details: |
    Addresses an optional finding in the third ai4c-reviewer review of PR #9434. Splitting the prevalence range into DSM-5 and ICSD-3 records had removed rate_high, so the structured maximum read 20.0% where the source reports 23.6% for DSM-IV-TR - an information regression introduced by the previous round's fix. ICD-10 (9.9%) and DSM-IV-TR (23.6%) now have their own records, making the full criteria-dependence machine-readable. The DSM-IV-TR record carries a PARTIAL item recording the authors' own reading that the higher criteria-sets overestimate.

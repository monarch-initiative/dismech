  summary: Add prevalence, diagnosis and genetic sections (review follow-up)
  details: |
    Addresses a minor finding in the ai4c-reviewer review of PR #9434. Adds a criteria-stratified prevalence record from the Tromso Study (PMID:38718598; DSM-5 8.5% to DSM-IV-TR 23.6% in one 21,083-person cohort, the spread driven by whether daytime impairment is required), a diagnosis section recording that the diagnosis is clinical and that polysomnography is an exclusion tool, and a genetic block curating the polygenic architecture (202 loci, 2.6% of variance) without naming a causal gene, since none is established.

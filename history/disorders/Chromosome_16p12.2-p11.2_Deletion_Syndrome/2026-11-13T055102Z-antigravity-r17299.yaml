  summary: Separate Impaired Neurodevelopment node from somatic phenotypes, restore
    Recurrent Otitis Media FREQUENT alongside Chronic Otitis Media, and add 17 Orphanet
    HPO phenotypes
  details: |
    Moved neuron (CL:0000540), brain (UBERON:0000955), and nervous system development (GO:0007399) off Haploinsufficiency Across a Gene-Dense Interval onto a downstream Impaired Neurodevelopment node feeding only CNS/behavioral phenotypes, while routing somatic developmental phenotypes directly from the interval haploinsufficiency node. Restored Recurrent Otitis Media (HP:0000403) to FREQUENT and added Chronic Otitis Media (HP:0000389, VERY_FREQUENT) as a separate entry, dropped the truncated 5-word PMID:17704777 fragment from Intellectual Disability, added all 12 missing Frequent and 5 clinically substantive Occasional ORPHA:261211 phenotypes, trimmed unsourced balanced-rearrangement/mosaicism prose from Genetic Counseling, and linked Tricuspid regurgitation (HP:0005180) on Multidisciplinary Supportive Care.

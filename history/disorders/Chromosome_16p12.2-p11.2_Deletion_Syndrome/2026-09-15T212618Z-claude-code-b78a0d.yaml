  summary: 'Create: chromosome 16p12.2-p11.2 deletion syndrome'
  details: |
    De novo curation of MONDO:0013320 from a Perplexity sonar-deep-research report (research/Chromosome_16p12.2-p11.2_Deletion_Syndrome-deep-research-perplexity.md). Report preflight (just preflight-dr) returned SKIP because MONDO records no causal gene for a contiguous-gene deletion; the OMIM cross-check matched (613604), and the manual entity check was done against the reference list instead. That check found the report mixes three adjacent 16p CNVs: of its six validated references, PMID:25719193 is the GeneReviews chapter for the small recurrent 16p12.2 deletion, PMID:27848943 is a clinical utility gene card for the same small deletion, and PMID:22234155 is primarily about the reciprocal 16p11.2p12.2 duplication. The report's reference validation reported 6 of 6 resolved and 6 of 6 on topic with 0 off topic, which is what a vocabulary-based relevance check will say about papers on adjacent CNVs of the same cytoband. Only the three references that are about this interval are cited: PMIDs 17704777, 19676056, 24259393. Pathophysiology is three nodes - NAHR between flanking segmental duplications, constitutional heterozygous loss of the interval, and haploinsufficiency across a gene-dense interval - and stops there because that is where the evidence stops. Gene-to-feature attribution is recorded as a KNOWLEDGE_GAP discussion attached to the haploinsufficiency node rather than filled with SH2B1, KCTD13 and TBX6, which were characterised in the smaller nested 16p11.2 CNVs; obesity, congenital heart disease, short stature and vertebral anomalies were left out for the same reason. The 500-600 kb recurrent 16p11.2 deletion is recorded as a differential with the published sentence distinguishing the two. Validated: just validate-disorders (schema, terms and references, batched) passed, 15/15 snippets verified, check-entity-refs, check-causal-targets and check-duplicate-keys all OK. One snippet initially failed on a bracketed OMIM citation marker and was retrimmed to a bracket-free span.

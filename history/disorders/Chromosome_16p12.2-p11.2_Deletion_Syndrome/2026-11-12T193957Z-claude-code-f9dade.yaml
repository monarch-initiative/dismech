  summary: Enriched 7.1-8.7 Mb 16p12.2-p11.2 deletion entry with ORPHA:261211 assertion,
    16 wired HPO phenotypes, CMA diagnosis, and supportive treatments
  details: |
    Added MONDO exact synonyms, ORPHA:261211 external assertion (exact match to MONDO:0013320 and OMIM:613604), Orphanet point prevalence (<1/1,000,000), Sporadic inheritance binding (HP:0003745), and classifications evidence. Grounded pathophysiology with homologous recombination (GO:0035825) and brain (UBERON:0000955) and wired bare-name downstream edges to all 16 phenotypes. Expanded phenotypes from 5 to 16 (adding Moderate intellectual disability with canonical HPO label, Hypotonia, Impaired pain sensation, Downslanted palpebral fissures, Low-set ears, Microretrognathia, Gastroesophageal reflux, Intrauterine growth retardation, Short stature, Hearing impairment, and Tricuspid regurgitation) while preserving the strict Named Entity Confusion boundary against smaller nested 16p11.2 and 16p12.2 CNVs. Added Array-based Comparative Genomic Hybridization diagnosis (NCIT:C198497), four supportive/counseling treatments, and differential diagnosis evidence.

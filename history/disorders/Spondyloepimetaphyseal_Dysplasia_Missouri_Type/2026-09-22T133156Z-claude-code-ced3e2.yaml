  summary: 'Round 2 review response: epiphyseal phenotype contradicted its own source'
  details: |
    Answered round 2 of automated review. Two blocking items and all three suggestions.

    Blocker A, and the substantive one. Round 1 asked for an epiphyseal phenotype and I added Enlarged epiphyses, bound to HP:0010580 from PMID:40514045 - a recessive Spahr-type case - on the framing that it is shared MMP13-related skeletal pathology. That framing is defensible when the dominant source is silent, which is why the coxa vara node is fine; it is not defensible here, because this disorder's own founding study says the opposite of the same structure. PMID:16167086 says "The epiphyses are small and flat" and characterises the disorder as having "mild epiphyseal involvement" against moderate-to-severe metaphyseal change. The file was asserting enlarged epiphyses while quoting a paper saying they are small. Replaced with a Small epiphyses node bound to HP:0010585 and evidenced from the founding study, with both sentences quoted. The recessive observation is not carried here.

    Blocker B. A diagnosis evidence explanation claimed the cached record renders the MMP13 gene symbol as a link and therefore truncates the sentence. It does not - references_cache/PMID_40514045.md carries the sentence contiguously. The snippet is now the full sentence and the false clause is deleted. A false claim about a source is worse than the lost specificity, because it tells the next reviewer not to re-check the thing that would catch it.

    Suggestions. The vertebral phenotype is split in two, because the finding changes rather than persists: Pear-shaped vertebrae in childhood, kept at HP:0003468 with the shape in preferred_term since HPO has no pear-shaped vertebra term, and Platyspondyly in adults bound to HP:0000926 with the evolution sentence as its evidence. The recurrence-risk snippet was a bare fragment that cleared the length gate without naming what gives them; replaced with the whole sentence. A cross-reference saying "As with Coxa vara below" pointed upward; it went with the block it was in.

    Wiring: splitting the vertebral node and rebinding the epiphyseal one left three skeletal phenotypes isolated, so both are now wired from Delayed Exit of Chondrocytes From the Growth Plate with INDIRECT_UNKNOWN_INTERMEDIATES edges - the vertebral body grows from endplate growth plates and epiphyseal size from the secondary ossification centre, both cartilage cleared by the same collagenase step, but no source here shows either growth plate in this disorder. 7/8 connected. Platyspondyly stays unconnected because its upstream is the childhood pear-shaped vertebra node, and that is one finding evolving rather than one node causing another.

    Round 1 of this review also supplied HP:0010585 under the label "Abnormal epiphysis morphology". The CURIE is real and the label is wrong - it is Small epiphyses - which is why the round-1 response recorded the check rather than pasting it. In round 2 the same identifier turns out to be the right binding after all, for a reason nothing to do with the label: the founding study reports small epiphyses.

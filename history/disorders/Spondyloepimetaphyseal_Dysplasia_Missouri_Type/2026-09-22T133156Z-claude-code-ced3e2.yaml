  summary: 'Create: Spondyloepimetaphyseal Dysplasia Missouri Type (MONDO:0011198)'
  details: |
    De novo curation of SEMD Missouri type / metaphyseal anadysplasia 1 (MONDO:0011198), claimed in #12505.

    entry_type decision: DISEASE. MONDO:0011198 carries both historical names for one concept, and PMID:42069302 states directly that metaphyseal anadysplasia 1 includes SEMD Missouri type. The ISDS 2023 dyadic scheme splits MMP13-related metaphyseal dysplasia by inheritance into two entities, not by these two names into three. The recessive MMP13 disease (Spahr type) is a separate MONDO concept and is recorded as a differential diagnosis rather than as a subtype here.

    Pathograph: six nodes from propeptide misfolding through premature intracellular autoactivation and autodegradation, to a deficiency of secreted active collagenase-3, failure of growth-plate matrix degradation, delayed chondrocyte exit, and abnormal metaphyseal modelling. The mouse Mmp13-null time course (worsens to five weeks, resolves by twelve) is recorded as the correlate of the transient human radiographic picture, and the persistent trabecular bone increase is recorded as a separate readout so that 'resolves with age' is not read as leaving no trace.

    Evidence: 29 snippets, all verified against cached references. Seven references fetched with just fetch-reference. Two evidence items carry quote_role BACKGROUND where the quoted sentence is the citing paper's framing of the nosology rather than its own finding.

    Recorded knowledge gap: whether the dominant MMP13 missense product acts as a simple haploinsufficiency or as a dominant negative that also suppresses MMP9. The dominant-negative reading is in the literature but is stated as background in the papers cited here and was not measured by the founding study's cell assay; the two readings predict different phenotypes for an incidental truncating MMP13 variant.

    Validation: just validate, just validate-terms, just count-verified-snippets (29/29), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-genereviews (NO_CHAPTER, verified offline against the committed Bookshelf index).

    Deep research reconciliation. The committed OpenScientist report corroborated the
    recorded knowledge gap - it lists "dominant-negative model not fully proven in vivo"
    among its own limitations - and contributed the MMP13/MMP14 redundancy reference.
    Two of its claims were checked and NOT adopted, and both are recorded in the entry's
    notes so a reader of the committed report sees the correction.

    First, its mechanistic diagram attributes the transient course to MMP14 compensating
    for missing MMP13. Its own cited source, PMID:42142773, states the opposite
    direction - MMP13 partly compensates for MMP14. The redundancy is real and is now
    cited with the direction stated correctly and the inference marked INDIRECT.

    Second, its NCIT treatment-term suggestions resolve to unrelated concepts:
    NCIT:C15682 offered as Physical Therapy is Dose-Rate, NCIT:C15277 as Supportive Care
    is Mastectomy, NCIT:C15311 as Genetic Counseling is Quality Control. The report's own
    Term Validation section catches all three. The entry uses the codes from
    cache/ncit/terms.csv instead.

    Also added to notes: MMP13 inhibitors and MMP13-lowering siRNA, in preclinical
    development for osteoarthritis, are contraindicated in principle here because this
    disease is a deficiency of the same enzyme. Recorded as reasoning, not as a treatment
    record, because no cited publication states it.

    Review round 1 (PR #12513). Three IMPORTANT items taken, five suggestions taken.

    Two phenotypes added for the two body parts in the disease's name that had none:
    abnormal vertebral morphology (HP:0003468) and enlarged epiphyses (HP:0010580).
    Both supporting quotes were already verified in this entry, attached to other
    records - the vertebral one to inheritance and a pathophysiology node, the
    epiphyseal one to Coxa vara, where it was the first clause of a sentence being used
    only for its last clause.

    Molecular testing added to diagnosis. Variant location within MMP13 carries the
    dominant/recessive information, so sequencing is not merely confirmatory.

    p.Met71Thr curated as the third propeptide variant; metaphyseal anadysplasia type 2
    (MMP9) added as a differential, argued from this entry's own MMP9 synergy node
    rather than from adjacency; prevalence recorded as CASES_IN_LITERATURE with an
    ULTRA_RARE tier and no invented rate; CHILDHOOD onset on the two transient
    radiographic phenotypes; and the stale notes sentence about which NCIT codes the
    treatments use corrected to name C16186 rather than C15302.

    One reviewer-supplied CURIE was replaced. HP:0010585 was offered as "Abnormal
    epiphysis morphology"; it is Small epiphyses, the opposite of the source's "mildly
    enlarged epiphyses". Recorded in notes.


- type: REVIEW
  outcome: changed
  sections:

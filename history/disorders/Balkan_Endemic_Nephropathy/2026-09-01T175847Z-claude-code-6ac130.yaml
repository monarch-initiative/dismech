  summary: Create Balkan Endemic Nephropathy with partial conformance to drug_induced_nephrotoxicity
  details: |
    New entry for the aristolochic acid nephropathy of the Danube basin, absent from the KB.

    The modelling turns on one lesion branching into two diseases. Aristolactam-DNA adducts do double duty: they are the biomarker that established causation, having been found in the renal cortex of affected patients and not in other chronic renal disease, and they are themselves the mutagenic lesion producing the A:T to T:A transversion signature that drives upper urinary tract urothelial carcinoma. The graph therefore branches from a single adduct node into a tubular-fibrosis arm and a carcinogenesis arm, rather than treating the cancer as a complication of the fibrosis.

    Two deliberate honesty notes. First, PARTIAL CONFORMANCE: the drug_induced_nephrotoxicity module models a dose-dependent ACUTE tubular necrosis arc ending in acute kidney injury. This disease shares the proximal tubular target and the cell-death step but not the time course - chronic low-level dietary exposure over years, ending in progressive fibrosis and end-stage renal disease. The entry conforms at the uptake and cell-death nodes and deliberately does NOT declare conformance to the module's Acute Kidney Injury effector, because that would assert a time course this disease does not have. Second, the module's trigger names a nephrotoxic DRUG while the agent here is a dietary phytotoxin; the conformance is asserted on the shared mechanism of proximal tubular uptake concentrating a nephrotoxin, with the Belgian herbal-slimming outbreak noted as the case sitting between the two framings.

    The environmental entry records the epidemiological signature that identified the exposure: focal village-level clustering with a familial but not inherited pattern, which is what a shared grain supply looks like and what distinguished this from a genetic nephropathy.

    The exposure binds substance-level ECTO:0000231, with a note recording that no aristolochic-acid-specific class is resolvable through the repository's ECTO adapter and that a term resolving in OLS would not be sufficient.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (8/8), just check-duplicate-keys, and a graph build showing 4 edges with no integrity issues. All evidence independently sourced and pre-verified against the local cache; reference_title values generated from cache rather than typed.

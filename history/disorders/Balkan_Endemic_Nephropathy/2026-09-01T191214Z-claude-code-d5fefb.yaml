  details: |
    Append-only record for the review cycle on PR 10418. The CREATE record for this entry reports 4 edges and 8/8 snippets, which described the entry as first opened; it is now 13 edges and 23 snippets, and that record is left untouched.

    Node splits. A:T to T:A Transversion Signature and Urothelial Carcinogenesis carried a MOLECULAR scale while asserting tissue-level carcinogenesis, which is the two-scale-values tell for a bundled node. It is now a signature node feeding a separate Upper Urinary Tract Urothelial Carcinoma node at TISSUE scale. Proximal Tubular Epithelial Cell Death and Interstitial Fibrosis was likewise split, with the fibrosis node carrying the slow time course the partial-conformance argument rests on.

    Clinical layer. Five phenotypes: chronic kidney disease, low-molecular-weight proteinuria, anaemia, upper tract urothelial carcinoma and end-stage renal disease. The carcinoma was previously modelled only as a mechanism node, so the entry's headline finding was not a curated manifestation. The proteinuria binding was moved from HP:0000093 to the specific HP:0003126, since the preferred_term workaround is for when no precise term exists and one did.

    Management. Four treatments, three of them disease-specific rather than generic CKD care: prophylactic bilateral nephroureterectomy BEFORE transplantation, because the urothelium carries the same adduct burden as the kidney and immunosuppression with the native tract retained is the risk; mTOR-based immunosuppression afterwards, bound to NCIT:C2201 and targeting the carcinoma node because the drug class is chosen for cancer risk rather than graft reasons; and total nephroureterectomy for established tumour. Renal replacement therapy is bound to the specific NCIT:C126400 rather than the generic Therapeutic Procedure term.

    Biochemical. Alpha-1-microglobulin as the screening marker for tubular proteinuria, and aristolactam-DNA adducts with the TP53 fingerprint mutation as the exposure-specific confirmation, which the source calls the only diagnostic finding.

    Two CI failures during the cycle. check-folded-hyphens rejected a line ending on 'Aristolactam-' inside a folded scalar, which would fold into a broken token. A diagnosis snippet also truncated mid-clause at 'pathognomonic of'; it now runs through 'pathognomonic of BEN'.

    The deep-research artifact was missing when the PR opened because the first run was backgrounded with a bare ampersand and was orphaned when its parent shell exited. Relaunched; 42 of 42 references resolved with none confabulated.

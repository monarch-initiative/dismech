  summary: Review IKBKG immunodeficiency phenotypes, allelic scope and causal pathways
  details: |
    Reviewed the complete original YAML, the complete Falcon report and citations sidecar, and primary clinical/functional source context. The report's EDA-gene name ambiguity was adjudicated against the assigned MONDO:0100162 entity. No changes were made to the distinct Incontinentia_Pigmenti entry (MONDO:0010631).

    Original 16 phenotype disposition: retained and reviewed recurrent infections, hypogammaglobulinemia, mycobacterial susceptibility (renamed recurrent mycobacterial infections, same HPO), anhidrosis, sparse scalp hair, conical teeth, colitis, bronchiectasis, failure to thrive, osteopetrosis and lymphedema. Re-sourced Seizures from nonspecific IP CNS evidence to Miot's pre-HSCT P22 M. avium brain-lesion observation. Removed four IP-only blocks: Blaschko-line skin lesions, retinal vascular abnormalities, nonspecific IP tooth abnormalities and nail dystrophy. Nail dystrophy in Keller's separate EDA/IKBKG dual diagnoses does not establish clean NEMO attribution. Removed duplicated IP subtype, inheritance, deletion, prevalence and skin-mechanism content while retaining scoped female and overlap discussion.

    The candidate contains 49 phenotypes, 8 mechanism nodes and 42 causal edges. Thirty-three phenotypes have causal in-edges; the remaining 16 comprise 13 non-laboratory clinical findings plus high IgA, low IgM and reduced T-cell count. There are no phenotype assay-readout nodes and no frequency enums. The 37 additional clinical findings include separate hypohidrosis, hypodontia/oligodontia, immunoglobulin components, memory-B-cell and antibody findings, opportunistic infections, respiratory/nutritional complications, case-scoped autoimmunity and pre-HSCT neurological findings. Raw name accounting also includes one rename, hence 38 added names and five removed names. All retained HPO IDs remain; new terms use the most specific supported concept. Human biochemical concentrations are not relabeled as in-vitro assays.

    Mechanisms separate conditional innate responses, C417-associated CD40/c-Rel B-cell maturation, E315A/R319Q antigen-presenting-cell IL-12/IFN-gamma cooperation, ectodysplasin-dependent appendage development, qualified osteoclast/lymphatic routes and epithelial-barrier colitis. Preserved responses are not converted into universal deficiency. The epithelial route combines the P7 human biopsy with source interpretation and mouse context, retaining CMV aggravation and variable post-HSCT bowel outcomes. NEMO-to-eczema attribution is a qualified single-case hematopoietic intervention inference from the accessible Minakawa publisher extract; dry skin is not automatically attributed to absent sweating. Infection-related seizures and ARDS retain their individual infectious context. High IgA discussion preserves the C417-specific proposal for CD40-independent serum synthesis but does not treat this as proof of elevated production in c.268delG. Autoimmune, developmental, pigmentary and remaining laboratory gaps reflect unresolved attribution rather than merely undrawn intermediates.

    Full primary sources examined include Zonana 2000 (DOI:10.1086/316914), Hanson 2008 (PMID:18851874), Filipe-Santos 2006 (PMID:16818673), Jain 2004 (PMID:15578091 full PDF), Puvilland 2021 (PMID:33598805), Meric 2024 (PMID:39540818), Cifaldi 2025 (PMID:39860371) and Miot 2017 (PMID:28679735 plus fetched PMC5609334 full text). The Doffinger 2001 abstract was available, but full text was not obtained. Minakawa 2009 is available only as a publisher extract at article-minimal/6625140; its fetched URL title is preserved exactly. Picard 2011 full review supplies disease-specific mechanistic context. HED GeneReviews explicitly lists IKBKG in its differential table; this supports scoped clinical, diagnostic and X-linked inheritance assertions. General HED cooling/dental advice is OTHER and INDIRECT. EDA-specific counseling probabilities and therapies are not transferred to NEMO disease.

    Ascertainment corrections distinguish Hanson's feature-specific denominators, inconsistent 13/16 pneumococcal percentages, selected/overlapping transplant cases, and pre- versus post-HSCT findings. Miot's 74% Kaplan-Meier estimate at 108 months is separated from median 57-month follow-up among survivors; mycobacterial and IBD subgroup associations were not statistically significant. The female Cifaldi infection history remains confounded by infliximab. The child's Thr164Pro observations are separate from maternal IP and familial cancers. NFKBIA cases in Falcon are not IKBKG evidence.

    Conservative substantive snippet-fix count is 10 mismatched original items: generic IUIS abstract, IMD33 generic review, anhidrosis generic ED wording, conical-tooth generic dentition wording, IP CNS-to-seizure inference, generic IP eye-to-retinal-vascular inference, bronchiectasis generic infection quote, Ig-replacement diagnostic quote, HSCT generic infection quote, and the pooled IP/EDA mutation count presented as EDA-only. This count excludes pure primary-source strengthening, topology reuse and additional scope-only deletions. Candidate raw quote occurrences are +165/-39 (47 to 173); 169 EvidenceItems are new or replaced, and all 173 titles match fetched frontmatter exactly. Parent clinical review and final fixed-base validation are performed before publication; draft strict DOI/URL verification passed 173/173. Existing history and fetcher-generated source caches are preserved. Only prescribed fetchers and validators generated reference and ontology caches.

    Independent clinical review follow-up: removed the single duplicate Hanson EvidenceItem from the B-cell-to-hypogammaglobulinemia edge, preserving its indirect variant-scoped explanation. Added a case-scoped CMV-to-colitis sequela describing probable exacerbation with unknown intermediates, and qualified the related nutritional descriptions consistently. Eczematoid dermatitis is excluded from remaining-gap attachments because its partial immune contribution is already represented. This bounded change is +1 edge and net zero EvidenceItems (one added, one duplicate removed); totals remain 49 phenotypes and 173 snippets, with 42 edges. New history attribution is explicitly Codex/gpt-6/codex; previous records are unchanged.

  summary: Bind IKBKG subtypes and preserve source-scoped Picard frequency estimates
  details: |
    Respond to the two blocking findings in PR11806. Added active MONDO subtype bindings independently checked through the configured OLS service: EDA-ID MONDO:0020740 (OMIM:300291), OL-EDA-ID MONDO:0010295 (OMIM:300301), and IMD33 MONDO:0010386 (OMIM:300636 exact match; OMIM:300584 cross-reference). Each has the assigned MONDO:0100162 umbrella in its ancestry; exact canonical labels retained. The schema requires subtype_term under has_subtypes, rather than the disease_term named in the review checklist. The first schema gate rejected the checklist field; correcting those three keys preserved all ontology choices and clinical content. Validation of the actual subtype descriptor generated three MONDO label rows and three DiseaseOrSubtypeTerm membership rows, with source-generated cache ordering and all pre-existing rows preserved. Expanded the existing ascertainment discussion with Picard 2011 estimates: about 90% pyogenic bacterial infection, about 40% mycobacterial infection, 19% serious viral infection and about 90% aggregate ectodermal dysplasia. Six new exact-quote EvidenceItems retain those numbers and the reported-male-case and Hanson-plus-unpublished-data provenance. Reviewed the cached full context and independently confirmed reference 25 as Hanson 2008 in the full PMC article. Infection occurrence does not establish recurrence, the viral composite is not CMV-specific, and aggregate EDA does not supply individual hair, dental or sweating frequencies. The numerical values fall within repository frequency bands but measure different endpoints; no categorical frequency is transferred, and observational design alone is not the reason for declining. All six new reference_title values exactly match fetched metadata. Five clinical-observation items are HUMAN_CLINICAL; the table source-provenance statement is OTHER. Response delta: three disease bindings, six evidence items and four discussion attachments; zero phenotype, HPO, frequency, mechanism, causal-edge or readout changes. Prior histories, all source-cache bytes and all clinical sections outside these bounded changes are preserved. Optional review suggestions are outside this finish-only response; existing full-text, fetched-title and bracket-normalization policies remain applicable.

  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on all 45 inlined PMID evidence items reading titles verbatim from references_cache frontmatter. Re-ran validate-references to sync caches and pull full text, then re-verified every existing snippet as an exact substring and semantically against its claim. Mined full text for new well-supported findings. Added an EDA-ID birth prevalence entry of about 1 in 250,000 newborns from PMID 22566850. Added a Nail dystrophy IP phenotype at 16 percent from the nationwide Danish cohort PMID 39623400 mapped to HP 0008404. Enriched Hematopoietic Stem Cell Transplantation with the finding that colitis and pre-existing mycobacterial infection are the two main unfavorable HSCT prognostic factors from PMID 33598805. Demoted the Bronchiectasis phenotype evidence from SUPPORT to PARTIAL because the cited review PMID 22566850 documents the sinopulmonary infection susceptibility that predisposes to bronchiectasis but does not itself document bronchiectasis. Reverted the repo-wide reference_id re-quoting churn on unrelated cache files keeping only this disease own caches.

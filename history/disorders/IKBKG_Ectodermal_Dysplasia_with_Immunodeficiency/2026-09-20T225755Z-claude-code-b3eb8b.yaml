  details: |
    Curation-scanner round on PR #11806. The PR has been approved since 14 September and was still unmerged, for two reasons that the previous scanner round (2026-09-17T161806Z) fixed only half of.

    Root cause of the red `test (3.13)` check. `uv run python -m dismech.node_classes --verify-kb` failed with: pathograph_node_classes.txt line 2195, IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency has no pathophysiology node named 'Susceptibility to severe infections' (DISPOSITION > trigger-specific susceptibility). That worked example was added to main by #11132 and cites the pre-review version of this entry, whose pathophysiology was a six-node chain ending in a 'Susceptibility to severe infections' disposition node. This PR replaces that chain with eight mechanism nodes (Impaired NEMO-dependent NF-kappaB activation, Impaired innate immune receptor responses, Impaired CD40-dependent B-cell maturation, Impaired CD40-dependent IL-12 and IFN-gamma cooperation, Impaired ectodermal appendage development, Impaired osteoclast maturation, Impaired lymphatic developmental signaling, Intestinal epithelial barrier dysfunction) and carries no disposition node at all, so the citation dangles. The failure is a cross-file one: neither side contains the defect on its own, and it only appeared when the 2026-09-17 merge of main brought #11132 onto this branch. The check is fail-fast, so every CI step after it was skipped in that run and had never been exercised against this branch's content.

    Fix. Removed the single stale example line. The class keeps seven examples including two other immunodeficiency entries (Acquired_Immunodeficiency_Syndrome, Hepatic_Veno-occlusive_Disease-Immunodeficiency_Syndrome), so the vocabulary loses no coverage. Re-pointing the citation at one of the new node names was rejected: all eight are mechanism nodes, none is latent-until-a-named-stimulus-arrives, and manufacturing a fit would misdescribe the class. Re-adding a disposition node to an approved entry was also rejected as out of scope for a conflict-clearing round. `--verify-kb` now reports 101 classes, 2192 examples, all resolved.

    Merge conflict, again. Merged origin/main (no rebase, no force-push; the branch is @cmungall's). One conflict this time, cache/enums/diseaseorsubtypeterm_6d5891ec946f.csv, resolved as the union of both sides: 1758 rows at the merge base, +74 from main, +3 from this branch (MONDO:0010295, MONDO:0010386, MONDO:0020740 — the entry's own subtype bindings), 1835 after. Both sides were confirmed additive against the merge base before resolving, so no row is dropped from either.

    Validation on the merged tree. node_classes --verify-kb green; validate-disorders green on the entry (schema, terms, and 179/179 snippets verified against the cache — the prefix-skipped ones are now checked too); compliance-connectivity green; validate-history-all green over 11177 records; knowledge_gap_discussion_audit --strict, check_coarse_phenotypes, check_qualifier_terms, reference_cache_frontmatter, check_source_defect_claims and dismech-stubs check all green; test-schema and test-kb green. The steps CI had never reached on this branch are therefore all exercised.

    No change to phenotypes, HPO bindings, pathophysiology nodes, causal edges, evidence items, snippets, discussions, treatments or subtype bindings.

  details: |
    Curation-scanner round on PR #11806, which was APPROVED but CONFLICTING and so could never be swept by pr-shepherd.

    Merge conflicts. Merged origin/main into the branch (no rebase, no force-push; the branch is @cmungall's). Three committed term caches conflicted, each in a single hunk: cache/enums/phenotypeterm_939f99dde0f5.csv, cache/hp/terms.csv and cache/mondo/terms.csv. Each was resolved as a union by CURIE, keeping main's row wherever both sides carried the same CURIE so the merged file is byte-identical to main on that line rather than restamped backwards. No row was dropped: HP:0032434 (label identical on both sides, main's later retrieved_at kept), HP:0032435 and MONDO:0010385 came from main; MONDO:0010386 came from the branch. After resolution the four cache files differ from main by additions only, and all of those additions are terms this entry binds (MONDO:0010295, MONDO:0010386, MONDO:0020740, HP:0005479). just validate-terms reported the caches unchanged, confirming the merged caches are complete for the entry. check-term-cache-integrity and check-cache-order both green.

    Reviewer follow-up taken: therapeutic_agent. The approving review named two cheap follow-ups. Both generic NCIT:C15986 Pharmacotherapy treatments now carry a therapeutic_agent binding, sourced from OLS at the time of writing and validated against the ChemicalEntityTerm dynamic enum: Immunoglobulin Replacement Therapy -> NCIT:C2701 Therapeutic Immune Globulin, and Antimicrobial Prophylaxis -> NCIT:C254 Anti-Infective Agent. NCIT:C121331 Intravenous Immunoglobulin Therapy was rejected for the first: it names the therapy rather than the substance, so it belongs in treatment_term, and the entry does not specify an intravenous route. The drug class was preferred over CHEBI trimethoprim/sulfamethoxazole for the second because the treatment also covers antimycobacterial prophylaxis, which naming the two TMP-SMX components would misrepresent. Both terms were already in cache/ncit/terms.csv, so no cache row was added.

    Reviewer follow-up NOT taken, with a reason: the CDN reference_title. The bare Silverchair CDN reference_title is required by the gate, not an oversight. The underlying article was identified as Minakawa et al., Clin Exp Dermatol 34(7):e441-e442 (2009), DOI 10.1111/j.1365-2230.2009.03473.x, PMID:19663838 -- the CDN page carries that DOI and the article title, and an independent PubMed title search returns the same PMID. Writing the real title was attempted and reverted: linkml-reference-validator raises ERROR 'Title mismatch' on both occurrences, because it compares reference_title against the cache frontmatter title, which for a scraped page with an empty <title> element is the URL itself. Note this is the opposite of scripts/check_reference_titles.py, which exempts url:/http(s): references for exactly the reason that a scraped title is not authoritative -- the two title checks disagree on this case. Repointing the reference to the PMID or DOI is also not available: both were fetched and neither carries an abstract for this short case report, so the quoted sentence ('We report a case of intractable eczematous eruption...') exists only in the CDN cache and would stop verifying. The probe cache files were deleted rather than committed, since the entry cites neither. Left as-is deliberately; the underlying defect is the url: prefix bypassing CI, which is a separate question from the title.

    Validation on the merged tree: just validate green (schema + terms + references, 128/179 snippets verified and 51 skipped by prefix, unchanged from before this round); validate-disorders green; check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values (whole KB, 3406 files), check-duplicate-keys (whole KB, 4329 files), check-case-collisions, check-term-cache-integrity and check-cache-order all green; history record validates. One false alarm worth recording: check-case-collisions reports three colliding groups while a merge is unresolved in the index, because git ls-files lists three stages for each unmerged path; it is green once the resolved files are staged.

    No change to phenotypes, HPO bindings, pathophysiology nodes, causal edges, evidence items, snippets, discussions or subtype bindings.

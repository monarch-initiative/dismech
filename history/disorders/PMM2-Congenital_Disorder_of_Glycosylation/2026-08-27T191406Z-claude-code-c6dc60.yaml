  summary: 'Create: PMM2-Congenital Disorder of Glycosylation'
  details: |
    Curated PMM2-CDG (MONDO:0008907) from a claude_code deep-research report plus GeneReviews PMID:20301289, mined across all four sections. Ten pathophysiology nodes in one connected component from biallelic hypomorphic PMM2 variants through reduced phosphomannomutase activity to global N-hypoglycosylation, branching into cerebellar, coagulation and hepatic arms. Two mechanistic_hypotheses model the competing routes to underglycosylation: precursor depletion (CANONICAL) and the zebrafish M6P substrate-accumulation route (EMERGING); the causal edges opt into them separately so a future measurement can support one without retiring the other. Three animal models including a FAILS_TO_RECAPITULATE link for the post-mitotic neuronal knockout, which is the negative result that locates the PMM2 requirement in development rather than maintenance. Corrections: the report proposed MONDO:0015286, the generic CDG parent, instead of MONDO:0008907; and five of twenty-seven suggested CURIEs were wrong (GO:0097502 and CL:0000643 obsolete; HP:0009026 is Hypoplasia of latissimus dorsi muscle; HP:0001636 is Tetralogy of Fallot; HP:0001700 is Myocardial necrosis). Validation: 33/33 snippets verified, plus an independent raw-substring re-check at 33/33; schema, terms, entity-refs, duplicate-keys and all four snippet gates pass.

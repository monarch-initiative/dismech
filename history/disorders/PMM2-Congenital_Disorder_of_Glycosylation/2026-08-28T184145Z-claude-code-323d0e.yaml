  details: |
    Clears the PMM2-CDG items deferred from PR #9755 review and tracked in issue #9787, except the grouping membership, which edits a shared file and is in its own PR.

    treatments: the epalrestat MODULATES edge now rests on the primary source. PMID:31636082 (Iyer et al., the Disease Models & Mechanisms repurposing screen) was fetched with just fetch-reference and supplies three items in place of the review's one-line summary: the fibroblast result naming four genotypes including R141H/F119L, the 30% to 400% activity gain with its explicit genotype dependence, and the proposed route from aldose reductase inhibition to glucose-1,6-bisphosphate stabilizing PMM2 homodimerization. Graded IN_VITRO, since the measurements are in patient fibroblasts. The review (PMID:35562242) is retained below them rather than removed, still graded OTHER, because it adds the glycoproteomic arm the enzyme assays do not cover.

    The genotype dependence is the useful part for this entry: it is the direct evidence that MODULATES rather than RESTORES is the right grading on that edge, which was previously an editorial judgement.

    genetic: R141H and F119L are now structured variants[] entries rather than a sentence in notes. Each carries functional_effects with type loss-of-function and its own evidence. The two are deliberately described as a pair, because the interesting claim is relational: R141H is a functional null never reported homozygous in a living patient, so every patient carries something else opposite it, and it is that second allele's residual activity that sets severity. F119L is the commonest such partner, and R141H/F119L fibroblasts were one of the four lines in which epalrestat raised PMM2 activity - so the enzyme-activator approach and the commonest genotype are the same fact seen twice.

    Note on the R141H functional_effects description: complete loss in the homozygous state is recorded as inferred from the allele's absence among living patients, not from a direct assay quoted here. No source in this entry measures R141H homozygous activity, for the obvious reason.

    prevalence: added an Ashkenazi Jewish birth-prevalence record at 1 in 20,000, from PMID:34447415 which the entry already cited for the worldwide ceiling. The same sentence gives European (1 in 27,000) and admixed American (1 in 64,000) figures; the three-fold spread is information the single worldwide figure hides. Carries the same allele-frequency caveat as the existing worldwide record.

    Also removed a sentence in the mannose treatment's notes that narrated the entry's own edit history (An earlier version of this description also claimed...). Same defect the CYB561 item in #9787 identified, found by grepping the round's five entries for the pattern; three of the five had it. The substantive caveat - that correction of hypoglycosylation is not claimed because nothing cited supports it - is kept, stated as a present-tense fact about the entry rather than as a diff against a version no reader can see. The equivalent sentence in COQ6 is fixed on that entry's own branch.

    Correction to the paragraph above, made in the same session: it originally called
    PMID:31636082 a PLoS Biology paper. The journal is Disease Models & Mechanisms, as
    references_cache/PMID_31636082.md records. I inferred the journal rather than reading
    it off the cache - the same failure mode as writing a reference_title from memory,
    and the reason for the rule that these fields are copied, never typed.

    Review follow-up (PR #9913). Both blocking findings and three suggestions.

    Blocking: the new Ashkenazi Jewish prevalence record duplicated the existing
    "Worldwide (allele-frequency ceiling)" record - same rate_per_100000, same
    measure_type, same class, same source. They are the same estimate: the study computed
    per-gnomAD-population values only, so the abstract's "could be as high as 1:20,000"
    is the maximum across populations, which is the Ashkenazi Jewish figure. Anything
    consuming rate_per_100000 was double-counting. The two are now merged into one
    Ashkenazi Jewish record carrying both quotes, and the European (1 in 27,000, 3.7 per
    100,000) and admixed American (1 in 64,000, 1.6 per 100,000) figures were added as
    their own records - so the roughly three-fold spread the earlier note claimed is now
    actually visible in the structured data instead of only asserted in prose.

    Blocking: the R141H variant record asserted functional-null status, never-reported-
    homozygous, and two-nulls-incompatible-with-live-birth, while its single evidence
    item supported only the >60% allele frequency. Added the embryonic-lethality
    sentence from PMID:34447415, graded COMPUTATIONAL to match how the same paper is
    graded in the prevalence section. It also explains why an allele-frequency prevalence
    estimate overcounts here, since the study kept homozygotes in the calculation while
    acknowledging they are not born.

    Suggestion taken: the "may shunt glucose" snippet regraded IN_VITRO to OTHER. It is
    the authors' mechanistic proposal, not a measurement, and sitting as a third
    IN_VITRO item beside two real assays misrepresented it. The explanation now says so
    rather than only preserving the "may".

    Suggestion taken: dropped the duplicate R141H frequency item at genetic[0] level.
    It was orphaned once the rewritten notes stopped stating the >60% figure, and the
    same quote is carried on the variant it describes. genetic[0] now has no top-level
    evidence, which is correct: every claim it makes is either summarised from the
    variants or covered by their evidence.


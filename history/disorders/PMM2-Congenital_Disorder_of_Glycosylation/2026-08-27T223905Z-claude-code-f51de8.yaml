  summary: Correct epalrestat trial status to TERMINATED (futility); close non-blocking
    review items
  details: |
    Third pass on PR 9755, correcting an error introduced in the pass immediately before it. The epalrestat trial NCT04925960 was recorded with status UNKNOWN on the reasoning that the cached registry summary did not state one. Checking the ClinicalTrials.gov API instead showed the trial is TERMINATED, with 'Due to futility' as the stated reason and actual completion 2025-02-28. That is a materially different fact: the treatment description had framed the agent as being in placebo-controlled trial, which read as promising. Corrected to TERMINATED, and the description and target_mechanisms rationale now separate the biochemical mechanism claim, which stands, from clinical benefit, which the controlled trial did not demonstrate. The treatment is retained rather than removed because a negative controlled result is informative content. The API-derived status and the PHASE3 confirmation are recorded in notes with their provenance rather than quoted as evidence, because the cached reference holds only the study description. Applied the same treatment to NCT05549219, whose COMPLETED status was likewise unevidenced by its cache and is now confirmed against the API. Closed three further non-blocking review items: Deep Venous Thrombosis rebound from the general HP:0004936 Venous thrombosis to the specific HP:0002625 Deep venous thrombosis, matching both the phenotype name and the GeneReviews quote; the Oral Mannose Supplementation description had asserted correction of hypoglycosylation in patient fibroblasts with nothing citing it, so that clause was removed and the negative clinical claim is now evidenced by PMID:35562242. Validation: schema and terms pass, 62/62 snippets verified, entity-refs and duplicate-keys pass, 76/76 reference titles match cache frontmatter, snippet-grading and snippet-length gates report no new divergences against origin/main.

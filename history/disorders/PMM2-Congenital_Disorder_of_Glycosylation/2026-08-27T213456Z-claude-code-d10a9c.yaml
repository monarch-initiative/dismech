  details: |
    Responded to the REQUEST_CHANGES review on PR 9755. All seven blocking items addressed. (1) reference_title was absent from all 33 evidence items; backfilled with the repo's own scripts/backfill_reference_titles.py against cache frontmatter, and the same omission was present in all five of this round's entries. (2) CORRECTION TO THE EARLIER RECORD: the CREATE history record for this entry asserted GeneReviews PMID:20301289 was 'mined across all four sections'. That was false - Diagnosis/Testing was not consumed. It is now, as a diagnosis: section carrying the three-tier diagnostic criterion including the phosphomannomutase enzyme assay fallback, plus the Agents/Circumstances to Avoid line on acetaminophen. The over-claim is recorded in the entry's notes rather than quietly fixed; the identical failure was caught on Peroxisome_Biogenesis_Disorder_3A in a previous round, so this is a repeat. (3) Four treatments added: GLM101 mannose-1-phosphate replacement with BYPASSES on the M1P depletion node, diazoxide for hyperinsulinemic hypoglycemia (which the entry's own phenotype description already named), preclinical AAV9-PMM2 gene replacement, and oral mannose; plus clinical_trials NCT05549219. (4) Seven phenotypes added: seizures, progressive cerebellar atrophy, retinitis pigmentosa, feeding difficulties, hypothyroidism, deep venous thrombosis, hepatomegaly. (5) Antithrombin Deficiency bound to HP:0001976. (6) PMID:34447415, previously declared but never cited, now carries a second prevalence record for the allele-frequency ceiling, graded COMPUTATIONAL. (7) progression: added for the three GeneReviews stages. The pmm2_developmental_window KNOWLEDGE_GAP is updated: the AAV result reverses cerebellar Neurexin-2 downregulation post-natally, which partially answers the question the gap poses without settling it, and the discussion now says exactly that. Stub deleted. Two defects my own raw-substring audit caught that just validate did not: an en-dash the validator normalizes but I had typed as a hyphen, and four newly cited references missing from the declarations block. Validation: 53/53 snippets, raw re-check 53/53, no declared-uncited or cited-undeclared references, schema/terms/entity-refs/duplicate-keys/snippet gates all pass.

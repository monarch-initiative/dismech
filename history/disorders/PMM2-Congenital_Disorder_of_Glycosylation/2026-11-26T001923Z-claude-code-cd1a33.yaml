  summary: 'Gene-family review: PMM2'
  details: |
    PMM2's CAUSATIVE record reached no mechanism node: the Reduced Phosphomannomutase 2 Activity node bound phosphomannomutase activity (DECREASED) but listed no gene. PMM2 is now on that node. The record gains germline origin and ClinGen's Definitive AR classification for PMM2-CDG (MONDO:0008907, this entry's disease term), quoting the CGGV row. The allelic promoter disorder HIPKD (MONDO:1030000; PMID:28373276), rated Moderate by ClinGen, is not part of this entry and was filed as a stub.

  summary: Evidence the F119L prevalence and pairing claims
  details: |
    Review round: the F119L variant record asserted two things without evidence - that the allele is one of the most prevalent, and that it most often sits opposite R141H making R141H/F119L the commonest genotype. Two evidence items were added from caches the entry already cites: PMID:40501776 for the prevalence claim and PMID:40307862 for the pairing. Both graded OTHER because each sentence recites epidemiology from other sources rather than reporting the citing paper's own data, which is the convention this entry settled on when the 1:20,000 attribution was corrected. The description was also qualified geographically: the source that makes the pairing claim ties it to Scandinavia, so the entry no longer states the commonest-genotype ranking as a worldwide fact. clinical_significance PATHOGENIC added to both variants, readable from the newly quoted sentence. ClinVar variation IDs 7706 and 7711 were added in the same session and then removed again before push: the source gives bare variation IDs while the KB's form is the zero-padded VCV accession, and converting one to the other is not something the cited sentence supports. The Ashkenazi prevalence notes now say the study reports three population estimates and computed seven, rather than implying it computed three. 72 of 72 snippets verified.

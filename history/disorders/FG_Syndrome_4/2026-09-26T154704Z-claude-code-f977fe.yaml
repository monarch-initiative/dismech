  summary: Rebind CASK molecular function to the adaptor term
  details: |
    The molecular function bound on the node 'CASK Hypomorphic Altered-Function Variant' was changed from GO:0004674 (protein serine/threonine kinase activity) to GO:0030674 (protein-macromolecule adaptor activity). Nothing in the node claims a kinase activity: its description is about reduced or altered CASK protein, and the downstream node describes CASK as a MAGUK scaffold and already binds GO:0030674. The adaptor term makes the gene-landing node agree with that. Validated with linkml-validate and just validate-terms.

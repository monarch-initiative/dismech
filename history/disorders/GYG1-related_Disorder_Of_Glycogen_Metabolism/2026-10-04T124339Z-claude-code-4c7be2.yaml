  summary: 'Create: GYG1-Related Disorder of Glycogen Metabolism'
  details: |
    New gene-defined Mendelian entry for biallelic GYG1 (glycogenin-1) deficiency, MONDO:0100314, curated de novo from the stubs/ queue (stub deleted in this PR; unclaimed). Deep research via claude_code (lead-only; term validation 16/16, 3 benign paraphrases). Modeled as one entity with two has_subtypes: GSD XV (MONDO:0013291, cardiac) and polyglucosan body myopathy type 2 (MONDO:0014526, skeletal). Causal chain: GYG1 LOF -> impaired glycogenin-1 autoglucosylation (loss of glycogen priming) -> branch: (a) absent glycogenin-1 -> focal glycogen/polyglucosan accumulation in skeletal muscle -> skeletal myopathy + proximal weakness (PGBM2); (b) nonfunctional mutant glycogenin-1 in heart -> abnormal glycogen storage -> cardiomyopathy + arrhythmia (GSD XV). 4/4 phenotypes causally connected; phenotypes stratified by subtype FK. Histopathology: PAS-positive, diastase-resistant polyglucosan on muscle biopsy. Evidence anchored on Moslemi 2010 NEJM (PMID:20357282, index case, autoglucosylation inactivation), Visuttijai 2020 JCEM (PMID:31628455, full text, skeletal-vs-cardiac mechanism + biallelic nosology) and Akman 2015 (PMID:26652229, five-patient Sardinian polyglucosan cohort). No GeneReviews chapter (checked offline + live PubMed [book]). 11/11 snippets verified; all terms valid; full gate suite green. Avoided quoting Akman's alpha-amylase phrase because the Greek alpha does not fold in snippet normalization.

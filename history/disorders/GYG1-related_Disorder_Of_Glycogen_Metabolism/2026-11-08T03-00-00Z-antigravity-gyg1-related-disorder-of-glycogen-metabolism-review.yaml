  summary: Added Harrison's classifications, grounded GYG1 pathophysiology and diagnostic terms, added phenotype categories and Waddling gait, and enriched treatments for GYG1-Related Disorder of Glycogen Metabolism.
  details: >-
    Added Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC,
    CARDIOVASCULAR, and GENETICS_ENVIRONMENT_DISEASE) with verbatim evidence. Grounded
    GYG1 Loss of Function with hgnc:4699 and Impaired Glycogenin-1 Autoglucosylation
    with hgnc:4699, GO:0008466, GO:0005978, skeletal/cardiac muscle tissue, and
    myocyte/cardiomyocyte cell types. Added category to all phenotypes, sourced
    frequencies on PGBM2 skeletal phenotypes, and Waddling gait (HP:0002515); bound NCIT
    diagnosis_term and presence/results on all four diagnostic procedures; and populated
    therapeutic_modality, phenotype-targeted links, and evidence for Supportive care and
    Cardiac transplantation.

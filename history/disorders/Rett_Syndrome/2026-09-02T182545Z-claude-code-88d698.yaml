  details: |
    Reviewed kb/hypotheses/Rett_Syndrome/canonical_mecp2_loss_transcriptional_synaptic_dysregulation_model/openscientist.md and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml (verdict SUPPORTED, 14 claims). Fetched 25 of the report's 55 citations into references_cache and checked every quotation the report acts on; none was fabricated or misattributed, including the five 2026 identifiers. Integrated the RETAINED claims. mechanistic_hypotheses gained PMID:24009314 (adult Mecp2 reactivation rescues established deficits, MODEL_ORGANISM SUPPORT) and PMID:25870282 (postnatal mCH accumulation explains onset timing, MODEL_ORGANISM SUPPORT), plus PMID:20188665 as a REFUTE item against the description's framing of MeCP2 as predominantly a gene-specific repressor. Loss of MeCP2 Epigenetic Regulation was widened to chromatin architecture, mRNA splicing and SEC-mediated elongation (GO:0006325, GO:0008380) with PMID:20188665, PMID:28211484, PMID:41296873. Two new pathophysiology nodes: Cortical Excitation/Inhibition Imbalance, grounded on human paired-pulse TMS (PMID:32129908) and feeding Seizures and Gait Abnormalities, and Non-Cell-Autonomous Glial Injury of Neurons (PMID:20392956, PMID:24285883) feeding the synapse and spine node. Brainstem Respiratory Circuit Dysregulation gained the Koelliker-Fuse localisation with both directions of the PMID:26507912 perturbation. Three discussions added: a HUMAN_MODEL_MISMATCH on MeCP2 phase separation (PMID:32111972 vs PMID:38719804, where mouse focal distribution is atypical among mammals), and KNOWLEDGE_GAPs on prenatal versus postnatal contribution (PMID:41182667, with a timed conditional deletion experiment proposed) and on peripheral tissue-autonomous pathology (PMID:27288453, PMID:35085773). Deliberately not integrated: PMID:30929312 detection rates (review-level, claim already carried by the discovery paper and ClinGen), PMID:38232652 trofinetide endpoints (secondary-endpoint paper restating curated PMID:37291210, and the report mis-reports the nominally significant RTT-COMC result as statistically significant), PMID:39838601 dosage sensitivity (its comparison group is male RTT-like, not classic Rett), and the PTM cascade, mitochondrial and L1 retrotransposition material, which needs its own curation pass. Hypothesis status left CANONICAL; the report recommended annotation, which the notes already carry. Checks run: validate-hypothesis-assessment, count-verified-snippets (88/91, 3 skipped by prefix, none failing), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-qualifier-terms.

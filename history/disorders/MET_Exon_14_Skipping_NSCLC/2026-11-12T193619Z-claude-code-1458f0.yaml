  summary: 'Reviewed MET Exon 14 Skipping NSCLC: fixed short snippets, removed unavailable
    title-echo references, wired causal edges to all phenotypes, and added diagnosis
    and selective MET inhibitor target mechanisms'
  details: |
    Added synonyms, evidence-backed Carcinoma icdo_morphology and ONCOLOGY_HEMATOLOGY/RESPIRATORY classifications, NSCLC cohort prevalence (3-4% via PMID:32877583 and PMID:26729443), and older-adult progression (median age 72.5 years). Replaced demographic pseudo-phenotypes mis-bound to HP:0100526 with Non-Adenocarcinoma Lung Carcinoma (sarcomatoid/non-ADC enrichment) alongside Lung Adenocarcinoma (HP:0030078) and Brain Metastases (HP:0004375), and wired bare-name downstream edges to all 3 phenotypes (100% connected). Grounded MET Exon 14 Splice Mutations with hgnc:7029, GO:0004714 (INCREASED), GO:0006511 (DECREASED), biological_scale, and sustaining_proliferative_signaling module conformance while preserving MAPK and proliferation GO terms required by Molecularly_Defined_NSCLC_Subtypes. Fixed 3-word baseline snippet and missing evidence_source values, removed two uncached title-echoing DOI entries from references, added RNA/DNA NGS (NCIT:C101293) and RT-PCR/liquid biopsy (NCIT:C17003) diagnosis entries, and enriched Capmatinib (PMID:32877583), Tepotinib, Vebreltinib, Crizotinib, Immunotherapy, and Chemotherapy with therapeutic_modality and Prolonged MET Signaling target_mechanisms.

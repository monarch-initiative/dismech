  summary: 'Addressed PR 17279 review: debundled CBL/Y1003 MET degradation node with primary citations, fixed broadMatch mapping, rebound Brain neoplasm, split Liquid Biopsy diagnosis, and tightened clinical/resistance evidence'
  details: |
    Changed mondo_mappings predicate from skos:narrowMatch to skos:broadMatch (subject-to-object). Debundled Impaired CBL-Mediated MET Degradation (GO:0006511 DECREASED) between MET Exon 14 Splice Mutations and Prolonged MET Signaling with primary CBL/Y1003 and exon 14 deletion evidence (PMID:16397241, PMID:11741535), bound CL:0000082 (epithelial cell of lung) on the somatic lesion node, removed the Cell Proliferation and Migration -> MET Inhibitor Resistance edge, backed MET Inhibitor Resistance with Recondo et al. 2020 (PMID:32034073), and marked T992I/H1094Y evidence as INDIRECT. Removed off-population PMID:32657049 from histopathology, rebound Brain Metastases to HP:0030692 (Brain neoplasm) with cohort baseline figures (17.0%-30%) and VISION tepotinib response data, split Plasma ctDNA Liquid Biopsy (NCIT:C135727) from RT-PCR, added CHEBI:758329 (vebreltinib), tightened Immunotherapy and Chemotherapy prose/evidence, and re-graded clinical-study BACKGROUND quotes from OTHER to HUMAN_CLINICAL.

  summary: 'Review round 1: ATM-Related Cancer Predisposition'
  details: |
    Answered the ai4c-reviewer CHANGES_REQUESTED review on PR 19074 in one push. All seven items, blocking and optional, are addressed here.

    Item 1, GeneReviews chapter cited but not tagged. Ran just tag-references, which added the top-level references block tagging PMID:42258614 as GeneReviews; check-genereviews now reports TAGGED rather than CITED_UNTAGGED. Removed the clause in the entry-level notes that described the check's own output, which was both false after tagging and a statement about how the curation was done rather than about the disease.

    Item 2, notes promised per-study penetrance estimates the entry did not carry. Two are now recorded on the Breast carcinoma phenotype row, each quoted from its own study, with the designs distinguished in the row description: an odds ratio of 1.82 (95% CI 1.46 to 2.27) from the population-based case-control study already cited, and a cumulative risk to age 80 of 13% (95% CI 4.6-30) from family-based segregation analysis, newly fetched as PMID:35365198. The inheritance block now carries penetrance INCOMPLETE with the segregation estimate supporting it, and penetrance_percentage is deliberately left absent because the published figures are site- and design-specific and this is a multi-site predisposition.

    Two of the three figures the review offered are not recorded, and the reason is recorded in notes. A heterozygote frequency of 1 in 252 is the deep-research report's own arithmetic over gnomAD v4 allele frequencies, and a cumulative breast risk of 23.4 per cent to age 80 is the report's own SEER-plus-relative-risk model; both are model output with no publication behind them, so neither can carry an evidence item and no carrier-frequency record was made. Separately, the review attributed an oestrogen-receptor-positive odds ratio of 2.10 (95 per cent CI 1.71 to 2.57) to PMID:33471974. None of those three numbers appears anywhere in that paper's cached full text, whose own reported value is 1.82 for breast cancer overall; 1.82 is therefore what the entry records.

    Item 3, Genetic Counseling. The 50 per cent transmission risk is added to the inheritance block with the chapter's own sentence quoted, together with the consequence the chapter draws for a carrier couple, that offspring are then at risk of biallelic loss and so of a different disease.

    Item 4, Management. Three treatment rows added, each with the chapter's quoted sentence: risk-reducing mastectomy or salpingo-oophorectomy (SURGERY, NCIT:C15329), endocrine risk-reducing therapy (SMALL_MOLECULE, NCIT:C15986 with CHEBI:41774 tamoxifen, CHEBI:8772 raloxifene and CHEBI:2704 anastrozole as therapeutic_agent), and radiotherapy when otherwise indicated (RADIOTHERAPY, NCIT:C15313). The radiotherapy row carries the WECARE result the review named, PMID:32119081, quoted for the finding that actually supports the management statement: radiotherapy did not modify the contralateral risk carried by known pathogenic variants. The same study's elevated radiotherapy-associated risk is confined to carriers of rare ATM missense variants of uncertain significance, a different group from the pathogenic carriers this entry covers; that is recorded in the row description rather than quoted, because the cached full text has lost the spaces around the gene symbol in that sentence.

    Item 5, quote_role on PMID:17001622. Added quote_role BACKGROUND to both uses. The snippet opens "We previously reported", so the sentence restates the authors' earlier segregation finding while the paper's own work is expression profiling.

    Item 6, evidence for the Genomic Instability in Glandular Epithelium node. The review was right that the ACMG snippet supports the organ sites rather than the instability. Added PMID:15101044, which measured micronucleus formation after irradiation in lymphoblastoid lines from ATM heterozygotes and from breast cancer patients carrying ATM missense variants, both significantly above normal lines. Graded INDIRECT and IN_VITRO: the damage was induced rather than observed accruing, and the cells are lymphoblastoid rather than the glandular epithelia where carrier tumours arise. The existing ACMG explanation now says explicitly that it evidences the sites and not the instability.

    That addition creates an apparent tension with the radiotherapy row, and the two rows now cross-reference each other rather than leaving a reader to reconcile them: raised micronucleus formation in a cellular assay coexists with no measurable excess of contralateral breast cancer after radiotherapy in a population-based cohort, and the entry says which question each result answers.

    Item 7, stomach anatomy. Added UBERON:0000945 to the node's locations, which previously listed breast, pancreas and prostate while the description and a downstream edge both named stomach.

    Validation after the round: validate-disorders clean, 33 snippets and 34 titles verified with 0 issues; every reference_title re-audited against its cache frontmatter, 33 checked and 0 mismatches; no tracked references_cache file modified. Every CURIE added in this round was resolved at OLS in the step it was written, and CHEBI:8772 raloxifene was additionally confirmed against the ChemicalEntityTerm dynamic enum by just validate-terms, since it was absent from the local cache.

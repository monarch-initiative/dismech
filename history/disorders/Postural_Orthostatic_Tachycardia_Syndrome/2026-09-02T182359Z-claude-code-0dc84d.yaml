  summary: Integrate assessed OpenScientist findings for the autoimmune and neuropathic
    POTS hypotheses
  details: |
    Integrated the RETAINED and QUALIFIED claims from the two existing codex assessments of the OpenScientist hypothesis reports (autoimmune_receptor_model, neuropathic_denervation_model), both PARTIALLY_SUPPORTED. Autoimmune model: added an assessment notes block recording the qualifications (rabbit immunization studies are single-program and use induced rather than patient-derived IgG; functional bioassays are single-lab and unreplicated; the largest ELISA study was null; iSTAND was negative) and the three rejected claims (AT1R cross-platform consistency, EBV as upstream trigger, a 30-50 percent antibody subtype). Added rabbit active-immunization evidence (PMID:31547749, MODEL_ORGANISM, INDIRECT) and the sham-controlled tVNS antibody-lowering result (PMID:37999672, INDIRECT) to the hypothesis; functional cell-based bioassay evidence for adrenergic (PMID:32743496) and M2 muscarinic (PMID:34409582) autoantibody activity to the Autoimmune Autonomic Dysfunction node; and the renin-aldosterone paradox (PMID:15781744, INDIRECT) as edge-level evidence on the AT1R link to Venous Pooling and Reduced Preload. Added a new tVNS treatment entry bound to NCIT:C21025. Neuropathic model: qualified the hypothesis notes to record that the 24-50 percent range pools different tests and selected populations and that the full causal chain has not been shown in one objectively defined cohort; added the negative Swedish case-control IENFD study as REFUTE evidence (PMID:40608783); added the operational subtype study (PMID:24386408) to the Neuropathic POTS subtype with a note that it is a research and not a consensus definition; added direct plethysmographic evidence for impaired limb vasoconstriction on the denervation-to-pooling edge (PMID:11295714, INDIRECT) and for lower-extremity pooling on the Venous Pooling node (PMID:12653674); added the midodrine intervention study (PMID:9244228) to the midodrine treatment, replacing reliance on a review snippet that did not name the drug. Added discussion gap_pots_small_fiber_neuropathy_causal_primacy (KNOWLEDGE_GAP) with two proposed experiments and evidence from PMID:40608783, PMID:24386408, and PMID:36367813. Deliberately not integrated: the report's REJECTED claims (splanchnic compression result, 71 percent exercise remission framing, long-COVID as a POTS-onset trigger, and the incorrect MONDO/CL/HP candidate CURIEs MONDO:0017360, MONDO:0100233, CL:0000003, CL:0011100, HP:0012899, none of which were promoted); the passive-transfer and independent-assay causal gap, which the existing gap_pots_receptor_autoantibody_causality discussion already covers with matching proposed experiments; and the evidence-maturity score and evidence-map-completeness claims, which are about the report rather than the disease. All 71 snippets in the file verify against the reference cache.

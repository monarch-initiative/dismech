  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist assessment sweep (branch os-review-fable) that never merged, rebuilt against current main rather than merged from that branch. All 13 candidate citations were still absent from main and all were re-applied; every snippet was re-derived and re-verified against references_cache records fetched fresh in this session (none of the 13 had a cached record on main). Autoimmune receptor-antibody hypothesis: added the assessment's qualifying notes (single-research-program rabbit immunization studies, one-laboratory functional bioassay lineage, the null 116-vs-81 standard ELISA study, the negative iSTAND IVIG trial, and the three report claims rejected on source check), plus the rabbit active-immunization model (PMID:31547749, MODEL_ORGANISM, INDIRECT) and the sham-controlled vagus-stimulation trial that lowered antiadrenergic autoantibodies (PMID:37999672, INDIRECT). Autoimmune Autonomic Dysfunction node: two functional cell-based bioassay results (PMID:32743496 alpha-1/beta-1, PMID:34409582 M2R, both IN_VITRO), and the renin-aldosterone paradox (PMID:15781744) as evidence on the AT1R-to-preload edge. Neuropathic denervation hypothesis: extended its notes to record that the 24-50 percent SFN figure pools different tests, thresholds and referral populations rather than being a case-control estimate, and that the denervation-to-pooling-to-tachycardia chain has never been shown end to end in one objectively defined cohort; added the prospective Swedish case-control refutation (PMID:40608783, REFUTE). Physiology: PMID:11295714 as edge evidence on Sympathetic Denervation -> Venous Pooling and Reduced Preload, and PMID:12653674 on the Venous Pooling node, replacing review-level assertion with plethysmographic measurement. Neuropathic POTS subtype gained PMID:24386408 with an explanation recording that its combined structural-plus-functional criterion is a research definition, not a consensus standard. Added knowledge gap gap_pots_small_fiber_neuropathy_causal_primacy (two proposed experiments; evidence PMID:40608783, PMID:24386408, PMID:36367813) attached to the neuropathic hypothesis, the Sympathetic Denervation node and the Neuropathic POTS subtype. Added treatment Transcutaneous Auricular Vagus Nerve Stimulation (therapeutic_modality DEVICE, NCIT:C21025 Peripheral Nerve Stimulation, already cached and used by three other entries) with a target_mechanisms link to Compensatory Reflex Tachycardia. Midodrine, which previously rested only on a review snippet that does not name the drug, now also cites an intervention study of the drug (PMID:9244228). Two of the new citations are not studies of this syndrome (PMID:36367813 enrolled small-fiber neuropathy, PMID:9244228 used the earlier name idiopathic orthostatic tachycardia) and both explanations say so. Nothing was skipped as already covered: main had none of the 13 papers, no notes on the autoimmune hypothesis, no small-fiber causal-primacy gap and no neuromodulation treatment. No ontology identifiers beyond NCIT:C21025 were bound. Assessment sidecars under kb/hypotheses were already present on main and unchanged. Verified: linkml-validate clean, 71/71 snippets verified, duplicate-key/entity-ref/causal-target/enum-value/qualifier-term checks clean, and the folded-hyphen, snippet-length, title-snippet and snippet-grading baselines report no new findings.

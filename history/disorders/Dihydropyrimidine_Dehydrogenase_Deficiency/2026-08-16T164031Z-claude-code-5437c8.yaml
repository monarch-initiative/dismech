  summary: Correct three truncated snippets and a false claim about the validator
  details: |
    CORRECTION TO THE PRECEDING HISTORY RECORD IN THIS DIRECTORY. That record states that a decimal point terminates a sentence for snippet matching. That is false, and it was my inference from my own extraction regex rather than from the tooling. Verified empirically this session: reference_snippet_audit splits snippets only on ellipses, re.split with two-or-more dots required, so a single decimal is never a split point; and normalize_text strips punctuation on both sides before comparison. Both full sentences match as raw substrings. The earlier record is left in place because it accurately describes the session as it ran, but a future curator should not act on its claim about the validator. Consequence of the error, and it was substantive: at the thrombocytopenia phenotype the snippet stopped at a frequency of 18, which is a fragment of the NEUTROPENIA figure, while the evidence was cited for thrombocytopenia at 15.1 per cent. The number the item was cited for did not appear in its own quote. All three truncated snippets restored to full sentences and the false rationale removed from their explanations. Also fixed the prevalence record flagged in finding B: the band had been changed from UNKNOWN to ABOVE_1_IN_1000 while the supporting snippet was still the study's aim sentence, which frames a denominator but states no rate and cannot support a quantitative band. Replaced with the measured figure, 11 of 146 participants at 7.5 per cent, and rate_per_100000 set to 7500. Validated: just validate passed; count-verified-snippets 38/38; title audit 0 mismatches.

  summary: 'Address review: diagnosis, biochemical, animal_models, genetic depth'
  details: |
    Addressed both CRITICAL and the IMPORTANT findings. Added diagnosis with three records covering the two EMA-endorsed methods (genotyping and uracil phenotyping) and, most importantly, their poor concordance: targeted genotyping is not reliable enough alone to find everyone with complete deficiency, so a negative genotype is not a clearance. Added biochemical for plasma uracil with the 16-150 ng/mL partial-deficiency band. Added animal_models for the Dpyd knockout mouse with TWO links: PARTIALLY_RECAPITULATES on the metabolite node with the quantitative sleep readout, and FAILS_TO_RECAPITULATE on Seizure, which is the substantive negative result explaining why the human neurological chain stays an EMERGING hypothesis. The failure link's limitations field is careful about what the negative actually establishes: the study assayed cognitive, social and affective behaviour and found no difference, but was designed around sleep and never did seizure-threshold testing or EEG, so seizures are unexamined rather than demonstrated absent. Added thrombocytopenia (the blocking phenotype). Expanded genetic with two things the reviewer correctly flagged as missing. First, the correction that c.1236G>A is a linkage TAG and not the causal allele: the functional lesion on that haplotype is the deep intronic c.1129-5923C>G creating a cryptic splice donor and a 44 bp pseudo-exon (PMID:20803296 added), so a panel reporting c.1236G>A reports the flag and not the mechanism. Second, the ancestry dependence of allele frequencies, which makes panel composition an equity question: variants discovered in European cohorts under-detect risk in populations they were not derived from, so a negative result means different things for different patients. Fixed the prevalence record that was recorded as UNKNOWN when the cached abstract states 7.3 per cent partial deficiency by phenotyping, and added it as a separate population from the constitutive inborn error, since prevalence of reduced enzyme activity among people about to receive the drug is a different question from prevalence of the metabolic disease. Replaced the generic uridine triacetate quote with the actual figures: 96 per cent survival with the antidote against 84 per cent mortality in the historical untreated cohort. Two snippets are quoted only as far as a following decimal point, which terminates a sentence for snippet matching; the truncation and the omitted figures are stated in each explanation. Validated: just validate passed; count-verified-snippets 38/38 (was 27/27); title audit 38 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

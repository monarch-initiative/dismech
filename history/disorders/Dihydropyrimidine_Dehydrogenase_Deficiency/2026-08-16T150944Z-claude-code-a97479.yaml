  details: |
    New entry from a claude_code deep-research report. Seven pathophysiology nodes structured as two arms sharing one hinge node (Reduced DPD Catalytic Activity): a constitutive arm running to metabolite imbalance, and an exposure-gated pharmacogenomic arm that is inert until a fluoropyrimidine is administered. The drug exposure is modelled as an environmental entry with influences_mechanisms TRIGGERS on the clearance node rather than as part of the constitutive chain, and the toxicity phenotypes sit downstream of it rather than in the constitutive phenotype list. Module conformance: myelosuppression taken at two nodes, with the disease-specific substitution being unclearable ordinary-dose 5-FU rather than an administered cytotoxic dose. epilepsy_excitation_inhibition_imbalance deliberately NOT declared because conforming would require asserting the beta-alanine mechanism the literature hedges; metabolic_intoxication_decompensation declined as over-claim. The neurological chain is curated as an EMERGING mechanistic_hypotheses group with its edges opted into that group rather than asserted, because the originating study states no genotype-phenotype correlation is established and biochemically deficient individuals can be entirely asymptomatic. A HUMAN_MODEL_MISMATCH records that the mouse beta-alanine evidence is a sleep phenotype, not seizures. Two blacklisted PMIDs: the report attributed the DPWG dosing recommendation to PMID:31745289 and its central deficient-but-asymptomatic-sibling illustration to PMID:9323575; neither resolves, both were flagged by the report's own validation, so dosing is sourced from the prospective studies instead and the sibling observation is not curated. Two errors caught in self-audit before push: a [4Fe-4S] snippet that fails because bracket notation is stripped by snippet normalisation (trimmed, with the reason recorded in the explanation), and a fabricated reference_title for PMID:41259730 which CI does not check (corrected from cache
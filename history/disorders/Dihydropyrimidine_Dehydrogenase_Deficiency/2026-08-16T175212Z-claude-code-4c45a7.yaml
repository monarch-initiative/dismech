  summary: Add the neurotoxicity node the negative animal result had nowhere to attach
    to
  details: |
    Blocking finding was a structural test failure invisible to just validate: test_animal_model_mechanism_targets builds valid targets from pathophysiology only, and my FAILS_TO_RECAPITULATE link pointed at Seizure, a phenotype. Note the asymmetry that caused the mistake, since it is not obvious from the schema: test_environmental_mechanism_targets DOES allow phenotype targets, and the environmental block in this same entry relies on that. Animal-model links do not. Fixed by adding the node rather than by working around the test, because the reviewer correctly identified the underlying modelling gap: the hypothesised neurological consequence existed only as an edge running from the metabolite node directly to the Seizure and Leukoencephalopathy phenotypes, so there was no node for a negative animal result to attach to. Added Impaired Inhibitory Neurotransmission and Neurodevelopmental Injury as a CELLULAR node carrying the beta-alanine GABA/glycine analogy evidence as PARTIAL and the white-matter-pathogenesis-unknown sentence as an explicit limit on itself; retargeted the metabolite node's edge at it, moved both phenotype edges downstream of it, and retargeted the FAILS_TO_RECAPITULATE link. All edges remain in the altered_pyrimidine_homeostasis_neurotoxicity hypothesis group, so nothing is asserted that was not asserted before; the hypothesis now simply has a node to be about. Two accuracy suggestions also taken. The environmental evidence explanation attributed the 84 per cent mortality to clearance failure, but that historical cohort is frank fluoropyrimidine overdose rather than DPD-deficient patients receiving standard doses; the explanation now states precisely what the figure bounds. And the pre-treatment genotyping treatment was bound to NCIT:C15240 Genetic Counseling, which is a different clinical act from ordering a test; retargeted to NCIT:C15709 Genetic Testing. Process note for myself: I had not been running pytest on these entries, only just validate plus the ratcheted gates, and this class of failure is invisible to all of them. Validated: just validate passed; count-verified-snippets 42/42 (was 40/40); pytest tests/test_data.py animal-model, environmental and conforms_to selections 6182 passed; check_folded_hyphens, check-title-snippets and check_environmental_evidence all OK.

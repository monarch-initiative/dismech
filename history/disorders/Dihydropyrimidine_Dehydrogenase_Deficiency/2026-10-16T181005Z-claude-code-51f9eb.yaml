  summary: 'LOINC: bind plasma uracil and DPYD genotyping codes'
  details: |
    Bound LOINC:96043-5 (Uracil [Mass/volume] in Serum or Plasma) to the Plasma uracil concentration biochemical record and to the Uracil phenotyping diagnosis row's measurements, and LOINC:93199-8 (DPYD gene targeted mutation analysis) to the DPYD genotyping diagnosis row's measurements, as part of dismech LOINC Diagnostics tranche H (pharmacogenomic tests). DPD IS the disease here, so both EMA-endorsed pre-treatment tests (phenotyping and genotyping) are the entry's own diagnostic tests. The entry keeps genotyping and phenotyping as two separate diagnosis rows (not bundled), matching the two separate measurements bound. Chose the plain Mass/volume uracil code over the Moles/volume variant since the cited evidence quotes concentrations in ng/mL. Did not bind a DPYD Activity Score code (LOINC:104665-5): the genotyping row's own text is about variant detection ('it can only find variants that are on the panel'), not a computed phenotype score. All labels verified against the Monarch KG entity API in the same step they were written. Confirmed both CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

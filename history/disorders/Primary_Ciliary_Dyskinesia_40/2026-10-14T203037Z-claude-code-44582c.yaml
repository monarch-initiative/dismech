  summary: 'Create: Primary Ciliary Dyskinesia 40 (DNAH9)'
  details: |
    New gene-specific entry for CILD40 (MONDO:0032664, DNAH9). Deep research: falcon (Edison) returned 503 'Failed to authenticate' on every attempt, including with --fallback, which did not engage, so the report used is research/Primary_Ciliary_Dyskinesia_40-deep-research-claude_code.md, run directly with the claude_code provider. preflight-dr returned WARN because DNAH5 is mentioned often; those mentions concern DNAH5 as the distal type 2 ODA partner lost with DNAH9, not a different disease. The ClinGen 2026 Definitive record (CGGV) supplied the case count, phenotype frequencies, normal-to-high nasal NO and mouse model summaries. The reduced sperm motility phenotype is deliberately left without a causal edge, because ClinGen reports DNAH9 absent from sperm flagella. The exon 2-4 knockout is recorded as FAILS_TO_RECAPITULATE for laterality. Same validation set as PCD3.

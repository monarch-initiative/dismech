  summary: 'Create: 45,X/46,XY Mixed Gonadal Dysgenesis'
  details: |
    Created kb/disorders/45_X_46_XY_Mixed_Gonadal_Dysgenesis.yaml for MONDO:0015779. Deep research used the claude_code provider. preflight-dr returned SKIP because MONDO records no causal gene for this term, so disease identity was checked manually as the dismech-references skill requires: the report distinguishes MGD from 46,XY partial gonadal dysgenesis, Swyer syndrome and persistent Mullerian duct syndrome, and its top gene mentions are the sex-determination cascade SRY, SOX9, WNT4 and AMH, matching the MONDO definition of Y-chromosome mosaicism causing abnormal gonadal development. Term validation of the report flagged HP:0000850 as unresolved and four CURIEs the ontology names as something else, HP:0000053, HP:0000407, CL:0000501 and UBERON:0000991 in a mislabelled context; separately UBERON:0003508 proved to be pedal digit blood vessel rather than Mullerian duct and GO:0060065 uterus development rather than Wnt signalling in female gonad development. None of the flagged CURIEs was bound. Nine references cited, all cached; 50 of 50 snippets verified. Modelled as two parallel arms from the mosaicism, a gonadal arm through regional SRY dosage and an independent SHOX arm, with three discussions recording contested growth hormone efficacy, contested gonadal-position tumour risk, and the absence of any molecular profile of a human MGD gonad. No genetic section, no animal models and no has_subtypes, each with the reasoning recorded in notes.

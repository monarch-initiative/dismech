  summary: Record a citable LOINC absence for mosaic 45,X/46,XY NIPT screening
  details: |
    LOINC tranche K batch 2. The 'Confirmation after prenatal detection' row states that NIPT is a screening test for this mosaic karyotype requiring postnatal confirmation, but names no specific assay and its own cited evidence describes confirmatory amniocentesis/CVS testing rather than a specific NIPT product. Searched '45,X/46,XY mosaicism cell-free DNA' and 'sex chromosome mosaicism cell-free DNA'; both return zero LOINC entities, each fully enumerable (total=0). This condition's mosaic 45,X/46,XY pattern is distinct from the simple Monosomy X risk family LOINC does carry (used for Turner-syndrome-type screening), so that family was not substituted in. No measurement was bound; the absence and both searches are recorded in a note on the row.

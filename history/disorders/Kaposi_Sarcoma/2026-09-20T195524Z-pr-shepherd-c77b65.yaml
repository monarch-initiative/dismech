  summary: Split the immunosuppression/reactivation node and correct the mTOR claim
    its own source refutes
  details: |
    PR Shepherd, answering the 2026-09-20 review on #12311.

    CRITICAL - the mTOR claim. The node description said calcineurin inhibitors, mTOR inhibitors and corticosteroids all reduce T-cell function and are associated with increased HHV-8 disease risk. PMID:42549899, the node's only reference, says the opposite: its risk list is calcineurin inhibitors, corticosteroids or T-cell-depleting agents, it describes mTOR inhibitors as exerting antiproliferative and antiangiogenic effects that may counter these mechanisms, and it recommends conversion to sirolimus or everolimus as treatment. The entry's own Reduction of Immunosuppression treatment already said the same. The agent list is now the source's, and a notes block records why mTOR inhibitors are absent so the claim is not reintroduced.

    Unsupported snippet and explanation. The original snippet mentioned neither CD8+ T cells nor lytic reactivation, and its explanation asserted that the degree of immunosuppression correlates with disease severity, which appears nowhere in the cached review. Both are replaced by the on-point sentence naming CD8+ T-cells and NK cells as the populations maintaining latency and the three agent classes that impair that control. The unsupported correlation claim is gone from the description as well as from the explanation.

    Node split. The single node bundled loss of CD8+ T-cell control with lytic reactivation in endothelial cells, in two different cell types, and carried both downstream edges off the second event. It is now two atomic nodes: Immunosuppression-Mediated Loss of CD8+ T-Cell Control of HHV-8 (CL:0000625, CL:0000623, GO:0045071 DECREASED) with a DIRECT downstream edge, carrying its own evidence, into HHV-8 Lytic Reactivation in Endothelial Cells (CL:0000115, GO:0019046 INCREASED). The endothelial cell named in the original prose is now bound. The upstream edge from HHV-8 Latent Infection of Endothelial Cells was repointed to the reactivation node, since the latent reservoir is the substrate that reactivates rather than the cause of the immunosuppression.

    GO grounding. GO:0045071 negative regulation of viral genome replication, DECREASED, now sits on the loss-of-control node where host control is what is lost. GO:0019046 release from viral latency, which names the event the node is titled for, is on the reactivation node. Both were already in cache/go/terms.csv.

    vFLIP edge dropped, beyond the review. The original node claimed increased lytic vFLIP abundance drives NF-kappaB activation. The same review classifies vFLIP with LANA-1 and vCyclin as a latent protein and vGPCR with vIL-6 as lytic, and this entry's HHV-8 Latent Infection of Endothelial Cells node expresses vFLIP latently. The edge contradicted both, in the same way the mTOR claim did, so it was removed rather than reworded; a notes block on the reactivation node records the reasoning. The vGPCR edge, which the source does support, is kept.

    Reviewer suggestions taken. NK cells added to cell_types; quote_role REVIEW_SYNTHESIS on every PMID:42549899 item, all of which are narrative synthesis in a review; and Reduction of Immunosuppression wired into the pathograph with target_mechanisms RESTORES against the loss-of-control node, evidenced by the 47.8% complete-remission meta-analysis figure.

    Validation: just validate clean (schema, terms, references), 22/22 snippets verified against the cached reference, plus check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean.

  details: |
    Replaced the deprecated percentage field on the kidney-transplant prevalence record with measure_type PERIOD_PREVALENCE and rate_per_100000 1500. Gave the Nigeria HIV cohort record ANNUAL_INCIDENCE, rate 235 (201-274) per 100,000 person-years. Split the US CDC WONDER record into men (0.99) and women (0.10) age-adjusted incidence records per 100,000 population per year, and extended the snippet to the sentence that states those rates. Replaced the usage-only evidence on the Chemotherapy to Uncontrolled Cell Proliferation edge with the DOI:10.2147/ott.s468787 sentence reporting 70-90% response to cytotoxic chemotherapy in classic KS, marked INDIRECT. Reworded the ART to HHV-8 lytic reactivation edge so it claims only an association with reduced incidence, and marked its evidence INDIRECT. Marked the lymphedema edge evidence INDIRECT, set Reduction of Immunosuppression therapeutic_modality to OTHER, and added a radiotherapy/intralesional sentence to Local Therapy. A dedicated HIV immune-dysfunction node was not added. Validated with just validate (47/47 snippets), check-enum-values, check-causal-targets, check-duplicate-keys and check-reference-titles.

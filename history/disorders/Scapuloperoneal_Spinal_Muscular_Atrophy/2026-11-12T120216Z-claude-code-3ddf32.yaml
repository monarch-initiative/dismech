  summary: Review and enrich Scapuloperoneal_Spinal_Muscular_Atrophy
  details: |
    Added SOURCE_UNSPECIFIED coarse_binding_basis on HP:0000924; tagged TRPV4 GeneReviews chapter PMID:24830047 in references; added MONDO synonyms, top-level autosomal dominant inheritance, and evidenced NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE classifications; added TRPV4 genetic testing, EMG, and laryngoscopy diagnosis entries; and added GeneReviews evidence to treatments. Addressed Round 1 review feedback on PR 17207: removed peripheral_axonal_degeneration module conformance from Lower Motor Neuron and Motor Axon Degeneration (preserving node-class-cited names TRPV4 Channel Gain-of-Function and Lower Motor Neuron and Motor Axon Degeneration) and noted the lack of a dedicated lower-motor-neuron neuronopathy module; removed unsupported GO:0097049 (motor neuron apoptotic process); moved UBERON:0003706 (laryngeal vocal fold) and the Vocal cord paralysis edge off Scapuloperoneal Denervation Pattern onto a dedicated Laryngeal Motor Denervation node; removed unvalidatable RO:0000057 qualifier on TRPV4 Molecular Genetic Testing; and clarified that the Abnormality of the skeletal system edge rests on congenital distal SMA evidence within the TRPV4 spectrum.

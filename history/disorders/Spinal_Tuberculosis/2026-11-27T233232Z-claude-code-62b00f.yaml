  summary: 'Create: Spinal_Tuberculosis'
  details: |
    Created Spinal_Tuberculosis (Pott disease, MONDO:0043836) from the stub tuberculosis, spinal, renamed to the MONDO exact synonym Spinal Tuberculosis. Pathograph: primary infection, haematogenous paradiscal seeding of the anterior vertebral body, caseating granulomatous vertebral osteomyelitis (conforms to granuloma_formation), subligamentous spread with relative disc preservation, cold abscess, vertebral collapse, kyphosis, and early (active-disease compression) versus late (stretch over healed gibbus) Pott paraplegia. Frequencies from Colmenero 2004 (PMID:15164258) and Pertuiset 1999 (PMID:10499072); surgical or pooled series cited without setting frequency. Diagnosis rows for MRI (Jung 2004), PET/CT (AO Spine 2026), CT-guided biopsy, histology, culture, Xpert (meta-analysis PMID:39280292), IGRA and chest radiography. Treatments: antituberculous chemotherapy with 6-9, 9 and 12-month alternatives and hepatotoxicity caveat, second-line MDR regimen, decompression/stabilisation, corrective osteotomy, abscess drainage. Three claude_code deep-research runs (research-disorder) all exited 4 with incomplete reports and were deleted; none is committed. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

  details: |
    Addressed review 6094776480 on PR 19201. A fourth claude_code deep-research run also returned an incomplete report and was deleted; the fifth succeeded and is committed as research/Spinal_Tuberculosis-deep-research-claude_code.md with its citations sidecar (preflight-dr SKIP: no MONDO causal gene). From it and direct PubMed searches: added craniovertebral and cervical disease (neck pain, limited neck motion, retropharyngeal abscess, dysphagia, atlantoaxial dislocation; PMID:21411704, PMID:17620809), paediatric kyphosis progression and buckling collapse (PMID:11603534, PMID:22234705), paradoxical worsening and drug-induced hepatitis on treatment (PMID:36270077), the MRC short-course trials (PMID:10422019), the 6-month meta-analysis (PMID:34784702) and Xpert Ultra on CT-guided biopsy (PMID:38173845). Narrowed the Neurological deficit description and added a note on the Myelopathy binding; replaced the spliced PMID:15149983 snippet with two continuous spans; added the surgical-population caveat to the Xpert 81.5% figure.

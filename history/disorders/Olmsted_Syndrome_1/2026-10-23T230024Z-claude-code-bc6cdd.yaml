  summary: 'Review round 1: erlotinib attribution, apoptosis evidence, SCC evidence'
  details: |
    Addressed the automated review of PR 15361. The PMID:39926429 erlotinib item now states that the L655P patient received erlotinib together with oral acitretin and carries directness INDIRECT. The PMID:27754757 adhesion/lysosome item was removed from the Keratinocyte Apoptosis node (it remains cited in the lysosomal-trafficking discussion). The erlotinib description no longer calls it the treatment of choice; it is described as the first mechanism-directed therapy with consistent responses in uncontrolled case series. The PMID:31895432 background sentence covering animal models and cell lines is regraded OTHER with quote_role BACKGROUND. The squamous cell carcinoma phenotype gains the 2015 review's malignancy-risk statement (PMID:25886873), with the caveat that it covers all genetic forms. The palmoplantar pain phenotype keeps the generic HP:0012531 Pain binding because HPO has separate Hand pain and Plantar pain terms and no term covering both. Validation: validate passed, 159/159 snippets verified, entity refs, causal targets and enum values clean.

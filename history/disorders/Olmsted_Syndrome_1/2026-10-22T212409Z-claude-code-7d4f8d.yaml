  summary: 'Create: Olmsted Syndrome 1'
  details: |
    De novo curation of Olmsted syndrome 1 (MONDO:0100296), the TRPV3 gain-of-function form of Olmsted syndrome, from the Falcon deep-research report (research/Olmsted_Syndrome_1-deep-research-falcon.md) and the primary literature it surfaced; the X-linked MBTPS2 and PERP forms are excluded. Causal chain: TRPV3 constitutive channel activation -> keratinocyte calcium overload -> apoptosis, EGFR/mTOR hyperactivation and itch signalling -> epidermal hyperproliferation/hyperkeratosis, hair follicle dysfunction and cutaneous inflammation -> the mutilating palmoplantar keratoderma, periorificial plaques, pseudoainhum, alopecia, pain, pruritus and erythromelalgia phenotypes. Inheritance bound to HP:0000006 and HP:0000007 (rare recessive families); seven TRPV3 variants recorded; erlotinib, sirolimus, acitretin and supportive care as treatments with target_mechanisms; DS-Nh, TRPV3(G573S) transgenic, pathogen-free 129S1 G573S and Trpv3 knockout mice as animal_models with modeled_mechanisms, including the FAILS_TO_RECAPITULATE finding on the pathogen-free G573S line. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER); no ClinGen TRPV3 assertion in the committed export; ORPHA:659 is the parent concept and not cited. Validated with just validate, validate-terms, count-verified-snippets (159/159), validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-enum-values, check-block-scalar-comments, validate-stubs, compliance (99.1% weighted), check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-retired-support-prose, check-reference-titles, check-case-collisions and
    check_gene_activity_grounding --against-ref origin/main (TRPV3 is grounded on
    GO:0005262 at the channel-activation node).

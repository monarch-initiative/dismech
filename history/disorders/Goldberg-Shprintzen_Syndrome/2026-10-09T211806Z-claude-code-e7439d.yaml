  details: |
    Created the Goldberg-Shprintzen syndrome (KIFBP) entry from the Perplexity deep-research report (research/Goldberg-Shprintzen_Syndrome-deep-research-perplexity.md), used as a lead list; every claim was re-anchored to a primary PubMed abstract or full text fetched with just fetch-reference. The report's own reference validation resolved 13/13 references; its two term-label mismatches (HP:0002251, HP:0001250) are paraphrases and the canonical labels are used. just preflight-dr could not run (no local mondo.db, exit 2); a manual check confirmed the report is about KIFBP-related GOSHS and explicitly separates it from SKI-related Shprintzen-Goldberg syndrome. Not carried over from the report: the ClinGen 'definitive' classification (no KIFBP record in the pinned ClinGen snapshot, so gene_disease_validity is left absent); Orphanet prevalence and frequency figures (ORPHA:66629 has no cache file and fetch-reference cannot retrieve ORPHA IDs); the ERNICA Hirschsprung guideline (PMID:42057764; generic Hirschsprung care, not GOSHS-specific); the 2024 reports conflating KIFBP with SKI or calling the syndrome dominant, which the report itself flagged as unreliable; NCIT term suggestions the report labelled as unverified. Pathophysiology is a chain from KIFBP loss of function through unrestrained kinesin motor activity and neuronal microtubule disruption to axon outgrowth failure and cortical migration defects; a direct edge from KIFBP loss of function to delayed enteric neural crest colonization (Kif1bp knockout mouse, PMID:29192291, marked INDIRECT) leads to Hirschsprung disease; plus a cytokinesis branch to microcephaly that is marked as a proposal. The mouse knockout is recorded as FAILS_TO_RECAPITULATE for Hirschsprung disease with a HUMAN_MODEL_MISMATCH discussion. Validation: just validate passed; count-verified-snippets 85/85; validate-disorders passed on the final file (85 snippets, 85 titles, 0 issues); validate-terms passed; entity-refs, causal-targets, duplicate-keys, qualifier-terms clean; check-genereviews NO_CHAPTER.

  details: |
    This disease was claimed and curated independently in two sessions (issues #13799 and #13800), producing duplicate PRs #13815 and #13811. #13811 merged first; #13815 was closed as a duplicate. Per maintainer instruction on #13815, this follow-up compares the two entries and ports the genuinely additive content #13815 had that the merged entry lacked, adapting pathophysiology/phenotype node-name references to this entry's own node names (e.g. 'Delayed Enteric Neural Crest Colonization' -> 'Delayed Enteric Neural Crest Colonization of the Gut', 'Defective Cortical Neuronal Migration and Maturation' -> 'Impaired Cortical Neuron Migration', 'Impaired Midbody Maturation and Cytokinesis' -> 'Cytokinesis Failure in Dividing Cells', and the Hirschsprung disease phenotype node 'Hirschsprung disease' -> 'Aganglionic megacolon'). Added: (1) experimental_models - KIFBP-knockout Neuro-2a cells (PMID:42538967) and GOSHS patient fibroblasts (PMID:23427148, already cited inline elsewhere in this entry but not previously linked as a structured NAM); (2) diagnosis - KIFBP sequencing with copy-number analysis and rectal biopsy, citing PMID:34421502, PMID:28277559 and PMID:42238158; (3) differential_diagnoses - Mowat-Wilson syndrome (MONDO:0009341, citing the founding 1998 delineation PMID:9719364) and isolated Hirschsprung disease (MONDO:0018309, citing PMID:42238158); (4) discussions - a HUMAN_MODEL_MISMATCH on why Kif1bp-knockout mice show delayed but not absent enteric colonization while ~70% of patients have frank aganglionosis, plus two KNOWLEDGE_GAP discussions (variable expressivity of Hirschsprung disease among carriers of the same variant, and whether microcephaly traces to cytokinesis failure or postnatal cortical apoptosis). All five new PMIDs (34421502, 28277559, 42238158, 42538967, 9719364) were freshly fetched with just fetch-reference rather than copied from the closed PR's cache, and every carried-over snippet was re-verified as an exact substring of the newly fetched text; one snippet (rectal biopsy confirmation in PMID:42238158) was swapped for the paper's own primary-result sentence instead of the duplicate's choice of a background sentence recounting a different, older case report. Two items from the duplicate PR were deliberately left out: a colostomy treatment and a supportive-care/genetic-counseling treatment, since this entry already carries ERNICA-guideline-sourced treatments for the same clinical problem and the duplicate's versions added no new mechanism or node coverage. just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass on the result (99/99 snippets and titles verified).

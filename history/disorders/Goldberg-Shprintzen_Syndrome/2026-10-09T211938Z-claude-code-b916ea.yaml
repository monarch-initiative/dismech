  summary: 'Create: Goldberg-Shprintzen_Syndrome'
  details: |
    New entry for Goldberg-Shprintzen syndrome (MONDO:0012280; KIFBP, autosomal recessive), curated from the Perplexity deep-research report research/Goldberg-Shprintzen_Syndrome-deep-research-perplexity.md (preflight-dr PASS, KIFBP mentioned 27 times). Lumped as a single DISEASE entry with no subtypes. The SKI-related Shprintzen-Goldberg syndrome is a different disorder; one SKI paper the report linked (PMID:39638120) was fetched, found to be about that disorder, and not used. The two references flagged off-topic by the report's validator (PMID:33252036 and PMC12905500/PMID:41604282) are kinesin-inhibition mechanism papers; PMID:33252036 was read and cited for normal KIFBP function, PMC12905500 was not used. Orphanet ORPHA:66629 could not be cached (fetch-reference has no ORPHA source and the pinned Orphadata snapshot has drifted), so Orphanet-only signs (hypotonia, seizures) were left out. Pathophysiology is an 8-node chain from biallelic KIFBP loss through loss of kinesin inhibition and cytoskeletal interaction to axon outgrowth failure and degeneration (zebrafish), delayed enteric neural crest colonization (Kif1bp knockout mouse), impaired cortical neuron migration and apoptosis (in utero knockdown), and a hypothetical cytokinesis route to microcephaly; model-to-human steps are marked INDIRECT_UNKNOWN_INTERMEDIATES. 21 phenotypes with HPO bindings, 2 Hirschsprung treatments citing ERNICA guidance as indirect evidence, 3 animal models. Validation: just validate, validate-terms, count-verified-snippets (80/80), check-entity-refs, check-causal-targets, check-genereviews (NO_CHAPTER) and validate-disorders all passed; 7/21 phenotypes causally connected.

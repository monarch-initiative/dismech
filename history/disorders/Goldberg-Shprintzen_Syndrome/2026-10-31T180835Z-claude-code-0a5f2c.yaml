  summary: 'Fix per-file snippet-grading clash that ejected PR #14656 from the merge
    queue'
  details: |
    PR #14656 passed its own CI but was ejected from the merge queue twice. The queue runs tests/test_snippet_grading.py, which a kb-only PR skips behind the python path filter. It failed because PMID:23427148's patient-genotype sentence ('homozygous KIAA1279 mutations in these patients led to nonsense-mediated mRNA decay and loss of KBP function') was graded HUMAN_CLINICAL on the genetic and pathophysiology nodes but IN_VITRO on the fibroblast NAM link and its readout, which the PR added. check-snippet-grading keys on the quoted sentence, so one sentence with two evidence_source values in one file is the defect. Fix: the link evidence keeps the patient-genotype sentence and is regraded HUMAN_CLINICAL to match the file (the model is informative because the patients are genetically confirmed loss-of-function); the readout, which measures KBP in the fibroblasts and is genuinely in vitro, now cites the in-vitro fibroblast sentence ('Despite the absence of functional KBP, respiratory chain complex activity in patient fibroblasts was normal'), already graded IN_VITRO at the model level and the mitochondrial-REFUTE node. No other kb entry cites either sentence, so there is no cross-file exposure. validate passes, 101/101 snippets verify, and the entry carries no remaining per-file grading divergence.

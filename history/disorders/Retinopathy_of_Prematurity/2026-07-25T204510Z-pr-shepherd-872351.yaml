  summary: 'Review follow-up: anti-VEGF recurrence evidence SUPPORT -> PARTIAL'
  details: |
    PR #6963 review follow-up (ai4c-reviewer IMPORTANT #2, second item). The PMID:39524166 evidence on the anti-VEGF treatment was graded SUPPORT with an explanation claiming the meta-analysis 'quantifies anti-VEGF efficacy'. The quoted result is the opposite kind of finding: RR=2.14 for HIGHER recurrence with anti-VEGF than with laser photocoagulation. Changed supports to PARTIAL and rewrote the explanation to describe the trade-off - the result establishes anti-VEGF as an established, studied ROP modality and characterises its principal drawback, but does not evidence efficacy. Snippet unchanged and re-verified against references_cache/PMID_39524166.md.

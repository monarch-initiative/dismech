  summary: Drop unsupported FREQUENT band; regrade denominator snippet
  details: |
    PR shepherd run addressing ai4c-reviewer suggestion c on PR #6963.

    The Retinopathy of Prematurity phenotype carried frequency: FREQUENT supported only by a snippet
    reporting that 141550 infants received ROP screening in Germany. That is a denominator, not a rate
    among those screened. Per docs/frequency-evidence-guidelines.md the correct action is to omit the
    band rather than justify it, so the frequency was removed and a notes line records why, so a future
    curator does not re-add it from the same snippet.

    The evidence item itself was regraded SUPPORT to PARTIAL: the registry does establish that ROP
    screening is routine in preterm care, but the quoted figure does not license a frequency claim.

    Validation: just validate and just validate-references pass.

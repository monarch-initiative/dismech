tor, its association item regraded PARTIAL because the snippet settles neither the NTG scope nor the typing, notes records where the NTG scoping comes from, and evidence_source backfilled on all four MYOC/OPTN items (OTHER for the review, IN_VITRO for the cell-based optineurin study). Validation: linkml-validate clean on all six entries; term validator passed on the two entries with term changes; 138 snippets re-verified as exact whitespace-normalized substrings of references_cache with zero mismatches; reference validator control-tested live against the newly added bone-spicule snippet (corrupt then restore). Validator cache churn was discarded, not committed.

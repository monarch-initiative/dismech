  summary: 'Genetics pass: bind FXN to the four onset/reflex subtype rows'
  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    This entry was already the most complete in the tranche on the genetics side:
    FXN carries relationship_type: CAUSATIVE, variant_origin: GERMLINE, a
    variants: record modelling the intron 1 GAA repeat expansion with
    regulatory_category: LOE and regulatory_element_type: SILENCER, ClinGen
    definitive evidence, and gene bindings on the two upstream pathophysiology
    nodes. The checklist term MONDO:0100340 (Friedreich ataxia 1) is already
    recorded as a skos:narrowMatch under mappings with a written justification,
    and MONDO:0100339 is the entry's anchor because the entry also covers FARR,
    a MONDO sibling of FRDA1 rather than a descendant.

    Change made: the four has_subtypes rows (Typical FRDA, LOFA, VLOFA, FARR)
    carried no genes: list although each row's own description states it is
    biallelic FXN disease. genes: FXN was added to all four.

    Nothing was changed about the repeat lesion. It is already modelled honestly
    as a non-coding loss-of-expression mechanism rather than as a coding mutation,
    and the compound-heterozygote minority is already recorded, with PMID:28789479
    cited for why one mechanism chain covers both variant classes. No
    functional_impact_category was added at the variant level: the entry's
    regulatory_category: LOE already states what the expansion does, and inventing
    a hypomorphic-versus-null grading would go beyond what the cited sources say.

    Prose self-review: the hypertrophic cardiomyopathy phenotype description
    said "approximately 60-75% of patients" while the only source cited in that
    block, the GeneReviews chapter, says "about two thirds of individuals", and
    no other reference in the entry carries a 60-75% figure. The description
    now states what its source states.


    Validation: just validate, validate-terms, count-verified-snippets (197/197),
    check-genereviews (already TAGGED), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings), validate-disorders.

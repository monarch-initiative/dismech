  details: |
    Augmented the existing FRDA entry. Added GeneReviews baseline PMID:20301458 as a tagged top-level reference and cross-referenced its Clinical Characteristics. Filled the evidence gap on the pre-existing Peripheral Neuropathy phenotype. Added four GeneReviews/ORPHA-documented phenotypes previously absent: Babinski sign HP:0003487, Areflexia of lower limbs HP:0002522, Spasticity HP:0001257, and Optic atrophy HP:0000648 with an honest PARTIAL note on the clinical-versus-subclinical frequency discrepancy between ORPHA and Koeppen PMID:21315377. Wired all new phenotypes into the pathograph as downstream causal edges from the corticospinal/dentate node and the DRG sensory neuronopathy node. Captured the GeneReviews Agents/Circumstances-to-Avoid neurotoxic-medication drug-safety warning on Supportive Care. Added evidence to Genetic Counseling, genetic-inheritance, and skeletal-deformity edges. Deep research: reused the existing falcon report and the previously curated openscientist canonical-hypothesis report. All snippets are exact substrings of cached references. Validated with just validate at 114/114 snippets verified, just validate-terms passed, and compliance rose from 93.3 to 95.9 percent.

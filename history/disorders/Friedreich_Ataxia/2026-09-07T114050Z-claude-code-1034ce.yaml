  summary: Address pre-PR red-team review of the FRDA1 curation
  details: |
    Addresses a pre-PR red-team review of commit cf74a5466 (the FRDA1 curation).
    The review confirmed the lump/split decision, the skos:narrowMatch direction,
    every new ontology binding, and the prior history record's numbers; it found
    real evidence-integrity defects, fixed here.

    EVIDENCE INTEGRITY.
    - The SGT-212 -> Dentate Nucleus mechanism link cited the same NHP
      biodistribution sentence that was already the treatment's entry-level
      evidence. That is exactly the reuse the prior record said had been avoided,
      so the link now cites a distinct sentence (cadaveric MRI-guided cannula
      placement) and its directness drops DIRECT -> INDIRECT: cadaver feasibility
      shows the dentate nucleus can be reached, not that reaching it slows
      degeneration. evidence_source also corrected to OTHER, since cadaveric
      surgical feasibility is neither a clinical nor a model-organism result.
    - The new Dorsal Root Ganglion -> Impaired Vibratory Sensation edge was
      evidenced by a bare enumeration of frequent signs, which asserts no
      causality, while its explanation claimed the source presented them "as
      consequences of the sensory lesion". Replaced with the causal sentence in
      the same cached paper: dorsal column fiber loss is "secondary to the lesion
      in DRG".
    - Hearing Impairment: the device-ineffectiveness quote carries the
      guideline's GPP (expert-opinion) marker where its neighbours carry graded
      evidence, so evidence_source moves HUMAN_CLINICAL -> OTHER. The
      description's retrocochlear claim and the notes' auditory-neuropathy claim
      were both uncited; each now has a direct quote from PMID:21315377, already
      cached and already cited elsewhere in this entry. The surveillance schedule
      stated in the description is now sourced to its grade-B guideline sentence.

    ANIMAL MODELS. The review's strongest finding: three model papers had been
    fetched into references_cache and left uncited, and the entry had no model
    sections at all, so no model-to-pathograph join points. Added animal_models
    with three models and six modeled_mechanisms links: the conditional Fxn
    knockout (MCK-Cre / NSE-Cre, PMID:11175786), the humanized GAA-repeat YAC
    transgenic (YG8R/YG22R, PMID:16919418), and the AAV9-hFXN rescue arm
    (PMID:26015982, relationship RESCUES). Each link carries its own evidence
    separate from the model-level evidence, and every limitation is specific
    rather than generic.

    `just model-scale-audit --strict` then failed, correctly, on my own link: the
    conditional-knockout link to Mitochondrial Bioenergetic Failure is tagged
    model_scale MOLECULAR against a CELLULAR node, which is an upward
    extrapolation and requires a caveat. Confirmed by stashing that the strict
    audit passed on the committed tree, so the failure was newly introduced, not
    inherited. Added limitations plus two typed divergences
    (SCALE_EXTRAPOLATION, CAUSE_UNREPRESENTED); strict now exits 0.

    KNOWLEDGE GAP. Added the iron-ordering discussion the model work exposed:
    the conditional knockout shows intramitochondrial iron accumulating only
    after Fe-S enzyme inactivation and after pathology onset, which argues iron
    is downstream rather than initiating. That is a mouse result not established
    in human tissue, and it bears on whether chelation can be disease-modifying.
    It attaches to both the pathophysiology node and the model that produced the
    observation.

    OVERCLAIM CORRECTIONS.
    - The Finland prevalence notes said the study "attributes" the low carrier
      frequency to absent 28-36 GAA reservoir alleles. It does not: it reports
      the absent alleles as a finding and attributes the northern enrichment to
      1500s internal migration. Both the notes and the evidence explanation now
      stop at what the paper says.
    - Added a notes line on Impaired Vibratory Sensation recording that its
      Orphanet FREQUENT band sits a tier below Orphanet's VERY_FREQUENT for
      proprioception, even though the consensus guideline sentence cited for both
      lists them together. Bands kept as Orphanet records them; divergence noted
      rather than silently resolved.
    - Fixed one #10003 prose-rot instance adjacent to touched content: the optic
      atrophy discussion rationale named the retired `supports: PARTIAL` value
      while the evidence item below it correctly reads SUPPORT.

    ONE REVIEW FINDING NOT ACTED ON. The review reported that MONDO:0800301
    appears nowhere in the file, making the mapping justification's FARR premise
    unverifiable, and asked for it to be bound. It is already bound: the FARR
    entry in has_subtypes carries subtype_term MONDO:0800301. The pytest warning
    about subtypes missing subtype_term lists only Typical FRDA, LOFA and VLOFA,
    which corroborates this. No change made.

    A second finding was answered rather than changed. The review asked why the
    Investigational Frataxin-Restoring Therapies -> Cardiomyocyte Mitochondrial
    Injury link cites a review when the primary trial sits in the same block. All
    of that trial's substantive result sentences are already used elsewhere in
    the entry, and CLAUDE.md holds that a review is the right citation for a
    synthesis claim, which is what a category-level treatment makes. The
    explanation now states that reasoning and points at the dedicated
    AAVrh.10hFXN treatment carrying the primary trial. The pre-existing
    treatment_effect divergence between those two links (INHIBITS vs MODULATES)
    is left alone as pre-existing modeling, not introduced here.

    VALIDATION. `just validate-disorders` passes: schema clean, terms clean,
    174/174 snippets verified (was 160/160). Full `pytest tests/test_data.py`:
    6158 passed. Also passing: model-scale-audit --strict, validate-terms,
    verify-datasets (6/6), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-folded-hyphens, check-environmental-evidence. The new
    animal_models#Conditional Fxn knockout mouse (MCK-Cre and NSE-Cre) entity
    reference was checked against a deliberate negative control to confirm it
    resolves rather than being silently skipped. Compliance 99.1% -> 98.9%: the
    figure moved because animal_models added scored slots, over a larger
    denominator (371/375 vs 346/349).

  details: |
    Enriched Friedreich_Ataxia with recent clinical practice guidelines (issue #4878). Added evidence to the previously evidence-thin Cardiac Management treatment from the 2022 HRS expert consensus on arrhythmic risk in neuromuscular disorders (PMID:35500790), which explicitly lists Friedreich ataxia. Added a new Riluzole for Symptomatic Ataxia treatment (CHEBI:8863) and reinforced Supportive and Symptomatic Care with rehabilitation evidence, both from the AAN systematic-review guideline on treatment of cerebellar motor dysfunction and ataxia (PMID:29440566), which names Friedreich ataxia. Excluded PMID:28838934 (AHA cardiac involvement in NMD scientific statement) because its abstract never names Friedreich ataxia nor lists it as an example, offering no Friedreich-applicable quotable sentence. All snippets verified as exact whitespace-normalized substrings; schema and term validation pass.

  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the part of the earlier OpenScientist assessment sweep (branch os-review-fable) that did not merge with PR #12010, re-derived against current main. Four knowledge-gap discussions added, each with its citation re-verified against a freshly fetched references_cache record: tissue_specific_effector_divergence_frda (PMID:41628678 SUPPORT plus PMID:23169664 REFUTE, modelling the DRG-ferroptosis vs cardiac-mitophagy divergence as contested rather than settled), cardiac_neurologic_severity_dissociation_frda (PMID:22379112, 205-patient cross-sectional dissociation), neuroinflammation_primary_vs_secondary_frda (PMID:38631900, microglial homeostatic loss), somatic_gaa_instability_tissue_selectivity_frda (PMID:29261783, tissue-specific GAA tract lengths). Two mechanism annotations were added because main carried them only as prose inside the hypothesis notes: ferroptosis (GO:0097707, INCREASED) plus a dual-phase hypoplasia-then-atrophy description on the DRG node with PMID:23334592 and PMID:39243573 node-level evidence, and mitophagy (GO:0000423, DECREASED) on the cardiomyocyte node with PMID:41628678. Omaveloxolone now also targets the DRG node via PMID:41579709. Three prose corrections were still needed on main and were applied: the hypothesis notes and the PMID:42157962 explanation both claimed phenotype rescue in non-human primates, where that study reports repletion and biodistribution in primate and phenotype rescue in mouse only; and the PMID:25112865 deferiprone explanation claimed the trial demonstrates the primary lesion, softened to what a 6-month safety trial whose placebo arm did not deteriorate can support. Two deviations from the old sweep: the microglia gap rationale no longer cites unshown patient fibroblast data (that claim belonged to PMID:40308559, which the sweep did not cite in the discussion), and the contested-cardiac wording now names the muscle-creatine-kinase conditional knockout rather than asserting the two cardiac papers used the same model. Ontology CURIEs were taken from cache/go/terms.csv and the biologicalprocessterm enum cache, not from the report. The missing assessment sidecar (openscientist-assessment-by-claude-opus-5.yaml and its declared .md artifact) was copied byte-identically from os-review-fable. Verified: linkml-validate clean, 197/197 snippets verified, duplicate-key, entity-ref, causal-target, enum-value, snippet-boundary and snippet-grading checks all clean.

  summary: Curate FRDA1 (MONDO:0100340) into the existing Friedreich Ataxia entry
  details: |
    Curation of "Friedreich ataxia 1" (MONDO:0100340), requested via /curate.

    LUMP/SPLIT DECISION. No new entry was created. MONDO:0100340 is the
    FXN-caused child of MONDO:0100339, and the existing Friedreich_Ataxia entry
    is bound to that parent while curating FXN GAA-repeat disease throughout, so
    a separate FRDA1 file would have duplicated a 2,034-line entry. Instead
    MONDO:0100340 was recorded in mappings.mondo_mappings with
    mapping_predicate skos:narrowMatch, which per the repository's coverage rule
    counts as curated. The entry stays bound one level up because it also covers
    FARR (MONDO:0800301), verified with OAK to be a direct sibling of FRDA1
    rather than a descendant, so the grouping term is the narrowest single term
    spanning what is curated. The mapping notes record that the third child,
    Friedreich ataxia 2 (MONDO:0011175), is defined by MONDO only as a 9p23-p11
    linkage locus and carries no RO:0004003 gene relation, so it is out of
    scope. `just tidy-stubs` was re-run afterwards and now reports the stub as
    already_curated, which is why stubs/Friedreich_Ataxia_1.yaml is deleted in
    this change. The stub had survived the #9910 sweep only because the entry
    bound the parent identifier.

    DEEP RESEARCH. falcon was requested and could not run: the Edison account
    returned HTTP 402 (out of credits). Rather than substituting a provider by
    hand, the run was repeated with --fallback, so openscientist produced the
    report and the substitution is recorded in the report frontmatter
    (fell_back: true, requested_provider: falcon, provider_attempts with the 402
    and its remedy). New report:
    research/Friedreich_Ataxia-deep-research-openscientist.md (+ citations
    sidecar and artifacts). The pre-existing April 2026 falcon report is
    unchanged: the fallback rename had consumed it in the working tree, and it
    was restored from HEAD and diffed to confirm it is byte-identical.

    RESEARCH VALIDATION READ BEFORE USE. reference_validation: 20/20 resolved, 0
    unresolved, 0 off topic. term_validation: needs_review true, driven by one
    mislabel - the report offers HP:0003390 for "impaired vibration sense", but
    HP calls that term Sensory axonal neuropathy. That CURIE was NOT bound; OAK
    was used to find the correct term, HP:0002495 Impaired vibratory sensation,
    which Orphanet also carries with a frequency. The three "worth a second
    look" terms (HP:0001251, HP:0001284, HP:0003487) are paraphrases of terms
    the entry already binds correctly.

    NAMED ENTITY CONFUSION PREFLIGHT. `just preflight-dr` against MONDO:0100339
    SKIPs, because the grouping term records no causal gene. Re-run against
    MONDO:0100340 it discriminates properly: canonical gene FXN, FXN mentioned
    31 times, and OMIM 229300 matching on both sides. Its WARN that rival gene
    GAA is mentioned 27 times is a false positive - every "GAA" in the report is
    the trinucleotide repeat, and the report has zero mentions of Pompe disease,
    acid alpha-glucosidase, or glycogen storage disease. Recorded here because
    the same false positive will recur on any GAA-repeat disease.

    CONTENT ADDED.
    - datasets: section was an empty key (0% compliance). Six GEO series added,
      each named for FRDA in its own title and manually triaged for relevance,
      not just resolution. Titles copied verbatim, including GEO's own misspelled
      "Friedreich?s Ataxia" in GSE108200. All six verified with
      `just verify-datasets` (6/6 OK) and their GEO_*.md caches are committed.
    - phenotypes: three cardinal signs were missing - Impaired Proprioception
      (HP:0010831), Impaired Vibratory Sensation (HP:0002495), and Hearing
      Impairment (HP:0000365). The first two were also wired into the pathograph
      as downstream targets of the dorsal root ganglion node, where they had
      previously existed only as free-text intermediate_mechanisms. Hearing was
      deliberately bound to the generic HP:0000365 rather than a sensorineural
      child term: Orphanet uses the generic term and the deficit is an auditory
      neuropathy, so a cochlear binding would be narrower than the evidence
      supports. That reasoning is recorded in the phenotype notes.
    - progression: had only an Onset phase. Added Loss of ambulation (FA-COMS,
      median 11.5y after first symptoms in early-onset patients, PMID:31938785)
      and Mortality (PMID:41273607), with the Brazilian cohort's single-centre
      scope stated in the notes.
    - prevalence: the Global record had no evidence; added a citation flagged
      INDIRECT with its two limits stated in the explanation (a secondary
      statement in a biomarker paper's introduction, and Caucasian-specific
      against a globally scoped record). Added a Finland CARRIER_FREQUENCY
      record (PMID:11810294) recording the absent 28-36 GAA reservoir alleles
      that explain the founder-level regional variation.
    - genetic: the notes asserted an inverse repeat-length/onset relationship
      with nothing citing it. Added PMID:8751856 (smaller allele accounts for
      ~50% of onset variance; allele length higher with diabetes and
      cardiomyopathy) and PMID:28789479 (residual frataxin, not mutation
      identity, sets the phenotype - which is why one mechanism chain covers
      both homozygotes and compound heterozygotes).
    - pathophysiology: biological_scale added to all nine nodes; none carried
      one. No node needed two values, so no node was split.
    - treatments: target_mechanisms evidence went from 3/11 to 8/11. Five links
      gained their own edge-level evidence, distinct from the node-level
      citations already present.

    DELIBERATELY NOT DONE. Three target_mechanisms links are left uncited
    because no distinct supporting quote was found: Cardiac Management ->
    Cardiomyocyte Mitochondrial Injury (the HRS consensus abstract does not
    discuss afterload or myocardial energy demand), Riluzole -> Dentate Nucleus
    (the only supporting sentence is already the node-level citation), and ASO
    -> FXN GAA node (likewise). Reusing a node's citation for its edge is the
    antipattern the curation guidance warns about, so those were left honest
    rather than papered over. The deprecated `percentage:` field on the two
    pre-existing prevalence records was also left alone as out of scope.

    VALIDATION. `just validate-disorders kb/disorders/Friedreich_Ataxia.yaml`
    passed in full: schema clean, terms clean, 160/160 snippets verified against
    cached references. Also passing: validate-terms, check-not4curation,
    verify-datasets (6/6), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-folded-hyphens, check-environmental-evidence, check-stubs.
    Compliance rose from 96.6% (286/296) to 99.1% (346/349).

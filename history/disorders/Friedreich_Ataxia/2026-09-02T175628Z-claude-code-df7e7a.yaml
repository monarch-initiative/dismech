  summary: 'Integrate assessed OpenScientist findings: tissue-specific effector pathways'
  details: |
    Assessed the OpenScientist report on hypothesis canonical_fxn_loss_of_function (kb/hypotheses/Friedreich_Ataxia/canonical_fxn_loss_of_function/openscientist.md, 105 papers reviewed, 31 citations) and wrote the assessment sidecar openscientist-assessment-by-claude-opus-5.yaml plus its .md narrative. Verdict SUPPORTED: the seed was this entry's own CANONICAL hypothesis, so confirming the chain added nothing new; the value was in the tissue-specific qualifications. Twenty of the 31 citations were fetched into references_cache and checked against the cached source; no fabricated identifier and no hallucinated quotation was found.

    INTEGRATED. Dorsal Root Ganglion Sensory Neuronopathy node: added ferroptosis (GO:0097707, INCREASED), a description paragraph covering the dual-phase hypoplasia-plus-atrophy ganglion lesion and the ferroptotic effector pathway, and evidence PMID:23334592 (HUMAN_CLINICAL, Koeppen neuropathology of 35 patients, full text cached) and PMID:39243573 (MODEL_ORGANISM). Cardiomyocyte Mitochondrial Injury node: added mitophagy (GO:0000423, DECREASED), a description paragraph on the mTOR-TFEB lysosomal axis and the contested oxidative-stress status, and evidence PMID:41628678 (MODEL_ORGANISM). Omaveloxolone treatment: a second target_mechanisms link to the DRG node with PMID:41579709 (IN_VITRO); the drug previously touched only the shared mitochondrial node. Four KNOWLEDGE_GAP discussions: tissue_specific_effector_divergence_frda (PMID:41628678 SUPPORT, PMID:23169664 REFUTE), cardiac_neurologic_severity_dissociation_frda (PMID:22379112, n=205), neuroinflammation_primary_vs_secondary_frda (PMID:38631900), somatic_gaa_instability_tissue_selectivity_frda (PMID:29261783).

    CORRECTED TWO OVERSTATEMENTS the entry had inherited from the report. The PMID:42157962 explanation and the hypothesis notes attributed phenotype rescue to the non-human primate arm; the paper reports protein repletion in mouse and primate but phenotype rescue in FA mouse models only. The PMID:25112865 explanation said the deferiprone trial demonstrates that Fe-S cluster deficiency rather than iron excess is the primary neurological lesion; it is a 6-month safety and tolerability trial whose authors note the placebo arm did not deteriorate, so the wording now says consistent with rather than demonstrates.

    NOT DONE, DELIBERATELY. No status change; the report's own candidate-status section says retain CANONICAL. No new mechanistic_hypotheses entry for the ferroptosis, mitophagy, neuroinflammation, blood-brain-barrier or developmental-hypoplasia alternative models: each is a downstream or parallel consequence of the same frataxin lesion rather than a competing account of the disease, and the first two now sit as processes on the tissue nodes they act in. No microglial or blood-brain-barrier pathophysiology node, since that evidence is one mouse single-cell dataset plus fibroblasts (PMID:38631900, PMID:40308559) and one in vitro shRNA barrier model (PMID:36798283). Nothing from the FDX2/FXN competition lead, whose therapeutic limb rests on a perspective piece (PMID:42150975) with no compound and no in vivo data. Nothing from the NfL trajectory (PMID:40498047), which is already curated with appropriately hedged wording. Nothing from the stale 2016 Cochrane trial-scarcity gap (PMID:27572719), which predates the MOXIe programme the entry already curates.

    REJECTED LEAD. The report proposes CL:0011113 as DRG proprioceptive neuron; that CURIE is spiral ganglion neuron, a cochlear cell type. The entry's existing CL:1001451 sensory neuron of dorsal root ganglion is correct. Both GO terms used here were re-derived from cache/enums/biologicalprocessterm_dd47231dca51.csv rather than copied from the report.

    VALIDATION. count-verified-snippets 140/140 verified; check-duplicate-keys, check-entity-refs, check-causal-targets and check-enum-values all OK on the target file; check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading report no findings in these files; validate-hypothesis-assessment passes.

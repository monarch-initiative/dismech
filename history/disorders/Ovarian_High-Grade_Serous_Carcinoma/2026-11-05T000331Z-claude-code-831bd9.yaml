  summary: Restore the murine HIPEC animal model dropped in the Metastatic_* fold
  details: |
    PR #8515 (issue #6426) added a noninvasive external-abdominal-heat murine HIPEC model (PPR:PPR1273953) as an animal_models entry on Metastatic_Ovarian_Cancer. When #9808 folded that entry into Ovarian_High-Grade_Serous_Carcinoma, the HIPEC treatment and the hipec_mechanism_of_benefit discussion were carried over but the animal_models block was not, leaving the discussion notes and one evidence explanation referring to model content that was no longer in the entry. The block is restored verbatim from commit 4c82fa44287, with one sentence added to the link limitations noting that ID8 is a Trp53 wild-type ovarian surface epithelium line, an imperfect stand-in for TP53-mutant HGSC. Its PERTURBS link targets Transcoelomic Dissemination and Spheroid Formation, which exists in the parent entry. Validated with just validate, validate-terms, count-verified-snippets (99/99), check-entity-refs, check-causal-targets, check-snippet-grading and validate-disorders.

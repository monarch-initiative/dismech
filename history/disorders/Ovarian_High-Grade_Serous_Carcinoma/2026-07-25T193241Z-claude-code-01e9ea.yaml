  summary: 'Review: HGSOC - bevacizumab mistyped as immunotherapy, wrong ARID1A frequency
    claim, prostate-only resistance evidence'
  details: |
    Manual claim-evidence review. Fixed: (1) bevacizumab was typed treatment_term NCIT:C15262 Immunotherapy - it is an anti-VEGF monoclonal antibody, retyped to NCIT:C93352 Targeted Therapy with therapeutic_modality: MONOCLONAL_ANTIBODY; (2) the arid1a_hippo_taz_progression_model asserted ARID1A 'is recurrently altered in HGSOC', which is wrong for this histotype - ARID1A mutation characterises clear cell and endometrioid ovarian carcinoma, and the TCGA analysis cited in the same file (PMID:21720365) lists NF1, BRCA1, BRCA2, RB1 and CDK12 as the recurrently mutated genes with no ARID1A; added an explicit scope caveat noting the internal contradiction and that the supporting reference is in vitro work in generic ovarian cancer cells; (3) added an EVIDENCE CAVEAT to the CANONICAL restored_hrr_reversion_resistance_model recording that all of its evidence, and all evidence on the BRCA Reversion and POLQ Escape nodes, comes from metastatic castration-resistant prostate cancer (TRITON2, TOPARP-B) with no ovarian-specific citation.
    Outcome needs_followup: closing the prostate-only evidence gap requires fetching and snippet-verifying new ovarian reversion citations - filed as issue #6965. No prevalence block.

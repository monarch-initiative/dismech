  summary: 'Integrate assessed OpenScientist findings: POLQ pivot resistance model'
  details: |
    Assessed kb/hypotheses/Ovarian_High-Grade_Serous_Carcinoma/polq_pivot_resistance_model/openscientist.md (verdict PARTIALLY_SUPPORTED; sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml, 16 claims). Integrated the RETAINED and QUALIFIED claims whose sources were not yet cited in this entry. On the polq_pivot_resistance_model hypothesis: added PMID:33091561 twice (the Tobalina meta-analysis of 327 patients, 234 ovarian, tying microhomology at reversion deletions to mutagenic end joining and singling out BRCA2; and separately its proposal that pharmacological end-joining inhibition could prevent reversion acquisition, quoted so the therapeutic premise is recorded as a proposal rather than a result), PMID:36455556 for the post-replicative ssDNA gap-sealing function the description already named but did not evidence, and PMID:19630521 as a REFUTE item bounding the no-host-genotoxicity premise (Polq-null murine stromal cells are radiosensitized and Polq-null mice carry excess micronucleated reticulocytes). Qualified the hypothesis description accordingly: BRCA2 scoping, the viability-versus-genome-stability distinction, and the untested step from signature to therapeutic claim. On the POLQ-Mediated Microhomology Repair Escape node, whose only evidence was prostate (TOPARP-B): added PMID:35385581, the ovarian anchor showing TMEJ templated insertions are specific to biallelic BRCA2 and track survival after platinum, and PMID:24614976, the C. elegans genetic causality for the microhomology-flanked deletion class, each explanation stating what the source does not show. Added discussion gap_hgsoc_tmej_brca1_versus_brca2 (KNOWLEDGE_GAP) with a genotype-stratified reversion-junction experiment, since both signature datasets qualify their claims to BRCA2 and the entry models one POLQ escape node for all HRD subclones. Deliberately not integrated: PMID:40460119's ~50 percent upfront-resistance figure, which is stated in a metastatic castration-resistant prostate cancer frame and derived in murine prostate organoids, so importing it into an ovarian entry would repeat the prostate-to-ovary transfer the restored_hrr_reversion_resistance_model evidence caveat already warns about; PMID:38041241, whose correct 33.3 percent is 7 microhomology deletions among 21 reversion events in 12 patients, only 4 of them ovarian or tubal or peritoneal; PMID:41335237, two reversion events in a ten-patient breast trial; the cGAS-STING and APOBEC3A branches, which are pancreatic and pan-cancer and do not bear on this entry's nodes; and the report's candidate GO terms, which resolve correctly but are coarser than the GO:0097681 and GO:0000724 bindings the entry already carries. Status left at EMERGING as the report itself recommends. Left the restored_hrr_reversion_resistance_model evidence caveat untouched, since no ovarian-specific reversion evidence was added to that hypothesis or its node. Checks run: validate-hypothesis-assessment (pass), count-verified-snippets (82/96 verified, 14 skipped by prefix, no failures), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values (all pass).

  summary: Add HIPEC treatment, mechanism links, preprint HIPEC mouse model and mechanism-of-benefit
    knowledge gap
  details: |
    Curated from monarch-initiative/dismech#6426 ([preprint-scan] Metastatic Ovarian Cancer: hyperthermic intraperitoneal chemotherapy mechanisms).

    Added a scoped "Hyperthermic Intraperitoneal Chemotherapy at Interval Cytoreductive Surgery" treatment (treatment_term NCIT:C91835, therapeutic_agent CHEBI:27899 cisplatin, therapeutic_modality OTHER) with two target_mechanisms links: INHIBITS on "Transcoelomic Dissemination and Spheroid Formation" (compartmental delivery and the peritoneal-plasma barrier, PMID:36077477) and ACTIVATES on "BRCA-Associated Homologous Recombination Deficiency" (hyperthermia degrades BRCA2 and suppresses homologous recombination, PMID:36191972). Clinical evidence is OVHIPEC-1 (PMID:29342393, multicentre phase 3 RCT); a separate PARTIAL evidence item records that the benefit is confined to the interval-debulking setting and absent after primary debulking, and a treatment-level note scopes the entry accordingly.

    Added the issue's preprint (PPR:PPR1273953) as an animal_models entry - a noninvasive external-abdominal-heat murine HIPEC model in C57BL/6J and NSG mice bearing intraperitoneal ID8-luc/IE9 tumours - with a PERTURBS modeled_mechanisms link (fidelity LOW, explicit limitations covering external heating versus intraperitoneal perfusion, murine scale, and the absence of prior neoadjuvant chemotherapy and cytoreduction) plus one grounded readout. The preprint is used only as support for claims about its own model, never as sole support for a human mechanism or phenotype.

    Added a KNOWLEDGE_GAP discussion (hipec_mechanism_of_benefit) attached to both mechanism nodes, recording that the survival benefit is randomised but its mechanism unestablished, including the negative retrospective meta-analysis and the proposed BRCA/HRR-status stratification that would separate the delivery route from the homologous-recombination route.

    Validation run: just validate PASS; just validate-terms PASS; just count-verified-snippets 29/42 verified against cached references with 13 skipped by prefix (DOI and ega dataset accessions) and 0 failures; just check-title-snippets OK; just validate-disorders PASS (its 3 remaining warnings are pre-existing unfetchable ega: dataset accessions, unrelated to this change); pytest tests/test_data.py -k "readout or treatment_mechanism or discussion or animal or attaches" 8182 passed. All four new reference cache files were created with just fetch-reference, never by hand.

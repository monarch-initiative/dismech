  summary: Review biliary atresia with full-text mechanism, diagnostic and trial evidence
  details: |
    Reviewed the full existing entry, eight prior histories, and the scientific deep-research report and all citation leads. Used generated cached full texts to separate human association from animal/culture interventions, correct GPC1/ADD3/PKD1L1 causal strength, retain negative RRV and prenatal-toxin results, and add immune, developmental and histopathologic detail. Split cholestasis from cirrhotic remodeling and connected clinical manifestations; added model limitations and reporter-system context. Corrected direct-bilirubin thresholds and diagnostic exclusion claims, distinguished assay-specific MMP7 results, and incorporated newborn screening limitations. Compared START with the later steroid trial, negative EMBARK and BOLD outcomes, IVIG historical controls, the distinct NAC pilots and possibly related tachycardia, and observational budesonide/pruritus findings. Verified trial statuses using the live ClinicalTrials.gov API on 1 October 2026, with sponsor-reported BOLD results distinguished from peer-reviewed evidence. Read the CD177 corrigendum on the publisher site; its generated bibliographic cache has no full text. Content-completeness review covered phenotypes, overlapping subgroups, mechanisms, genetic susceptibility, diagnoses, treatments/trials and model/reference consumption. No infectious/toxin etiology is asserted in humans. No new research report or dataset analysis was produced. Two precise histopathology descriptors remain unbound because available terms do not meet the schema hierarchy; no misleading replacement was selected. Source audit and extraction artifacts are local working notes. Evidence snippets and titles were verified against generated caches; only cited generated cache files are included.

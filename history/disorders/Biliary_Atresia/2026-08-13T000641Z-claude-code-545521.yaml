  summary: 'Create: Biliary Atresia'
  details: |
    Created a new de-novo entry for Biliary Atresia (MONDO:0008867), a complex /
    multifactorial perinatal fibro-obliterative cholangiopathy of the intra- and
    extrahepatic bile ducts.

    Deep research was performed with the claude_code provider
    (research/Biliary_Atresia-deep-research-claude_code.md; 22 web searches, 24
    turns, 84 citations). The report was treated as leads, not ground truth: every
    PMID was fetched and each snippet verified as an exact abstract substring, and
    all ontology IDs were re-verified with OAK. Notably the report suggested
    incorrect HGNC IDs (ADD3 as hgnc:238=ADCY7, GPC1 as hgnc:4451=GPC3); the correct
    IDs (ADD3=hgnc:245, GPC1=hgnc:4449, PKD1L1=hgnc:18053, CFC1=hgnc:18292) were used.

    Curated a 4-node pathophysiology chain: cholangiocyte injury of the bile duct
    epithelium -> Th1/Th17 immune-mediated periductal inflammation -> progressive
    periductal fibrosis and ductal obliteration (conforms_to
    fibrotic_response#Mesenchymal Cell Activation, hepatic stellate cell as the
    organ-specific mesenchymal substitution) -> cholestasis and progression to
    biliary cirrhosis. Plus 12 phenotypes (including BASM laterality-subtype
    features: polysplenia, situs inversus), 3 biochemical markers (conjugated
    bilirubin, high GGT, emerging serum MMP7 biomarker), 4 susceptibility genes
    typed SUSCEPTIBILITY to reflect the non-Mendelian architecture (ADD3, GPC1 GWAS
    loci; PKD1L1, CFC1 BASM laterality genes), 3 environmental factors (perinatal
    hepatotropic virus, biliatresone plant toxin, prenatal maternal infection), and
    5 treatments (Kasai hepatoportoenterostomy, liver transplantation, UDCA,
    prophylactic antibiotics, fat-soluble vitamin/nutritional support).

    20 evidence items, each with a verified abstract snippet. No GeneReviews article
    exists for biliary atresia (non-Mendelian), so the GeneReviews baseline step did
    not apply. Twin-discordance evidence (PMID:32504124) records the non-Mendelian
    susceptibility model.

    Validation: `just validate` (schema + terms + snippets 20/20) and
    `just validate-disorders` (CI-equivalent, --no-full-text) both pass;
    weighted compliance 76.9%. A red-team review pass was run before commit.

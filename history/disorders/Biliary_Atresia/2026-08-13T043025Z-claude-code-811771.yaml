  summary: Fix prevalence_class band to match rate_per_100000
  details: |
    PR shepherd follow-up to the ai4c-reviewer blocking item on PR #8410. The South Korea birth-prevalence record declared prevalence_class: BAND_1_9_PER_100000 while carrying rate_per_100000: 10.6 (1.06 cases per 10,000 live births, PMID:28244293). _band_from_rate() in scripts/migrate_prevalence.py buckets rates >= 10 per 100,000 into BAND_1_5_PER_10000, so the declared band made the disease read an order of magnitude rarer than the entry's own number in a band query. Changed the band to BAND_1_5_PER_10000; rate, notes, and evidence untouched. Audited the entry's other prevalence records for the same mismatch — this was the only one. Validated with 'just validate' (all validations passed, snippets 35/35 verified against cached references) and 'just validate-terms' (passed); no cache churn.

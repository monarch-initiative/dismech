  details: |
    Round-2 ECM claim-evidence review. Fixed: (1) the Ecchymoses phenotype quoted a sentence about the patient's diet ('He was diagnosed with scurvy due to a long history of staying indoors and inadequate intake of fruits or vegetables') while its explanation described ecchymoses of the lower extremities; swapped in the on-point sentence from the same abstract, which was already used under Arthralgias. (2) Fatigue asserted frequency VERY_FREQUENT on PMID:37915623's 'nonspecific constitutional symptoms, including weakness, malaise, and fatigue', which quantifies nothing; band removed with a notes: recording why, per the frequency-evidence guidelines. (3) evidence_source was absent on all 14 evidence items - the only file of the ten in this round with the field systematically unset; both cited sources (a review and a case report) are human, so all were tagged HUMAN_CLINICAL. Noted but not fixed: the entry's central mechanism claim (vitamin C as cofactor for prolyl and lysyl hydroxylases) rests on a single vague sentence about 'the biochemical reactions of connective tissue synthesis' and needs a biochemistry citation; tracked in issue #7025.

  summary: 'Create: Obesity, Hyperphagia, and Developmental Delay'
  details: |
    New Disease entry for NTRK2 loss-of-function obesity, hyperphagia, and
    developmental delay (MONDO:0013483, OMIM 613886). The stub's MONDO record
    has no descendants and one causal gene, so it was curated as a leaf
    Disease. It is kept separate from NTRK2 gain-of-function developmental and
    epileptic encephalopathy 58, already a subtype of
    Genetic_Developmental_and_Epileptic_Encephalopathy, because the 2025
    44-patient cohort (PMID:39540377) splits the two by direction of effect.

    The claude_code deep-research report was thin (two web searches, four
    references, no verbatim quotes), so the primary literature was found by
    PubMed search and every reference was fetched into references_cache before
    use: the index case (PMID:15494731), functional follow-up of cohort
    variants (PMID:16702999), the 44-patient cohort (PMID:39540377), a TrkB
    variant synaptogenesis study (PMID:32493978), human BDNF haploinsufficiency
    as pathway evidence (PMID:17130481), and three mouse studies placing TrkB
    satiety signaling in the hypothalamus downstream of MC4R (PMID:12796784,
    PMID:32265438, PMID:30718415). The hypothalamic node is marked as inferred
    from mice; the neurite/synaptogenesis node rests on cell-culture data.
    A second report from OpenScientist (requested as falcon, which had no API
    key; the fallback is recorded in the report's frontmatter) resolved 21/21
    references and agrees with the mechanism. Seizures and hypotonia, which
    HPO annotates to OMIM:613886, were not added because no cached abstract
    reports them in a loss-of-function carrier; the entry's notes say so. No GeneReviews chapter exists
    (just check-genereviews: NO_CHAPTER). just preflight-dr was not run because
    it requires a local MONDO build.

    Validation: just validate (33 snippets verified), just validate-terms,
    check-entity-refs, check-causal-targets, check-duplicate-keys and the
    whole-KB offline snippet, coarse-phenotype and block-scalar gates all pass.

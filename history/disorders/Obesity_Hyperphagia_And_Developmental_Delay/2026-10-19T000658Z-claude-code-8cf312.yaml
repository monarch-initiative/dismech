  summary: 'Review round 1: add Table 1 phenotypes'
  details: |
    Addressed the first automated review of PR 14845. The reviewer pointed out
    that Table 1 of PMID:32493978, already cited and cached as full text,
    records per-patient phenotypes, so the earlier notes claim that no cited
    source reported hypotonia or seizures in a loss-of-function carrier was
    wrong. Added Hypotonia, Delayed speech and language development, Autistic
    behavior and Absence seizures, each quoting Table 1 rows for the index
    p.Tyr722Cys patient and the two p.Arg715Gln carriers. These are the only
    carriers in that table whose variants impair BDNF-stimulated signaling in
    PC12 cells. The reviewer suggested P831L as a third confirmed variant, but
    the same paper reports that P831L did not affect signaling in those
    assays, so it was not used. Added the Table 1 rows as evidence for
    Hyperactivity and replaced its pooled-carrier description. Rewrote the
    hypotonia/seizure sentence in notes. Set DYSREGULATED on the
    regulation-of-feeding-behavior term, and cited PMID:26629410
    (hyperphagia preceding weight gain in hypothalamic Ntrk2 knockout mice) on
    the Hyperphagia to Obesity sequela.

    Not taken: a treatments section (no source links setmelanotide or any
    other drug to NTRK2 deficiency) and a diagnosis row (no cached source
    describes how the diagnosis is made beyond research sequencing).


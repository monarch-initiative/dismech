  details: |
    Changes for the CHANGES_REQUESTED review on PR 14844:
    - Rewrote the earlier 2026-10-18 history record, which described KIF4A, HP:0009800 and PMID:28655582 edits that were never in the entry, so it records the actual diff and links issues 3383, 3398 and PR 14844.
    - Removed the Autosomal recessive inheritance block. PMID:25629078 ties allele number to tooth agenesis severity, not to taurodontism, and reports taurodontism in heterozygotes. The WNT10A trigger node description now states the agenesis-severity correlation instead of gene-dosage-dependent root dysmorphology; description and notes no longer say biallelic/recessive.
    - Removed the DLX3 trigger node and its HERS edge, and the DLX3 evidence from the AD inheritance block. DLX3 stays in genetic with notes saying it is the gene of the AIHHT/TDO differentials and not a cause of isolated taurodontism; description and notes updated to match.
    - AXIN1 node: dropped role trigger and the unsupported edge to Failed invagination of HERS diaphragm (DOI:10.1242/dev.202899 never mentions taurodontism or furcation); kept the supported edge to Abnormal dental root morphology. Replaced GO:0008013 beta-catenin binding with GO:0043422 protein kinase B binding, supported by the paper's statement that Axin1 acts through binding to AKT1 independently of canonical Wnt signaling.
    - CBCT diagnosis row rebound from NCIT:C38101 X-Ray Imaging to NCIT:C71695 Cone-Beam Computed Tomography (runoak ols:ncit search l~cone-beam); dropped the aim-statement evidence item from PMID:37128323.
    - Endodontic treatment rebound from NCIT:C15329 Surgical Procedure to NCIT:C52575 Endodontic Treatment and the SURGERY therapeutic_modality removed.
    - Not changed: KCTD1 protein binding (the cited paper only states disrupted protein-protein interactions; no more specific activity is sourced), and the mouse-only evidence on Abnormal dental root morphology (the suggested PMID:18363703 sentence describes the pulp chamber, already used on the pulp phenotype).

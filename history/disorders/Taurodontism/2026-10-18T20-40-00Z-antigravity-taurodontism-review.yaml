  summary: Scope to isolated taurodontism, move Shifman/Chanannel grades to diagnosis, drop unrelated
    trials and deprecated percentage fields, expand inheritance and gene-grounded trigger nodes.
  details: 'Review of issues #3383 and #3398 for Taurodontism:

    - Description and notes now scope the entry to isolated/non-syndromic taurodontism (MONDO:0010098;
    OMIM:272700), with AIHHT, TDO and Klinefelter syndrome under differential_diagnoses.

    - Removed the Hypotaurodontism, Mesotaurodontism and Hypertaurodontism has_subtypes rows; the
    Shifman and Chanannel morphometric grades are now described in a diagnosis row bound to
    NCIT:C190548 Intraoral Radiography, with PMID:278704 and PMID:37128323 evidence.

    - Removed three amelogenesis imperfecta / mineralized-tissue trials (NCT01746121, NCT03810859,
    NCT07250906) that were not about taurodontism.

    - Removed deprecated percentage fields from prevalence, added a progression Onset phase
    (PMID:34897365, PMID:31914354), harrisons_chapter classification and a references list.

    - Replaced the AIHHT-only inheritance row with Autosomal dominant inheritance (HP:0000006) citing
    WNT10A (PMID:25629078) and KCTD1 (DOI:10.3390/ijms25105179) kindreds, and added an Autosomal
    recessive inheritance row (later removed in review).

    - Added role: trigger and molecular_functions to the WNT10A and KCTD1 nodes, and added DLX3 and
    AXIN1 trigger nodes (both later revised in review), wired into Failed invagination of Hertwig
    epithelial root sheath diaphragm.

    - Merged the two CBCT diagnosis rows into one.

    '

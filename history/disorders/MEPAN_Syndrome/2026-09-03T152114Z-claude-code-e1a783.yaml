  summary: 'Create: MEPAN Syndrome'
  details: |
    Created de novo MEPAN Syndrome (MECR-related neurologic disorder, MONDO:0015003, gene MECR hgnc:19691). Deep research via just research-disorder claude_code (report lacked reference/term validation sections; sources were independently fetched and snippet-verified). Primary literature: Heimer 2016 founding cohort (PMID:27817865), GeneReviews (PMID:31070877), ophthalmic manifestations (PMID:36262091), adult-onset R258W (PMID:38296034), LHON-like R258W yeast (PMID:37734847), Chinese p.Asp304Tyr + lipoic acid (PMID:33401012), DBS case series (PMID:38328756), MEPAN mouse (PMID:41021813), Purkinje-cell Mecr KO mouse (PMID:30266742), dietary-intervention mouse negative result (PMID:38879137), Drosophila iron/ceramide mechanism (PMID:37653044). Built a branching pathophysiology chain from biallelic MECR LOF through impaired mtFAS to deficient lipoylation/ISC assembly, bioenergetic failure, and selective basal-ganglia/retinal-ganglion/Purkinje-cell degeneration. Model evidence tagged MODEL_ORGANISM/IN_VITRO and kept distinct from human phenotype claims. Lipoic acid treatment carries both a supportive anecdotal human report and a refuting controlled mouse result. Validated: just validate (37/37 snippets), validate-terms, check-causal-targets, check-duplicate-keys, check-entity-refs, check-qualifier-terms, and just validate-disorders all pass.

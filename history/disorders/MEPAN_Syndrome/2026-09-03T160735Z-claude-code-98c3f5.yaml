  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #10724. (1) Added reference_title to all 37 evidence items, matching each references_cache frontmatter title verbatim. (2) Added a diagnosis: section mining GeneReviews (PMID:31070877): molecular diagnosis by biallelic MECR variants (NCIT:C15709) and whole-exome sequencing as the testing approach (NCIT:C101295, PMID:38296034). (3) Cited the GeneReviews agents/circumstances-to-avoid + anesthesia-caution sentence on Supportive Care, and modeled febrile illness and physiologic stress as environmental: entries with environmental_effect EXACERBATES + influences_mechanisms targeting Mitochondrial Bioenergetic Failure (exposure_term left unbound; no ECTO term fits). (4) Connected the five orphan phenotypes with bare-name causal edges: Optic atrophy -> Reduced visual acuity (phenotype sequela, GR snippet); Basal Ganglia Neurodegeneration -> Focal T2 hyperintense basal ganglia lesion (radiological reflection) and -> Dysarthria; Cerebellar Purkinje Cell Degeneration -> Nystagmus; Mitochondrial Bioenergetic Failure -> Ophthalmoplegia (uncertain edges marked INDIRECT_UNKNOWN_INTERMEDIATES). (5) Added the Drosophila mecr loss-of-function model (PMID:37653044) to animal_models with modeled_mechanisms RECAPITULATES Iron and Ceramide Dysregulation, iron and ceramide readouts. Suggestions: added the 25% sib recurrence-risk GR evidence to inheritance; dropped frequency on single-case Nystagmus/Ophthalmoplegia; fixed history links (issue #10722 moved to issues, PR #10724 to prs). OMIM/ORPHA mappings not added: the Mappings class has no omim/orpha slot and MONDO:0015003 is already the disease_term.

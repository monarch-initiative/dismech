  summary: Add refuting evidence to the triallelic/oligogenic inheritance block
  details: |
    Member review for the Digenic_and_Oligogenic_Disorders grouping. The oligogenic (triallelic) inheritance block cited only the 2001 Katsanis proposal (PMID:11567139) and an Orphanet row, presenting a contested claim as settled. Added PMID:22353939 (Abu-Safieh et al., EJHG 2012) with supports REFUTE - a comprehensive analysis of all 14 BBS genes plus CCDC28B in 29 mostly multiplex families that found no instance supporting triallelism - and rewrote the block description to state that the two evidence items must be read together and that BBS is the weakest multi-locus assertion in the grouping. The block and the grouping membership are retained, since Orphanet still lists oligogenic transmission and the criterion is about the curated claim; the contradiction is surfaced rather than silently resolved. Validated with just validate, just validate-terms, and just count-verified-snippets (108/108 verified).

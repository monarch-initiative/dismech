  summary: Add BBS7 subtype with ClinGen Definitive validity
  details: |
    Added the entry's first has_subtypes row, BBS7, bound to MONDO:1040042 (BBS7-related ciliopathy), the gene-lumped term ClinGen's Retina GCEP curates BBS7 against (Definitive, AR, 2023-09-07). The row carries a skos:narrowMatch subtype mapping to MONDO:0014435 (Bardet-Biedl syndrome 7), that term's only MONDO subclass, following the Familial_Exudative_Vitreoretinopathy precedent of binding gene-related MONDO terms to gene subtypes. The BBS7 genetic record gains subtype: BBS7 and a gene_disease_validity assertion quoting the CGGV row; the subtype cites two sentences of the CGGV evidence summary (retinal disease as the most penetrant feature; the lumping rationale). Entry-level notes now say gene subtypes are added where an external body has curated the gene-level entity. Deleted stubs/BBS7-related_Ciliopathy.yaml, which the subtype now covers. No deep research was run: the change records an existing external classification. Validated with just validate, validate-terms, count-verified-snippets (111/111), check-gene-validity (0 conflicts), check-entity-refs and check-name-collisions.

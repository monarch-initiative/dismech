  summary: Add BBS5, BBS10 and BBS12 subtypes with ClinGen Definitive validity
  details: |
    Added has_subtypes rows BBS5, BBS10 and BBS12, each bound to the gene-lumped MONDO term that ClinGen's Retina GCEP curates the gene against: MONDO:1040047 BBS5-related ciliopathy (Definitive, AR, 2023-12-07), MONDO:0700237 BBS10-related ciliopathy (Definitive, AR, 2023-08-03) and MONDO:1040045 BBS12-related ciliopathy (Definitive, AR, 2024-01-04). As with the existing BBS7 row, each carries a skos:narrowMatch mapping to its term's only MONDO subclass, Bardet-Biedl syndrome 5, 10 and 12 (OMIM:615983, OMIM:615987, OMIM:615989), which MONDO also places directly under Bardet-Biedl syndrome (MONDO:0015229). The BBS5, BBS10 and BBS12 genetic records gain subtype: and a gene_disease_validity assertion quoting the ClinGen table row. The subtype descriptions are sourced from the ClinGen evidence summaries (lumping rationale, loss-of-function mechanism, retinal dystrophy as the constant or a major feature, variable expressivity) and, for the protein roles, from PMID:22500027 (BBS5 is added to the BBSome core to form the complete BBSome) and PMID:20080638 (BBS6, BBS10 and BBS12 form a chaperonin-like complex with CCT/TRiC that mediates BBSome assembly). The entry-level notes now name the four genes recorded as subtypes.

    Lump/split decision for stubs/BBS5-related_Ciliopathy.yaml, stubs/BBS10-related_Ciliopathy.yaml and stubs/BBS12-related_Ciliopathy.yaml, all deleted: SUBTYPE of Bardet-Biedl syndrome. Each MONDO term's only descendant is the numbered Bardet-Biedl syndrome, and each gene acts through the BBSome trafficking pathway this entry already models (BBS5 on the BBSome subunit deficiency node, BBS10 and BBS12 on the BBS-chaperonin assembly defect node), so a separate entry would repeat the parent's pathograph. ClinGen's BBS10 curation includes non-syndromic retinal dystrophy cases in the lumped entity; that range is recorded in the BBS10 subtype description rather than as a separate entry.

    No deep research was run: the change records existing external classifications. Validated with just validate, validate-terms, count-verified-snippets (126/126), list-gene-validity and check-gene-validity (no conflict, backfill or unplaced rows for this entry), check-entity-refs, check-name-collisions and validate-disorders.

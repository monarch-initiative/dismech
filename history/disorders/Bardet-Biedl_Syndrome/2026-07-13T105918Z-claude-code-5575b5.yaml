  summary: Migrate Abnormal ERG to reports_on readout link
  details: |
    Added a lean PhenotypeReadout class plus a reports_on slot on Phenotype so investigation-readout phenotypes such as Abnormal electroretinogram HP:0000512 attach to the mechanism they measure via a dashed observational pathograph edge rather than a causal downstream edge. Migrated the Bardet-Biedl Abnormal electroretinogram phenotype: removed the semantically-incorrect downstream causal edge from Photoreceptor outer-segment transport defect to Abnormal electroretinogram and added reports_on target Photoreceptor outer-segment transport defect relationship READOUT_OF direction NEGATIVE endpoint_context DIAGNOSTIC carrying the same ORPHA:110 evidence. Validated with just validate; graph build confirms the readout edge and no orphan node. See design-decisions section 10.

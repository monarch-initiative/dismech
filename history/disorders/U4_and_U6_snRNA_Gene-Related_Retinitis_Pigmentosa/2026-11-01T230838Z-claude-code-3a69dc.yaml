  details: |
    Answered the automated review on PR 16292. Added a Vitreomacular complications phenotype (frequency FREQUENT, 30.6% of the cohort, inside the HPO 30-79% band) bound to HP:0004327 Abnormal vitreous humor morphology with coarse_binding_basis SOURCE_UNSPECIFIED, because PMID:41513982 says only 'various vitreomacular complications' and names no individual finding. HP:0004327 is not in the coarse set, so check-coarse-phenotypes does not require the basis; it is declared anyway so the reason for the general binding is recorded, and the companion check (none for this value) passes. The evidence item reuses the PMID:41513982 sentence already cited for cataract, graded HUMAN_CLINICAL as there. The description now lists vitreomacular complications with cystoid macular edema and lens opacities. Ran just research-disorder claude_code for this entry (research/U4_and_U6_snRNA_Gene-Related_Retinitis_Pigmentosa-deep-research-claude_code.md and its citations sidecar). Its 4 references all resolved and no term was unresolved. It rests on the same Quinodoz/Rivolta cohort as PMID:41513982, read through the earlier medRxiv preprint (PMID:39830270), and reports no independent replication cohort, so it added no new primary cohort or finding to the entry. Its suggestion of epiretinal membrane for the vitreomacular complications was not taken because the source does not name that finding. The ~1.4% of undiagnosed retinitis pigmentosa figure stays in description prose: it is a diagnostic yield in an undiagnosed cohort, and no PrevalenceMeasureEnum value describes that measure.

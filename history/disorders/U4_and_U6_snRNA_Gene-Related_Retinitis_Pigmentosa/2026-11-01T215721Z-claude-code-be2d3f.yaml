  summary: 'Create: U4 and U6 snRNA Gene-Related Retinitis Pigmentosa'
  details: |
    New entry promoted from the RNU4-2- and RNU6-related retinitis pigmentosa subtype row of ReNU_Syndrome, because it is a distinct nonsyndromic dominant retinal disease caused by variants in a different U4/U6 structural element. Curated mainly from PMID:41513982 (Quinodoz et al. 2026, PMC full text): five causal genes (RNU4-2 hgnc:10193, RNU6-1 hgnc:10227, RNU6-2 hgnc:34270, RNU6-8 hgnc:34285, RNU6-9 hgnc:34269, ids from the HGNC REST API), four recurrent variants, dominant inheritance with de novo cases and incomplete penetrance for RNU4-2, six phenotypes with cohort frequencies, and a three-node chain (three-way-junction variant, increased di-snRNP factor binding with delayed tri-snRNP assembly, photoreceptor degeneration) conforming to spliceosome_component_dysfunction at the variant and cell-failure nodes. The mis-splicing node is deliberately not conformed because patient leukocytes showed no consistent splicing change; recorded as a knowledge gap. PubMed searches for RNU4-2, RNU6 and U4/U6 snRNA with retinitis pigmentosa found two further usable sources: the saturation editing study PMID:41951737 (n.56T>C not significant in HAP1) and the commentary PMID:41974596. MONDO has no class; disease_term is unbound with a broadMatch to MONDO:0019200 recording OLS4 searches run 2026-11-01. The five snRNA genes were added to the gene-activity grounding baseline because snRNAs have no protein molecular function.

  details: |
    This append-only review record addresses the two actionable findings in the
    ai4c review of draft PR #9485. It does not rewrite either CREATE record, the
    paired supersession REVIEW, or the PR-backlink GENERAL record.

    In inheritance evidence, PMID:27809427 (GeneReviews) now directly supports
    the existing statement that each child of an affected heterozygous individual
    has a 50% chance of inheriting the TUBB4A pathogenic variant. The added
    evidence uses the exact cached GeneReviews sentence and distinguishes this
    transmission risk from recurrence after an apparently de novo variant or
    parental mosaicism. PMID:27809427 was already a top-level reference, so no
    reference or reference-cache record was added or changed.

    Three H-ABC-only pathophysiology nodes regained source-backed anatomical
    grounding without universalizing those locations to the TUBB4A neurologic
    spectrum or DYT-TUBB4A. Oligodendrocyte Dysfunction and Myelin Failure and
    CNS Hypomyelination now bind cerebral white matter to UBERON:0002316 (white
    matter). Basal Ganglia and Cerebellar Neurodegeneration now binds basal
    ganglia to UBERON:0002420 (basal ganglion) and cerebellum to UBERON:0002037.
    All three nodes remain explicitly scoped to the H-ABC subtype. Existing
    ontology labels and enum membership supported the additions, so no ontology
    or enum cache changed. No Purkinje-cell claim was introduced.

    The reviewer suggestions about taiep, synonyms, and prevalence were
    nonblocking and intentionally remain outside this narrow repair. The prior
    17-phenotype equivalence inventory and all nine H-ABC cohort frequencies are
    unchanged, as are animal models and the supersession/history migration.


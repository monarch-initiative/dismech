  summary: >-
    Paired review: supersede HLD6 into the TUBB4A neurologic spectrum
  details: |
    This paired review adjudicated kb/disorders/Hypomyelinating_Leukodystrophy_6.yaml
    and kb/disorders/TUBB4A-related_Neurologic_Disorder.yaml as a subtype-versus-
    spectrum duplication. The surviving disease remains TUBB4A-related neurologic
    disorder (MONDO:0800470; TUBB4A, hgnc:20774). Hypomyelinating leukodystrophy 6 /
    H-ABC (MONDO:0012905) is retained only as the H-ABC subtype_term; it is not an
    umbrella leukodystrophy parent or a second independent pathograph. DYT-TUBB4A
    remains a separately described, ontology-unbound subtype within the spectrum.

    Dual CREATE provenance is preserved. The survivor's original
    2026-08-20T190406Z-claude-code-013582 CREATE record is unchanged. The source
    entry's original 2026-08-22T190410Z-claude-code-d5a931 CREATE record was moved
    under the survivor history prefix without changing its original target,
    session, actor, event, summary, or details; only target.superseded_by was added
    to identify and justify the successor. This REVIEW record follows those two
    effective CREATE records and records the paired consolidation rather than
    rewriting either earlier session.

    A machine-checked content-equivalence inventory preserved the semantic coverage
    of all 17 source HLD6 phenotypes while explicitly reconciling three imprecise
    ontology bindings. Cerebral hypomyelination (HP:0006808) was changed to CNS
    hypomyelination (HP:0003429), matching the CNS/brain-MRI evidence without
    retaining the source entry's unsupported obligatory scope. Lower limb
    spasticity (HP:0002061) was changed to spasticity (HP:0001257), because the
    30-patient source reports spasticity at 100% but does not support an anatomic
    lower-limb restriction. Chorea (HP:0002072) was changed to choreoathetosis
    (HP:0001266), matching both the source's own preferred-term text and the quoted
    cohort phenotype rather than reducing the mixed movement to pure chorea.

    The reconciled 17-item inventory is: CNS hypomyelination (HP:0003429),
    spasticity (HP:0001257), dystonia (HP:0001332), dysarthria (HP:0001260), ataxia
    (HP:0001251), choreoathetosis (HP:0001266), nystagmus (HP:0000639), seizure
    (HP:0001250), sensorineural hearing impairment (HP:0000407), abnormal basal
    ganglia morphology (HP:0002134), cerebellar atrophy (HP:0001272), developmental
    regression (HP:0002376), dysphagia (HP:0002015), dysphonia (HP:0001618),
    rigidity (HP:0002063), intention tremor (HP:0002080), and dysmetria
    (HP:0001310). The nine reviewed 30-patient frequencies were retained exactly
    and only in H-ABC phenotype_contexts: spasticity 100%, dysarthria 93%, dystonia
    88%, ataxia 87%, rigidity 69%, choreoathetosis 45%, nystagmus 33%, seizures
    18%, and sensorineural hearing impairment 14%. No spectrum-wide frequency was
    inferred for hypomyelination, basal-ganglia atrophy, or cerebellar atrophy.
    Laryngeal dystonia (HP:0012049) remains a distinct DYT-TUBB4A phenotype.

    Inheritance and functional statements were made allele- and subtype-specific:
    H-ABC is usually de novo with a documented parental-mosaic exception, whereas
    DYT-TUBB4A is usually inherited. Antimorphic/dominant-negative language is
    limited to supported H-ABC p.Arg2Trp and p.Asp249Asn evidence; p.Gln424His is
    the explicit gain-of-function allele; p.Arg2Gly is described without an
    unsupported microtubule-dynamics direction; no imported mechanism was assigned
    to p.Cys239Phe or p.Arg262His. The graph separates H-ABC oligodendrocyte/myelin
    dysfunction from a parallel, unconformed gray-matter neurodegeneration arm and
    from cautious DYT neuronal dysfunction. Only the three H-ABC myelin nodes use
    cns_myelin_failure conformance. The entry does not make hypomyelination,
    basal-ganglia atrophy, or thalamic sparing obligatory, and records the
    p.Arg262His imaging exception. Purkinje-cell claims were excluded.

    Management and model evidence were narrowed to the cited scope. Symptomatic
    medications and the single DYT-TUBB4A bipallidal deep-brain-stimulation case
    are separate treatments, with DBS represented as NCIT:C21024 DEVICE. Negative
    response language is limited to levodopa/carbidopa and trihexyphenidyl in that
    case. Antisense suppression and animal-model claims are H-ABC-specific and
    explicitly preclinical; model fidelity is MODERATE with homozygous,
    D249N/null, and taiep-versus-D249N limitations recorded.

    Source audit corrections classify PMID:42044700 as MODEL_ORGANISM evidence for
    in-vivo/modeling work and use PMID:41129987 only for pediatric leukodystrophy
    burden, not DYT-TUBB4A burden. PMID:42472988 was removed, and unrelated
    PMID:23746550 was excluded. Untrusted research artifacts with a wrong HGNC
    assignment and PMID defects were not propagated, no new reference was fetched,
    and references_cache was not changed.

    The exact regular, non-symlink HLD6 YAML was deleted after the 17-item proof.
    Its sole regular, non-symlink CREATE history file was migrated to the survivor
    prefix with deep equality to the original after removing the new
    target.superseded_by block. The deleted source path has no dangling content or
    graph references. The term validator generated the sole permitted enum-cache
    change: one sorted, unique MONDO:0012905 row in
    cache/enums/diseaseorsubtypeterm_6d5891ec946f.csv (+1/-0); it was not
    hand-authored, and no other enum or reference cache changed.

    Eligibility was fail-closed against four agreeing live-main authorities at
    3fab3ac80e22d365e7816fa9643dd4df8e41956a. Both targets were CREATE-only with no
    prior REVIEW; the proposed branch, remote branch, registered worktree/path, and
    all-state head PR were absent. All 214 OPEN PRs were scanned through explicit
    empty file pages for both paths and complete history prefixes, including an
    immutable Git fallback for capped PR #7922; stable opening and closing
    snapshots showed no collision.

    Content gates passed: schema, term, reference, duplicate-key, subtype foreign-
    key, entity-reference, animal-target, readout-link, conformance-reference, and
    targeted history/layout tests; strict cached snippets were 88/88. The isolated
    TUBB4A graph had 38 nodes, 44 edges, zero integrity issues or orphans, all 20
    phenotypes connected, and its single gene wired. Offline enum-cache and cache-
    integrity checks passed, with the expected +1/-0 sorted/unique membership
    delta. Whole-KB graph validation still reports 75 unrelated pre-existing
    failures; the target-specific graph is clean. git diff --check passed, the
    index remained empty, and no stage, commit, push, PR, or publication action was
    performed. An independent read-only frozen-scope audit returned literal
    APPROVE with no blockers and confirmed PRE=POST hashes, MONDO boundaries,
    17-item/nine-frequency preservation, lossless history migration, and all
    target-specific gates.

    Publication remains pending. Immediately before any later stage, commit, push,
    or PR creation, the publication owner must repeat the live-main/open-PR
    collision and exact-scope gate and must stop if the main pin, target paths,
    either complete history prefix, validator-owned enum row, branch, worktree, or
    PR state has changed.

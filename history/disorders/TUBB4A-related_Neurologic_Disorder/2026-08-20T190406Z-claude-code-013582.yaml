  summary: 'Create: TUBB4A-related Neurologic Disorder (H-ABC / DYT-TUBB4A)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified with just count-verified-snippets; just validate and just validate-terms pass.

    The myelin-and-movement tubulinopathy, spanning early-infantile hypomyelination through H-ABC to adult-onset isolated dystonia (DYT-TUBB4A). Curated with two parallel arms rather than one chain - oligodendrocyte myelin failure and basal ganglia/cerebellar neurodegeneration - because the mouse model shows both glial and neuronal degeneration, so the atrophy is not simply a consequence of demyelination.

    Deliberately NOT a Tubulinopathies grouping member and NOT conformed to microtubule_dependent_neuronal_migration_failure: there is no cortical malformation, the cortex forms normally, and the pathology is postnatal and progressive. The grouping notes already record TUBB4A as out of scope.

    functional_impact_category is UNKNOWN by deliberate choice, argued in gap_tubb4a_pleiotropy_mechanism: dystonia-causing and H-ABC-causing variants have demonstrably divergent molecular effects, including two different substitutions at the same residue 2 falling on opposite clinical poles, so a single value would be wrong for half the alleles.

    Includes the 2026 preclinical Tubb4a-suppressing ASO with a target_mechanisms link, its preclinical status stated in three places, and a second discussion recording that the ASO fails to reach cerebellar granule neurons - which matters because the cerebellar arm is curated as parallel rather than downstream. NOT conformed to antisense_oligonucleotide_therapy: new conformance to that module's RNase-H branch is deferred per repository guidance.

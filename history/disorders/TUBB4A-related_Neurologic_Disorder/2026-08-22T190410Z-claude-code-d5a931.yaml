  summary: 'Create: Hypomyelinating Leukodystrophy 6 (H-ABC, TUBB4A)'
  details: |
    Created a new entry for hypomyelinating leukodystrophy 6 (H-ABC, MONDO:0012905), curated as part of a Mendelian CNS review that also added the cns_myelin_failure mechanism module. Five pathophysiology nodes, four of which conform to that new module: TUBB4A heterozygous missense variant in brain-specific beta-tubulin (trigger), altered microtubule dynamics in oligodendrocytes (oligodendrocyte arrest and death), diffuse central hypomyelination (deficient sheath), and progressive pyramidal, extrapyramidal and cerebellar dysfunction (consequence). The basal ganglia and cerebellar neurodegeneration node is deliberately left unconformed, because the module's consequence node models axonal degeneration secondary to sheath loss and this is a separate grey-matter arm whose primacy is allele-dependent: the taiep rat shows purely glial hypomyelination while the p.D249N knock-in mouse shows neuronal and glial pathology. Frequency bands on nine phenotypes are all derived from the per-sign percentages in a 30-patient literature review (PMID:24706558) rather than estimated. Validation run: linkml-validate reported no issues, linkml-term-validator passed after correcting the MONDO label to its canonical comma-inverted form, and just count-verified-snippets reported 26/26 evidence snippets verified against cached references. The corresponding stub was deleted.

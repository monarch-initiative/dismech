  summary: Comprehensive evidence and disease-boundary review of 2q37 microdeletion syndrome
  details: |
    Reviewed every modeled section and every bibliography entry against generated
    reference caches, current ontology identities, and the project design
    decisions. Removed the HDAC4-only subtype so that the record remains scoped
    to the constitutional multigene 2q37 deletion. Reframed HDAC4 as an
    incompletely penetrant contributor, added counterevidence and distinct
    HDAC4 loss-of-function and 14-3-3-site missense differentials, and removed
    unsupported chondrocyte, endocrine, telangiectasia, and monotonic
    deletion-size mechanisms.

    Retained quantitative frequency bands only for the four phenotypes with
    denominators in the 103-person review: craniofacial dysmorphism (86%),
    cognitive-behavioral issues (79%), type E brachydactyly (48%), and
    overweight/obesity (34%). Removed unsupported bands from all other
    phenotypes and removed hypothyroidism from the deletion-syndrome phenotype
    set.

    Updated diagnosis to CMA-first with selective karyotype and parental
    chromosome studies. Replaced the fixed Wilms-tumor and renal-cyst screening
    protocol with a breakpoint-specific, individualized discussion and an open
    knowledge gap. Removed NCT01238250 because its generated cache does not
    establish 2q37 eligibility or recruitment status. Reduced the bibliography
    to used sources, regenerated new PMID caches only through
    `just fetch-reference`, and opened expert-review issue #6560 for HDAC4
    attribution and 2q37.1 Wilms surveillance.

    `just validate-disorders kb/disorders/2q37_Microdeletion_Syndrome.yaml`
    passes schema, term, and reference validation.

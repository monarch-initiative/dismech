  summary: Add a diagnosis row binding a LOINC fungal identification code
  details: |
    LOINC tranche B batch 29, the tranche's final entry. This entry carried its diagnostic content only in definitions, which has no measurements slot, so a minimal diagnosis section was added with one row for the mycological half of the diagnostic triad. It reuses an evidence snippet already verified in this file (PMID:40317309, the ear-canal lavage trial reporting fungal culture results identifying the otomycotic pathogen) with the same evidence_source, and adds no new citation; the criteria stay in the definitions block and the row points at them.

    The bound code is LOINC:42805-2 (Fungus identified in Specimen), method-less and specimen-level. Both choices were forced by what the release actually carries, and the route to each is worth recording.

    Method: the criterion this row reports admits two routes, positive fungal culture or direct microscopy showing fungal elements, so a culture-qualified code would carry only one of them. The method-less code covers both.

    Specimen: the obvious binding was LOINC:106041-7 (Fungus identified in Ear fluid by Culture), which is an exact specimen match. It is ACTIVE and not deprecated in the pinned LOINC 2.83 export, but it resolves in the Monarch KG with no name, so the term validator cannot label it and it cannot be cached or bound today. That is release lag rather than a fabricated code, and it is the second instance of this pattern in this lane after LOINC:107527-4. It is the reason presence in the pinned export is necessary but not sufficient for a binding: absence is answered by the complete export, usability only by the live KG.

    Enumerating by specimen rather than by analyte name established the rest: of 80 ACTIVE ear-specimen codes in the release exactly one is fungal, and it is the culture-qualified one above; there is no ear KOH-preparation code at all, so the microscopy route has no site-specific code. The narrative Interpretation code for ear microscopy was seen and avoided, since it names a result field rather than a measurement.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status, deprecation and third-party copyright notice checked per code; usability and Part-level questions from the Monarch KG. The code was absent from cache/loinc/terms.csv on origin/main and was seeded by the term validator against the KG; no label typed by hand. Checked against the 273 LOINC rows added by all 47 open loinc PRs, enumerated with pagination: no collision.

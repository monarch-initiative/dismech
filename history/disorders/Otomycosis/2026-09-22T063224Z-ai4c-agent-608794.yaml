  details: |
    PR Shepherd round answering the 2026-08-25 CHANGES_REQUESTED review.

    IMPORTANT 1 (content regression). The restructure renamed 'Topical antifungal therapy' to 'Topical clotrimazole' and deleted CHEBI:6923 miconazole from therapeutic_agent, while the entry kept two Phase III miconazole-oil trials (NCT05660382 RECRUITING, NCT04432376 COMPLETED). That left Phase III trial data for an agent absent from treatments. Following the reviewer's split-rather-than-delete guidance, added a sibling 'Topical miconazole' treatment carrying CHEBI:6923 and its own target_mechanisms edge to 'Otomycosis Fungal Lanosterol 14-alpha-Demethylation by CYP51 (ERG11)' with treatment_effect INHIBITS. The agent-specific-targeting rationale behind the rename is preserved: clotrimazole and miconazole are now separate treatments rather than one generic entry.

    The reviewer correctly noted that PMID:31643715, the class snippet used for clotrimazole, lists ketoconazole and clotrimazole but not miconazole, so it cannot carry the miconazole target edge. Searched PubMed and cached PMID:22568580 (Expert Opin Pharmacother 2012, miconazole pharmacology review) via just fetch-reference, which states that miconazole 'inhibits the cytochrome P450 complex, including the 14alpha-demethylase enzyme required for ergosterol biosynthesis'. That is the class-mechanism source naming miconazole. Disease-specific use evidence comes from the NCT04432376 trial summary, as the reviewer suggested.

    Retired enum value. kb/disorders/Otomycosis.yaml carried supports: PARTIAL at the PMID:38962337 item in the clotrimazole treatment. Main migrated five other occurrences in this file under #10003, but this one survived because the PR edited the surrounding text, so it would have failed check-enum-values post-merge. Changed to SUPPORT, matching main's migration of the siblings. Left directness absent, consistent with the documented bulk migration and with the zero directness values elsewhere in this file; the item's explanation already records the inference step in prose, and adding an appraisal nobody made would contradict the leave-it-off rule.

    Validation: just validate passes (schema, terms, 80/80 snippets verified). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading all pass.

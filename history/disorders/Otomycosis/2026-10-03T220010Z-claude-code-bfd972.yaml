  summary: Backfill transmission (#10115, R25)
  details: |
    Added four transmission records; the existing infectious_agent block (Aspergillus, Candida) was left untouched. Routes: opportunistic colonization of the external canal by environmental fungi (PMID:38450054, PMID:38486086 for recovery of black aspergilli from agricultural soil); trauma and instrumentation of the ear canal (PMID:39376298, PMID:37223402, PMID:38962337); topical antibiotic and steroid suppression of the canal's bacterial flora, the commonest predisposing exposure in the pooled systematic review (PMID:39376298, PMID:38375517); and moisture, swimming and humid climate (PMID:41019825, PMID:38450054). Two reference_titles were initially written from memory and corrected against the cache - PMID:38375517 is a mini-review, not a randomized trial, and PMID:41019825's title differs from the plausible paraphrase; the PMID:41019825 quote_role was also corrected from REVIEW_SYNTHESIS to BACKGROUND once the cache showed it is an RCT quoted from its introduction. All references already cited, no new caches. just validate clean (89/89 snippets, 98 titles). No other section touched.

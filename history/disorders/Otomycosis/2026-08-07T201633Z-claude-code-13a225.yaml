  summary: Link ear-canal exposures to barrier and dysbiosis nodes
  details: |
    Backfill for issue #8085. The three exposures split by how directly they act on the node they target. Topical antibiotic use is TRIGGERS with DIRECT into the antibiotic-induced dysbiosis node: the drug acts on the resident flora itself with nothing in between, even though the same exposure is only predisposing for the disease overall. Ear canal trauma from cleaning is likewise TRIGGERS with DIRECT into the cerumen barrier node, since an instrument removes wax and abrades epithelium rather than merely weakening the barrier. Both cite the pooled systematic review that ranks them among the leading predisposing factors. Humid tropical climate is graded lower, PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because its evidence is a climate association asserted as background in a hospital case series with no measurement of cerumen pH, moisture, or peptide content. Both links to the systematic review quote sentences that name their own exposure; the pre-existing item on the trauma exposure cites a statistic about prior ototopic medication use instead, which PR review directed be moved rather than deferred. That evidence item, a statistic on prior ototopic medication use, now sits on the Topical antibiotic use exposure where it belongs, and the trauma exposure carries the systematic-review sentence that names trauma directly. Review also applied this tranche's own grading rule to the two new links and found them wanting: both snippets name their exposure as a predisposing factor for otomycosis, connecting it to the disease rather than to the targeted node, and the antibiotic link's own explanation already conceded that the dysbiosis step is inferred rather than observed. Both are now supports PARTIAL, matching how the climate link was graded. The TRIGGERS and DIRECT values are unchanged, because the mechanism claim and the evidence level are separate axes: an instrument does act on the barrier with nothing in between, whatever the citation establishes about it. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 58 of 65 with 7 pre-existing DOI-prefix skips.

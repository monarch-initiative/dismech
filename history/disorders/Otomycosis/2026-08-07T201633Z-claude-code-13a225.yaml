  summary: Link ear-canal exposures to barrier and dysbiosis nodes
  details: |
    Backfill for issue #8085. The three exposures split by how directly they act on the node they target. Topical antibiotic use is TRIGGERS with DIRECT into the antibiotic-induced dysbiosis node: the drug acts on the resident flora itself with nothing in between, even though the same exposure is only predisposing for the disease overall. Ear canal trauma from cleaning is likewise TRIGGERS with DIRECT into the cerumen barrier node, since an instrument removes wax and abrades epithelium rather than merely weakening the barrier. Both cite the pooled systematic review that ranks them among the leading predisposing factors. Humid tropical climate is graded lower, PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because its evidence is a climate association asserted as background in a hospital case series with no measurement of cerumen pH, moisture, or peptide content. Both links to the systematic review quote sentences that name their own exposure; the pre-existing item on the trauma exposure cites a statistic about prior ototopic medication use instead, which was left untouched rather than edited. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 58 of 65 with 7 pre-existing DOI-prefix skips.

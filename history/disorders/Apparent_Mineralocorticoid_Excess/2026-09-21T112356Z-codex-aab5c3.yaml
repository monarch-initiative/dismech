  summary: Review AME mechanisms, clinical spectrum, steroid diagnostics and longitudinal
    care evidence
  details: |
    Comprehensive review of all original cited references and genuine matching deep-research content, using complete cached scientific bodies and tables where available. New full primary physiological and 36-patient/structural-model papers resolve local cortisol access, renal sodium/potassium balance, selected follow-up denominators and prediction-versus-experiment boundaries. Thirteen atomic events distinguish enzyme activity, receptor access/activation, renal transport, volume and hormonal feedback, with a separately qualified placental route. Expanded 27 clinical findings preserve isolated dysmorphism without frequency claims, normal neurodevelopment in the Chinese series, and cohort-specific renal/cardiac outcomes. Corrected metabolite-versus-free-steroid ratios and normal serum cortisol. Replaced the contradicted universal spironolactone-response claim with case-specific combination treatment and monitoring; added selected cortisol suppression, transplantation and family care. Added kidney-specific mouse, residual-function expression and computational structural models with explicit limitations. The completed natural-history registry includes relatives and is not a treatment trial. Independent peers checked the graph and both recent clinical bodies; final care and diagnostic integration also passed independent review. Recovered and read the full 2020 review, retaining the proposed nonclassic screening construct and primary-aldosteronism treatment extrapolation as explicit limitations. No dedicated AME GeneReviews chapter was found. Some primary studies remain abstract-limited after sanctioned retrieval attempts; failed access-challenge bodies were excluded. Cache files were generated only with just fetch-reference.

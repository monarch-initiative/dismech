  summary: Bind pediatric-case dysmorphic features to HPO terms, scoped as VERY_RARE
  details: |
    Review response for PR #7934 (ai4c-reviewer, 2026-08-27).

    Item 1 (blocking): the single unbound "Dysmorphic features" phenotype had no phenotype_term, leaving five reported features invisible to any ontology query. Replaced it with five separately bound entries: Brittle hair (HP:0002299), Flat nasal bridge (HP:0005280 Depressed nasal bridge), Frontal bossing (HP:0002007), Long eyelashes (HP:0000527), and Ear tag (HP:0000384 Preauricular skin tag). All five CURIEs were read from cache/hp/terms.csv rather than written from memory.

    Item 2 (clinical validity): splitting alone would have published five craniofacial associations for AME on the strength of one patient. Each new entry therefore carries frequency VERY_RARE and prose scoped to the single genetically confirmed 2-year-old case, explicitly noting that the feature is not part of the established AME phenotype in HPO, Orphanet, or OMIM 218030, and that the parents were second-degree relatives. The earlier generalizing language ("documented in pediatric presentations", "may prompt genetic investigation") was removed.

    Item 4 (suggestion): category "Dysmorphology" was the KB's only occurrence; the four facial entries now use "Craniofacial" and the hair entry uses "Dermatologic".

    Item 5 (suggestion): the nephrocalcinosis snippet was trimmed to "medullary nephrocalcinosis, and multiple small bilateral cysts.", dropping both the PDF line-break artifact "corticome-dullary" and the polyuria lead sentence that was not about nephrocalcinosis.

    Item 6 (suggestion): the small-for-gestational-age snippet was trimmed to "and was small for gestational age at 1.97 kg.", avoiding republication of the source's internally inconsistent "born at term (36 weeks and 6 days' gestation)".

    Not changed: the paper's genetics and spironolactone treatment response, which the reviewer retracted as already present on main via #7869.

    Validation: just validate passed (51/51 snippets verified against references_cache), term validation passed, and check-duplicate-keys, check-entity-refs, check-snippet-boundaries, check-folded-hyphens are all clean. check-snippet-length and check-title-snippets report no findings in this file.

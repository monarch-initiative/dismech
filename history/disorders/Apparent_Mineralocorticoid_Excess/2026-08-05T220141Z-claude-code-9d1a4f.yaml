  summary: Augment AME with pediatric HSD11B2 p.Arg208Cys case (PMID:42503627)
  details: |
    Augmented the existing Apparent Mineralocorticoid Excess entry with evidence from a 2026 pediatric case report (PMID:42503627) documenting a homozygous pathogenic HSD11B2 variant c.622C>T; p.Arg208Cys confirmed by whole exome sequencing in a 2-year-old, the accompanying hypokalemia and metabolic alkalosis phenotypes, and the spironolactone treatment response. Addressed PR review feedback: replaced the mineralocorticoid-receptor-antagonist evidence snippet, which had quoted the paper's generic closing sentence and so did not specifically support spironolactone, with the dose-response sentence tying spironolactone escalation to correction of serum potassium; added PMID:42503627 to the top-level references block; trimmed a table-pointer sentence from the hypokalemia snippet; and softened two explanations that asserted numeric laboratory values present only in Table 1 and not in their quoted snippets. Validated with just validate (schema, term, and reference validation; 44/44 snippets verified against cached references).

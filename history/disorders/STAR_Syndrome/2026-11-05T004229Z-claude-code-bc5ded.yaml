  summary: 'Create: STAR_Syndrome'
  details: |
    New entry for STAR syndrome (MONDO:0010408), curated from the stub queue. Sources: the gene-discovery paper (PMID:18297069), later case reports and pedigrees, the CDK10/cyclin M functional papers (PMID:24218572, PMID:27104747, PMID:34369103), the Colas 2020 review (PMID:32762766), Orphanet ORPHA:140952 for phenotype frequencies and prevalence, and the ClinGen CCNQ assertion (Moderate, XL), recorded in gene_disease_validity. relationship_type is left unset because the schema defines CAUSATIVE as Definitive or Strong; check-gene-validity reported it as overstated. The OpenScientist report (research/STAR_Syndrome-deep-research-openscientist.md) was read after the literature draft: all 9 PMIDs resolved, the 2 unmatched quotes were elisions of abstract text, preflight-dr returned WARN only because the syndrome name STAR is counted as a gene symbol. Its only new PMID (35291876, a CDK10 cancer review) was not used. The report added the Cdk10 knockout mouse as a partner-gene model, entered under animal_models with a typed BOUNDARY_OMISSION divergence. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). No treatments were added: the cited sources describe no therapy beyond surgical repair, and none of the cached abstracts quote it. Validation: just validate, count-verified-snippets (all verified), validate-terms, and the offline gates in CLAUDE.md.

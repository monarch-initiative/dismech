  summary: 'Review round 1: add diagnosis, counseling, occasional phenotypes; split
    PKN2/RhoA node'
  details: |
    Response to the CHANGES_REQUESTED review on PR 16552. Added three diagnosis rows: clinical recognition (NCIT:C15607 Clinical Diagnosis), CCNQ sequence analysis (NCIT:C153598 DNA Sequencing) and Xq28 copy-number analysis (NCIT:C198497 Array-based Comparative Genomic Hybridization). Each NCIT CURIE and label was copied from a live OLS search of the ncit ontology (queries: Clinical Diagnosis, DNA Sequencing, Array Comparative Genomic Hybridization, Chromosomal Microarray), and all three are already members of the TreatmentActionTerm enum cache. Every reviewer-suggested sentence was confirmed as an exact substring of its cache file before use. Added a Genetic counseling treatment (NCIT:C15240 Genetic Counseling, label confirmed live) supported by PMID:32762766 and PMID:28322501. Added the four Orphanet occasional phenotypes (myopia, macular dystrophy, aortic regurgitation, mitral atresia) quoting the ORPHA:140952 rows, and wired them and the earlier set to CCNQ loss of function with the review sentence on variable heart and eye anomalies. Split the PKN2/RhoA node into PKN2 Hypophosphorylation and RhoA and Actin Network Destabilization: PMID:27104747 shows a non-phosphorylatable PKN2 mutant alone destabilizes RhoA and the actin network, so the edge between the two has its own evidence. RHOA is bound as hgnc:667 (HGNC REST lookup). The two CGGV evidence items lacked reference_title, which failed the CI reference-title gate on the first head; scripts/backfill_reference_titles.py filled them from the cache frontmatter.

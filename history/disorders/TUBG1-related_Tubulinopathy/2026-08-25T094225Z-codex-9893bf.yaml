  summary: 'Publication-readiness review: TUBG1-related tubulinopathy'
  details: |
    Publication-readiness review against locally cached primary and authoritative sources. Added canonical GeneReviews metadata and its cached full-text URL (PMID:27010057), plus TUBG1 case reports PMID:38912084 and PMID:41070651. Corrected the gamma-tubulin ring-complex binding from GO:0000930 to GO:0000931. The GO term and cellular-component enum rows were reused byte-for-byte from independently pinned open PR #9466 at base and merge-base 179ba219f825c3d5e0dda70df1ed2583933ea6ea and head 87abd3b12068e51164f907dc945246ab4b60ecc6; scoped term validation generated only the missing HP:0001302 and HP:0012430 imaging-enum rows. Corrected study-type classifications for the yeast assay and a background molecular statement while retaining direct PMID:29706637 patient imaging as HUMAN_CLINICAL.

    Separated severe intellectual disability from motor delay and repaired their causal wiring; added three structured MRI findings and direct diagnostic evidence. Bounded testing to panel or exome/genome approaches, qualified prenatal detection as general tubulinopathy evidence, and marked the 47-person burden/supportive-care findings as mixed-cohort context with one TUBG1 participant. Reworked anti-seizure, rehabilitative, and genetic-counseling text to describe supported use and recurrence guidance without unsupported TUBG1-specific frequency or comparative-efficacy claims. Reclassified the mouse-versus-zebrafish disagreement as HUMAN_MODEL_MISMATCH and updated notes provenance. No reference was fetched or hand-edited during this review.

    The identity and header fields (name, category, disease_term, description, and parents) and the existing animal_models records, modeled mechanisms, readouts, and supporting evidence were reviewed and retained unchanged.

    History scaffolding recovery: the first `just new-history` wrapper invocation failed during shell quoting before creating any file. A subsequent history-count and status check confirmed that the directory still contained only the pre-existing CREATE record and that worktree status was unchanged. The documented direct `uv run python scripts/new_history.py` invocation then created this sole REVIEW record.


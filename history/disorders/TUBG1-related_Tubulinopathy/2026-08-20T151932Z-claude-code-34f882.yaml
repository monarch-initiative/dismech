  summary: 'Create: TUBG1-related Tubulinopathy (CDCBM4, MONDO:0014171)'
  details: |
    New entry for the gamma-tubulin member of the Tubulinopathies grouping, created from recommendation 1 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md. The review found TUBG1 to be the grouping's one clear membership gap: the gene was already named as a tubulinopathy gene inside the KB - in evidence quoted by the TUBA1A entry, in that entry's notes, and as a lissencephaly gene in Lissencephaly_Spectrum_Disorders - without having an entry of its own.

    Curated sections: disease_term MONDO:0014171 (CDCBM4), inheritance, epidemiology, four pathophysiology nodes (three conforming to microtubule_dependent_neuronal_migration_failure), eight phenotypes, genetic, two diagnosis entries, three progression phases, clinical_burden, three treatments, two animal models with modeled_mechanisms and readouts, two knowledge-gap discussions.

    Two curation decisions worth recording. First, the entry is deliberately NOT conformed to neural_progenitor_centrosome_spindle_dysfunction despite gamma-tubulin being a centrosomal protein, because the mouse work reports intact progenitor proliferation and no major centrosome structural or functional defect in patient fibroblasts. The conflicting zebrafish neurogenesis result is curated as an open discussion rather than a second conformance, since the allele classes differ - heterozygous missense versus somatic null. Second, functional_impact_category is UNKNOWN by deliberate choice: all alleles are heterozygous missense so haploinsufficiency is not presumed, but the experiment that would have discriminated the mechanism argues against the obvious candidate.


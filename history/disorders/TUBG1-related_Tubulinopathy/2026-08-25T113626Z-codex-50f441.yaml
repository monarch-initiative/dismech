  summary: 'Address PR #9470 review: add posterior-predominant subcortical band heterotopia'
  details: |
    Addressed the sole material exact-head review finding on draft PR #9470. Added Posterior-Predominant Subcortical Band Heterotopia as both a phenotype and MRI finding using exact HP:0032411 rather than its broader parent HP:0032409. Frozen GeneReviews table evidence identifies the exact posterior-predominant subcortical-band classification in 1 of 3 reported TUBG1 persons and is classified SUPPORT/OTHER; frozen primary PMID:23603762 directly describes P478 with posterior pachygyria, laminar heterotopia, and a thick, dysmorphic corpus callosum and is classified PARTIAL/HUMAN_CLINICAL because it does not itself provide the exact narrower HPO wording. No frequency field was added: the founding 1-of-3 count is documented, but three ascertained reported persons do not support a stable disease-wide frequency estimate.

    Wired the new phenotype from Failure of Neuronal Locomotion Initiation through INDIRECT_KNOWN_INTERMEDIATES, with incomplete radial migration and ectopic subcortical neuronal positioning as the intermediate. This deliberately diverges from the reviewer-suggested Posterior-Predominant Pachygyria with Spared Deep Structures source node: P478 had a thick, dysmorphic corpus callosum, so sourcing that exception from a node whose identity encodes the typical spared-structures pattern would be semantically unsafe. Updated the entry description, tissue mechanism, MRI diagnosis, imaging-signature discussion, and notes to state that basal ganglia, brainstem, and cerebellum are often spared while corpus-callosum morphology is variable.

    Scoped term validation generated exactly three sorted additions and no deletions: HP:0032411 in cache/hp/terms.csv and in the PhenotypeTerm and ImagingFindingTerm enum caches. No reference cache, top-level reference list, prior history record, or unrelated cache row changed. Validation passed for Disease and all existing history schemas, strict ontology terms, cache-bound references, 77 of 77 cached snippets with strict boundaries, duplicate keys, source-defect claims, term-cache integrity, offline enum-cache structure, and the target causal graph. The four-path content freeze at binary patch SHA256 59a73b1777104a4f08282afb2a2b73a89bef59e242f4f10a56f8adab8c72f423 was independently audited and APPROVED with PRE=POST before this append-only history was scaffolded.

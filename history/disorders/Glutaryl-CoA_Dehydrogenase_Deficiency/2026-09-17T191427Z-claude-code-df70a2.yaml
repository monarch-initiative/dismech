  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the part of the earlier OpenScientist sweep (branch os-review-fable) that never merged, re-derived against main's current structure rather than merged from the old file. Applied four citations absent from main. PMID:18348873 (radiolabelled 3-OH-GA tracer in Gcdh-null mice) as a REFUTE item on the Hepatic GA1 catabolite production -> Brain accumulation of GA1 catabolites edge: brain and blood recovery of injected tracer falls during an induced encephalopathic crisis, so that edge does not operate by transport of the free acid. The hepatic hypothesis had no counter-evidence on main. PMID:21820344 (lysine-free arginine-rich formula) twice with different sentences: the 36 percent neurological-risk reduction as human outcome evidence on the Lysine-restricted diet treatment, which previously had no quantified human outcome, and the two-barrier transport-competition sentence in a new HUMAN_MODEL_MISMATCH discussion (ga1-compartmental-evidence-is-mouse-only) recording that every compartment-discriminating experiment is murine. PMID:32567100 (global Aass deletion) as evidence in main's existing ga1-compartment-source-partition discussion, which asserted that global AASS perturbation cannot partition source without citing the experiment, and again with a different sentence in a new KNOWLEDGE_GAP discussion (ga1-brain-lysine-route-to-glutarate). PMID:25214427 (cerebral L-pipecolate tracer study) anchors that same new discussion: main's Intracerebral GA1 catabolite production node already referred to 'older pipecolate flux studies' with no citation. Also added attaches_to to the existing partitioning discussion and the two proposed experiments (differential lysine isotope tracing, tissue-specific Aass deletion) it lacked. Prose correction: main had already narrowed the hepatic hypothesis away from predominant liver generation and recorded the three unmet limits, so that correction was not re-applied; instead its notes now also record the counterbalancing transport results that constrain the model. No ontology terms added, no status changed. Assessment sidecars were already present. Verified: linkml-validate no issues; 186/186 snippets verified against cached references; check-duplicate-keys, check-entity-refs, check-causal-targets and check-enum-values all OK.

  summary: 'Integrate assessed OpenScientist findings: compartmental origin of GA1
    catabolites'
  details: |
    Integrated the RETAINED and QUALIFIED claims from the two codex-authored OpenScientist assessment sidecars for this disease (hepatic_catabolite_origin_model and intracerebral_catabolite_origin_model, both PARTIALLY_SUPPORTED). No new assessment sidecar was written; both already existed.

    From the hepatic report: narrowed the hypothesis description from 'predominant hepatic generation' to a substantial hepatic contribution, because the assessment REJECTED the quantitative-predominance claim, and added notes recording the three unmet limits (no partitioning of the brain metabolite pool, unidentified transported species, no human data and a single mouse program). Added two REFUTE evidence items that the entry lacked: PMID:16573641 (brain catabolites stay low in liver-restricted Gcdh-/- mice and after intraperitoneal loading) and PMID:18348873 (radiolabelled 3-OHGA recovered poorly in brain, less still during an induced crisis), the latter also being the in vivo BBB study the report wrongly claimed did not exist.

    From the intracerebral report: added notes recording that local production and efflux-dominant transport are supported while the impermeable-barrier form is not, and that PARTIALLY_SUPPORTED is an assessment verdict rather than a permissible status value, so status stays ALTERNATIVE. Added PMID:16573641 as SUPPORT here (same sentence, opposite direction, which is claim-relative and deliberate). Added PMID:20302929 to the pathophysiology edge whose intermediate mechanism is 'limited blood-brain barrier transport', grounding that step and qualifying it as selective efflux rather than impermeability.

    Added PMID:21820344 to the lysine-restricted diet treatment: the 36 percent reduction in neurological risk is the strongest human outcome evidence for substrate-flux restriction.

    Added three discussions. ga1_compartmental_source_partitioning (KNOWLEDGE_GAP) carries the central unresolved question shared by both reports, cites PMID:32567100 as the non-localizing global Aass deletion, and proposes two discriminating experiments drawn from both reports' discriminating-test sections. ga1_brain_lysine_route_to_glutarate (KNOWLEDGE_GAP) records the tension between PMID:25214427 (little cerebral saccharopine production) and the AASS-dependent fall in brain glutarate. ga1_compartmental_evidence_is_mouse_only (HUMAN_MODEL_MISMATCH) records that all compartment-discriminating evidence is murine, citing the two-barrier competition sentence from PMID:21820344.

    Deliberately not integrated: PMID:41194801, a 2025 review the intracerebral assessment noted is not an independent compartment-specific experiment, so it adds no support the primary sources do not already carry. No ontology terms were added: the assessments REJECTED every CURIE both reports proposed (MONDO:0009280 is monosodium glutamate sensitivity, GO:0019470 is hydroxyproline catabolism, GO:0033512 is obsolete, GO:0015804 is neutral rather than cationic amino acid transport, CL:0002543 is a vein endothelial cell, GO:0006554 is obsolete, GO:0007417 is CNS development, GO:0007215 is not NMDA-selective). No status field was changed. The REJECTED claims (free-glutarate clearance by brain GCDH, hepatic quantitative predominance, crisis-dependent BBB influx, treatment-failure attribution, search-provenance counts) were not curated as content; where they bear on existing prose they are recorded as qualifications in the two notes blocks instead.

  summary: Review GA1 pathograph, clinical coverage and OpenScientist evidence
  details: |
    Extensive review of the full disease YAML, disease/canonical-hypothesis research and both OpenScientist reports, with primary-source verification and current GeneReviews/ClinicalTrials.gov checks.
    Phenotypes: remove unsupported frequency generalizations and mouse-only clinical evidence; distinguish cognitive impairment from intellectual disability and developmental frontotemporal changes from acute striatal degeneration; add regression, feeding and renal involvement.
    Subtypes/genetics: add biochemical high/low excreter classes; qualify screening sensitivity and population-specific variant proportions.
    Pathograph: separate local and hepatic catabolite production with unresolved hepatic transport intermediates; add measured limited efflux, astrocytic oxidative toxicity, energy impairment, context-dependent excitotoxicity with contrary data, vascular and renal pathways. Do not infer quantitative source fractions or direct free-GA clearance by GCDH.
    Treatment/diagnosis: correct lysine nutrition, carnitine and gene-replacement semantics; move screening to diagnosis; add confirmation, supportive care, surveillance, AASS substrate reduction and two registry-checked trials. Remove the nonphysiological counseling arrow.
    Model/evidence provenance: add linked mouse, rat and co-culture models; regenerate reference caches via sanctioned commands. Update both assessment YAMLs and matching narratives (25 claim judgments, 11 unexecuted proposed analyses); document unavailable search provenance and flawed isotope-route inference. Primary sources support most corrections; no new biological computation was needed or claimed.
    Remaining scientific uncertainties are explicitly represented as open discussions about transported species, source fractions and model-to-human neuronal mechanisms.

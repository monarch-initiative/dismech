  summary: 'Create: Oocyte/Zygote/Embryo Maturation Arrest 24 (TUBA1C)'
  details: |
    De-novo curation of OZEMA24 (MONDO:0979232, TUBA1C, OMIM:621232), claimed in #15591. Autosomal-recessive female infertility from biallelic truncating TUBA1C variants causing spindle assembly defects and recurrent preimplantation embryo arrest. Scoped to TUBA1C only; the sibling TUBA4A entity (OZEMA23, MONDO:0979231) from the same paper is out of scope. Pathograph: TUBA1C truncating variants -> spindle assembly defect -> recurrent preimplantation embryo developmental arrest -> female infertility, all cited to the defining paper PMID:39209701. A KNOWLEDGE_GAP discussion records that the downstream dimer-depletion/chromosome-missegregation steps are inferred from the TUBB8 paradigm (the transcriptomic work was on TUBA4A embryos) and no TUBA1C model exists. Donor-oocyte IVF recorded as management (no corrective therapy). Deep research: OpenScientist (Falcon unavailable, no Edison key); its reference validation 7/7 verified, preflight-dr cleared Named Entity Confusion (TUBA1C dominant, OMIM matched). Rejected its mislabelled term suggestions (NCIT:C15193 is Bone Marrow Biopsy, not IVF; HP:0030359 is a lung-carcinoma term). GeneReviews: NO_CHAPTER. Validated with just validate and just validate-disorders (11/11 snippets, 0 issues); entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, block-scalar-comments, delivery-system all pass.

  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and measurements: LOINC:34950-6 (Parvovirus B19 IgG and IgM panel - Serum) to the Serologic Testing row, whose evidence items consistently report both IgM and IgG antibody testing together, matching the panel code. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Incidentally fixed a pre-existing validator-blocking defect unrelated to this change: three evidence items under the Arthropathy phenotype (PMID:11993780, PMID:32646497, PMID:26044725) carried supports: NO_EVIDENCE with an empty snippet (''), which linkml-reference-validator rejects ('Supporting text is empty'). Removed all three, since a NO_EVIDENCE item with no quoted text asserts nothing and the remaining five evidence items for Arthropathy already support the phenotype. Part of dismech tranche-B batch11 (LOINC_DIAGNOSTICS.md tranche B).

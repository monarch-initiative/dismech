  summary: Conform to DNA damage checkpoint arrest module
  details: |
    Linked 'Cell Cycle Arrest and Apoptosis' to dna_damage_checkpoint_arrest#Checkpoint-Enforced Arrest of the Progenitor. The node already carried the NS1/ATR DNA damage response in CL:0000038 erythroid progenitor cells, which is the module's second worked arm; it now also binds GO:0007095 mitotic G2 DNA damage checkpoint signaling and GO:0045786 negative regulation of cell cycle, both INCREASED, so the G2/M arm of the module's central effector has a counterpart here. Added three evidence items: two from PMID:28264028 naming the ATR-CHK1-CDC25C-CDK1 route and the serine-216 phosphorylation of CDC25C that inactivates cyclin B/CDK1, and one from PMID:14625883 recording that the infection engages both the G1 and G2 transitions. The checkpoint is intact and virally driven, not lost, so the module boundary is met rather than the evading_growth_suppressors one. The node previously had no downstream edge at all, leaving the module's effector-to-consequence step unrepresented and the clinical phenotypes disconnected from the pathograph; it now points at the Transient Aplastic Crisis phenotype, evidenced by the transient arrest of erythropoiesis in infected progenitors (PMID:28377277, already cited in the entry) and by the short red-cell lifespan that converts that arrest into a crisis (PMID:14625883). Separately, three pre-existing NO_EVIDENCE items with empty snippets on the Arthropathy phenotype (PMID:11993780, PMID:32646497, PMID:26044725) were removed: an empty snippet fails reference validation, and two of the three explanations state that the cited paper does not bear on arthropathy at all. Seven verified evidence items remain on that phenotype.

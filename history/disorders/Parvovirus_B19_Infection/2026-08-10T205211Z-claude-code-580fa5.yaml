  summary: Add chronic PRCA and PPGSS phenotypes; document P-null natural resistance
  details: |
    Follow-up to issue #6432. All items in the issue's original outlier checklist (uncited pathophysiology nodes, uncited phenotypes, evidence_source defaulting, wrong-disease reference, deprecated fields, DiseaseTerm enum-cache gap) were already resolved on main via merged PRs #6510, #6471, and #8249 (confirmed against history/disorders/Parvovirus_B19_Infection/2026-07-14T044405Z-*.yaml and 2026-08-09T005906Z-*.yaml). This session addressed the three remaining 'info gap' enrichment items named in the issue: (1) added a new Hematologic phenotype for chronic pure red cell aplasia in immunocompromised hosts (HP:0012410), citing PMID:7986722, distinct from the existing Transient Aplastic Crisis phenotype which covers immunocompetent hemolytic-disorder patients; (2) added a new Dermatologic phenotype for papular-purpuric gloves and socks syndrome (PPGSS), bound to the closest available HP term (HP:0031363 Palpable purpura, since no exact PPGSS term exists in HPO) with a more specific preferred_term, citing PMID:9675471 and PMID:12852167; (3) documented P-antigen (P-null/p-phenotype) natural resistance to B19V infection on the existing Receptor-Mediated Entry pathophysiology node's notes and evidence, citing the classic Brown et al. NEJM 1994 study (PMID:8139629). Also closed the stale draft PR #7126 (899 commits behind main), whose diff would have regressed content already fixed by the merged PRs above. Validated: just validate (schema/terms/references all pass), 93/93 snippets verified against cached references.

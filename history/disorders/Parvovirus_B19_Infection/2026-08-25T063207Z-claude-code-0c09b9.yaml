  summary: 'Address review: PPGSS frequency band and evidence-source split'
  details: |
    Review-response session for PR 8312. Corrected the PPGSS phenotype frequency from OCCASIONAL to VERY_RARE: neither cited paper supports the 5-29 percent band, and PMID:12852167 calls it a relatively rare viral exanthema while PMID:9675471 calls it an unusual syndrome and reports only the second documented US case. Added a dedicated evidence item quoting the rarity wording and documenting the Pattern C qualitative mapping from docs/frequency-evidence-guidelines.md. Rebound the PPGSS phenotype_term from HP:0031363 Palpable purpura to the more neutral parent HP:0000979 Purpura, since palpable purpura classically connotes cutaneous small-vessel vasculitis, which PPGSS is not. Split the PMID:8139629 evidence into two items so each carries a single evidence_source: the cross-sectional seroprevalence result stays HUMAN_CLINICAL, and a new IN_VITRO item quotes the p-phenotype bone-marrow experiment that the previous explanation relied on without quoting. Softened the receptor claim from the required cellular receptor for entry to required for productive infection, per the refined VP1u/globoside model in the entry deep-research artifact. Validated with just validate, just validate-terms and just count-verified-snippets at 95/95.

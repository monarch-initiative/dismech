  summary: 'Create: Dentinogenesis Imperfecta'
  details: |
    De novo curation of MONDO:0018849 (isolated, non-syndromic DGI) from a claude_code deep-research report, after seven OpenScientist runs produced no report: four were cancelled at the client's 3600s default and three more, including one run solo at the front of the queue, at the provider's 7200s maximum. preflight-dr returned SKIP because MONDO records no causal gene (RO:0004003) for this term, so the gene-identity check could not discriminate; the manual fallback was done instead - DSPP dominates the report at 202 mentions, and COL1A1/COL1A2 appear only in the explicitly excluded osteogenesis imperfecta form. Lump/split decision: one Disease entry with Shields types II and III as has_subtypes severity grades carrying their MONDO child terms (MONDO:0007441, MONDO:0007442), following de La Dure-Molla (PMID:25118030) and Simmer (PMID:35627243), both of which argue these are one allelic entity; the competing MONDO/OMIM split is named in notes so it can be reconstructed. Dentin dysplasia type II is left as its own entry, as its own notes anticipated. Shields type I (COL1A1/COL1A2, OI-associated) is out of scope. A phenotype-contamination caution is recorded: Orphanet ORPHA:49042 and GARD both list joint hypermobility, blue sclerae, bruising susceptibility and prolonged bleeding time, which are osteogenesis imperfecta features rather than features of isolated DSPP disease (Barron PMID:19021896 states no bone defects occur with DSPP mutations); they are not curated here, but the Swedish study (PMID:30134932) found 30% joint hypermobility and one misdiagnosed OI type IV case, so the overlap is recorded as a differential-diagnosis problem rather than dismissed as annotation error. Prevalence uses the only population-based nationwide estimate (2.2 per 100,000) rather than the ubiquitous 1975 Witkop figure, with both named. Every snippet re-verified against the local reference cache: 22 snippets, 0 issues. Two corrections made during the pass, both of the kind CLAUDE.md documents: HP:0008553 was written from memory and does not exist (corrected to HP:0001757), and a DFNA39 quote taken from the research report reversed the source's word order and did not match the abstract (corrected to the source's own wording, which also revealed that only two of three families had hearing loss). GeneReviews absence recorded as a verified negative. Validated with just validate plus check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-name-collisions, check-snippet-grading and check-shared-disease-terms.

  summary: 'Create: Congenital_Analbuminemia'
  details: |
    New entry for congenital analbuminemia (MONDO:0014449, ALB, ClinGen Definitive AR), claimed in issue 16178. Curated from PubMed primary reports and reviews: the 2019 Minchiotti review (full text, PMID:31057599), the 2023 plasma-protein systematic review (PMID:36979342), the 2026 pediatric multisystem series (PMID:42311911), the Saskatchewan perinatal series (PMID:23730173), platelet and treatment case reports, and the Nagase rat and albumin knockout mouse papers. Pathograph: biallelic ALB loss of function -> absent circulating albumin -> reduced oncotic pressure, impaired fatty acid and ligand transport (raised free drug fraction), compensatory upregulation of non-albumin plasma proteins -> increased hepatic cholesterol synthesis, and platelet activation / prothrombotic state. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Orphanet ORPHA:86816 could not be cited because Orphadata downloads are blocked by the session proxy. HP:0005268 Miscarriage is outside the PhenotypeTerm enum, so miscarriage is described in prose. Falcon deep research was requested but the provider reported no Edison key (ProviderNotConfiguredError), so the run used --fallback and openscientist wrote the report (research/Congenital_Analbuminemia-deep-research-openscientist.md; 30/30 references verified, preflight-dr names ALB correctly). The report agreed with the curated chain; from it the entry added the Nagase rat mycophenolic acid free-fraction result (PMID:26643991) and the albumin knockout mouse tolerance result (PMID:25654695). GO:0005504 fatty acid binding was bound on the ALB node for check-gene-activity-grounding. Validation: just validate, validate-terms, count-verified-snippets 69/69, validate-disorders, check-gene-activity-grounding, check-snippet-grading, check-entity-refs, check-causal-targets, check-logical-rules, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-reference-titles all pass.

  summary: 'Review round 1: Nephrotic_Syndrome_Type_18'
  details: |
    Review round 1 changes on PR 16526.

    Kidney Failure description corrected: in the pooled review (PMID:39331077) the median ages at kidney failure are 8.5, 3.7, 6.9, 13, 15 and 7 years for NUP85, NUP93, NUP107, NUP133, NUP160 and NUP205, so NUP133 (13 years) is second latest after NUP160 (15 years), not the latest. The onset statement on the SRNS phenotype was re-checked against the same abstract (7, 3, 4.1, 9, 7, 2 years) and is correct: NUP133 at 9 years is the latest onset.

    GeneReviews Genetic SRNS Overview (url:NBK573219) now backs three more claims with exact quotes: the RAASi recommendation on the RAAS inhibition treatment, the advice to avoid ineffective prednisolone/prednisone once SRNS is established on the immunosuppressant discontinuation row, and the autosomal recessive sib-risk and asymptomatic-carrier sentences on the inheritance block. The sib-risk sentence is quoted in two parts joined by an ellipsis, eliding only the word "carrier", which the source renders as a glossary link.

    Human evidence added to Proteinuria and to Focal Segmental Glomerulosclerosis: the ClinGen evidence summary sentence on the clinical presentation of the NUP133 spectrum, graded OTHER with REVIEW_SYNTHESIS like the entry's other ClinGen items. No cached human source describes foot process effacement in a NUP133 patient (Braun 2018 abstract, Fujita 2018 abstract and the GeneReviews overview were searched); the phenotype description now says effacement is shown directly only in zebrafish and is inferred in patients from FSGS biopsies.

    RAAS inhibition now carries therapeutic_agent bindings NCIT:C247 ACE Inhibitor and NCIT:C66930 Angiotensin II Receptor Antagonist, both members of the ChemicalEntityTerm enum cache and accepted by validate-terms. The immunosuppressant discontinuation row's therapeutic_modality changed from BEHAVIORAL to OTHER.

    Declined: hypoalbuminemia, edema and hyperlipidemia phenotypes. The GeneReviews overview mentions hypoalbuminemia and edema only in its general definition of nephrotic syndrome and does not mention hyperlipidemia; no cached source reports these findings in NUP133 patients, so adding them would rest on the definition of the syndrome rather than on NUP133 evidence.

    The ClinGen evidence item under gene_disease_validity lacked a reference_title, which CI's find_missing_reference_titles check reported; scripts/backfill_reference_titles.py copied it from the cache frontmatter. Every evidence item added in this round carries a reference_title.

    Validation: validate, count-verified-snippets (61/61), validate-terms, snippet-grading, snippet-length, title-snippets, entity-refs, causal-targets, coarse-phenotypes, name-collisions, duplicate-keys, block-scalar-comments, enum-values, normalize-cache, check-cache-order and validate-disorders all pass.

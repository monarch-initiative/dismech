  summary: 'Create: Nephrotic_Syndrome_Type_18'
  details: |
    New de novo entry for NUP133-related steroid-resistant nephrotic syndrome
    (NPHS18, MONDO:0032581, OMIM 618177), modelled on Nephrotic_Syndrome_Type_12
    (NUP93) for shape. NUP133 is a Y-complex (outer ring) nucleoporin, so the
    entry does not reuse NUP93 inner-ring or NUP93-specific SMAD findings.

    Sources. Founding report Braun 2018 (PMID:30179222, abstract only; full text
    requested but declined by the publisher, PMC record carried no body text).
    Fujita 2018 (PMID:30427554) for the allelic Galloway-Mowat syndrome 8 family
    and the c.3335-11T>A splice allele. Zebrafish nup133 morpholino knockdown
    (PMID:30894603, full text): proteinuria and foot process effacement without a
    gross pore assembly defect, a REFUTE-graded point against a pore-loss pathway
    for the partial-loss disease state. CRISPR NUP133 knockout and patient-allele
    human podocytes (PMID:35455939, full text): pore, transcriptome and
    RhoGTPase/cytoskeleton phenotypes in the knockout, only mild defects from the
    re-expressed patient alleles (recorded as the mild-allele open question).
    2023 letter (PMID:37041680) naming p.Lys966Asn; its cache holds only a figure
    legend, quoted as such. Review PMID:39331077 for pooled median onset (9 y) and
    kidney failure (13 y); NUP133 is the fourth of six nucleoporin genes in each
    ordered list, recorded in notes so the figure is traceable. GeneReviews Genetic
    SRNS Overview (PMID:34436835) for the baseline.

    ClinGen. Glomerulopathy GCEP rates NUP133-NPHS18 Moderate (25 June 2024, SOP10),
    recorded in gene_disease_validity with the CGGV id; its MONDO term is the
    entry's disease_term, so the same-disease rule is satisfied. ClinGen lumps
    NPHS18 and Galloway-Mowat syndrome 8 into one spectrum. Because Moderate falls
    short of the Definitive/Strong that the schema ties to CAUSATIVE,
    relationship_type is UNKNOWN (following SEC61A1_Deficiency and CATSHL_Syndrome
    precedent) with the reason in genetic notes. check-gene-validity reports no
    conflict or overstatement.

    Lump/split and naming. Kept the name Nephrotic Syndrome Type 18 (MONDO has no
    gene-related label; matches the NPHS12 precedent). The syndromic Galloway-Mowat
    form is already a has_subtypes row (GAMOS8) in Galloway-Mowat_Syndrome.yaml;
    this entry is scoped to the isolated renal form and notes point to it rather
    than re-curating the neural phenotype here.

    DR report. research/Nephrotic_Syndrome_Type_18-deep-research-openscientist.md
    had not appeared when the entry was completed; curated without it.


  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding LOINC:55827-0 Acid alpha glucosidase [Enzymatic activity/volume] in DBS, with one reference range from the Pennsylvania programme (PMID:33202836): low GAA activity below 2.10 micromole/L/h triggers second-tier GAA sequencing, carried as a LOW band and a NORMAL band. The Japanese feasibility study's percentage-of-normal-mean rule (PMID:21963784) is quoted as evidence because it is not expressible in the code's unit. Bound the LOINC Part LP14013-4 on the Decreased acid alpha-glucosidase activity marker, which describes both DBS and liquid blood specimens. LOINC labels were read from the Monarch KG via just loinc-seed-cache; sources were found by PubMed esearch, not recalled. Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, validate-disorders and the KB-wide snippet-grading gate.

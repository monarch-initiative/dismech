  summary: Add guideline-derived ERT triple-S criteria and follow-up to Pompe disease
  details: |
    Mined the Pompe disease clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2). Pharmacotherapy (ERT, cipaglucosidase+miglustat) and supportive care were already deep; the guidelines' distinctive contribution is the ERT decision framework and structured follow-up. Added 1 treatment: ERT Start, Switch, and Stop (Triple-S) Criteria (MAXO:0000950; European Pompe Consortium 2024 update, PMID:38873957) with six-monthly muscle-function monitoring. Reinforced the existing ERT treatment with the late-onset recommendations (PMID:41453611, ERT as standard treatment) and infantile-onset guidelines (PMID:27600742, prompt ERT once CRIM status known). Reinforced the existing urine Hex4/Glc4 biochemical biomarker with the ACMG biomarker technical standard (PMID:39499245). All 6 new snippets snippet-verified against fetched abstracts. Schema and term validation pass; validate-references reports 0 checks (the known false-pass).

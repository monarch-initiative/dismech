  summary: Wire EHMT1 and KMT2C into the pathograph and record the KMT2C nosology
    dispute
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    Both checklist genes were already present as `genetic:` records, but neither had a
    `subtype:` foreign key, no subtype row carried a gene, no gene reached a
    pathophysiology node, and the KMT2C record had `evidence: []` under a note saying
    citations "can be added when available". All four are fixed.

    The substantive finding is nosological. Researching KMT2C turned up a 2024 series
    of 98 ascertained individuals (81 with pathogenic or likely pathogenic variants)
    showing the KMT2C-related neurodevelopmental disorder is clinically and
    epigenetically distinct from EHMT1-related Kleefstra syndrome 1 and from
    KMT2D-related Kabuki syndrome - separable by facial gestalt scoring and by a
    disorder-specific DNA methylation episignature - whose authors explicitly call for
    the condition to be renamed. A 2026 three-patient series reaches the same
    conclusion about distinctness while continuing to use the Kleefstra syndrome 2
    label. Independently, ClinGen's only KMT2C gene-disease validity assertion is
    against syndromic intellectual disability (MONDO:0000508, definitive), not against
    Kleefstra syndrome 2. MONDO records KMT2C as the causal gene of MONDO:0054701, so
    the pair is curated as the checklist expects, but the subtype row and the gene
    record now both carry the argument that the disease concept is contested rather
    than presenting KMT2C and EHMT1 as one clinical entity.

    Pathograph: EHMT1 is bound on its own node. A new node, `KMT2C haploinsufficiency
    and reduced H3K4 methylation`, gives KMT2C somewhere to reach - it conforms to the
    same epigenetic-machinery module node as the EHMT1 node, and its own notes record
    why it does not draw an edge to the NMDAR or REST/NRSF nodes: both of those rest
    on EHMT1-specific results and no published work places KMT2C on either. Its
    downstream edges to the shared phenotypes are typed
    INDIRECT_UNKNOWN_INTERMEDIATES for the same reason.

    Incidental repair: the NMDAR node's `downstream` named a target,
    `Intellectual disability and speech delay`, that matched no node - a grandfathered
    dangling target. It is split into the two real phenotype nodes and the row removed
    from `tests/causal_target_baseline.txt`, which shrinks by one.

    A first draft recorded the cohort's inherited-PTV fraction as a `case_fractions`
    entry. That slot carries the share of a disease's cases attributable to a gene;
    the share of one gene's truncating variants that were inherited is a different
    quantity, so it is recorded as evidence instead.

  summary: 'Edit: Cyanide Poisoning - red-team review fixes, and a correction to the
    prior record'
  details: |
    CORRECTION to 2026-09-10T021614Z-claude-code-3bd294. That record enumerated a set of passing checks including 'just validate passed' and 'check-enum-values'. Those runs were real but were performed against the tree as it stood before a top-level references: block was added minutes later, and that block briefly broke schema validation twice (findings given as strings rather than Finding objects; a tags: value of ClinicalGuideline against an enum permitting only GeneReviews). Both were fixed and the full batched gate was re-run and passed before the commit, so the committed tree was validated - but the earlier record's enumeration described a slightly different tree than the one it was filed against, which is the thing CLAUDE.md's 'never claim a check that did not finish' rule exists to prevent. History is append-only, so this record corrects it rather than editing it.

    A pre-PR red-team review (dismech-pr-review skill, fresh-context subagent) then found two blocking issues and nine important ones. All were addressed in this edit.

    BLOCKING. (1) PMID:25692407 is a rodent and iPSC-neuron study whose introduction summarises other authors' human case reports. Four evidence items quoted that introduction, two graded HUMAN_CLINICAL and one graded MODEL_ORGANISM on a sentence that says 'in humans' - incoherent on its face and wrong in both directions, since evidence_source classifies the cited publication's own evidence. Worse, the entire Delayed Neurological Sequelae subtype and both its phenotypes rested on that secondhand source while the primary human reports sat uncited in the same commit. Re-cited to PMID:3225591 (dystonic-parkinsonian syndrome with MRI) and PMID:1564480 (delayed dystonia, 21-year follow-up, levodopa response) as HUMAN_CLINICAL; all five remaining PMID:25692407 uses are now uniformly OTHER with an explanation saying why. (2) Cited further fetched-but-unused primary sources: PMID:35042362 into the contested fire-smoke exposure and the new diagnosis block, PMID:29021725 into the hydroxocobalamin discussion as a REFUTE item cutting against the systematic review, PMID:24648474 into the new progression block.

    STRUCTURE. Three pathophysiology nodes bundled two mechanistic claims each and were split, which is what the single-valued biological_scale rule is a tripwire for: Myocardial Energy Failure (CELLULAR) now feeds Cardiovascular Collapse (ORGANISM); Cerebral Energy Failure (CELLULAR) now feeds Excitotoxic Neuronal Injury (CELLULAR); and Anaerobic Glycolytic Shift is CELLULAR with the systemic acidosis modelled as its downstream phenotypes rather than bundled into the node name. Four phenotypes (Headache, Vertigo, Confusion, Tachypnea) had no incoming edge - invisible to check-causal-targets, which finds dangling targets and not orphan nodes - and are now wired to Cerebral Energy Failure and Anaerobic Glycolytic Shift respectively. Every node in the graph now has an incoming edge. 'Systemic Cyanide Absorption' was renamed 'Systemic Cyanide Burden' so that hydroxocobalamin INHIBITS-ing it is a true statement; hydroxocobalamin scavenges circulating cyanide, it does not inhibit absorption. Added subtype_term MONDO:0017640 (cyanide-induced parkinsonism) to the delayed-sequelae subtype, which also stops that concept sitting in the MONDO curation queue.

    CLAIMS TIGHTENED. The hydroxocobalamin description asserted it 'is safe' to give empirically to fire victims, directly contradicting the REFUTE item beneath it; it now states the empiric indication is where the evidence is weakest and names the AKI and methaemoglobinaemia signals. A supportive-care explanation said 'sufficient management in a substantial share' where the quote said only that detoxification can occur without antidotes; tightened, and the source's stronger 1994 position is now flagged rather than silently endorsed. The nitroprusside exposure edge was evidenced by an adjacent claim about hydroxocobalamin and reconstructed by inference; it now quotes the sentence that states the risk directly. A headless mid-sentence snippet was replaced with a subject-bearing sentence from PMID:16790311. Encephalopathy's description claimed more exposure routes than its quote covers. The nitric-oxide dose-dependence is now stated explicitly in both places it appears, since low endogenous NO potentiates Complex IV inhibition and high exogenous NO antagonises it, and without that clause the two nodes read as a contradiction. Basal Ganglia Necrosis now records the wider cerebellar and cortical involvement PMID:3225591 reports.

    SECTIONS ADDED. diagnosis (clinical diagnosis with lactate surrogate; brain MRI for sequelae), differential_diagnoses (carbon monoxide poisoning, methemoglobinemia), progression (acute toxidrome, recovery, delayed sequelae - recording that the extrapyramidal and neuropsychological delayed outcomes are separable, since PMID:24648474's survivor had the second without the first). prevalence remains deliberately absent and the notes now say why: poison-centre totals systematically miss the fatal exposures, and the fire-attributable fraction is the contested question this entry records rather than settles.

    NOT DONE. The Konzo entry does not link back to this one. That is an edit to a second KB entry requiring its own history record and is recorded in notes as follow-up rather than folded in here. Countermeasure references for cobinamide, dicobalt edetate and the platinum and molybdenum agents remain cached but uncited; they are investigational and adding them as treatments would widen the entry beyond acute clinical management.

    VALIDATION of this edit: just validate-disorders passed (schema, terms, 107/107 snippets verified against the cache) against the final tree, run after every edit above. Gates re-run and green on the final tree: check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles. Compliance 90.8 percent (228/251 filled, up from 195 filled; the percentage falls because the new sections add optional slots).

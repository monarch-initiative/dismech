  summary: 'Create: Cyanide Poisoning'
  details: |
    Created kb/disorders/Cyanide_Poisoning.yaml (MONDO:0018754), a new exposure-related entry covering acute cyanide poisoning and its delayed neurological sequelae.

    Deep research: one provider, claude_code (just research-disorder claude_code Cyanide_Poisoning), 340 s, 14 web searches, 16 turns, 37 citations. The run emitted no validation sections, so both retro-fits were applied: just validate-research-reference reported 26/26 references resolved, 0 unresolved, 0 off topic; just validate-research-terms reported 58 terms checked, 55 resolved, 0 unresolved, 1 obsolete (GO:0005751, superseded by GO:0045277) and 10 named as a different term. Nothing was bound from the report. Every CURIE in the entry was looked up independently through ols:/sqlite:obo: adapters at the moment it was written, which is what caught the report's wrong bindings: it offered UBERON:0001873 for globus pallidus (that is caudate nucleus; correct is UBERON:0001875), HGNC:12362 for TST (correct hgnc:12388), HGNC:7386 for MPST, CHEBI:75504 for sodium cyanide (that is pyranoside), CHEBI:9539 for sodium nitroprusside (Thiarubrine B) and CHEBI:15672 for linamarin (D-tartaric acid).

    Content: an eight-node causal chain from systemic absorption through cytochrome c oxidase inhibition, oxidative-phosphorylation failure and anaerobic glycolytic shift to myocardial and cerebral energy failure and basal ganglia necrosis, with a parallel rhodanese detoxification node that the thiosulfate antidote targets; 15 phenotypes; three subtypes (acute, delayed dystonic-parkinsonian, nitroprusside-associated); four pathograph-linked environmental exposures (fire smoke, occupational salts, cyanogenic glycosides, nitroprusside); five treatments; TST as a MODIFIER gene; two biochemical markers; two animal models with modeled_mechanisms; two datasets; two KNOWLEDGE_GAP discussions.

    Deliberate omissions, recorded in the entry notes: per-symptom frequencies quoted by the report were attributed to a systematic review it did not identify, so they were left out rather than curated from an unsourced figure; no HPO term exists for elevated venous oxygen saturation or bitter-almond breath odour, so both are prose only; PMID:41627127 was fetched but has no abstract in the cache and is not cited. The oxygen-to-Complex-IV treatment edge is recorded as MODULATES and explicitly left uncited because no cited source states the mass-action mechanism. A REFUTE evidence item (PMID:8150843) and a REFUTE item on hydroxocobalamin (PMID:41497958) record genuine, live disagreements rather than resolving them.

    Validation: just validate passed (schema, terms, 89/89 snippets verified against the cache). just validate-disorders run over the changed file. Offline gates all green: check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-source-defect-claims. just verify-datasets resolved both geo: accessions and their GEO_*.md cache files are committed. Compliance 93.3 percent. No GeneReviews article exists for this disease (PubMed search returned zero), as expected for a non-Mendelian toxidrome. No stub existed to delete.

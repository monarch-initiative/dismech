  summary: 'Edit: Cyanide Poisoning - respiratory failure phenotype and two antidotes,
    from PR #11588 review'
  details: |
    Addresses the changes-requested review on PR #11588.

    BLOCKING ITEM, taken. Added a Respiratory failure phenotype bound to HP:0002878, evidenced by PMID:41204534 with a verified exact quote, and wired in with a downstream edge from Cerebral Energy Failure so it does not orphan. The reviewer was right that Tachypnea does not cover this: the two sit at opposite ends of the respiratory course, tachypnea being respiratory compensation for the metabolic acidosis and respiratory failure being late brainstem depression. Both the quote and the HP term were verified against the local cache before use rather than taken from the review; both checked out.

    OPTIONAL ITEMS TAKEN. Added Amyl Nitrite and Dicobalt Edetate as treatments, both quotable from references already cached for this entry. Amyl nitrite carries two evidence items from PMID:41204534, its clinical use and the methaemoglobin ceiling that limits both nitrite antidotes. Dicobalt edetate carries three, from PMID:31389254 and PMID:8989894, including the adverse-effect profile that explains why hydroxocobalamin is preferred where both are available. One dicobalt snippet had to be trimmed to end before the source's inline citation marker, which the snippet matcher strips.

    OPTIONAL ITEMS DECLINED, each recorded in the entry notes rather than left silent.

    Cell-type granularity: declined, and the suggested CURIE is wrong. The review proposed CL:0000842 for striatal medium spiny neurons. CL:0000842 is *mononuclear leukocyte* - a white blood cell. The medium spiny neuron term is CL:1001474. That CURIE came from the deep-research report, which offered it in the same list as the ten mislabelled identifiers already flagged on this PR, so this is that failure mode reaching one step further. Beyond the wrong identifier, the binding would be wrong on the merits: no cited source here names the cell type, and Basal Ganglia Necrosis spans globus pallidus as well as putamen, so a medium spiny neuron term would be wrong for half the node. Nodes stay at CL:0000540 (neuron).

    Cyanosis, bradycardia and atrioventricular block: declined for now. Confirmed by grep that none of the 24 references cached for this entry mentions any of them, and a targeted PubMed search for a citable source returned nothing usable. Recorded in notes as uncurated rather than cited to a source that does not carry them.

    Node name 'Oxidative Phosphorylation Failure and ATP Depletion': left as is. The reviewer judged it atomic and said leaving it is defensible; proton-motive-force collapse and ATP fall are not separable in time here, so renaming would churn edge targets for no semantic gain.

    MPST as secondary detoxifying enzyme: left uncurated, as the reviewer agreed.

    VALIDATION: just validate-disorders passed, 113/113 snippets verified against the cache (up from 107). All eleven offline gates green. Graph re-checked directly: no unresolved targets and no node without an incoming edge.

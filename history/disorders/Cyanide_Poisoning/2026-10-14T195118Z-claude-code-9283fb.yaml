  summary: Bind LOINC codes to the two biochemical markers
  details: |
    Added loinc_term to the existing Blood lactate (LOINC:2524-7, Lactate [Moles/volume] in Serum or Plasma) and Blood cyanide concentration (LOINC:5634-1, Cyanide [Mass/volume] in Blood) markers. No reference_ranges band is bound: both cited thresholds (lactate >=8 mmol/L in non-fire poisoning, >10 mmol/L in smoke-inhalation victims; blood cyanide 'roughly 3 mg/L' as fatal) are single-cohort sensitivity/specificity screening associations or hedged retrospective distributions, not deterministic diagnostic cut-offs, and the smoke-inhalation figure's strict '>' inequality cannot be represented by a half-open reference_ranges band (inclusive lower_bound) without asserting a precision the source does not state. LOINC:2524-7 was found already present on the unmerged origin/loinc-m-batch2 branch (tranche M); both codes were verified against the Monarch KG and confirmed absent from origin/main before being seeded as new, additive cache rows.

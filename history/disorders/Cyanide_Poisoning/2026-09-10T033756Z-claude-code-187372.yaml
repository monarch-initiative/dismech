  summary: 'Edit: Cyanide Poisoning - regrade background-prose evidence on two review/model
    papers'
  details: |
    Second review round on PR #11588. One blocking finding, taken, plus one instance of the same defect the review did not catch.

    REVIEWER'S FINDING, correct and taken. Two evidence items on the Dicobalt Edetate treatment cited PMID:31389254 as HUMAN_CLINICAL. That paper is 'Modest and variable efficacy of pre-exposure hydroxocobalamin and dicobalt edetate in a porcine model of acute cyanide salt poisoning' - a pig study - and both quoted sentences are background prose about clinical antidote practice, the second carrying an inline citation marker showing it is repeating someone else's report. Regraded to OTHER. This is the same defect commit 5dad588e1 fixed for PMID:25692407, reintroduced two commits later on a different paper, which is worth recording plainly: fixing an instance of a defect is not the same as internalising the rule that generates it. check-snippet-grading could not catch it because that gate keys on the quoted sentence and these were different sentences from the paper's four MODEL_ORGANISM items.

    FOUND BY AUDIT, not by the review. Rather than fix only the two lines named, every (reference, evidence_source) pair in the file was enumerated and each reference checked against what its cached record says the publication actually is. That surfaced PMID:31389254 as the only reference carrying contradictory values, and separately surfaced PMID:8440119, graded HUMAN_CLINICAL four times. Its own abstract describes a narrative review whose data sources are 'English and foreign-language journal articles and reference texts identified from Index Medicus' with 'Both animal and human studies were included'. It is not primary human clinical evidence, and one of the four quoted sentences explicitly spans 'animals and surgical patients', so no single source value describes it - the mixed-source case CLAUDE.md says to split. All four regraded to OTHER.

    PMID:35042362 was examined and deliberately left at HUMAN_CLINICAL. Unlike the two above, that paper presents its own human material (two mini case reports), so HUMAN_CLINICAL is correct at the publication level even though the three sentences quoted here are framing rather than case detail.

    PMID:31389254 now carries two values, OTHER for background and MODEL_ORGANISM for its own porcine data. That is not a contradiction but the intended pattern: CLAUDE.md says to split evidence items so each carries a single source value when a paper mixes them.

    The grading policy applied across these three references is now recorded in the entry notes so the next curator does not have to re-derive it from the diff.

    REVIEWER'S OWN CORRECTION. The previous round suggested CL:0000842 for striatal medium spiny neurons; that CURIE is mononuclear leukocyte, and the reviewer has now confirmed and recorded the error itself, noting the medium spiny neuron term is CL:1001474 and that the rule about reading every CURIE from a source applies to reviewers suggesting terms as well as curators binding them. Nothing to change in the entry - the term was never bound, and the correction was already recorded in notes last round.

    VALIDATION: just validate-disorders passed, 113/113 snippets verified. All eleven offline gates green, including check-snippet-grading.

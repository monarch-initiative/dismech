  summary: 'Create: Rhabdoid Tumor Predisposition Syndrome 2'
  details: |
    Created kb/disorders/Rhabdoid_Tumor_Predisposition_Syndrome_2.yaml for MONDO:0013224, the germline SMARCA4 predisposition, resolving the stub stubs/Rhabdoid_Tumor_Predisposition_Syndrome_2.yaml which is deleted in the same change. Curated alongside RTPS1 so the two SWI/SNF lesions could be written against each other: SMARCB1 loss destabilises the BAF complex, whereas SMARCA4 loss leaves an assembled but catalytically dead complex, and the entries state that contrast explicitly. Six pathophysiology nodes, four phenotypes, a genetic block and one treatment. The distinguishing feature curated here is small cell carcinoma of the ovary hypercalcemic type, which extends the surveillance window into young adulthood and separates RTPS2 management from RTPS1. Term-binding caveat: HPO has no term for SCCOHT, so the phenotype is bound to the accurate broader HP:0100615 Ovarian neoplasm with the specificity carried in preferred_term; a reviewer may reasonably want a different call. Deep research: falcon returned HTTP 403 for an invalid EDISON_API_KEY and the run fell back to claude_code via --fallback-provider, recorded in the report frontmatter. Report references resolved 18 of 18, confabulation_rate 0.0; the validator flagged PMC:PMC2868905, a mouse blastocyst Brg1 paper, as off topic and it was not cited. The report also proposed the obsolete GO:0031065, which was not used. All bindings resolved independently from committed caches and exact-match OLS queries. Validated with just validate, 8 of 8 snippets verified, plus check-duplicate-keys, check-entity-refs and validate-terms.

  summary: Review and enrich Rhabdoid Tumor Predisposition Syndrome 2 with classifications, gene activity
    GO molecular function bindings, phenotype evidence, and diagnostic IHC
  details: '- Added `classifications` section with Harrison''s chapters (`ONCOLOGY_HEMATOLOGY`, `GENETICS_ENVIRONMENT_DISEASE`)
    and ICD-O morphology (`Embryonal Neoplasm`).

    - Grounded `SMARCA4`-bearing pathophysiology nodes (`Germline SMARCA4 Loss-of-Function`, `Somatic
    Inactivation of the Second SMARCA4 Allele`, and `Loss of BAF Complex ATPase Activity`) with GO molecular
    functions (`GO:0140658` ATP-dependent chromatin remodeler activity, `GO:0003682` chromatin binding
    with `DECREASED` modifier), cellular component (`GO:0016514` SWI/SNF complex), biological processes
    (`GO:0006338` chromatin remodeling, `GO:0006325` chromatin organization), anatomical locations (`UBERON:0000955`
    brain, `UBERON:0002113` kidney, `UBERON:0000992` ovary), and downstream links to phenotypes.

    - Added literature evidence and `diagnostic: true` flags to `Atypical Teratoid Rhabdoid Tumor` and
    `Rhabdoid Tumor of the Kidney` from PMID:29215836, PMID:21566516, and PMID:20137775.

    - Updated `SMARCA4` `variant_origin` to `GERMLINE_AND_SOMATIC` to reflect the two-hit mechanism.

    - Added `Tumor SMARCA4 (BRG1) immunohistochemistry` (`NCIT:C23020` Immunohistochemistry Staining Method)
    backed by PMID:24658002 and PMID:21566516.

    '

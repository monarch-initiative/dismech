  summary: 'Correct the record: cite the three RTPS2 nodes an earlier commit wrongly
    claimed were cited'
  details: |
    The commit message on 8bfafa5b4 stated that all four previously uncited RTPS2 pathophysiology nodes had been given evidence. That was false. Three of the four string replacements in the editing script silently failed to match, because earlier commits had inserted reference_title lines and conforms_to keys that changed the anchor text, and the claim was written into the commit message and a PR comment without verifying the result. The ai4c-reviewer caught it during re-review and was correct. Only Failure of Enhancer-Mediated Differentiation had actually gained evidence. Loss of BAF Complex ATPase Activity, which carries the assembled-but-catalytically-dead contrast the PR foregrounds as the reason for curating RTPS1 and RTPS2 together, had no evidence key at all, as did Rhabdoid Tumorigenesis and Ovarian Small Cell Carcinoma Hypercalcemic Type Development. All three are now cited. The ATPase node takes two items from PMID:24853101: the subunit composition sentence naming SMARCA4 as one of the two mutually exclusive ATPase subunits, which is the structural basis for treating its loss as a catalytic defect, and the sentence describing SMARCB1 as dispensable for complex formation but required for targeting, which is the lesion the node is contrasted against. A separate failed replacement was also found and fixed in the same pass: the SCCOHT node description still asserted that hypercalcaemia typically accompanies presentation, an uncited frequency-like claim the earlier commit was supposed to have removed. Rewritten to state the association without a frequency and to say plainly that none is asserted. Verification method changed as a result: node evidence coverage is now confirmed by parsing the YAML and printing per-node evidence counts rather than by trusting that a string replacement applied. Validated with just validate, 20 of 20 snippets verified, plus check-duplicate-keys, check-entity-refs, check-folded-hyphens, and a scripted audit confirming every reference_title matches its cache.

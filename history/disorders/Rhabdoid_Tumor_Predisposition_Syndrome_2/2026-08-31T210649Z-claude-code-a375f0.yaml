  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 10287. Two findings were genuine claim-evidence defects rather than gaps. First, the RTPS1 Failure of Enhancer-Mediated Differentiation node cited a generic relevance sentence that supported nothing about enhancers, differentiation or PRC2; replaced with the EZH2 and H3K27-trimethylation sentence from the same cached file, which supports the claim directly. Second, the RTPS1 description said SMARCB1 loss destabilises the residual BAF complex, which my own research report contradicts: the complex still assembles without SMARCB1, and what is destabilised is its chromatin occupancy and targeting to promoters and typical enhancers. Wording corrected and cited, and the sharper claim makes rhabdoid tumorigenesis an epigenetic mislocalisation defect rather than a loss of remodelling capacity. RTPS2 had four pathophysiology nodes with no evidence, including the assembled-but-catalytically-dead contrast that the PR foregrounds as the key distinction from RTPS1; all four now cited. Two unsupported RTPS2 claims were removed rather than papered over: the assertion that hypercalcaemia accompanies the majority of SCCOHT presentations, and the inheritance claim that unaffected transmitting carriers are described more often than in RTPS1. Neither was supported by the cached sources, so both were rewritten to state the association without a frequency and to say explicitly that no penetrance figure is asserted. Added conforms_to links from four nodes in each entry to germline_two_hit_tumor_predisposition, which maps almost node for node. Validated end to end with just validate and check-entity-refs on both files; all snippets verify.

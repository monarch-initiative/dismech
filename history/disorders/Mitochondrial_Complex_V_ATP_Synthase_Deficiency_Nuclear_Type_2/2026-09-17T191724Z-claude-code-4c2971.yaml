  details: |
    Addressed ai4c-reviewer finding 3 (TMEM70 under-consumed its correct falcon artifact). Added: the constitutive Tmem70-/- mouse knockout (PMID:28173120, Hum Mol Genet 2016) as an animal_models entry with RECAPITULATES links to the deficiency node (isolated ~80% assembled complex V loss) and to a new 'Stalled F1 Intermediate Accumulation' pathophysiology node (marked free-F1 accumulation), both MODEL_ORGANISM-graded; the free-F1 node distinguishes MC5DN2 from the ATPAF2 sibling MC5DN1 where F1 cannot form. Added an allelic-spectrum evidence item and notes sentence (at least 14 additional TMEM70 mutations, PMID:26550569), and three phenotypes: Dysmorphic Features (HP:0001999), Left Ventricular Noncompaction (HP:0030682), Pulmonary Arterial Hypertension (HP:0002092). NOTE: the reviewer's PMID for the mouse KO (27604308) was wrong (a gene-panel methods paper); the correct paper is PMID:28173120, found via PubMed. The reviewer named the PH phenotype 'persistent pulmonary hypertension' but HP:0002092 and the cited source both say 'pulmonary arterial hypertension' (distinct from PPHN), so it is curated under the correct term. Validated: pre-edit hook, count-verified-snippets, offline gates, validate-disorders.

  summary: 'Genetics pass: wire 5 missing JBTS genes into the pathograph'
  details: |
    Genetics pass under the genetics-gap campaign (issue #12200, epic #12189). Researched the Joubert gene set from primary literature before opening the issue's MONDO reconciliation checklist, then reconciled.

    Five genes MONDO records for declared subtypes of this entry had no gene descriptor here: TMEM216 (JBTS2), TMEM138 (JBTS16), TMEM231 (JBTS20), FAM149B1 (JBTS36) and NPHP1 (Joubert syndrome with renal defect). NPHP1 was already named in a has_subtypes description, in three copies of one evidence snippet, and in a dataset record's description and reference title, but carried no gene binding, so it reached neither the pathograph nor any gene-level export. All five now have `genetic:` records with `subtype` foreign keys to the existing has_subtypes rows, HGNC CURIEs read from a lookup at the time of writing, and exact-quote evidence.

    Each gene is also wired into the pathophysiology node it acts at rather than listed at the root: TMEM216 and TMEM138 on "Ciliary gene mutations disrupt primary cilium assembly" (both are required for ciliogenesis and mark linked vesicle pools at the ciliary base), TMEM231 on "Ciliary transition zone gating defect", FAM149B1 on "Impaired intraciliary transport" (IFT machinery strands at the ciliary tip when it is lost), NPHP1 on "Renal tubular ciliary dysfunction". Gene-to-mechanism wiring went from 35/35 to 40/40; phenotype inlink was already 43/43 and is unchanged.

    Also added: a carrier-frequency prevalence record for the recurrent TMEM216 founder allele in the Ashkenazi Jewish population (1:92, normalized to 1087 per 100,000), a case-fractions record on NPHP1 from the 28-family nephronophthisis-plus-neurological-sign cohort with a note that its ascertainment is not the NPHP1 share of Joubert syndrome overall, and a top-level `references:` block tagging the GeneReviews Joubert Syndrome chapter, which `just check-genereviews` reported as an EXACT untagged chapter.

    Validation: just validate, validate-terms, count-verified-snippets (199/199), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-genereviews, list-gene-term-mismatches, validate-disorders.

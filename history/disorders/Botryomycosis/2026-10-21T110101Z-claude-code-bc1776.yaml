  summary: 'Address review on #14891'
  details: |
    PR Shepherd pass on the 2026-10-19 review. (1) Rewrote entry notes to keep only the curator caveat that three historical case reports (PMID:11001122, 13845294, 5235476) have no quotable text; the deep-research term-validation narrative moved here: the OpenScientist report's HP:0031804, HP:0100829, HP:0030757, NCIT:C1055 and NCIT:C51696 suggestions were mislabelled and were not used. (2) Added Draining Sinus Tracts and Fistulae (HP:6000095, subtype Cutaneous) and Pulmonary Mass (HP:0033821, subtype Visceral, PMID:23743320) phenotypes with causal edges from Chronic Pyogranulomatous Inflammation; tagged the existing skin rows subtype Cutaneous. Bone invasion was not added: PMID:30429406 is not cached and the cached sources state bone extension only as a general possibility. (3) Modelled host predisposition as environmental entries: HIV infection (ECTO:3000289, PREDISPOSES, PMID:28562771) and prolonged steroid use (ECTO:0002002, PREDISPOSES, PMID:42220824) on Impaired Host Bacterial Clearance, plus cutaneous trauma or surgery (unbound, TRIGGERS) on Common Bacterial Persistence in Tissue. Diabetes and cystic fibrosis were not modelled as exposures. (4) Added co-trimoxazole (CHEBI:3770) and dicloxacillin (CHEBI:4511) as therapeutic agents with the PMID:42220824 case-series quote, and an Antiretroviral Therapy treatment (NCIT:C94631; darunavir CHEBI:367163, raltegravir CHEBI:82960) restoring Impaired Host Bacterial Clearance, citing PMID:28562771. (5) Removed the phagocytosis GO and neutrophil/macrophage CL bindings from Impaired Host Bacterial Clearance, since the sources say only host immune status and defects of cellular immunity, and set its downstream edge to INDIRECT_UNKNOWN_INTERMEDIATES. Corrected the 2026-09-29 record's actor name to codex to match its agent_tool. All CURIEs were looked up in OLS. Validated with just validate (33/33 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-environmental-evidence.

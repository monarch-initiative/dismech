  summary: 'Create: CACNA2D4-related_Retinopathy'
  details: |
    New entry for CACNA2D4-related retinopathy (MONDO:0700244), the ClinGen
    spectrum term, with retinal cone dystrophy 4 (MONDO:0012507) as its one
    subtype. Curated from a claude_code deep-research report
    (research/CACNA2D4-related_Retinopathy-deep-research-claude_code.md) plus
    the primary papers it cites and a PubMed search for CACNA2D4.

    Report validation: 26/26 references resolved, 22/22 quotes matched, no
    off-topic references. Term validation flagged needs_review only because a
    report sentence was parsed as the MONDO label; the identifiers resolve.
    just preflight-dr returned WARN: "ERG" (electroretinogram) was counted as
    a gene, and two HGNC identifiers sit beside the wrong symbol (hgnc:1393 is
    CACNA1F, hgnc:4598 is GRM6). No gene identifier was taken from the report;
    CACNA2D4 = hgnc:20202 was checked against the HGNC REST API.

    No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER,
    synonyms included). The ClinGen Definitive AR assertion is cited from the
    cached CGGV record and recorded in gene_disease_validity.

    References not used: Ba-Abbad 2016 (PMID:26560832) has no PubMed abstract
    and no cached full text, so its two patients (p.Arg628* and a multi-exon
    deletion) are mentioned only in genetic notes; the UK WGS paper
    PMID:28041643 is cited for its CACNA2D4 sentence instead. Huang 2015
    (PMID:25356976) does not mention CACNA2D4 in its abstract. Gustafson 2017
    (PMID:28837078) reports only a heterozygous CACNA2D4 deletion with another
    candidate gene and is recorded in notes, not as causal. The beagle CSNB
    paper (PMID:26368928) excluded CACNA2D4 and was not used. The TMEM16A
    co-localization study (PMID:26557056) was read but not modelled.

    Pathograph: loss of alpha2delta-4 (molecular) leads to reduced Cav1.4
    abundance and current (molecular) and, independently, to failed rod
    ribbon synapse assembly (cellular); both converge on reduced
    photoreceptor-to-bipolar transmission (cellular), which leads to reduced
    acuity, photophobia, dyschromatopsia and cone dystrophy. The ERG findings
    are recorded as READOUT_OF that transmission node rather than as caused
    phenotypes. Model-only branches cover bipolar/horizontal neurite sprouting,
    rod calcium store depletion and photoreceptor loss; the latter carries a
    REFUTE item from the 17-year human follow-up and a HUMAN_MODEL_MISMATCH
    discussion. 5 of 8 phenotypes are causally connected (the two ERG readouts
    and the single foveal hypoplasia observation are not).

    Conformance: the transmission node conforms to
    synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic
    Transmission Deficit, following the TSPOAP1 (Dystonia 22) precedent of
    conforming a calcium-channel-coupling lesion at the endpoint only. Not
    conformed: the synaptic_vesicle_cycle trigger and fusion nodes
    (alpha2delta-4 is a channel subunit, not a vesicle-cycle protein);
    phototransduction_cascade_dysfunction (its scope note excludes
    photoreceptor-to-bipolar transmission defects such as CACNA1F);
    retinoid_visual_cycle_disruption (no retinoid lesion);
    photoreceptor_degeneration (rod-first retinitis pigmentosa chain; human
    CACNA2D4 disease is cone-dominant and mostly non-degenerative, and the
    mouse rod loss is not shown to be apoptotic).

    Validation: just validate passed; count-verified-snippets 66/66;
    check-entity-refs, check-causal-targets, check-logical-rules,
    check-coarse-phenotypes, check-enum-values, check-duplicate-keys,
    check-block-scalar-comments and the whole-tree snippet/title/grading/
    retired-prose gates passed; just validate-disorders passed (66 snippets,
    0 issues).

    Review response (PR 15781): added a diagnosis section with full-field
    electroretinography (NCIT:C101217 Retinal Examination, as in the sibling
    CACNA1F-Related_Retinopathy entry, because NCIT has no electroretinography
    term) and molecular genetic testing (NCIT:C19770), each with a verified
    snippet. The three symptom edges from the cone transmission node that
    carry no evidence now say in their description that they are inferred.
    CABP4 and KCNV2 differentials and supportive-care or counseling
    treatments were not added, because no cached reference contains a
    quotable sentence for them in this disease.

    Second review round: the ERG diagnosis description no longer calls the
    b-wave electronegative without qualification, because PMID:40883544
    reports the electronegative dark-adapted response in only one of its two
    patients. Added a note on the ERG row recording the NCIT searches for an
    electroretinography term, which returned nothing.

  summary: 'Create: Winchester_Syndrome'
  details: |
    Created the MMP14-related Winchester syndrome entry (MONDO:0010201) from the curation stub, which is removed in the same change.

    Scope: restricted to the MMP14 disease. Families with biallelic MMP2 variants that were reported as Winchester syndrome before 2012 belong to MMP2-related MONA (MONDO:0009809, a separate stub) and were not used as evidence. Molecularly confirmed MMP14 evidence comes from Evans 2012 (PMID:22922033, original sisters, p.Thr17Arg) and de Vos 2018 (PMID:29741626, Dutch brothers, hypomorphic p.Arg111His). Cutaneous features and some clinical features are cited from reports of clinically diagnosed, ungenotyped patients (PMID:14726867, 11794271, 38291559, 33776097), and each such item says so.

    Mechanism chain: MMP14 loss of function, impaired pro-MMP2 activation, defective pericellular collagen remodelling, then branches to persistent cartilage anlagen, carpal-tarsal subarticular ossification defect (hypothesis from PMID:28675805), skeletal stem cell osteogenic commitment (PMID:23685250), growth plate dysfunction (PMID:10737763), joint destruction, soft-tissue fibrosis and craniofacial skeletal development. 12 of 19 phenotypes are causally connected; corneal opacity, gingival overgrowth, ECG abnormality, mitral valve prolapse, hyperpigmentation, hypertrichosis and acne have no sourced mechanism and are left unconnected.

    Deep research: the OpenScientist report (research/Winchester_Syndrome-deep-research-openscientist.md) resolved 20/20 references with no unresolved terms, but just preflight-dr returned WARN (MMP2 mentioned 45 times against 27 for MMP14). On reading, the report conflates MMP2-related MONA with Winchester syndrome: most of its citations (for example PMID:34466312, 37842447, 26601801, 37025869, 33101055, 37710205, 39502084) describe MMP2 patients. Its corneal-imaging source PMID:39502084 is an MMP2 patient. Its treatment table NCIT codes were mislabelled (C15682, C15329, C15300) and were not used. Only report leads that were independently confirmed as MMP14 or Mmp14-model sources were used.

    GeneReviews: just check-genereviews --online reports NO_CHAPTER. The MONA chapter is defined by MMP2 and is noted, not tagged, as it is not this disease's baseline.

    Validation: just validate, validate-terms, count-verified-snippets (90/90), check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading all pass.

  summary: 'Review round 1: reference titles, IgG3 regrade, diagnosis section'
  details: |
    Addresses the first review round on PR #14268. Added reference_title to all 67 evidence items, copied by script from the title: frontmatter of each references_cache file (none hand-written); check-reference-titles reports no new low-similarity titles. Regraded the PMID:25446578 IgG3 subclass item on the adaptive-priming node from SUPPORT to REFUTE, because the increased Th1-related IgG3 response it reports points against the DECREASED modifier on GO:0042088, and recorded in the node description that the in vitro Th1 induction defect (PMID:24321396) and the in vivo subclass skew disagree. Cited the Moroccan founder allele and replaced the previously uncited carrier-penetrance sentence with the one the source supports, both from PMID:42445183. Added a diagnosis section with two rows: complement screening (C3, C4, CH50, AP50, NCIT:C25294) and C3 gene sequencing (NCIT:C15709), reusing already-cached quotes. Added Sepsis (HP:0100806) as a phenotype with a causal edge from Impaired C3b Opsonophagocytosis, using the existing background snippet. Renamed the first pathophysiology node to C3 Biallelic Loss of Function so it carries only the genetic lesion, with the serum consequence left to its edge to the Decreased circulating complement C3 phenotype. Bound GO:0048018 receptor ligand activity (DECREASED) on that node, which is a GO molecular function annotation of human C3 read from QuickGO, so the check-gene-activity-grounding CI gate passes without a baseline exemption. Fixed the creation history record's links and its reference count (15, not 21), and removed the dated session narration from the grouping notes. Validated with validate, count-verified-snippets (67/67), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-reference-titles, check-retired-support-prose, check-snippet-grading, check-coarse-phenotypes, check-gene-activity-grounding --against-ref origin/main, normalize-cache, validate-disorders, validate-grouping and check-groupings.

  summary: 'Create: Complement_Component_3_Deficiency'
  details: |
    New entry for complete complement C3 deficiency (MONDO:0013417, C3 hgnc:1318), modelled on Complement_Component_2_Deficiency. Deep research was not available in this session (no provider credentials), so literature was gathered directly from PubMed searches; 15 references were fetched with just fetch-reference and every snippet is an exact substring of the cached text (59/59 verified). Key sources: Ram 2010 review (PMID:20930072) for convergence-point role and infection risk; molecular case reports for null and secretion-defective alleles (PMIDs 2212005, 1350678, 12462331, 14639503, 15781264, 26847111); a 2026 case report (PMID:42445183) for the pooled ~26% SLE-like and ~26% MPGN figures and the <50 case count, marked quote_role BACKGROUND; adaptive-immunity studies (PMIDs 18802120, 24321396, 25446578). PMID:25446578 is curated as REFUTE on a uniform antibody defect (normal toxoid responses in eight patients) and PMID:42445183 as REFUTE on hypogammaglobulinemia being constant; PMID:39114852 as REFUTE on antibiotic prophylaxis always preventing infection. Hemolytic-uremic syndrome (one patient, PMID:39114852) is left without a causal edge because no mechanism links absent C3 to HUS. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). ClinGen classifies C3 only for aHUS (MONDO:0013043), so no gene_disease_validity is recorded. Added as a member of kb/groupings/Complement_Deficiency_IEIs.yaml (criterion SATISFIED). Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, validate-disorders, validate-grouping and check-groupings.

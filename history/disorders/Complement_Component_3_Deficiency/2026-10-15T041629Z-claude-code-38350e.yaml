  summary: Reconcile with OpenScientist deep research
  details: |
    Committed an OpenScientist deep-research report (research/Complement_Component_3_Deficiency-deep-research-openscientist.md, with its citations sidecar and artifacts) and cross-checked it against the entry. An earlier OpenScientist run timed out at the provider's 1-hour limit and produced no report; an Asta run returned off-topic material and was not committed. The report's 18 references all resolved and its claims largely restate what the entry already carried. Added: (1) PMID:33563058, a Saudi series of 39 children with lupus manifestations and a primary immunodeficiency, three of them C3-deficient, as further evidence on the SLE-like disease phenotype. (2) A correction to the diagnosis and biochemical text: the entry said a normal C4 separates primary C3 deficiency from secondary C3 consumption, which holds for classical-pathway consumption only. Factor H or factor I deficiency and C3 nephritic factor lower C3 and factor B with a normal C4, usually leaving C3 low rather than undetectable; cited PMID:6545495 (review caveat, REVIEW_SYNTHESIS) and PMID:16138437 (factor I-deficient child with the same clinical picture and moderately low C3). (3) An animal_models record for the C3 knockout mouse linked to Impaired Complement-Dependent Adaptive Immune Priming as PARTIALLY_RECAPITULATES, with readouts from PMID:12496386 (low IgM, no class switch to a capsular polysaccharide) and PMID:28710441 (failed immune-complex deposition on follicular dendritic cells), and limitations noting that patient antibody defects are variable. No new phenotype was added, so no pathograph wiring changed. Left out: generic complement biology (C3 crystal structure PMID:16177781, CRIg PMID:38032267, complement-inhibitor infection risk PMID:42175904); complement-deficiency epidemiology and management not specific to C3 (PMID:25037634, 16836843, 37356020, 28078901, and the C2 deficiency follow-up PMID:32164349); anifrolumab in C1q-deficient lupus (PMID:42597478), which the report itself extends to C3 only by inference; a C3-knockout systemic sclerosis model (PMID:39737181), which concerns a different disease; and C3 nephritic factor biology (PMID:19640589), which belongs to C3 glomerulopathy and whose quoted passage the report's validator could not match in full. Validated with just validate, count-verified-snippets (73/73), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-retired-support-prose, validate-disorders, check-gene-activity-grounding and check-groupings.

  details: |
    New entry for epsilon-trimethyllysine hydroxylase deficiency (MONDO:0010469, OMIM:300872, TMLHE / hgnc:18308), the X-linked inborn error of the first step of carnitine biosynthesis. NEC preflight was run with OAK before any content was written: MONDO:0010469 carries OMIM:300872 and RO:0004003 HGNC:18308 TMLHE, subsets predisposition and omim_susceptibility, parent MONDO:0020836. Scoping decision: the carnitine-biosynthesis biochemistry is curated as the established mechanism, while the autism association carried by the MONDO synonym 'autism, susceptibility to, X-linked 6' is curated as a disputed low-penetrance susceptibility behind an EMERGING mechanistic_hypotheses group, with its population-frequency and knockout-mouse counter-evidence attached, rather than as an established causal chain. Sixteen references were fetched and cached; 74 evidence snippets were verified verbatim by both just validate-references and scripts/check_snippets_verbatim.py. just validate, just validate-terms, check_folded_hyphens --check and pytest tests/test_data.py all pass (16782 passed, against a 16773 baseline with zero pre-existing failures).

  summary: Refine Hypogonadism phenotype to HP:0000044 (hypogonadotropic)
  details: |
    Surfaced by the advisory membership audit of the new kb/groupings/Congenital_and_Syndromic_Hypogonadotropic_Hypogonadism.yaml grouping, which reported this member NOT_SATISFIED against a HAS_PHENOTYPE HP:0000044 criterion.

    The entry annotated its cardinal phenotype with the parent term HP:0000135 (Hypogonadism) even though hypogonadotropic hypogonadism is the disease's defining feature and appears in its own name and disease_term (MONDO:0007844, hypogonadotropic hypogonadism 2 with or without anosmia).

    Changes (phenotypes, 'Hypogonadism' block only):
    - phenotype_term refined from HP:0000135 Hypogonadism to HP:0000044 Hypogonadotropic hypogonadism.
    - description restated to name the central/gonadotropin-deficient character explicitly.
    - Added an evidence item quoting the GeneReviews sentence that establishes the central character of the defect ('inappropriately low serum concentrations of the gonadotropins LH ... and FSH ... in the presence of low circulating concentrations of sex steroids', PMID:20301509). That snippet was already used elsewhere in this file for a downstream causal edge, so it was verified against the existing cache rather than newly fetched. The pre-existing adult-male-phenotype evidence item is retained.

    No other blocks touched. Validation: linkml-validate (Disease) clean; linkml-term-validator passed with the new HP:0000044 binding; reference snippet audit 62/62 verified; the grouping audit now reports SATISFIED for this member.

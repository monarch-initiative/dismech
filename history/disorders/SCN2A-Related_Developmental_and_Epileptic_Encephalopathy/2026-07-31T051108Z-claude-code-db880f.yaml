  details: |
    Weekly compliance pass. Backfilled reference_title on 6 existing evidence items with scripts/add_pmid_titles.py, and added the ClinicalTrials.gov trial title by hand. Added 43 new verified evidence items covering all 5 pathophysiology nodes and all 5 downstream causal edges, all 6 phenotypes, both mechanistic_hypotheses groups including a PARTIAL caveat that automated patch-clamp shows many SCN2A variants have mixed gain/loss features, inheritance with de novo dominance plus parental mosaicism and the ~1 percent sibling recurrence risk, both treatment target_mechanisms and the two previously unevidenced treatments, and the two discussions that lacked evidence. Replaced the unsourced and internally inconsistent prevalence record - rate 7.5 per 100000 tagged BAND_1_5_PER_10000, which is 10-99 per 100000 - with two sourced BIRTH_PREVALENCE records from PMID:37776663: Denmark about 1 in 78608 live births, 1.3 per 100000, and Brescia province Italy 11 in 232678 births, 4.7 per 100000, both BAND_1_9_PER_100000. New PMIDs cited: 29691040, 31904126, 28256214, 31230762, 35310859, 30813884, 37578743, 34850743, 31077350, 37776663, 34859793. Each was fetched with just fetch-reference and every snippet was copied as an exact substring of the cached abstract. No ontology terms were changed. Weighted compliance rose from 41.2 to 92.0 percent, and validate, validate-references and validate-terms all pass.

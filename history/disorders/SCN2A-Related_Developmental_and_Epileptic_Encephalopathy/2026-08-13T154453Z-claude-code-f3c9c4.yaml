  summary: Add channelopathy and Harrison's classifications plus phenotype evidence
  details: |
    Weekly compliance pass, classifications focus. This entry was the lowest-scoring disorder file in the knowledge base. Added a classifications block with channelopathy_category neurological channelopathy plus harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE. Unlike the polygenic idiopathic generalized epilepsies handled in sibling PRs this run, SCN2A-DEE is a genuine monogenic voltage-gated sodium channel (Nav1.2) disorder, so both the channelopathy and the genetic Part are substantive; a notes line records that contrast. All three assignments cite the Wolff et al. Brain 2017 cohort study (PMID:28379373), already cached. Added evidence to five of the six previously unevidenced phenotypes from the same cohort. Backfilled reference_title on all PMID-backed evidence items via scripts/add_pmid_titles.py. Validated with just validate and just validate-disorders (the CI sweep): snippets checked 15/15 verified. Weighted compliance 41.2 to 62.8 percent.

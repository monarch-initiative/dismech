  summary: 'Create: SCN2A-Related Developmental and Epileptic Encephalopathy'
  details: |
    De-novo curation of SCN2A-related DEE (DEE11, MONDO:0013388). Granular unbundled pathophysiology modeling the gain-vs-loss-of-function dichotomy via mechanistic_hypotheses (scn2a_gain_of_function_early_onset CANONICAL; scn2a_loss_of_function_later_onset CANONICAL): SCN2A variant -> increased Nav1.2 current (GOF arm) OR decreased Nav1.2 current (LOF arm), causal edges opted into respective hypothesis_groups -> neuronal hyperexcitability/network dysfunction (conforms module) -> seizures + developmental encephalopathy (conforms). Evidence entirely from Wolff 2017 (PMID:28379373): GOF->early onset (<3mo)->sodium-channel-blocker responsive; LOF/truncating->late onset (>=3mo)->blockers rarely effective and sometimes worsen. Treatments capture the precision caveat (Na-channel blockers help GOF, worsen LOF). Three KNOWLEDGE_GAP discussions: rapid functional variant classification for treatment, direction-specific precision therapy (ASO), and the LOF autism/ID mechanism. Prevalence ~5-8/100,000 (cohort/foundation estimate, notes-only). claude_code deep research NEC-clean (SCN2A/Nav1.2/DEE11); no SCN2A GeneReviews chapter indexed in PubMed. All snippets verified exact; schema + term validation pass.

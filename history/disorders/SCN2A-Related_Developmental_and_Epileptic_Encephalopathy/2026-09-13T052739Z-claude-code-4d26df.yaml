  summary: Merge main; resolve conflicts in favour of main's phenotype curation
  details: |
    PR Shepherd conflict-resolution session for PR #8424. While the PR sat open, main received an independent, more thorough phenotype-evidence curation of this entry (additional PMID:31904126, PMID:30813884, PMID:29691040 items; new Migrating Focal Seizures and Continuous Spike and Waves During Slow Sleep phenotypes). Merging main produced seven content conflicts, all inside phenotype evidence blocks. Every one was resolved in favour of main's version, because main's items are the newer and richer curation and the PR's items quoted the same PMID:28379373 abstract more narrowly. The reference_title backfill the PR performed is also already present on main, so it is now a no-op. What survives from the PR is its genuinely novel contribution: the classifications block (channelopathy_category neurological channelopathy; harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE, with the notes line contrasting SCN2A-DEE with the polygenic IGEs), which main still lacks, plus the Focal Seizures description rewrite that answered the reviewer's blocking finding. That finding is addressed: the description no longer scopes focal seizures to the early-onset group, and main's two evidence items cover the early-onset EIMFS and late-onset ESES presentations respectively. Validated with just validate: schema, terms, and references all pass, 57/57 snippets verified against the cache.

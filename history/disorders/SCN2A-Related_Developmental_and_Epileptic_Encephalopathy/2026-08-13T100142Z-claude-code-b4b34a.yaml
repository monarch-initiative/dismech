  details: |
    Follow-up to the ai4c-reviewer CHANGES_REQUESTED review on PR #7307.

    IMPORTANT 1 - replaced all three citations of PMID:35310859 with the primary study it reports on. PMID:35310859 is a five-page commentary in Int J Physiol Pathophysiol Pharmacol whose abstract describes another group's work - "A recent study from Dr. Yang's laboratory revealed..." - so it was not a valid MODEL_ORGANISM source. Located the primary study via PubMed esearch and fetched it with just fetch-reference: PMID:34348148, Zhang et al., Cell Rep 2021, "Severe deficiency of the voltage-gated sodium channel Na(V)1.2 elevates neuronal excitability in adult mice". Its last author is Yang Y, confirming it is the Yang-lab study the commentary describes. Each of the three evidence items now quotes a distinct sentence from that primary abstract: the mouse-model result on the loss-of-function downstream edge, and the counterintuitive-finding and cellular-basis sentences on the Neuronal Hyperexcitability and Network Dysfunction convergence node. This also removes the generic textbook opening sentence "Epileptic individuals are faced with seizures..." that carried no SCN2A or model-organism content while tagged MODEL_ORGANISM.

    IMPORTANT 2 - retagged PMID:29691040 "Functional assays demonstrate strong correlation between genotype and phenotype." on the SCN2A Variant / Nav1.2 Dysfunction node from HUMAN_CLINICAL to IN_VITRO, and extended the explanation to record that the correlation rests on in vitro electrophysiological characterization.

    IMPORTANT 3 - added the four phenotypes the reviewer identified as unmodeled, all with HPO labels verified against sqlite:obo:hp and all citing already-cached references: Migrating Focal Seizures HP:0032786 from PMID:28379373; Continuous Spike and Waves During Slow Sleep HP:0031491 from PMID:28379373; Generalized Myoclonic-Atonic Seizures HP:0011170 from PMID:28379373; Neonatal Seizures HP:0032807 from PMID:31904126. No frequency qualifier was set on any of them, since none of the quoted snippets supports a frequency band.

    Not addressed, left for the curator: the blue-tier suggestions - Brescia prevalence supports PARTIAL, splitting the ketogenic diet out of the Pharmacotherapy treatment, biological_scale tags, and the GeneReviews tag. Those are content judgements beyond a mechanical review response.

    Validation: just validate passes; just validate-terms passes; scripts/check_snippets_verbatim.py reports 54/54 snippets verified verbatim against the local reference cache. The slow just validate-references was NOT run - the fast cache-bound verbatim check was used in its place.

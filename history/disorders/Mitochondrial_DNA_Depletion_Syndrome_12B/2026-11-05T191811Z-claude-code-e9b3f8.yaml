  summary: 'Create: Mitochondrial_DNA_Depletion_Syndrome_12B'
  details: |
    New entry for biallelic SLC25A4 (ANT1) disease, MONDO:0014175, curated from primary case reports (PMID:16155110, 22187496, 23401503, 25732997, 28823815, 29654543, 42589632, 42876936), the de novo dominant SLC25A4 paper (PMID:27693233) for contrast, and Ant1 knockout mouse studies. The OpenScientist report was used as a lead only; its three unsupported quotes were rechecked against the fetched abstracts and the cited text was quoted exactly from the abstracts. MTDPS12A and PEOA2 kept as related mappings and differentials, not subtypes. ClinGen Definitive (CGGCIEX:assertion_10062) recorded in genetic notes only because CGGCIEX records cannot be cited. 88/88 snippets verified against references_cache; validate, validate-terms and the offline gates were run.

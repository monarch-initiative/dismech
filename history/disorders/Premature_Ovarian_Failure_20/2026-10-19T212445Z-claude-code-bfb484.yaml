  summary: 'Review round 1: Premature Ovarian Failure 20'
  details: |
    Addressed the first automated review of PR 14946. Added reference_title to every evidence item from the references_cache title frontmatter. Added an elevated FSH phenotype supported by a biallelic MSH4 patient's FSH of 29.86 mIU/mL against the paper's 3-12 normal range (PMID:37620942) and the POI definition in PMID:28541421, wired from Ovarian Follicle Depletion. Added a young adult onset descriptor to POI. Used the female Msh4 knockout data in PMID:10809667: oocyte apoptosis on the germ cell loss node, an evidenced edge to follicle depletion, follicle depletion node evidence, and two new modeled_mechanisms links with a SPECIES_MISMATCH divergence for the perinatal loss of the whole ovary in mice. Added the POI-63 compound heterozygote from PMID:36793102 as a variant with evidence, and rewrote the genetic notes so the frameshift is named as each source names it (p.M740fs in PMID:36793102, p.Lys741Argfs*2 in PMID:37620942). Changed the first node's PMID:28541421 item to quote the exon-trapping sentence, since the Walker B sentence is a prediction. Added progesterone (CHEBI:17026) as a second therapeutic agent; CHEBI:50745 progestogen is a role term the ChemicalEntityTerm enum rejects. Added a diagnosis entry for whole exome sequencing (NCIT:C101295). Oocyte donation was not added as a treatment because no NCIT clinical-action term for it was found in OLS. creation_date corrected from a placeholder.

  summary: 'Create: Premature Ovarian Failure 20 (MSH4)'
  details: |
    New entry for premature ovarian failure 20 (MONDO:0030975; OMIM 619938; MSH4). Entry type DISEASE. Scoped to the 46,XX ovarian phenotype; the male phenotype of the same genotype is spermatogenic failure 2 (MONDO:0007161), a separate stub. Pathophysiology conforms to three nodes of the meiotic_prophase_failure module. Deep research: one openscientist report. The run exited 3 on a read timeout resolving MedGen:1808256 and the report landed with no validation record (issue #11896). Reference validation was restored with just validate-research-reference (18/18 resolved); validate-research-terms failed again on the same CURIE, so term validation was run with --skip-prefix MedGen added, as documented in #11896. Term validation flagged three mislabelled NCIT treatment codes in the report (NCIT:C62002 is Amiodarone, NCIT:C713 is Oligonucleotide, NCIT:C92755 is Chorionic Villus Sampling); none was used, and HRT is bound to NCIT:C15599 from the term cache. just preflight-dr WARN: MSH5 is mentioned at 25% of MSH4; those sections describe the MutS-gamma partner and digenic MSH4+MSH5 cases, not a different disease. The report's statement that the index family was consanguineous is not in the cited abstract and was not used. An OMIM number written from memory in the first draft (618315) was corrected to 619938, the xref MONDO records. Not used: generic POI epidemiology and HRT outcome papers (PMID:39448037, PMID:20938225, PMID:40377060, PMID:40620015, PMID:40936058), MutL-gamma biochemistry (PMID:40319035, PMID:32814904), and MCM8 papers (PMID:25873734, PMID:32048466). Validation: just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs pass.

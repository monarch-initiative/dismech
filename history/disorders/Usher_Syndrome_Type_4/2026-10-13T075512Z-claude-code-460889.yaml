  summary: 'LOINC tranche G: audiometry measurement and WHO 1991 hearing band'
  details: |
    Added a new Pure-Tone Audiometry diagnosis row: the pure-tone threshold audiometry panel (LOINC:89015-2) plus the eight per-ear frequency codes as measurements, and the earlier WHO (1991) better-ear-average hearing-loss grade band (PMID:31656340), the one scheme the entry's own ARSG cohort source (PMID:35226187) actually invokes -- that paper uses the WHO 1991 abnormal-hearing threshold of 25 dB HL, which sits at this scheme's Grade 0/Grade 1 boundary, to explain why self-reported symptom onset in USH4 lags the calculated audiometric onset. No single USH4-owned severity cut-off is bound, since the cohort reports individual PTAs from 46 to 90 dB HL. Part of LOINC tranche G batch 9 (projects/LOINC_DIAGNOSTICS.md).

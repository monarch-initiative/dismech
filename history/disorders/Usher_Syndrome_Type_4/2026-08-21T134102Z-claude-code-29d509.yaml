  details: |
    Addressed all four IMPORTANT findings and all three suggestions from the ai4c-reviewer review of PR 9161. Finding 1 (RPE missing from the pathograph): verified the reviewer's claim by reading references_cache/PMID_41295716.md, which does state that RPE storage may alter RPE-photoreceptor interactions - an earlier grep missed it because the paper uses an en-dash. Added an RPE-Restricted ARSG Loss node between the catabolic block and photoreceptor degeneration, but curated it for what the primary source actually establishes rather than for the storage-driven account the review implied: Kruszewski 2016 shows ARSG protein is detectable only in the RPE while the RPE itself is morphologically normal and no storage vacuoles are present anywhere in the mouse retina, so the node records an RPE-restricted site of action with a cell-non-autonomous, still-unexplained route to photoreceptor death, and the outgoing edge stays INDIRECT_UNKNOWN_INTERMEDIATES. The canine RPE storage finding is curated at PARTIAL because the same paragraph says the mechanism remains to be elucidated and because canine RPE storage is not seen in the mouse. Finding 2: fetched and cited PMID:26975023, retargeted the mouse animal_model entry from the 2024 nosology review to this primary study, and added a RECAPITULATES link on photoreceptor degeneration with a quantified photoreceptor-count readout. Finding 3: evidence_source on the human-patient observation corrected from MODEL_ORGANISM to HUMAN_CLINICAL. Finding 4: added three diagnosis entries - vestibular function testing, arylsulfatase G enzyme activity assay, and retinal imaging/electrophysiology; the first two omit term: because no suitable NCIT clinical-action term could be verified, rather than binding an approximate one. Finding 5: added the Portuguese founder allele p.(Arg384Trp) to the genetic association with its own evidence item, but deliberately did not add case_fractions, since the source describes shared descent narratively rather than as a denominator-bearing cohort statistic. Finding 6: supportive management rebound from NCIT:C15747 to NCIT:C15315 Rehabilitation. Finding 7: added intraretinal bone spicule pigmentation; cystoid macular edema was NOT added because no cached reference contains a quotable statement of it. Note the reviewer's suggested label for HP:0007737 was 'Bone spicule pigmentation of the retina'; the canonical label is 'Spicular pigmentation of the retina' and validate-terms rejected the former, so the ontology label is used with the clinical wording kept in preferred_term. One snippet initially transcribed as a truncated fragment ('loss of the ou') was repaired to the full sentence before commit. Validated: just validate passed; just validate-terms passed; count-verified-snippets 42/42 (was 32/32); check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

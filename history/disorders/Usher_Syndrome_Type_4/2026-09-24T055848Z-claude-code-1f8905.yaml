  details: |
    Updated as part of splitting kb/disorders/Usher_Syndrome.yaml into four
    mechanism entities plus kb/groupings/Usher_Syndrome.yaml, per the decision
    recorded on issue #10822.

    Two changes only, and no curated content was altered. The entry now declares
    conforms_to against the two modules its existing nodes already match
    (lysosomal_substrate_accumulation at the substrate-accumulation node,
    photoreceptor_degeneration at the rod-apoptosis node), and it is now a member
    of the Usher grouping rather than an anomaly hanging off a lumped parent.

    It deliberately does not conform to sensorineural_hair_cell_loss, unlike the
    other three members: its cochlear node describes sensory dysfunction reached
    by a lysosomal storage route rather than by the mechanotransduction failure
    that module's node names.


  summary: 'Create: Usher Syndrome Type 4 (ARSG)'
  details: |
    New entry for Usher syndrome type 4 (MONDO:0029141, OMIM 618144), autosomal recessive biallelic ARSG (hgnc:24102). Deep research: claude_code provider; report validated (11/11 references resolved, confabulation_rate 0.0, 10 of 11 weighed on topic, 0 off topic - the remainder undecided rather than flagged). Reference set assembled largely by direct PubMed search rather than from the report. GeneReviews baseline checked and found ABSENT: a PubMed search for ARSG in GeneReviews returns zero results, and the two existing Usher GeneReviews chapters (PMID:20301442, PMID:20301515) were fetched and read - they cover types I and II and contain no mention of ARSG, USH4 or type IV, so neither is cited. Eight pathophysiology nodes in a converging branch: biallelic ARSG loss splits into abolished sulfatase activity and failed lysosomal targeting with ER retention, which reconverge on impaired lysosomal degradation of 3-O-sulfated heparan sulfate, then diverge again to photoreceptor and cochlear arms. Two animal models curated with modeled_mechanisms: the Arsg-null mouse (PARTIALLY_RECAPITULATES, generalised storage not seen in humans) and the ARSG p.R99H American Staffordshire Terrier, which carries a FAILS_TO_RECAPITULATE link with limitations and evidence because the canine neurological disease has no human counterpart - variant-matched, since a human homozygous for the same p.R99H allele was neurologically normal at 74. Two discussions: HUMAN_MODEL_MISMATCH on the species divergence and CONTROVERSY on the MPS IIIE versus USH4 classification, each with proposed_experiments. No frequency bands assigned anywhere (roughly 31 reported cases, no cohort denominator). Absence of vestibular dysfunction recorded in descriptions and differentials but deliberately not curated as a phenotype. One differential snippet was re-sourced after the committed abstract-only cache for PMID:35226187 could not verify an introduction quote; the committed cache file was left untouched rather than overwritten. Validated: just validate passed; just validate-terms passed; count-verified-snippets 32/32; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK.

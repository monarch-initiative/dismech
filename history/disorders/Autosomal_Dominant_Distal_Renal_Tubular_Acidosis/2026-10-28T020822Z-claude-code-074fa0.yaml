  summary: 'Create: Autosomal_Dominant_Distal_Renal_Tubular_Acidosis'
  details: |
    New entry for the autosomal dominant, SLC4A1-caused form of distal (type 1)
    renal tubular acidosis (MONDO:0008368). Scoped to the dominant form; the
    recessive SLC4A1 disease with hemolytic anemia already has an entry
    (Renal_Tubular_Acidosis_Distal_4_with_Hemolytic_Anemia) and is listed here as a
    differential diagnosis.

    Deep research: claude_code provider
    (research/Autosomal_Dominant_Distal_Renal_Tubular_Acidosis-deep-research-claude_code.md).
    preflight-dr returned PASS (SLC4A1 mentioned 41 times; OMIM 179800 matches
    MONDO). Reference validation: 11/11 identifiers resolved; one quote attributed
    to PMID:9312167 was a paraphrase of the abstract, so the entry quotes the
    abstract verbatim instead. Term validation flagged CL:1001431, which the report
    called alpha-intercalated cells but CL labels kidney collecting duct principal
    cell, and two obsolete GO terms (GO:0015301, GO:0030433). None of those were
    bound; the entry uses CL:0005011 renal alpha-intercalated cell and GO:0140900
    chloride:bicarbonate antiporter activity, looked up in OLS.

    References not used: the report cited PMID:19423690 for kAE1 dominant-negative
    trafficking, but that PMID is a PTH/TRPV5 paper; and its web source list linked
    PMID:10926824 as an R589H kidney study, but that record is about Southeast Asian
    ovalocytosis in Malaysia and Papua New Guinea. Neither is cited. Several other
    fetched papers (cohort and review abstracts) were read but not needed and their
    cache files were not committed.

    Pathophysiology: 12 nodes. Chain from the heterozygous SLC4A1 variant through
    dominant-negative kAE1 mistrafficking, loss of basolateral anion exchange,
    impaired proton secretion and failed net acid excretion to systemic
    hyperchloremic acidosis, with potassium-wasting, hypercalciuria/hypocitraturia
    -> calcium phosphate supersaturation, and calciopenic mineralization branches.
    A second branch from the exchange loss runs through intracellular
    alkalinization and impaired autophagy to alpha-intercalated cell loss
    (PMID:41778592, PMID:27932475). 19 phenotypes, 15 (78.9%) causally connected;
    the other four are two readouts linked by reports_on (alkaline urine, positive
    urine anion gap) and two hypokalemia sequelae (muscle weakness, periodic
    hypokalemic paresis).

    Module conformance: the calcium phosphate supersaturation node conforms to
    nephrolithiasis_crystal_nucleation#Urinary Supersaturation (the module names
    alkaline urine with hypercalciuria as its calcium-phosphate route); the
    acidosis-driven mineralization node conforms to
    defective_skeletal_mineralization#Calciopenic Substrate Deficiency, matching the
    recessive SLC4A1 entry and CKD-MBD. The calcitriol evidence (PMID:16110243) is
    two adults with osteomalacia, noted on the node.

    Genetics: SLC4A1 (hgnc:11027), causative, dominant-negative; ClinGen Definitive
    gene-disease validity recorded from the cached CGGV assertion (Tubulopathy
    GCEP). Seven variants curated (R589H, R589C, S613F, G609R, R901X, M909T,
    R388C).

    GeneReviews: Hereditary Distal Renal Tubular Acidosis (PMID:31600044) tagged as
    the baseline; snippets cover clinical characteristics, diagnosis, management
    (including potassium-sparing-diuretic avoidance and ADV7103) and genetic
    counseling (50% transmission risk, prenatal/preimplantation testing). The
    chapter covers all hereditary dRTA genes; there is no AD-specific chapter.

    Models: Ae1 R607H knockin mouse (PMID:27932475, the R589H ortholog), AE1-null
    mouse (PMID:17409310, a recessive null rather than a dominant-negative model,
    noted as a limitation) and the polarized MDCK kAE1 cell system (PMID:16420521),
    each linked to mechanism nodes with fidelity and limitations.

    PMID:36776909 was re-fetched with --force to full_text_xml because several
    quoted sentences are in its body rather than its abstract; the upgraded cache
    file is committed with the entry.

    Validation: just validate passed; count-verified-snippets 82/82;
    validate-disorders passed; entity-refs, causal-targets, logical-rules,
    coarse-phenotypes, enum-values, duplicate-keys and block-scalar-comments clean;
    check-genereviews TAGGED; title-snippets, reference-titles, snippet-grading,
    retired-support-prose and snippet-length whole-tree gates OK.

    Review response (PR 15798): the Progressive Alpha-Intercalated Cell Loss
    node now quotes the PMID:27932475 sentence that reports the observed loss of
    type A intercalated cells; the earlier quote described reduced Ae1 per cell
    and preserved targeting, not cell loss. The same sentence was added to the
    edge from the autophagy node, and the PMID:41778592 explanation now says
    its sentence pools mouse and human data. The alpha-intercalated cell type
    was removed from Renal Potassium Wasting, because distal potassium loss is
    not attributed to that cell. GO:0007588 excretion and GO:0006816 calcium
    ion transport were removed from three organ-level nodes, which keep their
    descriptive preferred terms. A garbled sentence in the genetic features
    was reworded. Phenotype frequencies were not added: the cohorts giving
    them pool dominant and recessive SLC4A1 patients (PMID:36776909) or all
    primary dRTA (PMID:30773598), so a band would overstate what applies to
    the dominant form.

    CI fix. Two whole-repo gates failed on the entry: three hyphenated
    compounds in folded descriptions were split across lines
    (check-folded-hyphens), and the ClinGen validity evidence lacked a
    reference_title (check-reference-titles-present). The compounds were
    reflowed onto one line each and the title was filled from the cached
    ClinGen record with scripts/backfill_reference_titles.py.

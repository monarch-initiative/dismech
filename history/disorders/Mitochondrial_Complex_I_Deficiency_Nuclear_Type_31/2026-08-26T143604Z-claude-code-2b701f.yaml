  summary: 'Review response: Mitochondrial Complex I Deficiency Nuclear Type 31'
  details: |
    Response to the automated review on PR #9528. Added a Global Developmental Delay phenotype (HP:0001263), which the entry's prose named repeatedly without a phenotype record; rebound skeletal muscle cell from CL:0000187 to CL:0000188; split the peripheral sensory and motor neuron descriptor into CL:0000101 and CL:0000100; removed a sentence in the supportive-care treatment description that claimed no treatment term was bound while NCIT:C15747 was bound two lines below, and changed that block's therapeutic_modality from BEHAVIORAL to OTHER. Added the complementation-rescue evidence from PMID:28604674 to the assembly-failure node, and grounded that node's proteomics claim from PMID:35091571's clean PMC full text rather than the ligature-corrupted equivalent sentence in PMID:28604674. Removed the self-referential mondo_mappings entry. The first attempt at the treatment-description trim silently failed to apply and was caught by the re-review; it is fixed here. Confirmed by PubMed query that no GeneReviews chapter exists for TIMMDC1 - the reviewer could not run that check. Validated with just validate (43/43 snippets verified) plus check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length and check-title-snippets.

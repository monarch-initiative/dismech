  details: |
    De-novo curation of TIMMDC1-related nuclear complex I deficiency (MC1DN31). Deep research was run with the claude_code provider; the report is committed at research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_31-deep-research-claude_code.md and its reference-validation block reported 5 references checked, 4 resolved, 0 unresolved, 1 unverifiable. The report cited the gene-discovery paper as PMID:28607462, which is a different article entirely (a secreted-protein prediction method paper); the correct identifier PMID:28604674 was recovered from PubMed and is what the entry cites throughout. That correction is recorded in the entry notes. Evidence comes from three primary sources: PMID:28604674 (RNA-seq gene discovery), PMID:33278652 (deep intronic variant and diagnostic delay) and PMID:35091571 (splice-switching oligonucleotide correction, full text available). All 39 snippets verified against the reference cache by just validate. Ontology bindings were checked against OLS rather than taken from the report: three HPO terms the report suggested were wrong (HP:0011168, HP:0003688, HP:0007074) and were replaced with HP:0001250, HP:0011923 and HP:0007183. Validated with just validate (schema, terms, references all pass) plus the offline gates check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets and check-environmental-evidence.

  summary: 'Review round 2: corneal term rebound, facies curated after a false rationale,
    VP shunt added'
  details: |
    Addressed the round-2 review on PR #10415. All four round-1 findings were confirmed closed by the reviewer; three new findings were raised and all three were correct.

    Finding 1 (corneal term too specific). My error, and the description made it worse by asserting the wrong thing about the ontology: it called HP:0007957 Corneal opacity 'the general corneal-opacity term'. It is not general - HP:0000481 Abnormal cornea morphology is its parent. The source says 'corneal anomaly (2/4)' and nothing more, so the narrower term asserted an opacity nobody reported. Rebound to HP:0000481, phenotype renamed to Corneal anomaly, downstream edge target updated, description corrected. The identifier came from the deep-research report's phenotype table, whose own Term Validation section had flagged the label as inconsistent - a third provider identifier defect after the invented MONDO and HGNC IDs, and the quietest kind, since this one is a real term for a real concept that is merely narrower than the claim.

    Finding 2 (facies rationale factually wrong). The reviewer was right and this was the substantive finding. The notes block declined to curate the characteristic facies on the ground that 'the only source in this entry that describes the face is a single case report giving hypertelorism, exorbitism'. PMID:23599695 was already cached and already cited twice in this entry, and its full text carries a disease-level statement ('Facial abnormalities include flat nasal bridge, broad cheeks and malformed and unevenly set ears') plus two siblings examined individually, each with depressed nasal bridge and low-set ears. The survey behind the scoping decision had missed a source the entry was already using. Curated Depressed nasal bridge (HP:0005280), Low-set ears (HP:0000369) and Proptosis (HP:0000520), all wired into the pathograph; the note now records what the evidence actually is and that the earlier rationale was wrong.

    Finding 3 (generic cardiac surgery term). Rebound from NCIT:C15329 Surgical Procedure to NCIT:C157806 Cardiac Surgery, which is reachable from NCIT:C25218 and is what the rest of the KB uses. Also recorded in notes that the craniofacial surgery treatment keeps the generic term deliberately, since NCIT has no suture-release or fronto-orbital-advancement term and Craniotomy is a different operation.

    One correction to the review, made by reading the same source: the reviewer stated that VP shunt and orchidopexy are 'verified absent from all 21 cached refs' and that declining to curate them was correct. The VP shunt is not absent. PMID:23599695 says one of the two siblings 'had dilatation of the lateral ventricles which required a ventriculo-peritoneal shunt'. Added Ventriculoperitoneal shunt (NCIT:C168483) as a treatment targeting Hydrocephalus, and cited the same paper on the Hydrocephalus phenotype as a second independent family. The sibling pair is itself informative - same allele, one child shunted and one not - and is curated as such. Orchidopexy does remain unquotable in the cached set.

    Proptosis is the one craniofacial feature with a nameable intermediate (shallow orbits following altered calvarial growth), so it hangs off the osteogenic node with INDIRECT_KNOWN_INTERMEDIATES rather than off the pathway node with the rest of the facies.

    Validation: 133/133 snippets verified (up from 122), 17 phenotypes with 0 orphans (up from 14), 21 cited PMIDs, all offline gates clean.

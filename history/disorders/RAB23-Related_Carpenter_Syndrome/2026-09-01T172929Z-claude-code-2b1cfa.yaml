  summary: 'Create: RAB23-related Carpenter syndrome (CRPT1)'
  details: |
    New disease entry for RAB23-related Carpenter syndrome (CRPT1, MONDO:0008710), curated from the primary literature with one openscientist deep-research report used for leads.

    Mechanism as curated: biallelic RAB23 loss of function reaches the phenotype by two routes that the entry keeps separate - impaired ciliary protein trafficking, and elevated FGF10-FGFR1-ERK signalling in the cranial suture. Three distinct molecular routes to the loss of function are curated (nonsense-mediated decay of truncating transcripts; loss of the C-terminal prenylatable cysteine in a late frameshift; switch-II distortion in the Y79del in-frame allele), together with the absence of any reported genotype-phenotype correlation that licenses treating them as one functional lesion.

    Two findings are curated against the simple account. First, the ciliary defect is cell-type conditional: a conditional knockout mouse, patient-derived iPSCs and zebrafish morphants show cilia disturbed in chondrocytes, fibroblasts, neural progenitors and neocortical neurons but not in epithelial cells, cerebellar granule cells or hippocampal neurons, and within the same patients neurons lose cilia while fibroblasts merely have shorter ones. Second, the direction of the Hedgehog effect is not a single sign: RAB23 depletion lowers ciliary Smoothened and RAB23-null neural progenitors are desensitized to Hedgehog, both of which are reduced output rather than de-repression. The reconciliation curated here is the dual-function account, in which RAB23 both represses basal pathway activity and facilitates cilium-dependent activation by ligand - both measured in one cell population, so losing RAB23 raises the floor and lowers the ceiling. The pathway modifier is DYSREGULATED on that reading rather than as a hedge, the contrary results are curated as REFUTE items on the node, and an open-question discussion records what keeps it unsettled: the dual-function result is one study in cerebellar granule cells, a cell type a second study reports as having no ciliary abnormality, and no Hedgehog measurement of either kind exists in a Carpenter suture or limb bud.

    Sections: 6 pathophysiology nodes, 10 phenotypes (all reachable from the variant node), 6 variants, prevalence including the one-in-a-million birth estimate, one experimental model (patient iPSC neural lineage), four animal models, craniofacial surgical management with operative-planning hazards, clinical and prenatal diagnosis entries, and four discussions including a HUMAN_MODEL_MISMATCH for the mouse/human viability difference.

    Deliberately not curated: overgrowth with advanced bone age, epileptiform EEG, autistic features and chronic kidney disease, each proposed on a single case; held as an open knowledge gap instead.

    Provider defect found and corrected: the report carried MONDO:0008544 for this disease, which is tetramelic monodactyly. This is the third invented MONDO ID in three reports launched with an empty mondo_id variable (issue #9888); it is the most dangerous of the three because a limb-malformation term looks plausible beside a polysyndactyly syndrome. The report also gave HGNC:9776 for RAB23; the entry uses hgnc:14263.

    Validation: 109/109 snippets verified against cached references, schema and term validation pass, all offline gates clean, 21 cited PMIDs (of 22 cached; the one left unused is a Trypanosoma flagellar Rab23 paper), no orphan phenotypes.

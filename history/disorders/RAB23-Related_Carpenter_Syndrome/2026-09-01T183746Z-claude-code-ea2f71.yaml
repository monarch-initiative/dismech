  summary: 'Review round 1: module conformance, Hedgehog node rename, four phenotypes,
    two treatments'
  details: |
    Addressed the round-1 review on PR #10415. The reviewer could not submit a formal GitHub review (only the reviewer App can), so this was feedback with a request-changes recommendation; all four findings were verified against the repository before acting.

    Finding 1 (no module conformance). Verified and correct. Added three conforms_to declarations. The Hedgehog node conforms to ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction, which independently carries the same GO:0007224 binding with the same DYSREGULATED modifier - the module describes the lesion as perturbing GLI activator/repressor balance rather than as a one-way change, which is the same argument this entry reached from the primary literature. The limb node conforms to limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification, matching the sibling MEGF8-Related_Carpenter_Syndrome entry, which conforms its equivalent node to the same target. The ciliary node conforms to ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction; the reviewer was unsure about this one and the reasoning is recorded in notes - RAB23 is not a basal-body, transition-zone, BBSome or IFT component, but the module node is defined by the functional lesion it produces (GO:0061512, a structurally present but functionally incompetent cilium), which is exactly what the Smoothened and Kif17 results show. Added cilium assembly (GO:0060271, DECREASED) to that node to match the module's expected processes, supported by the ciliation-frequency result already cited.

    Finding 2 (node name asserts a direction the node declines to assert). Correct. Renamed 'De-repression of Hedgehog Signalling' to 'Hedgehog Signalling Dysregulation' - 6 occurrences in this file: the node, one bare-name downstream target, three pathophysiology# attaches_to references, and one experiment readout target. Rewrote the two prose passages that referred to the name recording the classical genetics.

    Finding 3 (missing phenotypes). Added Hydrocephalus (HP:0000238), Abnormal brain morphology (HP:0012443), Genu valgum (HP:0002857) and Corneal opacity (HP:0007957), all from evidence already in the reference cache. Hydrocephalus was already stated as prose in the c.86dupA variant description without being a queryable phenotype. Cerebral malformation is load-bearing because the Intellectual disability description makes it the prognostic determinant. All four wired into the pathograph; the brain-morphology edge is the one with independent support for the route, since the module this node now conforms to carries its own Hedgehog to CNS malformation edge. Declined to curate the facies cluster (hypertelorism, depressed nasal bridge, low-set ears) that the sibling MEGF8 entry carries: the only source here describing the face is a single case report, and the decision is recorded in notes so the asymmetry is deliberate.

    Finding 4 (treatments). Added target_mechanisms to craniofacial surgery, targeting Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis, so treatments now join the pathograph. Added Cardiac surgical correction, whose supporting quote was already in the file on the cardiac phenotype, and Genetic counselling for an autosomal recessive disorder with a known familial variant and documented parental carrier testing.

    Reviewer suggestion considered and declined with reasons recorded: moving the obesity edge from the Hedgehog node to ciliopathy_dysfunction#Hypothalamic Ciliary Signaling and Metabolic Dysfunction. That module node is a better-specified route, but no cited source reports a hypothalamic, leptin or metabolic measurement in a RAB23 patient, so moving it would swap a weakly cited attribution for an uncited one.

    Also: recorded the GeneReviews negative in notes (no chapter for RAB23 or Carpenter syndrome; the craniosynostosis chapters are FGFR-related), and filled in the links block on the CREATE history record, which had empty issue and PR lists.

    Validation: 122/122 snippets verified (up from 109), 14 phenotypes with 0 orphans (up from 10), 21 cited PMIDs, all offline gates clean, 2699 conformance tests pass.

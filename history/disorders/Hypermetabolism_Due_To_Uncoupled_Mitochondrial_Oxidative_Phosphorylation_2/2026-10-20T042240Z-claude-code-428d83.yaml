  details: |
    De novo curation of HUMOP2 (MONDO:0859302, OMIM 620085, ATP5F1B-related) from the stub stubs/Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2.yaml.

    No deep-research provider was used. 'just research-disorder falcon' was attempted first and failed because the recipe requires the disorder file to exist; rather than seed a throwaway file, the entry was curated directly from the three primary papers, whose full texts were already cached via just fetch-reference. Provider slug recorded here as none so the absence is queryable rather than implied.

    Sources: PMID:36239646 (Ganetzky et al., NEJM 2022, PMC full text) is the only report of this disease and supplies every curated phenotype, the pathophysiology chain and both treatments. PMID:36860166 (Nasca et al., Brain 2023) and PMID:40276935 (Harrer et al., Mov Disord 2025) are cited only in the mechanistic_hypotheses entry and its knowledge-gap discussion, which contrast the hypermetabolic and dystonic ATP5F1B arms; neither disease is curated as a subtype here.

    Pathophysiology is a seven-node causal chain from the gamma-stalk interface lesion through chemiosmotic uncoupling, inner membrane depolarization, respiratory hyperactivity and glycolytic compensation to the organism-level hypermetabolic state and heat dissipation.

    Key curation decisions. No FrequencyEnum values anywhere: the disease rests on one monozygotic twin pair, so two concordant patients share one de novo allele and no denominator exists. functional_impact_category is DOMINANT_NEGATIVE, not GAIN_OF_FUNCTION or NEOMORPHIC, because the paper states a dominant-negative effect on coupling and shows the mutant assembles into complex V. Recurrent hyperthermia is bound to HP:0001954 Recurrent fever with a notes field recording why HP:0002047 Malignant hyperthermia was rejected. Increased blood urea nitrogen was considered and omitted as a confounded single-line laboratory observation. No gene_disease_validity assertion: ClinGen has not classified the pair.

    Validation. just validate passed (schema, terms, references). just validate-disorders passed: 35/35 snippets verified, 38 titles checked, 0 issues. check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-coarse-phenotypes and check-block-scalar-comments all clean with no new findings. just check-genereviews --online returned GeneReviews NO_CHAPTER with synonyms populated, which verifies the negative-existence claim in review_notes. list-disconnected-phenotypes reports 6 of 11 phenotypes causally connected (54.5%); the five unconnected are the laboratory findings, developmental delay and IUGR, for which the source states no upstream mechanism. Weighted compliance 86.3%.

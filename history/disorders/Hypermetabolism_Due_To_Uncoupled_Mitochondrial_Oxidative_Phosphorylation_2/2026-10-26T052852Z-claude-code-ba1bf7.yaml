  summary: Add experimental_models, OpenScientist assessment sidecar, upstream follow-ups
  details: |
    Closes the follow-up items left open when PR 15493 merged. Branch restarted from origin/main, since that PR is merged and follow-up work cannot stack on merged history.

    Added experimental_models with modeled_mechanisms for the three cell systems every IN_VITRO evidence item in the entry rests on, so each in-vitro claim now reaches the pathograph through a model whose limits are typed rather than through a bare citation. Five model-to-mechanism links, four carrying typed divergences. Patient primary dermal fibroblasts carry native allele dosage and get a BOUNDARY_OMISSION divergence, because fibroblasts are not the tissue in which the phenotype manifests; their membrane-potential link is PARTIALLY_RECAPITULATES, since that measurement was substrate-driven in one twin's line rather than at baseline. The A375 CRISPR knock-in clones give the isogenic comparison and the oligomycin reversal, with POPULATION_MISMATCH for the melanoma background; their link to Glycolytic Compensation is the one link at fidelity LOW with an INVALIDATING divergence, because aerobic glycolysis is a property of a transformed background and an increment on that baseline cannot be read as the compensation an untransformed cell would make. The HeLa heterologous expression arm is what distinguishes dominant negativity from haploinsufficiency and carries PROXY_QUANTITY plus POPULATION_MISMATCH. just model-scale-audit reports 5 links, all scale-determined, 4 aligned and 1 model-above-target; the 125 model-related tests in tests/test_data.py pass.

    No ModelDivergenceTypeEnum value describes supraphysiological or non-endogenous expression level, which is the HeLa arm's central caveat, so it is recorded as PROXY_QUANTITY with the specifics in the description and the gap noted in review_notes. CLAUDE.md anticipates SUPRAPHYSIOLOGICAL_EXPRESSION as a likely future value; this is a case for it.

    Added the OpenScientist assessment sidecar at assessments/openscientist-assessment-by-claude-opus-5.yaml, which CLAUDE.md requires because the report names datasets and claims computations. Overall verdict PARTIALLY_SUPPORTED. Eight data sources and four analyses inventoried, with eight claim dispositions.

    This assessment corrects a claim I made in the previous round and recorded in an earlier history record. I had called the structural analysis REPORTED_ONLY on the grounds that it could not be replayed. That was wrong: it can be, and it reproduces. Re-deriving minimum heavy-atom distances from PDB 1BMF with an independently written parser returns all nine variant rows to 0.1 Angstrom across the three catalytic states, nearest-nucleotide ligand identities included, plus the DELSEED control. The gnomAD lookup replays to every significant digit from the committed GraphQL query. Every UniProt feature assertion checks out against P06576: 529 residues, transit peptide 1-47, Walker A 206-213 reading GGAGVGKT, DELSEED 444-450, binding sites 209-214 and 238-239, residue identities Thr334, Leu335, Val482, Gly206, and local context GYQPTLATDM.

    Two defects found in the provider's derived tables, neither touching the variant distances or the conclusion. The P-loop positive control is rowed against UniProt 206 / PDB 156, which measures 5.2 Angstrom to bound nucleotide, while the 2.7 and 3.0 Angstrom values that row carries belong to UniProt 209 / PDB 159, which is what the report's prose says; both residues are Gly because Walker A reads GGAGVGKT, which is how the mislabel hides. And the DELSEED control row labels UniProt 446 as Asp when it is Leu, the Asp being 444.

    Dispositions follow the gate's model rather than my preference. Because no code, environment specification or MANIFEST.yaml was committed and the report frontmatter carries no artifact_manifest_sha256, nothing in the bundle can be REPRODUCIBLE, so no analysis can be SUCCEEDED and no RETAINED claim may cite an analysis_id. The three analysis-backed claims are therefore QUALIFIED, with the independent replication recorded in each rationale. The two UniProt sources are CITED_NOT_ACCESSED despite my having verified their content, because the provider committed no access record and prose describing a lookup is not one; those are different claims and the schema is right to separate them. The report's claim that a seed snippet is absent from the NEJM abstract is REJECTED as a curation flag while credited as a sound instinct: it is true of the abstract and false of this repository, where the cache holds PMC full text.

    The ATP5F1B movement-disorder entity could not be queued as a stub. MONDO has no term for it, an OLS search over labels, synonyms and definitions returns nothing for ATP5F1B, and a stub requires a valid mondo_id. The complex V nuclear-type terms that exist describe recessive multisystem deficiencies, so anchoring a stub to one would assert the wrong disease. ATP5F1B has OMIM gene entry 102910 but no phenotype MIM for the dystonia arm. Recorded in review_notes, with a MONDO new-term request as the prerequisite.

    The two upstream requests, a MONDO new-term request and an HPO new-term request for non-pyrogenic recurrent hyperthermia, could not be filed from this session: those repositories are not attached, GitHub API tools do not cover unattached repositories, and attaching one with push credentials in order to file an issue was denied by the permission classifier. Not worked around. Tracked as dismech issues carrying the request text instead.

    Validation: just validate-disorders passes with 52 of 52 snippets verified, up from 43, and 55 titles. entity-ref, causal-target, duplicate-key, enum-value and qualifier-term gates pass; the six whole-KB ratchet gates each report zero findings in this file. just validate-hypothesis-assessment passes. Weighted compliance 83.2%, down from 86.3% because the two added sections bring recommended slots into the denominator.

  summary: 'Address PR 15493 re-review: snippet fidelity, diagnosis section'
  details: |
    Addresses the ai4c-reviewer re-review on commit 5a281e2 (CHANGES_REQUESTED), both IMPORTANT items plus the suggestions.

    Both blocking items were snippet-fidelity defects, and the reviewer was right that I had made one of them worse rather than better. The Tachypnea evidence quoted only the exclusion clause, so the quote never named tachypnea; it now quotes the whole source sentence including the rate. The variant's structural-position item had been a fragment ending 'hydrophobic sleeve in the', and my previous round replaced it with 'Mutations in this region in the', which is shorter and asserts nothing at all. Both fragments stopped immediately before a Greek letter because I had assumed Greek characters would not survive snippet normalization. That assumption was wrong, and the reviewer identified why: the normalizer maps non-word characters to spaces, and Greek letters are word characters under Python's Unicode \\w, so they match when typed verbatim. Verified against the cached full text with the repository's own normalization before rewriting. Three snippets were restored to their full claims with Greek letters typed: the alpha3beta3 hydrophobic-sleeve sentence, the yeast mgi uncoupling sentence, and the variant sentence now completed through 'beta subunit of CV'. CLAUDE.md's preference for plain ASCII in new snippets is about invisible characters that do not fold, such as soft hyphens and a typed x for the multiplication sign; a visible Greek letter that is part of the nomenclature is not that case, and a fragment supporting nothing is the worse defect.

    Added the diagnosis section the last two reviews both suggested, with two rows: fibroblast respirometry with simultaneous membrane-potential measurement, carrying the oligomycin-sensitivity rationale and quoting the diagnostic observation that preceded genetic testing, and exome sequencing bound to NCIT:C101295. That CURIE was read from OLS in the same step it was written, which matters here because CLAUDE.md's own fabrication table lists NCIT:C101293 as a plausible-looking wrong code for exome sequencing. The respirometry row carries no NCIT term and records why: NCIT has no respirometry or membrane-potential term, and its oxygen-consumption terms are exercise-physiology measures.

    Recorded the OpenScientist structural analysis as REPORTED_ONLY, as the reviewer asked. The report's own Provider Artifact Bundle section claims the bundle holds the distance-analysis code and a checksummed MANIFEST.yaml; the committed artifacts directory contains only the derived tables, the PubMed search log, and the HTML and PDF renderings. So the PDB 1BMF distance computation and the secondary-structure parse cannot be replayed from what was committed, and neither is independently verified. Nothing from the report has been promoted into the entry.

    Added the report's competing model to the knowledge-gap rationale as a third reading: selective basal-ganglia vulnerability to any loss of complex V output, which would dispense with the coupling-versus-catalysis axis entirely. Explicitly marked as a provider lead rather than a curated claim, and noted that the cross-subunit papers it rests on (ATP5F1A, ATP5MC3) are cached but not cited in this entry.

    The PR title and body were stale on both reviews, still describing the reference-cache commit and saying no KB entry had been written. Both were rewritten, since the squash commit takes its message from them.

    Not done, and not claimed as done: experimental_models with modeled_mechanisms for the three cell systems the in-vitro evidence rests on, which remains recorded as a known gap in review_notes; and an HPO new-term request for non-pyrogenic recurrent hyperthermia, which both reviews suggested and which cannot be filed from this session.

    Validation: just validate-disorders passes with 43 of 43 snippets verified, up from 41, and 46 titles. entity-ref, causal-target, duplicate-key, qualifier-term and enum-value gates pass. The six whole-KB ratchet gates were each filtered on this filename and report zero findings in this file.

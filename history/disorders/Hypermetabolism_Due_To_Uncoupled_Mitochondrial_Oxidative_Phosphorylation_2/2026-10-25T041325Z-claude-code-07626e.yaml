  summary: 'Review round and OpenScientist hypothesis run: ATP5F1B'
  details: |
    Pre-PR red-team review round plus an OpenScientist hypothesis-exploration run. Supersedes this entry's CREATE record on one point: that record states no deep-research provider was used, which was true when written and is no longer. just research-hypothesis openscientist was run against coupling_versus_catalysis_allelic_split once the disorder file existed; report at kb/hypotheses/Hypermetabolism_Due_To_Uncoupled_Mitochondrial_Oxidative_Phosphorylation_2/coupling_versus_catalysis_allelic_split/openscientist.md.

    Corrected a false negative-existence claim I had written. The hypothesis description and the knowledge-gap rationale both asserted that no published work explains or directly compares p.Thr334Pro and p.Leu335Pro, and that the respiratory-flux contrast was assembled across laboratories rather than observed. PMID:36860166 refutes both, and it was already cached and already cited three times in the same block. It states the adjacency, models both residues as impairing the same beta-to-gamma contact, raises a shared coupling mechanism for its own variants while noting that is what was proposed for p.Leu335Pro, and measured respirometry alongside complex V activity in the same cells. Each of those four sentences was verified by grep against the cached full text before the rewrite. The hypothesis now carries two REFUTE evidence items, and the dystonia arm's normal oxygen consumption, which is the single strongest support for the split and was previously uncited, is now cited.

    Other corrections. GO:0006119 oxidative phosphorylation with INCREASED asserted the inverse of the disease, since that term is defined as the ADP-to-ATP phosphorylation which is reduced here; rebound to GO:0022904 respiratory electron transport chain with a note recording why. One evidence snippet was truncated one word before the gene name its explanation claimed it established. Recurrent hyperthermia moved from HP:0001954 Recurrent fever to HP:0004370 Abnormality of temperature regulation, following the Fatal_Familial_Insomnia precedent, because the fever axis would cluster this entry with autoinflammatory disease. The resting-energy-expenditure phenotype was re-evidenced, since the previous snippet quantified intake only and expenditure was estimated rather than measured. Severe complex V reduction reattributed to p.Thr334Pro alone: Nasca reports normal activity in one p.Val482Ala carrier and a mild defect in the other. The dominance premise scoped to missense alleles, since the splice allele is a reduction-of-output allele per Harrer's own model. Depolarization node corrected to say the patient-cell measurement was substrate-driven in one line while baseline reduction was in the CRISPR clones, and the ADP-normalisation control added. Structural-modelling evidence regraded OTHER to COMPUTATIONAL, with a MODEL_ORGANISM plus quote_role BACKGROUND item for the yeast mgi result. Two notes fields that narrated the curation session rather than the disease were deleted. Folinic acid added as the third administered treatment. Penetrance and variant-classification contrast between the arms added.

    Rejected one review suggestion after checking it: changing parents from MONDO:0003847 hereditary disease to MONDO:0044970 mitochondrial disease. MONDO:0044970 is not in MONDO:0859302's ancestor closure, verified against the OLS hierarchicalAncestors endpoint, so asserting it would contradict the ontology. Recorded in review_notes as an upstream MONDO observation instead.

    OpenScientist verdict was PARTIALLY SUPPORTED with EMERGING retained, which agrees with the revised entry. Its reference validation, which this script does not run, was added separately with just validate-research-reference: 8 of 8 resolved, none unresolved, none off topic. Its term validation sets needs_review for one obsolete term, GO:0015992, superseded by GO:1902600, which is the term this entry already binds, so no fabrication. The report flags one of this entry's snippets as absent from the NEJM abstract; that is correct about the abstract and wrong about this repository, since the cache holds the PMC full text and full-text matches are permitted for KB entries. Verified by grep against the cache. No provider claim has been promoted into the entry: the report is a lead and still needs an assessment sidecar inventorying its data_sources and analyses, which has not been written. Its artifact bundle carries no MANIFEST.yaml, so it is not a canonical computational run bundle.

    Validation after the round: just validate-disorders passes with 41 of 41 snippets verified, up from 35, and 44 titles. entity-ref, causal-target, duplicate-key, qualifier-term, enum-value and coarse-phenotype gates clean. The four whole-KB ratchet gates report findings elsewhere in the corpus against a stale origin/main baseline; this file contributes zero to each, confirmed by filtering each gate's output on the filename.

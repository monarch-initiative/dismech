  summary: 'Review round 1: retinal phenotype re-curated, DHRSX revision, worm model
    moved to animal_models, biochemical block added'
  details: |
    Addressed the ai4c-reviewer round-1 review on PR #10397.

    CRITICAL 1 (retinal dystrophy curated as adult-onset/OCCASIONAL): re-curated to CHILDHOOD onset and FREQUENT, rebound from HP:0000510 (Rod-cone dystrophy) to HP:0000556 (Retinal dystrophy) because only one cited source names retinitis pigmentosa specifically and the one electrodiagnostic result reports combined rod and cone dysfunction rather than a rod-first sequence. Cited PMID:28253385 (7 patients, 4 families, all homozygous for the entry's own p.Trp19Ter allele) and PMID:31638560. Added a REFUTE item on the ocular-degeneration edge against reading the retinal component as late-onset, and reframed that node to separate progression from age at recognition.

    CRITICAL 2 (alternative dolichol pathway): cited PMID:42201967 on the pathophysiology node and in the open-question discussion. Recorded that the one-step model has been superseded by the DHRSX three-step detour pathway, but did NOT close the open question: the same paper's rescue experiment shows DHRSX and SRD5A3 are non-redundant (SRD5A3 does not rescue tda5-delta), and deleting the DHRSX counterpart reproduces this disease's biochemistry, so DHRSX cannot be the route that preserves dolichol in SRD5A3-null cells. Excluded it as a candidate instead.

    IMPORTANT 3/4: moved the C. elegans model from experimental_models to animal_models with species and genotype (verified the convention: 9 C. elegans models in animal_models across the KB, 2 in experimental_models). Regraded its evidence OTHER to MODEL_ORGANISM and removed the incorrect vertebrate-restriction rationale. Split the mixed atorvastatin sentence into a MODEL_ORGANISM item and an IN_VITRO item in both places it was used.

    IMPORTANT 5: corrected both contradicted notes claims - the 'no per-feature percentages' claim now records the counted denominators that do exist and why they are not used as bands, and the models paragraph no longer conflates animal with vertebrate.

    IMPORTANT 6: reference consumption raised from 9 to 18 cited PMIDs. Newly cited: 20700148 (Kahrizi syndrome, grounding the previously uncited synonym, plus its c.203dupC allele), 28253385, 31638560, 41667393, 41769439 (normal brain MRI at 20 months, cited REFUTE against the vermis hypoplasia phenotype), 42201967, 42472049 (GTEx, cited REFUTE against baseline expression explaining tissue vulnerability), 26628744 (Arabidopsis dolichol rescue), 39236565.

    IMPORTANT 7: added a biochemical block for the polyprenol-to-dolichol ratio with two readouts (diagnostic and pharmacodynamic), and added retinal electrophysiology/imaging and intragenic copy-number analysis as diagnosis entries.

    IMPORTANT 8: ran the GeneReviews search. No chapter exists; the only hit is a retired overview. Recorded in notes.

    Added phenotypes: Nyctalopia, Myopia. Added variants: c.203dupC, c.436G>A, c.509A>G. Added discussions: corticospinal_involvement, dolichol_supplementation.

    Validation: 128/128 snippets verified, schema and term validation pass, all offline gates clean, 20 phenotypes with 0 orphans.

  summary: 'Create: SRD5A3-Congenital Disorder of Glycosylation'
  details: |
    De-novo curation of MONDO:0012885 (CDG-Iq), claimed via issue #10378.

    Deep research: one openscientist run (research/SRD5A3-Congenital_Disorder_of_Glycosylation-deep-research-openscientist.md, 45 min, 27 citations, 27/27 references resolved, 0 unresolved).

    The run's recipe exited 3 after the research completed, because term validation hit a 5-second read timeout against EBI OLS on a single CURIE (HP:0000589). That aborted the recipe before either validation section was written, so the report landed looking complete and unchecked. I ran both validators by hand; the term validation succeeded on first retry, confirming the timeout was transient. Filed as issue #10396, because the abort discards the validation of a 45-minute run and does it silently from the curator's point of view.

    That mattered here. The report supplies MONDO:0012997 as this disease's identifier, labelled 'congenital disorder of glycosylation, type Iq' - a genuine synonym for SRD5A3-CDG attached to the wrong ID. MONDO:0012997 is cholestasis-pigmentary retinopathy-cleft palate syndrome. The correct term, MONDO:0012885, is what this entry binds. The term validator catches it precisely, but only when it runs. This is the second instance in this claim run of the empty-mondo_id problem in issue #9888 producing an invented ID that resolves to a different disease; reported there with both cases.

    The entry was drafted first from the primary literature (PMID:20637498 gene discovery, PMID:22304929 the fibroblast lipid measurements, PMID:27480077 the phenotype expansion with adult-onset features, PMID:41732066 serum glycoproteomics). The report then contributed, all verified against the primary sources: the C. elegans W19X model and the atorvastatin repurposing result (PMID:41648237), the documented absence of a usable mouse model (PMID:26346620), the current case count of about 60 and the 23-variant allelic spectrum (PMID:35339718), the p.Gln96delinsX founder allele and its variable association with coloboma (PMID:30019980).

    Two curation decisions worth flagging. Atorvastatin is recorded as an explicitly experimental treatment, never administered to a patient, because the result is a worm rescue plus correction of the polyprenol-to-dolichol ratio in patient fibroblasts. It is included because the reasoning is mechanistically informative: an HMG-CoA reductase inhibitor restricts isoprenoid supply upstream of polyprenol, so it should help only if the pathogenic quantity is the ratio rather than the dolichol level - which makes the result independent support for this entry's central mechanistic hypothesis.

    Second, the missing mouse model is curated as a knowledge gap with REFUTE-graded evidence rather than as silence. The one published mouse lacking Srd5a3 lacks eight neighbouring genes, and its peri-implantation lethality was traced to Exoc1, confirmed by a separate Exoc1 knockout and by a CRISPR deletion of the same interval that is not lethal. Reading that mouse as an Srd5a3 phenotype would be wrong, so the entry says so explicitly.

    Pathograph routes the phenotype through the raised polyprenol-to-dolichol ratio rather than dolichol depletion, because two independent groups measured normal dolichol in enzyme-null cells. Zero phenotypes lack an incoming edge; single root at the enzyme deficiency node.

    Validation: just validate passes with 87/87 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all clean; the snippet-boundary prototype from issue #10388 returns zero findings.

  summary: 'Create: Trichohepatoenteric Syndrome'
  details: |
    New entry curating the open stub stubs/Trichohepatoenteric_Syndrome.yaml, which is deleted in the same change.

    MONDO:0009105. Unlike the other new gut entries this MONDO term is an OMIM phenotypic series (OMIMPS:222470) rather than a gene-anchored disease, with two gene-defined children: THES type 1 (TTC37) and type 2 (SKIV2L). Recorded as one entry with two has_subtypes rather than two entries, because the sources describe the types as clinically indistinguishable and both act by disabling the same SKI complex - the split is molecular, not phenotypic. The lump decision and the conditions under which a split would be warranted are written into the entry notes, and the subtypes already carry their genes so a later split is cheap.

    Five-node chain: loss of a human SKI complex cofactor (trigger) -> failure of exosome-mediated cytoplasmic mRNA surveillance (central_effector) -> dysregulated abundance and localization of target proteins (effector) -> intractable infantile diarrhea with a structurally normal brush border, and multisystem involvement outside the gut (two consequences).

    The scientifically important part of this entry is what it declines to claim. THES conforms to NONE of the three epithelial CODE mechanism modules created earlier on this branch, and the notes record why for each: not enterocyte_polarity_trafficking_failure, because the decisive finding is that the enterocyte brush border is ultrastructurally NORMAL and basolateral Na/K-ATPase localization is preserved; not electrolyte_transport_related_diarrhea, because several transporters are affected with a different profile in each patient rather than one named transporter failing in all, and there is no ion-specific systemic signature; not diet_induced_osmotic_diarrhea, because no dietary substrate is implicated. The notes also warn against using the non-specific villous atrophy THES shares with the structural enteropathies to force a conformance, since that atrophy improves with time and does not correlate with diarrhea severity.

    Both causal edges out of the effector node are typed INDIRECT_UNKNOWN_INTERMEDIATES, and a KNOWLEDGE_GAP discussion with two proposed experiments records the open question: how loss of a general cytoplasmic RNA-surveillance complex produces a severe organ-selective enteropathy with a normal brush border. The one intestinal observation available is described by its own authors as "preliminary", which is stated in the node description rather than presented as settled.

    The prevalence record notes a genuine source disagreement rather than averaging it: the review gives 1/1,000,000 births while the gene-discovery paper gives 1 in 400,000 to 1 in 500,000. The lower figure is recorded and the discrepancy is noted.

    One snippet was trimmed to start after the source's bracketed "[ATPase]", because bracketed spans are stripped before snippet matching; the explanation records why the quote begins mid-sentence so a later reader does not mistake it for careless quoting. The global literal_bracket_patterns config was deliberately not changed, since that affects every cached reference in the KB.

    Validation: linkml-validate clean; linkml-term-validator clean; 25/25 snippets verified against cached abstracts; duplicate-key, folded-hyphen and check-stubs gates clean.

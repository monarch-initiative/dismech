  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review of an IUIS Table 2 entry. No new references were needed: the GeneReviews cache (PMID:29334452) was cited only three times and was substantially unmined, and nearly every addition came from it. IUIS-RELEVANT GAP: the entry recorded low immunoglobulins but never named the immunodeficiency itself. Added an Immunodeficiency phenotype (HP:0002721) that preserves the GeneReviews qualifier 'poorly characterized' rather than overstating it, plus Recurrent Infections (HP:0002719); the description makes explicit that what is established is a humoral/antibody-production defect that often improves with age, with no consistent cellular defect defined - i.e. a syndromic rather than mechanistically-defined immunodeficiency. FIDELITY FIX: the Intractable Infantile Diarrhea phenotype carried frequency VERY_FREQUENT, but its second evidence item's explanation still read 'supporting the OBLIGATE band' - a leftover internal contradiction from an earlier band correction. Rewrote that explanation to state what the quote does and does not establish, and to point at the GeneReviews 'almost all affected children' quantifier as the actual basis for the band. MISSED CLAIMS: added four further phenotypes from the unmined GeneReviews text - Skin Abnormality (HP:0000951), Congenital Heart Defect (HP:0001627) and Platelet Anomalies (HP:0001872) from the 'less common findings' sentence, and Hypothyroidism (HP:0000821) sourced from the annual-TSH surveillance recommendation rather than from a presenting-feature list, with the description saying so. Gave the previously edge-less 'Multisystem Involvement Outside the Gut' node four downstream edges (Immunodeficiency, Recurrent Infections, Hepatic Fibrosis, Woolly Hair), all INDIRECT_UNKNOWN_INTERMEDIATES consistent with the entry's existing discipline about unresolved intermediates. Substantially improved the Immunoglobulin Replacement treatment, whose only evidence had been a weak co-occurrence quote: GeneReviews states both the indication (low or functionally abnormal immunoglobulins) and the goal (reduce infection burden), and a target_mechanisms edge now points at the new Immunodeficiency node. Added the current GeneReviews diagnostic standard (which also fixes the SKIC3/SKIC2 vs TTC37/SKIV2L symbol question the entry's notes raise), a Surveillance for late complications diagnosis record including the IBD caution, a Genetic Counseling treatment with the 25% recurrence risk, and a second prevalence record for the 52 cumulative reported cases (CASES_IN_LITERATURE, kept separate from the existing birth-prevalence record with a note that the two measures must not be compared). Snippets 34 -> 52, all verified; all validation gates pass.

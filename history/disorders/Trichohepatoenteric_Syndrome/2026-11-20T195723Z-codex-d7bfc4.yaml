  summary: Map Trichohepatoenteric syndrome to OMIMPS:222470
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS222470 contains TTC37-related type 1 (OMIM:222470) and SKIV2L-related type 2 (OMIM:614602), matching the two subtypes curated here and the two children of MONDO:0009105. The two SKI-complex components converge on impaired cytoplasmic RNA surveillance and the multisystem trichohepatoenteric syndrome, supporting one Disease while preserving gene-specific clinical and mechanistic distinctions. The alignment is at syndrome level rather than with the TTC37 record alone, and does not extend to all congenital diarrheas or every RNA-exosome disorder.

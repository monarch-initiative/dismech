  summary: 'Address round-2 automated review on PR #11128 (DEEAH/MADD)'
  details: |
    Round-2 review response on PR #11128. IMPORTANT item asked to drop valproate/clonazepam/phenytoin as unsupported; verified by grep first (as the coordinator advised) and found the round-2 premise incorrect: all three drug names appear in references_cache/PMID_38459224.md per-patient AED narratives (valproate line 101, valproate+clonazepam line 109, phenytoin line 111). Because the drugs are genuinely sourced, I kept the therapeutic_agent entries and instead substantiated them by adding three exact-quote HUMAN_CLINICAL evidence items on the Antiseizure treatment (therapeutic_agent carries no evidence slot of its own, which was the real gap). SUGGESTIONS taken: graded Congenital heart disease OCCASIONAL->FREQUENT with an added 80-100% cohort quote; added Pain insensitivity phenotype (HP:0007021) from PMID:38459224 and linked it from the Autonomic/Sensory node (this corrects the round-1 history note that claimed no pain-sensation quote existed - a quotable sentence does exist); re-anchored Recurrent apnea to the cleaner single-patient cyanosis/apnea sentence and dropped its frequency (single case); changed the hESC islet experimental_model_type OTHER->ORGANOID and removed the EndoC-betaH1 cell-line mention to avoid conflating model types; normalized external_assertions identifiers to ORPHA:686495 and MedGen:C5436579. Item 7 (fetch/cite ORPHA:686495 directly) was NOT done: the ORPHA structured source needs the Orphadata bulk XML (data/orphadata/en_product1.xml), which is gitignored and not present in this worktree, and downloading the full bulk file for one optional citation is out of proportion; OMIM/Orphanet/MedGen are already recorded as external_assertions. The other three round-1-declined phenotypes (exocrine pancreatic insufficiency, hypothyroidism, hypohidrosis) remain declined - no quotable primary-source support. Validated: just validate (44/44 snippets), validate-disorders, validate-terms, all check-* gates, model-scale-audit --strict (exit 0), validate-history.

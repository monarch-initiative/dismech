  summary: 'Create: Deeah Syndrome (MADD)'
  details: |
    Created DEEAH syndrome (developmental delay with endocrine, exocrine, autonomic, and hematologic abnormalities; MONDO:0033561), an autosomal recessive multisystem disorder from biallelic loss-of-function MADD (the gene MAP-kinase-activating death domain, hgnc:6766 - NOT the acyl-CoA metabolic disorder abbreviation MADD). Curated entry_type DISEASE. Pathograph: biallelic MADD LoF -> impaired DENN/Rab-GEF vesicular trafficking (Rab3/Rab27, EGF endocytosis defect) and impaired TNF-alpha/ERK1-2 cytoprotective signaling -> increased neuronal apoptosis (caspase-3/-7) plus endocrine/exocrine secretory and autonomic/sensory dysfunction. Evidence from Schneeberger et al 2020 Brain (PMID:32761064, defining cohort, patient-fibroblast functional studies), Khan et al 2025 JBC (PMID:40812422, DENN/MADD Rab-GEF substrate mapping), Abou-Nader/Elbendary 2024 J Hum Genet (PMID:38459224, spectrum + frequencies), and Darouich 2024 AJMG (PMID:37932938, calloso-adreno-scrotal case). Deep research: claude_code literature sweep (research/Deeah_Syndrome-deep-research-claude_code.md); its single PMID (11359932, mouse Rab3-GEP) was flagged off-topic and not cited. Watched for MADD gene vs acyl-CoA disease confusion throughout. Validated: just validate, just validate-terms, just validate-disorders (29/29 snippets verified), all path-accepting check-* gates.

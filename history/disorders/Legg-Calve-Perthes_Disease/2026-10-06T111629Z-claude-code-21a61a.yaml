  summary: 'Create: Legg-Calve-Perthes Disease (promoted from Osteochondrosis subtype)'
  details: |
    Step 1 of issue #10063: a standalone Legg-Calve-Perthes disease entry (MONDO:0007885), promoted out of the Osteochondrosis has_subtypes list, which keeps a curated_in pointer. Ten pathophysiology nodes; eight conform to the ischemic_bone_necrosis_and_repair module on its epiphyseal arm and shared repair/failure segment (trigger, cartilage-canal chondronecrosis, secondary-ossification-centre necrosis, growth-plate injury, DAMP/synovitis amplifier, resorption-dominant revascularization, subchondral fracture/collapse, residual deformity), plus a thrombophilic predisposition node and the COL2A1 phenocopy node moved from Osteochondrosis. Eleven phenotypes, ten causally connected; delayed skeletal maturation left unwired on purpose. Treatments: observation/physiotherapy, abduction orthosis (recorded as abandoned), femoral varus osteotomy with age and lateral-pillar effect modifiers from the Herring 2004 prospective study, Salter osteotomy, investigational antiresorptive therapy targeting the resorption node, and arthroplasty. Waldenstrom stages, Herring and Stulberg classifications as definitions, four progression phases, two environmental exposures (secondhand smoke bound to ECTO:7000059 with the search recorded; deprivation bound to ECTO:6000028), piglet and immature-mouse models with typed divergences and readouts, four mechanistic hypothesis groups (repeated infarction kept EMERGING with no edge depending on it), three discussions, three ClinicalTrials.gov records. Twenty references newly fetched into references_cache; all 212 snippets across the two files verified against cached text; validate-disorders, check-entity-refs, check-causal-targets, check-granularity (POINTER only), check-enum-values, check-duplicate-keys, model_scale_audit all pass.

  details: |
    Review round on PR #13614, answering the ai4c-reviewer CHANGES_REQUESTED verdict in one push.

    Blocking item: a deep-research run for the disease. `just research-disorder falcon Legg-Calve-Perthes_Disease` produced research/Legg-Calve-Perthes_Disease-deep-research-falcon.md with its .citations.md sidecar and a two-file _artifacts/ folder (evidence-map table, Waldenstrom figure); 11/11 references resolved, 6 on topic. `just preflight-dr` against MONDO:0007885 returned WARN only for IL6 at 62% of the COL2A1 mention count; the IL6 passages are the disease's own synovial-fluid and promoter-polymorphism literature, not a second entity, so no section was excluded. Cross-checking the entry against the report: the mechanism chain, staging, classifications, genetics, exposures, trials and treatments were already covered. Three leads were folded in: the 2023 Joseph/Shah/Perry review (PMID:37799310) for stage-dependent reversible versus irreversible load deformation and for its verdict that containment evidence is poor quality; naturally occurring canine Perthes disease (PMID:38938425) as a second animal model, PARTIALLY_RECAPITULATES on the secondary-ossification-centre necrosis node with SPECIES_MISMATCH and TEMPORAL_SCOPE divergences; and the prospective vitamin D cohort (PMID:38686237) as a prognostic biochemical marker of fragmentation duration. The report's Swedish parental-smoking and birth-weight odds ratios appear only in the review's full text, so they were not quoted (validate-disorders matches abstracts only).

    Reviewer suggestions taken: coxa magna phenotype (HP:0003279, PMID:15614054 53% frequency and Stulberg correlation, PMID:18992975 MRI volumetry) wired from the resorption-dominant revascularization node as INDIRECT_UNKNOWN_INTERMEDIATES; bilateral involvement recorded on the capital-epiphysis necrosis phenotype (10-24% from PMID:35292045, independence of the second hip from PMID:12131441); the Growth Plate Injury -> Resorption-Dominant Revascularization edge kept for module conformance but reclassified INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT on its evidence; the Woratanarat 2014 meta-analysis (PMID:23983171, pooled Factor V Leiden OR 3.10) added to the thrombophilia hypothesis and the F5 row, and its non-significant prothrombin estimate added as REFUTE on the F2 row; shelf acetabuloplasty added as a treatment (NCIT:C116464 Bone Graft, which sits under Clinical Intervention or Procedure; PMID:40560220 matched comparison, PMID:40276363 level IV series, PMID:35292045 indication); review_notes stripped of the issue-step and Orphadata-availability sentences.

    Not taken: ORPHA evidence, because `just refresh-orphadata` fails on upstream release drift and repinning the manifest plus rebuilding every ORPHA cache file is its own change, not a curation PR's; the Catterall classification, because the 1971 paper (PMID:5578764) has no abstract to quote and no cached abstract states the group definitions; StatPearls (PMID:30020602), informational only.

    Validation: just validate, validate-terms, count-verified-snippets (182/182), validate-disorders over both changed entries (235 snippets, 232 titles, 0 issues), model-scale audit, the model-link pytest checks, and every offline gate (duplicate keys, entity refs, causal targets, enum values, reference titles, snippet grading/length/title, folded hyphens, coarse phenotypes, delivery system, qualifier terms) pass. Four references fetched while sourcing (PMID:918696, 24322627, 3451628, 5578764) were pruned as uncited.

  summary: 'Review round 2: bind molecular functions on the four gene-landing nodes
    (CI gene-activity gate)'
  details: |
    Round answering the failed `Check for newly ungrounded genes` CI gate on PR #13614 (scripts/check_gene_activity_grounding.py --against-ref origin/main). The gate reported six genes newly wired into the pathograph with no molecular function on their landing node: COL2A1, F5, F2, IL6, IL23R and TNFRSF11B. Three of those (COL2A1, F5, F2) were ungrounded on main inside Osteochondrosis.yaml and so grandfathered there; moving them into the new entry made them new findings.

    Each landing node now carries one molecular_functions descriptor, with the GO term and label read from cache/go/terms.csv and the gene's own GO annotations checked against QuickGO in the same step:

    - Heritable Type II Collagen Defect: GO:0030020 extracellular matrix structural constituent conferring tensile strength, DECREASED (COL2A1 is annotated to it IDA/IBA/IC). Supporting evidence added from the 2025 review (PMID:40041162): "COL2A1 mutations weaken the strength of the epiphyseal cartilage matrix".
    - Thrombophilic Predisposition: GO:0004252 serine-type endopeptidase activity, INCREASED, as thrombin generation. GO carries no cofactor activity for factor V (its only MF annotations are copper ion binding and protein binding), so the node's activity is recorded at the protease both alleles feed: prothrombin G20210A raises prothrombin, Factor V Leiden resists APC inactivation of factor Va. Evidence added from the same review's summary of the Glueck 1997 series naming activated protein C resistance as the thrombotic route.
    - Necrotic-Bone DAMP Release and Chronic Hip Synovitis: GO:0005138 interleukin-6 receptor binding, INCREASED, on the strength of the synovial-fluid IL-6 elevation and the tocilizumab rescue already cited on the node. The descriptor says explicitly that no IL-23 receptor activity change is claimed for the IL23R candidate polymorphism; the metric grounds IL23R through the node's IL-6 term, which is a limitation of the node-level metric rather than a claim about IL23R.
    - Resorption-Dominant Revascularization: GO:0005164 tumor necrosis factor receptor binding, INCREASED, as RANKL engagement of RANK, which the OPG-Fc piglet experiment already cited on the node shows the resorption depends on; osteoprotegerin is described as the decoy receptor limiting that binding.

    No cache rows changed: all four GO terms were already in cache/go/terms.csv and the MolecularFunctionTerm enum cache.

    Validation: just validate, validate-terms, count-verified-snippets (184/184), validate-disorders over both changed entries, check_gene_activity_grounding --against-ref origin/main (OK, no newly ungrounded genes), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles, tests/test_gene_activity_grounding.py, model-scale audit, and the page render.

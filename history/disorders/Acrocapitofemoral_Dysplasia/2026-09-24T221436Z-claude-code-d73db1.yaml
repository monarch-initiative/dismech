  summary: 'Review round 1: add recurrent radiographic phenotypes and broad nail'
  details: |
    Answered the review on PR 12728. Added seven phenotype records from PMID:40045933 (the 'commonly reported radiographic features' sentence, the case text and Table 2): Broad nail (HP:0001821, 6/6 recorded), Short metatarsals (HP:0010743, recorded only in the 2 Pakistani siblings, no frequency), Flared iliac wing (HP:0002869, 3/6), Acetabular dysplasia (HP:0008807, recorded only in the proband, no frequency), Radial bowing (HP:0002986, radial/ulnar angulation 3/7, with the proband's Madelung-like deformity described), Finger symphalangism (HP:0009700, 3 patients, NR in 4, no frequency) and Hyperplastic distal femur (3/7). Every HPO term was looked up with runoak against ols:hp. Hyperplastic distal femur is deliberately unbound: HP label searches for 'distal femur' and 'distal femoral' returned HP:0006438 (enlargement of the distal femoral epiphysis) and HP:0006387 (wide distal femoral metaphysis), and the source does not say which part is enlarged. HP:0002866 (hypoplastic iliac wing) was not added as a second binding; the shortness is described in text. None of the new phenotypes is wired to a pathophysiology node, because no source states a causal link for them; each description says so. Also: the Narrow chest description now says the fourth case comes from the case text (Table 2 has NA for the younger sibling); the unsourced claim that short nails follow the short distal digits was removed; and the fifth-toe symphalangism description now mentions the Turkish patients' fifth-finger fusion. Validation: just validate, validate-terms, count-verified-snippets (77/77), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and validate-disorders.

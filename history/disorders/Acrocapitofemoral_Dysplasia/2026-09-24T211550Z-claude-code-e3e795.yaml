  summary: 'Create: Acrocapitofemoral_Dysplasia'
  details: |
    New entry for acrocapitofemoral dysplasia (MONDO:0011907, IHH). Curated from the Perplexity deep-research report (research/Acrocapitofemoral_Dysplasia-deep-research-perplexity.md) plus a PubMed search for acrocapitofemoral[TIAB] and for the mouse Ihh growth-plate literature. The report's reference validation resolved all 7 references; all were read before use. Its term validation flagged 17 mislabelled and 3 obsolete CURIEs (CL:0000133 offered as chondrocyte is neurectodermal cell; UBERON:0001465 offered as hip joint is knee; every NCIT treatment CURIE named an unrelated concept; HP:0002355 obsolete; HP:0001249, offered for normal intelligence, is Intellectual disability). None of the report's CURIEs was copied; every binding came from runoak (ols:) or cache/<prefix>/terms.csv. just preflight-dr returned PASS (IHH mentioned 94 times; the extra OMIM 112500 is BDA1, mentioned as the allelic disorder). The report misattributes the 2025 Pakistani family paper to 'Khalid et al.' (authors are Saeed et al., PMID:40045933), repeats that paper's inconsistent 'amino acids 201-308' domain range, calls several features universal that the 2025 phenotype table shows as variable, and proposes a treatment section with no human data; none of this was carried over. Frequencies come from the 2025 Table 2 counts (8 patients), recorded in phenotype descriptions. The mechanism chain (missense variants -> reduced IHH signaling -> reduced chondrocyte proliferation and accelerated hypertrophy -> premature growth plate closure -> phenotypes) is graded MODEL_ORGANISM wherever it rests on mouse Ihh deletion. The one allele-level datum is computational and is graded COMPUTATIONAL. A HUMAN_MODEL_MISMATCH discussion records that no ACFD allele has been functionally assayed, and a KNOWLEDGE_GAP records the short carrier parents in the Pakistani family. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Mortier 2003 (PMID:12624140) has no abstract and is listed under references only. Validation: just validate, validate-terms, count-verified-snippets (63/63), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values and validate-disorders run on the entry. Three phenotypes (lumbar hyperlordosis, fifth toe symphalangism, short nail) are left without a causal in-edge because no source states their mechanism.

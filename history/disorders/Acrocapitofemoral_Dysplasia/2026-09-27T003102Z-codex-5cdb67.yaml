  summary: Review Acrocapitofemoral Dysplasia against clinical and functional full
    texts
  details: |
    Reviewed the complete disorder entry, CREATE/EDIT history and matching Perplexity deep-research report/citations against primary sources. Eligible Mendelian IHH disorder with no prior REVIEW; infectious and environmental/poisoning entries are excluded from this sweep.

    Full-text consumption: read the 2025 Pakistani report (PMID:40045933), including Table 2 and methods; Wang 2021 (PMID:34070546), including methods and the downloaded supplement, with Figure S5 visually inspected; Maeda 2007 (PMID:17409191), including results, discussion and methods; Kobayashi 2005 (PMID:15951842) in its generated JCI URL cache, including results/discussion and methods; and the substantive mouse/cell results, discussion and methods of Huang 2021 (PMID:34820473). Visually read all seven pages of the Hellemans 2003 molecular article (PMID:12632327) in the scanned reprint within the fetched 2006 doctoral thesis; also read the thesis discussion of chicken micromass experiments. Read the relevant in-vitro methods, results, corrections and discussion in Cunningham's 2008 MSc thesis. The unrelated zebrafish chapter was not used. Abstract-only sources include PMID:34530144, PMID:40771183, PMID:10465785, PMID:8662546, PMID:19277064 and PMID:29155992. The original Mortier clinical letter (PMID:12624140) remained unavailable as usable cached text after multiple fetch attempts; no invented quotation or full-text claim is made for it. The scanned Hellemans article did not extract into the text cache, so new exact quotations from those scanned pages are not supplied. All committed reference caches were generated with just fetch-reference.

    Corrected the claim that no ACFD allele had been experimentally studied: Wang's V190A fragment immunoblots support reduced IHH-N abundance, interpreted as reduced stability with a smaller processing defect, not a directly measured half-life. Added a provisional allele-specific mechanism and expression model. Thesis reporter results distinguish ligand abundance from normalized intrinsic activity; documented the corrected band identification, wild-type contamination of the intended P46L construct and media/insulin confounding in the ATDC5 assay. Computational A173D findings remain separate. Split hypertrophy, loss of columnar organization and vascular invasion; qualified inferred causal edges and postnatal PTHrP redistribution. Corrected cultured-cell versus animal evidence classifications and universal-lethality misreading (60/83 vehicle-treated mutants survived).

    Reconciled five original molecular patients versus four selected in later tables, giving at least nine unblended individuals across four families. Qualified carrier hand findings using the original molecular paper. Corrected age/count/anatomical overstatements and removed population-frequency claims inferred from small selected series. Added 13 phenotypes, case-specific additional foot findings, radiographic diagnosis and molecular testing. Kept uncertain family-level manifestations without inventing mechanistic links. Added preclinical SAG treatment with pathway target and partial efficacy, alongside intestinal hyperplasia and bowel-obstruction death; no clinical regimen or human efficacy is inferred. Heterozygous-IHH growth-hormone data are not treated as biallelic ACFD treatment evidence.

    Completeness checklist: phenotype coverage adequate after the additions and denominator corrections; subtypes N/A (one discrete IHH-related disorder, blended Syrian case not pooled); pathophysiology adequate with explicit human/model limitations; treatment/trials adequate for available evidence (SAG experimental only; ClinicalTrials.gov condition query returned zero studies on 2026-09-27); genetics adequate for reported variants and incompletely characterized carriers; biomarkers/diagnostics adequate with radiography and sequencing, no validated biochemical biomarker identified; references adequate after recovering missed functional work and full texts. No applicable GeneReviews chapter was identified by the repository check including online query. Non-blocking limits are inaccessible original clinical text, inconsistent later summary tables and unresolved allele-specific human-cartilage mechanisms, not omitted established treatment or subtype evidence. New evidence and publication titles were checked against generated caches and claim relevance.

    Validation: just validate-disorders passes schema, ontology and reference checks (132 snippets, 137 titles, none unavailable); two scoped data tests pass. Internal entity links, causal targets, coarse phenotype bindings and source-defect checks pass. Final snippet/title gates and commit hooks are recorded in the PR after completion.

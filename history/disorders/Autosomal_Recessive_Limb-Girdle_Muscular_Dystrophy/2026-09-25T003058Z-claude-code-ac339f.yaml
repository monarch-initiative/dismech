  summary: 'Review round 1: split two bundled nodes, regrade two mixed-model evidence
    items'
  details: |
    Review round 1 on PR 12738, four blocking items. Split the POPDC node: it bound GO:0072659 protein localization to plasma membrane DECREASED and listed both POPDC1 and POPDC3, but the only trafficking evidence is POPDC1 S201F in patient muscle, and POPDC3's only reported readout is aberrant modulation of TREK-1 in Xenopus oocytes. POPDC1 keeps the trafficking node; POPDC3 gets its own node bound to GO:0015459 potassium channel regulator activity with modifier ABNORMAL, and its downstream edge names no intermediate because the path from altered TREK-1 modulation to the sarcolemmal lesion is not established. Split the Notch node, which held a pathway state and its cellular consequence together while its own evidence treats them as cause and effect: Reduced Notch Signalling in Muscle Progenitors holds GO:0007219, POGLUT1 and JAG2; Satellite Cell Pool Depletion holds CL:0000594 and the authors' Notch-dependent-loss sentence, and the first now points at the second. Regraded two evidence items whose evidence_source did not match the work the quoted sentence reports. PMID:21388311 on the DAG1 record went from HUMAN_CLINICAL to MODEL_ORGANISM: the 'in vivo' half of that sentence is the T190M knock-in mouse described earlier in the same paper, which is where the laminin-overlay and histology results come from. PMID:27807076 on the POGLUT1 record went from IN_VITRO to MODEL_ORGANISM: its 'in vivo' half is the transgenic Drosophila rescue in which human POGLUT1 D233E fails to rescue fly Poglut1 loss. Both explanations now record which model the grading refers to. ModifierEnum has no ALTERED value, so 'aberrant modulation' is recorded as ABNORMAL.

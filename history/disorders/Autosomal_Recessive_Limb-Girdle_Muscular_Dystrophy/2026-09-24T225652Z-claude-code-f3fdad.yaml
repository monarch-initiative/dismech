  summary: 'Genetics pass: seven LGMD-R gene subtypes added, LIMS2 dispositioned DISPUTED,
    CAPN3 and ANO5 wired'
  details: |
    Genetics pass for issue #12240 (d2g series-033). Seven gene-defined LGMD-R
    subtypes were added as has_subtypes rows, each with a bound MONDO subtype_term, a
    genes descriptor and a reciprocal genetic[].subtype foreign key: LGMD2P
    (MONDO:0013440, DAG1), POGLUT1-LGMD (MONDO:0014977, POGLUT1), LGMD2X
    (MONDO:0014782, POPDC1), LGMD R18 (MONDO:0014144, TRAPPC11), POMK-LGMD
    (MONDO:0014489, POMK), LGMD R26 (MONDO:0030014, POPDC3) and LGMD R27
    (MONDO:0030456, JAG2). The two rows the gap list names that already existed,
    LGMDR1 (CAPN3) and LGMDR12 (ANO5), gained the MONDO subtype_term they were
    missing (MONDO:0009675 and MONDO:0012652).

    Five new pathophysiology nodes give each new gene a mechanism rather than a
    shared flat one: Alpha-Dystroglycan Hypoglycosylation and Loss of Laminin Binding
    (DAG1, POMK), Notch Signalling Failure and Satellite Cell Depletion (POGLUT1,
    JAG2), POPDC cAMP-Effector Membrane Trafficking Defect (POPDC1, POPDC3), Golgi
    Trafficking Defect (TRAPPC11), and Calpain-3 Deficiency and Impaired Sarcomere
    Remodelling (CAPN3). ANO5 was added to the existing sarcolemmal node with its own
    evidence. Before this pass, CAPN3 and ANO5 were listed in genetic but reached no
    pathophysiology node, which is the gap the campaign measures.

    LIMS2 (MONDO:0014788, LGMD2W) is the one gap-list gene not curated as a subtype.
    ClinGen's Muscular Dystrophies and Myopathies Gene Curation Expert Panel disputed
    the relationship in November 2024: the 2015 sibling-pair report remains the only
    published one, none of its variants has functional support, contacting ClinVar
    submitters produced no further evidence, and a Lims2 knockout mouse had no
    apparent phenotype. It is recorded as a genetic entry with relationship_type
    DISPUTED, carrying both the original report and the ClinGen refutation, and is
    deliberately wired to no pathophysiology node and given no has_subtypes row. The
    disagreement with MONDO is stated in that record's notes rather than resolved.

    Evidence is abstract-level and exact throughout: PMID:21388311 (DAG1),
    PMID:24925318 (POMK), PMID:27807076 (POGLUT1), PMID:33861953 (JAG2),
    PMID:26642364 (POPDC1), PMID:31610034 (POPDC3), PMID:23830518 (TRAPPC11),
    PMID:25589244 (LIMS2), PMID:19793101 and PMID:23414389 (CAPN3), PMID:20096397
    (ANO5). ClinGen CGGV records are cited alongside for DAG1, POGLUT1, POPDC1 (under
    its previous symbol BVES), TRAPPC11, POPDC3, JAG2 and LIMS2.

    Two naming points are recorded in the entry. POPDC1 is bound with term.label BVES
    because the OBO HGNC build this repository validates against still carries the
    previous symbol, while a live HGNC REST query for HGNC:1152 returns the approved
    symbol POPDC1; preferred_term carries POPDC1. And MONDO's label for
    MONDO:0014977 reads "type 2R1", which matches neither the ENMC nor the OMIM
    designation for the POGLUT1 form, so that subtype row is named after the gene.

    Validation: just validate, just validate-terms, just count-verified-snippets and
    just check-genereviews clean under linkml-reference-validator 0.3.0rc1. The
    retired GeneReviews Limb-Girdle Muscular Dystrophy Overview (PMID:20301582) was
    already cited as evidence but untagged in references; just tag-references fixed
    that.

  summary: 'Create: Gonococcal_Arthritis'
  details: |
    Created gonococcal arthritis (MONDO:0041903), the articular arm of disseminated gonococcal infection, promoted out of the Gonorrhea entry per design decisions 3e. Folds in gonococcal synovitis/tenosynovitis (MONDO:0001720, deleted its stub) as the tendon-sheath arm of the same process; left gonococcal bursitis (MONDO:0001719) as a distinct uncurated concept. 8 pathophysiology nodes, 15 phenotypes (all causally connected), diagnosis (synovial PCR vs low culture yield, mucosal NAAT), ceftriaxone + joint drainage treatments, eculizumab/female-sex risk via environmental links. Deep research via claude_code. All 42 snippets verified.

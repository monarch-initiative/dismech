  summary: 'Create: Hereditary Spastic Paraplegia 7 (SPG7, paraplegin)'
  details: |
    Created a new entry for hereditary spastic paraplegia 7 (MONDO:0011803), curated alongside the new corticospinal_tract_axonopathy module. Five pathophysiology nodes, four conforming to that module across trigger, transport-amplifier, central effector and consequence. Curated deliberately as a mitochondrial disease as well as an HSP, matching MONDO's triple placement under mitochondrial oxidative phosphorylation disorder, hereditary spastic paraplegia and hereditary ataxia: isolated optic atrophy and pure spinocerebellar ataxia are recorded as recognized presentations of the same biallelic genotype rather than being omitted. Two epistemic distinctions are recorded explicitly. First, the subcellular sequence (mitochondrial transport failure, then degeneration beginning at the synaptic terminal) rests on the Drosophila SPG7 null and is tagged MODEL_ORGANISM, while the OXPHOS lesion has direct human muscle-biopsy support. Second, the monoallelic question is left open: GeneReviews calls dominant inheritance controversial, so only the recessive mode is curated and the dispute is recorded as a PARTIAL evidence item on the inheritance block rather than as a second inheritance entry. Validation run: linkml-validate reported no issues, linkml-term-validator passed, and just count-verified-snippets reported 27/27 evidence snippets verified against cached references. The corresponding stub was deleted.

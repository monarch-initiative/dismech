  summary: 'Review and enhance: Hereditary Spastic Paraplegia 7'
  details: |
    Added Harrison's, mechanistic (mitochondrial disease), and ICIMD (mitochondrial_protein_quality_control) classifications, Hungarian point prevalence (0.46 per 100,000; PMID:39978794), repaired retired PARTIAL support prose in inheritance and notes and added deep-intronic cryptic-splice inheritance review (PMID:41656397), added atomic skeletal/extraocular muscle myopathy (PMID:24466038), peripheral axonal sensorimotor neuropathy, and optic nerve axonal degeneration pathophysiology nodes and wired all 15 phenotypes (15/15 connected, including Progressive external ophthalmoplegia), added p.Ala510Val, p.Leu78Ter, and c.987+152G>A variants, muscle biopsy diagnosis, PEO with mtDNA deletions differential diagnosis (MONDO:0000090), physical therapy and symptomatic antispastic pharmacotherapy treatments (PMID:30723448), and Drosophila Spg7 CRISPR null animal model.

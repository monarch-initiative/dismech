  summary: Link the two predisposing contexts to the lesion node
  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the keratinizing squamous epithelium node, and both are graded identically because they are proposed to act by the same route, upper-airway mucosal disease being thought to matter through ventilation and shared mucosal inflammation. They point at the lesion itself because there is nowhere earlier to point: the classical sequence runs from Eustachian tube dysfunction through negative middle-ear pressure to a retraction pocket that becomes the sac, and this entry models the established lesion and its consequences without modelling that formation sequence. The cited sentence for the tube exposure names atelectasis, which is precisely the missing middle step, so the gap is in the graph rather than in the evidence. Both items are PARTIAL: one is hedged as may lead to, and the other is a case-control association reporting odds ratios of 1.5 to 2.5 between conditions rather than a route to the node. A first attempt at this change wrote every link into the file twice, producing duplicate influences_mechanisms mapping keys. The cause was an assumption that git checkout -B onto the same commit cleans the working tree, which it does not, so a re-run after a partial failure appended a second copy of each block. It was invisible because the generator verified its own output with a permissive YAML loader that silently keeps the last of a duplicated key, and because linkml-validate uses the same permissive loader; only CI's strict parse rejected it. The generator now re-reads with a loader that refuses duplicate keys, and the affected files were reset and regenerated from a clean base rather than hand-edited. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 84 of 84 verified.

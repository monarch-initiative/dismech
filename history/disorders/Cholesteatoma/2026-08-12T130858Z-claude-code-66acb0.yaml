  summary: Link the two predisposing contexts to the lesion node
  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the keratinizing squamous epithelium node, and both are graded identically because they are proposed to act by the same route, upper-airway mucosal disease being thought to matter through ventilation and shared mucosal inflammation. They point at the lesion itself because there is nowhere earlier to point: the classical sequence runs from Eustachian tube dysfunction through negative middle-ear pressure to a retraction pocket that becomes the sac, and this entry models the established lesion and its consequences without modelling that formation sequence. The cited sentence for the tube exposure names atelectasis, which is precisely the missing middle step, so the gap is in the graph rather than in the evidence. Both items are PARTIAL: one is hedged as may lead to, and the other is a case-control association reporting odds ratios of 1.5 to 2.5 between conditions rather than a route to the node. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 84 of 84 verified.

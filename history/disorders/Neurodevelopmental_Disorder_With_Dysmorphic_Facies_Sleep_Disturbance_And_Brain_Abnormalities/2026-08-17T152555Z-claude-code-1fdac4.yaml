  summary: 'Address PR #8722 re-review: rebind ID term, add 18 quotable phenotypes'
  details: |
    Addressed both blocking findings from the PR #8722 re-review, plus the two non-blocking suggestions.

    FINDING 1 (Severe intellectual disability overstated its snippet). Took the reviewer's recommended option (b): rebound the phenotype from HP:0010864 (Severe intellectual disability) to HP:0001249 (Intellectual disability) and kept supports: SUPPORT, so the ontology binding matches the evidence rather than annotating a mismatch. The quotable review sentence (PMID:40301961) names "cognitive impairment" with no severity qualifier, which is exactly what HP:0001249 asserts. The severity that does exist in the sources -- IQ 40 in the adult and IQ 20-30 in the nonverbal adolescent from the paywalled full text of PMID:32822602, and MedGen's "severely impaired intellectual development" -- is retained as prose in the phenotype description with an explicit statement of why it is not carried by the binding. Chose (b) over (a) because the entry already uses supports: PARTIAL for Language impairment, where the gap is that the review does not characterise the language profile at all; here the review does support an intellectual-disability claim, just not a severity band, so a correct narrower-to-parent rebinding is more accurate than flagging otherwise-good evidence as partial. The phenotype name and its pathograph edge were renamed in step.

    FINDING 2 (quotable phenotypes from the entry's own backbone reference uncurated). Added 18 phenotypes, all evidenced from the single PMID:40301961 KAT5 sentence already quoted elsewhere in the entry, all with exact-quote snippets, evidence_source HUMAN_CLINICAL, and no frequency. The eight the reviewer treated as blocking: Autistic behavior (HP:0000729), Hyperacusis (HP:0010780), Dysphagia (HP:0002015), Gastroesophageal reflux (HP:0002020), Brachydactyly (HP:0001156), Clinodactyly (HP:0030084), Myopia (HP:0000545), and Anterior pituitary hypoplasia (HP:0010627). Also took the reviewer's judgement-call dysmorphology set: Flat face (HP:0012368), Almond-shaped palpebral fissure (HP:0007874), Epicanthus (HP:0000286), Low-set ears (HP:0000369), Bulbous nose (HP:0000414), Downturned corners of mouth (HP:0002714), Thick lower lip vermilion (HP:0000179), High palate (HP:0000218), Single transverse palmar crease (HP:0000954), and Thin corpus callosum (HP:0033725).

    TERM CORRECTION. The review proposed HP:0010628 for "small anterior pituitary gland". OAK resolves HP:0010628 to "Facial palsy"; the correct term is HP:0010627 (Anterior pituitary hypoplasia), which is what was curated. Every one of the 18 new terms was verified with runoak against sqlite:obo:hp before binding.

    PATHOGRAPH. All 18 new phenotypes were wired to the mechanism layer, so all 47 phenotypes remain reachable from the pathograph with no dangling downstream targets. Facial, digital and sensory features hang off Craniofacial and Extra-CNS Congenital Malformation; thin corpus callosum and anterior pituitary hypoplasia off Cerebral and Cerebellar Structural Malformation; autistic behavior off Severe Neurodevelopmental Impairment and Epilepsy. Dysphagia and gastroesophageal reflux are typed INDIRECT_UNKNOWN_INTERMEDIATES because the relative contribution of palatal malformation versus central hypotonia is not resolved.

    SUGGESTION 3. target_mechanisms now declared on 4 of 6 treatments (was 1 of 6). Genetic Counseling and Multidisciplinary Supportive Care are deliberately left unlinked: the schema comment on target_mechanisms states that counselling, informational and umbrella interventions should not link to pathophysiology nodes.

    SUGGESTION 4. All four differential_diagnoses now carry disease_term MONDO bindings: Smith-Magenis MONDO:0008434, KAT6A syndrome MONDO:0014558, KAT6B-related MONDO:0036042, genetic developmental and epileptic encephalopathy MONDO:0100062. Each was gene-checked with OAK before binding, applying the same NEC discipline used for the focal entity; that check caught a near-miss, MONDO:0015022 (intellectual developmental disorder with dysmorphic facies and ptosis), whose label superficially fits the KAT6A differential but whose gene axiom is BRPF1, not KAT6A.

    CORRECTION TO THE EARLIER HISTORY RECORD IN THIS FOLDER. Its TREATMENT TERMS paragraph claimed NCIT was used "rather than the MAXO terms the CLAUDE.md prose still shows". That was wrong and has been corrected in place: MAXO was removed from dismech outright and every former MAXO treatment/diagnosis term was remapped to NCIT, so the NCIT bindings are simply current practice, not a workaround. The unbound sleep-assessment diagnosis also follows current guidance, which says to omit term: and keep a free-text preferred_term when NCIT has no suitable clinical-action term.

    VALIDATION. just validate (schema + terms + references) clean; validate-references 104/104 snippets verified (was 86/86); just validate-terms clean; check_snippet_length, check_title_snippets, check_empty_snippets, check_environmental_evidence, check-duplicate-keys and validate-history-all all clean. Rebased onto latest origin/main.

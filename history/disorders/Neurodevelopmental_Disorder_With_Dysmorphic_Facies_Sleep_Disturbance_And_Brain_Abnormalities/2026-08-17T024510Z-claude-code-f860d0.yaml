  summary: 'Create: NEDFASB (KAT5/TIP60 chromatinopathy)'
  details: |
    Created the dismech entry for neurodevelopmental disorder with dysmorphic facies, sleep disturbance, and brain abnormalities (NEDFASB; MONDO:0030852, OMIM:619103, KAT5/TIP60).

    NEC PREFLIGHT. This entity sits in the crowded OMIM "neurodevelopmental disorder with ..." series, so identity was confirmed before any deep-research content was used: `runoak -i sqlite:obo:mondo info MONDO:0030852 -O obo` returned xref OMIM:619103, synonym NEDFASB, and the gene axiom RO:0004003 HGNC:5275 KAT5 -- all three anchors matching the curation target. The Edison/falcon report additionally passed `just preflight-dr` against MONDO:0030852 (KAT5 mentioned 35x, by far the dominant gene; PER1 next at 5). Note that MIM 601409 seen in the literature is the KAT5 gene MIM number, not the phenotype MIM number.

    DEEP RESEARCH. One falcon/Edison run (research/Neurodevelopmental_Disorder_With_Dysmorphic_Facies_Sleep_Disturbance_And_Brain_Abnormalities-deep-research-falcon.md; 560s, 4 citations, 0% confabulation rate) used strictly as leads. Every PMID was re-fetched with `just fetch-reference` and every snippet independently re-verified as an exact substring of the cached abstract before use.

    QUOTABLE-SOURCE CONSTRAINT. The defining report (Humbert et al. 2020, PMID:32822602) is paywalled; PubMed Central holds metadata only, so the cache carries the abstract alone. Per-individual detail (exact HGVS variants, MRI descriptions, sleep-diary and salivary-melatonin data, clonidine response, growth-hormone treatment) is recorded in free-text notes rather than quoted, and phenotype-level claims are evidenced instead from the 2025 Hum Genomics review of histone-related disorders (PMID:40301961), whose dedicated KAT5 paragraph restates the clinical spectrum in quotable form. Frequencies are deliberately omitted throughout: with three reported individuals, n/3 counts cannot be mapped to FrequencyEnum bands with any confidence.

    PATHOGRAPH. Nine nodes, each biological_scale-tagged: de novo heterozygous KAT5 missense variant (MOLECULAR) -> impaired NuA4/TIP60 histone H4 acetyltransferase activity (MOLECULAR) -> chromatin-dependent dysregulation of developmental transcription (CELLULAR) and circadian transcriptional dysregulation with PER1 upregulation (MOLECULAR) -> impaired neural stem cell maintenance and neurogenesis (CELLULAR), impaired cranial neural crest expansion and craniofacial morphogenesis (TISSUE), sleep-wake disruption (ORGANISM) -> cerebral and cerebellar structural malformation (TISSUE) -> severe neurodevelopmental impairment and epilepsy, plus craniofacial and extra-CNS congenital malformation (ORGANISM).

    SLEEP EMPHASIS AND EPISTEMIC RESTRAINT. Sleep disturbance is curated as a first-class HP:0002360-bound phenotype (diagnostic: true) with three evidence items. The circadian mechanism is deliberately NOT asserted: it is modelled as an EMERGING mechanistic_hypotheses group (circadian_per1_sleep_model) whose causal edges are typed INDIRECT_UNKNOWN_INTERMEDIATES, plus a KNOWLEDGE_GAP discussion that weighs the circadian interpretation against the competing view that severe sleep disruption is nonspecific across chromatinopathies (Smith-Magenis, KAT6A, SETD1A, CHD8, KDM5B, SRCAP, SMARCC2 all list it), with five proposed experiments. Two further discussions record a HUMAN_MODEL_MISMATCH (mouse Kat5 conditional nulls versus the human heterozygous catalytically-dead-but-assembled missense allele) and the n=3 case-count gap.

    EVIDENCE DISCIPLINE. KAT5/TIP60 has a very large DNA-damage-response, HIV-Tat and cancer literature that is not disease evidence; mechanistic claims are restricted to patient-derived data (PMID:32822602) or work the citing authors explicitly tie back to KAT5 patients (PMID:37024457). evidence_source reflects the study type of the cited paper: whole-animal mouse and zebrafish work is MODEL_ORGANISM (PMID:36768434, PMID:31294688, PMID:25725064, and the mouse arms of PMID:37024457); cultured-cell and biochemical work is IN_VITRO (the patient-fibroblast RNA-seq and the purified-complex acetylation assay in PMID:32822602, and PMID:36417913); review and background statements are OTHER. The single HUMAN_CLINICAL item drawn from PMID:37024457 is the clause reporting orofacial clefting in KAT5 patients, deliberately split out from that paper's mouse findings so each evidence item carries exactly one source type. The KAT5 DNA-repair angle is quarantined in an explicitly EMERGING ddr_contribution_model hypothesis rather than being asserted as disease mechanism.

    TREATMENT TERMS. TreatmentActionTerm on current main is bound to NCIT:C25218 only, so treatment_term and diagnosis_term use NCIT (C64172 Anticonvulsant Therapy, C15184 Behavioral Intervention, C15302 Physical Therapy, C159273 Speech Language Therapy, C15240 Genetic Counseling, C15747 Supportive Care) which is simply current practice: MAXO was removed from dismech and every former MAXO treatment/diagnosis term was remapped to its NCIT equivalent. Per that same guidance, the sleep-assessment diagnosis entry carries no term binding because NCIT has no suitable clinical-action term for it. Also added the GEO dataset geo:GSE154199 (accession, title, organism and sample count verified against NCBI E-utilities; the GEO record links to PMID:32822602), two experimental_models, two animal_models, and four differential diagnoses.

    VALIDATION. `just validate` (schema + terms + references) passes; validate-references reports 85/85 snippets verified against cached references; `just validate-terms` passes. No GeneReviews chapter exists for KAT5 (a PubMed search for "KAT5 GeneReviews[All Fields]" returned zero results), so there is no GeneReviews phenotype baseline to cross-reference. Rebased onto origin/main before push.

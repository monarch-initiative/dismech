  summary: Calibrate vertebral flow and intervention scope
  details: |
    Addressed three important and two advisory findings from the independent full semantic audit of exact PR head 50d17a442ab27f148e5fb113a9fb2f2636499e11. Qualified vertebral-stenosis hemodynamic claims to residual lumen, bilateral or tandem disease, contralateral anatomy, and collateral reserve; removed the basilar-specific percentage-stenosis threshold and correlation from vertebral claims; and calibrated the hypoperfusion edge as indirect and partial. Split atherosclerotic vertebral stenosis from occlusion so stenting targets stenosis only, while microsurgical revascularization retains a separately evidenced proximal occlusion target. Narrowed the entry summary so hypoplasia requires superimposed stenosis or limited collateral reserve. Regrounded vertebral risk-factor links in PMID:35301953, removed unsupported cohort-enrichment language, and marked aggregate risk-factor-link directness UNKNOWN because the environmental-link schema has no structured intermediate slot and the evidence does not establish a uniform sequence. No reference cache was created or edited.

  summary: 'Review: Vertebral Artery Insufficiency evidence and causal model'
  details: |
    Evidence and causal-model review of the existing entry.

    Reference identity
    - Replaced DOI:10.2174/1573403x18666220317093131 with PMID:35301953 at all five
      citation sites (references block, Posterior circulation ischemia node, Ischemic
      stroke phenotype, and both stenting evidence slots). DOI: is on the
      reference_validator skip_prefixes list, so those snippets were previously never
      snippet-checked; as PMIDs they now are. Verified the swap targets the same paper:
      the newly fetched references_cache/PMID_35301953.md carries
      doi: 10.2174/1573403X18666220317093131.
    - PMID_35301953.md is the only reference-cache file added, fetched with
      `just fetch-reference`. No cache file was hand-written or hand-edited.

    Causal model
    - Added causal_link_type: DIRECT plus per-edge evidence to the five previously bare
      downstream edges (stenosis to hypoperfusion, stenosis to thromboembolism,
      hypoperfusion to ischemia, thromboembolism to ischemia, dissection/trauma to
      ischemia). Edge evidence is quoted separately from node evidence because the edge
      asserts a transition, not the endpoint.
    - Added two mechanism nodes the entry's own description already presupposed but did
      not model: "Extrinsic bony compression of the vertebral artery" (PMID:36127977)
      and "Vertebral artery hypoplasia and inadequate collateral reserve"
      (PMID:12870261, PMID:40951011, PMID:25977279). Collateral reserve is modeled as a
      separate modifying substrate rather than folded into the stenosis node because
      VERiTAS reports distal flow status is not predicted by stenosis severity or
      location.
    - Tagged all seven pathophysiology nodes biological_scale: TISSUE. Previously only
      the two nodes added by this review carried the tag; the five pre-existing nodes
      did not, which would have left the entry internally inconsistent.
    - Connected all ten curated phenotypes to the pathograph with evidence-bearing
      downstream edges: abnormal vertebral-artery morphology from the stenosis node;
      vertigo, TIA, ataxia, diplopia, dysarthria, dysphagia, and ischemic stroke from
      posterior-circulation ischemia; and headache and neck pain from dissection. This
      resolves the ten local_phenotype_unlinked_to_pathograph findings reported by
      `just d2p-audit Vertebral_Artery_Insufficiency`.

    Claim-evidence audit
    - PMID:37924280 node snippet was a statement of the paper's aim ("Identify the
      incidence, mechanism of injury, ..."), which named the topic without evidencing
      the claim. Replaced with the result ("VAI in cervical spine trauma has an
      approximate posterior circulation stroke risk of 9%.").
    - The bony-compression node description asserted it was "the substrate underlying
      dynamic and rotational compression presentations". PMID:36127977 does not
      characterize position-dependent or rotational compression, so that clause was
      removed and the description now states explicitly that no dynamic-compression
      claim is asserted.
    - The hypoplasia downstream edge rested only on an independence argument (collateral
      capacity not predicted by stenosis). Added the PMID:25977279 statement that "the
      same % stenosis leads to a markedly smaller residual diameter in a hypoplastic 2 mm
      vertebral compared to a dominant 5 mm VA", which states the edge's hypoplasia arm
      directly.
    - The stenting treatment gained target_mechanisms evidence during this review but
      the microsurgical revascularization link did not. Added PMID:39673653 (post-op
      patent vertebral and supplying arteries) and PMID:37483445 (high rate of
      post-operative vascular recirculation) so both treatment links carry the readout
      behind their restored-inflow claim.
    - Case-level evidence is marked supports: PARTIAL throughout (PMID:12870261,
      PMID:40951011), and the stenting evidence retains PARTIAL so the unresolved
      stenting-versus-medical-therapy outcome question is not overstated.

    Known validator limitation
    - Seven evidence occurrences still cite DOI:10.1186/s41983-024-00893-x (vertebral
      artery dissection narrative review) and are reported as "skipped by prefix". The
      five unique snippets used by those occurrences were checked against the
      publisher's open-access article and match exactly, but the automated snippet count
      cannot credit them because DOI is on the reference-validator skip-prefix list. The
      article has no PMID to substitute.

    Validation
    - just validate: schema and term validation passed.
    - just validate-disorders (the batched, --no-full-text sweep CI runs): schema, term,
      and reference validation all passed; "Snippets checked: 60/67 verified against
      cached references (7 skipped by prefix)".
    - Targeted causal-graph validation passed, and the D2P audit reports 0 phenotype-
      completeness issues. The repository-wide graph validator was also run; it reports
      pre-existing integrity issues in 74 other disorders and none in this entry.
    - just validate-history-all passed for 4,596 records; reference-cache and term-cache
      structural contract checks passed; dataset verification found no accessions.
    - just check-reference-cache-frontmatter: OK (the single advisory concerns
      PMID_1899320.md, which this PR does not touch).
    - Validator-generated churn in the ten pre-existing reference caches (reference_id
      re-quoting, full_text_attempted flags, newly downloaded full text) was reverted
      with `git restore references_cache/`, and the 60/67 snippet count was re-confirmed
      against the restored caches, so no snippet in this entry depends on full text
      fetched during this session.

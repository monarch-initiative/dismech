  summary: 'Create: IDDSADF (CNOT3)'
  details: |
    New entry for intellectual developmental disorder with speech delay, autism, and dysmorphic facies (MONDO:0032864; OMIM 618672; CNOT3). Entry type DISEASE: one causal gene, no MONDO descendants. Deep research: one openscientist report; 9/9 references resolved; 9/10 quotes valid (the unsupported quote for PMID:31474762 joined two sentences from the abstract with an ellipsis; the entry quotes the full-text sentence instead); needs_review was set; just preflight-dr PASS (CNOT3 mentioned 74 times). The report said no neural Cnot3 model exists; a PubMed search found the cortical conditional knockout (PMID:39913536), which supports the neurogenesis node and the HUMAN_MODEL_MISMATCH discussion (heterozygous mice have normal brain size). The report's suggested NCIT treatment codes were mislabelled (NCIT:C15381 is Quality Assurance, NCIT:C15349 is Nutrition Research, Water) and were not used; speech therapy is bound to NCIT:C159273 from the term cache. Not used from the report: non-neural Cnot3 models (beta cell, liver, heart, ILC2; PMID:32859966, PMID:31630801, PMID:29526923, PMID:42118148) and the senescence study (PMID:39823890), because they do not bear on this disorder's mechanism. Phenotype frequencies come from the 51-patient cohort (PMID:40562808). ClinGen classifies CNOT3 only for the broader complex neurodevelopmental disorder (MONDO:0100038), so no gene_disease_validity assertion was recorded. Validation: just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs pass.

  summary: 'Review round 1: IDDSADF (CNOT3)'
  details: |
    Addressed the first automated review of PR 14945. Added reference_title to every evidence item from the references_cache title frontmatter. Moyamoya: the 51-patient cohort (PMID:40562808) did not confirm the association and notes most moyamoya-associated CNOT3 variants were in people without a neurodevelopmental disorder; added that as a REFUTE item, the cohort's no-angiography caveat as SUPPORT, and rewrote the description so moyamoya is not presented as an established feature. Added 15 cohort phenotypes from PMID:40562808 with frequencies (nasal features, protruding ears, smooth philtrum, deep-set eyes, fine motor delay, refractive error, intrauterine growth retardation, premature birth, inguinal hernia, sleep disturbance, anxiety) and the cohort frequency for corpus callosum hypoplasia. Added parental gonosomal mosaicism and recurrence risk to inheritance, the p.(Arg188His) possible gain-of-function caveat to genetic notes, and a diagnosis entry for exome sequencing (NCIT:C101295). CI gene activity grounding: bound GO:0030674 protein-macromolecule adaptor activity on the CNOT3 node, supported by PMID:27746116 (CNOT3 C terminus required for binding the complex) and PMID:39913536 (Cnot3 loss lowers the CNOT1 scaffold); the only GO molecular function annotation for CNOT3 in QuickGO is protein binding. creation_date corrected from a placeholder.

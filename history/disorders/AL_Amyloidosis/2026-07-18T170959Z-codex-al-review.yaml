  summary: Comprehensive scientific and evidentiary review of systemic AL amyloidosis
  details: |
    Corrected the entry boundary from broad AL amyloidosis (which includes
    localized disease) to systemic AL amyloidosis, MONDO:0017816. Rebuilt the
    causal graph around the amyloidogenesis module and separated canonical
    extracellular fibril deposition from superimposed soluble-light-chain
    cardiotoxicity. Connected organ-specific cardiac, renal, neurologic,
    gastrointestinal, soft-tissue, vascular, and constitutional manifestations
    with evidence on every causal edge; weak observational associations are
    explicitly marked PARTIAL or modeled with indirect edges.

    Reworked diagnostic content into monoclonal-protein screening, surrogate
    biopsy, Congo red tissue confirmation, mass-spectrometric amyloid typing,
    and clone/organ assessment. Added Congo red-positive amyloid histopathology,
    Mayo 2012 and renal staging, structured dFLC/NT-proBNP/troponin readouts,
    and mechanism-linked treatment records for D-VCd, selected-patient
    melphalan/autologous transplantation, supportive care, and investigational
    venetoclax for relapsed t(11;14)-positive disease.

    Updated the phase III trial set through 2026-07-18: ANDROMEDA completed;
    CAEL-101 stage IIIa and IIIb active but not recruiting; the D-VCd transplant
    comparison recruiting; and AFFIRM-AL terminated after missing its primary
    endpoint. Replaced historical absolute early-mortality and irreversible
    organ-damage language with response-aware statements. Cataloged every active
    reference and validated all quoted excerpts against generated reference
    caches without hand-editing cache files.

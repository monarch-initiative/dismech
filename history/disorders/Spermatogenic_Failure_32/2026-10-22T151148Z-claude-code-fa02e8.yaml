  details: |
    Created the SOHLH1 spermatogenic failure 32 entry (MONDO:0020855, claim #15201). Deep research: one Perplexity sonar-deep-research report run with reasoning_effort=low, because two medium-effort runs were cut off after about 300 seconds (server disconnected without a response). The run was anchored on SOHLH1 through a skeleton genetic row because the stub carries the gene only in source_tags. Its reference validation resolved 18 of 18 identifiers, but one cited PMID (29240260) is a glioblastoma paper and was not used, and its Sertoli-cell-only claim traces to OMIM and no cached text, so it was not encoded. References fetched and quoted directly: PMID:20506135, 28718531, 34448846, 39950040, 39625557 (human), PMID:16564520, 22056784, 22328502 (mouse and in vitro). Inheritance is recorded as autosomal recessive, with a separate contested autosomal dominant block that carries a REFUTE item from the 2022 homozygous-case paper. The chain runs from SOHLH1 loss of function to reduced KIT activation, failed spermatogonial differentiation, germ-cell depletion, and the semen phenotypes. The molecular-function binding (GO:0000981) is SOHLH1's QuickGO annotation (ISA). Validation: just validate passed, count-verified-snippets 36/36, validate-terms passed, the entity-ref, causal-target, offline snippet, enum, duplicate-key, coarse-phenotype, qualifier, gene-activity-grounding, node-class and knowledge-gap gates passed, and check-genereviews --online reports NO_CHAPTER.

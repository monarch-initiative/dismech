  summary: 'Review: Atrial Standstill evidence and disease boundary'
  details: |
    Re-reviewed the primary/isolated MONDO:0015281 and ORPHA:1344 disease boundary, mechanism, clinical evidence, management, and current trial landscape. Retained SCN5A and MYL4 as causative genes and GJA5 only as a modifier/family-specific digenic contributor; moved EMD, LMNA, NPPA, RYR2, TAF1A, HCN4, acquired triggers, and the CAV3 VUS out of the primary genetic model and into explicit boundary/differential notes. Added human-supported SCN5A excitability and MYL4 atrial-cardiomyopathy branches, a model-only MYL4 autophagy/fibrosis hypothesis, inheritance modes, diagnostic distinctions, and the 20-patient multicenter pediatric cohort for arrhythmia, device, and thromboembolism estimates. Management recommendations remain observational: no randomized disease-specific treatment evidence was found. A 2026-07-20 ClinicalTrials.gov audit found no study explicitly enrolling atrial standstill; NCT06166277 was excluded because atrial standstill appeared only as derived MeSH indexing for a registry enrolling other rhythm conditions. Explicit uncertainties record cohort selection, severe biallelic SCN5A overlap, modifier evidence, and rat-to-human MYL4 translation. Schema, scoped term/reference validation, causal-graph integrity, CX2, and KGX exports pass; phenotype-connectivity QC reports three intentional non-causal/overlap phenotypes rather than graph-integrity failures.

  summary: 'Create: Cardiac Valvular Defect, Developmental (PLD1)'
  details: |
    Created the entry for MONDO:0008913 (OMIM 212093), the autosomal recessive PLD1 congenital heart disease, claimed via issue #15968.

    Lump/split: curated as a separate Disease rather than a has_subtypes row on Congenital_Heart_Disease, which carries PLD1 only as one causal gene among many wired to a shared endocardial-cushion node. MONDO:0008913 appears nowhere else in kb/. Precedent followed is Congenital_Heart_Defects_Multiple_Types_2 (TAB2), a gene-defined entry sitting alongside the broad clinical one.

    Two MONDO classes denote this entity and neither is an ancestor of the other: MONDO:0008913 (OMIM-anchored, phenotype-named) and MONDO:1010144 (ClinGen gene-centric). Both are recorded in mappings.mondo_mappings as skos:exactMatch. The justification is external rather than inferred: ClinGen's Congenital Heart Disease GCEP record states it lumped cardiac valvular dysplasia 1 and congenital heart disease into one entity after finding no difference in mechanism, inheritance or phenotypic variability. That mapping is also what makes the Definitive ClinGen assertion (whose MONDO term is MONDO:1010144) attributable to this entry under the gene-disease-validity rule.

    Deep research: falcon was attempted first, as the default. It failed with 'Failed to authenticate' from the FutureHouse/Edison JWT endpoint despite EDISON_API_KEY being set. The recorded-fallback path was tried twice (--fallback, then --fallback with explicit --fallback-provider claude_code and openscientist) and does not recover this failure mode, because the auth exception escapes provider construction before the fallback chain engages, so no report with fell_back provenance could be produced. openscientist was then run directly and produced research/Cardiac_Valvular_Defect_Developmental-deep-research-openscientist.md. The substitution is therefore recorded here rather than in the report's frontmatter.

    Report validation: 21/21 references resolved, confabulation_rate 0.0, 14/14 quoted claims found in source, 0 off topic (11 of 21 scored on topic; the rest undecided, not off topic). term_validation carries needs_review: true for 5 mislabelled terms, inspected and all benign - the 'reported label' in each case is a table column header the extractor picked up ('Clinical sign', 'Outcome'), not a term name the report asserts, and none of those CURIEs is bound here. 2 unverifiable are OMIM, an unresolvable prefix.

    Named Entity Confusion: just preflight-dr passes (exit 0) with one WARN naming 'PA' as a second gene at 30 mentions. Inspected: PA is the report's abbreviation for phosphatidic acid, the lipid second messenger central to the mechanism, not a gene and not a second disease. OMIM agrees on both sides (MONDO 212093, report 212093) and PLD1 is mentioned 71 times with no competing causal gene (ADAMTS19, FLNA, GDF1, RPL3L all zero). Run without the local HGNC build, so the lexicon was heuristic.

    GeneReviews: no chapter exists. just check-genereviews --online returns NO_CHAPTER against the committed Bookshelf index (snapshot 2026-09-10) and a live PubMed genereviews[book] title search, run after the five synonyms were added so the check was not matching on name alone. Recorded in the entry's notes. Phenotype frequencies therefore come from the delineating cohort's own counts out of 28 phenotyped patients.

    Mechanism is built as a chain, not a list: PLD1 loss of function -> depleted phosphatidic acid -> (attenuated TGF-beta/hedgehog signalling) -> impaired cardiac endothelial-to-mesenchymal transition -> deficient endocardial cushion remodelling -> right-sided valve dysplasia, with right ventricular/pulmonary arterial hypoplasia downstream of the valve lesion. Myocardial Dysfunction is drawn as a parallel consequence of the gene defect, not a sequela of the valve lesion, because the delineating cohort reports isolated neonatal cardiomyopathy without a structural defect. Fetal Cardiac Decompensation captures the hydrops/intrauterine-death end of the spectrum.

    The apoptosis account from the original chick expression work is recorded as a mechanistic_hypotheses entry (status EMERGING) rather than as a node, because the main chain's route has a direct perturbation experiment behind it and the apoptosis route has only a correlation between an expression pattern and a known developmental process.

    Terms: three CURIEs were corrected against the source during curation rather than trusted. GO:0004630 is labelled 'D-type glycerophospholipase activity', not 'phospholipase D activity'. HANCESTRO:0017 is 'Oceanian ancestry'; the Ashkenazi Jewish term is HANCESTRO:0324 'Ashkenazi Jew'. NCIT:C101295 is Whole Exome Sequencing. The CGGV reference_title was also replaced with the cached title verbatim after a composed one failed the title check.

    References: 12 cited, all cached. Seven found by PubMed search before the report landed (including Ta-Shma 2017, PMID:27799408, the original two-family report that the report and ClinGen both treat as founding); three added from the report's own citations where they strengthened the chain (PMID:32198492 PLD1 crystal structure, PMID:42600378 cushion EndMT review, PMID:41173720 phosphatidic acid review). The two review-derived items carry quote_role: REVIEW_SYNTHESIS. PMID:39681445 is quoted in Chinese - it has no English abstract in PubMed and the quoted substring is the variant designation itself.

    datasets: deliberately absent. just discover-datasets returns three candidates, all GENE_ONLY PLD1 oncology studies (bladder and colon cancer); all rejected on relevance and the triage recorded in the entry's notes.

    Validation: just validate passes - schema, terms, and 65/65 snippets with 68 titles checked. Per-file gates pass (check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system). Whole-tree gates pass (check-folded-hyphens, check-title-snippets, check-reference-titles, check-retired-support-prose, check-shared-disease-terms, check-environmental-evidence, and check-snippet-grading, which CI skips on a kb-only PR). Compliance 89.0%. The residual gaps are the definitional node-to-phenotype causal edges, left uncited rather than given the parent node's citation.

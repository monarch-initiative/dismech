  summary: 'Review round 1: evidence regrading, pathograph wiring, phenotype additions'
  details: |
    Adversarial pre-PR review round, run by a subagent against the dismech-pr-review skill with fresh context. Every finding below was independently re-verified against the cached references before acting; the quotes are all exact substrings of files already in this branch.

    Three claim/evidence defects fixed.

    1. The Tricuspid atresia phenotype cited PMID:33645542, but that paper's only mention of tricuspid atresia is its screening inclusion criterion, which attributes the lesion to no patient. An ascertainment criterion for an unselected 75-patient screen is NO_EVIDENCE for the phenotype of the biallelic patients it found, not SUPPORT. Re-cited to PMID:42591229's patient table, which documents it in a named patient.

    2. The Pld1 knockout link was graded RECAPITULATES against a structural node while PMID:33645542 states 'Although no overt structural cardiac defects were noted, mice lacking PLD1 displayed impaired function of the pulmonary and tricuspid valves on echocardiography' and calls the human-versus-mouse severity difference unexplained. PMID:27799408's histology does describe narrowed, thickened pulmonic leaflets, so the two sources genuinely conflict - which is PARTIALLY_RECAPITULATES, not RECAPITULATES. Downgraded, fidelity LOW, the contradicting sentence added as a REFUTE item, and two typed divergences added (BOUNDARY_OMISSION for the absent structural lesion, SPECIES_MISMATCH for the unexplained severity gap). Note INCOMPLETE_PHENOTYPE is not in ModelDivergenceTypeEnum despite CLAUDE.md naming it as a likely future value; BOUNDARY_OMISSION is the correct existing value.

    3. Two TGF-beta/hedgehog items were graded HUMAN_CLINICAL. Nothing about either pathway was measured in that study: the source paragraph is assembled from other papers and hedged throughout ('could', 'suggesting', 'may', 'might'). Regraded OTHER with quote_role BACKGROUND, the #10262 pattern.

    Pathograph. It was three disconnected components - Myocardial Dysfunction and Fetal Cardiac Decompensation had no incoming edge while the prose asserted myocardial dysfunction was a consequence of the gene defect. Added Depleted Phosphatidic Acid Signalling -> Myocardial Dysfunction (INDIRECT_UNKNOWN_INTERMEDIATES, cited to the paper's own statement that how one lesion yields either outcome is unknown) and Myocardial Dysfunction -> Fetal Cardiac Decompensation. Now one component with a single root, and all 17 phenotypes causally connected.

    Grading parity. The entry demoted the apoptosis route to mechanistic_hypotheses for resting on a correlation, while the TGF-beta/hedgehog nodes rested on less and were drawn as main chain with an edge typed DIRECT. Added a pld1_tgfb_shh_route hypothesis group (status EMERGING), opted both edges into it, retyped the incoming edge INDIRECT_UNKNOWN_INTERMEDIATES, and gave the previously uncited Attenuated -> EndMT edge its evidence and INDIRECT_KNOWN_INTERMEDIATES.

    Module conformance. Myocardial Dysfunction now declares conforms_to cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult, prompted by the second-opinion comment on #15968. Checked first that no module covers valvulogenesis or endocardial-cushion EndMT: a grep for endocardial/valvulogenesis/EndMT/the three relevant GO terms across all 220 modules returns nothing, so no conformance exists for the main chain. Substituted muscle contraction only, not the module's sarcomere organization, since PLD1 is not a sarcomere protein; the module's downstream neurohormonal cascade is deliberately not reproduced because no source establishes it in this disease.

    Six phenotypes added, each documented in a reference already in this branch: Pulmonic stenosis (HP:0001642), Cardiomyopathy (HP:0001638, carried separately from the dilated form), Ventricular septal defect (HP:0001629), Atrial septal defect (HP:0001631), Single ventricle (HP:0001750). Septal defects matter because the entry's own cited premise says failed cushion morphogenesis produces septal as well as valvular abnormalities. All four new unwired nodes were then given causal edges.

    Stillbirth was proposed and rejected: HP:0003826 sits under Clinical modifier and Mortality/Aging, not under Phenotypic abnormality, so it is outside the PhenotypeTerm dynamic enum and linkml-term-validator rejects it. The intrauterine-death fact is carried on the Fetal Cardiac Decompensation node and in progression instead, and the reason is recorded in the node description. A reminder that label-cache presence is not enum membership.

    Dilated cardiomyopathy was graded DIRECT off a quote saying only 'cardiomyopathy'; the cohort's two cases were systolic dysfunction with mitral regurgitation and a histiocytoid presentation, neither characterised as dilated. Regraded INDIRECT with the reason stated, and the undifferentiated presentation moved to the new Cardiomyopathy phenotype.

    Two snippets were exact but truncated mid-word, hiding their own denominator ('ents had dilated left ventricles'). Replaced with the full sentence, which begins 'Two patients had' - so the OCCASIONAL band on Mitral regurgitation is now checkable from the quote. A bare noun phrase on PMID:41173720 was likewise widened to its containing clause.

    A negative claim in a discussion rationale was refuted by this branch's own cache: 'the aortic valve is essentially spared' against a reported case of aortic atresia, and 'two candidate explanations exist' while the delineating cohort proposes a third in the paragraph the rationale quotes from - that the two sides of the heart differ in cell populations, matrix and haemodynamics. Softened to 'aortic involvement is reported once' and the third hypothesis added with its quote.

    Treatments: bound NCIT:C99546 Cardiac Valve Procedure in place of the generic NCIT:C15329 (verified C25218-reachable), evidenced the previously unsupported staged-palliation claim, and split heart transplantation into its own treatment with the documented 45-day transplant rather than leaving transplantation asserted with no evidence.

    Added a progression block (fetal / neonatal / childhood-and-adult), and cited the third ClinGen-scored publication PMID:38171566 plus PMID:36923242 as variant records - the entry leaned on the Definitive assertion while skipping part of the proband evidence behind it. Added a second prevalence evidence item giving the same 1-in-2500 figure from a population allele frequency rather than from the ascertained cohort. Chick model fidelity MODERATE -> UNKNOWN, since it produces no phenotype.

    Recorded on the MONDO:1010144 mapping that MONDO's placement of 0008913 under cardiac valvular defect does not cover the isolated-cardiomyopathy arm, so on MONDO's own axes 1010144 is the broader class and the exact match asserts a merge MONDO has not made. Predicate kept, disagreement now stated rather than silent.

    Nine reference caches fetched by the research run but cited by nothing in the entry were pruned, after re-deriving the cited-PMID list from the final file rather than from an earlier list.

    Validation after the round: schema, terms, 87/87 snippets, 90 titles, 0 issues; validate-disorders passes; the per-file and whole-tree check-* gates pass including check-snippet-grading; compliance 90.4%; pathograph one component with one root; 17/17 phenotypes connected.

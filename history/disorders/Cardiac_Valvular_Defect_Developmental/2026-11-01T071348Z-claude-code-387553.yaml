  summary: 'Review round 2: resolve the mitral regurgitation contradiction, take four
    optional suggestions'
  details: |
    Review round 2, answering the approving review on PR #16258. All five of its
    suggestions were marked optional, and an optional finding does not normally justify
    a push, because a push dismisses the approval and costs a re-review cycle. One of
    them was a defect this branch's own commits introduced, which is the exception, so
    the push happened and the other four were carried in it rather than deferred.

    The defect: the Mitral regurgitation phenotype contradicted itself. Its description
    attributed the regurgitation to the inflow cushions, which is a structural claim,
    while the only causal edge into it came from Myocardial Dysfunction and described
    functional regurgitation on a dilated annulus. Two mechanisms, asserted together and
    reconciled nowhere, both written here - the description in the first commit and the
    edge in review round 1. Checked against the source before acting: the cited sentence
    reports that two patients had dilated left ventricles and mitral regurgitation,
    which supports co-occurrence and neither mechanism specifically. The description now
    states that the mechanism is unresolved, says the graph draws only the functional
    route because that is the one the cohort reports, and records that a cushion-derived
    component is not excluded but is not drawn because no source attributes this
    cohort's mitral regurgitation to a developmental valve lesion. No cushion edge was
    added: an edge asserts causation, and the only support for the structural reading is
    a hedged introduction sentence that also miscategorises the mitral valve as right-
    sided.

    The PMID:41173720 evidence item was dropped rather than requoted. The reviewer read
    its snippet as a what-this-review-covers lead-in rather than a finding, which is
    right, and the abstract contains no other sentence mentioning PLD1 - checked - so
    there was nothing better to quote. The node's claim is already carried by the
    founding paper's enzymology on the upstream edge. That left the reference cited
    nowhere, so its cache file was pruned after re-deriving the cited-PMID list from the
    final file.

    Added the siRNA arm of the EndMT experiment to the Depleted Phosphatidic Acid
    Signalling -> Impaired Cardiac EndMT edge. It matters independently of the
    pharmacological arm already cited: knocking the transcript down in chick
    atrioventricular cushion explants reproduces the small-molecule result, so the
    effect is not an off-target property of those compounds. This is the central edge of
    the entry, and it now rests on a genetic and a pharmacological demonstration rather
    than on inhibitors alone.

    The chick model's model-level evidence quoted the methods sentence listing all three
    of the original report's systems - yeast, chick and mouse - which does not
    distinguish this model from the knockout. Replaced with the chick result sentence.
    The readout quotes the same sentence for the measurement itself; the two evidence
    layers make different claims, and the cache holds only two chick sentences, so the
    overlap is deliberate and the explanations say which claim each one carries.

    Added a carrier-screening diagnosis row bound to NCIT:C62694 Mutation Carrier
    Screening. The suggestion was conditional on a quotable source existing, and one
    does: the delineating cohort proposes carriership testing for population-based
    preconception and prenatal screening among descendants of Ashkenazi Jews. The row
    says in its own description that this is a proposal and not a practice - no
    guideline, panel inclusion or programme is cited - and the evidence item is graded
    INDIRECT because the sentence recommends a use rather than reporting a programme or
    its yield.

    Validation after the round: schema, terms and 89/89 snippets with 92 titles;
    validate-disorders passes; the per-file gates pass, including check-logical-rules;
    check-snippet-length, check-snippet-grading, check-title-snippets, check-reference-
    titles, check-retired-support-prose, check-folded-hyphens and check-folded-yaml pass
    whole-tree; 17/17 phenotypes causally connected. Also ran check-conformance-content,
    new since round 1, on the module conformance link: it shares a GO term with the
    module node and reports no cell_type_absent or edges_absent finding.

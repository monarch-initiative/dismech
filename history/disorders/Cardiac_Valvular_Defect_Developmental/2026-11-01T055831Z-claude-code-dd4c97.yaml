  summary: 'Rebase onto main: rename to the gene dyad, widen five thin snippets'
  details: |
    Rebased the branch onto a fresh origin/main (156 commits of drift) and fixed what
    the newer gates and guidance surfaced. The entry had not merged, and MONDO:0008913
    was still uncurated on the new main, so this is not a duplicate of anyone else's
    work.

    Rebase conflicts were two additive term-cache rows and were resolved as a union:
    main had added HANCESTRO:0321 Finnish, this branch adds HANCESTRO:0324 Ashkenazi
    Jew, and both survive in canonical order. The post-rebase diff against origin/main
    is this entry, its history, its references and research artifacts, the stub
    deletion, and ten additive cache rows - no deletions and no unrelated churn.

    Renamed the entry from "Cardiac Valvular Defect, Developmental" to "PLD1-Related
    Congenital Heart Disease", under the entry-naming skill and design decisions 18,
    which did not exist when the entry was written. The old name was the MONDO label of
    the bound term and it fails the scope test: a developmental cardiac valvular defect
    occurs without PLD1, since the X-linked FLNA form and the ADAMTS19 form are two of
    the other genetically defined cardiac valvular dysplasias and most developmental
    valve disease is neither, and the broad condition is already curated as
    Congenital_Heart_Disease. The entry is about PLD1, so the fix is a rename and not a
    rebind.

    The dyad is established rather than coined: "PLD1-related congenital heart disease"
    is the label of MONDO:1010144, which this entry already maps skos:exactMatch, and is
    the disease name in the ClinGen Congenital Heart Disease GCEP assertion the entry
    records under gene_disease_validity. MONDO:0008913 itself carries no gene-related
    synonym and no ClinGen-attributed one - checked in OLS, its only synonym is CVDD -
    and no GeneReviews chapter exists, so the dyad came from the ClinGen-preferred label
    rather than from the bound term.

    The rename also fixes a scope mismatch the first round only documented: neither
    "cardiac valvular defect" nor "cardiac valvular dysplasia 1" covers the isolated
    neonatal cardiomyopathy arm, which the delineating cohort reports with no structural
    valve defect. The MONDO label, CVDD, CVDD1, CVDP1 and "cardiac valvular dysplasia 1"
    are all kept in synonyms, and the description now says why the entry is not named
    after the term it binds. The file slug is unchanged, per the skill, because
    dismech#15894 has not settled how slugs follow a rename; nothing referenced the old
    name - no disease# anchors in the entry and no cross-file references to it.

    Five snippets were widened. The snippet-length gate has tightened since the first
    round and now fails rather than grandfathers when checking against a ref, and it
    failed this file on two fragments on the Single ventricle phenotype: "left
    ventricular-type single ventricle" at four words and "single left ventricle" at
    three. Both are the defect the current guidance describes - a fragment that verifies
    and supports nothing on its own - so each was replaced with the sentence or patient
    row that carries it. Three more that passed the five-word floor but were noun
    phrases rather than propositions were widened in the same pass: the septal-defect
    phrase on PMID:39553471, the "3 medium VSDs, large ASD" table fragment on both
    septal phenotypes, and the chick-embryo methods fragment on PMID:27799408. Each
    replacement was checked against linkml-reference-validator's own normalizer before
    being written, not by eye.

    Validation after the round, against the new main: schema, terms and 88/88 snippets
    with 91 titles; validate-disorders passes; the per-file gates pass, including check-
    logical-rules, which is new since the first round and has no finding on the
    endothelial-to-mesenchymal-transition node; check-snippet-length, check-snippet-
    grading, check-title-snippets, check-reference-titles, check-retired-support-prose,
    check-shared-disease-terms, check-environmental-evidence, check-folded-hyphens and
    check-folded-yaml all pass whole-tree; the five unique-name and naming tests in
    tests/test_data.py pass; compliance 89.3%; 17/17 phenotypes causally connected.

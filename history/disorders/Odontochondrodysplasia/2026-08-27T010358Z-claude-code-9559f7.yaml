  summary: 'Create: Odontochondrodysplasia'
  details: |
    ISDS Nosology group 12, row NOS 12-0020. Modelled as the survivable end of the TRIP11 allelic series whose null end is achondrogenesis type 1A: residual GMAP-210 preserves Golgi integrity and bulk secretion but not glycan processing or proteoglycan export, and the chondrocyte maturation defect that follows differs from the lethal disorder in degree rather than kind. Records the discovery paper's Golgi-versus-cilium result explicitly, since GMAP-210's IFT20 interaction had pointed the other way. Open knowledge gap on the reported adult with two apparently null alleles and the mildest phenotype, which contradicts the residual-activity model. 25 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

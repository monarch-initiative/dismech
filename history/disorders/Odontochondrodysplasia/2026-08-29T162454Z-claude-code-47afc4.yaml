  summary: Rebind pulmonary dysplasia to HP:0002088, faithful to the source wording
  details: |
    Applied the four non-blocking suggestions carried since review round 1, and repointed the SPENCD animal model at its primary source.

    Baricitinib was named in the SPENCD JAK-inhibition treatment description but absent from therapeutic_agent; added as CHEBI:95341 alongside ruxolitinib and tofacitinib.

    SPENCD animal_models[0].publication pointed at the 2025 review (PMID:41049574) rather than the primary description of the Acp5-null mouse. Repointed to PMID:8898228 (Hayman et al., Development 1996), and added two evidence items from it so the model claims rest on the primary measurement rather than on a later summary: the histomorphometry showing widened and disorganized epiphyseal growth plates with delayed cartilage mineralization, and the resorption pit assay confirming the osteoclastic defect is intrinsic.

    ODCD Pulmonary Dysplasia was bound to HP:0002089 Pulmonary hypoplasia. The source says pulmonary dysplasia and does not specify hypoplasia, so the binding is now HP:0002088 Abnormal lung morphology, which is faithful to the quote; the description records why.

    HHAT gained an explicit Skeletal Dysplasia phenotype bound to HP:0002652, wired off the patterning-defect node. The ISDS group-12 assignment for this disorder rests entirely on the presence of a skeletal dysplasia, and the entry previously left that implicit inside the severe-short-stature record. Stating it explicitly also makes the entry own the tension it already documents: the published phenotype is a generalised chondrodysplasia, not the vertebral-plus-metaphyseal pattern shared by the other five group members.

    Also added the scope-override label to PR 9618. The curation-scope CI guard failed on src/dismech/schema/classifications/isds_skeletal_nosology.yaml, which this PR edits deliberately: the group-12 description named four of the six members, and removing a changelog sentence from it was review finding 7. The label is the guard own documented remedy for an intentional exception and has been used on 380 PRs, including 9616, which did the same kind of ISDS Table 1 verification work.

    Validated: just validate-disorders 6/6 with 302 snippets verified, phenotype connectivity 71/71 and gene wiring 6/6, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, and the entity-ref, model-readout and graph pytest selections (7941 passed).

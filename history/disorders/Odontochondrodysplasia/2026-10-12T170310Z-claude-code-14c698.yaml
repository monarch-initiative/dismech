  summary: Repair seven snippets whose gene symbols lost their surrounding spaces
  details: |
    CI surfaced this once the scope-override label let test (3.13) past the scope gate and reach validate-disorders. Seven snippets in this entry failed exact-quote verification, all citing PMID:30728324, and all with the same defect: the gene symbol is glued to the words on either side - a TRIP11-null written as aTRIP11-null, of TRIP11 are as ofTRIP11are, in TRIP11-related as inTRIP11-related, of TRIP11 in as ofTRIP11in, hypomorphic TRIP11 mutations as hypomorphicTRIP11mutations, of TRIP11 missplicing as ofTRIP11missplicing. That is the signature of a publisher's italic span being dropped when the sentence was copied, taking the spaces around it with it. Snippet normalization maps characters to spaces and collapses runs of whitespace, but it never inserts a space that is absent, so these could not match and never would have.

    The defect is not from this pull request. All seven strings are present on main, and this branch's only change to this entry is a single conforms_to line on the Block in Hypertrophic Chondrocyte Differentiation node, in a section that carries none of them. What the branch did was bring the file into the changed-file set that CI validates, which is the first time these snippets were checked.

    The repair reads the correct text from references_cache/PMID_30728324.md rather than restoring the spaces by eye: each candidate was rewritten by inserting a space where a lowercase letter abutted the symbol, then asserted to be a substring of the whitespace-normalized cache body before being written. All seven passed that assertion. No wording is changed and no snippet is shortened.

    Worth recording for whoever reads this later: exact-quote validation runs only over changed files, both in the pull-request gate and in the nightly sweep, which runs test-kb and test-python-code rather than a whole-corpus validate-disorders. A snippet broken when it was authored therefore stays broken until an unrelated change touches its file. That is how seven of them survived on main.

    Validation. just validate-disorders on this entry: 53 of 53 snippets verified, 0 issues, where the same command reported 7 errors before the repair.

  details: |
    check_snippet_length failed on five evidence snippets under five words, all lifted from hard-wrapped abstract lines or bare parenthetical figures. Each was replaced with a full sentence from the same cached source, re-verified as an exact normalized substring.

    phenotypes[2] Verrucae: 'human papillomavirus \ninfections.' -> 'Seven patients had persistent flat and verrucous warts' (PMID:19776401 full text). The replacement is also a better match for the phenotype: the old fragment named the virus, the new sentence names the lesion and counts it.

    phenotypes[12] Food allergy: 'severe food allergies' -> the full distinguishing sentence from PMID:30565250, which is what the explanation already claimed the item showed. That reference is Immunological Reviews, so quote_role: REVIEW_SYNTHESIS was added; evidence_source stays OTHER.

    phenotypes[16] Lymphoma: 'one had T-cell lymphoma-leukemia' -> 'One patient with resected microcystic adenoma died from cutaneous T-cell lymphoma-leukemia.' (PMID:19776401 full text). ASCII hyphen folds to the source en dash under normalization.

    phenotypes[18] Decreased circulating total IgM: 'low IgM levels (62%)' -> 'In the majority of patients, serum IgM levels were low (36/58; 62%)' (PMID:25724123 full text), which supplies the denominator the percentage alone omitted.

    clinical_burden.evidence[1]: 'Mortality was high (34%).' -> the full-text sentence giving 20 of 58 patients and mean age at death.


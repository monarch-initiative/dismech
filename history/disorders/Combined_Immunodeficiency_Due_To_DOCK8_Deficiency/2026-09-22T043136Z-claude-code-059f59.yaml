  summary: 'Create: DOCK8 deficiency (autosomal recessive hyper-IgE syndrome)'
  details: |
    Curated combined immunodeficiency due to DOCK8 deficiency (MONDO:0009478) as the autosomal recessive counterpart to the existing Autosomal_Dominant_Hyper-IgE_Syndrome entry, which already named this disease as a differential diagnosis without it existing. 16 pathophysiology nodes, 23 phenotypes, 5 treatments, 3 animal models, 121 evidence snippets across verified PMIDs, all exact substrings of fetched reference caches (121/121 verified by validate-disorders). Deep research was produced with the claude_code provider after the Edison account returned HTTP 402; that report's citation layer proved unreliable across this batch (182 of 268 cited PMIDs across 10 reports had titles unrelated to their disease, 4 did not resolve at all), so citations here were re-derived and each reference fetched and read before quoting.

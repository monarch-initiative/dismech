  summary: 'Mappings: ICD-10-CM F91.3; definitions: DSM-5-TR rule'
  details: |
    Added ICD10CM:F91.3 (Oppositional defiant disorder) as skos:exactMatch, copied from MONDO's exact cross-reference (MONDO mapping set mondo.sssom.tsv retrieved 2026-11-14 (md5 1a9da85954d80718f635a32792802f05)). Added a DIAGNOSTIC_CRITERIA definition from the StatPearls ODD chapter (PMID:32491375): at least 4 of 8 symptoms across the three categories, shown frequently and with people other than siblings, at the age-dependent frequency, with a distress or impairment requirement and an exclusion for behavior occurring only with another mental health condition. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

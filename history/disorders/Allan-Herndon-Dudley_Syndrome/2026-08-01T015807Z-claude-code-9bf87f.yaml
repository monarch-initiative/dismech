  summary: 'Review response (PR #7496): add diagnosis section, seven phenotypes, GeneReviews
    transmission-risk snippet'
  details: |
    Addressed the REQUEST_CHANGES review on PR #7496 (five IMPORTANT content-completeness gaps, no CRITICAL items).

    IMPORTANT items addressed:
    1. Added a top-level diagnosis: section with four Diagnosis records - serum thyroid function testing (T3/free T4/TSH; NCIT:C25294), molecular genetic testing of SLC16A2 (NCIT:C15709, backed by the previously unmined GeneReviews DIAGNOSIS/TESTING sentence), brain MRI for myelination (NCIT:C16809), and reverse T3 in the newborn period recorded explicitly as a screening gap. PMID:38963712 (2024 ETA Guidelines) is now cited twice more inside the diagnosis section, and the PMID:39132310 full text supplied the diagnostic-workup and newborn-screening quotes.
    2. Added Cardiovascular phenotypes Premature atrial contractions (HP:0006699, FREQUENT, 76%) and Elevated systolic blood pressure (HP:0004421, FREQUENT, 53%) from the PMID:32559475 snippet already in the file, each with its own incoming downstream edge from Hypermetabolism and Muscle Wasting.
    3. Added Respiratory phenotype Aspiration pneumonia. Substituted HP:0011951 (Aspiration pneumonia) for the reviewer-suggested HP:0006532 (Recurrent pneumonia): both OAK-verified, but recurrence is not evidenced in any cached source whereas aspiration is stated verbatim in PMID:39132310. Frequency omitted (the cohort reports cause-of-death share, not prevalence).
    4. Added Musculoskeletal phenotypes Scoliosis (HP:0002650) and Hip dislocation (HP:0002827), each with the GeneReviews surveillance snippet plus an independent PMID:39132310 recommendation. Frequency omitted (no figures reported).
    5. Added the verbatim GeneReviews 50% transmission-risk snippet to the genetic-counseling treatment, plus a corroborating PMID:39132310 quote.

    Suggestions applied:
    - Added Ophthalmologic phenotype Nystagmus (HP:0000639) from the already-cached PMID:14661163.
    - Added Endocrine phenotype Decreased circulating reverse T3 concentration (HP:6001334) with an incoming edge from Signature Serum Iodothyronine Pattern. Note that the Biochemical class has no phenotype_term slot, so the term was curated as a phenotype rather than on the rT3 biochemical entry as the reviewer suggested.
    - Added an ANALYTE MISMATCH FLAG note on the total-T3 reference range documenting that HP:0011788 is the free-T3 term used as the closest available match, with an HPO new-term request noted as the resolution.
    - Added NCT05579327 (ReTRIACt, phase 3 randomised withdrawal, COMPLETED) to clinical_trials; fetched with just fetch-reference.
    - Promoted the genotype-phenotype content out of genetic.notes into three evidence items (PMID:15488219 allelic spectrum; PMID:27977298 residual-function/milder-phenotype and kinetic-destabilisation quotes, newly fetched).
    - Added a classifications block (harrisons_chapter: ENDOCRINOLOGY_METABOLISM, NEUROLOGIC).

    All six reviewer-suggested HP IDs were OAK-verified against sqlite:obo:hp before use and all six were correct.

    Validation: just validate (127/127 snippets verified), just validate-references, just validate-terms, and scripts/check_folded_hyphens.py all pass.

  summary: 'Create: Allan-Herndon-Dudley_Syndrome'
  details: |
    De-novo curation of Allan-Herndon-Dudley syndrome (MCT8 deficiency, MONDO:0010354, SLC16A2/Xq13.2) resolving issue #7478. NEC preflight run first: OAK MONDO lookup confirmed the definition, OMIM:300523 xref, and the 'MCT8 deficiency' synonym, guarding against drift into generic X-linked intellectual disability, congenital hypothyroidism, or THRB/THRA thyroid hormone resistance. Falcon (Edison Scientific) deep research was run and used strictly as leads; its report is committed under research/. Every PMID it suggested was independently fetched with 'just fetch-reference' and every snippet verified as an exact substring of the cached abstract; falcon's suggested HP identifiers were NOT used (spot-checks found label mismatches, e.g. HP:0031508 which it labelled 'Increased circulating triiodothyronine level' is actually 'Abnormal circulating thyroid hormone concentration'), and all ontology terms were instead resolved and label-checked directly with OAK. GeneReviews baseline (PMID:20301789) fetched, tagged in top-level references, and cross-referenced against the phenotype list; its Agents/Circumstances to Avoid warning is captured as a dedicated contraindicated-treatment entry. Modelled the eight-node pathograph as a single connected component branching from MCT8 Thyroid Hormone Transport Failure into a cerebral-hypothyroidism arm (oligodendrocyte differentiation block, disrupted neuronal/cerebellar development) and a peripheral-thyrotoxicosis arm (hypermetabolism, muscle wasting), plus the signature serum iodothyronine node. Curated the diagnostic T3/free T4/TSH triad as biochemical entries with LOINC-coded reference ranges and interpretation bands; the T3 interval (1.4-2.5 nmol/L) is evidence-backed from the Triac Trial target range, while the free T4 and TSH intervals are recorded as conventional laboratory ranges in notes rather than attributed to a fabricated citation. Treatments cover tiratricol/Triac and DITPA with target_mechanisms linking back to both mechanism arms, plus levothyroxine/liothyronine monotherapy as explicitly contraindicated. Clinical trials NCT02060474 (Triac Trial I) and NCT02396459 (Triac Trial II) added. Declared partial module conformance: only the cerebral node conforms to hypothyroidism_thyroid_hormone_deficiency#Reduced Thyroid Hormone Action at Peripheral Sites, with the reasoning for rejecting the module's other four nodes recorded in the entry notes. A HUMAN_MODEL_MISMATCH discussion records that the Mct8 single-knockout mouse reproduces the human serum profile but not the human CNS phenotype. Validated with just validate (schema, terms, references: 95/95 snippets verified), just validate-terms, and scripts/check_folded_hyphens.py; weighted compliance 86.0 percent.

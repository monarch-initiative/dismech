  summary: 'Publication review: Allan-Herndon-Dudley syndrome'
  details: |
    Independent publication-readiness review. Audited every evidence pair and corrected review-versus-primary source typing, unsupported frequency assertions, polarity, scope, and mechanistic overclaims. Added current disease-specific evidence for SLC16A2 variation, MCT8 structure, childhood parkinsonism and levodopa/carbidopa response, tiratricol approval, and the registered glycerol phenylbutyrate study. Strengthened differential-diagnosis evidence and preserved uncertainty for uncontrolled, preclinical, and registration-only findings.

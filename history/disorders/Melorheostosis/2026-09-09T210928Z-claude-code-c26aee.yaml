  summary: 'Review round 2: add the RANKL/OPG osteoclast limb, hypervascularity, locus
    heterogeneity, and the two proposed therapies'
  details: |
    Review round 2 on PR #11467. Two blocking findings and six suggestions; all eight are addressed, both blockers from text already committed to this branch.

    The first blocking finding was the better one. Bisphosphonate therapy was attached to the hyperostosis node, which gave it no mechanistic join point: bisphosphonates act on the osteoclast, and the entry contained no osteoclast anywhere. The cached natural history paper reports a markedly increased RANKL to osteoprotegerin transcript ratio in osteoblasts from affected bone in MAP2K1-positive patients. RANKL drives osteoclast differentiation, so that ratio is the link between the osteoblast arm this entry already modelled and the bone-resorption machinery a bisphosphonate acts on. A new node, Increased RANKL/OPG Ratio in Affected Bone, now sits between the MAP2K1 osteoblast node and the hyperostosis, carrying both osteoblast and osteoclast cell types and GO terms for regulation of bone resorption and osteoclast differentiation. Bisphosphonate therapy retargets there.

    The node is HYPOTHETICAL and its downstream link is UNKNOWN, and that is the point. The same sentence that reports the ratio raises the possibility that it is a compensatory mechanism for the dense bone rather than a contributor to it. That caveat is a separate evidence item on the node, it is the stated basis for the UNKNOWN link type, and it appears again on the RANKL inhibition treatment so that a reader cannot meet the therapeutic proposal without meeting its limitation.

    The second blocking finding was hypervascularity of the cortex and adjacent soft tissue in 50 percent of the cohort, absent with no scoping rationale. Now curated, banded FREQUENT on twelve of thirty, with a second evidence item recording that the source explicitly does not know whether it contributes to pain. That is why it hangs off the hyperostosis as INDIRECT_UNKNOWN_INTERMEDIATES rather than being placed on the pain pathway. HPO has no term for increased vascularity of bone, so the binding is HP:0025015 Abnormal vascular morphology with the site carried in the preferred term, and the compromise is stated in the description.

    All six suggestions taken. Locus heterogeneity is now in the genetic section with two independent quotes, and the genetic notes say a negative result on affected tissue does not exclude the diagnosis, which is the practical consequence. Peripheral nerve compression carries the electrodiagnostic figure of 43 percent, twelve of twenty-eight tested, recorded as the wider neuropathy burden rather than as the band, since the band rests on the five imaging-confirmed entrapments and the two numbers measure different things. Limitation of joint mobility now has its sixteen of thirty denominator.

    MEK inhibition and RANKL inhibition are both curated as treatments, and both descriptions say plainly that no cached source reports a treated patient. They are recorded because the reasoning is part of what the molecular work bought: MEK inhibition is the only point in this pathograph where a treatment would be disease-modifying rather than symptomatic, and its description says it would do nothing for the SMAD3 arm.

    Malignant transformation is now stated in notes rather than listed as an extension point, because the reassurance is as useful as the risk: the lesions do not metastasise, conversion has been reported rarely, and the cohort says it is not clear whether the osteosarcoma arose in the melorheostotic distribution in any of the three reported cases. Nifedipine is named in notes and deliberately not curated as a treatment, because the mention carries no denominator, no outcome measure and no mechanism beyond vasoconstriction, and the same source says it would not alter disease progression.

    Validation: 84/84 snippets verified, up from 69/69. Term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent.

  summary: 'Create: Melorheostosis MONDO:0007970'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check, launched before writing so it ran in parallel.

    The entry is built around a contrast. Two somatic genes cause melorheostosis and they reach the same tissue endpoint by opposite cellular routes. Activating MAP2K1 mutations drive ERK signalling, raise osteoblast proliferation and impair BMP2-mediated mineralisation, so the excess bone is largely unmineralised osteoid. Activating SMAD3 mutations drive TGF-beta signalling, suppress proliferation and enhance mineralisation, so affected bone is more mineralised than unaffected bone. They also produce different radiographic patterns, cortical dripping versus endosteal, and a review reports that MAP2K1 cases are more likely to show the classic dripping candle wax appearance. Modelling these as separate arms rather than collapsing them into one increased-bone-formation node preserves the contrast, and the subtypes slot on each node records which arm it belongs to.

    Three negatives are recorded deliberately. LEMD3 is carried as DISPUTED with REFUTE evidence: it genuinely causes osteopoikilosis and Buschke-Ollendorff syndrome, and melorheostosis-like lesions occur in those conditions, but sequencing of blood, skin and bone from a patient with isolated melorheostosis found nothing and reviews conclude it is not causative here. The sclerotome hypothesis is carried as a DEPRECATED mechanistic hypothesis with REFUTE evidence, because whole-body CT in thirty patients found only 17 percent conformed to a single sclerotome, yet reviews published after that test still state a sclerotomal distribution as fact. The deep-research report itself repeated the sclerotomal claim in its summary, which is direct evidence that keeping the deprecated hypothesis with its refutation is worth doing. And the somatic mosaicism has a testing consequence stated in the genetic notes: the mutations are absent from unaffected bone in the same patient, so a blood sample will be negative as a property of the disease rather than a limitation of the assay.

    The deep-research report contributed three things, each verified against its cited paper before use. A prevalence figure of 0.9 per million, which corrected a claim in the draft notes that no quotable prevalence existed. KRAS as a third somatic gene in a minority of cases, together with the genotype-phenotype correlation above. And a prospective NIH natural history cohort of thirty adults, which supplies contractures, range of motion limitation and limb swelling from a prospectively recruited population rather than from the case-report literature the disease otherwise rests on.

    The prevalence correction is the third instance in this series of a claim that no figure was available turning out to be a claim about my search rather than about the literature. It is recorded in the entry notes rather than quietly replaced.

    Process. Content_type was checked on every cache before writing; seven of ten were full text. Two YAML failures from unquoted colons in plain scalars were found by validation and fixed, and a systematic scan for that pattern was run rather than fixing them one at a time. The full check battery was run as the last step after the report was folded in, not midway.


  summary: 'Review round 1: mine the cached natural history cohort for five phenotypes,
    split bundled treatment, add trial'
  details: |
    Review round 1 on PR #11467 requested changes on six findings, all of them under-consumption of references this branch had already cached. The reviewer was right about every item, and the diagnosis was sharper than the individual findings: the natural history cohort at PMID:31485554 was quoted once and that one sentence reused three times, while the same committed full text carried denominators for four unrecorded phenotypes, the diagnosis-by-age figure, the normal-biochemistry finding, the neuropathic pain recommendation and the trial registration.

    Five phenotypes added, four of them with denominators from the cohort rather than qualitative terms. Skin changes overlying affected bone bind HP:0010783 Erythema at FREQUENT, from 16 of 30 patients, with a second evidence item recording that only 9 of those 16 had the vascular erythematous morphology the term covers. Somatic sensory deficit binds HP:0003474 at FREQUENT from 77 percent on examination. Peripheral nerve compression binds HP:0003406 at OCCASIONAL from five of thirty, one band below the sensory deficit it sits inside, with ultrasound confirmation of the mechanism and an independent source naming it as a surgical indication. Skeletal muscle atrophy binds HP:0003202 at OCCASIONAL from eight of thirty, with the source attributing it to disuse, which is what determines where it sits in the graph. Localized soft tissue swelling binds HP:6000840, the only one of the five banded from a qualitative framing rather than a count, and its evidence explanation says so.

    All five are wired into the pathograph rather than left free-floating. Skin changes hang DIRECT off MEK1-ERK hyperactivation, because the source ties the erythematous change specifically to MAP2K1-positive disease and not to the TGF-beta arm. Nerve compression hangs DIRECT off segmental cortical hyperostosis; sensory deficit hangs off the same node as INDIRECT_KNOWN_INTERMEDIATES with the compression as the stated intermediate. Muscle atrophy hangs off pain, deformity and restricted movement as INDIRECT_KNOWN_INTERMEDIATES via disuse. Limb swelling hangs off the hyperostosis as INDIRECT_UNKNOWN_INTERMEDIATES, because the sources list it without establishing whether it is soft tissue involvement by the clone, venous or lymphatic obstruction, or a consequence of the hypervascularity.

    The bundled treatment node is split. It described conservative measures or surgery while carrying therapeutic_modality SURGERY, so the tag contradicted its own content. There are now four treatments: surgery, physical therapy, bisphosphonates and gabapentinoids. The bisphosphonate entry quotes the source saying definitive guidance on its use is lacking, because a treatment being used is not a treatment being established, and its mechanism link is MODULATES rather than INHIBITS for the same reason. The gabapentinoid entry targets the nerve compression node rather than the pain node, and its description states that it does not relieve the compression itself.

    NCT02504879 is added as a clinical trial. It is the NIH natural history study the cohort is drawn from, so recording it makes the provenance of most of this entry's frequency data explicit rather than implicit. Status is UNKNOWN because the cached trial record does not carry a recruitment status and guessing one would be fabrication.

    Normal bone biochemistry is added as a diagnosis entry with presence ABSENT. The negative finding is worth curating because it separates melorheostosis from the metabolic sclerosing bone diseases that produce a similar radiographic impression, and because it is what a disease driven by a segmental somatic clone should look like.

    Suggestions addressed: mappings for MONDO:0007970 and NCIT:C84887, with OMIM:155950 and Orphanet:2485 recorded in the justification and both verified against MONDO cross-references; onset recorded as CHILDHOOD on the obligate phenotype with the diagnosis-by-age-20 figure in its notes; neuropathic pain agents curated. Two suggestions not taken. No frequency is set on flexion contracture because no cached source gives a denominator for contracture specifically; the 53 percent figure the review may have had in mind is for restricted joint mobility, which is a different phenotype already banded FREQUENT and is now grounded on that quote. Animal and iPSC models are not added because no cached reference describes one, and adding them would mean fetching PMIDs that appear only in the deep-research report, which is exactly the hallucination risk the review flagged.

    The notes paragraph that listed skin and soft tissue involvement as an extension point is replaced. Naming something an extension point is not a scoping rationale when the evidence is already committed to the repository, and this is the second entry in this series where that phrasing concealed unmined cached full text.

    Validation: 69/69 snippets verified, up from 46/46. Term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent.

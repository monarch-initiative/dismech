  summary: 'Gene-family review: KRAS'
  details: |
    The KRAS record was typed CAUSATIVE. The literature has two single-patient reports, each finding the KRAS variant in skin rather than lesional bone: a somatic KRAS Q61H in an overlying dermatosis (PMID:28434888) and a KRAS variant in a skin biopsy (PMID:34190333). Retyped UNKNOWN with a note, since two case reports are below the Definitive or Strong level CAUSATIVE requires; both reports added as evidence. MAP2K1, the main somatic gene, was not changed.

  summary: 'Create: Spermatogenic Failure 41 (CFAP70)'
  details: |
    New entry for SPGF41 (MONDO:0032863), autosomal recessive MMAF/oligoasthenoteratozoospermia caused by CFAP70. Deep research with the claude_code provider (research/Spermatogenic_Failure_41-deep-research-claude_code.md; preflight-dr matched CFAP70) was used as leads only; a direct PubMed search for CFAP70 added the C2a-projection mouse knockout study (PMID:42417609). Pathograph: CFAP70 loss (GO:0005200 structural constituent of cytoskeleton, DECREASED, grounded in C2a collapse in knockout mice) -> failure of sperm flagellum assembly -> MMAF -> motility, flagellar and infertility phenotypes; oligozoospermia left unlinked. Hypothesis records that the three reported men had isolated infertility while knockout mice develop hydrocephalus and sinusitis (REFUTE items, mouse-only). ClinGen has no CFAP70 curation, so no validity tier. Three mouse models with a typed SPECIES_MISMATCH divergence; ICSI (one live birth, reduced embryo development in mice), genetic counselling, exome testing, semen analysis and immunofluorescence. No GeneReviews/StatPearls chapter. Stub stubs/Spermatogenic_Failure_41.yaml deleted. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-genereviews, the corpus snippet/title gates, gene-activity grounding and validate-disorders.

  summary: Bind MONDO:0032831 (PCH type 13) and correct the stale no-such-term note
  details: |
    The entry carried no disease_term, with a note stating that no exact MONDO class existed and that the field was intentionally omitted pending ontology coverage. That note was wrong and had been propagated into a review as an ontology gap needing a new-term request.

    MONDO:0032831 pontocerebellar hypoplasia, type 13 xrefs OMIM:618606 - the same OMIM number this entry was seeded from - and records VPS51 (HGNC:1172) as its causal gene via RO:0004003. Bound it. The earlier audit had correctly rejected PCH1A as a VRK1 anterior-horn-cell disorder but did not continue through the numbered PCH series to reach PCH13.

    The notes were rewritten to record the correction rather than silently replaced, and to name the one gap that survives: MONDO classifies MONDO:0032831 under pontocerebellar hypoplasia, not under congenital disorder of glycosylation, so this entry is a member of the Congenital_Disorders_of_Glycosylation grouping without being a MONDO descendant of the grouping's mapped class. A request to add the CDG parent to the existing term is the right follow-up, and is a much smaller ask than the new-term request previously assumed to be needed.

    Validation: just validate PASS; just validate-terms PASS.

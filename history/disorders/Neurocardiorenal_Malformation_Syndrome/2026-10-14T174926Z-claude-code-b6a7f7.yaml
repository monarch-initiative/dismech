  summary: 'Create: Neurocardiorenal_Malformation_Syndrome'
  details: |
    New entry for MONDO:0980704 (TM2D3, OMIM:621379), claimed in #14166. Falcon was the default deep-research provider but returned a 503 authentication failure, which the client classes as retryable so --fallback did not hand over; the claude_code provider was run directly instead and its report is committed (8/8 references and 71/71 CURIEs resolved; just preflight-dr confirmed TM2D3 is the subject). Evidence comes from three primary papers: PMID:40449487 (defining case series and ER/mitochondrial work), PMID:38016980 (Notch surface presentation in Tm2d3-null mouse cells and fly embryos) and PMID:34905536 (Drosophila TM2D genes), plus PMID:27764101 for the separate Alzheimer-risk allele. The defining paper is not open access; PubMed and DOI routes both return the abstract only, so the full-text findings the report quotes (renal anomalies, specific heart lesions, seizures, MRI findings) are recorded in notes as unverified rather than curated as phenotypes. Notch is carried as an EMERGING hypothesis group because it is not tested in patients. Validated with just validate, count-verified-snippets (27/27), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-snippet-grading and check-genereviews (no chapter). A pre-PR self-review then narrowed the cell-type bindings to CL:0002620 skin fibroblast and CL:2000042 embryonic fibroblast, regraded the tissue-expression quote to OTHER, replaced the fly model's overexpression snippet with its loss-of-function result, dropped the off-claim Alzheimer evidence item, dropped GO:0042407 (cristae width was measured, not cristae assembly), and added NCIT:C101295 as the diagnosis term.

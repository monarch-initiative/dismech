  summary: Record the SNAP29 competing causal variant found in the founding TUBA8
    family
  details: |
    Correction to the TUBA8 entry made minutes after creating it, prompted by the check-title-snippets gate rejecting two title-quoted snippets and forcing a read of the full PMID:28388629 abstract.

    The abstract contains a fact the title does not: after the Tuba8 knockout mouse came back neurologically normal, the authors re-analysed the ORIGINAL human polymicrogyria subjects by whole exome sequencing and identified an additional homozygous loss-of-function mutation in SNAP29, concluding that SNAP29 deficiency rather than TUBA8 deficiency may underlie most or all of the neurodevelopmental anomalies in those subjects.

    That is materially stronger than the "contested" framing the entry was created with. The linked-bystander scenario the discussion had raised as a hypothetical was in fact found - a competing causal variant in the founding family, which is the strongest form that objection can take. The description, the discussion rationale and the notes were rewritten to say so, and the SNAP29 finding is curated as an evidence item with supports REFUTE.

    Also added the one countervailing detail from the same abstract: Tuba8 localises specifically to cerebellar Purkinje cells in mouse brain, which the knockout authors suggest could mean the human variants modify motor control even if they do not cause the polymicrogyria. Curated as PARTIAL so the residual case is visible rather than erased.

    The entry still carries no disease_term and still records genetic[].association as Suspected. If anything the case for those choices is now stronger.

    Verified: just validate passed with 14/14 snippets verified against cached references; check-title-snippets no longer reports findings for this file.

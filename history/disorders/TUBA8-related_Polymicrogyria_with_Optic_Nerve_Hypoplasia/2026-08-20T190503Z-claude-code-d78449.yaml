  summary: 'Create: TUBA8-related Polymicrogyria with Optic Nerve Hypoplasia (contested)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified; just validate and just validate-terms pass.

    Curated deliberately as a CONTESTED gene-disease relationship, which the review had flagged as a candidate that should be recorded rather than silently omitted.

    NO disease_term is bound, on purpose. Binding a MONDO identifier would assert a disease entity whose gene-disease validity is unresolved. genetic[].association is Suspected rather than Causative, and the negative mouse evidence is curated with supports REFUTE so the contradiction is machine-visible rather than buried in prose.

    The evidence genuinely points both ways: 2009 autozygosity mapping plus a specific mechanistic hypothesis (TUBA8 uniquely lacks the lysine 40 acetylation site that regulates migration) against a Tuba8 mouse knockout showing a role in spermatogenesis but NOT brain development, and a companion paper arguing Tuba8 cannot substitute for Tuba1a in migration. The discussion gives equal weight to two mundane explanations - a linked bystander variant in a consanguineous autozygous region, and paralogous redundancy masking a mouse phenotype - and names what would settle it: additional unrelated biallelic families, of which there have been none in seventeen years.

    NOT conformed to microtubule_dependent_neuronal_migration_failure: conformance would assert exactly the migration mechanism the mouse knockout fails to support, smuggling the contested claim in through the module layer.

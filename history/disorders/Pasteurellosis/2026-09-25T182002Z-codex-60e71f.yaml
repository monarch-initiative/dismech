  details: |
    Created the MONDO:0005901 genus-level infectious disease entry from the OpenScientist report at research/Pasteurellosis-deep-research-openscientist.md. The deep-research identity preflight returned SKIP, not FAIL, because MONDO records no human causal gene for this bacterial infection; manual preflight confirmed the report consistently targeted human pasteurellosis caused by Pasteurella species and the expected Pasteurella genus / P. multocida pathogen scope. Curated a compact human entry with a genus-level Pasteurella infectious_agent, animal bite/scratch/secretion transmission, bite-associated soft-tissue infection, respiratory/systemic opportunistic infection, capsule/LPS-mediated survival, four phenotypes, and an Antibiotic Therapy treatment record. Used five quotable cached PMID records and deliberately avoided the OpenScientist suggestions flagged as invalid, including the mismatched HP drainage/complication/bacteremia rows and the bad NCIT drug CURIEs for penicillin, doxycycline, and amoxicillin-clavulanate. Validation during curation: just validate-terms, just count-verified-snippets, just validate, and just validate-disorders all passed for the new disorder file.

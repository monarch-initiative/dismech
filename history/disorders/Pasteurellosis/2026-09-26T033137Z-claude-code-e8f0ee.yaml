  summary: 'Review round: causal graph, node splits, complications, agents, bindings'
  details: |
    ai4c-reviewer round on PR 12846. Built the causal graph (was 0 edges): capsule/LPS evasion -> local proliferation -> {cellulitis, contiguous deep soft-tissue extension -> tenosynovitis/abscess/septic arthritis/osteomyelitis}; respiratory tract infection -> pneumonia/lung abscess/empyema; bloodstream invasion -> bacteremia/meningitis; antibiotic treatment joins via target_mechanisms. Split the two bundled nodes: capsule/LPS into a capsule innate-evasion node (GO:0141043) and an LPS-survival node; respiratory-and-systemic into a respiratory node and a bloodstream-invasion node. Added ontology bindings: neutrophil (CL:0000775) and inflammatory response (GO:0006954) on the local-proliferation node, GO:0141043 on the capsule node, plus biological_scale throughout. Added six complication phenotypes (Tenosynovitis HP:6001438, Abscess HP:0025615, Septic arthritis HP:0003095, Osteomyelitis HP:0002754, Lung abscess HP:0025044, Pleural empyema HP:0011919) from cached PMID:6371440 and PMID:9097378. Bound penicillin/doxycycline/amoxicillin/clavulanic acid (CHEBI) as therapeutic_agent. Recorded host risk factors (liver dysfunction, damaged joints, age extremes, lung disease) via the PMID:6371440 predilection snippet on the bloodstream node. validate-disorders clean, all gates green, cache additive.

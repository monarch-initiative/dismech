  summary: Review round 1 fixes
  details: |
    Review round 1 on PR 14156. (1) The uniporter-threshold node cited one Debattisti 2019 sentence covering both patient cells and knockout mice under IN_VITRO; it is replaced by a patient-fibroblast sentence (IN_VITRO) plus a separate knockout-myofiber sentence (MODEL_ORGANISM). (2) Supportive Care now rests on the PMID:38380193 statement that treatment is symptomatic; the MCU-modulation quote from PMID:40898676 is kept only for the sentence calling uniporter modulation a proposed future approach. (3) Learning difficulties rebound from HP:0001328 Specific learning disability to HP:0001249 Intellectual disability, because the reports describe general cognitive impairment; a notes line records why. (4) Evidence added to the edges Impaired Muscle Aerobic Metabolism to Proximal muscle weakness and Activity-Induced Myofiber Damage to Exercise-induced myalgia (both PMID:31665639, INDIRECT); the unsupported edge from myofiber damage to abnormal muscle mitochondria was removed, and Progressive Neurodegeneration to Ataxia stays uncited because no source states it. (5) Ptosis kept with a literature-summary quote (PMID:37034047) and Orphanet, and the notes rule about single-patient features rewritten to match. (6) Fetched ORPHA:401768 and added its HPO frequency rows as OTHER evidence for proximal weakness, extrapyramidal disorder, chorea, dystonia, microcephaly, optic atrophy, ptosis and ataxia, plus a point-prevalence record; chorea and dystonia gained FREQUENT, optic atrophy and ptosis OCCASIONAL, and ataxia moved from FREQUENT to OCCASIONAL (6 of 20 is on the band boundary and Orphanet grades it occasional). Validation: validate, count-verified-snippets (123/123), validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading and validate-disorders pass.

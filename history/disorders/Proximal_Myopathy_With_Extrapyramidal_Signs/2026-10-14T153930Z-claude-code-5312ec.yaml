  summary: 'Create: Proximal Myopathy With Extrapyramidal Signs'
  details: |
    New entry for MICU1 deficiency (MPXPS, MONDO:0014300), curated from primary literature found by PubMed search. Pathophysiology is a ten-node chain from biallelic MICU1 loss of function through loss of the uniporter calcium threshold and cooperative activation, which branches into resting mitochondrial calcium overload (fragmentation; neuronal permeability-transition death and neurodegeneration) and impaired activity-coupled mitochondrial calcium uptake in muscle (impaired aerobic metabolism; defective sarcolemmal repair; activity-induced myofiber damage). Sources: Logan 2014 discovery paper, Lewis-Smith 2016, Musa 2019 founder series, Bhosale 2017 patient-fibroblast bioenergetics study (PMID:28132899), Liu 2016 whole-body knockout, Debattisti 2019 muscle knockout, Singh 2022 neuronal knockout, Kohlschmidt 2021, and case series and reports through Beheshti 2026 (61 patients). Phenotype frequencies come from the literature tabulation in PMID:36425804 and the 61-patient series PMID:40898676. 24 phenotypes, three mouse models, two discussions (age-dependent improvement of knockout mice via EMRE; unknown human extrapyramidal substrate). Treatments: supportive care, genetic counselling, and a negative uncontrolled report of levocarnitine and glutathione recorded as REFUTE. Antony 2016 liver knockout (PMID:26956930) was read but not cited. Not curated: PMID:36115200 (segmental dystonia case; no quotable text in cache), single-patient features (polymicrogyria and seizures, PMID:32395406; congenital ptosis with a VUS, PMID:42459038). No GeneReviews chapter exists (check-genereviews --online NO_CHAPTER; PubMed MICU1 or MPXPS with genereviews[book] returned 0). The OpenScientist deep-research report had not been produced when this record was written, so nothing was taken from it. Validation: validate, validate-terms, count-verified-snippets (98/98 at that point), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and validate-disorders all passed.

  summary: 'Create: Proximal Myopathy With Extrapyramidal Signs'
  details: |
    New entry for MICU1 deficiency (MPXPS, MONDO:0014300), curated from primary literature found by PubMed search. Pathophysiology is a ten-node chain from biallelic MICU1 loss of function through loss of the uniporter calcium threshold and cooperative activation, which branches into resting mitochondrial calcium overload (fragmentation; neuronal permeability-transition death and neurodegeneration) and impaired activity-coupled mitochondrial calcium uptake in muscle (impaired aerobic metabolism; defective sarcolemmal repair; activity-induced myofiber damage). Sources: Logan 2014 discovery paper, Lewis-Smith 2016, Musa 2019 founder series, Bhosale 2017 patient-fibroblast bioenergetics study (PMID:28132899), Liu 2016 whole-body knockout, Debattisti 2019 muscle knockout, Singh 2022 neuronal knockout, Kohlschmidt 2021, and case series and reports through Beheshti 2026 (61 patients). Phenotype frequencies come from the literature tabulation in PMID:36425804 and the 61-patient series PMID:40898676. 24 phenotypes, three mouse models, two discussions (age-dependent improvement of knockout mice via EMRE; unknown human extrapyramidal substrate). Treatments: supportive care, genetic counselling, and a negative uncontrolled report of levocarnitine and glutathione recorded as REFUTE. Antony 2016 liver knockout (PMID:26956930) was read but not cited. Not curated: PMID:36115200 (segmental dystonia case; no quotable text in cache), single-patient features (polymicrogyria and seizures, PMID:32395406; congenital ptosis with a VUS, PMID:42459038). No GeneReviews chapter exists (check-genereviews --online NO_CHAPTER; PubMed MICU1 or MPXPS with genereviews[book] returned 0). Deep research: research/Proximal_Myopathy_With_Extrapyramidal_Signs-deep-research-openscientist.md (18/18 references resolved; 2 quotes not found in source, for PMID:24336167 and PMID:32126877; needs_review). preflight-dr could not run because the local MONDO build is absent, so identity was checked by hand: the report names MICU1 throughout, cites OMIM 615673 and MONDO:0014300, and discusses no rival causal gene. Taken from the report, each re-verified against the cached abstract or full text: the satellite cell-specific Micu1 knockout (PMID:42349424, new pathophysiology node and animal model); ptosis and strabismus and symptomatic rehabilitation therapy (PMID:38380193); strabismus (PMID:33969448); attention deficits (PMID:33428302, PMID:41018190); limb-girdle muscular dystrophy as a differential (PMID:33386810). Rejected: Ru265/Ru360 MCU inhibition (PMID:32126877) because it is an ischemia model unrelated to MICU1 deficiency and its quote failed validation; the MICU1-MICU2 structural papers and MICU2/MICU3 modifier speculation, which are not disease evidence; the claim of basal ganglia neuron injury, which no cited source shows in patients; elevated LDH, which the cited case report says is usually normal; the report's NCIT:C15351 (Adoptive Immunotherapy, mislabelled as physical therapy) and unresolved HP:0002452. Validation: validate, validate-terms, count-verified-snippets (109/109), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and validate-disorders all passed.

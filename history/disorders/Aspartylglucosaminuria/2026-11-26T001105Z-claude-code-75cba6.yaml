  summary: 'Gene-family review: AGA; cite the GeneReviews chapter'
  details: |
    Reviewed AGA modelling: the genetic record is CAUSATIVE, germline, with the ClinGen Definitive tier recorded, and the enzyme-deficiency node binds N4-(beta-N-acetylglucosaminyl)-L-asparaginase activity (GO:0003948) as decreased, which matches the glycosylasparaginase that hydrolyses the GlcNAc-Asn linkage. No modelling change was needed. The GeneReviews chapter (PMID:38252773, NBK599378) was not cited; it is now tagged in references and quoted on the AGA genetic record for the definition of the disease by decreased aspartylglucosaminidase activity and biallelic AGA variants. Recent literature checked: the 2026 betaine pharmacological-chaperone trial (PMID:43015321), variant-characterization work (PMID:42482697) and enzyme-replacement work (PMID:42676279) do not change the gene's modelling.

  summary: Add ET-1-driven lung-joint iron dysregulation axis (PMID:42599803)
  details: |
    Curated the ET-1/iron lung-joint axis from PMID:42599803 [Ni et al., Cell Rep 2026] into Long COVID, then reworked it in response to the PR #9801 review.

    The initial commit added a single bundled pathophysiology node spanning AT2 ET-1 elevation, systemic iron dysregulation, and chondrocyte injury, plus macitentan as a treatment.

    Review round 1 changes:

    - Split the bundled node into three atomic nodes joined by downstream edges: Lung Epithelial Endothelin-1 Elevation [CELLULAR] -> Systemic Iron Dysregulation [ORGANISM] -> Chondrocyte Injury and Growth Plate Damage [TISSUE] -> Arthralgia. Each node carries only its own cell types, and each has a biological_scale.
    - Re-graded evidence per study type instead of blanket MODEL_ORGANISM. The abstract's scRNA-seq/histopathology sentence covers COVID-19 patient lung and joint tissue and is now HUMAN_CLINICAL; its explanation states that the same sentence also reports the parallel hamster finding, which the abstract does not separate. The ET-1 silencing and iron chelation results are IN_VITRO; the macitentan hamster result is MODEL_ORGANISM.
    - Dropped the cell_types entry endothelial cell [CL:0000115], which the abstract does not support. The paper concerns lung epithelial/AT2 cells, not endothelium; this was an endothelin/endothelial conflation.
    - Changed the GO:0006879 intracellular iron ion homeostasis modifier from DECREASED to DYSREGULATED, matching the source's "disrupts" and "dysregulated".
    - Replaced GO:0034758 positive regulation of iron ion transport with GO:0033212 iron import into cell for the iron accumulation process.
    - Added target_mechanisms on Macitentan linking it to the ET-1 elevation node and to the chondrocyte injury node, closing the drug-to-mechanism gap issue #9177 asked for.

    Deliberately not done, with reasons recorded on the PR: no upstream edge from Viral Persistence, because the paper's finding is after acute SARS-CoV-2 infection and treating it as persistent-reservoir-driven would be an overreach; no new cartilage or growth-plate phenotype, because that injury is reported in hamsters while Arthralgia is the human phenotype the axis terminates in; COVID-19.yaml left out because the macitentan result is a post-COVID skeletal sequela.

    Validation run: just validate [215/215 snippets verified], just validate-terms [passed], just check-entity-refs, just check-duplicate-keys, just check-snippet-grading [no Long_COVID findings].

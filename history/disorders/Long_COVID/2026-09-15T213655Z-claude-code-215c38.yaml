  details: |
    Third round on PR #9801, addressing the round-2 review of the ET-1/iron lung-joint axis (PMID:42599803).

    Blocking item, resolved: the Chondrocyte Injury and Growth Plate Damage -> Arthralgia edge was evidenced by the abstract's opening background sentence ("the mechanisms linking SARS-CoV-2 respiratory infection to skeletal injury remain unclear"), graded SUPPORT/HUMAN_CLINICAL. That sentence states the mechanistic link is not established, so it cannot support the edge. Replaced with the macitentan result ("macitentan, protected infected hamsters from joint damage by reducing iron overload-associated chondrocyte dropout"), MODEL_ORGANISM, directness INDIRECT. The explanation now states that the source reports structural joint damage in hamsters and never reports arthralgia, so the step to joint pain is an inference.

    Also in this round:

    - Typo fix: "Elevated AT-1 ET-1" -> "Elevated AT2 ET-1" on the ET-1 -> Systemic Iron Dysregulation edge description. It rendered on the disorder page.
    - The first macitentan target_mechanisms link quoted the authors' concluding recommendation ("highlight its receptors as therapeutic target") and was graded evidence_source OTHER. Re-quoted to the result sentence naming macitentan as an endothelin receptor antagonist and reporting its in vivo protection, graded MODEL_ORGANISM with directness INDIRECT, since receptor blockade is inferred from the drug class rather than measured on ET-1 signaling in this experiment.
    - Moved the iron accumulation descriptor (GO:0033212 iron import into cell) off Systemic Iron Dysregulation [ORGANISM] onto Chondrocyte Injury and Growth Plate Damage [TISSUE], per the round-2 suggestion. A cellular iron-import term sat oddly on a node explicitly scoped as systemic, and the joint-tissue accumulation it names is what the downstream node concerns. The systemic node now carries only the DYSREGULATED GO:0006879 homeostasis term.
    - Assessed directness and quote_role on all nine evidence items this PR adds, not only the one the review named. Every quote is PRIMARY_RESULT: none of them is background or review synthesis now that the opening sentence is gone. Six are INDIRECT (inverse manipulations, in vitro rescues, non-human therapeutic rescue, and the drug-class inference) and three are DIRECT (the two sentences that assert the ET-1/iron findings themselves, and the macitentan-on-chondrocyte-dropout result cited for the chondrocyte node link).

    The branch was 1205 commits behind main and origin/main had since replaced the PARTIAL support value with the separate directness slot, so origin/main was merged into the branch before editing. That is what makes directness and quote_role available here. The merge was conflict-free and the branch diff against main is additive only.

    Still deliberately not done, unchanged from round 2: no upstream pathophysiology edge into the axis. The round-2 review accepted the reason for not hanging it off Viral Persistence and confirmed that Circulating SARS-CoV-2 Spike Antigen is a biochemical biomarker rather than a pathophysiology node, so it cannot serve as a source either. Worth a separate issue.

    Validation run in the worktree after the edits: just count-verified-snippets [215/215 verified], just validate, just validate-terms, just check-snippet-grading.

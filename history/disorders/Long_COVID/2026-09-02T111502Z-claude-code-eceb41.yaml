  summary: Integrate assessed OpenScientist findings across six Long COVID hypotheses
  details: |
    Repo-wide OpenScientist hypothesis sweep. All six hypothesis directories under kb/hypotheses/Long_COVID/ already carried an openscientist-assessment-by-codex.yaml, so no new assessment sidecar was written; integration was driven entirely from those assessments' RETAINED and QUALIFIED claims.

    Added 20 evidence items and two KNOWLEDGE_GAP discussions, and corrected one overstatement in existing prose.

    autoimmune_model (PARTIALLY_SUPPORTED): added PMID:35598178 to the hypothesis as a SUPPORT/REFUTE pair - anti-apoA-1 independently predicts 12-month respiratory symptom persistence, but seropositivity falls from 93 percent to 15 percent over that year, which is the source behind the previously uncited persistence caveat in the notes. Added PMID:37490975 (GPCR/RAS meta-analysis, anti-ACE2 enriched) and PMID:38318183 (PRESCO prospective multi-omics; autoantibody and double-negative-1 B cell signatures at acute presentation) to pathophysiology#Autoantibody Production.

    canonical_persistence_immune_model (PARTIALLY_SUPPORTED): added PMID:36517603 (Stein autopsy, RNA to 230 days) and PMID:36131932 (residual antigen/RNA in two living Long COVID patients at 163 and 426 days) to pathophysiology#Viral Persistence, plus PMID:36517603 as a REFUTE on the Viral Persistence -> Systemic Immune Activation edge, since that same series found little inflammation outside the respiratory tract despite widespread RNA. Added PMID:38589621 to the hypothesis as a SUPPORT/REFUTE pair, citing the previously uncited large-scale phenotyping behind qualification (3) and its finding that persistent inflammation was not accompanied by detectable virus.

    herpesvirus_reactivation_model (WEAKLY_SUPPORTED_UNRESOLVED): added PMID:39459911 to pathophysiology#Latent Herpesvirus Reactivation, noting the paper's own statement that whether the antibody levels indicate reactivation remains unresolved. Added discussion gap_long_covid_herpesvirus_suppression_intervention for the assessment's RETAINED intervention gap, citing PMID:41562079 (24-patient open-label convenience series) and PMID:23959519 (indirect ME/CFS valganciclovir RCT with no demonstrated target engagement), with a serology-stratified trial design that separates driver from bystander.

    mastcell_neuroimmune_model (WEAKLY_SUPPORTED_UNRESOLVED): added PMID:37327698 (12-week famotidine RCT) to the Antihistamine Therapy treatment, substantiating the previously uncited RCT claim in the notes while recording that H2 blockade is not mast-cell stabilization and no mechanistic readout was taken. Added PMID:40806683 to the Mast Cell Activation -> Neuroinflammation edge, PMID:41794369 (increased terminal-ileum mast cell activity) to pathophysiology#Mast Cell Activation with an explicit note that gut findings do not close the CNS gap, and PMID:37759276 as a REFUTE on pathophysiology#Neuroinflammation.

    microbiome_dysbiosis_model (PARTIALLY_SUPPORTED): added PMID:35082169 twice to pathophysiology#Gut Microbiome Dysbiosis (admission-composition association and the taxon-level signature), replacing review-only support with a primary prospective cohort. Added PMID:38071990 (SIM01 RCT) and PMID:41494535 (VLCFA-peroxisome; REFUTE, dysbiosis downstream of intestinal reservoirs) to the hypothesis, citing the two studies its notes named without references.

    vascular_microclot_model (WEAKLY_SUPPORTED_UNRESOLVED): corrected the notes, which asserted no independent replication of microclot quantification - PMID:42020802 quantified increased burden in 61 children and young adults with Long COVID versus 23 controls, and is now cited on the hypothesis. Added the omitted Cochrane review PMID:37491597 twice as REFUTE: on the hypothesis for insufficient evidence of any PCC association, and on pathophysiology#Endothelial Dysfunction and Microclots against the thrombus framing. Added PMID:39198643 (spike-fibrin thromboinflammation) and PMID:34389297 (invasive CPET oxygen-extraction deficit) to that node with explanations recording that neither is specific to occlusion. Added discussion gap_long_covid_microclot_occlusion_causality for the RETAINED occlusion and intervention gaps.

    Deliberately not integrated: PMID:41259457 (autoimmune convergence) - a 55-patient cross-sectional series of severe-COVID hospital survivors with no Long COVID case definition, weaker than the two sources already added for the same claim; PMID:38138102 (syndrome heterogeneity) - a narrative review adding nothing beyond PMID:38589621 and the existing gap_long_covid_subtype_mechanism_mapping discussion. No status changes were made to any mechanistic_hypotheses entry, per the assessments' candidate status findings. No ontology terms were added; the two CURIEs the reports proposed (CL:0002584, GO:0061687) were rejected by the assessments as wrong or irrelevant.

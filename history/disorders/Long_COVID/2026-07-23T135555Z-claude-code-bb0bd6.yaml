  summary: Add striatal dopaminergic neuropsychiatric endotype (VMAT2 loss)
  details: |
    Added a striatal dopaminergic dysfunction pathophysiology node, a Striatal Dopaminergic Neuropsychiatric Endotype (EMERGING) mechanistic hypothesis, an Apathy phenotype (HP:0000741), and a reversibility knowledge-gap discussion, derived from the eBioMedicine 2026 Guedj & Beckman comment (doi:10.1016/j.ebiom.2026.106369) on the Liu et al. VMAT2 PET study. Primary evidence: PMID:42431745 (reduced striatal (+)[11C]DTBZ/VMAT2 binding correlating with apathy/motor-slowing/memory-decline), PMID:38237586 (SARS-CoV-2 dopaminergic-neuron senescence, IN_VITRO), PMID:36288725 (NHP neuroinflammation, MODEL_ORGANISM, PARTIAL upstream). Deliberately NOT conformed to the parkinsonism_dopaminergic_degeneration module because reduced VMAT2 need not imply irreversible neurodegeneration. Validated schema, terms, and references.

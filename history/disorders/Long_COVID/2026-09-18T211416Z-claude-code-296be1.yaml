  summary: 'PR review round 3: correct ET-1 producer-node GO term and drop uncited
    oxidative-stress descriptor'
  details: |
    Addressed the two IMPORTANT findings of PR #9801 review round 3. (1) The Lung Epithelial Endothelin-1 Elevation node bound GO:0086100 endothelin receptor signaling pathway with modifier INCREASED, which asserts increased endothelin RECEPTOR signaling in alveolar type II cells. The node's own snippet reports elevated ET-1 in AT2 cells, i.e. ligand PRODUCTION; AT2 is the source of the ligand and the receptor signaling is the downstream step macitentan blocks. Rebound to GO:1990775 endothelin production, verified by lookup (uv run runoak -i ols:go info GO:1990775 returns 'endothelin production') rather than written from memory, and confirmed in the BiologicalProcessTerm dynamic enum by just validate-terms, which added the rows to cache/go/terms.csv and cache/enums/biologicalprocessterm_dd47231dca51.csv. (2) Removed the GO:0006979 response-to-oxidative-stress descriptor from the Chondrocyte Injury and Growth Plate Damage node. The node's only reference is PMID:42599803, whose abstract never mentions oxidative stress, ROS or ferroptosis, so the descriptor asserted a mechanism the cited paper does not make; its preferred_term also conflated the stimulus with the response. Dropped rather than re-cited, because citing a new source for it was outside this PR's scope and fabricating one is not an option. Also took the review's hedging suggestion on the Macitentan treatment description, which claimed protection against post-COVID skeletal sequelae as an established property; it now states that the evidence is hamster-only with no human data, matching what the treatment-level evidence explanation already said.

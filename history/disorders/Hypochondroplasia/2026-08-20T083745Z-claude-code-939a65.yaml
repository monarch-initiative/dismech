  summary: 'Review: HIMAL and neurodevelopmental phenotypes, plus the infigratinib
    N540K dispute'
  details: |
    Phenotypes: added Hippocampal malrotation (HP:0034396, VERY_FREQUENT) and Specific learning disability (HP:0001328) from a 2026 UK cohort of 44 molecularly confirmed children (PMID:42566751). HIMAL was present in 23/25 imaged children, far above prior estimates, and 71% of school-aged children required special educational support. The frequency band is qualified in the description as applying within the imaged subgroup rather than as a population frequency, since only 25 of 44 were imaged and the cohort came from a specialist skeletal-dysplasia service.

    Knowledge gaps: added two discussions. gap_infigratinib_potency_against_n540k records an unresolved 2026 disagreement about whether infigratinib actually inhibits the FGFR3 p.Asn540Lys receptor that causes ~70% of hypochondroplasia - Ursachi et al. report weak inhibition using C-terminally tagged FGFR3 in rat L6 myoblasts, the original authors reply that untagged full-length FGFR3 in ATDC5 chondrogenic cells and the Fgfr3-N534K mouse show potent inhibition, and both positions are internally coherent. Cited via the response letter (PMID:41593746) because the Ursachi letter itself caches with content_type unavailable, so no snippet can be verified against it; the opposing finding is quoted from within the response. The gap states explicitly that the phase 3 achondroplasia result is for a different allele and must not be transferred, and that dismech should curate infigratinib as neither effective nor ineffective here until the hypochondroplasia trial reads out. gap_hch_growth_plate_drug_delivery (HUMAN_MODEL_MISMATCH) records the avascular and alymphatic growth-plate delivery barrier and the 2026 cartilage-targeted nanoparticle result (PMID:42338508), a mouse study using an engineered carrier and a Hedgehog-agonist payload that bypasses FGFR3 entirely.

    Validation: just validate PASS; just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 77/77 verified.

  summary: Expand Hypochondroplasia phenotype context
  details: |
    Reviewed the existing Hypochondroplasia KB entry, local deep-research synthesis, prior phenotype-curation notes, and associated cached publications. Added missed GeneReviews and imaging-backed phenotype claims for short hands/feet, phalangeal shortening, delayed skeletal maturation, tibial bowing, foramen magnum stenosis, obstructive apnea, thoracolumbar kyphosis, squared ilia, flat acetabular roof, and short greater sciatic notch. Connected the new skeletal radiographic findings to the existing impaired endochondral ossification node and foramen magnum stenosis to cranial-base synchondrosis dysfunction. Frequency qualifiers were not added where the evidence was diagnostic, review-based, or small imaging series rather than unbiased frequency data.

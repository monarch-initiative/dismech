  summary: Review and enrich Niemann-Pick_Disease_Type_B
  details: |
    Fetched and tagged the Acid Sphingomyelinase Deficiency GeneReviews chapter (PMID:20301544), repaired baseline snippet defects, added MONDO/Orphanet synonyms and European birth prevalence, populated classifications (harrisons_chapter, sphingolipidosis, ICIMD sphingolipid_degradation), expanded pathophysiology to 4 multi-scale nodes with GO:0019915 on pulmonary macrophage infiltration, replaced coarse HP:0003119 dyslipidemia with specific Frequent lipid phenotypes (HP:0003141, HP:0003233, HP:0002155) and added Frequent ORPHA:77293 phenotypes (Hypersplenism, Progressive pulmonary function impairment, Delayed skeletal maturation, Osteoporosis, Cherry red spot of the macula) plus Occasional Peripheral neuropathy, added SMPD1 p.Arg610del variant, added Lyso-SM and Chitotriosidase biochemical rows, repaired Gaucher differential diagnosis evidence (PMID:28164782), added GeneReviews contact-sports avoidance to supportive management, and added ASCEND (NCT02004691, PMID:35471153) and ASCEND-Peds (NCT02292654) clinical trials.

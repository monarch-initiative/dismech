  summary: 'Create: Dilated_Cardiomyopathy_1P'
  details: |
    Created the entry for dilated cardiomyopathy 1P (MONDO:0012362, PLN / hgnc:9080) from the Edison/falcon deep-research report at research/Dilated_Cardiomyopathy_1P-deep-research-falcon.md. Ran 'just preflight-dr' manually against MONDO:0012362 because the report frontmatter carries an empty mondo_id (known generator bug, dismech#10335); preflight PASSED with PLN mentioned 76 times as top gene. The falcon report carried 0 PMIDs and DOIs only, so all 12 literature references were resolved to PMIDs via the PMC ID converter and re-fetched with 'just fetch-reference' before use. Two HPO CURIEs the report suggested name entirely different concepts and were discarded: HP:0001738 offered as 'Left ventricular systolic dysfunction' is Exocrine pancreatic insufficiency (correct term HP:0025169), and HP:0031540 offered as 'Low-voltage electrocardiogram' is Linear IgG deposits along the epidermal basement membrane zone (correct term HP:0025077 Decreased QRS voltage); the report's own term-validation section reported 28/28 resolved, which is consistent since both CURIEs exist. Pathograph built on calcium handling rather than force generation, with allele-specific branches kept separate: R14del (non-reversible SERCA2a superinhibition plus S/ER mislocalization and autophagic block), R9C (PKA sequestration in trans, no direct pump inhibition), and L39stop (null, recessive for the dilated phenotype). Alleles curated as Variant objects under genetic.PLN. The unresolved SERCA-superinhibition vs S/ER-malformation debate is recorded as two mechanistic_hypotheses groups with competing causal edges tagged rather than resolved. Added a HUMAN_MODEL_MISMATCH discussion for the inverted PLN-null mouse/human phenotype and a KNOWLEDGE_GAP for unexplained penetrance. Conformance declared to fibrotic_response#Excessive ECM Deposition and cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure. Deliberately omitted: preclinical PLN-directed therapies (ASO, AAV9-CRISPR, UPR modulation), a phase 1 AZD4063 trial whose registry status could not be confirmed, and a canine PLN p.Arg9His model with no verified citable record; all noted in the entry notes. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values and the batched validate-disorders all pass, with 73/73 evidence snippets verified against the reference cache. Whole-KB baseline checks (folded hyphens, snippet length, title snippets, snippet grading, environmental evidence) report no new defects and no baseline was modified. Argued against the dashboard/priority.json LUMP_INTO_PARENT recommendation in the PR body per issue #9865: the recommendation is driven by the NUMBERED_SERIES label heuristic, 17 sibling numbered DCM entries are already standalone, and PLN is the only calcium-handling gene among them. Deleted stubs/Dilated_Cardiomyopathy_1P.yaml.

  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review. Tagged the GeneReviews chapter PMID:20301486 in references (the blocking omission) and recorded its abstract_only scope in notes, following the Dilated_Cardiomyopathy_1E precedent. Added a diagnosis section with cardiac magnetic resonance (NCIT:C137915) and PLN genetic testing with cascade screening (NCIT:C15709), both evidenced from references already cached. Added an experimental_models entry for the isogenic PLN-R14del hiPSC-cardiomyocyte and 3D engineered-heart-tissue pair (PMID:33928785) with three modeled_mechanisms links: RECAPITULATES the contractile-dysfunction node, MEASURES the unfolded-protein-response node, and RESCUES via BiP inducer X. Added a three-phase progression block. Added a qualitative penetrance evidence item. Declined the reviewer's suggested quantitative penetrance figure (70 percent of carriers by age 70) because it appears in no cached reference; the omission is recorded in notes, as is the deliberate omission of the mitochondrial and metabolic arm. Clarified in the HUMAN_MODEL_MISMATCH discussion that its animal-model reference resolves on species and so matches both mouse models, and that the null mouse is the one at issue. Snippet count rose from 73 to 86, all verified.

  summary: 'Address re-review on PR #10872'
  details: |
    Closed the three IMPORTANT findings from the 2026-09-04 re-review.

    Cell type: the hiPSC-derived cardiomyocyte in experimental_models was bound to CL:0002322 (embryonic stem cell), wrong on both differentiation state and origin. Rebound to CL:0000746 (cardiac muscle cell), which this file already uses for four other nodes.

    Reference titles: added the 16 missing reference_title values on evidence items in inheritance, progression, diagnosis, clinical_trials, experimental_models and discussions. Thirteen were copied from the same PMID's existing title elsewhere in the file; the three clinicaltrials items took their registry titles from the cache frontmatter. No title was retyped.

    Non-supporting quotes: the Syncope and Exercise intolerance phenotypes cited snippets that did not bear on their claims. Confirmed the reviewer's finding independently - syncope appears in none of the 13 references this entry cites, and a PubMed query for phospholamban AND syncope returns zero records, so no abstract-level source exists. Found the phenotype in PMC full text instead and fetched PMID:30806910 (Cheung et al., Canadian PLN R14del cohort), which records syncope during physical activity followed by fatal ventricular tachycardia storm in a carrier - the arrhythmic mechanism the phenotype attributes it to. Exercise intolerance now cites PMID:33020536, already used five times here, for a decade of progressive activity-limited symptoms in the proband, replacing a quote about ACM prevalence. Both kept directness: INDIRECT with explanations naming the specific inference step.

    Also fixed while in the file: one PMID:33020536 evidence item was graded evidence_source: OTHER while five others in the same file graded the same publication HUMAN_CLINICAL. evidence_source classifies the publication, not the quote, so this is now HUMAN_CLINICAL throughout. check-snippet-grading cannot catch this because it keys on the quoted sentence and these items quote different sentences.

    Suggestions taken: moved the entity-reference bookkeeping sentence out of the head of the pln_null_mouse_human_divergence rationale to the end as a scope note, so the rationale opens with the scientific argument; and curated NCT07241104 (AZD4063 first-in-human) after confirming against the ClinicalTrials.gov API that it is recruiting, phase 1, estimated enrolment 23 - not the 31 the deep-research report gave. It stays out of treatments because the registration does not disclose the agent's mechanism, so there is no node for it to target. The notes paragraph that deferred it was rewritten to record the confirmation.

    Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and validate-disorders all pass. Snippets 86 to 87, all verified. The five whole-KB baseline checks report no new defects and no baseline was modified.

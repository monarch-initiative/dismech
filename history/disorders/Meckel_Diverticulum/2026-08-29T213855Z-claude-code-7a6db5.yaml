    # Evidence review — Meckel_Diverticulum.yaml

    ## Stats
    - 34 evidence items checked: 30 PMID-backed items in the main sections plus 4 DOI-backed items inside `references[].findings` (DOI prefix is in skip_prefixes, so those 4 are not machine-verified; I verified them manually against their DOI_*.md caches).
    - 15 references read from cache: PMID:27492813, PMID:15026601, PMID:8506491, PMID:17021300, PMID:1084202, PMID:19444035, PMID:37769709, PMID:41044867, PMID:37099684, PMID:27064958, PMID:31930430, DOI:10.1007/s00247-025-06284-5, DOI:10.1007/s00383-025-06197-2, DOI:10.3389/fsurg.2023.1327545, DOI:10.47717/turkjsurg.2024.6446. All cache files present; all snippets (including the deliberately preserved typo "possiblity" in PMID:1084202) are exact substrings.
    - 28 verified clean; 1 fixed; 5 noted below (some overlap).

    ## Findings
    1. Location: phenotypes / Intestinal Perforation (line 186). Reference PMID:41044867. Problem: snippet was the paper's title ("Perforated Meckel Diverticulum Caused by Vegetal Food Entrapment: A Rare Case Report and Literature Review.") used as a finding, while the cached record has a full abstract with directly probative result text. Severity: DEFECT. ACTION: fixed — replaced with the exact abstract sentence "During surgical laparoscopic exploration, which was converted to a median laparotomy, an inflamed perforated Meckel diverticulum caused by a foreign body was discovered." (verified against cache; explanation unchanged and still accurate). Baseline file not touched, per policy.
    2. Location: phenotypes / Diverticulitis (line 161). Reference PMID:37769709. Problem: snippet is the paper title "Diverticulitis in Meckel's diverticulum." — but the cached record has NO abstract at all (image/case vignette), so no better exact substring exists in the same reference. The title here establishes only that a case of diverticulitis in MD was reported, which is in fact the exact claim being supported, and the explanation says exactly that. Severity: MINOR. ACTION: reported only — fix would require citing a different source, which the conservative policy forbids; two stronger co-citations (PMID:8506491, PMID:27492813) already carry the phenotype.
    3. Location: phenotypes / Ectopic Gastric Mucosa, `notes` (line 211). Problem: notes assert "Approximately 50-60% of symptomatic Meckel diverticula contain heterotopic gastric or pancreatic tissue", but neither attached quote supports that band: PMID:27064958 reports 58/208 (~28%, an unselected pediatric series) and PMID:15026601 says only "frequently found". (The 55.6%-in-symptomatic figure does exist in the entry's own DOI:10.1007/s00383-025-06197-2 reference cache, but it is not cited here.) Severity: MINOR. ACTION: reported only — fixing would mean rewriting notes/attaching a new citation, outside the conservative fix policy.
    4. Location: all main-section evidence blocks. Problem: `evidence_source` is omitted throughout the main sections (prevalence, progression, pathophysiology, phenotypes, treatments). The default (HUMAN_CLINICAL) is correct for every quoted sentence here — all report human epidemiology, clinical series, or surgical management — so no value is wrong, but the field is unpopulated. Severity: NOTE. ACTION: reported only — omission is schema-legal and adding ~30 fields is beyond a minimal defect fix.
    5. Location: references[] deep-research block (lines 257-332). Problems: (a) two findings use the paper title as both `statement` and `supporting_text` with no evidence item (DOI:10.1007/s00247-022-05527-z, DOI:10.1080/00015458.2022.2136047) — title-as-finding pattern; (b) three DOI evidence items carry the boilerplate explanation "Deep research cited this publication as relevant literature", which does not connect quote to claim; (c) the DOI:10.3389/fsurg.2023.1327545 quote "Meckel's diverticulum is a rare congenital pathology among newborns." is faithful to its source but sits oddly against the entry's own (well-supported) "most common congenital GI malformation, 2-3%" claims — the source sentence is sloppy, not the curation. All quotes verified manually as exact substrings of their DOI caches. Severity: NOTE. ACTION: reported only — these are deep-research import artifacts in the references section, not disorder-claim evidence; DOI references are unverified by tooling by design.

    ## Sections reviewed
    prevalence, progression, pathophysiology, phenotypes, treatments, references (deep-research findings)

    ## Verdict
    Core evidence is solid: prevalence, natural-history, embryology, complication phenotypes, and surgical-management claims are each anchored to exact, on-topic result sentences from appropriate human clinical literature, usually with 2-5 independent citations. The weaknesses are peripheral — two title-as-snippet case-report citations (one fixed, one unfixable from its abstract-less cache), an uncited 50-60% figure in phenotype notes, and low-value deep-research boilerplate in the references section.

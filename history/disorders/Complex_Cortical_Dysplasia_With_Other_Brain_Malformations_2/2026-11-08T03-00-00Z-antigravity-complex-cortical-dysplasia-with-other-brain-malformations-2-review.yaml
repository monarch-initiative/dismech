  summary: Enriched CDCBM2 with Harrison's classifications, KIF5C pathophysiology cellular/anatomical/process annotations, brain MRI diagnosis, and symptomatic treatment phenotype targets.
  details: Added NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:29048727. Enriched KIF5C pathophysiology nodes with plus-end-directed microtubule motor activity and microtubule binding GO functions, microtubule and axon cellular components, neuron cell types, cerebral cortex and corpus callosum developmental processes, and brain anatomical locations. Marked cortical gyral phenotypes (Pachygyria and Abnormal cortical gyration) as diagnostic, grounded Molecular genetic testing with NCIT:C15709, added Brain Magnetic Resonance Imaging (NCIT:C16809) under diagnosis, and enriched symptomatic treatments with HPO phenotype targets.

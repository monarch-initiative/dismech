  summary: 'Create: Complex Cortical Dysplasia With Other Brain Malformations 2 (KIF5C)'
  details: |
    Created de-novo entry for complex cortical dysplasia with other brain malformations 2 (CDCBM2, MONDO:0014116, OMIM 615282), the KIF5C-related malformation of cortical development, autosomal dominant (de novo). Causal chain: KIF5C kinesin-1 motor loss of function (MOLECULAR; dominant-negative motor-domain variant abolishing ATP hydrolysis) -> impaired neuronal migration / microtubule-based transport (CELLULAR) -> malformation of cortical development (TISSUE, frontal-predominant dysgyria/pachygyria) -> 10 phenotypes, all causally connected. relationship_type deliberately left unset: ClinGen Brain Malformations GCEP rates KIF5C-CDCBM2 Moderate (AD), and the schema reserves CAUSATIVE for Definitive/Strong, so the tier is recorded as a gene_disease_validity assertion (MODERATE/CLINGEN, CGGV:assertion_c22eb3e1-...) rather than overstated. Two variants captured: p.Glu237Lys (recurrent de novo, 4/6 individuals) and p.Glu237Val (index family, maternal germline mosaicism). No GeneReviews chapter exists (confirmed offline against the Bookshelf index and via PubMed by disease name and KIF5C gene symbol). Deep research via the claude_code provider (openscientist non-functional here): research/Complex_Cortical_Dysplasia_With_Other_Brain_Malformations_2-deep-research-claude_code.md, preflight-dr PASS (KIF5C x16, OMIM 615282 matches MONDO - no Named Entity Confusion), reference_validation 2/3 resolved (1 unverifiable, no confabulation), term_validation clean. The report was cautious (many [unverified] flags, no snippets); all evidence was grounded in two fetched full-text papers: PMID:23603762 (Poirier 2013, Nat Genet - germline mosaic KIF5C E237V, abolished ATP hydrolysis IN_VITRO, proposed dominant-negative) and PMID:29048727 (Michels 2017, AJMG - the six-individual phenotype series, Glu237 hotspot, frontal-predominant cortical dysplasia). Dropped the initial skeleton's Lissencephaly node: Michels describes subtle dysgyria/pachygyria, not classic lissencephaly. Parental germline mosaicism was NOT bound to HP:0001442 (per the somatic-mosaicism skill, parental mosaicism is excluded). Validated with validate-disorders (23/23 snippets, 24/24 titles), validate-terms, and the offline check-* gates (entity-refs, causal-targets 10/10 phenotypes connected, gene-activity-grounding, gene-validity conflict 0/overstated 0, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, block-scalar-comments, delivery-system, folded-hyphens) - all pass. Closes claim issue #16373.

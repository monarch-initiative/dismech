  summary: 'Create: Osteofibrous Dysplasia'
  details: |
    De novo curation of osteofibrous dysplasia (MONDO:0011806) as a Mendelian entry. Pre-claim verification found the ID not bound as any entry's disease_term and not bound as a subtype_term anywhere; its two appearances in kb/ are both non-coverage, inside Adamantinoma.yaml's differential_diagnoses block, which carries its own nested disease_term, and in a radiological-differential sentence in Familial_Expansile_Osteolysis.yaml. All eight MONDO synonyms were swept against origin/main, the term is a leaf with zero children and is neither obsolete nor an obsoletion candidate, its single parent MONDO:0018230 skeletal dysplasia is unbound by any entry, no PR or issue covers the disease, and 269 PubMed records carry the exact phrase. The worktree was branched from current origin/main at zero commits behind, deliberately: the previous curation in this series failed CI on scripts/check_gene_activity_grounding.py, a gate that had landed upstream after that branch's base, and being 113 commits behind hid it from every local run. The gate is present in this checkout and the scaffold was written to satisfy it from the outset. Gene verification was done before any binding, because the stub recorded MONDO's causal gene as MET and MET is overwhelmingly associated with non-small-cell lung cancer, making it exactly the kind of attribution that deserves reading first. It checks out: PMID:26637977 identified germline MET mutations segregating with autosomal-dominant OFD in three families, abolishing splice inclusion of exon 14 and producing a receptor lacking the cytoplasmic juxtamembrane domain, and also found a somatic exon 14 mutation in unilateral disease with the same stabilising effect. Deep research: falcon was requested but has no API key here, so the run used --fallback and claude_code produced the report, which records fell_back, requested_provider and provider_attempts. This report broke the pattern of the previous four in both directions. It carried zero confabulated references: all eight cached references are genuinely about osteofibrous dysplasia, the first time in this series that no real-PMID-wrong-paper citation appeared. Its twenty-one reported label mismatches are all benign table-header artifacts, where the report wrote a column heading such as Cell type or Anatomy beside the correct ontology label, so there were no wrong CURIEs either. But its quote validation reported quotes_valid 6 of 14 checked, with eight unsupported quotes flagged against PMID:26637977, PMID:38539216 and PMID:41746735, which is the worst quote-fabrication rate seen in the series and includes the causal paper. Every quote in this entry was therefore taken from the cache files rather than from the report. Two findings reshaped the entry beyond what the stub suggested. First, PMID:41746735 establishes that OFD is a skeletal RASopathy: the METdeltaJMD receptor loses the juxtamembrane degradation signal, escapes ubiquitin-mediated turnover and acquires a ligand-dependent gain of function signalling through MAPK, and MEK inhibition restored osteogenic differentiation in both MetdeltaJMD mouse progenitors and pseudarthrosis-derived primary cells from patients, after which mirdametinib achieved fracture union in a pediatric patient with three years of persistent pseudarthrosis. That is the first targeted treatment in a disease previously managed conservatively, and it is curated with its own framing as a single treated patient on preclinical support rather than as a trial result. Second, PMID:42379271 characterises classic adamantinoma, OFD and OFD-like adamantinoma genomically and concludes they might be genetically distinct, with arm-level copy-number gains in the adamantinomas that the OFDs lacked. That bears directly on the open KNOWLEDGE_GAP discussion adam_ofd_progression_sequence in Adamantinoma.yaml and is the evidence behind this entry's scoping decision; it is quoted with the authors' own hedge and the notes say explicitly that it is an argument rather than a settlement and that the discussion there should stay open. Pathophysiology is a causal chain from MET exon 14 splice exclusion through the stabilised receptor and MAPK activation to impaired osteogenic differentiation of periosteal skeletal progenitors and impaired cortical bone development, branching into bowing and tibial pseudarthrosis. Two mouse models are linked: the MetdeltaJMD mouse RECAPITULATES the differentiation defect at CELLULAR scale with fidelity HIGH, and the Met exon 15 skipping mouse PARTIALLY_RECAPITULATES pseudarthrosis at ORGANISM scale with limitations recording that it develops no gross skeletal defect, so it speaks to the repair failure and not to lesion formation. Also recorded in notes: kb/groupings/RASopathies.yaml exists and OFD is a candidate member on this evidence, but adding it modifies another file and is left for a separate PR. Process note on my own errors. I typed reference_title values from memory rather than copying them from the cache on three separate occasions in this entry, which just validate caught each time. Rather than keep fixing instances I wrote a helper that rewrites every reference_title in the file directly from its cache file and ran it after each batch; it corrected thirteen titles in total, including two the validator had not yet reached, and backfilled six that were missing entirely. A second self-inflicted problem: splitting the chain moved the MET gene onto a node without a molecular_functions binding, which made the grounding gate fail where the scaffold had passed. GO:0004714 is now bound on the gene-bearing node as well, which the node's own evidence supports, since the causal paper states that aberrant MET regulation via the juxtamembrane domain subverts core MET receptor functions. Validation: just validate passes with 21/21 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, the gene-activity grounding gate and the batched validate-disorders all pass.

  summary: 'Pre-PR red-team review round: Osteofibrous Dysplasia'
  details: |
    Self-review round before opening the PR, run in a subagent for fresh context per step 7 of the initiate-new-disorder-creation skill. Verdict was REQUEST_CHANGES with five blocking findings, five major and eight moderate; all blocking and major items are addressed along with most moderates. Snippet count rose from 21/21 to 37/37 verified and references cited rose from 6 to 11 of the 13 available. The central finding was under-consumption with a specific cause. PMID:38539216, a 52 KB full-text narrative review of osteofibrous dysplasia already committed to the repository by the Adamantinoma PR, was cited zero times. I had skipped it because the deep-research report's quote validator flagged three quotes against it, but those flags were against the report's paraphrases rather than against the reference: every candidate sentence I tested is an exact substring of the cache. Declining the report's quotes was right; declining the reference was not. That single source supplied the prevalence figure, the natural history, the histopathology, the 25% recurrence rate and the pain frequency. PMID:41653544, also already committed and uncited, supplied the median-age figure for a distinguishing_features line that had carried no evidence item at all, plus the p40/p63 immunophenotype and the finding that four lesions diagnosed as OFD were revised to fibrous dysplasia on review. Four findings were errors rather than omissions. First, my earlier grounding fix was at the wrong node. The reviewer measured the gate and showed it depends on the molecular_functions binding of pathophysiology[0], the splicing node, not on the receptor node; so the binding I had added to satisfy it was the least defensible one, asserting transmembrane receptor protein tyrosine kinase activity with a gain-of-function modifier at a node whose substrate is an mRNA splicing event. Corrected by moving genes MET onto the stabilised-receptor node, where the molecular function claim belongs, and giving the splicing node GO:0000381 regulation of alternative mRNA splicing via spliceosome instead; the gate still reports zero findings. Second, I nearly bound HP:0002754 Osteomyelitis, which is bone infection, for the radiolucent lesion; an anchor mismatch prevented the write and the retry uses HP:0003103 Abnormal cortical bone morphology with coarse_binding_basis NO_HPO_TERM. Third, the notes quoted MONDO's definition selectively, using it to argue that OFD is not a neoplasm while omitting the definition's closing sentence that progression to adamantinoma has been reported in some cases; and PMID:8156503, cached in this PR and uncited, concludes that the findings demonstrate a clonal and possibly neoplastic origin, directly against that framing. Both are now curated in a discussions entry of kind KNOWLEDGE_GAP, the latter as a REFUTE with directness INDIRECT, and the notes now state that treating OFD as a developmental disorder is a curation decision rather than a finding. That discussions entry is also what claim issue 14016 item 5 asked for and I had not written; it cross-references adam_ofd_progression_sequence in Adamantinoma.yaml so the open question is visible from both entries, and its rationale states the evidence on both sides. Fourth, the defining lesion was absent from the entry altogether: there were two phenotypes, both downstream consequences, while the description referred to a lesion that appeared nowhere. It is now a phenotype sourced from the causal paper's own definitional sentence. Further fixes: three bindings replaced with more specific precedented ones, HP:0002982 Tibial bowing, UBERON:0013280 diaphysis of tibia and CL:0020016 osteochondral skeletal stem cell; evidence_source corrected from HUMAN_CLINICAL to OTHER on an introductory background sentence in a mouse-model paper that presents no human clinical data on bowing; the unsourced claim that painless bowing is the usual presentation replaced with the sourced 25 to 50 percent pain frequency; a genetic section that implied MET causes OFD corrected to record that the same paper describing the gene calls the disease typically sporadic, that no other genetic cause is established, and that single-case CDK12, DDR2, KMT2A, KMT2D, PHOX2B and RIF1 findings exist without being curated as causal; histopathology added with the storiform stroma and osteoblastic rimming and the keratin-immunoreactive cells, including that pan-keratin does not discriminate OFD from adamantinoma while p40 and p63 do; prevalence and progression sections added; fibrous dysplasia and OFD-like adamantinoma added as differentials, the former being the differential most likely to be confused in practice and the one this entry's own synonym cortical fibrous dysplasia invites; the inferred mouse-exon-15 to human-exon-14 correspondence removed, since the paper states none; and the priority claim that this is the first targeted treatment removed, since no cited source says first. Process notes on my own errors. Twice a batched edit script raised an assertion on a late fix and never reached its write, silently discarding earlier fixes the script had already reported as applied; I only caught it by grepping the file for what was actually present, and switched to writing after each individual fix. I also typed reference_title values from memory on three further occasions in this round; the helper that rewrites every title in the file from its cache corrected four more, including two the validator had not yet reached. The final title audit reports 37 titles with zero mismatches. Validation after the round: 37/37 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, the gene-activity grounding gate and the batched validate-disorders all pass.

  details: |
    Second review round on PR #14790, answering the ai4c-reviewer CHANGES_REQUESTED verdict and the one failing CI gate together.

    The failing gate was check-snippet-length, on a four-word snippet 'Pain (25%~50%) or painless' under the Tibial bowing phenotype. The reviewer had independently flagged the same snippet for a different reason: it is about pain and was filed under bowing. Both are answered by removing it, and pain now has its own phenotype with a propositional quote.

    Blocking items addressed:

    1. Added two phenotypes that the cited review gives frequencies for, and wired both. Bone pain (about 31%, FREQUENT) is a sequela of the intracortical lesion. Pathologic fracture (about 19%, OCCASIONAL) is downstream of Impaired Cortical Bone Development, with Tibial pseudarthrosis as its sequela, so the fracture now sits between the cortical defect and the pseudarthrosis rather than being implied. Tibial bowing gained its 13% frequency from the same sentence. Phenotype causal connectivity went from 2/3 to 5/5.

    2. Added a diagnosis section with three entries: plain radiography as the primary modality, computed tomography for cortical extent (bound NCIT:C17204), and adequate-volume biopsy to exclude adamantinoma. The biopsy entry carries the sampling-error point, which is the practical counterpart of the adamantinoma differential this entry argues.

    3. Added surgical treatment (curettage, extraperiosteal excision, corrective osteotomy) bound to NCIT:C15329 with therapeutic_modality SURGERY, target_mechanisms pointing at the fracture node, and the 25% recurrence figure as the counterweight that keeps conservative management the default.

    4. Regraded the PMID:39042586 quote under Tibial bowing from evidence_source OTHER to HUMAN_CLINICAL with quote_role BACKGROUND. It is a background sentence in a mouse paper stating the human clinical picture, which is the case CLAUDE.md records under issue #10262; OTHER discarded both facts.

    5. Rebound the cell type on Impaired Osteogenic Differentiation of Skeletal Progenitors from CL:0020016 osteochondral skeletal stem cell to CL:0007001 skeletogenic cell. CL:0020016 names a defined ocSSC population with marker, clonogenicity and non-adipogenic criteria that neither cited source claims; PMID:41746735 says 'skeletal progenitor cells' and 'periosteal progenitor cells'. CL:0007001 is defined as a cell with the potential to form a skeletal cell type, naming periosteum in its own definition, so it is the most specific accurate term. Searched OLS for osteoprogenitor, periosteal, osteoblast precursor and skeletal stem; CL:0007010 preosteoblast was rejected because the sources describe progenitors failing to become osteoblasts rather than preosteoblasts.

    Suggestions taken: Conservative Management therapeutic_modality BEHAVIORAL to OTHER, since watchful waiting with imaging is not a behavioural intervention; two process-narration passages removed, one from the MEK treatment description and one from the entry notes, keeping the durable fact that OFD is a candidate member of kb/groupings/RASopathies.yaml.

    Suggestion declined: incomplete penetrance in the four-generation family. No cached reference contains a quotable sentence on penetrance. PMID:26637977's cache is abstract-only at 3.5 KB and contains no match for penetran, unaffected, carrier or generation, and no other cached reference mentions penetrance. Recording the claim would mean writing it without a source.

    Also declined: the StatPearls chapter PMID:33085428 reported by check-genereviews as UNTAGGED_CHAPTER. CLAUDE.md states StatPearls is never a baseline and its absence is never a gap; every claim it would cover is already on primary sources. check-genereviews confirms NO_CHAPTER for GeneReviews proper, so no mandatory baseline is missing.

    One change was made before the review arrived, from just list-disconnected-phenotypes: the Intracortical radiolucent lesion phenotype was ISOLATED, with nothing in the graph pointing at it, so an edge was added from Impaired Cortical Bone Development citing the PMID:26637977 sentence that names OFD a disorder of osteogenesis characterised by radiolucent cortical lesions.

    Validation: just validate passes including term validation over all five newly bound terms; snippets 38/38 to 49/49 verified against the committed caches; 49 reference titles checked with 0 mismatches; check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes and check-enum-values all pass; check-snippet-length reports no finding in this entry. cache/cl/terms.csv and the celltypeterm enum cache gained rows for CL:0007001 and are staged.

    Note on local gate runs: this branch is 489 commits behind origin/main, so check-snippet-length, check-snippet-grading and check-gene-activity-grounding each report findings locally in --against-ref mode that belong to this branch's stale copies of unrelated entries. None is in this entry and none is in a file this branch touches. CI evaluates the merge result, where those entries take main's newer versions, which is why the CI run surfaced only the one snippet-length finding in this file.

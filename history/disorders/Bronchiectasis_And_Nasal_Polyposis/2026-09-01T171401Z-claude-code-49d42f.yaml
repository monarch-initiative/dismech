  summary: 'Create: Bronchiectasis and Nasal Polyposis (WFDC2 deficiency)'
  details: |
    Curated the WFDC2-deficiency entry, a Mendelian sinopulmonary disease first defined in 2024, from primary literature plus an OpenScientist deep-research run. Seven pathophysiology nodes run from biallelic WFDC2 loss through failed glycosylation and secretion, depletion of the protein from airway surface liquid, an altered antiprotease milieu, chronic Pseudomonas infection, to bronchiectasis and nasal polyposis. A seventh node records mucociliary clearance as an explicitly excluded step, carrying REFUTE evidence: ciliary beat, ciliary length, epithelial and centrosome composition and mucus viscosity are all normal and patient cultures generate directed transport, so the mechanism by which CF and PCD cause bronchiectasis does not apply here. Two knowledge gaps model what follows from that, one on the unexplained route from secreted-protein loss to airway destruction and one on ascertainment, since low nasal nitric oxide gives these patients a positive PCD screening result and terminates the workup at the wrong answer. Validation: 32/32 snippets verified, all 32 reference titles audited programmatically against cache frontmatter, terms validated, all ten qc gates clean.

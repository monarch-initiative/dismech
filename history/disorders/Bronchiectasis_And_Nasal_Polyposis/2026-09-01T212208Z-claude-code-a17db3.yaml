  summary: 'Address review round 1: correct the Vietnam evidence inversion'
  details: |
    Addressed the critical finding and all five content findings from the first review. The critical one: three passages cited PMID:41094464 as a third geographic replication when it is an explicitly negative screen, which sequenced all three WFDC2 coding exons in 31 patients with extensive bronchiectasis and found no variants. Worse, that inverted citation was the support for the entry's own under-ascertainment knowledge gap. Vietnam removed from all three passages and the negative screen re-framed as the constraint the open question must answer to, with the finding quoted as REFUTE. Corrected three phenotype frequencies against the founding cohort: bronchiectasis OBLIGATE to VERY_FREQUENT with the explicit counter-case quoted, nasal polyposis VERY_FREQUENT to OBLIGATE, Pseudomonas infection FREQUENT to VERY_FREQUENT, and replaced the Pseudomonas snippet, which had quoted the paper's recruitment criterion rather than a frequency finding. Added six phenotypes present in the cohort but missing from the entry: nasal pyramid broadening, otitis media, female infertility with independent Korean replication, neonatal respiratory distress, reduced FEV1 and very low nasal nitric oxide. Rebound the Pseudomonas phenotype from the general HP:0002205 to HP:5210057, whose dynamic-enum membership validate-terms confirms. Added Woakes syndrome as a differential with the relationship left explicitly open. Renamed the mucociliary node to state its finding and aligned each evidence item's direction to the renamed claim. While making these edits a reference_title was again typed from memory and was wrong; the cache audit caught it and all 45 were re-derived. Validation: 45/45 snippets, 45/45 titles, all gates clean.

  summary: Add WFDC2-null mouse HUMAN_MODEL_MISMATCH (#10435)
  details: |
    Added an animal_models entry for the Nakajima et al. 2019 Wfdc2-null mouse (PMID:31562139), linked via modeled_mechanisms as FAILS_TO_RECAPITULATE against pathophysiology#Preserved Mucociliary Clearance (impaired cilia and absent mature club cells, versus the human finding of normal ciliary structure and clearance). Added a HUMAN_MODEL_MISMATCH discussion asking whether the murine ciliary/alveolar phenotype reflects a mechanism the human measurements missed or a genuine species divergence, citing both the founding human paper's own species-sequence-difference hypothesis (PMID:38626355, quote_role-appropriate as an inference) and a second, independently generated Wfdc2-null mouse line (Zhang et al. 2020, PMID:31780266, TALEN-mediated deletion, type-I alveolar cell apoptosis) as corroborating evidence that murine Wfdc2 loss is uniformly lethal via more than one lesion. Both PMIDs (31562139, 31780266) were newly fetched and cached via 'just fetch-reference'; their exact citations (refs 40 and 41 of PMID:38626355) were confirmed via the primary paper's PMC reference list rather than assumed from the summarizing sentence. Fixes dismech#10435.

  summary: 'Review round: scope WFDC2 mouse mismatch to measured human airway findings'
  details: |
    Addressed review of PR 12548. The HUMAN_MODEL_MISMATCH rationale now limits 'absent in humans' to what was measured in WFDC2-deficient individuals (ciliary length, beat frequency and coordination, cilia and centrosome composition, mucus viscosity, directed transport) and states that the alveolar lesions of the two mouse lines were not assessed in humans. Added PMID:38626355 evidence that cell morphology and fate were inspected informally with no obvious change (IN_VITRO, patient airway cultures). Split the single proposed experiment into an airway club-cell maturation readout (SCGB1A1 in bronchial ALI cultures) and an alveolar readout (patient iPSC-derived AT2 cells), and corrected the direction so an abnormal outcome would_refute pathophysiology#Preserved Mucociliary Clearance. Regraded the species-linker sentence to OTHER, changed 'survive to adulthood' to 'survive the neonatal period', and cited PMID:38626355 in the model link limitations.

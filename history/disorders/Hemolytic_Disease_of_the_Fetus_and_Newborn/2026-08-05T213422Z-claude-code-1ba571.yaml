  summary: 'Create: Hemolytic Disease of the Fetus and Newborn'
  details: |
    New entry created for issue #7837 (obstetrics coverage gap). Modelled as a two-organism alloimmune disease: maternal fetomaternal-hemorrhage exposure and alloantibody production, an atomic FcRn-mediated transplacental IgG transfer node (the nipocalimab target), then the fetal/neonatal arm through erythrophagocytosis, fetal anemia, hydrops, neonatal hyperbilirubinemia and kernicterus. Two mechanistic_hypotheses groups curated: the CANONICAL Rh destruction arm and an ALTERNATIVE Kell erythroid-progenitor-suppression arm, converging on the same fetal-anemia node; only the destruction arm declares conformance to hemolytic_anemia_erythrocyte_destruction. Four discussions recorded, including a HUMAN_MODEL_MISMATCH on the unresolved murine-derived mechanism of anti-D prophylaxis and a KNOWLEDGE_GAP on the nipocalimab historical-benchmark comparator (the efficacy claim is marked PARTIAL pending AZALEA). Validation: just validate, just validate-terms and just validate-references all pass; 81/81 snippets verified against cached references. 15 new PMIDs fetched with just fetch-reference.

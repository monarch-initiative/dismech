  summary: 'Address review findings 1, 2, 8 on PR #8053'
  details: |
    PR Shepherd follow-up commit on PR #8053, addressing the three reviewer findings that were unambiguous and inside curation scope.

    (1) Frequency band (finding 1). The phenotype "Neurodevelopmental Impairment After Intrauterine Transfusion" cites a 4.8% incidence from the LOTUS study (PMID:22030316) but was banded OCCASIONAL. Per the FrequencyEnum definitions in src/dismech/schema/dismech.yaml, OCCASIONAL is 5-29% and VERY_RARE is <5%, so 4.8% belongs in VERY_RARE. Corrected the band and the evidence explanation, which had asserted the OCCASIONAL mapping in prose.

    (2) Missing clinical_trials block (finding 2). Added the two nipocalimab trials that the entry already discusses in prose, in the treatments section, and in the exp_hdfn_azalea_randomised_readout proposed experiment: NCT03842189 (UNITY, PHASE_II, COMPLETED) and NCT05912517 (AZALEA, PHASE_III, RECRUITING). Phase and status were read from the ClinicalTrials.gov v2 API rather than inferred from the prose. Registry snippets are exact quotes from cache files created by `just fetch-reference`; both trials also carry their publication evidence, with the UNITY readout marked PARTIAL so the historical-benchmark caveat the entry makes elsewhere is preserved rather than quietly upgraded. Note that PMID:39115062 is the UNITY readout and PMID:39197469 is the AZALEA design paper - the titles run counter to what the numbering suggests, and the pre-edit validation hook caught an initial draft that had them transposed.

    (3) Anti-D route term (finding 8). Anti-D immunoglobulin prophylaxis was bound to NCIT:C121331 Intravenous Immunoglobulin Therapy, which asserts an intravenous route for a product that is routinely given intramuscularly. Rebound to the route-neutral NCIT:C62710 Immunoglobulin Therapy, already an established member of the treatment-action enum, so no term-cache change was needed. The specific agent remains carried by therapeutic_agent (NCIT:C80832 Human Rho(D) Immune Globulin).

    Deliberately not addressed, and left for the entry author: findings 3-6 (claim-evidence alignment on the kernicterus phenotype, the Bilirubin Neurotoxicity node description, the positive DAT phenotype, and extramedullary hematopoiesis) each require sourcing a different reference or making a mechanism-model judgement, not a mechanical correction; and finding 7 (no deep-research artifact in research/ for a new entry) is a provenance decision for the author to make or justify.

    Validation: `just validate kb/disorders/Hemolytic_Disease_of_the_Fetus_and_Newborn.yaml` passes schema, term and reference validation with 85/85 snippets verified against cached references (81/81 before this change, plus the four new evidence items).

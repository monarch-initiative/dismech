  summary: 'Genetics pass: gene wiring (#12198)'
  details: |
    Genetics pass for issue #12198 (d2g wiring-009). MONDO records one gene for this disease, RHD, and
    it was already present. The work here was pathograph reach, one added locus, and a correction to
    the reasoning recorded on the existing relationship types.

    Wiring. None of the three existing genetic records reached a pathophysiology node. Bound
    RHD/RHCE/KEL onto "Fetomaternal Hemorrhage and Exposure to Paternally Inherited Red Cell Antigens"
    and onto "Maternal Alloimmunization and IgG Alloantibody Production", KEL onto "Anti-Kell
    Suppression of Fetal Erythroid Progenitors", and FCGRT onto "FcRn-Mediated Transplacental IgG
    Transfer", whose description already said "encoded by FCGRT" without binding it.

    RHCE added. Not on MONDO's list; added because the entry's own alloimmunisation node already named
    anti-c and anti-E as clinically major without a locus behind either. Evidence is two population
    series the entry already cited: the Icelandic nation-wide study, in which anti-E was the commonest
    clinically significant maternal specificity, and the United States prevalence study, which counts
    anti-c among the high-risk antibodies. The gene name is HGNC's own, "Rh blood group CcEe antigens".

    Relationship typing. The existing SUSCEPTIBILITY values are right and were kept, but the RHD
    record justified the value with a sentence that contradicted it - that this was "not a heritable
    susceptibility in the affected individual" - which was both a non-argument for choosing
    SUSCEPTIBILITY and wrong on the facts, since the genotype in question is the fetus's and is
    inherited. Rewrote that sentence and added a "Blood-group loci in genetic:" paragraph to the
    entry's top-level notes setting out the shared reasoning: no pathogenic variant is involved, the
    relevant allele is the ordinary antigen-positive one, and the fetal genotype is necessary but far
    from sufficient because disease additionally requires a discordant maternal genotype, maternal
    sensitisation and maternal IgG. The paragraph also records the modelling limit that SUSCEPTIBILITY
    is being used in a sense the enum description does not anticipate, because the other genetic
    factor lives in a second genome and the schema's gene-disease relationship is single-genome.

    Dispositions recorded in the same paragraph: FCGRT stays UNKNOWN (molecular identity of the
    transfer step and the nipocalimab target, no genotype-disease association asserted), and ABO stays
    out of genetic: because ABO HDN is curated in this entry as a differential and not as a subtype.
    An uncited StatPearls chapter fetched during the pass was deleted rather than left in the cache.
    Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches and validate-disorders.

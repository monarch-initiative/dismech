  summary: 'Address review findings 3-6: claim-evidence alignment'
  details: |
    PR Shepherd pass on PR #8053 addressing the four still-open claim-evidence alignment findings from the ai4c-reviewer re-review of fec55b2c.

    Finding 3 (Kernicterus phenotype): HP:0001343 was backed only by PMID:25577653's clause "which can occur in the absence of classical kernicterus", which is about BIND occurring WITHOUT kernicterus and never links kernicterus to HDFN. Fetched PMID:39905388 (Maurice et al., systematic review of HDFN patient burden) and added its statement that HDFN "can lead to severe forms of neonatal hyperbilirubinaemia and kernicterus" as the primary support. The PMID:25577653 item is retained but downgraded to supports: PARTIAL with an explanation saying explicitly that it supplies spectrum context, not the disease-phenotype link. The description's unsourced "basal ganglia and brainstem auditory nuclei / choreoathetoid cerebral palsy / auditory neuropathy" was narrowed to what the new anatomical citation supports.

    Finding 4 (Bilirubin Neurotoxicity and Kernicterus node): the description asserted deposition in basal ganglia, hippocampus and brainstem auditory nuclei plus a specific sequelae list, while the only evidence item supported the total-serum-bilirubin biomarker caveat in the final sentence. Fetched PMID:25745520 (Sari et al., MRI/MRS in 48 children with kernicterus), whose abstract names "pathological bilirubin staining of the basal ganglia, brain stem, and cerebellum"; narrowed the description to those three regions (hippocampus dropped - not supported by any cached reference). Added a second PMID:25577653 snippet enumerating the six BIND clinical domains, and rewrote the sequelae clause to those domains instead of the previously unsourced specific diagnoses.

    Finding 5 (Positive Direct Antiglobulin Test): HP:0020026 was backed by a PMID:36469119 snippet that never names the test. Fetched PMID:41965236 (Bhardwaj et al.), whose abstract states the neonate's DAT "was strongly positive for IgG, and eluate testing confirmed anti-D specificity, indicating that maternal anti-D was coating the neonate's RBCs" - naming both the test and the mechanism it demonstrates. Also fetched PMID:40252497 (Sekhar Das et al.) for the cohort-level anchor: DAT positivity due to IgG1 or IgG3 in 15/20 (75%) HDFN cases. The original PMID:36469119 item is retained as background.

    Finding 6 (Extramedullary Hematopoiesis with Hepatosplenomegaly): HP:0001978 was backed only by a synonym-mention quote ("also known as Erythroblastosis fetalis"). Fetched PMID:3189438 (Nicolaides et al., 127 pregnancies complicated by red blood cell isoimmunization), which states that "recruitment of extramedullary sites occurs when anemia is severe" and that "Extensive hepatic erythropoiesis may be the cause of fetal hydrops in red blood cell isoimmunization", plus a second snippet on the exponential rise in erythroblast count with fetal anemia. The PMID:34675752 synonym item is retained but downgraded to supports: PARTIAL with an explanation stating it evidences the synonym only.

    Validation: just validate (92/92 snippets verified, up from 85/85), just validate-references (92/92), just validate-terms (passed), uv run pytest tests/test_data.py -k Hemolytic_Disease_of_the_Fetus (9 passed), just check-term-cache-integrity and just check-reference-cache-frontmatter (both OK). No new ontology terms were introduced, so no cache/*.csv churn.

    Scope note: running just validate-references rewrote the reference_id frontmatter quoting in 7778 unrelated references_cache/*.md files. That churn was reverted with git checkout -- references_cache/ before committing; only the five newly fetched cache files are included. This is the same cosmetic re-quoting pattern flagged in the review of PR #7898.

    Not addressed: finding 7 (no deep-research artifact in research/) is answered in a PR comment rather than by curation, per the reviewer's own note that a sentence of explanation suffices. Suggestions 9 (biochemical block) and 10 (HP:0001433 Hepatosplenomegaly) are left for the entry author.

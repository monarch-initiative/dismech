  summary: 'Create: Craniometadiaphyseal Osteosclerosis with Hip Dysplasia'
  details: |
    New entry for the AXIN1-related recessive sclerosing bone dysplasia (MONDO:0957832, OMIM 620558), expanded from the queue skeleton; the stub was deleted.

    Sources. The disorder is known from one report of seven individuals in four families (Terhal et al. 2023, PMID:37582359). The reference fetcher declines that paper's full text (publisher-free licence), so only its abstract is quoted. Anemia, pancytopenia, the bone-biopsy finding and the overlapping syndromes are cited from the OMIM definition as reproduced on the MedGen page for the disorder, cached as url:https://www.ncbi.nlm.nih.gov/medgen/1844026/ and graded OTHER / REVIEW_SYNTHESIS. Further features that appear only in OMIM's clinical synopsis list (for example hypertelorism, septal defects, sandwich vertebrae) are named in notes but not curated as phenotypes, because no quotable sentence states them.

    Deep research. The OpenScientist report (research/Craniometadiaphyseal_Osteosclerosis_With_Hip_Dysplasia-deep-research-openscientist.md) was read in full. Its 12 references all resolved; its term-validation mismatches are all frequency-column text parsed as labels, not wrong CURIEs. just preflight-dr against MONDO:0957832 returned PASS (AXIN1 named 61 times). Used from it: PMID:37582359, PMID:9230313 (Axin as a Wnt inhibitor) and PMID:41408477 (TMEM53 craniotubular dysplasia, as a differential). Not used: the hepatocellular carcinoma papers (PMID:42237887, PMID:39653061, PMID:40344393), because somatic AXIN1 loss in cancer is outside this entry; PMID:33824347 and PMID:39084544, because the TMEM53 review abstract (PMID:41408477) states the differential more directly; PMID:18981475 and PMID:26763102, which are general osteoblast Wnt biology. The report's specific variant names, macrocephaly SD range, age range and XAV939 doses come from the full paper and could not be checked against a quotable source, so they were not carried over.

    Curation choices. The chain runs from biallelic C-terminal truncation to reduced AXIN1 protein and impaired DIX-domain polymerization, then to increased basal canonical Wnt signalling (INCREASED rather than GAIN_OF_FUNCTION, since the truncated protein keeps partial inhibitory activity), then to an osteoblast-osteoclast coupling node that reaches the two sclerotic phenotypes. The coupling node is PROVISIONAL and grouped under an EMERGING hypothesis because the human evidence is a biopsy summary and the mouse model (Osx-Cre Axin1 deletion, PMID:32821442) is a complete conditional knockout whose phenotype is delayed bone growth rather than osteosclerosis. Hip dysplasia, heart malformations, developmental delay, macrocephaly and the hematological findings have no sourced upstream node and are recorded in a knowledge-gap discussion. No treatment is curated because no source reports management of patients; the tankyrase-inhibitor result is recorded as an experimental-model readout and a discussion, with the RNF146 mouse (PMID:28581440) as a caution that stabilizing AXIN1 in normal osteoblasts causes osteopenia.

    Checks. just check-genereviews --online: NO_CHAPTER. The ClinGen gene-validity download has no AXIN1 row. just validate, validate-terms and count-verified-snippets pass on the entry; just validate-disorders was run on the file before hand-off.

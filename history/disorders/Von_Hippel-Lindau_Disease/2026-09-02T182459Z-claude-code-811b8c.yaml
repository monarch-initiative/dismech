  summary: 'Integrate assessed OpenScientist findings: HIF isoform split, type 2C,
    3p co-drivers, gaps'
  details: |
    Assessed the OpenScientist report for canonical_vhl_hif_pseudohypoxia_tumor_model (verdict SUPPORTED; sidecar at kb/hypotheses/Von_Hippel-Lindau_Disease/canonical_vhl_hif_pseudohypoxia_tumor_model/assessments/openscientist-assessment-by-claude-opus-5.yaml) and integrated its RETAINED and QUALIFIED claims. The entry's mechanistic_hypotheses notes already recorded the report's four qualifications but carried no citation for any of them; every PMID below was absent from the entry before this edit and each snippet was re-derived from references_cache rather than copied from the report. Added to mechanistic_hypotheses evidence: PMID:22037472 (HIF1A as a 14q kidney cancer suppressor, backing qualifier 1), PMID:36253570 (VHL loss often insufficient without a 3p chromatin-modifier co-deletion, backing qualifier 3), PMID:21131975 (EPAS1 GWAS locus for sporadic RCC). Added PMID:12050673 (VCB-hydroxyproline crystal structure) to the Loss of HIF Degradation node and PMID:31727677 (PT2385 G323E gatekeeper resistance, marked directness INDIRECT) to Constitutive HIF Activation, whose description now states the HIF-2alpha/HIF-1alpha split explicitly. Two new pathophysiology nodes with incoming edges from VHL Tumor Suppressor Loss: HIF-Independent pVHL Function Loss (evidence PMID:11331613, downstream Pheochromocytoma) and Chromatin Remodeler Co-Driver Loss (evidence PMID:39965361 and PMID:41915349, downstream Clear Cell Renal Cell Carcinoma, bound to GO:0006338). Added PMID:9787178 to the VEGF Overexpression and Angiogenesis node, grounding the erythropoietin arm of the hypothesis: EPO and VEGF mRNA co-localize by in situ hybridization to the neoplastic stromal cells of all 11 hemangioblastomas examined, with EPO absent from glioblastoma controls. Added PMID:38849055 and PMID:41124218 to the Belzutifan treatment, which previously cited only the RCC trial. New discussions section with four entries covering the report's Knowledge Gaps 1-4: tissue tropism (with a proposed single-cell experiment), the unknown type 2C HIF-independent effector, mouse models missing the human tumor spectrum (HUMAN_MODEL_MISMATCH, PMID:22763871), and belzutifan response determinants (PMID:31727677 and PMID:41874563). Deliberately not integrated: the Chuvash polycythemia no-tumor-predisposition claim, because its cited source PMID:23015148 is a glucose-metabolism study that reports neither pulmonary hypertension nor absence of tumors; the TBK1 vulnerability, because PMID:41997114 is a commentary previewing an uncited primary study and the report grades it as in vitro primary data; the roughly 95 percent penetrance by age 60 and 86-89 percent biallelic inactivation figures, which carry no citation anywhere in the report; GO:0061418, which is in neither the label cache nor the biological-process enum cache here; and CL:0002306, whose canonical label differs from the report's. Status left CANONICAL, as the report itself recommends. Verified with count-verified-snippets (43/54, up from 28/39, every new snippet verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-hypothesis-assessment.

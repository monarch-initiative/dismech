  summary: 'Review round 2: add organ-level phenotypes from the author manuscript,
    remove session narration'
  details: |
    Addresses both blocking items of the second review round on dismech#18385.

    Organ-level phenotypes added, from a source the entry had wrongly written off. The round-1 note said the per-patient situs data was not reachable from this repository's cache. That was true of the PubMed record, which is abstract-only even after a forced re-fetch, and false of the study as a whole: the author manuscript is deposited open-access at HAL and carries the cohort breakdown. OpenAlex lists two open copies, at HAL and at Oskar-Bordeaux. The HAL copy is now cited as a url: reference, fetched and cached as full_text_pdf, which is established practice in this repository.

    From it: of the 21 cases, 8 had situs solitus with or without isolated dextrocardia, 5 had situs ambiguus, 8 had situs inversus totalis, and nearly all had congenital heart defects. Added Congenital heart defect (HP:0001627 Abnormal heart morphology, VERY_FREQUENT), Situs inversus totalis (HP:0001696, FREQUENT) and Dextrocardia (HP:0001651, no frequency because the source groups it inside the situs solitus count). The existing Heterotaxy row keeps HP:0030853 and its description now carries the breakdown, since HPO has no separate situs ambiguus term. All four are wired as downstream targets of Failure of Left-Right Axis Determination. Every HP identifier was looked up in OLS rather than copied from the deep-research report, whose gene identifiers are already known to be unreliable on this entry.

    The manuscript's PDF text carries the typeset line numbers at the end of each line, so the situs snippet bridges them with the validator's two-dot syntax. The bridged spans are line numbers, which no claim depends on.

    The cardiac lesion counts the review listed from HPO annotations, double outlet right ventricle, complete atrioventricular canal defect, atrial septal defect and the rest, are not added. They come from HPO's annotation set rather than from a quotable sentence, and the manuscript does not tabulate them in the text available here, so the entry records the general cardiac finding rather than specific malformations it cannot quote.

    TOUT-DE-TRAVERS and TDT added to synonyms. The manuscript names the gene that way, from the French for all upside down, so a search on the published symbol CIROP would miss work published under the manuscript name.

    Session narration removed from notes. Three passages described the curation session rather than the disease: the forced re-fetch and its result, the account of the signal-peptide claim being removed, and the OpenScientist timeout and fallback history. All three are already in the round-1 history record. What remains in notes is subject matter: where the clinical phenotypes come from and why they are cited to the manuscript rather than the abstract, the line-number artefact, the TDT naming, why zygosity is unset, the IEA basis of the GO:0004222 binding, the CIROP versus CIROZ warning, and the report's wrong gene identifier as a warning to a future reader rather than as a record of what this session did.

    Validation: just validate passes with 17 of 17 snippets and 17 titles verified, up from 13; just validate-terms passes.

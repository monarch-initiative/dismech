  summary: 'Create: Heterotaxy Visceral 12 Autosomal'
  details: |
    New entry for visceral heterotaxy 12 (MONDO:0859222, OMIM 619702, CIROP), curated from PMID:34903892 (the comparative-genomics screen that found and named CIROP, with its zebrafish and Xenopus epistasis work and 21 human patients) and PMID:39513328 (a consanguineous heterotaxy cohort listing CIROP among established autosomal recessive heterotaxy genes). The session nearly curated the wrong gene. A literature search for CIROP surfaces PMID:39753129, a 2025 report that bi-allelic inactivation of CIROZ, previously C1orf127, causes heterotaxy with congenital heart defects. CIROZ and CIROP are different genes from the same left-right organizer module, reported by the same group, and that paper was cached and read before the identity was checked. Querying MONDO for the causal gene of MONDO:0859222 returned CIROP with OMIM 619702, which is PMID:34903892, not the CIROZ paper. Nothing from the CIROZ report is used in the entry, the distinction is recorded in the gene notes and in entry notes, and CIROZ-related heterotaxy is listed as a differential diagnosis. This is the Named Entity Confusion failure that just preflight-dr exists to catch, reached through a plain literature search rather than a deep-research report. The pathophysiology is a five-node chain whose value is where it places the lesion: CIROP acts downstream of the leftward cilia-driven flow and upstream of DAND5, the first asymmetrically expressed gene, and on the left side only, so the cilia and the flow are intact and what fails is the conversion of flow into a side-specific signal. That is what separates this disease from the ciliopathic laterality disorders, and the differential records it. No organ-level phenotypes are recorded: the source describes its patients as presenting with recessive situs anomalies without breaking that down in the cached abstract, so only Heterotaxy is bound. Validation: just validate-disorders passed with 11 of 11 snippets and 11 titles verified; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules and check-genereviews all pass. The OpenScientist report for this disease is in the third batch after the timeout failures described in dismech#10387, and will be reconciled against the entry before the pull request is opened.

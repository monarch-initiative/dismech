  summary: 'Review round 1: replace contradictory GO term, source DAND5 step, drop
    unsourced claims'
  details: |
    Addresses the first review round on dismech#18385 in a single push.

    Blocking item, the contradictory GO term. The node Failure of Left-Sided Signal Transduction Downstream of Leftward Flow bound GO:0060294 cilium movement involved in cell motility with no modifier, which asserted in machine-readable form the ciliopathic mechanism that the node's own description and the differential rule out. It is replaced by GO:0003127 detection of nodal flow with modifier DECREASED. That term's definition is the series of events by which an endogenous stimulus is received by a cilium on a cell and converted to a molecular signal contributing to left/right asymmetry, which is exactly what this node says fails: the flow is intact and its conversion into a side-specific signal is not. The three candidates the review offered were checked in OLS rather than taken on trust, and GO:0070986 left/right axis specification was passed over as near-duplicative of the GO:0007368 binding two nodes downstream.

    Evidence grading. The comparative-genomics screen sentence is regraded from HUMAN_CLINICAL to COMPUTATIONAL, since it describes an in-silico search for genes lost during vertebrate evolution. The gene-disease claim itself continues to rest on the 21-patient sentence, which stays HUMAN_CLINICAL.

    Claims the source does not make. The signal-peptide clause is removed from the lesion node. The CIROP report says only that the five genes its screen found encode extracellular proteins; the signal-peptide description belongs to CIROZ, whose own report (PMID:39753129) describes a signal peptide followed by three zona pellucida N domains, so the claim was most likely carried across from the neighbouring gene this entry already warns about. That is recorded in the notes. The DAND5 Nodal-antagonist step is now sourced rather than asserted: PMID:20381352 identifies the Nodal inhibitor Coco, the Xenopus ortholog of DAND5, as the critical target of leftward flow, quoted as a SUPPORT item graded INDIRECT because applying the ortholog result to DAND5 is an inference step. The node description says so explicitly.

    Full text. just fetch-reference PMID:34903892 --force was run to try to reach the per-patient situs table the review suggested mining. It returned abstract_only again, so no organ-level phenotypes are added and the notes now record the attempt and its result rather than leaving the omission unexplained. For the same reason zygosity HOMOZYGOUS is removed from the lesion node: the source supports biallelic, not homozygous in every patient, and the entry should not exclude compound heterozygotes it has no evidence against.

    Duplicated binding. The GO:0007368 binding on Loss of CIROP Activity at the Ciliated Left-Right Organizer is dropped. That node records where the protease acts rather than a process outcome, and the left-right determination terms belong on the nodes that record the failing process.

    CIROZ differential. It now carries evidence: the sentence reporting 16 individuals from 10 families with bi-allelic CIROZ inactivation variants causing heterotaxy with congenital heart defects. The explanation states that the citation anchors the differential only and that nothing from that report is used in the mechanism, which was the review's stated preference.

    Molecular function. GO:0004222 metalloendopeptidase activity with modifier LOSS_OF_FUNCTION is bound on the lesion node, which fixes the failing check-gene-activity-grounding run. The notes record that this is UniProt's InterPro-derived electronic annotation for CIROP (A0A1B0GTW7) rather than a demonstrated activity, consistent with the report calling CIROP a putative protease with hitherto unknown functions, and that no substrate is known.

    Deep research. research/Heterotaxy_Visceral_12_Autosomal-deep-research-claude_code.md is added. OpenScientist failed on every attempt in this batch, first on client-side timeouts (dismech#10387) and then on a server-side stream idle timeout (dismech#18386), and --fallback does not engage on a runtime failure, so the provider was switched to claude_code by hand. just preflight-dr against MONDO:0859222 returns WARN: CIROP is the canonical MONDO gene with 253 mentions, but the report prints HGNC:53647 beside the symbol REST at line 1633, where hgnc:53647 is CIROP and REST is hgnc:9966. That is the Named Entity Confusion risk this entry was already guarding against, so the warning is recorded in the notes and every identifier in the entry was read from HGNC and MONDO directly rather than copied from the report.

    Validation: just validate passes with 13 of 13 snippets verified; just validate-terms passes.

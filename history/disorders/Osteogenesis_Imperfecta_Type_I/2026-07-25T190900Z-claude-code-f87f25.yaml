  summary: 'Review: evidence_source and snippet-quality fixes (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: (1) all six ORPHA:666 evidence items used evidence_source HUMAN_CLINICAL; retagged OTHER to match the convention used for Orphanet structured-database rows in every other file reviewed (Marfan 32/32, Stickler 38/38, vEDS 2/2, cEDS 4/4). (2) Three snippets were mid-sentence line-wrap fragments that validated as substrings but cut off before the clause their explanation relied on - replaced with clean sentences from the same cached abstracts: Osteoporosis / PMID:23529829 (was 'year, one-half of which affected the tibia/fibula. Long-bone fracture rate was'), Wormian Bones / PMID:34688943 (was a fragment with unbalanced parentheses), Bone Pain / PMID:30191258 (was a truncated list). Deferred to issue #6951: ORPHA:666 is the whole OI spectrum rather than type I, yet five phenotypes adopt its band as the type I frequency and mark it SUPPORT, while Hyperhidrosis in the same file explicitly declines to do so for exactly that reason. Type I is the mildest OI form, so importing spectrum-level bands likely overstates severity-linked phenotypes; needs a curation policy. Validated with linkml-validate and an offline snippet-vs-cache substring check.

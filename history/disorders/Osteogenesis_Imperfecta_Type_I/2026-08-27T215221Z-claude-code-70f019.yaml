  summary: 'Apply Anti-pattern 5: drop OI-spectrum frequency bands from type I phenotypes'
  details: |
    Applied the Anti-pattern 5 rule merged in PR #8767 (frequency band inherited across a scope boundary) to the five phenotypes that took their band from the ORPHA:666 row. ORPHA:666 is 'Osteogenesis imperfecta' - the whole spectrum, in which the severe types carry most of the burden - while this entry is the mildest type.

    Arm 3 (drop the band, record the reason in the cited row's explanation), applied to four records whose secondary source states no occurrence rate: Wormian Bones, Osteoporosis, Bruising Susceptibility, Bone Pain. Bruising Susceptibility's ORPHA row was additionally regraded SUPPORT to PARTIAL, because PMID:6822598 states bruising is MORE common in type I than type IV, so the spectrum band may understate rather than describe type I.

    Arm 2 (keep the band, attribute it to the narrower source), applied to Progressive Hearing Impairment: PMID:11276328 measures ~50% by age 50 in a 1,394-patient survey and reports hearing loss significantly less common in type IV than type I, so FREQUENT (30-79%) is measured rather than inherited. Added a second evidence item quoting the type I vs type IV sentence so the type-specific claim is sourced.

    Hyperhidrosis was already compliant and is unchanged; it is the precedent the other records now follow. Validation: just validate passes, 35/35 snippets verified.

  details: |
    Genetics pass for the d2g wiring-015 job (issue #12204, epic #12189). Genetics researched from the entry's own cited literature plus a GeneReviews baseline check (just check-genereviews), with MONDO/Monarch consulted only afterwards for reconciliation. ClinGen bulk refresh was unavailable (just clingen-refresh fails on a drifted pin, issue #10426), so no new ClinGen assertion was fetched. Every HGNC CURIE written here was read from cache/hgnc/terms.csv in the same step it was written; just list-gene-term-mismatches reports 0 findings over the changed files.

    The COL1A1 Null Mutations record was well cited but had no gene_term, so nothing bound the entry to HGNC and the gene reached no pathophysiology node. Added gene_term hgnc:2197 (COL1A1), relationship_type: CAUSATIVE, and a COL1A1 genes: descriptor with modifier DECREASED on Type I Collagen Haploinsufficiency, which the record's own evidence already describes. Wiring 0/1 to 1/1. COL1A2 was deliberately not added: this entry is keyed on MONDO:0008146 (osteogenesis imperfecta type 1), MONDO records COL1A1 for it, and the entry's own cited series (PMID:9443882) reports COL1A1 mutations only in its type I patients. No evidence was added or altered.

  summary: 'Malignant melanotic nerve sheath tumour: imaging findings'
  details: |
    Added an imaging_findings section with seven findings. On MRI: T1 hyperintensity, in
    10 of the 12 tumours with MRI in a 2023 single-centre series and presumably from melanin,
    with what the signal cannot separate (haemorrhage, and melanoma in the differential; fat is
    another cause of T1 hyperintensity but seldom hard to detect); T2 hypointensity, which an
    imaging review and three case reports describe as usual but which the 2023 series found to
    predominate in only 2 of its tumours with MRI, the series' T2-hyperintense tumours and its
    remark that T2 hyperintensity is non-specific being recorded as refuting items; confluent
    T2-hypointense bands in half of the 12; gadolinium enhancement in all 10 given contrast; a
    dumbbell-shaped intradural extramedullary mass through a neural foramen in all
    9 spinal tumours with MRI, with what separates it from conventional schwannoma and other
    T1-hyperintense spinal tumours; and bone erosion and invasion, with foraminal remodelling or
    erosion in 4 and medullary invasion in 5 of the 9. On CT: bone destruction in
    two case reports. Forty-three new evidence items, from seven new caches and
    one source already cached. The dumbbell finding is left unbound; its notes give the NCIT and
    HP searches for dumbbell, dumb-bell, dumb bell and hourglass, run
    on 21 Nov 2026. Two fetched case reports were not used. PRKAR1A, protein kinase A and the
    genetics of the Carney complex are left to another PR, and other topics this curation series
    leaves out were not added. Validated with just validate, count-verified-snippets and
    check-snippet-grading. In review, the bone erosion and invasion finding gained a note that
    its osteolysis binding covers the erosive part only, the foraminal remodelling and medullary
    invasion being recorded in its description.

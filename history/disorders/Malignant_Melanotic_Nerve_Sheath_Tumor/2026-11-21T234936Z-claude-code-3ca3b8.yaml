  summary: 'Malignant melanotic nerve sheath tumour: codes, mappings, Orphanet record
    of the isolated form, epidemiology'
  details: |
    Added NCIT mappings: Melanotic Schwannoma (NCIT:C6970) as an exact match, the class MONDO
    cross-references from the entry's term, and Malignant Melanotic Peripheral Nerve Sheath
    Tumor (NCIT:C4748) as a close match, the parallel class under malignant peripheral nerve
    sheath tumor; and, on the psammomatous subtype, NCIT:C6910 as an exact match of its MONDO
    term. Added classifications: Harrison's oncology and haematology part, and the ICD-O
    morphology value Nerve Sheath Neoplasm, sourced to a 2023 review. Added an epidemiology
    section: age at onset and diagnosis (means of 41 and 43 years and a median of
    38 years across a 2014 series, a 2024 systematic review and a 2023 review, a range of
    11 to 84 years in the series, Orphanet's ages of onset for the isolated form, and the
    average age at presentation of 33.2 years for sporadic tumours that the Isolated subtype row
    already gives) and the sex distribution, on which the three sources differ. Added
    two prevalence rows on the isolated subtype from Orphanet's record of the isolated form
    (ORPHA:590539): annual incidence and point prevalence, both of unknown class, and updated
    the note on the existing row of published cases to say so. The Orphanet cache was built from
    the current Orphadata release (2026-06-23), which is newer than the manifest pin
    (2025-12-09); the cache's Source line gives the release date. The entry's notes gain
    two sentences, on the NCIT classes and on MONDO's OncoTree cross-reference (MSCHW), which
    has no mapping slot. Thirteen new evidence items, from one new cache and
    four sources already cached. PRKAR1A, protein kinase A and the genetics of the Carney
    complex are left to another PR, and other topics this curation series leaves out were not
    added. Validated with just validate, count-verified-snippets and check-snippet-grading.

  summary: 'Malignant melanotic nerve sheath tumour: eight differential diagnoses
    and what separates each'
  details: |
    Added a differential_diagnoses section with eight rows, most giving what the
    two tumours share and the stain, mutation or feature that separates them: conventional
    schwannoma (melanocytic markers and GFAP, Antoni areas, the pigment of the
    2010 series' nine reclassified tumours, gene expression, site and age, and the DNA
    methylation overlap); meningeal melanocytoma (capsule, psammoma bodies and fat, diffuse
    against focal S100, pericellular or biphasic against nested basement membrane, GNAQ at
    100% specificity and 43% sensitivity with the 2010 series' testing of exon 5, GNAQ and
    GNA11 mutations reported in tumours diagnosed as this one, the epigenetic distinction and
    its melanin limit, and mitotic indices in each of the WHO's mitotic grade ranges); primary
    leptomeningeal melanoma (nested reticulin, GNAQ and GNA11 rates from the few cases analysed,
    and PRAME not yet judged); metastatic melanoma (Ki-67, basement membrane, a lobular
    arrangement, psammoma bodies and fat, against TERT promoter,
    CDKN2A and BRAF V600E mutations, and gene expression); pigmented neurofibroma
    (neurofilament-positive structures and a cutaneous site); clear cell sarcoma (only its
    defining EWSR1 fusions, cited as indirect from the background of a cohort study); cellular
    blue nevus (dermal architecture, and GNAQ in the blue nevus but in none of the series'
    schwannomas); and malignant peripheral nerve sheath tumour (histology, pigment and
    SMARCB1). Sixty-nine new evidence items, from eight new caches and four sources already
    cached. Two fetched abstracts give no separating feature and were not used. Three rows bind
    a broader class because MONDO has none for the specific tumour (conventional schwannoma,
    pigmented neurofibroma and cellular blue nevus), and each row's notes give the search; the
    schwannoma and malignant peripheral nerve sheath tumour rows bind classes under which MONDO
    also places terms for this tumour, as their notes say. PRKAR1A, protein kinase A and the
    genetics of the Carney complex are left to another PR, and other topics this curation series
    leaves out were not added. Validated with just validate, count-verified-snippets and
    check-snippet-grading. In review, the sentences in which two case reports and the
    2010 series restate the literature (PMID:37284154, PMID:36867567 and PMID:20865267) were
    regraded from REVIEW_SYNTHESIS to BACKGROUND; REVIEW_SYNTHESIS is kept for reviews and for a
    paper's own review of published cases. The mitotic feature now says that mitotic index alone
    spans all three meningeal grades.

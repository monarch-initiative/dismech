- type: EDIT
  outcome: changed
  sections:
  - progression
  summary: 'Malignant melanotic nerve sheath tumour: recurrence, metastasis and what
    histology predicts'
  details: |
    Extended the Outcome phase of progression with each series' recurrence, metastasis and death
    figures as pairs, with follow-up and denominators: the 2014 series' 11 metastases in
    26 followed patients, which its abstract gives as 44%; in a 2023 single-centre series,
    follow-up for 12 of 31 patients, of whom 6 were disease-free, 2 had recurrence or metastases
    and 4 had died of metastases, the other 19 being second-opinion cases;
    7 of 11 followed patients without recurrence or metastasis at a mean of 5.9 years in a
    2005 series of 13 patients with nonpsammomatous tumours; 4 of 5 behaving malignantly and
    3 deaths from metastases in a 1999 spinal series, whose review of 57 published cases gives
    recurrence in 15%, metastasis in 26.3%, and freedom from disease in 53% of those followed
    for more than 5 years against 67.5% of those followed for less;
    19 of 37 extramedullary spinal cases with recurrence or metastasis in a
    2020 systematic review, which calls follow-up across its source studies highly variable; and
    5 of 8 with metastasis, 6 with a long-term recurrence and 5 deaths at the institution of the
    2024 systematic review. On histology, the 1999 primary tumours lacked features of malignancy
    although 4 of 5 behaved malignantly, one of the two recurrences reported by a 2020 series of
    7 came from a tumour without mitoses, and a 2025 case report's discussion says that apart
    from increased mitotic activity no morphological feature that reliably predicts behaviour
    has yet been identified. The existing item quoting a 2022 case report's discussion was
    extended to the sentence giving the mitotic-rate threshold the discussion cites, and the
    item's explanation was rewritten. Two existing explanations for the 2025 case report were
    corrected: the 24-month one now gives the authors' suggesting where it said showing, and the
    18-month one now says the abstract counts from the gross total resection. The
    2025 case report's 18-month MRI is given with both of its datings: from the gross total
    resection in its abstract, and from the first, partial operation, five months earlier, in
    its case description. A new progression phase, Late recurrence and metastatic spread,
    records recurrence or metastasis after more than 5 years and the lungs, liver and bones as
    the reported sites, the lungs most of all. Added 19 new evidence items and five new caches
    (PMID:36069993, PMID:32456496, PMID:33088497, PMID:16157048 and
    PMID:10583580). Two fetched sources were not used: a 2022 letter whose cache holds
    no body, and a 2020 consecutive series whose one tumour of this kind cannot be separated
    from the others' outcomes. An HPO search through OLS on 21 Nov 2026 for metastases,
    metastatic disease, secondary neoplasm, lung, bone and liver metastases, tumour recurrence
    and local recurrence returned no term for metastasis or recurrence, so no phenotype rows
    were added. PRKAR1A, protein kinase A and the genetics of the Carney complex are left to
    another PR. Validated with just validate, count-verified-snippets and check-snippet-grading.

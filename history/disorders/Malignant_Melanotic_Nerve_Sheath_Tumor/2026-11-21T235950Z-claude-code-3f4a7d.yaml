  summary: 'Malignant melanotic nerve sheath tumour: radiotherapy, radiosurgery and
    systemic treatment'
  details: |
    Added six treatment rows after the existing surgical resection row, each saying what kind of
    evidence it rests on: adjuvant radiotherapy (conventionally fractionated in most reports;
    unclear benefit, no guidelines, limited data from case reports and small series, with the
    outcomes of a systematic review's irradiated patients, the trend and the similar mortality a
    2024 review reports, and single cases); stereotactic radiosurgery (a 2026 series of
    four patients, with the settings, which its abstract and its case descriptions give
    differently, the doses, tumour control at the follow-up times its abstract, discussion and
    case description give differently, tolerance without systematic adverse-event grading, the
    authors' limits, and a link to tumour growth graded indirect); craniospinal irradiation for
    leptomeningeal spread (one 2022 case report); pembrolizumab before resection
    (one 2021 case report); anlotinib with radiotherapy (one 2026 case report, with the
    progression-free survival the authors report and the brain metastasis of March
    2024 and liver metastasis of October 2024 that the case description records); and cytotoxic
    chemotherapy, bound to NCIT Cytotoxic Chemotherapy (low response rates in the discussions of
    two case reports, and the regimens and courses of two cases). Sixty-seven new evidence items,
    from six new caches and two sources already cached. Four fetched records were not used: a
    letter with no text, the earlier report of a patient the 2026 series updates, and
    two series that pool this tumour with other melanotic tumours. PRKAR1A, protein kinase A and
    the genetics of the Carney complex are left to another PR, and other topics this curation
    series leaves out were not added. Validated with just validate, count-verified-snippets and
    check-snippet-grading.

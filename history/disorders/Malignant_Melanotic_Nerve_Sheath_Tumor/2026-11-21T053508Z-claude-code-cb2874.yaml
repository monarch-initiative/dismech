  summary: 'Create: Malignant Melanotic Nerve Sheath Tumor'
  details: |
    Creates the entry for the malignant melanotic nerve sheath tumour under its WHO name,
    bound to MONDO:0002558 (melanotic neurilemmoma), with MONDO:0003863 (malignant
    melanocytic neoplasm of the peripheral nerve sheath) recorded as a close match and a
    definitions row recording the 2020 and 2021 WHO renaming. Two subtype rows, psammomatous
    (MONDO:0003862) and isolated (MONDO:0035136); MONDO's mediastinal term is not used,
    because the cited series counts mediastinal tumours without describing them as a
    separate form. A Carney complex inheritance block, giving the share of patients with the
    complex by series (from under 5% to over half), and a PRKAR1A genetic row, germline and
    somatic, from the GeneReviews summary (tagged GeneReviews; its clinical, diagnosis,
    management and genetic counselling sections are each quoted) and from tumour series. The
    pathograph runs from PRKAR1A loss of function (the origin node, Schwann cell; how often
    it is found varies, and sporadic tumours often keep the protein) to unopposed protein
    kinase A activity, the melanotic Schwann cell tumour, the paraspinal mass effect
    (radiculopathy, pain and spinal cord compression) and distant metastasis (conforming to
    invasion_and_metastasis#Metastatic Colonization); the mouse evidence is marked as
    modelling non-pigmented schwannomas. Diagnosis rows for MRI, histopathology, the marker
    panel and PRKAR1A immunohistochemistry; one resection row linked to the tumour node; one
    outcome row; one prevalence row, a case count and a share of nerve sheath tumours rather
    than a rate. Content limits: PRKAR1A at gene level only, with no chromosomal location
    and no chromosome-arm or copy-number findings. Validated with just validate (87
    snippets, 88 titles) and validate-terms. After review, the definitions row quotes the
    reason for the reclassification (frequent metastasis and recurrence in case series and
    long-term data) and a case report's statement that the tumour was redefined as a
    potentially aggressive entity, and the entry's description and the definitions row's
    description now state only that reason; one explanation says which half of a mixed
    sentence sets its evidence grade.

  details: |
    Reviewed GLB1 modelling: CAUSATIVE germline record and a node binding beta-galactosidase activity and ganglioside catabolic process as decreased, matching the partial deficiency of adult-onset type III. The GLB1-Related Disorders GeneReviews chapter (PMID:24156116, NBK164500) was not cited; it is now quoted on the GLB1 record for the type III presentation (late-childhood to third-decade onset with generalized dystonia and akinetic-rigid parkinsonism) and tagged in a new references block. ClinGen's Definitive GLB1 assertion is for GM1 gangliosidosis as a whole (MONDO:0018149), a parent of this entry's term, so it is not copied.

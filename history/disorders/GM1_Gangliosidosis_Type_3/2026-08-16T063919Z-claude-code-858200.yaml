  summary: Add ICIMD, Harrison's and lysosomal storage classifications
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + NEUROLOGIC, icimd_category 'sphingolipid_degradation' (ICIMD group 'Disorders of sphingolipid degradation' under category 'Disorders of complex molecule degradation'; Ferreira et al. 2021, PMID:33340416), and lysosomal_storage_category 'sphingolipidosis'. This brings the adult/chronic type-3 entry into line with the already-classified GM1_Gangliosidosis_Type_1 entry, which is the same GLB1 beta-galactosidase deficiency at the low-residual-activity end of the spectrum. The lysosomal_storage_category assignment carries a real evidence block quoting PMID:34539759, which names the stored substrate as the glycosphingolipid GM1-ganglioside; the ICIMD assignment records provenance in notes only, per the disease-classification skill. Deliberately did NOT copy the isds_skeletal_category from the type-1 entry: the ISDS nosology lists each disorder once and the adult form has minimal skeletal involvement, so asserting membership here would be an inference rather than a transcription. Validated with 'just validate' - schema, term and reference validation all passed, 13/13 snippets verified.

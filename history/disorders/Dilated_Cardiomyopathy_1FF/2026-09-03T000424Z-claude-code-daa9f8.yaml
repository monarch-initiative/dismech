  summary: 'Create: Dilated_Cardiomyopathy_1FF'
  details: |
    Curated dilated cardiomyopathy 1FF (MONDO:0013211, OMIM 613286), the autosomal dominant TNNI3 dilated cardiomyopathy, as a standalone Disease entry replacing the seed stub. The lump/split call was the first task: CMD1FF was kept separate from the existing recessive Dilated_Cardiomyopathy_2A (MONDO:0012746, OMIM 611880) on four axes — molecular lesion (heterozygous function-altering allele with a wild-type allele retained, versus biallelic null with no cardiac troponin I at all), direction of the functional defect (reduced maximum actin-tropomyosin-activated myosin ATPase and reduced calcium sensitivity for the founding missense alleles, versus global regulatory failure timed by the perinatal troponin I isoform switch), natural history (variable, incompletely penetrant, childhood-to-adult onset versus obligate neonatal-to-infantile), and clinical action (50 percent per-offspring recurrence with longitudinal relative surveillance versus 25 percent per sibship with carrier testing). ClinGen's Dilated Cardiomyopathy GCEP issues separate AD and AR TNNI3-DCM assertions, both Strong, which supports the split externally. Three mechanistic hypotheses are curated: altered thin-filament calcium regulation (CANONICAL), uncoupling of calcium sensitivity from troponin I phosphorylation (ALTERNATIVE), and haploinsufficiency from a heterozygous truncating allele (EMERGING). Seven pathophysiology nodes, four conforming to cardiomyopathy_maladaptive_remodeling. Three discussions record the split decision (RESOLVED), the unresolved conflict in calcium-sensitivity direction between the missense and truncating allele classes, and the absence of any whole-animal CMD1FF model. Also updated kb/groupings/Familial_Dilated_Cardiomyopathy.yaml: added CMD1FF as a fourteenth member and corrected its curation-gaps note, which claimed TNNI3 was represented only by the recessive CMD2A entity, plus two other stale member counts. Added a reciprocal differential-diagnosis entry to Dilated_Cardiomyopathy_2A. Validated with just validate (schema, terms, references all passed), all 63 evidence snippets independently confirmed as exact substrings of their cached references, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, validate-grouping and check-groupings all clean.

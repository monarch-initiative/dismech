  details: |
    Rebuilt the causal model with explicit confidence and edge evidence. Added natural history, clinical burden, diagnosis, differentials, treatments, current BDD-specific trials, and knowledge gaps. Addressed review feedback by isolating the provisional persistent-symptom maintenance process in pathophysiology while retaining the established functional-impairment outcome in clinical_burden rather than inventing an unsupported causal edge, and removed the deprecated prevalence percentage. Verified 56 evidence snippets against generator-owned caches, all ontology terms, a six-node pathophysiology graph with 5/5 phenotypes connected, graph integrity, CX2/KGX exports, compliance, and Monarch D2P coverage. Preserved uncertainty around heritability, environmental risks, visual-processing mechanisms, and psilocybin. Did not infer serotonergic causation from SSRI response or model anxiety/depression comorbidities as causal phenotypes.

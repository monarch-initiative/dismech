  details: |
    Backfill for issue #8085. Ultraviolet exposure is the strongest link produced by this backfill so far and is unusual in it: the exposure is not merely associated with the disease, it is the mutagen that writes the somatic second hit the target node holds, and the second hits carry its signature. That makes the link TRIGGERS with DIRECT and supports SUPPORT, and it makes sun protection a mechanistically justified preventive measure rather than generic advice. Immunosuppression is graded well below it at EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, and the difference is substantive rather than presentational: ultraviolet light creates the mutant clone whereas immunosuppression appears to permit an existing clone to expand, which is why the two links point at different nodes, the second hit and the clonal expansion respectively. No cited sentence supplies the route for the immunosuppression arm, so its intermediates are recorded as unknown. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 134 of 134 verified.

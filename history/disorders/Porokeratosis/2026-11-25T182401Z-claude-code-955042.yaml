  summary: 'Gene-family review: MVK, PMVK, MVD, FDFT1'
  details: |
    Reviewed the mevalonate-pathway genes. The germline node bound MVK, PMVK and MVD activities but carried FDPS with none; added (2E,6E)-farnesyl diphosphate synthase activity (GO:0004337) for FDPS, the fourth germline gene of the defining cohort (PMID:26202976). FDFT1 sat on two nodes with no activity: added squalene synthase (GO:0051996) with modifier LOSS_OF_FUNCTION on the promoter-hypermethylation node, the modifier the schema reserves for epigenetic silencing, and ABSENT on the biallelic deficiency node, where the doubly hit keratinocyte has no activity (PMID:38653249). Added autosomal dominant inheritance blocks (HP:0000006) to the MVK, PMVK, MVD and FDPS germline records.

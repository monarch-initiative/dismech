  summary: 'Create: Porokeratosis'
  details: |
    De-novo curation of porokeratosis MONDO:0006602 for issue #7560. Deep research via Edison/Falcon [research/Porokeratosis-deep-research-falcon.md, 529s, 10 citations, 1 artifact]; DR output treated as leads only, with every PMID, snippet and ontology ID independently verified against fetched caches and OAK. NEC preflight run against the MONDO record: cornoid lamella plus mevalonate pathway confirmed; porokeratosis distinguished from poroma, keratosis pilaris and pitted keratolysis, and critically from mevalonate kinase deficiency/HIDS, which shares MVK but is a separate systemic autoinflammatory disease and is recorded as an explicit differential rather than allowed to leak in. No GeneReviews chapter exists for porokeratosis; the PubMed GeneReviews search returned no hits. Modelled the Knudson two-hit clonal mechanism as an explicit nine-node pathograph: germline monoallelic MVK/PMVK/MVD/FDPS variant as trigger, then somatic second hit by copy-neutral LOH from mitotic recombination or UV-signature C-to-T transition, then biallelic enzyme deficiency including the parallel non-hereditary FDFT1 promoter-hypermethylation route, then isoprenoid and cholesterol depletion with toxic intermediate accumulation, then impaired protein prenylation and geranylgeranylation, then aberrant keratinocyte differentiation and apoptosis, then clonal expansion, ending in cornoid lamella formation, perilesional inflammation and malignant transformation. Timing of the second hit distinguishes the mosaic Blaschko-linear form from multi-clone DSAP. Topical cholesterol plus lovastatin and statin monotherapy are wired to the metabolic node via target_mechanisms with INHIBITS, capturing the two-arm rationale that the statin stops upstream intermediate accumulation while cholesterol replaces the missing end-product; supported by the case series PMID:31449901, lovastatin monotherapy report PMID:33005717, the randomized trial PMID:36947042 / NCT04359823, and the 2026 systematic review PMID:41606785. Six subtypes curated: DSAP, Mibelli, linear, PPPD, punctate, and eruptive/immunosuppression-associated. A histopathology section carries the cornoid lamella as the diagnostic finding. Six structured differential diagnoses carry bound MONDO disease_terms. Validation: just validate PASS, term validation PASS, reference validation 98/98 snippets verified, compliance 99.6 percent global and 100.0 percent weighted with only datasets missing which is not applicable, and compliance-connectivity clean with no phenotype or gene-wiring gaps for this file.

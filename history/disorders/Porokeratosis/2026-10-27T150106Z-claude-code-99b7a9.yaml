  summary: Add SLC17A9 (POROK8) subtype, genetic record and mechanism node
  details: |
    Picked up the Porokeratosis remainder deferred by PR 12897 and listed on issue 12931. Added a POROK8 has_subtypes row bound to MONDO:0014479, a SLC17A9 genetic record (relationship_type UNKNOWN, with the reason in notes), and a Germline SLC17A9 Variant pathophysiology node carrying GO:0005347 with no modifier and no downstream edge, plus a KNOWLEDGE_GAP discussion recording why. Evidence comes from the discovery study (PMID:25180256, two families) and a negative nine-patient screen (PMID:28777842, REFUTE, INDIRECT). No ClinGen record exists for SLC17A9. Validated with just validate, validate-terms and count-verified-snippets (141/141), plus the whole-repo gates.

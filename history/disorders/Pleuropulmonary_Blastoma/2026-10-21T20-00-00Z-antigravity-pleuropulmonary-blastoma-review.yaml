  summary: Enhance Pleuropulmonary Blastoma with GeneReviews baseline, inheritance, diagnosis, differential diagnoses, treatment targets, and causal edge evidence
  details: >-
    Added MONDO synonyms (`PPB`, `pulmonary blastoma of childhood`) and cited
    the DICER1-Related Tumor Predisposition GeneReviews chapter (PMID:24761742,
    tagged `GeneReviews`). Added autosomal dominant predisposition under
    `inheritance` (`HP:0000006`, backed by PMID:24761742, PMID:19556464, and
    PMID:25209242). Added `molecular_functions` to four pathophysiology nodes
    (`GO:0004525` `DECREASED` on `Germline DICER1 Predisposition` and `Compound
    DICER1 Disruption`; `GO:0003700` `DECREASED` on `TP53 Loss`; `GO:0003924`
    `DECREASED` and `GO:0004674` `INCREASED` on `RAS Pathway Activation`) and
    added downstream phenotype edges with `causal_link_type` and `evidence`
    (`Pulmonary cyst` and `Pneumothorax` from `Multicystic Type I Lesion`;
    `Respiratory distress`, `Dyspnea`, `Cough`, and `Pneumothorax` from
    `Sarcomatous Progression`). Added `diagnosis` entries (`Histopathologic
    examination of resected tumor` bound to `NCIT:C18190`, PMID:25209242,
    PMID:33826235, PMID:37119756; `DICER1 molecular genetic testing` bound to
    `NCIT:C15709`, PMID:24761742, PMID:25209242) and `differential_diagnoses`
    (`Congenital pulmonary airway malformation` `MONDO:0016580`, PMID:18223332;
    `Rhabdomyosarcoma` `MONDO:0005212`, PMID:37119756). Added structured
    `target_mechanisms` with edge-level evidence on `Complete Tumor Resection`
    and `Multi-Agent Chemotherapy`, added PMID:24761742 evidence to `Radiation
    Therapy`, and added `Chest Imaging Surveillance in DICER1 Carriers`
    (`NCIT:C191501`).

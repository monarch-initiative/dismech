  details: |
    The entry carried two untyped genetic records for GLA ('GLA gene mutations' and 'GLA'), the second holding only the ClinGen citation. They are merged into 'GLA gene mutations', now CAUSATIVE and GERMLINE, with the ClinGen Definitive tier for Fabry disease (MONDO:0010526, the entry's disease term) recorded in gene_disease_validity, the ClinGen row kept as evidence, and HP:0001419 bound on the record's X-linked recessive inheritance block. The alpha-galactosidase A deficiency node bound alpha-galactosidase activity (GO:0004557) and glycolipid catabolic process (GO:0019377) without a direction although its description and evidence describe reduced or absent activity; both are now marked decreased. The introductory sentence quoted from the podocyte cell-line study PMID:39100494 states the human disease, so it is graded HUMAN_CLINICAL with quote_role BACKGROUND rather than IN_VITRO.

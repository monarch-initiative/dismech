  summary: Remap FDA renal GL-3 surrogate endpoint to renal microvascular endothelium
  details: |
    The FDA-accepted Fabry surrogate endpoints (FDA-SE-adult-noncancer-024, -025, FDA-SE-pediatric-noncancer-019) score GL-3 inclusions in renal peritubular (interstitial) capillary endothelium, but were attached to the podocyte storage node. Added a Renal microvascular endothelial glycosphingolipid storage node (CL:1001033, UBERON:0005272) fed from tissue-specific storage, moved the regulatory refs onto a readout of that node, kept a separate podocyte readout without regulatory refs, and added an enzyme replacement target_mechanism on the new node. Evidence is from the pivotal agalsidase beta (PMID:11439963) and migalastat (PMID:27509102) trial abstracts, both newly cached. Validated with just validate-disorders, validate-terms, check-causal-targets, check-entity-refs and tests/test_regulatory_endpoint_refs.py.

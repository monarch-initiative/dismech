  summary: Add alpha-galactosidase A diagnosis row (tranche D batch 1)
  details: |
    LOINC tranche D batch 1 (enzyme activity and metabolite assays). Added a diagnosis[] row binding LOINC:LP14012-6 (Alpha galactosidase A, the specimen-generic Part code) via measurements, citing PMID:32723516 (already cited elsewhere in this entry's genetic[] inheritance block) describing the leukocyte enzyme assay and its classical-vs-late-onset activity picture. Checked origin/main's cache/loinc/terms.csv first for an already-bound Fabry enzyme code from the merged loinc-nbs-batch* tranche (Fabry is on the RUSP panel): none found (LOINC:55908-8, the DBS screening code, is not yet bound anywhere in kb/). Preferred the specimen-generic Part code over the leukocyte-specific LOINC:24049-9 because this tranche's convention favors a generic identity code when one exists, reserving specimen-specific codes (leukocyte 24049-9, DBS 55908-8) for when a specimen-specific claim is made; both alternative codes are named in notes: for a future specimen-specific need. No reference_ranges band: the source states the classical-vs-late-onset distinction qualitatively ('very low or null' vs 'under 30 percent'), not as crisp numeric cut-offs. LOINC:LP14012-6 confirmed against the Monarch KG API in the step written, then seeded into cache/loinc/terms.csv via just loinc-seed-cache; no third-party copyright notice required (checked against cache/loinc/external_copyright_codes.csv). No collision with this code on any other open loinc-* branch's cache. A first diagnosis_term attempt used a wrong-from-memory NCIT CURIE (C96567, actually 'Basophilic Stippling Measurement', not 'Enzyme Assay') -- caught by the pre-edit validation hook before it landed in the file, corrected to NCIT:C25294 'Laboratory Procedure' (verified via OLS), and the orphan cache row the failed attempt had written to cache/ncit/terms.csv and the treatmentactionterm enum cache was removed before committing. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

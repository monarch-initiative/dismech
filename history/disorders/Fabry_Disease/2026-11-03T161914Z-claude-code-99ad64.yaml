  summary: Type all nine model-to-mechanism links; set biological_scale on four nodes
  details: |
    Every model-to-mechanism link in the entry carried only target, description and evidence. relationship, fidelity, model_scale, limitations and divergences were all absent, on all nine links across the five experimental models and the one computational model, so just model-scale-audit reported 9 links and 0 scale-determined.

    Four target nodes also had no biological_scale, which is the other half the audit needs: Alpha-galactosidase A deficiency (MOLECULAR), Cardiac glycosphingolipid storage and myocardial remodeling (TISSUE), Cardiomyocyte autophagy impairment and oxidative stress (CELLULAR) and Atrial cardiomyocyte electrophysiological remodeling (CELLULAR). Without them, setting model_scale on a link would still have left the comparison UNDETERMINED.

    After the pass: 9 of 9 scale-determined, 3 ALIGNED, 5 MODEL_BELOW_TARGET (all one step, all carrying limitations and divergences) and 1 MODEL_ABOVE_TARGET. 25 typed divergences.

    Relationship values follow what each model does rather than what it is cited for. The GLA modRNA model is RESCUES against the enzyme-deficiency node, since the rescue arm is the claim. The bi-atrial in silico model is PERTURBS, not RECAPITULATES: the cellular remodeling it is linked to is the model's input, imposed as parameter changes taken from the p.N215S iPSC-CM measurements, so it provides no independent support that those cells remodel. Its contribution is the forward step to organ-level P-wave morphology and atrial fibrillation vulnerability.

    Two links are graded LOW. The female Fabry drug-screening model carries an INVALIDATING PROXY_QUANTITY divergence: the node asserts cardiomyocyte hypertrophy, the model's hypertrophy quantity is natriuretic peptide transcript, and its direct size measure moved the other way, with cell surface area decreased in the Fabry clones. The authors themselves claim only molecular-level cardiomyopathic change. The p.N215S atrial model's link to the cardiac storage node is LOW because it supplies the storage half only, from atrial cells, where the node's remodeling content is ventricular.

    The GLA-null hESC model's CAUSE_UNREPRESENTED divergence records a deliberate design trade rather than an oversight: the full text states that variable genetic background is a major limitation of patient iPSC lines and that isogenic CRISPR editing is how the authors avoided it. The cost is that no patient allele or background is represented, and a complete null speaks to classic Fabry rather than to the late-onset residual-activity genotypes this entry also covers.

    One divergence is recorded IMMATERIAL. The p.N215S atrial model omits atrial tissue architecture, fibrosis, coupling and autonomic input, which is real but does not bear on a cellular claim about action potential, calcium handling and contraction.

    No evidence item, snippet, node description or term binding was changed. All 181 snippets remain verified. Checked: validate, test_disorder_file, model-scale-audit --strict, check-enum-values, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-snippet-grading.

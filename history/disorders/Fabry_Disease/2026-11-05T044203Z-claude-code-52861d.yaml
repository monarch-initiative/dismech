  summary: Split the bundled cardiac storage/remodeling node by biological scale
  details: |
    Addresses issue 16536. Splits the pathophysiology node 'Cardiac glycosphingolipid storage and myocardial remodeling', which carried both a cellular claim (Gb3 accumulating inside cardiomyocytes) and a tissue claim (myocardial fibrosis, heart-failure risk, arrhythmogenic remodeling), into:

    - 'Cardiomyocyte globotriaosylceramide accumulation' (CELLULAR)
    - 'Myocardial hypertrophy and fibrotic remodeling' (TISSUE), downstream of it

    The triage comment on the issue was right that this is smaller than it looks: the node already had cellular children downstream (autophagy/oxidative stress, atrial electrophysiological remodeling), so what was missing was a cellular storage node upstream of them. Those two children moved onto the storage node; fibrosis and congestive heart failure stayed on the remodeling node. The JACC review's two snippets split cleanly, the Gb3 sentence to storage and the LVH/fibrosis/heart-failure sentence to remodeling, so the split needed no new quotes.

    All seven inbound bare-name targets were repointed to the storage node: the incoming edge from 'Tissue-specific glycosphingolipid storage', the substrate-reduction treatment link (it clears lysosomal GL-3 in cardiomyocytes, a cellular claim), and the five experimental_models links. Note the issue counted five model links; there were six targets, the sixth being the treatment target_mechanisms link.

    The predicted audit effect is realised: just model-scale-audit reported five MODEL_BELOW_TARGET links before, all pointing at the bundled node, and now reports zero, with 8 ALIGNED and 1 MODEL_ABOVE_TARGET (the bi-atrial in silico model, which contains its target's scale and is unremarkable). The remodeling node now carries no model links at all, which is the visibility the issue wanted: nothing in this entry's model inventory speaks to Fabry myocardial fibrosis.

    Divergence and grade changes follow from the target change rather than from any new reading of the papers. Five SCALE_EXTRAPOLATION divergences were removed because a CELLULAR model against a CELLULAR node has no scale gap, and keeping them would have failed check_scale_extrapolation_divergence_agrees_with_scales. Four identical BOUNDARY_OMISSION divergences were removed because they named the fibrotic and vascular components the storage node no longer claims; one TEMPORAL_SCOPE description was narrowed to storage; the atrial model's BOUNDARY_OMISSION about absent ventricular myocardium was removed and its atrial-chamber caveat folded into its existing POPULATION_MISMATCH. The five storage links moved from PARTIALLY_RECAPITULATES to RECAPITULATES, since each observes cardiomyocyte Gb3 accumulation and that is now the whole node. Two fidelity grades moved LOW to MODERATE, and only where the recorded reason for LOW was the bundling itself: the high-content screening model was LOW for the hypertrophy contradiction, and the atrial model for the ventricular mismatch. Every surviving divergence was left alone (CAUSE_UNREPRESENTED for the engineered knockout, POPULATION_MISMATCH for p.N215S residual activity, TEMPORAL_SCOPE for the culture window).

    The hypertrophy question the issue and its triage comment both reserved for a curator is resolved by asserting cardiomyocyte hypertrophy on neither node, and recording the disagreement structurally instead. PMID:30965672 reports a significant increase in cardiomyocyte surface area; PMID:30048710 reports natriuretic peptide transcript up but surface area down, and its authors claim only molecular-level cardiomyopathic change. Both observe Gb3, so the disagreement is about the hypertrophic response, not storage. Putting it on the storage node would have placed an unsettled claim under the node four models attach to, which is the risk the triage comment named. A new HUMAN_MODEL_MISMATCH discussion (fabry_cardiomyocyte_hypertrophy_model_disagreement) attached to both nodes records it, so it no longer lives only inside one link's INVALIDATING PROXY_QUANTITY divergence, which was itself removed as false for the storage node. The tissue node keeps left ventricular hypertrophy as the clinical tissue-level phenotype the review describes, and the cellular hypertrophic features that are reported sit on the downstream autophagy node where they already were.

    The renal sibling was checked and deliberately not split. 'Renal glycosphingolipid storage and podocyte injury' does bundle the same way, cellular GL-3 in podocytes with tissue-level filtration-barrier injury, but no model link in this entry targets it or any other renal node, so it produces no scale-gap verdicts and the motivation that justified the cardiac split does not apply. Splitting it would be a restructuring without a reported defect behind it.

    Validation: just validate-disorders passes with 183 of 183 snippets verified and 184 titles. check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values and check-qualifier-terms pass; coarse-phenotype, block-scalar and snippet-grading gates report zero findings in this file. check-snippet-grading was run explicitly because CI's path filter skips it on a kb-only PR. Phenotype connectivity is unchanged at 23 of 24.

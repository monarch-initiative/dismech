  summary: Split the cardiac storage-and-remodeling node into cellular storage and
    tissue remodeling nodes
  details: |
    Split 'Cardiac glycosphingolipid storage and myocardial remodeling' (TISSUE) into 'Cardiomyocyte glycosphingolipid storage' (CELLULAR) and 'Myocardial hypertrophic and fibrotic remodeling' (TISSUE). The new storage-to-remodeling edge cites PMID:33602475, where Gb3 accumulation is one contributor among other mechanisms. The JACC Gb3 snippet moved to the storage node and the LVH, fibrosis, HF and arrhythmia snippet stayed on the remodeling node. The autophagy and atrial-electrophysiology edges now leave from the storage node. The fibrosis and congestive-heart-failure edges stay on the remodeling node. The five cardiomyocyte model links and the substrate-reduction treatment link were repointed to the storage node. Their SCALE_EXTRAPOLATION divergences, and the BOUNDARY_OMISSION divergences that named fibrotic and vascular content of the old node, were removed. The links became RECAPITULATES. The female iPSC-CM link's INVALIDATING PROXY_QUANTITY divergence on hypertrophy no longer applies, so it was replaced with a POPULATION_MISMATCH on X-inactivation clonal selection, and fidelity was raised from LOW to MODERATE. Cellular hypertrophy was left off the storage node because PMID:30965672 (cell surface area increased) and PMID:30048710 (decreased) disagree. That disagreement is now a KNOWLEDGE_GAP discussion attached to both nodes. Validated with just validate, count-verified-snippets (185/185), validate-terms, check-causal-targets, check-entity-refs and model-scale-audit --strict (8 ALIGNED, 1 MODEL_ABOVE_TARGET, 0 MODEL_BELOW_TARGET).

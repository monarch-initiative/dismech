  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 20 (VARS2)'
  details: |
    New entry for COXPD20 (MONDO:0014397), the autosomal recessive mitochondrial encephalocardiomyopathy caused by biallelic VARS2 variants. VARS2 is typed CAUSATIVE: at least 24 patients from 20 families, segregation, reduced VARS2 protein and tRNA-Val, rescue of respiration by wild-type VARS2 in patient fibroblasts, and yeast, frog and zebrafish models. ClinGen rates VARS2 Definitive for the broader MONDO:0044970 mitochondrial disease, recorded in genetic notes only. Pathograph follows the mitochondrial_translation_deficiency module from the VARS2 lesion through tRNA-Val charging, mitochondrial translation and the combined complex I/IV defect to cardiomyocyte and neuronal energy failure, with REFUTE items for the normal translation rate in fibroblasts. Phenotypes come from the Bruni 2018 cohort and later case reports; the p.Thr367Ile homozygote course and the single-family endocrine features are described as such. Treatments: oral valine supplementation (uncontrolled patient series and the Xenopus crispant model) and supportive care. Animal models: Xenopus tropicalis vars2 crispants and zebrafish vars2 morphants with typed divergences. Validated with linkml-validate, OLS-backed term validation, the reference validator (52 snippets, 0 issues), count-verified-snippets and the section-5 check recipes; the stub was deleted.

  summary: 'Create: lymphatic malformation 13 (THSD1)'
  details: |
    De novo creation of the Lymphatic malformation 13 (LMPHM13; MONDO:0859379,
    OMIM:620244; THSD1) disorder entry. entry_type = DISEASE (a distinct
    autosomal recessive THSD1 lymphatic/vascular entity, kept separate from the
    autosomal dominant THSD1-related intracranial aneurysm entry).

    Research: no external deep-research provider was run. A targeted PubMed
    sweep found the entire directly relevant literature for this ultra-rare
    entity: the recessive human phenotype rests on two consanguineous families
    (PMID:26036949 autozygosity/embryonic-lethality discovery; PMID:30055085
    homozygous truncating THSD1 with NIHF, cardiac defects, hemangiomas,
    malabsorption, hydrocele) and one pediatric case report (PMID:42583604,
    lower-limb lymphedema + protein-losing enteropathy treated with
    lymphovenous/LNVA microsurgery). Mechanism was taken from blood-vascular
    endothelial studies (PMID:26822228 FAK-PI3K/Rac1 barrier/adhesion,
    zebrafish+mouse+human-EC; PMID:16455951 Tmtsp/THSD1 endothelial identity)
    and a 2025 review (PMID:40564011). The claude_code DR recipe was attempted
    but requires a pre-existing disorder file; given the complete manual
    coverage and disk constraints it was not re-run.

    Pathograph: 4-node causal chain THSD1 Loss of Function (MOLECULAR) ->
    Impaired Endothelial Focal Adhesion and Barrier Integrity (CELLULAR) ->
    Defective Lymphatic Vessel Development and Integrity (TISSUE) -> Systemic
    Lymphatic Transport Failure (ORGANISM), the terminal node wired by bare-name
    downstream edges to the clinical phenotypes. A HUMAN_MODEL_MISMATCH
    discussion records that THSD1's mechanism is established in blood-vascular,
    not lymphatic, endothelium, so the lymphatic edge is inferred.

    Terms: THSD1 verified by OAK against HGNC as hgnc:17754 (the stub's
    hgnc:17754 agrees; a suggested hgnc:25595 resolves to L1TD1 and was
    rejected). All HP/GO/CL/NCIT/MONDO terms looked up live before binding.
    HP:0001627 (coarse) carries coarse_binding_basis SOURCE_UNSPECIFIED for the
    unspecified congenital cardiac defects.

    Validation (DISMECH_ROOT set): just validate (32/32 snippets, 0 issues),
    validate-terms, count-verified-snippets 32/32, validate-disorders (batched
    CI gate) all pass; check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-coarse-phenotypes,
    check-qualifier-terms, check-title-snippets, check-reference-titles,
    check-snippet-length, check-snippet-grading, check-block-scalar-comments all
    OK; normalize-cache + check-term-cache-integrity clean. check-genereviews

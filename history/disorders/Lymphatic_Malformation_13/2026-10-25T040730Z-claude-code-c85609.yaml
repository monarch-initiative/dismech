  summary: 'Review round 1: genotype caveats, deep-research reconciliation, connectivity'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #15571 in one
    bundled push.

    Blocking item 1 (genotype of the case-report child). PMID:42583604 states
    only "a known THSD1 mutation" with no variant, zygosity, segregation, or
    method. Replaced both "molecularly identified" mentions with
    "THSD1-mutation-positive"; rewrote the description to separate the
    confirmed-biallelic hydrops families from the single case-report child and
    to state that assigning that child to the recessive LMPHM13 entity is an
    inference (a single heterozygous variant would fit the wording, and
    heterozygous THSD1 is the dominant-aneurysm genotype this entry excludes);
    added that inference caveat to notes on the PLE, hypoalbuminemia, chronic
    lymphedema, and lymphatic-imaging items and on all three treatments.

    Blocking item 2 (deep research). Ran `just research-disorder openscientist
    Lymphatic_Malformation_13`; report + citations + artifacts committed under
    research/. Reconciled it against the entry and incorporated newly surfaced,
    molecularly confirmed biallelic cases that reduce reliance on the
    genotype-uncertain case: a homozygous splice variant (c.58+2T>G) with
    lifelong peripheral edema in a 79-year-old (PMID:42714234, added to the
    Lymphedema phenotype and as a variant), and a homozygous truncating variant
    (c.1009delC:p.Gln337Argfs*73) in a neonate with chylothorax (PMID:41842780,
    added as a new Chylothorax phenotype and a variant). Added the FAK-Beclin-1
    autophagy mechanism (PMID:38396816) to the cellular node. Al Rawi 2021
    (PMID:33569873) added to the bibliography as a confirmatory case (no
    extractable abstract). Recorded the reconciliation, the HPA lymphatic-EC
    enrichment, and OMIM #620244 in review_notes. Falcon 403s and only
    openscientist/claude_code are usable here; the DR run's own term-validation
    step timed out on a transient OLS error (MEDGEN:1840915), unrelated to the
    entry. Pruned three uncited DR-fetched caches (PMID_27895300, PMID_31055715,
    PMID_37993095); the Santiago-Sim aneurysm paper (27895300) was deliberately
    not cited to keep that excluded phenotype out of the entry.

    Blue suggestions taken: added a Systemic Lymphatic Transport Failure ->
    Hydrocele testis downstream edge; moved Hypoalbuminemia off the
    transport-failure INDIRECT edge to a sequela of Protein-losing enteropathy;
    set quote_role: BACKGROUND on the PMID:42583604 prior-literature snippet;
    added genetic_context (variant_origin: GERMLINE, functional_impact_category:
    LOSS_OF_FUNCTION) on the THSD1 Loss of Function node; listed all cited PMIDs
    in references:. Phenotype causal connectivity rose from 7/10 to 9/11 (81.8%).

    Validation (DISMECH_ROOT set): just validate (37/37 snippets, 0 issues),
    validate-terms, count-verified-snippets 37/37, validate-disorders,
    check-entity-refs, check-causal-targets, check-coarse-phenotypes,
    check-enum-values, check-qualifier-terms, check-block-scalar-comments,
    check-reference-titles, check-snippet-grading all OK; normalize-cache +
    check-term-cache-integrity clean (no new cache rows; HP:0010310 already
    cached); check_gene_activity_grounding.py --against-ref origin/main OK (the
    THSD1 exemption the coordinator added is respected, no newly ungrounded

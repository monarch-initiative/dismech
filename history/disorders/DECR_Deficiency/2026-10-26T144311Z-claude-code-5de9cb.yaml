  details: |
    The merge queue ejected this PR because test_no_new_snippet_grading_divergences failed: three quoted sentences carried two evidence_source values within the file. Two Orphanet ORPHA:431361 rows (the HP:0003234 carnitine row and the NADK2 gene row) had no evidence_source on one copy, which defaults to HUMAN_CLINICAL, while the other copy was OTHER; both are now OTHER, matching how Orphanet rows are graded across the KB. The PMID:24847004 patient-fibroblast respiration sentence was IN_VITRO in pathophysiology and HUMAN_CLINICAL in differential_diagnoses; it is now IN_VITRO in both, since the measurement was made in cultured fibroblasts. The supportive-care treatment quoted a clause of that same fibroblast sentence as HUMAN_CLINICAL; it now quotes the abstract's clinical case-description sentence instead, which the entry already cites as HUMAN_CLINICAL elsewhere. Validated with tests/test_snippet_grading.py (37 passed), count-verified-snippets (62/62) and just validate.

  summary: 'Create: Microcephaly 27, Primary, Autosomal Dominant'
  details: |
    New standalone entry for MCPH27 (MONDO:0030929), caused by heterozygous, mostly de novo LMNB2 missense variants. Kept separate from Autosomal_Recessive_Primary_Microcephaly (whose MONDO descendants exclude MCPH26/MCPH27), from the LMNB1 form (MCPH26, no entry yet), and from LMNB2 allelic conditions (biallelic LoF perinatal brain malformation, PME, acquired partial lipodystrophy). Deep-research report: research/Microcephaly_27_Primary_Autosomal_Dominant-deep-research-claude_code.md (falcon returned 503, claude_code used). All snippets quoted from cached PMIDs 33033404, 20145110, 21976703, 22116031; the two progenitor-mechanism branches are recorded as EMERGING hypotheses because only null mice support them, with a HUMAN_MODEL_MISMATCH discussion. LMNB2 bound to GO:0160123 structural constituent of nuclear lamina. Validated with validate-disorders, validate-terms and count-verified-snippets.

  summary: Comprehensive review of COQ8A-related ataxia
  details: |
    Reconciled this MONDO record to the COQ8A-specific primary coenzyme Q10 deficiency spectrum. Separated established CoQ biosynthesis and respiratory-chain defects from unresolved cerebellar-selectivity and cellular-stress mechanisms. Corrected phenotype frequency and connectivity. Added burden, inheritance, prevalence, progression, diagnostic caveats, observational treatment uncertainty, current registry, model, and knowledge-gap coverage. Incorporated relevant 2024-2026 evidence and documented negative COQ8A-specific interventional-trial and GEO accession audits.

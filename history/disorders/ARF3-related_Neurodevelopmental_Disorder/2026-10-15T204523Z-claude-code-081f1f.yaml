  summary: 'Create: ARF3-related_Neurodevelopmental_Disorder'
  details: |
    New entry for ARF3-related neurodevelopmental disorder (MONDO:0700366), claimed in issue 14421. Deep research: falcon was requested by default but was unavailable (deep-research-client providers --check: 'falcon: UNREACHABLE - 503 Failed to authenticate -- the provider reported a temporary server-side failure'); the --fallback flag does not fire for this retryable 503 class, so OpenScientist was run by hand (research/ARF3-related_Neurodevelopmental_Disorder-deep-research-openscientist.md). Its reference validation was clean (8/8 resolved) and preflight-dr passed (ARF3 mentioned 48 times). The report gives ARF3 as HGNC:653, which resolves to no term; the entry binds hgnc:654, verified as ARF3 against the HGNC build. Of the report's citations, PMID:20357002 (BIG-dependent TGN recruitment of Arf3) was added as evidence; PMID:42606787 (inherited ARF3 p.Arg99* in an unaffected parent) is mentioned in the genetic notes only, because a single carrier does not establish whether haploinsufficiency is tolerated; PMID:37185208 (ARF1 differential) and PMID:37102998 (ARF nanodomains) were not needed for any claim. Core sources were found by direct PubMed search: Sakamoto 2021 (PMID:34346499), Fasano 2022 (PMID:36369169, full text), the 2024 case report (PMID:38712921), Muto 2026 (PMID:41507605) and the El Ghouzzi and Boncompain 2022 commentary (PMID:36456556). No GeneReviews/StatPearls chapter (check-genereviews NO_CHAPTER) and no ClinGen classification. Pathophysiology is built as a chain from the variant through GTP/GDP cycling, Golgi/COPI disruption, endocytic recycling, spindle/precursor proliferation and cell death, and PCP-dependent axial defects; edges to phenotypes are model-organism and marked INDIRECT. Phenotype frequencies omitted because the cohorts are too small. Validation: just validate (schema, terms, references) passed; count-verified-snippets 82/82; validate-disorders passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-reference-titles and the snippet baselines clean. An independent pre-PR review (fresh-context subagent) found no blocking issues; applied: Golgi-to-recycling edge downgraded to indirect, spindle edge given its own quote, unsourced cell-death-to-developmental-delay edge removed, PCP node rebound from Wnt/PCP signalling to GO:0060026 convergent extension, cell death rebound to GO:0008219, lysosomal-overload and morpholino wording corrected, eight single-patient or imaging phenotypes added from Fasano 2022 and the case report, two zebrafish model links added. PR review round 1 (PR 14423): inferior vermis hypoplasia rebound from the HP:0006817 grouping term to HP:0007068; duplicate Subject 3 item removed from Delayed CNS myelination; partial cerebellar hemisphere fusion added (HP:0006899); Drosophila model record added from PMID:34346499; PMID:42606787 cited in the genetic notes; GTPase activity and GTP binding bound on the ARF3 Missense Variant node to clear the newly-ungrounded-genes CI gate. After the round: count-verified-snippets 84/84, check_gene_activity_grounding --against-ref origin/main OK.

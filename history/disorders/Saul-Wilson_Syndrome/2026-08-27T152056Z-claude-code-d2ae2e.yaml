  summary: 'Second pass: neutropenia denominator corrected, animal models, adult joint
    disease'
  details: |
    Corrected my own earlier read: I had curated intermittent neutropenia FREQUENT from the abstract's unquantified 'frequently observed'. The full text gives the denominator - absent in all four tested within the first two months of life, present in all twelve tested subsequently - so it is now VERY_FREQUENT with that quote and the timing caveat, which is the clinically actionable part. Added premature degenerative joint disease with YOUNG_ADULT onset. Added two animal models: the zebrafish COG4 p.Gly516Arg embryos, where the glypican/wnt4 mechanism was established, with the biphasic LGK974 rescue quoted together with its own caveat; and the C. elegans cogc-4(av107) knock-in as FAILS_TO_RECAPITULATE, a published negative that took a stress panel and an eight-gene RNAi screen to establish and should not have to be rediscovered.

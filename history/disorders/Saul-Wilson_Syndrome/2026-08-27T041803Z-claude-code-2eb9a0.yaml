  summary: 'Create: Saul-Wilson Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0230 (COG4, OMIM 618150). Deep research: claude_code provider; NEC preflight PASS with COG4 the dominant gene. GeneReviews (PMID:32078278) fetched and used as the phenotype baseline, including its Agents/Circumstances to Avoid item, which is curated as a treatment with the restriction quoted directly. Mechanism from PMID:30290151: the entry is explicit that this is not COG4 loss of function - mRNA and protein are preserved - and models the disorder as a bidirectional steady-state imbalance in Golgi traffic leading to Golgi volume loss, with a selective decorin glycosylation defect as the only demonstrated downstream molecular lesion. functional_impact_category is recorded as UNKNOWN rather than guessed, since no publication assigns the variant to a named functional class. A KNOWLEDGE_GAP discussion records that the decorin finding carries the entire explanatory weight between a shrunken Golgi and a skeletal dysplasia. Validation: schema clean, term validation passed, 23/23 snippets verified.

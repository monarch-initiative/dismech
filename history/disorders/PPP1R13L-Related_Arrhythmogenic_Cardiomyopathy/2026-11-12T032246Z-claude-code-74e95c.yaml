  summary: 'Review round 1: diagnosis and medical therapy'
  details: |
    Review round 1 for PR #17145. Added a diagnosis section of seven tests, each bound to an NCIT procedure term: echocardiography; cardiac MRI (right ventricular aneurysms, biventricular dysfunction and subepicardial late gadolinium enhancement, with early enhancement that can suggest myocarditis without meeting the Lake Louise criteria); 24-hour Holter monitoring; troponin; NT-proBNP; endomyocardial biopsy (fibrosis and endocardial fibroelastosis without an inflammatory infiltrate); and exome or genome sequencing, bound to Next Generation Sequencing because NCIT files whole-exome and whole-genome sequencing under it. Evidence is from PMID:35933355, PMID:42652917, PMID:41919412, PMID:32666529 and PMID:37698259. No LOINC codes were added. Added three treatments: heart failure pharmacotherapy with the agents PMID:42652917 names (furosemide, lisinopril, spironolactone, bisoprolol, dobutamine), which relieved congestion but did not prevent transplant listing; beta-blocker therapy for ventricular tachycardia (PMID:41919412), linked to Ventricular Arrhythmogenic Substrate; and empirical intravenous immunoglobulin for suspected myocarditis in two children (PMID:42652917, PMID:41919412), described as not disease-specific. ICD therapy is not modelled: the PubMed query PPP1R13L AND (defibrillator OR ICD OR cardioverter) returned no records on 2026-11-12, and none of the cited full-text reports describes one; the beta-blocker row's notes record this. The myocarditis differential is renamed Acute myocarditis and rebound from MONDO:0004496 myocarditis to MONDO:0002815 acute myocarditis so that its name, term and description agree, with MRI and biopsy evidence added. The missense variant c.1858G>C (p.Ala620Pro) is added as a variant of uncertain significance from its primary report (PMID:30453078, abstract only), whose authors left the role of PPP1R13L undetermined. The interleukin-1 blockade row still carries no therapeutic_modality because the cached abstract does not name the agent.

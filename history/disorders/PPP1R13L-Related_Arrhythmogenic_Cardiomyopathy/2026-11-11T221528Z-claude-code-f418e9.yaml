  summary: 'Create: PPP1R13L-Related Arrhythmogenic Cardiomyopathy'
  details: |
    New entry for the autosomal recessive cardiocutaneous syndrome caused by biallelic PPP1R13L (iASPP) loss of function, bound to MONDO:0957795 (OMIM:620519). Named PPP1R13L-Related Arrhythmogenic Cardiomyopathy because the MONDO/OMIM label names only the phenotype and would also describe the JUP (Naxos) and DSP (Carvajal) cardiocutaneous syndromes; the gene-related form is used in recent literature (PMID:41928611, PMID:41919412), and the MONDO label is kept as a synonym.

    The entry covers 19 phenotypes (16 causally connected; orofacial cleft, glaucoma and anorectal anomaly are each reported in a single family with no proposed mechanism and are left unconnected with notes), 9 pathophysiology nodes and 74 evidence items from 18 PubMed references plus the ClinGen record. The ClinGen Definitive (AR) classification from the Dilated Cardiomyopathy GCEP is copied into gene_disease_validity with its table row as evidence.

    Mechanism is recorded as two EMERGING hypothesis groups rather than a single desmosomal chain: loss of desmoplakin and desmin anchoring at cardiomyocyte intercalated discs (exon 8 deletion mouse; desmin loss in explanted patient hearts) and a lowered threshold for NF-kappaB p65-driven inflammation (patient fibroblasts, knock-down cardiomyocytes, wa3 mouse hearts). A knowledge-gap discussion records that the two arms have not been compared in one model and that the p53-inhibitory activity of iASPP has not been tested in this disease. Cardiac nodes conform to cardiomyopathy_maladaptive_remodeling; the cardiomyocyte and keratinocyte anchorage nodes conform to desmosomal_adhesion_failure. Five animal models are linked (wa3, exon 8 deletion and conditional mice, woe2 mouse with a partial ectodermal phenotype, Poll Hereford cattle). Treatments are limited to what sources report: heart transplantation, ventricular assist device bridging and adjunctive IL-1 blockade (two patients; reduced ectopy without contractile recovery).

    Deep research: falcon returned HTTP 403 and the run fell back to OpenScientist (research/PPP1R13L-Related_Arrhythmogenic_Cardiomyopathy-deep-research-openscientist.md). Its reference validation resolved 19 of 19 references with none unresolved; term validation flagged HP:0002216 cited as woolly hair (the entry uses HP:0002224); preflight-dr passed. The report was used as leads only; every cited reference was fetched and quoted directly. The report states that no carrier-frequency estimate exists, but the discovery study reports 11 carriers among 100 village residents, which the entry records.

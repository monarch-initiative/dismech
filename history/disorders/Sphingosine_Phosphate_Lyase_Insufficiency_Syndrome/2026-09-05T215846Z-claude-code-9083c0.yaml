  summary: 'Create: Sphingosine_Phosphate_Lyase_Insufficiency_Syndrome (SGPL1, MONDO:0033203)'
  details: |
    Created the SPLIS (nephrotic syndrome type 14) entry as a single Disease (stub entry_type decision: DISEASE; one gene, one conserved mechanism with organ-specific branches). Sources: GeneReviews chapter PMID:33074640 (tagged, Clinical Characteristics cross-referenced against phenotypes: SRNS, PAI with/without mineralocorticoid deficiency, hypothyroidism, testicular insufficiency, immunodeficiency, neurological features incl. cranial nerve deficits, developmental regression, peripheral neuropathy, ichthyosis all captured; cardiac manifestations noted in description only, no HPO binding since GeneReviews gives no specific lesion), the three 2017 gene-discovery papers (PMID:28165343, PMID:28165339, PMID:28181337), the 2023 systematic review (PMID:36371483), the 2024 natural history study of 76 patients (PMID:39334450), the endocrine series (PMID:35904228), the gnomAD prevalence estimate (PMID:39669624), and mechanism papers on B6 responsiveness (PMID:32233035, PMID:42182331), mitochondrial dysfunction (PMID:32682944), keratinocyte differentiation (PMID:36868360), Rho/ROCK cytoskeletal signalling (PMID:42024444) and AAV9 gene therapy (PMID:33755599, PMID:37958544). Deep research: Edison/falcon report research/Sphingosine_Phosphate_Lyase_Insufficiency_Syndrome-deep-research-falcon.md (11/11 references verified, 24/24 terms verified, preflight-dr PASS against MONDO:0033203); all of its cited PMIDs were already in the cached set used here, and its phenotype and mechanism sections were cross-checked against the entry. Pathophysiology is a causal chain from biallelic SGPL1 loss through sphingoid base accumulation into podocyte (conforms_to nephrotic_podocyte_injury), adrenocortical, lymphocyte-egress, keratinocyte, mitochondrial and neuronal branches. Model links: Sgpl1-/- mouse, R222Q knock-in mouse, Drosophila Sply, SGPL1-KO organotypic skin. Validation: just validate (pass), just validate-terms (pass), just count-verified-snippets 97/97, check-causal-targets and check-entity-refs clean. One snippet was shortened because bracketed spans are stripped before matching.

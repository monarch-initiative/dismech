  summary: 'Create: Naxos disease'
  details: |
    Created Naxos disease (MONDO:0011017), an autosomal recessive JUP/plakoglobin cardiocutaneous syndrome combining ARVC with woolly hair and palmoplantar keratoderma. Deep-research provider: OpenScientist (user-selected in place of Falcon). Evidence built from verified primary literature with exact-quote abstract snippets: McKoy 2000 Lancet (PMID:10902626, founder plakoglobin 2-bp deletion), Protonotarios genotype-phenotype JACC (PMID:11691526, 100% penetrance by adolescence + arrhythmia/mortality data), Cardiovasc Pathol review (PMID:15210133), Indian Pacing EP J review (PMID:16943947), ICD therapy (PMID:10914377). GeneReviews ARVC Overview (PMID:20301310) tagged as baseline. Pathophysiology chain: plakoglobin loss -> intercalated-disc + cutaneous/hair-follicle desmosome failure -> fibrofatty myocardial replacement (conforms_to cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling) -> ventricular arrhythmia/sudden death. Validated: schema/terms/references all pass; compliance 97.4% (98.6% weighted).

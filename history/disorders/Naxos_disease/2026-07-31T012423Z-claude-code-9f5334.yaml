  summary: Augment Naxos disease with deep-research evidence
  details: |
    Incorporated deep-research findings. OpenScientist (user-selected provider) timed out server-side after 3600s with no report; used the claude_code provider as a reliable fallback to produce the DR artifact (research/Naxos_disease-deep-research-claude_code.md, 15 citations). Independently verified each new PMID/snippet per the DR anti-hallucination SOP: added exact-quote evidence from the authoritative Orphanet J Rare Dis review (PMID:16722579) for mechanical-stress-dependent adhesion failure, congenital woolly-hair and first-year PPK onset, ICD indication, antiarrhythmic/heart-failure pharmacotherapy, and end-stage heart transplantation; added Heart transplantation (MAXO:0010039) and exercise-avoidance (MAXO:0000077) treatments. Discarded two DR-mis-cited PMIDs that failed verification: the report gave MONDO:0009782 (wrong; correct is OAK-verified MONDO:0011017) and PMID:9610534 for a Coonar linkage study (actually an unrelated obesity paper). Validated: schema/terms/references all pass; compliance 97.7% (98.8% weighted), 33 evidence items.

  details: |
    Addressed ai4c-reviewer REQUEST_CHANGES on PR #7249 and a user instruction to avoid MAXO entirely. Swapped all treatment/diagnosis terms from MAXO to NCIT (ICD NCIT:C80435, Heart Transplantation NCIT:C15246, Exercise Counseling NCIT:C101235, Cardiac Ablation NCIT:C100068, Physical Examination NCIT:C20989, Diagnostic Procedure NCIT:C18020). Added the NaV1.5/SCN5A sodium-channel arm to the gap-junction node (PMID:23178689). Fixed the syncope evidence to a direct quote (PMID:16722579). Added evidence to exercise-restriction and catheter-ablation treatments (PMID:25894016, including the caveat that antiarrhythmics do not reduce sudden-death risk). Fixed the parents case to lowercase to resolve to the ARVC entry. Downgraded the nuclear-plakoglobin Wnt node to PROVISIONAL and added a HUMAN_MODEL_MISMATCH discussion (DSP-model vs JUP disease). Broadened the LV term to HP:0001711 Abnormal left ventricle morphology. Added histopathology, progression (3 phases), diagnosis (3 entries incl. the cutaneous-recognition pearl and plakoglobin IHC PMID:22036107), and differential_diagnoses (Carvajal PMID:25824144, myocarditis). Did NOT adopt reviewer suggestion HP:0007542 for PPK (OAK shows it is Absent pigmentation of the ventral chest, not diffuse PPK). Validated: schema/terms/references pass; compliance 95.7 percent weighted 96.4 percent.

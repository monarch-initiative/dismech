  summary: Fix sodium-channel evidence_source; add Carvajal MONDO + Naxos-specific
    model evidence
  details: |
    Addressed the single blocker in ai4c-reviewer re-review of PR #7249: the PMID:23178689 sodium-channel evidence was tagged HUMAN_CLINICAL but its snippet was a BACKGROUND sentence about prior mouse/in-vitro work. Swapped to the paper's own human myocardial IHC result ('Immunoreactive signal levels of PKG, Cx43, and NaV1.5 were disturbed in 74%, 70%, and 65% of the patients, respectively'), which is correctly HUMAN_CLINICAL and covers plakoglobin, Cx43, and NaV1.5 in one quote. Non-blocking improvements: added disease_term MONDO:0011581 to the Carvajal differential (matching the existing Carvajal_Syndrome entry) and updated its notes; strengthened the HUMAN_MODEL_MISMATCH discussion with gene-correct plakoglobin-2057del2 model evidence (PMID:26015932, SB216763 rescue in a zebrafish Naxos model), MODEL_ORGANISM. Kept NCIT:C18020 for the plakoglobin-IHC diagnosis because NCIT:C16722 is rejected by the diagnosis-term enum. Validated: schema/terms/references pass; compliance 95.8 percent weighted 96.4 percent.

  details: |
    Addressed the eight IMPORTANT items by consuming the committed OpenScientist report. (1) Added the urinary frequency phenotype (Pollakisuria HP:0100515, not the report's wrong HP:0000103 Polyuria) from the dysuria/urgency/frequency sentence already quoted (PMID:30419565), and wired all three lower-tract phenotypes from the inflammation node (3/3 connected). (2) Added fosfomycin (CHEBI:28915) and trimethoprim-sulfamethoxazole (CHEBI:45924/9332) first-line treatments, naming pivmecillinam and the fluoroquinolone deprioritization in prose (PMID:34896337). (3) Added a lifetime-prevalence record (50-60% in adult women, PMID:31105774). (4) Added genetic susceptibility rows for TLR2 G2258A (hgnc:11848, PMID:20016852) and FUT2 non-secretor status (hgnc:4013, PMID:12010227), both relationship_type SUSCEPTIBILITY. (5) Added environmental PREDISPOSES entries for frequent sexual intercourse (influences_mechanisms -> Ascending Bladder Seeding) and diabetes mellitus (PMID:15630106; the diabetes snippet uses the bracket-free 'Diabetes and incontinence also seem to independently increase the risk' sentence to avoid the LRV bracket trap, and both entries note the study quantified these shared UTI risk factors for the ascending complication, pyelonephritis). (6) Added a diagnosis block (urine dipstick + culture, PMID:23859578). (7) Split the bundled Urothelial Adhesion and Proliferation node into FimH-Mediated Urothelial Adhesion and UPEC Invasion and Intracellular Bacterial Communities (the IBC reservoir underlying recurrence), retargeting the seeding edge and the nitrofurantoin treatment. (8) Added a progression block (acute episode, resolution/recurrence via IBCs, ascending pyelonephritis), clearing NO_PROGRESSION. Also moved the deep-research session log out of notes into this record: the Falcon request fell back to OpenScientist, all 31 references resolved, two asserted quotes were unsupported and several report HP/CHEBI identifiers were wrong, so only manually checked claims and locally cached bindings were kept. Five reference_title values were initially mistyped and corrected against the cache frontmatter before validation. validate, validate-terms, validate-disorders (LRV, 17/17) and the connectivity/grading/source-defect gates all pass. Deferred: a MOLECULAR TLR4/NF-kB node and the suprapubic pain/pyuria/hematuria phenotypes (optional suggestions).

  summary: 'Review round 1 on PR 18673: three GeneReviews sentences, two quote roles'
  details: |
    Answers the automated review of PR 18673. Three sentences of the GeneReviews summary
    that the entry did not use are now quoted: the GeneReviews criterion for the diagnosis
    of DICER1-related tumour predisposition, on the DICER1 genetic testing row, whose
    description now opens with it (graded OTHER, as a diagnostic criterion, like the entry's
    other GeneReviews recommendation); the 50% chance that each child of a carrier of a
    germline constitutional variant inherits it, on the inheritance block, whose description
    now states it; and that the childhood tumour generally presents in young children but
    has also been reported in adolescents, on the tumour node. The 2019 neoplasm-risk
    study's sentence on early diagnosis and resection, used on two of the entry's surgical
    links, now carries quote_role BACKGROUND: it is a framing sentence in the study's
    discussion, not a finding of the study, which measured how often carriers develop
    neoplasms (cystic nephroma among them) and did not examine the treatment of cystic
    nephroma or its progression to renal sarcoma. Validated with just validate and
    count-verified-snippets (78 of 78).

  summary: 'Create: Pediatric Cystic Nephroma'
  details: |
    New entry for the childhood cystic nephroma, the DICER1-associated benign multicystic
    kidney tumour of young children. Curated by hand from cached sources: the DICER1
    GeneReviews chapter (summary only), a 2024 surveillance study of 713 carriers from two
    registries and an NCI study (full text), the 2019 study of neoplasm risk in DICER1
    carriers (quoted from its cleanly spaced sentences but one, which keeps the cached full
    text's run-together words), a 2017 series comparing 7 childhood with 12 adult tumours, a
    2021 review (cached as full text) pooling 113 published cases of cystic partially
    differentiated nephroblastoma and 167 of cystic nephroma, a 2014 series of 20 childhood
    tumours, a 2010 study of two families with familial cystic nephroma, a 2017 family
    report, a 2016 and a 2026 case report, a 2026 series of five DICER1-mutated kidney
    tumours, a 2017 ultrasound review, a 2019 review of DICER1 variants, the 2021 European
    surveillance guideline, and a 2014 exome study of pleuropulmonary blastoma for the
    microRNA step. MONDO has no class for the childhood tumour alone, so the entry is bound
    to childhood multilocular cystic kidney neoplasm (MONDO:0004356) with skos:broadMatch,
    since that term also covers cystic partially differentiated nephroblastoma; benign
    cystic nephroma (MONDO:0002385), under which the claim was filed and whose NCIt
    cross-reference is the adult tumour, is recorded with skos:relatedMatch. The adult
    tumour is named in the description and left out. The chain runs from a germline DICER1
    loss-of-function variant, conforming to the germline two-hit module as the DICER1 tumour
    predisposition entry does, through a somatic RNase IIIb second hit (the origin node; no
    cell is bound, because the cited sources do not establish the cell of origin) and
    defective microRNA processing (graded INDIRECT throughout, because no cited source
    measures microRNAs in this tumour) to the cystic tumour, its presentations, one thin
    step to anaplastic sarcoma of the kidney and the other DICER1-related tumours. Four
    histology rows, ultrasound surveillance, histopathology and DICER1 testing, nephrectomy
    and nephron-sparing surgery linked to the tumour, nephrectomy also to the sarcoma step,
    one outcome phase, one prevalence row (a count of published cases) and the DICER1 gene
    row with two case fractions complete it. The review's full text gives the defining septa
    criterion, the presenting mass in 62 of 88, bilateral disease in 9 of 167 and the
    surgical approaches. The deep-research report generated for this entry was used as a
    lead and is not committed. Validated with just validate, validate-terms and
    count-verified-snippets (75 of 75).

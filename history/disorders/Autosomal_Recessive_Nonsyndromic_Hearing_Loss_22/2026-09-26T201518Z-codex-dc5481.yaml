  summary: Review OTOA clinical spectrum, structural alleles and mouse physiology
    against source context
  details: |
    Reviewed the complete entry and OpenScientist report; preflight PASS and no disease-specific GeneReviews/StatPearls chapter found. Read cached full text of the Korean functional, conversion, Japanese clinical, Filipino implant and South Indian deletion studies; inspected the Pakistani OTOA case and CNV methods, the ERCC4 blended-phenotype full-text results and limitations, and the earlier case-control CNV results. The Dutch cache labeled full_text_html contained abstract/landing-page material, so only the abstract supports its use. Retrieved founding and carrier-risk full text into URL caches through the reference fetcher. The mouse primary PMID cache remains abstract-only and the reference fetcher repeatedly returned browser challenges; independently retrieved and read its complete public PMC article, methods summary, tables and figure captions through requests at https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3511093/?report=reader, without hand-editing any reference cache. Separate supplements and raw datasets were not independently inspected. The Chinese six-pedigree source remains abstract-only after refetch. Corrected the false structurally-normal membrane and unchanged-DPOAE claims using mouse full-text Results/Figures 3-5; CAP tuning was sharper, not unchanged. Added mid-frequency and possible progressive presentations with Japanese VUS/segregation limits; removed pooled frequency and severity overclaims. Distinguished measured conversion from proposed formation mechanisms and corrected the assertion that CNV pipelines cannot flag conversions. Limited model-to-human transfer, carrier-risk inference, contiguous-deletion attribution and mixed-genotype implant outcomes. Added general GeneReviews care with explicit scope. Read the noncoding-variant-impact skill for conversion and deletion interpretation. No infectious or environmental disease entry reviewed.

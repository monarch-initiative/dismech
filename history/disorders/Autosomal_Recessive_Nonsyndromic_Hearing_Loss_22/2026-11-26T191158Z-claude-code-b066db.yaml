  summary: Record ClinGen Definitive tier for OTOA; bind cell-matrix adhesion on the
    otoancorin node
  details: |
    Recorded the ClinGen Hearing Loss expert panel's Definitive autosomal recessive classification for OTOA on the gene record, quoting the CGGV row, and mapped MONDO:0019497 as a broad match because the panel files the record under that class. Set germline origin on the gene record. Bound GO:0007160 cell-matrix adhesion (DECREASED) on the otoancorin node, which previously carried no GO term; the Otoa-null mouse (PMID:23129639) shows the tectorial membrane detached from the limbal surface. A review of the five human OTOA GO annotations found no conflict with the entry's mechanism chain. Validation: validate-disorders, count-verified-snippets, check-gene-validity and the offline structural gates.

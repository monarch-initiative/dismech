  summary: 'Create: ARNSHL22 / DFNB22 (MONDO:0011762)'
  details: |
    De-novo curation from claim issue #11717. The mechanistic core is that the lesion is not in the hair cell: otoancorin is made by non-sensory interdental cells of the spiral limbus, and the Otoa-null mouse shows the tectorial membrane keeping its form and its contact with outer hair cells while losing only its limbal attachment, so inner hair cell sensitivity falls while outer hair cell amplification and cochlear tuning survive. Curated Preserved Outer Hair Cell Amplification as an explicit node because the preserved function is diagnostically useful rather than merely an absence of damage, and recorded the preserved masker tuning curve as an UNCHANGED readout because that negative result is what identifies the defect as one of stimulation rather than transduction. Every mechanistic node below the trigger is graded MODEL_ORGANISM or IN_VITRO and none is upgraded to a human claim; a HUMAN_MODEL_MISMATCH discussion records that the mouse account does not predict the post-lingual sloping loss most human probands have, and proposes otoacoustic emission testing as the decisive cheap test. Declined to curate a prevalence rate: the only population-level figure available is a diagnostic-yield share from one referred cohort, which is not a prevalence. The OpenScientist report timed out at 3600 s on the first attempt and was cancelled; the committed report is a retry at a longer timeout. It changed the entry substantively rather than confirming it: it supplied a deletion-only carrier frequency (39/19,189 CMA tests, 0.2%) that corrected a sentence in this entry asserting no population estimate existed, gene conversion from the OTOAP1 pseudogene as a third allele class carrying p.Glu787*, and a contiguous-gene 16p12.2 deletion. All three were verified against their primary sources before use. The gene-conversion material is the most valuable because it identifies a genotype that neither a sequencing pipeline nor a copy-number pipeline reports. Validated: linkml-validate, linkml-term-validator, 30/30 snippets verified, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms.

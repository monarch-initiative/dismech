  summary: 'Review round 1: human OAE datapoint and pooled onset frequencies'
  details: |
    Answered both IMPORTANT findings on PR #11724 in one push. Both had the same root
    cause, which the reviewer identified correctly: the entry treated PMID:37114731 as its
    only source of human phenotype data while PMID:33492714, already cited three times
    here, had more.

    Finding 1. The HUMAN_MODEL_MISMATCH discussion asserted that human otoacoustic-emission
    data "has not been reported", and notes said the entry declines to assert anything
    about patient OAEs because the measurement is murine. A reference in this entry's own
    cache contradicts the first claim: a genetically confirmed biallelic OTOA proband
    failed newborn OAE screening in both ears, four times. Verified against the cache
    before acting.

    Curated as REFUTE on the Preserved Outer Hair Cell Amplification node, HUMAN_CLINICAL,
    directness INDIRECT, with the reasons it is not decisive stated in the explanation: a
    newborn screen is pass/fail rather than a distortion-product measurement, n is one, and
    neonatal screens fail routinely for middle-ear reasons. The node stands. The
    discussion rationale and the notes block now say all of this instead of claiming the
    measurement does not exist.

    This is the second false negative-existence claim in this batch of five entries. DKCB8
    asserted that no patient had received a fluoropyrimidine when its own cached full text
    reported one. Both were written from an abstract while the full text sat in the same
    PR. Nothing gates a claim that something has not been reported.

    Finding 2. Congenital Onset was FREQUENCY OCCASIONAL on 1 of 6 probands from
    PMID:37114731 alone. PMID:33492714 adds two more probands and both are congenital: one
    explicitly so in the source's words, one by failed newborn screening with moderate loss
    confirmed by brainstem audiometry at four months. Pooled that is 3 of 8, which is HPO
    FREQUENT rather than OCCASIONAL. Regraded, with both new probands cited.

    The pooling caveat is now stated rather than left implicit. The two cohorts were
    ascertained differently: the European pair reached genetics through newborn screening,
    which selects for early-onset disease, while the Chinese series came from sporadic
    deafness pedigrees. Postlingual Onset stays FREQUENT, since 5 of 8 is still within band,
    but its description now carries the pooled denominator.

    Both probands are compound heterozygous for a pseudogene-converted allele in trans with
    a deletion, which is a third allele class the otoa_allele_class_and_onset discussion
    had no onset data for. Folded in, with the reason it still does not support a
    genotype-phenotype correlation.

    Suggestions taken: the GO:0050910 binding caveat, recorded in the node description
    since BiologicalProcessDescriptor has no notes slot.

    Declined: the disease-level severity range sourced from PMID:32681043. That paper's
    "moderate to severe" is its cohort recruitment criterion for 21 sporadic hearing-loss
    patients, one of whom had an OTOA deletion, not a characterization of OTOA hearing
    loss. Also declined the OMIM mappings, since the schema has no OMIM slot, and
    speech/language delay, which no cited reference supports.

    One error of my own, caught by validation rather than by care: I wrote a
    reference_title for PMID:33492714 from recollection instead of copying it from the
    cache frontmatter, in three places. The reference validator rejected all three. The
    real title is "Molecular characterization of pathogenic OTOA gene conversions in
    hearing loss patients."

    Validation: 33/33 snippets verified, up from 30/30. Schema and terms pass.
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms
    and check-enum-values all clean.

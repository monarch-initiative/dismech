  summary: 'Create: Progressive Cardiac Conduction Disease (Lenegre-Lev)'
  details: |
    Curated Progressive Cardiac Conduction Disease / hereditary Lenegre-Lev (MONDO:0019490), previously represented only piecemeal. SCN5A loss-of-function prototype: reduced Nav1.5 sodium current slows conduction, amplified by age-related conduction-system fibrosis, producing progressive AV/bundle-branch block, syncope, pacemaker dependence and sudden-death risk. Only the trigger node conforms to cardiac_ion_channel_repolarization (the disease-specific His-Purkinje conduction chain is modeled locally rather than mapped to the module's SAN/VT branches). Allelic overlap with Brugada syndrome recorded. All snippets verified; full validation passes.

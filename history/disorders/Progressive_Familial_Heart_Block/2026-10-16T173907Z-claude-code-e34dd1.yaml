  summary: Merge Progressive_Cardiac_Conduction_Disease into Progressive_Familial_Heart_Block
  details: |
    Merged the duplicate Progressive_Cardiac_Conduction_Disease entry, which bound the same disease_term (MONDO:0019490), into this entry and deleted it. This entry was kept as the survivor because it already carries the skos:exactMatch mapping to MONDO:0019490 and the SCN5A (Type 1A) / TRPM4 (Type 1B) subtype structure.

    Folded in from the retired entry: five synonyms (including the retired entry name); parents Cardiovascular Disease and Genetic Disorder; the harrisons_chapter classification (CARDIOVASCULAR, GENETICS_ENVIRONMENT_DISEASE); the Worldwide prevalence record (measure and class UNKNOWN); the inheritance description and its PMID:16643399 evidence; biological_scale on all five pathophysiology nodes; the trigger node's conforms_to to cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant plus its PMID:16643399 and PMID:12747584 evidence; a direct edge to Progressive Atrioventricular and Bundle-Branch Block on the conduction-slowing node; PMID:16643399 evidence on the block node, and a pacemaker-dependence sentence on the outcome node; the Heart Block (HP:0012722) and Right Bundle Branch Block (HP:0011712, subtype Type 1A) phenotypes; the SCN5A genetic record's PMID:16643399 evidence, frequency text and a note on why no ClinGen assertion is recorded; therapeutic_modality DEVICE on pacemaker implantation; and the GeneReviews-scope paragraph of the notes. The notes now describe trigger-only module conformance in place of the earlier statement that the entry declares no conforms_to.

    Dropped as true duplicates: the retired entry's description, disease_term and autosomal dominant inheritance term; its PMID:15809371 fibrosis snippet on the fibrosis node, which is a substring of a sentence this entry already quotes from the same paper; and the shared pacemaker treatment term (NCIT:C80434). Evidence snippets were copied without edits. Not carried over because the quotes did not support the claims: penetrance INCOMPLETE (no cited source states penetrance), and the PMID:15809371 sentence on Scn5a+/- mouse ventricular fibrosis on the conduction-slowing node and the Atrioventricular block phenotype. The Right Bundle Branch Block phenotype's PMID:16643399 quote was replaced with the sentence from the same paper that reports complete right bundle branch block in 17 of 78 SCN5A carriers.

    The retired entry's history record was moved here with a target.superseded_by block, and the node-class worked example was repointed to Slowed His-Purkinje and Atrioventricular Conduction. Validated with just validate, validate-terms, count-verified-snippets (34/34), validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-block-scalar-comments, node-classes --verify-kb, check_shared_disease_terms.py and targeted pytest; all passed.

    Review round on PR 14555: corrected the SCN5A note on which ClinGen assertions are cached (DCM, ARVC and the lumped SCN5A-related cardiac rhythm disorder MONDO:1010181; none for Brugada syndrome); removed the PMID:16643399 pacemaker-implantation quote from the Syncope phenotype and the syncope/SCD outcome node, where it did not mention syncope; did not carry over the retired entry's cardiac muscle cell and cardiac conduction annotations onto the outcome node; dropped frequency OBLIGATE from the new Heart Block phenotype; removed a clause about cache state from the GeneReviews notes paragraph.

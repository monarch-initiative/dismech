  details: |-
    Reviewed and enriched Progressive_Familial_Heart_Block (MONDO:0019490). Repaired title-only PMID:10471492 baseline defect on SCN5A genetic entry using abstract-verified PMID:12747584 alongside PMID:12598077 and PMID:16643399, and added variant_origin GERMLINE on SCN5A and TRPM4 plus ClinGen validity scope note on TRPM4. Cleaned notes to remove literal allelic Brugada GeneReviews PMID citation and procedural issue narration so GeneReviews baseline gating resolves cleanly. Added MONDO synonyms, evidence on classifications and prevalence (PMID:35205305), GO:0005227 calcium-activated cation channel activity (INCREASED) on Inherited Conduction-System Ion-Channel Defect, UBERON cardiac conduction locations across all 5 pathophysiology nodes while preserving Slowed His-Purkinje and Atrioventricular Conduction, wired all 7 phenotypes via bare-name downstream edges, and added Resting and Serial Electrocardiography (NCIT:C38053) and Molecular Genetic Testing of Conduction-Disease Genes (NCIT:C15709) to diagnosis.

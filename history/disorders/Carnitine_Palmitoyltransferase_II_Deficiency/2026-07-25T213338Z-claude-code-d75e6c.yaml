  summary: Correct a false schema-constraint claim; use multivalued subtypes; mine
    remaining GeneReviews
  details: |
    CORRECTION plus completion, addressing the re-review on PR #6988.

    False schema constraint asserted (the blocking item). A notes field added in
    the previous response stated "the schema permits only one subtype value".
    That is wrong. Phenotype carries both a scalar subtype slot and a multivalued
    subtypes slot, and the plural is documented for precisely this case: "Use
    this multivalued form when an item is characteristic of more than one subtype
    with overlapping features." It is foreign-key checked by
    test_subtype_foreign_keys and already used in Acute_Lymphoblastic_Leukemia,
    Inherited_Porphyria and Hermansky_Pudlak_Syndrome.

    This is the more damaging kind of error: committed to the KB it would teach
    the next curator to narrate a limitation that does not exist, and it directly
    contradicted the PR's own thesis that scope must be structured rather than
    narrated. Three phenotypes were still narrating scope and are now structured:
    - Hypoketotic hypoglycemia: scalar subtype plus a disclaiming note ->
      subtypes [Severe infantile, Lethal neonatal]
    - Cardiomyopathy: free-text context naming all three forms ->
      subtypes [Severe infantile, Lethal neonatal, Myopathic]
    - Liver dysfunction: free-text context -> subtypes [Severe infantile,
      Lethal neonatal]
    The false-constraint sentence is deleted. The GeneReviews sentence already
    quoted in this PR supports all three assignments, and is now attached as an
    evidence item to Cardiomyopathy and Liver dysfunction - Cardiomyopathy's
    context had attributed a claim to GeneReviews without carrying the citation.

    evidence_source consistency within the file. GeneReviews items were tagged
    OTHER while PMID:40633017 had been retagged HUMAN_CLINICAL in the previous
    round, leaving the file internally inconsistent. All six PMID:20301431 items
    are now HUMAN_CLINICAL, matching the sibling
    Carnitine-Acylcarnitine_Translocase_Deficiency entry and the KB-wide
    convention. (The broader question of what evidence_source GeneReviews should
    carry is raised as issue #6997; this change follows the existing convention
    rather than preempting that decision.)

    Remaining GeneReviews content mined, all four items the re-review listed:
    - Relative-frequency anchors added to the myopathic prevalence record: the
      myopathic phenotype is the most common disorder of lipid metabolism
      affecting skeletal muscle AND the most frequent cause of hereditary
      myoglobinuria. For a disorder with no published population denominator
      these are the closest thing to a rate the literature offers.
    - Sex bias added: males are more likely to be symptomatic than females - a
      fact absent from the entry entirely.
    - Triheptanoin dosing added: one third of daily calories, with MCT oil
      substituted where triheptanoin is unavailable. Dosing for the one approved
      therapy was previously absent.
    - Rhabdomyolysis VERY_FREQUENT now states in notes that the band is carried
      by the myoglobinuria 86% figure as a proxy, since no source reports a
      rhabdomyolysis percentage directly.

    Validation. Schema, term and reference validation all pass; tests/test_data.py
    subtype selection passes 3254 tests, confirming the multivalued subtypes
    foreign keys resolve.

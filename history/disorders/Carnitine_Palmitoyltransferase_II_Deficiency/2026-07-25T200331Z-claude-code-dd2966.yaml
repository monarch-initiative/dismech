  summary: 'Review: add three-subtype structure, correct bezafibrate to a refuted
    therapy, scope frequencies'
  details: |
    Review of the fourth-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Refuted therapy presented as promising (the most consequential finding).
    Bezafibrate was curated as an investigational candidate whose "efficacy
    remains uncertain without larger controlled outcome data", citing only the
    trial registration. The trial has in fact reported, and the result is
    negative: a 3-month randomized, double-blind, crossover study in CPT II
    (n=5) and VLCAD (n=5) deficiency found that despite the expected lowering of
    LDL, triglyceride and free fatty acid concentrations, there were no changes
    in palmitate oxidation, total fatty acid oxidation, or heart rate during
    exercise. The authors graded it Class I evidence that bezafibrate is
    ineffective and concluded explicitly that the in vitro promise of fibrates
    does not translate in vivo (PMID:24453079). Added three REFUTE evidence
    items - the first REFUTE-tagged evidence in this entry - and rewrote the
    description and notes. Deliberately retained the treatment rather than
    deleting it, so that a refuted hypothesis is recorded as refuted instead of
    silently disappearing and being re-proposed later.

    Triheptanoin understated in the opposite direction. It was described as
    experimental ("UX007", "not yet specifically approved"), bound to the
    absurdly broad therapeutic_agent CHEBI:17855 "triglyceride", and evidenced
    only by trial registrations. Triheptanoin is an approved therapy (Dojolvi)
    for long-chain fatty acid oxidation disorders as a class - which includes
    CPT II deficiency - with a positive cardiac effect in a double-blind
    randomized comparison against MCT and improvement in major clinical events
    in open-label extensions (PMID:40633017). Renamed to its approved name,
    re-evidenced, and its anaplerotic rationale stated (conventional
    even-chain MCT supplies acetyl-CoA but does not replenish depleted TCA-cycle
    intermediates). The two treatments are now correctly separated: one approved,
    one refuted, where previously both read as "promising but unproven".

    Missing subtype structure. The entry described three well-defined clinical
    forms in prose but had no has_subtypes block at all, so every phenotype sat
    flat at the disease level and severity information lived in free-text context
    strings. Added three subtypes bound to their own MONDO terms - Myopathic
    (MONDO:0009704), Severe infantile (MONDO:0010914), Lethal neonatal
    (MONDO:0012136) - each evidenced from its own Orphanet record (ORPHA:228302 /
    228305 / 228308, all four CPT2 Orphanet cache files built for this review).
    Eleven phenotypes reassigned to their subtype via the structured subtype
    foreign key, replacing free-text context.

    Frequency scope error corrected. Rhabdomyolysis, myalgia and muscle weakness
    carried disease-level frequency bands (VERY_FREQUENT, VERY_FREQUENT,
    FREQUENT) derived from percentages - 94% myalgia, 86% myoglobinuria, 76%
    weakness - that come from a retrospective cohort of 50 patients with MUSCLE
    CPT II deficiency. Those are myopathic-subtype frequencies, not frequencies
    across CPT II deficiency as a whole, and applying them disease-wide implies
    that lethal-neonatal patients present with exercise-triggered myalgia. Fixed
    structurally by the subtype assignment, and each affected evidence item's
    explanation now states the cohort scope explicitly.

    Unverifiable case breakdown removed. The description asserted 245 cases
    "distributed as 21 lethal neonatal, 32 severe infantile hepatocardiomuscular,
    and 192 myopathic". The 245 total is verifiable in the cited abstract
    (PMID:39429887); the three-way breakdown is not - it comes from a
    deep-research read of the full text, which is not retrievable. Kept the
    verified total, dropped the unverified split.

    Prevalence rebuilt. Previously one record with no population, measure_type,
    prevalence_class or evidence, asserting "approximately 1-9 per 100,000" from
    an unnamed narrative review. That figure could not be traced to any cited
    source and was dropped. Replaced with two evidenced records: a worldwide
    CASES_IN_LITERATURE record for the 245 reported cases, and a myopathic-subtype
    record capturing its relative predominance, both carrying the caveat that
    case counts are a floor because the myopathic form is under-ascertained when
    between-episode biochemistry is normal.

    Progression rebuilt. Previously a single unnamed, unevidenced phase mixing
    all three forms. Split into three subtype-scoped evidenced phases. This
    surfaced a fact the flat version obscured: the myopathic form is not
    primarily adult-onset despite the "adult form" label - 60% of the 50-patient
    cohort had early-childhood onset. Also recorded the absence of fixed
    interictal weakness, and the developmental (not merely bioenergetic) nature
    of the neonatal form's neuronal migration defects and cystic kidneys.

    Module conformance and treatment evidence. Added two
    metabolic_intoxication_decompensation conformance edges (Enzymatic Block on
    the impaired-LCFAO node, Acute Metabolic Decompensation on the myofiber
    injury node) with biological_scale tags. The high-carbohydrate/low-fat diet
    treatment had zero treatment-level evidence; added the MCT dosing and
    exercise-tolerance result from PMID:29502916.

    Tooling note. The three subtype MONDO CURIEs were rejected by the term
    validator as absent from the DiseaseOrSubtypeTerm and DiseaseTerm dynamic
    enum caches. This is a tooling gap, not a data error: the MONDO adapter in
    conf/oak_config.yaml is ols:mondo, and the OLS implementation raises
    NotImplementedError for ancestor queries, so the validator cannot re-derive
    reachability on a cache miss and can only consult the committed cache.
    Reachability was verified independently against sqlite:obo:mondo - all three
    terms are rdfs:subClassOf MONDO:0015515, which has MONDO:0000001 as an
    ancestor - and the three CURIEs were then appended to both enum caches in
    sorted position, matching what earlier subtype-adding PRs committed.
    check-enum-cache-offline passes on the result.

    Triheptanoin's therapeutic_agent binding was left on the broad CHEBI:17855
    triglyceride class rather than upgraded: CHEBI has no triheptanoin class, and
    the NCIT class NCIT:C166587 is not reachable from the ChemicalEntityTerm enum
    roots. preferred_term carries the specific agent identity, per the
    preferred_term/term guidance, and the limitation is recorded in the treatment
    notes rather than papered over with an unverifiable CURIE.

    Validation. Schema, term and reference validation all pass.

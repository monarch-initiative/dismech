  summary: Link catabolic and thermal triggers into the pathograph
  details: |
    Backfill for issue #8085. All four triggers are TRIGGERS, but they do not all act the same way, and the links record that. Prolonged exercise, fasting and cold exposure target the impaired long-chain fatty acid oxidation node, because each raises demand on the pathway the enzyme cannot service; cold is INDIRECT_KNOWN_INTERMEDIATES via thermogenesis while exercise and fasting are DIRECT. Fever and infection targets a different node entirely, the thermolability of the mutant enzyme, because a febrile core temperature destabilises the mutant protein rather than merely increasing demand. That item carries supports PARTIAL and evidence_source IN_VITRO, since the destabilisation at 40 and 45 degrees is an enzyme assay rather than a clinical measurement. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged from origin/main.

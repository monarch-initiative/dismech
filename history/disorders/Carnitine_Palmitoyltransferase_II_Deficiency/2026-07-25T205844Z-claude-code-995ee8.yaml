  summary: 'Address code review: unsupported frequency bands, misleading agent term,
    GeneReviews baseline'
  details: |
    Addresses the automated code review on PR #6988. All three blocking items
    were correct and are fixed; five non-blocking items are also addressed.

    Frequency-scoping fix completed (blocking 1). The reviewer's central point was
    fair: the PR argued that frequency bands must be correctly scoped and
    evidenced, then left five bands unsourced or contradicted. Applying
    docs/frequency-evidence-guidelines.md - omit rather than assert - four bands
    were removed and each carries a notes field saying why:
    - Elevated creatine kinase: VERY_FREQUENT (80-99%) was directly contradicted
      by its own evidence, 3 of 6 children with raised muscle enzymes (50%). The
      denominator is also too small to band and the figure is not CK-specific.
    - Acute kidney injury: OCCASIONAL (5-29%) sat against a source calling AKI
      "one of the most common complications" of massive rhabdomyolysis.
    - Cardiomyopathy: OCCASIONAL rested on a single case report of reduced
      ejection fraction, and would in any case misdescribe the severe forms where
      GeneReviews lists cardiomyopathy as a defining feature.
    - Episodic muscle stiffness: FREQUENT rested on one case report.
    Hypoketotic hypoglycemia was the structural instance of the same problem - a
    disease-level FREQUENT band with a free-text context string restricting it to
    the severe forms. Converted to a structured subtype reference (Severe
    infantile) with a note that it applies equally to the Lethal neonatal form,
    which the single-valued slot cannot express, and the band dropped.

    Triheptanoin agent binding removed rather than downgraded (blocking 2). The
    reviewer's argument is stronger than the one this PR made. CHEBI:17855
    triglyceride is not merely imprecise here - long-chain triglyceride is
    precisely the substrate class that CPT II management restricts, so binding
    the therapy to it inverts the clinical point. Dropped the term entirely,
    keeping preferred_term: triheptanoin, and rewrote the ontology note to record
    both that CHEBI has no triheptanoin class and that NCIT:C166587 was rejected
    by the term validator as unreachable from the ChemicalEntityTerm roots. This
    is the "prefer no term over a misleading one" rule; a CHEBI NTR would resolve
    it properly.

    GeneReviews mined (blocking 3). The chapter exists (PMID:20301431) and was
    entirely absent - no references block, no GeneReviews tag. Added both, and
    mined it for content the entry lacked. The most consequential addition is a
    safety point that was nowhere in the entry: general anaesthesia should
    proceed with caution because of possible risk of malignant hyperthermia or
    rhabdomyolysis, and genetic testing of at-risk asymptomatic siblings is
    advised BEFORE they undergo anaesthesia. Also added GeneReviews support for
    the core avoidance set and for hypoketotic hypoglycemia in the severe
    phenotypes.

    Non-blocking items addressed:
    - Bezafibrate's target_mechanisms description now opens by declaring itself a
      REFUTED MECHANISM retained as a negative result, and states explicitly that
      treatment_effect: MODULATES is used only because TreatmentEffectEnum offers
      no null value (INHIBITS/ACTIVATES/MODULATES/BYPASSES/RESTORES) - the REFUTE
      evidence items carry the finding. Changing the enum is a schema question
      beyond this PR.
    - PMID:40633017 retagged OTHER to HUMAN_CLINICAL.
    - Module conformance extended to the intermediate node: added
      metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and
      Energy Deficit on the LCAC calcium-dyshomeostasis node, so conformance now
      spans the full trigger-amplifier-effector chain rather than skipping the
      middle.

    Not changed: ORPHA_157.md remains cached but uncited. It carries no
    epidemiology or phenotype rows (only definition and cross-references), so
    there is nothing quotable in it; the three subtype ORPHA records are cited
    via mapping_source. Removing it would only cause it to be re-fetched.

    Validation. Schema, term and reference validation all pass.
